"summary":
  "ar": "هؤلاء هم المجنحون الضيقو الصدور العاريو الأكتاف من اللحم وخصوصاً من خلف المائلو\
    \ الأكتاف إلى قدام بارز أو كان للواحد منهم جناحين وكان كتفاه منقطعين عن العضد\
    \ وقدام وخلف، والطويلو الأعناق المائلوها إلى قدام قد برزت حلوقهم ووثبت، وهؤلاء\
    \ تكثر الرياح في صدورهم وما يليها والنفخ فيها لصغر صدورهم، وإن كان بهم مع ذلك\
    \ ضعف الأدمغة تقبل الفضول ولا تنضج الأغذية فقد تمت الشرائط وخصوصاً إن كانت أخلاطهم\
    \ حارة مرارية، والسحنات القابلة للسل بسرعة مع التجنح المذكور هي الزعر البيض إلى\
    \ الشقرة، وأيضاً الأبدان الصلبة المتكاثفة لما يعرض لها من انحراف العروق والمزاج\
    \ القابل لذلك من كان أبرد مزاجاً. والسن الذي يكثر فيه السل ما بين ثماني عشرة سنة\
    \ إلى حدود ثلاثين سنة وهي في البلاد الباردة أكثر لما يعرض فيها من انفتاق العروق\
    \ ونفث الدم أكثر والفصل الذي يكثر فيه ذلك الخريف {cite:canon-ibn-sina-print-v2\
    \ p.356}"
  "en": "These are the winged ones — narrow of chest, shoulders bare of flesh especially\
    \ behind, shoulders inclined forward and jutting, or one of them having two wing-blades\
    \ with the shoulders separated from the upper arm before and behind; the long-necked\
    \ whose necks incline forward with the throat jutting out and leaping. Winds abound\
    \ in their chests and what adjoins them, and blowing, for the smallness of their\
    \ chests; and if with that they have weakness of the brains accepting superfluities,\
    \ and their foods do not ripen, then the full list is complete — especially if\
    \ their humours are hot and bilious. The complexions that take consumption quickly,\
    \ together with the said wingedness, are the pale white tending to ruddy; also\
    \ the hard dense bodies, for the vessels' deviation that befalls them; and the\
    \ receptive temperament is whoever is colder of temperament. The age in which\
    \ consumption most abounds is from eighteen years to about thirty; it is commoner\
    \ in the cold countries, where the vessels' rupture and the spitting of blood\
    \ occur more; and the season in which it most abounds is autumn {cite:canon-ibn-sina-print-v2\
    \ p.356}"
  "fr": "Ce sont les « ailés » : étroits de poitrine, les épaules dénudées de chair, surtout par-derrière, les épaules penchées en avant et saillantes, ou l'un d'eux ayant deux omoplates en ailes, les épaules séparées du bras par-devant et par-derrière ; ceux au long cou dont le cou penche en avant, la gorge saillante et bondissante. Les vents abondent dans leur poitrine et ce qui la jouxte, ainsi que le gonflement, en raison de l'étroitesse de leur poitrine ; et si, avec cela, ils ont des cerveaux faibles qui reçoivent les superfluités, et que leurs aliments ne mûrissent pas, la liste complète est remplie, surtout si leurs humeurs sont chaudes et bilieuses. Les teints qui prennent rapidement la phtisie, avec ladite forme ailée, sont les blancs pâles tirant sur le roux ; aussi les corps durs et denses, en raison de la déviation des vaisseaux qui leur survient ; et le tempérament réceptif est celui de qui a le tempérament plus froid. L'âge où la phtisie abonde le plus va de dix-huit ans à environ trente ; elle est plus fréquente dans les pays froids, où la rupture des vaisseaux et le crachement de sang surviennent davantage ; et la saison où elle abonde le plus est l'automne {cite:canon-ibn-sina-print-v2 p.356}"
  "ur": "یہ وہ لوگ ہیں جن کے کندھے پرندے کے پروں جیسے ہوتے ہیں سینہ تنگ کندھے گوشت\
    \ سے خالی خاص طور پر پیچھے سے کندھے آگے جھکے ابھرے ہوئے یا دو جناح جیسے اور کندھے\
    \ بازو سے الگ آگے پیچھے اور لمبی گردن والے جن کی گردنیں آگے جھکی ہوتی ہیں اور\
    \ گلے نکلے ہوتے ہیں ان کے سینوں اور ملحقہ حصوں میں ہوا اور پھونکن زیادہ ہوتی ہے\
    \ سینے کے چھوٹے ہونے سے اور اگر ساتھ دماغ کی کمزوری ہو جو فضولات قبول کرے اور\
    \ غذا نہ پچے تو فہرست پوری خاص طور پر اگر اخلاط گرم اور مراری ہوں اور وہ رنگ جو\
    \ مذکورہ پروں والی حالت کے ساتھ سل جلد قبول کرتے ہیں زردی مائل سفید سے سرخی مائل\
    \ اور سخت گاڑھے جسم بھی جن میں عروق کا میلان ہوتا ہے اور قبول کرنے والا مزاج وہ\
    \ ہے جو زیادہ سرد مزاج ہو۔ جس عمر میں سل زیادہ ہوتا ہے وہ اٹھارہ برس سے تیس برس\
    \ کے قریب ہے اور سرد ملکوں میں زیادہ کیونکہ وہاں رگوں کا پھٹنا اور خون کا نفث\
    \ زیادہ ہوتا ہے اور جس موسم میں زیادہ ہوتا ہے وہ خزاں ہے {cite:canon-ibn-sina-print-v2\
    \ p.356}"
  "es": "Estos son los alados: de pecho estrecho, hombros desnudos de carne especialmente en la parte posterior, hombros inclinados hacia adelante y sobresalientes, o uno de ellos con dos alas con los hombros separados del brazo superior por delante y por detrás; los de cuello largo cuyos cuellos se inclinan hacia adelante con la garganta sobresaliendo y saltando. Abundan los vientos en sus pechos y lo que les une, y soplan, por la pequeñez de sus pechos; y si con eso tienen debilidad de los cerebros que aceptan superfluidades, y sus alimentos no maduran, entonces la lista completa está completa, especialmente si sus humores son calientes y biliosos. Las complexiones que contraen la tisis rápidamente, junto con la mencionada alación, son las blancas pálidas que tienden a enrojecerse; también los cuerpos duros y densos, por la desviación de los vasos que les sucede; y el temperamento receptivo es el que es más frío que el temperamento. La edad en la que la tisis abunda más es de los dieciocho a los treinta años aproximadamente; es más común en los países fríos, donde la ruptura de los vasos y la escupir sangre ocurren más; y la estación en la que más abunda es el otoño {cite:canon-ibn-sina-print-v2 p.356}"
  "tr": "Bunlar, özellikle eğik omuzların arkasından öne doğru çıkıntılı olan, dar göğüslü ve çıplak etli kanatlı olanlar veya üst koldan ve ön ile arkadan omuzları ayrılmış iki kanatlı olanlardır. Öne eğik uzun boyunların boğazları çıkıntılı ve sabit olur. Bu bireylerin göğüslerinde ve ötesinde bolca rüzgar vardır ve küçük göğüsleri nedeniyle şişirilmiştir. Merakı tolere eden zayıf beyinlere sahip olmalarına ve yiyeceklerin olgunlaşmamasına rağmen, özellikle karışımları sıcak ve acı olduğunda bantlar oluşmuştur. Bahsedilen kanatlama eğilimleri beyazdan sarıya kadar saçlar ile damar sapması ve soğukkanlı mizaç nedeniyle sert ve yoğun vücutlardır. Tüberkülozun en yaygın olduğu yaş on sekiz ile otuz yaşa kadar olup, damar fıtıkları ve hemoptiziye daha fazla maruz kaldığı için soğuk ülkelerde daha yaygındır; en sık görülen mevsim ise sonbahardır {cite:canon-ibn-sina-print-v2 s.356}"
  "id": "Ini termasuk mereka yang memiliki sayap dada sempit dan berdaging telanjang yang menonjol ke depan dari belakang bahu miring, atau mereka yang memiliki dua sayap dengan bahu terpisah dari lengan atas dan depan serta belakang. Tenggorokan leher panjang yang condong ke depan menonjol dan tetap. Individu ini memiliki banyak angin di dan luar dada mereka dan mengembang karena payudara mereka kecil. Meskipun memiliki otak yang lemah dan mentolerir rasa ingin tahu serta makanan yang belum dewasa, pita telah terbentuk, terutama ketika campuran itu panas dan pahit. Kecenderungan bersayap yang disebutkan adalah tubuh yang keras dan padat karena rambut bervariasi dari putih hingga kuning, penyimpangan vaskular, dan temperamen berdarah dingin. Usia tuberkulosis yang paling umum adalah antara delapan belas hingga tiga puluh tahun, dan lebih umum di negara dingin karena paparan hernia vaskular dan hemopatis yang lebih besar; Musim yang paling umum adalah musim gugur {cite:canon-ibn-sina-print-v2 hlm.356}"
