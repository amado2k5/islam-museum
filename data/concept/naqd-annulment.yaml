class: concept
kind: legal
label: { ar: "النَّقْض", en: "Naqd (annulment and breaking)", ur: "نقض (توڑنا، کالعدم کرنا)" }
summary:
  ar: "النقض في اللغة إفساد ما أُبرم، وفي الأصول قدح في العلة بتخلف الحكم عن الوصف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978} ومن صوره نقض الطهارة، ونقض العهود بالهدنة والأمان وعقد الذمة، ونقض الاجتهاد، ونقض القضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15979} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15981} والأصل أن الحكم لا ينقض إلا إذا خالف نصاً من كتاب أو سنة أو إجماعاً، وزاد المالكية والشافعية القياس الجلي والقواعد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15984} وما وافق الصواب أو كان محل اجتهاد لا ينقض، وفيما يختلف فيه الفقهاء تفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15987} وينقض حكم القاضي غير الصالح والجائر على تفصيل، وينقض حكم شهود الزور أو ما بان فيه فسق الشهود، ولا ينقض حكم برجوع الشهود بعد الاستيفاء في المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15996} وينقض القاضي حكم نفسه إذا تبين له الخطأ، ولا يتتبع أحكام غيره إلا عند المخالفة الصريحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15999} وفي حق الله يحكم القاضي بالنقض من غير طلب، وفي حق الآدمي لا بد من مطالبة صاحبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16000}"
  en: "Naqd, in the lexicon, is undoing what was tied; in the usul sense it is a flaw in a cause when the ruling does not follow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978} Its forms include breaking ablution, breaking truces, safe-conducts and the dhimma contract, annulling reasoning, and annulling a judgment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15979} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15981} A judgment is annulled only if it contradicts a text of the Qur'an or Sunna or a consensus; the Malikis and Shafi'is add a clear analogy and established principles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15984} A judgment that is correct or falls in an area of ijtihad is not annulled, and the schools differ on the cases in between. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15987} A ruling by an unfit or tyrannical judge is annulled in whole or in part, by the schools' differing views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15988} A ruling based on false witnesses, or on witnesses later shown to be unfit, is treated differently; testimony withdrawn after execution does not annul a money ruling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15996} A judge annuls his own ruling if he sees an error, and does not search through another judge's rulings except for a plain contradiction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15999} A judgment on a right of God may be annulled without a claim; one on a right of a person needs the claimant's demand. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16000}"
  ur: "نقض لغت میں کسی مضبوط بندھی ہوئی چیز کو توڑنے کو کہتے ہیں، اور اصول میں علت پر اعتراض کو کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978} فیصلے کا نقض صرف اس وقت ہوتا ہے جب وہ قرآن، سنت یا اجماع کے خلاف ہو، اور مالکیہ و شافعیہ قیاس جلی کو بھی شامل کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15984} اجتہادی فیصلہ عام طور پر کالعدم نہیں ہوتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15985} ناأہل یا ظالم قاضی کے فیصلوں پر تفصیل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15988} حق اللہ میں نقض طلب کے بغیر ہو سکتا ہے، اور حق آدمی میں صاحب حق کی طلب ضروری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16000}"
