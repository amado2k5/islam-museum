id: concept/naqd-annulment
class: concept
kind: legal
label: { ar: "النَّقْض", en: "Naqd (annulment and breaking)", ur: "نقض ⁦(توڑنا، کالعدم کرنا)⁩", es: "Naqd (anulación y ruptura)", fr: "Naqd (annulation et rupture)", tr: "Yargılama", id: "kasasi" }
summary:
  ar: "النقض في اللغة إفساد ما أُبرم، وفي الأصول قدح في العلة بتخلف الحكم عن الوصف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978} ومن صوره نقض الطهارة، ونقض العهود بالهدنة والأمان وعقد الذمة، ونقض الاجتهاد، ونقض القضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15979} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15981} والأصل أن الحكم لا ينقض إلا إذا خالف نصاً من كتاب أو سنة أو إجماعاً، وزاد المالكية والشافعية القياس الجلي والقواعد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15984} وما وافق الصواب أو كان محل اجتهاد لا ينقض، وفيما يختلف فيه الفقهاء تفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15987} وينقض حكم القاضي غير الصالح والجائر على تفصيل، وينقض حكم شهود الزور أو ما بان فيه فسق الشهود، ولا ينقض حكم برجوع الشهود بعد الاستيفاء في المال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15996} وينقض القاضي حكم نفسه إذا تبين له الخطأ، ولا يتتبع أحكام غيره إلا عند المخالفة الصريحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15999} وفي حق الله يحكم القاضي بالنقض من غير طلب، وفي حق الآدمي لا بد من مطالبة صاحبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16000}"
  en: "Naqd, in the lexicon, is undoing what was tied; in the usul sense it is a flaw in a cause when the ruling does not follow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978} Its forms include breaking ablution, breaking truces, safe-conducts and the dhimma contract, annulling reasoning, and annulling a judgment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15979} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15981} A judgment is annulled only if it contradicts a text of the Qur'an or Sunna or a consensus; the Malikis and Shafi'is add a clear analogy and established principles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15984} A judgment that is correct or falls in an area of ijtihad is not annulled, and the schools differ on the cases in between. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15987} A ruling by an unfit or tyrannical judge is annulled in whole or in part, by the schools' differing views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15988} A ruling based on false witnesses, or on witnesses later shown to be unfit, is treated differently; testimony withdrawn after execution does not annul a money ruling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15996} A judge annuls his own ruling if he sees an error, and does not search through another judge's rulings except for a plain contradiction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15999} A judgment on a right of God may be annulled without a claim; one on a right of a person needs the claimant's demand. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16000}"
  ur: "نقض لغت میں کسی مضبوط بندھی ہوئی چیز کو توڑنے کو کہتے ہیں، اور اصول میں علت پر اعتراض کو کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978} فیصلے کا نقض صرف اس وقت ہوتا ہے جب وہ قرآن، سنت یا اجماع کے خلاف ہو، اور مالکیہ و شافعیہ قیاس جلی کو بھی شامل کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15984} اجتہادی فیصلہ عام طور پر کالعدم نہیں ہوتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15985} ناأہل یا ظالم قاضی کے فیصلوں پر تفصیل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15988} حق اللہ میں نقض طلب کے بغیر ہو سکتا ہے، اور حق آدمی میں صاحب حق کی طلب ضروری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16000}"
  es: "Naqd, en el léxico, es deshacer lo que estaba atado; en el sentido habitual es un defecto en una causa cuando el fallo no la sigue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978} Sus formas incluyen romper la ablución, romper treguas, salvoconducto y la cuestión del contrato, anular el razonamiento y anular un fallo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15979} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15981} Un fallo se anula solo si contradice un texto del Corán o la Sunnah o un consenso; los malikíes y shafiíes añaden una analogía clara y principios establecidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15984} Un juicio que es correcto o cae en un área de ijtihad no es anulado, y las escuelas difieren en los casos intermedios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15987} Un fallo de un juez incompetente o tiránico es anulado en su totalidad o en parte, por las diferentes opiniones de las escuelas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15988} Un fallo basado en testigos falsos, o en testigos que luego se demuestra que no son competentes, se trata de manera diferente; El testimonio retirado después de la ejecución no anula una sentencia monetaria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15996} Un juez anula su propia sentencia si ve un error, y no busca en las sentencias de otro juez excepto una clara contradicción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15999} Una sentencia sobre un derecho de Dios puede ser anulada sin una demanda; una sobre un derecho de una persona necesita la demanda del demandante. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16000}"
  fr: "Le terme « naqd », dans le lexique, désigne l'action de défaire ce qui était lié; au sens courant, il s'agit d'un vice de procédure lorsque la décision ne s'y conforme pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978} Ses manifestations incluent la violation des ablutions, la rupture des trêves, des sauf-conduits et des contrats, l'annulation d'un raisonnement et l'annulation d'un jugement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15979} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15981} Un jugement n'est annulé que s'il contredit un verset du Coran ou de la Sunna, ou un consensus; les écoles malikite et chaféite y ajoutent une analogie claire et des principes établis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15984} Un jugement correct ou relevant de l'ijtihad n'est pas annulé, et les écoles divergent sur les cas intermédiaires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15987} Une décision rendue par un juge incompétent ou tyrannique est annulée en tout ou en partie, selon les divergences d'opinions des écoles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15988} Une décision fondée sur de faux témoins, ou sur des témoins dont l'incompétence est ultérieurement démontrée, est traitée différemment; un témoignage retiré après l'exécution n'annule pas une décision pécuniaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15996} Un juge annule sa propre décision s'il y constate une erreur et ne consulte pas les décisions d'un autre juge, sauf en cas de contradiction manifeste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15999} Un jugement portant sur un droit divin peut être annulé sans demande; un jugement portant sur un droit personnel requiert la demande du demandeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16000}"
  tr: "Dil açısından iptal, tespit edilenin geçersiz kılınmasıdır ve ilkelerin ilkelerinde, kararın bunu tanımlamaması nedeniyle sebepte bir kusurdur. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.15978} Biçimleri arasında saflığın iptali, ateşkes ve güvenlik yoluyla antlaşmaların ihlali, güven sözleşmesi, ijtihadın iptali ve hükmün iptali yer alır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15979} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15981} Temel ilke, hükmün Kitap, Sünnet veya uzlaşma metniyle çelişmedikçe bozulmamasıdır ve Malikiler ile Şafi'ler açık benzetme ve kurallar eklemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15984} Doğru görüşle uyumlu olan veya ijtihad'a tabi olan şey geçersiz değildir ve bu konuda hukukçular arasında ayrıntılı bir açıklama bulunmaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15987} Haksız veya haksız bir yargıcın kararı ayrıntılı olarak bozulur, yanlış tanıkların kararı veya tanıkların ahlaksızlığında görülen kararlar bozulur ve mülkün geri alınmasından sonra tanıkların geri alma kararı bozulmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15988} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15996} Hakim, hata kendisine anlaşılırsa kendi kararını bozar ve sadece açık anlaşmazlık durumunda başkalarının kararlarını takip eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15999} Ve Allah aşkına, hakim istek olmaksızın yargılama yoluyla karar verir ve bir kişi için mülk sahibi hesap vermelidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16000}"
  id: "Dalam bahasa, pembatalan adalah pembatalan atas apa yang telah ditetapkan, dan dalam prinsip-prinsip tersebut, pembatalan adalah cacat dalam sebab yang tidak dijelaskan oleh putusan tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15978} Di antara bentuknya adalah pembatalan kemurnian, pelanggaran perjanjian melalui gencatan senjata dan keamanan, kontrak kepercayaan, pembatalan ijtihad, dan pembatalan putusan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15979} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15980} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15981} Prinsip dasarnya adalah bahwa putusan tidak dibatalkan kecuali bertentangan dengan teks dari Kitab, Sunnah, atau konsensus, dan Malikis serta Shafi'i telah menambahkan analogi dan aturan yang eksplisit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15982} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15984} Apa yang sesuai dengan pandangan yang benar atau tunduk pada ijtihad tidak sah, dan ada penjelasan rinci di antara para ahli hukum mengenai hal ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15985} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15987} Putusan hakim yang tidak adil atau tidak adil dibatalkan secara rinci, putusan saksi palsu atau apa yang terlihat dari ketidakmoralan saksi dibatalkan, dan putusan saksi untuk menarik kembali setelah properti dikembalikan tidak dibatalkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15988} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.15994} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15995} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15996} Hakim membatalkan putusannya sendiri jika kesalahannya menjadi jelas baginya, dan ia hanya mengejar putusan orang lain dalam kasus perbedaan pendapat yang jelas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15999} Dan demi Tuhan, hakim memutuskan dengan kasasi tanpa permintaan, dan untuk seseorang, pemiliknya harus bertanggung jawab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16000}"
