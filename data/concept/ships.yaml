summary:
  ar: "الفلك تجري في البحر بفضل الله ليُريكم من آياته، وسخر لكم الفلك أن تجري في البحر بأمره ولتبتغوا من فضله، وأنجى نوحاً ومن معه في الفلك ذات الألواح والدسر."
  en: "The ship runs upon the sea by God's bounty to show you His signs; He made the ships serviceable to you that they run by His command and you seek His bounty; and He saved Noah and those with him in the vessel of planks and nails."
  ur: "کشتی اللہ کے فضل سے سمندر میں چلتی ہے تاکہ تمہیں اپنی نشانیاں دکھائے؛ اس نے جہاز تمہارے کام دیے کہ وہ اس کے حکم سے چلیں اور تم اس کا فضل تلاش کرو؛ اور نوح اور ان کے ساتھیوں کو تختوں اور میخوں والی کشتی میں بچایا۔"
  es: "El barco navega sobre el mar por la gracia de Dios para mostraros Sus señales; Él hizo que los barcos os fueran útiles para que navegaran según Su mandato y buscáis Su gracia; y salvó a Noé y a los que estaban con él en la embarcación de tablones y clavos."
  fr: "Le navire navigue sur la mer par la grâce de Dieu pour vous montrer Ses signes; Il a fait en sorte que les navires vous soient utiles, qu'ils naviguent par Son commandement et que vous recherchiez Sa grâce; et Il a sauvé Noé et ceux qui étaient avec lui dans l'embarcation de planches et de clous."
  tr: "Gemiler, Allah'ın lütfuyla denizde seyir ve size O'nun işaretlerini göstermek için gemiyi size boyun eğdirmiştir ki O'nun emriyle denizde yelken açasınız ve O'nun lütfunu arayasınız. Nuh'u ve onunla birlikte olan tabletler ve Durs'taki gemide olanları kurtardı."
  id: "Kapal-kapal berlayar di laut dengan rahmat Allah untuk menunjukkan tanda-tanda-Nya, dan Dia telah menjadikan bahtera itu tunduk kepadamu agar kamu dapat berlayar di laut atas perintah-Nya dan mencari rahmat-Nya. Dia menyelamatkan Nuh dan orang-orang yang bersamanya di bahtera dengan lempengan dan Dur."
