summary:
  ar: "الفلك تجري في البحر بفضل الله ليُريكم من آياته، وسخر لكم الفلك أن تجري في البحر بأمره ولتبتغوا من فضله، وأنجى نوحاً ومن معه في الفلك ذات الألواح والدسر."
  en: "The ship runs upon the sea by God's bounty to show you His signs; He made the ships serviceable to you that they run by His command and you seek His bounty; and He saved Noah and those with him in the vessel of planks and nails."
