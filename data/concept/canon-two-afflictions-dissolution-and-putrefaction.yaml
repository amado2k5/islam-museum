id: concept/canon-two-afflictions-dissolution-and-putrefaction
class: concept
kind: scientific
label: { ar: "آفتا التحلل والتعفن", en: "The two afflictions of the body: dissolution and putrefaction", ur: "بدن کی دو آفتیں: تحلیل اور عفونت" }
summary:
  ar: "يقرر ابن سينا أن الأبدان معرضة لنوعين من الآفات، يخص كل منهما سبب من داخل وسبب من خارج: تحلل الرطوبة التي خلقنا منها بالتدريج، وتعفنها وفسادها وتغيرها عن الصلوح لإمداد الحياة، ثم يعود العفن إلى التحلل {cite:canon-ibn-sina-print-v1 pp.200-201}."
  en: "Ibn Sina holds that bodies are exposed to two kinds of affliction, each with a cause from within and a cause from without: the gradual dissolving of the moisture we are made from, and its putrefaction, corruption and change from fitness to supply life, which in the end also ends in dissolving {cite:canon-ibn-sina-print-v1 pp.200-201}."
