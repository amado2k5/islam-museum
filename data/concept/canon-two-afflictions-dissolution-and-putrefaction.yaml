id: concept/canon-two-afflictions-dissolution-and-putrefaction
class: concept
kind: scientific
label: { ar: "آفتا التحلل والتعفن", en: "The two afflictions of the body: dissolution and putrefaction", ur: "بدن کی دو آفتیں: تحلیل اور عفونت", es: "Las dos aflicciones del cuerpo: disolución y putrefacción", fr: "Les deux fléaux du corps: la dissolution et la putréfaction", tr: "Çürüme ve çürümenin vebası", id: "Wabah pembusukan dan pembusukan" }
summary:
  ar: "يقرر ابن سينا أن الأبدان معرضة لنوعين من الآفات، يخص كل منهما سبب من داخل وسبب من خارج: تحلل الرطوبة التي خلقنا منها بالتدريج، وتعفنها وفسادها وتغيرها عن الصلوح لإمداد الحياة، ثم يعود العفن إلى التحلل {cite:canon-ibn-sina-print-v1 pp.200-201}."
  en: "Ibn Sina holds that bodies are exposed to two kinds of affliction, each with a cause from within and a cause from without: the gradual dissolving of the moisture we are made from, and its putrefaction, corruption and change from fitness to supply life, which in the end also ends in dissolving {cite:canon-ibn-sina-print-v1 pp.200-201}."
  es: "Ibn Sina sostiene que los cuerpos están expuestos a dos tipos de aflicción, cada uno con una causa interna y una causa externa: la disolución gradual de la humedad de la que estamos hechos, y su putrefacción, corrupción y cambio de aptitud para suministrar vida, que al final también termina en disolución {cite:canon-ibn-sina-print-v1 pp.200-201}."
  fr: "Ibn Sina soutient que les corps sont exposés à deux sortes d'afflictions, chacune ayant une cause interne et une cause externe: la dissolution progressive de l'humidité dont nous sommes faits, et sa putréfaction, sa corruption et son changement de capacité à fournir la vie, ce qui finit également par se dissoudre {cite:canon-ibn-sina-print-v1 pp.200-201}."
  ur: "ابن سینا کا خیال ہے کہ جسم دو طرح کے مصائب کا شکار ہوتے ہیں جن میں سے ہر ایک کی وجہ اندر سے ہوتی ہے اور ایک وجہ باہر سے ہوتی ہے: جس نمی سے ہم بنتے ہیں اس کا بتدریج پگھل جانا، اور اس کی خرابی، خرابی اور تندرستی سے زندگی کی فراہمی میں تبدیلی، جو آخر کار تحلیل ہونے پر بھی ختم ہوتی ہے۔"
  tr: "İbn Sina, bedenlerin iki tür zararlıya duyarlı olduğunu, her birinin içsel ve dışsal bir nedenle ilişkili olduğunu belirtir: yaratıldığımız nemin kademeli olarak çürümesi, çürümesi ve vücut yaşam sağlamak için değişmesi, ardından çürümenin tekrar çürümeye dönmesi {cite:canon-ibn-sina-print-v1 s.200-201}."
  id: "Ibn Sina menyatakan bahwa tubuh rentan terhadap dua jenis hama, masing-masing terkait dengan penyebab internal dan penyebab eksternal: dekomposisi bertahap kelembapan dari mana kita dibuat, pembusuhan, pembusukan, dan perubahan tubuh untuk memasok kehidupan, kemudian pembusukan kembali membusuk {cite:canon-ibn-sina-print-v1 hlm.200-201}."
