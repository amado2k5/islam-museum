  en: "Buwsir (bear's ears)"
  fr: "Buwsir (oreilles d’ours)"
  ur: "بوصیر ⁦(آذان الدب)⁩"
  es: "Buwsir (orejas de oso)"
summary:
  ar: "حشيشة محلّلة يُنتفع بطبيخها في الأورام والجراح وأوجاع الأسنان والرمد الحار والسعال المزمن، ويحمّر زهرها البري الشعر {cite:canon-ibn-sina-print-v1 p.401}."
  en: "A dissolving herb. Its decoction is used for swellings, wounds, toothache, hot ophthalmia and chronic cough, and the wild kind with its golden flower is said to redden hair {cite:canon-ibn-sina-print-v1 p.401}."
  fr: "Herbe résolutive. Selon le livre, sa décoction serait employée contre gonflements, plaies, douleurs dentaires, ophtalmie chaude et toux chronique ; l’espèce sauvage à fleur dorée rougirait les cheveux {cite:canon-ibn-sina-print-v1 p.401}."
  ur: "ایک تحلیل کرنے والی جڑی بوٹی۔ اس کا جوشاندہ ورموں، زخموں، دانت کے درد، گرم آشوبِ چشم اور پرانی کھانسی میں کام آتا ہے، اور اس کی جنگلی قسم، جس کے پھول سنہری ہیں، بالوں کو سرخ کرتی ہے {cite:canon-ibn-sina-print-v1 p.401}۔"
  es: "Hierba disolvente. Su decocción se usa para hinchazones, heridas, dolor de muelas, oftalmía caliente y tos crónica, y se dice que la variedad silvestre con su flor dorada enrojece el cabello {cite:canon-ibn-sina-print-v1 p.401}."
