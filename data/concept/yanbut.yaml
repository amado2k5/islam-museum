summary:
  ar: "هو الخرنوب النبطي؛ بارد حار قليلاً يابس في الثانية، قوته مقيئة بلا لذع، وطبيخه يقتل البراغيث، ويذكر الكتاب أنه يمنع الخلفة."
  en: "The Nabataean carob. Cold and slightly warm, dry in the second degree, it is emetic without a sting, its decoction kills fleas, and the book says it prevents conception."
  ur: "یہ نبطی خرنوب ہے؛ ٹھنڈا اور کچھ گرم، دوسرے درجے میں خشک، جلن کے بغیر قے لانے والا، اس کا جوشاندہ پسو مارتا ہے، اور کتاب کے مطابق یہ حمل سے روکتا ہے۔"
  es: "El algarrobo nabateo. Frío y ligeramente tibio, seco en segundo grado, es emético sin picar, su decocción mata las pulgas y el libro dice que previene la concepción."
  fr: "La caroube nabatéenne. Froide et légèrement chaude, sèche au deuxième degré, elle est émétique sans piqûre, sa décoction tue les puces, et le livre dit qu'elle empêche la conception."
  tr: "Bu, Nabatean keçiboynuzudur; soğuk, hafif sıcak, ikinci derecede kurudur. Yakıcı olmayan, kusturucu bir etkisi vardır ve kaynatıldığında pireleri öldürür. Kitapta, yavruların oluşmasını engellediğinden bahsediliyor."
  id: "Ini adalah pohon karob Nabatea; dingin, agak panas, kering pada tingkat kedua. Khasiatnya adalah emetik tanpa menimbulkan rasa perih, dan rebusannya membunuh kutu. Buku itu menyebutkan bahwa tanaman ini mencegah kehamilan."
