id: concept/ethics-of-the-new-community
class: concept
kind: ethical
label: { ar: "آداب المجتمع الجديد في المدينة", en: "The ethics of the new community in Medina", es: "La ética de la nueva comunidad en Medina", fr: "L'éthique de la nouvelle communauté de Médine", ur: "مدینہ میں نئی کمیونٹی کی اخلاقیات" }
summary:
  ar: "الآداب التي كان النبي يعلمها أصحابه في المدينة من إفشاء السلام وإطعام الطعام وصلة الأرحام وحسن الجوار والتعاطف والإحسان إلى الضعفاء وإماطة الأذى عن الطريق، كما يرويها الرحيق المختوم عن الأحاديث الصحيحة."
  en: "The manners the Prophet taught his companions in Medina: spreading the greeting of peace, feeding people, keeping kinship ties, good neighbourliness, mutual compassion, charity to the weak and clearing the road of harm, as al-Raheeq al-Makhtum reports them from the sound hadiths."
  es: "Las buenas maneras que el Profeta enseñó a sus compañeros en Medina: difundir el saludo de paz, alimentar a la gente, mantener los lazos de parentesco, la buena vecindad, la compasión mutua, la caridad con los débiles y despejar el camino de peligros, tal como al-Raheeq al-Makhtum las relata en los hadices auténticos."
  fr: "Les bonnes manières que le Prophète a enseignées à ses compagnons à Médine: répandre le salut de paix, nourrir les gens, maintenir les liens de parenté, être bon voisin, faire preuve de compassion mutuelle, être charitable envers les faibles et dégager le chemin du danger, telles que rapportées par al-Raheeq al-Makhtum d’après des hadiths authentiques."
  ur: "مدینہ میں رسول اللہ نے اپنے صحابہ کو جو آداب سکھائے: سلام پھیلانا، لوگوں کو کھانا کھلانا، رشتہ داریاں قائم رکھنا، اچھا پڑوس، باہمی ہمدردی، کمزوروں کے لیے خیرات کرنا اور نقصان کے راستے کو صاف کرنا، جیسا کہ الرحیق المختوم صحیح احادیث سے نقل کرتے ہیں۔"
