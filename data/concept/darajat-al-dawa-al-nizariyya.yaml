label:
  ar: درجات استمالة المريد في الدعوة النزارية
  en: The Nizari da'wa's graded recruitment
summary:
  ar: "الأسلحة التي وصفت بها الدعوة النزارية تسليح دعاتها لاستمالة المدعوين: التفرس وهو الاستبطان لإدراك مكنونات النفس وقوة الإرادة، ثم التأنيس ببعث الأمن في نفوس المدعوين وإشباع ميولهم، ثم التشكيك وهو أخطر الخطوات بزعزعة عقيدة المريد، ثم التعليق بتركه متأرجحاً مشوقاً إلى معرفة المذهب، ثم التدليس بالتمويه والادعاءات الكاذبة، ثم التأسيس بتثبيت المعلومات حتى تستقر في ذهنه، ثم الخلع بإقصائه عن المذاهب السنية نهائياً بإسقاط الفرائض بالتأويل غير المشروع."
  en: "The arsenal the Nizari da'wa gave its da'is to win recruits: tafris — 'reading' the soul's depths and the will's pliability; ta'nis — kindling trust and feeding each bent; tashkik — the boldest step, unsettling the recruit's creed; ta'liq — leaving him suspended and yearning for the doctrine; tadlis — deceit and false claims to whet him; ta'sis — fixing the taught 'facts' until they settle in his mind; khal' — casting off the Sunni rites for good by illicit ta'wil."
