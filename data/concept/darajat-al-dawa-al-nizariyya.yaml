id: concept/darajat-al-dawa-al-nizariyya
class: concept
kind: doctrine
label:
  ar: درجات استمالة المريد في الدعوة النزارية
  en: The Nizari da'wa's graded recruitment
  es: "El reclutamiento gradual de la da'wa Nizari"
  fr: "Le recrutement progressif de la da'wa Nizari"
  ur: "نظری دعوت کی درجہ بندی کی بھرتی"
  tr: "Nizari Çağrısında Öğrenciyi Arama Dereceleri"
  id: "Tingkat Mencari Murid dalam Panggilan Nizari"
summary:
  ar: "الأسلحة التي وصفت بها الدعوة النزارية تسليح دعاتها لاستمالة المدعوين: التفرس وهو الاستبطان لإدراك مكنونات النفس وقوة الإرادة، ثم التأنيس ببعث الأمن في نفوس المدعوين وإشباع ميولهم، ثم التشكيك وهو أخطر الخطوات بزعزعة عقيدة المريد، ثم التعليق بتركه متأرجحاً مشوقاً إلى معرفة المذهب، ثم التدليس بالتمويه والادعاءات الكاذبة، ثم التأسيس بتثبيت المعلومات حتى تستقر في ذهنه، ثم الخلع بإقصائه عن المذاهب السنية نهائياً بإسقاط الفرائض بالتأويل غير المشروع."
  en: "The arsenal the Nizari da'wa gave its da'is to win recruits: tafris — 'reading' the soul's depths and the will's pliability; ta'nis — kindling trust and feeding each bent; tashkik — the boldest step, unsettling the recruit's creed; ta'liq — leaving him suspended and yearning for the doctrine; tadlis — deceit and false claims to whet him; ta'sis — fixing the taught 'facts' until they settle in his mind; khal' — casting off the Sunni rites for good by illicit ta'wil."
  es: "El arsenal que la da'wa nizari dio a sus da'is para ganar reclutas: tafris — 'leer' las profundidades del alma y la maleabilidad de la voluntad; ta'nis — encender la confianza y alimentar cada inclinación; tashkik — el paso más audaz, perturbar el credo del recluta; ta'liq — dejarlo suspendido y anhelando la doctrina; tadlis — engaño y falsas afirmaciones para avivarlo; ta'sis — fijar los 'hechos' enseñados hasta que se asienten en su mente; khal' — desechar los ritos sunitas para siempre mediante ta'wil ilícito."
  fr: "L'arsenal que la da'wa Nizari donnait à ses da'is pour gagner des recrues: tafris — « lire » les profondeurs de l'âme et la malléabilité de la volonté; ta'nis — allumer la confiance et nourrir chaque penchant; tashkik — le pas le plus audacieux, déstabilisant la croyance de la recrue; ta'liq — le laisser suspendu et aspirant à la doctrine; tadlis — la tromperie et les fausses affirmations pour l'aiguiser; ta'sis — fixer les « faits » enseignés jusqu'à ce qu'ils s'installent dans son esprit; khal' — rejeter définitivement les rites sunnites par un ta'wil illicite."
  ur: "نظری دعوے کے ہتھیاروں نے بھرتی کرنے والوں کو جیتنے کے لیے اپنی دعوت دی: تفریس - روح کی گہرائیوں اور مرضی کی لچک کو 'پڑھنا'؛ ta'nis - اعتماد کو جلانا اور ہر جھکے ہوئے کو کھانا کھلانا؛ تشکیک - سب سے جرات مندانہ قدم، بھرتی کرنے والے کے مسلک کو پریشان کرنے والا؛ ta'liq - اسے معطل اور نظریے کے لئے تڑپ چھوڑ کر؛ تدلیس - دھوکہ دہی اور اس کے بارے میں جھوٹے دعوے؛ ta'sis - سکھائے گئے 'حقائق' کو درست کرنا جب تک کہ وہ اس کے ذہن میں نہ آجائیں۔ khal' - ناجائز تعویل کے ذریعہ نیکی کے لئے سنی رسموں کو ترک کرنا۔"
  tr: "Nizari çağrısında anlatılan silahlar, vaizlerini davetlileri kazanmak için silahlandırmaktır: içsel sorgulama, yani iç benliği ve iradesini anlamak için yapılan içsel sorgulama; sonra davetlilerin ruhlarına güvenlik aşılayarak ve eğilimlerini tatmin ederek aşinalık; sonra şüphe etmek, ki bu müridin inancını sarsmak için en tehlikeli adımdır; sonra onu okulu öğrenmeye hevesli ve sallanırken bırakarak yorum yapmak; sonra aldatma ve sahte iddialarla aldatma; sonra bilgiyi zihninde oturana kadar sabitleyerek temeli kurmak; sonra meşru olmayan yorumlarla yükümlülükleri terk ederek onu tamamen Sünni okullarından dışlayarak görevden almak."
  id: "Senjata yang dijelaskan oleh panggilan Nizari adalah mempersenjatai para pengkhotbahnya untuk memenangkan hati para tamu: introspeksi, yaitu introspeksi untuk memahami diri batin dan kekuatan kemauan; kemudian pengenalan dengan menanamkan rasa aman dalam jiwa para undangan dan memuaskan kecenderungan mereka; kemudian meragukan, yang merupakan langkah paling berbahaya untuk mengguncang ajaran murid; kemudian mengomentari dengan membiarkan dia berayun dan ingin tahu aliran itu; kemudian penipuan dengan penipuan dan klaim palsu; kemudian membangun fondasi dengan menetapkan informasi sampai benar-benar menetap di pikirannya; kemudian menggulingkannya dengan sepenuhnya mengecualikannya dari aliran Sunni dengan meninggalkan kewajiban melalui interpretasi yang tidak sah."
