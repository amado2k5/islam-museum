  fr: "Khaniq al-dhi'b"
summary:
  ar: "خانق الذئب في الكتاب دواء يخنق الذئاب والخنازير والكلاب، معفن جدا لا يستعمل لا داخلا ولا خارجا، وهو قاتل للذئاب، ويحيل الكتاب إلى ما قيل فيه في باب القاف {cite:canon-ibn-sina-print-v1 p.711}"
  en: "Khaniq al-dhi'b is in the book a drug that chokes wolves, pigs and dogs, very putrefying and not used either inside or outside, and it kills wolves; the book refers to what was said of it in the chapter of the letter qaf {cite:canon-ibn-sina-print-v1 p.711}"
  ur: "خانق الذئب کتاب میں ایک دوا ہے جو بھیڑیوں، سوروں اور کتوں کا گلا گھونٹتی ہے، بہت سڑانے والی ہے، نہ اندر استعمال ہوتی ہے نہ باہر، اور بھیڑیوں کو مارتی ہے؛ کتاب اس کے بارے میں قاف کے باب میں کہی گئی بات کا حوالہ دیتی ہے {cite:canon-ibn-sina-print-v1 p.711}۔"
  es: "En el libro, Khaniq al-dhi'b es una droga que asfixia a lobos, cerdos y perros, muy putrefacta y que no se usa ni dentro ni fuera, y que mata a los lobos; el libro se refiere a lo que se dijo de ella en el capítulo de la carta qaf {cite:canon-ibn-sina-print-v1 p.711}."
  fr: "Le Khaniq al-dhi'b est décrit dans le livre comme une drogue qui étouffe les loups, les porcs et les chiens, très putréfiante et ne s'utilise ni à l'intérieur ni à l'extérieur, et qui tue les loups; le livre fait référence à ce qui en est dit dans le chapitre de la lettre qaf {cite:canon-ibn-sina-print-v1 p.711}"
