class: concept
kind: ethical
label: { ar: "المُنْكَر ⁦(وقواعد النهي عنه)⁩", en: "The blameworthy (munkar) and the rules for forbidding it", ur: "منکر ⁦(برائی اور اس سے روکنے کے اصول)⁩", es: "Lo censurable (munkar) y las reglas para prohibirlo", fr: "Les personnes blâmables (munkar) et les règles pour les interdire", tr: "Kötülük (ve yasaklama kuralları)", id: "Kejahatan (dan aturan larangan)" }
summary:
  ar: "المنكر لغة خلاف المعروف، واصطلاحا ما ليس فيه رضا الله من قول أو فعل. والنهي عنه واجب بالكتاب والسنة والإجماع، وقد اختلف الفقهاء في كونه فرض عين أو كفاية. ويشترط فيه أن يكون محظورا شرعا، موجودا في الحال، ظاهرا بغير تجسس، معلوما بغير اجتهاد، وأن يغلب على الظن أن النهي لا يفضي إلى مفسدة أعظم. وتتدرج مراتب الإنكار من التنبيه إلى الاستعداء، ويعرض الفقهاء صورا من المنكرات في المساجد والأسواق والشوارع والحمامات والضيافات."
  en: "Munkar is the opposite of the known good: in law it is whatever God does not approve in speech or action. Forbidding it is obligatory by the Qur'an, the Sunna and consensus, and the jurists differ on whether the duty is individual or collective. Its conditions are that it is forbidden by the law, present, open without spying, and known without disputed reasoning, and that the forbidding is unlikely to bring a greater harm. Protest moves by stages from a reminder to appeal to the ruler. The jurists list wrongs in mosques, markets, streets, baths and hospitality, and state that the one who merely sits at home is not excused."
  ur: "منکر لغت میں معروف کا الٹ ہے، اور اصطلاح میں وہ قول یا فعل جو اللہ کی رضا میں نہ ہو۔ اس سے روکنا واجب ہے، اور شرائط میں یہ ہے کہ وہ شرعاً حرام ہو، موجود ہو اور روکنے سے بڑا فساد نہ ہو۔ فقہاء نے مساجد، بازاروں، راستوں، حماموں اور دعوتوں کی برائیاں گنوائی ہیں۔"
  es: "Munkar es lo opuesto al bien conocido: en derecho, es todo aquello que Dios desaprueba en palabras o acciones. Prohibirlo es obligatorio según el Corán, la Sunna y el consenso, y los juristas difieren en si el deber es individual o colectivo. Sus condiciones son que esté prohibido por la ley, presente, abierto sin espionaje y conocido sin razonamiento discutible, y que sea improbable que la prohibición cause un daño mayor. La protesta avanza por etapas, desde un recordatorio hasta una apelación al gobernante. Los juristas enumeran las faltas cometidas en mezquitas, mercados, calles, baños y en la hostelería, y afirman que quien simplemente se sienta en casa no está exento de responsabilidad."
  fr: "Le « munkar » est l'opposé du bien connu: juridiquement, il désigne tout ce que Dieu désapprouve en paroles ou en actes. Son interdiction est obligatoire selon le Coran, la Sunna et le consensus, et les juristes divergent quant à savoir si ce devoir est individuel ou collectif. Pour être valide, il doit être interdit par la loi, constaté publiquement sans espionnage, et connu sans justification contestée, et son interdiction ne doit pas engendrer de préjudice plus grave. La protestation se déroule par étapes, du simple rappel à l'appel au souverain. Les juristes recensent les infractions commises dans les mosquées, les marchés, les rues, les bains publics et l'hospitalité, et précisent que celui qui reste simplement chez lui n'est pas exempté."
  tr: "Munkar, bilinenle dilsel olarak çelişkidir ve teknik olarak Allah'ı sözde ya da eylemde memnun etmeyenin yasaktır. Yasakları Kur'an, Sünnet ve uzlaşma gereği zorunludur ve hukukçular bunun özel mi yoksa toplu bir yükümlülük mü olduğu konusunda farklı görüşlere sahiptir. Dini olarak yasaklanması, anında bulunması, casusluk olmadan görünür olması, bağımsız gerekçeyle bilinmesi ve yasağın daha büyük zarara yol açmadığına inanılması gerekmektedir. Eleştirilerin dereceleri uyarıdan düşmanlığa kadar değişir ve hukukçular camilerde, pazarlarda, sokaklarda, hamamlarda ve hastanelerde ahlaksızlık biçimlerini sunarlar."
  id: "Munkar secara linguistik bertentangan dengan apa yang diketahui, dan secara teknis adalah apa yang tidak menyenangkan Allah dalam kata-kata atau tindakan. Larangannya wajib oleh Al-Qur'an, Sunnah, dan konsensus, dan para ahli hukum berbeda pendapat apakah itu kewajiban khusus atau kolektif. Munkar diwajibkan dilarang secara agama, hadir saat ini, tampak tanpa mata-mata, diketahui tanpa alasan independen, dan secara umum diyakini bahwa larangan tersebut tidak menyebabkan kerugian yang lebih besar. Tingkat kecaman berkisar dari peringatan hingga antagonisme, dan para ahli hukum menghadirkan bentuk-bentuk ketidakmoralan di masjid, pasar, jalan, pemandian, dan rumah sakit."
