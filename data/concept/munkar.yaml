id: concept/munkar
class: concept
kind: ethical
label: { ar: "المُنْكَر (وقواعد النهي عنه)", en: "The blameworthy (munkar) and the rules for forbidding it", ur: "منکر (برائی اور اس سے روکنے کے اصول)" }
summary:
  ar: "المنكر لغة خلاف المعروف، واصطلاحا ما ليس فيه رضا الله من قول أو فعل. والنهي عنه واجب بالكتاب والسنة والإجماع، وقد اختلف الفقهاء في كونه فرض عين أو كفاية. ويشترط فيه أن يكون محظورا شرعا، موجودا في الحال، ظاهرا بغير تجسس، معلوما بغير اجتهاد، وأن يغلب على الظن أن النهي لا يفضي إلى مفسدة أعظم. وتتدرج مراتب الإنكار من التنبيه إلى الاستعداء، ويعرض الفقهاء صورا من المنكرات في المساجد والأسواق والشوارع والحمامات والضيافات."
  en: "Munkar is the opposite of the known good: in law it is whatever God does not approve in speech or action. Forbidding it is obligatory by the Qur'an, the Sunna and consensus, and the jurists differ on whether the duty is individual or collective. Its conditions are that it is forbidden by the law, present, open without spying, and known without disputed reasoning, and that the forbidding is unlikely to bring a greater harm. Protest moves by stages from a reminder to appeal to the ruler. The jurists list wrongs in mosques, markets, streets, baths and hospitality, and state that the one who merely sits at home is not excused."
  ur: "منکر لغت میں معروف کا الٹ ہے، اور اصطلاح میں وہ قول یا فعل جو اللہ کی رضا میں نہ ہو۔ اس سے روکنا واجب ہے، اور شرائط میں یہ ہے کہ وہ شرعاً حرام ہو، موجود ہو اور روکنے سے بڑا فساد نہ ہو۔ فقہاء نے مساجد، بازاروں، راستوں، حماموں اور دعوتوں کی برائیاں گنوائی ہیں۔"
