id: concept/raghaib-fiqh
class: concept
kind: legal
label:
  ar: "الرغائب"
  en: "Raghaib (the special supererogatory prayers: the Maliki sense, the Fajr sunna, and the prayers of Rajab and mid-Sha'ban that the Hanafis and Shafi'is call innovation)"
  ur: "رغائب (نوافل)"
summary:
  ar: "الرغائب جمع رغيبة وهي العطاء الكثير أو ما حُثّ عليه من الخير، وعند المالكية ما رغب فيه الشارع ولم يُفعل في جماعة، وقد يطلق على سنة الفجر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8797} ونص الحنفية والشافعية على أن صلاة الرغائب في أول جمعة من رجب أو ليلة النصف من شعبان بكيفية أو عدد مخصوص بدعة منكرة، وذكروا أن الأحاديث الواردة فيها موضوعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8797} وفي المذهب المالكي الرغيبة سنة صلاة الفجر، وهي عند الحنفية من أقوى السنن، وعند الشافعية والحنابلة من السنن الرواتب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8797}"
  en: "Raghaib is the plural of raghiba, a great gift or a good deed urged upon the believer; for the Malikis it is what the Law favours without its being done in congregation, and it may name the Fajr sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8797} The Hanafis and Shafi'is hold that the special prayer on the first Friday of Rajab or on mid-Sha'ban, with a fixed manner or number, is a reprehensible innovation, and the traditions for it are judged fabricated. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8797} For the Malikis the raghiba is the Fajr sunna, which the Hanafis count among the strongest sunnas and the Shafi'is and Hanbalis among the regular sunnas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8797}"
  ur: "رغائب سے مراد مخصوص نوافل ہیں؛ رجب کی پہلی جمعہ اور شعبان کی درمیانی شب کی مخصوص نماز حنفی و شافعی فقہاء کے نزدیک بدعت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8797}"
