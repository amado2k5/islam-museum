id: concept/canon-wine-by-age-and-climate
class: concept
kind: scientific
label: { ar: "الشراب بحسب السن والبلد عند ابن سينا", en: "Wine by age and climate in the Canon", ur: "عمر اور ملک کے لحاظ سے شراب قانون میں", es: "Vinos por edad y clima en el Canon", fr: "Vins selon l'âge et le climat dans le Canon" }
summary:
  ar: "يرى ابن سينا أن شرب الصبيان الشراب كزيادة نار على نار في حطب ضعيف، وأن الشيخ يحتمل منه ما يحتمل، وأن الأولى للشبان العتيق ممزوجاً بماء الرمان أو بالماء البارد، وأن البلد البارد يحتمل الشرب والحار لا يحتمله {cite:canon-ibn-sina-print-v1 p.238}."
  en: "Ibn Sina compares boys' drinking of wine to adding fire to fire in weak wood, says the old man bears what he bears, advises the young to take old wine mixed with pomegranate juice or cold water, and says a cold country tolerates drinking while a hot one does not {cite:canon-ibn-sina-print-v1 p.238}."
  es: "Ibn Sina compara el consumo de vino por parte de los muchachos con añadir fuego al fuego en madera débil, dice que el anciano soporta lo que soporta, aconseja a los jóvenes que tomen vino añejo mezclado con jugo de granada o agua fría, y dice que un país frío tolera el consumo de alcohol mientras que uno cálido no {cite:canon-ibn-sina-print-v1 p.238}."
  fr: "Ibn Sina compare la consommation de vin par les garçons à l'ajout de feu à un feu de bois faible, dit que le vieil homme supporte ce qu'il supporte, conseille aux jeunes de prendre du vieux vin mélangé à du jus de grenade ou à de l'eau froide, et dit qu'un pays froid tolère la consommation d'alcool tandis qu'un pays chaud ne la tolère pas {cite:canon-ibn-sina-print-v1 p.238}."
  ur: "ابن سینا لڑکوں کے شراب پینے کا موازنہ کمزور لکڑی میں آگ ڈالنے سے کرتا ہے، بوڑھا کہتا ہے کہ وہ جو اٹھاتا ہے وہ برداشت کرتا ہے، جوانوں کو انار کے رس یا ٹھنڈے پانی میں ملا کر پرانی شراب پینے کا مشورہ دیتا ہے، اور کہتا ہے کہ ٹھنڈا ملک پینے کو برداشت نہیں کرتا جبکہ گرم ملک نہیں پیتا۔"
