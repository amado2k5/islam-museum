summary:
  ar: "يرى ابن سينا أن شرب الصبيان الشراب كزيادة نار على نار في حطب ضعيف، وأن الشيخ يحتمل منه ما يحتمل، وأن الأولى للشبان العتيق ممزوجاً بماء الرمان أو بالماء البارد، وأن البلد البارد يحتمل الشرب والحار لا يحتمله {cite:canon-ibn-sina-print-v1 p.238}."
  en: "Ibn Sina compares boys' drinking of wine to adding fire to fire in weak wood, says the old man bears what he bears, advises the young to take old wine mixed with pomegranate juice or cold water, and says a cold country tolerates drinking while a hot one does not {cite:canon-ibn-sina-print-v1 p.238}."
