id: concept/anisun
class: concept
kind: natural
label:
  ar: "الأنيسون"
  en: "Anisun (anise seed, which the book calls the seed of Roman fennel)"
  fr: "Anisun (graine d’anis, appelée graine de fenouil romain dans le livre)"
  ur: "انیسون"
summary:
  ar: "الأنيسون في الكتاب بزر الرازيانج الرومي، أقلّ حرافة من النبطي وفيه حلاوة وهو خير منه؛ حارّ في الثانية يابس في الثالثة عند جالينوس، فيه تفتيح مع قبض يسير، يسكّن الأوجاع ويعرّق ويحلّل الرياح؛ ينفع من تهيّج الوجه وورم الأطراف والصداع والدوار وأوجاع الأذن والسبل المزمن وسدد الكبد والطحال والكلى والمثانة، ويدرّ البول، ويدفع ضرر السموم والهوام؛ ويذكر الكتاب فيه أقوالاً عن اللبن والرحم والباه في فقرة موسومة معلّقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.342-343}"
  en: "In the book anisun is the seed of Roman fennel, less pungent than the Nabatean kind and sweet, and better than it; Galen places it hot in the second degree and dry in the third; it opens with a slight astringency, soothes pains, induces sweat and resolves winds; it is listed for puffiness of the face and swelling of the limbs, headache and giddiness, ear pains, chronic pannus, obstructions of the liver, spleen, kidneys and bladder, as promoting urine, and against the harm of poisons and vermin; the book also gives statements on milk, the womb and desire in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.342-343}"
  fr: "Dans le livre, l’anisun est la graine du fenouil romain, moins âcre et plus douce que la variété nabatéenne, à laquelle elle est préférée. Galien la dit chaude au deuxième degré et sèche au troisième. Elle aurait une action désobstruante légèrement astringente, calmerait les douleurs, ferait transpirer et dissiperait les vents. Le livre la mentionne pour les bouffissures du visage et les enflures des membres, les maux de tête et les vertiges, les douleurs de l’oreille, le pannus chronique et les obstructions du foie, de la rate, des reins et de la vessie ; il lui attribue aussi une action diurétique et protectrice contre les poisons et les bêtes nuisibles. Il rapporte enfin des affirmations sur le lait, la matrice et le désir dans une section signalée et réservée à la décision du fondateur {cite:canon-ibn-sina-print-v1 pp.342-343}"
  ur: "انیسون کتاب میں رومی رازیانے کا بیج ہے، نبطی سے کم تیز اور میٹھا، اور اس سے بہتر؛ جالینوس کے نزدیک دوسرے درجے میں گرم اور تیسرے میں خشک ہے، قبض ہلکی کے ساتھ کھولتا ہے، دردوں کو تسکین دیتا ہے، پسینہ لاتا ہے اور ہواؤں کو تحلیل کرتا ہے؛ چہرے کی سوجن، ہاتھ پاؤں کے ورم، سر درد اور چکر، کان کے درد، پرانے سبل، جگر، تلی، گردوں اور مثانے کی رکاوٹوں میں، پیشاب جاری کرنے کے لیے اور زہروں اور موذی جانوروں کے نقصان کے خلاف مذکور ہے؛ کتاب دودھ، رحم اور باہ کے بارے میں اقوال موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 pp.342-343}۔"
