label: { ar: "أحرف الجمل على أسماء ملوك مدين", en: "The abjad letters named for Madyan's kings" }
summary:
  ar: "عند المسعودي أن أحرف الجمل وهي التسعة والعشرون حرفاً التي يدور عليها حساب الجمل إنما هي على أسماء ملوك قوم شعيب بني المحض بن جندل بن يعصب بن مدين بن إبراهيم: أبجد ملك مكة وما يليها من الحجاز، وهوز وحطي ملكان ببلاد وج وهي أرض الطائف وما اتصل بها من نجد، وكلمن وسعفص وقرشت ملوك مدين وقيل ببلاد مصر، وقيل في الأحرف غير هذا الوجه {cite:muruj-al-dhahab p. 459}."
  en: "al-Mas'udi's etymology of the abjad numeral letters — the 29 letters of the abjad order named after six kings of Shu'ayb's people: Abjad of Mecca and the Hijaz, Hawwaz and Hutti of Wajj (the Ta'if and Najd lands), and Kalamn, Sa'fas and Qursht of Madyan or Egypt {cite:muruj-al-dhahab p. 459}."
