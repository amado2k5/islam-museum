id: concept/abjad-kings-etymology
class: concept
kind: term
label: { ar: "أحرف الجمل على أسماء ملوك مدين", en: "The abjad letters named for Madyan's kings", fr: "Les lettres de l'abjad nommées d'après les rois de Madyan", es: "Las letras abjad que llevan el nombre de los reyes de Madián.", ur: "مدین کے بادشاہوں کے نام ابجد کے حروف", tr: "Midyan krallarının isimlerine verilen cümlelerin harfleri", id: "Huruf-huruf kalimat pada nama-nama raja-raja Midian" }
summary:
  ar: "عند المسعودي أن أحرف الجمل وهي التسعة والعشرون حرفاً التي يدور عليها حساب الجمل إنما هي على أسماء ملوك قوم شعيب بني المحض بن جندل بن يعصب بن مدين بن إبراهيم: أبجد ملك مكة وما يليها من الحجاز، وهوز وحطي ملكان ببلاد وج وهي أرض الطائف وما اتصل بها من نجد، وكلمن وسعفص وقرشت ملوك مدين وقيل ببلاد مصر، وقيل في الأحرف غير هذا الوجه {cite:muruj-al-dhahab p. 459}."
  en: "al-Mas'udi's etymology of the abjad numeral letters — the 29 letters of the abjad order named after six kings of Shu'ayb's people: Abjad of Mecca and the Hijaz, Hawwaz and Hutti of Wajj (the Ta'if and Najd lands), and Kalamn, Sa'fas and Qursht of Madyan or Egypt {cite:muruj-al-dhahab p. 459}."
  fr: "L'étymologie des lettres numérales de l'abjad selon al-Mas'udi — les 29 lettres de l'ordre abjad portent les noms de six rois du peuple de Shu'ayb : Abjad de La Mecque et du Hedjaz, Hawwaz et Hutti de Wajj (les territoires de Ta'if et du Najd), et Kalamn, Sa'fas et Qursht de Madyan ou d'Égypte {cite:muruj-al-dhahab p. 459}."
  es: "La etimología de al-Mas'udi de las letras numéricas abjad: las 29 letras del orden abjad que llevan el nombre de seis reyes del pueblo de Shu'ayb: Abjad de La Meca y el Hijaz, Hawwaz y Hutti de Wajj (las tierras de Ta'if y Najd), y Kalamn, Sa'fas y Qursht de Madyan o Egipto {citar:muruj-al-dhahab p. 459}."
  ur: "ابجد کے عددی حروف کی المسعودی کی تشبیہ - ابجد کے حکم کے 29 حروف جو شعیب کی قوم کے چھ بادشاہوں کے نام پر رکھے گئے ہیں: مکہ اور حجاز کے ابجد، حجاز اور حوثی ⁦(طائف اور نجد کی سرزمینوں)⁩، اور کالم، صفا اور مضارع المعروف مصری ص 459}۔"
  tr: "El-Mes'udi'ye göre, cümlenin harfleri, devenin hesaplanmasında kullanılan yirmi dokuz harf, aslında Şuayb halkının krallarının, yani El-Mehd bin Cennel bin Ya'sab bin Madyan bin İbrahim'in oğullarının isimlerinden esinlenmiştir: Hicaz'daki Mekke ve çevresinin kralı Abjad; Havz ve Hati, Taif ve ona bağlı Necd diyarı olan Vec diyarında iki kral; ve Midyan kralları Kalman, Sa'fas ve Karshir; Mısır topraklarında da harflerin farklı olduğu söylenir. {atıf:Muruj-al-Dhahab, s. 459}."
  id: "Menurut Al-Mas'udi, huruf-huruf kalimat, yaitu dua puluh sembilan huruf yang digunakan dalam perhitungan unta, sebenarnya diambil dari nama raja-raja rakyat Shu'ayb, putra-putra Al-Mahd bin Jandal bin Ya'sab bin Madyan bin Ibrahim: Abjad, raja Mekah dan sekitarnya di Hijaz; Hawz, dan Hati, dua raja di tanah Waj, yang merupakan tanah Taif dan Najd yang terkait; dan Kalman, Sa'fas, dan Qarshir, raja-raja Midian, dan dikatakan di tanah Mesir, dan dikatakan huruf-hurufnya berbeda. {cite:Muruj-al-Dhahab, hlm. 459}."
