  did_you_know:
    ar: "الغنيمة ما أخذه المسلمون من المنقولات في حرب الكفار عنوة؛ يُخمَّس فيكون خمسها لله وللرسول ولذوي القربى واليتامى والمساكين وابن السبيل، والباقي للغانمين."
    en: "The ghanima is what Muslims take of movables in war against unbelievers by force; a fifth is set apart for God and the Messenger, kin, orphans, the needy and the wayfarer — the rest goes to the fighters."
    ur: "غنیمت وہ منقولہ مال ہے جو مسلمان کافروں سے جنگ میں عنواً لیتے ہیں؛ اس کا پانچواں حصہ اللہ و رسول، قرابت داروں، یتیموں، مسکینوں اور ابن السبیل کے لیے نکالا جاتا ہے — باقی جنگجوؤں کا۔"
    sources: [source/sahih-al-bukhari, source/futuh-buldan-maarif-1407]
