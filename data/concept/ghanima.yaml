label: { ar: "الغنيمة", en: "Ghanima (spoils of war)" }
summary:
  ar: "الغنيمة في تعريف رضا ما أخذه المسلمون من المنقولات في حرب الكفار عنوة؛ يُخمَّس فيكون خمسها لله وللرسول ولذوي القربى واليتامى والمساكين وابن السبيل، والباقي للغانمين. ويفرّق رضا بينها وبين الفيء، وهو عنده ما أُخذ دون قهر الحرب."
  en: "In Rida's account, ghanima is what the Muslims take in movable property from war against unbelievers by force; a fifth is set aside for God, the Messenger and the others named in Q. 8:41, and the rest goes to the fighters. Rida distinguishes it from fay', which he takes to be what is gained without the force of war."
