label: { ar: "الغنيمة", en: "Ghanima (spoils of war)", es: "Ghanima (botín de guerra)", fr: "Ghanima (butin de guerre)", ur: "غنیما ⁦(جنگ کا مال)⁩", tr: "ganimet", id: "bokong" }
summary:
  ar: "الغنيمة في تعريف رضا ما أخذه المسلمون من المنقولات في حرب الكفار عنوة؛ يُخمَّس فيكون خمسها لله وللرسول ولذوي القربى واليتامى والمساكين وابن السبيل، والباقي للغانمين. ويفرّق رضا بينها وبين الفيء، وهو عنده ما أُخذ دون قهر الحرب."
  en: "In Rida's account, ghanima is what the Muslims take in movable property from war against unbelievers by force; a fifth is set aside for God, the Messenger and the others named in Q. 8:41, and the rest goes to the fighters. Rida distinguishes it from fay', which he takes to be what is gained without the force of war."
  es: "Según Rida, la ghanima es lo que los musulmanes obtienen en bienes muebles tras una guerra contra los infieles; una quinta parte se reserva para Dios, el Mensajero y los demás mencionados en el Corán 8:41, y el resto se reparte entre los combatientes. Rida la distingue de la fay', que considera lo que se obtiene sin recurrir a la fuerza de la guerra."
  fr: "Selon Rida, la ghanima désigne les biens meubles que les musulmans prennent par la force lors d'une guerre contre les infidèles; un cinquième est réservé à Dieu, au Messager et aux autres personnes mentionnées dans le verset 8:41, et le reste revient aux combattants. Rida la distingue de la fay', qu'il considère comme le fruit d'un gain sans intervention militaire."
  ur: "ردا کے بیان میں، غنیمہ وہ ہے جسے مسلمان طاقت کے ذریعے کافروں کے خلاف جنگ سے منقولہ جائیداد میں لیتے ہیں۔ پانچواں حصہ خدا، رسول اور دیگر کے لیے مختص کیا گیا ہے جن کا Q. 8:41 میں نام لیا گیا ہے، اور باقی جنگجوؤں کے پاس جاتا ہے۔ ردا اسے فے سے ممتاز کرتا ہے، جسے وہ جنگ کی طاقت کے بغیر حاصل ہونے والی چیز کو سمجھتا ہے۔"
  tr: "Savaşın ganimetleri, Müslümanların kâfirlere karşı zorla yapılan savaşta taşınabilir olandan aldıkları tatmin miktarı olarak tanımlanır; hums verilir, böylece beşte biri Allah, Resefef, akrabalar, yetimler, muhtaçlar ve yolcular için, kalan kısmı ise kazananlara gider. Hums ile kazananları ayırır; savaşın aşılmadan alınanları kabul eder."
  id: "Rampasan perang didefinisikan sebagai kepuasan atas apa yang diambil Muslim dari barang bergerak dalam perang melawan kafir dengan paksa; khum diberikan, sehingga seperlima darinya untuk Allah, Rasulullah, kerabat, anak yatim, yang miskin, dan pengembara, dan sisanya diberikan kepada yang diuntungkan. Dia membedakan antara itu dan yang diuntungkan, yang dianggap diambil tanpa mengatasi perang."
