perspectives:
- tradition: sunni
  id: sunni-sharawi-qisas-heir
  stance:
    ar: "القصاص حق الولي يعفو أو يأخذ الدية، والحد حق الله، والقصاص حياة"
    en: "Retaliation is the heir's right, who may pardon or take the blood-money; the hadd is God's right; retaliation is life"
  summary:
    ar: "يقرر الشعراوي أن القصاص في القتل حق الولي، فله أن يعفو أو أن يأخذ الدية، وأن الحدود حق الله لا يتنازل عنها أحد {cite:tafsir-sharawi-khawatir-scan p.2543}. ويستدل بآية البقرة على أن القصاص يحفظ الحياة، فمن علم أنه إن قتل قُتل لم يقتل، فتُحفظ حياة القاتل وحياة من كان سيُقتل {cite:tafsir-sharawi-khawatir-scan p.2538}. ويذكر أن القتل الخطأ خارج القصاص ويُكتفى فيه بالدية {cite:tafsir-sharawi-khawatir-scan p.2543}. وهذا رأيه، ولم تُعرض بعد أقوال الفقهاء في شروط القصاص من مصدر محدد (needs_source)."
    en: "Sha'rawi holds that retaliation for killing is the heir's right, who may pardon or take the blood-money, and that the hadd penalties are God's right which no one may waive {cite:tafsir-sharawi-khawatir-scan p.2543}. He reads the verse of the Baqara as showing that retaliation preserves life: the one who knows he will be killed if he kills does not kill, so both lives are kept {cite:tafsir-sharawi-khawatir-scan p.2538}. He places accidental killing outside retaliation, where blood-money suffices {cite:tafsir-sharawi-khawatir-scan p.2543}. This is his view; the jurists' conditions for retaliation are not yet set out from a named source (needs_source)."
