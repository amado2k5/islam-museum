label:
  ar: القصاص
  en: Retaliation (qisas)
summary:
  ar: "القصاص في تفسير الشعراوي حق لولي الدم، له أن يعفو أو يأخذ الدية، أما الحدود فحق لله لا يملك أحد التنازل عنها. ويرى أن القصاص يحفظ حياتين، لأن القاتل إذا علم أنه سيُقتص منه كفّ عن القتل {cite:tafsir-sharawi-khawatir-scan p.2538}{cite:tafsir-sharawi-khawatir-scan p.2543}."
  en: "Retaliation (qisas) in Sha'rawi's commentary is the right of the victim's heir, who may pardon or take the blood-money; the hadd penalties are God's right and no one may waive them. He holds that retaliation preserves two lives, since a killer who knows he will be retaliated against refrains {cite:tafsir-sharawi-khawatir-scan p.2538}{cite:tafsir-sharawi-khawatir-scan p.2543}."
