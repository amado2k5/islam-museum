label: { ar: "جالينوس وتفرق الاتصال سبباً للوجع عند ابن سينا", en: "Galen and separation of continuity as the cause of pain, in the Canon", ur: "جالینوس اور درد کے سبب کے طور پر تفرق اتصال، قانون کے مطابق" }
summary:
  ar: "ينقل ابن سينا أن مذهب جالينوس عند التحقيق يرد السبب الذاتي للوجع إلى تفرّق الاتصال وحده، ثم يرجّح أن يكون تغيّر المزاج جنساً موجباً للوجع بذاته، ويحتج بأن الوجع قد يكون متشابه الأجزاء وتفرّق الاتصال لا يكون كذلك {cite:canon-ibn-sina-print-v1 pp.148-149}."
  en: "Ibn Sina reports that Galen's position, closely examined, makes separation of continuity the sole essential cause of pain; he then prefers to make change of temperament a genus that causes pain in itself, arguing that pain can be uniform in a part while separation of continuity never is {cite:canon-ibn-sina-print-v1 pp.148-149}."
