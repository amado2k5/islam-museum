id: concept/canon-galen-and-solution-of-continuity-as-cause-of-pain
class: concept
kind: scientific
label:
  ar: "جالينوس وتفرق الاتصال سبباً للوجع عند ابن سينا"
  en: "Galen and separation of continuity as the cause of pain, in the Canon"
  fr: "Galien et la solution de continuité comme cause de douleur dans le Canon"
  ur: "جالینوس اور درد کے سبب کے طور پر تفرق اتصال، قانون کے مطابق"
  es: "Galeno y la separación de la continuidad como causa del dolor, en el Canon"
summary:
  ar: "ينقل ابن سينا أن مذهب جالينوس عند التحقيق يرد السبب الذاتي للوجع إلى تفرّق الاتصال وحده، ثم يرجّح أن يكون تغيّر المزاج جنساً موجباً للوجع بذاته، ويحتج بأن الوجع قد يكون متشابه الأجزاء وتفرّق الاتصال لا يكون كذلك {cite:canon-ibn-sina-print-v1 pp.148-149}."
  en: "Ibn Sina reports that Galen's position, closely examined, makes separation of continuity the sole essential cause of pain; he then prefers to make change of temperament a genus that causes pain in itself, arguing that pain can be uniform in a part while separation of continuity never is {cite:canon-ibn-sina-print-v1 pp.148-149}."
  fr: "Selon Ibn Sina, l’examen du propos de Galien ramène la douleur à une seule cause essentielle, la solution de continuité. Il préfère reconnaître au changement de tempérament une causalité propre : la douleur peut être uniforme, jamais la solution de continuité {cite:canon-ibn-sina-print-v1 pp.148-149}."
  es: "Ibn Sina informa que la posición de Galeno, examinada detenidamente, hace de la separación de la continuidad la única causa esencial del dolor; luego prefiere hacer del cambio de temperamento un género que causa dolor en sí mismo, argumentando que el dolor puede ser uniforme en una parte mientras que la separación de la continuidad nunca lo es {cite:canon-ibn-sina-print-v1 pp.148-149}."
  ur: "ابن سینا نے رپورٹ کیا ہے کہ گیلن کی پوزیشن، جس کا باریک بینی سے جائزہ لیا گیا ہے، تسلسل کی علیحدگی کو درد کی واحد بنیادی وجہ بناتا ہے۔ اس کے بعد وہ مزاج کی تبدیلی کو ترجیح دیتا ہے جو اپنے آپ میں درد کا باعث بنتا ہے، یہ دلیل دیتے ہوئے کہ درد کسی حصے میں یکساں ہو سکتا ہے جبکہ تسلسل کی علیحدگی کبھی نہیں ہوتی۔"
