id: concept/al-mukatabat
class: concept
kind: term
label:
  ar: "المكاتبات"
  en: "Correspondence (al-mukatabat)"
  fr: "La correspondance (al-mukatabat)"
  ur: "مکاتبات ⁦(خط و کتابت کا لین دین)⁩"
  es: "Correspondencia (al-mukatabat)"
  tr: "Yazışmalar"
  id: "Korespondensi"
summary:
  ar: "المكاتبات في اصطلاح التراث هي الرسائل والكتب المتبادلة بين الملوك والسلاطين والخلفاء والولاة والرسل — ما يُكتب ويُبعث ويُقرأ ويُجاب. يبدأ المتحف هذا الجنس بما في القرآن من كتاب سليمان إلى بلقيس [[passage/quran-27-30|النمل 30]]، وما في السنة من كتب النبي إلى الملوك — كقراءة هرقل لكتاب النبي في [[passage/bukhari-api-7541|صحيح البخاري 7541]] وصياغة خاتمه وإرسال الكتب إلى كسرى وقيصر والنجاشي في [[passage/muslim-api-5482|صحيح مسلم 5482]] — وما في كتب التاريخ والإنشاء من مكاتبات الخلفاء وولاة الأمور، ويجمعها [[/ar/mukatabat/|متصفح المكاتبات]] مع كل ذكر وكتاب في المصحف والمدونة المحصودة وما يُحصَّل لاحقًا."
  en: "In the tradition's idiom, al-mukatabat is the exchange of letters and written messages between kings, sultans, caliphs, governors, envoys and correspondents — what is written, sent, read and answered. The museum opens this genre with the Qur'anic letter of Sulayman to Bilqis [[passage/quran-27-30|al-Naml 30]]، the Prophet's letters to the kings — Heraclius reading the Prophet's letter in [[passage/bukhari-api-7541|Sahih al-Bukhari 7541]] and the sealing and dispatch of letters to Chosroes، Caesar and the Negus in [[passage/muslim-api-5482|Sahih Muslim 5482]] — and what the history and chancery books carry of the caliphs' correspondence; the [[/en/mukatabat/|Mukatabat Browser]] gathers it with every mention and letter in the Qur'an، the Sunnah، the seerah and every harvested book — and whatever is harvested later."
  fr: "Dans l'usage de la tradition, al-mukatabat est l'échange de lettres et de messages écrits entre rois, sultans, califes, gouverneurs, envoyés et correspondants : ce qui est écrit, envoyé, lu et répondu. Le musée ouvre ce genre avec la lettre coranique de Sulayman à Bilqis [[passage/quran-27-30|al-Naml 30]], les lettres du Prophète aux rois, Héraclius lisant la lettre du Prophète dans [[passage/bukhari-api-7541|Sahih al-Bukhari 7541]] et le scellement et l'envoi de lettres à Chosroès, César et au Négus dans [[passage/muslim-api-5482|Sahih Muslim 5482]], et ce que les livres d'histoire et de chancellerie rapportent de la correspondance des califes ; le [[/en/mukatabat/|navigateur des Mukatabat]] le rassemble avec chaque mention et chaque lettre dans le Coran, la Sunna, la sira et chaque livre moissonné, et tout ce qui sera moissonné plus tard."
  ur: "تراث کی اصطلاح میں مکاتبات بادشاہوں، سلاطین، خلفاء، گورنروں، سفیروں اور دیگر فریقوں کے درمیان خطوط اور تحریری پیغامات کا تبادلہ ہے — جو لکھا، بھیجا، پڑھا اور جواب دیا جاتا ہے۔ میوزیم اس صنف کا آغاز قرآن میں سلیمان کی بلقیس کو کتاب [[passage/quran-27-30|النمل 30]] سے کرتا ہے، نبی کی بادشاہوں کو کتابوں سے — ہرقل کا نبی کا خط پڑھنا [[passage/bukhari-api-7541|صحیح بخاری 7541]] میں اور مہر بنانا اور کسرى، قیصر اور نجاشی کو کتابیں بھیجنا [[passage/muslim-api-5482|صحیح مسلم 5482]] میں — اور تاریخ و انشاء کی کتابوں میں خلفاء کی مکاتبات سے؛ [[/ur/mukatabat/|مکاتبات براؤزر]] ان تمام ذکر و خطوط کو قرآن، سنت، سیرت اور ہر حاصل شدہ کتاب میں جمع کرتا ہے — اور جو بعد میں حاصل ہو۔"
  es: "En el lenguaje de la tradición, al-mukatabat es el intercambio de cartas y mensajes escritos entre reyes, sultanes, califas, gobernadores, enviados y corresponsales: lo que se escribe, se envía, se lee y se responde. El museo abre este género con la carta coránica de Sulayman a Bilqis [[passage/quran-27-30|al-Naml 30]], las cartas del Profeta a los reyes: Heraclio leyendo la carta del Profeta en [[passage/bukhari-api-7541|Sahih al-Bukhari 7541]] y el sellado y envío de cartas a Cosroes, César y el Negus en [[passage/muslim-api-5482|Sahih Muslim 5482]], y lo que los libros de historia y cancillería contienen de la correspondencia de los califas; El [[/en/mukatabat/|Mukatabat Browser]] lo recopila con cada mención y letra en el Corán, la Sunnah, la sirah y cada libro cosechado, y todo lo que se coseche después."
  tr: "Yazışma, miras terminolojisiyle krallar, sultanlar, halifeler, valiler ve elçiler arasında değiş tokuş edilen mektuplar ve kitapları ifade eder — yazılan, gönderilen, okunan ve cevaplanan şeyleri. Müze bu türü Süleyman'dan Bilkis'e kadar olan Kur'an ayetleriyle [[pasaj/kuran-27-30|An-Naml 30] ve Peygamber'in krallara yazdığı kitaplardan Sünnet'te yer alanlarla — örneğin Herakleios'un Peygamber'in kitabını [[pasaj/Buhari-a'da] okuması gibi — pi-7541|Sahih al-Buhari 7541]], mührünü hazırladı ve kitapları [[passage/mukatabat-api-5482|Sahih Muslim 5482]]'de Khosrow, Sezar ve Negus'a gönderdi — ve halifeler ile yöneticilerin tarih ve yazı kitaplarındaki yazışmaları, [[/ar/mukatabat/|yazışma tarayıcısı]] tarafından toplanan ve Mushaf ile Toplu Kayıt'taki her atıf ve kitap ile sonrasında olanlarla birlikte yer aldı."
  id: "Korespondensi merujuk pada surat dan buku yang dipertukarkan antara raja, sultan, khalifah, gubernur, dan duta dalam istilah warisan — hal-hal yang ditulis, dikirim, dibaca, dan dibalas. Museum menyiapkan jenis ayat Al-Qur'an dari Salomo hingga Bilkis dalam [[ayat/Al-Qur'an-27-30| An-Naml 30] dan kitab-kitab yang ditulis Nabi kepada raja-raja dan yang ditemukan dalam Sunnah — misalnya, Heraclius membaca kitab Nabi dalam [[ayat/Buhari-a] — pi-7541| Sahih al-Bukhari 7541]], menyiapkan segel dan buku-buku [[ayat/mukatabat-api-5482| Sahih Muslim mengirimkannya kepada Khosrow, Caesar, dan Negus pada tahun 5482 SM — dan korespondensi antara khalifah dan penguasa dalam sejarah serta kitab suci dikumpulkan oleh [[/ar/mukatabat/|pemindai korespondensi]] dan mencakup setiap kutipan dan buku dalam Mushaf dan Catatan Kolektif, beserta apa yang terjadi setelahnya."
