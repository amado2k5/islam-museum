label:
  ar: "العِرْض"
  en: "Honour (ird)"
  ur: "عرض"
summary:
  ar: "العِرض في اللغة النفس والحسب، ويقال نقي العرض أي برئ من العيب، وجمعه أعراض، وإذا ذُكر مع النفس أو الدم أو المال فالمراد به الحسب فقط، والحسب هو الغالب في استعمال الفقهاء للكلمة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11559}. والحسب عندهم مآثر الآباء والأجداد وشرف النسب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11559}. وكفلت الشريعة حفظ النفس والعرض والمال، وشرعت لذلك الحدود والقصاص، واتفق الفقهاء على مشروعية الدفاع عن النفس والعرض والمال عند الصيال {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11559}. واتفقوا على أن الدفاع عن العرض بمعنى البضع واجب، فيأثم من تركه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11560}. ومن وجد رجلاً يزني بامرأته فقتله فلا قصاص عليه ولا دية عند الفقهاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11560}. واختلفوا في الدفاع عن النفس والمال، فقال جمهور الفقهاء بوجوب الدفاع عن النفس وجوازه عن المال، وذهب بعضهم إلى الجواز في الحالتين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11561}."
  en: "In the lexicon, ird means the self and the lineage: a person of clean honour is one free from blemish, and the plural is a'rad. When the word is paired with self, blood or property, it means only lineage, and lineage is the usual sense in the jurists' use of the word {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11559}. Lineage, for the jurists, is the distinction inherited from forebears and the nobility of descent {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11559}. The law protects life, honour and property, and prescribes punishments and retaliation for them; the jurists agree that defending self, honour and property against an aggressor is lawful {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11559}. They agree that defending honour in the sense of chastity is obligatory, and that whoever abandons it commits a sin {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11560}. Where a man finds another committing adultery with his wife and kills him, the jurists hold that there is neither retaliation nor blood-money {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11560}. On defence, the majority require defending oneself and permit defending property, while some permit both {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11561}."
