id: concept/canon-protection-against-the-samum-wind
class: concept
kind: scientific
label:
  ar: "الوقاية من السموم عند ابن سينا"
  en: "Protection against the samum wind in the Canon"
  fr: "Protection contre le simoun dans le Canon"
  ur: "سموم کی لو سے بچاؤ قانون میں"
  es: "Protección contra el viento samum en el cañón"
summary:
  ar: "يصف ابن سينا لمن يخاف السموم، وهي الريح الحارة القاتلة، عصب المنخر والفم بعمامة ولثام، وأكل البصل في الدوغ مسبقاً، والتنشق بدهن الورد ودهن حب القرع؛ فإذا ضربه السموم سكب على أطرافه ماء بارداً وغسل وجهه وجعل غذاءه من البقول الباردة ووضع على رأسه الأدهان الباردة {cite:canon-ibn-sina-print-v1 p.262}."
  en: "For one who fears the samum, the scorching deadly wind, Ibn Sina prescribes binding nose and mouth with a turban and veil, eating onion in buttermilk beforehand, and sniffing rose oil and gourd-seed oil; if the samum strikes him, he pours cold water over his limbs, washes his face, makes his food of cold vegetables and puts cold oils on his head {cite:canon-ibn-sina-print-v1 p.262}."
  fr: "Contre le vent brûlant mortel simoun, Ibn Sina décrit nez et bouche couverts de turban et voile, oignon au babeurre préalable, huiles de rose et graines de courge respirées ; après atteinte, eau froide sur membres et visage, légumes froids et huiles froides céphaliques {cite:canon-ibn-sina-print-v1 p.262}."
  es: "Para quien teme al samum, el viento abrasador y mortal, Ibn Sina prescribe cubrirse la nariz y la boca con un turbante y un velo, comer cebolla en suero de leche de antemano e inhalar aceite de rosa y aceite de semilla de calabaza; si el samum lo golpea, debe verter agua fría sobre sus extremidades, lavarse la cara, preparar su comida con vegetales fríos y ponerse aceites fríos en la cabeza {cite:canon-ibn-sina-print-v1 p.262}."
