label: { ar: "الوقاية من السموم عند ابن سينا", en: "Protection against the samum wind in the Canon", ur: "سموم کی لو سے بچاؤ قانون میں" }
summary:
  ar: "يصف ابن سينا لمن يخاف السموم، وهي الريح الحارة القاتلة، عصب المنخر والفم بعمامة ولثام، وأكل البصل في الدوغ مسبقاً، والتنشق بدهن الورد ودهن حب القرع؛ فإذا ضربه السموم سكب على أطرافه ماء بارداً وغسل وجهه وجعل غذاءه من البقول الباردة ووضع على رأسه الأدهان الباردة {cite:canon-ibn-sina-print-v1 p.262}."
  en: "For one who fears the samum, the scorching deadly wind, Ibn Sina prescribes binding nose and mouth with a turban and veil, eating onion in buttermilk beforehand, and sniffing rose oil and gourd-seed oil; if the samum strikes him, he pours cold water over his limbs, washes his face, makes his food of cold vegetables and puts cold oils on his head {cite:canon-ibn-sina-print-v1 p.262}."
