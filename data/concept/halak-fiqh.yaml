label: { ar: "هَلاك", en: "Halak (destruction of property and its legal effect)", es: "Halak (destrucción de la propiedad y sus efectos legales)", fr: "Halak (destruction de biens et ses effets juridiques)", ur: "ہلک ⁦(جائیداد کی تباہی اور اس کا قانونی اثر)⁩" }
summary:
  ar: "الهلاك في الاصطلاح خروج الشيء عن الانتفاع المقصود به، سواء بقي أو لم يبق أصلاً، ويُطلق أيضاً على الموت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548} وإن هلك المبيع قبل القبض فهو في ضمان البائع، وإن هلك عند المشتري ثم ظهر عيب قديم فيه رجع المشتري بالأرش، إلا أن يكون الهلاك بسبب عيب دلّسه البائع فيرجع بالثمن كله عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} وإن هلك المال قبل تمام الحول أو قبل التمكن من الإخراج سقطت الزكاة، وإن هلك بعد التمكن استقرت في ذمة المالك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} وإن عيّن شاة للأضحية فماتت قبل يوم النحر فلا شيء على صاحبها، أما إن هلكت بتفريط فعليه الضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16551} ويد المرتهن عند الشافعية والحنابلة يد أمانة فلا يضمن الرهن إن هلك بغير تعد، وعند الحنفية يد ضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16551}"
  en: "Halak in the legal sense is the loss of a thing's intended benefit, whether or not it survives, and it is also used of death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548} If a sold article perishes before delivery it is at the seller's risk; if it perishes with the buyer and a defect is later found, the buyer recovers the arsh (compensation for the defect), except that the Malikis hold that if the destruction was caused by a defect the seller concealed, the buyer recovers the whole price. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} If the property perishes before a year is complete, or before the owner can pay, the zakat falls away; if it perishes after the owner could pay, the zakat stands as a debt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} If a sheep or camel is designated as a sacrifice and dies before the day of sacrifice, the owner owes nothing; if it perishes through his negligence he is liable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16551} The Shafi'is and Hanbalis treat the pledgee's possession as a trust, so he is not liable for loss without fault; the Hanafis treat it as a liability. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16551}"
  es: "Halak en el sentido legal es la pérdida del beneficio previsto de una cosa, sobreviva o no, y también se usa para la muerte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548} Si un artículo vendido perece antes de la entrega, es bajo el riesgo del vendedor; si perece con el comprador y luego se encuentra un defecto, el comprador recupera el arsh (compensación por el defecto), excepto que los Malikis sostienen que si la destrucción fue causada por un defecto que el vendedor ocultó, el comprador recupera el precio completo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} Si la propiedad perece antes de que se complete un año, o antes de que el propietario pueda pagar, el zakat se pierde; Si perece después de que el propietario haya podido pagar, el zakat se considera una deuda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} Si una oveja o un camello se destina al sacrificio y muere antes del día del sacrificio, el propietario no debe nada; si perece por su negligencia, es responsable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16551} Los shafi'is y los hanbalis consideran la posesión del acreedor prendario como un fideicomiso, por lo que no es responsable de la pérdida sin culpa; los hanafíes la consideran una obligación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16551}"
  fr: "Le terme « halak », au sens juridique, désigne la perte de l'usage prévu d'une chose, qu'elle survive ou non; il s'applique également au décès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548} Si un article vendu périt avant la livraison, le vendeur en assume les risques. S'il périt avec l'acheteur et qu'un défaut est constaté ultérieurement, l'acheteur récupère l'arsh (indemnisation pour le défaut), sauf si, selon l'école malikite, la destruction est due à un défaut dissimulé par le vendeur, auquel cas l'acheteur récupère l'intégralité du prix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} Si le bien périt avant la fin de la première année ou avant que le propriétaire n'ait pu s'acquitter de la zakat, celle-ci est annulée. Si l'animal périt après que son propriétaire ait pu s'acquitter de la zakat, celle-ci demeure due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} Si un mouton ou un chameau est désigné pour le sacrifice et meurt avant le jour du sacrifice, son propriétaire n'est redevable d'aucune somme; en revanche, s'il périt par sa négligence, il est responsable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16551} Les écoles chaféite et hanbalite considèrent la possession du gagiste comme un dépôt, de sorte qu'il n'est pas responsable des pertes sans faute; l'école hanafite, quant à elle, la considère comme une obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16551}"
  ur: "حلک شرعی لحاظ سے کسی چیز کے مطلوبہ فائدے کے نقصان کو کہتے ہیں، چاہے وہ زندہ رہے یا نہ رہے، اور اس کا استعمال موت سے بھی ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16548} اگر بیچا ہوا سامان ڈیلیوری سے پہلے ہی ختم ہو جائے تو یہ بیچنے والے کے خطرے میں ہے۔ اگر وہ خریدار کے ساتھ ہی ختم ہو جائے اور بعد میں کوئی عیب معلوم ہو جائے تو خریدار عرش ⁦(عیب کا معاوضہ)⁩ وصول کر لیتا ہے، سوائے اس کے کہ مالکیہ کا خیال ہے کہ اگر بیچنے والے کے چھپائے ہوئے عیب کی وجہ سے تباہی ہوئی ہو تو خریدار پوری قیمت وصول کر لیتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16549} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16550} اگر جائیداد ایک سال مکمل ہونے سے پہلے یا مالک کے ادا کرنے سے پہلے ختم ہو جائے تو زکوٰۃ ختم ہو جائے گی۔ اگر مالک کے ادا کرنے کے بعد ختم ہو جائے تو زکوٰۃ بطور قرض ہے۔ اگر کوئی بھیڑ یا اونٹ قربانی کے لیے مقرر کیا جائے اور قربانی کے دن سے پہلے مر جائے تو مالک پر کچھ واجب نہیں ہے۔ اگر یہ اس کی غفلت سے ختم ہو جائے تو وہ ذمہ دار ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16550} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16551} شافعی اور حنبلی گروی کی ملکیت کو امانت سمجھتے ہیں، اس لیے وہ بغیر عیب کے نقصان کا ذمہ دار نہیں ہے۔ احناف اسے واجب سمجھتے ہیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص16551}"
