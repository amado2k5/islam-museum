label: { ar: "هَلاك", en: "Halak (destruction of property and its legal effect)" }
summary:
  ar: "الهلاك في الاصطلاح خروج الشيء عن الانتفاع المقصود به، سواء بقي أو لم يبق أصلاً، ويُطلق أيضاً على الموت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548} وإن هلك المبيع قبل القبض فهو في ضمان البائع، وإن هلك عند المشتري ثم ظهر عيب قديم فيه رجع المشتري بالأرش، إلا أن يكون الهلاك بسبب عيب دلّسه البائع فيرجع بالثمن كله عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} وإن هلك المال قبل تمام الحول أو قبل التمكن من الإخراج سقطت الزكاة، وإن هلك بعد التمكن استقرت في ذمة المالك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} وإن عيّن شاة للأضحية فماتت قبل يوم النحر فلا شيء على صاحبها، أما إن هلكت بتفريط فعليه الضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16551} ويد المرتهن عند الشافعية والحنابلة يد أمانة فلا يضمن الرهن إن هلك بغير تعد، وعند الحنفية يد ضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16551}"
  en: "Halak in the legal sense is the loss of a thing's intended benefit, whether or not it survives, and it is also used of death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548} If a sold article perishes before delivery it is at the seller's risk; if it perishes with the buyer and a defect is later found, the buyer recovers the arsh (compensation for the defect), except that the Malikis hold that if the destruction was caused by a defect the seller concealed, the buyer recovers the whole price. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} If the property perishes before a year is complete, or before the owner can pay, the zakat falls away; if it perishes after the owner could pay, the zakat stands as a debt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} If a sheep or camel is designated as a sacrifice and dies before the day of sacrifice, the owner owes nothing; if it perishes through his negligence he is liable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16550} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16551} The Shafi'is and Hanbalis treat the pledgee's possession as a trust, so he is not liable for loss without fault; the Hanafis treat it as a liability. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16551}"
