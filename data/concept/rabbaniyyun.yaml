id: concept/rabbaniyyun
class: concept
kind: doctrine
label:
  ar: الربانيون ⁦(التربية والنسبة إلى الرب)⁩
  en: The rabbaniyyun (training and belonging to the Lord)
  es: "El rabbaniyyun (entrenamiento y pertenencia al Señor)"
  fr: "Le rabbaniyyun (formation et appartenance au Seigneur)"
  ur: "ربانیون ⁦(تربیت اور رب سے تعلق)⁩"
  tr: "Hahamlar (Eğitim ve Rab'be Atıf)"
  id: "Para Rabbi (Pendidikan dan Atribusi kepada Tuhan)"
summary:
  ar: "يرى الشعراوي أن النسبة إلى الرب تعني أن ما يُعلّمه المربّي من الكتاب والدراسة منسوب إلى الله، وأن الربانية تقتضي أن يُتلقى النص المنهجي ثم يُفهم بالمدارسة. ويرد على من ادعى أن يُعبد الناس الأنبياء أو الملائكة بأن الشرع لا يكون لغير الله، ويعرض ذلك دون حكم {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1563}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1564}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1565}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1566}."
  en: "Sha'rawi holds that belonging to the Lord means that what the trainer teaches from the scripture is ascribed to God. Being rabbani requires receiving the text of the law and then understanding it through study together. He answers the claim that people might be made to worship prophets or angels by saying that no law is given by anyone other than God, and presents this without a verdict {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1563}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1564}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1565}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1566}."
  es: "Sha'rawi sostiene que pertenecer al Señor significa que lo que el maestro enseña de las Escrituras se atribuye a Dios. Ser rabbani requiere recibir el texto de la ley y luego comprenderlo mediante el estudio conjunto. Responde a la afirmación de que se podría hacer que la gente adore a profetas o ángeles diciendo que ninguna ley es dada por nadie más que por Dios, y presenta esto sin emitir un veredicto {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1563}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1564}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1565}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1566}."
  fr: "Sha'rawi soutient qu'appartenir au Seigneur signifie que ce que le maître enseigne à partir des Écritures est attribué à Dieu. Être rabbinique implique de recevoir le texte de la loi et de le comprendre par l'étude commune. Il répond à l'affirmation selon laquelle on pourrait inciter les gens à adorer des prophètes ou des anges en déclarant qu'aucune loi n'est donnée par quiconque d'autre que Dieu, et présente cela sans porter de jugement."
  ur: "شعراوی کا خیال ہے کہ رب سے تعلق کا مطلب یہ ہے کہ تربیت دینے والا صحیفہ سے جو کچھ سکھاتا ہے وہ خدا سے منسوب ہے۔ ربانی ہونے کے لیے قانون کے متن کو حاصل کرنے اور پھر اسے ایک ساتھ مطالعہ کے ذریعے سمجھنے کی ضرورت ہے۔ وہ اس دعوے کا جواب دیتا ہے کہ لوگوں کو انبیاء یا فرشتوں کی عبادت کرنے پر مجبور کیا جا سکتا ہے یہ کہہ کر کہ خدا کے سوا کوئی قانون نہیں دیتا، اور اسے بغیر کسی فیصلے کے پیش کرتا ہے۔ صفحہ 1564}{حوالہ:تفسیر-شعروی-خوااتیر-سکین-جلد-2 صفحہ1565}{حوالہ:تفسیر-شعروی-خواطر-اسکین-جلد-2 صفحہ 1566}۔"
  tr: "Al-Shaarawi, Tanrı'ya atfetmenin, eğitimcinin Kitap ve çalışmadan öğrettiklerinin Tanrı'ya atfedilmesi anlamına geldiğine ve ilahiyatın metodolojik metni alıp ardından çalışma yoluyla anlamayı gerektirdiğine inanır. İnsanların peygamberlere veya meleklere taptığını iddia edenleri, yasanın sadece Tanrı'ya ait olduğunu iddia ederek, bunu bir hükmü olmadan sunar {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1563}{cite:tafsir-sharawi-khawatir-scan-vol-vol-vol-2 s.1564}{cite:tafsir-sharawi-khawatir-scan-vol-vol-vol-2 s.1565}{cite:tafsir-sharawi-khawatir-scan-vol-2 s.1566}."
  id: "Al-Shaarawi percaya bahwa atribusi kepada Tuhan berarti apa yang diajarkan pendidik dari Kitab dan studi dikaitkan dengan Tuhan, dan bahwa keilahian membutuhkan penerimaan teks metodologis lalu pemahaman melalui studi. Ia membantah mereka yang mengklaim bahwa manusia menyembah nabi atau malaikat dengan mengklaim bahwa hukum hanya milik Allah, menyampaikan ini tanpa aturan {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm.1563}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm.1564}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm.1565}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm.1566}."
