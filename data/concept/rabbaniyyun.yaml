id: concept/rabbaniyyun
class: concept
kind: doctrine
label:
  ar: الربانيون (التربية والنسبة إلى الرب)
  en: The rabbaniyyun (training and belonging to the Lord)
summary:
  ar: "يرى الشعراوي أن النسبة إلى الرب تعني أن ما يُعلّمه المربّي من الكتاب والدراسة منسوب إلى الله، وأن الربانية تقتضي أن يُتلقى النص المنهجي ثم يُفهم بالمدارسة. ويرد على من ادعى أن يُعبد الناس الأنبياء أو الملائكة بأن الشرع لا يكون لغير الله، ويعرض ذلك دون حكم {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1563}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1564}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1565}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1566}."
  en: "Sha'rawi holds that belonging to the Lord means that what the trainer teaches from the scripture is ascribed to God. Being rabbani requires receiving the text of the law and then understanding it through study together. He answers the claim that people might be made to worship prophets or angels by saying that no law is given by anyone other than God, and presents this without a verdict {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1563}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1564}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1565}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1566}."
