issue:
  ar: "هل يجوز أن يُطلب من الناس تعظيم النبي أو الملائكة بالعبادة، أو يكون التعظيم بغير عبادة؟"
  en: "May people be asked to honour a prophet or angels by worship, or must honour stop short of worship?"
perspectives:
- tradition: sunni
  id: sunni-sharawi-no-worship-of-persons
  stance:
    ar: "لا يُطلب من أحد أن يُعبد من دون الله، ولا الملائكة ولا الأنبياء"
    en: "No one may ask to be worshipped besides God, nor may angels or prophets be worshipped"
  summary:
    ar: "يقرر الشعراوي أن من آتاه الله الكتاب والحكم والنبوة لا يقول للناس اعبدوني ولا اتخذوا الملائكة والأنبياء أرباباً، وأن الصحابة الذين أرادوا تعظيم النبي بالسجود له لم يُقرّهم، فقال إن السجود لا يكون إلا لله {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1564}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1566}."
    en: "Sha'rawi holds that one whom God has given scripture, wisdom and prophethood would not tell people to worship him, nor to take angels and prophets as lords. He says that when some companions wanted to honour the Prophet by prostrating to him, the Prophet did not accept it, and that prostration is due to God alone {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1564}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1566}."
