perspectives:
- tradition: sunni
  id: sunni-sharawi-diya-aqila
  stance:
    ar: "الدية على العاقلة لا على القاتل وحده، ولا تؤخذ من الأصول والفروع، وفيها جبر لأهل القتيل وتوازن للمجتمع"
    en: "The blood-money falls on the kin group rather than the killer alone, is not taken from his ascendants or descendants, and compensates the family and balances society"
  summary:
    ar: "يذكر الشعراوي أن الدية تؤديها قرابة القاتل، ولا تؤخذ من أصوله وفروعه حتى لا تجتمع عليهم مصيبة القتل مع فزع المشاركة فيه {cite:tafsir-sharawi-khawatir-scan p.2543}{cite:tafsir-sharawi-khawatir-scan p.2547}. ويرى أن القريب إذا علم أنه سيشارك في الدية تعلّم صون حقوق غيره {cite:tafsir-sharawi-khawatir-scan p.2543}. ويرى أن الدية التي تُسلَّم إلى أهل القتيل المسلم تجبر فقدهم، وأن عفوهم عنها يورث مودة في الأسرتين {cite:tafsir-sharawi-khawatir-scan p.2544}{cite:tafsir-sharawi-khawatir-scan p.2545}. وهذا رأيه في تفسير الآية، ولم تُعرض بعد أحكام الفقهاء في تحديد العاقلة ومقدار الدية من مصدر محدد (needs_source)."
    en: "Sha'rawi says the blood-money is paid by the killer's kin, and not from his ascendants or descendants, so that the grief of the killing is not compounded by the burden of paying {cite:tafsir-sharawi-khawatir-scan p.2543}{cite:tafsir-sharawi-khawatir-scan p.2547}. He holds that a relative who knows he will share the payment learns to protect others' rights {cite:tafsir-sharawi-khawatir-scan p.2543}. He holds that blood-money paid to the family of a Muslim victim consoles them, and that forgiving it breeds affection between the families {cite:tafsir-sharawi-khawatir-scan p.2544}{cite:tafsir-sharawi-khawatir-scan p.2545}. This is his reading of the verse; the jurists' rules on who is the aqila and on the amount are not yet set out from a named source (needs_source)."
