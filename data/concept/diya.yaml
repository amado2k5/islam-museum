label:
  ar: الدية
  en: Blood-money (diya)
summary:
  ar: "الدية في تفسير الشعراوي لآية القتل الخطأ: تحرير رقبة مؤمنة، ثم دية مسلّمة إلى أهل القتيل في البيئة المؤمنة. ويرى أن العاقلة، أي قرابة القاتل، هي التي تؤديها، ولا تُؤخذ من أصوله وفروعه، وأن في ذلك وقاية للمجتمع من رد الفعل {cite:tafsir-sharawi-khawatir-scan p.2543}."
  en: "Blood-money in Sha'rawi's commentary on the verse about accidental killing: a believing slave is freed and blood-money is paid to the victim's family in a believing setting. He holds that the kin group (aqila) pays it, not the killer alone, and that it is not taken from the killer's ascendants or descendants; its purpose is to prevent a reaction in society {cite:tafsir-sharawi-khawatir-scan p.2543}."
