id: concept/khusya
class: concept
kind: natural
label:
  ar: "خصية"
  en: "Khusya (entry on the testicles of animals)"
  ur: "خصیہ"
  es: "Khusya (entrada sobre los testículos de los animales)"
  fr: "Khusya (entrée sur les testicules des animaux)"
summary:
  ar: "خصية في الكتاب من جنس اللحم الرخو من أعضاء الحيوان، أجودها خصى الفتيان وخصى الكبار مثل التيوس والكباش، والثور لا ينهضم، وليس كخصى الديوك لا سيما المسمنة فإنها جيدة جدا، وجميع أصناف الخصى إذا انهضم يغذو غذاء كثيرا، وأكثرها عسرة الهضم كثيرة الغذاء، خصوصا ما كان من الحيوان الكبير الغليظ اللحم؛ وكل ما ورد هنا نقل منسوب إلى الكتاب لا توصية {cite:canon-ibn-sina-print-v1 pp.703-704}"
  en: "Khusya is in the book of the kind of the soft flesh among the organs of animals; the best are those of the young and of the grown such as he-goats and rams, that of the bull is not digested, and they are not like those of cocks, especially the fattened, which are very good; all kinds, once digested, nourish much, and most are hard to digest and much nourishing, especially those of a large animal with thick flesh; everything given here is a report attributed to the book, not a recommendation {cite:canon-ibn-sina-print-v1 pp.703-704}"
  ur: "خصیہ کتاب میں جانوروں کے اعضاء میں نرم گوشت کی جنس سے ہے؛ سب سے اچھے جوانوں اور بڑوں جیسے بکروں اور مینڈھوں کے ہیں، بیل کا ہضم نہیں ہوتا، اور مرغوں کے جیسے نہیں خصوصاً موٹے کیے ہوئے جو بہت اچھے ہیں؛ تمام قسمیں ہضم ہو جائیں تو بہت غذا دیتی ہیں، اور اکثر مشکل سے ہضم ہونے والی اور بہت غذا دینے والی ہیں، خصوصاً بڑے جانور کی جس کا گوشت موٹا ہو؛ یہاں جو کچھ آیا وہ کتاب سے منسوب نقل ہے، سفارش نہیں {cite:canon-ibn-sina-print-v1 pp.703-704}۔"
  es: "Khusya se encuentra en el libro de la carne blanda entre los órganos de los animales; los mejores son los de los jóvenes y los adultos, como los machos cabríos y los carneros; el del toro no se digiere, y no son como los de los gallos, especialmente los engordados, que son muy buenos; todos los tipos, una vez digeridos, son muy nutritivos, y la mayoría son difíciles de digerir y muy nutritivos, especialmente los de un animal grande con carne gruesa; todo lo que se da aquí es un informe atribuido al libro, no una recomendación {cite:canon-ibn-sina-print-v1 pp.703-704}"
  fr: "Khusya est mentionnée dans le livre comme étant la meilleure chair parmi les abats des animaux; les meilleurs sont ceux des jeunes et des adultes comme les boucs et les béliers; celui du taureau est difficile à digérer, et il est différent de celui des coqs, surtout ceux qui sont gras, et qui sont excellents; tous les abats, une fois digérés, sont très nourrissants, et la plupart sont difficiles à digérer et très nourrissants, en particulier ceux des grands animaux à chair épaisse; tout ce qui est dit ici est un rapport attribué au livre, et non une recommandation. {cite:canon-ibn-sina-print-v1 pp.703-704}"
