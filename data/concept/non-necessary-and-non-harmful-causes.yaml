label: { ar: "الأسباب غير الضرورية ولا الضارة عند ابن سينا", en: "The causes that are neither necessary nor harmful in the Canon", ur: "قانون میں نہ ضروری نہ نقصان دہ اسباب" }
summary:
  ar: "في الفصل الثامن عشر يتكلم ابن سينا في الأسباب غير الضرورية ولا الضارة، وهي التي ليست بجنسيتها في الطبع ولا هي مضادة للطبع، وهي الأشياء الملاقية للبدن غير الهواء، فإنه ضروري، مثل الاستحمامات وأنواع الدلك {cite:canon-ibn-sina-print-v1 p.139}."
  en: "In the eighteenth chapter Ibn Sina treats the causes that are neither necessary nor harmful: those that are not by their kind part of the nature and are not opposed to it. These are the things that meet the body other than the air, which is necessary, such as baths and kinds of rubbing {cite:canon-ibn-sina-print-v1 p.139}."
