id: concept/non-necessary-and-non-harmful-causes
class: concept
kind: scientific
label: { ar: "الأسباب غير الضرورية ولا الضارة عند ابن سينا", en: "The causes that are neither necessary nor harmful in the Canon", ur: "قانون میں نہ ضروری نہ نقصان دہ اسباب", es: "Las causas que no son ni necesarias ni perjudiciales en el Canon", fr: "Les causes qui ne sont ni nécessaires ni nuisibles dans le Canon" }
summary:
  ar: "في الفصل الثامن عشر يتكلم ابن سينا في الأسباب غير الضرورية ولا الضارة، وهي التي ليست بجنسيتها في الطبع ولا هي مضادة للطبع، وهي الأشياء الملاقية للبدن غير الهواء، فإنه ضروري، مثل الاستحمامات وأنواع الدلك {cite:canon-ibn-sina-print-v1 p.139}."
  en: "In the eighteenth chapter Ibn Sina treats the causes that are neither necessary nor harmful: those that are not by their kind part of the nature and are not opposed to it. These are the things that meet the body other than the air, which is necessary, such as baths and kinds of rubbing {cite:canon-ibn-sina-print-v1 p.139}."
  es: "En el capítulo dieciocho, Ibn Sina trata las causas que no son ni necesarias ni perjudiciales: aquellas que, por su naturaleza, no forman parte de ella ni se oponen a ella. Se trata de las cosas que entran en contacto con el cuerpo, además del aire, que es necesario, como los baños y los tipos de frotamiento {cite:canon-ibn-sina-print-v1 p.139}."
  fr: "Au chapitre dix-huit, Ibn Sina traite des causes qui ne sont ni nécessaires ni nuisibles: celles qui ne font pas partie intégrante de la nature et ne s’y opposent pas. Il s’agit des éléments qui entrent en contact avec le corps, outre l’air, qui est nécessaire, tels que les bains et les frictions."
  ur: "اٹھارویں باب میں ابن سینا نے ان اسباب کا تذکرہ کیا ہے جو نہ تو ضروری ہیں اور نہ نقصان دہ ہیں: وہ جو اپنی نوعیت کے اعتبار سے نہ ہوں اور نہ اس کے مخالف ہوں۔ یہ وہ چیزیں ہیں جو ہوا کے علاوہ جسم سے ملتی ہیں، جو ضروری ہیں، جیسے غسل اور رگڑنے کی قسمیں"
