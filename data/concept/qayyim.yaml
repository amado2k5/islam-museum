id: concept/qayyim
class: concept
kind: legal
label:
  ar: "قَيِّم"
  en: "Appointed guardian (qayyim)"
  ur: "قیّم"
summary:
  ar: "القيم في الاصطلاح من يعينه الحاكم لتنفيذ وصية من لم يعين وصياً، وللقيام بأمر المحجورين من الأطفال والمجانين والسفهاء، وحفظ أموال المفقودين الذين لا وكيل لهم، وتتأخر ولايته عن ولاية الأب والجد ووصييهما. ويقيّد تصرفه بما أذن له فيه القاضي، ولا يملك الشراء لنفسه عند الجمهور، ويملك القاضي عزله دون وصي الأصل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13160} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13161} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13162}"
  en: "In the jurists' terms a qayyim is a person appointed by the judge to carry out the bequest of someone who named no executor, to manage the affairs of minors, the insane and the spendthrift, and to guard the property of absent persons who have no agent. His authority comes after that of the father, the grandfather and their executors. The judge limits what he may do to what the judge has authorised; most jurists forbid him to buy for himself; and the judge may dismiss him, though not the executor of an original guardian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13160} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13161} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13162}"
  ur: "اصطلاح میں قیّم وہ شخص ہے جسے حاکم اس شخص کی وصیت پر عمل کے لیے مقرر کرے جس نے کسی کو وصی نہ بنایا ہو، یا نابالغ، مجنون اور سفیہ کے معاملات سنبھالنے کے لیے، یا ایسے غائب شخص کے مال کی حفاظت کے لیے جس کا کوئی وکیل نہ ہو۔ اس کی ولایت باپ، دادا اور ان کے وصیوں کے بعد آتی ہے۔ حاکم اس کے تصرف کو اسی حد تک محدود رکھتا ہے جس کی اس نے اجازت دی ہو، جمہور کے نزدیک وہ اپنے لیے خرید نہیں سکتا، اور حاکم اسے معزول کر سکتا ہے، مگر اصل وصی کو نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13160} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13161} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13162}"
