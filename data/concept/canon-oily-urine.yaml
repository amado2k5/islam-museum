id: concept/canon-oily-urine
class: concept
kind: scientific
label:
  ar: "البول الزيتي عند ابن سينا"
  en: "Oily urine in the Canon"
  fr: "Urine huileuse dans le Canon"
  ur: "تیل جیسا پیشاب قانون میں"
  es: "Orina aceitosa en el cañón"
  tr: "İbn Sina'ya göre yağlı idrar"
  id: "Urin berminyak menurut Ibn Sina"
summary:
  ar: "يصف ابن سينا البول الزيتي وهو صفرة يخالطها خضرة كالزيت في اللزوجة والإشفاف والبريق الدسمي، ويقرر أنه في أكثر الأحوال يدل على الشر، ويقسمه ثلاثة أصناف {cite:canon-ibn-sina-print-v1 p.188}."
  en: "Ibn Sina describes oily urine, a yellow mixed with green like oil in viscosity, transparency and fatty sheen, holds that it mostly shows evil, and divides it into three kinds {cite:canon-ibn-sina-print-v1 p.188}."
  fr: "Ibn Sina décrit jaune mêlé de vert, viscosité, transparence et lustre gras d’huile, généralement mauvais, et distingue trois types {cite:canon-ibn-sina-print-v1 p.188}."
  es: "Ibn Sina describe la orina aceitosa, de color amarillo mezclado con verde como el aceite en viscosidad, transparencia y brillo graso, sostiene que en su mayoría muestra el mal y la divide en tres tipos {cite:canon-ibn-sina-print-v1 p.188}."
  ur: "ابن سینا نے تیل والے پیشاب کو بیان کیا ہے، ایک زرد رنگ جس میں سبز جیسے تیل کی چپکنے والی، شفافیت اور چکنائی والی چمک ہوتی ہے، اس کا خیال ہے کہ یہ زیادہ تر برائی کو ظاہر کرتا ہے، اور اسے تین قسموں میں تقسیم کرتا ہے۔"
  tr: "İbn Sina, yağlı idrarı tanımlar; bu, yapışkanlık, viskozite ve kremamsı parlaklık bakımından yağ gibi yeşillikle karışmış sarımsı bir maddedir ve çoğu durumda bunun kötülüğü gösterdiğini, bunu üç tipe ayırdığını belirtir {cite:canon-ibn-sina-print-v1 s.188}."
  id: "Ibn Sina menggambarkan urin berminyak, yaitu zat kekuningan yang bercampur dengan kehijauan seperti minyak dalam viskositas, viskositas, dan kilau krim, dan ia menyatakan bahwa dalam banyak kasus itu menunjukkan kejahatan, membaginya menjadi tiga jenis {cite:canon-ibn-sina-print-v1 hlm.188}."
