id: concept/muqtada
class: concept
kind: term
label: { ar: "المُقْتَضَى", en: "Implied meaning (muqtada)", ur: "مقتضیٰ ⁦(مضمر معنی)⁩", es: "Significado implícito (muqtada)", fr: "Signification implicite (muqtada)", tr: "Zorunlu", id: "Diperlukan" }
summary:
  ar: "المقتضى في اللغة الدلالة، وفي الاصطلاح الأصولي اللفظ الذي لا يستقيم إلا بإضمار شيء فيه، وهو المقتضَى بفتح الضاد: ما أضمر في الكلام ضرورة صدق المتكلم، كقوله تعالى في سورة يوسف «واسأل القرية». وذهب جمهور الأصوليين إلى أنه لا عموم للمقتضَى، وذهب الشافعي وجمهور الحنابلة إلى أن له عموما. وتفصيل ذلك في الملحق الأصولي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14917}"
  en: "Muqtada is, in the lexicon, implication. In usul it is an utterance that cannot stand unless something is supplied in it, and the supplied item is also called the muqtada. It is what is understood in the speech out of necessity to make the speaker truthful, as in the verse of Surat Yusuf that names the town to be asked. The majority of usul scholars deny it generality; al-Shafi'i and most Hanbalis grant it. The details are in the usul appendix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14917}"
  ur: "مقتضیٰ اصول فقہ میں وہ معنی ہے جو کلام کی درستگی کے لیے مضمر مانا جائے، جیسے سورۂ یوسف میں بستی کا مضمر ہونا۔ جمہور اصولیین کے نزدیک اس کے لیے عموم نہیں، جب کہ امام شافعی اور اکثر حنابلہ کے نزدیک عموم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14917}"
  es: "Muqtada significa, en el léxico, implicación. En usul, es una expresión que no puede sostenerse a menos que se le añada algo, y ese elemento añadido también se denomina muqtada. Es lo que se sobreentiende en el discurso por necesidad para que el hablante diga la verdad, como en el versículo de la Sura Yusuf que nombra la ciudad a la que se debe preguntar. La mayoría de los eruditos de usul niegan su generalidad; al-Shafi'i y la mayoría de los hanbalíes la aceptan. Los detalles se encuentran en el apéndice de usul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14917}"
  fr: "Dans le lexique, la muqtada signifie implication. En usul, il s'agit d'un énoncé qui ne peut être maintenu que s'il est complété par un élément, également appelé muqtada. C'est ce qui est sous-entendu dans le discours par nécessité pour que l'orateur soit considéré comme véridique, comme dans le verset de la sourate Yusuf qui nomme la ville à interroger. La majorité des savants d'usul en rejettent la généralité; al-Shafi'i et la plupart des hanbalites l'admettent. Les détails se trouvent dans l'annexe relative à l'usul."
  tr: "Dildeki gereklilik, Usuli terminolojisinde, sadece içinde bir şey ima ederek doğru olmayan bir kelimedir; bu da dhad üzerine bir fetha ile yapılan gerekliliktir: konuşmada konuşanın doğruluğunun gerekli olduğu ima edilen şeydir, örneğin Yusuf Suresi'nde söylediği gibi: 'Köye sor.' Usul âlimlerinin çoğu, ima edilen bir genellik olmadığını savunurken, Şafii ve Hanbali çoğunlukları bunun genel bir kural olduğunu savunmuştur. Bunun ayrıntıları Usuli ekinde bulunmaktadır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.14915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14917}"
  id: "Persyaratan dalam bahasa adalah indikasi, dan dalam terminologi Usuli, sebuah kata yang tidak benar kecuali dengan menyiratkan sesuatu di dalamnya, yaitu persyaratan dengan fatha pada dhad: yang tersirat dalam ucapan bahwa kebenaran penutur itu diperlukan, seperti dalam perkataan-Nya dalam Surah Yusuf: 'Tanyakan pada desa.' Mayoritas ulama usul berpendapat bahwa tidak ada generalisasi implikasi, sementara mayoritas Shafi'i dan Hanbali berpendapat bahwa implikasi itu memiliki aturan umum. Rincian ini ada dalam lampiran Usuli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14917}"
