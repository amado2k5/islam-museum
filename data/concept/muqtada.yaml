id: concept/muqtada
class: concept
kind: term
label: { ar: "المُقْتَضَى", en: "Implied meaning (muqtada)", ur: "مقتضیٰ (مضمر معنی)" }
summary:
  ar: "المقتضى في اللغة الدلالة، وفي الاصطلاح الأصولي اللفظ الذي لا يستقيم إلا بإضمار شيء فيه، وهو المقتضَى بفتح الضاد: ما أضمر في الكلام ضرورة صدق المتكلم، كقوله تعالى في سورة يوسف «واسأل القرية». وذهب جمهور الأصوليين إلى أنه لا عموم للمقتضَى، وذهب الشافعي وجمهور الحنابلة إلى أن له عموما. وتفصيل ذلك في الملحق الأصولي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14917}"
  en: "Muqtada is, in the lexicon, implication. In usul it is an utterance that cannot stand unless something is supplied in it, and the supplied item is also called the muqtada. It is what is understood in the speech out of necessity to make the speaker truthful, as in the verse of Surat Yusuf that names the town to be asked. The majority of usul scholars deny it generality; al-Shafi'i and most Hanbalis grant it. The details are in the usul appendix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14917}"
  ur: "مقتضیٰ اصول فقہ میں وہ معنی ہے جو کلام کی درستگی کے لیے مضمر مانا جائے، جیسے سورۂ یوسف میں بستی کا مضمر ہونا۔ جمہور اصولیین کے نزدیک اس کے لیے عموم نہیں، جب کہ امام شافعی اور اکثر حنابلہ کے نزدیک عموم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14917}"
