label: { ar: "الحزن", en: "Sorrow (huzn) as a station", ur: "حزن", es: "Tristeza (huzn) como estación", fr: "Le chagrin (huzn) comme station", tr: "üzüntü", id: "kesedihan" }
summary:
  ar: "المنزلة الثالثة عشرة من منازل السالكين في مدارج السالكين لابن قيم الجوزية؛ يقرر أنها ليست من المنازل المطلوبة وإن كان لا بد للسالك من نزولها، لأن الحزن لم يأت في القرآن إلا منهياً عنه أو منفياً، ويفرق بينه وبين الهم، ويضعّف الأخبار التي تمدح الحزن، ويشرح درجات الهروي الثلاث فيه."
  en: "The thirteenth of the wayfarers' stations in Ibn Qayyim al-Jawziyya's Madarij al-Salikin. He holds that it is not a station to be sought, though every wayfarer must pass through it, since sorrow appears in the Qur'an only as forbidden or denied; he distinguishes it from worry (hamm), questions the reports that praise sorrow, and explains al-Harawi's three degrees of it."
  ur: "ابن قیم الجوزیہ کی مدارج السالکین میں سالکین کی تیرہویں منزل۔ ان کے نزدیک یہ مطلوب منزل نہیں، اگرچہ ہر سالک کو اس سے گزرنا پڑتا ہے، کیونکہ قرآن میں حزن صرف ممنوع یا منفی صورت میں آیا ہے؛ وہ اسے ہمّ ⁦(فکر)⁩ سے الگ کرتے ہیں، حزن کی تعریف کرنے والی روایات پر کلام کرتے ہیں، اور اس کے بارے میں ہروی کے تین درجوں کی شرح کرتے ہیں۔"
  es: "La decimotercera de las estaciones de los peregrinos en el Madarij al-Salikin de Ibn Qayyim al-Jawziyya. Sostiene que no es una estación que se deba buscar, aunque todo peregrino debe pasar por ella, ya que el dolor aparece en el Corán solo como prohibido o negado; lo distingue de la preocupación (hamm), cuestiona los relatos que alaban el dolor y explica los tres grados del mismo según al-Harawi."
  fr: "La treizième étape du parcours du voyageur, selon Ibn Qayyim al-Jawziyya dans son ouvrage Madarij al-Salikin, est considérée comme une étape incontournable, bien que tout voyageur doive y passer. Il soutient que la tristesse n'est pas une étape à rechercher, car le Coran la présente uniquement comme interdite ou niée. Il la distingue de l'inquiétude (hamm), remet en question les hadiths qui font l'éloge de la tristesse et explique les trois degrés de celle-ci selon al-Harawi."
  tr: "İbn Kayyim al-Jawziyyah'ın Medreci'l-Salikin'deki arayanların on üçüncü durağı; arayan kişinin oraya inmesi gerektiği halde bunun gerekli mevkiler arasında olmadığını belirtir; çünkü üzüntü Kur'an'da sadece yasak veya sürgün olarak görünür, bu da onu endişeden ayırır, üzüntüyü öven haberleri zayıflatır ve içinde üç derece Haravi'nin açıklanmasını sağlar."
  id: "Stasiun ketiga belas di antara para pencari di Madarij al-Salikin oleh Ibn Qayyim al-Jawziyyah; ia menyatakan bahwa itu bukan salah satu tempat yang diperlukan, meskipun pencari harus turun ke sana, karena kesedihan tidak muncul dalam Al-Qur'an kecuali sebagai sesuatu yang dilarang atau diasingkan, membedakannya dari kekhawatiran, melemahkan laporan yang memuji kesedihan, dan menjelaskan tiga derajat al-Harawi di dalamnya."
