label: { ar: "الحزن", en: "Sorrow (huzn) as a station", ur: "حزن" }
summary:
  ar: "المنزلة الثالثة عشرة من منازل السالكين في مدارج السالكين لابن قيم الجوزية؛ يقرر أنها ليست من المنازل المطلوبة وإن كان لا بد للسالك من نزولها، لأن الحزن لم يأت في القرآن إلا منهياً عنه أو منفياً، ويفرق بينه وبين الهم، ويضعّف الأخبار التي تمدح الحزن، ويشرح درجات الهروي الثلاث فيه."
  en: "The thirteenth of the wayfarers' stations in Ibn Qayyim al-Jawziyya's Madarij al-Salikin. He holds that it is not a station to be sought, though every wayfarer must pass through it, since sorrow appears in the Qur'an only as forbidden or denied; he distinguishes it from worry (hamm), questions the reports that praise sorrow, and explains al-Harawi's three degrees of it."
  ur: "ابن قیم الجوزیہ کی مدارج السالکین میں سالکین کی تیرہویں منزل۔ ان کے نزدیک یہ مطلوب منزل نہیں، اگرچہ ہر سالک کو اس سے گزرنا پڑتا ہے، کیونکہ قرآن میں حزن صرف ممنوع یا منفی صورت میں آیا ہے؛ وہ اسے ہمّ (فکر) سے الگ کرتے ہیں، حزن کی تعریف کرنے والی روایات پر کلام کرتے ہیں، اور اس کے بارے میں ہروی کے تین درجوں کی شرح کرتے ہیں۔"
