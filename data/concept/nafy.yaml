label: { ar: "النَّفْي (التغريب والإبعاد)", en: "Nafy (exile and banishment)", ur: "نفی (جلاوطنی اور اخراج)" }
summary:
  ar: "النفي في اللغة التغريب والطرد والإبعاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15947} وفي تفسير الآية في سورة المائدة ثلاثة أقوال: التشريد في البلدان عند الحنابلة والشافعية في قول، والحبس عند الحنفية والشافعية وبعض الحنابلة، والجمع بين الإبعاد والحبس عند مالك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15948} وشُرع النفي بالكتاب والسنة والإجماع، وهو واجب في حد الحرابة، ومشروع في التعزير، وعند جمهور الفقهاء واجب في حد الزنا لغير المحصن، وعند الحنفية تعزير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15950} وفي الزنا مدته سنة عند الجمهور، وفي الحرابة حتى تظهر التوبة، وفي التعزير بقدر ما يرى القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15953} وتنتهي العقوبة بانتهاء المدة أو بالموت أو بالجنون أو بالمرض المهلك أو بالعفو أو بالشفاعة على تفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15960} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15961} والمرأة لا تُغرَّب عند الحنفية والمالكية، وعند الشافعية والحنابلة لا تُغرَّب إلا مع محرم أو نسوة ثقات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15958}"
  en: "Nafy, in the lexicon, is banishment, driving out and removal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15947} The Qur'anic phrase about exile has three readings: wandering through the lands, favoured by the Hanbalis and in one Shafi'i view; imprisonment, favoured by the Hanafis, Shafi'is and some Hanbalis; and a combination of removal and imprisonment, favoured by Malik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15948} Exile is established by the Qur'an, the Sunna and consensus. It is required for banditry, permitted as discretionary punishment, and according to most jurists required for fornication by an unmarried free person, though the Hanafis treat it as discretionary. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15950} For fornication its term is a year according to the majority; for banditry it lasts until repentance is evident; for discretionary exile the judge decides. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15953} It ends with the term, death, insanity, a fatal illness, pardon or intercession, with details. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15960} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15961} Women are not exiled by the Hanafis and Malikis; the Shafi'is and Hanbalis exile a woman only with a mahram or trustworthy women. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15958}"
  ur: "نفی لغت میں جلاوطن کرنے، دور کرنے اور نکالنے کو کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15947} قرآن کی آیت میں جلاوطنی کی تفسیر میں تین اقوال ہیں: شہروں میں مارے مارے پھرانا، قید کرنا، اور مالک کے نزدیک دونوں کو جمع کرنا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15948} زنا کے حد میں غیر شادی شدہ آزاد شخص کے لیے ایک سال کی جلاوطنی جمہور کے نزدیک واجب ہے، جبکہ حنفیہ اسے تعزیر کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15950} عورت کو حنفیہ اور مالکیہ جلاوطن نہیں کرتے، اور شافعیہ و حنابلہ محرم یا ثقہ عورتوں کے ساتھ ہی جلاوطن کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15958}"
