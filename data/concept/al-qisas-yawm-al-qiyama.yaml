id: concept/al-qisas-yawm-al-qiyama
class: concept
kind: belief
label:
  ar: "القصاص بين الخلق يوم القيامة"
  en: "Retaliation among creatures on the Day"
  fr: "La rétribution entre les créatures au Jour de la Résurrection"
  ur: "قیامت کے دن مخلوق میں قصاص"
  es: "Represalias entre criaturas en el Día"
  tr: "Kıyamet Günü'nde yaratılış arasında intikam"
  id: "Balas dendam di antara ciptaan pada Hari Penghakiman"
summary:
  ar: "تؤدى المظالم يوم القيامة حتى يُقتص للشاة الجماء من القرناء، وينزل الخلق في بعضهم خصومات حتى يقتص الله بينهم؛ ومن كانت له مظلمة عند أخيه فليتحلله منها قبل أن يؤخذ له من حسناته {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  en: "Wrongs are settled on the Day until retaliation is taken for the hornless ewe from the horned; creatures have claims against one another and God settles between them — whoever owes his brother a wrong should clear it before good deeds are taken for it {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  fr: "Ce Jour-là, les torts sont réglés jusque dans le cas de la brebis sans cornes lésée par la brebis cornue. Les créatures ont des griefs les unes contre les autres, et Dieu tranche entre elles. Qui a lésé son frère doit obtenir son pardon avant que de bonnes œuvres ne lui soient prélevées à ce titre {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  ur: "قیامت کے دن مظالم ادا کیے جائیں گے یہاں تک کہ سینگ والے بکری سے بے سینگ بکری کا بدلہ لیا جائے گا؛ مخلوق کے ایک دوسرے پر حقوق ہوں گے اور اللہ ان کے درمیان فیصلہ کرے گا — جس نے اپنے بھائی پر ظلم کیا ہو وہ پہلے صفائی کر لے ورنہ نیکیاں لی جائیں گی {cite:sahih-al-bukhari} {cite:sahih-muslim}۔"
  es: "Las injusticias se resuelven en el Día hasta que se tome represalia por la oveja sin cuernos de la que tiene cuernos; las criaturas tienen reclamaciones unas contra otras y Dios resuelve entre ellas; quien le deba una injusticia a su hermano debe saldarla antes de que se tomen buenas obras por ella {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  tr: "Kıyamet gününde haksızlıklar yapılacak, ta ki koyun develerden ceza alana kadar; insanlar aralarında kavga çıkaracak, ta ki Allah aralarında intikam alana kadar; ve kim kardeşine kin besliyorsa, iyi işlerinden koparılmadan önce onu ondan alsın {atı:sahih-al-bukhari} {cite:sahih-muslim}."
  id: "Pada Hari Kebangkitan, ketidakadilan akan terjadi sampai domba-domba dihukum oleh unta; orang-orang akan mulai bertengkar di antara mereka sampai Allah membalas dendam di antara mereka; dan siapa pun yang menyimpan kebencian kepada saudaranya, biarlah dia mengambilnya sebelum dia terputus dari perbuatan baiknya {nama: Sahih al-Bukhari} {cite: sahih-muslim}."
