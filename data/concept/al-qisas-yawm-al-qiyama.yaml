id: concept/al-qisas-yawm-al-qiyama
class: concept
kind: belief
label:
  ar: "القصاص بين الخلق يوم القيامة"
  en: "Retaliation among creatures on the Day"
  ur: "قیامت کے دن مخلوق میں قصاص"
summary:
  ar: "تؤدى المظالم يوم القيامة حتى يُقتص للشاة الجماء من القرناء، وينزل الخلق في بعضهم خصومات حتى يقتص الله بينهم؛ ومن كانت له مظلمة عند أخيه فليتحلله منها قبل أن يؤخذ له من حسناته {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  en: "Wrongs are settled on the Day until retaliation is taken for the hornless ewe from the horned; creatures have claims against one another and God settles between them — whoever owes his brother a wrong should clear it before good deeds are taken for it {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  ur: "قیامت کے دن مظالم ادا کیے جائیں گے یہاں تک کہ سینگ والے بکری سے بے سینگ بکری کا بدلہ لیا جائے گا؛ مخلوق کے ایک دوسرے پر حقوق ہوں گے اور اللہ ان کے درمیان فیصلہ کرے گا — جس نے اپنے بھائی پر ظلم کیا ہو وہ پہلے صفائی کر لے ورنہ نیکیاں لی جائیں گی {cite:sahih-al-bukhari} {cite:sahih-muslim}۔"
