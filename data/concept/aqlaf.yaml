label: { ar: "الأقلف", en: "Aqlaf (an uncircumcised man)" }
summary:
  ar: "الأقلف هو الذي لم يُختتن، ويقابله المختون، وإزالة القلفة تسمى ختانا في الرجل وخفضا في المرأة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} وإزالة القلفة من سنن الفطرة باتفاق الفقهاء، ومن أهل العلم من جعلها فرضا كالشافعية والحنابلة، وعند الحنفية والمالكية سنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} ويختص الأقلف بأحكام، منها رد شهادته عند بعض الفقهاء إن ترك الختان لغير عذر، وجواز ذبيحته عند الجمهور، وأن من أزال القلفة بغير إذن صاحبها فلا ضمان عليه، وأن تطهير ما تحتها واجب عند الشافعية والحنابلة وتصح إمامته عند الحنفية مع الكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3229}"
  en: "Aqlaf is a man who has not been circumcised; its opposite is the mukhtatan (circumcised). Removing the foreskin is called khitan in men and khafd in women. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} The jurists agree that removing the foreskin is one of the practices of the fitra; the Shafi'is and Hanbalis hold it obligatory, while the Hanafis and Malikis hold it a sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} An uncircumcised man has particular rulings: some jurists reject his testimony if he left it uncut without excuse, the majority allow his slaughter, and whoever removes the foreskin without the owner's leave owes nothing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} The Shafi'is and Hanbalis require washing under the foreskin, and they hold a man who does not wash it invalid as a prayer leader; the Hanafis allow him to lead with a dislike, and the Malikis allow it but dislike appointing him as regular imam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3229}"
