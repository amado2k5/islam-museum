label: { ar: "الأقلف", en: "Aqlaf (an uncircumcised man)", fr: "Aqlaf (un homme non circoncis)", es: "Aqlaf (un hombre incircunciso)", ur: "اقلاف ⁦(غیر ختنہ شدہ آدمی)⁩" }
summary:
  ar: "الأقلف هو الذي لم يُختتن، ويقابله المختون، وإزالة القلفة تسمى ختانا في الرجل وخفضا في المرأة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} وإزالة القلفة من سنن الفطرة باتفاق الفقهاء، ومن أهل العلم من جعلها فرضا كالشافعية والحنابلة، وعند الحنفية والمالكية سنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} ويختص الأقلف بأحكام، منها رد شهادته عند بعض الفقهاء إن ترك الختان لغير عذر، وجواز ذبيحته عند الجمهور، وأن من أزال القلفة بغير إذن صاحبها فلا ضمان عليه، وأن تطهير ما تحتها واجب عند الشافعية والحنابلة وتصح إمامته عند الحنفية مع الكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3229}"
  en: "Aqlaf is a man who has not been circumcised; its opposite is the mukhtatan (circumcised). Removing the foreskin is called khitan in men and khafd in women. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} The jurists agree that removing the foreskin is one of the practices of the fitra; the Shafi'is and Hanbalis hold it obligatory, while the Hanafis and Malikis hold it a sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} An uncircumcised man has particular rulings: some jurists reject his testimony if he left it uncut without excuse, the majority allow his slaughter, and whoever removes the foreskin without the owner's leave owes nothing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} The Shafi'is and Hanbalis require washing under the foreskin, and they hold a man who does not wash it invalid as a prayer leader; the Hanafis allow him to lead with a dislike, and the Malikis allow it but dislike appointing him as regular imam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3229}"
  fr: "Aqlaf désigne un homme qui n’a pas été circoncis ; son opposé est le mukhtatan (circoncis). L’ablation du prépuce est appelée khitan chez les hommes et khafd chez les femmes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} Les juristes s’accordent à faire de l’ablation du prépuce l’une des pratiques de la fitra ; les shafiites et les hanbalites la tiennent pour obligatoire, tandis que les hanafites et les malikites la tiennent pour une sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} Un homme non circoncis est soumis à des règles particulières : certains juristes rejettent son témoignage s’il l’a laissé intact sans excuse, la majorité autorise son abattage, et celui qui ôte le prépuce sans l’autorisation de l’intéressé ne doit rien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} Les shafiites et les hanbalites exigent le lavage sous le prépuce et tiennent l’homme qui ne le lave pas pour inapte à diriger valablement la prière ; les hanafites l’autorisent à la diriger avec réprobation, et les malikites l’autorisent, mais réprouvent sa désignation comme imam attitré. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3229}"
  es: "Aqlaf es un hombre que no ha sido circuncidado; su opuesto es mukhtatan (circuncidado). Quitar el prepucio se llama khitan en los hombres y khafd en las mujeres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} Los juristas coinciden en que quitar el prepucio es una de las prácticas de la fitra; los shafi'is y hanbalis lo consideran obligatorio, mientras que los hanafis y malikíes lo consideran una sunna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} Un hombre incircunciso tiene normas particulares: algunos juristas rechazan su testimonio si lo dejó sin cortar sin excusa, la mayoría permite su sacrificio, y quien quita el prepucio sin permiso del dueño no debe nada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3228} Los shafiíes y los hanbalíes exigen el lavado debajo del prepucio, y consideran inválido como líder de la oración a quien no lo realiza; los hanafíes le permiten dirigir la oración con desaprobación, y los malikíes lo permiten, pero desaprueban su nombramiento como imán regular. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3229}"
  ur: "اکلف وہ آدمی ہے جس کا ختنہ نہ ہوا ہو۔ اس کا مخالف ہے مختاراں ⁦(ختنہ شدہ)⁩۔ چمڑی اتارنے کو مردوں میں خیطان اور عورتوں میں کھفد کہتے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 3228} فقہاء اس بات پر متفق ہیں کہ چمڑی اتارنا فطرہ کے عمل میں سے ہے۔ شافعی اور حنبلی اسے واجب سمجھتے ہیں جبکہ حنفیہ اور مالکیہ اسے سنت سمجھتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3228} نامختون آدمی کے بعض احکام ہیں: بعض فقہاء اس کی گواہی کو رد کرتے ہیں اگر وہ بغیر عذر کے چھوڑ دے، جمہور اس کے ذبح کی اجازت دیتے ہیں، اور جو شخص مالک کی اجازت کے بغیر چمڑی اتارے اس پر کچھ واجب نہیں۔ شافعی اور حنبلی چمڑے کے نیچے دھونے کا تقاضا کرتے ہیں اور وہ ایسے شخص کو جو اسے نہ دھوئے اسے نماز کا امام مانتے ہیں۔ احناف اسے ناپسندیدگی کے ساتھ امامت کرنے کی اجازت دیتے ہیں اور مالکی اس کی اجازت دیتے ہیں لیکن اسے باقاعدہ امام مقرر کرنا ناپسند کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3229}"
