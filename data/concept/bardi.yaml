  fr: "Bardi (papyrus)"
  ur: "بردی ⁦(پیپرس)⁩"
  es: "Bardi (papiro)"
summary:
  ar: "نبات معروف يُصنع منه القرطاس، وهو في قوته، والمحرق منهما أشدّ تجفيفاً، بارد يابس، ينفع من النزف ويمنعه رماده، ويدمل الجراحات الطرية إذا ذُرّ عليها، ويُدخل في الناصور والقروح الساعية، ورماده نافع من أكلة الفم ويحبس نفث الدم {cite:canon-ibn-sina-print-v1 p.410}، {cite:canon-ibn-sina-print-v1 p.411}."
  en: "A known plant from which paper is made; its power is that of paper, and the burnt form dries more. Cold and dry. It helps bleeding, and its ash stops it; sprinkled on fresh wounds it closes them; it enters into treatment of fistula and spreading ulcers. Its ash helps mouth sores and holds back spitting of blood {cite:canon-ibn-sina-print-v1 p.410}, {cite:canon-ibn-sina-print-v1 p.411}."
  fr: "Plante connue dont on fabrique le papier ; son pouvoir est celui du papier, la forme brûlée desséchant davantage. Froide et sèche, elle aiderait contre les saignements, que sa cendre arrêterait ; saupoudrée sur les plaies fraîches, elle les fermerait. Elle entre dans le traitement des fistules et ulcères rampants. Sa cendre aiderait contre les ulcères buccaux et retiendrait les crachements de sang {cite:canon-ibn-sina-print-v1 p.410}, {cite:canon-ibn-sina-print-v1 p.411}."
  ur: "ایک معروف پودا جس سے کاغذ بنایا جاتا ہے؛ اس کی قوت کاغذ جیسی ہے، اور جلایا ہوا زیادہ خشک کرتا ہے۔ سرد اور خشک۔ یہ خون بہنے میں مفید ہے، اور اس کی راکھ اسے روکتی ہے؛ تازہ زخموں پر چھڑکنے سے وہ بھر جاتے ہیں؛ ناسور اور رینگنے والے زخموں کے علاج میں داخل ہے۔ اس کی راکھ منہ کے زخموں میں مفید اور خون تھوکنا روکتی ہے {cite:canon-ibn-sina-print-v1 p.410}، {cite:canon-ibn-sina-print-v1 p.411}۔"
  es: "Una planta conocida de la que se obtiene el papel; su poder es el del papel, y la forma quemada seca más. Fría y seca. Ayuda a las hemorragias, y su ceniza las detiene; espolvoreada sobre heridas recientes las cierra; se utiliza en el tratamiento de fístulas y úlceras que se extienden. Su ceniza ayuda a las llagas de la boca y evita que se escupa sangre {cite:canon-ibn-sina-print-v1 p.410}, {cite:canon-ibn-sina-print-v1 p.411}."
