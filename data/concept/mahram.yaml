summary:
  ar: "بطاقة أولية للمحرم في الفقه: من يحرم نكاحه على المرء تحريماً مؤبداً بنسب أو رضاع أو مصاهرة؛ يفصّلها كتاب الفقه المذكور ولم تُراجع الصفحة بعد."
  en: "Draft card for mahram in fiqh: one whom marriage is permanently forbidden to by kinship, milk-kinship or affinity; treated in the cited fiqh handbook, the page not yet checked."
  es: "Ficha de borrador para mahram en fiqh: aquel a quien el matrimonio está permanentemente prohibido por parentesco, parentesco por leche o afinidad; tratado en el manual de fiqh citado, página aún no revisada."
  fr: "Fiche de projet pour mahram en fiqh: celui avec qui le mariage est définitivement interdit par la parenté, la parenté laitière ou l'affinité; traité dans le manuel de fiqh cité, la page n'a pas encore été vérifiée."
  ur: "فقہ میں محرم کے لیے کارڈ کا مسودہ: وہ شخص جس سے رشتہ داری، دودھ کی رشتہ داری یا رشتہ داری سے نکاح ہمیشہ کے لیے حرام ہو؛ حوالہ فقہ ہینڈ بک میں علاج کیا گیا ہے، صفحہ ابھی تک چیک نہیں کیا گیا ہے."
