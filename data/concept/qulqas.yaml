summary:
  ar: "القلقاس في الكتاب نبات فيه مشابهة من الأشنان، حار يابس في الأولى، فيه ملوحة مع قبض، يسهل الماء الأصفر ويدر البول وهو مسهل للصفراء والمائية بالرفق، ويذكر الكتاب أنه يولد المني {cite:canon-ibn-sina-print-v1 p.654}"
  en: "Qulqas is in the book a plant with some resemblance to ushnan, hot in the first degree and dry, with saltness and astringency; it loosens the yellow water and drives urine, and is a gentle purge of bile and the watery humour; the book lists that it generates semen {cite:canon-ibn-sina-print-v1 p.654}"
  ur: "قلقاس کتاب میں ایک پودا ہے جس کی اشنان سے کچھ مشابہت ہے، پہلے درجے میں گرم خشک، اس میں نمکینی کے ساتھ قبض ہے؛ زرد پانی کو نکالتا اور پیشاب جاری کرتا ہے اور صفرا اور آبی خلط کو نرمی سے نکالنے والا ہے؛ کتاب میں درج ہے کہ یہ منی پیدا کرتا ہے {cite:canon-ibn-sina-print-v1 p.654}۔"
  es: "En el libro, Qulqas es una planta con cierta semejanza a ushnan, caliente en primer grado y seca, con salinidad y astringencia; disuelve el agua amarilla y provoca la micción, y es un suave purgante de la bilis y el humor acuoso; el libro menciona que genera semen {cite:canon-ibn-sina-print-v1 p.654}"
  fr: "Le qulqas est décrit dans le livre comme une plante ressemblant à l'ushnan, chaude au premier degré et sèche, salée et astringente; elle fluidifie l'eau jaune et favorise la miction, et constitue une douce purge de la bile et des humeurs aqueuses; le livre indique qu'elle produit du sperme {cite:canon-ibn-sina-print-v1 p.654}"
  tr: "Kitaptaki taro, likenlere benzeyen bir bitkidir; sıcak ve kuru formda, tuzlu, kasılma ile tuzlu, sarı su ve idrar söktürücü sağlar ve sarı, sulu mesaneyi nazikçe gevşetir. Kitapta meni ürettiği belirtilir {cite:canon-ibn-sina-print-v1 s.654}"
  id: "Tarak dalam buku ini adalah tanaman mirip lumut kerak, panas dan kering dalam bentuknya, asin dengan kontraksi, memudahkan air kuning dan diuretik serta perlahan melonggarkan kandung kemih kuning dan encer. Buku menyebutkan bahwa ikan ini menghasilkan sperma {cite:canon-ibn-sina-print-v1 hlm.654}"
