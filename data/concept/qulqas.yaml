summary:
  ar: "القلقاس في الكتاب نبات فيه مشابهة من الأشنان، حار يابس في الأولى، فيه ملوحة مع قبض، يسهل الماء الأصفر ويدر البول وهو مسهل للصفراء والمائية بالرفق، ويذكر الكتاب أنه يولد المني {cite:canon-ibn-sina-print-v1 p.654}"
  en: "Qulqas is in the book a plant with some resemblance to ushnan, hot in the first degree and dry, with saltness and astringency; it loosens the yellow water and drives urine, and is a gentle purge of bile and the watery humour; the book lists that it generates semen {cite:canon-ibn-sina-print-v1 p.654}"
  ur: "قلقاس کتاب میں ایک پودا ہے جس کی اشنان سے کچھ مشابہت ہے، پہلے درجے میں گرم خشک، اس میں نمکینی کے ساتھ قبض ہے؛ زرد پانی کو نکالتا اور پیشاب جاری کرتا ہے اور صفرا اور آبی خلط کو نرمی سے نکالنے والا ہے؛ کتاب میں درج ہے کہ یہ منی پیدا کرتا ہے {cite:canon-ibn-sina-print-v1 p.654}۔"
