label: { ar: "الحصاد", en: "Harvest (hisad)", ur: "حصاد (فصل)" }
summary:
  ar: "الحصاد جز الزرع وقطعه، واستعمله الفقهاء أيضا لما بقي في الأرض بعد الحصاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7105} والدياس والجذاذ والجزاز مواسم متصلة به؛ فالجذاذ للنخل، والحصاد للزرع، والجزاز يكون للنخل والزرع والصوف والشعر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7106} والحصاد من الآجال المجهولة جهالة متقاربة، وذهب الحنفية والشافعية والحنابلة وابن المنذر إلى أنه لا يجوز التأجيل إليه في البيع والسلم وغيرهما، لقوله: «إلى أجل معلوم»، واختلف هؤلاء في أثر اشتراطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7106} وتفصيل أحكامه في خيار الشرط والسلم والإجارة والمزارعة والمساقاة والزكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7107}"
  en: "Harvest (hisad) is the cutting of the crop, and the jurists also use it for what remains in the field after reaping. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7105} Threshing, date-picking and shearing are related seasons: the date harvest is for palms, the grain harvest for crops, and shearing for palms, crops, wool and hair. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7106} The harvest is an unknown term of close uncertainty; the Hanafis, Shafi'is, Hanbalis and Ibn al-Mundhir hold that a sale or a salam contract may not be deferred to it, citing the rule of a known term, and they differ on the effect of such a condition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7106} Its detailed rules belong to the stipulated option, salam, hire, sharecropping, irrigation partnership, and zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7107}"
