id: concept/harvest-hisad
class: concept
kind: legal
label: { ar: "الحصاد", en: "Harvest (hisad)", ur: "حصاد ⁦(فصل)⁩", es: "Cosecha (hisad)", fr: "Récolte (hisad)", tr: "Hasat", id: "Panen" }
summary:
  ar: "الحصاد جز الزرع وقطعه، واستعمله الفقهاء أيضا لما بقي في الأرض بعد الحصاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7105} والدياس والجذاذ والجزاز مواسم متصلة به؛ فالجذاذ للنخل، والحصاد للزرع، والجزاز يكون للنخل والزرع والصوف والشعر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7106} والحصاد من الآجال المجهولة جهالة متقاربة، وذهب الحنفية والشافعية والحنابلة وابن المنذر إلى أنه لا يجوز التأجيل إليه في البيع والسلم وغيرهما، لقوله: «إلى أجل معلوم»، واختلف هؤلاء في أثر اشتراطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7106} وتفصيل أحكامه في خيار الشرط والسلم والإجارة والمزارعة والمساقاة والزكاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7107}"
  en: "Harvest (hisad) is the cutting of the crop, and the jurists also use it for what remains in the field after reaping. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7105} Threshing, date-picking and shearing are related seasons: the date harvest is for palms, the grain harvest for crops, and shearing for palms, crops, wool and hair. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7106} The harvest is an unknown term of close uncertainty; the Hanafis, Shafi'is, Hanbalis and Ibn al-Mundhir hold that a sale or a salam contract may not be deferred to it, citing the rule of a known term, and they differ on the effect of such a condition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7106} Its detailed rules belong to the stipulated option, salam, hire, sharecropping, irrigation partnership, and zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7107}"
  es: "La cosecha (hisad) es el corte de la cosecha, y los juristas también la usan para lo que queda en el campo después de la siega. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7105} La trilla, la recolección de dátiles y la esquila son temporadas relacionadas: la cosecha de dátiles es para las palmeras, la cosecha de grano para los cultivos, y la esquila para las palmeras, los cultivos, la lana y el pelo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7106} La cosecha es un término desconocido de gran incertidumbre; los hanafíes, shafi'ís, hanbalíes e Ibn al-Mundhir sostienen que una venta o un contrato de salam no puede diferirse hasta ella, citando la regla de un término conocido, y difieren en el efecto de tal condición. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7106} Sus reglas detalladas pertenecen a la opción estipulada, salam, alquiler, aparcería, sociedad de riego y zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7107}"
  fr: "La moisson (hisad) désigne la coupe des récoltes, et les juristes utilisent également ce terme pour ce qui reste dans le champ après la moisson. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7105} Le battage, la cueillette des dattes et la tonte sont des saisons liées: la récolte des dattes concerne les palmiers, la récolte des céréales les cultures, et la tonte les palmiers, les cultures, la laine et les cheveux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7106} La notion de « moisson » est sujette à incertitude; les écoles hanafite, shafi'ite, hanbalite et Ibn al-Mundhir estiment qu'une vente ou un contrat de salam ne peut y être subordonné, invoquant la règle du terme connu, et leurs avis divergent quant aux conséquences d'une telle condition. Ses règles détaillées concernent l'option stipulée, le salam, la location, le métayage, le partenariat d'irrigation et la zakat."
  ur: "فصل کاٹنا ⁦(حسد)⁩ فصل کاٹنا ہے، اور فقہا بھی اس کا استعمال اس کے لیے کرتے ہیں جو کاٹنے کے بعد کھیت میں رہ جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7105} کھجور کی کٹائی، کھجور کی کٹائی اور کٹائی ایک دوسرے کے موسموں سے متعلق ہیں: کھجور کی کٹائی کھجوروں کے لیے، فصلوں کے لیے غلہ کی کٹائی، اور کھجوروں، فصلوں، اون اور بالوں کی کٹائی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7105} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7106} فصل کی کٹائی قریبی غیر یقینی صورتحال کی ایک نامعلوم اصطلاح ہے۔ حنفیہ، شافعی، حنبلی اور ابن المنذر کا خیال ہے کہ کسی معروف اصطلاح کے حکم کا حوالہ دیتے ہوئے فروخت یا سلام کے عقد کو موخر نہیں کیا جا سکتا، اور ایسی شرط کے اثر میں ان کا اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7106} اس کے تفصیلی احکام طے شدہ اختیار، سلام، کرایہ، حصص کی فصل، آبپاشی میں شراکت، اور زکوٰۃ سے تعلق رکھتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7106}"
  tr: "Hasat, ürünlerin kesilmesi ve kesilmesidir; hukukçular da hasat sonrası toprakta kalan kısımlar için kullanmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7105} 'diyas' (makas), 'jaddh' ve 'al-zazaz' bağlı mevsimlerdir; örneğin, 'jadh' palmiye ağaçları için, 'hassad' ürünler için, 'biçme makinesi' ise palmiye ağaçları, ürünler, yün ve saç içindir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7105} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7106} ve yakın cehalet nedeniyle bilinmeyen dönemlerden hasat yapmak. Hanefiler, Şafiiler, Hanbaliler ve İbn al-Mundhir, onun \"bilinen bir süre için\" ifadesine dayanarak satış, selam veya diğer işlemlerde ertelemenin izin vermediğini savunmuşlardır. Durumunun etkisi konusunda farklı görüşler paylaşmışlardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7106} ve şart, salam, kiralama, ortakçılık, musaqah ve zekat seçenekleriyle ilgili ayrıntılı kararlar vermiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7107}"
  id: "Panen adalah pemotongan dan pemotongan tanaman, dan para ahli hukum juga menggunakannya untuk sisa tanaman setelah panen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7105} 'diyas' (gunting), 'jaddh', dan 'al-zazaz' adalah musim yang saling terhubung; jadi, 'jadh' berarti pohon palem, 'hassad' untuk tanaman, dan 'mower' untuk pohon palem, tanaman, wol, dan rambut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7106} dan panen dari periode yang tidak diketahui karena ketidaktahuan yang ketat. Hanafi, Shafi'i, Hanbali, dan Ibn al-Mundhir berpendapat bahwa tidak diperbolehkan menunda dalam penjualan, salam, atau lainnya, berdasarkan pernyataannya: \"untuk istilah yang diketahui.\" Mereka berbeda pendapat mengenai efek kondisinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7106} dan putusan rinci tentang opsi kondisi, salam, leasing, sharecropping, musaqah, dan zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7107}"
