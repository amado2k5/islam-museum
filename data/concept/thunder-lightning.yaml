  ar: "الرعد والبرق"
  en: "Thunder and lightning"
  ur: "گرج اور بجلی"
summary:
  ar: "يسبح الرعد بحمده والملائكة من خيفته ويرسل الصواعق فيصيب بها من يشاء، وفي البرق خطف البصار وبين الخوف والرجاء، وكان عامر بن عبد الله إذا سمع الرعد ترك الحديث."
  en: "The thunder glorifies His praise and the angels from fear of Him; He sends the thunderbolts and strikes whom He wills; in lightning there is terror and hope and a dazzling of the eyes — and Amr ibn Abd Allah would leave off speech when he heard the thunder."
  ur: "گرج اس کی حمد کے ساتھ تسبیح کرتی ہے اور فرشتے اس کے خوف سے؛ وہ بجلیاں بھیج کر جسے چاہے مارتا ہے؛ بجلی میں خوف اور امید اور آنکھوں کی چوندھیا ہے — اور عامر بن عبد اللہ گرج سن کر بات چھوڑ دیتے تھے۔"
