id: concept/thunder-lightning
class: concept
kind: natural
label:
  ar: "الرعد والبرق"
  en: "Thunder and lightning"
  ur: "گرج اور بجلی"
  es: "Truenos y relámpagos"
  fr: "Tonnerre et foudre"
  tr: "Gök Gürültüsü ve Şimşek"
  id: "Guntur dan Petir"
summary:
  ar: "يسبح الرعد بحمده والملائكة من خيفته ويرسل الصواعق فيصيب بها من يشاء، وفي البرق خطف البصار وبين الخوف والرجاء، وكان عامر بن عبد الله إذا سمع الرعد ترك الحديث."
  en: "The thunder glorifies His praise and the angels from fear of Him; He sends the thunderbolts and strikes whom He wills; in lightning there is terror and hope and a dazzling of the eyes — and Amr ibn Abd Allah would leave off speech when he heard the thunder."
  ur: "گرج اس کی حمد کے ساتھ تسبیح کرتی ہے اور فرشتے اس کے خوف سے؛ وہ بجلیاں بھیج کر جسے چاہے مارتا ہے؛ بجلی میں خوف اور امید اور آنکھوں کی چوندھیا ہے — اور عامر بن عبد اللہ گرج سن کر بات چھوڑ دیتے تھے۔"
  es: "El trueno glorifica Su alabanza y ahuyenta a los ángeles del temor de Él; Él envía los rayos y golpea a quien quiere; en el relámpago hay terror y esperanza y un deslumbramiento de los ojos; y Amr ibn Abd Allah dejaba de hablar cuando oía el trueno."
  fr: "Le tonnerre glorifie Sa louange et les anges, par crainte de Lui; Il envoie les éclairs et frappe qui Il veut; dans la foudre il y a terreur et espoir et un éblouissement pour les yeux — et Amr ibn Abd Allah restait muet lorsqu'il entendait le tonnerre."
  tr: "Gök gürültüsü O'nu övgüyle yüceltir, melekler korkudan istediği kişiye yıldırım gönderir. Yıldırımda görüş, korku ve umut arasında elinden alınır. Emir bin Abdullah gök gürültüsü duyduğunda sohbeti bırakırdı."
  id: "Guntur memuliakan-Nya dengan pujian-Nya, dan malaikat-malaikat karena takut mengirimkan sambaran petir ke siapa pun yang Dia kehendaki. Dalam petir, penglihatan direnggut, antara ketakutan dan harapan. Setiap kali Amir ibn Abdullah mendengar guntur, dia akan meninggalkan percakapan."
