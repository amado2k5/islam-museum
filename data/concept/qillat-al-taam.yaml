label:
  ar: تقليل الطعام
  en: Eating little
  es: "Comer poco"
  fr: "Manger peu"
  ur: "کم کھانا"
summary:
  ar: "تقليل الطعام في الحديث السابع والأربعين من زيادات ابن رجب قاعدة نبوية في التغذية والزهد: «ما ملأ آدمي وعاء شراً من بطن، بحسب ابن آدم أكلات يقمن صلبه، فإن كان لا محالة فثلث لطعامه وثلث لشرابه وثلث لنفسه» — فالكفاية أن تقوم الأكلات الصلب لا الشبع، فإن دعت الحاجة قسم البطن أثلاثاً ولم يملأ كله بالطعام، ومن سبب الرواية أن أهل خيبر أصابتهم الحمى بإسرافهم في الفاكهة — فجعل الإسراف في المباح سبباً للداء ⁦(جامع العلوم والحكم ص 891)⁩."
  en: "Eating little in the forty-seventh hadith of Ibn Rajab's additions is the prophetic rule of food and austerity: 'no human has filled a vessel worse than the belly; enough for the son of Adam are morsels that keep his back upright, and if he must, a third for food, a third for drink and a third for breath' — sufficiency is what keeps the spine straight, not satiety, and when more is needed the belly is divided into thirds rather than filled with food; the narration's occasion shows the people of Khaybar struck by fever for excess in lawful fruit — so excess even in the permissible breeds harm (Jami' al-Ulum wal-Hikam p. 891)."
  es: "En el hadiz número cuarenta y siete de las adiciones de Ibn Rajab, comer poco es la regla profética de la comida y la austeridad: \"Ningún ser humano ha llenado un recipiente peor que el vientre; al hijo de Adán le bastan los bocados que mantienen su espalda recta, y si es necesario, un tercio para comer, un tercio para beber y un tercio para respirar\". La suficiencia es lo que mantiene la columna recta, no la saciedad, y cuando se necesita más, el vientre se divide en tercios en lugar de llenarse de comida; la ocasión de la narración muestra a la gente de Khaybar contagiada por la fiebre del exceso de fruta lícita, por lo que el exceso, incluso en lo permisible, engendra daño (Jami' al-Ulum wal-Hikam, pág. 891)."
  fr: "Le quarante-septième hadith des ajouts d'Ibn Rajab, qui préconise de manger peu, est une règle prophétique concernant l'alimentation et l'austérité: « Nul homme n'a rempli un récipient pire que le ventre; il suffit au fils d'Adam de quelques bouchées qui le maintiennent droit, et s'il le faut, un tiers pour la nourriture, un tiers pour la boisson et un tiers pour respirer. » C'est la suffisance, et non la satiété, qui maintient la colonne vertébrale droite, et lorsque davantage est nécessaire, le ventre est divisé en trois plutôt que rempli de nourriture. Le récit relate que les habitants de Khaybar furent frappés de fièvre pour avoir consommé en excès des fruits licites; ainsi, même l'excès de ce qui est permis est nuisible (Jami' al-Ulum wal-Hikam, p. 891)."
  ur: "ابن رجب کی اضافت کی سینتالیسویں حدیث میں تھوڑا کھانا کھانا اور کفایت شعاری کا پیغمبرانہ قاعدہ ہے: 'کسی انسان نے پیٹ سے بدتر برتن نہیں بھرا۔ ابن آدم کے لیے وہ لقمے کافی ہیں جو اس کی کمر کو سیدھا رکھتے ہیں، اور اگر ضروری ہو تو ایک تہائی کھانے کے لیے، ایک تہائی پینے کے لیے اور ایک تہائی سانس کے لیے‘‘ - کفایت وہ چیز ہے جو ریڑھ کی ہڈی کو سیدھی رکھتی ہے نہ کہ سیر، اور جب زیادہ ضرورت ہو تو پیٹ کھانے سے بھرنے کے بجائے تہائی میں تقسیم ہو جاتا ہے۔ روایت کا موقع ظاہر کرتا ہے کہ خیبر کے لوگ حلال پھلوں کی زیادتی کے باعث بخار میں مبتلا تھے - اس لیے جائز نسلوں میں بھی زیادتی نقصان پہنچاتی ہے ⁦(جامع العلوم والحکم ص 891)⁩۔"
