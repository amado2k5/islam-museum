label:
  ar: تقليل الطعام
  en: Eating little
summary:
  ar: "تقليل الطعام في الحديث السابع والأربعين من زيادات ابن رجب قاعدة نبوية في التغذية والزهد: «ما ملأ آدمي وعاء شراً من بطن، بحسب ابن آدم أكلات يقمن صلبه، فإن كان لا محالة فثلث لطعامه وثلث لشرابه وثلث لنفسه» — فالكفاية أن تقوم الأكلات الصلب لا الشبع، فإن دعت الحاجة قسم البطن أثلاثاً ولم يملأ كله بالطعام، ومن سبب الرواية أن أهل خيبر أصابتهم الحمى بإسرافهم في الفاكهة — فجعل الإسراف في المباح سبباً للداء (جامع العلوم والحكم ص 891)."
  en: "Eating little in the forty-seventh hadith of Ibn Rajab's additions is the prophetic rule of food and austerity: 'no human has filled a vessel worse than the belly; enough for the son of Adam are morsels that keep his back upright, and if he must, a third for food, a third for drink and a third for breath' — sufficiency is what keeps the spine straight, not satiety, and when more is needed the belly is divided into thirds rather than filled with food; the narration's occasion shows the people of Khaybar struck by fever for excess in lawful fruit — so excess even in the permissible breeds harm (Jami' al-Ulum wal-Hikam p. 891)."
