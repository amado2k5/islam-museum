id: concept/ulu-al-amr
class: concept
kind: legal
label: { ar: "أولو الأمر", en: "Ulu al-amr (those in authority)" }
summary:
  ar: "أولو الأمر الرؤساء والعلماء، وهما قولان في تفسير قوله تعالى: «وأولي الأمر منكم»: الأول أهل العلم والقرآن، والثاني الأمراء والولاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3328}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3329} ويشترط في الخليفة الإسلام والحرية والبلوغ والعقل والذكورة والعلم والعدالة والكفاية، ويشترط فيمن دونه شروط أقل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3329} وتجب طاعتهم في غير معصية، ومن واجباتهم حفظ الدين وتنفيذ الأحكام وحماية الدولة وإقامة الحدود والمشاورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3330}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3331}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3332}"
  en: "Ulu al-amr are those in authority; the phrase in the Qur'an has two views: scholars of the Qur'an and of knowledge, and the rulers and governors. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3328}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3329} The caliph must be a Muslim, free, adult, sane, male, learned, upright and capable; those below him have fewer conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3329} Obedience is owed in what is not sinful, and their duties include guarding the religion, enforcing rulings, protecting the state, enforcing penalties and consultation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3330}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3331}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3332}"
