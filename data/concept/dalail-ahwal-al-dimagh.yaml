id: concept/dalail-ahwal-al-dimagh
class: concept
kind: scientific
label:
  fr: "Les signes permettant de connaître l'état du cerveau"
  ar: "الدلائل التي يتعرف منها أحوال الدماغ"
  en: "The signs from which the state of the brain is known"
  ur: "وہ علامات جن سے دماغ کی حالت معلوم ہوتی ہے"
summary:
  fr: "Ibn Sina énumère les points de départ pour connaître l'état du cerveau : actes sensoriels, directeurs et moteurs, matières expulsées, état de la tête, de l'œil, du sommeil, des cheveux, du cou et des organes associés. La notice comporte une ligne attribuée à l'ouvrage dans une section en attente de décision du fondateur {cite:canon-ibn-sina-print-v2 pp.10-11}"
  ar: "يعدد ابن سينا مبادئ معرفة أحوال الدماغ: الأفعال الحسية والسياسية والحركية، وما يستفرغ منه، وحال الرأس والعين والنوم والشعر والرقبة، وأعضاء مشاركة؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 pp.10-11}"
  en: "Ibn Sina lists the starting points for knowing the state of the brain: the sensory, governing and motor acts, what is expelled from it, and the state of the head, the eye, sleep, the hair, the neck and the organs that share with it; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 pp.10-11}"
  ur: "ابن سینا دماغ کی حالت جاننے کے آغاز کے نکات گنتا ہے: حسی، سیاسی اور حرکی افعال، جو کچھ اس سے خارج ہوتا ہے، سر، آنکھ، نیند، بال اور گردن کی حالت، اور شریک اعضا؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 pp.10-11}۔"
