id: concept/shakwa-ila-allah
class: concept
kind: ethical
label:
  ar: "الشكوى إلى الله"
  en: "Complaint to God (shakwa ila Allah)"
  ur: "اللہ سے شکوہ"
summary:
  ar: "يقول الشيخ عمر عبد الكافي إن الجاهل يشكو الله إلى الناس، وإن من عرف ربه لا يشكوه إلى المخلوقين. وينبه إلى أن الشكوى ينبغي أن تكون إلى الله وحده، لا إلى كل صغير وكبير."
  en: "Sheikh Omar Abdelkafy says that the ignorant complain about God to people, while whoever knows his Lord does not complain of Him to creatures. He holds that complaint should be made to God alone, not to every small or great person."
  ur: "شیخ عمر عبدالکافی کہتے ہیں کہ جاہل لوگوں سے اللہ کی شکایت کرتا ہے، اور جو اپنے رب کو پہچانتا ہے وہ مخلوق سے اس کی شکایت نہیں کرتا۔ ان کی رائے ہے کہ شکوہ صرف اللہ سے کرنا چاہیے، ہر چھوٹے بڑے سے نہیں۔"
