id: concept/canon-vegetables-fruits-and-gentle-laxatives-for-the-old
class: concept
kind: scientific
label: { ar: "البقول والفواكه والملينات للمشايخ عند ابن سينا", en: "Vegetables, fruits and gentle laxatives for the old in the Canon", ur: "بزرگوں کے لیے سبزیاں، پھل اور نرم مسہل قانون میں", es: "Verduras, frutas y laxantes suaves para los ancianos en el Canon", fr: "Légumes, fruits et laxatifs doux pour les personnes âgées dans le Canon" }
summary:
  ar: "يعدد ابن سينا ما تتناوله المشايخ من البقول والفواكه مثل السلق والكرفس وقليل من الكراث بالمري والزيت قبل الطعام، والثوم لمن اعتاده، والزنجبيل المربى، والتين والإجاص، وما يلين الطبيعة من اللبلاب وأصل البسفايج وماء الكرنب ولباب القرطم {cite:canon-ibn-sina-print-v1 p.252}."
  en: "Ibn Sina lists the vegetables and fruits the old may take, such as beet, celery and a little leek with fermented sauce and oil before the meal, garlic for those used to it, preserved ginger, figs and plums, and what softens the bowels: bindweed, polypody root, cabbage water and safflower kernel {cite:canon-ibn-sina-print-v1 p.252}."
  es: "Ibn Sina enumera las verduras y frutas que pueden tomar los ancianos, como remolacha, apio y un poco de puerro con salsa fermentada y aceite antes de la comida, ajo para los que están acostumbrados, jengibre en conserva, higos y ciruelas, y lo que ablanda los intestinos: correhuela, raíz de polípoda, agua de col y semilla de cártamo {cite:canon-ibn-sina-print-v1 p.252}."
  fr: "Ibn Sina énumère les légumes et les fruits que les personnes âgées peuvent consommer, tels que la betterave, le céleri et un peu de poireau avec une sauce fermentée et de l'huile avant le repas, de l'ail pour ceux qui y sont habitués, du gingembre confit, des figues et des prunes, et ce qui adoucit les intestins: le liseron, la racine de polypode, l'eau de chou et le noyau de carthame {cite:canon-ibn-sina-print-v1 p.252}."
  ur: "ابن سینا نے ان سبزیوں اور پھلوں کی فہرست دی ہے جو پرانے لے سکتے ہیں، جیسے چقندر، اجوائن اور کھانے سے پہلے خمیر شدہ چٹنی اور تیل کے ساتھ تھوڑی سی لیک، اس کے عادی افراد کے لیے لہسن، محفوظ شدہ ادرک، انجیر اور بیر، اور جو آنتوں کو نرم کرتے ہیں: بند ویڈ، پولی پوڈی جڑ، گوبھی کا پانی اور صوفہ کا پانی۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 252}۔"
