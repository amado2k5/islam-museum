summary:
  ar: "يعدد ابن سينا ما تتناوله المشايخ من البقول والفواكه مثل السلق والكرفس وقليل من الكراث بالمري والزيت قبل الطعام، والثوم لمن اعتاده، والزنجبيل المربى، والتين والإجاص، وما يلين الطبيعة من اللبلاب وأصل البسفايج وماء الكرنب ولباب القرطم {cite:canon-ibn-sina-print-v1 p.252}."
  en: "Ibn Sina lists the vegetables and fruits the old may take, such as beet, celery and a little leek with fermented sauce and oil before the meal, garlic for those used to it, preserved ginger, figs and plums, and what softens the bowels: bindweed, polypody root, cabbage water and safflower kernel {cite:canon-ibn-sina-print-v1 p.252}."
