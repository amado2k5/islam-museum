id: concept/kurh
class: concept
kind: legal
label:
  ar: "كُرْه"
  en: "Dislike and aversion (kurh)"
  ur: "ناپسندیدگی (کُرہ)"
summary:
  ar: "الكُره في اللغة المشقة، ويقابله الحب، وهو قسمان: ما يُعاف بالطبع، وما يُعاف بالعقل أو الشرع. وقد يكون واجباً كبغض الكفر والمعصية، وحراماً كبغض الإسلام أو الرسول أو الصحابة من حيث فضلهم، ومباحاً كالكراهة لما قضاه الله إن كان معصية مع الرضا بالقضاء. وفي الاعتقاد من كره الإسلام أو الرسول كفر، ومن كره الأنصار والصحابة من حيث نصرتهم الدين كفر. وفي الإمامة يكره أن يؤم رجل قوماً أكثرهم له كارهون بحق. وللزوج أن يصبر على زوجته إذا كرهها لعيب خلقي دون فاحشة، وللزوجة أن تخالع زوجها إذا خافت ألا تقيم حدود الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13247} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13248} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13249} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13250}"
  en: "Kurh is hardship in the lexicon and is the opposite of love. It has two kinds: what the nature shrinks from, and what reason or the law shrinks from. It may be obligatory, as in hating unbelief and sin; forbidden, as in hating Islam, the Prophet or the Companions for their virtue; or permitted, as in disliking a divine decree that is a sin while accepting the decree. Hating Islam or the Prophet is disbelief, and so is hating the Helpers and the Companions for their support of religion. An imam who is disliked by most of his congregation for a just reason is disliked as an imam. A husband may bear with a wife he dislikes for a fault in her character, short of immorality; a wife may seek khul' from a husband she fears she cannot obey God with. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13247} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13248} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13249} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13250}"
  ur: "کُرہ لغت میں مشقت ہے اور محبت کی ضد ہے۔ یہ دو قسم کا ہے: وہ جس سے طبیعت گھبراتی ہے، اور وہ جس سے عقل یا شرع گھبراتی ہے۔ یہ واجب بھی ہو سکتا ہے، جیسے کفر اور گناہ سے نفرت؛ حرام بھی، جیسے اسلام، رسول یا صحابہ کی فضیلت کی وجہ سے ان سے بغض؛ اور مباح بھی، جیسے گناہ پر مشتمل تقدیر کو ناپسند کرنا جبکہ اس تقدیر پر راضی رہا جائے۔ اسلام یا رسول سے نفرت کفر ہے، اور انصار و صحابہ سے دین کی نصرت کی وجہ سے نفرت بھی کفر ہے۔ امامت میں جس شخص کو اکثر مقتدی بجا طور پر ناپسند کریں اس کا امامت کرنا مکروہ ہے۔ شوہر ایسی بیوی پر صبر کر سکتا ہے جسے وہ عیب کی وجہ سے ناپسند کرے بشرطیکہ فحش نہ ہو، اور بیوی ایسے شوہر سے خلع لے سکتی ہے جس کے ساتھ اسے خوف ہو کہ حدود اللہ قائم نہ کر سکے گی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13245} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13246} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13247} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13248} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13249} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13250}"
