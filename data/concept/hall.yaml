  es: "Hall es una droga que algunos asocian con el Khuzi julnar (flor de granada). El libro afirma que daña los nervios y provoca espasmos."
  fr: "Le Hall est une drogue que certains appellent le Khuzi julnar (fleur de grenade). Le livre indique qu'elle endommage les nerfs et provoque des spasmes."
  tr: "Bazı kişilerin Golnar al-Khozi olarak söylediği bir ilaç, siniri zarar verir ve spazmlara neden olur."
  id: "Obat yang beberapa orang bilang Golnar al-Khozi, yang merusak saraf dan menyebabkan kejang."
