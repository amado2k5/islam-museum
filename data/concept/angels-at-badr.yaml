id: concept/angels-at-badr
class: concept
kind: doctrine
label: { ar: "الملائكة في بدر", en: "The angels at Badr" }
issue:
  ar: "هل قاتلت الملائكة يوم بدر، أم كان إمدادها بشرى وتثبيتاً للقلوب؟"
summary:
  ar: "يحكي رضا أن المحققين جزموا بأن الملائكة لم تقاتل يوم بدر، وأن الوحي إليهم بالتثبيت يُفهم منه أنهم أُمروا بإلقاء المعنى في قلوب المؤمنين بالإلهام. وينقل عن ابن كثير قول الربيع بن أنس في علامات قتلى الملائكة، ويرى أن الروايات في قتالهم ضعيفة لا يُعتد بها، وأن ابن جرير لم يثبتها."
  en: "Rida says the verifiers held that the angels did not fight at Badr; that the command given to them was to cast the message into the hearts of the believers by inspiration. He quotes Ibn Kathir's transmission of al-Rabi' ibn Anas about marks on the slain angels, and holds that the reports of angelic fighting are weak and that al-Tabari did not accept them."
