label:
  ar: الاقتصاد في القرآن
  en: Economy and balance in the Qur'an
  es: "Economía y equilibrio en el Corán"
  fr: "Économie et équilibre dans le Coran"
  ur: "قرآن میں معیشت اور توازن"
  tr: "Kur'an'da ekonomi"
  id: "Ekonomi dalam Al-Qur'an"
summary:
  ar: "يعرض زيدان قعدات معنى «الاقتصاد» في القرآن بوصفه التوازن والاعتدال والوسط بين نقائض الأمور، أي اختيار البدائل المثلى {cite:qadan-manhaj-iqtisad-quran p. 24}. ويجعل العدل ركيزته الأولى لأن الاقتصاد عنده يبدأ باختيار البدائل المثالية {cite:qadan-manhaj-iqtisad-quran p. 21}. ويرى أن الدرس الأول في الاقتصاد كان مع آدم في الجنة، وأن الخلل وقع حين خرج الإنسان عن الدائرة المتوازنة المعتدلة {cite:qadan-manhaj-iqtisad-quran p. 19}. ويقيم الاقتصاد الإسلامي العادل على ثلاثة موجودات لا بد من الموازنة بينها: الله والمادة والإنسان {cite:qadan-manhaj-iqtisad-quran p. 29}."
  tr: "Zaydan, Kur'an'daki 'ekonomi' anlamının ilkelerini denge, denge ve zıtlıkların ortası olarak sunar; yani en uygun alternatifleri seçmek {cite:qadan-manhaj-iqtisad-kur'an s. 24}. Adaleti temel direği yapar çünkü onun için ekonomi ideal alternatifleri seçmekle başlar {cite:qadan-manhaj-iqtisad-kur'an s. 21}. Ekonomideki ilk dersin Adem ile cennette olduğunu ve kusurun insanın dengeli ve ılımlı çemberden çıktığında ortaya çıktığını düşünür {cite:qadan-manhaj-iqtisad-kur'an s. 19}. Adil İslami ekonomiyi dengelenmesi gereken üç varlığa dayandırır: Allah, madde ve insan {cite:qadan-manhaj-iqtisad-kur'an, s. 29}."
  id: "Zaydan menyajikan prinsip-prinsip makna 'ekonomi' dalam Al-Qur'an sebagai keseimbangan, keseimbangan, dan tengah-tengah lawan; yaitu, memilih alternatif yang paling sesuai {cite:qadan-manhaj-iqtisad-qur'an hlm. 24}. Ia menjadikan keadilan sebagai pilar fundamental karena baginya, ekonomi dimulai dengan memilih alternatif ideal {cite:qadan-manhaj-iqtisad-qur'an hlm. 21}. Ia berpikir bahwa pelajaran pertama dalam ekonomi adalah bahwa Adam dan Eden berada di surga, dan kesalahan itu muncul ketika seseorang keluar dari lingkaran seimbang dan moderat {cite:qadan-manhaj-iqtisad-qur'an hlm. 19}. Just Islam mendasarkan ekonomi pada tiga entitas yang harus seimbang: Allah, materi, dan manusia {cite:qadan-manhaj-iqtisad-qur'an, hlm. 29}."
