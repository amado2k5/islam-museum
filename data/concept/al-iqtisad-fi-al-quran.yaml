summary:
  ar: "يعرض زيدان قعدات معنى «الاقتصاد» في القرآن بوصفه التوازن والاعتدال والوسط بين نقائض الأمور، أي اختيار البدائل المثلى {cite:qadan-manhaj-iqtisad-quran p. 24}. ويجعل العدل ركيزته الأولى لأن الاقتصاد عنده يبدأ باختيار البدائل المثالية {cite:qadan-manhaj-iqtisad-quran p. 21}. ويرى أن الدرس الأول في الاقتصاد كان مع آدم في الجنة، وأن الخلل وقع حين خرج الإنسان عن الدائرة المتوازنة المعتدلة {cite:qadan-manhaj-iqtisad-quran p. 19}. ويقيم الاقتصاد الإسلامي العادل على ثلاثة موجودات لا بد من الموازنة بينها: الله والمادة والإنسان {cite:qadan-manhaj-iqtisad-quran p. 29}."
