id: concept/inhilal
class: concept
kind: legal
label: { ar: "الانحلال", en: "Inhilal (dissolution, invalidation and the ending of an obligation)", es: "Inhilal (disolución, invalidez y fin de una obligación)", fr: "Inhilal (dissolution, invalidation et cessation d'une obligation)", ur: "انھلال ⁦(تحلیل، باطل اور فرض کا خاتمہ)⁩", tr: "Dejenerasyon", id: "Degenerasi" }
summary:
  ar: "الانحلال لغة الانفكاك، وعند الفقهاء البطلان والانفكاك والانفساخ والفسخ، ويطلق خاصة على انتهاء المنعقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460} ويرد أكثر في الأيمان والطلاق والعقود، فتنحل اليمين بحصول ما علق عليه، أو بزوال محل البر، أو بالحنث، أو بالاستثناء، أو بزوال ملك النكاح عند بعض الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461} وتنحل العقود بفسخها من الطرفين، أو بالتراضي، أو بحكم القضاء، أو بالإقالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461}"
  en: "Inhilal in the lexical sense is coming apart; for the jurists it means invalidity, dissolution, rescission and cancellation. It is applied properly to ending what was formed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460} It occurs mostly in oaths, divorce and contracts: an oath is dissolved when its condition occurs, when the object of the pledge ceases, by breaking it, by an exception, or, for some jurists, by the ending of the marital bond. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461} Contracts are dissolved by rescission by either side, by mutual consent, by judgement or by iqala (mutual cancellation). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461}"
  es: "Inhilal en sentido léxico significa separarse; para los juristas significa invalidez, disolución, rescisión y cancelación. Se aplica propiamente a la terminación de lo que se formó. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460} Ocurre principalmente en juramentos, divorcios y contratos: un juramento se disuelve cuando se cumple su condición, cuando cesa el objeto de la promesa, al romperse, por una excepción o, para algunos juristas, por la terminación del vínculo matrimonial. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461} Los contratos se disuelven por rescisión de cualquiera de las partes, por mutuo consentimiento, por sentencia o por iqala (cancelación mutua). {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461}"
  fr: "Inhilal, au sens littéral, signifie « se défaire »; pour les juristes, il désigne l’invalidité, la dissolution, la résiliation et l’annulation. Il s’applique proprement à la cessation de ce qui a été formé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460} Il se rencontre principalement dans les serments, les divorces et les contrats: un serment est dissous lorsque sa condition est remplie, lorsque l’objet de l’engagement cesse, par sa violation, par une exception, ou, pour certains juristes, par la dissolution du lien conjugal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461} Les contrats sont dissous par résiliation de part et d'autre, par consentement mutuel, par jugement ou par iqala (annulation mutuelle). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461}"
  ur: "لغوی معنوں میں انہلال الگ ہو رہا ہے۔ فقہاء کے نزدیک اس کا مطلب باطل، تحلیل، تنسیخ اور منسوخی ہے۔ جو بنایا گیا تھا اسے ختم کرنے کے لیے اس کا اطلاق مناسب طریقے سے ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3459}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.3460} یہ زیادہ تر قسموں، طلاق اور عقد میں ہوتا ہے: قسم اس وقت تحلیل ہو جاتی ہے جب اس کی حالت واقع ہو، جب اس کی کوئی چیز، سوائے اس کے کہ کسی قسم کی بیعت کے، اس کے توڑ دی جائے۔ فقہا، ازدواجی بندھن کے خاتمے سے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3460}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461} معاہدوں کو دونوں طرف سے، باہمی رضامندی سے، فیصلے سے یا اقرار کے ذریعے تحلیل کیا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3461}"
  tr: "Sonlandırma, ayrılık dilidir ve hukukçular arasında geçersizlik ve ayrılık, özellikle sözleşmeli sürenin sonuna atıfta bulunarak, feshetme ve iptal anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3460} Yeminlerde, boşanmada ve sözleşmelerde daha sık geçer. Yemin, ona bağlı olan şeyin gerçekleşmesiyle veya doğruluk görevinin sona ermesiyle, kanunu çiğnemesiyle, istisna yoluyla ya da bazı hukukçulara göre evlilik mülkiyetinin kaldırılmasıyla feshedilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3461} Sözleşmeler karşılıklı fesh, karşılıklı anlaşma, yargı kararı veya feshiyle feshedilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3461}"
  id: "Pembubaran adalah bahasa pemisahan, dan di antara para ahli hukum, pembatalan dan pemisahan berarti pembubaran dan pembatalan, terutama merujuk pada akhir masa yang dikontrakkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3460} Sumpah ini lebih sering muncul dalam sumpah, perceraian, dan kontrak. Sumpah ini dibubarkan ketika apa yang melekat padanya terjadi, atau ketika tugas kebenaran dihentikan, atau dengan melanggar hukum, atau dengan pengecualian, atau dengan penghapusan kepemilikan pernikahan menurut beberapa ahli hukum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3461} Kontrak dibubarkan dengan pemutusan bersama, kesepakatan bersama, putusan pengadilan, atau pemecatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3461}"
