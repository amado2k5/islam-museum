id: concept/inhilal
class: concept
kind: legal
label: { ar: "الانحلال", en: "Inhilal (dissolution, invalidation and the ending of an obligation)" }
summary:
  ar: "الانحلال لغة الانفكاك، وعند الفقهاء البطلان والانفكاك والانفساخ والفسخ، ويطلق خاصة على انتهاء المنعقد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460} ويرد أكثر في الأيمان والطلاق والعقود، فتنحل اليمين بحصول ما علق عليه، أو بزوال محل البر، أو بالحنث، أو بالاستثناء، أو بزوال ملك النكاح عند بعض الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461} وتنحل العقود بفسخها من الطرفين، أو بالتراضي، أو بحكم القضاء، أو بالإقالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461}"
  en: "Inhilal in the lexical sense is coming apart; for the jurists it means invalidity, dissolution, rescission and cancellation. It is applied properly to ending what was formed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3459}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460} It occurs mostly in oaths, divorce and contracts: an oath is dissolved when its condition occurs, when the object of the pledge ceases, by breaking it, by an exception, or, for some jurists, by the ending of the marital bond. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3460}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461} Contracts are dissolved by rescission by either side, by mutual consent, by judgement or by iqala (mutual cancellation). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3461}"
