  es: "En el libro se menciona que el fil es una droga india conocida, cuyo poder es similar al de la raíz de mandrágora y la manzana de mandrágora, y que, aplicada como cataplasma, alivia el dolor de cabeza {cite:canon-ibn-sina-print-v1 p.626}."
