id: concept/tahlil-disc
class: concept
kind: term
label:
  ar: "تحليل الشخصية بنموذج ديسك"
  en: "DISC personality analysis"
  ur: "ڈسک ذاتیات کا تجزیہ"
  es: "Análisis de personalidad DISC"
  fr: "Analyse de personnalité DISC"
  tr: "Disk modelinde kişilik analizi"
  id: "Analisis kepribadian dalam model disk"
summary:
  ar: "نموذج ديسك ⁦(وتوماس البريطاني نظيره)⁩ كما يدرّسه طارق السويدان: تقسيم الشخصيات القيادية على محوري الاهتمام بالعمل مقابل الناس والسرعة مقابل التدرج — مسيطر، مؤثر، مستقر، حذر، والوسط — وتطبيقه في التوظيف وتشكيل الفرق، مع نسبة خطأ معلنة."
  en: "The DISC model (and its British counterpart Thomas) as Tareq al-Suwaidan teaches it: classifying leadership personalities on the axes of task- versus people-focus and fast versus gradual — dominant, influencer, steady, cautious, and the centre — applied to hiring and team building, with a stated error margin."
  ur: "ڈسک ماڈل ⁦(اور اس کا برطانوی نظیر تھامس)⁩ جیسا کہ طارق السویدان سکھاتے ہیں: قیادی شخصیات کی تقسیم کام بمقابلہ لوگ اور رفتار بمقابلہ تدریج کے محوروں پر — غالب، مؤثر، مستقر، محتاط اور درمیان — اور اس کا اطلاق تقرری اور ٹیم سازی میں، معلن خطا کے ساتھ۔"
  es: "El modelo DISC (y su equivalente británico, Thomas), tal como lo enseña Tareq al-Suwaidan, clasifica las personalidades de liderazgo en los ejes de enfoque en la tarea frente a enfoque en las personas y rápido frente a gradual (dominante, influyente, constante, cauteloso y el centro), aplicado a la contratación y la formación de equipos, con un margen de error establecido."
  fr: "Le modèle DISC (et son homologue britannique Thomas) tel qu'enseigne Tareq al-Suwaidan: classer les personnalités de leadership selon les axes de l'orientation vers la tâche ou vers les personnes et de la rapidité ou de la lenteur — dominant, influenceur, stable, prudent et central — appliqué au recrutement et à la constitution d'équipes, avec une marge d'erreur définie."
  tr: "Disk modeli (ve Tariq Al-Suwaidan tarafından incelenen İngiliz muadili Thomas): liderlik figürlerini iki eksene ayırmak: işe ilgi ve insanlara olan ilgi, hız ile gradyan — baskın, etkili, istikrarlı, temkinli ve orta seviye — ve bunu işe alım ve ekip kurmada uygulamak, hata oranı ilan etmek."
  id: "Model Disk (dan Thomas sebagai rekan Inggris seperti yang dipelajari oleh Tariq Al-Suwaidan): membagi figur kepemimpinan menjadi dua sumbu: minat pada pekerjaan versus manusia dan kecepatan versus gradien — dominan, berpengaruh, stabil, berhati-hati, dan menengah — dan menerapkannya dalam rekrutmen dan pembentukan tim, dengan tingkat kesalahan yang dinyatakan."
