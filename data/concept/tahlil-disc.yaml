label:
  ar: "تحليل الشخصية بنموذج ديسك"
  en: "DISC personality analysis"
  ur: "ڈسک ذاتیات کا تجزیہ"
summary:
  ar: "نموذج ديسك (وتوماس البريطاني نظيره) كما يدرّسه طارق السويدان: تقسيم الشخصيات القيادية على محوري الاهتمام بالعمل مقابل الناس والسرعة مقابل التدرج — مسيطر، مؤثر، مستقر، حذر، والوسط — وتطبيقه في التوظيف وتشكيل الفرق، مع نسبة خطأ معلنة."
  en: "The DISC model (and its British counterpart Thomas) as Tareq al-Suwaidan teaches it: classifying leadership personalities on the axes of task- versus people-focus and fast versus gradual — dominant, influencer, steady, cautious, and the centre — applied to hiring and team building, with a stated error margin."
  ur: "ڈسک ماڈل (اور اس کا برطانوی نظیر تھامس) جیسا کہ طارق السویدان سکھاتے ہیں: قیادی شخصیات کی تقسیم کام بمقابلہ لوگ اور رفتار بمقابلہ تدریج کے محوروں پر — غالب، مؤثر، مستقر، محتاط اور درمیان — اور اس کا اطلاق تقرری اور ٹیم سازی میں، معلن خطا کے ساتھ۔"
