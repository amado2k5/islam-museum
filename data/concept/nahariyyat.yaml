id: concept/nahariyyat
class: concept
kind: legal
label:
  ar: "نَهَارِيّات"
  en: "Nahariyyat (marriage on condition of day only)"
  ur: "نہاریات (دن ہی کی شرط پر نکاح)"
summary:
  ar: "النهاريات عند الحنفية المرأة التي يتزوجها الرجل على أن يكون عندها نهاراً دون الليل؛ والنكاح صحيح والشرط فاسد، وهو مثال لأثر الشروط الفاسدة في عقد النكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16206}"
  en: "Nahariyyat, for the Hanafis, is a woman whom a man marries on condition that he be with her by day and not by night. The marriage is valid and the condition void; it is an example of how invalid conditions treat a marriage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16206}"
  ur: "نہاریات حنفیہ کے نزدیک وہ عورت ہے جس سے مرد اس شرط پر نکاح کرے کہ وہ دن میں اس کے پاس ہوگا اور رات میں نہیں۔ نکاح صحیح اور شرط فاسد ہے، جو فاسد شرطوں کے نکاح پر اثر کی مثال ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16205} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16206}"
wings: [ideas]
