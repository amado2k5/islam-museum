issue:
  ar: "هل يلزم الشرط الذي يقيد المبيت بالنهار، وهل يصح النكاح مع فساد الشرط؟"
  en: "Does a condition confining the nights bind, and is a marriage valid when its condition is void?"
  ur: "کیا رات کے قیام کو محدود کرنے والی شرط لازم ہے، اور فاسد شرط کے ساتھ نکاح صحیح ہے؟"
