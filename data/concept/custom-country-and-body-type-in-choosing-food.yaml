summary:
  ar: "يقول ابن سينا إن للبلدان خواص من الطبائع والأمزجة خارجة عن القياس فيغلب فيها التجربة على القياس، وإن لكل سحنة ومزاج غذاء موافقاً يغير بالضد، وإن بعض الأطعمة الجيدة تضر بعض الناس فيهجرونها، وإن المتخلخل البدن يغتذي بالرطب السريع الانهضام، وإنه يجوز لصاحب الأخلاط الرديئة أن يتوسع في الغذاء المحمود {cite:canon-ibn-sina-print-v1 p.230}."
  en: "Ibn Sina says lands have properties of nature and temperament beyond analogy, so experience is to outweigh analogy; every physique and temperament has a food that suits it, changed only by its opposite; some good foods harm some people, who should give them up; the loose-textured body is fed on moist, quickly digested food; and one with bad humours may be allowed a wider good diet {cite:canon-ibn-sina-print-v1 p.230}."
