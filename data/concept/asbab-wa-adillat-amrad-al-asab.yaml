id: "concept/asbab-wa-adillat-amrad-al-asab"
class: "concept"
kind: "scientific"
label:
  ar: "أسباب أمراض العصب وأدلّتها"
  en: "Causes and indications of nerve diseases"
  fr: "Causes et signes des maladies des nerfs"
  ur: "اعصاب کے امراض کے اسباب اور دلائل"
summary:
  ar: "الحركات العنيفة مدخل عظيم في إحداث علل العصب فوق ما في غيرها لأنها آلات الحركات؛ والاستدلال على أحوال العصب من أفعال الحس والحركة ومن الملمس في اللين والصلابة ومن مشاركة الدماغ والفقار إياه؛ وإن عرض المرض دفعة لم يُشكّ أنه رطب {cite:canon-ibn-sina-print-v2 p.135}"
  en: "Violent motions are a great inlet for producing nerve lesions, more than elsewhere, because nerves are the instruments of motion; nerve states are inferred from the acts of sense and motion, from touch in softness and hardness, and from the brain's and spine's sharing with it; if the illness comes suddenly it is doubtless moist {cite:canon-ibn-sina-print-v2 p.135}"
  fr: "Les mouvements violents sont une voie majeure de production des lésions nerveuses, plus qu’ailleurs, car les nerfs sont les instruments du mouvement ; leur état se déduit des actes de sensation et de mouvement, du toucher quant à la mollesse et à la dureté, et de la participation du cerveau et de la moelle ; si la maladie survient soudainement, elle est assurément humide {cite:canon-ibn-sina-print-v2 p.135}"
  ur: "عنيف حرکتیں اعصاب کی علتیں پیدا کرنے میں عظیم مداخلت ہیں، غیر اعضا سے زیادہ، کیونکہ اعصاب حرکتوں کی آلتیں ہیں؛ عصب کی حالتوں کا استدلال حس اور حرکت کے افعال سے، لمس میں نرمی اور سختی سے اور دماغ اور فقار کی اس میں شرکت سے ہوتا ہے؛ اور اگر مرض دفعتاً گزرے تو شبہ نہیں کہ وہ مرطوب ہے {cite:canon-ibn-sina-print-v2 p.135}۔"
