summary:
  ar: "يصف ابن سينا ثلاثة أصناف قريبة من الموجي: الدودي والنملي والمنشاري، ويبين وجه الشبه والفرق {cite:canon-ibn-sina-print-v1 p.173}."
  en: "Ibn Sina describes three kinds close to the wave pulse, the wormlike, the ant and the saw, and shows how they are alike and how they differ {cite:canon-ibn-sina-print-v1 p.173}."
  es: "Ibn Sina describe tres tipos cercanos al pulso de onda, el gusano, la hormiga y la sierra, y muestra en qué se parecen y en qué se diferencian {cite:canon-ibn-sina-print-v1 p.173}."
  fr: "Ibn Sina décrit trois sortes proches de l'impulsion ondulatoire, la vermiforme, la fourmi et la scie, et montre en quoi elles se ressemblent et en quoi elles diffèrent {cite:canon-ibn-sina-print-v1 p.173}."
  ur: "ابن سینا لہر کی نبض کے قریب تین قسموں کو بیان کرتا ہے، کیڑا نما، چیونٹی اور آری، اور یہ بتاتا ہے کہ وہ کیسے ایک جیسے ہیں اور ان میں کیسے فرق ہے"
  tr: "İbn Sina, dalgalı üç türü tanımlar: solucan, karınca ve manşari; benzerlikleri ve farklarını açıklar {cite:canon-ibn-sina-print-v1 s.173}."
  id: "Ibn Sina menggambarkan tiga jenis yang mirip dengan gelombang tersebut: cacing, semut, dan manshari, serta menjelaskan persamaan dan perbedaannya {cite:canon-ibn-sina-print-v1 hlm.173}."
