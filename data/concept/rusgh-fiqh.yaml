id: concept/rusgh-fiqh
class: concept
kind: legal
label:
  ar: "الرسغ"
  en: "Rusgh (the wrist): the limit of washing the hands in ablution and of wiping them in tayammum, and the place of the cut in theft"
  ur: "کلائی (رسغ)"
summary:
  ar: "الرسغ في اللغة مفصل ما بين الساعد والكف، وهو عند الفقهاء موضع الحد في غسل اليد في الوضوء ومسحها في التيمم، وفي السرقة يُقطع اليد من الرسغ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} ويُسنّ غسل اليدين إلى الرسغين في ابتداء الوضوء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8732} واختلف الفقهاء في مسح اليدين في التيمم: فذهب الحنفية والشافعية على المذهب وبعض المالكية إلى مسحهما إلى المرفقين، وذهب الحنابلة وأبو حنيفة في رواية، وجمهور المالكية والشافعية في القديم إلى الرسغين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8732} وذهب الزهري ومحمد بن مسلمة إلى المسح إلى المناكب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} وذهب فقهاء الأمصار إلى أن القطع في السرقة يكون من الرسغ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733}"
  en: "Rusgh in the lexicon is the joint between the forearm and the palm; in the jurists' usage it marks the limit of washing the hands in ablution and wiping them in tayammum, and the place of the cut for theft. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} It is a sunna to wash the hands up to the wrists at the start of ablution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8732} The jurists differ on wiping in tayammum: the Hanafis, the Shafi'is in the school's view and some Malikis take the elbows; the Hanbalis, a view of Abu Hanifa, most Malikis and the older Shafi'i view take the wrists; al-Zuhri and Muhammad ibn Maslama take the shoulders. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} The jurists of the cities hold that a thief's hand is cut from the wrist. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733}"
  ur: "رسغ کلائی کو کہتے ہیں؛ وضو میں ہاتھ کلائیوں تک دھونا سنت ہے، اور چوری میں ہاتھ کلائی سے کاٹا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733}"
