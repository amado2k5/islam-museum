id: concept/rusgh-fiqh
class: concept
kind: legal
label:
  ar: "الرسغ"
  en: "Rusgh (the wrist): the limit of washing the hands in ablution and of wiping them in tayammum, and the place of the cut in theft"
  ur: "کلائی ⁦(رسغ)⁩"
  es: "Rusgh (la muñeca): el límite del lavado de manos en la ablución y de limpiarlas en el tayammum, y el lugar del corte en el robo."
  fr: "Le poignet (Rusgh): limite entre le lavage des mains lors des ablutions et leur essuyage lors du tayammum, et lieu de la coupure lors d'un vol."
  tr: "bilek"
  id: "pergelangan tangan"
summary:
  ar: "الرسغ في اللغة مفصل ما بين الساعد والكف، وهو عند الفقهاء موضع الحد في غسل اليد في الوضوء ومسحها في التيمم، وفي السرقة يُقطع اليد من الرسغ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} ويُسنّ غسل اليدين إلى الرسغين في ابتداء الوضوء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8732} واختلف الفقهاء في مسح اليدين في التيمم: فذهب الحنفية والشافعية على المذهب وبعض المالكية إلى مسحهما إلى المرفقين، وذهب الحنابلة وأبو حنيفة في رواية، وجمهور المالكية والشافعية في القديم إلى الرسغين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8732} وذهب الزهري ومحمد بن مسلمة إلى المسح إلى المناكب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} وذهب فقهاء الأمصار إلى أن القطع في السرقة يكون من الرسغ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733}"
  en: "Rusgh in the lexicon is the joint between the forearm and the palm; in the jurists' usage it marks the limit of washing the hands in ablution and wiping them in tayammum, and the place of the cut for theft. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} It is a sunna to wash the hands up to the wrists at the start of ablution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8732} The jurists differ on wiping in tayammum: the Hanafis, the Shafi'is in the school's view and some Malikis take the elbows; the Hanbalis, a view of Abu Hanifa, most Malikis and the older Shafi'i view take the wrists; al-Zuhri and Muhammad ibn Maslama take the shoulders. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} The jurists of the cities hold that a thief's hand is cut from the wrist. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733}"
  ur: "رسغ کلائی کو کہتے ہیں؛ وضو میں ہاتھ کلائیوں تک دھونا سنت ہے، اور چوری میں ہاتھ کلائی سے کاٹا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733}"
  es: "Rusgh en el léxico es la articulación entre el antebrazo y la palma; en el uso de los juristas marca el límite del lavado de manos en la ablución y de frotarlas en tayammum, y el lugar del corte para el robo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} Es una sunna lavarse las manos hasta las muñecas al comienzo de la ablución. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8732} Los juristas difieren en frotar en tayammum: los hanafíes, los shafi'ís en la opinión de la escuela y algunos malikíes toman los codos; Los hanbalíes, la opinión de Abu Hanifa, la mayoría de los malikíes y la opinión shafi'í más antigua consideran que la mano del ladrón se corta desde la muñeca; al-Zuhri y Muhammad ibn Maslama consideran que se corta desde los hombros. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} Los juristas de las ciudades sostienen que la mano del ladrón se corta desde la muñeca. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733}"
  fr: "Dans le lexique, le terme « rusgh » désigne l'articulation entre l'avant-bras et la paume; selon l'usage des juristes, il marque la limite entre le lavage des mains lors des ablutions et leur essuyage lors du tayammum, ainsi que l'endroit de l'incision pratiquée en cas de vol. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} Il est sunna de se laver les mains jusqu'aux poignets au début des ablutions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8732} Les juristes divergent quant à l'essuyage lors du tayammum: les hanafites, les chaféites (selon leur école) et certains malikites préconisent d'essuyer les coudes. Les hanbalites, l'avis d'Abu Hanifa, la plupart des malikites et l'ancienne école chaféite considèrent que la main est coupée au niveau des poignets; al-Zuhri et Muhammad ibn Maslama considèrent qu'elle est coupée au niveau des épaules. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8732} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733} Les juristes des villes estiment que la main d'un voleur est coupée au niveau du poignet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8733}"
  tr: "Dilbilimde, bilek ön kol ile el arasındaki eklemdir ve hukukçulara göre, abdest alma sırasında elin yıkandığı ve tayammum sırasında sililmesi durumunda hadd cezasının yapıldığı yerdir; hırsızlıkta ise elin bilekten kesildiği için kullanılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8733} Abdest almanın başında ellerin bileklere kadar yıkanması önerilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8732} Hukukçular teyammen sırasında ellerin sililmesi konusunda farklı görüşlere sahipti: Hanafi ve Şafi'ler bu düşünce okulunu takip ederken, bazı Malikiler dirseklerin üzerinden silmeyi seçerken, Hanbaliler ve Ebu Hanifeler bunu rivayet ederken, erken dönemlerde çoğu Maliki ve Şafi'ler bilekleri kullanırdı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8732} Al-Zuhri ve Muhammed ibn Maslamah bilekleri silmeye karar verdiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8733} Bölgelerin hukukçuları, hırsızlıkta kesiklerin bilekten yapıldığını savunmuştur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8733}"
  id: "Dalam linguistik, pergelangan tangan adalah sendi antara lengan bawah dan tangan, dan menurut ahli hukum, pergelangan tangan adalah tempat hukuman hadd untuk mencuci tangan saat wudhu dan mengelapnya saat tayammum, dan dalam pencurian, tangan dipotong dari pergelangan tangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8733} Disarankan untuk mencuci tangan hingga pergelangan tangan pada awal wudhu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8731} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8732} Para ahli hukum berbeda pendapat mengenai mengelap tangan saat tayammum: Hanafi dan Shafi'i mengikuti aliran pemikiran tersebut, sementara beberapa Maliki memutuskan untuk mengelap tangan di atas siku, sementara Hanbal dan Abu Hanifa menceritakannya, sementara mayoritas Malik dan Shafi'i pada masa awal menggunakan pergelangan tangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8732} Al-Zuhri dan Muhammad ibn Maslamah berpegang pada pengusap pergelangan tangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8733} Para ahli hukum di daerah tersebut berpendapat bahwa luka dalam pencurian berasal dari pergelangan tangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8733} Para ahli hukum di daerah tersebut berpendapat bahwa luka dalam pencurian berasal dari pergelangan tangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8733}"
