id: concept/shuquq-al-shaftayn
class: concept
kind: scientific
label:
  ar: "شقوق الشفتين"
  en: "The fissures of the lips"
  ur: "ہونٹوں کی شقیں"
  es: "Las fisuras de los labios"
  fr: "Les fissures des lèvres"
  tr: "Dudak yarıkları"
  id: "Celah bibir"
summary:
  ar: "شقوق الشفتين أدويتها التي تجمع إلى القبض والتجفيف تلييناً، ومن النافعة فيها ما أمسكه في الفم وقلبه باللسان، ومن التدبير النافع فيها تدهين السرة والمقعدة وأن يطلى عليها بما وصف من المياه والألعاب، ومن الدسومات ما وصف من الزبد والمخ والشحوم ⁦(شحم الدجاج محمول كما سماه الكتاب ومعروض على المؤسس)⁩، ومن الأدوية المجربة ما وصف ويتخذ منها كالمرهم، ويجعل الغذاء ما وصف ⁦(الأسماء من هذا الجنس محمولة كما سماها الكتاب ومطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.283}"
  en: "The lips' fissures: their drugs are those joining softening to astringency and drying; of the beneficial is what is held in the mouth and turned over with the tongue; of the beneficial regimen, anointing the navel and the anus and painting them with what he described of the waters and mucilages; of the greases, what he described of butter, marrow and fats (the chicken fat carried as the book names it, set before the founder); and of the tried drugs what he described, made like a salve; and the food is made what he described (the names of this kind carried as the book names them and left out) {cite:canon-ibn-sina-print-v2 p.283}"
  ur: "ہونٹوں کی شقوں کے ادویہ وہ ہیں جو قبض اور تجفیف کے ساتھ نرمی جمع کریں؛ سودا کرنے والوں میں وہ ہے جسے منہ میں روک کر زبان سے پھیرا جائے؛ سودا مند تدبیر میں ناف اور مقعد کا تیل ملنا اور بیان کردہ پانیوں اور لعابوں سے لیپنا ہے؛ چکنی چیزوں میں بیان کردہ مکھن مغز اور چربیاں ہیں ⁦(مرغی کی چربی کتاب کے نام پر محمول اور مؤسس کے سامنے معروض)⁩؛ اور مجرب ادویہ میں اس کی بیان کردہ چیزیں ہیں جن سے مرہم جیسی چیز بنائی جاتی ہے؛ اور غذا وہی رکھی جاتی ہے جو اس نے بیان کی ⁦(اسی جنس کے نام کتاب کے نام پر محمول اور مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.283}"
  es: "Las fisuras de los labios: sus remedios son aquellos que combinan suavización, astringencia y sequedad; de lo beneficioso es lo que se mantiene en la boca y se remueve con la lengua; del régimen beneficioso, ungir el ombligo y el ano y pintarlos con lo que describió de las aguas y mucílagos; de las grasas, lo que describió de mantequilla, médula y grasas (la grasa de pollo se lleva como la nombra el libro, colocada ante el fundador); y de los remedios probados lo que describió, hecho como ungüento; y la comida se hace como él describió (los nombres de este tipo se llevan como los nombra el libro y se omiten) {cite:canon-ibn-sina-print-v2 p.283}"
  fr: "Les fissures des lèvres: leurs remèdes sont ceux qui allient adoucissement, astringence et dessèchement; parmi les bienfaits, on trouve ce que l’on garde en bouche et que l’on retourne avec la langue; parmi les bienfaits, on oint le nombril et l’anus et on les badigeonne de ce qu’il décrit comme eaux et mucilages; parmi les graisses, ce qu’il décrit comme beurre, moelle et graisses (la graisse de poulet, telle que nommée dans le livre, placée devant le fondeur); et parmi les remèdes éprouvés, ce qu’il décrit, préparé comme un onguent; et la nourriture est faite comme il le décrit (les noms de ce genre sont repris tels qu’ils apparaissent dans le livre et omis) {cite:canon-ibn-sina-print-v2 p.283}"
  tr: "Yarık dudaklar, onları yumuşakça sıkılaştırmak ve kurutmak için birleştirilen ilaçlardır. Faydalı olanlar arasında ağızda ve kalpte dil ile tutulanlar vardır. Faydalı çözümler arasında göbek ve ayak bileğinin yağlanması ve su ile oyuncaklarla kaplanması yer alır. Tanımlanan yağlar arasında tereyağı, beyin ve yağ gibi yağlar vardır (tavuk yağı, kitapta adlandırıldığı gibi ve kurucusuna sunulur). Denenmiş ilaçlar arasında merhem olarak tanımlanan ve kullanılan ilaçlar vardır ve yiyecekler anlatıldığı gibi yapılır (bu cinsin isimleri kitapta adlandırıldığı ve çıkarıldığı şekilde belirlenmiştir) {cite:canon-ibn-sina-print-v2 s.283}"
  id: "Bibir sumbing adalah obat yang digabungkan untuk mengencang dan mengeringkannya dengan lembut. Di antara yang bermanfaat adalah yang ditahan di mulut dan jantung dengan lidah. Di antara obat yang bermanfaat adalah pelumasan pada pusar dan pergelangan kaki serta melapisinya dengan air dan mainan yang dijelaskan. Di antara lemak tersebut adalah yang dijelaskan seperti mentega, otak, dan minyak (lemak ayam diprediksi seperti yang disebut buku dan diberikan kepada pendiri). Di antara obat yang telah diuji adalah yang dijelaskan dan digunakan sebagai salep, dan makanan dibuat sesuai dengan yang dijelaskan (nama genus ini didasarkan seperti yang disebut buku dan dikurangkan) {cite:canon-ibn-sina-print-v2 hlm.283}"
