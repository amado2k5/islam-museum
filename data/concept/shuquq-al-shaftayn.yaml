id: concept/shuquq-al-shaftayn
class: concept
kind: scientific
label:
  ar: "شقوق الشفتين"
  en: "The fissures of the lips"
  ur: "ہونٹوں کی شقیں"
summary:
  ar: "شقوق الشفتين أدويتها التي تجمع إلى القبض والتجفيف تلييناً، ومن النافعة فيها ما أمسكه في الفم وقلبه باللسان، ومن التدبير النافع فيها تدهين السرة والمقعدة وأن يطلى عليها بما وصف من المياه والألعاب، ومن الدسومات ما وصف من الزبد والمخ والشحوم ⁦(شحم الدجاج محمول كما سماه الكتاب ومعروض على المؤسس)⁩، ومن الأدوية المجربة ما وصف ويتخذ منها كالمرهم، ويجعل الغذاء ما وصف ⁦(الأسماء من هذا الجنس محمولة كما سماها الكتاب ومطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.283}"
  en: "The lips' fissures: their drugs are those joining softening to astringency and drying; of the beneficial is what is held in the mouth and turned over with the tongue; of the beneficial regimen, anointing the navel and the anus and painting them with what he described of the waters and mucilages; of the greases, what he described of butter, marrow and fats (the chicken fat carried as the book names it, set before the founder); and of the tried drugs what he described, made like a salve; and the food is made what he described (the names of this kind carried as the book names them and left out) {cite:canon-ibn-sina-print-v2 p.283}"
  ur: "ہونٹوں کی شقوں کے ادویہ وہ ہیں جو قبض اور تجفیف کے ساتھ نرمی جمع کریں؛ سودا کرنے والوں میں وہ ہے جسے منہ میں روک کر زبان سے پھیرا جائے؛ سودا مند تدبیر میں ناف اور مقعد کا تیل ملنا اور بیان کردہ پانیوں اور لعابوں سے لیپنا ہے؛ چکنی چیزوں میں بیان کردہ مکھن مغز اور چربیاں ہیں ⁦(مرغی کی چربی کتاب کے نام پر محمول اور مؤسس کے سامنے معروض)⁩؛ اور مجرب ادویہ میں اس کی بیان کردہ چیزیں ہیں جن سے مرہم جیسی چیز بنائی جاتی ہے؛ اور غذا وہی رکھی جاتی ہے جو اس نے بیان کی ⁦(اسی جنس کے نام کتاب کے نام پر محمول اور مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.283}"
