summary:
  ar: "التذكية سبب لإباحة أكل الحيوان البري الذي من شأنه الذبح، وتشمل الذبح والنحر والعقر والصيد. ويشترط عند الجمهور في المذكي الإسلام أو الكتابية والتمييز، وتشترط التسمية وقت التذكية عند الجمهور إلا إذا نسيها. ولا يحل بالسن والظفر القائمين. أما السمك والجراد فيحلان بلا تذكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4912}"
  en: "Tadhkiya is the lawful cause that makes the flesh of a land animal that is slaughtered allowed to eat. It covers slaughter, throat-cutting at the base of the neck, wounding an animal beyond reach, and hunting. Most jurists require that the one who slaughters be a Muslim or a People of the Book, and discerning; they require the naming of God at the time, unless it was forgotten. A tooth or nail still attached to the body may not be used; fish and locusts are lawful without it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4912}"
