label:
  ar: "التذكية"
  en: "Tadhkiya (ritual slaughter and taking of game)"
  ur: "تذکیہ ⁦(شرعی ذبح اور شکار کا ذبح)⁩"
  es: "Tadhkiya (sacrificio ritual y captura de animales de caza)"
  fr: "Tadhkiya (abattage rituel et capture du gibier)"
summary:
  ar: "التذكية سبب لإباحة أكل الحيوان البري الذي من شأنه الذبح، وتشمل الذبح والنحر والعقر والصيد. ويشترط عند الجمهور في المذكي الإسلام أو الكتابية والتمييز، وتشترط التسمية وقت التذكية عند الجمهور إلا إذا نسيها. ولا يحل بالسن والظفر القائمين. أما السمك والجراد فيحلان بلا تذكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4912}"
  en: "Tadhkiya is the lawful cause that makes the flesh of a land animal that is slaughtered allowed to eat. It covers slaughter, throat-cutting at the base of the neck, wounding an animal beyond reach, and hunting. Most jurists require that the one who slaughters be a Muslim or a People of the Book, and discerning; they require the naming of God at the time, unless it was forgotten. A tooth or nail still attached to the body may not be used; fish and locusts are lawful without it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4912}"
  es: "Tadhkiya es la causa lícita que permite comer la carne de un animal terrestre sacrificado. Abarca el sacrificio, el degollamiento en la base del cuello, las heridas incapacitantes y la caza. La mayoría de los juristas exigen que quien sacrifica sea musulmán o perteneciente a la Gente del Libro, y que sea perspicaz; además, requieren que se mencione a Dios en ese momento, a menos que se haya olvidado. No se puede utilizar un diente o una uña que aún esté adherido al cuerpo; el pescado y las langostas son lícitos sin ellos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4912}"
  fr: "La tadhkiya est la cause licite qui autorise la consommation de la chair d'un animal terrestre abattu. Elle englobe l'abattage, l'égorgement (tranchage à la base du cou), la blessure infligée à un animal hors de portée et la chasse. La plupart des juristes exigent que celui qui abat l'animal soit musulman ou membre des Gens du Livre, et qu'il soit clairvoyant; ils exigent également que le nom de Dieu soit invoqué au moment de l'abattage, sauf oubli. Une dent ou un ongle encore attaché au corps ne peut être consommé; le poisson et les sauterelles sont licites sans ces éléments. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4912}"
