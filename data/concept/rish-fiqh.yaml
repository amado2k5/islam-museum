id: concept/rish-fiqh
class: concept
kind: legal
label:
  ar: "الريش"
  en: "Rish: feathers, plumage, and their rulings of purity and use in Islamic jurisprudence"
  ur: "ریش (پرندوں کے پر اور ان کی طہارت و استعمال کے فقہی احکام)"
summary:
  ar: "الريش لغة كسوة الطائر والواحدة ريشة، ويطلق الرياش على اللباس والأثاث، وفي الاصطلاح هو كسوة الطير المقابلة للشعر والصوف والوبر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9048} اتفق الفقهاء على قياس الريش على الشعر، وريش الطير المأكول المتصل به حال حياته طاهر إجماعا، واختلفوا في المنفصل والمنتوف فطاهر عند الجمهور، بينما فرق المالكية بين الزغب فطاهر والقصب فنجس، وذهب الشافعية في الأصح إلى نجاسة المنفصل من الحي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9049} وريش ميتة الطير المأكول طاهر عند الحنفية والحنابلة لأن الحياة لا تحله، ونجس عند الشافعية، وعند المالكية يطهر الزغب بالجز دون القصب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9050} دباغة الجلد لا تطهر ريشه عند الشافعية لأنه لا يتأثر بالدباغ، ويحرم على المحرم نتف ريش الصيد وفيه الفدية إن منعه من الطيران، كما يجوز الاستنجاء بالريش الطاهر القالع غير المحترم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9051} يصح السلم في الريش بالوصف والوزن، وإذا غلي الطير في الماء الحار لنتف ريشه قبل إخراج أمعائه نجس باطن لحمه إن نفذت النجاسة بالحرارة، وإلا طهر ظاهره بالغسل إن كان مجرد تليين للمنابت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9052}"
  en: "Rish lexically denotes the plumage of birds, and riyash denotes furnishings and fine clothing, while in fiqh terminology it refers to avian plumage corresponding to mammalian hair, wool, and fur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9048} Jurists agree on drawing an analogy between feathers and hair; feathers attached to living edible birds are pure by consensus, whereas plucked or shed feathers are deemed pure by the majority, though the Malikis classify down as pure and quills as impure, and the Shafi'is regard detached body parts from living animals as impure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9049} Feathers taken from edible carrion are judged pure by Hanafis and Hanbalis because life does not reside in them, impure by Shafi'is, and down alone is pure according to Malikis if sheared. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9050} Tanning skin does not purify attached feathers for the Shafi'is because feathers are unaffected by tanning agents, plucking game feathers in the state of ihram is prohibited and requires compensation, and dry cleansing (istinja') with clean, unhallowed feathers is permissible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9051} Forward contracts (salam) in defined feathers by weight are valid, and plunging an ungutted bird into boiling water to pluck feathers renders internal flesh impure if boiling heat drives intestine impurities inward, whereas superficial softening of quills without internal cooking allows external washing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9052}"
  ur: "ریش پرندوں کے پروں کو کہتے ہیں اور اصطلاح میں جانوروں کے بال اور اون کے مقابلے میں پرندوں کا غلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9048} فقہاء کے نزدیک پروں کے احکام بالوں جیسے ہیں، حلال پرندے کے جڑے ہوئے پر بالاتفاق پاک ہیں، اکھڑے ہوئے پر جمہور کے نزدیک پاک ہیں جبکہ مالکیہ زغب یعنی باریک رونگٹے کو پاک اور نلی کو ناپاک قرار دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9049} مردار حلال پرندے کے پر حنفیہ اور حنابلہ کے نزدیک پاک ہیں کیونکہ ان میں زندگی نہیں ہوتی، شوافع کے نزدیک ناپاک ہیں، اور مالکیہ کے نزدیک زغب قینچی سے کاٹنے پر پاک رہتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9050} کھال کی دباغت سے اس پر لگے پر شوافع کے نزدیک پاک نہیں ہوتے، محرم کے لیے شکار کے پر نوچنا حرام اور فدیہ کا موجب ہے، اور پاک پروں سے استنجا مباح ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9051} پروں میں بیع سلم وزن اور اوصاف کے تعین کے ساتھ جائز ہے، اور پر اتارنے کے لیے پیٹ چاک کیے بغیر کھولتے پانی میں مرغی ڈالنے سے اگر نجاست گوشت کے اندر سرایت کر جائے تو باطن ناپاک ہو جاتا ہے، ورنہ صرف دھونا کافی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9052}"
