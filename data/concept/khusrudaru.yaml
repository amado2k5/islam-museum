summary:
  ar: "خسرودارو في الكتاب دواء ينقل فيه قول ماسرجويه إنه خولنجان ويخالفه غيره؛ حار يابس محلل مذيب، ينفع من القولنج ووجع الكلى وأكثر خاصيته في أوجاع الكلى، وفيه نقل موسوم عن الباه في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.705}"
  en: "Khusrudaru is in the book a drug of which the book quotes Masarjawayh that it is khawlanjan, others differing; hot and dry, dissolving and melting, it benefits colic and kidney pain, most of its property being in kidney pains, and it has a labelled listing on desire in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.705}"
  ur: "خسرودارو کتاب میں ایک دوا ہے جس کے بارے میں ماسرجویہ کا قول نقل ہے کہ وہ خولنجان ہے اور دوسرے اس کے خلاف کہتے ہیں؛ گرم خشک، تحلیل کرنے والا اور گھلانے والا، قولنج اور گردوں کے درد میں نافع ہے اور اس کی اکثر خاصیت گردوں کے دردوں میں ہے، اور باہ کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 p.705}۔"
  es: "Khusrudaru es en el libro un medicamento del cual el libro cita a Masarjawayh que es khawlanjan, otros difieren; caliente y seco, disuelto y fundido, beneficia el cólico y el dolor de riñón, siendo la mayor parte de su propiedad en dolores renales, y tiene una lista etiquetada sobre el deseo en una sección reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v1 p.705}"
