label: { ar: "الكواكب التي لا تغيب والتي لا تظهر في الزيج الصابي", en: "Stars that never set and stars that never rise", ur: "وہ ستارے جو کبھی غروب نہیں ہوتے اور جو کبھی طلوع نہیں ہوتے" }
summary:
  ar: "يبيّن البتاني أن في كل خط من الخطوط المتوازية الشمالية دائرة مركزها قطب معدل النهار الشمالي، ونصف قطرها ارتفاع القطب، فالكواكب التي تقع فيها لا تغيب أبداً، والكواكب التي يقابلها في الجنوب دائرة نصف قطرها انخفاض القطب لا تظهر أبداً، وما عداها يطلع ويغرب، وما قرب من الدائرة قد يُرى في الليلة مرتين. {cite:zij-sabi-nallino-byblion p.26}."
  en: "Al-Battani shows that on every northern parallel there is a circle centred on the northern pole of the equator of the day, with radius equal to the pole's altitude: stars inside it never set; a matching circle about the southern pole with radius equal to the pole's depression holds stars that never appear; all other stars rise and set, and one near the boundary may be seen twice in a night. {cite:zij-sabi-nallino-byblion p.26}."
  ur: "البتانی دکھاتے ہیں کہ ہر شمالی متوازی خط پر معدل النہار کے شمالی قطب کو مرکز بنا کر ایک دائرہ ہوتا ہے جس کا نصف قطر قطب کی بلندی کے برابر ہے؛ اس کے اندر کے ستارے کبھی غروب نہیں ہوتے، اسی طرح جنوبی قطب کے گرد قطب کے انخفاض کے برابر نصف قطر کے دائرے میں کے ستارے کبھی ظاہر نہیں ہوتے، باقی ستارے طلوع و غروب کرتے ہیں، اور دائرے کی حد کے قریب والا ستارہ ایک رات میں دو بار بھی دکھائی دے سکتا ہے۔ {cite:zij-sabi-nallino-byblion p.26}۔"
