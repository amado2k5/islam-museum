label:
  ar: "حوت يونس"
  en: "The whale of Jonah"
  ur: "یونس کی وہیل"
summary:
  ar: "الحوت الذي التقم يونس وهو مليم فنادى في الظلمات أن لا إله إلا أنت سبحانك إني كنت من الظالمين فاستجاب الله ونجّاه من الغم ونبذه بالعراء وهو سقيم وأنبت عليه شجرة من يقطين، وفي الحديث أكل جيش أبي عبيدة من العنبر أياماً."
  en: "The whale that swallowed Jonah while he was blameworthy; he called through the darkness — 'There is no god but You; glory to You; I was among the wrongdoers' — and God answered him, cast him sick upon the bare shore and grew over him a gourd plant. In hadith Abu Ubayda's army ate of the beached anbar for days."
  ur: "وہ وہیل جس نے یونس کو قابلِ ملامت حال میں نگلا؛ انہوں نے اندھیروں میں پکارا 'تیرے سوا کوئی معبود نہیں تو پاک ہے میں ظالموں میں تھا' — اللہ نے سنی، بے جان ساحل پر نکالا اور کدو کا پودا اگایا۔ حدیث میں ابو عبیدہ کی فوج نے ساحل کی عنبر سے کئی دن خوراک لی۔"
