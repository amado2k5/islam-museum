id: concept/ilaj-al-subat-min-bard-kharij
class: concept
kind: scientific
label:
  ar: "علاج السبات من برد يصل من خارج"
  en: "Treatment of coma from cold that comes from outside"
  ur: "بیرونی سردی سے غنودگی کا علاج"
  es: "Tratamiento del coma por frío que proviene del exterior"
  fr: "Traitement du coma dû à un rhume d'origine extérieure"
  tr: "Dışarıdan gelen soğuk algınlığına karşı kış uykusunun tedavisi"
  id: "Pengobatan hibernasi akibat flu yang datang dari luar"
summary:
  ar: "يذكر ابن سينا أن علاج السبات من برد خارجي هو تسخين مزاج الدماغ بما سبق ذكره بعنف لا برفق؛ ولا تُنقل الوصفات ولا طرق الاستعمال {cite:canon-ibn-sina-print-v2 p.93}"
  en: "Ibn Sina says the cure of coma from cold from outside is the warming of the temperament of the brain by what was stated before, with force and not gently; recipes and methods of application are not reproduced {cite:canon-ibn-sina-print-v2 p.93}"
  ur: "ابن سینا کہتا ہے کہ بیرونی سردی سے غنودگی کا علاج دماغ کے مزاج کو اسی سے گرم کرنا ہے جو پہلے بیان ہوا، سختی سے نہ کہ نرمی سے؛ نسخے اور استعمال کے طریقے نقل نہیں کیے گئے {cite:canon-ibn-sina-print-v2 p.93}۔"
  es: "Ibn Sina afirma que la cura del coma provocado por el frío externo consiste en calentar el temperamento del cerebro mediante lo indicado anteriormente, con fuerza y no con suavidad; no se reproducen recetas ni métodos de aplicación {cite:canon-ibn-sina-print-v2 p.93}."
  fr: "Ibn Sina affirme que le remède au coma dû au froid extérieur consiste à réchauffer le tempérament du cerveau selon la méthode décrite précédemment, avec vigueur et non en douceur; les recettes et les modes d’application ne sont pas reproduits {cite:canon-ibn-sina-print-v2 p.93}"
  tr: "İbn Sina, dış soğuktan kaynaklanan kış uykusunun tedavisinin beynin ruh halini şiddetle ısıtmak olduğunu, daha önce belirtildiği gibi nazikçe değil; ne tarifleri ne de kullanım yöntemlerini {cite:canon-ibn-sina-print-v2 s.93}"
  id: "Ibn Sina menyebutkan bahwa mengobati hibernasi dari dingin luar adalah dengan memanaskan suasana hati otak secara ganas, bukan perlahan, seperti yang telah disebutkan sebelumnya; baik resep maupun metode penggunaannya {cite:canon-ibn-sina-print-v2 hlm.93}"
