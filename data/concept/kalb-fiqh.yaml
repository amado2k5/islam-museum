label:
  ar: "الكَلْب"
  en: "Dog (kalb), fiqh rulings"
  ur: "کتا (فقہی احکام)"
summary:
  ar: "الكلب في اللغة كل سبع عقور، والجمع أكلب وكلاب، وفي الاصطلاح هو الحيوان النباح {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13494}. وهو أعم منه السبع، فكل كلب سبع وليس كل سبع كلباً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13495}."
  en: "The dog (kalb) is, in lexical sense, any fanged predator, and in law the animal that barks; sabʿ, predator, is wider than it, since every dog is a predator but not every predator is a dog {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13495}."
  ur: "کلب لغت میں ہر نوکیلے دانت والا درندہ ہے، اور شرعی اصطلاح میں وہ جانور جو بھونکتا ہے؛ سبع (درندہ) اس سے عام ہے، کیونکہ ہر کتا درندہ ہے مگر ہر درندہ کتا نہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13495}۔"
