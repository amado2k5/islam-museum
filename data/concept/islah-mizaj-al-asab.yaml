id: "concept/islah-mizaj-al-asab"
class: "concept"
kind: "scientific"
label:
  ar: "إصلاح مزاج العصب وما ينفعه ويضرّه"
  en: "Reforming the nerve's temperament; what helps and harms it"
  ur: "عصب کے مزاج کی اصلاح اور اس کے نفع اور نقصان"
  es: "Reformando el temperamento del nervio; qué lo ayuda y qué lo perjudica."
  fr: "Réformer le tempérament du système nerveux; ce qui l'aide et ce qui lui nuit"
  tr: "Sinirin ruh halini düzeltmek ve ona neyin fayda ve zararlar verdiği"
  id: "Memperbaiki suasana hati saraf dan apa yang bermanfaat serta merugikan saraf tersebut"
summary:
  ar: "أكثر ما يحتاج إليه أصحاب أمراض العصب من المبدّلات ما يسخّن؛ وأكثر أمراض العصب يقصد في علاجها فصد مؤخر الدماغ إلا ما كان في الوجه ثم مبدأ العصب الذي يحرّك العضو المريض؛ ويضرّهم النوم على الإمتلاء والماء البارد المثلوج والحوامض والنوافخ والمبرّدات القوية والفصد الكثير {cite:canon-ibn-sina-print-v2 p.135} {cite:canon-ibn-sina-print-v2 p.136}"
  en: "Most of the temperament-changers that people with nerve diseases need are the warming ones; in most nerve diseases the treatment aims at venesection of the back of the brain — except what is in the face — then at the origin of the nerve moving the sick member; sleeping on fullness, icy cold water, acids, flatulents, strong coolers and much venesection harm them {cite:canon-ibn-sina-print-v2 p.135} {cite:canon-ibn-sina-print-v2 p.136}"
  ur: "اعصاب کے امراض والوں کو مزاج بدلنے والوں میں سب سے زیادہ گرم کرنے والوں کی ضرورت ہوتی ہے؛ اکثر اعصاب کے امراض میں علاج مؤخر الدماغ کی فصد کی طرف موجہ ہوتا ہے — سوائے اس کے جو چہرے میں ہو — پھر اس عصب کی جڑ کی طرف جو بیمار عضو کو چلاتا ہے؛ اور انہیں امتلاء پر سونا، منجمد ٹھنڈا پانی، حوامض، نوافخ، زور دار مبردات اور کثیر فصد نقصان پہنچاتی ہے {cite:canon-ibn-sina-print-v2 p.135} {cite:canon-ibn-sina-print-v2 p.136}۔"
  es: "La mayoría de los agentes que modifican el temperamento que necesitan las personas con enfermedades nerviosas son los que generan calor; en la mayoría de las enfermedades nerviosas, el tratamiento apunta a la flebotomía de la parte posterior del cerebro —excepto la que está en la cara— y luego al origen del nervio que mueve el miembro afectado; dormir con el estómago lleno, el agua helada, los ácidos, los flatulencias, los enfriadores fuertes y la flebotomía excesiva les perjudican {cite:canon-ibn-sina-print-v2 p.135} {cite:canon-ibn-sina-print-v2 p.136}"
  fr: "La plupart des remèdes pour modifier l'humeur dont les personnes atteintes de maladies nerveuses ont besoin sont réchauffants; dans la plupart des cas, le traitement vise la saignée de la région postérieure du cerveau (à l'exception de celle du visage), puis à l'origine du nerf qui innerve le membre malade; dormir après avoir trop mangé, boire de l'eau glacée, consommer des acides, des flatulents, des boissons rafraîchissantes puissantes et pratiquer de nombreuses saignées leur sont néfastes. {cite:canon-ibn-sina-print-v2 p.135} {cite:canon-ibn-sina-print-v2 p.136}"
  tr: "Sinir hastalığı olan kişilerin anahtarlardan en çok ihtiyaç duyduğu şey ısınmaktır; çoğu sinir hastalığı, beynin arka kısmındaki dirençli refrakterlerle tedavi edilir, yüz hariç, ardından etkilenen organı hareket ettiren sinir. Uyku, onları tok hissettirebilir, soğuk buz gibi su, asitler, üfleyiciler, güçlü soğutucular ve aşırı flebitoma {cite:canon-ibn-sina-print-v2 s.135} {cite:canon-ibn-sina-print-v2 s.136}"
  id: "Yang paling dibutuhkan orang dengan penyakit saraf dari saklar adalah pemanasan; sebagian besar penyakit saraf diobati dengan refraktori refraktori di bagian belakang otak, kecuali wajah, lalu saraf yang menggerakkan organ yang terkena. Tidur dapat membuat mereka merasa penuh, air dingin seperti es, asam, blower air, pendingin kuat, dan flesitoma berlebihan {cite:canon-ibn-sina-print-v2 hlm.135} {cite:canon-ibn-sina-print-v2 hlm.136}"
