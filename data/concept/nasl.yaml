label: { ar: "النَّسْل", en: "Offspring (nasl) and its legal rulings", ur: "نسل اور اس کے احکام", es: "Offspring (nasl) y sus resoluciones legales", fr: "Descendance (nasl) et ses décisions juridiques", tr: "yavru", id: "keturunan" }
summary:
  ar: "النسل في اللغة الولد والذرية، ويطلقه الفقهاء على الولد من إنسان أو حيوان، وعلى الحمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} والنسل من مقاصد الشريعة وأحد الكليات الضرورية، لأن بقاء النوع الإنساني متوقف عليه، ونقل الشاطبي أن الضروريات خمسة هي الدين والنفس والنسل والمال والعقل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} وذكر السرخسي أن النكاح هو طريق التناسل المشروع، والغزالي أن المقصود من النكاح إبقاء النسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} ويُحَثّ على تكثير النسل بتزوج الودود الولود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15683} ويُمنع الخصاء لأنه يقطع النسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} واختلف الفقهاء في العزل، فمنعه بعضهم مطلقاً وأجازه بعضهم مطلقاً وأجازه آخرون بإذن الزوجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15683} ومنع المالكية ما يقطع النسل من الرجل، وكره الشافعية قطع النسل ولو بدواء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} واتفق الفقهاء على حرمة الإجهاض بعد نفخ الروح، واختلفوا قبله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} ومن أتلف نسل إنسان بالاعتداء ففيه الدية كاملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} وولد المغصوب يُرد مع أمه إلى صاحبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} واختلفوا في دخول نسل الحيوان المرهون في الرهن، فجمهور الفقهاء يُدخلونه، والشافعية لا يُدخلونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} ويدخل أولاد البنات في الوقف على النسل عند الشافعية وبعض الحنفية والحنابلة، ولا يدخلون عند الحنابلة إلا بقرينة وعند المالكية بحسب العرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686} ولا يصح السلم في نسل حيوان معين لندرة اجتماع الوصفين عند الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686}"
  en: "Nasl means offspring or progeny in the lexicon, and the jurists use it for the young of a human or an animal, and for the foetus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} Offspring is one of the aims of the Law and one of the necessities that must be preserved, since the continuation of the human kind depends on it; al-Shatibi lists five necessities, namely religion, life, offspring, property and reason. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} Al-Sarakhsi holds that marriage is the lawful path to procreation, and al-Ghazali that its purpose is to continue the offspring. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} The Prophet urged marrying an affectionate, prolific woman, and the entry reports a hadith with the grade attributed to al-Haythami. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15683} Castration is forbidden because it cuts off offspring. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} The jurists differ on coitus interruption: some forbid it outright, some allow it outright, and some allow it only with the wife's permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15683} The Malikis forbid a man to cut off his semen so that he cannot father a child; the Shafi'is hold that cutting offspring is forbidden even with medicine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} The jurists agree that abortion is forbidden after ensoulment and differ before it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} Whoever harms a person and thereby destroys his capacity to beget owes full blood money. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} The young of a usurped animal is returned with its mother. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} On a mortgaged animal, the majority hold that its young is mortgaged with it, while the Shafi'is disagree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} In a waqf made for the offspring, the Shafi'is, some Hanafis and the Hanbalis admit the children of daughters, while the Hanbalis admit them only with a clue and the Malikis by custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686} A forward sale of the young of a particular animal is not valid for the Shafi'is and Hanbalis, because such a combination is rare. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686}"
  ur: "نسل کا لغوی معنی اولاد اور ذریت ہے، اور فقہاء انسان یا جانور کی اولاد اور حمل کے لیے بھی یہ لفظ استعمال کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} نسل شریعت کے مقاصد میں سے ہے، اور نکاح کا مقصد اس کی بقا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} خصی کرنا نسل کو منقطع کرتا ہے اس لیے ممنوع ہے، اور عزل میں فقہاء کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} روح پھونکے جانے کے بعد اسقاطِ حمل کی حرمت پر اتفاق ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} غصب شدہ جانور کا بچہ اس کی ماں کے ساتھ مالک کو لوٹایا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685}"
  es: "Nasl significa descendencia o progenie en el léxico, y los juristas lo usan para referirse a las crías de un ser humano o un animal, y para el feto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} La descendencia es uno de los objetivos de la Ley y una de las necesidades que deben preservarse, ya que la continuación de la especie humana depende de ella; al-Shatibi enumera cinco necesidades, a saber, religión, vida, descendencia, propiedad y razón. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} Al-Sarakhsi sostiene que el matrimonio es la vía lícita para la procreación, y al-Ghazali que su propósito es continuar la descendencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} El Profeta instó a casarse con una mujer cariñosa y prolífica, y la entrada informa un hadiz con el grado atribuido a al-Haythami. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15683} La castración está prohibida porque corta la descendencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} Los juristas difieren sobre la interrupción del coito: algunos la prohíben directamente, algunos la permiten directamente, y algunos la permiten solo con el permiso de la esposa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15683} Los malikíes prohíben a un hombre cortar su semen para que no pueda engendrar un hijo; los shafi'íes sostienen que cortar la descendencia está prohibido incluso con medicina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} Los juristas coinciden en que el aborto está prohibido después de la infusión del alma y difieren antes de ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} Quien dañe a una persona y, por lo tanto, destruya su capacidad de procrear, deberá pagar una indemnización completa por la sangre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} La cría de un animal usurpado se devuelve con su madre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} En un animal empeñado, la mayoría sostiene que su cría se empeña con él, mientras que los shafi'ís discrepan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} En un waqf hecho para la descendencia, los shafi'íes, algunos hanafíes y los hanbalíes admiten a los hijos de las hijas, mientras que los hanbalíes los admiten solo con una pista y los malikíes por costumbre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686} Una venta anticipada de la cría de un animal en particular no es válida para los shafi'íes y los hanbalíes, porque tal combinación es rara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686}"
  fr: "Dans le lexique, « nasl » signifie descendance ou progéniture, et les juristes l'emploient pour désigner les petits d'un être humain ou d'un animal, ainsi que le fœtus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} La descendance est l'un des buts de la Loi et une nécessité à préserver, car la perpétuation de l'humanité en dépend. Al-Shatibi énumère cinq nécessités: la religion, la vie, la descendance, la propriété et la raison. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} Al-Sarakhsi considère le mariage comme la voie licite de la procréation, et al-Ghazali comme son but: assurer la continuité de la descendance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} Le Prophète a exhorté à épouser une femme aimante et prolifique, et l'entrée rapporte un hadith dont l'authenticité est attribuée à al-Haythami. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15683} La castration est interdite car elle prive de descendance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} Les juristes divergent sur l'interruption du coït: certains l'interdisent formellement, d'autres l'autorisent, et d'autres encore ne l'autorisent qu'avec le consentement de l'épouse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15683} Les Malikites interdisent à un homme de se couper le sperme afin de ne pas pouvoir engendrer d'enfant; les Chafi'ites considèrent que la castration est interdite même avec des médicaments. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} Les juristes s'accordent sur l'interdiction de l'avortement après l'animation, mais divergent avant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} Quiconque porte atteinte à une personne et la rend ainsi incapable de procréer doit payer l'intégralité du prix du sang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} Le petit d'un animal usurpé est restitué à sa mère. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} Concernant un animal hypothéqué, la majorité considère que son petit est hypothéqué avec lui, tandis que les shafi'ites sont d'un avis contraire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} Dans un waqf constitué pour la descendance, les chaféites, certains hanafites et les hanbalites admettent les enfants des filles, tandis que les hanbalites ne les admettent qu'avec un indice et les malikites par coutume. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686} La vente anticipée des petits d'un animal particulier n'est pas valable pour les chaféites et les hanbalites, car une telle combinaison est rare. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686}"
  tr: "Dilde yavru çocuk ve yavru anlamına gelirken, hukukçular insan veya hayvandan doğan bir çocuk ve hamileliği ifade eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15682} Çocuk, Şeriat'ın amaçlarından biri ve temel evrensellerden biridir, çünkü insan türünün hayatta kalması buna bağlıdır. Al-Shatibi, gerekliliklerin beş olduğunu aktarmıştır: din, yaşam, çocuklar, zenginlik ve akıl. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15682} Al-Sarakhsi, evliliğin yasal üreme yolu olduğunu, Al-Gazali ise evliliğin amacının çocukları korumak olduğunu belirtmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15682} Sevgi dolu ve verimli bir adamla evlenerek çocuk sahibi çocukları teşvik eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15683} Ve kastrasyon yasaktır çünkü çocukları sona erdirir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15684} Hukukçular işten çıkarma konusunda farklı düşünmüştür; bazıları kesinlikle, bazıları kesinlikle, bazıları ise eşin izniyle izin vermiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15683} Malikiler, bir erkekten yaban koparan şeyi yasaklamış, Şafi'ler ise ilaçla bile çocukları kesmekten hoşlanmazlardı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15684} Hukukçular, ruh nefes alındıktan sonra kürtajın yasaklanması konusunda hemfikir oldular, ancak bu konuda farklı görüşteydiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15685} Bir kişinin soyuna saldırı ile zarar veren, tam kan parasına tabidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15684} Gasp edilen çocuk annesiyle birlikte sahibine geri verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15685} Rehin verilen hayvanın yavrularının ipoteğe dahil edilmesi konusunda farklı görüşler yaşadılar; çoğu hukukçu bunu dahil ederken, Şafi'ler bunu yapmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15685} Kızlar, Şafi'ler, bazı Hanefiler ve Hanbalilere göre çocuklar için vakıflara dahil edilir ve Hanbalilere göre sadece çocukların bağışlarında ve Maliki geleneğine göre dahil edilirler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15685} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15686} Merdiven, Şafi'ler ve Hanbalilere göre iki özelliğin birleşiminin nadirliği nedeniyle belirli bir hayvanın yavruları için geçerli değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15686}"
  id: "Dalam bahasa, keturunan berarti anak dan keturunan, dan ahli hukum merujuk pada anak dari manusia atau hewan, serta kehamilan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15682} Keturunan adalah salah satu tujuan Syariah dan salah satu universal yang penting, karena kelangsungan hidup spesies manusia bergantung padanya. Al-Shatibi menyampaikan bahwa kebutuhan tersebut adalah lima: agama, kehidupan, keturunan, kekayaan, dan akal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15682} Al-Sarakhsi menyebutkan bahwa pernikahan adalah jalan sah untuk reproduksi, dan Al-Ghazali menyatakan bahwa tujuan pernikahan adalah untuk menjaga keturunan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15682} Ia mendorong keturunan dengan menikahi pria yang penuh kasih dan subur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15683} Dan kastrasi dilarang karena mengakhiri keturunan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15684} Para ahli hukum berbeda pendapat mengenai pemecatan anak; beberapa melarangnya secara mutlak, beberapa mengizinkannya mutlak, dan yang lain mengizinkannya dengan izin istri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15683} Keluarga Malik melarang apa pun yang memotong keturunan dari seorang pria, dan para Syafi tidak suka memotong keturunan, bahkan dengan obat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15684} Para ahli hukum sepakat tentang larangan aborsi setelah jiwa dihirup, tetapi mereka berbeda pendapat sebelumnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15685} Siapa pun yang menghancurkan keturunan seseorang dengan penyerangan akan dikenakan uang darah penuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15684} Anak yang diambil alih dikembalikan bersama ibunya kepada pemiliknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15685} Mereka berbeda pendapat mengenai memasukkan keturunan hewan yang dijaminkan dalam gadai; mayoritas ahli hukum memasukkannya, sedangkan para Shafi'i tidak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15685} Anak perempuan termasuk dalam wakaf keturunan menurut Shafi'i, beberapa Hanafi, dan Hanbali, dan menurut Hanbali, mereka hanya termasuk dalam pemberian anak-anak, dan sesuai dengan adat Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15685} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15686} Tangga tidak berlaku untuk keturunan hewan tertentu karena langkanya menggabungkan kedua kualitas menurut Shafi'i dan Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15686}"
