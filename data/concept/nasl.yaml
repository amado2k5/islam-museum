label: { ar: "النَّسْل", en: "Offspring (nasl) and its legal rulings", ur: "نسل اور اس کے احکام" }
summary:
  ar: "النسل في اللغة الولد والذرية، ويطلقه الفقهاء على الولد من إنسان أو حيوان، وعلى الحمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} والنسل من مقاصد الشريعة وأحد الكليات الضرورية، لأن بقاء النوع الإنساني متوقف عليه، ونقل الشاطبي أن الضروريات خمسة هي الدين والنفس والنسل والمال والعقل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} وذكر السرخسي أن النكاح هو طريق التناسل المشروع، والغزالي أن المقصود من النكاح إبقاء النسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} ويُحَثّ على تكثير النسل بتزوج الودود الولود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15683} ويُمنع الخصاء لأنه يقطع النسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} واختلف الفقهاء في العزل، فمنعه بعضهم مطلقاً وأجازه بعضهم مطلقاً وأجازه آخرون بإذن الزوجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15683} ومنع المالكية ما يقطع النسل من الرجل، وكره الشافعية قطع النسل ولو بدواء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} واتفق الفقهاء على حرمة الإجهاض بعد نفخ الروح، واختلفوا قبله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} ومن أتلف نسل إنسان بالاعتداء ففيه الدية كاملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} وولد المغصوب يُرد مع أمه إلى صاحبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} واختلفوا في دخول نسل الحيوان المرهون في الرهن، فجمهور الفقهاء يُدخلونه، والشافعية لا يُدخلونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} ويدخل أولاد البنات في الوقف على النسل عند الشافعية وبعض الحنفية والحنابلة، ولا يدخلون عند الحنابلة إلا بقرينة وعند المالكية بحسب العرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686} ولا يصح السلم في نسل حيوان معين لندرة اجتماع الوصفين عند الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686}"
  en: "Nasl means offspring or progeny in the lexicon, and the jurists use it for the young of a human or an animal, and for the foetus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} Offspring is one of the aims of the Law and one of the necessities that must be preserved, since the continuation of the human kind depends on it; al-Shatibi lists five necessities, namely religion, life, offspring, property and reason. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} Al-Sarakhsi holds that marriage is the lawful path to procreation, and al-Ghazali that its purpose is to continue the offspring. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} The Prophet urged marrying an affectionate, prolific woman, and the entry reports a hadith with the grade attributed to al-Haythami. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15683} Castration is forbidden because it cuts off offspring. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} The jurists differ on coitus interruption: some forbid it outright, some allow it outright, and some allow it only with the wife's permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15683} The Malikis forbid a man to cut off his semen so that he cannot father a child; the Shafi'is hold that cutting offspring is forbidden even with medicine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} The jurists agree that abortion is forbidden after ensoulment and differ before it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} Whoever harms a person and thereby destroys his capacity to beget owes full blood money. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} The young of a usurped animal is returned with its mother. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} On a mortgaged animal, the majority hold that its young is mortgaged with it, while the Shafi'is disagree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} In a waqf made for the offspring, the Shafi'is, some Hanafis and the Hanbalis admit the children of daughters, while the Hanbalis admit them only with a clue and the Malikis by custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686} A forward sale of the young of a particular animal is not valid for the Shafi'is and Hanbalis, because such a combination is rare. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15686}"
  ur: "نسل کا لغوی معنی اولاد اور ذریت ہے، اور فقہاء انسان یا جانور کی اولاد اور حمل کے لیے بھی یہ لفظ استعمال کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} نسل شریعت کے مقاصد میں سے ہے، اور نکاح کا مقصد اس کی بقا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15682} خصی کرنا نسل کو منقطع کرتا ہے اس لیے ممنوع ہے، اور عزل میں فقہاء کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15684} روح پھونکے جانے کے بعد اسقاطِ حمل کی حرمت پر اتفاق ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685} غصب شدہ جانور کا بچہ اس کی ماں کے ساتھ مالک کو لوٹایا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15685}"
