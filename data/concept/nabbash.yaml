label: { ar: "النَّبَّاش", en: "The grave-robber who steals shrouds (nabbash)", ur: "نبّاش (کفن چور)" }
summary:
  ar: "النباش في الاصطلاح هو الذي يسرق أكفان الموتى بعد الدفن، والنباشة حرفة نبش القبور، والسارق أعم منه. ولا خلاف في تحريم فعله، لكن الفقهاء اختلفوا في اعتباره سارقاً تقطع يده: فذهب جمهور المالكية والشافعية والحنابلة وأبو يوسف إلى قطعه إذا سرق نصاب السرقة، لأن القبر حرز للكفن عادة، واستدلوا بأثر عائشة وبقطع ابن الزبير لنباش بعرفات. وذهب أبو حنيفة ومحمد وجماعة إلى أنه لا قطع عليه، لحديث «لا قطع على المختفي» وهو غريب، ولأن الكفن ينفر عنه الناس فلا يحرز. وفي شروط القطع خلاف: أن يكون القبر عميقاً مطموماً، وأن يخرج الكفن كله من القبر، وأن يكون الميت فيه، وفي البحر خلاف. وخصم النباش في سرقة الكفن عند الشافعية المالك الأول للكفن، وعند الحنابلة الورثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15445}"
  en: "A nabbash is one who digs up graves to steal the shrouds of the dead after burial; nabbasha is the trade of digging up graves, and a thief is a wider term. All agree that it is forbidden, but the jurists differ on whether he is a thief whose hand is cut. The majority (Malikis, Shafi'is, Hanbalis and Abu Yusuf) cut the hand for stealing the minimum value, since the grave is by custom the shroud's safe-keeping, citing a report from Aisha and Ibn al-Zubayr's cutting of a nabbash at Arafat. Abu Hanifa, Muhammad and others say there is no cut, citing the saying 'no cutting for the one who hides', a weak hadith, and because people shun shrouds and so they are not kept safely. Conditions of the cut differ: the grave must be deep and levelled, the shroud must come out of the whole grave, and the dead must be in it; the Shafi'is hold that the sea is no safe-keeping. For the Shafi'is the owner of the shroud is the claimant, and for the Hanbalis the heirs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15445}"
  ur: "نبّاش وہ ہے جو دفن کے بعد قبر کھود کر میت کا کفن چرائے۔ جمہور کے نزدیک چوری کی نصاب کے مطابق اس کا ہاتھ کاٹا جائے گا، جبکہ ابو حنیفہ اور محمد کے نزدیک قطع نہیں ہے۔ قطع کی شرائط میں اختلاف ہے: قبر گہری اور مٹی سے ڈھکی ہو، اور کفن پوری قبر سے نکلے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15445}"
