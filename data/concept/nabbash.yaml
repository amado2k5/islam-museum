label: { ar: "النَّبَّاش", en: "The grave-robber who steals shrouds (nabbash)", ur: "نبّاش ⁦(کفن چور)⁩", es: "El ladrón de tumbas que roba sudarios (nabbash)", fr: "Le voleur de tombes qui vole les linceuls (nabbash)", tr: "Al-Nabbash", id: "Al-Nabbash" }
summary:
  ar: "النباش في الاصطلاح هو الذي يسرق أكفان الموتى بعد الدفن، والنباشة حرفة نبش القبور، والسارق أعم منه. ولا خلاف في تحريم فعله، لكن الفقهاء اختلفوا في اعتباره سارقاً تقطع يده: فذهب جمهور المالكية والشافعية والحنابلة وأبو يوسف إلى قطعه إذا سرق نصاب السرقة، لأن القبر حرز للكفن عادة، واستدلوا بأثر عائشة وبقطع ابن الزبير لنباش بعرفات. وذهب أبو حنيفة ومحمد وجماعة إلى أنه لا قطع عليه، لحديث «لا قطع على المختفي» وهو غريب، ولأن الكفن ينفر عنه الناس فلا يحرز. وفي شروط القطع خلاف: أن يكون القبر عميقاً مطموماً، وأن يخرج الكفن كله من القبر، وأن يكون الميت فيه، وفي البحر خلاف. وخصم النباش في سرقة الكفن عند الشافعية المالك الأول للكفن، وعند الحنابلة الورثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15445}"
  en: "A nabbash is one who digs up graves to steal the shrouds of the dead after burial; nabbasha is the trade of digging up graves, and a thief is a wider term. All agree that it is forbidden, but the jurists differ on whether he is a thief whose hand is cut. The majority (Malikis, Shafi'is, Hanbalis and Abu Yusuf) cut the hand for stealing the minimum value, since the grave is by custom the shroud's safe-keeping, citing a report from Aisha and Ibn al-Zubayr's cutting of a nabbash at Arafat. Abu Hanifa, Muhammad and others say there is no cut, citing the saying 'no cutting for the one who hides', a weak hadith, and because people shun shrouds and so they are not kept safely. Conditions of the cut differ: the grave must be deep and levelled, the shroud must come out of the whole grave, and the dead must be in it; the Shafi'is hold that the sea is no safe-keeping. For the Shafi'is the owner of the shroud is the claimant, and for the Hanbalis the heirs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15445}"
  ur: "نبّاش وہ ہے جو دفن کے بعد قبر کھود کر میت کا کفن چرائے۔ جمہور کے نزدیک چوری کی نصاب کے مطابق اس کا ہاتھ کاٹا جائے گا، جبکہ ابو حنیفہ اور محمد کے نزدیک قطع نہیں ہے۔ قطع کی شرائط میں اختلاف ہے: قبر گہری اور مٹی سے ڈھکی ہو، اور کفن پوری قبر سے نکلے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15445}"
  es: "Un nabbash es aquel que desentierra tumbas para robar las mortajas de los muertos después del entierro; nabbasha es el oficio de desenterrar tumbas, y ladrón es un término más amplio. Todos coinciden en que está prohibido, pero los juristas difieren en si es un ladrón al que se le corta la mano. La mayoría (malikis, shafi'is, hanbalis y Abu Yusuf) cortan la mano por robar el valor mínimo, ya que la tumba es por costumbre el lugar donde se guarda la mortaja, citando un relato de Aisha y el corte de la mano de un nabbash en Arafat por parte de Ibn al-Zubayr. Abu Hanifa, Muhammad y otros dicen que no hay corte, citando el dicho \"no se corta al que esconde\", un hadiz débil, y porque la gente rehúye las mortajas y por lo tanto no se guardan de forma segura. Las condiciones del corte difieren: la tumba debe ser profunda y nivelada, la mortaja debe salir de toda la tumba y el muerto debe estar dentro de ella; Los Shafi'is sostienen que el mar no es un lugar seguro. Para los Shafi'is, el propietario de la Sábana Santa es el reclamante, y para los Hanbalis, los herederos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15440} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15441} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15442} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15443} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15444} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15445}"
  fr: "Un nabbash est celui qui profane les tombes pour voler les linceuls des défunts après l'inhumation; le terme « nabbash » désigne l'activité de profanation de tombes, et « voleur » est un terme plus général. Tous s'accordent à dire que cet acte est interdit, mais les juristes divergent quant à savoir si celui qui a la main coupée est considéré comme un voleur. La majorité (malikites, chaféites, hanbalites et Abou Yusuf) considèrent que la main doit être coupée pour le vol d'une valeur minimale, car la tombe est traditionnellement le lieu de conservation du linceul, citant un récit d'Aïcha et le cas d'Ibn al-Zubayr où un nabbash a été mutilé à Arafat. Abou Hanifa, Muhammad et d'autres estiment qu'il n'y a pas lieu de couper la main, se référant au hadith faible « nul ne doit couper la main pour celui qui cache » et au fait que les gens se détournent des linceuls, qui ne sont donc pas conservés en toute sécurité. Les conditions de la coupure varient: la tombe doit être profonde et de niveau, le linceul doit sortir entièrement de la tombe et le défunt doit s'y trouver. les Shafi'ites estiment que la mer n'est pas un lieu sûr. Pour les Shafi'ites, le propriétaire du linceul est le réclamant, et pour les Hanbalis, les héritiers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15445}"
  tr: "Terminolojide, kazıcı, gömüldükten sonra ölülerin kefenlerini çalan kişidir, 'nabşa' mezar kazma mesleğidir ve hırsız daha genel bir iştir. Bu eylemin yasaklanması konusunda bir anlaşmazlık yoktur, ancak hukukçular onu eli kesilen bir hırsız olarak görmekte farklı görüş bildirirler: Maliki, Şafii, Hanbali ve Ebu Yusuf'un çoğu, hırsızlık nisabını çalarsa mezar genellikle kefeni koruyucu kalkan olarak kullanılır diye savunmuştur. Aişe ve İbn el-Zubeyr'in rivayetini, mezar Arafat'ta kazmak için kesilmediğine dair kanıt olarak desteklemiştir. Ebu Hanifa, Muhammed ve diğerleri, hadisin 'gizli olanı kesmediğini' savunmuştur, bu gariptir ve kefen insanları ittiği için korunmaz. Mezarın kesilme koşulları konusunda anlaşmazlıklar vardır: mezar derin ve kapalı olmalı, tüm kefen mezardan çıkarılmalı ve ölen kişi içinde olmalıdır. Deniz meselesinde anlaşmazlık vardır. Şafiiler arasında kefeni çalan kazıcıya karşı çıkan kişi, kefenin ilk sahibidir, Hanbaliler ise varisleri kabul eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15445}"
  id: "Dalam istilah tertentu, penggali adalah orang yang mencuri kain kafan orang mati setelah pemakaman, dan 'nabsha' adalah profesi menggali makam, sedangkan pencuri lebih umum. Tidak ada perbedaan pendapat mengenai larangan tindakan ini, tetapi ahli hukum berbeda pendapat dalam menganggapnya sebagai pencuri yang tangannya dipotong: mayoritas Maliki, Shafi'i, Hanbali, dan Abu Yusuf berpendapat bahwa jika ia mencuri nisab pencurian, makam biasanya digunakan sebagai perisai pelindung kain kafan. Mereka mendukung narasi Aisha dan Ibn al-Zubayr sebagai bukti bahwa itu tidak dipotong untuk menggali di Arafat. Abu Hanifa, Muhammad, dan lainnya berpendapat bahwa tidak ada potongan pada hadits 'tidak ada potongan pada yang tersembunyi,' yang aneh, dan karena kain kafan itu menolak orang, maka tidak terjaga. Ada perbedaan pendapat mengenai syarat memotong makam: makam harus dalam dan tertutup, seluruh kain kafan harus dikeluarkan dari makam, dan almarhum harus berada di dalamnya. Ada perbedaan pendapat mengenai masalah laut. Penentang penggali dalam mencuri kain kafan di antara para Syafi adalah pemilik pertama kain kafan, sementara Hanbal menganggap ahli waris. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15440} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15441} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15442} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15443} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15444} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15445}"
