label:
  ar: "المرأة العربية والاتفاقيات الدولية"
  en: "The Arab woman and the international conventions"
issue:
  ar: "هل حسّنت الاتفاقيات الدولية (بكين 1995 وما بعدها) وضع المرأة العربية، وهل تقبل كاملة أم تُؤخذ بما يرفع الظلم ويُرفض ما يصادم الدين؟"
summary:
  ar: "حلقة «الوسطية» عن وضع المرأة العالمي والعربي والاتفاقيات الدولية. صوّت الشباب: 8% فقط يرون وضع المرأة العالمي أسوأ من الرجل، {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:10:30} و32% يرون المرأة العربية أسوأ من باقي العالم. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:32:30} ومن الأرقام المعروضة: النساء يعملن ثلثي ساعات العمل ولا يحصلن إلا على عُشر الدخل، ورواندا 49% تمثيلاً برلمانياً بينما أمريكا أقل {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:25:00}. وخلُص المقدم: نأخذ من الاتفاقيات ما يرفع الظلم عن المرأة ونرفض ما يصادم الدين — «وهذه الوسطية» {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 01:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 01:17:00}."
  en: "The 'Al-Wasatiyya' episode on the woman's global and Arab status and the international conventions. The youth voted: only 8% judged the woman's global situation worse than the man's, {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:10:30} and 32% judged the Arab woman worse than the rest of the world. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:32:30} Figures aired: women do two-thirds of the world's work hours yet receive a tenth of its income, and Rwanda's parliament is 49% women while America's is less {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:25:00}. The host concluded: take from the conventions what lifts injustice from women and reject what collides with religion — 'and this is the wasatiyya' {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 01:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 01:17:00}."
