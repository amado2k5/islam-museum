issue:
  ar: "هل حسّنت الاتفاقيات الدولية ⁦(بكين 1995 وما بعدها)⁩ وضع المرأة العربية، وهل تقبل كاملة أم تُؤخذ بما يرفع الظلم ويُرفض ما يصادم الدين؟"
summary:
  ar: "حلقة «الوسطية» عن وضع المرأة العالمي والعربي والاتفاقيات الدولية. صوّت الشباب: 8% فقط يرون وضع المرأة العالمي أسوأ من الرجل، {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:10:30} و32% يرون المرأة العربية أسوأ من باقي العالم. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:32:30} ومن الأرقام المعروضة: النساء يعملن ثلثي ساعات العمل ولا يحصلن إلا على عُشر الدخل، ورواندا 49% تمثيلاً برلمانياً بينما أمريكا أقل {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:25:00}. وخلُص المقدم: نأخذ من الاتفاقيات ما يرفع الظلم عن المرأة ونرفض ما يصادم الدين — «وهذه الوسطية» {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 01:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 01:17:00}."
  en: "The 'Al-Wasatiyya' episode on the woman's global and Arab status and the international conventions. The youth voted: only 8% judged the woman's global situation worse than the man's, {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:10:30} and 32% judged the Arab woman worse than the rest of the world. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:32:30} Figures aired: women do two-thirds of the world's work hours yet receive a tenth of its income, and Rwanda's parliament is 49% women while America's is less {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:25:00}. The host concluded: take from the conventions what lifts injustice from women and reject what collides with religion — 'and this is the wasatiyya' {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 01:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 01:17:00}."
  fr: "Cet épisode d'« Al-Wasatiyya » porte sur la condition des femmes dans le monde et dans les pays arabes, ainsi que sur les conventions internationales. Les jeunes ont voté : seuls 8 % estimaient que, dans le monde, les femmes étaient moins bien loties que les hommes, {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:10:30} et 32 % estimaient que les femmes arabes étaient moins bien loties que celles du reste du monde. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:32:30} Parmi les chiffres cités : les femmes effectuent les deux tiers des heures de travail dans le monde mais ne touchent qu'un dixième des revenus ; elles occupent 49 % des sièges au Parlement rwandais, une proportion supérieure à celle des États-Unis {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:25:00}. En conclusion, l'animateur préconise de retenir des conventions ce qui fait reculer les injustices envers les femmes et de rejeter ce qui heurte la religion : « C'est cela, la wasatiyya » {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 01:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 01:17:00}."
  es: "El episodio de 'Al-Wasatiyya' sobre la situación global y árabe de la mujer y las convenciones internacionales. Los jóvenes votaron: solo el 8% consideró que la situación global de la mujer era peor que la del hombre, {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:10:30} y el 32% consideró que la mujer árabe era peor que la del resto del mundo. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:32:30} Cifras publicadas: las mujeres realizan dos tercios de las horas de trabajo del mundo pero reciben una décima parte de sus ingresos, y el parlamento de Ruanda está compuesto por un 49% de mujeres, mientras que el de Estados Unidos es menos {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:16:30} {citar:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:25:00}. El presentador concluyó: tomen de las convenciones lo que elimina la injusticia contra las mujeres y rechacen lo que choca con la religión — 'y esta es la wasatiyya' {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 01:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 01:17:00}."
  ur: "عورت کی عالمی اور عرب حیثیت اور بین الاقوامی کنونشنز پر 'الوصطیہ' قسط۔ نوجوانوں نے ووٹ دیا: صرف 8% نے عورت کی عالمی صورت حال کو مرد کی نسبت بدتر قرار دیا، {cite:assabile-tareq-al-suwaidan al-wasitiya/ep15 00:10:30} اور 32% نے عرب عورت کو باقی دنیا سے بدتر قرار دیا۔ {cite:assabile-tareq-al-suwaidan al-wasitiya/ep15 00:32:30} نشر کیے گئے اعداد و شمار: خواتین دنیا کے کام کے اوقات کا دو تہائی حصہ کرتی ہیں پھر بھی اپنی آمدنی کا دسواں حصہ حاصل کرتی ہیں، اور روانڈا کی پارلیمنٹ میں 49% خواتین ہیں جبکہ امریکہ کی اس سے کم ہے۔ 00:16:30} {حوالہ دیں:اسابیل-طارق-السویدان الوسیطیہ/ایپ15 00:25:00}۔ میزبان نے نتیجہ اخذ کیا: کنونشنوں سے وہ چیز لیں جو خواتین سے ناانصافی کو ختم کرتی ہے اور جو چیز مذہب سے ٹکراتی ہے اسے مسترد کریں - 'اور یہی وسعتیہ ہے' 01:17:00}۔"
  tr: "\"Ölçülülük\" bölümü, kadınların küresel ve Arap statüsü ile uluslararası anlaşmalar hakkında. Youth Voice: Sadece %8'i kadınların küresel statüsünü erkeklerden daha kötü görüyor, {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:10:30} ve %32 Arap kadınlarını dünyanın geri kalanından daha kötü görüyor. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:32:30} Gösterilen rakamlar arasında: kadınlar çalışma saatlerinin üçte ikisini çalışıyor ve gelirlerinin sadece onda birini alıyor, Ruanda'nın parlamento temsili %49, Amerika Birleşik Devletleri'nde ise daha az {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:25:00}. Sunucu şöyle sonuçlandırdı: Kadınlardan adaletsizliği kaldıran şeyleri anlaşmalardan alıyoruz ve dinle çatışan şeyleri reddediyoruz — \"ve bu ılımlılık\" {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 01:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 01:17:00}."
  id: "Bagian \"Moderasi\" membahas status global dan Arab perempuan serta perjanjian internasional. Suara Pemuda: Hanya 8% yang melihat status global perempuan lebih buruk daripada laki-laki, {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:10:30} dan 32% melihat perempuan Arab lebih buruk daripada dunia lainnya. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:32:30} Di antara angka-angka yang ditampilkan: perempuan bekerja dua pertiga jam kerja mereka dan hanya menerima sepersepuluh dari pendapatan mereka, perwakilan parlemen Rwanda adalah 49%, dan di Amerika Serikat lebih sedikit {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 00:25:00}. Pembawa acara menyimpulkan: Kami mengambil dari perjanjian apa yang menghilangkan ketidakadilan dari perempuan dan menolak hal-hal yang bertentangan dengan agama — \"dan moderasi ini\" {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 01:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep15 01:17:00}."
