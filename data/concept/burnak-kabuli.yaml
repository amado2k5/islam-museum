label:
  ar: "برنك الكابلي"
  en: "Burnak al-kabuli (a Kabuli seed)"
  fr: "Burnak al-kabuli (graine de Kaboul)"
  ur: "برنک کابلی"
summary:
  ar: "حَبّ هندي أو سندي، نوعان: صغار غير مفنّنة، وكبار مفنّنة، وأفضلها الصغار. يقلع البلغم من المفاصل، ويسهّل البلغم من الأمعاء والديدان وحبّ القرع، وهو قوي في ذلك جداً {cite:canon-ibn-sina-print-v1 p.400}."
  en: "An Indian or Sindhi seed in two kinds, small unridged and large ridged; the small is better. It draws phlegm out of the joints, and purges phlegm from the bowels, worms, and the seed the book calls habb al-qar, and it is very strong in this {cite:canon-ibn-sina-print-v1 p.400}."
  fr: "Graine indienne ou sindhie de deux sortes : petite sans côtes et grosse côtelée ; la petite est meilleure. Selon le livre, elle extrairait le phlegme des articulations et purgerait fortement le phlegme intestinal, les vers et ce qu’il nomme habb al-qar {cite:canon-ibn-sina-print-v1 p.400}."
  ur: "یہ ہندی یا سندھی بیج ہے جو دو قسم کا ہے: چھوٹا بغیر دھاری والا، اور بڑا دھاری دار؛ چھوٹا بہتر ہے۔ یہ جوڑوں سے بلغم نکالتا ہے، اور آنتوں، کیڑوں اور کتاب کے حبّ القرع کہلانے والے بیج کی بلغم کو اسہال سے نکالتا ہے، اور اس میں یہ بہت قوی ہے {cite:canon-ibn-sina-print-v1 p.400}۔"
