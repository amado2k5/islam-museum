label:
  ar: "البازي"
  en: "The falcon"
  ur: "باز"
  es: "El halcón"
  fr: "Le faucon"
  tr: "El-Bazi"
  id: "Al-Bazi"
summary:
  ar: "من الطير المعلّم للصيد: أجاز العلماء أكل ما صادت البازي المعلّمة إذا ذُكر اسم الله على إرسالها، وجعلوا إرسالها كرمي السهم وافتراشها كذبح الصيد."
  en: "A trained hunting bird: the scholars permitted what a trained falcon catches when God's name is uttered at its release, its casting counted as the shot of an arrow and its clutching as the slaughter."
  ur: "شکار کے لیے سِکھایا جانا والا پرندہ: علماء نے اجازت دی کہ سِکھلایا باز جو شکار پکڑے وہ کھایا جا سکتا ہے جب اسے چھوڑتے وقت اللہ کا نام لیا جائے۔"
  es: "Un ave de caza entrenada: los eruditos permitían lo que un halcón entrenado atrapa cuando se pronuncia el nombre de Dios al ser liberado, considerando su lanzamiento como el disparo de una flecha y su captura como la matanza."
  fr: "Un oiseau de chasse dressé: les érudits autorisaient ce qu’un faucon dressé attrape lorsque le nom de Dieu est prononcé au moment de son lâcher, son lancer étant compté comme le tir d’une flèche et sa prise comme le massacre."
  tr: "Avcılık işareti olan kuştan: Bilginler, bayraklı şahin kesilirken Allah'ın adı anıldığında yakaladığı şeyi yemeye izin vermişlerdir ve onun göndermesini ok atmak, kesimi ise av hayvanı gibi yapmak gibi yapmışlardır."
  id: "Dari burung itu adalah tanda berburu: Para ulama mengizinkan memakan apa yang ditangkap elang bertanda bendera ketika nama Allah disebut saat disembelih, dan mereka menjadikan pengirimannya seperti menembakkan panah dan menyembelihnya seperti buruan penyembelihan."
