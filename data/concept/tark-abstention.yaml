label:
  ar: "الترك"
  en: "Tark (abstention, and its legal effects)"
  ur: "ترک (کسی کام کو چھوڑنا اور اس کے احکام)"
summary:
  ar: "الترك كف النفس عن الفعل، وعند أكثر الأصوليين يتعلق به التكليف لأنه فعل، وعند أبي هاشم ليس بفعل. والترك المحرم يجب، وترك الواجب يعاقب عليه بالتعزير، والحد لا يقبل الإسقاط بعد ثبوته عند الحاكم، والحق المالي يجوز تركه. ويختلف الفقهاء في الضمان بالترك، وفي وجوب إنقاذ من يهلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4971} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4977}"
  en: "Tark is restraining oneself from an act. For most usulis it is an act, so obligation applies to it; Abu Hashim holds it is not an act. Abstaining from what is forbidden is obligatory, and failing a duty is disciplined by discretionary penalty. Once a fixed penalty is established before the judge it cannot be waived, while a right of a person may be waived. The schools differ on liability for abstaining from protecting property or life. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4971} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4977}"
