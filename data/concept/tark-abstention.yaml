label:
  ar: "الترك"
  en: "Tark (abstention, and its legal effects)"
  ur: "ترک ⁦(کسی کام کو چھوڑنا اور اس کے احکام)⁩"
  es: "Tark (la abstención y sus efectos legales)"
  fr: "Tark (l'abstinence et ses effets juridiques)"
  tr: "Türk"
  id: "Turki"
summary:
  ar: "الترك كف النفس عن الفعل، وعند أكثر الأصوليين يتعلق به التكليف لأنه فعل، وعند أبي هاشم ليس بفعل. والترك المحرم يجب، وترك الواجب يعاقب عليه بالتعزير، والحد لا يقبل الإسقاط بعد ثبوته عند الحاكم، والحق المالي يجوز تركه. ويختلف الفقهاء في الضمان بالترك، وفي وجوب إنقاذ من يهلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4971} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4977}"
  en: "Tark is restraining oneself from an act. For most usulis it is an act, so obligation applies to it; Abu Hashim holds it is not an act. Abstaining from what is forbidden is obligatory, and failing a duty is disciplined by discretionary penalty. Once a fixed penalty is established before the judge it cannot be waived, while a right of a person may be waived. The schools differ on liability for abstaining from protecting property or life. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4971} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4977}"
  es: "Tark es abstenerse de un acto. Para la mayoría de los usulis, es un acto, por lo que se le impone una obligación; Abu Hashim sostiene que no lo es. Abstenerse de lo prohibido es obligatorio, y el incumplimiento de un deber se castiga con una pena discrecional. Una vez establecida una pena fija ante el juez, no se puede renunciar a ella, mientras que un derecho de una persona sí puede ser renunciado. Las escuelas difieren en cuanto a la responsabilidad por abstenerse de proteger la propiedad o la vida. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4969} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4970} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4971} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4972} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4973} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4974} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4976} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.4977}"
  fr: "Le « tark » consiste à s'abstenir d'un acte. Pour la plupart des écoles juridiques (usulis), il s'agit d'un acte, et donc d'une obligation; Abu Hashim, quant à lui, considère qu'il ne s'agit pas d'un acte. S'abstenir de ce qui est interdit est obligatoire, et le manquement à un devoir est sanctionné par une peine discrétionnaire. Une fois fixée par le juge, la peine est irrévocable, contrairement aux droits d'une personne. Les écoles juridiques divergent quant à la responsabilité encourue pour avoir omis de protéger ses biens ou sa vie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4971} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4977}"
  ur: "تارک اپنے آپ کو ایک عمل سے روک رہا ہے۔ زیادہ تر اصولوں کے لیے یہ ایک فعل ہے، اس لیے اس پر واجب ہوتا ہے۔ ابو ہاشم کے نزدیک یہ کوئی فعل نہیں ہے۔ جس چیز سے منع کیا گیا ہے اس سے پرہیز کرنا واجب ہے اور فرض میں کوتاہی کرنے پر صوابدیدی سزا دی جاتی ہے۔ ایک بار جج کے سامنے ایک مقررہ جرمانہ قائم ہو جانے کے بعد اسے معاف نہیں کیا جا سکتا، جبکہ کسی شخص کا حق معاف کیا جا سکتا ہے۔ اسکولوں میں جائیداد یا جان کی حفاظت سے پرہیز کرنے کی ذمہ داری پر اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4969} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4970} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4971} p.4972} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.4973} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.4974} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4975} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4976}"
  tr: "İhmal etmek, eylemden kaçınmaktır ve çoğu usul bilginine göre görevle ilişkilidir çünkü bir eylemdir, ancak Abu Haşim'e göre bu bir eylem değildir. Yasaklanmış ihmal zorunludur, zorunlu bir eylemi ihmal etmek takdir yetkisiyle cezalandırılır ve hudud hakim tarafından belirlendikten sonra feragat edilmez ve mali hak terk edilebilir. Hukukçular, ihmal sorumluluğu ve ölenleri kurtarma yükümlülüğü konusunda farklı görüşlere sahiptir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.4969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4971} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4977}"
  id: "Kelalaian berarti menahan diri dari tindakan, dan menurut sebagian besar ulama usul, hal itu berkaitan dengan kewajiban karena merupakan tindakan, tetapi menurut Abu Hashim, itu bukan tindakan. Kelalaian yang dilarang adalah tindakan wajib, kelalaian terhadap tindakan wajib dapat dihukum dengan hukuman diskresioner, dan hudud tidak dapat dikesampingkan setelah ditetapkan oleh hakim, serta hak finansial dapat ditinggalkan. Para ahli hukum berbeda pendapat mengenai tanggung jawab atas kelalaian, dan mengenai kewajiban untuk menyelamatkan mereka yang meninggal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4969} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4971} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4972} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4973} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4974} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4977}"
