id: concept/food-in-old-age-and-changed-regimen
class: concept
kind: scientific
label: { ar: "الغذاء في الشيخوخة وتغيير التدبير", en: "Food in old age and a changed regimen", ur: "بڑھاپے میں غذا اور بدلی ہوئی تدبیر", es: "La alimentación en la vejez y un régimen de vida modificado", fr: "L'alimentation chez les personnes âgées et un changement de régime alimentaire" }
summary:
  ar: "يقول ابن سينا إن من أوغل في السن لا يقبل بدنه من الغذاء ما كان يقبله شاباً فيصير غذاؤه فضولاً، فلا يأكل قدر العادة بل دونه، وإن من اعتاد تغليظ التدبير إذا لطفه دخل الهواء في المنافذ التي كان يشغلها الغليظ، فإذا عاد إلى التغليظ حدثت فيه السدد {cite:canon-ibn-sina-print-v1 p.233}."
  en: "Ibn Sina says the body of one far advanced in years does not take of food what it took in youth, so his food turns into residue and he should eat less than his habit; and one used to a heavy regimen who lightens it lets air into passages the heavy food used to fill, so that when he returns to heavy food blockages arise {cite:canon-ibn-sina-print-v1 p.233}."
  es: "Ibn Sina dice que el cuerpo de una persona de edad muy avanzada no absorbe de los alimentos lo que absorbía en su juventud, por lo que su comida se convierte en residuos y debe comer menos de lo habitual; y quien está acostumbrado a una dieta pesada y la aligera deja entrar aire en los conductos que antes llenaban los alimentos pesados, de modo que cuando vuelve a consumir alimentos pesados surgen obstrucciones {cite:canon-ibn-sina-print-v1 p.233}."
  fr: "Ibn Sina dit que le corps d'une personne très âgée ne prend pas la nourriture comme il le faisait dans sa jeunesse, donc sa nourriture se transforme en résidus et il devrait manger moins que d'habitude; et celui qui est habitué à un régime lourd et qui l'allège laisse entrer de l'air dans les voies que la nourriture lourde remplissait auparavant, de sorte que lorsqu'il revient à une alimentation lourde, des blocages se produisent {cite:canon-ibn-sina-print-v1 p.233}."
  ur: "ابن سینا کہتے ہیں کہ برسوں میں ترقی یافتہ شخص کا جسم جوانی میں کھانا نہیں کھاتا، اس لیے اس کا کھانا باقی رہ جاتا ہے اور اسے اپنی عادت سے کم کھانا چاہیے۔ اور ایک بھاری طرزِ عمل کا عادی جو اسے ہلکا کرتا ہے بھاری خوراک کو بھرنے کے لیے راستے میں ہوا دیتا ہے، تاکہ جب وہ بھاری خوراک کی طرف لوٹتا ہے تو رکاوٹیں پیدا ہو جاتی ہیں {حوالہ:کینن-ابن سینا-پرنٹ-v1 p.233}۔"
