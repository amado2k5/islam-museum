summary:
  ar: "يقول ابن سينا إن من أوغل في السن لا يقبل بدنه من الغذاء ما كان يقبله شاباً فيصير غذاؤه فضولاً، فلا يأكل قدر العادة بل دونه، وإن من اعتاد تغليظ التدبير إذا لطفه دخل الهواء في المنافذ التي كان يشغلها الغليظ، فإذا عاد إلى التغليظ حدثت فيه السدد {cite:canon-ibn-sina-print-v1 p.233}."
  en: "Ibn Sina says the body of one far advanced in years does not take of food what it took in youth, so his food turns into residue and he should eat less than his habit; and one used to a heavy regimen who lightens it lets air into passages the heavy food used to fill, so that when he returns to heavy food blockages arise {cite:canon-ibn-sina-print-v1 p.233}."
