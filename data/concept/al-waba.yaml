label:
  ar: الوباء
  en: Epidemic disease
  fr: "Maladie épidémique"
  ur: وبا
  es: "Enfermedad epidémica"
  tr: "Pandemi"
  id: "Pandemi"
summary:
  ar: "المرض العام الذي يفشو في الأرض. ويروي البخاري ومسلم قول النبي: إذا وقع بأرض وأنتم بها فلا تخرجوا فرارًا منه ولا تدخلوا عليها {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  en: "The general disease spreading through a land. Sahih al-Bukhari and Sahih Muslim report the Prophet's saying: if it falls in a land you are in, do not flee it, and do not enter it {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  fr: "Maladie qui se répand dans un pays et touche la population dans son ensemble. Le Sahih d’al-Bukhari et celui de Muslim rapportent cette parole du Prophète : si la maladie survient dans un pays où vous êtes, ne le quittez pas pour la fuir et n’y entrez pas {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  ur: "عام بیماری جو کسی سرزمین میں پھیل جاتی ہے۔ بخاری اور مسلم نبی کا یہ قول روایت کرتے ہیں: جب وہ کسی سرزمین میں واقع ہو اور تم وہاں ہو تو اس سے بھاگ کر نہ نکلو اور نہ اس میں داخل ہو {cite:sahih-al-bukhari} {cite:sahih-muslim}۔"
  es: "La enfermedad general que se propaga por una tierra. Sahih al-Bukhari y Sahih Muslim informan que el Profeta dijo: si cae en una tierra en la que estás, no huyas de ella ni entres en ella {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  tr: "Yeryüzünde yayılan genel hastalık. El-Buhari ve Müslüman, Peygamber'in sözünü rivayet ederler: Eğer bir diyara düşerse, onu kaçarak bırakma ya da girme {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  id: "Penyakit yang menyebar luas di bumi. Al-Bukhari dan umat Muslim menceritakan kata-kata Nabi: Jika kamu jatuh ke suatu tanah, jangan lari atau masuk {cite:sahih-al-bukhari} {cite:sahih-muslim}."
