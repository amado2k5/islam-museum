label:
  ar: الوباء
  en: Epidemic disease
  ur: وبا
summary:
  ar: "المرض العام الذي يفشو في الأرض. ويروي البخاري ومسلم قول النبي: إذا وقع بأرض وأنتم بها فلا تخرجوا فرارًا منه ولا تدخلوا عليها {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  en: "The general disease spreading through a land. Sahih al-Bukhari and Sahih Muslim report the Prophet's saying: if it falls in a land you are in, do not flee it, and do not enter it {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  ur: "وہ عام بیماری جو کسی سرزمین میں پھیل جائے؛ نبی نے فرمایا: اگر وہ کسی زمین میں پھوٹے اور تم وہاں ہو تو اس سے بھاگ کر نہ نکلو اور نہ داخل ہو — عدویات کے علم سے پہلے حکمتِ الٰہی کی قرنطینہ {cite:sahih-al-bukhari} {cite:sahih-muslim}۔"
