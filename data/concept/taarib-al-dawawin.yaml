id: concept/taarib-al-dawawin
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-origins]
label:
  ar: "تعريب الدواوين"
  en: "The Arabisation of the dīwāns"
  ur: "دواوین کی تعریب"
  fr: "L'arabisation des dīwāns"
  es: "La arabización de los dīwāns"
  tr: "Diwanların Araplaştırılması"
  id: "Arabisasi Diwan"
summary:
  ar: "ما يقوله ملخص بحثي زُوّد به المتحف عن تعريب الدواوين، أي تحويل لغة السجلات الحكومية إلى العربية في العهد الأموي: العراق سنة 697 ميلادية، والشام سنة 700، ومصر بين 705 و706، وخراسان بين 741 و742، والألسنة التي حلّت العربية محلها، وما جرى بعد ذلك للآرامية والقبطية والفارسية. وتذكر الصفحة أن الخليفة عبد الملك بن مروان أمر بالتعريب إلى جانب إصلاح النقد. ولم يفتح المتحف الصفحات المسمّاة، وقد أجاز المؤسس استعمال الملخص في 21 نوفمبر 2026."
  en: "What a research summary supplied to the museum says about the Arabisation of the dīwāns, that is the change of the language of government registers to Arabic under the Umayyads: Iraq in 697 CE, Syria in 700, Egypt in 705-706 and Khurasan in 741-742, the languages Arabic replaced, and what happened afterwards to Aramaic, Coptic and Persian. The page records that the caliph Abd al-Malik ibn Marwan ordered the change alongside a reform of the coinage. The museum did not open the pages named, and the founder approved using the summary on 21 November 2026."
  ur: "ایک تحقیقی خلاصہ، جو متحف کو فراہم کیا گیا، دواوین کی تعریب کے بارے میں کیا کہتا ہے، یعنی اموی دور میں سرکاری رجسٹروں کی زبان کا عربی میں بدلنا: عراق 697 عیسوی میں، شام 700 میں، مصر 705-706 میں اور خراسان 741-742 میں، وہ زبانیں جن کی جگہ عربی نے لی، اور بعد میں آرامی، قبطی اور فارسی کے ساتھ کیا ہوا۔ صفحہ درج کرتا ہے کہ خلیفہ عبد الملک بن مروان نے سکے کی اصلاح کے ساتھ تعریب کا حکم دیا۔ متحف نے مذکورہ صفحات نہیں کھولے، اور بانی نے 21 نومبر 2026 کو خلاصے کے استعمال کی منظوری دی۔"
  fr: "Ce que dit un résumé de recherche remis au musée sur l'arabisation des dīwāns, c'est-à-dire le passage à l'arabe de la langue des registres de l'État sous les Omeyyades : l'Irak en 697, la Syrie en 700, l'Égypte en 705-706 et le Khorassan en 741-742, les langues que l'arabe a remplacées, et ce qu'il est advenu ensuite de l'araméen, du copte et du persan. La page consigne que le calife Abd al-Malik ibn Marwan a ordonné le changement en même temps qu'une réforme monétaire. Le musée n'a pas ouvert les pages nommées, et le fondateur a approuvé l'usage du résumé le 21 novembre 2026."
  es: "Lo que dice un resumen de investigación entregado al museo sobre la arabización de los dīwāns, es decir el paso al árabe de la lengua de los registros del Estado bajo los omeyas: Irak en 697, Siria en 700, Egipto en 705-706 y Jorasán en 741-742, las lenguas que el árabe sustituyó y lo ocurrido después con el arameo, el copto y el persa. La página recoge que el califa Abd al-Malik ibn Marwan ordenó el cambio junto con una reforma de la moneda. El museo no abrió las páginas nombradas, y el fundador aprobó usar el resumen el 21 de noviembre de 2026."
  tr: "Müzenin sağladığı bir araştırma özeti, Emevi döneminde hükümet kayıtlarının dilinin Arapçaya dönüştürülmesi hakkında söylediği budur: Irak MS 697, Levant 700, Mısır 705-706, Horasan 741-742, Arapça'nın yerini alan diller ve sonrasında Aramice, Kıpti ve Farsçaya olanlar. Sayfada, Halife Abd al-Malik ibn Marwan'ın eleştiri reformuyla birlikte Araplaştırmayı emrettiği belirtiliyor. Müze adı geçen sayfaları açmadı ve kurucu özetin kullanımına 21 Kasım 2026'da izin verdi."
  id: "Inilah yang dikatakan dalam ringkasan penelitian yang disediakan museum tentang Arabisasi diwan, yaitu mengubah bahasa catatan pemerintah ke dalam bahasa Arab selama era Umayyah: Irak pada 697 M, Levant pada 700, Mesir antara 705 dan 706, Khorasan antara 741 dan 742, bahasa yang menggantikan Arab, dan apa yang terjadi setelahnya pada Aram, Kopt, dan Persia. Halaman tersebut menyebutkan bahwa Khalifah Abd al-Malik ibn Marwan memerintahkan Arabisasi bersamaan dengan reformasi kritik. Museum tidak membuka halaman-halaman yang disebutkan, dan pendiri mengizinkan penggunaan abstrak pada 21 November 2026."
