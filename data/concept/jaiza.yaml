label: { ar: "الجائزة", en: "Ja'iza (Battle Prize)", es: "Ja'iza (Premio de batalla)", fr: "Ja'iza (Prix de Bataille)", ur: "جائزہ ⁦(جنگ انعام)⁩", tr: "Ödül", id: "Penghargaan" }
summary:
  ar: "الجائزة عطية يبذلها القائد لمن يجترئ على مكروه؛ وأول يوم سميت فيه الجائزة يوم ولى الحجاج قطن بن قبيصة بن مخارق الهلالي فارس وكرمان فانتهى إلى نهر فلم يقدر أصحابه على إجازته فقال من جاز فله ألف درهم فجازوه فوفى لهم فقال الجعاف بن حكيم هم سنوا الجوائز في معد."
  en: "The ja'iza, a prize a commander offers for a feat of daring; its first naming: al-Hajjaj's governor Qatn ibn Qabisa reached a river his men could not cross — 'who crosses, a thousand dirhams' — they crossed, he paid, and al-Ja''af sang 'they first established the jaw'iz among Ma'add'."
  es: "El ja'iza, un premio que un comandante ofrece por una hazaña audaz; su primer nombre: el gobernador de al-Hajjaj, Qatn ibn Qabisa, llegó a un río que sus hombres no podían cruzar —'quien lo cruce, mil dirhams'— lo cruzaron, él pagó y al-Ja''af cantó 'ellos establecieron por primera vez el jaw'iz entre Ma'add'."
  fr: "Le ja'iza, une récompense qu'un commandant offre pour un exploit audacieux; sa première appellation: le gouverneur d'al-Hajjaj, Qatn ibn Qabisa, atteignit une rivière que ses hommes ne pouvaient pas traverser — « qui traverse, mille dirhams » — ils traversèrent, il paya, et al-Ja''af chanta « ils établirent d'abord le jaw'iz parmi Ma'add »."
  ur: "جائیزہ، ایک انعام جو ایک کمانڈر بہادری کے کارنامے کے لیے پیش کرتا ہے۔ اس کا پہلا نام: الحجاج کا گورنر قطن بن قبیصہ ایک دریا پر پہنچا جسے اس کے آدمی پار نہیں کر سکتے تھے - 'جو پار کرتا ہے، ایک ہزار درہم' - انہوں نے پار کیا، اس نے ادائیگی کی، اور الجعف نے گایا 'انہوں نے سب سے پہلے معد کے درمیان جاویز قائم کیا'۔"
  tr: "Ödül, liderin yanlış bir şey yapmaya cesaret edenlere verdiği bir armağandır; ödülün ilk kez adlandırıldığı gün, hacılar Qatan bin Qubaysa bin Mukhariq al-Hilali şövalye oldukları ve Kerman'ın bir nehre ulaştığı ama yoldaşlarının izin veremediği gündü. Dedi ki, 'Kim izin verirse, bin dirhem vardır.' Onu ödüllendirdi ve o da ödedi. El-Ca'af bin Hakim, 'Ma'ad'da ödüller kuruldu.' dedi."
  id: "Hadiah adalah hadiah yang diberikan oleh pemimpin kepada mereka yang berani melakukan kesalahan; hari pertama hadiah itu dinamai adalah ketika para peziarah Qatan bin Qubaysa bin Mukhariq al-Hilali menjadi ksatria dan Kerman mencapai sungai tetapi teman-temannya tidak dapat memberinya izin. Dia berkata, 'Siapa pun yang mengizinkannya mendapat seribu dirham.' Dia memberinya hadiah, dan dia membayar mereka. Al-Ja'af bin Hakim berkata, 'Mereka telah menetapkan hadiah di Ma'ad.'"
