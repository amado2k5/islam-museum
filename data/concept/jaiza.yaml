summary:
  ar: "الجائزة عطية يبذلها القائد لمن يجترئ على مكروه؛ وأول يوم سميت فيه الجائزة يوم ولى الحجاج قطن بن قبيصة بن مخارق الهلالي فارس وكرمان فانتهى إلى نهر فلم يقدر أصحابه على إجازته فقال من جاز فله ألف درهم فجازوه فوفى لهم فقال الجعاف بن حكيم هم سنوا الجوائز في معد."
  en: "The ja'iza, a prize a commander offers for a feat of daring; its first naming: al-Hajjaj's governor Qatn ibn Qabisa reached a river his men could not cross — 'who crosses, a thousand dirhams' — they crossed, he paid, and al-Ja''af sang 'they first established the jaw'iz among Ma'add'."
