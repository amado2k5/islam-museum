id: concept/seven-earths
class: concept
kind: term
label: { ar: "الأرضون السبع", en: "The seven earths", ur: "سات زمینیں", es: "Las siete tierras", fr: "Les sept terres" }
summary:
  ar: "تذكر آية الطلاق 65:12 أن للأرض مثل السماوات السبع، وتذكر أحاديث الصحيحين أن من أخذ شبراً من الأرض ظلماً طُوِّق من سبع أرضين؛ ويحكي القرطبي قول الجمهور أنها طباق في كل منها سكان من خلق الله، وقول الضحاك أنها مطبقة بلا فتوق، وقول الكلبي أنها منبسطة، ويرى ابن كثير أن حملها على الأقاليم إبعاد وبلا مستند، وفي أثر ابن عباس «في كل أرض نبي» قال البيهقي: إسناده صحيح وهو شاذ بمرة. {cite:tafsir-qurtubi-quran-com on 65:12} {cite:tafsir-ibn-kathir on 65:12} {cite:fath-al-bari on hadith 3198}"
  en: "The verse of al-Talaq 65:12 gives the earth a match for the seven heavens, and hadiths in the two Sahihs say that whoever takes a span of land unjustly is encircled with seven earths. Al-Qurtubi gives the majority view that they are layers, each with inhabitants of God's creation, al-Dahhak's that they are pressed together without gaps and al-Kalbi's that they are spread out; Ibn Kathir calls reading them as climes far-fetched and baseless; and of the report from Ibn Abbas that each earth has a prophet, al-Bayhaqi said the chain is sound but shadhdh. {cite:tafsir-qurtubi-quran-com on 65:12} {cite:tafsir-ibn-kathir on 65:12} {cite:fath-al-bari on hadith 3198}"
  ur: "سورۂ طلاق 65:12 زمین کو سات آسمانوں کا ہم مثل بتاتی ہے، اور صحیحین کی احادیث میں ہے کہ جو ظلم سے بالشت بھر زمین لے اسے سات زمینوں کا طوق پہنایا جائے گا۔ قرطبی جمہور کا قول نقل کرتے ہیں کہ وہ تہ بہ تہ ہیں اور ہر ایک میں اللہ کی مخلوق کے باشندے ہیں، ضحاک کا کہ بلا شگاف باہم چڑھی ہیں اور کلبی کا کہ پھیلی ہوئی ہیں؛ ابن کثیر اقالیم پر محمول کرنے کو دور کی اور بلا مستند بات کہتے ہیں؛ اور ابن عباس کے اس اثر پر کہ ہر زمین میں ایک نبی ہے، بیہقی نے کہا کہ سند صحیح ہے مگر شاذ۔ {cite:tafsir-qurtubi-quran-com on 65:12} {cite:tafsir-ibn-kathir on 65:12} {cite:fath-al-bari on hadith 3198}"
  es: "El versículo 65:12 de al-Talaq equipara la tierra con los siete cielos, y los hadices de los dos Sahihs afirman que quien toma injustamente un territorio queda rodeado por siete tierras. Al-Qurtubi presenta la opinión mayoritaria de que son capas, cada una con habitantes de la creación de Dios; al-Dahhak sostiene que están unidas sin espacios, y al-Kalbi que están dispersas. Ibn Kathir considera rebuscada e infundada la interpretación de que se trate de climas; y sobre el relato de Ibn Abbas de que cada tierra tiene un profeta, al-Bayhaqi afirmó que la cadena de transmisión es sólida pero dudosa. {cite:tafsir-qurtubi-quran-com on 65:12} {cite:tafsir-ibn-kathir on 65:12} {cite:fath-al-bari on hadith 3198}"
  fr: "Le verset 65:12 de la sourate Talaq compare la terre aux sept cieux, et des hadiths rapportés dans les deux recueils authentiques (Sahihs) affirment que quiconque s'approprie injustement une parcelle de terre est entouré de sept terres. Al-Qurtubi rapporte l'opinion majoritaire selon laquelle il s'agit de strates, chacune abritant des créatures divines; al-Dahhak soutient qu'elles sont accolées sans interstices, tandis qu'al-Kalbi les considère comme étendues. Ibn Kathir juge extravagante et sans fondement l'interprétation de ces terres comme des climats. Quant au récit d'Ibn Abbas selon lequel chaque terre possède un prophète, al-Bayhaqi affirme que la chaîne de transmission est authentique mais incomplète."
