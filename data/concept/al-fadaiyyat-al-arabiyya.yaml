issue:
  ar: "هل أصلحت الفضائيات العربية أم أفسدت، وما أثرها على القيم والأطفال، وهل تضبط برقابة؟"
summary:
  ar: "حلقة «الوسطية» عن تجربة الفضائيات العربية التي وصفها المقدم بأنها «أصبحت السبب الأول في تغيير العقول والقيم» {cite:assabile-tareq-al-suwaidan al-wassitiya/ep12 00:01:00}. صوّت الشباب: 75% يرون أنها أسهمت بشكل سيئ و21% بشكل ممتاز؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep12 00:33:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep12 00:34:00} و76% يؤيدون الرقابة الأخلاقية فقط و3% لا ضبط إطلاقاً. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep12 00:50:00} ومن إحصاءات المقدم: 79 قناة منوعة و37 حكومية، و52% من مشاهد العنف في فترات الأطفال. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep12 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep12 01:05:00}"
  en: "The 'Al-Wasatiyya' episode on the Arab satellite-channel experiment, which the host called 'the number-one cause in changing minds and values' {cite:assabile-tareq-al-suwaidan al-wassitiya/ep12 00:01:00}. The youth voted: 75% judged the channels' contribution bad, 21% excellent; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep12 00:33:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep12 00:34:00} and 76% endorsed moral oversight only, while 3% wanted no control at all. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep12 00:50:00} From the host's statistics: 79 variety and 37 government channels, and 52% of televised violence falls in children's slots. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep12 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep12 01:05:00}"
