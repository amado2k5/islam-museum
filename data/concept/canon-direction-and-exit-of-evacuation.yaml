label: { ar: "جهة الاستفراغ ومخرجه عند ابن سينا", en: "The direction and exit of evacuation in the Canon", ur: "استفراغ کی جہت اور اس کا مخرج قانون میں" }
summary:
  ar: "يذكر ابن سينا أن للاستفراغ أغراضاً، فيراعى أن يستفرغ ما يجب استفراغه مع ما قد يتعقبه من إعياء الأوعية أو ثوران الحرارة، ثم جهة ميل المادة كالغثيان ينقى بالقيء والمغص بالإسهال، ثم عضو المخرج، كالباسليق الأيمن لعلل الكبد، ويجب أن يكون أخس من العضو المستفرغ منه {cite:canon-ibn-sina-print-v1 p.274}."
  en: "Ibn Sina lists considerations in evacuating: that what must be evacuated is evacuated, along with what may follow, such as exhaustion of the vessels or a flare of heat; the direction in which the matter inclines, nausea being cleared by vomiting and gripes by purging; and the organ of exit, such as the right basilic vein for liver ailments, which must be of lower rank than the organ evacuated {cite:canon-ibn-sina-print-v1 p.274}."
