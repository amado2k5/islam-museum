id: concept/canon-direction-and-exit-of-evacuation
class: concept
kind: scientific
label:
  ar: "جهة الاستفراغ ومخرجه عند ابن سينا"
  en: "The direction and exit of evacuation in the Canon"
  fr: "Direction et voie d’évacuation dans le Canon"
  ur: "استفراغ کی جہت اور اس کا مخرج قانون میں"
  es: "La dirección y salida de evacuación en el Canon"
  tr: "İbn Sina'ya göre kusmanın yönü ve çıkışı"
  id: "Arah muntah dan hasilnya menurut Ibn Sina"
summary:
  ar: "يذكر ابن سينا أن للاستفراغ أغراضاً، فيراعى أن يستفرغ ما يجب استفراغه مع ما قد يتعقبه من إعياء الأوعية أو ثوران الحرارة، ثم جهة ميل المادة كالغثيان ينقى بالقيء والمغص بالإسهال، ثم عضو المخرج، كالباسليق الأيمن لعلل الكبد، ويجب أن يكون أخس من العضو المستفرغ منه {cite:canon-ibn-sina-print-v1 p.274}."
  en: "Ibn Sina lists considerations in evacuating: that what must be evacuated is evacuated, along with what may follow, such as exhaustion of the vessels or a flare of heat; the direction in which the matter inclines, nausea being cleared by vomiting and gripes by purging; and the organ of exit, such as the right basilic vein for liver ailments, which must be of lower rank than the organ evacuated {cite:canon-ibn-sina-print-v1 p.274}."
  fr: "Ibn Sina considère matière à évacuer et suites possibles — épuisement vasculaire, flambée thermique —, direction de son inclination — nausée par vomissement, coliques par purge — et organe de sortie : basilique droite pour foie, de rang inférieur à l’organe évacué {cite:canon-ibn-sina-print-v1 p.274}."
  es: "Ibn Sina enumera consideraciones en la evacuación: que lo que debe ser evacuado se evacua, junto con lo que pueda seguir, como el agotamiento de los vasos o un aumento repentino de la fiebre; la dirección en la que se inclina la materia, las náuseas se eliminan con el vómito y los cólicos con la purga; y el órgano de salida, como la vena basílica derecha para las dolencias hepáticas, que debe ser de menor rango que el órgano evacuado {cite:canon-ibn-sina-print-v1 p.274}."
  ur: "ابن سینا نے انخلاء میں غور و فکر کی فہرست دی ہے: کہ جس چیز کو خالی کرنا ضروری ہے وہ خالی کر دیا جاتا ہے، اس کے ساتھ جو کچھ ہو سکتا ہے، جیسے برتنوں کا تھکن یا گرمی کا بھڑکنا؛ معاملہ جس طرف مائل ہوتا ہے، متلی قے اور گرفت سے صاف ہو جاتی ہے۔ اور باہر نکلنے کا عضو، جیسے جگر کی بیماریوں کے لیے دائیں باسیلک رگ، جو خالی کیے گئے عضو سے کم درجہ کی ہونی چاہیے"
  tr: "İbn Sina, kusmanın amaçları olduğunu belirtir; bu nedenle, kusması gereken şeyi damar yorgunluğu veya ısı patlamalarına rağmen kusmak kabul edilmelidir, sonra maddenin yönü, örneğin bulantı (kusma ve ishalle kolik) arındırılır, ardından karaciğer hastalıkları için sağ baziliq gibi dışkı organı ve atıldığı organdan daha düşük olmalıdır {cite:canon-ibn-sina-print-v1 s.274}."
  id: "Ibn Sina menyebutkan bahwa muntah memiliki tujuan, jadi harus dianggap untuk memuntahkan apa yang harus dimuntahkan meskipun mungkin mengalami kelelahan pembuluh darah atau ledakan panas, kemudian arah zat seperti mual, yang dimurnikan oleh muntah dan kolik oleh diare, kemudian organ ekskresi, seperti basiliq yang tepat untuk penyakit hati, dan harus lebih rendah dari organ tempat muntah itu dikeluarkan {cite:canon-ibn-sina-print-v1 hlm.274}."
