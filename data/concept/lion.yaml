summary:
  ar: "فرّت الحمر الوحشية من قسورة: فسّرها كثير من المفسرين بالأسد أو الصياد، وأبقى القرآن الصورة مفتوحة: وحش يفرّ من خوف أو شبء."
  en: "The wild asses fled from a qaswara — most commentators read it as the lion, others as the huntsmen; the Quran leaves the image open: wild beasts fleeing a terror or a hunter."
  ur: "جنگلی گدھے قسورہ سے بھاگے — اکثر مفسرین اسے شیر قرار دیتے ہیں، کچھ شکاری؛ قرآن تصویر کھلی چھوڑتا ہے: خوف یا شکار سے بھاگتے جنگلی جانور۔"
  es: "Los asnos salvajes huyeron de un qaswara; la mayoría de los comentaristas lo interpretan como el león, otros como los cazadores; el Corán deja la imagen abierta: bestias salvajes huyendo de un terror o de un cazador."
  fr: "Les ânes sauvages s'enfuirent devant un qaswara — la plupart des commentateurs l'interprètent comme le lion, d'autres comme les chasseurs; le Coran laisse l'image ouverte: des bêtes sauvages fuyant une terreur ou un chasseur."
  tr: "Vahşi eşekler Qasura'dan kaçtı: birçok yorumcu onu bir aslan ya da avcı olarak yorumladı ve Kur'an bu imajı açık tuttu: korkudan kaçan bir hayvan ya da bir klan"
  id: "Keledai liar melarikan diri dari Qasura: banyak komentator menafsirkannya sebagai singa atau pemburu, dan Al-Quran tetap membuka gambar: seekor binatang yang melarikan diri dari ketakutan atau klan"
