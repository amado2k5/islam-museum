label: { ar: "الشريانان السباتيان والشبكة عند ابن سينا", en: "The two carotid arteries and the net in the Canon", ur: "قانون میں دو سباتی شریانیں اور شبکہ", es: "Las dos arterias carótidas y la red en el Canon", fr: "Les deux artères carotides et le filet dans le Canon" }
summary:
  ar: "في الفصل الرابع يصف ابن سينا انقسام كل من السباتيين عند انتهائه إلى الرقبة إلى مقدم ومؤخر، وكيف ينسج المؤخر الأكبر شبكة من العروق تحت الدماغ ثم ترتقي منها شعب إلى بطون الدماغ {cite:canon-ibn-sina-print-v1 pp.85-86}."
  en: "In the fourth chapter Ibn Sina describes how each carotid divides, at its end in the neck, into front and back parts, and how the larger back part weaves a net of vessels under the brain from which branches then rise to the ventricles {cite:canon-ibn-sina-print-v1 pp.85-86}."
  es: "En el cuarto capítulo, Ibn Sina describe cómo cada carótida se divide, en su extremo en el cuello, en partes anterior y posterior, y cómo la parte posterior, más grande, teje una red de vasos debajo del cerebro de la cual luego se elevan ramas hacia los ventrículos {cite:canon-ibn-sina-print-v1 pp.85-86}."
  fr: "Dans le quatrième chapitre, Ibn Sina décrit comment chaque carotide se divise, à son extrémité dans le cou, en parties antérieure et postérieure, et comment la partie postérieure, plus grande, tisse un réseau de vaisseaux sous le cerveau d'où des branches s'élèvent ensuite vers les ventricules {cite:canon-ibn-sina-print-v1 pp.85-86}."
