summary:
  ar: "في الفصل الرابع يصف ابن سينا انقسام كل من السباتيين عند انتهائه إلى الرقبة إلى مقدم ومؤخر، وكيف ينسج المؤخر الأكبر شبكة من العروق تحت الدماغ ثم ترتقي منها شعب إلى بطون الدماغ {cite:canon-ibn-sina-print-v1 pp.85-86}."
  en: "In the fourth chapter Ibn Sina describes how each carotid divides, at its end in the neck, into front and back parts, and how the larger back part weaves a net of vessels under the brain from which branches then rise to the ventricles {cite:canon-ibn-sina-print-v1 pp.85-86}."
