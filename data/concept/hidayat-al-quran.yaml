id: concept/hidayat-al-quran
class: concept
kind: term
label: { ar: "هداية القرآن", en: "Guidance of the Qur'an", es: "La guía del Corán", fr: "Les enseignements du Coran", ur: "قرآن کی ہدایت", tr: "Kur'an'ın rehberliği", id: "Panduan Al-Qur'an" }
summary:
  ar: "الغاية التي يجعلها محمد رشيد رضا أولى مقاصد التفسير: فهم القرآن من حيث هو دين يرشد الناس إلى سعادتهم في الدنيا والآخرة. ويقرر في مقدمة تفسيره أن الكلام في البلاغة والإعراب والقصص والفقه والكلام تابع لهذه الغاية أو وسيلة إليها، ويعد الاهتداء بالقرآن المقصد الحقيقي من فهمه {cite:tafsir-manar-v01 p.21}."
  en: "The aim Rashid Rida places first for the tafsir: to understand the Qur'an as a religion that guides people to their good in this life and the next. In his introduction he says that rhetoric, grammar, stories, law and theology follow this aim or serve it, and that being guided by the Qur'an is the true purpose of understanding it."
  es: "El objetivo principal que Rashid Rida sitúa en el tafsir es comprender el Corán como una religión que guía a las personas hacia su bien en esta vida y en la otra. En su introducción, afirma que la retórica, la gramática, las historias, la ley y la teología siguen o sirven a este objetivo, y que dejarse guiar por el Corán es el verdadero propósito de comprenderlo."
  fr: "Pour Rashid Rida, l'objectif premier du tafsir est de comprendre le Coran comme une religion qui guide les individus vers leur bien dans cette vie et dans l'au-delà. Dans son introduction, il affirme que la rhétorique, la grammaire, les récits, le droit et la théologie servent cet objectif, et que le véritable but de la compréhension du Coran est d'être guidé par lui."
  ur: "راشد ردا کا مقصد تفسیر کے لیے سب سے پہلے ہے: قرآن کو ایک ایسے مذہب کے طور پر سمجھنا جو لوگوں کی دنیا اور آخرت کی بھلائی کے لیے رہنمائی کرتا ہے۔ اپنے تمہید میں وہ کہتے ہیں کہ بیان بازی، گرامر، کہانیاں، قانون اور الہیات اس مقصد کی پیروی کرتے ہیں یا اس کی تکمیل کرتے ہیں، اور یہ کہ قرآن سے رہنمائی حاصل کرنا ہی اسے سمجھنے کا اصل مقصد ہے۔"
  tr: "Muhammed Reşid Rida'nın terfürün birincil amacı olarak belirlediği amaç, Kur'an'ı insanları bu dünyada ve ahirette mutluluklarına yönlendiren bir din olarak anlamaktır. Tafsirinin girişinde, retorik, ayrıcalık, hikâye, fıkıh ve konuşma bu amaca tabi veya bir araç olduğunu ve Kur'an'dan gelen rehberliğin onu anlamanın gerçek amacı olduğunu belirtir {atıf:tafsir-manar-v01 s.21}."
  id: "Tujuan utama yang ditetapkan Muhammad Rashid Rida sebagai tujuan utama penafsiran: memahami Al-Qur'an sebagai agama yang membimbing orang menuju kebahagiaan mereka di dunia ini dan akhirat. Ia menyatakan dalam pengantar tafsirnya bahwa pidato dalam retorika, penguraian, cerita, fiqh, dan pidato adalah subjek atau sarana untuk tujuan ini, dan bahwa panduan dari Al-Qur'an adalah tujuan sejati memahaminya {cite:tafsir-manar-v01 hlm.21}."
