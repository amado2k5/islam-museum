label: { ar: "هداية القرآن", en: "Guidance of the Qur'an" }
summary:
  ar: "الغاية التي يجعلها محمد رشيد رضا أولى مقاصد التفسير: فهم القرآن من حيث هو دين يرشد الناس إلى سعادتهم في الدنيا والآخرة. ويقرر في مقدمة تفسيره أن الكلام في البلاغة والإعراب والقصص والفقه والكلام تابع لهذه الغاية أو وسيلة إليها، ويعد الاهتداء بالقرآن المقصد الحقيقي من فهمه {cite:tafsir-manar-v01 p.21}."
  en: "The aim Rashid Rida places first for the tafsir: to understand the Qur'an as a religion that guides people to their good in this life and the next. In his introduction he says that rhetoric, grammar, stories, law and theology follow this aim or serve it, and that being guided by the Qur'an is the true purpose of understanding it."
