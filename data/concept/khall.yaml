summary:
  ar: "خل في الكتاب مركب من حار وبارد وكلا جوهريه لطيف والبارد أغلب، والطبخ ينقص من برودته؛ قوي التجفيف، يمنع انصباب المواد إلى داخل ويلطف ويقطع ويعين على الهضم ويضاد البلغم، نافع للصفراويين ضار للسوداويين وضار للعصب؛ يمنع الأورام ويشفي الحمرة ويمنع النملة ويمنع الجراحات أن ترم وينفع حرق النار أسرع من كل شيء، وينفع الصداع الحار وحركة الأسنان وسقوط اللهاة، ويعين المعدة الحارة الرطبة وإدمانه ربما أدى إلى الاستسقاء ويضعف البصر، وينفع من الأفيون والشوكران؛ وفيه نقل موسوم عن الرحم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.714-715}"
  en: "Khall is in the book compounded of hot and cold, both its substances subtle and the cold prevailing, and cooking lessens its coldness; strongly drying, it prevents the flowing of matters inward, subtilises, cuts, helps digestion and opposes phlegm, benefits the bilious and harms the melancholic and the nerve; it prevents swellings, heals erysipelas, prevents namla, prevents wounds from swelling, and benefits a burn by fire faster than anything, benefits hot headache, looseness of the teeth and a fallen uvula, helps the hot and moist stomach, its habitual use may lead to dropsy and weakens sight, and it benefits against opium and hemlock; with a labelled listing on the womb in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.714-715}"
  ur: "خل کتاب میں گرم اور ٹھنڈے سے مرکب ہے، اس کے دونوں جوہر لطیف ہیں اور ٹھنڈا غالب ہے، اور پکانا اس کی ٹھنڈک گھٹاتا ہے؛ سخت خشک کرنے والا، مادوں کے اندر بہنے کو روکتا ہے، لطیف کرتا ہے، کاٹتا ہے، ہضم میں مدد دیتا ہے اور بلغم کا ضد ہے، صفراوی مزاج والوں کے لیے نافع اور سوداوی مزاج والوں اور اعصاب کے لیے مضر؛ ورموں کو روکتا ہے، حمرہ کو شفا دیتا ہے، نملہ کو روکتا ہے، زخموں کو ورم کرنے سے روکتا ہے اور آگ سے جلنے میں ہر چیز سے جلد فائدہ دیتا ہے، گرم سردرد، دانتوں کے ہلنے اور کوے کے گرنے میں نافع ہے، گرم تر معدے کی مدد کرتا ہے، اس کی عادت کبھی استسقا تک پہنچاتی ہے اور نظر کو کمزور کرتی ہے، اور افیون اور شوکران کے مقابل نافع ہے؛ رحم کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 pp.714-715}۔"
  es: "En el libro, el Khall se compone de sustancias calientes y frías, siendo sutiles sus componentes y predominando el frío, y la cocción disminuye su frialdad; de fuerte efecto secante, impide el flujo interno de sustancias, sutiliza, corta, ayuda a la digestión y combate la flema, beneficia a los biliares y perjudica a los melancólicos y a los nervios; previene hinchazones, cura la erisipela, previene la namla, evita que las heridas se inflamen y alivia las quemaduras por fuego más rápidamente que cualquier otra cosa, alivia el dolor de cabeza intenso, la aflojamiento de los dientes y la caída de la úvula, ayuda al estómago caliente y húmedo, su uso habitual puede provocar hidropesía y debilita la vista, y es beneficioso contra el opio y la cicuta; con una lista etiquetada sobre el útero en una sección reservada para la decisión del fundador {cite:canon-ibn-sina-print-v1 pp.714-715}"
  fr: "Le Khall est décrit dans le livre comme composé de substances chaudes et froides, toutes deux subtiles et à dominante froide. La cuisson atténue sa froideur. Puissant asséchant, il empêche l'écoulement des substances vers l'intérieur, subtilise, coupe, facilite la digestion et combat les mucosités. Il est bénéfique aux personnes bilieuses et nuisible aux mélancoliques et aux personnes nerveuses. Il prévient les gonflements, guérit l'érysipèle, prévient la namla, empêche les plaies de gonfler et soulage les brûlures plus rapidement que tout autre remède. Il soulage les maux de tête dus à la chaleur, le déchaussement des dents et la luxation de la luette. Il est bénéfique pour l'estomac chaud et humide. Son usage habituel peut entraîner l'hydropisie et affaiblir la vue. Il est efficace contre l'opium et la ciguë. Il figure dans une section consacrée à l'utérus, sous réserve de la décision du fondateur. {cite:canon-ibn-sina-print-v1 pp.714-715}"
  tr: "Kitaptaki sirke hem sıcak hem soğuk renkten oluşur; hem doğası gereği hafif hem de çoğunlukla soğuktur. Pişirme soğukluğu azaltır; güçlü kurutma sağlar, maddelerin dökülmesini engeller, yumuşatır ve keser, sindirime yardımcı olur ve balgam karşıtı bir etki yapar. Safra hastaları için faydalıdır, melankoliye zararlıdır ve sinirlere zarar verir; tümörleri önler, kızarıklığı iyileştirir, karıncaların yaralanmasını engeller, yaraların yaralanmasını engeller ve ateşi daha hızlı yakmak için faydalıdır. Sıcak baş ağrılarına, diş hareketine ve düşen uvulaya yardımcı olur, sıcak ve nemli mide ve bağımlılığına yardımcı olur; bu da asitlere yol açmış ve görme zayıflatır. Ayrıca afyon ve baldıran gibi bitkilerden faydalıdır. Ayrıca kurucunun kararıyla ilgili bir bölümde rahim hakkında bir alıntı içerir. {cite:canon-ibn-sina-print-v1 s.714-715}"
  id: "Cuka dalam buku ini terdiri dari panas dan dingin, baik secara intrinsik ringan maupun sebagian besar dingin. Memasak mengurangi dinginnya; cuka ini sangat mengeringkan, mencegah tumpahan zat, melunakkan dan melukai, membantu pencernaan, dan bertindak sebagai antiflegma. Cuka ini bermanfaat bagi orang yang mudah terbendung, berbahaya bagi melankoli, dan merusak saraf; mencegah tumor, menyembuhkan kemerahan, mencegah semut terluka, mencegah luka terluka, dan bermanfaat untuk membakar api lebih cepat daripada apa pun. Cuka membantu sakit kepala panas, gerakan gigi, dan uvula yang jatuh, serta membantu perut panas dan lembap serta kecanduannya, yang mungkin menyebabkan asites dan melemahkan penglihatan. Ini juga berguna dari opium dan hemlock. Juga memuat kutipan berjudul tentang rahim dalam bagian yang berkaitan dengan putusan pendiri. {cite:canon-ibn-sina-print-v1 hlm.714-715}"
