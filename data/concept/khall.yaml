label:
  ar: "خل"
  en: "Khall"
  ur: "خل"
summary:
  ar: "خل في الكتاب مركب من حار وبارد وكلا جوهريه لطيف والبارد أغلب، والطبخ ينقص من برودته؛ قوي التجفيف، يمنع انصباب المواد إلى داخل ويلطف ويقطع ويعين على الهضم ويضاد البلغم، نافع للصفراويين ضار للسوداويين وضار للعصب؛ يمنع الأورام ويشفي الحمرة ويمنع النملة ويمنع الجراحات أن ترم وينفع حرق النار أسرع من كل شيء، وينفع الصداع الحار وحركة الأسنان وسقوط اللهاة، ويعين المعدة الحارة الرطبة وإدمانه ربما أدى إلى الاستسقاء ويضعف البصر، وينفع من الأفيون والشوكران؛ وفيه نقل موسوم عن الرحم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.714-715}"
  en: "Khall is in the book compounded of hot and cold, both its substances subtle and the cold prevailing, and cooking lessens its coldness; strongly drying, it prevents the flowing of matters inward, subtilises, cuts, helps digestion and opposes phlegm, benefits the bilious and harms the melancholic and the nerve; it prevents swellings, heals erysipelas, prevents namla, prevents wounds from swelling, and benefits a burn by fire faster than anything, benefits hot headache, looseness of the teeth and a fallen uvula, helps the hot and moist stomach, its habitual use may lead to dropsy and weakens sight, and it benefits against opium and hemlock; with a labelled listing on the womb in a section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.714-715}"
  ur: "خل کتاب میں گرم اور ٹھنڈے سے مرکب ہے، اس کے دونوں جوہر لطیف ہیں اور ٹھنڈا غالب ہے، اور پکانا اس کی ٹھنڈک گھٹاتا ہے؛ سخت خشک کرنے والا، مادوں کے اندر بہنے کو روکتا ہے، لطیف کرتا ہے، کاٹتا ہے، ہضم میں مدد دیتا ہے اور بلغم کا ضد ہے، صفراوی مزاج والوں کے لیے نافع اور سوداوی مزاج والوں اور اعصاب کے لیے مضر؛ ورموں کو روکتا ہے، حمرہ کو شفا دیتا ہے، نملہ کو روکتا ہے، زخموں کو ورم کرنے سے روکتا ہے اور آگ سے جلنے میں ہر چیز سے جلد فائدہ دیتا ہے، گرم سردرد، دانتوں کے ہلنے اور کوے کے گرنے میں نافع ہے، گرم تر معدے کی مدد کرتا ہے، اس کی عادت کبھی استسقا تک پہنچاتی ہے اور نظر کو کمزور کرتی ہے، اور افیون اور شوکران کے مقابل نافع ہے؛ رحم کے بارے میں ایک موسوم نقل بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v1 pp.714-715}۔"
