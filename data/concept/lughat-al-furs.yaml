label: { ar: "لغات الفارسية الخمس", en: "The five Persian languages" }
summary:
  ar: "قال عبد الله بن المقفع عند ابن النديم إن لغات الفارسية: الفهلوية والدرية والفارسية والخوزية والسريانية، فالفهلوية منسوبة إلى فهله اسم يقع على خمسة أمصار، والدرية منسوبة إلى الدار وهي الباب وكانت لغة حضرة الملك ومدينة المدائن، وروى ابن النديم في أخبار القلم الفارسي أن أول من تكلم بالفارسية جيومرت ويسميه الفرس كيل شاه ومعناه ملك الطين وهو عندهم آدم أبو البشر، وقيل أول من كتب بالفارسية بيوراسب بن ونداسبا المعروف بالضحاك صاحب الأجدهاق، وقيل أفريدون بن أثفيان لما قسم الأرض بين ولده سلم وطوج وإيرج خص كل واحد بثلث المعمور وكتب كتاباً بينهم، وقيل جمشيد بن أونجهان أمر إبليس أن يخرج ما في الضمير إلى العيان فعلمه الكتابة، وقرأ ابن النديم بخط الجهشياري في كتاب الوزراء أن الكتب والرسائل قبل ملك يستاسب بن لهراسب كانت قليلة فلما ملك اتسعت الكتابة وظهر زرادشت بن اسبئمان صاحب شريعة المجوس وأظهر كتابه العجيب بجميع اللغات فأخذ الناس أنفسهم بتعليم الخط فزادوا ومهروا {cite:fihrist-ibn-al-nadim p. 30-32}."
  en: "Ibn al-Muqaffa's five Persian tongues and the legends of the first Persian writers {cite:fihrist-ibn-al-nadim p. 30-32}."
