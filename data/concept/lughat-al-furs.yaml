label: { ar: "لغات الفارسية الخمس", en: "The five Persian languages", es: "Las cinco lenguas persas", fr: "Les cinq langues persanes", ur: "پانچ فارسی زبانیں۔", tr: "Farsçanın beş dili", id: "Lima bahasa Persia" }
summary:
  ar: "قال عبد الله بن المقفع عند ابن النديم إن لغات الفارسية: الفهلوية والدرية والفارسية والخوزية والسريانية، فالفهلوية منسوبة إلى فهله اسم يقع على خمسة أمصار، والدرية منسوبة إلى الدار وهي الباب وكانت لغة حضرة الملك ومدينة المدائن، وروى ابن النديم في أخبار القلم الفارسي أن أول من تكلم بالفارسية جيومرت ويسميه الفرس كيل شاه ومعناه ملك الطين وهو عندهم آدم أبو البشر، وقيل أول من كتب بالفارسية بيوراسب بن ونداسبا المعروف بالضحاك صاحب الأجدهاق، وقيل أفريدون بن أثفيان لما قسم الأرض بين ولده سلم وطوج وإيرج خص كل واحد بثلث المعمور وكتب كتاباً بينهم، وقيل جمشيد بن أونجهان أمر إبليس أن يخرج ما في الضمير إلى العيان فعلمه الكتابة، وقرأ ابن النديم بخط الجهشياري في كتاب الوزراء أن الكتب والرسائل قبل ملك يستاسب بن لهراسب كانت قليلة فلما ملك اتسعت الكتابة وظهر زرادشت بن اسبئمان صاحب شريعة المجوس وأظهر كتابه العجيب بجميع اللغات فأخذ الناس أنفسهم بتعليم الخط فزادوا ومهروا {cite:fihrist-ibn-al-nadim p. 30-32}."
  en: "Ibn al-Muqaffa's five Persian tongues and the legends of the first Persian writers {cite:fihrist-ibn-al-nadim p. 30-32}."
  es: "Las cinco lenguas persas de Ibn al-Muqaffa y las leyendas de los primeros escritores persas {cite:fihrist-ibn-al-nadim p. 30-32}."
  fr: "Les cinq langues persanes d'Ibn al-Muqaffa et les légendes des premiers écrivains persans {cite:fihrist-ibn-al-nadim p. 30-32}."
  ur: "ابن المقفہ کی پانچ فارسی زبانیں اور پہلے فارسی مصنفین کے افسانے {حوالہ دیں:فہرست ابن الندیم صفحہ 15۔ 30-32}۔"
  tr: "Abdullah ibn al-Muqaffa, İbn el-Nadim'e göre Farsça dillerin Fehlaviyya, Durriyya, Farsça, Khoziyya ve Süryanice'dir. Fahlaviya, beş eyaleti kapsayan bir isim olan Fahla'ya atfedilir ve Durriya, kralın varlığının ve şehirlerin bulunduğu dil olan kapı olan Dar'dan türemiştir. İbn el-Nadim, Akhbar al-Qalam al-Farsi'de Farsça konuşan ilk kişinin Geomert olduğunu, ona Farsça Kiel Şah adını verdiğini, yani kil kralı olduğunu ve insanlığın babası Adem olarak kabul edildiğini anlatmıştır. Farsça yazan ilk kişinin el-Dahak olarak bilinen Biorasp ibn Wandaspa olduğu, el-Ajdahaq'ın sahibi olduğu söylenir ve ayrıca söylenir Afridun ibn Athfyan, toprakları oğulları Salm, Tuj ve Iraj arasında paylaştırdığında, her birine üçte birini tahsis etti ve aralarında bir kitap yazdı. Söylenirse Jamshid ibn Onghan İblis'e vicdanındakileri gözüne çıkarmasını ve ona yazmayı öğretmesini emretti. İbn al-Nadim, el-Jahshiyari'nin el yazısıyla Bakanlar Kitabı'nda Kral Yastasib ibn Lahrasib'in önündeki kitap ve mektupların az olduğunu okudu. Kral olduğunda yazı genişledi ve Magi yasasının yazarı Zerdüşt ibn İbbeyman ortaya çıktı, tüm dillerde olağanüstü kitabını sergiledi. İnsanlar hat sanatı öğretmeye başladı, çabalarını ve ücretlerini artırdı {atıf:Fihrist-ibn-al-nadim s. 30-32}."
  id: "Abdullah ibn al-Muqaffa mengatakan menurut Ibn al-Nadim bahwa bahasa Persia adalah Fahlaviyya, Durriyya, Persia, Khoziyya, dan Siria. Fahlaviyah dikaitkan dengan Fahla, sebuah nama yang mencakup lima provinsi, dan Durriya berasal dari Dar, yang merupakan gerbang, dan merupakan bahasa kehadiran raja serta kota kota. Ibn al-Nadim menceritakan dalam Akhbar al-Qalam al-Farsi bahwa yang pertama berbicara bahasa Persia adalah Geomert, yang ia sebut Kiel Shah Persia, yang berarti raja tanah liat, dan ia dianggap Adam, bapak umat manusia. Dikatakan bahwa yang pertama menulis dalam bahasa Persia adalah Biorasp ibn Wandaspa, dikenal sebagai al-Dahhak, pemilik al-Ajdahaq, dan juga dikatakan Ketika Afridun ibn Athfyan membagi tanah di antara putra-putranya Salm, Tuj, dan Iraj, ia membagi sepertiga tanah untuk masing-masing dan menulis sebuah buku di antara mereka. Dikatakan Jamshid ibn Onghan memerintahkan Iblis untuk mengeluarkan apa yang ada di hati nuraninya ke mata, mengajarinya menulis. Ibn al-Nadim membaca dengan tulisan tangan al-Jahshiyari dalam Kitab Menteri bahwa buku dan surat sebelum Raja Yastasib ibn Lahrasib sangat sedikit. Ketika ia menjadi raja, tulisan berkembang, dan Zoroaster ibn Ibn Ibbayman, penulis hukum Maju, muncul, menampilkan bukunya yang luar biasa dalam semua bahasa. Orang-orang mulai mengajarkan kaligrafi, meningkatkan usaha dan biaya mereka {cite:fihrist-ibn-al-nadim hlm. 30-32}."
