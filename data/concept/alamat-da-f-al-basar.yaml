id: "concept/alamat-da-f-al-basar"
class: "concept"
kind: "scientific"
label:
  ar: "علامات ضعف البصر"
  en: "Signs of weakness of sight"
  fr: "Signes de l’affaiblissement de la vue"
  ur: "بینائی کے ضعف کی علامات"
  es: "Signos de debilidad visual"
  tr: "Kötü Görme Belirtileri"
  id: "Gejala penglihatan yang buruk"
summary:
  ar: "علامة ما كان بشركة البدن علامات مزاج البدن، وبشركة الدماغ علامات آفة دماغية مع كون سائر الحواس مؤفة، وعلامة الروح اختلاف الاستقصاء بالقرب والبعد بحسب رقته وغلظه وقلته وكثرته، وعلامة الكدورة محل رؤيتها من القرنية، وتفرق اتصال الشبكية في جملتها يعدم البصر بغتة {cite:canon-ibn-sina-print-v2 p.203} {cite:canon-ibn-sina-print-v2 p.204}"
  en: "What comes in company with the body is told by the signs of the body's temperament; what comes with the brain by signs of a brain lesion while the other senses are afflicted; the spirit's sign is the difference in scrutiny of near and far by its thinness, thickness, scantiness and abundance; turbidity is told by where it is seen in the cornea; and rupture of the retina's continuity throughout abolishes sight suddenly {cite:canon-ibn-sina-print-v2 p.203} {cite:canon-ibn-sina-print-v2 p.204}"
  fr: "L’affaiblissement qui accompagne le corps se reconnaît aux signes du tempérament de celui-ci ; celui qui accompagne le cerveau se reconnaît aux signes de lésion cérébrale, avec atteinte des autres sens. Les signes propres à l’esprit tiennent à la différence de netteté de près et de loin, selon sa ténuité ou son épaisseur, sa rareté ou son abondance. Le trouble se distingue à l’endroit où il est visible dans la cornée. La rupture de la continuité de la rétine dans toute son étendue abolit subitement la vue {cite:canon-ibn-sina-print-v2 p.203} {cite:canon-ibn-sina-print-v2 p.204}."
  ur: "جو بدن کی شرکت سے ہو اس کی علامت مزاج بدن کی علامات ہیں؛ جو دماغ کی شرکت سے ہو اس کی علامت دماغی آفت کی علامات ہیں جب باقی حواس بھی متاثر ہوں؛ روح کی علامت قریب و بعید کے معائنہ کا فرق ہے اس کی لطافت، کثافت، قلت و کثرت کے مطابق؛ اور کدورت اس سے پہچانی جاتی ہے کہ قرنیہ میں کہاں دکھائی دیتی ہے؛ اور شبکیہ کے اتصال کا مکمل بگڑنا بینائی اچانک معدوم کر دیتا ہے {cite:canon-ibn-sina-print-v2 p.203} {cite:canon-ibn-sina-print-v2 p.204}۔"
  es: "Lo que viene acompañado del cuerpo se manifiesta a través de los signos del temperamento del cuerpo; lo que viene acompañado del cerebro, a través de los signos de una lesión cerebral mientras los demás sentidos se ven afectados; el signo del espíritu es la diferencia en el escrutinio de cerca y lejos por su delgadez, grosor, escasez y abundancia; la turbidez se manifiesta por el lugar donde se observa en la córnea; y la ruptura de la continuidad de la retina aniquila la vista repentinamente {cite:canon-ibn-sina-print-v2 p.203} {cite:canon-ibn-sina-print-v2 p.204}"
  tr: "Bedenin yanında olanın işareti bedenin ruh halinin işaretleridir; beynin yanında tüm duyular bozulmuş olmasına rağmen beyin lezyonları belirtileri vardır; ruhun işareti, inceliğine, pürüzlülüğüne, kıtlığına veya bolluğuna göre yakın ve uzak denetim farkıdır; korneadan görülen bulanıklık belirtisi; ve retina bağlantısının tamamen dağılması ani görme kaybına neden olur {cite:canon-ibn-sina-print-v2 s.203} {cite:canon-ibn-sina-print-v2 s.204}"
  id: "Tanda orang yang berada dekat tubuh adalah tanda suasana hati tubuh; ada tanda-tanda lesi otak meskipun semua indera terganggu di dekat otak; tanda jiwa adalah perbedaan antara kontrol dekat dan jauh sesuai dengan kehalusan, kekasaran, kelangkaan, atau kelimpahannya; tanda kabur yang terlihat dari kornea; dan kerusakan total koneksi retina menyebabkan kehilangan penglihatan mendadak {cite:canon-ibn-sina-print-v2 hlm.203} {cite:canon-ibn-sina-print-v2 hlm.204} {cite:canon-ibn-sina-print-v2 hlm.204}"
