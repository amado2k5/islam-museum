summary:
  ar: "الثمانية الأصناف الذين نصّت عليهم آية المصارف في سورة التوبة: الفقراء والمساكين والعاملون عليها والمؤلفة قلوبهم وفي الرقاب والغارمون وفي سبيل الله وابن السبيل؛ فريضةُ الزكاة لا تصرف إلا لهم في المعتمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  en: "The eight categories named in the verse of the distributions in Surat al-Tawba: the poor, the destitute, those employed over it, those whose hearts are to be reconciled, for slaves, the debt-ridden, in the cause of God, and the wayfarer — an obligation spent on them alone in the accepted view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
  ur: "الثمانية الأصناف الذين نصّت عليهم آية المصارف في سورة التوبة: الفقراء والمساكين والعاملون عليها والمؤلفة قلوبهم وفي الرقاب والغارمون وفي سبيل الله وابن السبيل؛ فريضةُ الزكاة لا تصرف إلا لهم في المعتمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3}"
