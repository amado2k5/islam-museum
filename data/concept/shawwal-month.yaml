label:
  ar: "شَوَّال"
  en: "Shawwal (the month after Ramadan: fasting six days of it, the sighting of its new moon, and the rule when one sees it alone)"
summary:
  ar: "شوال أحد شهور السنة القمرية، يلي رمضان، وهو شهر عيد الفطر، وأول أشهر الحج. ويرى بعض الفقهاء أن صيام ستة أيام منه سنة، وكره آخرون ذلك خوف إلحاقها برمضان. ويثبت هلال شوال بإكمال عدة رمضان، أو بشهادة شاهدين عدلين عند الأكثرين. ومن انفرد برؤيته لم يجز له الفطر إلا لعذر، لقوله: الفطر يوم تفطرون، وعند الشافعية يلزمه الفطر سرا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10259} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10260}"
  en: "Shawwal is the lunar month after Ramadan; it is the month of the festival of breaking the fast and the first of the months of the pilgrimage. Some jurists hold that fasting six days of it is recommended, while others dislike it, lest it be taken for part of Ramadan. Its new moon is established by completing the thirty days of Ramadan, or, for most, by two just witnesses. One who sees it alone may not break the fast unless he has an excuse, following the saying 'the fast is the day you fast and the breaking the day you break', while the Shafi'is say he must break it quietly. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10259} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10260}"
