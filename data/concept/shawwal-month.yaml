label:
  ar: "شَوَّال"
  en: "Shawwal (the month after Ramadan: fasting six days of it, the sighting of its new moon, and the rule when one sees it alone)"
  es: "Shawwal (el mes posterior al Ramadán: el ayuno de seis días, la observación de la luna nueva y la regla de cuándo uno la ve solo)."
  fr: "Shawwal (le mois qui suit le Ramadan: six jours de jeûne, l’observation du nouveau croissant de lune et la règle à suivre lorsqu’on le voit seul)"
  ur: "شوال ⁦(رمضان المبارک کے بعد کا مہینہ: اس کے چھ روزے رکھنا، اس کا چاند نظر آنا اور اسے تنہا دیکھنے کا حکم)⁩"
summary:
  ar: "شوال أحد شهور السنة القمرية، يلي رمضان، وهو شهر عيد الفطر، وأول أشهر الحج. ويرى بعض الفقهاء أن صيام ستة أيام منه سنة، وكره آخرون ذلك خوف إلحاقها برمضان. ويثبت هلال شوال بإكمال عدة رمضان، أو بشهادة شاهدين عدلين عند الأكثرين. ومن انفرد برؤيته لم يجز له الفطر إلا لعذر، لقوله: الفطر يوم تفطرون، وعند الشافعية يلزمه الفطر سرا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10259} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10260}"
  en: "Shawwal is the lunar month after Ramadan; it is the month of the festival of breaking the fast and the first of the months of the pilgrimage. Some jurists hold that fasting six days of it is recommended, while others dislike it, lest it be taken for part of Ramadan. Its new moon is established by completing the thirty days of Ramadan, or, for most, by two just witnesses. One who sees it alone may not break the fast unless he has an excuse, following the saying 'the fast is the day you fast and the breaking the day you break', while the Shafi'is say he must break it quietly. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10259} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10260}"
  es: "Shawwal es el mes lunar posterior al Ramadán; es el mes de la fiesta de la ruptura del ayuno y el primero de los meses de la peregrinación. Algunos juristas consideran recomendable ayunar seis días, mientras que otros lo desaconsejan, por temor a que se confunda con parte del Ramadán. Su luna nueva se establece al completar los treinta días del Ramadán o, en la mayoría de los casos, por dos testigos justos. Quien la ve solo no puede romper el ayuno a menos que tenga una excusa, siguiendo el dicho «el ayuno es el día en que ayunas y la ruptura el día en que rompes», mientras que los shafi'íes afirman que debe romperlo en silencio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10259} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10260}"
  fr: "Shawwal est le mois lunaire qui suit le Ramadan; c’est le mois de la fête de la rupture du jeûne et le premier des mois du pèlerinage. Certains juristes recommandent de jeûner six jours durant ce mois, tandis que d’autres le déconseillent, de peur qu’il ne soit considéré comme une partie du Ramadan. Le nouveau croissant de lune est constaté après l’accomplissement des trente jours du Ramadan, ou, pour la plupart, par deux témoins justes. Celui qui l’aperçoit seul ne peut rompre le jeûne, sauf excuse valable, conformément à l’adage « le jeûne est le jour où l’on jeûne et la rupture est le jour où l’on rompt le jeûne », tandis que les chaféites préconisent de le rompre discrètement."
  ur: "رمضان کے بعد شوال قمری مہینہ ہے۔ یہ روزہ افطار کرنے کے تہوار کا مہینہ ہے اور حج کے مہینوں کا پہلا مہینہ ہے۔ بعض فقہاء کے نزدیک اس میں سے چھ روزے مستحب ہیں، جبکہ بعض اسے ناپسند کرتے ہیں، ایسا نہ ہو کہ اسے رمضان کا حصہ بنا لیا جائے۔ اس کا نیا چاند رمضان المبارک کے تیس دن مکمل کرنے یا زیادہ تر دو گواہوں کے ذریعے قائم ہوتا ہے۔ جو شخص اسے اکیلے دیکھے وہ روزہ نہیں توڑ سکتا جب تک کہ اس کے پاس عذر نہ ہو، اس قول پر عمل کرتے ہوئے کہ 'روزہ وہ دن ہے جس دن تم روزہ رکھتے ہو اور جس دن افطار کرتے ہو'، جبکہ شافعی کہتے ہیں کہ اسے خاموشی سے افطار کرنا چاہیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10259}"
