id: concept/badhinjan
class: concept
kind: natural
label:
  ar: "باذنجان"
  en: "Badhinjan (aubergine)"
  ur: "بینگن"
summary:
  ar: "معروف. الحديث أسلم من العتيق، وطعمه وطبعه كالقلي. حار يابس في الثانية لمرارته وحرافته، يولّد السوداء والسدد، ويفسد اللون ويسوّد البشرة، ويولّد السرطانات والصلابة، والصداع، ويبثر الفم، ويولّد سدد الكبد والطحال، ويولّد البواسير؛ وسحيق أقماعه المجففة في الظل طلاء نافع للبواسير، والمطبوخ في الخل ربما فتح سدد الكبد {cite:canon-ibn-sina-print-v1 p.399}."
  en: "A well-known vegetable. The fresh is safer than the old, and its taste and nature are like the fried. Hot and dry in the second degree because of its bitterness and pungency. It produces black bile and obstruction, spoils the colour and darkens the skin, produces cancers and hardness, headache, and mouth ulcers, and produces obstructions of the liver and spleen and piles. Its dried calyxes, dried in shade and ground fine, make a useful ointment for piles. The aubergine cooked in vinegar sometimes opens the obstructions of the liver {cite:canon-ibn-sina-print-v1 p.399}."
  ur: "یہ معروف سبزی ہے۔ تازہ بینگن پرانے سے محفوظ تر ہے، اور اس کا ذائقہ اور طبیعت تلے ہوئے کی طرح ہے۔ اپنی کڑواہٹ اور تیزی کی وجہ سے دوسرے درجے میں گرم اور خشک۔ یہ سودا اور رکاوٹ پیدا کرتا ہے، رنگ خراب کرتا اور جلد کو سیاہ کرتا ہے، سرطانی گلٹیاں اور سختی، سردرد، اور منہ کے چھالے پیدا کرتا ہے، جگر اور تلی کی رکاوٹ اور مسّے پیدا کرتا ہے؛ اس کے سائے میں خشک کیے گئے کیلکوں کا باریک پاؤڈر مسّوں پر لیپ کے طور پر مفید ہے، اور سرکے میں پکایا ہوا بینگن کبھی جگر کی رکاوٹ کھولتا ہے {cite:canon-ibn-sina-print-v1 p.399}۔"
