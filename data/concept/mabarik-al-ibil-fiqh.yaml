id: concept/mabarik-al-ibil-fiqh
class: concept
kind: legal
label:
  ar: "مَبَارِك الإِبل"
  en: "Mabarik al-ibil (camels' resting places): prayer near them"
  ur: "مبارکِ اونٹ (اونٹوں کے بیٹھنے کی جگہ): وہاں نماز"
summary:
  ar: "المبارك جمع مبرك، وهو موضع بروك الإبل، وبعض الفقهاء يسوون بين المبارك والمعاطن {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13819}. والمرابض مأوى الغنم، والمرابد موقف الإبل وهي أعم من المبارك {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13819-13820}. ذهب جمهور الفقهاء إلى كراهة الصلاة في مبارك الإبل ولو كانت طاهرة، وعن أحمد روايتان: إحداهما بطلان الصلاة فيها، والأخرى كالجمهور مع صحة الصلاة ما لم تكن نجسة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13820}. وعلة النهي عند الحنفية والشافعية ما في الإبل من النفور الذي يقطع الصلاة أو يشوش الخشوع، والمالكية يرونه تعبدياً، وعند الحنابلة قول بأنه لمظنة النجاسة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13820-13821}."
  en: "Mabarik is the plural of mabrak, the place where camels kneel; some jurists treat mabarik and ma'atin (watering and resting places) alike {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13819}. Marabid are the pens where sheep rest and marad (camel pens) are wider than mabarik {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13819-13820}. Most jurists dislike prayer in the resting places of camels, even when they are clean; Ahmad has two narrations, one that prayer there is invalid, and one like the majority, valid unless the place is impure {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13820}. The Hanafis and Shafi'is give the reason as the camels' skittishness, which may break the prayer or distract from humility in it; the Malikis say the rule is devotional and not based on a reason; one Hanbali view is that it is because such places may be impure {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13820-13821}."
  ur: "مبارک مبرک کی جمع ہے، یعنی وہ جگہ جہاں اونٹ بیٹھتے ہیں؛ بعض فقہاء مبارک اور معاطن کو ایک ہی درجہ دیتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13819}۔ مرابض بکریوں کے باڑے ہیں، اور مرابد اونٹوں کے کھڑے ہونے کی جگہ ہے جو مبارک سے عام ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13819-13820}۔ جمہور فقہاء کے نزدیک اونٹوں کے بیٹھنے کی جگہ میں نماز مکروہ ہے، خواہ جگہ پاک ہو؛ احمد سے دو روایتیں ہیں، ایک کے مطابق نماز باطل ہے، دوسری کے مطابق جمہور کی طرح صحیح ہے جب تک جگہ نجس نہ ہو {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13820}۔ حنفیہ اور شافعیہ کے نزدیک علت اونٹوں کی بدکنے کی عادت ہے جو نماز توڑ سکتی ہے یا خشوع میں خلل ڈالتی ہے؛ مالکیہ کے نزدیک یہ حکم تعبدی ہے، اور حنابلہ کے ایک قول کے مطابق علت نجاست کا امکان ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13820-13821}۔"
