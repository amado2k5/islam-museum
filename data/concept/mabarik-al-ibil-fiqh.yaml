id: concept/mabarik-al-ibil-fiqh
class: concept
kind: legal
label:
  ar: "مَبَارِك الإِبل"
  en: "Mabarik al-ibil (camels' resting places): prayer near them"
  ur: "مبارکِ اونٹ ⁦(اونٹوں کے بیٹھنے کی جگہ)⁩: وہاں نماز"
  es: "Mabarik al-ibil (lugares de descanso de los camellos): oración cerca de ellos"
  fr: "Mabarik al-ibil (lieux de repos des chameaux): prière près d'eux"
  tr: "Kutsanmış develer"
  id: "Unta yang diberkati"
summary:
  ar: "المبارك جمع مبرك، وهو موضع بروك الإبل، وبعض الفقهاء يسوون بين المبارك والمعاطن {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13819}. والمرابض مأوى الغنم، والمرابد موقف الإبل وهي أعم من المبارك {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13819-13820}. ذهب جمهور الفقهاء إلى كراهة الصلاة في مبارك الإبل ولو كانت طاهرة، وعن أحمد روايتان: إحداهما بطلان الصلاة فيها، والأخرى كالجمهور مع صحة الصلاة ما لم تكن نجسة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13820}. وعلة النهي عند الحنفية والشافعية ما في الإبل من النفور الذي يقطع الصلاة أو يشوش الخشوع، والمالكية يرونه تعبدياً، وعند الحنابلة قول بأنه لمظنة النجاسة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13820-13821}."
  en: "Mabarik is the plural of mabrak, the place where camels kneel; some jurists treat mabarik and ma'atin (watering and resting places) alike {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13819}. Marabid are the pens where sheep rest and marad (camel pens) are wider than mabarik {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13819-13820}. Most jurists dislike prayer in the resting places of camels, even when they are clean; Ahmad has two narrations, one that prayer there is invalid, and one like the majority, valid unless the place is impure {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13820}. The Hanafis and Shafi'is give the reason as the camels' skittishness, which may break the prayer or distract from humility in it; the Malikis say the rule is devotional and not based on a reason; one Hanbali view is that it is because such places may be impure {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13820-13821}."
  ur: "مبارک مبرک کی جمع ہے، یعنی وہ جگہ جہاں اونٹ بیٹھتے ہیں؛ بعض فقہاء مبارک اور معاطن کو ایک ہی درجہ دیتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13819}۔ مرابض بکریوں کے باڑے ہیں، اور مرابد اونٹوں کے کھڑے ہونے کی جگہ ہے جو مبارک سے عام ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13819-13820}۔ جمہور فقہاء کے نزدیک اونٹوں کے بیٹھنے کی جگہ میں نماز مکروہ ہے، خواہ جگہ پاک ہو؛ احمد سے دو روایتیں ہیں، ایک کے مطابق نماز باطل ہے، دوسری کے مطابق جمہور کی طرح صحیح ہے جب تک جگہ نجس نہ ہو {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13820}۔ حنفیہ اور شافعیہ کے نزدیک علت اونٹوں کی بدکنے کی عادت ہے جو نماز توڑ سکتی ہے یا خشوع میں خلل ڈالتی ہے؛ مالکیہ کے نزدیک یہ حکم تعبدی ہے، اور حنابلہ کے ایک قول کے مطابق علت نجاست کا امکان ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13820-13821}۔"
  es: "Mabarik es el plural de mabrak, el lugar donde se arrodillan los camellos; algunos juristas tratan mabarik y ma'atin (lugares de agua y descanso) por igual {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13819}. Marabid son los corrales donde descansan las ovejas y marad (corrales de camellos) son más anchos que mabarik {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13819-13820}. La mayoría de los juristas desaprueban la oración en los lugares de descanso de los camellos, incluso cuando están limpios; Ahmad tiene dos narraciones, una que dice que la oración allí es inválida, y otra como la mayoría, válida a menos que el lugar esté impuro {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13820}. Los hanafíes y shafiíes dan como razón el nerviosismo de los camellos, que puede interrumpir la oración o distraer de la humildad en ella; los malikíes dicen que la regla es devocional y no se basa en una razón; una opinión hanbalí es que se debe a que tales lugares pueden ser impuros {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13820-13821}."
  fr: "Mabarik est le pluriel de mabrak, l'endroit où les chameaux s'agenouillent; certains juristes assimilent mabarik et ma'atin (lieux d'abreuvement et de repos) {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13819}. Marabid désigne les enclos où se reposent les moutons, et marad (enclos à chameaux) est plus large que mabarik {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13819-13820}. La plupart des juristes déconseillent la prière dans les lieux de repos des chameaux, même s'ils sont propres; Ahmad rapporte deux hadiths: l'un invalide la prière à cet endroit, l'autre, conforme à l'opinion majoritaire, la considère valide sauf si le lieu est impur {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13820}. Les Hanafites et les Shafi'ites donnent comme raison la nervosité des chameaux, qui peut interrompre la prière ou distraire de l'humilité dans celle-ci; les Malikites disent que la règle est dévotionnelle et non basée sur une raison; une opinion Hanbalite est que c'est parce que de tels endroits peuvent être impurs {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13820-13821}."
  tr: "El-Mübarek, develerin kurban edildiği yer olan 'Mübarek'in çoğuludur. Bazı hukukçular 'Mübarek' ve 'Mü'atan'ı eşitler {atıf:] Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.13819}. 'Murabid' koyunlar için sığınak, 'marabid' ise develerin yeridir; bu, 'Mubarak'tan daha geniştir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13819-13820}. Çoğu hukukçu, Mübarek develerinde temiz olsalar bile namaz kılmanın hoş karşılanmadığını savunur. Ahmad'ın iki anlatısı vardır: biri namaz için geçersizdir, diğeri ise çoğunluk gibidir; namaz kirli değilse geçerlidir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13820}. Hanafi ve Şafi'lere göre yasaklama nedeni, develerdeki duayı bozan veya alçakgönüllülüğü bozan tiksintidir. Malikiler bunu bir ibadet eylemi olarak kabul eder. Hanbaliler ise bunun kirlilik olasılığından kaynaklandığını söyler {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13820-13821}."
  id: "Al-Mubarak adalah bentuk jamak dari 'Mubarak', yaitu tempat di mana unta dikorbankan. Beberapa ahli hukum menyamakan 'Mubarak' dan 'Mu'atan' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13819}. 'Murabid' adalah tempat berlindung bagi domba, dan 'marabid' adalah tempat untuk unta, yang lebih luas daripada 'Mubarak' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13819-13820}. Mayoritas ahli hukum berpendapat bahwa tidak disukai untuk berdoa di unta Mubarak meskipun mereka murni. Ahmad memiliki dua narasi: satu tidak sah untuk shalat, dan yang lain seperti mayoritas, dengan shalat berlaku kecuali jika tidak murni {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13820}. Alasan larangan menurut Hanafi dan Shafi'i adalah ketidaksukaan pada unta yang melanggar doa atau mengganggu kerendahan hati. Orang Malik menganggapnya sebagai tindakan ibadah. Hanbal mengatakan hal ini karena kemungkinan adanya ketidakmurnian {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13820-13821}."
