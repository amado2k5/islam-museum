label: { ar: "المَوَاقِيت (أوقات العبادات وأمكنتها)", en: "Times and places fixed for acts of worship (mawaqit)", ur: "اوقات (عبادات کے اوقات اور مقامات)" }
summary:
  ar: "الميقات في اللغة الوقت المحدود زمانا أو مكانا، والموقوت بمعناه. ودخول الوقت شرط لصحة الصلاة. ومن الأحكام المتعلقة بالمواقيت وقت الجمعة وصلاة العيدين، والأوقات المنهي عن الصلاة فيها، ووقت زكاة الفطر والأضحية، ووقت الإهلال بالحج والوقوف بعرفة والمبيت بمزدلفة ورمي الجمرات وطواف الإفاضة، والمواقيت المكانية للإحرام."
  en: "Miqat in the lexicon is a fixed time or place; the word for it also means set in time. Entry into the time is a condition of valid prayer. The entry lists the times for the Friday prayer and the two festival prayers, the hours in which prayer is forbidden, the times for the festival alms and the sacrifice, the time for beginning the pilgrimage, standing at Arafat, sleeping at Muzdalifa, stoning, circumambulation, and the places for entering the state of consecration."
  ur: "میقات لغت میں مقرر وقت یا جگہ کو کہتے ہیں۔ نماز کے وقت کا داخل ہونا صحتِ نماز کی شرط ہے۔ اس میں جمعہ، عیدین، فطرہ، قربانی، حج کے ایام اور احرام کے مقامات کے اوقات بیان ہوئے ہیں۔"
