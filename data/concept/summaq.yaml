summary:
  ar: "السماق في الكتاب منه خراساني ومنه شامي أصغر منه أحمر عدسي، بارد في الثانية يابس في الثالثة، قابض مقو ساد يمنع النزف، يمنع الورم والحصر ويسكن وجع الأسنان، دباغ للمعدة مقو لها يسكن العطش ويشهي ويسكن الغثيان الصفراوي، ويحبس السحج والدوسنطاريا والإسهال المزمن، وفي الكتاب نقل موسوم في الطمث {cite:canon-ibn-sina-print-v1 p.597}."
  en: "Summaq is in the book of a Khurasani kind and a Syrian kind smaller than the Khurasani, red and lentil-like, cold in the second degree and dry in the third, astringent, strengthening and blocking; it checks flux, prevents swelling, calms toothache, tans and strengthens the stomach, calms thirst, whets the appetite and calms bilious nausea, and restrains abrasion, dysentery and chronic diarrhoea, with a labelled listing on the menses {cite:canon-ibn-sina-print-v1 p.597}."
  ur: "سماق کتاب میں خراسانی بھی ہے اور شامی بھی جو خراسانی سے چھوٹا، سرخ اور مسور جیسا ہے؛ دوسرے درجے میں ٹھنڈا اور تیسرے میں خشک، قابض، قوت دینے والا اور سدّ کرنے والا، بہتے خون کو روکتا ہے، ورم اور سوجن کو روکتا، دانتوں کے درد کو تسکین دیتا، معدے کو دباغت دے کر قوت دیتا، پیاس بجھاتا، بھوک جگاتا اور صفراوی متلی کو تسکین دیتا ہے، اور چھلنے، پیچش اور پرانے اسہال کو روکتا ہے، اور حیض کے بارے میں ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.597}۔"
  es: "Summaq está en el libro de un tipo Khurasani y un tipo sirio más pequeño que el Khurasani, rojo y parecido a una lenteja, frío en el segundo grado y seco en el tercero, astringente, fortalecedor y bloqueador; controla el flujo, previene la hinchazón, calma el dolor de muelas, tonifica y fortalece el estómago, calma la sed, abre el apetito y calma las náuseas biliosas, y frena la abrasión, la disentería y la diarrea crónica, con una lista etiquetada en la menstruación {cite:canon-ibn-sina-print-v1 p.597}."
  fr: "Le summaq est décrit dans le livre comme une variété khurasani et une variété syrienne plus petite que la khurasani, rouge et semblable à une lentille, froide au deuxième degré et sèche au troisième, astringente, fortifiante et bloquante; elle arrête les flux, prévient les gonflements, calme les maux de dents, raffermit et fortifie l'estomac, calme la soif, aiguise l'appétit et calme les nausées bilieuses, et freine l'abrasion, la dysenterie et la diarrhée chronique, avec une liste étiquetée sur les menstruations {cite:canon-ibn-sina-print-v1 p.597}."
  tr: "Kitaptaki sumak Horasani, diğeri ise Levantine'dir; mercek kırmızısından daha küçük, ikinci sumak soğuk, üçüncüsü kurudur. Kanamayı önleyen, şişlik ve daralmayı önleyen, diş ağrısını hafifleten güçlü bir büzücüdür. Susuzluğu güçlendiren, iştahı gideren, safra bulantısını yatıştıran, dizanteri ve kronik ishal riskini önleyen mide bronzluğudur. Kitapta adet üzerine bir alıntı yer alır {cite:canon-ibn-sina-print-v1 s.597}."
  id: "Sumac dalam buku ini adalah Khorasani dan yang lainnya berwarna Levantine, lebih kecil dari merah lentikular, dingin di gigi kedua dan kering di bagian ketiga. Ini adalah astringen kuat yang mencegah perdarahan, mencegah pembengkakan dan penyempitan, serta meredakan sakit gigi. Ini adalah warna kulit perut yang memperkuat haus, menghilangkan nafsu makan, meredakan mual empedu, mencegah disentri, dan diare kronis. Buku ini memuat kutipan berjudul tentang menstruasi {cite:canon-ibn-sina-print-v1 hlm.597}."
