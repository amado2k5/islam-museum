id: concept/lihya-fiqh
class: concept
kind: legal
label:
  ar: "اللِّحْيَة"
  en: "Beard (lihya), fiqh rulings"
  ur: "داڑھی (فقہی احکام)"
summary:
  ar: "اللحية في اللغة الشعر النابت على الخدين والذقن، والجمع لِحى ولُحى؛ وعند الفقهاء الشعر النابت على الخدين من عذار وعارض والذقن {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13593}. والعذار جانبا اللحية المحاذيان للأذن، والعارض ما نزل عن حد العذار حتى يلاقي شعر الذقن، والذقن مجتمع اللحيين، والعنفقة ما بين الشفة السفلى والذقن، والسبال طرف الشارب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13593} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13594}."
  en: "Lihya, in lexicon, is the hair that grows on the cheeks and chin; the jurists take it as the hair on the cheeks, the sides, the lower face and the chin. The ʿidhar is the side that faces the ear, the ʿarid is the hair below the ear that meets the chin, the dhaqan is the joint of the jaw, the ʿanfaqa is what lies between the lower lip and the chin, and the sibal are the ends of the moustache {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13593} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13594}."
  ur: "لحیہ لغت میں ان بالوں کو کہتے ہیں جو رخساروں اور ٹھوڑی پر اگتے ہیں، جمع لحی اور لُحیٰ ہے؛ فقہاء کے نزدیک یہ رخساروں کے بال، عذار اور عارض اور ٹھوڑی کے بال ہیں۔ عذار وہ دونوں طرف ہیں جو کان کے سامنے ہوں، عارض وہ بال جو عذار سے نیچے ٹھوڑی کے بالوں تک آئیں، ذقن جبڑوں کا مجمع ہے، عنفقہ نچلے ہونٹ اور ٹھوڑی کے درمیان کے بال ہیں اور سبال مونچھ کے کنارے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13593} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13594}۔"
