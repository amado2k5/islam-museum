id: concept/dayatha-fiqh
class: concept
kind: legal
label:
  ar: "الدياثة (في الفقه)"
  en: "Dayatha (cuckoldry: failing to guard one's family, in fiqh)"
  ur: "دیاثت (فقہی اصطلاح)"
summary:
  ar: "الدياثة في اللغة عدم الغيرة على الأهل والمحارم، والديوث من لا غيرة له على أهله، ومثله عند الفقهاء القرطبان والقرنان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8304} الدياثة من الكبائر، وعدها الحديث في من لا يدخل الجنة، وإذا كانت عامة فهي من الإفساد في الأرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8305} وتتصل بها أحكام الطلاق، ويعزر من سب غيره بالديوث ولا يحد، وتسقط العدالة عند الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8305}"
  en: "In the lexicon dayatha is a lack of jealousy over one's household and kin; the dayyuth is the man without such jealousy, and jurists add the qurtuban and the qarnan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8304} Dayatha is a grave sin: a report counts the dayyuth among those who will not enter Paradise, and when it is widespread it is counted as corruption in the land. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8305} It bears on the rules of divorce; one who insults another by calling him dayyuth is discretionarily punished and not hadd-punished; and the Shafi'is and Hanbalis count it among the things that remove a witness's probity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8305}"
  ur: "لغت میں دیاثت غیرت نہ ہونے کو کہتے ہیں، اور دیوث وہ شخص ہے جسے اپنے اہل و عیال کی غیرت نہ ہو۔ فقہاء کے نزدیک یہ کبیرہ گناہ ہے اور اس پر تعزیر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8305}"
