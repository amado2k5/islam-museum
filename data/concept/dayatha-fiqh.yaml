label:
  ar: "الدياثة ⁦(في الفقه)⁩"
  en: "Dayatha (cuckoldry: failing to guard one's family, in fiqh)"
  ur: "دیاثت ⁦(فقہی اصطلاح)⁩"
  es: "Dayatha (cornudo: no proteger a la familia, en fiqh)"
  fr: "Dayatha (cocuage: manquement à l'obligation de protéger sa famille, en fiqh)"
summary:
  ar: "الدياثة في اللغة عدم الغيرة على الأهل والمحارم، والديوث من لا غيرة له على أهله، ومثله عند الفقهاء القرطبان والقرنان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8304} الدياثة من الكبائر، وعدها الحديث في من لا يدخل الجنة، وإذا كانت عامة فهي من الإفساد في الأرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8305} وتتصل بها أحكام الطلاق، ويعزر من سب غيره بالديوث ولا يحد، وتسقط العدالة عند الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8305}"
  en: "In the lexicon dayatha is a lack of jealousy over one's household and kin; the dayyuth is the man without such jealousy, and jurists add the qurtuban and the qarnan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8304} Dayatha is a grave sin: a report counts the dayyuth among those who will not enter Paradise, and when it is widespread it is counted as corruption in the land. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8305} It bears on the rules of divorce; one who insults another by calling him dayyuth is discretionarily punished and not hadd-punished; and the Shafi'is and Hanbalis count it among the things that remove a witness's probity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8305}"
  ur: "لغت میں دیاثت غیرت نہ ہونے کو کہتے ہیں، اور دیوث وہ شخص ہے جسے اپنے اہل و عیال کی غیرت نہ ہو۔ فقہاء کے نزدیک یہ کبیرہ گناہ ہے اور اس پر تعزیر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8305}"
  es: "En el léxico dayatha es la falta de celos hacia el hogar y la familia; dayyuth es el hombre sin tales celos, y los juristas añaden qurtuban y qarnan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8304} Dayatha es un pecado grave: un informe cuenta a los dayyuth entre aquellos que no entrarán en el Paraíso, y cuando está extendido se cuenta como corrupción en la tierra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8305} Incide en las reglas del divorcio; quien insulta a otro llamándolo dayyuth es castigado discrecionalmente y no hadd-castigado; y los shafi'is y hanbalis lo cuentan entre las cosas que eliminan la probidad de un testigo. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8305}"
  fr: "Dans le lexique, dayatha désigne l'absence de jalousie envers sa famille et ses proches; dayyuth est l'homme dépourvu de cette jalousie, et les juristes y ajoutent les termes qurtuban et qarnan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8304} La dayatha est un péché grave: selon un hadith, le dayyuth compte parmi ceux qui n'entreront pas au Paradis, et lorsqu'elle est répandue, elle est considérée comme une corruption du pays. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8304} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8305} Elle influe sur les règles du divorce; celui qui insulte autrui en le traitant de dayyuth est puni à la discrétion de l'autorité compétente et non selon la loi (hadd); et les écoles chaféite et hanbalite la considèrent comme un élément qui compromet la crédibilité d'un témoin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8305}"
