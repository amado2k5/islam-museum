  "en": "The signs of peripneumonia: an acute sthenic fever, for it is a hot tumour\
    \ in the inward parts; severe shortness of breath, like a strangling, for the\
    \ inhaled air is impeded by the tumour and the passages are narrowed; a sense\
    \ of weight, from the abundance of matter in an organ whose substance is insensate\
    \ but whose enveloping membrane is sensitive and stretched through the whole chest;\
    \ a pain extending from the chest and the depth toward the lower back and the\
    \ spine, which may be felt between the shoulders; a throbbing may be felt under\
    \ the shoulder, the clavicle and the breast, either continuous or when he coughs;\
    \ he cannot lie except on his back — lying on the side suffocates him. The peripneumonia\
    \ patient's tongue reddens first, then blackens, and is so coated that the hand\
    \ would stick to it if touched, with thickening; his whole face may share the\
    \ stretching and fullness, and a redness and swelling appear on the cheeks from\
    \ the vapour rising to them — they being fleshy and porous, not skinned like the\
    \ forehead — and the redness may strengthen to a dyed colour; he may feel the\
    \ vapour's ascent as though a fire rose over him; a severe blowing and a high\
    \ rapid breathing appear, for the greatness of the fever and its corruption; the\
    \ eyes are inflamed, their movement heavy, their vessels full, the lids heavy\
    \ — the cause again being the vapour; something like a swelling appears on the\
    \ cornea and something like a protrusion on the pupil, with a greasiness and fatness,\
    \ and the neck thickens; a stupor may occur for the abundance of moist vapour,\
    \ and cold may accompany it. The pulse is wavy and soft, for the tumour is in\
    \ a soft organ and the matter moist; the wavy pulse necessarily differs within\
    \ a single expansion, may drop out, may become two-branched within one expansion,\
    \ or vary over many expansions, with the mid-beat falling irregularly; his pulse\
    \ is mostly large, for the greatness of the need and the softness of the instrument\
    \ — unless the power is very weak — and the frequency strengthens or slackens\
    \ with the fever and the need and the power's sufficiency, by its greatness or\
    \ its failing of it. Their expectoration may take the same colours as in pleurisy,\
    \ mostly phlegmatic; but in peripneumonia the shortness of breath is present while\
    \ the felt weight in the chest is less, though the inflammation is at its utmost\
    \ severity {cite:canon-ibn-sina-print-v2 p.351}"
  "fr": >-
    Les signes de la péripneumonie selon Ibn Sina : une fièvre aiguë sthénique, car il s’agit d’une
    tuméfaction chaude des parties internes ; un essoufflement sévère, comparable à un étranglement, car la
    tuméfaction entrave l’air inspiré et les voies se rétrécissent ; une sensation de pesanteur due à
    l’abondance de matière dans un organe dont la substance est insensible, mais dont l’enveloppe
    membraneuse, sensible, s’étend dans toute la poitrine ; une douleur qui gagne des profondeurs de la
    poitrine les lombes et la colonne et peut se faire sentir entre les épaules. Des battements peuvent se
    faire sentir sous l’épaule, la clavicule et le sein, soit continuellement, soit lorsque le malade tousse.
    Il ne peut s’allonger que sur le dos : se coucher sur le côté l’étouffe. Sa langue rougit d’abord, puis
    noircit, s’épaissit et se couvre d’un enduit tel que la main y adhérerait au toucher. Le visage entier
    peut se tendre et se remplir. Les joues rougissent et enflent à cause de la vapeur qui y monte : elles
    sont charnues et poreuses, et n’ont pas la même peau que le front. La rougeur peut s’intensifier comme si
    le teint avait été coloré. Le malade peut sentir la vapeur monter comme un feu qui s’élèverait au-dessus
    de lui. Il présente un souffle violent et une respiration haute et rapide, à cause de l’intensité et de
    l’altération de la fièvre. Les yeux sont enflammés, leurs mouvements pesants, leurs vaisseaux pleins et
    leurs paupières lourdes, toujours à cause de la vapeur. Une sorte de gonflement apparaît sur la cornée,
    une sorte de saillie sur la pupille, avec un aspect gras et huileux ; le cou s’épaissit. Une stupeur peut
    survenir par abondance de vapeur humide, et le froid peut l’accompagner. Le pouls est ondulant et mou,
    parce que la tuméfaction est dans un organe mou et la matière humide. Le pouls ondulant varie
    nécessairement au cours d’une seule dilatation ; il peut s’interrompre, se dédoubler en une seule
    dilatation ou varier sur plusieurs dilatations, avec un battement médian irrégulier. Le pouls est
    généralement ample, en raison de l’importance du besoin et de la souplesse de l’instrument, à moins que
    la faculté soit très faible. Sa fréquence augmente ou diminue selon la fièvre, le besoin et la capacité
    de la faculté à y répondre, selon qu’elle est vigoureuse ou qu’elle fait défaut. L’expectoration peut
    prendre les mêmes couleurs que dans la pleurésie et elle est le plus souvent flegmatique. Dans la
    péripneumonie, cependant, l’essoufflement est présent tandis que la pesanteur ressentie dans la poitrine
    est moindre, bien que l’inflammation soit à son comble {cite:canon-ibn-sina-print-v2 p.351}.
