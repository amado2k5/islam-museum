    \ چہرہ تناو اور امتلاء میں شریک ہو سکتا ہے اور بھاپ کے چڑھنے سے رخساروں میں سرخی\
    \ اور سوجن آتی ہے کیونکہ وہ گوشتی اور نرم ہیں پیشانی کی طرح کھالی نہیں، اور سرخی\
    \ رنگین ہونے تک بڑھ سکتی ہے اور وہ بھاپ کے چڑھنے کو ایسے محسوس کر سکتا ہے جیسے\
    \ آگ اوپر اٹھے، اور شدید پھونکن اور تیز بلند سانس آتی ہے حمى کی شدت و فساد سے،\
    \ آنکھیں بھڑکتی ہیں حرکت بھاری عروق بھر جاتی ہیں پلکیں بھاری ہوتی ہیں اور سبب\
    \ بھی وہی بھاپ ہے، کرنیہ پر ورم جیسا اور پتلی پر ابھار جیسا دکھائی دیتا ہے چکنائی\
    \ اور موٹاپے کے ساتھ اور گردن موٹی ہوتی ہے، اور گیلی بھاپ کی کثرت سے سبات ہو سکتا\
