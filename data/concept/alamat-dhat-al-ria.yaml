    \ ہے اور سینے میں محسوس ہونے والا بوجھ کم ہوتا ہے لیکن التهاب انتہا کی شدت پر\
    \ ہوتا ہے {cite:canon-ibn-sina-print-v2 p.351}"
  "es": "Signos de perineumonía: fiebre estenética aguda, por ser un tumor caliente en las partes internas; dificultad respiratoria grave, como un estrangulamiento, ya que el aire inhalado es impedido por el tumor y los conductos se estrechan; sensación de pesadez, por la abundancia de materia en un órgano cuya sustancia es insensible pero cuya membrana envolvente es sensible y se extiende por todo el pecho; dolor que se extiende desde el pecho y la profundidad hacia la parte baja de la espalda y la columna vertebral, que puede sentirse entre los hombros; se puede sentir un palpitar debajo del hombro, la clavícula y el pecho, ya sea continuo o cuando tose; no puede acostarse excepto boca arriba, acostarse de lado lo asfixia. La lengua del paciente con perineumonía primero se enrojece, luego se ennegrece y se cubre de tal manera que la mano se pegaría a ella si se tocara, con engrosamiento; Todo su rostro puede compartir el estiramiento y la plenitud, y un enrojecimiento e hinchazón aparecen en las mejillas por el vapor que asciende a ellas —siendo carnosas y porosas, no desolladas como la frente— y el enrojecimiento puede intensificarse hasta adquirir un color teñido; puede sentir el ascenso del vapor como si un fuego se elevara sobre él; aparecen un fuerte resoplido y una respiración rápida y aguda, por la magnitud de la fiebre y su corrupción; los ojos están inflamados, su movimiento pesado, sus vasos llenos, los párpados pesados —la causa es nuevamente el vapor—; aparece algo parecido a una hinchazón en la córnea y algo parecido a una protuberancia en la pupila, con una untuosidad y grasa, y el cuello se engrosa; puede ocurrir un estupor debido a la abundancia de vapor húmedo, y puede ir acompañado de frío. El pulso es ondulado y suave, porque el tumor está en un órgano blando y la materia húmeda; el pulso ondulado necesariamente difiere dentro de una sola expansión, puede desaparecer, puede volverse biramificado dentro de una expansión, o variar a lo largo de muchas expansiones, con el latido medio cayendo irregularmente; Su pulso suele ser grande, debido a la intensidad de la necesidad y la debilidad del instrumento —a menos que la potencia sea muy débil— y la frecuencia se fortalece o se debilita con la fiebre, la necesidad y la suficiencia de la potencia, según su intensidad o su insuficiencia. Su expectoración puede presentar los mismos colores que en la pleuresía, principalmente flemáticos; pero en la perineumonía la disnea está presente, mientras que la sensación de pesadez en el pecho es menor, aunque la inflamación se encuentra en su máxima gravedad {cite:canon-ibn-sina-print-v2 p.351}"
