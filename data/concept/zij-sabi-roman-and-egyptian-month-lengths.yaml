summary:
  ar: "يعدد البتاني شهور الروم كما يستعملها اليونانيون وأهل مصر من أيلول إلى آب، ويبيّن أيام كل شهر، وأن السنة تُكبس في الرابعة فيزاد فيها يوم، وتكون السنة الكبيسة تسعاً وعشرين يوماً في شباط. {cite:zij-sabi-nallino-byblion p.100}."
  en: "Al-Battani lists the Roman months as the Greeks and the people of Egypt use them, from Aylul to Ab, gives the days of each, and says the year is intercalated every fourth year, when February takes an extra day. {cite:zij-sabi-nallino-byblion p.100}."
  ur: "البتانی رومی مہینے جیسے یونانی اور مصری استعمال کرتے ہیں، ایلول سے آب تک، گنواتے ہیں، ہر مہینے کے دن بتاتے ہیں، اور کہتے ہیں کہ سال ہر چوتھے سال کبیسہ ہوتا ہے اور شباط میں ایک دن زیادہ ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.100}۔"
  es: "Al-Battani enumera los meses romanos tal como los usan los griegos y los egipcios, desde Aylul hasta Ab, indica los días de cada uno y afirma que el año se intercala cada cuatro años, cuando febrero tiene un día adicional. {cite:zij-sabi-nallino-byblion p.100}."
