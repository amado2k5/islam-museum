label: { ar: "شهور الروم وأهل مصر وأيامها", en: "The Roman and Egyptian months and their lengths", ur: "رومی اور مصری مہینے اور ان کے دن", es: "Los meses romanos y egipcios y su duración", fr: "Les mois romains et égyptiens et leur durée", tr: "Romalıların ve Mısır halkının ayları ve günleri", id: "Bulan-bulan dalam kalender Romawi dan penduduk Mesir beserta hari-harinya." }
summary:
  ar: "يعدد البتاني شهور الروم كما يستعملها اليونانيون وأهل مصر من أيلول إلى آب، ويبيّن أيام كل شهر، وأن السنة تُكبس في الرابعة فيزاد فيها يوم، وتكون السنة الكبيسة تسعاً وعشرين يوماً في شباط. {cite:zij-sabi-nallino-byblion p.100}."
  en: "Al-Battani lists the Roman months as the Greeks and the people of Egypt use them, from Aylul to Ab, gives the days of each, and says the year is intercalated every fourth year, when February takes an extra day. {cite:zij-sabi-nallino-byblion p.100}."
  ur: "البتانی رومی مہینے جیسے یونانی اور مصری استعمال کرتے ہیں، ایلول سے آب تک، گنواتے ہیں، ہر مہینے کے دن بتاتے ہیں، اور کہتے ہیں کہ سال ہر چوتھے سال کبیسہ ہوتا ہے اور شباط میں ایک دن زیادہ ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.100}۔"
  es: "Al-Battani enumera los meses romanos tal como los usan los griegos y los egipcios, desde Aylul hasta Ab, indica los días de cada uno y afirma que el año se intercala cada cuatro años, cuando febrero tiene un día adicional. {cite:zij-sabi-nallino-byblion p.100}."
  fr: "Al-Battani énumère les mois romains tels qu'ils sont utilisés par les Grecs et les Égyptiens, d'Aylul à Ab, indique le nombre de jours de chaque mois et précise que l'année est intercalée tous les quatre ans, février comptant alors un jour supplémentaire. {cite:zij-sabi-nallino-byblion p.100}."
  tr: "Al-Battani, Romalıların kullandığı ayları, Yunanlılar ve Mısırlılar tarafından da kullanılan Eylül'den Ağustos'a kadar sıralar ve her ayın gün sayısını açıklar. Yılın dördüncü ayında bir gün eklendiğini ve artık yılın Şubat ayında yirmi dokuz gün olduğunu belirtir. {cite:zij-sabi-nallino-byblion s.100}."
  id: "Al-Battani mencantumkan bulan-bulan Romawi sebagaimana digunakan oleh orang Yunani dan Mesir, dari September hingga Agustus, dan menjelaskan jumlah hari dalam setiap bulan. Ia mencatat bahwa tahun disisipkan pada bulan keempat, dengan menambahkan satu hari, dan bahwa tahun kabisat memiliki dua puluh sembilan hari di bulan Februari. {cite:zij-sabi-nallino-byblion p.100}."
