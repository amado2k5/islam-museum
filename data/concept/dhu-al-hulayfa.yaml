id: concept/dhu-al-hulayfa
class: concept
kind: legal
label:
  ar: "ذو الحليفة"
  en: "Dhu al-Hulayfa (the pilgrim's station, miqat, of the people of Medina)"
  ur: "ذو الحلیفہ ⁦(اہل مدینہ کا میقات)⁩"
  es: "Dhu al-Hulayfa (la estación de peregrinación, miqat, de la gente de Medina)"
  fr: "Dhu al-Hulayfa (le lieu de pèlerinage, miqat, des habitants de Médine)"
summary:
  ar: "ذو الحليفة ماء من مياه بني جشم ثم سمي به الموضع، وهو ميقات أهل المدينة، وبينه وبين المدينة ستة أميال، وبينه وبين مكة مائتا ميل إلا ميلين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498} وكان النبي إذا خرج إلى مكة يصلي في مسجد الشجرة، وإذا رجع صلى بذي الحليفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498} وهو من مواقيت الإحرام بالحج والعمرة، وتثبت له أحكام المواقيت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498}"
  en: "Dhu al-Hulayfa was a water of the Banu Jushan and then the name of the place; it is the miqat of the people of Medina, six miles from Medina and two hundred miles from Mecca less two miles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498} The Prophet, going out to Mecca, prayed at the mosque of the tree, and returning, he prayed at Dhu al-Hulayfa in the valley and spent the night there. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498} It is one of the stations for entering the state of ihram for hajj and umra, and it carries the rules of the stations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498}"
  ur: "ذو الحلیفہ بنو جشم کے ایک پانی کا نام تھا، پھر اس جگہ کا نام پڑ گیا، اور یہ اہل مدینہ کا میقات ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498}"
  es: "Dhu al-Hulayfa era un manantial de Banu Jushan y luego el nombre del lugar; es el miqat de la gente de Medina, a seis millas de Medina y a doscientas millas de La Meca menos dos millas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498} El Profeta, al salir hacia La Meca, oró en la mezquita del árbol, y al regresar, oró en Dhu al-Hulayfa en el valle y pasó la noche allí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498} Es una de las estaciones para entrar en estado de ihram para el Hajj y la Umrah, y contiene las reglas de las estaciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498}"
  fr: "Dhu al-Hulayfa était à l'origine un lieu-dit appartenant aux Banu Jushan. Il s'agit du miqat des habitants de Médine, situé à six milles de Médine et à deux cents milles de La Mecque moins deux milles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498} Le Prophète, se rendant à La Mecque, pria à la mosquée de l'Arbre, et à son retour, il pria à Dhu al-Hulayfa, dans la vallée, et y passa la nuit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498} C'est l'une des stations pour entrer en état d'ihram pour le hajj et la umra, et les règles relatives aux stations y sont appliquées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498}"
