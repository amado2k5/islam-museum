id: concept/dhu-al-hulayfa
class: concept
kind: legal
label:
  ar: "ذو الحليفة"
  en: "Dhu al-Hulayfa (the pilgrim's station, miqat, of the people of Medina)"
  ur: "ذو الحلیفہ (اہل مدینہ کا میقات)"
summary:
  ar: "ذو الحليفة ماء من مياه بني جشم ثم سمي به الموضع، وهو ميقات أهل المدينة، وبينه وبين المدينة ستة أميال، وبينه وبين مكة مائتا ميل إلا ميلين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498} وكان النبي إذا خرج إلى مكة يصلي في مسجد الشجرة، وإذا رجع صلى بذي الحليفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498} وهو من مواقيت الإحرام بالحج والعمرة، وتثبت له أحكام المواقيت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498}"
  en: "Dhu al-Hulayfa was a water of the Banu Jushan and then the name of the place; it is the miqat of the people of Medina, six miles from Medina and two hundred miles from Mecca less two miles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498} The Prophet, going out to Mecca, prayed at the mosque of the tree, and returning, he prayed at Dhu al-Hulayfa in the valley and spent the night there. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498} It is one of the stations for entering the state of ihram for hajj and umra, and it carries the rules of the stations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498}"
  ur: "ذو الحلیفہ بنو جشم کے ایک پانی کا نام تھا، پھر اس جگہ کا نام پڑ گیا، اور یہ اہل مدینہ کا میقات ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8498}"
