label:
  ar: "المراودة"
  en: "Muraawada (gentle drawing of people toward the right)"
  ur: "مراودہ (نرمی سے راہ پر لانا)"
summary:
  ar: "يرى الشيخ عمر عبد الكافي أن المراودة إخراج المخلوق برفق عن حالته الطبيعية، ومثالها العربي الذي يراود البعير حتى يشرب، وأنها السلوك النبوي في الأمر والنصيحة. {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep03 00:30:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep03 00:31:00}"
  en: "Sheikh Omar Abdelkafy holds that muraawada is gently drawing a creature out of its natural state, illustrated by the camel coaxed to drink, and that it is the Prophet's manner in commanding and advising {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep03 00:30:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep03 00:31:00}."
  ur: "شیخ عمر عبدالکافی کے نزدیک مراودہ کسی مخلوق کو نرمی سے اس کی فطری حالت سے باہر لانا ہے، جس کی مثال اونٹ کو پانی پلانے کا عمل ہے، اور یہ امر و نصیحت میں نبوی طریقہ ہے {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep03 00:30:30} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep03 00:31:00}۔"
