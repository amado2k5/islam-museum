id: concept/naft-al-dam
class: concept
kind: scientific
label:
  ar: "نفث الدم"
  en: "The spitting of blood"
  ur: "خون کا نفث"
  es: "El escupir sangre"
  fr: "Le crachat de sang"
summary:
  ar: "الدم قد يخرج ثفلاً فيكون من أجزاء الفم وقد يخرج تنخماً فيكون من ناحية الحلق وقد يخرج تنحنحاً فيكون من القصبة وقد يخرج سعالاً فيكون من نواحي الصدر والرئة، والذي من الصدر ليس فيه من الخوف ما في الذي من الرئة فإن الذي من الصدر يبرأ سريعاً وإن لم يبرأ لم يكن له غائلة قروح الرئة وكثيراً ما يصير قروحاً ناصورية تعاود كل وقت بنفث الدم {cite:canon-ibn-sina-print-v2 p.332}"
  en: "The blood may come out as spittle, and then it is from the mouth's parts; it may come out by hawking, and then it is from the throat's side; it may come out by hem-coughing, and then it is from the windpipe; and it may come out by coughing, and then it is from the regions of the chest and the lung. What is from the chest does not hold the fear that what is from the lung holds, for the chest's heals quickly, and if it does not heal there looms for it the lung-ulcer evil, and often it becomes fistulous ulcers returning every while with spitting of blood {cite:canon-ibn-sina-print-v2 p.332}"
  ur: "خون تھوک کی صورت نکل سکتا ہے تو منہ کے اجزا سے ہوتا ہے تنخم کی صورت نکلے تو حلق کی طرف سے تنحنح کی صورت نکلے تو نالی سے اور کھانسی کی صورت نکلے تو سینے اور پھیپھڑے کے اطراف سے ہوتا ہے؛ جو سینے سے ہو اس میں وہ خوف نہیں جو پھیپھڑے والے میں ہے کیونکہ سینے والا جلد شفا پاتا ہے اور اگر شفا نہ پائے تو اس پر پھیپھڑے کے قروح کی آفت ہے اور اکثر وہ ناسوری قروح بن جاتا ہے جو وقتاً فوقتاً خون کے نفث کے ساتھ لوٹتے ہیں {cite:canon-ibn-sina-print-v2 p.332}"
  es: "La sangre puede salir como saliva, y entonces proviene de la boca; puede salir al carraspear, y entonces proviene de la garganta; puede salir al toser, y entonces proviene de la tráquea; y puede salir al toser, y entonces proviene de las regiones del pecho y los pulmones. Lo que proviene del pecho no infunde el mismo temor que lo que proviene de los pulmones, pues el pecho cicatriza rápidamente, y si no cicatriza, se cierne sobre él el mal de la úlcera pulmonar, y a menudo se convierte en úlceras fistulosas que reaparecen periódicamente con expectoración de sangre {cite:canon-ibn-sina-print-v2 p.332}"
  fr: "Le sang peut sortir sous forme de salive, et alors il provient de la bouche; il peut sortir par crachats, et alors il provient de la gorge; il peut sortir par toux sèche, et alors il provient de la trachée; et il peut sortir par toux, et alors il provient de la poitrine et des poumons. Ce qui provient de la poitrine n'inspire pas la même crainte que ce qui provient des poumons, car une affection de la poitrine guérit rapidement, et si elle ne guérit pas, le fléau de l'ulcère pulmonaire menace, et souvent il se transforme en ulcères fistuleux récidivants accompagnés de crachats de sang. {cite:canon-ibn-sina-print-v2 p.332}"
