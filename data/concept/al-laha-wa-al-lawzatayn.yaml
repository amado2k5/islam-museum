id: concept/al-laha-wa-al-lawzatayn
class: concept
kind: scientific
label:
  ar: "اللهاة واللوزتان"
  en: "The uvula and the two tonsils"
  fr: "La luette et les deux amygdales"
  ur: "لہات اور لوزتین"
  es: "La úvula y las dos amígdalas"
summary:
  ar: "اللهاة واللوزتان قد يعرض لهما نوازل تورمهما حتى تمنع النفس وقد تسترخي اللهاة من غير ورم فيحتاج إلى ما يجففها ويقبضها من الباردة والحارة وربما احتيج إلى قطعها وتقرب معالجتها من معالجة الخوانيق وتعالج في الابتداء بلطوخات مما وصف ويرقق بمسها بريشة فإن الإصبع في غير وقية وغير رفقة ربما عنف، والعظيم منها القليل الالتهاب تستعمل عليه الأدوية القوية والملتهب يصلح له ما هو أشد تبريداً مما وصف ⁦(الأسماء من هذا الجنس مطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.297}"
  en: "The uvula and the two tonsils: catarrhs may befall them swelling them until they bar the breath; the uvula may also relax without a tumour, needing what dries and astringes it of the cold and the hot, and cutting may be needed. Its treatment comes near to the quinsies' treatment: it is treated at first with smears of what he described, and is made tender by touching it with a feather — the finger, being without caution and gentleness, may be rough. The big one with little inflammation has the strong drugs used on it, and the inflamed suits what is of stronger cooling of what he described (the names of this kind left out) {cite:canon-ibn-sina-print-v2 p.297}"
  fr: "La luette et les deux amygdales : des catarrhes peuvent les atteindre et les gonfler jusqu’à barrer le souffle ; la luette peut aussi se relâcher sans tumeur, ce qui demande ce qui la dessèche et la resserre, parmi le froid et le chaud, et l’excision peut être nécessaire. Son traitement se rapproche de celui des angines : on la traite d’abord par des enduits de ce qu’il a décrit, et on la touche délicatement avec une plume — le doigt, étant sans précaution ni douceur, peut être rude. Sur la grosse luette peu enflammée on emploie les remèdes forts, et à celle qui est enflammée convient ce qui refroidit le plus fortement parmi ce qu’il a décrit (les noms de ce type sont omis) {cite:canon-ibn-sina-print-v2 p.297}"
  ur: "لہات اور لوزتین: انہیں نازلہ عارض ہو سکتے ہیں جو انہیں سوجا دیں یہاں تک کہ نفس روک دیں؛ اور لہات بغیر سوجن کے بھی ڈھیلی ہو سکتی ہے تو اسے سرد اور گرم میں سے خشک اور قابض کرنے والی چیز چاہیے اور کبھی اس کا کاٹنا درکار ہو؛ اس کا علاج خناق کے علاج کے قریب ہے: آغاز میں بیان کردہ لطوخوں سے علاج ہوتا ہے اور اسے تطواق سے چھو کر نرم کیا جاتا ہے کہ انگلی بے احتیاطی اور بے نرمی کے بعض اوقات سخت پڑے؛ بڑی اور کم التهاب والی پر مضبوط ادویہ استعمال ہوتے ہیں اور التهاب والی کو زیادہ ٹھنڈا کرنے والی بیان کردہ چیز موزوں ہے ⁦(اسی جنس کے نام مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.297}"
  es: "La úvula y las dos amígdalas: pueden sufrir catarros que las inflaman hasta dificultar la respiración; la úvula también puede relajarse sin tumor, necesitando lo que la seca y la astringe del frío y del calor, y puede ser necesario cortarla. Su tratamiento es similar al de las amigdalitis: se trata primero con ungüentos de lo que describió, y se ablanda tocándola con una pluma; el dedo, sin cuidado ni delicadeza, puede resultar áspero. A la más grande, con poca inflamación, se le aplican los medicamentos fuertes, y a la inflamada se le aplica lo que tiene un efecto refrescante más intenso de lo que describió (se omiten los nombres de este tipo) {cite:canon-ibn-sina-print-v2 p.297}"
