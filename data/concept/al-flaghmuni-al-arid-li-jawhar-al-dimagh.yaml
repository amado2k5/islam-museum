id: concept/al-flaghmuni-al-arid-li-jawhar-al-dimagh
class: concept
kind: scientific
label:
  ar: "الفلغموني العارض لنفس جوهر الدماغ"
  en: "Phlegmon (al-flaghmuni) of the substance of the brain"
  ur: "دماغ کے جوہر کو لاحق فلغمونی"
summary:
  ar: "يصف ابن سينا الفلغموني العارض لجوهر الدماغ: أكثره من دم عفن يورم الدماغ، وعلاماته من شدة الوجع واحمرار العينين والوجنتين والقيء والاستلقاء، ومآله، وأن علاجه علاج السرسام وأقوى {cite:canon-ibn-sina-print-v2 p.82} {cite:canon-ibn-sina-print-v2 p.83}"
  en: "Ibn Sina describes the phlegmon (al-flaghmuni) that comes upon the substance of the brain: it mostly comes from putrid blood that swells the brain; its signs are intense pain, redness of the eyes and cheeks, vomiting and lying on the back; its outcome; and that its treatment is that of sarsam and stronger {cite:canon-ibn-sina-print-v2 p.82} {cite:canon-ibn-sina-print-v2 p.83}"
  ur: "ابن سینا دماغ کے جوہر کو لاحق فلغمونی بیان کرتا ہے: زیادہ تر یہ بوسیدہ خون سے ہوتی ہے جو دماغ کو سوجا دیتا ہے؛ اس کی علامات شدید درد، آنکھوں اور رخساروں کی سرخی، قے اور چت لیٹنا ہیں؛ اس کا انجام؛ اور یہ کہ اس کا علاج سرسام کا علاج ہے اور اس سے قوی {cite:canon-ibn-sina-print-v2 p.82} {cite:canon-ibn-sina-print-v2 p.83}۔"
