label:
  ar: اختلاف الدار
  en: Ikhtilaf al-dar (difference of abodes in law)
summary:
  ar: اختلاف الدار اختلاف الدولتين اللتين ينتسب إليهما الشخصان؛ بين المسلمين لا أثر له لأن دار الإسلام واحدة، وبين الكفار يعدّه الحنفية من موانع التوارث إذا اختلفت الدار حكماً، والشافعية قريبون منهم، والحنابلة والمالكية لا يمنعون التوارث ما دامت الملل متفقة؛ ويؤثر في تبعية الولد ومسائل الفرقة بين الزوجين عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1953} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1954}.
  en: 'Ikhtilaf al-dar (difference of abodes): the difference of the two states of the two persons; between Muslims it has no effect, since the abode of Islam is one; among unbelievers the Hanafis count a difference of abode in ruling as a bar to inheritance, the Shafi''is are close to them, and the Malikis and Hanbalis do not bar inheritance while the religions agree; it affects the following of a child''s religion and separation of spouses in Hanafi law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1953} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1954}.'
