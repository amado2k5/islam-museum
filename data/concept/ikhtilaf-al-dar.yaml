id: concept/ikhtilaf-al-dar
class: concept
kind: legal
label:
  ar: اختلاف الدار
  en: Ikhtilaf al-dar (difference of abodes in law)
  es: "Ikhtilaf al-dar (diferencia de domicilios legales)"
  fr: "Ikhtilaf al-dar (différence de résidence en droit)"
summary:
  ar: اختلاف الدار اختلاف الدولتين اللتين ينتسب إليهما الشخصان؛ بين المسلمين لا أثر له لأن دار الإسلام واحدة، وبين الكفار يعدّه الحنفية من موانع التوارث إذا اختلفت الدار حكماً، والشافعية قريبون منهم، والحنابلة والمالكية لا يمنعون التوارث ما دامت الملل متفقة؛ ويؤثر في تبعية الولد ومسائل الفرقة بين الزوجين عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1953} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1954}. وتؤثر في الفرقة بين الزوجين والنفقة والوصية للحربي والقصاص والعقل وحد القذف عند الحنفية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1954} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1956} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1957}.
  en: 'Ikhtilaf al-dar (difference of abodes): the difference of the two states of the two persons; between Muslims it has no effect, since the abode of Islam is one; among unbelievers the Hanafis count a difference of abode in ruling as a bar to inheritance, the Shafi''is are close to them, and the Malikis and Hanbalis do not bar inheritance while the religions agree; it affects the following of a child''s religion and separation of spouses in Hanafi law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1953} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1954}. It also bears on separation of spouses, maintenance, bequests to a warrior, retaliation, blood-money and the hadd for slander, by the Hanafi, Shafi''i and Hanbali views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1954} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1956} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1957}.'
  es: "Ikhtilaf al-dar (diferencia de moradas): la diferencia de los dos estados de las dos personas; entre musulmanes no tiene efecto, ya que la morada del Islam es una; entre los no creyentes, los hanafíes consideran la diferencia de morada en la ley como un impedimento para la herencia, los shafiíes están cerca de ellos, y los malikíes y hanbalíes no impiden la herencia mientras las religiones estén de acuerdo; afecta al seguimiento de la religión de un niño y a la separación de los cónyuges en la ley hanafí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1953} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1954}. También se refiere a la separación de cónyuges, manutención, legados a un guerrero, represalias, dinero de sangre y el hadd por calumnia, según las opiniones Hanafi, Shafi'i y Hanbali. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1954} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1955} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1956} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1957}."
  fr: "Ikhtilaf al-dar (différence de résidence): la différence entre les deux états de résidence de deux personnes. Entre musulmans, elle est sans effet, car la résidence de l’Islam est unique. Chez les non-musulmans, les hanafites considèrent la différence de résidence comme un obstacle à l’héritage; les chaféites sont proches de cette position, tandis que les malikites et les hanbalites ne l’interdisent pas tant que les religions sont d’accord. En droit hanafite, elle influe sur la religion de l’enfant et la séparation des époux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1953} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1954}. Cela concerne également la séparation des époux, l'entretien, les legs à un guerrier, les représailles, le prix du sang et le hadd pour calomnie, selon les vues Hanafi, Shafi'i et Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1954} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1956} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1957}."
