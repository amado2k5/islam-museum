id: concept/ikhtilaf-al-dar
class: concept
kind: legal
label:
  ar: اختلاف الدار
  en: Ikhtilaf al-dar (difference of abodes in law)
summary:
  ar: اختلاف الدار اختلاف الدولتين اللتين ينتسب إليهما الشخصان؛ بين المسلمين لا أثر له لأن دار الإسلام واحدة، وبين الكفار يعدّه الحنفية من موانع التوارث إذا اختلفت الدار حكماً، والشافعية قريبون منهم، والحنابلة والمالكية لا يمنعون التوارث ما دامت الملل متفقة؛ ويؤثر في تبعية الولد ومسائل الفرقة بين الزوجين عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1953} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1954}. وتؤثر في الفرقة بين الزوجين والنفقة والوصية للحربي والقصاص والعقل وحد القذف عند الحنفية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1954} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1956} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1957}.
  en: 'Ikhtilaf al-dar (difference of abodes): the difference of the two states of the two persons; between Muslims it has no effect, since the abode of Islam is one; among unbelievers the Hanafis count a difference of abode in ruling as a bar to inheritance, the Shafi''is are close to them, and the Malikis and Hanbalis do not bar inheritance while the religions agree; it affects the following of a child''s religion and separation of spouses in Hanafi law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1952} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1953} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1954}. It also bears on separation of spouses, maintenance, bequests to a warrior, retaliation, blood-money and the hadd for slander, by the Hanafi, Shafi''i and Hanbali views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1954} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1955} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1956} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1957}.'
