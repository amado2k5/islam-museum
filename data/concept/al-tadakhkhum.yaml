summary:
  ar: "يرى قعدات أن التضخم المالي أو النقدي نتيجة اختلال بين المال والإنتاج، فكثرة النقود مع قلة الإنتاج الطبيعي ترفع الأسعار وتندر السلع، ثم يأتي إصدار الأوراق النقدية لمواجهة الأسعار {cite:qadan-manhaj-iqtisad-quran p. 86}. ويعد الاعتماد على الرواتب والوظائف سبباً في تقليل العملية الإنتاجية ومن ثم ارتفاع أسعار المواد الأساسية {cite:qadan-manhaj-iqtisad-quran p. 86}، ويقرر أن التضخم من أعراض الانحراف عن الخط الطبيعي في الإنتاج {cite:qadan-manhaj-iqtisad-quran p. 86}."
