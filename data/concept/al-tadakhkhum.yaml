label:
  ar: التضخم
  en: "Inflation (al-tadakhkhum)"
  es: "Inflación (al-tadakhkhum)"
  fr: "Inflation (al-tadakhkhum)"
  ur: "مہنگائی ⁦(التدخم)⁩"
  tr: "Enflasyon"
  id: "Inflasi"
summary:
  ar: "يرى قعدات أن التضخم المالي أو النقدي نتيجة اختلال بين المال والإنتاج، فكثرة النقود مع قلة الإنتاج الطبيعي ترفع الأسعار وتندر السلع، ثم يأتي إصدار الأوراق النقدية لمواجهة الأسعار {cite:qadan-manhaj-iqtisad-quran p. 86}. ويعد الاعتماد على الرواتب والوظائف سبباً في تقليل العملية الإنتاجية ومن ثم ارتفاع أسعار المواد الأساسية {cite:qadan-manhaj-iqtisad-quran p. 86}، ويقرر أن التضخم من أعراض الانحراف عن الخط الطبيعي في الإنتاج {cite:qadan-manhaj-iqtisad-quran p. 86}."
  tr: "Qaadat, finansal veya parasal enflasyonu para ile üretim arasındaki dengesizlik sonucu olarak görür. Paranın bolluğu ile sınırlı doğal üretim fiyatları ve kıt malları yükseltir. Sonra fiyatları dengelemek için banknotların çıkarılması gelir {cite:qadan-manhaj-iqtisad-kuran s. 86}. Maaş ve işlere güvenmek, üretim sürecinin azaltılmasının ve dolayısıyla temel malların fiyatlarının yükselmesinin bir nedenidir {cite:qadan-manhaj-iqtisad-kur'an s. 86} ve enflasyonun doğal üretim hattından sapmanın bir belirtisi olduğunu belirtir {cite:qadan-manhaj-iqtisad-kuran s. 86}."
  id: "Qaadat memandang inflasi keuangan atau moneter sebagai akibat dari ketidakseimbangan antara uang dan produksi. Dibatasi oleh kelimpahan uang, inflasi ini meningkatkan harga produksi alami dan barang langka. Kemudian muncul penerbitan uang kertas untuk menyeimbangkan harga {cite:qadan-manhaj-iqtisad-quran hlm. 86}. Mengandalkan upah dan pekerjaan adalah alasan penurunan proses produksi dan dengan demikian kenaikan harga barang pokok {cite:qadan-manhaj-iqtisad-qur'an hlm. 86} dan menyatakan bahwa inflasi adalah tanda penyimpangan dari jalur produksi alami {cite:qadan-manhaj-iqtisad-quran hlm. 86}."
