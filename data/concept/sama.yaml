id: concept/sama
class: concept
kind: legal
label:
  ar: "السَّماع"
  en: "Sama' (hearing) and its rulings"
summary:
  ar: "السماع في اللغة الإدراك بحاسة السمع، ويتصل به معاني الإجابة والفهم والقبول، ولا يخرج الاصطلاح عن هذه المعاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9812} وللفقهاء في السماع أحكام متفرقة: حضور الجماعة لمن سمع الأذان، وإسماع المصلي قراءته، وسماع خطبة الجمعة، وسجود التلاوة، وسماع الدعوى عند القاضي، والشهادة بالسماع، وسماع الغناء والقرآن والحديث، وسماع اللغو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9822}"
  en: "In the lexicon sama' means perceiving by the sense of hearing, and it carries the senses of answering, understanding and accepting; the technical sense does not depart from them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9812} The jurists treat hearing in several separate rulings: joining the congregation for one who hears the call to prayer, reading aloud in prayer, listening to the Friday sermon, the prostration of recitation, hearing a claim before a judge, testimony by hearing, listening to singing, the Qur'an, hadith and idle talk. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9822}"
