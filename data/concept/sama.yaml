label:
  ar: "السَّماع"
  en: "Sama' (hearing) and its rulings"
  es: "Sama' (audiencia) y sus resoluciones"
  fr: "Sama' (audience) et ses décisions"
  ur: "سماع اور اس کے احکام"
summary:
  ar: "السماع في اللغة الإدراك بحاسة السمع، ويتصل به معاني الإجابة والفهم والقبول، ولا يخرج الاصطلاح عن هذه المعاني. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9812} وللفقهاء في السماع أحكام متفرقة: حضور الجماعة لمن سمع الأذان، وإسماع المصلي قراءته، وسماع خطبة الجمعة، وسجود التلاوة، وسماع الدعوى عند القاضي، والشهادة بالسماع، وسماع الغناء والقرآن والحديث، وسماع اللغو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9822}"
  en: "In the lexicon sama' means perceiving by the sense of hearing, and it carries the senses of answering, understanding and accepting; the technical sense does not depart from them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9812} The jurists treat hearing in several separate rulings: joining the congregation for one who hears the call to prayer, reading aloud in prayer, listening to the Friday sermon, the prostration of recitation, hearing a claim before a judge, testimony by hearing, listening to singing, the Qur'an, hadith and idle talk. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9822}"
  es: "En el léxico, sama' significa percibir por el sentido del oído, y conlleva los sentidos de responder, comprender y aceptar; el sentido técnico no se aparta de ellos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9812} Los juristas tratan el oído en varias normas separadas: unirse a la congregación para quien oye la llamada a la oración, leer en voz alta en la oración, escuchar el sermón del viernes, la postración de la recitación, escuchar una reclamación ante un juez, el testimonio por oír, escuchar cantos, el Corán, hadices y conversaciones ociosas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9822}"
  fr: "Dans le lexique, « sama' » signifie percevoir par l'ouïe et englobe les notions de réponse, de compréhension et d'acceptation; le sens technique reste le même. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9812} Les juristes traitent de l'ouïe dans plusieurs décisions distinctes: l'adhésion à la prière en congrégation pour celui qui entend l'appel à la prière, la lecture à voix haute pendant la prière, l'écoute du sermon du vendredi, la prosternation lors de la récitation, l'audition d'une plainte devant un juge, le témoignage oral, l'écoute de chants, du Coran, des hadiths et des conversations informelles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9822}"
  ur: "لغت میں سماع کا مطلب سماعت کے احساس سے محسوس کرنا ہے، اور یہ جواب دینے، سمجھنے اور قبول کرنے کے حواس رکھتا ہے۔ تکنیکی احساس ان سے دور نہیں ہوتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص 9812} فقہاء سماع کو کئی الگ الگ احکام میں بیان کرتے ہیں: اذان سننے والے کے لیے جماعت میں شامل ہونا، نماز میں بلند آواز سے پڑھنا، جمعہ کا خطبہ سننا، سجدہ تلاوت کرنا، قاضی کے سامنے دعویٰ سننا، قرآن کی گواہی سننا، قرآن مجید کی گواہی اور گواہی دینا۔ بیکار بات. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9813}"
