id: concept/la-darar
class: concept
kind: legal
label:
  ar: قاعدة لا ضرر ولا ضرار
  en: The no-harm maxim
summary:
  ar: "قاعدة «لا ضرر ولا ضرار» من أصول الفقه الكبرى مأخوذة من حديث أبي سعيد الخدري — الحديث الثاني والثلاثون من الأربعين — وفي لفظ طريق الدراوردي عند الدارقطني والحاكم والبيهقي «من ضار ضره الله ومن شاق شق الله عليه»؛ رواه مالك في الموطأ مرسلاً ولم يختلف عنه في إرساله عند ابن عبد البر وقال لا يسند من وجه صحيح، وقال خالد بن سعد الأندلسي لم يصح مسنداً، وصحح الحاكم إسناد الطريق المروية على شرط مسلم، وله طرق يقوى بعضها ببعض كما قال النووي؛ ومعناها نفي الضرر ابتداءً ومجازاةً: فلا يضر الإنسان نفسه ولا غيره ابتداء، ولا يجازى على ضرر بضرر مثله إلا بالقصاص الشرعي، وتستعمل القاعدة في إسقاط المشقة عن التكاليف ودرء المفاسد (جامع العلوم والحكم ص 667–668)."
  en: "The maxim 'no harm and no reciprocating harm' is among the great foundations of jurisprudence, taken from Abu Sa'id al-Khudri's hadith — the thirty-second of the Forty — which al-Darawardi's route in al-Daraqutni, al-Hakim and al-Bayhaqi extends as 'whoever harms, God harms him, and whoever makes things difficult, God makes things difficult for him'; Malik transmitted it mursal in the Muwatta' with no divergence reported by Ibn Abd al-Barr, who found no sound full chain for it, Khalid ibn Sa'd al-Andalusi declaring it never established with one, while al-Hakim graded its reported chain sahih on Muslim's condition and al-Nawawi notes it has routes that strengthen one another; its meaning negates harm both initiatory and retaliatory — one may not harm oneself or another, nor answer harm with harm save through lawful retribution — and the maxim serves to lift hardship from legal impositions and to ward off corruption (Jami' al-Ulum wal-Hikam pp. 667–668)."
