id: concept/la-darar
class: concept
kind: legal
label:
  ar: قاعدة لا ضرر ولا ضرار
  en: The no-harm maxim
  es: "La máxima de no causar daño"
  fr: "La maxime de non-nuisance"
  ur: "کوئی نقصان نہیں پہنچانے والا میکسم"
  tr: "Zarar vermeme ve karşılık vermeme kuralı"
  id: "Aturan tidak boleh menyakiti dan tidak membalas"
summary:
  ar: "قاعدة «لا ضرر ولا ضرار» من أصول الفقه الكبرى مأخوذة من حديث أبي سعيد الخدري — الحديث الثاني والثلاثون من الأربعين — وفي لفظ طريق الدراوردي عند الدارقطني والحاكم والبيهقي «من ضار ضره الله ومن شاق شق الله عليه»؛ رواه مالك في الموطأ مرسلاً ولم يختلف عنه في إرساله عند ابن عبد البر وقال لا يسند من وجه صحيح، وقال خالد بن سعد الأندلسي لم يصح مسنداً، وصحح الحاكم إسناد الطريق المروية على شرط مسلم، وله طرق يقوى بعضها ببعض كما قال النووي؛ ومعناها نفي الضرر ابتداءً ومجازاةً: فلا يضر الإنسان نفسه ولا غيره ابتداء، ولا يجازى على ضرر بضرر مثله إلا بالقصاص الشرعي، وتستعمل القاعدة في إسقاط المشقة عن التكاليف ودرء المفاسد ⁦(جامع العلوم والحكم ص 667–668)⁩."
  en: "The maxim 'no harm and no reciprocating harm' is among the great foundations of jurisprudence, taken from Abu Sa'id al-Khudri's hadith — the thirty-second of the Forty — which al-Darawardi's route in al-Daraqutni, al-Hakim and al-Bayhaqi extends as 'whoever harms, God harms him, and whoever makes things difficult, God makes things difficult for him'; Malik transmitted it mursal in the Muwatta' with no divergence reported by Ibn Abd al-Barr, who found no sound full chain for it, Khalid ibn Sa'd al-Andalusi declaring it never established with one, while al-Hakim graded its reported chain sahih on Muslim's condition and al-Nawawi notes it has routes that strengthen one another; its meaning negates harm both initiatory and retaliatory — one may not harm oneself or another, nor answer harm with harm save through lawful retribution — and the maxim serves to lift hardship from legal impositions and to ward off corruption (Jami' al-Ulum wal-Hikam pp. 667–668)."
  es: "La máxima 'no hacer daño y no devolver daño' se encuentra entre los grandes fundamentos de la jurisprudencia, tomada del hadiz de Abu Sa'id al-Khudri —el trigésimo segundo de los Cuarenta— que la ruta de al-Darawardi en al-Daraqutni, al-Hakim y al-Bayhaqi extiende como 'quien hace daño, Dios le hace daño, y quien hace las cosas difíciles, Dios le hace las cosas difíciles'; Malik la transmitió mursal en el Muwatta' sin divergencia reportada por Ibn Abd al-Barr, quien no encontró una cadena completa sólida para ella, Khalid ibn Sa'd al-Andalusi declarando que nunca se estableció con una, mientras que al-Hakim calificó su cadena reportada como sahih en la condición de Muslim y al-Nawawi señala que tiene rutas que se refuerzan unas a otras; Su significado niega el daño tanto iniciador como retaliatorio: uno no puede dañarse a sí mismo ni a otro, ni responder al daño con daño salvo mediante una retribución legal; y la máxima sirve para aliviar las dificultades derivadas de las imposiciones legales y para evitar la corrupción (Jami' al-Ulum wal-Hikam, págs. 667-668)."
  fr: "La maxime « ni mal ni mal en retour » figure parmi les grands fondements de la jurisprudence, tirée du hadith d'Abu Sa'id al-Khudri — le trente-deuxième des Quarante — que la voie d'al-Darawardi dans al-Daraqutni, al-Hakim et al-Bayhaqi étend comme suit: « Quiconque nuit, Dieu lui nuit, et quiconque rend les choses difficiles, Dieu lui rend les choses difficiles »; Malik l'a transmis mursal dans le Muwatta' sans divergence rapportée par Ibn Abd al-Barr, qui n'a trouvé aucune chaîne complète et saine pour cela, Khalid ibn Sa'd al-Andalusi déclarant qu'elle n'a jamais été établie avec une seule chaîne, tandis qu'al-Hakim a classé sa chaîne rapportée comme sahih selon les conditions de Muslim et al-Nawawi note qu'elle a des voies qui se renforcent mutuellement; sa signification nie le préjudice tant initiatique que de représailles — on ne peut se nuire à soi-même ni à autrui, ni répondre au préjudice par le préjudice, sauf par une rétribution légitime — et la maxime sert à alléger les difficultés liées aux impositions légales et à prévenir la corruption (Jami' al-Ulum wal-Hikam pp. 667–668)."
  ur: "’’کوئی نقصان نہیں اور نہ ہی کوئی بدلہ دینے والا نقصان‘‘ فقہ کی عظیم بنیادوں میں سے ہے، جسے ابو سعید خدری کی حدیث - چالیس میں سے بتیسویں - سے لیا گیا ہے، جسے الدارقطنی، الحکیم اور البیحقی میں الدراوردی کا راستہ بتاتا ہے کہ جس چیز کو نقصان پہنچاتا ہے، اللہ تعالیٰ جس چیز کو نقصان پہنچاتا ہے، اس کو نقصان پہنچاتا ہے، اور اللہ تعالیٰ اسے کسی چیز کو نقصان پہنچاتا ہے۔ اس کے لیے مشکل'؛ مالک نے اسے مرسل موطا میں بغیر کسی اختلاف کے ابن عبد البر سے روایت کیا ہے، جس میں اس کی کوئی صحیح سند نہیں ملی، خالد بن سعد الاندلسی نے اعلان کیا کہ یہ کبھی ایک کے ساتھ قائم نہیں ہوئی، جبکہ الحاکم نے اس کی روایت کی سند کو مسلم کی حالت پر صحیح قرار دیا ہے اور نووی نے نوٹ کیا ہے کہ اس کا ایک اور راستہ مضبوط ہے۔ اس کے معنی ابتدائی اور انتقامی دونوں طرح کے نقصان کی نفی کرتے ہیں - کوئی اپنے آپ کو یا کسی دوسرے کو نقصان نہیں پہنچا سکتا، اور نہ ہی نقصان کا جواب نقصان سے دے سکتا ہے سوائے قانونی انتقام کے - اور میکسم قانونی پابندیوں سے مشکلات کو دور کرنے اور بدعنوانی کو روکنے کے لیے کام کرتا ہے ⁦(جامع العلوم والحکم صفحہ 667-668)⁩۔"
  tr: "'Ne zarar ne de karşılıklı zarar verme' ilkesi, Ebu Said el-Hudri'nin hadisinden alınan ve derevendi yolu ifadesinden alınan temel hukuk ilkelerinden türetilmiştir; bu ilkeler kırk günün otuz ikinci hadisi olan Ebu Said el-Hudri'den alınmıştır ve Derevreddi yolunun el-Daraqutni, el-Hakim ve el-Bayhaki'ye göre metin ifadesinden türetilmiştir: 'Kim ona zarar verirse, Allah ona zarar verir, kim sert olursa Allah ona zorlaştırır.' Malik, bunu Muvatta'da mursal olarak anlatmıştır ve İbn Abdülbarr'dan aktarımı konusunda herhangi bir anlaşmazlık yoktur; İbn Abdülberr bunun gerçek bir zincir olmadığını söylemiştir ed. Halid bin Sa'd el-Endülüs, zincirin gerçek olmadığını söylemiş, el-Hakim ise aktarım zincirini Müslüman'ın şartına göre doğrulamıştır ve zincirlerin bazılarını güçlendiren zincirler vardır; yani zararın baştan reddi ve karşılıklılık: baştan zarar verilmemeli veya başkaları baştan zarar görmemeli, zarar ise yasal ceza dışında aynı şekilde ödüllendirilmez. Bu ilke, yükümlülüklerden zorlukları hafifletmek ve zararları önlemek için kullanılır (Jami' al-'Ulum wa al-Hikam, s. 667–668)."
  id: "Prinsip 'tidak membahayakan atau membalas kerugian' berasal dari prinsip utama fiqh, yang diambil dari hadis Abu Sa'id al-Khudri—hadis ketiga puluh dua selama empat puluh hari—dan dalam redaksi jalur Darawardi menurut al-Daraqutni, al-Hakim, dan al-Bayhaqi: 'Siapa pun yang menyakitinya, Allah akan menyakitinya, dan siapa pun yang keras, Allah akan menyulitkannya.' Malik menceritakannya dalam Muwatta sebagai mursal, dan tidak ada perbedaan pendapat mengenai transmisinya dari Ibn Abd al-Barr, yang mengatakan bahwa itu tidak terikat secara otentik. Khalid ibn Sa'd al-Andalusi mengatakan bahwa rantai tersebut tidak otentik, dan al-Hakim mengautentikasi rantai transmisi sesuai dengan kondisi Muslim, dan memiliki rantai yang memperkuat beberapa di antaranya seperti yang dikatakan al-Nawawi; artinya penolakan kerugian sejak awal dan timbal balik: tidak ada kerugian yang boleh dirugikan sejak awal atau dari yang lain sejak awal, dan kerugian tidak diberi imbalan atas kerugian seperti itu kecuali dengan pembalasan hukum. Prinsip ini digunakan untuk meringankan kesulitan dari kewajiban dan mengusir kerugian (Jami' al-'Ulum wa al-Hikam, hlm. 667–668)."
