label: { ar: "النَّبَهْرَجَة ⁦(الدراهم المغشوشة)⁩", en: "Debased coin (nabahraja)", ur: "نبہرجہ ⁦(کھوٹا درہم)⁩", es: "Moneda degradada (nabahraja)", fr: "Pièce de monnaie dévaluée (nabahraja)", tr: "Al-Nabhajja (sahte dirhem)", id: "Al-Nabhajja (dirham palsu)" }
summary:
  ar: "النبهرجة في اصطلاح الحنفية الدرهم الزيف الرديء، أو ما يرده التجار من الدراهم، أو ما ضرب في غير دار السلطان، وهي من الدراهم المغشوشة. وإن كان الغالب فيها الفضة فهي كالدراهم الخالصة يجوز التعامل بها، وتجب فيها الزكاة عند بعض الفقهاء، وإن غلب الغش فينظر: فإن كانت رائجة أو منوية للتجارة اعتبرت قيمتها، وإلا فلا زكاة إلا أن يبلغ ما فيها من الفضة نصاب الفضة. ولا يجوز بيع الجيد بالرديء ولا بيع النبهرجة إلا مثلاً بمثل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15457}"
  en: "In the usage of the Hanafis, nabahraja is a worthless or counterfeit dirham, or one that traders reject, or one struck outside the ruler's mint. If silver predominates it is treated as pure coin, and dealing in it is allowed even when its alloy is unknown; some jurists require zakat on it. If the alloy predominates, its value is assessed if it circulates or is held for trade, and zakat is due if that value reaches the nisab; otherwise, and unless its silver alone reaches the silver nisab, no zakat is due. Good coin may not be exchanged for it except equal for equal. The entry refers the detail to the entry on counterfeit coin (zuyuf). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15457}"
  ur: "نبہرجہ وہ کھوٹا یا غیر معیاری درہم ہے جسے تاجر رد کر دیں، یا جو سرکاری ٹکسال کے علاوہ کہیں ڈھالا گیا ہو۔ جس میں چاندی غالب ہو وہ خالص درہم کی طرح ہے۔ جید اور نبہرجہ کا تبادلہ برابر برابر ہی جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15457}"
  es: "En la tradición hanafí, nabahraja es un dirham sin valor o falsificado, rechazado por los comerciantes o acuñado fuera de la ceca del gobernante. Si predomina la plata, se considera moneda pura y se permite su comercio incluso si se desconoce su aleación; algunos juristas exigen el zakat sobre ella. Si predomina la aleación, se evalúa su valor si circula o se mantiene para el comercio, y se debe pagar zakat si dicho valor alcanza el nisab; de lo contrario, y a menos que solo su plata alcance el nisab de plata, no se debe pagar zakat. No se puede intercambiar por moneda buena, salvo en un intercambio equivalente. La entrada remite al detalle a la entrada sobre moneda falsificada (zuyuf). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15457}"
  fr: "Selon l'usage des Hanafites, le nabahraja désigne un dirham sans valeur ou contrefait, un dirham refusé par les commerçants ou frappé hors de l'atelier monétaire du souverain. Si l'argent prédomine, il est considéré comme une pièce pure et son commerce est autorisé même si sa composition en alliage est inconnue; certains juristes exigent la zakat. Si l'alliage prédomine, sa valeur est évaluée si la pièce circule ou est détenue en vue d'un échange, et la zakat est due si cette valeur atteint le nisab; sinon, et à moins que sa teneur en argent seul n'atteigne le nisab d'argent, aucune zakat n'est due. Une pièce de monnaie authentique ne peut être échangée contre un nabahraja, sauf à valeur égale. L'article renvoie à la section relative à la fausse monnaie (zuyuf). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15457}"
  tr: "Hanefi terminolojisinde dirhem, kötü kaliteli bir dirhem, tüccarların dirhem olarak geri verdiği ya da Sultan'ın evinin dışında satılan dirhemdir. Sahte dirhem olarak kabul edilir. Eğer çoğunlukla gümüşse, saf dirhem gibi işlem yapılabilir ve bazı hukukçulara göre zekat zorunludur. Eğer sahtekarlık yaygınsa, değeri kabul edilir; aksi takdirde, içindeki gümüş gümüş nisabına ulaşmadıkça zekat olmaz. İyiyi kötü karşıya satmak veya el-Nebahraca satmak sadece örneğin izin verilir. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.15456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15457}"
  id: "Dalam istilah Hanafi, dirham adalah dirham berkualitas rendah, atau apa yang dikembalikan pedagang dalam dirham, atau yang dijual di luar rumah Sultan. Dirham dianggap sebagai dirham palsu. Jika sebagian besar perak, maka bisa diuruskan seperti dirham murni, dan zakat wajib menurut beberapa ahli hukum. Jika penipuan merajalela, maka dipertimbangkan: jika itu umum atau dimaksudkan untuk perdagangan, nilainya dipertimbangkan; jika tidak, tidak ada zakat kecuali perak di dalamnya mencapai nisab perak. Tidak diperbolehkan menjual barang dengan buruk atau menjual al-nabahraja kecuali misalnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15457}"
