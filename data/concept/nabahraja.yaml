label: { ar: "النَّبَهْرَجَة (الدراهم المغشوشة)", en: "Debased coin (nabahraja)", ur: "نبہرجہ (کھوٹا درہم)" }
summary:
  ar: "النبهرجة في اصطلاح الحنفية الدرهم الزيف الرديء، أو ما يرده التجار من الدراهم، أو ما ضرب في غير دار السلطان، وهي من الدراهم المغشوشة. وإن كان الغالب فيها الفضة فهي كالدراهم الخالصة يجوز التعامل بها، وتجب فيها الزكاة عند بعض الفقهاء، وإن غلب الغش فينظر: فإن كانت رائجة أو منوية للتجارة اعتبرت قيمتها، وإلا فلا زكاة إلا أن يبلغ ما فيها من الفضة نصاب الفضة. ولا يجوز بيع الجيد بالرديء ولا بيع النبهرجة إلا مثلاً بمثل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15457}"
  en: "In the usage of the Hanafis, nabahraja is a worthless or counterfeit dirham, or one that traders reject, or one struck outside the ruler's mint. If silver predominates it is treated as pure coin, and dealing in it is allowed even when its alloy is unknown; some jurists require zakat on it. If the alloy predominates, its value is assessed if it circulates or is held for trade, and zakat is due if that value reaches the nisab; otherwise, and unless its silver alone reaches the silver nisab, no zakat is due. Good coin may not be exchanged for it except equal for equal. The entry refers the detail to the entry on counterfeit coin (zuyuf). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15457}"
  ur: "نبہرجہ وہ کھوٹا یا غیر معیاری درہم ہے جسے تاجر رد کر دیں، یا جو سرکاری ٹکسال کے علاوہ کہیں ڈھالا گیا ہو۔ جس میں چاندی غالب ہو وہ خالص درہم کی طرح ہے۔ جید اور نبہرجہ کا تبادلہ برابر برابر ہی جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15456} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15457}"
