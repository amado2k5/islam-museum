label:
  ar: "الأسارون"
  en: "Asarun (asarum, a herb brought from China)"
  fr: "Asarun (asaret, herbe apportée de Chine)"
  ur: "اسارون"
  es: "Asarun (asarum, una hierba traída de China)"
  tr: "esirler"
  id: "tawanan"
summary:
  ar: "الأسارون في الكتاب حشيشة يؤتى بها من بلاد الصين، ذات بزور كثيرة وأصول كبيرة معقّدة، وأصولها أنفع ما فيها وقوّتها قوة الوجّ وهو أقوى؛ حارّ يابس في الثالثة، يفتح ويسكّن الأوجاع الباطنة ويلطّف ويحلّل ويسخّن الأعضاء الباردة؛ ينفع من عرق النسا ووجع الوركين المتقادم وغلظ القرنية وسدد الكبد وصلابتها واليرقان والاستسقاء وصلابة الطحال، ويقوّي المثانة والكلية ويسهّل؛ ويذكر الكتاب فيه قولين في فقرة موسومة معلّقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.350}"
  en: "In the book asarun is a herb brought from the land of China, with many seeds and large knotted roots, its roots the most useful part and its strength that of wajj, which is stronger; hot and dry in the third degree, it opens, soothes inner pains, refines, resolves and warms cold organs; it is listed for sciatica and old pain of the hips, thickening of the cornea, obstruction and hardness of the liver, jaundice, dropsy and hardness of the spleen, and it strengthens the bladder and kidney and purges; the book also gives two statements in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.350}"
  fr: "Dans le livre, asarun est une herbe apportée du pays de Chine, aux nombreuses graines et aux grandes racines noueuses, qui en sont la partie la plus utile ; sa puissance est celle du wajj, plus puissant ; chaud et sec au troisième degré, il ouvre, apaise les douleurs internes, subtilise, résout et réchauffe les organes froids ; il est cité pour la sciatique et les douleurs anciennes des hanches, l’épaississement de la cornée, l’obstruction et l’induration du foie, la jaunisse, l’hydropisie et l’induration de la rate ; il fortifie la vessie et le rein et purge ; le livre donne aussi deux affirmations dans une section signalée, en attente de la décision du fondateur {cite:canon-ibn-sina-print-v1 p.350}"
  ur: "اسارون کتاب میں ایک بوٹی ہے جو چین کے ملک سے لائی جاتی ہے، بہت سے بیجوں اور بڑی گرہ دار جڑوں والی، اس کی جڑیں اس کا سب سے مفید حصہ ہیں اور اس کی قوت وج کی قوت ہے جو اس سے زیادہ قوی ہے؛ تیسرے درجے میں گرم خشک ہے، کھولتا ہے، اندرونی دردوں کو تسکین دیتا ہے، لطیف کرتا اور تحلیل کرتا ہے اور سرد اعضاء کو گرم کرتا ہے؛ عرق النسا، کولھوں کے پرانے درد، قرنیہ کی موٹائی، جگر کی رکاوٹ اور سختی، یرقان، استسقاء اور تلی کی سختی میں مذکور ہے، مثانے اور گردے کو قوت دیتا اور دست لاتا ہے؛ کتاب اس کے بارے میں دو باتیں موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 p.350}۔"
  es: "En el libro, asarun es una hierba traída de China, con muchas semillas y grandes raíces nudosas; sus raíces son la parte más útil y su potencia es la de wajj, que es más fuerte; caliente y seca en tercer grado, abre, alivia dolores internos, refina, resuelve y calienta órganos fríos; se menciona para la ciática y el dolor crónico de cadera, el engrosamiento de la córnea, la obstrucción y el endurecimiento del hígado, la ictericia, la hidropesía y el endurecimiento del bazo, y fortalece la vejiga y los riñones y purga; el libro también da dos afirmaciones en una sección etiquetada reservada para la decisión del fundador {cite:canon-ibn-sina-print-v1 p.350}"
  tr: "Kitaptaki esaretler, Çin'den getirilmiş, çok sayıda tohumlu ve büyük karmaşık kökenli otlardır. Kökenleri en faydalı olanıdır ve gücü yüzün gücüdür; üçüncüsü sıcak ve kurudur, iç ağrıları açar ve yatıştırır, soğuk organları yatıştırır, analiz eder ve ısıtır; siyatik, yaşlı kalça ağrısı, kornea kalınlaşması, karaciğer tıkanıklığı ve sertliği, sarılık, asit, dalak sertliği, mesane ve böbrekleri güçlendirir ve hafifletir; kitap, Kurucu'nun Askıya Alınmış Yönetimi başlıklı bir paragrafta iki görüşten bahseder {cite:canon-ibn-sina-print-v1 s.350}"
  id: "Tawanan dalam buku ini adalah herbal yang dibawa dari Tiongkok, dengan banyak biji dan asal-usul kompleks yang besar. Asal-usulnya adalah yang paling bermanfaat, dan kekuatannya adalah kekuatan wajah, yang lebih kuat; panas dan kering pada yang ketiga, membuka dan menenangkan nyeri internal, menenangkan, menganalisis, dan menghangatkan organ dingin; ini bermanfaat bagi sciatica, nyeri pinggul yang sudah tua, penebalan kornea, penyumbatan dan kekerasan hati, kuning, ascites, kekerasan limpa, memperkuat kandung kemih dan ginjal, serta meringankan; buku ini menyebutkan dua pendapat dalam paragraf berjudul Suspended Rule of the Founder {cite:canon-ibn-sina-print-v1 hlm.350}"
