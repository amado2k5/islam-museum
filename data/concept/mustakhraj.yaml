id: concept/mustakhraj
class: concept
kind: term
label:
  ar: "المستخرج ⁦(الكتب المخرّجة على الصحيح)⁩"
  en: "Mustakhraj (books 'extracted' on a Sahih)"
  ur: "مستخرج (صحیح پر مخرّجہ کتابیں)"
summary:
  ar: "كتب صنّفها حفاظ تأخروا عن صاحب الصحيح وأدركوا أسانيد عالية، فخرّجوا أحاديث كتابه بأسانيدهم هم؛ ويقول ابن الصلاح، كما ينقل النووي، إنها تلتحق بالصحيح في أن لها سمة الصحيح دون خصائصه كلها، وفائدتها علو الإسناد وزيادة قوة الحديث بكثرة طرقه وزيادة ألفاظ صحيحة، ومنها على صحيح مسلم مستخرجات أبي عوانة الإسفراييني وأبي نعيم الأصبهاني والجوزقي وغيرهم {cite:sharh-nawawi-misriyya-1347-v1 p. 26-27}."
  en: "Books by later hadith masters who, having reached high chains, re-transmitted the hadiths of a Sahih through their own chains; Ibn al-Salah, as al-Nawawi quotes him, says they share the Sahih's character though not all its distinctions, and that they yield higher chains, stronger hadiths through more routes, and additional sound wording; among those on Sahih Muslim are the works of Abu 'Awana al-Isfara'ini, Abu Nu'aym al-Isfahani, al-Jawzaqi and others {cite:sharh-nawawi-misriyya-1347-v1 p. 26-27}."
  ur: "وہ کتابیں جو صاحبِ صحیح کے بعد آنے والے ایسے حفاظ نے لکھیں جنہیں عالی اسانید ملیں، چنانچہ انہوں نے اس کی احادیث اپنی اسانید سے روایت کیں؛ ابن الصلاح، جیسا کہ نووی نقل کرتے ہیں، کہتے ہیں کہ یہ صحیح کی سِمت میں شریک ہیں مگر اس کی تمام خصوصیات میں نہیں، اور ان کا فائدہ علوِ سند، کثرتِ طرق سے حدیث کی قوت میں اضافہ اور صحیح الفاظ کا اضافہ ہے؛ صحیح مسلم پر ان میں ابو عوانہ اسفرائینی، ابو نعیم اصبہانی، جوزقی وغیرہ کی کتابیں ہیں {cite:sharh-nawawi-misriyya-1347-v1 p. 26-27}۔"
