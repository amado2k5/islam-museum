id: concept/mustakhraj
class: concept
kind: term
label:
  ar: "المستخرج ⁦(الكتب المخرّجة على الصحيح)⁩"
  en: "Mustakhraj (books 'extracted' on a Sahih)"
  ur: "مستخرج ⁦(صحیح پر مخرّجہ کتابیں)⁩"
  es: "Mustakhraj (libros 'extraídos' de un Sahih)"
  fr: "Mustakhraj (livres « extraits » d'un Sahih)"
  tr: "Al-Mustakhraj (özgünlüğe göre türetilen kitaplar)"
  id: "Al-Mustakhraj (buku yang diturunkan berdasarkan keaslian)"
summary:
  ar: "كتب صنّفها حفاظ تأخروا عن صاحب الصحيح وأدركوا أسانيد عالية، فخرّجوا أحاديث كتابه بأسانيدهم هم؛ ويقول ابن الصلاح، كما ينقل النووي، إنها تلتحق بالصحيح في أن لها سمة الصحيح دون خصائصه كلها، وفائدتها علو الإسناد وزيادة قوة الحديث بكثرة طرقه وزيادة ألفاظ صحيحة، ومنها على صحيح مسلم مستخرجات أبي عوانة الإسفراييني وأبي نعيم الأصبهاني والجوزقي وغيرهم {cite:sharh-nawawi-misriyya-1347-v1 p. 26-27}."
  en: "Books by later hadith masters who, having reached high chains, re-transmitted the hadiths of a Sahih through their own chains; Ibn al-Salah, as al-Nawawi quotes him, says they share the Sahih's character though not all its distinctions, and that they yield higher chains, stronger hadiths through more routes, and additional sound wording; among those on Sahih Muslim are the works of Abu 'Awana al-Isfara'ini, Abu Nu'aym al-Isfahani, al-Jawzaqi and others {cite:sharh-nawawi-misriyya-1347-v1 p. 26-27}."
  ur: "وہ کتابیں جو صاحبِ صحیح کے بعد آنے والے ایسے حفاظ نے لکھیں جنہیں عالی اسانید ملیں، چنانچہ انہوں نے اس کی احادیث اپنی اسانید سے روایت کیں؛ ابن الصلاح، جیسا کہ نووی نقل کرتے ہیں، کہتے ہیں کہ یہ صحیح کی سِمت میں شریک ہیں مگر اس کی تمام خصوصیات میں نہیں، اور ان کا فائدہ علوِ سند، کثرتِ طرق سے حدیث کی قوت میں اضافہ اور صحیح الفاظ کا اضافہ ہے؛ صحیح مسلم پر ان میں ابو عوانہ اسفرائینی، ابو نعیم اصبہانی، جوزقی وغیرہ کی کتابیں ہیں {cite:sharh-nawawi-misriyya-1347-v1 p. 26-27}۔"
  es: "Libros de maestros de hadices posteriores que, habiendo alcanzado cadenas altas, retransmitieron los hadices de un Sahih a través de sus propias cadenas; Ibn al-Salah, como lo cita al-Nawawi, dice que comparten el carácter del Sahih aunque no todas sus distinciones, y que producen cadenas más altas, hadices más fuertes a través de más rutas y una redacción sólida adicional; entre los que se encuentran en Sahih Muslim están las obras de Abu 'Awana al-Isfara'ini, Abu Nu'aym al-Isfahani, al-Jawzaqi y otros {cite:sharh-nawawi-misriyya-1347-v1 p. 26-27}."
  fr: "Les ouvrages d'auteurs plus récents, maîtres du hadith ayant atteint des chaînes de transmission élevées, ont retransmis les hadiths d'un Sahih à travers leurs propres chaînes. Ibn al-Salah, cité par al-Nawawi, affirme qu'ils partagent le caractère du Sahih, bien que non toutes ses distinctions, et qu'ils produisent des chaînes plus élevées, des hadiths plus forts par davantage de voies, et une formulation plus précise. Parmi ceux qui traitent du Sahih Muslim figurent les œuvres d'Abu 'Awana al-Isfara'ini, d'Abu Nu'aym al-Isfahani, d'al-Jawzaqi et d'autres {cite:sharh-nawawi-misriyya-1347-v1 p. 26-27}."
  tr: "Sahih'ten sonra gelen ezberciler tarafından yazılmış ve yüksek aktarım zincirlerine sahip olan kitaplar, bu yüzden kendi zincirleriyle onun kitabındaki hadisleri üretmişlerdir. El-Nevavi'nin anlattığı İbn el-Salah, bunların Sahih ile bağlantılı olduğunu, çünkü tüm özellikleri olmadan Sahih'in özelliklerine sahip olduğunu söyler. Faydası, yüksek aktarım zinciri, hadisin birçok zinciriyle güçlenmesi ve özgün ifadelerin eklenmesidir. Bunlar arasında Ebu Avina el-İsfarayini, Ebu Nu'aym el-İsfahani, Cevzaci ve diğerlerinin Sahih Müslüm'den alıntıları bulunur {cite:sharh-nawawi-misriyya-1347-v1, s. 26-27}."
  id: "Kitab-kitab yang ditulis oleh para penghafal yang datang lebih lambat dari Sahih dan memiliki rantai transmisi yang tinggi, sehingga mereka menghasilkan hadits dari bukunya dengan rantai mereka sendiri. Ibn al-Salah, seperti yang diceritakan oleh al-Nawawi, mengatakan bahwa hadits tersebut terkait dengan Sahih karena memiliki ciri khas Sahih tanpa semua karakteristiknya. Keuntungannya adalah rantai transmisi yang tinggi, kekuatan hadits yang meningkat dengan banyak rantai, dan penambahan ungkapan otentik. Di antaranya adalah kutipan dari Sahih Muslim oleh Abu Awana al-Isfarayini, Abu Nu'aym al-Isfahani, al-Jawzaqi, dan lainnya {cite:sharh-nawawi-misriyya-1347-v1, hlm. 26-27}."
