id: concept/alamat-al-subat-min-al-dam
class: concept
kind: scientific
label:
  ar: "علامات السبات من الدم"
  en: "Signs of coma from blood"
  fr: "Signes du coma dû au sang"
  ur: "خون سے غنودگی کی علامات"
  es: "Signos de coma por sangrado"
  tr: "Kan kış uykusu belirtileri"
  id: "Gejala hibernasi"
summary:
  ar: "يذكر ابن سينا علامات السبات الكائن عن الدم، من انتفاخ الأوداج وحمرة العينين والوجنتين واللسان، وما يظهر إذا اجتمع الدم أو البلغم اجتماع الأورام {cite:canon-ibn-sina-print-v2 p.92}"
  en: "Ibn Sina gives the signs of coma from blood: swelling of the jugular veins, redness of the eyes, cheeks and tongue, and what is seen when blood or phlegm gathers as swellings gather {cite:canon-ibn-sina-print-v2 p.92}"
  fr: "Ibn Sina donne les signes du coma dû au sang : le gonflement des jugulaires, la rougeur des yeux, des joues et de la langue, et les manifestations observées lorsque le sang ou le flegme s’amassent à la manière des gonflements {cite:canon-ibn-sina-print-v2 p.92}."
  ur: "ابن سینا خون سے ہونے والی غنودگی کی علامات بتاتا ہے: گردن کی رگوں کا پھولنا، آنکھوں، گالوں اور زبان کی سرخی، اور جو ظاہر ہوتا ہے جب خون یا بلغم سوجنوں کی طرح جمع ہو {cite:canon-ibn-sina-print-v2 p.92}۔"
  es: "Ibn Sina da los signos de coma por hemorragia: hinchazón de las venas yugulares, enrojecimiento de los ojos, las mejillas y la lengua, y lo que se observa cuando se acumula sangre o flema a medida que se forman hinchazones {cite:canon-ibn-sina-print-v2 p.92}"
  tr: "İbn Sina, damarların şişmesi, gözlerde, yanaklarda ve dilde kızarıklık gibi kanın neden olduğu kış uykusu belirtilerinden bahseder ve kan veya balgam birikirse ortaya çıkan şey tümör birikimi olur {cite:canon-ibn-sina-print-v2 s.92}"
  id: "Ibn Sina menyebutkan gejala hibernasi yang disebabkan oleh darah, seperti pembengkakan pembuluh darah, kemerahan di mata, pipi, dan lidah, dan jika darah atau dahak menumpuk, yang tampak adalah akumulasi tumor {cite:canon-ibn-sina-print-v2 hlm.92}"
