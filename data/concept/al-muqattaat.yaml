label: { ar: "الحروف المقطعة في أوائل السور", en: "Disjoined letters at the openings of surahs" }
summary:
  ar: "الحروف التي تبتدئ بها بعض السور. يعرض رشيد رضا في مطلع تفسير سورة الأعراف أن المختار عنده أن الحكمة من افتتاح هذه السور بها تنبيه السامع إلى ما سيأتي بعدها حتى لا يفوته شيء، وأنها كانت تُتلى على المشركين بمكة للدعوة. ويبين أن لكل سورة من هذا الضرب موضوعاً يتصل بإثبات الرسالة والكتاب، ويضرب مثلاً بسورة الروم التي أخبرت بغلبة الروم بعد غلبة الفرس. هذا اختيار رضا، وتنسب إليه هنا، ولم تُعرض بعد آراء غيره."
  en: "The letters with which some surahs open. In Rashid Rida's commentary at the opening of Surat al-A'raf, his preferred view is that the purpose of opening these surahs with them is to alert the listener to what follows so that nothing escapes him, and that they were recited to the polytheists of Mecca as a call. He holds that each surah of this kind has a theme tied to proving the message and the Book, and gives Surat al-Rum as an example, which foretold the Romans' victory after an earlier Persian victory. This is Rida's own choice and is attributed to him here; the views of other scholars are not yet presented."
