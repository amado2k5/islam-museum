id: concept/pus-sadid
class: concept
kind: legal
label:
  ar: "الصَّدِيد"
  en: "Sadid (pus: whether it is impure, whether it breaks wudu', and its effect on prayer)"
  es: "Sadid (pus: si es impuro, si rompe el wudu' y su efecto en la oración)"
  fr: "Sadid (pus: s'il est impur, s'il invalide les ablutions et son effet sur la prière)"
summary:
  ar: "الصديد في اللغة ماء الجرح الرقيق المختلط بالدم قبل أن يغلظ، فإن غلظ سمي مدة، والقيح الخالص الذي لا يخالطه دم. وجمهور الفقهاء على أنه نجس كالدم. واختلفوا في نقض الوضوء به: فالمالكية والشافعية لا ينقضون الوضوء بخروجه من الجرح، والحنفية ينقضونه إذا سال من رأس الجرح، وزفر ينقضه مطلقا، والحنابلة ينقضونه إذا كان كثيرا فاحشا. وعفي عن اليسير منه في الصلاة باتفاق، واختلفوا في قدره بالدرهم وما دونه، أو بما يتعافاه الناس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10319}"
  en: "In language sadid is the thin liquid of a wound mixed with blood before it thickens; once thick it is called mudda, and qayh is pure pus with no blood. Most jurists hold that pus is impure like blood. On whether it breaks wudu', the Malikis and Shafi'is say no, since the impurities that break it are only those from the two passages; the Hanafis say yes when it flows from the top of the wound, while Zufar holds it breaks wudu' in any case, and the Hanbalis say it breaks wudu' only when it is much and offensive. Small amounts are excused in prayer by agreement, but the schools differ on the measure, whether a dirham or less, or what people commonly overlook. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10319}"
  es: "En el lenguaje, sadid es el líquido fino de una herida mezclado con sangre antes de que espese; una vez espeso se llama mudda, y qayh es pus puro sin sangre. La mayoría de los juristas sostienen que el pus es impuro como la sangre. Sobre si invalida la ablución (wudu'), los malikíes y shafiíes dicen que no, ya que las impurezas que la invalidan son solo las de los dos pasajes; los hanafíes dicen que sí cuando fluye de la parte superior de la herida, mientras que Zufar sostiene que invalida la ablución en cualquier caso, y los hanbalíes dicen que invalida la ablución solo cuando es abundante y ofensivo. Pequeñas cantidades se excusan en la oración por acuerdo mutuo, pero las escuelas difieren en la medida, si un dirham o menos, o en lo que la gente suele pasar por alto. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10316} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10317} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10318} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10319}"
  fr: "En hébreu, le terme « sadid » désigne le liquide fluide d'une plaie mêlé de sang avant qu'il ne s'épaississe; une fois épaissi, il est appelé « mudda », et « qayh » désigne le pus pur, sans sang. La plupart des juristes considèrent le pus comme impur, au même titre que le sang. Quant à savoir s'il invalide les ablutions (wudu'), les écoles malikite et chaféite répondent par la négative, car seules les impuretés mentionnées dans les deux passages concernés l'invalident; les écoles hanafite, quant à elles, l'invalident lorsqu'il s'écoule de la plaie, tandis que l'école zufar considère qu'il invalide les ablutions dans tous les cas, et les écoles hanbalites, seulement lorsqu'il est abondant et nauséabond. De petites quantités sont tolérées lors de la prière par consensus, mais les écoles divergent sur la mesure, qu'il s'agisse d'un dirham ou moins, ou de ce que l'on néglige généralement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10319}"
