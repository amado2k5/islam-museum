id: concept/pus-sadid
class: concept
kind: legal
label:
  ar: "الصَّدِيد"
  en: "Sadid (pus: whether it is impure, whether it breaks wudu', and its effect on prayer)"
summary:
  ar: "الصديد في اللغة ماء الجرح الرقيق المختلط بالدم قبل أن يغلظ، فإن غلظ سمي مدة، والقيح الخالص الذي لا يخالطه دم. وجمهور الفقهاء على أنه نجس كالدم. واختلفوا في نقض الوضوء به: فالمالكية والشافعية لا ينقضون الوضوء بخروجه من الجرح، والحنفية ينقضونه إذا سال من رأس الجرح، وزفر ينقضه مطلقا، والحنابلة ينقضونه إذا كان كثيرا فاحشا. وعفي عن اليسير منه في الصلاة باتفاق، واختلفوا في قدره بالدرهم وما دونه، أو بما يتعافاه الناس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10319}"
  en: "In language sadid is the thin liquid of a wound mixed with blood before it thickens; once thick it is called mudda, and qayh is pure pus with no blood. Most jurists hold that pus is impure like blood. On whether it breaks wudu', the Malikis and Shafi'is say no, since the impurities that break it are only those from the two passages; the Hanafis say yes when it flows from the top of the wound, while Zufar holds it breaks wudu' in any case, and the Hanbalis say it breaks wudu' only when it is much and offensive. Small amounts are excused in prayer by agreement, but the schools differ on the measure, whether a dirham or less, or what people commonly overlook. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10316} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10317} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10319}"
