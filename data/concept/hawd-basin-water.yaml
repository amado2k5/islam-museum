summary:
  ar: "الحوض في اللغة مجتمع الماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} وفرق الفقهاء بين الماء الراكد الكثير والقليل: فالكثير لا تنجسه النجاسة الواقعة في طرفه ما لم يتغير لونه أو طعمه أو ريحه، والقليل بخلافه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} والشافعية والحنابلة يحدّون الكثير بالقلتين، والمالكية لا يحدون، والحنفية يقدرون الكبير بحسب الشكل، فالمربع عشر في عشر بذراع الكرباس، والمدور ثمانية وأربعون ذراعا في قول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415} وفي العمق اختلف الفقهاء بين ما تنحسر فيه الأرض عند الرفع باليد وما يصيب فيه الاغتراف أرض الحوض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415} "
  en: "Hawd lexically is a gathering of water. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} The jurists divide still water into much and little: much water is not made impure by an impurity falling in one part of it unless its colour, taste or smell changes; little water is the reverse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} The Shafiis and Hanbalis fix much water at two qullas, the Malikis set no limit, and the Hanafis measure by shape, the square basin being ten by ten cubits with the cloth-measure, the round one forty-eight cubits in one view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415} On depth, some measure it by whether the earth under the hand is exposed when water is lifted, and others by whether the hand reaches the floor when filled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415} "
  ur: "حوض لغت میں پانی جمع ہونے کی جگہ کو کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} فقہاء نے ٹھہرے ہوئے پانی کو کثیر اور قلیل میں تقسیم کیا: کثیر پانی کے ایک کنارے میں گری نجاست سے تمام پانی ناپاک نہیں ہوتا جب تک رنگ، ذائقہ یا بو نہ بدلے؛ قلیل اس کے برعکس ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} شافعیہ اور حنابلہ کثیر کی حد دو قلّہ بتاتے ہیں، مالکیہ کوئی حد نہیں رکھتے، اور حنفیہ شکل کے اعتبار سے مقدار متعین کرتے ہیں: مربع دس در دس کرباس کے گز سے، اور گول حوض ایک قول کے مطابق اڑتالیس گز۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415} گہرائی میں اختلاف ہے: بعض کے نزدیک اس کی حد یہ ہے کہ پانی اٹھانے سے نیچے کی زمین نہ کھلے، اور بعض کے نزدیک یہ کہ ہاتھ سے بھرنے پر زمین تک نہ پہنچے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415} "
  es: "Hawd léxicamente es una acumulación de agua. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} Los juristas dividen el agua estancada en mucha y poca: mucha agua no se vuelve impura por una impureza que cae en una parte de ella a menos que su color, sabor u olor cambien; poca agua es lo contrario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} Los shafiíes y hanbalíes fijan mucha agua en dos qullas, los malikíes no establecen límite, y los hanafíes la miden por forma, la palangana cuadrada es de diez por diez codos con la medida de tela, la redonda de cuarenta y ocho codos en una vista. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415} En cuanto a la profundidad, algunos la miden por si la tierra bajo la mano queda expuesta al levantar el agua, y otros por si la mano llega al suelo al llenarla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415}"
  fr: "Le terme « hawd » désigne textuellement une accumulation d'eau. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} Les juristes distinguent les eaux stagnantes en deux catégories: les eaux stagnantes ne sont pas considérées comme impures par la présence d'une impureté en leur sein, à moins que leur couleur, leur goût ou leur odeur ne s'en trouve modifiés; c'est l'inverse pour les eaux stagnantes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} Les écoles chaféite et hanbalite fixent la quantité d'eau stagnante à deux qula's, l'école malikite ne fixe aucune limite, et l'école hanafite mesure selon la forme: un bassin carré mesure dix coudées sur dix avec la mesure du tissu, et un bassin rond quarante-huit coudées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415} Concernant la profondeur, certains la mesurent en observant si la terre sous la main est exposée lorsque l'eau est soulevée, et d'autres en observant si la main touche le sol lorsqu'elle est remplie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415}"
  tr: "Dil açısından bir havuz, su yığınıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7414} Hukukçular, durgun suyu büyük ve küçük olan suyu ayırt ederler: büyük miktar, rengi, tadı veya kokusu değişmediği sürece kenarındaki kirlilikten dolayı kirli değildir, az miktar ise tam tersidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7414} Şafi'ler ve Hanbaliler büyüklüğü iki küçük arşınla sınırlar, Malikiler bunu yapmaz, Hanefiler ise büyüklüğü şekline göre tahmin eder; bir kare on x on bir karbasın bir arşını, yuvarlak ise görüşe göre kırk sekiz arşindir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7415} Detaylı olarak, hukukçular elle kaldırıldığında zeminin geri çekilmesine neden olan şeyler ile havza arazisi aşındığında ne olduğu konusunda ayrılık yaparlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7415}"
  id: "Dalam bahasa, sebuah cekungan adalah kumpulan air. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7414} Para ahli hukum membedakan antara air tergenang yang besar dan yang kecil: jumlah besar tidak menjadi kotoran oleh kotoran di tepinya selama warna, rasa, atau baunya tidak berubah, dan jumlah kecil adalah sebaliknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7414} Umat Shafi'i dan Hanbal membatasi yang besar dengan dua hasta kecil, sedangkan Maliki tidak, dan Hanafi memperkirakan besar berdasarkan bentuknya; kotak sepuluh kali sepuluh adalah satu hasta dari sebuah karba, dan sebuah bulat adalah empat puluh delapan hasta menurut opini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7415} Secara mendalam, para ahli hukum berbeda pendapat antara apa yang menyebabkan tanah mundur saat diangkat dengan tangan dan apa yang terjadi ketika tanah cekungan terkikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7415}"
