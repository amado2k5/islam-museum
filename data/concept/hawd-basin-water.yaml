summary:
  ar: "الحوض في اللغة مجتمع الماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} وفرق الفقهاء بين الماء الراكد الكثير والقليل: فالكثير لا تنجسه النجاسة الواقعة في طرفه ما لم يتغير لونه أو طعمه أو ريحه، والقليل بخلافه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} والشافعية والحنابلة يحدّون الكثير بالقلتين، والمالكية لا يحدون، والحنفية يقدرون الكبير بحسب الشكل، فالمربع عشر في عشر بذراع الكرباس، والمدور ثمانية وأربعون ذراعا في قول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415} وفي العمق اختلف الفقهاء بين ما تنحسر فيه الأرض عند الرفع باليد وما يصيب فيه الاغتراف أرض الحوض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415} "
  en: "Hawd lexically is a gathering of water. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} The jurists divide still water into much and little: much water is not made impure by an impurity falling in one part of it unless its colour, taste or smell changes; little water is the reverse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} The Shafiis and Hanbalis fix much water at two qullas, the Malikis set no limit, and the Hanafis measure by shape, the square basin being ten by ten cubits with the cloth-measure, the round one forty-eight cubits in one view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415} On depth, some measure it by whether the earth under the hand is exposed when water is lifted, and others by whether the hand reaches the floor when filled. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415} "
  ur: "حوض لغت میں پانی جمع ہونے کی جگہ کو کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} فقہاء نے ٹھہرے ہوئے پانی کو کثیر اور قلیل میں تقسیم کیا: کثیر پانی کے ایک کنارے میں گری نجاست سے تمام پانی ناپاک نہیں ہوتا جب تک رنگ، ذائقہ یا بو نہ بدلے؛ قلیل اس کے برعکس ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} شافعیہ اور حنابلہ کثیر کی حد دو قلّہ بتاتے ہیں، مالکیہ کوئی حد نہیں رکھتے، اور حنفیہ شکل کے اعتبار سے مقدار متعین کرتے ہیں: مربع دس در دس کرباس کے گز سے، اور گول حوض ایک قول کے مطابق اڑتالیس گز۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7414} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415} گہرائی میں اختلاف ہے: بعض کے نزدیک اس کی حد یہ ہے کہ پانی اٹھانے سے نیچے کی زمین نہ کھلے، اور بعض کے نزدیک یہ کہ ہاتھ سے بھرنے پر زمین تک نہ پہنچے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7415} "
