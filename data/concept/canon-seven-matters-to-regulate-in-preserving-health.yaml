id: concept/canon-seven-matters-to-regulate-in-preserving-health
class: concept
kind: scientific
label:
  ar: "الأمور السبعة في تدبير حفظ الصحة"
  en: "The seven matters to regulate in preserving health"
  fr: "Sept éléments à régler pour conserver la santé"
  ur: "حفظ صحت کے سات امور"
  es: "Los siete aspectos a regular para preservar la salud"
  tr: "Sağlık Yönetiminin Yedi Meselesi"
  id: "Tujuh Masalah Manajemen Kesehatan"
summary:
  ar: "يجعل ابن سينا ملاك صناعة حفظ الصحة تعديل الأسباب العامة اللازمة، وأكثر العناية بها في سبعة أمور، ثم يبدأ بتدبير المولود المعتدل المزاج في الغاية {cite:canon-ibn-sina-print-v1 p.202}."
  en: "Ibn Sina makes the keystone of the art of preserving health the regulation of the general necessary causes, with most care given to seven matters, and then begins with the management of a newborn of the most balanced temperament {cite:canon-ibn-sina-print-v1 p.202}."
  fr: "Ibn Sina place au cœur de l’art de conserver la santé le réglage des causes générales nécessaires, particulièrement de sept éléments, puis commence par le régime d’un nouveau-né de tempérament parfaitement équilibré {cite:canon-ibn-sina-print-v1 p.202}."
  es: "Ibn Sina hace de la regulación de las causas generales necesarias la piedra angular del arte de preservar la salud, prestando especial atención a siete asuntos, y luego comienza con el manejo de un recién nacido de temperamento más equilibrado {cite:canon-ibn-sina-print-v1 p.202}."
  ur: "ابن سینا صحت کو محفوظ رکھنے کے فن کا کلیدی پتھر بناتا ہے جس میں عام ضروری اسباب کا ضابطہ ہوتا ہے، جس میں سات امور کا سب سے زیادہ خیال رکھا جاتا ہے، اور پھر سب سے زیادہ متوازن مزاج کے نوزائیدہ بچے کے انتظام سے شروع ہوتا ہے۔"
  tr: "İbn Sina, sağlığı koruma zanaatının ustasını gerekli genel nedenler yapar ve yedi konuda bunlara daha fazla dikkat eder, ardından çocuğu sonuna kadar ılımlı bir mizaçla yönetmeye başlar {cite:canon-ibn-sina-print-v1 s.202}."
  id: "Ibn Sina menjadikan keterampilan menjaga kesehatan sebagai ahli penyebab umum yang diperlukan dan lebih memperhatikan hal itu dalam tujuh hal, lalu mulai mengelola anak dengan temperamen moderat hingga akhir {cite:canon-ibn-sina-print-v1 hlm.202}."
