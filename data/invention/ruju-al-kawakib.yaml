id: invention/ruju-al-kawakib
class: invention
label: { ar: "رجوع الكواكب", en: "The retrograde motion of the planets", ur: "سیاروں کا رجوع", es: "El movimiento retrógrado de los planetas", fr: "Le mouvement rétrograde des planètes" }
names:
  - { value: "rujūʿ al-kawākib", kind: alternate, lang: ar }
  - { value: "retrograde motion", kind: alternate, lang: en }
  - { value: "planetary retrogression", kind: alternate, lang: en }
summary:
  ar: "الحركة التي يظهر بها الكوكب الخارجي راجعاً في فلك البروج أحياناً؛ شرحها الفرغاني في فصله عن الكواكب بتركيب حركته على فلك التدوير مع حركة مركزه على الفلك الحامل، فبدا الكوكب راجعاً حين تغلبت حركته الخاصة على حركة مركزه، وأعظم رجوعاً عند الحضيض {cite:farghani-elements-astronomy pp. 193–195} {cite:tdv-ilm-i-felek}."
  en: "The motion by which an outer planet sometimes appears to move backward along the zodiac; al-Farghani explains it by composing the planet's motion on the epicycle with the motion of its centre on the carrying circle, so the planet appears retrograde when its own motion outweighs the centre's, most strongly at perigee {cite:farghani-elements-astronomy pp. 193–195} {cite:tdv-ilm-i-felek}."
  ur: "وہ حرکت جس میں بیرونی سیارہ کبھی کبھار بروج میں پیچھے جاتا نظر آتا ہے؛ الفرغانی نے اس کی وضاحت سیارے کی حرکت فلکِ تدویر پر اور اس کے مرکز کی حرکت حامل دائرے پر، ان کا امتزاج کر کے دی، تو جب سیارے کی اپنی حرکت مرکز کی حرکت پر غالب آئی تو وہ رجوعی نظر آیا، حضیض کے قریب سب سے زیادہ {cite:farghani-elements-astronomy pp. 193–195} {cite:tdv-ilm-i-felek}۔"
  es: "El movimiento por el cual un planeta exterior a veces parece moverse hacia atrás a lo largo del zodíaco; al-Farghani lo explica componiendo el movimiento del planeta en el epiciclo con el movimiento de su centro en el círculo portador, de modo que el planeta parece retrógrado cuando su propio movimiento supera al del centro, más fuertemente en el perigeo {cite:farghani-elements-astronomy pp. 193–195} {cite:tdv-ilm-i-felek}."
  fr: "Le mouvement par lequel une planète extérieure semble parfois reculer le long du zodiaque; al-Farghani l'explique en composant le mouvement de la planète sur l'épicycle avec le mouvement de son centre sur le cercle porteur, de sorte que la planète apparaît rétrograde lorsque son propre mouvement l'emporte sur celui du centre, le plus fortement au périgée {cite:farghani-elements-astronomy pp. 193–195} {cite:tdv-ilm-i-felek}."
