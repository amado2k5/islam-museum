kids:
  ar: "من الأرض تبدو الكواكب أحياناً وكأنها تمشي إلى الوراء لأسابيع، ثم تعود إلى أمامها. عرف الفلكيون المسلمون هذا اللغز منذ ألف سنة. شرح الفرغاني أنه ليس وهماً: كل كوكب يسير على دائرة صغيرة مركزها يدور على دائرة كبيرة، فإذا سبق الكوكب مركزه بدا راجعاً."
  en: "From Earth, the planets sometimes seem to walk backward for weeks, then go forward again. Muslim astronomers knew this puzzle a thousand years ago. Al-Farghani explained it is no trick: each planet rides a small circle whose centre travels a big circle, and when the planet outruns its centre it looks like it is going backward."
  ur: "زمین سے سیارے کبھی کبھی ہفتوں پیچھے جاتے نظر آتے ہیں، پھر دوبارہ آگے۔ مسلم فلکیات دانوں کو یہ پہیلی ہزار سال پہلے معلوم تھی۔ الفرغانی نے وضاحت کی کہ یہ کوئی چال نہیں: ہر سیارہ ایک چھوٹے دائرے پر سوار ہے جس کا مرکز ایک بڑے دائرے پر چلتا ہے، اور جب سیارہ اپنے مرکز سے آگے نکل جائے تو وہ پیچھے جاتا نظر آتا ہے۔"
