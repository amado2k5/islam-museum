era:
  origins: abbasid-golden
  first_attested:
    edtf: "0850~"
    calendar: julian
    precision: century
    status: historical
    note: "Al-Farghani's Elements (before 857 CE) sets out the epicycle explanation of retrogression in its planetary chapter; the epicycle model descends from Ptolemy's Almagest."
    sources: [source/farghani-elements-astronomy, source/commons-ptolemy-epicycles]
  status_today: replaced
origin:
  place: place/baghdad
  polity: polity/abbasid-caliphate
  context:
    ar: "شرح الفرغاني رجوع الكواكب في كتابه «الجوامع في علم النجوم»، في المنهج الفلكي الذي دوّن الحسابات الكوكبية التي تحتاجها الفلكية العباسية {cite:farghani-elements-astronomy pp. 193–195} {cite:tdv-ilm-i-felek}."
    en: "Al-Farghani explains planetary retrogression in his 'Elements', within the astronomical curriculum that supplied the computations of Abbasid astronomy {cite:farghani-elements-astronomy pp. 193–195} {cite:tdv-ilm-i-felek}."
    ur: "الفرغانی نے اپنی «الجوامع في علم النجوم» میں سیاروں کے رجوع کی وضاحت کی، عباسی فلکیات کے نصاب کے مطابق جو سیاروں کے حسابات فراہم کرتا تھا {cite:farghani-elements-astronomy pp. 193–195} {cite:tdv-ilm-i-felek}۔"
makers:
  - person: person/al-farghani
    role: describer
    place: place/baghdad
    note: "Al-Farghani gives the epicycle-and-deferent explanation of retrograde motion, with the differing limits of Saturn, Jupiter, Mars, Venus and Mercury {cite:farghani-elements-astronomy pp. 193–195}. The geometric model is Ptolemaic; his role is exposition within the curriculum {cite:commons-ptolemy-epicycles} {cite:tdv-ilm-i-felek}."
    sources: [source/farghani-elements-astronomy, source/commons-ptolemy-epicycles]
attribution:
  status: transmission
  claim:
    ar: "شرح الرجوع نقل عن النموذج البطلمي: الفلك التدويري والفلك الحامل؛ والفرغاني لم يخترع النموذج بل بيّنه بالعربية للطلبة، مع تفصيل حدود الرجوع لكل كوكب."
    en: "The retrogression explanation is transmitted from the Ptolemaic model — the epicycle and the deferent; al-Farghani did not invent the model but explained it in Arabic for students, detailing each planet's limits of retrograde arc."
    ur: "رجوع کی وضاحت بطلمیوسی ماڈل — فلکِ تدویر اور فلکِ مرجعی — سے منتقل ہے؛ الفرغانی نے ماڈل ایجاد نہیں کیا بلکہ طلبہ کے لیے اسے عربی میں بیان کیا، ہر سیارے کی رجوعی حد کی تفصیل کے ساتھ۔"
  basis:
    ar: "يشرح الفرغاني أن الكوكب يجري على الفلك الصغير إلى المغرب بينما يدور مركزه على الفلك الكبير إلى المشرق، فإذا غلبت حركة الكوكب على حركة المركز بدا راجعاً، وأن الرجوع أعظم عند الحضيض {cite:farghani-elements-astronomy pp. 193–195}. ويرسم نفس النموذج مخطط بطلميوس «كيف تفسر الأفلاك التدورية الرجوع» {cite:commons-ptolemy-epicycles}."
    en: "Al-Farghani explains that the planet runs westward on the small circle while its centre travels eastward on the large one; when the planet's motion outweighs the centre's it appears retrograde, greatest at perigee {cite:farghani-elements-astronomy pp. 193–195}. The same epicycle model is drawn by the Ptolemy epicycles diagram {cite:commons-ptolemy-epicycles}."
    ur: "الفرغانی وضاحتا ہے کہ سیارہ چھوٹے دائرے پر مغرب کی طرف چلتا ہے جبکہ اس کا مرکز بڑے دائرے پر مشرق کی طرف سفر کرتا ہے؛ جب سیارے کی حرکت مرکز کی حرکت پر غالب آئی تو وہ رجوعی نظر آیا، حضیض کے قریب سب سے زیادہ {cite:farghani-elements-astronomy pp. 193–195}۔ وہی فلکِ تدویر کا ماڈل بطلمیوس کے خاکے میں بھی دکھایا گیا ہے {cite:commons-ptolemy-epicycles}۔"
precursors:
  - external: { ar: "نموذج بطلميوس — الفلك التدويري والفلك الحامل", en: "Ptolemy's model — the epicycle and the deferent", ur: "بطلمیوس کا ماڈل — فلکِ تدویر اور فلکِ مرجعی" }
    note: "The epicycle mechanism was Ptolemy's device for reproducing the observed planetary motions, transmitted into Arabic astronomy {cite:commons-ptolemy-epicycles} {cite:tdv-ilm-i-felek}."
    sources: [source/commons-ptolemy-epicycles, source/tdv-ilm-i-felek]
  - external: { ar: "ملاحظة الرجوع الفلكي القديمة", en: "The ancient observation of planetary retrogression", ur: "سیاروں کے رجوع کا قدیم مشاہدہ" }
    note: "Greek astronomers had observed and modelled the planets' backward loops long before the Arabic exposition {cite:farghani-elements-astronomy pp. 193–195} {cite:commons-ptolemy-epicycles}."
    sources: [source/farghani-elements-astronomy, source/commons-ptolemy-epicycles]
dependents:
  - external: { ar: "زيجات الحسابات الكوكبية", en: "The zij tables of planetary computation", ur: "سیاروں کے حساب کی زیج جداول" }
    note: "The epicycle parameters al-Farghani details fed the zij tradition of planetary positions used for astrology and calendars {cite:farghani-elements-astronomy pp. 193–195} {cite:tdv-ilm-i-felek}."
    sources: [source/farghani-elements-astronomy, source/tdv-ilm-i-felek]
  - external: { ar: "النقد الكوبيرنيكي اللاحق للمدارات", en: "The later Copernican critique of the orbits", ur: "بعد کی کوپرنیکسی تنقید اور مداروں کی" }
    note: "The epicycle model was eventually replaced by heliocentric ellipses; al-Farghani's text preserves the transmitted form {cite:farghani-elements-astronomy pp. 193–195} {cite:commons-ptolemy-epicycles}."
    sources: [source/farghani-elements-astronomy, source/commons-ptolemy-epicycles]
spread: []
impact:
  fields: [astronomy-instruments, mathematics]
  changed:
    ar: "منح المتعلمين المسلمين أداة هندسية موحدة لتفسير أقدم لغز في السماء: لماذا يبدو المريخ وأخواته يراجعون أحياناً."
    en: "It gave Muslim students a unified geometric tool for explaining the sky's oldest puzzle: why Mars and its sisters sometimes seem to walk backward."
    ur: "اس نے مسلم طلبہ کو آسمان کے قدیم ترین معمہ کی وضاحت کے لیے ایک متحد ہندسی آلہ دیا: مریخ اور اس کے ساتھی کیوں کبھی پیچھے جاتے نظر آتے ہیں۔"
  history:
    ar: "بقي نموذج الفلك التدويري هو الإطار الحسابي للسيارات حتى عصر النهضة الأوروبية؛ وحفظ الفرغاني بيانه العربي."
    en: "The epicycle framework remained the computational frame for the planets until the European Renaissance; al-Farghani preserved its Arabic exposition."
    ur: "فلکِ تدویر کا ماڈل یورپی نشاة تک سیاروں کا حسابی ڈھانچہ رہا؛ الفرغانی نے اس کا عربی بیان محفوظ کیا۔"
  significance: 3
  why: "A transmitted explanation, not an invention; al-Farghani's chapter made the Ptolemaic epicycle readable for the Abbasid curriculum and preserved its precise per-planet limits."
