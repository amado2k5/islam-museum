today:
  form:
    ar: "ما زال شرح الأفلاك التدورية يُدرَّس في تواريخ الفلك ونماذج الحركة الكوكبية القديمة، مع ملاحظة أن النموذج استُبدل بالمدارات الإهليلجية."
    en: "The epicycle explanation is still taught in histories of astronomy and models of ancient planetary motion, with the note that the model was superseded by ellipses."
    ur: "فلکِ تدویر کی وضاحت آج بھی فلکیات کی تاریخ اور قدیم سیاروں کی حرکت کے نمونوں میں پڑھائی جاتی ہے، اس نوٹ کے ساتھ کہ یہ ماڈل بیضوی مداروں سے بدل گیا۔"
  descendants:
    ar: "قاد النموذج إلى نقاشات القياس الدقيق للمدارات، ومنها ما أدى في النهاية إلى نموذج كوبيرنيكوس."
    en: "The model led to debates on precise orbital measurement, among them what eventually produced the Copernican system."
    ur: "اس ماڈل نے مداروں کی درست پیمائش کے مباحث کو جنم دیا، جن میں سے ایک نے بالآخر کوپرنیکسی نظام پیدا کیا۔"
