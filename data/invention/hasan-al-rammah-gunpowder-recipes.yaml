precursors:
  - external: { ar: "البارود والنيران الصينية", en: "Chinese gunpowder and fireworks", ur: "چینی بارود اور آتش بازی" }
    note: "Partington records that al-Rammah's book makes extensive use of Chinese material — ingredient names, coloured smokes and fireworks — although it does not use the term 'snow of China' for saltpetre."
    sources: [source/partington-greek-fire-gunpowder-1960]
  - external: { ar: "تقليد النفط والنيران الحربية", en: "The naphtha and war-fire tradition", ur: "نفت اور جنگی آگ کی روایت" }
    note: "The treatise stands in the older Islamic incendiary tradition of naft, fire-pots thrown by mangonels and fire-lances, which the furusiyya books taught."
    sources: [source/partington-greek-fire-gunpowder-1960, source/encyclopaedia-of-islam-2]
dependents:
  - external: { ar: "كيمياء البارود الأوروبية", en: "European gunpowder chemistry", ur: "یورپی بارود کیمیاء" }
    note: "The purification method — treating the saltpetre solution with wood ashes and crystallising — is the process later European powder-makers used to obtain pure potassium nitrate; the transmission line is documented as a direction of study, not a proven chain."
    sources: [source/partington-greek-fire-gunpowder-1960]
  - external: { ar: "الأسلحة النارية المملوكية اللاحقة", en: "Later Mamluk firearms", ur: "بعد کے مملوکی اسلحہ ناری" }
    note: "Firearms appear in the Mamluk record within a generation of al-Rammah; the treatise itself documents the pyrotechnic stage before them."
    sources: [source/partington-greek-fire-gunpowder-1960, source/encyclopaedia-of-islam-2]
