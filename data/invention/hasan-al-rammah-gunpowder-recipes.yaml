summary:
  ar: "يحوي كتاب الحسن الرماح «الفروسية والمناصب الحربية» ⁦(ت 1294-1295م)⁩ أول بيان واضح معروف عند بارتينغتون لتطهير الملح ⁦(البارود)⁩ برماد الخشب والتبلور، ونحو إحدى وسبعين تركيبة نارية يغلب عليها الملح، مع صواريخ ونيران ملونة ودخان — دون أي ذكر لدفع المقذوفات أو لسلاح ناري {cite:partington-greek-fire-gunpowder-1960}."
  en: "Al-Hasan al-Rammah's Kitab al-Furusiyya wa'l-manasib al-harbiyya ⁦(d. 1294-95)⁩ contains the first clear account known to Partington of purifying saltpetre with wood ashes and crystallisation, and some seventy-one pyrotechnic compositions dominated by saltpetre, with rockets, coloured fires and smokes — and no mention of propellant use or of any firearm {cite:partington-greek-fire-gunpowder-1960}."
  ur: "حسن رماح کی کتاب الفروسیۃ والمناصب الحربیۃ ⁦(وفات 1294-95)⁩ میں پارٹنگٹن کے نزدیک ملح کی تصفیہ کا پہلا واضح بیان اور تقریباً اکہتر نیرنگی ترکیبیں ہیں — راکٹ، رنگین آگیں اور دھواں — مگر محرک استعمال یا کسی اسلحے کا ذکر نہیں {cite:partington-greek-fire-gunpowder-1960}۔"
  es: "El Kitab al-Furusiyya wa'l-manasib al-harbiyya de Al-Hasan al-Rammah (m. 1294-95) contiene el primer relato claro conocido por Partington sobre la purificación del salitre con cenizas de madera y cristalización, y unas setenta y una composiciones pirotécnicas dominadas por el salitre, con cohetes, fuegos de colores y humos, y ninguna mención del uso de propelente ni de ninguna arma de fuego {cite:partington-greek-fire-gunpowder-1960}."
  fr: "Le Kitab al-Furusiyya wa'l-manasib al-harbiyya d'Al-Hasan al-Rammah (mort en 1294-95) contient le premier récit clair connu de Partington sur la purification du salpêtre avec des cendres de bois et la cristallisation, ainsi que quelque soixante-et-onze compositions pyrotechniques dominées par le salpêtre, avec des fusées, des feux colorés et des fumées — et aucune mention de l'utilisation de propulseur ou d'une quelconque arme à feu {cite:partington-greek-fire-gunpowder-1960}."
