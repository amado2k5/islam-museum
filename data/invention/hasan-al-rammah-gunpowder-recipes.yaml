    en: "The earliest documented written account in the Islamic world of saltpetre-based compositions and of purifying saltpetre by crystallisation — documentation and systematisation of circulating material, not a claim to have invented gunpowder, which is earlier and Chinese."
    ur: "عالمِ اسلام میں ملحی نیرنگی ترکیبوں اور تبلور سے ملح کی تصفیہ کا قدیم ترین دستاویزی تحریری بیان — گردو پیش مادے کی توثیق، بارود کی ایجاد کا دعویٰ نہیں جو چین میں پہلے سے موجود تھا۔"
