    ar: "الشام المملوكية أواخر القرن الثالث عشر؛ يذكر الكتاب أنه أُعدّ «لتقدم الإسلام»، وتعليقه على سادة الفروسية والصناع، وترى بارتينغتون أن المخطوطة أُعدّت على الأرجح للاستعمال السري الرسمي {cite:partington-greek-fire-gunpowder-1960}."
    en: "Mamluk Syria at the end of the thirteenth century; the book says it was prepared 'for the advancement of Islam' and addresses masters of horsemanship and artificers, and Partington judges the manuscript was probably prepared for confidential official use {cite:partington-greek-fire-gunpowder-1960}."
