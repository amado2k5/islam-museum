    en: "Partington: al-Rammah's account of purifying saltpetre with wood ashes and crystallisation is 'the first clear account of the process known to me'; the book lists some seventy-one compositions dominated by saltpetre, with Chinese material evident in its ingredients and names {cite:partington-greek-fire-gunpowder-1960}."
