kids:
  ar: "قبل سبعمائة سنة كتب رجل سوري اسمه الحسن الرماح كتاباً عن الفروسية والحرب، وفيه وصف كيف ينقّون الملح المستعمل في الألعاب النارية والدخان الملون. لم يخترع البارود — فهو أقدم من ذلك في الصين — لكنه كتب طريقة تنقيته كتابةً لأول مرة بشكل واضح عند المؤرخين."
  en: "Seven hundred years ago a Syrian man named al-Hasan al-Rammah wrote a book about horsemanship and war. In it he described how they purified the salt used in fireworks and coloured smoke. He did not invent gunpowder — it was older, from China — but his written description of purifying it is the earliest clear one historians know."
  ur: "سات سو سال پہلے حسن رماح نامی شامی نے فروسیہ اور جنگ پر کتاب لکھی جس میں نیرنگی اور رنگین دھوئیں میں استعمال ہونے والے ملح کی تصفیہ لکھی۔ اس نے بارود ایجاد نہیں کیا — وہ چین میں پہلے سے تھا — مگر تصفیہ کا لکھا ہوا بیان مؤرخین کے نزدیک پہلا واضح ہے۔"
