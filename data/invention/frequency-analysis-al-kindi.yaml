kids:
  ar: "قد يخفي تبديل الحروف أسماءها، لكنه يترك تكرارها قرينة. يعد الكندي الحروف ثم يفحص ما يصح أن يجتمع منها؛ ويحذر من قصر الرسالة. التخمين بداية، والتحقق في بقية النص هو العمل."
  en: "Changing letters' names can leave their repetition as a clue. Al-Kindi counts, then checks which letters fit together, warning about short messages. A guess begins the work; checking the rest matters."
  ur: "حروف کے نام بدلنے سے ان کی تکرار سراغ رہ سکتی ہے۔ کندی گنتے، پھر جوڑ جانچتے اور مختصر پیغام سے خبردار کرتے ہیں۔ اندازہ آغاز ہے؛ باقی متن میں جانچ اہم ہے۔"
