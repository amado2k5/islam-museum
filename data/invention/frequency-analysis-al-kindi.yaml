summary:
  ar: "يعد الكندي حروف نص معلوم اللغة ويرتبها بالكثرة، ثم يقارنها برموز النص المعمى؛ وينبه إلى قصور الرسائل القصيرة ويستعين باقتران الحروف وفواتح الرسائل {cite:kindi-cryptanalysis-1987 pp. 216–218}. تصفه TDV بأنه صاحب أقدم رسالة باقية في هذا المجال، لا مخترع إخفاء الرسائل نفسه {cite:tdv-muamma pp. 319–320}."
  en: "Al-Kindi counts and ranks letters in a known-language sample, compares ciphertext symbols, warns about short messages and checks adjacency and conventional openings {cite:kindi-cryptanalysis-1987 pp. 216–218}. TDV calls his the earliest surviving treatise in the field, not the invention of concealed messages {cite:tdv-muamma pp. 319–320}."
  ur: "کندی معلوم زبان کے حروف گن کر ان کی کثرت کا موازنہ معمى کی علامتوں سے کرتے، مختصر پیغام کی حد بتاتے اور جوڑ و آغاز سے جانچتے ہیں {cite:kindi-cryptanalysis-1987 pp. 216–218}۔ ٹی ڈی وی ان کا رسالہ قدیم ترین باقی مثال کہتا ہے، پیغام چھپانے کی ایجاد نہیں {cite:tdv-muamma pp. 319–320}۔"
