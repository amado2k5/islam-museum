kids:
  ar: "حصاة صغيرة داخل الجسم تسبب ألماً كبيراً — وقبل ألف سنة كان علاجها خطراً. صنع الزهراوي أدوات خاصة: ملقط يمسك الحصاة ومثقاب يفتتها في مكانها. لم يعد يحتاج الجراح أن يكسرها بيده فقط — صار عنده آلة لكل مهمة."
  en: "A small stone inside the body causes great pain — and a thousand years ago treating it was dangerous. Al-Zahrawi made special tools: forceps that grip the stone and a drill that breaks it in place. The surgeon no longer relied on his hand alone — he had a tool for each task."
  ur: "جسم کے اندر چھوٹی پتھری بڑا درد دیتی ہے — اور ہزار سال پہلے اس کا علاج خطرناک تھا۔ الزہراوی نے خاص اوزار بنائے: کلیپ جو پتھری پکڑے اور مثقب جو اسے وہیں توڑے۔ جراح کو اب صرف اپنے ہاتھ پر بھروسہ نہیں — ہر کام کے لیے اوزار ہے۔"
