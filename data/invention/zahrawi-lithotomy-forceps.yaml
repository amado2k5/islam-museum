summary:
  ar: "يصف «التصريف» استخراج حصاة المثانة بكلاليب خاصة، ويصف مثقابه المسمّى «المشعب» لحصاة الإحليل — أدوات يوثّقها النص برسوم، وهي أقدم سجل جراحي مقروء لأدوات استخراج الحصاة المتخصصة، ومهّدت لجراحة المسالك."
  en: "Al-Tasrif describes removing bladder stones with special forceps, and his drill called al-Mishab for urethral stones — instruments the text documents with drawings, the earliest surgical record read of specialised stone-extraction tools, and a foundation for urological surgery."
  ur: "التصریف مثانے کی پتھری نکالنے کے لیے خاص کلیپوں کا ذکر کرتی ہے، اور پیشاب کی نالی کی پتھری کے لیے اپنا مثقب «المشعب» — آلات جو متن خاکوں کے ساتھ دستاویز کرتا ہے، پتھری نکالنے کے مخصوص اوزاروں کا پڑھا گیا قدیم ترین جراحی ریکارڈ، اور پیشابی جراحی کی بنیاد۔"
