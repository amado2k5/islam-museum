kids:
  ar: "قبل مئات السنين اعتقد العلماء أن الكواكب تتحرك في دوائر معقدة وضعها بطليموس. كتب فلكي دمشقي اسمه غرس الدين رسالة يقول فيها إن بعض تلك الدوائر لا تطابق ما نراه في السماء، ونقل نماذج بديلة من علماء قبله، فكان عمله فحصاً علمياً للنظرية لا رفضاً أعمى."
  en: "Hundreds of years ago scholars believed planets moved in complex circles set out by Ptolemy. A Syrian astronomer named Gars al-Din wrote a treatise saying some of those circles did not match what we see in the sky, and cited revised models from earlier scholars — a scientific check of the theory, not blind rejection."
  ur: "سینکڑوں سال پہلے علماء کا خیال تھا کہ سیارے بطلیموس کے بنائے پیچیدہ دائروں میں چلتے ہیں۔ غرس الدین نامی شامی فلکیات دان نے ایک رسالہ لکھا جس میں کہا کہ ان دائروں میں سے کچھ آسمان پر دکھائی دینے والی چیز سے میل نہیں کھاتے، اور پہلے علماء کے متبادل نمونے نقل کیے — یہ نظریے کی سائنسی جانچ تھی، اندھی مخالفت نہیں۔"
