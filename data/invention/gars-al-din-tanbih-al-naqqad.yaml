origin:
  place: place/iraq
  context:
    ar: "سياق الفلك العثماني-الشامي في القرن العاشر الهجري؛ ينسب هاينن المؤلف إلى فلكي سوري ويذكر زوتر وفاته سنة 971هـ، ولا نحدد مدينة تأليفه بدقة {cite:heinen-islamic-cosmology p. 31}."
    en: "Sixteenth-century Syrian-Ottoman astronomical context; Heinen identifies the author as a Syrian astronomer and gives his death as 971 AH per Suter, without our fixing a precise city of composition {cite:heinen-islamic-cosmology p. 31}."
    ur: "دسویں صدی ہجری کا شامی-عثمانی فلکی سیاق؛ ہائینن مصنف کو شامی فلکیات دان بتاتے ہیں اور زوتر کے مطابق 971ھ میں وفات بتاتے ہیں، تالیف کے شہر کی کوئی درستی نہیں {cite:heinen-islamic-cosmology p. 31}۔"
makers:
  - person: person/gars-al-din-al-halabi
    role: describer
    note: "Documented author of the surviving colophon-dated treatise critiquing the famous hay'a; his Arabic treatise and the scholarly context document the Muslim basis. Sunni is the museum's declared frame; the possible identification with the Shafi'i scholar Ibnü'n-Nakib al-Halabi (d. 971/1563) is recorded as debated, not settled."
    sources: [source/heinen-islamic-cosmology, source/tdv-ibnun-nakib-el-halebi]
attribution:
  status: improvement
  claim:
    ar: "مراجعة نقدية موثقة لمبادئ الهيئة المشهورة على ضوء الملاحظة والنماذج المعدّلة؛ لا ادعاء بابتكار مركزية الشمس أو بإسقاط بطليموس كله."
    en: "A documented critical revision of the famous hay'a's principles in light of observation and revised models; no claim of inventing heliocentrism or abolishing Ptolemy wholesale."
    ur: "مشہور ہیئت کے اصولوں کی مشاہدے اور ترمیم شدہ نمونوں کی روشنی میں مستند تنقیدی نظرثانی؛ شمسی مرکزیت کی ایجاد یا بطلیموس کے مکمل خاتمے کا کوئی دعویٰ نہیں۔"
  basis:
    ar: "يستعرض هاينن أن الرسالة كتبت سنة 958هـ، وتنتقد مبدأ الإكوان والدائرة المائلة في المدارات الكوكبية، وتنقل عن ابن الشاطر ومؤيد الدين العرضي نماذج بديلة، وتلاحظ أن أقطار الكواكب المرصودة تختلف عما تفترضه النظرية {cite:heinen-islamic-cosmology p. 31} {cite:heinen-islamic-cosmology p. 32}."
    en: "Heinen reviews that the treatise was written in 958 AH, criticises the equant and eccentric-deferent principles in planetary orbits, transmits alternative models from Ibn al-Shatir and Mu'ayyad al-Din al-Urdi, and observes that measured planetary diameters differ from what the theory assumes {cite:heinen-islamic-cosmology p. 31} {cite:heinen-islamic-cosmology p. 32}."
    ur: "ہائینن بیان کرتے ہیں کہ یہ رسالہ 958ھ میں لکھا گیا، سیاروی مداروں میں ایکوائنٹ اور مائل دائرے کے اصولوں پر تنقید کرتا ہے، ابن الشاطر اور مؤید الدین عرضی سے متبادل نمونے نقل کرتا ہے، اور نوٹ کرتا ہے کہ ناپے گئے سیاروں کے اقطار نظریے کے مفروضے سے مختلف ہیں {cite:heinen-islamic-cosmology p. 31} {cite:heinen-islamic-cosmology p. 32}۔"
  perspectives:
    - tradition: sunni
      id: sunni-museum-frame
      standing: main
      summary:
        ar: "الإطار السني المعلن يسجّل المؤلف فلكياً شامياً كتب رسالة عربية في تقاليد الهيئة داخل الوسط العلمي الدمشقي، مع الإبقاء على اشتباه identificationه مع فقيه حنفي/شافعي اسمه ابن النقيب الحلبي دون الجزم به."
        en: "The museum's declared Sunni frame records the author as a Syrian astronomer who wrote an Arabic treatise inside the hay'a tradition of the Damascus scholarly milieu, while keeping his possible identification with the scholar Ibn al-Naqib al-Halabi explicitly uncertain."
        ur: "عجائب گھر کا واضح سنی سیاق مصنف کو دمشق کے علمی ماحول میں ہیئت کی روایت میں عربی رسالہ لکھنے والا شامی فلکیات دان قرار دیتا ہے، جبکہ اس کا ابن النقیب الحلبي سے مماثلت کو غیر یقینی رکھا جاتا ہے۔"
      sources: [source/heinen-islamic-cosmology, source/tdv-ibnun-nakib-el-halebi]
    - tradition: academic
      id: academic-identification-debated
      standing: secondary
      summary:
        ar: "المنهج الأكاديمي يعامل هوية «غرس الدين الحلبي» صاحب التنبيه على أنها غير محسومة: هاينن ينسبها إلى فلكي سوري توفي سنة 971هـ بحسب زوتر، بينما تُقترح مطابقتها مع ابن النقيب غرس الدين خليل الحلبي الشافعي المتوفى سنة 971هـ/1563م في معاجم TDV، ولا يثبت الربط في هذا السجل {cite:heinen-islamic-cosmology p. 31} {cite:tdv-ibnun-nakib-el-halebi}."
        en: "The academic approach treats the identity of Gars al-Din al-Halabi, author of the Tanbih, as unsettled: Heinen attributes it to a Syrian astronomer who died in 971 AH per Suter, while reference works propose an identification with the Shafi'i scholar Ibn al-Naqib Gars al-Din Khalil al-Halabi (d. 971/1563); this record does not settle the link {cite:heinen-islamic-cosmology p. 31} {cite:tdv-ibnun-nakib-el-halebi}."
        ur: "تعلیمی نقطہ نظر «غرث الدین الحلبی» کی شناخت کو غیر متعین مانتا ہے: ہائینن اسے زوتر کے مطابق 971ھ میں فوت ہونے والے شامی فلکیات دان سے جوڑتے ہیں، جبکہ مراجع میں اس کی شافعی عالم ابن النقیب غرس الدین خلیل الحلبي ⁦(ت 971ھ/1563ء)⁩ سے مماثلت تجویز کی جاتی ہے؛ یہ ریکارڈ یہ ربط طے نہیں کرتا {cite:heinen-islamic-cosmology p. 31} {cite:tdv-ibnun-nakib-el-halebi}۔"
      sources: [source/heinen-islamic-cosmology, source/tdv-ibnun-nakib-el-halebi]
precursors:
  - external: { ar: "تقاليد انتقاد بطليموس من شكوكا إلى مرصد مراغة", en: "Critiques of Ptolemy from al-Haytham's Shukuk to the Maragha models", ur: "بطلیموس پر تنقید کی روایت — شکوک سے مراغہ کے نمونوں تک" }
    note: "The critique tradition includes Ibn al-Haytham's objections and the Maragha-school models of Ibn al-Shatir and Mu'ayyad al-Din al-Urdi; al-Halabi cites the latter two directly {cite:heinen-islamic-cosmology p. 32} {cite:tdv-ibnun-nakib-el-halebi}."
