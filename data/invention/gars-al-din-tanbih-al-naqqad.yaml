id: invention/gars-al-din-tanbih-al-naqqad
class: invention
label: { ar: "تنبيه النقاد على ما في الهيئة المشهورة عند غرس الدين الحلبي", en: "Gars al-Din al-Halabi's Tanbih al-naqqad critique of the famous hay'a", ur: "غرس الدین حلبی کی مشہور ہیئت پر تنبیہُ النقاد", es: "Crítica de Tanbih al-naqqad de Gars al-Din al-Halabi a la famosa hay'a" }
names:
  - { value: "Tanbih al-naqqad 'ala ma fi al-hay'a al-mashhura min al-fasad", kind: alternate, lang: ar }
  - { value: "Tanbih al-naqqad", kind: alternate, lang: en }
summary:
  ar: "رسالة في تنقيح الهيئة الفلكية المشهورة ألّفها غرس الدين بن أحمد بن خليل الحلبي سنة 958هـ، فنقد فيها مبادئ بطلمية — كالإكوان والدائرة المائلة — واستند إلى ابن الشاطر ومؤيد الدين العرضي، وذكر اختلاف أقطار الكواكب المرصودة عن الموجود في النظرية {cite:heinen-islamic-cosmology p. 31} {cite:heinen-islamic-cosmology p. 32} {cite:tdv-ibnun-nakib-el-halebi}."
  en: "A treatise revising the famous astronomical hay'a composed by Gars al-Din ibn Ahmad ibn Khalil al-Halabi in 958 AH; it criticises Ptolemaic principles such as the equant and eccentric deferents, draws on Ibn al-Shatir and Mu'ayyad al-Din al-Urdi, and notes discrepancies between observed planetary diameters and the prevailing theory {cite:heinen-islamic-cosmology p. 31} {cite:heinen-islamic-cosmology p. 32} {cite:tdv-ibnun-nakib-el-halebi}."
  ur: "غرس الدین بن احمد بن خلیل حلبی کا 958ھ میں لکھا گیا رسالہ جس میں مشہور فلکی ہیئت کی تنقیح کی گئی؛ اس میں ایکوائنٹ اور مائل دائرے جیسے بطلیموسی اصولوں پر تنقید کی، ابن الشاطر اور مؤید الدین عرضی سے استدلال کیا اور مشاہدہ شدہ سیاروں کے اقطار کا نظریہ سے اختلاف بیان کیا {cite:heinen-islamic-cosmology p. 31} {cite:heinen-islamic-cosmology p. 32} {cite:tdv-ibnun-nakib-el-halebi}۔"
  es: "Un tratado que revisa la famosa hay'a astronómica compuesta por Gars al-Din ibn Ahmad ibn Khalil al-Halabi en 958 AH; critica principios ptolemaicos como los deferentes equidimensionales y excéntricos, se basa en Ibn al-Shatir y Mu'ayyad al-Din al-Urdi, y señala discrepancias entre los diámetros planetarios observados y la teoría predominante {cite:heinen-islamic-cosmology p. 31} {cite:heinen-islamic-cosmology p. 32} {cite:tdv-ibnun-nakib-el-halebi}."
