impact:
  fields: [astronomy-instruments]
  changed:
    ar: "حوّل نقد الهيئة الفلكية إلى فحص تجريبي للنماذج مقابل الرصد، بالنقل عن البدائل المعدّلة وملاحظة اختلاف الأقطار {cite:heinen-islamic-cosmology p. 32}."
    en: "Turned critique of the astronomical hay'a into an empirical check of models against observation, by citing revised alternatives and noting diameter discrepancies {cite:heinen-islamic-cosmology p. 32}."
    ur: "فلکی ہیئت کی تنقید کو نمونوں کی مشاہدے سے جانچ میں بدل دیا، متبادل نمونوں کے حوالوں اور اقطار کے اختلاف کی نشاندہی سے {cite:heinen-islamic-cosmology p. 32}۔"
  history:
    ar: "شاهد على استمرار النقد الفلكي في الأوساط العثمانية-الشامية المتأخرة، وعلى 관심 مؤرخ الكوزمولوجيا الإسلامية بهذا النص ضمن مراجع السيوطي {cite:heinen-islamic-cosmology pp. 31-33}."
    en: "A witness to the continuation of astronomical criticism in late Syrian-Ottoman circles, and to the historian's interest in the text within the sources of al-Suyuti's cosmology {cite:heinen-islamic-cosmology pp. 31-33}."
    ur: "متاخر شامی-عثمانی حلقوں میں فلکی تنقید کے تسلسل اور سيوطی کی کائناتیات کے ماخذ میں اس متن میں مورخ کی دلچسپی کی گواہی {cite:heinen-islamic-cosmology pp. 31-33}۔"
  significance: 3
  why: "A dated, surviving-colophon critical treatise on Ptolemaic astronomy with explicit model revision and observational comparison; bounded to this text, not a claim of founding modern astronomy."
