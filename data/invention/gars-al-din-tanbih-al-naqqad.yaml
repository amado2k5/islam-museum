today:
  form:
    ar: "نموذج تاريخي لنص نقدي فلكي؛ الصورة المعروضة صفحة من مخطوط فلكي إسلامي من مجموعة خالدية، سياقية لتقليد المخطوطات الفلكية ولا هي صفحة من تنبيه النقاد {cite:commons-khalili-jaghmini-mss1164 Description}."
    en: "Historical example of an astronomical-critical text; the displayed image is a page from an Islamic astronomical manuscript in the Khalili collection — contextual for the astronomical-manuscript tradition, not a page of Tanbih al-naqqad {cite:commons-khalili-jaghmini-mss1164 Description}."
    ur: "فلکی تنقیدی متن کی تاریخی مثال؛ دکھائی گئی تصویر خالدیہ مجموعے میں ایک اسلامی فلکی مخطوطہ کا صفحہ ہے — فلکی مخطوطوں کی روایت کا سیاقی نمونہ، تنبیہ النقاد کا صفحہ نہیں {cite:commons-khalili-jaghmini-mss1164 Description}۔"
  descendants:
    ar: "لا نثبت من المصادر المقروءة انتقالاً مباشراً إلى الفلك الحديث، لكن النص جزء من سلسلة انتقاد بطليموس الممتدة {cite:heinen-islamic-cosmology p. 32}."
    en: "The sources read establish no direct transmission to modern astronomy, but the text belongs to the continuing chain of Ptolemaic criticism {cite:heinen-islamic-cosmology p. 32}."
    ur: "پڑھے ماخذ جدید فلکیات تک براہ راست منتقلی ثابت نہیں کرتے، مگر یہ متن بطلیموس پر جاری تنقید کی کڑی کا حصہ ہے {cite:heinen-islamic-cosmology p. 32}۔"
