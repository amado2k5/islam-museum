    note: "Ibn Abd al-Hakam dates Maslama's order to build minarets for the mosques of Egypt to 53 AH {cite:futuh-misr-amir-1999 p. 179}. Yeomans dates the enlargement of the Mosque of Amr with its corner minarets to 673 {cite:yeomans-islamic-cairo-2006 p. 20}, and the TDV entry gives 53/673 {cite:tdv-minare ¶2}; the Gregorian year is the sources' own, not a conversion."
