kids:
  ar: "قبل نحو ألف وأربعمئة سنة، كان المؤذن يصعد عموداً أو سطحاً ليُسمع الناس الأذان. ثم بنى والي مصر مسلمة بن مخلد أبراجاً صغيرة في أركان جامع عمرو بالفسطاط ليصعدها المؤذن. ومن هذه الأبراج جاءت كل المآذن التي تراها اليوم."
  en: "About fourteen hundred years ago, the muezzin climbed a pillar or a roof so that people could hear the call to prayer. Then Maslama ibn Mukhallad, the governor of Egypt, built small towers at the corners of the Mosque of Amr in Fustat for the muezzin to climb. Every minaret you see today comes from those towers."
  ur: "تقریباً چودہ سو سال پہلے مؤذن کسی ستون یا چھت پر چڑھتا تھا تاکہ لوگ اذان سن سکیں۔ پھر مصر کے والی مسلمہ بن مخلد نے فسطاط کی جامع عمرو کے کونوں پر چھوٹے برج بنوائے تاکہ مؤذن ان پر چڑھے۔ آج آپ جو بھی مینار دیکھتے ہیں وہ انہی برجوں سے آیا ہے۔"
