summary:
  ar: "برج يُبنى في الجامع أو إلى جانبه ليصعده المؤذن فيرفع الأذان من فوقه. تذكر المصادر أن أول من أقامه مسلمة بن مخلد الأنصاري، والي معاوية على مصر، حين زاد في جامع عمرو بن العاص بالفسطاط سنة 53هـ ⁦(673م)⁩، فجعل له المنار ولم يكن قبل ذلك، ثم أمر ببناء المنار في مساجد مصر؛ ومن هذه الأبراج الركنية القصيرة نشأت مآذن العالم الإسلامي كلها."
  en: "A tower built in or beside a mosque, which the muezzin climbs to give the call to prayer from above. The sources name Maslama ibn Mukhallad al-Ansari, Mu'awiya's governor of Egypt, as the first to build one: when he enlarged the Mosque of Amr ibn al-As at Fustat in 53 AH (673 CE) he gave it minarets where there had been none, then ordered minarets for the mosques of Egypt. The minarets of the whole Islamic world grew from these short corner towers."
  ur: "مسجد کے اندر یا اس کے پہلو میں بنایا جانے والا ایک برج جس پر مؤذن چڑھ کر اوپر سے اذان دیتا ہے۔ مآخذ کے مطابق اسے سب سے پہلے معاویہ کے والیِ مصر مسلمہ بن مخلد انصاری نے بنوایا: جب انہوں نے 53ھ (673ء) میں فسطاط کی جامع عمرو بن العاص کو وسیع کیا تو اس میں منار بنوائے جو پہلے نہیں تھے، پھر مصر کی مسجدوں کے لیے منار بنانے کا حکم دیا۔ عالمِ اسلام کے سارے مینار انہی چھوٹے کونے کے برجوں سے نکلے۔"
