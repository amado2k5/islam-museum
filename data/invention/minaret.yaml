origin:
  place: place/al-fustat
  context:
    ar: "بنى عمرو بن العاص مسجده بالفسطاط بعد فتح مصر صغيراً من اللبن وجذوع النخل، بلا محراب ولا صحن ولا منار، على هيئة المسجد النبوي الأول. وفي ولاية مسلمة بن مخلد لمصر والمغرب من قِبل معاوية كثر المسلمون حتى ضاق عنهم المسجد، فزاد فيه مسلمة وجعل له المنار. وكان في زمن النبي موضع في المسجد النبوي يُعرف بالأسطوانة يصعده بلال بالحبل ليؤذن، ومواضع عالية حول المسجد يُؤذَّن منها."
    en: "After the conquest of Egypt, Amr ibn al-As built his mosque at Fustat small, of mud-brick and palm trunks, with no mihrab, no courtyard and no minaret, much like the first Prophet's Mosque. When Maslama ibn Mukhallad governed Egypt and the Maghrib for Mu'awiya, the Muslims had grown too many for it, so Maslama enlarged it and gave it minarets. In the Prophet's time there had been a place in the Prophet's Mosque called the ustuwana, which Bilal climbed by a rope to give the call, and high places around the mosque were used too."
    ur: "فتحِ مصر کے بعد عمرو بن العاص نے فسطاط میں اپنی مسجد کچی اینٹوں اور کھجور کے تنوں سے چھوٹی سی بنائی، جس میں نہ محراب تھی نہ صحن نہ منار، بالکل پہلی مسجدِ نبوی کی طرح۔ جب مسلمہ بن مخلد معاویہ کی طرف سے مصر اور مغرب کے والی ہوئے تو مسلمان اتنے بڑھ گئے تھے کہ مسجد تنگ پڑ گئی، چنانچہ مسلمہ نے اسے وسیع کیا اور اس میں منار بنوائے۔ نبی کے زمانے میں مسجدِ نبوی میں اسطوانہ نام کی ایک جگہ تھی جس پر بلال رسی کے سہارے چڑھ کر اذان دیتے تھے، اور مسجد کے آس پاس کی اونچی جگہیں بھی استعمال ہوتی تھیں۔"
makers:
  - person: person/maslama-ibn-mukhallad-al-ansari
    role: commissioner
    place: place/al-fustat
    note: "Governor of Egypt and the Maghrib for Mu'awiya. He enlarged the Mosque of Amr and gave it minarets where there had been none (al-Maqrizi), then had the people of Egypt build minarets for their mosques in 53 AH, with his name written on them (Ibn Abd al-Hakam); Ibn al-Sakan calls him the first to set the building of minarets on the people of Egypt (Ibn Hajar). The sources say he ordered the minarets; the builders are not named, so his role is recorded as commissioner. Yeomans says the enlargement was made on Mu'awiya's orders."
    sources: [source/futuh-misr-amir-1999, source/khitat-maqrizi-1998, source/ibn-hajar-isaba, source/yeomans-islamic-cairo-2006]
attribution:
  status: original
  claim:
    ar: "مسلمة بن مخلد أول من أقام المنار في جامع، إذ جعله لجامع عمرو بالفسطاط سنة 53هـ ولم يكن له قبل ذلك منار، ثم أمر ببنائه في مساجد مصر."
    en: "Maslama ibn Mukhallad was the first to give a mosque minarets: he built them at the Mosque of Amr in Fustat in 53 AH, where there had been none before, then ordered them for the mosques of Egypt."
    ur: "مسلمہ بن مخلد پہلے شخص ہیں جنہوں نے کسی مسجد میں منار بنوائے: 53ھ میں فسطاط کی جامع عمرو میں، جہاں پہلے کوئی منار نہ تھا، پھر مصر کی مسجدوں کے لیے ان کا حکم دیا۔"
  basis:
    ar: "تتفق المصادر المقروءة على أوّليته: ابن عبد الحكم يؤرخ أمره ببناء المنار سنة 53هـ، والمقريزي يقول إنه جعل للجامع المنار «ولم يكن قبل ذلك»، وابن حجر ينقل عن ابن السكن أنه «أول من جعل على أهل مصر بنيان المنار»، ويرى كريزويل فيما نقله يومانز أن هذا أول ذكر مسجَّل لبناء المآذن، وتقول موسوعة TDV إن مسلمة أول من أضاف مئذنة إلى جامع. وأسطوانة بلال والمواضع العالية قبلها أماكن للأذان لا أبراج مبنية له."
    en: "The sources read agree on his priority. Ibn Abd al-Hakam dates his order to 53 AH. Al-Maqrizi says he gave the mosque minarets 'and there were none before that'. Ibn Hajar reports Ibn al-Sakan's words that he was 'the first to set the building of minarets on the people of Egypt'. Creswell, as Yeomans reports, calls this the first recorded reference to building minarets, and the TDV entry says Maslama was the first to add a minaret to a mosque. Bilal's ustuwana and the high places before it were spots for the call, not towers built for it."
    ur: "پڑھے گئے مآخذ ان کی اولیت پر متفق ہیں۔ ابن عبد الحکم ان کے حکم کی تاریخ 53ھ دیتے ہیں۔ مقریزی کہتے ہیں کہ انہوں نے جامع میں منار بنوائے «اور اس سے پہلے نہیں تھے»۔ ابن حجر ابن السکن کا قول نقل کرتے ہیں کہ وہ «اہلِ مصر پر منار کی تعمیر لازم کرنے والے پہلے شخص» تھے۔ یومنز کے بقول کریزویل اسے مینار بنانے کا پہلا درج شدہ ذکر کہتے ہیں، اور TDV کا مقالہ کہتا ہے کہ مسلمہ پہلے شخص تھے جنہوں نے کسی جامع میں مینار کا اضافہ کیا۔ اس سے پہلے بلال کا اسطوانہ اور اونچی جگہیں اذان کے مقامات تھے، اس کے لیے بنائے گئے برج نہیں۔"
  perspectives: []
precursors:
  - external:
      ar: "أسطوانة بلال في المسجد النبوي"
      en: "Bilal's ustuwana in the Prophet's Mosque"
      ur: "مسجدِ نبوی میں بلال کا اسطوانہ"
    note: "TDV: in the Prophet's time a place on the qibla side of the Prophet's Mosque called the ustuwana, which Bilal climbed by a rope to give the call, could be thought of as the first form of the minaret; high places around the mosque were used as well."
    sources: [source/tdv-minare]
  - external:
      ar: "الأبراج في أركان سور معبد دمشق القديم"
      en: "The corner towers of the old temple enclosure at Damascus"
      ur: "دمشق کے پرانے معبد کی چار دیواری کے کونوں کے برج"
    note: "Yeomans reports Creswell's view that Maslama's corner minarets were probably modelled on the corner towers of the Roman temenos that formed the outer walls of the Great Mosque at Damascus."
    sources: [source/yeomans-islamic-cairo-2006]
  - external:
      ar: "أبراج المراقبة والإشارة والمنارات البحرية"
      en: "Watch, signal and lighthouse towers"
      ur: "نگرانی، اشارے اور روشنی کے مینار"
    note: "TDV lists differing views that trace the minaret to the signal and fire towers of Central Asia and Iran, the watch and bell towers of Syria, the lighthouses of the Mediterranean or Indian victory monuments; the word manara itself means a place where light or fire appears. These are views on the form's origin, not a line the sources draw to Maslama."
    sources: [source/tdv-minare]
dependents:
  - external:
      ar: "مآذن الجامع الأموي بدمشق"
      en: "The minarets of the Umayyad Mosque of Damascus"
      ur: "دمشق کی جامع اموی کے مینار"
    note: "TDV: when Syrian churches became mosques their bell towers became minarets, which gave rise to square minarets under the Umayyads; the lower parts of the two southern minarets of the Umayyad Mosque of Damascus (705–714) belonged to the old Church of St John."
    sources: [source/tdv-minare]
  - external:
      ar: "مئذنة جامع القيروان"
      en: "The minaret of the Great Mosque of Qayrawan"
      ur: "قیروان کی جامع مسجد کا مینار"
    note: "TDV: the three-storey, 31.5-metre minaret of the Sidi Uqba mosque at Qayrawan (105/724) is the oldest in the Maghrib."
    sources: [source/tdv-minare]
  - external:
      ar: "مئذنة جامع ابن طولون"
      en: "The minaret of the Mosque of Ibn Tulun"
      ur: "جامع ابن طولون کا مینار"
    note: "TDV: square in its first storey, round in its second and octagonal in a later third, it shows Syrian and Samarran traces and influenced the arts of Spain and the Maghrib."
    sources: [source/tdv-minare]
  - external:
      ar: "المآذن العثمانية الكلاسيكية"
      en: "The classical Ottoman minarets"
      ur: "کلاسیکی عثمانی مینار"
    note: "TDV: the minaret became one of the main elements of religious architecture and reached its most mature form in the classical Ottoman period (16th–17th centuries)."
    sources: [source/tdv-minare]
spread: []
impact:
  fields: [architecture-building, institutions-systems]
  changed:
    ar: "صار للأذان موضع مبني ثابت فوق المسجد بعد أن كان يُرفع من أسطوانة أو سطح قريب. وفي الفسطاط صار المؤذنون يؤذنون أولاً في الجامع ثم يؤذن أهل المساجد كلها معاً، وكان شرحبيل بن عامر أول من صعد منار مصر للأذان."
    en: "The call to prayer gained a fixed, built place above the mosque, where before it had been given from a pillar or a nearby roof. In Fustat the muezzins of the congregational mosque called first, then those of all the other mosques called together; Shurahbil ibn Amir was the first to climb the minaret of Egypt for the call."
    ur: "اذان کو مسجد کے اوپر ایک مستقل، تعمیر شدہ جگہ مل گئی، جبکہ پہلے وہ کسی ستون یا قریب کی چھت سے دی جاتی تھی۔ فسطاط میں پہلے جامع کے مؤذن اذان دیتے، پھر باقی سب مسجدوں کے مؤذن ایک ساتھ اذان دیتے؛ شرحبیل بن عامر پہلے شخص تھے جو اذان کے لیے مصر کے منار پر چڑھے۔"
  history:
    ar: "انتشرت المئذنة في الشام والمغرب ومصر والعراق وإيران وآسيا الوسطى والأناضول والهند بأشكال مربعة ومستديرة ومثمنة، وصارت أبرز علامة للمسجد في المدينة الإسلامية، وبلغت أعلاها 107 أمتار في جامع الأمير عبد القادر بالجزائر سنة 1971."
    en: "The minaret spread through Syria, the Maghrib, Egypt, Iraq, Iran, Central Asia, Anatolia and India in square, round and octagonal forms, and became the clearest sign of a mosque in the Islamic city; the tallest, at 107 metres, is at the Emir Abdelkader Mosque in Algeria, built in 1971."
    ur: "مینار شام، مغرب، مصر، عراق، ایران، وسطی ایشیا، اناطولیہ اور ہندوستان میں چوکور، گول اور ہشت پہلو شکلوں میں پھیلا اور اسلامی شہر میں مسجد کی سب سے نمایاں علامت بن گیا؛ سب سے اونچا، 107 میٹر، الجزائر کی جامع امیر عبد القادر میں ہے جو 1971ء میں بنی۔"
  significance: 4
  why: "The first towers built for the call to prayer, from which every later minaret in the Islamic world descends; the form became the defining sign of the mosque."
