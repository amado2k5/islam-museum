today:
  form:
    ar: "برج يقوم من قاعدة ⁦(كرسي)⁩ وجذع وشرفة أو أكثر يدور فيها المؤذن، وتعلوه قمة مخروطية أو قبة."
    en: "A tower that rises from a base through a shaft to one or more balconies where the muezzin walks round to call, topped by a cone or a small dome."
    ur: "ایک برج جو کرسی (بنیاد) سے تنے کے ذریعے ایک یا زیادہ بالکونیوں تک اٹھتا ہے جہاں مؤذن گھوم کر اذان دیتا ہے، اور اوپر مخروطی ٹوپی یا چھوٹا گنبد ہوتا ہے۔"
  descendants:
    ar: "ما زالت المئذنة أبرز ما يميّز الجامع، وتوجد أيضاً في المدارس والترب والخانقاوات، من القاهرة والقيروان وإسطنبول إلى بخارى ودلهي، وأعلاها بُني سنة 1971."
    en: "The minaret is still the most characteristic element of the mosque, and is found on madrasas, tombs and Sufi lodges too, from Cairo, Qayrawan and Istanbul to Bukhara and Delhi; the tallest was built in 1971."
    ur: "مینار آج بھی مسجد کی سب سے نمایاں پہچان ہے، اور مدرسوں، مقبروں اور خانقاہوں پر بھی ملتا ہے، قاہرہ، قیروان اور استنبول سے بخارا اور دہلی تک؛ سب سے اونچا 1971ء میں بنا۔"
