kids:
  ar: "قد يساعد شكلان على حل سؤال عن عدد مجهول. نظم الخيام مسائل مكعبة باستخدام تقاطع المنحنيات، لكنه لم يبدأ من فراغ. نبحث عن التقاطع الصحيح، ولا نفترض أن نقطة الأصل حل لمجرد أن المنحنيين يمران بها."
  en: "Two shapes can help answer a question about an unknown number. Khayyam organized cubic problems using curve intersections, building on earlier work. We need the right intersection: the origin is not automatically a solution just because both curves pass through it."
  ur: "دو شکلیں نامعلوم عدد کا سوال حل کرنے میں مدد دے سکتی ہیں۔ خیام نے پہلے کام پر تعمیر کرتے ہوئے منحنی تقاطع سے مکعب مسائل منظم کیے۔ درست تقاطع چاہیے؛ دونوں منحنیوں کا مبدا سے گزرنا اسے خود بخود حل نہیں بناتا۔"
