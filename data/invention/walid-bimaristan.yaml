today:
  form:
    ar: "لم يبق من دار الوليد أثر معروف، ولا تسمّي المصادر التي قُرئت موضعها. وبقي البيمارستان مؤسسة في المدن الإسلامية، وتذكر موسوعة TDV أن العالم العربي اليوم يسمّيه «المستشفى» {cite:tdv-bimaristan introduction}."
    en: "No known trace of al-Walid's house survives, and the sources read do not name its site. The bimaristan lived on as an institution in Muslim cities, and the TDV entry notes that the Arab world today calls it mustashfa {cite:tdv-bimaristan introduction}."
    ur: "ولید کے گھر کا کوئی معلوم نشان باقی نہیں، اور جو مآخذ پڑھے گئے وہ اس کی جگہ نہیں بتاتے۔ بیمارستان مسلم شہروں میں ایک ادارے کے طور پر باقی رہا، اور ٹی ڈی وی کے مطابق آج عرب دنیا اسے «مستشفیٰ» کہتی ہے {cite:tdv-bimaristan introduction}۔"
  descendants:
    ar: "بيمارستانات بغداد والفسطاط ودمشق والقاهرة ودور الشفاء السلجوقية والعثمانية، ومنها بيمارستان نور الدين في دمشق الذي ما زال قائماً {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    en: "The bimaristans of Baghdad, Fustat, Damascus and Cairo and the Seljuk and Ottoman houses of healing, among them the Nur al-Din bimaristan in Damascus, which still stands {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    ur: "بغداد، فسطاط، دمشق اور قاہرہ کے بیمارستان اور سلجوقی اور عثمانی دار الشفاء، جن میں دمشق کا نور الدین بیمارستان بھی ہے جو آج بھی کھڑا ہے {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}۔"
