era:
  origins: first-century
  first_attested:
    edtf: "0706/0707"
    hijri: "0088"
    calendar: julian
    precision: year
    status: historical
    derived: true
    note: "Al-Maqrizi dates the building to the year 88 {cite:khitat-maqrizi-1998 p. 2336}, and the TDV entry gives 88 (707) {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}. The Hijri year 88 ran from late 706 to late 707 CE, so the Gregorian range is a conversion and is marked derived."
    sources: [source/khitat-maqrizi-1998, source/tdv-bimaristan]
  status_today: transformed
origin:
  polity: polity/umayyad-caliphate
  context:
    ar: "ولي الوليد الخلافة بعهد من أبيه عبد الملك في شوال سنة 86هـ، وفي سنة 87هـ شرع في بناء جامع دمشق وكتب بتوسيع المسجد النبوي {cite:tarikh-khulafa-minhaj-1434 p. 367}. وكانت همّته في البناء، فبنى المساجد ووضع المنائر، وفي عهده فُتحت الأندلس والهند والسند وأقاليم من بلاد العجم {cite:bidaya-ilmiyya-v5 p. 176}. في هذا العهد من العمارة والدولة المستقرة ينقل المقريزي بناء أول مارستان في الإسلام، ومعه أول دار للضيافة {cite:khitat-maqrizi-1998 p. 2336}."
    en: "Al-Walid came to the caliphate on his father Abd al-Malik's nomination in Shawwal 86 AH, and in 87 AH he began building the Great Mosque of Damascus and ordered the Prophet's Mosque enlarged {cite:tarikh-khulafa-minhaj-1434 p. 367}. Building was his passion: he built mosques and set up minarets, and in his reign al-Andalus, India, Sind and lands of Persia were conquered {cite:bidaya-ilmiyya-v5 p. 176}. It is in this reign of building and settled rule that al-Maqrizi places the first maristan in Islam, together with the first guest house {cite:khitat-maqrizi-1998 p. 2336}."
    ur: "ولید اپنے والد عبد الملک کی نامزدگی سے شوال 86ھ میں خلیفہ بنے، اور 87ھ میں انہوں نے دمشق کی جامع مسجد کی تعمیر شروع کی اور مسجدِ نبوی کی توسیع کا حکم لکھا {cite:tarikh-khulafa-minhaj-1434 p. 367}۔ تعمیر ان کا شوق تھا: انہوں نے مسجدیں بنوائیں اور منارے کھڑے کیے، اور ان کے دور میں اندلس، ہند، سندھ اور عجم کے کئی علاقے فتح ہوئے {cite:bidaya-ilmiyya-v5 p. 176}۔ تعمیر اور مستحکم حکومت کے اسی دور میں مقریزی اسلام کے پہلے مارستان کو رکھتے ہیں، اور اس کے ساتھ پہلے مہمان خانے کو بھی {cite:khitat-maqrizi-1998 p. 2336}۔"
makers:
  - person: person/al-walid-ibn-abd-al-malik
    role: commissioner
    note: "Umayyad caliph 86–96 AH. Al-Maqrizi names him the first to build a maristan in Islam, in 88 AH, with salaried physicians, the confinement of lepers and allowances for lepers and the blind. Al-Mada'ini (via Ibn Kathir) and al-Suyuti record his provision for lepers, the chronically disabled and the blind; al-Suyuti also quotes those who called him harsh and unjust. The physicians who worked in it are not named in the sources read."
    sources: [source/khitat-maqrizi-1998, source/bidaya-ilmiyya-v5, source/tarikh-khulafa-minhaj-1434, source/tdv-bimaristan]
attribution:
  status: contested
  claim:
    ar: "الوليد بن عبد الملك أول من بنى المارستان في الإسلام، سنة 88هـ."
    en: "Al-Walid ibn Abd al-Malik was the first to build a maristan in Islam, in 88 AH."
    ur: "ولید بن عبد الملک اسلام میں مارستان بنانے والے پہلے شخص تھے، 88ھ میں۔"
  basis:
    ar: "الدعوى بنصّها للمقريزي في «الخطط»، وهو يورد قبلها أخباراً عن أول من عمل البيمارستانات قبل الإسلام، فينسبها إلى ملك قبطي أسطوري وإلى بقراط {cite:khitat-maqrizi-1998 p. 2336}. أما المصادر الأقدم التي قُرئت، وهي رواية المدائني عند ابن كثير وترجمة السيوطي، فتذكر عطاء الوليد للمجذومين والزمنى والعميان، ولا تذكر بناءً ولا أطباء {cite:bidaya-ilmiyya-v5 p. 176} {cite:tarikh-khulafa-minhaj-1434 p. 367}. وتجعل موسوعة TDV خيمة رفيدة في الخندق أول بيمارستان، ثم تنقل قول المقريزي في الوليد دون أن توفّق بينهما {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}. فالخلاف في الأولية وفي هيئة المنشأة، لا في أن الوليد رتّب للمرضى والعجزة."
    en: "The claim in these words is al-Maqrizi's, in his Khitat, where he first gives reports of who made the earliest hospitals before Islam, naming a legendary Coptic king and Hippocrates {cite:khitat-maqrizi-1998 p. 2336}. The older sources that were read, al-Mada'ini's report in Ibn Kathir and al-Suyuti's biography, describe al-Walid's gifts to lepers, the chronically disabled and the blind, but mention neither a building nor physicians {cite:bidaya-ilmiyya-v5 p. 176} {cite:tarikh-khulafa-minhaj-1434 p. 367}. The TDV encyclopedia makes Rufayda's tent at the Trench the first bimaristan, then reports al-Maqrizi on al-Walid without reconciling the two {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}. The disagreement is about priority and about what kind of establishment it was, not about al-Walid having provided for the sick and disabled."
    ur: "ان الفاظ میں دعویٰ مقریزی کا ہے، الخطط میں، جہاں وہ اس سے پہلے اسلام سے قبل کے پہلے شفاخانوں کی روایتیں دیتے ہیں اور انہیں ایک افسانوی قبطی بادشاہ اور بقراط سے منسوب کرتے ہیں {cite:khitat-maqrizi-1998 p. 2336}۔ جو پرانے مآخذ پڑھے گئے، یعنی ابن کثیر میں مدائنی کی روایت اور سیوطی کا ترجمہ، وہ ولید کے جذامیوں، اپاہجوں اور نابیناؤں کو دیے گئے عطیات کا ذکر کرتے ہیں، مگر نہ کسی عمارت کا ذکر کرتے ہیں نہ طبیبوں کا {cite:bidaya-ilmiyya-v5 p. 176} {cite:tarikh-khulafa-minhaj-1434 p. 367}۔ ٹی ڈی وی انسائیکلوپیڈیا خندق میں رفیدہ کے خیمے کو پہلا بیمارستان کہتا ہے، پھر ولید کے بارے میں مقریزی کا قول نقل کرتا ہے اور دونوں میں تطبیق نہیں دیتا {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}۔ اختلاف اولیت اور ادارے کی نوعیت میں ہے، اس میں نہیں کہ ولید نے بیماروں اور معذوروں کا انتظام کیا۔"
  perspectives:
    - tradition: sunni
      id: sunni-maqrizi
      standing: main
      summary:
        ar: "يقول المقريزي في «الخطط» إن أول من بنى المارستان في الإسلام ودار المرضى هو الوليد بن عبد الملك سنة 88هـ، وإنه جعل فيه الأطباء وأجرى عليهم الأرزاق، وأمر بحبس المجذومين لئلا يخرجوا، وأجرى عليهم وعلى العميان الأرزاق؛ ويضيف أنه أول من عمل دار الضيافة."
        en: "Al-Maqrizi says in his Khitat that the first to build a maristan, a house for the sick, in Islam was al-Walid ibn Abd al-Malik in 88 AH: he placed physicians in it on paid allowances, ordered the lepers confined so that they would not go out, and gave allowances to them and to the blind. He adds that al-Walid was also the first to set up a guest house."
        ur: "مقریزی الخطط میں کہتے ہیں کہ اسلام میں مارستان، یعنی بیماروں کا گھر، سب سے پہلے ولید بن عبد الملک نے 88ھ میں بنایا: اس میں طبیب مقرر کیے اور ان کے وظیفے جاری کیے، جذامیوں کو روک کر رکھنے کا حکم دیا تاکہ وہ باہر نہ نکلیں، اور ان کے اور نابیناؤں کے لیے وظیفے مقرر کیے۔ وہ مزید کہتے ہیں کہ ولید ہی نے سب سے پہلے مہمان خانہ بنایا۔"
      holders: [person/al-maqrizi]
      sources: [source/khitat-maqrizi-1998]
    - tradition: sunni
      id: sunni-madaini-ibn-kathir-suyuti
      standing: secondary
      summary:
        ar: "يروي ابن كثير عن ابن جرير عن المدائني أن الوليد كان عند أهل الشام أفضل خلفائهم، وأنه أعطى المجذومين وقال لهم: لا تسألوا الناس، وأعطى كل مقعد خادماً وكل ضرير قائداً؛ ويذكر السيوطي أنه رتّب للزمنى من يخدمهم وللأضراء من يقودهم ورزق الفقهاء والفقراء والضعفاء. وهذه الأخبار تصف عطاءً منظّماً للعجزة، ولا تسمّي مارستاناً ولا أطباء."
        en: "Ibn Kathir reports from Ibn Jarir, from al-Mada'ini, that the people of Syria held al-Walid the best of their caliphs, that he gave to the lepers and told them not to beg, and gave every person unable to walk a servant and every blind person a guide. Al-Suyuti says he assigned attendants to the chronically ill and guides to the blind and gave stipends to scholars, the poor and the weak. These reports describe organised provision for the disabled; they name no maristan and no physicians."
        ur: "ابن کثیر، ابن جریر کے واسطے سے مدائنی سے روایت کرتے ہیں کہ اہلِ شام ولید کو اپنے خلفاء میں سب سے بہتر سمجھتے تھے، اور یہ کہ انہوں نے جذامیوں کو عطیہ دیا اور ان سے کہا کہ لوگوں سے نہ مانگو، اور ہر اپاہج کو ایک خادم اور ہر نابینا کو ایک رہنما دیا۔ سیوطی لکھتے ہیں کہ انہوں نے دائمی مریضوں کے لیے خدمت گار اور نابیناؤں کے لیے رہنما مقرر کیے اور علماء، فقیروں اور کمزوروں کے وظیفے جاری کیے۔ یہ روایتیں معذوروں کے لیے ایک منظم امداد بیان کرتی ہیں؛ ان میں نہ کسی مارستان کا نام ہے نہ طبیبوں کا۔"
      holders: [person/ibn-kathir, person/al-suyuti]
      sources: [source/bidaya-ilmiyya-v5, source/tarikh-khulafa-minhaj-1434]
    - tradition: academic
      id: academic-tdv
      standing: main
      summary:
        ar: "تبدأ موسوعة TDV الإسلامية تاريخ البيمارستانات بخيمة رفيدة في غزوة الخندق وتسمّيها أول بيمارستان في الإسلام، ثم تنقل قول المقريزي في الوليد سنة 88هـ/707م، وقول بستان زاده يحيى أفندي بلا مصدر إن الوليد أول من بنى مستشفيات لأمراض العقل والبدن، وقول ابن دقماق إن دار أبي زبيد في زقاق القناديل بالفسطاط حُوّلت في العهد الأموي إلى بيمارستان؛ ولا تحسم بين هذه الأقوال."
        en: "The TDV Encyclopedia of Islam opens the history of the bimaristans with Rufayda's tent at the Trench and calls it the first bimaristan in Islam. It then reports al-Maqrizi on al-Walid in 88/707; the Ottoman historian Bostanzade Yahya Efendi's statement, without a source, that al-Walid was the first to build hospitals for diseases of the mind and body; and Ibn Duqmaq's report that the house of Abu Zubayd in the lane of the lamps at Fustat was turned into a bimaristan under the Umayyads. It does not decide between them."
        ur: "ٹی ڈی وی اسلامی انسائیکلوپیڈیا بیمارستانوں کی تاریخ غزوۂ خندق میں رفیدہ کے خیمے سے شروع کرتا ہے اور اسے اسلام کا پہلا بیمارستان کہتا ہے۔ پھر وہ 88ھ/707ء میں ولید کے بارے میں مقریزی کا قول نقل کرتا ہے؛ عثمانی مؤرخ بستان زادہ یحییٰ افندی کا بغیر حوالے کے یہ بیان کہ ولید نے سب سے پہلے دماغی اور جسمانی بیماریوں کے شفاخانے بنوائے؛ اور ابن دقماق کی یہ روایت کہ فسطاط میں قنادیل کی گلی میں ابو زبید کا گھر اموی دور میں بیمارستان بنا دیا گیا۔ وہ ان میں فیصلہ نہیں کرتا۔"
      sources: [source/tdv-bimaristan]
precursors:
  - invention: invention/rufayda-medical-tent
    note: "The TDV entry calls Rufayda's tent in the Prophet's mosque the first bimaristan in Islam, eighty years before al-Walid's. No source read draws a line from the tent to al-Walid's establishment; they stand as two answers to the question of the first hospital."
    sources: [source/tdv-bimaristan]
  - external:
      ar: "بيمارستان جنديسابور"
      en: "The hospital of Jundishapur"
      ur: "جندی شاپور کا شفاخانہ"
    note: "TDV: the Sasanian hospital and medical school of Jundishapur, where the Prophet-era physician al-Harith ibn Kalada studied, was known as a bimaristan, which helped the word take hold among the Arabs early on; it later shaped the first Abbasid hospitals. The source does not tie it to al-Walid's."
    sources: [source/tdv-bimaristan]
  - external:
      ar: "دار المرضى المنسوبة إلى بقراط"
      en: "The house for the sick ascribed to Hippocrates"
      ur: "بقراط سے منسوب بیماروں کا گھر"
    note: "Al-Maqrizi quotes Abu Sa'id Mansur ibn Isa that Hippocrates set aside a place near his house, in a garden, for the sick, with servants to treat them, and called it by a Greek name meaning 'gathering of the sick'; TDV reads the name as xenodokeion. Al-Maqrizi gives this, and a legendary Coptic king before it, as the first hospitals before Islam."
    sources: [source/khitat-maqrizi-1998, source/tdv-bimaristan]
dependents:
  - external:
      ar: "بيمارستان هارون الرشيد في بغداد"
      en: "Harun al-Rashid's bimaristan in Baghdad"
      ur: "بغداد میں ہارون الرشید کا بیمارستان"
    note: "TDV: the first bright age of the bimaristans begun under the Umayyads came under the Abbasids; Harun al-Rashid had a hospital built in Baghdad on the Jundishapur model, headed by physicians from Jundishapur, and it served as a model for later bimaristans."
    sources: [source/tdv-bimaristan]
  - external:
      ar: "مارستان أحمد بن طولون في الفسطاط"
      en: "Ahmad ibn Tulun's maristan at Fustat"
      ur: "فسطاط میں احمد بن طولون کا مارستان"
    note: "Al-Maqrizi: built in 259 AH (al-Kindi) or 261 AH (the Tulunid biography), 'and there was no maristan in Egypt before it'. Ibn Tulun endowed shops and baths for it, spent 60,000 dinars on it, and laid down that a patient's clothes and money were kept by its trustee until he recovered; it treated the sick and held the insane. TDV dates it 872."
    sources: [source/khitat-maqrizi-1998, source/tdv-bimaristan]
  - external:
      ar: "بيمارستان نور الدين في دمشق"
      en: "The Nur al-Din bimaristan in Damascus"
      ur: "دمشق میں نور الدین کا بیمارستان"
    note: "TDV: founded by Nur al-Din Zangi in Damascus in 1154 with a Frankish king's ransom; Ibn Jubayr saw its physicians make morning rounds and prescribe medicines and food; it taught medicine and is the oldest hospital of the Seljuk age still standing in its original form."
    sources: [source/tdv-bimaristan]
  - external:
      ar: "البيمارستان المنصوري في القاهرة"
      en: "The Mansuri bimaristan of Qalawun in Cairo"
      ur: "قاہرہ میں قلاوون کا منصوری بیمارستان"
    note: "TDV: founded in Cairo in 1284 by the Mamluk sultan al-Mansur Qalawun on the model of the Nur al-Din bimaristan, with teaching and a large library; it treated every kind of patient and was still the most famous hospital of the Islamic world in the seventeenth century."
    sources: [source/tdv-bimaristan]
spread: []
impact:
  fields: [medicine-surgery, institutions-systems]
  changed:
    ar: "صار للمرضى في الدولة الإسلامية، بحسب رواية المقريزي، دار ثابتة فيها أطباء يأخذون رزقهم من الدولة، وصار للمجذومين والعميان رزق جارٍ يغنيهم عن السؤال {cite:khitat-maqrizi-1998 p. 2336} {cite:bidaya-ilmiyya-v5 p. 176}."
    en: "On al-Maqrizi's account, the sick in the Islamic state now had a fixed house with physicians paid by the state, and lepers and the blind had a regular allowance that spared them from begging {cite:khitat-maqrizi-1998 p. 2336} {cite:bidaya-ilmiyya-v5 p. 176}."
    ur: "مقریزی کی روایت کے مطابق اسلامی ریاست میں بیماروں کے لیے ایک مستقل گھر ہو گیا جس میں ریاست سے تنخواہ پانے والے طبیب تھے، اور جذامیوں اور نابیناؤں کے لیے ایک جاری وظیفہ ہو گیا جس نے انہیں مانگنے سے بے نیاز کر دیا {cite:khitat-maqrizi-1998 p. 2336} {cite:bidaya-ilmiyya-v5 p. 176}۔"
  history:
    ar: "تقول موسوعة TDV إن البيمارستانات التي بدأ إنشاؤها في العهد الأموي بلغت أول ازدهارها في عهد العباسيين، ثم انتشرت في بغداد والفسطاط ودمشق والقاهرة والأناضول، حتى صارت القاهرة ودمشق تعرفان بيمارستانات تُدرَّس فيها الطب {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    en: "The TDV encyclopedia says the bimaristans that began under the Umayyads reached their first flowering under the Abbasids, then spread through Baghdad, Fustat, Damascus, Cairo and Anatolia, until Damascus and Cairo had hospitals where medicine was taught {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    ur: "ٹی ڈی وی انسائیکلوپیڈیا کہتا ہے کہ جو بیمارستان اموی دور میں بننا شروع ہوئے وہ عباسی دور میں پہلی بار پھلے پھولے، پھر بغداد، فسطاط، دمشق، قاہرہ اور اناطولیہ میں پھیل گئے، یہاں تک کہ دمشق اور قاہرہ میں ایسے شفاخانے بنے جن میں طب پڑھائی جاتی تھی {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}۔"
  significance: 3
