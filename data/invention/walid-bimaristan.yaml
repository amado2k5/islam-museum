id: invention/walid-bimaristan
class: invention
label:
  ar: "بيمارستان الوليد بن عبد الملك"
  en: "Al-Walid ibn Abd al-Malik's bimaristan"
  ur: "ولید بن عبد الملک کا بیمارستان"
names:
  - { value: "المارستان", kind: alternate, lang: ar }
  - { value: "دار المرضى", kind: alternate, lang: ar }
  - { value: "The Umayyad hospital of 88 AH", kind: alternate, lang: en }
  - { value: "Bîmâristan", kind: alternate, lang: tr }
summary:
  ar: "دار للمرضى ينقل المقريزي أن الخليفة الأموي الوليد بن عبد الملك بناها سنة 88هـ، وقال إنه أول من بنى المارستان في الإسلام: جعل فيها الأطباء وأجرى عليهم الأرزاق، وأمر بحبس المجذومين لئلا يخرجوا، وأجرى عليهم وعلى العميان الأرزاق {cite:khitat-maqrizi-1998 p. 2336}. ويروي المدائني، فيما ينقله ابن كثير، أن الوليد أعطى المجذومين ونهاهم عن سؤال الناس، وجعل لكل مُقعد خادماً ولكل ضرير قائداً {cite:bidaya-ilmiyya-v5 p. 176}. وتعدّ موسوعة TDV خيمة رفيدة قبله أول بيمارستان، فالأولية موضع خلاف {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
  en: "A house for the sick that al-Maqrizi says the Umayyad caliph al-Walid ibn Abd al-Malik built in 88 AH, calling him the first to build a maristan in Islam: he placed physicians in it on paid allowances, ordered the lepers confined so that they would not go out, and gave allowances to them and to the blind {cite:khitat-maqrizi-1998 p. 2336}. Al-Mada'ini, as quoted by Ibn Kathir, says al-Walid gave to the lepers and told them not to beg, and gave every person unable to walk a servant and every blind person a guide {cite:bidaya-ilmiyya-v5 p. 176}. The TDV encyclopedia calls Rufayda's earlier tent the first bimaristan, so the claim to be first is disputed {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
  ur: "بیماروں کا ایک گھر جس کے بارے میں مقریزی لکھتے ہیں کہ اموی خلیفہ ولید بن عبد الملک نے اسے 88ھ میں بنوایا، اور انہیں اسلام میں مارستان بنانے والا پہلا شخص کہتے ہیں: انہوں نے اس میں طبیب مقرر کیے اور ان کے وظیفے جاری کیے، جذامیوں کو روک کر رکھنے کا حکم دیا تاکہ وہ باہر نہ نکلیں، اور ان کے اور نابیناؤں کے لیے وظیفے مقرر کیے {cite:khitat-maqrizi-1998 p. 2336}۔ ابن کثیر کی نقل کردہ مدائنی کی روایت کے مطابق ولید نے جذامیوں کو عطیہ دیا اور انہیں لوگوں سے مانگنے سے منع کیا، اور ہر اپاہج کو ایک خادم اور ہر نابینا کو ایک رہنما دیا {cite:bidaya-ilmiyya-v5 p. 176}۔ ٹی ڈی وی انسائیکلوپیڈیا اس سے پہلے رفیدہ کے خیمے کو پہلا بیمارستان کہتا ہے، اس لیے اولیت میں اختلاف ہے {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}۔"
