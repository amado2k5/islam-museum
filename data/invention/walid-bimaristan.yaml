kids:
  ar: "قبل نحو ألف وثلاثمئة سنة، كان الخليفة الوليد يحب البناء. ويقول المؤرخ المقريزي إنه بنى داراً للمرضى، وجعل فيها أطباء يعالجونهم ويأخذون أجرهم من الدولة. وأعطى الوليد كل أعمى من يقوده، وكل من لا يستطيع المشي من يخدمه، حتى لا يحتاج أحد منهم أن يسأل الناس."
  en: "About thirteen hundred years ago, the caliph al-Walid loved to build. The historian al-Maqrizi says he built a house for the sick and put doctors in it, paid by the state, to look after them. Al-Walid also gave every blind person someone to guide them and everyone who could not walk someone to help them, so that none of them had to beg."
  ur: "تقریباً تیرہ سو سال پہلے خلیفہ ولید کو عمارتیں بنانے کا شوق تھا۔ مؤرخ مقریزی بتاتے ہیں کہ انہوں نے بیماروں کے لیے ایک گھر بنایا اور اس میں ڈاکٹر رکھے جو ان کا علاج کرتے اور حکومت سے تنخواہ پاتے۔ ولید نے ہر نابینا کو ایک رہنما دیا اور ہر اس شخص کو جو چل نہیں سکتا تھا ایک مددگار دیا، تاکہ ان میں سے کسی کو لوگوں سے مانگنا نہ پڑے۔"
