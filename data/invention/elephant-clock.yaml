kids:
  ar: "في وصف المتحف، كل نصف ساعة تتحرك شخصيات الساعة وتسقط كرة، فتمر إلى إناء وتضرب ناقوساً؛ ويمكن عد الكرات لمعرفة الزمن. الفيل ليس حيواناً حياً يؤدي ذلك، بل هيئة آلة شرحها الجزري في كتاب. والصورة ورقة نسخت بعده، لا صورة لآلته الأصلية."
  en: "In the museum's account, every half hour figures move and a ball drops into a vessel and sounds a gong. Counting balls tells the elapsed time. The elephant is the form of a machine described in al-Jazari's book, not a living animal doing the work. The image is a later manuscript page, not a photograph of his original clock."
  ur: "میوزیم کے مطابق ہر نصف گھنٹے شکلیں حرکت کرتیں، گیند برتن میں گر کر ناقوس بجاتی؛ گیندیں گن کر وقت جانتے۔ ہاتھی زندہ جانور نہیں بلکہ جزری کی کتاب کی مشین کی صورت ہے۔ تصویر بعد کی نقل کا ورق ہے، اصل گھڑی کی فوٹو نہیں۔"
