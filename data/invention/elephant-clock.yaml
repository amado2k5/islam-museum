impact:
  fields: [timekeeping, mechanics-automata]
  changed:
    ar: "يجعل وصف المتحف مرور نصف الساعة حركة مرئية وصوتاً وكرة قابلة للعد، في سياق آلات للعرض والترفيه في البلاط. لا يقدم المصدر قياساً لانتشارها في بيوت العامة {cite:met-elephant-clock-575123 Catalogue Entry}."
    en: "The museum's account turns the half-hour into visible motion, sound and a countable ball, in a court-entertainment setting. It supplies no measure of adoption in ordinary households {cite:met-elephant-clock-575123 Catalogue Entry}."
    ur: "میوزیم کے بیان میں نصف گھنٹہ حرکت، آواز اور گنی جانے والی گیند بنتا ہے، درباری تفریح کے سیاق میں۔ عام گھروں میں استعمال کی مقدار ماخذ نہیں دیتا {cite:met-elephant-clock-575123 Catalogue Entry}۔"
  history:
    ar: "يحفظ الكتاب تعليمات وآثاراً مصورة للهندسة؛ وفهرسة ليوني تعد ورقة 1315م مثالاً نادراً للرسم في ذلك السياق. لا تنسب الصفحة اختراع الصناعة الحديثة لهذه الآلة {cite:met-elephant-clock-575123 Catalogue Entry}."
    en: "The book preserves engineering instructions and visual witnesses; Leoni treats the 1315 folio as an important manuscript-painting survival. The page does not credit this clock with inventing modern industry {cite:met-elephant-clock-575123 Catalogue Entry}."
    ur: "کتاب انجینئرنگ کی ہدایات اور مصور شہادت محفوظ کرتی ہے؛ لیونی 1315ء کے ورق کو اہم مصوری کا نمونہ کہتی ہیں۔ جدید صنعت کی ایجاد اس گھڑی کو نہیں دی گئی {cite:met-elephant-clock-575123 Catalogue Entry}۔"
  significance: 3
  why: "A specific, attributed automaton clock with a dated illustrated witness and a documented half-hour signalling sequence; not evidence that all clocks, robotics or modern industrial mechanisms descend from it."
