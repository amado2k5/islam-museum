  basis:
    ar: "فهرسة المتروبوليتان تنسب الآلة إلى فصل من كتاب الجزري وتشرح تتابعها. وتصف TDV الجزري مهندساً يحسن تقاليد أقدم، لا مخترع كل آلية فيه؛ لذلك لا يحمل السجل دعوى أول ساعة أو أول روبوت {cite:met-elephant-clock-575123 Catalogue Entry} {cite:tdv-cezeri pp. 505–506}."
    en: "The Met assigns the device to a chapter of al-Jazari's book and describes its sequence. TDV presents him as an engineer improving earlier traditions, not originating every mechanism; the record makes no first-clock or first-robot claim {cite:met-elephant-clock-575123 Catalogue Entry} {cite:tdv-cezeri pp. 505–506}."
    ur: "میٹ آلے کو جزری کی کتاب کے ایک باب سے منسوب اور حرکت کا سلسلہ بیان کرتا ہے۔ ٹی ڈی وی انہیں سابقہ روایت بہتر بنانے والا انجینئر کہتا ہے، ہر آلے کا اولین موجد نہیں؛ پہلے روبوٹ یا گھڑی کا دعویٰ نہیں {cite:met-elephant-clock-575123 Catalogue Entry} {cite:tdv-cezeri pp. 505–506}۔"
