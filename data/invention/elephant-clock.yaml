id: invention/elephant-clock
class: invention
label:
  ar: "ساعة الفيل عند الجزري"
  en: "Al-Jazari's elephant clock"
  ur: "جزری کی ہاتھی والی گھڑی"
names:
  - { value: "The Elephant Clock", kind: alternate, lang: en }
summary:
  ar: "ساعة آلية من كتاب الجزري، يتحرك فيها الراكب والطائر وتنتقل كرة من الصقر إلى التنين ثم إلى إناء فيه ناقوس كل نصف ساعة، بحسب فهرسة المتروبوليتان؛ وتعد الكرات المتجمعة لمعرفة الزمن {cite:met-elephant-clock-575123 Catalogue Entry}. يضع المتحف الإسهام في تطوير ساعات العرض والحيل، لا اختراع الساعة أو الروبوت. تؤرخ TDV كتابه بسنة 1205م، أما الصورة فهي ورقة من نسخة سنة 715هـ/1315م {cite:tdv-cezeri pp. 505–506} {cite:met-elephant-clock-575123 Overview}."
  en: "An automated clock in al-Jazari's book: every half hour a rider and bird move and a ball passes from falcon to dragon to a vessel containing a gong; accumulated balls indicate elapsed time in the Met's catalogue account {cite:met-elephant-clock-575123 Catalogue Entry}. The contribution is improvement of display clocks and automata, not invention of clocks or robots. TDV dates his book to 1205; the image is a folio copied in 715/1315 {cite:tdv-cezeri pp. 505–506} {cite:met-elephant-clock-575123 Overview}."
  ur: "جزری کی کتاب کی خودکار گھڑی: میٹ کی فہرست کے مطابق ہر نصف گھنٹے سوار اور پرندہ حرکت کرتے، گیند باز سے اژدہے اور پھر ناقوس والے برتن میں جاتی؛ جمع گیندوں سے گزرا وقت شمار ہوتا {cite:met-elephant-clock-575123 Catalogue Entry}۔ نسبت نمائشی گھڑی اور خودکار حیلے کی بہتری ہے، گھڑی یا روبوٹ کی ایجاد نہیں۔ ٹی ڈی وی کتاب 1205ء کی بتاتا ہے، تصویر 715ھ/1315ء کی نقل کا ورق ہے {cite:tdv-cezeri pp. 505–506} {cite:met-elephant-clock-575123 Overview}۔"
