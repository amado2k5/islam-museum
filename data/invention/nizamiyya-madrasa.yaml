today:
  form:
    ar: "تاريخ مؤسسي لا بقاء للشبكة الإدارية نفسها. تقول TDV إن التدريس ببغداد استمر في القرن الثامن الهجري/الرابع عشر، وإن تاريخ توقفه غير معلوم {cite:tdv-nizamiye-medresesi pp. 188–191}."
    en: "An institutional legacy, not the same surviving administration. TDV places continued Baghdad teaching in the fourteenth century and says its exact end date is unknown {cite:tdv-nizamiye-medresesi pp. 188–191}."
    ur: "یہ ادارتی ورثہ ہے، وہی انتظامی سلسلہ آج باقی ہونے کا دعویٰ نہیں۔ ٹی ڈی وی بغداد میں چودھویں صدی تک تعلیم اور اختتام کی نامعلوم تاریخ بتاتا ہے {cite:tdv-nizamiye-medresesi pp. 188–191}۔"
  descendants:
    ar: "مدارس اقتدت بالنموذج؛ لا سلسلة موثقة هنا إلى جامعة أوروبية أو إلى كل مدرسة تحمل اسم نظامية {cite:tdv-nizamiye-medresesi pp. 188–191}."
    en: "Madrasas following the model; no documented line here to a European university or every school now named Nizamiyya {cite:tdv-nizamiye-medresesi pp. 188–191}."
    ur: "نمونے پر بننے والے مدارس؛ یہاں کسی یورپی یونیورسٹی یا آج کے ہر نظامیہ نامی ادارے تک ثابت شدہ زنجیر نہیں {cite:tdv-nizamiye-medresesi pp. 188–191}۔"
