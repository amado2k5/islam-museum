summary:
  ar: "رعى نظام الملك مدارس في مدن متعددة، جمعت التدريس والسكن والكتب إلى أوقاف تمول العاملين والطلبة. افتتحت نظامية بغداد سنة 459هـ/1067م، لكن نيسابور سبقتها، والمدارس نفسها أقدم من النظاميات {cite:tdv-nizamiye-medresesi pp. 188–191}. ورأى ابن جبير نظامية بغداد ووصف أوقاف مدارس المدينة وإعالة مدرسيها وطلبتها {cite:rihla-ibn-jubayr-1907 scan p. 193}. الإسهام شبكة مؤسسات تعليمية ممولة، لا اختراع التعليم ولا الجامعة أو الإجازة."
  en: "Nizam al-Mulk sponsored madrasas in several cities, joining teaching, accommodation and books to endowments supporting staff and students. Baghdad's Nizamiyya opened in 459 AH/1067 CE, but Nishapur preceded it and madrasas predated the Nizamiyyas {cite:tdv-nizamiye-medresesi pp. 188–191}. Ibn Jubayr saw the Baghdad institution and described the city's endowed schools and support for teachers and students {cite:rihla-ibn-jubayr-1907 scan p. 193}. The contribution is an endowed educational network, not invention of education, universities or ijaza."
  ur: "نظام الملک نے کئی شہروں میں ایسے مدارس کی سرپرستی کی جہاں تدریس، رہائش اور کتابیں، اساتذہ اور طلبہ کو سہارا دینے والے اوقاف سے جڑی تھیں۔ بغداد کا نظامیہ 459ھ/1067ء میں کھلا، مگر نیشاپور اس سے پہلے تھا اور مدارس نظامیہ سے بھی پہلے تھے {cite:tdv-nizamiye-medresesi pp. 188–191}۔ ابن جبیر نے بغداد کا ادارہ دیکھا اور شہر کے مدارس کے اوقاف، اساتذہ اور طلبہ کی کفالت بیان کی {cite:rihla-ibn-jubayr-1907 scan p. 193}۔ نسبت وقفی تعلیمی سلسلے کی ترقی ہے، تعلیم، یونیورسٹی یا اجازت کی ایجاد نہیں۔"
