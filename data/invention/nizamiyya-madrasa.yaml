id: invention/nizamiyya-madrasa
class: invention
label:
  ar: "النظاميات: شبكة مدارس وقفية"
  en: "The Nizamiyyas: an endowed madrasa network"
  ur: "نظامیہ: وقفی مدارس کا سلسلہ"
names:
