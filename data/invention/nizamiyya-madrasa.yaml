origin:
  place: place/baghdad
  context:
    ar: "بغداد هي المثال المؤرخ في السجل، على الضفة الشرقية لدجلة؛ ليست أول مدينة في الشبكة. تقول TDV إن نيسابور سبقتها وتصف مؤسسات في أصفهان وبلخ وهراة ومرو وغيرها {cite:tdv-nizamiye-medresesi pp. 188–191}."
    en: "Baghdad, on the east bank of the Tigris, is the dated exemplar, not the first city in the network. TDV places Nishapur earlier and describes foundations in Isfahan, Balkh, Herat, Merv and elsewhere {cite:tdv-nizamiye-medresesi pp. 188–191}."
    ur: "دجلہ کے مشرقی کنارے کا بغداد مؤرخ مثال ہے، سلسلے کا پہلا شہر نہیں۔ ٹی ڈی وی نیشاپور کو پہلے رکھتا اور اصفہان، بلخ، ہرات، مرو وغیرہ کے ادارے بتاتا ہے {cite:tdv-nizamiye-medresesi pp. 188–191}۔"
makers:
  - person: person/nizam-al-mulk
    role: commissioner
    place: place/baghdad
    note: "Patron of the foundations, endowments and teaching appointments, not inventor of learning or author of all lessons. TDV separately credits Abu Sad al-Kashi with supervising Baghdad's construction."
    sources: [source/tdv-nizamiye-medresesi, source/tdv-nizamulmulk]
attribution:
  status: improvement
  claim:
    ar: "تطوير شبكة مدارس وقفية لها وظائف تدريس وخزانة وسكن وإعالة؛ لا أول مدرسة في الإسلام."
    en: "Development of an endowed madrasa network with teaching, library, accommodation and maintenance provision; not the first madrasa in Islam."
    ur: "تدریس، کتب خانے، رہائش اور کفالت والے وقفی مدارس کے سلسلے کی ترقی؛ اسلام کا پہلا مدرسہ نہیں۔"
  basis:
    ar: "تصف TDV نظام الأوقاف والوظائف والشروط في بغداد وأمثلة مدن أخرى، وتنفي أن النظاميات أول المدارس. ويشهد ابن جبير لأوقاف مدارس بغداد وإعالة أهلها. الشبكة هي الإسهام، لا أولوية كل عنصر فيها {cite:tdv-nizamiye-medresesi pp. 188–191} {cite:rihla-ibn-jubayr-1907 scan p. 193}."
    en: "TDV details Baghdad's endowments, posts and conditions and other cities' institutions, while rejecting the first-madrasa claim. Ibn Jubayr witnesses the Baghdad schools' endowments and maintenance. The network is the contribution, not priority for each constituent feature {cite:tdv-nizamiye-medresesi pp. 188–191} {cite:rihla-ibn-jubayr-1907 scan p. 193}."
    ur: "ٹی ڈی وی بغداد کے اوقاف، ذمہ داریاں، شرطیں اور دوسرے شہروں کے ادارے بیان کرتے ہوئے پہلے مدرسے کا دعویٰ رد کرتا ہے۔ ابن جبیر بغداد کے مدارس کے وقف اور کفالت کے عینی شاہد ہیں۔ نسبت سلسلے کی ہے، ہر جز کی اولیت نہیں {cite:tdv-nizamiye-medresesi pp. 188–191} {cite:rihla-ibn-jubayr-1907 scan p. 193}۔"
  perspectives: []
