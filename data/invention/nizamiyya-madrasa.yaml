kids:
  ar: "لا تكفي غرفة ومعلم لتستمر الدراسة: يحتاج الطالب إلى كتب ومكان يسكن فيه، ويحتاج المعلم إلى معيشة. تصف المصادر كيف ربط نظام الملك مدارس بأوقاف تدفع لهذه الحاجات. لم يخترع المدرسة؛ طوّر شبكة لها مال ووظائف وشروط، منها شروط شافعية في بغداد."
  en: "A room and a teacher are not enough to keep study going: students need books and somewhere to stay, and teachers need a living. Sources describe Nizam al-Mulk's schools linked to endowments paying for these needs. He did not invent school: he developed a network with funds, posts and conditions, including Shafi'i conditions in Baghdad."
  ur: "پڑھائی کے لیے کمرہ اور استاد کافی نہیں: طالب علم کو کتاب اور رہائش، استاد کو گزارہ چاہیے۔ مآخذ نظام الملک کے مدارس کو ان ضرورتوں کے اوقاف سے جوڑتے ہیں۔ انہوں نے مدرسہ ایجاد نہیں کیا؛ فنڈ، ذمہ داریوں اور شرطوں والا سلسلہ بڑھایا، بغداد میں شافعی شرطوں کے ساتھ۔"
sources: [source/tdv-nizamiye-medresesi, source/tdv-nizamulmulk, source/rihla-ibn-jubayr-1907]
