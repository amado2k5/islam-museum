impact:
  fields: [institutions-systems]
  changed:
    ar: "يربط وصف ابن جبير الأوقاف بمعيشة المدرسين والطلبة، وتفصل TDV وظائف المدرس والواعظ وخازن الكتب والمقرئ ومعلم العربية والعاملين؛ التمويل جزء من المؤسسة لا تبرع عابر {cite:rihla-ibn-jubayr-1907 scan p. 193} {cite:tdv-nizamiye-medresesi pp. 188–191}."
    en: "Ibn Jubayr connects endowments with teachers' and students' maintenance; TDV details teaching, preaching, library, recitation, Arabic instruction and service posts. Funding is part of the institution rather than a passing gift {cite:rihla-ibn-jubayr-1907 scan p. 193} {cite:tdv-nizamiye-medresesi pp. 188–191}."
    ur: "ابن جبیر وقف کو اساتذہ اور طلبہ کی کفالت سے جوڑتے ہیں؛ ٹی ڈی وی تدریس، وعظ، کتب خانے، قراءت، عربی اور خدمت کی ذمہ داریاں بتاتا ہے۔ مالی سہارا ادارے کا جز ہے، وقتی عطیہ نہیں {cite:rihla-ibn-jubayr-1907 scan p. 193} {cite:tdv-nizamiye-medresesi pp. 188–191}۔"
  history:
    ar: "تربط TDV المشروع بتقوية التعليم السني وإعداد موظفي الدولة، مع شروط شافعية في وقف بغداد. وتصف شهرة المدرسة وتعيين الغزالي سنة 484هـ/1091م؛ لم تكن المؤسسة محايدة مذهبياً في شروطها {cite:tdv-nizamiye-medresesi pp. 188–191}."
    en: "TDV links the programme to strengthening Sunni education and training state personnel, with Shafi'i conditions in Baghdad's endowment. It describes the school's prestige and al-Ghazali's appointment in 484/1091; the foundation was not confessionally unrestricted {cite:tdv-nizamiye-medresesi pp. 188–191}."
    ur: "ٹی ڈی وی منصوبے کو سنی تعلیم اور ریاستی اہل کاروں کی تیاری سے جوڑتا ہے؛ بغداد کے وقف کی شافعی شرطیں تھیں۔ غزالی کی 484ھ/1091ء کی تقرری اور مدرسے کی شہرت بھی مذکور ہیں؛ ادارہ مسلکی پابندی سے خالی نہ تھا {cite:tdv-nizamiye-medresesi pp. 188–191}۔"
  significance: 4
  why: "A named multi-city patronage programme with documented endowed staff/student provision and a contemporary traveller's later witness. Its components have antecedents; no modern university or degree priority is claimed."
