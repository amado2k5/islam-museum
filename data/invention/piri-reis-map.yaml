origin:
  polity: polity/ottoman-empire
  context:
    ar: جاليبولي، قاعدة الأسطول العثماني الأولى حتى 1518، حيث جمع بيري ريس خبرة الملاحة
      المتوسطية من عمله مع عمه كمال ريس ومصادراً إيطالية وكتالونية {cite:encyclopaedia-of-islam-2}.
    en: Gallipoli, the chief Ottoman naval base until 1518, where Piri Reis combined
      the Mediterranean seamanship learned at his uncle Kemal Reis's side with assiduously
      gathered Italian and Catalan sources {cite:encyclopaedia-of-islam-2}.
    ur: گیلی بولی، 1518ء تک عثمانی بحریہ کا مرکزی ٹھکانہ، جہاں پیری رئیس نے چچا کمال
      رئیس کے ساتھ ملاحی مہارت سیکھی اور اطالوی و کاتالان مصادر کو خوب جمع کیا {cite:encyclopaedia-of-islam-2}.
makers:
- person: person/piri-reis
  role: inventor
  place: place/gallipoli
  note: 'The colophon names him outright: ''composed by the poor Pir son of Hadjji
    Mehmed, known as paternal nephew of Kemal Reis''; the map is his documented work,
    the invention claim being the map object itself, not cartography.'
  sources:
  - source/encyclopaedia-of-islam-2
attribution:
  status: original
  claim:
    ar: 'قطعة مرسومة موقعة ومؤرخة بالحرف: صنعها بيري ريس في 919/1513 من خمسة مصادر
      خرائطية على الأكثر بينها خريطة لكولومبوس؛ لا نزاع على مؤلفها، بل على قيمة مصادرها
      المفقودة {cite:encyclopaedia-of-islam-2}.'
    en: 'A signed and dated drawing: Piri Reis composed it in 919/1513 from at most
      five cartographic sources including a Columbus map; authorship is not disputed
      — what is debated is the value of its lost sources {cite:encyclopaedia-of-islam-2}.'
    ur: 'دستخطی اور مورخ نقشہ: پیری رئیس نے 919/1513ء میں زیادہ سے زیادہ پنج نقشہ
      جاتی مصادر — جن میں کولمبس کا ایک نقشہ بھی — سے بنایا؛ مصنف پر کوئی نزاع نہیں،
      بحث اس کے مفقود مصادر کی قدر پر ہے {cite:encyclopaedia-of-islam-2}.'
  basis:
    ar: الكولوفون على القطعة نفسها يذكر المؤلف والمكان ⁦(جاليبولي)⁩ والشهر ⁦(محرم
      919)⁩؛ وEI2 تنقل النص وتؤرخ القطعة وتصف مصادره الخمسة {cite:encyclopaedia-of-islam-2}.
    en: The colophon on the fragment itself names the author, the place (Gallipoli)
      and the month (Muharram 919); EI2 quotes it and dates the piece and describes
      its five sources {cite:encyclopaedia-of-islam-2}.
    ur: خود ٹکڑے کا کولوفون مصنف، مقام ⁦(گیلی بولی)⁩ اور مہینہ ⁦(محرم 919)⁩ لکھتا
      ہے؛ EI2 اسے نقل کر کے قطعے کی تاریخ اور اس کے پانچ مصادر بیان کرتی ہے {cite:encyclopaedia-of-islam-2}.
