summary:
  ar: خريطة عالم رسمها البحار العثماني بيري ريس بجاليبولي في محرم 919هـ/مارس–أبريل
    1513م على جلد غزال؛ بقي ثلثها الغربي ⁦(90×63 سم)⁩ في مكتبة طوب قابي، يجمع تقاليد
    بورتولان المتوسط وخرائط الاكتشافات ومصادر أعلن المؤلف أنها خريطة لكولومبوس وخرائط
    برتغالية {cite:encyclopaedia-of-islam-2 vol. VIII, art. PIRI RE'IS}.
  en: A world map drawn by the Ottoman mariner Piri Reis at Gallipoli in Muharram
    919/March–April 1513 on gazelle skin; the surviving western third (90×63 cm) in
    the Topkapı library joins the Mediterranean portolan tradition and the maps of
    the Great Discoveries, using sources the author names as a Columbus map plus Portuguese
    charts {cite:encyclopaedia-of-islam-2 vol. VIII, art. PIRI RE'IS}.
  ur: عثمانی ملاح پیری رئیس کا گیلی بولی میں محرم 919ھ/مارچ–اپریل 1513ء کو ہرن کی
    کھال پر بنایا عالمی نقشہ؛ طوب قابی کتب خانہ میں بچا ہوا مغربی تہائی حصہ ⁦(90×63
    سم)⁩ بحیرہ روم کی پورٹولان روایت اور عہدِ دریافتوں کے نقشوں کو ملاتا ہے، جن کے
    مصادر مصنف نے خود کولمبس کا نقشہ اور پرتگالی چارٹ بتائے {cite:encyclopaedia-of-islam-2
    vol. VIII, art. PIRI RE'IS}.
