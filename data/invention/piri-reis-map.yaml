impact:
  fields:
  - navigation-geography
  changed:
    ar: 'وثّق في رسم واحد أطلس المحيط الجديد بعيون عثمانية: أول إدماج معروف لمصادر
      كولومبوس والبرتغال في خريطة إسلامية، وأثبت أن علم الخرائط العثماني راقب الاكتشافات
      لا تابعها متأخراً {cite:encyclopaedia-of-islam-2}.'
    en: 'It documented the new Atlantic in a single drawing through Ottoman eyes:
      the earliest known Islamic incorporation of Columbus and Portuguese sources,
      proving Ottoman cartography watched the discoveries as they happened {cite:encyclopaedia-of-islam-2}.'
    ur: 'نئے بحر اوقیانوس کو عثمانی نگاہ سے ایک ہی نقشے میں قید کیا: کولمبس اور پرتگالی
      مصادر کی اسلامی نقشے میں پہلی معلوم شمولیت، جو ثابت کرتی ہے کہ عثمانی نقشہ نگاری
      دریافتوں کا جیوں جیوں مشاہدہ کرتی تھی {cite:encyclopaedia-of-islam-2}.'
  history:
    ar: 'أشهر خريطة عثمانية على الإطلاق: اكتشافها في طوب قابي ⁦(1929)⁩ جعلها وثيقة
      عالمية وأصدرتها الجمعية التاريخية التركية طبعة ⁦(1935)⁩ بأمر أتاتورك {cite:encyclopaedia-of-islam-2}.'
    en: 'The most famous Ottoman map of all: its 1929 discovery at Topkapı made it
      a world document, and the Turkish Historical Society published it in facsimile
      (1935) on Ataturk''s instructions {cite:encyclopaedia-of-islam-2}.'
    ur: 'مشہور ترین عثمانی نقشہ: طوب قابی میں 1929ء کی دریافت نے اسے عالمی دستاویز
      بنا دیا اور ترک تاریخی سوسائٹی نے 1935ء میں اتاترک کے حکم پر اس کا فکسمائل شائع
      کیا {cite:encyclopaedia-of-islam-2}.'
  significance: 4
  why: A signed, dated Ottoman world map preserving a lost Columbus source — the single
    most famous cartographic object of the Islamic world.
