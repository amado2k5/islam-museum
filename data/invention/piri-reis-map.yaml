kids:
  ar: قبل خمسمئة سنة رسم بحار عثماني اسمه بيري ريس خريطة للعالم كله على جلد غزال.
    جمع فيها خرائط البحّارة الذين جابوا المحيط الأطلسي — ومنها خريطة صنعها كولومبوس
    نفسه ضاعت اليوم. بقي من خريطته ثلثها فقط، وهو محفوظ في قصر طوب قابي بإسطنبول،
    ويعدّ من أشهر الخرائط في التاريخ.
  en: Five hundred years ago an Ottoman sailor named Piri Reis drew a map of the whole
    world on gazelle skin. He built it from the charts of sailors who had crossed
    the Atlantic — including a map made by Columbus himself that is now lost. Only
    a third of his map survives, kept in Topkapı Palace in Istanbul, and it is one
    of the most famous maps in history.
  ur: پانچ سو سال پہلے عثمانی ملاح پیری رئیس نے ہرن کی کھال پر ساری دنیا کا نقشہ بنایا۔
    اس میں اس نے ان ملاحوں کے چارٹ جمع کیے جنھوں نے بحر اوقیانوس عبور کیا — جن میں
    کولمبس کا خود بنایا آج کا گمشدہ نقشہ بھی تھا۔ اس کے نقشے کا صرف تہائی حصہ بچا
    جو استنبول کے طوب قابی محل میں محفوظ ہے اور تاریخ کے مشہور ترین نقشوں میں شمار
    ہوتا ہے۔
