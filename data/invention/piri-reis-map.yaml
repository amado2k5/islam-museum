  descendants:
    ar: كل نقشة تاريخية للأمريكيتين تذكرها كأقدم خريطة باقية تُظهر البرازيل وتستمد
      من كولومبوس نفسه؛ وأصبحت «خريطة بيري ريس» اسماً عَلَماً {cite:wikipedia-piri-reis-map-en}.
    en: Every history of the mapping of the Americas cites it as the earliest surviving
      map showing Brazil and drawing on Columbus himself; 'the Piri Reis map' has
      become a proper noun {cite:wikipedia-piri-reis-map-en}.
    ur: امریکہ کے نقشہ سازی کی ہر تاریخ اسے برازیل دکھانے والا اور کولمبس سے مستفید
      قدیم ترین بچا نقشہ مانتی ہے؛ «نقشہِ پیری رئیس» ایک معروف نام بن گیا ہے {cite:wikipedia-piri-reis-map-en}.
