summary:
  ar: "ينسب عثمان أرصوي اقتراح مصنع الورق في بغداد سنة178هـ/794–795م إلى الفضل بن يحيى البرمكي {cite:tdv-kagit Baghdad paragraph}. ويسند بلوم صنع الورق فيها بنهاية القرن الثامن دون تثبيت هذا الاسم أو العام؛ فالسجل لفعل نقل الصناعة لا لاختراع الورق الصيني الأصل {cite:iranica-paper-i early history}."
  en: "Osman Ersoy attributes the proposal for a Baghdad paper workshop in178 AH/794–795 to al-Fadl ibn Yahya al-Barmaki {cite:tdv-kagit Baghdad paragraph}. Bloom supports manufacture there by the late eighth century without independently confirming that name or year; this is industrial transmission, not invention of Chinese-origin paper {cite:iranica-paper-i early history}."
  ur: "عثمان ارسوئے بغداد کے178ھ/794–795ء کے کاغذ کارخانے کی تجویز فضل بن یحییٰ برمکی سے منسوب کرتے ہیں {cite:tdv-kagit Baghdad paragraph}۔ بلوم آٹھویں صدی کے آخر کی پیداوار کی تائید کرتے مگر نام و سال کی الگ تصدیق نہیں؛ یہ صنعت کا انتقال ہے، چینی الاصل کاغذ کی ایجاد نہیں {cite:iranica-paper-i early history}۔"
