    status: historical
    note: 'EI2 BĀDGĪR: square-sectioned ventilation shafts in the
      walls of the early Abbasid palace of Ukaydir (late eighth
      century) are the earliest Islamic-era building witness; the
      type itself is older, Pharaonic Egypt and Babylonian works
      having known such contrivances. The hijri figure is a derived
      conversion.'
    derived: true
    sources:
