spread: []
impact:
  fields:
  - architecture-building
  - everyday-life
  changed:
    ar: 'جعل التكييف ساكناً: هواء علوي بارد يُدفع إلى القاعة
      والسراديب، يعمل بالنسيم أو بمدخنة الشمس حين لا ريح — تكييف
      مبكر بلا وقود {cite:encyclopaedia-of-islam-2}.'
    en: 'It made cooling passive: upper air caught and driven into
      reception halls and cellars, working by breeze or by solar
      chimney when there is none — early air conditioning without
      fuel {cite:encyclopaedia-of-islam-2}.'
    ur: 'اس نے ٹھنڈک کو ساکن بنا دیا: اوپر کی ہوا پکڑ کر اصلی کمرے
      اور تہ خانوں میں اُتاری، جھوکڑ سے یا شمسی چمنی سے جب ہوا نہ ہو
      — بغیر ایندھن ابتدائی ائیر کنڈیشننگ
      {cite:encyclopaedia-of-islam-2}۔'
  history:
    ar: 'من أبراج يزد إلى ملقف القاهرة مدّ سلسلة تهوية قروناً وصفها
      ماركو بولو عند هرمز عزاءً للحياة في الصيف — وبقيت حتى عصر
      الكهرباء {cite:encyclopaedia-of-islam-2}
      {cite:wikipedia-windcatcher-en}.'
    en: 'From the towers of Yazd to the malqaf of Cairo it ran a
      ventilation chain for centuries — Marco Polo counted the
      badgirs of Hormuz the only things that made life there bearable
      in summer — lasting into the age of electricity
      {cite:encyclopaedia-of-islam-2}
      {cite:wikipedia-windcatcher-en}.'
    ur: 'یزد کے برجوں سے قاہرہ کے ملقف تک اس نے صدیوں ہوا دہی کی
      زنجیر چلائی — مارکو پولو نے ہرمز کے بادگیروں کو گرمی میں زندگی
      کی واحد آسائش لکھا — اور یہ زنجیر بجلی کے دور تک رہی
      {cite:encyclopaedia-of-islam-2} {cite:wikipedia-windcatcher-en}۔'
  significance: 3
  why: 'The honest transmission record: an ancient eastern device
    renamed, studied and perfected across the Islamic cities from
    Yazd to Cairo, now returning as a model of zero-energy cooling.'
