summary:
  ar: >-
    برج تهوية مرتفع فوق البيوت وخزانات الماء يأسر النسيم ويدفعه
    إلى الغرف والأقبية — فارسي الأصل معروف في أخمينية البناء ومصر
    الفرعونية، وفي الإسلام أعادت تسميته بادهنجاً ثم ملقفاً: يعثر
    قصور أخيضر العباسية على أبراج تهوية، ويدرس ابن يونس ⁦(ت
    399/1008-9)⁩ توجيه فتحته لريح مصر الشمالية، وتبلغ تكلفة أبراج
    القاهرة المزخرفة عند عبد اللطيف البغدادي ⁦(ت 629/1231-2)⁩ خمسمئة
    دينار، وأقدمها بقاءً منفذ جامع الصالح طلائع ⁦(555/1160)⁩
    {cite:wikipedia-windcatcher-en} {cite:encyclopaedia-of-islam-2}.
  en: >-
    A tall ventilating tower above houses and water cisterns that
    catches the breeze and drives it into rooms and cellars — Persian
    in origin, already known in Achaemenid and Pharaonic building,
    renamed badahandj then malqaf under Islam: the early Abbasid
    palace of Ukaydir holds ventilating shafts, the astronomer Ibn
    Yunus ⁦(d. 399/1008-9)⁩ studies the orientation of its aperture to
    Egypt's north wind, the ornate towers of Abd al-Latif
    al-Baghdadi's Cairo cost up to five hundred dinars, and the
    earliest surviving Egyptian shaft is that of the al-Salih Talai
    mosque ⁦(555/1160)⁩ {cite:wikipedia-windcatcher-en}
    {cite:encyclopaedia-of-islam-2}.
  ur: >-
    مکانوں اور پانی کے حوضوں پر کھڑا اونچا ہوا دار برج جو جھوکڑ
    پکڑ کر کمرے اور تہ خانوں میں اُتارتا ہے — اصل فارسی، خذائی اور
    فرعونی تعمیر میں پہلے سے معلوم، اسلام میں بادہنج پھر ملقف کہلایا:
    عباسی محل اخیضر میں ہوا دار نالیوں کے نشان، فلکیات دان ابن یونس
    ⁦(ت 399/1008-9)⁩ اس کے سوراخ کی سمت مصر کی شمالی ہوا کے مطابق
    جانچتا ہے، عبد اللطیف بغدادی ⁦(ت 629/1231-2)⁩ کے زمانے میں قاہرہ
    کے آراستہ برج پانچ سو دینار تک کے، اور قاہرہ میں بچی سب سے قدیم
    نالی مسجد الصالح طلائع کی ہے ⁦(555/1160)⁩
    {cite:wikipedia-windcatcher-en} {cite:encyclopaedia-of-islam-2}۔
  es: "Una alta torre de ventilación sobre casas y cisternas de agua que capta la brisa y la dirige a habitaciones y sótanos — de origen persa, ya conocida en la arquitectura aqueménida y faraónica, rebautizada como badahandj y luego como malqaf bajo el Islam: el antiguo palacio abasí de Ukaydir posee pozos de ventilación, el astrónomo Ibn Yunus (m. 399/1008-9) estudia la orientación de su abertura hacia el viento del norte de Egipto, las ornamentadas torres del Cairo de Abd al-Latif al-Baghdadi costaban hasta quinientos dinares, y el pozo egipcio más antiguo que se conserva es el de la mezquita al-Salih Talai (555/1160) {cite:wikipedia-windcatcher-en} {cite:encyclopaedia-of-islam-2}."
  fr: "Une haute tour de ventilation au-dessus des maisons et des citernes d'eau qui capte la brise et la dirige dans les pièces et les caves — d'origine perse, déjà connue dans les constructions achéménides et pharaoniques, renommée badahandj puis malqaf sous l'Islam: le palais abbasside primitif d'Ukaydir possède des conduits de ventilation, l'astronome Ibn Yunus (mort en 399/1008-9) étudie l'orientation de son ouverture par rapport au vent du nord égyptien, les tours ornées du Caire d'Abd al-Latif al-Baghdadi coûtaient jusqu'à cinq cents dinars, et le plus ancien conduit égyptien conservé est celui de la mosquée al-Salih Talai (555/1160) {cite:wikipedia-windcatcher-en} {cite:encyclopaedia-of-islam-2}."
  tr: "Evlerin ve su depolarının çok yukarısında bulunan, esintiyi yakalayıp odalara ve mahzenlere yönlendiren rüzgar yakalayıcı kuleler; Pers kökenli olup Ahameniş mimarisinde ve Firavun Mısırı'nda bilinmektedir. İslam'da ise rüzgar yakalayıcı olarak yeniden adlandırılmış ve daha sonra da rüzgar yakalayıcı olarak anılmıştır: Ahidhar'daki Abbasi saraylarında rüzgar yakalayıcılar bulunur ve İbn Yunus (ö. 399/1008-9), açıklığının kuzey Mısır rüzgarına doğru yönelimini incelemiştir. Abdül Latif el-Bağdadi'ye (ö. 629/1231-2) göre, süslü Kahire rüzgar yakalayıcılarının maliyeti beş yüz dinardır ve günümüze kadar ulaşan en eski örnek Salih Tala'i Camii'nin (555/1160) açıklığıdır."
  id: "Menara penangkap angin, yang menjulang tinggi di atas rumah-rumah dan waduk air, menangkap angin sepoi-sepoi dan mengarahkannya ke dalam ruangan dan ruang bawah tanah — berasal dari Persia, dikenal dalam arsitektur Akhemenid dan Mesir Firaun. Dalam Islam, namanya diubah menjadi penangkap angin dan kemudian menjadi penangkap angin: istana Abbasiyah di Akhidhar memiliki penangkap angin, dan Ibn Yunus (wafat 399/1008-9) mempelajari orientasi bukaannya ke arah angin Mesir utara. Biaya penangkap angin Kairo yang dihias, menurut Abd al-Latif al-Baghdadi (wafat 629/1231-2), adalah lima ratus dinar, dan yang tertua yang masih ada adalah bukaan Masjid Salih Tala’i (555/1160)."
