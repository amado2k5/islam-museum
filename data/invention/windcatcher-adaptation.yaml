kids:
  ar: 'تخيل برجاً على سطح بيت في مدينة حارة، مفتوحاً من جوانبه كلها:
    يمسك النسمة في الأعلى ويدفعها نازلةً باردة إلى الغرف، وحين لا
    تهب ريح يعمل مدخنةً تسحب الحر صاعداً. بيوت يزد والقاهرة عاشت
    قروناً بهذا التكييف بلا كهرباء.'
  en: 'Imagine a tower on the roof of a house in a hot city, open on
    every side: it catches the breeze up high and pushes it down
    cool into the rooms, and when no wind blows it works as a
    chimney pulling the heat upward. The houses of Yazd and Cairo
    lived with this air conditioning for centuries without
    electricity.'
  ur: 'گرم شہر کے مکان کی چھت پر کھڑا برج سوچو جو ہر طرف کھلا ہو:
    اوپر سے جھوکڑ پکڑ کر ٹھنڈی ہوا کمرے میں اُتارتا ہے، اور جب ہوا
    نہ چلے تو چمنی بن کر گرمی کو اوپر کھینچتا ہے۔ یزد اور قاہرہ کے
    گھر صدیوں اسی بغیر بجلی ٹھنڈک سے جیے۔'
