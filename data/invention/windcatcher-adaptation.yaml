  status_today: revived
origin:
  place: place/yazd
  context:
    ar: 'هضبة إيران الوسطى حول يزد وساحل الخليج — مواطن البادجير —
      ثم بلاد الشام ومصر حيث صار بادهنجاً وملقفاً؛ ويعتقد EI2 أن
      العراق كان الحلقة الوسطى لانتقاله غرباً في حياته الإسلامية
      الجديدة {cite:encyclopaedia-of-islam-2}.'
    en: 'The central Iranian plateau around Yazd and the Gulf
      coastlands — the badgir''s homeland — then Syria and Egypt
      where it became the badahandj and the malqaf; EI2 holds Iraq
      to have been the intermediate stage of its spread westwards in
      its new Islamic-era life {cite:encyclopaedia-of-islam-2}.'
    ur: 'یزد کے گرد وسطی ایرانی سطحِ مرتفع اور خلیج کے ساحل — بادگیر
      کی جائے پیدائش — پھر شام اور مصر جہاں وہ بادہنج اور ملقف بنا؛
      EI2 کے مطابق اس کے اسلامی دور میں مغرب پھیلاؤ کی درمیانی کڑی
      عراق رہی {cite:encyclopaedia-of-islam-2}۔'
makers:
- person: person/ali-ibn-yunus-al-munajjim
  role: describer
  place: place/cairo
  note: 'The Fatimid astronomer (d. 399/1008-9) who discussed the
    correct orientation of the badahandj''s single aperture to
    Egypt''s prevailing north and north-west wind — an early written
    analysis of the device, per EI2 BĀDGĪR.'
  sources:
  - source/encyclopaedia-of-islam-2
attribution:
  status: improvement
  claim:
    ar: 'برج الريح أقدم من الإسلام ⁦(مصر الفرعونية وبابل وأخمينية
      فارس)⁩؛ والإسهام الإسلامي نقله واستكماله: تسمية بادهنج المعرّبة،
      أبراج يزد متعددة الجهات إلى 34 متراً، ملقف مصر ثنائي الاتجاه مع
      السلسبيل والشخشيخة، تطبيق على خزانات الماء والمناجم وصوامع
      الجليد {cite:encyclopaedia-of-islam-2}
      {cite:wikipedia-windcatcher-en}.'
    en: 'The wind tower is older than Islam ⁦(Pharaonic Egypt,
      Babylon and Achaemenid Persia)⁩; the Islamic contribution is
      its carrying and completion: the arabised name badahandj,
      Yazd''s four-sided towers rising to thirty-four metres,
      Egypt''s bidirectional malqaf paired with the salsabil and
      shuksheika, and its application to cisterns, mine shafts and
      ice houses {cite:encyclopaedia-of-islam-2}
      {cite:wikipedia-windcatcher-en}.'
    ur: 'برجِ باد اسلام سے قدیم ہے ⁦(فرعونی مصر، بابل اور خذائی
      فارس)⁩؛ اسلامی شراکت اسے آگے پہنچانا اور مکمل کرنا ہے: عربی
      نام بادہنج، یزد کے چوپہل برج چونتیس میٹر تک، مصر کا دو طرفی
      ملقف سلسبیل اور شخشیخہ کے ساتھ، اور حوضوں، کانوں اور برف
      خانوں پر اطلاق {cite:encyclopaedia-of-islam-2}
      {cite:wikipedia-windcatcher-en}۔'
  basis:
    ar: 'EI2 يعثر في قصر أخيضر العباسي المبكر على ممرات تهوية مربعة
      المقطع، وينقل عن ابن يونس بحث التوجيه وعن عبد اللطيف البغدادي
      أبراج الخمسمئة دينار وعن ألف ليلة ذكر البادهنج والغزولي باباً
      في شعره؛ والتسمية ذاتها معربة من الفارسية بادهنج
      {cite:encyclopaedia-of-islam-2}.'
    en: 'EI2 finds square-sectioned ventilating shafts in the early
      Abbasid palace of Ukaydir, cites Ibn Yunus on orientation and
      Abd al-Latif al-Baghdadi on the five-hundred-dinar towers, the
      badahandj named in the Thousand and One Nights and al-Ghuzuli
      devoting a chapter to it — and the very name is arabised from
      the Persian bad-handj {cite:encyclopaedia-of-islam-2}.'
    ur: 'EI2 ابتدائی عباسی محل اخیضر میں چو کونہ ہوا دار نالیاں بتاتا
      ہے، ابن یونس کی سمت شناسی اور عبد اللطیف بغدادی کے پانچ سو
      دیناری برج نقل کرتا ہے، الف لیلہ میں بادہنج کا ذکر اور غزولی کا
      اس پر باب درج کرتا ہے — اور نام ہی فارسی بادہنج کی عربی صورت ہے
      {cite:encyclopaedia-of-islam-2}۔'
