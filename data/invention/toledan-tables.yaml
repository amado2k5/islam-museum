    en: "The biography reports him making instruments at Toledo from about 1048–49 and observing the sun for some quarter century from 1050, and that the tables attributed to him and his school were carried into Latin and became the basis of the Alfonsine Tables; no Arabic copy survives to settle each scholar's share {cite:zarqali-mactutor biography} {cite:wikipedia-al-zarqali-en Toledo tables paragraph}."
