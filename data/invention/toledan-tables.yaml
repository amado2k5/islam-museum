summary:
  ar: "جداول فلكية جُمعت في طليطلة من رصد الزرقالي وأقرانه نحو منتصف القرن الخامس الهجري، فوصلت أوروبا في صيغ لاتينية فصارت أساس الجداول الألفونسية؛ لا أصل عربي باقٍ تُحسم منه حصة كل عالم {cite:zarqali-mactutor biography} {cite:wikipedia-al-zarqali-en Toledo tables paragraph}."
  en: "Astronomical tables assembled at Toledo from al-Zarqali's observations and his colleagues' around the mid-eleventh century, reaching Europe in Latin versions and becoming the basis of the Alfonsine Tables; no surviving Arabic original settles each scholar's share {cite:zarqali-mactutor biography} {cite:wikipedia-al-zarqali-en Toledo tables paragraph}."
  ur: "طلیطلہ میں تقریباً وسط گیارہویں صدی میں زرقالی اور ساتھیوں کے ارصاد سے تیار فلکیاتی جداول جو لاطینی صورتوں میں یورپ پہنچیں اور الفونسین جداول کی بنیاد بنیں؛ عربی اصل کے نہ بچنے سے ہر عالم کا حصہ طے نہیں {cite:zarqali-mactutor biography} {cite:wikipedia-al-zarqali-en Toledo tables paragraph}۔"
  es: "Tablas astronómicas recopiladas en Toledo a partir de las observaciones de al-Zarqali y sus colegas a mediados del siglo XI, que llegaron a Europa en versiones latinas y se convirtieron en la base de las Tablas Alfonsinas; ningún original árabe superviviente aclara la parte correspondiente a cada erudito {cite:zarqali-mactutor biography} {cite:wikipedia-al-zarqali-en Toledo tables paragraph}."
  fr: "Les tables astronomiques rassemblées à Tolède à partir des observations d'al-Zarqali et de ses collègues vers le milieu du XIe siècle, sont parvenues en Europe dans des versions latines et sont devenues la base des Tables alphonsines; aucun original arabe survivant ne détermine la part de chaque érudit {cite:zarqali-mactutor biography} {cite:wikipedia-al-zarqali-en Toledo tables paragraph}."
