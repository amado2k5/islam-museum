summary:
  ar: "سبعة عشر فصلاً في التدبير المشترك للبالغين: معظم تدبير حفظ الصحة أن يرتاض ثم تدبير الغذاء ثم تدبير النوم؛ فصول في الرياضة وأنواعها وأوقاتها، والدلك، والاستحمام، وتدبير المأكول والماء، والنوم واليقظة، والإعياء وما يتبعه {cite:canon-ibn-sina-print-v1 pp.221–231}."
  en: "Seventeen chapters on the shared regimen for adults: most of the regimen of preserving health is exercising, then regulating food, then regulating sleep; chapters on exercise and its kinds and timing, massage, bathing, the regimen of food and water, sleep and wakefulness, and fatigue and what follows it {cite:canon-ibn-sina-print-v1 pp.221–231}."
  ur: "بالغوں کے لیے مشترکہ تدبیر کے سترہ ابواب: صحت کی حفاظت کے تدبیر کا زیادہ تر حصہ ورزش، پھر غذا کا تدبیر، پھر نیند کا تدبیر ہے؛ ورزش کی اقسام و اوقات، ملش، غسل، کھانا اور پانی کا تدبیر، نیند اور بیداری، اور تھکن اور اس کے بعد کے حالات کے ابواب {cite:canon-ibn-sina-print-v1 pp.221–231}۔"
  es: "Diecisiete capítulos sobre el régimen compartido para adultos: la mayor parte del régimen para preservar la salud consiste en hacer ejercicio, luego regular la alimentación y después regular el sueño; capítulos sobre el ejercicio y sus tipos y horarios, masajes, baños, el régimen de alimentación e hidratación, sueño y vigilia, y fatiga y lo que le sigue {cite:canon-ibn-sina-print-v1 pp.221–231}."
