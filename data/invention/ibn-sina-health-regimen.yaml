kids: { ar: "في الكتاب الأول من القانون يصف ابن سينا يوماً صحياً منظماً: أولاً الرياضة ثم الغذاء ثم النوم. نفهم منه أن الصحة في نظر قدماء الأطباء نظامٌ يتكرر لا شيء يحدث مرة واحدة؛ ولا نستعمل وصفاته الطبية اليوم.", en: "In Book I of the Canon Ibn Sina describes an organized healthy day: first exercise, then food, then sleep. It shows us that health, in the view of the old physicians, was a repeating system, not something that happened once; we do not use his medical prescriptions today.", ur: "قانون کی پہلی کتاب میں ابن سینا ایک منظم صحت مند دن بیان کرتے ہیں: پہلے ورزش پھر خوراک پھر نیند۔ اس سے سمجھ آتا ہے کہ پرانے اطباء کی نظر میں صحت ایک دہرائی جانے والی ترتیب تھی، ایک بار کی بات نہیں؛ آج ہم ان کی طبی ہدایات استعمال نہیں کرتے۔" }
