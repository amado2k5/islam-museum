impact:
  fields: [astronomy-instruments]
  changed:
    ar: "جمع حساب حركات الكواكب السبعة في صفيحة واحدة موصوفة البناء والاستعمال، ضمن تقليد الإكواتوريوم الذي اختصر به الأسطرلاب للتنبؤات الفلكية."
    en: "Gathered the computation of the seven planets' motions into a single described plate, within the equatorium tradition that condensed the astrolabe's role in astronomical prediction."
    ur: "ساتوں سیاروں کی حرکتوں کا حساب ایک بیان شدہ صفیحہ میں جمع کیا، ایکواتوریوم کی روایت کے اندر جس نے اسطرلاب کے فلکیاتی پیش گوئی کے کردار کو سمیٹا۔"
  history:
