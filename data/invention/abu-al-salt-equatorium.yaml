today:
  form:
    ar: "نموذج تاريخي لأسرة الإكواتوريوم؛ اليوم تحسب حركات الكواكب برمجيات فلكية، والصورة المعروضة آلة عائلة متأخرة لا نسختها."
    en: "A historical model of the equatorium family; today planetary motions are computed by astronomical software, and the displayed photograph shows a later family instrument, not a copy of his plate."
    ur: "ایکواتوریوم خاندان کا تاریخی نمونہ؛ آج سیاروں کی حرکتیں فلکیاتی سافٹ ویئر نکالتا ہے، اور دکھائی گئی تصویر خاندان کا بعد کا آلہ ہے، اس کی صفیحہ کی نقل نہیں۔"
  descendants:
    ar: "لا يثبت البحث المقروء نسباً مباشراً من صفيحته إلى برمجيات اليوم؛ انتقلت فكرة الأداة الواحدة الجامعة عبر الإكواتوريومات اللاحقة والترجمات."
    en: "The sources read establish no direct lineage from his plate to today's software; the idea of one gathering instrument travelled through later equatoria and translations."
    ur: "پڑھے ماخذ اس کی صفیحہ سے آج کے سافٹ ویئر تک براہ راست نسب ثابت نہیں کرتے؛ ایک جمع کرنے والے آلے کا خیال بعد کے ایکواتوریوم اور ترجموں سے گزرا۔"
