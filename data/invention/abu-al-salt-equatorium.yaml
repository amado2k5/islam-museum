kids:
  ar: "قبل آلة الحاسوب، جمع الفلكيون حسابات الكواكب في آلات نحاسية مسطحة. بنى أبو الصلت «صفيحة» واحدة يصف فيها كيف ترسم خطوط الكواكب السبعة ويقرأ منها مواقعها؛ بقيت أفكاره في رسائل قرئت في العالم الإسلامي وأوروبا."
  en: "Before computers, astronomers gathered planetary calculations in flat brass instruments. Abu al-Salt built and described a single 'plate' on which the seven planets' lines are drawn and their positions read; his ideas travelled in treatises read across the Islamic world and Europe."
  ur: "کمپیوٹر سے پہلے ماہرین فلکیات سیاروں کے حساب پیتل کے سپاٹ آلات میں جمع کرتے تھے۔ ابو الصلت نے ایک «صفیحہ» بنائی اور اس کا طریقہ لکھا جس پر ساتوں سیاروں کی لکیریں کھینچی جاتی ہیں اور ان کے مقام پڑھے جاتے ہیں؛ اس کے خیالات ایسے رسائل میں سفر کرتے رہے جو عالم اسلام اور یورپ میں پڑھے گئے۔"
