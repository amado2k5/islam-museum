summary:
  ar: "رسالة أبي الصلت أمية بن عبد العزيز الداني الأندلسي ⁦(ت 529هـ)⁩ في بناء واستعمال «الصفيحة الجامعة» التي تقوّم بها حركات الكواكب السبعة جميعاً؛ يصفها معجم BEA بأنها آخر الإكواتوريومات الأندلسية المعروفة الثلاثة وربما حلقة وصل بالإكواتوريومات الشرقية {cite:isi-abu-al-salt-bea works} {cite:wafayat-ayan}."
  en: "Abu al-Salt Umayya ibn Abd al-Aziz al-Dani al-Andalusi's (d. 529 AH) treatise on building and using the 'universal plate' by which the motions of all seven planets are computed; the BEA calls it the last of the three known Andalusian equatoria and a possible link to the eastern equatoria {cite:isi-abu-al-salt-bea works} {cite:wafayat-ayan}."
  ur: "ابو الصلت امیہ بن عبد العزیز دانی اندلسی ⁦(529ھ)⁩ کا رسالہ «جامع صفیحہ» کی تعمیر و استعمال پر جس سے ساتوں سیاروں کی حرکتیں نکالی جاتی ہیں؛ BEA اسے تین معلوم اندلسی ایکواتوریومات میں آخری اور مشرقی ایکواتوریومات سے ممکنہ کڑی قرار دیتا ہے {cite:isi-abu-al-salt-bea works} {cite:wafayat-ayan}۔"
