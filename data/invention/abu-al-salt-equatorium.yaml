    ar: "ألّف أبو الصلت كثيراً من كتبه في الأسر بالإسكندرية ثم استقر بالمهدية دار الزيريين؛ السياق فاطمي-زيري-حمادي لمؤسسات إسلامية سنية، والرسالة من مصنفات التي انتقلت إلى أوروبا بترجمات {cite:isi-abu-al-salt-bea biography} {cite:wafayat-ayan}."
    en: "Abu al-Salt wrote much in Alexandria captivity then settled at Zirid Mahdiyya; the context is Fatimid-Zirid-Hammadid Islamic courts, and the treatise is among the works translated into Latin and Hebrew that carried his astronomy to Europe {cite:isi-abu-al-salt-bea biography} {cite:wafayat-ayan}."
    ur: "ابو الصلت نے اسکندریہ کی قید میں بہت کچھ لکھا پھر زيري مہدیہ میں آباد ہوئے؛ سیاق فاطمی-زيري-حمادی دربار ہیں، اور یہ رسالہ ان تصانیف میں ہے جو لاطینی اور عبرانی ترجموں کے ذریعے یورپ پہنچیں {cite:isi-abu-al-salt-bea biography} {cite:wafayat-ayan}۔"
makers:
  - person: person/abu-al-salt-al-andalusi
    role: improver
    place: place/al-mahdiyya
    note: "Andalusi polymath (c. 1068–1134) who described the construction and use of the universal plate in his own treatise; the equatorium family already existed (al-Khazin in 10th-century Khurasan, two earlier Andalusian instruments), so this is a documented variant within an inherited instrument family."
    sources: [source/isi-abu-al-salt-bea, source/wafayat-ayan]
attribution:
  status: improvement
  claim:
    ar: "صمّم أبو الصلت صفيحة جامعة واحدة تقوّم بها حركات الكواكب السبعة، وهي آخر الإكواتوريومات الأندلسية الثلاثة المعروفة؛ ليست أول إكواتوريوم ولا ادعاء أولوية على كل الصفائح الموحدة."
    en: "Abu al-Salt designed a single universal plate on which the motions of the seven planets are computed — the last of the three known Andalusian equatoria; not the first equatorium and no claim of priority over every universal plate."
    ur: "ابو الصلت نے ایک جامع صفیحہ بنائی جس سے ساتوں سیاروں کی حرکتیں نکالی جاتی ہیں — تین معلوم اندلسی ایکواتوریومات میں آخری؛ نہ پہلا ایکواتوریوم ہے نہ ہر جامع صفیحہ پر سبقت کا دعویٰ۔"
  basis:
    ar: "يصف BEA رسالته «صفة عمل صفيحة جامعة تقوّم بها جميع الكواكب السبعة» بوصفها آخر الإكواتوريومات الأندلسية المعروفة الثلاثة، ويلاحظ أن أبا جعفر الخازن وصف إكواتوريوماً في خراسان القرن العاشر، ولا يدعي له إبداعاً عاماً في الفلك."
    en: "The BEA describes his treatise 'Description of the construction and use of a single plate with which the totality of the motions of the seven planets can be calculated' as the last of the three known Andalusian equatoria, notes that Abu Ja'far al-Khazin had already described an equatorium in 10th-century Khurasan, and judges Comes that he was accomplished though not innovative overall."
    ur: "BEA اس کے رسالے «صفت عمل صفیحہ جامعہ تقوّم بہا جمیع الکواکب السبعة» کو تین معلوم اندلسی ایکواتوریومات میں آخری کہتا ہے، نوٹ کرتا ہے کہ ابو جعفر خازن نے دسویں صدی میں خراسان میں ایکواتوریوم بیان کیا تھا، اور کامس کا جائزہ ہے کہ وہ فہم مند مگر مجموعی طور پر موجد نہیں تھے۔"
  perspectives:
    - tradition: sunni
      id: sunni-museum-frame
      standing: main
      summary:
        ar: "الإطار السني المعلن يحفظ المساهمة المسلمة الموثقة لمؤلف عربي في بلاطات إسلامية سنية؛ لا مذهب شخصي مثبت في المصادر المقروءة."
        en: "The declared Sunni frame preserves the documented Muslim contribution of an Arabic author at Sunni Islamic courts; no personal madhhab is attested in the sources read."
        ur: "اعلان کردہ سنی سیاق مسلم حصہ کو محفوظ رکھتا ہے — عرب مصنف کا کارنامہ جو سنی درباروں میں کام کرتا تھا — پڑھے ماخذ میں ذاتی مسلک ثابت نہیں ہوتا۔"
      sources: [source/isi-abu-al-salt-bea, source/wafayat-ayan]
