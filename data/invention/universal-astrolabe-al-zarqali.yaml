impact:
  fields: [astronomy-instruments, timekeeping]
  changed:
    ar: "أعاد تمثيل الإحداثيات في صفيحة تصلح لمواضع متعددة، بدلاً من تبديل صفيحة الأفق لكل عرض؛ لا تقدم المصادر المقروءة إحصاء لاستعمال البحارة لها {cite:zarqaliyya-bir-2020 pp. 47–53}."
    en: "Recast coordinates on a plate usable across locations rather than changing the horizon plate for each latitude; sources read supply no adoption statistics for sailors {cite:zarqaliyya-bir-2020 pp. 47–53}."
    ur: "ہر عرض بلد کے لیے افق کی تختی بدلنے کی جگہ مختلف مقامات کے لیے ایک تختی پر محددات؛ پڑھے ماخذ ملاحوں کے استعمال کے اعداد نہیں دیتے {cite:zarqaliyya-bir-2020 pp. 47–53}۔"
  history:
    ar: "انتقل الوصف بالقشتالية واللاتينية والعبرية، وبقي في موسوعة المراكشي؛ هذه شواهد نقل معرفة لا دعوى أن كل ملاحة لاحقة نتجت عنه {cite:zarqali-puig-bea pp. 1258–1260} {cite:zarqaliyya-bir-2020 p. 41}."
    en: "Accounts circulated in Castilian, Latin and Hebrew and survived in Marrakushi's compendium: documented knowledge transmission, not a claim that all later navigation resulted from it {cite:zarqali-puig-bea pp. 1258–1260} {cite:zarqaliyya-bir-2020 p. 41}."
    ur: "بیان قشتالی، لاطینی اور عبرانی میں منتقل اور مراکشی کی موسوعہ میں محفوظ ہوا؛ علم کی ترسیل کی شہادت، ہر بعد کی جہاز رانی کا سبب ہونے کا دعویٰ نہیں {cite:zarqali-puig-bea pp. 1258–1260} {cite:zarqaliyya-bir-2020 p. 41}۔"
  significance: 4
  why: "Major instrument improvement: latitude independence, distinct coordinate systems, technical limits and multilingual documentary survival."
