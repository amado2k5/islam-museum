summary:
  ar: "صفيحة فلكية من طليطلة في القرن الحادي عشر تستبدل صفائح العرض المحلية بشبكتي إحداثيات ومسطرة أفق؛ تطوير للأسطرلاب لا اختراع لعلم الفلك كله {cite:zarqali-puig-bea pp. 1258–1260}. تسمية «جامعة» تعني صلاحية التصميم للعروض المختلفة، لا حساب المكان والوقت من دون معرفة وضبط {cite:zarqaliyya-bir-2020 pp. 47–53}."
  en: "An 11th-century Toledan astronomical plate replaces local latitude plates with coordinate grids and a horizon ruler: an astrolabe improvement, not invention of astronomy {cite:zarqali-puig-bea pp. 1258–1260}. Universal means applicable across latitudes, not automatic position or time without knowledge and adjustment {cite:zarqaliyya-bir-2020 pp. 47–53}."
  ur: "گیارہویں صدی کی طلیطلہ کی فلکی تختی، جو مقامی عرض بلد کی تختیوں کی جگہ جالیاں اور افقی مسطرہ رکھتی ہے؛ اسطرلاب کی بہتری، پورے فلکی علم کی ایجاد نہیں {cite:zarqali-puig-bea pp. 1258–1260}۔ جامع کا مطلب مختلف عرض بلد کے لیے موزوں ڈیزائن ہے، بغیر علم و ترتیب خودکار وقت یا مقام نہیں {cite:zarqaliyya-bir-2020 pp. 47–53}۔"
