kids:
  ar: "تخيل رسماً للسماء يتغير أفقه حين تسافر شمالاً أو جنوباً. بدلاً من حمل صفيحة لكل مكان، رسم الزرقالي شبكة ومساطر يمكن ضبطها للعروض المختلفة. «جامعة» لا تعني أنها تعرف مكانك وحدها؛ ما زال الإنسان يقرأ ويحسب."
  en: "Imagine a sky map whose horizon changes as you travel north or south. Instead of carrying a plate for every location, al-Zarqali used grids and rulers adjustable across latitudes. Universal does not mean it knows your location by itself: a person still reads and calculates."
  ur: "آسمان کا ایسا نقشہ سوچیں جس کا افق شمال یا جنوب جانے سے بدلتا ہے۔ ہر مقام کی تختی اٹھانے کے بجائے الزرقالی نے مختلف عرض بلد کے لیے جالی و مسطرہ رکھا۔ جامع کا مطلب اپنا مقام خود جاننا نہیں؛ انسان اب بھی پڑھتا اور حساب کرتا ہے۔"
