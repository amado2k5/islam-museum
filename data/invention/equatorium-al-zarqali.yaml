summary:
  ar: "تحسين أندلسي لآلة حساب مواضع الكواكب: صفيحة للحاملات والدوائر المرتبطة وصفيحة للتداوير، ورسالتان نحو1080–1082؛ لا اختراع لكل إكواتوريوم أو لقانون كبلر {cite:zarqali-puig-bea pp. 1258–1260} {cite:zarqali-mactutor Mercury discussion}."
  en: "Andalusi planetary-computation refinement: one plate for deferents and associated circles, another for epicycles, with treatises circa1080–1082; not invention of every equatorium or Kepler's law {cite:zarqali-puig-bea pp. 1258–1260} {cite:zarqali-mactutor Mercury discussion}."
  ur: "سیاروی حساب کی اندلسی بہتری: حاملوں اور متعلقہ دائروں کی ایک تختی، تداویر کی دوسری، تقریباً1080–1082 کے رسائل؛ ہر ایکواتوریوم یا کیپلر کے قانون کی ایجاد نہیں {cite:zarqali-puig-bea pp. 1258–1260} {cite:zarqali-mactutor Mercury discussion}۔"
