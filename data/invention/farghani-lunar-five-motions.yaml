summary:
  ar: 'عرض الفرغاني في جوامع علم النجوم الحركة الظاهرة للقمر على فلك البروج تركيباً من خمس حركات دائرية: جرم القمر في فلك
    تدويره، ومركز التدوير في الفلك الخارج المركز، ومركز الخارج المركز في دائرة صغيرة متحدة المركز مع البروج، والفلك المائل
    الناقل للعقدتين، وحركة الكرة كلها بمقدار حركة الكواكب الثابتة {cite:farghani-elements-astronomy p. 182}{cite:farghani-elements-astronomy
    p. 185}{cite:farghani-elements-astronomy p. 186}.'
  en: 'In his Jawami'' ''ilm al-nujum al-Farghani composes the Moon''s apparent motion along the zodiac from five circular
    motions: the body on its epicycle, the epicycle''s centre on the eccentric, the eccentric''s centre on a small circle
    concentric with the zodiac, the inclined circle carrying the nodes, and the whole sphere''s motion equal to that of the
    fixed stars {cite:farghani-elements-astronomy p. 182}{cite:farghani-elements-astronomy p. 185}{cite:farghani-elements-astronomy
    p. 186}.'
  ur: 'جوامع علم النجوم میں فرغانی زوڈیوک پر چاند کی ظاہری حرکت کو پانچ دائروی حرکات سے مل کر بیان کرتے ہیں: چاند کا جسم اس
    کے تدويری دائرے پر، تدويری دائرے کا مرکز خارجِمرکزی دائرے پر، خارجِمرکزی دائرے کا مرکز زوڈیوک کے مرکز کے متوازی چھوٹے
    دائرے پر، مائل دائرہ جو گرهوں کو آگے لے جاتا ہے، اور پوری کرہ کی حرکت جو ثابت ستاروں کے برابر ہے {cite:farghani-elements-astronomy
    p. 182}{cite:farghani-elements-astronomy p. 185}{cite:farghani-elements-astronomy p. 186}۔'
  es: "En su Jawami' 'ilm al-nujum al-Farghani compone el movimiento aparente de la Luna a lo largo del zodíaco a partir de cinco movimientos circulares: el cuerpo sobre su epiciclo, el centro del epiciclo sobre la excéntrica, el centro de la excéntrica sobre un pequeño círculo concéntrico con el zodíaco, el círculo inclinado que lleva los nodos y el movimiento de toda la esfera igual al de las estrellas fijas {cite:farghani-elements-astronomy p. 182}{cite:farghani-elements-astronomy p. 185}{cite:farghani-elements-astronomy p. 186}."
