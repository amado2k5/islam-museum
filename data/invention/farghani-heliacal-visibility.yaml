  basis:
    ar: يفرد الفصل الرابع والعشرين لمشاريق الكواكب وتغاريبها واختفائها بشعاع الشمس، ويذكر أبعاداً للعمل بها على الأمر الوسط
      وأخرى مما عمل به بطليموس {cite:farghani-elements-astronomy p. 41}{cite:farghani-elements-astronomy p. 30}.
    en: Chapter twenty-four is devoted to the planets' risings, settings and concealment in the sun's rays, and gives distances
