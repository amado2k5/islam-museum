- kind: alternate
  lang: ar
  value: مشاريق ومغاريب الكواكب عند الفرغاني
summary:
  ar: 'يفرد الفرغاني فصلاً في جوامع علم النجوم لمشاريق الكواكب ومغاريبها واختفائها بشعاع الشمس: للكواكب الخارجة مشرق بالمغرب
    بالعشايا ومشرق بالمشرق بالغدوات، وللزهر والعطارد طلوعان ومغيبان بالعشيات والغدوات لأنهما أسرع من الشمس، ويعطي أبعاداً
    تقريبية بين الشمس والكوكب تحدد الرؤية على الأمر الوسط ويعلل تفاوتها بسرعة الكوكب وموضعه في البروج {cite:farghani-elements-astronomy
    p. 41}{cite:farghani-elements-astronomy p. 30}{cite:farghani-elements-astronomy p. 33}.'
  en: 'al-Farghani devotes a chapter of his Jawami'' to the planets'' morning and evening risings and settings and their concealment
    in the sun''s rays: the superior planets set in the west at dusk and rise in the east before dawn, Venus and Mercury have
    both phenomena because they move faster than the Sun, and he gives approximate Sun-planet distances that set the visibility
    limit on the mean, explaining their variation by the planet''s speed and its position among the signs {cite:farghani-elements-astronomy
    p. 41}{cite:farghani-elements-astronomy p. 30}{cite:farghani-elements-astronomy p. 33}.'
  ur: 'فرغانی جوامع میں ایک باب سیاروں کی صبح و شام طلوع و غروب اور شعاعِ آفتاب میں ان کے چھپنے کے لیے خالی کرتے ہیں: بیرونی
    سیارے شام کو مغرب میں غائب اور صبح مشرق میں ظاہر ہوتے ہیں، زہرہ اور عطارد دونوں کے مظاہر رکھتے ہیں کیونکہ وہ سورج سے تیز
    چلتے ہیں، اور وہ تقریبی فاصلوں سے درکار رویت کی حد مقرر کرتے ہیں اور ان کے تفاوت کو سیارے کی رفتار اور بروج میں مقام سے
    سمجھاتے ہیں {cite:farghani-elements-astronomy p. 41}{cite:farghani-elements-astronomy p. 30}{cite:farghani-elements-astronomy
    p. 33}۔'
  es: "Al-Farghani dedica un capítulo de su Jawami' a las salidas y puestas matutinas y vespertinas de los planetas y su ocultación en los rayos del sol: los planetas superiores se ponen en el oeste al anochecer y salen en el este antes del amanecer, Venus y Mercurio tienen ambos fenómenos porque se mueven más rápido que el Sol, y da distancias aproximadas Sol-planeta que establecen el límite de visibilidad en la media, explicando su variación por la velocidad del planeta y su posición entre los signos {cite:farghani-elements-astronomy p. 41}{cite:farghani-elements-astronomy p. 30}{cite:farghani-elements-astronomy p. 33}."
  fr: "al-Farghani consacre un chapitre de son Jawami' aux levers et couchers du matin et du soir des planètes et à leur dissimulation dans les rayons du soleil: les planètes supérieures se couchent à l'ouest au crépuscule et se lèvent à l'est avant l'aube, Vénus et Mercure présentent les deux phénomènes car elles se déplacent plus vite que le Soleil, et il donne des distances approximatives Soleil-planète qui fixent la limite de visibilité sur la moyenne, expliquant leur variation par la vitesse de la planète et sa position parmi les signes {cite:farghani-elements-astronomy p. 41}{cite:farghani-elements-astronomy p. 30}{cite:farghani-elements-astronomy p. 33}."
