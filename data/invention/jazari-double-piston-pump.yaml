summary:
  ar: "آلة لرفع الماء في كتاب الجزري: يدير التيار دولاباً وتروساً، وينقل مسمار وقضيب مشقوق الدوران إلى حركة ذراعي مكبسين ذهاباً وإياباً {cite:tdv-cezeri pp. 505–506}. الإسهام تركيب مضخة ذات فعل مزدوج وأنابيب امتصاص، لا اختراع رفع الماء كله؛ والنموذج في متحف العلوم إعادة بناء لا آلة أصلية {cite:fstc-jazari-mechanical-genius pump discussion} {cite:smg-jazari-double-pump catalogue}."
  en: "A water-raising machine in al-Jazari's book: a stream drives a wheel and gears, and a pin with a slotted rod converts rotation into reciprocating piston-rod motion {cite:tdv-cezeri pp. 505–506}. The contribution is a double-acting suction-pump arrangement, not invention of all water lifting; the Science Museum's model is a reconstruction, not an original {cite:fstc-jazari-mechanical-genius pump discussion} {cite:smg-jazari-double-pump catalogue}."
  ur: "جزری کی کتاب کی پانی اٹھانے والی مشین: بہاؤ پہیہ اور گیئر گھماتا، پن اور شگاف دار ڈنڈا گردش کو پسٹن سلاخوں کی آگے پیچھے حرکت میں بدلتے ہیں {cite:tdv-cezeri pp. 505–506}۔ نسبت دوہرے عمل اور چوسنے والی نالیوں کے خاص پمپ کی ہے، پانی اٹھانے کی کلی ایجاد نہیں؛ سائنس میوزیم کا ماڈل تعمیر نو ہے، اصل نہیں {cite:fstc-jazari-mechanical-genius pump discussion} {cite:smg-jazari-double-pump catalogue}۔"
