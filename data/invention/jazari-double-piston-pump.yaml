  basis:
    ar: "تشرح TDV نقل الحركة وتعد الأنبوب أول استعمال معروف؛ هذه دعوى المرجع المسماة، لا برهان مستقل على كل مضخة سابقة في العالم. يشرح الحساني نموذج مضختين متزامنتين وتثبت مجموعة متحف العلوم نموذجاً نصف الحجم. يقتصر تصنيف المتحف على تحسين الآلة المعينة {cite:tdv-cezeri pp. 505–506} {cite:fstc-jazari-mechanical-genius pump discussion} {cite:smg-jazari-double-pump catalogue}."
