kids:
  ar: "يدور دولاب مع جريان الماء، فتدير أسنانه ترساً آخر. يحول مسمار وقضيب مشقوق هذا الدوران إلى حركة ذراعين ذهاباً وإياباً لتشغيل المضخة. وصف الجزري هذه الآلة في كتابه؛ والنموذج الذي تعرضه مجموعة متحف العلوم إعادة بناء تساعد على فهم الفكرة، لا آلة أصلية من حياته."
  en: "Flowing water turns a wheel, which turns another gear. A pin and slotted rod change the rotation into back-and-forth motion of two rods to work the pump. Al-Jazari described the machine in his book; the Science Museum's model is a reconstruction that helps explain it, not an original from his lifetime."
  ur: "بہتا پانی پہیہ گھماتا ہے، اس کے دانت دوسرا گیئر چلاتے ہیں۔ پن اور شگاف دار ڈنڈا گردش کو دو سلاخوں کی آگے پیچھے حرکت میں بدل کر پمپ چلاتے ہیں۔ جزری نے کتاب میں مشین بیان کی؛ سائنس میوزیم کا ماڈل سمجھنے کے لیے تعمیر نو ہے، ان کی زندگی کی اصل مشین نہیں۔"
