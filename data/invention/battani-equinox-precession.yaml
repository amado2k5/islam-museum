summary:
  ar: حدد البطاني سرعة رجوع نقطتي الاعتدال نحو درجة واحدة في ٦٦ سنة، مع اشتقاق طول السنة الاستوائية ٣٦٥ يوماً و٥ ساعات و٤٦
    دقيقة و٢٤ ثانية من مشاهداته؛ موثق في سيرة المؤلفات الفلكية {cite:tdv-battani-muftuoglu biography} {cite:battani-mactutor}.
  en: Al-Battani fixed the rate of the equinoxes' regression at about one degree per 66 years and derived a tropical year
    of 365d 5h 46m 24s from his observations; documented in astronomical biographies {cite:tdv-battani-muftuoglu biography}
    {cite:battani-mactutor}.
  ur: بطانی نے اعتدالین کے رجوع کی رفتار تقریباً 66 سال میں ایک درجہ طے کی اور مشاہدات سے گرمائی سال 365 دن 5 گھنٹے 46 منٹ
    24 سیکنڈ نکالا؛ فلکی سیرتوں میں مستند {cite:tdv-battani-muftuoglu biography} {cite:battani-mactutor}۔
  es: "Al-Battani fijó la tasa de regresión de los equinoccios en aproximadamente un grado cada 66 años y derivó un año tropical de 365d 5h 46m 24s a partir de sus observaciones; documentado en biografías astronómicas {cite:tdv-battani-muftuoglu biography} {cite:battani-mactutor}."
  fr: "Al-Battani a fixé le taux de régression des équinoxes à environ un degré tous les 66 ans et a déduit une année tropique de 365 jours 5 heures 46 minutes 24 secondes à partir de ses observations; documenté dans les biographies astronomiques {cite:tdv-battani-muftuoglu biography} {cite:battani-mactutor}."
  tr: "El-Battani, iki ekinoks noktasının yaklaşık 66 yılda bir dereceye geri dönme hızını belirlemiş ve gözlemlerinden yola çıkarak tropikal yılın uzunluğunu 365 gün, 5 saat, 46 dakika ve 24 saniye olarak hesaplamıştır; bu, astronomik eserlerin biyografisinde belgelenmiştir {cite:tdv-battani-muftuoglu biography} {cite:battani-mactutor}."
  id: "Al-Battani menentukan kecepatan kembalinya kedua titik ekuinoks sekitar satu derajat dalam 66 tahun, dan menyimpulkan panjang tahun tropis 365 hari, 5 jam, 46 menit dan 24 detik dari pengamatannya; didokumentasikan dalam biografi karya astronomi {cite:tdv-battani-muftuoglu biography} {cite:battani-mactutor}."
