today:
  form:
    ar: يُقاس الرجوع اليوم بنحو ٥٠٫٣ قوسية في السنة مع تفاصيل مفصلة؛ رقم البطاني ٦٦ سنة لكل درجة أدق من بطلميوس لكن أقل من
