attribution:
  status: improvement
  claim:
    ar: رجوع الاعتدالين معروف قبل البطاني؛ مساهمته الموثقة قياس سرعته ١° في ٦٦ سنة واشتقاق السنة الاستوائية من مشاهدات متكررة.
    en: Equinox precession was known before al-Battani; his documented contribution is measuring its rate at 1° per 66 years
      and deriving the tropical year from repeated observations.
    ur: اعتدالین کا رجوع بطانی سے پہلے معلوم تھا؛ اس کا مستند حصہ 66 سال میں 1° کی رفتار کی پیمائش اور بار بار مشاہدات سے
      گرمائی سال کا استنباط ہے۔
  basis:
    ar: يذكر المختصر أن البطاني وجد رجوع نقطتي الاعتدال درجة واحدة في ٦٦ سنة، ونال سنة استوائية ٣٦٥ يوماً و٥ ساعات و٤٦ دقيقة
      و٢٤ ثانية؛ القيمة الحديثة للرجوع نحو ٥٠ ثانية في السنة، فيبقى قياسه شاهداً تاريخياً لا مطابقاً.
    en: The biography states al-Battani found the equinox points regressing one degree per 66 years and obtained a tropical
      year of 365d 5h 46m 24s; modern precession is about 50 arcseconds per year, so his figure remains a historical witness,
      not a match.
    ur: مختصر بتاتا ہے کہ بطانی نے اعتدال کے دو نقطوں کا رجوع 66 سال میں ایک درجہ پایا اور گرمائی سال 365 دن 5 گھنٹے 46 منٹ
      24 سیکنڈ نکالا؛ جدید رجوع تقریباً 50 قوسی سیکنڈ فی سال ہے، اس لیے اس کی قیمت تاریخی گواہ ہے، مطابق نہیں۔
