kids:
  ar: نقطتا الاعتدال - حيث يتساوى الليل والنهار - تنجرفان ببطء عبر الأبراج بسبب تمايل محور الأرض. قاس البطاني هذا الانجراف
    فوجده درجة كل ٦٦ سنة تقريباً، فصار حساب السنة أدق.
  en: The two equinox points - where night and day are equal - slowly drift through the zodiac because Earth's axis tilts.
    Al-Battani measured this drift at about one degree every 66 years, making the year calculation more accurate.
  ur: دو اعتدال کے نقطے - جہاں رات اور دن برابر ہوتے ہیں - زمین کے محور کے جھکاؤ کی وجہ سے آہستہ آہستہ برجوں میں کھسکتے ہیں۔
    بطانی نے یہ کھسکاؤ تقریباً ہر 66 سال میں ایک درجہ ناپا، جس سے سال کا حساب درست ہوا۔
