summary:
  ar: مؤسسة إسلامية للوقت — فلكي متخصص ملحق بمسجد كبير، مهمته حساب أوقات
    الصلوات الخمس وحلّها في جداول معدّة مسبقاً لكل مدينة — لأن «الوقت الشرعي»
    ⁦(الزوال والأصيل وغيبوبة الشفق)⁩ يتغير مع الفصول وخطوط العرض؛ وأقدم مواقيت
    معروف بالاسم خدم ثلاثين سنة في جامع عمرو بالفسطاط حتى وفاته ⁦(685/1286)⁩
    {cite:king-synchrony-heavens-2004} {cite:encyclopaedia-of-islam-2}
    {cite:wikipedia-muwaqqit-en}.
  en: An Islamic institution for time — a specialist astronomer attached to a
    major mosque, whose task was to compute the five prayer times — legal
    times defined by noon, afternoon shadow and twilight that shift with
    season and latitude — and to publish them as ready-made tables for his
    city; the earliest muwaqqit known by name served thirty years at the
    Mosque of Amr in Fustat until his death ⁦(685/1286)⁩
    {cite:king-synchrony-heavens-2004} {cite:encyclopaedia-of-islam-2}
    {cite:wikipedia-muwaqqit-en}.
  ur: وقت کی ایک اسلامی درسگاہ — بڑی مسجد سے منسلک ماہر فلکیات جس کا کام نماز
    کے پانچوں اوقات — زوال، سائے اور شفق کے شرعی اوقات جو موسم اور عرض بلد سے
    بدلتے — کا حساب کر کے ہر شہر کے لیے تیار جداول بنانا؛ نام سے پہلا معلوم
    موقیت فسطاط کی جامع عمرو میں تیس سال خدمت کر کے ⁦(685/1286ء)⁩ وفات پایا
    {cite:king-synchrony-heavens-2004} {cite:encyclopaedia-of-islam-2}
    {cite:wikipedia-muwaqqit-en}۔
  es: "Una institución islámica para el tiempo: un astrónomo especialista adscrito a una mezquita importante, cuya tarea era calcular los cinco horarios de oración (tiempos legales definidos por el mediodía, la sombra de la tarde y el crepúsculo que cambian con la estación y la latitud) y publicarlos como tablas prefabricadas para su ciudad; el primer muwaqqit conocido por su nombre sirvió treinta años en la Mezquita de Amr en Fustat hasta su muerte (685/1286) {cite:king-synchrony-heavens-2004} {cite:encyclopaedia-of-islam-2} {cite:wikipedia-muwaqqit-en}."
  fr: "Une institution islamique pour le temps — un astronome spécialisé attaché à une grande mosquée, dont la tâche était de calculer les cinq heures de prière — des heures légales définies par midi, l'ombre de l'après-midi et le crépuscule qui changent avec la saison et la latitude — et de les publier sous forme de tables prêtes à l'emploi pour sa ville; le premier muwaqqit connu par son nom a servi pendant trente ans à la mosquée d'Amr à Fustat jusqu'à sa mort (685/1286) {cite:king-synchrony-heavens-2004} {cite:encyclopaedia-of-islam-2} {cite:wikipedia-muwaqqit-en}."
