    ar: تقاويم الإمساكية وتطبيقات أوقات الصلاة
    en: Printed imsakiyya tables and prayer-time applications
    ur: مطبوعہ امساکیہ اور نماز کے اوقات کی ایپلی کیشنز
  note: The annual printed timetable, the Ramadan imsakiyya and today's
