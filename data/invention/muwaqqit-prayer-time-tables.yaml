    calendar: julian
    precision: year
    status: historical
    derived: true
    note: 'King: the first muwaqqit known by name, Abu l-Hasan Ali ibn Abd
      al-Malik ibn Sim''un, served the Mosque of Amr in Fustat for thirty
      years and died 685/1286-7 — putting the office back to the mid-13th
      century at latest. The discipline of ''ilm al-miqat (prayer-time
      calculation) is older — Ibn al-Shatir and al-Khalili worked within a
      Mamluk institution already established.'
    sources:
    - source/wikipedia-muwaqqit-en
    - source/king-synchrony-heavens-2004
  status_today: living
origin:
  polity: polity/mamluk-sultanate
  context:
    ar: 'مساجد القاهرة والفسطاط المملوكية — وللفن أصول أقدم في علم الميقات
      عند فلكيي العباسيين — حيث جمع المسجد بين المؤذن والفلكي ليصنع من علم
      الفلك خدمة عامة لأوقات المدينة {cite:encyclopaedia-of-islam-2}
      {cite:king-synchrony-heavens-2004}.'
    en: 'The mosques of Mamluk Cairo and Fustat — on foundations laid by
      Abbasid ''ilm al-miqat — where mosque and astronomer joined so that
      astronomy served the whole city''s clock {cite:encyclopaedia-of-islam-2}
      {cite:king-synchrony-heavens-2004}.'
    ur: 'مملوک قاہرہ اور فسطاط کی مسجدیں — عباسی علم میقات کی بنیادوں پر —
      جہاں مسجد اور فلکیات دان مل کر پورے شہر کی گھڑی چلانے لگے
      {cite:encyclopaedia-of-islam-2} {cite:king-synchrony-heavens-2004}۔'
makers:
- person: person/ibn-al-shatir
  role: describer
  place: place/damascus
  note: Led the team of muwaqqits at the Umayyad Mosque in Damascus
    (14th c.); wrote two zijes, made astrolabes and sundials, and produced
    the prayer-time and qibla tables of a working muwaqqit — witness to the
    office from inside it.
  sources:
  - source/wikipedia-muwaqqit-en
  - source/king-synchrony-heavens-2004
- person: person/shams-al-din-al-khalili
  role: describer
  place: place/damascus
  note: Muwaqqit of the Yalbugha Mosque then the Umayyad Mosque, Damascus
    (d. 1380); compiled prayer timetables for Damascus and tables for
    finding the qibla from any locality — the record''s fullest named
    example of the profession.
  sources:
  - source/wikipedia-muwaqqit-en
  - source/encyclopaedia-of-islam-2
attribution:
  status: original
  claim:
    ar: 'مؤسسة المواقيت موثقة أولاً في مصر المملوكية القرن الثالث عشر —
      وعبر عنها بألقاب مختلفة في الأندلس ⁦(المؤذن المبارك، أمين الأوقات)⁩ —
      ولا يُدّعى اختراع حساب الأوقات نفسه الذي يسبقها بقرون
      {cite:wikipedia-muwaqqit-en} {cite:encyclopaedia-of-islam-2}.'
    en: 'The muwaqqit office is first documented in thirteenth-century
      Mamluk Egypt — and under different titles in al-Andalus ⁦(the blessed
      muezzin, amin al-awqat)⁩ — without claiming that prayer-time
      computation itself, centuries older, was invented then
      {cite:wikipedia-muwaqqit-en} {cite:encyclopaedia-of-islam-2}.'
    ur: 'موقیت کا منصب پہلی بار تیرہویں صدی کی مملوک مصر میں مستند ہے —
      اندلس میں مختلف القاب ⁦(مبارک مؤذن، امین الاوقات)⁩ سے — بغیر اس دعوے
      کے کہ اوقات کا حساب خود، جو صدیوں پرانا ہے، اس وقت ایجاد ہوا
      {cite:wikipedia-muwaqqit-en} {cite:encyclopaedia-of-islam-2}۔'
  basis:
    ar: 'كينغ: أول مواقيت معروف بالاسم خدم في جامع عمرو ثلاثين سنة ومات
      ⁦(685/1286)⁩؛ وآل ابن باسو في غرناطة والسنهاجي في فاس يؤدون الوظيفة
      بألقاب أخرى؛ وتجمع EI2 مادة الميقات الفقهية ⁦(وينسنك)⁩ والفلكية
      ⁦(كينغ)⁩ {cite:wikipedia-muwaqqit-en} {cite:encyclopaedia-of-islam-2}
      {cite:king-synchrony-heavens-2004}.'
    en: 'King: the first muwaqqit known by name served the Mosque of Amr
      for thirty years and died ⁦(685/1286)⁩; the Ibn Baso family in
      Granada and al-Sanhaji in Fez performed the same role under other
      titles; and EI2 holds both the legal ⁦(Wensinck)⁩ and astronomical
      ⁦(King)⁩ halves of the miqat material {cite:wikipedia-muwaqqit-en}
      {cite:encyclopaedia-of-islam-2} {cite:king-synchrony-heavens-2004}.'
    ur: 'کنگ: نام سے پہلا معلوم موقیت جامع عمرو میں تیس برس خدمت دے کر
      ⁦(685/1286ء)⁩ وفات پایا؛ غرناطہ میں ابن باسو خاندان اور فاس میں
      سنہاجی وہی کردار دوسرے القاب سے ادا کرتے؛ اور EI2 میں فقہی ⁦(وینسنک)⁩
      اور فلکی ⁦(کنگ)⁩ دونوں نصف حصے موجود ہیں {cite:wikipedia-muwaqqit-en}
      {cite:encyclopaedia-of-islam-2} {cite:king-synchrony-heavens-2004}۔'
precursors:
- external:
    ar: مؤذن المسجد وخبرته بالظلال والشفق
    en: The muezzin's traditional timekeeping by shadows and twilight
    ur: مؤذن کی روایتی وقت شناسی سایوں اور شفق سے
  note: 'Major mosques often ran on the muezzin''s rule-of-thumb knowledge —
      shadow lengths for the day prayers, twilight for the night — before
      and alongside the muwaqqit''s computed tables; Brentjes speculates the
      office evolved from a specialised muezzin.'
  sources:
  - source/wikipedia-muwaqqit-en
- external:
    ar: علم الميقات العباسي والزيجات
    en: Abbasid ''ilm al-miqat and the zij tradition
    ur: عباسی علم میقات اور زیج کی روایت
  note: Astronomers had computed prayer times and universal auxiliary
    tables for centuries — Ibn Yunus and the zij authors; the muwaqqit
    institutionalised that science inside the mosque.
  sources:
  - source/king-synchrony-heavens-2004
  - source/encyclopaedia-of-islam-2
dependents:
