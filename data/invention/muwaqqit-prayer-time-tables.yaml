spread: []
impact:
  fields:
  - timekeeping
  - astronomy-instruments
  changed:
    ar: 'حوّل علم الفلك خدمة عامة: صارت أوقات الصلاة — والقبلة — جداول
      معلنة تحسب مسبقاً لكل مدينة بدل تقدير المؤذن بالظل {cite:king-synchrony-heavens-2004}
      {cite:encyclopaedia-of-islam-2}.'
    en: 'It turned astronomy into public service: prayer times — and the
      qibla — became published tables computed in advance for each city
      rather than the muezzin''s shadow estimate
      {cite:king-synchrony-heavens-2004} {cite:encyclopaedia-of-islam-2}.'
    ur: 'اس نے فلکیات کو عوامی خدمت بنا دیا: نماز کے اوقات — اور قبلہ —
      ہر شہر کے لیے پہلے سے شمار شدہ شائع جداول بن گئے بجائے مؤذن کے سائے کے
      اندازے کے {cite:king-synchrony-heavens-2004} {cite:encyclopaedia-of-islam-2}۔'
  history:
    ar: 'احتضنت المؤسسة فلكيي القرون الوسطى الأعظم — ابن الشاطر والخليلي —
      وأخرجت أدق جداول الأوقات والقبلة المعروفة، واستمرت عثمانياً في
      الموكيتخانات حتى استعارت الساعة الميكانيكية مكانها في القرن التاسع
      عشر {cite:wikipedia-muwaqqit-en}.'
    en: 'The office sheltered the greatest astronomers of its age — Ibn
      al-Shatir and al-Khalili — produced the finest known prayer and
      qibla tables, and continued Ottoman-style in the muvakkithanes until
      the mechanical clock took its duties in the nineteenth century
      {cite:wikipedia-muwaqqit-en}.'
    ur: 'اس منصب نے اپنے زمانے کے عظیم ترین ماہرین فلکیات — ابن الشاطر اور
      خلیلی — کو پناہ دی، عمدہ ترین اوقات و قبلہ جداول تیار کیے، اور موقت
      خانوں میں عثمانی صورت میں قائم رہا یہاں تک کہ انیسویں صدی میں
      مکینکی گھڑی نے اس کے فرائض سنبھال لیے {cite:wikipedia-muwaqqit-en}۔'
  significance: 5
  why: The medieval world's most sustained public application of
    mathematical astronomy — a professional office that kept a city's
    sacred time for six centuries and left the tradition every prayer app
    inherits.
