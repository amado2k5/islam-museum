today:
  form:
    ar: 'يصدر الجداولَ اليومَ دوائرُ الأوقاف والمراصد الرسمية، وتعرضها
      التطبيقات وساعات المساجد الإلكترونية؛ وبقيت بعض موكيتخانات إسطنبول
      مبانٍ قائمة {cite:wikipedia-muwaqqit-en}.'
    en: 'Today official religious agencies and observatories issue the
      tables, displayed by applications and mosques'' electronic clocks;
      several Istanbul muvakkithanes still stand {cite:wikipedia-muwaqqit-en}.'
    ur: 'آج سرکاری مذہبی ادارے اور رصدگاہیں جداول جاری کرتی ہیں جو ایپس اور
      مسجدوں کی برقی گھڑیوں پر دکھتے ہیں؛ استنبول کے بعض موقت خانے آج بھی
      کھڑے ہیں {cite:wikipedia-muwaqqit-en}۔'
  descendants:
    ar: 'جداول الأوقات المطبوعة والإمساكية وحاسبات أوقات الصلاة الإلكترونية
      كلها ورثة مباشرون لعمل الميقاتي {cite:wikipedia-muwaqqit-en}.'
    en: 'Printed timetables, the imsakiyya and electronic prayer-time
      calculators are all direct heirs of the muwaqqit''s work
      {cite:wikipedia-muwaqqit-en}.'
    ur: 'مطبوعہ جداول، امساکیہ اور برقی اوقاتِ نماز کیلکولیٹر سب موقیت کے
      کام کے براہ راست وارث ہیں {cite:wikipedia-muwaqqit-en}۔'
media:
  diagram: media/diagram-muwaqqit-prayer-time-tables
  image: media/diagram-muwaqqit-prayer-time-tables
kids:
  ar: 'كيف عرف الناس وقت الصلاة قبل الساعات؟ عينت المساجد الكبيرة عالماً
      بالنجوم يجلس في المسجد يحسب — بالجداول الفلكية — متى يزول الظل ومتى
      يغيب الشفق، ويكتب النتيجة جدولاً يقرأه المؤذن. كان اسمه «المواقيت» —
      صانع الأوقات — وعمل بعضهم فلكاً عظيماً بجانب عمله.'
  en: 'How did people know prayer times before clocks? The great mosques
      employed a star-scientist who sat in the mosque computing — from
      astronomical tables — when the noon shadow falls and when twilight
      ends, then wrote the answer as a timetable for the muezzin. He was
      called the muwaqqit, "the timekeeper" — and some of them did great
      astronomy on the side.'
  ur: 'گھڑیوں سے پہلے لوگ نماز کا وقت کیسے جانتے تھے؟ بڑی مسجدیں ایک ماہر
      فلکیات رکھتیں جو مسجد میں بیٹھ کر — فلکی جداول سے — ظہر کا سائے اور
      شفق کا غروب حساب کر کے مؤذن کے لیے جدول لکھتا۔ اسے «موقیت» — وقت ساز —
      کہتے، اور بعض نے اپنے کام کے ساتھ عظیم فلکیات بھی کی۔'
