today:
  form:
    ar: "لا يُعمل بالرسالة اليوم عملياً؛ تحل محلها جداول الحساب الفلكي الحديثة ومعايير رؤية الهلال الفلكية المنشورة، لكن الرسالة شاهدة على طريقة الميقاتية القديمة."
    en: "The treatise is not used practically today; modern astronomical tables and published crescent-visibility criteria have replaced it, but it witnesses the old muwaqqit method."
    ur: "آج یہ رسالہ عملی طور پر استعمال نہیں ہوتا؛ جدید فلکیاتی جداول اور شائع شدہ رؤیتِ ہلال کے معیار نے اس کی جگہ لے لی، مگر یہ پرانے میقاتی طریقے کی گواہ ہے۔"
  descendants:
    ar: "مبادئه في حساب الشهور ورؤية الهلال تنتقل إلى المواقيت اللاحقة والتقويم الإسلامي الحديث، لكن دون خط إنتاجي مباشر من هذه الرسالة."
    en: "Its principles of month computation and crescent sighting pass into later muwaqqit practice and the modern Islamic calendar, but without a direct production line from this treatise."
    ur: "مہینوں کے حساب اور رؤیتِ ہلال کے اس کے اصول بعد کے میقات اور جدید اسلامی کیلنڈر میں منتقل ہوتے ہیں، مگر اس رسالے سے کوئی سیدھا تسلسل نہیں۔"
