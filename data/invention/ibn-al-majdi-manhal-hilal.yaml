kids:
  ar: "تخيّل عالماً مسلماً اسمه ابن المجدي كان وظيفته أن يعرف الناس متى يبدأ كل شهر قمري. كتب رسالة صغيرة اسمها «المنهل العذب الزلال» تعلّم فيها كيف نحسب أول الشهر بالحساب، وكيف نبحث عن الهلال الصغير بعد الغروب. لم يكن يكتشف فلكاً جديداً، بل جمع ما يعرفه الميقاتيون في مكان واحد ليسهل على غيره استخدامه. {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 33}"
  en: "Imagine a Muslim scientist named Ibn al-Majdi whose job was to tell people when each lunar month begins. He wrote a small treatise called 'al-Manhal al-adhb al-zulal' teaching how to compute a month's start by calculation and how to search for the small crescent after sunset. He was not discovering new astronomy; he gathered what timekeepers knew into one place so others could use it. {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 33}"
  ur: "سوچو ایک مسلمان سائنسدان ابن المجدی جس کا کام لوگوں کو بتانا تھا کہ ہر قمری ماہ کب شروع ہوتا ہے۔ اس نے «المنہل العذب الزلال» نامی ایک چھوٹا سا رسالہ لکھا جس میں سکھایا کہ ماہ کے آغاز کو حساب سے کیسے نکالا جائے اور غروب کے بعد چھوٹا ہلال کیسے ڈھونڈا جائے۔ وہ نئی فلکیات دریافت نہیں کر رہا تھا؛ وہ میقاتوں کا وہ علم ایک جگہ جمع کر رہا تھا تاکہ دوسروں کے لیے استعمال آسان ہو۔ {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 33}"
