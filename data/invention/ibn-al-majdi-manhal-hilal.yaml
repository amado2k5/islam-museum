id: invention/ibn-al-majdi-manhal-hilal
class: invention
label:
  {
    ar: "منهج ابن المجدي في معرفة أوائل الشهور ورؤية الهلال ⁦(المنهل العذب الزلال)⁩",
    en: "Ibn al-Majdi's method for month beginnings and crescent sighting (al-Manhal al-adhb al-zulal)",
    ur: "ابن المجدی کا ماہ کے آغاز اور رؤیتِ ہلال کا طریقہ ⁦(المنہل العذب الزلال)⁩",
  }
names:
  - { value: "al-Manhal al-adhb al-zulal fi hall al-taqwim wa-ru'yat al-hilal", kind: full, lang: ar }
  - { value: "crescent-visibility treatise", kind: alternate, lang: en }
summary:
  ar: "رسالة موجزة لشهاب الدين ابن المجدي تحسب أوائل الشهور العربية بالحساب وتبيّن طرق رؤية الهلال؛ جمع فيها علم الميقات الذي تعلمه على جمال الدين المارديني، وكتبها في أوائل القرن التاسع الهجري على ما يبدو، وهي من تصانيف فلكية ما زالت تُقرأ في مصر حتى أواخر القرن التاسع عشر {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 33} {cite:islamsci-ibn-al-majdi-bea biography} {cite:tdv-ibnul-mecdi treatise list}."
  en: "A short treatise by Shihab al-Din Ibn al-Majdi that computes the beginnings of the Arab months by calculation and sets out crescent-sighting methods; it gathers the miqat science he learned under Jamal al-Din al-Mardini, appears to be written in the early ninth century AH, and is among the astronomical writings still read in Egypt into the late nineteenth century {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 33} {cite:islamsci-ibn-al-majdi-bea biography} {cite:tdv-ibnul-mecdi treatise list}."
  ur: "شہاب الدین ابن المجدی کا مختصر رسالہ جو حساب سے عربی مہینوں کے آغاز نکالتا ہے اور رؤیتِ ہلال کے طریقے بتاتا ہے؛ اس میں میقات کا وہ علم جمع ہے جو اس نے جمال الدین الماردینی سے سیکھا، اور ابتدائے نواں صدی ہجری میں لکھی گئی معلوم ہوتی ہے، اور ان فلکیاتی تصانیف میں ہے جو انیسویں صدی کے آخر تک مصر میں پڑھی جاتی رہیں {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 33} {cite:islamsci-ibn-al-majdi-bea biography} {cite:tdv-ibnul-mecdi treatise list}۔"
