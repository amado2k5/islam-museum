origin:
  place: place/cairo
  polity: polity/mamluk-sultanate
  context:
    ar: "سياق القاهرة المملوكية: ابن المجدي كان ميقاتياً في الجامع الأزهر ورئيس مشايخ مدرسة جنبكية، فخرجت الرسالة من بيئة مؤسسية للوقت لا من مدرسة نظرية معزولة."
    en: "Mamluk Cairo: Ibn al-Majdi was timekeeper at al-Azhar Mosque and head of teachers at the Jannibakiyya madrasa, so the treatise comes from an institutional timekeeping milieu, not an isolated theoretical school."
    ur: "قاہرہ کا مملوک سیاق: ابن المجدی جامع ازہر کے میقاتی اور جامعہ جنبکیہ کے استادوں کے سربراہ تھے، اس لیے رسالہ ادارہ جاتی وقت کے ماحول سے نکلا، کسی الگ نظری مکتب سے نہیں۔"
makers:
  - person: person/ibn-al-majdi
    role: improver
    note: "Cairene astronomer and muwaqqit (d. 850 AH) who compiled the treatise from the miqat science he learned under Jamal al-Din al-Mardini; Muslim identity documented by his religious education and mosque office."
    sources: [source/islamsci-ibn-al-majdi-bea, source/tdv-ibnul-mecdi]
attribution:
  status: improvement
  claim:
    ar: "حساب أوائل الشهور ورؤية الهلال ممارسة أقدم من ابن المجدي؛ مساهمته الموثقة جمعها في رسالة موجزة تربط الحساب برؤية الهلال، ضمن منهج الميقات الذي ورثه عن مدرسته."
    en: "Computing month beginnings and sighting the crescent are older practices than Ibn al-Majdi; his documented contribution is gathering them in a short treatise linking calculation to crescent sighting, within the miqat method he inherited from his school."
    ur: "ماہوں کے آغاز کا حساب اور رؤیتِ ہلال ابن المجدی سے پہلے کی مشقیں ہیں؛ اس کا مستند حصہ انہیں ایک مختصر رسالے میں جمع کرنا ہے جو حساب کو رؤیت سے جوڑتا ہے، اپنے مکتب سے وراثت میں ملے میقات طریقے کے اندر۔"
  basis:
    ar: "يصف الوصف أن الرسالة «في معرفة أوائل الشهور العربية بالحساب وطرق رؤية الهلال» وهي رسالة موجزة، وأنه تعلم الميقات على المارديني تلميذ ابن الشاطر؛ فالمحتوى تلخيص منهجي لا ادعاء أولوية لظاهرة الرؤية أو التقويم."
    en: "The record describes the treatise as 'on finding the beginnings of the Arab months by calculation and on sighting the crescent', calls it short, and notes he learned miqat under al-Mardini, a pupil of Ibn al-Shatir; the content is a methodical summary, not a priority claim for the phenomenon of sighting or the calendar."
    ur: "ریکارڈ بتاتا ہے کہ رسالہ «حساب سے عربی مہینوں کے آغاز اور رؤیتِ ہلال کے طریقوں» پر ہے اور مختصر ہے، اور کہ اس نے میقات الماردینی سے سیکھی جو ابن الشاتر کا شاگرد تھا؛ مواد ایک منظم خلاصہ ہے، رؤیت یا کیلنڈر کی اولیت کا دعویٰ نہیں۔"
precursors:
  - external:
      {
        ar: "ممارسة المواقيت والكسوفات ورؤية الهلال الأقدم في مصر والشام، وتعاليم مدرستي ابن الشاطر والمارديني اللذين كان ابن المجدي تلميذهما",
        en: "Earlier muwaqqit practice, eclipse and crescent-sighting work in Egypt and Syria, and the teaching of the Ibn al-Shatir and al-Mardini schools of which Ibn al-Majdi was a pupil",
        ur: "مصر و شام میں میقات، گرہن اور رؤیتِ ہلال کی پہلے کی مشقیں، اور ابن الشاتر و الماردینی کے مکتبوں کی تعلیم جن کا شاگرد ابن المجدی تھا",
      }
    note: "BEA records Ibn al-Majdi learned mīqāt under Jamal al-Din al-Mardini, himself a student of Ibn al-Shatir; crescent visibility was an established topic of the discipline, not his invention."
    sources: [source/islamsci-ibn-al-majdi-bea, source/tdv-ibnul-mecdi]
dependents:
  - external:
      {
        ar: "تلاميذ ابن المجدي وكتبه التي ظل قرّاؤها وشرّاحوها في مصر حتى أواخر القرن التاسع عشر، وأعمال المواقيت اللاحقة التي ورثت منهج الميقات",
        en: "Ibn al-Majdi's pupils and his books, whose readers and commentators persisted in Egypt into the late nineteenth century, plus later muwaqqit works that inherited the miqat method",
        ur: "ابن المجدی کے شاگرد اور اس کی کتابیں جن کے قارئین و شارحین انیسویں صدی کے آخر تک مصر میں رہے، اور بعد کے میقاتی کام جنہوں نے میقات کا طریقہ وراثت میں پایا",
      }
    note: "BEA states his writings were still read and commented upon in Egypt in the late nineteenth century and that virtually all his younger contemporaries and successors in Cairo astronomy were his pupils."
    sources: [source/islamsci-ibn-al-majdi-bea]
spread: []
impact:
  fields: [timekeeping, astronomy-instruments]
  changed:
    ar: "حوّل علم الميقات النظري إلى رسالة عملية موجزة تصلح لميقاتي المسجد: حساب أوائل الشهور ورؤية الهلال في مكان واحد قابل للحمل."
    en: "Turned theoretical miqat science into a short practical treatise fit for the mosque timekeeper: month beginnings and crescent sighting gathered in one portable place."
    ur: "نظری میقات کے علم کو ایک مختصر عملی رسالے میں بدل دیا جو مسجد کے میقاتی کے لیے موزوں تھا: ماہ کے آغاز اور رؤیتِ ہلال ایک ہی لے جانے والے مقام پر جمع۔"
  history:
    ar: "مثال على دور الميقاتي المؤسسي: فلكي مكرَّس للوقت الديني لا للفلك النظري، فخرجت تصانيفه تطبيقات لا اكتشافات."
    en: "An example of the institutional muwaqqit's role: an astronomer devoted to religious time, so his writings yield applications rather than discoveries."
    ur: "ادارہ جاتی میقاتی کے کردار کی مثال: مذہبی وقت کے لیے وقف ماہر فلکیات، اس لیے اس کی تصانیف دریافتیں نہیں بلکہ عملی نتائج دیتی ہیں۔"
  significance: 4
  why: "A named treatise by a documented mosque timekeeper on the practical problem of the lunar calendar, still read into the nineteenth century; significant for the miqat tradition, not for a new theory of sighting."
