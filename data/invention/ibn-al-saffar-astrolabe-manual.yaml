impact:
  fields: [astronomy-instruments]
  changed:
    ar: "قدّم أسلوباً شاملاً وواضحاً لتعليم عمل الأسطرلاب فبلغ القارئ العربي ثم اللاتيني والعبراني والإسباني، مع بقاء استعماله في أوروبا حتى القرن الخامس عشر {cite:bea-ibn-al-saffar}."
    en: "Offered a comprehensive, clear way of teaching astrolabe operation that reached Arabic, then Latin, Hebrew and Spanish readers, remaining in European use into the fifteenth century {cite:bea-ibn-al-saffar}."
    ur: "اسطرلاب کے کام سکھانے کا جامع اور واضح طریقہ پیش کیا جو عربی، پھر لاطینی، عبرانی اور ہسپانوی قارئین تک پہنچا اور پندرہویں صدی تک یورپی استعمال میں رہا {cite:bea-ibn-al-saffar}۔"
  history:
    ar: "ترجماته أثبتت وصول العلم الأندلسي إلى أوروبا عبر اللاتينية، ونسبه الناقلون خطأً إلى معلمه مسلمة في نسخة واحدة بسبب فصل منقول في آخر الكتاب {cite:bea-ibn-al-saffar}."
    en: "Its translations attest the passage of Andalusi science to Europe through Latin; in one version transmitters misattributed it to his teacher Maslama because of a borrowed final chapter {cite:bea-ibn-al-saffar}."
    ur: "اس کے تراجم اندلسی علم کے لاطینی کے ذریعے یورپ پہنچنے کی گواہی ہیں؛ ایک نسخے میں ناقلوں نے کتاب کے آخر کے مستعار باب کی وجہ سے اسے اس کے استاد مسلمہ سے منسوب کر دیا {cite:bea-ibn-al-saffar}۔"
  significance: 4
  why: "A documented comprehensive manual whose clear style and wide translation record — Latin, Hebrew, Old Spanish, Alfonso X's court, fifteenth-century European use — give it unusually well-attested spread for an instrument treatise."
