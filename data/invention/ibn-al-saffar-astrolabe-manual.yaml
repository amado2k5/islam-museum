makers:
  - person: person/abu-al-qasim-ibn-al-saffar
    role: describer
    place: place/cordoba
    note: "Documented author of the treatise on astrolabe use; his position in Maslama's Cordoban school and his Arabic scholarly works document the Muslim basis. The Sunni label is the museum's declared frame for an Andalusi scholar of the Sunni milieu; no personal madhhab is asserted beyond the record."
    sources: [source/bibalex-azhar-astronomy-manuscripts-2006, source/bea-ibn-al-saffar]
attribution:
  status: improvement
  claim:
    ar: "دليل شامل وموثق لاستعمال الأسطرلاب بلغته واضحة، وترجم إلى اللاتينية والعبرية والإسبانية القديمة؛ لا ادعاء باختراع الأسطرلاب نفسه."
    en: "A comprehensive, clearly written documented guide to astrolabe operation, translated into Latin, Hebrew and Old Spanish; no claim to have invented the astrolabe itself."
    ur: "اسطرلاب کے استعمال کی جامع اور واضح زبان میں لکھی گئی مستند کتاب، جو لاطینی، عبرانی اور پرانی ہسپانوی میں ترجمہ ہوئی؛ اسطرلاب کی ایجاد کا کوئی دعویٰ نہیں۔"
  basis:
    ar: "يصف المعجم البيوغرافي ابن الصفار بأنه مؤلف أشهر كتبه رسالة في استعمال الأسطرلاب ظلت مستعملة في أوروبا حتى القرن الخامس عشر، وأن يوحنا اللخمي وأفلاطون الطليطلي ترجمها إلى اللاتينية وأن الملك ألفونسو العاشر كان من مستعمليها {cite:bea-ibn-al-saffar}."
    en: "The Biographical Encyclopedia calls his treatise on the uses of the astrolabe his most popular work, still used in Europe in the fifteenth century, translated into Latin by Johannes Hispalensis and Plato of Tivoli, and used by Alfonso X's astronomers {cite:bea-ibn-al-saffar}."
    ur: "بائیوگرافیکل انسائیکلوپیڈیا اس کے اسطرلاب کے استعمال کے رسالے کو ان کی مشہور ترین کتاب کہتا ہے جو پندرہویں صدی تک یورپ میں استعمال ہوتی رہی، یوحنا ہسپالینسس اور افلاطون طلیطلی نے لاطینی ترجمہ کیا اور الفانسو دہم کے ماہرین فلکیات اسے استعمال کرتے تھے {cite:bea-ibn-al-saffar}۔"
  perspectives: []
precursors:
  - external: { ar: "أدبيات الأسطرلاب اليونانية والعربية السابقة", en: "Earlier Greek and Arabic astrolabe literature", ur: "پہلی یونانی اور عربی اسطرلاب کی کتب" }
    note: "The astrolabe's projection principle descends from earlier instrument literature; Ibn al-Saffar's contribution is the comprehensive operating manual, not the instrument {cite:bea-ibn-al-saffar} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14}."
    sources: [source/bea-ibn-al-saffar, source/bibalex-azhar-astronomy-manuscripts-2006]
