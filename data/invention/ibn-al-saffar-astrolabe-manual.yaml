kids:
  ar: "كان الأسطرلاب آلة مسطحة تساعد على معرفة الوقت والجهات وارتفاع النجوم. كتب ابن الصفار رسالة تشرح كيف يُستعمل خطوة خطوة، فوصلت ترجماتها إلى أوروبا وبقيت تُقرأ هناك قروناً بعد موته."
  en: "The astrolabe was a flat instrument that helped tell time, directions and star heights. Ibn al-Saffar wrote a treatise explaining how to use it step by step; its translations reached Europe and were still read there centuries after his death."
