  context:
    ar: "سياق مدرسة مسلمة المجريطي في قرطبة، حيث درس ابن الصفار الحساب والهندسة والفلك وتخرج عليه تلاميذ، قبل انتقاله إلى دانية بسبب الفتنة الأهلية {cite:bea-ibn-al-saffar} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14}."
    en: "Context of Maslama al-Majriti's school at Cordoba, where Ibn al-Saffar taught arithmetic, geometry and astronomy to disciples, before moving to Denia amid civil war {cite:bea-ibn-al-saffar} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14}."
