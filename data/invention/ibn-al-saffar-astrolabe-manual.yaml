  descendants:
    ar: "الأسطرلاب نفسه صار آلة متحفية وأثرية بعد أفول استعماله، لكن أسلوب الشروح العملية للآلات استمر في كتب لاحقة {cite:bea-ibn-al-saffar}."
    en: "The astrolabe itself became a museum and antiquarian object after its working use faded, but the practical manual tradition for instruments continued in later books {cite:bea-ibn-al-saffar}."
