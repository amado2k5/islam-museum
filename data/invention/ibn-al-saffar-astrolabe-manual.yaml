summary:
  ar: "رسالة أندلسية شاملة في استعمال الأسطرلاب ألفها أبو القاسم أحمد بن عبد الله ابن الصفار الغافقي، تلميذ مسلمة المجريطي في قرطبة، وصفها سعيد الأندلسي بأنها بلغة واضحة ومفهومة، وترجمت إلى اللاتينية نحو 1134م واستعملها فلكيو بلاط ألفونسو العاشر {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14} {cite:bea-ibn-al-saffar}."
  en: "A comprehensive Andalusi treatise on using the astrolabe by Abu al-Qasim Ahmad ibn Abdallah Ibn al-Saffar al-Ghafiqi, pupil of Maslama al-Majriti at Cordoba; Sa'id al-Andalusi described it as clear and comprehensible, and it was translated into Latin about 1134 and used by Alfonso X's astronomers {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14} {cite:bea-ibn-al-saffar}."
  ur: "ابو القاسم احمد بن عبد اللہ ابن الصفار الغافقی کا اندلسی کام اسطرلاب کے استعمال کا جامع رسالہ تھا، جو قرطبہ میں مسلمہ المجریطی کا شاگرد تھا؛ سعید الاندلسی نے اسے واضح اور قابل فہم زبان میں بیان کیا، اور یہ تقریباً 1134ء میں لاطینی ترجمہ ہوا اور الفانسو دہم کے ماہرین فلکیات نے استعمال کیا {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14} {cite:bea-ibn-al-saffar}۔"
  es: "Un tratado andalusí exhaustivo sobre el uso del astrolabio por Abu al-Qasim Ahmad ibn Abdallah Ibn al-Saffar al-Ghafiqi, discípulo de Maslama al-Majriti en Córdoba; Sa'id al-Andalusi lo describió como claro y comprensible, y fue traducido al latín alrededor de 1134 y utilizado por los astrónomos de Alfonso X {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14} {cite:bea-ibn-al-saffar}."
  fr: "Un traité andalou complet sur l'utilisation de l'astrolabe par Abu al-Qasim Ahmad ibn Abdallah Ibn al-Saffar al-Ghafiqi, élève de Maslama al-Majriti à Cordoue; Sa'id al-Andalusi l'a décrit comme clair et compréhensible, et il a été traduit en latin vers 1134 et utilisé par les astronomes d'Alphonse X {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 14} {cite:bea-ibn-al-saffar}."
