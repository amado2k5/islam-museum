summary:
  ar: 'نظام تعمية بمفتاح عمومي ومخطط توقيع رقمي اقترحهما المشفِّر المصري-الأمريكي
    طاهر الجمل في ورقته عام 1985 «نظام تعمية بمفتاح عمومي ومخطط توقيع مبنيان على اللوغاريتمات
    المتقطعة»: يبني على تبادل مفاتيح ديفي-هلمان في زمرة دائرية ويستمد أمانه من صعوبة
    مسألة اللوغاريتم المتقطع، بمفتاح عابر جديد لكل رسالة؛ ومخطط توقيعه صار أساس خوارزمية
    التوقيع الرقمي DSA ومعيار NIST، وتعميته مستعملة في GNU Privacy Guard وإصدارات
    PGP الحديثة {cite:wikipedia-elgamal-encryption-en} {cite:wikipedia-taher-elgamal-en}.'
  en: 'A public-key cryptosystem and digital signature scheme proposed by the Egyptian-American
    cryptographer Taher Elgamal in his 1985 paper ''A public key cryptosystem and
    a signature scheme based on discrete logarithms'': built on the Diffie-Hellman
    key exchange in a cyclic group, its security resting on the difficulty of the
    discrete logarithm problem, with a fresh ephemeral key for every message; his
    signature scheme became the basis of the Digital Signature Algorithm ⁦(DSA)⁩ adopted
    by NIST, and the encryption is used in GNU Privacy Guard and recent PGP versions
    {cite:wikipedia-elgamal-encryption-en} {cite:wikipedia-taher-elgamal-en}.'
  ur: 'ایک عوامی کلیدی خفیہ نظام اور برقی دستخطی مخطط جو مصری نژاد امریکی خفیہ نگار
    طاہر الجمل نے اپنے 1985 کے مقالے «عوامی کلیدی نظام اور گوشوار لوگارتھم پر مبنی
    دستخطی مخطط» میں تجویز کیا: چکر گروہ میں ڈیفی-ہیلمن کلیدی تبادلے پر قائم، اس کی
    حفاظت گوشوار لوگارتھم مسئلے کی دشواری پر ٹکی ہے، اور ہر پیغام کے لیے نئی عارضی
    کلید استعمال ہوتی ہے؛ اس کا دستخطی مخطط NIST کے معیار DSA کی بنیاد بنا، اور خفیہ
    نظام GNU Privacy Guard اور PGP کے نئے نسخوں میں استعمال ہوتا ہے {cite:wikipedia-elgamal-encryption-en}
    {cite:wikipedia-taher-elgamal-en}۔'
  es: "Un criptosistema de clave pública y un esquema de firma digital propuestos por el criptógrafo egipcio-estadounidense Taher Elgamal en su artículo de 1985 'Un criptosistema de clave pública y un esquema de firma basado en logaritmos discretos': construido sobre el intercambio de claves Diffie-Hellman en un grupo cíclico, su seguridad se basa en la dificultad del problema del logaritmo discreto, con una nueva clave efímera para cada mensaje; su esquema de firma se convirtió en la base del Algoritmo de Firma Digital (DSA) adoptado por el NIST, y el cifrado se utiliza en GNU Privacy Guard y versiones recientes de PGP {cite:wikipedia-elgamal-encryption-en} {cite:wikipedia-taher-elgamal-en}."
