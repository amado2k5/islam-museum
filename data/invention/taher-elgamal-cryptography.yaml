kids:
  ar: 'طاهر الجمل عالم مصري كتب عام 1985 طريقة ذكية: تستطيع أن ترسل لصديقك رسالة سرية
    لا يقرؤها غيره حتى لو رآها كل الناس، لأن حلّها يحتاج مسألة رياضية صعبة جداً لا
    يعرف جوابها إلا هو. بهذه الفكرة نرسل اليوم رسائلنا الآمنة ونشتري من الإنترنت.'
  en: 'Taher Elgamal is an Egyptian scientist who wrote a clever method in 1985: you
    can send a friend a secret message that nobody else can read even if everyone
    sees it, because solving it needs a very hard maths puzzle only your friend can
    answer. With this idea we send safe messages and shop on the Internet today.'
  ur: 'طاہر الجمل ایک مصری سائنسدان ہیں جنھوں نے 1985 میں ایک ہوشیار طریقہ لکھا: تم
    اپنے دوست کو ایسا خفیہ پیغام بھیج سکتے ہو جو کوئی اور نہ پڑھ سکے چاہے سب دیکھ
    لیں، کیونکہ اسے کھولنا ایک بہت مشکل ریاضی کا پہیلی مانگتا ہے جو صرف دوست حل کر
    سکتا ہے۔ اسی خیال سے آج ہم محفوظ پیغامات بھیجتے اور انٹرنیٹ سے خریدتے ہیں۔'
