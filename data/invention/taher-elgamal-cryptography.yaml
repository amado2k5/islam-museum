today:
  form:
    ar: يعيش اليوم في GNU Privacy Guard وإصدارات PGP، وذريته المعيارية DSA؛ أما صاحبه
      فقاد بناء SSL الذي يؤمّن التصفح كل يوم {cite:wikipedia-elgamal-encryption-en}
      {cite:wikipedia-taher-elgamal-en}.
    en: It lives on in GNU Privacy Guard and PGP versions and in its standard descendant
      DSA, while its maker went on to drive SSL, the protocol securing daily browsing
      {cite:wikipedia-elgamal-encryption-en} {cite:wikipedia-taher-elgamal-en}.
    ur: یہ آج GNU Privacy Guard اور PGP کے نسخوں اور اپنی معیاری اولاد DSA میں جیتا
      ہے، جبکہ اس کا موجد SSL کو آگے بڑھا چکا ہے جو روز کی براؤزنگ محفوظ کرتا ہے {cite:wikipedia-elgamal-encryption-en}
      {cite:wikipedia-taher-elgamal-en}۔
  descendants:
    ar: التوقيعات البيضاوية الحديثة ⁦(ECDSA)⁩ حفيد الخط نفسه، وشبكة التوقيع الموثوق
      وقّعت بها الأنظمة الحكومية والبرمجية عقوداً {cite:wikipedia-taher-elgamal-en}.
    en: Modern elliptic-curve signatures ⁦(ECDSA)⁩ are grandchildren of the same line,
      and the DSA standard signed government and software systems for decades {cite:wikipedia-taher-elgamal-en}.
    ur: جدید elliptic-curve دستخط ⁦(ECDSA)⁩ اسی لکیر کی اولاد ہیں، اور DSA معیار نے
      دہائیوں تک حکومتی اور سافٹ ویئر نظاموں پر دستخط کیے {cite:wikipedia-taher-elgamal-en}۔
