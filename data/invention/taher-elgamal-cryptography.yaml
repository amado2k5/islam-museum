  changed:
    ar: 'جعل السرية العمومية قابلة للتنفيذ في برمجيات حرة: بريد مشفر وتوقيعات رقمية
      تُثبت الهوية بلا لقاء مسبق، حتى صار أمان التجارة الإلكترونية مبنياً على هذه
      المدرسة {cite:wikipedia-elgamal-encryption-en} {cite:wikipedia-taher-elgamal-en}.'
    en: 'It made public-key secrecy practical in free software: encrypted mail and
      digital signatures that prove identity without a prior meeting, until e-commerce
      security was built on this school {cite:wikipedia-elgamal-encryption-en} {cite:wikipedia-taher-elgamal-en}.'
    ur: 'اس نے آزاد سافٹ ویئر میں عوامی کلیدی رازداری کو عملی بنا دیا: خفیہ ڈاک اور
      برقی دستخط جو پہلی ملاقات کے بغیر شناخت ثابت کریں، یہاں تک کہ ای کامرس کی حفاظت
      اسی روایت پر بنی {cite:wikipedia-elgamal-encryption-en} {cite:wikipedia-taher-elgamal-en}۔'
  history:
    ar: 'من أوراق التشفير المؤسسة في القرن العشرين: أعطى العالم ثاني أسرة كبرى للمفتاح
      العمومي بعد RSA، ووريثه القياسي DSA وقّع وثائق حكومات وبرامج لعقود {cite:wikipedia-taher-elgamal-en}
      {cite:wikipedia-elgamal-encryption-en}.'
    en: 'One of the founding papers of twentieth-century cryptography: it gave the
      world a second great public-key family after RSA, and its standard descendant
      DSA signed the documents of governments and software for decades {cite:wikipedia-taher-elgamal-en}
      {cite:wikipedia-elgamal-encryption-en}.'
    ur: 'بیسویں صدی کی خفیہ نگاری کے بانی مقالوں میں سے: RSA کے بعد دنیا کو عوامی
      کلید کا دوسرا بڑا خاندان دیا، اور اس کی معیاری اولاد DSA نے دہائیوں تک حکومتوں
      اور سافٹ ویئر کے دستاویزات پر دستخط کیے {cite:wikipedia-taher-elgamal-en} {cite:wikipedia-elgamal-encryption-en}۔'
  significance: 4
  why: The named public-key cryptosystem and signature scheme of an Egyptian-American
