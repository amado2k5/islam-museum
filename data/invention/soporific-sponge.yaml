today:
  form:
    ar: "لا يُستخدم الإسفنج المنوم اليوم؛ حلّ محله غازات ومركبات التخدير المتحكم بها التي يسجل تاريخها هذا الجهاز في أوله."
    en: "The soporific sponge is not used today; controlled anaesthetic gases and compounds replaced it, and the device's history stands at the beginning of that record."
    ur: "آج اسفنجِ منوّم استعمال نہیں ہوتا؛ اس کے مقام پر قابو شدہ بے ہوشی گیسیں اور مرکبات آئیں، اور اس آلے کی تاریخ اسی ریکارڈ کے آغاز میں ہے۔"
  descendants:
    ar: "أجهزة الاستنشاق الحديثة — أقنعة الغاز ونظام التوصيل — وراثت میں لیتے ہیں: منوّم کو ہضمی نہیں بلکہ تنفسی راستے سے پہنچانا۔"
    en: "Modern inhalation devices — gas masks and delivery systems — inherit the sponge's idea: delivering the agent through the respiratory tract rather than the gut."
    ur: "جدید استنشاقی آلات — گیس ماسک اور ترسیل کے نظام — اسفنج کا خیال وراثت میں لیتے ہیں: ادویہ کو ہضمی نہیں بلکہ تنفسی راستے سے پہنچانا۔"
media:
