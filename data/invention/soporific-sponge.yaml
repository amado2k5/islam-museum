id: invention/soporific-sponge
class: invention
label:
  ar: "الإسفنج المنوِّم"
  en: "The soporific sponge"
  ur: "نیند دلانے والا اسفنج"
  es: "La esponja soporífera"
names:
  - { value: "al-isfanjah al-muriqqadah", kind: alternate, lang: ar }
  - { value: "soporific sponge", kind: alternate, lang: en }
  - { value: "anaesthetic sponge", kind: alternate, lang: en }
summary:
  ar: "إسفنج يُنقع في منقوع منوِّم — أو مدرجة من الأفيون والقنب والهيوسيام — ثم يُجفَّف ويُبلَّل عند الحاجة ويُوضَع على أنف المريض وشفتيه فيهدّئه قبل الجراحة؛ نسبت التأريخ الشعبي لهذه الحيلة إلى الجراحين المسلمين، بينما يعثر باحثو تاريخ التخدير على أقدم صيغة معروفة لها في مجموع قسطنطين الإفريقي وتصل إلى أوروبا عبر ثيودوريك من بولونيا."
  en: "A sponge soaked in a soporific preparation — accounts name opium, hemp and henbane among its ingredients — then dried and re-moistened for use, placed at the patient's nostrils and lips to calm him before surgery; popular history attributes the device to Muslim surgeons, while historians of anaesthesia find the earliest known formula in a Constantinus Africanus compilation reaching Europe through Theodoric of Bologna."
  ur: "ایک اسفنج جسے نیند دلانے والی تیاری میں بھگویا جاتا — روایات میں افیون، بھنگ اور دیتورا شامل ہیں — پھر خشک کر کے ضرورت پر گیلا کیا جاتا اور مریض کی ناک اور ہونٹوں پر رکھا جاتا تاکہ جراحی سے پہلے وہ بے ہوش ہو؛ مقبول تاریخ اس حربے کو مسلمان جراحوں سے جوڑتی ہے، جبکہ بے ہوشی کی تاریخ کے محققین قدیم ترین معلوم ترکیب قسطنطین الافریقی کے مجموعے میں پاتے ہیں جو تھیوڈورک آف بولونیا کے ذریعے یورپ پہنچی۔"
  es: "Una esponja empapada en una preparación soporífera —entre cuyos ingredientes se mencionan el opio, el cáñamo y el beleño—, que luego se secaba y se volvía a humedecer para su uso, se colocaba en las fosas nasales y los labios del paciente para calmarlo antes de la cirugía; la historia popular atribuye el invento a los cirujanos musulmanes, mientras que los historiadores de la anestesia encuentran la fórmula más antigua conocida en una compilación de Constantino el Africano que llegó a Europa a través de Teodorico de Bolonia."
