  diagram: media/diagram-soporific-sponge
kids:
  ar: "تخيّل أنك ستخضع لعملية جراحية قبل ألف سنة، والطبيب يخافك من الألم. كان الجراح يبلّ إسفنجاً بمزيج منوّم ويضعه على أنفك، فتغفو قبل أن يبدأ. هذه فكرة الإسفنج المنوم — لكن من اخترعه أولاً لا نعرف بالضبط؛ نعرف أن صيغة قديمة له بقيت في مخطوطات وبقيت الممارسة في أوروبا قروناً."
  en: "Imagine you are about to have an operation a thousand years ago, and the doctor fears the pain. The surgeon would wet a sponge with a soporific mixture and place it at your nose, and you would fall asleep before he began. That is the soporific sponge — but who first made it we do not know exactly; we know an old formula survived in manuscripts and the practice lasted in Europe for centuries."
  ur: "سوچو کہ تم ہزار سال پہلے آپریشن کے لیے جا رہے ہو اور ڈاکٹر درد سے ڈرتا ہے۔ جراح ایک اسفنج کو منوّم میخانے میں بھگو کر تمہاری ناک پر رکھتا، تو وہ شروع ہونے سے پہلے ہی تم سو جاتے۔ یہی اسفنجِ منوّم ہے — لیکن پہلے کس نے بنایا ہمیں بالکل نہیں معلوم؛ ہمیں معلوم ہے کہ اس کی ایک پرانی ترکیب مخطوطوں میں رہی اور یہ عمل یورپ میں صدیوں چلا۔"
