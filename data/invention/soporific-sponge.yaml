era:
  origins: middle-period
  first_attested:
    edtf: "1000"
    hijri: "0390"
    calendar: julian
    precision: century
    status: debated
    note: "The soporific sponge is documented in قرون وسطیٰ medical manuscripts; the Anesthesiology history places the earliest known formula in a Constantinus Africanus compilation and traces the tradition into the seventeenth century {cite:anesthesiology-soporific-sponges-2000}. Whether an earlier Islamic-surgery description existed is contested in the sources read."
    sources: [source/anesthesiology-soporific-sponges-2000]
  status_today: replaced
origin:
  place: place/baghdad
  context:
    ar: "النصوص التي تذكر الإسفنج المنوم تظهر في تقاليد الطب السرياني-العربي ثم تنتقل إلى اللاتينية؛ مكان الصياغة الدقيق أولاً غير محسوم بين بيئات المستشفيات والجراحة."
    en: "The texts mentioning the soporific sponge appear in the Syriac-Arabic medical tradition and then pass into Latin; the exact first setting is unsettled between hospital and surgical milieux."
    ur: "اسفنجِ منوّم کا ذکر کرنے والے متون شامی-عربی طبی روایت میں آتے ہیں پھر لاطینی میں منتقل ہوتے ہیں؛ ابتدائی مقام سرجری اور ہسپتال دونوں کے درمیان غیر متعین ہے۔"
makers:
  - person: person/al-zahrawi
    role: disputed
    note: "Some secondary accounts credit al-Zahrawi with devising the anesthetic sponge; the sources read here neither confirm a Zahrawi sponge formula nor deny his surgical-anesthesia context — attribution stays disputed."
    sources: [source/anesthesiology-soporific-sponges-2000, source/tdv-tasrif-zehravi]
attribution:
  status: contested
  claim:
    ar: "يُنسب الإسفنج المنوم تقليدياً إلى الجراحين المسلمين وإلى الزهراوي تحديداً في بعض الروايات؛ لكن أقدم صيغة موثقة في المصادر المقروءة تعود إلى مجموع قسطنطين الإفريقي، وتصل التقنية إلى أوروبا عبر ثيودوريك من بولونيا، فلا يمكن حسم نسبة الاختراع لشخص واحد."
    en: "The soporific sponge is traditionally credited to Muslim surgeons and specifically to al-Zahrawi in some accounts; but the earliest documented formula in the sources read belongs to a Constantinus Africanus compilation, and the technique reached Europe through Theodoric of Bologna, so the invention cannot be settled on one person."
    ur: "اسفنجِ منوّم کی روایت روایتی طور پر مسلمان جراحوں اور کچھ بیانات میں خاص طور پر الزہراوی سے منسوب ہے؛ لیکن پڑھے گئے ماخذوں میں قدیم ترین دستاویزی ترکیب قسطنطین الافریقی کے مجموعے کی ہے، اور یہ طریقہ تھیوڈورک آف بولونیا کے ذریعے یورپ پہنچا، اس لیے ایجاد کا ثبوت کسی ایک شخص پر طے نہیں ہوتا۔"
  basis:
    ar: "يصف مقال Anesthesiology الصيغ المخطوطية من القرن 11 إلى 17 ويضع أقدم صيغة في مجموع قسطنطين الإفريقي {cite:anesthesiology-soporific-sponges-2000}. وتذكر روايات ثانوية أخرى نسبة الإسفنج إلى الزهراوي {cite:tdv-tasrif-zehravi}."
    en: "The Anesthesiology article describes the manuscript formulas of the 11th–17th centuries and places the earliest formula in the Constantinus Africanus compilation {cite:anesthesiology-soporific-sponges-2000}. Other secondary accounts credit al-Zahrawi with the sponge {cite:tdv-tasrif-zehravi}."
    ur: "Anesthesiology کا مضمون گیارہویں سے سترہویں صدی کی مخطوطہ ترکیبوں کو بیان کرتا ہے اور قدیم ترین ترکیب قسطنطین الافریقی کے مجموعے میں رکھتا ہے {cite:anesthesiology-soporific-sponges-2000}۔ دوسری ثانوی روایات اسفنج کو الزہراوی سے جوڑتی ہیں {cite:tdv-tasrif-zehravi}۔"
  perspectives:
    - tradition: sunni
      id: persp-sunni
      summary:
        ar: "الإطار السني المعلن يقدّم موسوعة TDV لكتاب التصريف بوصفه أوسع الجراحة العربية الإسلامية، ويذكر أن الزهراوي عمل في بيئة بيها instruments وأدوات؛ وهذا لا يثبت أنه وصف الإسفنج المنوم نفسه."
        en: "The declared Sunni frame presents al-Tasrif as the broadest Arabic-Islamic surgical encyclopaedia with an instrument culture around it; that does not prove he described the soporific sponge itself."
        ur: "اعلان کردہ سنی سیاق «التصریف» کو وسیع ترین عربی اسلامی جراحی دائرۃ المعارف کے طور پر پیش کرتا ہے جس کے گرد آلات کا کلچر موجود ہے؛ اس سے یہ ثابت نہیں ہوتا کہ اس نے خود اسفنجِ منوّم بیان کیا۔"
      sources: [source/tdv-tasrif-zehravi]
    - tradition: academic
      id: persp-academic
      summary:
        ar: "يقرأ Keyes في Anesthesiology أن أقدم صيغة معروفة للإسفنج المنوم تعود إلى مجموع قسطنطين الإفريقي، وأن التقنية انتقلت إلى ثيودوريك من بولونيا ثم إلى الممارسة الأوروبية حتى القرن الثامن عشر."
        en: "Keyes reads in Anesthesiology that the earliest known soporific-sponge formula belongs to the Constantinus Africanus compilation, and the technique passed to Theodoric of Bologna and then to European practice until the eighteenth century."
        ur: "Keyes Anesthesiology میں پڑھتا ہے کہ اسفنجِ منوّم کی قدیم ترین معلوم ترکیب قسطنطین الافریقی کے مجموعے میں ہے، اور یہ طریقہ تھیوڈورک آف بولونیا اور پھر یورپی عمل تک سترہویں صدی پہنچا۔"
      sources: [source/anesthesiology-soporific-sponges-2000]
precursors:
  - external:
      ar: "المخدرات النباتية في الطب القديم — الأفيون والهيوسيام والبذور — التي استُخدمت منوّمة قبل الإسفنج."
      en: "Plant narcotics in ancient medicine — opium, henbane and seed preparations — used as soporifics before the sponge."
      ur: "قدیم طب میں نباتاتی نشہ آور ادویہ — افیون، ہیوسرام اور بیج کی تیاریاں — جو اسفنج سے پہلے منوّم کے طور پر استعمال ہوتی تھیں۔"
    note: "The sponge is a carrier for these agents; the Anesthesiology article lists opium, mandrake, hemlock and henbane in the Constantinus formula {cite:anesthesiology-soporific-sponges-2000}."
    sources: [source/anesthesiology-soporific-sponges-2000]
dependents:
  - external:
      ar: "ممارسة التخدير الاستنشاقي في أوروبا — ثيودوريك من بولونيا وكتبه في الجراحة — حتى ظهور التخدير الكيميائي الحديث."
      en: "Inhalational anaesthesia practice in Europe — Theodoric of Bologna and his surgical writings — until modern chemical anaesthesia appeared."
      ur: "یورپ میں استنشاقی بے ہوشی کا عمل — تھیوڈورک آف بولونیا اور اس کی جراحی کتابیں — یہاں تک کہ جدید کیمیائی بے ہوشی آئی۔"
    note: "The 2000 article traces the sponge tradition into the seventeenth century {cite:anesthesiology-soporific-sponges-2000}."
    sources: [source/anesthesiology-soporific-sponges-2000]
spread: []
impact:
  fields: [medicine-surgery]
  changed:
    ar: "حوّل المنوّم من شراب يُشرَب بجرعات خطرة إلى وسيلة محمولة — إسفنج يُبلَّل ويُجفَّف — بحيث يبقى المفعول في مكان واحد قابل للضبط."
    en: "It turned the soporific from a risky multi-dose drink into a carrier — a sponge soaked and dried — so the agent stayed in one place that could be controlled."
    ur: "اس نے منوّم کو خطرناک کثیر خوراک کے مشروب سے ایک بارآور وسیلے میں بدلا — بھیگا اور خشک کیا ہوا اسفنج — تاکہ ادویہ ایک جگہ رہے جو قابو میں ہو۔"
  history:
    ar: "بقي الإسفنج المنوم مستخدماً في عمليات الجراحة الأوروبية حتى القرن الثامن عشر تقريباً، ثم حلّ محله الإيثر والأثير والكلوروفورم."
    en: "The soporific sponge stayed in use for European operations until about the eighteenth century, when ether, chloroform and their successors replaced it."
    ur: "اسفنجِ منوّم یورپی جراحی میں آٹھارہویں صدی تک تقریباً استعمال ہوتا رہا، پھر اس کے مقام پر ایتھر، کلوروفارم اور ان کے جانشین آئے۔"
  significance: 2
  why: "A documented قرون وسطیٰ anaesthetic device with contested attribution; the rating reflects its place in the history of anaesthesia, not a settled claim of invention."
