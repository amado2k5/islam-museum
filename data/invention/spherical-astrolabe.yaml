today:
  form:
    ar: "الآلة منقرضة كأداة عمل؛ بقيت فكرتها في الكرات والنماذج التعليمية وفي قطعة أكسفورد العثمانية الوحيدة {cite:king-synchrony-heavens-2004}."
    en: "The instrument is extinct as a working tool; its idea survives in teaching globes and orreries and in the single Oxford Ottoman specimen {cite:king-synchrony-heavens-2004}."
    ur: "عملی آلہ کے طور پر منقرض؛ خیال تعلیمی گولوں اور آکسفورڈ کے واحد عثمانی نمونے میں باقی ہے {cite:king-synchrony-heavens-2004}۔"
  descendants:
    ar: "نماذج الكرة السماوية التعليمية والساعات الفلكية الكروية تفي بالغرض نفسه بلا معدن منقوش {cite:encyclopaedia-of-islam-2}."
    en: "Teaching celestial globes and spherical astronomical clocks do the same job without engraved metal {cite:encyclopaedia-of-islam-2}."
    ur: "تعلیمی آسمانی گولے اور کروی فلکی گھڑیاں وہی کام بغیر نقش شدہ دھات کے کرتے ہیں {cite:encyclopaedia-of-islam-2}۔"
media: { image: media/louvre-celestial-globe-1144, diagram: media/diagram-spherical-astrolabe }
kids:
  ar: "تخيل كرة معدنية تدور فوقها شبكة مفرّغة تُريك النجوم كما تراها من مدينتك — هذه فكرة الأسطرلاب الكروي. كتب عنها العلماء في بغداد قبل ألف سنة، وبقيت منها قطعة واحدة في متحف بأكسفورد."
  en: "Imagine a metal globe with a pierced web spinning over it that shows the stars as your city sees them — that is the spherical astrolabe. Scholars in Baghdad wrote about it a thousand years ago, and only one example survives, in an Oxford museum."
  ur: "سوچو: ایک دھاتی گولہ جس پر جھلی دار جال گھومتا ہو اور تمہارے شہر کے ستارے دکھائے — یہی کروی اسطرلاب ہے۔ بغداد کے علما نے ہزار سال پہلے اس پر لکھا، اور آج اس کا صرف ایک نمونہ آکسفورڈ کے عجائب گھر میں ہے۔"
sources: [source/encyclopaedia-of-islam-2, source/king-synchrony-heavens-2004]
