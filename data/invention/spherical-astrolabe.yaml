    note: "EI2 names his treatise the first main step in the instrument's development before Alphonse X; a Syriac-Christian translator, not the proven inventor."
    sources: [source/encyclopaedia-of-islam-2]
  - person: person/al-nayrizi
    role: describer
    note: "Second named step in EI2's development list; a treatise on the spherical astrolabe is attributed to him."
    sources: [source/encyclopaedia-of-islam-2]
  - person: person/abu-ali-al-hasan-al-marrakushi
    role: describer
    note: "The last step before Alphonse X in EI2's list; his Jami' al-mabadi' wa'l-ghayat describes a variant with a safiha strip and gnomon in place of the alidade."
    sources: [source/encyclopaedia-of-islam-2]

attribution:
  status: contested
  claim:
    ar: "الموثق إسلامياً: سلسلة مؤلفات عربية من قسطا إلى المراكشي طورت الآلة ووصفتها وصفاً هندسياً كاملاً؛ أصل الفكرة — من الساعة الشمسية النصف كروية أو من الكرة المسلحة — متنازع عليه، ولا يُدَّعى اختراع القطعة الأولى."
    en: "Documented Islamic development: an unbroken Arabic treatise chain from Qusta to al-Marrakushi developed the instrument and described it geometrically; the idea's root — in the hemispherical sundial or the armillary sphere — is debated, and no first making is claimed."
    ur: "موثق اسلامی ترقی: قسطا سے المراکشی تک عربی رسالوں کا مسلسل سلسلہ آلہ کو ترقی دے کر ہندسی بیان فراہم کرتا ہے؛ خیال کی جڑ — نصف کروی آفتاب گھڑی یا مسلحہ کرہ — متنازع ہے، اور پہلی تعمیر کا دعویٰ نہیں۔"
  basis:
    ar: "EI2 يثبت سلسلة المؤلفين ⁦(قسطا، النيريزي، البيروني، المراكشي)⁩ ويصف أجزاء الآلة الألفونسية، ويصحح نسبة الفهرست لأول صنعة إلى بطليموس بأنها خلط مع أسطرلاب المجستي الخامس {cite:encyclopaedia-of-islam-2 vol. I pp. 726-728 ASTURLAB (III)}."
    en: "EI2 establishes the author chain (Qusta, al-Nayrizi, al-Biruni, al-Marrakushi) and describes the Alphonsine instrument's parts, while correcting the Fihrist's naming of Ptolemy as first maker — a confusion with the armillary instrument of Almagest V.1 {cite:encyclopaedia-of-islam-2 vol. I pp. 726-728 ASTURLAB (III)}."
    ur: "EI2 مصنفوں کی لڑی ⁦(قسطا، النیریزی، البیرونی، المراکشی)⁩ ثابت کرتی اور الفونسینی آلہ کے اجزا بیان کرتی ہے، ساتھ ہی فہرست کی بطلمیس کو پہلا سازگار کہنے کی تصحیح — المجسطی پانچویں باب کے آلہ سے خلط — کرتی ہے {cite:encyclopaedia-of-islam-2 vol. I pp. 726-728 ASTURLAB (III)}۔"
  perspectives:
    - tradition: sunni
      stance: { ar: "صناعة في كتب التراث", en: "A craft in the inherited books", ur: "میراثی کتابوں کی صنعت" }
      summary: { ar: "صناعة في كتب التراث — كتب الهيئة العربية تضع الآلة في سلسلة تأليف من قسطا بن لوقا إلى المراكشي، والفهرست نفسه ينسبها لبطليموس؛ فالتقليد العلمي عربياً يقرّ بأقدمية معلّقة على الرواية.", en: "The Arabic astronomical books place the instrument in an authoring chain from Qusta ibn Luqa to al-Marrakushi, while the Fihrist itself ascribes first making to Ptolemy; the Islamic book tradition records antiquity as a transmitted claim.", ur: "صناعة في كتب التراث — عربی فلکی کتب آلہ کو قسطا بن لوقا سے المراکشی تک تالیف کی لڑی میں رکھتی ہیں اور فہرست خود اسے بطلمیس سے منسوب کرتی ہے؛ علمی روایت قدامت کو منقولہ دعوے کے طور پر مانتی ہے۔" }
      sources: [source/encyclopaedia-of-islam-2]
    - tradition: academic
      stance: { ar: "أصل محتمل من الساعة النصف كروية", en: "A possible root in the hemispherical sundial", ur: "نصف کروی آفتاب گھڑی میں ممکنہ جڑ" }
      summary: { ar: "أصل محتمل من الساعة النصف كروية — Tannery ⁦(عبر EI2)⁩ يشتق فكرة الآلة من سكافه/أراخنه اليونانية، ولا قطعة أثرية إسلامية مبكرة باقية تثبت الأولوية؛ القطعة العثمانية المؤرخة 885/1480 بمتحف أكسفورد هي الشاهد الوحيد المتأخر {cite:king-synchrony-heavens-2004 bibliography, King, Physis 4 (1962)}.", en: "Tannery (via EI2) derives the idea from the Greek scaphe/arachne sundial, and no early Islamic specimen survives to prove priority; the single dated witness is the Ottoman example of 885/1480-81 at Oxford's Museum of the History of Science {cite:king-synchrony-heavens-2004 bibliography, King, Physis 4 (1962)}.", ur: "نصف کروی آفتاب گھڑی میں ممکنہ جڑ — Tannery ⁦(EI2 کے حوالے سے)⁩ خیال کو یونانی scaphe/arachne سے ماخوذ ٹھہراتا ہے اور کوئی ابتدائی اسلامی نمونہ اولیت ثابت نہیں کرتا؛ واحد مورخ شاہد آکسفورڈ کے عجائب گھر کا 885/1480-81ء عثمانی نمونہ ہے {cite:king-synchrony-heavens-2004 bibliography, King, Physis 4 (1962)}۔" }
      sources: [source/encyclopaedia-of-islam-2, source/king-synchrony-heavens-2004]
precursors:
  - external: { ar: "الساعة الشمسية النصف كروية والكرة المسلحة", en: "The hemispherical sundial and the armillary sphere", ur: "نصف کروی آفتاب گھڑی اور مسلحہ کرہ" }
    note: "Tannery's derivation (cited by EI2) leads the idea back to the Greek scaphe — a bowl sundial called arachne by Eudoxus; the Fihrist's Ptolemy attribution is a confusion with the armillary instrument of Almagest V.1."
    sources: [source/encyclopaedia-of-islam-2]
  - external: { ar: "الكرة السماوية وآلة البتاني", en: "The celestial globe and al-Battani's instrument", ur: "آسمانی کرہ اور البتانی کا آلہ" }
    note: "EI2 distinguishes the spherical astrolabe from al-Battani's globe-plus-armillary combination, which lacks the essential 'spider' of the astrolabe."
    sources: [source/encyclopaedia-of-islam-2]
dependents:
  - external: { ar: "أسطرلاب ألفونسو العاشر الكروي", en: "The Alphonsine spherical astrolabe", ur: "الفونسو دہم کا کروی اسطرلاب" }
    note: "The Libros del Saber instrument compiled by Isaac ibn Sid carries the Islamic design into Castilian Latin-language science, adding a shadow quadrant and calendar."
    sources: [source/encyclopaedia-of-islam-2]
  - external: { ar: "القطعة العثمانية المؤرخة 885/1480-81", en: "The Ottoman specimen of 1480-81", ur: "885/1480-81ء کا عثمانی نمونہ" }
    note: "The single surviving spherical astrolabe, in the Museum of the History of Science, Oxford — King's study of it (Physis 4, 1962) is listed in his Synchrony bibliography; EI2's article predates the consensus on this specimen."
    sources: [source/king-synchrony-heavens-2004]
spread: []
impact:
  fields: [astronomy-instruments, timekeeping]
  changed:
    ar: "قدمت آلة تصور الكرتين بلا إسقاط — تنبأ بالنماذج الكروية التعليمية التي تشرح الحركة اليومية مباشرة — وإن بقيت أقل يدوية من المسطح فلم تنتشر عملياً {cite:encyclopaedia-of-islam-2}."
    en: "It offered a projection-free model of the two spheres — anticipating the teaching globes that show diurnal motion directly — though it stayed less handy than the planispheric instrument and never spread widely {cite:encyclopaedia-of-islam-2}."
    ur: "بغیر اسقاط دونوں گولوں کا نمونہ دیا — تعلیمی گولوں کی پیش بندی جو روزانہ حرکت براہ راست دکھاتے ہیں — مگر مسطح آلہ سے کم آسان رہا اور وسیع نہیں ہوا {cite:encyclopaedia-of-islam-2}۔"
  history:
    ar: "شاهد على نضج الهندسة الكروية الإسلامية: الآلة الأصعب صنعاً والأقل انتشاراً تُوثّق قدرة الصنعة على تخيل الكرة كلها في المعدن {cite:encyclopaedia-of-islam-2}."
    en: "A witness to the maturity of Islamic spherical geometry: the harder, rarer instrument documents the craft's ability to imagine the whole sphere in metal {cite:encyclopaedia-of-islam-2}."
    ur: "اسلامی کروی ہندسے کی پختگی کا شاہد: مشکل اور نایاب آلہ دکھاتا ہے کہ صنعت ساری کرہ کو دھات میں تصور کر سکتی تھی {cite:encyclopaedia-of-islam-2}۔"
  significance: 3
  why: "A documented line of Arabic treatises developing a projection-free astronomical instrument, with honestly debated antique roots and a single surviving Ottoman specimen."
