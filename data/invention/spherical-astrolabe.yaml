    status: historical
    note: "Approximate. EI2 marks 'the main steps in the development of the spherical astrolabe before Alphonse X' beginning with the treatise of Qusta ibn Luqa, died about 300/912; the date is the earliest named author, not a dated surviving instrument."
    sources: [source/encyclopaedia-of-islam-2]
