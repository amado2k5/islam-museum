origin:
  polity: polity/abbasid-caliphate
  context:
    ar: "بيئة علم الهيئة العباسية في القرن الثالث/التاسع وما بعده؛ عالج الترجمان قسطا بن لوقا ثم النيريزي والبيروني الآلة في مؤلفات، واستكملها أبو علي الحسن المراكشي في القرن السابع/الثالث عشر {cite:encyclopaedia-of-islam-2 vol. I pp. 726-728 ASTURLAB (III)}."
    en: "The Abbasid science of the third/ninth century and after: the translator Qusta ibn Luqa, then al-Nayrizi and al-Biruni treated the instrument in treatises, and Abu Ali al-Hasan al-Marrakushi completed the line in the seventh/thirteenth century {cite:encyclopaedia-of-islam-2 vol. I pp. 726-728 ASTURLAB (III)}."
    ur: "تیسری/نویں صدی کے عباسی علمِ ہیئت کا ماحول: مترجم قسطا بن لوقا، پھر النیریزی اور البیرونی نے آلہ پر رسالے لکھے اور ابو علی الحسن المراکشی نے ساتویں/تیرہویں صدی میں سلسلہ مکمل کیا {cite:encyclopaedia-of-islam-2 vol. I pp. 726-728 ASTURLAB (III)}۔"
makers:
