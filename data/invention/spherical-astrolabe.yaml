id: invention/spherical-astrolabe
class: invention
label:
  ar: "الأسطرلاب الكروي في التقليد الفلكي الإسلامي"
  en: "The spherical astrolabe in the Islamic astronomical tradition"
  ur: "اسلامی فلکی روایت کا کروی اسطرلاب"
  es: "El astrolabio esférico en la tradición astronómica islámica."
  fr: "L'astrolabe sphérique dans la tradition astronomique islamique"
names:
  - { value: "الأسطرلاب الكري", kind: alternate, lang: ar }
  - { value: "الأسطرلاب المكري", kind: alternate, lang: ar }
  - { value: "al-asturlab al-kuri", kind: alternate, lang: en }
  - { value: "spherical astrolabe", kind: alternate, lang: en }
summary:
  ar: "آلة تعرض الكرة الأرضية والكرة السماوية بلا إسقاط؛ تطورت في مؤلفات قسطا بن لوقا ⁦(ت نحو 300/912)⁩ والنيريزي ⁦(ت نحو 310/922)⁩ والبيروني ثم المراكشي ⁦(ت نحو 660/1262)⁩، ووصفها كتب ألفونسو العاشر؛ وبقيت أقل استعمالاً من الأسطرلاب المسطح {cite:encyclopaedia-of-islam-2 vol. I pp. 726-728 ASTURLAB (III)}."
  en: "An instrument that displays the terrestrial and celestial spheres without projection, developed through treatises by Qusta ibn Luqa (d. c. 912), al-Nayrizi (d. c. 922), al-Biruni and al-Marrakushi (d. c. 1262) and described in the Alphonsine Libros del Saber; it stayed rarer than the planispheric astrolabe {cite:encyclopaedia-of-islam-2 vol. I pp. 726-728 ASTURLAB (III)}."
  ur: "ایک آلہ جو زمینی اور آسمانی گولوں کو بغیر اسقاط دکھاتا ہے؛ قسطا بن لوقا ⁦(وفات تقریباً 912ء)⁩، النیریزی ⁦(وفات تقریباً 922ء)⁩، البیرونی اور المراکشی ⁦(وفات تقریباً 1262ء)⁩ کی رسالوں سے ترقی پائی اور الفونسو دہم کے Libros del Saber میں بیان ہوئی؛ مسطح اسطرلاب سے کم رائج رہی {cite:encyclopaedia-of-islam-2 vol. I pp. 726-728 ASTURLAB (III)}۔"
  es: "Un instrumento que muestra las esferas terrestre y celeste sin proyección, desarrollado a través de tratados de Qusta ibn Luqa (dc 912), al-Nayrizi (dc 922), al-Biruni y al-Marrakushi (dc 1262) y descrito en los Libros del Saber alfonsinos; permaneció más raro que el astrolabio planisférico {cite:encyclopaedia-of-islam-2 vol. I pp. 726-728 ASTURLAB (III)}."
  fr: "Un instrument qui affiche les sphères terrestre et céleste sans projection, développé à travers des traités de Qusta ibn Luqa (mort en 912), al-Nayrizi (mort en 922), al-Biruni et al-Marrakushi (mort en 1262) et décrit dans les Libros del Saber alphonsines; il est resté plus rare que l'astrolabe planisphérique {cite:encyclopaedia-of-islam-2 vol. I pp. 726-728 ASTURLAB (III)}."
