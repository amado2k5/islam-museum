summary:
  ar: "تفسير رياضي لدرجات صفات الدواء الموروثة عن جالينوس: تقابل الزيادة المنتظمة في الدرجة زيادة هندسية في نسبة الصفتين المتقابلتين، ثم يبحث الكندي حساب الدواء المركب {cite:kindi-drug-degrees-prioreschi-2002 p. 18}. نموذج تاريخي، لا وصفة علاج أو إثبات لفعالية الأدوية."
  en: "A mathematical interpretation of inherited Galenic drug qualities: equal steps in degree correspond to a geometric increase in the ratio of opposing qualities, leading to a compound-drug calculation {cite:kindi-drug-degrees-prioreschi-2002 p. 18}. A historical model, not treatment advice or proof of efficacy."
  ur: "جالینوسی دوائی کی صفات کی ریاضیاتی تعبیر: درجے کی یکساں بڑھوتری کے مقابل متضاد صفات کی نسبت ہندسی طور پر بڑھتی ہے، پھر مرکب دوا کا حساب آتا ہے {cite:kindi-drug-degrees-prioreschi-2002 p. 18}۔ تاریخی نمونہ، علاج یا تاثیر کا ثبوت نہیں۔"
