kids:
  ar: "تخيل سلماً للأرقام: رقم الدرجة يزيد خطوة واحدة، لكن عدد القطع في النموذج يتضاعف. حاول الكندي بهذا الفرق أن يجعل وصف قوة الدواء سؤالاً حسابياً. نفهم الفكرة بقطع ورقية ملونة، لا بخلط أدوية؛ النموذج القديم ليس نصيحة للعلاج."
  en: "Imagine a number ladder: the degree rises one step while the number of pieces in the model doubles. Al-Kindi used this distinction to turn a description of drug strength into a mathematical question. Think with coloured paper counters, not mixed medicines: an old model is not treatment advice."
  ur: "اعداد کی سیڑھی سوچیں: درجہ ایک قدم بڑھتا ہے مگر نمونے کے ٹکڑے دوگنے ہوتے ہیں۔ کندی نے اس فرق سے دوا کی قوت کو حسابی سوال بنایا۔ رنگین کاغذ کے ٹکڑوں سے خیال سمجھیں، دوائیں نہ ملائیں؛ پرانا نمونہ علاج کا مشورہ نہیں۔"
