label:
  ar: "صناعة السكر وتصفيته في العالم الإسلامي الوسيط"
  en: "The medieval Islamic sugar industry: cane cultivation and refining"
  ur: "قرون وسطی کی اسلامی شکر صنعت: گنے کی کاشت اور تصفیہ"
  es: "La industria azucarera islámica medieval: cultivo y refinación de la caña de azúcar."
  fr: "L'industrie sucrière islamique médiévale: culture et raffinage de la canne à sucre"
