  - external: { ar: "صناعة السكر الصليبية والأوروبية", en: "Crusader and European sugar production", ur: "صلیبی اور یورپی چینی صنعت" }
    note: "From Crusader times the eastern Mediterranean coast and Cyprus supplied Christian Europe; Tyrian plantations, the Cornaro estates at Colossi and Rhodes and Crete followed the model westward."
