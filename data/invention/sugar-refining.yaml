      summary: { ar: "نقل إسلامي منظم — The conquest state carried the crop and its refining through every climatic zone that could hold it, until it reached the Muslim west and Sicily.", en: "The conquest state carried the crop and its refining through every climatic zone that could hold it, until it reached the Muslim west and Sicily.", ur: "منظم اسلامی انتقال — The conquest state carried the crop and its refining through every climatic zone that could hold it, until it reached the Muslim west and Sicily." }
      sources: [source/encyclopaedia-of-islam-2]
    - tradition: academic
      stance: { ar: "الأصل الهندي والفارسي", en: "Indian and Persian roots", ur: "ہندوستانی اور فارسی جڑیں" }
      summary: { ar: "الأصل الهندي والفارسي — Bengal is named the homeland of cultivated cane; Jundishapur's physicians knew it before Islam — the Muslim role was diffusion and industry, not first cultivation.", en: "Bengal is named the homeland of cultivated cane; Jundishapur's physicians knew it before Islam — the Muslim role was diffusion and industry, not first cultivation.", ur: "ہندوستانی اور فارسی جڑیں — Bengal is named the homeland of cultivated cane; Jundishapur's physicians knew it before Islam — the Muslim role was diffusion and industry, not first cultivation." }
