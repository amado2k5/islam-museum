    place: place/baghdad
    note: "The geographer whose Muruj al-Dhahab documents the sugar districts and trade of the Islamic world in his era; the industry itself was a distributed craft."
    sources: [source/encyclopaedia-of-islam-2]

attribution:
  status: transmission
  claim:
    ar: "الدور الموثق للعالم الإسلامي: نقل الزراعة والصناعة غرباً، وطوّر التصفية والتبلور في القوالب فأنتج أنواعاً مسمّاة من السكر؛ ولا يُدَّعى اختراع القصب الذي وصله من الهند عبر فارس."
    en: "The Islamic world's documented role: it carried cultivation and manufacture westward and developed refining and mould-crystallisation into a family of named sugars; no invention of cane is claimed — the plant came through Persia from India."
    ur: "عالمِ اسلام کا موثق کردار: کاشت اور صنعت مغرب تک پہنچائی اور تصفیہ و سانچہ تبلور کو ترقی دی، نام زدہ چینیوں کا خاندان بنا؛ گنے کی ایجاد کا دعویٰ نہیں — پودا ہند سے فارس کے راستے آیا۔"
  basis:
    ar: "EI2 SUKKAR وKASAB AL-SUKKAR: الزراعة دخلت فارس من الهند قبل الإسلام أو مع الفتح، ووصلت مصر في منتصف القرن الثاني/الثامن بشهادة البردي، ومنها إلى شمال أفريقيا ثم الأندلس ⁦(ربما القرن الخامس/الحادي عشر)⁩؛ وأنواع التصفية موثقة في كتب الأطباء والمطابخ {cite:encyclopaedia-of-islam-2}."
    en: "EI2 SUKKAR and KASAB AL-SUKKAR: cultivation reached Persia from India before Islam or with the conquest, reached Egypt by the mid-2nd/8th century on papyrus evidence, then North Africa and Iberia (perhaps the 5th/11th century); the refining grades are documented in medical and culinary books {cite:encyclopaedia-of-islam-2}."
    ur: "EI2 SUKKAR اور KASAB AL-SUKKAR: کاشت ہند سے فارس پہنچی، مصر آٹھویں صدی کے وسط تک، پھر شمالی افریقہ اور جزیرہ؛ اقسام کی تصفیہ طبی اور خانہ پزی کتابوں میں موثق ہے {cite:encyclopaedia-of-islam-2}۔"
  perspectives:
