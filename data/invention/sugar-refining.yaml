kids:
  ar: "قبل ألف سنة زرع المسلمون نباتاً اسمه قصب السكر في أراضٍ كثيرة من فارس إلى مصر وصقلية، وصنعوا من عصيره أنواعاً من السكر أسماؤها ما زالت معروفة. بهذه الطريقة وصل السكر إلى أوروبا."
  en: "A thousand years ago Muslim farmers grew a plant called sugar cane in many lands from Persia to Egypt and Sicily, and they made kinds of sugar from its juice whose names are still known. That is how sugar reached Europe."
  ur: "ہزار سال پہلے مسلمان کسانوں نے فارس سے مصر اور صقلیہ تک گنے کی کاشت کی اور اس کے رس سے اقسام کی چنیاں بنائیں جن کے نام آج بھی معلوم ہیں۔ اسی طرح چینی یورپ پہنچی۔"
