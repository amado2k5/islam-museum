    note: "Approximate. EI2 records that after the conquest of Persia cane cultivation was developed 'fairly rapidly' wherever the climate allowed, that papyrus attests cane in Egypt by the mid-2nd/8th century, and that Jundishapur's physicians knew the plant before Islam; the date marks early Islamic cultivation, and refining is documented as a developed industry by the 4th/10th-century geographers."
