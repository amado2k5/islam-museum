  - external: { ar: "سكر العالم الجديد", en: "New World sugar", ur: "نویں دنیا کی چینی" }
    note: "The industry's later Atlantic career — the standard histories record its passage through Sicily, Iberia and the islands to the Americas; a long chain documented in the standard literature."
