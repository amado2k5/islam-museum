origin:
  place: place/khuzistan
  polity: polity/umayyad-caliphate
  context:
    ar: "أراضي خوزستان الرطبة ومصبّ دجلة، حيث وجد القصب مناخه؛ ومنها امتدت الزراعة إلى البصرة وفارس ومكران وكرمان وبلخ وسند وعمان، ثم غرباً إلى مصر والشام والمغرب {cite:encyclopaedia-of-islam-2 vol. IV pp. 719-721 KASAB AL-SUKKAR}."
    en: "The swampy lowlands of Khuzistan and the lower Tigris, where the cane found its climate; from there cultivation spread to Basra, Fars, Makran, Kirman, Balkh, Sind and Oman, then west into Egypt, Syria and the Maghrib {cite:encyclopaedia-of-islam-2 vol. IV pp. 719-721 KASAB AL-SUKKAR}."
    ur: "خوزستان کی دلدلی زمینیں اور دجلہ کے نچلے کنارے، جہاں گنے کو موسم ملا؛ وہاں سے کاشت بصرہ، فارس، مکران، کرمان، بلخ، سند اور عمان تک اور پھر مصر، شام اور مغرب تک پھیلی {cite:encyclopaedia-of-islam-2 vol. IV pp. 719-721 KASAB AL-SUKKAR}۔"
