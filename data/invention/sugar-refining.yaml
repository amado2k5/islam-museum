summary:
  ar: "نقل المسلمون زراعة قصب السكر ⁦(قصب السكر)⁩ وصناعته من فارس إلى خوزستان والبصرة ومصر وفلسطين والمغرب وصقلية؛ فأنتجت مصانعها أنواع السكر المعروفة ⁦(الطبرزد والنباط والفانيد والسليماني)⁩ بالعصر والتصفية والتقطير والتبلور في القوالب {cite:encyclopaedia-of-islam-2 vol. IX pp. 829-830 SUKKAR; vol. IV pp. 719-721 KASAB AL-SUKKAR}."
  en: "Muslim growers carried sugar-cane cultivation and manufacture from Persia into Khuzistan, Basra, Egypt, Palestine, the Maghrib and Sicily; the industry's presses, decoction and moulds produced the named sugars — tabarzad loaf, nabat on sticks, fanid and the twice-cooked sulaymani {cite:encyclopaedia-of-islam-2 vol. IX pp. 829-830 SUKKAR; vol. IV pp. 719-721 KASAB AL-SUKKAR}."
  ur: "مسلمان کاشتکاروں نے گنے کی کاشت اور صنعت فارس سے خوزستان، بصرہ، مصر، فلسطین، مغرب اور صقلیہ تک پہنچائی؛ اس صنعت کے کولہو، پکاؤ اور سانچوں سے مشہور قسم کی چنیاں بنیں — طبرزد روٹی، نبات لاٹھی پر، فانید اور دو بار پکی سلیمانی {cite:encyclopaedia-of-islam-2 vol. IX pp. 829-830 SUKKAR; vol. IV pp. 719-721 KASAB AL-SUKKAR}۔"
  es: "Los agricultores musulmanes llevaron el cultivo y la fabricación de caña de azúcar desde Persia a Juzestán, Basora, Egipto, Palestina, el Magreb y Sicilia; las prensas, la decocción y los moldes de la industria producían los azúcares con nombre: pan de tabarzad, nabat en palitos, fanid y el sulaymani cocido dos veces {cite:encyclopaedia-of-islam-2 vol. IX pp. 829-830 SUKKAR; vol. IV pp. 719-721 KASAB AL-SUKKAR}."
  fr: "Les cultivateurs musulmans ont introduit la culture et la fabrication de la canne à sucre de Perse au Khuzistan, à Bassora, en Égypte, en Palestine, au Maghreb et en Sicile; les presses, les décoctions et les moules de l'industrie produisaient les sucres nommés — le pain tabarzad, le nabat sur bâtonnets, le fanid et le sulaymani cuit deux fois {cite:encyclopaedia-of-islam-2 vol. IX pp. 829-830 SUKKAR; vol. IV pp. 719-721 KASAB AL-SUKKAR}."
