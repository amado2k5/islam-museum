spread: []
impact:
  fields: [food-drink, water-agriculture]
  changed:
    ar: "جعلت السكر سلعة صناعية ومحصولاً رئيسياً حيثما وجد ماءً وحرارةً، وغيّرت المطبخ والطب بأنواع مكررة موثقة {cite:encyclopaedia-of-islam-2}."
    en: "It made sugar an industrial commodity and a principal crop wherever water and heat allowed, and changed cookery and medicine with documented refined grades {cite:encyclopaedia-of-islam-2}."
    ur: "اس نے چینی کو صنعتی جنس اور اہم فصل بنا دیا جہاں پانی اور گرمی ملی، اور موثق درجوں سے باورچی خانہ اور طب بدل دی {cite:encyclopaedia-of-islam-2}۔"
  history:
    ar: "من أعظم نقل المحاصيل في التاريخ الإسلامي؛ حملت صناعةً كاملة — زراعة وعصراً وتقطيراً وتبلوراً — عبر ثلاث قارات {cite:encyclopaedia-of-islam-2}."
    en: "One of the great crop transfers of Islamic history; it carried a whole industry — cultivation, pressing, decoction and crystallisation — across three continents {cite:encyclopaedia-of-islam-2}."
    ur: "اسلامی تاریخ کی عظیم فصلی منتقلیوں میں سے؛ پوری صنعت — کاشت، کولہو، پکاؤ اور تبلور — تین براعظموں میں پہنچائی {cite:encyclopaedia-of-islam-2}۔"
  significance: 4
  why: "A documented agro-industrial transmission: cane and refining carried from Persia to the Atlantic edge of the Islamic world, producing the named grades that fed kitchens and pharmacies."
