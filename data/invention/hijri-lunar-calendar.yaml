summary:
  ar: تقويم قمري من اثني عشر شهراً بلا كبس لكنه يحدد الأشهر بالهلال المرئي ويبدأ تاريخه من هجرة النبي ⁦(١ هـ، نحو ٦٢٢ م)⁩؛
    يعتمد على كتب حديثية وقانونية ومراجع تقويمية {cite:tdv-takvim-akgur sections} {cite:britannica-islamic-calendar} {cite:iranica-calendars-abdollahy
    hijri section}.
  en: A twelve-month lunar calendar with no intercalation whose months are fixed by the observed crescent and whose era begins
    at the Prophet's migration (1 AH, about 622 CE); it rests on hadith, legal and calendrical sources {cite:tdv-takvim-akgur
    sections} {cite:britannica-islamic-calendar} {cite:iranica-calendars-abdollahy hijri section}.
  ur: بارہ ماہ کا قمری کیلنڈر جس میں کوئی اضافه ماہ نہیں، مہینے رؤیت ہلال سے طے ہوتے ہیں اور اس کا عہد ہجرتِ نبوی ⁦(1ھ، تقریباً
    622ء)⁩ سے ہے؛ روایتی، قانونی اور تقویمی ماخذوں پر مبنی {cite:tdv-takvim-akgur sections} {cite:britannica-islamic-calendar}
    {cite:iranica-calendars-abdollahy hijri section}۔
  es: "Un calendario lunar de doce meses sin intercalación cuyos meses están fijados por la media luna observada y cuya era comienza en la migración del Profeta (1 AH, alrededor del 622 d. C.); se basa en hadices, fuentes legales y calendáricas {cite:tdv-takvim-akgur sections} {cite:britannica-islamic-calendar} {cite:iranica-calendars-abdollahy hijri section}."
  fr: "Un calendrier lunaire de douze mois sans intercalation, dont les mois sont fixés par le croissant observé et dont l'ère commence à la migration du Prophète (1 AH, vers 622 CE); il repose sur des sources hadithiques, juridiques et calendaires {cite:tdv-takvim-akgur sections} {cite:britannica-islamic-calendar} {cite:iranica-calendars-abdollahy hijri section}."
