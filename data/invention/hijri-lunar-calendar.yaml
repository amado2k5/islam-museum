origin:
  polity: polity/rashidun-caliphate
  context:
    ar: سياق المدينة في عهد الخلفاء الراشدين، حيث أُلغي نسئ الجاهلية وحُدّد تاريخ التقويم بالهجرة النبوية؛ النصوص المقرؤة
      تصف القرار ولا تقدم وثيقة تشريع بتاريخ محدد {cite:tdv-takvim-akgur sections} {cite:iranica-calendars-abdollahy hijri
      section}.
    en: The Medina context of the Rightly Guided caliphs, where pre-Islamic intercalation was abolished and the era anchored
      to the Prophet's migration; the sources read describe the decision without giving a single dated enactment document
      {cite:tdv-takvim-akgur sections} {cite:iranica-calendars-abdollahy hijri section}.
    ur: راشدین کے دورِ حکومت میں مدینہ کا سیاق، جہاں جاهلیت کا نسئ ختم ہوا اور عہد هجرت سے طے ہوا؛ پڑھے ماخذ فیصلہ بیان کرتے
      ہیں مگر ایک تاریخ دار دستاویز نہیں دیتے {cite:tdv-takvim-akgur sections} {cite:iranica-calendars-abdollahy hijri section}۔
makers:
- person: person/umar-ibn-al-khattab
  role: commissioner
  note: Hadith and calendar literature credit Umar with consulting the Companions and fixing the era from the Hijra; this
    is a documented institutional act, not a modern calendrical formula.
  sources:
  - source/tdv-takvim-akgur
  - source/iranica-calendars-abdollahy
attribution:
  status: improvement
  claim:
    ar: التقويم القمري من اثني عشر شهراً موجود قبل الإسلام؛ المساهمة الإسلامية الموثقة إلغاء النسئ والربط بالعهد الهجري وتثبيت
      أسماء الأشهر.
    en: The twelve-month lunar year existed before Islam; the documented Muslim contribution is abolishing intercalation,
      anchoring the era to the Hijra and fixing month names.
    ur: بارہ ماہوں کا قمری سال اسلام سے پہلے موجود تھا؛ مستند مسلم حصہ نسئ کا خاتمہ، عہد ہجری سے ربط اور مہینوں کے ناموں کا
      تثبیت ہے۔
  basis:
    ar: مصادر التقويم والمدونات الحديثية تصف نسئ الجاهلية وقرار إلغائه في عهد عمر، مع بقاء الشهور القمرية؛ لا ننسب للصحابة
      صيغة حسابية حديثة لم تُروَ {cite:tdv-takvim-akgur sections} {cite:iranica-calendars-abdollahy hijri section}.
    en: Calendar and hadith sources describe pre-Islamic intercalation and its abolition under Umar, while the lunar months
      remain; we do not credit the Companions with a modern computation they did not transmit.
    ur: تقویم اور حدیثی ماخذ جاهلیت کے نسئ اور عمر کے دور میں اسے ختم ہونے کا بیان کرتے ہیں، قمری مہینے باقی رہے؛ ہم صحابہ
      سے جدید حسابی صيغة منسوب نہیں کرتے جو انہوں نے منتقل نہیں کی۔
precursors:
- external:
