impact:
  fields:
  - timekeeping
  - institutions-systems
  changed:
    ar: ربط السنن والأشهر والأعياد والمواعيد الشرعية بشهور قمرية تُثبت بالرؤية، فأصبح الوقت الاجتماعي والديني للمسلمين محسوباً
      به {cite:tdv-takvim-akgur sections} {cite:iranica-calendars-abdollahy hijri section}.
    en: It tied fasts, festivals, contracts and religious dates to lunar months fixed by sighting, making it the social and
      religious clock of Muslim communities.
    ur: اس نے روزوں، تہواروں، معاہدوں اور شرعی اوقات کو رؤیت سے طے ہونے والے قمری مہینوں سے جوڑ دیا، جو مسلم برادریوں کا سماجی
      اور مذہبی گھڑی بن گیا۔
  history:
    ar: ألغى النسئ فجعله التقويم الميلادي الوحيد الذي لا يتغير عن الفصول، ونقل أمماً كاملة إلى توقيت قمري؛ استخدامه اليوم
      في كبريات الدول الإسلامية لا يثبت صيغة واحدة منذ البداية {cite:tdv-takvim-akgur sections} {cite:iranica-calendars-abdollahy
      hijri section}.
    en: By abolishing intercalation it became the only major calendar that does not drift with the seasons, moving whole peoples
      onto lunar time; its modern use does not prove a single formula from the start.
    ur: نسئ ختم کر کے یہ واحد بڑا کیلنڈر بنا جو موسموں کے ساتھ نہیں بدلتا، اور پوری اقوام قمری وقت پر منتقل ہوئیں؛ آج کا استعمال
      اس کا ایک ہی ابتدائی فارمولہ ثابت نہیں کرتا۔
  significance: 5
  why: The calendar structures worship, law and social time for more than a billion Muslims today; the evidence documents
    its institutional fixing and enduring use, not a modern computation.
