    ur: بارہ ماہوں کا قمری سال جس میں نسئ حرموں کی مؤخر کرتا تھا
  note: Pre-Islamic Hijazi calendar; the Qur'an condemns nesî and the intercalated calendar was replaced by the purely lunar
