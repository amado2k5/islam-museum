id: invention/fountain-pen-al-muizz
class: invention
label:
  ar: "القلم ذو الخزان المصنوع للمعز لدين الله ⁦(نحو 974م)⁩"
  en: "The reservoir pen made for the Fatimid caliph al-Mu'izz (c. 974)"
  ur: "فاطمی خلیفہ معز لدین اللہ کے لیے بنایا خزان دار قلم ⁦(تقریباً 974ء)⁩"
  es: "Pluma con depósito fabricada para el califa fatimí al-Mu'izz (c. 974)."
  fr: "Le stylo à réservoir réalisé pour le calife fatimide al-Mu'izz (vers 974)"
  tr: "Su haznesi bulunan kalem, Al-Mu'izz li-Din Allah (yaklaşık 974 MS) için yapılmıştır."
  id: "Pulpen dengan wadah air ini dibuat untuk Al-Mu'izz li-Din Allah (sekitar tahun 974 M)."
names:
  - { value: "قلم الحبر", kind: alternate, lang: ar }
  - { value: "القلم المعزي", kind: alternate, lang: ar }
  - { value: "fountain pen", kind: alternate, lang: en }
  - { value: "reservoir pen", kind: alternate, lang: en }
  - { value: "فاؤنٹین پن", kind: alternate, lang: ur }
summary:
  ar: "أقدم قلم بخزان حبر موثق في المصادر: قلم صُنع للخليفة الفاطمي المعز لدين الله ⁦(ت 365/975)⁩ يكتب بلا محبرة خارجية ولا يلوّث اليد والثوب — ترويه كتب التراث عبر القلقشندي في «صبح الأعشى»، ويلاحظ EI2 اختراع نوع من «قلم الحبر» في مصر الفاطمية؛ لا قطعة أثرية باقية {cite:encyclopaedia-of-islam-2 vol. IV pp. 471-472 KALAM; bosworth-mediaeval-fountain-pen-1981}."
  en: "The earliest reservoir pen documented in the sources: a pen made for the Fatimid caliph al-Mu'izz li-Din Allah (d. 975) that writes without a separate inkpot and does not soil hand or clothes — transmitted through al-Qalqashandi's Subh al-A'sha, while EI2 notes the Fatimid-period invention of a kind of 'fountain-pen' in Egypt; no specimen survives {cite:encyclopaedia-of-islam-2 vol. IV pp. 471-472 KALAM; bosworth-mediaeval-fountain-pen-1981}."
  ur: "مآخذ میں موثق پہلا خزان دار قلم: فاطمی خلیفہ معز لدین اللہ ⁦(وفات 975ء)⁩ کے لیے بنایا قلم جو الگ دوات کے بغیر لکھتا اور ہاتھ و کپڑے آلودہ نہیں کرتا — القلقشندی کی «صبح الاعشی» سے منقول، جبکہ EI2 فاطمی مصر میں «فاؤنٹین پن» کی ایجاد کا ذکر کرتی ہے؛ کوئی نمونہ باقی نہیں {cite:encyclopaedia-of-islam-2 vol. IV pp. 471-472 KALAM; bosworth-mediaeval-fountain-pen-1981}۔"
  es: "La pluma de depósito más antigua documentada en las fuentes: una pluma hecha para el califa fatimí al-Mu'izz li-Din Allah (m. 975) que escribe sin tintero separado y no ensucia las manos ni la ropa, transmitida a través del Subh al-A'sha de al-Qalqashandi, mientras que EI2 menciona la invención en el período fatimí de una especie de 'pluma estilográfica' en Egipto; no sobrevive ningún ejemplar {cite:encyclopaedia-of-islam-2 vol. IV pp. 471-472 KALAM; bosworth-mediaeval-fountain-pen-1981}."
  fr: "Le plus ancien stylo à réservoir documenté dans les sources: un stylo fabriqué pour le calife fatimide al-Mu'izz li-Din Allah (mort en 975) qui écrit sans encrier séparé et ne salit ni les mains ni les vêtements — transmis par le Subh al-A'sha d'al-Qalqashandi, tandis que EI2 note l'invention à l'époque fatimide d'une sorte de « stylo-plume » en Égypte; aucun spécimen ne survit {cite:encyclopaedia-of-islam-2 vol. IV pp. 471-472 KALAM; bosworth-mediaeval-fountain-pen-1981}."
  tr: "Kaynaklarda belgelenmiş en eski dolma kalem: Fatımi Halifesi Al-Mu'izz li-Din Allah (ö. 365/975) için yapılmış, harici mürekkep haznesi olmadan yazan ve eli ve giysileri kirletmeyen bir kalemdir. Bu kalem, miras kitaplarında Al-Qalqashandi aracılığıyla \"Subh al-A'sha\"da anlatılmaktadır ve EI2, Fatımi Mısır'ında bir tür \"dolma kalem\"in icadından bahsetmektedir; günümüze ulaşan bir örneği yoktur {cite:encyclopaedia-of-islam-2 vol. IV pp. 471-472 KALAM; bosworth-mediaeval-fountain-pen-1981}."
  id: "Pulpen air mancur tertua yang didokumentasikan dalam sumber-sumber: sebuah pulpen yang dibuat untuk Khalifah Fatimiyah Al-Mu'izz li-Din Allah (wafat 365/975) yang menulis tanpa wadah tinta eksternal dan tidak mengotori tangan dan pakaian — hal ini diriwayatkan dalam kitab-kitab warisan melalui Al-Qalqashandi dalam “Subh al-A'sha”, dan EI2 mencatat penemuan jenis “pulpen air mancur” di Mesir Fatimiyah; tidak ada artefak yang masih ada {cite:encyclopaedia-of-islam-2 vol. IV pp. 471-472 KALAM; bosworth-mediaeval-fountain-pen-1981}."
