today:
  form:
    ar: "القلم ذو الخزان منقرض كوصف لا يعرف صورته؛ وريثه الفكري قلم الحبر الحديث بخراطيشه وخزاناته {cite:bosworth-mediaeval-fountain-pen-1981}."
    en: "The reservoir pen is extinct as a described object whose form is unknown; its intellectual heir is the modern fountain pen with its cartridges and reservoirs {cite:bosworth-mediaeval-fountain-pen-1981}."
    ur: "خزان دار قلم محض بیان شدہ شے کے طور پر معدوم ہے جس کی صورت معلوم نہیں؛ اس کا فکری وارث خرطوشوں اور خزانوں والا جدید فاؤنٹین پن ہے {cite:bosworth-mediaeval-fountain-pen-1981}۔"
  descendants:
    ar: "قلم الحبر بالخرطوشة وقلم السائل؛ وكلها حلول مستقلة للمشكلة نفسها التي طرحها المعز {cite:bosworth-mediaeval-fountain-pen-1981}."
    en: "The cartridge pen and the liquid-ink pen — independent solutions to the same problem al-Mu'izz posed {cite:bosworth-mediaeval-fountain-pen-1981}."
    ur: "خرطوشہ قلم اور سائل سیاہی قلم — معز کے اٹھائے اسی مسئلے کے آزاد حل {cite:bosworth-mediaeval-fountain-pen-1981}۔"
