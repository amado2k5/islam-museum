origin:
  place: place/cairo
  polity: polity/fatimid-caliphate
  context:
    ar: "بلاط المعز الفاطمي ⁦(إفريقية ثم القاهرة بعد 362/973)⁩ حيث طلب الخليفة قلماً يكتب مدة طويلة بلا دواة خارجية — في بيئة كانت القصبة المصريّة والعراقية من أجود أقلامها {cite:bosworth-mediaeval-fountain-pen-1981; encyclopaedia-of-islam-2 vol. IV pp. 471-472 KALAM}."
    en: "The Fatimid court of al-Mu'izz (Ifriqiya, then Cairo after 973) where the caliph asked for a pen that would write for long without an external inkpot — in a world whose best reeds came from the marshes of Iraq and Egypt {cite:bosworth-mediaeval-fountain-pen-1981; encyclopaedia-of-islam-2 vol. IV pp. 471-472 KALAM}."
    ur: "معز کا فاطمی دربار ⁦(افریقیہ، پھر 973ء کے بعد قاہرہ)⁩ جہاں خلیفہ نے ایسا قلم چاہا جو بغیر بیرونی دوات کے دیر تک لکھے — اس دنیا میں جس کے بہترین نیڑے عراق اور مصر کے دلدلوں سے آتے تھے {cite:bosworth-mediaeval-fountain-pen-1981; encyclopaedia-of-islam-2 vol. IV pp. 471-472 KALAM}۔"
