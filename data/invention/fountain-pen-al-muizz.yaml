    sources: [source/bosworth-mediaeval-fountain-pen-1981, source/encyclopaedia-of-islam-2]

attribution:
  status: contested
  claim:
    ar: "الموثق: أول قلم بخزان مذكور في المصادر — لا يُدَّعى بقاؤه أثراً ولا يثبت صنعته إلا رواية متأخرة؛ فالسجل يدّعي أقدمية الرواية لا أقدمية القطعة."
    en: "Documented: the first reservoir pen named in the sources — no surviving specimen, and its making rests on a single later literary report; the record claims priority of the account, not of an extant object."
    ur: "موثق: مآخذ میں مذکور پہلا خزان دار قلم — کوئی باقی نمونہ نہیں اور اس کی تعمیر ایک بعد کی ادبی روایت پر ٹکا ہے؛ یہ ریکارڈ روایت کی اولیت کا دعویٰ کرتا ہے نہ کہ موجودہ شے کی۔"
  basis:
    ar: "EI2 KALAM يذكر اختراع نوع «قلم الحبر» في مصر الفاطمية عرضاً في سياق القصبة؛ وبوسورث يستخرج الرواية من صبح الأعشى للقلقشندي ويدافع عن صحة الفكرة تقنياً، مع بقائها شاهداً أدبياً واحداً {cite:encyclopaedia-of-islam-2 vol. IV pp. 471-472 KALAM; bosworth-mediaeval-fountain-pen-1981}."
    en: "EI2 KALAM notes in passing the Fatimid-period invention of a kind of 'fountain-pen' in Egypt; Bosworth draws the account from al-Qalqashandi's Subh al-A'sha and argues the idea's technical plausibility, while it remains a single literary witness {cite:encyclopaedia-of-islam-2 vol. IV pp. 471-472 KALAM; bosworth-mediaeval-fountain-pen-1981}."
    ur: "EI2 KALAM فاطمی مصر میں ایک قسم کے «فاؤنٹین پن» کی ایجاد عرضاً بیان کرتی ہے؛ بوسورتھ روایت قلقشندی کی صبح الاعشی سے اخذ کر کے خیال کی تکنیکی معقولیت پر استدلال کرتا ہے، مگر یہ ایک ادبی شاہد ہی رہتا ہے {cite:encyclopaedia-of-islam-2 vol. IV pp. 471-472 KALAM; bosworth-mediaeval-fountain-pen-1981}۔"
  perspectives:
    - tradition: sunni
      stance: { ar: "رواية كتب الصنعة", en: "A report of the craft books", ur: "صنعت کی کتابوں کی روایت" }
      summary: { ar: "رواية كتب الصنعة — كتب الإنشاء وصناعة القلم تنقل قصة القلم المعزي ضمن باب المحابر والأقلام؛ يقرأها التقليد في سياق مدح آل الكتابة وتفنن الصنائع {cite:bosworth-mediaeval-fountain-pen-1981}.", en: "The chancery and pen-craft books transmit the al-Mu'izz pen inside the chapter of inks and pens; the tradition reads it among the marvels of the writing craft {cite:bosworth-mediaeval-fountain-pen-1981}.", ur: "رواية كتب الصنعة — انشا اور قلم صنعت کی کتابیں معزی قلم کی کہانی محابر و اقلام کے باب میں نقل کرتی ہیں؛ روایت اسے کتابت کی صنعت کے فن کاروں میں پڑھتی ہے {cite:bosworth-mediaeval-fountain-pen-1981}۔" }
      sources: [source/bosworth-mediaeval-fountain-pen-1981]
    - tradition: academic
      stance: { ar: "شاهد أدبي واحد لا قطعة أثرية", en: "One literary witness, no artefact", ur: "ایک ادبی شاہد، کوئی آثار نہیں" }
      summary: { ar: "شاهد أدبي واحد لا قطعة أثرية — Bosworth يعامل الرواية كأصل ممكن لقلم الحبر ويدافع عن جديتها، لكن لا قطعة إسلامية باقية ولا وصف هندسي ثانٍ؛ القلم الحديث لـ Petrache Poenaru ⁦(1827)⁩ وما بعده خط مستقل {cite:bosworth-mediaeval-fountain-pen-1981}.", en: "Bosworth treats the report as a plausible early prototype and defends its seriousness, but no Islamic specimen survives and no second technical description exists; the modern fountain pen from Poenaru's 1827 patent onward is an independent line {cite:bosworth-mediaeval-fountain-pen-1981}.", ur: "ایک ادبی شاہد اور کوئی آثار نہیں — Bosworth روایت کو ابتدائی نمونہ مانتا اور سنجیدگی کا دفاع کرتا ہے، مگر نہ اسلامی نمونہ باقی ہے نہ دوسرا تکنیکی بیان؛ 1827ء کے Poenaru پیٹنٹ سے جدید فاؤنٹین پن کا الگ سلسلہ ہے {cite:bosworth-mediaeval-fountain-pen-1981}۔" }
      sources: [source/bosworth-mediaeval-fountain-pen-1981]
precursors:
  - external: { ar: "القصبة ⁦(القلم)⁩ والمحبرة والمقلمة", en: "The reed pen (qalam), inkpot and pen-box", ur: "نیڑہ قلم، دوات اور قلمدان" }
    note: "The standard kit EI2 describes: a slit reed cut on a mikatta board, kept with its dawat inkpot inside the miklama or kalamdan holder — the kit the reservoir pen was meant to leave behind."
    sources: [source/encyclopaedia-of-islam-2]
dependents:
  - external: { ar: "قلم الحبر الأوروبي الحديث", en: "The modern European fountain pen", ur: "جدید یورپی فاؤنٹین پن" }
    note: "Petrache Poenaru's 1827 French patent and the nineteenth-century mass pens — a parallel invention, not a documented descendant; the link is the idea, not a chain."
    sources: [source/bosworth-mediaeval-fountain-pen-1981]
spread: []
impact:
  fields: [everyday-life]
  changed:
    ar: "لو صحّت الرواية لكان أول قلم يستغني عن المحبرة — تحرير اليد من حمل الدواة، وهو أثر محدود لكنه فكرة سابقة بثمانية قرون على القلم الحديث {cite:bosworth-mediaeval-fountain-pen-1981}."
    en: "If the account holds, it was the first pen to dispense with the inkpot — freeing the hand from carrying the dawat — a small effect but an idea eight centuries ahead of the modern pen {cite:bosworth-mediaeval-fountain-pen-1981}."
    ur: "اگر روایت درست ہے تو یہ پہلا قلم تھا جس نے دوات سے بے نیازی دی — ہاتھ کو دوات اٹھانے سے آزاد کیا — اثر چھوٹا مگر خیال جدید قلم سے آٹھ صدیاں پہلے کا {cite:bosworth-mediaeval-fountain-pen-1981}۔"
  history:
    ar: "شاهد مبكر على الطلب الاميري على تطوير أدوات الكتابة — بيروقراطية الفاطميين الضخمة كانت سوق أدوات القلم الأولى {cite:encyclopaedia-of-islam-2}."
    en: "An early witness to princely demand for better writing tools — the huge Fatimid chancery was the premier market for pen technology {cite:encyclopaedia-of-islam-2}."
    ur: "تحریری اوزار کی بہتری پر شاہی طلب کی ابتدائی گواہی — فاطمیوں کا وسیع دیوان قلم کی ٹیکنالوجی کا پہلا بازار تھا {cite:encyclopaedia-of-islam-2}۔"
  significance: 3
  why: "The earliest named reservoir-pen account in the historical record — honestly a single literary report with no surviving specimen, eight centuries before the modern fountain pen."
