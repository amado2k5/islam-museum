kids:
  ar: "قبل ألف سنة طلب خليفة في مصر قلماً يحمل حبره في داخله ويكتب طويلاً بلا أن يغمسه في المحبرة — تحكي الكتب أنهم صنعوه له. لم نجد ذلك القلم، لكن الفكرة عادت بعد ثمانية قرون في قلم الحبر الذي نعرفه."
  en: "A thousand years ago a caliph in Egypt asked for a pen that carried its ink inside and wrote for a long time without dipping — and the books say one was made for him. That pen is lost, but the idea returned eight centuries later in the fountain pen we know."
  ur: "ہزار سال پہلے مصر کے ایک خلیفہ نے ایسا قلم مانگا جو اپنی سیاہی اپنے اندر رکھے اور دوات میں ڈبائے بغیر دیر تک لکھے — کتابیں کہتی ہیں کہ اسے بنا کر دیا گیا۔ وہ قلم کھو گیا، مگر خیال آٹھ صدیوں بعد فاؤنٹین پن میں لوٹا۔"
