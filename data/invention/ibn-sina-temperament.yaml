summary:
  ar: "الفصل الأول من التعليم الثالث في الفن الأول يعرّف المزاج بأنه كيفية حاصلة من تفاعل الكيفيات المتضادة، ويعدّ القوى الأولية في الأركان أربعاً: الحرارة والبرودة والرطوبة واليبوسة؛ ثم يقرر استحالة الاعتدال الحقيقي ويشتق الاعتدال العملي بثمانية اعتبارات للقياس {cite:canon-ibn-sina-print-v1 pp.19–21}."
  en: "The first chapter of Ta'lim 3 in Fann 1 defines temperament as a quality arising from the reaction of opposed qualities, and counts the primary forces in the elements as four: heat, cold, moisture and dryness; it then rules true equilibrium impossible and derives the practical equilibrium through eight considerations of measure {cite:canon-ibn-sina-print-v1 pp.19–21}."
  ur: "فن اول کی تعلیم سوم کا پہلا باب مزاج کو متضاد کیفیات کے باہمی عمل سے پیدا ہونے والی خوبی بتاتا ہے اور ارکان کی بنیادی قوتیں چار گنتا ہے: حرارت، سردی، نم اور خشکی؛ پھر حقیقی اعتدال کی ناممکن قرار دیتا ہے اور آٹھ اعتبارات سے عملی اعتدال نکالتا ہے {cite:canon-ibn-sina-print-v1 pp.19–21}۔"
  es: "El primer capítulo de Ta'lim 3 en Fann 1 define el temperamento como una cualidad que surge de la reacción de cualidades opuestas, y cuenta las fuerzas primarias en los elementos como cuatro: calor, frío, humedad y sequedad; luego declara imposible el verdadero equilibrio y deriva el equilibrio práctico a través de ocho consideraciones de medida {cite:canon-ibn-sina-print-v1 pp.19–21}."
  fr: "Le premier chapitre du Ta'lim 3 dans Fann 1 définit le tempérament comme une qualité résultant de la réaction de qualités opposées, et compte les forces primaires dans les éléments comme étant quatre: la chaleur, le froid, l'humidité et la sécheresse; il déclare ensuite le véritable équilibre impossible et déduit l'équilibre pratique à travers huit considérations de mesure {cite:canon-ibn-sina-print-v1 pp.19–21}."
