kids: { ar: "تخيّل ابن سينا الجسم كأنه يمشي على أربعة أشياء متوازنة: حرارة، برودة، رطوبة، يبس. إذا اختل التوازن مرض؛ وإذا اعتدل سُلم. هذا كان إطاراً طبياً قديماً ندرسه تاريخاً.", en: "Ibn Sina imagined the body as moving on four balanced things: heat, cold, moisture, dryness. When the balance breaks, disease comes; when it holds, health holds. This was an old medical frame we study as history.", ur: "ابن سینا نے جسم کو چار متوازن چیزوں پر چلتے ہوئے سمجھا: حرارت، سردی، نم، خشکی۔ جب توازن ٹوٹتا ہے مرض آتا ہے؛ جب قائم رہتا ہے صحت رہتی ہے۔ یہ ایک پرانا طبی فریم ہے جو ہم تاریخ کے طور پر پڑھتے ہیں۔" }
