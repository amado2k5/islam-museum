summary:
  ar: "موسوعة طبية كبرى جمع فيها الرازي ما رآه في تأليفاته من أمراض وعلل وأدوية وعلاجات، مع مادة عن الماضيين والأقوال المنقولة عنهم؛ مشروع شامل لا اختراع علمي أول {cite:hawi-razi-dar-kutub-ilmiyya p.3}."
  en: "A large medical encyclopedia in which al-Razi gathered what he saw in the body of medicine — diseases, causes, drugs, treatments — together with material on earlier authors and their sayings; a comprehensive project, not a first scientific invention {cite:hawi-razi-dar-kutub-ilmiyya p.3}."
  ur: "طب کی ایک بڑی دائرۃ المعارف جس میں رازی نے طب کے مجمعے سے امراض، علل، ادویات اور علاج جمع کیے اور پہلے کے مصنفین اور ان کی اقوال کی مواد شامل کیا؛ یہ جامع منصوبہ ہے، پہلی سائنسی ایجاد نہیں {cite:hawi-razi-dar-kutub-ilmiyya p.3}۔"
  es: "Una gran enciclopedia médica en la que al-Razi reunió lo que vio en el cuerpo de la medicina —enfermedades, causas, medicamentos, tratamientos— junto con material sobre autores anteriores y sus dichos; un proyecto integral, no una primera invención científica {cite:hawi-razi-dar-kutub-ilmiyya p.3}."
  fr: "Une grande encyclopédie médicale dans laquelle al-Razi a rassemblé ce qu'il voyait dans le corps de la médecine — maladies, causes, médicaments, traitements — ainsi que des informations sur les auteurs antérieurs et leurs propos; un projet complet, et non une première invention scientifique {cite:hawi-razi-dar-kutub-ilmiyya p.3}."
