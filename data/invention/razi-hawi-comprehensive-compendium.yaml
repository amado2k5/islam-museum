kids: { ar: "كان الرازي طبيباً جمع آلاف النصوص الطبية في كتاب واحد اسمه الحاوي. لم يخترع كل ما فيه بل رتّب ما وجده من كتب أقدم وأقوال من سبقوه؛ النسخ من كتابه بقيت تُقرأ حتى اليوم.", en: "Al-Razi was a physician who gathered thousands of medical texts into one book called al-Hawi. He did not invent everything in it but organized what he found in older books and the sayings of those before him; copies of his book still survive to be read today.", ur: "رازی ایک طبیب تھے جنہوں نے ہزاروں طبی متون کو ایک کتاب الحاوی میں جمع کیا۔ انہوں نے اس میں موجود ہر چیز ایجاد نہیں کی بلکہ پرانی کتابوں اور ان سے پہلے کے مصنفین کی باتوں کو ترتیب دیا؛ ان کی کتاب کی نسخے آج بھی پڑھی جاتی ہیں۔" }
