summary:
  ar: "تعليم في الأعراض والدلائل يجمع كلاً منها على ما يدل عليه من حال حاضرة أو ماضية أو مستقبلة، ويفصل بين ما يستدل به على المرض وما يستدل به على قوامه وسلامه {cite:canon-ibn-sina-print-v1 p.154}."
  en: "A treatment of symptoms and signs that sorts each by the state it reveals — present, past or coming — and separates what indicates a disease from what indicates its nature and soundness {cite:canon-ibn-sina-print-v1 p.154}."
  ur: "علامات اور دلالات کا ایک تعلیمی باب جو ہر علامت کو اس حال سے جو وہ ظاہر کرتی ہے منظم کرتا ہے — حالیہ، ماضی یا آنے والا — اور مرض کی علامت کو اس کے عود اور تندرستی سے الگ کرتا ہے {cite:canon-ibn-sina-print-v1 p.154}۔"
  es: "Un tratamiento de síntomas y signos que los clasifica según el estado que revelan —presente, pasado o futuro— y separa lo que indica una enfermedad de lo que indica su naturaleza y salud {cite:canon-ibn-sina-print-v1 p.154}."
  fr: "Un traitement des symptômes et des signes qui les trie selon l'état qu'ils révèlent — présent, passé ou à venir — et sépare ce qui indique une maladie de ce qui indique sa nature et sa santé {cite:canon-ibn-sina-print-v1 p.154}."
