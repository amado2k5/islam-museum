label: { ar: "منهج ابن الهيثم التجريبي-الرياضي في كتاب المناظر", en: "Ibn al-Haytham's experimental-mathematical method in the Book of Optics", ur: "کتاب المناظر میں ابن ہیثم کا تجرباتی ریاضیاتی طریقہ", es: "El método experimental-matemático de Ibn al-Haytham en el Libro de Óptica.", fr: "La méthode expérimentale et mathématique d'Ibn al-Haytham dans le Livre d'optique", tr: "İbn el-Haytham'ın Optik Kitabı'ndaki deneysel-matematiksel yaklaşımı", id: "Pendekatan eksperimental-matematis Ibn al-Haytham dalam Kitab Optiknya" }
names:
