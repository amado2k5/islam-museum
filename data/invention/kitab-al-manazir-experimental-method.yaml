summary:
  ar: "برنامج منهجي جمع فيه ابن الهيثم في سبعة مقالات دراسة الضوء في أحواله الثلاث — الإشراق والانعكاس والانعطاف — التجربة مع البرهان الرياضي، فوصلت لاتينية سنة 1572 وأعادت بناء علم البصريات في أوروبا {cite:manazir-sabra-1983 pp. 9–11} {cite:tdv-ibnul-heysem works}."
  en: "A systematic programme in which Ibn al-Haytham's seven-book Kitab al-Manazir unites experiment with mathematical proof across light's three states — irradiation, reflection, refraction — reaching Latin print in 1572 and rebuilding optics in Europe {cite:manazir-sabra-1983 pp. 9–11} {cite:tdv-ibnul-heysem works}."
  ur: "ایک منظم پروگرام جس میں ابن ہیثم کی سات کتابوں کی کتاب المناظر روشنی کی تین حالتوں — اشراق، انعکاس اور انکسار — میں تجربے کو ریاضیاتی برہان سے ملاتی ہے؛ 1572ء میں لاطینی چھپائی ہوئی اور یورپ میں بصریات کی تعمیرِ نو کی {cite:manazir-sabra-1983 pp. 9–11} {cite:tdv-ibnul-heysem works}۔"
  es: "Un programa sistemático en el que el Kitab al-Manazir de siete libros de Ibn al-Haytham une el experimento con la demostración matemática en los tres estados de la luz —irradiación, reflexión, refracción— llegando a imprimirse en latín en 1572 y reconstruyendo la óptica en Europa {cite:manazir-sabra-1983 pp. 9–11} {cite:tdv-ibnul-heysem works}."
  fr: "Un programme systématique dans lequel le Kitab al-Manazir en sept livres d'Ibn al-Haytham unit l'expérience à la preuve mathématique à travers les trois états de la lumière — irradiation, réflexion, réfraction — atteignant l'impression latine en 1572 et reconstruisant l'optique en Europe {cite:manazir-sabra-1983 pp. 9–11} {cite:tdv-ibnul-heysem works}."
  tr: "İbn el-Haytham'ın yedi makalede derlediği, ışığın üç halini (aydınlatma, yansıma ve kırılma) inceleyen, matematiksel ispatlarla desteklenen sistematik bir program; 1572'de Latinceye ulaşmış ve Avrupa'da optik bilimini yeniden inşa etmiştir. {cite:manazir-sabra-1983 pp. 9–11} {cite:tdv-ibnul-heysem works}."
  id: "Sebuah program sistematis di mana Ibn al-Haytham menyusun dalam tujuh artikel studi tentang cahaya dalam tiga keadaannya — iluminasi, refleksi, dan refraksi — eksperimen dengan bukti matematis, yang sampai ke bahasa Latin pada tahun 1572 dan membangun kembali ilmu optik di Eropa {cite:manazir-sabra-1983 pp. 9–11} {cite:tdv-ibnul-heysem works}."
