attribution:
  status: improvement
  claim:
    ar: "جمع منهجي للتجربة والبرهان الرياضي عبر علم البصريات كله، لا أول فكرة للإشراق أو أول استعمال للتجربة في العلم."
    en: "A systematic union of experiment and mathematical proof across the whole of optics, not the first idea of intromission or the first use of experiment in science."
    ur: "بصریات کے پورے علم میں تجربے اور ریاضیاتی برہان کا منظم امتزاج، نہ روشنی کے داخل ہونے والے شعاعوں کا پہلا خیال اور نہ سائنس میں تجربے کا پہلا استعمال۔"
  basis:
    ar: "يفتتح الكتاب بنفسه بالبسملة ويعلن منهجه بدمج المناهج الرياضية بالتجربة، لكنه يبني على تراكم إقليدس وبطليموس ومن قبله من المسلمين؛ لا يدّعي المتن أولوية مطلقة لكل فكرة {cite:manazir-sabra-1983 pp. 9–11} {cite:manazir-sabra-1983 pp. 60–63}."
    en: "The book opens in his own name with the basmala and announces its method of joining mathematics to experiment, yet builds on the accumulated optics of Euclid, Ptolemy and earlier Muslims; the text claims no absolute priority for every idea {cite:manazir-sabra-1983 pp. 9–11} {cite:manazir-sabra-1983 pp. 60–63}."
    ur: "کتاب اس کے نام سے اور بسملة کے ساتھ شروع ہوتی ہے اور تجربے کو ریاضی سے جوڑنے کا اپنا طریقہ اعلان کرتی ہے، مگر اقلیدس، بطلیموس اور پہلے کے مسلم محققین کی جمع شدہ بصریات پر کھڑی ہے؛ متن ہر خیال میں مطلق اولیت کا دعویٰ نہیں کرتا {cite:manazir-sabra-1983 pp. 9–11} {cite:manazir-sabra-1983 pp. 60–63}."
