impact:
  fields: [optics-physics]
  changed:
    ar: "حوّل البصريات من غائية هندسية مجردة إلى علم يجمع رصدًا مضبوطًا ببرهان رياضي، في ثلاثة أبواب: الإبصار على الاستقامة والانعكاس والانعطاف {cite:manazir-sabra-1983 pp. 9–11} {cite:tdv-ibnul-heysem works}."
    en: "Turned optics from abstract geometrical teleology into a science joining controlled observation to mathematical proof, across three parts: direct vision, reflection and refraction {cite:manazir-sabra-1983 pp. 9–11} {cite:tdv-ibnul-heysem works}."
    ur: "بصریات کو تجریدی ہندسی غایت سے اس سائنس میں بدلا جو قابو شدہ مشاہدے کو ریاضیاتی برہان سے جوڑتی ہے، تین حصوں میں: استقامت پر نظارہ، انعکاس اور انکسار {cite:manazir-sabra-1983 pp. 9–11} {cite:tdv-ibnul-heysem works}۔"
  history:
    ar: "ترجم إلى اللاتينية في القرنين الثاني عشر والثالث عشر، وطبعه ريزنر سنة 1572 مع كتاب ويتلو، فأعاد بناء علم البصريات في أوروبا القرون الوسطى {cite:tdv-ibnul-heysem works}."
    en: "Translated into Latin in the twelfth or thirteenth century and printed by Risner in 1572 alongside Witelo, it rebuilt medieval Europe's optics {cite:tdv-ibnul-heysem works}."
    ur: "بارہویں یا تیرہویں صدی میں لاطینی میں ترجمہ ہوا اور 1572ء میں ریزنر نے وٹلو کی کتاب کے ساتھ چھاپا، جس سے قرون وسطیٰ کے یورپ کی بصریات دوبارہ تعمیر ہوئی {cite:tdv-ibnul-heysem works}۔"
  significance: 4
  why: "A documented methodological synthesis whose seven-book architecture and Latin afterlife are attested in the edition and the encyclopedia; the exact composition year remains unsettled."
