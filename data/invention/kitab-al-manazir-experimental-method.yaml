    ar: "ألّف الكتاب في مصر في عهد الحاكم الفاطمي بعد أن استقر فيها؛ تذكر السيرة بقاءه في مصر وأعماله البصرية من غير تحديد يوم أو غرفة {cite:tdv-ibnul-heysem biography} {cite:manazir-sabra-1983 p. 9}."
    en: "He composed the book in Egypt under the Fatimid caliph al-Hakim after settling there; the biography records his stay in Egypt and optical works without fixing a day or room {cite:tdv-ibnul-heysem biography} {cite:manazir-sabra-1983 p. 9}."
