today:
  form:
    ar: "ما زال يُدرَّس ويُمارَس في إيران وباكستان والهند؛ تُكتب به دواوين الشعر الفارسي والأردية في أنواع الرِّقعة والنسخ."
    en: "Still taught and practised in Iran, Pakistan and India; used for Persian poetry collections and for Urdu in riqa' and naskh styles."
    ur: "اب بھی ایران، پاکستان اور ہند میں پڑھایا اور سیکھا جاتا ہے؛ فارسی شاعری کے دیوانوں اور اردو میں رقعہ و نسخ کے اندازوں میں لکھا جاتا ہے۔"
  descendants:
    ar: "أشكاله المتأخرة مثل الشكستة نستعلیق والرقعة أسهمت في الخطوط الإدارية والإبداعية الفارسية الحديثة."
    en: "Later forms such as shikasta-nasta'liq and riqa' fed modern Persian administrative and artistic hands."
    ur: "شکستہ نستعلیق اور رقعہ جیسے بعد کی شکلوں نے جدید فارسی انتظامی اور فنی رسم الخطوں کو متاثر کیا۔"
