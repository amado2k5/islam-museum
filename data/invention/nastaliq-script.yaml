kids:
  ar: "قبل خمسمئة سنة، في مدن إيران، جمع الخطاطون خطين قديمين: النسخ الواضح والتعليق السريع، فخرج خط جديد رشيق مائل ينساب كأنه طائر. في تبريز، يقول الناس إن مير علي أتقنه في بلاط السلطان أحمد، وفي كتب الخط حكاية عن رؤيا أمرته بصنعه. اليوم ما زال هذا الخط — «عروس الخطوط» — يُكتب به شعر الفارسية في إيران وباكستان والهند."
  en: "Five hundred years ago, in the cities of Iran, calligraphers joined two old hands — clear naskh and swift ta'liq — into a new flowing script that seemed to fly. At the court of Sultan Ahmad in Tabriz, people say Mir Ali perfected it, and calligraphy books tell of a dream that commanded it. Today this 'bride of scripts' is still written for Persian poetry in Iran, Pakistan and India."
  ur: "پان سو سال پہلے، ایران کے شہروں میں، خطاطوں نے دو پرانے خط ملائے — واضح نسخ اور تیز تعلیق — اور ایک نیا بہتا ہوا خط بنایا جو اڑتا ہوا لگتا تھا۔ تبریز میں سلطان احمد کے دربار پر لوگوں کا کہنا ہے کہ میر علی نے اسے کمال دیا، اور خطاطی کتابیں ایک خواب کی کہانی بتاتی ہیں جس نے اسے بنانے کا حکم دیا۔ آج یہ «عروس الخطوط» ایران، پاکستان اور ہند میں فارسی شاعری کے لیے لکھا جاتا ہے۔"
sources: [source/ekhtiar-how-to-read-islamic-calligraphy-2018, source/titley-persian-miniature-painting-1983, source/commons-nastaliq-tabriz-1473]
