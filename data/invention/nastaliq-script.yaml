summary:
  ar: "خط فارسي رشيق نشأ في شيراز وتبريز في النصف الثاني من القرن الثامن الهجري من اندماج النسخ والتعليق، ولقب «عروس الخطوط»، وصار خط الشعر الفارسي وانتشر إلى الهند المغولية والدولة العثمانية {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27}. وتنسبه الأسطورة إلى مير علي التبريزي بعد رؤيا، بينما يرى الباحثون تطوراً تدريجياً {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:titley-persian-miniature-painting-1983 p. 27}."
  en: "An elegant Persian script that grew in Shiraz and Tabriz in the second half of the fourteenth century from a merging of naskh and ta'liq; called the 'bride of scripts', it became the script of Persian poetry and spread to Mughal India and Ottoman Turkey {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27}. Legend credits Mir Ali Tabrizi after a dream, while scholars describe a gradual development {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:titley-persian-miniature-painting-1983 p. 27}."
  ur: "ایک نفیس فارسی خط جو چودہویں صدی کے دوسرے نصف میں شیراز اور تبریز میں نسخ و تعلیق کے امتزاج سے بنا؛ «عروس الخطوط» کہلایا، فارسی شاعری کا خط بنا اور مغل ہند اور عثمانی ترکی تک پھیلا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27}۔ روایت اسے خواب کے بعد میر علی تبریزی سے منسوب کرتی ہے، جبکہ محققین بتدریجی ارتقا کہتے ہیں {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:titley-persian-miniature-painting-1983 p. 27}۔"
  es: "Una elegante escritura persa que surgió en Shiraz y Tabriz en la segunda mitad del siglo XIV a partir de la fusión de naskh y ta'liq; llamada la \"novia de las escrituras\", se convirtió en la escritura de la poesía persa y se extendió a la India mogol y la Turquía otomana {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27}. La leyenda atribuye su creación a Mir Ali Tabrizi tras un sueño, mientras que los estudiosos describen un desarrollo gradual {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:titley-persian-miniature-painting-1983 p. 27}."
  fr: "Une élégante écriture persane apparue à Shiraz et Tabriz dans la seconde moitié du XIVe siècle, issue de la fusion du naskh et du ta'liq; surnommée la « fiancée des écritures », elle devint l'écriture de la poésie persane et se répandit dans l'Inde moghole et la Turquie ottomane {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27}. La légende attribue sa création à Mir Ali Tabrizi suite à un rêve, tandis que les érudits décrivent un développement progressif {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:titley-persian-miniature-painting-1983 p. 27}."
  tr: "Hicri 8. yüzyılın ikinci yarısında Şiraz ve Tebriz'de Naskh ve Ta'lik stillerinin birleşmesinden doğan zarif bir Fars yazısıdır. \"Yazıların gelini\" olarak anılan bu yazı, Fars şiirinin yazısı haline gelmiş, Babür Hindistanı ve Osmanlı İmparatorluğu'na yayılmıştır. Efsaneye göre Mir Ali Tebrizi'nin bir vizyon sonucu ortaya çıkardığı söylenirken, araştırmacılar bunun kademeli bir gelişme olduğunu düşünmektedir."
  id: "Kaligrafi Persia yang anggun ini berasal dari Shiraz dan Tabriz pada paruh kedua abad ke-8 Hijriah, hasil penggabungan gaya Naskh dan Ta'liq. Kaligrafi ini dijuluki \"pengantin dari semua kaligrafi\" dan menjadi kaligrafi puisi Persia, menyebar ke India Mughal dan Kekaisaran Ottoman {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27}. Legenda menyebutkan bahwa kaligrafi ini diciptakan oleh Mir Ali Tabrizi setelah mendapat penglihatan, sementara para peneliti melihatnya sebagai perkembangan bertahap {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:titley-persian-miniature-painting-1983 p. 27}."
