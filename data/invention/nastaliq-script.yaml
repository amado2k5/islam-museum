origin:
  place: place/tabriz
  polity: polity/jalayirids
  context:
    ar: "نشأ الخط في مدينتي شيراز وتبريز في النصف الثاني من القرن الثامن الهجري، وتبريز كانت حاضرة السلطان أحمد الجلائري الذي عمل عنده مير علي التبريزي {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:titley-persian-miniature-painting-1983 p. 27}."
    en: "The script grew in the cities of Shiraz and Tabriz in the second half of the fourteenth century; Tabriz was the seat of Sultan Ahmad Jalayir, under whose patronage Mir Ali Tabrizi worked {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:titley-persian-miniature-painting-1983 p. 27}."
    ur: "یہ خط چودہویں صدی کے دوسرے نصف میں شیراز اور تبریز کے شہروں میں پروان چڑھا؛ تبریز سلطان احمد جلائری کا دار الحکومت تھا جن کی سرپرستی میں میر علی تبریزی کام کرتے تھے {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27} {cite:titley-persian-miniature-painting-1983 p. 27}۔"
makers:
  - person: person/mir-ali-tabrizi
    role: disputed
    place: place/tabriz
    note: "Titley credits him with perfecting the nasta'liq script under Sultan Ahmad Jalayir and with writing the 1396 Khvaju Kirmani poems in it {cite:titley-persian-miniature-painting-1983 p. 27}; Ekhtiar reports the dream legend naming him inventor and scholars' gradual-development view {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27}. Identity and role are documented; priority is contested."
    sources: [source/titley-persian-miniature-painting-1983, source/ekhtiar-how-to-read-islamic-calligraphy-2018]
attribution:
  status: contested
  claim:
    ar: "يُنسب هذا الخط إلى مير علي التبريزي بعد رؤيا في الحكاية المتداولة، وتنسب إليه كتب تاريخ الخط إشادة إتقانه؛ ويرى الباحثون أنه تدرج من دمج النسخ والتعليق في شيراز وتبريز."
    en: "The script is credited to Mir Ali Tabrizi in the circulated dream legend and praised in calligraphy histories for his mastery; scholars describe it as a gradual fusion of naskh and ta'liq in Shiraz and Tabriz."
    ur: "رائج روایت میں اس خط کو خواب کے بعد میر علی تبریزی سے منسوب کیا جاتا ہے اور خطاطوں کی تاریخیں ان کی مہارت کی تعریف کرتی ہیں؛ محققین اسے شیراز و تبریز میں نسخ و تعلیق کے بتدریجی امتزاج بتاتے ہیں۔"
  basis:
    ar: "يقول إختیار إن الأسطورة تنسب اختراعه إلى مير علي التبريزي النشط أواخر القرن الرابع عشر بعد أن ظهر له علي بن أبي طالب في المنام وأمره أن يصنع حروفاً تشبه أجنحة الإوز الطائر، لكن الباحثين يثبتون أنه نشأ في النصف الثاني من القرن الرابع عشر في شيراز وتبريز كاندماج تدريجي للنسخ والتعليق {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27}. وتقول تيتلي إنه في عهد رعاية السلطان أحمد أتقن مير علي التبريزي الخط الفارسي الرشيق وكتب به قصائد خواجو كرماني سنة 1396م {cite:titley-persian-miniature-painting-1983 p. 27}. فالنسبة إلى شخص مفرد حكاية مهنية متداولة لا برهان أولوية."
    en: "Ekhtiar reports the legend that Mir Ali Tabrizi (active late 14th century) invented it after Ali ibn Abi Talib appeared to him in a dream commanding letters like flying geese's wings, but scholars hold it developed in the second half of the fourteenth century in Shiraz and Tabriz as a gradual merging of naskh and ta'liq {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27}. Titley says that under Sultan Ahmad's patronage Mir Ali Tabrizi perfected the elegant flowing nasta'liq script and wrote Khvaju Kirmani's poems in it in 1396 {cite:titley-persian-miniature-painting-1983 p. 27}. The single-inventor credit is a circulated craft story, not proof of priority."
    ur: "اختیار کے مطابق میر علی تبریزی ⁦(چودہویں صدی کے آخر میں فعال)⁩ نے خواب میں علی بن ابی طالب کی اوامر پر اس کی ایجاد کی، مگر محققین کا ماننا ہے کہ یہ شیراز و تبریز میں چودہویں صدی کے دوسرے نصف میں نسخ اور تعلیق کے بتدریجی امتزاج سے پروان چڑھا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27}۔ تیتلی لکھتے ہیں کہ سلطان احمد کی سرپرستی میں میر علی تبریزی نے اس نفیس روان نستعلیق کو کمال دیا اور 1396ء میں خواجو کرمانی کی نظمیں اسی میں لکھیں {cite:titley-persian-miniature-painting-1983 p. 27}۔ اکیلے ایجاد کنندہ کا رتبہ روایتِ دستکاری کی کہانی ہے، اولویت کا ثبوت نہیں۔"
  perspectives:
    - tradition: sunni
      id: sunni-museum-frame
      standing: main
      summary:
        ar: "يحفظ الإطار السني المعلن السجل داخل الوسط الفارسي-التركي المدروس، مع تسمية الأسطورة بصفتها حكاية مهنية لا حكماً تاريخياً، وإبراز الإتقان المنسوب إلى مير علي تحت رعاية السلطان أحمد."
        en: "The museum's explicit Sunni frame keeps the record inside the documented Persianate-Turkic milieu, labels the dream story a craft legend rather than a historical verdict, and foregrounds the mastery credited to Mir Ali under Sultan Ahmad's patronage."
        ur: "عجائب گھر کا واضح سنی سیاق ریکارڈ کو دستاویزی فارسی و ترکی مرکزی ماحول میں رکھتا ہے، خواب کی کہانی کو تجزیاتی ورژن کے بجائے دستکاری کی روایت قرار دیتا ہے، اور سلطان احمد کی سرپرستی میں میر علی سے منسوب مہارت کو نمایاں کرتا ہے۔"
      sources: [source/titley-persian-miniature-painting-1983, source/ekhtiar-how-to-read-islamic-calligraphy-2018]
    - tradition: academic
      id: academic-gradual-development
      standing: main
      summary:
        ar: "يرى الباحثون الذين ينقل عنهم إختیار أن النستعليق نشأ في شيراز وتبريز في النصف الثاني من القرن الرابع عشر كاندماج تدريجي للنسخ المتوازن المقروء والتعليق السريع الإيمائي، لا كاختراع مفرد ليلة واحدة."
        en: "The scholars quoted by Ekhtiar hold that nasta'liq originated in Shiraz and Tabriz in the second half of the fourteenth century as a gradual merging of the balanced, legible naskh and the swift, gestural ta'liq — not a single overnight invention."
        ur: "اختیار کے مطابق محققین کہتے ہیں کہ نستعلیق چودہویں صدی کے دوسرے نصف میں شیراز و تبریز میں متوازن اور پڑھنے کے قابل نسخ اور تیز و اسلوبی تعلیق کے بتدریجی امتزاج سے پیدا ہوا — ایک رات کی ایجاد نہیں۔"
      sources: [source/ekhtiar-how-to-read-islamic-calligraphy-2018]
    - tradition: other
      id: craft-legend-mir-ali
      standing: secondary
      summary:
        ar: "تحكي الأسطورة المهنية أن علي بن أبي طالب ظهر لمير علي التبريزي في المنام وأمره أن يصنع حروفاً تشبه أجنحة الإوز الطائر؛ تكرر الحكاية في كتب الخط وتصف أصول الخط الروحية."
        en: "The craft legend tells that Ali ibn Abi Talib appeared to Mir Ali Tabrizi in a dream and commanded letters like the wings of flying geese; the story is repeated in calligraphy books and frames the script's spiritual origin."
        ur: "دستکاری کی روایت کہتی ہے کہ علی بن ابی طالب نے میر علی تبریزی کے خواب میں ظاہر ہو کر اڑنے والے ہنس کی پروں جیسے حروف بنانے کا حکم دیا؛ یہ کہانی خطاطی کتب میں دہرائی جاتی ہے اور خط کی روحانی اصل بیان کرتی ہے۔"
      sources: [source/ekhtiar-how-to-read-islamic-calligraphy-2018]
precursors:
  - external: { ar: "خط النسخ — النسخ الواضح المتوازن للكتب والمصاحف", en: "The naskh script — the clear, balanced book and Qur'an hand", ur: "نسخ خط — کتابوں اور مصاحف کی واضح متوازن رسم الخط" }
    note: "Naskh contributed legibility and balance; part of the six classical proportional scripts canonised in the Ibn Muqla tradition {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 pp. 25–27}."
    sources: [source/ekhtiar-how-to-read-islamic-calligraphy-2018]
  - external: { ar: "خط التعليق — خط الدواوين السريع المتصل", en: "The ta'liq script — the swift, connected chancellery hand", ur: "تعلیق خط — تیز اور مربوط دفتری رسم الخط" }
    note: "Ta'liq evolved in Iran from the late thirteenth century and was prized for efficiency in documents and correspondence; its sweeping gestural strokes fed nasta'liq {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 pp. 26–27}."
    sources: [source/ekhtiar-how-to-read-islamic-calligraphy-2018]
dependents:
  - external: { ar: "الشكستة نستعلیق — خط السرعة المكسور", en: "Shikasta-nasta'liq — the swift 'broken' variant", ur: "شکستہ نستعلیق — تیز 'ٹوٹی ہوئی' شکل" }
    note: "Developed in Iran after the sixteenth century for speed; a skilled calligrapher could finish a word in one stroke without lifting the pen {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27}."
    sources: [source/ekhtiar-how-to-read-islamic-calligraphy-2018]
  - external: { ar: "ألبومات الخط الفارسي في الهند والمختارات العثمانية", en: "Persian calligraphy albums in Mughal India and Ottoman collections", ur: "مغل ہند اور عثمانی مجموعوں کے فارسی خطاطی البمز" }
    note: "Mughal-era albums such as the Shah Jahan Album preserve signed nasta'liq folios; Ottoman collections continued the taste westward {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 pp. 53–56}."
    sources: [source/ekhtiar-how-to-read-islamic-calligraphy-2018]
spread: []
impact:
  fields: [everyday-life]
  changed:
    ar: "صار خط الشعر الفارسي والفارسية المكتوبة أنيقاً، و«عروس الخطوط»، وانتشر إلى الهند العثمانية؛ حمل اسم الخط مكانة ثقافية في العالم الفارسي-التركي."
    en: "It became the elegant hand of Persian poetry and elevated Persianate writing; spreading to Mughal India and Ottoman Turkey, the 'bride of scripts' carried cultural prestige across the Persianate-Turkic world."
    ur: "یہ فارسی شاعری اور فارسی تحریر کا نفیس خط بنا اور «عروس الخطوط» کہلایا؛ مغل ہند اور عثمانی ترکی تک پھیل کر اس نے فارسی-ترکی دنیا میں ثقافتی وقار قائم کیا۔"
  history:
    ar: "غيّر مظهر المخطوطات الشعرية الفارسية منذ القرن الخامس عشر، وبقي حياً في إيران وباكستان والهند حتى اليوم، وصار رمزاً لهوية الخط الفارسي."
    en: "It reshaped the look of Persian poetic manuscripts from the fifteenth century and remains a living hand in Iran, Pakistan and India, an emblem of Persianate calligraphic identity."
    ur: "اس نے پندرہویں صدی سے فارسی شاعری کے مخطوطات کی شکل بدل دی اور آج بھی ایران، پاکستان اور ہند میں زندہ رسم الخط ہے، فارسی خطاطی شناخت کی علامت۔"
  significance: 4
  why: "A durable script that defined the visual culture of Persianate letters for six centuries across three regions; significance rests on its documented mastery tradition and spread, not on a proven single invention."
