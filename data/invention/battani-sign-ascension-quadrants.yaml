impact:
  fields: [astronomy-instruments, mathematics]
  changed:
    ar: "حوّل حساب مطالع البروج من قيمتين معروفتين عند طرفي الفلك إلى مخطط كامل بين المطال الأربعة، بقاعدة تناسبية قابلة للتطبيق على أي درجة أو نجم وعرض، لخدمة حساب أزمنة الاتصالات التنجيمية."
    en: "Turned sign-ascension computation from two known values at the sphere's poles into a complete scheme between the four cusps, by a proportional rule applicable to any degree or star and latitude, serving the computation of astrological direction times."
    ur: "بروج کے مطالع کا حساب کرہ کے دو کناروں کی دو معلوم قیمتوں سے چار کناروں کے درمیان مکمل نظام میں بدل دیا، متناسب اصول سے جو کسی بھی درجہ، ستارے اور عرض پر چلتا ہے، تاکہ نجومی اتصالوں کے اوقات نکلیں۔"
  history:
    ar: "شهد على عناية الفلك العباسي بالدقة الحسابية في خدمة التنجيم الرياضي؛ رسالته المخصصة لم تطلع، فيبقى الباب السابع والخمسون شاهداً على المنهج لا على سطحه كاملاً."
    en: "Witnesses Abbasid astronomy's computational care in the service of mathematical astrology; his dedicated treatise did not survive, so chapter LV stands as the surviving witness to the scheme, not its full surface."
    ur: "عباسی فلکیات کی ریاضیاتی دقت کی گواہی دیتا ہے جو ریاضیاتی نجومیات کی خدمت میں تھی؛ اس کا مخصوص رسالہ باقی نہیں، اس لیے باب LV اس نظام کا باقی شاہد ہے، اس کی پوری صورت نہیں۔"
  significance: 3
  why: "A documented, chapter-length systematic method with worked examples and named astrological purpose; bounded to one computational scheme inside the Zij tradition, with the dedicated treatise lost."
