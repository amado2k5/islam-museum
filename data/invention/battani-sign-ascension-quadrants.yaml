summary:
  ar: "باب خامس وخمسون من الزيج مع رسالة مفقودة مدرجة في فهارس ابن النديم والقفطي وابن خلكان: منهج لحساب مطالع البروج وهبوطها في المساحات بين المطال الأربعة ⁦(السمتين والأفقين)⁩ لكل إقليم، بقاعدة تناسبية بين المطالع المستقيمة والمائلة، لحساب أزمنة طلوع البروج ومقادير الاتصالات التنجيمية {cite:nallino-albatenii-opus-astronomicum p. 28} {cite:nallino-albatenii-opus-astronomicum t. I pp. 131–135}."
  en: "Chapter LV of the Zij together with a lost treatise listed by Ibn al-Nadim, al-Qifti and Ibn Khallikan: a scheme for computing sign ascensions and settings in the spaces between the four cusps (the meridians and horizons) of each climate, by proportional interpolation between right and oblique ascensions, to obtain rising times and the quantities of astrological directions {cite:nallino-albatenii-opus-astronomicum p. 28} {cite:nallino-albatenii-opus-astronomicum t. I pp. 131–135}."
  ur: "زیج کا پچپن ویں باب اور ایک گمشدہ رسالہ جو ابن الندیم، قفطی اور ابن خلکان کی فہارس میں ہے: ہر خطے میں چار کناروں ⁦(خطوطِ زوال اور افق)⁩ کے درمیان بروج کے مطالع و مغیب کا حساب سیدھے اور ترچھے مطالع کے درمیان متناسب اصول سے، تاکہ طلوع کے اوقات اور نجومی اتصالوں کے مقدر نکلیں {cite:nallino-albatenii-opus-astronomicum p. 28} {cite:nallino-albatenii-opus-astronomicum t. I pp. 131–135}۔"
