kids:
  ar: "الأبراج لا تشرق من الأفق بالمدة نفسها في كل مكان: قرب خط الاستواء تطول أقواسها وقرب القطبين تقصر. جمع البتاني هذا الفرق في جدول ووضع قاعدةً: كلما ابتعدت الدرجة عن المطلوب بقليل، غيّر مقدار المطالع بمقدار متناسب — فصار يستطيع أن يقول كم يستغرق كل برج ليشرق في أي بقعة من السماء."
  en: "The signs do not rise for the same length of time everywhere: near the equator their arcs are longer and near the poles shorter. Al-Battani gathered this difference into a rule — the farther a degree sits from the reference point, the more its rising time changes in proportion — so he could say how long each sign takes to rise at any point of the sky."
  ur: "بروج ہر جگہ ایک ہی وقت میں طلوع نہیں ہوتے: خطِ استوا کے قریب ان کے قوس لمبے اور قطبوں کے قریب چھوٹے ہوتے ہیں۔ بتانی نے اس فرق کو اصول میں ڈھالا — جتنا درجہ حوالہ نقطے سے دور، اتنا اس کا مطلع متناسب طور پر بدلے — تاکہ وہ کہہ سکے ہر برج کسی بھی آسمانی مقام پر کتنی دیر میں طلوع ہوتا ہے۔"
