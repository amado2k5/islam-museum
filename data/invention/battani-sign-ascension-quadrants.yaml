attribution:
  status: improvement
  claim:
    ar: "المطالع المستقيمة والمائلة في الأفقين معروفة سلفاً في فصول الزيج؛ المساهمة الموثقة للبتاني تعميم الحساب إلى المساحات بين المطال الأربعة بقاعدة تناسبية، ضمن تقليد فلكي إغريقي-هندي موروث، لا اختراع علم المطالع نفسه."
    en: "Right ascensions and horizon ascensions were already known in earlier Zij chapters; al-Battani's documented contribution is extending the computation to the spaces between the four cusps by a proportional rule, inside an inherited Greco-Indian astronomical tradition — not the invention of ascensional astronomy itself."
    ur: "سیدھے مطالع اور افقی مطالع زیج کے پہلے ابواب میں پہلے سے معلوم تھے؛ بتانی کا مستند حصہ چار کناروں کے درمیان کے حصوں کا حساب متناسب اصول سے عام کرنا ہے، موروثی یونانی-ہندوستانی فلکی روایت کے اندر — مطالع کے علم کی ایجاد نہیں۔"
  basis:
    ar: "يفتتح الباب نفسه بالتفريق: المعروفة سلفاً مطالع الكرة المستقيمة عند وسط السماء وتحت الأرض، ومطالع الأقاليم عند الأفقين؛ وما بقي هو المسافات بين هذه المطال، فيضع قاعدة التناسب ويضرب مثال الحمل كاملاً ثم يعمم القواعد على الدرجة والنجمة مع العرض وبدونه. ويختم بأن هذه المقادير تلزم في المواليد لتوجيه الدلائل، وهو موضوع التترابيبلوس عند بطلميوس."
    en: "The chapter itself opens by distinguishing what was already known — right ascensions at the meridian and nadir cusps and climatal ascensions at the horizon cusps — from what remained: the spaces between those cusps. He gives the proportional rule with a worked Aries example, then general rules for degree and star with and without latitude, and closes by noting these quantities are needed in nativities for directing significators, the matter Ptolemy raises in the Tetrabiblos."
    ur: "باب خود شروع میں بتاتا ہے کہ کیا پہلے سے معلوم تھا — وسط اور تحت الأرض کے کناروں پر سیدھے مطالع اور افقوں پر خطوں کے مطالع — اور کیا باقی تھا: ان کناروں کے درمیان کے حصے۔ وہ متناسب اصول اور برج الحمل کا مکمل نمونہ دیتا ہے، پھر عرض کے ساتھ اور بغیر درجہ و ستارے کے عام قواعد، اور آخر میں کہتا ہے یہ مقداریں مولودات کے لیے درکار ہیں تاکہ مدلل سمت دیے جا سکیں، جو بطلیموس کے Tetrabiblos کا موضوع ہے۔"
  perspectives:
    - tradition: sunni
      id: sunni-museum-frame
      standing: main
      summary:
        ar: "الإطار السني المعلن يحفظ المساهمة العباسية الموثقة؛ شخصية مذهبية لا تفصل تاريخ الفلك في هذا السجل."
        en: "The declared Sunni frame preserves the documented Abbasid contribution; personal affiliation is not used to settle the history of astronomy in this record."
        ur: "اعلان کردہ سنی سیاق عباسی حصہ کو محفوظ رکھتا ہے؛ اس اندراج میں فلکیات کی تاریخ کے لیے ذاتی مسلک استعمال نہیں ہوتا۔"
      sources: [source/tdv-battani-muftuoglu, source/nallino-albatenii-opus-astronomicum]
