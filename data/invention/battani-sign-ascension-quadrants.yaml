today:
  form:
    ar: "نموذج تاريخي لحساب مطالع البروج على الكرة؛ اليوم تُحسب المطالع والاتصالات بمعادلات كروية مباشرة، والباب درسا في تاريخ الفلك الرياضي."
    en: "A historical model for computing sign ascensions on the sphere; today ascensions and directions are handled by direct spherical formulae, and the chapter is a lesson in the history of mathematical astronomy."
    ur: "کرہ پر بروج کے مطالع کے حساب کا تاریخی نمونہ؛ آج مطالع اور سمتیں سیدھے کروی فارمولوں سے نکلتی ہیں، اور یہ باب ریاضیاتی فلکیات کی تاریخ کا سبق ہے۔"
  descendants:
    ar: "لا يثبت البحث المقروء انتقالاً مباشراً للقاعدة التناسبية إلى البرمجيات الحديثة؛ الفكرة العامة — مطالع تختلف بموضع الكرة — باقية في الفلك الكروي."
    en: "The sources read establish no direct transmission of the proportional rule into modern software; the general idea — ascensions varying by position on the sphere — survives in spherical astronomy."
    ur: "پڑھے ماخذ متناسب اصول کی براہ راست منتقلی جدید سافٹ ویئر تک ثابت نہیں کرتے؛ عمومی خیال — کرہ پر مقام کے ساتھ بدلتے مطالع — کروی فلکیات میں باقی ہے۔"
