summary:
  ar: جنس من الكتب الفلكية الإسلامية يجمع جداول القيم اللازمة لحساب مواقع الشمس والقمر
    والنجوم والكواكب؛ اسمه من الفارسية الوسطى zih أو zig «الخيط» منتقلاً من ترتيب
    خيوط النسج إلى صفوف الجداول وأعمدتها. عرف كينيدي في مسحه أكثر من مئتي زيج بين
    القرنين الثامن والخامس عشر، من زيج السند الهند للخوارزمي إلى الزيج الصابئ للبتاني
    والزيج الإيلخاني للطوسي والزيج السلطاني لأولوغ بيك {cite:wikipedia-zij-en} {cite:kennedy-islamic-astronomical-tables-1956}.
  en: 'The Islamic astronomical handbook-with-tables genre: a book that tabulates
    the parameters needed to compute the positions of the sun, moon, stars and planets;
    its name comes from Middle Persian zih or zig, "cord", transferred from the threads
    of the loom to the rows and columns of tables. Kennedy''s survey registers more
    than two hundred zijes produced between the eighth and fifteenth centuries, from
    al-Khwarizmi''s Zij al-Sindhind through al-Battani''s Zij al-Sabi, al-Tusi''s
    Ilkhani Zij and Ulugh Beg''s Zij-i Sultani {cite:wikipedia-zij-en} {cite:kennedy-islamic-astronomical-tables-1956}.'
  ur: 'اسلامی فلکیات کا وہ صنف جو شمس، قمر، ستاروں اور سیاروں کے مقامات کی گنت کے
    لیے درکار قدروں کے جدول جمع کرتا ہے؛ نام وسطی فارسی zih یا zig «ڈور» سے بنا جو
    بُنائی کے دھاگوں سے جدول کی قطاروں پر منتقل ہوا۔ کینیڈی کے سروے میں آٹھویں سے
    پندرہویں صدی تک دو سو سے زیادہ زیجیں درج ہیں: خوارزمی کی زیجِ سند ہند سے بتانی
    کی زیجِ صابی، طوسی کی زیجِ ایلخانی اور الغ بیگ کی زیجِ سلطانی تک {cite:wikipedia-zij-en}
    {cite:kennedy-islamic-astronomical-tables-1956}۔'
  es: "El género de los manuales astronómicos islámicos con tablas: un libro que tabula los parámetros necesarios para calcular las posiciones del sol, la luna, las estrellas y los planetas; su nombre proviene del persa medio zih o zig, \"cuerda\", transferida de los hilos del telar a las filas y columnas de las tablas. El estudio de Kennedy registra más de doscientos zijes producidos entre los siglos VIII y XV, desde el Zij al-Sindhind de al-Juarismi hasta el Zij al-Sabi de al-Battani, el Ilkhani Zij de al-Tusi y el Zij-i Sultani de Ulugh Beg {cite:wikipedia-zij-en} {cite:kennedy-islamic-astronomical-tables-1956}."
