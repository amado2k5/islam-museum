attribution:
  status: original
  claim:
    ar: 'الزيج جنس إسلامي بامتياز: بُني على مواد بطلمية وساسانية وهندية، لكن هيئته
      ككتاب جداول شامل مع أبواب في التقويم والمثلثات والكسوف ورؤية الهلال نشأت في
      البيت الفلكي الإسلامي؛ لا مخترع واحد له {cite:wikipedia-zij-en} {cite:kennedy-islamic-astronomical-tables-1956}.'
    en: 'The zij is a distinctively Islamic genre: built on Ptolemaic, Sasanian and
      Indian material, but its shape as a comprehensive table-book with sections on
      chronology, trigonometry, eclipses and crescent visibility grew inside Islamic
      astronomy; no single inventor {cite:wikipedia-zij-en} {cite:kennedy-islamic-astronomical-tables-1956}.'
    ur: 'زیج مخصوص اسلامی صنف ہے: بطلمیسی، ساسانی اور ہندوستانی مواد پر بنا، مگر بطور
      جامع جدول کتاب جس میں تقویم، مثلثیات، کسوف اور ہلال رویت کے ابواب ہوں اس کی
      شکل اسلامی فلکیات کے اندر بنی؛ کوئی واحد مخترع نہیں {cite:wikipedia-zij-en}
      {cite:kennedy-islamic-astronomical-tables-1956}۔'
  basis:
    ar: يعدد كينيدي أكثر من مئتي زيج من القرن الثامن إلى الخامس عشر ويصف محتواها النموذجي
      وجذورها الثلاثة؛ ويسجل أن معظمها تبنّى نظرية سابقة فكان إسهامها تحسين المثلثات
      والحساب والرصد {cite:wikipedia-zij-en} {cite:kennedy-islamic-astronomical-tables-1956}.
    en: Kennedy lists more than two hundred zijes from the eighth to the fifteenth
      century, describes their standard contents and their three roots, and records
      that most adopted earlier theory so that their contribution lay in improved
      trigonometrical, computational and observational technique {cite:wikipedia-zij-en}
      {cite:kennedy-islamic-astronomical-tables-1956}.
    ur: کینیڈی آٹھویں سے پندرہویں صدی تک دو سو سے زیاد زیجیں گنواتا ہے، ان کے معیاری
      مندرجات اور تین جڑیں بیان کرتا ہے، اور لکھتا ہے کہ اکثر نے سابق نظریہ اختیار
      کیا لہٰذا ان کا حصہ بہتر مثلثیاتی، حسابی اور رصدی اسالیب تھا {cite:wikipedia-zij-en}
      {cite:kennedy-islamic-astronomical-tables-1956}۔
