  changed:
    ar: 'جعل الحساب الفلكي مهنة منضبطة: صار الفلكي أو الموقت يستخرج موضع أي جرم لأي
      تاريخ من الجداول بدل إعادة الاشتقاق من النظرية، فخدمت الأزياج التقويم وأوقات
      الصلاة والمناسبات الشرعية والتنجيم القضائي {cite:wikipedia-zij-en}.'
    en: 'It turned astronomical computation into a desk discipline: a muwaqqit could
      extract any body''s position for any date from the tables instead of re-deriving
      it from theory, so zijes served the calendar, prayer times, religious festivals
      and judicial astrology {cite:wikipedia-zij-en}.'
    ur: 'فلکی حساب کو میز پر کرنے کا منضبط پیشہ بنا دیا: مقت جدولوں سے ہر جرم کا مقام
      ہر تاریخ کے لیے نکالتا نظریہ از سر اخذ کیے بغیر؛ زیجیں تقویم، اوقاتِ نماز، دینی
      مواقع اور فلکی فیصلوں کی خدمت کرتی رہیں {cite:wikipedia-zij-en}۔'
  history:
    ar: من بغداد المأمونية إلى مراغة ⁦(1259)⁩ وسمرقند ⁦(القرن الخامس عشر)⁩ ورصد تقي
      الدين باستانبول ⁦(القرن السادس عشر)⁩ ظلّت الأزياج بنية العلم التحتية؛ وبقي الزيج
      السلطاني مرجعاً في العصر الحديث المبكر، وأنتجت الهند نحو مئة زيج أخرى {cite:wikipedia-zij-en}.
    en: From Ma'muni Baghdad to Maragha (1259), Samarkand (fifteenth century) and
      Taqi al-Din's Constantinople observatory (sixteenth century) the zij remained
      the discipline's infrastructure; the Zij-i Sultani stayed the early modern reference,
      and India produced nearly a hundred more zijes {cite:wikipedia-zij-en}.
    ur: مامون کے بغداد سے مراغہ ⁦(1259ء)⁩، سمرقند ⁦(پندرہویں صدی)⁩ اور تقی الدین کی
      قسطنطنیہ رصدگاہ ⁦(سولہویں صدی)⁩ تک زیج مضمون کی بنیادی ڈھانچہ رہی؛ زیجِ سلطانی
      ابتدائی جدید دور کا مرجع بنا اور ہندوستان نے سو کے قریب مزید زیجیں دیں {cite:wikipedia-zij-en}۔
  significance: 4
  why: The zij is the single most characteristic product of Islamic astronomy — a
    whole genre of computational literature with more than two hundred known examples,
    running eight centuries from Baghdad to Jaipur.
