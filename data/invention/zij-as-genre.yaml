today:
  form:
    ar: 'لم يعد الزيج وثيقة عمل — تحلّ البرامج محل الجداول — لكنه يبقى المادة الأساسية
      لتاريخ الفلك الإسلامي: تحفظ المخطوطات وتفكك قواعد بيانات مثل PARAMS قيمها {cite:wikipedia-zij-en}.'
    en: 'The zij is no longer a working document — software replaces the tables —
      but it remains the primary material for the history of Islamic astronomy: manuscripts
      are preserved and databases such as PARAMS dissect their parameters {cite:wikipedia-zij-en}.'
    ur: 'زیج اب عملی دستاویز نہیں رہی — سافٹ ویئر جدولوں کی جگہ لیتا ہے — مگر اسلامی
      فلکیات کی تاریخ کا بنیادی مواد ہے: مخطوطے محفوظ ہیں اور PARAMS جیسے ڈیٹابیس
      ان کی قدریں تجزیہ کرتے ہیں {cite:wikipedia-zij-en}۔'
  descendants:
    ar: 'خلفتها الأفميريدات والكواكب المحوسبة: جداول مطبوعة ثم برامج توليد، وكلها
      تؤدي وظيفة الزيج نفسها {cite:wikipedia-zij-en}.'
    en: Printed ephemerides and then planetary computation software carry on the zij's
      function {cite:wikipedia-zij-en}.
    ur: مطبوعہ ایفیمریڈیز اور پھر سیاروں کی حسابی سافٹ ویئر زیج کا کام آگے بڑھاتی
      ہیں {cite:wikipedia-zij-en}۔
