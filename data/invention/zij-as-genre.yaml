origin:
  polity: polity/abbasid-caliphate
  place: place/baghdad
  context:
    ar: 'نشأ الجنس في بغداد العباسية حين ترجمت نصوص الهند والفرس والإغريق: الجداول
      اليدوية لبطليموس ⁦(القانون)⁩ وزيج الشاه الساساني والسدهانت الهندي؛ وصنع الفلكيون
      الأوائل كالخوارزمي وحبش الحاسب أزياجاً عربية جمعت بين تلك التقاليد {cite:wikipedia-zij-en}
      {cite:kennedy-islamic-astronomical-tables-1956}.'
    en: 'The genre was born in Abbasid Baghdad as Indian, Sasanian and Greek material
      was translated: Ptolemy''s Handy Tables (al-Qanun), the Sasanian Zij-i Shah
      and the Indian siddhantas; early astronomers such as al-Khwarizmi and Habash
      al-Hasib composed Arabic zijes combining those traditions {cite:wikipedia-zij-en}
      {cite:kennedy-islamic-astronomical-tables-1956}.'
    ur: 'یہ صنف عباسی بغداد میں جنم لینے والی ہے جب ہندوستانی، ساسانی اور یونانی متون
      ترجمہ ہوئے: بطلموس کی ہینڈی ٹیبلز ⁦(القانون)⁩، ساسانی زیجِ شاہ اور بھارتی سدھانت؛
      ابتدائی ماہرین خوارزمی اور حبش حاسب نے ان روایات کے مجموعے سے عربی زیجیں بنائیں
      {cite:wikipedia-zij-en} {cite:kennedy-islamic-astronomical-tables-1956}۔'
