kids:
  ar: "قبل ستمائة سنة، أراد عالم اسمه أولوغ بك أن يعرف مواضع كل النجوم بدقة. بنى أعظم مرصد في سمرقند، وقاس هو وفريقه ألفاً وثمانية عشر نجماً — فصار جدولهم أدق ما صُنع في زمانهم، وبقي مرجعاً لمئتي سنة."
  en: "Six hundred years ago, a scholar named Ulugh Beg wanted to know every star's exact place. He built the greatest observatory at Samarqand, and with his team measured 1,018 stars — making the most accurate table of their age, and a reference for two hundred years."
