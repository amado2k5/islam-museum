summary:
  ar: "أنتج مرصد سمرقند بقيادة أولوغ بك وفريقه ⁦(الكاشي والرومي)⁩ زيجاً سلطانياً يضم جداول الكواكب وفهرساً لألف وثمانية عشر نجماً بمواضعها — أول فهرس نجمي إسلامي جديد منذ زيج الصوفي، وأدق جداول عصره، بقيت مرجعاً أوروبياً حتى قرنين."
  en: "Ulugh Beg's Samarqand observatory and his team (al-Kashi, al-Rumi) produced the Sultanic Zij with planetary tables and a catalogue of 1,018 stars with positions — the first new Islamic star catalogue since al-Sufi's zij, and the most accurate tables of their age, remaining a European reference for two centuries."
  ur: "الغ بیگ کی سمرقند رصد خانہ اور اس کی ٹیم ⁦(کاشی، رومی)⁩ نے سلطانی زنج پیش کیا جس میں سیاروں کے جدول اور1,018 ستاروں کی پوزیشنوں کا فہرست ہے — صوفی کے زنج کے بعد پہلا نیا اسلامی ستارہ فہرست، اور اپنے زمانے کے درست ترین جدول، جو دو صدیوں یورپی مرجع رہے۔"
