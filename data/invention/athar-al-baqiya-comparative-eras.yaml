impact:
  fields: [astronomy-instruments, mathematics]
  changed:
    ar: "وفّر مرجعًا واحدًا تشتمل فيه حسابات تواريخ الأمم وتقاويمها ومنازل قمرها، فيسهل استخراج تاريخ من آخر ومقارنة أعياد الأمم {cite:athar-baqiya-thaqafa-2008 pp. 407–409} {cite:athar-baqiya-thaqafa-2008 pp. 416–417}."
    en: "Provided one reference containing the era computations, calendars and lunar mansions of the nations, easing the conversion of one date into another and the comparison of their feasts {cite:athar-baqiya-thaqafa-2008 pp. 407–409} {cite:athar-baqiya-thaqafa-2008 pp. 416–417}."
    ur: "ایک ماخذ فراہم کیا جس میں اقوام کے تواریخ، تقاویم اور قمری منازل کا حساب تھا، جس سے ایک تاریخ کو دوسری میں بدلنا اور تہواروں کا تقابل آسان ہوا {cite:athar-baqiya-thaqafa-2008 pp. 407–409} {cite:athar-baqiya-thaqafa-2008 pp. 416–417}۔"
  history:
    ar: "يعدّ الكتاب أول مؤلف في بابه الجامع لتقاويم الأمم، وهو شهادة على العناية الإسلامية بعلوم الزمن قبل التقاويم الحديثة {cite:athar-baqiya-thaqafa-2008 p. 4} {cite:kashf-zunun-furqan p. 179}."
    en: "The book is counted the first comprehensive work of its kind gathering the nations' calendars, and a witness to Muslim attention to time sciences before modern calendrics {cite:athar-baqiya-thaqafa-2008 p. 4} {cite:kashf-zunun-furqan p. 179}."
    ur: "یہ کتاب اپنی نوعیت میں اقوام کے تقاویم جمع کرنے والی پہلی جامع تصنیف شمار ہوتی ہے، اور جدید قمریات سے پہلے مسلم توجۂ وقت کا شاہد {cite:athar-baqiya-thaqafa-2008 p. 4} {cite:kashf-zunun-furqan p. 179}۔"
  significance: 4
  why: "A substantial, well-documented comparative system whose occasion, structure and tables are attested in the edited text and classical bibliography; its dating rests on an age statement rather than an explicit year."
