origin:
  polity: polity/ziyarid-dynasty
  place: place/jurjan
  context:
    ar: "ألّف البيروني الكتاب في سياقه العلمي ببلاط قابوس ثم الغزنوي؛ يذكر نص التحقيق أن سببه سؤال أديب عن التقاويم التي تستعملها الأمم واختلاف مبادئها وشهورها وسنيها وأعيادها {cite:athar-baqiya-thaqafa-2008 pp. 4–6} {cite:tdv-biruni-tumer biography}."
    en: "Al-Biruni composed the book within his scholarly setting at Qabus's court and later Ghazna; the edition's text reports that its occasion was a littérateur's question about the calendars nations used and their divergent epochs, months, years and feasts {cite:athar-baqiya-thaqafa-2008 pp. 4–6} {cite:tdv-biruni-tumer biography}."
    ur: "بیرونی نے یہ کتاب قابوس کے دربار اور پھر غزنوی سیاق میں لکھی؛ ایڈیشن کا متن بتاتا ہے کہ اس کا سبب ایک ادیب کا وہ سوال تھا کہ اقوام کن تقاویم اور کن مختلف آغاز، ماہ، سال اور تہواروں کو استعمال کرتی ہیں {cite:athar-baqiya-thaqafa-2008 pp. 4–6} {cite:tdv-biruni-tumer biography}۔"
