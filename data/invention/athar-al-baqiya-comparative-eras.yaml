summary:
  ar: "منهج بيبليوغرافي-فلكي جمع فيه البيروني في «الآثار الباقية» حسابات تواريخ الأمم وتقاويمها وأعيادها ومنازل قمرها في إطار واحد قابل للمقارنة، جوابًا عن سؤال أديب عن تباين التقويمات {cite:athar-baqiya-thaqafa-2008 pp. 4–6} {cite:tdv-biruni-tumer works}."
  en: "A bibliographical-astronomical method in which al-Biruni's Athar al-Baqiya gathers the era computations, calendars, festivals and lunar mansions of the nations into one comparable frame, answering a littérateur's question about divergent calendars {cite:athar-baqiya-thaqafa-2008 pp. 4–6} {cite:tdv-biruni-tumer works}."
  ur: "ایک ببلیوگرافی-فلکیاتی طریقہ جس میں بیرونی کی «الآثار الباقیہ» اقوام کے تاریخ، تقویم، تہوار اور قمری منازل کا حساب ایک قابلِ تقابل ڈھانچے میں جمع کرتی ہے، ایک ادیب کے سوال کے جواب میں {cite:athar-baqiya-thaqafa-2008 pp. 4–6} {cite:tdv-biruni-tumer works}۔"
  es: "Un método bibliográfico-astronómico en el que el Athar al-Baqiya de al-Biruni reúne los cálculos de eras, calendarios, festivales y mansiones lunares de las naciones en un marco comparable, respondiendo a la pregunta de un escritor sobre calendarios divergentes. 4–6} {cite: tdv-biruni-tumer works}."
  fr: "Une méthode bibliographique et astronomique dans laquelle l'Athar al-Baqiya d'al-Biruni rassemble les calculs des ères, les calendriers, les fêtes et les demeures lunaires des nations dans un cadre comparable, répondant à la question d'un auteur sur les calendriers divergents. 4–6} {cite: tdv-biruni-tumer works}."
