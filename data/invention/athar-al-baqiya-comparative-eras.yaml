attribution:
  status: improvement
  claim:
    ar: "جمع منهجي لتقاويم الأمم في مرجع واحد، لا اختراع التقويم أو أول مقارنة تاريخية بين الأمم."
    en: "A systematic gathering of the nations' calendars into one reference, not the invention of the calendar or of the first cross-cultural comparison."
    ur: "اقوام کے تقاویم کا ایک ماخذ میں منظم جمع، نہ تقویم کی ایجاد اور نہ اقوام کے درمیان پہلی تقابلی تاریخ نگاری۔"
  basis:
    ar: "يصف الكتاب نفسه أنه جواب عن سؤال في تباين التقاويم، ويورد معلومات سابقة عن التواريخ؛ لا يدّعي المتن أن لا أحد سبقه إلى أي معرفة تقويمية {cite:athar-baqiya-thaqafa-2008 pp. 4–6} {cite:kashf-zunun-furqan p. 179}."
    en: "The book presents itself as an answer to a question about divergent calendars and reports earlier calendrical knowledge; the text claims no absolute priority in any calendrical fact {cite:athar-baqiya-thaqafa-2008 pp. 4–6} {cite:kashf-zunun-furqan p. 179}."
    ur: "کتاب خود کو مختلف تقاویم کے سوال کا جواب بتاتی ہے اور سابق قمری معلومات نقل کرتی ہے؛ متن کسی قمری حقیقت میں مطلق سبقت کا دعویٰ نہیں کرتا {cite:athar-baqiya-thaqafa-2008 pp. 4–6} {cite:kashf-zunun-furqan p. 179}۔"
  perspectives: []
