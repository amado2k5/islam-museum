    status: historical
    note: 'Earliest dated written attestation read: al-Muqaddasi''s Ahsan al-Taqasim
      (composed c. 375/985) names windmills at Sistan and Bushanj. The mills themselves
      are older than the text by an unknown span; scholarship places clear evidence
      of vertical-axle mills in Sistan in the ninth century.'
    sources:
    - source/muqaddasi-ahsan-taqasim-bga-1877
    - source/wikipedia-windmill-en
  status_today: living
origin:
  polity: polity/saffarid-dynasty
  context:
    ar: سهول سجستان وبوشنج ⁦(خراسان الشرقية)⁩ حيث هبوب ريح المئة والعشرين يوماً في
      الصيف وشحّ المياه الجارية جعلا الريح بديلاً للماء في إدارة الرحى {cite:encyclopaedia-of-islam-2
      vol. X, art. TAHUN}.
    en: The plains of Sistan and Bushanj in eastern Khurasan, where the seasonal 'wind
      of a hundred and twenty days' blows hard all summer and running water is scarce,
      made wind a substitute for water in driving millstones {cite:encyclopaedia-of-islam-2
      vol. X, art. TAHUN}.
    ur: سجستان اور بوشنج ⁦(مشرقی خراسان)⁩ کی سطح مرتفع جہاں «ایک سو بیس دن کی ہوا»
      گرمیوں میں مسلسل چلتی ہے اور بہتا پانی کمیاب ہے؛ اسی لیے پانی کی جگہ ہوا نے
      چکی چلائی {cite:encyclopaedia-of-islam-2 vol. X, art. TAHUN}.
makers:
- person: person/al-muqaddasi
  role: describer
  note: His Ahsan al-Taqasim (BGA III, printed p. 343) lists 'windmills at Sistan
    and Bushanj' among the wonders of Khurasan — the earliest written attestation
    read for this record; the millwrights themselves are anonymous.
  sources:
  - source/muqaddasi-ahsan-taqasim-bga-1877
attribution:
  status: contested
  claim:
    ar: 'أقدم موثق مكتوب لطواحين هواء عاملة هو إسلامي: نص المقدسي في القرن الرابع/العاشر
      يثبت الآلة في سجستان قبل ظهور الطاحونة الهوائية الأوروبية ⁦(1185م)⁩ بنحو قرنين؛
      النوع القائم المحور ابتكار شرقي موثق {cite:muqaddasi-ahsan-taqasim-bga-1877}
      {cite:wikipedia-windmill-en}.'
    en: 'The earliest written attestation of working windmills is Islamic: al-Muqaddasi''s
      fourth/tenth-century text fixes the machine in Sistan some two centuries before
      the first European windmill record (1185); the vertical-axis type is a documented
      eastern invention {cite:muqaddasi-ahsan-taqasim-bga-1877} {cite:wikipedia-windmill-en}.'
    ur: 'چلتی ہوائی چکیوں کی قدیم ترین تحریری گواہی اسلامی ہے: مقدسی کا چوتھی/دسویں
      صدی کا متن سجستان میں یہ آلہ یورپ کی پہلی ہوائی چکی ⁦(1185ء)⁩ سے دو صدیاں پہلے
      ثابت کرتا ہے؛ عمودی محور کی قسم ایک موثق مشرقی ایجاد ہے {cite:muqaddasi-ahsan-taqasim-bga-1877}
      {cite:wikipedia-windmill-en}.'
  basis:
    ar: نص عربي معاصر ⁦(المقدسي، BGA III ص 343)⁩ يذكر الطواحين بالاسم؛ EI2 ⁦(مادة
      TAHUN)⁩ تضع أول استعمال لطواحين الريح في فارس الإسلامية؛ والخلاصة الأكاديمية
      ⁦(عبر مقالة ويكيبيديا المسجلة، نقلاً عن الحسن وهيل ولوهرمان)⁩ تؤرخ الدليل الواضح
      للمحور القائم في القرن التاسع {cite:encyclopaedia-of-islam-2} {cite:wikipedia-windmill-en}.
    en: A contemporary Arabic text (al-Muqaddasi, BGA III p. 343) names the mills
      outright; EI2 (article TAHUN) places the first use of wind-powered mills in
      Islamic Persia; and the academic summary (per the recorded Wikipedia article,
      citing Hassan & Hill and Lohrmann) dates the clear evidence for the vertical-axle
      type to the ninth century {cite:encyclopaedia-of-islam-2} {cite:wikipedia-windmill-en}.
    ur: عصری عربی متن ⁦(مقدسی، BGA III ص 343)⁩ چکیوں کا نام لیتا ہے؛ EI2 ⁦(مضمون TAHUN)⁩
      ہوائی چکیوں کا پہلا استعمال اسلامی فارس میں رکھتی ہے؛ اور علمی خلاصہ ⁦(درج شدہ
      ویکیپیڈیا مضمون، حسن و ہل اور لوہرمان کے حوالے)⁩ عمودی محور کی واضح گواہی نویں
      صدی میں قرار دیتا ہے {cite:encyclopaedia-of-islam-2} {cite:wikipedia-windmill-en}.
  perspectives:
  - tradition: sunni
    stance:
      ar: عجيبة من عجائب الإقليم
      en: A wonder of the clime
      ur: اقلیم کی ایک عجائبہ
    summary:
      ar: عجيبة من عجائب الإقليم — الجغرافي المسلم نفسه عدّ الطواحين من طرائف خراسان
        التي تستحق الذكر لا من المحرمات؛ فالصنعة داخلة في اقتصاد القرى وسقيها وطحنها
        {cite:muqaddasi-ahsan-taqasim-bga-1877}.
      en: The Muslim geographer himself counts the mills among the curiosities of
        Khurasan worth recording, not among things condemned; the craft belonged to
        the village economy of milling and irrigation {cite:muqaddasi-ahsan-taqasim-bga-1877}.
      ur: مسلم جغرافیہ دان خود ان چکیوں کو خراسان کی قابلِ ذکر ندرات میں گنتا ہے،
        ممنوعات میں نہیں؛ یہ دستکاری دیہاتی معیشت — پیسائی اور آبپاشی — کا حصہ تھی
        {cite:muqaddasi-ahsan-taqasim-bga-1877}.
    sources:
    - source/muqaddasi-ahsan-taqasim-bga-1877
  - tradition: academic
    stance:
      ar: منشأ شرقي ثم انتقال غربي
      en: Eastern origin, then westward spread
      ur: مشرقی ابتدا، پھر مغرب کی طرف پھیلاؤ
    summary:
      ar: منشأ شرقي ثم انتقال غربي — التلخيص الأكاديمي ⁦(عبر مقالة ويكيبيديا المسجلة)⁩
        يقرّ بأولوية القرن التاسع السجستاني وبانتقال الفكرة إلى أوروبا حيث ظهرت طاحونة
        عمودية الأشرعة أفقية المحور بعد 1185؛ كما يسجل الأسطورة اللاحقة ⁦(أبو لؤلؤة
        وعمر)⁩ أسطورةً لا وثيقة {cite:wikipedia-windmill-en}.
      en: The academic summary (per the recorded Wikipedia article) grants the ninth-century
        Sistanian type priority and traces the idea westward, where the horizontal-axis
        mill appears after 1185; it also records the later Abu Lu'lu'a legend as legend,
        not document {cite:wikipedia-windmill-en}.
      ur: مشرقی ابتدا، پھر مغرب کی طرف پھیلاؤ — علمی خلاصہ ⁦(درج شدہ ویکیپیڈیا مضمون)⁩
        نویں صدی کی سجستانی قسم کی اولیت مانتا اور خیال کو مغرب منتقل کرتا ہے جہاں
        افقی محور والی چکی 1185ء کے بعد ظاہر ہوتی ہے؛ ساتھ ہی بعد کی ابو لؤلؤہ روداد
        کو افسانہ قرار دیتا ہے نہ کہ دستاویز {cite:wikipedia-windmill-en}.
    sources:
    - source/wikipedia-windmill-en
precursors:
- external:
    ar: الطاحونة المائية الأفقية
    en: The horizontal watermill
    ur: افقی پانی چکی
  note: The vertical-axis mill's layout — sails driving a shaft directly above the
    millstones — is the water-wheel arrangement turned over to wind, in a land with
    strong winds and weak streams.
  sources:
  - source/encyclopaedia-of-islam-2
dependents:
- external:
    ar: الطاحونة الهوائية الأوروبية ⁦(بعد 1185)⁩
    en: The European windmill (after 1185)
    ur: یورپی ہوائی چکی ⁦(1185ء کے بعد)⁩
  note: First certain European record at Weedley, Yorkshire, 1185; whether the idea
    travelled from the Islamic east is 'unclear' per the literature, and this record
    makes no transmission claim.
  sources:
  - source/wikipedia-windmill-en
- external:
    ar: أسباد نشتیفان الباقية
    en: The surviving asbads of Nashtifan
    ur: نشتیفان کی بچی ہوئی اسبادیں
  note: Vertical-axis mills of the same family still worked at Nashtifan in Iranian
    Khorasan into the modern era — a living descendant of the Sistan type.
  sources:
  - source/wikipedia-windmill-en
