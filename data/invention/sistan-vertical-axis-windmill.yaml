  changed:
    ar: 'حرّر الطحن من النهر: حيث لا ماء جارٍ قوي، طُحنت الحبوب وضُخت المياه بقوة
      الريح الموسمية في واحدة من أقدم تسخيرات الطاقة غير الحيوانية {cite:encyclopaedia-of-islam-2}.'
    en: 'It freed milling from the river: where no strong stream ran, grain was ground
      and water lifted by the seasonal wind — one of the earliest harnessings of non-animal
      power {cite:encyclopaedia-of-islam-2}.'
    ur: 'پیسائی کو دریا سے آزاد کیا: جہاں مضبوط بہتا پانی نہ تھا، موسمی ہوا سے اناج
      پیسا اور پانی کھینچا گیا — غیر حیوانی توانائی کی قدیم ترین استعمالوں میں سے
      ایک {cite:encyclopaedia-of-islam-2}.'
  history:
    ar: أول آلة إسلامية موثقة تستمد طاقتها من الريح على نطاق اقتصادي؛ تؤرخ لحضارة
      هندسية حلّت مشكلة طاقة إقليمية بحل هندسي محلي {cite:muqaddasi-ahsan-taqasim-bga-1877}.
    en: The first documented Islamic machine to draw its power from wind at economic
      scale; it dates an engineering civilisation that solved a regional energy problem
      with a local engineering answer {cite:muqaddasi-ahsan-taqasim-bga-1877}.
    ur: پہلی موثق اسلامی مشین جو معاشی پیمانے پر ہوا سے توانائی لیتی ہے؛ یہ اس انجینئری
      تہذیب کی گواہی ہے جس نے علاقائی توانائی کے مسئلے کا مقامی انجینئری جواب دیا
      {cite:muqaddasi-ahsan-taqasim-bga-1877}.
  significance: 4
  why: The earliest attested working windmills in any literature, sited by a contemporary
    geographer in the wind corridor of Sistan.
