kids:
  ar: 'في بلاد اسمها سجستان تهب ريح قوية طوال الصيف، لكن الأنهار ضعيفة لا تدير الطواحين.
    فبنى الناس هناك طواحين تدور بالهواء لا بالماء: جدران توجّه الريح إلى أشرعة كبيرة
    فتدير حجر الطحن. ذكرها الرحالة المقدسي قبل أكثر من ألف سنة وقال إنها من عجائب
    بلاده.'
  en: 'In a land called Sistan a strong wind blows all summer, but the rivers are
    too weak to turn mills. So people there built mills turned by air, not water:
    walls that funnel the wind onto big sails that spin the grinding stone. The traveller
    al-Muqaddasi wrote about them over a thousand years ago as one of the wonders
    of his country.'
  ur: 'سجستان نامی سرزمین میں ساری گرمی تیز ہوا چلتی ہے مگر دریا اتنے کمزور ہیں کہ
    چکی نہیں چلا سکتے۔ وہاں کے لوگوں نے پانی کے بجائے ہوا سے چلنے والی چکیاں بنائیں:
    دیواریں ہوا کو بڑے پرّوں تک پہنچاتیں جو پیسنے کا پتھر گھماتیں۔ مسافر مقدسی نے
    ہزار سال پہلے ان کا ذکر اپنی سرزمین کی عجائبات میں کیا۔'
