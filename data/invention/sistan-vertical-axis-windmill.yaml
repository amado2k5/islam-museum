today:
  form:
    ar: بقيت طواحين قائمة المحور تعمل في شرق إيران ⁦(نشتیفان)⁩ حتى العصر الحديث، وصارت
      «باني مون» مادة أساسية في كتب تاريخ طاقة الريح {cite:wikipedia-windmill-en}.
    en: Vertical-axis mills kept working in eastern Iran (Nashtifan) into the modern
      era, and the 'panemone' became a fixture of wind-energy histories {cite:wikipedia-windmill-en}.
    ur: عمودی محور کی چکیاں مشرقی ایران ⁦(نشتیفان)⁩ میں جدید دور تک چلتی رہیں اور
      «پانی مون» تاریخِ توانائیِ ہوا کی کتب کا مستقل باب بن گئیں {cite:wikipedia-windmill-en}.
  descendants:
    ar: توربينات الرياح العمودية المحور الحديثة ⁦(دارو)⁩ تعيد اختراع المبدأ بأجنحة
      رفع لا سحب {cite:wikipedia-windmill-en}.
    en: Modern vertical-axis wind turbines (Darrieus type) reinvent the principle
      with lift rather than drag blades {cite:wikipedia-windmill-en}.
    ur: جدید عمودی محور کے ہوا ٹربائن ⁦(ڈاریوس قسم)⁩ اصول کو سحب کے بجائے اٹھان والے
      پرّوں سے دوبارہ ایجاد کرتے ہیں {cite:wikipedia-windmill-en}.
