summary:
  ar: 'ذكر المقدسي ⁦(نحو 375/985)⁩ «طواحين الريح بسجستان وبوشنج» في عداد عجائب خراسان:
    رِحى تديرها الريح على محور قائم تحجزه جدران مثقوبة توجّه رياح الصيف إلى الأشرعة؛
    وتؤكد EI2 أن الطواحين البخارية ظهرت أولاً في فارس الإسلامية حيث شحّ الماء {cite:muqaddasi-ahsan-taqasim-bga-1877
    p. 343} {cite:encyclopaedia-of-islam-2 vol. X, art. TAHUN}.'
  en: 'Al-Muqaddasi (c. 375/985) lists ''windmills at Sistan and Bushanj'' among the
    wonders of Khurasan: querns turned by the wind on a vertical shaft, the wind funnelled
    to the sails through wall slots; EI2 confirms that wind-powered mills first appeared
    in Islamic Persia where water was scarce {cite:muqaddasi-ahsan-taqasim-bga-1877
    p. 343} {cite:encyclopaedia-of-islam-2 vol. X, art. TAHUN}.'
  ur: 'مقدسی ⁦(تقریباً 375/985)⁩ خراسان کی عجائبات میں «سجستان اور بوشنج کی ہوائی
    چکیاں» گنتا ہے: ہوا سے چلنے والی چکیاں عمودی محور پر، دیواروں کی دراڑوں سے ہوا
    پرّوں تک پہنچتی؛ EI2 تصدیق کرتی ہے کہ ہوائی چکیاں سب سے پہلے اسلامی فارس میں برآمد
    ہوئیں جہاں پانی کمیاب تھا {cite:muqaddasi-ahsan-taqasim-bga-1877 p. 343} {cite:encyclopaedia-of-islam-2
    vol. X, art. TAHUN}.'
  es: "Al-Muqaddasi (c. 375/985) enumera los \"molinos de viento de Sistán y Bushanj\" entre las maravillas de Jorasán: molinos girados por el viento en un eje vertical, el viento canalizado a las aspas a través de ranuras en la pared; EI2 confirma que los molinos impulsados por el viento aparecieron por primera vez en la Persia islámica donde el agua era escasa {cite:muqaddasi-ahsan-taqasim-bga-1877 p. 343} {cite:encyclopaedia-of-islam-2 vol. X, art. TAHUN}."
