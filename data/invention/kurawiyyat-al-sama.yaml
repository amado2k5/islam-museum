today:
  form:
    ar: "ما زال الدرس الأول في أي مدخل إلى الفلك: السماء كرة، والكواكب على دوائر متوازية حول القطبين."
    en: "Still the first lesson in any introduction to astronomy: the heavens are a sphere, and the stars run on parallel circles around the poles."
    ur: "آج بھی فلکیات کے کسی بھی تعارف کا پہلا سبق: آسمان ایک گولہ ہے اور ستارے قطبوں کے گرد متوازی دائروں پر چلتے ہیں۔"
  descendants:
    ar: "من هذا المبدأ خرجت صناعة الأسطرلاب والكرة السماوية والخرائط النجمية التي تُظهر الكواكب في كرتها السماوية."
    en: "From this principle grew the craft of the astrolabe, the celestial globe and star charts that plot the planets on the celestial sphere."
    ur: "اسی اصول سے اسطرلاب، آسمانی گولے اور ستاروں کے نقشوں کی صنعت نکلی جو سیاروں کو آسمانی گولے پر دکھاتے ہیں۔"
