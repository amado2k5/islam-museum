kids:
  ar: "قبل أكثر من ألف سنة، قال العلماء المسلمون — مثل الفرغاني — إن السماء ليست سقفاً مسطحاً بل كرة ضخمة تدور على قطبها، مثل الأرض لكنها أكبر بكثير. رأوا ذلك بأنفسهم: النجوم القريبة من القطب تدور في دوائر صغيرة، والبعيدة في دوائر كبيرة، تماماً كما تدور خطوط العرض على الأرض."
  en: "More than a thousand years ago, Muslim scholars like al-Farghani said the sky is not a flat roof but a huge sphere turning on its pole — like the Earth but far bigger. They saw it with their own eyes: stars near the pole circle in small rings, far ones in big rings, just as lines of latitude circle the Earth."
  ur: "ایک ہزار سال سے زیادہ پہلے مسلم علماء نے — جیسے الفرغانی نے — کہا کہ آسمان ایک چپٹی چھت نہیں بلکہ ایک بڑا گولہ ہے جو اپنے قطب پر گھومتا ہے — زمین جیسا مگر کہیں بڑا۔ انہوں نے اپنے آنکھوں سے دیکھا: قطب کے قریب کے ستارے چھوٹے دائروں میں گھومتے ہیں، دور کے بڑے دائروں میں — بالکل جیسے زمین پر عرض البلد کے حلقے۔"
