  status_today: living
origin:
  place: place/baghdad
  polity: polity/abbasid-caliphate
  context:
    ar: "قدّم الفرغاني شرح السماء الكروية في بابه الثاني من «الجوامع في علم النجوم»، في المنهج الفلكي الذي درسه طلبة بغداد وبيت الحكمة في القرن الثالث الهجري {cite:farghani-elements-astronomy pp. 125–126} {cite:tdv-ilm-i-felek}."
    en: "Al-Farghani presented the spherical-heavens doctrine in the second chapter of his 'Elements', within the astronomical curriculum studied in Baghdad and the House of Wisdom in the third century AH {cite:farghani-elements-astronomy pp. 125–126} {cite:tdv-ilm-i-felek}."
    ur: "الفرغانی نے اپنی «الجوامع في علم النجوم» کے دوسرے باب میں آسمان کی گولائی کا بیان پیش کیا، تیسری صدی ہجری کے فلکیاتی نصاب کے مطابق جو بغداد اور بیت الحکمت میں پڑھایا جاتا تھا {cite:farghani-elements-astronomy pp. 125–126} {cite:tdv-ilm-i-felek}۔"
makers:
  - person: person/al-farghani
    role: describer
    place: place/baghdad
    note: "Al-Farghani sets out the spherical-heavens doctrine with its observational proofs in chapter two of his treatise; he systematised a received ancient doctrine rather than discovering it {cite:farghani-elements-astronomy pp. 125–126} {cite:tdv-ilm-i-felek}."
    sources: [source/farghani-elements-astronomy, source/tdv-ilm-i-felek]
attribution:
  status: transmission
  claim:
    ar: "الكروية ليست اختراعاً إسلامياً ولا اكتشافاً فرغانياً؛ كانت مبدأ متوارثاً من فلكيي الأمم القديمة، وأعاد الفرغاني صياغتها بالعربية في المنهج العباسي."
    en: "Sphericity was neither an Islamic invention nor al-Farghani's discovery; it was inherited doctrine from the astronomers of the ancient nations, restated in Arabic by al-Farghani in the Abbasid curriculum."
    ur: "گولائی نہ تو اسلامی ایجاد تھی اور نہ الفرغانی کی دریافت؛ یہ قدیم اقوام کے فلکیات دانوں سے وراثت میں ملی تھی، اور الفرغانی نے اسے عباسی نصاب میں عربی میں بیان کیا۔"
  basis:
    ar: "يقول الفرغاني إن السماء كرة تدور على قطبها الشمالي والجنوبي، ويسند ذلك بترتيب طلوع الكواكب ودوائر القطبيين المتوازية {cite:farghani-elements-astronomy pp. 125–126}. وتصف مادة TDV «علم الفلك» الكروية كمبدأ قديم استقر في المنهج الإسلامي قبل العصر الفرغاني {cite:tdv-ilm-i-felek}."
    en: "Al-Farghani states the heavens are a sphere rotating on its northern and southern poles, supporting this by the ordered risings of the stars and the parallel polar circles {cite:farghani-elements-astronomy pp. 125–126}. The TDV 'ilm al-falak article presents sphericity as an ancient principle settled in the Islamic curriculum before al-Farghani's age {cite:tdv-ilm-i-felek}."
    ur: "الفرغانی لکھتا ہے کہ آسمان ایک گولہ ہے جو اپنے شمالی و جنوبی قطبوں پر گھومتی ہے، اور اسے ستاروں کے باقاعدہ طلوع اور متوازی قطبی دائروں سے ثابت کرتا ہے {cite:farghani-elements-astronomy pp. 125–126}۔ TDV کا «علم الفلک» مضمون گولائی کو ایک قدیم اصول بتاتا ہے جو الفرغانی کے دور سے پہلے ہی اسلامی نصاب میں مستقر تھا {cite:tdv-ilm-i-felek}۔"
precursors:
  - external: { ar: "فلك بطلميوس — المجسطي", en: "Ptolemy's astronomy — the Almagest", ur: "بطلمیوس کی فلکیات — مجسطی" }
    note: "The spherical-heavens model with eccentric and epicyclic motions was standard in the Ptolemaic tradition transmitted into Arabic {cite:farghani-elements-astronomy p. 193} {cite:tdv-ilm-i-felek}."
    sources: [source/farghani-elements-astronomy, source/tdv-ilm-i-felek]
  - external: { ar: "فلك اليونان والهند قبل الإسلام", en: "Greek and Indian astronomy before Islam", ur: "قبل از اسلام یونانی اور ہندی فلکیات" }
    note: "Spherical heavens with rotating poles appears in pre-Islamic Greek and Indian sources that fed the Arabic tradition {cite:tdv-ilm-i-felek} {cite:farghani-elements-astronomy pp. 125–126}."
    sources: [source/tdv-ilm-i-felek, source/farghani-elements-astronomy]
dependents:
  - external: { ar: "صناعة الأسطرلاب والكرة السماوية", en: "The astrolabe and celestial-globe craft", ur: "اسطرلاب اور آسمانی گولے کی صنعت" }
    note: "Spherical geometry underwrote the astrolabe and celestial globe; a surviving 1144 Iranian celestial globe carries 1025 star markers on a sphere {cite:commons-louvre-celestial-globe}."
    sources: [source/commons-louvre-celestial-globe]
  - external: { ar: "بحوث فلكية مصححة في بيت الحكمة وما بعدها", en: "Corrected astronomical research in the House of Wisdom and after", ur: "بیت الحکمت اور اس کے بعد کی تصحیح شدہ فلکیاتی تحقیق" }
    note: "The spherical framework supported later planetary theory, including the epicycle explanation of retrogression al-Farghani himself sets out {cite:farghani-elements-astronomy pp. 193–195}."
    sources: [source/farghani-elements-astronomy]
spread: []
impact:
  fields: [astronomy-instruments, mathematics]
  changed:
    ar: "ثبّت الإطار الهندسي الذي بُنيت عليه كل أدوات الرصد والحساب الفلكي: الأسطرلاب والكرة السماوية وجداول السير."
    en: "It fixed the geometric frame on which all instruments of observation and computation were built: the astrolabe, the celestial globe and the tables of motions."
    ur: "اس نے وہی ہندسی ڈھانچہ ثابت کیا جس پر تمام رصدی اور حسابی اوزار بنے: اسطرلاب، آسمانی گولہ اور حرکت کی جداول۔"
  history:
    ar: "ظل مبدأ الكروية قاعدة منهج الفلك في المدارس الإسلامية حتى جاءت التلسكوبات الحديثة؛ ويحفظ اليوم كتاب الفرغاني الفصل الثاني شاهداً على صياغته العربية."
    en: "The spherical-heavens principle remained the rule of the Islamic astronomical curriculum until modern telescopes; al-Farghani's second chapter survives as the Arabic statement of that frame."
    ur: "گولائی کا اصول جدید دوربینوں تک اسلامی فلکیاتی نصاب کا قاعدہ رہا؛ الفرغانی کا دوسرا باب اس ڈھانچے کے عربی بیان کے طور پر بچا ہوا ہے۔"
  significance: 4
  why: "A transmitted doctrine, but the foundational geometry of Islamic astronomy and instrument-making; al-Farghani's clear Arabic exposition made it the standard teaching form for centuries."
