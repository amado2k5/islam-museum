id: invention/kurawiyyat-al-sama
class: invention
label: { ar: "كروية السماء", en: "The sphericity of the heavens", ur: "آسمان کی گولائی" }
names:
  - { value: "kuruwwiyyat al-samāʾ", kind: alternate, lang: ar }
  - { value: "spherical heavens", kind: alternate, lang: en }
  - { value: "kurawiyyat", kind: alternate, lang: ar }
summary:
  ar: "مبدأ فلكي يقول إن السماء كرة تدور على قطبها، كانت حقيقة مسلَّمة بين فلكيي الأمم القديمة، وصاغها الفرغاني في فصله الثاني من كتابه بدليل طلوع الكواكب وهبوطها ودوران أقربها إلى القطب في دوائر متوازية أصغر {cite:farghani-elements-astronomy pp. 125–126} {cite:tdv-ilm-i-felek}."
  en: "An astronomical doctrine holding that the heavens are a sphere rotating on its pole, a settled truth among the ancient astronomers of all nations, set out by al-Farghani in the second chapter of his book through the evidence of the stars' rising, culminating and setting, and the smaller parallel circles of the stars nearest the pole {cite:farghani-elements-astronomy pp. 125–126} {cite:tdv-ilm-i-felek}."
  ur: "ایک فلکیاتی اصول جس کے مطابق آسمان ایک گولہ ہے جو اپنے قطب پر گھومتی ہے؛ یہ قدیم اقوام کے فلکیات دانوں میں متفق حقیقت تھی، اور الفرغانی نے اسے اپنی کتاب کے دوسرے باب میں ستاروں کے طلوع و وسط و غروب اور قطب کے قریب کے ستاروں کے چھوٹے متوازی دائروں کے ثبوت سے بیان کیا {cite:farghani-elements-astronomy pp. 125–126} {cite:tdv-ilm-i-felek}۔"
