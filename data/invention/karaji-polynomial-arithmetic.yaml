    ur: "جبری عبارتوں کو اعداد کی طرح منظم عملیات کا موضوع بنایا، عمومی تقسیم یا ہر درجے کے حل کے بغیر {cite:karaji-mactutor Biography}۔"
  history:
    ar: "حلقة في انتقال مركز الثقل إلى حساب المقادير، تلقاها السموأل؛ ليست سلسلة مثبتة إلى كل جبر مدرسي أو برنامج حديث {cite:karaji-mactutor Biography}."
    en: "A step toward arithmetic of expressions, received by al-Samawal; not a demonstrated direct chain to every school method or modern program {cite:karaji-mactutor Biography}."
    ur: "عبارتوں کے حساب کی سمت ایک قدم جس سے سموأل نے استفادہ کیا؛ ہر درسی طریقے یا جدید پروگرام تک ثابت براہ راست سلسلہ نہیں {cite:karaji-mactutor Biography}۔"
  significance: 4
  why: "A substantial development of algebraic operations, distinguished from the earlier discipline, modern symbolism and stronger priority claims."
