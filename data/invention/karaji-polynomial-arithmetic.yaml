kids:
  ar: "إذا ضربت مجموعاً في مجموع، فلكل جزء نصيبه من الضرب، ثم تجمع الأجزاء المتشابهة. الرموز هنا حديثة؛ الفكرة التاريخية هي تنظيم الحساب على مقادير لا نعرف قيمتها بعد."
  en: "When multiplying one sum by another, every part must meet every part; then collect matching kinds. Our symbols are modern: the historical idea is organized arithmetic on quantities not yet known."
