id: invention/karaji-polynomial-arithmetic
class: invention
label: { ar: "حساب القوى والمقادير المركبة عند الكرجي", en: "Al-Karaji's polynomial arithmetic", ur: "الکرجی کا کثیر رکنی حساب" }
names:
  - { value: "arithmetization of algebra", kind: alternate, lang: en }
summary:
  ar: "تحسين في الجبر ببغداد أوائل القرن الحادي عشر: إجراء عمليات حسابية على القوى والمقادير المركبة، مع حدود في القسمة والجذور واستمرار براهين هندسية، لا اختراع الرموز الحديثة {cite:karaji-mactutor Biography} {cite:tdv-kereci pp. 277–278}."
  en: "Early-eleventh-century Baghdad algebraic improvement: arithmetic on powers and composite expressions, with limits on division and roots and retained geometrical proofs; not invention of modern notation {cite:karaji-mactutor Biography} {cite:tdv-kereci pp. 277–278}."
  ur: "گیارہویں صدی کے ابتدائی بغداد میں جبری بہتری: قوتوں اور مرکب عبارتوں پر حساب، تقسیم اور جذر کی حدود اور باقی ہندسی ثبوتوں کے ساتھ؛ جدید رموز کی ایجاد نہیں {cite:karaji-mactutor Biography} {cite:tdv-kereci pp. 277–278}۔"
