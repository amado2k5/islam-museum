impact:
  fields: [mathematics]
  changed:
    ar: "جعل المقادير الجبرية مجالاً لعمليات منظمة على غرار الأعداد، دون قسمة عامة أو حل جميع الدرجات {cite:karaji-mactutor Biography}."
