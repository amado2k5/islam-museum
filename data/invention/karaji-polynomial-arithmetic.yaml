origin:
  place: place/baghdad
  context:
    ar: "ألّف أهم أعماله الرياضية ببغداد؛ تربط TDV الفخري برعاية فخر الملك في العصر البويهي، ضمن العالم العباسي، لا بإثبات مذهب المؤلف {cite:tdv-kereci pp. 277–278} {cite:karaji-mactutor Biography}."
    en: "Principal mathematical works written in Baghdad; TDV identifies Fakhr al-Mulk's Buyid-era patronage within the Abbasid world, not the author's personal sect {cite:tdv-kereci pp. 277–278} {cite:karaji-mactutor Biography}."
    ur: "اہم ریاضیاتی کام بغداد میں؛ ٹی ڈی وی عباسی دنیا کے بویہی دور میں فخر الملک کی سرپرستی بتاتا ہے، مصنف کا ذاتی مسلک نہیں {cite:tdv-kereci pp. 277–278} {cite:karaji-mactutor Biography}۔"
makers:
  - person: person/al-karaji
    role: improver
    place: place/baghdad
    note: "Arithmetic treatment of powers and composite algebraic quantities. Explicit named Muslim basis: Ataie-Ashtiani/Simmons p762; Sunni is the separately labelled museum default, not personal school attestation or an inference from Buyid patronage."
    sources: [source/karaji-mactutor, source/tdv-kereci, source/karaji-ataie-simmons-2020]
attribution:
  status: improvement
  claim:
    ar: "توسيع أدوات الحساب للعمل على المجهولات والقوى والمقادير المركبة في تقليد سابق، لا تأسيس كل الجبر أو اكتمال نظريته الحديثة."
    en: "Extended arithmetic tools to unknowns, powers and composite expressions within earlier algebra, not creation of all algebra or its complete modern theory."
    ur: "پہلے الجبرا میں نامعلوم، قوتوں اور مرکب عبارتوں پر حسابی اوزار کا پھیلاؤ؛ پورے الجبرا یا مکمل جدید نظریے کی ایجاد نہیں۔"
  basis:
    ar: "تعرض ماكتوتر جمع المقادير المركبة وطرحها وضربها، مع قسمة أضيق واستخراج جذور مقيد؛ وتؤكد TDV بقاء البرهان الهندسي {cite:karaji-mactutor Biography} {cite:tdv-kereci pp. 277–278}."
    en: "MacTutor describes addition, subtraction and multiplication of composite expressions, narrower division and restricted root extraction; TDV confirms retained geometrical demonstration {cite:karaji-mactutor Biography} {cite:tdv-kereci pp. 277–278}."
    ur: "میک ٹیوٹر مرکب عبارتوں کا جمع، تفریق اور ضرب، محدود تقسیم اور مخصوص جذر بتاتا ہے؛ ٹی ڈی وی ہندسی برہان کے باقی رہنے کی تصدیق کرتا ہے {cite:karaji-mactutor Biography} {cite:tdv-kereci pp. 277–278}۔"
  perspectives:
    - tradition: sunni
      id: sunni-museum-frame
      standing: main
      summary:
        ar: "إطار المتحف السني المعلن: التصنيف تحسين يحفظ السابقين، وأساس الهوية المسلمة وصف صريح باسم العالم؛ لا يثبت ذلك مذهبه الشخصي ولا يجعل خلاف المؤرخين حكماً مذهبياً {cite:karaji-mactutor Biography} {cite:karaji-ataie-simmons-2020 p. 762}."
        en: "Explicit Sunni museum frame: an improvement preserving predecessors, with a named explicit Muslim basis. This is not personal school evidence or an attributed Sunni judgement resolving historians' technical disagreement {cite:karaji-mactutor Biography} {cite:karaji-ataie-simmons-2020 p. 762}."
        ur: "متحف کا واضح سنی فریم: سابقین کے ساتھ بہتری، اور نام زد واضح مسلم شناخت۔ یہ ذاتی مسلک کا ثبوت یا مؤرخین کے فنی اختلاف کو حل کرنے والا منسوب سنی حکم نہیں {cite:karaji-mactutor Biography} {cite:karaji-ataie-simmons-2020 p. 762}۔"
      sources: [source/karaji-mactutor, source/karaji-ataie-simmons-2020]
    - tradition: academic
      id: arithmetic-autonomy
      standing: main
      summary:
        ar: "تعرض ماكتوتر قراءة فوبكه ورشد راشد التي تبرز استقلال العمليات الجبرية عن التمثيل الهندسي؛ نقل عن هذه الدراسات، لا قراءة مستقلة لكاملها {cite:karaji-mactutor Biography}."
        en: "MacTutor reports Woepcke's and Rashed's emphasis on the autonomy of algebraic operations from geometrical representation; those studies are reported, not independently read in full {cite:karaji-mactutor Biography}."
        ur: "میک ٹیوٹر ووپکے اور رشدی راشد کی جبری عملیات کی ہندسی تمثیل سے آزادی پر زور دینے والی تعبیر نقل کرتا ہے؛ اصل مطالعات مکمل الگ نہیں پڑھے گئے {cite:karaji-mactutor Biography}۔"
      sources: [source/karaji-mactutor]
    - tradition: academic
      id: retained-geometry
      standing: main
      summary:
        ar: "تعرض ماكتوتر تحفظ كروسلي على محدودية المعادلات والبراهين وبقاء هندسة إقليدس؛ وتذكر TDV برهان الفخري الهندسي. لا يحسم المتحف الخلاف بعبارة «ألغى الهندسة» {cite:karaji-mactutor Biography} {cite:tdv-kereci pp. 277–278}."
        en: "MacTutor reports Crossley's caution about limited equations/proofs and retained Euclidean geometry; TDV likewise notes geometrical proof in al-Fakhri. The museum does not resolve this by saying geometry was abolished {cite:karaji-mactutor Biography} {cite:tdv-kereci pp. 277–278}."
        ur: "میک ٹیوٹر محدود مساوات و براهین اور باقی اقلیدسی ہندسہ پر کراسلی کا تحفظ نقل کرتا ہے؛ ٹی ڈی وی بھی الفخری میں ہندسی ثبوت بتاتا ہے۔ متحف اسے ہندسہ کے خاتمے کا فیصلہ نہیں بناتا {cite:karaji-mactutor Biography} {cite:tdv-kereci pp. 277–278}۔"
      sources: [source/karaji-mactutor, source/tdv-kereci]
