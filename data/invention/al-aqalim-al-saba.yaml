summary:
  ar: "نظام جغرافي فلكي ورثته العلوم الإسلامية عن التقليد البطلمي، قسّم المعمورة إلى سبعة أقاليم يعادل كل منها أقصى طول للنهار
    وبعد القطب عن الأفق، وقرن كل إقليم ببرج أو كوكب؛ دوّنه الفرغاني في فصليه الثامن والتاسع من «الجوامع في علم النجوم» قبل سنة
    ٨٥٧م {cite:farghani-elements-astronomy pp. 92–100}، وعرضه المسعودي في «مروج الذهب» بقائمة الأقاليم وبروجها وكواكبها ومدّ الاستيطان {cite:muruj-al-dhahab pp. 519–522}."
  en: "A geographical-astronomical system the Islamic sciences inherited from the Ptolemaic tradition, dividing the inhabited
    quarter into seven climates each fixed by its longest day and pole height and paired with a zodiac sign and planet;
    al-Farghani recorded it in the eighth and ninth chapters of his 'Jawami' 'ilm al-nujum' before 857 CE {cite:farghani-elements-astronomy
    pp. 92–100}, and al-Mas'udi expounded it in Muruj al-Dhahab with the list of climates, their signs, planets and the
    bounds of settlement {cite:muruj-al-dhahab pp. 519–522}."
  ur: "ایک جغرافیائی فلکیاتی نظام جو اسلامی علوم نے بطلمیوسی روایت سے پایا، جس نے آباد любит کو سات اقلیمی خطوں میں تقسیم
    کیا — ہر ایک کی حد اس کے طویل ترین دن اور قطب کی بلندی سے مقرر ہے اور ہر خطے کا جوڑا ایک برج اور سیارہ ہے؛ الفرغانی نے اسے اپنی
    کتاب «الجوامع في علم النجوم» کے آٹھویں اور نویں ابواب میں 857ء سے پہلے لکھا {cite:farghani-elements-astronomy pp. 92–100}، اور
    المسعودی نے «مروج الذهب» میں اقلیمی خطوں، ان کے بروج اور سیاروں اور آباد کاری کی حدود کے ساتھ پیش کیا {cite:muruj-al-dhahab
    pp. 519–522}۔"
