impact:
  fields: [navigation-geography]
  changed:
    ar: "أعطى المؤلفون المسلمين إطاراً موحداً لوصف العالم: كل إقليم له برجه وكوكبه وسكانه وموانئه، فصار وصف البلدان في
      كتب الجغرافيا والفلك يتبع هذا القالب المتعارف."
    en: "It gave Muslim authors a unified frame for describing the world: each climate had its zodiac sign, planet, peoples
      and coasts, so descriptions of countries in geography and astronomy books followed this shared template."
    ur: "اس نے مسلمان مصنفین کو دنیا بیان کرنے کا ایک متحد ڈھانچہ دیا: ہر خطے کا اپنا برج، سیارہ، اقوام اور ساحل تھے، اس لیے
      جغرافیہ و فلکیات کی کتابوں میں ممالک کا بیان اسی مشترکہ سانچے پر چلا۔"
  history:
    ar: "ثبّت التقسيم السباعي في المنهج الفلكي والجغرافي العباسي، فدوّنه الفرغاني في فصول الجوامع وعرضه المسعودي في مروج الذهب،
      وصار مرجعاً للمسالك والممالك حتى عصر الخرائط الإرديسية."
    en: "It fixed the sevenfold division in the Abbasid astronomical and geographical curriculum — recorded by al-Farghani in
      the Jawami' chapters and expounded by al-Mas'udi in Muruj al-Dhahab — and remained the reference frame for itinerary
      and kingdom literature until the Idrisi map age."
    ur: "اس نے سات خانے والی تقسیم کو عباسی فلکیاتی و جغرافیائی نصاب میں مستقل کیا — الفرغانی نے الجوامع کے ابواب میں اور
      المسعودی نے «مروج الذهب» میں پیش کی — اور عمارتوں و سلطنتوں کے ادب کے لیے ایڈریسی دور کے نقشوں تک مرجع ڈھانچہ رہا۔"
  significance: 3
  why: "A transmitted system rather than an invention, but one that structured how medieval Arabic and Persian writers
    organised the whole inhabited world; the rating reflects documented transmission and use, not a Muslim originator."
