    status: historical
    note: "Al-Farghani's Elements of Astronomy, written before 857 CE per the edition read, already divides the inhabited
      quarter into seven climates bounded by longest-day length and pole height and lists the countries of each {cite:farghani-elements-astronomy
      pp. 92–100}; al-Mas'udi's Muruj al-Dhahab gives the full list with zodiac and planetary assignments {cite:muruj-al-dhahab
      pp. 519–522}. The scheme itself is inherited and older; this is the earliest attestation inside the sources read, not
      an invention date."
    sources: [source/farghani-elements-astronomy, source/muruj-al-dhahab]
