attribution:
  status: transmission
  claim:
    ar: "تقسيم الأقاليم السبعة نظام جغرافي فلكي أقدم من الإسلام، يصل مباشرة إلى التقاليد البطلمية؛ المساهمة الموثقة في المصادر
      المقروءة أن الفرغاني والمسعودي نظّما هذا النظام في العربية ونقلواه إلى كتب الفلك والجغرافيا المدرسية، لا أن أحدهما اخترعه."
    en: "The seven-climates division is a pre-Islamic geographical-astronomical scheme reaching directly into the Ptolemaic
      traditions; the documented Muslim contribution in the sources read is that al-Farghani and al-Mas'udi systematised
      and transmitted it in Arabic through the schoolbooks of astronomy and geography — neither invented it."
    ur: "سات اقلیمی خطوں کی تقسیم اسلام سے پہلے کا جغرافیائی فلکیاتی نظام ہے جو براہ راست بطلمیوسی روایت سے جڑی ہے؛ پڑھے گئے
      ماخذوں میں مستند حصہ یہ ہے کہ الفرغانی اور المسعودی نے اسے عربی میں منظم کیا اور فلکیات و جغرافیہ کی کتابوں کے ذریعے
      منتقل کیا — کسی ایک نے ایجاد نہیں کی۔"
  basis:
    ar: "يعرض الفرغاني في الفصل الثامن تقسيم المعمورة إلى سبعة أقاليم محدودة بأطول النهار وارتفاع القطب، ويعدّد في الفصل التاسع
      بلدان كل إقليم {cite:farghani-elements-astronomy pp. 92–100}. ويعرض المسعودي في مروج الذهب قائمة الأقاليم السبعة مع
      أبراجها وكواكبها ومقالاته عن بطلميوس وكتاب الجغرافيا، فيقرّ بقدمي النظام {cite:muruj-al-dhahab pp. 519–522} {cite:muruj-al-dhahab
      p. 750–751}."
    en: "Al-Farghani's eighth chapter divides the inhabited quarter into seven climates bounded by longest-day length and
      pole height, and the ninth lists each climate's countries {cite:farghani-elements-astronomy pp. 92–100}. Al-Mas'udi
      gives the seven-climates list with their signs and planets while discussing Ptolemy's Geography, acknowledging the
      scheme's antiquity {cite:muruj-al-dhahab pp. 519–522} {cite:muruj-al-dhahab p. 750–751}."
    ur: "الفرغانی کا آٹھواں باب آباد دنیا کو سات اقلیمی خطوں میں تقسیم کرتا ہے جن کی حدیں طویل ترین دن کی طوالت اور قطب کی
      بلندی سے ہیں، اور نواں باب ہر خطے کے ممالک گنتا ہے {cite:farghani-elements-astronomy pp. 92–100}۔ المسعودی «مروج الذهب»
      میں بروج اور سیاروں کے ساتھ سات اقلیمی خطوں کی فہرست دیتا ہے اور بطلميوس کی «جغرافیہ» کا ذکر کرتے ہوئے نظام کی قدامت
      تسلیم کرتا ہے {cite:muruj-al-dhahab pp. 519–522} {cite:muruj-al-dhahab p. 750–751}۔"
