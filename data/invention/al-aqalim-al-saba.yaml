  polity: polity/abbasid-caliphate
  context:
    ar: "دوّن الفرغاني نظام الأقاليم السبعة في «الجوامع في علم النجوم»، كتاب المنهج الفلكي العباسي الذي قرئ في حاضرة الخلافة
      العباسية ومدارسها {cite:farghani-elements-astronomy pp. 92–100}؛ وعرض المسعودي النظام نفسه في مروج الذهب باعتباره بنية
      معروفة لوصف المعمورة {cite:muruj-al-dhahab pp. 519–522}."
    en: "Al-Farghani recorded the seven-climates scheme in the Jawami', the Abbasid astronomical curriculum read in the
      caliphal capital's scholarly world {cite:farghani-elements-astronomy pp. 92–100}; al-Mas'udi presented the same scheme
      in Muruj al-Dhahab as the received frame for describing the inhabited world {cite:muruj-al-dhahab pp. 519–522}."
    ur: "الفرغانی نے سات اقلیمی خطوں کا نظام «الجوامع» میں لکھا — وہ عباسی فلکیاتی نصاب جو دار الخلافہ کے علمی ماحول میں پڑھا
      جاتا تھا {cite:farghani-elements-astronomy pp. 92–100}؛ اور المسعودی نے «مروج الذهب» میں اسی نظام کو آباد دنیا بیان کرنے کے
      موروث ڈھانچے کے طور پر پیش کیا {cite:muruj-al-dhahab pp. 519–522}۔"
