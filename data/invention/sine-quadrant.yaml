    ar: الشاهد الأول المسمى وصف الخوارزمي للآلة في بغداد القرن التاسع؛ والأرجح أن
      الشبكة الجيبية نضجت من تقاطع القوس المقسّم القديم مع جداول الجيب التي جاءت من
      الهند، قبل أن تصير أداة الموقت اليومية {cite:wikipedia-sine-quadrant-en} {cite:king-islamic-astronomy-1999}.
    en: The first named witness is al-Khwarizmi's description of the instrument in
      ninth-century Baghdad; the sine grid most plausibly matured where the old graduated
      arc met the Indian sine tables, before becoming the timekeeper's everyday tool
      {cite:wikipedia-sine-quadrant-en} {cite:king-islamic-astronomy-1999}.
    ur: پہلا نامزد شاہد نویں صدی کے بغداد میں خوارزمی کی تحریر ہے؛ جیبی جال غالباً
