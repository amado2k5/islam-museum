  basis:
    ar: 'تقوم المطالبة على كينغ ⁦(1999)⁩ عبر المراجعة المسجلة: وصف الخوارزمي في القرن
      التاسع والخدمة المستمرة لتحديد الصلاة؛ وصف الآلة عينها ⁦(شبكة الجيب، الخيط،
