  changed:
    ar: 'وضع حساب المثلثات في جيب الموقت: بخيط منزلق على شبكة الجيب يُستخرج الجيب
      وجيب التمام والظل بصرياً، فصار تحديد أوقات الصلاة واتجاه القبلة عملاً ميدانياً
      لا مكتبياً {cite:wikipedia-sine-quadrant-en}.'
    en: 'It pocketed trigonometry for the prayer-timekeeper: the sliding cord on the
      sine grid reads off sines, cosines and shadows visually, so fixing prayer times
      and direction became fieldwork, not desk work {cite:wikipedia-sine-quadrant-en}.'
    ur: 'مقت کی جیب میں مثلثیات ڈال دی: سلائیڈنگ ڈور جیبی جال پر جیب، جیبِ تمام اور
      سایہ بصری طور پر دیتا، تو اوقاتِ نماز اور سمت کا تعین میدانی کام بنا نہ کہ میزی
      {cite:wikipedia-sine-quadrant-en}۔'
  history:
    ar: خدمت الآلة من بغداد القرن التاسع إلى المقاييس العثمانية المصنوعة من الخشب
      والنحاس في القرن التاسع عشر؛ ومن أنواعها نسخة ملاحية مجردة لتجنب الريح، وجمعها
      ابن الشاطر بدمشق في «الربع الكامل» {cite:wikipedia-sine-quadrant-en} {cite:king-ibn-shatir-bea}.
    en: The instrument served from ninth-century Baghdad to nineteenth-century Ottoman
      wooden and brass specimens; its family includes a skeletal maritime form and
      Ibn al-Shatir's complete quadrant at Damascus {cite:wikipedia-sine-quadrant-en}
      {cite:king-ibn-shatir-bea}.
    ur: نویں صدی کے بغداد سے انیسویں صدی کے عثمانی لکڑی اور پیتل کے نمونوں تک آلہ
      خدمت کرتا رہا؛ خاندان میں ملاحی مجوف صورت اور ابن الشاطر کا «مکمل چوتھائی» دمشق
      میں شامل ہے {cite:wikipedia-sine-quadrant-en} {cite:king-ibn-shatir-bea}۔
  significance: 3
  why: A pocket computer of medieval Islamic astronomy — the sine grid that turned
    table-based trigonometry into a field instrument and served the daily needs of
    prayer timing for a thousand years.
