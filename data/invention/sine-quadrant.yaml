summary:
  ar: ربع دائرة من خشب أو نحاس مقسّم القوس إلى تسعين درجة وبضلعيه المستقيمين شبكة
    جيبية بالستينات، بخيط ثقال ⁦(الخيط)⁩ ولوحتي تصويب ثقبيتين؛ يقيس ارتفاع الشمس والأجرام
    ويعيّن الوقت والاتجاهات ويجري حسابات مثلثية بالخيط المنزلق. وصفه الخوارزمي ببغداد
    القرن التاسع واستُعمل عبر العالم الإسلامي لتحديد أوقات الصلاة {cite:wikipedia-sine-quadrant-en}
    {cite:king-islamic-astronomy-1999}.
  en: A quarter-circle of wood or brass whose arc is divided into ninety degrees and
    whose straight sides carry a sexagesimal sine grid, with a weighted plumb cord
    (khait) and two pinhole sighting plates; it measures the altitude of the sun and
    celestial bodies, tells time and direction, and performs trigonometric computation
    by the sliding cord. Al-Khwarizmi described it in ninth-century Baghdad, and it
    was used across the Islamic world for determining prayer times {cite:wikipedia-sine-quadrant-en}
    {cite:king-islamic-astronomy-1999}.
  ur: لکڑی یا پیتل کی چوتھائی دائرہ جس کا قوس نوے درجوں میں بٹا اور مستقیم ضلعوں پر
    سٹھ کی گنتی کی جیبی جال؛ ثقلی ڈور ⁦(خیت)⁩ اور دو سوراخی نظر پٹیوں سے مزین؛ سورج
    اور آسمانی اجرام کا بلندی زاویہ ناپتا، وقت اور سمت بتاتا، اور سلائیڈنگ ڈور سے
    مثلثیاتی حساب کرتا۔ خوارزمی نے نویں صدی کے بغداد میں اس کا وصف کیا اور اسلامی
    دنیا بھر میں اوقاتِ نماز کے لیے مستعمل رہا {cite:wikipedia-sine-quadrant-en} {cite:king-islamic-astronomy-1999}۔
  es: "Un cuadrante de madera o latón, con un arco dividido en noventa grados y cuyas caras rectas presentan una cuadrícula sinusoidal sexagesimal, con una cuerda de plomada ponderada (khait) y dos placas de puntería con orificios; mide la altitud del sol y de los cuerpos celestes, indica la hora y la dirección, y realiza cálculos trigonométricos mediante la cuerda deslizante. Al-Juarismi lo describió en Bagdad en el siglo IX, y se utilizó en todo el mundo islámico para determinar los horarios de oración {cite:wikipedia-sine-quadrant-en} {cite:king-islamic-astronomy-1999}."
  fr: "Un quart de cercle en bois ou en laiton, dont l'arc est divisé en quatre-vingt-dix degrés et dont les côtés droits portent une grille sinusoïdale sexagésimale, avec un fil à plomb lesté (khait) et deux plaques de visée à trous d'épingle; il mesure la hauteur du soleil et des astres, indique l'heure et la direction, et effectue des calculs trigonométriques grâce au coulissement du fil. Al-Khwarizmi l'a décrit au IXe siècle à Bagdad, et il était utilisé dans tout le monde islamique pour déterminer les heures de prière."
