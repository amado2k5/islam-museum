attribution:
  status: original
  claim:
    ar: 'المطالبة محدودة وصادقة: تثبيت الكسور بضمادات تتصلّب — جيراً وجبساً وصمغاً
      ونشا وبياضاً — موثّق في الممارسة العربية الإسلامية من القرن العاشر؛ بينما الجبيرة
      الحديثة بشريط جبس باريس اختراع ماتيسن ⁦(1852)⁩ لا سابقة إسلامية يدّعيها هذا
      السجل {cite:szostakowski-plaster-history-2017} {cite:wikipedia-orthopedic-cast-en}.'
    en: 'A limited, honest claim: fracture immobilisation with stiffened dressings
      — lime, gypsum, gum, starch, albumen — is documented in Arabic-Islamic practice
      from the tenth century; the modern plaster-of-Paris bandage is Mathijsen''s
      1852 invention, for which this record claims no Islamic precedent {cite:szostakowski-plaster-history-2017}
      {cite:wikipedia-orthopedic-cast-en}.'
    ur: 'محدود اور دیانت دارانہ دعویٰ: سخت ہونے والی پٹیوں سے ٹوٹی ہڈی کا تثبیت —
      چونا، جپسم، گوند، نشاستہ، البیومن — دسویں صدی سے عربی-اسلامی عمل میں مستند ہے؛
      جدید پلاسٹر آف پیرس پٹی ماتیسن کی 1852ء کی ایجاد ہے جس کے لیے یہ ریکارڈ کوئی
      اسلامی سبق نہیں مانتا {cite:szostakowski-plaster-history-2017} {cite:wikipedia-orthopedic-cast-en}۔'
  basis:
    ar: تقوم المطالبة على مراجعة سوستاكوفسكي ⁦(2017)⁩ لوصف الزهراوي والقرن العاشر،
      ومراجعة الجبيرة العظمية لمواد العرب ⁦(الجير والألبومين)⁩؛ والربط التركي ⁦(إيتون
      نحو 1800)⁩ والاختراع الأوروبي ⁦(ماتيسن، بيروغوف)⁩ في السلسلة نفسها {cite:szostakowski-plaster-history-2017}
      {cite:wikipedia-orthopedic-cast-en}.
    en: The claim rests on Szostakowski et al. (2017) for the al-Zahrawi and tenth-century
      notes, and on the orthopedic-cast review for the Arab materials (lime and albumen);
      the Turkish link (Eton c.1800) and the European invention (Mathijsen, Pirogov)
      stand in the same chain {cite:szostakowski-plaster-history-2017} {cite:wikipedia-orthopedic-cast-en}.
    ur: دعویٰ شوستاکوسکی وغیرہ ⁦(2017)⁩ پر ہے برائے الزہراوی اور دسویں صدی کے نکات،
      اور ارتوپیڈک کاسٹ جائزے پر برائے عرب مواد ⁦(چونا اور البیومن)⁩؛ ترک کڑی ⁦ایٹن
      تقریباً 1800ء⁩ اور یورپی ایجاد ⁦ماتیسن، پیروگوف⁩ اسی سلسلے میں ہیں {cite:szostakowski-plaster-history-2017}
      {cite:wikipedia-orthopedic-cast-en}۔
