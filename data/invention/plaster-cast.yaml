today:
  form:
    ar: يبقى جبس باريس خياراً للكسور البسيطة لقربته من قياس الطرف ورخصه، جنباً إلى
      جنب مع ضمادات الألياف الأخف {cite:wikipedia-orthopedic-cast-en}.
    en: Plaster of Paris remains an option for simple fractures — it moulds snugly
      and is cheap — alongside lighter fibreglass bandages {cite:wikipedia-orthopedic-cast-en}.
    ur: پلاسٹر آف پیرس سادہ ٹوٹیوں کے لیے آج بھی اختیار ہے — ٹھیک فٹ اور سستا — ہلکی
      فائبرگلاس پٹیوں کے ساتھ {cite:wikipedia-orthopedic-cast-en}۔
  descendants:
    ar: خلفته ضمادات الفيبرغلاس واللدائن الحرارية والجبائر القابلة للغسل، وكلها تحمل
      مبدأ التصليد نفسه {cite:wikipedia-orthopedic-cast-en}.
    en: Fibreglass, thermoplastic and washable casts carry on the same stiffening
      principle {cite:wikipedia-orthopedic-cast-en}.
    ur: فائبرگلاس، تھرموپلاسٹک اور دھونے والے کاسٹ وہی سخت ہونے کا اصول آگے لے جاتے
      ہیں {cite:wikipedia-orthopedic-cast-en}۔
