summary:
  ar: 'تضميد الكسور بمواد تشتد حول الطرف فيحفظ استقامته حتى يلتئم: يسجّل تاريخ الجراحة
    أن الزهراوي ⁦(960–1013)⁩ قرب قرطبة وصف مواد تصليب كالطين مع صمغ والدقيق مع بياض
    البيض، وأن العرب استعملوا في القرن العاشر الجبس السائل في علاج العظام؛ ويطابق
    ما بقي في النصوص أن أطباء المسلمين صلّبوا الضمادات بالجير المستخرج من صدف البحر
    والألبومين. القفزة الثانية للجبس نفسه أوروبية القرن التاسع عشر: مشهد إيتون التركي
    ⁦نحو 1800⁩ فلصّاقة ماتيسن ⁦(1852)⁩ فبيروغوف في القرم {cite:szostakowski-plaster-history-2017}
    {cite:wikipedia-orthopedic-cast-en}.'
  en: 'Immobilising a fracture with a dressing that hardens around the limb: surgical
    histories record that al-Zahrawi (960-1013) near Cordoba described casting materials
    such as clay-gum mixtures and flour-and-egg-white, that tenth-century Arabs used
    liquid plaster in orthopaedic treatment, and that Muslim physicians stiffened
    bandages with lime from sea shells and albumen. The second, modern leap of plaster
    of Paris is nineteenth-century European: Eton''s c.1800 Turkish scene, Mathijsen''s
    1852 plaster bandage and Pirogov''s Crimean use {cite:szostakowski-plaster-history-2017}
    {cite:wikipedia-orthopedic-cast-en}.'
  ur: 'ٹوٹی ہڈی کو ایسے پٹار سے باندھنا جو بازو کے گرد سخت ہو جائے: جراحی کی تاریخ
    لکھتی ہے کہ الزہراوی ⁦(960–1013)⁩ نے قرطبہ کے قریب کاسٹنگ مواد جیسے مٹی-گوند اور
    آٹا-انڈے کی سفیدی بیان کیے، دسویں صدی کے عربوں نے ہڈیوں کے علاج میں مائع پلاسٹر
    استعمال کیا، اور مسلم طبیبوں نے صدف کی چونے اور البیومن سے پٹیاں سخت کیں۔ پلاسٹر
    آف پیرس کی دوسری جدید چھلانگ انیسویں صدی کی یورپی ہے: ایٹن کا ترک منظر ⁦تقریباً
    1800ء⁩، ماتیسن کی 1852ء کی پلاسٹر پٹی اور پیروگوف کا کریمیا میں استعمال {cite:szostakowski-plaster-history-2017}
    {cite:wikipedia-orthopedic-cast-en}۔'
  es: "Inmovilización de una fractura con un vendaje que se endurece alrededor de la extremidad: las historias quirúrgicas registran que al-Zahrawi (960-1013) cerca de Córdoba describió materiales de enyesado como mezclas de arcilla y goma, y harina y clara de huevo; que los árabes del siglo X usaban yeso líquido en tratamientos ortopédicos; y que los médicos musulmanes endurecían los vendajes con cal de conchas marinas y albúmina. El segundo salto moderno del yeso de París es europeo del siglo XIX: la escena turca de Eton de c. 1800, el vendaje de yeso de Mathijsen de 1852 y el uso de Pirogov en Crimea {cite:szostakowski-plaster-history-2017} {cite:wikipedia-orthopedic-cast-en}."
