spread: []
impact:
  fields:
  - medicine-surgery
  changed:
    ar: 'جعل التثبيت مادياً لا نشاطياً: بدل أن يظل المريض أسابيع في الفراش بجبائر
      خشبية، حفظت الضمادة المتصلبة الاستقامة مكانها وسمحت لاحقاً بالحركة أثناء الالتئام
      {cite:szostakowski-plaster-history-2017} {cite:wikipedia-orthopedic-cast-en}.'
    en: 'It made immobilisation a material rather than a regime: instead of weeks
      in bed under wooden splints, a hardening dressing held the reduction in place
      and eventually allowed walking while healing {cite:szostakowski-plaster-history-2017}
      {cite:wikipedia-orthopedic-cast-en}.'
    ur: 'تثبیت کو نظم کے بجائے مادّہ بنا دیا: لکڑی کی جبیروں میں ہفتوں بستر کے بجائے
      سخت ہونے والی پٹی ہڈی کو جگہ رکھتی اور بالآخر شفا کے دوران چلنے دیتی {cite:szostakowski-plaster-history-2017}
      {cite:wikipedia-orthopedic-cast-en}۔'
  history:
    ar: من مواد القرن العاشر الأندلسية ⁦(طين وصمغ، دقيق وبياض، جير وألبومين)⁩ إلى
      الجبس التركي المشهود ⁦(1800)⁩ فلافارغ ⁦(1839)⁩ وماتيسن ⁦(1852)⁩ وبيروغوف في
      القرم، صارت الجبيرة معيار الجراحة العالمي حتى مواد الألياف الحديثة {cite:szostakowski-plaster-history-2017}
      {cite:wikipedia-orthopedic-cast-en}.
    en: From tenth-century Andalusi materials (clay and gum, flour and egg-white,
      lime and albumen) to the witnessed Turkish gypsum (1800), Lafargue (1839), Mathijsen
      (1852) and Pirogov in the Crimea, the cast became world surgery's standard until
      modern fibreglass {cite:szostakowski-plaster-history-2017} {cite:wikipedia-orthopedic-cast-en}.
    ur: دسویں صدی کے اندلسی مواد ⁦(مٹی-گوند، آٹا-انڈا، چونا-البیومن)⁩ سے مشہود ترک
      جپسم ⁦1800ء⁩، لافارگ ⁦1839ء⁩، ماتیسن ⁦1852ء⁩ اور کریمیا میں پیروگوف تک کاسٹ
      عالمگیر جراحی کا معیار بنا جب تک جدید فائبرگلاس آیا {cite:szostakowski-plaster-history-2017}
      {cite:wikipedia-orthopedic-cast-en}۔
  significance: 3
  why: One of medicine's simplest great ideas — let the dressing itself stiffen into
    the splint — documented in tenth-century Muslim practice, carried into the European
    repertoire through the Ottoman observation of 1800, and still the everyday treatment
    for a broken limb.
