kids:
  ar: كيف ترسل مالاً إلى مدينة بعيدة دون أن يتحرك دينار واحد على الطريق؟ تعطي أخاك
    المال هنا، فيكتب إلى صديقه هناك، فيدفع الصديق لعائلتك من جيبه — ويتقاصّ الاثنان
    لاحقاً. المال «سافر» بالثقة لا بالجياد — هذه فكرة الحوالة التي عمرها أكثر من ألف
    سنة.
  en: 'How do you send money to a far city without a single coin travelling the road?
    You give your brother the money here; he writes to his friend there; the friend
    pays your family from his own pocket — and the two settle up later. The money
    "travelled" on trust, not on horseback: that is the idea of hawala, more than
    a thousand years old.'
  ur: دور کے شہر میں پیسہ کیسے بھیجیں بغیر ایک سکے کے راستہ طے کیے؟ تم اپنے بھائی
    کو یہاں پیسہ دو، وہ وہاں اپنے دوست کو لکھے، دوست تمھارے گھر والوں کو اپنی جیب
    سے ادا کرے — اور دونوں بعد میں حساب چکائیں۔ پیسہ «سفر» کیا بھروسے پر نہ کہ گھوڑوں
    پر — یہ حوالہ کی سوچ ہے، ہزار سال سے بھی پرانی۔
