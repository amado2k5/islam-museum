attribution:
  status: contested
  claim:
    ar: الحوالة موثقة مصطلحاً مالياً وفقهياً في الإسلام من العصر العباسي؛ أما النظام
      غير الرسمي الحديث الذي يحمل الاسم نفسه فتتنازع أصوله بين «هوندي» الهندية والعقد
      الفقهي الإسلامي {cite:encyclopaedia-of-islam-2} {cite:wikipedia-hawala-en}.
    en: The hawala is documented as a financial term and a legal contract in Islam
      from the Abbasid period; the modern informal transfer system bearing the same
      name has its origins disputed between the Indian hundi and the Islamic legal
      contract {cite:encyclopaedia-of-islam-2} {cite:wikipedia-hawala-en}.
    ur: حوالہ عباسی دور سے اسلام میں مالی اصطلاح اور فقہی عقد کے طور پر مستند ہے؛
      اسی نام کے جدید غیر رسمی نظام کی جڑ ہندوستانی ہنڈی اور اسلامی فقہی عقد کے درمیان
      متنازع ہے {cite:encyclopaedia-of-islam-2} {cite:wikipedia-hawala-en}۔
  basis:
    ar: تسجل EI2 الحوالة في مالية العباسيين ⁦(صفتجة وصك عمال أهواز وفارس وإصفهان)⁩
      والسلاجقة والإيلخانات ⁦(دفاتر التحويلات)⁩ والعثمانيين حتى إلغاء المقاطعة ⁦(1839)⁩،
      وتجعل لها في الفقه كتاباً مستقلاً؛ والمصادر الحديثة تؤرخ أول حوالة موثقة بـ1327
      وتتجادل في الهندية والإسلامية {cite:encyclopaedia-of-islam-2} {cite:schramm-taube-hawala-2003}
      {cite:wikipedia-hawala-en}.
    en: EI2 records hawala in Abbasid finance ⁦(the suftaja and sakk mandates of the
      tax-collectors of Ahwaz, Fars and Isfahan)⁩, Seljuk, Ilkhanid ⁦(the tahwilat
      registers)⁩ and Ottoman practice until tax-farming was abolished ⁦(1839)⁩, and
      gives it a separate book in fiqh; modern scholarship dates the first documented
      hawala to 1327 and argues between the Indian and the Islamic line {cite:encyclopaedia-of-islam-2}
      {cite:schramm-taube-hawala-2003} {cite:wikipedia-hawala-en}.
    ur: EI2 حوالے کو عباسی مالیات ⁦(اہواز، فارس و اصفہان کے عمال کے سفتجہ و صک)⁩،
      سلجوقی، ایلخانی ⁦(تحویلات کے دفاتر)⁩ اور عثمانی عمل میں 1839ء تک مستند کرتی
      اور فقہ میں اس کا الگ باب بتاتی ہے؛ جدید تحقیق پہلی موثق حوالہ 1327ء مؤرخ کرتی
      اور ہندوستانی و اسلامی نسبت پر جھگڑتی ہے {cite:encyclopaedia-of-islam-2} {cite:schramm-taube-hawala-2003}
      {cite:wikipedia-hawala-en}۔
  perspectives:
  - tradition: sunni
    id: fiqh-hawala-contract
    summary:
      ar: عقد شرعي مستقل — تضع كتب الفقه «كتاب الحوالة» باباً قائماً بذاته، يحيل فيه
        المحيل دينَه على المحال عليه، وتجمع فتاوى المفتين العثمانيين أحكام حوالة الدولة
        والأفراد والأوقاف على السواء {cite:encyclopaedia-of-islam-2}.
      en: A contract of the law in its own right — the law books give the 'Book of
        Hawala' its own chapter, in which the transferor assigns his debt to the party
        the debt is assigned upon, and Ottoman muftis' fatwa collections rule on hawala
        of state, private persons and waqfs alike {cite:encyclopaedia-of-islam-2}.
      ur: شریعت کا مستقل عقد — فقہ کی کتابوں میں «کتاب الحوالہ» علیحدہ باب ہے جس میں
        محیل اپنا قرض محال علیہ پر منتقل کرتا ہے، اور عثمانی مفتیوں کی فتویٰ تالیفات
        ریاست، افراد اور اوقاف کے حوالے کے احکام جمع کرتی ہیں {cite:encyclopaedia-of-islam-2}۔
    sources:
    - source/encyclopaedia-of-islam-2
  - tradition: academic
    id: origins-debated
    summary:
      ar: الأصل بين «هوندي» الهند وعقد الفقه — تؤرخ إدارة مكافحة الجرائم المالية الأمريكية
        المنشأ بالهند، وتؤرخ شرام وطاوبة أول حوالة موثقة بـ1327 داخل النظرية القانونية
        الإسلامية، ويقترح بدر أثراً للحوالة في الوكالة القانونية الأوروبية دون إثبات
        استعارة {cite:wikipedia-hawala-en} {cite:schramm-taube-hawala-2003}.
      en: The origin sits between the Indian hundi and the fiqh contract — the US
        FinCEN report places it in India, Schramm and Taube date the first documented
        hawala to 1327 inside Islamic legal theory, and Badr suggests hawala helped
        shape European legal agency without proven borrowing {cite:wikipedia-hawala-en}
        {cite:schramm-taube-hawala-2003}.
      ur: جڑ ہندوستانی ہنڈی اور فقہی عقد کے درمیان ہے — امریکی FinCEN رپورٹ اسے ہندوستان
        میں رکھتی ہے، شرام و طاوبہ پہلی موثق حوالہ 1327ء اسلامی قانونی نظریہ میں مؤرخ
        کرتے ہیں، اور بدر یورپی قانونی وکالت پر حوالہ کے اثر کا مشورہ دیتے ہیں بغیر
        ثابت استعارت کے {cite:wikipedia-hawala-en} {cite:schramm-taube-hawala-2003}۔
    sources:
    - source/wikipedia-hawala-en
    - source/schramm-taube-hawala-2003
