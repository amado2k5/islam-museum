spread: []
impact:
  fields:
  - institutions-systems
  changed:
    ar: 'فصلت سداد الالتزام عن حمل النقد: انتقلت الأموال بين المقاطعات والعواصم بالأمر
      المكتوب والثقة بين الصيارفة، فآمنت المالية العامة والتجارة معاً من خطر الطريق
      {cite:encyclopaedia-of-islam-2}.'
    en: 'It detached payment from carrying coin: money moved between provinces and
      capitals by written order and bankers'' trust, insuring both public finance
      and trade against the dangers of the road {cite:encyclopaedia-of-islam-2}.'
    ur: 'ادائیگی کو سکے کی حمل سے الگ کیا: رقوم صوبوں اور دارالحکومتوں کے درمیان تحریری
      حکم اور صرافوں کے اعتماد سے چلیں، جس سے مالیات اور تجارت دونوں راہ کے خطرات
      سے بچے {cite:encyclopaedia-of-islam-2}۔'
  history:
    ar: صارت قاعدة مالية الدول الإسلامية ألف عام — من سجلات العباسيين إلى دفاتر المقاطعات
      العثمانية — ثم تحولت في العصر الحديث إلى شريان تحويلات المهاجرين خارج البنوك
      {cite:encyclopaedia-of-islam-2} {cite:wikipedia-hawala-en}.
    en: It underpinned Islamic state finance for a thousand years — from Abbasid registers
      to Ottoman muqata'a ledgers — then resurfaced in the modern age as the remittance
      artery of migrant workers outside the banks {cite:encyclopaedia-of-islam-2}
      {cite:wikipedia-hawala-en}.
    ur: ہزار سال اسلامی ریاستی مالیات کی بنیاد رہی — عباسی رجسٹروں سے عثمانی مقاطعہ
      دفتروں تک — پھر جدید دور میں مہاجرین کی ترسیلِ زر کی شہ رگ بنی جو بینکوں سے
      باہر چلتی ہے {cite:encyclopaedia-of-islam-2} {cite:wikipedia-hawala-en}۔
  significance: 4
  why: One of the oldest documented credit-transfer systems — a fiqh contract, a fiscal
    instrument of four empires and a living remittance network, all under one word.
