summary:
  ar: طريقة لتسوية الالتزامات دون نقل النقد — يكلّف المدينُ أو الديوانُ شخصاً ثالثاً
    يدين له بمال أن يدفعه إلى دائنه أو إلى من يأمر به، فتتحرك القيمة بالثقة والتسجيل
    لا بالقوافل؛ وثّقتها EI2 في مالية العباسيين والسلاجقة والإيلخانات والعثمانيين،
    ولها في الفقه «كتاب الحوالة» المستقل {cite:encyclopaedia-of-islam-2}.
  en: A way of settling obligations without moving cash — a debtor — or a treasury
    — orders a third party who owes him money to pay it to his creditor or to a named
    beneficiary, so value travels by trust and ledger rather than by caravan; EI2
    documents it in Abbasid, Seljuk, Ilkhanid and Ottoman finance, and Islamic law
    gives it its own 'Book of Hawala' {cite:encyclopaedia-of-islam-2}.
  ur: نقد منتقل کیے بغیر واجبات کی تسویہ کا طریقہ — مقروض — یا خزانہ — کسی تیسرے شخص
    کو جو اس کا مقروض ہے حکم دیتا کہ اپنے قرض دار یا نامزد شخص کو ادائیگی کرے؛ یوں
    قیمت قافلوں کے بجائے اعتماد اور کھاتے سے چلتی ہے؛ EI2 اسے عباسی، سلجوقی، ایلخانی
    اور عثمانی مالیات میں مستند کرتی ہے اور فقہ میں «کتاب الحوالہ» الگ باب ہے {cite:encyclopaedia-of-islam-2}۔
  es: "Una forma de saldar obligaciones sin mover efectivo —un deudor— o una tesorería, ordena a un tercero que le debe dinero que se lo pague a su acreedor o a un beneficiario designado, de modo que el valor viaja por fideicomiso y libro de contabilidad en lugar de por caravana; EI2 lo documenta en las finanzas abasíes, selyúcidas, iljánidas y otomanas, y la ley islámica le da su propio 'Libro de Hawala' {cite:encyclopaedia-of-islam-2}."
