origin:
  polity: polity/abbasid-caliphate
  context:
    ar: 'دواوين الخلفاء العباسيين وأسواق مدنهم، حيث تجمّع الضررُّ مضاعفاً: خطر الطريق
      على النقد المنقول وبطء تراكم الإيراد — فكانت الحوالة والصفتجة والصك جواب المالية
      والفقه معاً {cite:encyclopaedia-of-islam-2}.'
    en: The Abbasid caliphs' fiscal bureaux and city markets, where two problems converged
      — the danger of moving coin and the slowness of revenue arriving — and hawala
      with its mandate documents (suftaja, sakk) was the answer of finance and law
      together {cite:encyclopaedia-of-islam-2}.
    ur: عباسی خلفاء کے مالی دفاتر اور شہری بازار، جہاں دو مسائل جمع ہوئے — سکہ منتقل
      کرنے کا خطرہ اور محصول کی سست آمد — تو حوالہ اپنے تحویلی صیغوں ⁦(سفتجہ، صک)⁩
      کے ساتھ مالیات اور فقہ دونوں کا جواب بنا {cite:encyclopaedia-of-islam-2}۔
