today:
  form:
    ar: يعمل نظام الحوالة الحديث — بين الحوّلادار ⁦(الوسطاء)⁩ في آسيا الغربية وشمال
      أفريقيا والقرن الأفريقي وشبه القارة — موازياً للبنوك، ويخضع للتنظيم والمراقبة
      في كثير من الدول {cite:wikipedia-hawala-en}.
    en: The modern hawala — between hawaladars (brokers) across West Asia, North Africa,
      the Horn of Africa and the subcontinent — runs parallel to the banks and is
      regulated or monitored in many jurisdictions {cite:wikipedia-hawala-en}.
    ur: جدید حوالہ — مغربی ایشیا، شمالی افریقہ، قرنِ افریقہ اور برصغیر کے حوالہ داروں
      کے درمیان — بینکوں کے متوازی چلتا ہے اور کئی ممالک میں قواعد و نگرانی کے تابع
      ہے {cite:wikipedia-hawala-en}۔
  descendants:
    ar: 'تقف على منطقها خدمات التحويل القانونية الحديثة كلها: تسوية صافية بين طرفين
      دون حركة نقد فعلية في كل مرة {cite:wikipedia-hawala-en}.'
    en: 'Every modern regulated remittance service stands on its logic: netting between
      two ends without cash physically travelling each leg {cite:wikipedia-hawala-en}.'
    ur: 'ہر جدید قانونی ترسیلِ زر خدمت اسی منطق پر قائم ہے: دو سروں کے درمیان خالص
      تسویہ بغیر ہر بار نقد کے حقیقی سفر کے {cite:wikipedia-hawala-en}۔'
