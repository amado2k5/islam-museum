attribution:
  status: original
  claim:
    ar: يُنسب اختراع دائرة المعدل إلى الوفائي بالاسم في كتب الأدوات؛ تجمع الآلة مزولة ومحدد قبلات في قرص واحد، مع إقرار بأنها
      استلهمت من آلة ابن الشاطر «صندوق الياقوت» السابقة.
    en: The da'irat al-mu'addil is credited to al-Wafa'i by name in instrument literature; the instrument combines a sundial
      and a qibla indicator on one disc, with an acknowledged stimulus from Ibn al-Shatir's earlier 'Sanduq al-Yawakit' (Jewel
      Box).
    ur: دائرۃ المعدل کی ایجاد آلہ جات کی کتابوں میں الوفائی کے نام سے منسوب ہے؛ آلہ ایک قرص پر مزولہ اور قبلہ نما ملاتا ہے،
      اور ابن الشاطر کے پہلے آلہ «صندوق الیاقوت» کو اس کا پس منظر مانا جاتا ہے۔
  basis:
    ar: وصف المزايد قطعة تاريخية يذكر وصفاً تقنياً كاملاً وينسب الآلة إلى الوفائي ويذكر ابن الشاطر كسلف ملهم؛ كتاب مكتبة الإسكندرية
      يصف رسالته في الآلة التي ابتكرها. لا يوجد مصدر يطعن في النسبة.
    en: The auction record gives a full technical description, attributes the instrument to al-Wafa'i and names Ibn al-Shatir's
      earlier instrument as the acknowledged stimulus; the Azhar catalogue describes his treatise on the instrument he invented.
      No source disputes the attribution.
    ur: مزید ریکارڈ مکمل تکنیکی وضاحت دیتا ہے، آلہ کو الوفائی سے منسوب کرتا ہے اور ابن الشاطر کے پہلے آلہ کو تسلیم شدہ پس
      منظر بتاتا ہے؛ ازہر کی فہرست اس کی ایجاد کردہ آلہ پر اس کے رسالے کو بیان کرتی ہے۔ کوئی ماخذ اس نسبت کو چیلنج نہیں کرتا۔
