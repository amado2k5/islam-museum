impact:
  fields:
  - astronomy-instruments
  - timekeeping
  changed:
    ar: 'دمجت في قرص واحد مهمتين كانتا تحتاجان أداتين منفصلتين: معرفة الوقت من الشمس واتجاه القبلة من البوصلة، فاختصرت على
      الميقاتي حمل ما لا يقل عن قطعتين.'
    en: 'Combined in one disc two tasks that had needed separate devices: telling time from the Sun and finding the qibla
      from the compass, halving what a timekeeper had to carry.'
    ur: 'ایک قرص میں دو کام ملا دیے جو پہلے الگ آلات مانگتے تھے: سورج سے وقت جاننا اور قطب نما سے قبلہ پانا، اس سے میقاتی
      کو کم از کم دو ٹکڑے اٹھانے کی ضرورت ختم ہوئی۔'
  history:
    ar: 'مثال على آلات صغيرة وُلدت في بيئة المواقيت واحتاجتها العبادة اليومية: لا فلك نظرية بل أداة تُحمل.'
    en: 'An example of a small instrument born in the muwaqqit milieu and needed by daily worship: not theoretical astronomy
      but a carried tool.'
    ur: 'میقاتی ماحول میں پیدا ہونے والے چھوٹے آلہ کی مثال جسے روزانہ عبادت نے مانگا: نہ کہ نظری فلکیات بلکہ ایک لے جانے والا
      آلہ۔'
  significance: 4
  why: A named, documented instrument with surviving Ottoman-period examples and a described Ottoman afterlife; significance
    reflects its concrete daily function, not a transformation of astronomy itself.
