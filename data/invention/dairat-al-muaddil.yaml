- person: person/abd-al-aziz-al-wafai
  role: inventor
  note: Egyptian astronomer and muwaqqit (d. 879 AH) credited in instrument literature and the auction record with inventing
    da'irat al-mu'addil; Muslim identity via documented mosque timekeeping in a Sunni Mamluk milieu.
  sources:
