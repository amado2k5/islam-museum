today:
  form:
    ar: حلّت الساعات والمحددات الإلكترونية وأجهزة تحديد القبلة محلها؛ لا تُصنع الدوائر النحاسية بعد اليوم، لكن نماذجها في
      المتاحف تروي تاريخ دمج الوقت والاتجاه.
    en: Electronic watches, compasses and qibla apps have replaced it; brass da'irat are no longer made, but museum examples
      tell the story of fusing time and direction in one disc.
    ur: الیکٹرانک گھڑیاں، قطب نما اور قبلہ ایپوں نے اس کی جگہ لے لی؛ پیتل کے دائرے آج نہیں بنائے جاتے، مگر عجائب گھروں کے
      نمونے وقت اور سمت کے ملاپ کی کہانی کہتے ہیں۔
  descendants:
    ar: توجد نسخ عثمانية متأخرة، ومنهجها - قرص واحد يحمل عدة قياسات - مستمر في أدوات المواقيت اللاحقة حتى الأجهزة الحديثة.
    en: Later Ottoman copies survive, and its method - one disc carrying several measurements - continues in later timekeeping
      devices down to modern instruments.
    ur: بعد کے عثمانی نسخے باقی ہیں، اور اس کا طریقہ - ایک قرص جس پر کئی پیمائشیں - بعد کے اوقات کے آلات میں جدید آلات تک
      جاری ہے۔
