summary:
  ar: آلة عُدّت لعبد العزيز الوفائي الميقاتي في القاهرة، تجمع مزولة صغيرة للساعة ومحدداً مغناطيسياً للقبلة في قرص نحاسي واحد،
    وتقرأ اتجاهات قبلات المدن من محيطه؛ وصفها قباطنة العثمانيين ونُسبت إليه في كتب الأدوات {cite:bibalex-azhar-astronomy-manuscripts-2006
    p. 24} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 25} {cite:oriental-art-auctions-dairat-muaddil}.
  en: An instrument credited to Abd al-Aziz al-Wafa'i the timekeeper in Cairo, combining a small hour sundial and a magnetic
    qibla indicator on one brass disc, reading city qibla directions from its rim; described by Ottoman admirals and attributed
    to him in instrument literature {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 24} {cite:bibalex-azhar-astronomy-manuscripts-2006
    p. 25} {cite:oriental-art-auctions-dairat-muaddil}.
  ur: عبد العزیز الوفائی میقاتی کی آلہ، ایک پیتل کے قرص پر چھوٹی ساعتی دھوپ گھڑی اور مقناطیسی قبلہ نما ملائے ہوئے، اور کنارے
    سے شہروں کے قبلہ کی سمتیں پڑھتا ہے؛ عثمانی امیروں نے اس کی تعریف کی اور آلہ جات کی کتابوں میں اسے اس سے منسوب کیا {cite:bibalex-azhar-astronomy-manuscripts-2006
    p. 24} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 25} {cite:oriental-art-auctions-dairat-muaddil}۔
  es: "Un instrumento atribuido a Abd al-Aziz al-Wafa'i, el cronometrador de El Cairo, que combina un pequeño reloj de sol y un indicador magnético de la qibla en un disco de latón, que lee las direcciones de la qibla de la ciudad desde su borde; descrito por almirantes otomanos y atribuido a él en la literatura sobre instrumentos {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 24} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 25} {cite:oriental-art-auctions-dairat-muaddil}."
