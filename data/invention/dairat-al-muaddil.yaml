      المعدل
    en: Ibn al-Shatir's 'Sanduq al-Yawakit' (Jewel Box), an earlier fourteenth-century CE Syrian astronomical timekeeping
      instrument named by the auction record as the instrument's inspiration
    ur: ابن الشاطر کا «صندوق الیاقوت»، چودہویں صدی عیسوی کا شامی فلکیاتی و وقت کا آلہ جسے مزاد نے دائرۃ المعدل کے پس منظر
      کے طور پر یاد کیا
  note: The auction page reports King's argument (p. 53) that al-Wafa'i's instrument seems inspired by Ibn al-Shatir's Jewel
