kids:
  ar: 'تخيّل قرصاً نحاسياً صغيراً يجمع شيئين: في وسطه إبرة تشبه قطب البوصلة، وحوله أسماء مدن وخطوط تشير إلى قبلتها. إذا حركت
    القرص حتى يوافق الشمال، تستطيع أن تقرأ قبل مكة لأي مدينة مكتوبة على حافته. وتحت نقطة الجنوب مزولة صغيرة مع عصا تقيس الوقت
    بظلها. هكذا وفّر الوفائي على المسافر في القاهرة حمل قطعتين.'
  en: 'Imagine a small brass disc that joins two things: at its centre a needle like a compass point, and around its rim the
    names of cities with lines showing their qibla direction. Turn the disc until it agrees with north, and you can read Mecca''s
    direction for any city written on its edge. Below the south point sits a tiny sundial with a stick that measures time
    by its shadow. That is how al-Wafa''i in Cairo saved the traveller from carrying two instruments.'
  ur: 'سوچو ایک چھوٹا پیتل کا قرص جو دو چیزیں ملائے: اس کے وسط میں قطب نما جیسی سوئی، اور اس کے کنارے شہروں کے نام جن کے ساتھ
    قبلہ کی سمت کے خطوط ہیں۔ قرص کو اس وقت گھماؤ جب تک وہ شمال سے میل کر لے، اور تم کنارے پر لکھے کسی بھی شہر کے لیے مکہ کی
    سمت پڑھ سکتے ہو۔ جنوب کے نقطے کے نیچے ایک چھوٹی سے دھوپ گھڑی ہے جس کی چھڑی اپنے سائے سے وقت ناپتی ہے۔ اسی طرح الوفائی
    نے قاہرہ میں مسافر کو دو آلات اٹھانے سے بچایا۔'
