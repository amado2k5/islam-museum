summary:
  ar: "خيمة كانت للصحابية رفيدة الأنصارية الأسلمية في مسجد النبي بالمدينة، تداوي فيها الجرحى وتقوم بنفسها على خدمة من به حاجة من المسلمين. لما أصيب سعد بن معاذ بسهم يوم الخندق سنة 5هـ أمر النبي أن يُجعل فيها ليعوده من قريب {cite:ibn-hajar-isaba p. 566} {cite:ibn-hajar-isaba p. 1871}. وتعدّها موسوعة TDV الإسلامية أول بيمارستان في الإسلام ومستشفى حربياً متنقلاً، على حين ينسب المقريزي أول مستشفى في الإسلام إلى الوليد بن عبد الملك سنة 88هـ {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
  en: "A tent belonging to the Companion Rufayda al-Ansariyya al-Aslamiyya, pitched in the Prophet's mosque in Medina, where she treated the wounded and gave herself to the care of Muslims in need. When Sa'd ibn Mu'adh was struck by an arrow at the Battle of the Trench in 5 AH, the Prophet had him placed in it so that he could visit him from close by {cite:ibn-hajar-isaba p. 566} {cite:ibn-hajar-isaba p. 1871}. The TDV Encyclopedia of Islam calls it the first bimaristan in Islam, a mobile war hospital, while al-Maqrizi credits the first hospital in Islam to al-Walid ibn Abd al-Malik in 88 AH {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
  ur: "صحابیہ رفیدہ انصاریہ اسلمیہ کا ایک خیمہ جو مدینہ میں مسجدِ نبوی میں لگا تھا، جہاں وہ زخمیوں کا علاج کرتیں اور ضرورت مند مسلمانوں کی خدمت خود اپنے ذمے لیتی تھیں۔ جب 5ھ میں غزوۂ خندق کے دن سعد بن معاذ کو تیر لگا تو نبی نے انہیں اسی خیمے میں رکھوایا تاکہ قریب سے ان کی عیادت کر سکیں {cite:ibn-hajar-isaba p. 566} {cite:ibn-hajar-isaba p. 1871}۔ ٹی ڈی وی اسلامی انسائیکلوپیڈیا اسے اسلام کا پہلا بیمارستان اور ایک متحرک جنگی شفاخانہ کہتا ہے، جبکہ مقریزی اسلام کے پہلے شفاخانے کو 88ھ میں ولید بن عبد الملک سے منسوب کرتے ہیں {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}۔"
