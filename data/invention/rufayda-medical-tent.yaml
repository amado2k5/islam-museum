origin:
  place: place/medina
  context:
    ar: "كانت الخيمة في مسجد النبي بالمدينة، وفيها وُضع سعد بن معاذ حين أصيب أكحله يوم الخندق، فكان النبي إذا مرّ به سأله كيف أمسى وكيف أصبح {cite:ibn-hajar-isaba p. 1871}."
    en: "The tent stood in the Prophet's mosque in Medina. Sa'd ibn Mu'adh was placed there when the vein of his arm was struck at the Trench, and whenever the Prophet passed by he asked him how he was that evening or that morning {cite:ibn-hajar-isaba p. 1871}."
    ur: "یہ خیمہ مدینہ میں مسجدِ نبوی میں تھا۔ غزوۂ خندق کے دن جب سعد بن معاذ کی بازو کی رگ پر تیر لگا تو انہیں یہیں رکھا گیا، اور نبی جب بھی پاس سے گزرتے تو ان سے پوچھتے کہ شام کیسی گزری یا صبح کیسی ہوئی {cite:ibn-hajar-isaba p. 1871}۔"
makers:
  - person: person/rufayda-al-aslamiyya
    role: inventor
    place: place/medina
    note: "Kept the tent in the mosque and treated the wounded in it, giving herself to the care of Muslims in need (Ibn Hajar, citing Ibn Ishaq and al-Bukhari's al-Adab al-Mufrad). The TDV entry frames the tent as the first bimaristan, set up at the Prophet's instruction; the role recorded here is hers as the one who kept and ran it."
    sources: [source/ibn-hajar-isaba, source/tdv-bimaristan]
attribution:
  status: contested
  claim:
    ar: "خيمة رفيدة في المسجد النبوي، التي داوت فيها الجرحى، هي أول بيمارستان في الإسلام، وكانت مستشفى حربياً متنقلاً."
    en: "Rufayda's tent in the Prophet's mosque, where she treated the wounded, was the first bimaristan in Islam, a mobile war hospital."
    ur: "مسجدِ نبوی میں رفیدہ کا خیمہ، جہاں وہ زخمیوں کا علاج کرتی تھیں، اسلام کا پہلا بیمارستان اور ایک متحرک جنگی شفاخانہ تھا۔"
  basis:
    ar: "الوقائع ثابتة في كتب الصحابة: الخيمة لرفيدة، وكانت في المسجد، وكانت تداوي الجرحى، ووُضع فيها سعد بن معاذ يوم الخندق، وقد صحّح ابن حجر سند الخبر {cite:ibn-hajar-isaba pp. 1871–1872}. أما وصفها بأنها «أول بيمارستان» فهو قول موسوعة TDV، وهي نفسها تنقل عن المقريزي أن أول مستشفى في الإسلام أسسه الوليد بن عبد الملك سنة 88هـ؛ فالخلاف في معنى «المستشفى» وفي الأولية، لا في الوقائع {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    en: "The facts are settled in the dictionaries of the Companions: the tent was Rufayda's, it stood in the mosque, she treated the wounded in it, and Sa'd ibn Mu'adh was placed there at the Trench; Ibn Hajar calls the chain of the report sound {cite:ibn-hajar-isaba pp. 1871–1872}. Calling it 'the first bimaristan' is the TDV encyclopedia's description, and the same entry reports al-Maqrizi's statement that the first hospital in Islam was founded by al-Walid ibn Abd al-Malik in 88 AH. The disagreement is over what counts as a hospital and over priority, not over what happened {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    ur: "واقعات صحابہ کی کتابوں میں ثابت ہیں: خیمہ رفیدہ کا تھا، مسجد میں تھا، وہ اس میں زخمیوں کا علاج کرتی تھیں، اور خندق کے دن سعد بن معاذ کو اسی میں رکھا گیا؛ ابن حجر اس روایت کی سند کو صحیح کہتے ہیں {cite:ibn-hajar-isaba pp. 1871–1872}۔ اسے «پہلا بیمارستان» کہنا ٹی ڈی وی انسائیکلوپیڈیا کا بیان ہے، اور اسی مقالے میں مقریزی کا قول بھی نقل ہے کہ اسلام کا پہلا شفاخانہ 88ھ میں ولید بن عبد الملک نے قائم کیا۔ اختلاف اس میں ہے کہ شفاخانہ کسے کہا جائے اور اولیت کس کی ہے، واقعات میں نہیں {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}۔"
  perspectives:
    - tradition: sunni
      id: sunni-isaba
      standing: main
      summary:
        ar: "يذكر ابن حجر في الإصابة، نقلاً عن ابن إسحاق والبخاري في الأدب المفرد، أن رفيدة كانت تداوي الجرحى وتحتسب نفسها على خدمة من به حاجة من المسلمين، وأن سعد بن معاذ وُضع في خيمتها التي في المسجد؛ ويصف الخبر ولا يسمّي الخيمة مستشفى ولا يحكم بأوليتها."
        en: "Ibn Hajar's al-Isaba, citing Ibn Ishaq and al-Bukhari's al-Adab al-Mufrad, says Rufayda treated the wounded and gave herself to the care of Muslims in need, and that Sa'd ibn Mu'adh was placed in her tent in the mosque. It describes what happened without calling the tent a hospital or ruling on its priority."
        ur: "ابن حجر الاصابہ میں ابن اسحاق اور بخاری کی الادب المفرد کے حوالے سے لکھتے ہیں کہ رفیدہ زخمیوں کا علاج کرتیں اور ضرورت مند مسلمانوں کی خدمت اپنے ذمے لیتیں، اور سعد بن معاذ کو مسجد میں ان کے خیمے میں رکھا گیا۔ وہ واقعہ بیان کرتے ہیں، خیمے کو شفاخانہ نہیں کہتے اور اس کی اولیت پر کوئی حکم نہیں لگاتے۔"
      holders: [person/ibn-hajar-al-asqalani]
      sources: [source/ibn-hajar-isaba]
    - tradition: sunni
      id: sunni-maqrizi
      standing: secondary
      summary:
        ar: "ينقل المقريزي في الخطط أن أول من بنى مستشفى في الإسلام هو الخليفة الأموي الوليد بن عبد الملك سنة 88هـ/707م، وأنه جعل فيه أطباء وأجرى عليهم الأرزاق، وأمر بحبس المجذومين وأجرى عليهم وعلى العميان الأرزاق؛ فالأولية عنده لمنشأة دائمة."
        en: "Al-Maqrizi writes in his Khitat that the first to build a hospital in Islam was the Umayyad caliph al-Walid ibn Abd al-Malik in 88/707, who appointed physicians to it on salaries, had lepers kept apart, and gave provisions to lepers and the blind. For him, priority belongs to a permanent establishment."
        ur: "مقریزی الخطط میں لکھتے ہیں کہ اسلام میں پہلا شفاخانہ اموی خلیفہ ولید بن عبد الملک نے 88ھ/707ء میں بنایا، اس میں طبیب مقرر کر کے ان کی تنخواہیں جاری کیں، جذامیوں کو الگ رکھنے کا حکم دیا اور جذامیوں اور نابیناؤں کے لیے وظیفے مقرر کیے۔ ان کے نزدیک اولیت ایک مستقل ادارے کی ہے۔"
      holders: [person/al-maqrizi]
      sources: [source/tdv-bimaristan]
    - tradition: academic
      id: academic-tdv
      standing: main
      summary:
        ar: "تقول موسوعة TDV الإسلامية إن أول بيمارستان في الإسلام أقامه النبي مستشفى حربياً متنقلاً لسعد بن معاذ وسائر الجرحى في غزوة الخندق، في خيمة رفيدة، معتمدة على ابن هشام وعلى تاريخ البيمارستانات لأحمد عيسى؛ ثم تنقل قول المقريزي في الوليد دون أن توفّق بين القولين."
        en: "The TDV Encyclopedia of Islam says the first bimaristan in Islam was set up by the Prophet as a mobile war hospital for Sa'd ibn Mu'adh and the other wounded at the Trench, in Rufayda's tent, relying on Ibn Hisham and on Ahmad Isa's history of the bimaristans. It then reports al-Maqrizi's statement about al-Walid without reconciling the two."
        ur: "ٹی ڈی وی اسلامی انسائیکلوپیڈیا کہتا ہے کہ اسلام کا پہلا بیمارستان نبی نے غزوۂ خندق میں سعد بن معاذ اور دوسرے زخمیوں کے لیے رفیدہ کے خیمے میں ایک متحرک جنگی شفاخانے کے طور پر قائم کیا، اور اس میں ابن ہشام اور احمد عیسیٰ کی تاریخ البیمارستانات پر اعتماد کرتا ہے؛ پھر ولید کے بارے میں مقریزی کا قول نقل کرتا ہے اور دونوں میں تطبیق نہیں دیتا۔"
      sources: [source/tdv-bimaristan]
precursors:
  - external: { ar: "بيمارستان جنديسابور", en: "The hospital of Jundishapur", ur: "جندی شاپور کا شفاخانہ" }
    note: "TDV says the Sasanian hospital and medical school of Jundishapur, where the Prophet-era physician al-Harith ibn Kalada studied, was known as a bimaristan, which helped the word take hold among the Arabs early on. The source draws no line from it to Rufayda's tent."
    sources: [source/tdv-bimaristan]
dependents:
  - external: { ar: "مستشفى الوليد بن عبد الملك (88هـ/707م)", en: "Al-Walid ibn Abd al-Malik's hospital (88/707)", ur: "ولید بن عبد الملک کا شفاخانہ (88ھ/707ء)" }
    note: "The permanent establishment al-Maqrizi calls the first hospital in Islam, with salaried physicians and provision for lepers and the blind; reported by TDV from al-Khitat II, 405. A later hospital, not shown to derive from the tent."
    sources: [source/tdv-bimaristan]
  - external: { ar: "بيمارستان هارون الرشيد في بغداد", en: "Harun al-Rashid's bimaristan in Baghdad", ur: "بغداد میں ہارون الرشید کا بیمارستان" }
    note: "TDV says Harun al-Rashid had a hospital built in Baghdad on the model of Jundishapur and that it served as a model for later bimaristans in Baghdad and other cities."
    sources: [source/tdv-bimaristan]
  - external: { ar: "البيمارستان المتنقل في سواد العراق", en: "The mobile bimaristan sent to the villages of lower Iraq", ur: "زیریں عراق کے دیہات میں بھیجا گیا متحرک بیمارستان" }
    note: "TDV reports that the Abbasid vizier Ali ibn Isa sent a mobile hospital with physicians to the villages of the Sawad, which treated Muslims and non-Muslims alike, so that the bimaristans of that age can be divided into mobile and fixed. The source does not link it to Rufayda's tent."
    sources: [source/tdv-bimaristan]
