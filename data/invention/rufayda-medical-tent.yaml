kids:
  ar: "في المدينة، قبل نحو ألف وأربعمئة سنة، كانت امرأة اسمها رفيدة تنصب خيمة في المسجد. كانت تداوي فيها الجرحى وتعتني بهم. ولما جُرح سعد بن معاذ في المعركة حملوه إلى خيمتها، فصار النبي يمرّ عليه كل صباح ومساء ويسأله: كيف حالك؟ {cite:ibn-hajar-isaba p. 1871}"
  en: "In Medina, about fourteen hundred years ago, a woman named Rufayda kept a tent in the mosque. There she treated the wounded and looked after them. When Sa'd ibn Mu'adh was hurt in battle, they carried him to her tent, and the Prophet stopped by every morning and evening to ask him: how are you? {cite:ibn-hajar-isaba p. 1871}"
  ur: "تقریباً چودہ سو سال پہلے مدینہ میں رفیدہ نام کی ایک خاتون مسجد میں ایک خیمہ لگاتی تھیں۔ وہ اس میں زخمیوں کا علاج اور دیکھ بھال کرتی تھیں۔ جب سعد بن معاذ جنگ میں زخمی ہوئے تو انہیں ان کے خیمے میں لایا گیا، اور نبی ہر صبح و شام ان کے پاس سے گزرتے اور پوچھتے: کیسے ہو؟ {cite:ibn-hajar-isaba p. 1871}"
