today:
  form:
    ar: "الخيمة نفسها لم تبق، وصار لما كانت تؤديه اسم آخر: تذكر موسوعة TDV أن العالم العربي اليوم يستعمل لفظ «المستشفى»، بعد أن تعاقبت ألفاظ البيمارستان ودار الشفاء ودار الصحة {cite:tdv-bimaristan introduction}."
    en: "The tent itself did not survive, and what it did now goes by other names: the TDV entry notes that the Arab world today uses the word mustashfa, after a succession of terms such as bimaristan, dar al-shifa and dar al-sihha {cite:tdv-bimaristan introduction}."
    ur: "خود خیمہ باقی نہیں رہا، اور جو کام وہ کرتا تھا اب دوسرے ناموں سے جانا جاتا ہے: ٹی ڈی وی کے مطابق آج عرب دنیا میں «مستشفیٰ» کا لفظ عام ہے، اس سے پہلے بیمارستان، دار الشفاء اور دار الصحہ جیسے نام رائج رہے {cite:tdv-bimaristan introduction}۔"
  descendants:
    ar: "تعدّ موسوعة TDV البيمارستانات الإسلامية التي تلت، من مستشفيات بغداد ودمشق والقاهرة إلى دور الشفاء السلجوقية والعثمانية، تاريخاً يبدأ بهذه الخيمة، من غير أن تثبت صلة مباشرة بينها {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    en: "The TDV encyclopedia tells the history of the Islamic bimaristans that followed, from the hospitals of Baghdad, Damascus and Cairo to the Seljuk and Ottoman houses of healing, as a story that begins with this tent, without establishing a direct link between them {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    ur: "ٹی ڈی وی انسائیکلوپیڈیا بعد کے اسلامی بیمارستانوں کی تاریخ، بغداد، دمشق اور قاہرہ کے شفاخانوں سے سلجوقی اور عثمانی دار الشفاؤں تک، اسی خیمے سے شروع کرتا ہے، اگرچہ ان کے درمیان کوئی براہِ راست تعلق ثابت نہیں کرتا {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}۔"
