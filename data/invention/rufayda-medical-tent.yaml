impact:
  fields: [medicine-surgery, institutions-systems]
  changed:
    ar: "جعلت مداواة الجرحى في مكان واحد معروف قريب من الناس، في المسجد نفسه، يقوم عليه شخص يتفرغ لخدمتهم، فيُحمل إليه الجريح ويُعاد فيه صباحاً ومساءً {cite:ibn-hajar-isaba p. 1871}."
    en: "It gave the care of the wounded one known place close to everyone, in the mosque itself, run by someone who gave herself to the work: the wounded were brought there and visited morning and evening {cite:ibn-hajar-isaba p. 1871}."
    ur: "اس نے زخمیوں کے علاج کو ایک معلوم جگہ دی جو سب کے قریب تھی، خود مسجد میں، اور جس کی ذمہ داری ایک ایسی خاتون پر تھی جنہوں نے خود کو اس کام کے لیے وقف کر رکھا تھا: زخمی وہاں لائے جاتے اور صبح و شام ان کی عیادت ہوتی {cite:ibn-hajar-isaba p. 1871}۔"
  history:
    ar: "يفتتح بها تاريخ البيمارستانات في موسوعة TDV الإسلامية، ثم يمضي إلى مستشفيات الأمويين والعباسيين التي قسمها إلى ثابتة ومتنقلة {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    en: "The TDV encyclopedia opens its history of the bimaristans with it, then moves on to the Umayyad and Abbasid hospitals, which it divides into fixed and mobile {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    ur: "ٹی ڈی وی انسائیکلوپیڈیا بیمارستانوں کی تاریخ کا آغاز اسی سے کرتا ہے، پھر اموی اور عباسی شفاخانوں کی طرف جاتا ہے جنہیں وہ مستقل اور متحرک میں تقسیم کرتا ہے {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}۔"
  significance: 3
  why: "The earliest care-place for the wounded recorded in the Companion dictionaries and the opening of the bimaristan story in a major encyclopedia; its rank as 'the first hospital' depends on the definition and is disputed by al-Maqrizi's account, which keeps it in the middle of the scale."
