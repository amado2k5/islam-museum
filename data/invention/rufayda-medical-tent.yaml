    note: "Ibn Hajar places the tent in the story of Sa'd ibn Mu'adh's wound at the Trench, and in Sa'd's own entry says he lived a month after the arrow struck him and died in the year 5 {cite:ibn-hajar-isaba p. 1871} {cite:ibn-hajar-isaba p. 566}. The Gregorian years are a conversion of 5 AH and are marked derived."
