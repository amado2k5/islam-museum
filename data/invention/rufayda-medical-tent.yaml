id: invention/rufayda-medical-tent
class: invention
label:
  ar: "خيمة رفيدة لمداواة الجرحى"
  en: "Rufayda's tent for the wounded"
  ur: "زخمیوں کے علاج کے لیے رفیدہ کا خیمہ"
names:
  - { value: "خيمة رفيدة", kind: alternate, lang: ar }
  - { value: "Rufayda's tent", kind: alternate, lang: en }
