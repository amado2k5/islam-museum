summary:
  ar: "شرح وتجربة لقياس الأرض بارتفاع جبل وانخفاض الأفق في تحديد الأماكن416/1025؛ يسمي النص سنَد بن علي سابقاً، وتبقى دقة التحويل الحديث محل بحث {cite:biruni-tahdid-ali-translation pp. 183–189} {cite:tdv-biruni-tumer works} {cite:maslikov-biruni-earth-2019 abstract}."
  en: "Mountain-height/horizon-dip derivation and experiment in Tahdid416/1025; the text names Sanad ibn Ali's predecessor and modern accuracy remains debated {cite:biruni-tahdid-ali-translation pp. 183–189} {cite:tdv-biruni-tumer works} {cite:maslikov-biruni-earth-2019 abstract}."
  ur: "تحدید416/1025 میں پہاڑ کی اونچائی اور افق کے جھکاؤ سے زمین ناپنے کی توضیح اور تجربہ؛ متن سند بن علی کو سابق کہتا ہے، جدید صحت مختلف فیہ ہے {cite:biruni-tahdid-ali-translation pp. 183–189} {cite:tdv-biruni-tumer works} {cite:maslikov-biruni-earth-2019 abstract}۔"
