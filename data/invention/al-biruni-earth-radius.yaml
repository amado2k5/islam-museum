origin:
  polity: polity/ghaznavid-empire
  context:
    ar: "سياق البيروني الغزنوي؛ يصف جبلًا غربي حصن نندنة وسهلًا جنوبيه، ولا نختلق إحداثيات أو سنة بعينها لتلك المشاهدة {cite:tdv-biruni-tumer biography} {cite:biruni-tahdid-ali-translation pp. 188–189}."
    en: "Al-Biruni's Ghaznavid context; he describes a mountain west of Nandana fort and a plain to its south, without our inventing coordinates or an exact observation year {cite:tdv-biruni-tumer biography} {cite:biruni-tahdid-ali-translation pp. 188–189}."
    ur: "بیرونی کا غزنوی سیاق؛ وہ قلعۂ نندنہ کے مغرب کا پہاڑ اور اس کے جنوب کا میدان بتاتے ہیں، ہم مختصات یا مشاہدے کا قطعی سال نہیں گھڑتے {cite:tdv-biruni-tumer biography} {cite:biruni-tahdid-ali-translation pp. 188–189}۔"
makers:
  - person: person/al-biruni-muhammad-ibn-ahmad
    role: describer
    note: "Documented geometrical exposition and first-person Nandana application, not unqualified priority over the Sanad ibn Ali account preserved in the same text. Explicit Muslim biography; disputed personal affiliation is labelled on the maker, Sunni reading first."
    sources: [source/biruni-tahdid-ali-translation, source/britannica-al-biruni, source/tdv-biruni-tumer]
attribution:
  status: contested
  claim:
    ar: "ينسب إلى البيروني ابتكار قياس الأرض من جبل؛ يوثق هذا السجل شرحه وتطبيقه لا أسبقية مطلقة."
    en: "Often credited with inventing mountain-based Earth measurement; this record documents his exposition/application, not absolute priority."
    ur: "پہاڑ سے زمین ناپنے کی ایجاد بیرونی سے منسوب ہے؛ یہ اندراج ان کی توضیح و اطلاق دکھاتا ہے، مطلق سبقت نہیں۔"
  basis:
    ar: "تقول مقدمة المترجم ابتكاره، لكن متن الكتاب يروي أن سنَد بن علي طبق المبدأ بأمر المأمون؛ وقيمته الحديثة بالكيلومتر ليست تحولاً محسوماً للذراع المحلي {cite:biruni-tahdid-ali-translation preface xi; pp. 185–189} {cite:maslikov-biruni-earth-2019 abstract}."
    en: "Translator's preface calls it his invention, but the text reports Sanad ibn Ali applying the principle for al-Ma'mun; modern kilometre values are not settled conversions of the local cubit {cite:biruni-tahdid-ali-translation preface xi; pp. 185–189} {cite:maslikov-biruni-earth-2019 abstract}."
    ur: "مترجم کا مقدمہ اسے ان کی ایجاد کہتا ہے، مگر متن مامون کے حکم پر سند بن علی کا یہی اصول بتاتا ہے؛ جدید کلومیٹر مقامی ذراع کی قطعی تبدیلی نہیں {cite:biruni-tahdid-ali-translation preface xi; pp. 185–189} {cite:maslikov-biruni-earth-2019 abstract}۔"
  perspectives:
