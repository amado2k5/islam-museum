label: { ar: "قياس نصف قطر الأرض بالجبل والأفق عند البيروني", en: "Al-Biruni's mountain-and-horizon Earth measurement", ur: "بیرونی کی پہاڑ اور افق سے زمین کی پیمائش" }
names:
