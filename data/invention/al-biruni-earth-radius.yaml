impact:
  fields: [navigation-geography, mathematics]
  changed:
    ar: "جعل قياساً محلياً للارتفاع وزاوية صغيرة مدخلاً إلى مقدار عالمي، ببرهان وتطبيق عددي موثقين؛ لا نثبت تداولاً شعبياً {cite:biruni-tahdid-ali-translation pp. 183–189}."
    en: "Connected local height and a small angle to a global quantity through documented geometry/numerical application, without claiming popular adoption {cite:biruni-tahdid-ali-translation pp. 183–189}."
    ur: "مقامی اونچائی اور چھوٹے زاویے کو مستند ہندسے و عددی اطلاق سے عالمی مقدار سے جوڑا، عام مقبول استعمال کا دعویٰ نہیں {cite:biruni-tahdid-ali-translation pp. 183–189}۔"
  history:
    ar: "شاهد على كتابة ممارسة القياس وربطها بالبرهان، لا أول إثبات لكروية الأرض ولا نسب مباشر إلى الجيوديسيا الفضائية {cite:biruni-tahdid-ali-translation pp. 183–189} {cite:maslikov-biruni-earth-2019 abstract}."
    en: "A witness to recording measurement practice alongside proof, not the first demonstration of Earth's sphericity or direct satellite-geodesy lineage {cite:biruni-tahdid-ali-translation pp. 183–189} {cite:maslikov-biruni-earth-2019 abstract}."
    ur: "پیمائش کی مشق اور برہان کو ساتھ لکھنے کا شاہد، زمین کی گولائی کا پہلا ثبوت یا خلائی ارض پیمائی کا براہ راست نسب نہیں {cite:biruni-tahdid-ali-translation pp. 183–189} {cite:maslikov-biruni-earth-2019 abstract}۔"
  significance: 4
  why: "Substantial documented method with explicit geometry, instrument procedure and numerical field account; importance rests on that evidence, not unverified mass adoption or spectacular accuracy."
