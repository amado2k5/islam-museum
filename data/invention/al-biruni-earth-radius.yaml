kids:
  ar: "من قمة مرتفعة يبدو الأفق أخفض من الخط الأفقي. جمع البيروني ارتفاع الجبل وزاوية الانخفاض وهندسة المثلث ليسأل عن حجم الأرض؛ لم يحتج إلى السير حولها، ولم يكن أول من عرف أنها كرة."
  en: "From a summit the horizon lies below a horizontal line. Al-Biruni combined mountain height, dip angle and triangle geometry to ask Earth's size, without walking around it or being the first to know it was spherical."
  ur: "چوٹی سے افق افقی لکیر سے نیچے ہے۔ بیرونی نے اونچائی، جھکاؤ اور مثلث سے زمین کا حجم پوچھا؛ پوری زمین گھومنے کی ضرورت نہیں، نہ وہ اس کی گولائی جاننے والے پہلے تھے۔"
