        en: "Explicit Sunni frame preserves the Muslim contribution and named predecessor; personal affiliation is disputed on the maker, not used to settle mathematical history {cite:tdv-biruni-tumer religious-affiliation discussion} {cite:biruni-tahdid-ali-translation pp. 185–189}."
        ur: "واضح سنی سیاق مسلم حصہ اور نام زد سابق محفوظ رکھتا ہے؛ شخصی نسبت کا اختلاف عالم کے اندراج میں ہے، مسلک ریاضی کی تاریخ کا فیصلہ نہیں {cite:tdv-biruni-tumer religious-affiliation discussion} {cite:biruni-tahdid-ali-translation pp. 185–189}۔"
      sources: [source/tdv-biruni-tumer, source/biruni-tahdid-ali-translation]
    - tradition: academic
      id: translator-invention-claim
      standing: main
      summary:
        ar: "يصف جميل علي في مقدمته طريقة استخراج المحيط بقياس الانخفاض بأنها من ابتكارات المؤلف؛ هذا حكم المترجم، لا حذف لرواية السابق في المتن {cite:biruni-tahdid-ali-translation preface xi}."
        en: "Jamil Ali's preface calls circumference measurement from horizon dip the author's invention; that is the translator's assessment, not erasure of the predecessor in the text {cite:biruni-tahdid-ali-translation preface xi}."
        ur: "جمیل علی کا مقدمہ افق کے جھکاؤ سے محیط ناپنا مصنف کی ایجاد کہتا ہے؛ یہ مترجم کی رائے ہے، متن کے سابق کا حذف نہیں {cite:biruni-tahdid-ali-translation preface xi}۔"
      sources: [source/biruni-tahdid-ali-translation]
    - tradition: academic
      id: primary-priority-limit
      standing: main
      summary:
        ar: "ينسب المتن تطبيق المبدأ نفسه إلى سنَد بن علي زمن المأمون؛ ثم يفصل البيروني الهندسة وتجربته بنندنة، فيثبت شاهداً غنياً لا برهان الأولية المطلقة {cite:biruni-tahdid-ali-translation pp. 185–189}."
        en: "The text reports Sanad ibn Ali using the same principle under al-Ma'mun, then gives al-Biruni's geometry and Nandana experiment: rich documentation, not proof of absolute firstness {cite:biruni-tahdid-ali-translation pp. 185–189}."
        ur: "متن مامون کے دور میں سند بن علی کا یہی اصول بتاتا، پھر بیرونی کا ہندسہ اور نندنہ کا تجربہ دیتا ہے: بھرپور شہادت، مطلق اولیت کا ثبوت نہیں {cite:biruni-tahdid-ali-translation pp. 185–189}۔"
      sources: [source/biruni-tahdid-ali-translation]
    - tradition: academic
      id: modern-accuracy-assessments
      standing: main
      summary:
        ar: "تنقل ماكتوتر6339.6كم بإعجاب، فيما يحذر ملخص ماسليكوف من الدقة المضخمة ووحدة الطول غير المحسومة؛ لا نسوي بينهما بتحويل مخترع {cite:biruni-mactutor geodesy paragraph} {cite:maslikov-biruni-earth-2019 abstract}."
        en: "MacTutor favourably reports6339.6km; Maslikov's abstract cautions against exaggerated accuracy and unresolved length units. No invented conversion reconciles them {cite:biruni-mactutor geodesy paragraph} {cite:maslikov-biruni-earth-2019 abstract}."
        ur: "میک ٹیوٹر تعریف سے6339.6کلومیٹر بتاتا ہے؛ ماسلیکوف کا خلاصہ مبالغہ آمیز صحت اور غیر طے شدہ اکائی سے خبردار کرتا ہے؛ کوئی گھڑی تبدیلی ان کو نہیں ملاتی {cite:biruni-mactutor geodesy paragraph} {cite:maslikov-biruni-earth-2019 abstract}۔"
      sources: [source/biruni-mactutor, source/maslikov-biruni-earth-2019]
