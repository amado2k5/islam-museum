origin:
  place: place/yazd
  polity: polity/sasanian-empire
  context:
    ar: 'هضبة إيران الوسطى وصحاريها ⁦(يزد وكرمان ودشت لوت ودشت كوير)⁩
      حيث بنى مهندسو فارس مخازن الثلج القبوية منذ القدم؛ وفي الخلافة
      صار الثلج بضاعة مدنية: ثلاج بغداد الذي باع التاهري، وأربعون ألف
      رطل ثلج عند ابن الفرات، وحفر ساوة وآبه في الجبل التي وثقها حمد
      الله المستوفي {cite:wikipedia-yakhchal-en}
      {cite:encyclopaedia-of-islam-2}.'
    en: 'The central Iranian plateau and its deserts ⁦(Yazd, Kerman,
      the Dasht-e Lut and Dasht-e Kavir)⁩, where Persian engineers
      built domed ice stores since antiquity; under the caliphate ice
      became an urban commodity: the Baghdad thalladj who sold to the
      Tahirid governor, Ibn al-Furat''s forty-thousand-pound service,
      and the freezing pits of Sawa and Aba in Jibal recorded by Hamd
      Allah Mustawfi {cite:wikipedia-yakhchal-en}
      {cite:encyclopaedia-of-islam-2}.'
    ur: 'وسطی ایرانی سطحِ مرتفع اور اس کے صحرا ⁦(یزد، کرمان، دشتِ لوت
      اور دشتِ کویر)⁩ جہاں فارسی انجینیئروں نے قدیم زمانے سے گنبدی برف
      خانے بنائے؛ خلافت کے زمانے میں برف شہری مال بنی: طاہری گورنر کو
      بیچنے والا بغدادی ثلاج، ابن الفرات کی چالیس ہزار پاؤنڈ برف کی
      ضیافت، اور جبال میں ساوہ و آبہ کے جمتے گڑھے جنہیں حمد اللہ
      مستوفی نے لکھا {cite:wikipedia-yakhchal-en}
      {cite:encyclopaedia-of-islam-2}۔'
makers:
- person: person/hamdallah-mustawfi
  role: describer
  place: place/qazvin
  note: 'The Ilkhanid geographer whose Nuzhat al-Qulub records the
    people of Sawa and Aba in Jibal freezing water in winter pits for
    summer use — the pit-ice practice at the heart of the yakhchal
    economy; a witness to the technology, not its builder.'
  sources:
  - source/encyclopaedia-of-islam-2
attribution:
  status: transmission
  claim:
    ar: 'اليخچال صنعة فارسية قديمة تبناها الحضر الإسلامي وحملها:
      تجارة ثلج الخلافة في العراق والشام ومصر، وحفر الجبل الموثقة،
      ثم برف خانة البلاط المغولي في الهند — انتقال وتوظيف لا ابتكار
      {cite:encyclopaedia-of-islam-2} {cite:wikipedia-yakhchal-en}.'
    en: 'The yakhchal is an old Persian craft the Islamic urban world
      adopted and carried: the caliphate''s ice trade in Iraq, Syria
      and Egypt, the documented Jibal freezing pits, then the baraf
      khana of the Mughal court in India — transmission and use, not
      invention {cite:encyclopaedia-of-islam-2}
      {cite:wikipedia-yakhchal-en}.'
    ur: 'یخچال قدیم فارسی دستکاری ہے جسے اسلامی شہری دنیا نے اپنایا اور
      آگے پہنچایا: عراق، شام اور مصر میں خلافت کی برف تجارت، جبال کے
      مستند جمتے گڑھے، پھر ہندوستان میں مغل دربار کا برف خانہ — منتقلی
      اور استعمال، ایجاد نہیں {cite:encyclopaedia-of-islam-2}
      {cite:wikipedia-yakhchal-en}۔'
  basis:
    ar: 'سجلات تؤرخ البنية لنحو 400 ق.م، والإسلامية تشهدها اقتصاداً:
      حديث الثلج البارد، بائع الثلج البغدادي ⁦(ت 300/913)⁩، مؤن ابن
      الفرات وابن بكية، جبال الغرب الفارسي وكردستان مصدراً، وهرمون
      «جبل الثلج» لسورية ومصر، وحفر ساوة وآبه عند المستوفي
      {cite:encyclopaedia-of-islam-2} {cite:wikipedia-yakhchal-en}.'
    en: 'Records date the structures to about 400 BCE; the Islamic era
      witnesses it as an economy: the snow-cooling sayings, the
      Baghdad ice-seller ⁦(d. 300/913 governor)⁩, the Ibn al-Furat and
      Ibn Bakiyya provisions, western Persian and Kurdish mountains
      as sources, Hermon as "Jabal al-Thalj" supplying Syria and
      Egypt, and the Sawa and Aba pits in Mustawfi
      {cite:encyclopaedia-of-islam-2} {cite:wikipedia-yakhchal-en}.'
    ur: 'شواہد عمارت کو تقریباً 400 ق م تک مؤرخ کرتے ہیں؛ اسلامی دور
      اسے معیشت کے طور پر پیش کرتا ہے: برف سے ٹھنڈک کی دعائیں، بغدادی
      ثلاج ⁦(گورنر ت 300/913)⁩، ابن الفرات اور ابن بکیہ کی فراہمیاں،
      مغربی فارس اور کردستان کے پہاڑ بطور ماخذ، شام و مصر کے لیے
      «جبل الثلج» حرمون، اور مستوفی میں ساوہ و آبہ کے گڑھے
      {cite:encyclopaedia-of-islam-2} {cite:wikipedia-yakhchal-en}۔'
