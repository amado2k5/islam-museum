summary:
  ar: مخزن ثلج قبوي مخروطي من الطوب والمونة المقاومة ⁦(الساروج)⁩ فوق
    حجرة تخزين تحت الأرض، يعمل بالتبريد الإشعاعي والتبخيري في صحاري
    إيران — جدرانه بسماكة مترين، وظلال شرقية-غربية تظلل أحواض تجميد
    ليلية، ويقترن أحياناً بالقنوات والبادجيرات؛ سجله التراث الإسلامي
    تجارة ثلج بلادية من بغداد إلى جبال الجبل، وتبنته بلاطات المغول
    «برف خانة» {cite:wikipedia-yakhchal-en}
    {cite:encyclopaedia-of-islam-2}.
  en: A conical domed ice store of brick and water-resistant sarooj
    mortar over an underground chamber, working by radiative and
    evaporative cooling in the Iranian deserts — walls two metres
    thick at the base, east-west shade walls over night-freezing
    pools, often paired with qanats and windcatchers; the Islamic-era
    record is an urban ice trade from Baghdad to the Jibal pits, and
    the Mughal courts adopted the technology as the baraf khana
    {cite:wikipedia-yakhchal-en} {cite:encyclopaedia-of-islam-2}.
  ur: اینٹ اور پانی روک ساروج ملاوٹ کا مخروطی گنبد برف خانہ جو زیرِ
    زمین خانے پر کھڑا ہے اور ایران کے صحراؤں میں اشعاعی اور بخاراتی
    ٹھنڈک سے چلتا ہے — بنیاد پر دو میٹر موٹی دیواریں، مشرق-مغرب سایہ
    دیواریں جن کے نیچے رات کو پانی جمتا ہے، اکثر قنات اور بادگیر کے
    ساتھ؛ اسلامی دور میں یہ بغداد سے جبال کے گڑھوں تک شہری برف تجارت
    کا ثبوت ہے، اور مغل درباروں نے اسے برف خانے کے نام سے اپنایا
    {cite:wikipedia-yakhchal-en} {cite:encyclopaedia-of-islam-2}۔
  es: "Un almacén de hielo cónico abovedado de ladrillo y mortero sarooj resistente al agua sobre una cámara subterránea, que funciona mediante enfriamiento radiativo y evaporativo en los desiertos iraníes: paredes de dos metros de espesor en la base, paredes de sombra de este a oeste sobre piscinas de congelación nocturna, a menudo combinadas con qanats y captadores de viento; el registro de la era islámica es un comercio urbano de hielo desde Bagdad hasta los pozos de Jibal, y las cortes mogolas adoptaron la tecnología como baraf khana {cite:wikipedia-yakhchal-en} {cite:encyclopaedia-of-islam-2}."
