    status: historical
    note: 'The Islamic-era attestation: EI2 THALLADJ records a Baghdad
      ice-seller enriched by sales to the Tahirid governor Ubayd Allah
      ibn Abd Allah ibn Tahir (d. 300/913), and Hamd Allah Mustawfi
      records the people of Sawa and Aba in Jibal letting water freeze
      in winter pits for summer use. Records indicate the structures
      themselves as far back as 400 BCE; this date marks the documented
      caliphal ice economy, not the type''s invention. The hijri
      figure is a derived conversion.'
