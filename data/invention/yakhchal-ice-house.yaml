  changed:
    ar: 'جعل البرودة موسمية التخزين: ثلج الشتاء محفوظاً لصيف الصحراء —
      حفظ طعام وشراب مثلج وحلويات كالفالوده، بلا طاقة سوى هندسة
      الفيزياء الصحراوية {cite:wikipedia-yakhchal-en}.'
    en: 'It made cold a stored season: winter ice kept for the desert
      summer — preserved food, chilled drinks and faloodeh-style
      sweets, powered only by the physics of the dry climate
      {cite:wikipedia-yakhchal-en}.'
    ur: 'اس نے ٹھنڈک کو ذخیرہ شدہ موسم بنا دیا: صحرائی گرمی کے لیے
      سردیوں کی برف محفوظ — خوراک کی حفاظت، ٹھنڈے مشروبات اور فالودہ
      جیسی مٹھائیاں، محض خشک آب و ہوا کے طبیعیات سے چلنے والی
      {cite:wikipedia-yakhchal-en}۔'
  history:
    ar: 'مد سلسلة برد قروناً: من حفر ساوة إلى كرم النبلاء البغداديين
      إلى كلفي البلاط المغولي — تقنية ثلج مشتركة خدمت الخلافة
      والسلطنة والإمبراطورية {cite:encyclopaedia-of-islam-2}
      {cite:wikipedia-yakhchal-en}.'
    en: 'It stretched a cold chain for centuries: from the pits of
      Sawa to the Baghdad notables'' ice service to the Mughal
      court''s kulfi — a shared ice technology serving caliphate,
      sultanate and empire {cite:encyclopaedia-of-islam-2}
      {cite:wikipedia-yakhchal-en}.'
    ur: 'اس نے صدیوں تک ٹھنڈک کی زنجیر بڑھائی: ساوہ کے گڑھوں سے بغداد
      کے اشراف کی برف ضیافت تک، اور مغل دربار کی قلفی تک — مشترک برف
      تکنیک جس نے خلافت، سلطنت اور سلطنتِ مغلیہ کی خدمت کی
      {cite:encyclopaedia-of-islam-2} {cite:wikipedia-yakhchal-en}۔'
  significance: 3
  why: 'The desert refrigerator: passive cooling at civilisational
