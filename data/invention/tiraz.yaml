label:
  ar: "الطراز ⁦(شارة الخلافة المكتوبة على النسيج والقراطيس)⁩"
  en: "Tiraz (the caliphate's written mark on cloth and papyrus)"
  ur: "طراز (کپڑے اور قرطاس پر خلافت کی لکھی ہوئی علامت)"
