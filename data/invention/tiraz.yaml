  en: "About thirteen hundred years ago, royal clothes were decorated with a band showing pictures of kings. The caliph Abd al-Malik ibn Marwan ordered words in Arabic remembering God to be written instead. So weavers began making a band of beautiful letters called tiraz, with the caliph's name and a prayer for him, and pieces of it are still kept in museums."
