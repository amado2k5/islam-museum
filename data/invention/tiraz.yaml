today:
  form:
    ar: "انتهت دور الطراز، وبقيت قطع كثيرة منه في متاحف العالم، منها قطع من النصف الأول من القرن الثامن الميلادي، وعروضها بين سنتيمتر واحد وخمسة وخمسين سنتيمتراً {cite:tdv-tiraz pp. 112–114}."
    en: "The tiraz houses are gone, but many pieces survive in the world's museums, some from the first half of the eighth century, in bands from one to fifty-five centimetres wide {cite:tdv-tiraz pp. 112–114}."
    ur: "دار الطراز ختم ہو گئے، لیکن دنیا کے عجائب گھروں میں اس کے بہت سے ٹکڑے محفوظ ہیں، جن میں سے کچھ آٹھویں صدی عیسوی کے پہلے نصف کے ہیں، اور ان کی چوڑائی ایک سے پچپن سینٹی میٹر تک ہے {cite:tdv-tiraz pp. 112–114}۔"
  descendants:
