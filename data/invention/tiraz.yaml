summary:
  ar: "شريط من الكتابة يُنسج أو يُطرّز في الثياب الثمينة، فيه اسم الخليفة أو السلطان وكلمات من ذكر الله والدعاء، وتصنعه دور خاصة بالدولة تُسمّى دور الطراز. كان ملوك الفرس قبل الإسلام يجعلون في طرازهم صور الملوك، فجعل ملوك الإسلام مكانها الكتابة. والمصادر تجعل عبد الملك بن مروان أول من أحدث الكتابة الإسلامية في رؤوس الطوامير ⁦(لفائف القراطيس)⁩، وتذكر موسوعة TDV أنه أمر بترك الطراز اليوناني على نسيج مصر وكتابة التوحيد مكانه."
  en: "A band of writing woven or embroidered into fine garments, carrying the name of the caliph or sultan with words of remembrance of God and prayers, made in state workshops called houses of tiraz. Before Islam the Persian kings put images of kings in their tiraz; Muslim rulers put writing in their place. The sources make Abd al-Malik ibn Marwan the first to introduce Islamic writing at the head of papyrus rolls, and the TDV encyclopaedia records that he ordered the Greek tiraz on Egyptian cloth dropped and the declaration of God's oneness woven instead."
  ur: "تحریر کی ایک پٹی جو قیمتی کپڑوں میں بُنی یا کاڑھی جاتی، جس میں خلیفہ یا سلطان کا نام اور اللہ کے ذکر اور دعا کے کلمات ہوتے، اور جسے ریاست کے خاص کارخانے بناتے جنہیں دار الطراز کہا جاتا۔ اسلام سے پہلے فارس کے بادشاہ اپنے طراز میں بادشاہوں کی تصویریں بنواتے تھے؛ مسلمان حکمرانوں نے ان کی جگہ تحریر رکھی۔ مآخذ عبد الملک بن مروان کو طوامیر (قرطاس کے لپیٹے ہوئے طوماروں) کے سرے پر اسلامی تحریر شروع کرنے والا پہلا شخص بتاتے ہیں، اور ٹی ڈی وی انسائیکلوپیڈیا لکھتا ہے کہ انہوں نے مصر کے کپڑوں پر یونانی طراز ترک کر کے توحید کا کلمہ بُننے کا حکم دیا۔"
