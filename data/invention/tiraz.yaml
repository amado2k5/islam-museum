      ur: "صقلیہ کے نارمن بادشاہوں کا عربی طراز"
    note: "TDV: the Norman kings who ruled Sicily dressed for a long time like Muslim rulers, keeping the Arabic Kufic writing and wording of the tiraz unchanged."
    sources: [source/tdv-tiraz]
  - external:
      ar: "المزركش في دولة المماليك"
      en: "The Mamluk zarkash"
      ur: "مملوکوں کا زرکش"
    note: "Ibn Khaldun: in his own day the Turkish state of Egypt and Syria no longer wove tiraz in its palaces but ordered it from craftsmen in silk and pure gold, called it zarkash, and had the sultan's or emir's name drawn on it."
    sources: [source/muqaddima-ibn-khaldun]
spread: []
impact:
  fields: [materials-industry, institutions-systems]
  changed:
    ar: "صارت الكتابة العربية بذكر الله واسم الحاكم شارة الدولة على الثياب الرسمية مكان الصور، وصار للدولة دور نسج خاصة يتولاها صاحب الطراز من ثقات الدولة {cite:muqaddima-ibn-khaldun p. 256}، فصار الطراز علامة على الولاء: يُرفع اسم الخليفة منه حين يُخلع {cite:tdv-tiraz pp. 112–114}."
    en: "Arabic writing with the remembrance of God and the ruler's name became the state's mark on official garments in place of images, and the state had its own weaving houses run by a sahib al-tiraz chosen from its trusted men {cite:muqaddima-ibn-khaldun p. 256}, so the tiraz became a sign of allegiance: a caliph's name was taken off it when he was disowned {cite:tdv-tiraz pp. 112–114}."
    ur: "تصویروں کی جگہ اللہ کے ذکر اور حاکم کے نام والی عربی تحریر سرکاری لباس پر ریاست کی علامت بن گئی، اور ریاست کے اپنے بُنائی کے کارخانے بنے جنہیں ریاست کے معتمد لوگوں میں سے صاحب الطراز چلاتا {cite:muqaddima-ibn-khaldun p. 256}، یوں طراز وفاداری کی نشانی بن گیا: جب کسی خلیفہ کی اطاعت ترک کی جاتی تو اس کا نام طراز سے ہٹا دیا جاتا {cite:tdv-tiraz pp. 112–114}۔"
  history:
    ar: "كان الطراز في دولتي بني أمية وبني العباس من أفخم شارات الملك، ثم في الأندلس والفاطميين، وتعطّلت وظيفته في أكثر الدول حين ضاق نطاقها، وتركه الموحدون أول أمرهم زهداً في الحرير والذهب {cite:muqaddima-ibn-khaldun p. 256}، وبقي أثره في صقلية بعد زوال حكم المسلمين عنها {cite:tdv-tiraz pp. 112–114}."
    en: "The tiraz was among the grandest marks of kingship under the Umayyads and Abbasids, then in al-Andalus and under the Fatimids; its office lapsed in most states as they shrank, and the Almohads dropped it at first out of austerity about silk and gold {cite:muqaddima-ibn-khaldun p. 256}, while its mark survived in Sicily after Muslim rule there ended {cite:tdv-tiraz pp. 112–114}."
    ur: "طراز امویوں اور عباسیوں کے ہاں بادشاہی کی سب سے شاندار علامتوں میں تھا، پھر اندلس اور فاطمیوں کے ہاں؛ جب ریاستیں سکڑیں تو اکثر میں اس کا منصب ختم ہو گیا، اور موحدین نے ابتدا میں ریشم اور سونے سے پرہیز کی وجہ سے اسے چھوڑ دیا {cite:muqaddima-ibn-khaldun p. 256}، جبکہ مسلمانوں کی حکومت ختم ہونے کے بعد بھی صقلیہ میں اس کا اثر باقی رہا {cite:tdv-tiraz pp. 112–114}۔"
  significance: 3
  why: "The first state use of Arabic writing as the caliphate's mark on cloth and papyrus, which set the pattern for the inscribed coinage of 75 AH and for seven centuries of tiraz workshops from al-Andalus to Iran."
