era:
  origins: first-century
  first_attested:
    edtf: "0685/0695"
    calendar: julian
    precision: year
    status: historical
    derived: true
    note: "No source gives a year for the writing at the head of the rolls. Al-Askari, quoted by al-Suyuti, places it before the Byzantine emperor's threat that led Abd al-Malik to strike his own dinars in 75 AH {cite:tarikh-khulafa-minhaj-1434 p. 359}, and Abd al-Malik became caliph in 65 AH, so the range runs from his accession to 75 AH (685–695 CE). A range cannot be written as a Hijri string, so only the EDTF range is given, and it is marked derived."
    sources: [source/tarikh-khulafa-minhaj-1434, source/futuh-buldan-maarif-1407]
  status_today: transformed
origin:
  place: place/damascus
  polity: polity/umayyad-caliphate
  context:
    ar: "كانت مصر تصنع القراطيس وتبعث بها إلى بلاد الروم، وكان العرب يتعاملون بالدنانير التي تأتي من قبل الروم {cite:futuh-buldan-maarif-1407 p. 335}. وكان الصنّاع الأقباط يكتبون في رؤوس الطوامير ذكر المسيح منسوباً إلى الربوبية ويجعلون الصليب مكان البسملة {cite:futuh-buldan-maarif-1407 p. 336}، وظلّ النسّاجون في مصر بعد الفتح ينسجون على الثياب طرازاً مكتوباً باليونانية {cite:tdv-tiraz pp. 112–114}."
    en: "Egypt made the papyrus and sent it to the lands of the Byzantines, and the Arabs traded with dinars that came from the Byzantines {cite:futuh-buldan-maarif-1407 p. 335}. The Coptic clerks wrote at the head of the rolls a mention of Christ ascribing divinity to him and put the cross where the basmala would stand {cite:futuh-buldan-maarif-1407 p. 336}, and after the conquest the weavers of Egypt went on weaving tiraz in Greek on cloth {cite:tdv-tiraz pp. 112–114}."
    ur: "مصر قرطاس بناتا اور روم کے علاقوں کو بھیجتا تھا، اور عرب روم کی طرف سے آنے والے دیناروں سے لین دین کرتے تھے {cite:futuh-buldan-maarif-1407 p. 335}۔ قبطی کاتب طوماروں کے سرے پر مسیح کا ذکر ربوبیت کی نسبت کے ساتھ لکھتے اور بسم اللہ کی جگہ صلیب بناتے تھے {cite:futuh-buldan-maarif-1407 p. 336}، اور فتح کے بعد بھی مصر کے جولاہے کپڑوں پر یونانی زبان میں طراز بُنتے رہے {cite:tdv-tiraz pp. 112–114}۔"
makers:
  - person: person/abd-al-malik-ibn-marwan
    role: commissioner
    place: place/damascus
    note: "Umayyad caliph 65–86 AH. Al-Baladhuri names him among the first to introduce the writing at the head of the rolls {cite:futuh-buldan-maarif-1407 p. 335}; al-Askari, quoted by al-Suyuti, calls him the first {cite:tarikh-khulafa-minhaj-1434 p. 359}. TDV says he wrote to his brother Abd al-Aziz ibn Marwan, governor of Egypt, to have the Greek tiraz on cloth replaced with the declaration of God's oneness {cite:tdv-tiraz pp. 112–114}. He gave the order; the clerks and weavers of Egypt did the work."
    sources: [source/futuh-buldan-maarif-1407, source/tarikh-khulafa-minhaj-1434, source/tdv-tiraz]
attribution:
  status: improvement
  claim:
    ar: "عبد الملك بن مروان أول من أحدث الكتابة الإسلامية في رؤوس الطوامير، وجعل الطراز شارة للخلافة مكتوبة بذكر الله مكان الطراز اليوناني."
    en: "Abd al-Malik ibn Marwan was the first to introduce Islamic writing at the head of papyrus rolls and made the tiraz a written mark of the caliphate, bearing the remembrance of God in place of the Greek tiraz."
    ur: "عبد الملک بن مروان نے سب سے پہلے طوماروں کے سرے پر اسلامی تحریر شروع کی اور طراز کو یونانی طراز کی جگہ اللہ کے ذکر سے لکھی ہوئی خلافت کی علامت بنایا۔"
  basis:
    ar: "يروي البلاذري في «فتوح البلدان» تحت «أمر القراطيس» أن عبد الملك كان من أول من أحدث الكتاب الذي يُكتب في رؤوس الطوامير من سورة الإخلاص وغيرها من ذكر الله، فكتب إليه ملك الروم يتوعّده، فاستشار خالد بن يزيد بن معاوية فأشار عليه بتحريم دنانيرهم وضرب سكة للناس {cite:futuh-buldan-maarif-1407 pp. 335–336}. وينقل السيوطي الخبر نفسه عن «الأوائل» للعسكري بلفظ «أول من كتب في صدور الطوامير»، ويضيف ذكر النبي مع التاريخ، ويؤرخ ضرب الدنانير بسنة 75هـ {cite:tarikh-khulafa-minhaj-1434 p. 359}. فالخبر في المصادر العربية عن القراطيس. ويقرر ابن خلدون أن ملوك العجم قبل الإسلام كانوا يجعلون طرازهم صور الملوك، وأن ملوك الإسلام اعتاضوا عنها بكتب أسمائهم مع كلمات تجري مجرى الفأل، ولا يسمّي أول من فعل ذلك {cite:muqaddima-ibn-khaldun p. 256}. أما موسوعة TDV فتنسب إلى عبد الملك أمراً بترك الطراز اليوناني على الثياب في مصر، وتجعل تهديد ملك الروم هو الذي دفع الدولة إلى ضرب سكتها ووضع الطراز على ثياب الخليفة ورجال الدولة والجند {cite:tdv-tiraz pp. 112–114}. فهو تحسين لعادة سابقة عند الفرس والروم لا اختراع من عدم."
    en: "Al-Baladhuri, in Futuh al-Buldan under 'The affair of the papyrus', reports that Abd al-Malik was among the first to introduce the writing at the head of the rolls, from Surat al-Ikhlas and other remembrance of God; the Byzantine emperor wrote to threaten him, and Khalid ibn Yazid ibn Mu'awiya advised him to ban their dinars and strike coinage for the people {cite:futuh-buldan-maarif-1407 pp. 335–336}. Al-Suyuti gives the same report from al-Askari's al-Awa'il in the words 'the first to write at the head of the rolls', adds the mention of the Prophet with the date, and dates the dinars to 75 AH {cite:tarikh-khulafa-minhaj-1434 p. 359}. So the Arabic reports concern papyrus. Ibn Khaldun states that the non-Arab kings before Islam put images of kings in their tiraz and that the Muslim kings replaced them by writing their names with words of good omen, without naming who did it first {cite:muqaddima-ibn-khaldun p. 256}. The TDV encyclopaedia credits Abd al-Malik with an order to drop the Greek tiraz on cloth in Egypt, and makes the emperor's threat the cause of the state striking its own coin and putting tiraz on the garments of the caliph, his officials and his soldiers {cite:tdv-tiraz pp. 112–114}. It is an improvement on a Persian and Byzantine custom, not an invention from nothing."
    ur: "بلاذری «فتوح البلدان» میں «قرطاس کا معاملہ» کے تحت روایت کرتے ہیں کہ عبد الملک ان اولین لوگوں میں تھے جنہوں نے طوماروں کے سرے پر سورۂ اخلاص اور اللہ کے دوسرے ذکر کی تحریر شروع کی؛ روم کے بادشاہ نے انہیں دھمکی لکھی، اور خالد بن یزید بن معاویہ نے مشورہ دیا کہ ان کے دینار ممنوع کر دیں اور لوگوں کے لیے سکہ ڈھالیں {cite:futuh-buldan-maarif-1407 pp. 335–336}۔ سیوطی یہی روایت عسکری کی «الاوائل» سے ان الفاظ میں نقل کرتے ہیں کہ وہ «طوماروں کے سرے پر لکھنے والے پہلے شخص» تھے، تاریخ کے ساتھ نبی کا ذکر بھی بتاتے ہیں، اور دیناروں کی ڈھلائی کو 75ھ میں رکھتے ہیں {cite:tarikh-khulafa-minhaj-1434 p. 359}۔ یوں عربی روایتیں قرطاس کے بارے میں ہیں۔ ابن خلدون لکھتے ہیں کہ اسلام سے پہلے عجم کے بادشاہ اپنے طراز میں بادشاہوں کی تصویریں بنواتے تھے اور مسلمان بادشاہوں نے ان کی جگہ نیک فال کے کلمات کے ساتھ اپنے نام لکھوائے، اور وہ یہ نہیں بتاتے کہ پہلے کس نے ایسا کیا {cite:muqaddima-ibn-khaldun p. 256}۔ ٹی ڈی وی انسائیکلوپیڈیا عبد الملک سے مصر میں کپڑوں پر یونانی طراز ترک کرنے کا حکم منسوب کرتا ہے، اور روم کے بادشاہ کی دھمکی کو اس بات کا سبب بتاتا ہے کہ ریاست نے اپنا سکہ ڈھالا اور خلیفہ، اہلکاروں اور سپاہیوں کے کپڑوں پر طراز لگایا {cite:tdv-tiraz pp. 112–114}۔ یہ فارس اور روم کی ایک پرانی رسم میں بہتری ہے، عدم سے ایجاد نہیں۔"
  perspectives: []
