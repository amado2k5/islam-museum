      ar: "دنانير عبد الملك المكتوبة سنة 75هـ"
      en: "Abd al-Malik's inscribed dinars of 75 AH"
      ur: "عبد الملک کے 75ھ کے لکھے ہوئے دینار"
    note: "Al-Baladhuri and al-Askari (quoted by al-Suyuti): the emperor's threat over the rolls led Abd al-Malik, on Khalid ibn Yazid's advice, to strike his own dinars, in 75 AH according to al-Suyuti, with words from the Qur'an on them."
    sources: [source/futuh-buldan-maarif-1407, source/tarikh-khulafa-minhaj-1434]
  - external:
      ar: "دار الطراز وديوان الطراز عند العباسيين"
      en: "The Abbasid tiraz houses and diwan al-tiraz"
      ur: "عباسیوں کے دار الطراز اور دیوان الطراز"
    note: "TDV: the Abbasids kept tiraz workshops and a diwan al-tiraz; Harun al-Rashid's testament mentions a tiraz house, and when al-Ma'mun rose against al-Amin he removed his brother's name and title from the tiraz. Ibn Khaldun: the houses were run by a sahib al-tiraz who oversaw the dyers, tools and weavers."
    sources: [source/tdv-tiraz, source/muqaddima-ibn-khaldun]
  - external:
      ar: "طراز الأمويين في الأندلس والفاطميين في مصر"
      en: "The tiraz of the Umayyads of al-Andalus and of the Fatimids"
      ur: "اندلس کے امویوں اور مصر کے فاطمیوں کا طراز"
    note: "Ibn Khaldun names the Umayyads of al-Andalus, the party kings after them and the Ubaydids (Fatimids) of Egypt. TDV: in al-Andalus tiraz garments were first worn under Abd al-Rahman II; the Fatimid workshops of Tinnis, Damietta and Alexandria made clothes worth up to 600,000 dinars a year."
    sources: [source/muqaddima-ibn-khaldun, source/tdv-tiraz]
  - external:
