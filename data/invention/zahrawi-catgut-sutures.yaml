id: invention/zahrawi-catgut-sutures
class: invention
label:
  ar: "خيوط الأمعاء ⁦(catgut)⁩ للزهراوي"
  en: "Al-Zahrawi's catgut sutures"
  ur: "الزہراوی کی آنتوں کی سلائیاں"
  es: "Suturas de catgut de Al-Zahrawi"
  fr: "Les sutures en catgut d'Al-Zahrawi"
  tr: "Al-Zahrawi'nin bağırsak iplikleri (katgüt)"
  id: "Benang Usus Al-Zahrawi (catgut)"
names:
  - { value: "catgut sutures", kind: alternate, lang: en }
  - { value: "gut sutures of al-Tasrif", kind: alternate, lang: en }
summary:
  ar: "نصّ «التصريف» على استعمال خيوط من أمعاء الحيوان ⁦(catgut)⁩ لخياطة الجروح الداخلية — خيط يمتصه الجسم فلا يحتاج نزعه — وهي أقدم صيغة مكتوبة معروفة لاستعمال الخيوط القابلة للامتصاص في الجراحة، وما زال مبدأها يعمل في خيوط اليوم."
  en: "Al-Tasrif specifies sutures made from animal gut — thread the body absorbs so it need not be removed — the earliest known written use of absorbable sutures in surgery, and the principle still works in today's sutures."
  ur: "التصریف میں جانوروں کی آنتوں کے بنے دھاگے ⁦(catgut)⁩ سے اندرونی زخموں کی سلائی متعین ہے — دھاگا جسے جسم جذب کرتا ہے نکالنے کی ضرورت نہیں — جراحی میں جذب ہونے والی سلائیوں کے قدیم ترین معلوم تحریری استعمال، اور اصول آج بھی چلتا ہے۔"
  es: "Al-Tasrif especifica suturas hechas de intestino animal —un hilo que el cuerpo absorbe, por lo que no es necesario retirarlo—, siendo este el primer uso escrito conocido de suturas absorbibles en cirugía, y el principio sigue funcionando en las suturas actuales."
  fr: "Al-Tasrif décrit des sutures fabriquées à partir de boyau animal — un fil que le corps absorbe et qui n'a donc pas besoin d'être retiré — la plus ancienne utilisation écrite connue de sutures résorbables en chirurgie, et le principe fonctionne encore dans les sutures d'aujourd'hui."
  tr: "“El-Tasrif” metni, iç yaraların dikilmesinde hayvan bağırsağı ipliklerinin (kedi bağırsağı) kullanılmasını öngörür; bu iplik vücut tarafından emilir ve çıkarılması gerekmez. Bu, cerrahide emilebilir ipliklerin kullanımına dair bilinen en eski yazılı formüldür ve prensibi günümüzdeki ipliklerde de hala geçerlidir."
  id: "Teks “Al-Tasrif” menetapkan penggunaan benang usus hewan (catgut) untuk menjahit luka internal — benang yang diserap oleh tubuh dan tidak perlu dikeluarkan — dan merupakan formula tertulis tertua yang diketahui untuk penggunaan benang yang dapat diserap dalam pembedahan, dan prinsipnya masih berlaku pada benang saat ini."
