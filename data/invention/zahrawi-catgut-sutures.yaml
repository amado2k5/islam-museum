kids:
  ar: "عندما يُجرَّح الجسم من الداخل، كيف يخيطه الطبيب ثم يُخرج الخيط؟ فكّر الزهراوي قبل ألف سنة: استعمل خيطاً من أمعاء الحيوان يذوب في الجسم — فيُخيط ولا يحتاج أن يفتح مرة ثانية. هذه فكرة الخيوط القابلة للامتصاص التي ما زالت تعمل اليوم."
  en: "When the body is cut inside, how does the doctor stitch it and then take the thread out? Al-Zahrawi thought a thousand years ago: use a thread of animal gut that dissolves in the body — stitch once and no second opening needed. That is the absorbable-suture idea still working today."
  ur: "جب جسم اندر سے کٹتا ہے، ڈاکٹر اسے کیسے سلائے اور پھر دھاگہ کیسے نکالے؟ الزہراوی نے ہزار سال پہلے سوچا: جانور کی آنت کا دھاگا استعمال کرو جو جسم میں گھل جائے — ایک بار سلاؤ، دوسرا شق نہیں چاہیے۔ یہی جذب ہونے والی سلائی کا خیال آج بھی چلتا ہے۔"
