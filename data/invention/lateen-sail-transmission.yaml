summary:
  ar: شراع مثلث على قائم طويل مائل بالصارية يجري طولياً — شاع بالمتوسط
    في القرن الخامس وتبناه العرب من البحارة الأقباط المشاركين في تقاليد
    المتوسط، وحملته سفنهم في بحرين العالم الإسلامي ثم أعارته صواري
    الكرافل الأوروبية — وأصله ⁦(متوسطي أم شرقي)⁩ سؤال مؤرخين متنازع
    {cite:wikipedia-lateen-en} {cite:whitewright-lateen-almasaq-2012}.
  en: A triangular sail on a long angled yard set fore-and-aft — common
    in the Mediterranean by the fifth century, adopted by the Arabs
    through Coptic seafarers who shared that maritime tradition, carried
    by their ships across the Islamic seas, and later lent to the
    mizzen masts of European caravels — while its origin, Mediterranean
    or eastern, remains a contested question among historians
    {cite:wikipedia-lateen-en} {cite:whitewright-lateen-almasaq-2012}.
  ur: لمبے تیڑھے پال پر لگا تکونی شراع جو لمبائی میں چلتا ہے — پانچویں
    صدی تک بحیرۂ روم میں عام، عربوں نے قبطی ملاحوں کے ذریعے اسی سمندری
    روایت سے اپنایا، ان کی جہازوں نے اسلامی بحروں میں پھیلایا، پھر یورپی
    کاراول کے پچھلے مینگڑے کو دیا — مگر اس کی اصل ⁦(بحیرۂ رومی یا شرقی)⁩
    مؤرخین میں متنازع سوال ہے {cite:wikipedia-lateen-en}
    {cite:whitewright-lateen-almasaq-2012}۔
  es: "Una vela triangular en una larga verga angular colocada de proa a popa —común en el Mediterráneo hacia el siglo V, adoptada por los árabes a través de los marineros coptos que compartían esa tradición marítima, llevada por sus barcos a través de los mares islámicos, y prestada más tarde a los mástiles de mesana de las carabelas europeas— mientras que su origen, mediterráneo u oriental, sigue siendo una cuestión controvertida entre los historiadores {cite:wikipedia-lateen-en} {cite:whitewright-lateen-almasaq-2012}."
  fr: "Une voile triangulaire sur une longue vergue inclinée placée dans le sens de la longueur — courante en Méditerranée dès le Ve siècle, adoptée par les Arabes par l'intermédiaire des marins coptes qui partageaient cette tradition maritime, transportée par leurs navires à travers les mers islamiques, et plus tard prêtée aux mâts d'artimon des caravelles européennes — tandis que son origine, méditerranéenne ou orientale, reste une question controversée parmi les historiens {cite:wikipedia-lateen-en} {cite:whitewright-lateen-almasaq-2012}."
