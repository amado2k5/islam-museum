  claim:
    ar: 'الشراع اللاتيني حلقة متوسطية-إسلامية-أوروبية مشتركة — تاريخياً
      رُوي شراعاً عربياً حمل الإسلام بحراً، لكن الأدلة الأثرية والشكلية
      الحديثة تؤرخه بالمتوسط الروماني-البيزنطي وتجعل التبني العربي عبر
      البحارة الأقباط — والمتحف يسجل النقل دون أن يحسم الأصل
      {cite:wikipedia-lateen-en} {cite:whitewright-lateen-almasaq-2012}.'
    en: 'The lateen is a shared Mediterranean-Islamic-European link:
      historically told as an Arab sail that carried Islam seaward,
      but recent archaeological and iconographic evidence dates it to
      the Roman-Byzantine Mediterranean and makes Arab adoption a
      Coptic-mediated inheritance — the museum records the
      transmission without deciding the origin {cite:wikipedia-lateen-en}
      {cite:whitewright-lateen-almasaq-2012}.'
    ur: 'لاتینی شراع مشترک بحیرۂ رومی-اسلامی-یورپی کڑی ہے: روایتی بیان میں
      عرب شراع کہا گیا جس نے اسلام کو سمندر پہنچایا، مگر جدید آثارِ
      قدیمہ اور تصویری شواہد اسے رومی-بازنطینی بحیرۂ روم میں مؤرخ کرتے اور
      عرب اپنانے کو قبطی ثالثی کی وراثت بناتے ہیں — عجائب گھر منتقلی
      درج کرتا ہے بغیر اصل کا فیصلہ کیے {cite:wikipedia-lateen-en}
      {cite:whitewright-lateen-almasaq-2012}۔'
  basis:
    ar: 'شواهد متوسطية مبكرة ⁦(لوحة القرن الثاني، أربع سفن قبل الفتح،
      ياسي أدا 400م، الدرومون)⁩ ومصطلح عربي مشتق يونانياً-رومانياً
      وأقدم تصوير إسلامي آمن بطبق دانية ⁦(القرن الحادي عشر)⁩؛ مقابل
