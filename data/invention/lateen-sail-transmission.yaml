      عرب شدہ قبطی عملے اور مسلم بیڑے اسی رگ کو یونانی-رومی ناموں کے
      ساتھ وراثت میں لیتے ہیں {cite:wikipedia-lateen-en}
      {cite:whitewright-lateen-almasaq-2012}۔'
