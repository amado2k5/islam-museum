      Greco-Roman-derived names {cite:wikipedia-lateen-en}
      {cite:whitewright-lateen-almasaq-2012}.'
    ur: 'مشترک بحیرۂ روم: پہلے رومی اور بازنطینی جہاز ⁦(دوسری صدی کی قبر
