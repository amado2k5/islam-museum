kids:
  ar: "تخيل مريضاً يصل إلى مستشفى ابن طولون. يقول المؤرخ إن شخصاً يحفظ ماله وثيابه، ثم يُعطى لباساً وفراشاً ويأتيه الطعام والدواء. وعندما يتعافى ويستطيع الأكل تُرد إليه أشياؤه. كانت عقارات موقوفة تساعد على قيام المستشفى، لكنه لم يكن مفتوحاً للجميع: فقد استثنى شرطه الجندي والمملوك."
  en: "Imagine arriving sick at Ibn Tulun's hospital. The historian says someone kept your money and clothes safe, then you received hospital clothing, bedding, food and medicine. When you recovered and could eat, your belongings were returned. Endowed properties supported the institution, but it was not open to everyone: its rules excluded soldiers and mamluks."
  ur: "سوچیے آپ بیمار ہو کر ابن طولون کے شفاخانے پہنچتے ہیں۔ مؤرخ کے مطابق کوئی آپ کے کپڑے اور مال محفوظ رکھتا، پھر لباس، بستر، کھانا اور دوا ملتے۔ صحت یابی اور کھانا کھانے کی صلاحیت پر آپ کا سامان لوٹا دیا جاتا۔ وقف کی جائیدادیں اسے سہارا دیتی تھیں، مگر دروازہ سب کے لیے نہیں تھا: فوجی اور مملوک مستثنیٰ تھے۔"
