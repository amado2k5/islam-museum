id: invention/ibn-tulun-bimaristan
class: invention
label:
  ar: "بيمارستان ابن طولون الوقفي"
  en: "Ibn Tulun's endowed civilian hospital"
  ur: "ابن طولون کا وقفی شہری شفاخانہ"
names:
  - { value: "مارستان ابن طولون", kind: alternate, lang: ar }
  - { value: "The Tulunid bimaristan", kind: alternate, lang: en }
summary:
  ar: "ينقل المقريزي عن جامع السيرة الطولونية أن أحمد بن طولون بنى مارستاناً سنة 261هـ وأوقف عليه عقارات، وشرط ألا يعالج فيه جندي ولا مملوك. تُحفظ ثياب المريض وماله عند الأمين، ويُعطى ثياباً وفراشاً ودواءً وغذاءً، وتُرد أمتعته عند الخروج بعد التعافي {cite:khitat-maqrizi-1998 scan p. 2337}. يرد في الصفحة نفسها تاريخ 259هـ منقولاً عن الكندي، بينما تعطي موسوعة TDV سنة 872م؛ فلا يثبت السجل سنة افتتاح واحدة ولا أولوية اختراع المستشفى {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
  en: "Al-Maqrizi quotes the compiler of the Tulunid biography: Ahmad ibn Tulun built a hospital in 261 AH, endowed it with properties and excluded soldiers and mamluks. A patient's clothes and money were kept by the custodian; hospital clothing, bedding, medicine and food were supplied, and belongings returned after recovery {cite:khitat-maqrizi-1998 scan p. 2337}. The same page gives al-Kindi's date of 259 AH, while TDV gives 872 CE; this record does not assert one exact opening year or the invention of hospitals {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
  ur: "مقریزی طولونی سیرت کے مرتب سے نقل کرتے ہیں کہ احمد بن طولون نے 261ھ میں شفاخانہ بنایا اور اس پر جائیدادیں وقف کیں، جہاں فوجی اور مملوک کا علاج نہیں ہوتا تھا۔ مریض کے کپڑے اور مال امین کے پاس محفوظ رہتے، اسے لباس، بستر، دوا اور غذا ملتی، اور صحت یابی پر سامان لوٹایا جاتا {cite:khitat-maqrizi-1998 scan p. 2337}۔ اسی صفحے پر کندی کی 259ھ کی تاریخ ہے، جبکہ ٹی ڈی وی 872ء بتاتا ہے؛ ریکارڈ کسی ایک قطعی سال یا شفاخانے کی ایجاد کی اولیت کا دعویٰ نہیں کرتا {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}۔"
