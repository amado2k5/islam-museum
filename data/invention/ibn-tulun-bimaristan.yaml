    note: "Al-Maqrizi quotes al-Kindi's 259 AH and the compiler of the Tulunid biography's 261 AH on scan p. 2337 (printed p. 546); TDV instead gives 872 CE. The interval deliberately contains these competing datings, including the CE span of the Hijri years, rather than choosing an exact foundation year."
