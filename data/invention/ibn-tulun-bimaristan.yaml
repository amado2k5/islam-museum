origin:
  place: place/al-fustat
  context:
    ar: "يضع المقريزي المارستان في أرض العسكر بين معالم مصر القديمة وجامع ابن طولون، ويقول إنه دثر ولم يبق له أثر. وتضع ترجمة TDV المسجد والمستشفى ضمن عمران القطائع الذي أنشأه ابن طولون شمال شرقي الفسطاط {cite:khitat-maqrizi-1998 scan p. 2336} {cite:tdv-ahmed-b-tolun pp. 141–143}."
    en: "Al-Maqrizi locates the hospital in the al-Askar area between landmarks of Old Cairo and Ibn Tulun's mosque, and says it had disappeared without a surviving trace. TDV's biography places the mosque and hospital in the development of al-Qatai northeast of Fustat {cite:khitat-maqrizi-1998 scan p. 2336} {cite:tdv-ahmed-b-tolun pp. 141–143}."
    ur: "مقریزی اسے عسکر کی زمین میں پرانے مصر کے مقامات اور ابن طولون کی مسجد کے درمیان رکھتے اور بتاتے ہیں کہ وہ مٹ چکا تھا۔ ٹی ڈی وی کی سوانح مسجد اور شفاخانے کو فسطاط کے شمال مشرق میں ابن طولون کے بسائے القطائع کے عمران میں رکھتی ہے {cite:khitat-maqrizi-1998 scan p. 2336} {cite:tdv-ahmed-b-tolun pp. 141–143}۔"
makers:
  - person: person/ahmad-ibn-tulun
    role: commissioner
    place: place/al-fustat
    note: "Patron, founder and author of the reported conditions, not the inventor of hospitals or the unnamed physicians' treatments. Al-Maqrizi records endowments, patient care and his Friday inspections."
    sources: [source/khitat-maqrizi-1998, source/tdv-bimaristan]
attribution:
  status: improvement
  claim:
    ar: "تنظيم مستشفى وقفي مدني يصف المصدر شروط قبوله وحفظ أمتعة المرضى ورعايتهم وخروجهم؛ لا اختراع المستشفى نفسه."
    en: "An endowed civilian hospital with documented admission rules, custody of belongings, care and discharge; not invention of the hospital itself."
    ur: "داخلے، سامان کی حفاظت، نگہداشت اور رخصتی کے بیان کردہ اصولوں والا وقفی شہری شفاخانہ؛ خود شفاخانے کی ایجاد نہیں۔"
  basis:
    ar: "التنظيم مفصل في نقل المقريزي عن السيرة الطولونية. وتعد موسوعة TDV وصف الرعاية قريباً من خدمات المستشفيات الحديثة، مع استثناء الإمكانات التقنية. ويسجل المتحف تطوير المؤسسة في هذا المثال، ولا يزعم أن كل خطوة لم تُعرف قبله. ودعوى أنه لم يكن بمصر مارستان قبله منسوبة إلى السيرة، بينما تذكر TDV منشأة لفتح بن خاقان بالفسطاط سنة 861م {cite:khitat-maqrizi-1998 scan p. 2337} {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    en: "Al-Maqrizi's quotation from the Tulunid biography details the organization. TDV compares its patient services, apart from technical capabilities, to modern hospital care. The museum records institutional development in this example, not that every step was unprecedented. The biography's claim that Egypt had no earlier hospital is attributed, while TDV also names Fath ibn Khaqan's Fustat foundation of 861 {cite:khitat-maqrizi-1998 scan p. 2337} {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    ur: "طولونی سیرت سے مقریزی کی نقل میں تنظیم تفصیل سے ہے۔ ٹی ڈی وی تکنیکی سہولتوں کو الگ رکھتے ہوئے مریضوں کی دیکھ بھال کو جدید شفاخانوں سے ملاتا ہے۔ میوزیم اس مثال میں ادارے کی ترقی درج کرتا ہے، ہر مرحلے کی بے مثال اولیت نہیں۔ مصر میں اس سے پہلے شفاخانہ نہ ہونے کا دعویٰ سیرت سے منسوب ہے؛ ٹی ڈی وی 861ء میں فسطاط کے فتح بن خاقان کے ادارے کو بھی بیان کرتا ہے {cite:khitat-maqrizi-1998 scan p. 2337} {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}۔"
  perspectives: []
precursors:
  - invention: invention/waqf
    note: "Al-Maqrizi says Ibn Tulun endowed the hospital with the diwan house, houses, a qaysariyya and a market. The link concerns the legal and financial institution, not proof that Umar's specific endowment directly financed this hospital."
    sources: [source/khitat-maqrizi-1998]
