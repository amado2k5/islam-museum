impact:
  fields: [medicine-surgery, institutions-systems]
  changed:
    ar: "يرسم الخبر رحلة المريض من حفظ ماله وثيابه إلى إلباسه وفرش فراشه وتقديم الأدوية والأغذية إليه حتى يبرأ، ثم اختبار قدرته على الأكل ورد ماله وثيابه عند انصرافه. ويذكر حمامين للرجال والنساء، لكنه يستثني الجندي والمملوك من القبول {cite:khitat-maqrizi-1998 scan p. 2337}."
    en: "The account follows a patient from safekeeping of money and clothes to hospital dress, bedding, medicines and meals until recovery, then a meal-based discharge criterion and return of belongings. It records men's and women's bathhouses but excludes soldiers and mamluks from admission {cite:khitat-maqrizi-1998 scan p. 2337}."
    ur: "روایت مریض کے مال اور کپڑوں کی حفاظت، لباس و بستر، صحت یابی تک دوا اور غذا، پھر کھانا کھا سکنے کی شرط پر رخصتی اور سامان کی واپسی بیان کرتی ہے۔ مردوں اور عورتوں کے دو حمام ہیں، مگر فوجی اور مملوک داخلے سے مستثنیٰ ہیں {cite:khitat-maqrizi-1998 scan p. 2337}۔"
  history:
    ar: "تصف موسوعة TDV أهمية هذه المنشأة لتاريخ رعاية المرضى وعلاج الأمراض العقلية؛ وتكشف رواية المقريزي عن إدارة وأوقاف وتفقد للخزائن والأطباء، لا مجرد بناء يأوي المرضى {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri} {cite:khitat-maqrizi-1998 scan p. 2337}."
    en: "TDV emphasizes the institution in the history of patient and mental-health care; al-Maqrizi's account shows administration, endowments and inspection of stores and physicians, not merely a building sheltering the sick {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri} {cite:khitat-maqrizi-1998 scan p. 2337}."
    ur: "ٹی ڈی وی مریضوں اور ذہنی امراض کی دیکھ بھال کی تاریخ میں اسے اہم کہتا ہے۔ مقریزی کے بیان میں انتظام، اوقاف اور ذخائر و طبیبوں کا معائنہ ہے، محض بیماروں کو چھت دینے والی عمارت نہیں {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri} {cite:khitat-maqrizi-1998 scan p. 2337}۔"
  significance: 4
  why: "A concrete early account of an endowed civilian hospital's admission-to-discharge process, including property custody and food, medicines and clothing. The exclusion of soldiers and mamluks and the conflicting dates are preserved rather than replaced by a universal-first claim."
