today:
  form:
    ar: "قال المقريزي إن المستشفى دثر ولم يبق له أثر. جامع ابن طولون القائم ليس المستشفى؛ صورته شاهد على عمارة الراعي وسياق المدينة، لا صورة لأجنحة العلاج {cite:khitat-maqrizi-1998 scan p. 2336} {cite:tdv-ahmed-b-tolun pp. 141–143}."
    en: "Al-Maqrizi says the hospital had disappeared without a trace. The surviving Mosque of Ibn Tulun is not the hospital: its photograph illustrates the patron's building programme and urban context, not treatment wards {cite:khitat-maqrizi-1998 scan p. 2336} {cite:tdv-ahmed-b-tolun pp. 141–143}."
    ur: "مقریزی کے مطابق شفاخانہ مٹ گیا تھا اور نشان نہ رہا۔ باقی مسجد ابن طولون، شفاخانہ نہیں: اس کی تصویر بانی کے عمران اور شہر کے ماحول کو دکھاتی ہے، علاج کے وارڈ نہیں {cite:khitat-maqrizi-1998 scan p. 2336} {cite:tdv-ahmed-b-tolun pp. 141–143}۔"
  descendants:
    ar: "تقارن الموسوعة الرعاية بالخدمات الحديثة، لكنها لا تثبت سلسلة انتقال لكل إجراء من هذه المنشأة إلى مستشفى حديث بعينه {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    en: "The encyclopedia compares the care with modern services but does not demonstrate a chain of transmission for each procedure from this institution to a particular modern hospital {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    ur: "انسائیکلوپیڈیا اس نگہداشت کا جدید خدمات سے موازنہ کرتا ہے، مگر ہر طریقے کا اس ادارے سے کسی خاص جدید ہسپتال تک سلسلہ ثابت نہیں کرتا {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}۔"
