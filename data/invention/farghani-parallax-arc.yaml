attribution:
  status: transmission
  claim:
    ar: وصف حسابي لاختلاف المنظر بأرقامه القصوى داخل ملخص عربي مؤثر، لا اكتشاف الأثر المنظوري نفسه.
    en: A computational description of parallax with its maximum figures inside an influential Arabic summary, not the discovery
      of the parallax effect itself.
    ur: مؤثر عربی خلاصے کے اندر حداکثری اعداد کے ساتھ اختلافِ منظر کی حسابی وضاحت، اختلافِ منظر کے اثر کی دریافت نہیں۔
  basis:
    ar: يفسر الفرغاني قوس الانحراف من دايرة الارتفاع ويعطي للقمر نحو درجة وأربع دقائق في الطول عند أقرب أفلاكه، وللزهر وعطارد
      والقمر انحرافاً محسوساً، ويقول إنه لا يوجد للكوكب العلوية فوق الشمس من هذا الانحراف شيء {cite:farghani-elements-astronomy
      p. 27}{cite:farghani-elements-astronomy p. 28}.
    en: al-Farghani derives the deviation arc from the vertical circle, gives the Moon about one degree four minutes in longitude
      at its nearest orbit, finds a perceptible deviation for Venus, Mercury and the Moon, and says the superior planets above
      the Sun have none {cite:farghani-elements-astronomy p. 27}{cite:farghani-elements-astronomy p. 28}.
    ur: فرغانی سمت الرأسی کے دائرے سے انحراف کا قوس نکالتے ہیں، چاند کے قریب ترین دائرے میں طول پر تقریباً ایک ڈگری چار منٹ
      بتاتے ہیں، زہرہ، عطارد اور چاند کے لیے محسوس ہونے والا انحراف پاتے ہیں، اور کہتے ہیں کہ سورج سے اوپر کے سیاروں کا ایسا
      انحراف نہیں {cite:farghani-elements-astronomy p. 27}{cite:farghani-elements-astronomy p. 28}۔
