  fr: "L'explication d'al-Farghani sur la parallaxe des positions planétaires"
  tr: "El-Farghani'nin gezegenlerin konumlarındaki paralaks ölçümü"
  id: "Pengukuran paralaks posisi planet oleh Al-Farghani"
names:
- kind: alternate
  lang: en
  value: al-Farghani's deviation-of-vision calculation
- kind: alternate
  lang: ar
  value: انحراف المنظر عند الفرغاني
summary:
  ar: يعالج الفرغاني في فصول مبكرة من جوامع علم النجوم اختلاف المنظر بين موضع الجرم كما يُرى من سطح الأرض وموضعه الحقيقي،
    فيبين قوس الانحراف من دائرة الارتفاع ويعطي أقصى ما يجتمع له من الانحراف للقمر نحو درجة وأربع دقائق في الطول، ويعلل أن
    الكواكب العلوية فوق الشمس لا يحس لها من هذا الانحراف شيء، وأن أقصى ما يجتمع للشمس عند الأفق ثلث دقيقة لا يحس بالقباس {cite:farghani-elements-astronomy
    p. 27}{cite:farghani-elements-astronomy p. 28}.
  en: In early chapters of his Jawami' al-Farghani treats the difference between a body's position as seen from the earth's
    surface and its true position, derives the arc of deviation from the vertical circle, and gives the largest deviation
    for the Moon as about one degree four minutes in longitude; he explains that the superior planets above the Sun have no
    perceptible deviation and that the Sun's own maximum at the horizon is about a third of a minute, imperceptible to measure
    {cite:farghani-elements-astronomy p. 27}{cite:farghani-elements-astronomy p. 28}.
  ur: جوامع کے ابتدائی ابواب میں فرغانی زمین کی سطح سے نظر آنے والے اور حقیقی مقام کے فرق کو بیان کرتے ہیں، سمت الرأسی کے
    دائرے سے انحراف کا قوس نکالتے ہیں، اور چاند کے لیے زیادہ سے زیادہ انحراف تقریباً ایک ڈگری چار منٹ بتاتے ہیں؛ وہ واضح کرتے
    ہیں کہ سورج سے اوپر کے سیاروں کا یہ انحراف محسوس نہیں ہوتا اور سورج کا حداکثر افق پر تقریباً ایک تہائی منٹ ہے جو پیمائش
    سے محسوس نہیں ہوتا {cite:farghani-elements-astronomy p. 27}{cite:farghani-elements-astronomy p. 28}۔
  es: "En los primeros capítulos de su Jawami' al-Farghani trata la diferencia entre la posición de un cuerpo vista desde la superficie de la tierra y su posición verdadera, deriva el arco de desviación del círculo vertical y da la mayor desviación para la Luna como aproximadamente un grado cuatro minutos en longitud; explica que los planetas superiores sobre el Sol no tienen desviación perceptible y que el máximo del Sol en el horizonte es aproximadamente un tercio de minuto, imperceptible para medir {cite:farghani-elements-astronomy p. 27}{cite:farghani-elements-astronomy p. 28}."
  fr: "Dans les premiers chapitres de son Jawami' al-Farghani, il traite de la différence entre la position d'un corps vue de la surface de la Terre et sa position réelle, il déduit l'arc de déviation par rapport au cercle vertical et donne la plus grande déviation pour la Lune comme étant d'environ un degré et quatre minutes en longitude; il explique que les planètes supérieures au-dessus du Soleil n'ont pas de déviation perceptible et que le maximum du Soleil à l'horizon est d'environ un tiers de minute, imperceptible à mesurer {cite:farghani-elements-astronomy p. 27}{cite:farghani-elements-astronomy p. 28}."
  tr: "Al-Farghani, Astronomi Özeti'nin ilk bölümlerinde, bir gök cisminin Dünya yüzeyinden görünen konumu ile gerçek konumu arasındaki paralaks farkına değinir. Ekliptikten sapma yayını açıklar ve Ay'ın deneyimlediği maksimum sapmayı, yaklaşık bir derece dört dakika uzunluğunda verir. Güneşin üzerindeki gezegenlerin bu sapmanın hiçbirini algılamadığını ve ufukta Güneş'in deneyimlediği maksimum sapmanın algılanamayan bir dakikanın üçte biri olduğunu açıklar. {cite:farghani-elements-astronomy s. 27}{cite:farghani-elements-astronomy s. 28}."
  id: "Dalam bab-bab awal Kompendium Astronomi karyanya, Al-Farghani membahas perbedaan paralaks antara posisi benda langit seperti yang terlihat dari permukaan Bumi dan posisi sebenarnya. Ia menjelaskan busur deklinasi dari ekliptika dan memberikan deklinasi maksimum yang dialami bulan, sekitar satu derajat dan empat menit. Ia menjelaskan bahwa planet-planet di atas matahari tidak merasakan deklinasi ini, dan bahwa deklinasi maksimum yang dialami matahari di cakrawala adalah sepertiga menit yang tidak dapat dirasakan. {cite:farghani-elements-astronomy p. 27}{cite:farghani-elements-astronomy p. 28}."
