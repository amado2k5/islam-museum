origin:
  place: place/rayy
  polity: polity/buyid-dynasty
  context:
    ar: "موثق عمل الخجندي في الري ضمن رعاية فخر الدولة البويهية؛ لا تثبت المصادر موضع صناعة الشاملة ولا تاريخاً لها، فنضبطها في محيط عمله لا في ورشة موثقة {cite:van-brummelen-khujandi-bea biography} {cite:jphogendijk-khujandi-works treatise}."
    en: "Al-Khujandi's documented working milieu at Rayy under Buyid patronage; no source fixes a workshop or date for the shamila itself, so the setting is his milieu, not an attested construction site {cite:van-brummelen-khujandi-bea biography} {cite:jphogendijk-khujandi-works treatise}."
    ur: "خجندی کا مستند کام کا ماحول رے میں بوئی سرپرستی میں تھا؛ کسی ماخذ نے شاملہ کی صنعت گاہ یا تاریخ متعین نہیں کی، اس لیے سیاق اس کا کام کا ماحول ہے، مصدقہ تعمیراتی مقام نہیں {cite:van-brummelen-khujandi-bea biography} {cite:jphogendijk-khujandi-works treatise}۔"
makers:
  - person: person/al-khujandi-abu-mahmud-hamid-ibn-al-khidr
    role: inventor
    note: "Designed and described the comprehensive instrument in his treatise; later bibliographers credit him with the invention. Muslim identification on the person record rests on MacTutor's explicit Islamic-astronomer description plus the museum's declared Sunni default frame, not on patronage inference. The treatise is unpublished and was not read here."
    sources: [source/van-brummelen-khujandi-bea, source/jphogendijk-khujandi-works, source/ismi-khujandi-ala-shamila]
attribution:
  status: original
  claim:
    ar: "تنسب السيرة والمكتبة إلى الخجندي اختراع الآلة الشاملة ووصف صناعتها؛ يوثق هذا السجل تلك النسبة في الأدبيات الثانوية وبقاء رسالته، لا معاينة للنص الأصلي."
    en: "Biographies and the bibliographic tradition credit al-Khujandi with inventing the comprehensive instrument and describing its construction; this record documents that attribution and the treatise's survival, not a reading of the original text."
    ur: "سوانح اور کتابی روایت خجندی کو جامع آلہ کی ایجاد اور اس کی تعمیر کی وضاحت سے منسوب کرتی ہے؛ یہ اندراج اس نسبت اور رسالے کی بقا کو دستاویزی ثبوت دیتا ہے، اصل متن کی قراءت نہیں۔"
  basis:
    ar: "يسمي فان بروملن «الشامِلة» اختراعاً في رسالة «الآلة الشاملة» وأداة تحل محل الأسطرلاب أو الربع عند عرض محدود {cite:van-brummelen-khujandi-bea comprehensive-instrument}. يوثق هوغندايك عنوان الرسالة ومخطوطاتها وتعليق هبة الله اللاحق {cite:jphogendijk-khujandi-works treatise}."
    en: "Van Brummelen calls the shamila an invention in The Comprehensive Instrument, an instrument to replace the astrolabe or a quadrant within a limited latitude range {cite:van-brummelen-khujandi-bea comprehensive-instrument}. Hogendijk documents the treatise's title, manuscripts and Hibatallah's later commentary {cite:jphogendijk-khujandi-works treatise}."
    ur: "وان برملن شاملہ کو «جامع آلہ» کے رسالے میں ایجاد کہتا ہے، ایک محدود عرض البلد کے دائرے میں اسطرلاب یا ربع کی جگہ لینے والا آلہ {cite:van-brummelen-khujandi-bea comprehensive-instrument}۔ ہوگینڈائک رسالے کا عنوان، مخطوطات اور ہبت اللہ کا بعد کا حاشیہ بیان کرتا ہے {cite:jphogendijk-khujandi-works treatise}۔"
  perspectives: []
precursors:
  - external: { ar: "الأسطرلاب الكوكبي وصفائحه لعرض البلد المحلي", en: "The planispheric astrolabe and its local-latitude plates", ur: "کروی اسطرلاب اور مقامی عرض البلد کی تختیاں" }
    note: "The shamila was presented as an instrument intended to replace the astrolabe or a quadrant, not a claim to invent either; its exact relation to the astrolabe's interchangeable plates is unread because the treatise is unpublished."
