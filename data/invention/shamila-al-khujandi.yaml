today:
  form:
    ar: "لا مثال باقٍ معروف؛ أدرج سزكين إعادة بناء للنسخة الأصلية في فهرس آلاته ⁦(المجلد الثاني، الصفحات 151–153)⁩ دون أن نتحقق من بنيتها هنا {cite:jphogendijk-khujandi-works sezgin-reconstruction}."
    en: "No known surviving example; Sezgin's instrument catalogue includes a reconstruction of the original version (vol. 2, pp. 151-153), whose construction we have not inspected here {cite:jphogendijk-khujandi-works sezgin-reconstruction}."
    ur: "کوئی معلوم باقی نمونہ نہیں؛ سزگن کے آلات کے فہرست میں اصل نسخے کی تعمیر ⁦(جلد 2، صفحات 151–153)⁩ شامل ہے جس کی تفصیل ہم نے یہاں نہیں دیکھی {cite:jphogendijk-khujandi-works sezgin-reconstruction}۔"
  descendants:
    ar: "لا نسب مثبت إلى الأسطرلابات اللاحقة أو الصفيحة الزرقالية؛ ما وصلت إليه المصادر المقروءة أن الصفة «الشاملة» بقيت اسماً وموضوع تعليق، لا شجرة انتقال موثقة {cite:jphogendijk-khujandi-works hajji-khalifa} {cite:van-brummelen-khujandi-bea comprehensive-instrument}."
    en: "No established descent to later astrolabes or al-Zarqali's universal plate; what the sources read reach is that the 'comprehensive' label survived as a name and a commentary subject, not a documented transmission tree {cite:jphogendijk-khujandi-works hajji-khalifa} {cite:van-brummelen-khujandi-bea comprehensive-instrument}."
    ur: "بعد کے اسطرلابوں یا زرقالی کی جامع تختی تک ثابت نسب نہیں؛ پڑھے ماخذوں کی رسائی اتنی ہے کہ «شاملہ» نام اور حاشیے کا موضوع رہا، مستند سلسلہ نسب نہیں {cite:jphogendijk-khujandi-works hajji-khalifa} {cite:van-brummelen-khujandi-bea comprehensive-instrument}۔"
