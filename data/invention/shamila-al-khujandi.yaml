summary:
  ar: "آلة رصد وصفها أبو محمود الخجندي في رسالته «في صناعة الآلة الشاملة» لتغني عند عرض واحد عن الأسطرلاب أو الربع؛ قيّدها تصميمه في عرض واحد، ثم وسّعها هبة الله بن الحسين الأسترلابي في تعليقه لتخدم جميع العروض. نصها لم يُطبع ولا تُرجم قط، ويبقى في مخطوطات متناثرة عبر خمسة بلدان {cite:van-brummelen-khujandi-bea comprehensive-instrument} {cite:jphogendijk-khujandi-works treatise} {cite:ismi-khujandi-ala-shamila witnesses}."
  en: "An observing instrument described by Abu Mahmud al-Khujandi in his treatise on its construction to replace the astrolabe or a quadrant at a single latitude; Hibatallah ibn al-Husayn al-Asturlabi later widened it to serve all latitudes. The text was never printed or translated and survives in scattered manuscripts across five countries {cite:van-brummelen-khujandi-bea comprehensive-instrument} {cite:jphogendijk-khujandi-works treatise} {cite:ismi-khujandi-ala-shamila witnesses}."
  ur: "ابو محمود خجندی نے اپنے رسالے میں اس رصدی آلے کی تعمیر بیان کی جو ایک عرض بلد پر اسطرلاب یا ربع کی جگہ لیتا؛ بعد میں ہبت اللہ بن الحسین الاسترلابی نے اسے تمام عرض بلدوں کے لیے وسیع کیا۔ متن کبھی شائع یا ترجمہ نہیں ہوا اور پانچ ممالک کی بکھری مخطوطات میں باقی ہے {cite:van-brummelen-khujandi-bea comprehensive-instrument} {cite:jphogendijk-khujandi-works treatise} {cite:ismi-khujandi-ala-shamila witnesses}۔"
  es: "Un instrumento de observación descrito por Abu Mahmud al-Khujandi en su tratado sobre su construcción para reemplazar el astrolabio o un cuadrante en una sola latitud; Hibatallah ibn al-Husayn al-Asturlabi lo amplió posteriormente para que sirviera a todas las latitudes. El texto nunca se imprimió ni se tradujo y sobrevive en manuscritos dispersos en cinco países {cite:van-brummelen-khujandi-bea comprehensive-instrument} {cite:jphogendijk-khujandi-works treatise} {cite:ismi-khujandi-ala-shamila witnesses}."
  fr: "Un instrument d'observation décrit par Abu Mahmud al-Khujandi dans son traité sur sa construction, destiné à remplacer l'astrolabe ou le quadrant à une latitude donnée; Hibatallah ibn al-Husayn al-Asturlabi l'a ensuite étendu à toutes les latitudes. Le texte n'a jamais été imprimé ni traduit et nous est parvenu sous forme de manuscrits épars dans cinq pays."
  tr: "Ebu Mahmud el-Hucandi'nin \"Kapsamlı Aletin Yapımı Üzerine\" adlı risalesi içinde tanımladığı, tek bir ekranda usturlap veya kadranın yerini alması amaçlanan astronomik bir alet; tasarımı tek bir ekranla sınırlıydı, ancak Hibat Allah ibn el-Hüseyn el-Astrulabi tefsirinde bunu tüm ekranlara hizmet edecek şekilde genişletti. Metni hiçbir zaman basılmamış veya tercüme edilmemiş olup, beş ülkede dağınık el yazmalarında bulunmaktadır."
  id: "Sebuah instrumen astronomi yang dijelaskan oleh Abu Mahmud al-Khujandi dalam risalahnya \"Tentang Konstruksi Instrumen Komprehensif,\" yang dimaksudkan untuk menggantikan astrolab atau kuadran dalam tampilan tunggal; desainnya membatasinya hanya pada satu tampilan, tetapi Hibat Allah ibn al-Husayn al-Astrulabi memperluasnya dalam komentarnya untuk melayani semua tampilan. Teksnya belum pernah dicetak atau diterjemahkan, dan tetap ada dalam manuskrip yang tersebar di lima negara."
