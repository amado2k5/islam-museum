kids:
  ar: "صمم عالم قديم آلة يقول إنها تغني عن أداتين، لكنها كانت تعمل عند عرض واحد فقط. لاحقاً وجد معلق طريقة لتخدم كل العروض. اليوم نعرف القصة من مخطوطات قديمة، ولا يوجد نموذج باقٍ منها."
  en: "An old scientist designed an instrument he said could replace two tools, but it worked at only one latitude. A later commentator found a way to make it serve every latitude. We know the story from old manuscripts, and no example of it survives."
  ur: "ایک پرانے سائنسدان نے ایسا آلہ بنایا جس کے بارے میں کہا گیا کہ وہ دو اوزار کی جگہ لے سکتا ہے، مگر وہ صرف ایک عرض البلد پر کام کرتا تھا۔ ایک بعد کے حاشیہ نگار نے اسے ہر عرض البلد کے لیے چلانے کا طریقہ پایا۔ آج ہم کہانی پرانی مخطوطات سے جانتے ہیں، اور اس کا کوئی نمونہ باقی نہیں۔"
