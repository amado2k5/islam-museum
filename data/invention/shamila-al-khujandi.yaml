spread: []
impact:
  fields: [astronomy-instruments]
  changed:
    ar: "قدّم تصميماً واحداً يقول إنه يغني عند عرض محدود عن أداتين، ثم وسّع معلقه نطاق العرض؛ لا نعرف الوظائف الدقيقة لأن النص لم يُقرأ بعد {cite:van-brummelen-khujandi-bea comprehensive-instrument} {cite:jphogendijk-khujandi-works treatise}."
    en: "Offered a single design said to replace two instruments within a limited latitude, later widened by its commentator; exact functions stay unknown until the unpublished text is read {cite:van-brummelen-khujandi-bea comprehensive-instrument} {cite:jphogendijk-khujandi-works treatise}."
    ur: "ایک ڈیزائن پیش کیا گیا جو محدود عرض البلد میں دو آلات کی جگہ لیتا، بعد میں اس کے حاشیہ نگار نے اس کی وسعت کی؛ عین افعال تب تک نامعلوم جب تک غیر شائع شدہ متن پڑھا نہ جائے {cite:van-brummelen-khujandi-bea comprehensive-instrument} {cite:jphogendijk-khujandi-works treatise}۔"
  history:
    ar: "لم يبقَ نموذج للآلة ولا طبعة لنصها؛ بقيت معرفتها عبر خمس مخطوطات وملخص المراكشي في كتابه في حساب الوقت ومعاودة أوسكار شيرمر لنسبة الاختراع عبر تاريخ الحكماء {cite:jphogendijk-khujandi-works transmission} {cite:ismi-khujandi-ala-shamila witnesses}."
    en: "No example of the instrument and no edition of its text survive; knowledge persists through five manuscripts, al-Marrakushi's timekeeping compendium and Oskar Schirmer's attribution recovered via Ibn al-Qifti {cite:jphogendijk-khujandi-works transmission} {cite:ismi-khujandi-ala-shamila witnesses}."
    ur: "آلے کا کوئی نمونہ اور اس کے متن کی کوئی اشاعت باقی نہیں؛ پہچان پانچ مخطوطات، مراکشی کی اوقات کی جامع کتاب اور ابن قفطی کی تاریخ الحکما کے ذریعے اوسکار شمر کی شناخت دیتی ہے {cite:jphogendijk-khujandi-works transmission} {cite:ismi-khujandi-ala-shamila witnesses}۔"
  significance: 3
  why: "A named author's instrument design preserved through five manuscripts, a later all-latitude commentary and a medieval abridgment, but unpublished, untranslated and without a surviving example — narrower documentary reach than the Fakhri sextant."
