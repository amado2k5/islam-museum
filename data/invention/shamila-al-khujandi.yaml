dependents:
  - external: { ar: "تعديل هبة الله بن الحسين الأسترلابي لتخدم جميع العروض", en: "Hibatallah ibn al-Husayn al-Asturlabi's modification to serve all latitudes", ur: "ہبت اللہ بن الحسین الاسترلابی کی تمام عرض البلدوں کے لیے توسیع" }
