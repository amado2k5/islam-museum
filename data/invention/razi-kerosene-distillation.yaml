kids:
  ar: "قبل أكثر من ألف سنة كتب الرازي وصفة لصنع وقود صاف من النفط الأسود: غليّه في إناء فخاري وجمع ما يتبخر فيتحول إلى نفط أبيض صاف. هذا هو المبدأ نفسه الذي تصنع به مصافي النفط اليوم البنزين والكيروسين."
  en: "More than a thousand years ago al-Razi wrote a recipe for making a clean fuel from black petroleum: boil it in a clay vessel and collect what evaporates so it becomes clear white naft. That is the very principle today's refineries use to make petrol and kerosene."
  ur: "ہزار سے زیادہ برس پہلے رازی نے سیاہ نفت سے صاف ایندھن بنانے کی ترکیب لکھی: مٹی کے برتن میں ابالو اور جو بخار اٹھے اسے جمع کرو یہاں تک کہ صاف سفید نفت بن جائے۔ یہی اصول آج کی ریفائنریاں پٹرول اور مٹی کے تیل بنانے میں استعمال کرتی ہیں۔"
