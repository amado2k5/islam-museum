attribution:
  status: original
  claim:
    ar: "أقدم وصف مكتوب معروف لتحويل النفط الخام إلى «نفط أبيض» بالتقطير — ما يعادل تقريباً إنتاج الكيروسين — مع التحفظ بأن الوصف قد يسجّل ممارسة قائمة لا اختراعاً جديداً."
    en: "The earliest known written description of turning crude petroleum into 'white naft' by distillation — roughly the production of kerosene — with the caveat that the description may record existing refinery practice rather than a fresh invention."
    ur: "خام نفت کو آمیزش سے «سفید نفت» میں بدلنے کی قدیم ترین معلوم لکھی صفت — تقریباً مٹی کے تیل کی پیداوار — اس تحفظ کے ساتھ کہ یہ صفت شاید موجود عمل کو درج کرتی ہے نہ کہ نئی ایجاد۔"
  basis:
    ar: "يذكر بلكادي في مجلة أرامكو أن كتاب الأسرار للرازي يصف تقطير النفط في أوان فخارية حتى ينتج النفط الأبيض، ويعتبر ذلك الوصف الأول المعروف لإنتاج الكيروسين {cite:aramco-bilkadi-oil-weapons-1995}."
    en: "Bilkadi in Saudi Aramco World notes that al-Razi's Kitab al-Asrar describes distilling petroleum in clay vessels until white naft is produced, and treats it as the first known description of kerosene production {cite:aramco-bilkadi-oil-weapons-1995}."
    ur: "ارامکو ورلڈ میں بلقادی بتاتے ہیں کہ رازی کا کتاب الاسرار مٹی کے برتنوں میں نفت کی آمیزش بیان کرتی ہے یہاں تک کہ سفید نفت بنے، اور اسے مٹی کے تیل کی پیداوار کی پہلی معلوم صفت سمجھتے ہیں {cite:aramco-bilkadi-oil-weapons-1995}۔"
