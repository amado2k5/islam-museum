id: invention/razi-kerosene-distillation
class: invention
label:
  ar: "تقطير النفط إلى قطران أبيض عند الرازي"
  en: "Al-Razi's distillation of petroleum into white naft"
  ur: "رازی کی نفت کو سفید قطر میں آمیزش"
  es: "La destilación de petróleo de Al-Razi en naft blanco"
  fr: "La distillation du pétrole par Al-Razi en naft blanc"
  tr: "El-Razi'ye göre petrolün beyaz katran haline damıtılması"
  id: "Distilasi minyak menjadi tar putih menurut Al-Razi"
names:
  - { value: "kerosene distillation of al-Razi", kind: alternate, lang: en }
  - { value: "naft distillation", kind: alternate, lang: en }
summary:
  ar: "يصف الرازي في «كتاب الأسرار» عملية تقطير النفط الخام في أوانٍ فخارية حتى ينتج «النفط الأبيض» — وقود صافٍ يشبه الكيروسين — وهي أقدم وصف مكتوب معروف لإنتاج مادة تشبه الكيروسين بالتقطير في المصادر المقروءة."
  en: "In Kitab al-Asrar al-Razi describes distilling crude petroleum in clay vessels to produce 'white naft' — a clear fuel resembling kerosene — the earliest known written account of producing a kerosene-like substance by distillation in the sources read."
  ur: "رازی «کتاب الاسرار» میں خام نفت کو مٹی کے برتنوں میں آمیزش کر کے «سفید نفت» پیدا کرنے کی صفت بیان کرتے ہیں — ایک صاف ایندھن جو مٹی کے تیل جیسا ہے — پڑھے گئے ماخذوں میں مٹی کے تیل جیسی مادہ بنانے کی قدیم ترین لکھی ہوئی صفت۔"
  es: "En Kitab al-Asrar, al-Razi describe la destilación de petróleo crudo en recipientes de arcilla para producir 'naft blanco', un combustible transparente parecido al queroseno, el relato escrito más antiguo conocido sobre la producción de una sustancia similar al queroseno por destilación en las fuentes leídas."
  fr: "Dans son Kitab al-Asrar, al-Razi décrit la distillation du pétrole brut dans des récipients en argile pour produire du « naft blanc » — un carburant clair ressemblant au kérosène — le plus ancien compte rendu écrit connu de la production d'une substance semblable au kérosène par distillation dans les sources consultées."
  tr: "El-Razi, \"Sırlar Kitabı\"nda, ham petrolün toprak kaplarda damıtılarak \"beyaz yağ\" (kerosene benzer saf bir yakıt) üretme sürecini anlatır; bu, yazılı kaynaklarda damıtma yoluyla kerosen benzeri bir madde üretmenin bilinen en eski yazılı açıklamasıdır."
  id: "Dalam \"Kitab Rahasia\"-nya, Al-Razi menjelaskan proses penyulingan minyak mentah dalam wadah tanah liat untuk menghasilkan \"minyak putih\"—bahan bakar murni yang mirip dengan minyak tanah—yang merupakan deskripsi tertulis tertua yang diketahui tentang produksi zat mirip minyak tanah melalui penyulingan dalam sumber-sumber tertulis."
