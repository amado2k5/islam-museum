kids:
  ar: "قبل ألف ومئتي سنة كتب طبيب اسمه حنين كتاباً عن العين في عشرة أبواب: كيف تُبنى العين، وما أمراضها، وكيف تُعالج. كان أول كتاب مرتب عن العيون يعرفه المؤرخون، فصار مدرسةً يتعلم منها أطباء العيون قروناً."
  en: "More than a thousand years ago a physician named Hunayn wrote a book about the eye in ten chapters: how the eye is built, what its diseases are, and how to treat them. It was the first ordered book on eyes that historians know, and eye doctors learned from it for centuries."
  ur: "ہزار سے زیادہ برس پہلے حنین نامی طبیب نے آنکھ پر دس ابواب کی کتاب لکھی: آنکھ کیسے بنی، اس کے امراض کیا ہیں اور علاج کیسے۔ یہ مؤرخین کے علم میں آنکھوں کی پہلی مرتب کتاب تھی اور آنکھوں کے حکیم اس سے صدیوں سیکھتے رہے۔"
