summary:
  ar: "أقدم كتاب معروف يضع علم العيون في مقالات عشر مرتّبة — من تشريح العين وطبقاتها إلى أمراضها وعلاجاتها — نقل عن جالينوس ومنظّمته المدرسية بغداد في القرن الثالث الهجري؛ ويصفه مايرهوف بأنه أول كتاب منهجي معروف في طب العيون."
  en: "The earliest known book to arrange ophthalmology in ten ordered treatises — from the eye's anatomy and tunics to its diseases and treatments — drawing on Galen and organised in Abbasid Baghdad in the third Hijri century; Meyerhof calls it the earliest known systematic textbook of ophthalmology."
  ur: "قدیم ترین معلوم کتاب جس نے آنکھ کے علم کو دس مرتب شدہ مقالات میں ترتیب دیا — آنکھ کی تشریح اور طہقوں سے اس کے امراض اور علاجوں تک — جالینوس پر مبنی اور عباسی بغداد میں تیسری صدی ہجری میں مرتب؛ مائرہوف اسے آنکھوں کے طب کی قدیم ترین منظم نصابی کتاب کہتا ہے۔"
  es: "El libro más antiguo que se conoce que organiza la oftalmología en diez tratados ordenados —desde la anatomía y las túnicas del ojo hasta sus enfermedades y tratamientos—, basado en Galeno y organizado en el Bagdad abasí en el siglo III de la Hégira; Meyerhof lo considera el primer libro de texto sistemático de oftalmología que se conoce."
  fr: "Le plus ancien ouvrage connu à organiser l'ophtalmologie en dix traités ordonnés — de l'anatomie et des tuniques de l'œil à ses maladies et traitements — s'appuyant sur Galien et compilé à Bagdad sous les Abbassides au IIIe siècle de l'Hégire; Meyerhof le qualifie de plus ancien manuel systématique d'ophtalmologie connu."
  tr: "Göz anatomisi ve katmanlarından hastalıklarına ve tedavilerine kadar göz hastalıkları bilimini on madde halinde sıralayan bilinen en eski kitap, Hicri üçüncü yüzyılda Galen ve Bağdat'taki okul teşkilatı tarafından aktarılmıştır; Meyerhof bunu göz hastalıkları üzerine bilinen ilk sistematik kitap olarak tanımlamaktadır."
  id: "Buku tertua yang diketahui yang menjabarkan ilmu oftalmologi dalam sepuluh bagian yang tersusun — mulai dari anatomi dan lapisan mata hingga penyakit dan pengobatannya — ditransmisikan dari Galen dan organisasi sekolahnya di Baghdad pada abad ke-3 Hijriah; Meyerhof menggambarkannya sebagai buku sistematis pertama yang diketahui tentang oftalmologi."
