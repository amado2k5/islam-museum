    en: "Meyerhof's introduction to his 1928 English translation calls the work the earliest known systematic textbook of ophthalmology {cite:wellcome-hunayn-ten-treatises-eye-1928}."
    ur: "مائرہوف نے اپنی1928ء کی انگریزی ترجمے کی پیش لفظ میں اسے آنکھوں کے طب کی قدیم ترین منظم نصابی کتاب قرار دیا {cite:wellcome-hunayn-ten-treatises-eye-1928}۔"
