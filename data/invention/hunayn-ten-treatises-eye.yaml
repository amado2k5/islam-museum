  claim:
    ar: "أول تنظيم معروف لعلم العيون في كتاب منهجي واحد بمقالات عشر، مع الاعتراف بأن مادته العلمية غير مستحدثة كلها بل منقولة عن جالينوس وغيره."
    en: "The earliest known organisation of ophthalmology into a single systematic textbook of ten treatises, while acknowledging that its medical substance is largely transmitted from Galen and others rather than newly created."
    ur: "آنکھ کے علم کی قدیم ترین معلوم تنظیم ایک منظم نصابی کتاب میں دس مقالات کے ساتھ، یہ تسلیم کے ساتھ کہ اس کا طبی مادہ زیادہ تر جالینوس اور دیگر سے منقول ہے نہ کہ نیا۔"
  basis:
