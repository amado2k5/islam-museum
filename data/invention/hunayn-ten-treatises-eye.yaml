today:
  form:
    ar: "يبقى الكتاب شاهداً تاريخياً؛ طب العيون الحديث يرتكز على التصوير والجراحة المجهرية لا على مقالات مخطوطة."
    en: "The book remains a historical witness; modern ophthalmology rests on imaging and microsurgery, not manuscript treatises."
    ur: "یہ کتاب تاریخی شاہد ہے؛ جدید عینیات تصویری اور خرد جراحی پر قائم ہے نہ کہ مخطوطہ مقالات پر۔"
  descendants:
    ar: "تقسيم المقررات التخصصية إلى فصول مرتبة — نمط بقي في كتب الطب الأكاديمية."
    en: "The ordering of specialist courses into numbered chapters — a pattern that survived in academic medical books."
    ur: "تخصصی نصابوں کی مرتب ابواب میں تقسیم — ایک نمط جو علمی طبی کتب میں باقی رہا۔"
