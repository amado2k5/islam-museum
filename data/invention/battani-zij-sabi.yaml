summary:
  ar: زيج محمد بن جابر البتاني في سبعة وخمسين باباً وجداول، جمع أرصاده للشمس والقمر في الرقة وأنطاكية وصحّح حركاتهما وحركات
    الكواكب الخمسة عن بطلميوس؛ نُقل إلى اللاتينية والقشتالية، وتشير مصادره إلى نسخة أولى قبل ٢٨٨هـ ونسخة ثانية بأرصاد أنطاكية
    في يناير وأغسطس ٩٠١م {cite:nallino-albatenii-opus-astronomicum p. 17} {cite:nallino-albatenii-opus-astronomicum p. 40}
    {cite:nallino-albatenii-opus-astronomicum p. 41}.
  en: Muhammad ibn Jabir al-Battani's zij in fifty-seven chapters with tables, gathering his observations of the Sun and Moon
    at al-Raqqa and Antioch and correcting their motions and those of the five planets from Ptolemy; translated into Latin
    and Castilian, with sources indicating a first version before 288 AH and a second carrying Antioch observations of January
    and August 901 CE {cite:nallino-albatenii-opus-astronomicum p. 17} {cite:nallino-albatenii-opus-astronomicum p. 40} {cite:nallino-albatenii-opus-astronomicum
    p. 41}.
  ur: محمد بن جابر البتانی کی زیج، ستاون ابواب اور جدولوں پر مشتمل، جس میں رقہ اور انطاکیہ کے ارصاد اور بطلميوس سے حرکات کی
    تصحیح ہے؛ لاطینی اور قشتالی میں منتقل ہوئی، ماخذ پہلی نقل 288ھ سے پہلے اور دوسری جنوری اور اگست 901ء کے انطاکیہ ارصاد
    کے ساتھ بتاتے ہیں {cite:nallino-albatenii-opus-astronomicum p. 40} {cite:nallino-albatenii-opus-astronomicum p. 41}۔
  es: "El zij de Muhammad ibn Jabir al-Battani en cincuenta y siete capítulos con tablas, que reúne sus observaciones del Sol y la Luna en al-Raqqa y Antioquía y corrige sus movimientos y los de los cinco planetas de Ptolomeo; traducido al latín y al castellano, con fuentes que indican una primera versión anterior al 288 AH y una segunda que contiene observaciones de Antioquía de enero y agosto del 901 d. C. {cite:nallino-albatenii-opus-astronomicum p. 17} {cite:nallino-albatenii-opus-astronomicum p. 40} {cite:nallino-albatenii-opus-astronomicum p. 41}."
  fr: "Le zij de Muhammad ibn Jabir al-Battani en cinquante-sept chapitres avec des tableaux, rassemblant ses observations du Soleil et de la Lune à al-Raqqa et à Antioche et corrigeant leurs mouvements et ceux des cinq planètes d'après Ptolémée; traduit en latin et en castillan, avec des sources indiquant une première version avant 288 AH et une seconde contenant des observations d'Antioche de janvier et août 901 CE {cite:nallino-albatenii-opus-astronomicum p. 17} {cite:nallino-albatenii-opus-astronomicum p. 40} {cite:nallino-albatenii-opus-astronomicum p. 41}."
  tr: "Muhammed ibn Cabir el-Battani'nin Zij'i, elli yedi bölüm ve tablodan oluşmakta olup, Rakka ve Antakya'daki güneş ve ay gözlemlerini derlemiş ve Batlamyus'tan alınan beş gezegenin hareketlerini düzeltmiştir; Latince ve Kastilya diline çevrilmiş olup, kaynakları 288 Hicri yılından önce yazılmış ilk bir versiyonu ve Ocak ve Ağustos 901'de Antakya'da yapılan gözlemlerle birlikte ikinci bir versiyonu göstermektedir. {cite:nallino-albatenii-opus-astronomicum s. 17} {cite:nallino-albatenii-opus-astronomicum s. 40} {cite:nallino-albatenii-opus-astronomicum s. 41}"
  id: "Kitab Zij karya Muhammad ibn Jabir al-Battani, dalam lima puluh tujuh bab dan tabel, mengumpulkan pengamatannya tentang matahari dan bulan di Raqqa dan Antiokhia, dan mengoreksi pergerakan keduanya serta pergerakan lima planet dari Ptolemy; kitab ini diterjemahkan ke dalam bahasa Latin dan Kastilia, dan sumber-sumbernya menunjukkan versi pertama sebelum tahun 288 H dan versi kedua dengan pengamatan Antiokhia pada bulan Januari dan Agustus 901 M {cite:nallino-albatenii-opus-astronomicum p. 17} {cite:nallino-albatenii-opus-astronomicum p. 40} {cite:nallino-albatenii-opus-astronomicum p. 41}."
