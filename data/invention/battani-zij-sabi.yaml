  changed:
    ar: حوّل أرصاداً عربية جديدة إلى مرجع حسابي موحد لمواضع الكواكب والكسوف والخسوف والمواقيت، وصحّح ثوابت بطلميوس حيث خالفته
      المشاهدات.
    en: Turned fresh Arabic observations into a unified computational reference for planetary positions, eclipses and timekeeping,
      correcting Ptolemaic constants where observations disagreed.
    ur: نئے عربی ارصاد کو سیاروں کے مقام، گرہنوں اور اوقات کے حساب کے لیے ایک متحد عددی ماخذ بنایا، اور مشاہدات کی بنیاد پر
      بطلميوس کے مقررہ اعداد کی تصحیح کی۔
  history:
    ar: أثبت أن الزيج يمكن أن يقوم على أرصاد محلية جديدة لا على النقل وحده، وفتح طريق التصحيح الرصدي الذي اتبعته الزيجات اللاحقة.
    en: Showed a zij could rest on new local observations rather than transmission alone, opening the observational-correction
      path later zijes followed.
    ur: دکھایا کہ زیج محض ترسیل پر نہیں بلکہ نئے مقامی ارصاد پر بھی بن سکتی ہے، اور وہ راہ کھولی جس پر بعد کی زیجیں گئیں۔
  significance: 5
  why: A named zij of fifty-seven chapters with its own observation programme, the standard Muslim astronomical handbook transmitted
    into Latin and Castilian; the rating reflects its documented role in the zij tradition, not invention of the genre.
