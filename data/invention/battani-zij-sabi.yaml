today:
  form:
    ar: لا يُحسب اليوم بالزيج الصابي؛ لكنه محفوظ نصاً في طبعة نالينو وبترجمة أفلاطون، وقراءته تُظهر كيف بُنيت جداول الفلك
      الإسلامي.
    en: Nobody computes with al-Zij al-Sabi today, but it survives in Nallino's edition and Plato's translation, and reading
      it shows how Islamic astronomical tables were built.
    ur: آج کوئی زیج الصابی سے حساب نہیں کرتا، لیکن یہ نالینو کے ایڈیشن اور افلاطون کے ترجمے میں محفوظ ہے، اور پڑھنے سے معلوم
      ہوتا ہے کہ اسلامی فلکی جداول کیسے بنے۔
  descendants:
    ar: أثرت جداوله في الزيجات اللاحقة وفي الترجمة اللاتينية التي قرأها علماء أوروبا؛ ولا يوجد خط إنتاجي مباشر منها إلى الحاسبات
      الحديثة.
    en: Its tables influenced later zijes and the Latin translation read by European scholars; there is no direct production
      line from it to modern computers.
    ur: اس کے جداول بعد کی زیجوں اور لاطینی ترجمے پر اثر انداز ہوئے جسے یورپی علماء نے پڑھا؛ اس سے جدید کمپیوٹروں تک کوئی
      سیدھا تسلسل نہیں۔
