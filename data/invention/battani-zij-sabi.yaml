attribution:
  status: improvement
  claim:
    ar: نوع الزيج وطرائق الجداول فلكية قديمة؛ المساهمة الموثقة لزيج البتاني جمع أرصاد جديدة من الرقة وأنطاكية وتصحيح حركات
      الشمس والقمر والكواكب الخمسة عن المجسطي، لا اختراع الجدول الفلكي نفسه.
    en: The zij genre and table methods are older astronomy; al-Battani's documented contribution is gathering fresh observations
      from Raqqa and Antioch and correcting the motions of the Sun, Moon and five planets from the Almagest - not the invention
      of the astronomical table itself.
    ur: زیج کی صنف اور جدولی طریقے قدیم فلکیات ہیں؛ بتانی کا مستند حصہ رقہ اور انطاکیہ کے نئے ارصاد جمع کرنا اور المجسطي سے
      سورج، چاند اور پانچ سیاروں کی حرکات کی تصحیح ہے - فلکی جدول کی ایجاد نہیں۔
  basis:
    ar: يعرض ملخص العمل سبعة وخمسين باباً وجداول وأرصاداً للشمس والقمر في الرقة وأنطاكية وتصحيحاً لحركاتهما وحركات الكواكب
      الخمسة كما في المجسطي؛ ونالينو يبين نسختين زمنيتين. هذا عمل تحسيني داخل تقليد الزيج، لا أصل النوع.
    en: The work summary records fifty-seven chapters with tables, Sun and Moon observations at Raqqa and Antioch, and corrections
      of their motions and the five planets' motions as given in the Almagest; Nallino distinguishes two chronological versions.
      This is an improvement inside the zij tradition, not an original genre.
    ur: کام کا خلاصہ ستاون ابواب، جدول، رقہ و انطاکیہ کے ارصاد اور المجسطي کے مقابلے میں حرکات کی تصحیح بتاتا ہے؛ نالینو دو
      نسخے زمانے کے لحاظ سے الگ کرتا ہے۔ یہ زیج کی روایت میں بہتری ہے، صنف کی ایجاد نہیں۔
