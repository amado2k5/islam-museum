kids:
  ar: 'تخيّل كتاباً فلكياً قديماً فيه ٥٧ باباً: البتاني، عالم مسلم من الرقة، قاس مكان الشمس والقمر مراراً بعيونه وآلاته، ثم
    صحّح أرقام كتاب بطلميوس القديم وكتب كل شيء في جداول. سمّاه الناس «زيج البتاني»، ونُقل إلى لغات أوروبا فقرأه العلماء هناك.'
  en: 'Imagine an old astronomy book with 57 chapters: al-Battani, a Muslim scientist from Raqqa, measured the Sun and Moon''s
    positions again and again with his own eyes and instruments, then corrected the numbers in Ptolemy''s ancient book and
    wrote everything in tables. People called it ''al-Battani''s Zij'', and it was carried into European languages so scholars
    there could read it.'
  ur: 'سوچو ایک پرانا فلکیاتی کتاب جس میں 57 ابواب ہیں: بتانی، رقہ کا ایک مسلمان عالم، نے اپنے آنکھوں اور آلات سے سورج اور
    چاند کے مقامات بار بار ناپیں، پھر بطلميوس کی پرانی کتاب کے نمبر ٹھیک کیے اور سب کچھ جداول میں لکھا۔ لوگوں نے اسے «زیج
    البتانی» کہا، اور یہ یورپی زبانوں میں پہنچا تاکہ وہاں کے علماء اسے پڑھ سکیں۔'
