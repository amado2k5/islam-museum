summary:
  ar: "قلماً اخترعه الفضل بن سهل ذو الرياستين — وزير المأمون — وهو أحسن الأقلام، يعرف بالرياسي ويتفرع إلى عدة أقلام؛ يضبط ابن النديم في «الفهرست» أسماء فروعه: الرياسي الكبير، ونصف الرياسي، والثلث، والصغير النصف، والخفيف الثلث، والمحقق، والمنثور، والوشي، والرقاع، والمكاتبات، وغبار الحلبة، والنرجس، والبياض {cite:fihrist-ibn-al-nadim p. 19}."
  en: "A pen invented by al-Fadl ibn Sahl Dhu al-Riyasatayn — vizier of al-Ma'mun — the finest of pens, known as the Riyasi, branching into several pens; Ibn al-Nadim lists its branches in the Fihrist: the great Riyasi, half-Riyasi, the third, small-half, light-third, the muhaqqiq, the munthar, the washi, the raqa'iq, the mukatabat, ghubar al-halba, the narcissus, and the bayad {cite:fihrist-ibn-al-nadim p. 19}."
  ur: "ایک قلم جسے فضل بن سهل ذو الرئاستین — مامون کا وزیر — نے ایجاد کیا، تمام اقلام میں بہترین، «ریاسی» کے نام سے جانا جاتا ہے اور کئی اقلام میں شاخیں پھیلاتا ہے؛ ابن ندیم «الفہرست» میں اس کی شاخوں کے نام درج کرتا ہے: بڑا ریاسی، نصف ریاسی، ثلث، چھوٹا نصف، ہلکا ثلث، محقق، منثور، وشی، رقاع، مکاتبات، غبار الحلبہ، نرجس اور بیاض {cite:fihrist-ibn-al-nadim p. 19}۔"
