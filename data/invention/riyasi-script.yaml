impact:
  fields: [institutions-systems, everyday-life]
  changed:
    ar: "أضاف قلم الرياسي إلى ذخيرة أقلام ديوان الخلافة في عهد المأمون، فصار للديوان قلم «أحسن الأقلام» وفروعه للكتب المختلفة؛ ووصف ابن النديم اسمه وفروعه بعد نحو قرن من نشأته."
    en: "Added the Riyasi pen to the caliphal chancery's repertoire under al-Ma'mun, giving the diwan a 'finest of pens' with branches for different documents; Ibn al-Nadim described its name and branches about a century after its origin."
    ur: "مامون کے دور میں خلفائی دیوان کے اقلام کے ذخیرے میں ریاسی قلم شامل کیا، جس سے دیوان کو «تمام اقلام میں بہترین» قلم اور مختلف کاغذات کے لیے اس کی شاخیں ملیں؛ ابن ندیم نے اس کے وجود کے تقریباً ایک صدی بعد اس کے نام اور شاخیں بیان کیں۔"
  history:
    ar: "بقيت شهادة ابن النديم الوحيدة الموثقة: «الفهرست» يذكر القلم وفروعه دون أن يصف شكله أو يورد نموذجاً؛ ولا مخطوط أو نقش بخط الرياسي شُخص في المصادر المقروءة، فلا نعرف هل بقي أثر له في الخطوط اللاحقة أم لا."
    en: "Ibn al-Nadim's report is the only documented witness: the Fihrist names the pen and its branches without describing its shape or giving a specimen; no manuscript or inscription in the Riyasi hand is identified in the sources read, so whether it left a trace in later scripts is unknown."
    ur: "ابن ندیم کی گواہی ہی واحد دستاویزی گواہ ہے: «الفہرست» قلم اور اس کی شاخوں کے نام بیان کرتا ہے مگر اس کی شکل بیان نہیں کرتا یا نمونہ نہیں دیتا؛ پڑھے ماخذ میں ریاسی خط میں کوئی مخطوطہ یا نقش نہیں پہچانا گیا، اس لیے یہ معلوم نہیں کہ اس نے بعد کے خطوط میں کوئی نشان چھوڑا یا نہیں۔"
  significance: 3
  why: "A named, attributed chancery-script innovation inside the Abbasid administrative revolution under al-Ma'mun, known through a near-contemporary bibliographer's report; significance held at 3 because the evidence is a single descriptive passage with no surviving specimen."
