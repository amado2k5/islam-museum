    note: "The attribution belongs to al-Fadl ibn Sahl's career as vizier of al-Ma'mun: TDV records he entered al-Ma'mun's service as tutor after the Barmakids' fall, was named Dhu al-Riyasatayn for his decisive role in the civil war, and was killed at Sarakhs in 202 AH / 818 CE {cite:tdv-fazl-b-sehl pp. 275-276}. The pen is described only in Ibn al-Nadim's Fihrist, written in the 370s AH; the EDTF range marks the vizier's active window, not a dated specimen. A range cannot be written as a Hijri string, so only the EDTF range is given, marked derived."
