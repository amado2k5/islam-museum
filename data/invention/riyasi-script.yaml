origin:
  place: place/baghdad
  polity: polity/abbasid-caliphate
  context:
    ar: "بغداد في عهد المأمون؛ الفضل بن سهل وزيره ذو الرياستين الذي جمع السلطة العسكرية والمدنية، والسياق ديوان الخلافة وكتابة الطوامير والمراسلات الرسمية {cite:fihrist-ibn-al-nadim p. 18-19} {cite:tdv-fazl-b-sehl pp. 275-276}."
    en: "Baghdad under al-Ma'mun; al-Fadl ibn Sahl his vizier Dhu al-Riyasatayn who combined military and civil authority, in the context of the caliphal chancery and the writing of official documents and correspondence {cite:fihrist-ibn-al-nadim p. 18-19} {cite:tdv-fazl-b-sehl pp. 275-276}."
    ur: "مامون کے عہد کی بغداد؛ فضل بن سهل اس کا وزیر ذو الرئاستین جو فوجی اور دیوانی اختیار یکجا رکھتا تھا، خلفائی دیوان اور سرکاری کاغذات و مراسلت کی تحریر کے سیاق میں {cite:fihrist-ibn-al-nadim p. 18-19} {cite:tdv-fazl-b-sehl pp. 275-276}۔"
makers:
  - person: person/al-fadl-ibn-sahl
    role: inventor
    place: place/baghdad
    note: "Vizier of al-Ma'mun titled Dhu al-Riyasatayn; Ibn al-Nadim reports he 'invented a pen, the finest of pens, known as al-Riyasi' which branched into several pens. A Muslim in the sources read — TDV records his acceptance of Islam in 190 AH — with no named legal school, kept within the Sunni frame."
    sources: [source/fihrist-ibn-al-nadim, source/tdv-fazl-b-sehl]
attribution:
  status: original
  claim:
    ar: "ينسب ابن النديم إلى الفضل بن سهل اختراع قلم يعرف بالرياسي هو أحسن الأقلام، ويتفرع إلى عدة أقلام؛ التسجيل هنا مقيد بهذا القلم الديواني المنسوب إليه وفروعه المذكورة، لا بادعاء اختراع الخط العربي أو فن التزويق عموماً."
    en: "Ibn al-Nadim attributes to al-Fadl ibn Sahl the invention of a pen known as the Riyasi, the finest of pens, branching into several pens; this record is bounded to that attributed chancery pen-style and its listed branches — not a claim to have invented Arabic script or the art of calligraphy in general."
    ur: "ابن ندیم فضل بن سهل کو «ریاسی» نامی قلم کی ایجاد کا سہرا دیتا ہے جو تمام اقلام میں بہترین تھا اور کئی اقلام میں شاخیں پھیلاتا تھا؛ یہ ریکارڈ اسی منسوب دیوانی قلم اور اس کی درج شاخوں تک محدود ہے — نہ عربی رسم الخط کی ایجاد کا دعویٰ، نہ خطاطی کے فن کا۔"
  basis:
    ar: "في «الفهرست» يضبط ابن النديم ترتيب الأقلام الموزونة في عصر المأمون: بعد أقلام الثقال — قلم الطومار وقلم الثلثين وقلم السجلات وغيرها — يقول «فلما نشأ ذو الرياستين الفضل بن سهل اخترع قلماً هو أحسن الأقلام ويعرف بالرياسي ويتفرع إلى عدة أقلام» ثم يعدد أسماء الفروع {cite:fihrist-ibn-al-nadim p. 19}. ويذكر ابن النديم قبله رجل يحرر كتب السلطان إلى ملوك الأطراف في الطوامير ويعرف بالأحول المحرر من صنائع البرامكة، فكان له ترتيب الأقلام الأقدم {cite:fihrist-ibn-al-nadim p. 18-19}."
    en: "In the Fihrist Ibn al-Nadim sets out the ranking of the weighted pens in al-Ma'mun's age: after the heavy pens — qalam al-tumar, qalam al-thulthayn, qalam al-sijillat and others — he writes 'when Dhu al-Riyasatayn al-Fadl ibn Sahl arose, he invented a pen that is the finest of pens, known as al-Riyasi, and it branches into several pens', then lists the branch names {cite:fihrist-ibn-al-nadim p. 19}. Before him Ibn al-Nadim mentions a man who edited the sultan's documents to the kings of the regions in scrolls, known as al-Ahwal al-Muharrir of the Barmakid works, who had the earlier ranking of pens {cite:fihrist-ibn-al-nadim p. 18-19}."
    ur: "«الفہرست» میں ابن ندیم مامون کے زمانے کے وزنی اقلام کی ترتیب بیان کرتا ہے: بھاری اقلام — قلم الطمار، قلم الثلثین، قلم السجلات وغیرہ — کے بعد لکھتا ہے «جب ذو الرئاستین فضل بن سهل پیدا ہوا تو اس نے ایک قلم ایجاد کیا جو تمام اقلام میں بہترین تھا، ریاسی کے نام سے جانا جاتا تھا اور کئی اقلام میں شاخیں پھیلاتا تھا» پھر شاخوں کے نام گنواتا ہے {cite:fihrist-ibn-al-nadim p. 19}۔ اس سے پہلے ابن ندیم ایک ایسے شخص کا ذکر کرتا ہے جو سلطان کے کاغذاتاطراف کے بادشاہوں کو طوامیر میں لکھتا تھا، «الأحول المحرر» کے نام سے مشہور برامکہ کے کلام سے، جس کے پاس اقلام کی پرانی ترتیب تھی {cite:fihrist-ibn-al-nadim p. 18-19}۔"
precursors:
  - external: { ar: "أقلام الثقال المرتبة التي ذكرها ابن النديم قبل الرياسي: قلم الطومار والثقلين والسجلات والعهود والمؤامرات والأمانات والديباج والمدمج والمرصع والنسخ", en: "The ranked heavy pens Ibn al-Nadim lists before the Riyasi: qalam al-tumar, al-thulthayn, al-sijillat, al-'uhud, al-mu'amarat, al-amanat, al-dibaj, al-mudmaj, al-muraqqa', al-nusakh", ur: "ریاسی سے پہلے ابن ندیم کی گنوائی گئی بھاری اقلام: قلم الطمار، الثقلین، السجلات، العھود، المؤامرات، الأمانات، الدیباج، المدمج، المرصع، النسخ" }
    note: "Ibn al-Nadim places the Riyasi after an earlier ranked repertoire of chancery pens associated with al-Ma'mun's secretaries and with al-Ahwal al-Muharrir of the Barmakid works; the record claims the attributed new pen-style, not the whole pen-ranking system."
    sources: [source/fihrist-ibn-al-nadim]
