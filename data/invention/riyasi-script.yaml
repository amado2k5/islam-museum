today:
  form:
    ar: "لا توجد أداة مادية؛ بقي الشكل في اسم القلم وفروعه في «الفهرست»، وفي الطباعة الحديثة التي حملت مفاهيم الخط الديواني إلى الطرز الخطية المعاصرة."
    en: "No physical object survives; the form lives in the pen's name and branches in the Fihrist, and in modern typefaces that carry chancery-script concepts into contemporary lettering."
    ur: "کوئی مادی چیز باقی نہیں؛ شکل «الفہرست» میں قلم کے نام اور اس کی شاخوں میں اور جدید ٹائپ فیسوں میں باقی ہے جو دیوانی خط کے تصورات کو عصری رسم الخط میں لاتی ہیں۔"
  descendants:
    ar: "لا يثبت في المصادر المقروءة نسل مباشر من قلم الرياسي إلى خط بعينه لاحق؛ الخطوط الديوانية العباسية اللاحقة — كالمحقق والنسخ والثلث — عائلة أوسع، والقلم المنسوب إلى الفضل بن سهل موضعه داخلها غير محسوم في النصوص المقروءة."
    en: "The sources read establish no direct descent from the Riyasi pen to any particular later script; the later Abbasid chancery hands — muhaqqaq, naskh, thuluth — form a wider family, and the pen attributed to al-Fadl sits inside it without a fixed place in the texts consulted."
    ur: "پڑھے ماخذ ریاسی قلم سے کسی مخصوص بعد کے خط تک براہ راست نسل ثابت نہیں کرتے؛ بعد کے عباسی دیوانی خطوط — محقق، نسخ، ثلث — ایک بڑے خاندان پر مشتمل ہیں، اور فضل بن سهل سے منسوب قلم پڑھے گئے متون میں اس کے اندر اپنی جگہ رکھتا ہے بغیر اس کے کہ اس کی ٹھیک جگہ طے ہو۔"
