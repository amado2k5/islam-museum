kids:
  ar: "في زمن الخلفاء العباسيين كان للخطوط أسماء كثيرة وأقلام موزونة لكل مقام: قلم للكتب السلطانية إلى الملوك، وقلم للسجلات، وقلم للعقود. وقيل إن وزيراً عظيماً اسمه الفضل بن سهل ابتكر قلماً جديداً سماه «الرياسي» لأنه كان أحسن الأقلام، فتفرع إلى أقلام كثيرة استعملها كتّاب الديوان. لم يبقَ من هذا القلم نموذج، لكن اسم فروعه بقي في كتاب الفهرست، فيعرفنا أن الخط عندهم كان علماً له مقاييس لا مجرد حروف جميلة."
  en: "In the time of the Abbasid caliphs, scripts had many names and weighted pens for every station: a pen for sultanic letters to kings, a pen for registers, a pen for contracts. It is said that a great minister named al-Fadl ibn Sahl invented a new pen he called the Riyasi because it was the finest of pens, and it branched into many pens used by the chancery's writers. No specimen of this pen survives, but the names of its branches remain in the book al-Fihrist — telling us that script was a measured science for them, not just pretty letters."
  ur: "عباسی خلفاء کے زمانے میں خطوط کے بہت سے نام تھے اور ہر مقام کے لیے وزنی قلم تھے: بادشاہوں کو سلطانی خطوط کے لیے ایک قلم، رجسٹرز کے لیے ایک قلم، معاہدوں کے لیے ایک قلم۔ کہا جاتا ہے کہ فضل بن سهل نامی عظیم وزیر نے ایک نیا قلم ایجاد کیا جسے «ریاسی» کہا کیونکہ وہ تمام اقلام میں بہترین تھا، اور یہ کئی قلموں میں شاخیں پھیلا جو دیوان کے کاتب استعمال کرتے تھے۔ اس قلم کا کوئی نمونہ باقی نہیں، لیکن اس کی شاخوں کے نام «الفہرست» کی کتاب میں باقی ہیں — جو بتاتے ہیں کہ ان کے ہاں خط ایک ماپا ہوا علم تھا، محض خوبصورت حروف نہیں۔"
