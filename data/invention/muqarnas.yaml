    painted stucco and the possible Baghdad origin, ornamental-vs-structural debate,
    Rosintal, Diez''s "rooted in Islamic mentality", spread c. 11th c., regional survey
    (Persia — Ladjin 1022, Gulpaygan, Isfahan trilobed squinches; Egypt: Juyushi minaret
    1085, al-Aqmar 1125, Sultan Hasan cornice; Qutb Minar; western muqarbas and scalloped
    arches Kutubiyya/Tinmal/Qarawiyyin). English Wikipedia "Muqarnas" revision 1384665126
    — Arab-Ata 977-8, Gunbad-i Qabus 1006-7, Duvazdah Imam 1037-8, Imam Dur 1090 (reported
    destroyed 2014), Tabbaa''s Baghdad thesis, Topkapi Scroll, regional materials.
    Tabbaa 1985 is bibliographic-only.'
