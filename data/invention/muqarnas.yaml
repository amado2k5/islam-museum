summary:
  ar: زخرفة معمارية إسلامية من صفوف منافذ ⁦(خلايا)⁩ تركب بعضها فوق بعض في نظام هندسي
    حول محاور تناظر قليلة، فتصنع سطحاً ثلاثي الأبعاد يشبه خلية النحل؛ أقدم آثارها
    شذرات نيشابور ⁦(القرن الثالث/التاسع أو الرابع/العاشر)⁩ وانتشرت نحو القرن الحادي
    عشر من مصر إلى آسيا الوسطى حتى صارت مع أرابيسك والكتابة سمةً مميزة للعمارة الإسلامية
    {cite:encyclopaedia-of-islam-2} {cite:wikipedia-muqarnas-en}.
  en: The signature three-dimensional decoration of Islamic architecture — tiers of
    niche-like cells corbelled over one another inside a geometric frame around a
    few axes of symmetry, producing a honeycomb surface of light and shade; its earliest
    traces are stucco fragments from Nishapur (ninth-tenth centuries), and by about
    the eleventh century it had spread from Egypt to Central Asia to become, with
    the arabesque and the inscription band, a hallmark of the architecture {cite:encyclopaedia-of-islam-2}
    {cite:wikipedia-muqarnas-en}.
  ur: اسلامی معماری کی مخصوص تہہ دار سجاوٹ — محراب نما خانوں کی تہیں ہندسی قالب میں
    ایک دوسرے پر چڑھائی جاتی ہیں اور شعاع و سایہ کی مہربانی والی سطح بنتی ہے؛ قدیم
    ترین شواہد نیشاپور کے جصی ٹکڑے ⁦(نویں-دسویں صدی)⁩ ہیں اور گیارہویں صدی کے قریب
    یہ مصر سے وسط ایشیا تک پھیل کر عربیسک اور کتیبوں کے ساتھ معماری کی پہچان بنی {cite:encyclopaedia-of-islam-2}
    {cite:wikipedia-muqarnas-en}۔
  es: "La característica decoración tridimensional de la arquitectura islámica —niveles de celdas en forma de nicho superpuestas unas sobre otras dentro de un marco geométrico alrededor de unos pocos ejes de simetría, produciendo una superficie de panal de luz y sombra; sus primeros vestigios son fragmentos de estuco de Nishapur (siglos IX-X), y hacia el siglo XI se había extendido desde Egipto a Asia Central para convertirse, junto con el arabesco y la banda de inscripción, en un sello distintivo de la arquitectura {cite:encyclopaedia-of-islam-2} {cite:wikipedia-muqarnas-en}."
