origin:
  polity: polity/abbasid-caliphate
  context:
    ar: ورش البنّائين والجصّاصين من عاصمة الخلافة إلى مدن خراسان؛ وإن صحّ تأريخ شذرات
      فسطاط على العباسيين رجّحت EI2 أن تكون بغداد دار الخلافة مهدَ المقرنص {cite:encyclopaedia-of-islam-2}.
    en: The masons' and stucco-workers' shops from the caliphal capitals to the cities
      of Khurasan; if the Fustat bath fragments prove Abbasid, EI2 judges Baghdad,
      seat of the caliphate, could well be the muqarnas's birthplace {cite:encyclopaedia-of-islam-2}.
    ur: خلافت کے دارالحکومت سے خراسان کے شہروں تک معماروں اور جص کاروں کی ورکشاپیں؛
      اگر فسطاط کے حمام کے ٹکڑے عباسی ثابت ہوں تو EI2 بغداد کو مقرنس کی جائے پیدائش
      قرار دے سکتی ہے {cite:encyclopaedia-of-islam-2}۔
