kids:
  ar: 'انظر إلى سقف مسجد قديم وستجده أحياناً كأنه خلية نحل مقلوبة: مئات المنافذ الصغيرة،
    كل واحدة فوق التي تحتها، تلعب بالضوء والظل كالكريستال. هذا هو المقرنص — اخترعته
    ورش البنّائين المسلمين قبل ألف سنة تقريباً، وما زلت تراه من فاس إلى دلهي.'
  en: Look up at an old mosque's ceiling and sometimes it seems like an upside-down
    honeycomb — hundreds of tiny niches, each resting on the ones below, playing with
    light and shadow like a crystal. That is muqarnas — invented in Muslim builders'
    workshops nearly a thousand years ago, and still visible from Fez to Delhi.
  ur: کسی پرانی مسجد کی چھت کو دیکھو تو کبھی وہ الٹی مہندی کی چھتے جیسی لگتی ہے —
    سیکڑوں چھوٹے محرابے، ہر ایک نیچلے پر ٹکی، بلور کی طرح روشنی اور سایہ سے کھیلتے۔
    یہ مقرنس ہے — مسلم معماروں کی ورکشاپوں نے تقریباً ہزار سال پہلے ایجاد کیا، اور
    آج بھی فاس سے دہلی تک نظر آتی ہے۔
