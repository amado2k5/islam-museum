today:
  form:
    ar: يُبنى المقرنص حيّاً في ورش الجص المغربية والبنّائين الإيرانيين، ويُرمَّم في
      العمائر التاريخية، ويدرسه معماريو اليوم كنظام هندسي وحداتي قابل للتصنيع {cite:wikipedia-muqarnas-en}.
    en: Muqarnas is still built by living plaster workshops in Morocco and Iran, restored
      on historic monuments, and studied by today's architects as a modular geometric
      system {cite:wikipedia-muqarnas-en}.
    ur: مقرنس آج بھی مراکش اور ایران کے جص کاروں کی ورکشاپوں میں بنتا، تاریخی عمارتوں
      پر مرمت ہوتا، اور جدید معمار اسے ماڈیولر ہندسی نظام سمجھ کر پڑھتے ہیں {cite:wikipedia-muqarnas-en}۔
  descendants:
    ar: مخططات البنّائين الوسطويين ⁦(مخطوط طوبقابي)⁩ وحساب الكاشي لمساحته ثم برامج
      التصميم الحاسوبي الحديثة — سلسلة هندسية واحدة {cite:wikipedia-muqarnas-en}.
    en: Medieval builders' drawings ⁦(the Topkapi Scroll)⁩, al-Kashi's surface mensuration,
      and modern parametric design software — one geometric chain {cite:wikipedia-muqarnas-en}.
    ur: قرون وسطی کے معماری نقشے ⁦(طوپقاپی سکرول)⁩، کاشی کی سطح پیمائش، اور جدید پیرامیٹرک
      ڈیزائن سافٹ ویئر — ایک ہی ہندسی زنجیر {cite:wikipedia-muqarnas-en}۔
