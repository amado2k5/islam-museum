attribution:
  status: contested
  claim:
    ar: 'المقرنص اختراع العمارة الإسلامية بلا منازع، لكن مهده متنازع: خراسان ⁦(شذرات
      نيشابور)⁩، أو بغداد العباسية ⁦(شذرات فسطاط إن صح تاريخها)⁩، أو تطور متزامن في
      أقاليم متباعدة {cite:encyclopaedia-of-islam-2} {cite:wikipedia-muqarnas-en}.'
    en: Muqarnas is uncontestedly an invention of Islamic architecture, but its cradle
      is disputed — Khurasan ⁦(the Nishapur fragments)⁩, Abbasid Baghdad ⁦(the Fustat
      fragments, if the dating holds)⁩, or parallel development in distant regions
      at once {cite:encyclopaedia-of-islam-2} {cite:wikipedia-muqarnas-en}.
    ur: 'مقرنس بلاشبہ اسلامی معماری کی ایجاد ہے مگر اس کا مسکن متنازع ہے: خراسان ⁦(نیشاپور
      کے ٹکڑے)⁩، عباسی بغداد ⁦(فسطاط کے ٹکڑے، اگر تاریخ درست ہو)⁩، یا دور دراز علاقوں
      میں بیک وقت نشو و نما {cite:encyclopaedia-of-islam-2} {cite:wikipedia-muqarnas-en}۔'
  basis:
    ar: 'تسجل EI2 التصوّرات المتنافسة: نسبته المعتادة إلى بلاد فارس الشرقية في القرن
      الرابع/العاشر، شذرات نيشابور ⁦(الثالث/التاسع أو الرابع/العاشر)⁩، جص حمام فسطاط
      الموشّى بأسلوب سامراء واحتمال منشأ بغدادي، وتقدّم ديتز القائل بأنه ليس اختراع
      فرد بل متجذر في الذهنية الإسلامية {cite:encyclopaedia-of-islam-2}؛ وتلخص المقالة
      المسجلة فرضيات كرزويل ومارسي وطبّاع {cite:wikipedia-muqarnas-en}.'
    en: 'EI2 records the competing readings: its usual attribution to 4th/10th-century
      eastern Persia, the Nishapur fragments ⁦(3rd/9th or 4th/10th century)⁩, the
      Samarra-style painted stucco of the Fustat hammam and the possible Baghdad origin,
      and Diez''s view that muqarnas was no individual''s invention but rooted in
      Islamic mentality; the recorded encyclopedia revision summarises the Creswell-Marçais
      simultaneous-development thesis and Tabbaa''s Baghdad claim {cite:encyclopaedia-of-islam-2}
      {cite:wikipedia-muqarnas-en}.'
    ur: 'EI2 متعارض قراءتیں درج کرتی ہے: معمولاً مشرقی فارس ⁦(چوتھی/دسویں صدی)⁩ کی
      نسبت، نیشاپور کے ٹکڑے ⁦(تیسری/نویں یا چوتھی/دسویں)⁩، فسطاط حمام کا سامرائي طرز
      کا جص اور ممکنہ بغدادی آغاز، اور ڈیز کی رائے کہ مقرنس کسی فرد کی ایجاد نہیں
      بلکہ اسلامی ذہنیت میں جڑ رکھتا ہے؛ درج شدہ انسائیکلوپیڈیا نظرثانی کریزویل و
      مارسے کی بیک وقت نشو و نما اور طباع کی بغدادی دعویٰ کا خلاصہ دیتی ہے {cite:encyclopaedia-of-islam-2}
      {cite:wikipedia-muqarnas-en}۔'
  perspectives:
  - tradition: sunni
    id: ornament-of-the-mosque
    summary:
      ar: زينة البيت والمسجد — في الإطار السني العام قرئ المقرنص لغةً معمارية للعبادة
        — علّق المآذنَ وعقودَ المحاريب ومناطق انتقال القباب، وكسّر الضوء كما يكسر
        البلّورُ الشعاعَ — وهو ما سعت إليه عمارة المسلمين دوماً {cite:encyclopaedia-of-islam-2}.
      en: 'The ornament of house and mosque — read in the museum''s Sunni default
        frame as the worship-space''s architectural language: carrying minaret balconies,
        crowning mihrabs and portals, dressing dome transitions, and breaking light
        the way a crystal breaks a ray — the effect Muslim builders always sought
        {cite:encyclopaedia-of-islam-2}.'
      ur: گھر اور مسجد کی زینت — سنی عمومی فریم میں مقرنس عبادت گاہ کی معماری زبان
        قرار پاتی ہے — مینار کے بالاخانوں کو تھامتی، محرابوں اور دروازوں کو سجاتی،
        گنبد کی انتقالی جگہ کو آراستہ کرتی اور روشنی کو بلور کی طرح توڑتی ہے — وہی
        اثر جسے مسلم معمار ہمیشہ چاہتے تھے {cite:encyclopaedia-of-islam-2}۔
    sources:
    - source/encyclopaedia-of-islam-2
  - tradition: academic
    id: cradle-undecided
    summary:
      ar: مهد غير محسوم بين خراسان وبغداد والتزامن — الراجح قديماً عند روزنتال منشأ
        فارسي بنيوي ⁦(الركنية)⁩، ورجّحت أعمال نيشابور وبوغاتشينكوفا المنشأ الزخرفي،
        وقالت EI2 بإمكان بغداد إن تأكد أباسية شذرات فسطاط، وذهب طبّاع إلى بغداد القرن
        الحادي عشر {cite:encyclopaedia-of-islam-2} {cite:wikipedia-muqarnas-en}.
      en: The cradle is undecided between Khurasan, Baghdad and simultaneity — Rosintal's
        older reading made it a Persian structural form (the squinch multiplied),
        the Nishapur and Pugachenkova work favours an ornamental origin, EI2 allows
        Baghdad if the Fustat fragments are Abbasid, and Tabbaa argues for eleventh-century
        Abbasid Baghdad {cite:encyclopaedia-of-islam-2} {cite:wikipedia-muqarnas-en}
        {cite:tabbaa-muqarnas-dome-1985}.
      ur: مسکن خراسان، بغداد اور بیک وقت پیدائش کے درمیان غیر فیصلہ شدہ — روزنتال
        کی پرانی قراءت اسے فارسی ساختی شکل ⁦(سکوینچ کی تکثیر)⁩ مانی، نیشاپور اور پوگاچینکوا
        کی تحقیق سجاوٹی آغاز کی حامی، EI2 فسطاط ٹکڑوں کے عباسی ثابت ہونے پر بغداد
        کو اجازت دیتی، اور طباع گیارہویں صدی کے عباسی بغداد کی دعو کرتا ہے {cite:encyclopaedia-of-islam-2}
        {cite:wikipedia-muqarnas-en} {cite:tabbaa-muqarnas-dome-1985}۔
    sources:
    - source/encyclopaedia-of-islam-2
    - source/wikipedia-muqarnas-en
    - source/tabbaa-muqarnas-dome-1985
precursors:
- external:
    ar: الركنية ⁦(السكوينش)⁩ ونصف القبة المحاري
    en: The squinch and the niche-head semi-dome
    ur: سکوینچ اور محرابی نصف گنبد
  note: The muqarnas cell repeats the squinch's quarter-dome form on a smaller scale
    — which is why early scholarship tied the technique to Persian dome transition
    zones (EI2).
  sources:
  - source/encyclopaedia-of-islam-2
- external:
    ar: شذرات نيشابور وجص فسطاط
    en: The Nishapur stucco fragments and the Fustat bath plaster
    ur: نیشاپور کے جصے اور فسطاط حمام کا پلستر
  note: The excavated candidates for the very first cells — concave stucco niches
    reconstructed as wall facing (Nishapur) and painted Samarra-style stucco in a
    Fustat bath, both possibly ninth-tenth century.
  sources:
  - source/encyclopaedia-of-islam-2
  - source/wikipedia-muqarnas-en
dependents:
- invention: invention/kashi-muqarnas-mensuration
  note: Al-Kashi's Miftah al-Hisab (1427) contains the oldest known written mensuration
    of muqarnas surfaces — the craft older than its mathematics.
  sources:
  - source/encyclopaedia-of-islam-2
- external:
    ar: مقربص الغرب الإسلامي ⁦(موكارابي)⁩
    en: The muqarbas of the Islamic west (mocárabe)
    ur: اسلامی مغرب کا مقربص ⁦(موکارابی)⁩
  note: The western sister-form — plaster and timber muqarnas of North Africa and
    al-Andalus, from the Kutubiyya's scalloped arches to the Alhambra's domes (EI2
    MUKARNAS and MUKARBAS).
  sources:
  - source/encyclopaedia-of-islam-2
spread: []
impact:
  fields:
  - architecture-building
  changed:
    ar: 'منح العمارة الإسلامية أداةً تصهر الانتقال الإنشائي بالزخرفة: صار الساكف والركن
      والعقد سطحاً واحداً حياً من خلايا هندسية تكسر الضوء {cite:encyclopaedia-of-islam-2}.'
    en: It gave Islamic architecture a device that fuses structural transition and
      ornament into one living surface of geometric cells that breaks the light {cite:encyclopaedia-of-islam-2}.
    ur: اس نے اسلامی معماری کو ایسا فن دیا جو ساختی منتقلی اور سجاوٹ کو ہندسی خانوں
      کی ایک زندہ سطح میں ڈھال دیتا ہے جو روشنی توڑتی ہے {cite:encyclopaedia-of-islam-2}۔
  history:
    ar: 'من مآذن القاهرة إلى إيوان أصفهان وقبة الحمراء ومآذن دلهي: غطّى المقرنص ألفَ
      عام من المآذن والمشاهد والقصور، وصار الاسمُ — مع الأرابيسك — اختصاراً لـ«العمارة
      الإسلامية» في المتاحف {cite:encyclopaedia-of-islam-2}.'
    en: From Cairo's minarets to Isfahan's iwans, the Alhambra's domes and Delhi's
      Qutb Minar — a thousand years of towers, shrines and palaces wear it, and the
      word itself — with the arabesque — became shorthand for "Islamic architecture"
      in museums {cite:encyclopaedia-of-islam-2}.
    ur: قاہرہ کے میناروں سے اصفہان کے ایوان، الحمرا کے گنبد اور دہلی کے قطب مینار
      تک — ہزار سال میناروں، مقبروں اور محلات نے اسے پہنا، اور نام — عربیسک کے ساتھ
      — عجائب گھروں میں «اسلامی معماری» کا لقب بنا {cite:encyclopaedia-of-islam-2}۔
  significance: 5
  why: The archetypal form of Islamic architecture — invented in its workshops, disputed
    in its cradle, universal from Fez to Delhi, and still built by plaster masters
    today.
