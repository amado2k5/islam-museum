    note: EI2 dates the Nishapur stucco niche fragments — reconstructed as muqarnas
      facing for walls and corners in residential buildings — to the 3rd/9th or 4th/10th
      century, and calls the painted Fustat hammam stucco muqarnas possibly of the
      same Abbasid period; the first in-situ tripartite squinches (Arab-Ata 977-8,
      Gunbad-i Qabus 1006-7) are slightly later. Century precision only because the
      fragments are excavated context, not dated documents.
    sources:
