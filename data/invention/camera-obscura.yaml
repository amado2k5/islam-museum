spread: []
impact:
  fields: [optics-physics]
  changed:
    ar: "صار امتداد الضوء على الاستقامة أمراً يُختبر لا يُفترض: بالثقب والبيت المظلم والجسم الكثيف والمسطرة {cite:manazir-sabra-1983 pp. 73–75}. ويرى محقق الكتاب أن «المناظر» أهم كتاب في البصريات بين بطلميوس في القرن الثاني وكبلر وديكارت في أوائل القرن السابع عشر {cite:manazir-sabra-1983 p. 9}، وتقول موسوعة TDV إن ابن الهيثم غيّر علم البصريات من أصوله، وإن تجربة الحجرة المظلمة أساس آلة التصوير اليوم {cite:tdv-ibnul-heysem pp. 82–87}."
    en: "That light travels in straight lines became something to test rather than assume, with the hole, the dark room, the opaque body and the ruler {cite:manazir-sabra-1983 pp. 73–75}. The editor counts the Manazir the most important book on optics between Ptolemy in the second century and Kepler and Descartes in the early seventeenth {cite:manazir-sabra-1983 p. 9}, and TDV says Ibn al-Haytham changed the science of optics at its roots and that the dark-room experiment is the basis of today's photographic camera {cite:tdv-ibnul-heysem pp. 82–87}."
    ur: "یہ بات کہ روشنی سیدھی لکیر میں چلتی ہے، فرض کرنے کے بجائے جانچنے کی چیز بن گئی، سوراخ، تاریک کمرے، ٹھوس جسم اور پیمانے کے ساتھ {cite:manazir-sabra-1983 pp. 73–75}۔ کتاب کے محقق «المناظر» کو دوسری صدی میں بطلیموس اور سترھویں صدی کے آغاز میں کیپلر اور دیکارت کے درمیان بصریات کی سب سے اہم کتاب سمجھتے ہیں {cite:manazir-sabra-1983 p. 9}، اور ٹی ڈی وی کہتا ہے کہ ابن الہیثم نے علمِ بصریات کو جڑ سے بدل دیا اور تاریک کمرے کا تجربہ آج کے فوٹوگرافی کیمرے کی بنیاد ہے {cite:tdv-ibnul-heysem pp. 82–87}۔"
  history:
    ar: "نُقل الكتاب إلى اللاتينية نحو سنة 1200، وبقي منه نحو عشرين مخطوطاً لاتينياً، وتُرجم إلى الإيطالية في القرن الرابع عشر، وطبعه رزنر في بازل سنة 1572، وبنى عليه فيتيلو كتابه {cite:manazir-sabra-1983 pp. 47–48}. وفي العالم الإسلامي أعاد كمال الدين الفارسي كتابته في «تنقيح المناظر» {cite:manazir-sabra-1983 pp. 44–46}، وشرح مقالة ابن الهيثم في صورة الكسوف التي ترجمها فيدمان إلى الألمانية باسم «الحجرة المظلمة عند ابن الهيثم» {cite:tdv-ibnul-heysem pp. 82–87}."
    en: "The book was put into Latin around 1200; some twenty Latin manuscripts survive; it was translated into Italian in the fourteenth century; Risner printed it at Basel in 1572; and Witelo built his own book on it {cite:manazir-sabra-1983 pp. 47–48}. In the Islamic world Kamal al-Din al-Farisi rewrote it as Tanqih al-Manazir {cite:manazir-sabra-1983 pp. 44–46} and commented on Ibn al-Haytham's treatise on the form of the eclipse, which Wiedemann translated into German under the title 'The camera obscura in Ibn al-Haytham' {cite:tdv-ibnul-heysem pp. 82–87}."
    ur: "کتاب کا تقریباً 1200ء میں لاطینی میں ترجمہ ہوا؛ اس کے تقریباً بیس لاطینی مخطوطے باقی ہیں؛ چودھویں صدی میں اس کا اطالوی ترجمہ ہوا؛ رزنر نے اسے 1572ء میں بازل میں چھاپا؛ اور وٹیلو نے اپنی کتاب اسی پر کھڑی کی {cite:manazir-sabra-1983 pp. 47–48}۔ اسلامی دنیا میں کمال الدین فارسی نے اسے «تنقیح المناظر» کے نام سے دوبارہ لکھا {cite:manazir-sabra-1983 pp. 44–46} اور ابن الہیثم کے گرہن کی صورت والے رسالے کی شرح کی، جس کا وائیڈمان نے «ابن الہیثم کے ہاں کیمرا آبسکیورا» کے عنوان سے جرمن میں ترجمہ کیا {cite:tdv-ibnul-heysem pp. 82–87}۔"
  significance: 4
  why: "Turned the familiar sight of light through a hole into an ordered experiment that proved light travels in straight lines and that lights cross without mixing; through the Latin Manazir and al-Farisi's Tanqih it shaped optics in Europe and the Islamic world, and TDV calls it the basis of the photographic camera."
