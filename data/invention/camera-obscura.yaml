origin:
  place: place/cairo
  context:
    ar: "وُلد ابن الهيثم في البصرة نحو سنة 354هـ، وعمل فيها في الديوان أيام البويهيين بلقب وزير، ثم دعاه الحاكم الفاطمي إلى مصر لما بلغه أنه يستطيع أن يضبط فيضان النيل، فذهب إلى نواحي أسوان وقاس ثم عرف أن مشروعه لا يتم، وعاش في مصر أكثر حياته {cite:tdv-ibnul-heysem pp. 82–87}. وينقل ابن أبي أصيبعة أنه أقام بالقاهرة في الجامع الأزهر، يكتب كل سنة كتاب أقليدس والمجسطي ويبيعهما ويعيش من ثمنهما {cite:manazir-sabra-1983 p. 25}. وكتب «المناظر» في القرن الخامس الهجري دراسةً لخصائص الضوء قائمة على التجربة، أو ما سمّاه «الاعتبار»، وعلى المناهج الرياضية {cite:manazir-sabra-1983 p. 9}."
    en: "Ibn al-Haytham was born at Basra around 354 AH and served there in a government office with the title of vizier under the Buyids. The Fatimid al-Hakim invited him to Egypt on hearing that he could control the Nile's floods; he went to the region of Aswan, took measurements, realised the project could not be done, and spent most of his life in Egypt {cite:tdv-ibnul-heysem pp. 82–87}. Ibn Abi Usaybi'a reports that he lived in Cairo at the mosque of al-Azhar, copying Euclid and the Almagest each year and living on what they sold for {cite:manazir-sabra-1983 p. 25}. In the fifth century AH he wrote the Manazir as a study of the properties of light built on experiment, which he called i'tibar, and on mathematical methods {cite:manazir-sabra-1983 p. 9}."
    ur: "ابن الہیثم تقریباً 354ھ میں بصرہ میں پیدا ہوئے اور بویہیوں کے زمانے میں وہاں وزیر کے لقب کے ساتھ ایک سرکاری دفتر میں کام کیا۔ فاطمی حاکم نے یہ سن کر کہ وہ دریائے نیل کے سیلاب کو قابو میں لا سکتے ہیں، انہیں مصر بلایا؛ وہ اسوان کے علاقے میں گئے، پیمائشیں کیں، سمجھ گئے کہ منصوبہ پورا نہیں ہو سکتا، اور اپنی زندگی کا بیشتر حصہ مصر میں گزارا {cite:tdv-ibnul-heysem pp. 82–87}۔ ابن ابی اصیبعہ نقل کرتے ہیں کہ وہ قاہرہ میں جامع ازہر میں رہے، ہر سال اقلیدس اور المجسطی کی نقل تیار کر کے بیچتے اور اسی کی قیمت پر گزارا کرتے {cite:manazir-sabra-1983 p. 25}۔ پانچویں صدی ہجری میں انہوں نے «المناظر» لکھی، جو روشنی کی خصوصیات کا ایسا مطالعہ ہے جس کی بنیاد تجربے پر ہے، جسے وہ «اعتبار» کہتے تھے، اور ریاضیاتی طریقوں پر {cite:manazir-sabra-1983 p. 9}۔"
makers:
  - person: person/ibn-al-haytham
    role: improver
    place: place/cairo
    note: "Author of the Kitab al-Manazir. In Book 1, chapter 3, he lets the light of the sun, the moon, the stars and fire into a dark room through a hole and tests its straight path with an opaque body and a ruler {cite:manazir-sabra-1983 pp. 73–75}; in Book 1, chapter 6, he sets several candles before one hole into a dark place to show that their lights do not mix {cite:manazir-sabra-1983 pp. 171–172}. TDV: he devised the dark-room experiment, the basis of today's photographic camera, to prove that light travels in straight lines {cite:tdv-ibnul-heysem pp. 82–87}."
    sources: [source/manazir-sabra-1983, source/tdv-ibnul-heysem]
attribution:
  status: improvement
  claim:
    ar: "جعل ابن الهيثم البيت المظلم ذا الثقب الصغير أداةَ اختبار منظَّمة: يُدخل منه ضوء الشمس والقمر والكواكب والسرج، ويقطع مسار الضوء بجسم كثيف ويقيسه بمسطرة، ويستر سراجاً بعد سراج، ليبرهن بالتجربة على أن الضوء يمتد على الاستقامة وأن الأضواء لا تختلط في الهواء."
    en: "Ibn al-Haytham turned the dark room with a small hole into an orderly testing device: he let in the light of the sun, the moon, the stars and candles, cut the light's path with an opaque body, measured it with a ruler, and covered one candle after another, proving by experiment that light travels in straight lines and that lights do not mix in the air."
    ur: "ابن الہیثم نے چھوٹے سوراخ والے تاریک کمرے کو جانچ کا ایک منظم آلہ بنا دیا: انہوں نے اس میں سورج، چاند، ستاروں اور چراغوں کی روشنی داخل کی، روشنی کے راستے کو ایک ٹھوس جسم سے کاٹا، اسے پیمانے سے ناپا، اور ایک ایک کر کے چراغوں کو ڈھانپا، اور تجربے سے ثابت کیا کہ روشنی سیدھی لکیر میں چلتی ہے اور روشنیاں ہوا میں آپس میں نہیں ملتیں۔"
  basis:
    ar: "لا يدّعي ابن الهيثم أنه أول من رأى الضوء يدخل من ثقب إلى بيت مظلم: فهو يقول إن ذلك يظهر للحس ظهوراً بيّناً إذا تُفقِّدت الأضواء التي تدخل من الثقوب والخروق والأبواب إلى البيوت {cite:manazir-sabra-1983 p. 73}، أي إنه يبدأ من مشاهدة مألوفة. والجديد عنده أنه جعل هذه المشاهدة اختباراً مرتباً: يتتبع الضوء في هواء فيه غبار أو دخان فيراه ممتداً على الاستقامة، ويضع جسماً كثيفاً في طريقه فيظهر الضوء عليه ويبطل مما وراءه، ويقيس امتداده بمسطرة فيجده في غاية الاستقامة {cite:manazir-sabra-1983 pp. 73–74}، ويعيد ذلك بضوء الكواكب في ليل غير مقمر وبضوء النار {cite:manazir-sabra-1983 p. 75}، ثم يضع عدة سرج أمام ثقب واحد ويستر واحداً بعد واحد {cite:manazir-sabra-1983 pp. 171–172}. ويصف محقق الكتاب منهجه بأنه دراسة قائمة على الاختبار التجريبي واستخدام الرياضيات، لا محاولة فلسفية في طبيعة الضوء {cite:manazir-sabra-1983 p. 9}، وتقول موسوعة TDV إنه هو الذي رتّب تجربة الحجرة المظلمة ليبرهن على أن الضوء يمتد على الاستقامة {cite:tdv-ibnul-heysem pp. 82–87}. ولذلك يُسجَّل هنا تحسيناً لا اختراعاً من العدم."
    en: "Ibn al-Haytham does not claim to have been the first to see light enter a dark room through a hole. He says the thing shows itself plainly to anyone who examines the light that comes into houses through holes, cracks and doors {cite:manazir-sabra-1983 p. 73}, so he begins from a familiar sight. What is new is that he made the sight into an ordered test. He follows the light through air thick with dust or smoke and sees it run straight; he sets an opaque body in its path and finds the light falls on the body and vanishes from the place beyond; he measures its course with a ruler and finds it perfectly straight {cite:manazir-sabra-1983 pp. 73–74}; he repeats this with starlight on a moonless night and with firelight {cite:manazir-sabra-1983 p. 75}; and he sets several candles before one hole and covers them one by one {cite:manazir-sabra-1983 pp. 171–172}. The editor describes his approach as a study built on experiment and mathematics rather than a philosophical essay on the nature of light {cite:manazir-sabra-1983 p. 9}, and TDV says it was he who devised the dark-room experiment to prove that light travels in straight lines {cite:tdv-ibnul-heysem pp. 82–87}. It is therefore recorded here as an improvement, not an invention from nothing."
    ur: "ابن الہیثم یہ دعویٰ نہیں کرتے کہ انہوں نے سب سے پہلے روشنی کو سوراخ سے تاریک کمرے میں آتے دیکھا۔ وہ کہتے ہیں کہ یہ بات ہر اس شخص پر صاف ظاہر ہو جاتی ہے جو گھروں میں سوراخوں، دراڑوں اور دروازوں سے آنے والی روشنی کو غور سے دیکھے {cite:manazir-sabra-1983 p. 73}، یعنی وہ ایک جانے پہچانے منظر سے شروع کرتے ہیں۔ نیا یہ ہے کہ انہوں نے اس منظر کو ایک منظم جانچ بنا دیا۔ وہ گرد یا دھوئیں والی ہوا میں روشنی کا پیچھا کرتے ہیں اور اسے سیدھا چلتا دیکھتے ہیں؛ اس کے راستے میں ایک ٹھوس جسم رکھتے ہیں تو روشنی اس جسم پر پڑتی ہے اور اس کے پیچھے کی جگہ سے غائب ہو جاتی ہے؛ اس کے راستے کو پیمانے سے ناپتے ہیں تو اسے بالکل سیدھا پاتے ہیں {cite:manazir-sabra-1983 pp. 73–74}؛ یہی کام بغیر چاند کی رات میں ستارے کی روشنی اور آگ کی روشنی سے دہراتے ہیں {cite:manazir-sabra-1983 p. 75}؛ اور ایک سوراخ کے سامنے کئی چراغ رکھ کر انہیں ایک ایک کر کے ڈھانپتے ہیں {cite:manazir-sabra-1983 pp. 171–172}۔ کتاب کے محقق ان کے طریقے کو تجربے اور ریاضی پر مبنی مطالعہ کہتے ہیں، روشنی کی فطرت پر کوئی فلسفیانہ مضمون نہیں {cite:manazir-sabra-1983 p. 9}، اور ٹی ڈی وی کہتا ہے کہ تاریک کمرے کا تجربہ انہوں نے ہی ترتیب دیا تاکہ ثابت کریں کہ روشنی سیدھی لکیر میں چلتی ہے {cite:tdv-ibnul-heysem pp. 82–87}۔ اس لیے اسے یہاں ایک بہتری کے طور پر درج کیا گیا ہے، عدم سے ایجاد کے طور پر نہیں۔"
