summary:
  ar: "طريقة في الاختبار وصفها ابن الهيثم في «كتاب المناظر»: يدخل ضوء الشمس أو القمر أو كوكب أو سراج من ثقب صغير إلى بيت مظلم، فيظهر على الجدار المقابل ممتداً على خط مستقيم يمكن قطعه بجسم كثيف أو قياسه بمسطرة. وبها برهن على أن الضوء يمتد على الاستقامة، وعلى أن أضواء عدة سرج تجتمع في ثقب واحد ثم تفترق على الجدار كلٌّ مقابلَ سراجه دون أن تختلط. وتعدّ موسوعة TDV هذه التجربة أساس آلة التصوير اليوم."
  en: "A method of testing set out by Ibn al-Haytham in the Kitab al-Manazir: light from the sun, the moon, a star or a candle enters a dark room through a small hole and appears on the opposite wall along a straight line that can be cut with an opaque body or measured with a ruler. With it he proved that light travels in straight lines, and that the lights of several candles meet in one hole and then part again on the wall, each opposite its own candle, without mixing. TDV calls this experiment the basis of today's photographic camera."
  ur: "جانچ کا ایک طریقہ جو ابن الہیثم نے «کتاب المناظر» میں بیان کیا: سورج، چاند، کسی ستارے یا چراغ کی روشنی ایک چھوٹے سوراخ سے تاریک کمرے میں داخل ہوتی ہے اور سامنے کی دیوار پر ایک سیدھی لکیر کے ساتھ ظاہر ہوتی ہے جسے کسی ٹھوس جسم سے کاٹا یا پیمانے سے ناپا جا سکتا ہے۔ اس سے انہوں نے ثابت کیا کہ روشنی سیدھی لکیر میں چلتی ہے، اور یہ کہ کئی چراغوں کی روشنیاں ایک سوراخ میں ملتی ہیں اور پھر دیوار پر الگ ہو جاتی ہیں، ہر ایک اپنے چراغ کے سامنے، بغیر آپس میں ملے۔ ٹی ڈی وی اس تجربے کو آج کے فوٹوگرافی کیمرے کی بنیاد کہتا ہے۔"
