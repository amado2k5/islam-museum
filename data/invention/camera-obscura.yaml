kids:
  ar: "قبل نحو ألف سنة عاش في القاهرة عالم مسلم اسمه ابن الهيثم. أغلق باب غرفة في الليل ولم يترك إلا ثقباً صغيراً، ووضع أمامه عدة سرج. فرأى على الجدار المقابل نقطة ضوء لكل سراج! وإذا غطّى سراجاً اختفت نقطته، وإذا كشفه عادت. هكذا عرف أن الضوء يمشي في خط مستقيم، وهذه الفكرة نفسها هي ما تعمل به آلة التصوير اليوم."
  en: "About a thousand years ago a Muslim scholar named Ibn al-Haytham lived in Cairo. One night he closed the door of a room, leaving only a small hole, and set several candles outside it. On the opposite wall he saw one spot of light for each candle! When he covered a candle its spot vanished, and when he uncovered it the spot came back. That is how he showed that light travels in a straight line, and the same idea is how a camera works today."
  ur: "تقریباً ایک ہزار سال پہلے قاہرہ میں ابن الہیثم نام کے ایک مسلمان عالم رہتے تھے۔ ایک رات انہوں نے ایک کمرے کا دروازہ بند کیا اور صرف ایک چھوٹا سا سوراخ چھوڑا، اور باہر کئی چراغ رکھ دیے۔ سامنے کی دیوار پر انہیں ہر چراغ کے لیے روشنی کا ایک نقطہ نظر آیا! جب وہ کسی چراغ کو ڈھانپتے تو اس کا نقطہ غائب ہو جاتا، اور جب کھولتے تو واپس آ جاتا۔ اس طرح انہوں نے دکھایا کہ روشنی سیدھی لکیر میں چلتی ہے، اور یہی خیال آج کیمرے کے کام کرنے کا طریقہ ہے۔"
