today:
  form:
    ar: "تقول موسوعة TDV إن تجربة الحجرة المظلمة عند ابن الهيثم هي أساس آلة التصوير اليوم {cite:tdv-ibnul-heysem pp. 82–87}: فكل آلة تصوير صندوق مظلم يدخله الضوء من فتحة صغيرة. ونص «المناظر» العربي منشور محققاً، والمقالات الثلاث الأولى منه في طبعة الكويت سنة 1983 {cite:manazir-sabra-1983 p. 9}."
    en: "TDV says Ibn al-Haytham's dark-room experiment is the basis of today's photographic camera {cite:tdv-ibnul-heysem pp. 82–87}: every camera is a dark box that light enters through a small opening. The Arabic text of the Manazir is in print in a critical edition, its first three books in the Kuwait edition of 1983 {cite:manazir-sabra-1983 p. 9}."
    ur: "ٹی ڈی وی کہتا ہے کہ ابن الہیثم کا تاریک کمرے کا تجربہ آج کے فوٹوگرافی کیمرے کی بنیاد ہے {cite:tdv-ibnul-heysem pp. 82–87}: ہر کیمرا ایک تاریک ڈبا ہے جس میں روشنی ایک چھوٹے سوراخ سے داخل ہوتی ہے۔ «المناظر» کا عربی متن تحقیق شدہ ایڈیشن میں چھپا ہوا ہے، اس کی پہلی تین مقالے کویت کے 1983ء کے ایڈیشن میں {cite:manazir-sabra-1983 p. 9}۔"
  descendants:
    ar: "الكاميرا ذات الثقب، وآلة التصوير التي يدخلها الضوء من فتحة إلى صندوق مظلم، تقوم على ما برهن عليه ابن الهيثم من أن الضوء يمتد على الاستقامة وأن أضواء الأشياء المختلفة تعبر الثقب الواحد دون أن تختلط {cite:manazir-sabra-1983 pp. 171–172} {cite:tdv-ibnul-heysem pp. 82–87}."
    en: "The pinhole camera, and every camera in which light passes through an opening into a dark box, rest on what Ibn al-Haytham proved: that light travels in straight lines and that the lights of different things cross one hole without mixing {cite:manazir-sabra-1983 pp. 171–172} {cite:tdv-ibnul-heysem pp. 82–87}."
    ur: "سوراخ والا کیمرا، اور ہر وہ کیمرا جس میں روشنی ایک سوراخ سے تاریک ڈبے میں جاتی ہے، اسی پر قائم ہے جو ابن الہیثم نے ثابت کیا: کہ روشنی سیدھی لکیر میں چلتی ہے اور مختلف چیزوں کی روشنیاں ایک ہی سوراخ سے بغیر ملے گزر جاتی ہیں {cite:manazir-sabra-1983 pp. 171–172} {cite:tdv-ibnul-heysem pp. 82–87}۔"
