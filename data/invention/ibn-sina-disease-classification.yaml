summary:
  ar: "تعليم يبدأ بتعريف السبب والمرض والعرض والدلالة، ثم أحوال البدن الثلاث، ثم أقسام المرض: المفردة في ثلاثة أجناس والمرتكبة في أربعة وأمراض تفرّق الاتصال، والمركبة كالأورام {cite:canon-ibn-sina-print-v1 pp.103–107}."
  en: "A teaching that begins by defining cause, disease, symptom and indication, then the three states of the body, then the divisions of disease: the simple in three genera, the structural in four genera plus diseases of solution of continuity, and the composite such as tumours {cite:canon-ibn-sina-print-v1 pp.103–107}."
  ur: "ایک تعلیم جو پہلے علت، مرض، عرض اور دلالت کی تعریف کرتی ہے، پھر جسم کی تین حالتیں، پھر امراض کی تقسیم: مفردہ تین اجناس میں، ساختی چار اجناس اور تفرّق الاتصال کے امراض، اور مرکبة جیسے ورم {cite:canon-ibn-sina-print-v1 pp.103–107}۔"
  es: "Una enseñanza que comienza definiendo causa, enfermedad, síntoma e indicación, luego los tres estados del cuerpo, luego las divisiones de la enfermedad: la simple en tres géneros, la estructural en cuatro géneros más enfermedades de solución de continuidad y la compuesta como los tumores {cite:canon-ibn-sina-print-v1 pp.103–107}."
  fr: "Un enseignement qui commence par définir la cause, la maladie, le symptôme et l'indication, puis les trois états du corps, puis les divisions de la maladie: les simples en trois genres, les structurelles en quatre genres plus les maladies de solution de continuité, et les composites telles que les tumeurs {cite:canon-ibn-sina-print-v1 pp.103–107}."
  tr: "Öğretim, neden, hastalık, semptom ve belirtiyi tanımlamakla başlar, ardından vücudun üç halini ve daha sonra hastalıkların bölümlerini ele alır: üç tipte tekli hastalıklar, dört tipte bileşik hastalıklar, bağlantıyı bozan hastalıklar ve tümörler gibi bileşik hastalıklar {cite:canon-ibn-sina-print-v1 pp.103–107}."
  id: "Pengajaran dimulai dengan mendefinisikan penyebab, penyakit, gejala, dan indikasi, kemudian tiga keadaan tubuh, lalu pembagian penyakit: penyakit tunggal dalam tiga jenis, penyakit kompleks dalam empat jenis, penyakit yang mengganggu hubungan, dan penyakit kompleks seperti tumor {cite:canon-ibn-sina-print-v1 pp.103–107}."
