kids: { ar: "قبل أن يصف ابن سينا أي مرض يطلب من القارئ أن يعرف: ما المرض؟ ما علته؟ ما عرَضه؟ وما علامته؟ هذه تعريفاتٌ أولى تجعل كل ما بعده مفهوماً؛ وهي تاريخية ولا تُستعمل اليوم.", en: "Before Ibn Sina describes any disease he asks the reader to know: what is a disease? Its cause? Its symptom? Its sign? These first definitions make everything after them intelligible; they are historical and are not used today.", ur: "ابن سینا کسی مرض کی وضاحت سے پہلے قاری سے پوچھتے ہیں: مرض کیا ہے؟ اس کی علت کیا ہے؟ اس کا عرض کیا ہے؟ اور علامت کیا ہے؟ یہ ابتدائی تعریفیں اس کے بعد کی ہر چیز کو سمجھنے کے قابل بناتی ہیں؛ یہ تاریخی ہیں اور آج استعمال نہیں ہوتی۔" }
