kids:
  ar: "في السماء تقترب الكواكب أحياناً من بعضها في مشاهد مهمة. جمع البتاني في باب من زيجه طريقة لحساب مقدار هذا الاقتراب، وكتب رسالة مستقلة للوزير يتحقق فيها من تلك الأقدار؛ الرسالة ضاعت وبقي الباب في الزيج."
  en: "Planets sometimes appear close together in the sky. Al-Battani gathered in one chapter of his Zij a way to compute the size of such closeness, and wrote a separate epistle to the vizier to verify those quantities; the epistle is lost and the chapter survives in the Zij."
  ur: "آسمان پر سیارے کبھی کبھی ایک دوسرے کے قریب نظر آتے ہیں۔ بطانی نے اپنی زیج کے ایک باب میں اس قرب کی مقدار نکالنے کا طریقہ جمع کیا اور وزیر کے لیے ایک الگ رسالہ لکھی جس میں ان مقداروں کی تصدیق تھی؛ رسالہ کھو گئی اور باب زیج میں بچا۔"
