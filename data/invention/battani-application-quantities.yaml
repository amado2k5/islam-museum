summary:
  ar: "باب في حساب كميات الاتصالات الفلكية ضمن زيج البتاني، وعنه رسالة مستقلة بعنوانه عملها للوزير أبي الحسن علي بن محمد بن الفرات ومفقودة اليوم؛ قارن نالينو بحث البتاني بمبحث بطليموس في التطبيقات {cite:nallino-albatenii-opus-astronomicum p. 28} {cite:nallino-albatenii-opus-astronomicum ch. LIV}."
  en: "A chapter on computing planetary application quantities in al-Battani's Zij, paired with a dedicated epistle of the same title written for the vizier Abu al-Hasan Ali ibn Muhammad ibn al-Furat and now lost; Nallino compares Battani's treatment with Ptolemy's chapter on applications {cite:nallino-albatenii-opus-astronomicum p. 28} {cite:nallino-albatenii-opus-astronomicum ch. LIV}."
  ur: "بطانی کی زیج میں سیاروں کے اتصال کی مقداروں کے حساب کا ایک باب، جس کے ساتھ اسی عنوان کا ایک الگ رسالہ بھی تھا جو وزیر ابو الحسن علی بن محمد بن الفرات کے لیے لکھا گیا اور آج کھو چکا ہے؛ نالینو نے بطانی کے مباحث کا بطلیموس کے ابواب سے موازنہ کیا {cite:nallino-albatenii-opus-astronomicum p. 28} {cite:nallino-albatenii-opus-astronomicum ch. LIV}۔"
  es: "Un capítulo sobre el cálculo de cantidades de aplicaciones planetarias en el Zij de al-Battani, junto con una epístola dedicada del mismo título escrita para el visir Abu al-Hasan Ali ibn Muhammad ibn al-Furat y ahora perdida; Nallino compara el tratamiento de Battani con el capítulo de Ptolomeo sobre aplicaciones {cite:nallino-albatenii-opus-astronomicum p. 28} {cite:nallino-albatenii-opus-astronomicum ch. LIV}."
  fr: "Un chapitre sur le calcul des quantités d'application planétaire dans le Zij d'al-Battani, associé à une épître dédiée du même titre écrite pour le vizir Abu al-Hasan Ali ibn Muhammad ibn al-Furat et aujourd'hui perdue; Nallino compare le traitement de Battani avec le chapitre de Ptolémée sur les applications {cite:nallino-albatenii-opus-astronomicum p. 28} {cite:nallino-albatenii-opus-astronomicum ch. LIV}."
