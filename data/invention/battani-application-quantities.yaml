attribution:
  status: improvement
  claim:
    ar: "تنظيم موثق لحساب كميات الاتصالات الفلكية في الزيج مع رسالة تحقيق مستقلة؛ لا أسبقية لمفهوم الاتصال نفسه."
    en: "Documented organization of planetary-application computation in the Zij plus a dedicated verification epistle; no priority claimed for the concept of application itself."
    ur: "زیج میں سیاروی اتصال کی مقداروں کے حساب کی مستند ترتیب اور ایک الگ تصدیقی رسالہ؛ اتصال کے تصور پر کوئی سبقت نہیں۔"
  basis:
    ar: "يقابل نالينو بحث البتاني في كميات التطبيقات بمبحث بطليموس الموازي، وذكر أن عنوان الرسالة المفقودة هو عنوان الباب الرابع والخمسين من الزيج في مطارح الشعاعات {cite:nallino-albatenii-opus-astronomicum ch. LIV; p. 28}."
    en: "Nallino compares al-Battani's treatment of application quantities with Ptolemy's parallel chapter and notes that the lost epistle's title is that of chapter LIV of the Zij on the projection of rays {cite:nallino-albatenii-opus-astronomicum ch. LIV; p. 28}."
    ur: "نالینو بطانی کے اتصال کی مقداروں کے مباحث کا بطلیموس کے متوازی باب سے موازنہ کرتا ہے اور لکھتا ہے کہ گمشدہ رسالے کا عنوان زیج کے باب LIV کا عنوان ہے {cite:nallino-albatenii-opus-astronomicum ch. LIV; p. 28}۔"
