today:
  form:
    ar: "تعمل مطيافية الفيمتو اليوم في مختبرات حول العالم على الغازات والسوائل والمواد الصلبة والأسطح والبوليمرات والأنظمة الحيوية؛ إنها طريقة بحث لا جهاز واحد يُقتنى {cite:nobelprize-chemistry-1999-press-release}."
    en: "Femtosecond spectroscopy works today in laboratories worldwide on gases, fluids, solids, surfaces, polymers and biological systems; it is a research method, not a single device one buys {cite:nobelprize-chemistry-1999-press-release}."
    ur: "فیمٹو سیکنڈ سپیکٹرواسکوپی آج دنیا بھر کے لیبارٹریوں میں گیسوں، مائعوں، ٹھوس، سطحوں، بالموں اور حیاتیاتی نظاموں پر چلتی ہے؛ یہ ایک طریقۂ تحقیق ہے، کوئی ایک آلہ نہیں {cite:nobelprize-chemistry-1999-press-release}۔"
  descendants:
    ar: "انبثقت عنها مجالات لاحقة منها كيمياء الفيمتو نفسها في الأحياء ‏⁦(الفيمتوبيولوجيا)⁩‏ ومجهر الإلكترون رباعي الأبعاد الذي بناه زويل بعد الجائزة؛ ولا يوجد جهاز واحد يُشترى اليوم بل تقنية قياس متاحة في مختبرات متقدمة {cite:nobelprize-chemistry-1999-press-release} {cite:caltech-oral-history-zewail abstract}."
    en: "It spawned later fields including femtobiology and Zewail's own post-Nobel 4D electron microscopy; there is no single device to buy today but a measurement technique available in advanced laboratories {cite:nobelprize-chemistry-1999-press-release} {cite:caltech-oral-history-zewail abstract}."
    ur: "اس سے بعد کے شعبے نکلے جن میں فیمٹو حیاتیات اور خود زویل کا نوبل کے بعد کا 4D الیکٹران مائیکروسکوپی شامل ہے؛ آج کوئی ایک آلہ نہیں بلکہ جدید لیبارٹریوں میں دستیاب پیمائشی طریقہ ہے {cite:nobelprize-chemistry-1999-press-release} {cite:caltech-oral-history-zewail abstract}۔"
