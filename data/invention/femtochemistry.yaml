impact:
  fields: [modern-science]
  changed:
    ar: "حوّل التفاعل الكيميائي من ظاهرة توصف بعبارات مجازية مثل «التفعيل» و«الحالة الانتقالية» إلى حركة تُرى فيها ذرات الجزيء وهي تكسر الروابط وتكوّنها، على مقياس زمني لم تبلغه أي كاميرا قبله {cite:nobelprize-chemistry-1999-press-release}."
    en: "Turned the chemical reaction from a phenomenon described in vague metaphors like 'activation' and 'transition state' into motion in which a molecule's individual atoms are seen breaking and forming bonds, on a timescale no camera had reached before {cite:nobelprize-chemistry-1999-press-release}."
    ur: "کیمیائی تعامل کو «فعال سازی» اور «منتقلی حالت» جیسے مبہم استعاروں سے نکال کر ایسی حرکت میں بدل دیا جس میں سالمے کے انفرادی ایٹم جوڑ توڑ ہوتے دکھائی دیتے ہیں، ایسے وقت کی پیمائش پر جو پہلے کسی کیمرے نے نہیں پایا {cite:nobelprize-chemistry-1999-press-release}۔"
  history:
    ar: "أسس مجالاً كاملاً من فيزياء الكيمياء: كيمياء الفيمتو، التي سُمّيت على اسمه ومنحت مبدعها جائزة نوبل الوحيدة في فرعه؛ ووسّعت فهم آليات التفاعل إلى المحفزات والبوليمرات والأنظمة الحيوية مثل الشبكية والكلوروفيل {cite:nobelprize-chemistry-1999-press-release} {cite:nobelprize-zewail-facts}."
    en: "Founded an entire branch of physical chemistry - femtochemistry - that carries its maker's name and won him the sole Nobel Prize in his field; it widened the understanding of reaction mechanisms to catalysts, polymers and biological systems such as retinal and chlorophyll {cite:nobelprize-chemistry-1999-press-release} {cite:nobelprize-zewail-facts}."
    ur: "فزیکل کیمسٹری کی پوری شاخ — فیمٹو کیمسٹری — کی بنیاد رکھی جس کا نام اس کے بانی سے جُڑا اور جس پر انہیں اپنے شعبے کا تنہا نوبل انعام ملا؛ اس نے ردعمل کے میکانزم کی سمجھ کو عامل (catalyst)، بالم (polymers) اور حیاتیاتی نظاموں جیسے شبکیہ اور کلوروفل تک پھیلایا {cite:nobelprize-chemistry-1999-press-release} {cite:nobelprize-zewail-facts}۔"
  significance: 5
  why: "A named field of physical chemistry founded by one scientist's method, recognized by the sole 1999 Nobel Prize in Chemistry and still 'performed intensively the world over' per the prize's own release; the rating reflects the documented founding role, not a claim that every component predated him."
