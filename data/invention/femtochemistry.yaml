summary:
  ar: "طريقة قياس أسسها أحمد زويل في معهد كاليفورنيا للتقنية في أواخر ثمانينيات القرن العشرين: ضرب الجزيء بنبضات ليزرية فائقة القِصر مدة الفيمتوثانية ⁦(10⁻¹⁵ ثانية)⁩ ثم جسّه بنبضة ثانية، فرأى لأول مرة الذرات وهي تكسر الروابط وتكوّنها في الحالة الانتقالية للتفاعل؛ سمّى معهد نوبل المجال «كيمياء الفيمتو» ونال زويل عنه جائزة نوبل في الكيمياء سنة 1999 منفرداً {cite:nobelprize-chemistry-1999-press-release} {cite:nobelprize-zewail-facts} {cite:caltech-oral-history-zewail abstract}."
  en: "A measurement method founded by Ahmed Zewail at Caltech in the late 1980s: striking a molecule with femtosecond laser pulses ⁦(10⁻¹⁵ s)⁩ and probing it with a second pulse, he observed for the first time atoms breaking and forming bonds in a reaction's transition state; the Nobel body named the field femtochemistry and awarded him the 1999 Chemistry Prize alone {cite:nobelprize-chemistry-1999-press-release} {cite:nobelprize-zewail-facts} {cite:caltech-oral-history-zewail abstract}."
  ur: "احمد زویل نے کیلیفورنیا انسٹیٹیوٹ آف ٹیکنالوجی میں 1980 کی دہائی کے آخر میں ایک ناپ کا طریقہ قائم کیا: فیمٹو سیکنڈ لیف پلسوں ⁦(10⁻¹⁵ سیکنڈ)⁩ سے سالمہ کو مارنا اور دوسری پلس سے جانچنا، جس سے انہوں نے پہلی بار منتقل حالت میں جوڑ توڑ ہوتے دیکھے؛ نوبل ادارے نے اس شعبے کو «فیمٹو کیمسٹری» کہا اور 1999 میں تنہا کیمسٹری کا انعام دیا {cite:nobelprize-chemistry-1999-press-release} {cite:nobelprize-zewail-facts} {cite:caltech-oral-history-zewail abstract}۔"
  es: "Un método de medición fundado por Ahmed Zewail en Caltech a finales de la década de 1980: al golpear una molécula con pulsos láser de femtosegundos (10⁻¹⁵ s) y sondearla con un segundo pulso, observó por primera vez átomos rompiendo y formando enlaces en el estado de transición de una reacción; el cuerpo del Premio Nobel denominó al campo femtoquímica y le otorgó el Premio Nobel de Química de 1999 en solitario {cite:nobelprize-chemistry-1999-press-release} {cite:nobelprize-zewail-facts} {cite:caltech-oral-history-zewail abstract}."
  fr: "Une méthode de mesure mise au point par Ahmed Zewail au Caltech à la fin des années 1980: en frappant une molécule avec des impulsions laser femtoseconde (10⁻¹⁵ s) et en la sondant avec une seconde impulsion, il a observé pour la première fois des atomes se brisant et formant des liaisons dans l’état de transition d’une réaction; le corps Nobel a nommé ce domaine femtochimie et lui a décerné le prix Nobel de chimie 1999 à lui seul {cite:nobelprize-chemistry-1999-press-release} {cite:nobelprize-zewail-facts} {cite:caltech-oral-history-zewail abstract}."
  tr: "Ölçüm yöntemi, 1980'lerin sonlarında Kaliforniya Teknoloji Enstitüsü'nde Ahmed Zewail tarafından geliştirildi: molekülü femtosaniye süreli (10⁻¹⁵ saniye) ultra kısa lazer darbeleriyle bombardıman edip ardından ikinci bir darbeyle temas ettirmek. Reaksiyonun geçiş durumunda atomların kırılıp bağ oluşturduğunu ilk kez gördü. Nobel Enstitüsü bu alana \"femtokimya\" adını verdi ve Zewail, bu çalışmasıyla 1999 yılında Kimya Nobel Ödülü'nü kazandı. {cite:nobelprize-chemistry-1999-press-release} {cite:nobelprize-zewail-facts} {cite:caltech-oral-history-zewail abstract}."
  id: "Metode pengukuran ini dikembangkan oleh Ahmed Zewail di California Institute of Technology pada akhir tahun 1980-an: membombardir molekul dengan pulsa laser ultra-pendek berdurasi femtosekon (10⁻¹⁵ detik) dan kemudian menyentuhnya dengan pulsa kedua. Ia pertama kali melihat atom-atom yang putus dan membentuk ikatan dalam keadaan transisi reaksi. Institut Nobel menamai bidang ini \"femtokimia\" dan Zewail memenangkan Hadiah Nobel Kimia pada tahun 1999 hanya untuk penemuan ini. {cite:nobelprize-chemistry-1999-press-release} {cite:nobelprize-zewail-facts} {cite:caltech-oral-history-zewail abstract}."
