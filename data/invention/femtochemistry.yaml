kids:
  ar: "تخيل كاميرا سريعة جدا لا يساوي وميضها إلا جزءا من الثانية فيه واحد متبوع بخمسة عشر صفرا بعد العلامة العشرية! وضع أحمد زويل، عالم مصري مسلم، وميضين بهذه السرعة: الأول يوقظ الجزيء فيبدأ التفاعل، والثاني يصوره لحظة بلحظة. هكذا رُئي الذرات وهي تتفكك وتتركب لأول مرة في التاريخ، وفاز بجائزة نوبل."
  en: "Imagine a camera so fast its flash lasts one second divided by a million billion! Ahmed Zewail, an Egyptian Muslim scientist, shone two laser flashes that fast: the first wakes the molecule so the reaction starts, the second photographs it moment by moment. That is how atoms were seen breaking apart and joining up for the first time in history - and he won a Nobel Prize."
  ur: "سوچو ایک کیمرہ اتنا تیز کہ اس کی چمک ایک سیکنڈ کے لاکھوں گناویں حصے کے برابر ہو! احمد زویل، ایک مصری مسلمان سائنسدان، نے اتنی ہی تیزی کے دو لیزر چمک چلائے: پہلی سالمہ کو جگاتی ہے اور دوسری لمحہ بہ لمحہ تصویر لیتی ہے۔ اسی طرح پہلی بار تاریخ میں ایٹم ٹوٹتے اور جُڑتے دیکھے گئے — اور انہیں نوبل انعام ملا۔"
