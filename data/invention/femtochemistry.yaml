makers:
  - person: person/ahmed-zewail
    role: inventor
    note: "Egyptian-born American chemist who founded femtochemistry: his pump-probe femtosecond method made reaction transition states directly observable; Muslim identity self-attested in two independent sources (Fountain interview, Caltech oral history), recorded under the museum's Sunni default frame."
    sources: [source/nobelprize-chemistry-1999-press-release, source/nobelprize-zewail-facts, source/caltech-oral-history-zewail, source/fountainmagazine-zewail-interview-2009]
attribution:
  status: original
  claim:
    ar: "ينسب إلى زويل تأسيس كيمياء الفيمتو: طريقة النبض المضخة والكاشفة التي جعلت الحالة الانتقالية للتفاعل مرئية لأول مرة؛ تقنية الليزر الفيمتوثاني والمطيافية سابقتاه، والإبداع الموثق هو الطريقة المتكاملة وتطبيقاتها الأولى."
    en: "Zewail is credited with founding femtochemistry: the pump-probe femtosecond method that made a reaction's transition state directly visible for the first time; femtosecond laser hardware and spectroscopy predate him, and the documented creation is the integrated method and its first applications."
    ur: "زویل کو فیمٹو کیمسٹری کی بنیاد سازی سے منسوب کیا جاتا ہے: پمپ-پروب فیمٹو سیکنڈ طریقہ جس نے پہلی بار منتقل حالت کو براہ راست دکھایا؛ فیمٹو سیکنڈ لیف پلس اور سپیکٹرواسکوپی اس سے پہلے موجود تھے، اور نیا کام مربوط طریقہ اور اس کے پہلے اطلاق ہیں۔"
  basis:
    ar: "يصف بيان نوبل تجاربه في أواخر الثمانينيات بأنها «أدت إلى ولادة مجال بحث يسمى كيمياء الفيمتو»، ويذكر أولى تجاربه على تفكك ICN في 200 فيمتوثانية، وسيرة كاليفورنيا تسمي 1987 سنة أول الملاحظة المباشرة لتكوين الروابط وكسرها {cite:nobelprize-chemistry-1999-press-release} {cite:caltech-oral-history-zewail abstract}."
    en: "The Nobel press release says his late-1980s experiments 'were to lead to the birth of the research area called femtochemistry' and details the first ICN dissociation observed in 200 fs; Caltech's oral history names 1987 as the year of the first direct observations of bond making and breaking {cite:nobelprize-chemistry-1999-press-release} {cite:caltech-oral-history-zewail abstract}."
    ur: "نوبل پریس ریلیز کہتی ہے کہ ان کے 1980 کی دہائی کے آخر کے تجربات «کیمیاء فیمٹو کہلانے والے شعبے کی پیدائش کا باعث بنے» اور ICN کے 200 fs میں ٹوٹنے کی تفصیل دیتی ہے؛ کیلیفورنیا کی زبانی تاریخ 1987 کو پہلی براہ راست مشاہدہ قرار دیتی ہے {cite:nobelprize-chemistry-1999-press-release} {cite:caltech-oral-history-zewail abstract}۔"
