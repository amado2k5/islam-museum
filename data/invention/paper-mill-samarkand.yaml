label:
  ar: "ورق سمرقند ونقل صناعة الورق إلى العالم الإسلامي"
  en: "Samarkand paper and the transmission of papermaking to the Islamic world"
  ur: "سمرقند کا کاغذ اور کاغذ سازی کی اسلامی دنیا میں منتقلی"
  es: "El papel de Samarcanda y la transmisión de la fabricación de papel al mundo islámico."
  fr: "Le papier de Samarcande et la transmission de la fabrication du papier au monde islamique"
names:
  - { value: "ورق سمرقند", kind: alternate, lang: ar }
  - { value: "الكاغد السمرقندي", kind: alternate, lang: ar }
  - { value: "paper of Samarkand", kind: alternate, lang: en }
  - { value: "Samarkandi kaghad", kind: alternate, lang: en }
summary:
  ar: "تروي المصادر أن صنّاعاً صينيين أسروا بعد وقعة أطلخ قرب نهر طلاس سنة ⁦(133–134/751)⁩ علّموا صناعة الورق من الخرق الكتانية والقنب في سمرقند، فصار «ورق سمرقند» مشهوراً يصدَّر في أنحاء العالم الإسلامي حتى غدا عند الجاحظ نظيرَ برديّ مصر {cite:encyclopaedia-of-islam-2 vol. IV p. 440 KAGHAD} {cite:carter-invention-printing-1925 pp. 97–98}. السجل لنقل حرفة، لا لاختراع الورق الصيني الأصل، ورواية الأسرى خبر مروي لا وثيقة تأسيس."
  en: "The transmitted account tells how Chinese artisans captured after the battle of Atlakh near the Talas in ⁦(133–134/751)⁩ taught rag papermaking at Samarkand, whose 'paper of Samarkand' became a famed export until al-Jahiz could pair it with Egyptian papyrus {cite:encyclopaedia-of-islam-2 vol. IV p. 440 KAGHAD} {cite:carter-invention-printing-1925 pp. 97–98}. This is craft transmission, not the invention of paper, and the prisoner story is a report, not a foundation document."
  ur: "روایت ہے کہ نہر طلاس کے قریب اطلخ کی لڑائی ⁦(133–134/751)⁩ کے بعد پکڑے گئے چینی کاریگروں نے سمرقند میں کتان و سن کی ٹکروں سے کاغذ سازی سکھائی؛ «کاغذِ سمرقند» مشہور برآمدہ بنا اور جاحظ نے اسے مصر کے پاپائرسی کا ہم پلہ قرار دیا {cite:encyclopaedia-of-islam-2 vol. IV p. 440 KAGHAD} {cite:carter-invention-printing-1925 pp. 97–98}۔ یہ ہنر کی منتقلی ہے، کاغذ کی ایجاد نہیں؛ قیدیوں کی خبر منقولہ ہے، قیام کی دستاویز نہیں۔"
  es: "El relato transmitido cuenta cómo artesanos chinos capturados tras la batalla de Atlakh cerca de Talas (133-134/751) enseñaron a fabricar papel de trapo en Samarcanda, cuyo «papel de Samarcanda» se convirtió en una famosa exportación hasta que al-Jahiz pudo combinarlo con papiro egipcio {cite:encyclopaedia-of-islam-2 vol. IV p. 440 KAGHAD} {cite:carter-invention-printing-1925 pp. 97–98}. Se trata de una transmisión artesanal, no de la invención del papel, y la historia de los prisioneros es un informe, no un documento fundacional."
  fr: "Le récit transmis relate comment des artisans chinois, capturés après la bataille d'Atlakh près de Talas (133-134/751), enseignèrent la fabrication du papier chiffon à Samarcande. Le « papier de Samarcande » devint un produit d'exportation renommé jusqu'à ce qu'al-Jahiz puisse l'associer au papyrus égyptien (voir: Encyclopaedia of Islam, vol. IV, p. 440, Kaghad; voir: Carter, Invention Printing, 1925, p. 97-98). Il s'agit d'une transmission de savoir-faire, et non de l'invention du papier; le récit du prisonnier est un témoignage, et non un document fondateur."
