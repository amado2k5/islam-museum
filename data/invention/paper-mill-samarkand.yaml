    note: "The Baghdad workshop of 178/794 follows the Samarkand node in the transmitted chain; the landed record documents al-Fadl ibn Yahya's proposed workshop separately."
    sources: [source/encyclopaedia-of-islam-2, source/carter-invention-printing-1925]
  - external: { ar: "وراقة دمشق وجاتيفة وشهرة «خرطه دمشقية»", en: "Damascus and Jativa papermaking and Europe's 'carta damascena'", ur: "دمشق اور جاتیوہ کی کاغذ سازی اور یورپ کی 'کارٹا دمشینا'" }
