origin:
  place: place/samarqand
  polity: polity/abbasid-caliphate
  context:
    ar: "مدينة الصوق على طريق الحرير في مفرق الجيوش بين الصين والعباسيين؛ تذكر الرواية زياد بن صالح آسرَ الصناع، وفيها ورّاقون مهّدوا صناعة صارت فخر سمرقند {cite:carter-invention-printing-1925 p. 98} {cite:encyclopaedia-of-islam-2 vol. VIII pp. 1105–1106 SAMARKAND}."
    en: "A Silk Road market city at the military meeting point of Tang China and the Abbasids; the account names Ziyad ibn Salih as captor of artisans among whom were papermakers, seeding the craft that became Samarkand's pride {cite:carter-invention-printing-1925 p. 98} {cite:encyclopaedia-of-islam-2 vol. VIII pp. 1105–1106 SAMARKAND}."
    ur: "شاہراہِ ریشم کا بازار شہر، تانگ چین اور عباسیوں کی جنگی ملاقات گاہ؛ روایت زیاد بن صالح کو قیدی کرنے والا بتاتی ہے، جن میں کاغذ ساز سمرقند کی شان بنے ہنر کی بنیاد رکھے {cite:carter-invention-printing-1925 p. 98} {cite:encyclopaedia-of-islam-2 vol. VIII pp. 1105–1106 SAMARKAND}۔"
makers:
  - person: person/zayyad-ibn-salih
    role: transmitter
    place: place/samarqand
    note: "Named in al-Tha'alibi's transmitted account as the captor whose prisoners included the papermakers; the craft itself was carried by unnamed Chinese artisans, not devised by him."
    sources: [source/carter-invention-printing-1925, source/encyclopaedia-of-islam-2]
attribution:
  status: transmission
  claim:
    ar: "نقل صناعة الورق الصينية إلى سمرقند ومنها إلى العراق والشام ومصر والمغرب؛ لا اختراع الورق نفسه، ورواية أسرى طلاس منقولة عن الثعالبي لا وثيقة معاصرة."
    en: "Transmission of Chinese papermaking to Samarkand and onward to Iraq, Syria, Egypt and the Maghrib; not the invention of paper itself, and the Talas-prisoner account is transmitted by al-Tha'alibi, not a contemporary document."
    ur: "چینی کاغذ سازی کی سمرقند اور پھر عراق، شام، مصر اور مغرب میں منتقلی؛ خود کاغذ کی ایجاد نہیں، اور طلاس کے قیدیوں کی خبر ثعالبی کی منقولہ ہے، معاصر دستاویز نہیں۔"
  basis:
    ar: "يروي الثعالبي عن صاحب «المسالك والممالك» أن زياد بن صالح أسر صناعاً فيهم ورّاقون، وتؤكد دوّين التانغ تاريخ المعركة لا حضور الصناع؛ يلاحظ كارتر اختلاف المؤرخين الأقدمين في نسبة الشرف للأمويين أو العباسيين {cite:carter-invention-printing-1925 pp. 97–98} {cite:encyclopaedia-of-islam-2 vol. IV p. 440 KAGHAD}."
    en: "Al-Tha'alibi transmits from the author of 'Journeys and Kingdoms' that Ziyad ibn Salih's prisoners included papermakers; the Tang annals confirm the battle's date, not the artisans' presence, and Carter records the old debate over whether the Umayyads or the Abbasids deserved the honour {cite:carter-invention-printing-1925 pp. 97–98} {cite:encyclopaedia-of-islam-2 vol. IV p. 440 KAGHAD}."
    ur: "ثعالبی «مسالک و ممالک» کے مصنف سے نقل کرتا ہے کہ زیاد بن صالح کے قیدیوں میں کاغذ ساز تھے؛ تانگ تاریخ لڑائی کی تاریخی تصدیق کرتی ہے، کاریگروں کی موجودگی نہیں؛ کارٹر قدیم بحث بتاتا ہے کہ اعزاز امویوں کا تھا یا عباسیوں کا {cite:carter-invention-printing-1925 pp. 97–98} {cite:encyclopaedia-of-islam-2 vol. IV p. 440 KAGHAD}۔"
  perspectives:
    - tradition: sunni
      id: thaalibi-prisoner-account
      standing: main
      summary:
        ar: "يروي الثعالبي في لطائف المعارف أن ورق سمرقند حل محل البردي والرق وأن صنعته جاء بها الأسرى الصينيون؛ الرواية شاهد أدبي متأخر لا سجل إداري {cite:encyclopaedia-of-islam-2 vol. IV p. 440 KAGHAD} {cite:encyclopaedia-of-islam-2 vol. VIII pp. 1105–1106 SAMARKAND}."
        en: "Al-Tha'alibi's Lata'if al-ma'arif reports Samarkand paper replacing papyrus and parchment and credits the Chinese prisoners; this is later literary testimony, not an administrative record {cite:encyclopaedia-of-islam-2 vol. IV p. 440 KAGHAD} {cite:encyclopaedia-of-islam-2 vol. VIII pp. 1105–1106 SAMARKAND}."
        ur: "ثعالبی کی لطائف المعارف میں سمرقند کا کاغذ پاپائرسی اور پرچمنٹ کا بدل بنا اور قیدیوں کی روایت؛ یہ بعد کا ادبی شاہد ہے، انتظامی ریکارڈ نہیں {cite:encyclopaedia-of-islam-2 vol. IV p. 440 KAGHAD} {cite:encyclopaedia-of-islam-2 vol. VIII pp. 1105–1106 SAMARKAND}۔"
      sources: [source/encyclopaedia-of-islam-2]
    - tradition: academic
      id: carter-evidence-limits
      standing: main
      summary:
        ar: "يؤيد كارتر تاريخ المعركة بمطابقة دوّين التانغ، وينبه إلى أن خبر «الأعشاب والنباتات» يخالف ورق الخرق الباقي، وأن الشرف تناوشت عليه روايات الأمويين والعباسيين {cite:carter-invention-printing-1925 pp. 97–98}."
        en: "Carter matches the battle's date to the Tang annals, notes the 'grasses and plants' report conflicts with the surviving rag paper, and records the old Umayyad-versus-Abbasid contest for the honour {cite:carter-invention-printing-1925 pp. 97–98}."
        ur: "کارٹر لڑائی کی تاریخ تانگ تاریخ سے ملاتا، «گھاس اور پودوں» کی خبر بچے ہوئے ٹکرے کاغذ سے میل نہیں کھاتی بتاتا، اور اموی-عباسی اعزاز کی بحث محفوظ رکھتا ہے {cite:carter-invention-printing-1925 pp. 97–98}۔"
      sources: [source/carter-invention-printing-1925]
