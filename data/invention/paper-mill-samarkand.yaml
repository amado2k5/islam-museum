spread: []
impact:
  fields: [materials-industry, institutions-systems, everyday-life]
  changed:
    ar: "حلّ ورقُ سمرقند محل البردي والرق في دواوين العراق بحلول النصف الأول من القرن الثالث الهجري، وقيل إن هارون الرشيد فرضه على الدواوين لأن النص لا يُمحى فيه دون أثر {cite:encyclopaedia-of-islam-2 vol. IV p. 440 KAGHAD}."
    en: "Samarkand paper displaced papyrus and parchment in Iraqi chanceries by the early ninth century; al-Jahiz reports Harun al-Rashid ordered it for government offices because writing on it cannot be erased or scratched out unnoticed {cite:encyclopaedia-of-islam-2 vol. IV p. 440 KAGHAD}."
    ur: "سمرقند کا کاغذ نویں صدی کے آغاز تک عراقی دواوین میں پاپائرسی اور پرچمنٹ کی جگہ لے آیا؛ جاحظ کے بقول ہارون الرشید نے دفتری استعمال فرض کیا کہ اس پر تحریر بے اثر مٹائی نہیں جا سکتی {cite:encyclopaedia-of-islam-2 vol. IV p. 440 KAGHAD}۔"
  history:
    ar: "أرخص من البردي والرق، فوسّع مادة الكتابة للسجلات ثم الكتب ومهّد ثقافة الكتاب في العالم الإسلامي، دون دعوى أن كل مصنع لاحق نزل مباشرة من سمرقند {cite:encyclopaedia-of-islam-2 vol. IV pp. 440–441 KAGHAD} {cite:carter-invention-printing-1925 pp. 98–99}."
    en: "Cheaper than papyrus and parchment, it widened writing material from registers to books and laid the material base of Islamic book culture, without claiming every later mill descended directly from Samarkand {cite:encyclopaedia-of-islam-2 vol. IV pp. 440–441 KAGHAD} {cite:carter-invention-printing-1925 pp. 98–99}."
    ur: "پاپائرسی اور پرچمنٹ سے سستا، تحریری مادہ رجسٹروں سے کتابوں تک وسیع کیا اور اسلامی کتابی ثقافت کی مادی بنیاد رکھی، ہر بعد کے کارخانے کی براہ راست سمرقندی نسب کا دعویٰ نہیں {cite:encyclopaedia-of-islam-2 vol. IV pp. 440–441 KAGHAD} {cite:carter-invention-printing-1925 pp. 98–99}۔"
  significance: 4
  why: "The famous node in the transmission of papermaking from China into Islamic civilisation, with the transmitting account, its limits, and the documented substitution for papyrus and parchment all stated together."
