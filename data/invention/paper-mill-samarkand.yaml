today:
  form:
    ar: "تعيش الحرفة في مشغل ميروس بكونيغيل قرب سمرقند بألياف لحاء التوت تقليدياً؛ الصورة الحديثة توضيح سياقي لا إثبات لوصفة القرن الثامن {cite:commons-konigil-paper-enric Description}."
    en: "The craft lives on at the Meros workshop in Konigil near Samarkand, working mulberry-bark fibre in the traditional manner; the modern photograph is contextual, not proof of the eighth-century recipe {cite:commons-konigil-paper-enric Description}."
    ur: "ہنر آج بھی سمرقند کے قریب کونیگل کی میروس کارگاہ میں شہتوت کی چھال کے ریشوں سے جاری ہے؛ جدید تصویر سیاقی ہے، آٹھویں صدی کی ترکیب کا ثبوت نہیں {cite:commons-konigil-paper-enric Description}۔"
  descendants:
    ar: "صناعة الورق العالمية التي تحرك الألياف المبللة إلى ورق وتجففه وتنعّمه؛ النسب العام لا خطّ آلات مباشر مثبت {cite:encyclopaedia-of-islam-2 vol. IV pp. 440–441 KAGHAD}."
    en: "The world paper industry, which still lifts suspended fibre onto a mould and dries and polishes the sheet; the broad genealogy is not a proven direct machine line {cite:encyclopaedia-of-islam-2 vol. IV pp. 440–441 KAGHAD}."
    ur: "عالمی کاغذ صنعت جو معلق ریشے ورق بناتی، خشک اور ملمع کرتی ہے؛ عمومی نسب ثابت براہ راست مشینی سلسلہ نہیں {cite:encyclopaedia-of-islam-2 vol. IV pp. 440–441 KAGHAD}۔"
