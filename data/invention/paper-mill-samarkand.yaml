kids:
  ar: "كان الناس يكتبون على جلود تسمى الرق وعلى لفائف برديّ مصرية. يقول خبر قديم إن صنّاعاً صينيين أسروا في معركة سنة751 علّموا أهل سمرقند صنع الورق من خرق القماش المهترئة، فصار ورق سمرقند أشهر منها جميعاً وانتقل إلى بغداد ثم إلى الشام ومصر والأندلس."
  en: "People used to write on animal skins called parchment and on Egyptian papyrus rolls. An old report says Chinese craftsmen captured in a battle in 751 taught the people of Samarkand to make paper from worn-out rags; 'Samarkand paper' became the most famous of all and the craft travelled to Baghdad, Syria, Egypt and Spain."
  ur: "لوگ چمڑے کے پرچمنٹ اور مصر کے پاپائرسی پر لکھتے تھے۔ ایک قدیم خبر کہتی ہے کہ 751ء کی لڑائی میں پکڑے گئے چینی کاریگروں نے سمرقند والوں کو پرانے کپڑوں سے کاغذ بنانا سکھایا؛ «کاغذِ سمرقند» سب سے مشہور ہوا اور ہنر بغداد، شام، مصر اور اندلس گیا۔"
sources: [source/encyclopaedia-of-islam-2, source/carter-invention-printing-1925, source/commons-konigil-paper-enric]
