kids:
  ar: "اختيار المادة جزء من الاختراع، وليس الشكل وحده. وصف الزهراوي خيطاً من أمعاء الحيوان في كتاب للجراحة، لكنه أبقى قيد التجريب. نقرأ الفكرة وتاريخها ولا نجربها على جسم أو حيوان؛ الصورة توضح مادة حديثة وليست خيطه الأصلي."
  en: "Choosing a material can matter as much as choosing a shape. Al-Zahrawi described animal-intestinal thread in a surgical book, with an experimental caveat. We study its history, never try it on a person or animal; the photograph is a modern material comparison, not his original thread."
  ur: "مادے کا انتخاب بھی شکل جتنا اہم ہو سکتا ہے۔ الزہراوی نے جراحی کتاب میں حیوانی آنت کا دھاگا تجرباتی قید کے ساتھ بیان کیا۔ ہم تاریخ پڑھتے ہیں، انسان یا جانور پر نہیں آزماتے؛ تصویر جدید مادے کی مثال ہے، ان کا اصل دھاگا نہیں۔"
