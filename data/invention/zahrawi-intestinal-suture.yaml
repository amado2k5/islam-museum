summary:
  ar: "وصف لخيوط مستمدة من أمعاء الحيوان في خياطة الأمعاء ضمن جراحة التصريف؛ تنص ترجمة لوكلير على بقاء النهج في التجريب {cite:zahrawi-leclerc-chirurgie-1861 ch.87 p.211}. توثيق مساهمة في مادة الخياطة، لا اختراع كل خياطة أو إثبات نجاح سريري حديث {cite:majeed-islam-medicine-2005 pp.1486–1487}."
  en: "Animal-intestinal filaments described for intestinal suturing in al-Tasrif; Leclerc's translation explicitly retains an experimental qualification {cite:zahrawi-leclerc-chirurgie-1861 ch.87 p.211}. A documented material contribution, not invention of all suturing or proof of modern clinical efficacy {cite:majeed-islam-medicine-2005 pp.1486–1487}."
  ur: "التصریف میں آنتی سلائی کے لیے حیوانی آنت کے ریشوں کا بیان؛ لوکلیر کے ترجمے میں تجرباتی حیثیت صراحت سے باقی ہے {cite:zahrawi-leclerc-chirurgie-1861 ch.87 p.211}۔ مادے میں دستاویزی حصہ، تمام ٹانکوں کی ایجاد یا جدید طبی کامیابی کا ثبوت نہیں {cite:majeed-islam-medicine-2005 pp.1486–1487}۔"
