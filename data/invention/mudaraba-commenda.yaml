    ur: جدید اسلامی بینکاری کا مضاربہ اور منگول اورتوق شراکت
  note: 'The same contract in two other lives: the ortoq
    partnerships of the Mongol Empire that closely resemble qirad
    arrangements, and the mudarabah of contemporary Islamic
    finance, where it is a profit-and-loss-sharing mode.'
  sources:
