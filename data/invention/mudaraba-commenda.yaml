spread: []
impact:
  fields:
  - institutions-systems
  - everyday-life
  changed:
    ar: 'فصل المال عن المخاطرة الشخصية: مكّن صاحب المال من توظيف
      مهارة التاجر والتاجر من توظيف رأس المال — آلة التجارة
      البعيدة الأولى في الاقتصاد الإسلامي
      {cite:encyclopaedia-of-islam-2}.'
    en: 'It split capital from personal risk: it let the investor
      hire trading skill and the trader hire capital — the first
      long-distance finance machine of the Islamic economy
      {cite:encyclopaedia-of-islam-2}.'
    ur: 'اس نے سرمایہ کو ذاتی خطرے سے الگ کیا: سرمایہ دار تجارتی
      مہارت اور تاجر سرمایہ کرایہ پر لے سکا — اسلامی معیشت کی
      بعید تجارت کی پہلی مشین {cite:encyclopaedia-of-islam-2}۔'
  history:
    ar: 'من قوافل مكة إلى جنوة الكومندا وثائق القاهرة جنيزة مملوءة
      به؛ وفي أوروبا صار أحد آباء الشركة المحدودة — عقد عبر
      التمدنين بلا قرار حاسم عن خطه {cite:encyclopaedia-of-islam-2}
      {cite:wikipedia-commenda-en}.'
    en: 'From the caravans of Mecca to the commenda of Genoa, the
      Cairo Geniza documents are replete with it; in Europe it
      became an ancestor of the limited company — a contract that
      crossed civilisations without a final ruling on its route
      {cite:encyclopaedia-of-islam-2} {cite:wikipedia-commenda-en}.'
    ur: 'مکہ کے قافلوں سے جنوا کی کومینڈا تک، قاہرہ کی جنیزہ
      دستاویزات اس سے بھری ہیں؛ یورپ میں یہ محدود کمپنی کے اجداد
      میں آیا — تہذیبوں کے پار چلا عقد جس کے راستے کا آخری فیصلہ
      نہیں {cite:encyclopaedia-of-islam-2}
      {cite:wikipedia-commenda-en}۔'
  significance: 4
  why: 'The partnership that financed the medieval world: fiqh''s
    answer to long-distance trade and the contested ancestor of
    European venture capital.'
