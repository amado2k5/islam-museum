    status: tradition
    note: 'EI2 KIRAD: the contract is never mentioned in the Qur''an,
      but numerous traditions attribute its practice to the Prophet
      and his leading companions, and its likely direct origin is the
      pre-Islamic Arabian caravan trade; the earliest fiqh compendia
      treat it at length by the late eighth century, bearing the
      hallmark of long experience. The hijri figure is a derived
      conversion.'
    derived: true
    sources:
    - source/encyclopaedia-of-islam-2
    - source/wikipedia-qirad-en
  status_today: transformed
origin:
  place: place/mecca
  context:
    ar: 'قوافل الجزيرة قبل الإسلام ثم فقه المدارس — مالكية وشافعية
      «قراض/مقارضة» وحنفية «مضاربة» — حتى جنوة والبندقية
      {cite:encyclopaedia-of-islam-2}.'
    en: 'The pre-Islamic Arabian caravan trade, then the fiqh of the
      schools — Maliki and Shafi''i "qirad/muqarada", Hanafi
      "mudaraba" — as far as Genoa and Venice
      {cite:encyclopaedia-of-islam-2}.'
    ur: 'اسلام سے پہلے جزیرۃ العرب کی قافلہ تجارت، پھر مذاہب کی فقہ —
      مالکی اور شافعی «قراض/مقارضہ» اور حنفی «مضاربہ» — جنوا اور
      وینس تک {cite:encyclopaedia-of-islam-2}۔'
makers:
- person: person/shams-al-aimma-al-sarakhsi
  role: describer
  note: 'The Hanafi jurist whose al-Mabsut carries the great kitab
    al-mudaraba (book xxii) — the legal treatment EI2 cites for the
    contract''s definition and for his summary of its economic
    function: the investor hires trading skill, the agent hires
    capital.'
  sources:
  - source/encyclopaedia-of-islam-2
attribution:
  status: contested
  claim:
    ar: 'القراض/المضاربة صيغة فقهية إسلامية لها أصول جزيرية قبل
      الإسلام، والكومندا الإيطالية تشبهها حد التطابق تقريباً — لكن
      هل تحولت إليها أم نشأت مستقلةً لا يمكن الجزم به، والمتحف
      يسجل الشبه والسؤال معاً {cite:wikipedia-qirad-en}
      {cite:wikipedia-commenda-en} {cite:encyclopaedia-of-islam-2}.'
    en: 'The qirad/mudaraba is an Islamic fiqh instrument with
      pre-Islamic Arabian roots, and the Italian commenda resembles
      it almost to identity — but whether the one became the other
      or the two grew independently cannot be stated with certainty;
      the museum records the resemblance and the question together
      {cite:wikipedia-qirad-en} {cite:wikipedia-commenda-en}
      {cite:encyclopaedia-of-islam-2}.'
    ur: 'قراض/مضاربہ اسلامی فقہ کا وہ عقد ہے جس کی جڑیں پیشِ اسلام
      جزیرۃ العرب میں ہیں، اور اطالوی کومینڈا اس سے تقریباً عین ملتا
      ہے — مگر کیا وہی تبدیل ہو کر بنا یا دونوں آزادانہ پروان چڑھے،
      یقین سے نہیں کہا جا سکتا؛ عجائب گھر مشابہت اور سوال دونوں درج
      کرتا ہے {cite:wikipedia-qirad-en} {cite:wikipedia-commenda-en}
      {cite:encyclopaedia-of-islam-2}۔'
  basis:
    ar: 'EI2 يجعل أصله القوافل الجزيرية ويثبت تفصيله في أقدم المدونات
      الفقهية ⁦(أواخر القرن الثاني)⁩ ويوثق إدخاله كومنداً في موانئ
      إيطاليا أواخر القرن العاشر وأوائل الحادي عشر؛ ومراجعات برايور
      ⁦(1977)⁩ وأودوفيتش تعدد الأصول المرشحة ⁦(بابلي وروماني وبيزنطي
      وعبرية وقراض)⁩ مع ملاحظة أن القراض أقرب لأن العامل لا يتحمل
      الخسارة {cite:encyclopaedia-of-islam-2}
      {cite:wikipedia-commenda-en} {cite:wikipedia-qirad-en}.'
    en: 'EI2 roots it in the Arabian caravan trade and documents its
      full treatment in the earliest legal compendia ⁦(late second
      century AH)⁩, recording its introduction as the commenda into
      the Italian seaports of the late tenth and early eleventh
      centuries; Pryor ⁦(1977)⁩ and Udovitch list several candidate
      sources ⁦(Babylonian tapputum, Roman societas and foenus
      nauticum, Byzantine chreokoinonia, the Jewish isqa and the
      Muslim qirad)⁩ while noting the qirad stands closest because
      the travelling partner bears no loss
      {cite:encyclopaedia-of-islam-2} {cite:wikipedia-commenda-en}
      {cite:wikipedia-qirad-en}.'
    ur: 'EI2 اس کی جڑ جزیرے کی قافلہ تجارت میں ڈالتا اور قدیم ترین
      فقہی مدونات میں اس کا مفصل علاج ⁦(دوسری صدی ہجری کے آخر)⁩
      ثابت کرتا اور دسویں صدی کے آخر و گیارہویں کے شروع میں اطالوی
      بندرگاہوں تک کومینڈا کی صورت اس کی آمد درج کرتا ہے؛ پرائر
      ⁦(1977ء)⁩ اور یوڈووچ کئی ممکنہ مآخذ گنواتے ہیں ⁦(بابلی
      تپوتم، رومی سوسییتس اور فوینس ناوٹیکم، بازنطینی خریوکوینونیا،
      یہودی اسقا اور مسلم قراض)⁩ اور یہ بھی لکھتے ہیں کہ قراض سب
      سے قریب ہے کیونکہ مسافر شریک نقصان نہیں اُٹھاتا
      {cite:encyclopaedia-of-islam-2} {cite:wikipedia-commenda-en}
      {cite:wikipedia-qirad-en}۔'
  perspectives:
  - tradition: sunni
    id: fiqh-received-account
    summary:
      ar: 'الرواية الفقهية التليدة — في الإطار السني العام يُروى
        القراض سنةً موروثة: أحاديث تنسب ممارسته للنبي وأصحابه،
        ومدونات المذاهب من المودونة والأم إلى المبسوط تفرد له باباً
        منذ القرن الثاني، والسرخسي يعلل إباحته حاجةَ الناس إلى
        عقدٍ يجمع المال والتجارة {cite:encyclopaedia-of-islam-2}
        {cite:wikipedia-qirad-en}.'
      en: 'The received fiqh account — in the museum''s Sunni default
        frame the qirad is told as an inherited sunna: traditions
        attribute its practice to the Prophet and his companions,
        the school compendia from the Mudawwana and the Umm to the
        Mabsut give it its own book from the second century, and
        al-Sarakhsi grounds its licence in people''s need for a
        contract joining capital and trade
        {cite:encyclopaedia-of-islam-2} {cite:wikipedia-qirad-en}.'
      ur: 'روایتی فقہی بیان — سنی عمومی فریم میں قراض منتقلی سنت کہی
        جاتی ہے: روایات اس کا استعمال نبی اور صحابہ سے منسوب کرتی
        ہیں، مدونہ اور الام سے مبسوط تک مذہبی مدونات دوسری صدی سے
        اسے الگ کتاب دیتی ہیں، اور سرخسی اس کی جواز کی علت لوگوں کی
        مال اور تجارت جوڑنے والے عقد کی ضرورت بتاتا ہے
        {cite:encyclopaedia-of-islam-2} {cite:wikipedia-qirad-en}۔'
    sources:
    - source/encyclopaedia-of-islam-2
    - source/wikipedia-qirad-en
  - tradition: academic
    id: udovitch-pryor-multi-source-commenda
    summary:
      ar: 'القراءة المقارنة — أودوفيتش وبرايور يعددان مرشحين متعددين
        ⁦(بابلي وروماني وبيزنطي وعبرية وقراض)⁩ ويجعلان القراض الأقرب
        شكلاً لأن العامل لا يتحمل الخسارة، مع التحفظ: التشابه
        القريب لا يثبت تحولاً، والأصول قد تكون مستقلة
        {cite:wikipedia-commenda-en} {cite:encyclopaedia-of-islam-2}
        {cite:udovitch-partnership-profit-1970}.'
      en: 'The comparative reading — Udovitch and Pryor enumerate
        multiple candidates ⁦(Babylonian, Roman, Byzantine, Jewish
        and the qirad)⁩ and judge the qirad closest in form because
        the agent bears no loss, with a hedge: near-identical shape
        does not prove transmission, and the institutions may have
        evolved independently {cite:wikipedia-commenda-en}
        {cite:encyclopaedia-of-islam-2}
        {cite:udovitch-partnership-profit-1970}.'
    sources:
    - source/wikipedia-commenda-en
    - source/encyclopaedia-of-islam-2
    - source/udovitch-partnership-profit-1970
