kids:
  ar: 'تخيل رجلاً عنده مال ولا يعرف التجارة، وآخر يعرف التجارة ولا
    مال له: يعطي الأول الثاني ماله يتاجر به، ويقسمان الربح كما اتفقا
    من قبل، وإن خسرت التجارة خسر صاحب المال ماله والتاجر تعبه فقط.
    بهذا العقد العادل حركت القوافل مئات السنين.'
  en: 'Imagine a man who has money but cannot trade, and another who
    can trade but has no money: the first hands over his capital,
    the second trades with it, and they split the profit as agreed
    beforehand; if the venture loses, the owner loses his money and
    the trader only his effort. This fair contract moved caravans
    for hundreds of years.'
  ur: 'ایک شخص سوچو جس کے پاس مال ہے مگر تجارت نہیں آتی، اور دوسرا
    جو تجارت جانتا مگر مال نہیں رکھتا: پہلا اپنا سرمایہ دیتا، دوسرا
    اس سے تجارت کرتا، اور منافع پہلے سے طے شدہ نسبت بانٹتے ہیں؛
    نقصان ہو تو مالک اپنا مال اور تاجر صرف اپنی محنت کھوتا۔ اسی
    منصفانہ عقد نے صدیوں قافلے چلائے۔'
