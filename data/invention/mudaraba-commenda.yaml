    ur: اطالوی کومینڈا ⁦(وینس کی کولیگنسیا اور جنوا کی سوسییتس)⁩
  note: 'The thirteenth-century Mediterranean contract, unilateral
    or bilateral, that financed single voyages — EI2 calls its
    introduction germinal to the expansion of medieval European
    trade; the kinship with the qirad is the contested question.'
  sources:
