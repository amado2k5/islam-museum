summary:
  ar: عقد يعهد فيه مستثمر ⁦(صاحب مال)⁩ برأس مال إلى عامل ⁦(مضارب)⁩
    يتاجر به ويرد الأصل وقسماً متفقاً من الربح؛ فإن خسرت التجارة خسر
    العامل سعيه وحدها والمستثمر ماله — صيغة فقهية من تجارة قوافل
    الجزيرة ظهرت في المرافئ الإيطالية القرن الحادي عشر كومندا/
    كوليغنسيا، فهل تحول القراض كومنداً أم نشأت مستقلة سؤال مؤرخين
    متنازع {cite:encyclopaedia-of-islam-2} {cite:wikipedia-commenda-en}
    {cite:wikipedia-qirad-en}.
  en: A contract in which an investor ⁦(the sahib al-mal)⁩ entrusts
    capital to an agent ⁦(the mudarib)⁩ who trades with it, then
    returns the principal plus an agreed share of profit; if the
    venture loses, the agent loses only his labour and the investor
    his capital — a fiqh instrument of the Arabian caravan trade
    that appeared in the eleventh-century Italian seaports as the
    commenda or collegantia; whether the qirad turned into the
    commenda or the two grew apart independently is a contested
    question among historians {cite:encyclopaedia-of-islam-2}
    {cite:wikipedia-commenda-en} {cite:wikipedia-qirad-en}.
  ur: ایک عقد جس میں سرمایہ دار ⁦(صاحبِ مال)⁩ مال کسی عامل ⁦(مضارب)⁩
    کے سپرد کرتا ہے جو اس سے تجارت کر کے اصل اور متفقہ حصہ منافع
    واپس کرتا ہے؛ نقصان ہو تو عامل صرف اپنی محنت کھوتا اور سرمایہ
    دار اپنا مال — جزیرۃ العرب کی قافلہ تجارت کی فقہی صورت جو
    گیارہویں صدی میں اطالوی بندرگاہوں پر کومینڈا/کولیگنسیا بن کر
    ابھری؛ قراض کومینڈا بنا یا دونوں الگ الگ بڑھے، مؤرخین میں متنازع
    سوال {cite:encyclopaedia-of-islam-2} {cite:wikipedia-commenda-en}
    {cite:wikipedia-qirad-en}۔
  es: "Un contrato en el que un inversor (el sahib al-mal) confía capital a un agente (el mudarib) que comercia con él, y luego devuelve el capital más una parte acordada de las ganancias; si la empresa pierde, el agente pierde solo su trabajo y el inversor su capital; un instrumento de fiqh del comercio de caravanas árabe que apareció en los puertos marítimos italianos del siglo XI como la commenda o collegantia; si el qirad se convirtió en la commenda o si ambos se separaron independientemente es una cuestión controvertida entre los historiadores {cite:encyclopaedia-of-islam-2} {cite:wikipedia-commenda-en} {cite:wikipedia-qirad-en}."
