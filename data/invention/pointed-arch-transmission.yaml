kids:
  ar: 'تخيل قوساً عادياً كأنه نصف دائرة، ثم اضغطه من الجانبين فيرتفع
    رأسه كطرف سهم: هذا القوس المدبب يحمل الحائط إلى الأعلى ويترك
    مكاناً لنوافذ كبيرة. بناه المسلمون في قصورهم ومساجدهم منذ قرون
    كثيرة، وصار لاحقاً وجه الكنائس الكبرى في أوروبا.'
  en: 'Imagine a normal arch like half a circle, then squeeze it from
    both sides so its head rises like an arrow tip: the pointed arch
    carries the wall higher and leaves room for great windows.
    Muslims built it in their palaces and mosques for many centuries,
    and it later became the face of Europe''s great churches.'
  ur: 'ایک عام محراب سوچو جیسے آدھا دائرہ، پھر دونوں طرف سے دباؤ تو اس
    کا سرا تیر کی نوک کی طرح اٹھے: نوک دار محراب دیوار کو اوپر اٹھاتی
    اور بڑی کھڑکیوں کی جگہ چھوڑتی ہے۔ مسلمانوں نے اسے صدیوں اپنے محلات
    اور مسجدوں میں بنایا، پھر وہ یورپ کے بڑے گرجا گھروں کا چہرہ بنی۔'
