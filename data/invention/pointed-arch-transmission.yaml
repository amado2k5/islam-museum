era:
  origins: pre-islamic-inherited
  first_attested:
    edtf: "0712~"
    hijri: "0093~"
    calendar: julian
    precision: year
    status: debated
    note: 'The first Islamic-era attestation: Qusayr Amra (712-715),
      whose pointed arches carry a centre-offset of about a tenth of
      the span, sharpening through Hammam al-Sarah, Mshatta and Fustat.
      Pointed forms are far older — Nippur drains, the Karamagara
      bridge, the seventh-century Cypriot aqueduct — so the date marks
      the Islamic career of the arch, not its first appearance. The
      hijri figure is a derived conversion.'
    derived: true
    sources:
    - source/wikipedia-pointed-arch-en
    - source/encyclopaedia-of-islam-2
  status_today: living
origin:
  polity: polity/umayyad-caliphate
  place: place/damascus
  context:
    ar: 'الشام والعراق الأمويان ثم سامراء العباسية: ورث البناؤون
      الأوائل رصيفاً رومانياً-بيزنطياً وساسانياً فيه الشكل المدبب،
      فأدخلوه مساجد وقصوراً وحمامات، وصار عند العباسيين قوساً رباعي
      المراكز ثم سمة فارسية وفاطمية {cite:wikipedia-pointed-arch-en}
      {cite:encyclopaedia-of-islam-2}.'
    en: 'Umayyad Syria and Iraq, then Abbasid Samarra: the first Muslim
      builders inherited a Roman-Byzantine and Sasanian fabric that
      already knew the pointed form, set it in mosques, palaces and
      bathhouses, raised it under the Abbasids to the four-centred
      type, and made it a hallmark of Persian and later Fatimid
      building {cite:wikipedia-pointed-arch-en}
      {cite:encyclopaedia-of-islam-2}.'
    ur: 'اموی شام و عراق، پھر عباسی سامرہ: پہلے مسلمان معماروں کو
      رومی-بازنطینی اور ساسانی روایت میں نوک دار شکل پہلے سے ملی، انہوں
      نے اسے مسجدوں، محلات اور حماموں میں ڈالا، عباسیوں کے ہاتھ چار
      مرکزی محراب بنی، پھر فارسی اور فاطمی فنِ تعمیر کی پہچان ہوئی
      {cite:wikipedia-pointed-arch-en} {cite:encyclopaedia-of-islam-2}۔'
makers:
- person: person/ahmad-ibn-tulun
  role: commissioner
  place: place/cairo
  note: 'Founder of the congregational mosque at al-Qatai (876-879),
    whose arcades and windows carry the most famous early pointed
    arches of Islamic architecture — the monument the transmission
    debate always cites; he built, he did not design the form.'
  sources:
  - source/wikipedia-pointed-arch-en
attribution:
  status: contested
  claim:
    ar: 'القوس المدبب وُجد قبل الإسلام وتطور في عمارة الإسلام قروناً
      قبل الغوطية؛ فهل وصل فرنسا وإنكلترا من البناء الإسلامي عبر صقلية
      والأندلس والشام أم نشأ مستقلاً داخل الصناعة الرومانسكية، سؤال
      مفتوح لا يحسمه المتحف {cite:wikipedia-pointed-arch-en}
      {cite:warren-creswell-pointed-arch-1991} {cite:bony-french-gothic-1983}.'
    en: 'The pointed arch existed before Islam and developed in Islamic
      building for centuries before the Gothic; whether it reached
      France and England from Islamic construction through Sicily,
      al-Andalus and Syria, or grew independently inside Romanesque
      practice, is an open question the museum does not decide
      {cite:wikipedia-pointed-arch-en}
      {cite:warren-creswell-pointed-arch-1991} {cite:bony-french-gothic-1983}.'
    ur: 'نوک دار محراب اسلام سے پہلے بھی تھی اور اسلامی تعمیر میں گوتھک
      سے صدیوں پہلے پروان چڑھی؛ فرانس اور انگلستان تک صقلیہ، اندلس اور
      شام کے راستے پہنچی یا رومانیسک دستکاری کے اندر آزادانہ نکلی، کھلا
      سوال ہے جس کا فیصلہ عجائب گھر نہیں کرتا
      {cite:wikipedia-pointed-arch-en}
      {cite:warren-creswell-pointed-arch-1991}
      {cite:bony-french-gothic-1983}۔'
  basis:
    ar: 'شواهد مبكرة إسلامية ⁦(قصير عمرة 712-715م بتباعد عُشر البحور،
      سامراء القرن التاسع، ابن طولون 876-879م)⁩ مقابل شواهد أسبق:
      مصارف نيبور البرونزية وجسر كرة مجرة وقناة قبرس القرن السابع —
      والأدبيات منقسمة بين مدرسة التأثير الإسلامي ⁦(بوني)⁩ ومدرسة
      الاستقلال البنائي الأوروبي {cite:wikipedia-pointed-arch-en}
      {cite:warren-creswell-pointed-arch-1991}.'
    en: 'Early Islamic witnesses ⁦(Qusayr Amra 712-715 at a tenth of
      the span, ninth-century Samarra, Ibn Tulun 876-879)⁩ against
      earlier ones — the Bronze Age drains of Nippur, the Karamagara
      bridge, the seventh-century Cypriot aqueduct — while the
      literature divides between an Islamic-influence school ⁦(Bony)⁩
      and an independent European structural-development school
      {cite:wikipedia-pointed-arch-en}
      {cite:warren-creswell-pointed-arch-1991}.'
    ur: 'ابتدائی اسلامی شواہد ⁦(قصیر عمرہ 712-715ء جس میں مرکزوں کا فاصلہ
      عرض کا دہائی حصہ، نویں صدی کا سامرہ، ابن طولون 876-879ء)⁩ بمقابلہ
      قدیم شواہد — نپور کے کانسی زمانے کے نالے، کرہ مگرہ پل، ساتویں
      صدی کا قبرصی آبگزر — اور ادبیات دو مکتبوں میں بٹی ہے: اسلامی
      اثر کی مکتب ⁦(بونی)⁩ اور آزاد یورپی ساختی ارتقا کی مکتب
      {cite:wikipedia-pointed-arch-en}
      {cite:warren-creswell-pointed-arch-1991}۔'
  perspectives:
  - tradition: sunni
    id: islamic-development-received-account
    summary:
      ar: 'الرواية التليدة — في الإطار السني العام للمتحف رُوي القوس
        المدبب عنصراً عمره البناء الإسلامي من الأمويين فصاعداً: نظمه
        العباسيون رباعي المراكز، وعمّ مصر وفارس والأندلس، فلما ظهر
        الغوطي قيل إن أوروبا أخذته من العالم الإسلامي عبر صقلية
        النورمانية وإسبانيا وأراضي الحروب الصليبية
        {cite:encyclopaedia-of-islam-2} {cite:bony-french-gothic-1983}.'
      en: 'The received account — in the museum''s Sunni default frame
        the pointed arch is told as an element Islamic building aged
        and spread from the Umayyads onward: the Abbasids ordered its
        four-centred form, it covered Egypt, Persia and al-Andalus,
        and when the Gothic appeared, Europe was said to have taken
        it from the Islamic world through Norman Sicily, Spain and
        the Crusader lands {cite:encyclopaedia-of-islam-2}
        {cite:bony-french-gothic-1983}.'
      ur: 'روایتی بیان — سنی عمومی فریم میں نوک دار محراب ایسا عنصر
        کہا گیا جسے امویوں سے لے کر اسلامی تعمیر نے پُرتا اور پھیلایا:
        عباسیوں نے چار مرکزی صورت دی، مصر، فارس اور اندلس میں عام
        ہوئی، اور جب گوتھک ظاہر ہوا تو کہا گیا یورپ نے اسے صقلیہ،
        ہسپانیہ اور صلیبی علاقوں کے راستے اسلامی دنیا سے لیا
        {cite:encyclopaedia-of-islam-2} {cite:bony-french-gothic-1983}۔'
    sources:
    - source/encyclopaedia-of-islam-2
    - source/bony-french-gothic-1983
  - tradition: academic
    id: independent-european-development
    summary:
      ar: 'الأصل الروماني-البيزنطي والتطور الأوروبي المستقل — وورن
        يوثق الشكل قبل الإسلام ⁦(كرة مجرة، رافينا، آيا إيريني)⁩،
        وستيوارت يقرأ محرابيات قبرس المبكرة ابتكاراً بيزنطياً محلياً،
        وفي رومانسكية درم مبرر إنشائي داخلي: ضلوع مدببة ترفع الأقباط
        مختلفة البحور إلى ارتفاع واحد — فيُروى الغوطي نمواً داخل
        الصناعة الأوروبية {cite:wikipedia-pointed-arch-en}
        {cite:warren-creswell-pointed-arch-1991}.'
      en: 'The Roman-Byzantine origin and the independent European
        development — Warren documents the form before Islam
        ⁦(Karamagara, Ravenna, Hagia Irene)⁩, Stewart reads the early
        Cypriot pointed arches as local Byzantine innovation, and at
        Romanesque Durham the pointed rib had an internal structural
        rationale, lifting vaults of different spans to one height —
        so the Gothic is told as growth inside European building
        practice {cite:wikipedia-pointed-arch-en}
        {cite:warren-creswell-pointed-arch-1991}.'
      ur: 'رومی-بازنطینی اصل اور آزاد یورپی ارتقا — وارن اسلام سے پہلے
        کی شکل مستند کرتا ہے ⁦(کرہ مگرہ، راوینا، آیا ایرینی)⁩، اسٹیورٹ
        قبرص کی ابتدائی نوک دار محرابوں کو مقامی بازنطینی ایجاد مانتا
        ہے، اور رومانیسک ڈرہم میں نوک دار ضلع کی اپنی ساختی وجہ تھی:
        مختلف عرض کی چھتوں کو ایک بلندی پر لانا — اس لیے گوتھک یورپی
        دستکاری کے اندرونی نمو کہی جاتی ہے
        {cite:wikipedia-pointed-arch-en}
        {cite:warren-creswell-pointed-arch-1991}۔'
    sources:
    - source/wikipedia-pointed-arch-en
    - source/warren-creswell-pointed-arch-1991
precursors:
- external:
    ar: الأقواس المدببة الرومانية-البيزنطية والساسانية
    en: The Roman-Byzantine and Sasanian pointed forms
    ur: رومی-بازنطینی اور ساسانی نوک دار اشکال
  note: 'Nippur''s Bronze Age drains, the Karamagara bridge of about
    seventeen metres span, the Cypriot aqueduct arches — the pointed
    form already in the Near Eastern repertoire the first Muslim
    builders inherited.'
  sources:
  - source/wikipedia-pointed-arch-en
dependents:
- external:
    ar: الضلع المقوس والعقدة الغوثية
    en: The Gothic rib vault and ogive
    ur: گوتھک ضلعی چھت اور اوژیو
  note: 'From Durham and Saint-Denis to Chartres: the pointed arch
    became the load-bearing grammar of the cathedral, with the rib
    vault and the flying buttress.'
  sources:
  - source/wikipedia-pointed-arch-en
- external:
    ar: محراب تيودور والقوس الفارسي المنبسط
    en: The Tudor arch and the depressed Persian arch
    ur: ٹیوڈر محراب اور دبی ہوئی فارسی محراب
  note: 'The late-Gothic four-centred window arch is a variation of the
    Islamic four-centred type — the clearest documented borrowing in
    the whole debate.'
  sources:
  - source/wikipedia-pointed-arch-en
spread: []
impact:
  fields:
  - architecture-building
  changed:
    ar: 'أطلق الارتفاع والضوء: القوس المدبب يوازن بحوراً مختلفة على
      ارتفاع واحد ويخفف الدفع الجانبي، فصارت الجدران أنحف والنوافذ
      أوسع {cite:wikipedia-pointed-arch-en}.'
    en: 'It released height and light: the pointed arch equalises
      different spans at one height and eases lateral thrust, so
      walls thinned and windows widened {cite:wikipedia-pointed-arch-en}.'
    ur: 'اس نے بلندی اور روشنی کھولی: نوک دار محراب مختلف عرض کو ایک
      بلندی پر برابر کرتی اور پہلو کے دباؤ کم کرتی ہے، اس لیے دیواریں
      پتلی اور کھڑکیاں کشادہ ہوئیں {cite:wikipedia-pointed-arch-en}۔'
  history:
    ar: 'من قصير عمرة إلى شارتر مسار مشترك: عنصر شرقي-متوسطي نضجه
      البناء الإسلامي قروناً، سواء عبر إلى أوروبا أم لا، ثم تعالى
      هيكلَ كاتدرائية {cite:wikipedia-pointed-arch-en}.'
    en: 'From Qusayr Amra to Chartres a shared path: an eastern
      Mediterranean element matured by Islamic building for
      centuries — whether or not it crossed to Europe — before it
      crowned the skeleton of the cathedral
      {cite:wikipedia-pointed-arch-en}.'
    ur: 'قصیر عمرہ سے شارتر تک مشترک راستہ: مشرقی بحیرۂ رومی عنصر جسے
      اسلامی تعمیر نے صدیوں پُرتا — یورپ منتقل ہو یا نہ ہو — اور جو
      آخر گرجا گھر کے ڈھانچے کا تاج بنا
      {cite:wikipedia-pointed-arch-en}۔'
  significance: 4
  why: 'The most contested architectural element in the shared
    Mediterranean: a form Islam matured that became the face of the
    European cathedral, with the transmission question honestly left
    open.'
