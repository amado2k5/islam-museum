  fr: "L'arc brisé dans l'architecture islamique et sa transmission au gothique"
  tr: "İslam mimarisindeki sivri kemer ve bunun Gotik mimariye aktarılması"
  id: "Lengkungan runcing dalam arsitektur Islam dan penerapannya pada arsitektur Gotik"
