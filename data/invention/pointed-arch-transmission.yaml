summary:
  ar: قوس يتلاقى جانباه المنحنيان في تاج حاد — استعملته العمارة الأموية
    والعباسية مبكراً ⁦(قصير عمرة 712-715م، قبة الصليبية وقصر العاشق
    بسامراء، مسجد ابن طولون 876-879م)⁩ وبلغت أرقى صوره في القوس رباعي
    المراكز العباسي، ثم صار في القرن الثاني عشر عنصراً بنائياً حاكماً
    للكاتدرائيات الغوثية — وسؤال نقله من البناء الإسلامي إلى أوروبا
    متنازع بين المؤرخين {cite:wikipedia-pointed-arch-en}
    {cite:encyclopaedia-of-islam-2}.
  en: An arch whose two curving sides meet in a sharp crown — used
    early in Umayyad and Abbasid building ⁦(Qusayr Amra 712-715, the
    Qubbat al-Sulaybiyya and Qasr al-Ashiq at Samarra, the Ibn Tulun
    mosque 876-879)⁩, perfected in the Abbasid four-centred arch, then
    made in the twelfth century the ruling structural element of the
    Gothic cathedrals — whether it passed from Islamic building to
    Europe or rose independently is a contested question among
    historians {cite:wikipedia-pointed-arch-en}
    {cite:encyclopaedia-of-islam-2}.
  ur: ایک ایسی محراب جس کے دونوں خم دار پہلو تاج پر نوک سے ملتے ہیں —
    اموی اور عباسی تعمیرات میں جلدی استعمال ہوئی ⁦(قصیر عمرہ 712-715ء،
    سامرہ کی قبۃ الصلیبیہ اور قصر العاشق، مسجد ابن طولون 876-879ء)⁩،
    عباسی چار مرکزی محراب میں اپنی بلند ترین صورت پائی، پھر بارہویں صدی
    میں گوتھک گرجا گھروں کا حاکم عنصر بنی — اسلامی تعمیر سے یورپ منتقل
    ہوئی یا آزادانہ ابھری، مؤرخین میں متنازع ہے
    {cite:wikipedia-pointed-arch-en} {cite:encyclopaedia-of-islam-2}۔
  es: "Un arco cuyos dos lados curvos se unen en una corona afilada —utilizado tempranamente en la arquitectura omeya y abasí (Qusayr Amra 712-715, Qubbat al-Sulaybiyya y Qasr al-Ashiq en Samarra, la mezquita Ibn Tulun 876-879), perfeccionado en el arco de cuatro centros abasí, y luego convertido en el siglo XII en el elemento estructural dominante de las catedrales góticas— si pasó de la arquitectura islámica a Europa o surgió de forma independiente es una cuestión controvertida entre los historiadores {cite:wikipedia-pointed-arch-en} {cite:encyclopaedia-of-islam-2}."
  fr: "Une arche dont les deux côtés courbes se rejoignent en une couronne pointue — utilisée dès les débuts de la construction omeyyade et abbasside (Qusayr Amra 712-715, le Qubbat al-Sulaybiyya et le Qasr al-Ashiq à Samarra, la mosquée Ibn Tulun 876-879), perfectionnée dans l'arc à quatre centres abbasside, puis devenue au XIIe siècle l'élément structurel dominant des cathédrales gothiques — la question de savoir si elle est passée de la construction islamique à l'Europe ou si elle est apparue indépendamment est une question controversée parmi les historiens {cite:wikipedia-pointed-arch-en} {cite:encyclopaedia-of-islam-2}."
  tr: "İki kavisli kenarının keskin bir tepede birleştiği kemer, Emevi ve Abbasi mimarisinde (Kusayr Amra 712-715 MS, Haç Kubbesi ve Semerra'daki Aşıklar Sarayı, İbn Tulun Camii 876-879 MS) erken dönemlerde kullanılmış ve Abbasi dört merkezli kemerinde en güzel halini almıştır; daha sonra on ikinci yüzyılda Gotik katedrallerin baskın bir yapısal unsuru haline gelmiştir ve İslam mimarisinden Avrupa'ya geçişi tarihçiler arasında tartışmalıdır."
  id: "Lengkungan yang kedua sisi lengkungnya bertemu di mahkota yang tajam—digunakan sejak awal dalam arsitektur Umayyah dan Abbasiyah (Qusayr Amra 712-715 M, Kubah Salib dan Istana Kekasih di Samarra, Masjid Ibn Tulun 876-879 M) dan mencapai bentuk terbaiknya pada lengkungan empat pusat Abbasiyah, kemudian pada abad ke-12 menjadi elemen struktural dominan katedral Gotik—dan pertanyaan tentang perpindahannya dari arsitektur Islam ke Eropa masih diperdebatkan di kalangan sejarawan."
