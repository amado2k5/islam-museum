today:
  form:
    ar: "ما زالت أسماء المنازل معروفة في التراث الفلكي العربي، وتُعرض في الخرائط النجمية القديمة كمنازل القمر الثمانية والعشرين."
    en: "The mansion names remain known in the Arabic astronomical tradition, displayed on old celestial charts as the twenty-eight lunar mansions."
    ur: "منازل کے نام آج بھی عربی فلکیاتی تراث میں جانا جاتے ہیں اور پرانے آسمانی نقشوں پر چوبیس قمری منازل کے طور پر دکھائے جاتے ہیں۔"
  descendants:
    ar: "استمر استخدام أسماء المنازل في كتب الفراسة والأحكام، وفي خرائط الكواكب القديمة التي تحدد مواقع البروج والمنازل معاً."
    en: "The mansion names persist in physiognomic and judgment literature and on old planetary charts that mark zodiac signs and mansions together."
    ur: "منازل کے نام فِراسة و احکام کی کتب میں اور پرانے سیاروں کے نقشوں میں برقرار رہے جو بروج اور منازل دونوں کی پوزیشنیں دکھاتے ہیں۔"
