kids:
  ar: "منذ ألف سنة، قسّم الفلكيون السماء إلى ثمانية وعشرين منزلاً يسير فيها القمر في دورة شهرية، مثل محطات على طريق. كل منزل له اسم عربي جميل، كالشَّرَطان والحَوت. تعلّم الفرغاني، وهو عالم مسلم من زمان قديم، هذه القائمة في كتابه، فصارت مفتاحاً لحساب الأيام والاتجاهات."
  en: "A thousand years ago, astronomers divided the sky into twenty-eight mansions the Moon passes through on its monthly journey, like stations on a road. Each has an Arabic name, like al-Sharatayn and al-Hut. Al-Farghani, an old Muslim scholar, wrote this list in his book, and it became a key for counting days and finding directions."
  ur: "ہزار سال پہلے فلکیات دانوں نے آسمان کو اٹھائیس منازل میں تقسیم کیا جن میں چاند اپنی ماہانہ سیر میں گزرتا ہے، جیسے سڑک پر اسٹیشن۔ ہر منزل کا عربی نام ہے، جیسے الشَّرَطان اور الحَوت۔ الفرغانی، ایک قدیم مسلم عالم، نے یہ فہرست اپنی کتاب میں لکھی، اور وہ دن گننے اور سمتیں معلوم کرنے کی کنجی بن گئی۔"
