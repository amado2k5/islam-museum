id: invention/manazil-al-qamar
class: invention
label: { ar: "منازلُ القمرِ الثمانيةُ والعشرونَ", en: "The twenty-eight lunar mansions", ur: "چوبیس منازلِ قمر" }
names:
  - { value: "manāzil al-qamar", kind: alternate, lang: ar }
  - { value: "lunar mansions", kind: alternate, lang: en }
  - { value: "manzil", kind: alternate, lang: ar }
summary:
  ar: "نظام فلكي قسّم السماء إلى ثمانية وعشرين منزلاً قمرياً يسير فيها القمر في نحو يوم لكل منزل، استُقبل من النظام الهندي وطُوبق مع أنجماء الأنواء العربية، ودوّنه الفرغاني في فصله العشرين من كتابه {cite:kunitzsch-lunar-mansions-2008 pp. 1242–1243} {cite:farghani-elements-astronomy p. 53}. وبقي النظام مرجعاً في حساب الزمن ومعرفة الفراسة المرتبطة بالأنواء {cite:kunitzsch-lunar-mansions-2008 pp. 1242–1243}."
  en: "An astronomical system dividing the heavens into twenty-eight lunar mansions through which the Moon passes in about a day each; received from the Indian system and matched to the Arabic anwā' asterisms, it was recorded by al-Farghani in the twentieth chapter of his book {cite:kunitzsch-lunar-mansions-2008 pp. 1242–1243} {cite:farghani-elements-astronomy p. 53}. The system remained a reference for time-reckoning and the mansion lore attached to the anwā' {cite:kunitzsch-lunar-mansions-2008 pp. 1242–1243}."
  ur: "ایک فلکیاتی نظام جس نے آسمان کو اٹھائیس قمری منازل میں تقسیم کیا جن میں چاند تقریباً ایک دن میں ایک گزر دیتا ہے؛ یہ نظام ہند سے پایا گیا اور عربی انواء سے ملایا گیا، اور الفرغانی نے اسے اپنی کتاب کے بیسویں باب میں لکھا {cite:kunitzsch-lunar-mansions-2008 pp. 1242–1243} {cite:farghani-elements-astronomy p. 53}۔ یہ نظام وقت کے حساب اور انواء سے جڑی منزلوں کی روایات کا مرجع رہا {cite:kunitzsch-lunar-mansions-2008 pp. 1242–1243}۔"
