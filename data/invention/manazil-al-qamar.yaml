era:
  origins: abbasid-golden
  first_attested:
    edtf: "0850~"
    calendar: julian
    precision: century
    status: historical
    note: "Al-Farghani's Elements of Astronomy (written before 857 CE per the edition read) already lists the 28 mansions; the system itself was received from India at an earlier, unrecorded date per Kunitzsch."
    sources: [source/farghani-elements-astronomy, source/kunitzsch-lunar-mansions-2008]
  status_today: transformed
origin:
  place: place/baghdad
  polity: polity/abbasid-caliphate
  context:
    ar: "دوّن الفرغاني قائمة المنازل الثمانية والعشرين في بابه العشرين من كتابه «الجوامع في علم النجوم»، وهو كتاب منهجي في الفلك أُلّف في حاضرة الدولة العباسية وقرئ في مدارسها {cite:farghani-elements-astronomy p. 53} {cite:muruj-al-dhahab p. 519}."
    en: "Al-Farghani recorded the list of twenty-eight mansions in the twentieth chapter of his 'Elements of Astronomy', a systematic treatise composed in the Abbasid capital's scholarly world and read in its schools {cite:farghani-elements-astronomy p. 53} {cite:muruj-al-dhahab p. 519}."
    ur: "الفرغانی نے اٹھائیس منازل کی فہرست اپنی کتاب «الجوامع في علم النجوم» کے بیسویں باب میں لکھی؛ یہ کتاب عباسی دار الحکومت کے علمی ماحول میں لکھی گئی اور وہاں کے مدارس میں پڑھی گئی {cite:farghani-elements-astronomy p. 53} {cite:muruj-al-dhahab p. 519}۔"
makers:
  - person: person/al-farghani
    role: describer
    place: place/baghdad
    note: "Al-Farghani lists the twenty-eight mansions in his twentieth chapter with their star groups and risings/settings {cite:farghani-elements-astronomy pp. 51–53}; Kunitzsch shows the Arabic list descends from the Indian system via the anwā' matching, so al-Farghani transmitted and fixed the received scheme rather than inventing it {cite:kunitzsch-lunar-mansions-2008 pp. 1242–1243}."
    sources: [source/farghani-elements-astronomy, source/kunitzsch-lunar-mansions-2008]
attribution:
  status: transmission
  claim:
    ar: "لم يخترع العرب نظام المنازل؛ استقبلوه من النظام الهندي في زمن مبكر، وطابقوا كل منزل مع نجم أو مجمع من أنجماء الأنواء العربية، فصار للنظام شكل عربي موحّد دوّنه الفرغاني."
    en: "The Arabs did not invent the mansion system; they received it from the Indian system at an early date, matched each mansion to an Arabic anwā' star or asterism, and al-Farghani fixed the unified Arabic form in his treatise."
    ur: "عربوں نے منازل کا نظام ایجاد نہیں کیا؛ انہوں نے اسے ایک قدیم زمانے میں ہند کے نظام سے پایا، ہر منزل کو عربی انواء کے ستارے یا مجمع سے ملایا، اور الفرغانی نے اسے اپنی کتاب میں متحد عربی شکل دی۔"
  basis:
    ar: "يبيّن كونيتسش أن قائمة المنازل عند العرب تعود إلى النظام الهندي عبر المطابقة مع الأنواء، وأن الفرغاني في القرن الثالث الهجري يذكرها بوصفها تقليداً مستقراً لا اختراعاً شخصياً {cite:kunitzsch-lunar-mansions-2008 pp. 1242–1243}. ويفصّل الفرغاني أسماء المنازل الثمانية والعشرين ونجوم كل منها ومواقيت طلوعها وغروبها {cite:farghani-elements-astronomy pp. 51–53}."
    en: "Kunitzsch shows the Arabic mansion list descends from the Indian system through the anwā' matching, and that al-Farghani in the third century AH lists it as an established tradition, not a personal invention {cite:kunitzsch-lunar-mansions-2008 pp. 1242–1243}. Al-Farghani details the twenty-eight names, each mansion's stars and its risings and settings {cite:farghani-elements-astronomy pp. 51–53}."
    ur: "کونیتزش دکھاتے ہیں کہ عربوں کی منازل کی فہرست انواء کے ذریعے ہند کے نظام سے ماخوذ ہے، اور تیسری صدی ہجری کا الفرغانی اسے ایک قائم روایت کے طور پر بیان کرتا ہے، ذاتی ایجاد کے طور پر نہیں {cite:kunitzsch-lunar-mansions-2008 pp. 1242–1243}۔ الفرغانی اٹھائیس ناموں، ہر منزل کے ستاروں اور ان کے طلوع و غروب کے اوقات کو تفصیل سے بیان کرتا ہے {cite:farghani-elements-astronomy pp. 51–53}۔"
precursors:
  - external: { ar: "نظام المنازل الهندي — التقسيم القديم للسماوات إلى ثمانية وعشرين منزلاً", en: "The Indian mansion system — the older division of the heavens into twenty-eight stations", ur: "ہندی منازل کا نظام — آسمان کی اٹھائیس منازل میں قدیم تقسیم" }
    note: "The twenty-eight-station scheme is attested in Indian astronomy before the Arabic reception; the Arabic list was fitted to it {cite:kunitzsch-lunar-mansions-2008 pp. 1242–1243}."
    sources: [source/kunitzsch-lunar-mansions-2008]
  - external: { ar: "أنجماء الأنواء — أسماء النجوم ومجاميعها التي عرفتها القبائل العربية قبل الإسلام", en: "The anwā' star-lore — the star names and asterisms known to the pre-Islamic Arab tribes", ur: "انواء کے ستارے — قبل از اسلام عرب قبائل کو معلوم ستاروں اور ان کے مجامع کے نام" }
    note: "Each Arabic mansion was matched to an anwā' star or asterism, binding the received Indian scheme to indigenous Arab sky-knowledge {cite:kunitzsch-lunar-mansions-2008 pp. 1242–1243}."
    sources: [source/kunitzsch-lunar-mansions-2008]
dependents:
  - external: { ar: "علم الأنواع والأحكام الفلكية المنسوبة إلى المنازل", en: "The lore of asterisms and judgments attached to the mansions", ur: "منزلوں سے منسوب اقسام و فلکی احکام کا علم" }
    note: "Medieval Arabic texts attach weather, health and fate judgments to each mansion; the astronomical frame outlived the divinatory use {cite:kunitzsch-lunar-mansions-2008 pp. 1242–1243}."
    sources: [source/kunitzsch-lunar-mansions-2008]
  - external: { ar: "حساب الزمن والاتجاه في التراث الإسلامي", en: "Time and direction reckoning in the Islamic tradition", ur: "اسلامی تراث میں وقت و سمت کا حساب" }
    note: "Rising and culminating of mansions served time reckoning; al-Farghani discusses mansion risings and settings in the chapters on the sphere's motions {cite:farghani-elements-astronomy pp. 36, 38}."
    sources: [source/farghani-elements-astronomy]
spread: []
impact:
  fields: [everyday-life]
  changed:
    ar: "أعطى التقويم العربي إطاراً فلكياً موحّداً، وربط معرفة النجوم الشعبية بحسابات علمية، وبقي مرجعاً في حسابات الوقت والاتجاه."
    en: "It gave the Arabic calendar a unified astronomical frame, tied popular star-knowledge to scientific reckoning, and remained a reference for time and direction computation."
    ur: "اس نے عربی تقویم کو ایک متحد فلکیاتی ڈھانچہ دیا، مقبول ستاروں کے علم کو علمی حساب سے جوڑا، اور وقت و سمت کے تعین کے لیے مرجع رہا۔"
  history:
    ar: "ثبّت قائمة المنازل في المنهج الفلكي العباسي، ودوّنها الفرغاني في القرن الثالث الهجري، فصارت مدخلاً أساسيًا في كتب الهيئة المتأخرة."
    en: "It fixed the mansion list in the Abbasid astronomical curriculum; al-Farghani's third-century record made it a standard entry in later hay'a treatises."
    ur: "اس نے عباسی فلکیاتی نصاب میں منازل کی فہرست کو مستقل کیا؛ تیسری صدی ہجری میں الفرغانی کا تحریر اسے بعد کی ہیئات کی کتابوں میں معیاری باب بنا گئی۔"
  significance: 3
  why: "A transmitted system rather than an invention, but one that structured a millennium of Arabic calendar, prayer-time and star-lore practice; significance rests on documented transmission and use, not on a Muslim inventor."
