kids:
  ar: "كتب العلماء عن الإيمان أموراً كثيرة، وقد اختلف الناس في بعضها قديماً. رتّب الللكائي أبواب كتابه على طريقة مفيدة: يذكر في كل باب ما رُوي، ومتى نشأ الخلاف، ثم يجادل بالكتب المنقولة عن النبي وأصحابه وأتباعهم، حتى يفهم القارئ موضع الخلاف."
  en: "Scholars wrote many things about faith, and people differed on some of them long ago. Al-Lalaka'i ordered his book's chapters in a helpful way: each chapter states what was transmitted, when the dispute arose, then argues from books narrated from the Prophet and his Companions and followers, so the reader understands where the difference lies."
  ur: "علماء نے ایمان کے بارے میں بہت سی باتیں لکھیں اور لوگوں میں ان میں کچھ پر قدیم زمانے سے اختلاف رہا۔ للاکائی نے اپنی کتاب کے ابواب ایک مفید انداز میں ترتیب دیے: ہر باب میں بتایا گیا کہ کیا منقول ہے، اختلاف کب شروع ہوا، پھر نبی، ان کے ساتھیوں اور پیروکاروں سے منقول کتب سے دلیل دی گئی تاکہ قاری کو اختلاف کی جگہ سمجھ آئے۔"
