    en: "Historical example of organising a doctrinal text; the displayed image is an Arabic-script manuscript on faith and its sources in Amsterdam's World Museum — contextual for the creed-book tradition, not a copy of al-Lalaka'i's work {cite:commons-creed-manuscript-tropenmuseum Description}."
    ur: "عقائدی متن کی ترتیب کی تاریخی مثال؛ دکھائی گئی تصویر ایمسٹرڈیم کے عالمی عجائب گھر میں ایمان اور اس کے ماخذ پر ایک عربی مخطوطہ ہے — عقیدہ کی کتابوں کی روایت کا سیاقی نمونہ، للاکائی کی کتاب کی نقل نہیں {cite:commons-creed-manuscript-tropenmuseum Description}۔"
  descendants:
