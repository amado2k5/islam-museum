impact:
  fields: [institutions-systems]
  changed:
    ar: "حوّل موضوعات العقيدة إلى أبواب مرتبة بتاريخ الخلاف، وجعل الحجة من أسانيد الصحابة والتابعين لا من جدل المتكلمين فقط {cite:sharh-usul-itiqad-basira}."
    en: "Turned creed topics into chapters ordered by the history of dispute, grounding argument in Companion and Successor chains rather than only in theological dialectic {cite:sharh-usul-itiqad-basira}."
    ur: "عقیدے کے موضوعات کو اختلاف کی تاریخ کے مطابق ابواب میں بدل دیا اور دلیل کو صرف متکلمین کے جدل نہیں بلکہ صحابہ و تابعین کی سندوں پر قائم کیا {cite:sharh-usul-itiqad-basira}۔"
  history:
    ar: "أصبح الكتاب مرجعاً في أصول الاعتهاد عند أهل الحديث، وبقيت طريقته في عرض الخلاف موثقة في النسخ المتداولة {cite:shadharat-dhahab} {cite:sharh-usul-itiqad-basira}."
    en: "The book became a reference for creed among the people of hadith, and his method of presenting dispute remains documented in circulating copies {cite:shadharat-dhahab} {cite:sharh-usul-itiqad-basira}."
    ur: "یہ کتاب اہلِ حدیث کے یہاں عقیدے کا مرجع بنی، اور اختلاف پیش کرنے کا ان کا طرز منتقلہ نسخوں میں محفوظ ہے {cite:shadharat-dhahab} {cite:sharh-usul-itiqad-basira}۔"
  significance: 3
  why: "A documented, distinctive arrangement of creed by dispute history with isnad-based argumentation inside a widely transmitted book; bounded to this work's method, not a claim of inventing creed literature."
