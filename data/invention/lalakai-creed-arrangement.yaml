    en: "The text describes the author's method as each chapter stating what is transmitted on the topic, when the dispute arose and who began it, then arguing with the Qur'an, hadith and sayings of the Companions and Successors until it ends with the miracles of the saints {cite:sharh-usul-itiqad-basira}."
