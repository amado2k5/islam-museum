summary:
  ar: "أسلوب تأليف في أصول الاعتقاد رتّب فيه الللكائي أبواب العقيدة على ما رُوي في كل باب، وبيّن متى وقع الخلاف ومن بدأه، ثم احتج من القرآن والحديث وأقوال الصحابة والتابعين بالسند، حتى انتهى بكرامات الأولياء {cite:sharh-usul-itiqad-basira} {cite:shadharat-dhahab}."
  en: "A method of composing creed arranged so that each chapter of al-Lalaka'i's usul al-i'tiqad states what has been transmitted on the topic, when the dispute arose and who began it, then argues from the Qur'an, hadith and sayings of the Companions and Successors with chains, ending with the miracles of the saints {cite:sharh-usul-itiqad-basira} {cite:shadharat-dhahab}."
  ur: "عقیدہ کی تالیف کا ایک طرز جس میں للاکائی نے اصولِ اعتقاد کے ابواب کو اس بات کے مطابق ترتیب دیا کہ ہر باب میں کیا مروی ہے، کب اختلاف ہوا اور کس نے شروع کیا، پھر قرآن، حدیث اور صحابہ و تابعین کے اقوال کو سند کے ساتھ پیش کیا، اور آخر میں اولیاء کی کرامات پر پہنچے {cite:sharh-usul-itiqad-basira} {cite:shadharat-dhahab}۔"
