kids:
  ar: "جرّب أن ترسم ثلاث رصّات مربعة من مكعبات صغيرة على الورق. عدّ الأولى مكعباً مكعباً، ثم قِس طول ضلع الثانية واستخدمه لتقدير العدد، ثم قارن الزمن. هذه لعبة فهم للتقدير، لا دليل بناء حقيقي."
  en: "Draw three square stacks of tiny cubes on paper. Count the first cube by cube,then measure one side of the second and estimate total,then compare time. This is an estimation-learning game,not real construction guidance."
  ur: "کاغذ پر چھوٹے مکعبوں کے تین مربع ڈھیر بنائیں۔ پہلے کو ایک ایک مکعب گنیں، دوسرے کا ایک کنارہ ناپ کر کل کا اندازہ لگائیں، پھر وقت کا موازنہ کریں۔ یہ تخمینے کی تعلیمی سرگرمی ہے، حقیقی تعمیراتی ہدایت نہیں۔"
