  en: "Al-Kindi's frequency analysis for decipherment"
  ur: "کندی کا تعددی تجزیہ برائے رمز شکنی"
  es: "Análisis de frecuencia de Al-Kindi para el desciframiento"
  fr: "L'analyse fréquentielle d'Al-Kindi pour le déchiffrement"
  tr: "Al-Kindi'nin kod çözme işleminde frekans analizi"
  id: "Analisis frekuensi dalam dekode Al-Kindi"
names:
  - { value: "frequency analysis", kind: alternate, lang: en }
