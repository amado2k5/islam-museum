kids:
  ar: "تخيّل رسالة سرية كُتبت بحروف بديلة. قال الكندي قبل ألف ومئة سنة: احسب أي حرف يتكرر أكثر في اللغة — في العربية مثلاً الألف واللام — وابدأ بمطابقة أكثر الرموز تكراراً. هكذا وُلدت طريقة كسر الشفرات بالإحصاء."
  en: "Imagine a secret message written in swapped letters. A thousand and a hundred years ago al-Kindi said: count which letter occurs most in the language — in Arabic, alif and lam — and start matching the most frequent symbols. That is how code-breaking by statistics was born."
  ur: "سوچو ایک خفیہ خط بدلے حروف میں لکھا ہوا ہے۔ گیارہ سو سال پہلے کندی نے کہا: زبان میں کون سا حرف سب سے زیادہ آتا ہے گنو — عربی میں علیف اور لام — اور سب سے زیادہ آنے والی علامتوں سے میلانا شروع کرو۔ اسی طرح شماریات سے رمز توڑنا پیدا ہوا۔"
