summary:
  ar: "يصف الكندي في رسالته «في استخراج المعمى» طريقة لكسر التعمية الاستبدالية بإحصاء تكرار الحروف في اللغة ومطابقة النص المشفّر — أقدم وصف مكتوب معروف لتحليل التكرار، وهو الأساس الذي قامت عليه علمية تحليل الشفرات لاحقاً."
  en: "In his treatise on extracting the crypted, al-Kindi describes breaking substitution ciphers by counting letter frequencies in the language and matching them to the ciphertext — the earliest known written account of frequency analysis, the method on which scientific cryptanalysis was later built."
  ur: "کندی نے اپنے رسالے «فی استخراج المعمى» میں بدلی کے رمز توڑنے کا طریقہ بیان کیا: زبان میں حروف کی تکرار گن کر مشفر متن سے میلانا — تعددی تجزیے کی قدیم ترین معلوم تحریری صفت، وہ طریقہ جس پر بعد میں علمی رمز شکنی قائم ہوئی۔"
  es: "En su tratado sobre la extracción de lo cifrado, al-Kindi describe cómo descifrar cifrados de sustitución contando la frecuencia de las letras en el idioma y comparándolas con el texto cifrado; este es el primer relato escrito conocido sobre el análisis de frecuencias, el método sobre el que posteriormente se construyó el criptoanálisis científico."
  fr: "Dans son traité sur l'extraction du texte crypté, al-Kindi décrit le décryptage des chiffrements par substitution en comptant les fréquences des lettres dans la langue et en les faisant correspondre au texte chiffré — le plus ancien compte rendu écrit connu de l'analyse de fréquence, la méthode sur laquelle la cryptanalyse scientifique a été construite plus tard."
  tr: "El-Kindi, \"Kriptogramlar Üzerine\" adlı incelemesinde, dildeki harflerin sıklığını sayarak ve şifrelenmiş metni eşleştirerek ikame şifrelerini kırma yöntemini tanımlar; bu, daha sonra kriptanaliz biliminin temelini oluşturan frekans analizinin bilinen en eski yazılı açıklamasıdır."
  id: "Dalam risalahnya \"Tentang Kriptogram,\" Al-Kindi menjelaskan metode untuk memecahkan sandi substitusi dengan menghitung frekuensi huruf dalam bahasa tersebut dan mencocokkannya dengan teks yang dienkripsi — deskripsi tertulis paling awal yang diketahui tentang analisis frekuensi, yang menjadi dasar pembangunan ilmu kriptanalisis di kemudian hari."
