kids:
  ar: "قبل مئة وعشرين سنة تقريباً، تعلّم عالم اسمه الخوارزمي طريقة جديدة لحل الألغاز العددية. في أحد أبواب كتابه كانت مسائل غريبة: رجل تزوج في مرضه ثم ماتت زوجته وأوصت بمال، فصار المال الذي يملكه يتغير حسب الوصية والوصية تتغير حسب المال. حلّها بوضع علامة استفهام على الرقم المجهول وكتابته حتى انحلّ كل شيء. هكذا صار كتابه الجبر أول كتاب يعلّم طريقة «شيء مجهول» ما زال اسمه مستعملاً اليوم."
  en: "About twelve hundred years ago a scholar named al-Khwarizmi learned a new way to solve number puzzles. In one chapter of his book there were strange problems: a man married while dying, his wife died and left a bequest, and the money he owned changed with the bequest while the bequest changed with the money. He solved them by putting a question mark on the unknown number and writing it out until everything came clear. That is how his book became the first to teach the 'unknown thing' whose name we still use today."
  ur: "بارہ سو سال پہلے الخوارزمی نامی عالم نے اعداد کے پہیلیاں حل کرنے کا ایک نیا طریقہ سیکھا۔ ان کی کتاب کے ایک باب میں عجیب مسائل تھے: ایک شخص اپنی موت کے قریب شادی کرتا ہے، اس کی بیوی مر کر وصیت کرتی ہے، اور اس کے پاس موجود پیسہ وصیت کے ساتھ بدلتا ہے اور وصیت اس پیسہ کے ساتھ۔ اس نے ہر چیز کو ایک «نامعلوم» کے نشان کے ساتھ لکھ کر حل کیا یہاں تک کہ سب واضح ہو گیا۔ اسی طرح ان کی کتاب پہلی بن گئی جس نے «نامعلوم چیز» کا طریقہ سکھایا — وہی نام جو آج بھی استعمال ہوتا ہے۔"
