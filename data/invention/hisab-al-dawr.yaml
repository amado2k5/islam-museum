      id: sunni-museum-frame
      standing: main
      summary:
        ar: "الخوارزمي مسلم في كلماته هو: في مقدمة كتابه يذكر الله ويدعو على نبيه وعلى الأنبياء والمرسلين، ويسمي المأمون الإمام وأمير المؤمنين {cite:khwarizmi-jabr-cairo-1939 p. 29}، فلا تعارض في إطاره السني."
        en: "Al-Khwarizmi is a Muslim in his own words: in his preface he invokes God, asks blessing on the Prophet and on all the prophets and messengers, and names al-Ma'mun the imam and commander of the faithful {cite:khwarizmi-jabr-cairo-1939 p. 29}, so the Sunni frame creates no tension."
        ur: "خوارزمی اپنی ہی باتوں میں مسلمان ہیں: اپنے مقدمے میں اللہ کا ذکر، نبی پر درود اور تمام انبیاء و مرسلین کا ذکر کرتے ہیں، اور مامون کو امام اور امیر المؤمنین کہتے ہیں {cite:khwarizmi-jabr-cairo-1939 p. 29}؛ اس لیے سنی سیاق میں کوئی تعارض نہیں۔"
      sources: [source/khwarizmi-jabr-cairo-1939]
