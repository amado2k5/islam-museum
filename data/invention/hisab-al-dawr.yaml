summary:
  ar: "باب من «كتاب الوصايا» في «الجبر والمقابلة» للخوارزمي يعالج المسائل التي يتوقف فيها مقدار الوصية على مقدار التركة ويتوقف مقدار التركة على الوصية، فيجعل المجهول «شيئاً» ويتتبع ما يصير في أيدي الطرفين ثم يجبر ويقابل؛ أبوابه في طبعة القاهرة مسألة التزويج في المرض والعتق في المرض والمقرّ في الدور والسلم في المرض {cite:khwarizmi-jabr-cairo-1939 p.108} {cite:khwarizmi-jabr-cairo-1939 p.110} {cite:khwarizmi-jabr-cairo-1939 p.118} {cite:khwarizmi-jabr-cairo-1939 p.121}."
  en: "A chapter of the Book of Bequests in al-Khwarizmi's al-Jabr wal-muqabala treating problems in which the amount of the bequest depends on the estate and the estate depends on the bequest; he makes the unknown a 'thing', traces what reaches each party's hands and then applies al-jabr and al-muqabala. Its sections in the Cairo edition are marriage in terminal illness, manumission in illness, the gift of a slave-girl in illness, and the salam contract in illness {cite:khwarizmi-jabr-cairo-1939 p.108} {cite:khwarizmi-jabr-cairo-1939 p.110} {cite:khwarizmi-jabr-cairo-1939 p.118} {cite:khwarizmi-jabr-cairo-1939 p.121}."
  ur: "خوارزمی کے «الجبر والمقابلہ» کے کتاب الوصایا کا ایک باب ان مسائل پر ہے جن میں وصیت کی مقدار ترکہ پر اور ترکہ کی مقدار وصیت پر منحصر ہوتی ہے؛ وہ مجہول کو «شیء» بناتا ہے، دونوں فریقوں کے ہاتھوں میں پہنچنے والی رقم کا سراغ لگاتا ہے اور پھر جبر و مقابلہ کرتا ہے۔ قاہرہ ایڈیشن میں اس کے ابواب ہیں: مرضِ موت میں شادی، مرضِ موت میں آزاد کرنا، مرضِ موت میں مہرن/جاریہ کا اقرار اور مرضِ موت میں سلام {cite:khwarizmi-jabr-cairo-1939 p.108} {cite:khwarizmi-jabr-cairo-1939 p.110} {cite:khwarizmi-jabr-cairo-1939 p.118} {cite:khwarizmi-jabr-cairo-1939 p.121}۔"
