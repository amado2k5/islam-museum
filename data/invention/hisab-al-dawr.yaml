    note: "Author of the Book of Bequests inside al-Jabr wal-muqabala, written under al-Ma'mun; the circular-reckoning chapter applies his own algebra to bequest problems where estate and bequest are mutually dependent. The method is his documented procedure, not a claim to have invented algebra or Islamic inheritance law."
