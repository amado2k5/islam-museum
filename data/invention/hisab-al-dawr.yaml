attribution:
  status: improvement
  claim:
    ar: "وضع الخوارزمي في «كتاب الوصايا» طريقة حسابية لمسائل الوصية المتداخلة، بتطبيق الجبر والمقابلة على مجهول يجعل التركة والوصية كلتيهما تخرج منه؛ ولم يخترع بذلك الجبر ولا أحكام الوصية الفقهية التي أخذها مسلّمة."
    en: "Al-Khwarizmi set out a calculation method for interlocking bequest problems in the Book of Bequests, applying al-jabr and al-muqabala to an unknown from which both estate and bequest come out; he did not thereby invent algebra or the legal rules of bequest, which he takes as given."
    ur: "خوارزمی نے کتاب الوصایا میں باہم گتھی ہوئی وصیت کے مسائل کے لیے ایک حسابی طریقہ دیا، جس میں الجبر و مقابلہ ایک ایسے مجہول پر لاگو ہوتا ہے جس سے ترکہ اور وصیت دونوں نکلتے ہیں؛ اس سے انہوں نے نہ الجبر ایجاد کیا نہ وصیت کے فقہی احکام — وہ انہیں مسلم مان کر لیتے ہیں۔"
  basis:
    ar: "في طبعة القاهرة، تحت عنوان «حساب الدور» قبل مسائل التزويج في المرض، يأتي باب «كتاب الوصايا» وفيه مسائل يُحل فيها كل مجهول على الآخر؛ فمثلاً رجل تزوج امرأة في مرض موته على مائة درهم كلها ماله ومهر مثلها عشرة دراهم، ثم ماتت المرأة وأوصت بثلث مالها ثم مات الزوج، فيجعل وصيتها «شيئاً» ويجبر ويقابل حتى يخرج خمسة وثلاثين درهماً {cite:khwarizmi-jabr-cairo-1939 p.108} {cite:khwarizmi-jabr-cairo-1939 p.109}. وتحت العناوين «العتق في المرض» و«المقرّ في الدور» و«السلم في المرض» مسائل جارية وأعتق ومبايعات {cite:khwarizmi-jabr-cairo-1939 p.110} {cite:khwarizmi-jabr-cairo-1939 p.118} {cite:khwarizmi-jabr-cairo-1939 p.121}، ويختم الكتاب كله بمسألة من هذا الباب {cite:khwarizmi-jabr-cairo-1939 p.122}."
    en: "In the Cairo edition, under the heading 'circular reckoning' before the problems of marriage in illness, the Book of Bequests opens with problems in which every unknown depends on another; for example a man marries a woman in his final illness for one hundred dirhams, all his wealth, whose mahr mithl is ten dirhams, then the woman dies leaving a bequest of a third of her wealth and the husband dies — he makes her bequest a 'thing', applies al-jabr and al-muqabala, and obtains thirty-five dirhams {cite:khwarizmi-jabr-cairo-1939 p.108} {cite:khwarizmi-jabr-cairo-1939 p.109}. Under the headings 'manumission in illness', 'the acknowledgement in the cycle' and 'the salam in illness' come problems of slave-girls, manumission and sales {cite:khwarizmi-jabr-cairo-1939 p.110} {cite:khwarizmi-jabr-cairo-1939 p.118} {cite:khwarizmi-jabr-cairo-1939 p.121}, and the whole book closes with a problem from this chapter {cite:khwarizmi-jabr-cairo-1939 p.122}."
    ur: "قاہرہ ایڈیشن میں «گول گنتی» کے عنوان کے تحت مرضِ موت کی شادی کے مسائل سے پہلے کتاب الوصایا ایسے مسائل سے کھلتی ہے جن میں ہر مجہول دوسرے پر منحصر ہے؛ مثلاً ایک آدمی اپنی مرضِ موت میں ایک عورت سے سو درہم میں شادی کرتا ہے جو اس کی ساری دولت ہے، اس کے مثلِ مہر دس درہم ہیں، پھر عورت مر کر اپنی دولت کا ایک تہائی وصیت کرتی ہے اور شوہر بھی مر جاتا ہے — وہ اس کی وصیت کو «شیء» بناتا ہے، جبر و مقابلہ کرتا ہے اور پینتیس درہم نکالتا ہے {cite:khwarizmi-jabr-cairo-1939 p.108} {cite:khwarizmi-jabr-cairo-1939 p.109}۔ «مرض میں آزاد کرنا»، «دور میں اقرار» اور «مرض میں سلام» کے عنوانوں کے تحت جاریہ، آزاد کرنے اور بیع کے مسائل آتے ہیں {cite:khwarizmi-jabr-cairo-1939 p.110} {cite:khwarizmi-jabr-cairo-1939 p.118} {cite:khwarizmi-jabr-cairo-1939 p.121}، اور پوری کتاب اسی باب کے ایک مسئلے پر ختم ہوتی ہے {cite:khwarizmi-jabr-cairo-1939 p.122}۔"
  perspectives:
