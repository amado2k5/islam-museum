impact:
  fields: [mathematics, institutions-systems]
  changed:
    ar: "حوّل مسائل الوصايا المعقدة من حيرة المحاسبين إلى معادلات ذات مجهول واحد، فأظهر أن الجبر أداة عمل يومية في الدواوين والوراثة لا مجرد نظرية."
    en: "Turned tangled bequest problems from a calculator's quandary into equations in a single unknown, showing that algebra was a working tool in chanceries and inheritances, not only a theory."
    ur: "بہت الجھیلے ہوئے وصیائی مسائل کو ایک مجہول والی مساواتوں میں بدل دیا، اور دکھایا کہ الجبر دیوانوں اور وراثت میں روزمرہ کا اوزار تھا، محض نظریہ نہیں۔"
  history:
    ar: "بقيت الطريقة داخل كتاب الجبر نفسه حتى طبعة القاهرة 1939، ولا نعرف أنبوبيًا من طبّقها بعده خارج طلاب الكتاب؛ مكانتها أنها أقدم شهادة على استخدام الجبر في حسابات التركات الفعلية."
    en: "The method survives inside the algebra book itself down to the 1939 Cairo edition; no independent later manual applying it is documented in the sources read. Its place is as the earliest surviving witness to algebra used in real estate-and-bequest reckoning."
    ur: "طریقہ خود الجبر کی کتاب میں موجود ہے اور 1939 کی قاہرہ ایڈیشن تک پہنچا؛ پڑھے ماخذ میں اس کے بعد اسے لاگو کرنے والی کوئی آزاد کتاب معلوم نہیں۔ اس کی اہمیت یہ ہے کہ یہ وراثت کے حقیقی حساب میں الجبر کے استعمال کا قدیم ترین باقی گواہ ہے۔"
  significance: 3
  why: "A bounded but historically important application: the earliest surviving worked demonstration of algebra solving real inheritance problems, inside the book that founded the science; significance held at 3 because it is a chapter of an existing work rather than a standalone treatise."
