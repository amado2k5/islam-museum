today:
  form:
    ar: "تقول موسوعة TDV إن جزءاً مهماً من الأوقاف بقي إلى اليوم، وإن الوقف في تركيا انتقل إلى إدارة الأوقاف في الجمهورية بعد إلغاء وكالة الشرعية والأوقاف في 3 مارس 1924 {cite:tdv-vakif §history}."
    en: "The TDV encyclopedia says a significant part of the waqfs survives to the present day, and that in Turkey waqf passed to the Republic's waqf administration after the Ministry of Sharia and Waqfs was abolished on 3 March 1924 {cite:tdv-vakif §history}."
    ur: "ٹی ڈی وی انسائیکلوپیڈیا کہتا ہے کہ اوقاف کا ایک اہم حصہ آج تک باقی ہے، اور ترکی میں 3 مارچ 1924ء کو وزارتِ شرعیہ و اوقاف ختم ہونے کے بعد وقف جمہوریہ کی انتظامیۂ اوقاف کو منتقل ہو گیا {cite:tdv-vakif §history}۔"
  descendants:
