summary:
  ar: "تصرّف يحبس فيه المالك أصل ماله عن البيع والهبة والإرث، ويجعل غلّته لوجه من وجوه البر إلى الأبد. ويروي البخاري أن عمر بن الخطاب أصاب أرضاً بخيبر هي أنفس ماله عنده، فاستشار النبي، فقال له: «إن شئت حبست أصلها وتصدقت بها»، فتصدق بها عمر على ألا تباع ولا توهب ولا تورث، للفقراء والقربى والرقاب وفي سبيل الله وابن السبيل والضيف {cite:sahih-al-bukhari-bugha p. 1207}. وتقول موسوعة TDV إن الوقف صار من منتصف القرن الثامن إلى أواخر التاسع عشر نظاماً يقوم عليه أكثر ما في المدن الإسلامية من مساجد ومدارس ومستشفيات وسُبل وعمارات {cite:tdv-vakif §history}."
  en: "A legal act in which an owner withdraws the principal of a property from sale, gift and inheritance for ever, and gives its yield to a charitable purpose. Al-Bukhari reports that Umar ibn al-Khattab acquired land at Khaybar, the most precious property he had ever owned, and consulted the Prophet, who told him: 'If you wish, hold back its principal and give it in charity.' Umar gave it on the condition that it not be sold, given away or inherited, for the poor, kin, the freeing of slaves, the way of God, the wayfarer and the guest {cite:sahih-al-bukhari-bugha p. 1207}. The TDV encyclopedia says that from the mid-eighth to the late nineteenth century waqf became the system that founded and ran most of the mosques, madrasas, hospitals, fountains and soup kitchens of Muslim cities {cite:tdv-vakif §history}."
  ur: "ایک قانونی عمل جس میں مالک کسی جائیداد کی اصل کو ہمیشہ کے لیے بیع، ہبہ اور وراثت سے روک دیتا ہے اور اس کی آمدنی کسی نیک کام کے لیے وقف کر دیتا ہے۔ امام بخاری روایت کرتے ہیں کہ عمر بن الخطاب کو خیبر میں ایک زمین ملی جو ان کے نزدیک ان کا سب سے قیمتی مال تھی، تو انہوں نے نبی سے مشورہ کیا، آپ نے فرمایا: «اگر چاہو تو اس کی اصل روک لو اور اسے صدقہ کر دو»۔ عمر نے اسے اس شرط پر صدقہ کیا کہ نہ بیچی جائے، نہ ہبہ کی جائے اور نہ وراثت میں جائے، فقیروں، رشتہ داروں، غلاموں کی آزادی، اللہ کی راہ، مسافر اور مہمان کے لیے {cite:sahih-al-bukhari-bugha p. 1207}۔ ٹی ڈی وی انسائیکلوپیڈیا کہتا ہے کہ آٹھویں صدی کے وسط سے انیسویں صدی کے آخر تک وقف وہ نظام بن گیا جس نے مسلم شہروں کی بیشتر مساجد، مدارس، ہسپتال، سبیلیں اور لنگر خانے قائم کیے اور چلائے {cite:tdv-vakif §history}۔"
