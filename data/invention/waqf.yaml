era:
  origins: first-century
  first_attested:
    edtf: "0628/0632"
    calendar: julian
    precision: year
    status: tradition
    derived: true
    note: "Al-Bukhari places Umar's endowment of his Khaybar land, and of his palm grove Thamgh, in the Prophet's lifetime, on the Prophet's instruction {cite:sahih-al-bukhari-bugha p. 1207} {cite:sahih-al-bukhari-bugha p. 1222}; no source read gives a year. The range recorded here runs from the conquest of Khaybar (7 AH) to the Prophet's death (11 AH), converted to the Julian calendar and marked derived."
    sources: [source/sahih-al-bukhari-bugha]
  status_today: living
origin:
  place: place/medina
  context:
    ar: "يروي البخاري في «باب الشروط في الوقف» أن عمر بن الخطاب أصاب أرضاً بخيبر، فأتى النبي يستشيره، وقال إنه لم يصب مالاً قط أنفس عنده منه، فقال له النبي: «إن شئت حبست أصلها وتصدقت بها» {cite:sahih-al-bukhari-bugha p. 1207}. وفي رواية أخرى أن المال نخل اسمه ثمغ، وأن النبي قال: «تصدق بأصله، لا يباع ولا يوهب ولا يورث، ولكن ينفق ثمره» {cite:sahih-al-bukhari-bugha p. 1222}، ويفسر البغا ثمغاً بأنه أرض تلقاء المدينة كانت لعمر {cite:sahih-al-bukhari-bugha p. 1223}. وتذكر موسوعة TDV أن النبي جعل أراضي له في المدينة وحصته من فدك وخيبر صدقة، وأن عثمان اشترى بئر رومة في المدينة وجعلها لعامة المسلمين، وأن خالد بن الوليد حبس سلاحه وخيله، وأن علياً وقف أرضاً وعيناً في ينبع، وأن جابر بن عبد الله قال إنه لا يعلم أحداً من المهاجرين والأنصار ذا مال إلا وقف {cite:tdv-vakif §fiqh}."
    en: "In his chapter on conditions in waqf, al-Bukhari reports that Umar ibn al-Khattab acquired land at Khaybar and came to consult the Prophet, saying he had never owned property more precious to him; the Prophet said: 'If you wish, hold back its principal and give it in charity' {cite:sahih-al-bukhari-bugha p. 1207}. Another report names the property as a palm grove called Thamgh and gives the Prophet's words as: 'Give its principal in charity: it is not to be sold, given away or inherited, but its fruit is to be spent' {cite:sahih-al-bukhari-bugha p. 1222}; al-Bugha glosses Thamgh as land facing Medina that belonged to Umar {cite:sahih-al-bukhari-bugha p. 1223}. The TDV encyclopedia adds that the Prophet made lands of his in Medina and his share of Fadak and Khaybar a sadaqa, that Uthman bought the well of Ruma in Medina and gave it to all Muslims, that Khalid ibn al-Walid endowed his weapons and horses, that Ali endowed land and a spring at Yanbu', and that Jabir ibn Abd Allah said he knew of no one among the Muhajirun and the Ansar with property who had not made a waqf {cite:tdv-vakif §fiqh}."
    ur: "امام بخاری «وقف میں شرطوں کے باب» میں روایت کرتے ہیں کہ عمر بن الخطاب کو خیبر میں ایک زمین ملی، تو وہ نبی کے پاس مشورے کے لیے آئے اور کہا کہ انہیں کبھی اس سے زیادہ قیمتی مال نہیں ملا؛ نبی نے فرمایا: «اگر چاہو تو اس کی اصل روک لو اور اسے صدقہ کر دو» {cite:sahih-al-bukhari-bugha p. 1207}۔ ایک اور روایت میں وہ مال کھجوروں کا ایک باغ ہے جس کا نام ثمغ تھا، اور نبی کے الفاظ یوں ہیں: «اس کی اصل صدقہ کر دو، نہ بیچی جائے، نہ ہبہ کی جائے، نہ وراثت میں جائے، بلکہ اس کا پھل خرچ کیا جائے» {cite:sahih-al-bukhari-bugha p. 1222}؛ البغا ثمغ کی تشریح مدینہ کے سامنے عمر کی ایک زمین سے کرتے ہیں {cite:sahih-al-bukhari-bugha p. 1223}۔ ٹی ڈی وی انسائیکلوپیڈیا مزید کہتا ہے کہ نبی نے مدینہ میں اپنی زمینیں اور فدک و خیبر میں اپنا حصہ صدقہ قرار دیا، کہ عثمان نے مدینہ میں بئرِ رومہ خرید کر سب مسلمانوں کے لیے وقف کیا، کہ خالد بن الولید نے اپنے ہتھیار اور گھوڑے وقف کیے، کہ علی نے ینبع میں ایک زمین اور ایک چشمہ وقف کیا، اور یہ کہ جابر بن عبد اللہ نے کہا کہ وہ مہاجرین و انصار میں کسی صاحبِ مال کو نہیں جانتے جس نے وقف نہ کیا ہو {cite:tdv-vakif §fiqh}۔"
makers:
  - person: person/umar-ibn-al-khattab
    role: commissioner
    place: place/medina
    note: "Al-Bukhari: Umar endowed his Khaybar land on the Prophet's advice, with the conditions that it not be sold, given away or inherited, that its yield go to the poor, kin, slaves, the way of God, the wayfarer and the guest, and that whoever administered it might eat from it reasonably without amassing wealth. He is recorded as the first endower (commissioner), not inventor: the form of the act came from the Prophet's instruction, and the Prophet is not recorded here as a maker."
    sources: [source/sahih-al-bukhari-bugha, source/tdv-vakif]
attribution:
  status: original
  claim:
    ar: "الصيغة الشرعية للوقف، أي حبس الأصل عن البيع والهبة والإرث وتسبيل غلّته على وجوه البر، ثابتة في المدينة في عهد النبي بوقف عمر بن الخطاب أرضه بخيبر."
    en: "The legal form of waqf, a principal held back from sale, gift and inheritance with its yield given to charitable purposes, is attested in Medina in the Prophet's lifetime in Umar ibn al-Khattab's endowment of his land at Khaybar."
    ur: "وقف کی شرعی صورت، یعنی اصل کو بیع، ہبہ اور وراثت سے روک کر اس کی آمدنی نیک کاموں پر خرچ کرنا، نبی کے دور میں مدینہ میں عمر بن الخطاب کے خیبر کی زمین وقف کرنے سے ثابت ہے۔"
  basis:
    ar: "حديث وقف عمر في صحيح البخاري بثلاث روايات في الشروط والوصايا، وفيه الشروط بألفاظها {cite:sahih-al-bukhari-bugha p. 1207} {cite:sahih-al-bukhari-bugha p. 1222} {cite:sahih-al-bukhari-bugha p. 1226}، ويذكر البغا أن مسلماً أخرجه في كتاب الوصية، باب الوقف {cite:sahih-al-bukhari-bugha p. 1207}. وتقول موسوعة TDV إن كلمة «وقف» لا ترد في القرآن، وإن ذلك فتح باب النقاش في أصل المؤسسة، وإن المسلمين تأثروا بالثقافات التي لقوها وأعادوا تشكيل ما أخذوه؛ ثم تقول إن الوقف من الناحية الشرعية يستند إلى عمل النبي والصحابة، وإن أحاديث الصدقة والصدقة الجارية تحمل معنى الدوام واللزوم {cite:tdv-vakif §history}. ولم يُقرأ لهذا السجل مصدر يرد الوقف إلى مؤسسة سابقة بعينها، فلا يُسجَّل هنا أصل آخر."
    en: "The hadith of Umar's waqf is in Sahih al-Bukhari in three versions, in the books of Conditions and of Bequests, with the conditions in their own words {cite:sahih-al-bukhari-bugha p. 1207} {cite:sahih-al-bukhari-bugha p. 1222} {cite:sahih-al-bukhari-bugha p. 1226}; al-Bugha notes that Muslim also has it, in the Book of Bequests, chapter on waqf {cite:sahih-al-bukhari-bugha p. 1207}. The TDV encyclopedia says the word waqf does not occur in the Qur'an, which has opened a debate on the institution's origin, and that Muslims were influenced by the cultures they met and reshaped what they took; it then says that, legally, waqf rests on the practice of the Prophet and the Companions, and that the hadiths on sadaqa and sadaqa jariya carry the ideas of permanence and binding force {cite:tdv-vakif §history}. No source read for this record traces waqf to a specific earlier institution, so no other origin is recorded here."
    ur: "عمر کے وقف کی حدیث صحیح بخاری میں شروط اور وصایا کی کتابوں میں تین روایتوں سے آئی ہے، اور اس میں شرطیں ان کے اپنے الفاظ میں ہیں {cite:sahih-al-bukhari-bugha p. 1207} {cite:sahih-al-bukhari-bugha p. 1222} {cite:sahih-al-bukhari-bugha p. 1226}؛ البغا بتاتے ہیں کہ امام مسلم نے بھی اسے کتاب الوصیہ، باب الوقف میں روایت کیا ہے {cite:sahih-al-bukhari-bugha p. 1207}۔ ٹی ڈی وی انسائیکلوپیڈیا کہتا ہے کہ لفظ وقف قرآن میں نہیں آیا، جس سے اس ادارے کی اصل پر بحث چھڑی، اور یہ کہ مسلمان جن ثقافتوں سے ملے ان سے متاثر ہوئے اور جو لیا اسے نئی شکل دی؛ پھر کہتا ہے کہ شرعی اعتبار سے وقف نبی اور صحابہ کے عمل پر قائم ہے، اور صدقہ اور صدقہ جاریہ کی احادیث میں دوام اور لزوم کا مفہوم ہے {cite:tdv-vakif §history}۔ اس ریکارڈ کے لیے پڑھا گیا کوئی مأخذ وقف کو کسی خاص سابقہ ادارے سے نہیں جوڑتا، اس لیے یہاں کوئی اور اصل درج نہیں کی گئی۔"
  perspectives: []
precursors:
  - external:
      ar: "الإنفاق في سبيل الله والصدقة في القرآن والسنة"
      en: "Spending in the way of God and charity in the Qur'an and the Sunna"
      ur: "قرآن و سنت میں اللہ کی راہ میں خرچ اور صدقہ"
    note: "TDV: the word waqf is not in the Qur'an, but the Qur'an has ideas that could give rise to such an institution and that the waqf literature repeats: spending in the way of God (al-Baqara 2:195, 261), helping one another in goodness (al-Ma'ida 5:2) and vying in good works (al-Baqara 2:148; Al Imran 3:114). The hadiths on sadaqa and sadaqa jariya, cited in almost every waqf deed, gave it permanence and binding force. Verses are referenced only, not quoted."
    sources: [source/tdv-vakif]
dependents:
  - external:
      ar: "ديوان الأحباس الأموي وديوان البر العباسي"
      en: "The Umayyad diwan of ahbas and the Abbasid diwan of birr"
      ur: "اموی دیوان الاحباس اور عباسی دیوان البر"
    note: "TDV: the Umayyads in Egypt set up a central office called the Diwan al-ahbas to oversee waqfs, thought to be the first of its kind in Islamic history; a similar office followed in Basra, and under the Abbasids a special body in Iraq called the Diwan al-birr oversaw waqfs and charities."
    sources: [source/tdv-vakif]
  - external:
      ar: "أقدم وقفية معروفة لأرض زراعية في مصر ⁦(307هـ/919م)⁩"
      en: "The oldest known deed endowing farmland in Egypt (307/919)"
      ur: "مصر میں زرعی زمین کے وقف کی سب سے پرانی معلوم دستاویز ⁦(307ھ/919ء)⁩"
    note: "TDV, citing Ibn Duqmaq: in early times mosque staff were paid from the treasury; the oldest known document turning farmland in Egypt into a charitable waqf is an Abbasid-era deed dated 307 (919)."
    sources: [source/tdv-vakif]
  - external:
      ar: "المدارس الوقفية من السلاجقة والنظامية فصاعداً"
      en: "The waqf madrasa, from the Seljuks and the Nizamiyya onwards"
      ur: "سلجوقیوں اور نظامیہ سے آگے وقفی مدارس"
    note: "TDV: through waqf the madrasas gained scholarly, administrative and financial autonomy; from the Seljuks onwards, beginning with the Nizamiyya madrasas, many madrasas across the Muslim world and especially in the Ottoman state were founded as waqfs that paid teachers, staff and students. Al-Maqrizi counted 158 waqf madrasas and mosques in Cairo in 1436."
    sources: [source/tdv-vakif]
  - external:
      ar: "العمارات والمستشفيات والسبل والخيرات الوقفية"
      en: "Waqf soup kitchens, hospitals, fountains and public works"
      ur: "وقفی لنگر خانے، ہسپتال، سبیلیں اور رفاہی کام"
    note: "TDV: waqf founded hospitals and asylums, imarets that fed the poor (500–1,000 people a day at each Istanbul complex, more than 30,000 a day in Istanbul in the eighteenth century, after D'Ohsson), fountains, roads and bridges; Ibn Battuta at Damascus in 726/1326 listed waqfs for sending people on pilgrimage, dowries for poor brides, freeing captives, feeding travellers and paving streets; 2,529 people worked in the fourteen imaret complexes built by Mimar Sinan."
    sources: [source/tdv-vakif]
  - external:
      ar: "وقف النقود العثماني وفتوى أبي السعود (1548)"
      en: "The Ottoman cash waqf and Ebussuud's fatwa (1548)"
      ur: "عثمانی نقدی وقف اور ابو السعود کا فتویٰ ⁦(1548ء)⁩"
    note: "TDV: classical Hanafis did not accept a waqf of money, though a permissive view is attributed to Zufar; after the shaykh al-Islam Ebussuud (Abu al-Su'ud) issued a fatwa and order in 1548 permitting it, the cash waqf became an official, binding practice in the Ottoman state."
    sources: [source/tdv-vakif]
  - external:
      ar: "نظارة الأوقاف العثمانية (1826) ووزارات الأوقاف الحديثة"
      en: "The Ottoman Ministry of Imperial Waqfs (1826) and modern ministries of awqaf"
      ur: "عثمانی نظارتِ اوقاف ⁦(1826ء)⁩ اور جدید وزارتِ اوقاف"
    note: "TDV: the Ottoman state set up the Evkaf-ı Hümayun Nezareti in October 1826 to bring the major waqfs under central control; in Egypt Abbas Hilmi I created a waqf administration in 1851 that Khedive Isma'il raised to a ministry in 1864; the British abolished it in 1884 and Lord Kitchener reformed waqf administration in 1913; in Turkey the Şer'iyye ve Evkaf Vekaleti of 1921 was abolished on 3 March 1924 and the waqf administration joined the state of the Republic."
    sources: [source/tdv-vakif]
spread: []
impact:
  fields: [institutions-systems, everyday-life]
  changed:
    ar: "صار للخير في المدينة الإسلامية مال لا ينفد: أصل لا يباع ولا يورث، وغلّة تذهب كل عام إلى الوجه الذي سمّاه الواقف، فقامت به المساجد والمدارس والمستشفيات والسبل والعمارات والجسور، ودُفعت منه رواتب المدرسين والأطباء والطلاب، دون أن تحمله خزينة الدولة {cite:tdv-vakif §history}."
    en: "Charity in the Muslim city gained a fund that did not run out: a principal that could not be sold or inherited, and a yield that went each year to the purpose the founder had named. Mosques, madrasas, hospitals, fountains, soup kitchens and bridges were built and run on it, and teachers, physicians and students were paid from it, without the state treasury bearing the cost {cite:tdv-vakif §history}."
    ur: "مسلم شہر میں خیرات کو ایک نہ ختم ہونے والا سرمایہ مل گیا: ایسی اصل جو نہ بیچی جا سکتی تھی نہ وراثت میں جا سکتی تھی، اور ایسی آمدنی جو ہر سال اس مقصد پر خرچ ہوتی جو واقف نے مقرر کیا تھا۔ مساجد، مدارس، ہسپتال، سبیلیں، لنگر خانے اور پل اسی سے بنے اور چلے، اور اساتذہ، طبیبوں اور طلبہ کی تنخواہیں اسی سے ادا ہوئیں، ریاستی خزانے پر بوجھ ڈالے بغیر {cite:tdv-vakif §history}۔"
  history:
    ar: "تقول موسوعة TDV إن الوقف كان شديد الأثر في الحياة الاجتماعية والاقتصادية والثقافية لكل البلاد الإسلامية من منتصف القرن الثامن إلى أواخر التاسع عشر، وإن ميزانية الأوقاف العثمانية بلغت ثلث ميزانية الدولة، وإن أكثرها زال مع تبدل الدول لكن جزءاً مهماً منها بقي إلى القرن العشرين بل إلى اليوم {cite:tdv-vakif §history}."
    en: "The TDV encyclopedia says waqf shaped the social, economic and cultural life of every Muslim land from the mid-eighth to the late nineteenth century, that the budget of the Ottoman waqfs reached a third of the state budget, and that while most waqfs disappeared as states changed, a significant part lasted into the twentieth century and to the present day {cite:tdv-vakif §history}."
    ur: "ٹی ڈی وی انسائیکلوپیڈیا کہتا ہے کہ وقف نے آٹھویں صدی کے وسط سے انیسویں صدی کے آخر تک ہر مسلم ملک کی سماجی، معاشی اور ثقافتی زندگی کو گہرا متاثر کیا، کہ عثمانی اوقاف کا بجٹ ریاستی بجٹ کے ایک تہائی تک پہنچ گیا، اور یہ کہ ریاستوں کے بدلنے سے اکثر اوقاف ختم ہو گئے مگر ایک اہم حصہ بیسویں صدی بلکہ آج تک باقی رہا {cite:tdv-vakif §history}۔"
  significance: 5
  why: "A legal form, attested in Medina in the Prophet's lifetime, that let private owners create permanent public funds; for more than a thousand years it built and paid for most of the mosques, schools, hospitals and public works of Muslim cities, and it still operates today."
