kids:
  ar: "كان لعمر بن الخطاب بستان في خيبر يحبه كثيراً، فسأل النبي ماذا يصنع به. قال له النبي: احتفظ بالأرض نفسها، وأعطِ ثمرها للمحتاجين. فكتب عمر أن الأرض لا تباع ولا توهب ولا تورث، وأن ثمرها للفقراء والمسافرين والضيوف. هذا هو الوقف. وبهذه الفكرة بنى الناس بعد ذلك مدارس ومستشفيات ونوافير ومطابخ تطعم الجائعين، وبقي بعضها يعمل مئات السنين."
  en: "Umar ibn al-Khattab had a piece of land at Khaybar that he loved very much, and he asked the Prophet what to do with it. The Prophet told him: keep the land itself, and give away what it grows. So Umar set down that the land could never be sold, given away or inherited, and its harvest would go to the poor, travellers and guests. That is a waqf. With this idea, people later built schools, hospitals, fountains and kitchens that fed the hungry, and some kept working for hundreds of years."
  ur: "عمر بن الخطاب کے پاس خیبر میں ایک زمین تھی جو انہیں بہت پیاری تھی، تو انہوں نے نبی سے پوچھا کہ اس کا کیا کریں۔ نبی نے فرمایا: زمین اپنے پاس رکھو اور اس کی پیداوار دے دو۔ تو عمر نے طے کیا کہ یہ زمین کبھی بیچی نہیں جائے گی، نہ تحفے میں دی جائے گی، نہ وراثت میں جائے گی، اور اس کی فصل غریبوں، مسافروں اور مہمانوں کو ملے گی۔ یہی وقف ہے۔ اسی خیال سے بعد میں لوگوں نے اسکول، ہسپتال، سبیلیں اور بھوکوں کو کھلانے والے باورچی خانے بنائے، اور ان میں سے کچھ سینکڑوں سال چلتے رہے۔"
