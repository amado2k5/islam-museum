id: invention/balance-of-wisdom
class: invention
label: { ar: "ميزان الحكمة عند الخازني", en: "Al-Khazini's balance of wisdom", ur: "الخازنی کا میزان الحکمہ" }
names:
  - { value: "الميزان الجامع", kind: alternate, lang: ar }
  - { value: "Mizan al-hikma", kind: alternate, lang: en }
summary:
  ar: "ميزان مائي دقيق وصفه عبد الرحمن الخازني في515/1121–1122 لخزانة سنجر بمرو؛ تحسين لموازين سابقة، وخاصة معايرة العارضة لمواد وسوائل مختلفة، لا اختراع الوزن أو الطفو {cite:khazini-hall-dsb Kitab Mizan al-Hikma; Al-Khazini and the Science of Weights in Islam}."
  en: "A refined hydrostatic balance described in515/1121–1122 for Sanjar's treasury at Merv, particularly improving beam calibration for different substances and liquids; not invention of weighing or buoyancy {cite:khazini-hall-dsb Kitab Mizan al-Hikma; Al-Khazini and the Science of Weights in Islam}."
  ur: "مرو میں سنجر کے خزانے کے لیے515/1121–1122 میں بیان کردہ بہتر آبی میزان، خصوصاً مختلف مادوں اور مائعات کے لیے ڈنڈی کی درجہ بندی؛ وزن یا اچھال کی ایجاد نہیں {cite:khazini-hall-dsb Kitab Mizan al-Hikma; Al-Khazini and the Science of Weights in Islam}۔"
domain: optics-physics
