kids:
  ar: "تخيل جسمين متساويين في الوزن لكنهما مختلفان في الحجم. حين يغمران في الماء يختلف مقدار ما يسنده الماء منهما. استعمل الميزان هذه المقارنة لمعرفة المواد؛ الرسم القديم دليل على التصميم، لا صورة آلة باقية."
  en: "Imagine two objects of equal weight but different volume. Water supports them by different amounts. The balance used that comparison to investigate materials; the old drawing records a design, not surviving hardware."
  ur: "برابر وزن مگر الگ حجم کی دو چیزیں سوچیں۔ پانی انہیں مختلف مقدار میں سہارا دیتا ہے۔ میزان نے اسی موازنے سے مادے پرکھے؛ پرانا خاکہ ڈیزائن کی شہادت ہے، باقی اصل آلے کی تصویر نہیں۔"
