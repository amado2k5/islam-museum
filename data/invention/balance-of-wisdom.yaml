impact:
  fields: [optics-physics, materials-industry]
  changed:
    ar: "ربط فحص المعادن والأحجار بالوزن في الهواء والسائل ومواضع كفف معايرة؛ تحليل سبيكة ثنائية يفترض معرفة المكونين وتقارب جمع الحجوم {cite:khazini-hall-dsb The Balance of Wisdom}."
    en: "Related metal and gem testing to air/liquid weighing and calibrated pan positions; binary-alloy analysis assumes known constituents and approximately additive volumes {cite:khazini-hall-dsb The Balance of Wisdom}."
    ur: "دھات و جواہر کی جانچ کو ہوا و مائع میں وزن اور درجہ بند پلڑوں کے مقامات سے جوڑا؛ دو جزوی آمیزے میں معلوم اجزا اور تقریباً جمع پذیر حجم فرض ہیں {cite:khazini-hall-dsb The Balance of Wisdom}۔"
  history:
    ar: "حفظ الكتاب أوصافاً ونصوصاً لعلم الوزن السابق، واستُخدم في موسوعات لاحقة؛ لا يثبت هول مدرسة مستمرة من صناع هذا الميزان {cite:khazini-hall-dsb Al-Khazini and the Science of Weights in Islam}."
    en: "Preserved earlier weighing texts and designs and supplied later encyclopedias; Hall does not establish a continuing school of instrument practitioners {cite:khazini-hall-dsb Al-Khazini and the Science of Weights in Islam}."
    ur: "پہلے علم وزن کے متون و آلات محفوظ کیے اور بعد کی موسوعات کا ماخذ بنا؛ ہال مسلسل کاریگر مکتب ثابت نہیں کرتے {cite:khazini-hall-dsb Al-Khazini and the Science of Weights in Islam}۔"
  significance: 4
  why: "A detailed, historically contextualized instrument treatise uniting calibration, hydrostatic testing and earlier technical literature; sensitivity claims remain attributed and direct modern transmission unproved."
