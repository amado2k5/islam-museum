    note: "Further refinement and calibration of inherited hydrostatic balances. Muslim basis is the author's own preface; Sunni is the explicitly labelled museum default, not personal school attestation."
    sources: [source/khazini-hall-dsb, source/khazini-khanikoff-1859]
attribution:
  status: improvement
  claim:
    ar: "تحسين ميزان مائي سابق ومعايرته، لا أول ميزان ذي خمس كفف ولا أول نظرية للثقل."
    en: "Refinement and calibration of an earlier hydrostatic balance, not the first five-pan balance or theory of weight."
    ur: "پہلے آبی میزان کی بہتری اور درجہ بندی، پانچ پلڑوں کے پہلے میزان یا ثقل کے نظریے کی ایجاد نہیں۔"
  basis:
    ar: "ينسب هول اللسان إلى الرازي والكفتين المتحركتين إلى الإسفزاري، ثم يرجح أن تحسين الخازني تركز في علامات الكثافة لمواد وسوائل مرجعية متعددة {cite:khazini-hall-dsb Al-Khazini and the Science of Weights in Islam}."
    en: "Hall credits the indicator tongue to al-Razi and movable pans to al-Asfizari, identifying al-Khazini's further work chiefly with calibration marks for substances and multiple reference liquids {cite:khazini-hall-dsb Al-Khazini and the Science of Weights in Islam}."
    ur: "ہال اشارے کی زبان رازی اور متحرک پلڑے اسفزاری سے منسوب کرتے ہیں؛ الخازنی کا مزید کام بالخصوص مادوں اور متعدد مرجعی مائعات کے نشانات تھا {cite:khazini-hall-dsb Al-Khazini and the Science of Weights in Islam}۔"
  perspectives: []
