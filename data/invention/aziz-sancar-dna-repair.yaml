summary:
  ar: "الخريطة الجزيئية لآلية إصلاح الاستئصال النوكليوتيدي التي رسمها عالم الكيمياء الحيوية التركي-الأمريكي عزيز سانجار: الآلية التي تصلح بها الخلايا ضرر الأشعة فوق البنفسجية في الحمض النووي، إذ يقطع إنزيم UvrABC خيطاً من 12-13 نوكليوتيداً يشمل الجزء المتضرر ثم يُعاد بناؤه؛ وخللها يُسبب سرطان الجلد عند التعرض للشمس. نال عنها مع توماس ليندال وبول مودريتش جائزة نوبل في الكيمياء 2015 «لدراسات آلية إصلاح الحمض النووي» {cite:nobelprize-chemistry-2015-press-release} {cite:wikipedia-aziz-sancar-en}."
  en: "The molecular map of nucleotide excision repair drawn by the Turkish-American biochemist Aziz Sancar: the mechanism by which cells repair ultraviolet damage to DNA, in which the UvrABC enzyme cuts twice on the damaged strand, removing a stretch of 12-13 nucleotides carrying the damaged part before it is rebuilt; defects in it cause skin cancer on exposure to sunlight. He shared the 2015 Nobel Prize in Chemistry with Tomas Lindahl and Paul Modrich 'for mechanistic studies of DNA repair' {cite:nobelprize-chemistry-2015-press-release} {cite:wikipedia-aziz-sancar-en}."
  ur: "ترکی نژاد امریکی ماہرِ حیاتیاتی کیمیا عزیز سنجر کا بنایا نیوکلیوٹائیڈ ایکسیزن مرمت کا جزویاتی نقشہ: وہ طریقہ جس سے خلیے ڈی این اے کا بالائے بنفشی نقصان ٹھیک کرتے ہیں، جس میں UvrABC خامرہ خراب رشتے پر دو بار کٹ لگا کر خراب حصے سمیت 12-13 نیوکلیوٹائیڈ کا ٹکڑا نکال دیتا ہے اور پھر اسے دوبارہ بنایا جاتا ہے؛ اس میں خرابی دھوپ میں سرطانِ جلد پیدا کرتی ہے۔ اس کام پر انہیں ٹوماس لنڈال اور پال موڈرچ کے ساتھ 2015 کا کیمسٹری نوبل ملا «ڈی این اے مرمت کی طریقیاتی تحقیق پر» {cite:nobelprize-chemistry-2015-press-release} {cite:wikipedia-aziz-sancar-en}۔"
  es: "El mapa molecular de la reparación por escisión de nucleótidos, dibujado por el bioquímico turco-estadounidense Aziz Sancar: el mecanismo por el cual las células reparan el daño ultravioleta al ADN, en el que la enzima UvrABC corta dos veces la hebra dañada, eliminando un segmento de 12 a 13 nucleótidos que contiene la parte dañada antes de que se reconstruya; los defectos en este mecanismo causan cáncer de piel al exponerse a la luz solar. Compartió el Premio Nobel de Química de 2015 con Tomas Lindahl y Paul Modrich \"por estudios mecanísticos de la reparación del ADN\" {cite:nobelprize-chemistry-2015-press-release} {cite:wikipedia-aziz-sancar-en}."
  fr: "La carte moléculaire de la réparation par excision de nucléotides, établie par le biochimiste turco-américain Aziz Sancar, décrit le mécanisme par lequel les cellules réparent les dommages causés à l'ADN par les ultraviolets. Ce mécanisme implique que l'enzyme UvrABC coupe deux fois le brin endommagé, éliminant une séquence de 12 à 13 nucléotides portant la partie endommagée avant sa reconstruction. Des anomalies dans ce mécanisme provoquent des cancers de la peau suite à une exposition au soleil. Il a partagé le prix Nobel de chimie 2015 avec Tomas Lindahl et Paul Modrich « pour leurs travaux sur les mécanismes de réparation de l'ADN »."
  tr: "Türk-Amerikalı biyokimyacı Aziz Sancar tarafından çizilen nükleotid eksizyon onarım mekanizmasının moleküler haritası, hücrelerin DNA'daki ultraviyole (UV) hasarını nasıl onardığını ortaya koyuyor. UvrABC enzimi, hasarlı bölümü içeren 12-13 nükleotidlik bir zinciri keser ve ardından yeniden oluşturur. Bu mekanizmanın bozulması, güneş ışığına maruz kalındığında cilt kanserine neden olur. Bu çalışması nedeniyle, Thomas Lindahl ve Paul Modrich ile birlikte 2015 Nobel Kimya Ödülü'ne \"DNA onarım mekanizması üzerine araştırmaları\" nedeniyle layık görüldü."
  id: "Peta molekuler mekanisme perbaikan eksisi nukleotida, yang digambar oleh ahli biokimia Turki-Amerika Aziz Sancar, mengungkapkan bagaimana sel memperbaiki kerusakan DNA akibat sinar ultraviolet (UV). Enzim UvrABC memotong untai 12-13 nukleotida yang mengandung bagian yang rusak dan kemudian merekonstruksinya. Gangguan pada mekanisme ini menyebabkan kanker kulit akibat paparan sinar matahari. Atas karya ini, ia, bersama dengan Thomas Lindahl dan Paul Modrich, dianugerahi Hadiah Nobel Kimia tahun 2015 \"untuk penelitian tentang mekanisme perbaikan DNA.\""
