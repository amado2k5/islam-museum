kids:
  ar: "كل يوم تتكسّر قطع من الحمض النووي في خلايانا بسبب الشمس وغيرها، لكن عندنا عمال صغار غير مرئيين — إنزيمات — يقصّون القطعة المكسورة ويصلحونها. عزيز سانجار عالم تركي مسلم اكتشف كيف يعمل هؤلاء العمال خطوة بخطوة، فنال جائزة نوبل سنة 2015."
  en: "Every day, sunlight and other things break little pieces of the DNA inside our cells, but we have tiny invisible workers — enzymes — that snip out the broken piece and fix it. Aziz Sancar, a Muslim scientist from Turkey, discovered exactly how these workers do their job step by step, and he won the Nobel Prize in 2015."
