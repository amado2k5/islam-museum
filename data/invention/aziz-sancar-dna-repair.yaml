    ur: "اس نے ظاہر کیا کہ ڈی این اے روز ہزاروں بار خراب ہوتا ہے اور ہمارے خلیے اسے بلا رکاوٹ ٹھیک کرنے والا جزویاتی اوزار خانہ رکھتے ہیں — زندہ خلیے کی سمجھ بدلی اور سرطان کے نئے علاجوں کی بنیاد رکھی {cite:nobelprize-chemistry-2015-press-release}۔"
  history:
