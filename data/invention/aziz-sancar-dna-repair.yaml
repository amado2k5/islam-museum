  context:
    ar: "مختبر دين روب في جامعة ييل ثم جامعة نورث كارولاينا في تشابل هيل: سانجار — طبيب من ساوور بماردين وصل إلى الولايات المتحدة طالباً — عمل في ييل خمس سنوات فنّد فيها تفاصيل الاستئصال النوكليوتيدي في البكتيريا، ثم في تشابل هيل كشف خطواتها اللاحقة ونسختها الأعقد في الإنسان {cite:wikipedia-aziz-sancar-en}."
    en: "Dean Rupp's laboratory at Yale and then the University of North Carolina at Chapel Hill: Sancar — a physician from Savur in Mardin who had come to the United States as a student — worked at Yale for five years elucidating nucleotide excision repair in bacteria, then at Chapel Hill uncovered its following steps and its more complex human version {cite:wikipedia-aziz-sancar-en}."
    ur: "ییل میں ڈین رپ کی لیبارٹری اور پھر نارتھ کیرولائنا یونیورسٹی، چیپل ہل: سنجر — ماردین کے ساوور کا ڈاکٹر جو طالب علم بن کر امریکہ آیا — ییل میں پانچ برس بیکٹیریا کی نیوکلیوٹائیڈ ایکسیزن مرمت کی تفصیلات واضح کرتا رہا، پھر چیپل ہل میں اس کے اگلے مراحل اور انسانی پیچیدہ شکل کھولی {cite:wikipedia-aziz-sancar-en}۔"
