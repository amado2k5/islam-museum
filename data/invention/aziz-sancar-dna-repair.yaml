  claim:
    ar: "ينسب بيان نوبل إلى سانجار رسمَ آلية إصلاح الاستئصال النوكليوتيدي على المستوى الجزيئي؛ فالظاهرة ⁦(تعافي البكتيريا بالضوء الأزرق وإصلاح UV)⁩ كانت معروفة قبله، والموثق له هو التفكيك الآلي للإنزيمات والجينات {cite:nobelprize-chemistry-2015-press-release} {cite:wikipedia-aziz-sancar-en}."
    en: "The Nobel release credits Sancar with mapping the nucleotide excision repair mechanism at a molecular level; the phenomenon itself — bacteria recovering under blue light and UV damage being repaired — was known before him, and the documented contribution is the mechanistic dissection of the enzymes and genes {cite:nobelprize-chemistry-2015-press-release} {cite:wikipedia-aziz-sancar-en}."
    ur: "نوبل پریس ریلیز سنجر کو نیوکلیوٹائیڈ ایکسیزن مرمت کا جزویاتی نقشہ بنانے کا سہرا دیتی ہے؛ خود مظہر — نیلی روشنی میں بیکٹیریا کا صحت یاب ہونا اور UV نقصان کی مرمت — پہلے سے معلوم تھا، اور مستند حصہ خامروں اور جینز کی طریقیاتی تشریح ہے {cite:nobelprize-chemistry-2015-press-release} {cite:wikipedia-aziz-sancar-en}۔"
  basis:
    ar: "نص البيان: «لدراسات آلية إصلاح الحمض النووي»، ويخصّ سانجار بأنه «رسم إصلاح الاستئصال النوكليوتيدي» ويشرح عاقبة خلله ⁦(سرطان الجلد في الشمس)⁩؛ وتفصّل السيرة دوره في مختبر روب والقَطع المزدوج على الخيط المتضرر {cite:nobelprize-chemistry-2015-press-release} {cite:wikipedia-aziz-sancar-en}."
    en: "The release's own words — 'for mechanistic studies of DNA repair' — single out Sancar as the one who 'mapped nucleotide excision repair' and explain the consequence of its defects ⁦(skin cancer in sunlight)⁩; the biography details his role in Rupp's lab and the double incision on the damaged strand {cite:nobelprize-chemistry-2015-press-release} {cite:wikipedia-aziz-sancar-en}."
    ur: "ریلیز کے اپنے الفاظ — «ڈی این اے مرمت کی طریقیاتی تحقیق پر» — سنجر کو «نیوکلیوٹائیڈ ایکسیزن مرمت کا نقشہ بنانے والا» قرار دیتی ہیں اور خرابی کا نتیجہ ⁦(دھوپ میں سرطانِ جلد)⁩ سمجھاتی ہیں؛ سوانح رپ کی لیبارٹری میں ان کے کردار اور خراب رشتے پر دوہرے کٹ کی تفصیل دیتی ہے {cite:nobelprize-chemistry-2015-press-release} {cite:wikipedia-aziz-sancar-en}۔"
