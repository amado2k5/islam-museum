impact:
  fields: [medicine-surgery, institutions-systems]
  changed:
    ar: "نقل التأريخ للعلم من قصص متفرقة إلى ترتيب منهجي بالطبقات، يثبت لكل طبيب اسمه وشيوخه وكتبه {cite:encyclopaedia-of-islam-2}."
    en: "Moved the history of learning from scattered anecdotes into a methodical arrangement by classes, fixing each physician's name, teachers and books {cite:encyclopaedia-of-islam-2}."
    ur: "علم کی تاریخ کو بکھری حکایتوں سے طبقاتی منظم ترتیب میں بدلا، ہر طبیب کا نام، اساتذہ اور کتب مثبت کرتے ہوئے {cite:encyclopaedia-of-islam-2}۔"
  history:
    ar: "حفظ أسماء أطباء أندلسيين وعرب لم تبقَ أخبارهم إلا فيه، فصار مصدراً لا غنى عنه في تاريخ الطب {cite:encyclopaedia-of-islam-2} {cite:tabaqat-ibn-juljul-sayyid-1955}."
    en: "Preserved the names of Andalusi and eastern physicians whose record survives nowhere else, making it an indispensable source for the history of medicine {cite:encyclopaedia-of-islam-2} {cite:tabaqat-ibn-juljul-sayyid-1955}."
    ur: "ان اندلسی اور مشرقی اطباء کے نام محفوظ کیے جن کی خبریں کہیں اور باقی نہیں، اس لیے یہ تاریخِ طب کا ناگزیر ماخذ بنا {cite:encyclopaedia-of-islam-2} {cite:tabaqat-ibn-juljul-sayyid-1955}۔"
  significance: 4
  why: "The earliest extant work of the physicians-biography genre and a unique witness for Andalusi medicine; originality is genre-level and its ancient part is acknowledged transmission."
