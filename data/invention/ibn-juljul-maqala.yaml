summary:
  ar: "أقدم معجم تراجم للأطباء باقٍ في التراث الإسلامي: ألّفه الطبيب الأندلسي سليمان بن حسان بن جلجل بقرطبة نحو سنة 377هـ/987م، فرتّب أطباء اليونان والإسلام في طبقات مع تراجمهم ومؤلفاتهم، مستنداً في القسم القديم إلى تاريخ إسحاق بن حنين في الأطباء {cite:encyclopaedia-of-islam-2} {cite:tabaqat-ibn-juljul-sayyid-1955}."
  en: "The earliest surviving biographical dictionary of physicians in the Islamic tradition: the Andalusi physician Sulayman ibn Hassan Ibn Juljul composed it at Cordoba around 377 AH/987 CE, arranging the physicians of Greece and Islam in classes with their biographies and works, drawing for the ancient part on Ishaq ibn Hunayn's history of physicians {cite:encyclopaedia-of-islam-2} {cite:tabaqat-ibn-juljul-sayyid-1955}."
  ur: "اسلامی روایت میں اطباء کی تراجم کا قدیم ترین باقی ماندہ معجم: اندلسی طبیب سلیمان بن حسان ابن جلجل نے اسے قرطبہ میں تقریباً 377ھ/987ء میں تصنیف کیا، جس میں یونان اور اسلام کے اطباء طبقات میں تراجم اور تصانیف سمیت مرتب ہیں؛ قدیم حصے کے لیے اسحاق بن حنین کی تاریخ الاطباء سے استفادہ {cite:encyclopaedia-of-islam-2} {cite:tabaqat-ibn-juljul-sayyid-1955}۔"
  es: "El diccionario biográfico de médicos más antiguo que se conserva en la tradición islámica: el médico andalusí Sulayman ibn Hassan Ibn Juljul lo compuso en Córdoba alrededor del año 377 AH/987 d. C., organizando a los médicos de Grecia e Islam en clases con sus biografías y obras, basándose para la parte antigua en la historia de los médicos de Ishaq ibn Hunayn {cite:encyclopaedia-of-islam-2} {cite:tabaqat-ibn-juljul-sayyid-1955}."
  fr: "Le plus ancien dictionnaire biographique de médecins de tradition islamique qui nous soit parvenu: le médecin andalou Sulayman ibn Hassan Ibn Juljul l'a composé à Cordoue vers 377 AH/987 CE, classant les médecins de Grèce et d'Islam en catégories avec leurs biographies et leurs œuvres, s'appuyant pour la partie ancienne sur l'histoire des médecins d'Ishaq ibn Hunayn {cite:encyclopaedia-of-islam-2} {cite:tabaqat-ibn-juljul-sayyid-1955}."
