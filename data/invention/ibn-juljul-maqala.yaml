attribution:
  status: original
  claim:
    ar: "أقدم معجم باقٍ يجمع تراجم الأطباء في طبقات من اليونان إلى أطباء عصره بالأندلس؛ لا أول ترجمة في التاريخ لكنه أقدم ما وصلنا من جنسه."
    en: "The earliest surviving dictionary collecting physicians' biographies in classes from the Greeks to his own Andalusi contemporaries — not the first biography ever written, but the earliest extant work of its genre."
    ur: "یونانیوں سے اپنے عہد کے اندلسی اطباء تک تراجم جمع کرنے والا قدیم ترین باقی ماندہ معجم — تاریخ کی پہلی سوانح نہیں، مگر اپنے صنف کی قدیم ترین باقی ماندہ کتاب۔"
  basis:
    ar: "تصفه دائرة المعارف الإسلامية بأنه أقدم معجم أطباء باقٍ وصلنا، واعتمد قسمه القديم على تاريخ إسحاق بن حنين فهو أيضاً شاهد نقل {cite:encyclopaedia-of-islam-2}."
    en: "The Encyclopaedia of Islam describes it as the earliest surviving physicians' dictionary to reach us; its ancient part depends on Ishaq ibn Hunayn's history, so it is also a witness of transmission {cite:encyclopaedia-of-islam-2}."
    ur: "دائرۃ المعارف اسلامیہ اسے ہم تک پہنچنے والا قدیم ترین باقی ماندہ معجمِ اطباء قرار دیتی ہے؛ اس کا قدیم حصہ اسحاق بن حنین کی تاریخ پر مبنی ہے، اس لیے یہ نقل کی گواہی بھی ہے {cite:encyclopaedia-of-islam-2}۔"
  perspectives: []
