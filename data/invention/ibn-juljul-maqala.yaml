kids:
  ar: "تخيّل أنك تكتب دفتراً فيه صفحة عن كل طبيب عرفته أو سمعت به: اسمه، من علّمه، وماذا كتب. فعل ابن جلجل هذا قبل أكثر من ألف سنة في قرطبة، فرتّب أطباء اليونان القدامى ثم أطباء الإسلام حتى أطباء مدينته في طبقات. بفضل دفتره نعرف اليوم أسماء أطباء كانوا سيُنسون لولاه."
  en: "Imagine writing a notebook with a page about every doctor you knew or heard of: their name, who taught them, and what they wrote. Ibn Juljul did this more than a thousand years ago in Cordoba, arranging the ancient Greek doctors and then the doctors of Islam up to his own city in classes. Because of his notebook we still know the names of doctors who would otherwise be forgotten."
  ur: "سوچو کہ تم ایک ڈائری لکھتے ہو جس میں ہر طبیب کے بارے میں ایک صفحہ ہو: نام، کس نے پڑھایا، اور کیا لکھا۔ ابن جلجل نے یہی کام ہزار سے زیادہ برس پہلے قرطبہ میں کیا؛ قدیم یونانی اطباء، پھر اسلام کے اطباء، اس کے اپنے شہر تک، طبقات میں مرتب کیے۔ اسی ڈائری کی بدولت آج ہم ان اطباء کے نام جانتے ہیں جو ورنہ بھولے جاتے۔"
