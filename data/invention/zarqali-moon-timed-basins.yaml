era:
  origins: middle-period
  first_attested:
    edtf: "1133~"
    hijri: "0528"
    calendar: julian
    precision: year
    status: debated
    note: "The cited account reports one basin lifted and both stopped in 528 AH (about 1133-1134 CE) after the device had worked through Toledo's Muslim period; no source fixes a construction year, so the documented terminus is recorded as the attestation window rather than an invented origin date."
    sources: [source/nafh-tib-maqqari]
  status_today: extinct
origin:
  place: place/tulaytula
  context:
    ar: "طليطلة في عهد المسلمين على نهر تاجة؛ المدينة سقطت من أيدي المسلمين سنة 478هـ/1085م وبقيت البيلتان تعمل بعدها نحو نصف قرن حتى 528هـ على ما تروي المقري {cite:nafh-tib-maqqari p. 242-244}. لا يوجد في المتحف سجل بوليتي لملوك طليطلة الطائفية، فيبقى المكان والإقليم محددين دون اختلاق حكم."
    en: "Muslim Toledo on the Tagus; the city fell from Muslim hands in 478 AH / 1085 CE and the basins are reported working on for nearly half a century until 528 AH, per al-Maqqari {cite:nafh-tib-maqqari p. 242-244}. The museum holds no polity record for the Toledo taifa kings, so place and region are fixed without inventing a ruler."
    ur: "تاجہ دریا پر مسلمان طلیطلہ؛ شہر 478ھ/1085ء میں نصارا کے ہاتھوں سے نکلا اور حوض مقری کے بیان کے طور پر مزید تقریباً آدھی صدی 528ھ تک کام کرتے رہے {cite:nafh-tib-maqqari p. 242-244}۔ میوزیم کے پاس طلیطلہ کی طائفی سلطنت کا کوئی ریکارڈ نہیں، اس لیے مقام اور علاقہ متعین ہیں بغیر کسی حاکم کو گھڑنے کے۔"
makers:
  - person: person/al-zarqali
    role: inventor
    note: "Named 'Abd al-Rahman' in al-Maqqari's account, identified as Abu al-Qasim Abd al-Rahman al-Zarqali in the Rabat manuscript note; a late-compendium attribution, not a contemporary construction record. His Muslim identity is documented on the existing person record."
    sources: [source/nafh-tib-maqqari, source/zarqali-mactutor, source/bibalex-astrolabe-949]
attribution:
  status: contested
  claim:
    ar: "تنسب البيلتان إلى الزرقالي في نسخة المخطوط؛ لكن الرواية متأخرة جامعة تنقل عن مصادر مفقودة، وفيها رواية منافسة تلقي الصنعة على منجم يهودي."
    en: "The basins are credited to al-Zarqali in the manuscript tradition; but the account is a late compendium citing lost earlier sources, and it carries a rival report assigning the work to a Jewish astrologer."
    ur: "حوضوں کو مخطوطے کی روایت میں زرقالی سے منسوب کیا گیا؛ مگر یہ بیان ایک دیرینہ جامع کتاب کا ہے جو کھوئی ہوئی سابق روایات پر ٹکی ہے، اور اس میں ایک حریف روایت یہودی منجم پر الزام ڈالتی ہے۔"
  basis:
    ar: "ينقل المقري في النفح أن بيلتا صنعهما عبد الرحمن سمعاً بخبر طلسم أرين بالهند، وأن حاشية في نسخة الرباط تعين هذا عبد الرحمن بأبي القاسم عبد الرحمن الزرقالي {cite:nafh-tib-maqqari p. 242-244}. لكن المقري نفسه ينقل رواية أخرى تجعل سبب الفساد منجمًا يهوديًا اسمه حتين بن ربوة جلب حمام الأندلس إلى طليطلة سنة 527هـ {cite:nafh-tib-maqqari p. 242-244}. لا يوجد رسم هندسي باقٍ ولا سجل معاصر للبناء، فالإسناد يبقى محل نظر."
    en: "Al-Maqqari's Nafh reports the baylatan made by an 'Abd al-Rahman' who heard of the talisman of Aren in India, with a Rabat manuscript note identifying this Abd al-Rahman as Abu al-Qasim Abd al-Rahman al-Zarqali {cite:nafh-tib-maqqari p. 242-244}. But al-Maqqari himself transmits a rival account blaming a Jewish astrologer named Hatim b. Rabuwa who brought the baths of al-Andalus to Toledo in 527 AH {cite:nafh-tib-maqqari p. 242-244}. No engineering drawing or contemporary construction record survives, so the attribution remains open."
    ur: "مقری نفح میں بیان کرتے ہیں کہ بيلتان «عبد الرحمن» نے بنوائے جس نے اریں کے طلسم کی خبر سنی، اور رباط مخطوطے کا حاشیہ اسی عبد الرحمن کو ابو القاسم عبد الرحمن زرقالی قرار دیتا ہے {cite:nafh-tib-maqqari p. 242-244}۔ مگر مقری خود ایک حریف روایت بھی نقل کرتے ہیں جس میں سبب ایک یہودی منجم حتیم بن ربوہ کو ٹھہراتی ہے جس نے 527ھ میں حمام الاندلس طلیطلہ لایا {cite:nafh-tib-maqqari p. 242-244}۔ نہ کوئی انجینئرنگ نقشہ بچا نہ تعمیر کا معاصر ریکارڈ، اس لیے اسناد کھلا رہتا ہے۔"
  perspectives:
    - tradition: sunni
      id: sunni-museum-frame
      standing: main
      summary:
        ar: "الإطار السني المعلن يحفظ نسبة الجهاز إلى الزرقالي — فلكي أندلسي مسلم — كما ترويها نسخة المخطوط، مع إبقاء احتمال الرواية المنافس ظاهرًا دون حسم."
        en: "The declared Sunni frame preserves the manuscript attribution to al-Zarqali, the Muslim Andalusi astronomer, while keeping the rival report visible without resolving it."
        ur: "اعلان شدہ سنی سیاق زرقالی — اندلسی مسلمان فلکیات دان — کو اس آلے سے منسوب رکھتا ہے، حریف روایت کو بغیر فیصلہ کیے ظاہر رکھتے ہوئے۔"
      sources: [source/nafh-tib-maqqari, source/zarqali-mactutor]
    - tradition: academic
      id: late-compendium-caution
      standing: main
      summary:
        ar: "رواية المقري متأخرة جامعة تنقل عن مصادر مفقودة؛ لا يوجد رسم أو سجل معاصر للجهاز، فالإسناد إلى الزرقالي شخصيًا يحتاج تحفظًا."
        en: "Al-Maqqari's account is a late compendium relaying lost earlier sources; with no drawing or contemporary record of the device, personal attribution to al-Zarqali needs caution."
        ur: "مقری کی روایت ایک دیرینہ جامع کتاب ہے جو کھوئی ہوئی سابق روایات نقل کرتی ہے؛ آلہ کا نہ نقشہ بچا نہ معاصر ریکارڈ، اس لیے زرقالی کے ذاتی انتساب پر احتیاط چاہیے۔"
      sources: [source/nafh-tib-maqqari]
    - tradition: academic
      id: rival-reports
      standing: main
      summary:
        ar: "في الرواية نفسها روايتان: نسخة تعين الصانع عبد الرحمن الزرقالي، وأخرى تلقي الفساد على منجم يهودي هو حتين بن ربوة؛ الاختلاف نفسه دليل على أن الحكاية انتقلت في طبقات."
        en: "Within the same report there are two versions: one naming the maker Abd al-Rahman al-Zarqali, another blaming a Jewish astrologer Hatim b. Rabuwa; the very disagreement shows the tale travelled through layers."
        ur: "اسی بیان میں دو روایات ہیں: ایک بنانے والے کو عبد الرحمن زرقالی قرار دیتی ہے، دوسری یہودی منجم حتیم بن ربوہ پر الزام لگاتی ہے؛ یہی اختلاف دکھاتا ہے کہ کہانی تہہ در تہہ منتقل ہوئی۔"
      sources: [source/nafh-tib-maqqari]
precursors:
  - external: { ar: "أعاجيب الماء الميكانيكية في الأندلس — السواقي والنواعير المعروفة قبل البيلتان", en: "Andalusi hydraulic marvels — known waterwheels and norias predating the baylatan", ur: "اندلس کے آبی اعجاز — بيلتان سے پہلے کے معروف نواعیر اور سواقی" }
    note: "The report itself links the device to wonder-working water technology of its milieu; a 2023 study frames it within Andalusi noria engineering, implying a living hydraulic tradition rather than an isolated invention."
    sources: [source/kana-baylatan-nouh-awad-2023]
