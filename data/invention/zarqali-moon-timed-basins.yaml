id: invention/zarqali-moon-timed-basins
class: invention
label:
  ar: "بيلتا طليطلة: حوضا ماء منسوبان إلى الزرقالي يعملان بدورة القمر"
  en: "The Toledo baylatan: twin basins credited to al-Zarqali working on the moon's cycle"
  ur: "طلیطلہ کے بيلتان: زرقالی سے منسوب دو حوض جو قمری چکر پر کام کرتے تھے"
  es: "El baylatan de Toledo: dos cuencas gemelas atribuidas a al-Zarqali, quien trabajaba en el ciclo lunar."
  fr: "Les baylatan de Tolède: deux bassins attribués à al-Zarqali travaillant sur le cycle lunaire"
  tr: "Belta Toledo: Al-Zarqali'ye atfedilen ve ay döngüsüne göre işleyen iki su havzası."
  id: "Belta Toledo: Dua cekungan air yang dikaitkan dengan Al-Zarqali, yang beroperasi sesuai dengan siklus bulan."
names:
  - { value: "Baylatan of Toledo", kind: alternate, lang: en }
  - { value: "بيلتا طليطلة", kind: alternate, lang: ar }
summary:
  ar: "في نفح الطيب يروي المقري عن بيلتا — حوضين في طليطلة صنعهما «عبد الرحمن» الذي تعينه حاشية المخطوط الرباطي بأبي القاسم عبد الرحمن الزرقالي — أنه سمع بخبر الطلسم الهندي الذي كان يدور بإصبعه من طلوع الفجر إلى غروب الشمس، فصنعهما في بيت مجوف في جوف النهر الأعظم بباب الدباغين، فكانا يتمتلئان وينحسران مع زيادة القمر ونقصانه نصف سبع في اليوم والليلة حتى يمتلئا ليلة خمس عشرة وينقصا بنقصان القمر حتى لا يبقى فيهما شيء ليلة تسعة وعشرين، ومن حلب لهما الماء ابتلعتاه ومن أفرغهما امتلأتا من حينهما؛ ولم تزالا حتى ملك النصارى طليطلة فأمر الفنش أن تقلع إحداهما ليعلم من أين يأتي الماء فقلعت سنة 528هـ فبطلت حركتهما {cite:nafh-tib-maqqari p. 242-244}. لا يبقى من الجهاز أثر مادي، ودراسة 2023 تقدمها بوصفها أعجوبة هندسية لنوافل الأندلس."
  en: "In the Nafh al-Tib al-Maqqari reports the baylatan — two basins in Toledo built by 'Abd al-Rahman', whom a Rabat manuscript note identifies as Abu al-Qasim Abd al-Rahman al-Zarqali — said to have been made after he heard of the Indian talisman that spun by itself from dawn to sunset; set in a vaulted chamber in the Great River at Bab al-Dabbaghin, they filled and ebbed with the moon's waxing and waning by half a seventh each day and night, full on the fifteenth night and dry by the twenty-ninth, swallowing whatever was drawn and refilling when emptied; they worked until the Christians took Toledo and Alfonso ordered one lifted in 528 AH to learn its mechanism, which stopped both {cite:nafh-tib-maqqari p. 242-244}. No material trace survives; a 2023 study treats it as an engineering marvel of Andalusi waterwheels."
  ur: "نفح الطیب میں مقری بيلتان کی روایت بیان کرتے ہیں — طلیطلہ میں دو حوض جنھیں «عبد الرحمن» نے بنایا جسے رباط مخطوطے کا حاشیہ ابو القاسم عبد الرحمن زرقالی بتاتا ہے — کہ اس نے یہ سن کر کہ اریں شہر میں ایک طلسم ہے جو طلوع فجر سے غروب آفتاب تک اپنی انگلی سے گھومتا تھا، دونوں کو باب الدباغین پر عظیم دریا کے دل میں ایک کھوکھلی عمارت میں بنوایا؛ وہ چاند کے بڑھنے گھٹنے کے ساتھ دن رات نصف سُبع کر کے بھرتے اور خالی ہوتے، پندرہویں رات کو بھرے اور انیسویں رات کو خالی، جو کچھ ان میں سے دوہا جاتا وہ نگل جاتے اور جو خالی کیا جاتا وہ دوبارہ بھر جاتے؛ یہ کام کرتے رہے یہاں تک کہ نصارے نے طلیطلہ فتح کیا تو فنچ نے ایک کو اتارنے کا حکم دیا تاکہ معلوم ہو کہ پانی کہاں سے آتا ہے، وہ 528ھ میں اتارا گیا جس سے دونوں کی حرکت بند ہو گئی {cite:nafh-tib-maqqari p. 242-244}۔ آلہ کا کوئی مادی نشان نہیں بچا؛ 2023 کا ایک مقالہ اسے اندلسی نواعیر کے آبی اعجاز کے طور پر پیش کرتا ہے۔"
  es: "En el Nafh al-Tib al-Maqqari se mencionan los baylatan —dos pilas en Toledo construidas por 'Abd al-Rahman', a quien una nota del manuscrito de Rabat identifica como Abu al-Qasim Abd al-Rahman al-Zarqali— que se dice que fueron hechas después de que oyera hablar del talismán indio que giraba solo desde el amanecer hasta el atardecer; ubicadas en una cámara abovedada en el Gran Río en Bab al-Dabbaghin, se llenaban y vaciaban con el crecimiento y decrecimiento de la luna en media séptima parte cada día y noche, llenas la decimoquinta noche y secas la vigésimo novena, absorbiendo lo que se extraía y volviéndose a llenar cuando se vaciaban; funcionaron hasta que los cristianos tomaron Toledo y Alfonso ordenó que se levantara una en el 528 AH para aprender su mecanismo, lo que detuvo ambas {cite:nafh-tib-maqqari p. 242-244}. No sobrevive ningún rastro material; Un estudio de 2023 la considera una maravilla de la ingeniería de las ruedas hidráulicas andaluzas."
  fr: "Dans le Nafh al-Tib, al-Maqqari rapporte l'existence des baylatan — deux bassins à Tolède construits par 'Abd al-Rahman', que la note d'un manuscrit de Rabat identifie comme Abu al-Qasim Abd al-Rahman al-Zarqali — qui auraient été fabriqués après qu'il eut entendu parler du talisman indien qui tournait de lui-même de l'aube au crépuscule. Installés dans une chambre voûtée du Grand Fleuve à Bab al-Dabbaghin, ces bassins se remplissaient et se vidaient au rythme des phases de la lune, par demi-septième de chaque jour et de chaque nuit, atteignant leur pleine lune la quinzième nuit et s'asséchant la vingt-neuvième. Ils absorbaient l'eau puisée et se remplissaient à nouveau lorsqu'ils étaient vidés. Ils fonctionnèrent jusqu'à la prise de Tolède par les chrétiens et l'ordre donné par Alphonse II de soulever l'un d'eux en 528 AH afin d'en étudier le mécanisme, ce qui provoqua l'arrêt des deux bassins (voir Nafh al-Tib-Maqqari, p. 242-244). Aucune trace matérielle n'en subsiste. Une étude de 2023 la considère comme une merveille d'ingénierie des roues à eau andalouses."
  tr: "Nafh al-Tayyib'de, al-Maqqari, Toledo'da \"Abd al-Rahman\" tarafından yaptırılan iki havuzdan bahseder; Rabat el yazmasının kenarında bu kişinin Ebu al-Kâsim Abd al-Rahman al-Zarqali olduğu belirtilir. Al-Maqqari, şafaktan gün batımına kadar parmağıyla dönen bir Hint tılsımı duyduğunu ve bu yüzden Bab al-Dabbaghin'deki Büyük Nehir'in ortasındaki oyuk bir evde bu havuzları yaptırdığını anlatır. Havuzlar, ayın evrelerinin yükselmesi ve alçalmasıyla, günün ve gecenin yedide birinin yarısı kadar dolup boşalır, on beşinci gecede tamamen dolar ve ayın alçalmasıyla tekrar boşalır, yirmi dokuzuncu gecede ise tamamen boşalırdı. Kim içine su çekerse, havuzlar onu yutar, kim boşaltırsa, havuzlar hemen tekrar dolardı. Bu durum, Hristiyanlar Toledo'yu fethedene kadar böyle devam etti; bunun üzerine al-Maqqari, suyun nereden geldiğini bulmak için Finlilere havuzlardan birini kaldırmalarını emretti. Hicri 528 yılında kaldırıldı ve hareketleri durdu. {kaynak:nafh-tib-maqqari s. 242-244}. Cihazdan geriye hiçbir fiziksel iz kalmadı ve 2023 yılında yapılan bir çalışma, onu Endülüs'ün olağanüstü ibadetinin bir mühendislik harikası olarak sunuyor."
  id: "Dalam Nafh al-Tayyib, al-Maqqari menceritakan tentang Bilta — dua baskom di Toledo yang dibuat oleh “Abd al-Rahman,” yang dalam catatan pinggir manuskrip Rabat diidentifikasi sebagai Abu al-Qasim Abd al-Rahman al-Zarqali — bahwa ia mendengar tentang jimat India yang berputar dengan jarinya dari fajar hingga matahari terbenam, sehingga ia membuatnya di sebuah rumah berongga di tengah Sungai Besar di Bab al-Dabbaghin. Baskom-baskom itu akan terisi dan kosong seiring dengan pasang surutnya bulan, setengah dari sepertujuh siang dan malam, hingga penuh pada malam kelima belas dan akan kosong seiring dengan surutnya bulan hingga tidak ada air yang tersisa di dalamnya pada malam kedua puluh sembilan. Siapa pun yang mengambil air ke dalamnya, air itu akan terserap, dan siapa pun yang mengosongkannya, air itu akan segera terisi kembali. Hal ini terus berlanjut hingga orang Kristen menaklukkan Toledo, sehingga ia memerintahkan orang Finlandia untuk mengambil salah satu baskom untuk mencari tahu dari mana air itu berasal. Alat itu disingkirkan pada tahun 528 Hijriah, dan pergerakan mereka pun berhenti. {cite:nafh-tib-maqqari hlm. 242-244}. Tidak ada jejak fisik alat tersebut yang tersisa, dan sebuah studi tahun 2023 menyajikannya sebagai keajaiban teknik dari supererogatori Andalusia."
