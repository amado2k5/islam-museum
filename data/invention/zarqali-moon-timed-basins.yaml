impact:
  fields: [water-agriculture]
  changed:
    ar: "على حد الرواية، ربط جهاز مائي بدورة القمر — امتلاء ونقصان يتبعان زيادة القمر — فجعل الماء نفسه ساعة فلكية بلا رؤية مباشرة."
    en: "On the account's own terms, it tied a water device to the lunar cycle — filling and emptying tracking the moon's increase — making water itself a celestial clock without direct sighting."
    ur: "بیان کی نظر میں اس نے ایک آبی آلہ کو قمری چکر سے جوڑا — چاند کی افزائش کے ساتھ بھرنا اور خالی ہونا — اسطرح پانی کو براہ راست مشاہدے کے بغیر ایک فلکی گھڑی بنا دیا۔"
  history:
    ar: "قصة البيلتان من أعلام الأدب الأندلسي: عملها لأكثر من نصف قرن في مدينة سقطت عسكريًا، وتدميرها عند محاولات فهم آليتها، ثم نقلها في معاجم لاحقة."
    en: "The baylatan story is a landmark of Andalusi literature: functioning for more than half a century in a city that had fallen militarily, destruction when its mechanism was probed, then transmission through later compendia."
    ur: "بيلتان کی کہانی اندلسی ادب کا نشان ہے: فوجی طور پر زوال پزیر شہر میں آدھی صدی سے زیادہ کام، اس کے طریقۂ کار کو جاننے کی کوششوں پر تباہی، پھر بعد کی کتابوں میں منتقلی۔"
  significance: 3
  why: "A richly narrated but unverifiable hydraulic marvel: strong literary attestation through al-Maqqari and a modern engineering study, but no artifact, drawing or contemporary record; significance is bounded by that evidential limit."
