today:
  form:
    ar: "لا يوجد اليوم نسخة من البيلتان؛ أقرب ما يشبهها في طليطلة اليوم نواعير النهر المعاصرة مثل ناعورة سفونت — وهي أعضاء أحياء في تقليد نوافل إسباني لا إعادة بناء للجهاز المروي."
    en: "No copy of the baylatan exists today; the closest living relatives in Toledo are modern river norias such as the Safont wheel — living members of the Spanish noria tradition, not reconstructions of the reported device."
    ur: "بيلتان کی آج کوئی نقل موجود نہیں؛ طلیطلہ میں اس کے قریب ترین زندہ رشتہ جدید دریا کے نواعیر جیسے سفونت کا پہیہ ہیں — ہسپانوی نوافل روایت کے زندہ افراد، مروی آلے کی تعمیر نو نہیں۔"
