  claim:
    ar: 'أقدم كتاب طبخ عربي باقٍ — صنف جديد في تاريخ الكتاب: موسوعة
      وصفات مبوّبة بأصناف المطبخ العباسي، تليه كتب الطبيخ الأخرى
      المنسوبة لنفس الاسم {cite:wikipedia-kitab-al-tabikh-en}.'
    en: 'The earliest surviving Arabic cookbook — a new genre in the
      history of the book: a chaptered encyclopedia of recipes
      recording the Abbasid kitchen, followed by later cookbooks of
      the same name {cite:wikipedia-kitab-al-tabikh-en}.'
    ur: 'سب سے قدیم بچی عربی کتابِ طبخ — کتاب کی تاریخ میں نئی صنف:
      ابواب میں مرتب ترکیبوں کی دائرۃ المعارف جو عباسی باورچی خانہ
      محفوظ کرتی ہے، جس کے بعد اسی نام کی دوسری کتابیں آئیں
      {cite:wikipedia-kitab-al-tabikh-en}۔'
  basis:
    ar: 'المخطوط الباقي بإسطنبول والأبواب المعدودة 132 ووصفات تزيد على
      600، وصف EI2 بأنه ختم كتابه بأبواب آداب الأكل؛ واللاحقون —
