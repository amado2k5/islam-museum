summary:
  ar: >-
    أقدم كتاب طبخ عربي باقٍ — جمعه أبو محمد المظفر بن نصر بن سيار
    الوراق البغدادي في القرن العاشر من مطابخ القرنين الثامن والتاسع
    العباسيين: أكثر من 600 وصفة في 132 باباً، من عصيدة الجزيرة
    البسيطة إلى الأطباق الفارسية المسماة وطبيخات نبطية عراقية،
    مختوماً بأبواب آداب المائدة؛ ويُظن أنه أُلّف لبلاط سيف الدولة
    الحمداني بحلب {cite:wikipedia-kitab-al-tabikh-en}
    {cite:encyclopaedia-of-islam-2}.
  en: >-
    The earliest surviving Arabic cookbook — compiled in the tenth
    century by the Baghdadi Abu Muhammad al-Muzaffar ibn Nasr ibn
    Sayyar al-Warraq from the eighth- and ninth-century Abbasid
    court kitchens: more than 600 recipes in 132 chapters, from the
    simple asida of Arabia to Persian-named stews and a whole
    chapter of Iraqi Nabataean dishes, closing with chapters on
    table manners; it may have been made for the court of the
    Hamdanid Sayf al-Dawla at Aleppo {cite:wikipedia-kitab-al-tabikh-en}
    {cite:encyclopaedia-of-islam-2}.
  ur: >-
    سب سے قدیم بچی عربی کتابِ طبخ — دسویں صدی میں بغدادی ابو محمد
    مظفر بن نصر بن سیار وراق نے آٹھویں اور نویں صدی کی عباسی درباری
    باورچی خانوں سے مرتب کی: 132 بابوں میں چھ سو سے زیادہ ترکیبیں،
    جزیرۃ العرب کی سادہ عصیدہ سے لے کر فارسی ناموں والے سالن اور
    عراقی نبطی طبیخات کا پورا باب، آخر میں آدابِ مائدہ کے ابواب؛
    ممکن ہے حمدانی سید الدولہ کے حلبی دربار کے لیے تیار ہوئی ہو
    {cite:wikipedia-kitab-al-tabikh-en} {cite:encyclopaedia-of-islam-2}۔
  es: "El libro de cocina árabe más antiguo que se conserva, compilado en el siglo X por el bagdadí Abu Muhammad al-Muzaffar ibn Nasr ibn Sayyar al-Warraq a partir de las cocinas de la corte abasí de los siglos VIII y IX: más de 600 recetas en 132 capítulos, desde la sencilla asida de Arabia hasta guisos con nombres persas y un capítulo completo de platos nabateos iraquíes, que concluye con capítulos sobre modales en la mesa; puede que se haya elaborado para la corte del hamdánida Sayf al-Dawla en Alepo {cite:wikipedia-kitab-al-tabikh-en} {cite:encyclopaedia-of-islam-2}."
  fr: "Le plus ancien livre de cuisine arabe conservé — compilé au Xᵉ siècle par le Bagdadi Abu Muhammad al-Muzaffar ibn Nasr ibn Sayyar al-Warraq à partir des cuisines de la cour abbasside des VIIIᵉ et IXᵉ siècles: plus de 600 recettes réparties en 132 chapitres, allant de la simple asida d’Arabie aux ragoûts aux noms persans, en passant par un chapitre entier consacré aux plats nabatéens irakiens, et se terminant par des chapitres sur les bonnes manières à table; il a peut-être été réalisé pour la cour du Hamdanide Sayf al-Dawla à Alep {cite:wikipedia-kitab-al-tabikh-en} {cite:encyclopaedia-of-islam-2}."
