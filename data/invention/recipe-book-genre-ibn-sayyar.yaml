kids:
  ar: 'تخيل دفتراً ضخماً كتبه رجل في بغداد قبل ألف سنة، فيه أكثر من
    ستمئة وصفة لطعام الخلفاء: شوربات ومحاشي وحلوى، وحتى كيفية
    الجلوس إلى الطعام. بفضله نعرف اليوم ماذا كان يأكل أهل بغداد في
    أجمل عصورها.'
  en: 'Imagine a huge notebook a man in Baghdad wrote a thousand
    years ago, with more than six hundred recipes for the caliphs''
    food: stews and stuffings and sweets, and even how to sit down
    to eat. Because of it we know today what the people of Baghdad
    ate in their city''s finest age.'
  ur: 'ایک بڑی کتابچہ سوچو جو بغداد کے ایک آدمی نے ہزار سال پہلے
    لکھی، جس میں خلفا کے کھانے کی چھ سو سے زیادہ ترکیبیں ہیں: سالن
    اور بھرن اور مٹھائیاں، اور یہ بھی کہ کھانے کیسے بیٹھنا ہے۔ اسی
    وجہ سے آج ہم جانتے ہیں بغداد کے لوگ اپنے شہر کے بہترین زمانے میں
    کیا کھاتے تھے۔'
