  changed:
    ar: 'نقل المطبخ من الحرفة إلى الكتاب: طعام البلاط العباسي —
      أسماؤه ومقاديره وتقنياته — صار نصاً يُدرّس ويُترجم ويُطهى
      {cite:wikipedia-kitab-al-tabikh-en}.'
    en: 'It moved the kitchen from craft to book: the Abbasid
      court''s food — its names, measures and techniques — became a
      text that is studied, translated and cooked from
      {cite:wikipedia-kitab-al-tabikh-en}.'
    ur: 'اس نے باورچی خانے کو دستکاری سے کتاب میں بدل دیا: عباسی
      دربار کا کھانا — نام، پیمانے اور دستور — ایسا متن بنا جو
      پڑھا، ترجمہ اور پکایا جاتا ہے
      {cite:wikipedia-kitab-al-tabikh-en}۔'
  history:
    ar: 'منه نعرف أكل الحضارة الإسلامية في عزّها: ما وضعه الخلفاء
      على سفورهم وما سماه الوراق بالنبطي والفارسي — أرشيف مذاق
      بغداد {cite:wikipedia-kitab-al-tabikh-en}.'
    en: 'Through it we know what Islamic civilisation ate at its
      height: what the caliphs put on their cloths and what al-Warraq
      called Nabataean and Persian — an archive of Baghdad''s
      palate {cite:wikipedia-kitab-al-tabikh-en}.'
    ur: 'اسی سے ہمیں معلوم ہے کہ عروج پر اسلامی تہذیب کیا کھاتی تھی:
      خلفا کے دسترخوان پر کیا رہتا تھا اور وراق نے کیا نبطی اور فارسی
      کہا — بغداد کے ذائقے کا محفوظ خانہ
      {cite:wikipedia-kitab-al-tabikh-en}۔'
  significance: 4
  why: 'The oldest surviving Arabic cookbook: the founding document
    of a genre and the richest single window on Abbasid daily life.'
