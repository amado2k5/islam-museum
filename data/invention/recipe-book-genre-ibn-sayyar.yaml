      {cite:wikipedia-kitab-al-tabikh-en}
      {cite:encyclopaedia-of-islam-2}.'
    en: 'The surviving Istanbul manuscript, its 132 chapters and
      more than 600 recipes, and EI2''s notice that he closed his
      book with chapters on table manners; the followers — the
      thirteenth-century Baghdadi and the anonymous Andalusi —
      worked the same genre {cite:wikipedia-kitab-al-tabikh-en}
      {cite:encyclopaedia-of-islam-2}.'
    ur: 'استنبول کا بچا مخطوط، اس کے 132 ابواب اور چھ سو سے زائد
