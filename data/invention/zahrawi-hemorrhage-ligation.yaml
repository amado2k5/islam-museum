label:
  ar: "ربط الأوعية النازفة عند الزهراوي"
  en: "Al-Zahrawi's vessel ligation for haemorrhage"
  ur: "الزہراوی کی نالی بند خون روکنے کا طریقہ"
  es: "Ligadura de vasos sanguíneos de Al-Zahrawi para tratar hemorragias."
names:
  - { value: "arterial ligation", kind: alternate, lang: en }
