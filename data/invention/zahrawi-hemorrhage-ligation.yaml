summary:
  ar: "يوصي «التصريف» بربط الأوعية الدموية النازفة بالخيط — ربط الشريان — لوقف النزيف في العمليات الكبرى، بديلاً عن الاعتماد على الكيّ وحده؛ وهي أقدم توصية جراحية مقروءة بالربط الوريدي/الشرياني وتبقى أساس إيقاف النزف الحديث."
  en: "Al-Tasrif recommends tying bleeding vessels with thread — arterial ligation — to stop haemorrhage in major operations, an alternative to cautery alone; it is the earliest surgical recommendation of vessel ligation in the texts read and remains the basis of modern bleeding control."
  ur: "التصریف بڑے عملوں میں خون بہنے والی نالیوں کو دھاگے سے باندھنے — شریان کا ربط — کی ہدایت دیتی ہے، صرف داغ پر انحصار کے بدلے؛ پڑھے گئے متون میں نالی باندھنے کی قدیم ترین جراحی سفارش اور جدید خون کنٹرول کی بنیاد۔"
  es: "Al-Tasrif recomienda atar los vasos sangrantes con hilo —ligadura arterial— para detener la hemorragia en operaciones mayores, como alternativa a la cauterización sola; es la primera recomendación quirúrgica de ligadura de vasos que se encuentra en los textos consultados y sigue siendo la base del control moderno de hemorragias."
