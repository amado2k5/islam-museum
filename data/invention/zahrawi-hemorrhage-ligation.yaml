kids:
  ar: "عندما تنزف الأوعية الدموية في عملية كبيرة، كيف توقف الدم؟ فكّر الزهراوي قبل ألف سنة: اربط الوعاء بخيط — كما تربط حبلاً — فيقف النزف دون حرق. هذه فكرة «ربط الشريان» التي ما زالت تنقذ الأرواح في كل عملية."
  en: "When blood vessels bleed in a big operation, how do you stop it? Al-Zahrawi thought a thousand years ago: tie the vessel with thread — as you tie a rope — and the bleeding stops without burning. That is the 'arterial ligation' idea still saving lives in every operation."
  ur: "جب بڑے آپریشن میں نالیاں خون بہاتی ہیں، اسے کیسے روکو؟ الزہراوی نے ہزار سال پہلے سوچا: نالی کو دھاگے سے باندھو — جیسے رسی باندھتے ہو — اور خون بغیر جلائے رک جائے گا۔ یہی «شریان کا ربط» کا خیال ہے جو آج بھی ہر آپریشن میں جان بچاتا ہے۔"
