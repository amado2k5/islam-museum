impact:
  fields: [astronomy-instruments]
  changed:
    ar: "أنتج أسطرلابات بإسقاطات مختلطة مرقّاة بصانع ميقاتي مشهور، ورسائل تعليمية في الأسطرلاب والربع المقترح، في دمشق المملوكية."
    en: "Produced mixed-projection astrolabes by a celebrated muwaqqit, plus educational treatises on the astrolabe and sine quadrant, in Mamluk Damascus."
    ur: "مشہور میقاتی نے سٹیریوگرافک پروجیکشن والے اسطرلاب بنائے اور اسطرلاب و ربع مقترح پر تعلیمی رسائل لکھے، مملوک دمشق میں۔"
  history:
    ar: "بقيت مرقيةات مربعة بتوقيعه في المتحف البريطاني وأدلة على مشهرة صنعه؛ نقل ابن العطار ملاحظة القرن الخامس عشر عن نوع إسقاطه، والفرع التاريخي للتقنية أوسع من سيرة المصمم."
    en: "Signed Damascus quadrants survive in the British Museum and attest his reputation as a maker; Ibn al-Attar's fifteenth-century note reports the mixed-projection variant, while the technology's history is wider than the maker's biography."
    ur: "دستخط شدہ دمشق مرقية برٹش میوزیم میں باقی ہیں اور اس کی صانع شہرت کی گواہی ہیں؛ ابن العطار کا پندرہویں صدی کا قول سٹیریوگرافک پروجیکشن قسم بتاتا ہے، اور ٹیکنالوجی کی تاریخ ساز کی سوانح سے وسیع ہے۔"
  significance: 3
  why: "A documented specialist maker of an unusual astrolabe variant with surviving signed instruments and named treatises; bounded to production evidence, no dated mixed-projection example, no invention claim."
