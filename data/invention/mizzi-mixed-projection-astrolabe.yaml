id: invention/mizzi-mixed-projection-astrolabe
class: invention
label:
  { ar: "إسطرلاب المزي بالإسقاطين المختلطين", en: "Al-Mizzi's astrolabe with mixed stereographic projections", ur: "مزی کا دو قطبی سٹیریوگرافک پروجیکشن والا اسطرلاب" }
names:
  - { value: "astrolabe with mixed projections about both poles", kind: alternate, lang: en }
  - { value: "إسطرلاب المزي", kind: alternate, lang: ar }
summary:
  ar: "أسطرلاب صنعه الميقاتي الدمشقي شمس الدين المزي ⁦(نحو 1291–1349م)⁩ بإسقاطات ستيريوغرافية مختلطة عن القطبين معاً، على ما نقله عنه ابن العطار في القرن الخامس عشر الهجري؛ من أسطرلاباته المميزة المعروفة أيضاً مرтикаات مربعة بتوقيعه في المتحف البريطاني ورسالتان في الأسطرلاب والربع المقترح {cite:isi-mizzi-bea} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 20}."
  en: "An astrolabe made by the Damascene muwaqqit Shams al-Din al-Mizzi (c. 1291–1349) with mixed stereographic projections about both poles, as reported of him by Ibn al-Attar in the fifteenth century AH; his known signed instruments include Damascus quadrants in the British Museum and treatises on the astrolabe and the sine quadrant {cite:isi-mizzi-bea} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 20}."
  ur: "دمشقی میقاتی شمس الدین المزی ⁦(تقریباً 1291–1349م)⁩ کا اسطرلاب جس میں دونوں قطبوں سے ملے ہوئے سٹیریوگرافک پروجیکشن استعمال ہوئے، جیسا کہ پندرہویں صدی ہجری میں ابن العطار نے اس کے بارے میں نقل کیا؛ ان کے دستخط شدہ آلات میں برٹش میوزیم کے دمشق مرقیے اور اسطرلاب و ربع مقترح پر دو رسائل بھی شامل ہیں {cite:isi-mizzi-bea} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 20}۔"
