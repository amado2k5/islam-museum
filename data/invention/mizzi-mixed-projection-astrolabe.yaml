kids:
  ar: "الأسطرلاب آلة نحاسية قديمة تقيس مواضع النجوم. اشتهر المزي في دمشق بأنه يصنع أسطرلابات «عجيبة» بطرق إسقاط مختلفة، فباع أسطرلابه بعشرة دنانير؛ تحفظ متاحف اليوم مربعاته الموقعة كأدلة على حرفته."
  en: "The astrolabe is an old brass instrument that measures the stars' positions. Al-Mizzi was famous in Damascus for making 'wonderful' astrolabes in different projection ways, and one of his sold for ten dinars; museums today keep his signed quadrants as evidence of his craft."
  ur: "اسطرلاب ایک پرانا پیتل کا آلہ ہے جو ستاروں کے مقامات ناپتا ہے۔ المزی دمشق میں «عجیب» اسطرلاب بنانے کے لیے مشہور تھے جو سٹیریوگرافک پروجیکشن کے مختلف طریقوں سے بنتے تھے، اور ان کا ایک اسطرلاب دس دینار میں بکا؛ آج عجائب گھر ان کی دستخط شدہ مرقية بطور اس کے ہنر کے شہادے محفوظ رکھتے ہیں۔"
