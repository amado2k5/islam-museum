today:
  form:
    ar: "نموذج تاريخي لصناعة الأسطرلاب الدمشقي؛ اليوم تبنى نسخ تعليمية للعلماء، والصورة المعروضة ربعيات دمشقية من وقته لا نسخة من أسطرلابه المختلط."
    en: "A historical model of Damascene astrolabe-making; today educational replicas serve scholars, and the displayed photograph shows Damascus quadrants of his era, not a copy of his mixed-projection astrolabe."
    ur: "دمشقی اسطرلاب سازی کا تاریخی نمونہ؛ آج تعلیمی نقلیں علماء کی خدمت میں ہیں، اور دکھائی گئی تصویر اس کے زمانے کے دمشق مرقیے ہیں، اس کے سٹیریوگرافک پروجیکشن والے اسطرلاب کی نقل نہیں۔"
  descendants:
    ar: "لا يثبت البحث المقروء نسباً مباشراً من أسطرلابه إلى صناع اليوم؛ استمر تراث صنع الأسطرلاب في دمشق ومصر وغيرها عبر ورش لاحقة."
    en: "The sources read establish no direct lineage from his astrolabe to today's makers; astrolabe craft continued in Damascus, Egypt and beyond through later workshops."
    ur: "پڑھے ماخذ اس کے اسطرلاب سے آج کے صنّاع تک براہ راست نسب ثابت نہیں کرتے؛ اسطرلاب سازی کا تراث دمشق، مصر اور دیگر بلاد میں بعد کی ورکشاپس سے جاری رہا۔"
