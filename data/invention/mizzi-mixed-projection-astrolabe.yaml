    role: improver
    place: place/damascus
    note: "Hanafi muwaqqit and instrument-maker of Damascus; documented by the BEA as having made astrolabes with mixed projections and by the Bibliotheca Alexandrina book as maker of unusual astrolabes and signer of a sundial."
    sources: [source/isi-mizzi-bea, source/bibalex-azhar-astronomy-manuscripts-2006]
attribution:
  status: improvement
  claim:
    ar: "الإسقاط الستيغرافي عن القطبين أساسي في الأسطرلاب منذ نشأته؛ ما يوثقه المصدر هو أن المزي صنع أسطرلابات بإسقاطات مختلطة عن القطبين معاً، وأنه صنع مرقيةات مربعة ورسائل في الأسطرلاب والربع المقترح — وليس ادعاء اختراع الأسطرلاب أو نوع الإسقاط المختلط."
    en: "Stereographic projection about the poles is basic to the astrolabe since its origins; what the source documents is that al-Mizzi made astrolabes combining projections about both poles, made quadrants and wrote treatises on the astrolabe and the sine quadrant — not an invention claim for the astrolabe or for mixed projection itself."
    ur: "قطبوں سے سٹیریوگرافک پروجیکشن اسطرلاب میں ابتدا سے بنیادی ہیں؛ ماخذ وہی ثابت کرتا ہے کہ المزی نے دونوں قطبوں سے سٹیریوگرافک پروجیکشن والے اسطرلاب بنائے، مرقية بنائی اور اسطرلاب و ربع مقترح پر رسائل لکھے — اسطرلاب یا سٹیریوگرافک پروجیکشن کی ایجاد کا دعویٰ نہیں۔"
  basis:
    ar: "نقل BEA عن ابن العطار أن المزي «صنع أسطرلابات بإسقاطات مختلطة عن القطبين معاً»، ويضيف كتاب مكتبة الإسكندرية أنه اشتهر بصنع غرائب الأسطرلابات حتى بيع أسطرلابه بعشرة دنانير وأن مزولة بتوقيعه في المتحف البريطاني."
    en: "The BEA reports Ibn al-Attar's note that al-Mizzi 'made astrolabes with mixed projections about both poles together', and the Bibliotheca Alexandrina book adds that he was famed for unusual astrolabes, one sold for ten dinars, and that a sundial bearing his signature is in the British Museum."
    ur: "BEA ابن العطار کا قول نقل کرتا ہے کہ المزی نے «دونوں قطبوں سے ملے ہوئے سٹیریوگرافک پروجیکشن والے اسطرلاب بنائے»، اور کتاب الالکساندریا کے مطابق وہ عجیب و غریب اسطرلاب بنانے میں مشہور تھے جن میں سے ایک دس دینار میں بکا، اور برٹش میوزیم میں ان کے دستخط والی ایک دھوپ گھڑی بھی ہے۔"
  perspectives:
    - tradition: sunni
      id: sunni-museum-frame
      standing: main
      summary:
        ar: "الإطار السني المعلن يحفظ الصانع الدمشقي الموثق في جامع أموي سنية؛ الاسم يقول الحنفي صراحة في سيرة BEA."
        en: "The declared Sunni frame preserves the documented Damascene maker at a Sunni institution; the BEA name itself says al-Hanafi."
        ur: "اعلان کردہ سنی سیاق دمشقی صانع کو محفوظ رکھتا ہے؛ BEA کا نام خود «حنفی» کہتا ہے۔"
      sources: [source/isi-mizzi-bea, source/bibalex-azhar-astronomy-manuscripts-2006]
