  context:
    ar: "دمشق في القرن الثامن الهجري، حيث كان المزي ميقاتاً في الجامع الأموي وصانعاً للأسطرلابات يبيعها؛ الجملة المصدرية تنسب إليه صنع أسطرلابات بإسقاطات مختلطة لا تسمية تاريخ اختراعها {cite:isi-mizzi-bea} {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 20}."
    en: "Damascus in the eighth century AH, where al-Mizzi was timekeeper at the Umayyad Mosque and an astrolabe-maker whose instruments sold for ten dinars; the source sentence attributes to him the making of mixed-projection astrolabes, not the invention of the variant."
    ur: "آٹھویں صدی ہجری کا دمشق، جہاں المزی جامع اموی کے میقاتی اور اسطرلاب ساز تھے جن کے آلات دس دینار میں بکتے تھے؛ ماخذ جملہ اسے ملے ہوئے سٹیریوگرافک پروجیکشن والے اسطرلاب بنانے سے منسوب کرتا ہے، ایجادِ قسم سے نہیں۔"
makers:
