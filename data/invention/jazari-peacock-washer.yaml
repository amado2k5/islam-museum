  ar: "في تصميم الجزري يصب طاووس الماء، فيتجمع في إناء ويرفع عوامة. تخرج شخصية بالصابون، ثم أخرى بالمنديل، ويصرف الماء المستعمل بصنبور. هذه شخصيات آلة لا أشخاص يختبئون فيها. يحفظ المتحف الرسم والنص، لكنه لا يعرف بيقين هل بنيت الآلة فعلاً."
