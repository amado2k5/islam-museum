summary:
  ar: "تصميم في كتاب الجزري يصب فيه الطاووس الماء، فيرفع الماء المتجمع عوامة تخرج شخصية بالصابون ثم أخرى بالمنديل، ثم يصرف الماء المستعمل بصنبور {cite:cleveland-jazari-peacock verso catalogue}. يحفظ كليفلاند ورقة سورية من نسخة 1315م، ويصرح بأن بناء الآلة فعلاً غير مؤكد؛ تاريخ الكتاب 1205 عند TDV و1206 عند المتحف {cite:cleveland-jazari-peacock recto catalogue} {cite:tdv-cezeri pp. 505–506}."
  en: "A design in al-Jazari's book: the peacock pours water, collected water raises a float releasing a soap-bearing figure and then a towel-bearing one, and used water drains through a spigot {cite:cleveland-jazari-peacock verso catalogue}. Cleveland preserves a Syrian folio copied in 1315 and explicitly says actual construction is uncertain. TDV dates the book to 1205, the museum to 1206 {cite:cleveland-jazari-peacock recto catalogue} {cite:tdv-cezeri pp. 505–506}."
  ur: "جزری کی کتاب کا ڈیزائن: طاؤس پانی ڈالتا، جمع پانی تیراک اٹھاتا ہے جو پہلے صابن پھر تولیہ والی شکل نکالتا ہے، اور استعمال شدہ پانی ٹونٹی سے نکلتا ہے {cite:cleveland-jazari-peacock verso catalogue}۔ کلیولینڈ میں 1315ء کی شامی نقل کا ورق ہے؛ اصل تعمیر غیر یقینی ہے۔ ٹی ڈی وی کتاب 1205ء، میوزیم 1206ء کا بتاتا ہے {cite:cleveland-jazari-peacock recto catalogue} {cite:tdv-cezeri pp. 505–506}۔"
