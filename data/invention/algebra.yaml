today:
  form:
    ar: "الجبر اليوم فرع أساسي من الرياضيات يُدرَّس في المدارس، ويكتب المعادلات بالرموز. أما جبر الخوارزمي فكان بالكلمات وحدها، ولا يقبل إلا الجذور الموجبة، ثم بدأ السموأل يرمز للأعداد والمقادير بالحروف {cite:tdv-cebir pp. 195–201}."
    en: "Algebra is today a basic branch of mathematics taught in schools, and it writes equations in symbols. Al-Khwarizmi's algebra was wholly in words and accepted only positive roots; al-Samaw'al later began to write numbers and quantities with letters {cite:tdv-cebir pp. 195–201}."
    ur: "الجبرا آج ریاضی کی ایک بنیادی شاخ ہے جو اسکولوں میں پڑھائی جاتی ہے، اور یہ مساواتیں علامتوں میں لکھتا ہے۔ خوارزمی کا الجبرا پورا کا پورا الفاظ میں تھا اور صرف مثبت جذر قبول کرتا تھا؛ بعد میں سموأل نے اعداد اور مقداروں کو حروف سے لکھنا شروع کیا {cite:tdv-cebir pp. 195–201}۔"
  descendants:
    ar: "اسم العلم نفسه في لغات العالم مأخوذ من كلمة «الجبر» {cite:khwarizmi-jabr-cairo-1939 p. 25}، ومعادلة «مال وعشرة أجذار يعدل تسعة وثلاثين» من أمثلة الخوارزمي لا تزال تُضرب مثلاً في كتب الجبر {cite:khwarizmi-jabr-cairo-1939 p. 24}."
    en: "The science's own name in the world's languages comes from the word al-jabr {cite:khwarizmi-jabr-cairo-1939 p. 25}, and al-Khwarizmi's example 'a square and ten roots equal thirty-nine' is still used in algebra books {cite:khwarizmi-jabr-cairo-1939 p. 24}."
    ur: "دنیا کی زبانوں میں اس علم کا نام خود لفظ «الجبر» سے لیا گیا ہے {cite:khwarizmi-jabr-cairo-1939 p. 25}، اور خوارزمی کی مثال «ایک مال اور دس جذر انتالیس کے برابر ہیں» آج بھی الجبرا کی کتابوں میں دی جاتی ہے {cite:khwarizmi-jabr-cairo-1939 p. 24}۔"
