impact:
  fields: [mathematics]
  changed:
    ar: "صار حل المسائل العددية علماً له أجناسه وأبوابه وبراهينه: كل مسألة تُردّ بالجبر والمقابلة إلى أحد الضروب الستة {cite:khwarizmi-jabr-cairo-1939 p. 43}، ويقول محققا طبعة القاهرة إن معادلاته تكررت في كتب الجبر من عصره إلى أوائل العصر الحديث، وبعضها لا يزال في كتب الجبر إلى اليوم {cite:khwarizmi-jabr-cairo-1939 p. 24}."
    en: "Solving number problems became a science with its kinds of term, its chapters and its proofs: every problem is brought by al-jabr and al-muqabala to one of the six types {cite:khwarizmi-jabr-cairo-1939 p. 43}. The Cairo editors say his equations were repeated in algebra books from his time to the beginning of the modern age, and some are still in algebra books today {cite:khwarizmi-jabr-cairo-1939 p. 24}."
    ur: "عددی مسائل کا حل اپنے حدود، ابواب اور ثبوتوں کے ساتھ ایک علم بن گیا: ہر مسئلہ الجبر اور المقابلہ کے ذریعے چھ قسموں میں سے کسی ایک تک لایا جاتا ہے {cite:khwarizmi-jabr-cairo-1939 p. 43}۔ قاہرہ کے محققین کہتے ہیں کہ ان کی مساواتیں ان کے زمانے سے جدید دور کے آغاز تک الجبرا کی کتابوں میں دہرائی جاتی رہیں، اور ان میں سے کچھ آج بھی الجبرا کی کتابوں میں ہیں {cite:khwarizmi-jabr-cairo-1939 p. 24}۔"
  history:
    ar: "شرح كتابَه علماءُ المشرق، وبنى عليه أبو كامل ثم الكرجي والسموأل وعمر الخيام الذي صنّف معادلات الدرجة الثالثة {cite:tdv-cebir pp. 195–201}، وشرحه أهل الأندلس {cite:muqaddima-ibn-khaldun pp. 495–496}، وتُرجم إلى اللاتينية على يد روبرت أوف تشستر، ودخل اسمه معاجم لغات العالم {cite:khwarizmi-jabr-cairo-1939 pp. 25–26}."
    en: "Scholars of the East wrote commentaries on his book, and Abu Kamil built on it, then al-Karaji, al-Samaw'al and Umar al-Khayyam, who classified the cubic equations {cite:tdv-cebir pp. 195–201}; the Andalusians wrote commentaries on it {cite:muqaddima-ibn-khaldun pp. 495–496}; Robert of Chester translated it into Latin, and its name entered the dictionaries of the world's languages {cite:khwarizmi-jabr-cairo-1939 pp. 25–26}."
    ur: "مشرق کے علماء نے ان کی کتاب کی شرحیں لکھیں، اور ابو کامل نے اس پر بنیاد رکھی، پھر کرجی، سموأل اور عمر خیام نے، جنہوں نے سہ درجی مساواتوں کی درجہ بندی کی {cite:tdv-cebir pp. 195–201}؛ اہلِ اندلس نے اس کی شرحیں لکھیں {cite:muqaddima-ibn-khaldun pp. 495–496}؛ رابرٹ آف چیسٹر نے اسے لاطینی میں ترجمہ کیا، اور اس کا نام دنیا کی زبانوں کی لغات میں داخل ہو گیا {cite:khwarizmi-jabr-cairo-1939 pp. 25–26}۔"
  significance: 5
  why: "The first surviving book to treat the solving of equations as an independent science with ordered types and proofs; every later algebra, Arabic and Latin, built on it, and the discipline still carries its name."
