kids:
  ar: "قبل نحو ألف ومئتي سنة كتب عالم في بغداد اسمه الخوارزمي كتاباً يعلّم الناس كيف يجدون عدداً مجهولاً، ليقسموا الميراث ويقيسوا الأرض ويحسبوا التجارة. رتّب المسائل في ستة أنواع، وشرح كل نوع برسم مربعات. ومن اسم كتابه «الجبر» جاءت كلمة algebra التي يتعلمها التلاميذ في كل العالم."
  en: "About twelve hundred years ago a scholar in Baghdad named al-Khwarizmi wrote a book teaching people how to find a number they did not know, so they could share out inheritances, measure land and work out trade. He sorted the problems into six kinds and explained each with drawings of squares. From his book's name, al-Jabr, comes the word algebra that pupils learn all over the world."
  ur: "تقریباً بارہ سو سال پہلے بغداد کے ایک عالم خوارزمی نے ایک کتاب لکھی جو لوگوں کو سکھاتی تھی کہ نامعلوم عدد کیسے معلوم کریں، تاکہ وہ وراثت بانٹ سکیں، زمین ناپ سکیں اور تجارت کا حساب کر سکیں۔ انہوں نے مسائل کو چھ قسموں میں ترتیب دیا اور ہر قسم کو مربعوں کی تصویروں سے سمجھایا۔ ان کی کتاب کے نام «الجبر» سے لفظ الجبرا آیا جو دنیا بھر کے طلبہ سیکھتے ہیں۔"
