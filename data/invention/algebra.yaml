id: invention/algebra
class: invention
label:
  ar: "علم الجبر والمقابلة ⁦(الجبر علماً مستقلاً عند الخوارزمي)⁩"
  en: "Algebra (al-jabr wal-muqabala as a discipline in al-Khwarizmi's work)"
  ur: "علم الجبر والمقابلہ ⁦(خوارزمی کے ہاں الجبرا ایک مستقل علم کے طور پر)⁩"
names:
  - { value: "الجبر والمقابلة", kind: alternate, lang: ar }
  - { value: "حساب الجبر والمقابلة", kind: alternate, lang: ar }
  - { value: "Cebir", kind: alternate, lang: tr }
  - { value: "algebra", kind: alternate, lang: en }
summary:
  ar: "صناعة يُستخرج بها العدد المجهول من المعلوم بمعادلة بين أجناس ثلاثة هي العدد والجذر ⁦(الشيء)⁩ والمال، تُردّ بالجبر والمقابلة إلى ستة ضروب لكل منها طريقة حلّ وبرهان هندسي. ألّف فيها محمد بن موسى الخوارزمي في عهد المأمون كتاباً مختصراً لحاجة الناس في المواريث والوصايا والتجارات ومساحة الأرضين، ويعدّه ابن خلدون أول من كتب في هذا الفن، ومن عنوان كتابه جاء اسم «algebra» في لغات العالم."
  en: "The art of finding an unknown number from known ones through an equation between three kinds of term (number, root or 'thing', and square or 'wealth'), reduced by al-jabr and al-muqabala to six types, each with a rule of solution and a geometric proof. Muhammad ibn Musa al-Khwarizmi wrote a concise book on it under the caliph al-Ma'mun for people's needs in inheritance, bequests, trade and land measurement; Ibn Khaldun names him the first to write in this art, and the world's word 'algebra' comes from his title."
  ur: "وہ فن جس سے معلوم اعداد کے ذریعے نامعلوم عدد نکالا جاتا ہے، تین قسم کے حدود ⁦(عدد، جذر یعنی «شے»، اور مال یعنی مربع)⁩ کے درمیان ایک مساوات سے، جسے الجبر اور المقابلہ کے ذریعے چھ قسموں میں لایا جاتا ہے، اور ہر قسم کا ایک قاعدۂ حل اور ہندسی ثبوت ہے۔ محمد بن موسیٰ خوارزمی نے خلیفہ مامون کے دور میں وراثت، وصیتوں، تجارت اور زمین کی پیمائش میں لوگوں کی ضرورت کے لیے اس پر ایک مختصر کتاب لکھی؛ ابن خلدون انہیں اس فن میں سب سے پہلے لکھنے والا کہتے ہیں، اور دنیا کی زبانوں میں لفظ «الجبرا» ان کی کتاب کے نام سے آیا۔"
