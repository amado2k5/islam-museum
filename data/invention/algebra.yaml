origin:
  place: place/baghdad
  polity: polity/abbasid-caliphate
  context:
    ar: "ينقل محققا طبعة القاهرة عن «الفهرست» لابن النديم أن الخوارزمي كان منقطعاً إلى خزانة الحكمة للمأمون، وأنه من أصحاب علوم الهيئة وصاحب الزيجين المعروفين بالسند هند {cite:khwarizmi-jabr-cairo-1939 p. 22}. ويقول الخوارزمي في مقدمة كتابه إن ما شجّعه على تأليفه هو رغبة المأمون في العلم وتقريبه أهله ومعونته إياهم على إيضاح ما كان مستبهماً {cite:khwarizmi-jabr-cairo-1939 p. 29}."
    en: "The Cairo editors quote Ibn al-Nadim's Fihrist: al-Khwarizmi devoted himself to al-Ma'mun's treasury of wisdom, was one of the astronomers, and made the two tables known as the Sindhind {cite:khwarizmi-jabr-cairo-1939 p. 22}. In his preface al-Khwarizmi says he was encouraged to write by al-Ma'mun's love of learning, his closeness to the learned and his help to them in making clear what had been obscure {cite:khwarizmi-jabr-cairo-1939 p. 29}."
    ur: "قاہرہ ایڈیشن کے محققین ابن ندیم کی «الفہرست» سے نقل کرتے ہیں کہ خوارزمی مامون کے خزانۂ حکمت سے وابستہ رہے، علم ہیئت کے ماہرین میں تھے، اور «سند ہند» کے نام سے مشہور دو زیجوں کے مصنف تھے {cite:khwarizmi-jabr-cairo-1939 p. 22}۔ خوارزمی اپنے مقدمے میں کہتے ہیں کہ انہیں لکھنے کا حوصلہ مامون کی علم سے رغبت، اہلِ علم کو قریب رکھنے اور جو کچھ مبہم تھا اسے واضح کرنے میں ان کی مدد سے ملا {cite:khwarizmi-jabr-cairo-1939 p. 29}۔"
makers:
  - person: person/al-khwarizmi
    role: inventor
    place: place/baghdad
    note: "Author of al-Kitab al-mukhtasar fi hisab al-jabr wal-muqabala, written under al-Ma'mun {cite:khwarizmi-jabr-cairo-1939 pp. 29–30}. Ibn Khaldun names him the first to write in the art {cite:muqaddima-ibn-khaldun p. 495}; TDV reports the general agreement that algebra became an independent science with him, and the arguments of those who doubt he was the first {cite:tdv-cebir pp. 195–201}."
    sources: [source/khwarizmi-jabr-cairo-1939, source/muqaddima-ibn-khaldun, source/tdv-cebir]
attribution:
  status: improvement
  claim:
    ar: "محمد بن موسى الخوارزمي أول من كتب في علم الجبر والمقابلة، فجعله علماً مستقلاً بأجناسه الثلاثة وضروبه الستة وبراهينها."
    en: "Muhammad ibn Musa al-Khwarizmi was the first to write on al-jabr wal-muqabala, making it an independent science with its three kinds of term, its six types and their proofs."
    ur: "محمد بن موسیٰ خوارزمی الجبر والمقابلہ پر لکھنے والے پہلے شخص تھے، اور انہوں نے اسے اس کے تین قسم کے حدود، چھ قسموں اور ان کے ثبوتوں کے ساتھ ایک مستقل علم بنایا۔"
  basis:
    ar: "الكتاب نفسه باقٍ: يبيّن فيه الخوارزمي أن الأعداد التي يُحتاج إليها في حساب الجبر والمقابلة ثلاثة ضروب: جذور وأموال وعدد مفرد {cite:khwarizmi-jabr-cairo-1939 p. 30}، ثم يذكر ثلاثة ضروب بسيطة يعدل فيها بعضها بعضاً وثلاثة مقترنة {cite:khwarizmi-jabr-cairo-1939 pp. 31–32}، ويبرهن على حلول المقترنة بالسطوح المربعة {cite:khwarizmi-jabr-cairo-1939 pp. 35–43}، ويقرر أن كل ما يُعمل به من حساب الجبر والمقابلة لا بد أن يخرج إلى أحد الأبواب الستة {cite:khwarizmi-jabr-cairo-1939 p. 43}. ويقول ابن خلدون إن أول من كتب في هذا الفن أبو عبد الله الخوارزمي وبعده أبو كامل شجاع بن أسلم {cite:muqaddima-ibn-khaldun p. 495}. لكن حل المعادلات أقدم منه: فيعرض محققا طبعة القاهرة معادلات عند المصريين والبابليين، وحلولاً هندسية عند اليونان، وحلولاً تحليلية عند هيرون وديوفانتوس، وقاعدة براهماغوبتا عند الهنود {cite:khwarizmi-jabr-cairo-1939 pp. 13–21}. فالجديد عند الخوارزمي هو جمع ذلك في علم مستقل مرتّب ببراهينه، لا اختراع حل المعادلة من عدم."
    en: "The book itself survives. In it al-Khwarizmi sets out that the numbers needed in reckoning by al-jabr and al-muqabala are of three kinds: roots, squares and simple number {cite:khwarizmi-jabr-cairo-1939 p. 30}; he then gives three simple types in which one kind equals another and three compound types {cite:khwarizmi-jabr-cairo-1939 pp. 31–32}, proves the solutions of the compound types with squares {cite:khwarizmi-jabr-cairo-1939 pp. 35–43}, and states that every problem worked by al-jabr and al-muqabala must lead to one of the six {cite:khwarizmi-jabr-cairo-1939 p. 43}. Ibn Khaldun says the first to write in this art was Abu Abd Allah al-Khwarizmi, and after him Abu Kamil Shuja' ibn Aslam {cite:muqaddima-ibn-khaldun p. 495}. But solving equations is older than him: the Cairo editors survey equations in Egypt and Babylon, geometric solutions among the Greeks, analytic solutions in Heron and Diophantus, and Brahmagupta's rule in India {cite:khwarizmi-jabr-cairo-1939 pp. 13–21}. What is new in al-Khwarizmi is the gathering of this into an ordered, independent science with its proofs, not the solving of equations from nothing."
    ur: "کتاب خود باقی ہے۔ اس میں خوارزمی بتاتے ہیں کہ الجبر والمقابلہ کے حساب میں جن اعداد کی ضرورت ہوتی ہے وہ تین قسم کے ہیں: جذر، مال اور مفرد عدد {cite:khwarizmi-jabr-cairo-1939 p. 30}؛ پھر وہ تین سادہ قسمیں بیان کرتے ہیں جن میں ایک قسم دوسری کے برابر ہوتی ہے، اور تین مرکب قسمیں {cite:khwarizmi-jabr-cairo-1939 pp. 31–32}، مرکب قسموں کے حل کو مربع سطحوں سے ثابت کرتے ہیں {cite:khwarizmi-jabr-cairo-1939 pp. 35–43}، اور کہتے ہیں کہ الجبر والمقابلہ سے کیا جانے والا ہر حساب لازماً چھ ابواب میں سے کسی ایک تک پہنچتا ہے {cite:khwarizmi-jabr-cairo-1939 p. 43}۔ ابن خلدون کہتے ہیں کہ اس فن میں سب سے پہلے ابو عبد اللہ خوارزمی نے لکھا اور ان کے بعد ابو کامل شجاع بن اسلم نے {cite:muqaddima-ibn-khaldun p. 495}۔ لیکن مساوات حل کرنا ان سے پرانا ہے: قاہرہ کے محققین مصر اور بابل میں مساواتوں، یونانیوں کے ہاں ہندسی حلوں، ہیرون اور دیوفانتوس کے ہاں تحلیلی حلوں، اور ہند میں برہما گپت کے قاعدے کا جائزہ لیتے ہیں {cite:khwarizmi-jabr-cairo-1939 pp. 13–21}۔ خوارزمی کے ہاں نیا یہ ہے کہ انہوں نے اسے اپنے ثبوتوں کے ساتھ ایک مرتب، مستقل علم میں جمع کیا، نہ کہ مساوات کا حل عدم سے ایجاد کیا۔"
  perspectives:
    - tradition: sunni
      id: sunni-ibn-khaldun
      standing: main
      summary:
        ar: "يجعل ابن خلدون الجبر والمقابلة فرعاً من علم العدد، يُستخرج به المجهول من المعلوم بمعادلة بين العدد والشيء والمال تنتهي إلى ست مسائل، ويقول إن أول من كتب فيه أبو عبد الله الخوارزمي ثم أبو كامل شجاع بن أسلم، وإن كتابه في مسائله الست من أحسن ما وُضع فيه، وشرحه كثير من أهل الأندلس {cite:muqaddima-ibn-khaldun pp. 495–496}."
        en: "Ibn Khaldun makes al-jabr wal-muqabala a branch of the science of number, by which the unknown is drawn from the known through an equation between number, thing and square that ends in six problems. He says the first to write in it was Abu Abd Allah al-Khwarizmi, then Abu Kamil Shuja' ibn Aslam, that al-Khwarizmi's book on its six problems is among the best written on it, and that many Andalusians wrote commentaries on it {cite:muqaddima-ibn-khaldun pp. 495–496}."
        ur: "ابن خلدون الجبر والمقابلہ کو علم العدد کی ایک شاخ قرار دیتے ہیں، جس سے عدد، شے اور مال کے درمیان ایسی مساوات کے ذریعے معلوم سے نامعلوم نکالا جاتا ہے جو چھ مسائل پر ختم ہوتی ہے۔ وہ کہتے ہیں کہ اس میں سب سے پہلے ابو عبد اللہ خوارزمی نے لکھا، پھر ابو کامل شجاع بن اسلم نے، کہ خوارزمی کی چھ مسائل والی کتاب اس فن کی بہترین کتابوں میں سے ہے، اور اہلِ اندلس میں سے بہت سوں نے اس کی شرحیں لکھیں {cite:muqaddima-ibn-khaldun pp. 495–496}۔"
      holders: [person/ibn-khaldun]
      sources: [source/muqaddima-ibn-khaldun]
    - tradition: academic
      id: academic-tdv-cebir
      standing: main
      summary:
        ar: "تذكر موسوعة TDV أن المؤرخين اتفقوا في الجملة على أن الجبر صار علماً مستقلاً مع الخوارزمي، وأن من بعده كسنان بن الفتح أقرّوا بأوليته، وأن المخالف الوحيد في زمنه كان أبو برزة الذي ادّعى ذلك لجده عبد الحميد بن واسع بن ترك، فردّ عليه أبو كامل ردّاً شديداً. وتورد أيضاً حجج من يرى من المحدثين أن كتابه لم يكن الأول: وصفه نفسه بالمختصر، وأنه لم يدّع الأولية، ونضج مصطلحاته، ووجود كتاب ابن ترك وكتاب مفقود لسند بن علي {cite:tdv-cebir pp. 195–201}."
        en: "The TDV encyclopaedia reports the broad agreement of historians that algebra became an independent science with al-Khwarizmi, and that later mathematicians such as Sinan ibn al-Fath acknowledged his priority; the only dissenter in his time was Abu Barza, who claimed the honour for his grandfather Abd al-Hamid ibn Wasi' ibn Turk and was firmly rebutted by Abu Kamil. It also gives the arguments of modern historians who think the book was not the first: it calls itself a summary, al-Khwarizmi does not claim to be first, its terms are already mature, and there were a book by Ibn Turk and a lost book by Sanad ibn Ali on the subject {cite:tdv-cebir pp. 195–201}."
        ur: "ٹی ڈی وی انسائیکلوپیڈیا مؤرخین کے عمومی اتفاق کا ذکر کرتا ہے کہ الجبرا خوارزمی کے ساتھ ایک مستقل علم بنا، اور بعد کے ریاضی دانوں جیسے سنان بن الفتح نے ان کی اولیت تسلیم کی؛ ان کے زمانے میں واحد مخالف ابو برزہ تھے، جنہوں نے یہ اعزاز اپنے دادا عبد الحمید بن واسع بن ترک کے لیے مانگا اور ابو کامل نے سختی سے اس کا رد کیا۔ وہ ان جدید مؤرخین کے دلائل بھی دیتا ہے جن کے خیال میں یہ کتاب پہلی نہ تھی: یہ خود کو مختصر کہتی ہے، خوارزمی اولیت کا دعویٰ نہیں کرتے، اس کی اصطلاحات پختہ ہیں، اور اس موضوع پر ابن ترک کی ایک کتاب اور سند بن علی کی ایک گم شدہ کتاب موجود تھی {cite:tdv-cebir pp. 195–201}۔"
      sources: [source/tdv-cebir]
precursors:
  - external:
      ar: "معادلات الدرجة الأولى في بردية أحمس المصرية"
      en: "First-degree equations in the Egyptian Ahmes (Rhind) papyrus"
      ur: "مصری احمس ⁦(رائنڈ)⁩ پیپرس میں یک درجی مساواتیں"
    note: "The Cairo editors: the Ahmes papyrus of about 1700 BCE, the oldest surviving school book, has a first-degree equation in one unknown with a special sign for the unknown, and signs of linear simultaneous equations; later Egyptian texts have quadratic problems."
    sources: [source/khwarizmi-jabr-cairo-1939]
  - external:
      ar: "جداول المربعات والمكعبات البابلية"
      en: "Babylonian tables of squares and cubes"
      ur: "بابلی مربعوں اور مکعبوں کے جدول"
    note: "The Cairo editors: the ancient Babylonians made tables of squares and cubes, some of which survive in the Senkereh tablets, contemporary with the Ahmes papyrus."
    sources: [source/khwarizmi-jabr-cairo-1939]
  - external:
      ar: "الحلول الهندسية والتحليلية عند اليونان: إقليدس وهيرون وديوفانتوس"
      en: "Greek geometric and analytic solutions: Euclid, Heron and Diophantus"
      ur: "یونانیوں کے ہندسی اور تحلیلی حل: اقلیدس، ہیرون اور دیوفانتوس"
    note: "The Cairo editors: Euclid has problems that amount to geometric solutions of quadratics, Heron of Alexandria gives the first analytic solution one can be sure of, and Diophantus knew the analytic solution of quadratics with positive coefficients but did not study their types in an ordered way as al-Khwarizmi does. TDV: Diophantus's Arithmetica was translated into Arabic by Qusta ibn Luqa as Sina'at al-jabr and had a large influence on later Islamic algebra."
    sources: [source/khwarizmi-jabr-cairo-1939, source/tdv-cebir]
  - external:
      ar: "قواعد الهنود في حل المعادلات: آريابهاتا وبراهماغوبتا وماهافيرا"
      en: "Indian rules for solving equations: Aryabhata, Brahmagupta and Mahavira"
      ur: "مساوات حل کرنے کے ہندی قاعدے: آریہ بھٹ، برہما گپت اور مہاویر"
    note: "The Cairo editors: Aryabhata must have known the solution of quadratics; Brahmagupta in the seventh century gave a rule in words for solving them; Mahavira, al-Khwarizmi's contemporary, also gave rules. TDV: the methods of double false position and of working backwards, and some word-problem types in Islamic algebra books, came from Indian works."
    sources: [source/khwarizmi-jabr-cairo-1939, source/tdv-cebir]
dependents:
  - external:
      ar: "شروح كتاب الخوارزمي: سنان بن الفتح وعبد الله بن الحسن الصيدناني وأبو الوفاء البوزجاني"
      en: "Commentaries on al-Khwarizmi's book by Sinan ibn al-Fath, Abd Allah ibn al-Hasan al-Saydanani and Abu al-Wafa' al-Buzjani"
      ur: "خوارزمی کی کتاب کی شرحیں: سنان بن الفتح، عبد اللہ بن الحسن صیدنانی اور ابو الوفاء بوزجانی"
    note: "The Cairo editors, from the Fihrist: Ibn al-Nadim names at least three men who wrote commentaries on Muhammad ibn Musa's book on algebra."
    sources: [source/khwarizmi-jabr-cairo-1939]
  - external:
      ar: "كتاب الجبر والمقابلة لأبي كامل شجاع بن أسلم"
      en: "Abu Kamil Shuja' ibn Aslam's Kitab al-Jabr wal-Muqabala"
      ur: "ابو کامل شجاع بن اسلم کی «کتاب الجبر والمقابلہ»"
    note: "The Cairo editors: Abu Kamil (about 925 CE) names al-Khwarizmi plainly as one of his sources. Ibn Khaldun puts him next after al-Khwarizmi. TDV: he grounded algebra in Euclidean geometry, used irrational numbers, and solved Euclid's geometric problems by algebra."
    sources: [source/khwarizmi-jabr-cairo-1939, source/muqaddima-ibn-khaldun, source/tdv-cebir]
  - external:
      ar: "جبر الكرجي في «الفخري» وجبر السموأل في «الباهر»"
      en: "Al-Karaji's algebra in al-Fakhri and al-Samaw'al's in al-Bahir"
      ur: "کرجی کا الجبرا «الفخری» میں اور سموأل کا «الباہر» میں"
    note: "TDV: al-Karaji (d. after 410 AH) founded the school that made algebra arithmetical, freed it from Euclidean geometry and worked on the expansion of (x + 1) to the power n; his pupil al-Samaw'al ibn Yahya al-Maghribi (d. 570 AH) wrote numbers and quantities with letters in an abstract style."
    sources: [source/tdv-cebir]
  - external:
      ar: "تصنيف عمر الخيام لمعادلات الدرجة الثالثة"
      en: "Umar al-Khayyam's classification of cubic equations"
      ur: "عمر خیام کی سہ درجی مساواتوں کی درجہ بندی"
    note: "The Cairo editors: Umar ibn Ibrahim al-Khayyam (1045–1123 CE) quotes Ibn Musa without needing to name him. TDV: al-Khayyam was the first to classify third-degree equations systematically, into thirteen kinds, doing for them what al-Khwarizmi had done for first and second-degree equations, and solved them with conic sections."
    sources: [source/khwarizmi-jabr-cairo-1939, source/tdv-cebir]
  - external:
      ar: "شروح أهل الأندلس ومنها شرح القرشي"
      en: "The Andalusian commentaries, among them al-Qurashi's"
      ur: "اہلِ اندلس کی شرحیں، جن میں قرشی کی شرح بھی ہے"
    note: "Ibn Khaldun: many Andalusians wrote fine commentaries on al-Khwarizmi's book, and among the best is al-Qurashi's; he also heard that a mathematician of the East took the equations beyond the six kinds to more than twenty, with geometric proofs."
    sources: [source/muqaddima-ibn-khaldun]
  - external:
      ar: "الترجمة اللاتينية لروبرت أوف تشستر وكلمة «algebra»"
      en: "Robert of Chester's Latin translation and the word 'algebra'"
      ur: "رابرٹ آف چیسٹر کا لاطینی ترجمہ اور لفظ «الجبرا»"
    note: "The Cairo editors: Robert of Chester translated the book into Latin, and L. C. Karpinski published an English version of that translation in 1915; the name of the science in all the world's languages comes from the Arabic word al-jabr that al-Khwarizmi used as the name of his book. TDV: the word passed into Western languages as algebra."
