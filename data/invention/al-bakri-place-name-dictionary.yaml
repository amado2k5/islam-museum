origin:
  place: place/cordoba
  context:
    ar: "ألف البكري معجمه في قرطبة حيث جمع الفقه والحديث والأدب وجمع فيها أسانيده؛ عنوان الطبعة يصفه بالفقيه الحافظ الأديب
      الوزير، وتسجل الموسوعات دراسته في قرطبة وإجازاته فيها {cite:mujam-ma-istaajam-bakri scan pp. 13–16} {cite:tdv-ebu-ubeyd-el-bekri}."
    en: "Al-Bakri compiled his dictionary in Córdoba, where he gathered fiqh, hadith and letters and collected his licences;
      the edition's title page styles him the jurist, hafiz, man of letters and vizier, and encyclopaedias record his
      Cordoban studies and ijazas {cite:mujam-ma-istaajam-bakri scan pp. 13–16} {cite:tdv-ebu-ubeyd-el-bekri}."
    ur: "بکری نے اپنی لغت قرطبہ میں مرتب کی جہاں اس نے فقہ، حدیث اور ادب جمع کیا اور اپنی اجازات حاصل کیں؛ ایڈیشن کا صفحۂ
      عنوان اسے فقیہ، حافظ، ادیب اور وزیر کہتا ہے، اور دائرۃ المعارف اس کی قرطبہ کی تعلیم و اجازات درج کرتی ہیں {cite:mujam-ma-istaajam-bakri
      scan pp. 13–16} {cite:tdv-ebu-ubeyd-el-bekri}۔"
makers:
  - person: person/al-bakri-abu-ubayd
    role: inventor
    note: "Compiled the dictionary in Córdoba in his later years; the 1876 edition's title page styles him al-faqih
      al-hafiz al-adib al-wazir, and TDV records his Cordoban studies and fiqh/hadith ijaza from Ibn Abd al-Barr. As far as
      the sources read show, he was the first to apply an alphabetical ordering to a geographical dictionary {cite:mujam-ma-istaajam-bakri
      scan pp. 13–16} {cite:tdv-cografya}."
    sources: [source/mujam-ma-istaajam-bakri, source/tdv-ebu-ubeyd-el-bekri, source/tdv-cografya]
attribution:
  status: original
  claim:
    ar: "صنف القواميس اللغوية العربي قديم؛ لكن تطبيق نظام الترتيب الأبجدي على معجم جغرافي جامع — يضم المنازل والجبال والمياه
      والآبار ويحلّ اختلاف الروايات — أول عمل من نوعه في المصادر المقروءة، فصاغه البكري في الأندلس قبل وفاته سنة ٤٨٧هـ."
    en: "The Arabic alphabetical dictionary genre is old, but applying that ordering to a comprehensive geographical dictionary
      — settlements, mountains, waters and wells with variant readings resolved — is the first work of its kind in the
      sources read, which al-Bakri composed in al-Andalus before his death in 487 AH."
    ur: "عربی حروف تہجی والی لغات کی صنف قدیم ہے، لیکن اسی ترتیب کو ایک جامع جغرافیائی لغت پر لاگو کرنا — دیہات، پہاڑ، پانی اور
      کنویں جن میں روایتوں کے اختلافات حل کیے گئے — پڑھے گئے ماخذوں میں پہلی نوع ہے، جسے البکری نے 487ھ میں اپنی وفات سے
      پہلے اندلس میں مرتب کیا۔"
  basis:
    ar: "يصرّح البكري في مقدمته أنه جمع الأسماء من الحديث والأخبار والتواريخ والأشعار لأنه رأى استعجامها على الناس، ورتّب
      أبواب الكتاب على حروف المعجم {cite:mujam-ma-istaajam-bakri scan pp. 14–18}. ويدرج مدخل COĞRAFYA في موسوعة TDV أن البكري طبق نظام
      الأبجدية العربية على كتاب جغرافي أول مرة بقدر علمها، وأن أول معجم جغرافي أبجدي في أوروبا لم يأت إلا في القرن السادس عشر
      {cite:tdv-cografya}. ويصف ديزي العمل بأنه فريد في نوعه ولا غنى عنه {cite:mujam-ma-istaajam-bakri scan p. 8}."
    en: "Al-Bakri states in his introduction that he gathered the names from hadith, reports, histories and poetry because he
      saw them grow obscure to people, and ordered the book's chapters alphabetically {cite:mujam-ma-istaajam-bakri scan pp.
      14–18}. The TDV geography article records that al-Bakri applied the Arabic alphabetical system to a geographical
      book for the first time as far as is known, and that Europe's first alphabetical geographical encyclopaedia did not
      appear until the sixteenth century {cite:tdv-cografya}. Dozy calls the work unique in its kind and indispensable
      {cite:mujam-ma-istaajam-bakri scan p. 8}."
    ur: "البکری اپنے دیباچے میں بتاتا ہے کہ اس نے نام حدیث، اخبارات، تاریخوں اور شاعری سے جمع کیے کیونکہ اس نے دیکھا کہ یہ لوگوں
      پر استعجام ہو گئے ہیں، اور کتاب کے ابواب حروفِ معجم پر ترتیب دیے {cite:mujam-ma-istaajam-bakri scan pp. 14–18}۔ ٹی
      ڈی وی کا جغرافیہ مضمون درج کرتا ہے کہ البکری نے بقدر معلوم پہلی بار عربی حروف تہجی کا نظام جغرافیائی کتاب پر لاگو کیا،
      اور یورپ کی پہلی حروف تہجی والی جغرافیائی دائرة المعارف سولہویں صدی تک نہیں آئی {cite:tdv-cografya}۔ Dozy اس کام کو اپنی
      نوع میں منفرد اور ناگزیر کہتا ہے {cite:mujam-ma-istaajam-bakri scan p. 8}۔"
precursors:
  - external:
      ar: "صناعة القواميس اللغوية العربية — الترتيب على حروف المعجم الذي سبقه في كتب اللغة، ونقله البكري إلى حقل الأسماء
        الجغرافية."
      en: "The Arabic lexicographical tradition — alphabetical ordering on the mu'jam letters already established in language
        dictionaries, which al-Bakri transferred to the field of place-names."
      ur: "عربی لغویات کی روایت — حروفِ معجم پر ترتیب جو پہلے سے زبان کی لغات میں قائم تھی، جسے البکری نے نامِ اماکن کے شعبے
        میں منتقل کیا۔"
    note: "The author's introduction orders chapters by the alphabet's letters; the letter-order table survives at the front
      of the edition {cite:mujam-ma-istaajam-bakri scan pp. 14–16}."
    sources: [source/mujam-ma-istaajam-bakri, source/tdv-ebu-ubeyd-el-bekri]
  - external:
      ar: "مدونات الأسماء الجغرافية المتفرقة — في الحديث والأخبار والتواريخ والأشعار ومصنفات الجغرافيا والأنساب التي جمعها
        البكري في كتاب واحد."
      en: "The scattered toponymic corpus — place-names dispersed through hadith, reports, histories, poetry, geography and
        genealogy works that al-Bakri gathered into one book."
      ur: "نامِ اماکن کا بکھرا ہوا ذخیرہ — حدیث، اخبار، تاریخ، شاعری، جغرافیہ اور انساب کی کتابوں میں پھیلے نام جنہیں البکری
        نے ایک کتاب میں جمع کیا۔"
    note: "The introduction lists the source genres and gives the Jazirat al-Arab tribal geography as its opening frame
      {cite:mujam-ma-istaajam-bakri scan pp. 14–18}."
    sources: [source/mujam-ma-istaajam-bakri]
dependents:
  - external:
      ar: "معجم البلدان لياقوت الحموي، وهو معجم جغرافي أكبر في القرن السابع الهجري، وملاحظة ويستنفلد أن ياقوتاً بحث عن كتاب
        البكري فلم يجده."
      en: "Yaqut al-Hamawi's Mu'jam al-Buldan, the larger geographical dictionary of the seventh century AH; Wüstenfeld notes
        that Yaqut searched for al-Bakri's book and could not find it."
      ur: "یاقوت الحموی کی «معجم البلدان»، ساتویں صدی ہجری کی بڑی جغرافیائی لغت؛ وےسٹنفلڈ نوٹ کرتا ہے کہ یاقوت البکری کی کتاب
        تلاش کرتا رہا مگر نہ ملی۔"
    note: "Wüstenfeld's preface records Yaqut's unsuccessful search for the work {cite:mujam-ma-istaajam-bakri scan pp. 7–12};
      the genre's later flowering is documented in the edition's reception notes."
    sources: [source/mujam-ma-istaajam-bakri]
  - external:
      ar: "المعاجم الجغرافية العربية اللاحقة، وأول دائرة معارف جغرافية أبجدية في أوروبا في القرن السادس عشر حسب مدخل COĞRAFYA."
      en: "Later Arabic geographical dictionaries, and Europe's first alphabetical geographical encyclopaedia in the sixteenth
        century per the TDV geography article."
      ur: "بعد کی عربی جغرافیائی لغاتیں، اور ٹی ڈی وی کے جغرافیہ مضمون کے مطابق یورپ کی پہلی حروف تہجی والی جغرافیائی دائرة
        المعارف سولہویں صدی میں۔"
    note: "The TDV COĞRAFYA entry states the alphabetical geography book first appeared with al-Bekri and that Europe's
      equivalent waited until the sixteenth century {cite:tdv-cografya}."
    sources: [source/tdv-cografya]
spread: []
impact:
  fields: [navigation-geography]
  changed:
    ar: "حوّل الأسماء الجغرافية المبعثرة في التراث إلى مرجع واحد مرتب، فصار المسافر والمحدث والنسّاب يجدون الموضع وقراءاته
      المتعددة في مدخل واحد تحت حرفه."
    en: "It turned place-names scattered through the tradition into one ordered reference, so the traveller, hadith scholar
      and genealogist could find a place and its variant readings under a single alphabetical entry."
    ur: "اس نے تراث میں بکھرے ہوئے جغرافیائی ناموں کو ایک مرتب شدہ ماخذ میں ڈھالا، تاکہ مسافر، محدث اور نسب شناس ایک ہی
      حرفی اندراج میں مقام اور اس کی مختلف روایات پا سکے۔"
  history:
    ar: "أثبت أن ترتيب القواميس يصلح لعلم الأمكنة لا للغة وحدها، وفتح طريق المعاجم الجغرافية الكبرى كمعجم ياقوت، وبقي
      الكتاب يُقرأ في طبعات ويستنفلد والقاهرة حتى اليوم."
    en: "It proved dictionary ordering suited the science of places, not only language, and opened the way for the great
      geographical dictionaries such as Yaqut's; the book is still read in the Wüstenfeld and Cairo editions."
    ur: "اس نے ثابت کیا کہ لغات کی ترتیب صرف زبان کے لیے نہیں بلکہ علمِ اماکن کے لیے بھی موزوں ہے، اور عظیم جغرافیائی
      لغات کی راہ کھولی جیسے یاقوت کی؛ یہ کتاب آج بھی ویسٹنفلڈ اور قاہرہ کے ایڈیشنوں میں پڑھی جاتی ہے۔"
  significance: 3
  why: "A documented first of its kind — the alphabetically ordered geographical dictionary — resting on an inherited
    toponymic corpus; the rating reflects the work's unique genre and continued use, not invention of lexicography itself."
