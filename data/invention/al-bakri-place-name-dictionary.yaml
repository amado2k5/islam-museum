kids:
  ar: "تخيّل أن شخصاً في الأندلس قبل ألف سنة جمع كل أسماء القرى والجبال والآبار التي وردت في الحديث والأخبار والشعر في
    كتاب واحد، ورتّبها على حروف الأبجدية كما في المعجم. سمّاه «معجم ما استعجم» لأنه رأى أن هذه الأسماء صارت غامضة على الناس،
    ففسّرها له ليعرف كل موضع."
  en: "Imagine that a man in al-Andalus a thousand years ago collected every name of a village, mountain and well that
    appeared in hadith, reports and poetry into one book, and ordered them alphabetically like a dictionary. He called it
    'Mu'jam ma Ista'jam' because he saw these names had grown obscure to people, and he explained each so every place could
    be known."
  ur: "سوچو کہ ایک ہزار سال پہلے اندلس کا ایک شخص حدیث، اخبار اور شاعری میں آئے دیہات، پہاڑوں اور کنوئیں کے تمام نام ایک
