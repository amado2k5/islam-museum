today:
  form:
    ar: "لا يُستخدم المعجم اليوم في السفر اليومي، لكنه يبقى مرجعاً للباحثين في الأسماء الجغرافية العربية؛ وهو باقٍ في طبعة
      ويستنفلد سنة ١٨٧٦ ⁦(مجلدان⁩ وطبعة الصقاع القاهرية ١٩٤٥–٥١ ⁦(أربعة مجلدات⁩ {cite:mujam-ma-istaajam-bakri scan pp. 7–12}."
    en: "The dictionary is not used for everyday travel today, but it remains a reference for scholars of Arabic place-names;
      it survives in the 1876 Wüstenfeld edition ⁦(two volumes⁩ and the 1945–51 al-Saqqa Cairo edition ⁦(four volumes⁩
      {cite:mujam-ma-istaajam-bakri scan pp. 7–12}."
    ur: "یہ لغت آج روزمرہ کے سفر کے لیے استعمال نہیں ہوتی، مگر عربی جغرافیائی ناموں کے محققین کے لیے ماخذ بنی ہوئی ہے؛ یہ
      1876ء کے ویسٹنفلڈ ایڈیشن ⁦(دو جلدیں⁩ اور 1945–51ء کے قاہرہ ایڈیشن ⁦(چار جلدیں⁩ میں محفوظ ہے {cite:mujam-ma-istaajam-bakri
      scan pp. 7–12}۔"
  descendants:
    ar: "قاد معجمه الطريقة لمؤلفات جغرافية منظمة لاحقة في العربية، وأول معجم جغرافي أبجدي أوروبي جاء بعده بقرون حسب مدخل
      COĞRAFYA."
    en: "His dictionary set the pattern for later organised geographical works in Arabic, and Europe's first alphabetical
      geographical encyclopaedia came centuries after him per the TDV geography article."
    ur: "اس کی لغت نے بعد کے منظم جغرافیائی کاموں کے لیے نمونہ بنایا، اور اس کے صدیوں بعد TDV کے مطابق یورپ کی پہلی حروف
      تہجی والی جغرافیائی دائرة المعارف آئی۔"
