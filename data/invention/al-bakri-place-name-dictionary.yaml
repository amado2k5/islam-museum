summary:
  ar: "معجم أبو عبيد البكري الأندلسي في الأسماء الجغرافية، رتّب فيه المنازل والديار والقرى والأمصار والجبال والمياه والآبار على
    حروف المعجم على طريقة المغاربة، وجمع الأسماء من الحديث والأخبار والتواريخ والأشعار وحلّ اختلاف الروايات عن المواضع؛ يعدّ
    مصنفاً موسوعياً في الجغرافيا ألف في الأندلس قبل سنة ٤٨٧هـ {cite:mujam-ma-istaajam-bakri scan pp. 14–18} {cite:tdv-ebu-ubeyd-el-bekri}
    {cite:tdv-cografya}."
  en: "Abu Ubayd al-Bakri of al-Andalus's dictionary of geographical names, ordering settlements, abodes, villages, cities,
    mountains, waters and wells alphabetically on the Maghribi letter order, and gathering the names from hadith, reports,
    histories and poetry while resolving variant readings of places; an encyclopaedic geography composed in al-Andalus
    before 487 AH {cite:mujam-ma-istaajam-bakri scan pp. 14–18} {cite:tdv-ebu-ubeyd-el-bekri} {cite:tdv-cografya}."
  ur: "ابو عبید البکری الأندلسی کی جغرافیائی ناموں کی لغت، جس میں آباد کاری کے مقامات، دیہات، قصبے، شہر، پہاڑ، پانی اور
    کنویں مغربی حروفِ تہجی کی ترتیب پر ترتیب دیے گئے، اور نام حدیث، اخبار، تاریخوں اور شاعری سے جمع کیے گئے، مقامات کی
    مختلف روایات حل کی گئیں؛ اندلس میں 487ھ سے پہلے مرتب کردہ ایک دائرۃ المعارف الجغرافیہ {cite:mujam-ma-istaajam-bakri scan
    pp. 14–18} {cite:tdv-ebu-ubeyd-el-bekri} {cite:tdv-cografya}۔"
  es: "Abu Ubayd al-Bakri del Diccionario de Nombres Geográficos de al-Andalus, ordenando alfabéticamente asentamientos, moradas, aldeas, ciudades, montañas, aguas y pozos según el orden de las letras magrebíes; una geografía enciclopédica compuesta en al-Andalus antes del 487 d. H. {cita:mujam-ma-istaajam-bakri scan págs. 14-18} {cita:tdv-ebu-ubeyd-el-bekri} {cita:tdv-cografya}."
  fr: "Dictionnaire des noms géographiques d'Abu Ubayd al-Bakri d'al-Andalus, classant par ordre alphabétique les établissements, les demeures, les villages, les villes, les montagnes, les eaux et les puits selon l'ordre alphabétique maghrébin, et rassemblant les noms tirés des hadiths, des rapports, des histoires et de la poésie tout en résolvant les variantes de lecture des lieux; une géographie encyclopédique composée en al-Andalus avant 487 AH {cite:mujam-ma-istaajam-bakri scan pp. 14–18} {cite:tdv-ebu-ubeyd-el-bekri} {cite:tdv-cografya}."
  tr: "Ebu Ubeyd el-Bakri el-Endülüs'ün coğrafi isimler sözlüğü, evleri, konutları, köyleri, şehirleri, dağları, suları ve kuyuları Mağribi yöntemine göre alfabetik olarak sıraladığı, hadislerden, haberlerden, tarihlerden ve şiirlerden isimler derlediği ve yer adlarıyla ilgili anlatımlardaki farklılıkları giderdiği bir eserdir; Hicri 487 yılından önce Endülüs'te yazılmış ansiklopedik bir coğrafya eseri olarak kabul edilir. {cite:mujam-ma-istaajam-bakri scan pp. 14–18} {cite:tdv-ebu-ubeyd-el-bekri} {cite:tdv-cografya}."
  id: "Kamus nama-nama geografis karya Abu Ubayd al-Bakri al-Andalusi, di mana ia menyusun rumah, tempat tinggal, desa, kota, gunung, perairan, dan sumur secara alfabetis menurut metode Maghreb, dan mengumpulkan nama-nama dari hadits, berita, tanggal, dan puisi serta menyelesaikan perbedaan dalam catatan tentang tempat-tempat; karya ini dianggap sebagai karya ensiklopedia dalam bidang geografi yang ditulis di Andalusia sebelum tahun 487 H {cite:mujam-ma-istaajam-bakri scan pp. 14–18} {cite:tdv-ebu-ubeyd-el-bekri} {cite:tdv-cografya}."
