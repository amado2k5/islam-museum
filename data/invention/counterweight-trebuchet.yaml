summary:
  ar: "أثقل آلات الحصار: ذراع طويلة نحو عشرين متراً على محمل، صندوق ثقل من رصاص أو حديد أو حجارة ⁦(10-30 طناً)⁩ في الطرف القصير، ومقلاع بطول الذراع في الطرف الطويل، يرمي حتى نحو ثلاثمائة متر؛ وثّقها الاستعمال الإسلامي في حمص ⁦(646/1248)⁩ وعكا ⁦(690/1291)⁩، وأصلها متنازع بين الصين والبيزنطة والغرب الإسلامي أو اللاتيني {cite:encyclopaedia-of-islam-2 vol. VI pp. 425-426 MANDJANIK}."
  en: "The heaviest of the siege engines: a twenty-metre beam on a fulcrum, a counterweight box of lead, iron or stone ⁦(10-30 tonnes)⁩ on the short arm, a beam-length sling on the long arm, throwing to about three hundred metres; Islamic use is documented at Hims ⁦(646/1248)⁩ and Acre ⁦(690/1291)⁩, and its origin is contested between China, Byzantium and western Islam or Latin Christendom {cite:encyclopaedia-of-islam-2 vol. VI pp. 425-426 MANDJANIK}."
  ur: "محاصروں کی بھاری ترین مشین: بیس میٹر کا ڈنڈا ایک محور پر، چھوٹے بازو پر وزنی صندوق ⁦(10-30 ٹن)⁩ اور لمبے بازو پر پھلانگ، تین سو میٹر تک پھینکتا؛ اسلامی استعمال حمص ⁦(646/1248)⁩ اور عکا ⁦(690/1291)⁩ میں موثق، اور اصل چین، بازنطیم یا مغربی اسلام/لاطینی مسیحیت میں متنازع ہے {cite:encyclopaedia-of-islam-2 vol. VI pp. 425-426 MANDJANIK}۔"
  es: "La más pesada de las máquinas de asedio: una viga de veinte metros sobre un punto de apoyo, una caja de contrapeso de plomo, hierro o piedra (10-30 toneladas) en el brazo corto, una honda de la longitud de la viga en el brazo largo, con un alcance de unos trescientos metros; su uso islámico está documentado en Hims (646/1248) y Acre (690/1291), y su origen es objeto de disputa entre China, Bizancio y el Islam occidental o la cristiandad latina {cite:encyclopaedia-of-islam-2 vol. VI pp. 425-426 MANDJANIK}."
  fr: "La plus lourde des machines de siège: une poutre de vingt mètres sur un point d'appui, un contrepoids en plomb, en fer ou en pierre (10 à 30 tonnes) sur le bras court, une fronde de la longueur de la poutre sur le bras long, projetant à environ trois cents mètres; son utilisation islamique est documentée à Hims (646/1248) et à Acre (690/1291), et son origine est contestée entre la Chine, Byzance et l'Islam occidental ou la chrétienté latine {cite:encyclopaedia-of-islam-2 vol. VI pp. 425-426 MANDJANIK}."
  tr: "En ağır kuşatma makineleri: yaklaşık yirmi metre uzunluğunda, sapan üzerinde uzun bir kol, kısa ucunda kurşun, demir veya taştan yapılmış bir ağırlık kutusu (10-30 ton) ve uzun ucunda kolun uzunluğunda, yaklaşık üç yüz metreye kadar fırlatabilen bir sapan; İslam dünyasında kullanımı Homs'ta (646/1248) ve Akka'da (690/1291) belgelenmiştir ve kökeni Çin, Bizans ve İslam veya Latin Batı arasında tartışmalıdır {cite:encyclopaedia-of-islam-2 vol. VI pp. 425-426 MANDCANIK}."
  id: "Mesin pengepungan terberat: lengan panjang sekitar dua puluh meter pada sebuah ketapel, kotak pemberat dari timah, besi, atau batu (10-30 ton) di ujung pendek, dan ketapel sepanjang lengan di ujung panjang, yang dapat melempar hingga sekitar tiga ratus meter; penggunaannya di dunia Islam didokumentasikan di Homs (646/1248) dan Acre (690/1291), dan asal-usulnya diperdebatkan antara Cina, Bizantium, dan Barat Islam atau Latin {cite:encyclopaedia-of-islam-2 vol. VI pp. 425-426 MANDJANIK}."
