    en: "Ayyubid-Mamluk Syria, where Abu'l-Fida documented the 'mandjanik maghribi' at the siege of Hims ⁦(646/1248)⁩ and where armies used the machines in numbers at Acre ⁦(690/1291)⁩ {cite:encyclopaedia-of-islam-2 vol. VI pp. 425-426 MANDJANIK}."
