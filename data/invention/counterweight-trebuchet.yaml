today:
  form:
    ar: "تُعاد بناؤه اليوم نماذجَ تعليمية في المتاحف والتجارب الهندسية؛ لا يستعمل حرباً منذ قرون {cite:encyclopaedia-of-islam-2}."
    en: "It is rebuilt today as teaching models in museums and engineering trials; it has not been used in war for centuries {cite:encyclopaedia-of-islam-2}."
    ur: "آج یہ عجائب گھروں اور انجینئرنگ آزمائشوں میں تدریسی ماڈل کے طور پر دوبارہ بنتا ہے؛ صدیوں سے جنگ میں استعمال نہیں ہوا {cite:encyclopaedia-of-islam-2}۔"
  descendants:
    ar: "خلفه المدفع؛ ويبقى في كتب تاريخ التقنية عنواناً لسؤال انتقال الأفكار بين الحضارات {cite:encyclopaedia-of-islam-2, cite:chevedden-counterweight-trebuchet-2000}."
    en: "Cannon succeeded it; it remains in the history of technology as a heading for the question of ideas travelling between civilisations {cite:encyclopaedia-of-islam-2} {cite:chevedden-counterweight-trebuchet-2000}."
    ur: "توپ نے اس کی جگہ لی؛ تاریخِ ٹیکنالوجی میں تہذیبوں کے درمیان خیالات کے سفر کے سوال کا عنوان رہا {cite:encyclopaedia-of-islam-2} {cite:chevedden-counterweight-trebuchet-2000}۔"
