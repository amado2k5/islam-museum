impact:
  fields: [military]
  changed:
    ar: "رفع وزن المقذوف ومداه من عشرات الرجال بالحبال إلى كتلة موازنة تدير ذراعاً عشرين متراً، فجعل حصار المدن أشدّ — من حمص إلى عكا إلى تلمسان {cite:encyclopaedia-of-islam-2}."
    en: "It lifted missile weight and range from the men-and-ropes machine to a counterweight swinging a twenty-metre beam, deepening the siege — from Hims to Acre to Tlemcen {cite:encyclopaedia-of-islam-2}."
    ur: "اس نے رسی کھینچنے والی مشین سے بڑھ کر وزنی متوازن بیس میٹر ڈنڈے تک پھینک کی طاقت دی، محاصرہ سخت کیا — حمص سے عکا اور تلمسان تک {cite:encyclopaedia-of-islam-2}۔"
  history:
    ar: "أعظم آلات الحصار قبل المدفع، وأصلها من أكثر مسائل انتقال التقنية جدلاً؛ وسجّل المتحف الاستعمال الموثق لا النسب المطلق {cite:encyclopaedia-of-islam-2, cite:chevedden-counterweight-trebuchet-2000}."
    en: "The greatest siege engine before cannon, and one of the most argued questions in the diffusion of technology; the museum records the documented use, not the absolute claim {cite:encyclopaedia-of-islam-2} {cite:chevedden-counterweight-trebuchet-2000}."
    ur: "توپ سے پہلے کی عظیم ترین محاصرہ مشین، اور ٹیکنالوجی کے انتقال کے زیادہ بحث شدہ سوال؛ عجائب گھر موثق استعمال لکھتا ہے، مطلق نسب نہیں {cite:encyclopaedia-of-islam-2} {cite:chevedden-counterweight-trebuchet-2000}۔"
  significance: 4
  why: "Documented Islamic use and engineering of the counterweight trebuchet — the 'maghribi' machine at Hims 1248, the batteries at Acre 1291, and its carriage to China — with the unresolved origin honestly recorded."
