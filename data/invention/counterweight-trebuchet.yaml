    note: "The Greek and Roman machines — possibly the type used at Ta'if in 8/630 — worked by stored torsion or bow energy; the beam engine succeeded them for siege work."
    sources: [source/encyclopaedia-of-islam-2]
dependents:
  - external: { ar: "«الفاو المسلم» في الصين", en: "The 'Muslim phao' in China", ur: "چین میں «مسلم پھاؤ»" }
    note: "Two Muslim engineers, Ala' al-Din and Isma'il, built counterweight trebuchets for Qubilay's siege of Fancheng toward the end of 1272; the machines were long known in China as 'Muslim phao' — almost certainly an introduction from the Islamic world."
    sources: [source/encyclopaedia-of-islam-2]
  - external: { ar: "أعظم آلات الحصار قبل المدفع", en: "The greatest pre-cannon siege artillery", ur: "توپ سے پہلے کی عظیم محاصرہ آرٹلری" }
    note: "Counterweight machines bombarded Tlemcen with marble balls in the eighth/fourteenth century — some recovered, the largest 230 kg — before cannon displaced them."
    sources: [source/encyclopaedia-of-islam-2]
