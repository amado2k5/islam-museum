    status: historical
    note: "The first report of counterweight-trebuchet use in Islam per EI2: the 'mandjanik maghribi' at the siege of Hims in 646/1248 (Abu'l-Fida). Mardi ibn Ali's slightly earlier treatise for Saladin describes only traction machines plus one 'Persian' machine that may be a counterweight type — unproven. The machine itself is documented in northern Italy in 1199; the origin is unresolved."
