  claim:
    ar: "الاستعمال والصقل الهندسي الموثقان في العالم الإسلامي — أول ظهور إسلامي ⁦(حمص 646/1248)⁩ واستعمال واسع ⁦(عكا 690/1291)⁩ ونقل إلى الصين ⁦(1272)⁩ — لا ادعاء الاختراع المطلق، فالأصل متنازع بين الصين والبيزنطة والغرب الإسلامي واللاتيني."
    en: "Documented use and engineering refinement in the Islamic world — first Islamic appearance at Hims ⁦(646/1248)⁩, massed use at Acre ⁦(690/1291)⁩ and transmission to China ⁦(1272)⁩ — not a claim of absolute invention, whose origin is contested between China, Byzantium and western Islam or Latin Christendom."
    ur: "عالمِ اسلام میں موثق استعمال اور انجینئرنگ تکمیل — پہلا اسلامی ظہور حمص ⁦(646/1248)⁩، عکا ⁦(690/1291)⁩ میں کثرت اور چین ⁦(1272ء)⁩ تک پہنچائ — مطلق ایجاد کا دعویٰ نہیں، جس کی اصل چین، بازنطیم اور مغربی اسلام/لاطینی مسیحیت میں متنازع ہے۔"
  basis:
    ar: "EI2 MANDJANIK: مسألة الأصل «لم تُحلّ بعد»؛ أقدم وصف واضح في أوروبا 1199، ووصف مردي بن علي قبله بسنوات منجنيقاً «فارسياً» قد يكون ذا ثقل، وأول استعمال إسلامي موثق حمص 646/1248 باسم «المغربي» — أي الغربي {cite:encyclopaedia-of-islam-2}."
    en: "EI2 MANDJANIK: the question of origin 'has not yet been resolved'; the earliest unambiguous European description is 1199, Mardi ibn Ali's slightly earlier 'Persian' trebuchet may be a counterweight machine, and the first documented Islamic use is the 'maghribi' — western — trebuchet at Hims 646/1248 {cite:encyclopaedia-of-islam-2}."
    ur: "EI2 MANDJANIK: اصل کا سوال «ابھی حل نہیں ہوا»؛ یورپ میں پہلی واضح دستاویز 1199ء، مردی بن علی کی «فارسی» منجنیق شاید وزنی ہو، اور پہلا اسلامی استعمال حمص 646/1248 میں «مغربی» یعنی مغرب والی منجنیق ہے {cite:encyclopaedia-of-islam-2}۔"
