kids:
  ar: "كانت أكبر آلات الحصار القديمة عصاً طويلة جداً تتحرك بسقوط صندوق مليء بالحجارة، فترمي صخرة كبيرة مسافة ثلاثمائة متر. استعملها جيوش المسلمين في حمص وعكا، ويقول المؤرخون إن أصلها ليس معروفاً تماماً — ربما جاءت من الصين أو من بلاد أخرى."
  en: "The biggest old siege machine was a very long arm moved by a falling box full of stones, throwing a big rock three hundred metres. Muslim armies used it at Hims and Acre, and historians say we are not certain where it was invented — perhaps China, perhaps somewhere else."
  ur: "سب سے بڑی پرانی محاصرہ مشین ایک لمبا بازو تھا جو پتھروں سے بھرے گرتے ڈبے سے چلتا اور تین سو میٹر دور پتھر پھینکتا۔ مسلمان فوجوں نے اسے حمص اور عکا میں استعمال کیا، اور مؤرخین کہتے ہیں کہ اس کی ایجاد کا مقام یقینی نہیں — شاید چین یا کہیں اور۔"
