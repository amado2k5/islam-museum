precursors:
  - external: { ar: "المنجنيق الجاذب ⁦(بالحبال)⁩", en: "The traction trebuchet", ur: "کھینچنے والی منجنیق" }
    note: "Chinese in origin no later than the fourth century BCE, diffused through the Turkish lands to the Middle East in the seventh century CE; Muslim armies used it from Mecca ⁦(64/683)⁩ and Daybul ⁦(92/711-12)⁩ to the siege of Baghdad ⁦(261/865-6)⁩."
