impact:
  fields: [medicine-surgery, institutions-systems]
  changed:
    ar: "نقل الرشيد نموذج مستشفى وأطباءه إلى بغداد؛ ثم تصف موسوعة TDV توسع شبكة المستشفيات في المدينة، وتذكر في القرن الرابع الهجري زيارات الأطباء للسجون وإرسال مستشفى متنقل إلى قرى السواد. هذه خدمات لاحقة، وليست مزايا موثقة لمنشأة الرشيد نفسها {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    en: "Harun brought a hospital model and its physicians to Baghdad. TDV subsequently describes a growing urban hospital network, prison visits and a mobile hospital for the Sawad villages in the tenth century. These are later services, not documented features of Harun's own foundation {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    ur: "ہارون نے ایک شفاخانے کا نمونہ اور اس کے طبیب بغداد منتقل کیے۔ ٹی ڈی وی بعد میں شہری شفاخانوں کے پھیلتے جال، دسویں صدی میں قیدیوں کے طبی معائنے اور سواد کے دیہات میں چلتے پھرتے شفاخانے کا ذکر کرتا ہے۔ یہ بعد کی خدمات ہیں، خود ہارون کے شفاخانے کی ثابت شدہ خصوصیات نہیں {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}۔"
  history:
    ar: "تصف الموسوعة العهد العباسي بأنه أول ازدهار للبيمارستانات، وتعد منشأة الرشيد مثالاً للمستشفيات اللاحقة؛ وفي قصتها تلتقي رعاية خليفة مسلم بخبرة أطباء مسيحيين وبالطب اليوناني والهندي {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri} {cite:tdv-buhtisu §introduction}."
    en: "The encyclopedia calls the Abbasid period the first flowering of bimaristans and Harun's foundation an example for later hospitals. Its story brings together a Muslim caliph's patronage, Christian physicians' expertise and Greek and Indian medical traditions {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri} {cite:tdv-buhtisu §introduction}."
    ur: "انسائیکلوپیڈیا عباسی دور کو بیمارستانوں کا پہلا عروج اور ہارون کے ادارے کو بعد کے شفاخانوں کا نمونہ کہتا ہے۔ اس کی کہانی میں مسلمان خلیفہ کی سرپرستی، عیسائی طبیبوں کی مہارت اور یونانی اور ہندی طب ملتی ہیں {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri} {cite:tdv-buhtisu §introduction}۔"
  significance: 3
  why: "A named transfer of a hospital model and medical expertise into the Abbasid capital, identified by TDV as an example for subsequent foundations. The limited evidence for this particular institution does not justify attributing the later network's detailed services to it."
