kids:
  ar: "أراد هارون الرشيد مستشفى في بغداد، فاستعان بأطباء جاءوا من جنديسابور حيث كان مستشفى أقدم. تقول الموسوعة إنه طلب بناءه على ذلك المثال. لم يخترع الرشيد الطب ولا المستشفى؛ كان صاحب التكليف، وكان للأطباء عملهم الخاص الذي نذكره بأسمائهم. ولم يصلنا من هذا المصدر رسم يبين غرف مستشفاه."
  en: "Harun al-Rashid wanted a hospital in Baghdad and turned to physicians from Jundishapur, where there was an older hospital. The encyclopedia says he had one built on that model. He did not invent medicine or hospitals: he commissioned the institution, and the doctors had their own work, for which we name them. This source gives us no drawing of its rooms."
  ur: "ہارون الرشید بغداد میں ایک شفاخانہ چاہتے تھے۔ انہوں نے جندیشاپور کے طبیبوں کی مدد لی، جہاں پہلے سے شفاخانہ تھا۔ انسائیکلوپیڈیا کہتا ہے کہ انہوں نے اسی نمونے پر شفاخانہ بنوایا۔ ہارون نے طب یا شفاخانہ ایجاد نہیں کیا؛ انہوں نے اسے بنوانے کا حکم دیا، اور طبیبوں کا اپنا کام تھا جسے ان کے نام کے ساتھ یاد کیا جاتا ہے۔ اس ماخذ میں اس کے کمروں کا نقشہ نہیں ملتا۔"
