origin:
  place: place/baghdad
  polity: polity/abbasid-caliphate
  context:
    ar: "سبق انتقالُ أطباء جنديسابور إلى البلاط إنشاءَ المستشفى: استدعى المنصور جرجيس بن بختيشوع سنة 148هـ/765م، ثم جاءت منشأة الرشيد على قناة كرخايا. وفي بغداد أيضاً أقام البرامكة مستشفى آخر يرتبط بالطب الهندي {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    en: "Medical migration preceded the foundation: al-Mansur summoned Jirjis ibn Bukhtishu from Jundishapur in 148 AH/765; Harun later commissioned the Kerhaya hospital. The Barmakids also founded a separate Baghdad hospital associated with Indian medicine {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    ur: "طبیبوں کی آمد شفاخانے سے پہلے ہوئی: منصور نے 148ھ/765ء میں جرجیس بن بختیشوع کو جندیشاپور سے بلایا؛ بعد میں ہارون نے کرخایا کا شفاخانہ بنوایا۔ برامکہ نے بھی بغداد میں ہندی طب سے وابستہ ایک الگ شفاخانہ بنایا {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}۔"
makers:
  - person: person/harun-al-rashid
    role: commissioner
    place: place/baghdad
    note: "The patron who commissioned the hospital, not the inventor of its clinical methods or the physician who directed it. TDV names Jibril ibn Bukhtishu in its establishment and Abu Yuhanna Masawayh and his son in its direction."
    sources: [source/tdv-bimaristan]
attribution:
  status: transmission
  claim:
    ar: "تكليف هارون الرشيد بإنشاء بيمارستان في بغداد على مثال جنديسابور."
    en: "Harun al-Rashid's commissioning of a Baghdad hospital on the Jundishapur model."
    ur: "جندیشاپور کے نمونے پر بغداد میں ہارون الرشید کا شفاخانہ قائم کرنا۔"
  basis:
    ar: "تصف موسوعة TDV المنشأة صراحة بأنها على مثال جنديسابور، وتقول إنها أول بيمارستان أسسه الرشيد في بغداد وإنها صارت مثالاً لما أُنشئ بعدها؛ ولا تعطي سنة افتتاح ولا وصفاً لمخططها أو أجنحتها. لذلك يُسجَّل النقل المؤسسي وصاحب التكليف، لا أولوية اختراع المستشفى ولا اختراع ممارسة طبية {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    en: "TDV explicitly describes the foundation as following Jundishapur, calls Harun the founder of Baghdad's first bimaristan and says it provided an example for later hospitals. It supplies neither an opening year nor a plan or list of wards. The record therefore concerns institutional transmission and patronage, not priority in inventing hospitals or a clinical technique {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    ur: "ٹی ڈی وی اسے صاف طور پر جندیشاپور کے نمونے پر قائم بتاتا ہے، ہارون کو بغداد کے پہلے بیمارستان کا بانی کہتا ہے اور اسے بعد کے شفاخانوں کا نمونہ قرار دیتا ہے۔ مگر افتتاح کا سال، نقشہ یا وارڈوں کی فہرست نہیں دیتا۔ اس لیے ریکارڈ ادارے کی منتقلی اور سرپرستی کا ہے، شفاخانے یا طبی طریقے کی ایجاد کی اولیت کا نہیں {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}۔"
  perspectives: []
