today:
  form:
    ar: "لا تحدد الموسوعة زمن توقف هذا المستشفى، ولا تعرض له أثراً باقياً. استمر اسم البيمارستان في تاريخ المستشفيات، وتقول مقدمتها إن اللفظ الشائع في العالم العربي اليوم هو المستشفى {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri} {cite:tdv-bimaristan introduction}."
    en: "The encyclopedia does not establish when this hospital ceased operating or identify a surviving remnant. Bimaristan belongs to the history of hospitals; its introduction notes that mustashfa is the term now common in the Arab world {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri} {cite:tdv-bimaristan introduction}."
    ur: "انسائیکلوپیڈیا اس شفاخانے کے بند ہونے کا وقت یا کوئی باقی نشان نہیں بتاتا۔ بیمارستان شفاخانوں کی تاریخ کا نام ہے؛ تعارف کے مطابق آج عرب دنیا میں مستشفیٰ کا لفظ عام ہے {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri} {cite:tdv-bimaristan introduction}۔"
  descendants:
    ar: "البيمارستانات العباسية اللاحقة؛ والتاريخ الأوسع للمستشفيات، دون إثبات سلسلة مباشرة من هذه المنشأة إلى مستشفى حديث بعينه {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    en: "Later Abbasid bimaristans and the wider history of hospitals, without a demonstrated direct line from this foundation to a particular modern hospital {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}."
    ur: "بعد کے عباسی بیمارستان اور شفاخانوں کی وسیع تاریخ؛ اس ادارے سے کسی خاص جدید ہسپتال تک براہ راست سلسلہ ثابت نہیں {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}۔"
