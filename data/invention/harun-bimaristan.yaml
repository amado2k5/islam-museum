id: invention/harun-bimaristan
class: invention
label:
  ar: "بيمارستان هارون الرشيد في بغداد"
  en: "Harun al-Rashid's Baghdad bimaristan"
  ur: "بغداد میں ہارون الرشید کا بیمارستان"
names:
  - { value: "بيمارستان الرشيد", kind: alternate, lang: ar }
  - { value: "Harun's hospital on the Kerhaya canal", kind: alternate, lang: en }
summary:
  ar: "تذكر موسوعة TDV أن هارون الرشيد، في خلافته بين 786 و809م، استقدم جبرائيل بن بختيشوع إلى بغداد وأمر بإنشاء مستشفى على قناة كرخايا على مثال مستشفى جنديسابور، وجلب أبا يوحنا ماسويه لإدارته، ثم خلفه ابنه يوحنا {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}. يسجل المتصفح الرشيد بصفته صاحب التكليف، ويصنف العمل نقلاً لنموذج سابق، لا اختراعاً للمستشفى؛ وتبقى مساهمة الأطباء المسيحيين مسماة في القصة {cite:tdv-buhtisu §introduction}."
  en: "TDV records that during his reign, 786–809, Harun al-Rashid summoned Jibril ibn Bukhtishu to Baghdad and commissioned a hospital on the Kerhaya canal on the model of Jundishapur, bringing Abu Yuhanna Masawayh to direct it; his son Yuhanna succeeded him {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}. The browser records Harun as commissioner and the contribution as transmission of an earlier model, not invention of hospitals; the Christian physicians' contribution remains named in the story {cite:tdv-buhtisu §introduction}."
  ur: "ٹی ڈی وی کے مطابق ہارون الرشید نے اپنے عہد، 786–809ء، میں جبرائیل بن بختیشوع کو بغداد بلایا اور جندیشاپور کے نمونے پر کرخایا نہر کے کنارے ایک شفاخانہ بنوایا۔ ابو یوحنا ماسویہ کو اس کا منتظم بنایا گیا، پھر ان کے بیٹے یوحنا جانشین ہوئے {cite:tdv-bimaristan §İlk Bîmâristan Tesisleri}۔ براؤزر ہارون کو بانی سرپرست اور اس کام کو ایک پرانے نمونے کی منتقلی کہتا ہے، شفاخانے کی ایجاد نہیں؛ عیسائی طبیبوں کا حصہ کہانی میں نام کے ساتھ موجود ہے {cite:tdv-buhtisu §introduction}۔"
