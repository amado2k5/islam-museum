kids:
  ar: 'تخيل طابعاً من خشب محفور بالكتابة العربية: تغمسه في الحبر وتضغطه
    على الورق فتخرج ورقة مكتوبة في ثانية — هكذا صنع حرفيو مصر والشام
    آلاف التمائم المتطابقة قبل المطبعة بمئات السنين.'
  en: 'Imagine a wooden stamp carved with Arabic writing: dip it in
    ink, press it on paper, and out comes a written page in a second.
    That is how craftsmen in Egypt and Syria made thousands of
    identical amulets, hundreds of years before the printing press.'
  ur: 'ایک لکڑی کی مہر سوچو جس پر عربی رسم الخط تراشا گیا ہو: سیاہی میں
    ڈباؤ، کاغذ پر دباؤ، اور ایک سیکنڈ میں لکھی ہوئی ورقہ نکلے — اسی طرح
    مصر اور شام کے کاریگروں نے چھپائی خانے سے صدیوں پہلے ہزاروں یکساں
    تمائم بنائے۔'
