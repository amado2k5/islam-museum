today:
  form:
    ar: 'تُحفظ المطبوعات الباقية في مجموعات النمسا والقاهرة وأوروبا
      وأمريكا، وتُدرس بأطروحات شيفر وميولهاوزلر وريتشاردسون؛ ولا يزال
      كل قالب طرش مفقوداً {cite:wikipedia-tarsh-en} {cite:schaefer-enigmatic-charms-2006}.'
    en: 'The surviving prints sit in Viennese, Cairene, European and
      American collections, studied through the work of Schaefer,
      Muehlhaeusler and Richardson; every tarsh block itself remains
      lost {cite:wikipedia-tarsh-en} {cite:schaefer-enigmatic-charms-2006}.'
    ur: 'بچے ہوئے مطبوعات ویانا، قاہرہ، یورپی اور امریکی مجموعوں میں ہیں
      اور شیفر، میلہاؤسلر اور رچرڈسن کی تحقیق سے پڑھے جاتے ہیں؛ اصل طرش
      تختہ آج بھی کھویا ہوا ہے {cite:wikipedia-tarsh-en}
      {cite:schaefer-enigmatic-charms-2006}۔'
  descendants:
    ar: 'خلّفتها الطباعة الحرفية ثم الطباعة الحاسوبية؛ وإن صح اقتراح
      ريتشاردسون فالطرش حلقة في سلسلة وصول الطباعة إلى أوروبا
      {cite:wikipedia-tarsh-en}.'
    en: 'Movable-type and then digital printing carry the function
      forward; if Richardson''s proposal holds, the tarsh is itself a
      link in printing''s route into Europe {cite:wikipedia-tarsh-en}.'
    ur: 'متحرک حروف اور پھر ڈیجیٹل چھپائی یہ کام آگے بڑھاتی ہے؛ اگر
      رچرڈسن کی تجویز درست ہو تو طرش چھپائی کی یورپ راہ کا ایک کڑی ہے
      {cite:wikipedia-tarsh-en}۔'
