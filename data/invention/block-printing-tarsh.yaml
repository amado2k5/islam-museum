summary:
  ar: صنعة طباعة عربية من القرن العاشر إلى الخامس عشر — قالب محفور من خشب
    أو قصدير ⁦(طرش)⁩ يُحبَّر ويُضغط على الورق فينتج تمائم وأوراقاً
    رسمية؛ بقي منها أكثر من مئة مطبوع، معظمها أشرطة تمائم بخط كوفي ثم
    نسخي، وبعضها بعبرية وسريانية وقبطية، ولم يُعثر على قالب طرش واحد
    باقٍ {cite:wikipedia-tarsh-en} {cite:bulliet-tarsh-1987}.
  en: An Arabic printing craft of the tenth to fifteenth centuries — an
    engraved block of wood or tin ⁦(a tarsh)⁩ inked and pressed onto
    paper to produce amulets and official slips; more than a hundred
    prints survive, mostly amulet strips in Kufic then naskh script —
    some also in Hebrew, Syriac and Coptic — while no tarsh block
    itself has ever been found {cite:wikipedia-tarsh-en} {cite:bulliet-tarsh-1987}.
  ur: دسویں سے پندرہویں صدی کی عربی چھپائی صنعت — لکڑی یا ٹن کا تراشیدہ
    تختہ ⁦(طرش)⁩ جس پر سیاہی لگا کر کاغذ پر دبایا جاتا، جس سے تمائم اور
    سرکاری پرچیاں بنتیں؛ سو سے زیادہ مطبوعات باقی ہیں، بیشتر کوفی پھر
    نسخ خط کی تمائم پٹیاں — کچھ عبری، سریانی اور قبطی میں بھی — مگر ایک
    بھی اصل طرش تختہ نہیں ملا {cite:wikipedia-tarsh-en} {cite:bulliet-tarsh-1987}۔
