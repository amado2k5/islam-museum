era:
  origins: middle-period
  first_attested:
    edtf: "0950~"
    hijri: "0340~"
    calendar: julian
    precision: year
    status: historical
    note: 'The textual horizon: Ibn al-Nadim''s late tenth-century Fihrist
      mentions Egyptian magicians using stamps, and Abu Dulaf''s
      panegyric of c. 952 describes the tarsh engraver of amulets; the
      surviving prints themselves are dated stylistically across the
      whole period c. 900-1436/1444. The hijri figure is a derived
      conversion.'
    derived: true
    sources:
    - source/wikipedia-tarsh-en
    - source/schaefer-enigmatic-charms-2006
  status_today: replaced
origin:
  polity: polity/fatimid-caliphate
  place: place/al-fustat
  context:
    ar: 'نشأت الصنعة في الحاضرة المصرية — أُخرجت مطبوعات أثرية من الفسطاط
      — ومارستها في الأغلب طائفة بني ساسان، فرقة اجتماعية دالت مرادفها
      على صناعة التمائم؛ واستعملتها الدولة أيضاً: طوابع ديوانية فاطمية
      بختم «الإمام الحاكم» لإيصالات الضريبة، ومراسيم موحدية مطبوعة
      {cite:wikipedia-tarsh-en} {cite:schaefer-enigmatic-charms-2006}.'
    en: 'The craft grew up in the Egyptian metropolis — blockprints were
      recovered archaeologically at Fustat — and was practised mainly by
      the Banu Sasan confederation, a marginal social group whose
      vocabulary supplies the whole printing terminology; the state used
      it too: Fatimid chancery stamps reading al-Imam al-Hakim on tax
      receipts and printed Almohad decrees {cite:wikipedia-tarsh-en}
      {cite:schaefer-enigmatic-charms-2006}.'
    ur: 'یہ صنعت مصری مرکز میں جنم لینے والی ہے — فسطاط سے مطبوعات آثارِ
      قدیمہ میں برآمد ہوئے — اور اسے زیادہ تر بنو ساسان جماعت نے کیا، وہی
      حاشیائی سماجی گروہ جس کی لہجہ ساری چھپائی اصطلاحات فراہم کرتا ہے؛
      سلطنت نے بھی استعمال کیا: فاطمی دیوان کی «الامام الحاکم» مہر والی
      محصول وصولیاں اور موحدی فرامین کے مطبوعات {cite:wikipedia-tarsh-en}
      {cite:schaefer-enigmatic-charms-2006}۔'
makers:
- person: person/zayn-al-din-al-jawbari
  role: describer
  place: place/damascus
  note: 'Member of the Banu Sasan whose Kitab al-Mukhtar fi Kashf
    al-Asrar (c. 1232-1248) testifies to daily tarsh printing of
    amulets; the craft itself was anonymous workshop work, so he
    stands as its clearest named witness, not its inventor.'
  sources:
  - source/wikipedia-tarsh-en
  - source/schaefer-enigmatic-charms-2006
attribution:
  status: contested
  claim:
    ar: 'الطرش صنعة طباعة عربية موثقة من القرن العاشر إلى الخامس عشر؛
      أمّا أصلها فمتنازع: نقل مع الورق من الصين، أم اختراع مستقل في
      العالم الإسلامي كما يرجح بوليت {cite:wikipedia-tarsh-en}
      {cite:bulliet-tarsh-1987}.'
    en: 'The tarsh is a documented Arabic printing craft of the tenth to
      fifteenth centuries; its ultimate origin is contested — transmitted
      with paper from China, or an independent invention inside the
      Islamic world as Bulliet argues {cite:wikipedia-tarsh-en}
      {cite:bulliet-tarsh-1987}.'
    ur: 'طرش دسویں سے پندرہویں صدی کی مستند عربی چھپائی صنعت ہے؛ مگر اس
      کی اصل متنازع ہے — چین سے کاغذ کے ساتھ منتقل ہوئی یا اسلامی دنیا
      کی آزاد ایجاد جیسا بلیٹ استدلال کرتا ہے {cite:wikipedia-tarsh-en}
      {cite:bulliet-tarsh-1987}۔'
  basis:
    ar: 'شهادات نصية من الفهرست ⁦(أواخر القرن العاشر)⁩ وأبي دلف ⁦(نحو
      952)⁩ والجوبري ⁦(1232-1248)⁩، وأكثر من مئة مطبوع مصنفة لدى شيفر،
      ومطبوع واحد بميناء القصير القديم حيث وُجدت سلع صينية — مع هذا يستبعد
      بوليت النقل الصيني لاختلاف الحرفتين {cite:wikipedia-tarsh-en}
      {cite:schaefer-enigmatic-charms-2006} {cite:bulliet-tarsh-1987}.'
    en: 'Textual witnesses from the Fihrist ⁦(late tenth century)⁩, Abu
      Dulaf ⁦(c. 952)⁩ and al-Jawbari ⁦(1232-1248)⁩, more than a hundred
      prints catalogued by Schaefer, and one print excavated at the Red
      Sea port of al-Qusayr al-Qadim alongside Chinese wares — yet
      Bulliet judges independent invention more likely than Chinese
      transmission {cite:wikipedia-tarsh-en}
      {cite:schaefer-enigmatic-charms-2006} {cite:bulliet-tarsh-1987}.'
    ur: 'تحریری شہادتیں فہرسٹ ⁦(دسویں صدی کے آخر)⁩، ابو دلف ⁦(952ء قریب)⁩
      اور جوبری ⁦(1232-1248ء)⁩ سے، شیفر کے کٹیلاگ میں سو سے زیادہ مطبوعات،
      اور بندرگاہ قصیر قدیم سے چینی سامان کے ساتھ برآمد ایک مطبوع — اس
      کے باوجود بلیٹ چینی منتقلی کے بجائے آزاد ایجاد کو ممکن تر سمجھتا ہے
      {cite:wikipedia-tarsh-en} {cite:schaefer-enigmatic-charms-2006}
      {cite:bulliet-tarsh-1987}۔'
  perspectives:
  - tradition: sunni
    id: independent-islamic-craft
    summary:
      ar: 'رواية الاستقلال الحرفية — في الإطار السني العام للمتحف تُروى
        الطرش صنعةً نشأت في البيت الإسلامي: صنّاع مسلمون بالفسطاط والشام
        طوّروا قالباً محفوراً للتمائم والوثائق، وحجّة بوليت للاستقلال قائمة
        على اختلاف الحرفتين، والنصوص العربية أقدم شهادة على الحرفة
        {cite:wikipedia-tarsh-en} {cite:bulliet-tarsh-1987}.'
      en: 'The independence reading — in the museum''s Sunni default frame
        the tarsh is told as a craft born inside the Islamic world:
        Muslim printers at Fustat and Syria developed the engraved amulet
        block, Bulliet''s independence argument rests on the two crafts''
        differences, and the Arabic texts are the craft''s earliest
        testimony {cite:wikipedia-tarsh-en} {cite:bulliet-tarsh-1987}.'
      ur: 'استقلال کی قراءت — سنی عمومی فریم میں طرش اسلامی دنیا کی اپنی
        صنعت کہی جاتی ہے: فسطاط اور شام کے مسلم کاریگروں نے تراشیدہ تعویذ
        تختہ بنایا، بلیٹ کی استقلال دلیل دونوں دستکاریوں کے اختلاف پر ہے،
        اور عربی متون اس حرفہ کی قدیم ترین گواہی ہیں {cite:wikipedia-tarsh-en}
        {cite:bulliet-tarsh-1987}۔'
    sources:
    - source/wikipedia-tarsh-en
    - source/bulliet-tarsh-1987
  - tradition: academic
    id: origin-unsettled
    summary:
      ar: 'الأصل بين النقل الصيني والاستقلال غير محسوم — التأريخ الحديث
        يسجل ورود الورق من الصين واحتمال مصاحبة الطباعة له، ويشير إلى
        قرابات بصرية بين بعض التمائم والأختام الصينية، وإلى احتمال نقل
        الغُرباء الروما الصنعة إلى أوروبا مطلع القرن الخامس عشر؛ والمسألة
        مفتوحة {cite:wikipedia-tarsh-en}.'
      en: 'The origin is unsettled between Chinese transmission and
        independent invention — recent scholarship records that paper
        came from China and printing may have accompanied it, notes
        visual echoes of Chinese seals in some amulets, and raises a
        possible Ghuraba Romani transmission route into Europe at the
        start of the fifteenth century; the question remains open
        {cite:wikipedia-tarsh-en}.'
      ur: 'اصل چینی منتقلی اور آزاد ایجاد کے درمیان غیر یقینی ہے — جدید
        تحقیق لکھتی ہے کہ کاغذ چین سے آیا اور چھپائی ساتھ آئی ہو سکتی ہے،
        کچھ تمائم میں چینی مہروں کی بصری مماثلت ہے، اور پندرہویں صدی کے آغاز
        میں غربا روما کے ذریعے یورپ منتقلی کا امکان ہے؛ سوال کھلا ہے
        {cite:wikipedia-tarsh-en}۔'
    sources:
    - source/wikipedia-tarsh-en
