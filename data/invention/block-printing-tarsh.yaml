spread: []
impact:
  fields:
  - materials-industry
  - everyday-life
  changed:
    ar: 'أنتجت النص بالنسخ الآلي قبل الطباعة الأوروبية بأجيال: آلاف
      التمائم المتطابقة للعوام، وطوابع رسمية للدولة، وتجربة مبكرة في
      إنتاج النص الميكانيكي {cite:wikipedia-tarsh-en}.'
    en: 'It produced text by mechanical impression generations before
      European printing: thousands of identical amulets for the public,
      official stamps for the state — an early experiment in mechanical
      text production {cite:wikipedia-tarsh-en}.'
    ur: 'یورپی چھپائی سے نسلوں پہلے متن کی میکانکی نقل بنائی: عوام کے لیے
      یکساں ہزاروں تمائم، سلطنت کے لیے سرکاری مہریں — متن کی میکانکی
      پیداوار کی ابتدائی آزمائش {cite:wikipedia-tarsh-en}۔'
  history:
    ar: 'عملت الصنعة خمسة قرون ثم توارت بعد 1436/1444 حتى نُسيت كلياً
      إلى اكتشافها في القرن التاسع عشر؛ ويظل سؤالها مفتوحاً: لماذا لم
      تتحول إلى طباعة كتب، وهل وصلت أوروبا {cite:wikipedia-tarsh-en}
      {cite:schaefer-enigmatic-charms-2006}.'
    en: 'The craft ran for five centuries, then vanished after 1436/1444
      and was entirely forgotten until its nineteenth-century
      rediscovery; its open questions remain — why it never became book
      printing, and whether it reached Europe {cite:wikipedia-tarsh-en}
      {cite:schaefer-enigmatic-charms-2006}.'
    ur: 'صنعت پانچ صدیوں چلی پھر 1436/1444ء کے بعد غائب ہوئی اور انیسویں
      صدی کی دریافت تک بالکل بھلائی گئی؛ اس کے کھلے سوال باقی ہیں —
      کتاب چھپائی کیوں نہیں بنی اور یورپ پہنچی یا نہیں
      {cite:wikipedia-tarsh-en} {cite:schaefer-enigmatic-charms-2006}۔'
  significance: 3
  why: 'The Islamic world''s own printing craft, five centuries old,
    documented by texts and a hundred surviving prints — and one of the
    great open puzzles of print history.'
