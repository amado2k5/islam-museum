origin:
  place: place/cordoba
  context:
    ar: "ألّف الزهراوي «التصريف» في قرطبة حيث عمل طبيباً للجلالة، وجمع فيه أصول الطب وطرق الجراحة والأدوات؛ صفحة الطبعة اللاتينية ومداخل TDV تضعه في الأندلس {cite:tdv-tasrif-zehravi}."
    en: "Al-Zahrawi composed al-Tasrif in Córdoba, where he served as court physician, gathering the principles of medicine, surgical methods and instruments; the TDV entry and the Latin-edition record place him in al-Andalus {cite:tdv-tasrif-zehravi}."
    ur: "الزہراوی نے «التصریف» قرطبہ میں مرتب کی جہاں وہ دربار کا معالج تھا، اور اس میں طب کے اصول، جراحی کے طریقے اور آلات جمع کیے؛ TDV کا اندراج اور لاطینی ایڈیشن کا ریکارڈ اسے اندلس میں رکھتے ہیں {cite:tdv-tasrif-zehravi}۔"
makers:
  - person: person/al-zahrawi
    role: improver
    place: place/cordoba
    note: "Compiled and illustrated the surgical instrument repertoire in the surgery book of al-Tasrif; the instruments draw on Greek, Indian and earlier Islamic practice while the systematic illustrated description is his editorial achievement {cite:tdv-tasrif-zehravi} {cite:zahrawi-spink-lewis-1973}."
    sources: [source/tdv-tasrif-zehravi, source/zahrawi-spink-lewis-1973, source/zahrawi-leclerc-chirurgie-1861]
attribution:
  status: improvement
  claim:
    ar: "لم يخترع الزهراوي كل أداة على حدة؛ فرّك الجراحة قديمة وورثت أدواتها من اليونان والهند والعالم الإسلامي قبله. ما يضيفه هو الجمع المصوّر المنظم: وصف كل أداة وبيان وجهها في رسوم، فصارت «التصريف» مرجعاً لأدوات الجراحة لقرون."
    en: "Al-Zahrawi did not invent each instrument singly; surgery is ancient and its tools were inherited from Greek, Indian and earlier Islamic practice. What he adds is the organised illustrated corpus: describing each instrument and showing its form in drawings, so al-Tasrif became a surgical-instrument reference for centuries."
    ur: "الزہراوی نے ہر آلہ انفرادی طور پر ایجاد نہیں کیا؛ جراحی قدیم ہے اور اس کے اوزار یونان، ہندوستان اور پہلے اسلامی وراثت سے آئے۔ اس کی شراکت منظم مصور ذخیرہ ہے: ہر آلہ کی وضاحت اور اس کی شکل کی تصویر، جس سے «التصریف» صدیوں تک جراحی آلات کا ماخذ بنی۔"
  basis:
    ar: "يدخل مدخل TDV أن «التصريف» فرغ نحو 390هـ/1000م ويصف كتاب الجراحة المشفوع بالرسوم {cite:tdv-tasrif-zehravi}؛ وتقرأ طبعة Spink وLewis اختبارات أدوات محددة مثل مجارد الأسنان {cite:zahrawi-spink-lewis-1973}؛ ويصف ترجمة Leclerc الفرنسية نفس الحقل {cite:zahrawi-leclerc-chirurgie-1861}."
    en: "The TDV entry records al-Tasrif's completion around 390 AH/1000 CE and describes the illustrated surgical book {cite:tdv-tasrif-zehravi}; the Spink and Lewis edition reads specific instrument passages such as the dental scrapers {cite:zahrawi-spink-lewis-1973}; Leclerc's French translation covers the same field {cite:zahrawi-leclerc-chirurgie-1861}."
    ur: "TDV کا اندراج «التصریف» کی تقریباً 390ھ/1000ء تکمیل اور مصور جراحی کتاب بیان کرتا ہے {cite:tdv-tasrif-zehravi}؛ Spink اور Lewis کا ایڈیشن مخصوص آلات جیسے دندانی مجارد پڑھتا ہے {cite:zahrawi-spink-lewis-1973}؛ Leclerc کا فرانسیسی ترجمہ اسی شعبے کو کور کرتا ہے {cite:zahrawi-leclerc-chirurgie-1861}۔"
precursors:
  - external:
      ar: "الجراحة اليونانية-الرومانية ومصادرها — أهرورابيوس وبلس الجراح وغيرهما — وما وصل منها إلى كتب الجراحة العربية قبل التصريف."
      en: "Greco-Roman surgery and its sources — Aëtius, Paul of Aegina and others — as transmitted into Arabic surgical books before al-Tasrif."
      ur: "یونانی-رومی جراحی اور اس کے ماخذ — آٹیوس، پال آف یگینا اور دیگر — جیسی «التصریف» سے پہلے عربی جراحی کتابوں میں پہنچی۔"
    note: "Greek surgical tradition reached Arabic through translations; al-Zahrawi's own text names Galenic inheritance in places, as the Leclerc reading notes for chapter 87 {cite:zahrawi-leclerc-chirurgie-1861}."
    sources: [source/zahrawi-leclerc-chirurgie-1861]
  - external:
      ar: "تجربة الجراحين المسلمين قبله — ما ورد في المدائن والكتب المنسوبة إلى الأطباء قبل القرن الخامس الهجري."
      en: "The practice of Muslim surgeons before him — profiles in the cities and practices attributed to physicians before the fifth century AH."
      ur: "اس سے پہلے کے مسلمان جراحوں کا تجربہ — پانچویں صدی ہجری سے پہلے کے منسوب اطباء کے کام۔"
    note: "The sources read establish al-Tasrif's encyclopaedic scope, not a complete genealogy of every instrument; earlier Arabic surgical manuals existed though none of the sources read is cited here as a named precursor text."
    sources: [source/tdv-tasrif-zehravi]
dependents:
  - external:
      ar: "ترجمة «التصريف» إلى اللاتينية بيد جيرارد الكريموني، ثم استخدامها في المدارس الجراحية الأوروبية؛ يذكر مدخل TDV ترجمات لاتينية وعبرية وتركية وفارسية."
      en: "The Latin translation of al-Tasrif by Gerard of Cremona and its use in European surgical teaching; the TDV entry records Latin, Hebrew, Turkish and Persian translations."
      ur: "«التصریف» کا جیرارڈ کریمونی کا لاطینی ترجمہ اور یورپی جراحی تدریس میں استعمال؛ TDV لاطینی، عبرانی، ترکی اور فارسی تراجم درج کرتا ہے۔"
    note: "The Latin route is documented in the TDV entry's reception section; the record does not claim every later European instrument descends directly from a Zahrawi drawing {cite:tdv-tasrif-zehravi}."
    sources: [source/tdv-tasrif-zehravi]
  - external:
      ar: "نسخ مخطوطة باقية من «التصريف» حتى القرن الخامس عشر، صورها انتشرت في الدراسات الحديثة للأدوات الجراحية."
      en: "Surviving manuscript copies of al-Tasrif into the fifteenth century, whose images circulated in modern studies of surgical instruments."
      ur: "«التصریف» کی پندرہویں صدی تک بچی ہوئی مخطوطہ نقلیں، جن کی تصویریں جدید جراحی آلات کے مطالعوں میں پھیلیں۔"
    note: "The Commons file page identifies Zahrawi1.png as a fifteenth-century copy's instrument drawings and public-domain reproduction {cite:commons-zahrawi-instruments}."
    sources: [source/commons-zahrawi-instruments]
spread: []
impact:
  fields: [medicine-surgery]
  changed:
    ar: "جعل وصف الأدوات الجراحية منظم: كل أداة لها اسمها وشكلها وطريقة استعمالها في موضعها من أبواب الجراحة، فصار الجراح يجد مرجعاً مصوراً واحداً."
    en: "It made the description of surgical instruments منظم: every instrument has its name, form and method of use in its place among the surgery chapters, so the surgeon finds a single illustrated reference."
    ur: "اس نے جراحی آلات کی وضاحت کو منظم بنایا: ہر آلہ کا نام، شکل اور استعمال کا طریقہ جراحی کے ابواب میں اس کی جگہ پر ہے، تاکہ جراح کو ایک مصور ماخذ ملے۔"
  history:
    ar: "بقيت «التصريف» مرجعاً جراحياً في شرق المتوسط والغرب لقرون بعد الفراغ منها، وترجمت إلى اللاتينية فصارت أدواتها جزءاً من تاريخ الجراحة الأوروبية المكتوب."
    en: "Al-Tasrif stayed a surgical reference in the eastern Mediterranean and the West for centuries after its completion, and its Latin translation made its instruments part of the written history of European surgery."
    ur: "«التصریف» اپنی تکمیل کے صدیوں بعد بھی مشرق وسطیٰ اور مغرب میں جراحی ماخذ رہی، اور اس کا لاطینی ترجمہ اس کے آلات کو یورپی جراحی کی لکھی ہوئی تاریخ کا حصہ بناتا ہے۔"
  significance: 3
  why: "A documented comprehensive illustrated surgical-instrument corpus inside a surviving encyclopaedia; the rating reflects its encyclopaedic scope and transmission, not a claim that each instrument was invented by al-Zahrawi."
