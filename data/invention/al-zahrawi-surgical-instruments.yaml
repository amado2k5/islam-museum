label:
  ar: "آلات الجراحة المصوّرة في التصريف"
  en: "The illustrated surgical instruments of al-Tasrif"
  ur: "التصریف کے مصور جراحی آلات"
  es: "Los instrumentos quirúrgicos ilustrados de al-Tasrif"
  fr: "Les instruments chirurgicaux illustrés d'al-Tasrif"
