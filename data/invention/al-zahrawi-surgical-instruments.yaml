kids:
  ar: "تخيّل أن طبيباً في الأندلس قبل ألف سنة كتب كتاباً فيه كل أدواته: السكاكين الصغيرة التي يقطع بها، والمجارد التي ينظف بها، والملاقط التي يمسك بها — وكل أداة مرسومة بجانب اسمها. هذا ما فعله الزهراوي في «التصريف»، فصار أول مرجع مصور لأدوات الجراح."
  en: "Imagine a doctor in al-Andalus a thousand years ago writing a book with all his tools: the little knives he cuts with, the scrapers he cleans with, the forceps he holds with — and every tool drawn beside its name. That is what al-Zahrawi did in al-Tasrif, becoming the first illustrated reference for a surgeon's tools."
  ur: "سوچو کہ ایک ہزار سال پہلے اندلس کا ایک معالج اپنی تمام اوزار ایک کتاب میں لکھے: چھریاں جن سے وہ کاٹتا ہے، کھرچنے جن سے وہ صاف کرتا ہے، چمٹے جن سے وہ پکڑتا ہے — اور ہر آلہ اپنے نام کے ساتھ بنا ہوا۔ یہی الزہراوی نے «التصریف» میں کیا، اور وہ جراح کے آلات کا پہلا مصور ماخذ بن گیا۔"
