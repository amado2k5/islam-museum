today:
  form:
    ar: "لا تُستخدم أدوات «التصريف» اليوم في غرف العمليات؛ ما بقي هو المبدأ: أن أدوات المهنة تُوثَّق وتُرسَم ليعرفها المتعلم."
    en: "The instruments of al-Tasrif are not used in operating rooms today; what survives is the principle: that a profession's tools are documented and drawn so the learner can know them."
    ur: "«التصریف» کے آلات آج آپریٹنگ تھیٹروں میں استعمال نہیں ہوتے؛ جو بچا وہ اصول ہے: کہ کسی پیشے کے آلات کی دستاویزی تصویر کھینچی جائے تاکہ سیکھنے والا انہیں پہچانے۔"
  descendants:
    ar: "أدوات الجراحة الحديثة تشبه أدوات التصريف في الأسماء العامة — مشاطيل ومجاسّ وملاقط — لكن لا يثبت ذلك نسباً مباشراً من رسم إلى تصميم."
    en: "Modern surgical instruments resemble those of al-Tasrif in general names — مشرطs, probes, forceps — but that does not prove direct descent from a drawing to a design."
    ur: "جدید جراحی آلات «التصریف» سے ناموں میں مشابہ ہیں —-مشاطيل، مجاسّ، چمٹے — لیکن اس سے تصویر سے ڈیزائن تک براہ راست نسل ثابت نہیں ہوتی۔"
