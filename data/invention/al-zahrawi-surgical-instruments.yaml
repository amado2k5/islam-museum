names:
  - { value: "surgical instruments of al-Tasrif", kind: alternate, lang: en }
  - { value: "آلات الجراحة", kind: alternate, lang: ar }
summary:
  ar: "مجموعة أدوات الجراحة التي وصفها الزهراوي في كتاب الجراحة من «التصريف» مشفوعة بالرسوم، ففصّل أنواع المجارد والمباضع والملاقط والمقاييس والوسائل الكيّة وغيرها؛ توصف الموسوعة بأنها أوسع نص جراحي عربي إسلامي مصور وصلنا، ونقلت ترجمته اللاتينية إلى الجراحة الأوروبية."
  en: "The surgical instruments al-Zahrawi described in the surgery book of al-Tasrif, accompanied by drawings: varieties of scrapers, probes, forceps, measures, cautery tools and more; the encyclopaedia is described as the broadest surviving illustrated Arabic-Islamic surgical text, and its Latin translation carried the repertoire into European surgery."
  ur: "الزہراوی نے «التصریف» کی کتاب الجراحہ میں جو جراحی آلات بیان کیے وہ تصاویر کے ساتھ ہیں: مجارد، مباضع، چمٹے، ناپنے کے اوزار، داغنے کے سلسلے وغیرہ؛ یہ دائرۃ المعارف بچی ہوئی مصور عربی اسلامی جراحی متن میں سب سے وسیع سمجھی جاتی ہے، اور اس کا لاطینی ترجمہ یورپی جراحی تک پہنچا۔"
  es: "Los instrumentos quirúrgicos que al-Zahrawi describió en el libro de cirugía de al-Tasrif, acompañados de dibujos, incluían diversas variedades de raspadores, sondas, fórceps, instrumentos de medición, herramientas de cauterización y más. Esta enciclopedia se describe como el texto quirúrgico árabe-islámico ilustrado más extenso que se conserva, y su traducción al latín introdujo este repertorio en la cirugía europea."
  fr: "Les instruments chirurgicaux décrits par al-Zahrawi dans le livre de chirurgie d'al-Tasrif, accompagnés de dessins: diverses sortes de grattoirs, sondes, forceps, instruments de mesure, outils de cautérisation et plus encore; l'encyclopédie est décrite comme le texte chirurgical arabo-islamique illustré le plus complet qui nous soit parvenu, et sa traduction latine a diffusé ce répertoire dans la chirurgie européenne."
  tr: "El-Zahravi'nin \"El-Tasrif\" adlı cerrahi kitabında tanımladığı cerrahi aletler seti, resimlerle desteklenmiştir. Neşter, bistüri, forseps, ölçme aletleri, yakma yöntemleri ve diğerlerinin türlerini ayrıntılı olarak anlatmıştır. Ansiklopedi, günümüze ulaşan en kapsamlı resimli Arapça-İslami cerrahi metin olarak nitelendirilir ve Latince çevirisi Avrupa cerrahisine aktarılmıştır."
  id: "Perangkat alat bedah yang dijelaskan oleh Al-Zahrawi dalam bukunya tentang bedah, “Al-Tasrif,” disertai dengan ilustrasi. Ia merinci jenis-jenis pisau bedah, pisau bedah, penjepit, alat ukur, metode kauterisasi, dan lain-lain. Ensiklopedia ini digambarkan sebagai teks bedah Arab-Islam bergambar terlengkap yang sampai kepada kita, dan terjemahan Latinnya telah menyebar ke dunia bedah Eropa."
