summary:
  ar: لوح خشبي مستطيل في وسطه خيط معقود، يقيس به ربّان المحيط الهندي ارتفاع النجم
    القطبي فوق الأفق — ومنه عرض البلد — بإمساك طرف الخيط بالأسنان ومدّه حتى يلامس
    أسفل اللوح الأفقَ وأعلاه النجم؛ يُعد أقدم أداة معروفة جعلت الملاحةَ بالعرض ممكناً
    وأول خطوة نحو الملاحة الكمية {cite:wikipedia-kamal-en} {cite:mcgrail-boats-of-world-2004}.
  en: A small rectangular wooden board with a knotted string through its centre —
    the Indian Ocean pilot held the string's end in his teeth and slid the board along
    it until its lower edge sat on the horizon and its upper edge touched the pole
    star, reading latitude in knots of one finger-width each; it made the earliest
    known latitude sailing possible and was the first step towards quantitative navigation
    {cite:wikipedia-kamal-en} {cite:mcgrail-boats-of-world-2004}.
  ur: ایک چھوٹا مستطیل لکڑی کا تختہ جس کے وسط میں گانٹھوں والی ڈوری لگی ہو — بحیرۂ
    ہند کا ملاح ڈوری کا سرا دانتوں میں دبا کر تختہ ڈوری پر سرکاتا، یہاں تک کہ نیچلا
    کنارہ افق اور اوپری کنارہ قطبی ستارے کو چھوتا؛ یہ عرض بلد کی معلوم ترین قدیم ملاحت
    اور مقداری نیویگیشن کی پہلی سیڑھی مانی جاتی ہے {cite:wikipedia-kamal-en} {cite:mcgrail-boats-of-world-2004}۔
