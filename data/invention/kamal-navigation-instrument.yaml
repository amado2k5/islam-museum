impact:
  fields:
  - navigation-geography
  changed:
    ar: 'جعل العرض رقماً يُبحر عليه: صار الربّان يبحر على خط عرض معلوم ثم يستدير شرقاً
      أو غرباً نحو المرفأ — أول ملاحة كمية موثقة في تاريخ البحر {cite:wikipedia-kamal-en}.'
    en: 'It made latitude a number you could sail: the pilot ran down the known parallel,
      then turned east or west for the harbour — the first documented quantitative
      navigation in seafaring history {cite:wikipedia-kamal-en}.'
    ur: 'اس نے عرض بلد کو ایسا عدد بنا دیا جس پر سفر کیا جا سکے: ملاح معلوم محاذ پر
      چلتا پھر بندرگاہ کے لیے مشرق یا مغرب مڑتا — سمندری تاریخ کی پہلی مستند مقداری
      نیویگیشن {cite:wikipedia-kamal-en}۔'
  history:
    ar: ظل آلة الربّان العربي قروناً حتى عصر ابن ماجد وما بعده، ثم استعاره الملاحون
      الهنود والصينيون، وبقي النجاة الاحتياطي لمن يضيع منهجته {cite:wikipedia-kamal-en}.
    en: It remained the Arab pilot's instrument for centuries through Ibn Majid's
      age and beyond, was borrowed by Indian and Chinese navigators, and survives
      as the sea-kayaker's emergency fallback {cite:wikipedia-kamal-en}.
    ur: صدیوں ابن ماجد کے زمانے اور اس سے آگے تک عرب ملاح کا آلہ رہا، ہندوستانی اور
      چینی ملاحوں نے اپنایا، اور آج بھی سمندری کایاک سوار کا آخری سہارا ہے {cite:wikipedia-kamal-en}۔
  significance: 4
  why: The simplest instrument that ever moved a civilisation's seafaring from pilotage
    to latitude sailing — a board, a string and a tradition of knots, invented by
    Arab pilots and borrowed across the Indian Ocean.
