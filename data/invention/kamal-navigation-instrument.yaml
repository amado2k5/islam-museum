kids:
  ar: كيف تعرف موقعك في البحر بلا خريطة ولا بوصلة؟ أمسك خيطاً بأسنانك، وحرّك لوحاً
    خشبياً صغيراً على الخيط حتى يغطي اللوح النجمَ القطبي بينما يجلس أسفله على خط الأفق،
    ثم عدّ العُقَد — كل عقدة تعني «إصبعاً» من الارتفاع، وتخبرك أصابعك على أي خط عرض
    أنت.
  en: How do you find where you are at sea with no map and no compass? Hold a string
    in your teeth, slide a small wooden board along it until the board's top touches
    the pole star while its bottom sits on the horizon, then count the knots — each
    knot is a "finger" of height, and your fingers tell you your latitude.
  ur: سمندر میں بغیر نقشے و قطب نما اپنی جگہ کیسے معلوم کرو؟ ڈوری دانتوں میں دباؤ،
    چھوٹے لکڑی کے تختہ ڈوری پر سرکاؤ جب تک اس کا اوپری کنارہ قطبی ستارے کو چھوئے اور
    نیچلا افق پر بیٹھے، پھر گانٹھیں گنو — ہر گانٹھ ایک «انگلی» بلندی ہے اور تمھاری
    انگلیاں عرض بلد بتا دیں گی۔
