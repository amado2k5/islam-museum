attribution:
  status: original
  claim:
    ar: الكمال نشأ عند الملاحين العرب أواخر القرن التاسع واستُعمل في المحيط الهندي
      من القرن العاشر، ثم أخذه الملاحون الهنود قريباً والصينيون قبل القرن السادس عشر
      {cite:wikipedia-kamal-en} {cite:mcgrail-boats-of-world-2004}.
    en: The kamal originated with Arab navigators of the late ninth century and was
      employed in the Indian Ocean from the tenth; Indian navigators adopted it soon
      after, and Chinese navigators some time before the sixteenth century {cite:wikipedia-kamal-en}
      {cite:mcgrail-boats-of-world-2004}.
    ur: کمال نویں صدی کے آخر میں عرب ملاحوں کی ایجاد ہے اور دسویں صدی سے بحیرۂ ہند
      میں مستعمل رہا؛ ہندوستانی ملاحوں نے جلد اور چینیوں نے سولہویں صدی سے پہلے اسے
      اپنایا {cite:wikipedia-kamal-en} {cite:mcgrail-boats-of-world-2004}۔
  basis:
    ar: دراسة ماكغريل لسفن العالم تؤرخه بالملاحين العرب وتوثق انتشاره الهندي ثم الصيني،
      والمقالة المسجلة تنقل ذلك مع وصف الآلية ووحدة الإصبع {cite:mcgrail-boats-of-world-2004}
      {cite:wikipedia-kamal-en}.
    en: McGrail's study of the world's boats dates it to the Arab navigators and documents
      the Indian and then Chinese adoption; the recorded encyclopedia revision carries
      that dating with the mechanism description and the finger-width unit {cite:mcgrail-boats-of-world-2004}
      {cite:wikipedia-kamal-en}.
    ur: مک گریل کی عالمی جہازوں کی تحقیق اسے عرب ملاحوں میں مؤرخ کرتی اور ہندوستانی
      پھر چینی انتشار مستند کرتی ہے؛ درج شدہ انسائیکلوپیڈیا نظرثانی وہی تاریخ، طریقہ
      کار اور انگلی کی اکائی نقل کرتی ہے {cite:mcgrail-boats-of-world-2004} {cite:wikipedia-kamal-en}۔
precursors:
- external:
    ar: قياس الارتفاع بالأصابع والعين المجردة
    en: Naked-eye altitude estimation by finger-widths
    ur: انگلیوں کی چوڑائی سے ننگی آنکھ کی بلندی پیمائش
  note: The kamal's unit is the isba', the finger-width at arm's length — about a
    degree and a half — that pilots already used to estimate star heights; the board
    only makes that unit constant.
  sources:
  - source/wikipedia-kamal-en
dependents:
- external:
    ar: عصا الصليب والعصا الخلفية الأوروبية
    en: The European cross-staff and backstaff
    ur: یورپی کراس سٹاف اور بیک سٹاف
