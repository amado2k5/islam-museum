today:
  form:
    ar: ما زال الكمال يُصنع ويُعلَّم في مدارس الملاحة الشراعية والقوارب، ويحفظه بحّارة
      الخليج ضمن تراث الملاحة {cite:wikipedia-kamal-en}.
    en: The kamal is still made and taught in traditional-seamanship and sea-kayak
      courses, and Gulf seafarers keep it as part of their navigational heritage {cite:wikipedia-kamal-en}.
    ur: کمال آج بھی روایتی ملاحی تربیت اور کایاک کورسوں میں بنایا اور سکھایا جاتا
      ہے، اور خلیج کے ملاح اسے اپنے ملاحی ورثے کا حصہ رکھتے ہیں {cite:wikipedia-kamal-en}۔
  descendants:
    ar: العصا الصليبية والسدسية الحديثة تقفان على مبدأ الارتفاع الزاوي نفسه الذي جعله
      الكمال رقماً متنقلاً {cite:wikipedia-kamal-en}.
    en: The cross-staff and the modern sextant stand on the same angular altitude
      principle the kamal first made into a portable number {cite:wikipedia-kamal-en}.
    ur: کراس سٹاف اور جدید سکسٹنٹ اسی زاویہ بلندی کے اصول پر قائم ہیں جسے کمال نے
      پہلی بار قابلِ انتقال عدد بنایا {cite:wikipedia-kamal-en}۔
