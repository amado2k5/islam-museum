origin:
  context:
    ar: سفن ومراكب التجار العرب في المحيط الهندي وشبكة رحلاتهم الموسمية بين الخليج
      والهند وشرق أفريقيا، حيث كانت معرفة عرض البلد شرط الوصول {cite:wikipedia-kamal-en}.
    en: The Arab merchant ships of the Indian Ocean and their monsoon routes between
      the Gulf, India and East Africa, where knowing a port's latitude was the condition
      of reaching it {cite:wikipedia-kamal-en}.
    ur: بحیرۂ ہند کے عرب تاجروں کے جہاز اور خلیج، ہندوستان اور مشرقی افریقہ کے درمیان
      ان کے موسمی راستے، جہاں بندرگاہ کے عرض بلد کا علم پہنچنے کی شرط تھا {cite:wikipedia-kamal-en}۔
  place: place/indian-ocean
