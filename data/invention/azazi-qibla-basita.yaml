      id: sunni-museum-frame
      standing: main
      summary:
        ar: "الإطار السني المعلن يحفظ مذهب المؤلف الشافعي الموثق في الفهرس؛ لا معلومة إضافية عن связи شخص به."
        en: "The declared Sunni frame preserves the Shafi'i affiliation documented in the catalog; no further personal-link claim is made."
        ur: "اعلان کردہ سنی سیاق فہرست میں درج مصنف کا شافعی نسبت محفوظ رکھتا ہے؛ مزید ذاتی تعلق کا دعویٰ نہیں۔"
      sources: [source/bibalex-azhar-astronomy-manuscripts-2006]
