today:
  form:
    ar: "نموذج تاريخي لأسرة البسيطة ذات بيت الإبرة؛ اليوم يُحدَّد اتجاه القبلة والأوقات بالتطبيقات والجداول الفلكية، والصورة المعروضة بسيطة إيرانية لاحقة من القرن السابع عشر تقف شاهداً على استمرار الأسرة."
    en: "A historical model of the needle-housed basita family; today qibla and times are set by apps and ephemerides, and the displayed photograph is a later seventeenth-century Iranian dial standing as evidence of the family's continuity."
    ur: "سوئی والے گھر والی بسیتہ خاندان کا تاریخی نمونہ؛ آج قبلہ اور اوقات ایپس اور فلکیاتی جداول سے نکلتے ہیں، اور دکھائی گئی تصویر سترہویں صدی کی ایک بعد کی ایرانی بسیتہ ہے جو خاندان کے تسلسل کی گواہی دیتی ہے۔"
  descendants:
    ar: "لا يثبت البحث المقروء نسباً مباشراً من رسالته إلى أدوات اليوم؛ فكرة دمج اتجاه القبلة في مزولة باقية في أدوات إيرانية وعثمانية لاحقة موثقة صورتياً."
    en: "The sources read establish no direct lineage from his treatise to today's instruments; the idea of combining qibla direction into a sundial survives in later Iranian and Ottoman instruments documented photographically."
    ur: "پڑھے ماخذ اس کے رسالے سے آج کے آلات تک براہ راست نسب ثابت نہیں کرتے؛ قبلہ کی سمت کو دھوپ گھڑی میں ملانے کا خیال بعد کے ایرانی اور عثمانی آلات میں باقی ہے جن کی تصویریں موجود ہیں۔"
