  context:
    ar: "مصر العثمانية اللاحقة في القرن التاسع عشر الميلادي؛ العزازي فلكي شافعي يكتب باللسان العربي عن المزاول والبسيطة وبيت الإبرة، والسياق تعليمي-عملي في مواقيت الصلاة واتجاه القبلة {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 18}."
    en: "Late-Ottoman Egypt in the nineteenth century CE; al-Azazi is a Shafi'i astronomer writing in Arabic on sundials, the basita and the needle-house, in a practical context of prayer times and qibla direction."
    ur: "انیسویں صدی مسیحی کے آخر کا عثمانی مصر؛ العزازی شافعی ماہرِ فلکیات ہے جو عربی میں مزاول، بسیتہ اور سوئی کے گھر پر لکھتا ہے، نماز کے اوقات اور قبلہ کی سمت کے عملی سیاق میں۔"
makers:
  - person: person/khalil-ibn-ibrahim-al-azazi
    role: improver
    note: "Egyptian Shafi'i astronomer of the late thirteenth century AH; documented by the Bibliotheca Alexandrina catalog as author of the sundial treatise containing the needle-housed basita method. Priority over other basita-qibla makers is not established."
    sources: [source/bibalex-azhar-astronomy-manuscripts-2006]
attribution:
  status: improvement
  claim:
    ar: "البسيطة أداة مزولة أفقية قديمة، وبيوت الإبرة للقبلة معروفة في أدوات لاحقة؛ التوثيق هنا أن رسالة العزازي تصف طريقة صنع بسيطة ذات بيت إبرة لمعرفة محاريب البلدان، لا أن العزازي اخترع البسيطة أو أسرة بيت الإبرة."
    en: "The basita is an old horizontal sundial and needle-house qibla pointers are known in later instruments; what is documented here is that al-Azazi's treatise describes a method for making a basita with a needle-house to find the qiblas of countries — not that he invented the basita or the needle-house family."
    ur: "بسیتہ ایک پرانا افقی دُھپ گھڑی ہے اور سوئی کے گھر والے قبلہ پوائنٹر بعد کے آلات میں معلوم ہیں؛ یہاں ثبوت یہ ہے کہ العزازی کے رسالے میں سوئی کے گھر والی بسیتہ بنانے کا طریقہ ہے — یہ نہیں کہ اس نے بسیتہ یا سوئی کے گھر والے خاندان کو ایجاد کیا۔"
  basis:
    ar: "يسرد فهرس مكتبة الإسكندرية رسالته «رسالة العزازي في المزاول» ويصفها بأنها في خطوط فضل الدائر وأقواس العصر، ويذكر فيها «طريقة صنع البسيطة ذات بيت الإبرة لمعرفة محاريب البلدان»، ويورد مشهداً رصدياً لخطوط الظهر بتاريخ 1282هـ."
    en: "The Bibliotheca Alexandrina catalog lists his treatise 'Risalat al-Azazi fi al-mazawil' and describes it as covering the lines of fadl al-da'ir and the afternoon arcs; within it the catalog gives 'the method of making the basita with a needle-house for finding the qibla of countries', recording an observation of afternoon lines dated 1282 AH."
    ur: "کتاب الالکساندریا کی فہرست اس کے رسالے «رسالۃ العزازي فی المزاول» کو درج کرتی ہے اور اسے فضل الدائر کی لکیروں اور عصر کی قوسوں پر بتاتی ہے؛ اس کے اندر «ملکوں کے قبلہ جاننے کے لیے سوئی والے گھر والی بسیتہ بنانے کا طریقہ» بیان کرتی ہے، اور 1282ھ کی دوپہر کی لکیروں کا مشاہدہ درج کرتی ہے۔"
  perspectives:
