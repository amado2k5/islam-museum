summary:
  ar: "في رسالة خليل بن إبراهيم العزازي الشافعي ⁦(أواخر القرن الثالث عشر الهجري)⁩ في المزاول: طريقة صنع البسيطة ذات بيت الإبرة لمعرفة محاريب البلدان وخطوط فضل الدائر، مع ذكر مشاهد رصدية لخطوط الظهر في سنة 1282هـ؛ تُصنف في فهرس مكتبة الإسكندرية ضمن فلك منتصف القرن التاسع عشر الميلادي {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 18}."
  en: "In the treatise of the Shafi'i Egyptian astronomer Khalil ibn Ibrahim al-Azazi (late thirteenth century AH) on sundials: a method for making the basita — a horizontal dial — with a needle-housed pointer to find the qibla of countries, together with lines of fadl al-da'ir and afternoon observations dated 1282 AH; the Bibliotheca Alexandrina catalog places him in mid-nineteenth-century astronomy {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 18}."
  ur: "شافعی مصری ماہرِ فلکیات خلیل بن ابراہیم العزازی ⁦(تیرہویں صدی ہجری کے اواخر)⁩ کے دھوپ گھڑیوں کے رسالے میں: قبلہ کی سمت جاننے کے لیے سوئی والے گھر والی بسیتہ بنانے کا طریقہ، فضل الدائر کی لکیروں کے ساتھ، اور 1282ھ کے مشاہدات؛ کتاب الالکساندریا کی فہرست اسے انیسویں صدی وسط کے فلکیات میں رکھتی ہے {cite:bibalex-azhar-astronomy-manuscripts-2006 p. 18}۔"
