kids:
  ar: "منذ زمن بعيد رسم الناس خطوطاً على لوح حجري ليعرفوا متى تشرق الشمس ومتى تغرب. كتب العزازي وصفاً لـ«بسيطة» فيها بيت صغير يشير إلى جهة القبلة، حتى يعرف المسلم وقت الصلاة واتجاهها في بلدته. بقيت رسالته في نسخة قديمة، وتُعرض اليوم صور لآلات من نفس الأسرة."
  en: "Long ago people drew lines on a stone slab to know when the sun rose and set. Al-Azazi wrote a description of a \"basita\" — a flat dial — with a small needle-house pointing to the qibla, so a Muslim could know prayer time and direction in his town. His treatise survives in an old copy, and today photographs show later instruments of the same family."
  ur: "کئی صدیوں پہلے لوگ پتھر کی تختی پر لکیریں کھینچتے تھے تاکہ جان سکیں سورج کب طلوع اور غروب ہوتا ہے۔ العزازی نے «بسیتہ» — ایک سپاٹ ڈائل — کی ایسی تفصیل لکھی جس میں قبلہ کی طرف اشارہ کرنے والا چھوٹا سوئی کا گھر تھا، تاکہ مسلمان اپنے شہر میں نماز کا وقت اور سمت جان سکے۔ اس کا رسالہ ایک پرانی نقل میں بچا ہے، اور آج اسی خاندان کے بعد کے آلات کی تصاویر دکھائی جاتی ہیں۔"
