today:
  form:
    ar: "لا توجد أداة مادية؛ بقي الشكل في رسالة «ضوء القمر» وفي سؤالها عن طبيعة ضوء القمر، والصورة المعروضة صورة حديثة من مركبة فضائية لسياق سطح القمر فقط."
    en: "No physical object survives; the form lives in the treatise On the Light of the Moon and its question about the nature of lunar light, and the displayed image is a modern spacecraft photograph of the lunar surface for context only."
    ur: "کوئی مادی چیز باقی نہیں؛ شکل «ضوء القمر» کے رسالے اور اس کے سوال میں باقی ہے — چاند کی روشنی کی نوعیت — اور دکھائی گئی تصویر صرف سیاق کے لیے جدید خلائی جہاز کی چاند کی تصویر ہے۔"
  descendants:
    ar: "لا يثبت في المصادر المقروءة نسل مباشر من حجة الرسالة إلى علم ضوء القمر الحديث؛ علم اليوم يشرح ضوء القمر بانعكاس ضوء الشمس عن تربة غبارية عاكسة، وهو جواب مختلف عن نموذج «الجسم المضيء ذاتياً» الذي اقترحه ابن الهيثم."
    en: "The sources read establish no direct line from the treatise's argument to modern lunar-light science; today's science explains lunar light as sunlight reflected from a bright dusty regolith — a different answer from the 'self-illuminating body' model Ibn al-Haytham proposed."
    ur: "پڑھے ماخذ اس رسالے کے استدلال سے جدید چاند کی روشنی کے علم تک براہ راست نسل ثابت نہیں کرتے؛ آج کا علم چاند کی روشنی کو چاند کی چمکتی غبار والی سطح سے سورج کی روشنی کے انعکاس سے سمجھاتا ہے — ابن الہیثم کے «خود منور جسم» کے ماڈل سے مختلف جواب۔"
