attribution:
  status: improvement
  claim:
    ar: "في «ضوء القمر» حسّن ابن الهيثم النظرية القديمة في ضوء القمر: ردّ نموذج المرآة التي تعكس شعاعاً واحداً، واقترح أن كل نقطة على سطح القمر تبث أشعة الضوء في كل الاتجاهات وأن أثراً فيزيائياً لأشعة الشمس على القمر يجعل لونه وضوءه مرئيين؛ والتسجيل مقيد بحجة الرسالة هذه لا بادعاء فهم كامل حديث لضوء القمر."
    en: "In On the Light of the Moon, Ibn al-Haytham improved on the ancient theory of lunar light: he rejected the mirror model reflecting a single ray and proposed that every point on the lunar surface broadcasts light rays in all directions, with some physical effect of the sun's rays on the Moon rendering its color and light visible; the record is bounded to this treatise's argument, not a claim to complete modern understanding of lunar light."
    ur: "«ضوء القمر» میں ابن الہیثم نے چاند کی روشنی کے قدیم نظریہ کو بہتر بنایا: اس نے ایک شعاع منعکس کرنے والے آئینے کے ماڈل کو رد کیا اور تجویز کی کہ چاند کی سطح کا ہر نقطہ روشنی کی شعاعیں تمام سمتوں میں نشر کرتا ہے، اور سورج کی شعاعوں کا چاند پر کوئی طبعی اثر اس کا رنگ اور روشنی مرئی بناتا ہے؛ ریکارڈ اسی رسالے کے استدلال تک محدود ہے، چاند کی روشنی کی مکمل جدید تفہیم کا دعویٰ نہیں۔"
  basis:
    ar: "يصف المدخل «ضوء القمر» بأنه يعيد مسألة إدراك خسوف القمر والكسوف الشمسي على افتراض أن القمر والشمس أجسام فيزيائية صلبة، ثم يرد فيه على النظرية القديمة أن القمر يعكس ضوء الشمس كالمرايا، ويذهب إلى أن القمر جسم مضيء ذاتياً لأن كل نقطة على سطحه تبث أشعة في كل الاتجاهات بينما تعكس مرآة الشعاع في اتجاه واحد، ويستنتج أن أثراً فيزيائياً لأشعة الشمس على القمر يجعل لونه — وبالتالي ضوءه — مرئياً، ويفتح هذا باباً لمصالحة أرسطو وبطلميوس {cite:ewb-ibn-al-haytham}. وتسجله ISMI تأليفاً في البصريات ألّفه قبل 7 آب 1031م وبقيت منه ثلاثة شهود {cite:ismi-daw-al-qamar}."
    en: "The entry describes On the Light of the Moon as taking up again the problem of perceiving lunar and solar eclipses on the assumption that Moon and Sun are solid physical bodies; it refutes the ancient theory that the Moon reflects sunlight like a mirror, holds the Moon to be a self-illuminating body because every point on its surface broadcasts rays in all directions while a mirror reflects a ray in one direction, and concludes that some physical effect of the sun's rays on the Moon renders its color — and thereby its light — visible, opening the way to reconcile Aristotle and Ptolemy {cite:ewb-ibn-al-haytham}. ISMI catalogs it as an optics composition written before 7 August 1031 with three surviving witnesses {cite:ismi-daw-al-qamar}."
    ur: "مدخل «ضوء القمر» کو چاند اور سورج کی گرہن کے مشاہدے کے مسئلے کو دوبارہ اٹھانا بتاتا ہے اس مفروضے پر کہ چاند اور سورج ٹھوس مادی اجسام ہیں؛ اس میں قدیم نظریہ رد کیا گیا کہ چاند شمس کی روشنی آئینے کی طرح منعکس کرتا ہے، چاند کو خود منور جسم قرار دیا گیا کیونکہ اس کی سطح کا ہر نقطہ تمام سمتوں میں شعاعیں نشر کرتا ہے جبکہ آئینہ شعاع کو ایک ہی سمت میں منعکس کرتا ہے، اور یہ نتیجہ دیا گیا کہ سورج کی شعاعوں کا چاند پر کوئی طبعی اثر اس کا رنگ — اور اس کے ساتھ روشنی — مرئی بناتا ہے، جو ارسطو اور بطلمیوس کے صلح کا دروازہ کھولتا ہے {cite:ewb-ibn-al-haytham}۔ ISMI اسے بصریات کی تصنیف کے طور پر درج کرتی ہے جو 7 اگست 1031ء سے پہلے لکھی گئی اور تین گواہوں میں باقی ہے {cite:ismi-daw-al-qamar}۔"
  perspectives:
    - tradition: sunni
      id: sunni-museum-frame
      standing: main
      summary:
        ar: "ابن الهيثم مسلم في كلماته: تفتتح «المناظر» باسمه وبسم الله، ويرد في رسائله على الطاعنين في النبوة والمعتزلة؛ فلا تعارض في إطاره السني، والمذهب الفقهي غير مسمى في المصادر المقروءة."
        en: "Ibn al-Haytham is a Muslim in his own words: the Manazir opens in his name with the basmala, and he wrote treatises answering critics of prophethood and the Mu'tazila; the Sunni frame creates no tension, and no legal school is named in the sources read."
        ur: "ابن الہیثم اپنی ہی باتوں میں مسلمان ہیں: «المناظر» ان کے نام سے بسم اللہ سے کھلتی ہے، اور انہوں نے نبوت پر اعتراض کرنے والوں اور معتزلہ کے خلاف رسالے لکھے؛ سنی سیاق میں کوئی تعارض نہیں، اور پڑھے ماخذ میں کوئی فقہی مسلک نہیں بتایا گیا۔"
