impact:
  fields: [optics-physics]
  changed:
    ar: "حوّل سؤال «لماذا يضيء القمر؟» من مسألة انعكاس هندسي بسيط إلى مسألة فيزيائية عن طبيعة سطح القمر وتأثره بضوء الشمس، وربطها بنقاش أرسطو وبطلميوس عن العناصر السماوية."
    en: "Turned the question 'why does the Moon shine?' from a simple geometric reflection problem into a physical question about the lunar surface's nature and its response to sunlight, tying it to the Aristotle-Ptolemy debate over heavenly elements."
    ur: "«چاند کیوں چمکتا ہے؟» کے سوال کو سادہ ہندسی انعکاس کے مسئلے سے ایک طبعی سوال میں بدل دیا — چاند کی سطح کی نوعیت اور سورج کی روشنی سے اس کا تعلق — اور اسے ارسطو اور بطلمیوس کے آسمانی عناصر کی بحث سے جوڑا۔"
  history:
    ar: "بقيت الرسالة في ثلاثة شهود مخطوطة عبر حلب ولندن وسانت بطرسبورغ {cite:ismi-daw-al-qamar}. وحُفظ استدلالها في سيرة ابن الهيثم كمثال على ربطه بين البصريات والفيزياء الفلكية، لكن لا يوجد توثيق في المصادر المقروءة لنظرية «الضوء المنعكس» القمرية قبلها أو لتطورها بعدها."
    en: "The treatise survives in three manuscript witnesses across Aleppo, London and St Petersburg {cite:ismi-daw-al-qamar}. Its argument is preserved in Ibn al-Haytham's biography as an example of joining optics with physical astronomy, but the sources read document no lunar-reflection theory before it or its later development."
    ur: "رسالہ حلب، لندن اور سینٹ پیٹرزبرگ میں تین مخطوطہ گواہوں میں بچا ہے {cite:ismi-daw-al-qamar}۔ اس کا استدلال ابن الہیثم کی سوانح میں بصریات اور فلکیاتی طبیعیات کے ملاپ کی مثال کے طور پر محفوظ ہے، مگر پڑھے ماخذ اس سے پہلے یا بعد میں چاند کی روشنی کے کسی نظریے کا ارتقاء نہیں بتاتے۔"
  significance: 2
  why: "A bounded optics treatise surviving in three witnesses with a documented argument, valued as a window into Ibn al-Haytham's method of joining geometry with physical hypothesis; significance held at 2 because the secondary source summarizes the argument without the treatise text, and the modern lunar question is answered by other means."
