summary:
  ar: "رسالة عربية لابن الهيثم البصري المصري في ضوء القمر، ألّفها قبل 7 آب 1031م وبقيت منها ثلاثة شهود مخطوطة {cite:ismi-daw-al-qamar}. يرد فيها على النظرية القديمة بأن القمر يعكس ضوء الشمس كالمرايا: كل نقطة على سطح القمر تبث أشعة الضوء في كل الاتجاهات، بينما تعكس مرآة شعاعاً من مصدر واحد في اتجاه واحد، ثم يستنتج أن أثراً فيزيائياً لأشعة الشمس على القمر يجعل لونه وضوءه مرئيين {cite:ewb-ibn-al-haytham}."
  en: "An Arabic treatise by Ibn al-Haytham al-Basri al-Misri on the light of the Moon, composed before 7 August 1031 and surviving in three manuscript witnesses {cite:ismi-daw-al-qamar}. It refutes the ancient theory that the Moon reflects sunlight like a mirror: every point on the lunar surface broadcasts light rays in all directions, whereas a mirror reflects a ray from a single source in one direction, and it concludes that some physical effect of the sun's rays on the Moon renders its color — and thereby its light — visible {cite:ewb-ibn-al-haytham}."
  ur: "ابن الہیثم البصری المصري کی چاند کی روشنی پر عربی رسالہ، 7 اگست 1031ء سے پہلے مرتب اور تین مخطوطہ گواہوں میں باقی {cite:ismi-daw-al-qamar}۔ اس میں قدیم نظریہ کا رد ہے کہ چاند شمس کی روشنی آئینے کی طرح منعکس کرتا ہے: چاند کی سطح کا ہر نقطہ روشنی کی شعاعیں تمام سمتوں میں نشر کرتا ہے، جبکہ آئینہ ایک ہی ماخذ کی شعاع کو ایک ہی سمت میں منعکس کرتا ہے، اور یہ نتیجہ دیتی ہے کہ سورج کی شعاعوں کا چاند پر کوئی طبعی اثر اس کا رنگ — اور اس کے ساتھ روشنی — مرئی بناتا ہے {cite:ewb-ibn-al-haytham}۔"
