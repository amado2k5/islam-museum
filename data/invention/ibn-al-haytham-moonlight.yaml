kids:
  ar: "قبل ألف سنة، اعتقد الناس أن القمر مثل مرآة كبيرة تعكس ضوء الشمس. لكن عالماً اسمه ابن الهيثم — وهو من أشهر علماء البصريات في التاريخ — كتب رسالة صغيرة اسمه «ضوء القمر» يقول فيها: لا، القمر ليس مرآة، لأن كل نقطة على سطحه تبعث الضوء في كل الاتجاهات، مثل مصباح مضاء من كل الجهات. وهو أول من فكر في ضوء القمر كمسألة علمية حقيقية، لا مجرد شيء نراه في السماء."
  en: "A thousand years ago, people believed the Moon was like a giant mirror reflecting sunlight. But a scholar named Ibn al-Haytham — one of history's greatest students of light — wrote a small treatise called On the Light of the Moon saying: no, the Moon is not a mirror, because every point on its surface sends out light in every direction, like a lamp lit from all sides. He was among the first to treat moonlight as a real scientific question, not just something we see in the sky."
  ur: "ایک ہزار سال پہلے لوگ سمجھتے تھے کہ چاند ایک بڑا آئینہ ہے جو سورج کی روشنی منعکس کرتا ہے۔ مگر ابن الہیثم نامی عالم — جو روشنی کے مطالعے میں تاریخ کے عظیم ترین علماء میں سے ہیں — نے «ضوء القمر» نامی ایک چھوٹا سا رسالہ لکھا جس میں کہا: نہیں، چاند آئینہ نہیں، کیونکہ اس کی سطح کا ہر نقطہ روشنی کو ہر سمت میں بھیجتا ہے، جیسے ہر طرف سے روشن لیمپ۔ وہ چاند کی روشنی کو ایک حقیقی سائنسی سوال سمجھنے والوں میں سے پہلے تھے، نہ کہ بس آسمان میں دکھنے والی چیز۔"
