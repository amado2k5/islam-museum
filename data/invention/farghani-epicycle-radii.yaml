summary:
  ar: في الفصل السادس عشر من جوامع علم النجوم يعطي الفرغاني أنصاف أقطار أفلاك التدوير للكواكب على مقياس موحد يكون فيه نصف
    قطر الفلك الخارج المركز ستون جزءاً، ويذكر قيماً مثل ستة أجزاء ونصف للقمر واثنين وعشرين جزءاً ونصفاً لعطارد وستة أجزاء
    وثلث لزحل وأحد عشر جزءاً ونصفاً للمشتري ⁦(قراءات OCR تحتاج تحققاً بصرياً)⁩ {cite:farghani-elements-astronomy p. 65}.
  en: In chapter sixteen of his Jawami' al-Farghani gives the planets' epicycle radii on a unified scale where the eccentric
    deferent radius is sixty parts, with values such as six and a half parts for the Moon, twenty-two and a half for Mercury,
    six and a third for Saturn and eleven and a half for Jupiter ⁦(OCR readings needing visual check)⁩ {cite:farghani-elements-astronomy
    p. 65}.
  ur: جوامع کے باب سولہ میں فرغانی سیاروں کے تدويری دائرے کے نصف قطر ایک یگانہ پیمانے پر دیتے ہیں جس میں خارجِمرکزی دائرے
    کا نصف قطر ساٹھ حصے ہے، مثلاً چاند کے لیے ساڑھے چھ، عطارد کے لیے بائیس اور آدھے، زحل کے لیے چھ کے ایک تہائی اور مشتری
    کے لیے گیارہ اور آدھے حصے ⁦(OCR کی قراءتیں بصری تصدیق طلب ہیں)⁩ {cite:farghani-elements-astronomy p. 65}۔
  es: "En el capítulo dieciséis de su Jawami' al-Farghani da los radios epicíclicos de los planetas en una escala unificada donde el radio deferente excéntrico es sesenta partes, con valores tales como seis partes y media para la Luna, veintidós partes y media para Mercurio, seis partes y un tercio para Saturno y once partes y media para Júpiter (lecturas OCR que necesitan verificación visual) {cite:farghani-elements-astronomy p. 65}."
