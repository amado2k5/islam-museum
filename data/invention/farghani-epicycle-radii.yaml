    ur: سیاروں کے تدويری دائرے کے نصف قطر کو عربی میں یکساں پیمانے پر پہنچانا، چھوٹے دائرے کی ایجاد نہیں۔
  basis:
    ar: يعرض الفصل السادس عشر أنصاف أقطار أفلاك التدوير بمقدار يكون فيه نصف قطر الفلك الخارج المركز ستون جزءاً، مع آدوار الكواكب
      وأقواس الرجوع {cite:farghani-elements-astronomy p. 65}{cite:farghani-elements-astronomy p. 67}.
    en: Chapter sixteen gives the epicycle radii on a scale where the eccentric deferent radius is sixty parts, together with
