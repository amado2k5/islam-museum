summary:
  ar: "أنشأ الحاكم-الفلكي أولوغ بك في سمرقند نحو 823هـ/1420م أكبر مرصد معروف في عصره — مؤسسة دائمة برصديين مقيمين وأدوات ضخمة في مقدمتها قوس السدس الفخري — وأنتجت جداول نجمية هي الأدق حتى عصر تيكو براهي. هي نموذج المؤسسة الرصدية التي تلخص قرنين من الفلك الإسلامي."
  en: "The ruler-astronomer Ulugh Beg founded at Samarqand c. 823 AH/1420 CE the largest known observatory of his age — a permanent institution with resident astronomers and giant instruments, crowned by the Fakhri sextant — whose star tables were the most accurate until Tycho Brahe. It is the model institutional observatory summing two centuries of Islamic astronomy."
  ur: "حاکم-ماہرِ فلکیات الغ بیگ نے سمرقند میں823ھ/1420ء کے قریب اپنے زمانے کی سب سے بڑی معلوم رصد خانہ قائم کی — مستقل ادارہ جس میں مقیم ماہرینِ فلک اور عظیم آلات تھے، فخری سیکسٹنٹ سب سے نمایاں — جس کے نجومی جدول ٹائکو براہے تک درست ترین تھے۔ یہ ادارہ جاتی رصد خانہ کا وہ نمونہ ہے جو دو صدیوں کی اسلامی فلکیات کو سمیٹتا ہے۔"
  es: "El gobernante y astrónomo Ulugh Beg fundó en Samarcanda hacia el año 823 de la Hégira (1420 d. C.) el mayor observatorio conocido de su época: una institución permanente con astrónomos residentes e instrumentos gigantes, coronado por el sextante Fakhri, cuyas tablas estelares fueron las más precisas hasta la época de Tycho Brahe. Es el modelo de observatorio institucional que resume dos siglos de astronomía islámica."
  fr: "Le souverain-astronome Ulugh Beg fonda à Samarcande vers 823 AH/1420 apr. J.-C. le plus grand observatoire connu de son époque: une institution permanente dotée d’astronomes résidents et d’instruments gigantesques, dont le sextant Fakhri, dont les tables stellaires furent les plus précises jusqu’à Tycho Brahe. Cet observatoire institutionnel est le modèle de référence pour deux siècles d’astronomie islamique."
