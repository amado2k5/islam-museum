kids:
  ar: "قبل ستمائة سنة بنى ملك يحب النجوم أكبر مرصد في العالم في سمرقند: آلات ضخمة مثبتة في الأرض تقيس مواضع النجوم بدقة لم يسبقها أحد. اسمه أولوغ بك، وكان يجلس مع علمائه يرصدون الليل بعد الليل حتى صنعوا أدق جدول نجوم في زمانهم."
  en: "Six hundred years ago a king who loved the stars built the world's biggest observatory at Samarqand: giant instruments fixed in the ground measuring star positions more accurately than anyone before. His name was Ulugh Beg, and he sat with his scholars night after night until they made the most accurate star table of their age."
  ur: "چھ سو سال پہلے نجوم سے محبت کرنے والے بادشاہ نے سمرقند میں دنیا کی سب سے بڑی رصد خانہ بنائی: زمین میں جڑے عظیم آلات جو ستاروں کی پوزیشنیں پہلے کے کسی سے زیادہ درست ناپتے۔ اس کا نام الغ بیگ تھا، اور وہ اپنے علماء کے ساتھ رات در رات بیٹھ کر رصد کرتا یہاں تک کہ اپنے زمانے کا درست ترین ستاروں کا جدول بنایا۔"
