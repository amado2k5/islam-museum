impact:
  fields: [mathematics, institutions-systems]
  changed:
    ar: "جعلت القيمة المكانية والصفر أساس الحساب المكتوب في العالم الإسلامي ثم في أوروبا، فاستبدلت تدريجياً الحساب بالأحرف والمعداد {cite:smith-karpinski-hindu-arabic-1911}."
    en: "Place value and the zero became the basis of written reckoning in the Islamic world and then in Europe, gradually displacing letter numerals and the abacus {cite:smith-karpinski-hindu-arabic-1911}."
    ur: "مقامی قدر اور صفر عالمِ اسلام میں اور پھر یورپ میں تحریری حساب کی بنیاد بنے، اور حرفی ہندسوں اور گنتارے کی جگہ بتدریج لے لی {cite:smith-karpinski-hindu-arabic-1911}۔"
  history:
    ar: "من أنجح حلقات النقل العلمي في التاريخ: نظام هندي حُفظ وعُلّم وطُوّر في العالم الإسلامي قبل أن يصبح كتابة العدد العالمية {cite:smith-karpinski-hindu-arabic-1911}."
    en: "One of history's most consequential transmissions: an Indian system kept, taught and developed in the Islamic world before becoming the world's way of writing number {cite:smith-karpinski-hindu-arabic-1911}."
    ur: "تاریخ کا ایک نہایت مؤثر علمی انتقال: ہندوستانی نظام عالمِ اسلام میں محفوظ، سکھایا اور ترقی پذیر ہوا، پھر دنیا کا معیاری رقم الکتاب بنا {cite:smith-karpinski-hindu-arabic-1911}۔"
  significance: 5
  why: "The documented carrier of the decimal place-value system from India to Europe — the transmission on which the world's notation of number still runs."
