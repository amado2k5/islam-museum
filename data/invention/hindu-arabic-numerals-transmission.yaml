today:
  form:
    ar: "الأرقام العربية الحديثة ⁦(0-9)⁩ في اللاتينية والأرقام الشرقية ⁦(٠-٩)⁩ في العربية كلتاهما سليل النظام نفسه؛ والمتحف يسجل الخطين معاً {cite:smith-karpinski-hindu-arabic-1911}."
    en: "The modern Western digits ⁦(0-9)⁩ and the Eastern Arabic digits ⁦(٠-٩)⁩ are both descendants of the same system; the museum records the two lines together {cite:smith-karpinski-hindu-arabic-1911}."
    ur: "جدید مغربی ہندسے ⁦(0-9)⁩ اور مشرقی عربی ہندسے ⁦(٠-٩)⁩ دونوں اسی نظام کی اولاد ہیں؛ عجائب گھر دونوں لکیریں ایک ساتھ لکھتا ہے {cite:smith-karpinski-hindu-arabic-1911}۔"
  descendants:
    ar: "كل حساب رقمي يومي — مدارس، أسواق، حواسيب — يقوم على النظام الذي مرّ بهذه الرحلة {cite:smith-karpinski-hindu-arabic-1911}."
    en: "All daily digital reckoning — schools, markets, computers — runs on the system that travelled this route {cite:smith-karpinski-hindu-arabic-1911}."
    ur: "ہر روزمرہ رقمی حساب — مدارس، بازار، کمپیوٹر — اسی نظام پر چلتا ہے جو اس راستے سے گزرا {cite:smith-karpinski-hindu-arabic-1911}۔"
