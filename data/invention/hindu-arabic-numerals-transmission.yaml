id: invention/hindu-arabic-numerals-transmission
class: invention
label:
  ar: "الأرقام الهندية العربية: رحلة النظام العشري من الهند عبر العالم الإسلامي إلى أوروبا"
  en: "The Hindu-Arabic numerals: the decimal system's journey from India through the Islamic world to Europe"
  ur: "ہندو عربی ہندسے: اعشاری نظام کا سفر ہند سے عالمِ اسلام کے راستے یورپ تک"
names:
  - { value: "الأرقام الهندية", kind: alternate, lang: ar }
  - { value: "أرقام الغبار", kind: alternate, lang: ar }
  - { value: "huruf al-ghubar (dust numerals)", kind: alternate, lang: en }
  - { value: "ghubar numerals", kind: alternate, lang: en }
  - { value: "Arabic numerals", kind: alternate, lang: en }
  - { value: "الاعداد الهندی", kind: alternate, lang: ur }
summary:
  ar: "الأرقام العشرية ذات القيمة المكانية جاءت من الهند؛ فلما دخلت بغداد مع كتب الفلك الهندية تبنّاها علماء الحساب في العالم الإسلامي، وكتب فيها الكندي وسند بن علي والخوارزمي وغيرهم، ومن ترجمة كتاب الخوارزمي لاتينياً نحو سنة ⁦(1130م)⁩ ثم «ليبر أباتشي» لليوناردو البيزي ⁦(1202م)⁩ انتقلت إلى أوروبا {cite:smith-karpinski-hindu-arabic-1911}."
  en: "The decimal place-value numerals came from India; when they reached Baghdad with Indian astronomical books, the reckoning scholars of the Islamic world adopted them, with al-Kindi, Sanad ibn Ali and al-Khwarizmi among the writers. Through the Latin translation of al-Khwarizmi's arithmetic about ⁦(1130)⁩ and then Leonardo of Pisa's Liber Abbaci ⁦(1202)⁩ they passed to Europe {cite:smith-karpinski-hindu-arabic-1911}."
  ur: "اعشاری مقامی ہندسے ہند سے آئے؛ جب وہ ہندوستانی فلکیاتی کتابوں کے ساتھ بغداد پہنچے تو عالمِ اسلام کے ماہرینِ حساب نے انہیں اپنا لیا، جن میں کندی، سند بن علی اور خوارزمی شامل ہیں۔ خوارزمی کی کتابِ حساب کے لاطینی ترجمے ⁦(تقریباً 1130ء)⁩ اور پھر لیونارڈو آف پیسا کی لیبر اباچی ⁦(1202ء)⁩ سے یہ یورپ پہنچے {cite:smith-karpinski-hindu-arabic-1911}۔"
