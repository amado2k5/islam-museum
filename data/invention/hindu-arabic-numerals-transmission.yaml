origin:
  place: place/baghdad
  polity: polity/abbasid-caliphate
  context:
    ar: "بغداد المأمونية، حيث جمعت خزانة الحكمة العلماء، وحيث كان الخوارزمي منقطعاً إليها؛ وكانت كتب الفلك الهندية ⁦(السند هند)⁩ قد دخلت المدينة في عهد المنصور قبل ذلك {cite:smith-karpinski-hindu-arabic-1911}."
    en: "Al-Ma'mun's Baghdad, where the house of wisdom gathered the scholars and where al-Khwarizmi worked; the Indian astronomical books (the Sindhind) had already entered the city under al-Mansur {cite:smith-karpinski-hindu-arabic-1911}."
    ur: "المأمون کا بغداد، جہاں بیت الحکمت نے علماء کو جمع کیا اور جہاں خوارزمی کام کرتا تھا؛ ہندوستانی فلکیاتی کتابیں ⁦(سند ہند)⁩ اس سے پہلے المنصور کے عہد میں شہر میں داخل ہو چکی تھیں {cite:smith-karpinski-hindu-arabic-1911}۔"
makers:
  - person: person/al-khwarizmi
    role: transmitter
    place: place/baghdad
    note: "His lost Arabic book on Indian reckoning, surviving in the Latin 'Algoritmi de numero Indorum', carried the decimal numerals westward; a systematiser and transmitter, not the numerals' inventor."
    sources: [source/smith-karpinski-hindu-arabic-1911]
  - person: person/al-kindi
    role: transmitter
    place: place/baghdad
    note: "Wrote books on arithmetic and on the Indian method of reckoning before al-Khwarizmi's book, per Smith and Karpinski's survey of the Arabic testimony."
    sources: [source/smith-karpinski-hindu-arabic-1911]
  - person: person/sanad-ibn-ali
    role: transmitter
    place: place/baghdad
    note: "Al-Ma'mun's astronomer, credited with a work on the Hindu method of reckoning, though some works ascribed to him may be al-Khwarizmi's."
    sources: [source/smith-karpinski-hindu-arabic-1911]
  - person: person/fibonacci
    role: transmitter
    place: place/bejaia
    note: "Leonardo of Pisa learned the numerals at Bugia where his father was a commercial agent, and his Liber Abbaci ⁦(1202, revised 1228)⁩ spread them through Latin Europe."
    sources: [source/smith-karpinski-hindu-arabic-1911]
attribution:
  status: transmission
  claim:
    ar: "دور العالم الإسلامي موثق: تبنّى الأرقام الهندية وعلّمها وطوّر الحساب عليها وحملها إلى أوروبا؛ ولا يُدَّعى اختراع الأرقام التي يعترف الكتاب العرب أنفسهم بأنها هندية."
    en: "The Islamic world's documented role: it adopted the Indian numerals, taught and developed the reckoning built on them, and carried them to Europe; no invention of the numerals is claimed, which the Arabic writers themselves acknowledged as Hindu."
    ur: "عالمِ اسلام کا موثق کردار: ہندو ہندسوں کو اپنایا، ان پر مبنی حساب سکھایا اور ترقی دی، اور انہیں یورپ پہنچایا؛ ہندسوں کی ایجاد کا دعویٰ نہیں، جنہیں خود عرب مصنفین نے ہندو قرار دیا۔"
  basis:
    ar: "سميث وكاربينسكي: الكتاب العرب منذ مطلع القرن التاسع أقروا بالأصل الهندي؛ وكتاب الخوارزمي المفقود عربياً بقيت ترجمته اللاتينية «Algoritmi de numero Indorum» ⁦(نحو 1130)⁩، ثم ليبر أباتشي 1202 نشر النظام في أوروبا {cite:smith-karpinski-hindu-arabic-1911}."
    en: "Smith and Karpinski: Arabic writers from the early ninth century acknowledged the Indian origin; al-Khwarizmi's lost book survives as the Latin 'Algoritmi de numero Indorum' ⁦(c. 1130)⁩, then the Liber Abbaci of 1202 spread the system in Europe {cite:smith-karpinski-hindu-arabic-1911}."
    ur: "اسمتھ اور کارپنسکی: نویں صدی کے شروع سے عرب مصنفین نے ہندوستانی اصل تسلیم کی؛ خوارزمی کی گمشدہ کتاب لاطینی «Algoritmi de numero Indorum» ⁦(تقریباً 1130ء)⁩ میں باقی ہے، پھر 1202ء کی لیبر اباچی نے نظام یورپ میں پھیلایا {cite:smith-karpinski-hindu-arabic-1911}۔"
