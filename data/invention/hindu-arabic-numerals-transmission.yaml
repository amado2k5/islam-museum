      summary: { ar: "الموقف التقليدي في المصادر العربية — The numerals are Indian; Arabic writers called the science ilm hindi and the signs Hindu figures and said so openly.", en: "The numerals are Indian; Arabic writers called the science ilm hindi and the signs Hindu figures and said so openly.", ur: "عربی مآخذوں کا روایتی موقف — The numerals are Indian; Arabic writers called the science ilm hindi and the signs Hindu figures and said so openly." }
