kids:
  ar: "الأرقام التي نكتب بها اليوم جاءت من الهند، وحملها علماء بغداد في كتبهم، ثم تعلّمها الأوروبيون من كتاب الخوارزمي ومن كتاب فيبوناتشي. حتى كلمة «الخوارزمية» ⁦(algorithm)⁩ جاءت من اسم الخوارزمي."
  en: "The numerals we write today came from India; Baghdad's scholars carried them in their books, and Europeans learned them from al-Khwarizmi's book and Fibonacci's book. Even the word 'algorithm' comes from al-Khwarizmi's name."
  ur: "جو ہندسے ہم آج لکھتے ہیں وہ ہند سے آئے؛ بغداد کے علماء نے انہیں اپنی کتابوں میں پہنچایا، اور یورپیوں نے خوارزمی اور فبوناچی کی کتابوں سے سیکھے۔ یہاں تک کہ «الگورتھم» کا لفظ خوارزمی کے نام سے بنا۔"
