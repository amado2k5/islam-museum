impact:
  fields: [architecture-building, institutions-systems]
  changed:
    ar: "يصف لسترنج انتقال المحال من الطرق ذات الأروقة، ثم استعمال الأروقة المفرغة ثكنات دائمة لشرطة المدينة وحرس الخيل {cite:lestrange-baghdad-1900 p.25–26}. لا تقيس الروايات انخفاض المخاطر أو سهولة التجارة بعد النقل."
    en: "Le Strange describes shops leaving the arcaded roads and the cleared arcades becoming permanent barracks for city police and horse-guard {cite:lestrange-baghdad-1900 p.25–26}. The accounts do not measure whether risk fell or trade became easier."
    ur: "لی اسٹرینج دکانوں کے محرابی راستوں سے ہٹنے اور خالی راہداریوں کے شہر کے سپاہیوں اور گھڑ سوار محافظوں کی مستقل چھاؤنی بننے کا ذکر کرتے ہیں {cite:lestrange-baghdad-1900 p.25–26}۔ روایات خطرہ کم ہونے یا تجارت آسان ہونے کی پیمائش نہیں کرتیں۔"
  history:
    ar: "يصف الدوري أسواقاً مستقلة لأهل حرف وتجارات مختلفة، ثم أحياء لتجار قدموا من مدن متعددة مع نمو بغداد؛ ويقول لسترنج إن الكرخ صار مركزاً تجارياً مهماً في غربيها. لا يثبت ذلك أن أمر773م وحده سبب كل نمو لاحق {cite:tdv-bagdat-duri Markets} {cite:lestrange-baghdad-1900 p.65–66}."
    en: "Duri describes separate bazaars for different crafts and trades, then merchant quarters as people came from multiple cities while Baghdad grew; Le Strange calls Karkh an important later commercial centre in western Baghdad. Neither establishes that the773CE order alone caused all later growth {cite:tdv-bagdat-duri Markets} {cite:lestrange-baghdad-1900 p.65–66}."
    ur: "دوری مختلف پیشوں کے الگ بازار اور بغداد کے پھیلاؤ کے ساتھ کئی شہروں سے آنے والے تاجروں کے محلے بیان کرتے ہیں؛ لی اسٹرینج کرخ کو مغربی بغداد کا اہم تجارتی مرکز کہتے ہیں۔ اس سے ثابت نہیں ہوتا کہ773ء کا حکم ہی بعد کی تمام ترقی کا سبب تھا {cite:tdv-bagdat-duri Markets} {cite:lestrange-baghdad-1900 p.65–66}۔"
  significance: 3
