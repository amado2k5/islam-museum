    en: "Maqqari explicitly attributes the addition; Reynolds exposes his editing of older voices, so retellings are not independent confirmations {cite:nafh-tib-maqqari v.3 p.126} {cite:reynolds-ziryab-2008 pp.158–166}."
    ur: "مقری صراحت سے اضافہ منسوب کرتے ہیں؛ رینلڈز پرانی آوازوں کی تدوین دکھاتے ہیں، اس لیے بازگفت الگ تصدیق نہیں {cite:nafh-tib-maqqari v.3 p.126} {cite:reynolds-ziryab-2008 pp.158–166}۔"
  perspectives:
