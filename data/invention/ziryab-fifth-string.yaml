        en: "Sunni frame presents Maqqari's attributed red string between mathlath and mathna, symbolizing soul in the humour analogy, not a ruling on music {cite:nafh-tib-maqqari v.3 p.126}."
        ur: "سنی سیاق میں مقری کی منسوب سرخ تار مثلث و مثنیٰ کے بیچ اخلاط کی تمثیل میں روح ہے، موسیقی پر حکم نہیں {cite:nafh-tib-maqqari v.3 p.126}۔"
      sources: [source/nafh-tib-maqqari]
    - tradition: academic
      id: reynolds-source-critical-reading
      summary:
        ar: "مقارنة رينولدز تبين سيرة مثالية مركبة من مصادر أقدم؛ تحذر من صورة العبقري المنفرد، ولا تختبر وتراً أو تثبت أن كل تفصيل كاذب {cite:reynolds-ziryab-2008 pp.158–166}."
        en: "Reynolds shows an idealized composite from older sources; caution about solitary genius, not a string test or proof every detail is false {cite:reynolds-ziryab-2008 pp.158–166}."
        ur: "رینلڈز قدیم ماخذ سے مرتب مثالی تصویر دکھاتے ہیں؛ تنہا نابغے سے احتیاط، تار کا تجربہ یا ہر جزو جھوٹ ہونے کا ثبوت نہیں {cite:reynolds-ziryab-2008 pp.158–166}۔"
      sources: [source/reynolds-ziryab-2008]
