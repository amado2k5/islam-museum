  ar: "إضافة وتر أحمر إلى عود موروث ذي أربعة أوتار في خبر المقري؛ نسبة تاريخية تحفظ معها نقدية المصادر، لا اختراع العود {cite:nafh-tib-maqqari v.3 p.126} {cite:reynolds-ziryab-2008 pp.155–158,166}."
