attribution:
  status: original
  claim:
    ar: "نظام أصيل موثق في خمسة أقسام وأربعمائة نوع رتبه المؤلف في خطبته؛ لا أسبقية مطلقة لتصنيف الحديث كله."
    en: "A documented original scheme of five divisions and four hundred types arranged in the author's preface; no absolute priority claimed for hadith classification as a whole."
    ur: "مصنف کے خطبے میں ترتیب دی گئی پانچ اقسام اور چار سو انواع کی ایک مستند نئی درجہ بندی؛ حدیث کی درجہ بندی کے مجموعی پر کوئی مطلق سبقت نہیں۔"
  basis:
    ar: "يشرح ابن حبان في خطبته أنه جعل السنن أقساماً على حذو تأليف القرآن، ثم فصّل الأقسام الخمسة وأنواعها ومبلغها أربعمائة نوع، وعلل ذلك بتيسير الطلب {cite:sahih-ibn-hibban-shakir-maarif-v1 pp. 56-59} {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 109} {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 112-113}."
    en: "Ibn Hibban explains in his preface that he made the traditions into divisions following the arrangement of the Qur'an, then details the five divisions, their types and the total of four hundred types, giving ease of retrieval as the reason {cite:sahih-ibn-hibban-shakir-maarif-v1 pp. 56-59} {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 109} {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 112-113}."
    ur: "ابن حبان اپنے خطبے میں بتاتے ہیں کہ انہوں نے سنن کو قرآن کی تالیف کے انداز پر اقسام میں بانٹا، پھر پانچ اقسام، ان کی انواع اور چار سو انواع کا مجموعہ بیان کیا اور طلب کی آسانی کو وجہ قرار دیا {cite:sahih-ibn-hibban-shakir-maarif-v1 pp. 56-59} {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 109} {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 112-113}۔"
