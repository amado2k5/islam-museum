impact:
  fields: [institutions-systems]
  changed:
    ar: "أعطى كلام الحديث نظام تصنيف معلناً بأقسامه وأنواعه ومبلغه، معللاً الغاية بتيسير الطلب والفهم {cite:sahih-ibn-hibban-shakir-maarif-v1 pp. 56-59}."
    en: "Gave the hadith corpus a declared classification system of divisions, types and total count, justifying the aim as ease of retrieval and understanding {cite:sahih-ibn-hibban-shakir-maarif-v1 pp. 56-59}."
    ur: "حدیث کے ذخیرے کو ایک اعلان شدہ درجہ بندی دی — اقسام، انواع اور کل تعداد کے ساتھ — جس کا مقصد طلب اور فہم کی آسانی بیان کیا گیا {cite:sahih-ibn-hibban-shakir-maarif-v1 pp. 56-59}۔"
  history:
    ar: "صنف كتابه بين الصحيحين والمستدرك في مرتبة النقاد، وبقيت أقسامه مرجعاً لفهم بنيته مع إعادة ترتيب لاحقة عليه {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 11} {cite:sahih-ibn-hibban-shakir-maarif-v1 pp. 56-59}."
    en: "His book is ranked by critics between the two Sahihs and the Mustadrak; his divisions remain the key to its structure even after later re-arrangement {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 11} {cite:sahih-ibn-hibban-shakir-maarif-v1 pp. 56-59}."
    ur: "ان کی کتاب نقادوں کے یہاں صحیحین اور مستدرک کے درمیان درج ہے؛ بعد کی ترتیب کے باوجود ان کے اقسام اس کی ساخت کی کنجی رہے {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 11} {cite:sahih-ibn-hibban-shakir-maarif-v1 pp. 56-59}۔"
  significance: 3
  why: "A genuinely novel and explicitly reasoned classification of the whole hadith corpus into a fixed five-division, four-hundred-type scheme; bounded to this book's organisation, not a claim that hadith was never classified before."
