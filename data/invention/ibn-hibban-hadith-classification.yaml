id: invention/ibn-hibban-hadith-classification
class: invention
label: { ar: "تقسيم ابن حبان للحديث إلى أقسامه الخمسة", en: "Ibn Hibban's five-division classification of hadith", ur: "ابن حبان کی حدیث کی پانچ اقسام میں تقسیم" }
names:
  - { value: "Al-Anwa' divisions of Sahih Ibn Hibban", kind: alternate, lang: en }
  - { value: "أقسام السنن الخمسة", kind: alternate, lang: ar }
summary:
  ar: "نظام تصنيف للسنة النبوية رتّبه ابن حبان في خمسة أقسام كبرى — الأوامر والنواهي والأخبار والإباح والإخبار عن الأفعال — تتفرع إلى أربعمائة نوع، بقصد تيسير الطلب والفهم على ما يذكر خطبته {cite:sahih-ibn-hibban-shakir-maarif-v1 pp. 56-59} {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 109} {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 112-113}."
  en: "A classification scheme for the Prophetic tradition arranged by Ibn Hibban into five major divisions — commands, prohibitions, reports, permissions, and reports of actions — branching into four hundred types, intended to ease retrieval and understanding according to his preface {cite:sahih-ibn-hibban-shakir-maarif-v1 pp. 56-59} {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 109} {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 112-113}."
  ur: "نبی کی روایت کی ایک درجہ بندی جو ابن حبان نے پانچ بڑے حصوں — احکام، منع، خبریں، اجازتیں اور افعال کی خبریں — میں بانٹی جو چار سو اقسام میں منقسم ہوتی ہیں، خطبے کے مطابق طلب اور فہم کو آسان بنانے کے لیے {cite:sahih-ibn-hibban-shakir-maarif-v1 pp. 56-59} {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 109} {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 112-113}۔"
