kids:
  ar: "جمعت كتب الحديث الأخبار في ترتيب واحد، لكن ابن حبان أراد ترتيباً أوضح: قسّمها خمسة أقسام كبرى — أوامر ونواهٍ وأخبار وإباح وأفعال — حتى يربعمائة نوع، ليجد القارئ ما يطلب بسهولة أكبر."
  en: "Hadith books had gathered reports in one ordering, but Ibn Hibban wanted a clearer one: he divided them into five great divisions — commands, prohibitions, reports, permissions and actions — up to four hundred types, so a reader could find what he sought more easily."
  ur: "حدیث کی کتابیں روایات ایک ترتیب میں جمع کرتی تھیں، مگر ابن حبان نے واضح ترتیب چاہی: انہوں نے انہیں پانچ بڑے حصوں — احکام، منع، خبریں، اجازتیں اور افعال — میں بانٹا، چار سو انواع تک، تاکہ قاری اپنی طلب آسانی سے پائے۔"
