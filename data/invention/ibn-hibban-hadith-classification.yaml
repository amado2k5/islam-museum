today:
  form:
    ar: "نموذج تاريخي لتنظيم نص علمي؛ الصورة المخطوطة المعروضة من صحيح البخاري نسخة أقدمتقریباً 1000ء، سياقية لنفس تقليد كتب الحديث ولا هي نسخة من كتاب ابن حبان {cite:commons-sahih-bukhari-minghana-1936 Description}."
    en: "Historical example of organising a scholarly text; the displayed manuscript image is an older Sahih al-Bukhari copy of about 1000 CE — contextual for the same hadith-book tradition, not a copy of Ibn Hibban's work {cite:commons-sahih-bukhari-minghana-1936 Description}."
    ur: "علمی متن کی ترتیب کی تاریخی مثال؛ دکھائی گئی مخطوطہ صحیح بخاری کی ایک پرانی نقل تقریباً 1000ء کی ہے — اسی حدیثی کتابی روایت کا سیاقی نمونہ، ابن حبان کی کتاب کی نقل نہیں {cite:commons-sahih-bukhari-minghana-1936 Description}۔"
  descendants:
    ar: "أنظمة التصنيف الحديثة للحديث تستمر في ترتيب الموضوعات، لكن لا نثبت نسلاً مباشراً من أقسامه الخمسة {cite:sahih-ibn-hibban-shakir-maarif-v1}."
    en: "Modern hadith-classification systems continue topical ordering, but no direct descent from his five divisions is established here {cite:sahih-ibn-hibban-shakir-maarif-v1}."
    ur: "جدید حدیث کی درجہ بندی کے نظام موضوعی ترتیب جاری رکھتے ہیں، مگر ان کے پانچ اقسام سے براہ راست نسل یہاں ثابت نہیں {cite:sahih-ibn-hibban-shakir-maarif-v1}۔"
