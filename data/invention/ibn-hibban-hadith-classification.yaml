    note: "Earlier collections ordered material by companion, by legal topic or by mixed arrangement; Ibn Hibban's five speech-act divisions are his own stated scheme, not a copy of those orderings {cite:sahih-ibn-hibban-shakir-maarif-v1 pp. 56-59}."
