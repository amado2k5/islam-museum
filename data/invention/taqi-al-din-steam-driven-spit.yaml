summary:
  ar: وصف في «الطرق السنية في الآلات الروحانية» ⁦(1551)⁩ آلة مطبخ — يُصبّ
    بخار الماء الغالي على ريش عجلة محمولة على محور السيخ فيدور الشواء
    ذاتياً — أقدم وصف معروف لمبدأ التوربين البخاري الدافع، قبل برانكا
    بثمانين سنة تقريباً {cite:wikipedia-taqi-al-din-en}
    {cite:wikipedia-steam-engine-en}.
  en: Described in the Al-Turuq al-saniyya fi al-alat al-ruhaniyya
    ⁦(1551)⁩ — a kitchen machine in which steam rising from boiling water
    is directed onto the vanes of a wheel mounted on the spit''s axle,
    turning the roast by itself — the earliest known description of the
    impulse steam-turbine principle, some eighty years before Giovanni
    Branca {cite:wikipedia-taqi-al-din-en} {cite:wikipedia-steam-engine-en}.
  ur: 'الطرق السنیہ فی الالات الروحانیہ ⁦(1551ء)⁩ میں درج: ایک باورچی
    خانے کی مشین جس میں کھولتے پانی کی بخار سیخ کے محور پر لگی پہیے کے
    پروں پر ماری جاتی اور کباب خود سے گھومتا — دافع بخار ٹربائن کے اصول
    کی قدیم ترین معلوم تفصیل، جیوواننی برانکا سے تقریباً اسی برس پہلے
    {cite:wikipedia-taqi-al-din-en} {cite:wikipedia-steam-engine-en}۔'
  es: "Descrita en el Al-Turuq al-saniyya fi al-alat al-ruhaniyya (1551) — una máquina de cocina en la que el vapor que sale del agua hirviendo se dirige a las paletas de una rueda montada en el eje del asador, haciendo girar el asado por sí mismo — la descripción más antigua conocida del principio de la turbina de vapor de impulso, unos ochenta años antes de Giovanni Branca {cite:wikipedia-taqi-al-din-en} {cite:wikipedia-steam-engine-en}."
  fr: "Décrite dans Al-Turuq al-saniyya fi al-alat al-ruhaniyya (1551) — une machine de cuisine dans laquelle la vapeur s'élevant de l'eau bouillante est dirigée sur les ailettes d'une roue montée sur l'axe de la broche, faisant tourner le rôti d'elle-même — la plus ancienne description connue du principe de la turbine à vapeur à impulsion, quelque quatre-vingts ans avant Giovanni Branca {cite:wikipedia-taqi-al-din-en} {cite:wikipedia-steam-engine-en}."
