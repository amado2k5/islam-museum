  changed:
    ar: 'حوّل البخار من لعبة إيوليبيل إلى مبدأ عمل: دفع نفاث على ريش
      ينتج دوراناً مفيداً — الفكرة التي ستقوم عليها التوربينات بعد ثلاثة
      قرون {cite:wikipedia-steam-engine-en}.'
    en: 'It turned steam from aeolipile toy to working principle: a jet
      striking vanes produces useful rotation — the idea steam
      turbines would run on three centuries later
      {cite:wikipedia-steam-engine-en}.'
    ur: 'بخار کو ایولیپائل کھلونے سے کام کے اصول میں بدل دیا: پروں پر
      لگنے والا جھٹکا مفید گردش پیدا کرتا ہے — وہی خیال جس پر تین صدیوں
      بعد بخار ٹربائن چلیں گے {cite:wikipedia-steam-engine-en}۔'
  history:
    ar: 'ظل الوصف حبيس مخطوطات قليلة النسخ فلم يبنِ سلسلة صنع، لكنه
      يؤرخ العقلية نفسها: أن بخاراً يمكن أن يشتغل — قبل برانكا 1629
      وسايفري 1698 ونيوكومن 1712 وواط 1764 {cite:wikipedia-steam-engine-en}.'
    en: 'The description stayed inside a few-copied manuscript and
      built no workshop line, but it dates the mindset itself: that
      steam can do work — before Branca 1629, Savery 1698, Newcomen
      1712 and Watt 1764 {cite:wikipedia-steam-engine-en}.'
    ur: 'یہ تفصیل چند نسخوں والے مخطوطے میں رہی اور کوئی کارخانہ سلسلہ
      نہ بنا سکی، مگر سوچ ہی کی تاریخ درج کرتی ہے: بخار کام کر سکتا
      ہے — برانکا 1629ء، سیوری 1698ء، نیوکومن 1712ء اور واٹ 1764ء سے
      پہلے {cite:wikipedia-steam-engine-en}۔'
