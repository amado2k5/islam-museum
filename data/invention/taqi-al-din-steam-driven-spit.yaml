  claim:
    ar: 'أول وصف مكتوب معروف لآلة تدير عموداً بدفع بخار على ريش عجلة —
      مبدأ التوربين الاندفاعي مطبقاً على سيخ شواء؛ وهو وصف تصميم لا آلة
      موثقة الصنع ولا محرك بخاري بالمعنى اللاحق {cite:wikipedia-taqi-al-din-en}
      {cite:wikipedia-steam-engine-en}.'
    en: 'The first known written description of a machine turning a
      shaft by steam directed onto a wheel''s vanes — the impulse-turbine
      principle applied to a roasting spit; it is a described design,
      not a documented built machine and not a steam engine in the
      later sense {cite:wikipedia-taqi-al-din-en}
      {cite:wikipedia-steam-engine-en}.'
    ur: 'پہلی معلوم تحریری تفصیل کسی ایسی مشین کی جو بخار کو پہیے کے
      پروں پر مار کر محور گھماتی ہے — دافع ٹربائن کا اصول کباب سیخ پر
      لگا؛ یہ بیان شدہ ڈیزائن ہے، نہ مصدقہ تعمیر شدہ مشین اور نہ بعد کے
      معنوں میں بخار انجن {cite:wikipedia-taqi-al-din-en}
      {cite:wikipedia-steam-engine-en}۔'
  basis:
    ar: 'نص «الطرق السنية» ⁦(959هـ/1551م)⁩ ومخطوطته المؤرخة، ومراجعة هيل
      للطبعة في إيزيس ⁦(1978)⁩، وسجل المحرك البخاري الذي يسلسله بين
      إيوليبيل هيرون ⁦(القرن الأول)⁩ وبرانكا ⁦(1629)⁩
      {cite:taqi-turuq-hasan-1976} {cite:wikipedia-taqi-al-din-en}
      {cite:wikipedia-steam-engine-en}.'
    en: 'The al-Turuq al-saniyya text ⁦(959 AH/1551)⁩ in its dated
      manuscript, Hill''s Isis review of the edition ⁦(1978)⁩, and the
      steam-engine record which places the device in the chain between
      Hero''s aeolipile ⁦(first century)⁩ and Branca ⁦(1629)⁩
      {cite:taqi-turuq-hasan-1976} {cite:wikipedia-taqi-al-din-en}
      {cite:wikipedia-steam-engine-en}.'
    ur: 'الطرق السنیہ کا متن ⁦(959ھ/1551ء)⁩ اس کے مؤرخ مخطوطے میں،
      طباعت پر ہل کا آئسس جائزہ ⁦(1978ء)⁩، اور بخار انجن کا ریکارڈ جو
