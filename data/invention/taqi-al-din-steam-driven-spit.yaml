  context:
    ar: 'كتبه تقي الدين في مصر العثمانية حيث قضى عشرين سنة معلماً وقاضياً
      وفلكياً قبل استدعائه إلى إستانبول؛ والكتاب أحد تسعين مصنفاً في
      الفلك والهندسة والبصريات، وفيه أيضاً آلات رفع الماء الأربع
      {cite:wikipedia-taqi-al-din-en} {cite:taqi-fazlioglu-bea}.'
    en: 'Taqi al-Din wrote it in Ottoman Egypt, where he spent twenty
      years as teacher, qadi and astronomer before his summons to
      Constantinople; the book is one of his ninety-odd works on
      astronomy, engineering and optics, and also contains his four
      water-raising machines {cite:wikipedia-taqi-al-din-en}
      {cite:taqi-fazlioglu-bea}.'
    ur: 'تقی الدین نے اسے عثمانی مصر میں لکھا، جہاں قسطنطنیہ بلانے سے پہلے
      وہ بیس برس مدرس، قاضی اور فلکی دان رہے؛ یہ کتاب ان کی نودے فلکیات،
      انجینئرنگ اور بصریات کی کتابوں میں سے ہے اور اس میں پانی اٹھانے
      والی چار مشینیں بھی ہیں {cite:wikipedia-taqi-al-din-en}
      {cite:taqi-fazlioglu-bea}۔'
