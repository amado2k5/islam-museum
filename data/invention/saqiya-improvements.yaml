summary:
  ar: تطوير مهندسي الإسلام للساقية — سلسلة الدلاء المعلّقة التي يديرها
    حيوان عبر تروس أفقية-عمودية فترفع الماء من عشرة إلى عشرين متراً؛
    عند الجزري ⁦(1206)⁩ آلة مركبة يدير فيها بقر على سطح خزان علوي ساقية
    بينما تسقط مياه على شفرات دولاب بخزان سفلي، وأول ذُقن معروف في
    ساقية وأول تضمين لتقليل تقطع الجريان {cite:wikipedia-saqiyah-en}
    {cite:needham-scc-v4p2-1965} {cite:hill-engineering-ehas-1998}.
  en: The Islamic engineers'' development of the saqiya — the
    animal-driven chain-of-pots wheel geared through horizontal and
    vertical wheels that lifts water from ten to twenty metres; in
    al-Jazari ⁦(1206)⁩ a composite machine where an ox on an upper
    reservoir''s roof drives the saqiya while water falls onto the
    scoop pallets of a wheel in a lower reservoir, plus the first
    known crank in a saqiya and the earliest implied minimising of
    intermittence {cite:wikipedia-saqiyah-en} {cite:needham-scc-v4p2-1965}
    {cite:hill-engineering-ehas-1998}.
  ur: مسلمان انجینیئروں کی ساقیہ کی ترویج — حیوان چلنے والی زنجیرِ مٹکے
    پہیہ جو افقی و عمودی گیاروں سے دس تا بیس میٹر پانی اٹھاتی ہے؛ الجزری
    ⁦(1206ء)⁩ میں مرکب مشین جس میں اوپر کے حوض کی چھت پر چلتا بیل
    ساقیہ چلاتا اور نیچے کے حوض میں گرتی پانی پہیے کے پیمانوں پر پڑتی،
    ساتھ ہی ساقیہ میں پہلی معلوم کُرنک اور بہاؤ کی رکاوٹ کم کرنے کا
    پہلا ضمنی تصور {cite:wikipedia-saqiyah-en} {cite:needham-scc-v4p2-1965}
    {cite:hill-engineering-ehas-1998}۔
  es: "El desarrollo por parte de los ingenieros islámicos de la saqiya —la rueda de cadena de vasijas impulsada por animales y engranada a través de ruedas horizontales y verticales que eleva el agua de diez a veinte metros; en al-Jazari (1206) una máquina compuesta donde un buey en el techo de un depósito superior impulsa la saqiya mientras el agua cae sobre las paletas de una rueda en un depósito inferior, además de la primera manivela conocida en una saqiya y la primera minimización implícita de la intermitencia {cite:wikipedia-saqiyah-en} {cite:needham-scc-v4p2-1965} {cite:hill-engineering-ehas-1998}."
  fr: "Le développement par les ingénieurs islamiques de la saqiya — la roue à chaîne de pots entraînée par des animaux et chaussée de roues horizontales et verticales qui élève l'eau de dix à vingt mètres; dans al-Jazari (1206), une machine composite où un bœuf sur le toit d'un réservoir supérieur actionne la saqiya tandis que l'eau tombe sur les palettes d'une roue dans un réservoir inférieur, plus la première manivelle connue dans une saqiya et la première minimisation implicite de l'intermittence {cite:wikipedia-saqiyah-en} {cite:needham-scc-v4p2-1965} {cite:hill-engineering-ehas-1998}."
