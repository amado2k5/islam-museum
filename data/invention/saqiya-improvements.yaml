origin:
  polity: polity/mamluk-sultanate
  place: place/amid
  context:
    ar: 'بلاط آرتوق ديار بكر حيث خدم الجزري مهندساً للدولة؛ والساقية
      نفسها عريقة — شاهد لوحة قبرية بطلمية القرن الثاني ق.م — لكن مهندسي
      الإسلام جعلوها عائلة آلات: حيوانية ومائية ومركبة ومستمرة
      {cite:wikipedia-saqiyah-en} {cite:jazari-hill-1974}.'
    en: 'The Artuqid court of Diyarbakir, where al-Jazari served as a
      state engineer; the saqiya itself is ancient — a Ptolemaic
      second-century-BC tomb painting shows it — but Islamic engineers
      turned it into a family of machines: animal-driven,
      water-driven, composite and continuous {cite:wikipedia-saqiyah-en}
      {cite:jazari-hill-1974}.'
    ur: 'آرتوقی دیار بکر کی دربار جہاں الجزری سلطنتی انجینئر تھا؛ ساقیہ
      خود بہت قدیم ہے — بطلمیسی دوسری صدی ق م کی قبر نقش میں دکھائی
      دیتی — مگر مسلمان انجینیئروں نے اسے مشینوں کا خاندان بنایا:
      حیوانی، آبی، مرکب اور مسلسل {cite:wikipedia-saqiyah-en}
      {cite:jazari-hill-1974}۔'
makers:
- person: person/al-jazari-engineer
  role: improver
  place: place/amid
  note: 'Designer of the composite ox-plus-water-wheel saqiya and of
    the machine carrying the first known crank applied to a saqiya;
    Hill credits his devices with the earliest implied minimising of
    intermittence. The saqiya type predates him by more than a
    millennium — he improves, he does not invent.'
  sources:
  - source/wikipedia-saqiyah-en
  - source/needham-scc-v4p2-1965
  - source/hill-engineering-ehas-1998
- person: person/taqi-al-din-ibn-maruf
  role: describer
  place: place/cairo
  note: 'His al-Turuq al-saniyya (1551) describes four water-raising
    machines, the first two animal-driven — the Ottoman continuation
    of the same saqiya engineering line.'
  sources:
  - source/wikipedia-taqi-al-din-en
  - source/taqi-turuq-hasan-1976
attribution:
  status: improvement
  claim:
    ar: 'الساقية نفسها أقدم من الإسلام — بطلمية أو هندية أو كوشية في
      الأصل المحتمل — والإسهام الإسلامي تحويلها سلسلة آلات محسنة:
      تروس ومزج قوى وذُقن واستمرارية جريان عند الجزري وتقي الدين
      {cite:wikipedia-saqiyah-en} {cite:hill-engineering-ehas-1998}.'
    en: 'The saqiya itself is pre-Islamic — Ptolemaic, Indian or
      Kushite in its possible origins — and the Islamic contribution
      is its engineering into an improved machine family: gearing,
      power-combining, the crank and flow continuity in al-Jazari and
      Taqi al-Din {cite:wikipedia-saqiyah-en}
      {cite:hill-engineering-ehas-1998}.'
    ur: 'ساقیہ خود اسلام سے پہلے کی ہے — بطلمیسی، ہندوستانی یا کوشی ممکنہ
      اصل — اور اسلامی شراکت اسے بہتر مشین خاندان میں ڈھالنا ہے: گیارنگ،
      قوتوں کا امتزاج، کرنک اور بہاؤ کا تسلسل الجزری اور تقی الدین کے
      ہاں {cite:wikipedia-saqiyah-en} {cite:hill-engineering-ehas-1998}۔'
  basis:
    ar: 'اللوحة البطلمية القبرية ⁦(القرن الثاني ق.م)⁩ تظهر الجهاز مكتملاً
      حد التطابق مع النماذج المصرية الحديثة؛ ونيدهم يصف آلة الجزري
      المركبة ببقر السطح وشفرات الدولاب ⁦(ص353)⁩؛ وهيل ينسب إليه أول
      ذُقن في ساقية وتقليل التقطع الضمني ⁦(ص776)⁩
      {cite:wikipedia-saqiyah-en} {cite:needham-scc-v4p2-1965}
      {cite:hill-engineering-ehas-1998}.'
    en: 'The Ptolemaic tomb painting ⁦(second century BC)⁩ shows the
      device already developed "to the point that modern Egyptian
      devices are virtually identical"; Needham describes al-Jazari''s
      composite ox-roof and scoop-wheel machine ⁦(p. 353)⁩; Hill credits
      him with the first saqiya crank and implied intermittence
      reduction ⁦(p. 776)⁩ {cite:wikipedia-saqiyah-en}
      {cite:needham-scc-v4p2-1965} {cite:hill-engineering-ehas-1998}.'
    ur: 'بطلمیسی قبر نقش ⁦(دوسری صدی ق م)⁩ آلہ اتنا پکا دکھاتا کہ جدید
      مصری آلات اس سے عملاً ایک جیسے ہیں؛ نیڈہم الجزری کی مرکب
      بیل-چھت اور پیمانہ پہیہ مشین بیان کرتا ہے ⁦(ص353)⁩؛ ہل اسے پہلی
      ساقیہ کرنک اور ضمنی رکاوٹ کمی کا سہرا دیتا ہے ⁦(ص776)⁩
      {cite:wikipedia-saqiyah-en} {cite:needham-scc-v4p2-1965}
      {cite:hill-engineering-ehas-1998}۔'
