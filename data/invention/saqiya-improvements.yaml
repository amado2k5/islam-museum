today:
  form:
    ar: 'تحل المضخات الكهربائية محلها تدريجاً، لكنها تعمل بعد في مصر
      والهند وإسبانيا — مئات الآلاف من عجلاتها تؤرخ في سجلات الريّ
      {cite:wikipedia-saqiyah-en}.'
    en: 'Electric pumps are replacing it, but it still turns in Egypt,
      India and Spain — the hundreds of thousands of its wheels are
      counted in irrigation surveys {cite:wikipedia-saqiyah-en}.'
    ur: 'برقی پمپ اس کی جگہ لے رہے ہیں مگر یہ اب بھی مصر، ہند اور
      ہسپانیہ میں چلتی ہے — اس کے لاکھوں پہیے آبپاشی سرووں میں گنے جاتے
      ہیں {cite:wikipedia-saqiyah-en}۔'
  descendants:
    ar: 'المضخات الآلية وسلاسل الدلاء الصناعية تكمل وظيفتها بلا حيوان
      {cite:wikipedia-saqiyah-en}.'
    en: 'Motor pumps and industrial bucket chains carry its function
      on without the animal {cite:wikipedia-saqiyah-en}.'
    ur: 'موٹر پمپ اور صنعتی زنجیرِ مٹکے اس کا کام بغیر حیوان آگے بڑھاتے
      ہیں {cite:wikipedia-saqiyah-en}۔'
