impact:
  fields:
  - water-agriculture
  changed:
    ar: 'جعلت رفع الماء صنعة مؤتمتة: من ثلاثة أمتار الشادوف إلى عشرة أو
      عشرين بالساقية المسنّنة، ففتحت الريّ والمدن والحمّامات على عمق
      جديد {cite:wikipedia-saqiyah-en}.'
    en: 'It made water-lifting a geared craft: from the shaduf''s three
      metres to the saqiya''s ten or twenty, opening irrigation,
      cities and bathhouses to a new depth {cite:wikipedia-saqiyah-en}.'
    ur: 'پانی اٹھانے کو گیار شدہ دستکاری بنا دیا: شادوف کے تین میٹر سے
      ساقیہ کے دس یا بیس میٹر تک، جس سے آبپاشی، شہروں اور حماموں کو
      نئی گہرائی ملی {cite:wikipedia-saqiyah-en}۔'
  history:
    ar: 'من آلات الجزري إلى سواقي دمشق منذ القرن الثالث عشر وإلى حقول
      الأندلس والهند حملت التقنية اسمها حرفياً: ساقية وacequia —
      البقاء اللغوي لقرون الريّ الإسلامي {cite:wikipedia-saqiyah-en}.'
    en: 'From al-Jazari''s machines to the saqiyas of Damascus since
      the thirteenth century and the fields of al-Andalus and India,
      the technology carried its own name: saqiya into acequia — the
      linguistic survival of centuries of Islamic irrigation
      {cite:wikipedia-saqiyah-en}.'
    ur: 'الجزری کی مشینوں سے تیرہویں صدی کے دمشق کی ساقیوں اور اندلس و
      ہند کے کھیتوں تک، یہ تکنیک اپنا نام بھی ساتھ لائی: ساقیہ سے
      acequia — صدیوں اسلامی آبپاشی کی زبانی بقا
      {cite:wikipedia-saqiyah-en}۔'
  significance: 4
  why: 'The workhorse of Islamic agriculture — hundreds of thousands
    of wheels across two seas — and the clearest case of engineers
    perfecting an inherited machine into a machine family.'
