  changed:
    ar: 'حوّل إيصال الدواء إلى الدماغ من إبر متكررة مؤلمة في الظهر إلى نقرة واحدة
      على فروة الرأس: علاج كيميائي وغسيل سائل شوكي بلا أذى يومي، ومعيار قائم في الأورام
      والدم منذ ستين سنة {cite:wikipedia-ommaya-reservoir-en}.'
    en: 'It turned drug delivery to the brain from repeated painful needles in the
      back into a single touch on the scalp: chemotherapy and CSF sampling without
      daily trauma, a standard of neurosurgery and oncology for sixty years {cite:wikipedia-ommaya-reservoir-en}.'
    ur: 'اس نے دماغ تک دوا پہنچانے کو کمر میں بار بار دردناک سوئیوں سے سر کی کھال
      کی ایک چھیڑ میں بدل دیا: روز کے صدمے کے بغیر کیموتھراپی اور CSF نمونہ — ساٹھ
      برس سے نیورو سرجری اور سرطان شناسی کا معیار {cite:wikipedia-ommaya-reservoir-en}۔'
  history:
    ar: 'أسس فكرة المنفذ المزروع في الطب كلها: منذ 1963 صار الوصول المتكرر إلى سائل
      الجسم عبر منفذ سيليكوني ذاتي الإحكام أسلوباً عاماً، وتحمل الآلة اسم صانعها إلى
      اليوم {cite:wikipedia-ayub-khan-ommaya-en}.'
    en: 'It founded the implanted-port idea across medicine: since 1963, repeated
      access to body fluids through a self-sealing silicone port has been a general
      method, and the device still carries its maker''s name {cite:wikipedia-ayub-khan-ommaya-en}.'
    ur: 'اس نے پورے طب میں کاشت شدہ پورٹ کا تصور قائم کیا: 1963 سے خود بند سلیکون
      پورٹ کے ذریعے جسمانی سیال تک بار بار رسائی ایک عام طریقہ ہے، اور آلہ آج بھی
      اپنے موجد کا نام رکھتا ہے {cite:wikipedia-ayub-khan-ommaya-en}۔'
  significance: 4
  why: A named, still-standard neurosurgical device invented by a Pakistani-American
    Muslim surgeon in 1963 — the first subcutaneous CSF port and the ancestor of every
    implanted drug-access port.
