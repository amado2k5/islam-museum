kids:
  ar: 'تخيل طبيباً يحتاج أن يوصل دواءً إلى دماغ مريضه كل أسبوع، وفي كل مرة يضطر لوخز
    ظهره بإبرة كبيرة مؤلمة. فصنع الطبيب أيوب خان أُميّة عام 1963 زراً صغيراً يُزرع
    تحت شعر الرأس: تلمسه يد الطبيب وتضع الدواء فيه، فيسافر الدواء إلى الدماغ مباشرة
    — بلا إبر ولا ألم متكرر.'
  en: 'Imagine a doctor who must send medicine into a patient''s brain every week,
    and each time has to push a big painful needle into the patient''s back. In 1963
    Dr Ayub Khan Ommaya made a little button planted under the hair of the head: the
    doctor touches it, puts the medicine in, and the medicine travels straight to
    the brain — no needles, no repeated pain.'
  ur: 'سوچو ایک ڈاکٹر کو ہر ہفتے اپنے مریض کے دماغ تک دوا پہنچانی ہو اور ہر بار کمر
    میں بڑی دردناک سوئی لگانی پڑے۔ 1963 میں ڈاکٹر ایوب خان امایا نے سر کے بالوں کے
    نیچے ایک چھوٹا بٹن لگوایا: ڈاکٹر اسے چھوتا ہے، دوا ڈالتا ہے، اور دوا سیدھا دماغ
    پہنچتی ہے — نہ سوئیاں، نہ بار بار درد۔'
