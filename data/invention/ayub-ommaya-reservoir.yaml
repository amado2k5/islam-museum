summary:
  ar: 'أول خزان طبي تحت الجلد يتيح حقناً متكررة في السائل الدماغي الشوكي بلا بزلات
    قطنية متعاقبة، اخترعه جراح الأعصاب الباكستاني-الأمريكي أيوب خان أُميّة عام 1963:
    قسطار في أحد البطينين الجانبيين موصول بخزان سيليكوني مزروع تحت فروة الرأس، يُحقن
    الدواء فيه عبر الجلد فيصل إلى الورم داخل القراب؛ وهو أول منفذ طبي من السيليكون
    الخامل ذاتي الإحكام، ويُستخدم في علاج أورام الدماغ وابيضاض الدم وداء السحايا الرقيقة
    وفي تسكين آلام السرطان {cite:wikipedia-ommaya-reservoir-en} {cite:wikipedia-ayub-khan-ommaya-en}.'
  en: 'The first subcutaneous reservoir allowing repeated access to the cerebrospinal
    fluid without repeated lumbar punctures, invented by the Pakistani-American neurosurgeon
    Ayub Khan Ommaya in 1963: a catheter in one lateral ventricle attached to a silicone
    reservoir implanted under the scalp, into which drugs are injected through the
    skin to reach a brain tumor intrathecally; it was the first medical port to use
    self-sealing, biologically inert silicone, and it treats brain tumors, leukemia
    and leptomeningeal disease and delivers morphine in palliative care {cite:wikipedia-ommaya-reservoir-en}
    {cite:wikipedia-ayub-khan-ommaya-en}.'
  ur: 'ریڑھ کے بار بار سوراخ کیے بغیر دماغی نخاعی سیال تک بار بار رسائی دینے والا
    پہلا جلد کے نیچے ذخیرہ، جسے پاکستانی نژاد امریکی نیورو سرجن ایوب خان امایا نے
    1963 میں ایجاد کیا: ایک پہلو کے وینٹرکَل میں نلکی جو سر کی کھال کے نیچے لگے سلیکون
    کے ذخیرے سے جُڑی ہے؛ کھال کے راستے اس میں دوا ڈالی جاتی ہے جو اندرونی طور پر رسولی
    تک پہنچتی ہے۔ یہ خود بند ہونے والی غیر فعال سلیکون کا پہلا طبی پورٹ تھا اور دماغی
    رسولی، لیوکیمیا اور سحائی بیماری کے علاج اور تسکینی نگہداشت میں مورفین دیتا ہے
    {cite:wikipedia-ommaya-reservoir-en} {cite:wikipedia-ayub-khan-ommaya-en}۔'
  es: "El primer reservorio subcutáneo que permite el acceso repetido al líquido cefalorraquídeo sin punciones lumbares repetidas, inventado por el neurocirujano pakistaní-estadounidense Ayub Khan Ommaya en 1963: un catéter en un ventrículo lateral conectado a un reservorio de silicona implantado bajo el cuero cabelludo, en el que se inyectan fármacos a través de la piel para llegar a un tumor cerebral intratecalmente; fue el primer puerto médico en utilizar silicona autosellante y biológicamente inerte, y trata tumores cerebrales, leucemia y enfermedad leptomeníngea y administra morfina en cuidados paliativos {cite:wikipedia-ommaya-reservoir-en} {cite:wikipedia-ayub-khan-ommaya-en}."
