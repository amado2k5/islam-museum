summary:
  ar: اشتقاق البتاني لميلان فلك البروج ⁦(نحو ٢٣°٣٥′)⁩ من قياسات فصول السنة الأربعة عبر الرصد، بعد أن كانت قيم بطلميوس أعلى؛
    موثق في كتب السيرة والمختصرة الفلكية {cite:tdv-battani-muftuoglu biography} {cite:battani-mactutor} {cite:farghani-elements-astronomy
    pp. 112–114}.
  en: Al-Battani's derivation of the obliquity of the ecliptic (about 23°35′) from four-season observations, refining Ptolemy's
    higher value; documented in biography and astronomical summaries {cite:tdv-battani-muftuoglu biography} {cite:battani-mactutor}
    {cite:farghani-elements-astronomy pp. 112–114}.
  ur: بطانی کا فلک البروج کے رجحان ⁦(تقریباً 23°35′)⁩ کی چاروں موسموں کے مشاہدات سے استنباط، بطلميوس کی بلند قیمت کی اصلاح؛
    سیرت و فلکی خلاصوں میں مستند {cite:tdv-battani-muftuoglu biography} {cite:battani-mactutor} {cite:farghani-elements-astronomy
    pp. 112–114}۔
