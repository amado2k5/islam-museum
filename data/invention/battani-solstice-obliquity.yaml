today:
  form:
    ar: الميلان اليوم يُعرف بأنه يتغير بين نحو ٢٢٫١° و٢٤٫٥° بدورة نحو ٤١ ألف سنة؛ قياس البطاني بوحدة درجات ودقائق يبقى شاهداً
      على دقة منهجه.
    en: Today's obliquity is known to vary between about 22.1° and 24.5° over a roughly 41,000-year cycle; al-Battani's degree-and-minute
      figure remains a witness to his method's precision.
    ur: آج رجحان تقریباً 22.1° اور 24.5° کے درمیان تقریباً 41 ہزار سال کے چکر میں بدلتا ہے؛ بطانی کا درجہ و منٹ کا عدد اس
      کے طریقے کی دقت کا گواہ ہے۔
  descendants:
    ar: لم يثبت البحث المقروء خطاً مباشراً من هذا القياس إلى أجهزة اليوم؛ تعود دقة الزوايا الحديثة إلى مصادر أخرى.
    en: The research read establishes no direct line from this measurement to today's instruments; modern angular precision
      traces to other sources.
    ur: پڑھی تحقیق اس پیمائش سے آج کے آلات تک براہ راست نسب ثابت نہیں کرتی؛ جدید زاویوی دقت کے ماخذ مختلف ہیں۔
