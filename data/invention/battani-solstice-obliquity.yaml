attribution:
  status: improvement
  claim:
    ar: لم يُخترع ميلان فلك البروج في الإسلام؛ المساهمة الموثقة تخفيضه وتثبيته بقياس فصولي، من نحو ٢٣°٥١′ بطلميوس إلى ٢٣°٣٥′.
    en: The obliquity was not invented in Islam; the documented contribution is refining and fixing it through seasonal measurement,
      from Ptolemy's about 23°51′ to about 23°35′.
    ur: فلک البروج کا رجحان اسلام میں ایجاد نہیں ہوا؛ مستند حصہ اس کی اونچائی کم کرنا اور موسمی پیمائش سے 23°51′ بطلميوس سے
      23°35′ تک ٹھیک کرنا ہے۔
  basis:
    ar: المدونة تقول إن البطاني حدد انحراف الفلك ٢٣°٣٥′ بطريقة خاصة، وفصل مواسم السنة الأربعة وخرج بنتيجة ٣٦٥ يوماً و٥ ساعات
      و٤٦ دقيقة و٢٤ ثانية في السنة الاستوائية؛ الفرغاني يذكر قيمة المأمون المقيسة ٢٣°٣٥′ فيقارنها ببطلميوس {cite:tdv-battani-muftuoglu
      biography} {cite:farghani-elements-astronomy p. 114}.
    en: The biography says al-Battani fixed the ecliptic's inclination at 23°35′ by his own method and derived the four seasons,
      giving a tropical year of 365d 5h 46m 24s; Farghani records al-Ma'mun's tested 23°35′ against Ptolemy's value, placing
      al-Battani in the same refining line {cite:tdv-battani-muftuoglu biography} {cite:farghani-elements-astronomy p. 114}.
    ur: سیرت کہتی ہے کہ بطانی نے فَلک کا رجحان اپنے طریقے سے 23°35′ طے کیا اور چاروں موسم نکالے، گرمائی سال 365 دن 5 گھنٹے
      46 منٹ 24 سیکنڈ آیا؛ الفرغاني مامون کی رجحان کی پیمائش 23°35′ کو بطلميوس سے موازنہ کرتا ہے {cite:tdv-battani-muftuoglu
      biography} {cite:farghani-elements-astronomy p. 114}۔
