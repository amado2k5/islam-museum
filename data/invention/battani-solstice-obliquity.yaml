kids:
  ar: الشمس لا ترتفع في السماء دائماً بنفس الزاوية؛ في أطول نهار من السنة تميل أكثر، وفي أقصره أقل. قاس البطاني هذا الميل
    فوجد ٢٣°٣٥′، وهو قريب جداً من القيمة التي نعرفها اليوم.
  en: The Sun does not climb to the same height all year; it tilts highest at the longest day and lowest at the shortest.
    Al-Battani measured this tilt and found 23°35′, very close to today's value.
  ur: سورج سارا سال ایک ہی اونچائی پر نہیں چڑھتا؛ سب سے لمبے دن میں سب سے زیادہ اور چھوٹے دن میں کم جھکتا ہے۔ بطانی نے اس
    جھکاؤ کو ناپا اور 23°35′ پایا، آج کی قیمت کے بہت قریب۔
