spread: []
impact:
  fields: [architecture-building, institutions-systems]
  changed:
    ar: "أمنت السفر البري على مسافات قارية — مبيتاً وماءً وعلفاً وسوقاً في مبنى واحد كل عشرين ميلاً — وجعلت التجارة الطويلة والحج البري ممكناً منتظماً {cite:encyclopaedia-of-islam-2}."
    en: "It made continental land travel safe — lodging, water, fodder and a market in one building every twenty miles — and turned long-distance trade and overland pilgrimage into regular systems {cite:encyclopaedia-of-islam-2}."
    ur: "براعظمی زمینی سفر محفوظ بنایا — ہر بیس میل پر ایک عمارت میں رہائش، پانی، چارہ اور بازار — اور دور دراز تجارت اور برِ حج کو منظم نظام بنایا {cite:encyclopaedia-of-islam-2}۔"
  history:
    ar: "أعظم شبكة ضيافة طريق في التاريخ الوسيط؛ كانت الخانات — كما يقول EI2 — «مركزاً لتبادل الأفكار بين أفراد من أنحاء مختلفة من العالم» لا مبيتاً فحسب {cite:encyclopaedia-of-islam-2}."
    en: "The greatest roadside hospitality network of the medieval world; the khans were — in EI2's words — 'a centre for the exchange of ideas among individuals from different parts of the world', not only beds {cite:encyclopaedia-of-islam-2}."
    ur: "قرون وسطی کی عظیم ترین شاہراہ مہمان نوازی کا جال؛ خان — EI2 کے الفاظ میں — «دنیا کے مختلف حصوں سے آئے افراد کے درمیان افکار کے تبادلے کا مرکز» تھے، صرف بستر نہیں {cite:encyclopaedia-of-islam-2}۔"
  significance: 5
  why: "A documented infrastructure system — one fortified lodging every day's march across three continents — that underpinned medieval trade, pilgrimage and the exchange of ideas."
