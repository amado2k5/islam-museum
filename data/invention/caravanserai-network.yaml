origin:
  polity: polity/seljuk-empire
  context:
    ar: "طرق القوافل الكبرى بين آسيا الصغرى و«منطقة البرزخ» ⁦(عبارة موريس لومبار)⁩ حيث ندرت المياه والمؤن وخيف قطاع الطريق؛ ظهر الخان قلعةً صغيرة مربعة بأبراج زاوية تحمي بئراً ومسافريها {cite:encyclopaedia-of-islam-2 vol. IV pp. 1048-1055 KHAN}."
    en: "The great caravan roads between Asia Minor and the 'isthmus region' (Maurice Lombard's phrase), where water and provisions were scarce and bandits threatened; the khan emerged as a small square fortress with corner towers guarding a well and its travellers {cite:encyclopaedia-of-islam-2 vol. IV pp. 1048-1055 KHAN}."
    ur: "ایشیائے صغیر اور «برزخی خطہ» ⁦(موریس لومبار کی اصطلاح)⁩ کے درمیان عظیم کاروانی راستے جہاں پانی اور رasad کم اور راہزن خطرناک تھے؛ خان ایک چھوٹے چوکور قلعے کی شکل میں اُبھرا جس کے کونے کے برج کنوئیں اور مسافروں کی حفاظت کرتے {cite:encyclopaedia-of-islam-2 vol. IV pp. 1048-1055 KHAN}۔"
