kids:
  ar: "كان المسافر قديماً يخاف الطريق الطويل بلا ماء ولا مبيت؛ فبنى المسلمون كل يومِ سفرٍ قلعةً صغيرة فيها غرف ومصلى واسطبل للجمال — اسمها الخان. بهذه القلاع الصغيرة صار السفر بين الصين وإسبانيا آمناً."
  en: "Long ago travellers feared the road where there was no water or shelter; so Muslims built, every day's march, a small fort with rooms, a prayer space and stables for the camels — the khan. Those little forts made travel from China to Spain safe."
  ur: "پرانے زمانے میں مسافر اس راستے سے ڈرتا تھا جہاں نہ پانی ہو نہ ٹھیکانہ؛ پھر مسلمانوں نے ہر دن کے سفر پر ایک چھوٹا قلعہ بنایا جس میں کمرے، عبادت گاہ اور اونٹوں کے اسطبل ہوتے — نام خان۔ انہی چھوٹے قلعوں نے چین سے اسپین تک کا سفر محفوظ کیا۔"
