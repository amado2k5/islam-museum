summary:
  ar: "بنية تحتية معمارية للطريق: خان كل مرحلة ⁦(نحو عشرين ميلاً)⁩ يأوي المسافر والحاج والتاجر ودوابه وبضاعته، بغرف ومصلى وأحياناً حمام واسطبلات؛ ازدهرت الشبكة في العالم الإسلامي وبخاصة من القرن السابع/الثالث عشر في إيران والشام والأناضول — يعدّ إردمان 119 خاناً لتلك المنطقة وحدها في ذلك القرن {cite:encyclopaedia-of-islam-2 vol. IV pp. 1048-1055 KHAN}."
  en: "Built infrastructure for the road: a khan every stage (about twenty miles) sheltering traveller, pilgrim and merchant with their animals and goods — rooms, an oratory, sometimes a bathhouse and stables. The network flourished across the Islamic world, above all from the seventh/thirteenth century in Iran, Syria and Anatolia — Erdmann counts 119 khans for that region in that century alone {cite:encyclopaedia-of-islam-2 vol. IV pp. 1048-1055 KHAN}."
  ur: "شاہراہ کی تعمیر شدہ بنیادی ڈھانچہ: ہر مرحلے ⁦(تقریباً بیس میل)⁩ پر ایک خان جو مسافر، حاجی اور تاجر کو ان کے جانوروں اور مال سمیت پناہ دے — کمرے، عبادت گاہ، کبھی حمام اور اسطبل۔ جال اسلامی دنیا میں وسعت سے کھلا، خاص طور پر ساتویں/تیرہویں صدی سے ایران، شام اور اناطولیہ میں — اردمان اسی صدی میں اسی خطے کے 119 خان شمار کرتا ہے {cite:encyclopaedia-of-islam-2 vol. IV pp. 1048-1055 KHAN}۔"
  es: "Se construyó infraestructura para la ruta: un khan en cada etapa (unos treinta kilómetros) que albergaba a viajeros, peregrinos y comerciantes con sus animales y mercancías: habitaciones, un oratorio, a veces baños y establos. Esta red floreció en todo el mundo islámico, sobre todo a partir del siglo VII/XIII en Irán, Siria y Anatolia. Erdmann contabiliza 119 khans solo en esa región durante ese siglo {cite:encyclopaedia-of-islam-2 vol. IV pp. 1048-1055 KHAN}."
