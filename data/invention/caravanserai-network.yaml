    sources: [source/encyclopaedia-of-islam-2]

attribution:
  status: improvement
  claim:
    ar: "الموثق إسلامياً: توسيع المحطة القديمة إلى شبكة معمارية منتظمة على مسافات مرحلة، بوظائف إيواء وأمن وتبادل فكري؛ فكرة محطة الطريق أقدم من الإسلام ⁦(الإواخانية الأخمينية، منازل بيزنطة)⁩ ولا يُدَّعى اختراعها."
    en: "The Islamic world's documented role: expanding the ancient way-station into a regular architectural network at one-day intervals with lodging, security and exchange functions; the way-station idea is older than Islam (Achaemenid avahana, Byzantine staging posts) and is not claimed as an invention."
    ur: "عالمِ اسلام کا موثق کردار: قدیم مسافر خانے کو ایک منظم معماری جال میں پھیلانا جو روز کے فاصلے پر رہائش، حفاظت اور تبادلہ فراہم کرے؛ مسافر خانے کا خیال اسلام سے پرانا ہے ⁦(ہخامنشی اواخانا، بازنطینی مراحل)⁩ اور ایجاد کا دعویٰ نہیں۔"
  basis:
    ar: "EI2 KHAN: جذور المؤسسة في تجارة الطريق المنظمة القديمة ⁦(ربط هرتسفلد بالنظام الأخميني)⁩ لكنها «ازدهرت بقوة خاصة في العالم الإسلامي»؛ عدد 119 خاناً للقرن السابع/الثالث عشر؛ أول أثر عربي للكلمة على خان العقبة 610/1213 {cite:encyclopaedia-of-islam-2 vol. IV pp. 1048-1055 KHAN}."
    en: "EI2 KHAN: the institution's roots lie in organised ancient highway trade (Herzfeld's link to the Achaemenid relay system) but it 'flourished with particular vigour in the Islamic world'; Erdmann's count of 119 khans for the seventh/thirteenth century; the word's first Arabic epigraphy on Khan al-'Aqaba in 610/1213 {cite:encyclopaedia-of-islam-2 vol. IV pp. 1048-1055 KHAN}."
    ur: "EI2 KHAN: ادارہ کی جڑیں قدیم منظم شاہراہ تجارت میں ہیں ⁦(ہرٹسفیلڈ کا ہخامنشی رابطہ نظام سے ربط)⁩ مگر یہ «اسلامی دنیا میں خاص شدت سے کھلا»؛ ساتویں/تیرہویں صدی کے 119 خانوں کی اردمان گنتی؛ خان العقبہ 610/1213ء پر لفظ کی پہلی عربی کتبہ شہادت {cite:encyclopaedia-of-islam-2 vol. IV pp. 1048-1055 KHAN}۔"
  perspectives:
    - tradition: sunni
      stance: { ar: "عمارة ابن السبيل", en: "Architecture for the wayfarer", ur: "ابن سبیل کے لیے معماری" }
      summary: { ar: "عمارة ابن السبيل — الخان دار ضيافة المسافر والحاج؛ يقرأه التقليد خدمةً وقفية لابن السبيل على طرق التجارة والحج، ومنه نمت قرى حول بعض الخانات ⁦(خان شيخون، جسر الشغور)⁩ {cite:encyclopaedia-of-islam-2}.", en: "The khan is the wayfarer's guest-house; the tradition reads it as waqf service to the traveller on trade and pilgrimage roads, and settlements grew around some of them (Khan Shaykhun, Jisr al-Shughur) {cite:encyclopaedia-of-islam-2}.", ur: "عمارة ابن السبیل — خان مسافر اور حاجی کی مہمان خانہ؛ روایت اسے تجارت اور حج کے راستوں پر ابن سبیل کی وقفیہ خدمت پڑھتی ہے، اور کچھ خانوں کے گرد بستیاں بسیں ⁦(خان شیخون، جسر الشغور)⁩ {cite:encyclopaedia-of-islam-2}۔" }
      sources: [source/encyclopaedia-of-islam-2]
    - tradition: academic
      stance: { ar: "محطة قديمة وشبكة إسلامية", en: "An old station, an Islamic network", ur: "پرانا اسٹیشن، اسلامی جال" }
      summary: { ar: "محطة قديمة وشبكة إسلامية — Herzfeld وEI2 يربطان الأصل بمحطات هيرودوت الخمسين فرسخاً الأخمينية والمحطات البيزنطية؛ الجديد إسلامياً هو الكثافة والنظام المعماري والامتداد القاري {cite:encyclopaedia-of-islam-2}.", en: "Herzfeld and EI2 link the origin to the Achaemenid posts Herodotus places fifty parasangs apart and to Byzantine stations; what is new in the Islamic world is the density, the architectural standard and the continental extent {cite:encyclopaedia-of-islam-2}.", ur: "پرانا اسٹیشن اور اسلامی جال — ہرٹسفیلڈ اور EI2 جڑ کو ہخامنشی چوکوں ⁦(جو ہیروڈوٹس کے مطابق پچاس فرسخ کے فاصلے پر تھیں)⁩ اور بازنطینی اسٹیشنوں سے جوڑتے ہیں؛ اسلامی دنیا میں نئی بات کثافت، معماری معیار اور براعظمی وسعت ہے {cite:encyclopaedia-of-islam-2}۔" }
      sources: [source/encyclopaedia-of-islam-2]
