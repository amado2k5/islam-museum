today:
  form:
    ar: "بقيت مئات الخانات أثراً وسوقاً ومعلماً — من رباط شرف في سرخس إلى خان الخليلي بالقاهرة — ووظيفتها الطريقية ورثها الفندق ومحطات الطريق الحديثة {cite:encyclopaedia-of-islam-2}."
    en: "Hundreds of khans survive as monuments, souks and landmarks — from the Sharaf caravanserai at Sarakhs to Cairo's Khan al-Khalili — while hotels and motorway services inherit the roadside function {cite:encyclopaedia-of-islam-2}."
    ur: "سینکڑوں خان یادگار، بازار اور نشانی کے طور پر باقی ہیں — سرخس کے رباط شرف سے قاہرہ کے خان الخلیلی تک — جبکہ ان کی شاہراہی خدمت ہوٹلوں اور موٹر وے اسٹیشنوں نے سنبھال لی {cite:encyclopaedia-of-islam-2}۔"
  descendants:
    ar: "الفندق وموتيل الطريق ومحطة الخدمة؛ وفي المدن تحوّل خان الجمل إلى خان التجار المسقوف {cite:encyclopaedia-of-islam-2}."
    en: "The hotel, the roadside motel and the service station; inside the cities the camel-khan became the covered merchants' khan {cite:encyclopaedia-of-islam-2}."
    ur: "ہوٹل، سڑک کنارہ موٹیل اور سروس اسٹیشن؛ شہروں میں اونٹ خان چھت والے تاجر خان بن گیا {cite:encyclopaedia-of-islam-2}۔"
