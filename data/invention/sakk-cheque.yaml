summary:
  ar: "وثيقة مكتوبة تلزم الدفع: يصف الخوارزمي الكاتب في «مفاتيح العلوم» الصكَ يجمع أسماء المستحقين وعددهم وما يستحقونه ويوقّع الخليفة أو السلطان أو الأمير بإجازة صرف أرزاقهم {cite:khwarizmi-mafatih-ulum-1930 diwan chapter}. ووثّق ناصر خسرو في البصرة مطلع القرن الحادي عشر صكاً يأمر به التاجر مصرفه بالدفع من حسابه في مدينة أخرى {cite:quinn-roberds-check-2008 pp. 9–10}. نقل الأداة، لا اختراع الائتمان نفسه."
  en: "A written instrument ordering payment: al-Khwarizmi's Mafatih al-Ulum describes the sakk gathering the names, numbers and dues of stipendiaries, signed at its foot by the caliph, sultan or amir authorising payment {cite:khwarizmi-mafatih-ulum-1930 diwan chapter}. Nasir-i Khusraw documented at Basra in the early eleventh century a merchant's written instruction ordering his bank to pay from his account in another city {cite:quinn-roberds-check-2008 pp. 9–10}. A transmitted instrument, not the invention of credit itself."
  ur: "ادائیگی کا تحریری حکم: خوارزمی کاتب کی «مفاتیح العلوم» صک کی وضاحت کرتی ہے کہ وہ مستحقین کے نام، تعداد اور وظیفے جمع کرتا اور خلافت یا سلطنت یا امارت کے دستخط آخر میں اجازت دیتے {cite:khwarizmi-mafatih-ulum-1930 diwan chapter}۔ ناصر خسرو نے گیارہویں صدی کے آغاز میں بصرہ میں ایک تاجر کی تحریری ہدایت دیکھی جس سے اس کا بینک دوسرے شہر میں اس کے کھاتے سے ادا کرتا {cite:quinn-roberds-check-2008 pp. 9–10}۔ منتقلی یافتہ آلہ، خود سود یا قرض کی ایجاد نہیں۔"
  es: "Un instrumento escrito que ordena el pago: el Mafatih al-Ulum de al-Juarismi describe el sakk que recoge los nombres, números y cuotas de los estipendiarios, firmado al pie por el califa, sultán o emir autorizando el pago {cite:khwarizmi-mafatih-ulum-1930 diwan chapter}. Nasir-i Khusraw documentó en Basora a principios del siglo XI una instrucción escrita de un comerciante que ordenaba a su banco pagar desde su cuenta en otra ciudad {cite:quinn-roberds-check-2008 pp. 9–10}. Un instrumento transmitido, no la invención del crédito en sí."
