origin:
  place: place/baghdad
  polity: polity/abbasid-caliphate
  context:
    ar: "دولة تمتد أقاليمها بجباية تُحمَل عبر مسافات خطرة؛ كانت مأموريات الدفع تسمى سفتجة أو صكاً، ونقل عُمّال الأهواز وفارس وأصبهان الإيرادات بها، وقام الجهبذ بالصرف {cite:encyclopaedia-of-islam-2 vol. III pp. 303–304 HAWALA}."
    en: "A state whose provinces remitted revenue over dangerous distances: payment mandates called suftadja or sakk carried the tax of Ahwaz, Fars and Isfahan, with the jahbadh banker doing the encashment {cite:encyclopaedia-of-islam-2 vol. III pp. 303–304 HAWALA}."
    ur: "ایک ریاست جس کے صوبے خطرناک فاصلے پر محصول بھیجتے تھے؛ ادائیگی کے حکم نامے سفتجہ یا صک کہلاتے، اہواز، فارس اور اصفہان کے عامل ان سے وصولیاں بھیجتے اور جہبذ انکاشمنٹ کرتا {cite:encyclopaedia-of-islam-2 vol. III pp. 303–304 HAWALA}۔"
makers:
  - person: person/muhammad-ibn-ahmad-al-khwarizmi
    role: describer
    place: place/baghdad
    note: "Documented the instrument in Mafatih al-Ulum's diwan vocabulary; the practice itself was created by unnamed Abbasid financial administrators and jahbadh bankers."
    sources: [source/khwarizmi-mafatih-ulum-1930]
attribution:
  status: transmission
  claim:
    ar: "أداة دفع مكتوبة متداولة في دواوين وتجارة العالم الإسلامي، يُعد سلفاً وظيفياً للشيك الأوروبي؛ إثبات سلسلة نقل مباشرة موثقة من بغداد إلى المصارف الأوروبية خارج هذا السجل."
    en: "A circulating written payment instrument of Islamic chanceries and commerce, a functional ancestor of the European cheque; a documented direct transmission chain from Baghdad to European banking is outside what this record can prove."
    ur: "اسلامی دواوین اور تجارت کا تحریری ادائیگی آلہ، یورپی چیک کا فنی سلف؛ بغداد سے یورپی بینکاری تک ثابت براہ راست انتقال اس ریکارڈ کی تصدیق سے باہر ہے۔"
  basis:
    ar: "يسجّل مسح البنك الاحتياطي وصف ناصر خسرو للصك في البصرة ويطابقه على شيك اليوم؛ ويلفت إلى أن آشتر ⁦(1972)⁩ اشتق check من صك بينما تعطي معاجم أكسفورد أصلاً آخر لها {cite:quinn-roberds-check-2008 pp. 9, 11 n.1}."
    en: "The Federal Reserve survey records Nasir-i Khusraw's Basra description of the sakk and maps it onto today's check; it notes Ashtor ⁦(1972)⁩ derived 'check' from sakk while the Oxford etymologies give the word a different origin {cite:quinn-roberds-check-2008 pp. 9, 11 n.1}."
    ur: "فیڈرل ریزرو جائزہ ناصر خسرو کا بصرہ میں صک کا بیان ریکارڈ کرتا اور آج کے چیک سے ملاتا ہے؛ یہ بھی بتاتا ہے کہ آشٹر ⁦(1972)⁩ نے check کو صک سے اخذ کیا مگر آکسفورڈ اشتقاقات دوسرا ماخذ دیتے ہیں {cite:quinn-roberds-check-2008 pp. 9, 11 n.1}۔"
  perspectives:
    - tradition: sunni
      id: fiqh-on-payment-instruments
      standing: main
      summary:
        ar: "اختلف الفقهاء في السفتجة: كرهها الحنفية والشافعية لأن فيها عائداً مقابل تحمل الخطر، وأجازها المالكية للضرورة، وشرطها الحنابلة بلا كسب، وأطلق ابن تيمية وابن قدامة الإذن لنفع الطرفين {cite:encyclopaedia-of-islam-2 vol. IX pp. 794–795 SUFTADJA}."
        en: "The schools disagreed on the suftadja: Hanafis and Shafi'is found it reprehensible as it rewards risk-avoidance, Malikis allowed it on necessity, Hanbalis conditioned it on no gain, and Ibn Taymiyya and Ibn Qudama permitted it outright since both parties benefit {cite:encyclopaedia-of-islam-2 vol. IX pp. 794–795 SUFTADJA}."
        ur: "مذاہب سفتجہ میں مختلف رہے: حنفی و شافعی اسے ناپسند سمجھتے کہ خطرے سے بچاؤ پر نفع ملتا، مالکی ضرورت پر اجازت دیتے، حنابلی بغیر کسب کی شرط رکھتے، اور ابن تیمیہ و ابن قدامہ دونوں فریقوں کے نفع پر کھلی اجازت دیتے {cite:encyclopaedia-of-islam-2 vol. IX pp. 794–795 SUFTADJA}۔"
      sources: [source/encyclopaedia-of-islam-2]
    - tradition: academic
      id: contested-etymology
      standing: main
      summary:
        ar: "يقدّم آشتر ⁦(1972)⁩ اشتقاق كلمة check من الصك العربي، لكن معاجم أكسفورد ترجعها إلى check 'التدقيق' وليس إلى الصك؛ السجل يثبت الوظيفة المتشابهة ولا يحسم اللفظ {cite:quinn-roberds-check-2008 p. 11 n.1}."
        en: "Ashtor ⁦(1972)⁩ proposed 'check' from the Arabic sakk, but the Oxford etymologies trace the word to 'check' in the sense of verification, not to sakk; the record proves functional resemblance and leaves the word's lineage open {cite:quinn-roberds-check-2008 p. 11 n.1}."
        ur: "آشٹر ⁦(1972)⁩ نے check کو عربی صک سے نکالا، مگر آکسفورڈ اشتقاقات اسے 'جانچ' کے check سے جوڑتے ہیں، صک سے نہیں؛ ریکارڈ فنی مماثلت ثابت کرتا ہے، لفظ کی نسبت کھلی چھوڑتا ہے {cite:quinn-roberds-check-2008 p. 11 n.1}۔"
      sources: [source/quinn-roberds-check-2008]
