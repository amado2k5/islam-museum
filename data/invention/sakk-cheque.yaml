today:
  form:
    ar: "الشيك الورقي يتقهقر أمام المدفوعات الإلكترونية؛ الترتيب نفسه يحيا في التحويل البنكي والصكوك والحوالة {cite:quinn-roberds-check-2008 pp. 12–14}."
    en: "The paper cheque is retreating before electronic payments; the same arrangement lives on in bank transfers, money orders and hawala {cite:quinn-roberds-check-2008 pp. 12–14}."
    ur: "کاغذی چیک برقی ادائیگیوں کے آگے پیچھے ہٹ رہا؛ وہی انتظام بینک ٹرانسفر، منی آرڈر اور حوالے میں جاری {cite:quinn-roberds-check-2008 pp. 12–14}۔"
  descendants:
    ar: "نظم الدفع غير النقدي الحديثة؛ القرب الوظيفي موثّق لا سلسلة انتقال مباشرة مثبتة من بغداد {cite:quinn-roberds-check-2008 pp. 9–11}."
    en: "Modern non-cash payment systems; the functional closeness is documented, not a proven direct transmission line from Baghdad {cite:quinn-roberds-check-2008 pp. 9–11}."
    ur: "جدید غیر نقد ادائیگی نظام؛ فنی قرب موثق ہے، بغداد سے ثابت براہ راست سلسلہ نہیں {cite:quinn-roberds-check-2008 pp. 9–11}۔"
