kids:
  ar: "كان التاجر قديماً يحمل معه دراهم كثيرة في السفر، وكان الطريق خطراً. فصار يكتب صكاً يقول: ادفعوا لصاحب هذا الورق من حسابي في المدينة الأخرى. هكذا سافرت الورقة بدل النقود. هذا الصك يشبه الشيك الذي نعرفه، والعلماء مختلفون هل اسم «check» الإنجليزي جاء من كلمة «صك» أم من غيرها."
  en: "A merchant long ago had to carry many coins on a dangerous road. So he wrote a sakk saying: pay whoever brings this paper from my account in the other city. The paper travelled instead of the money. This sakk works like the cheque we know, and scholars disagree whether the English word 'check' really comes from 'sakk'."
  ur: "پرانے زمانے میں تاجر کو سفر میں بہت سے سکے لے جانے پڑتے اور راستہ خطرناک ہوتا۔ تو وہ صک لکھتا: اس کاغذ لانے والے کو دوسرے شہر میں میرے کھاتے سے ادا کرو۔ اس طرح پیسے کے بجائے کاغذ سفر کرتا۔ یہ صک ہمارے چیک جیسا کام کرتا ہے، اور ماہرین اس پر مختلف ہیں کہ انگریزی 'check' واقعی 'صک' سے آیا یا کہیں اور سے۔"
