impact:
  fields: [institutions-systems, everyday-life]
  changed:
    ar: "حرّر المالَ من مرافقة صاحبه على الطريق: كان الدفع يُنقل بالورقة بدل صررة الدراهم، وصارت الأموال متاحة في أرض أخرى بخطاب ائتمان {cite:encyclopaedia-of-islam-2 vol. IX pp. 794–795 SUFTADJA} {cite:encyclopaedia-of-islam-2 vol. III pp. 303–304 HAWALA}."
    en: "It freed money from travelling with its owner: payment moved by the document instead of the purse of dirhams, and funds became available in another land through what was in effect a letter of credit {cite:encyclopaedia-of-islam-2 vol. IX pp. 794–795 SUFTADJA} {cite:encyclopaedia-of-islam-2 vol. III pp. 303–304 HAWALA}."
    ur: "مال کو مالک کے ساتھ سفر سے آزاد کیا: ادائیگی درہم کی تھیلی کے بجائے دستاویز سے منتقل ہوئی اور دوسرے ملک میں رقم خطابِ اعتبار کے ذریعے دستیاب {cite:encyclopaedia-of-islam-2 vol. IX pp. 794–795 SUFTADJA} {cite:encyclopaedia-of-islam-2 vol. III pp. 303–304 HAWALA}۔"
  history:
    ar: "أظهر كيف تبني المؤسسات المالية جسوراً بين خزائن الأقاليم وتجار المدن؛ التشابه مع الشيك اللاحق موثق، والأصل اللفظي محل خلاف {cite:quinn-roberds-check-2008 pp. 9–11}."
    en: "It shows how financial institutions bridged provincial treasuries and city merchants; the functional resemblance to the later cheque is documented while the word's descent remains disputed {cite:quinn-roberds-check-2008 pp. 9–11}."
    ur: "یہ دکھاتا ہے کہ مالی ادارے صوبائی خزانوں اور شہری تاجروں کے درمیان پل بناتے ہیں؛ بعد کے چیک سے فنی مماثلت موثق، لفظی نسب متنازع {cite:quinn-roberds-check-2008 pp. 9–11}۔"
  significance: 3
  why: "A documented Abbasid written payment order whose functional form foreshadows the cheque; the record keeps the instrument, its operators and its contested word-history distinct."
