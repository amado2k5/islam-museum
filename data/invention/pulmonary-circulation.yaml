today:
  form:
    ar: "مرور الدم كله من الجانب الأيمن للقلب عبر الرئتين إلى الجانب الأيسر، ووجود شعيرات تصل الشريان الرئوي بالوريد الرئوي، صارا من حقائق الفيزيولوجيا الأساسية بعد أن رأى مالبيغي الشعيرات الرئوية {cite:west-2008-ibn-al-nafis pp. 1877–1880, §Pulmonary circulation}."
    en: "The passage of all the blood from the right side of the heart through the lungs to the left side, and the capillaries joining the pulmonary artery to the pulmonary vein, became basic facts of physiology once Malpighi had seen the pulmonary capillaries {cite:west-2008-ibn-al-nafis pp. 1877–1880, §Pulmonary circulation}."
    ur: "سارے خون کا دل کے دائیں حصے سے پھیپھڑوں کے راستے بائیں حصے تک جانا، اور پھیپھڑوی شریان کو پھیپھڑوی ورید سے ملانے والی شعریاں، مالپیگی کے پھیپھڑوی شعریاں دیکھ لینے کے بعد فعلیات کی بنیادی حقیقتیں بن گئیں {cite:west-2008-ibn-al-nafis pp. 1877–1880, §Pulmonary circulation}۔"
  descendants:
    ar: "يكتب عنه اليوم مؤرخو علم وظائف الأعضاء وعلماؤه، ومنهم صاحب المصدر نفسه وهو عالم في فيزيولوجيا التنفس، بوصفه من أعلام هذا العلم في العصر الذهبي الإسلامي {cite:west-2008-ibn-al-nafis pp. 1877–1880}."
    en: "Historians of physiology and physiologists write about him today, including the source's own author, a respiratory physiologist, as one of the figures of the field in the Islamic Golden Age {cite:west-2008-ibn-al-nafis pp. 1877–1880}."
    ur: "آج فعلیات کے مؤرخین اور ماہرین، جن میں خود ماخذ کے مصنف بھی شامل ہیں جو تنفسی فعلیات کے ماہر ہیں، انہیں اسلامی سنہری دور میں اس علم کی نمایاں شخصیات میں شمار کرتے ہیں {cite:west-2008-ibn-al-nafis pp. 1877–1880}۔"
