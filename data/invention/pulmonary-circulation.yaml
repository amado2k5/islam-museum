names:
  - { value: "الدورة الدموية الصغرى", kind: alternate, lang: ar }
  - { value: "Pulmonary transit of the blood", kind: alternate, lang: en }
summary:
  ar: "كتب الطبيب ابن النفيس في القرن السابع الهجري، في شرحه على تشريح قانون ابن سينا، أن الدم لا يعبر من البطين الأيمن إلى البطين الأيسر من مسامّ في الحاجز بينهما كما قال جالينوس، لأن الحاجز هناك مصمت؛ بل يدخل البطين الأيسر من الرئة. وهو أول وصف معروف لمرور الدم كله عبر الرئتين، قبل أن يكتب عنه سرفيتوس في أوروبا بنحو ثلاثة قرون {cite:west-2008-ibn-al-nafis pp. 1877–1880}."
  en: "In the thirteenth century the physician Ibn al-Nafis wrote, in his commentary on the anatomy of Ibn Sina's Canon, that blood does not cross from the right ventricle of the heart to the left through pores in the wall between them, as Galen had taught, because that wall is solid; it reaches the left ventricle from the lung. It is the first known account of all the blood passing through the lungs, about three centuries before Servetus wrote of it in Europe {cite:west-2008-ibn-al-nafis pp. 1877–1880}."
  ur: "طبیب ابن النفیس نے تیرھویں صدی عیسوی میں ابن سینا کی قانون کے تشریحی حصوں کی شرح میں لکھا کہ خون دل کے دائیں بطین سے بائیں بطین تک ان کی درمیانی دیوار کے مساموں سے نہیں گزرتا، جیسا کہ جالینوس کہتا تھا، کیونکہ وہاں دیوار ٹھوس ہے؛ بلکہ وہ پھیپھڑے سے بائیں بطین میں آتا ہے۔ یہ سارے خون کے پھیپھڑوں سے گزرنے کا پہلا معلوم بیان ہے، جو یورپ میں سرویتوس کی تحریر سے تقریباً تین صدیاں پہلے کا ہے {cite:west-2008-ibn-al-nafis pp. 1877–1880}۔"
