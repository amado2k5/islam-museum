kids:
  ar: "قبل نحو ثمانمئة سنة، كان الأطباء يظنون أن الدم يمر في القلب من جهة إلى جهة عبر ثقوب صغيرة لا تُرى. فقال الطبيب ابن النفيس: لا ثقوب هنا، فالجدار مصمت! الدم يذهب أولاً إلى الرئة، ثم يرجع إلى القلب. وهذا ما نعرفه اليوم {cite:west-2008-ibn-al-nafis pp. 1877–1880}."
  en: "About eight hundred years ago, doctors thought blood crossed the heart from one side to the other through tiny holes no one could see. The physician Ibn al-Nafis said: there are no holes, the wall is solid! The blood goes to the lung first, then comes back to the heart. That is what we know today {cite:west-2008-ibn-al-nafis pp. 1877–1880}."
  ur: "تقریباً آٹھ سو سال پہلے طبیب سمجھتے تھے کہ خون دل میں ایک طرف سے دوسری طرف ننھے سوراخوں سے گزرتا ہے جو دکھائی نہیں دیتے۔ طبیب ابن النفیس نے کہا: یہاں کوئی سوراخ نہیں، دیوار ٹھوس ہے! خون پہلے پھیپھڑے میں جاتا ہے، پھر دل میں واپس آتا ہے۔ آج ہم یہی جانتے ہیں {cite:west-2008-ibn-al-nafis pp. 1877–1880}۔"
