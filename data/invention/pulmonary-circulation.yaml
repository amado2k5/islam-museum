origin:
  place: place/cairo
  context:
    ar: "تعلّم ابن النفيس الطب في دمشق في البيمارستان النوري، وانتقل إلى القاهرة في الثالثة والعشرين، فعمل في البيمارستان الناصري ثم في البيمارستان المنصوري حيث صار رئيس الأطباء، وفيها كتب الشرح {cite:west-2008-ibn-al-nafis pp. 1877–1880, §Ibn al-Nafis}."
    en: "Ibn al-Nafis trained in medicine at the Nuri hospital in Damascus, moved to Cairo at the age of 23, and worked at the Nasiri hospital and then the Mansuri hospital, where he became chief physician; he wrote the commentary there {cite:west-2008-ibn-al-nafis pp. 1877–1880, §Ibn al-Nafis}."
    ur: "ابن النفیس نے دمشق کے نوری شفاخانے میں طب پڑھی، تیئیس برس کی عمر میں قاہرہ منتقل ہوئے، اور ناصری شفاخانے میں اور پھر منصوری شفاخانے میں کام کیا جہاں وہ رئیس الاطباء بنے؛ یہ شرح انہوں نے وہیں لکھی {cite:west-2008-ibn-al-nafis pp. 1877–1880, §Ibn al-Nafis}۔"
makers:
  - person: person/ibn-al-nafis
    role: inventor
    place: place/cairo
    note: "Rejected Galen's septal pores, stated that the blood enters the left ventricle from the lung, and predicted passages between the pulmonary artery and the pulmonary vein."
    sources: [source/west-2008-ibn-al-nafis]
attribution:
  status: original
  claim:
    ar: "ابن النفيس أول من نفى صراحة مسامّ الحاجز بين البطينين التي قال بها جالينوس، وأول من قال إن الدم كله يصل إلى البطين الأيسر من الرئة."
    en: "Ibn al-Nafis was the first to reject outright the pores in the wall between the ventricles that Galen had proposed, and the first to state that all the blood reaches the left ventricle from the lung."
    ur: "ابن النفیس پہلے شخص تھے جنہوں نے دونوں بطینوں کی درمیانی دیوار کے ان مساموں کو صاف طور پر رد کیا جو جالینوس نے تجویز کیے تھے، اور یہ کہا کہ سارا خون پھیپھڑے سے بائیں بطین تک پہنچتا ہے۔"
  basis:
    ar: "نص شرح تشريح القانون نفسه كما ترجمه مايرهوف عن مخطوطاته ونقله وست؛ ولا يعارض المصدر هذه الأولوية. والسؤال المفتوح هو هل وصل هذا النص إلى سرفيتوس ومن جاء بعده في أوروبا، لا من وصف الدورة أولاً {cite:west-2008-ibn-al-nafis pp. 1877–1880, §Pulmonary circulation}."
    en: "The text of the commentary itself, as Meyerhof translated it from the manuscripts and West reports it; the source does not dispute this priority. The open question is whether the text reached Servetus and the anatomists after him, not who described the circulation first {cite:west-2008-ibn-al-nafis pp. 1877–1880, §Pulmonary circulation}."
    ur: "خود شرح تشریح القانون کا متن، جیسا کہ میئرہوف نے مخطوطوں سے ترجمہ کیا اور ویسٹ نے نقل کیا؛ ماخذ اس اولیت پر اختلاف نہیں کرتا۔ کھلا سوال یہ ہے کہ کیا یہ متن سرویتوس اور اس کے بعد کے ماہرینِ تشریح تک پہنچا، نہ کہ دوران کو پہلے کس نے بیان کیا {cite:west-2008-ibn-al-nafis pp. 1877–1880, §Pulmonary circulation}۔"
  perspectives: []
precursors:
  - external: { ar: "تصور جالينوس لحركة الدم والروح الحيوانية", en: "Galen's scheme of the blood and the vital spirit", ur: "جالینوس کا خون اور روحِ حیوانی کا تصور" }
    note: "Galen held that blood reached the right ventricle and passed to the left through invisible pores in the septum, where it met pneuma from the inhaled air; Ibn al-Nafis wrote against the pores."
    sources: [source/west-2008-ibn-al-nafis]
  - external: { ar: "كتاب القانون في الطب لابن سينا", en: "Ibn Sina's Canon of Medicine", ur: "ابن سینا کی القانون فی الطب" }
    note: "The anatomy of the Canon is the text on which Ibn al-Nafis wrote his commentary."
    sources: [source/west-2008-ibn-al-nafis]
dependents:
  - external: { ar: "ميخائيل سرفيتوس، «إحياء المسيحية» (1553)", en: "Michael Servetus, Christianismi Restitutio (1553)", ur: "میخائیل سرویتوس، «کرسٹیانسمی ریسٹیٹیوشیو» (1553)" }
    note: "The first European statement of the pulmonary transit; whether Servetus knew Ibn al-Nafis's text is not established."
    sources: [source/west-2008-ibn-al-nafis]
  - external: { ar: "كولومبو وفالفيردي وفيزاليوس", en: "Colombo, Valverde and Vesalius", ur: "کولومبو، والویردے اور ویسالیوس" }
    note: "Sixteenth-century anatomists who expressed the same ideas after Servetus."
    sources: [source/west-2008-ibn-al-nafis]
  - external: { ar: "وليم هارفي (1578–1657)", en: "William Harvey (1578–1657)", ur: "ولیم ہاروی (1578–1657)" }
    note: "Harvey reported, a few years before his death, experiments showing the passage of liquid from the pulmonary artery to the left ventricle."
    sources: [source/west-2008-ibn-al-nafis]
  - external: { ar: "مارتشيلو مالبيغي والشعيرات الرئوية", en: "Marcello Malpighi and the pulmonary capillaries", ur: "مارچیلو مالپیگی اور پھیپھڑوں کی شعری نالیاں" }
    note: "Malpighi (1628–1694) saw the pulmonary capillaries about four hundred years after Ibn al-Nafis predicted passages between the pulmonary artery and vein."
    sources: [source/west-2008-ibn-al-nafis]
spread: []
impact:
  fields: [medicine-surgery, modern-medicine]
  changed:
    ar: "أنهى عند ابن النفيس فكرة كانت لازمة في نظام جالينوس منذ القرن الثاني، وهي مرور الدم في مسامّ الحاجز، وجعل الرئة طريق الدم من جانب القلب الأيمن إلى جانبه الأيسر {cite:west-2008-ibn-al-nafis pp. 1877–1880, §Pulmonary circulation}."
    en: "It removed, for Ibn al-Nafis, an idea that Galen's system had needed since the second century, the passage of blood through septal pores, and made the lung the blood's route from the right side of the heart to the left {cite:west-2008-ibn-al-nafis pp. 1877–1880, §Pulmonary circulation}."
    ur: "اس نے ابن النفیس کے ہاں وہ تصور ختم کیا جو دوسری صدی سے جالینوس کے نظام کے لیے ضروری تھا، یعنی پردے کے مساموں سے خون کا گزرنا، اور پھیپھڑے کو دل کے دائیں حصے سے بائیں حصے تک خون کا راستہ بنا دیا {cite:west-2008-ibn-al-nafis pp. 1877–1880, §Pulmonary circulation}۔"
  history:
    ar: "يعدّه مؤرخو الفيزيولوجيا أول خروج صريح على سلطة جالينوس في هذه المسألة، وإن ظل النص مجهولاً في الغرب حتى عثر الطبيب المصري محيي الدين التطاوي على مخطوطته في مكتبة الدولة البروسية في برلين في أثناء إعداد أطروحته للدكتوراه {cite:west-2008-ibn-al-nafis pp. 1877–1880, §Pulmonary circulation}."
    en: "Historians of physiology treat it as the first open break with Galen's authority on this point, though the text stayed unknown in the West until the Egyptian physician Muhyi al-Din al-Tatawi found the manuscript in the Prussian State Library in Berlin while writing his doctoral thesis {cite:west-2008-ibn-al-nafis pp. 1877–1880, §Pulmonary circulation}."
    ur: "فعلیات کے مؤرخین اسے اس مسئلے میں جالینوس کے اختیار سے پہلا کھلا انحراف مانتے ہیں، اگرچہ یہ متن مغرب میں نامعلوم رہا یہاں تک کہ مصری طبیب محی الدین التطاوی نے اپنے ڈاکٹری مقالے کی تیاری کے دوران برلن کی پروشیائی سرکاری لائبریری میں اس کا مخطوطہ پایا {cite:west-2008-ibn-al-nafis pp. 1877–1880, §Pulmonary circulation}۔"
  significance: 4
  why: "The first known statement of the pulmonary transit and the first open rejection of Galen's septal pores, three centuries before the European accounts; its influence on those accounts is unproven, which keeps it below the highest score."
