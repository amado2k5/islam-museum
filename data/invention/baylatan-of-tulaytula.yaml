today:
  form:
    ar: "لا يوجد أثر باقٍ؛ يبقى الخبر نصاً ومشروعاً أثرياً حياً — فرضية نبع لاس تينيرياس المبلّغة سنة 2023 — والرسم في المتحف سلسلة مفاهيمية لا إعادة إنشاء {cite:cihar-zarqali-lunar-water-clock archaeology hypothesis} {cite:kan-baylatan-2023 abstract}."
    en: "No surviving object; the account remains text plus a live archaeological hypothesis — the Las Tinerías spring reported in 2023 — and the museum diagram is a conceptual chain, not a reconstruction {cite:cihar-zarqali-lunar-water-clock archaeology hypothesis} {cite:kan-baylatan-2023 abstract}."
    ur: "کوئی باقی آلہ نہیں؛ خبر ایک متن اور ایک زندہ أثری قیاس — 2023 میں لاس تینیریاس چشمے سے متعلق گمان — رہتی ہے، اور میوزیم کا خاکہ ایک مفہومی سلسلہ ہے، نقشہ نہیں {cite:cihar-zarqali-lunar-water-clock archaeology hypothesis} {cite:kan-baylatan-2023 abstract}۔"
  descendants:
    ar: "لا يذكر أي مصدر مقروء جهازاً لاحقاً مبنياً عليه؛ الساعات المائية الحديثة تقانة مستقلة، والفرضية الأثرية تعني مصدر ماء محتمل لا نسخة عاملة {cite:kan-baylatan-2023 abstract} {cite:cihar-zarqali-lunar-water-clock archaeology hypothesis}."
    en: "No read source names a later device built on it; modern water clocks are an independent technology, and the archaeological hypothesis concerns a possible water source, not a working replica {cite:kan-baylatan-2023 abstract} {cite:cihar-zarqali-lunar-water-clock archaeology hypothesis}."
    ur: "کوئی پڑھا ہوا ماخذ اس پر بنے بعد کے آلہ کا نام نہیں لیتا؛ جدید آبی گھڑیاں ایک آزاد تکنیک ہیں، اور أثری قیاس ایک ممکنہ پانی کے ماخذ کی بات ہے، کام کرنے والی نقل نہیں {cite:kan-baylatan-2023 abstract} {cite:cihar-zarqali-lunar-water-clock archaeology hypothesis}۔"
media: { image: media/toledo-tajo-context, diagram: media/diagram-baylatan-of-tulaytula }
kids:
  ar: "تخيل حوضين كبيرين في بيت على ضفة نهر، يمتلئ أحدهما بينما ينحسر الآخر مع تغيّر القمر — هكذا وصفت كتب الأندلس «بيلتا طليطلة» المنسوبة إلى الزرقالي. لا أحد اليوم يعرف كيف كانتا تعملان فعلاً، وربما لم تكونا موجودتين أصلاً؛ القصة نفسها جزء من تاريخ طليطلة."
  en: "Imagine two big basins in a riverside house, one filling while the other empties as the moon changes — that is how Andalusian books described the 'Baylatan of Toledo' attributed to al-Zarqali. Nobody today knows how they really worked, and they may never have existed; the story itself is part of Toledo's history."
  ur: "تصور کرو دریا کے کنارے ایک گھر میں دو بڑے حوض، چاند بدلتے ہی ایک بھرتا اور دوسرا خالی ہوتا — اندلس کی کتابیں «بيلتا طلیطلہ» کو اسی طرح بیان کرتی ہیں جو الزرقالی سے منسوب ہے۔ آج کوئی نہیں جانتا کہ وہ واقعی کیسے کام کرتے تھے، اور شاید بنے ہی نہیں تھے؛ کہانی خود طلیطلہ کی تاریخ کا حصہ ہے۔"
