      sources: [source/lane-early-islamic-pottery-1947]
    - tradition: academic
      stance: { ar: "الأسبقية المصرية والعراقية", en: "Earlier Egyptian and Iraqi claims", ur: "مصری اور عراقی اسبقیت" }
      summary: { ar: "الأسبقية المصرية والعراقية — Late-Fatimid Egypt made hard white pastes with alkaline glaze earlier, and the composite-body technique was practised in Pharaonic and Roman Egypt before lapsing; ninth-century Mesopotamian lustre is a different ware.", en: "Late-Fatimid Egypt made hard white pastes with alkaline glaze earlier, and the composite-body technique was practised in Pharaonic and Roman Egypt before lapsing; ninth-century Mesopotamian lustre is a different ware.", ur: "مصری اور عراقی اسبقیت — Late-Fatimid Egypt made hard white pastes with alkaline glaze earlier, and the composite-body technique was practised in Pharaonic and Roman Egypt before lapsing; ninth-century Mesopotamian lustre is a different ware." }
