summary:
  ar: "عجينة خزفية مركبة من كوارتز مطحون وزجاج ⁦(فرت)⁩ وقليل من الطين الأبيض، طوّرها الفخار الإسلامي — تُوصف في وصية أبي القاسم الكاشاني ⁦(1301م)⁩ بعشرة أجزاء كوارتز إلى جزء فرت وجزء طين — فأعطت جسماً أبيض صلباً يلتحم مع التزجيج القلوي ويحمل اللوستر والمينائي {cite:lane-early-islamic-pottery-1947}."
  en: "A composite ceramic body of powdered quartz, glass frit and a little white clay developed in the medieval Islamic world — described in Abu'l-Qasim al-Kashani's ⁦(1301)⁩ treatise as ten parts quartz to one of frit and one of clay — giving a hard white body that fused inseparably with the alkaline glaze and carried lustre and minai painting {cite:lane-early-islamic-pottery-1947}."
  ur: "کوارتز پاوڈر، شیشے کی فرٹ اور تھوڑی سی سفید مٹی سے بنی مرکب سیرامک جسم، جو قرون وسطی کے عالمِ اسلام میں تیار ہوئی — ابوالقاسم کاشانی کی ⁦(1301ء)⁩ رسالہ میں دس حصے کوارتز، ایک فرٹ، ایک مٹی — جس نے سخت سفید جسم دیا جو الکلین گلیز سے جڑ گیا اور لوسٹر اور مینائی نقش اٹھایا {cite:lane-early-islamic-pottery-1947}۔"
  es: "Un cuerpo cerámico compuesto de cuarzo en polvo, frita de vidrio y un poco de arcilla blanca se desarrolló en el mundo islámico medieval —descrito en el tratado de Abu'l-Qasim al-Kashani (1301) como diez partes de cuarzo por una de frita y una de arcilla— que daba un cuerpo blanco duro que se fusionaba inseparablemente con el esmalte alcalino y presentaba lustre y pintura minai {cite:lane-early-islamic-pottery-1947}."
  fr: "Un corps céramique composite de quartz en poudre, de fritte de verre et d'un peu d'argile blanche s'est développé dans le monde islamique médiéval — décrit dans le traité d'Abu'l-Qasim al-Kashani (1301) comme dix parts de quartz pour une de fritte et une d'argile — donnant un corps blanc dur qui fusionnait inséparablement avec la glaçure alcaline et portait le lustre et la peinture minai {cite:lane-early-islamic-pottery-1947}."
