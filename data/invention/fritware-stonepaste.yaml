kids:
  ar: "الخزافون في العالم الإسلامي اكتشفوا طريقة لصنع طين أبيض صلب من رمل مطحون وزجاج ذائب وقليل من الطين، فصارت أوانيهم بيضاء قوية تحمل ألواناً لامعة كالذهب. كان ذلك قبل ثمانمائة سنة تقريباً، وما زالت أوانيهم محفوظة في المتاحف."
  en: "Potters in the Islamic world found a way to make a hard white clay from ground sand, melted glass and a little clay, so their pots became white, strong and able to carry shining colours like gold. That was about eight hundred years ago, and their pots still sit in museums today."
  ur: "عالمِ اسلام کے کماہگروں نے پسی ریت، پگھلے شیشے اور تھوڑی مٹی سے سخت سفید مٹی بنانے کا طریقہ نکالا، تو ان کے برتن سفید، مضبوط اور سونے جیسی چمک اٹھانے کے قابل بنے۔ یہ آٹھ سو سال پہلے تھا، اور ان کے برتن آج بھی عجائب گھروں میں ہیں۔"
sources: [source/lane-early-islamic-pottery-1947, source/encyclopaedia-of-islam-2]
