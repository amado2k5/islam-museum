today:
  form:
    ar: "يبقى الفخار المركب في المتاحف شاهداً على الهندسة الخزفية؛ والقطع الكاشانية والسلطان آبادية في لندن وكليفلاند والمتحف الوطني بدمشق تعرضه {cite:lane-early-islamic-pottery-1947}."
    en: "Fritware survives in museum collections as testimony to the ceramic engineering; Kashan and Sultanabad pieces in London, Cleveland and elsewhere display it {cite:lane-early-islamic-pottery-1947}."
    ur: "مرکب فخار عجائب گھروں میں سیرامک انجینئرنگ کی گواہی ہے؛ کاشان اور سلطان آباد کے نمونے لندن اور کلیولینڈ میں دکھاتے ہیں {cite:lane-early-islamic-pottery-1947}۔"
  descendants:
    ar: "تقليد الإزنيق والبلاط المغربي والفخار العربي المستمر كلها حملت فن الجسم المركب {cite:encyclopaedia-of-islam-2}."
    en: "Iznik ware, Maghribi tilework and the continuing potteries of the Islamic world all carried the composite-body craft {cite:encyclopaedia-of-islam-2}."
    ur: "ازنیک برتن، مغربی ٹائل ورک اور مسلسل اسلامی مٹی برتن سبھی مرکب جسم کی دستکاری لے گئے {cite:encyclopaedia-of-islam-2}۔"
