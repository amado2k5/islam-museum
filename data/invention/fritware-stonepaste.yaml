precursors:
  - external: { ar: "العجائن المصرية القديمة", en: "The composite pastes of ancient Egypt", ur: "قدیم مصر کی مرکب پیسٹیں" }
    note: "Lane calls the Islamic fritware a re-discovery of a technique practised in Dynastic and Roman Egypt, in abeyance since the ninth century."
    sources: [source/lane-early-islamic-pottery-1947]
  - external: { ar: "الصينية كمثل أعلى", en: "Chinese porcelain as the admired model", ur: "چینی پورسلین بطور مثال" }
    note: "Ta'alibi and al-Biruni admired the translucency, thinness and resonance of Chinese porcelain; the Persian white paste deliberately imitated Ting and ying-ching wares without kaolin."
    sources: [source/lane-early-islamic-pottery-1947]
  - external: { ar: "الفخار العباسي الملوّن واللوستر", en: "Abbasid polychrome and lustre pottery", ur: "عباسی کثیر رنگ اور لوسٹر فخار" }
    note: "The ninth-century tin-glazed and lustre wares of Samarra and Baghdad that the composite body later carried and surpassed."
    sources: [source/lane-early-islamic-pottery-1947, source/encyclopaedia-of-islam-2]
dependents:
  - external: { ar: "اللوستر والمينائي", en: "Lustre and minai wares", ur: "لوسٹر اور مینائی برتن" }
    note: "The hard white body carried Kashan and Sultanabad lustre tiles and the polychrome overglaze minai painting of the twelfth-thirteenth centuries."
    sources: [source/lane-early-islamic-pottery-1947, source/encyclopaedia-of-islam-2]
  - external: { ar: "الخزف الأوروبي اللاحق", en: "Later European soft-paste porcelain", ur: "بعد کی یورپی نرم پیسٹ پورسلین" }
    note: "Lane compares the material to eighteenth-century French pate tendre, composed likewise of glass frit, powdered silica and white clay — a structural analogue, not a proven descent."
    sources: [source/lane-early-islamic-pottery-1947]
