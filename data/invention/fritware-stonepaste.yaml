origin:
  place: place/kashan
  polity: polity/seljuk-empire
  context:
    ar: "ورش إيران السلجوقية — الرّي وكاشان — حيث أنتجت العجينة البيضاء الصلبة الخزفَ الذي حمل اللوستر والمينائي؛ وقد سبقتها في مصر الفاطمية عجائن بيضاء صلبة بالتزجيج القلوي {cite:lane-early-islamic-pottery-1947}."
    en: "The workshops of Seljuq Iran — Rayy and Kashan — where the hard white paste produced the ware that carried lustre and minai; late-Fatimid Egypt had already made hard white pastes with alkaline glaze {cite:lane-early-islamic-pottery-1947}."
    ur: "سلجوقی ایران کی ورکشاپیں — رے اور کاشان — جہاں سخت سفید پیسٹ نے وہ برتن بنا جس نے لوسٹر اور مینائی اٹھایا؛ فاطمی مصر میں پہلے سے سخت سفید پیسٹ الکلین گلیز کے ساتھ بنتا تھا {cite:lane-early-islamic-pottery-1947}۔"
