impact:
  fields: [materials-industry, everyday-life]
  changed:
    ar: "أعطت الخزف جسماً أبيض صلباً يلتحم بالتزجيج، فاختفى التقشير وسمحت بالرسم تحت الزجاج وفوقه والتفريغ الشبكي {cite:lane-early-islamic-pottery-1947}."
    en: "It gave pottery a hard white body fused to its glaze, ending flaking and enabling underglaze and overglaze painting and pierced 'window' work {cite:lane-early-islamic-pottery-1947}."
    ur: "اس نے فخار کو سخت سفید جسم دیا جو گلیز سے جڑا ہوا، چِھلکا ختم ہوا اور گلیز کے نیچے اور اوپر نقش اور جالی دار سوراخ ممکن ہوئے {cite:lane-early-islamic-pottery-1947}۔"
  history:
    ar: "جعلت العجينة المركبة فنّ الخزف الإسلامي على أساس جديد؛ فعليها قامت مدارس اللوستر والمينائي والبلاط المجدب {cite:lane-early-islamic-pottery-1947, cite:encyclopaedia-of-islam-2}."
    en: "The composite body put Islamic fine pottery on a new basis; the lustre, minai and tilework schools stood on it {cite:lane-early-islamic-pottery-1947} {cite:encyclopaedia-of-islam-2}."
    ur: "مرکب پیسٹ نے عمدہ اسلامی فخار کو نئی بنیاد دی؛ لوسٹر، مینائی اور ٹائل کے مکاتب اسی پر کھڑے ہوئے {cite:lane-early-islamic-pottery-1947} {cite:encyclopaedia-of-islam-2}۔"
  significance: 4
  why: "The engineered ceramic body behind the greatest Islamic pottery — lustre, minai and architectural tilework — honestly recorded as a craft re-composition with debated origins."
