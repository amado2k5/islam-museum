attribution:
  status: improvement
  claim:
    ar: "تركيب حرفي إسلامي موثق أعاد اكتشاف تقنية أقدم — عجائن مزججة قديمة في مصر الفرعونية والرومانية — وصنع جسم الخزف الذي حمل أعظم فنون الفخار الإسلامي؛ والأصل الدقيق ⁦(العراق أم مصر أم إيران)⁩ متنازع فيه في الدراسات."
    en: "A documented Islamic craft composite that re-discovered an older technique — glazed composite pastes of Pharaonic and Roman Egypt — and made the ceramic body that carried the greatest Islamic pottery; the precise origin — Iraq, Egypt or Iran — is contested in the scholarship."
    ur: "ایک موثق اسلامی دستکاری مرکب جس نے قدیم تر تقنیک ⁦(فرعونی اور رومی مصر کی مرکب پیسٹیں)⁩ دوبارہ دریافت کی اور وہ برتن جسم بنا جس نے عظیم اسلامی فخار اٹھایا؛ اصل ⁦(عراق، مصر یا ایران)⁩ ادبیات میں متنازع ہے۔"
  basis:
    ar: "لين: عجينة 1301 الموصوفة ⁦(10 كوارتز : 1 فرت : 1 طين)⁩ جعلت الجسم والتزجيج يلتحمان، وأعفَت من المصلّ، والتقنية «غيّرت كلياً» خزف القرن الثاني عشر — وهي بحسبه إعادة اكتشاف لفنّ مصري قديم كان قد توقف منذ القرن التاسع {cite:lane-early-islamic-pottery-1947}."
    en: "Lane: the 1301-described paste ⁦(10 quartz : 1 frit : 1 clay)⁩ fused body and glaze inseparably and removed the need for slip, and the technique 'completely revolutionized' twelfth-century fine pottery — in his judgement a re-discovery of an old Egyptian craft dormant since the ninth century {cite:lane-early-islamic-pottery-1947}."
    ur: "لین: 1301ء میں بیان شدہ پیسٹ ⁦(10 کوارتز : 1 فرٹ : 1 مٹی)⁩ نے جسم اور گلیز کو ناانفصمک جوڑ دیا اور سلپ کی ضرورت ختم کی؛ بارہویں صدی کے عمدہ فخار کو «مکمل بدل دیا» — اور ان کے نزدیک یہ قدیم مصری فن کی دوبارہ دریافت تھی {cite:lane-early-islamic-pottery-1947}۔"
