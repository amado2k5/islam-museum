label:
  ar: "عجينة الفخار المصنوعة ⁦(الفرت وير/ستون بيست)⁩ في الفخار الإسلامي"
  en: "Fritware (stonepaste): the composite ceramic body of Islamic pottery"
  ur: "فِرِٹ ویئر ⁦(سٹون پیسٹ)⁩: اسلامی مٹی برتن کی مرکب جسمانی ساخت"
  es: "Cerámica frita (pasta de piedra): el cuerpo cerámico compuesto de la alfarería islámica."
  fr: "Fritware (pâte de pierre): le corps céramique composite de la poterie islamique"
