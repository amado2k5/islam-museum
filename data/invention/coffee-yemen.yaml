summary:
  ar: "نُقل اسم «قهوة» من الخمر إلى شراب ثمر البُنّ في اليمن نحو نهاية القرن الثامن الهجري/الرابع عشر الميلادي، وانتشر الشرب من أوساط الصوفية لإعانته على سهر الذكر {cite:encyclopaedia-of-islam-2 vol. IV p. 482 KAHWA}. تنسب الروايات إدخاله إلى عدن للفقيه محمد بن سعيد الذبهاني ⁦(ت 875/1470)⁩ وإلى موكا لعلي بن عمر الشاذلي ⁦(ت 821/1418)⁩، فمن اليمن إلى مكة فالقاهرة فإسطنبول {cite:encyclopaedia-of-islam-2 vol. IV pp. 482–486 KAHWA}."
  en: "The old name for wine was transferred to the drink of the coffee berry in Yemen toward the end of the fourteenth century, and drinking spread from Sufi circles for the wakefulness it gave their night devotions {cite:encyclopaedia-of-islam-2 vol. IV p. 482 KAHWA}. The traditions credit its introduction at Aden to the jurist Muhammad ibn Sa'id al-Dhabhani ⁦(d. 875/1470)⁩ and at Mokha to Ali ibn Umar al-Shadhili ⁦(d. 821/1418)⁩; from Yemen it reached Mecca, Cairo and Istanbul {cite:encyclopaedia-of-islam-2 vol. IV pp. 482–486 KAHWA}."
  ur: "شراب کی قدیم تسم «قہوہ» یمن میں چودہویں صدی کے آخر تک قہوہ دانے کے مشروب کو ملی، اور صوفی حلقوں سے پھیلا کہ رات کے ذکر میں بیداری دیتا {cite:encyclopaedia-of-islam-2 vol. IV p. 482 KAHWA}۔ روایات عدن میں متعارف کروانے کا سہرا فقیہ محمد بن سعید ذبهانی ⁦(وفات 875/1470)⁩ اور موکا میں علی بن عمر شاذلی ⁦(وفات 821/1418)⁩ کو دیتی ہیں؛ پھر مکہ، قاہرہ اور استنبول تک پہنچا {cite:encyclopaedia-of-islam-2 vol. IV pp. 482–486 KAHWA}۔"
  es: "El antiguo nombre del vino se transfirió a la bebida del grano de café en Yemen hacia finales del siglo XIV, y su consumo se extendió desde los círculos sufíes por el estado de vigilia que les proporcionaba en sus devociones nocturnas {cite:encyclopaedia-of-islam-2 vol. IV p. 482 KAHWA}. Las tradiciones atribuyen su introducción en Adén al jurista Muhammad ibn Sa'id al-Dhabhani (m. 875/1470) y en Mokha a Ali ibn Umar al-Shadhili (m. 821/1418); desde Yemen llegó a La Meca, El Cairo y Estambul {cite:encyclopaedia-of-islam-2 vol. IV pp. 482–486 KAHWA}."
  fr: "L'ancien nom du vin fut appliqué à la boisson issue de la baie de café au Yémen vers la fin du XIVe siècle, et sa consommation se répandit depuis les cercles soufis pour la vigilance qu'elle procurait lors de leurs prières nocturnes (voir: Encyclopédie de l'Islam, vol. IV, p. 482, Kahwa). La tradition attribue son introduction à Aden au juriste Muhammad ibn Sa'id al-Dhabhani (mort en 875/1470) et à Mokha à Ali ibn Umar al-Shadhili (mort en 821/1418); du Yémen, elle atteignit La Mecque, le Caire et Istanbul (voir: Encyclopédie de l'Islam, vol. IV, p. 482-486, Kahwa)."
