attribution:
  status: transmission
  claim:
    ar: "توطين شجرة القهوة وتحويلها إلى مشروب ومؤسسة للعبادة والتجارة في اليمن؛ لا اكتشاف النبتة نفسها، وهي إثيوبية الأصل، وروايات المُحدِث متنافسة."
    en: "Domestication of the coffee tree and its institution as a devotional drink and a trade in Yemen; not discovery of the Ethiopian-native plant itself, and the competing 'introducer' traditions are local legends."
    ur: "قہوہ درخت کی یمن میں کاشتکاری اور مشروب و عبادت و تجارت کی صورت میں اس کا قیام؛ حبشی نصل کے پودے کی دریافت نہیں، اور 'متعارف کروانے والوں' کی رقابتی روایتیں مقامی لوک کہانیاں ہیں۔"
  basis:
    ar: "تجمع موسوعة الإسلام ثلاث روايات عن المُحدِث ⁦(الذبهاني، الشاذلي، العيدروس)⁩ وتقول إن تعددها يدل على تقاليد محلية، وأقوها رواية موكا؛ ويوافق يوكرز على أن قصص عمر والماعز لا تصح وقائع تاريخية {cite:encyclopaedia-of-islam-2 vol. IV pp. 483–484 KAHWA} {cite:ukers-all-about-coffee-1922 pp. 16–17}."
    en: "EI2 collects three introducer traditions ⁦(al-Dhabhani, al-Shadhili, al-Aydarus)⁩ and reads their plurality as local legend, the Mokha one being the strongest known; Ukers likewise holds the Omar-and-the-goats stories not believable as history {cite:encyclopaedia-of-islam-2 vol. IV pp. 483–484 KAHWA} {cite:ukers-all-about-coffee-1922 pp. 16–17}."
    ur: "دائرۃ الاسلام تین متعارف کروانے والوں کی روایتیں ⁦(ذبهانی، شاذلی، عیدروس)⁩ سمیٹتی اور ان کی کثرت کو مقامی روایت سمجھتی، موکا والی سب سے مشہور؛ یوکرز بھی عمر اور بکروں کی کہانیوں کو تاریخی وقوع تسلیم نہیں کرتا {cite:encyclopaedia-of-islam-2 vol. IV pp. 483–484 KAHWA} {cite:ukers-all-about-coffee-1922 pp. 16–17}۔"
  perspectives:
    - tradition: sunni
      id: sufi-devotional-account
      standing: main
      summary:
        ar: "تروي كتب الطرق والتراجم أن الصوفية اليمنيين أولوا القهوة بالنية الصالحة فعدّوا شربها طاعة ورتّبوا له راتباً بتلاوة «يا قوي» 116 مرة وأطلقوا على لذته الروحية «القهوة المعنوية» {cite:encyclopaedia-of-islam-2 vol. IV pp. 483–484 KAHWA}."
        en: "The order and biographical literature reports Yemeni Sufis taking coffee with righteous intent as a good work, assigning it a ratib of 116 repetitions of 'ya qawi' and naming the rapture it aided 'the ideal kahwa' {cite:encyclopaedia-of-islam-2 vol. IV pp. 483–484 KAHWA}."
        ur: "طریقوں اور تراجم کی کتب بتاتی ہیں کہ یمنی صوفی نیک نیتی سے قہوہ پیتے، طاعت سمجھتے، اسے 116 بار 'یا قوی' کا راتب دیتے اور اس کی روحانی لذت کو 'قہوہ معنوی' کہتے {cite:encyclopaedia-of-islam-2 vol. IV pp. 483–484 KAHWA}۔"
      sources: [source/encyclopaedia-of-islam-2]
    - tradition: academic
      id: legend-versus-document
      standing: main
      summary:
        ar: "يؤرخ المستشرقون أقدم ذكر للقهوة في كتب القرن العاشر الهجري/السادس عشر الميلادي ويحذرون من أسناد الشرف المتعددة ومن فرضية أصل الاسم من كافا {cite:encyclopaedia-of-islam-2 vol. IV pp. 482–483 KAHWA} {cite:ukers-all-about-coffee-1922 pp. 16–17}."
        en: "The scholarly accounts date the earliest mentions of coffee to tenth/sixteenth-century writings and warn both against the multiple introducer claims and against the unproven Kaffa etymology of the name {cite:encyclopaedia-of-islam-2 vol. IV pp. 482–483 KAHWA} {cite:ukers-all-about-coffee-1922 pp. 16–17}."
        ur: "علمی بیانات قہوے کی قدیم ترین تصریح کو دسویں/سولہویں صدی کی کتب میں رکھتے اور متعدد دعووں اور کافا اشتقاق کی غیر مثبت فرضیہ پر تنبیہ کرتے ہیں {cite:encyclopaedia-of-islam-2 vol. IV pp. 482–483 KAHWA} {cite:ukers-all-about-coffee-1922 pp. 16–17}۔"
      sources: [source/encyclopaedia-of-islam-2, source/ukers-all-about-coffee-1922]
