  context:
    ar: "الشجرة الإثيوبية الأصل دخلت اليمن وروّعت مزارعها على سفوح جبال السروات ⁦(1100–2200 م)⁩، والمشروب صار في أيدي أهل التصوف بقصد السهر للأذكار؛ أشهر الجبال الحراز ورِيمة والعدين {cite:encyclopaedia-of-islam-2 vol. IV pp. 485–486 KAHWA}."
    en: "The Ethiopian-native tree was planted on the terraced Sarawat slopes ⁦(1100–2200 m)⁩ and the drink passed into Sufi hands for staying awake at devotions; Haraz, Rayma and Udayn were the famed districts {cite:encyclopaedia-of-islam-2 vol. IV pp. 485–486 KAHWA}."
    ur: "حبشی نصل کا درخت سراوات کی پہاڑی چٹانوں ⁦(1100–2200 میٹر)⁩ کی زرعی سیڑھیوں میں لگا اور مشروب صوفیوں کے ہاتھ رات کے ذکر کے لیے؛ حراز، ریمہ اور عدین مشہور علاقے {cite:encyclopaedia-of-islam-2 vol. IV pp. 485–486 KAHWA}۔"
