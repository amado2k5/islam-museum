impact:
  fields: [food-drink, institutions-systems, everyday-life]
  changed:
    ar: "أضاف مشروباً منزّهاً عن الخمر إلى السهر والعبادة والعمل الليلي، وخلق مؤسسة القهوخانة التي قيل لها «مكتب عرفان» وأصبحت مجلس الأدباء والموظفين {cite:encyclopaedia-of-islam-2 vol. IV pp. 483–485 KAHWA}."
    en: "It added a licit stimulant drink to night work and devotion and created the coffee-house, jokingly the 'school of knowledge', that drew wits, poets, civil servants and judges {cite:encyclopaedia-of-islam-2 vol. IV pp. 483–485 KAHWA}."
    ur: "رات کے کام اور عبادت میں ایک جائز منبّہ مشروب بڑھایا اور قہوہ خانہ بنایا جسے مذاقاً 'مکتبِ عرفان' کہا اور جسے شاعر، اہلِ قلم اور قاضی اپنا مجلس بنایا {cite:encyclopaedia-of-islam-2 vol. IV pp. 483–485 KAHWA}۔"
  history:
    ar: "من مشروب طريقة يمنية إلى سلعة دولية رئيسية في تجارة الشرق الأوسط، فاحتكرها اليمن حتى كسرته الشركات الأوروبية فامتدت الزراعة إلى جاوة والكاريبي وأمريكا الجنوبية {cite:encyclopaedia-of-islam-2 vol. IV pp. 487–488 KAHWA}."
    en: "From a Yemeni order's drink to a leading commodity of Middle Eastern trade: Yemen held the supply until European companies broke the monopoly and cultivation spread to Java, the Caribbean and South America {cite:encyclopaedia-of-islam-2 vol. IV pp. 487–488 KAHWA}."
    ur: "یمنی طریقے کے مشروب سے مشرقِ وسطیٰ کی ممتاز تجارتی سلعہ؛ یمن نے رسد قائم رکھی مگر یورپی کمپنیوں نے اجارہ داری توڑی اور کاشت جاوا، کیریبین اور جنوبی امریکہ پھیلی {cite:encyclopaedia-of-islam-2 vol. IV pp. 487–488 KAHWA}۔"
  significance: 4
  why: "The documented institutionalisation of coffee drinking and cultivation in fifteenth-century Yemen and its subsequent spread, with the introducer legends clearly labelled as legends."
