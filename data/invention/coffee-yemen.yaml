label:
  ar: "القهوة في اليمن: مشروب الصوفية ومنشأ تجارة موكا"
  en: "Coffee in Yemen: the Sufis' drink and the birth of the Mokha trade"
  ur: "یمن میں قہوہ: صوفیوں کا مشروب اور موکا تجارت کا آغاز"
  es: "El café en Yemen: la bebida de los sufíes y el nacimiento del comercio de Mokha."
  fr: "Le café au Yémen: la boisson des soufis et la naissance du commerce du mokha"
