    ar: "من قهوة البُنّ والقِشر إلى إسبريسو وقطارة ومعجنات العالم؛ تفاوت أنواع التحضير لا يغير أصل الشراب {cite:ukers-all-about-coffee-1922 pp. 16–18}."
    en: "From Yemen's bunn-and-husk decoctions to espresso, drip and the world's cafés; differences in preparation do not change the drink's root {cite:ukers-all-about-coffee-1922 pp. 16–18}."
    ur: "یمن کے بن و قشر کے شوربے سے ایسپریسو، ڈرپ اور دنیا کے کیفے تک؛ تیاری کی مختلف قسمیں مشروب کی اصل نہیں بدلتیں {cite:ukers-all-about-coffee-1922 pp. 16–18}۔"
  descendants:
    ar: "مقاهي العالم وسلسلة توريد حبوب البن العالمية؛ النسب العام لثقافة القهوة لا خطّ إفرادي مثبت من مجلس صوفي واحد {cite:encyclopaedia-of-islam-2 vol. IV pp. 487–488 KAHWA}."
    en: "The world's cafés and the global bean supply chain; the broad relationship to coffee culture is not a proven single line from one Sufi assembly {cite:encyclopaedia-of-islam-2 vol. IV pp. 487–488 KAHWA}."
    ur: "دنیا کے کیفے اور عالمی دانے کی سپلائی چین؛ قہوہ ثقافت سے عمومی تعلق کسی ایک صوفی مجلس سے ثابت لکیری نسب نہیں {cite:encyclopaedia-of-islam-2 vol. IV pp. 487–488 KAHWA}۔"
