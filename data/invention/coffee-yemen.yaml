kids:
  ar: "القهوة شجرة ثمرتها حبة تسمى البُنّ. عاشت البرية في إثيوبيا أولاً، ثم زرعها أهل اليمن وصنعوا منها شراباً. كان المتصوفة يشربونها ليسهروا للذكر ليلاً، ومن عدن ومكة وموكا سافرت إلى القاهرة وإسطنبول ثم إلى العالم كله. القصص التي تسمي من اكتشفها متعددة، وليست واحدة مؤكدة."
  en: "Coffee is a tree whose fruit holds the beans called bunn. It first grew wild in Ethiopia, then the people of Yemen planted it and made a drink from it. Sufis drank it to stay awake for night prayers, and from Aden, Mecca and Mokha it travelled to Cairo, Istanbul and the whole world. Several stories name who discovered it, and none is proven."
  ur: "قہوہ ایک درخت ہے جس کے پھل میں بن نام کے دانے ہوتے ہیں۔ پہلے وہ حبشہ میں جنگلی اگتا تھا، پھر یمنیوں نے اسے کاشت کیا اور مشروب بنایا۔ صوفی اسے رات کے ذکر میں بیدار رہنے کے لیے پیتے، اور عدن، مکہ اور موکا سے وہ قاہرہ، استنبول اور پوری دنیا گیا۔ جس نے دریافت کیا اس کی کہانیاں کئی ہیں، کوئی ایک ثابت نہیں۔"
sources: [source/encyclopaedia-of-islam-2, source/ukers-all-about-coffee-1922]
