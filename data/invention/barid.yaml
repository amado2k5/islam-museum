summary:
  ar: "شبكة من المحطات على الطرق الكبرى تُبدَّل فيها الدواب والرسل، فتنقل كتب الدولة وأخبار الأقاليم إلى الخليفة بسرعة. عرفها الفرس والروم قبل الإسلام، وتذكر المصادر أن معاوية بن أبي سفيان أول من وضعها في الإسلام، بنتها له دهاقين الفرس وأهل دواوين الروم، وأحكمها عبد الملك بن مروان، ثم أعادها العباسيون ديواناً، وأحياها الظاهر بيبرس، وبقيت إلى أن سقطت دمشق في يد تيمور سنة 804هـ."
  en: "A network of stations on the main roads where mounts and riders were changed, so that the state's letters and the news of the provinces reached the caliph quickly. The Persians and Byzantines had such a post before Islam. The sources name Mu'awiya ibn Abi Sufyan as the first to set it up in Islam, built for him by Persian dihqans and men from the Byzantine bureaux. Abd al-Malik ibn Marwan perfected it, the Abbasids ran it as a bureau, al-Zahir Baybars revived it, and it lasted until Timur took Damascus in 804 AH."
  ur: "بڑی شاہراہوں پر چوکیوں کا ایک جال جہاں سواریاں اور ہرکارے بدلے جاتے تھے، تاکہ حکومت کے خطوط اور صوبوں کی خبریں تیزی سے خلیفہ تک پہنچیں۔ اسلام سے پہلے فارس اور روم میں ایسی ڈاک موجود تھی۔ مآخذ کے مطابق اسلام میں اسے سب سے پہلے معاویہ بن ابی سفیان نے قائم کیا، جسے فارسی دہقانوں اور رومی دفاتر کے لوگوں نے ان کے لیے بنایا۔ عبد الملک بن مروان نے اسے پختہ کیا، عباسیوں نے اسے ایک دیوان کی صورت دی، الظاہر بیبرس نے اسے دوبارہ زندہ کیا، اور یہ 804ھ میں تیمور کے دمشق لینے تک قائم رہی۔"
