    note: "Al-Qalqashandi: Baybars, on the advice of his chancery secretary Sharaf al-Din Abd al-Wahhab (Ibn Fadl Allah al-Umari's uncle), restored the barid between Egypt and Syria and it lasted until Timur took Damascus in 804 AH. TDV: Cairo to Damascus in about four days."
    sources: [source/subh-al-asha-cairo-v14, source/tdv-berid]
