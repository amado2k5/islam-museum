      ur: "عباسی دیوانِ برید"
    note: "Al-Qalqashandi: Harun al-Rashid's vizier Yahya ibn Khalid restored it as it was under the Umayyads, with mules at the stations. TDV: stations every 2–4 farsakh, 930 stations, a budget of 8 million dirhams."
    sources: [source/subh-al-asha-cairo-v14, source/tdv-berid]
  - external:
