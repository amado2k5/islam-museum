impact:
  fields: [institutions-systems, navigation-geography]
  changed:
    ar: "صار للدولة طريق ثابت سريع للأخبار والأوامر بين العاصمة والأقاليم، وصار صاحب البريد عين الخليفة على ولاته، فارتبط البريد بالإدارة والاستخبار معاً."
    en: "The state gained a fixed, fast route for news and orders between the capital and the provinces, and the master of the post became the caliph's eye on his governors, so the barid served administration and intelligence together."
    ur: "ریاست کو دارالحکومت اور صوبوں کے درمیان خبروں اور احکام کا ایک مستقل اور تیز راستہ مل گیا، اور صاحبِ برید خلیفہ کی اپنے گورنروں پر نگاہ بن گیا، یوں برید انتظام اور جاسوسی دونوں کا کام دینے لگا۔"
  history:
    ar: "بقي البريد نحو سبعة قرون، ينقطع ويعود: أعاده العباسيون ديواناً، وقطعه البويهيون، واستعمل الزنكيون والأيوبيون النجّابين والحمام، وأحياه بيبرس، حتى زال بعد غزو تيمور."
    en: "The barid lasted some seven centuries, lapsing and returning: the Abbasids rebuilt it as a bureau, the Buyids cut it, the Zangids and Ayyubids used camel couriers and pigeons, and Baybars revived it until it ended after Timur's invasion."
    ur: "برید تقریباً سات صدیوں تک رکتا اور پھر چلتا رہا: عباسیوں نے اسے دیوان کی صورت میں دوبارہ بنایا، بویہیوں نے اسے ختم کیا، زنگیوں اور ایوبیوں نے اونٹ سواروں اور کبوتروں سے کام لیا، اور بیبرس نے اسے زندہ کیا یہاں تک کہ تیمور کے حملے کے بعد یہ ختم ہو گیا۔"
  significance: 4
  why: "The first state post organised in Islam, the model for the Abbasid, Mamluk and Ottoman relay systems and a working tool of caliphal administration and intelligence."
