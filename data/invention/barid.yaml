kids:
  ar: "قبل نحو ألف وأربعمئة سنة، أراد الخليفة معاوية أن تصله الأخبار من البلاد البعيدة بسرعة، فأقام على الطرق محطات فيها دواب مستريحة. يركض الرسول بالرسالة إلى المحطة التالية، فيأخذها رسول آخر على دابة نشيطة، وهكذا حتى تصل. هذا هو البريد، ومنه جاء اسم البريد الذي نرسل به الرسائل اليوم."
  en: "About fourteen hundred years ago, the caliph Mu'awiya wanted news from faraway lands to reach him fast. So he set up stations along the roads with rested animals. A rider raced with a letter to the next station, where a fresh rider on a fresh animal took it on, and so on until it arrived. This was the barid, and the Arabic word for post still comes from it."
  ur: "تقریباً چودہ سو سال پہلے خلیفہ معاویہ چاہتے تھے کہ دور کے علاقوں کی خبریں ان تک جلد پہنچیں۔ اس لیے انہوں نے راستوں پر چوکیاں بنائیں جہاں تازہ دم جانور ہوتے تھے۔ ایک سوار خط لے کر اگلی چوکی تک دوڑتا، وہاں دوسرا سوار تازہ جانور پر اسے آگے لے جاتا، یہاں تک کہ خط پہنچ جاتا۔ یہی برید تھی، اور عربی میں ڈاک کا لفظ آج بھی اسی سے آتا ہے۔"
