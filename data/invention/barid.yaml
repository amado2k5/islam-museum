origin:
  place: place/damascus
  context:
    ar: "لما استقر الأمر لمعاوية بعد مقتل علي وتسليم الحسن، صارت دولة واحدة تمتد من خراسان إلى مصر والمغرب تُحكم من دمشق، واحتاج الخليفة أن تصله أخبار الأقاليم البعيدة سريعة. وكان الفرس والروم قد عرفوا البريد قبل الإسلام، فاستدعى معاوية دهاقين الفرس وأهل أعمال الروم فوضعوه له."
    en: "Once the caliphate was settled for Mu'awiya after Ali's death and al-Hasan's handover, a single state stretching from Khurasan to Egypt and the Maghrib was ruled from Damascus, and the caliph needed the news of distant provinces to reach him fast. The Persians and the Byzantines had known the barid before Islam, so Mu'awiya summoned Persian dihqans and men from the Byzantine administration, who set it up for him."
    ur: "علی کی وفات اور حسن کی دست برداری کے بعد جب خلافت معاویہ کے لیے مستحکم ہوئی تو خراسان سے مصر اور مغرب تک ایک ہی ریاست دمشق سے چلائی جانے لگی، اور خلیفہ کو ضرورت تھی کہ دور دراز صوبوں کی خبریں جلد اس تک پہنچیں۔ فارس اور روم اسلام سے پہلے برید کو جانتے تھے، چنانچہ معاویہ نے فارسی دہقانوں اور رومی انتظامیہ کے لوگوں کو بلایا جنہوں نے ان کے لیے اسے قائم کیا۔"
makers:
  - person: person/muawiya-ibn-abi-sufyan
    role: commissioner
    place: place/damascus
    note: "Caliph 41–60 AH. Al-Qalqashandi and al-Suyuti, both quoting Abu Hilal al-Askari's al-Awa'il, name him the first to set up the barid in Islam; al-Qalqashandi adds that Persian dihqans and men from the Byzantine bureaux built it for him. TDV adds the cost (4 million dirhams) and the intelligence role he gave it."
    sources: [source/subh-al-asha-cairo-v14, source/tarikh-khulafa-minhaj-1434, source/tdv-berid, source/ibn-hajar-isaba]
attribution:
  status: improvement
  claim:
    ar: "معاوية بن أبي سفيان أول من وضع البريد في الإسلام."
    en: "Mu'awiya ibn Abi Sufyan was the first to set up the barid in Islam."
    ur: "معاویہ بن ابی سفیان اسلام میں برید قائم کرنے والے پہلے شخص تھے۔"
  basis:
    ar: "ينقل القلقشندي والسيوطي عن أبي هلال العسكري في «الأوائل» أن معاوية أول من وضع البريد في الإسلام، ويذكر القلقشندي أن الأكاسرة والقياصرة عرفوه قبله وأن دهاقين الفرس وأهل دواوين الروم وضعوه له؛ فهو نقلٌ لنظام قائم وتنظيمٌ له في دولة جديدة، لا ابتكار من عدم. ويذكر القلقشندي قولاً آخر بأن أول من وضعه عبد الملك بن مروان، وينقل عن العسكري أن عبد الملك أحكمه. وتوافق موسوعة الديانة التركية على أن معاوية أول خليفة نظّم البريد على مثال الفرس والروم."
    en: "Al-Qalqashandi and al-Suyuti both quote Abu Hilal al-Askari's al-Awa'il that Mu'awiya was the first to set up the barid in Islam. Al-Qalqashandi adds that the Persian and Byzantine emperors had it before him and that Persian dihqans and men from the Byzantine bureaux built it for him, so it was an existing system taken over and organised for a new state, not made from nothing. He also records a second report that Abd al-Malik ibn Marwan was the first, and quotes al-Askari that Abd al-Malik perfected it. The TDV encyclopaedia agrees that Mu'awiya was the first caliph to organise the barid on the Persian and Byzantine model."
    ur: "قلقشندی اور سیوطی دونوں ابو ہلال عسکری کی «الاوائل» سے نقل کرتے ہیں کہ معاویہ اسلام میں برید قائم کرنے والے پہلے شخص تھے۔ قلقشندی مزید بتاتے ہیں کہ فارس اور روم کے بادشاہوں کے ہاں یہ پہلے سے تھا اور فارسی دہقانوں اور رومی دفاتر کے لوگوں نے اسے ان کے لیے بنایا؛ یوں یہ ایک موجود نظام کو نئی ریاست کے لیے اپنانا اور منظم کرنا تھا، عدم سے ایجاد نہیں۔ وہ ایک دوسری روایت بھی درج کرتے ہیں کہ پہلے عبد الملک بن مروان تھے، اور عسکری سے نقل کرتے ہیں کہ عبد الملک نے اسے پختہ کیا۔ ترکی دیانت انسائیکلوپیڈیا (TDV) بھی متفق ہے کہ معاویہ پہلے خلیفہ تھے جنہوں نے فارسی اور رومی نمونے پر برید منظم کیا۔"
  perspectives: []
