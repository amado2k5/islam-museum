today:
  form:
    ar: "لم يبق البريد القديم، لكن اسمه بقي في العربية للخدمة البريدية الحديثة، وبقي تاريخه مكتوباً في كتب الإنشاء."
    en: "The old relay post is gone, but its name lives on in Arabic for the modern postal service, and its history is kept in the chancery manuals."
    ur: "پرانی برید باقی نہیں رہی، مگر اس کا نام عربی میں جدید ڈاک کے لیے باقی ہے، اور اس کی تاریخ انشا کی کتابوں میں محفوظ ہے۔"
  descendants:
    ar: "خدمات البريد الحكومية في البلدان الإسلامية، التي ورثت الاسم والفكرة: شبكة ثابتة تنقل الرسائل بين مراكز معلومة."
    en: "The state postal services of Muslim countries, which inherited the name and the idea: a fixed network carrying letters between known points."
    ur: "مسلم ممالک کی سرکاری ڈاک کی خدمات، جنہیں نام اور خیال دونوں ورثے میں ملے: معلوم مراکز کے درمیان خط پہنچانے والا ایک مستقل جال۔"
