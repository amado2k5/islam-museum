    note: "The book is lost in Arabic and its Latin translation carries no date of composition. The Cairo editors show from the Fihrist and the algebra's preface that al-Khwarizmi was a contemporary of al-Ma'mun, whose reign they give as 813 to 833 CE {cite:khwarizmi-jabr-cairo-1939 pp. 22–23}, and TDV shows from al-Tabari that he was still alive in 232 AH (847 CE) {cite:tdv-harizmi pp. 224–227}, so the range is that span of attested activity. A range cannot be written as a Hijri string, so only the EDTF range is given, and it is marked derived."
    sources: [source/khwarizmi-jabr-cairo-1939, source/tdv-harizmi]
  status_today: living
origin:
  place: place/baghdad
  polity: polity/abbasid-caliphate
  context:
    ar: "ينقل محققا طبعة القاهرة عن «الفهرست» أن الخوارزمي كان منقطعاً إلى خزانة الحكمة للمأمون، وأنه صاحب الزيجين المعروفين بالسند هند {cite:khwarizmi-jabr-cairo-1939 p. 22}. وتذكر موسوعة TDV أن زيج السند هند يقوم على كتاب «سدهانتا» لبراهماغوبتا، أو على كتاب بالاسم نفسه منبثق عنه، جاء به وفد هندي إلى بغداد نحو سنة 154 هـ ⁦(770–771م)⁩ في عهد المنصور {cite:tdv-harizmi pp. 224–227}؛ فكان الحساب الهندي حاضراً في بغداد قبل الخوارزمي في علم الفلك."
    en: "The Cairo editors quote the Fihrist: al-Khwarizmi devoted himself to al-Ma'mun's treasury of wisdom and made the two astronomical tables known as the Sindhind {cite:khwarizmi-jabr-cairo-1939 p. 22}. TDV records that the Sindhind tables rest on Brahmagupta's Siddhanta, or on a work of the same name derived from it, which an Indian delegation brought to Baghdad around 154 AH (770–771 CE) under the caliph al-Mansur {cite:tdv-harizmi pp. 224–227}; Indian reckoning was thus already present in Baghdad's astronomy before al-Khwarizmi."
    ur: "قاہرہ ایڈیشن کے محققین «الفہرست» سے نقل کرتے ہیں کہ خوارزمی مامون کے خزانۂ حکمت سے وابستہ رہے اور «سند ہند» کے نام سے مشہور دو فلکی زیجوں کے مصنف تھے {cite:khwarizmi-jabr-cairo-1939 p. 22}۔ ٹی ڈی وی لکھتا ہے کہ زیج سند ہند برہما گپت کی «سدھانت»، یا اسی نام کی اس سے ماخوذ کسی کتاب پر مبنی ہے، جسے ایک ہندی وفد خلیفہ منصور کے دور میں تقریباً 154ھ ⁦(770–771ء)⁩ میں بغداد لایا {cite:tdv-harizmi pp. 224–227}؛ یوں ہندی حساب خوارزمی سے پہلے ہی بغداد کے علمِ فلکیات میں موجود تھا۔"
makers:
  - person: person/al-khwarizmi
    role: transmitter
    place: place/baghdad
    note: "Author of the book on Indian reckoning (Kitab al-Hisab al-Hindi), through which, TDV says, the Indian numerals and the decimal system entered the Islamic world; its Arabic original is lost and a twelfth-century Latin translation survives in Cambridge {cite:tdv-harizmi pp. 224–227}. The Cairo editors say the Indian method of reckoning, zero included, reached the West through this book {cite:khwarizmi-jabr-cairo-1939 p. 25}."
    sources: [source/tdv-harizmi, source/khwarizmi-jabr-cairo-1939]
attribution:
  status: transmission
  claim:
    ar: "لم يخترع الخوارزمي الأرقام الهندية ولا النظام العشري، لكنه ألّف الكتاب الذي دخلت به إلى العالم الإسلامي، ثم وصلت بترجمته اللاتينية إلى الغرب، فصار اسمه اسماً لطريقة الحساب بها."
    en: "Al-Khwarizmi did not invent the Indian numerals or the decimal system; he wrote the book through which they entered the Islamic world and, in its Latin translation, reached the West, so that his name became the name of the method of reckoning with them."
    ur: "خوارزمی نے نہ ہندی ہندسے ایجاد کیے نہ اعشاری نظام؛ انہوں نے وہ کتاب لکھی جس کے ذریعے یہ عالمِ اسلام میں داخل ہوئے اور اس کے لاطینی ترجمے کے ذریعے مغرب تک پہنچے، یہاں تک کہ ان کا نام ان سے حساب کرنے کے طریقے کا نام بن گیا۔"
  basis:
    ar: "تقول موسوعة TDV إن الأرقام الهندية والنظام العشري دخلت العالم الإسلامي بكتاب الخوارزمي في الحساب الهندي، وإن أصله العربي مفقود، وإن ترجمة لاتينية له من القرن الثاني عشر وُجدت في مكتبة كامبريدج ونشرها بونكومپاني بعنوان «Algoritmi de numero indorum» ⁦(روما 1857)⁩، ثم نشر كورت فوغل صورة المخطوطة نفسها ⁦(آلن 1963)⁩، ثم نشر أندريه ألار نشرة نقدية مع ترجمة فرنسية ⁦(باريس 1992)⁩ {cite:tdv-harizmi pp. 224–227}. ويقول محققا طبعة القاهرة إن طريقة الحساب الهندية، ومعها استعمال الصفر، إنما وصلت إلى الغرب عن طريق كتاب الخوارزمي في الحساب {cite:khwarizmi-jabr-cairo-1939 p. 25}. أما الأرقام نفسها فهندية الأصل كما يدل اسمها، وكان الحساب الهندي قد دخل بغداد قبله مع «سدهانتا» براهماغوبتا {cite:tdv-harizmi pp. 224–227}؛ فعمل الخوارزمي هو النقل والتعليم، لا الاختراع."
    en: "TDV says the Indian numerals and the decimal system entered the Islamic world through al-Khwarizmi's book on Indian reckoning; that its Arabic original is lost; that a twelfth-century Latin translation was found in Cambridge and published by B. Boncompagni as 'Algoritmi de numero indorum' (Rome 1857); that Kurt Vogel then published a facsimile of the same manuscript (Aalen 1963); and that André Allard published a critical edition with a French translation (Paris 1992) {cite:tdv-harizmi pp. 224–227}. The Cairo editors say the Indian method of reckoning, the use of zero included, reached the West through al-Khwarizmi's book of arithmetic {cite:khwarizmi-jabr-cairo-1939 p. 25}. The numerals themselves are Indian, as their name says, and Indian reckoning had come to Baghdad before him with Brahmagupta's Siddhanta {cite:tdv-harizmi pp. 224–227}; al-Khwarizmi's work was to transmit and teach, not to invent."
    ur: "ٹی ڈی وی کہتا ہے کہ ہندی ہندسے اور اعشاری نظام خوارزمی کی ہندی حساب والی کتاب کے ذریعے عالمِ اسلام میں داخل ہوئے؛ کہ اس کا عربی اصل گم ہے؛ کہ اس کا بارہویں صدی کا ایک لاطینی ترجمہ کیمبرج کی لائبریری میں ملا اور بی۔ بونکومپانی نے اسے «Algoritmi de numero indorum» کے نام سے شائع کیا ⁦(روم 1857)⁩؛ کہ پھر کرٹ فوگل نے اسی مخطوطے کا عکس شائع کیا ⁦(آلن 1963)⁩؛ اور یہ کہ آندرے الار نے فرانسیسی ترجمے کے ساتھ اس کا تنقیدی ایڈیشن شائع کیا ⁦(پیرس 1992)⁩ {cite:tdv-harizmi pp. 224–227}۔ قاہرہ کے محققین کہتے ہیں کہ حساب کا ہندی طریقہ، صفر کے استعمال سمیت، خوارزمی کی کتابِ حساب کے ذریعے مغرب تک پہنچا {cite:khwarizmi-jabr-cairo-1939 p. 25}۔ خود ہندسے ہندی ہیں، جیسا کہ ان کا نام بتاتا ہے، اور ہندی حساب ان سے پہلے برہما گپت کی «سدھانت» کے ساتھ بغداد آ چکا تھا {cite:tdv-harizmi pp. 224–227}؛ خوارزمی کا کام منتقل کرنا اور سکھانا تھا، ایجاد کرنا نہیں۔"
