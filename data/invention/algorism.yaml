kids:
  ar: "قبل نحو ألف ومئتي سنة كتب عالم في بغداد اسمه الخوارزمي كتاباً يعلّم الناس الحساب بتسعة أرقام جاءت من الهند، ومعها الصفر. بهذه الأرقام يكفي أن تغيّر مكان الرقم لتتغير قيمته: فالواحد قد يكون واحداً أو عشرة أو مئة! تُرجم كتابه إلى اللاتينية، فتعلّم منه الناس في أوروبا الحساب، وصار اسمه كلمة نستعملها اليوم: «algorithm»، أي الخطوات المرتبة التي يتبعها الحاسوب."
  en: "About twelve hundred years ago a scholar in Baghdad named al-Khwarizmi wrote a book teaching people to calculate with nine numerals that came from India, together with zero. With these numerals you only need to move a digit to change its value: a one can mean one, ten or a hundred! His book was translated into Latin, people in Europe learned to calculate from it, and his name became a word we use today: 'algorithm', the ordered steps a computer follows."
  ur: "تقریباً بارہ سو سال پہلے بغداد میں خوارزمی نام کے ایک عالم نے ایک کتاب لکھی جو لوگوں کو ہندوستان سے آئے نو ہندسوں اور صفر سے حساب کرنا سکھاتی تھی۔ ان ہندسوں میں کسی ہندسے کی جگہ بدلنے سے ہی اس کی قیمت بدل جاتی ہے: ایک کا مطلب ایک، دس یا سو ہو سکتا ہے! ان کی کتاب کا لاطینی میں ترجمہ ہوا، یورپ کے لوگوں نے اس سے حساب سیکھا، اور ان کا نام ایک لفظ بن گیا جو ہم آج استعمال کرتے ہیں: «algorithm»، یعنی وہ مرتب قدم جن پر کمپیوٹر چلتا ہے۔"
