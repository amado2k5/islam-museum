dependents:
  - external:
      ar: "الترجمة اللاتينية في القرن الثاني عشر «Algoritmi de numero Indorum»"
      en: "The twelfth-century Latin translation, 'Algoritmi de numero Indorum'"
      ur: "بارہویں صدی کا لاطینی ترجمہ «Algoritmi de numero Indorum»"
    note: "TDV: the Arabic original is lost; a twelfth-century Latin translation was found in the Cambridge library and published by B. Boncompagni as Algoritmi de numero indorum (Rome 1857), in facsimile by Kurt Vogel (Aalen 1963) and in a critical edition with French translation by André Allard, Le calcul indien (Paris 1992)."
    sources: [source/tdv-harizmi]
  - external:
      ar: "«Carmen de Algorismo» لألكسندر دي فيلا دي ⁦(نحو 1220م)⁩"
      en: "Alexander de Villa Dei's Carmen de Algorismo (about 1220)"
      ur: "الیگزینڈر دی ویلا دئی کی «Carmen de Algorismo» ⁦(تقریباً 1220ء)⁩"
    note: "The Cairo editors: the West learned arithmetic from al-Khwarizmi's book in Latin and from books built on it, among them the Carmen de Algorismo of Alexander de Villa Dei, about 1220 CE, printed by J. O. Halliwell in Rara Mathematica (London 1839); it rests on Muhammad ibn Musa's book of arithmetic and remained a reference for centuries."
    sources: [source/khwarizmi-jabr-cairo-1939]
  - external:
      ar: "«Algorismus vulgaris» لجون أوف هاليفاكس ⁦(نحو 1250م)⁩"
      en: "John of Halifax's Algorismus vulgaris (about 1250)"
      ur: "جان آف ہیلی فیکس کی «Algorismus vulgaris» ⁦(تقریباً 1250ء)⁩"
    note: "The Cairo editors: the Algorismus vulgaris of John of Halifax, about 1250 CE (ed. M. Curtze, Copenhagen 1897), like the Carmen de Algorismo, rests on Muhammad ibn Musa's book of arithmetic, and both remained references in teaching the science for centuries."
    sources: [source/khwarizmi-jabr-cairo-1939]
  - external:
      ar: "اسم الأرقام اللاتيني «Algorismus» والكلمة الإسبانية «guarismo»"
      en: "The Latin name 'Algorismus' for the numerals and the Spanish word 'guarismo'"
      ur: "ہندسوں کا لاطینی نام «Algorismus» اور ہسپانوی لفظ «guarismo»"
    note: "The Cairo editors: the numerals 1 to 9 and 0 were called Algorismus in Latin until the early eighteenth century, and the Spanish word for numerals or digits is guarismo. TDV: Latin sources give his name as Alkarismi, Algoritmi, Algorismi or Algorism."
    sources: [source/khwarizmi-jabr-cairo-1939, source/tdv-harizmi]
  - external:
      ar: "كلمة «algorithm» بمعنى الطريقة المرتبة في حل المسائل"
      en: "The word 'algorithm' for an ordered method of solving problems"
      ur: "مسائل حل کرنے کے مرتب طریقے کے معنی میں لفظ «algorithm»"
    note: "The Cairo editors: English 'algorithm', no doubt a corruption of al-Khwarizmi's name, means the set procedure for solving problems, and Chaucer uses 'augrim' for zero. TDV: al-Khwarizmi applied to algebra a method like the one he applied to Indian arithmetic, setting the operations in an ordered sequence, and this practice was later called 'algoritma' after him, an ordered technique of calculation."
    sources: [source/khwarizmi-jabr-cairo-1939, source/tdv-harizmi]
spread: []
impact:
  fields: [mathematics]
  changed:
    ar: "صار الحساب يُكتب بتسعة أرقام وصفر، تأخذ فيها كل خانة قيمتها من موضعها، فيُجمع ويُطرح ويُضرب ويُقسم بخطوات مرتبة؛ وبكتاب الخوارزمي دخلت هذه الطريقة العالم الإسلامي {cite:tdv-harizmi pp. 224–227} ثم الغرب، حيث بقي اسمه «Algorismus» اسماً للأرقام حتى أوائل القرن الثامن عشر {cite:khwarizmi-jabr-cairo-1939 p. 25}."
    en: "Reckoning came to be written with nine numerals and zero, each place taking its value from its position, and added, subtracted, multiplied and divided by ordered steps. Through al-Khwarizmi's book this method entered the Islamic world {cite:tdv-harizmi pp. 224–227} and then the West, where his name 'Algorismus' stayed the name of the numerals until the early eighteenth century {cite:khwarizmi-jabr-cairo-1939 p. 25}."
    ur: "حساب نو ہندسوں اور صفر سے لکھا جانے لگا، جن میں ہر خانہ اپنی قیمت اپنے مقام سے لیتا ہے، اور جمع، تفریق، ضرب اور تقسیم مرتب قدموں سے ہونے لگی۔ خوارزمی کی کتاب کے ذریعے یہ طریقہ عالمِ اسلام میں داخل ہوا {cite:tdv-harizmi pp. 224–227} اور پھر مغرب میں، جہاں ان کا نام «Algorismus» اٹھارہویں صدی کے آغاز تک ہندسوں کا نام رہا {cite:khwarizmi-jabr-cairo-1939 p. 25}۔"
  history:
    ar: "يقول محققا طبعة القاهرة إن الغربيين تعلموا الحساب من ترجمة كتاب الخوارزمي اللاتينية ومن كتب بُنيت عليه، ككتاب ألكسندر دي فيلا دي نحو 1220م وكتاب جون أوف هاليفاكس نحو 1250م، وبقي الكتابان مرجعاً في تعليم الحساب قروناً {cite:khwarizmi-jabr-cairo-1939 pp. 25–26}، حتى قالوا إن الخوارزمي «وضع علم الجبر وعلّمه وعلّم الحساب للناس أجمعين» {cite:khwarizmi-jabr-cairo-1939 p. 26}."
    en: "The Cairo editors say Westerners learned arithmetic from the Latin translation of al-Khwarizmi's book and from books built on it, such as Alexander de Villa Dei's of about 1220 and John of Halifax's of about 1250, both of which remained references for teaching arithmetic for centuries {cite:khwarizmi-jabr-cairo-1939 pp. 25–26}; they conclude that al-Khwarizmi founded algebra and taught it, and taught arithmetic, to all people {cite:khwarizmi-jabr-cairo-1939 p. 26}."
    ur: "قاہرہ کے محققین کہتے ہیں کہ اہلِ مغرب نے حساب خوارزمی کی کتاب کے لاطینی ترجمے سے اور اس پر بنی کتابوں سے سیکھا، جیسے تقریباً 1220ء کی الیگزینڈر دی ویلا دئی کی کتاب اور تقریباً 1250ء کی جان آف ہیلی فیکس کی کتاب، اور یہ دونوں صدیوں تک حساب کی تعلیم میں مرجع رہیں {cite:khwarizmi-jabr-cairo-1939 pp. 25–26}؛ وہ نتیجہ نکالتے ہیں کہ خوارزمی نے الجبرا کی بنیاد رکھی اور اسے سکھایا، اور تمام لوگوں کو حساب سکھایا {cite:khwarizmi-jabr-cairo-1939 p. 26}۔"
  significance: 5
  why: "The book through which the Indian numerals, zero and the decimal place-value system entered the Islamic world and, in Latin, the West; the numerals the world writes today came this way, and al-Khwarizmi's Latinized name became the words algorism and algorithm."
