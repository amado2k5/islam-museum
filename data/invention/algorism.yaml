summary:
  ar: "طريقة الحساب بالأرقام الهندية التسعة والصفر في نظام عشري منزلي، يُجمع بها ويُطرح ويُضرب ويُقسم كتابةً بخطوات مرتّبة. ألّف فيها محمد بن موسى الخوارزمي في بغداد كتاباً دخلت به الأرقام الهندية والنظام العشري إلى العالم الإسلامي، وضاع أصله العربي وبقيت ترجمته اللاتينية التي تبدأ بعبارة «قال الخوارزمي» (Dixit Algorizmi)، فتعلّم منها الغرب الحساب، وصار اسمه «Algorismus» اسماً للأرقام نفسها، ومنه جاءت كلمة «algorithm» في لغات العالم."
  en: "Reckoning with the nine Indian numerals and zero in a decimal place-value system, adding, subtracting, multiplying and dividing in writing by ordered steps. Muhammad ibn Musa al-Khwarizmi wrote a book on it in Baghdad through which the Indian numerals and the decimal system entered the Islamic world. Its Arabic original is lost, but a Latin translation survives that opens 'Dixit Algorizmi' ('al-Khwarizmi said'); from it the West learned arithmetic, his Latinized name 'Algorismus' became a name for the numerals themselves, and from it comes the world's word 'algorithm'."
  ur: "نو ہندی ہندسوں اور صفر کے ساتھ اعشاری مقامی نظام میں حساب، جس میں جمع، تفریق، ضرب اور تقسیم مرتب قدموں کے ساتھ لکھ کر کی جاتی ہے۔ محمد بن موسیٰ خوارزمی نے بغداد میں اس پر ایک کتاب لکھی جس کے ذریعے ہندی ہندسے اور اعشاری نظام عالمِ اسلام میں داخل ہوئے۔ اس کا عربی اصل گم ہو گیا، مگر اس کا ایک لاطینی ترجمہ باقی ہے جو «Dixit Algorizmi» ⁦(یعنی «خوارزمی نے کہا»)⁩ سے شروع ہوتا ہے؛ اسی سے مغرب نے حساب سیکھا، ان کا لاطینی نام «Algorismus» خود ہندسوں کا نام بن گیا، اور اسی سے دنیا کی زبانوں میں لفظ «algorithm» آیا۔"
