today:
  form:
    ar: "تُكتب الأعداد اليوم في أغلب العالم بالأرقام العشرية العشرة، ويُحسب بها بالخطوات المرتبة نفسها. وأقدم شاهد باقٍ على كتاب الخوارزمي هو ترجمته اللاتينية في كامبريدج، وهي منشورة في طبعات بونكومپاني (1857) وفوغل (1963) وألار (1992) {cite:tdv-harizmi pp. 224–227}."
    en: "Most of the world today writes numbers with the ten decimal numerals and calculates with them by the same ordered steps. The oldest surviving witness to al-Khwarizmi's book is its Latin translation in Cambridge, in print in the editions of Boncompagni (1857), Vogel (1963) and Allard (1992) {cite:tdv-harizmi pp. 224–227}."
    ur: "آج دنیا کا بیشتر حصہ اعداد دس اعشاری ہندسوں سے لکھتا ہے اور انہی مرتب قدموں سے ان کے ساتھ حساب کرتا ہے۔ خوارزمی کی کتاب کا سب سے پرانا باقی گواہ کیمبرج میں اس کا لاطینی ترجمہ ہے، جو بونکومپانی (1857)، فوگل (1963) اور الار (1992) کے ایڈیشنوں میں چھپا ہوا ہے {cite:tdv-harizmi pp. 224–227}۔"
  descendants:
    ar: "كلمة «algorithm»، أي الطريقة المرتبة في حل المسائل، تحريف لاسم الخوارزمي {cite:khwarizmi-jabr-cairo-1939 p. 25}، وهي اليوم اسم كل خطوات مرتبة يتبعها الحاسوب. والإسبانية تسمي الرقم «guarismo» من اسمه أيضاً {cite:khwarizmi-jabr-cairo-1939 p. 25}."
    en: "The word 'algorithm', an ordered method of solving problems, is a corruption of al-Khwarizmi's name {cite:khwarizmi-jabr-cairo-1939 p. 25}, and today it names every ordered set of steps a computer follows. Spanish also calls a digit 'guarismo' after him {cite:khwarizmi-jabr-cairo-1939 p. 25}."
    ur: "لفظ «algorithm»، یعنی مسائل حل کرنے کا مرتب طریقہ، خوارزمی کے نام کی بگڑی ہوئی صورت ہے {cite:khwarizmi-jabr-cairo-1939 p. 25}، اور آج یہ ہر اس مرتب سلسلۂ قدم کا نام ہے جس پر کمپیوٹر چلتا ہے۔ ہسپانوی زبان بھی ہندسے کو انہی کے نام سے «guarismo» کہتی ہے {cite:khwarizmi-jabr-cairo-1939 p. 25}۔"
