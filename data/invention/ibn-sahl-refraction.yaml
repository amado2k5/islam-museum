summary:
  ar: في رسالة «في الآلة المحرقة» ⁦(نحو 984م)⁩ برهن أبو سعد العلاء بن سهل، عالم البلاط
    البويهي ببغداد، على نسبة هندسية ثابتة بين أوتار الأشعة الساقطة والمنكسرة تكافئ
    قانون سنيل، واستعملها لتصميم عدسات كاسرة بلا أخطاء تجمع الضوء المتوازي في بؤرة؛
    أعاد رشدي راشد تركيب النص من مخطوطتين ونشره ⁦(1990، 1993)⁩ {cite:rashed-geometrie-dioptrique-1993}
    {cite:wikipedia-ibn-sahl-en}.
  en: In his treatise On the Burning Instrument (c. 984), the Buyid-court scholar
    Abu Sa'd al-'Ala' ibn Sahl proved a fixed geometrical ratio between the lengths
    associated with incident and refracted rays — equivalent to Snell's law — and
    used it to design aberration-free lenses that focus parallel light; Roshdi Rashed
    reconstructed the text from two manuscripts and published it (1990, 1993) {cite:rashed-geometrie-dioptrique-1993}
    {cite:wikipedia-ibn-sahl-en}.
  ur: اپنی رسالہ «فی الآلۃ المحرقۃ» ⁦(تقریباً 984ء)⁩ میں بوئی دربار کے ماہر ابو سعد
    العلاء بن سہل نے آتے اور منعطف ہوتے شعاعوں سے وابستہ طوالتوں کے درمیان ایک ثابت
    ہندسی نسبت ثابت کی — جو سنیل کے قانون کے مساوی ہے — اور اس سے متوازی روشنی کو
    ایک نقطے پر جمع کرنے والی بے خطا عدسے بنائے؛ رشدی راشد نے متن کو دو مخطوطوں سے
    مرتب کر کے شائع کیا ⁦(1990، 1993)⁩ {cite:rashed-geometrie-dioptrique-1993} {cite:wikipedia-ibn-sahl-en}.
  es: "En su tratado Sobre el instrumento de fuego (c. 984), el erudito de la corte Buyí Abu Sa'd al-'Ala' ibn Sahl demostró una relación geométrica fija entre las longitudes asociadas con los rayos incidentes y refractados —equivalente a la ley de Snell— y la utilizó para diseñar lentes libres de aberraciones que enfocan la luz paralela; Roshdi Rashed reconstruyó el texto a partir de dos manuscritos y lo publicó (1990, 1993) {cite:rashed-geometrie-dioptrique-1993} {cite:wikipedia-ibn-sahl-en}."
