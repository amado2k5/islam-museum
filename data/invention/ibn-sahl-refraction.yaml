today:
  form:
    ar: تُدرَّس نسبته اليوم باسم قانون سنيل في كل كتاب بصريات، ويذكره تاريخ العلم
      باسم ابن سهل كاكتشاف سابق {cite:wikipedia-ibn-sahl-en}.
    en: The ratio is taught today as Snell's law in every optics text, while the history
      of science records Ibn Sahl's earlier discovery by his name {cite:wikipedia-ibn-sahl-en}.
    ur: آج یہ نسبت ہر بصریات کی کتاب میں سنیل کے قانون کے طور پر پڑھائی جاتی ہے، جبکہ
      تاریخِ سائنس ابن سہل کی پہلی دریافت اسی کے نام سے لکھتی ہے {cite:wikipedia-ibn-sahl-en}.
  descendants:
    ar: كل عدسة نظارة وكاميرا ومجهر صُممت على القانون نفسه الذي حملته مخطوطة بغدادية
      قبل ألف سنة {cite:wikipedia-ibn-sahl-en}.
    en: Every spectacle, camera and microscope lens is designed on the same ratio
      a Baghdad manuscript carried a thousand years ago {cite:wikipedia-ibn-sahl-en}.
    ur: ہر عینک، کیمرہ اور خوردبین کا عدسہ اسی نسبت پر بنتا ہے جو ہزار سال پہلے بغداد
      کے مخطوطے میں لکھی گئی {cite:wikipedia-ibn-sahl-en}.
