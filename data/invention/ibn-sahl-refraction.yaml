  changed:
    ar: حوّل الانكسار من جدول أرقام عملية ⁦(جداول بطليموس)⁩ إلى نسبة هندسية مبرهَنة
      يمكن تصميم عدسات دقيقة عليها — بؤرة حقيقية للعدسة المقعرة-المستوية {cite:wikipedia-ibn-sahl-en}.
    en: It turned refraction from a table of practical numbers (Ptolemy's tables)
      into a proved geometrical ratio on which precise lenses could be designed —
      a true focal point for the plano-convex lens {cite:wikipedia-ibn-sahl-en}.
    ur: انعطاف کو عملی اعداد کی جدول ⁦(بطلمیوس کی جدولیں)⁩ سے ایک ثابت ہندسی نسبت
      میں بدل دیا جس پر دقیق عدسے بنائے جا سکتے تھے — مستوی-محدب عدسے کا حقیقی فوکس
      {cite:wikipedia-ibn-sahl-en}.
  history:
    ar: أوثق قانون كمي للضوء في التراث العربي قبل ابن الهيثم؛ يقرّب تاريخ بصريات القرن
      العاشر بعيداً عن صورة «الاستعداد لألبازن» ونحو إبداع قائم بذاته {cite:rashed-geometrie-dioptrique-1993}.
    en: The best-documented quantitative law of light in the Arabic heritage before
      Ibn al-Haytham; it pulls the history of tenth-century optics away from a mere
      'preparation for Alhazen' and toward a creation in its own right {cite:rashed-geometrie-dioptrique-1993}.
    ur: ابن الہیثم سے پہلے عربی وراثت میں روشنی کا بہترین موثق کمی قانون؛ دسویں صدی
      کی بصریات کی تاریخ کو محض «الہازن کی تیاری» سے ہٹا کر ایک مستقل تخلیق کی طرف
      لاتا ہے {cite:rashed-geometrie-dioptrique-1993}.
  significance: 4
  why: A documented tenth-century proof of the refraction ratio used to design real
    lenses — the earliest surviving quantitative law of geometrical optics in any
    tradition.
