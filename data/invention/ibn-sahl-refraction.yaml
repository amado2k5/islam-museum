kids:
  ar: حين تدخل شعاعة ضوء في الماء تنكسر — تنحني قليلاً. عالم في بغداد اسمه ابن سهل
    اكتشف قبل ألف سنة القاعدة الرياضية التي تحكم هذا الانحناء، وصمم بها عدسات تجمع
    ضوء الشمس في نقطة واحدة فتحرق. اليوم كل نظارة وعدسة كاميرا تعمل بنفس القاعدة.
  en: When a ray of light enters water it bends a little. A scholar in Baghdad named
    Ibn Sahl worked out the exact mathematical rule for that bending a thousand years
    ago, and used it to design lenses that gather sunlight into one hot point. Today
    every pair of glasses and every camera lens uses the same rule.
  ur: جب روشنی کی کرن پانی میں داخل ہوتی ہے تو وہ تھوڑی جھک جاتی ہے۔ بغداد کے ایک
    عالم ابن سہل نے ہزار سال پہلے اس جھکاؤ کا درست ریاضیاتی قاعدہ دریافت کیا اور ایسے
    عدسے بنائے جن سے سورج کی روشنی ایک گرم نقطے میں جمع ہوتی۔ آج ہر عینک اور کیمرا
    عدسہ اسی قاعدے پر چلتا ہے۔
