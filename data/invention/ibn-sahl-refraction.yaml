attribution:
  status: original
  claim:
    ar: نص باقٍ باسمه يضع النسبة الثابتة للانكسار ويطبقها على تصميم عدسات كاسرة؛ الأسبقية
      موثقة بالمخطوط لا بدعوى تراث.
    en: A surviving treatise in his name states the constant refraction ratio and
      applies it to lens design; the priority is documented by the manuscript, not
      by a tradition claim.
    ur: اس کے نام سے بچا ہوا متن انعطاف کی ثابت نسبت بیان کرتا ہے اور اسے عدسہ سازی
      پر لاگو کرتا ہے؛ اولیت مخطوطہ سے موثق ہے، روایتی دعوے سے نہیں۔
  basis:
    ar: مخطوطا دمشق الظاهرية 4871 وطهران الملي 867 يحملان رسالته في المرايا والعدسات
      المحرقة، والطبعة الراشدية ⁦(1993)⁩ تنشر البرهان الهندسي؛ وأكاديميون ⁦(عبر مقالة
      ويكيبيديا المسجلة)⁩ يصفونه باكتشاف قانون الانكسار {cite:rashed-geometrie-dioptrique-1993}
      {cite:wikipedia-ibn-sahl-en}.
    en: The Damascus al-Zahiriyya MS 4871 and Tehran Milli MS 867 carry his treatise
      on burning mirrors and lenses, and Rashed's edition (1993) publishes the geometrical
      proof; scholars (per the recorded Wikipedia article) describe him as discoverer
      of the law of refraction {cite:rashed-geometrie-dioptrique-1993} {cite:wikipedia-ibn-sahl-en}.
    ur: دمشق کی ظاہریہ مخطوطہ 4871 اور تہران کی ملی مخطوطہ 867 میں جلانے والے آئینوں
      اور عدسوں پر اس کی رسالہ محفوظ ہے اور راشد کی اشاعت ⁦(1993)⁩ ہندسی برہان شائع
      کرتی ہے؛ ماہرین ⁦(درج شدہ ویکیپیڈیا مضمون کے مطابق)⁩ اسے قانونِ انعطاف کا دریافت
      کنندہ قرار دیتے ہیں {cite:rashed-geometrie-dioptrique-1993} {cite:wikipedia-ibn-sahl-en}.
