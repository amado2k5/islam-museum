- kind: alternate
  lang: ar
  value: الأفلاك الخارجة عن مركز الأرض عند الفرغاني
summary:
  ar: يشرح الفرغاني في فصول المقادير أن الشمس لها فلك واحد خارج المركز بُعد مركزه عن مركز الأرض جزءان ونصف من ستين جزءاً هي
    نصف قطره، وأن للكواكب الخمسة المتحيرة مركزين خارجين عن مركز الأرض على خط مستقيم مع مركزها، ولعطارد مركزاً ثالثاً متحركاً،
    وللقمر مركزين أحدهما ثابت والآخر متحرك {cite:farghani-elements-astronomy p. 66}{cite:farghani-elements-astronomy p. 84}.
  en: In the chapters on dimensions al-Farghani explains that the Sun has one eccentric orb whose centre lies two and a half
    parts off the Earth's centre when the orb's radius is sixty parts, that the five planets each have two centres off the
    Earth's centre on a straight line through it, that Mercury has a third moving centre, and that the Moon has two centres,
    one fixed and one moving {cite:farghani-elements-astronomy p. 66}{cite:farghani-elements-astronomy p. 84}.
  ur: ابعاد کے ابواب میں فرغانی بیان کرتے ہیں کہ سورج کا ایک خارجِمرکزی دائرہ ہے جس کا مرکز زمین کے مرکز سے ڈھائی حصے دور
    ہے جب دائرے کا نصف قطر ساٹھ حصے ہے، پانچ سیاروں کے دو مرکز زمین کے مرکز سے ہٹ کر ایک سیدھی لکیر پر ہیں، عطارد کا تیسرا
    متحرک مرکز ہے، اور چاند کے دو مرکز ہیں ایک ساکن ایک متحرک {cite:farghani-elements-astronomy p. 66}{cite:farghani-elements-astronomy
    p. 84}۔
  es: "En los capítulos sobre dimensiones, al-Farghani explica que el Sol tiene un orbe excéntrico cuyo centro se encuentra a dos partes y media del centro de la Tierra cuando el radio del orbe es de sesenta partes, que los cinco planetas tienen cada uno dos centros fuera del centro de la Tierra en una línea recta que la atraviesa, que Mercurio tiene un tercer centro móvil y que la Luna tiene dos centros, uno fijo y otro móvil {cite:farghani-elements-astronomy p. 66}{cite:farghani-elements-astronomy p. 84}."
  fr: "Dans les chapitres sur les dimensions, al-Farghani explique que le Soleil possède une orbite excentrique dont le centre se situe à deux parties et demie du centre de la Terre lorsque le rayon de l'orbite est de soixante parties, que les cinq planètes ont chacune deux centres situés sur une ligne droite passant par le centre de la Terre, que Mercure possède un troisième centre mobile et que la Lune possède deux centres, l'un fixe et l'autre mobile {cite:farghani-elements-astronomy p. 66}{cite:farghani-elements-astronomy p. 84}."
  tr: "Al-Farghani, nicelikler hakkındaki bölümlerde, Güneş'in, merkezi Dünya'nın merkezinden altmış parçanın iki buçuk parçası uzaklıkta olan, yani yarıçapı kadar mesafede bulunan bir dışmerkezli küresi olduğunu; beş gezegenin, Dünya'nın merkezinden uzak, merkezle aynı doğrultuda bulunan iki dışmerkezli merkezi olduğunu; Merkür'ün üçüncü bir hareketli merkezi olduğunu ve Ay'ın ise biri sabit diğeri hareketli olmak üzere iki merkezi olduğunu açıklamaktadır. {cite:farghani-elements-astronomy s. 66}{cite:farghani-elements-astronomy s. 84}."
  id: "Al-Farghani menjelaskan dalam bab-bab tentang besaran bahwa matahari memiliki satu bola ektosentris yang pusatnya berjarak dua setengah bagian dari enam puluh bagian dari pusat bumi, yang merupakan jari-jarinya, dan bahwa lima planet pengembara memiliki dua pusat ektosentris yang berjarak dari pusat bumi pada garis lurus dengan pusatnya, dan Merkurius memiliki pusat ketiga yang bergerak, dan bulan memiliki dua pusat, satu tetap dan yang lainnya bergerak. {cite:farghani-elements-astronomy p. 66}{cite:farghani-elements-astronomy p. 84}."
