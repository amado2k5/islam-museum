attribution:
  status: transmission
  claim:
    ar: نقل بنية الأفلاك الخارجة عن مركز الأرض إلى العربية مع مقاديرها، لا اختراع الدائرة التي مركزها غير مركز الأرض.
    en: Transmission into Arabic of the off-centre orb structure with its parameters, not the invention of the circle whose
      centre is not the Earth's.
    ur: زمین کے مرکز سے ہٹ کر دائرے کی ساخت اور اس کے پیرامیٹرز کا عربی میں انتقال، زمین کے مرکز سے غیر مطابق دائرے کی ایجاد
      نہیں۔
  basis:
    ar: يشرح الفصل السادس عشر أن الشمس لها فلكاً واحداً خارج المركز وبُعد مركزه جزءان ونصف من ستين، ويشرح الفصل اللاحق الأوج
      والحضيض ودائرة الفلك الخارج {cite:farghani-elements-astronomy p. 66}{cite:farghani-elements-astronomy p. 84}.
    en: Chapter sixteen explains that the Sun has one eccentric orb with its centre two and a half parts off out of sixty,
      and a later chapter treats apogee, perigee and the deferent circle {cite:farghani-elements-astronomy p. 66}{cite:farghani-elements-astronomy
      p. 84}.
    ur: باب سولہ میں بیان ہے کہ سورج کا ایک خارجِمرکزی دائرہ ہے اور اس کا مرکز ساٹھ میں سے ڈھائی حصے دور ہے، اور بعد کا باب
      اوج، حضیض اور خارجِمرکزی دائرے کا بیان کرتا ہے {cite:farghani-elements-astronomy p. 66}{cite:farghani-elements-astronomy
      p. 84}۔
