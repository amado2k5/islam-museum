      ur: "عطا اللہ کا حرارتی آکسیڈیشن سے سطحی تخمیل"
    note: "Atalla's earlier process rendered the silicon surface inert and solved the surface-state problem that had blocked the field-effect device — the direct technical precursor of the MOSFET."
