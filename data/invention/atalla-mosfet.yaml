  context:
    ar: "مختبرات بِل الهاتفية في موراي هيل بنيوجيرسي، حيث قاد عطا الله — مهندس ميكانيكا مصري تعلّم الكيمياء الفيزيائية بنفسه — فريقاً صغيراً من المجندين الجدد ⁦(إيلين تانينباوم وإدوين شيبنر وداون كانغ)⁩ لم تأخذه إدارة المختبر على محمل الجد، فحلّ الفريق مشكلة حالات سطح السيليكون بالتخميل الحراري ثم صنع الجهاز {cite:wikipedia-mohamed-atalla-en}."
    en: "Bell Telephone Laboratories at Murray Hill, New Jersey, where Atalla — an Egyptian mechanical engineer who taught himself physical chemistry — led a small team of new recruits ⁦(Eileen Tannenbaum, Edwin Scheibner and Dawon Kahng)⁩ that senior management did not take seriously; the team solved the silicon surface-state problem by thermal passivation, then built the device {cite:wikipedia-mohamed-atalla-en}."
    ur: "نیو جرسی میں مورے ہل کی بیل ٹیلیفون لیبارٹریز، جہاں عطا اللہ — ایک مصری میکینیکل انجینئر جس نے خود طبیعیاتی کیمیا سیکھی — نئے بھرتے کیے ہوئے محققین ⁦(ایلین ٹیننبام، ایڈون شائبنر اور داون کانگ)⁩ کی چھوٹی ٹیم کے قائد تھے جنہیں انتظامیہ نے سنجیدگی سے نہیں لیا؛ ٹیم نے حرارتی تخمیل سے سلیکون کی سطحی حالتوں کا مسئلہ حل کیا، پھر آلہ بنایا {cite:wikipedia-mohamed-atalla-en}۔"
