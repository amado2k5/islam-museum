dependents:
  - external:
      ar: "الدارات المتكاملة موس ومنطق CMOS"
      en: "MOS integrated circuits and CMOS logic"
      ur: "موس انٹیگریٹڈ سرکٹ اور CMOS منطق"
    note: "Atalla and Kahng proposed the MOS integrated circuit in 1960; complementary pairs of MOS transistors became CMOS switching logic, the low-power basis of modern chips."
