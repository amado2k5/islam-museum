impact:
  fields: [modern-technology]
  changed:
    ar: "وضع مفتاحاً إلكترونياً أصغر وأرخص وأقل استهلاكاً للطاقة في كل جهاز: حواسيب وهواتف وأقمار اصطناعية، بمليارات الترانزستورات في الشريحة الواحدة، حتى صار أعلى الأجهزة تصنيعاً في تاريخ البشر {cite:wikipedia-mosfet-en} {cite:wikipedia-mohamed-atalla-en}."
    en: "It put a smaller, cheaper, lower-power electronic switch inside every device — computers, phones, satellites — billions of transistors on a single chip, until it became the most-fabricated device in human history {cite:wikipedia-mosfet-en} {cite:wikipedia-mohamed-atalla-en}."
    ur: "اس نے ہر آلہ میں ایک چھوٹا، سستا اور کم بجلی والا برقی سوئچ رکھ دیا — کمپیوٹر، فون، سیارچے — ایک چپ میں اربوں ٹرانزسٹر، یہاں تک کہ یہ انسانی تاریخ میں سب سے زیادہ تیار شدہ آلہ بن گیا {cite:wikipedia-mosfet-en} {cite:wikipedia-mohamed-atalla-en}۔"
  history:
    ar: "أطلق ثورة السيليكون والعصر الرقمي: إلكترونيات حديثة قامت على شريحة أحادية الليثية، وقانون مور صار ممكناً بتصغير الترانزستور الواحد بلا توقف {cite:wikipedia-mohamed-atalla-en} {cite:wikipedia-mosfet-en}."
    en: "It launched the silicon revolution and the digital age: modern electronics built on the monolithic chip, Moore's Law made possible by shrinking the same transistor without end {cite:wikipedia-mohamed-atalla-en} {cite:wikipedia-mosfet-en}."
    ur: "اس نے سلیکون انقلاب اور برقی دور کا آغاز کیا: ایک ہی پتھر کی چپ پر جدید الیکٹرانکس، اور مور کا قانون اسی ٹرانزسٹر کے مسلسل چھوٹے ہونے سے ممکن ہوا {cite:wikipedia-mohamed-atalla-en} {cite:wikipedia-mosfet-en}۔"
  significance: 5
  why: "The most-fabricated device in human history and the working element of nearly all modern electronics — a documented 1959 invention by an Egyptian-born engineer and his Korean colleague at Bell Labs, honoured by the IEEE as a milestone."
