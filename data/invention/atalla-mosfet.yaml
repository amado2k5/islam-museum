summary:
  ar: "أول ترانزستور أثر حقلي بأكسيد معدني شبه موصل عامل، صنعه محمد عطا الله وداون كانغ في مختبرات بِل بموراي هيل عام 1959 مبنياً على عمل عطا الله السابق في التخميل السطحي والأكسدة الحرارية للسيليكون — ترانزستور ببوابة معزولة يتحكم الجهد في ناقليته، فصار أكثر أنواع الترانزستورات شيوعاً وأكثر الأجهزة تصنيعاً في التاريخ، بمليارات النسخ في كل شريحة حاسوب وهاتف، وأساس منطق CMOS منخفض الاستهلاك {cite:wikipedia-mosfet-en} {cite:wikipedia-mohamed-atalla-en}."
  en: "The first working metal-oxide-semiconductor field-effect transistor, built by Mohamed Atalla and Dawon Kahng at Bell Labs in Murray Hill in 1959 on Atalla's earlier surface-passivation and thermal-oxidation work on silicon — an insulated-gate transistor whose conductivity is set by voltage, which became the most common type of transistor and the most-fabricated device in history, with billions inside every computer chip and phone and low-power CMOS logic built on it {cite:wikipedia-mosfet-en} {cite:wikipedia-mohamed-atalla-en}."
  ur: "پہلا کام کرنے والا دھاتی آکسائیڈ نیم موصل فیلڈ ایفیکٹ ٹرانزسٹر، جو محمد عطا اللہ اور داون کانگ نے 1959 میں مورے ہل کی بیل لیبز میں بنایا، عطا اللہ کے سابقہ سطحی تخمیل اور حرارتی آکسیڈیشن کے کام پر — ایک موصلیت شدہ گیٹ ٹرانزسٹر جس کی چالکتا وولٹیج سے طے ہوتی ہے، جو ہر قسم کے ٹرانزسٹر میں سب سے عام اور تاریخ میں سب سے زیادہ تیار شدہ آلہ بنا، ہر کمپیوٹر چپ اور فون میں اربوں کی تعداد میں، اور کم بجلی والی CMOS منطق اسی پر قائم ہے {cite:wikipedia-mosfet-en} {cite:wikipedia-mohamed-atalla-en}۔"
  es: "El primer transistor de efecto de campo de óxido metálico-semiconductor funcional, construido por Mohamed Atalla y Dawon Kahng en los Laboratorios Bell en Murray Hill en 1959 sobre el trabajo previo de Atalla sobre pasivación de superficie y oxidación térmica en silicio, un transistor de puerta aislada cuya conductividad se establece mediante voltaje, que se convirtió en el tipo de transistor más común y el dispositivo más fabricado de la historia, con miles de millones dentro de cada chip de computadora y teléfono y lógica CMOS de bajo consumo construida sobre él {cite:wikipedia-mosfet-en} {cite:wikipedia-mohamed-atalla-en}."
  fr: "Le premier transistor à effet de champ métal-oxyde-semiconducteur fonctionnel, construit par Mohamed Atalla et Dawon Kahng aux Bell Labs de Murray Hill en 1959 sur la passivation de surface et l'oxydation thermique antérieures d'Atalla sur le silicium — un transistor à grille isolée dont la conductivité est déterminée par la tension, est devenu le type de transistor le plus courant et le dispositif le plus fabriqué de l'histoire, avec des milliards d'exemplaires dans chaque puce d'ordinateur et téléphone et la logique CMOS basse consommation construite dessus {cite:wikipedia-mosfet-en} {cite:wikipedia-mohamed-atalla-en}."
  tr: "Mohamed Atalla ve Dawn Kang tarafından 1959'da Murray Hill'deki Bell Laboratuvarlarında, Atalla'nın silikonun yüzey pasivasyonu ve termal oksidasyonu üzerine yaptığı önceki çalışmalara dayanarak üretilen ilk çalışan metal oksit yarı iletken alan etkili transistör (MOSFET) -iletkenliği voltajla kontrol edilen yalıtımlı kapılı bir transistör-, tarihteki en yaygın transistör türü ve en çok üretilen cihaz haline geldi; her bilgisayar ve telefon çipinde milyarlarca kopyası bulunuyor ve düşük güç tüketimli CMOS mantığının temelini oluşturuyor."
  id: "Transistor efek medan semikonduktor oksida logam (MOSFET) pertama yang berfungsi, dibuat oleh Mohamed Atalla dan Dawn Kang di Bell Laboratories di Murray Hill pada tahun 1959, berdasarkan karya Atalla sebelumnya tentang pasivasi permukaan dan oksidasi termal silikon — sebuah transistor gerbang terisolasi yang konduktivitasnya dikendalikan oleh tegangan, menjadi jenis transistor yang paling umum dan perangkat yang paling banyak diproduksi dalam sejarah, dengan miliaran salinan di setiap chip komputer dan telepon, dan menjadi dasar logika CMOS berdaya rendah."
