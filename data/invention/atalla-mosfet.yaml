kids:
  ar: "في عام 1959 صنع مهندس مصري اسمه محمد عطا الله وزميله الكوري داون كانغ مفتاحاً إلكترونياً لا يُرى بالعين. هذا المفتاح الصغير اسمه موسفت، وهو اليوم في كل هاتف وحاسوب وسيارة ولعبة — بالمليارات! فهو أكثر شيء صنعه البشر في التاريخ كله."
  en: "In 1959 an Egyptian engineer named Mohamed Atalla and his Korean colleague Dawon Kahng built an electronic switch too small to see. That little switch is called the MOSFET, and today it is inside every phone, computer, car and game — by the billion. It is the most-made thing in all of history."
  ur: "1959 میں محمد عطا اللہ نامی مصری انجینئر اور ان کے کوریائی ساتھی داون کانگ نے ایک ایسا برقی سوئچ بنایا جو آنکھ سے نہیں دکھتا۔ اس چھوٹے سوئچ کا نام موسفیٹ ہے، اور آج یہ ہر فون، کمپیوٹر، گاڑی اور گیم میں ہے — اربوں کی تعداد میں! یہ تاریخ میں سب سے زیادہ بنائی گئی چیز ہے۔"
