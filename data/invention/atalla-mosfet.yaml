attribution:
  status: original
  claim:
    ar: "ينسب التاريخ الموثق إلى عطا الله وكانغ معاً صنع أول موسفت عامل في مختبرات بِل عام 1959؛ فليلينفلد اقترح مبدأ الترانزستور الحقلي عام 1925 دون جهاز عامل، والابتكار الموثق هو الجهاز السيليكوني العملي وأسلوب صنعه {cite:wikipedia-mosfet-en} {cite:wikipedia-mohamed-atalla-en}."
    en: "The documented record credits Atalla and Kahng together with the first working MOSFET at Bell Labs in 1959; Lilienfeld had proposed the field-effect principle in 1925 without a working device, and the documented creation is the practical silicon device and its fabrication method {cite:wikipedia-mosfet-en} {cite:wikipedia-mohamed-atalla-en}."
    ur: "مستند تاریخ عطا اللہ اور کانگ کو مل کر 1959 میں بیل لیبز میں پہلا کام کرنے والا موسفیٹ بنانے کا سہرا دیتی ہے؛ لیلینفلڈ نے 1925 میں فیلڈ ایفیکٹ کا اصول تجویز کیا تھا مگر کوئی عملی آلہ نہیں تھا، اور مستند نیا کام عملی سلیکون آلہ اور اس کی تیاری کا طریقہ ہے {cite:wikipedia-mosfet-en} {cite:wikipedia-mohamed-atalla-en}۔"
  basis:
    ar: "تجمع المراجعة المسجلة لمقالة موسفت وسيرة عطا الله وسيرة كانغ على اختراعهما المشترك في 1959 بعد عمل التخميل السطحي، وأُدرج الاختراع في معالم IEEE عام 2014، ودخل الرجلان قاعة مشاهير المخترعين الوطنيين {cite:wikipedia-mosfet-en} {cite:wikipedia-mohamed-atalla-en} {cite:wikipedia-dawon-kahng-en}."
    en: "The recorded MOSFET revision and the Atalla and Kahng biographies agree on the joint 1959 invention following the surface-passivation work; the invention was listed as an IEEE milestone in 2014 and both men entered the National Inventors Hall of Fame {cite:wikipedia-mosfet-en} {cite:wikipedia-mohamed-atalla-en} {cite:wikipedia-dawon-kahng-en}."
    ur: "موسفیٹ کی محفوظ نظرثانی اور عطا اللہ و کانگ کی سوانحیں تینوں 1959 کی مشترک ایجاد پر متفق ہیں جو سطحی تخمیل کے کام کے بعد آئی؛ ایجاد 2014 میں IEEE کی میل پتھروں میں شامل ہوئی اور دونوں قومی ایجاد کنندگان ہال آف فیم میں داخل ہوئے {cite:wikipedia-mosfet-en} {cite:wikipedia-mohamed-atalla-en} {cite:wikipedia-dawon-kahng-en}۔"
