    note: "Julius Edgar Lilienfeld proposed the field-effect transistor in 1925, but no working device could be constructed then; the concept waited for Atalla's surface treatment."
    sources: [source/wikipedia-mosfet-en]
  - external:
      ar: "التخميل السطحي بالأكسدة الحرارية عند عطا الله"
