today:
  form:
    ar: "يعمل اليوم في كل معالج وذاكرة وشاشة تقريباً؛ وهو معلم IEEE مُسجَّل، ومازال التصغير يواصل تقليد موسفت في الدارات المتقدمة {cite:wikipedia-mosfet-en}."
    en: "It runs today inside nearly every processor, memory and display; the 1959 invention is a registered IEEE milestone, and advanced circuits still shrink the same MOSFET design {cite:wikipedia-mosfet-en}."
    ur: "یہ آج تقریباً ہر پروسیسر، میموری اور اسکرین میں کام کرتا ہے؛ 1959 کی ایجاد IEEE کی درج شدہ میل پتھر ہے، اور جدید سرکٹ ابھی بھی اسی موسفیٹ کو چھوٹا کرتے ہیں {cite:wikipedia-mosfet-en}۔"
  descendants:
    ar: "منه ولدت عائلة كاملة: CMOS وموسفت القوة والبوابة العائمة والفنفيتات الحديثة — كلها وريث تصميم 1959 {cite:wikipedia-mosfet-en} {cite:wikipedia-dawon-kahng-en}."
    en: "A whole family descends from it: CMOS, power MOSFETs, the floating-gate cell and today's FinFETs — all heirs of the 1959 design {cite:wikipedia-mosfet-en} {cite:wikipedia-dawon-kahng-en}."
    ur: "اسی سے پوری نسل پیدا ہوئی: CMOS، پاور موسفیٹ، فلوٹنگ گیٹ سیل اور آج کے FinFET — سب 1959 کے ڈیزائن کے وارث {cite:wikipedia-mosfet-en} {cite:wikipedia-dawon-kahng-en}۔"
