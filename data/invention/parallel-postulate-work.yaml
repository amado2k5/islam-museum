attribution:
  status: improvement
  claim:
    ar: 'ليس اختراعاً لمسألة المتوازيات — كانت معروفة من بروكلس وبطليموس — بل سلسلة
      تحليلات أصيلة: برهنة أو استبدال المسلمة، وإنتاج أدواتها الهندسية الخاصة ⁦(شبه
      المنحرفان)⁩ قبل نظيراتها الأوروبية بقرون {cite:wikipedia-parallel-postulate-en}.'
    en: 'Not the invention of the parallel problem — it was known since Proclus and
      Ptolemy — but a sequence of original analyses: proving or replacing the postulate
      and producing its own geometrical tools (the two quadrilaterals) centuries before
      their European namesakes {cite:wikipedia-parallel-postulate-en}.'
    ur: 'متوازی مسئلے کی ایجاد نہیں — وہ بروکلس اور بطلموس سے معلوم تھا — بلکہ اصیل
      تجزیوں کا سلسلہ: مسلمہ ثابت یا بدلنا اور اس کے اپنے ہندسی اوزار ⁦(دونوں چوکوریں)⁩
      یورپی ہم ناموں سے صدیوں پہلے تیار کرنا {cite:wikipedia-parallel-postulate-en}۔'
  basis:
    ar: تسجل المراجعة أن ابن الهيثم أدخل الحركة وشبه منحرفه، وأن الخيام أقصى بمسلمته
      الحالة الزائدية والطوسي أقصى الزائدية والإهليجية، وأن نص 1298 المطبوع بروما
      1594 صار نقطة انطلاق ساكيري {cite:wikipedia-parallel-postulate-en} {cite:rosenfeld-youschkevitch-geometry-1996}
      {cite:katz-history-mathematics-1998}.
    en: The recorded revision states Ibn al-Haytham introduced motion and his quadrilateral,
      that Khayyam's postulate excluded the hyperbolic case and al-Tusi's excluded
      both hyperbolic and elliptic, and that the 1298 text printed at Rome in 1594
      became Saccheri's starting point {cite:wikipedia-parallel-postulate-en} {cite:rosenfeld-youschkevitch-geometry-1996}
      {cite:katz-history-mathematics-1998}.
    ur: محفوظ ریویژن لکھتی ہے کہ ابن الھیثم نے حرکت اور اپنی چوکور متعارف کرائی، خیام
      کے مسلمہ نے ہائپربولی صورت خارج کی اور طوسی کے مسلمہ نے دونوں صورتیں، اور 1298ء
      کا متن روم میں 1594ء میں چھپ کر ساکیری کی بنیاد بنا {cite:wikipedia-parallel-postulate-en}
      {cite:rosenfeld-youschkevitch-geometry-1996} {cite:katz-history-mathematics-1998}۔
