kids:
  ar: قاعدة إقليدس تقول إن خطين متوازيين لا يلتقيان أبداً. ظلّ العلماء قروناً يحاولون
    إثباتها بدل قبولها. جرّب ابن الهيثم والخيام والطوسي طرقاً ذكية، وأشكالهم التي
    رسموها — قطعة تسمى شبه المنحرف — استعملها الأوروبيون بعدهم بمئات السنين.
  en: Euclid's rule says two parallel lines never meet. Scholars spent centuries trying
    to prove it instead of accepting it. Ibn al-Haytham, Khayyam and al-Tusi tried
    clever ways, and the shapes they drew — a piece called a quadrilateral — were
    used by Europeans hundreds of years later.
  ur: اقلیدس کا اصول کہتا ہے دو متوازی لکیریں کبھی نہیں ملتیں۔ علماء صدیوں اسے ماننے
    کے بجائے ثابت کرنے کی کوشش کرتے رہے۔ ابن الھیثم، خیام اور طوسی نے ہوشیار طریقے
    آزمائے، اور ان کی بنائی شکلیں — چوکور نامی ٹکڑا — صدیوں بعد یورپیوں نے استعمال
    کیں۔
