summary:
  ar: 'برنامج نقدي متواصل أربعة قرون حول مسلمة أقليدس الخامسة: حاول ابن الهيثم ⁦(965–1039)⁩
    برهانها بالخلف مُدخلاً الحركة في الهندسة وشيّداً شبه منحرف ابن الهيثم-لامبرت؛
    واستبدل بها عمر الخيام ⁦(ت 1123)⁩ مسلمة صريحة عن الخطين المتقاربين ودرس الشبه
    منحرف الذي سُمّي لاحقاً شبه منحرف الخيام-ساكيري؛ وكتب نصير الدين الطوسي رسالته
    الشافية ⁦(1250)⁩ ناقداً محاولته، ثم جدّد صدر الدين ⁦(1298)⁩ المنظومة في نص طُبع
    بروما 1594 فكان نقطة انطلاق ساكيري نحو الهندسة اللا أقليدية {cite:wikipedia-parallel-postulate-en}
    {cite:rosenfeld-youschkevitch-geometry-1996} {cite:katz-history-mathematics-1998}.'
  en: 'A four-century critical programme around Euclid''s fifth postulate: Ibn al-Haytham
    (965-1039) attempted a proof by contradiction, introducing motion into geometry
    and building the Ibn al-Haytham-Lambert quadrilateral; Umar Khayyam (d. 1123)
    replaced the postulate with an explicit axiom on convergent lines and studied
    the quadrilateral later named for him and Saccheri; Nasir al-Din al-Tusi''s 1250
    Discussion Which Removes Doubt criticised Khayyam''s attempt, and Sadr al-Din''s
    1298 recasting, printed at Rome in 1594, became Saccheri''s starting point toward
    non-Euclidean geometry {cite:wikipedia-parallel-postulate-en} {cite:rosenfeld-youschkevitch-geometry-1996}
    {cite:katz-history-mathematics-1998}.'
  ur: 'اقلیدس کے پانچویں مسلمہ کے گرد چار صدیوں کا تنقیدی پروگرام: ابن الھیثم ⁦(965–1039)⁩
    نے خلف سے برہان کی کوشش کی اور ہندسہ میں حرکت داخل کی اور ابن الھیثم-لامبرت چوکور
    بنایا؛ عمر خیام ⁦(1123ء)⁩ نے متقارب خطوط پر ایک صریح مسلمہ بدلی اور بعد میں خیام-ساکیری
    کہلائی جانے والی چوکور پر بحث کی؛ نصیر الدین طوسی کی رسالۂ شافیہ ⁦(1250)⁩ نے خیام
    کی کوشش پر تنقید کی، اور صدر الدین کی 1298ء کی تلخیص روم میں 1594ء میں چھپی اور
    ساکیری کی نقطۂ آغاز بنی تا غیر اقلیدسی ہندسہ {cite:wikipedia-parallel-postulate-en}
    {cite:rosenfeld-youschkevitch-geometry-1996} {cite:katz-history-mathematics-1998}۔'
