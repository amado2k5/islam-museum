today:
  form:
    ar: 'يُقرأ العمل اليوم فصلاً تأسيسياً في تاريخ الهندسة اللا أقليدية: تعيد كتب
      تاريخ الرياضيات عرضه قبل ساكيري ولامبرت ولوباتشفسكي {cite:wikipedia-parallel-postulate-en}
      {cite:katz-history-mathematics-1998}.'
    en: 'The work is read today as a foundational chapter in the prehistory of non-Euclidean
      geometry: histories of mathematics present it before Saccheri, Lambert and Lobachevsky
      {cite:wikipedia-parallel-postulate-en} {cite:katz-history-mathematics-1998}.'
    ur: 'آج یہ کام غیر اقلیدسی ہندسے کی پس منظر کا بنیادی باب پڑھا جاتا ہے: تاریخِ
      ریاضی کی کتابیں اسے ساکیری، لامبرت اور لوباچفسکی سے پہلے پیش کرتی ہیں {cite:wikipedia-parallel-postulate-en}
      {cite:katz-history-mathematics-1998}۔'
  descendants:
    ar: خلفته فكرة الهندسات المتعددة المتماسكة منطقياً — البيضاوية والزائدية — التي
      صارت أساس هندسة الزمكان {cite:wikipedia-parallel-postulate-en}.
    en: Its descendant is the idea of multiple logically consistent geometries — elliptic
      and hyperbolic — which became the geometry of spacetime {cite:wikipedia-parallel-postulate-en}.
    ur: اس کی اولاد متعدد منطقاً متسق ہندسوں کا تصور ہے — بیضوی اور ہائپربولی — جو
      فضائے زمانی کی ہندسہ بنے {cite:wikipedia-parallel-postulate-en}۔
