origin:
  place: place/baghdad
  context:
    ar: 'نشأ البرنامج حيث كانت «العناصر» تُقرأ وتُشرح — بغداد وبصرة ابن الهيثم ثم
      خراسان الخيام ثم مراغة الطوسي: علماء رأوا أن المسلمة الخامسة ليست بديهية كغيرها
      فسعوا لإثباتها أو استبدالها {cite:wikipedia-parallel-postulate-en}.'
    en: 'The programme grew where the Elements was read and commented — Ibn al-Haytham''s
      Baghdad and Basra, then Khayyam''s Khurasan, then al-Tusi''s Maragha: scholars
      who saw the fifth postulate as less self-evident than the rest tried to prove
      or replace it {cite:wikipedia-parallel-postulate-en}.'
    ur: 'یہ پروگرام وہاں بڑھا جہاں «عناصر» پڑھی اور شرح کی جاتی — ابن الھیثم کا بغداد
      و بصرہ، پھر خیام کا خراسان، پھر طوسی کا مراغہ: علماء جنہوں نے پانچویں مسلمہ
      کو باقیوں جتنا بديھی نہیں پایا اور اسے ثابت یا بدلنے کی کوشش کی {cite:wikipedia-parallel-postulate-en}۔'
