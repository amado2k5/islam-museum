impact:
  fields:
  - mathematics
  changed:
    ar: 'حوّل البرنامج نقد المسلمات إلى منهج: ميّز الزوايا الثلاث ⁦(القائمة والحادة
      والمنفرجة)⁩ كفرضيات قابلة للفحص، وأنتج شبهي المنحرف اللذين صارا أداتي التحليل
      المعياريين لدى الأوروبيين {cite:wikipedia-parallel-postulate-en}.'
    en: 'The programme turned axiomatic criticism into a method: it separated the
      three summit-angle cases (right, acute, obtuse) as testable hypotheses and produced
      the two quadrilaterals that became Europeans'' standard analytic tools {cite:wikipedia-parallel-postulate-en}.'
    ur: 'اس پروگرام نے مسلمات کی تنقید کو منہج بنایا: تین زاویوں ⁦(قائمہ، حاد، منفرجہ)⁩
      کو آزمائشی مفروضوں میں بانٹا اور وہ دو چوکوریں پیدا کیں جو یورپیوں کے معیاری
      تجزیاتی اوزار بنیں {cite:wikipedia-parallel-postulate-en}۔'
  history:
    ar: من رسالة ابن الهيثم إلى شرح الخيام فرسالة الطوسي الشافية ⁦(1250)⁩ فنص صدر
      الدين ⁦(1298، روما 1594)⁩ مدّ البرنامج خطاً مستمراً إلى ساكيري وفيتالي ولامبرت
      ثم إلى إعلان الاستقلال عند بلترامي ⁦(1868)⁩ {cite:wikipedia-parallel-postulate-en}
      {cite:katz-history-mathematics-1998}.
    en: From Ibn al-Haytham's treatise through Khayyam's Explanations and al-Tusi's
      1250 Discussion to Sadr al-Din's 1298 text (Rome 1594), the programme ran a
      continuous line to Saccheri, Vitale and Lambert, and on to Beltrami's independence
      proof (1868) {cite:wikipedia-parallel-postulate-en} {cite:katz-history-mathematics-1998}.
    ur: ابن الھیثم کی رسالہ سے خیام کی شرح اور طوسی کی 1250ء بحث سے صدر الدین کے 1298ء
      متن ⁦(روم 1594ء)⁩ تک پروگرام ساکیری، ویتالی اور لامبرت تک مسلسل رہا اور بلترامی
      کے اثباتِ آزادی ⁦(1868ء)⁩ تک {cite:wikipedia-parallel-postulate-en} {cite:katz-history-mathematics-1998}۔
  significance: 4
  why: Four centuries of original work on the hardest foundational problem in classical
    geometry — quadrilaterals and case analyses that Europeans later rediscovered
    under Saccheri's and Lambert's names, and a documented text printed at Rome in
    1594 on Saccheri's desk.
