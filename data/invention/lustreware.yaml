today:
  form:
    ar: تعرض أعظم القطع في متاحف العالم؛ والتقنية نفسها ما زالت حية في أتونات الخزافين
      من فالنسيا إلى إيران {cite:lane-early-islamic-pottery-1947}.
    en: The finest pieces hang in the world's museums; the technique itself still
      lives in potters' kilns from Valencia to Iran {cite:lane-early-islamic-pottery-1947}.
    ur: بہترین نمونے دنیا کے عجائب گھروں میں ہیں؛ اور یہی فن ویلنشیا سے ایران تک سفالکاروں
      کے بھٹیوں میں زندہ ہے {cite:lane-early-islamic-pottery-1947}.
  descendants:
    ar: المايولكا الإيطالية والهيسپانو-مورسك وكل خزف لامع لاحق يقف على سلسلة الأتون
      المختزِل التي بدأت في مصر وبغداد {cite:lane-early-islamic-pottery-1947}.
    en: Italian maiolica, Hispano-Moresque and every later lustred ceramic stands
      on the reducing-kiln chain that began in Egypt and Baghdad {cite:lane-early-islamic-pottery-1947}.
    ur: اطالوی مایولکا، ہسپانو-موریسک اور ہر بعد کا لستر خزف اسی کم ہوا والے بھٹی
      کی زنجیر پر کھڑا ہے جو مصر اور بغداد سے شروع ہوئی {cite:lane-early-islamic-pottery-1947}.
