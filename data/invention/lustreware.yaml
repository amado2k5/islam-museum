label:
  ar: الخزف المطلي باللمعة المعدنية ⁦(اللستر)⁩
  en: Lustre-painted pottery under Muslim potters
  ur: دھاتی جھلک ⁦(لستر)⁩ والا مسلمان سفالکاروں کا خزف
  es: "Cerámica pintada con lustre bajo alfareros musulmanes"
  fr: "Poteries à décor lustré sous des potiers musulmans"
  tr: "Metalik sırlı seramikler (liste)"
  id: "Keramik berlapis glasir metalik (lister)"
