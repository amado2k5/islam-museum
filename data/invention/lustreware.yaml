summary:
  ar: تقنية تُدهن بها صبغة من أكاسيد الفضة والنحاس على زجاج أو خزف مزجج ثم تُحرق ثانية
    في أتون مُختزِل فتترسب رقائق معدنية لامعة على السطح؛ ظهرت على الزجاج في مصر الإسلامية
    المبكرة ثم نقلها خزّافو بغداد إلى الفخار في سامراء ⁦(القرن التاسع)⁩، وأرسلت بلاطاتها
    مع خزاف بغدادي إلى جامع القيروان نحو 862م {cite:lane-early-islamic-pottery-1947
    scan pp. 26-28}.
  en: A technique in which a pigment of silver and copper oxides is painted onto glass
    or glazed pottery and fired a second time in a reducing kiln, depositing a glittering
    metallic film on the surface; it appeared on glass in early Islamic Egypt, then
    Baghdad potters carried it to pottery at Samarra in the ninth century, and its
    tiles were sent with a Baghdad potter to the Great Mosque of Kairouan about 862
    {cite:lane-early-islamic-pottery-1947 scan pp. 26-28}.
  ur: ایک فن جس میں چاندی اور تانبے کے آکسائیڈ کا رنگ شیشے یا زجاجہ دار برتن پر لگا
    کر دوسری بار کم ہوا والے بھٹی میں پکایا جاتا ہے جس سے سطح پر دھاتی چمکیلی تہہ
    جمع ہوتی ہے؛ یہ ابتدائی اسلامی مصر کے شیشے پر ظاہر ہوئی، پھر بغداد کے سفالکاروں
    نے نویں صدی میں سامراء میں برتنوں پر منتقل کی اور 862ء کے لگ بھگ اس کے ٹائل بغدادی
    سفالکار کے ہمراہ جامع قیروان بھیجے گئے {cite:lane-early-islamic-pottery-1947 scan
    pp. 26-28}.
  es: "Técnica en la que se aplica un pigmento de óxidos de plata y cobre sobre vidrio o cerámica vidriada y se cuece por segunda vez en un horno reductor, depositando una película metálica brillante en la superficie; apareció en el vidrio en el Egipto islámico temprano, luego los alfareros de Bagdad la llevaron a la cerámica de Samarra en el siglo IX, y sus azulejos fueron enviados con un alfarero de Bagdad a la Gran Mezquita de Kairouan alrededor del año 862 {cite:lane-early-islamic-pottery-1947 scan pp. 26-28}."
  fr: "Une technique dans laquelle un pigment d'oxydes d'argent et de cuivre est peint sur du verre ou de la poterie émaillée et cuit une seconde fois dans un four réducteur, déposant un film métallique scintillant sur la surface; elle est apparue sur le verre dans l'Égypte islamique primitive, puis les potiers de Bagdad l'ont apportée à la poterie de Samarra au IXe siècle, et ses carreaux ont été envoyés avec un potier de Bagdad à la Grande Mosquée de Kairouan vers 862 {cite:lane-early-islamic-pottery-1947 scan pp. 26-28}."
  tr: "Gümüş ve bakır oksitlerinden oluşan bir pigmentin sırlı cam veya seramiğe uygulanıp daha sonra indirgeyici bir fırında tekrar pişirilmesiyle yüzeye parlak metalik pulların biriktirildiği bir teknik; erken İslam Mısır'ında camda ortaya çıkmış ve daha sonra Bağdatlı çömlekçiler tarafından Samarra'daki çömlekçilere (dokuzuncu yüzyıl) aktarılmış ve çinileri yaklaşık 862 yılında Bağdatlı bir çömlekçi tarafından Kayrevan Ulu Camii'ne gönderilmiştir {cite:lane-early-islamic-pottery-1947 scan pp. 26-28}."
  id: "Suatu teknik di mana pigmen oksida perak dan tembaga diaplikasikan pada kaca atau keramik berlapis glasir dan kemudian dibakar kembali dalam tungku reduksi, sehingga serpihan logam mengkilap mengendap di permukaan; teknik ini muncul pada kaca di Mesir Islam awal dan kemudian ditransfer oleh para pembuat tembikar Baghdad ke pembuatan tembikar di Samarra (abad kesembilan), dan ubin-ubinnya dikirim oleh seorang pembuat tembikar Baghdad ke Masjid Agung Kairouan sekitar tahun 862 M {cite:lane-early-islamic-pottery-1947 scan pp. 26-28}."
