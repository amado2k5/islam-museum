era:
  origins: abbasid-golden
  first_attested:
    edtf: 0862~
    hijri: "0248~"
    calendar: julian
    precision: year
    status: historical
    note: The dated anchor is the Kairouan mihrab tiles sent about 862 with a Baghdad
      potter (Lane); Samarra's polychrome lustre precedes it within the palace occupation
      838-883. Lustre-painted glass in Egypt is earlier still, 'sometime in the first
      two centuries of Islam' (Lane's cautious phrasing).
    sources:
    - source/lane-early-islamic-pottery-1947
  status_today: living
origin:
  polity: polity/abbasid-caliphate
  context:
    ar: ورش بلاط الخلفاء العباسيين — سامراء قصراً وبغداد صناعةً — حيث كان خزف القصدير
      الزجاجي يقلّد آنية المعادن الثمينة دون حرمتها {cite:lane-early-islamic-pottery-1947}
      {cite:encyclopaedia-of-islam-2}.
    en: The workshops of the Abbasid caliphs' court — Samarra as palace, Baghdad as
      industry — where tin-glazed pottery imitated precious-metal vessels without
      touching the religious scruple against them {cite:lane-early-islamic-pottery-1947}
      {cite:encyclopaedia-of-islam-2}.
    ur: عباسی خلفاء کے دربار کی ورکشاپیں — سامراء بطور محل، بغداد بطور صنعت — جہاں
      قلعی زجاجہ دار خزف قیمتی دھات کے برتنوں کی نقل کرتے تھے بغیر ان کے مذہبی امتناع
      کو چھوئے {cite:lane-early-islamic-pottery-1947} {cite:encyclopaedia-of-islam-2}.
makers:
- person: person/abu-al-qasim-al-kashani
  role: describer
  place: place/kashan
  note: Member of the Abu Tahir family of Kashan potters; his 1301 treatise on Seljuk
    pottery technique (read through Lane's citation) records the craft's ingredients
    and kiln practice — a written witness inside the potting family, not the inventor
    of a workshop tradition.
  sources:
  - source/lane-early-islamic-pottery-1947
attribution:
  status: improvement
  claim:
    ar: 'صبغة اللمعة على الخزف موثقة أولاً في الإسلام: على الزجاج في مصر المبكرة ثم
      على الفخار في سامراء وبغداد؛ وأصلها على الزجاج محل نقاش ⁦(لين: مصر أول القرنين
      الإسلاميين)⁩ {cite:lane-early-islamic-pottery-1947}.'
    en: 'The metallic lustre pigment on pottery is documented first in Islam: on glass
      in early Egypt, then on pottery at Samarra and Baghdad; its ultimate root on
      glass is debated (Lane: Egypt, sometime in the first two Islamic centuries)
      {cite:lane-early-islamic-pottery-1947}.'
    ur: 'برتنوں پر دھاتی جھلک کا رنگ پہلی بار اسلامی دنیا میں موثق ہے: ابتدائی مصر
      کے شیشے پر، پھر سامراء اور بغداد کے برتنوں پر؛ شیشے پر اس کی جڑ متنازع ہے ⁦(لین:
      مصر، اسلام کی پہلی دو صدیوں میں کہیں)⁩ {cite:lane-early-islamic-pottery-1947}.'
  basis:
    ar: شذرات سامراء متعددة الألوان ⁦(838–883)⁩ وبلاطات القيروان ⁦(نحو 862)⁩ وقطع
      سوسة والفسطاط تؤرخ التقنية؛ ولين يصف الصبغة ⁦(كبريت + أكسيد فضة + أكسيد نحاس)⁩
      وطريقة الحرق المختزِل {cite:lane-early-islamic-pottery-1947} {cite:encyclopaedia-of-islam-2}.
    en: Polychrome fragments from Samarra (838-883), the Kairouan tiles (c. 862) and
      pieces from Susa and Fustat date the technique; Lane describes the pigment (sulphur
      + silver oxide + copper oxide) and the reducing second firing {cite:lane-early-islamic-pottery-1947}
      {cite:encyclopaedia-of-islam-2}.
    ur: سامراء کے رنگین ٹکڑے ⁦(838–883)⁩، قیروان کے ٹائل ⁦(تقریباً 862)⁩ اور سوسہ
      و فسطاط کے نمونے فن کو مؤرخ کرتے ہیں؛ لین رنگ ⁦(گندھک + چاندی آکسائیڈ + تانبہ
      آکسائیڈ)⁩ اور کم ہوا والی دوسری پکائی بیان کرتا ہے {cite:lane-early-islamic-pottery-1947}
      {cite:encyclopaedia-of-islam-2}.
  perspectives:
  - tradition: sunni
    stance:
      ar: زينة مشروعة تحاكي المعدن
      en: A lawful splendour imitating precious metal
      ur: قیمتی دھات کی نقل کرنے والا جائز زینت
    summary:
      ar: زينة مشروعة تحاكي المعدن — تذكر EI2 ⁦(FAKHKHAR)⁩ أن الخزف اللامع نافس آنية
        الذهب والفضة في مظهرها دون أن يصيبه تحريم المتشددين؛ فكانت التقنية جواباً
        فنياً على سؤال أخلاقي قديم عن أواني الترف {cite:encyclopaedia-of-islam-2}.
      en: EI2 (FAKHKHAR) notes that lustre ware rivalled gold and silver vessels in
        appearance without falling under the religious prohibition on them; the technique
        was an artistic answer to an old ethical question about luxury tableware {cite:encyclopaedia-of-islam-2}.
      ur: قیمتی دھات کی نقل کرنے والا جائز زینت — EI2 ⁦(FAKHKHAR)⁩ لکھتی ہے کہ لستر
        خزف ظاہر میں سونے چاندی کے برتنوں کے ہم پلہ تھا مگر متشددوں کی ممانعت کی زد
        میں نہیں آتا تھا؛ یہ فن تراصتخ کے بارے میں قدیم اخلاقی سوال کا فنی جواب تھا
        {cite:encyclopaedia-of-islam-2}.
    sources:
    - source/encyclopaedia-of-islam-2
  - tradition: academic
    stance:
      ar: منشأ الزجاج المصري ثم فخار بغداد
      en: Egyptian glass origin, then Baghdad pottery
      ur: مصری شیشے سے آغاز، پھر بغدادی برتن
    summary:
      ar: منشأ الزجاج المصري ثم فخار بغداد — لين يجعل أول استعمال للصبغة على الزجاج
        في مصر الإسلامية المبكرة، والنقل إلى الفخار صناعة عراقية ⁦(سامراء)⁩؛ وEI2
        تبقيه «glory of Islamic art» وتسجل احتمال نشأة مصرية ونسبها المتأرجح {cite:lane-early-islamic-pottery-1947}
        {cite:encyclopaedia-of-islam-2}.
      en: Lane places the pigment's first use on glass in early Islamic Egypt, and
        its transfer to pottery as an Iraqi industry (Samarra); EI2 keeps it a 'glory
        of Islamic art' while recording the possible Egyptian origin and the wavering
        attribution {cite:lane-early-islamic-pottery-1947} {cite:encyclopaedia-of-islam-2}.
      ur: مصری شیشے سے آغاز، پھر بغدادی برتن — لین رنگ کا پہلا استعمال ابتدائی اسلامی
        مصر کے شیشے پر مانتا اور برتنوں پر منتقلی کو عراقی صنعت ⁦(سامراء)⁩ قرار دیتا
        ہے؛ EI2 اسے «عظمتِ فنِ اسلامی» رکھتے ہوئے مصری ابتدا کا امکان اور غیر یقینی
        نسبت درج کرتی ہے {cite:lane-early-islamic-pottery-1947} {cite:encyclopaedia-of-islam-2}.
    sources:
    - source/lane-early-islamic-pottery-1947
    - source/encyclopaedia-of-islam-2
precursors:
- external:
    ar: الزجاج الملمع المصري
    en: Egyptian lustre-painted glass
    ur: مصر کا لستر رنگا شیشہ
  note: 'Lane''s judgement: the pigment was ''first used in Egypt, to decorate glass,
    sometime in the first two centuries of Islam''; lustre-painted glass was found
    at Samarra too, though less abundantly than in Egypt.'
  sources:
  - source/lane-early-islamic-pottery-1947
- external:
    ar: الفخار المزجج بالقصدير والنماذج الصينية
    en: Tin-glazed earthenware and the Chinese models
    ur: قلعی زجاجہ مٹی کے برتن اور چینی نمونے
  note: The lustre was painted over an opaque white tin glaze made to imitate Chinese
    porcelain; Abbasid potters had already copied Tang shapes in the white-bodied
    wares.
  sources:
  - source/lane-early-islamic-pottery-1947
  - source/encyclopaedia-of-islam-2
dependents:
- external:
    ar: بلاطات محراب القيروان
    en: The Kairouan mihrab tiles
    ur: قیروان کے محرابی ٹائل
  note: Nearly 150 lustred tiles sent — or made on site by the accompanying Baghdad
    potter — about 862, still embedded in the Great Mosque's mihrab (EI2 and Lane).
  sources:
  - source/encyclopaedia-of-islam-2
  - source/lane-early-islamic-pottery-1947
- external:
    ar: خزف فسطاط الفاطمي الموقع
    en: The signed Fatimid lustre of Fustat
    ur: فسطاط کا دستخطی فاطمی لستر خزف
  note: 'Twelfth-century Cairo took the lead: fine gold lustre with scratched detail
    and signatures such as the potter Sa''d''s — Lane argues Baghdad''s best potters
    moved to the Fatimid court.'
  sources:
  - source/lane-early-islamic-pottery-1947
- external:
    ar: لستر كاشان والري وسلطان آباد
    en: The lustre schools of Kashan, Rayy and Sultanabad
    ur: کاشان، رے اور سلطان آباد کے لستر مکاتب
  note: Persia's figural lustre of the twelfth-thirteenth centuries — star tiles,
    mihrabs, dated and signed wares — became the most famous branch (Lane chapters
    on Persian lustre).
  sources:
  - source/lane-early-islamic-pottery-1947
- external:
    ar: هيسپانو-مورسك مانيسيس ومايولكا إيطاليا
    en: Hispano-Moresque Manises and Italian maiolica
    ur: ہسپانو-موریسک مانیسیس اور اطالوی مایولکا
  note: Malaga and then Manises carried the technique into Christian Spain; in the
    fifteenth century it passed from Moresque pottery to Italian painted maiolica
    (Lane and EI2).
  sources:
  - source/lane-early-islamic-pottery-1947
  - source/encyclopaedia-of-islam-2
spread: []
impact:
  fields:
  - materials-industry
  changed:
    ar: أنتجت أول سيراميك يحاكي مظهر المعادن الثمينة في التاريخ؛ صارت تقنيته أغلى
      ما صنعه خزافو الإسلام لقرون خمسة من بغداد إلى الأندلس {cite:lane-early-islamic-pottery-1947}.
    en: It produced history's first ceramic that mimicked the look of precious metals;
      for five centuries it was the most valued technique of Islamic potters from
      Baghdad to al-Andalus {cite:lane-early-islamic-pottery-1947}.
    ur: تاریخ کا پہلا سیرامیک بنایا جو قیمتی دھاتوں جیسا لگتا ہو؛ پانچ صدیوں تک بغداد
      سے اندلس تک یہ مسلمان سفالکاروں کی قیمتی ترین تکنیک رہی {cite:lane-early-islamic-pottery-1947}.
  history:
    ar: 'صدّرت صورة الذوق الإسلامي إلى العالم: بلاطات القيروان، صحون فسطاط، بلاطات
      كاشان، ثم هيسپانو-مورسك الذي علّم أوروبا اللمعة — سلسلة واحدة من الأتون المختزِل
      {cite:lane-early-islamic-pottery-1947}.'
    en: 'It exported the image of Islamic taste to the world: the Kairouan tiles,
      the Fustat dishes, the Kashan tiles, then the Hispano-Moresque ware that taught
      Europe lustre — one continuous chain of the reducing kiln {cite:lane-early-islamic-pottery-1947}.'
    ur: 'اسلامی ذوق کی تصویر دنیا کو دی: قیروان کے ٹائل، فسطاط کی پلیٹیں، کاشان کے
      ٹائل، پھر ہسپانو-موریسک جس نے یورپ کو لستر سکھایا — کم ہوا والے بھٹی کی ایک
      مسلسل زنجیر {cite:lane-early-islamic-pottery-1947}.'
  significance: 5
  why: The signature technique of Islamic ceramics — invented in its workshops, exported
    from Kairouan to Valencia, and the ancestor of European lustre pottery.
