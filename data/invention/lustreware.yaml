kids:
  ar: 'كيف تصنع إناءً يلمع كأنه من ذهب وهو من طين؟ وجد الخزّافون المسلمون الطريقة:
    يرسمون الزينة بمسحوق معادن خاص على الإناء المزجج، ثم يحرقونه مرة ثانية في نار
    بلا هواء تقريباً، فتبقى طبقة معدنية رقيقة تلمع كقوس قزح. أجمل هذه الأواني صُنعت
    في بغداد وفسطاط وكاشان قبل أكثر من ألف سنة.'
  en: 'How do you make a clay pot shine like gold? Muslim potters found the way: paint
    the decoration with a special metal powder on the glazed pot, then fire it a second
    time in a kiln with almost no air, and a thin metallic film stays on the surface,
    shimmering like a rainbow. The most beautiful of these pots were made in Baghdad,
    Fustat and Kashan over a thousand years ago.'
  ur: 'مٹی کے برتن کو سونے جیسا چمکدار کیسے بنائیں؟ مسلمان سفالکاروں نے طریقہ نکالا:
    زجاجہ دار برتن پر خاص دھاتی پاؤڈر سے نقش بناؤ، پھر تقریباً بغیر ہوا والے بھٹی
    میں دوسری بار پکاؤ، تو سطح پر باریک دھاتی تہہ قوس قزح جیسی جھلک کے ساتھ رہ جاتی
    ہے۔ اس طرح کے خوبصورت ترین برتن ہزار سال پہلے بغداد، فسطاط اور کاشان میں بنے۔'
