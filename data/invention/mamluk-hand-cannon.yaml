origin:
  polity: polity/mamluk-sultanate
  place: place/cairo
  context:
    ar: 'سياق عسكري مملوكي: ورث الجيش المملوكي تقاليد الفروسية النارية
      من عهد الرماح ⁦(1240-1280)⁩ ثم ظهر المدفع في كتبها المصورة
      ⁦(1320-1350)⁩؛ وتوثق الروايات استعماله حصارياً في سبعينيات القرن
      الرابع عشر عبر البحرين والمغرب والأندلس {cite:wikipedia-hand-cannon-en}
      {cite:partington-greek-fire-gunpowder-1960}.'
    en: 'A Mamluk military setting: the sultanate''s army inherited the
      pyrotechnic furusiyya tradition of al-Rammah''s generation
      ⁦(1240-1280)⁩, then the midfa appears in its illustrated treatises
      ⁦(1320-1350)⁩; contemporary accounts document its siege use into
      the 1370s across the Mediterranean shores {cite:wikipedia-hand-cannon-en}
      {cite:partington-greek-fire-gunpowder-1960}.'
    ur: 'مملوکی فوجی سیاق: سلطنت کی فوج نے رماح کے عہد ⁦(1240-1280ء)⁩
      کی نیرنگی فروسیہ روایت سمبھالی، پھر مدفع اس کے مصور رسالوں میں
      ⁦(1320-1350ء)⁩ ظاہر ہوا؛ ہمعصر روایتیں سترہ سو ستر کی دہائی میں
      بحیرۂ روم کے کنارے محاصراتی استعمال ثبت کرتی ہیں
      {cite:wikipedia-hand-cannon-en} {cite:partington-greek-fire-gunpowder-1960}۔'
makers:
- person: person/hasan-al-rammah
  role: describer
  place: place/damascus
  note: 'The furusiyya writer whose treatise (compiled c. 1280, d.
    1294-95) describes fire lances and the pyrotechnic stage the midfa
    belongs to; the firearm passages themselves appear in the later
    illustrated Mamluk recensions of that tradition, not in his own
    text — he names the lineage, not the gun.'
  sources:
  - source/partington-greek-fire-gunpowder-1960
  - source/wikipedia-hand-cannon-en
- person: person/al-qalqashandi
  role: describer
  place: place/cairo
  note: 'The Mamluk chancery scholar who described a metal cannon
    firing an iron ball in his administrative encyclopedia composed
    between 1365 and 1376 — the documentary horizon of the weapon in
    Mamluk service.'
  sources:
  - source/wikipedia-hand-cannon-en
  - source/needham-gunpowder-epic-1986
attribution:
  status: contested
  claim:
    ar: 'ظهر المدفع اليدوي في النصوص والرسوم المملوكية بين 1320 و1352،
      وبلغ الاستعمال اليقيني 1342؛ لكن موعد دخوله الجيش المملوكي
      ومصدره — تقنية مغولية منقولة أم تطور محلي عن الرمح الناري —
      متنازع عليه بين الرواية المبكرة وتأريخ خان المتأخر
      {cite:wikipedia-hand-cannon-en} {cite:needham-gunpowder-epic-1986}.'
    en: 'The hand cannon appears in Mamluk texts and drawings between
      1320 and 1352, with certain use by 1342; but the date of its
      entry into the Mamluk army and its source — a transmitted Mongol
      technology or local development from the fire lance — is
      contested between the early-use reading and Khan''s late dating
      {cite:wikipedia-hand-cannon-en} {cite:needham-gunpowder-epic-1986}.'
    ur: 'ہاتھ توپ 1320ء سے 1352ء کے درمیان مملوکی متون اور تصویروں میں
      ظاہر ہوئی، 1342ء تک استعمال یقینی؛ مگر فوج میں اس کے داخلے کی
      تاریخ اور سرچشمہ — منقولہ منگولی تکنیک یا مقامی ارتقا آتش نیزہ
      سے — ابتدائی قراءت اور خان کی متأخر تاریخ کے درمیان متنازع ہے
      {cite:wikipedia-hand-cannon-en} {cite:needham-gunpowder-epic-1986}۔'
  basis:
    ar: 'الشاهد المصور للمدفع في مخطوطة رزيفوسكي نحو 1320-1350؛ وهامر
      يجزم باستعمال المماليك للمدافع 1342؛ والقلقشندي يصف مدفعاً
      معدنياً يقذف كرة حديدية ⁦(1365-1376)⁩؛ ونيدهم يقرأ «مدفع» أصلاً
      أنبوبة قاذف نفط؛ وخان يؤخر وصول المدفع لمصر إلى السبعينيات، بينما
      ادعاء الحسن استعمالاً بعين جالوت ⁦(1260)⁩ خالفه مؤرخون آخرون
      {cite:wikipedia-hand-cannon-en} {cite:needham-gunpowder-epic-1986}.'
    en: 'The illustrated midfa witness in the Rzevuski manuscript of
      c. 1320-1350; Hammer''s certain Mamluk cannon use by 1342;
      al-Qalqashandi''s metal cannon firing an iron ball ⁦(1365-1376)⁩;
      Needham reading midfa as originally a naphtha-projector tube;
      Khan dating the cannon''s arrival in Egypt to the 1370s, while
      al-Hassan''s claimed use at Ain Jalut ⁦(1260)⁩ contradicts other
      historians {cite:wikipedia-hand-cannon-en}
      {cite:needham-gunpowder-epic-1986}.'
    ur: 'رضووسکی مخطوطہ ⁦(1320-1350ء قریب)⁩ میں مدفع کی مصور گواہی؛ ہامر
      کا 1342ء میں مملوکی توپ استعمال یقینی؛ قلقشندی کی دھاتی توپ جو
      لوہے کی گیند پھینکتی ⁦(1365-1376ء)⁩؛ نیڈہم کا مدفع کو اصل میں
      نفط پھینکنے والی نالی پڑھنا؛ خان کی ستر کی دہائی کی متأخر تاریخ،
      جب کہ الحسن کا عین جالوت ⁦(1260ء)⁩ دعویٰ دوسرے مؤرخین کے خلاف ہے
      {cite:wikipedia-hand-cannon-en} {cite:needham-gunpowder-epic-1986}۔'
  perspectives:
  - tradition: sunni
    id: early-use-reading
    summary:
      ar: 'الرواية المبكرة للاستعمال — في الإطار السني العام يُروى
        السلاح الناري ابناً للتقليد الفروسي المملوكي نفسه: قرأ أحمد
        يوسف الحسن مخطوطات القرن الرابع عشر على أنها تشهد استعمال
        المدافع اليدوية بعين جالوت ⁦(1260)⁩، فتقدم الإسلام مدفعاً قبل
        أوروبا؛ وهي قراءة موجودة لكنها مخالفة للتأريخ الغالب
        {cite:wikipedia-hand-cannon-en}.'
      en: 'The early-use reading — in the museum''s Sunni default frame
        the firearm is told as a child of the Mamluk furusiyya
        tradition itself: Ahmad Y. al-Hassan read fourteenth-century
        Arabic manuscripts as recording hand cannon used at Ain Jalut
        ⁦(1260)⁩, giving the Islamic world the gun before Europe; the
        reading exists on record but contradicts the majority dating
        {cite:wikipedia-hand-cannon-en}.'
      ur: 'ابتدائی استعمال کی قراءت — سنی عمومی فریم میں اسلحہ ناری
        مملوکی فروسیہ روایت کی اولاد کہا جاتا ہے: احمد یوسف الحسن نے
        چودہویں صدی کے عربی مخطوطوں کو عین جالوت ⁦(1260ء)⁩ میں ہاتھ توپ
        استعمال کی گواہی پڑھا، جس سے اسلامی دنیا کو یورپ سے پہلے بندوق
        ملتی ہے؛ یہ قراءت ریکارڈ پر ہے مگر غالب تاریخ کے خلاف ہے
        {cite:wikipedia-hand-cannon-en}۔'
    sources:
    - source/wikipedia-hand-cannon-en
  - tradition: academic
    id: midfa-horizon-1340s
    summary:
      ar: 'الحدود النصية للمدفع — نيدهم وخان وأندرادي يضبطون أفق السلاح
        بمخطوطات 1320-1352 والمدفع المعدني الموثق من 1365، ويقرأ نيدهم
        «مدفع» أصلاً أنبوبة قاذف نفط صارت اسم السلاح، ويؤرخ خان دخوله
        مصر بالسبعينيات على يد تقنية منقولة من المغول
        {cite:wikipedia-hand-cannon-en} {cite:needham-gunpowder-epic-1986}.'
      en: 'The textual horizon reading — Needham, Khan and Andrade set
        the weapon''s horizon at the 1320-1352 manuscripts and the
        documented metal cannon of 1365; Needham reads midfa as
        originally the tube of a naphtha projector that later named
        the gun, and Khan dates its arrival in Egypt to the 1370s by
        Mongol-transmitted technology {cite:wikipedia-hand-cannon-en}
        {cite:needham-gunpowder-epic-1986}.'
      ur: 'متنی حد کی قراءت — نیڈہم، خان اور انڈرادی اسلحہ کی حد
        1320-1352ء مخطوطوں اور 1365ء کی مستند دھاتی توپ پر رکھتے ہیں؛
        نیڈہم مدفع کو اصل میں نفط پھینکنے والی نالی پڑھتا ہے جو بعد میں
        بندوق کا نام بنی، اور خان مصر میں اس کا داخلہ ستر کی دہائی میں
        منگولی منقولہ تکنیک سے مؤرخ کرتا ہے {cite:wikipedia-hand-cannon-en}
        {cite:needham-gunpowder-epic-1986}۔'
    sources:
    - source/wikipedia-hand-cannon-en
    - source/needham-gunpowder-epic-1986
