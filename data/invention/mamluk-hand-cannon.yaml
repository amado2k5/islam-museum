summary:
  ar: أنبوب معدني يُحمّل بالبارود ويقذف مقذوفاً من فوهته، يثبّت على
    قائم ويوقد من ثقب الإشعال — أول سلاح ناري شخصي؛ نص عربي من
    1320-1350 يصف المدفع يقذف مقذوفات من أنبوب على رأس قائم، والمماليك
    استعملوا المدافع بيقين بحلول 1342، ووصف القلقشندي مدفعاً معدنياً
    يقذف كرة حديدية بين 1365 و1376 {cite:wikipedia-hand-cannon-en}
    {cite:needham-gunpowder-epic-1986}.
  en: A metal tube loaded with gunpowder that discharges a projectile
    from its muzzle, mounted on a stock and fired through a touch hole
    — the first personal firearm; an Arabic text of 1320-1350 describes
    a midfa discharging projectiles from a tube at the end of a stock,
    the Mamluks certainly used cannon by 1342, and al-Qalqashandi
    described a metal cannon firing an iron ball between 1365 and 1376
    {cite:wikipedia-hand-cannon-en} {cite:needham-gunpowder-epic-1986}.
  ur: دھات کی نالی جو بارود بھر کر نال سے گولہ پھینکتی ہے، دستہ پر لگا
    کر تدبرک کے سوراخ سے جلائی جاتی — پہلا ذاتی اسلحہ ناری؛ 1320-1350ء
    کا عربی متن مدفع کو دستہ کے سرے کی نالی سے گولہ پھینکتا بیان کرتا
    ہے، ممالیک نے 1342ء تک توپیں ضرور استعمال کیں، اور قلقشندی نے
    1365-1376ء میں لوہے کی گیند پھینکنے والی دھات کی توپ بیان کی
    {cite:wikipedia-hand-cannon-en} {cite:needham-gunpowder-epic-1986}۔
  es: "Un tubo de metal cargado con pólvora que dispara un proyectil por su boca, montado en una culata y disparado a través de un orificio de ignición: la primera arma de fuego personal; un texto árabe de 1320-1350 describe un midfa que dispara proyectiles desde un tubo en el extremo de una culata, los mamelucos ciertamente usaron cañones hacia 1342, y al-Qalqashandi describió un cañón de metal que disparaba una bola de hierro entre 1365 y 1376 {cite:wikipedia-hand-cannon-en} {cite:needham-gunpowder-epic-1986}."
