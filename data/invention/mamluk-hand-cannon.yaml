spread: []
impact:
  fields:
  - military
  changed:
    ar: 'نقل البارود من المفرقعات الحصارية إلى سلاح يحمله الجندي: أنبوب
      على قائم، يوقد يدوياً، يقذف مقذوفاً — الشكل الأولي لكل سلاح شخصي
      لاحق {cite:wikipedia-hand-cannon-en}.'
    en: 'It moved gunpowder from siege pyrotechnics to a soldier''s own
      weapon: a tube on a stock, lit by hand, throwing a projectile —
      the first shape of every personal firearm that followed
      {cite:wikipedia-hand-cannon-en}.'
    ur: 'بارود کو محاصراتی نیرنگی سے سپاہی کے ذاتی اسلحے میں بدل دیا:
      دستہ پر لگی نالی، ہاتھ سے جلائی جائے، گولہ پھینکے — آنے والے ہر
      ذاتی اسلحہ ناری کی ابتدائی شکل {cite:wikipedia-hand-cannon-en}۔'
  history:
    ar: 'في جيش المملكة المملوكية صار السلاح بنداً في العتاد خلال جيلين
      من الرماح إلى القلقشندي، ثم ورثته العثمانية فحملته إلى سواتر
      القسطنطينية، وغيّر ميزان الحروب البرية والبحرية في قرن
      {cite:wikipedia-hand-cannon-en} {cite:ayalon-gunpowder-firearms-1956}.'
    en: 'In the Mamluk army the weapon went from treatise novelty to
      issue equipment within two generations of al-Rammah to
      al-Qalqashandi; the Ottomans inherited it, carried it to the
      walls of Constantinople, and it changed land and naval war
      within a century {cite:wikipedia-hand-cannon-en}
      {cite:ayalon-gunpowder-firearms-1956}.'
    ur: 'مملوکی فوج میں یہ اسلحہ رماح سے قلقشندی تک دو نسلوں میں رسالہ
      نیاپن سے معیاری سازوسامان بنا؛ عثمانیوں نے وراثت میں لے کر اسے
      قسطنطنیہ کی دیواروں تک پہنچایا اور ایک صدی میں بر و بحر کی جنگیں
      بدل دیں {cite:wikipedia-hand-cannon-en}
      {cite:ayalon-gunpowder-firearms-1956}۔'
  significance: 4
  why: 'The first personal firearm in an Islamic textual tradition —
    the midfa is where gunpowder meets the soldier''s own hands, and
    its dating is still honestly contested.'
