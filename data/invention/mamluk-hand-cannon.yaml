kids:
  ar: 'تخيل أنبوباً حديدياً على عصا: تملؤه بالبارود، تدس فيه كرة، ثم
    تشعل ناراً صغيرة عند ثقب — فتنطلق الكرة بدفعٍ ودوي. بهذا الشكل
    البسيط بدأ السلاح الناري الشخصي في كتب مماليك القرن الرابع عشر.'
  en: 'Imagine an iron tube on a stick: fill it with gunpowder, push
    in a ball, touch fire to a small hole — and the ball flies out
    with a bang. In that simple shape the personal firearm began in
    the books of fourteenth-century Mamluk soldiers.'
  ur: 'ایک لاٹھی پر لگی لوہے کی نالی سوچو: بارود بھرو، گیند رکھو،
    چھوٹے سوراخ پر آگ لگاؤ — اور گیند دھماکے سے نکل پڑتی ہے۔ اسی
    سادہ شکل میں چودہویں صدی کے مملوکی سپاہیوں کی کتابوں میں ذاتی
    اسلحہ ناری کا آغاز ہوا۔'
