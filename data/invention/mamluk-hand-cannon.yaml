today:
  form:
    ar: 'لا يقاتل بها أحد اليوم؛ يبقى المدفع اليدوي المتحفي مرحلة بين
      الرمح الناري والأركبوس، وموضوع نقاش تأريخي حي حول متى دخل البيت
      الإسلامي {cite:wikipedia-hand-cannon-en}.'
    en: 'No one fights with it now; the museum hand cannon stands as
      the stage between fire lance and arquebus, and the subject of a
      live dating debate over when it entered the Islamic world
      {cite:wikipedia-hand-cannon-en}.'
    ur: 'اب کوئی اس سے لڑائی نہیں کرتا؛ عجائب گھر کی ہاتھ توپ آتش نیزہ
      اور ارکبوز کے درمیان مرحلہ ہے، اور اس کے اسلامی دنیا میں داخلے
      کی تاریخ کا زندہ بحث {cite:wikipedia-hand-cannon-en}۔'
  descendants:
    ar: 'خلفتها البنادق المشعّلة والمسكيتات والبنادق الحديثة — كلها
      أحفاد آلية الإشعال من ثقب {cite:wikipedia-hand-cannon-en}.'
    en: 'Matchlocks, muskets and modern small arms — all descendants
      of the touch-hole firing idea {cite:wikipedia-hand-cannon-en}.'
    ur: 'فیتہ بندوقیں، مسکٹ اور جدید اسلحہ — سب تدبرک سوراخ سے جلانے
      کے خیال کی اولادیں ہیں {cite:wikipedia-hand-cannon-en}۔'
