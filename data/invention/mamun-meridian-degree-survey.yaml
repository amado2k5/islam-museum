  context:
    ar: "سهل سنجار في الجزيرة، نحو سبعين ميلاً غرب الموصل على ما ينقله حساب البيروني؛ سجل البلدة الموجود اليوم ما زال ينتظر التحقق من هويته مع الموضع الكلاسيكي."
    en: "The plain of Sinjar in the Jazira, about seventy miles west of Mosul as MacTutor relays from al-Biruni's account; the existing modern-town place record still carries an unverified identification with the classical site."
    ur: "جزیرہ میں سنجار کا میدان، بیرونی کے بیان کے مطابق ماک ٹیوٹر کے ذریعے موصل سے تقریباً ستر میل مغرب؛ موجودہ جدید قصبے کا ریکارڈ ابھی کلاسیکی مقام سے ملانے کی تصدیق کے منتظر ہے۔"
