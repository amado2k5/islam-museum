kids:
  ar: "قبل ألف ومئتي سنة أراد الخليفة المأمون أن يعرف محيط الأرض بدقة. فجمع علماء في صحراء سنجار، ومشى فريق شمالاً وفريق جنوباً، وكلما ارتفع الشمس درجة واحدة قاسوا المسافة. النتيجة كانت نحو 56 ميلاً وثلثي للدرجة — رقم استخدمه العلماء بعدهم مئات السنين."
  en: "More than a thousand years ago the caliph al-Ma'mun wanted to know Earth's size exactly. He gathered scholars on the plain of Sinjar; one team walked north and one south, and each time the sun's noon height rose by one degree they measured the ground. The answer came out near 56 and two-thirds miles per degree — a number later scholars used for centuries."
  ur: "بارہ سو سال سے زیادہ پہلے خلیفہ مامون زمین کا حجم بالکل جاننا چاہتے تھے۔ انہوں نے سنجار کے میدان میں علماء جمع کیے؛ ایک دستہ شمال اور ایک جنوب چلا، اور جب بھی دوپہر کی سورج کی اونچائی ایک ڈگری بڑھتی وہ فاصلہ ناپتے۔ نتیجہ تقریباً 56 دو تہائی میل فی ڈگری نکلا — وہی تعداد بعد کے علماء نے صدیوں استعمال کی۔"
