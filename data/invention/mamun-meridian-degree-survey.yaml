id: invention/mamun-meridian-degree-survey
class: invention
label:
  ar: "مسح درجة خط الزوال في سهل سنجار في عهد المأمون"
  en: "Al-Ma'mun's meridian-degree survey on the plain of Sinjar"
  ur: "مامون کی سنجار کے میدان میں عرض البلد کی ڈگری کی پیمائش"
  es: "Levantamiento topográfico de Al-Ma'mun en grados meridianos en la llanura de Sinjar."
  fr: "Le relevé topographique d'Al-Ma'mun selon le méridien dans la plaine de Sinjar"
names:
  - { value: "Sinjar meridian survey", kind: alternate, lang: en }
  - { value: "مسح سنجار للدرجة الأرضية", kind: alternate, lang: ar }
summary:
  ar: "مشروع قياس علمي في عهد المأمون: فريقان سارا شمالاً وجنوباً من نقطة واحدة على سهل سنجار نحو سبعين ميلاً غرب الموصل، يراقبان ارتفاع الشمس عن خط الزوال حتى تتغير درجته درجة واحدة مصححةً لتغير الميل، ويقيسان المسافات ويعيدان المسح ذهاباً وإياباً؛ فخرجت النتيجة 56 ميلاً ثم 56 وثلثي ميل للدرجة — وهو القيمة التي استعملها البيروني في حساباته {cite:mactutor-biruni-coordinates} {cite:farghani-elements-astronomy p. 316-317}."
  en: "An Abbasid survey programme under al-Ma'mun: two parties marched north and south from one point on the plain of Sinjar about seventy miles west of Mosul, watching the sun's meridian altitude until it changed by one degree corrected for declination, measuring the ground and re-surveying on the way back; the result came out at 56 miles and then 56 2/3 miles per degree — the value al-Biruni later used in his own computations {cite:mactutor-biruni-coordinates} {cite:farghani-elements-astronomy p. 316-317}."
  ur: "مامون کے عہد کا علمی منصوبہ: دو دستے سنجار کے میدان میں موصل سے تقریباً ستر میل مغرب ایک مقام سے شمال اور جنوب کی طرف چلے، سورج کی نصف النہاری اونچائی دیکھتے رہے یہاں تک کہ اس میں ایک ڈگری کی تبدیلی میل کی تبدیلی کے حساب سے درست ہوتے ہوئے ملی؛ انہوں نے فاصلہ ناپا اور واپسی پر دوبارہ پیمائش کی؛ نتیجہ ڈگری کے لیے 56 میل پھر 56 دو تہائی میل نکلا — وہی قیمت جو بعد میں بیرونی نے اپنے حسابوں میں استعمال کی {cite:mactutor-biruni-coordinates} {cite:farghani-elements-astronomy p. 316-317}۔"
  es: "Un programa de reconocimiento abasí bajo el mando de al-Ma'mun: dos grupos marcharon hacia el norte y el sur desde un punto en la llanura de Sinjar, a unas setenta millas al oeste de Mosul, observando la altitud meridiana del sol hasta que cambió un grado corregido por la declinación, midiendo el terreno y volviendo a realizar el reconocimiento en el camino de regreso; el resultado fue de 56 millas y luego 56 2/3 millas por grado, el valor que al-Biruni usó más tarde en sus propios cálculos {cite:mactutor-biruni-coordinates} {cite:farghani-elements-astronomy p. 316-317}."
  fr: "Un programme d'arpentage abbasside sous al-Ma'mun: deux groupes ont marché vers le nord et le sud à partir d'un point de la plaine de Sinjar, à environ soixante-dix miles à l'ouest de Mossoul, observant la hauteur méridienne du soleil jusqu'à ce qu'elle change d'un degré corrigé de la déclinaison, mesurant le terrain et effectuant un nouvel arpentage sur le chemin du retour; le résultat a été de 56 miles puis 56 2/3 miles par degré — la valeur qu'al-Biruni a utilisée plus tard dans ses propres calculs {cite:mactutor-biruni-coordinates} {cite:farghani-elements-astronomy p. 316-317}."
