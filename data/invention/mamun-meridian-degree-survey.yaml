attribution:
  status: improvement
  claim:
    ar: "تحسين على قراءة يونانية قديمة لدرجة خط الزوال ⁦(500 ستيج)⁩ بقياس عربي محلي في ذراع سوداء، لا اختراع مبدأ قياس القوس الأرضي."
    en: "An improvement on an inherited Greek reading of the meridian degree (500 stadia) through a local measurement in black cubits, not the invention of arc measurement itself."
    ur: "قدیم یونانی پڑھائی ⁦(500 سٹیڈیا)⁩ پر مقامی ذراع کی پیمائش کے ذریعے بہتری، زمینی قوس کی پیمائش کے اصول کی ایجاد نہیں۔"
  basis:
    ar: "يذكر البيروني في «Determining the Coordinates of Cities» أن المأمون قرأ في كتب يونانية أن الدرجة 500 ستيج، ثم وجد طول الستيج غير معلوم للترجمان، فأمر بمسح جديد في سهل سنجار؛ وأخرج المسح درجتين: 56 ميلاً و56 وثلثي ميل {cite:mactutor-biruni-coordinates}. وينقل الفرغاني عن أبي الفداء أن جماعة من العلماء اجتمعوا في صحراء سنجار في عهد المأمون فانقسموا فريقين شمالاً وجنوباً حتى ارتفع القطب درجة واحدة، فكان البعد 56 وثلثي ميل لبعضهم و56 بلا كسر لآخرين، وأخذ الأكبر {cite:farghani-elements-astronomy p. 316-317}."
    en: "Al-Biruni's Coordinates account, relayed by MacTutor, has al-Ma'mun read in Greek books that a meridian degree equalled 500 stadia, then find the stade's length unresolved for the translators, so he ordered a new survey on the Sinjar plain; the survey produced two figures, 56 miles and 56 2/3 miles {cite:mactutor-biruni-coordinates}. Al-Farghani, transmitting Abu'l-Fida, reports a company of scholars gathering in the Sinjar desert in al-Ma'mun's reign, splitting north and south until the pole rose one degree, yielding 56 2/3 miles for some parties and 56 without fraction for others, the larger adopted {cite:farghani-elements-astronomy p. 316-317}."
    ur: "بیرونی کا «Determining the Coordinates of Cities» بیان ماک ٹیوٹر کے ذریعے بتاتا ہے کہ مامون نے یونانی کتب میں پڑھا کہ نصف النہاری ڈگری 500 سٹیڈیا ہے، پھر سٹیڈیا کی لمبائی کا مترجمین کے لیے تعین نہ ہو سکا، تو اس نے سنجار کے میدان میں نئی پیمائش کا حکم دیا؛ پیمائش نے دو قدریں دیں: 56 میل اور 56 دو تہائی میل {cite:mactutor-biruni-coordinates}۔ فرغانی ابو الفدا سے نقل کرتے ہوئے بتاتے ہیں کہ مامون کے دور میں علماء کا ایک گروہ سنجار کے صحرا میں جمع ہوا، دو دستوں میں شمال و جنوب بٹا یہاں تک کہ قطب ایک ڈگری بلند ہوا، نتیجہ بعض کے لیے 56 دو تہائی اور بعض کے لیے 56 میل نکلا اور بڑی قدر اختیار کی گئی {cite:farghani-elements-astronomy p. 316-317}۔"
  perspectives:
    - tradition: sunni
      id: sunni-museum-frame
      standing: main
      summary:
        ar: "الإطار السني المعلن يضع البرنامج في سياقه الطبيعي: خلافة عباسية راعية للعلم، ومأمون من أعيان خلفائها المحفوظين في كتب التراجم، والبيروني وابنه المترجمين والراصدين من بيت الحكمة بغداد؛ والروايات المنقولة عن تحديد الدرجة تُعرض كما نُقلت، لا كقياس معاد اليوم."
        en: "The museum's declared Sunni frame places the programme in its natural context: an Abbasid caliphate that patronised learning, al-Ma'mun among the caliphs preserved in the chronicles, and al-Biruni with his translated observatory staff in Baghdad's House of Wisdom; the transmitted accounts of the degree measurement are presented as transmitted, not re-measured today."
        ur: "میوزیم کا واضح سنی سیاق اس پروگرام کو اس کے فطری تناظر میں رکھتا ہے: علم کی سرپرست عباسی خلافت، ترجمہ کی کتابوں میں محفوظ مامون، اور بیرونی اپنے مترجمین و ماہرین اور مترجم ارکان کے ساتھ بغداد کے بیت الحکمہ میں؛ ڈگری کی پیمائش کی منقول روایات جیسی منقول ہیں پیش کی جاتی ہیں، آج دوبارہ ناپی نہیں جاتیں۔"
      sources: [source/mactutor-biruni-coordinates, source/etymological-dictionary-mamun-method, source/tabari-tarikh-abu-al-fadl]
    - tradition: academic
      id: survey-attested-multi-source
      standing: main
      summary:
        ar: "شواهد متقاربة: البيروني ينقل عن هباشة أن خالداً أملى العدد على القاضي يحيى بن أكثم قاضي البصرة، والفرغاني ينقل رواية أبي الفداء عن انقسام فريقين ونتيجتين؛ هذا اتساق روايات متأخرة، لا سجل مرصدي مكتوب وقت الحدث."
        en: "Convergent testimony: al-Biruni relays from Habash that Khalid dictated the figure to judge Yahya b. Aktham, chief justice of Basra, and al-Farghani transmits Abu'l-Fida's account of two parties and two figures; this is agreement among later reports, not a contemporary observational log."
        ur: "متقارب شہادتیں: بیرونی ہبشہ سے نقل کرتے ہیں کہ خالد نے قاضی یحییٰ بن اکثم ⁦(قاضی بصرہ)⁩ کو تعداد سنائی، اور فرغانی ابو الفدا کی روایت میں دو دستے اور دو قدریں ہیں؛ یہ بعد کی روایات کا اتفاق ہے، عصری مشاہداتی ریکارڈ نہیں۔"
      sources: [source/mactutor-biruni-coordinates, source/farghani-elements-astronomy]
    - tradition: academic
      id: modern-geodetic-context
      standing: main
      summary:
        ar: "تقديرات حديثة تعتبر 6339.6 كم نصف قطر للأرض قيمة مأخوذة عن البيروني، مع تحفظ من دقة الرقم ووحدة الذراع؛ ولا يحول السجل القديم إلى قياس حديث."
        en: "Modern estimates cite a 6339.6 km radius attributed to al-Biruni with cautions about the figure's accuracy and the unresolved cubit unit; the medieval record is not converted into a modern measurement here."
        ur: "جدید تخمینیں بیرونی سے منسوب 6339.6 کلومیٹر نصف قطر بتاتی ہیں مگر اس کے دقت اور ذراع کی اکائی پر تحفظ ہے؛ قرون وسطیٰ کا ریکارڈ یہاں جدید پیمائش میں تبدیل نہیں کیا جاتا۔"
      sources: [source/biruni-mactutor]
