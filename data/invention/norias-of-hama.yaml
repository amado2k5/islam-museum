        مطالعے ⁦(Hill، Schiøler — EI2 اور ویکیپیڈیا کے ذریعے)⁩ اس کے بڑے حجم اور پھیلاؤ
        کو اسلامی دور میں درج کرتے ہیں {cite:encyclopaedia-of-islam-2} {cite:wikipedia-norias-of-hama-en}.
