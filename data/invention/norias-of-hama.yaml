summary:
  ar: سبع عشرة ناعورة خشبية عملاقة تديرها مياه العاصي الجارية فترفع الماء في صناديق
    إلى قناة عليا تسقي مدينة حماة وبساتينها؛ أعظمها الناعورة المحمدية ⁦(761/1361)⁩
    بقطر نحو عشرين متراً، والنمط نفسه وصفته EI2 نموذجاً لنواعير العالم الإسلامي الوسيط
    {cite:encyclopaedia-of-islam-2 vol. VII, art. NA'URA} {cite:wikipedia-norias-of-hama-en}.
  en: Seventeen giant timber wheels turned by the current of the Orontes, lifting
    water in rim-boxes up to an aqueduct that feeds the city and gardens of Hama;
    the largest, the noria al-Muhammadiyya (761/1361), is about twenty metres across,
    and EI2 takes the Hama wheels as the pattern of the medieval Islamic noria {cite:encyclopaedia-of-islam-2
    vol. VII, art. NA'URA} {cite:wikipedia-norias-of-hama-en}.
  ur: سترہ بڑی لکڑی کی چرخیاں جو عاصی کے بہاؤ سے گھومتی ہیں اور کنارے لگے خانوں میں
    پانی اوپر کی نہر تک پہنچا کر حماہ شہر اور باغات کو سیراب کرتی ہیں؛ سب سے بڑی ناعورہ
    محمدیہ ⁦(761/1361)⁩ تقریباً بیس میٹر قطر کی ہے، اور EI2 حماہ کے چرخوں کو قرون
    وسطی کی اسلامی ناعورہ کا نمونہ مانتی ہے {cite:encyclopaedia-of-islam-2 vol. VII,
    art. NA'URA} {cite:wikipedia-norias-of-hama-en}.
