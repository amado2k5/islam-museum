today:
  form:
    ar: سبع عشرة ناعورة باقية على العاصي، كبراها المحمدية ⁦(761/1361)⁩ المسجلة معلماً
      لهندسة الميكانيكا ⁦(ASME، 2006)⁩؛ وحافظت عليها حماة هويةً ومنظراً وإن حلّت المضخات
      محل عملها {cite:wikipedia-norias-of-hama-en}.
    en: Seventeen norias survive on the Orontes, the largest being the Muhammadiyya
      (761/1361), registered as a Historic Mechanical Engineering Landmark (ASME,
      2006); Hama keeps them as identity and scenery even where pumps have taken over
      their work {cite:wikipedia-norias-of-hama-en}.
    ur: عاصی پر سترہ ناعوریں باقی ہیں، سب سے بڑی محمدیہ ⁦(761/1361)⁩ جو تاریخی میکینیکل
      انجینئری یادگار درج ہے ⁦(ASME، 2006)⁩؛ جہاں پمپوں نے ان کا کام لیا وہاں بھی
      حماہ انہیں اپنی پہچان اور حسن سمجھ کر سنبھالے ہے {cite:wikipedia-norias-of-hama-en}.
  descendants:
    ar: العجلة الرافعة نفسها ما زالت تعمل حيث تسمح الهيدروليكا — من مورسية إلى الأمريكتين
      — والنواعير أصل فكرة «الطاقة المجانية من الجريان» {cite:encyclopaedia-of-islam-2}.
    en: The same lifting wheel still works wherever the hydrology allows — from Murcia
      to the Americas — and the noria is the ancestor of the idea of free power from
      a flowing stream {cite:encyclopaedia-of-islam-2}.
    ur: وہی اٹھانے والا چرخہ آج بھی جہاں پانی کی صورت اجازت دے چلتا ہے — مورسیا سے
      امریکہ تک — اور ناعورہ «بہتے پانی سے مفت توانائی» کے تصور کی جڑ ہے {cite:encyclopaedia-of-islam-2}.
