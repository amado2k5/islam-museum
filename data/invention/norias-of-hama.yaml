origin:
  polity: polity/abbasid-caliphate
  context:
    ar: 'حماة على العاصي حيث ضعف مجرى النهر وعُلوّ ضفتيه يجعلان الناعورة أنسب رافعة
      ماء: لا ثيران ولا تروس، بل جريان النهر نفسه {cite:wikipedia-norias-of-hama-en}.'
    en: 'Hama on the Orontes, where the river''s weak gradient and high banks make
      the current-driven wheel the fittest water-lift: no oxen, no gears, only the
      river itself {cite:wikipedia-norias-of-hama-en}.'
    ur: 'عاصی کے کنارے حماہ، جہاں دریا کا ڈھلوان کمزور اور کنارے اونچے ہیں؛ یہاں بہاؤ
      سے چلنے والا چرخہ پانی اٹھانے کا موزوں ترین ذریعہ ہے: نہ بیل، نہ گیئر، صرف خود
      دریا {cite:wikipedia-norias-of-hama-en}.'
makers:
- person: person/al-idrisi-muhammad-ibn-abd-allah
  role: describer
  note: Al-Idrisi describes a comparable giant noria of about 90 cubits (roughly 50
    m) in diameter in the same Syrian system (EI2 NA'URA cites his Maghrib, Arabic
    p. 187).
  sources:
  - source/encyclopaedia-of-islam-2
- person: person/bilal-ibn-abi-burda
  role: commissioner
  place: place/basra
  note: Erected norias on the banks of a canal in the Basra area about 700 CE — the
    first Islamic noria attestation EI2 knows (al-Baladhuri, Futuh, 363); Basra, not
    Hama, but the same machine tradition the Hama wheels crown.
  sources:
  - source/encyclopaedia-of-islam-2
attribution:
  status: improvement
  claim:
    ar: 'آلة قديمة ⁦(يوصفها فيتروفيوس)⁩ صارت في المدن الإسلامية أكبر ما بلغته: قطر
      عشرين متراً عند حماة ونحو خمسين عند ما وصفه الإدريسي؛ والنواعير الباقية في حماة
      صناعة شامية وسيطة لا ادعاء اختراع أول {cite:encyclopaedia-of-islam-2}.'
    en: 'An ancient machine (described by Vitruvius) that reached its largest form
      in Islamic cities: twenty metres across at Hama and about fifty in al-Idrisi''s
      account; the surviving Hama wheels are medieval Syrian craft, not a claim of
      first invention {cite:encyclopaedia-of-islam-2}.'
    ur: 'ایک قدیم آلہ ⁦(ویٹروویس کی تحریر میں)⁩ جو اسلامی شہروں میں اپنی بڑی ترین
      صورت تک پہنچا: حماہ میں بیس میٹر قطر اور ادریسی کی تحریر میں پچاس تک؛ حماہ کی
      بچی ہوئی چرخیاں قرون وسطی کی شامی دستکاری ہیں، پہلی ایجاد کا دعویٰ نہیں {cite:encyclopaedia-of-islam-2}.'
  basis:
    ar: EI2 ⁦(مادة NA'URA)⁩ تؤرخ أول وصف بفيتروفيوس وأول ذكر إسلامي بنواعير بلال بن
      أبي بردة قرب البصرة نحو 700م، وتجعل عجلات حماة نموذج الصنع الوسيط؛ والمصادر
      الحديثة ⁦(عبر مقالة ويكيبيديا المسجلة)⁩ تثبت 17 ناعورة باقية والمحمدية 761/1361
      {cite:encyclopaedia-of-islam-2} {cite:wikipedia-norias-of-hama-en}.
    en: EI2 (article NA'URA) dates the first description to Vitruvius and the first
      Islamic mention to Bilal ibn Abi Burda's norias near Basra about 700 CE, and
      takes the Hama wheels as the medieval construction pattern; modern sources (per
      the recorded Wikipedia article) fix 17 surviving norias and the Muhammadiyya
      of 761/1361 {cite:encyclopaedia-of-islam-2} {cite:wikipedia-norias-of-hama-en}.
    ur: EI2 ⁦(مضمون NA'URA)⁩ پہلی تحریر ویٹروویس کو اور پہلی اسلامی گواہی بلال بن
      ابی بردہ کی ناعوروں کو ⁦(بصرہ، تقریباً 700ء)⁩ مانیتی ہے اور حماہ کے چرخوں کو
      قرون وسطی کی تعمیر کا نمونہ بناتی ہے؛ جدید ذرائع ⁦(درج شدہ ویکیپیڈیا مضمون)⁩
      17 بچی ہوئی ناعوریں اور محمدیہ 761/1361ء ثابت کرتے ہیں {cite:encyclopaedia-of-islam-2}
      {cite:wikipedia-norias-of-hama-en}.
  perspectives:
  - tradition: sunni
    stance:
      ar: سقي المدينة وقفٌ على النهر
      en: The city's watering, endowed on the river
      ur: شہر کی آبپاشی، دریا پر وقف شدہ
    summary:
      ar: 'سقي المدينة وقفٌ على النهر — النواعير جزء من مرافق المدينة: تسقي البساتين
        والحمامات والمساجد وصار صريرها من علامات حماة عند الجغرافيين المسلمين {cite:encyclopaedia-of-islam-2}.'
      en: 'The norias were part of the city''s utilities: they watered gardens, baths
        and mosques, and their creaking became a signature of Hama for Muslim geographers
        {cite:encyclopaedia-of-islam-2}.'
      ur: 'ناعورے شہر کی سہولتوں کا حصہ تھے: باغات، حماموں اور مسجدوں کو پانی دیتے
        اور ان کی آہٹ مسلم جغرافیہ دانوں کے نزدیک حماہ کی پہچان بن گئی {cite:encyclopaedia-of-islam-2}.'
    sources:
    - source/encyclopaedia-of-islam-2
  - tradition: academic
    stance:
      ar: تراث روماني بلغ ذروته إسلامياً
      en: A Roman inheritance brought to its peak under Islam
      ur: رومن میراث جو اسلامی دور میں عروج پر پہنچی
    summary:
      ar: تراث روماني بلغ ذروته إسلامياً — فيتروفيوس وصف الآلة، وفسيفساء أباميا ⁦(نحو
        350م)⁩ تُظهرها قرب حماة قبل الإسلام؛ والدراسات ⁦(Hill، Schiøler عبر EI2 وويكيبيديا)⁩
        تسجل كبر حجمها وانتشارها في العهد الإسلامي {cite:encyclopaedia-of-islam-2}
