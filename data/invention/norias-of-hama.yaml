kids:
  ar: تخيل عجلة خشبية ضخمة بحجم مبنى من ستة طوابق، تدور في النهر وحول حافتها صناديق.
    النهر يدفعها، والصناديق تمتلئ بالماء في الأسفل وتفرغه في قناة عالية في الأعلى،
    فيجري الماء إلى بساتين المدينة. سبع عشرة عجلة مثلها ما زالت قائمة في مدينة حماة
    السورية، وأكبرها بُنيت قبل أكثر من ستمئة سنة.
  en: Imagine a wooden wheel as tall as a six-storey building, turning in a river
    with boxes fixed around its rim. The river pushes it round; the boxes fill with
    water at the bottom and empty into a high channel at the top, carrying water to
    the city's gardens. Seventeen wheels like this still stand in the Syrian city
    of Hama, and the biggest was built over six hundred years ago.
  ur: سوچو ایک اتنا بڑا لکڑی کا پہیہ جتنی چھ منزلہ عمارت، دریا میں گھومتا ہو اور اس
    کے کنارے پر خانے لگے ہوں۔ دریا اسے چلائے؛ خانے نیچے پانی بھریں اور اوپر اونچی
    نہر میں ڈال دیں، جس سے پانی شہر کے باغوں تک جائے۔ ایسی سترہ پہیاں شام کے شہر حماہ
    میں آج بھی قائم ہیں اور سب سے بڑی چھ سو سال سے زیادہ پہلے بنی۔
