  changed:
    ar: سقت بساتين مدينة كاملة وحماماتها من نهر ضعيف الميل بلا وقود ولا بهائم؛ جعلت
      من الريف الحضري حول العاصي ممكناً لقرون {cite:wikipedia-norias-of-hama-en}.
    en: They watered a whole city's gardens and baths from a gentle river with no
      fuel and no animals; they made the urban orchard-belt around the Orontes possible
      for centuries {cite:wikipedia-norias-of-hama-en}.
    ur: کم ڈھلوان والے دریا سے پورے شہر کے باغ اور حمام سیراب کیے، نہ ایندھن نہ جانور؛
      صدیوں تک عاصی کے گرد شہری باغاتی پٹے کو ممکن بنایا {cite:wikipedia-norias-of-hama-en}.
  history:
    ar: 'أبقى شاهد حي على هندسة المياه الإسلامية: آلات خشبية تدور منذ القرون الوسطى
      حتى اليوم بلا انقطاع تقريباً، وأكبرها معلم هندسي مسجل ⁦(ASME 2006)⁩ {cite:wikipedia-norias-of-hama-en}.'
    en: 'The most durable living witness to Islamic water engineering: timber machines
      turning almost without break from the Middle Ages to today, the largest a registered
      engineering landmark (ASME 2006) {cite:wikipedia-norias-of-hama-en}.'
    ur: 'اسلامی آب انجینئری کا دیرپا زندہ شاہد: لکڑی کی مشینیں قرون وسطی سے آج تک
      تقریباً بلاناغہ گھومتی رہیں، سب سے بڑی درج شدہ انجینئری یادگار ہے ⁦(ASME 2006)⁩
      {cite:wikipedia-norias-of-hama-en}.'
  significance: 4
  why: Seventeen working medieval water-raising wheels on one river — the largest
