    status: historical
    note: Norias may have been operating in Hama itself by the ninth century, and
      many were working by the late twelfth (per the recorded Wikipedia article);
      the noria as a machine type is older — Vitruvius describes one, and Bilal ibn
      Abi Burda erected norias near Basra about 700. The surviving Hama wheels are
      medieval and later rebuilds.
    sources:
