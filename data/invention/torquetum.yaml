    status: historical
    note: The dated anchor is Franco of Poland's treatise of 1284, the earliest
      dated Latin description; Bernard of Verdun's undated text is of the same
      decade. On the Arabic side 'Izz al-Din al-Wafa'i's equatorial armilla —
      studied by Tekeli against the torquetum — is fifteenth-century
      Mamluk Cairo. Jabir ibn Aflah's earlier Islah al-Majisti describes a
      related instrument, not an identified torquetum.
