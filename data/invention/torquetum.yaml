  changed:
    ar: 'أعطى الفلكي آلة واحدة تقرأ السماء في ثلاثة أنظمة إحداثيات وتحوّل
      بينها ميكانيكياً، فكان حاسوباً تماثلياً للرصد قبل أن تكتب معادلات
      التحويل {cite:wikipedia-torquetum-en}.'
    en: 'It gave the astronomer one instrument that reads the sky in three
      coordinate systems and converts between them mechanically — an
      analogue computer for observation before the conversion equations were
      written out {cite:wikipedia-torquetum-en}.'
    ur: 'فلکیات دان کو ایک ایسا آلہ دیا جو آسمان کو تین محددی نظاموں میں پڑھتا
      اور میکانکی طور پر ان کے درمیان تبدیل کرتا — تحویل کی مساواتیں لکھی جانے
      سے پہلے مشاہدے کا ینالاگ کمپیوٹر {cite:wikipedia-torquetum-en}۔'
  history:
    ar: 'خدم رصد أوروبا قرنين ونصفاً: بيير دي ليموج رصد به مذنب هالي، ويظهر في
      لوحة «السفراء» لهولباين ⁦(1533)⁩ وفي «أسترونوميكوم كايساريوم» لأبيان
      ⁦(1540)⁩ {cite:wikipedia-torquetum-en}.'
    en: 'It served European observing for two and a half centuries: Peter of
      Limoges observed Halley''s comet with it, and it stands in Holbein''s
      Ambassadors ⁦(1533)⁩ and opens Apian''s Astronomicum Caesareum ⁦(1540)⁩
      {cite:wikipedia-torquetum-en}.'
    ur: 'ڈھائی صدیوں یورپی رصد کی خدمت کی: پیٹر آف لیموج نے اس سے ہیلی کا
      دمدار ستارہ دیکھا، اور یہ ہولبائن کی «سفیر» ⁦(1533)⁩ اور اپیان کی
      استرونومیکوم کایزاریوم ⁦(1540)⁩ میں موجود ہے {cite:wikipedia-torquetum-en}۔'
  significance: 3
  why: A specialised three-coordinate measuring engine shared between the
    Arabic and Latin instrument traditions; its own birth certificate is
    still contested, which is itself the honest lesson.
