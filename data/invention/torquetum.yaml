summary:
  ar: آلة رصد وسيطة تكوّنت من دوائر وصفائح مدرّجة على ثلاثة مستويات، تقيس موضع
    جرم سماوي في إحداثيات الأفق ثم تحوّل القراءة إلى الإحداثيات الاستوائية أو
    البروجية؛ وصفها لورش بأنها جمع بين «أسطرلابون» بطلميوس والأسطرلاب المستوي،
    وكأنها حاسوب تماثلي {cite:lorch-jabir-torquetum-1976} {cite:wikipedia-torquetum-en}.
  en: A medieval observing instrument built of graduated plates and circles on
    three levels, which measures a celestial body's position in horizon
    coordinates and converts the reading into equatorial or ecliptic
    coordinates; Lorch characterised it as a combination of Ptolemy's
    astrolabon and the plane astrolabe — in effect an analogue computer
    {cite:lorch-jabir-torquetum-1976} {cite:wikipedia-torquetum-en}.
  ur: قرون وسطی کا رصدی آلہ جو تین سطحوں پر درجہ بند صفائح اور دائروں سے بنا،
    کسی آسمانی جسم کی پوزیشن افقی محددات میں ناپتا اور پھر قراءت کو استوائی یا
    بروجی محددات میں بدلتا؛ لورش نے اسے بطلموس کے اسطرلابون اور مستوی اسطرلاب
    کا مجموعہ — دراصل ایک ینالاگ کمپیوٹر — قرار دیا {cite:lorch-jabir-torquetum-1976}
    {cite:wikipedia-torquetum-en}۔
