origin:
  polity: polity/umayyads-of-cordoba
  context:
    ar: منشأ الآلة غير محسوم — النصوص اللاتينية الأولى ⁦(ثمانينيات القرن الثالث
      عشر، قرب باريس على الأرجح)⁩ لا تسمي مخترعاً، بينما جمعت التقاليد اللاحقة
      اسمها بجابر بن أفلح الإشبيلي، وشهد الجانب الإسلامي آلة موازية عند الوفائي
      الميقاتي بقاهرة المماليك {cite:wikipedia-torquetum-en} {cite:encyclopaedia-of-islam-2}.
    en: The instrument's birthplace is unsettled — the earliest Latin texts
      (1280s, probably near Paris) name no inventor, while later tradition
      attached the name of Jabir ibn Aflah of Seville, and on the Islamic side
      al-Wafa'i's equatorial armilla in Mamluk Cairo is a parallel documented
      instrument {cite:wikipedia-torquetum-en} {cite:encyclopaedia-of-islam-2}.
    ur: آلہ کی جائے پیدائش غیر یقینی ہے — قدیم ترین لاطینی متون ⁦(1280ء کی دہائی،
      غالباً پیرس کے قرب)⁩ کوئی مخترع نہیں بتاتے، جب کہ بعد کی روایت نے اسے جابر
      بن افلح اشبیلی سے جوڑا، اور اسلامی جانب مملوک قاہرہ میں الوفائی کی استوائی
      حلقہ ایک موازی مستند آلہ ہے {cite:wikipedia-torquetum-en} {cite:encyclopaedia-of-islam-2}۔
makers:
- person: person/jabir-ibn-aflah
  role: disputed
  note: The Seville astronomer's Islah al-Majisti describes a related
    coordinate-converting instrument; Regiomontanus (1469) credited him as the
    torquetum's inventor, but Lorch judged the described device similar in
    function rather than an identified torquetum — evidence it inspired the
    type rather than naming its maker.
  sources:
  - source/wikipedia-torquetum-en
  - source/lorch-jabir-torquetum-1976
- person: person/abd-al-aziz-al-wafai
  role: describer
  place: place/cairo
  note: The fifteenth-century Cairo muwaqqit built an equatorial armilla that
    Tekeli studied in direct comparison with the torquetum — the documented
    Islamic-side parallel, not a claim that he invented the type.
  sources:
  - source/encyclopaedia-of-islam-2
attribution:
  status: contested
  claim:
    ar: 'قديم أوصاف التوركيتوم عربية ولاتينية معاً؛ ونسبة الاختراع إلى جابر بن
      أفلح أقامها ريجيومونتانوس ⁦(1469)⁩ على آلة مشابهة في «إصلاح المجسطي»،
      لا على توركيتوم محدد، بينما أول النصوص اللاتينية ⁦(1284)⁩ صامتة عن
      المخترع {cite:wikipedia-torquetum-en} {cite:lorch-jabir-torquetum-1976}.'
    en: 'The torquetum''s earliest descriptions are both Arabic-side and Latin;
      the attribution of its invention to Jabir ibn Aflah rests on
      Regiomontanus ⁦(1469)⁩ reading a similar instrument into the Islah
      al-Majisti, not on an identified torquetum, while the first Latin texts
      ⁦(1284)⁩ are silent about any inventor {cite:wikipedia-torquetum-en}
      {cite:lorch-jabir-torquetum-1976}.'
    ur: 'تورکیتوم کی قدیم ترین تفصیلات عربی اور لاطینی دونوں جانب ہیں؛ جابر بن
      افلح سے اس کی ایجاد کا نسب ریجیومونتانوس ⁦(1469)⁩ نے اصلاح المجسطی کے ایک
      مشابہ آلہ پر قائم کیا نہ کہ کسی مخصوص تورکیتوم پر، اور پہلے لاطینی متون
      ⁦(1284)⁩ مخترع کے بارے میں خاموش ہیں {cite:wikipedia-torquetum-en}
      {cite:lorch-jabir-torquetum-1976}۔'
  basis:
    ar: 'لورش يشرح آلة جابر الموصوفة في «إصلاح المجسطي» بأنها مشابهة الوظيفة
      مُلهِمة للتوركيتوم لا مطابقة له؛ والنصوص اللاتينية المؤرخة تبدأ بفرانكو
      البولندي ⁦(1284)⁩ وبرنار دو فردون غير المؤرخ؛ وعلى الجانب الإسلامي درس
      تكلي حلقة الوفائي الاستوائية بقاهرة القرن الخامس عشر مقارنةً بالتوركيتوم
      {cite:lorch-jabir-torquetum-1976} {cite:wikipedia-torquetum-en} {cite:encyclopaedia-of-islam-2}.'
    en: 'Lorch reads Jabir''s described instrument as similar in function and a
      likely inspiration, not an identified torquetum; the dated Latin texts
      begin with Franco of Poland ⁦(1284)⁩ and the undated Bernard of Verdun;
      on the Islamic side Tekeli studied al-Wafa''s fifteenth-century
      equatorial armilla against the torquetum {cite:lorch-jabir-torquetum-1976}
      {cite:wikipedia-torquetum-en} {cite:encyclopaedia-of-islam-2}.'
    ur: 'لورش جابر کے بیان کردہ آلہ کو مشابہ وظیفہ اور ممکنہ اخذ مانتا ہے نہ کہ
      مخصوص تورکیتوم؛ مؤرخ لاطینی متون فرانکو پولشی ⁦(1284)⁩ اور غیر مؤرخ برنار
      دو فردون سے شروع ہوتے ہیں؛ اسلامی جانب تیکلی نے الوفائی کی پندرہویں صدی
      کی استوائی حلقہ کا موازنہ تورکیتوم سے کیا {cite:lorch-jabir-torquetum-1976}
      {cite:wikipedia-torquetum-en} {cite:encyclopaedia-of-islam-2}۔'
  perspectives:
  - tradition: sunni
    id: islamic-priority-claimed
    summary:
      ar: 'نسبة عباسية-أندلسية بلا إثبات — في الإطار السني العام تُروى الآلة
        على أنها من أعمال فلكيي الإسلام، ونسبها ريجيومونتانوس إلى جابر بن أفلح
        ⁦(إشبيلية القرن الثاني عشر)⁩، لكن الشاهد المباشر غائب والنص العربي
        الموصوف آلة موازية لا التوركيتوم نفسه {cite:wikipedia-torquetum-en}.'
      en: 'An Andalusi-Islamic attribution, unproven — in the museum''s Sunni
        default frame the instrument is told as the work of Islamic
        astronomers, Regiomontanus assigning it to Jabir ibn Aflah of
        twelfth-century Seville, but the direct witness is missing and the
        Arabic text describes a parallel instrument, not the torquetum itself
        {cite:wikipedia-torquetum-en}.'
      ur: 'اندلسی-اسلامی نسبت بغیر ثبوت — سنی عمومی فریم میں آلہ اسلامی ماہرین
        فلکیات کی پیداوار کہا جاتا ہے، ریجیومونتانوس نے جابر بن افلح اشبیلی
        ⁦(بارہویں صدی)⁩ سے جوڑا، مگر براہ راست شاہد غائب ہے اور عربی متن موازی
        آلہ بیان کرتا ہے نہ کہ خود تورکیتوم {cite:wikipedia-torquetum-en}۔'
    sources:
    - source/wikipedia-torquetum-en
    - source/lorch-jabir-torquetum-1976
  - tradition: academic
    id: invention-place-unsettled
    summary:
      ar: 'مكان الميلاد بين الشرق والغرب غير محسوم — لورش وتحقيق حديث يسجلان
        أن أقدم النصوص المعروفة لاتينية من ثمانينيات القرن الثالث عشر لا تسمي
        مخترعاً ولا تفسر اسم «turketum»؛ ووُثقت آلة مبسطة منه في مرصد الصين
        ⁦(1276–1279)⁩ نُسب نقلها إلى جمال الدين ⁦(1267)⁩ {cite:lorch-jabir-torquetum-1976}
        {cite:wikipedia-torquetum-en}.'
      en: 'The birthplace between East and West is unsettled — Lorch and a
        recent scholarly survey record that the earliest known texts are Latin,
        of the 1280s, naming no inventor and not explaining the word
        "turketum"; a simplified version is documented at the Yuan Chinese
        observatory ⁦(1276–1279)⁩ with Jamal al-Din credited as its 1267
        transmitter {cite:lorch-jabir-torquetum-1976} {cite:wikipedia-torquetum-en}.'
      ur: 'شرق و مغرب کے درمیان جائے پیدائش غیر یقینی — لورش اور جدید علمی جائزہ
        لکھتے ہیں کہ قدیم ترین معلوم متون لاطینی ہیں ⁦(1280ء کی دہائی)⁩ جو نہ
        مخترع بتاتے ہیں نہ لفظ «turketum» کی وضاحت؛ چین کے یوآن رصدگاہ میں سادہ
        قسم مستند ہے ⁦(1276–1279)⁩ جس کی منتقلی جمال الدین سے ⁦(1267)⁩ منسوب
        ہے {cite:lorch-jabir-torquetum-1976} {cite:wikipedia-torquetum-en}۔'
    sources:
