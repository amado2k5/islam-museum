summary:
  ar: 'مبرهنة هندسية أوردها مؤيد الدين العرضي في «كتاب الهيئة» ⁦(ت 1266)⁩
      توسع نظرية أبلونيوس: تسمح باستبدال فلك تدوير يدور حول مركز منتصف
      مسافة المميزة بمميزة بطلميوس نفسها، فيقوم النموذج بعمل النقطة
      المميزة دون مخالفة قاعدة المركز الأرضي. حجّ ساليبا من مخطوطة مارش
      621 أن أعمال العرضي سبقت الطوسي، وعدّ نيوجباور ⁦(1957)⁩ أعمال مدرسة
      مراغة واردة إلى أوروبا عبر ابن الشاطر فمؤثرة في كوبرنيك
      {cite:wikipedia-muayyad-al-din-al-urdi-en} {cite:schmidl-urdi-bea-2007}
      {cite:saliba-islamic-science-2007}.'
  en: 'A geometrical theorem in Mu''ayyad al-Din al-Urdi''s Kitab al-Haya
      (d. 1266) extending Apollonius'' theorem: it lets a model replace
      Ptolemy''s equant with an epicycle turning about a centre at half
      the distance to the equant point, doing the equant''s work without
      breaking the earth-centred rule. Saliba argued from Bodleian Marsh
      621 that al-Urdi''s non-Ptolemaic contributions preceded al-Tusi''s,
      and Neugebauer (1957) judged the Maragha school''s work, perhaps via
      Ibn al-Shatir, received in fifteenth-century Europe and ultimately
      influencing Copernicus {cite:wikipedia-muayyad-al-din-al-urdi-en}
      {cite:schmidl-urdi-bea-2007} {cite:saliba-islamic-science-2007}.'
  ur: 'مؤید الدین عرضی کی کتاب الھیئت ⁦(وفات 1266ء)⁩ میں ایک ہندسی قضیہ جو
      اپولونیوس کے قضیے کو بڑھاتا ہے: بطلموس کی مميزہ کی جگہ فلک تدویر
      چلتا جو مميزہ نقطے کے نصف فاصلے والے مرکز کے گرد گھومتا ہے، زمینی
      مرکز کا اصول توڑے بغیر مميزہ کا کام انجام دیتا۔ صلیبا نے مخطوطہ
      مارش 621 سے استدلال کیا کہ عرضی کی غیر بطلمیسی شراکتیں طوسی سے
      پہلی تھیں، اور نیوگباؤر ⁦(1957)⁩ نے کہا مدرسۂ مراغہ کا کام شاید ابن
      الشاطر کے ذریعے پندرہویں صدی کی یورپ پہنچا اور بالآخر کوپرنیکس پر
      اثر ڈالا {cite:wikipedia-muayyad-al-din-al-urdi-en}
      {cite:schmidl-urdi-bea-2007} {cite:saliba-islamic-science-2007}۔'
  es: "Un teorema geométrico en el Kitab al-Haya de Mu'ayyad al-Din al-Urdi (m. 1266) que extiende el teorema de Apolonio: permite que un modelo reemplace el ecuante de Ptolomeo con un epiciclo que gira alrededor de un centro a la mitad de la distancia al punto del ecuante, haciendo el trabajo del ecuante sin romper la regla geocéntrica. Saliba argumentó desde Bodleian Marsh 621 que las contribuciones no ptolemaicas de al-Urdi precedieron a las de al-Tusi, y Neugebauer (1957) juzgó que el trabajo de la escuela Maragha, tal vez a través de Ibn al-Shatir, fue recibido en la Europa del siglo XV y finalmente influyó en Copérnico {cite:wikipedia-muayyad-al-din-al-urdi-en} {cite:schmidl-urdi-bea-2007} {cite:saliba-islamic-science-2007}."
  fr: "Un théorème géométrique du Kitab al-Haya de Mu'ayyad al-Din al-Urdi (mort en 1266) étend le théorème d'Apollonius: il permet de remplacer l'équante de Ptolémée par un épicycle tournant autour d'un centre situé à mi-distance du point d'équante, accomplissant ainsi la fonction de l'équante sans enfreindre la loi géocentrique. Saliba, s'appuyant sur Bodleian Marsh 621, a soutenu que les contributions non ptolémaïques d'al-Urdi étaient antérieures à celles d'al-Tusi, et Neugebauer (1957) a estimé que les travaux de l'école de Maragha, peut-être par l'intermédiaire d'Ibn al-Shatir, avaient été reçus en Europe au XVe siècle et avaient finalement influencé Copernic."
