kids:
  ar: 'تخيل ساعة يقول صانعها إن عقربها يجب أن يدور حول نقطة ليست في
      المركز — فيشعر المهندس أن هذا خطأ. وجد العرضي طريقة لصنع الدوران
      نفسه بعجلات تدور حول المركز الصحيح فقط، فحلّ مشكلة حيّرت الفلكيين
      ألف عام.'
  en: 'Imagine a clock whose maker says its hand must turn around a point
      that is not the centre — an engineer feels this is wrong. Al-Urdi
      found a way to produce the same turning with wheels that turn only
      around the proper centre, solving a problem that had puzzled
      astronomers for a thousand years.'
  ur: 'ایک گھڑی سوچو جس کا ساز کہے کہ سوئی ایسے نقطے کے گرد گھومنی چاہیے
      جو مرکز نہیں — انجینئر کو یہ غلط لگے گا۔ عرضی نے وہی گھماؤ صرف درست
      مرکز کے گرد گھومنے والی پہیوں سے پیدا کرنے کا طریقہ نکالا، اور ہزار
      سال کا مسئلہ حل کیا۔'
