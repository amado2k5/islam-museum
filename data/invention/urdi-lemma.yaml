      جس نے بطلموس کے سیاروں کے نمونوں کی اصلاح کی — ایک مرکز کے گرد
      یکساں حرکت کی خلاف ورزی کرنے والی مميزہ کو ہٹانا
      {cite:wikipedia-muayyad-al-din-al-urdi-en} {cite:schmidl-urdi-bea-2007}۔'
