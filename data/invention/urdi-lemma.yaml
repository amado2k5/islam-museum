today:
  form:
    ar: 'تُدرَّس القضية في تاريخ الفلك نصاً برهانياً من «كتاب الهيئة»،
      وطبعة ساليبا ⁦(1990)⁩ تجعلها في قلب إصلاح مراغة البطلمي
      {cite:wikipedia-muayyad-al-din-al-urdi-en}.'
    en: 'The lemma is studied as a proved text in the Kitab al-Haya;
      Saliba''s 1990 edition places it at the heart of the Maragha reform
      of Ptolemy {cite:wikipedia-muayyad-al-din-al-urdi-en}.'
    ur: 'قضیہ تاریخِ فلکیات میں کتاب الھیئت کے اثباتی متن کے طور پر پڑھایا
      جاتا ہے؛ صلیبا کی 1990ء ایڈیشن اسے مراغہ کی بطلمیسی اصلاح کے قلب
      میں رکھتی ہے {cite:wikipedia-muayyad-al-din-al-urdi-en}۔'
  descendants:
    ar: 'يحمل تراثها منهج النماذج المركبة: كسر الحركة المعقدة إلى دوائر
      منتظمة — روح استمرت في آليات كوبرنيك وفي التحليل الفورييه اللاحق
      {cite:wikipedia-muayyad-al-din-al-urdi-en}.'
    en: 'Its legacy is the composite-model method: break complex motion
      into uniform circles — a spirit continued in Copernican mechanisms
      and later in Fourier analysis {cite:wikipedia-muayyad-al-din-al-urdi-en}.'
    ur: 'اس کی میراث مرکب نمونہ سازی کا منہج ہے: پیچیدہ حرکت کو یکساں
      دائروں میں توڑنا — وہی روح کوپرنیکس کے میکانزم اور بعد میں فوریے
      تجزیہ میں جاری رہی {cite:wikipedia-muayyad-al-din-al-urdi-en}۔'
