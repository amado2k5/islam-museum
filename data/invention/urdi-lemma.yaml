  context:
    ar: 'كتب العرضي «كتاب الهيئة» في سياق مرصد مراغة الذي شارك في بنائه
      من سنة 1259؛ والقضية جزء من برنامج مدرسة مراغة لإصلاح نماذج بطلميوس
      الكوكبية — إزالة المميزة المخالفة للحركة المنتظمة حول مركز واحد
