      single centre {cite:wikipedia-muayyad-al-din-al-urdi-en}
      {cite:schmidl-urdi-bea-2007}.'
    ur: 'عرضی نے کتاب الھیئت اس مراغہ رصدگاہ کے ماحول میں لکھی جس کی تعمیر
