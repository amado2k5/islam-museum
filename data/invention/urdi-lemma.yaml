spread: []
impact:
  fields:
  - astronomy-instruments
  - mathematics
  changed:
    ar: 'أعطت الهندسة حلاً لمشكلة المميزة داخل الفلك المركزي: بدل تحريك
      الكوكب بالنظر إلى نقطة غير مركز الفلك، صنعت القضية تدويراً مكافئاً
      يحفظ الحركة المنتظمة — خطوة مدرسة مراغة في فصل النماذج
      {cite:wikipedia-muayyad-al-din-al-urdi-en}.'
    en: 'It gave geometry a fix for the equant problem inside geocentric
      astronomy: instead of driving the planet with respect to a point
      off the deferent''s centre, the lemma builds an equivalent
      epicycle that keeps uniform motion — the Maragha school''s step in
      separating the models {cite:wikipedia-muayyad-al-din-al-urdi-en}.'
    ur: 'زمینی مرکز کے اندر مميزہ کا مسئلہ ہندسہ سے حل کیا: سیارے کو فلک
      کے مرکز سے باہر نقطے کے لحاظ سے چلانے کے بجائے قضیہ ایک مساوی فلک
      تدویر بناتا جو یکساں حرکت برقرار رکھتا ہے — مدرسۂ مراغہ کا نمونے
      الگ کرنے کا قدم {cite:wikipedia-muayyad-al-din-al-urdi-en}۔'
  history:
    ar: 'انتقلت من «كتاب الهيئة» إلى مؤلفات بار هبراوس وقطب الدين الشيرازي
      واقتباسات ابن الشاطر؛ ويعدّ نيوجباور ⁦(1957)⁩ وساليبا أن مضمونها —
      عبر القناة الدمشقية — جزء من المادة التي بلغت كوبرنيك
      {cite:wikipedia-muayyad-al-din-al-urdi-en}.'
    en: 'It travelled from the Kitab al-Haya into Bar Hebraeus, Qutb
      al-Din al-Shirazi and Ibn al-Shatir''s quotations; Neugebauer
      (1957) and Saliba count its content — along the Damascus channel —
      part of the material that reached Copernicus
      {cite:wikipedia-muayyad-al-din-al-urdi-en}.'
    ur: 'کتاب الھیئت سے بار ہیبراوس، قطب الدین شیرازی اور ابن الشاطر کے
      اقتباسات تک پہنچی؛ نیوگباؤر ⁦(1957)⁩ اور صلیبا اس کے مضمون کو —
      دمشقی راستے — کوپرنیکس تک پہنچنے والے مواد کا حصہ مانتے ہیں
      {cite:wikipedia-muayyad-al-din-al-urdi-en}۔'
  significance: 4
  why: A single theorem inside one treatise that re-engineered Ptolemy's
    worst feature; whether or not it directly reached Copernicus, it is
    the clearest exhibit of the Maragha school solving by geometry what
    the Greeks left contradictory.
