today:
  form:
    ar: "القيمة الحديثة المعتمدة للميل نحو 23°26′ تتغير ببطء؛ أما القيمة التاريخية 23°35′ فهي ما دوّنه الفرغاني وكتب الفلك اللاحقة."
    en: "The modern accepted obliquity is about 23°26′ and drifts slowly; the historical 23°35′ is what al-Farghani and later astronomical books recorded."
    ur: "جدید مقبول جھکاؤ تقریباً 23°26′ ہے جو آہستہ بدلتا ہے؛ تاریخی 23°35′ وہی ہے جو الفرغانی اور بعد کی فلکیاتی کتابوں نے لکھا۔"
  descendants:
    ar: "يبقى مفهوم الميل أساساً في فهم لماذا تتعاقب الفصول والاعتدالين وميلان محور الأرض عن مدارها."
    en: "The obliquity remains the basis for understanding why the seasons, equinoxes and Earth's axial tilt behave as they do."
    ur: "جھکاؤ کا تصور اب بھی موسوموں، اعتدالین اور زمین کے محور کے جھکاؤ کی وضاحت کی بنیاد ہے۔"
