id: invention/mayl-falak-al-buruj
class: invention
label: { ar: "ميل فلك البروج", en: "The obliquity of the ecliptic", ur: "فلکِ بروج کا جھکاؤ", es: "La oblicuidad de la eclíptica", fr: "L'obliquité de l'écliptique", tr: "Burç eğimi", id: "Kemiringan zodiak" }
names:
  - { value: "mayl falak al-burūj", kind: alternate, lang: ar }
  - { value: "obliquity of the ecliptic", kind: alternate, lang: en }
  - { value: "obliquity of the zodiac", kind: alternate, lang: en }
summary:
  ar: "الزاوية بين فلك البروج — مسار الشمس السنوي — واستواء النهار، كان الفرغاني يذكر فيها قيمة بطلميوس 23 درجة و51 دقيقة وقياساً ممتحناً أُمر به في زمن المأمون فاجتمع عليه العلماء على 23 درجة و35 دقيقة {cite:farghani-elements-astronomy p. 112} {cite:farghani-elements-astronomy p. 150} {cite:tdv-ilm-i-felek}."
  en: "The angle between the ecliptic — the Sun's yearly path — and the equinoctial: al-Farghani records Ptolemy's value of 23 degrees 51 minutes and a verified measurement ordered in al-Ma'mun's time on which the scholars agreed at 23 degrees 35 minutes {cite:farghani-elements-astronomy p. 112} {cite:farghani-elements-astronomy p. 150} {cite:tdv-ilm-i-felek}."
  ur: "فلکِ بروج — سورج کے سالانہ راستے — اور استوائے فلک کے درمیان کا زاویہ: الفرغانی اس میں بطلمیوس کی قیمت 23 درجے 51 منٹ اور مامون کے زمانے میں حکم دی گئی ایک تصدیق شدہ پیمائش بیان کرتا ہے جس پر ماہرین 23 درجے 35 منٹ پر متفق ہوئے {cite:farghani-elements-astronomy p. 112} {cite:farghani-elements-astronomy p. 150} {cite:tdv-ilm-i-felek}۔"
  es: "El ángulo entre la eclíptica —la trayectoria anual del Sol— y el equinoccial: al-Farghani registra el valor de Ptolomeo de 23 grados 51 minutos y una medición verificada ordenada en la época de al-Ma'mun en la que los eruditos coincidieron en 23 grados 35 minutos {cite:farghani-elements-astronomy p. 112} {cite:farghani-elements-astronomy p. 150} {cite:tdv-ilm-i-felek}."
  fr: "L'angle entre l'écliptique — la trajectoire annuelle du Soleil — et l'équinoxe: al-Farghani rapporte la valeur de Ptolémée de 23 degrés 51 minutes et une mesure vérifiée ordonnée à l'époque d'al-Ma'mun sur laquelle les savants s'accordaient à 23 degrés 35 minutes {cite:farghani-elements-astronomy p. 112} {cite:farghani-elements-astronomy p. 150} {cite:tdv-ilm-i-felek}."
  tr: "Ekliptik (güneşin yıllık yörüngesi) ile ekinoks arasındaki açı için, El-Fargani, Batlamyus'un 23 derece 51 dakika değerini ve El-Ma'mun zamanında yaptırılan ve âlimlerin 23 derece 35 dakika üzerinde hemfikir olduğu test edilmiş bir ölçümü belirtmiştir. {cite:farghani-elements-astronomy s. 112} {cite:farghani-elements-astronomy s. 150} {cite:tdv-ilm-i-felek}."
  id: "Sudut antara ekliptika — lintasan tahunan matahari — dan ekuinoks, Al-Farghani menyebutkan nilai Ptolemy sebesar 23 derajat dan 51 menit dan pengukuran teruji yang diperintahkan pada masa Al-Ma'mun, yang disepakati oleh para ulama sebesar 23 derajat dan 35 menit {cite:farghani-elements-astronomy p. 112} {cite:farghani-elements-astronomy p. 150} {cite:tdv-ilm-i-felek}."
