kids:
  ar: "تخيّل أن الأرض تدور وهي مائلة قليلاً، فمسار الشمس السنوي على السماء يميل أيضاً بزاوية صغيرة عن خط الاستواء. قاس الفلكيون المسلمون هذه الزاوية في زمن المأمون فوجدوها نحو 23 درجة و35 دقيقة، وكتب الفرغاني الرقم في كتابه."
  en: "Imagine the Earth spinning while tilted a little, so the Sun's yearly path on the sky tilts by a small angle from the equator line. Muslim astronomers measured that angle in al-Ma'mun's time and found about 23 degrees 35 minutes; al-Farghani wrote the number in his book."
  ur: "تصور کریں کہ زمین گھومتی ہے مگر تھوڑی سی مڑی ہوئی، اس لیے سورج کا سالانہ راستہ آسمان پر استوا کی لکیر سے ایک چھوٹے زاویے پر مائل ہے۔ مسلم فلکیات دانوں نے مامون کے زمانے میں اس زاویے کی پیمائش کی اور تقریباً 23 درجے 35 منٹ پایا؛ الفرغانی نے یہ عدد اپنی کتاب میں لکھا۔"
