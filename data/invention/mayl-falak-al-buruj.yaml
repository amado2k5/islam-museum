origin:
  place: place/samarra
  polity: polity/abbasid-caliphate
  context:
    ar: "أُجري القياس الممتحن في عهد المأمون الذي اتخذ سامراء داراً ومأمنَ علم في النصف الأول من القرن الثالث الهجري، ودوّنه الفرغاني في كتابه {cite:farghani-elements-astronomy p. 112} {cite:tdv-ilm-i-felek}."
    en: "The verified measurement was carried out under al-Ma'mun, who made Samarra his seat and a refuge of learning in the first half of the third century AH, and al-Farghani recorded the result in his book {cite:farghani-elements-astronomy p. 112} {cite:tdv-ilm-i-felek}."
    ur: "تصدیق شدہ پیمائش مامون کے دور میں ہوئی جس نے تیسری صدی ہجری کے پہلے نصف میں سامراء کو اپنا مسکن اور علم کی پناہ گاہ بنایا، اور الفرغانی نے اس کا نتیجہ اپنی کتاب میں لکھا {cite:farghani-elements-astronomy p. 112} {cite:tdv-ilm-i-felek}۔"
makers:
  - person: person/al-farghani
    role: describer
    place: place/baghdad
    note: "Al-Farghani records both values in his treatise: Ptolemy's 23°51' and the al-Ma'mun measurement of 23°35' on which the scholars agreed {cite:farghani-elements-astronomy pp. 112, 150}. He transmits the measurement tradition; he is not recorded as the measurer."
    sources: [source/farghani-elements-astronomy]
attribution:
  status: transmission
  claim:
    ar: "القياس الدقيق لميل فلك البروج لم يخترعه الفرغاني؛ إنه نقل قياساً ممتحناً أمر به المأمون في القرن الثالث الهجري وخالف قيمة بطلميوس، ونسب مفهوم الميل نفسه إلى فلك قديم."
    en: "The precise measurement of the obliquity was not al-Farghani's invention; he transmitted a verified measurement ordered by al-Ma'mun in the third century AH that differed from Ptolemy's value, within an ancient concept of obliquity."
    ur: "فلکِ بروج کے جھکاؤ کی درست پیمائش الفرغانی کی ایجاد نہیں تھی؛ اس نے تیسری صدی ہجری میں مامون کے حکم پر کی گئی تصدیق شدہ پیمائش منتقل کی جو بطلمیوس کی قیمت سے مختلف تھی، اور جھکاؤ کا تصور خود قدیم ہے۔"
  basis:
    ar: "يذكر الفرغاني أن بطلميوس قدّر الميل بـ23 درجة و51 دقيقة، وأنه قيس في زمن المأمون فوجد 23 درجة و35 دقيقة واجتمع عليه العلماء {cite:farghani-elements-astronomy p. 112}. ويكرر القيمة نفسها في فصله عن حسابات الفلك {cite:farghani-elements-astronomy p. 150}."
    en: "Al-Farghani reports Ptolemy estimated the obliquity at 23°51', and that it was measured in al-Ma'mun's time as 23°35' on which the scholars agreed {cite:farghani-elements-astronomy p. 112}. He repeats the same value in his chapter on spherical computations {cite:farghani-elements-astronomy p. 150}."
    ur: "الفرغانی بیان کرتا ہے کہ بطلمیوس نے جھکاؤ کا اندازہ 23 درجے 51 منٹ لگایا، اور مامون کے زمانے میں یہ 23 درجے 35 منٹ ناپا گیا جس پر ماہرین متفق ہوئے {cite:farghani-elements-astronomy p. 112}۔ وہ اپنی فلکیاتی حسابات کے باب میں بھی یہی قیمت دہراتا ہے {cite:farghani-elements-astronomy p. 150}۔"
precursors:
  - external: { ar: "قيمة بطلميوس للميل — 23°51′", en: "Ptolemy's value for the obliquity — 23°51′", ur: "بطلمیوس کی جھکاؤ کی قیمت — 23°51′" }
    note: "The Almagest value stood for centuries until the Abbasid re-measurement corrected it {cite:farghani-elements-astronomy p. 112} {cite:tdv-ilm-i-felek}."
    sources: [source/farghani-elements-astronomy, source/tdv-ilm-i-felek]
  - external: { ar: "مفهوم الميل في الفلك القديم", en: "The concept of obliquity in ancient astronomy", ur: "قدیم فلکیات میں جھکاؤ کا تصور" }
    note: "The tilt of the ecliptic from the equinoctial was known to Greek and Indian astronomy before the Abbasid measurement {cite:tdv-ilm-i-felek} {cite:farghani-elements-astronomy p. 112}."
    sources: [source/tdv-ilm-i-felek, source/farghani-elements-astronomy]
dependents:
  - external: { ar: "حسابات التقاويم ومواقيت الفصول", en: "Calendar computations and the reckoning of seasons", ur: "تقویموں کے حساب اور موسوموں کا تعین" }
    note: "The obliquity fixes the Sun's declination range and hence the lengths of days, seasons and the qibla's seasonal variation {cite:farghani-elements-astronomy pp. 112, 150}."
    sources: [source/farghani-elements-astronomy]
  - external: { ar: "جداول السمت والقبلة في التراث الإسلامي", en: "Tables of azimuth and qibla in the Islamic tradition", ur: "اسلامی تراث میں سمت و قبلہ کی جداول" }
    note: "Later zij tables and qibla tables built on the corrected obliquity and the spherical geometry of al-Farghani's curriculum {cite:farghani-elements-astronomy p. 150} {cite:tdv-ilm-i-felek}."
    sources: [source/farghani-elements-astronomy, source/tdv-ilm-i-felek]
spread: []
impact:
  fields: [astronomy-instruments, timekeeping]
  changed:
    ar: "استبدلت القياسات الممتحنة في زمن المأمون قيمة بطلميوس، فصارت أرقام المنهج العباسي أدقّ، وبقيت القيمة المصححة 23°35′ هي أساس جداول الفلك اللاحقة."
    en: "The verified measurements of al-Ma'mun's age replaced Ptolemy's figure, so the Abbasid curriculum's numbers grew more accurate, and the corrected 23°35′ remained the basis of later astronomical tables."
    ur: "مامون کے دور کی تصدیق شدہ پیمائشوں نے بطلمیوس کی قیمت بدل دی، اس لیے عباسی نصاب کے اعداد زیادہ درست ہوئے، اور تصحیح شدہ 23°35′ بعد کی فلکیاتی جداول کی بنیاد رہی۔"
  history:
    ar: "غيّر القياس العباسي رقماً ورثه الفلك الإسلامي من المجسطي، ومهّد لثقافة القياس الدقيقة في علم الهيئة."
    en: "The Abbasid measurement changed a figure inherited from the Almagest and prepared the culture of precise measurement in hay'a science."
    ur: "عباسی پیمائش نے مجسطی سے وراثت میں ملی ایک قیمت بدل دی اور ہیئات کے علم میں درست پیمائش کی ثقافت کی راہ ہموار کی۔"
  significance: 3
  why: "The concept is ancient and the measurement commissioned by a caliph; al-Farghani's role is documentary. Significance rests on the documented correction of a Ptolemaic figure within the Islamic curriculum."
