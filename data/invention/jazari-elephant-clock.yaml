kids:
  ar: "تخيّل ساعة كبيرة فوقها فيل! كل نصف ساعة يتحرك كل شيء: الطائر يغني، والثعبان ينزل ليأكل، والكاتب يدير قلمه. صنعها مهندس اسمه الجزري قبل ثمانمائة سنة، وكان يشرح كل آلتها في كتاب مصور يمكنك تقليده."
  en: "Imagine a big clock with an elephant on top! Every half hour everything moves: the bird sings, the dragon dips down to feed, and the scribe turns his pen. An engineer named al-Jazari built it eight hundred years ago, and he explained every one of its mechanisms in a picture book you can copy."
  ur: "سوچو ایک بڑی گھڑی جس پر ہاتھی بٹھا ہو! ہر آدھے گھنٹے سب کچھ ہلتا ہے: پرندہ گاتا، اژدہا اتر کر چارہ کھاتا، اور کاتب اپنا قلم گھماتا۔ اسے جزری نامی انجینیر نے آٹھ سو سال پہلے بنایا، اور اس نے اپنی ہر مشین کی وضاحت ایک مصور کتاب میں کی جسے تم نقل سکتے ہو۔"
