summary:
  ar: "ساعة مائية ميكانيكية صنعها الجزري نحو 602هـ/1206م لناصر الدين محمد أرتق: فيل يحمل صندوقاً وهيكلاً، وفوقه طائر يغني وكاتب يتحرك قلمه مع الوقت وثعبان يهبط ليطعم ترتيباً حركياً معقداً — أشهر آلاته الموثقة في كتابه «الجامع بين العلم والعمل النافع»."
  en: "A mechanical water clock built by al-Jazari c. 602 AH/1206 CE for the Artuqid ruler Nasir al-Din Muhammad: an elephant bearing castle and figures, a singing bird on top, a scribe whose pen moves with the hours and a dragon that dips to feed, a complex kinetic pageant — his most famous documented machine in 'the Book of Knowledge of Ingenious Mechanical Devices'."
  ur: "جزری کی602ھ/1206ء میں ارطقی حکمران ناصر الدین محمد کے لیے بنائی میکانکی پانی گھڑی: قلعہ اور مجسمے اٹھائے ہاتھی، چوٹی پر گانے والا پرندہ، کاتب جس کا قلم گھنٹوں کے ساتھ چلتا، اور اتر کر چارہ دینے والا اژدہا — اس کی کتاب «الجامع بین العلم والعمل النافع» میں دستاویزی مشہور ترین مشین۔"
  es: "Un reloj de agua mecánico construido por al-Jazari alrededor del año 602 AH/1206 d. C. para el gobernante artúquida Nasir al-Din Muhammad: un elefante que sostiene un castillo y figuras, un pájaro que canta en la parte superior, un escriba cuya pluma se mueve al ritmo de las horas y un dragón que se sumerge para alimentarse, un complejo espectáculo cinético; su máquina documentada más famosa en \"El Libro del Conocimiento de los Ingeniosos Dispositivos Mecánicos\"."
  fr: "Une horloge à eau mécanique construite par al-Jazari vers 602 AH/1206 CE pour le souverain artouqid Nasir al-Din Muhammad: un éléphant portant un château et des personnages, un oiseau chanteur au sommet, un scribe dont la plume se déplace avec les heures et un dragon qui plonge pour se nourrir, un spectacle cinétique complexe — sa machine la plus célèbre documentée dans « le Livre de la connaissance des dispositifs mécaniques ingénieux »."
  tr: "El-Cezari'nin Hicri 602/Miladi 1206 civarında Nasır el-Din Muhammed Artak için yaptığı mekanik su saati: bir kutu ve bir yapı taşıyan bir fil, bunun üzerinde öten bir kuş, kalemi zamanla hareket eden bir kâtip ve beslenmek için aşağı inen bir yılan – karmaşık bir kinetik düzenleme – \"Bilgi ve Faydalı Amel Kitabı\" adlı eserinde belgelenmiş makinelerinin en ünlüsü."
  id: "Jam air mekanis yang dibuat oleh Al-Jazari sekitar tahun 602 H/1206 M untuk Nasir al-Din Muhammad Artaq: seekor gajah membawa sebuah kotak dan sebuah struktur, di atasnya terdapat seekor burung yang bernyanyi, seorang juru tulis yang penanya bergerak mengikuti waktu, dan seekor ular yang turun untuk makan—sebuah susunan kinetik yang kompleks—yang paling terkenal dari mesin-mesin yang didokumentasikan dalam bukunya \"Kitab Ilmu dan Amalan yang Bermanfaat\"."
