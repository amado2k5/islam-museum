today:
  form:
    ar: "لم تعد خرائط الإدريسي تُستعمل لمعرفة الطريق، لكن الكتاب باقٍ في مخطوطات، منها نسخة في مكتبة كوبريلي بإسطنبول فيها صفحات مصوّرة، ونصه الكامل منشور، وخرائطه السبعون أعاد رسمها كونراد ميلر وما زالت تُطبع {cite:tdv-idrisi-serif pp. 493–495}."
    en: "Al-Idrisi's maps are no longer used to find the way, but the book survives in manuscripts, among them a copy with illustrated pages in the Köprülü Library in Istanbul; its full text is in print, and its seventy maps, redrawn by Konrad Miller, are still reprinted {cite:tdv-idrisi-serif pp. 493–495}."
    ur: "ادریسی کے نقشے اب راستہ معلوم کرنے کے لیے استعمال نہیں ہوتے، لیکن کتاب مخطوطات میں باقی ہے، جن میں استنبول کی کوپریلی لائبریری کا ایک نسخہ مصور صفحات کے ساتھ شامل ہے؛ اس کا مکمل متن چھپا ہوا ہے، اور اس کے ستر نقشے، جنہیں کونراڈ ملر نے دوبارہ بنایا، آج بھی چھپتے ہیں {cite:tdv-idrisi-serif pp. 493–495}۔"
  descendants:
    ar: "عادة الإدريسي في أن يُتبع كل خريطة بوصف بلادها {cite:nuzhat-al-mushtaq-2002 p. 14} هي ما يصنعه الأطلس الجغرافي اليوم حين يضع إلى جانب الخريطة وصف البلد، وقد حفظت إعادة ميلر للخرائط صورة العالم كما رآها الإدريسي ورجار {cite:tdv-idrisi-serif pp. 493–495}."
    en: "Al-Idrisi's habit of following each map with a description of its lands {cite:nuzhat-al-mushtaq-2002 p. 14} is what a geographical atlas does today when it sets a description beside the map, and Miller's redrawing has kept the world as al-Idrisi and Roger saw it {cite:tdv-idrisi-serif pp. 493–495}."
    ur: "ادریسی کا ہر نقشے کے بعد اس کے ملکوں کا بیان دینے کا طریقہ {cite:nuzhat-al-mushtaq-2002 p. 14} وہی ہے جو آج کا جغرافیائی اٹلس کرتا ہے جب نقشے کے ساتھ ملک کا بیان رکھتا ہے، اور ملر کی دوبارہ تیاری نے دنیا کو ویسا ہی محفوظ رکھا ہے جیسا ادریسی اور روجر نے اسے دیکھا تھا {cite:tdv-idrisi-serif pp. 493–495}۔"
