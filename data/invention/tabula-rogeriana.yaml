summary:
  ar: "صورة للأرض المعمورة صنعها الشريف الإدريسي في بلرمو لرجار الثاني ملك صقلية: دائرة من الفضة الخالصة نُقشت عليها الأقاليم السبعة ببلادها وأنهارها وطرقها، وكتاب يرافقها قسّم كل إقليم عشرة أجزاء ورسم لكل جزء خريطة، فبلغت سبعين خريطة، يتبع كلَّ خريطة وصفُ بلادها وأهلها وطرقها. جُمعت مادته على نحو خمس عشرة سنة من كتب الجغرافيين ومن سؤال الرحالة والإبقاء على ما اتفقوا عليه، وتمّ الكتاب في شوال سنة 548هـ."
  en: "A picture of the inhabited world made by al-Sharif al-Idrisi at Palermo for Roger II, king of Sicily: a disc of pure silver engraved with the seven climes, their lands, rivers and routes, and a book to go with it that split each clime into ten sections and drew a map for each, seventy maps in all, each followed by a description of its lands, peoples and roads. Its material was gathered over some fifteen years from the books of earlier geographers and from questioning travellers, keeping only what they agreed on, and the book was finished in Shawwal 548 AH."
  ur: "آباد دنیا کی ایک تصویر جو شریف ادریسی نے پالرمو میں صقلیہ کے بادشاہ روجر دوم کے لیے بنائی: خالص چاندی کی ایک گول تختی جس پر سات اقلیمیں اپنے ملکوں، دریاؤں اور راستوں کے ساتھ کندہ کی گئیں، اور اس کے ساتھ ایک کتاب جس نے ہر اقلیم کو دس حصوں میں بانٹا اور ہر حصے کا ایک نقشہ بنایا، کل ستر نقشے، اور ہر نقشے کے بعد اس کے ملکوں، لوگوں اور راستوں کا بیان ہے۔ اس کا مواد تقریباً پندرہ برس میں پہلے جغرافیہ دانوں کی کتابوں اور مسافروں سے پوچھ گچھ کر کے جمع کیا گیا، اور صرف وہی رکھا گیا جس پر وہ متفق تھے؛ کتاب شوال 548ھ میں مکمل ہوئی۔"
