kids:
  ar: "قبل نحو تسعمئة سنة عاش في جزيرة صقلية عالم مسلم اسمه الإدريسي. وكان ملك الجزيرة رجار يريد أن يعرف العالم كله، فجمع كتب الجغرافيين، وسأل المسافرين عن البلاد والطرق، واحتفظ بما اتفقوا عليه. ثم نُقشت صورة العالم على دائرة كبيرة من الفضة، وكتب الإدريسي كتاباً فيه سبعون خريطة، بعد كل واحدة وصف بلادها وأهلها."
  en: "About nine hundred years ago a Muslim scholar named al-Idrisi lived on the island of Sicily. The island's king, Roger, wanted to know the whole world, so he gathered the geographers' books and asked travellers about lands and roads, keeping what they agreed on. The world was then engraved on a great disc of silver, and al-Idrisi wrote a book with seventy maps, each followed by a description of its lands and people."
  ur: "تقریباً نو سو سال پہلے صقلیہ کے جزیرے پر ادریسی نام کے ایک مسلمان عالم رہتے تھے۔ جزیرے کا بادشاہ روجر پوری دنیا کو جاننا چاہتا تھا، اس لیے اس نے جغرافیہ دانوں کی کتابیں جمع کیں اور مسافروں سے ملکوں اور راستوں کے بارے میں پوچھا، اور جس پر وہ متفق تھے اسے رکھا۔ پھر دنیا کی تصویر چاندی کی ایک بڑی تختی پر کندہ کی گئی، اور ادریسی نے ستر نقشوں والی ایک کتاب لکھی، ہر نقشے کے بعد اس کے ملکوں اور لوگوں کا بیان۔"
