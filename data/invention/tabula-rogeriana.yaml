origin:
  place: place/palermo
  context:
    ar: "وُلد الإدريسي في سبتة سنة 493هـ، وتعلّم في قرطبة، ورحل طويلاً في الأندلس وشمال إفريقية، ثم نزل بلرمو عاصمة صقلية في السنوات الأولى من حكم رجار الثاني ⁦(1130–1154م)⁩ وعاش فيها {cite:tdv-idrisi-serif pp. 493–495}. ويصف في مقدمة كتابه رجار بأنه ملك صقلية وإيطالية ولنبردية وقلورية، وبأنه الناصر للملة النصرانية {cite:nuzhat-al-mushtaq-2002 p. 4}، وأنه كان عالماً بالعلوم الرياضية، وأراد أن يعرف بلاده معرفة يقين: حدودها ومسالكها في البر والبحر، وفي أي إقليم هي {cite:nuzhat-al-mushtaq-2002 p. 5}."
    en: "Al-Idrisi was born at Ceuta in 493 AH, studied at Córdoba and travelled at length in al-Andalus and North Africa before settling at Palermo, the capital of Sicily, in the early years of Roger II (1130–1154), where he lived {cite:tdv-idrisi-serif pp. 493–495}. In his preface he calls Roger king of Sicily, Italy, Lombardy and Calabria and the champion of the Christian religion {cite:nuzhat-al-mushtaq-2002 p. 4}, a man learned in the mathematical sciences who wanted to know his lands with certainty: their borders, their routes by land and sea, and the clime each lay in {cite:nuzhat-al-mushtaq-2002 p. 5}."
    ur: "ادریسی 493ھ میں سبتہ میں پیدا ہوئے، قرطبہ میں تعلیم پائی اور اندلس اور شمالی افریقہ میں طویل سفر کیے، پھر روجر دوم ⁦(1130–1154ء)⁩ کے ابتدائی برسوں میں صقلیہ کے دار الحکومت پالرمو میں آ بسے اور وہیں رہے {cite:tdv-idrisi-serif pp. 493–495}۔ اپنے مقدمے میں وہ روجر کو صقلیہ، اطالیہ، لومبارڈی اور کلابریا کا بادشاہ اور نصرانی ملت کا حامی کہتے ہیں {cite:nuzhat-al-mushtaq-2002 p. 4}، ایک ایسا شخص جو ریاضیاتی علوم جانتا تھا اور اپنے ملکوں کو یقین کے ساتھ جاننا چاہتا تھا: ان کی سرحدیں، خشکی اور سمندر میں ان کے راستے، اور یہ کہ ہر ملک کس اقلیم میں ہے {cite:nuzhat-al-mushtaq-2002 p. 5}۔"
makers:
  - person: person/al-idrisi-muhammad-ibn-abd-allah
    role: inventor
    place: place/palermo
    note: "Author of Nuzhat al-mushtaq, who says he carried out Roger's order to write the book that accompanies the silver disc {cite:nuzhat-al-mushtaq-2002 pp. 6–7}, divided each clime into ten sections and drew seventy sectional maps {cite:nuzhat-al-mushtaq-2002 p. 13}. TDV credits him with drawing the maps of several lands, Western Europe above all, more faithfully than any earlier work {cite:tdv-idrisi-serif pp. 493–495}."
    sources: [source/nuzhat-al-mushtaq-2002, source/tdv-idrisi-serif]
  - person: person/roger-of-sicily
    role: commissioner
    place: place/palermo
    note: "In al-Idrisi's account Roger gathered the books and the travellers, compared their reports for some fifteen years, tested the distances on a drawing board, and ordered both the silver disc and the book {cite:nuzhat-al-mushtaq-2002 pp. 5–7}."
    sources: [source/nuzhat-al-mushtaq-2002]
attribution:
  status: improvement
  claim:
    ar: "رسم الإدريسي لرجار الثاني صورة للعالم المعمور على دائرة من فضة، وكتاباً يقسّم كل إقليم من الأقاليم السبعة عشرة أجزاء لكل جزء خريطته ووصفه، فجمع علم الجغرافيين قبله مع أخبار الرحالة في سبعين خريطة متصلة."
    en: "For Roger II, al-Idrisi drew the inhabited world on a silver disc and in a book that divides each of the seven climes into ten sections, each with its own map and description, joining the knowledge of earlier geographers with travellers' reports in seventy connected maps."
    ur: "ادریسی نے روجر دوم کے لیے آباد دنیا کو چاندی کی ایک تختی پر اور ایک ایسی کتاب میں بنایا جو سات اقلیموں میں سے ہر ایک کو دس حصوں میں بانٹتی ہے، ہر حصے کا اپنا نقشہ اور بیان، اور یوں پہلے جغرافیہ دانوں کے علم کو مسافروں کی خبروں کے ساتھ ستر جڑے ہوئے نقشوں میں جمع کیا۔"
  basis:
    ar: "لم يكن الإدريسي أول من رسم الأرض ولا أول من قسمها أقاليم: فهو نفسه يقول إن العلماء قسموا الربع المسكون سبعة أقاليم بخطوط وهمية تُعرف بعلم النجوم {cite:nuzhat-al-mushtaq-2002 p. 9}، ويبدأ كلامه على صورة الأرض «كما سماها بطلميوس» {cite:nuzhat-al-mushtaq-2002 p. 7}، ويسمّي الكتب التي رجع إليها رجار: كتب المسعودي والجيهاني وابن خرداذبه والعذري وابن حوقل وخناخ بن خاقان الكيماكي واليعقوبي وقدامة وبطلميوس وأروسيوس وغيرهم {cite:nuzhat-al-mushtaq-2002 pp. 5–6}. والجديد عنده أمران يذكرهما الكتاب: طريقة جمع المادة بسؤال الرحالة جماعة وأفراداً والإبقاء على ما اتفقوا عليه وإلغاء ما اختلفوا فيه، واختبار المسافات على لوح الترسيم {cite:nuzhat-al-mushtaq-2002 p. 6}؛ ثم تقسيم كل إقليم عشرة أجزاء مقدّرة الطول والعرض، لكل منها خريطة يتبعها وصفها، فبلغت سبعين خريطة {cite:nuzhat-al-mushtaq-2002 pp. 13–14}. وتعدّه موسوعة TDV من أشهر أتباع مدرسة بطلميوس، وتذكر أنه غيّر في خرائط بطلميوس تغييرات مهمة {cite:tdv-idrisi-serif pp. 493–495}."
    en: "Al-Idrisi was not the first to draw the earth or to divide it into climes. He says himself that scholars divided the inhabited quarter into seven climes by imaginary lines known through astronomy {cite:nuzhat-al-mushtaq-2002 p. 9}; he opens his account of the earth's form 'as Ptolemy named it' {cite:nuzhat-al-mushtaq-2002 p. 7}; and he names the books Roger consulted: al-Mas'udi, al-Jayhani, Ibn Khurradadhbih, al-Udhri, Ibn Hawqal, Khanakh ibn Khaqan al-Kimaki, al-Ya'qubi, Qudama, Ptolemy, Orosius and others {cite:nuzhat-al-mushtaq-2002 pp. 5–6}. What is new is set out in the book itself: the way the material was gathered, by questioning travellers together and one by one, keeping what they agreed on and dropping what they disputed, and testing the distances on a drawing board {cite:nuzhat-al-mushtaq-2002 p. 6}; and the division of each clime into ten sections of set length and breadth, each with a map followed by its description, seventy maps in all {cite:nuzhat-al-mushtaq-2002 pp. 13–14}. TDV counts him among the best-known followers of Ptolemy's school and notes that he made important changes to Ptolemy's maps {cite:tdv-idrisi-serif pp. 493–495}."
    ur: "ادریسی زمین کا نقشہ بنانے والے یا اسے اقلیموں میں بانٹنے والے پہلے شخص نہیں تھے۔ وہ خود کہتے ہیں کہ علماء نے آباد چوتھائی کو ایسی خیالی لکیروں سے سات اقلیموں میں بانٹا جو علمِ نجوم سے معلوم ہوتی ہیں {cite:nuzhat-al-mushtaq-2002 p. 9}؛ وہ زمین کی صورت کا بیان «جیسا کہ بطلیموس نے اسے نام دیا» سے شروع کرتے ہیں {cite:nuzhat-al-mushtaq-2002 p. 7}؛ اور ان کتابوں کے نام لیتے ہیں جن سے روجر نے رجوع کیا: مسعودی، جیہانی، ابن خرداذبہ، عذری، ابن حوقل، خناخ بن خاقان کیماکی، یعقوبی، قدامہ، بطلیموس، اوروسیوس اور دوسرے {cite:nuzhat-al-mushtaq-2002 pp. 5–6}۔ نیا کیا ہے، یہ کتاب خود بتاتی ہے: مواد جمع کرنے کا طریقہ، یعنی مسافروں سے اکٹھے اور الگ الگ پوچھنا، جس پر وہ متفق ہوں اسے رکھنا اور جس میں اختلاف ہو اسے چھوڑ دینا، اور فاصلوں کو ترسیم کی تختی پر جانچنا {cite:nuzhat-al-mushtaq-2002 p. 6}؛ اور ہر اقلیم کو مقررہ طول و عرض کے دس حصوں میں بانٹنا، ہر حصے کا ایک نقشہ جس کے بعد اس کا بیان ہو، کل ستر نقشے {cite:nuzhat-al-mushtaq-2002 pp. 13–14}۔ ٹی ڈی وی انہیں بطلیموس کے مکتب کے مشہور ترین پیروکاروں میں شمار کرتا ہے اور لکھتا ہے کہ انہوں نے بطلیموس کے نقشوں میں اہم تبدیلیاں کیں {cite:tdv-idrisi-serif pp. 493–495}۔"
