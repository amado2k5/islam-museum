    note: "Al-Idrisi dates the naming of the book to the first ten days of January, which fell in Shawwal 548 {cite:nuzhat-al-mushtaq-2002 p. 7}. He gives the month and the Hijri year but not the Christian year; TDV gives January 1154 {cite:tdv-idrisi-serif pp. 493–495}, so the year is marked derived."
    sources: [source/nuzhat-al-mushtaq-2002, source/tdv-idrisi-serif]
