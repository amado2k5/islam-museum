spread: []
impact:
  fields: [navigation-geography]
  changed:
    ar: "صارت صورة العالم تُرسم أجزاءً متصلة مقدّرة الطول والعرض، لكل جزء خريطته ووصف بلاده وطرقه ومسافاته {cite:nuzhat-al-mushtaq-2002 pp. 13–14}. وتعدّ موسوعة TDV الكتاب من أوسع ما كُتب في العصور الوسطى في العالم الإسلامي في الجغرافيا العامة المنظمة للأرض، وأول كتاب يعطي عن أوروبا أقرب المعلومات إلى الحقيقة، وتقول إن خرائط بلدان كثيرة، ولا سيما بلدان أوروبا الغربية، رُسمت فيه لأول مرة على صورة قريبة من أصلها {cite:tdv-idrisi-serif pp. 493–495}."
    en: "The picture of the world came to be drawn in connected sections of set length and breadth, each with its own map and a description of its lands, roads and distances {cite:nuzhat-al-mushtaq-2002 pp. 13–14}. TDV counts the book among the most comprehensive general and systematic geographies of the earth written in the medieval Islamic world, and the first work to give information about Europe close to the truth; it says the maps of many countries, Western Europe above all, were drawn in it for the first time in a form that can be called faithful {cite:tdv-idrisi-serif pp. 493–495}."
    ur: "دنیا کی تصویر مقررہ طول و عرض کے جڑے ہوئے حصوں میں بننے لگی، ہر حصے کا اپنا نقشہ اور اس کے ملکوں، راستوں اور فاصلوں کا بیان {cite:nuzhat-al-mushtaq-2002 pp. 13–14}۔ ٹی ڈی وی اس کتاب کو قرونِ وسطیٰ کی اسلامی دنیا میں لکھی گئی زمین کی عمومی اور منظم جغرافیہ کی جامع ترین کتابوں میں شمار کرتا ہے، اور یورپ کے بارے میں حقیقت کے قریب ترین معلومات دینے والی پہلی کتاب کہتا ہے؛ اس کے مطابق اس میں بہت سے ملکوں، خاص طور پر مغربی یورپ کے ملکوں، کے نقشے پہلی بار اصل کے قریب بنائے گئے {cite:tdv-idrisi-serif pp. 493–495}۔"
  history:
    ar: "نقل عنه أبو الفداء في «تقويم البلدان»، واختُصر الكتاب مرتين، وطُبعت مختارات منه في روما سنة 1592 وتُرجمت إلى اللاتينية في باريس سنة 1619، ثم ترجمه جوبير إلى الفرنسية (1836–1840)، ونُشر نصه الكامل في ليدن (1970–1984)، ودرسه علماء كثيرون بلداً بلداً من الأندلس إلى الهند وبحر البلطيق {cite:tdv-idrisi-serif pp. 493–495}."
    en: "Abu al-Fida quoted him in Taqwim al-buldan; the book was abridged twice; a selection was printed at Rome in 1592 and translated into Latin at Paris in 1619; Jaubert translated it into French (1836–1840); its full text was published at Leiden (1970–1984); and scholars have studied it land by land, from al-Andalus to India and the Baltic {cite:tdv-idrisi-serif pp. 493–495}."
    ur: "ابو الفداء نے «تقویم البلدان» میں ان سے نقل کیا؛ کتاب کے دو اختصار ہوئے؛ اس کا ایک انتخاب 1592ء میں روم میں چھپا اور 1619ء میں پیرس میں لاطینی میں ترجمہ ہوا؛ جوبیر نے اسے فرانسیسی میں ترجمہ کیا (1836–1840)؛ اس کا مکمل متن لائیڈن میں شائع ہوا (1970–1984)؛ اور علماء نے اندلس سے ہندوستان اور بحیرۂ بالٹک تک ملک ملک اس کا مطالعہ کیا {cite:tdv-idrisi-serif pp. 493–495}۔"
  significance: 4
  why: "One of the fullest medieval pictures of the known world, built from earlier books checked against travellers' reports and laid out as seventy connected sectional maps with descriptions; printed, translated and redrawn in Europe from 1592 onward."
