summary:
  ar: "معالجة مبكرة مباشرة للكسور العشرية في كتاب مؤلف بدمشق341/952–953، مع علامة للآحاد وعمليات على أجزاء العشرة؛ اكتمال المفهوم محل اختلاف، لا اختراع الأرقام أو النقطة الحديثة {cite:tdv-oklidisi pp. 25–26} {cite:uqlidisi-mactutor Biography}."
  en: "Early direct decimal-fraction treatment in a Damascus341/952–953 book, with a units sign and operations on tenths; conceptual completeness remains disputed, not invention of numerals or today's decimal point {cite:tdv-oklidisi pp. 25–26} {cite:uqlidisi-mactutor Biography}."
  ur: "دمشق کی341/952–953 کی کتاب میں اعشاری کسور، اکائی کے نشان اور دس کے حصوں پر ابتدائی براہ راست عملیات؛ مفہوم کی تکمیل مختلف فیہ ہے، ہندسوں یا موجودہ اعشاری نقطے کی ایجاد نہیں {cite:tdv-oklidisi pp. 25–26} {cite:uqlidisi-mactutor Biography}۔"
