attribution:
  status: improvement
  claim:
    ar: "تطوير التعامل مع الكسور في الحساب ذي القيمة المكانية؛ لا أول نظام عشري ولا نظرية حديثة كاملة متفق عليها."
    en: "Developed fractional operations in place-value arithmetic, not the first decimal numeral system or an agreed complete modern theory."
    ur: "مقامی حساب میں کسری عملیات کی ترقی، پہلا اعشاری نظام ہندسہ یا متفقہ مکمل جدید نظریہ نہیں۔"
  basis:
    ar: "يصف سعيدان علامة فوق الآحاد والتنصيف المتكرر من13 إلى0.8125؛ تعرض ماكتوتر وTDV اختلافه مع راشد في عموم الفهم النظري {cite:uqlidisi-saidan-dsb decimal-fraction discussion} {cite:uqlidisi-mactutor Biography} {cite:tdv-oklidisi pp. 25–26}."
    en: "Saidan describes a stroke over units and repeated halving from13 to0.8125; MacTutor and TDV preserve disagreement with Rashed over theoretical completeness {cite:uqlidisi-saidan-dsb decimal-fraction discussion} {cite:uqlidisi-mactutor Biography} {cite:tdv-oklidisi pp. 25–26}."
    ur: "سعیدان اکائی کے اوپر لکیر اور13 سے0.8125 تک مکرر نصف کرنا بتاتے ہیں؛ میک ٹیوٹر و ٹی ڈی وی نظری تکمیل پر راشد کے اختلاف کو محفوظ رکھتے ہیں {cite:uqlidisi-saidan-dsb decimal-fraction discussion} {cite:uqlidisi-mactutor Biography} {cite:tdv-oklidisi pp. 25–26}۔"
  perspectives:
    - tradition: sunni
      id: sunni-museum-frame
      standing: main
      summary:
        ar: "إطار المتحف السني المعلن يحفظ المساهمة المسلمة وسابقيها، ولا يجعل افتراضه شهادة شخصية بمذهب أو حكماً مذهبياً في الخلاف الرياضي {cite:uqlidisi-mactutor Biography}."
        en: "Explicit Sunni museum frame preserves the Muslim contribution and predecessors, not personal school testimony or a sectarian verdict on the mathematical debate {cite:uqlidisi-mactutor Biography}."
        ur: "متحف کا واضح سنی فریم مسلم حصہ اور سابقین محفوظ رکھتا ہے، ذاتی مسلک کی شہادت یا ریاضیاتی اختلاف کا مسلکی فیصلہ نہیں {cite:uqlidisi-mactutor Biography}۔"
      sources: [source/uqlidisi-mactutor]
    - tradition: academic
      id: saidan-decimal-understanding
      standing: main
      summary:
        ar: "يرى سعيدان فهماً واضحاً للكسور وعلامتها والعمل بقوى العشرة، لا مجرد تحويل ميكانيكي إلى الستينيات {cite:uqlidisi-saidan-dsb decimal-fraction discussion} {cite:uqlidisi-mactutor Biography}."
        en: "Saidan sees clear understanding of decimal fractions, their sign and powers-of-ten operations, rather than mechanical conversion to sexagesimals {cite:uqlidisi-saidan-dsb decimal-fraction discussion} {cite:uqlidisi-mactutor Biography}."
        ur: "سعیدان اعشاری کسور، نشان اور دس کی قوتوں کے عملیات کی واضح سمجھ دیکھتے ہیں، محض ساٹھ کے نظام میں میکانکی تبدیلی نہیں {cite:uqlidisi-saidan-dsb decimal-fraction discussion} {cite:uqlidisi-mactutor Biography}۔"
      sources: [source/uqlidisi-saidan-dsb, source/uqlidisi-mactutor]
    - tradition: academic
      id: rashed-conceptual-limits
      standing: main
      summary:
        ar: "تنقل ماكتوتر عن راشد أن الفهم ضمني دون صياغة إكمال قوى العشرة بمقلوباتها بعد تعريف القوة الصفرية؛ يرى ذلك تمهيداً لا اكتمالاً، دون إنكار أهمية الخطوة {cite:uqlidisi-mactutor Biography} {cite:tdv-oklidisi pp. 25–26}."
        en: "MacTutor reports Rashed's distinction between implicit practice and explicit extension through reciprocal powers after defining the zero power: a preliminary stage, not completeness, without denying its importance {cite:uqlidisi-mactutor Biography} {cite:tdv-oklidisi pp. 25–26}."
        ur: "میک ٹیوٹر راشد کا عملی ضمنی سمجھ اور صفر قوت کے بعد مقلوب قوتوں کی واضح توسیع کا فرق بتاتا ہے: اہم مگر تمہیدی مرحلہ، تکمیل نہیں {cite:uqlidisi-mactutor Biography} {cite:tdv-oklidisi pp. 25–26}۔"
      sources: [source/uqlidisi-mactutor, source/tdv-oklidisi]
