  - { value: "Sinan ibn Thabit's physician examination", kind: alternate, lang: en }
summary:
  ar: "يخبر ابن أبي أصيبعة أن المقتدر أمر سنة ⁦(319/931)⁩، بعد أن قتل غلطُ طبيبٍ رجلاً من العامة، بمنع سائر المتطببين من التصرف إلا من امتحنه سنان بن ثابت، فامتحنهم وأطلق لكل واحد ما يصلح أن يتصرف فيه، وبلغ عددهم في بغداد أكثر من ثمانمائة وستين رجلاً {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}."
  en: "Ibn Abi Usaybi'a reports that in ⁦(319/931)⁩, after a practitioner's error killed a commoner, al-Muqtadir barred every practitioner in Baghdad except those Sinan ibn Thabit examined; Sinan tested them and licensed each to practise at his proven level, and their number passed eight hundred and sixty men {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}."
  ur: "ابن ابی اصیبعہ بتاتا ہے کہ ⁦(319/931)⁩ میں ایک معالج کی غلطی سے عوام کا آدمی مرا تو المقتدر نے بغداد کے تمام متطببوں کو روکا سوائے ان کے جنہیں سنان بن ثابت نے امتحان لیا؛ اس نے ہر ایک کو اس کی صلاحیت کے مطابق تصرف کی اجازت دی، اور ان کی تعداد آٹھ سو ساٹھ سے بڑھی {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}۔"
  es: "Ibn Abi Usaybi'a relata que en (319/931), después de que el error de un practicante matara a un plebeyo, al-Muqtadir prohibió a todos los practicantes en Bagdad excepto a aquellos que Sinan ibn Thabit examinó; Sinan los puso a prueba y autorizó a cada uno a practicar según su nivel comprobado, y su número superó los ochocientos sesenta hombres {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}."
