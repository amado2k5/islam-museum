    en: "The idea lives in today's medical licensing boards and board examinations; the functional resemblance is clear, a direct institutional line from 931 Baghdad is not proven {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}."
    ur: "خیال آج کے طبی لائسنسنگ بورڈ اور امتحانات میں جیوتا ہے؛ فنی مماثلت واضح، بغداد931 سے ثابت براہ راست ادارہ جاتی لکیر نہیں {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}۔"
  descendants:
    ar: "أنظمة اعتماد مهنة الطب في العالم؛ النسب الوظيفي موثق لا النسب التاريخي المباشر {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}."
    en: "The world's systems for credentialing the medical profession; the functional kinship is documented rather than a proven direct historical descent {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}."
    ur: "دنیا کے طبی پیشے کی تصدیق کے نظام؛ فنی قرابت موثق ہے، براہ راست تاریخی نسب نہیں {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}۔"
