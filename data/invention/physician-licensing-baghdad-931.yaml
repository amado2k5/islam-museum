origin:
  place: place/baghdad
  polity: polity/abbasid-caliphate
  context:
    ar: "قصر المقتدر في بغداد، وقد بذل سنان للدولة قبلها: افتتح بيمارستان السيدة في أول محرم ⁦(306/918)⁩ بستمائة دينار شهرياً ثم البيمارستان المقتدري بباب الشام بمائتي دينار من ماله {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}."
    en: "Al-Muqtadir's Baghdad, where Sinan had already served the state: he opened the Sayyida bimaristan on the first of Muharram ⁦(306/918)⁩ at six hundred dinars a month, then the Muqtadiri bimaristan at Bab al-Sham funded at two hundred dinars monthly {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}."
    ur: "بغداد میں المقتدر کا دربار، جہاں سنان پہلے سے خدمت میں تھا: محرم ⁦(306/918)⁩ کی پہلی کو سیدہ بیمارستان چھ سو دینار ماہانہ سے اور پھر باب الشام پر مقتدری بیمارستان دو سو دینار ماہانہ سے کھولا {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}۔"
makers:
  - person: person/al-muqtadir-billah
    role: commissioner
    place: place/baghdad
    note: "The caliph whose order, following a malpractice death, initiated the ban-and-examine arrangement."
    sources: [source/ibn-abi-usaybia-uyun-al-anba, source/encyclopaedia-of-islam-2]
attribution:
  status: original
  claim:
    ar: "أقدم حالة موثقة لامتحان ترخيص طبي عام تأمر به دولة وتطبقه على ممارسي مدينة؛ لا اختراع تنظيم مهنة من العدم، فالنص نفسه يذكر دعوة سابقة مماثلة لإبراهيم بن المهدي."
    en: "The earliest documented case of a state-ordered public licensing examination applied to a city's medical practitioners; not the invention of professional regulation from nothing, since the same text reports an earlier similar summons under Ibrahim ibn al-Mahdi."
    ur: "دستاویزی طور پر قدیم ترین ریاستی حکمِ عام لائسنسنگ امتحان جو شہر کے طبی پیشہ وران پر لاگو ہوا؛ پیشہ ورانہ ضابطہ کی از سرِنو ایجاد نہیں، کہ خود متن میں ابراہیم بن مہدی کی قدیم تر مثل یاد دہانی ہے۔"
  basis:
    ar: "يروي ثابت بن سنان عن أبيه النصَّ بلفظ سنة تسع عشرة وثلثمائة وعدد ثمانمائة ونيف وستين رجلاً؛ وقبله بأسطر يروي أن إبراهيم بن المهدي أمر بمنع المتطببين إلا من امتحنه سنان أيضاً، فالفكرة أسبق من319 {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}."
    en: "Thabit ibn Sinan's report about his father gives the year 319 AH and the figure 'eight hundred and sixty-odd men'; a few lines earlier the same source reports Ibrahim ibn al-Mahdi ordering a comparable ban except for those examined — the idea is older than 931 {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}."
    ur: "ثابت بن سنان کی اپنے والد کے بارے میں روداد میں سنہ319ھ اور 'آٹھ سو ساٹھ سے زائد مرد' کی تعداد ہے؛ چند سطر پہلے وہی ماخذ ابراہیم بن مہدی کا مشابہ حکم بتاتا ہے — خیال931 سے پرانا ہے {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}۔"
precursors:
  - external: { ar: "بيمارستانات بغداد ودور الجندي شابور", en: "Baghdad's bimaristans and the Jundishapur medical tradition", ur: "بغداد کے بیمارستان اور جندی شاپور کی طبی روایت" }
    note: "The institutional setting: Sinan himself founded the Sayyida and Muqtadiri bimaristans in 306/918 on the transmitted account, and court medicine drew on the Jundishapur-trained families."
    sources: [source/ibn-abi-usaybia-uyun-al-anba]
  - external: { ar: "دعوة إبراهيم بن المهدي السابقة للامتحان", en: "Ibrahim ibn al-Mahdi's earlier examination order", ur: "ابراہیم بن مہدی کا پہلا امتحان حکم" }
    note: "The same biography reports an earlier occasion when a death led Ibrahim ibn al-Mahdi to bar practitioners except those examined — a documented precedent inside the tradition itself."
    sources: [source/ibn-abi-usaybia-uyun-al-anba]
dependents:
  - external: { ar: "الحسبة الطبية وامتحانات الأطباء اللاحقة", en: "Medical hisba and later physician examinations", ur: "طبی حسبہ اور بعد کے معالج امتحانات" }
    note: "Oversight of practitioners through market and professional inspection continued in Islamic governance; the record does not claim every later examination derives from this one."
    sources: [source/ibn-abi-usaybia-uyun-al-anba]
  - external: { ar: "الترخيص الطبي الحديث", en: "Modern medical licensing", ur: "جدید طبی لائسنسنگ" }
    note: "Today's state licensing of physicians is a functional analogue; a documented institutional line from 931 Baghdad to modern boards is not claimed."
    sources: [source/ibn-abi-usaybia-uyun-al-anba]
spread: []
impact:
  fields: [medicine-surgery, institutions-systems]
  changed:
    ar: "جعل الدخول في التطبب مشروطاً بإثبات القدرة أمام ممتحن من الدولة، وفصّل لكل ممارس مستوى ما يجوز أن يتصرف فيه {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}."
    en: "It made entry into medical practice conditional on proven competence before a state examiner, and graded each practitioner to the level of treatment he was permitted to perform {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}."
    ur: "طبی پیشے میں داخلہ ریاستی ممتحن کے سامنے ثابت اہلیت پر مشروط کیا اور ہر معالج کو اس کی اجازت یافتہ سطح تک محدود کیا {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}۔"
  history:
    ar: "يُحسب في أدبيات تاريخ الطب أقدم امتحان ترخيص دولة موثق؛ قيمته في ما وثّقه النص لا في دعوى أولية مطلقة {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}."
    en: "It is counted in histories of medicine as the earliest documented state licensing examination; its value is what the text records, not a claim of absolute priority {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}."
    ur: "تاریخِ طب کے ادبیات میں اسے قدیم ترین دستاویزی ریاستی لائسنسنگ امتحان شمار کیا جاتا ہے؛ قدر اس میں جو متن ثبت کرتا ہے، مطلق اولیت کے دعوے میں نہیں {cite:ibn-abi-usaybia-uyun-al-anba Sinan ibn Thabit biography}۔"
  significance: 4
  why: "A documented tenth-century state examination licensing hundreds of practitioners, transmitted with date, examiner, trigger and number — while honestly preserving the tradition's own earlier precedent."
