kids:
  ar: "في بغداد القديمة كان بعض الناس يعالجون المرضى دون علم كاف. يقول كتاب تراجم الأطباء إنه في سنة931 مات رجل بسبب غلط طبيب، فأمر الخليفة المقتدر الطبيب سنان بن ثابت أن يمتحن كل من يعالج الناس، فامتحن أكثر من ثمانمائة وستين شخصاً وأذن لكل واحد بما يحسنه فقط. بهذا صار علاج الناس محفوظاً بالاختبار، تقريباً مثل رخصة الطب اليوم."
  en: "In old Baghdad some people treated the sick without enough learning. A book of physicians' lives says that in 931 a man died through a practitioner's mistake, so Caliph al-Muqtadir told the physician Sinan ibn Thabit to test everyone who treated people. Sinan examined more than eight hundred and sixty of them and let each practise only what he knew well. Treating people became guarded by an exam, a little like a medical licence today."
  ur: "پرانے بغداد میں بعض لوگ ناکافی علم کے ساتھ مریضوں کا علاج کرتے تھے۔ اطبیہ کی تراجم کی کتاب بتاتی ہے کہ 931ء میں ایک معالج کی غلطی سے آدمی مرا، تو خلیفہ المقتدر نے معالج سنان بن ثابت کو کہا کہ ہر علاج کرنے والے کا امتحان لے۔ سنان نے آٹھ سو ساٹھ سے زائد کا امتحان لیا اور ہر ایک کو صرف وہ کرنے دیا جو وہ جانتا تھا۔ علاج امتحان کی حفاظت میں آیا، کچھ آج کے طبی لائسنس جیسا۔"
sources: [source/ibn-abi-usaybia-uyun-al-anba, source/encyclopaedia-of-islam-2]
