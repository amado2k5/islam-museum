summary:
  ar: "آلة اخترعها الفقيه الحنفي والرياضي والفلكي المصري حسن بن إبراهيم الجبرتي ⁦(1110–1188هـ ⁦/⁩ 1698–1774م)⁩، منها «الآلة المربعة» التي يقول ابنه المؤرخ عبد الرحمن الجبرتي في «عجائب الآثار» إنه اخترع آلات منها هذه الآلة «لمعرفة الجهات والسمت»؛ وتذكر نسخة أخرى من الترجمة الخبرية إضافة «الانحرافات» و«أسهل ماخذ وأقرب طريق»، وتسمّي معها «الدائرة التاريخية» و«بركار الدرجة» ضمن آلاته المبتدعة {cite:ajaib-al-athar-moreh-2013-v1 p. 516} {cite:arabicgenius-ajaib-al-athar obituary pp. 458–459}."
  en: "An instrument invented by the Egyptian Hanafi jurist, mathematician and astronomer Hasan ibn Ibrahim al-Jabarti (1110–1188 AH / 1698–1774 CE): among the instruments his son, the historian Abd al-Rahman al-Jabarti, says he invented is 'the square instrument' 'for finding directions and azimuth'; another recension of the obituary adds 'inclinations' 'by the easiest means and shortest way' and names 'the historical circle' and 'barqar al-daraja' among his invented instruments {cite:ajaib-al-athar-moreh-2013-v1 p. 516} {cite:arabicgenius-ajaib-al-athar obituary pp. 458–459}."
  ur: "مصری حنفی فقیہ، ریاضی دان اور ماہرِ فلکیات حسن بن ابراہیم الجبرتی ⁦(1110–1188ھ / 1698–1774ء)⁩ کا ایجاد کردہ آلہ: ان کی ایجاد کردہ آلات میں سے «مربع آلہ» جسے ان کے بیٹے مؤرخ عبد الرحمٰن الجبرتی نے «عجائب الآثار» میں اس کی ایجادات میں شمار کیا اور اس کا کام «سمتیں اور سمتِ افق جاننا» بتایا؛ ترجمے کی دوسری نقل میں «میلان» اور «آسان ترین اور مختصر ترین طریقہ» کا اضافہ ہے اور ساتھ «تاریخی دائرہ» اور «برکار الدرجہ» بھی اس کے ایجادات میں گنوائے گئے ہیں {cite:ajaib-al-athar-moreh-2013-v1 p. 516} {cite:arabicgenius-ajaib-al-athar obituary pp. 458–459}۔"
