kids:
  ar: "تخيل لوحاً مربعاً عليه خطوط وأسماء، تنظر من خلاله إلى الشمس أو النجوم لتعرف من أي جهة جهتك، أو إلى مكان بعيد ليعرف الإنسان اتجاهه من مكانه. صنعه عالم مصري اسمه حسن الجبرتي قبل أكثر من مئتي سنة، وكتب عنه ابنه المؤرخ في ترجمته أنه من الآلات التي اخترعها."
  en: "Imagine a square board marked with lines and names: through it you sight the Sun or stars to learn which way you face, or sight a far place to learn its direction from where you stand. An Egyptian scholar named Hasan al-Jabarti made it more than two hundred years ago, and his son the historian wrote in his biography that it was among the instruments he invented."
  ur: "ایک مربع تختی کا تصور کریں جس پر لکیریں اور نام لکھے ہوں: اس کے ذریعے آپ سورج یا ستاروں کو دیکھ کر جان سکتے ہیں کہ آپ کس سمت ہیں، یا کسی دور دراز جگہ کو دیکھ کر اس کی سمت معلوم کر سکتے ہیں۔ مصری عالم حسن الجبرتی نے یہ دو سو سال سے زیادہ پہلے بنایا، اور اس کے بیٹے مؤرخ نے اس کی سوانح میں لکھا کہ یہ اس کی ایجاد کردہ آلات میں سے تھا۔"
