  context:
    ar: "القاهرة في العهد العثماني، حيث عاش الجبرتي بين علماء الأزهر ودرس الرياضيات والهيئة فيها من سنة 1144هـ، وجمع الأسطرلابات والأرباع وآلات الارتفاع واحتفى عنده الصناع والحرفيون {cite:ajaib-al-athar-moreh-2013-v1 p. 510} {cite:ajaib-al-athar-moreh-2013-v1 p. 515}."
    en: "Cairo under Ottoman rule, where al-Jabarti lived among al-Azhar's scholars, took up mathematics and astronomy there from 1144 AH, and collected astrolabes, quadrants and altitude instruments while craftsmen and artisans gathered at his house {cite:ajaib-al-athar-moreh-2013-v1 p. 510} {cite:ajaib-al-athar-moreh-2013-v1 p. 515}."
    ur: "عثمانی دورِ حکومت میں قاہرہ، جہاں الجبرتی جامعہ ازہر کے علماء میں رہے، 1144ھ سے وہاں ریاضی اور فلکیات پڑھا، اور اسطرلاب، چہار اور بلندی کے آلات جمع کیے جبکہ کاریگر اس کے گھر جمع ہوتے تھے {cite:ajaib-al-athar-moreh-2013-v1 p. 510} {cite:ajaib-al-athar-moreh-2013-v1 p. 515}۔"
