    ar: "ينسب إلى الجبرتي اختراع «الآلة المربعة» صراحة في ترجمة ابنه له داخل «عجائب الآثار»؛ تقول الترجمة إنه «آلات اخترعها منها الآلة المربعة لمعرفة الجهات والسمت»."
    en: "Al-Jabarti is explicitly credited with inventing 'the square instrument' in his son's obituary notice inside Aja'ib al-athar, which says he invented instruments 'among them the square instrument for finding directions and azimuth'."
    ur: "الجبرتی کو «مربع آلہ» کی ایجاد کا صریح حق «عجائب الآثار» میں اس کے بیٹے کی تصنیف شدہ ترجمے میں دیا گیا ہے، جس میں کہا گیا کہ اس نے آلات ایجاد کیے جن میں سے «سمتیں اور سمتِ افق جاننے کے لیے مربع آلہ» بھی ہے۔"
  basis:
    ar: "عبارة الترجمة المنسوبة لابنه في وفيات سنة 1188هـ: «وآلات اخترعها منها الآلة المربعة لمعرفة الجهات والسمت» {cite:ajaib-al-athar-moreh-2013-v1 p. 516}؛ والنسخة الأوسع من الترجمة تضيف «والانحرافات بأسهل ماخذ وأقرب طريق» وتسمّي «الدائرة التاريخية» و«بركار الدرجة» ضمن آلاته المبتدعة {cite:arabicgenius-ajaib-al-athar obituary pp. 458–459}."
    en: "The son-attributed wording in the 1188 AH obituary: 'instruments he invented, among them the square instrument for finding directions and azimuth' {cite:ajaib-al-athar-moreh-2013-v1 p. 516}; the wider recension adds 'inclinations by the easiest means and shortest way' and names 'the historical circle' and 'barqar al-daraja' among his invented instruments {cite:arabicgenius-ajaib-al-athar obituary pp. 458–459}."
    ur: "1188ھ کے ترجمے میں بیٹے سے منسوب عبارت: «اور ایجاد کردہ آلات جن میں «سمتیں اور سمتِ افق جاننے کے لیے مربع آلہ» بھی ہے» {cite:ajaib-al-athar-moreh-2013-v1 p. 516}؛ وسیع تر نقل میں «میلان، آسان ترین اور مختصر ترین طریقے سے» کا اضافہ ہے اور «تاریخی دائرہ» اور «برکار الدرجہ» بھی اس کے ایجاد کردہ آلات میں گنوائے گئے ہیں {cite:arabicgenius-ajaib-al-athar obituary pp. 458–459}۔"
