    ar: "وصف في سطر من ترجمة لتجميع قوى الرصد والاتجاه في آلة «مربعة» واحدة؛ ولا يذكر المصدر المقروء آلتها أو مقاساتها ولا أثرها بين الصنّاع."
    en: "A single obituary line records the gathering of sighting and direction-finding powers into one 'square' instrument; the sources read give neither its construction nor any effect among craftsmen."
    ur: "ایک ہی ترجمے کی سطر میں مشاہدے اور سمت جانی کی قوتوں کو ایک «مربع» آلے میں جمع کرنے کا ذکر ہے؛ پڑھے ماخذ اس کی ترکیب اور کاریگروں پر کسی اثر کا تذکرہ نہیں کرتے۔"
  history:
    ar: "تبقى الآلة موصوفة باسمها ووظيفتها في تراث تاريخ الآلات، لا نموذج باقٍ ولا سلسلة نقل مثبتة؛ وتراث الجبرتي نفسه مثال على استمرارية صناعة الآلات الفلكية في مصر العثمانية أواخر القرن الثامن عشر {cite:ajaib-al-athar-moreh-2013-v1 p. 515} {cite:arabicgenius-ajaib-al-athar obituary pp. 457–460}."
    en: "The instrument survives described by name and function in instrument history, with no surviving specimen and no proven transmission chain; al-Jabarti's own milieu is itself evidence of continuing astronomical-instrument craft in late eighteenth-century Ottoman Egypt {cite:ajaib-al-athar-moreh-2013-v1 p. 515} {cite:arabicgenius-ajaib-al-athar obituary pp. 457–460}."
    ur: "آلہ اپنے نام اور کام کے ساتھ آلات کی تاریخ میں بیان شدہ رہتا ہے، نہ کوئی بچا ہوا نمونہ نہ ثابت منتقلی کی زنجیر؛ الجبرتی کا ماحول خود ہی اٹھارہویں صدی کے آخر کی عثمانی مصر میں فلکیاتی آلات سازی کے تسلسل کی گواہی ہے {cite:ajaib-al-athar-moreh-2013-v1 p. 515} {cite:arabicgenius-ajaib-al-athar obituary pp. 457–460}۔"
