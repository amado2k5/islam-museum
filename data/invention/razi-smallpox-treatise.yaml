kids:
  ar: "قبل ألف ومئة سنة كان الناس يخلطون بين مرضين مخيفين: الجدري والحصبة. كتب الرازي رسالة صغيرة قال فيها: انظر إلى علامات كل واحد — الحمى، الطفح، مساره — وستعرف أيّهما هو. صارت هذه أول طريقة معروفة للتفريق بين الأمراض المتشابهة."
  en: "Eleven hundred years ago people mixed up two scary diseases: smallpox and measles. Al-Razi wrote a short treatise saying: look at each one's signs — the fever, the rash, its course — and you will know which is which. That became the first known method for telling similar diseases apart."
  ur: "گیارہ سو سال پہلے لوگ دو خوفناک بیماریوں ملاتے تھے: چیچک اور خسرہ۔ رازی نے ایک چھوٹا رسالہ لکھا کہ ہر ایک کی علامات دیکھو — بخار، دانے، اس کا راستہ — تمہیں معلوم ہو جائے گا کون سی ہے۔ یہی ملتی بیماریوں میں فرق کی پہلی معلوم روش بنی۔"
