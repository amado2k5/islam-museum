summary:
  ar: "رسالة الرازي «في الجدري والحصبة» أول كتاب معروف يفصل بين مرضين كان الناس يخلطونهما — الجدري والحصبة — فيصف أعراض كل منهما وأسبابه وعلاجه؛ نقلت إلى اللاتينية وطبعت منذ القرن الخامس عشر وظلّت مرجعاً في التشخيص التفريقي."
  en: "Al-Razi's treatise on smallpox and measles is the first known book to separate two diseases people had conflated — describing each one's symptoms, causes and treatment; it passed into Latin, was printed from the fifteenth century and remained a reference in differential diagnosis."
  ur: "رازی کا چیچک اور خسرہ پر رسالہ پہلی معلوم کتاب ہے جس نے دو بیماریوں الگ کیں جو لوگ ملا کر دیکھتے تھے — ہر ایک کی علامات، اسباب اور علاج بیان کرتے ہوئے؛ یہ لاطینی میں منتقل ہوئی، پندرہویں صدی سے چھپتی رہی اور تفریق تشخیص کا مرجع رہی۔"
