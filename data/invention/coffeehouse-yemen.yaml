origin:
  place: place/mecca
  polity: polity/mamluk-sultanate
  context:
    ar: "مكة المملوكية نهاية القرن الخامس عشر: القهوة اليمنية الأصل ⁦(انظر [[invention/coffee-yemen]])⁩ حملها الدراويش للسهر في العبادة، ثم مدّنوها شراباً جماهيرياً في مقاهٍ خاصة {cite:ukers-all-about-coffee-1922 pp. 16-18; encyclopaedia-of-islam-2 vol. IV pp. 449-455 KAHWA}."
    en: "Mamluk Mecca at the close of the fifteenth century: the Yemeni drink (see [[invention/coffee-yemen]]) carried by dervishes for night worship was secularised into a public beverage sipped in dedicated houses {cite:ukers-all-about-coffee-1922 pp. 16-18; encyclopaedia-of-islam-2 vol. IV pp. 449-455 KAHWA}."
    ur: "پندرہویں صدی کے آخر کا مملوکی مکہ: یمن کی قہوہ ⁦(دیکھیے [[invention/coffee-yemen]])⁩ جو درویش رات کی عبادت کے لیے پیتے تھے، وہیں عوامی مشروب بن کر مخصوص خانوں میں پیی جانے لگی {cite:ukers-all-about-coffee-1922 pp. 16-18; encyclopaedia-of-islam-2 vol. IV pp. 449-455 KAHWA}۔"
makers:
  - person: person/abd-al-qadir-ibn-muhammad-al-jaziri
    role: describer
    place: place/cairo
    note: "Author of the earliest surviving treatise on coffee ('Umdat al-safwa); EI2's KAHWA entry draws on his essay for the introduction accounts. The institution itself grew up anonymously among drinkers."
    sources: [source/encyclopaedia-of-islam-2]

attribution:
  status: original
  claim:
    ar: "المقهى مؤسسة اجتماعية جديدة صنعها انتشار القهوة — لا مشرباً ولا جامعاً ولا سوقاً بل مكاناً رابعاً للاجتماع العام والخبر — موثق أولاً في مكة ثم القاهرة وإسطنبول."
    en: "The coffeehouse was a genuinely new social institution made by coffee's spread — neither tavern, mosque nor market but a fourth place for public gathering and news — documented first in Mecca, then Cairo and Istanbul."
    ur: "قہوہ خانہ قہوہ کے پھیلاؤ سے بننے والا فیصلہ کن نیا سماجی ادارہ — نہ شراب خانہ، نہ مسجد، نہ بازار بلکہ عوامی مجلس اور خبروں کی چوتھی جگہ — پہلے مکہ میں موثق، پھر قاہرہ اور استنبول۔"
  basis:
    ar: "Ukers يسمي مقاهي مكة kaveh kanes «أول المقاهي» ويؤرخ افتتاح مقهيي الشامسي والحكيم في إسطنبول 1554؛ وEI2 KAHWA يوثق المشروب اليمني ووصوله القاهرة مطلع القرن العاشر/السادس عشر وروايات المنع في مكة والقاهرة {cite:ukers-all-about-coffee-1922 pp. 16-20; encyclopaedia-of-islam-2 vol. IV pp. 449-455 KAHWA}."
    en: "Ukers calls the Meccan kaveh kanes 'the first coffee houses' and dates the Schemsi/Hekem houses of Istanbul to 1554; EI2 KAHWA documents the Yemeni beverage, its arrival in Cairo at the start of the tenth/sixteenth century and the prohibition episodes in Mecca and Cairo {cite:ukers-all-about-coffee-1922 pp. 16-20; encyclopaedia-of-islam-2 vol. IV pp. 449-455 KAHWA}."
    ur: "Ukers مکہ کے kaveh kanes کو «پہلے قہوہ خانے» کہتا ہے اور استنبول میں شمسی/حکیم کے خانوں کو 1554ء مؤرخ کرتا ہے؛ EI2 KAHWA یمنی مشروب، اس کے قاہرہ پہنچنے کو دسویں/سولہویں صدی کے آغاز پر اور مکہ و قاہرہ کی ممانعتوں کو موثق کرتی ہے {cite:ukers-all-about-coffee-1922 pp. 16-20; encyclopaedia-of-islam-2 vol. IV pp. 449-455 KAHWA}۔"
precursors:
  - external: { ar: "مجالس الدرويش وبيوت الخمر القديمة", en: "Dervish gatherings and the older wine-houses", ur: "درویش مجالس اور پرانے شراب خانے" }
    note: "Coffee reached Mecca through Sufi circles drinking it for night devotions; the houses secularised a devotional drink, they did not copy a prior institution — EI2 stresses the novelty of the beverage itself."
    sources: [source/ukers-all-about-coffee-1922, source/encyclopaedia-of-islam-2]
  - invention: invention/coffee-yemen
    note: "The drink itself: Yemeni coffee is the enabling invention the house was built to serve."
    sources: [source/encyclopaedia-of-islam-2]
dependents:
  - external: { ar: "مقاهي إسطنبول و«مدارس الحكماء»", en: "Istanbul's coffeehouses and the 'schools of the wise'", ur: "استنبول کے قہوہ خانے اور «حکیموں کے مکاتب»" }
    note: "The 1554 Tahtakale houses and their Ottoman descendants — lounges, carpets, and the kahveh kanes that Cotovicus called diversoria — turned the Meccan pattern into an imperial institution."
    sources: [source/ukers-all-about-coffee-1922]
  - external: { ar: "المقهى الأوروبي والكافيه العالمي", en: "The European coffee-house and the world café", ur: "یورپی کافی ہاؤس اور عالمی کیفے" }
    note: "From Venetian and Viennese beginnings to the London coffee-houses of 1652 onward — Ukers traces the whole chain back to the Oriental model."
    sources: [source/ukers-all-about-coffee-1922]
spread: []
impact:
  fields: [institutions-systems, food-drink]
  changed:
    ar: "أنشأت مكاناً عاماً للخبر واللعب والغناء خارج المسجد والبيت والسوق — فئة معمارية واجتماعية جديدة بالكلية في المدينة الإسلامية {cite:ukers-all-about-coffee-1922}."
    en: "It created a public space for news, games and music outside mosque, home and market — an entirely new social and architectural category in the Islamic city {cite:ukers-all-about-coffee-1922}."
    ur: "مسجد، گھر اور بازار سے باہر خبر، کھیل اور موسیقی کی عوامی جگہ بنائی — اسلامی شہر میں بالکل نئی معماری و سماجی قسم {cite:ukers-all-about-coffee-1922}۔"
  history:
    ar: "أول مؤسسة مدنية عالمية مبنية على مشروب؛ من مكة إلى طهطكلة إلى مقاهي لندن وفينا، خط متصل واحد {cite:ukers-all-about-coffee-1922}."
    en: "The first world civic institution built around a drink; from Mecca to Tahtakale to the coffee-houses of London and Vienna, one continuous line {cite:ukers-all-about-coffee-1922}."
    ur: "ایک مشروب پر بننے والا پہلا عالمی شہری ادارہ؛ مکہ سے تحت قلعہ اور لندن و ویانا کے کافی ہاؤسز تک ایک مسلسل سلسلہ {cite:ukers-all-about-coffee-1922}۔"
  significance: 5
  why: "A documented new public institution born in the Hijaz at the close of the fifteenth century that became the ancestor of the world's café."
