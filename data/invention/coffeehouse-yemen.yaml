today:
  form:
    ar: "المقهى اليوم مؤسسة عالمية بأسماء محلية — kahveh, café, coffeehouse — في كل مدينة؛ وما زال «اجتماع الناس على فنجان» وظيفته الأولى {cite:ukers-all-about-coffee-1922}."
    en: "The coffeehouse today is a world institution under local names — kahveh, café, coffeehouse — in every city; 'meeting over a cup' remains its first function {cite:ukers-all-about-coffee-1922}."
    ur: "قہوہ خانہ آج مقامی ناموں — kahveh، café، coffeehouse — سے ہر شہر کا عالمی ادارہ ہے؛ «ایک پیالی پر ملنا» آج بھی اس کا پہلا کام ہے {cite:ukers-all-about-coffee-1922}۔"
  descendants:
    ar: "الكافيه الحديث ومقهى الأعمال ومقهى الإنترنت من نسل المقهى المكي؛ وكافيه الخبراء العثماني استمر في قهوة خانه الإيرانية وقهوة العراق {cite:hattox-coffee-coffeehouses-1985}."
    en: "The modern café, the business coffee-shop and the internet café descend from the Meccan house; the Ottoman coffeehouse continues in Iran's qahveh khaneh and Iraq's chaikhana {cite:hattox-coffee-coffeehouses-1985}."
    ur: "جدید کیفے، بزنس کافی شاپ اور انٹرنیٹ کیفے مکی قہوہ خانے کی اولاد ہیں؛ عثمانی قہوہ خانہ ایران کے qahveh khaneh اور عراق کے چائے خانے میں جاری ہے {cite:hattox-coffee-coffeehouses-1985}۔"
