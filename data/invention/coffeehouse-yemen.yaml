kids:
  ar: "قبل خمسمئة سنة فتح الناس في مكة دكاكين يشربون فيها القهوة معاً ويلعبون الشطرنج ويسمعون الأخبار — كانت أول مقاهي في التاريخ. من هذه الدكاكين جاءت كل مقاهي العالم اليوم."
  en: "Five hundred years ago, people in Mecca opened rooms where they drank coffee together, played chess and heard the news — the first coffeehouses in history. Every café in the world today comes from those rooms."
  ur: "پانچ سو سال پہلے مکہ کے لوگوں نے ایسے خانے کھولے جہاں سب ساتھ قہوہ پیتے، شطرنج کھیلتے اور خبریں سنتے — تاریخ کے پہلے قہوہ خانے۔ آج دنیا کا ہر کیفے انہی خانوں کی اولاد ہے۔"
