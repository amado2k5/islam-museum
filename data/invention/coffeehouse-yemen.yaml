summary:
  ar: "مكان عام جديد صنعه انتشار القهوة: يُشرب فيه الشراب جماعةً ويُلعب الشطرنج ويُسمع الغناء ويُتداول الخبر — بدأ موثقاً في مكة نهاية القرن الخامس عشر، ثم القاهرة، وبلغ ذروته في إسطنبول 1554م بمقهيي الشامسي والحكيم في طهطكلة؛ اضطُهد مراراً ثم ثبت وصار نموذج المقهى العالمي {cite:ukers-all-about-coffee-1922 pp. 16-20; encyclopaedia-of-islam-2 vol. IV pp. 449-455 KAHWA}."
  en: "A new public place created by coffee's spread: a room where the drink is taken in company, chess is played, music heard and news exchanged — first documented in Mecca at the end of the fifteenth century, then Cairo, reaching its summit in the Istanbul of 1554 with the coffeehouses of Schemsi and Hekem at Tahtakale; persecuted repeatedly, it endured and became the model of the world's café {cite:ukers-all-about-coffee-1922 pp. 16-20; encyclopaedia-of-islam-2 vol. IV pp. 449-455 KAHWA}."
  ur: "قہوہ کے پھیلاؤ سے بننے والی نئی عوامی جگہ: جہاں مشروب ساتھ پیاجاتا، شطرنج کھیلی جاتی، موسیقی سنی جاتی اور خبریں بٹتی — پہلی موثق صورت پندرہویں صدی کے آخر میں مکہ میں، پھر قاہرہ، اور 1554ء میں استنبول کے تحت قلعہ میں شمسی و حکیم کے قہوہ خانوں پر عروج؛ بار بار ممانعت کے باوجود قائم رہی اور دنیا کے کیفے کا نمونہ بنی {cite:ukers-all-about-coffee-1922 pp. 16-20; encyclopaedia-of-islam-2 vol. IV pp. 449-455 KAHWA}۔"
