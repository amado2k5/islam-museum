kids:
  ar: "في المدينة قديماً كان في السوق رجل، وأحياناً امرأة، يعيّنه الخليفة ليتأكد أن الباعة لا يغشّون. كان يزن الموازين ليرى أنها صحيحة، ويتأكد أن الخبّاز ينضج خبزه جيداً، وأن أحداً لا يضع بضاعته في وسط الطريق. وكان اسمه بعد ذلك «المحتسب»."
  en: "Long ago in Medina, the caliph chose a man, and sometimes a woman, to watch over the market and make sure no seller cheated. This officer checked that the weights were true, that the baker baked his bread properly, and that nobody left their goods in the middle of the road. Later this officer was called the muhtasib."
  ur: "بہت پہلے مدینہ میں خلیفہ ایک مرد کو، اور کبھی ایک عورت کو، بازار کی نگرانی کے لیے چنتے تھے تاکہ کوئی بیچنے والا دھوکا نہ دے۔ یہ افسر دیکھتا کہ باٹ ٹھیک ہیں، نان بائی روٹی اچھی طرح پکاتا ہے، اور کوئی اپنا سامان راستے کے بیچ میں نہیں رکھتا۔ بعد میں اس افسر کو محتسب کہا جانے لگا۔"
