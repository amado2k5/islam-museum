summary:
  ar: "ولاية يعيّن فيها الحاكم رجلاً كفئاً يتفقد الأسواق والطرق، فينظر في الغش في المكاييل والموازين والأقوات، وفي تضييق الطرق والأبنية الآيلة للسقوط، ويؤدّب على قدر المخالفة دون أن ينتظر شكوى أو خصومة {cite:muqaddima-ibn-khaldun p. 221}. وتذكر موسوعة TDV أن النبي كان يتفقد السوق بنفسه ثم عيّن عمّالاً عليه، وأن عمر بن الخطاب عيّن عمّالاً على سوق المدينة، منهم امرأة هي الشفاء بنت عبد الله، ثم صار اسم الوظيفة «المحتسب» في العهد العباسي {cite:tdv-hisbe §history}."
  en: "An office in which the ruler appoints a capable person to watch over the markets and streets: he looks into fraud in measures, weights and foodstuffs, into blocked streets and buildings about to fall, and punishes in proportion to the offence without waiting for a complaint or a lawsuit {cite:muqaddima-ibn-khaldun p. 221}. The TDV encyclopedia says the Prophet inspected the market himself and later appointed officers over it, that Umar ibn al-Khattab appointed officers over the Medina market, among them a woman, al-Shifa' bint Abd Allah, and that under the Abbasids the officer came to be called the muhtasib {cite:tdv-hisbe §history}."
  ur: "ایک منصب جس میں حکمران ایک اہل شخص کو بازاروں اور راستوں کی نگرانی پر مقرر کرتا ہے: وہ ناپ تول اور غذائی اشیاء میں دھوکے، تنگ کیے گئے راستوں اور گرنے والی عمارتوں کو دیکھتا ہے، اور کسی شکایت یا مقدمے کا انتظار کیے بغیر جرم کے مطابق سزا دیتا ہے {cite:muqaddima-ibn-khaldun p. 221}۔ ٹی ڈی وی انسائیکلوپیڈیا کہتا ہے کہ نبی بازار کا خود معائنہ کرتے تھے اور بعد میں اس پر عامل مقرر کیے، کہ عمر بن الخطاب نے مدینہ کے بازار پر عامل مقرر کیے، جن میں ایک خاتون شفاء بنت عبد اللہ بھی تھیں، اور یہ کہ عباسی دور میں اس عہدیدار کو محتسب کہا جانے لگا {cite:tdv-hisbe §history}۔"
