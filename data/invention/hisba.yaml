today:
  form:
    ar: "تلاحظ موسوعة TDV أن الإسبانية ما زالت تستعمل كلمة almotacén بمعنى مفتش الموازين والمكاييل، ويرى محققو «معالم القربة» أن ما كان يتولاه المحتسب توزّع اليوم على وزارات التموين والصحة والداخلية وغيرها {cite:tdv-hisbe §history} {cite:maalim-qurba-edition-1976 p. 6}."
    en: "The TDV encyclopedia notes that Spanish still uses almotacén for an inspector of weights and measures, and the Ma'alim al-Qurba editors observe that the muhtasib's duties are spread today across ministries of supply, health, the interior and others {cite:tdv-hisbe §history} {cite:maalim-qurba-edition-1976 p. 6}."
    ur: "ٹی ڈی وی انسائیکلوپیڈیا بتاتا ہے کہ ہسپانوی میں آج بھی almotacén کا لفظ ناپ تول کے معائنہ کار کے لیے استعمال ہوتا ہے، اور معالم القربہ کے محققین کہتے ہیں کہ محتسب کے کام آج رسد، صحت، داخلہ اور دوسری وزارتوں میں بٹ گئے ہیں {cite:tdv-hisbe §history} {cite:maalim-qurba-edition-1976 p. 6}۔"
  descendants:
    ar: "مفتشو الموازين والمكاييل، ورقابة الأسواق والأغذية، وتراخيص المهن الطبية، كلها أعمال كانت في يد المحتسب {cite:maalim-qurba-edition-1976 p. 6}."
    en: "Weights-and-measures inspectors, market and food inspection, and the licensing of medical practitioners: all work that once lay in the muhtasib's hands {cite:maalim-qurba-edition-1976 p. 6}."
    ur: "ناپ تول کے معائنہ کار، بازار اور خوراک کی نگرانی، اور طبی پیشوں کے لائسنس: یہ سب وہ کام ہیں جو کبھی محتسب کے ہاتھ میں تھے {cite:maalim-qurba-edition-1976 p. 6}۔"
