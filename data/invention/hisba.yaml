impact:
  fields: [institutions-systems, everyday-life]
  changed:
    ar: "صار للسوق في المدينة الإسلامية موظف ثابت يعيّنه الحاكم، يأخذ أجره، ويتحرك من تلقاء نفسه دون شكوى: يختبر الموازين ويختمها، ويمنع البيع في الطرق الضيقة، ويحدد للخبازين ما يخبزون كل يوم حتى لا ينقطع الخبز، ويمتحن الفصّادين والأطباء والمجبّرين {cite:maalim-qurba-edition-1976 p. 137} {cite:maalim-qurba-edition-1976 p. 147} {cite:maalim-qurba-edition-1976 p. 157} {cite:maalim-qurba-edition-1976 p. 260}."
    en: "The market of the Muslim city gained a standing officer, appointed by the ruler and paid a salary, who acted on his own initiative without waiting for a complaint: he tested and sealed the weights, kept stalls out of narrow streets, set the bakers a daily quota so the town never ran short of bread, and examined bloodletters, physicians and bone-setters {cite:maalim-qurba-edition-1976 p. 137} {cite:maalim-qurba-edition-1976 p. 147} {cite:maalim-qurba-edition-1976 p. 157} {cite:maalim-qurba-edition-1976 p. 260}."
    ur: "مسلم شہر کے بازار کو ایک مستقل افسر ملا، جسے حکمران مقرر کرتا اور تنخواہ دیتا تھا، اور جو کسی شکایت کا انتظار کیے بغیر خود کارروائی کرتا تھا: وہ باٹ جانچتا اور ان پر مہر لگاتا، تنگ گلیوں سے دکانیں ہٹواتا، نان بائیوں کے لیے روزانہ کی مقدار مقرر کرتا تاکہ شہر میں روٹی کم نہ پڑے، اور فصد کرنے والوں، طبیبوں اور ہڈی جوڑنے والوں کا امتحان لیتا تھا {cite:maalim-qurba-edition-1976 p. 137} {cite:maalim-qurba-edition-1976 p. 147} {cite:maalim-qurba-edition-1976 p. 157} {cite:maalim-qurba-edition-1976 p. 260}۔"
  history:
    ar: "تقول موسوعة TDV إن الوظيفة بقيت باسم «صاحب السوق» في العهد الأموي، ثم صار صاحبها «المحتسب» في العهد العباسي، وانتشرت في مصر والشام والمغرب والأندلس وإيران والأناضول والدولة العثمانية، وانتقلت إلى الممالك الصليبية والإسبانية {cite:tdv-hisbe §history}. ويقول ابن خلدون إنها كانت تحت القاضي عند الفاطميين وأمويي الأندلس، ثم صارت ولاية سلطانية مستقلة {cite:muqaddima-ibn-khaldun p. 221}."
    en: "The TDV encyclopedia says the office kept the name 'master of the market' under the Umayyads, its holder became the muhtasib under the Abbasids, and it spread to Egypt, Syria, the Maghreb, al-Andalus, Iran, Anatolia and the Ottoman state, and passed to the Crusader and Spanish kingdoms {cite:tdv-hisbe §history}. Ibn Khaldun says it was under the judge for the Fatimids and the Umayyads of al-Andalus and later became a royal office of its own {cite:muqaddima-ibn-khaldun p. 221}."
    ur: "ٹی ڈی وی انسائیکلوپیڈیا کہتا ہے کہ اموی دور میں یہ منصب «صاحب السوق» کے نام سے باقی رہا، عباسی دور میں اس کا حامل محتسب کہلایا، اور یہ مصر، شام، مغرب، اندلس، ایران، اناطولیہ اور عثمانی ریاست تک پھیلا، اور صلیبی اور ہسپانوی سلطنتوں میں منتقل ہوا {cite:tdv-hisbe §history}۔ ابن خلدون کہتے ہیں کہ فاطمیوں اور اندلس کے امویوں کے ہاں یہ قاضی کے تحت تھا اور بعد میں ایک الگ شاہی منصب بن گیا {cite:muqaddima-ibn-khaldun p. 221}۔"
  significance: 4
  why: "A standing, salaried public office for the market and the street, traced by Sunni and academic sources alike to Medina, that ran for more than a thousand years across the Muslim world, produced its own manuals and passed by name into Crusader and Spanish market law."
