id: invention/hisba
class: invention
label:
  ar: "الحسبة ووالي السوق"
  en: "Hisba and the market inspector"
  ur: "حسبہ اور بازار کا محتسب"
names:
  - { value: "ولاية الحسبة", kind: alternate, lang: ar }
  - { value: "المحتسب", kind: alternate, lang: ar }
  - { value: "صاحب السوق", kind: alternate, lang: ar }
  - { value: "عامل السوق", kind: alternate, lang: ar }
