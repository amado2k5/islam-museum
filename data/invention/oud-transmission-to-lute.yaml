impact:
  fields: [music-instruments]
  changed:
    ar: "غيّرت الآلة الأوروبية ذاتها — أوروبا قبلها عرفت الكيثارة والهارب بلا دستات — وجلبت معها المقامات المنغمة والعزف بالدستات {cite:farmer-historical-facts-arabian-musical-influence-1930}."
    en: "It changed Europe's instruments themselves — pre-lute Europe knew fretless cithara and harp — and brought with it tuned modes and fretted playing {cite:farmer-historical-facts-arabian-musical-influence-1930}."
    ur: "یورپ کے آلات ہی بدل دیے — لیوٹ سے پہلے یورپ بغیر پرِدے کی کتھارہ اور ہارپ جانتا تھا — اور ساتھ سُریلے مقام اور پرِدہ دار بجاوٹ لایا {cite:farmer-historical-facts-arabian-musical-influence-1930}۔"
  history:
    ar: "من أنظف شواهد الانتقال الثقافي في التاريخ: كلمة عربية مركبة بالـ(al-) دخلت كل لغة أوروبية كبرى مع آلة صارت ملكة موسيقى النهضة {cite:farmer-historical-facts-arabian-musical-influence-1930}."
    en: "One of the cleanest witnesses of cultural transmission in history: an Arabic word with its article intact entered every major European language with an instrument that became the queen of Renaissance music {cite:farmer-historical-facts-arabian-musical-influence-1930}."
    ur: "تاریخ میں ثقافتی منتقلی کی صاف ترین گواہیوں میں سے: ال التعریف سمیت عربی لفظ ہر بڑی یورپی زبان میں داخل ہوا، اس آلے کے ساتھ جو نشاۃ ثانیہ کی موسیقی کی ملکہ بنا {cite:farmer-historical-facts-arabian-musical-influence-1930}۔"
  significance: 5
  why: "A documented instrument-plus-word transmission — al-ʿūd to lute — that reshaped European music; etymology lexicographically proven and the Andalusi channel named."
