  - external: { ar: "المزهر والكيران والموتر", en: "The mizhar, kiran and muwattar", ur: "مزھر، کران اور موتر" }
    note: "The pre-Islamic Arab lute types named in the poetry of Imru' al-Qays and Labid — skin-bellied instruments the lexicographers identify with the oud."
    sources: [source/encyclopaedia-of-islam-2]
