summary:
  ar: "انتقل العود — أهم آلات الإسلام الموسيقية — إلى أوروبا الغربية، ومرّ اسمه العربي إلى اللغات الأوروبية: alaude الإسبانية، liuto الإيطالية، luth الفرنسية، lute الإنجليزية، Laute الألمانية؛ قناة الانتقال الأندلس والمنستريل، والوثيقة اللسانية ⁦(al-ʿūd ← lute)⁩ ثابتة في المعاجم {cite:encyclopaedia-of-islam-2 vol. X pp. 769-771 'UD (II); farmer-historical-facts-arabian-musical-influence-1930 p. 137}."
  en: "The oud — the most important instrument of Islamic peoples — passed into Western Europe, and its Arabic name passed into the European languages: Spanish alaude, Italian liuto, French luth, English lute, German Laute; the Andalusi route and the minstrels carried it, and the etymology al-ʿūd → lute is lexicographically established {cite:encyclopaedia-of-islam-2 vol. X pp. 769-771 'UD (II); farmer-historical-facts-arabian-musical-influence-1930 p. 137}."
  ur: "عود — مسلم قوموں کا اہم ترین ساز — مغربی یورپ پہنچا اور اس کا عربی نام یورپی زبانوں میں داخل ہوا: ہسپانوی alaude، اطالوی liuto، فرانسیسی luth، انگریزی lute، جرمن Laute؛ اندلس کا راستہ اور مسافر موسیقار اسے لائے، اور al-ʿūd سے lute کی اشتقاق لغت میں ثابت ہے {cite:encyclopaedia-of-islam-2 vol. X pp. 769-771 'UD (II); farmer-historical-facts-arabian-musical-influence-1930 p. 137}۔"
  es: "El laúd —el instrumento más importante de los pueblos islámicos— pasó a Europa Occidental, y su nombre árabe pasó a las lenguas europeas: español alaude, italiano liuto, francés luth, inglés lute, alemán Laute; la ruta andalusí y los juglares lo llevaron, y la etimología al-ʿūd → laúd está establecida lexicográficamente {cite:encyclopaedia-of-islam-2 vol. X pp. 769-771 'UD (II); farmer-historical-facts-arabian-musical-influence-1930 p. 137}."
  fr: "Le oud — l'instrument le plus important des peuples islamiques — est passé en Europe occidentale, et son nom arabe est passé dans les langues européennes: espagnol alaude, italien liuto, français luth, anglais lute, allemand Laute; la route andalouse et les ménestrels l'ont transporté, et l'étymologie al-ʿūd → luth est établie lexicographiquement {cite:encyclopaedia-of-islam-2 vol. X pp. 769-771 'UD (II); farmer-historical-facts-arabian-musical-influence-1930 p. 137}."
