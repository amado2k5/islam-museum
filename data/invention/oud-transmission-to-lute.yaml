origin:
  place: place/cordoba
  polity: polity/umayyads-of-cordoba
  context:
    ar: "الأندلس الأموية، حيث وصل زرياب ⁦(ت نحو 238/852)⁩ حاملاً مدرسة بغداد العودية إلى قرطبة؛ ومن الأندلس ومن حركة المنستريل — كما يثبت فارمر — دخل اللوت والبندور وربما الغيتار أوروبا {cite:farmer-historical-facts-arabian-musical-influence-1930 pp. 135-138}."
    en: "Umayyad al-Andalus, where Ziryab (d. c. 852) carried the Baghdad oud school to Cordoba; through al-Andalus and the minstrel movement — as Farmer shows — the lute, the pandore and perhaps the guitar entered Europe {cite:farmer-historical-facts-arabian-musical-influence-1930 pp. 135-138}."
    ur: "اموی اندلس، جہاں زریاب ⁦(وفات تقریباً 852ء)⁩ بغداد کا مکتبِ عود قرطبہ لایا؛ اندلس اور منسترل تحریک کے ذریعے — فارمر کے مطابق — لیوٹ، پنڈور اور شاید گٹار یورپ آئے {cite:farmer-historical-facts-arabian-musical-influence-1930 pp. 135-138}۔"
makers:
  - person: person/ziryab
    role: transmitter
    place: place/cordoba
    note: "The documented carrier of the refined Baghdad oud tradition into Cordoba — the Andalusi channel through which the instrument and its name reached Europe; not the lute's inventor."
    sources: [source/encyclopaedia-of-islam-2, source/farmer-historical-facts-arabian-musical-influence-1930]

attribution:
  status: transmission
  claim:
    ar: "الموثق: نقل الآلة واسمها إلى أوروبا؛ لا اختراع العود ذاته — فالساسانيون عرفوا البرْبَط قبل الإسلام، ودور المسلمين صقل الآلة ⁦(البدن الخشبي، الدستات، الريشة)⁩ ونقلها غرباً."
    en: "Documented: the instrument and its name carried to Europe; no invention of the oud itself — the Sasanians knew the barbat before Islam, and the Muslim role was refining the instrument (wooden belly, frets, plectrum) and carrying it west."
    ur: "موثق: آلہ اور اس کا نام یورپ پہنچانا؛ خود عود کی ایجاد نہیں — ساسانیوں نے اسلام سے پہلے بربط جانا تھا، اور مسلمانوں کا کردار آلہ کی تکمیل ⁦(لکڑی کا بطن، پرِدے، پلیکٹرم)⁩ اور مغرب منتقلی تھا۔"
  basis:
    ar: "EI2: الاسم العربي دخل اللغات الأوروبية ⁦(alaude, liuto, luth, lute, Laute)⁩، والبربط الساساني سابق للعود العربي؛ وفارمر: أصل lute وrebec وguitar من al-ʿūd وrabāb وqītāra ثابت معجمياً، والمنستريل نشروا الآلات الجديدة ذات الدستات {cite:encyclopaedia-of-islam-2 vol. X pp. 769-771 'UD (II); farmer-historical-facts-arabian-musical-influence-1930 pp. 135-138}."
    en: "EI2: the Arabic name entered the European languages (alaude, liuto, luth, lute, Laute), and the Sasanian barbat precedes the Arab oud; Farmer: the derivation of lute, rebec and guitar from al-ʿūd, rabāb and qītāra is lexicographically established, and minstrels spread the new fretted instruments {cite:encyclopaedia-of-islam-2 vol. X pp. 769-771 'UD (II); farmer-historical-facts-arabian-musical-influence-1930 pp. 135-138}."
    ur: "EI2: عربی نام یورپی زبانوں میں داخل ہوا ⁦(alaude, liuto, luth, lute, Laute)⁩ اور ساسانی بربط عرب عود سے پہلے ہے؛ فارمر: lute، rebec اور guitar کی اشتقاق al-ʿūd، rabāb اور qītāra سے لغوی طور پر ثابت ہے اور منسترل نے نئے پرِدہ دار آلات پھیلائے {cite:encyclopaedia-of-islam-2 vol. X pp. 769-771 'UD (II); farmer-historical-facts-arabian-musical-influence-1930 pp. 135-138}۔"
  perspectives:
    - tradition: sunni
      stance: { ar: "آلة الحضارة تنتقل غرباً", en: "A civilisation's instrument travelling west", ur: "تہذیب کا ساز مغرب کی طرف" }
      summary: { ar: "آلة الحضارة تنتقل غرباً — كتب الأدب العربية تجعل العود سيد الآلات في بغداد والأندلس، ونقلة زرياب توثق حمله المدرسةَ البغدادية إلى قرطبة؛ فالانتقال جزء من سيرة الحضارة نفسها {cite:encyclopaedia-of-islam-2}.", en: "Arabic letters make the oud the master instrument of Baghdad and al-Andalus, and Ziryab's move documents the carrying of the Baghdad school to Cordoba; the transmission is part of the civilisation's own story {cite:encyclopaedia-of-islam-2}.", ur: "آلة الحضارة تنتقل غرباً — عربی ادب عود کو بغداد اور اندلس کا سردار ساز بناتا ہے اور زریاب کی آمد بغداد مکتب کے قرطبہ انتقال کی دستاویز ہے؛ یہ منتقلی تہذیب کی خود کہانی ہے {cite:encyclopaedia-of-islam-2}۔" }
      sources: [source/encyclopaedia-of-islam-2]
    - tradition: academic
      stance: { ar: "الاشتقاق ثابت والقناة متعددة", en: "Etymology proven, channels multiple", ur: "اشتقاق ثابت، راستے متعدد" }
      summary: { ar: "الاشتقاق ثابت والقناة متعددة — Farmer يثبت al-ʿūd ← lute معجمياً ويعتبر القناة الأندلسية والمنستريل والحروب الصليبية مجتمعة، مع بقاء سؤال الغيتار مفتوحاً؛ والأصل البعيد للآلة ⁦(الهند، ساسان)⁩ سابق للإسلام {cite:farmer-historical-facts-arabian-musical-influence-1930 pp. 135-138}.", en: "Farmer proves al-ʿūd → lute lexicographically and counts the Andalusi channel, the minstrels and the Crusades together, with the guitar question still open; the instrument's deep root (India, Sasanian Persia) predates Islam {cite:farmer-historical-facts-arabian-musical-influence-1930 pp. 135-138}.", ur: "اشتقاق ثابت اور راستے متعدد — فارمر al-ʿūd سے lute لغوی ثابت کرتا ہے اور اندلسی راستہ، منسترل اور صلیبی جنگوں کو ملا کر گنتا ہے، گٹار کا سوال کھلا ہے؛ آلہ کی گہری جڑ ⁦(ہند، ساسانی)⁩ اسلام سے پہلے کی ہے {cite:farmer-historical-facts-arabian-musical-influence-1930 pp. 135-138}۔" }
      sources: [source/farmer-historical-facts-arabian-musical-influence-1930, source/encyclopaedia-of-islam-2]
