today:
  form:
    ar: "العود حي آلةً عربية وفارسية وتركية وأرمنية، واللوت عاد في حركة الموسيقى القديمة الأوروبية؛ الاسمان — ʿūd وlute — أخوان معجميان {cite:encyclopaedia-of-islam-2}."
    en: "The oud lives as an Arab, Persian, Turkish and Armenian instrument, and the lute has returned in Europe's early-music movement; ʿūd and lute remain etymological siblings {cite:encyclopaedia-of-islam-2}."
    ur: "عود عرب، فارسی، ترک اور ارمنی ساز کے طور پر جیتا ہے اور لیوٹ یورپ کی قدیم موسیقی تحریک میں لوٹا ہے؛ ʿūd اور lute اشتقاقی بہن بھائی ہیں {cite:encyclopaedia-of-islam-2}۔"
  descendants:
    ar: "الجيتارة الحديثة والماندولين واللوث نفسه من نسل نفس العائلة المنقولة؛ والعود الشرقي بقي سيد الآلات الشرقية {cite:farmer-oriental-musical-instruments-1931}."
    en: "The modern guitar, mandolin and the lute itself descend from the same transmitted family; the eastern oud remains master of the Middle Eastern ensemble {cite:farmer-oriental-musical-instruments-1931}."
    ur: "جدید گٹار، مینڈولن اور خود لیوٹ اسی منقولہ خاندان کی اولاد ہیں؛ مشرقی عود آج بھی مشرقی موسیقی کا سردار ہے {cite:farmer-oriental-musical-instruments-1931}۔"
