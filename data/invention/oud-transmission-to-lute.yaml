  - external: { ar: "الغيتار والبندور والرباب الأوروبية", en: "The guitar, pandore and rebec of Europe", ur: "یورپ کا گٹار، پنڈور اور رباب" }
    note: "The wider family carried by the same channels: pandore from tanbur, rebec from rabab, and the guitar's route still discussed (Farmer)."
    sources: [source/farmer-historical-facts-arabian-musical-influence-1930]
