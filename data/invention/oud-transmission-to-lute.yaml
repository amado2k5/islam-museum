kids:
  ar: "الآلة التي تسمّيها أوروبا lute جاءتها من العربية: al-ʿūd — حتى حرفا «ال» دخلا الاسم! حملها الموسيقيون من قرطبة إلى بقية أوروبا، فصارت أشهر آلة في قصص الفرسان والغناء."
  en: "The instrument Europe calls the lute got its name straight from Arabic: al-ʿūd — even the 'al-' went into the name! Musicians carried it from Cordoba across Europe, where it became the most famous instrument of knights and song."
  ur: "یورپ جس آلہ کو lute کہتا ہے اس کا نام براہ راست عربی سے آیا: al-ʿūd — حتیٰ کہ «ال» بھی نام میں شامل ہو گیا! موسیقار اسے قرطبہ سے سارے یورپ میں لے گئے جہاں یہ گیت اور شہسواری کا مشہور ترین ساز بنا۔"
