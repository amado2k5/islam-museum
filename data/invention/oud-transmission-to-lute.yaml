id: invention/oud-transmission-to-lute
class: invention
label:
  ar: "انتقال العود إلى أوروبا بوصفه الليث ⁦(اللوت)⁩"
  en: "The transmission of the Arabic oud to Europe as the lute"
  ur: "عرب عود کی یورپ منتقلی بطور لیوٹ ⁦(لوت)⁩"
  es: "La transmisión del oud árabe a Europa como laúd"
  fr: "La transmission du oud arabe en Europe sous la forme du luth"
names:
  - { value: "العود", kind: alternate, lang: ar }
  - { value: "al-ʿūd", kind: alternate, lang: en }
  - { value: "lute", kind: alternate, lang: en }
