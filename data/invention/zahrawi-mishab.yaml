  claim:
    ar: "وصف أداة لتفتيت حصاة الإحليل ضمن تقليد أقدم لعلاج الحصى، لا اختراع الجراحة أو كل تفتيت للحصى."
    en: "A described urethral-stone fragmentation tool within an older stone-treatment tradition, not invention of surgery or all lithotripsy."
    ur: "پتھری کے علاج کی پرانی روایت میں نالی کی پتھری توڑنے کا بیان کردہ آلہ؛ پوری جراحی یا ہر تفتيت کی ایجاد نہیں۔"
  basis:
    ar: "ينشر عبد الحليم وزملاؤه النص المترجم الذي يسمي المثقاب Al-Mishaab ويذكر تجربة المؤلف، ويفرقونه من كلاليب المثانة؛ أولوية التفتيت المطلقة تفسير للمؤرخين لا نتيجة يحسمها المتحف {cite:alzahrawi-stones-abdelhalim-2003 pp. 1286–1289}."
    en: "Abdel-Halim et al. publish a translated passage naming al-mishab and reporting the author's experience, distinct from bladder forceps; blanket lithotripsy priority is a historians' interpretation, not a museum verdict {cite:alzahrawi-stones-abdelhalim-2003 pp. 1286–1289}."
    ur: "عبد الحلیم اور دیگر نے مثقب اور مصنف کے تجربے کا ترجمہ شائع کیا، اسے مثانے کے چمٹوں سے الگ رکھا؛ ہر تفتيت کی مطلق اولینیت مورخین کی تعبیر ہے، میوزیم کا فیصلہ نہیں {cite:alzahrawi-stones-abdelhalim-2003 pp. 1286–1289}۔"
