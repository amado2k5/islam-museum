kids:
  ar: "الحصاة هنا حجر صغير علق في مجرى البول. وصف الزهراوي أداة تحاول تصغير الحجر بدلاً من إخراجه كله بالشكل نفسه. نقرأ هذه الفكرة في كتاب قديم ورسومه، لا بوصفها تجربة نجريها على إنسان؛ إنها قصة معرفة طبية تاريخية وليست نصيحة للعلاج."
  en: "The stone here is a small hard lump stuck in the urine passage. Al-Zahrawi described a tool intended to make it smaller rather than remove it whole. We study this in an old book and its drawings, not as an experiment to perform on someone: historical medical knowledge, not treatment advice."
  ur: "یہاں پتھری پیشاب کی نالی میں اٹکا سخت چھوٹا ٹکڑا ہے۔ الزہراوی نے اسے پورا نکالنے کے بجائے چھوٹا کرنے کا آلہ بیان کیا۔ ہم پرانی کتاب و خاکوں میں یہ خیال پڑھتے ہیں، کسی انسان پر آزمانے کے لیے نہیں؛ یہ طبی تاریخ ہے، علاج کا مشورہ نہیں۔"
