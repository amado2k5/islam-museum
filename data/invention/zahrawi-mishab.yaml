  changed:
    ar: "يقترح النص تفتيت حصاة الإحليل لتجنب الشق في بعض الحالات، مع ذكر بديل حين لا يتيسر؛ لا يقدم سجل مرضى أو نسبة نجاح {cite:alzahrawi-stones-abdelhalim-2003 pp. 1288–1289}."
    en: "The text proposes fragmenting a urethral stone to avoid incision in some cases, with an alternative when infeasible; no patient series or success rate is supplied {cite:alzahrawi-stones-abdelhalim-2003 pp. 1288–1289}."
    ur: "متن بعض صورتوں میں شگاف سے بچنے کے لیے نالی کی پتھری توڑنے کا طریقہ اور ممکن نہ ہو تو متبادل بیان کرتا ہے؛ مریضوں کی فہرست یا شرح کامیابی نہیں دیتا {cite:alzahrawi-stones-abdelhalim-2003 pp. 1288–1289}۔"
  history:
