id: invention/zahrawi-mishab
class: invention
label: { ar: "مثقاب حصاة الإحليل عند الزهراوي", en: "Al-Zahrawi's urethral-stone drill", ur: "الزہراوی کا پیشاب کی نالی کی پتھری کا مثقب" }
names:
  - { value: "Al-Mishaab", kind: alternate, lang: en }
summary:
  ar: "مثقاب معدني ذو مقبض خشبي يصفه الزهراوي لحصاة سدت الإحليل، مجرى البول بعد المثانة، في الفصل الستين من كتاب جراحة التصريف {cite:alzahrawi-stones-abdelhalim-2003 p. 1288}. ليس ملقط حصاة المثانة ولا آلة تفتيت بالموجات؛ والسجل يثبت الوصف التاريخي، لا نجاحه السريري بمقاييس حديثة {cite:alzahrawi-stones-abdelhalim-2003 pp. 1286–1289}."
  en: "A metal drill with a wooden handle described in surgical chapter60 of al-Tasrif for a stone obstructing the urethra, the urine passage beyond the bladder {cite:alzahrawi-stones-abdelhalim-2003 p. 1288}. Not bladder-stone forceps or a shock-wave machine; the record documents a historical account, not modern clinical efficacy {cite:alzahrawi-stones-abdelhalim-2003 pp. 1286–1289}."
  ur: "لکڑی کے دستے والا دھاتی مثقب، جسے التصریف کے جراحی باب60 میں مثانے کے بعد پیشاب کی نالی میں رکی پتھری کے لیے بیان کیا گیا {cite:alzahrawi-stones-abdelhalim-2003 p. 1288}۔ مثانے کا چمٹا یا لہروں کی جدید مشین نہیں؛ تاریخی بیان کی شہادت ہے، جدید طبی کامیابی کی ضمانت نہیں {cite:alzahrawi-stones-abdelhalim-2003 pp. 1286–1289}۔"
