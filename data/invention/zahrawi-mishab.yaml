    en: "The surgical book preserved instrument descriptions and uses through translations and editions; book circulation does not count users of every device {cite:tdv-tasrif-zehravi pp. 132–133}."
    ur: "جراحی کتاب نے آلات اور استعمال کا بیان تراجم و طبعات میں محفوظ کیا؛ کتاب کا پھیلاؤ ہر آلے کے صارفین کی گنتی نہیں {cite:tdv-tasrif-zehravi pp. 132–133}۔"
  significance: 3
  why: "Specific documented instrument and obstruction problem, with clear distinction from bladder forceps, modern lithotripsy and global priority claims."
