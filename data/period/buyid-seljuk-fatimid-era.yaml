summary:
  en: "The centuries when the Abbasid caliph was a symbolic centre while Buyids, Fatimids, Seljuks and others held power, and when Ibn Sina, al-Biruni and al-Ghazali worked."
  ar: "القرون التي بقي فيها الخليفة العباسي مركزًا رمزيًا بينما حكمت أسر كالبويهيين والفاطميين والسلاجقة، وفيها عمل ابن سينا والبيروني والغزالي."
  es: "Los siglos en que el califa abasí fue un centro simbólico mientras los buyíes, fatimíes, selyúcidas y otros ostentaban el poder, y cuando Ibn Sina, al-Biruni y al-Ghazali trabajaron."
  fr: "Les siècles où le calife abbasside était un centre symbolique tandis que les Bouyides, les Fatimides, les Seldjoukides et d'autres détenaient le pouvoir, et où Ibn Sina, al-Biruni et al-Ghazali travaillaient."
  ur: "وہ صدیاں جب عباسی خلیفہ ایک علامتی مرکز تھا جب کہ بوئڈ، فاطمی، سلجوق اور دیگر اقتدار پر فائز تھے، اور جب ابن سینا، البیرونی اور الغزالی نے کام کیا۔"
