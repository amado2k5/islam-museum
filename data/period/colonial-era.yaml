summary:
  en: "The period when European powers conquered, ruled or dominated most Muslim-majority lands, and when reform and independence movements arose."
  ar: "الفترة التي أخضعت فيها القوى الأوروبية معظم البلاد ذات الأغلبية المسلمة أو حكمتها أو هيمنت عليها، ونشأت فيها حركات الإصلاح والاستقلال."
  es: "El período en que las potencias europeas conquistaron, gobernaron o dominaron la mayoría de los territorios de mayoría musulmana, y en que surgieron los movimientos de reforma e independencia."
  fr: "La période où les puissances européennes ont conquis, gouverné ou dominé la plupart des territoires à majorité musulmane, et où sont apparus les mouvements de réforme et d'indépendance."
  ur: "وہ دور جب یورپی طاقتوں نے زیادہ تر مسلم اکثریتی سرزمینوں کو فتح کیا، حکومت کی یا ان پر غلبہ حاصل کیا، اور جب اصلاحات اور آزادی کی تحریکیں اٹھیں۔"
  tr: "Avrupa güçlerinin Müslüman çoğunluğa sahip ülkelerin büyük çoğunluğunu boyunduruk altına aldığı, yönettiği veya egemenlik altına aldığı ve reform ve bağımsızlık hareketlerinin ortaya çıktığı dönem."
  id: "Periode di mana kekuatan-kekuatan Eropa menaklukkan, memerintah, atau mendominasi sebagian besar negara-negara mayoritas Muslim, dan di mana gerakan reformasi dan kemerdekaan muncul."
