label: { en: Abbasid Fragmentation, ar: عصر تفكك الخلافة العباسية, es: "Fragmentación abasí", fr: "Fragmentation abbasside", ur: "عباسی فرگمنٹیشن", tr: "Abbasi Halifeliğinin dağılma dönemi", id: "Era runtuhnya Kekhalifahan Abbasiyah" }
summary:
  en: "The decades when regional dynasties such as the Tulunids, Samanids and Saffarids won real autonomy while Abbasid caliphs in Baghdad lost control of the army and provinces."
  ar: "العقود التي نالت فيها سلالات إقليمية كالطولونيين والسامانيين والصفاريين استقلالًا فعليًا بينما فقد الخلفاء العباسيون في بغداد السيطرة على الجيش والأقاليم."
  es: "Las décadas en las que dinastías regionales como los Tuluníes, los Samánidas y los Safáridas lograron una autonomía real, mientras que los califas abasíes en Bagdad perdieron el control del ejército y las provincias."
  fr: "Les décennies où des dynasties régionales telles que les Toulounides, les Samanides et les Saffarides ont acquis une réelle autonomie tandis que les califes abbassides à Bagdad perdaient le contrôle de l'armée et des provinces."
  ur: "وہ دہائیاں جب علاقائی خاندانوں جیسے کہ تلونید، سامانی اور صفاری نے حقیقی خود مختاری حاصل کی جبکہ بغداد میں عباسی خلفاء نے فوج اور صوبوں کا کنٹرول کھو دیا۔"
  tr: "Tuluniler, Samaniler ve Saffariler gibi bölgesel hanedanlıkların fiilen bağımsızlık kazandığı, buna karşılık Bağdat'taki Abbasi halifelerinin ordu ve eyaletler üzerindeki kontrolünü kaybettiği on yıllar."
  id: "Dekade-dekade di mana dinasti-dinasti regional seperti Tulunid, Samanid, dan Saffarid memperoleh kemerdekaan yang efektif, sementara para khalifah Abbasiyah di Baghdad kehilangan kendali atas tentara dan provinsi-provinsi."
