- { id: person/abu-al-abbas-al-dabbi, label: { ar: "أبو العباس الدبّي", en: "Abu al-Abbas al-Dabbi", ur: "ابو العباس دبّی" }, class: person, note: "خلف الصاحب بن عباد في الوزارة لآل بويه (ت ٣٩٩هـ/١٠٠٨م)؛ ذكره الراغب الأصفهاني بلقبه الكامل فيرجّح أنه كان يكتب في مدة وزارته {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390}" }
