- { id: person/ilyas, label: { ar: "إلياس", en: "Ilyas (Elijah)", ur: "الیاس" }, class: person, note: "نبي من أنبياء بني إسرائيل؛ تورد نهاية الأرب للنويري ج14 خبره مع قومه عبدة بعل ومع اليسع {cite:nihayat-al-arab-dar-al-kutub-v14-1943 p. 25} {cite:nihayat-al-arab-dar-al-kutub-v14-1943 p. 38}" }
- { id: person/ibn-salim-al-basri, label: { ar: "ابن سالم البصري", en: "Ibn Salim of Basra", ur: "ابن سالم بصری" }, class: person, note: "شيخ بالبصرة كان يكفّر أبا يزيد البسطامي بقوله «سبحاني»، وناظره السراج في مجلسه {cite:luma-sarraj-jadir-dar-al-fath p. 525} {cite:luma-sarraj-jadir-dar-al-fath p. 526}؛ ويرجّح نيكلسون أنه أبو الحسن بن سالم {cite:luma-sarraj-nicholson-1914 p. 489}" }
