- { id: person/ilyas, label: { ar: "إلياس", en: "Ilyas (Elijah)", ur: "الیاس" }, class: person, note: "نبي من أنبياء بني إسرائيل؛ تورد نهاية الأرب للنويري ج14 خبره مع قومه عبدة بعل ومع اليسع {cite:nihayat-al-arab-dar-al-kutub-v14-1943 p. 25} {cite:nihayat-al-arab-dar-al-kutub-v14-1943 p. 38}" }
- { id: person/ibn-salim-al-basri, label: { ar: "ابن سالم البصري", en: "Ibn Salim of Basra", ur: "ابن سالم بصری" }, class: person, note: "شيخ بالبصرة كان يكفّر أبا يزيد البسطامي بقوله «سبحاني»، وناظره السراج في مجلسه {cite:luma-sarraj-jadir-dar-al-fath p. 525} {cite:luma-sarraj-jadir-dar-al-fath p. 526}؛ ويرجّح نيكلسون أنه أبو الحسن بن سالم {cite:luma-sarraj-nicholson-1914 p. 489}" }
- { id: work/sahifat-bishr-ibn-al-mutamir, label: { ar: "صحيفة بشر بن المعتمر", en: "The Treatise of Bishr ibn al-Mu'tamir", ur: "بشر بن المعتمر کا صحیفہ" }, class: work, note: "صحيفة في صناعة الكلام دفعها بشر بن المعتمر إلى فتيان كان يعلمهم إبراهيم بن جبلة الخطابة، يحفظ نصها الجاحظ في البيان والتبيين {cite:bayan-tabyin-harun-khanji-1998 p. 162} {cite:bayan-tabyin-harun-khanji-1998 p. 163}" }
- { id: concept/al-bayan, label: { ar: "البيان", en: "Bayan (eloquent exposition)", ur: "بیان" }, class: concept, note: "يعرّفه الجاحظ بأنه اسم جامع لكل شيء كشف قناع المعنى، ويعدّ أصناف الدلالات خمسة: اللفظ والإشارة والعقد والخط والنصبة {cite:bayan-tabyin-harun-khanji-1998 p. 103}" }
