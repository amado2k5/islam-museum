- { id: person/al-abbas-ibn-ahmad-ibn-tulun, label: { ar: "العباس بن أحمد بن طولون", en: "al-Abbas ibn Ahmad ibn Tulun", ur: "عباس بن احمد بن طولون" }, class: person, note: "بكر أولاد ابن طولون وولي عهده؛ استُخلف على مصر فعصى وفر إلى الإسكندرية ثم برقة، وردّته هزيمة النفوسي وسط ٢٦٧هـ فأُسر خارج الإسكندرية وجُلد وحُبس، ثم قُتل بعد وفاة أبيه بأيام {cite:encyclopaedia-of-islam-2 vol. 12 p. 10} {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 67}" }
- { id: person/al-mufawwad, label: { ar: "المفوّض إلى الله", en: "al-Mufawwad ila Allah", ur: "مفوّض الی اللہ" }, class: person, note: "جعفر بن المعتمد؛ خلف يرجوخ في إقطاع مصر سنة ٢٥٨هـ/٨٧٢م حين قُسمت المملكة بينه وبين عمه الموفق {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}" }
- { id: person/lulu-al-tuluni, label: { ar: "لؤلؤ الطولوني", en: "Lu'lu' the Tulunid amir", ur: "لؤلؤ طولونی" }, class: person, note: "أمير طولوني نصبه ابن طولون نائباً له على حمص وحلب وقنسرين وديار مضر بعد ضم الشام ٢٦٤هـ/٨٧٨م {cite:encyclopaedia-of-islam-2 vol. 3 p. 426}، ثم انشقّ إلى الموفق سنة ٢٦٩هـ/٨٨٣م {cite:encyclopaedia-of-islam-2 vol. 10 p. 666}" }
- { id: person/tulun, label: { ar: "طولون", en: "Tulun", ur: "طولون" }, class: person, note: "أبو أحمد؛ يُقال إنه كان في جملة ما بعث به والي بخارى هديةً إلى المأمون نحو سنة ٢٠٠هـ/٨١٥-٨١٦م، فصار إلى قيادة الحرس الخاص بالخليفة {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}" }
