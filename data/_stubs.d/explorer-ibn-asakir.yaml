- { id: person/al-sain-hibat-allah-ibn-asakir, label: { ar: "الصائن هبة الله بن الحسن بن عساكر", en: "al-Sa'in Hibat Allah ibn al-Hasan Ibn 'Asakir", ur: "صائن ہبۃ اللہ بن الحسن ابن عساکر" }, class: person, note: "الأخ الأكبر لابن عساكر الحافظ؛ ولد رجب ٤٨٨هـ/١٠٩٥م، فقيه شافعي درّس في الغزالية بالجامع الأموي وكان مفتياً، سمّع أخاه الحديث سنة ٥٠٥هـ، توفي شعبان ٥٦٣هـ/يونيو ١١٦٨م ودفن بمقبرة باب الصغير {cite:encyclopaedia-of-islam-2 vol. 3 p. 745}" }
- { id: person/al-furawi-abu-abdallah, label: { ar: "أبو عبد الله الفراوي", en: "Abu 'Abdallah al-Furawi", ur: "ابوعبداللہ فراوی" }, class: person, note: "محمد بن الفضل الفراوي، شيخ ابن عساكر بأصبهان ومن سمع منه في رحلته الثانية؛ فقرأ عليه ثلاثة أيام وأكثر عليه {cite:tarikh-islam-dhahabi p. 71}" }
- { id: person/muin-al-din-anar, label: { ar: "معين الدين أنر", en: "Mu'in al-Din Anar", ur: "معین الدین انر" }, class: person, note: "حاكم دمشق بعد طغتكين؛ منذ دولته لم يفارق ابن عساكر مدينته وتفرغ أربعين سنة للعلم {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}" }
- { id: person/jamal-al-islam-ibn-muslim-al-sulami, label: { ar: "جمال الإسلام بن مسلم السلمي", en: "Jamal al-Islam ibn Muslim al-Sulami", ur: "جمال الاسلام بن مسلم سلمی" }, class: person, note: "أبو الحسن السلمي المتوفى ٥٣٣هـ/١١٣٩م؛ من مشايخ ابن عساكر، وقد حضر الشاب دروسه الافتتاحية بالمدرسة الشافعية التي بناها كمشتكين سنة ٥١٤هـ/١١٢٠م {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}" }
- { id: person/sad-al-khayr-al-ansari, label: { ar: "سعد الخير الأنصاري", en: "Sa'd al-Khayr al-Ansari", ur: "سعد الخیر انصاری" }, class: person, note: "الحنبلي أبو الحسن تلميذ الغزالي؛ سمع منه ابن عساكر ببغداد في إقامته ٥٢٠-٥٢٥هـ {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}" }
- { id: person/taj-al-mulk-buri, label: { ar: "تاج الملك بوري", en: "Taj al-Mulk Buri", ur: "تاج الملک بوری" }, class: person, note: "صاحب دمشق؛ اغتيل سنة ٥٢٥هـ وهي سنة عودة ابن عساكر من بغداد إلى دمشق {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}" }
