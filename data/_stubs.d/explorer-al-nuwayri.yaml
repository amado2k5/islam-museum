# Devin's stub list for the al-Nuwayri Explorer story (person/al-nuwayri).
- { id: person/taj-al-din-abd-al-wahhab-al-nuwayri, label: { ar: "تاج الدين عبد الوهاب النويري", en: "Taj al-Din Abd al-Wahhab al-Nuwayri", ur: "تاج الدین عبدالوہاب نويری" }, class: person, note: "والد النويري الموسوعي (٦١٨-٦٩٩هـ/١٢٢١-١٢٩٩م)، ولد بمصر في المدرسة المعروفة بمنازل العز وتوفي في المدرسة الصالحية النجمية في حجرة مخصصة للتدريس المالكي يوم ٢١ ذي الحجة ٦٩٩هـ/٧ سبتمبر ١٢٩٩م ودُفن بتربة القاضي ابن مخلوف النويري الجزولي {cite:encyclopaedia-of-islam-2 vol. 8 p. 156}" }
- { id: person/alaa-al-din-mughultay, label: { ar: "علاء الدين مغلطاي", en: "Ala' al-Din Mughultay", ur: "علاء الدین مغلطائی" }, class: person, note: "الأمير علاء الدين مغلطاي المملوكي (ت ٧٠٧هـ/١٣٠٧م)، قاتل النويري إلى جانبه التتار يوم ٢٩ شعبان ٧٠٢هـ وكان النويري يعرفه من القاهرة {cite:encyclopaedia-of-islam-2 vol. 8 pp. 157, 159}" }
- { id: person/ibn-abbada-al-malatiqi, label: { ar: "ابن عبادة", en: "Ibn Abbada", ur: "ابن عبادہ" }, class: person, note: "وكيل الخاص للسلطان الناصر محمد بن قلاوون (ت ٧١٠هـ)؛ استناب النويري في المدرسة الناصرية والمنصورية ثم ضربه بالمقارع وصادر ماله وأبعده إلى الشام {cite:suluk-maqrizi p. 91} {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}" }
- { id: person/shams-al-din-karasunkur, label: { ar: "شمس الدين كراسنكر", en: "Shams al-Din Karasunkur", ur: "شمس الدین کراسنکر" }, class: person, note: "نائب حلب الذي فرّ إلى التتار سنة ٧١٢هـ واستمال نواب الشام، وقد عصاه النويري فأثنى الأمراء عن اتباعه {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}" }
- { id: person/jamal-al-din-aqqush-al-afram, label: { ar: "جمال الدين أقوش الأفرم", en: "Jamal al-Din Aqqush al-Afram", ur: "جمال الدین آقوش افرم" }, class: person, note: "نائب دمشق الذي انضم إلى فرار كراسنكر إلى التتار سنة ٧١٢هـ؛ حاول النويري من طرابلس ثنيه عن المشي معه {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}" }
- { id: person/taj-al-din-al-tawil, label: { ar: "تاج الدين الطويل", en: "Taj al-Din al-Tawil", ur: "تاج الدین طویل" }, class: person, note: "مستوفي الدولة وصاحب ديوان الإنشاء بطرابلس (ت ٧١١هـ)، خلفه النويري على الإنشاء سنة ٧١٠هـ {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}" }
- { id: person/ibn-makhluf-al-nuwayri-al-jazuli, label: { ar: "ابن مخلوف النويري الجزولي", en: "Ibn Makhluf al-Nuwayri al-Jazuli", ur: "ابن مخلوف نويری جزولی" }, class: person, note: "قاضي القضاة المالكي (ت ٧١٨هـ/١٣١٨م) أربعاً وثلاثين سنة، نسب إلى نويرة؛ دُفن في تربته أبو النويري الموسوعي، ولا قرابة بينهما عند المعجم الإسلامي {cite:encyclopaedia-of-islam-2 vol. 8 p. 156}" }
- { id: person/sayf-al-din-al-turkumani-al-amir, label: { ar: "الأمير سيف الدين التركماني", en: "The amir Sayf al-Din al-Turkumani", ur: "امیر سیف الدین ترکمانی" }, class: person, note: "أمير مملوكي توفي نحو ٧٠٧هـ فولّى السلطان النويريَ حصر أمواله وأمره ببناء تربة له بالقرافة ورسم السلطان خطتها بيده {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}" }
- { id: person/wazira-bint-al-munadhdha, label: { ar: "وزيرة بنت المنذة", en: "Wazira bint al-Munadhdha", ur: "وزیرہ بنت المنذہ" }, class: person, note: "الشيخة وزيرة بنت المنذة (ت ٧١٦هـ/١٣١٦م) التي سمع النويري صحيح البخاري في مجالس إسماعها سنة ٧١٥هـ {cite:encyclopaedia-of-islam-2 vol. 8 p. 156}" }
- { id: person/al-watwat, label: { ar: "الوطواط", en: "al-Watwat", ur: "وطواط" }, class: person, note: "جمال الدين محمد بن إبراهيم الوطواط الكتبي (ت ٧١٨هـ/١٣١٨م)، صاحب «مباهج الفكر ومنهج العبر» الذي اقتدى النويري بتقسيم موسوعته على فنونه وأضاف إليه التاريخ فناً خامساً {cite:encyclopaedia-of-islam-2 vol. 8 p. 159}" }
- { id: work/mabahij-al-fikar, label: { ar: "مباهج الفكر ومنهج العبر", en: "Mabahij al-Fikar wa-Manahij al-Ibar — al-Watwat", ur: "مباہج الفکر ومنہج العبر — وطواط" }, class: work, note: "الموسوعة الجغرافية للوطواط (ت ٧١٨هـ) التي ألهمت تقسيم «نهاية الأرب»: فنونها الأربعة موجودة في كتاب النويري الذي أضاف التاريخ فناً خامساً {cite:encyclopaedia-of-islam-2 vol. 8 p. 159}" }
- { id: place/al-qarafa, label: { ar: "القرافة", en: "al-Qarafa", ur: "قرافہ" }, class: place, note: "مقابر القاهرة؛ سار إليها السلطان الناصر بنفسه ليرسم على الأرض خطة تربة الأمير التركماني {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}" }
- { id: place/nuwayra, label: { ar: "نويرة", en: "al-Nuwayra", ur: "نویرہ" }, class: place, note: "بلدة صغيرة بالصعيد المصري — عند الزركلي من قرى بني سويف — إليها نسبة النويري وإن لم تكن له بها صلة مباشرة {cite:encyclopaedia-of-islam-2 vol. 8 p. 156} {cite:al-aalam j. 1 s.v. al-Nuwayri}" }
