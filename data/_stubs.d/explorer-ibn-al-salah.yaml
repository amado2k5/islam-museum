# Stubs for the Ibn al-Salah Explorer story (devin, 2 Nov 2026)
- { id: person/salah-al-din-al-nasri, label: { ar: "صلاح الدين النصري", en: "Salah al-Din al-Nasri", ur: "صلاح الدین نصری" }, class: person, note: "أبو القاسم صلاح الدين والد ابن الصلاح؛ كان شيخ ناحية شهرزور فتفقه عليه ابنه فيها ثم نقله إلى الموصل {cite:tarikh-islam-dhahabi p. 185}" }
- { id: person/al-imad-ibn-yunus, label: { ar: "العماد ابن يونس", en: "al-Imad Ibn Yunus", ur: "عماد ابن یونس" }, class: person, note: "العلامة العماد ابن يونس بالموصل؛ ولي ابن الصلاح الإعادة عنده بعد أن كرر على «المهذب» ولم يطر شاربه {cite:tarikh-islam-dhahabi p. 185}" }
- { id: person/mansur-al-furawi, label: { ar: "منصور الفراوي", en: "Mansur al-Furawi", ur: "منصور فراوی" }, class: person, note: "الحافظ منصور بن عبد المنعم الفراوي؛ من مشايخ ابن الصلاح بنيسابور في رحلته إلى خراسان {cite:tarikh-islam-dhahabi p. 185} {cite:shadharat-dhahab p. 229}" }
- { id: person/zayn-al-umana, label: { ar: "زين الأمناء", en: "Zayn al-Umana'", ur: "زین الامناء" }, class: person, note: "من شيوخ ابن الصلاح في الشام، سمع منه ومن موفق الدين بن قدامة وأخيه فخر الدين لما دخل الشام سنة سبع عشرة أو قبلها {cite:tarikh-islam-dhahabi p. 186}" }
- { id: person/jamal-al-din-ibn-al-harastani, label: { ar: "جمال الدين ابن الحرستاني", en: "Jamal al-Din ibn al-Harastani", ur: "جمال الدین ابن حرستانی" }, class: person, note: "القاضي جمال الدين ابن الحرستاني؛ سمع منه ابن الصلاح بدمشق في وردته الأولى قبل دخوله الشام الكبرى {cite:tarikh-islam-dhahabi p. 186}" }
- { id: place/dubays, label: { ar: "دُبَيْس", en: "Dubays", ur: "دبیس" }, class: place, note: "قرية قرب بغداد على الفرات؛ سمع بها ابن الصلاح من إسماعيل بن إبراهيم الخباز في رحلته المشرقية {cite:tarikh-islam-dhahabi p. 185}" }
