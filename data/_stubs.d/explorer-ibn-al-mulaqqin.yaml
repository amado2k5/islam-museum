# Devin's stub list for the Ibn al-Mulaqqin Explorer story (person/ibn-al-mulaqqin).
- { id: person/nur-al-din-ali-ibn-al-mulaqqin, label: { en: "Nur al-Din 'Ali ibn 'Umar Ibn al-Mulaqqin" }, note: "Father of Siraj al-Din Ibn al-Mulaqqin; Andalusi emigrant who taught Qur'an in the land of the Turks then settled at Cairo; d. ~724 when his son was one {Shadharat 7/44}" }
- { id: person/isa-al-maghribi-al-mulaqqin, label: { en: "Sharaf al-Din 'Isa al-Maghribi, al-Mulaqqin" }, note: "Stepfather and first teacher of Ibn al-Mulaqqin; repetition-teacher of the Qur'an at the Tulunid mosque {Shadharat 7/44}" }
- { id: person/ibn-sayyid-al-nas, label: { en: "Ibn Sayyid al-Nas (Abu l-Fath)" }, note: "Hafiz Fath al-Din Muhammad b. Muhammad Ibn Sayyid al-Nas al-Ya'muri al-Shafi'i, b. Dhu al-Qa'da 671, d. Cairo Sha'ban 734; heard by the young Ibn al-Mulaqqin {Dhayl al-Durar p. 121 n.3}" }
- { id: person/zayn-al-din-al-rahbi, label: { en: "Zayn al-Din al-Rahbi" }, note: "Abu Bakr b. Qasim al-Kinani al-Rahbi, musnid and muhaddith, b. 666, d. Dhu al-Qa'da 749; hadith teacher of Ibn al-Mulaqqin {Dhayl al-Durar p. 122 n.1}" }
- { id: person/mughaltay-ala-al-din, label: { en: "'Ala' al-Din Mughaltay" }, note: "Mughaltay b. Qilij al-Hanafi, Egyptian hafiz (d. 762); hadith teacher of Ibn al-Mulaqqin {Dhayl al-Durar p. 122}" }
- { id: person/baraka-al-jubani, label: { en: "Amir Baraka al-Jubani" }, note: "Zayn al-Din Baraka al-Jubani, great amir under al-Zahir Barquq, amir majlis then ra'is nawba; killed at Alexandria Rajab 782 {Dhayl al-Durar p. 123 n.5; al-Inba' 2/23}" }
- { id: person/nur-al-din-ali-ibn-umar-ibn-al-mulaqqin, label: { en: "Nur al-Din 'Ali ibn 'Umar Ibn al-Mulaqqin (the son)" }, note: "Son of Siraj al-Din Ibn al-Mulaqqin; confined his father at the end of his life {Shadharat 7/45; Dhayl al-Durar no. 237}" }
- { id: person/qutb-al-din-al-halabi, label: { en: "Qutb al-Din al-Halabi" }, note: "Hafiz on whom the young Ibn al-Mulaqqin heard {Shadharat 7/44}" }
- { id: work/tawdih-ibn-al-mulaqqin, label: { en: "al-Tawdih li-Sharh al-Jami' al-Sahih (Sharh al-Bukhari) — Ibn al-Mulaqqin" }, note: "Ibn al-Mulaqqin's commentary on Sahih al-Bukhari in twenty volumes; partly burned in the fire before his death {Dhayl al-Durar p. 122}" }
- { id: work/al-ilam-umdat-al-ahkam, label: { en: "al-I'lam bi-Fawa'id 'Umdat al-Ahkam — Ibn al-Mulaqqin" }, note: "Hadith-fiqh commentary by Ibn al-Mulaqqin" }
- { id: work/ghayat-al-sul, label: { en: "Ghayat al-Sul fi Khasa'is al-Rasul — Ibn al-Mulaqqin" }, note: "Work by Ibn al-Mulaqqin" }
- { id: work/tabaqat-al-awliya-ibn-al-mulaqqin, label: { en: "Tabaqat al-Awliya' — Ibn al-Mulaqqin" }, note: "Work by Ibn al-Mulaqqin" }
- { id: work/al-badr-al-munir, label: { en: "al-Badr al-Munir fi Takhrij Ahadith al-Sharh al-Kabir — Ibn al-Mulaqqin" }, note: "Ibn al-Mulaqqin's takhrij of al-Rafi'i's hadith in seven volumes plus an epitome {Dhayl al-Durar p. 122}" }
