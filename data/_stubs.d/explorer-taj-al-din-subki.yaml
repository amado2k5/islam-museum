- { id: person/taj-al-din-ibn-abi-al-yusr, label: { ar: "تاج الدين عبد الرحيم بن أبي اليسر التنوخي", en: "Taj al-Din Abd al-Rahim ibn Abi al-Yusr al-Tanukhi", ur: "تاج الدین عبد الرحیم بن ابی الیسر تنوخی" }, class: person, note: "المسند المحدث الدمشقي؛ ولد سنة ٦٧٤هـ وتوفي بدمشق في ربيع الآخر ٧٤٩هـ، وأجاز وأَسمع لتاج الدين السبكي لما قدم دمشق مع أبيه سنة ٧٣٩هـ {cite:durar-kamina-jil-1993 2/425}" }
- { id: person/shams-al-din-ibn-al-naqib-al-muqri, label: { ar: "شمس الدين ابن النقيب المقريء", en: "Shams al-Din Ibn al-Naqib al-Muqri'", ur: "شمس الدین ابن نقیب مقری" }, class: person, note: "مقريء دمشق؛ أذن لتاج الدين السبكي بالإفتاء والتدريس قبل أن يكمل العشرين {cite:durar-kamina-jil-1993 2/426-427}" }
- { id: person/baha-al-din-abu-al-baqa-al-subki, label: { ar: "بهاء الدين أبو البقاء محمد السبكي", en: "Baha' al-Din Abu al-Baqa' Muhammad al-Subki", ur: "بہاء الدین ابو البقاء محمد سبکی" }, class: person, note: "ابن تقي الدين السبكي وأخو تاج الدين؛ ولد سنة ٧٠٨هـ، مدرّس وقاضٍ وحاكم بدمشق والقاهرة وخطيب الجامع الأموي، توفي سنة ٧٧٢هـ {cite:encyclopaedia-of-islam-2 vol. 9 p. 745}" }
- { id: person/taqi-al-din-ibn-rafa, label: { ar: "تقي الدين ابن رافع", en: "Taqi al-Din Ibn Raf'a", ur: "تقی الدین ابن رافع" }, class: person, note: "محدث شافعي؛ تخرج به تاج الدين السبكي في الحديث بدمشق {cite:durar-kamina-jil-1993 2/425}" }
