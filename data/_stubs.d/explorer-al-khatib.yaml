# Devin's stub list for the al-Khatib al-Baghdadi Explorer story (person/al-khatib-al-baghdadi-ahmad).
- { id: person/abu-al-hasan-al-khatib, label: { en: "Abu al-Hasan 'Ali ibn Thabit, al-Khatib of Darzijan" }, note: "Father of al-Khatib al-Baghdadi; heard al-Kattani and served as preacher (khatib) of Darzijan, a village on the Tigris west of Baghdad {Tarikh al-Islam s.a. 463 p. 86}" }
- { id: person/al-qudai-muhammad-ibn-ahmad, label: { en: "Abu 'Abd Allah al-Quda'i" }, note: "Meccan traditionist whom al-Khatib met at Mecca on his hajj journey {Tarikh al-Islam s.a. 463 p. 92}" }
- { id: person/al-husayn-ibn-bishr-al-tarabulusi, label: { en: "al-Qadi al-Husayn ibn Bishr al-Tarabulusi" }, note: "Preacher of Tripoli and holder of its Dar al-'Ilm; held a disputation in khitaba with al-Khatib, recorded by al-Karajaki in his rihla (d. 449) {Tarikh al-Islam s.a. 463 p. 93 n.; Lisan al-Mizan 2/275}" }
- { id: person/ibn-khayrun-abu-al-fadl, label: { en: "Abu al-Fadl ibn Khayrun" }, note: "Baghdadi traditionist, al-Khatib's executor: al-Khatib willed his estate to him, made his books a waqf in his hands and had him distribute his money to the hadith folk {Tarikh al-Islam s.a. 463 p. 107}" }
- { id: person/ibn-al-muhtadi-billah-al-qadi, label: { en: "al-Qadi Abu al-Husayn ibn al-Muhtadi bi-llah" }, note: "Qadi, son of the caliph al-Muhtadi; led the funeral prayer over al-Khatib, takbir four times {Tarikh al-Islam s.a. 463 p. 107}" }
- { id: person/abu-bakr-ibn-zahra-al-sufi, label: { en: "Abu Bakr ibn Zahra' al-Sufi (al-Taraythithi)" }, note: "Sufi of Baghdad who had dug himself a grave beside Bishr al-Hafi's and read the whole Qur'an there weekly; he yielded the grave for al-Khatib's burial {Tarikh al-Islam s.a. 463 pp. 107-108}" }
- { id: work/tarikh-baghdad, label: { en: "Tarikh Baghdad (History of Baghdad) — al-Khatib al-Baghdadi" }, note: "Al-Khatib's great biographical history of Baghdad; the Baghdadis heard it read to him at the Nizamiyya after his return in 462 {Tarikh al-Islam s.a. 463 p. 107 n.2}" }
- { id: work/al-rihla-fi-talab-al-hadith, label: { en: "al-Rihla fi Talab al-Hadith — al-Khatib al-Baghdadi" }, note: "Al-Khatib's treatise on travelling in quest of hadith {Tarikh al-Islam s.a. 463 p. 98 n.}" }
- { id: work/taqyid-al-ilm, label: { en: "Taqyid al-'Ilm — al-Khatib al-Baghdadi" }, note: "Al-Khatib's three-part book on the writing down of knowledge {Tarikh al-Islam s.a. 463 p. 98}" }
- { id: place/darzijan, label: { en: "Darzijan" }, note: "A large village below Baghdad on the west bank of the Tigris; counted among the seven towns of the Chosroes {Mu'jam al-Buldan 2/450, cited in Tarikh al-Islam s.a. 463 p. 86 n.1}" }
