- { id: person/abd-allah-ibn-muhammad-ibn-abd-al-barr, label: { ar: "عبد الله بن محمد بن عبد البر", en: "'Abd Allah ibn Muhammad ibn 'Abd al-Barr", ur: "عبد اللہ بن محمد بن عبد البر" }, class: person, note: "أبو محمد والد الحافظ ابن عبد البر؛ مولده سنة ثلاثين وثلاثمائة وتوفي في ربيع الآخر سنة ثمانين وثلاثمائة {cite:wafayat-ayan p. 71}" }
- { id: person/abu-al-walid-ibn-al-faradi, label: { ar: "أبو الوليد ابن الفرضي", en: "Abu al-Walid ibn al-Faradi", ur: "ابوالولید ابن فرضی" }, class: person, note: "أبو الوليد عبد الله بن محمد بن الفرضي القرطبي، من شيوخ ابن عبد البر أخذ عنه كثيراً من علم الحديث {cite:tarikh-islam-dhahabi p. 137,141}" }
- { id: work/al-istidkar, label: { ar: "الاستذكار", en: "al-Istidhkar", ur: "الاستذکار" }, class: work, note: "اختصار ابن عبد البر لكتابه التمهيد في شرح مذاهب علماء الأمصار فيما تضمنه موطأ مالك من معاني الرأي والآثار {cite:tarikh-islam-dhahabi p. 138} {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}" }
- { id: work/jami-bayan-al-ilm, label: { ar: "جامع بيان العلم وفضله", en: "Jami' Bayan al-'Ilm", ur: "جامع بیان العلم" }, class: work, note: "جامع بيان العلم وفضله وما ينبغي في روايته وحمله لابن عبد البر {cite:tarikh-islam-dhahabi p. 139} {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}" }
- { id: work/bahjat-al-majalis, label: { ar: "بهجة المجالس وأنس المجالس", en: "Bahjat al-Majalis", ur: "بہجۃ المجالس" }, class: work, note: "كتاب أدب لابن عبد البر نظمه للمظفر بن الأفطس واختصره ابن ليون {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}؛ في ثلاثة أسفار {cite:wafayat-ayan p. 67}" }
