id: sport/musaraa
class: sport
kind: combat
label:
  ar: المصارعة
  en: Wrestling (musara'a)
  ur: کشتی
  es: "Lucha libre (musara'a)"
  fr: "Lutte (musara'a)"
  tr: "Güreş"
  id: "Gulat"
summary:
  ar: 'روى ابن إسحاق أن النبي دعا ركانة بن عبد يزيد المطلبي، وكان من أصرك قريش، فقال له: «أرأيت إن صرعتك أتعلم أن ذلك حق؟»
    فصرعه مرتين {cite:sira-ibn-ishaq-zakkar p. 276}. والمصارعة من المسابقات الجائزة بلا جعل عند الفقهاء، وقد عدّها ابن سينا
    في القانون من الرياضات القوية {cite:canon-ibn-sina-print-v1 p. 222}.'
  en: Ibn Ishaq narrates that the Prophet called Rukana ibn Abd Yazid al-Muttalibi, among the strongest of Quraysh, and asked
    «If I throw you, will you know that it is true?» — and threw him twice {cite:sira-ibn-ishaq-zakkar p. 276}. Wrestling
    is a contest lawful without a prize in fiqh, and Ibn Sina counts it among the strong exercises of the Canon {cite:canon-ibn-sina-print-v1
    p. 222}.
  ur: ابن اسحاق روایت کرتے ہیں کہ نبی نے رکانہ بن عبد یزید مطلبی کو، جو قریش کے زور آوروں میں سے تھا، فرمایا «اگر میں تمہیں
    پچھاڑ دوں تو کیا تم جان لو گے؟» اور انہیں دو مرتبہ پچھاڑا {cite:sira-ibn-ishaq-zakkar p. 276}۔ کشتی فقہ میں بغیر انعام
    کے جائز مقابلوں میں ہے، اور ابن سینا نے قانون میں اسے قوی ورزشوں میں شمار کیا {cite:canon-ibn-sina-print-v1 p. 222}۔
  es: "Ibn Ishaq narra que el Profeta llamó a Rukana ibn Abd Yazid al-Muttalibi, uno de los más fuertes de los Quraysh, y le preguntó: «Si te derribo, ¿sabrás que es verdad?», y lo derribó dos veces {cite:sira-ibn-ishaq-zakkar p. 276}. La lucha libre es una competición lícita sin premio en el fiqh, e Ibn Sina la considera uno de los ejercicios fuertes del Canon {cite:canon-ibn-sina-print-v1 p. 222}."
  fr: "Ibn Ishaq rapporte que le Prophète appela Rukana ibn Abd Yazid al-Muttalibi, l'un des plus forts Quraysh, et lui demanda: « Si je te projette au sol, sauras-tu que c'est vrai ? » – et il le projeta à deux reprises {cite: Sira Ibn Ishaq, Zakkar, p. 276}. La lutte est une discipline licite sans prix en droit islamique (fiqh), et Ibn Sina la compte parmi les exercices les plus importants du Canon {cite: Canon Ibn Sina, vol. 1, p. 222}."
  tr: "İbn İshaq, Peygamber'in Qureyşli zulmkarlardan biri olan Rukanah ibn Abd Yazid al-Muttalibi'yi çağırdığını ve ona şöyle dediğini anlattı: \"Seni vurursam, bunun doğru olduğunu biliyor musun?\" Onu iki kez vurdu {cite:sira-ibn-ishaq-zakkar s. 276}. Güreş, hukukçulara göre izin verilen bir yarışmadır ve İbn Sina bunu kanonda güçlü bir spor olarak görmüştür {cite:canon-ibn-sina-print-v1 s. 222}."
  id: "Ibn Ishaq menceritakan bahwa Nabi memanggil Rukanah ibn Abd Yazid al-Muttalibi, salah satu penganiaya Quraisy, sehingga ia berkata kepadanya: \"Apakah kau pikir jika aku memukulmu, apakah kau tahu bahwa itu benar?\" Ia memukulnya dua kali {cite:sira-ibn-ishaq-zakkar hlm. 276}. Gulat adalah kompetisi yang diperbolehkan menurut para ahli hukum, dan Ibn Sina menganggapnya sebagai olahraga yang kuat dalam kanon {cite:canon-ibn-sina-print-v1 hlm. 222}."
