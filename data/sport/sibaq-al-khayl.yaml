id: sport/sibaq-al-khayl
class: sport
kind: racing
label:
  ar: سباق الخيل
  en: Horse racing
  ur: گھڑ دوڑ
  es: "carreras de caballos"
  fr: "Course de chevaux"
  tr: "At yarışı"
  id: "Pacuan kuda"
summary:
  ar: سابق النبي بين الخيل من الحفياء إلى ثنية الوداع في المضمرة، ومن الثنية إلى مسجد بني زريق في غير المضمرة، وكان ابن عمر
    فيمن سبق {cite:sahih-al-bukhari}. والجعل في سباق الخيل جائز عند الجمهور لحديث «لا سبق إلا في خف أو حافر أو نصل»، وهو أصل
    باب المحلل والمزمل في كتب الفقه {cite:usul-iqtisad-islami-0660 p. 229}.
  en: The Prophet held horse races from al-Hafya' to Thaniyyat al-Wada' for the trained horses, and from al-Thaniyya to the
    mosque of Banu Zurayq for the untrained, and Ibn Umar was among the winners {cite:sahih-al-bukhari}. A prize on a horse
    race is lawful for the majority on the report «no prize except in khuff, hafir or nasl» — the root of the muhallil and
    muzammal chapters of fiqh {cite:usul-iqtisad-islami-0660 p. 229}.
  ur: نبی نے مضمر گھوڑوں کی دوڑ حفیاء سے ثنیہ الوداع تک اور غیر مضمر کی ثنیہ سے مسجد بنو زریق تک کرائی، جن میں ابن عمر جیتنے
    والوں میں تھے {cite:sahih-al-bukhari}۔ گھڑ دوڑ پر انعام اکثر کے نزدیک جائز ہے حدیث «لا سبق إلا في خف أو حافر أو نصل» کی
    بنا پر — فقہ کے محلل اور مزمل ابواب کی جڑ {cite:usul-iqtisad-islami-0660 p. 229}۔
  es: "El Profeta organizó carreras de caballos desde al-Hafya' hasta Thaniyyat al-Wada' para los caballos entrenados, y desde al-Thaniyya hasta la mezquita de Banu Zurayq para los no entrenados, y Ibn Umar estuvo entre los ganadores {cite:sahih-al-bukhari}. Un premio en una carrera de caballos es lícito para la mayoría según el relato «no hay premio excepto en khuff, hafir o nasl» — la raíz de los capítulos muhallil y muzammal del fiqh {cite:usul-iqtisad-islami-0660 p. 229}."
  fr: "Le Prophète organisa des courses de chevaux entre al-Hafya' et Thaniyyat al-Wada' pour les chevaux entraînés, et entre al-Thaniyya et la mosquée des Banu Zurayq pour les chevaux non entraînés. Ibn Umar figura parmi les vainqueurs (Sahih al-Bukhari). La majorité des fidèles s'accordent sur le principe « nul prix n'est accordé, sauf en cas de khuff, hafir ou nasl », fondement des chapitres muhallil et muzammal du fiqh (Usul Iqtisad Islami, 660, p. 229)."
  tr: "Peygamber, at yarışlarını Haziye'den Thaniyat al-Wada'a'ya mudrada, Thaniyya'dan mudramra dışındaki Banu Zurayq camisine kadar sürdürdü. İbn Ömer {atı:sahih-al-bukhari} öncesinde bulunanlar arasındaydı. At yarışının çoğunluk arasında izin verilmesi şu hadisten kaynaklanır: \"Yarış sandalet, toynak veya jilet dışında yoktur,\" bu hadis, fıkıh kitaplarındaki muhallel ve el-muzmil bölümüne dayanmaktadır {cite:usul-iqtisad-islami-0660 s. 229}."
  id: "Nabi berkuda dari Al-Hafiya ke Thaniyat al-Wada'a di mudrah, dan dari Thaniyya ke masjid Banu Zurayq di luar mudramrah. Ibn Umar termasuk di antara yang mendahului {cite:sahih-al-bukhari}. Pemberitahuan perbolehan pacuan kuda di kalangan mayoritas adalah karena hadits: \"Tidak ada balapan kecuali di sandal, kuku, atau pisau cukur,\" yang menjadi dasar bab tentang muhallal dan al-muzmil dalam buku fiksi {cite:usul-iqtisad-islami-0660 hlm. 229}."
