id: sport/ishalat-al-hajar
class: sport
kind: strength
label:
  ar: إشالة الحجر
  en: Stone-lifting (ishala)
  ur: پتھر اٹھانا
  es: "Levantamiento de piedras (ishala)"
  fr: "Soulever des pierres (ishala)"
summary:
  ar: إشالة الحجر رفع حجر ثقيل ووضعه، وقد سماها ابن سينا في القانون من الرياضات القوية الميدانية {cite:canon-ibn-sina-print-v1
    p. 222}. وكانت أحجار الإشالة في الميادين يتبارى فيها الشبان على القوة، ومنها أحجار حفظت نقشاً في متاحف العالم الإسلامي.
  en: Ishala is the lifting and setting of a heavy stone, named by Ibn Sina among the strong field exercises of the Canon
    {cite:canon-ibn-sina-print-v1 p. 222}. Lifting-stones stood in the maydans where young men contested in strength; inscribed
    examples survive in the museums of the Islamic world.
  ur: إشالة پتھر بھاری پتھر اٹھا کر رکھنا ہے، جسے ابن سینا نے قانون میں قوی میدانی ورزشوں میں شمار کیا {cite:canon-ibn-sina-print-v1
    p. 222}۔ میدانوں میں نوجوان اس پر قوت کا مقابلہ کرتے تھے، اور کندہ شدہ نمونے اسلامی عالم کے عجائب گھروں میں محفوظ ہیں۔
  es: "Ishala es el levantamiento y la colocación de una piedra pesada, mencionado por Ibn Sina entre los ejercicios de campo más exigentes del Canon {cite:canon-ibn-sina-print-v1 p. 222}. En los maydans, donde los jóvenes competían en fuerza, se colocaban piedras de levantamiento; aún se conservan ejemplos con inscripciones en los museos del mundo islámico."
  fr: "L'ishala consiste à soulever et à reposer une lourde pierre; Ibn Sina la mentionne parmi les exercices physiques rigoureux du Canon {cite:canon-ibn-sina-print-v1 p. 222}. Des pierres à soulever étaient dressées dans les maydans où les jeunes hommes s'affrontaient en force; des exemples inscrits subsistent dans les musées du monde islamique."
