id: sport/sibaq-alibil
class: sport
kind: racing
label:
  ar: سباق الإبل
  en: Camel racing
  ur: اونٹ دوڑ
  es: "carreras de camellos"
  fr: "courses de chameaux"
  tr: "Deve Yarışı"
  id: "Balap Unta"
summary:
  ar: السبق في الحافر من المسابقات الجائزة بالجعل، والحافر حافر البعير عند الفقهاء {cite:usul-iqtisad-islami-0660 p. 229}.
    وكانت العرب تسابق بهجنها في مواسمها وأسواقها، ومنهم أصحاب المزامل الذين يدخلون البعير في السبق بلا جعل من أهله، وقد بقي
    سباق الهجن مهرجاناً قائماً في بلاد الخليج إلى اليوم.
  en: The wager on the hoof is one of the contests lawful for a prize, and the hafir of the jurists is the camel's hoof {cite:usul-iqtisad-islami-0660
    p. 229}. The Arabs raced their camels in the seasons and fairs, among them the men of the mazamil who enter a camel in
    a race without a prize from its owners; camel racing remains a standing festival in the Gulf lands today.
  ur: حافر پر داؤ ان جائز مقابلوں میں ہے جن پر انعام ہو سکتا ہے، اور فقہا کے نزدیک حافر اونٹ کا کھُر ہے {cite:usul-iqtisad-islami-0660
    p. 229}۔ عرب اپنے اونٹوں کی دوڑ موسموں اور بازاروں میں کرتے تھے، اور آج بھی اونٹ دوڑ خلیجی ممالک کا قائم میلہ ہے۔
  es: "La apuesta sobre la pezuña es una de las competiciones lícitas por un premio, y el hafir de los juristas es la pezuña del camello {cite:usul-iqtisad-islami-0660 p. 229}. Los árabes hacían correr a sus camellos en las estaciones y ferias, entre ellos los hombres del mazamil que inscribían un camello en una carrera sin premio de sus dueños; las carreras de camellos siguen siendo una fiesta permanente en las tierras del Golfo hoy en día."
  fr: "Le pari sur le sabot est l'un des concours licites donnant lieu à un prix, et le sabot du chameau est le point de référence des juristes (voir: usul-iqtisad-islami-0660 p. 229). Les Arabes organisaient des courses de chameaux lors des saisons et des foires, notamment les hommes du mazamil qui engageaient un chameau dans une course sans récompense de la part de ses propriétaires; les courses de chameaux demeurent une tradition vivante dans les pays du Golfe."
  tr: "Toynak önde gitmek, yapılması izin verilen yarışmalar arasındadır ve hukukçulara göre toynak devenin toynağı olarak kabul edilir {cite:usul-iqtisad-islami-0660, s. 229}. Araplar, develerini mevsimlerinde ve pazarlarında yarıştırırlardı; Muzamil sahipleri deveyi sahiplerinden almadan yönlendirirdi. Deve yarışı, Körfez ülkelerinde günümüzde de düzenlenen bir festival olarak devam etmektedir."
  id: "Memimpin kuku adalah salah satu kompetisi yang diperbolehkan dengan membuatnya, dan kuku dianggap sebagai kuku unta menurut para ahli hukum {cite:usul-iqtisad-islami-0660, hlm. 229}. Orang Arab biasa berpacu unta mereka di musim dan pasar mereka, termasuk pemilik Muzamil yang memimpin unta tanpa harus memimpin dari pemiliknya. Balap unta tetap menjadi festival yang diadakan di negara-negara Teluk hingga hari ini."
