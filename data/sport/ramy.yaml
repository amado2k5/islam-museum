label:
  ar: الرماية
  en: Archery (ramy)
  ur: تیراندازی
  es: "Tiro con arco (ramy)"
  fr: "Tir à l'arc (ramy)"
  tr: "Atış"
  id: "Atış"
summary:
  ar: في الحديث «ارموا بني إسماعيل فإن أباكم كان رامياً»، وقال النبي لسعد بن أبي وقاص يوم أحد «ارم فداك أبي وأمي» {cite:jami-al-tirmidhi}.
    والرماية من المسابقات التي يجوز فيها الجعل، لحديث «لا سبق إلا في نصل أو خف أو حافر» {cite:usul-iqtisad-islami-0660 p.
    229}. وبقيت للرماة ميادينهم في العواصم المملوكية والعثمانية، ومنها ساحة الفروسية في القاهرة ومواضع الرمي في استانبول.
  en: 'The hadith has it: «Shoot, sons of Isma''il, for your father was an archer», and the Prophet told Sa''d ibn Abi Waqqas
    on the day of Uhud «Shoot; may my father and mother be your ransom» {cite:jami-al-tirmidhi}. Archery is one of the contests
    in which a prize is lawful, on the report «there is no prize except in nasl, khuff or hafir» {cite:usul-iqtisad-islami-0660
    p. 229}. Archers kept their grounds in the Mamluk and Ottoman capitals, from the furusiyya ground of Cairo to the ok-meydan
    grounds of Istanbul.'
  ur: 'حدیث میں ہے: «ارموا بني إسماعيل فإن أباكم كان رامياً»، اور نبی نے احد کے دن سعد بن ابی وقاص سے فرمایا «ارم فداك أبي
    وأمي» {cite:jami-al-tirmidhi}۔ تیراندازی ان مقابلوں میں سے ہے جن پر انعام جائز ہے، حدیث «لا سبق إلا في نصل أو خف أو حافر»
    کے مطابق {cite:usul-iqtisad-islami-0660 p. 229}۔ مملوک اور عثمانی دارالحکومتوں میں تیراندازوں کے اپنے میدان رہے۔'
  es: "El hadiz dice: «Disparad, hijos de Isma'il, pues vuestro padre era arquero», y el Profeta le dijo a Sa'd ibn Abi Waqqas el día de Uhud «Disparad; que mi padre y mi madre sean vuestro rescate» {cite:jami-al-tirmidhi}. El tiro con arco es una de las competiciones en las que es lícito un premio, según el relato «no hay premio excepto en nasl, khuff o hafir» {cite:usul-iqtisad-islami-0660 p. 229}. Los arqueros mantenían sus campos de tiro en las capitales mamelucas y otomanas, desde el campo de furusiyya de El Cairo hasta el campo de ok-meydan de Estambul."
  fr: "Le hadith rapporte: « Tirez, fils d'Ismaïl, car votre père était archer. » Le Prophète dit à Sa'd ibn Abi Waqqas le jour d'Uhud: « Tire ! Que mon père et ma mère te servent de rançon. » (Jami' al-Tirmidhi). Le tir à l'arc est l'une des disciplines où une récompense est licite, selon le hadith: « Il n'y a de récompense que dans le nasl, le khuff ou le hafir. » (Usul Iqtisad Islami, 660, p. 229). Les archers disposaient de leurs stands de tir dans les capitales mameloukes et ottomanes, du furousiyya du Caire à l'ok-meydan d'Istanbul."
