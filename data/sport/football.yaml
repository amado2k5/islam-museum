summary:
  ar: أوسع الرياضات اتباعاً في بلاد المسلمين اليوم، تُلعب في كل قطر من المحيط إلى المحيط، ومن أعلامها في المتحف لاعبون كمحمد
    صلاح ونجوم المنتخبات والدوريات. وتقام فيها كأس العالم وما دونها، وقد نالت دول مسلمة استضافتها ومنافستها في عصرنا {cite:wikipedia-2034-fifa-world-cup-en}.
  en: The most followed sport in the Muslim lands today, played in every country from ocean to ocean; its players on record
    in the museum include Mohamed Salah and the stars of the national teams and leagues. It has its World Cup and all beneath
    it, and Muslim-majority countries have hosted and contested it in our time {cite:wikipedia-2034-fifa-world-cup-en}.
  ur: آج مسلم ممالک میں سب سے زیادہ پیروکاروں والا کھیل، ہر ملک میں کھیلا جاتا ہے؛ عجائب گھر کے ریکارڈ میں محمد صلاح اور قومی
    ٹیموں و لیگوں کے ستارے شامل ہیں۔ اس کے عالمی کپ میں مسلم اکثریتی ممالک نے میزبانی اور مقابلہ کیا {cite:wikipedia-2034-fifa-world-cup-en}۔
  es: "El deporte más popular en los países musulmanes hoy en día, practicado en todos los países de costa a costa; entre sus jugadores representados en el museo se encuentran Mohamed Salah y las estrellas de las selecciones y ligas nacionales. Cuenta con su Copa Mundial y todo lo que conlleva, y países de mayoría musulmana la han organizado y disputado en nuestra época {cite:wikipedia-2034-fifa-world-cup-en}."
  fr: "Le football est aujourd'hui le sport le plus populaire dans les pays musulmans, pratiqué dans tous les pays d'un océan à l'autre. Parmi ses joueurs emblématiques figurent Mohamed Salah et les stars des équipes nationales et des championnats. Il possède sa Coupe du monde et tout ce qu'elle implique, et des pays à majorité musulmane l'ont organisée et disputée de notre époque."
  tr: "Bugün Müslüman ülkelerde en çok takip edilen sporlar, okyanustan okyanusa her bölgede oynanmakta olup, müzede Mohamed Salah gibi oyuncular ve milli takımlar ile lig yıldızları yer almaktadır. Dünya Kupası ve altı burada düzenlenmekte olup, Müslüman ülkeler bu spora ev sahipliği yapmış ve yarışmıştır {cite:wikipedia-2034-fifa-world-cup-en}."
  id: "Olahraga yang paling banyak diikuti di negara-negara Muslim saat ini, dimainkan di setiap wilayah dari lautan hingga lautan, dan di antara tokoh-tokoh terkenal di museum ini adalah pemain seperti Mohamed Salah serta bintang tim nasional dan liga. Piala Dunia dan di bawahnya diadakan di sana, dan negara-negara Muslim telah menjadi tuan rumah dan bersaing dengannya di era kita {cite:wikipedia-2034-fifa-world-cup-en}."
