  ar: النرد
  en: Backgammon (nard)
  ur: نرد
  es: "Backgammon (nardo)"
  fr: "Backgammon (nard)"
summary:
  ar: النرد لعبة الطاولة المعروفة، وقد دخلت من فارس، واتفق الفقهاء على المنع منها بالجعل، واختلفوا في لعبها بلا جعل — والخلاف
    مسطور عندهم من زمن الصحابة والتابعين، لا حكم للمتحف فيه {cite:usul-iqtisad-islami-0660 p. 229}.
  en: Nard is the known board game; it came in from Persia, and the jurists agree on forbidding it for stakes while disagreeing
    on playing it without stakes — the disagreement is on record among them from the time of the Companions and Tabi'in, and
    the museum gives no verdict {cite:usul-iqtisad-islami-0660 p. 229}.
  ur: نرد معروف تختہ نرد کا کھیل ہے، جو فارس سے آیا؛ فقہا اس پر داؤ لگانے کی ممانعت پر متفق ہیں اور بغیر داؤ کے کھیلنے میں
    اختلاف رکھتے ہیں — صحابہ و تابعین کے زمانے سے درج اختلاف، عجائب گھر کا کوئی فیصلہ نہیں {cite:usul-iqtisad-islami-0660
    p. 229}۔
  es: "Nard es el juego de mesa conocido; llegó de Persia, y los juristas están de acuerdo en prohibirlo con apuestas, pero discrepan sobre jugarlo sin ellas; la discrepancia está documentada entre ellos desde la época de los Compañeros y los Tabi'in, y el museo no emite ningún veredicto {cite:usul-iqtisad-islami-0660 p. 229}."
  fr: "Nard est le jeu de plateau connu; il est venu de Perse, et les juristes s'accordent à l'interdire pour les mises tout en désaccord sur le fait d'y jouer sans mises — le désaccord est consigné parmi eux depuis l'époque des Compagnons et des Tabi'in, et le musée ne donne aucun verdict {cite:usul-iqtisad-islami-0660 p. 229}."
