id: sport/mubaraza
class: sport
kind: combat
label:
  ar: المبارزة
  en: Single combat and fencing
  ur: مبارزہ بازی
  es: "Combate individual y esgrima"
  fr: "Combat singulier et escrime"
summary:
  ar: المبارزة خروج البطل إلى البطل في القتال، ومنها مبارزة علي بن أبي طالب لعمرو بن عبد ود يوم الخندق، قتلها وعاد {cite:mubarakpuri-raheeq}.
    ثم صارت المبارزة رياضة ميدان في كتب الفروسية تعلم الضرب بالسيف والتروس والرماح، ومنها ما كان في ساحات الميادين المملوكية.
  en: The mubaraza is champion meeting champion in combat, like Ali ibn Abi Talib's bout with Amr ibn Abd Wudd on the day
    of the Trench, which he won {cite:mubarakpuri-raheeq}. It then became a field sport in the furusiyya books — sword, shield
    and lance — played out in the grounds of the Mamluk maydans.
  ur: مبارزہ لڑائی میں بہادر کا بہادر سے آمنے سامنے آنا ہے، جیسے خندق کے دن علی بن ابی طالب کا عمرو بن عبدود کے ساتھ مقابلہ،
    جس میں علی غالب آئے {cite:mubarakpuri-raheeq}۔ پھر یہ فروسیت کی کتابوں میں تلوار، ڈھال اور نیزے کی میدانی مشق بنا جو مملوک
    میدانوں میں کھیلی جاتی تھی۔
  es: "El mubaraza es el enfrentamiento entre campeones en combate, como el duelo de Ali ibn Abi Talib con Amr ibn Abd Wudd el día de la Trinchera, que ganó {cite:mubarakpuri-raheeq}. Posteriormente, se convirtió en un deporte de campo en los libros furusiyya —espada, escudo y lanza— que se practicaba en los terrenos de los maydans mamelucos."
  fr: "Le mubaraza est un combat entre champions, comme celui d'Ali ibn Abi Talib contre Amr ibn Abd Wudd le jour de la bataille du Fossé, qu'il remporta {cite:mubarakpuri-raheeq}. Il devint ensuite un sport de combat décrit dans les ouvrages de furusiyya — épée, bouclier et lance — pratiqué sur les terrains des maydans mamelouks."
