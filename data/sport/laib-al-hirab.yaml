id: sport/laib-al-hirab
class: sport
kind: combat
label:
  ar: اللعب بالحراب
  en: Spear-play
  ur: نیزہ بازی
  es: "Juego de lanza"
  fr: "Jeu de lance"
  tr: "Cirit Oynama"
  id: "Bermain lembing"
summary:
  ar: في الصحيحين أن الحبشة كانوا يلعبون بحرابهم في مسجد النبي يوم العيد، وأن عائشة كانت تدخل فتقوم خلف النبي تنظر إليهم حتى
    تمل {cite:sahih-al-bukhari}. وكان ذلك اللعب من نوع الرياضة التي تصلح للقتال، وقد أذن النبي به في المسجد ولم يعدّه من اللهو
    المذموم.
  en: In the two Sahihs, the Abyssinians played with their spears in the Prophet's mosque on the day of Eid, and Aisha would
    slip in behind the Prophet and watch them until she tired {cite:sahih-al-bukhari}. That play was sport of a kind that
    serves battle, and the Prophet allowed it in the mosque rather than counting it among blameworthy diversions.
  ur: صحیحین میں ہے کہ عید کے دن حبشی نبی کی مسجد میں نیزوں سے کھیلتے تھے، اور عائشہ نبی کے پیچھے کھڑی ہو کر انہیں دیکھتی
    رہتیں یہاں تک کہ تھک جاتیں {cite:sahih-al-bukhari}۔ یہ کھیل ایسی تفریح تھی جو قتال کے کام آتی ہے، اور نبی نے اسے مسجد
    میں اجازت دی اور مذموم نہ ٹھہرایا۔
  es: "En los dos Sahihs, los abisinios jugaban con sus lanzas en la mezquita del Profeta el día del Eid, y Aisha se escabullía detrás del Profeta y los observaba hasta cansarse {cita:sahih-al-bukhari}. Ese juego era un tipo de deporte que sirve para la batalla, y el Profeta lo permitió en la mezquita en lugar de considerarlo una distracción censurable."
  fr: "Dans les deux recueils de hadiths authentiques (Sahih), il est rapporté que les Abyssins jouaient avec leurs lances dans la mosquée du Prophète le jour de l'Aïd, et qu'Aïcha se glissait derrière lui pour les observer jusqu'à ce qu'elle soit fatiguée (source: Sahih al-Bukhari). Ce jeu était un divertissement utile au combat, et le Prophète l'autorisait dans la mosquée au lieu de le considérer comme une distraction répréhensible."
  tr: "İki Sahih'te, Habeşlilerin Bayram günü Peygamber'in Camii'nde mızraklarıyla oynadıkları ve Aişe'nin içeri girip Peygamber'in arkasında durup onları yorulana kadar izlediği belirtilir. Bu oyun dövüşe uygun bir spordu ve Peygamber camide buna izin verdi, suçlu bir eğlence olarak görmedi."
  id: "Dalam dua Sahih, disebutkan bahwa orang Abyssinia biasa bermain dengan tombak mereka di Masjid Nabi pada hari Idul Fitri, dan Aisha akan masuk dan berdiri di belakang Nabi menatap mereka sampai mereka kelelahan. Drama ini adalah jenis olahraga yang cocok untuk bertarung, dan Nabi mengizinkannya di masjid serta tidak menganggapnya sebagai hiburan yang patut disalahkan."
