kind: ball-game
label:
  ar: اللعب بالكرة
  en: Ball games
  ur: گیند کا کھیل
  es: "Juegos de pelota"
  fr: "Jeux de balle"
summary:
  ar: اللعب بالكرة في القانون من الرياضات القوية الميدانية عند ابن سينا {cite:canon-ibn-sina-print-v1 p. 222}. وكانت لأهل
    الحواضر ألعاب الكرة المعروفة في ميادينهم وأزقتهم، ومنها ما عُدّ من اللهو المباح ومنها ما نهى عنه الفقهاء إذا شابه القمار
    أو أضاع الواجب.
  en: Ball play stands in the Canon among the strong field exercises of Ibn Sina {cite:canon-ibn-sina-print-v1 p. 222}. The
    townspeople had their known ball games in the maydans and lanes; the jurists counted some as lawful diversion and warned
    of what resembles gambling or wastes an obligation.
  ur: گیند کا کھیل قانون میں ابن سینا کی قوی میدانی ورزشوں میں ہے {cite:canon-ibn-sina-print-v1 p. 222}۔ شہروں کے لوگوں کے
    میدانوں اور گلیوں میں گیند کے معروف کھیل رہے؛ فقہا نے بعض کو جائز تفریح شمار کیا اور جو جوئے جیسا ہو یا فرض ضائع کرے اس
    سے روکا۔
  es: "El juego de pelota figura en el Canon entre los ejercicios de campo más importantes de Ibn Sina {cite:canon-ibn-sina-print-v1 p. 222}. Los habitantes de las ciudades practicaban sus juegos de pelota habituales en los maydans y callejones; los juristas consideraban algunos como diversión lícita y advertían sobre lo que se asemejaba a un juego de azar o a un derroche de dinero."
  fr: "Le jeu de balle figure dans le Canon parmi les exercices de plein air importants d'Ibn Sina {cite:canon-ibn-sina-print-v1 p. 222}. Les habitants de la ville pratiquaient leurs jeux de balle habituels dans les maydans et les ruelles; les juristes considéraient certains comme un divertissement licite et mettaient en garde contre ce qui s'apparentait à des jeux de hasard ou constituait un gaspillage d'obligation."
