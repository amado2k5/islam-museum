label:
  ar: السباحة
  en: Swimming (sibaha)
  ur: تیراکی
  es: "Natación (sibaha)"
  fr: "Natation (sibaha)"
  tr: "Yüzme"
  id: "Renang"
summary:
  ar: روي عن النبي أنه قال «علموا أولادكم الصلاة والسباحة والرماية» في رواية مرسلة نقلها الفقهاء في آداب تربية الصبيان، وذكرها
    جلال الدين السيوطي في الجامع الصغير مع كلام على درجتها {cite:sahih-jami-saghir-maktab-islami-1988}. والعوم من تمام القوة
    البدنية التي يذكرها العلماء في حق المسلم، وقد كانت سباحة أهل الحجاز في الماء شأناً معروفاً في كتب الأخبار.
  en: It is narrated from the Prophet, in a mursal report carried by the jurists in the chapters on raising children, that
    he said «Teach your children prayer, swimming and archery»; al-Suyuti lists it in al-Jami' al-Saghir with discussion of
    its grade {cite:sahih-jami-saghir-maktab-islami-1988}. Swimming is part of the bodily strength the scholars name for the
    Muslim, and the swimming of the Hijazis appears in the books of reports.
  ur: نبی سے مرسل روایت میں منقول ہے کہ فرمایا «علموا أولادكم الصلاة والسباحة والرماية» — بچوں کی تربیت کے ابواب میں فقہا
    نے نقل کیا اور سیوطی نے جامع الصغیر میں اس کے درجے پر بحث کی {cite:sahih-jami-saghir-maktab-islami-1988}۔ تیراکی اس جسمانی
    قوت کا حصہ ہے جسے علماء مسلمان کے لیے بیان کرتے ہیں۔
  es: "Se narra del Profeta, en un informe mursal recogido por los juristas en los capítulos sobre la crianza de los hijos, que dijo: «Enseñad a vuestros hijos a rezar, a nadar y a practicar el tiro con arco». Al-Suyuti lo incluye en Al-Jami' al-Saghir con una discusión sobre su grado {cite:sahih-jami-saghir-maktab-islami-1988}. La natación forma parte de la fortaleza física que los eruditos atribuyen al musulmán, y la práctica de la natación entre los hiyazíes aparece en los libros de relatos."
  fr: "D'après un hadith rapporté par les juristes dans les chapitres consacrés à l'éducation des enfants, le Prophète a dit: « Enseignez à vos enfants la prière, la natation et le tir à l'arc. » Al-Suyuti le mentionne dans al-Jami' al-Saghir, en précisant son importance (cite: sahih-jami-saghir-maktab-islami-1988). La natation fait partie des qualités physiques requises du musulman, selon les savants, et la pratique de la natation par les Hedjazis est mentionnée dans les recueils de hadiths."
  tr: "Peygamber'in rivayetine göre, \"Çocuklarınıza namaz, yüzme ve okçuluk öğretin\" diye söylemiştir; bu rivayet hukukçular tarafından çocuk yetiştirme görgü kuralları üzerine aktarılmıştır ve Celaleddin el-Suyuti tarafından al-Jami'al-Saghir'de derecesi üzerine tartışılır {atı:sahih-jami-saghir-maktab-islami-1988} Yüzme, alimlerin Müslümanlarla ilgili olarak bahsettiği tam fiziksel güç biçimidir ve Hicaz halkı arasında suda yüzme, rapor kitaplarında iyi bilinen bir konudur."
  id: "Dinawayatkan dari Nabi bahwa beliau berkata, \"Ajari anak-anakmu doa, berenang, dan memanah\" dalam riwayat mursal yang disampaikan oleh para ahli hukum tentang etiket membesarkan anak, dan disebutkan oleh Jalal al-Din al-Suyuti dalam al-Jami' al-Saghir dengan pembahasan tentang tingkatnya {cite:sahih-jami-saghir-maktab-islami-1988}. Renang adalah bentuk kekuatan fisik lengkap yang disebutkan oleh para ulama tentang umat Muslim, dan berenang di antara masyarakat Hijaz di air adalah hal yang terkenal dalam buku-buku laporan."
