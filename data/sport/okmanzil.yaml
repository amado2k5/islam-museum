label:
  ar: أوكمنضيل — ميادين الرمي العثمانية
  en: Ok-meydan — the Ottoman archery grounds
  ur: اوک میدان — عثمانی تیراندازی کے میدان
  es: "Ok-meydan — el campo de tiro con arco otomano"
  fr: "Ok-meydan — le terrain de tir à l'arc ottoman"
  tr: "Okmandil — Osmanlı Atış Poligonları"
  id: "Okmandil — Lapangan Tembak Ottoman"
summary:
  ar: مناطق الرمي بالقوس في الدولة العثمانية، ومنها أوكمنضيل استانبول، كان يبارز فيها الرماة على المسافة ويحفر الرمي الجديد
    حجرا باسمه عند القياس — منها نقش توزقبران إسكندر الكيلاني من مشاهير رماة القرن العاشر الهجري {cite:tdv-ok}.
  en: The Ottoman archery grounds, Istanbul's Ok-Meydan first among them, where archers vied for distance and each record
    shot had its stone marker raised at the measure — among the famous names Tozkoparan Iskandar of the tenth Hijri century
    {cite:tdv-ok}.
  ur: عثمانی تیراندازی کے میدان، سب سے پہلے استنبول کا اوک میدان، جہاں تیرانداز فاصلے کے لیے مقابلہ کرتے اور ہر ریکارڈ پر
    نشان سنگ کھڑا ہوتا — دسویں ہجری صدی کے مشہور ناموں میں توزقبران اسکندر {cite:tdv-ok}۔
  es: "Los campos de tiro con arco otomanos, entre los que destaca el Ok-Meydan de Estambul, donde los arqueros competían por la distancia y cada tiro récord tenía su marcador de piedra erigido en la medida; entre los nombres famosos se encuentra Tozkoparan Iskandar del siglo X de la Hégira {cite:tdv-ok}."
  fr: "Les terrains de tir à l'arc ottomans, dont Ok-Meydan à Istanbul, où les archers rivalisaient de distance et où chaque tir record voyait sa pierre dressée à la mesure — parmi les noms célèbres, Tozkoparan Iskandar du dixième siècle de l'Hégire {cite:tdv-ok}."
  tr: "Osmanlı İmparatorluğu'ndaki okçuluk bölgeleri, Okmendil İstanbul da dahil olmak üzere, okçuların uzaktan düello yaptığı ve yeni okçuların benzer şekilde onun adını taşıyan taşları kazıdığı alanlarda — bunlar arasında 10. yüzyıl Hicri ünlü okçularından biri olan Kilani'li Tuzqiran Iskender'in yazıtı da vardır {cite:tdv-ok}."
  id: "Wilayah panahan di Kekaisaran Ottoman, termasuk Okmendil Istanbul, di mana pemanah bertarung dari jarak jauh, dan pemanah baru mengukir batu yang bertuliskan namanya secara analogi — termasuk prasasti Tuzqiran Iskender dari Kilani, salah satu pemanah terkenal abad ke-10 H {cite:tdv-ok}."
