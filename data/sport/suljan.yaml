label:
  ar: الصولجان
  en: Polo (sawlijan)
  ur: صولجان
  es: "Polo (sawlijan)"
  fr: "Polo (sawlijan)"
  tr: "Topuz"
  id: "Gada"
summary:
  ar: لعبة الصولجان تضرب فيها الكرة بالصولجان من على ظهور الخيل، وقد عدّها ابن سينا في القانون من الرياضات القوية الميدانية
    مع العدو والمصارعة واللعب بالكرة {cite:canon-ibn-sina-print-v1 p. 222}. ولعبها الخلفاء والأمراء في ميادين بغداد والقاهرة،
    ومنها ميدان القلعة وساحة الفروسية.
  en: The sawlijan game strikes the ball with a mallet from horseback; Ibn Sina counts it in the Canon among the strong field
    exercises with running, wrestling and ball play {cite:canon-ibn-sina-print-v1 p. 222}. Caliphs and amirs played it in
    the maydans of Baghdad and Cairo, the Citadel ground and the furusiyya square among them.
  ur: صولجان کا کھیل گھوڑے کی پیٹھ پر گیند کو چوگان سے مارنا ہے؛ ابن سینا نے قانون میں اسے دوڑ، کشتی اور گیند کے کھیل کے ساتھ
    قوی میدانی ورزشوں میں شمار کیا {cite:canon-ibn-sina-print-v1 p. 222}۔ خلفاء اور امیر اسے بغداد اور قاہرہ کے میدانوں میں
    کھیلتے تھے۔
  es: "El juego sawlijan consiste en golpear la pelota con un mazo desde el caballo; Ibn Sina lo incluye en el Canon entre los ejercicios de campo más exigentes, junto con carreras, lucha y juegos de pelota {cite:canon-ibn-sina-print-v1 p. 222}. Los califas y emires lo practicaban en los maydans de Bagdad y El Cairo, entre ellos el campo de la Ciudadela y la plaza furusiyya."
  fr: "Le jeu de sawlijan consiste à frapper la balle avec un maillet depuis un cheval; Ibn Sina le compte dans le Canon parmi les exercices physiques intenses avec la course, la lutte et le jeu de balle {cite:canon-ibn-sina-print-v1 p. 222}. Les califes et les émirs y jouaient dans les maydans de Bagdad et du Caire, notamment sur le terrain de la Citadelle et la place furusiyya."
  tr: "Topuz oyunu, topa atların sırtından topuzla vurmayı içerir ve İbn Sina, topu koşma, güreş ve topla oynama gibi güçlü saha sporlarından biri olarak kabul eder {cite:canon-ibn-sina-print-v1 s. 222}}. Halifeler ve prensler, Bağdat ve Kahire'deki meydanlarda, Citadel Meydanı ve Atlı Meydanı da dahil olmak üzere bu oyunu oynarlardı."
  id: "Permainan gada melibatkan memukul bola dengan gada dari punggung kuda, dan Ibn Sina menganggapnya dalam kanon sebagai salah satu olahraga lapangan yang kuat dengan lari, gulat, dan bermain dengan bola {cite:canon-ibn-sina-print-v1 hlm. 222}. Khalifah dan pangeran memainkannya di alun-alun Baghdad dan Kairo, termasuk Alun-alun Benteng dan Alun-alun Berkuda."
