label:
  ar: الفروسية
  en: Horsemanship (furusiyya)
  ur: فروسیت
summary:
  ar: أمر الله بإعداد القوة ورباط الخيل، والخيل في القرآن معقود بنواصيها الخير إلى يوم القيامة في حديث البخاري {cite:sahih-al-bukhari}.
    وفي الصحيحين أن النبي راهن على الخيل وضاعف عدة الأفراس في عدة الإبل، وأنه سابق بين الخيل المضمرة من الحفياء إلى ثنية الوداع،
    وبين الخيل غير المضمرة من الثنية إلى مسجد بني زريق، وكان عبد الله بن عمر فيمن سبق {cite:sahih-al-bukhari}. وصارت الفروسية
    علماً مؤلفاً له كتبه من كتاب ابن قيم الجوزية «الفروسية» إلى كتب المملوكية في المناسب الحربية.
  en: God commanded the preparation of strength and the tethering of horses, and in a Bukhari report goodness is tied to the
    forelocks of horses until the Day of Resurrection {cite:sahih-al-bukhari}. In the two Sahihs the Prophet doubled the share
    of horses in the spoils over that of camels, and raced the trained horses from al-Hafya' to Thaniyyat al-Wada' and the
    untrained from al-Thaniyya to the mosque of Banu Zurayq, with Abdullah ibn Umar among the winners {cite:sahih-al-bukhari}.
    Horsemanship grew into a written science with its own manuals, from Ibn Qayyim's al-Furusiyya to the Mamluk books of military
    exercises.
  ur: خدا نے قوت اور گھوڑوں کی بندھن تیار کرنے کا حکم دیا، اور بخاری کی حدیث میں قیامت کے دن تک گھوڑوں کی پیشانیوں میں خیر
    بندھی ہے {cite:sahih-al-bukhari}۔ صحیحین میں ہے کہ نبی نے مالِ غنیمت میں اونٹوں پر گھوڑوں کا حصہ دگنا کیا، اور تربیت یافتہ
    گھوڑوں کی دوڑ حفیاء سے ثنیہ الوداع تک اور غیر مضمر گھوڑوں کی دوڑ ثنیہ سے مسجد بنو زریق تک کرائی، جن میں عبد اللہ بن عمر
    جیتنے والوں میں تھے {cite:sahih-al-bukhari}۔ پھر فروسیت ابن قیم کی «الفروسیہ» سے مملوک فوجی مشقوں کی کتابوں تک ایک مرتب
    علم بن گئی۔
