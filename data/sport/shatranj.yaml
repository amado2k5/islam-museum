label:
  ar: الشطرنج
  en: Chess (shatranj)
  ur: شطرنج
  es: "Ajedrez (shatranj)"
  fr: "Échecs (shatranj)"
  tr: "satranç"
  id: "Satranç"
summary:
  ar: 'دخلت الشطرنج بلاد الإسلام من فارس في العصر الأموي، واشتهر لاعبوها في بغداد العباسية، ومنهم علي سفي العادلي والربيع.
    واختلف فيها الفقهاء: منهم من كرهها أو حرمها لشبهتها بالنرد، ومنهم من أباحها بشروط، ومنهم من لعبها بلا حرج في مجالس الأدب
    — والخلاف مسطور في كتبهم، لا حكم للمتحف فيه.'
  en: 'Chess entered the Muslim lands from Persia in the Umayyad era, and its players became famous in Abbasid Baghdad, among
    them Ali al-Sufi al-Adli and al-Rabi''. The jurists disagreed on it: some disliked or prohibited it for its likeness to
    nard, some allowed it under conditions, and some played it without scruple in the salons of adab — the disagreement is
    on record in their books, and the museum gives no verdict.'
  ur: 'شطرنج اموی دور میں فارس سے مسلم ممالک میں آیا اور عباسی بغداد میں اس کے کھلاڑی مشہور ہوئے۔ فقہا میں اختلاف ہے: بعض
    نے نرد سے مشابہت کی بنا پر ناپسند یا حرام کیا، بعض نے شرائط کے ساتھ اجازت دی، اور بعض نے ادب کے مجالس میں کھیلا — اختلاف
    ان کی کتابوں میں درج ہے اور عجائب گھر کا کوئی فیصلہ نہیں۔'
  es: "El ajedrez llegó a tierras musulmanas desde Persia durante la época omeya, y sus jugadores alcanzaron gran fama en el Bagdad abasí, entre ellos Ali al-Sufi al-Adli y al-Rabi'. Los juristas discrepaban al respecto: algunos lo rechazaban o lo prohibían por su parecido con el nardo, otros lo permitían bajo ciertas condiciones, y otros lo practicaban sin escrúpulos en los salones de la adab. Esta discrepancia queda registrada en sus libros, y el museo no emite un veredicto al respecto."
  fr: "Les échecs firent leur apparition en terre musulmane depuis la Perse à l'époque omeyyade, et leurs joueurs devinrent célèbres à Bagdad sous les Abbassides, parmi lesquels Ali al-Sufi al-Adli et al-Rabi'. Les juristes étaient divisés à ce sujet: certains les désapprouvaient ou les interdisaient en raison de leur ressemblance avec le nard, d'autres les autorisaient sous certaines conditions, et d'autres encore y jouaient sans scrupules dans les salons de l'adab – cette divergence est consignée dans leurs ouvrages, et le musée ne se prononce pas."
  tr: "Satranç, Emevi döneminde İran'dan İslam topraklarına girdi ve oyuncuları Abbasi Bağdat'ta ünlü oldu; bunlar arasında Ali Safi el-Adili ve el-Rabie de vardı. Hukukçular farklı görüşlere baktı: bazıları zarlara benzediği için satrançtan hoşlanmadı veya yasakladı, bazıları şartlarla izin verdi, bazıları ise edebi toplantılarda utanmadan oynadı — bu anlaşmazlık kitaplarında kaydedildi ve müzenin bununla ilgili bir kararı yoktu."
  id: "Catur memasuki tanah Islam dari Persia pada era Umayyah, dan para pemainnya menjadi terkenal di Baghdad Abbasiyah, termasuk Ali Safi al-Adili dan al-Rabie. Para ahli hukum berbeda: beberapa tidak menyukainya atau melarangnya karena mirip dadu, beberapa mengizinkannya dengan syarat, dan beberapa memainkannya tanpa malu dalam pertemuan sastra — perbedaan ini tercatat dalam buku mereka, dan museum tidak memiliki keputusan tentang hal itu."
