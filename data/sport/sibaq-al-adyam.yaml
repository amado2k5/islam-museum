label:
  ar: سباق الأقدام
  en: Foot-racing
  ur: پیروں کی دوڑ
  es: "carreras a pie"
  fr: "Course à pied"
summary:
  ar: 'روت عائشة أنها سافرت مع النبي في بعض أسفاره وهي جارية لم يحمل اللحم، فقال لأصحابه: «تقدموا» فتقدموا، ثم قال لها: «تعالي
    حتى أسابقك» فسابقته فسبقته، حتى إذا حملت اللحم بعد ذلك خرجت معه فسابقته فسبقني، فقال: «هذه بتلك السبقة» {cite:sunan-abi-dawud}.
    والعدو من الرياضات القوية في قانون ابن سينا {cite:canon-ibn-sina-print-v1 p. 222}.'
  en: Aisha narrates that she travelled with the Prophet as a light-built young woman; he sent the companions ahead, then
    told her «Come, let me race you», and she beat him; later, when she had grown heavier, he raced her again and won, saying
    «This is for that one» {cite:sunan-abi-dawud}. Running is among the strong exercises in Ibn Sina's Canon {cite:canon-ibn-sina-print-v1
    p. 222}.
  ur: عائشہ روایت کرتی ہیں کہ نبی کے ساتھ سفر میں، جب وہ ہلکی بدن نوجوان تھیں، نبی نے صحابہ کو آگے بھیجا اور فرمایا «آؤ میں
    تم سے دوڑ لگاؤں» اور انھوں نے آپ کو دوڑ میں نکال دیا؛ بعد میں جب ان کا وزن بڑھ گیا تو آپ نے دوڑ جیتی اور فرمایا «یہ اس
    دوڑ کا بدلہ ہے» {cite:sunan-abi-dawud}۔ دوڑ ابن سینا کی قانون میں قوی ورزشوں میں ہے {cite:canon-ibn-sina-print-v1 p. 222}۔
  es: "Aisha narra que, siendo una joven de complexión delgada, viajó con el Profeta. Él envió a los compañeros por delante y luego le dijo: «Ven, vamos a competir», y ella le ganó. Más tarde, cuando había engordado, volvió a competir con ella y ganó, diciendo: «Esto es para aquella» {cite:sunan-abi-dawud}. Correr es uno de los ejercicios más fuertes que se mencionan en el Canon de Ibn Sina {cite:canon-ibn-sina-print-v1 p. 222}."
  fr: "Aïcha raconte qu'elle voyageait avec le Prophète, alors jeune et frêle. Il envoya les compagnons en avant, puis lui dit: « Viens, faisons la course ! » et elle le battit. Plus tard, ayant pris du poids, il fit de nouveau la course avec elle et gagna, disant: « Ceci est pour celle-là ! » {cite:sunan-abi-dawud}. La course à pied figure parmi les exercices les plus importants du Canon d'Ibn Sina {cite:canon-ibn-sina-print-v1 p. 222}."
