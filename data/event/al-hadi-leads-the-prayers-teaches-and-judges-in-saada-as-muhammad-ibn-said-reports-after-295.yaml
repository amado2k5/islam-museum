kind: other
label:
  ar: "الهادي يصلي بالناس ويعلمهم ويفصل بينهم في صعدة، بعد 295هـ، ص386"
  en: "Al-Hadi leads the prayers, teaches and judges between people in Sa'da, after 295 AH, p. 386"
  ur: "ہادی صعدہ میں لوگوں کو نماز پڑھاتا، تعلیم دیتا اور ان کے درمیان فیصلے کرتا ہے، 295ھ کے بعد، ص386"
  es: "Al-Hadi dirige las oraciones, enseña y juzga entre la gente en Sa'da, después del año 295 AH, pág. 386."
summary:
  ar: "نقل محمد بن سعيد أن الهادي كان يصلي بالناس الجماعة في صعدة ويعلمهم الفرائض ويفصل خصوماتهم برفق."
  en: "Muhammad ibn Sa'id reports that al-Hadi led the congregational prayers in Sa'da, taught the duties of religion and inheritance, and settled disputes gently."
  ur: "محمد بن سعید بیان کرتے ہیں کہ ہادی صعدہ میں جماعت سے نماز پڑھاتا، دین اور وراثت کے فرائض سکھاتا اور جھگڑوں کا نرمی سے فیصلہ کرتا تھا۔"
  es: "Muhammad ibn Sa'id relata que al-Hadi dirigía las oraciones en congregación en Sa'da, enseñaba los deberes de la religión y la herencia, y resolvía las disputas con amabilidad."
