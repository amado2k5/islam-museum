id: event/al-suyuti-shaykhuniyya-877
class: event
kind: other
label:
  ar: "السيوطي مدرّساً للحديث في الشيخونية، ٨٧٧هـ/١٤٧٢م"
  en: "Al-Suyuti appointed teacher of hadith at the Shaykhuniyya, 877/1472"
  ur: "سیوطی کا شیخونیہ میں مدرس حدیث مقرر ہونا، 877ھ/1472ء"
  es: "Al-Suyuti fue nombrado maestro de hadices en la Shaykhuniyya, 877/1472."
  fr: "Al-Suyuti nommé professeur de hadith à la Shaykhuniyya, 877/1472"
  tr: "El-Suyuti, Eş-Şeyhuniyye'de Hadis öğretiyor, H. 877/MS 1472"
  id: "Al-Suyuti mengajarkan Hadits di Al-Syaikhuniyya, 877 H/1472 M."
summary:
  ar: "نال السيوطي سنة ٨٧٧هـ/١٤٧٢م منصب تدريس الحديث في الشيخونية؛ فرشّحه له شيخه الكافياجي، ويبدو أنه حصل عليه كذلك بمساندة أمير مملوكي {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  en: "In 877/1472 al-Suyuti obtained the post of teacher of hadith at the Shaykhuniyya; though nominated by his teacher al-Kafiyaji, he seems to have owed the appointment also to the support of a Mamluk amir {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  ur: "877ھ/1472ء میں سیوطی کو شیخونیہ میں تدریس حدیث کا منصب ملا؛ اگرچہ ان کے استاذ کافیاجی نے انہیں نامزد کیا، لیکن شاید ایک مملوک امیر کی حمایت سے بھی یہ عہدہ ملا {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}۔"
  es: "En 877/1472 al-Suyuti obtuvo el puesto de maestro de hadices en la Shaykhuniyya; aunque fue nominado por su maestro al-Kafiyaji, parece que también debió el nombramiento al apoyo de un emir mameluco {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  fr: "En 877/1472, al-Suyuti obtint le poste de professeur de hadith à la Shaykhuniyya; bien que nommé par son professeur al-Kafiyaji, il semble qu'il devait également cette nomination au soutien d'un émir mamelouk {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  tr: "Hicri 877/Miladi 1472 yılında El-Suyuti, Şeyhuniyye'de Hadis öğretmenliği görevini üstlendi; hocası El-Kafiyaji onu bu göreve aday gösterdi ve görünüşe göre bir Memlük prensinin desteğiyle de bu görevi elde etti. {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}"
  id: "Pada tahun 877 H/1472 M, Al-Suyuti memperoleh posisi mengajar Hadits di Al-Shaykhuniyya; gurunya, Al-Kafiyaji, mencalonkannya untuk posisi tersebut, dan tampaknya ia juga memperolehnya dengan dukungan seorang pangeran Mamluk {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
