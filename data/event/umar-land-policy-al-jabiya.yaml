id: event/umar-land-policy-al-jabiya
class: event
kind: declaration
label: { ar: "مشورة معاذ في أرض الشام بالجابية", en: "Mu'adh's Counsel on the Land of Syria at al-Jabiya", es: "El consejo de Mu'adh sobre la tierra de Siria en al-Jabiya", fr: "Conseil de Mu'adh sur la terre de Syrie à al-Jabiya", ur: "الجبیہ میں شام کی سرزمین پر معاذ کا مشورہ", tr: "Mu'adh'ın Şam topraklarındaki, Jabiyah'taki öğütleri", id: "Nasihat Mu'adh di negeri Syam, di Jabiyah" }
summary:
  ar: "عند البلاذري عن عبد الله بن قيس الهمداني: قدم عمر بن الخطاب الجابية فأراد قسمة الأرض بين المسلمين لأنها فتحت عنوة فقال له معاذ بن جبل «والله لئن قسمتها ليكونّ ما نكره، ويصير الشيء الكثير في أيدي القوم ثم يبيدون فيبقى ذلك لواحد، ثم يأتي من بعدهم قوم يسدّون عن الإسلام مسدّاً فلا يجدون شيئاً، فانظر أمراً يسع أولهم وآخرهم» فصار إلى قول معاذ؛ وبها أسس عمر نظام خراج سواد الشام إبقاء الأرض بيد أهلها مقابل الجزية على الرؤوس والخراج على الأرض."
  en: "In al-Baladhuri from Abdullah ibn Qays al-Hamdani: Umar ibn al-Khattab came to al-Jabiya and meant to divide the land among the Muslims, it having been taken by force; Mu'adh ibn Jabal told him 'by God if you divide it, what we dislike will come of it — the abundance passes into the hands of a people who then perish, leaving it to one, then after them come people who stand in Islam's stead and find nothing — so look to an affair that suffices their first and their last', and Umar adopted Mu'adh's counsel; on it he founded the kharaj regime of the Syrian sawad, leaving the land in its people's hands against jizya on heads and kharaj on land."
  es: "En al-Baladhuri de Abdullah ibn Qays al-Hamdani: Umar ibn al-Khattab llegó a al-Jabiya y pretendía dividir la tierra entre los musulmanes, ya que había sido tomada por la fuerza; Mu'adh ibn Jabal le dijo: \"Por Dios, si la divides, sucederá lo que no nos gusta: la abundancia pasará a manos de un pueblo que luego perecerá, dejándola para uno solo, y después vendrán personas que se mantendrán en lugar del Islam y no encontrarán nada; así que busca un asunto que satisfaga tanto a sus primeros como a sus últimos\", y Umar adoptó el consejo de Mu'adh; sobre él fundó el régimen kharaj del sawad sirio, dejando la tierra en manos de su pueblo a cambio de la jizya sobre las cabezas y el kharaj sobre la tierra."
  fr: "Dans al-Baladhuri, d'après Abdullah ibn Qays al-Hamdani: Umar ibn al-Khattab arriva à al-Jabiya avec l'intention de partager la terre entre les musulmans, celle-ci ayant été prise par la force; Mu'adh ibn Jabal lui dit: « Par Dieu, si tu la partages, il en résultera ce que nous détestons: l'abondance passera entre les mains d'un peuple qui périra ensuite, la laissant à un seul, puis viendront après eux des gens qui se réclament de l'islam et ne trouveront rien; cherche donc une solution qui leur suffise au début et à la fin. » Umar suivit le conseil de Mu'adh et fonda sur lui le régime du kharaj du sawad syrien, laissant la terre entre les mains de son peuple, sans jizya sur les têtes ni kharaj sur les terres."
  ur: "بلادوری میں عبداللہ بن قیس ہمدانی سے مروی ہے کہ: عمر بن الخطاب الجبیہ میں آئے اور اس کا مقصد مسلمانوں کے درمیان زمین کو تقسیم کرنا تھا، اسے زبردستی لے لیا گیا تھا۔ معاذ بن جبل نے ان سے کہا کہ خدا کی قسم اگر تم اسے تقسیم کرو گے تو اس سے وہ چیز نکلے گی جو ہم ناپسند کرتے ہیں - کثرت ایک قوم کے ہاتھ میں چلی جاتی ہے جو اسے ایک کے ہاتھ میں چھوڑ دیتے ہیں، پھر ان کے بعد ایسے لوگ آتے ہیں جو اسلام کی جگہ پر کھڑے ہوتے ہیں اور انہیں کچھ نہیں ملتا - تو ایسے معاملے کی طرف دیکھو جو ان کے اولین اور آخرین کے لیے کافی ہو، اور عمر نے معاذ کو اپنایا۔ اس پر اس نے شامی صعود کی خوارج حکومت کی بنیاد رکھی، سروں پر جزیہ اور خشکی پر خارج کے خلاف زمین کو اس کے لوگوں کے ہاتھ میں چھوڑ دیا۔"
  tr: "El-Baladhuri, Abdullah bin Kays el-Hamdani'den rivayetle şöyle aktarmıştır: Ömer bin Hattab, Cebiye'ye geldi ve zorla ele geçirilen toprakları Müslümanlar arasında bölüştürmek istedi. Muaz bin Cebel ona şöyle dedi: \"Allah'a yemin ederim ki, eğer bölüştürürsen, hoşlanmadığımız şeyler olur ve birçok şey insanların eline geçer, sonra onlar helak olur ve bir kişiye kalır. Sonra onlardan sonra İslam'ı engelleyecek bir kavim gelir ve onlar hiçbir şey bulamazlar. Öyleyse, onlardan ilki ve sonuncusu için yeterli olacak bir çözüm ara.\" Bunun üzerine Ömer, Muaz'ın sözlerini benimsedi. Bununla birlikte, Ömer, Şam'ın Sawad vergi sistemini kurdu ve toprakları halkının elinde tutarak, baş vergisi ve toprak vergisi karşılığında bu sistemi uyguladı."
  id: "Al-Baladhuri meriwayatkan dari Abdullah bin Qais Al-Hamdani: Umar bin Al-Khattab datang ke Al-Jabiyah dan ingin membagi tanah di antara kaum Muslimin karena tanah itu ditaklukkan dengan kekerasan. Muadz bin Jabal berkata kepadanya, “Demi Allah, jika engkau membaginya, maka akan terjadi hal yang tidak kami sukai, dan banyak harta benda akan jatuh ke tangan manusia, kemudian mereka akan binasa dan hanya akan tersisa untuk satu orang. Kemudian akan datang suatu kaum setelah mereka yang akan menghalangi Islam dan mereka tidak akan menemukan apa pun. Maka carilah suatu perkara yang cukup bagi generasi pertama dan generasi terakhir mereka.” Maka ia mengikuti perkataan Muadz. Dengan itu, Umar menetapkan sistem pajak Sawad Syam, menjaga tanah tetap berada di tangan penduduknya dengan imbalan jizya atas kepala dan pajak atas tanah."
