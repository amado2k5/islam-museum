summary:
  ar: "ولى ابن عامر عبد الرحمن بن سمرة بن حبيب بن عبد شمس سجستان فأتى زرنج فحصر مرزبانها في قصره في يوم عيد لهم فصالحه على ألفي ألف درهم وألفي وصيف وغلب ابن سمرة على ما بين زرنج وكش من ناحية الهند وغلب من طريق الرخج على ما بينه وبين بلاد الداور فلما انتهى إلى بلاد الداور حصرهم في جبل الزور ثم صالحهم فكانت عدة من معه من المسلمين ثمانية آلاف فأصاب كل رجل منهم أربعة آلاف ودخل على الزور وهو صنم من ذهب عيناه ياقوتتان فقطع يده وأخذ الياقوتتين ثم قال للمرزبان دونك الذهب والجوهر إنما أردت أن أعلمك أنه لا يضر ولا ينفع وفتح بست وزابل بعهد."
  en: "Ibn Amir made Abd al-Rahman ibn Samura governor of Sijistan; he besieged Zaranj's marzban in his palace on their feast-day — truced for two million dirhams and two thousand wadif — then conquered between Zaranj and Kish on the India side, and by the Rukhkhaj road to the Dawar country, bottling them in Jabal al-Zur before truce. Eight thousand Muslims took four thousand each; he entered upon the Zur idol — gold, with ruby eyes — cut off its hand and took the rubies: 'yours, the gold and jewels — I meant only to show you it can neither harm nor benefit'. Bust and Zabil he took by compact."
  es: "Ibn Amir nombró a Abd al-Rahman ibn Samura gobernador de Sijistan; sitió al marzban de Zaranj en su palacio el día de su fiesta —acordó una tregua por dos millones de dirhams y dos mil wadif— luego conquistó entre Zaranj y Kish en el lado de la India, y por el camino de Rukhkhaj hacia el país de Dawar, acorralándolos en Jabal al-Zur antes de la tregua. Ocho mil musulmanes tomaron cuatro mil cada uno; entró en el ídolo de Zur —de oro, con ojos de rubí— le cortó la mano y tomó los rubíes: «Tuyos, el oro y las joyas; solo quería mostraros que no pueden ni dañar ni beneficiar». El busto y Zabil los tomó por pacto."
  fr: "Ibn Amir nomma Abd al-Rahman ibn Samura gouverneur du Sijistan. Il assiégea le marzban de Zaranj dans son palais le jour de leur fête – une trêve fut conclue pour deux millions de dirhams et deux mille wadifs – puis conquit la région entre Zaranj et Kish, côté indien, et par la route de Rukhkhaj jusqu'au pays de Dawar, les encerclant à Jabal al-Zur avant la trêve. Huit mille musulmans en prirent quatre mille chacun; il entra dans l'idole de Zur – en or, aux yeux de rubis – lui coupa la main et prit les rubis: « L'or et les joyaux sont à vous – je voulais seulement vous montrer qu'ils ne peuvent ni nuire ni profiter. » Il prit Bust et Zabil par accord."
  ur: "ابن عامر نے عبدالرحمٰن بن سمرہ کو سجستان کا گورنر بنایا۔ اس نے ان کی عید کے دن زرنج کے مرزبان کا اپنے محل میں محاصرہ کیا - 20 لاکھ درہم اور دو ہزار ودیف کے لئے جنگ بندی کی - پھر ہندوستان کی طرف زرنج اور کیش کے درمیان فتح کیا اور داور ملک کی طرف رخخج سڑک کے ذریعے جنگ بندی سے پہلے جبل الزور میں بوتلیں بند کر دیں۔ آٹھ ہزار مسلمانوں نے چار ہزار لیے۔ وہ زر کے بت پر داخل ہوا - سونے کی، یاقوت کی آنکھوں کے ساتھ - اس کا ہاتھ کاٹ کر یاقوت لے لیا: 'تمہارا، سونا اور جواہرات - میرا مقصد صرف تمہیں یہ دکھانا تھا کہ یہ نہ نقصان پہنچا سکتا ہے اور نہ فائدہ'۔ ٹوٹ اور زبیل اس نے کمپیکٹ کے ذریعے لی۔"
  tr: "İbn Amir, Abdülrahman ibn Samra ibn Habib ibn Abd Şems'i Sijistan valiliğine atadı. Zaranj'a geldi ve bayram günlerinden birinde sarayındaki Marzbanı kuşattı. İki milyon dirhem ve iki bin hizmetçi karşılığında onunla barış yaptı. İbn Samra, Hindistan tarafındaki Zaranj ile Kaş arasındaki bölgeyi fethetti ve Rukhj yoluyla kendisiyle Daver toprakları arasındaki bölgeyi de ele geçirdi. Daver topraklarına ulaştığında, onları Cebel el-Zur'da kuşattı ve sonra onlarla barış yaptı. Yanındaki Müslümanların sayısı sekiz bindi, bu yüzden her adama dört bin verildi. Gözlerinde iki yakut bulunan altın bir put olan el-Zur'a girdi. Elini kesti ve iki yakutu aldı. Sonra Marzbana, \"İşte altın ve mücevher. Size sadece bunun ne zararı ne de faydası olduğunu bildirmek istedim\" dedi. Bir antlaşma ile Bust ve Zebul'u fethetti."
  id: "Ibn Amir mengangkat Abd al-Rahman ibn Samra ibn Habib ibn Abd Shams sebagai gubernur Sijistan. Ia datang ke Zaranj dan mengepung Marzban di istananya pada salah satu hari raya mereka. Ia berdamai dengannya dengan imbalan dua juta dirham dan dua ribu pelayan. Ibn Samra menaklukkan wilayah antara Zaranj dan Kash di sisi India, dan ia menaklukkan, melalui Rukhj, wilayah antara dirinya dan tanah Dawar. Ketika ia mencapai tanah Dawar, ia mengepung mereka di Jabal al-Zur, lalu berdamai dengan mereka. Jumlah Muslim yang bersamanya adalah delapan ribu, sehingga setiap orang menerima empat ribu. Ia memasuki al-Zur, yang merupakan berhala emas dengan dua batu rubi di matanya. Ia memotong tangannya dan mengambil kedua batu rubi tersebut. Kemudian ia berkata kepada Marzban, “Inilah emas dan permata itu. Aku hanya ingin memberitahumu bahwa itu tidak membahayakan maupun memberi manfaat.” Dia menaklukkan Bust dan Zabul melalui sebuah perjanjian."
