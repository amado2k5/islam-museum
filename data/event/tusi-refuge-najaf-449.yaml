label:
  ar: "كبس دار الطوسي بالكرخ ولجوؤه إلى النجف، صفر ٤٤٩هـ"
  en: "Storming of al-Tusi's Karkh house and his refuge in Najaf, Safar 449/1057"
  ur: "کرخ میں طوسی کے گھر پر حملہ اور نجف میں پناہ، صفر 449ھ/1057ء"
  es: "Asalto a la casa de al-Tusi en Karkh y a su refugio en Nayaf, Safar 449/1057."
  fr: "Prise d'assaut de la maison d'al-Tusi à Karkh et de son refuge à Najaf, Safar 449/1057"
  tr: "Hicri 449 Safer ayında El-Tusi'nin El-Karkh'taki evine ve Necef'teki sığınağına yapılan baskın."
  id: "Penyerbuan ke rumah Al-Tusi di Al-Karkh dan tempat perlindungannya di Najaf, Safar 449 H."
summary:
  ar: "في صفر سنة ٤٤٩هـ كُبست دار أبي جعفر الطوسي متكلم الشيعة بالكرخ فأُخذ ما وُجد فيها من دفاتره وكرسيه الذي كان يجلس عليه للكلام، وأُلحق بها ثلاثة مجانيق بيض كان زوار أهل الكرخ يحملونها معهم إلى زيارة الكوفة، فأُحرق الجميع بسوق الكرخ {cite:muntazam-ibn-al-jawzi j.8 p.521}. ولجأ الطوسي إلى النجف فأقام بها بقية عمره يدرّس حلقة محدودة من التلاميذ بينهم ابنه أبو علي الحسن الذي خلفه {cite:encyclopaedia-of-islam-2 vol. 10 p. 745}، وقيل إنه «كان ينزل بالكرخ ثم انتقل إلى مشهد الكوفة» {cite:tarikh-islam-dhahabi p. 491}."
  en: "In Safar 449 the Karkh house of Abu Ja'far al-Tusi, the Shi'i's theologian, was stormed: his notebooks, the chair on which he sat to teach, and three white mangonels that Karkh pilgrims used to carry to the Kufa visitation were all taken out and burned in the Karkh market {cite:muntazam-ibn-al-jawzi j.8 p.521}. Al-Tusi took refuge in Najaf and stayed there until his death, teaching a limited circle of disciples including his son Abu Ali al-Hasan, who succeeded him {cite:encyclopaedia-of-islam-2 vol. 10 p. 745}."
  ur: "صفر 449ھ میں ابو جعفر طوسی متکلمِ شیعہ کے کرخ کے گھر پر چھاپہ مارا گیا: ان کی کتب، کلام کی کرسی اور تین سفید منجنیقیں جو کرخ کے زائرین کوفہ کی زیارت پر لے جاتے تھے، سب نکال کر بازارِ کرخ میں جلائی گئیں {cite:muntazam-ibn-al-jawzi j.8 p.521}۔ طوسی نجف میں پناہ گزین ہوئے اور وہیں وفات تک رہے، محدود حلقے کو پڑھاتے رہے جن میں ان کے جانشین بیٹے ابو علی الحسن بھی تھے {cite:encyclopaedia-of-islam-2 vol. 10 p. 745}۔"
  es: "En Safar 449, la casa de Abu Ja'far al-Tusi, el teólogo chiíta de Karkh, fue asaltada: sus cuadernos, la silla en la que se sentaba a enseñar y tres mangoneles blancos que los peregrinos de Karkh solían llevar a la visita a Kufa fueron sacados y quemados en el mercado de Karkh {cite:muntazam-ibn-al-jawzi j.8 p.521}. Al-Tusi se refugió en Nayaf y permaneció allí hasta su muerte, enseñando a un círculo reducido de discípulos, entre ellos su hijo Abu Ali al-Hasan, quien lo sucedió {cite:encyclopaedia-of-islam-2 vol. 10 p. 745}."
  fr: "En Safar 449, la maison d'Abu Ja'far al-Tusi, théologien chiite, à Karkh, fut prise d'assaut: ses cahiers, la chaise sur laquelle il enseignait et trois mangonneaux blancs que les pèlerins de Karkh transportaient lors du pèlerinage à Koufa furent emportés et brûlés sur le marché de Karkh (Muntazam ibn al-Jawzi, vol. 8, p. 521). Al-Tusi se réfugia à Najaf où il demeura jusqu'à sa mort, enseignant à un cercle restreint de disciples, parmi lesquels son fils Abu Ali al-Hasan, qui lui succéda (Encyclopaedia of Islam, vol. 2, p. 745)."
  tr: "Hicri 449 yılının Safer ayında, Şii ilahiyatçı Ebu Cafer el-Tusi'nin Kerh'deki evi basıldı. Kitapları ve konuşma yaptığı kürsüsü, Kerh'den gelen ziyaretçilerin Kufe'ye götürdükleri üç beyaz sapanla birlikte alındı. Bunların hepsi Kerh pazarında yakıldı. {kaynak:muntazam-ibn-al-jawzi c.8 s.521}. El-Tusi, hayatının geri kalanını oğlu Ebu Ali el-Hasan'ın da aralarında bulunduğu küçük bir öğrenci grubuna ders vererek geçirdiği Necef'e sığındı. {kaynak:islam-ansiklopedisi-2 cilt 10 s. 745}. \"Kerh'te kalır, sonra Kufe'deki türbeye taşınırdı\" denmektedir. {kaynak:tarikh-islam-dhahabi s. 491}."
  id: "Pada bulan Safar tahun 449 H, rumah Abu Ja'far al-Tusi, seorang teolog Syiah di Karkh, diserbu. Buku-bukunya dan kursi yang digunakannya untuk berbicara diambil, bersama dengan tiga ketapel putih yang biasa dibawa oleh pengunjung dari Karkh ke Kufa. Semua itu dibakar di pasar Karkh. {cite:muntazam-ibn-al-jawzi j.8 p.521}. Al-Tusi mencari perlindungan di Najaf, di mana ia menghabiskan sisa hidupnya mengajar sekelompok kecil murid, di antaranya putranya Abu Ali al-Hasan, yang menggantikannya. {cite:encyclopaedia-of-islam-2 vol. 10 p. 745}. Dikatakan bahwa ia \"biasanya tinggal di Karkh dan kemudian pindah ke makam Kufa.\" {cite:tarikh-islam-dhahabi p. 491}."
