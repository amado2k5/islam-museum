label:
  ar: "كبس دار الطوسي بالكرخ ولجوؤه إلى النجف، صفر ٤٤٩هـ"
  en: "Storming of al-Tusi's Karkh house and his refuge in Najaf, Safar 449/1057"
  ur: "کرخ میں طوسی کے گھر پر حملہ اور نجف میں پناہ، صفر 449ھ/1057ء"
summary:
  ar: "في صفر سنة ٤٤٩هـ كُبست دار أبي جعفر الطوسي متكلم الشيعة بالكرخ فأُخذ ما وُجد فيها من دفاتره وكرسيه الذي كان يجلس عليه للكلام، وأُلحق بها ثلاثة مجانيق بيض كان زوار أهل الكرخ يحملونها معهم إلى زيارة الكوفة، فأُحرق الجميع بسوق الكرخ {cite:muntazam-ibn-al-jawzi j.8 p.521}. ولجأ الطوسي إلى النجف فأقام بها بقية عمره يدرّس حلقة محدودة من التلاميذ بينهم ابنه أبو علي الحسن الذي خلفه {cite:encyclopaedia-of-islam-2 vol. 10 p. 745}، وقيل إنه «كان ينزل بالكرخ ثم انتقل إلى مشهد الكوفة» {cite:tarikh-islam-dhahabi p. 491}."
  en: "In Safar 449 the Karkh house of Abu Ja'far al-Tusi, the Shi'i's theologian, was stormed: his notebooks, the chair on which he sat to teach, and three white mangonels that Karkh pilgrims used to carry to the Kufa visitation were all taken out and burned in the Karkh market {cite:muntazam-ibn-al-jawzi j.8 p.521}. Al-Tusi took refuge in Najaf and stayed there until his death, teaching a limited circle of disciples including his son Abu Ali al-Hasan, who succeeded him {cite:encyclopaedia-of-islam-2 vol. 10 p. 745}."
  ur: "صفر 449ھ میں ابو جعفر طوسی متکلمِ شیعہ کے کرخ کے گھر پر چھاپہ مارا گیا: ان کی کتب، کلام کی کرسی اور تین سفید منجنیقیں جو کرخ کے زائرین کوفہ کی زیارت پر لے جاتے تھے، سب نکال کر بازارِ کرخ میں جلائی گئیں {cite:muntazam-ibn-al-jawzi j.8 p.521}۔ طوسی نجف میں پناہ گزین ہوئے اور وہیں وفات تک رہے، محدود حلقے کو پڑھاتے رہے جن میں ان کے جانشین بیٹے ابو علی الحسن بھی تھے {cite:encyclopaedia-of-islam-2 vol. 10 p. 745}۔"
