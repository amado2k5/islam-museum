id: event/al-hadi-receives-a-petitioner-at-dawn
class: event
kind: other
label:
  ar: الهادي يستقبل مستعدياً في السحر ويقول ليس الإمام منا من احتجب عن الضعيف
  en: 'Al-Hadi receives a petitioner before dawn: "an imam of ours does not veil himself from the weak"'
  ur: 'ہادی سحر کے وقت ایک فریادی کو قبول کرتے ہیں: «ہم میں امام وہ نہیں جو کمزور سے چھپ جائے»'
summary:
  ar: جاء رجل ضعيف في السحر يستعدي على قوم فدق الباب، فأمر الهادي بإدخاله ووجه معه ثلاثة رجال يحضرون خصومه، ثم قال لراويه الحمد لله الذي جعلنا رحمة على خلقه، وإن واحداً من الظلمة ما دنا إلى بابه في هذا الوقت مستعد، وليس الإمام منا من احتجب عن الضعيف في وقت حاجة ملحة.
  en: A weak man came before dawn seeking redress against some people and knocked; al-Hadi had him admitted and sent three men with him to bring his opponents, then told his narrator that God had made them a mercy to His creatures, that no tyrant would have a complainant come to his door at that hour, and that an imam of theirs does not hide from the weak in a time of pressing need.
  ur: ایک کمزور آدمی سحر کے وقت کچھ لوگوں کے خلاف فریاد لے کر آیا اور دروازہ کھٹکھٹایا؛ ہادی نے اسے اندر بلایا اور اس کے ساتھ تین آدمی بھیجے کہ اس کے مخالفین کو لائیں، پھر راوی سے کہا کہ اللہ نے انہیں اپنی مخلوق کے لیے رحمت بنایا ہے، کسی ظالم کے دروازے پر اس وقت فریادی نہ آتا، اور ہم میں امام وہ نہیں جو شدید ضرورت کے وقت کمزور سے چھپ جائے۔
