id: event/al-hadi-receives-a-petitioner-at-dawn
class: event
kind: other
label:
  ar: الهادي يستقبل مستعدياً في السحر ويقول ليس الإمام منا من احتجب عن الضعيف
  en: 'Al-Hadi receives a petitioner before dawn: "an imam of ours does not veil himself from the weak"'
  ur: 'ہادی سحر کے وقت ایک فریادی کو قبول کرتے ہیں: «ہم میں امام وہ نہیں جو کمزور سے چھپ جائے»'
  es: "Al-Hadi recibe a un suplicante antes del amanecer: \"Uno de nuestros imanes no se oculta de los débiles\"."
  fr: "Al-Hadi reçoit un pétitionnaire avant l'aube: « Un de nos imams ne se voile pas devant les faibles. »"
  tr: "El-Hadi şafak vakti bir duacıyı kabul eder ve şöyle der: \"Bizim imamımız, zayıflardan saklananlardan değildir.\""
  id: "Al-Hadi menerima seorang pemohon di waktu subuh dan berkata, “Imam di antara kita bukanlah orang yang menyembunyikan diri dari orang-orang lemah.”"
summary:
  ar: جاء رجل ضعيف في السحر يستعدي على قوم فدق الباب، فأمر الهادي بإدخاله ووجه معه ثلاثة رجال يحضرون خصومه، ثم قال لراويه الحمد لله الذي جعلنا رحمة على خلقه، وإن واحداً من الظلمة ما دنا إلى بابه في هذا الوقت مستعد، وليس الإمام منا من احتجب عن الضعيف في وقت حاجة ملحة.
  en: A weak man came before dawn seeking redress against some people and knocked; al-Hadi had him admitted and sent three men with him to bring his opponents, then told his narrator that God had made them a mercy to His creatures, that no tyrant would have a complainant come to his door at that hour, and that an imam of theirs does not hide from the weak in a time of pressing need.
  ur: ایک کمزور آدمی سحر کے وقت کچھ لوگوں کے خلاف فریاد لے کر آیا اور دروازہ کھٹکھٹایا؛ ہادی نے اسے اندر بلایا اور اس کے ساتھ تین آدمی بھیجے کہ اس کے مخالفین کو لائیں، پھر راوی سے کہا کہ اللہ نے انہیں اپنی مخلوق کے لیے رحمت بنایا ہے، کسی ظالم کے دروازے پر اس وقت فریادی نہ آتا، اور ہم میں امام وہ نہیں جو شدید ضرورت کے وقت کمزور سے چھپ جائے۔
  es: "Un hombre débil llegó antes del amanecer buscando reparación contra ciertas personas y llamó a la puerta; al-Hadi lo hizo entrar y envió a tres hombres con él para que trajeran a sus oponentes, luego le dijo a su narrador que Dios los había hecho una misericordia para Sus criaturas, que ningún tirano permitiría que un quejoso llegara a su puerta a esa hora, y que un imán de entre ellos no se esconde de los débiles en un momento de necesidad apremiante."
  fr: "Un homme faible vint avant l'aube chercher réparation contre certaines personnes et frappa à la porte; al-Hadi le fit entrer et envoya trois hommes avec lui chercher ses adversaires, puis dit à son narrateur que Dieu avait fait d'eux une miséricorde pour Ses créatures, qu'aucun tyran ne laisserait un plaignant se présenter à sa porte à cette heure-là, et qu'un imam parmi eux ne se cache pas des faibles en cas de besoin pressant."
  tr: "Büyü konusunda zayıf bir adam, bir topluluğa karşı yardım istemek için kapıyı çaldı. El-Hadi, onu içeri getirmelerini emretti ve rakiplerini getirmek için üç adamını da yanına gönderdi. Sonra rivayet edene şöyle dedi: \"Bizi yarattıklarına rahmet kılan Allah'a hamd olsun. Bu zamanda zalimlerden hiçbiri kapısına yaklaşmadı ve İmam da acil bir ihtiyaç anında zayıflardan saklananlardan değildir.\""
  id: "Seorang pria lemah yang ahli sihir datang meminta pertolongan melawan suatu kaum dan mengetuk pintu. Al-Hadi memerintahkan agar dia dibawa masuk dan mengirim tiga orang bersamanya untuk membawa lawan-lawannya. Kemudian dia berkata kepada perawinya, “Segala puji bagi Allah yang menjadikan kita rahmat bagi ciptaan-Nya. Tidak seorang pun dari para penindas yang mendekati pintunya saat ini, dan Imam bukanlah termasuk golongan kita yang bersembunyi dari orang-orang lemah di saat dibutuhkan.”"
