label:
  ar: "ابن الصلاح يدخل الشام في سنة سبع عشرة أو قبلها: دمشق وحلب وحران، ٦١٧هـ/١٢٢٠م"
  en: "Ibn al-Salah enters al-Sham in 617 or earlier: Damascus, Aleppo and Harran, 617/1220"
  ur: "ابن الصلاح 617ھ یا اس سے پہلے شام داخل ہوتے ہیں: دمشق، حلب اور حران، 617ھ/1220ء"
summary:
  ar: "دخل ابن الصلاح الشام في سنة سبع عشرة وستمائة أو قبلها، فسمع من الموفق شيخ الحنابلة ابن قدامة المقدسي وزين الأمناء وأخيه المفتي فخر الدين؛ وكان قد ورد دمشق قبل ذلك فسمع من القاضي جمال الدين ابن الحرستاني، وسمع بحلب من أبي محمد ابن الأستاذ وبحران من الحافظ عبد القادر {cite:tarikh-islam-dhahabi p. 186}."
  en: "Ibn al-Salah entered al-Sham in 617/1220 or earlier, hearing from al-Muwaffaq, the shaykh of the Hanbalis Ibn Qudama al-Maqdisi, from Zayn al-Umana' and from al-Muwaffaq's brother the mufti Fakhr al-Din. He had already come to Damascus before, hearing from the qadi Jamal al-Din ibn al-Harastani; at Aleppo he heard Abu Muhammad ibn al-Ustadh, and at Harran the hafiz 'Abd al-Qadir {cite:tarikh-islam-dhahabi p. 186}."
  ur: "ابن الصلاح 617ھ/1220ء میں یا اس سے پہلے شام داخل ہوئے اور حنابلہ کے شیخ موفق الدین ابن قدامہ مقدسی، زین الامناء اور ان کے بھائی مفتی فخر الدین سے سماعت کی۔ اس سے پہلے بھی وہ دمشق آئے تھے اور قاضی جمال الدین ابن حرستانی سے سماعت کی؛ حلب میں ابو محمد ابن الاستاذ اور حران میں حافظ عبد القادر سے سماعت کی {cite:tarikh-islam-dhahabi p. 186}۔"
