summary:
  en: "The first major battle between the Muslims of Medina and the Quraysh of Mecca, fought at the wells of Badr on 17 Ramadan 2 AH."
  ar: "أول معركة كبرى فاصلة بين مسلمي المدينة وقريش مكة، دارت عند آبار بدر يوم الجمعة 17 رمضان 2هـ؛ بدأت مطاردةً لعير أبي سفيان وانتهت بهزيمة جيش مكة."
