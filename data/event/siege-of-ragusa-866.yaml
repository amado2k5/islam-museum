  id: "Gambaran umum pengepungan Ragusa dari tahun 866 hingga 868 M, pengepungan kota oleh Aghlabid hingga akhirnya dipatahkan oleh Bizantium; sumber-sumbernya belum ditinjau di halaman ini."
