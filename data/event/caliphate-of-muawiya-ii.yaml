id: event/caliphate-of-muawiya-ii
class: event
kind: other
label: { ar: "خلافة معاوية بن يزيد", en: "Caliphate of Mu'awiya ibn Yazid", fr: "Le califat de Mu'awiya ibn Yazid", es: "Califato de Mu'awiya ibn Yazid", ur: "معاویہ بن یزید کی خلافت", tr: "Muaviye ibn Yezid'in halifeliği", id: "Kekhalifahan Muawiyah bin Yazid" }
summary:
  ar: "استخلف معاوية بن يزيد بن معاوية بعهد من أبيه في ربيع الأول سنة أربع وستين وكان شاباً صالحاً، فلما استخلف كان مريضاً فاستمر مريضاً إلى أن مات ولم يخرج إلى الناس ولا فعل شيئاً من الأمور ولا صلى بالناس، وكانت مدة خلافته أربعين يوماً وقيل شهرين وقيل ثلاثة أشهر، ومات وله إحدى وعشرون سنة وقيل عشرون، ولما احتضر قيل له ألا تستخلف قال ما أصبت من حلاوتها فلم أتحمل مرارتها {cite:tarikh-khulafa-minhaj-1434 p. 347}."
  en: "Mu'awiya II ibn Yazid succeeded by his father's testament in Rabi' I 64, a righteous youth; he remained ill throughout, never appearing before the people nor leading them in prayer. His caliphate lasted forty days — some say two or three months — and he died aged twenty or twenty-one. When urged at his deathbed to name a successor he answered: 'I have tasted none of its sweetness — why should I shoulder its bitterness?' {cite:tarikh-khulafa-minhaj-1434 p. 347}."
  fr: "Mu'awiya II ibn Yazid succéda par testament de son père en Rabi' I 64, un jeune homme vertueux ; il resta malade tout du long, sans jamais paraître devant les gens ni les diriger dans la prière. Son califat dura quarante jours (certains disent deux ou trois mois), et il mourut à vingt ou vingt et un ans. Pressé sur son lit de mort de désigner un successeur, il répondit : « Je n'en ai goûté aucune douceur ; pourquoi en porterais-je l'amertume ? » {cite:tarikh-khulafa-minhaj-1434 p. 347}."
  es: "Muawiya II ibn Yazid fue sucedido por testamento de su padre en Rabi' I 64, un joven justo; permaneció enfermo durante todo ese tiempo, sin presentarse jamás ante el pueblo ni dirigir la oración. Su califato duró cuarenta días —algunos dicen dos o tres meses— y murió a los veinte o veintiún años. Cuando, en su lecho de muerte, le pidieron que nombrara un sucesor, respondió: «No he probado su dulzura; ¿por qué habría de cargar con su amargura?» {cite:tarikh-khulafa-minhaj-1434 p. 347}."
  ur: "معاویہ ثانی ابن یزید ربیع اول 64 میں اپنے والد کے وصیت کے مطابق ایک صالح نوجوان تھا۔ وہ ہر وقت بیمار رہا، کبھی لوگوں کے سامنے نہیں آیا اور نہ ہی ان کی نماز پڑھائی۔ ان کی خلافت چالیس دن تک جاری رہی - بعض کا کہنا ہے کہ دو یا تین ماہ - اور وہ اکیس یا اکیس سال کی عمر میں فوت ہو گئے۔ بستر مرگ پر جب کسی جانشین کا نام لینے کے لیے کہا گیا تو اس نے جواب دیا: 'میں نے اس کی کوئی مٹھاس نہیں چکھائی، میں اس کی کڑواہٹ کیوں برداشت کروں؟' {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 347}۔"
  tr: "Muaviye ibn Yezid ibn Muaviye, babası tarafından 64. yılın Rebiü'l-Evvel ayında halife olarak atanmıştır. Salih bir genç adamdı. Atandığında hastaydı ve vefat edene kadar hasta kaldı. Halkın arasına çıkmadı, hiçbir şey yapmadı ve insanlara namaz kıldırmadı. Halifeliği kırk gün, ya da iki ay, ya da üç ay olarak rivayet edilmiştir. Yirmi bir yaşında, ya da yirmi yaşında vefat etti. Ölmek üzereyken, halef atamaması istendi. O da, \"Tatlılığını tatmadım, acısını da kaldıramam\" dedi. {Kaynak:tarikh-khulafa-minhaj-1434 s. 347}"
  id: "Muawiyah bin Yazid bin Muawiyah diangkat oleh ayahnya pada bulan Rabi' al-Awwal tahun enam puluh empat. Ia adalah seorang pemuda yang saleh. Ketika diangkat, ia sakit, dan tetap sakit hingga wafat. Ia tidak keluar menemui orang banyak, tidak melakukan apa pun, dan tidak memimpin orang banyak dalam salat. Masa kekhalifahannya berlangsung selama empat puluh hari, atau ada yang mengatakan dua bulan, atau ada yang mengatakan tiga bulan. Ia wafat pada usia dua puluh satu tahun, atau ada yang mengatakan dua puluh tahun. Ketika ia sekarat, ia diminta untuk tidak mengangkat pengganti. Ia berkata, \"Aku belum merasakan manisnya, jadi aku tidak dapat menanggung kepahitannya.\" {cite:tarikh-khulafa-minhaj-1434 p. 347}"
