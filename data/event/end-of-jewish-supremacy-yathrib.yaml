label: { ar: "غلبة الأنصار على المدينة وقتل الفطيون", en: "The Ansar's triumph over Medina and the killing of al-Fityawn", es: "El triunfo de los Ansar sobre Medina y el asesinato de al-Fityawn.", fr: "Le triomphe des Ansar sur Médine et la mort d'al-Fityawn" }
summary:
  ar: "نهاية استيلاء يهود على يثرب؛ كان الاستيلاء لليهود على المدينة حين نزلتها الأوس والخزرج إلى أن ملك عليهم الفطيون اليهودي من بني لعلبة وكان رجل سوء فاجراً تدين له اليهود بألا تزوج امرأة منهم إلا دخلت عليه قبل زوجها، فلما زُفت أخت مالك بن العجلان الخزرجي صاحت به أدخل على غير زوجي فدخل مالك على الفطيون في خدره فقتله، وهرب مالك إلى الشام فدخل على أبي جبيلة عبيد بن سالم الخزرجي العظيم عند ملك غسان فعاهد الله ألا يمس طيباً ولا يأتي النساء حتى يذل اليهود ويكون الأوس والخزرج أعز أهلها، فسار في جمع كثير وأظهر أنه يريد اليمن حتى نزل بذي حرض وأرسل إلى وجوه اليهود يستدعيهم ويظهر الإحسان فلما اجتمعوا ببابه أدخلهم رجلاً رجلاً فقتلهم عن آخرهم، فصارت الأوس والخزرج أعز أهل المدينة وشاركوا اليهود في النخل والدور {cite:kamil-ibn-al-athir p. 487-491}."
  en: "The end of Jewish supremacy at Yathrib: the tyrant al-Fityawn of Banu La'laba claimed every Jewish bride before her husband until Malik ibn al-Ajlan the Khazraji killed him in his chamber at his own sister's wedding; Malik fled to Abu Jubayla — a Khazraji grandee at the Ghassanid court — who swore off perfume and women until the Jews were humbled, marched to Yathrib feigning a Yemen campaign, summoned the Jewish notables and slaughtered them at his door, leaving Aws and Khazraj masters of palm and dwelling {cite:kamil-ibn-al-athir p. 487-491}."
  es: "El fin de la supremacía judía en Yathrib: el tirano al-Fityawn de Banu La'laba reclamaba a todas las novias judías antes que a sus maridos hasta que Malik ibn al-Ajlan el Khazraji lo mató en su habitación en la boda de su propia hermana; Malik huyó a Abu Jubayla —un gran Khazraji en la corte Ghassanid— quien renunció al perfume y a las mujeres hasta que los judíos fueron humillados, marchó a Yathrib fingiendo una campaña en Yemen, convocó a los notables judíos y los masacró en su puerta, dejando a Aws y Khazraj como amos de la palma y la vivienda {cite:kamil-ibn-al-athir p. 487-491}."
  fr: "La fin de la suprématie juive à Yathrib: le tyran al-Fityawn de Banu La'laba réclamait chaque épouse juive avant son mari jusqu'à ce que Malik ibn al-Ajlan le Khazraji le tue dans sa chambre lors du mariage de sa propre sœur; Malik s'enfuit chez Abu Jubayla — un grand Khazraji à la cour des Ghassanides — qui jura de se priver de parfum et de femmes jusqu'à ce que les Juifs soient humiliés, marcha sur Yathrib en simulant une campagne au Yémen, convoqua les notables juifs et les massacra à sa porte, laissant Aws et les Khazraj maîtres du palmier et du logement {cite:kamil-ibn-al-athir p. 487-491}."
