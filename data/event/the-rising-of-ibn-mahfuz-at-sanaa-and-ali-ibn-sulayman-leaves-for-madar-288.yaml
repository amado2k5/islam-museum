id: event/the-rising-of-ibn-mahfuz-at-sanaa-and-ali-ibn-sulayman-leaves-for-madar-288
class: event
kind: other
label:
  ar: "خروج ابن محفوظ بصنعاء وخروج علي بن سليمان إلى مدر، جمادى الآخرة 288هـ"
  en: "The rising of Ibn Mahfuz at Sana'a and Ali ibn Sulayman's departure for Madar, Jumada II 288 AH"
  ur: "صنعاء میں ابن محفوظ کا خروج اور علی بن سلیمان کا مدر کو نکلنا، جمادی الآخرہ 288ھ"
summary:
  ar: "في الأيام الباقية من جمادى الآخرة اجتمع جماعة من سفهاء صنعاء مع علي بن سليمان وفرض فرساناً، وبعد يومين صاح ابن محفوظ بجمع من الغوغاء وكسروا حبس صنعاء ورجموا باب داره، فحمل عليهم وقتل رجلاً، ثم خرج بستة فوارس من الطبريين إلى مدر، وأدخل الغوغاء ابن يعفر من ظهر إلى صنعاء وقام معه أكثر العسكر."
  en: "In the days remaining of Jumada II a body from Sana'a gathered with Ali ibn Sulayman, who mustered horsemen; two days later Ibn Mahfuz shouted to a crowd, they broke the prison of Sana'a and stoned the door of Ali's house, he charged them and killed a man, then left with six Tabari horsemen for Madar, and the crowd brought Ibn Ya'fur from Zahr into Sana'a, most of the army standing with him."
  ur: "جمادی الآخرہ کے باقی دنوں میں صنعاء کے ایک گروہ نے علی بن سلیمان کے ساتھ جمع ہو کر سواروں کی بھرتی کی؛ دو دن بعد ابن محفوظ نے ایک بھیڑ کو پکارا، انہوں نے صنعاء کا قید خانہ توڑا اور علی کے گھر کے دروازے پر پتھر برسائے، انہوں نے حملہ کر کے ایک آدمی کو مار ڈالا، پھر طبری رشتہ داروں کے چھ سواروں کے ساتھ مدر چلے گئے، اور بھیڑ ظہر سے ابن یعفر کو صنعاء لے آئی اور زیادہ تر لشکر اس کے ساتھ ہو گیا۔"
