label: { ar: "غزوة سالم بن عمير لقتل أبي عفك", en: "Salim ibn Umayr's mission to kill Abu Afak" }
summary:
  ar: "يروي ابن إسحاق أن أبا عفك، أحد بني عمرو بن عوف ثم من بني عبيدة، «نجم نفاقه» حين قُتل الحارث بن سويد بن الصامت، فقال شعراً يذم فيه راكباً صدّع أولاد قيلة وفرّق جمعهم؛ فقال النبي: من لي بهذا الخبيث؟ فخرج سالم بن عمير أحد البكائين فقتله؛ وقالت أمامة المزيرية في ذلك بيتين."
  en: "Ibn Ishaq relates that Abu Afak, of Banu Amr ibn Awf and then of Banu Ubayda, showed his hypocrisy openly when al-Harith ibn Suwayd ibn al-Samit was killed, and composed verses reviling a rider who had split the sons of Qayla and broken their unity; the Prophet said: who will deal with this wretch for me? and Salim ibn Umayr, one of the Weepers, went out and killed him; Umama al-Muzayriyya spoke two verses on it."
