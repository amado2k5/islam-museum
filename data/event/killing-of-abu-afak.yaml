id: event/killing-of-abu-afak
class: event
kind: death
label: { ar: "غزوة سالم بن عمير لقتل أبي عفك", en: "Salim ibn Umayr's mission to kill Abu Afak", es: "La misión de Salim ibn Umayr de matar a Abu Afak", fr: "La mission de Salim ibn Umayr de tuer Abu Afak", ur: "سالم بن عمیر کا ابو افک کو قتل کرنے کا مشن" }
summary:
  ar: "يروي ابن إسحاق أن أبا عفك، أحد بني عمرو بن عوف ثم من بني عبيدة، «نجم نفاقه» حين قُتل الحارث بن سويد بن الصامت، فقال شعراً يذم فيه راكباً صدّع أولاد قيلة وفرّق جمعهم؛ فقال النبي: من لي بهذا الخبيث؟ فخرج سالم بن عمير أحد البكائين فقتله؛ وقالت أمامة المزيرية في ذلك بيتين."
  en: "Ibn Ishaq relates that Abu Afak, of Banu Amr ibn Awf and then of Banu Ubayda, showed his hypocrisy openly when al-Harith ibn Suwayd ibn al-Samit was killed, and composed verses reviling a rider who had split the sons of Qayla and broken their unity; the Prophet said: who will deal with this wretch for me? and Salim ibn Umayr, one of the Weepers, went out and killed him; Umama al-Muzayriyya spoke two verses on it."
  es: "Ibn Ishaq relata que Abu Afak, de Banu Amr ibn Awf y luego de Banu Ubayda, mostró abiertamente su hipocresía cuando al-Harith ibn Suwayd ibn al-Samit fue asesinado, y compuso versos insultando a un jinete que había dividido a los hijos de Qayla y roto su unidad; el Profeta dijo: ¿quién se ocupará de este miserable por mí? y Salim ibn Umayr, uno de los Llorones, salió y lo mató; Umama al-Muzayriyya pronunció dos versos al respecto."
  fr: "Ibn Ishaq rapporte qu'Abu Afak, des Banu Amr ibn Awf puis des Banu Ubayda, fit preuve d'hypocrisie au grand jour lorsque al-Harith ibn Suwayd ibn al-Samit fut tué, et composa des versets injurieux à l'encontre d'un cavalier qui avait divisé les fils de Qayla et brisé leur unité; le Prophète dit: Qui s'occupera de ce misérable pour moi ? et Salim ibn Umayr, l'un des Pleureurs, sortit et le tua; Umama al-Muzayriyya récita deux versets à ce sujet."
  ur: "ابن اسحاق بیان کرتے ہیں کہ بنو عمرو بن عوف اور پھر بنو عبیدہ کے ابو افک نے حارث بن سوید بن صامت کے قتل ہونے پر اپنی منافقت کو کھلم کھلا دکھایا اور ایک سوار کو گالی دینے والی آیات لکھیں جس نے قائلہ کے بیٹوں کو تقسیم کر دیا تھا اور ان کا اتحاد توڑ دیا تھا۔ آپ نے فرمایا: میرے لیے اس بدبخت کا کون مقابلہ کرے گا؟ اور سالم بن عمیر، رونے والوں میں سے ایک، باہر نکلا اور اسے قتل کر دیا۔ امہات المزائریہ نے اس پر دو آیتیں کہیں۔"
