label: { ar: "قتل الباطنية بواسط", en: "The Killing of the Batiniyya in Wasit" }
summary:
  ar: "في رمضان من هذه السنة قتل الباطنية بواسط، وسببه أنه وردها رجل يعرف بالركم محمد بن طالب بن عصية أصله من القاروب من قرى واسط وكان باطنياً فنزل مجاوراً لدور بني الهروي فغشيه الناس وكثر أتباعه وكان ممن يغشاه رجل يعرف بحسن الصابوني، فاتفق أنه اجتاز بالسويقة فكلمه رجل نجار في مذهبهم فرد عليه الصابوني رداً غليظاً فقام إليه النجار وقتله، فتسامع الناس ووثبوا وقتلوا من وجدوا ممن ينتسب إلى المذهب وقصدوا دار ابن عصية وقد اجتمع إليه أصحابه وأغلقوا الباب وصعدوا السطح فصعد الناس إليهم من الدور المجاورة وكسروا الممارق فقتلوا من وجدوا في الدار وأحرقوها وقتل ابن عصية، فبلغ الخبر بغداد فانحدر فخر الدين أبو البدر بن أمسينا الواسطي لإصلاح الحال وتسكين الفتنة {cite:kamil-ibn-al-athir p. 293}."
  en: "In Ramadan of this year the Batiniyya were killed in Wasit. The cause was that a man known as al-Rakm, Muhammad ibn Talib ibn Asiya, originally from al-Qarub, a village of Wasit, and a Batini, came to the city and settled beside the houses of the Banu al-Harawi. People flocked to him and his following grew. Among those who frequented him was a man known as Hasan al-Sabuni. It happened that he passed through al-Suwayqa, where a carpenter spoke to him about their doctrine; al-Sabuni answered him roughly, and the carpenter rose and killed him. When the people heard of it they rose up and killed whoever they found who claimed that doctrine. They made for the house of Ibn Asiya, where his companions had gathered; they had closed the door and climbed onto the roof. The people climbed up to them from the neighboring houses, broke open the mamariq, killed whoever they found in the house, burned it, and killed Ibn Asiya. When the news reached Baghdad, Fakhr al-Din Abu al-Badr ibn Amsina al-Wasiti went down to put matters right and calm the strife. {cite:kamil-ibn-al-athir p. 293}"
