label: { ar: "قتل الباطنية بواسط", en: "The Killing of the Batiniyya in Wasit", es: "La matanza de los Batiniyya en Wasit", fr: "Le massacre des Batiniyya à Wasit" }
summary:
  ar: "في رمضان من هذه السنة قتل الباطنية بواسط، وسببه أنه وردها رجل يعرف بالركم محمد بن طالب بن عصية أصله من القاروب من قرى واسط وكان باطنياً فنزل مجاوراً لدور بني الهروي فغشيه الناس وكثر أتباعه وكان ممن يغشاه رجل يعرف بحسن الصابوني، فاتفق أنه اجتاز بالسويقة فكلمه رجل نجار في مذهبهم فرد عليه الصابوني رداً غليظاً فقام إليه النجار وقتله، فتسامع الناس ووثبوا وقتلوا من وجدوا ممن ينتسب إلى المذهب وقصدوا دار ابن عصية وقد اجتمع إليه أصحابه وأغلقوا الباب وصعدوا السطح فصعد الناس إليهم من الدور المجاورة وكسروا الممارق فقتلوا من وجدوا في الدار وأحرقوها وقتل ابن عصية، فبلغ الخبر بغداد فانحدر فخر الدين أبو البدر بن أمسينا الواسطي لإصلاح الحال وتسكين الفتنة {cite:kamil-ibn-al-athir p. 293}."
  en: "In Ramadan of this year the Batiniyya were killed in Wasit. The cause was that a man known as al-Rakm, Muhammad ibn Talib ibn Asiya, originally from al-Qarub, a village of Wasit, and a Batini, came to the city and settled beside the houses of the Banu al-Harawi. People flocked to him and his following grew. Among those who frequented him was a man known as Hasan al-Sabuni. It happened that he passed through al-Suwayqa, where a carpenter spoke to him about their doctrine; al-Sabuni answered him roughly, and the carpenter rose and killed him. When the people heard of it they rose up and killed whoever they found who claimed that doctrine. They made for the house of Ibn Asiya, where his companions had gathered; they had closed the door and climbed onto the roof. The people climbed up to them from the neighboring houses, broke open the mamariq, killed whoever they found in the house, burned it, and killed Ibn Asiya. When the news reached Baghdad, Fakhr al-Din Abu al-Badr ibn Amsina al-Wasiti went down to put matters right and calm the strife. {cite:kamil-ibn-al-athir p. 293}"
  es: "En Ramadán de este año, los Batiniyya fueron asesinados en Wasit. La causa fue que un hombre conocido como al-Rakm, Muhammad ibn Talib ibn Asiya, originario de al-Qarub, una aldea de Wasit, y perteneciente a la comunidad Batini, llegó a la ciudad y se estableció junto a las casas de los Banu al-Harawi. La gente acudió a él y su número de seguidores creció. Entre quienes lo frecuentaban se encontraba un hombre conocido como Hasan al-Sabuni. Sucedió que pasó por al-Suwayqa, donde un carpintero le habló sobre su doctrina; al-Sabuni le respondió bruscamente, y el carpintero se levantó y lo mató. Cuando la gente se enteró, se sublevó y mató a cualquiera que encontrara que profesara esa doctrina. Se dirigieron a la casa de Ibn Asiya, donde se habían reunido sus compañeros; habían cerrado la puerta y subido al tejado. La gente subió desde las casas vecinas, forzó el mamariq, mató a quienes encontraron dentro, incendió la casa y asesinó a Ibn Asiya. Cuando la noticia llegó a Bagdad, Fakhr al-Din Abu al-Badr ibn Amsina al-Wasiti bajó para arreglar las cosas y calmar la contienda. {cite:kamil-ibn-al-athir p. 293}"
  fr: "Durant le Ramadan de cette année, les Batiniyya furent massacrés à Wasit. La cause de ce massacre fut l'arrivée en ville d'un homme nommé al-Rakm, Muhammad ibn Talib ibn Asiya, originaire d'al-Qarub, un village de Wasit, et membre de la communauté Batiniyya. Il s'installa près des maisons des Banu al-Harawi et attira de nombreux fidèles. Parmi eux, un certain Hasan al-Sabuni. Un jour, passant par al-Suwayqa, il fut interpellé par un charpentier qui lui parla de leur doctrine. Al-Sabuni lui répondit avec brutalité, et le charpentier, furieux, le tua. Informés de la tragédie, les habitants se soulevèrent et massacrèrent tous ceux qui professaient cette doctrine. Ils se dirigèrent vers la maison d'Ibn Asiya, où ses compagnons s'étaient réunis. Ces derniers avaient fermé la porte et étaient montés sur le toit. Les habitants des maisons voisines les atteignirent, défoncèrent le mamariq, tuèrent tous ceux qu'ils trouvèrent à l'intérieur, incendièrent la maison et tuèrent Ibn Asiya. Lorsque la nouvelle parvint à Bagdad, Fakhr al-Din Abu al-Badr ibn Amsina al-Wasiti s'y rendit pour rétablir l'ordre et apaiser les tensions. {cite:kamil-ibn-al-athir p. 293}"
