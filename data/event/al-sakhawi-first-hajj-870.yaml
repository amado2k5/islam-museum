id: event/al-sakhawi-first-hajj-870
class: event
kind: other
label:
  ar: "حجة السخاوي الأولى بحراً مع أمه وعياله، ٨٧٠هـ/١٤٦٦م"
  en: "Al-Sakhawi's first pilgrimage by sea with his mother and family, 870/1466"
  ur: "سخاوی کا پہلا حج دریا کے راستے والدہ اور اہل و عیال کے ساتھ، 870ھ/1466ء"
  es: "La primera peregrinación de Al-Sakhawi por mar con su madre y su familia, 870/1466"
  fr: "Premier pèlerinage d'Al-Sakhawi par la mer avec sa mère et sa famille, 870/1466"
  tr: "El-Sakhawi'nin annesi ve ailesiyle birlikte deniz yoluyla yaptığı ilk hac yolculuğu, Hicri 870/Miladi 1466."
  id: "Haji pertama Al-Sakhawi melalui laut bersama ibu dan keluarganya, 870 H/1466 M"
summary:
  ar: "لم يحج السخاوي إلا بعد وفاة شيخه ابن حجر؛ فسافر لدمياط ثم توجه في البحر للحج وصحب والدته معه، فلقي بالطور والينبوع وجدة شيوخاً أخذ عنهم، ووصل مكة أوائل شعبان فأقام بها إلى أن حج سنة سبعين ⁦(٨٧٠هـ)⁩ هو وعياله وأكبر إخوته ووالداه، وقرأ بالمسجد الحرام وداخل الكعبة والحجر وعلى غار ثور وجبل حراء وبمنى ومسجد الخيف على أبي الفتح المراغي والتقي بن فهد وأبي السعادات بن ظهيرة وغيرهم فوق ثلاثين شيخاً، وقرأ في رجوعه بالمدينة تجاه الحجرة النبوية على البدر بن فرحون {cite:daw-lami-jil-1992 8/7-8, 14}. وهي أول حجاته كما في المعجم {cite:encyclopaedia-of-islam-2 vol. 8 p. 947}."
  en: "Al-Sakhawi made no pilgrimage until after Ibn Hajar's death: he sailed via Damietta with his mother, hearing scholars at al-Tur, Yanbu' and Jeddah, reached Mecca in early Sha'ban and stayed to perform the hajj of 870 (July-August 1466) with his parents, wife and eldest brothers. He read inside the Ka'ba, at the Hijr, on the caves of Thawr and Hira', at Mina and Masjid al-Khayf, before Abu al-Fath al-Maraghi, Taqi al-Din ibn Fahd, Abu al-Sa'adat ibn Zahira and over thirty other masters; on the return he read facing the Prophetic Chamber in Medina before al-Badr ibn Farhun {cite:daw-lami-jil-1992 8/7-8, 14}. It was his first pilgrimage {cite:encyclopaedia-of-islam-2 vol. 8 p. 947}."
  ur: "سخاوی نے ابن حجر کی وفات سے پہلے حج نہیں کیا: وہ والدہ کے ساتھ دمیاط سے دریا کے راستے گیا، طور، ینبع اور جدہ میں علما سے ملا، شعبان کے آغاز میں مکہ پہنچا اور وہیں رہ کر 870ھ ⁦(جولائی-اگست 1466ء)⁩ کا حج اپنے والدین، اہلیہ اور بڑے بھائیوں کے ساتھ کیا۔ اس نے کعبہ کے اندر، حجر اسماعیل، غارِ ثور اور غارِ حرا پر، منیٰ اور مسجد خیف میں ابوالفتح مراغی، تقی الدین ابن فہد، ابوالسعادات ابن ظہیرہ اور تیس سے زائد دیگر مشائخ پر کتابیں پڑھیں؛ واپسی پر مدینہ میں حجرہ نبوی کے سامنے بدر بن فرہون پر پڑھا {cite:daw-lami-jil-1992 8/7-8, 14}۔ یہ اس کا پہلا حج تھا {cite:encyclopaedia-of-islam-2 vol. 8 p. 947}۔"
  es: "Al-Sakhawi no realizó ninguna peregrinación hasta después de la muerte de Ibn Hajar: navegó vía Damietta con su madre, escuchando a eruditos en al-Tur, Yanbu' y Jeddah, llegó a La Meca a principios de Sha'ban y se quedó para realizar el Hajj de 870 (julio-agosto de 1466) con sus padres, esposa y hermanos mayores. Leyó dentro de la Kaaba, en el Hijr, en las cuevas de Thawr y Hira', en Mina y Masjid al-Khayf, ante Abu al-Fath al-Maraghi, Taqi al-Din ibn Fahd, Abu al-Sa'adat ibn Zahira y más de treinta maestros; a su regreso leyó frente a la Cámara Profética en Medina ante al-Badr ibn Farhun {cite:daw-lami-jil-1992 8/7-8, 14}. Fue su primera peregrinación {cite:encyclopaedia-of-islam-2 vol. 8 p. 947}."
  fr: "Al-Sakhawi n'effectua aucun pèlerinage avant la mort d'Ibn Hajar: il fit voile via Damiette avec sa mère, écoutant les enseignements des savants à al-Tur, Yanbu' et Djeddah, puis arriva à La Mecque au début du mois de Sha'ban et y séjourna pour accomplir le hajj de 870 (juillet-août 1466) avec ses parents, son épouse et ses frères aînés. Il lut à l'intérieur de la Kaaba, au Hijr, dans les grottes de Thawr et Hira', à Mina et à la mosquée al-Khayf, devant Abu al-Fath al-Maraghi, Taqi al-Din ibn Fahd, Abu al-Sa'adat ibn Zahira et plus de trente autres maîtres; au retour, il lut face à la Chambre du Prophète à Médine devant al-Badr ibn Farhun {cite:daw-lami-jil-1992 8/7-8, 14}. C'était son premier pèlerinage {cite:encyclopaedia-of-islam-2 vol. 8 p. 947}."
  tr: "El-Sakhawi, hocası İbn Hacer'in ölümünden sonra Hac ibadetini yerine getirdi. Dimyat'a gitti, ardından annesiyle birlikte deniz yoluyla hac yolculuğuna çıktı. Tur, Yanbu ve Cidde'de alimlerle tanıştı ve onlardan ilim öğrendi. Şaban ayının başında Mekke'ye vardı ve ailesi, en büyük ağabeyi ve anne babasıyla birlikte 870 Hicri (1470 Miladi) yılında Hac ibadetini yerine getirene kadar orada kaldı. Kur'an'ı Mescid-i Haram'da, Kâbe'nin içinde, Hicr'de (yarım daire duvarında), Sevr Mağarası'nda, Hira Dağı'nda, Mina'da ve Hayf Mescidi'nde, Ebu el-Feth el-Maraghi, el-Taki ibn Fahd, Ebu el-Sa'adat ibn Zahira ve otuzdan fazla alimin yanında okudu. Dönüş yolculuğunda ise Medine'de, Peygamber'in odasının yakınında, el-Bedr ibn Farhun'un yanında Kur'an okudu. İslam Ansiklopedisi'nin 2. cildinin 947. sayfasında belirtildiği üzere, bu onun ilk Hac yolculuğuydu."
  id: "Al-Sakhawi tidak melaksanakan ibadah haji hingga setelah wafatnya gurunya, Ibnu Hajar. Ia pergi ke Damietta, kemudian berangkat melalui laut untuk berziarah, membawa ibunya bersamanya. Ia bertemu dengan para ulama di Al-Tur, Al-Yanbu, dan Jeddah, dari merekalah ia belajar. Ia tiba di Mekah pada awal bulan Sya'ban dan tinggal di sana hingga ia melaksanakan ibadah haji pada tahun 870 H (1470 M) bersama keluarganya, kakak tertuanya, dan orang tuanya. Ia membaca Al-Quran di Masjidil Haram, di dalam Ka'bah, di Hijr (tembok setengah lingkaran), di Gua Thawr, Gunung Hira, di Mina, dan di Masjidil Haram, di bawah bimbingan Abu al-Fath al-Maraghi, al-Taqi ibn Fahd, Abu al-Sa'adat ibn Zahira, dan lebih dari tiga puluh ulama lainnya. Dalam perjalanan pulangnya, beliau membaca Al-Quran di Madinah, dekat kamar Nabi, di bawah bimbingan al-Badr ibn Farhun. Ini adalah ibadah haji pertamanya, sebagaimana disebutkan dalam Ensiklopedia Islam, jilid 2, hlm. 947."
