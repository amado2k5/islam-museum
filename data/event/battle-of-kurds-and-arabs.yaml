summary:
  ar: "في سنة إحدى وثمانين ومائتين ذكر الطبري الوقعة بين الأكراد والأعراب، وقد خرج المعتضد إلى الموصل في ذي القعدة، فجاء كتابه من معسكره بأن الجيش أوقع بالأكراد والأعراب، فقُتل منهم وغرق كثير في الزاب {cite:tabari-tarikh-abu-al-fadl j.10 p.37}."
  en: "In 281 AH al-Tabari recorded the clash between the Kurds and the Arabs. Al-Mu'tadid had gone out to Mosul in Dhu al-Qa'da, and a dispatch came from his camp reporting that the army had struck the Kurds and Arabs, killing many of them and drowning many in the Zab {cite:tabari-tarikh-abu-al-fadl j.10 p.37}."
