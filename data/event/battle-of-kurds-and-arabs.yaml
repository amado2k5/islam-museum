label: { ar: "الوقعة بين الأكراد والأعراب", en: "The Clash between Kurds and Arabs", fr: "L'affrontement entre Kurdes et Arabes", es: "El enfrentamiento entre kurdos y árabes", ur: "کردوں اور عربوں کے درمیان تصادم", tr: "Kürtler ve Araplar arasındaki savaş", id: "Pertempuran antara Kurdi dan Arab" }
summary:
  ar: "في سنة إحدى وثمانين ومائتين ذكر الطبري الوقعة بين الأكراد والأعراب، وقد خرج المعتضد إلى الموصل في ذي القعدة، فجاء كتابه من معسكره بأن الجيش أوقع بالأكراد والأعراب، فقُتل منهم وغرق كثير في الزاب {cite:tabari-tarikh-abu-al-fadl j.10 p.37}."
  en: "In 281 AH al-Tabari recorded the clash between the Kurds and the Arabs. Al-Mu'tadid had gone out to Mosul in Dhu al-Qa'da, and a dispatch came from his camp reporting that the army had struck the Kurds and Arabs, killing many of them and drowning many in the Zab {cite:tabari-tarikh-abu-al-fadl j.10 p.37}."
  fr: "En 281 H, al-Tabari consigna l'affrontement entre les Kurdes et les Arabes. Al-Mu'tadid était parti pour Mossoul en Dhu al-Qa'da, et une dépêche vint de son camp annonçant que l'armée avait frappé les Kurdes et les Arabes, en tuant beaucoup et en noyant beaucoup dans le Zab {cite:tabari-tarikh-abu-al-fadl j.10 p.37}."
  es: "En el año 281 de la Hégira, al-Tabari registró el enfrentamiento entre los kurdos y los árabes. Al-Mu'tadid había salido hacia Mosul en Dhu al-Qa'da, y llegó un despacho desde su campamento informando que el ejército había atacado a los kurdos y árabes, matando a muchos de ellos y ahogando a otros tantos en el Zab {cite:tabari-tarikh-abu-al-fadl j.10 p.37}."
  ur: "281ھ میں الطبری نے کردوں اور عربوں کے درمیان تصادم کو درج کیا ہے۔ المتعد ذوالقعدہ میں موصل کے لیے نکلا تھا، اور اس کے کیمپ سے ایک روانہ آیا جس میں بتایا گیا کہ فوج نے کردوں اور عربوں پر حملہ کیا ہے، ان میں سے بہت سے لوگوں کو ہلاک کر دیا ہے اور بہت سے لوگوں کو زاب میں غرق کر دیا ہے۔"
  tr: "Hicri 281 yılında Taberi, Kürtler ile Araplar arasındaki savaştan bahsetmiştir. Mu'tedid, Zülkade'de Musul'a gitmiş ve kampından gelen mektupta, ordunun Kürtlere ve Araplara saldırdığı, birçoğunun öldürüldüğü ve birçoğunun da Zeb Nehri'nde boğulduğu belirtilmiştir. {cite:tabari-tarikh-abu-al-fadl j.10 p.37}"
  id: "Pada tahun 281 H, al-Tabari menyebutkan pertempuran antara Kurdi dan Arab. Al-Mu’tadid pergi ke Mosul pada bulan Dzul Qa’dah, dan surat datang dari perkemahannya yang menyatakan bahwa pasukan telah menyerang Kurdi dan Arab, sehingga banyak dari mereka terbunuh dan banyak yang tenggelam di Sungai Zab. {cite:tabari-tarikh-abu-al-fadl j.10 p.37}."
