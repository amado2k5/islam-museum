label:
  ar: الهادي والوقعة في الوادي الوعر ضد «المحدثين» وثباته راجلاً، 286هـ
  en: Al-Hadi and the fight in the rough wadi against the "troublemakers" and his stand on foot, 286 AH
  ur: ہادی اور دشوار وادی میں «فساد برپا کرنے والوں» سے معرکہ اور ان کا پیدل ڈٹ جانا، 286ھ
summary:
  ar: يذهب الهادي لهدم منازل «المحدثين»، فيُنقض القوم ما حلفوا عليه، وفي وادٍ وعر لا تعمل فيه الخيل تنهزم خيله إلا ثلاثة من عبيده فيحمل وحده ثم ينزل عن فرسه فيقاتل راجلاً، فتتشجع ميسرته وتحمل فتدخل القوم حصنهم؛ والراوي يعدّ ثباته من دلائل الإمام.
  en: Al-Hadi goes to pull down the houses of the "troublemakers" and the people break the oaths they had sworn; in a rough wadi unfit for cavalry his horsemen flee, all but three of his slaves, and he charges alone, then dismounts and fights on foot until his left wing, heartened, charges and drives the enemy into their fortress; the narrator counts his stand among the imam's signs.
  ur: ہادی «فساد برپا کرنے والوں» کے گھر گرانے جاتے ہیں اور قوم اپنی قسمیں توڑ دیتی ہے؛ ایک دشوار وادی میں، جہاں گھڑ سوار کام نہیں کرتے، ان کے سوار بھاگ جاتے ہیں سوائے تین غلاموں کے، وہ اکیلے حملہ کرتے ہیں پھر گھوڑے سے اتر کر پیدل لڑتے ہیں یہاں تک کہ ان کا بایاں بازو حوصلہ پا کر حملہ کرتا اور دشمن کو قلعے میں دھکیل دیتا ہے؛ راوی اس ثابت قدمی کو امام کی نشانیوں میں شمار کرتا ہے۔
