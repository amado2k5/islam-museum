id: event/al-hadi-and-the-wadi-fight-against-the-muhdithin-286
class: event
kind: other
label:
  ar: الهادي والوقعة في الوادي الوعر ضد «المحدثين» وثباته راجلاً، 286هـ
  en: Al-Hadi and the fight in the rough wadi against the "troublemakers" and his stand on foot, 286 AH
  ur: ہادی اور دشوار وادی میں «فساد برپا کرنے والوں» سے معرکہ اور ان کا پیدل ڈٹ جانا، 286ھ
  es: "Al-Hadi y la lucha en el escarpado valle contra los \"alborotadores\" y su resistencia a pie, 286 AH"
  fr: "Al-Hadi et le combat dans le wadi accidenté contre les fauteurs de troubles et sa résistance à pied, 286 AH"
  tr: "El-Hadi ve \"modernistlere\" karşı engebeli vadideki mücadelesi ve yaya olarak gösterdiği metanet, Hicri 286"
  id: "Al-Hadi dan pertempuran di lembah terjal melawan \"modernis\" dan keteguhannya dalam berjalan kaki, 286 H"
summary:
  ar: يذهب الهادي لهدم منازل «المحدثين»، فيُنقض القوم ما حلفوا عليه، وفي وادٍ وعر لا تعمل فيه الخيل تنهزم خيله إلا ثلاثة من عبيده فيحمل وحده ثم ينزل عن فرسه فيقاتل راجلاً، فتتشجع ميسرته وتحمل فتدخل القوم حصنهم؛ والراوي يعدّ ثباته من دلائل الإمام.
  en: Al-Hadi goes to pull down the houses of the "troublemakers" and the people break the oaths they had sworn; in a rough wadi unfit for cavalry his horsemen flee, all but three of his slaves, and he charges alone, then dismounts and fights on foot until his left wing, heartened, charges and drives the enemy into their fortress; the narrator counts his stand among the imam's signs.
  ur: ہادی «فساد برپا کرنے والوں» کے گھر گرانے جاتے ہیں اور قوم اپنی قسمیں توڑ دیتی ہے؛ ایک دشوار وادی میں، جہاں گھڑ سوار کام نہیں کرتے، ان کے سوار بھاگ جاتے ہیں سوائے تین غلاموں کے، وہ اکیلے حملہ کرتے ہیں پھر گھوڑے سے اتر کر پیدل لڑتے ہیں یہاں تک کہ ان کا بایاں بازو حوصلہ پا کر حملہ کرتا اور دشمن کو قلعے میں دھکیل دیتا ہے؛ راوی اس ثابت قدمی کو امام کی نشانیوں میں شمار کرتا ہے۔
  es: "Al-Hadi va a derribar las casas de los \"alborotadores\" y la gente rompe los juramentos que habían prestado; en un páramo accidentado, impracticable para la caballería, sus jinetes huyen, todos menos tres de sus esclavos, y él carga solo, luego desmonta y lucha a pie hasta que su flanco izquierdo, envalentonado, carga y hace retroceder al enemigo hasta su fortaleza; el narrador considera su resistencia como una de las señales del imán."
  fr: "Al-Hadi part démolir les maisons des « fauteurs de troubles », et le peuple rompt les serments qu'il avait prêtés; dans un oued accidenté, impraticable pour la cavalerie, ses cavaliers fuient, ainsi que tous ses esclaves sauf trois, et il charge seul, puis descend de cheval et combat à pied jusqu'à ce que son aile gauche, galvanisée, charge et repousse l'ennemi dans sa forteresse; le narrateur compte sa résistance parmi les signes de l'imam."
  tr: "El-Hadi, “modernistlerin” evlerini yıkmaya gider, ancak halk yeminlerini bozar. Atların çalışamadığı engebeli bir vadide, üç kölesi dışında atları yenilir. Saldırıyı tek başına gerçekleştirir, sonra atından iner ve yaya olarak savaşır. Sol kanadı cesaretlenir ve saldırıyı gerçekleştirir, halk da kalelerine girer. Anlatıcı, onun bu azmini İmam'ın alametlerinden biri olarak değerlendirir."
  id: "Al-Hadi pergi untuk menghancurkan rumah-rumah kaum \"modernis,\" tetapi orang-orang mengingkari sumpah mereka. Di lembah terjal tempat kuda tidak dapat bekerja, kuda-kudanya dikalahkan kecuali tiga budaknya. Dia melakukan serangan sendirian, kemudian turun dari kudanya dan bertempur dengan berjalan kaki. Sayap kirinya mendapat semangat dan melakukan serangan, dan orang-orang memasuki benteng mereka. Perawi menganggap keteguhan hatinya sebagai salah satu tanda Imam."
