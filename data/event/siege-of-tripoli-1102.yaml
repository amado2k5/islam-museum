summary:
  ar: "بطاقة أولية لحصار طرابلس من ١١٠٢ إلى ١١٠٩م، حصار ريموند الرابع للمدينة حتى سقوطها بيد الفرنج؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Siege of Tripoli of 1102–1109, Raymond IV's blockade that ended with the city's fall to the Crusaders; its sources are not yet checked on the page."
  es: "Boceto de ficha para el asedio de Trípoli de 1102-1109, el bloqueo de Raimundo IV que terminó con la caída de la ciudad en manos de los cruzados; sus fuentes aún no han sido verificadas en la página."
  fr: "Fiche de projet pour le siège de Tripoli de 1102-1109, le blocus de Raymond IV qui s'est terminé par la chute de la ville aux mains des Croisés; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1102–1109 کے طرابلس کے محاصرے کے لیے ڈرافٹ کارڈ، ریمنڈ چہارم کی ناکہ بندی جو صلیبیوں کے شہر کے زوال کے ساتھ ختم ہوئی۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Trablus'un 1102-1109 yılları arasındaki kuşatmasına dair ön bilgiler; Raymond IV'ün şehri kuşatması ve Frankların eline geçmesi anlatılmaktadır; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang pengepungan Tripoli dari tahun 1102 hingga 1109 M, pengepungan kota oleh Raymond IV hingga jatuhnya ke tangan bangsa Frank; sumber-sumber di halaman ini belum ditinjau."
