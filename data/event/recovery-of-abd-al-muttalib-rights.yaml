id: event/recovery-of-abd-al-muttalib-rights
class: event
kind: other
label: { ar: "استرداد عبد المطلب أركاحه ⁦(ساحاته)⁩", en: "The Recovery of ʿAbd al-Muṭṭalib’s Rights", es: "La recuperación de los derechos de ʿAbd al-Muṭṭalib", fr: "Le rétablissement des droits d'ʿAbd al-Muṭṭalib", ur: "عبدالمطلب کے حقوق کی بازیابی", tr: "Abdülmuttalib arkaahını (avlularını) geri aldı.", id: "Abdul Muthalib mendapatkan kembali arkaahnya (halaman)." }
summary: { ar: "وثب نوفل بن عبد مناف على أركاح عبد المطلب فغصبه إياها؛ أبى شيوخ قريش الدخول بين ابني الأخ، فاستنجد بأخواله بني النجار فجاء خاله أبو سعد بن عدي في ثمانين راكباً وسلّ سيفه بالحجر حتى رُدّت، وحالفت خزاعة بني هاشم على بني عبد شمس ونوفل.", en: "Nawfal’s seizure of ʿAbd al-Muṭṭalib’s offices; Quraysh declined to arbitrate, his Najjārī uncles marched in eighty riders, and Khuzāʿa entered the pact on Banū Hāshim’s side.", es: "La toma de los cargos de ʿAbd al-Muṭṭalib por parte de Nawfal; Quraysh se negó a arbitrar, sus tíos Najjārī marcharon con ochenta jinetes, y Khuzāʿa se unió al pacto del lado de Banū Hāshim.", fr: "La prise des bureaux d'ʿAbd al-Muṭṭalib par Nawfal; Quraysh refusa d'arbitrer, ses oncles Najjārī marchèrent avec quatre-vingts cavaliers, et Khuzāʿa entra dans le pacte du côté de Banū Hāshim.", ur: "نوفل میں عبدالمطلب کے دفاتر پر قبضہ؛ قریش نے ثالثی سے انکار کر دیا، اس کے نجاری چچا اسّی سواروں کے ساتھ روانہ ہوئے، اور خزاعہ نے بنو ہاشم کی طرف سے معاہدہ کیا۔", tr: "Nawfal ibn Abd Manaf, Abd al-Muttalib'in dizlerine atlayıp dizlerini ondan aldı. Kureyş'in ileri gelenleri iki yeğen arasına girmeyi reddetti, bu yüzden annesinin amcaları olan Beni al-Najjar'dan yardım istedi. Annesinin amcası Ebu Sa'd ibn Adi, seksen süvariyle geldi ve kılıcını al-Hijr'e doğru çekti, ta ki geri verilene kadar. Huze'ah, Beni Abd Shams ve Nawfal'a karşı Beni Haşim ile ittifak kurdu.", id: "Nawfal bin Abd Manaf melompat ke pangkuan Abd al-Muttalib dan merebutnya darinya. Para tetua Quraisy menolak untuk menengahi perselisihan antara kedua keponakan itu, sehingga ia meminta bantuan dari paman-paman dari pihak ibunya, Banu al-Najjar. Paman dari pihak ibunya, Abu Sa’d bin Adi, datang dengan delapan puluh penunggang kuda dan menghunus pedangnya ke arah al-Hijr hingga pedangnya dikembalikan. Khuza’ah bersekutu dengan Banu Hashim melawan Banu Abd Shams dan Nawfal." }
