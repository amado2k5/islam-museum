label: { ar: "وقعة عين جالوت وهزيمة التتار", en: "The battle of Ayn Jalut and the defeat of the Tatars", fr: "La bataille de Ayn Jalut et la défaite des Tatars", es: "La batalla de Ayn Jalut y la derrota de los tártaros", ur: "عین جالوت کی جنگ اور تاتاریوں کی شکست", tr: "Ayn Calut Muharebesi ve Tatarların yenilgisi", id: "Pertempuran Ain Jalut dan kekalahan bangsa Tatar" }
summary:
  ar: "عين جالوت نبع في جند فلسطين بين بيسان ونابلس، وتعرف دائرة المعارف الإسلامية بها موضعاً للمعركة الشهيرة التي هُزم فيها جيش مغولي أمام جيش المماليك يوم الجمعة 25 رمضان 658هـ الموافق 3 سبتمبر 1260م. ويرى المؤرخون العرب، وبخاصة المصريون، أنها نصر حاسم أنقذ الشام ومصر من الخطر المغولي، بينما تعرضها المصادر المتعاطفة مع المغول صداماً غير حاسم. وتقول دائرة المعارف إن قائد المغول كتبغا أُسر وقُتل، وإن هولاكو شُغل عن الثأر بالصراع داخل الإمبراطورية المغولية، وإن المعركة كانت أعلى نقطة بلغها المد المغولي."
  en: "Ayn Jalut was a spring in the military district of Filastin between Baysan and Nablus, known chiefly as the site of the famous battle of Friday 25 Ramadan 658, 3 September 1260, in which a Mongol army was defeated by the Mamluks, according to the Encyclopaedia of Islam. Arab and especially Egyptian chroniclers see a decisive victory that saved Syria and Egypt from the Mongols, while sources sympathetic to the Mongols present an inconclusive clash. The article says the Mongol general Kitbuga was captured and put to death, that Hulegu was kept from avenging the defeat by the struggle inside the Mongol empire, and that Ayn Jalut was the high water mark of the Mongol advance."
  ur: "عین جالوت جند فلسطین میں بیسان اور نابلس کے درمیان ایک چشمہ تھا، اور دائرۃ المعارف اسلامیہ کے مطابق یہ خاص طور پر جمعہ 25 رمضان 658ھ، 3 ستمبر 1260ء کے مشہور معرکے کی جگہ کے طور پر جانا جاتا ہے جس میں ایک مغل فوج مملوکوں سے ہاری۔ عرب اور خصوصاً مصری مؤرخین اسے فیصلہ کن فتح سمجھتے ہیں جس نے شام اور مصر کو مغلوں سے بچایا، جبکہ مغلوں سے ہمدردی رکھنے والے ماخذ اسے غیر فیصلہ کن ٹکراؤ بتاتے ہیں۔ مضمون کے مطابق مغل سالار کتبغا گرفتار ہو کر مارا گیا، ہلاکو کو مغل سلطنت کی اندرونی کشمکش نے انتقام سے روکا، اور عین جالوت مغل پیش قدمی کی بلند ترین حد تھی."
  fr: "Ayn Jalut était une source du district militaire de Filastin, entre Baysan et Naplouse, connue surtout comme le lieu de la célèbre bataille du vendredi 25 Ramadan 658, 3 septembre 1260, où une armée mongole fut vaincue par les Mamelouks, selon l'Encyclopaedia of Islam. Les chroniqueurs arabes, et surtout égyptiens, y voient une victoire décisive qui sauva la Syrie et l'Égypte des Mongols, tandis que les sources favorables aux Mongols présentent un affrontement indécis. L'article dit que le général mongol Kitbuga fut capturé et mis à mort, que Hülegü fut empêché de venger la défaite par la lutte au sein de l'empire mongol, et que Ayn Jalut marqua le point culminant de l'avancée mongole."
  es: "Ayn Jalut era un manantial en el distrito militar de Filastin, entre Baysan y Nablus, conocido principalmente por ser el lugar de la famosa batalla del viernes 25 de Ramadán de 658 (3 de septiembre de 1260), en la que un ejército mongol fue derrotado por los mamelucos, según la Enciclopedia del Islam. Los cronistas árabes, y especialmente los egipcios, ven en ella una victoria decisiva que salvó a Siria y Egipto de los mongoles, mientras que las fuentes afines a los mongoles presentan un enfrentamiento inconcluso. El artículo afirma que el general mongol Kitbuga fue capturado y ejecutado, que Hulagu no pudo vengar la derrota debido a la lucha interna en el imperio mongol, y que Ayn Jalut representó el punto culminante del avance mongol."
  tr: "Ain Calut, Beisan ve Nablus arasında, Cund Filastin'de (Filistin'in askeri bölgesi) bulunan bir pınardır. İslam Ansiklopedisi, burayı, Hicri 658 yılının Ramazan ayının 25'inde (Miladi 3 Eylül 1260) Moğol ordusunun Memlük ordusu tarafından yenilgiye uğratıldığı ünlü savaşın yeri olarak tanımlar. Arap tarihçiler, özellikle Mısırlılar, bu savaşı Suriye ve Mısır'ı Moğol tehdidinden kurtaran kesin bir zafer olarak görürken, Moğollara sempati duyan kaynaklar ise sonuçsuz bir çatışma olarak tasvir eder. Ansiklopedi, Moğol komutanı Kitbuka'nın yakalanıp öldürüldüğünü, Hulagu'nun Moğol İmparatorluğu içindeki iç çatışmalarla meşgul olduğu için intikam alamadığını ve savaşın Moğol ilerleyişinin zirvesini işaret ettiğini belirtir."
  id: "Ain Jalut adalah sebuah mata air di Jund Filastin (distrik militer Palestina) antara Beisan dan Nablus. Ensiklopedia Islam mengidentifikasinya sebagai lokasi pertempuran terkenal di mana pasukan Mongol dikalahkan oleh pasukan Mamluk pada hari Jumat, tanggal 25 Ramadan 658 H (3 September 1260 M). Sejarawan Arab, khususnya Mesir, menganggapnya sebagai kemenangan penting yang menyelamatkan Suriah dan Mesir dari ancaman Mongol, sementara sumber-sumber yang bersimpati kepada Mongol menggambarkannya sebagai bentrokan yang tidak menghasilkan kemenangan mutlak. Ensiklopedia menyatakan bahwa komandan Mongol, Kitbuqa, ditangkap dan dibunuh, bahwa Hulagu sibuk dengan konflik internal di dalam Kekaisaran Mongol dan karenanya tidak dapat membalas dendam, dan bahwa pertempuran tersebut menandai puncak kemajuan Mongol."
