id: event/ayn-jalut-658
education:
  did_you_know:
    ar: "سنة ثمان وخمسين وستمائة قطع التتار الفرات إلى حلب ودمشق، وخرج المصريون في شعبان لقتالهم فأقبل المظفر قطز بالجيش والتقوا بعين جالوت."
    en: "In 658 AH the Tatars crossed the Euphrates to Aleppo and Damascus; the Egyptians marched in Sha'ban to fight them — al-Muzaffar Qutuz advancing with the army, and the meeting was at Ayn Jalut."
    ur: "658ھ میں تاتار دریائے فرات پار کرکے حلب اور دمشق پہنچے؛ مصری شعبان میں ان سے لڑنے نکلے — مظفر قطز لشکر لے کر آگے بڑھا اور عین جالوت میں مڑبڑ ہوئی۔"
    sources: [source/tabari-tarikh-abu-al-fadl, source/dawlat-uthmaniyya-salabi]
class: event
kind: battle
label: { ar: "وقعة عين جالوت وهزيمة التتار", en: "The battle of Ayn Jalut and the defeat of the Tatars" }
summary:
  ar: "وفي سنة ثمان وخمسين قطع التتار الفرات ووصلوا إلى حلب وبذلوا السيف فيها ثم وصلوا إلى دمشق وخرج المصريون في شعبان متوجهين إلى الشام لقتال التتار فأقبل المظفر بالجيوش وشاليشه ركن الدين بيبرس البندقداري فالتقوا هم والتتار عند عين جالوت ووقع المصاف وذلك يوم الجمعة خامس عشري رمضان فهزم التتار شر هزيمة وانتصر المسلمون ولله الحمد وقتل من التتار مقتلة عظيمة وولوا الأدبار وطمع الناس فيهم يتخطفونهم وجاء كتاب المظفر إلى دمشق بالنصر فطار الناس فرحاً ثم دخل المظفر إلى دمشق مؤيداً منصوراً وأحبه الخلق غاية المحبة وساق بيبرس وراء التتار إلى بلاد حلب وطردهم عن البلاد ووعده السلطان بحلب ثم رجع عن ذلك فتأثر بيبرس من ذلك وكان ذلك مبدأ الوحشة {cite:tarikh-khulafa-minhaj-1434 p. 720}. وفي شذرات الذهب وثارت النصارى بدمشق ورفعوا رؤوسهم ورفعوا الصليب ومروا به وألزموا الناس بالقيام له من حوانيتهم في الثاني والعشرين من رمضان ووصل جيش الإسلام وعليهم الملك المظفر وعلى مقدمته ركن الدين البندقداري فالتقى الجمعان على عين جالوت غربي بيسان ونصر الله دينه وقتل في المصاف مقدم التتار كتبغا وطائفة من أمراء المغول ووقع بدمشق النهب والقتل في النصارى وأحرقت كنيسة مريم {cite:shadharat-dhahab p. 299}."
  en: "In 658 the Tatars crossed the Euphrates, put Aleppo to the sword and reached Damascus; the Egyptians marched that Sha'ban, al-Muzaffar leading with Rukn al-Din Baybars al-Bunduqdari his shalish — they met the Tatars at Ayn Jalut on Friday 15 Ramadan and routed them utterly, the first great breaking of their tide. The rejoicing flew to Damascus; Baybars drove them beyond Aleppo — promised the city, then refused it — the germ of their falling-out {cite:tarikh-khulafa-minhaj-1434 p. 720}."
