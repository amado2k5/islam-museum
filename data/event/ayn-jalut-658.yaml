id: event/ayn-jalut-658
education:
  did_you_know:
    ar: "سنة ثمان وخمسين وستمائة قطع التتار الفرات إلى حلب ودمشق، وخرج المصريون في شعبان لقتالهم فأقبل المظفر قطز بالجيش والتقوا بعين جالوت."
    en: "In 658 AH the Tatars crossed the Euphrates to Aleppo and Damascus; the Egyptians marched in Sha'ban to fight them — al-Muzaffar Qutuz advancing with the army, and the meeting was at Ayn Jalut."
    ur: "658ھ میں تاتار دریائے فرات پار کرکے حلب اور دمشق پہنچے؛ مصری شعبان میں ان سے لڑنے نکلے — مظفر قطز لشکر لے کر آگے بڑھا اور عین جالوت میں مڑبڑ ہوئی۔"
    sources: [source/tabari-tarikh-abu-al-fadl, source/dawlat-uthmaniyya-salabi]
class: event
kind: battle
label: { ar: "وقعة عين جالوت وهزيمة التتار", en: "The battle of Ayn Jalut and the defeat of the Tatars" }
summary:
  ar: "عين جالوت نبع في جند فلسطين بين بيسان ونابلس، وتعرف دائرة المعارف الإسلامية بها موضعاً للمعركة الشهيرة التي هُزم فيها جيش مغولي أمام جيش المماليك يوم الجمعة 25 رمضان 658هـ الموافق 3 سبتمبر 1260م. ويرى المؤرخون العرب، وبخاصة المصريون، أنها نصر حاسم أنقذ الشام ومصر من الخطر المغولي، بينما تعرضها المصادر المتعاطفة مع المغول صداماً غير حاسم. وتقول دائرة المعارف إن قائد المغول كتبغا أُسر وقُتل، وإن هولاكو شُغل عن الثأر بالصراع داخل الإمبراطورية المغولية، وإن المعركة كانت أعلى نقطة بلغها المد المغولي."
  en: "Ayn Jalut was a spring in the military district of Filastin between Baysan and Nablus, known chiefly as the site of the famous battle of Friday 25 Ramadan 658, 3 September 1260, in which a Mongol army was defeated by the Mamluks, according to the Encyclopaedia of Islam. Arab and especially Egyptian chroniclers see a decisive victory that saved Syria and Egypt from the Mongols, while sources sympathetic to the Mongols present an inconclusive clash. The article says the Mongol general Kitbuga was captured and put to death, that Hulegu was kept from avenging the defeat by the struggle inside the Mongol empire, and that Ayn Jalut was the high water mark of the Mongol advance."
  ur: "عین جالوت جند فلسطین میں بیسان اور نابلس کے درمیان ایک چشمہ تھا، اور دائرۃ المعارف اسلامیہ کے مطابق یہ خاص طور پر جمعہ 25 رمضان 658ھ، 3 ستمبر 1260ء کے مشہور معرکے کی جگہ کے طور پر جانا جاتا ہے جس میں ایک مغل فوج مملوکوں سے ہاری۔ عرب اور خصوصاً مصری مؤرخین اسے فیصلہ کن فتح سمجھتے ہیں جس نے شام اور مصر کو مغلوں سے بچایا، جبکہ مغلوں سے ہمدردی رکھنے والے ماخذ اسے غیر فیصلہ کن ٹکراؤ بتاتے ہیں۔ مضمون کے مطابق مغل سالار کتبغا گرفتار ہو کر مارا گیا، ہلاکو کو مغل سلطنت کی اندرونی کشمکش نے انتقام سے روکا، اور عین جالوت مغل پیش قدمی کی بلند ترین حد تھی."
