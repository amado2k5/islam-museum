summary:
  ar: "كان زهير بن جناب الكلبي أحد من اجتمعت عليه قضاعة، يدعى الكاهن لصحة رأيه، عاش مائتين وخمسين سنة وقيل أربعمائة وخمسين أوقع فيها مائتي وقعة. غزا غطفان لما بنى بنو بغيض حرمًا على غرار حرم مكة فقاتلهم وعطل الحرم وقتل فارسًا فيه ثم منّ عليهم ورد النساء. وحارب بكرًا وتغلب وقد وليهما أبرهة يجبي خراجه، فطعنه ابن زيابة التيمي وهو نائم طعنة خرجت من ظهره فكظم وأومأ إلى أصحابه فأظهروا موته واستأذنوا في دفنه فدفنوا ثيابًا ملفوفة، ثم جمع الجموع وغزاهم فانهزمت بكر ثم تغلب وأُسر كليب ومهلهل ابنا ربيعة وكثرت القتلى والأسرى في فرسانهم ووجوههم. وغزا بني القين بن جسر لما بلغه من أخته بصرة فيها رمل وصرة فيها قتاد أن عدوًا كثيرًا ذا شوكة يأتيهم {cite:kamil-ibn-al-athir p. 378-380}."
  en: "Zuhayr ibn Janāb al-Kalbī — called «the soothsayer» for his judgment, said to have lived 250 years (some say 450) and fought two hundred battles — was one of the few all Quḍāʿa obeyed. When Banū Baghīḍ built a ḥaram on Mecca's model he destroyed it and killed a horseman inside it, then freed the captives and returned the women. Taxing Bakr and Taghlib for Abraha, he was stabbed through in his sleep by Ibn Ziyāba al-Tamīmī; he lay still, had his men fake his funeral with a corpse of folded clothes, then mustered and routed both tribes — Kulayb and al-Muhalhil, the two sons of Rabīʿa, were taken prisoner and their knights slaughtered. His sister's gifts of a bag of sand and a bag of thorns warned him of Banū'l-Qayn's coming {cite:kamil-ibn-al-athir p. 378-380}."
  es: "Zuhayr ibn Janāb al-Kalbī —llamado «el adivino» por su juicio, se dice que vivió 250 años (algunos dicen 450) y libró doscientas batallas— fue uno de los pocos a quienes todos los Quḍāʿa obedecieron. Cuando Banū Baghīḍ construyó un ḥaram según el modelo de La Meca, lo destruyó y mató a un jinete que se encontraba dentro, luego liberó a los cautivos y devolvió a las mujeres. Al recaudar impuestos para Bakr y Taghlib en nombre de Abraha, fue apuñalado mientras dormía por Ibn Ziyāba al-Tamīmī; permaneció inmóvil, hizo que sus hombres simularan su funeral con un cadáver hecho de ropas dobladas, luego reunió y derrotó a ambas tribus: Kulayb y al-Muhalhil, los dos hijos de Rabīʿa, fueron hechos prisioneros y sus caballeros masacrados. Los regalos de su hermana, una bolsa de arena y una bolsa de espinas, le advirtieron de la llegada de Banū'l-Qayn {cite:kamil-ibn-al-athir p. 378-380}."
  fr: "Zuhayr ibn Janāb al-Kalbī, surnommé « le devin » pour sa clairvoyance, qui aurait vécu 250 ans (certains disent 450) et livré deux cents batailles, était l'un des rares à obéir à tous les Quḍāʿa. Lorsque les Banū Baghīḍ firent construire un haram sur le modèle de La Mecque, il le détruisit, tua un cavalier à l'intérieur, puis libéra les captifs et rendit les femmes. Alors qu'il réclamait des impôts à Bakr et Taghlib pour Abraha, il fut poignardé dans son sommeil par Ibn Ziyāba al-Tamīmī. Il resta immobile, fit simuler ses funérailles par ses hommes avec un cadavre de vêtements pliés, puis rassembla ses troupes et mit en déroute les deux tribus. Kulayb et al-Muhalhil, les deux fils de Rabīʿa, furent faits prisonniers et leurs chevaliers massacrés. Les cadeaux de sa sœur, un sac de sable et un sac d'épines, l'ont averti de la venue de Banū'l-Qayn {cite:kamil-ibn-al-athir p. 378-380}."
  ur: "زہیر بن جناب الکلبی - جسے اپنے فیصلے کے لیے \"کاہن\" کہا جاتا ہے، کہا جاتا ہے کہ وہ 250 سال زندہ رہا ⁦(بعض کا کہنا ہے کہ 450)⁩ اور دو سو جنگیں لڑی ہیں - ان چند لوگوں میں سے ایک تھا جن کی تمام قواعہ نے اطاعت کی۔ جب بنو بغیث نے مکہ کے نمونے پر ایک حرم بنایا تو اس نے اسے تباہ کر دیا اور اس کے اندر موجود ایک گھڑ سوار کو قتل کر دیا، پھر قیدیوں کو آزاد کر کے عورتوں کو واپس کر دیا۔ ابرہہ کے لیے بکر اور تغلب پر ٹیکس لگاتے ہوئے، اسے ابن زیابہ التمیمی نے نیند میں وار کیا۔ وہ چپ چاپ پڑا رہا، اس کے آدمیوں نے اس کے جنازے کو تہہ شدہ کپڑوں کی لاش کے ساتھ فرض کیا، پھر دونوں قبیلوں کو اکٹھا کر کے بھگا دیا - ربیعہ کے دو بیٹوں کلیب اور المحلل کو قید کر لیا گیا اور ان کے شورویروں کو ذبح کر دیا گیا۔ اس کی بہن کے تحفے ریت کے تھیلے اور کانٹوں کے تھیلے نے اسے بنو قین کے آنے سے خبردار کیا۔ 378-380}۔"
