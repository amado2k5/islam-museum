id: event/waki-ibn-hassan-baya
class: event
kind: revolt
label: { ar: "بيعة وكيع بن حسان على قتيبة", en: "The Bay'a to Waki' ibn Hassan against Qutayba", es: "La Bay'a de Waki' ibn Hassan contra Qutayba", fr: "La Bay'a à Waki' ibn Hassan contre Qutayba" }
summary:
  ar: "خطب قتيبة الناس فعدد إحسانه إليهم وذم قلة وفائهم له وخلافهم عليه وخوفهم بالأعاجم الذين استظهر بهم عليهم فأجمعوا على حربه ولم يجيبوه بشيء وطلبوا إلى الحضين بن المنذر أن يوليهم أمرهم فأبى وأشار عليهم بوكيع بن حسان بن قيس بن أبي سود بن كلب بن عوف بن مالك بن غدانة بن يربوع بن حنظلة التميمي وقال لا يقوى على هذا الأمر غيره لأنه أعرابي جاف تطيعه عشيرته وهو من بني تميم وقد قتل قتيبة بني الأهثم فهم يطلبونه بدمائهم فسعوا إلى وكيع فأعطاهم يده فبايعوه وكان السفير بينه وبينهم قبل ذلك حيان مولى مصطل."
  en: "Qutayba preached his ihsan, their scant loyalty, and warned of the Ajam he had raised over them — they resolved on war and gave no answer. Al-Hudayn ibn al-Mundhir refused their leadership and pointed them to Waki' ibn Hassan ibn Qays ibn Abi Sud of Tamim — 'none else can bear it: a rough Arab whose tribe obeys him, a Tamimi; and Qutayba slew the Banu al-Ahtham, who seek their blood'. They sought him out, he gave his hand, and they swore him bay'a — Hayyan, Maslama's mawla, having gone between them."
  es: "Qutayba predicó su ihsan, su escasa lealtad, y advirtió sobre el Ajam que había levantado sobre ellos; ellos decidieron ir a la guerra y no respondieron. Al-Hudayn ibn al-Mundhir rechazó su liderazgo y les señaló a Waki' ibn Hassan ibn Qays ibn Abi Sud de Tamim: «Nadie más puede soportarlo: un árabe rudo cuya tribu le obedece, un Tamimi; y Qutayba mató a los Banu al-Ahtham, que buscan su sangre». Lo buscaron, él les dio la mano y le juraron bay'a; Hayyan, el mawla de Maslama, intercedió entre ellos."
  fr: "Qutayba leur prêcha son ihsan, leur loyauté fragile, et les mit en garde contre l'Ajam qu'il avait suscité à leur sujet. Ils résolurent à faire la guerre et restèrent silencieux. Al-Hudayn ibn al-Mundhir refusa leur autorité et les orienta vers Waki' ibn Hassan ibn Qays ibn Abi Sud de Tamim: « Nul autre ne peut le supporter: un Arabe rude dont la tribu lui obéit, un Tamimi; et Qutayba a massacré les Banu al-Ahtham, qui réclamaient leur sang. » Ils le recherchèrent, il leur offrit sa main et ils lui prêtèrent serment d'allégeance (bay'a). Hayyan, le mawla de Maslama, s'était interposé entre eux."
