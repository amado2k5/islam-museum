id: event/waki-ibn-hassan-baya
class: event
kind: revolt
label: { ar: "بيعة وكيع بن حسان على قتيبة", en: "The Bay'a to Waki' ibn Hassan against Qutayba", es: "La Bay'a de Waki' ibn Hassan contra Qutayba", fr: "La Bay'a à Waki' ibn Hassan contre Qutayba", ur: "بیع تا وکیع بن حسن قتیبہ کے خلاف", tr: "Vaki' ibn Hasan'ın Kuteybe'ye biat etmesi", id: "Ikrar kesetiaan Waki’ bin Hassan kepada Qutaybah" }
summary:
  ar: "خطب قتيبة الناس فعدد إحسانه إليهم وذم قلة وفائهم له وخلافهم عليه وخوفهم بالأعاجم الذين استظهر بهم عليهم فأجمعوا على حربه ولم يجيبوه بشيء وطلبوا إلى الحضين بن المنذر أن يوليهم أمرهم فأبى وأشار عليهم بوكيع بن حسان بن قيس بن أبي سود بن كلب بن عوف بن مالك بن غدانة بن يربوع بن حنظلة التميمي وقال لا يقوى على هذا الأمر غيره لأنه أعرابي جاف تطيعه عشيرته وهو من بني تميم وقد قتل قتيبة بني الأهثم فهم يطلبونه بدمائهم فسعوا إلى وكيع فأعطاهم يده فبايعوه وكان السفير بينه وبينهم قبل ذلك حيان مولى مصطل."
  en: "Qutayba preached his ihsan, their scant loyalty, and warned of the Ajam he had raised over them — they resolved on war and gave no answer. Al-Hudayn ibn al-Mundhir refused their leadership and pointed them to Waki' ibn Hassan ibn Qays ibn Abi Sud of Tamim — 'none else can bear it: a rough Arab whose tribe obeys him, a Tamimi; and Qutayba slew the Banu al-Ahtham, who seek their blood'. They sought him out, he gave his hand, and they swore him bay'a — Hayyan, Maslama's mawla, having gone between them."
  es: "Qutayba predicó su ihsan, su escasa lealtad, y advirtió sobre el Ajam que había levantado sobre ellos; ellos decidieron ir a la guerra y no respondieron. Al-Hudayn ibn al-Mundhir rechazó su liderazgo y les señaló a Waki' ibn Hassan ibn Qays ibn Abi Sud de Tamim: «Nadie más puede soportarlo: un árabe rudo cuya tribu le obedece, un Tamimi; y Qutayba mató a los Banu al-Ahtham, que buscan su sangre». Lo buscaron, él les dio la mano y le juraron bay'a; Hayyan, el mawla de Maslama, intercedió entre ellos."
  fr: "Qutayba leur prêcha son ihsan, leur loyauté fragile, et les mit en garde contre l'Ajam qu'il avait suscité à leur sujet. Ils résolurent à faire la guerre et restèrent silencieux. Al-Hudayn ibn al-Mundhir refusa leur autorité et les orienta vers Waki' ibn Hassan ibn Qays ibn Abi Sud de Tamim: « Nul autre ne peut le supporter: un Arabe rude dont la tribu lui obéit, un Tamimi; et Qutayba a massacré les Banu al-Ahtham, qui réclamaient leur sang. » Ils le recherchèrent, il leur offrit sa main et ils lui prêtèrent serment d'allégeance (bay'a). Hayyan, le mawla de Maslama, s'était interposé entre eux."
  ur: "قتیبہ نے اپنے احسان، ان کی کم وفاداری کی تبلیغ کی، اور اس نے ان پر برپا ہونے والے عجم سے خبردار کیا - انہوں نے جنگ کا عزم کیا اور کوئی جواب نہیں دیا۔ الحدین ابن المنذر نے ان کی قیادت سے انکار کیا اور انہیں وکیع بن حسن بن قیس ابن ابی سعود کی طرف اشارہ کیا جو تمیم کے تھے - 'کوئی دوسرا اس کا متحمل نہیں ہوسکتا: ایک سخت عرب جس کا قبیلہ اس کی اطاعت کرتا ہے، ایک تمیمی؛ اور قتیبہ نے بنی احتشام کو قتل کر دیا جو ان کا خون چاہتے تھے۔ انہوں نے اسے ڈھونڈا، اس نے اپنا ہاتھ دیا، اور انہوں نے اسے بیعت کی - حیان، مسلمہ کا مولا، ان کے درمیان چلا گیا۔"
  tr: "Kuteybe halka hitap ederek onlara yaptığı iyilikleri sıraladı ve kendisine olan sadakatsizliklerini ve ona karşı çıkmalarını kınadı. Onları, üzerlerinde güç kazandığı Arap olmayanlarla korkuttu. Böylece hepsi onunla savaşmaya karar verdi ve ona hiçbir şekilde karşılık vermedi. El-Hadhin bin El-Mundhir'den kendilerine önderlik edecek birini atamasını istediler, ancak o reddetti ve onlara Vaki' bin Hasan bin Kays bin Ebu Sud bin Kalb bin Avf bin Malik bin Gadanah bin Yarbu' bin Hanzalah El-Tamimi'yi önerdi. Başka kimsenin bu işe uygun olmadığını, çünkü kendisinin sert bir Bedevi olduğunu, kabilesinin ona itaat ettiğini ve Beni Tamim kabilesinden olduğunu söyledi. Kuteybe Beni Ahtham kabilesini öldürmüştü, bu yüzden kanlarının intikamını almak için onu arıyorlardı. Bu yüzden Vaki'ye gittiler ve o da onlara elini uzattı, böylece ona biat ettiler. Bundan önce aralarındaki elçi, Mustal'ın azatlı kölesi Hayyan'dı."
  id: "Qutaybah berpidato di hadapan orang-orang, menyebutkan kebaikan yang telah ia berikan kepada mereka dan mengecam kurangnya kesetiaan mereka kepadanya serta penentangan mereka terhadapnya. Ia menakut-nakuti mereka dengan orang-orang non-Arab yang dengannya ia telah memperoleh kekuasaan atas mereka. Maka mereka semua sepakat untuk melawannya dan tidak menanggapinya dengan apa pun. Mereka meminta Al-Hadhin bin Al-Mundhir untuk menunjuk mereka sebagai pemimpin, tetapi ia menolak dan menyarankan kepada mereka Waki’ bin Hassan bin Qais bin Abi Sud bin Kalb bin Awf bin Malik bin Ghadanah bin Yarbu’ bin Hanzalah Al-Tamimi. Ia berkata bahwa tidak ada orang lain yang mampu melakukan hal ini karena ia adalah seorang Badui yang keras yang ditaati oleh sukunya, dan ia berasal dari Bani Tamim. Qutaybah telah membunuh Bani Al-Ahtham, sehingga mereka mencarinya untuk membalas dendam. Maka mereka pergi kepada Waki’, dan ia mengulurkan tangannya kepada mereka, sehingga mereka berjanji setia kepadanya. Utusan antara dia dan mereka sebelumnya adalah Hayyan, budak yang dibebaskan oleh Mustal."
