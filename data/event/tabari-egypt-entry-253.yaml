id: event/tabari-egypt-entry-253
class: event
kind: migration
label:
  ar: "دخول الطبري مصر وقراءته على علمائها"
  en: "al-Tabari enters Egypt and studies with its scholars"
  ur: "طبری کا مصر میں داخلہ اور وہاں کے علماء سے استفادہ"
  es: "Al-Tabari entra en Egipto y estudia con sus eruditos."
  fr: "Al-Tabari entre en Égypte et étudie auprès de ses érudits."
  tr: "Taberi Mısır'a girdi ve oradaki âlimlere kitap okudu."
  id: "Al-Tabari memasuki Mesir dan membacakan khotbah kepada para ulama di sana."
summary:
  ar: "بعد سنين في بغداد خرج الطبري في رحلته الكبرى إلى الشام وفلسطين ومصر، فمر ببيروت وببلاد الشام، وكان دخوله مصر سنة ٢٥٣هـ/٨٦٧م على أثبت التقادير، فلقي فيها كبير محدثيها وصاحب القراءات يونس بن عبد الأعلى وقرأ فقه مالك على بني عبد الحكم وأخذ فقه الشافعي عن الربيع بن سليمان، وهم أهل البيت الذي كان أقرب الناس إلى الشافعي {cite:encyclopaedia-of-islam-2 vol. 10 p. 21} {cite:fihrist-ibn-al-nadim p. 326-327}."
  en: "After years in Baghdad al-Tabari set out on his great study journey through Syria and Palestine to Egypt, passing through Beirut and such centres as Hims, al-Ramla and Askalan; his entry into Egypt can be fixed with some certainty at 253/867. There he met the leading Egyptian muhaddith and authority on the qira'at Yunus ibn Abd al-A'la, read Malik's fiqh with the Ibn Abd al-Hakam family, and took Shafi'i law from al-Rabi ibn Sulayman {cite:encyclopaedia-of-islam-2 vol. 10 p. 21} {cite:fihrist-ibn-al-nadim p. 326-327}."
  ur: "بغداد میں سالوں کے بعد طبری نے شام اور فلسطین ہوتے ہوئے مصر کا عظیم علمی سفر کیا؛ بیروت، حمص، رملہ اور عسقلان سے گزر کر 253ھ/867ء میں مصر داخل ہوئے۔ وہاں انہوں نے بڑے محدث اور قراءات کے ماہر یونس بن عبد الاعلی سے ملاقات کی، بنی عبد الحکم سے مالکی فقہ پڑھی اور ربیع بن سلیمان سے شافعی فقہ لی {cite:encyclopaedia-of-islam-2 vol. 10 p. 21} {cite:fihrist-ibn-al-nadim p. 326-327}."
  es: "Después de años en Bagdad, al-Tabari emprendió su gran viaje de estudios a través de Siria y Palestina hasta Egipto, pasando por Beirut y centros como Hims, al-Ramla y Askalan; su entrada en Egipto se puede fijar con cierta certeza en el año 253/867. Allí conoció al principal muhaddith egipcio y autoridad en la qira'at Yunus ibn Abd al-A'la, estudió el fiqh de Malik con la familia Ibn Abd al-Hakam y tomó la ley shafi'i de al-Rabi ibn Sulayman {cite:encyclopaedia-of-islam-2 vol. 10 p. 21} {cite:fihrist-ibn-al-nadim p. 326-327}."
  fr: "Après des années passées à Bagdad, al-Tabari entreprit son grand voyage d'études à travers la Syrie et la Palestine jusqu'en Égypte, passant par Beyrouth et des centres tels que Hims, al-Ramla et Askalan; son entrée en Égypte peut être fixée avec une certaine certitude en 253/867. Il y rencontra le plus grand muhaddith égyptien et autorité en matière de qira'at, Yunus ibn Abd al-A'la, étudia le fiqh de Malik avec la famille d'Ibn Abd al-Hakam et reçut l'enseignement du droit chaféite d'al-Rabi ibn Sulayman."
  tr: "Bağdat'ta geçirdiği yılların ardından Taberi, Levant, Filistin ve Mısır'a büyük yolculuğuna çıktı. Beyrut ve Levant'tan geçti. En güvenilir tahminlere göre Mısır'a girişi Hicri 253/Miladi 867 yılında gerçekleşti. Orada büyük hadis alimi ve Kur'an okumaları konusunda uzman Yunus ibn Abdül-A'la ile tanıştı ve Beni Abdül-Hakam ile Maliki fıkıhını öğrendi. Ayrıca Şafiî fıkıhını, Şafiî'ye en yakın kişinin ailesinden olan Rabi' ibn Süleyman'dan öğrendi. {cite:encyclopaedia-of-islam-2 vol. 10 p. 21} {cite:fihrist-ibn-al-nadim p. 326-327}."
  id: "Setelah bertahun-tahun di Baghdad, al-Tabari memulai perjalanan besarnya ke Levant, Palestina, dan Mesir. Ia melewati Beirut dan Levant. Kedatangannya ke Mesir adalah pada tahun 253 H/867 M, menurut perkiraan yang paling dapat diandalkan. Di sana ia bertemu dengan ulama hadits besar dan ahli dalam pembacaan Al-Quran, Yunus ibn Abd al-A'la, dan mempelajari fiqih Maliki dengan Bani Abd al-Hakam. Ia juga mempelajari fiqih Syafi'i dari al-Rabi' ibn Sulayman, yang merupakan keluarga dari orang yang paling dekat dengan al-Syafi'i. {cite:encyclopaedia-of-islam-2 vol. 10 p. 21} {cite:fihrist-ibn-al-nadim p. 326-327}."
