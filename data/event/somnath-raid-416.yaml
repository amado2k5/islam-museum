label: { ar: "محمود الغزنوي يكسر صومنات" }
summary:
  ar: "في سنة ثمان عشرة وأربعمائة ورد كتاب الملك محمود بن سبكتكين بما فتحه من بلاد الهند وكسر صومنات، ووصف أن أهلها كانوا يأتونه من كل فج عميق ويقربون له القرابين حتى بلغت أوقافه عشرة آلاف قرية وامتلأت خزانة الصنم بالأموال وله ألف نفس يخدمونه وثلاثمائة يحلقون لحاجه وثلاثمائة يغنون؛ فنهض في شعبان سنة ست عشرة وأربعمائة في ثلاثين ألف فارس سوى المتطوعة ووصل إلى بلد الصنم فملك الصنم والبلاد وأُوقدت النيران على الصنم حتى تقطّع، وقُتل خمسون ألفاً من أهل البلد {cite:shadharat-dhahab p. 209}."
  en: "In 418 Mahmud b. Sabuktigin's letter arrived describing his conquests in India and the breaking of Somnath — the idol whose endowments had reached ten thousand villages, served by a thousand attendants, three hundred barbers and three hundred singers. He had set out in Sha'ban 416 with thirty thousand cavalry besides volunteers, took the idol-town and the lands, had fire set on the idol until it broke apart, and fifty thousand of the townsfolk were killed {cite:shadharat-dhahab p. 209}."
