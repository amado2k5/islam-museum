id: event/somnath-raid-416
class: event
kind: raid
label: { ar: "محمود الغزنوي يكسر صومنات", en: "Mahmud of Ghazna breaks Somnath", es: "Mahmud de Ghazna rompe Somnath", fr: "Mahmud de Ghazni rompt Somnath", ur: "غزنہ کے محمود نے سومنات کو توڑا۔", tr: "Mahmud el-Gaznevi sessizliği bozuyor", id: "Mahmoud al-Ghaznawi memecah keheningan" }
summary:
  ar: "في سنة ثمان عشرة وأربعمائة ورد كتاب الملك محمود بن سبكتكين بما فتحه من بلاد الهند وكسر صومنات، ووصف أن أهلها كانوا يأتونه من كل فج عميق ويقربون له القرابين حتى بلغت أوقافه عشرة آلاف قرية وامتلأت خزانة الصنم بالأموال وله ألف نفس يخدمونه وثلاثمائة يحلقون لحاجه وثلاثمائة يغنون؛ فنهض في شعبان سنة ست عشرة وأربعمائة في ثلاثين ألف فارس سوى المتطوعة ووصل إلى بلد الصنم فملك الصنم والبلاد وأُوقدت النيران على الصنم حتى تقطّع، وقُتل خمسون ألفاً من أهل البلد {cite:shadharat-dhahab p. 209}. وورد كتابه بالفتح إلى الخليفة سنة ٤١٨ كما في المنتظم بنصه: خروجه في شعبان ٤١٦ في ثلاثين ألف فارس سوى المتطوعة، وصحراء سلكها على ماء بعيد، وصف صنم صومنات وعشرة آلاف قرية موقوفة عليه وألف برهمي ومغنين، وكسره وإحراقه {cite:muntazam-ibn-al-jawzi j.8 p.371-372}؛ وفي ترجمة محمود عنده أن الصنم كان ذهبًا وآخرين من ياقوت قيمتهما عشرون ألف ألف دينار {cite:muntazam-ibn-al-jawzi j.8 p.395}."
  en: "In 418 Mahmud b. Sabuktigin's letter arrived describing his conquests in India and the breaking of Somnath — the idol whose endowments had reached ten thousand villages, served by a thousand attendants, three hundred barbers and three hundred singers. He had set out in Sha'ban 416 with thirty thousand cavalry besides volunteers, took the idol-town and the lands, had fire set on the idol until it broke apart, and fifty thousand of the townsfolk were killed {cite:shadharat-dhahab p. 209}."
  es: "En 418 llegó la carta de Mahmud b. Sabuktigin describiendo sus conquistas en la India y la destrucción de Somnath, el ídolo cuyas ofrendas habían llegado a diez mil aldeas, atendidas por mil asistentes, trescientos barberos y trescientos cantantes. Había partido en Sha'ban 416 con treinta mil jinetes, además de voluntarios, tomó la ciudad del ídolo y las tierras, mandó prender fuego al ídolo hasta que se hizo añicos, y cincuenta mil habitantes de la ciudad murieron {cite:shadharat-dhahab p. 209}."
  fr: "En 418, la lettre de Mahmud ibn Sabuktigin parvint, décrivant ses conquêtes en Inde et la destruction de Somnath, l'idole dont les bienfaits s'étendaient sur dix mille villages, servie par mille serviteurs, trois cents barbiers et trois cents chanteurs. Il était parti en Sha'ban 416 avec trente mille cavaliers, outre des volontaires, avait pris la ville et les terres environnantes, avait fait incendier l'idole jusqu'à ce qu'elle se brise, et cinquante mille habitants avaient péri (cf. shadharat-dhahab, p. 209)."
  ur: "418 میں محمود بن۔ سبوکتگین کا خط پہنچا جس میں ہندوستان میں اس کی فتوحات اور سومناتھ کے ٹوٹنے کا بیان تھا - وہ بت جس کی اوقاف دس ہزار دیہاتوں تک پہنچ چکی تھی، جس کی خدمت ایک ہزار خدمتگاروں، تین سو حجاموں اور تین سو گلوکاروں نے کی تھی۔ وہ شعبان 416 میں رضاکاروں کے علاوہ تیس ہزار گھڑ سواروں کے ساتھ روانہ ہوا، بت بستی اور زمینوں پر قبضہ کیا، بت کو جلایا یہاں تک کہ وہ ٹوٹ گیا، اور بستی کے پچاس ہزار لوگ مارے گئے۔ 209}۔"
  tr: "Hicri 418 yılında, Kral Mahmud ibn Sabuktigin'den Hindistan topraklarında elde ettiği fetihler ve Somnath'ın yıkımı hakkında bir mektup geldi. Mektupta, halkın her uzak vadiden kendisine nasıl geldiğini ve on bin köye ulaşan bağışlarla kendisine nasıl kurbanlar sunduğunu, putun hazinesinin nasıl parayla dolduğunu anlatıyordu. Bin kişi ona hizmet ediyordu, üç yüz kişi onun ihtiyaçlarını karşılamak için saçını tıraş ediyordu ve üç yüz kişi de şarkı söylüyordu. Böylece Hicri 416 yılının Şaban ayında otuz bin süvari ve gönüllülerle birlikte yola çıktı ve putun ülkesine ulaştı. Putu ve toprakları fethetti ve putun üzerine ateşler yakılarak parçalara ayrıldı ve elli bin kişi öldürüldü. {cite:shadharat-dhahab s. 209} Kitabı, el-Muntazam'da olduğu gibi, 418 yılında halifeye şu metinle birlikte gönderilmiştir: Şaban 416'da otuz bin süvariyle (gönüllüler hariç) yola çıktı ve uzak bir su kaynağına ulaşmak için bir çölü geçti. Somnath putunu ve ona bağlı on bin köyü, bin Brahman ve şarkıcıyı anlattı ve onu kırıp yaktı. {cite:muntazam-ibn-al-jawzi j.8 s.371-372}; ve içindeki Mahmud biyografisinde putun altından, diğer ikisinin ise yakuttan yapıldığı ve değerinin yirmi milyon dinar olduğu belirtilmiştir. {cite:muntazam-ibn-al-jawzi j.8 s.395}."
  id: "Pada tahun 418 Hijriah, sebuah surat tiba dari Raja Mahmud bin Sabuktigin tentang apa yang telah ditaklukkannya di tanah India dan penghancuran Somnath. Ia menggambarkan bagaimana penduduknya datang kepadanya dari setiap lembah yang jauh dan mempersembahkan kurban kepadanya hingga wakafnya mencapai sepuluh ribu desa dan perbendaharaan berhala itu penuh dengan uang. Ia memiliki seribu orang yang melayaninya, tiga ratus orang mencukur kepalanya untuk kebutuhannya, dan tiga ratus orang bernyanyi. Maka ia berangkat pada bulan Sya'ban tahun 416 Hijriah dengan tiga puluh ribu penunggang kuda, selain para sukarelawan, dan mencapai tanah berhala itu. Ia menaklukkan berhala dan tanah-tanah tersebut, dan api dinyalakan di atas berhala itu hingga hancur berkeping-keping, dan lima puluh ribu penduduk negeri itu terbunuh. {cite:shadharat-dhahab p. 209} Kitabnya dikirim kepada Khalifah pada tahun 418, seperti dalam kitab al-Muntazam, dengan teks berikut: Keberangkatannya pada bulan Sya'ban 416 dengan tiga puluh ribu penunggang kuda, tidak termasuk sukarelawan, dan padang pasir yang dilaluinya menuju sumber air yang jauh. Ia menggambarkan berhala Somnath dan sepuluh ribu desa yang diwakafkan kepadanya, dan seribu Brahmana dan penyanyi, dan ia menghancurkannya dan membakarnya. {cite:muntazam-ibn-al-jawzi j.8 p.371-372}; dan dalam biografi Mahmud di dalamnya, berhala itu terbuat dari emas dan dua lainnya terbuat dari rubi, yang nilainya dua puluh juta dinar. {cite:muntazam-ibn-al-jawzi j.8 p.395}."
