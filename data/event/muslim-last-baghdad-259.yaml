summary:
  ar: "دخل مسلم بن الحجاج بغداد غير مرة فروى عنه أهلها، وآخر دخوله إليها كان سنة تسع وخمسين ومائتين {cite:wafayat-ayan v p. 195}؛ وكان ممن روى عنه الترمذي وكان من الثقات {cite:wafayat-ayan v p. 195}."
  en: "Muslim ibn al-Hajjaj entered Baghdad on several occasions and its people transmitted from him; his last entry was in 259 {cite:wafayat-ayan v p. 195}. Among those who transmitted from him was al-Tirmidhi, who counted him among the trustworthy {cite:wafayat-ayan v p. 195}."
  ur: "مسلم بن حجاج بغداد کئی بار داخل ہوئے اور وہاں کے لوگوں نے ان سے روایت کیا؛ ان کی آخری آمد 259ھ میں ہوئی {cite:wafayat-ayan v p. 195}۔ ان سے روایت کرنے والوں میں ترمذی تھے جو انہیں ثقہ شمار کرتے تھے {cite:wafayat-ayan v p. 195}۔"
