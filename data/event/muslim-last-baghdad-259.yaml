label:
  ar: "آخر دخول مسلم بن الحجاج بغداد، ٢٥٩هـ"
  en: "Muslim ibn al-Hajjaj's last entry into Baghdad, 259/873"
  ur: "مسلم بن حجاج کی بغداد میں آخری آمد، 259ھ/873ء"
  es: "Última entrada de Muslim ibn al-Hajjaj en Bagdad, 259/873"
  fr: "Dernière entrée de Muslim ibn al-Hajjaj à Bagdad, 259/873"
  tr: "Müslim ibn el-Haccac'ın Bağdat'a son girişi Hicri 259 yılında olmuştur."
  id: "Kedatangan terakhir Muslim Ibnu al-Hajjaj ke Baghdad adalah pada tahun 259 Hijriah."
summary:
  ar: "دخل مسلم بن الحجاج بغداد غير مرة فروى عنه أهلها، وآخر دخوله إليها كان سنة تسع وخمسين ومائتين {cite:wafayat-ayan v p. 195}؛ وكان ممن روى عنه الترمذي وكان من الثقات {cite:wafayat-ayan v p. 195}."
  en: "Muslim ibn al-Hajjaj entered Baghdad on several occasions and its people transmitted from him; his last entry was in 259 {cite:wafayat-ayan v p. 195}. Among those who transmitted from him was al-Tirmidhi, who counted him among the trustworthy {cite:wafayat-ayan v p. 195}."
  ur: "مسلم بن حجاج بغداد کئی بار داخل ہوئے اور وہاں کے لوگوں نے ان سے روایت کیا؛ ان کی آخری آمد 259ھ میں ہوئی {cite:wafayat-ayan v p. 195}۔ ان سے روایت کرنے والوں میں ترمذی تھے جو انہیں ثقہ شمار کرتے تھے {cite:wafayat-ayan v p. 195}۔"
  es: "Muslim ibn al-Hajjaj entró en Bagdad en varias ocasiones y sus habitantes transmitieron información de él; su última entrada fue en el año 259 {cite:wafayat-ayan v p. 195}. Entre quienes transmitieron información de él se encontraba al-Tirmidhi, quien lo consideró digno de confianza {cite:wafayat-ayan v p. 195}."
  fr: "Muslim ibn al-Hajjaj entra à Bagdad à plusieurs reprises et ses habitants transmettirent ses enseignements; sa dernière entrée remonte à 259 av. J.-C. (Wafayat-Ayan, vol. V, p. 195). Parmi ceux qui transmettèrent ses enseignements figurait al-Tirmidhi, qui le comptait parmi les personnes dignes de confiance (Wafayat-Ayan, vol. V, p. 195)."
  tr: "Müslim ibn el-Haccac, Bağdat'a birden fazla kez girmiş ve Bağdat halkı ondan rivayet etmiştir. Bağdat'a son girişi 259 yılında olmuştur. (Kaynak: Vefayat-i Ayan, cilt s. 195) Tirmizi'nin rivayet ettiği kişilerden biri olup, güvenilir kişilerdendir. (Kaynak: Vefayat-i Ayan, cilt s. 195)"
  id: "Muslim ibn al-Hajjaj memasuki Baghdad lebih dari sekali, dan penduduknya meriwayatkan darinya. Kunjungan terakhirnya ke Baghdad adalah pada tahun 259 {cite:wafayat-ayan v p. 195}. Dia adalah salah satu orang yang diriwayatkan oleh al-Tirmidhi, dan dia adalah salah satu orang yang terpercaya {cite:wafayat-ayan v p. 195}."
