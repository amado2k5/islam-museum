summary:
  ar: "فرّق معاوية جيوشه في العراق، فوجّه النعمان بن بشير في ألف رجل إلى عين التمر وفيها مالك بن كعب مسلحة لعلي وقد أذن لأصحابه فلم يبق معه إلا مائة، فواقعه أشد قتال حتى كسروا جفون سيوفهم، فأغاثه مخنف بن سليم بابنه عبد الرحمن في خمسين رجلًا فانهزم أهل الشام عند المساء، وقتل مالك منهم ثلاثة. وكان أهل الكوفة قد تثاقلوا عن مدده فخطبهم علي قائلًا يا أهل الكوفة كلما سمعتم بجمع من أهل الشام أظلكم انجحر كل امرئ منكم في بيته انجحار الضب في جحره، المغرور من غررتموه، ومن فاز بكم فاز بالسهم الأخيب {cite:kamil-ibn-al-athir p. 724}."
  en: "Muʿāwiya loosed his columns on Iraq: al-Nuʿmān ibn Bashīr struck ʿAyn al-Tamr with a thousand, where Mālik ibn Kaʿb held the outpost with a hundred. They fought until their scabbards splintered; Mikhnaf ibn Sulaym's fifty riders under his son broke the Syrians at dusk. When the Kufans had hung back from relieving Mālik, ʿAli flayed them from the minbar: «every time a Syrian muster nears, each man of you burrows into his house like the lizard into its hole — whoever wins you wins the losing arrow« {cite:kamil-ibn-al-athir p. 724}."
