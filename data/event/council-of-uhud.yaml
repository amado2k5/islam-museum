summary:
  ar: مجلس عسكري ناقش فيه النبي وصحابته خطة الدفاع، بين التحصن في المدينة أو الخروج لملاقاة العدو.
  en: A military council where the Prophet and his companions discussed the defense plan, debating between fortifying Medina or exiting to face the enemy.
  es: "Un consejo militar donde el Profeta y sus compañeros discutieron el plan de defensa, debatiendo entre fortificar Medina o retirarse para enfrentar al enemigo."
  fr: "Un conseil militaire où le Prophète et ses compagnons discutèrent du plan de défense, débattant entre fortifier Médine ou sortir pour affronter l'ennemi."
  ur: "ایک فوجی کونسل جہاں نبی اور آپ کے صحابہ نے دفاعی منصوبے پر بحث کی، مدینہ کو مضبوط بنانے یا دشمن کا سامنا کرنے کے لیے نکلنے کے درمیان بحث ہوئی۔"
  tr: "Peygamber ve sahabelerin, şehirde tahkimat kurmak veya düşmanla karşılaşmak üzere dışarı çıkmak arasında savunma planını görüştükleri askeri konsey."
  id: "Sebuah dewan militer di mana Nabi dan para sahabatnya membahas rencana pertahanan, antara membentengi diri di dalam kota atau keluar untuk menghadapi musuh."
