label:
  ar: المجلس الاستشاري لغزوة أحد
  en: The Consultative Council for the Battle of Uhud
  es: "El Consejo Consultivo para la Batalla de Uhud"
  fr: "Le Conseil consultatif pour la bataille d'Uhud"
  ur: "جنگ احد کے لیے مشاورتی کونسل"
  tr: "Uhud Muharebesi Danışma Konseyi"
