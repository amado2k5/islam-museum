label: { en: "The Battle of Mu'tah", ar: "غزوة مؤتة" }
summary:
  en: "A Muslim force of three thousand sent north toward the Byzantine frontier met a larger Byzantine-led army at Mu'tah in Jumada I, 8 AH; after its three appointed commanders fell one by one, Khalid ibn al-Walid took command and withdrew the survivors. Ibn Ishaq (via Urwa ibn al-Zubayr) records a tactical withdrawal; Ibn Hisham cites al-Zuhri that God granted them victory."
  ar: "التقى جيش مسلم من ثلاثة آلاف بجيش أكبر عند مؤتة في جمادى الأولى سنة ثمان؛ استُشهد قادته الثلاثة الواحد تلو الآخر، فأخذ خالد بن الوليد القيادة وانسحب بالجيش. رواية ابن إسحاق عن عروة تذكر المحاجزة، وأضاف ابن هشام رواية الزهري أن الله فتح عليهم. وفي صحيح البخاري عن أنس أن النبي نعى زيداً وجعفراً وابن رواحة للناس قبل أن يأتيهم خبرهم — «أخذ الراية زيد فأصيب ثم أخذ جعفر فأصيب ثم أخذ ابن رواحة فأصيب» وعيناه تذرفان — «حتى أخذ الراية سيف من سيوف الله حتى فتح الله عليهم» {cite:sahih-al-bukhari 4262}."
