label: { en: "The Battle of Mu'tah", ar: "غزوة مؤتة", fr: "La bataille de Mu'ta", es: "La batalla de Mu'tah", ur: "معہ کی جنگ", tr: "Mu'tah Savaşı", id: "Pertempuran Mu'tah" }
summary:
  en: "A Muslim force of three thousand sent north toward the Byzantine frontier met a larger Byzantine-led army at Mu'tah in Jumada I, 8 AH; after its three appointed commanders fell one by one, Khalid ibn al-Walid took command and withdrew the survivors. Ibn Ishaq (via Urwa ibn al-Zubayr) records a tactical withdrawal; Ibn Hisham cites al-Zuhri that God granted them victory."
  ar: "التقى جيش مسلم من ثلاثة آلاف بجيش أكبر عند مؤتة في جمادى الأولى سنة ثمان؛ استُشهد قادته الثلاثة الواحد تلو الآخر، فأخذ خالد بن الوليد القيادة وانسحب بالجيش. رواية ابن إسحاق عن عروة تذكر المحاجزة، وأضاف ابن هشام رواية الزهري أن الله فتح عليهم. وفي صحيح البخاري عن أنس أن النبي نعى زيداً وجعفراً وابن رواحة للناس قبل أن يأتيهم خبرهم — «أخذ الراية زيد فأصيب ثم أخذ جعفر فأصيب ثم أخذ ابن رواحة فأصيب» وعيناه تذرفان — «حتى أخذ الراية سيف من سيوف الله حتى فتح الله عليهم» {cite:sahih-al-bukhari 4262}."
  ur: "جمادی الاولیٰ سنہ 8 ہجری میں مدینہ سے شمال کی طرف بھیجا گیا تین ہزار کا مسلم لشکر بازنطینی سرحد کے قریب موتہ میں ایک بڑے لشکر سے ٹکرایا۔ تینوں مقرر سالار یکے بعد دیگرے گرے تو خالد بن الولید نے قیادت سنبھال کر بچ جانے والوں کو واپس نکالا۔ دائرۃ المعارف اسلامیہ کا مضمون اسے مسلمانوں کی شکست قرار دینے والی بازنطینی روایت اور اسلامی روایات کے فرق کے ساتھ بیان کرتا ہے۔"
  fr: "Une force musulmane de trois mille hommes envoyée au nord vers la frontière byzantine rencontra à Mu'ta, en Jumada I 8 H, une armée plus nombreuse menée par les Byzantins ; après que ses trois commandants désignés furent tombés l'un après l'autre, Khalid ibn al-Walid prit le commandement et retira les survivants. Ibn Ishaq (par Urwa ibn al-Zubayr) consigne un repli tactique ; Ibn Hisham cite al-Zuhri selon qui Dieu leur accorda la victoire."
  es: "Una fuerza musulmana de tres mil hombres, enviada al norte hacia la frontera bizantina, se enfrentó a un ejército bizantino superior en Mu'tah durante el Jumada I del año 8 de la Hégira. Tras la caída sucesiva de sus tres comandantes designados, Khalid ibn al-Walid tomó el mando y retiró a los supervivientes. Ibn Ishaq (a través de Urwa ibn al-Zubayr) registra una retirada táctica; Ibn Hisham cita a al-Zuhri, quien afirma que Dios les concedió la victoria."
  tr: "Hicretin sekizinci yılında Cemâdeü'l-Ula ayında Mu'te'de üç bin kişilik bir Müslüman ordusu daha büyük bir orduyla karşılaştı. Üç komutanı da birer birer şehit edildi, bunun üzerine Halid ibn el-Velid komutayı devraldı ve orduyla birlikte geri çekildi. İbn İshak'ın Urve'den rivayet ettiği bu savaştan bahsedilir ve İbn Hişam, Allah'ın onlara zafer bahşettiğine dair Zühri'nin rivayetini ekler. Sahih el-Buhari'de, Enes'ten rivayet edildiğine göre, Peygamberimiz, Zeyd, Cafer ve İbn Ravaha'nın ölümlerini halka haber ulaşmadan önce şöyle duyurdu: \"Zeyd sancağı aldı ve öldürüldü, sonra Cafer sancağı aldı ve öldürüldü, sonra İbn Ravaha sancağı aldı ve öldürüldü,\" gözleri yaşlarla doluyken, \"ta ki Allah'ın kılıçlarından biri sancağı alana ve Allah onlara zafer bahşedene kadar.\" {sahih-el-buhari 4262}"
  id: "Pasukan Muslim berjumlah tiga ribu orang bertemu dengan pasukan yang lebih besar di Mu'tah pada bulan Jumada al-Ula tahun kedelapan (Hijrah). Tiga komandannya gugur satu demi satu, sehingga Khalid ibn al-Walid mengambil alih komando dan mundur bersama pasukan. Riwayat Ibn Ishaq dari Urwah menyebutkan pertempuran tersebut, dan Ibn Hisham menambahkan riwayat al-Zuhri bahwa Allah menganugerahkan kemenangan kepada mereka. Dalam Sahih al-Bukhari, dari Anas, Nabi mengumumkan kematian Zaid, Ja'far, dan Ibn Rawahah kepada orang-orang sebelum berita itu sampai kepada mereka—\"Zaid mengambil panji dan terbunuh, kemudian Ja'far mengambilnya dan terbunuh, kemudian Ibn Rawahah mengambilnya dan terbunuh,\" matanya berlinang air mata—\"hingga sebuah pedang dari antara pedang-pedang Allah mengambil panji, dan Allah menganugerahkan kemenangan kepada mereka.\" {cite:sahih-al-bukhari 4262}"
