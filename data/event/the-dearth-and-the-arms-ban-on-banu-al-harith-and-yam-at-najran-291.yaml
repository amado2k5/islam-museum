id: event/the-dearth-and-the-arms-ban-on-banu-al-harith-and-yam-at-najran-291
class: event
kind: other
label:
  ar: القحط في اليمن وقيام بني الحارث ويام على عامل الهادي بنجران ومنع حمل السلاح عليهم، 291هـ
  en: The dearth in Yemen, the rising of Banu al-Harith and Yam against al-Hadi's governor at Najran and the ban on their carrying arms, 291 AH
  ur: یمن میں قحط، نجران میں ہادی کے عامل کے خلاف بنو حارث اور یام کا اٹھنا اور ان پر ہتھیار اٹھانے کی ممانعت، 291ھ
summary:
  ar: يروي علي بن محمد أن قحطاً عمّ اليمن حتى أكل الناس بعضهم بعضاً، فقام جماعة من بني الحارث ويام على عامل الهادي بنجران، فيروي محمد بن عبيد الله أنه شدّ عليهم وحبس من أمكنه ورفعهم إلى صعدة وحرّم عليهم حمل السلاح من أعلى الوادي إلى أسفله، فأمنت البلاد حتى زال القحط.
  en: Ali ibn Muhammad relates that a dearth overspread Yemen until people ate one another, and a body of Banu al-Harith and Yam rose against al-Hadi's governor at Najran; Muhammad ibn Ubaydallah relates that he pressed hard on them, jailed those he could take and sent them up to Sa'da, and forbade them to carry arms from the top of the valley to its bottom, so the land was secure until the dearth cleared.
  ur: علی بن محمد روایت کرتے ہیں کہ یمن میں قحط چھا گیا یہاں تک کہ لوگ ایک دوسرے کو کھا گئے، اور بنو حارث اور یام کی ایک جماعت ہادی کے عامل کے خلاف نجران میں اٹھی؛ محمد بن عبید اللہ بیان کرتے ہیں کہ انہوں نے ان پر سختی کی، جنہیں پا سکے قید کر کے صعدہ بھیج دیا اور وادی کے اوپر سے نیچے تک ان پر ہتھیار اٹھانے سے ممانعت کر دی، تو ملک امن میں رہا یہاں تک کہ قحط چھٹ گیا۔
