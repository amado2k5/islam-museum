id: event/the-dearth-and-the-arms-ban-on-banu-al-harith-and-yam-at-najran-291
class: event
kind: other
label:
  ar: القحط في اليمن وقيام بني الحارث ويام على عامل الهادي بنجران ومنع حمل السلاح عليهم، 291هـ
  en: The dearth in Yemen, the rising of Banu al-Harith and Yam against al-Hadi's governor at Najran and the ban on their carrying arms, 291 AH
  ur: یمن میں قحط، نجران میں ہادی کے عامل کے خلاف بنو حارث اور یام کا اٹھنا اور ان پر ہتھیار اٹھانے کی ممانعت، 291ھ
  es: "La escasez en Yemen, el levantamiento de Banu al-Harith y Yam contra el gobernador de al-Hadi en Najrán y la prohibición de que portaran armas, 291 AH"
  fr: "La famine au Yémen, le soulèvement des Banu al-Harith et des Yam contre le gouverneur d'al-Hadi à Najran et l'interdiction de porter des armes à leur encontre, 291 AH"
  tr: "Yemen'deki kuraklık ve Beni el-Harith ile Yam kabilelerinin Necran'da Hadi'nin valisine karşı ayaklanması ve onlara karşı silah taşıma yasağı, Hicri 291"
  id: "Kekeringan di Yaman dan pemberontakan Bani al-Harith dan Yam melawan gubernur al-Hadi di Najran dan larangan membawa senjata terhadap mereka, 291 H"
summary:
  ar: يروي علي بن محمد أن قحطاً عمّ اليمن حتى أكل الناس بعضهم بعضاً، فقام جماعة من بني الحارث ويام على عامل الهادي بنجران، فيروي محمد بن عبيد الله أنه شدّ عليهم وحبس من أمكنه ورفعهم إلى صعدة وحرّم عليهم حمل السلاح من أعلى الوادي إلى أسفله، فأمنت البلاد حتى زال القحط.
  en: Ali ibn Muhammad relates that a dearth overspread Yemen until people ate one another, and a body of Banu al-Harith and Yam rose against al-Hadi's governor at Najran; Muhammad ibn Ubaydallah relates that he pressed hard on them, jailed those he could take and sent them up to Sa'da, and forbade them to carry arms from the top of the valley to its bottom, so the land was secure until the dearth cleared.
  ur: علی بن محمد روایت کرتے ہیں کہ یمن میں قحط چھا گیا یہاں تک کہ لوگ ایک دوسرے کو کھا گئے، اور بنو حارث اور یام کی ایک جماعت ہادی کے عامل کے خلاف نجران میں اٹھی؛ محمد بن عبید اللہ بیان کرتے ہیں کہ انہوں نے ان پر سختی کی، جنہیں پا سکے قید کر کے صعدہ بھیج دیا اور وادی کے اوپر سے نیچے تک ان پر ہتھیار اٹھانے سے ممانعت کر دی، تو ملک امن میں رہا یہاں تک کہ قحط چھٹ گیا۔
  es: "Ali ibn Muhammad relata que una hambruna asoló Yemen hasta el punto de que la gente se devoraba entre sí, y un grupo de Banu al-Harith y Yam se sublevó contra el gobernador de al-Hadi en Najran; Muhammad ibn Ubaydallah relata que los presionó duramente, encarceló a los que pudo capturar y los envió a Sa'da, y les prohibió llevar armas desde la parte alta del valle hasta su fondo, por lo que la tierra estuvo segura hasta que cesó la hambruna."
  fr: "Ali ibn Muhammad rapporte qu'une famine s'abattit sur le Yémen au point que les gens se dévoraient entre eux, et qu'un groupe de Banu al-Harith et de Yam se souleva contre le gouverneur d'al-Hadi à Najran; Muhammad ibn Ubaydallah rapporte qu'il réprima sévèrement leur arrestation, emprisonna ceux qu'il put capturer et les envoya à Sa'da, et leur interdit de transporter des armes du haut de la vallée jusqu'à son bas, de sorte que le pays fut en sécurité jusqu'à la fin de la famine."
  tr: "Ali bin Muhammed rivayet eder ki, Yemen'de kıtlık baş gösterdi ve insanlar birbirlerini yedi. Beni el-Harith ve Yam kabilelerinden bir grup, Necran'da Hadi'nin temsilcisine karşı ayaklandı. Muhammed bin Ubeydullah rivayet eder ki, temsilci onları kontrol altına aldı, yakalayabildiklerini hapse attı ve Sa'de'ye getirdi. Vadinin tepesinden dibine kadar silah taşımalarını yasakladı ve kıtlık ortadan kalkana kadar ülke güvende kaldı."
  id: "Ali bin Muhammad meriwayatkan bahwa kelaparan melanda seluruh Yaman hingga orang-orang saling memakan satu sama lain. Sekelompok orang dari Bani al-Harith dan Yam memberontak melawan agen al-Hadi di Najran. Muhammad bin Ubaid Allah meriwayatkan bahwa ia memperketat cengkeramannya pada mereka, memenjarakan orang-orang yang dapat ditangkapnya, dan membawa mereka ke Sa'dah. Ia melarang mereka membawa senjata dari puncak lembah ke dasarnya, dan negara itu aman hingga kelaparan mereda."
