label: { ar: "عهد ابن خازم المفتعل على خراسان", en: "Ibn Khazim's Forged Covenant over Khurasan", es: "El pacto forjado de Ibn Khazim sobre Khurasan", fr: "L'alliance forgée par Ibn Khazim sur le Khurasan", ur: "خراسان پر ابن خزیم کا جعلی عہد", tr: "İbn Hazım'ın Horasan'la ilgili sahte antlaşması", id: "Perjanjian palsu Ibnu Khazim atas Khurasan" }
summary:
  ar: "افتعل ابن خازم عهداً على لسان ابن عامر وتولى خراسان فاجتمعت بها جموع الترك ففضهم ثم قدم البصرة قبل قتل عثمان."
  en: "Ibn Khazim contrived a covenant on Ibn Amir's tongue and took Khurasan; the Turkish masses gathered against him and he scattered them, then came to Basra before Uthman's killing."
  es: "Ibn Khazim ideó un pacto con Ibn Amir y tomó Jorasán; las masas turcas se reunieron contra él y él las dispersó, luego llegó a Basora antes del asesinato de Uthman."
  fr: "Ibn Khazim conclut un pacte avec Ibn Amir et prit le Khorasan; les masses turques se rassemblèrent contre lui et il les dispersa, puis arriva à Bassora avant la mort d'Uthman."
  ur: "ابن خزیم نے ابن عامر کی زبان پر ایک عہد باندھا اور خراسان پر قبضہ کر لیا۔ ترک عوام اس کے خلاف جمع ہوئی اور اس نے انہیں منتشر کردیا، پھر عثمان کے قتل سے پہلے بصرہ آیا۔"
  tr: "İbn Hazim, İbn Amir'in yetkisine dayanarak bir antlaşma uydurdu ve Horasan'ın yönetimini ele geçirdi. Orada Türk ordularını topladı, sonra dağıttı ve Osman'ın öldürülmesinden önce Basra'ya geldi."
  id: "Ibn Khazim membuat perjanjian atas otoritas Ibn Amir dan mengambil alih Khorasan, di mana ia mengumpulkan pasukan Turki, kemudian ia membubarkan mereka dan kemudian datang ke Basra sebelum pembunuhan Utsman."
