id: event/al-hadi-sends-abdullah-ibn-al-husayn-against-abu-al-dughaysh-285
class: event
kind: other
label:
  ar: إرسال الهادي أخاه عبد الله بن الحسين على أبي الدغيش الشهابي في وسحة، ربيع الآخر 285هـ
  en: Al-Hadi sends his brother Abdullah ibn al-Husayn against Abu al-Dughaysh al-Shihabi at Wasaha, Rabi' II 285 AH
  ur: ہادی کا اپنے بھائی عبد اللہ بن الحسین کو وسحہ میں ابو الدغیش شہابی کے خلاف بھیجنا، ربیع الآخر 285ھ
  es: "Al-Hadi envía a su hermano Abdullah ibn al-Husayn contra Abu al-Dughaysh al-Shihabi en Wasaha, Rabi' II 285 AH"
  fr: "Al-Hadi envoie son frère Abdullah ibn al-Husayn contre Abu al-Dughaysh al-Shihabi à Wasaha, Rabi' II 285 AH"
  tr: "El-Hadi, kardeşi Abdullah bin El-Hüseyin'i, H. 285'te Rabi' Al-Thani'deki Vasah'taki Ebu El-Dağış El-Şehabi'ye gönderdi."
  id: "Al-Hadi mengutus saudaranya Abdullah bin Al-Hussein kepada Abu Al-Daghish Al-Shahabi di Wasah, Rabi’ Al-Thani 285 H."
summary:
  ar: أقام الهادي بصعدة ربيعاً الأول واثني عشر يوماً من ربيع الآخر ثم جاءه كتاب عامله على وسحة بأن أبا الدغيش الشهابي جمع جمعاً كثيراً ومنع الصدقات وأنه حاربه، فعسكر الهادي بالبقمة قرب صعدة ودعا أبا الدغيش فأبى، فأرسل أخاه عبد الله بن الحسين يوم الخميس 16 ربيع الآخر في عسكر كثير؛ ورفض أبو الدغيش دعوات متكررة إلى الحق وإلى الأمان، فاستعد القتال.
  en: Al-Hadi stayed at Sa'da through Rabi' I and twelve days of Rabi' II; then came a letter from his governor at Wasaha that Abu al-Dughaysh al-Shihabi had gathered a large force and withheld the alms, and that he had fought him; al-Hadi camped at al-Buqma near Sa'da and sent men to call Abu al-Dughaysh, who refused, and on Thursday 16 Rabi' II sent his brother Abdullah ibn al-Husayn with a large force; Abu al-Dughaysh rejected repeated calls to the truth and to security, and the fighting was prepared.
  ur: ہادی صعدہ میں ربیع الاول اور ربیع الآخر کے بارہ دن رہے؛ پھر وسحہ پر ان کے عامل کا خط آیا کہ ابو الدغیش شہابی نے بڑی جمعیت جمع کر لی اور صدقات روک دیے اور اس نے ان سے جنگ کی ہے؛ ہادی نے صعدہ کے قریب البقمہ میں خیمہ لگایا اور ابو الدغیش کو بلانے آدمی بھیجے، اس نے انکار کیا، اور جمعرات 16 ربیع الآخر کو اپنے بھائی عبد اللہ بن الحسین کو بڑے لشکر کے ساتھ بھیجا؛ ابو الدغیش نے حق اور امان کی بار بار دعوت رد کی اور لڑائی کی تیاری ہوئی۔
  es: "Al-Hadi permaneció en Sa'da durante el primer día de Rabi' y doce días del segundo día de Rabi'; luego llegó una carta de su gobernador en Wasaha informándole de que Abu al-Dughaysh al-Shihabi había reunido una gran fuerza y retenido las limosnas, y que había luchado contra él; al-Hadi acampó en al-Buqma, cerca de Sa'da, y envió hombres a buscar a Abu al-Dughaysh, quien se negó, y el jueves 16 de Rabi' II envió a su hermano Abdullah ibn al-Husayn con una gran fuerza; Abu al-Dughaysh rechazó los repetidos llamamientos a la verdad y a la seguridad, y se preparó la lucha."
  fr: "Al-Hadi resta à Sa'da pendant tout le mois de Rabi' I et douze jours de Rabi' II; puis il reçut une lettre de son gouverneur de Wasaha l'informant qu'Abu al-Dughaysh al-Shihabi avait rassemblé une importante armée et retenait l'aumône, et qu'il l'avait combattu; al-Hadi campa à al-Buqma près de Sa'da et envoya des hommes appeler Abu al-Dughaysh, qui refusa, et le jeudi 16 Rabi' II envoya son frère Abdullah ibn al-Husayn avec une importante armée; Abu al-Dughaysh rejeta les appels répétés à la vérité et à la sécurité, et le combat était prêt."
  tr: "El-Hadi, ilkbaharın ilk gününde ve ikinci ilkbaharın on iki gününde Sa'de'de kaldı. Sonra Washah'taki temsilcisinden kendisine bir mektup geldi; mektupta Ebu el-Daghish el-Şahabi'nin büyük bir ordu topladığı, sadaka vermeyi engellediği ve onunla savaştığı belirtiliyordu. Bunun üzerine El-Hadi, Sa'de yakınlarındaki el-Baqmah'ta kamp kurdu ve Ebu el-Daghish'i çağırdı, ancak o reddetti. Bunun üzerine, ikinci ilkbaharın 16. Perşembe günü, büyük bir orduyla kardeşi Abdullah bin el-Hüseyin'i gönderdi. Ebu el-Daghish, hakikat ve güvenliğe yönelik tekrarlanan çağrıları reddetti ve savaşa hazırlanmaya başladı."
  id: "Al-Hadi tinggal di Sa'dah selama musim semi pertama dan dua belas hari musim semi kedua. Kemudian sebuah surat datang kepadanya dari agennya di Washah yang menyatakan bahwa Abu al-Daghish al-Shahabi telah mengumpulkan pasukan besar dan mencegah pemberian sedekah, dan bahwa ia telah memeranginya. Maka al-Hadi berkemah di al-Baqmah dekat Sa'dah dan memanggil Abu al-Daghish, tetapi ia menolak. Maka ia mengirim saudaranya Abdullah bin al-Hussein pada hari Kamis, tanggal 16 musim semi kedua, dengan pasukan besar. Abu al-Daghish menolak seruan berulang-ulang untuk kebenaran dan keselamatan, sehingga ia bersiap untuk berperang."
