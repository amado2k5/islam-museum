id: event/al-hadi-sends-abdullah-ibn-al-husayn-against-abu-al-dughaysh-285
class: event
kind: other
label:
  ar: إرسال الهادي أخاه عبد الله بن الحسين على أبي الدغيش الشهابي في وسحة، ربيع الآخر 285هـ
  en: Al-Hadi sends his brother Abdullah ibn al-Husayn against Abu al-Dughaysh al-Shihabi at Wasaha, Rabi' II 285 AH
  ur: ہادی کا اپنے بھائی عبد اللہ بن الحسین کو وسحہ میں ابو الدغیش شہابی کے خلاف بھیجنا، ربیع الآخر 285ھ
summary:
  ar: أقام الهادي بصعدة ربيعاً الأول واثني عشر يوماً من ربيع الآخر ثم جاءه كتاب عامله على وسحة بأن أبا الدغيش الشهابي جمع جمعاً كثيراً ومنع الصدقات وأنه حاربه، فعسكر الهادي بالبقمة قرب صعدة ودعا أبا الدغيش فأبى، فأرسل أخاه عبد الله بن الحسين يوم الخميس 16 ربيع الآخر في عسكر كثير؛ ورفض أبو الدغيش دعوات متكررة إلى الحق وإلى الأمان، فاستعد القتال.
  en: Al-Hadi stayed at Sa'da through Rabi' I and twelve days of Rabi' II; then came a letter from his governor at Wasaha that Abu al-Dughaysh al-Shihabi had gathered a large force and withheld the alms, and that he had fought him; al-Hadi camped at al-Buqma near Sa'da and sent men to call Abu al-Dughaysh, who refused, and on Thursday 16 Rabi' II sent his brother Abdullah ibn al-Husayn with a large force; Abu al-Dughaysh rejected repeated calls to the truth and to security, and the fighting was prepared.
  ur: ہادی صعدہ میں ربیع الاول اور ربیع الآخر کے بارہ دن رہے؛ پھر وسحہ پر ان کے عامل کا خط آیا کہ ابو الدغیش شہابی نے بڑی جمعیت جمع کر لی اور صدقات روک دیے اور اس نے ان سے جنگ کی ہے؛ ہادی نے صعدہ کے قریب البقمہ میں خیمہ لگایا اور ابو الدغیش کو بلانے آدمی بھیجے، اس نے انکار کیا، اور جمعرات 16 ربیع الآخر کو اپنے بھائی عبد اللہ بن الحسین کو بڑے لشکر کے ساتھ بھیجا؛ ابو الدغیش نے حق اور امان کی بار بار دعوت رد کی اور لڑائی کی تیاری ہوئی۔
