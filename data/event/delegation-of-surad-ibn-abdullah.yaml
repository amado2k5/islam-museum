label: { ar: "قدوم صرد بن عبد الله الأزدي وإسلامه", en: "Surad ibn Abdullah al-Azdi comes to the Prophet and embraces Islam", es: "Surad ibn Abdullah al-Azdi acude al Profeta y abraza el Islam.", fr: "Surad ibn Abdullah al-Azdi se rend auprès du Prophète et embrasse l'islam." }
summary:
  ar: "قدم صرد بن عبد الله الأزدي في وفد من الأزد على النبي فأسلم وحسن إسلامه، فأمّره النبي على من أسلم من قومه وأمره أن يجاهد بمن أسلم من كان يليه من أهل الشرك من قبائل اليمن."
  en: "Surad ibn Abdullah al-Azdi came in an Azd delegation to the Prophet and became a good Muslim; the Prophet set him over the Muslims of his people and ordered him to fight, with those who had converted, the neighbouring polytheist tribes of Yemen."
  es: "Surad ibn Abdullah al-Azdi llegó al Profeta en una delegación de Azd y se convirtió en un buen musulmán; el Profeta lo puso al frente de los musulmanes de su pueblo y le ordenó luchar, junto con los que se habían convertido, contra las tribus politeístas vecinas de Yemen."
  fr: "Surad ibn Abdullah al-Azdi vint en délégation Azd auprès du Prophète et devint un bon musulman; le Prophète le mit à la tête des musulmans de son peuple et lui ordonna de combattre, avec ceux qui s'étaient convertis, les tribus polythéistes voisines du Yémen."
