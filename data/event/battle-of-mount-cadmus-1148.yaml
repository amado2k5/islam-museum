  id: "Catatan pendahuluan tentang Pertempuran Gunung Cadmus pada tahun 1148 M, penyergapan Seljuk terhadap pasukan Louis VII dalam Kampanye Kedua; sumber-sumbernya belum ditinjau di halaman ini."
