id: event/tarsus-falls-354
class: event
kind: conquest
label: { ar: "سقوط طرسوس بيد الروم 354هـ", en: "Tarsus falls to the Byzantines, 354", es: "Tarso cae en manos de los bizantinos, 354", fr: "Tarse tombe aux mains des Byzantins en 354." }
summary:
  ar: "في سنة أربع وخمسين وثلثمائة جاء ملك الروم إلى الصيصة ففتحها وقتل من أهلها مقتلة عظيمة وساق من بقي وكانوا نحو مائتي ألف، ومضى إلى طرسوس طالباً لحصارها فأذعنوا بالطاعة فأعطاهم الأمان فدخلها وأمرهم بالانتقال عنها فانتقلوا، وجعل المسجد الجامع إصطبلاً لدوابه ونقل ما فيه من القناديل إلى بلده وأحرق المنبر، ثم أمر بعمارتها فتراجع أهلها وتنصّر بعضهم {cite:muntazam-ibn-al-jawzi j.7 p.28}."
  en: "In 354 the Byzantine emperor took Sis with a great slaughter and marched on Tarsus; the city surrendered on aman, its people were moved out, the congregational mosque made a stable for his beasts, its candelabra carried off and the minbar burned; on rebuilding some of its people returned and some converted {cite:muntazam-ibn-al-jawzi j.7 p.28}."
  es: "En 354, el emperador bizantino tomó Sis con una gran matanza y marchó sobre Tarso; la ciudad se rindió en amán, su gente fue evacuada, la mezquita congregacional se convirtió en un establo para sus bestias, sus candelabros fueron robados y el minbar fue incendiado; al reconstruirse, algunos de sus habitantes regresaron y otros se convirtieron {cite:muntazam-ibn-al-jawzi j.7 p.28}."
  fr: "En 354, l'empereur byzantin prit Sis avec un grand massacre et marcha sur Tarse; la ville se rendit à aman, ses habitants furent déplacés, la mosquée du vendredi fut transformée en étable pour ses bêtes, ses candélabres furent emportés et le minbar brûlé; lors de la reconstruction, certains de ses habitants revinrent et d'autres se convertirent {cite:muntazam-ibn-al-jawzi j.7 p.28}."
