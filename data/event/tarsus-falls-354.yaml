id: event/tarsus-falls-354
class: event
kind: conquest
label: { ar: "سقوط طرسوس بيد الروم 354هـ", en: "Tarsus falls to the Byzantines, 354", es: "Tarso cae en manos de los bizantinos, 354", fr: "Tarse tombe aux mains des Byzantins en 354.", ur: "ٹارسس بازنطینیوں میں آتا ہے، 354", tr: "Tarsus'un Hicri 354 yılında Romalılara düşmesi", id: "Jatuhnya Tarsus ke tangan Romawi pada tahun 354 AH" }
summary:
  ar: "في سنة أربع وخمسين وثلثمائة جاء ملك الروم إلى الصيصة ففتحها وقتل من أهلها مقتلة عظيمة وساق من بقي وكانوا نحو مائتي ألف، ومضى إلى طرسوس طالباً لحصارها فأذعنوا بالطاعة فأعطاهم الأمان فدخلها وأمرهم بالانتقال عنها فانتقلوا، وجعل المسجد الجامع إصطبلاً لدوابه ونقل ما فيه من القناديل إلى بلده وأحرق المنبر، ثم أمر بعمارتها فتراجع أهلها وتنصّر بعضهم {cite:muntazam-ibn-al-jawzi j.7 p.28}."
  en: "In 354 the Byzantine emperor took Sis with a great slaughter and marched on Tarsus; the city surrendered on aman, its people were moved out, the congregational mosque made a stable for his beasts, its candelabra carried off and the minbar burned; on rebuilding some of its people returned and some converted {cite:muntazam-ibn-al-jawzi j.7 p.28}."
  es: "En 354, el emperador bizantino tomó Sis con una gran matanza y marchó sobre Tarso; la ciudad se rindió en amán, su gente fue evacuada, la mezquita congregacional se convirtió en un establo para sus bestias, sus candelabros fueron robados y el minbar fue incendiado; al reconstruirse, algunos de sus habitantes regresaron y otros se convirtieron {cite:muntazam-ibn-al-jawzi j.7 p.28}."
  fr: "En 354, l'empereur byzantin prit Sis avec un grand massacre et marcha sur Tarse; la ville se rendit à aman, ses habitants furent déplacés, la mosquée du vendredi fut transformée en étable pour ses bêtes, ses candélabres furent emportés et le minbar brûlé; lors de la reconstruction, certains de ses habitants revinrent et d'autres se convertirent {cite:muntazam-ibn-al-jawzi j.7 p.28}."
  ur: "354 میں بازنطینی شہنشاہ نے سیس کو ایک عظیم ذبح کے ساتھ لیا اور ترسوس پر چڑھائی کی۔ امن پر شہر نے ہتھیار ڈال دیے، اس کے لوگوں کو باہر نکال دیا گیا، اجتماعی مسجد نے اپنے درندوں کے لیے ایک اصطبل بنایا، اس کا شمع روشن کیا اور منبر جل گیا۔ دوبارہ تعمیر کرنے پر اس کے کچھ لوگ واپس آئے اور کچھ نے مذہب تبدیل کر لیا"
  tr: "Hicri 354 yılında Roma kralı Sisa'ya geldi ve şehri fethetti; halkının büyük bir kısmını öldürdü ve yaklaşık iki yüz bin kişiyi de sürgün etti. Tarsus'u kuşatmak için oraya gitti, ancak halk ona itaat etti ve kral onları korudu. Kral şehre girdi ve halkın oradan uzaklaşmasını emretti, onlar da uzaklaştılar. Kral, Mescid-i Haram'ı hayvanları için ahır yaptı, kandilleri ülkesine götürdü ve minberi yaktı. Sonra yeniden inşasını emretti, böylece halk geri döndü ve bazıları Hristiyanlığa geçti. {cite:muntazam-ibn-al-jawzi j.7 p.28}"
  id: "Pada tahun 354 H, raja Romawi datang ke Sisa dan menaklukkannya, membunuh sejumlah besar penduduknya dan mengusir sisanya, yang berjumlah sekitar dua ratus ribu orang. Ia pergi ke Tarsus untuk mengepungnya, sehingga mereka tunduk dan ia memberi mereka perlindungan. Ia memasuki kota itu dan memerintahkan mereka untuk pindah, sehingga mereka pun pindah. Ia menjadikan Masjid Agung sebagai kandang hewan ternaknya dan memindahkan lampu-lampu dari masjid itu ke negerinya serta membakar mimbar. Kemudian ia memerintahkan pembangunan kembali masjid tersebut, sehingga penduduknya kembali dan sebagian dari mereka memeluk agama Kristen. {cite:muntazam-ibn-al-jawzi j.7 p.28}."
