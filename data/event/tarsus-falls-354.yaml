summary:
  ar: "في سنة أربع وخمسين وثلثمائة جاء ملك الروم إلى الصيصة ففتحها وقتل من أهلها مقتلة عظيمة وساق من بقي وكانوا نحو مائتي ألف، ومضى إلى طرسوس طالباً لحصارها فأذعنوا بالطاعة فأعطاهم الأمان فدخلها وأمرهم بالانتقال عنها فانتقلوا، وجعل المسجد الجامع إصطبلاً لدوابه ونقل ما فيه من القناديل إلى بلده وأحرق المنبر، ثم أمر بعمارتها فتراجع أهلها وتنصّر بعضهم {cite:muntazam-ibn-al-jawzi j.7 p.28}."
  en: "In 354 the Byzantine emperor took Sis with a great slaughter and marched on Tarsus; the city surrendered on aman, its people were moved out, the congregational mosque made a stable for his beasts, its candelabra carried off and the minbar burned; on rebuilding some of its people returned and some converted {cite:muntazam-ibn-al-jawzi j.7 p.28}."
