id: event/ali-declines-to-retain-muawiya
class: event
kind: other
label: { ar: "رفض علي إبقاء معاوية في ولايته", en: "Ali declines to keep Muawiya in office", es: "Ali se niega a mantener a Muawiya en el cargo.", fr: "Ali refuse de maintenir Muawiya au pouvoir.", ur: "علی نے معاویہ کو عہدے پر برقرار رکھنے سے انکار کردیا۔" }
summary:
  ar: "بعد مبايعته بالخلافة، أشار عليه المغيرة بن شعبة بإبقاء معاوية على الشام مؤقتاً، وأشار ابن عباس بأن العزل يُثير أهل الشام، فرفض علي وقال إنه لا يستعمل معاوية يومين {cite:abqariyyat-ali-aqqad p.94}. ويرى العقاد أن علياً كان محقاً في امتناعه، لأن معاوية لم يكن واليا يقنع بولايته، بل كان يبني دولة لنفسه وذريته ويتخذ مقتل عثمان فرصة لها {cite:abqariyyat-ali-aqqad p.96}."
  en: "After the pledge of allegiance, al-Mughira ibn Shu'ba advised keeping Muawiya in Syria for a while and Ibn Abbas warned that dismissal would stir Syria; Ali refused, saying he would not employ Muawiya for two days {cite:abqariyyat-ali-aqqad p.94}. Al-Aqqad judges that Ali was right, since Muawiya was building a state for himself and his heirs {cite:abqariyyat-ali-aqqad p.96}."
  es: "Tras el juramento de lealtad, al-Mughira ibn Shu'ba aconsejó mantener a Muawiya en Siria durante un tiempo, e Ibn Abbas advirtió que su destitución convulsionaría Siria; Ali se negó, afirmando que no emplearía a Muawiya durante dos días {cite:abqariyyat-ali-aqqad p.94}. Al-Aqqad considera que Ali tenía razón, puesto que Muawiya estaba construyendo un estado para sí mismo y sus herederos {cite:abqariyyat-ali-aqqad p.96}."
  fr: "Après le serment d'allégeance, al-Mughira ibn Shu'ba conseilla de maintenir Muawiya en Syrie quelque temps, tandis qu'Ibn Abbas avertit que son renvoi risquait de provoquer des troubles en Syrie. Ali refusa, déclarant qu'il ne ferait pas appel à Muawiya pendant deux jours (voir Abqariyyat-Ali-Aqqad, p. 94). Al-Aqqad estime qu'Ali avait raison, car Muawiya était en train de bâtir un État pour lui-même et ses héritiers (voir Abqariyyat-Ali-Aqqad, p. 96)."
  ur: "بیعت کے بعد، المغیرہ ابن شعبہ نے معاویہ کو کچھ عرصے کے لیے شام میں رکھنے کا مشورہ دیا اور ابن عباس نے خبردار کیا کہ برطرفی شام میں ہلچل مچا دے گی۔ علی نے انکار کرتے ہوئے کہا کہ وہ معاویہ کو دو دن تک ملازمت نہیں دیں گے العقاد فیصلہ کرتا ہے کہ علی صحیح تھے، چونکہ معاویہ اپنے اور اپنے وارثوں کے لیے ایک ریاست بنا رہا تھا"
