id: event/ali-declines-to-retain-muawiya
class: event
kind: other
label: { ar: "رفض علي إبقاء معاوية في ولايته", en: "Ali declines to keep Muawiya in office" }
summary:
  ar: "بعد مبايعته بالخلافة، أشار عليه المغيرة بن شعبة بإبقاء معاوية على الشام مؤقتاً، وأشار ابن عباس بأن العزل يُثير أهل الشام، فرفض علي وقال إنه لا يستعمل معاوية يومين {cite:abqariyyat-ali-aqqad p.94}. ويرى العقاد أن علياً كان محقاً في امتناعه، لأن معاوية لم يكن واليا يقنع بولايته، بل كان يبني دولة لنفسه وذريته ويتخذ مقتل عثمان فرصة لها {cite:abqariyyat-ali-aqqad p.96}."
  en: "After the pledge of allegiance, al-Mughira ibn Shu'ba advised keeping Muawiya in Syria for a while and Ibn Abbas warned that dismissal would stir Syria; Ali refused, saying he would not employ Muawiya for two days {cite:abqariyyat-ali-aqqad p.94}. Al-Aqqad judges that Ali was right, since Muawiya was building a state for himself and his heirs {cite:abqariyyat-ali-aqqad p.96}."
