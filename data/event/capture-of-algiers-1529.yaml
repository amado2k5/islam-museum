id: event/capture-of-algiers-1529
class: event
kind: conquest
label: { ar: "أخذ حصن بينون ⁦(١٥٢٩م)⁩", en: "Capture of the Peñón of Algiers (1529)", fr: "La prise du Peñón d'Alger (1529)", es: "Captura del Peñón de Argel (1529)", ur: "الجزائر کے پیون پر قبضہ (1529)", tr: "Binnun Kalesi'nin Ele Geçirilmesi (1529 MS)", id: "Perebutan Benteng Binnun (1529 M)" }
summary:
  ar: "استولى خير الدين بربروسة سنة ١٥٢٩م على حصن بينون الأسباني على الجزيرة المواجهة لبلدة الجزائر، بعد أن ظل يقصفه بقذائف مدافعه طوال عشرين يوماً حتى تداعت جوانبه، ثم اقتحمه مع قوات كثيفة حملتها خمس وأربعون سفينة من الساحل، وأسر قائد الحصن مع كبار ضباطه. ويعدّ المؤلف هذا الاستيلاء بداية تأسيس نيابة الجزائر، فصار ميناء الجزائر عاصمة كبرى للمغرب الأوسط ولكل شمال أفريقية العثمانية فيما بعد {cite:dawlat-uthmaniyya-salabi p. 214}."
  en: "In 1529 Khayr al-Din took the Spanish Peñón off Algiers after a twenty-day bombardment, storming it with troops landed by 45 ships and capturing its commander and senior officers — the founding act, in al-Salabi's account, of the Ottoman eyalet of Algiers {cite:dawlat-uthmaniyya-salabi p. 214}."
  fr: "En 1529, Khayr al-Din prit le Peñón espagnol au large d'Alger après un bombardement de vingt jours, le prenant d'assaut avec des troupes débarquées par 45 navires et capturant son commandant et ses officiers supérieurs : l'acte fondateur, selon le récit d'al-Salabi, de l'eyalet ottoman d'Alger {cite:dawlat-uthmaniyya-salabi p. 214}."
  es: "En 1529, Khayr al-Din tomó el Peñón español frente a Argel después de un bombardeo de veinte días, asaltándolo con tropas desembarcadas por 45 barcos y capturando a su comandante y oficiales superiores; el acto fundacional, según el relato de al-Salabi, del eyalato otomano de Argel {cite:dawlat-uthmaniyya-salabi p. 214}."
  ur: "1529 میں خیرالدین نے بیس دن کی بمباری کے بعد ہسپانوی پیون کو الجزائر سے اتار لیا، 45 بحری جہازوں سے اترنے والے فوجیوں کے ساتھ اس پر دھاوا بول دیا اور اس کے کمانڈر اور سینئر افسروں کو گرفتار کر لیا - یہ بانی ایکٹ، السلابی کے کھاتے میں، الجزائر کے عثمانی سلطنت کا ہے۔ 214}۔"
  tr: "1529 yılında, Khair ad-Din Barbarossa, Cezayir'in karşısındaki adada bulunan İspanyol Peñón kalesini, yirmi gün boyunca toplarıyla bombalayarak surlarını yıktıktan sonra ele geçirdi. Ardından kıyıdan kırk beş gemiyle taşınan büyük bir kuvvetle kaleye saldırdı ve kale komutanını ve üst düzey subaylarını esir aldı. Yazar bu ele geçirmeyi Cezayir Naipliği'nin başlangıcı olarak değerlendirir ve Cezayir limanı daha sonra Orta Mağrip'in ve tüm Osmanlı Kuzey Afrika'sının önemli bir başkenti haline gelir. {cite:dawlat-uthmaniyya-salabi s. 214}"
  id: "Pada tahun 1529 M, Khair ad-Din Barbarossa merebut benteng Spanyol Peñón di pulau yang berhadapan dengan Aljir, setelah membombardirnya dengan meriam selama dua puluh hari hingga temboknya runtuh. Kemudian ia menyerbu benteng tersebut dengan pasukan besar yang diangkut oleh empat puluh lima kapal dari pantai, dan menangkap komandan benteng serta para perwira seniornya. Penulis menganggap penaklukan ini sebagai awal dari Kedaulatan Aljir, dan pelabuhan Aljir kemudian menjadi ibu kota utama Maghreb tengah dan seluruh Afrika Utara Utsmaniyah. {cite:dawlat-uthmaniyya-salabi hlm. 214}"
