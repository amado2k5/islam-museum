label: { ar: "أخذ حصن بينون ⁦(١٥٢٩م)⁩", en: "Capture of the Peñón of Algiers (1529)" }
summary:
  ar: "استولى خير الدين بربروسة سنة ١٥٢٩م على حصن بينون الأسباني على الجزيرة المواجهة لبلدة الجزائر، بعد أن ظل يقصفه بقذائف مدافعه طوال عشرين يوماً حتى تداعت جوانبه، ثم اقتحمه مع قوات كثيفة حملتها خمس وأربعون سفينة من الساحل، وأسر قائد الحصن مع كبار ضباطه. ويعدّ المؤلف هذا الاستيلاء بداية تأسيس نيابة الجزائر، فصار ميناء الجزائر عاصمة كبرى للمغرب الأوسط ولكل شمال أفريقية العثمانية فيما بعد {cite:dawlat-uthmaniyya-salabi p. 214}."
  en: "In 1529 Khayr al-Din took the Spanish Peñón off Algiers after a twenty-day bombardment, storming it with troops landed by 45 ships and capturing its commander and senior officers — the founding act, in al-Salabi's account, of the Ottoman eyalet of Algiers {cite:dawlat-uthmaniyya-salabi p. 214}."
