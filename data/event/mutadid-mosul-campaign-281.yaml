label: { ar: "حملة المعتضد على الموصل وقلعة ماردين", en: "Al-Mu'tadid's campaign against Mosul and the castle of Mardin", es: "La campaña de Al-Mu'tadid contra Mosul y el castillo de Mardin", fr: "La campagne d'Al-Mu'tadid contre Mossoul et le château de Mardin", ur: "المتدید کی موصل اور ماردین کے قلعے کے خلاف مہم", tr: "El-Mu'tadid'in Musul ve Mardin kalesine karşı yürüttüğü sefer", id: "Kampanye Al-Mu'tadid melawan Mosul dan benteng Mardin" }
summary:
  ar: "في سنة إحدى وثمانين ومائتين خرج المعتضد إلى الموصل عامدًا لحمدان بن حمدون لما بلغه أنه مال إلى هارون الشاري، فتحصّن حمدان في قلاعه، ثم عمد المعتضد إلى قلعة ماردين فحارب من فيها يومه، وصعد القلعة حتى قرُب من الباب فصاح يا حمدان فأجابه فقال افتح الباب ففُتح، فقعد المعتضد في الباب ونُقل ما في القلعة ثم أمر بهدمها فهُدمت {cite:muntazam-ibn-al-jawzi p. 147}."
  en: "In 281 al-Mu'tadid marched on Mosul against Hamdan ibn Hamdun, who had leaned toward the Kharijite Harun al-Shari; Hamdan took refuge in his fortresses, and the caliph himself climbed Mardin's castle to the gate, ordered it opened, seated himself in it, emptied the castle and had it demolished {cite:muntazam-ibn-al-jawzi p. 147}."
  es: "En 281, al-Mu'tadid marchó sobre Mosul contra Hamdan ibn Hamdun, quien se había inclinado hacia el jariyí Harun al-Shari; Hamdan se refugió en sus fortalezas, y el propio califa subió al castillo de Mardin hasta la puerta, ordenó que la abrieran, se sentó en ella, vació el castillo y lo mandó demoler {cite:muntazam-ibn-al-jawzi p. 147}."
  fr: "En 281, al-Mu'tadid marcha sur Mossoul contre Hamdan ibn Hamdun, qui s'était rapproché du Kharijite Harun al-Shari; Hamdan se réfugia dans ses forteresses, et le calife lui-même escalada le château de Mardin jusqu'à la porte, ordonna son ouverture, s'y assit, vida le château et le fit démolir {cite:muntazam-ibn-al-jawzi p. 147}."
  ur: "281 میں المتدید نے ہمدان بن حمدون کے خلاف موصل پر مارچ کیا، جو خارجی ہارون الشری کی طرف جھکاؤ رکھتا تھا۔ ہمدان نے اپنے قلعوں میں پناہ لی، اور خلیفہ خود ماردین کے قلعے کے دروازے پر چڑھا، اسے کھولنے کا حکم دیا، خود اس میں بیٹھا، قلعہ کو خالی کر دیا اور اسے منہدم کر دیا۔ 147}۔"
  tr: "281 yılında, Hamdan ibn Hamdun'un Harun el-Şeri'nin tarafını tuttuğunu duyunca, El-Mu'tadid Hamdan ibn Hamdun'la yüzleşmek için Musul'a gitti. Hamdan kalelerinde kendini tahkim etti ve bunun üzerine El-Mu'tadid Mardin kalesine giderek o gün oradakilerle savaştı. Kaleye tırmanıp kapıya yaklaştığında, \"Ey Hamdan!\" diye bağırdı. Hamdan ona cevap verdi, bunun üzerine \"Kapıyı aç!\" dedi ve kapı açıldı. El-Mu'tadid kapıda oturdu ve kalenin içindekiler hareket ettirildi, sonra da yıkılmasını emretti ve yıkıldı. {cite:muntazam-ibn-al-jawzi s. 147}"
  id: "Pada tahun 281, Al-Mu’tadid pergi ke Mosul untuk menghadapi Hamdan ibn Hamdun ketika ia mendengar bahwa Hamdan telah berpihak kepada Harun al-Shari. Hamdan membentengi dirinya di kastil-kastilnya, dan kemudian Al-Mu’tadid pergi ke benteng Mardin dan bertempur melawan orang-orang di dalamnya pada hari itu. Ia mendaki benteng hingga mendekati gerbang dan berteriak, “Wahai Hamdan!” Hamdan menjawabnya, lalu ia berkata, “Bukalah gerbang!” dan gerbang itu terbuka. Al-Mu’tadid duduk di gerbang dan apa yang ada di dalam benteng itu dipindahkan, kemudian ia memerintahkan agar benteng itu dihancurkan, dan benteng itu pun dihancurkan. {cite:muntazam-ibn-al-jawzi p. 147}"
