label: { ar: "حملة المعتضد على الموصل وقلعة ماردين", en: "Al-Mu'tadid's campaign against Mosul and the castle of Mardin" }
summary:
  ar: "في سنة إحدى وثمانين ومائتين خرج المعتضد إلى الموصل عامدًا لحمدان بن حمدون لما بلغه أنه مال إلى هارون الشاري، فتحصّن حمدان في قلاعه، ثم عمد المعتضد إلى قلعة ماردين فحارب من فيها يومه، وصعد القلعة حتى قرُب من الباب فصاح يا حمدان فأجابه فقال افتح الباب ففُتح، فقعد المعتضد في الباب ونُقل ما في القلعة ثم أمر بهدمها فهُدمت {cite:muntazam-ibn-al-jawzi p. 147}."
  en: "In 281 al-Mu'tadid marched on Mosul against Hamdan ibn Hamdun, who had leaned toward the Kharijite Harun al-Shari; Hamdan took refuge in his fortresses, and the caliph himself climbed Mardin's castle to the gate, ordered it opened, seated himself in it, emptied the castle and had it demolished {cite:muntazam-ibn-al-jawzi p. 147}."
