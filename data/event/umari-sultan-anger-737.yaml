label:
  ar: "سخط الناصر على ابن فضل الله وعزله، نحو ٧٣٧هـ/١٣٣٧م"
  en: "al-Nasir's anger and al-Umari's dismissal, c. 737/1337"
  ur: "ناصر کا غصہ اور عمری کی معزولی، تقریباً 737ھ/1337ء"
  es: "La ira de al-Nasir y el despido de al-Umari, c. 737/1337"
  fr: "La colère d'al-Nasir et le renvoi d'al-Umari, vers 737/1337"
  tr: "El-Nasir, İbn Fadlallah'tan hoşnut kalmadı ve onu yaklaşık 737 Hicri/1337 Miladi yılında görevden aldı."
  id: "Al-Nasir tidak senang dengan Ibnu Fadlallah dan memecatnya, sekitar tahun 737 H/1337 M."
summary:
  ar: "سأل تنكز الناصر أن يقرر علم الدين ابن القطب في كتابة السر، فأنكر ابن فضل الله لكونه قبطيًا، ولما طُلب منه أن يزيد في معلوم ابن القطب قال مستشاطًا: «أما يكفي أن يكون كاتب السر حتى يزاد معلومه؟» ثم قام بين يدي السلطان وقال: «خدمتك عليّ حرام»؛ فاشتد غضب الناصر وأمر بإقامة أخيه علاء الدين مكانه وإلزامه بيته {cite:durar-kamina-jil-1993 1/332} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  en: "When Tankiz asked al-Nasir to confirm Alam al-Din Ibn al-Qutb as katib al-sirr, Ibn Fadl Allah objected that he was a Copt; ordered to raise Ibn al-Qutb's salary he flared, 'Is it not enough that he is katib al-sirr, that his pay must be raised too?' then rose before the sultan saying, 'Your service is forbidden me.' Al-Nasir's wrath burst: he had Ahmad's brother Ala al-Din installed in his place and confined him to his house {cite:durar-kamina-jil-1993 1/332} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  ur: "جب تنکز نے ناصر سے علم الدین ابن قطب کو کاتبِ سر مقرر کرنے کی درخواست کی تو ابن فضل اللہ نے اس پر اعتراض کیا کہ وہ قبطی ہے؛ جب اس سے ابن قطب کی تنخواہ بڑھانے کو کہا گیا تو وہ بھڑک اٹھا: «کیا یہ کافی نہیں کہ وہ کاتبِ سر ہے کہ اس کی تنخواہ بھی بڑھائی جائے؟» پھر وہ سلطان کے سامنے کھڑا ہوا اور کہا: «تمھاری خدمت مجھ پر حرام ہے۔» ناصر کا غضب بھڑکا؛ اس نے اس کے بھائی علاء الدین کو اس کی جگہ بٹھایا اور اسے گھر میں قید کر دیا {cite:durar-kamina-jil-1993 1/332} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}۔"
  es: "Cuando Tankiz le pidió a al-Nasir que confirmara a Alam al-Din Ibn al-Qutb como katib al-sirr, Ibn Fadl Allah objetó que era copto; se le ordenó aumentar el salario de Ibn al-Qutb, y exclamó furioso: \"¿No basta con que sea katib al-sirr, que también se le debe aumentar el sueldo?\", luego se levantó ante el sultán diciendo: \"Me está prohibido servirte\". La ira de al-Nasir estalló: hizo que el hermano de Ahmad, Ala al-Din, lo instalara en su lugar y lo confinó en su casa {cite:durar-kamina-jil-1993 1/332} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  fr: "Lorsque Tankiz demanda à al-Nasir de confirmer la nomination d'Alam al-Din Ibn al-Qutb comme katib al-sirr, Ibn Fadl Allah objecta qu'il était copte. Sommé d'augmenter le salaire d'Ibn al-Qutb, il s'emporta: « N'est-il pas suffisant qu'il soit katib al-sirr, que son salaire doive également être augmenté ? » Puis il se leva devant le sultan et déclara: « Votre service m'est interdit. » La colère d'al-Nasir éclata: il fit installer le frère d'Ahmad, Ala al-Din, à sa place et le fit assigner à résidence."
  tr: "Tankiz, el-Nasir'den Alam el-Din İbn el-Kutb'u sekreter olarak atamasını istedi, ancak İbn Fadlallah, Kıpti olduğu için bunu reddetti. İbn el-Kutb'un maaşının artırılması istendiğinde öfkeyle, \"Zaten sekreter olması yetmiyor mu, maaşını neden artıralım?\" dedi. Sonra Sultan'ın önünde durarak, \"Size hizmet etmek bana haramdır\" dedi. El-Nasir çok öfkelendi ve kardeşi Alam el-Din'in onun yerine getirilmesini ve evine kapatılmasını emretti."
  id: "Tankiz meminta al-Nasir untuk mengangkat Alam al-Din Ibn al-Qutb sebagai sekretaris, tetapi Ibn Fadlallah menolak karena ia seorang Koptik. Ketika diminta untuk menaikkan gaji Ibn al-Qutb, ia berkata dengan marah, \"Bukankah sudah cukup ia menjadi sekretaris tanpa menaikkan gajinya?\" Kemudian ia berdiri di hadapan Sultan dan berkata, \"Melayani Anda adalah haram bagi saya.\" Al-Nasir menjadi sangat marah dan memerintahkan agar saudaranya, Ala al-Din, ditempatkan di tempatnya dan dikurung di rumahnya."
