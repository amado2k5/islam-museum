label: { ar: "إعادة الحجر الأسود إلى موضعه" }
summary:
  ar: "في سنة تسع وثلاثين أعيد الحجر الأسود إلى موضعه بعد أكثر من عشرين سنة عند القرامطة وجعل له طوق فضة يشد به وزنه ثلاثة آلاف وسبع مئة وتسعون درهماً ونصف، وقال محمد بن نافع الخزاعي تأملت الحجر وهو مقلوع فإذا السواد في رأسه فقط وسائره أبيض وطوله قدر عظم الذراع {cite:tarikh-khulafa-minhaj-1434 p. 616}."
  en: "In 339 the Black Stone was restored to its place after more than twenty years with the Qarmatians — a silver band of three thousand seven hundred and ninety and a half dirhams' weight fastened it. Muhammad ibn Nafi' al-Khuza'i, who examined it while it lay uprooted, said the blackness was only at its head, the rest white, its length a forearm's bone {cite:tarikh-khulafa-minhaj-1434 p. 616}."
