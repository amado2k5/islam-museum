id: event/black-stone-return-339
class: event
kind: other
label: { ar: "إعادة الحجر الأسود إلى موضعه", en: "Return of the Black Stone to its place", fr: "Le retour de la Pierre noire à sa place", es: "El regreso de la Piedra Negra a su lugar.", ur: "حجر اسود کی اس کی جگہ پر واپسی۔", tr: "Kara Taşı yerine geri döndürmek", id: "Mengembalikan Batu Hitam ke tempatnya" }
summary:
  ar: "في سنة تسع وثلاثين أعيد الحجر الأسود إلى موضعه بعد أكثر من عشرين سنة عند القرامطة وجعل له طوق فضة يشد به وزنه ثلاثة آلاف وسبع مئة وتسعون درهماً ونصف، وقال محمد بن نافع الخزاعي تأملت الحجر وهو مقلوع فإذا السواد في رأسه فقط وسائره أبيض وطوله قدر عظم الذراع {cite:tarikh-khulafa-minhaj-1434 p. 616}. وعند ابن الأثير وعند ابن الأثير أعاد القرامطة الحجر الأسود إلى مكة سنة 339هـ وقالوا أخذناه بأمر وأديناه بأمر، وكان بجكم قد بذل لهم في رده خمسين ألف دينار فلم يجيبوه وردوه الآن بغير شيء في ذي القعدة فلما أرادوا رده حملوه إلى الكوفة وعلقوه بجامعها حتى رآه الناس ثم حملوه إلى مكة وكانوا أخذوه من ركن البيت الحرام سنة سبع عشرة وثلاثمائة وكان مكثه عندهم اثنتين وعشرين سنة {cite:kamil-ibn-al-athir p. 364}، وعند ابن الجوزي وفي ذي القعدة سنة 339هـ رد الحجر الأسود الذي كان أبو طاهر سليمان بن الحسن الهجري أخذه من الكعبة وعلق على الأسطوانة السابعة من مسجد الكوفة وقد كان يحكم بذل في رده خمسين ألف دينار فلم يردوه وقيل أخذناه بأمر وإذا ورد الأمر برده رددناه فلما كان في ذي القعدة كتب إخوة أبي طاهر كتاباً يذكرون فيه أنهم ردوا الحجر بأمر من أخذوه بأمره ليتم مناسك الناس وحجهم فرد إلى موضعه {cite:muntazam-ibn-al-jawzi p. 659-660} وعند ابن الجوزي رُدّ في ذي القعدة سنة تسع وثلاثين وقد كان أبو طاهر علّقه على الأسطوانة السابعة من مسجد الكوفة، وكان يُحكم بذل في رده خمسون ألف دينار فلم يرد وقال أخذناه بأمر وإذا ورد الأمر برده رددناه، فكتب إخوة أبي طاهر أنهم ردوه بأمر من أخذه بأمره ليتم مناسك الناس وحجهم {cite:muntazam-ibn-al-jawzi p. 661}."
  en: "In 339 the Black Stone was restored to its place after more than twenty years with the Qarmatians — a silver band of three thousand seven hundred and ninety and a half dirhams' weight fastened it. Muhammad ibn Nafi' al-Khuza'i, who examined it while it lay uprooted, said the blackness was only at its head, the rest white, its length a forearm's bone {cite:tarikh-khulafa-minhaj-1434 p. 616}."
  fr: "En 339, la Pierre noire fut remise à sa place après plus de vingt ans chez les Qarmates ; un cerclage d'argent du poids de trois mille sept cent quatre-vingt-dix dirhams et demi la fixa. Muhammad ibn Nafi' al-Khuza'i, qui l'examina alors qu'elle était arrachée, dit que la noirceur n'était qu'à son sommet, le reste étant blanc, et que sa longueur était celle d'un os d'avant-bras {cite:tarikh-khulafa-minhaj-1434 p. 616}."
  es: "En el año 339, la Piedra Negra fue devuelta a su lugar después de más de veinte años en manos de los cármatas; una banda de plata de tres mil setecientos noventa y medio dirhams la sujetaba. Muhammad ibn Nafi' al-Khuza'i, quien la examinó mientras yacía desarraigada, dijo que la negrura solo se encontraba en su cabeza, el resto era blanco y su longitud era la de un hueso del antebrazo {cite:tarikh-khulafa-minhaj-1434 p. 616}."
  ur: "339 میں حجر اسود کو بیس سال سے زائد عرصے کے بعد قرمطیوں کے ساتھ اپنی جگہ پر بحال کیا گیا - تین ہزار سات سو نوے درہم وزنی چاندی کی پٹی نے اسے مضبوط کیا۔ محمد بن نافع الخزاعی، جس نے اسے اکھاڑتے ہوئے اس کا جائزہ لیا، کہا کہ کالا صرف اس کے سر پر تھا، باقی سفید، اس کی لمبائی ایک بازو کی ہڈی تھی۔ 616}۔"
  tr: "Hicri 339 yılında, Kara Taş, Karmatililerin elinde yirmi yıldan fazla kaldıktan sonra yerine geri getirildi. Etrafına üç bin yedi yüz doksan buçuk dirhem ağırlığında gümüş bir bant takıldı. Muhammed ibn Nafi' el-Huza'i şöyle dedi: \"Taşı yerinden sökülmüş haldeyken inceledim ve sadece baş kısmının siyah olduğunu, geri kalanının beyaz olduğunu ve uzunluğunun bir kol uzunluğunda olduğunu gördüm.\" (Kaynak: tarikh-khulafa-minhaj-1434 s. 616). İbn el-Athir'e göre, Karmatililer Kara Taşı Hicri 339 yılında Mekke'ye geri getirdiler ve şöyle dediler: \"Emirle aldık ve emirle geri getirdik.\" Bajkam, geri getirilmesi için onlara elli bin dinar teklif etmişti, ancak onlar karşılık vermediler. Şimdi Zilhicce ayında hiçbir şey vermeden geri getirdiler. Onu geri vermek istediklerinde, Kufe'ye götürüp oradaki camiye astılar ki insanlar onu görebilsinler. Sonra da Mekke'ye götürdüler. Onu Hicri 317 yılında Kutsal Ev'in bir köşesinden almışlardı ve yirmi iki yıl boyunca yanlarında kalmıştı. (Kaynak: Kamil İbn el-Sih, s. 364) İbn el-Cevzi'ye göre, Hicri 339 yılının Zilhicce ayında, Ebu Tahir Süleyman ibn Hasan el-Hicri'nin Kâbe'den alıp Kufe Camii'nin yedinci sütununa astığı Kara Taş iade edildi. İadesi için elli bin dinar ödenmesini emretmişti, ancak iade etmediler. \"Emirle aldık, iade emri gelirse iade ederiz\" denildi. Zilhicce ayında Ebu Tahir'in kardeşleri, insanların ibadet ve hac ibadetlerinin tamamlanabilmesi için, onu emirle alan kişinin emriyle iade ettiklerini belirten bir mektup yazdılar. Böylece taş yerine geri konuldu. (Kaynak: Muntazam İbn el-Cevzi, s. 659-660) İbn el-Cevzi'ye göre, 39. yılın Zilhicce ayında geri döndü. Ebu Tahir onu Kufe Camii'nin yedinci sütununa asmıştı ve geri vermek için elli bin dinar ödemeye karar vermişti, ancak geri vermedi. \"Emir üzerine aldık ve geri verme emri gelirse geri vereceğiz\" dedi. Bunun üzerine Ebu Tahir'in kardeşleri, insanların ibadetleri ve hacları tamamlanabilsin diye, emir üzerine alan kişinin emriyle geri verdiklerini yazdılar. {cite:muntazam-ibn-al-jawzi s. 661}"
  id: "Pada tahun 339 H, Batu Hitam dikembalikan ke tempatnya setelah lebih dari dua puluh tahun berada di tangan kaum Qarmatian. Sebuah pita perak diletakkan di sekelilingnya, dengan berat tiga ribu tujuh ratus sembilan puluh setengah dirham. Muhammad ibn Nafi' al-Khuza'i berkata, \"Aku memeriksa batu itu ketika terlepas, dan aku mendapati bahwa hanya bagian atasnya yang berwarna hitam, sedangkan sisanya berwarna putih, dan panjangnya sepanjang lengan.\" (kutipan:tarikh-khulafa-minhaj-1434 hlm. 616). Menurut Ibn al-Athir, kaum Qarmatian mengembalikan Batu Hitam ke Mekah pada tahun 339 H, dengan mengatakan, \"Kami mengambilnya atas perintah dan kami mengembalikannya atas perintah.\" Bajkam telah menawarkan mereka lima puluh ribu dinar untuk pengembaliannya, tetapi mereka tidak menanggapi. Mereka mengembalikannya sekarang tanpa imbalan apa pun di Dzul Qi'dah. Ketika mereka ingin mengembalikannya, mereka membawanya ke Kufa dan menggantungnya di masjidnya agar orang-orang dapat melihatnya. Kemudian mereka membawanya ke Mekah. Mereka mengambilnya dari sudut Baitullah pada tahun 317 Hijriah, dan benda itu tetap bersama mereka selama dua puluh dua tahun. (kutipan:kamil-ibn-al-athir hlm. 364), dan menurut Ibn al-Jawzi, pada bulan Dzul Qa'dah tahun 339 H, Batu Hitam dikembalikan, yang diambil oleh Abu Tahir Sulayman ibn al-Hasan al-Hijri dari Ka'bah dan digantungkan pada pilar ketujuh Masjid Kufa. Beliau menetapkan bahwa lima puluh ribu dinar harus dibayarkan untuk pengembaliannya, tetapi mereka tidak mengembalikannya. Dikatakan bahwa kami mengambilnya atas perintah, dan jika perintah untuk mengembalikannya datang, kami akan mengembalikannya. Maka ketika tiba bulan Dzul Qa'dah, saudara-saudara Abu Tahir menulis surat yang menyebutkan bahwa mereka telah mengembalikan batu itu atas perintah orang yang mengambilnya atas perintah, agar ritual dan ibadah haji orang-orang dapat diselesaikan. Maka batu itu dikembalikan ke tempatnya. {kutipan:muntazam-ibn-al-jawzi hlm. 659-660} Menurut Ibn al-Jawzi, itu adalah Dikembalikan pada bulan Dzul Qa'dah tahun 39. Abu Tahir telah menggantungkannya di pilar ketujuh Masjid Kufa, dan ia telah memutuskan untuk membayar lima puluh ribu dinar untuk mengembalikannya, tetapi ia tidak mengembalikannya. Ia berkata, “Kami mengambilnya atas perintah, dan jika perintah untuk mengembalikannya datang, kami akan mengembalikannya.” Maka saudara-saudara Abu Tahir menulis bahwa mereka mengembalikannya atas perintah orang yang mengambilnya atas perintah, agar ritual dan ibadah haji orang-orang dapat diselesaikan. {kutipan:muntazam-ibn-al-jawzi hlm. 661}."
