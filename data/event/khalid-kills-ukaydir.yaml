id: event/khalid-kills-ukaydir
class: event
kind: conquest
label: { ar: "قتل أكيدر وفتح دومة الجندل", en: "Khalid Kills Ukaydir and Takes Dumat al-Jandal", es: "Khalid mata a Ukaydir y se lleva a Dumat al-Jandal", fr: "Khalid tue Ukaydir et prend Dumat al-Jandal", ur: "خالد نے عقیدیر کو قتل کر دیا اور دمت الجندل لے لیا۔", tr: "Akider öldürüldü ve Dumat el-Cendal fethedildi.", id: "Akider terbunuh dan Dumat al-Jandal ditaklukkan." }
summary:
  ar: "عند البلاذري: لما قُبض النبي منع أكيدر الصدقة ونقض العهد وخرج من دومة الجندل فلحق بالحيرة وابتنى بها بناء سماه دومة على اسم دومة الجندل، وأسلم أخوه حريث بن عبد الملك على ما في يده فسُلّم له؛ فبعث أبو بكر خالد بن الوليد وهو بمين التمر يأمره أن يسير إلى أكيدر فسار إليه فقتله وفتح دومة ثم مضى إلى الشام، وعند الواقدي أن خالداً لما تشخص من العراق يريد الشام مرّ بدومة الجندل ففتحها وأصاب سباياً كان منهن ليلى بنت الجودي الغساني التي تزوجها بعدئذ عبد الرحمن بن أبي بكر."
  en: "In al-Baladhuri: when the Prophet died Ukaydir withheld the sadaqa, broke the covenant and left Dumat al-Jandal for al-Hira, where he built a residence he called Dawma after Dumat al-Jandal, while his brother Hurayth ibn Abd al-Malik remained Muslim over what was in his hands; Abu Bakr then sent Khalid ibn al-Walid — who was at Mayn al-Tamr — ordering him to march on Ukaydir, so he went, killed him and conquered Dawma before proceeding to Syria; in al-Waqidi's report Khalid passed Dumat al-Jandal on his way from Iraq to Syria, took it and captured prisoners, among them Layla bint al-Judi al-Ghassani whom Abd al-Rahman ibn Abi Bakr later married."
  es: "En al-Baladhuri: cuando el Profeta murió, Ukaydir retuvo la sadaqa, rompió el pacto y dejó Dumat al-Jandal para ir a al-Hira, donde construyó una residencia que llamó Dawma en honor a Dumat al-Jandal, mientras que su hermano Hurayth ibn Abd al-Malik permaneció musulmán sobre lo que estaba en sus manos; Abu Bakr entonces envió a Khalid ibn al-Walid —que estaba en Mayn al-Tamr— ordenándole que marchara sobre Ukaydir, así que fue, lo mató y conquistó Dawma antes de dirigirse a Siria; en el informe de al-Waqidi, Khalid pasó por Dumat al-Jandal en su camino de Irak a Siria, la tomó y capturó prisioneros, entre ellos Layla bint al-Judi al-Ghassani, con quien Abd al-Rahman ibn Abi Bakr se casó más tarde."
  fr: "Selon al-Baladhuri: à la mort du Prophète, Ukaydir refusa de verser la sadaqa, rompit l’alliance et quitta Dumat al-Jandal pour al-Hira, où il fit construire une résidence qu’il nomma Dawma en hommage à Dumat al-Jandal. Son frère Hurayth ibn Abd al-Malik demeura musulman, se contentant de ce qu’il possédait. Abou Bakr envoya alors Khalid ibn al-Walid, qui se trouvait à Mayn al-Tamr, lui ordonnant de marcher sur Ukaydir. Ce dernier s’exécuta, le tua et conquit Dawma avant de poursuivre sa route vers la Syrie. D’après le récit d’al-Waqidi, Khalid passa par Dumat al-Jandal sur son chemin d’Irak vers la Syrie, s’en empara et fit des prisonniers, parmi lesquels Layla bint al-Judi al-Ghassani, qu’Abd al-Rahman ibn Abi Bakr épousa plus tard."
  ur: "البلادوری میں ہے: جب نبی کی وفات ہوئی تو عقیدیر نے صدقہ روک دیا، عہد توڑ دیا اور دمت الجندل کو حیرہ کے لیے چھوڑ دیا، جہاں اس نے دمت الجندل کے نام سے ایک رہائش گاہ بنائی، جب کہ اس کا بھائی حریث بن عبد الملک اس پر مسلمان رہا جو اس کے ہاتھ میں تھا۔ اس کے بعد ابوبکر نے خالد بن الولید کو بھیجا - جو کہ میین التمر میں تھا - اسے عقیدیر پر چڑھائی کرنے کا حکم دیا، چنانچہ اس نے جا کر اسے قتل کر دیا اور شام کی طرف بڑھنے سے پہلے دوما کو فتح کر لیا۔ الواقدی کی رپورٹ میں ہے کہ خالد عراق سے شام جاتے ہوئے دمت الجندل سے گزرا، اسے لے لیا اور قیدیوں کو پکڑ لیا، ان میں لیلیٰ بنت الجودی الغسانی تھی جن سے عبدالرحمٰن ابن ابی بکر نے بعد میں شادی کی۔"
  tr: "El-Baladhuri'ye göre: Peygamber esir alındığında, Ukaydir zekât vermeyi reddetti, ahdi bozdu ve Dumat el-Cendal'ı terk etti. Hira'ya gitti ve orada Dumat el-Cendal'ın adını verdiği bir bina inşa etti. Kardeşi Harith ibn Abd el-Malik İslam'ı kabul etti ve elindeki her şeyi teslim etti. Ebu Bekir, Mayn el-Tamr'da bulunan Halid ibn el-Valid'i Ukaydir'e gitmesi için gönderdi. O da Ukaydir'e gitti, onu öldürdü ve Dumat el-Cendal'ı fethetti. Sonra Levant'a gitti. El-Vakidi'ye göre, Halid Levant'a gitmek amacıyla Irak'tan yola çıktığında Dumat el-Cendal'dan geçti, orayı fethetti ve esirler aldı; bunlar arasında daha sonra Abd el-Rahman ibn Ebu Bekir'in evlendiği Leyla bint el-Cudi el-Ghasani de vardı."
  id: "Menurut Al-Baladhuri: Ketika Nabi ditangkap, Ukaydir menolak untuk memberikan sedekah, melanggar perjanjian, dan meninggalkan Dumat al-Jandal. Dia pergi ke Hira dan membangun sebuah bangunan di sana yang diberi nama Dumat, sesuai dengan Dumat al-Jandal. Saudaranya, Harith ibn Abd al-Malik, masuk Islam dan menyerahkan harta miliknya. Abu Bakr mengutus Khalid ibn al-Walid, yang berada di Mayn al-Tamr, memerintahkannya untuk pergi menemui Ukaydir. Maka ia pergi menemuinya, membunuhnya, dan menaklukkan Dumat al-Jandal. Kemudian ia pergi ke Levant. Menurut Al-Waqidi, ketika Khalid berangkat dari Irak dengan maksud pergi ke Levant, ia melewati Dumat al-Jandal, menaklukkannya, dan menangkap tawanan, di antaranya Layla bint al-Judi al-Ghassani, yang kemudian dinikahi oleh Abd al-Rahman ibn Abi Bakr."
