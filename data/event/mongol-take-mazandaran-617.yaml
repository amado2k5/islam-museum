id: event/mongol-take-mazandaran-617
class: event
kind: campaign
label: { ar: "استيلاء التتر على مازندران وأخذ ذخائر أم خوارزم شاه", en: "The Mongols Seize Mazandaran and the Treasures of Khwarazm-shah's Mother", es: "Los mongoles se apoderan de Mazandarán y de los tesoros de la madre de Khwarazm-shah.", fr: "Les Mongols s'emparent du Mazandaran et des trésors de la mère du Khwarezm-shah", ur: "منگولوں نے مازندران اور خوارزم شاہ کی والدہ کے خزانے پر قبضہ کر لیا" }
summary:
  ar: "لما أيست طائفة التتر المغربة من إدراك خوارزم شاه في قلعته بالبحر عادوا فقصدوا بلاد مازندران فملكوها في أسرع وقت مع حصانتها وصعوبة الدخول إليها؛ ويذكر ابن الأثير أنها لم تزل ممتنعة قديم الزمان وحديثه حتى إن المسلمين لما ملكوا بلاد الأكاسرة جميعها من العراق إلى أقاصي خراسان بقيت أعمال مازندران يؤخذ منهم الخراج ولا يقدرون على دخولها إلى أن ملكت أيام سليمان بن عبد الملك سنة تسعين، فملكها هؤلاء صفواً وقتلوا وسبوا ونهبوا وأحرقوا، وسلكوا نحو الري فرأوا في الطريق والدة خوارزم شاه ونساءه وأموالهم وذخائرهم التي لم يسمع بمثلها من الأعلاق النفيسة إذ كانت قد فارقت خوارزم قاصدة الري فأصفهان لتستحصن فصادفوها قبل وصولها، فسيروا الجميع إلى جنكزخان بسمرقند {cite:kamil-ibn-al-athir p. 408}."
  en: "When the western Mongol detachment despaired of catching Khwarazm-shah in his fortress by the sea, they turned back and made for Mazandaran, which they took very quickly despite its strength and the difficulty of entering it. Ibn al-Athir notes that it had always resisted, old and new: when the Muslims had taken all the Sasanian lands from Iraq to the far reaches of Khurasan, the districts of Mazandaran still paid tribute while the Muslims could not enter, until it was conquered in the days of Sulayman ibn Abd al-Malik in 90. Now the Mongols took it outright, killing, enslaving, plundering and burning. They then headed for Rayy and came upon the mother of Khwarazm-shah, with his women, property and treasures, precious goods the like of which had never been heard of, for she had left Khwarazm making for Rayy and then Isfahan to seek refuge, and they caught her before she arrived. They sent everything on to Genghis Khan at Samarkand {cite:kamil-ibn-al-athir p. 408}."
  es: "Cuando el destacamento mongol occidental perdió la esperanza de capturar a Khwarazm-shah en su fortaleza junto al mar, retrocedieron y se dirigieron a Mazandarán, que tomaron con rapidez a pesar de su fortaleza y la dificultad de entrar. Ibn al-Athir señala que siempre había resistido, tanto antigua como recientemente: cuando los musulmanes tomaron todas las tierras sasánidas desde Irak hasta los confines de Jorasán, los distritos de Mazandarán aún pagaban tributo mientras los musulmanes no podían entrar, hasta que fue conquistada en tiempos de Sulayman ibn Abd al-Malik en el año 90. Ahora los mongoles la tomaron por completo, matando, esclavizando, saqueando e incendiando. Luego se dirigieron a Rayy y encontraron a la madre de Khwarazm-shah, con sus mujeres, propiedades y tesoros, bienes preciosos como nunca se había oído, pues había abandonado Khwarazm rumbo a Rayy y luego a Isfahán para buscar refugio, y la capturaron antes de que llegara. Enviaron todo a Genghis Khan en Samarcanda {cite:kamil-ibn-al-athir p. 408}."
  fr: "Lorsque le détachement mongol occidental désespéra de capturer Khwarezm-shah dans sa forteresse maritime, il rebroussa chemin vers le Mazandaran, qu'il prit rapidement malgré sa robustesse et la difficulté d'y pénétrer. Ibn al-Athir note que cette région avait toujours résisté, depuis l'Antiquité: lorsque les musulmans avaient conquis toutes les terres sassanides, de l'Irak jusqu'aux confins du Khorasan, les districts du Mazandaran continuaient de payer un tribut tant que les musulmans ne pouvaient y entrer, jusqu'à sa conquête sous le règne de Sulayman ibn Abd al-Malik en 90. Les Mongols s'emparèrent alors de la région, massacrant, réduisant en esclavage, pillant et incendiant. Ils se dirigèrent ensuite vers Rayy et tombèrent sur la mère de Khwarezm-shah, avec ses femmes, ses biens et ses trésors, des richesses d'une valeur inestimable, car elle avait quitté Khwarezm pour se réfugier à Rayy puis à Ispahan, et ils la capturèrent avant son arrivée. Ils ont tout envoyé à Gengis Khan à Samarcande {cite:kamil-ibn-al-athir p. 408}."
  ur: "جب مغربی منگول دستہ خوارزم شاہ کو سمندر کے کنارے اس کے قلعے میں پکڑنے سے مایوس ہوا تو وہ واپس مڑ گئے اور مازندران کی طرف روانہ ہو گئے، جسے انہوں نے اس کی طاقت اور اس میں داخل ہونے کی دشواری کے باوجود بہت جلد پکڑ لیا۔ ابن الثیر نوٹ کرتا ہے کہ اس نے ہمیشہ پرانی اور نئی مزاحمت کی ہے: جب مسلمانوں نے عراق سے خراسان کے دور دراز تک تمام ساسانی سرزمینوں کو لے لیا تھا، مازندران کے اضلاع نے تب بھی خراج ادا کیا تھا جب کہ مسلمان داخل نہیں ہو سکتے تھے، یہاں تک کہ 90 میں سلیمان بن عبد الملک کے زمانے میں اسے فتح کر لیا گیا۔ جل رہا ہے اس کے بعد وہ رے کی طرف روانہ ہوئے اور خوارزم شاہ کی ماں کے پاس اس کی عورتوں، املاک اور خزانے، قیمتی سامان کے ساتھ آئے جس کے بارے میں کبھی نہیں سنا تھا، کیونکہ وہ خوارزم سے ری اور پھر اصفہان سے پناہ لینے کے لیے نکلی تھی، اور اس کے پہنچنے سے پہلے ہی انہوں نے اسے پکڑ لیا۔ انہوں نے سمرقند میں چنگیز خان کے پاس سب کچھ بھیج دیا۔ 408}۔"
