summary:
  ar: "لما أيست طائفة التتر المغربة من إدراك خوارزم شاه في قلعته بالبحر عادوا فقصدوا بلاد مازندران فملكوها في أسرع وقت مع حصانتها وصعوبة الدخول إليها؛ ويذكر ابن الأثير أنها لم تزل ممتنعة قديم الزمان وحديثه حتى إن المسلمين لما ملكوا بلاد الأكاسرة جميعها من العراق إلى أقاصي خراسان بقيت أعمال مازندران يؤخذ منهم الخراج ولا يقدرون على دخولها إلى أن ملكت أيام سليمان بن عبد الملك سنة تسعين، فملكها هؤلاء صفواً وقتلوا وسبوا ونهبوا وأحرقوا، وسلكوا نحو الري فرأوا في الطريق والدة خوارزم شاه ونساءه وأموالهم وذخائرهم التي لم يسمع بمثلها من الأعلاق النفيسة إذ كانت قد فارقت خوارزم قاصدة الري فأصفهان لتستحصن فصادفوها قبل وصولها، فسيروا الجميع إلى جنكزخان بسمرقند {cite:kamil-ibn-al-athir p. 408}."
