id: event/killing-of-man-ibn-zaida
class: event
kind: death
label: { ar: "مقتل معن بن زائدة", en: "The Killing of Ma'n ibn Za'ida", es: "El asesinato de Ma'n ibn Za'ida", fr: "Le meurtre de Ma'n ibn Za'ida" }
summary:
  ar: "خاف معن بن زائدة الشتاء وهجومه فانصرف إلى بست وأنكر قوم من الخوارج سيرته فاندسوا مع فعلة كانوا يبنون في منزله بناء فلما بلغوا التسقيف احتالوا لسيوفهم فجعلوها في حزم القصب ثم دخلوا عليه قبته وهو يحتجم ففتكوا به وشق بعضهم بطنه بخنجر كان معه وقال أحدهم وضربه على رأسه أبو الغلام الطاقي والطاق رستاق بقرب زرنج فقتلهم يزيد بن مزيد فلم ينج منهم أحد ثم إن يزيد قام بأمر سجستان واشتدت على العرب والعجم من أهلها وطأته فاحتال بعض العرب فكتب على لسانه إلى المنصور كتاباً يخبره فيه أن كتب المهدي إليه قد حيرته وأدهشته ويسأله أن يعفيه من معاملته فأغضب ذلك المنصور وشتمه وأقرأ المهدي كتابه فعزله وأمر بحبسه وبيع كل شيء له ثم كلم فيه فأشخص إلى مدينة السلام فلم يزل بها مخبوءاً حتى لقيه الخوارج على الجسر فقاتلهم فتحرك أمره قليلاً ثم توجه إلى يوسف البرم بخراسان فلم يزل في ارتفاع."
  en: "Fearing winter's onset Ma'n withdrew to Bust; Kharijites who resented his rule slipped among the builders at his house, hid their swords in reed bundles at roofing-time, and entered his dome while he was being cupped — they butchered him, one splitting his belly with a dagger, Abu al-Ghulam al-Taqi striking his head. Yazid ibn Mazyad killed every one of them, then held Sijistan, bearing hard on its Arabs and Ajam until forged letters to al-Mansur — that the Mahdi's letters confused him — brought his dismissal, imprisonment and confiscation. Later released, he lay hidden in Madinat al-Salam until Kharijites met him on the bridge and he fought them; then he rose to Yusuf al-Barm in Khurasan."
  es: "Temiendo la llegada del invierno, Ma'n se retiró a Bust. Los jariyíes, resentidos por su gobierno, se infiltraron entre los constructores de su casa, escondieron sus espadas en haces de cañas durante la construcción del tejado y entraron en su cúpula mientras lo estaban curando. Lo masacraron: uno le partió el vientre con una daga y Abu al-Ghulam al-Taqi le golpeó la cabeza. Yazid ibn Mazyad los mató a todos y luego conquistó Sijistan, oprimiendo con dureza a sus árabes y ajam, hasta que unas cartas falsificadas dirigidas a al-Mansur —en las que afirmaba que las cartas del Mahdi lo habían confundido— provocaron su destitución, encarcelamiento y confiscación. Tras ser liberado, permaneció oculto en Madinat al-Salam hasta que los jariyíes lo encontraron en el puente y luchó contra ellos; entonces ascendió a Yusuf al-Barm en Jorasán."
  fr: "Craignant l'arrivée de l'hiver, Ma'n se retira à Bust. Les Kharijites, mécontents de son règne, se fondirent parmi les ouvriers qui travaillaient sur sa maison, dissimulèrent leurs épées dans des fagots de roseaux pendant la pose de la toiture et pénétrèrent dans sa coupole alors qu'on lui servait de vases sacrés. Ils le massacrèrent, l'un lui fendant le ventre d'un coup de poignard, tandis qu'Abu al-Ghulam al-Taqi le frappa à la tête. Yazid ibn Mazyad les tua tous, puis prit le contrôle du Sijistan, réprimant durement ses Arabes et Ajam jusqu'à ce que de fausses lettres adressées à al-Mansur – prétendant que les lettres du Mahdi l'avaient induit en erreur – entraînent sa destitution, son emprisonnement et la confiscation de ses biens. Libéré plus tard, il se cacha à Madinat al-Salam jusqu'à ce que des Kharijites le rencontrent sur le pont et qu'il les combatte; il se rendit ensuite auprès de Yusuf al-Barm au Khorasan."
