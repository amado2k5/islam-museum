label: { ar: "استخراج السيبين وضياع مسلمة", en: "The Sibayn Reclamation and Maslama's Estates", es: "La recuperación de tierras de Sibayn y las propiedades de Maslama", fr: "Le projet de remblaiement de Sibayn et les domaines de Maslama" }
summary:
  ar: "عند البلاذري: انبثقت البثوق أيام الحجاج فكتب الحجاج إلى الوليد بن عبد الملك يعلمه أنه قدر للنفقة على سدها ثلاثة آلاف ألف درهم فاستكثرها الوليد فقال له مسلمة بن عبد الملك أنا أنفق عليها إن تقطعني الأرضين المنخفضة التي يبقى فيها الماء بعد أن ينفق ثلاثة آلاف ألف درهم يتولى إنفاقها ثقتك ونصيحك الحجاج فأجابه إلى ذلك فحصلت له أرضون من طساسيج متصلة فحفر السيبين وتألف الأكرة والمزارعين وعمر تلك الأرضين وألحق بها ضياعاً كثيرة للتعزز بها فلما جاءت الدولة المباركة وقبضت أموال بني أمية أقطع جميع السيبين داود بن علي بن عبد الله بن العباس ثم ابتيع ذلك من ورثته بحقوقه وحدوده فصار من ضياع الخلافة."
  en: "In al-Baladhuri: when breaches burst in al-Hajjaj's days he wrote al-Walid ibn Abd al-Malik that he had costed their damming at three million dirhams; al-Walid found it excessive. Maslama ibn Abd al-Malik said 'I will pay, if you grant me the lowlands that still hold water after the three million is spent by your trusted adviser al-Hajjaj.' Granted, Maslama acquired adjoining tasasij lands, dug al-Sibayn, drew peasants and cultivators, brought the lands under tillage and annexed many estates to fortify himself. When the blessed dawla came and Umayyad wealth was seized, all al-Sibayn was granted to Dawud ibn Ali ibn Abdallah ibn al-Abbas, then bought from his heirs with its rights and bounds — becoming caliphal estates."
  es: "En al-Baladhuri: cuando se produjeron brechas en tiempos de al-Hajjaj, escribió a al-Walid ibn Abd al-Malik que había calculado el coste de su represamiento en tres millones de dirhams; al-Walid lo consideró excesivo. Maslama ibn Abd al-Malik dijo: «Pagaré, si me concedes las tierras bajas que aún retienen agua después de que tu consejero de confianza, al-Hajjaj, haya gastado los tres millones». Tras la concesión, Maslama adquirió tierras colindantes, excavó al-Sibayn, atrajo campesinos y cultivadores, puso las tierras a labrar y anexó numerosas propiedades para fortalecerse. Cuando llegó la bendita dawla y se confiscaron las riquezas omeyas, todo al-Sibayn fue concedido a Dawud ibn Ali ibn Abdallah ibn al-Abbas, quien lo compró a sus herederos con sus derechos y límites, convirtiéndose así en propiedades califales."
  fr: "Selon al-Baladhuri: lorsque des brèches se formèrent sous le règne d’al-Hajjaj, celui-ci écrivit à al-Walid ibn Abd al-Malik pour lui indiquer que le coût de leur construction s’élevait à trois millions de dirhams; al-Walid jugea ce montant excessif. Maslama ibn Abd al-Malik répondit: « Je paierai si vous m’accordez les basses terres encore inondées après que votre conseiller de confiance, al-Hajjaj, aura dépensé les trois millions. » Ceci fut fait. Maslama acquit les terres adjacentes de tasasij, creusa al-Sibayn, y recruta des paysans et des cultivateurs, mit les terres en culture et annexa de nombreux domaines pour se fortifier. Lorsque la dawla bénie survint et que les richesses omeyyades furent confisquées, al-Sibayn fut entièrement octroyée à Dawud ibn Ali ibn Abdallah ibn al-Abbas, puis rachetée à ses héritiers avec ses droits et limites, devenant ainsi un domaine califal."
