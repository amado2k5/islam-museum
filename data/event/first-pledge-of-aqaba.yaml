id: event/first-pledge-of-aqaba
education:
  did_you_know:
    ar: "في موسم الحج سنة ١٢ من البعثة بايع اثنا عشر رجلاً من يثرب النبي عند العقبة بيعة النساء، وبعث معهم مصعب بن عمير يعلمهم القرآن والإسلام."
    en: "In the pilgrimage season of the twelfth year, twelve men of Yathrib pledged the Prophet at Aqaba — the pledge of the women — and he sent Mus'ab ibn Umayr with them to teach the Qur'an and Islam."
    ur: "بعثت کے بارہویں سال موسمِ حج میں یثرب کے بارہ آدمیوں نے عقبہ میں نبی سے «بیعت النساء» کی، اور نبی نے ان کے ساتھ مصعب بن عمیر بھیجا کہ قرآن اور اسلام سکھائیں۔"
    sources: [source/mubarakpuri-raheeq, source/ibn-hisham-sira]
class: event
kind: treaty
label: { ar: "بيعة العقبة الأولى", en: "The first pledge of al-Aqaba" }
summary:
  ar: "في موسم الحج من السنة الثانية عشرة من البعثة جاء اثنا عشر رجلاً من يثرب، خمسة من الستة الذين أسلموا في العام الماضي وسبعة سواهم، فبايعوا النبي عند العقبة بمنى بيعة النساء، وطلب منهم النبي أن يختاروا اثني عشر نقيباً على قومهم، فبعث معهم مصعب بن عمير يعلمهم القرآن والإسلام."
  en: "At the pilgrim season of the twelfth year of the mission twelve men from Yathrib, five of the six who had embraced Islam the year before and seven others, pledged allegiance to the Prophet at al-Aqaba at Mina in the manner of the women's pledge; he asked them to choose twelve chiefs over their people, and sent Mus'ab ibn Umayr with them to teach them the Qur'an and Islam."
