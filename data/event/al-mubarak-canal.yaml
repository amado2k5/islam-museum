id: event/al-mubarak-canal
class: event
kind: other
label: { ar: "حفر نهر المبارك وقنطرة دجلة", en: "al-Mubarak Canal and the Tigris Pontoon" }
summary:
  ar: "عند البلاذري: حفر خالد بن عبد الله القسري المبارك فقال الفرزدق «وكأنك بالمبارك بعد شهر تخوض غموره بقع الكلاب» وقال في شعر له طويل «إن المبارك كاسمه يسقى به نهراً يفيض له على الأنهاد حرث السواد وناعم الجبار أعطى خليفته يقود خالد وكأن دجلة حين أقبل مدها ناب يمد له بحبل قطار». وكتب خالد إلى هشام بن عبد الملك يستأذنه في عمل قنطرة على دجلة فكتب إليه هشام لو كان هذا ممكناً لسبق إليه الفرس فراجعه فكتب إليه إن كنت متيقناً أنها تتم فاعملها فعملها وأعظم النفقة عليها فلم يلبث أن قطعها الماء فأغرمه هشام ما كان أنفق عليها."
  en: "In al-Baladhuri: Khalid ibn Abdallah al-Qasri dug al-Mubarak canal — al-Farazdaq praised it ('al-Mubarak, like its name, waters Sawad's ploughland and the tyrant's lush domain; Tigris at its flood seems a fang stretched out on a caravan rope'). Khalid wrote Hisham ibn Abd al-Malik asking leave to build a pontoon on the Tigris; Hisham answered 'if this were possible the Persians would have preceded us,' and when pressed, 'if you are certain it will hold, do it.' He built it at enormous cost; the water soon cut it, and Hisham made him repay all he had spent."
