label: { ar: "اجتياح التتر بلاد الجبل وأذربيجان والكرج", en: "The Mongol Sweep through Jibal, Azerbaijan and Georgia", es: "La invasión mongola a través de Jibal, Azerbaiyán y Georgia.", fr: "L'invasion mongole à travers Jibal, l'Azerbaïdjan et la Géorgie", ur: "جبل، آذربائیجان اور جارجیا میں منگول جھاڑو" }
summary:
  ar: "في سنة سبع عشرة وستمائة وصل التتر إلى الري في طلب خوارزم شاه على حين غفلة من أهلها فملكوها ونهبوها وسبوا الحريم واسترقوا الأطفال ومضوا مسرعين، فنهبوا في طريقهم كل مدينة وقرية وفعلوا في الجميع أضعاف ما فعلوا في الري حتى تمَّوا على همذان، فخرج رئيسها بالحمل من الأموال والثياب والدواب يطلب الأمان فأمنوهم ثم فارقوها وساروا إلى زنجان ففعلوا أضعاف ذلك، ثم قزوين فاعتصم أهلها بالمدينة وقاتلوهم فدخلوها عنوة واقتتلوا في باطنها حتى صاروا يقتتلون بالسكاكين فعُدّ من أهل قزوين أكثر من أربعين ألف قتيل؛ فلما هجم عليهم الشتاء ساروا إلى أذربيجان فوصلوا تبريز وبها صاحبها أوزبك بن البهلوان فلم يحدث نفسه بقتالهم لاشتغاله بإدمان الشرب ليلاً ونهاراً وإنما صالحهم على مال وثياب ودواب، فساروا إلى ساحل البحر يشتون عليه وتطرفوا إلى بلاد الكرج فقاتلهم من الكرج نحو عشرة آلاف فانهزموا وقتل أكثرهم، وانضاف إلى التتر مملوك تركي من مماليك أوزبك يقال له أقوش جمع التركمان والأكراد وراسل التتر فمالوا إليه للجنسية فسار في مقدمتهم إلى الكرج، حتى اجتمعت الكرج قريب تفليس فلقيهم أقوش أولاً فاقتتلوا قتالاً شديداً وأدركهم التتر وقد تعبوا فانهزموا أقبح هزيمة في ذي القعدة؛ ويقول ابن الأثير تالله لا أشك أن من يجيء بعدنا إذا بَعُد العهد ورأى هذه الحادثة مسطورة ينكرها ويستبعدها والحق بيده {cite:kamil-ibn-al-athir p. 409-410}."
  en: "In 617 the Mongols reached Rayy in pursuit of Khwarazm-shah, catching its people off guard; they seized and plundered it, took the women captive, enslaved the children, and moved on at speed. Along their way they plundered every city and village, doing many times what they had done at Rayy, until they reached Hamadan; its ruler came out with money, garments and mounts seeking safe-conduct, and they granted it and then left, marching on to Zanjan, where they did many times over the same. Then Qazvin: its people sheltered in the city and fought them, but they entered it by storm, and the fighting went on inside until they were cutting one another with knives; more than forty thousand dead were counted among the people of Qazvin. When winter came upon them they went to Azerbaijan and reached Tabriz, where its lord Uzbek ibn al-Bahlawan did not even consider fighting them, being occupied with heavy drinking night and day; he made peace with them for money, garments and mounts. They then went to the sea coast to winter there, and pushed out toward Georgia, where some ten thousand Georgians fought them; they were routed and most of them killed. A Turkic mamluk of Uzbek's named Aqush joined the Mongols; he gathered the Turkmen and Kurds and corresponded with the Mongols, who inclined toward him on account of their shared stock, and he marched at their head into Georgia, until the Georgians gathered near Tiflis. Aqush met them first and they fought fiercely; the Mongols caught up with them when they were exhausted, and they were routed in the worst defeat, in Dhu'l-Qa'da. Ibn al-Athir says: by God, I have no doubt that whoever comes after us, once the time has grown distant and he reads this event written down, will deny it and find it hard to credit, and the truth is in his hands {cite:kamil-ibn-al-athir p. 409-410}."
  es: "En 617, los mongoles llegaron a Rayy persiguiendo a Khwarazm-shah, tomando a su población por sorpresa. La conquistaron y saquearon, capturaron a las mujeres, esclavizaron a los niños y avanzaron a toda velocidad. En su camino, saquearon todas las ciudades y aldeas, repitiendo con creces lo que habían hecho en Rayy, hasta llegar a Hamadán. Su gobernante salió con dinero, vestimentas y monturas pidiendo salvoconducto, que le concedieron y luego partieron, marchando hacia Zanjan, donde repitieron la misma estrategia. Después, llegaron a Qazvin: sus habitantes se refugiaron en la ciudad y lucharon contra ellos, pero los mongoles entraron por asalto y la lucha continuó en el interior hasta que se apuñalaron unos a otros; se contabilizaron más de cuarenta mil muertos entre la población de Qazvin. Cuando llegó el invierno, se dirigieron a Azerbaiyán y llegaron a Tabriz, donde su señor, Uzbek ibn al-Bahlawan, ni siquiera consideró combatirlos, pues estaba ocupado bebiendo día y noche; hizo las paces con ellos a cambio de dinero, vestimentas y monturas. Luego se dirigieron a la costa para pasar el invierno allí, y avanzaron hacia Georgia, donde unos diez mil georgianos lucharon contra ellos; fueron derrotados y la mayoría murió. Un mameluco turco de Uzbekistán llamado Aqush se unió a los mongoles; reunió a turcomanos y kurdos y se carteó con los mongoles, quienes se inclinaron hacia él debido a su origen común, y marchó al frente de ellos hacia Georgia, hasta que los georgianos se reunieron cerca de Tiflis. Aqush los encontró primero y lucharon ferozmente; los mongoles los alcanzaron cuando estaban exhaustos, y fueron derrotados en la peor derrota, en Dhu'l-Qa'da. Ibn al-Athir dice: Por Dios, no tengo duda de que quien venga después de nosotros, cuando haya pasado el tiempo y lea este acontecimiento escrito, lo negará y le resultará difícil de creer, y la verdad está en sus manos {cite:kamil-ibn-al-athir p. 409-410}."
  fr: "En 617, les Mongols atteignirent Rayy à la poursuite de Khwarezm-shah, prenant ses habitants par surprise. Ils s'emparèrent de la ville, la pillèrent, firent des captives parmi les femmes, réduisirent les enfants en esclavage et poursuivirent leur route. Sur leur chemin, ils pillèrent chaque ville et chaque village, répétant à maintes reprises leurs exactions de Rayy, jusqu'à atteindre Hamadan. Son souverain sortit avec de l'argent, des vêtements et des montures, demandant un sauf-conduit. Ils le lui accordèrent, puis repartirent, marchant sur Zanjan, où ils firent de même à plusieurs reprises. Puis vint Qazvin: ses habitants se réfugièrent dans la ville et les combattirent, mais ils y entrèrent par surprise et les combats se poursuivirent à l'intérieur jusqu'à ce que les hommes s'entretuent à coups de couteau; on dénombra plus de quarante mille morts parmi les habitants de Qazvin. L'hiver venu, ils se dirigèrent vers l'Azerbaïdjan et atteignirent Tabriz, où son seigneur, Uzbek ibn al-Bahlawan, trop occupé à boire jour et nuit, ne songea même pas à les combattre; il conclut la paix avec eux en échange d'argent, de vêtements et de montures. Ils se rendirent ensuite sur la côte pour y hiverner, puis marchèrent vers la Géorgie, où quelque dix mille Géorgiens leur opposèrent un combat acharné. Ils furent mis en déroute et la plupart d'entre eux périrent. Un mamelouk turc d'origine ouzbèke nommé Aqush rejoignit les Mongols; il rassembla les Turkmènes et les Kurdes et correspondit avec les Mongols, qui se montrèrent favorables à son égard en raison de leurs origines communes. Il marcha à leur tête en Géorgie, jusqu'à ce que les Géorgiens se rassemblent près de Tiflis. Aqush les affronta le premier et le combat fut acharné; les Mongols les rattrapèrent lorsqu'ils furent épuisés et ils subirent une défaite cuisante à Dhu'l-Qa'da. Ibn al-Athir dit: « Par Dieu, je ne doute pas que quiconque viendra après nous, une fois ce temps lointain et qu'il lira ce récit, le niera et aura du mal à le croire, et la vérité est entre ses mains. » (Voir: Kamil Ibn al-Athir, p. 409-410)."
  ur: "617 میں منگولوں نے خوارزم شاہ کا تعاقب کرتے ہوئے رے پہنچ کر اپنے لوگوں کو حفاظت سے پکڑ لیا۔ انہوں نے اس پر قبضہ کر لیا اور لوٹ مار کی، عورتوں کو اسیر کر لیا، بچوں کو غلام بنا لیا، اور تیزی سے آگے بڑھے۔ راستے میں انہوں نے ہر شہر اور گاؤں کو لوٹ لیا، کئی بار وہی کیا جو انہوں نے رے میں کیا تھا، یہاں تک کہ وہ ہمدان پہنچ گئے۔ اس کے حکمران پیسے، کپڑے اور سواریاں لے کر باہر آئے اور حفاظت کی تلاش میں تھے، اور انہوں نے اسے عطا کیا اور پھر زنجان کی طرف کوچ کر گئے، جہاں انہوں نے کئی بار ایسا ہی کیا۔ پھر قزوین: اس کے لوگوں نے شہر میں پناہ لی اور ان سے لڑے، لیکن وہ طوفان کے ساتھ اس میں داخل ہو گئے، اور لڑائی اندر تک جاری رہی یہاں تک کہ وہ ایک دوسرے کو چھریوں سے کاٹ رہے تھے۔ چالیس ہزار سے زیادہ مرنے والوں کا شمار اہل قزوین میں ہوتا تھا۔ جب ان پر موسم سرما آیا تو وہ آذربائیجان چلے گئے اور تبریز پہنچے جہاں اس کے آقا ازبک ابن بہلوان نے رات دن بہت زیادہ شراب نوشی میں مصروف رہتے ہوئے ان سے لڑنا بھی گوارا نہیں کیا۔ اُس نے اُن سے پیسے، کپڑوں اور سواریوں کے لیے صلح کی۔ پھر وہ موسم سرما کے لیے سمندری ساحل پر گئے، اور جارجیا کی طرف دھکیل دیے، جہاں تقریباً دس ہزار جارجیا ان سے لڑے؛ وہ مارے گئے اور ان میں سے اکثر مارے گئے۔ ازبک کا ایک ترک مملوک آقوش نامی منگولوں میں شامل ہوا۔ اس نے ترکمانوں اور کردوں کو اکٹھا کیا اور منگولوں کے ساتھ خط و کتابت کی، جو ان کے مشترکہ ذخیرے کی وجہ سے اس کی طرف مائل تھے، اور اس نے ان کے سر پر جارجیا کی طرف کوچ کیا، یہاں تک کہ جارجیا کے لوگ تفلس کے قریب جمع ہوگئے۔ عقوش ان سے پہلے ملے اور وہ سخت لڑے۔ جب وہ تھک چکے تھے تو منگولوں نے ان کا ساتھ دیا اور ذوالقعدہ میں انہیں بدترین شکست ہوئی۔ ابن اثیر کہتے ہیں: خدا کی قسم، مجھے اس میں کوئی شک نہیں کہ جو ہمارے بعد آئے گا، ایک بار جب وقت دور ہو جائے گا اور اس نے اس واقعہ کو پڑھ لیا ہے، تو اس کا انکار کرے گا اور اس کا اعتبار کرنا مشکل ہو گا، اور حق اس کے ہاتھ میں ہے۔ 409-410}۔"
