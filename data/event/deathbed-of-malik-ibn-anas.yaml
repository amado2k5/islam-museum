label: { ar: "مرض مالك بن أنس ووصيته في كفنه ووفاته ودفنه بالبقيع", en: "Deathbed, shroud, estate and burial of Malik ibn Anas", ur: "مالک بن انس کا مرضِ وفات، کفن کی وصیت، ترکہ اور بقیع میں تدفین", es: "Lecho de muerte, mortaja, patrimonio y entierro de Malik ibn Anas.", fr: "Lit de mort, linceul, succession et inhumation de Malik ibn Anas", tr: "Malik ibn Anas'ın hastalığı, kefeniyle ilgili vasiyeti, ölümü ve el-Baki'deki defni.", id: "Penyakit Malik ibn Anas, wasiatnya mengenai kain kafannya, kematiannya, dan pemakamannya di al-Baqi'." }
summary:
  ar: "قال إسماعيل بن أبي أويس إن مالكاً مرض أياماً يسيرة، وإنه لما سُئل أهله عما قال عند الموت قالوا: تشهّد ثم تلا آية من سورة الروم في أن تدبير الأمر كله لله في الماضي والمستقبل {cite:siyar-alam-nubala scan vol. 1 p. 3165}. وتوفي صبيحة أربع عشرة من ربيع الأول سنة تسع وسبعين ومئة في رواية ابن سعد عن إسماعيل، وقيل في صفر أو في غير ذلك من ربيع الأول {cite:tarikh-islam-dhahabi scan vol. 14 p. 332}. وروى القاضي عياض أنه أوصى أن يُكفّن في ثياب بيض وأن يُصلى عليه في موضع الجنائز، وصلّى عليه أمير المدينة، وبلغ كفنه خمسة دنانير {cite:siyar-alam-nubala scan vol. 1 p. 3165}، ودُفن بالبقيع باتفاق، وقبره مشهور يُزار {cite:siyar-alam-nubala scan vol. 1 p. 3166}. وتذكر الروايات أنه ترك مئة عمامة وخمس مئة زوج نعال وبُسطاً ومخادّ بيعت بأكثر من خمس مئة دينار {cite:siyar-alam-nubala scan vol. 1 p. 3166}."
  en: "Isma'il ibn Abi Uways said Malik was ill for a few days and that his family, asked what he said at death, replied that he pronounced the testimony of faith and then recited a verse of the sura of the Romans on God's sovereign command over what has been and what will be {cite:siyar-alam-nubala scan vol. 1 p. 3165}. He died on the morning of 14 Rabi' al-Awwal 179 AH in Ibn Sa'd's report from Isma'il, while others say Safar or other days of Rabi' al-Awwal {cite:tarikh-islam-dhahabi scan vol. 14 p. 332}. Al-Qadi Iyad reports that he asked to be shrouded in white garments and prayed over at the place of funerals; the governor of Medina led the prayer and the shroud cost five dinars {cite:siyar-alam-nubala scan vol. 1 p. 3165}; he was buried at al-Baqi' by agreement and his grave is well known and visited {cite:siyar-alam-nubala scan vol. 1 p. 3166}. Reports say he left a hundred turbans and five hundred pairs of sandals, and carpets and cushions sold for over five hundred dinars {cite:siyar-alam-nubala scan vol. 1 p. 3166}."
  ur: "اسماعیل بن ابی اویس کہتے ہیں کہ مالک چند دن بیمار رہے اور جب ان کے گھر والوں سے پوچھا گیا کہ موت کے وقت انھوں نے کیا کہا تو بتایا: انھوں نے شہادت دی پھر سورۂ روم کی ایک آیت پڑھی جو ماضی اور مستقبل میں اللہ ہی کے اقتدارِ امر کے بارے میں ہے {cite:siyar-alam-nubala scan vol. 1 p. 3165}۔ ابن سعد کی اسماعیل سے روایت میں ان کی وفات ربیع الاول 179ھ کی چودہ تاریخ کی صبح ہوئی، اور دوسرے صفر یا ربیع الاول کے دیگر دن بتاتے ہیں {cite:tarikh-islam-dhahabi scan vol. 14 p. 332}۔ قاضی عیاض کے مطابق انھوں نے وصیت کی کہ سفید کپڑوں میں کفنایا جائے اور جنازگاہ میں نماز پڑھی جائے؛ مدینہ کے امیر نے نماز پڑھائی اور کفن پانچ دینار کا تھا {cite:siyar-alam-nubala scan vol. 1 p. 3165}؛ وہ بالاتفاق بقیع میں دفن ہوئے اور ان کی قبر مشہور ہے، زیارت کی جاتی ہے {cite:siyar-alam-nubala scan vol. 1 p. 3166}۔ روایات کے مطابق انھوں نے سو عمامے، پانچ سو جوڑے جوتے اور قالین و گدے چھوڑے جو پانچ سو دینار سے زیادہ میں بکے {cite:siyar-alam-nubala scan vol. 1 p. 3166}۔"
  es: "Isma'il ibn Abi Uways dijo que Malik estuvo enfermo durante unos días y que su familia, al preguntarle qué dijo al morir, respondió que pronunció el testimonio de fe y luego recitó un versículo de la sura de los Romanos sobre el mandato soberano de Dios sobre lo que ha sido y lo que será {cite:siyar-alam-nubala scan vol. 1 p. 3165}. Murió en la mañana del 14 de Rabi' al-Awwal 179 AH en el informe de Ibn Sa'd de Isma'il, mientras que otros dicen Safar u otros días de Rabi' al-Awwal {cite:tarikh-islam-dhahabi scan vol. 14 p. 332}. Al-Qadi Iyad informa que pidió ser amortajado con vestiduras blancas y que se rezara por él en el lugar de los funerales; el gobernador de Medina dirigió la oración y la mortaja costó cinco dinares {cite:siyar-alam-nubala scan vol. 1 pág. 3165}; fue enterrado en al-Baqi' por acuerdo y su tumba es muy conocida y visitada {cite:siyar-alam-nubala scan vol. 1 pág. 3166}. Los informes dicen que dejó cien turbantes y quinientos pares de sandalias, y alfombras y cojines que se vendieron por más de quinientos dinares {cite:siyar-alam-nubala scan vol. 1 pág. 3166}."
  fr: "Ismaïl ibn Abi Uways rapporte que Malik fut malade pendant quelques jours et que sa famille, interrogée sur ses dernières paroles, répondit qu'il avait prononcé la profession de foi puis récité un verset de la sourate An-Roma's évoquant le commandement souverain de Dieu sur le passé et l'avenir (Siyar-Alam-Nubala, vol. 1, p. 3165). Selon le récit d'Ibn Sa'd d'après Ismaïl, il mourut le matin du 14 Rabi' al-Awwal 179 AH, tandis que d'autres sources mentionnent le mois de Safar ou d'autres jours de Rabi' al-Awwal (Tarikh-Islam-Dhahabi, vol. 14, p. 332). Al-Qadi Iyad rapporte qu'il demanda à être enveloppé dans un linceul blanc et qu'une prière soit prononcée sur son corps au lieu des funérailles; le gouverneur de Médine dirigea la prière et le linceul coûta cinq dinars (Siyar-Alam-Nubala, vol. 14, p. 332). Il fut enterré à al-Baqi' d'un commun accord et sa tombe est bien connue et visitée (voir Siyar-Alam-Nubala, vol. 1, p. 3166). Selon les récits, il laissa une centaine de turbans, cinq cents paires de sandales, ainsi que des tapis et des coussins vendus pour plus de cinq cents dinars (voir Siyar-Alam-Nubala, vol. 1, p. 3166)."
  tr: "İsmail ibn Abi Uveys, Malik'in birkaç gün hasta olduğunu ve ailesine ölüm anında ne söylediği sorulduğunda, Şehadet getirdiğini ve ardından Rum Suresi'nden, geçmiş ve gelecek tüm işlerin yönetiminin Allah'a ait olduğunu belirten bir ayet okuduğunu söylediklerini rivayet etmiştir. İbn Sa'd'ın İsmail'den rivayetine göre, Hicri 179 yılının Rebiü'l ayının on dördüncü sabahında vefat etmiştir. Ayrıca Safer ayında veya Rebiü'l ayının başka bir ayında vefat ettiği de söylenmiştir. Kadı İyad, beyaz kefenle örtülmesini ve cenaze namazının cenazeler için belirlenmiş yerde kılınmasını vasiyet ettiğini rivayet etmiştir. Medine Emiri cenaze namazını kıldırmış ve kefeninin maliyeti beş dinar olmuştur. 3165}, anlaşma gereği Bakî'ye defnedilmiş ve mezarı iyi bilinen ve ziyaret edilen bir yerdir. {cite:siyar-alam-nubala scan vol. 1 s. 3166}. Rivayetlere göre geride yüz adet sarık, beş yüz çift sandalet, kilim ve beş yüz dinardan fazla fiyata satılan minderler bırakmıştır. {cite:siyar-alam-nubala scan vol. 1 s. 3166}."
  id: "Isma'il ibn Abi Uways berkata bahwa Malik sakit selama beberapa hari, dan ketika keluarganya ditanya apa yang dia ucapkan pada saat kematiannya, mereka berkata: Dia mengucapkan Syahadat dan kemudian membaca sebuah ayat dari Surah Ar-Rum yang menyatakan bahwa pengaturan semua urusan, masa lalu dan masa depan, adalah milik Allah. Dia meninggal pada pagi hari tanggal empat belas Rabi'il tahun 179 H, menurut riwayat Ibn Sa'd dari Isma'il. Dikatakan juga bahwa dia meninggal pada bulan Safar atau bulan Rabi'il lainnya. Qadi `Iyad meriwayatkan bahwa dia mewasiatkan agar jenazahnya dikafani dengan kain putih dan agar salat jenazah dilakukan untuknya di tempat yang ditentukan untuk pemakaman. Emir Madinah memimpin salat jenazah untuknya, dan kain kafannya berharga lima dinar. 3165}, dan dia dimakamkan di Al-Baqi' atas kesepakatan, dan makamnya terkenal dan banyak dikunjungi {cite:siyar-alam-nubala scan vol. 1 hal. 3166}. Riwayat menyebutkan bahwa ia meninggalkan seratus sorban, lima ratus pasang sandal, permadani, dan bantal yang dijual dengan harga lebih dari lima ratus dinar {cite:siyar-alam-nubala scan vol. 1 hal. 3166}."
