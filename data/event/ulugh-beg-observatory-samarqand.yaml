summary:
  ar: "شيّد أولوغ بك حفيد تيمور مرصده العظيم بسمرقند نحو سنة 823هـ/1420م ووضع فيه مع القاضي زادة وعلي قوشجي الجداول السلطانية {cite:mawsuat-a3lam-ulama-adaba}."
  en: "Ulugh Beg, Timur's grandson, raised his great observatory at Samarkand about 823/1420, producing with Qadizada and Ali Qushji the Sultanic tables {cite:mawsuat-a3lam-ulama-adaba}."
  ur: "تیمور کے پوتے الغ بیگ نے تقریباً 823ھ/1420ء میں سمرقند میں اپنی عظیم رصد گاہ بنائی اور قاضی زادہ اور علی قوشجی کے ساتھ سلطانی جداول تیار کیے {cite:mawsuat-a3lam-ulama-adaba}."
  es: "Ulugh Beg, nieto de Timur, construyó su gran observatorio en Samarcanda alrededor del año 823/1420, produciendo junto con Qadizada y Ali Qushji las tablas sultanescas {cite:mawsuat-a3lam-ulama-adaba}."
  fr: "Ulugh Beg, petit-fils de Timur, fit construire son grand observatoire à Samarcande vers 823/1420, produisant avec Qadizada et Ali Qushji les tables sultaniques {cite:mawsuat-a3lam-ulama-adaba}."
  tr: "Timur'un torunu Uluğ Bey, Hicri 823/Miladi 1420 yılı civarında Semerkant'ta büyük gözlemevini inşa ettirmiş ve buraya, Kadı Zede ve Ali Kuşci ile birlikte Sultanlık Levhalarını yerleştirmiştir."
  id: "Ulugh Beg, cucu Timur, membangun observatorium besarnya di Samarkand sekitar tahun 823 H/1420 M dan menempatkan di dalamnya, bersama dengan Qadi Zadeh dan Ali Qushji, Loh Kesultanan {cite:mawsuat-a3lam-ulama-adaba}."
