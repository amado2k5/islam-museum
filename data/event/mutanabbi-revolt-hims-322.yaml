id: event/mutanabbi-revolt-hims-322
class: event
kind: revolt
label:
  ar: "فتنة المتنبي وسجنه بحمص، ٣٢٢هـ/٩٣٣م"
  en: "Al-Mutanabbi's rising and his imprisonment at Hims, 322/933"
  ur: "متنبی کی بغاوت اور حمص میں قید، 322ھ/933ء"
summary:
  ar: "في أواخر سنة ٣٢٢هـ/٩٣٣م قاد المتنبي فتنة انطلقت من اللاذقية إلى أطراف السماوة الغربية حيث كان بنو كلب عنصراً مستعداً للثورة؛ فقد استثمر، من غير أن يعتنق القرمطية، مبادئها الواجدة صدى عند البدو، وبعد نجاحات أولى هُزم وبدوُّه وأُسر وسُجن بحمص سنتين، ثم أُلزم بالرجوع عن أخطائه فأُطلق، ولم يجن من مغامرته إلا لقب «المتنبي» وقناعة بأن الشعر سيقوده إلى ما يطمح إليه {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-770}."
  en: "Towards the end of 322/933 al-Mutanabbi led a rising that began at Latakia and spread to the western borders of the Samawa, where the Banu Kalb were ever ready to rebel; without adhering to Karmatism he exploited its principles among the marauding Bedouins. After initial successes he and his Bedouins were defeated; he was captured and imprisoned at Hims, tried, held two years, made to retract his errors and set free — gaining from the adventure only the laqab 'al-Mutanabbi' (he who professes to be a prophet) and the conviction that poetry would realise his ambitions {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-770}."
  ur: "322ھ/933ء کے آخر میں متنبی نے لاذقیہ سے بغاوت کا آغاز کیا جو سماوہ کے مغربی کنارے تک پھیلی جہاں بنو کلب ہمیشہ بغاوت کو تیار تھے؛ قرمطیت قبول کیے بغیر انہوں نے بدویوں میں اس کے مبادئ سے فائدہ اٹھایا۔ ابتدائی کامیابیوں کے بعد وہ اور اس کے بدوی شکست کھا گئے؛ وہ گرفتار ہو کر حمص کی قید میں دو برس رہا، محاکمے کے بعد اپنے عقائد سے رجوع پر رہا ہوا — اس مہم سے اسے صرف «متنبی» کا لقب ملا اور یہ یقین کہ شاعری اس کی بلند امنگوں تک پہنچائے گی {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-770}۔"
