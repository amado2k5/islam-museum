label:
  ar: "فتنة المتنبي وسجنه بحمص، ٣٢٢هـ/٩٣٣م"
  en: "Al-Mutanabbi's rising and his imprisonment at Hims, 322/933"
  ur: "متنبی کی بغاوت اور حمص میں قید، 322ھ/933ء"
  es: "El levantamiento de Al-Mutanabbi y su encarcelamiento en Hims, 322/933"
  fr: "Le soulèvement d'Al-Mutanabbi et son emprisonnement à Hims, 322/933"
  tr: "El-Mutanabbi'nin çektiği çile ve Homs'ta hapsedilmesi, Hicri 322/Miladi 933"
  id: "Kisah penderitaan Al-Mutanabbi dan pemenjaraannya di Homs, 322 H/933 M"
summary:
  ar: "في أواخر سنة ٣٢٢هـ/٩٣٣م قاد المتنبي فتنة انطلقت من اللاذقية إلى أطراف السماوة الغربية حيث كان بنو كلب عنصراً مستعداً للثورة؛ فقد استثمر، من غير أن يعتنق القرمطية، مبادئها الواجدة صدى عند البدو، وبعد نجاحات أولى هُزم وبدوُّه وأُسر وسُجن بحمص سنتين، ثم أُلزم بالرجوع عن أخطائه فأُطلق، ولم يجن من مغامرته إلا لقب «المتنبي» وقناعة بأن الشعر سيقوده إلى ما يطمح إليه {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-770}."
  en: "Towards the end of 322/933 al-Mutanabbi led a rising that began at Latakia and spread to the western borders of the Samawa, where the Banu Kalb were ever ready to rebel; without adhering to Karmatism he exploited its principles among the marauding Bedouins. After initial successes he and his Bedouins were defeated; he was captured and imprisoned at Hims, tried, held two years, made to retract his errors and set free — gaining from the adventure only the laqab 'al-Mutanabbi' (he who professes to be a prophet) and the conviction that poetry would realise his ambitions {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-770}."
  ur: "322ھ/933ء کے آخر میں متنبی نے لاذقیہ سے بغاوت کا آغاز کیا جو سماوہ کے مغربی کنارے تک پھیلی جہاں بنو کلب ہمیشہ بغاوت کو تیار تھے؛ قرمطیت قبول کیے بغیر انہوں نے بدویوں میں اس کے مبادئ سے فائدہ اٹھایا۔ ابتدائی کامیابیوں کے بعد وہ اور اس کے بدوی شکست کھا گئے؛ وہ گرفتار ہو کر حمص کی قید میں دو برس رہا، محاکمے کے بعد اپنے عقائد سے رجوع پر رہا ہوا — اس مہم سے اسے صرف «متنبی» کا لقب ملا اور یہ یقین کہ شاعری اس کی بلند امنگوں تک پہنچائے گی {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-770}۔"
  es: "Hacia finales del año 322/933, al-Mutanabbi lideró una sublevación que comenzó en Latakia y se extendió hasta las fronteras occidentales de Samawa, donde los Banu Kalb siempre estaban dispuestos a rebelarse; sin adherirse al karmatismo, explotó sus principios entre los beduinos saqueadores. Tras los éxitos iniciales, él y sus beduinos fueron derrotados; fue capturado y encarcelado en Hims, juzgado, retenido durante dos años, obligado a retractarse de sus errores y puesto en libertad, obteniendo de la aventura únicamente el título de \"al-Mutanabbi\" (el que se proclama profeta) y la convicción de que la poesía le permitiría alcanzar sus ambiciones {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-770}."
  fr: "Vers la fin de l'année 322/933, al-Mutanabbi mena un soulèvement qui débuta à Lattaquié et s'étendit jusqu'aux frontières occidentales de la Samawa, où les Banu Kalb étaient toujours prêts à se rebeller. Sans adhérer au karmatisme, il en exploita les principes auprès des Bédouins pillards. Après des succès initiaux, lui et ses Bédouins furent vaincus; capturé et emprisonné à Hims, il fut jugé, détenu pendant deux ans, contraint de se rétracter et libéré – ne retirant de cette aventure que le surnom d'« al-Mutanabbi » (celui qui se prétend prophète) et la conviction que la poésie lui permettrait de réaliser ses ambitions."
  tr: "Hicri 322 yılının sonlarında/Miladi 933 yılında, El-Mutanabbi, Latakia'dan başlayıp Beni Kalb'in isyana hazır bir unsur olduğu Semeva'nın batı eteklerine kadar uzanan bir isyana önderlik etti. Karmatiya'yı benimsemeden, Bedevilerde yankı bulan ilkelerini kullandı. İlk başarılarından sonra, kendisi ve Bedevi takipçileri yenilgiye uğradı ve Homs'ta iki yıl hapsedildi. Daha sonra hatalarından vazgeçmeye zorlandı ve serbest bırakıldı. Bu maceradan \"El-Mutanabbi\" unvanı ve şiirin onu arzuladığı şeye götüreceği inancından başka bir şey kazanmadı. {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-770}"
  id: "Pada akhir tahun 322 H/933 M, Al-Mutanabbi memimpin pemberontakan yang dimulai dari Latakia hingga pinggiran barat Samawah, di mana Bani Kalb merupakan elemen yang siap memberontak. Ia memanfaatkan prinsip-prinsip Qarmatianisme yang selaras dengan kaum Badui, tanpa menganutnya secara langsung. Setelah keberhasilan awal, ia dan para pengikutnya dari kaum Badui dikalahkan, dan ia ditangkap serta dipenjara di Homs selama dua tahun. Ia kemudian dipaksa untuk mengakui kesalahannya dan dibebaskan. Ia tidak memperoleh apa pun dari petualangannya kecuali gelar \"Al-Mutanabbi\" dan keyakinan bahwa puisi akan membawanya kepada apa yang ia cita-citakan. {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-770}."
