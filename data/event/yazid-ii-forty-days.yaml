label: { ar: "عدول يزيد عن سيرة عمر بعد أربعين يوماً", en: "Yazid's Departure from Umar's Way After Forty Days", es: "La partida de Yazid del camino de Umar tras cuarenta días", fr: "Le départ de Yazid de la voie d'Umar après quarante jours", ur: "یزید کا چالیس دن کے بعد عمر کے راستے سے نکلنا" }
summary:
  ar: "لما ولي يزيد بن عبد الملك قال سيروا بسيرة عمر بن عبد العزيز فأتي بأربعين شيخاً فشهدوا له ما على الخلفاء حساب ولا عذاب، وقال ابن الماجشون أقام أربعين يوماً يسير بسيرة عمر ثم عدل عن ذلك {cite:tarikh-khulafa-minhaj-1434 p. 399}."
  en: "On accession Yazid ibn Abd al-Malik proclaimed 'follow the sira of Umar ibn Abd al-Aziz' and forty elders testified for him that there is no reckoning or torment upon caliphs; per Ibn al-Majishun he held to Umar's ways forty days, then turned aside {cite:tarikh-khulafa-minhaj-1434 p. 399}."
  es: "Al ascender al trono, Yazid ibn Abd al-Malik proclamó: «Seguid la sira de Umar ibn Abd al-Aziz», y cuarenta ancianos testificaron a su favor que no hay castigo ni tormento para los califas; según Ibn al-Majishun, siguió los caminos de Umar durante cuarenta días y luego se apartó {cite:tarikh-khulafa-minhaj-1434 p. 399}."
  fr: "Lors de son accession au pouvoir, Yazid ibn Abd al-Malik proclama: « Suivez la voie d'Umar ibn Abd al-Aziz », et quarante anciens témoignèrent en sa faveur qu'il n'y avait ni jugement ni châtiment pour les califes; selon Ibn al-Majishun, il suivit les voies d'Umar pendant quarante jours, puis s'en détourna {cite: tarikh-khulafa-minhaj-1434 p. 399}."
  ur: "الحاق پر یزید بن عبد الملک نے اعلان کیا کہ 'عمر بن عبدالعزیز کی سیرت کی پیروی کرو' اور چالیس بزرگوں نے اس کے حق میں گواہی دی کہ خلفاء پر کوئی حساب یا عذاب نہیں ہے۔ فی ابن المجیش اس نے عمر کے طریقے کو چالیس دن تک تھامے رکھا، پھر پیچھے ہٹ گیا۔ 399}۔"
