label: { ar: "صياح أهل البصرة بعبد الله بن علي", en: "The Basrans' Cry to Abdallah ibn Ali", fr: "Le cri des Basriens à Abdallah ibn Ali", es: "El clamor de los basranos a Abdallah ibn Ali", ur: "عبداللہ ابن علی کو بصریوں کی فریاد", tr: "Basra halkı Abdullah ibn Ali diye haykırdı.", id: "Penduduk Basra berseru memanggil Abdullah bin Ali." }
summary:
  ar: "لما اتخذ سليمان بن علي المغيثة أحب المنصور أن يستخرج ضيعة من البطيحة فأمر باتخاذ السبيطية فكره سليمان بن علي وأهل البصرة ذلك واجتمع أهل البصرة إلى باب عبد الله بن علي وهو يومئذ عند أخيه سليمان هارباً من المنصور فصاحوا يا أمير المؤمنين انزل إلينا نبايعك فكفهم سليمان وفرقهم وأوفد إلى المنصور سويداً بن عبد الله التميمي ثم العنزي وداود بن أبي هند وعلي بن بشير وسعيد بن أبي عروبة واسم أبي عروبة مهران فقدموا عليه ومعهم صورة البطيحة فأخبروه أنهم يتخوفون أن يملح ماؤهم فقال ما أراه كما ظننتم وأمر بالإمساك ثم إنه قدم البصرة فأمر باستخراج السبيطية فاستخرجت له."
  en: "After al-Mughitha, al-Mansur meant to carve an estate from the batiha and ordered al-Subaytiyya — hateful to Sulayman and the Basrans, who massed at the door of Abdallah ibn Ali, then a fugitive from al-Mansur at his brother Sulayman's, crying 'Commander of the Faithful, come down, we give you bay'a'. Sulayman dispersed them and sent al-Mansur a delegation — Suwayd ibn Abdallah al-Tamimi, al-Anazi, Dawud ibn Abi Hind, Ali ibn Bashir, Sa'id ibn Abi Aruba — with a picture of the batiha, warning the water would turn brackish; al-Mansur held 'I see it otherwise' — then came to Basra and had al-Subaytiyya extracted."
  fr: "Après al-Mughitha, al-Mansur voulut tailler un domaine dans la batiha et ordonna al-Subaytiyya, odieuse à Sulayman et aux Basriens, qui se massèrent à la porte d'Abdallah ibn Ali, alors fugitif devant al-Mansur chez son frère Sulayman, criant « Commandeur des croyants, descends, nous te prêtons la bay'a ». Sulayman les dispersa et envoya à al-Mansur une délégation (Suwayd ibn Abdallah al-Tamimi, al-Anazi, Dawud ibn Abi Hind, Ali ibn Bashir, Sa'id ibn Abi Aruba) avec une image de la batiha, l'avertissant que l'eau deviendrait saumâtre ; al-Mansur maintint « je vois les choses autrement », puis vint à Bassora et fit creuser al-Subaytiyya."
  es: "Después de al-Mughitha, al-Mansur pretendía apropiarse de una propiedad de la batiha y ordenó a al-Subaytiyya —odiada por Sulayman y los basranos, quienes se congregaron en la puerta de Abdallah ibn Ali, entonces fugitivo de al-Mansur en casa de su hermano Sulayman, gritando: «¡Comandante de los Creyentes, baje, le juramos lealtad!». Sulayman los dispersó y envió a al-Mansur una delegación —Suwayd ibn Abdallah al-Tamimi, al-Anazi, Dawud ibn Abi Hind, Ali ibn Bashir, Sa'id ibn Abi Aruba— con una imagen de la batiha, advirtiéndole que el agua se volvería salobre; al-Mansur sostuvo: «Yo lo veo de otra manera». Luego llegaron a Basora e hicieron extraer al-Subaytiyya."
  ur: "المغیثہ کے بعد، المنصور کا مطلب بیتہا سے ایک جاگیر بنانا تھا اور اس نے السبیطیہ کو حکم دیا - جو سلیمان اور بصریوں کے لیے نفرت انگیز تھا، جو عبداللہ ابن علی کے دروازے پر جمع ہوئے، پھر المنصور سے بھاگے ہوئے اپنے بھائی سلیمان کے دروازے پر، پکارتے ہوئے 'فضل کے کمانڈر، ہم نیچے آئیں'۔ سلیمان نے ان کو منتشر کیا اور المنصور کو ایک وفد بھیجا - سوید ابن عبد اللہ التمیمی، الانازی، داؤد ابن ابی ہند، علی ابن بشیر، سعید ابن ابی عروبہ - بیتحہ کی تصویر کے ساتھ، خبردار کیا کہ پانی کھارا ہو جائے گا۔ المنصور نے کہا کہ میں اسے دوسری صورت میں دیکھ رہا ہوں - پھر بصرہ آیا اور الصبیطیہ کو نکالا۔"
  tr: "Süleyman ibn Ali, el-Mughaytha'yı ele geçirdiğinde, el-Mansur, el-Batiha'dan bir çiftlik almak istedi ve bu yüzden el-Subaytiyye'nin alınmasını emretti. Süleyman ibn Ali ve Basra halkı bundan hoşlanmadı ve Basra halkı, o sırada kardeşi Süleyman ile birlikte el-Mansur'dan kaçan Abdullah ibn Ali'nin kapısına toplandı. \"Ey Müminlerin Emiri, yanımıza gel de sana biat edelim!\" diye bağırdılar. Süleyman onları durdurdu ve dağıttı, el-Mansur'a Suveyd ibn Abdullah el-Tamimi'yi, sonra el-Anzi'yi, Davud ibn Abi Hind'i, Ali ibn Beşir'i ve Said ibn Abi Aruba'yı (Abi Aruba'nın adı Mihran'dı) gönderdi. El-Batiha'nın bir resmini getirdiler ve sularının tuzlu hale gelmesinden korktuklarını söylediler. Süleyman, \"Sizin düşündüğünüz gibi görmüyorum\" dedi ve resmin geri alınmasını emretti. Sonra Basra'ya geldi ve el-Subeytiyye'nin çıkarılmasını emretti ve o da onun için çıkarıldı."
  id: "Ketika Sulaiman bin Ali merebut al-Mughaytha, al-Mansur ingin merebut lahan pertanian dari al-Batiha, sehingga ia memerintahkan agar al-Subaytiyya direbut. Sulaiman bin Ali dan penduduk Basra tidak menyukai hal itu, dan penduduk Basra berkumpul di depan pintu Abdullah bin Ali, yang saat itu bersama saudaranya Sulaiman, melarikan diri dari al-Mansur. Mereka berteriak, “Wahai Amirul Mukminin, turunlah kepada kami agar kami dapat berbaiat kepadamu.” Sulaiman menahan mereka dan membubarkan mereka, lalu mengutus Suwayd bin Abdullah al-Tamimi, kemudian al-Anzi, Dawud bin Abi Hind, Ali bin Bashir, dan Saeed bin Abi Aruba, yang bernama Mihran, kepada al-Mansur. Mereka datang kepadanya dengan membawa gambar al-Batiha, dan mereka mengatakan kepadanya bahwa mereka khawatir air mereka akan menjadi asin. Dia berkata, “Aku tidak melihatnya seperti yang kau pikirkan,” dan dia memerintahkan agar itu ditahan. Kemudian dia datang ke Basra dan memerintahkan agar al-Subaytiyya digali, dan itu pun digali untuknya."
