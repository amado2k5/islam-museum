id: event/yaqut-mujam-definitive-625
class: event
kind: other
label:
  ar: "ياقوت يشرع في التبييض الأخير لمعجم البلدان لخزانة القفطي، ٢١ محرم ٦٢٥هـ/١ يناير ١٢٢٨م"
  en: "Yaqut begins the definitive edition of the Mujam al-Buldan for al-Qifti's library, 21 Muharram 625/1 January 1228"
  ur: "یاقوت نے قفطی کے کتب خانے کے لیے معجم البلدان کی حتمی تدوین شروع کی، 21 محرم 625ھ/1 جنوری 1228ء"
  es: "Yaqut comienza la edición definitiva del Mujam al-Buldan para la biblioteca de al-Qifti, 21 de Muharram de 625/1 de enero"
  fr: "Yaqut commence l'édition définitive du Mujam al-Buldan pour la bibliothèque d'al-Qifti, 21 Muharram 625/1 janvier"
  tr: "Yaqut, El-Kıfti Kütüphanesi için Coğrafya Sözlüğünün son düzenlemesine başlıyor, 21 Muharrem 625 H. / 1 Ocak 1228 MS."
  id: "Yaqut mengawali penyuntingan terakhir Kamus Geografis Perpustakaan al-Qifti, 21 Muharram 625 H / 1 Januari 1228 M."
summary:
  ar: "شرع ياقوت في النسخة الأخيرة من «معجم البلدان» في الحادي والعشرين من محرم سنة ٦٢٥هـ/١ يناير ١٢٢٨م، وكانت لخزانة مولاه القفطي، ولم يبلغ في هذه المراجعة الأخيرة مادة «رصافة بغداد» {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}. وفي هذه السنوات أقام بظاهر حلب في الخان، في كنف القفطي الذي أذن له بالاطلاع على الكتب قدر ما يريد {cite:shadharat-dhahab p. 121} {cite:mawsuat-a3lam-ulama-adaba p. 278}."
  en: "On 21 Muharram 625/1 January 1228 Yaqut began the definitive edition of the Mujam al-Buldan, intended for his patron al-Qifti's library; in this last revision he never reached the article 'Rusafat Baghdad' {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}. In these years he lived in the khan outside Aleppo, under al-Qifti's wing, free to consult as many books as he wished {cite:shadharat-dhahab p. 121} {cite:mawsuat-a3lam-ulama-adaba p. 278}."
  ur: "21 محرم 625ھ/1 جنوری 1228ء کو یاقوت نے معجم البلدان کی حتمی تدوین شروع کی جو سرپرست قفطی کے کتب خانے کے لیے تھی؛ اس آخری نظرثانی میں وہ مادہ «رصافہ بغداد» تک نہ پہنچ سکا {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}. ان برسوں وہ حلب کے باہر خان میں رہتا تھا، قفطی کی آغوش میں، مطالعے کی مکمل آزادی کے ساتھ {cite:shadharat-dhahab p. 121} {cite:mawsuat-a3lam-ulama-adaba p. 278}۔"
  es: "El 21 de Muharram de 625/1 de enero de 1228, Yaqut comenzó la edición definitiva del Mujam al-Buldan, destinada a la biblioteca de su mecenas al-Qifti; en esta última revisión nunca llegó al artículo 'Rusafat Baghdad' {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}. Durante estos años vivió en el khan a las afueras de Alepo, bajo la protección de al-Qifti, con libertad para consultar tantos libros como deseara {cite:shadharat-dhahab p. 121} {cite:mawsuat-a3lam-ulama-adaba p. 278}."
  fr: "Le 21 Muharram 625/1er janvier 1228, Yaqut entreprit l'édition définitive du Mujam al-Buldan, destinée à la bibliothèque de son protecteur al-Qifti; dans cette dernière révision, il n'atteignit jamais l'article « Rusafat Baghdad » {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}. Durant ces années, il vécut dans le khan près d'Alep, sous la protection d'al-Qifti, libre de consulter autant d'ouvrages qu'il le souhaitait {cite:shadharat-dhahab p. 121} {cite:mawsuat-a3lam-ulama-adaba p. 278}."
  tr: "Yaqut, \"Ülkeler Sözlüğü\"nün son baskısına Hicri 625 yılının Muharrem ayının 21'inde/Miladi 1 Ocak 1228'de başladı. Bu eser, hocası el-Kifti'nin kütüphanesindeydi. Bu son revizyonda, \"Bağdatlı el-Rusafa\" maddesine ulaşamadı {kaynak:encyclopaedia-of-islam-2 cilt 11 s. 265}. Bu yıllar boyunca, el-Kifti'nin himayesi altında, Halep'in dışındaki bir handa ikamet etti ve el-Kifti ona dilediği kadar kitaba erişim izni verdi {kaynak:shadharat-dhahab s. 121} {kaynak:mawsuat-a3lam-ulama-adaba s. 278}."
  id: "Yaqut memulai edisi terakhir \"Kamus Negara-Negara\" pada tanggal 21 Muharram 625 H/1 Januari 1228 M. Kamus tersebut berada di perpustakaan gurunya, al-Qifti. Dalam revisi terakhir ini, ia tidak sampai pada entri untuk \"al-Rusafa dari Baghdad\" {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}. Selama tahun-tahun ini, ia tinggal di pinggiran Aleppo di khan, di bawah perlindungan al-Qifti, yang memberinya akses ke buku sebanyak yang diinginkannya {cite:shadharat-dhahab p. 121} {cite:mawsuat-a3lam-ulama-adaba p. 278}."
