id: event/yaqut-mujam-definitive-625
class: event
kind: other
label:
  ar: "ياقوت يشرع في التبييض الأخير لمعجم البلدان لخزانة القفطي، ٢١ محرم ٦٢٥هـ/١ يناير ١٢٢٨م"
  en: "Yaqut begins the definitive edition of the Mujam al-Buldan for al-Qifti's library, 21 Muharram 625/1 January 1228"
  ur: "یاقوت نے قفطی کے کتب خانے کے لیے معجم البلدان کی حتمی تدوین شروع کی، 21 محرم 625ھ/1 جنوری 1228ء"
summary:
  ar: "شرع ياقوت في النسخة الأخيرة من «معجم البلدان» في الحادي والعشرين من محرم سنة ٦٢٥هـ/١ يناير ١٢٢٨م، وكانت لخزانة مولاه القفطي، ولم يبلغ في هذه المراجعة الأخيرة مادة «رصافة بغداد» {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}. وفي هذه السنوات أقام بظاهر حلب في الخان، في كنف القفطي الذي أذن له بالاطلاع على الكتب قدر ما يريد {cite:shadharat-dhahab p. 121} {cite:mawsuat-a3lam-ulama-adaba p. 278}."
  en: "On 21 Muharram 625/1 January 1228 Yaqut began the definitive edition of the Mujam al-Buldan, intended for his patron al-Qifti's library; in this last revision he never reached the article 'Rusafat Baghdad' {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}. In these years he lived in the khan outside Aleppo, under al-Qifti's wing, free to consult as many books as he wished {cite:shadharat-dhahab p. 121} {cite:mawsuat-a3lam-ulama-adaba p. 278}."
  ur: "21 محرم 625ھ/1 جنوری 1228ء کو یاقوت نے معجم البلدان کی حتمی تدوین شروع کی جو سرپرست قفطی کے کتب خانے کے لیے تھی؛ اس آخری نظرثانی میں وہ مادہ «رصافہ بغداد» تک نہ پہنچ سکا {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}. ان برسوں وہ حلب کے باہر خان میں رہتا تھا، قفطی کی آغوش میں، مطالعے کی مکمل آزادی کے ساتھ {cite:shadharat-dhahab p. 121} {cite:mawsuat-a3lam-ulama-adaba p. 278}۔"
