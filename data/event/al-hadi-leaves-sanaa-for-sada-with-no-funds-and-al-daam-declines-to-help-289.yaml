id: event/al-hadi-leaves-sanaa-for-sada-with-no-funds-and-al-daam-declines-to-help-289
class: event
kind: other
label:
  ar: "خروج الهادي من صنعاء إلى صعدة لقلة النفقة وامتناع الدعام عن إعانته، جمادى الآخرة 289هـ"
  en: "Al-Hadi leaves Sana'a for Sa'da for lack of funds and al-Da'am declines to help, Jumada II 289 AH"
  ur: "رقم کی کمی پر ہادی کا صنعاء سے صعدہ روانہ ہونا اور دعام کا مدد سے انکار، جمادی الآخرہ 289ھ"
summary:
  ar: "بلغ الهادي، وهو مريض شديد المرض، هزيمة ابن الروية، وقد قلّت النفقة للعساكر وطلب من أهل صنعاء العون والسلف فلم يعطوه درهماً، فشاور أصحابه وعزم على الخروج يوم الخميس فخرج في عمارية، ثم قال لأهل صنعاء قولاً شديداً قبل خروجه؛ وسأل الدعام المعونة وهو في الطريق فتعلل عليه، فسار إلى صعدة في أيام باقية من جمادى الآخرة سنة 289هـ."
  en: "The news of Ibn al-Ruwayya's rout reached al-Hadi, gravely ill, with funds for the armies running out and the people of Sana'a refusing him help and a loan; he took counsel, decided to leave on Thursday and went out in a litter, and before leaving told the people of Sana'a a hard word; on the road he asked al-Da'am for help and was put off with excuses, and went on to Sa'da in the last days of Jumada II 289 AH."
  ur: "ہادی کو، جو سخت بیمار تھے، ابن الرویہ کی شکست کی خبر ملی جبکہ لشکروں کا خرچ کم ہو چکا تھا اور اہلِ صنعاء نے مدد اور قرض دینے سے انکار کیا؛ انہوں نے ساتھیوں سے مشورہ کیا، جمعرات کو نکلنے کا فیصلہ کیا اور عماری میں نکلے، اور نکلنے سے پہلے اہلِ صنعاء سے ایک سخت بات کہی؛ راستے میں دعام سے مدد مانگی تو اس نے بہانے کیے، اور وہ جمادی الآخرہ 289ھ کے آخری دنوں میں صعدہ پہنچے۔"
