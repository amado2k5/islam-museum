id: event/al-hadi-orders-the-stoning-of-a-woman-convicted-of-adultery-294
class: event
kind: court-ruling
label:
  ar: "الهادي يأمر برجم امرأة أقرت بالزنا بعد شهادة الشهود، سنة 294هـ، ص338-339"
  en: "Al-Hadi orders the stoning of a woman who confessed to adultery after the witnesses testified, 294 AH, pp. 338-339"
  ur: "ہادی کا گواہوں کی شہادت کے بعد زنا کا اقرار کرنے والی عورت کو سنگسار کرنے کا حکم، 294ھ، ص338-339"
  es: "Al-Hadi ordena la lapidación de una mujer que confesó adulterio tras el testimonio de los testigos, 294 AH, pp. 338-339."
  fr: "Al-Hadi ordonne la lapidation d'une femme qui a avoué l'adultère après le témoignage des témoins, 294 AH, pp. 338-339"
  tr: "Şahitlerin ifadesinden sonra zina yaptığını itiraf eden bir kadının taşlanarak öldürülmesini emreden Al-Hadi, Hicri 294 yılı, s. 338-339"
  id: "Al-Hadi memerintahkan rajam terhadap seorang wanita yang mengaku berzina setelah saksi-saksi memberikan kesaksian, tahun 294 H, hlm. 338-339"
summary:
  ar: "شهد الشهود على امرأة بالزنا، فأقرت بزيجات سابقة، فأقام عليها الهادي حدّ مائة جلدة ثم أمر برجمها، ويعرض الكتاب الخبر بتفصيله ويعدّه من أحكام الإمام."
  en: "Witnesses testified against a woman and she confessed to earlier marriages. Al-Hadi had the hadd of a hundred lashes applied and then ordered her stoned; the book gives the procedure in full."
  ur: "گواہوں نے ایک عورت کے خلاف گواہی دی اور اس نے پچھلے نکاحوں کا اقرار کیا۔ ہادی نے سو کوڑوں کی حد جاری کی اور پھر سنگساری کا حکم دیا؛ کتاب پورا طریقہ بیان کرتی ہے۔"
  es: "Los testigos declararon contra una mujer, quien confesó haber estado casada anteriormente. Al-Hadi ordenó que se le aplicaran cien latigazos y luego que la lapidaran; el libro describe el procedimiento en detalle."
  fr: "Des témoins ont déposé contre une femme, qui a avoué avoir été mariée auparavant. Al-Hadi l'a fait fouetter pendant cent jours, puis a ordonné sa lapidation; le livre décrit la procédure en détail."
  tr: "Şahitler bir kadını zina suçundan yargıladı ve kadın daha önceki evliliklerini itiraf etti. El-Hadi ona yüz kırbaç cezası verdi ve ardından taşlanarak öldürülmesini emretti. Kitap bu hikâyeyi ayrıntılı olarak anlatıyor ve bunu İmam'ın hükümlerinden biri olarak değerlendiriyor."
  id: "Para saksi bersaksi melawan seorang wanita atas tuduhan perzinahan, dan wanita itu mengaku telah menikah sebelumnya. Al-Hadi menjatuhkan hukuman cambuk seratus kali kepadanya dan kemudian memerintahkan agar dia dirajam. Buku ini menyajikan kisah tersebut secara detail dan menganggapnya sebagai salah satu fatwa Imam."
