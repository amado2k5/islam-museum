id: event/ali-ibn-al-rabi-al-madani-is-killed-on-the-road-to-saada-295
class: event
kind: other
label:
  ar: "مقتل علي بن الربيع المداني في الطريق إلى صعدة، سنة 295هـ، ص357-358"
  en: "Ali ibn al-Rabi' al-Madani is killed on the road to Sa'da, 295 AH, pp. 357-358"
  ur: "علی بن الربیع المداني کا صعدہ کے راستے میں قتل، 295ھ، ص357-358"
summary:
  ar: "طلب بنو الحارث إطلاق علي بن الربيع المداني، وكانوا قد عزموا على أخذ محمد بن عبيد الله رهينة به، فغضب الهادي. ويذكر الكتاب أن الهادي أمر نفراً من خدمه بأن يحملوه إلى صعدة فيقتلوه في الطريق، بعد أن سأل أولياء المقتول أن يقتلوه بصاحبهم، ففعلوا، فزادهم ذلك خوفاً."
  en: "Banu al-Harith asked for the release of Ali ibn al-Rabi' al-Madani, after they had planned to take Muhammad ibn Ubaydallah as a hostage in exchange for him, and al-Hadi was angered. The book's account says al-Hadi ordered servants to take him toward Sa'da and kill him on the road; his victim's kin had asked for retaliation. The killing increased the fear of Banu al-Harith."
  ur: "بنو حارث نے علی بن الربیع المداني کی رہائی کا مطالبہ کیا، جبکہ وہ اس کے بدلے محمد بن عبیداللہ کو یرغمال بنانے کا ارادہ رکھتے تھے، اور ہادی سخت ناراض ہوئے۔ کتاب کے بیان کے مطابق ہادی نے اپنے کچھ خادموں کو حکم دیا کہ اسے صعدہ کی طرف لے جائیں اور راستے میں قتل کر دیں؛ مقتول کے ورثاء نے بدلے کا مطالبہ کیا تھا۔ اس قتل سے بنو حارث کا خوف اور بڑھ گیا۔"
