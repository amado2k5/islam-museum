id: event/capture-and-islam-of-thumama-ibn-uthal
class: event
kind: other
label: { ar: "أسر ثمامة بن أثال الحنفي وإسلامه", en: "The capture of Thumama ibn Uthal al-Hanafi and his acceptance of Islam" }
summary:
  ar: "يروي ابن إسحاق عن أبي سعيد المقبري عن أبي هريرة: خرجت خيل للنبي فأخذت رجلاً من بني حنيفة لا يشعرون من هو، فقال النبي: هذا ثمامة بن أثال الحنفي، أحسنوا إساره، وأمر بطعام أهله ولقحته أن تُبعث إليه؛ وكان يدعوه إلى الإسلام فيجيب: إن تقتل تقتل ذا دم، وإن ترد الفداء فسل ما شئت؛ ثم أمر بإطلاقه فخرج إلى البقيع فتطهّر وبايع على الإسلام، فقلّ أكله فقال النبي: الكافر يأكل في سبعة أمعاء والمسلم في معى واحد. ويضيف ابن هشام خبر عمرته وتلبيته بمكة، ومنعه حمل الطعام إلى مكة من اليمامة حتى كتب النبي إليه أن يخلّي بينهم وبين الحمل."
  en: "Ibn Ishaq relates from Abu Sa'id al-Maqburi from Abu Hurayra: a cavalry party of the Prophet's seized a man of Banu Hanifa without knowing who he was; the Prophet said 'this is Thumama ibn Uthal al-Hanafi, treat your captive well', and had his household's food and his milch-camel sent to him; he kept inviting him to Islam and Thumama answered: if you kill, you kill a man of blood, and if you want ransom, ask what you will; then he ordered him released, and Thumama went to al-Baqi', purified himself and pledged Islam; when he then ate little, the Prophet said the unbeliever eats with seven bowels and the believer with one. Ibn Hisham adds his umra and loud talbiya at Mecca, and his cutting off the grain of al-Yamama from Mecca until the Prophet wrote to him to let the caravans through."
