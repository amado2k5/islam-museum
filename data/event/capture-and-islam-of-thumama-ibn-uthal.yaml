id: event/capture-and-islam-of-thumama-ibn-uthal
class: event
kind: other
label: { ar: "أسر ثمامة بن أثال الحنفي وإسلامه", en: "The capture of Thumama ibn Uthal al-Hanafi and his acceptance of Islam", fr: "La capture de Thumama ibn Uthal al-Hanafi et son entrée en islam", es: "La captura de Thumama ibn Uthal al-Hanafi y su conversión al Islam.", ur: "ثمامہ بن اثال الحنفی کی گرفتاری اور اس کا قبول اسلام", tr: "Thumamah ibn Uthal al-Hanafi'nin yakalanması ve İslam'a geçmesi", id: "Penangkapan Thumamah ibn Uthal al-Hanafi dan masuk Islam" }
summary:
  ar: "يروي ابن إسحاق عن أبي سعيد المقبري عن أبي هريرة: خرجت خيل للنبي فأخذت رجلاً من بني حنيفة لا يشعرون من هو، فقال النبي: هذا ثمامة بن أثال الحنفي، أحسنوا إساره، وأمر بطعام أهله ولقحته أن تُبعث إليه؛ وكان يدعوه إلى الإسلام فيجيب: إن تقتل تقتل ذا دم، وإن ترد الفداء فسل ما شئت؛ ثم أمر بإطلاقه فخرج إلى البقيع فتطهّر وبايع على الإسلام، فقلّ أكله فقال النبي: الكافر يأكل في سبعة أمعاء والمسلم في معى واحد. ويضيف ابن هشام خبر عمرته وتلبيته بمكة، ومنعه حمل الطعام إلى مكة من اليمامة حتى كتب النبي إليه أن يخلّي بينهم وبين الحمل."
  en: "Ibn Ishaq relates from Abu Sa'id al-Maqburi from Abu Hurayra: a cavalry party of the Prophet's seized a man of Banu Hanifa without knowing who he was; the Prophet said 'this is Thumama ibn Uthal al-Hanafi, treat your captive well', and had his household's food and his milch-camel sent to him; he kept inviting him to Islam and Thumama answered: if you kill, you kill a man of blood, and if you want ransom, ask what you will; then he ordered him released, and Thumama went to al-Baqi', purified himself and pledged Islam; when he then ate little, the Prophet said the unbeliever eats with seven bowels and the believer with one. Ibn Hisham adds his umra and loud talbiya at Mecca, and his cutting off the grain of al-Yamama from Mecca until the Prophet wrote to him to let the caravans through."
  fr: "Ibn Ishaq rapporte d'après Abu Sa'id al-Maqburi, d'après Abu Hurayra : un détachement de cavaliers du Prophète s'empara d'un homme des Banu Hanifa sans savoir qui il était ; le Prophète dit « c'est Thumama ibn Uthal al-Hanafi, traitez bien votre captif », et lui fit envoyer la nourriture de sa maisonnée et sa chamelle laitière ; il ne cessait de l'inviter à l'islam et Thumama répondait : si tu tues, tu tues un homme dont le sang sera vengé, et si tu veux une rançon, demande ce que tu veux ; puis il ordonna de le libérer, et Thumama alla à al-Baqi', se purifia et prêta serment d'islam ; comme il mangeait ensuite peu, le Prophète dit que l'incroyant mange avec sept intestins et le croyant avec un seul. Ibn Hisham ajoute sa umra et sa talbiya à voix haute à La Mecque, et le fait qu'il coupa La Mecque du grain d'al-Yamama jusqu'à ce que le Prophète lui écrive de laisser passer les caravanes."
  es: "Ibn Ishaq relata de Abu Sa'id al-Maqburi de Abu Hurayra: un grupo de caballería del Profeta capturó a un hombre de Banu Hanifa sin saber quién era; el Profeta dijo: «Este es Thumama ibn Uthal al-Hanafi, trata bien a tu cautivo», y mandó enviar la comida de su familia y su camello lechero; siguió invitándolo al Islam y Thumama respondió: «Si matas, matas a un hombre de sangre, y si quieres rescate, pide lo que quieras»; entonces ordenó su liberación, y Thumama fue a al-Baqi', se purificó y se convirtió al Islam; cuando comió poco, el Profeta dijo: «El incrédulo come con siete intestinos y el creyente con uno». Ibn Hisham añade su umra y su talbiya en voz alta en La Meca, y su corte del grano de al-Yamama de La Meca hasta que el Profeta le escribió para que dejara pasar las caravanas."
  ur: "ابن اسحاق نے ابو سعید المقبوری سے ابوہریرہ سے نقل کیا ہے کہ: رسول اللہ کے ایک گھڑ سوار دستے نے بنو حنیفہ کے ایک آدمی کو یہ معلوم کیے بغیر پکڑ لیا کہ وہ کون ہے۔ آپ نے فرمایا کہ یہ ثمامہ بن اثال حنفی ہیں، اپنے اسیر کے ساتھ اچھا سلوک کرو، اور اس کے گھر کا کھانا اور دودھ والا اونٹ ان کے پاس بھیجا۔ وہ اسے اسلام کی دعوت دیتا رہا اور ثمامہ نے جواب دیا: اگر تم قتل کرتے ہو تو ایک خونخوار کو قتل کرتے ہو، اور اگر تم فدیہ چاہتے ہو تو مانگو جو چاہو۔ پھر اس نے اسے رہا کرنے کا حکم دیا، اور ثمامہ البقیع کے پاس گئے، اپنے آپ کو پاک کیا اور اسلام کا بیعت کیا۔ جب اس نے تھوڑا سا کھایا تو نبی نے فرمایا کہ کافر سات آنتوں سے کھاتا ہے اور مومن ایک آنتوں سے۔ ابن ہشام نے مکہ میں اپنے عمرہ اور بلند آواز سے تلبیہ کا اضافہ کیا اور مکہ سے یمامہ کے دانے کو کاٹ دیا یہاں تک کہ نبی نے انہیں قافلوں کو گزرنے کے لیے لکھا۔"
  tr: "İbn İshak, Ebu Sa'id el-Makburi'den, o da Ebu Hurayra'dan rivayet ettiğine göre, Peygamber'in süvari birliği, Beni Hanife kabilesinden bir adamı, kim olduğunu bilmeden esir aldı. Peygamber, \"Bu, Thumame ibn Uthal el-Hanafi'dir. Ona esir olarak iyi davranın\" dedi. Ailesi ve devesine yiyecek gönderilmesini emretti. Peygamber onu İslam'a davet etti ve Thumame, \"Beni öldürürseniz, kanlı bir adamı öldürmüş olursunuz. Fidye istiyorsanız, dilediğinizi isteyin\" diye cevap verdi. Bunun üzerine Peygamber, Thumame'nin serbest bırakılmasını emretti ve Thumame, el-Baki mezarlığına gitti, abdest aldı ve İslam'a biat etti. Çok az yemek yedi, bu yüzden Peygamber, \"Kâfir yedi mideyle yer, Müslüman ise tek mideyle yer\" dedi. İbn Hişam, Thumame'nin Umre ziyaretini ve Mekke'deki Telbiyesini, Peygamberimiz kendisine mektup yazıp izin vermesi talimatını verene kadar el-Yamamah'tan Mekke'ye yiyecek taşınmasını nasıl engellediğini de ekler."
  id: "Ibn Ishaq meriwayatkan dari Abu Sa'id al-Maqburi, yang juga dari Abu Hurayrah: Sebuah unit kavaleri Nabi pergi dan menangkap seorang pria dari suku Banu Hanifah, tanpa mengetahui siapa dia. Nabi berkata, \"Ini adalah Thumamah bin Uthal al-Hanafi. Perlakukan dia dengan baik sebagai tawanan.\" Beliau memerintahkan agar makanan untuk keluarganya dan untanya dikirimkan kepadanya. Nabi mengajaknya masuk Islam, dan Thumamah menjawab, \"Jika engkau membunuhku, engkau akan membunuh seorang pria yang berlumuran darah. Jika engkau menginginkan tebusan, mintalah apa pun yang engkau inginkan.\" Kemudian Nabi memerintahkan pembebasannya, dan Thumamah pergi ke pemakaman al-Baqi', berwudhu, dan berbaiat kepada Islam. Dia makan sangat sedikit, sehingga Nabi berkata, \"Orang kafir makan dengan tujuh lambung, sedangkan seorang Muslim makan dengan satu lambung.\" Ibn Hisham menambahkan kisah Umrah Thumamah dan Talbiyahnya di Mekah, serta bagaimana ia mencegah pengiriman makanan ke Mekah dari al-Yamamah hingga Nabi menulis surat kepadanya, memerintahkannya untuk mengizinkan mereka mengangkutnya."
