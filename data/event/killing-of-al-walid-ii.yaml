id: event/killing-of-al-walid-ii
class: event
kind: death
label: { ar: "مقتل الوليد بن يزيد", en: "The killing of al-Walid ibn Yazid", es: "El asesinato de al-Walid ibn Yazid", fr: "Le meurtre d'al-Walid ibn Yazid", ur: "ولید بن یزید کا قتل" }
summary:
  ar: "ثب يزيد بن الوليد الناقص على الخلافة وقتل ابن عمه الوليد بن يزيد وتملك، وقام خطيباً فقال ما خرجت أشراً ولا بطراً ولا حرصاً على الدنيا ولا رغبة في الملك ولكن خرجت غضباً لله ولدينه وداعياً إلى كتابه وسنة نبيه حين درست معالم الهدى وطفئ نور أهل التقوى وظهر الجبار المستحل للحرمة {cite:tarikh-khulafa-minhaj-1434 p. 408}."
  en: "Yazid ibn al-Walid 'al-Naqis' rose for the caliphate, killed his cousin al-Walid ibn Yazid and took power, then mounted the pulpit: 'I did not rise in arrogance or pride or greed for the world or desire for kingship, but in anger for God and His religion, calling to His Book and His Prophet's sunna, when the landmarks of guidance were effaced, the light of the godfearing extinguished, and the tyrant who profanes sanctity appeared' {cite:tarikh-khulafa-minhaj-1434 p. 408}."
  es: "Yazid ibn al-Walid 'al-Naqis' se alzó para el califato, mató a su primo al-Walid ibn Yazid y tomó el poder, luego subió al púlpito: 'No me alcé por arrogancia, orgullo, codicia por el mundo ni deseo de reinar, sino por ira contra Dios y Su religión, llamando a Su Libro y a la sunna de Su Profeta, cuando los hitos de la guía fueron borrados, la luz de los temerosos de Dios se extinguió y apareció el tirano que profana la santidad' {cite:tarikh-khulafa-minhaj-1434 p. 408}."
  fr: "Yazid ibn al-Walid 'al-Naqis' s'est levé pour le califat, a tué son cousin al-Walid ibn Yazid et a pris le pouvoir, puis est monté en chaire: « Je ne me suis pas levé par arrogance, orgueil, avidité pour le monde ou désir de royauté, mais par colère pour Dieu et Sa religion, appelant à Son Livre et à la sunna de Son Prophète, lorsque les repères de la guidance ont été effacés, la lumière des pieux éteinte et le tyran qui profane la sainteté est apparu » {cite:tarikh-khulafa-minhaj-1434 p. 408}."
  ur: "یزید بن الولید النقیس خلافت کے لیے اٹھ کھڑا ہوا، اپنے چچا زاد بھائی ولید ابن یزید کو قتل کر کے اقتدار پر قبضہ کر لیا، پھر منبر پر چڑھا: 'میں غرور، غرور، دنیا کی حرص یا بادشاہی کی تمنا میں نہیں آیا، بلکہ خدا اور اس کے دین کی ہدایت اور اس کے سورج کی ہدایت اور اس کے سورج کی طرف دعوت دینے کے وقت غصہ میں آیا۔ بجھ گیا، پرہیزگاری کا نور بجھ گیا، اور تقدس کو پامال کرنے والا ظالم ظاہر ہوا''۔ 408}۔"
