summary:
  ar: "ثب يزيد بن الوليد الناقص على الخلافة وقتل ابن عمه الوليد بن يزيد وتملك، وقام خطيباً فقال ما خرجت أشراً ولا بطراً ولا حرصاً على الدنيا ولا رغبة في الملك ولكن خرجت غضباً لله ولدينه وداعياً إلى كتابه وسنة نبيه حين درست معالم الهدى وطفئ نور أهل التقوى وظهر الجبار المستحل للحرمة {cite:tarikh-khulafa-minhaj-1434 p. 408}."
  en: "Yazid ibn al-Walid 'al-Naqis' rose for the caliphate, killed his cousin al-Walid ibn Yazid and took power, then mounted the pulpit: 'I did not rise in arrogance or pride or greed for the world or desire for kingship, but in anger for God and His religion, calling to His Book and His Prophet's sunna, when the landmarks of guidance were effaced, the light of the godfearing extinguished, and the tyrant who profanes sanctity appeared' {cite:tarikh-khulafa-minhaj-1434 p. 408}."
