label: { ar: "مقاطعة الثلاثة المخلفين خمسين ليلة", en: "The fifty-night boycott of the three" }
summary:
  ar: "نهى النبي المسلمين عن كلام كعب ومرارة وهلال بعد عودته، فاجتنبهم الناس وتغيروا لهم خمسين ليلة؛ لزم صاحباه بيتيهما، وكان كعب يخرج إلى الصلاة والأسواق فلا يكلمه أحد."
  en: After his return the Prophet forbade the Muslims to speak to Ka'b, Murara and Hilal; people shunned them and their world changed for fifty nights. Two of them kept to their houses, while Ka'b went out to prayer and the markets and no one spoke to him.
