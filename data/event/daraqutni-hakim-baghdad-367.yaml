label:
  ar: "الحاكم النيسابوري يجتمع بالدارقطني أربعة أشهر ببغداد، ٣٦٧هـ"
  en: "Al-Hakim al-Nisaburi spends four months with al-Daraqutni in Baghdad, 367/977"
  ur: "حاکم نیشاپوری بغداد میں چار ماہ دارقطنی کی صحبت میں، 367ھ/977ء"
summary:
  ar: "قال الحاكم أبو عبد الله: صار الدارقطني أوحد عصره في الحفظ والفهم والورع، وإماماً في القراء والنحويين؛ وفي سنة سبع وستين أقمت ببغداد أربعة أشهر، وكثر اجتماعنا بالليل والنهار، فصادفته فوق ما وصف لي، وسألته عن العلل والشيوخ؛ وله مصنفات يطول ذكرها، وأشهد أنه لم يخلف على أديم الأرض مثله {cite:tarikh-islam-dhahabi p.102}."
  en: "Al-Hakim Abu 'Abdallah said: al-Daraqutni became the unique one of his age in memory, understanding and scrupulousness, an imam among the readers and grammarians. In the year 367 I stayed in Baghdad four months and we met much, night and day; I found him above what had been described to me, and I asked him about the 'ilal and the shaykhs. His works are too many to list, and I bear witness that he left no like of himself upon the face of the earth {cite:tarikh-islam-dhahabi p.102}."
  ur: "حاکم ابو عبداللہ کہتے ہیں: دارقطنی اپنے عصر کے حفظ، فہم اور ورع میں یکتا اور قراء و نحویوں کے امام بن گئے؛ سال 367ھ میں میں بغداد میں چار ماہ رہا اور ہماری ملاقاتیں رات دن بکثرت ہوتیں؛ میں نے انہیں بیان سے بڑھ کر پایا اور علل اور مشائخ کے بارے میں ان سے پوچھا؛ ان کی تصانیف بہت ہیں اور میں گواہی دیتا ہوں کہ انہوں نے روئے زمین پر اپنا مثل نہیں چھوڑا {cite:tarikh-islam-dhahabi p.102}۔"
