id: event/bayat-al-mutazz
class: event
kind: gathering
label: { ar: "خلع المستعين وبيعة المعتز", en: "Deposition of al-Musta'in and bay'a to al-Mu'tazz", fr: "La déposition d'al-Musta'in et la bay'a à al-Mu'tazz", es: "Deposición de al-Musta'in y bay'a a al-Mu'tazz", ur: "المستعین اور بیع کو معتز کی طرف جمع کرنا" }
summary:
  ar: "في سنة اثنتين وخمسين ومائتين خُلع المستعين وبويع المعتز في محرم، وأُخذت البيعة له ببغداد {cite:tabari-tarikh-abu-al-fadl j.9 p.348}، وذكر الطبري قتل شريح الحبشي {cite:tabari-tarikh-abu-al-fadl j.9 p.354} وكتاب المعتز في إسقاط اسمي بغا ووصيف من الدواوين {cite:tabari-tarikh-abu-al-fadl j.9 p.354}، وعند السيوطي بويع عند خلع المستعين سنة اثنتين وخمسين وله تسع عشرة سنة ولم يل الخلافة قبله أحد أصغر منه {cite:tarikh-khulafa-minhaj-1434 p. 557}."
  en: "In 252 AH al-Musta'in was deposed and al-Mu'tazz was pledged in Muharram; the pledge was taken for him in Baghdad {cite:tabari-tarikh-abu-al-fadl j.9 p.348}. Al-Tabari records the killing of Shurayh al-Habashi {cite:tabari-tarikh-abu-al-fadl j.9 p.354} and al-Mu'tazz's letter striking the names of Bugha and Wasif from the registers {cite:tabari-tarikh-abu-al-fadl j.9 p.354}. According to al-Suyuti, he was pledged at al-Musta'in's deposition in 252 AH, when he was nineteen years old, and no one younger than him had held the caliphate before him {cite:tarikh-khulafa-minhaj-1434 p. 557}."
  fr: "En 252 H, al-Musta'in fut déposé et al-Mu'tazz reçut l'allégeance en Muharram ; l'allégeance fut recueillie pour lui à Bagdad {cite:tabari-tarikh-abu-al-fadl j.9 p.348}. Al-Tabari consigne le meurtre de Shurayh al-Habashi {cite:tabari-tarikh-abu-al-fadl j.9 p.354} et la lettre d'al-Mu'tazz rayant les noms de Bugha et de Wasif des registres {cite:tabari-tarikh-abu-al-fadl j.9 p.354}. Selon al-Suyuti, il reçut l'allégeance à la déposition d'al-Musta'in en 252 H, à l'âge de dix-neuf ans, et nul plus jeune que lui n'avait détenu le califat avant lui {cite:tarikh-khulafa-minhaj-1434 p. 557}."
  es: "En el año 252 de la Hégira, al-Musta'in fue depuesto y al-Mu'tazz fue jurado en Muharram; el juramento se tomó en Bagdad {cite:tabari-tarikh-abu-al-fadl j.9 p.348}. Al-Tabari registra el asesinato de Shurayh al-Habashi {cite:tabari-tarikh-abu-al-fadl j.9 p.354} y la carta de al-Mu'tazz eliminando los nombres de Bugha y Wasif de los registros {cite:tabari-tarikh-abu-al-fadl j.9 p.354}. Según al-Suyuti, fue jurado en la deposición de al-Musta'in en el año 252 de la Hégira, cuando tenía diecinueve años, y nadie más joven que él había ostentado el califato antes que él {cite:tarikh-khulafa-minhaj-1434 p. 557}."
  ur: "252 ہجری میں المستعین کو معزول کیا گیا اور محرم میں المعتز بیعت کی گئی۔ ان کے لیے بغداد میں بیعت لی گئی {حوالہ: طبری-تاریخ-ابو الفضل ج.9 ص348}۔ الطبری نے شوریٰ الحبشی کے قتل کو درج کیا ہے {حوالہ:طبری تاریخ ابو الفضل ج.9 ص354} اور المعتز کا خط جس میں بوغہ اور واصف کے نام درج ہیں {حوالہ:طبری-تاریخ-ابو الفضل 9ص354}۔ السیوطی کے مطابق، وہ 252 ہجری میں المستعین کی معزولی پر بیعت کیے گئے تھے، جب ان کی عمر انیس سال تھی، اور ان سے کم عمر میں ان سے پہلے کوئی بھی خلافت پر فائز نہیں تھا۔ 557}۔"
