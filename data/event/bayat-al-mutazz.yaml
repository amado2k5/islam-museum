label: { ar: "خلع المستعين وبيعة المعتز", en: "Deposition of al-Musta'in and bay'a to al-Mu'tazz" }
summary:
  ar: "في سنة اثنتين وخمسين ومائتين خُلع المستعين وبويع المعتز في محرم، وأُخذت البيعة له ببغداد {cite:tabari-tarikh-abu-al-fadl j.9 p.348}، وذكر الطبري قتل شريح الحبشي {cite:tabari-tarikh-abu-al-fadl j.9 p.354} وكتاب المعتز في إسقاط اسمي بغا ووصيف من الدواوين {cite:tabari-tarikh-abu-al-fadl j.9 p.354}، وعند السيوطي بويع عند خلع المستعين سنة اثنتين وخمسين وله تسع عشرة سنة ولم يل الخلافة قبله أحد أصغر منه {cite:tarikh-khulafa-minhaj-1434 p. 557}."
  en: "In 252 AH al-Musta'in was deposed and al-Mu'tazz was pledged in Muharram; the pledge was taken for him in Baghdad {cite:tabari-tarikh-abu-al-fadl j.9 p.348}. Al-Tabari records the killing of Shurayh al-Habashi {cite:tabari-tarikh-abu-al-fadl j.9 p.354} and al-Mu'tazz's letter striking the names of Bugha and Wasif from the registers {cite:tabari-tarikh-abu-al-fadl j.9 p.354}. According to al-Suyuti, he was pledged at al-Musta'in's deposition in 252 AH, when he was nineteen years old, and no one younger than him had held the caliphate before him {cite:tarikh-khulafa-minhaj-1434 p. 557}."
