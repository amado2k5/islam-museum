class: event
kind: campaign
label:
  ar: "مسعى قلج علي لضم المغرب ⁦(٩٨٩هـ/١٥٨١م)⁩"
  en: "Uluj Ali's bid to annex Morocco (989/1581)"
  es: "El intento de Uluj Ali de anexionarse Marruecos (989/1581)"
  fr: "La tentative d'Uluj Ali d'annexer le Maroc (989/1581)"
  ur: "الوج علی کی مراکش سے الحاق کی کوشش (989/1581)"
summary:
  ar: "مع استقرار الدولة العثمانية في تونس تطلعت أنظار قبودان البحر قلج علي إلى المغرب لضمه، فصدرت الأوامر إليه بالتوجه إليه ووصل الجزائر في جمادى الآخرة ٩٨٩هـ/يونيو ١٥٨١م بينما كان أحمد المنصور مرابطاً بقواته عند نهر تانسيفت قد سدّ مداخل مملكته وحصّن الثغور ووجه سفارة إلى إستانبول، وبعد شبه اتفاق عسكري مع ملك إسبانيا مقابل العرائش لم يجد السلطان بدًا من قبول الأمر الواقع، فأمر قلج علي ونائبه جعفر باشا بالتخلي عن العمل في المغرب والانتقال إلى الشرق حيث اضطربت أمور الحجاز {cite:dawlat-uthmaniyya-salabi p. 270-271}."
  en: "With the Ottoman state settled in Tunis, kapudan Uluj Ali set his sights on annexing Morocco; ordered to march on it, he reached Algiers in Jumada II 989/June 1581 while Ahmad al-Mansur stood camped at the Tensift with his kingdom's passes sealed and shores fortified, an embassy bound for Istanbul and a near-agreement with Spain struck in exchange for Larache. Facing the fait accompli the sultan ordered Uluj Ali and his deputy Jafar Pasha to abandon the Morocco operation and head east, where the Hejaz had grown troubled {cite:dawlat-uthmaniyya-salabi p. 270-271}."
  es: "Con el estado otomano establecido en Túnez, el kapudan Uluj Ali fijó su mirada en la anexión de Marruecos; recibió la orden de marchar sobre él y llegó a Argel en Jumada II 989/junio de 1581, mientras Ahmad al-Mansur permanecía acampado en Tensift con los pasos de su reino sellados y las costas fortificadas, una embajada con destino a Estambul y un acuerdo casi cerrado con España a cambio de Larache. Ante el hecho consumado, el sultán ordenó a Uluj Ali y a su lugarteniente Jafar Pasha que abandonaran la operación en Marruecos y se dirigieran al este, donde el Hiyaz se había vuelto inestable {cite:dawlat-uthmaniyya-salabi p. 270-271}."
  fr: "L'État ottoman étant installé à Tunis, le kapudan Uluj Ali entreprit d'annexer le Maroc. Reçu l'ordre de marcher sur ce pays, il atteignit Alger en Jumada II 989/juin 1581, tandis qu'Ahmad al-Mansur campait au Tensift, les cols de son royaume scellés et les côtes fortifiées, une ambassade en route pour Istanbul et un accord presque conclu avec l'Espagne en échange de Larache. Face à ce fait accompli, le sultan ordonna à Uluj Ali et à son adjoint Jafar Pacha d'abandonner l'opération au Maroc et de se diriger vers l'est, où le Hedjaz était en proie à des troubles (voir Dawlat-Uthmaniyya-Salabi, p. 270-271)."
  ur: "تیونس میں عثمانی ریاست کے آباد ہونے کے بعد، کپودان الوج علی نے مراکش کو الحاق کرنے پر اپنی نظریں مرکوز کر دیں۔ اس پر مارچ کرنے کا حکم دیا، وہ جمعہ II 989/جون 1581 میں الجزائر پہنچا جب کہ احمد المنصور نے Tensift پر ڈیرے ڈالے ہوئے تھے جس میں اس کی بادشاہی کے راستے سیل کیے گئے تھے اور ساحلوں کو مضبوط کیا گیا تھا، استنبول کے لیے ایک سفارت خانہ تھا اور اسپین کے ساتھ قریب قریب معاہدہ لاراچ کے بدلے مارا گیا تھا۔ فتح کا سامنا کرتے ہوئے سلطان نے الوج علی اور اس کے نائب جعفر پاشا کو حکم دیا کہ وہ مراکش کی کارروائی ترک کر کے مشرق کی طرف چلیں، جہاں حجاز پریشان ہو گیا تھا۔ 270-271}۔"
