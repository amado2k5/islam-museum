label: { ar: "قسمة المملكة بين المفوض والموفق", en: "The division of the realm between al-Mufawwid and al-Muwaffaq", es: "La división del reino entre al-Mufawwid y al-Muwaffaq", fr: "La division du royaume entre al-Mufawwid et al-Muwaffaq", ur: "المفواد اور الموفق کے درمیان دائرے کی تقسیم", tr: "Krallığın komiser ve arabulucu arasında bölünmesi", id: "Pembagian kerajaan antara komisaris dan mediator" }
summary:
  ar: "في سنة إحدى وستين ومائتين جلس المعتمد في دار العامة لثنتي عشرة مضت من شوال فولّى جعفرًا ابنه العهد وسماه المفوض إلى الله ثانيًا، وولّاه المغرب وضم إليه موسى بن بغا وولاه إفريقية ومصر والشام والجزيرة والموصل وأرمينية وطريق خراسان؛ وولّى أبا أحمد أخاه العهد بالتالي وجعله ثالثًا وولّاه المشرق وضم إليه سرور البلخي وولّاه بغداد والسواد والكوفة وطريق مكة والمدينة واليمن ومكة والبصرة وكرخ دجلة والأهواز وأصبهان وفارس والكرج والري وزنجان وقزوين وخراسان وطبرستان وجرجان وسجستان والسند، وعقد لكل واحد منهما لواءين أسود وأبيض، وشرط أن حدث به حدث أو بجعفر لم يكن الأمر إلا لأبي أحمد ثم لجعفر، وأُخذت البيعة على الناس بذلك وأُمرت سُدق الكتاب بذلك وبعثت نسخة مع الحسن بن الحسن بن أبي الشوارب ليعلقها في الكعبة {cite:muntazam-ibn-al-jawzi p. 116-117}."
  en: "In Shawwal 261 al-Mu'tamid held public court and divided the realm between two heirs: his son Ja'far — named al-Mufawwid ila'llah — receiving the west (Ifriqiya, Egypt, Syria, the Jazira, Mosul, Armenia, the Khurasan road) with Musa ibn Bugha attached, and his brother Abu Ahmad — the future al-Muwaffaq — receiving the east (Baghdad, the Sawad, Kufa, the Hijaz roads, Yemen, Basra, Khuzistan, Fars, Rayy, Khurasan, Sijistan, Sind) with Sajur al-Bulkhi attached; each got a black and a white banner, Abu Ahmad was made next in line after Ja'far, the bay'a was taken and a copy of the deed hung in the Ka'ba {cite:muntazam-ibn-al-jawzi p. 116-117}."
  es: "En Shawwal 261, al-Mu'tamid celebró una corte pública y dividió el reino entre dos herederos: su hijo Ja'far —llamado al-Mufawwid ila'llah— recibió el oeste (Ifriqiya, Egipto, Siria, Jazira, Mosul, Armenia, el camino de Jorasán) con Musa ibn Bugha adjunto, y su hermano Abu Ahmad —el futuro al-Muwaffaq— recibió el este (Bagdad, Sawad, Kufa, los caminos del Hiyaz, Yemen, Basora, Juzestán, Fars, Rayy, Jorasán, Sijistan, Sind) con Sajur al-Bulkhi adjunto; cada uno recibió un estandarte negro y uno blanco, Abu Ahmad fue nombrado siguiente en la línea de sucesión después de Ja'far, se tomó el bay'a y una copia del documento colgó en la Kaaba {cite:muntazam-ibn-al-jawzi p. 116-117}."
  fr: "En Shawwal 261, al-Mu'tamid tint un tribunal public et divisa le royaume entre deux héritiers: son fils Ja'far — nommé al-Mufawwid ila'llah — reçut l'ouest (Ifriqiya, Égypte, Syrie, la Jazira, Mossoul, Arménie, la route du Khorasan) avec Musa ibn Bugha attaché, et son frère Abu Ahmad — le futur al-Muwaffaq — reçut l'est (Bagdad, le Sawad, Kufa, les routes du Hedjaz, le Yémen, Bassora, le Khuzistan, le Fars, Rayy, le Khorasan, le Sijistan, le Sind) avec Sajur al-Bulkhi attaché; chacun reçut une bannière noire et une blanche, Abu Ahmad fut placé juste après Ja'far, la bay'a fut prise et une copie de l'acte fut accrochée dans la Kaaba {cite: muntazam-ibn-al-jawzi p. 116-117}."
  ur: "شوال 261 میں معتمد نے عوامی عدالت منعقد کی اور دو وارثوں کے درمیان دائرہ تقسیم کیا: اس کے بیٹے جعفر نے - جس کا نام المفاوید الا اللہ تھا - مغرب ⁦(افریقیہ، مصر، شام، جزیرہ، موصل، آرمینیا، خراسان روڈ)⁩ کو موسیٰ ابن بغضاء اور مستقبل کے بھائی ابو بغضاء کے ساتھ ملایا۔ مشرق ⁦(بغداد، سواد، کوفہ، حجاز کی سڑکیں، یمن، بصرہ، خوزستان، فارس، رے، خراسان، سجستان، سندھ)⁩ کا حصول سجور البلخی کے ساتھ منسلک؛ ہر ایک کو ایک سیاہ اور ایک سفید جھنڈا ملا، ابو احمد کو جعفر کے بعد قطار میں کھڑا کیا گیا، بیعت لی گئی اور عمل کی ایک نقل خانہ کعبہ میں لٹکا دی گئی۔ 116-117}۔"
  tr: "261 yılında, Şevval ayının on ikinci günü, el-Mu'tamid meyhanede oturarak oğlu Cafer'i halefi olarak atadı ve ona El-Muvefed ila Allah II adını verdi; onu Mağrip valisi olarak atadı ve yanına Musa bin Buga'yı da ekleyerek onu İfrikiye, Mısır, Levant, Cezire, Musul, Ermenistan ve Horasan yolunun valisi olarak atadı. Ebu Ahmed, kardeşini halefi olarak atadı ve onu üçüncü kişi yaptı, onu doğuya atadı ve Surur el-Belhi'yi de ona dahil etti. Onu Bağdat, Sawad, Kufe, Mekke ve Medine yolu, Yemen, Mekke, Basra, Dicle Kerh, Ahvaz, İsfahan, Fars, Karaj, Rayy, Zencan, Kazvin, Horasan, Taberistan, Curcan, Sijistan ve Sindh'e atadı ve her birine siyah ve beyaz olmak üzere iki sancak verdi ve kendisine veya Cafer'e bir şey olursa, meselenin yalnızca Ebu Ahmed'in ve sonra da Cafer'in sorumluluğunda olacağını şart koştu. Bununla birlikte halktan biat alındı ve kâtiplere bunu yapmaları emredildi ve bir kopyası da Kâbe'ye asılması için Hasan ibn el-Hasan ibn Abi el-Şavirib'e gönderildi. {Kaynak: Muntazam ibn el-Cevzi s. 116-117}."
  id: "Pada tahun 261, Al-Mu'tamid duduk di balai kota pada tanggal 12 Syawal dan mengangkat putranya Ja'far sebagai penggantinya dan memberinya gelar Al-Muwafadd ila Allah II, serta mengangkatnya sebagai gubernur Maghreb dan menambahkan Musa bin Bugha kepadanya dan mengangkatnya sebagai gubernur Ifriqiya, Mesir, Levant, Jazira, Mosul, Armenia dan jalan menuju Khorasan. Abu Ahmad mengangkat saudaranya sebagai penggantinya dan menjadikannya orang ketiga, dan menugaskannya ke wilayah Timur, termasuk Surur al-Balkhi bersamanya, dan menugaskannya ke Baghdad, Sawad, Kufa, jalan menuju Mekah dan Madinah, Yaman, Mekah, Basra, Karkh di tepi Sungai Tigris, Ahwaz, Isfahan, Fars, Karaj, Rayy, Zanjan, Qazvin, Khorasan, Tabaristan, Jurjan, Sijistan, dan Sindh, dan memberi masing-masing dari mereka dua panji, hitam dan putih, dan menetapkan bahwa jika sesuatu terjadi padanya atau pada Ja'far, masalah itu hanya akan menjadi urusan Abu Ahmad dan kemudian untuk Ja'far, dan sumpah setia diambil dari rakyat dengan itu, dan para juru tulis diperintahkan untuk melakukannya, dan salinannya dikirim bersama al-Hasan ibn al-Hasan ibn Abi al-Shawarib untuk digantung di Ka'bah {cite:muntazam-ibn-al-jawzi p. 116-117}."
