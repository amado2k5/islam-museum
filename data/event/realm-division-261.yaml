label: { ar: "قسمة المملكة بين المفوض والموفق", en: "The division of the realm between al-Mufawwid and al-Muwaffaq" }
summary:
  ar: "في سنة إحدى وستين ومائتين جلس المعتمد في دار العامة لثنتي عشرة مضت من شوال فولّى جعفرًا ابنه العهد وسماه المفوض إلى الله ثانيًا، وولّاه المغرب وضم إليه موسى بن بغا وولاه إفريقية ومصر والشام والجزيرة والموصل وأرمينية وطريق خراسان؛ وولّى أبا أحمد أخاه العهد بالتالي وجعله ثالثًا وولّاه المشرق وضم إليه سرور البلخي وولّاه بغداد والسواد والكوفة وطريق مكة والمدينة واليمن ومكة والبصرة وكرخ دجلة والأهواز وأصبهان وفارس والكرج والري وزنجان وقزوين وخراسان وطبرستان وجرجان وسجستان والسند، وعقد لكل واحد منهما لواءين أسود وأبيض، وشرط أن حدث به حدث أو بجعفر لم يكن الأمر إلا لأبي أحمد ثم لجعفر، وأُخذت البيعة على الناس بذلك وأُمرت سُدق الكتاب بذلك وبعثت نسخة مع الحسن بن الحسن بن أبي الشوارب ليعلقها في الكعبة {cite:muntazam-ibn-al-jawzi p. 116-117}."
  en: "In Shawwal 261 al-Mu'tamid held public court and divided the realm between two heirs: his son Ja'far — named al-Mufawwid ila'llah — receiving the west (Ifriqiya, Egypt, Syria, the Jazira, Mosul, Armenia, the Khurasan road) with Musa ibn Bugha attached, and his brother Abu Ahmad — the future al-Muwaffaq — receiving the east (Baghdad, the Sawad, Kufa, the Hijaz roads, Yemen, Basra, Khuzistan, Fars, Rayy, Khurasan, Sijistan, Sind) with Sajur al-Bulkhi attached; each got a black and a white banner, Abu Ahmad was made next in line after Ja'far, the bay'a was taken and a copy of the deed hung in the Ka'ba {cite:muntazam-ibn-al-jawzi p. 116-117}."
