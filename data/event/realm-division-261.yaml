id: event/realm-division-261
class: event
kind: other
label: { ar: "قسمة المملكة بين المفوض والموفق", en: "The division of the realm between al-Mufawwid and al-Muwaffaq", es: "La división del reino entre al-Mufawwid y al-Muwaffaq", fr: "La division du royaume entre al-Mufawwid et al-Muwaffaq" }
summary:
  ar: "في سنة إحدى وستين ومائتين جلس المعتمد في دار العامة لثنتي عشرة مضت من شوال فولّى جعفرًا ابنه العهد وسماه المفوض إلى الله ثانيًا، وولّاه المغرب وضم إليه موسى بن بغا وولاه إفريقية ومصر والشام والجزيرة والموصل وأرمينية وطريق خراسان؛ وولّى أبا أحمد أخاه العهد بالتالي وجعله ثالثًا وولّاه المشرق وضم إليه سرور البلخي وولّاه بغداد والسواد والكوفة وطريق مكة والمدينة واليمن ومكة والبصرة وكرخ دجلة والأهواز وأصبهان وفارس والكرج والري وزنجان وقزوين وخراسان وطبرستان وجرجان وسجستان والسند، وعقد لكل واحد منهما لواءين أسود وأبيض، وشرط أن حدث به حدث أو بجعفر لم يكن الأمر إلا لأبي أحمد ثم لجعفر، وأُخذت البيعة على الناس بذلك وأُمرت سُدق الكتاب بذلك وبعثت نسخة مع الحسن بن الحسن بن أبي الشوارب ليعلقها في الكعبة {cite:muntazam-ibn-al-jawzi p. 116-117}."
  en: "In Shawwal 261 al-Mu'tamid held public court and divided the realm between two heirs: his son Ja'far — named al-Mufawwid ila'llah — receiving the west (Ifriqiya, Egypt, Syria, the Jazira, Mosul, Armenia, the Khurasan road) with Musa ibn Bugha attached, and his brother Abu Ahmad — the future al-Muwaffaq — receiving the east (Baghdad, the Sawad, Kufa, the Hijaz roads, Yemen, Basra, Khuzistan, Fars, Rayy, Khurasan, Sijistan, Sind) with Sajur al-Bulkhi attached; each got a black and a white banner, Abu Ahmad was made next in line after Ja'far, the bay'a was taken and a copy of the deed hung in the Ka'ba {cite:muntazam-ibn-al-jawzi p. 116-117}."
  es: "En Shawwal 261, al-Mu'tamid celebró una corte pública y dividió el reino entre dos herederos: su hijo Ja'far —llamado al-Mufawwid ila'llah— recibió el oeste (Ifriqiya, Egipto, Siria, Jazira, Mosul, Armenia, el camino de Jorasán) con Musa ibn Bugha adjunto, y su hermano Abu Ahmad —el futuro al-Muwaffaq— recibió el este (Bagdad, Sawad, Kufa, los caminos del Hiyaz, Yemen, Basora, Juzestán, Fars, Rayy, Jorasán, Sijistan, Sind) con Sajur al-Bulkhi adjunto; cada uno recibió un estandarte negro y uno blanco, Abu Ahmad fue nombrado siguiente en la línea de sucesión después de Ja'far, se tomó el bay'a y una copia del documento colgó en la Kaaba {cite:muntazam-ibn-al-jawzi p. 116-117}."
  fr: "En Shawwal 261, al-Mu'tamid tint un tribunal public et divisa le royaume entre deux héritiers: son fils Ja'far — nommé al-Mufawwid ila'llah — reçut l'ouest (Ifriqiya, Égypte, Syrie, la Jazira, Mossoul, Arménie, la route du Khorasan) avec Musa ibn Bugha attaché, et son frère Abu Ahmad — le futur al-Muwaffaq — reçut l'est (Bagdad, le Sawad, Kufa, les routes du Hedjaz, le Yémen, Bassora, le Khuzistan, le Fars, Rayy, le Khorasan, le Sijistan, le Sind) avec Sajur al-Bulkhi attaché; chacun reçut une bannière noire et une blanche, Abu Ahmad fut placé juste après Ja'far, la bay'a fut prise et une copie de l'acte fut accrochée dans la Kaaba {cite: muntazam-ibn-al-jawzi p. 116-117}."
