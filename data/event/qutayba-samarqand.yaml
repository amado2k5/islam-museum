id: event/qutayba-samarqand
class: event
kind: conquest
label: { ar: "فتح قتيبة سمرقند", en: "Qutayba's Conquest of Samarqand", es: "La conquista de Samarcanda por Qutayba", fr: "La conquête de Samarqand par Qutayba", ur: "قتیبہ کی سمرقند کی فتح" }
summary:
  ar: "غزا قتيبة سمرقند وكانت ملوك السغد تنزلها قديماً ثم نزلت إشتيغن فحصر أهلها والتقوا مراراً فاقتتلوا وكتب ملك السغد إلى ملك الشاش وهو مقيم بالطاربند فأتاه في خلق من مقاتلته فلقيهم المسلمون فاقتتلوا أشد قتال ثم إن قتيبة أوقع بهم وكسرهم فصالحه غورك على ألفين ومائتي ألف درهم في كل عام وعلى أن يصلي في المدينة فدخلها وقد اتخذ له غورك طعاماً فأكل وصلى واتخذ مسجداً وخلف بها جماعة من المسلمين فيهم الضحاك بن مزاحم صاحب التفسير ويقال إنه صالحه على سبعمائة ألف درهم وضيافة المسلمين ثلاثة أيام وكان في صلحه بيوت الأصنام والنيران فأخرجت الأصنام فسلبت حليتها وأحرقت وكانت الأعاجم تقول إن فيها أصناماً من استخف بها هلك فلما حرقها قتيبة بيده أسلم منهم خلق وقال المختار بن كعب الجمحي دوخ السغد بالمبائل حتى ترك السغد بالعراء قعوداً وقال أبو عبيدة فتح قتيبة خوارزم وفتح سمرقند عنوة وقد كان سعيد بن عثمان صالح أهلها ففتحها قتيبة بعده ولم يكونوا نقضوا ولكنه استقل صلحهم وفتح بيكند وكش ونسف والشاش وغزا فرغانة ففتح بمها وغزا السغد وأشروسنة. ويذكر الكتاب أن طرخون صاحب سمرقند نقض الصلح الذي أبرمه قتيبة سنة 90هـ، فحاصرها قتيبة، واستنجد أهلها بملوك الشاش وفرغانة، فأوقع بهم قتيبة وقتل الكثيرين، ثم صالحه أهل المدينة على الجزية المذكورة وعلى أن تخلو المدينة من المقاتلة. {cite:salabi-umayyad-state-2020 p.92-93}"
  en: "Qutayba besieged Samarqand — the old seat of Sughd's kings before Ishtikhan — through repeated battles, while the Shash king came from Tarband with his fighters for the fiercest fighting, broken and routed. Ghurak truced at two hundred and two thousand dirhams yearly with leave to pray in the city — entered, ate the food Ghurak prepared, built a mosque, and left a Muslim colony including the exegete al-Dahhak ibn Muzahim — or, some say, seven hundred thousand and three days' hospitality. The pact covered the idol- and fire-houses: the idols were taken out, stripped, and burned — the Ajam swore whoever touched them perished — and when Qutayba burned them with his own hand many embraced Islam. Abu Ubayda counts the conquest by force, Sa'id's unbroken sulh deemed too small; and he opened Baykand, Kish, Nasaf, al-Shash, Bum of Farghana, Sughd and Ushrusana."
  es: "Qutayba sitió Samarcanda —antigua sede de los reyes de Sughd antes de Ishtikhan— mediante repetidas batallas, mientras que el rey Shash llegó de Tarband con sus guerreros para la lucha más feroz, quebrantada y derrotada. Ghurak pagó una tregua de doscientos dos mil dirhams anuales con permiso para rezar en la ciudad —entró, comió la comida que Ghurak preparó, construyó una mezquita y dejó una colonia musulmana que incluía al exegeta al-Dahhak ibn Muzahim— o, algunos dicen, setecientos mil y tres días de hospitalidad. El pacto abarcaba las casas de ídolos y fuegos: los ídolos fueron sacados, despojados y quemados —el Ajam juró que quien los tocara perecería— y cuando Qutayba los quemó con su propia mano muchos abrazaron el Islam. Abu Ubayda considera la conquista por la fuerza, el sulh ininterrumpido de Sa'id considerado demasiado pequeño; y abrió Baykand, Kish, Nasaf, al-Shash, Bum de Farghana, Sughd y Ushrusana."
  fr: "Qutayba assiégea Samarcande, l'ancienne capitale des rois de Sughd avant Ishtikhan, au cours de batailles répétées. Le roi Shash, venu de Tarband avec ses guerriers, livra un combat acharné, mais fut vaincu et mis en déroute. Ghurak conclut une trêve à hauteur de deux cent deux mille dirhams par an, assortie de la permission de prier en ville. Les musulmans s'y installèrent, mangèrent les mets préparés par Ghurak, construisirent une mosquée et y fondèrent une colonie musulmane, parmi laquelle figurait l'exégète al-Dahhak ibn Muzahim. Certains affirment qu'il leur offrait également sept cent mille dirhams et trois jours d'hospitalité. Le pacte concernait aussi les temples et les crématoires: les idoles furent sorties, dépouillées et brûlées – l'Ajam jura que quiconque les toucherait périrait – et lorsque Qutayba les brûla de ses propres mains, beaucoup se convertirent à l'islam. Abu Ubayda considère la conquête comme une victoire par la force, tandis que le sulh intact de Sa'id est jugé trop modeste. et il ouvrit Baykand, Kish, Nasaf, al-Shash, Bum de Farghana, Sughd et Ushrusana."
  ur: "قتیبہ نے بار بار لڑائیوں کے ذریعے سمرقند کا محاصرہ کیا جو کہ سغد کے بادشاہوں کی پرانی نشست تھی، جب کہ شش بادشاہ اپنے جنگجوؤں کے ساتھ شدید ترین لڑائی کے لیے تربند سے آیا، ٹوٹا اور شکست کھا گیا۔ غورک نے شہر میں نماز کی چھٹی کے ساتھ سالانہ دو لاکھ درہم کی ادائیگی کی - گھر میں داخل ہوا، گھرک نے تیار کیا ہوا کھانا کھایا، ایک مسجد بنائی، اور ایک مسلم کالونی کو چھوڑ دیا جس میں مفسر الضحاک ابن مزاحم بھی شامل ہے - یا بعض کہتے ہیں کہ سات لاکھ تین دن کی مہمان نوازی کی۔ اس معاہدے میں بت اور آتش گیر مکانات کا احاطہ کیا گیا: بت نکالے گئے، چھین لیے گئے اور جلا دیے گئے - عجم نے قسم کھائی جس نے انھیں چھوا وہ ہلاک ہو گیا - اور جب قتیبہ نے انھیں اپنے ہاتھ سے جلایا تو بہت سے لوگ اسلام قبول کر گئے۔ ابو عبیدہ نے فتح کو طاقت سے شمار کیا، سعید کی نہ ٹوٹنے والی سلح کو بہت چھوٹا سمجھا۔ اور اس نے بیاقند، کیش، نصف، الشاش، بم آف فرغانہ، صغد اور عشروسانہ کھولے۔"
