label: { ar: "فتح قتيبة سمرقند", en: "Qutayba's Conquest of Samarqand" }
summary:
  ar: "غزا قتيبة سمرقند وكانت ملوك السغد تنزلها قديماً ثم نزلت إشتيغن فحصر أهلها والتقوا مراراً فاقتتلوا وكتب ملك السغد إلى ملك الشاش وهو مقيم بالطاربند فأتاه في خلق من مقاتلته فلقيهم المسلمون فاقتتلوا أشد قتال ثم إن قتيبة أوقع بهم وكسرهم فصالحه غورك على ألفين ومائتي ألف درهم في كل عام وعلى أن يصلي في المدينة فدخلها وقد اتخذ له غورك طعاماً فأكل وصلى واتخذ مسجداً وخلف بها جماعة من المسلمين فيهم الضحاك بن مزاحم صاحب التفسير ويقال إنه صالحه على سبعمائة ألف درهم وضيافة المسلمين ثلاثة أيام وكان في صلحه بيوت الأصنام والنيران فأخرجت الأصنام فسلبت حليتها وأحرقت وكانت الأعاجم تقول إن فيها أصناماً من استخف بها هلك فلما حرقها قتيبة بيده أسلم منهم خلق وقال المختار بن كعب الجمحي دوخ السغد بالمبائل حتى ترك السغد بالعراء قعوداً وقال أبو عبيدة فتح قتيبة خوارزم وفتح سمرقند عنوة وقد كان سعيد بن عثمان صالح أهلها ففتحها قتيبة بعده ولم يكونوا نقضوا ولكنه استقل صلحهم وفتح بيكند وكش ونسف والشاش وغزا فرغانة ففتح بمها وغزا السغد وأشروسنة. ويذكر الكتاب أن طرخون صاحب سمرقند نقض الصلح الذي أبرمه قتيبة سنة 90هـ، فحاصرها قتيبة، واستنجد أهلها بملوك الشاش وفرغانة، فأوقع بهم قتيبة وقتل الكثيرين، ثم صالحه أهل المدينة على الجزية المذكورة وعلى أن تخلو المدينة من المقاتلة. {cite:salabi-umayyad-state-2020 p.92-93}"
  en: "Qutayba besieged Samarqand — the old seat of Sughd's kings before Ishtikhan — through repeated battles, while the Shash king came from Tarband with his fighters for the fiercest fighting, broken and routed. Ghurak truced at two hundred and two thousand dirhams yearly with leave to pray in the city — entered, ate the food Ghurak prepared, built a mosque, and left a Muslim colony including the exegete al-Dahhak ibn Muzahim — or, some say, seven hundred thousand and three days' hospitality. The pact covered the idol- and fire-houses: the idols were taken out, stripped, and burned — the Ajam swore whoever touched them perished — and when Qutayba burned them with his own hand many embraced Islam. Abu Ubayda counts the conquest by force, Sa'id's unbroken sulh deemed too small; and he opened Baykand, Kish, Nasaf, al-Shash, Bum of Farghana, Sughd and Ushrusana."
