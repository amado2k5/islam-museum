label: { en: "The Pledge of the Tree (Bay'at al-Ridwan)", ar: "بيعة الرضوان", fr: "Le Serment de l'Arbre (Bay'at al-Ridwan)", es: "El Juramento del Árbol (Bay'at al-Ridwan)", ur: "درخت کا عہد ⁦(بیعت الرضوان)⁩" }
summary:
  en: "In Dhu al-Qa'da 6 AH at al-Hudaybiyya, following rumors that Uthman ibn Affan had been murdered in Mecca, the Prophet summoned the 1,400 Companions to pledge under an acacia tree not to flee and to fight unto death; God revealed His pleasure with the pledge in Surat al-Fath."
  ar: "في ذي القعدة سنة 6هـ بالحديبية، إثر شيوع مقتل عثمان بن عفان بمكة حين أرسله النبي مفاوضاً، دعا النبي الصحابة وكانوا ألفاً وأربعمائة فبايعوه تحت الشجرة على الموت وألا يفروا؛ فأنزل الله رضوانه عنهم في سورة الفتح وبشرهم بالنصر والمغانم."
  fr: "En Dhu al-Qa'da 6 H, à al-Hudaybiyya, à la suite de rumeurs selon lesquelles Uthman ibn Affan avait été assassiné à La Mecque, le Prophète appela les 1 400 Compagnons à jurer sous un acacia de ne pas fuir et de combattre jusqu'à la mort ; Dieu révéla Sa satisfaction du serment dans la sourate al-Fath."
  es: "En Dhu al-Qa'da 6 AH, en al-Hudaybiyya, tras los rumores de que Uthman ibn Affan había sido asesinado en La Meca, el Profeta convocó a los 1400 Compañeros para que juraran bajo un árbol de acacia no huir y luchar hasta la muerte; Dios reveló su complacencia con el juramento en la Sura al-Fath."
  ur: "ذوالقعدہ 6 ہجری میں الحدیبیہ میں، اس افواہ کے بعد کہ عثمان بن عفان کو مکہ میں قتل کر دیا گیا ہے، نبی نے 1400 صحابہ کو ببول کے درخت کے نیچے یہ عہد کرنے کے لیے بلایا کہ وہ نہ بھاگیں گے اور موت تک لڑیں گے۔ اللہ تعالیٰ نے سورۃ الفتح میں عہد کے ساتھ اپنی رضا کا اظہار کیا۔"
