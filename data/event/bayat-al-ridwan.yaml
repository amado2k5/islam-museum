label: { en: "The Pledge of the Tree (Bay'at al-Ridwan)", ar: "بيعة الرضوان" }
summary:
  en: "In Dhu al-Qa'da 6 AH at al-Hudaybiyya, following rumors that Uthman ibn Affan had been murdered in Mecca, the Prophet summoned the 1,400 Companions to pledge under an acacia tree not to flee and to fight unto death; God revealed His pleasure with the pledge in Surat al-Fath."
  ar: "في ذي القعدة سنة 6هـ بالحديبية، إثر شيوع مقتل عثمان بن عفان بمكة حين أرسله النبي مفاوضاً، دعا النبي الصحابة وكانوا ألفاً وأربعمائة فبايعوه تحت الشجرة على الموت وألا يفروا؛ فأنزل الله رضوانه عنهم في سورة الفتح وبشرهم بالنصر والمغانم."
