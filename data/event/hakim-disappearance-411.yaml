label: { ar: "مقتل الحاكم بأمر الله وتستّر أخته ٤١١" }
summary:
  ar: "يروي ابن الجوزي عن أهل مصر أن ست الملك أخت الحاكم جمعها وابن دوّاس قاعده، وأن الحاكم كان يخافه ويقول لست الملك ما لي ولهذا الرجل فهو يريد أن يجمع بيني وبينه، فاصطنعت ست الملك بينهما وأصلا ورد عليها وكلفها أن يقنع لها بما تريد؛ فرجعت إلى ابن دوّاس وركب في ليلته إلى المقطم فخرج معه وصعد الجبل مع اثنين من الرقيق المغاربة، وعلى الصباح جاء العبدان يحملان عليه إلى ابن دوّاس فحمله إلى مجلس ست الملك فدفنته هناك ولم يعرف به، وسترته ثلاثة أيام ونشرت أنه غائب سبعة أيام فمن يتعرض لأمرها فأجرت الركابية ثم بويع علي بن الحاكم وخطب له ونصبته ولي العهد وألبسته تاج المعز ثم قتلت ابن دوّاس على يد نسيم صاحب الستر والسيف بعد أن وعدته الملك والمال، فحزنت وأماتت من العبيد والخدم من علم؛ قيل مات في شوال سنة ٤١١ وله سبع وثلاثون سنة، مدة خلافته خمس وعشرون سنة {cite:muntazam-ibn-al-jawzi j.7 p.302-305}."
