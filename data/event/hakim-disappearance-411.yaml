label: { ar: "مقتل الحاكم بأمر الله وتستّر أخته ٤١١", en: "The Death of al-Hakim bi-Amr Allah and His Sister's Concealment, 411", es: "La muerte de al-Hakim bi-Amr Allah y el encubrimiento de su hermana, 411", fr: "La mort d'al-Hakim bi-Amr Allah et la dissimulation de sa sœur, 411", ur: "الحکیم بن عمرو اللہ کی وفات اور ان کی بہن کی پردہ پوشی، 411", tr: "El-Hakim bi-Amr Allah'ın suikastı ve kız kardeşinin gizlenmesi 411", id: "Pembunuhan Al-Hakim bi-Amr Allah dan penyembunyian saudara perempuannya 411" }
summary:
  ar: "يروي ابن الجوزي عن أهل مصر أن ست الملك أخت الحاكم جمعها وابن دوّاس قاعده، وأن الحاكم كان يخافه ويقول لست الملك ما لي ولهذا الرجل فهو يريد أن يجمع بيني وبينه، فاصطنعت ست الملك بينهما وأصلا ورد عليها وكلفها أن يقنع لها بما تريد؛ فرجعت إلى ابن دوّاس وركب في ليلته إلى المقطم فخرج معه وصعد الجبل مع اثنين من الرقيق المغاربة، وعلى الصباح جاء العبدان يحملان عليه إلى ابن دوّاس فحمله إلى مجلس ست الملك فدفنته هناك ولم يعرف به، وسترته ثلاثة أيام ونشرت أنه غائب سبعة أيام فمن يتعرض لأمرها فأجرت الركابية ثم بويع علي بن الحاكم وخطب له ونصبته ولي العهد وألبسته تاج المعز ثم قتلت ابن دوّاس على يد نسيم صاحب الستر والسيف بعد أن وعدته الملك والمال، فحزنت وأماتت من العبيد والخدم من علم؛ قيل مات في شوال سنة ٤١١ وله سبع وثلاثون سنة، مدة خلافته خمس وعشرون سنة {cite:muntazam-ibn-al-jawzi j.7 p.302-305}."
  en: "Ibn al-Jawzi relates from the people of Egypt that Sitt al-Mulk, al-Hakim's sister, had a gathering with Ibn Dawwas seated by her. Al-Hakim feared him and said to Sitt al-Mulk, 'What have I to do with this man? He wants to bring me together with him.' Sitt al-Mulk arranged a link between them; Ibn Dawwas came back to her and charged her to bring him round to what she wanted. She returned to Ibn Dawwas, and that night he rode to al-Muqattam and climbed the mountain with two Maghribi slaves. At dawn the two slaves came carrying him back to Ibn Dawwas, who brought him to Sitt al-Mulk's assembly. She buried him there and kept it unknown, concealing the matter for three days, and she announced that he was absent for seven. She paid the rikabiyya (the mounted guard) to deal with anyone who opposed her affair. Then Ali ibn al-Hakim was pledged allegiance, the khutba was given in his name, and she set him up as heir apparent and crowned him with the crown of al-Mu'izz. She had Ibn Dawwas killed by the hand of Nasim, master of the curtain and the sword, after promising him kingship and wealth. She grieved, and put to death those among the slaves and servants who knew. It is said he died in Shawwal 411, aged thirty-seven, and that his caliphate lasted twenty-five years {cite:muntazam-ibn-al-jawzi j.7 p.302-305}."
  es: "Ibn al-Jawzi relata, según fuentes egipcias, que Sitt al-Mulk, hermana de al-Hakim, se reunió con Ibn Dawwas, quien estaba sentado a su lado. Al-Hakim le temía y le dijo a Sitt al-Mulk: «¿Qué tengo yo que ver con este hombre? Quiere que me una a él». Sitt al-Mulk orquestó un vínculo entre ellos; Ibn Dawwas regresó con ella y le encargó que lo convenciera de lo que ella quería. Ella volvió con Ibn Dawwas, y esa noche él cabalgó hasta al-Muqattam y subió la montaña con dos esclavos magrebíes. Al amanecer, los dos esclavos regresaron con él ante Ibn Dawwas, quien lo llevó a la asamblea de Sitt al-Mulk. Ella lo enterró allí y lo mantuvo en secreto, ocultando el asunto durante tres días, y anunció que había estado ausente durante siete. Pagó a la rikabiyya (la guardia montada) para que se encargara de cualquiera que se opusiera a su plan. Entonces Ali ibn al-Hakim juró lealtad, se pronunció el sermón en su nombre, y ella lo designó heredero y lo coronó con la corona de al-Mu'izz. Mandó matar a Ibn Dawwas a manos de Nasim, el maestro de la cortina y la espada, después de prometerle el trono y riquezas. Afligida, mandó ejecutar a los esclavos y sirvientes que lo sabían. Se dice que murió en Shawwal 411, a los treinta y siete años, y que su califato duró veinticinco años {cite:muntazam-ibn-al-jawzi, vol. 7, págs. 302-305}."
  fr: "Ibn al-Jawzi rapporte, d'après les Égyptiens, que Sitt al-Mulk, la sœur d'al-Hakim, tenait une réunion en présence d'Ibn Dawwas. Al-Hakim, craignant cet homme, dit à Sitt al-Mulk: « Que me veux-je ? Il cherche à m'associer à lui. » Sitt al-Mulk arrangea une rencontre entre eux; Ibn Dawwas revint la trouver et la chargea de le convaincre. Elle retourna auprès d'Ibn Dawwas, et cette nuit-là, il se rendit à al-Muqattam et gravit la montagne avec deux esclaves maghrébins. À l'aube, les deux esclaves revinrent le chercher auprès d'Ibn Dawwas, qui le conduisit à l'assemblée de Sitt al-Mulk. Elle l'y enterra et garda le secret pendant trois jours, dissimulant l'affaire. Elle annonça ensuite son absence pendant sept jours et paya la rikabiyya (la garde montée) pour éliminer quiconque s'opposerait à sa décision. Ali ibn al-Hakim reçut alors allégeance, le sermon fut prononcé en son nom, et elle le désigna comme héritier présomptif et le couronna de la couronne d'al-Mu'izz. Elle fit assassiner Ibn Dawwas par Nasim, maître du voile et de l'épée, après lui avoir promis royauté et richesses. Affligée, elle fit exécuter parmi les esclaves et les serviteurs qui étaient au courant. On dit qu'il mourut en Shawwal 411, à l'âge de trente-sept ans, et que son califat dura vingt-cinq ans (voir: Muntazam ibn al-Jawzi, vol. 7, p. 302-305)."
  ur: "ابن الجوزی اہل مصر سے نقل کرتے ہیں کہ حاکم کی بہن سیت الملک نے ابن داؤس کے پاس ایک مجلس کی تھی۔ الحاکم اس سے ڈر گیا اور سِت الملک سے کہا کہ میرا اس آدمی سے کیا تعلق؟ وہ مجھے اپنے ساتھ لانا چاہتا ہے۔' سیٹ الملک نے ان کے درمیان ایک ربط کا بندوبست کیا۔ ابن داؤس اس کے پاس واپس آیا اور اسے حکم دیا کہ وہ اسے اس کے پاس لے آئے جو وہ چاہتی ہے۔ وہ ابن داؤس کے پاس واپس آئی، اور اس رات وہ المقطم پر سوار ہوا اور دو مغربی غلاموں کے ساتھ پہاڑ پر چڑھ گیا۔ فجر کے وقت دونوں غلام اسے لے کر ابن داؤس کے پاس آئے، جو اسے سیٹ الملک کی مجلس میں لے آئے۔ اس نے اسے وہیں دفن کیا اور اسے نامعلوم رکھا، اس معاملے کو تین دن تک چھپایا، اور اس نے اعلان کیا کہ وہ سات دنوں سے غیر حاضر تھا۔ اس نے اپنے معاملے کی مخالفت کرنے والے سے نمٹنے کے لیے رکابیہ ⁦(ماؤنٹ گارڈ)⁩ ادا کیا۔ پھر علی بن الحکیم سے بیعت ہوئی، ان کے نام پر خطبہ دیا گیا، اور اس نے انہیں ظاہری وارث مقرر کیا اور انہیں المعز کا تاج پہنایا۔ اس نے ابن داؤس کو پردے اور تلوار کے مالک نسیم کے ہاتھ سے بادشاہی اور دولت کا وعدہ کرنے کے بعد قتل کیا تھا۔ وہ غمگین ہوئی، اور غلاموں اور نوکروں میں سے جو جانتے تھے انہیں قتل کر دیا۔ کہا جاتا ہے کہ ان کی وفات شوال 411 میں، سینتیس سال کی عمر میں ہوئی، اور ان کی خلافت پچیس سال تک جاری رہی۔"
  tr: "İbn el-Cevzi, Mısır halkından rivayetle, hükümdarın kız kardeşi Sitt el-Mulk'ü yanına çağırdığını ve İbn Davut'un onunla birlikte oturduğunu, hükümdarın ondan korktuğunu ve Sitt el-Mulk'e, \"Bu adamla ne işim var? Beni yanına almak istiyor\" dediğini anlatır. Bunun üzerine Sitt el-Mulk aralarında bir anlaşma yaptı ve ona geri dönerek, istediğiyle yetinmesini emretti. Bunun üzerine Sitt el-Mulk İbn Davut'un yanına döndü ve o gece Mukattam'a doğru yola çıktı. İbn Davut da onunla birlikte yola çıktı ve iki Faslı köleyle birlikte dağa tırmandı. Sabahleyin iki köle onu İbn Davut'un yanına getirdi. İbn Davut onu Sitt el-Mulk'ün meclisine götürdü ve Sitt el-Mulk onu orada gömdü; kimse bundan haberdar olmadı. Üç gün boyunca üzerini örttü ve yedi gün boyunca kayıp olduğu söylentisini yaydı. Kim onun işine karışırsa, bir deveci tuttu. Sonra Ali ibn el-Hakim'e biat edildi, onun için bir vaaz verildi ve onu veliaht prens olarak atadı ve başına el-Mu'izz tacını taktı. Sonra, kendisine krallık ve para sözü verdikten sonra, kılıklı ve cübbeli Nasim'in eliyle İbn Davus'u öldürdü. Bunun üzerine üzüldü ve bilen bazı köleleri ve hizmetkarları öldürdü. Rivayetlere göre, 411 yılının Şevval ayında, otuz yedi yaşında öldü. Halifeliği yirmi beş yıl sürdü. {cite:muntazam-ibn-al-jawzi j.7 p.302-305}"
  id: "Ibn al-Jawzi meriwayatkan dari penduduk Mesir bahwa Sitt al-Mulk, saudara perempuan penguasa, membawa Ibn Dawwas bersamanya, dan penguasa itu takut kepadanya dan berkata kepada Sitt al-Mulk, “Apa urusanku dengan orang ini? Dia ingin membawaku bersamanya.” Maka Sitt al-Mulk membuat kesepakatan di antara mereka dan kembali kepadanya serta memerintahkannya untuk memenuhi keinginannya. Kemudian ia kembali kepada Ibn Dawwas dan pergi pada malam itu ke al-Muqattam, lalu Ibn Dawwas ikut bersamanya dan mendaki gunung dengan dua budak Maroko. Pagi harinya, kedua budak itu datang membawa jenazah tersebut kepada Ibn Dawwas, lalu ia membawanya ke dewan Sitt al-Mulk dan Sitt al-Mulk menguburkannya di sana tanpa sepengetahuan siapa pun. Ia menutupi jenazah tersebut selama tiga hari dan menyebarkan kabar bahwa ia hilang selama tujuh hari, sehingga siapa pun yang mengganggu urusannya, ia menyewa seorang penunggang unta. Kemudian Ali ibn al-Hakim diberi baiat dan khutbah diberikan untuknya, lalu ia diangkat sebagai putra mahkota dan mengenakan mahkota al-Mu’izz padanya. Kemudian ia membunuh Ibnu Dawwas di tangan Nasim, orang yang membawa penutup dan pedang, setelah ia menjanjikan kerajaan dan uang kepadanya. Maka ia berduka dan membunuh beberapa budak dan pelayan yang mengetahui hal itu. Dikatakan bahwa ia meninggal pada bulan Syawal tahun 411, pada usia tiga puluh tujuh tahun. Masa kekhalifahannya berlangsung selama dua puluh lima tahun. {cite:muntazam-ibn-al-jawzi j.7 p.302-305}."
