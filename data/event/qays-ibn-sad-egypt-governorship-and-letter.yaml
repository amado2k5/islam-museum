label: { ar: "ولاية قيس بن سعد على مصر ورسالة علي إليه", en: "Qays ibn Sa'd's governorship of Egypt and Ali's letter to him" }
summary:
  ar: "ولّى علي قيس بن سعد مصر بعد مقتل محمد بن أبي حذيفة، فدخلها ونظّم أمورها، وكفّ عمّن امتنع من البيعة، ثم روى أبو مخنف وغيره رسائل بين قيس ومعاوية وروايات عن عزله، ويرد الكتاب كثيراً منها، ويرجّح رواية أن علياً كتب إليه: «إني قد احتجت إلى قربك فاستخلف على عملك وأقدم» {cite:sallabi-ali-vol1 p. 330}{cite:sallabi-ali-vol1 p. 331}{cite:sallabi-ali-vol1 p. 334}."
  en: "Ali sent Qays ibn Sa'd to govern Egypt after Muhammad ibn Abi Hudhayfa's death. Qays organised the province and did not force those who held back from the pledge. Abu Mikhnaf's narrations of letters between Qays and Mu'awiya and of his removal are largely rejected by the book, which prefers a version in which Ali asked him to come to Kufa."
