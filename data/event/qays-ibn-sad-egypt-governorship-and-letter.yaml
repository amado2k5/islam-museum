    summary:
      ar: "يرى الكتاب أن رسائل قيس ومعاوية في روايات أبي مخنف باطلة لا تصح، وأن أبا مخنف متروك في الرواية، ويرجّح رواية الدكتور يحيى اليحيى من طريق مؤرخ مصري ثقة، وأن علياً كتب إلى قيس بالقدوم، وأن عزله كان بمثابة استدعاء {cite:sallabi-ali-vol1 p. 331}{cite:sallabi-ali-vol1 p. 334}."
      en: "The book judges Abu Mikhnaf's letters between Qays and Mu'awiya false and his narrations abandoned; it prefers the account Yahya al-Yahya supports from an Egyptian historian, in which Ali asked Qays to come and the letter amounted to a recall {cite:sallabi-ali-vol1 p. 331}{cite:sallabi-ali-vol1 p. 334}."
