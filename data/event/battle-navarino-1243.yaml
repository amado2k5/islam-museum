summary:
  ar: "لما أجهضت قوات إبراهيم باشا تمرد اليونان أعلنت الصليبية الأوروبية بسط حمايتها على بلاد اليونان، واتفقت روسيا وفرنسا وإنجلترا في الحادي عشر من ذي الحجة على إجبار الدولة العثمانية على إعطاء اليونان استقلالها، فلما رفض السلطان أمرت الدول أساطيلها بالتوجه إلى سواحل اليونان وطلبت من إبراهيم باشا التوقف عن القتال فأجاب بأنه يتلقى الأوامر من خليفة المسلمين أو من أبيه لا من غيرهما، ومع ذلك توقف القتال عشرين يوماً ريثما تصله التعليمات. ويذكر الصلابي أن الجيوش الأوروبية المتحالفة دخلت مرفأ نافارين دون أن ترفع أعلام الحرب فكان دخولها دخول خديعة، ومباغتت الأسطول العثماني المصري المشترك فأطلقت عليه النيران وهزمته هزيمة نكراء وأغرقت السفن، فانقلب الحال وأصبحت القوات العثمانية موضع الضعف بعد أن كانت موضع القوة، ثم عقدت فرنسا وإنجلترا مؤتمراً قرر فصل بلاد اليونان عن الدولة العثمانية على أن يحكمها حاكم نصراني تختاره الدول الثلاث {cite:dawlat-uthmaniyya-salabi p. 366-367}."
  en: "Navarino (1827): the allied British, French and Russian fleets entered the harbour unannounced, surprised the combined Ottoman-Egyptian fleet and destroyed it — after which the powers decreed Greece's separation under a ruler of their choosing {cite:dawlat-uthmaniyya-salabi p. 366-367}."
  fr: "Navarin (1827) : les flottes alliées britannique, française et russe entrèrent dans le port sans s'annoncer, surprirent la flotte ottomano-égyptienne réunie et la détruisirent ; après quoi les puissances décrétèrent la séparation de la Grèce sous un souverain de leur choix {cite:dawlat-uthmaniyya-salabi p. 366-367}."
  es: "Navarino (1827): las flotas aliadas británicas, francesas y rusas entraron en el puerto sin previo aviso, sorprendieron a la flota combinada otomano-egipcia y la destruyeron, tras lo cual las potencias decretaron la separación de Grecia bajo un gobernante de su elección {cite:dawlat-uthmaniyya-salabi p. 366-367}."
  ur: "ناوارینو (1827): اتحادی برطانوی، فرانسیسی اور روسی بحری بیڑے غیر اعلانیہ بندرگاہ میں داخل ہوئے، عثمانی-مصری بحری بیڑے کو حیران کر دیا اور اسے تباہ کر دیا - جس کے بعد طاقتوں نے یونان کی علیحدگی کا فیصلہ اپنے منتخب حکمران کے تحت کیا۔ 366-367}۔"
  tr: "İbrahim Paşa'nın kuvvetleri Yunan isyanını bastırdığında, Avrupa güçleri Yunanistan üzerinde himaye ilan etti. Zilhicce ayının on birinci gününde Rusya, Fransa ve İngiltere, Osmanlı İmparatorluğu'nu Yunanistan'a bağımsızlık vermeye zorlamak konusunda anlaştılar. Sultan reddedince, güçler filolarını Yunan kıyılarına gönderdi ve İbrahim Paşa'dan savaşı durdurmasını istedi. İbrahim Paşa, yalnızca Müslümanların halifesinden veya babasından emir aldığını, başka kimseden almadığını söyledi. Buna rağmen, daha fazla talimat beklerken yirmi gün boyunca savaş durdu. El-Sallabi, müttefik Avrupa ordularının savaş bayraklarını çekmeden Navarino limanına girdiklerini, girişlerinin bir hile olduğunu anlatır. Birleşik Osmanlı-Mısır filosunu şaşırttılar, ateş açarak ezici bir yenilgiye uğrattılar ve gemileri batırdılar. Durum tersine döndü ve bir zamanlar güçlü olan Osmanlı kuvvetleri zayıfladı. Bunun üzerine Fransa ve İngiltere, Yunanistan'ı Osmanlı İmparatorluğu'ndan ayırmaya ve üç güç tarafından seçilen bir Hristiyan vali tarafından yönetilmesine karar veren bir konferans düzenledi. {cite:dawlat-uthmaniyya-salabi s. 366-367}"
  id: "Ketika pasukan Ibrahim Pasha menghancurkan pemberontakan Yunani, kekuatan-kekuatan Eropa menyatakan protektorat mereka atas Yunani. Pada tanggal sebelas Dzul Hijjah, Rusia, Prancis, dan Inggris sepakat untuk memaksa Kekaisaran Ottoman memberikan kemerdekaan kepada Yunani. Ketika Sultan menolak, kekuatan-kekuatan tersebut memerintahkan armada mereka ke pantai Yunani dan menuntut agar Ibrahim Pasha menghentikan pertempuran. Ia menjawab bahwa ia hanya menerima perintah dari Khalifah Muslim atau ayahnya, dan bukan dari orang lain. Meskipun demikian, pertempuran berhenti selama dua puluh hari sementara ia menunggu instruksi lebih lanjut. Al-Sallabi menceritakan bahwa pasukan sekutu Eropa memasuki pelabuhan Navarino tanpa mengibarkan bendera perang mereka, masuknya mereka hanyalah tipu daya. Mereka mengejutkan armada gabungan Ottoman-Mesir, melepaskan tembakan dan menimbulkan kekalahan telak, menenggelamkan kapal-kapal tersebut. Situasi berbalik, dan pasukan Ottoman, yang dulunya kuat, menjadi lemah. Prancis dan Inggris kemudian mengadakan konferensi yang memutuskan untuk memisahkan Yunani dari Kekaisaran Ottoman, dengan seorang gubernur Kristen yang dipilih oleh ketiga kekuatan tersebut untuk memerintahnya. {cite:dawlat-uthmaniyya-salabi p. 366-367}"
