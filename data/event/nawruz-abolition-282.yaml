label: { ar: "إبطال المعتضد مراسم النيروز", en: "Al-Mu'tadid abolishes the Nawruz observances" }
summary:
  ar: "في سنة اثنتين وثمانين أبطل المعتضد ما يفعل في النيروز من وقيد النيران وصب الماء على الناس وأزال سنة المجوس {cite:tarikh-khulafa-minhaj-1434 p. 574}. وعند ابن الجوزي أمر المعتضد بإنشاء الكتب إلى العمال بترك افتتاح الخراج في النيروز الذي هو نيروز العجم وتأخيره إلى اليوم الحادي عشر من حزيران فسُمّي النيروز المعتضدي، وكتب بذلك من الموصل إرادةً للترفيه على الناس؛ ويروى أن المتوكل بدأ تعيين النيروز لما رأى الزرع أخضر وقد استؤذن في الخراج قبل حصاده فوُلّي أمره منجمًا ثم قُتل قبل إتمامه {cite:muntazam-ibn-al-jawzi p. 153-154}."
  en: "In 282 al-Mu'tadid abolished the Nawruz observances — the fire-lighting and the water-pouring on people — doing away with the Magian custom {cite:tarikh-khulafa-minhaj-1434 p. 574}."
