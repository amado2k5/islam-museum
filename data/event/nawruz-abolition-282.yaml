id: event/nawruz-abolition-282
class: event
kind: law-enacted
label: { ar: "إبطال المعتضد مراسم النيروز", en: "Al-Mu'tadid abolishes the Nawruz observances", es: "Al-Mu'tadid suprime las observancias de Nawruz", fr: "Al-Mu'tadid abolit les observances du Nawruz", ur: "المتدید نے نوروز کی تقریبات کو ختم کر دیا۔", tr: "El-Mu'tadid Nevruz törenlerini kaldırdı.", id: "Al-Mu'tadid menghapuskan upacara Nowruz." }
summary:
  ar: "في سنة اثنتين وثمانين أبطل المعتضد ما يفعل في النيروز من وقيد النيران وصب الماء على الناس وأزال سنة المجوس {cite:tarikh-khulafa-minhaj-1434 p. 574}. وعند ابن الجوزي أمر المعتضد بإنشاء الكتب إلى العمال بترك افتتاح الخراج في النيروز الذي هو نيروز العجم وتأخيره إلى اليوم الحادي عشر من حزيران فسُمّي النيروز المعتضدي، وكتب بذلك من الموصل إرادةً للترفيه على الناس؛ ويروى أن المتوكل بدأ تعيين النيروز لما رأى الزرع أخضر وقد استؤذن في الخراج قبل حصاده فوُلّي أمره منجمًا ثم قُتل قبل إتمامه {cite:muntazam-ibn-al-jawzi p. 153-154}."
  en: "In 282 al-Mu'tadid abolished the Nawruz observances — the fire-lighting and the water-pouring on people — doing away with the Magian custom {cite:tarikh-khulafa-minhaj-1434 p. 574}."
  es: "En 282 al-Mu'tadid abolió las observancias de Nawruz —el encendido de fuego y el derramamiento de agua sobre la gente— eliminando la costumbre magiana {cite:tarikh-khulafa-minhaj-1434 p. 574}."
  fr: "En 282, al-Mu'tadid abolit les observances de Nawruz — l'allumage du feu et l'aspersion d'eau sur les gens — supprimant ainsi la coutume des Mages {cite:tarikh-khulafa-minhaj-1434 p. 574}."
  ur: "282 میں المتعدید نے نوروز کی تقریبات کو ختم کر دیا - آگ لگانا اور لوگوں پر پانی ڈالنا - مجوسی رسم کو ختم کرتے ہوئے 574}۔"
  tr: "Hicri 82 yılında, el-Mu'tadid, Nevruz'da ateş yakma ve insanların üzerine su dökme uygulamalarını kaldırdı ve Mecusi geleneğini ortadan kaldırdı (kaynak:tarikh-khulafa-minhaj-1434, s. 574). İbn el-Cevzi'ye göre, el-Mu'tadid, valilere Nevruz'da (Farsça Nevruz) vergi toplamanın 11 Haziran'a kadar ertelenmesi talimatını veren mektuplar gönderilmesini emretti. Bu, el-Mu'tadidi Nevruzu olarak bilindi. Bunu Musul'dan yazdı ve amacı halka sevinç getirmekti. Rivayetlere göre, el-Mutavakkil, ekinlerin yeşerdiğini ve hasattan önce vergi toplama izni alındığını görünce Nevruz tarihini belirlemeye başladı. Bunu denetlemesi için bir astrolog atadı, ancak tamamlanmadan önce öldürüldü (kaynak:muntazam-ibn-al-jawzi, s. 153-154)."
  id: "Pada tahun 82 H, al-Mu'tadid menghapuskan praktik menyalakan api dan menyiram air pada orang-orang selama Nowruz, dan ia menghapuskan kebiasaan Majusi {cite:tarikh-khulafa-minhaj-1434 hlm. 574}. Menurut Ibn al-Jawzi, al-Mu'tadid memerintahkan pengiriman surat kepada para gubernur yang menginstruksikan mereka untuk menunda pengumpulan pajak pada Nowruz, yang merupakan Nowruz Persia, hingga tanggal sebelas Juni. Ini kemudian dikenal sebagai Nowruz al-Mu'tadidi. Ia menulis ini dari Mosul, dengan maksud untuk membawa kegembiraan bagi rakyat. Diriwayatkan bahwa al-Mutawakkil mulai menetapkan tanggal Nowruz ketika ia melihat tanaman hijau dan izin telah diminta untuk mengumpulkan pajak sebelum panen. Ia menunjuk seorang ahli astrologi untuk mengawasinya, tetapi ia terbunuh sebelum selesai {cite:muntazam-ibn-al-jawzi hlm. 153-154}."
