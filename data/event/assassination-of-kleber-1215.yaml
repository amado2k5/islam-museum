id: event/assassination-of-kleber-1215
class: event
kind: other
label: { ar: "قتل كليبر صاري عسكر الفرنسيس ومحاكمة سليمان الحلبي ⁦(محرم 1215هـ / حزيران 1800م)⁩", en: "The killing of General Kléber and the trial of Sulayman al-Halabi (Muharram 1215 / June 1800)", ur: "فرانسیسی سپہ سالار کلیبر کا قتل اور سلیمان حلبی پر مقدمہ ⁦(محرم 1215ھ / جون 1800ء)⁩", fr: "Le meurtre du général Kléber et le procès de Sulayman al-Halabi (Muharram 1215 / juin 1800)", es: "El asesinato del general Kléber y el juicio de Sulayman al-Halabi (Muharram de 1215 / junio de 1800)" }
summary:
  ar: "في يوم السبت الحادي والعشرين من المحرم سنة 1215هـ طعن سليمان الحلبي، وهو شاب من أهل حلب كان يأوي إلى الجامع الأزهر، كليبرَ صاري عسكر الفرنساوية بخنجر في بستان داره بالأزبكية فقتله، وجرح المهندس الذي معه؛ فعقد الفرنسيس محكمة حكمت بحرق يده اليمنى وتخزيقه، وبقطع رؤوس ثلاثة من قرّاء الأزهر الغزّيين أخبرهم بعزمه، وأطلقت مصطفى أفندي البرصلي، ونُفّذ ذلك عند تل العقارب يوم جنازة كليبر، وقد نقل الجبرتي أوراق المحاكمة بلفظها {cite:ajaib-al-athar-moreh-v3 p. 169-172} {cite:ajaib-al-athar-moreh-v3 p. 188-191}."
  en: "On Saturday 21 Muharram 1215 AH Sulayman al-Halabi, a young man from Aleppo who lodged at al-Azhar, stabbed General Kléber, commander of the French, in the garden of his house at al-Azbakiyya, killing him and wounding the engineer with him. The French convened a court that sentenced him to have his right hand burned and to be impaled, and three Gazan Qur'an reciters of al-Azhar whom he had told of his plan to be beheaded, while Mustafa Efendi al-Bursali was acquitted; the sentences were carried out at Tell al-Aqarib on the day of Kléber's funeral. Al-Jabarti copied the trial papers word for word {cite:ajaib-al-athar-moreh-v3 p. 169-172} {cite:ajaib-al-athar-moreh-v3 p. 188-191}."
  fr: "Le samedi 21 Muharram 1215 H, Sulayman al-Halabi, un jeune homme d'Alep logé à al-Azhar, poignarda le général Kléber, commandant des Français, dans le jardin de sa maison d'al-Azbakiyya, le tuant et blessant l'ingénieur qui l'accompagnait. Les Français réunirent un tribunal qui le condamna à avoir la main droite brûlée et à être empalé, et trois récitateurs du Coran gazaouis d'al-Azhar, à qui il avait confié son projet, à être décapités, tandis que Mustafa Efendi al-Bursali fut acquitté ; les peines furent exécutées à Tell al-Aqarib le jour des funérailles de Kléber. Al-Jabarti recopia mot pour mot les pièces du procès {cite:ajaib-al-athar-moreh-v3 p. 169-172} {cite:ajaib-al-athar-moreh-v3 p. 188-191}."
  es: "El sábado 21 de Muharram de 1215 AH, Sulayman al-Halabi, un joven de Alepo alojado en al-Azhar, apuñaló al general Kléber, comandante francés, en el jardín de su casa en al-Azbakiyya, matándolo e hiriendo al ingeniero que lo acompañaba. Los franceses convocaron un tribunal que lo condenó a que le quemaran la mano derecha y lo empalaran, y a tres recitadores del Corán de Gaza, residentes en al-Azhar, a quienes había revelado su plan de ser decapitados, mientras que Mustafa Efendi al-Bursali fue absuelto. Las sentencias se ejecutaron en Tell al-Aqarib el día del funeral de Kléber. Al-Jabarti copió textualmente los documentos del juicio {cite:ajaib-al-athar-moreh-v3 p. 169-172} {cite:ajaib-al-athar-moreh-v3 p. 188-191}."
  ur: "ہفتہ 21 محرم 1215 ہجری کو حلب کے ایک نوجوان سلیمان الحلبی نے جو الازہر میں مقیم تھا، فرانسیسی کمانڈر جنرل کلبر کو العزبکیہ میں اس کے گھر کے باغ میں چاقو سے وار کر کے اسے قتل کر دیا اور انجینئر کو زخمی کر دیا۔ فرانسیسی نے ایک عدالت بلائی جس نے اسے اس کا دایاں ہاتھ جلانے اور جلانے کی سزا سنائی اور الازہر کے تین قاری قرآن جن کا اس نے سر قلم کرنے کے منصوبے کے بارے میں بتایا تھا، جب کہ مصطفیٰ آفندی البرسالی کو بری کر دیا گیا۔ کلبر کے جنازے کے دن ٹیل العقریب میں سزائیں سنائی گئیں۔ الجبارتی نے مقدمے کے کاغذات کو لفظ کے لیے نقل کیا ہے {حوالہ: عجائب الاطہر-مورح-v3 صفحہ۔ 169-172} {حوالہ: عجائب الاطہر موریح صفحہ 3۔ 188-191}۔"
