label: { ar: "قتل كليبر صاري عسكر الفرنسيس ومحاكمة سليمان الحلبي (محرم 1215هـ / حزيران 1800م)", en: "The killing of General Kléber and the trial of Sulayman al-Halabi (Muharram 1215 / June 1800)", ur: "فرانسیسی سپہ سالار کلیبر کا قتل اور سلیمان حلبی پر مقدمہ (محرم 1215ھ / جون 1800ء)" }
summary:
  ar: "في يوم السبت الحادي والعشرين من المحرم سنة 1215هـ طعن سليمان الحلبي، وهو شاب من أهل حلب كان يأوي إلى الجامع الأزهر، كليبرَ صاري عسكر الفرنساوية بخنجر في بستان داره بالأزبكية فقتله، وجرح المهندس الذي معه؛ فعقد الفرنسيس محكمة حكمت بحرق يده اليمنى وتخزيقه، وبقطع رؤوس ثلاثة من قرّاء الأزهر الغزّيين أخبرهم بعزمه، وأطلقت مصطفى أفندي البرصلي، ونُفّذ ذلك عند تل العقارب يوم جنازة كليبر، وقد نقل الجبرتي أوراق المحاكمة بلفظها {cite:ajaib-al-athar-moreh-v3 p. 169-172} {cite:ajaib-al-athar-moreh-v3 p. 188-191}."
  en: "On Saturday 21 Muharram 1215 AH Sulayman al-Halabi, a young man from Aleppo who lodged at al-Azhar, stabbed General Kléber, commander of the French, in the garden of his house at al-Azbakiyya, killing him and wounding the engineer with him. The French convened a court that sentenced him to have his right hand burned and to be impaled, and three Gazan Qur'an reciters of al-Azhar whom he had told of his plan to be beheaded, while Mustafa Efendi al-Bursali was acquitted; the sentences were carried out at Tell al-Aqarib on the day of Kléber's funeral. Al-Jabarti copied the trial papers word for word {cite:ajaib-al-athar-moreh-v3 p. 169-172} {cite:ajaib-al-athar-moreh-v3 p. 188-191}."
