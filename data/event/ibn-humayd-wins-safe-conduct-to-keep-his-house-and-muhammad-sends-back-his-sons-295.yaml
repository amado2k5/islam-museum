id: event/ibn-humayd-wins-safe-conduct-to-keep-his-house-and-muhammad-sends-back-his-sons-295
class: event
kind: truce
label:
  ar: "ابن حميد يظفر بالأمان للبقاء في منزله، واستثناء ثلاثة رجال، ورد الأبناء، 295هـ"
  en: "Ibn Humayd wins safe-conduct to stay in his house, three men are excepted, and Muhammad sends his sons back, 295 AH, pp. 364-365"
  ur: "ابن حمید کو گھر میں ٹھہرنے کی امان، تین آدمیوں کا استثنا، اور بیٹوں کی واپسی، 295ھ، ص364-365"
  es: "Ibn Humayd obtiene salvoconducto para quedarse en su casa, se exceptúan tres hombres y Muhammad envía de vuelta a sus hijos, 295 AH, pp. 364-365"
  fr: "Ibn Humayd obtient un sauf-conduit pour rester chez lui, trois hommes sont exemptés, et Muhammad renvoie ses fils, 295 AH, pp. 364-365"
  tr: "İbn Hamid'e, üç adam ve oğullarının dönüşü hariç, evinde kalması için güvenli geçiş izni verildi (Hicri 295)."
  id: "Ibn Hamid diberi izin untuk tetap tinggal di rumahnya dengan selamat, kecuali tiga orang laki-laki, dan kembalinya putra-putranya, 295 H."
summary:
  ar: "طلب ابن حميد الأمان من محمد بن عبيد الله بوساطة عبد الله بن منير المزوي وابني الهيثم والأربد، فآمنه على لزوم منزله، ثم أمّن أصحابه إلا منصور بن هشام ويزيد بن الأسود وأبا النضر بن الربيع المداني. ودخل علي والقاسم القرية بغير علم أبيهما فردّهما إلى موضعهما."
  en: "Ibn Humayd asked for safe-conduct through Abdallah ibn Munir al-Muzawi and the two advisers. Muhammad granted it on condition that he stay in his house. Ibn Humayd then sought safety for his companions; Muhammad granted it to all except three men. Ali and al-Qasim had entered the village without their father's knowledge, and he sent them back to their post."
  ur: "ابن حمید نے عبداللہ بن منیر المزوی اور دونوں مشیروں کی وساطت سے امان مانگی، تو محمد نے یہ امان اس شرط پر دی کہ وہ اپنے گھر میں رہے۔ پھر ابن حمید نے اپنے ساتھیوں کی امان مانگی، اور محمد نے تین آدمیوں کے سوا سب کو امان دی۔ علی اور القاسم اپنے والد کی اطلاع کے بغیر گاؤں میں داخل ہو گئے تھے، اور اس نے انہیں ان کی جگہ واپس بھیج دیا۔"
  es: "Ibn Humayd solicitó salvoconducto a través de Abdallah ibn Munir al-Muzawi y los dos consejeros. Mahoma se lo concedió con la condición de que permaneciera en su casa. Ibn Humayd pidió entonces salvoconducto para sus compañeros; Mahoma se lo concedió a todos excepto a tres hombres. Ali y al-Qasim habían entrado en la aldea sin el conocimiento de su padre, y este los envió de vuelta a su puesto."
  fr: "Ibn Humayd sollicita un sauf-conduit par l'intermédiaire d'Abdallah ibn Munir al-Muzawi et de ses deux conseillers. Muhammad le lui accorda à condition qu'il demeure chez lui. Ibn Humayd demanda ensuite la protection de ses compagnons; Muhammad l'accorda à tous, sauf à trois. Ali et al-Qasim étaient entrés dans le village à l'insu de leur père, qui les renvoya à leur poste."
  tr: "İbn Humayd, Abdullah ibn Munir el-Mazwi ve Haytham ile Arbad'ın iki oğlu aracılığıyla Muhammed ibn Ubeydullah'tan güvenli geçiş istedi. Muhammed, evinde kalması şartıyla ona güvenli geçiş izni verdi ve ardından Mansur ibn Hişam, Yazid ibn el-Esved ve Ebu el-Nadr ibn el-Rabi' el-Medani hariç tüm arkadaşlarına güvenli geçiş izni verdi. Ali ve el-Kasım babalarının haberi olmadan köye girdiler, bu yüzden babaları onları evlerine geri gönderdi."
  id: "Ibn Humayd meminta jalan aman dari Muhammad ibn Ubayd Allah melalui perantara Abdullah ibn Munir al-Mazwi dan dua putra al-Haytham dan al-Arbad. Muhammad mengabulkan permintaannya dengan syarat ia tetap tinggal di rumahnya, dan kemudian mengabulkan permintaan aman kepada para sahabatnya, kecuali Mansur ibn Hisham, Yazid ibn al-Aswad, dan Abu al-Nadr ibn al-Rabi’ al-Madani. Ali dan al-Qasim memasuki desa tanpa sepengetahuan ayah mereka, sehingga ia menyuruh mereka kembali ke tempat mereka."
