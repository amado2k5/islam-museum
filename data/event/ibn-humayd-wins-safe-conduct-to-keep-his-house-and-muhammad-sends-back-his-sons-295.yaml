id: event/ibn-humayd-wins-safe-conduct-to-keep-his-house-and-muhammad-sends-back-his-sons-295
class: event
kind: truce
label:
  ar: "ابن حميد يظفر بالأمان للبقاء في منزله، واستثناء ثلاثة رجال، ورد الأبناء، 295هـ"
  en: "Ibn Humayd wins safe-conduct to stay in his house, three men are excepted, and Muhammad sends his sons back, 295 AH, pp. 364-365"
  ur: "ابن حمید کو گھر میں ٹھہرنے کی امان، تین آدمیوں کا استثنا، اور بیٹوں کی واپسی، 295ھ، ص364-365"
summary:
  ar: "طلب ابن حميد الأمان من محمد بن عبيد الله بوساطة عبد الله بن منير المزوي وابني الهيثم والأربد، فآمنه على لزوم منزله، ثم أمّن أصحابه إلا منصور بن هشام ويزيد بن الأسود وأبا النضر بن الربيع المداني. ودخل علي والقاسم القرية بغير علم أبيهما فردّهما إلى موضعهما."
  en: "Ibn Humayd asked for safe-conduct through Abdallah ibn Munir al-Muzawi and the two advisers. Muhammad granted it on condition that he stay in his house. Ibn Humayd then sought safety for his companions; Muhammad granted it to all except three men. Ali and al-Qasim had entered the village without their father's knowledge, and he sent them back to their post."
  ur: "ابن حمید نے عبداللہ بن منیر المزوی اور دونوں مشیروں کی وساطت سے امان مانگی، تو محمد نے یہ امان اس شرط پر دی کہ وہ اپنے گھر میں رہے۔ پھر ابن حمید نے اپنے ساتھیوں کی امان مانگی، اور محمد نے تین آدمیوں کے سوا سب کو امان دی۔ علی اور القاسم اپنے والد کی اطلاع کے بغیر گاؤں میں داخل ہو گئے تھے، اور اس نے انہیں ان کی جگہ واپس بھیج دیا۔"
