id: event/ali-ibn-muhammad-reaches-saada-and-the-tabari-emigrants-285
class: event
kind: other
label:
  ar: علي بن محمد يصل صعدة مع الحجاج ويجد أباه والياً بها وقدوم المهاجرين الطبريين، ذو الحجة 285هـ
  en: Ali ibn Muhammad reaches Sa'da with the pilgrims, finds his father governor there, and the Tabari emigrants arrive, Dhu al-Hijja 285 AH
  ur: علی بن محمد کا حاجیوں کے ساتھ صعدہ پہنچنا، والد کو وہاں والی پانا اور طبری مہاجرین کی آمد، ذو الحجہ 285ھ
summary:
  ar: يروي علي بن محمد أن هجرته إلى الهادي كانت في ذي الحجة سنة 285هـ، فوصل صعدة ووجد أباه محمد بن عبيد الله فيها والياً للهادي، إذ كان قد كتب إلى الهادي حين اضطربت عليه وساحة ونصب أبو دغيش رايته لحربه، فأمره بالمصير إلى صعدة، فخرج مستخفياً ماشياً ومر بابن عمه حسين بن الحسن والي ساقين فخرجا معاً إلى صعدة. ويصف الراوي اضطراب البلد وقدوم نحو خمسين رجلاً من المهاجرين الطبريين إلى صعدة، ثم مسيرهم إلى الهادي في خيوان، وبقاء علي عند أبيه بأمر الهادي.
  en: Ali ibn Muhammad relates that his emigration to al-Hadi was in Dhu al-Hijja 285 AH; he reached Sa'da and found his father Muhammad ibn Ubaydallah there as al-Hadi's governor. His father, when Wasaha turned against him and Abu al-Dughaysh raised his banner to fight him, had written to al-Hadi, who told him to go to Sa'da and stay there; he left in hiding on foot and passed his cousin Husayn ibn al-Hasan, governor at Saqayn, and the two went on to Sa'da together. The narrator describes the unrest in the town, the arrival at Sa'da of about fifty Tabari emigrants, their going on to al-Hadi at Khiwan, and his own staying with his father at al-Hadi's order.
  ur: علی بن محمد بیان کرتے ہیں کہ ہادی کی طرف ان کی ہجرت ذو الحجہ 285ھ میں ہوئی؛ وہ صعدہ پہنچے تو اپنے والد محمد بن عبید اللہ کو وہاں ہادی کا والی پایا۔ والد نے، جب وساحہ ان کے خلاف ہو گیا اور ابو دغیش نے ان سے لڑنے کے لیے اپنا جھنڈا نصب کیا، ہادی کو لکھا تو ہادی نے صعدہ جا کر وہیں رہنے کا حکم دیا؛ وہ چھپ کر پیدل نکلے اور اپنے چچازاد حسین بن حسن، والیِ ساقین، کے پاس سے گزرے، اور دونوں مل کر صعدہ پہنچے۔ راوی شہر کی بے چینی، تقریباً پچاس طبری مہاجرین کی صعدہ آمد، ان کے خیوان میں ہادی کے پاس جانے اور ہادی کے حکم سے اپنے والد کے ہاں ٹھہرنے کا ذکر کرتے ہیں۔
