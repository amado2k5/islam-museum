label: { ar: "وقعة فحل", en: "The Battle of Fihl" }
summary:
  ar: "عند البلاذري: كانت وقعة فحل من الأردن لليلتين بقيتا من ذي القعدة بعد خلافة عمر بن الخطاب بخمسة أشهر، وأمير الناس أبو عبيدة بن الجراح وكان عمر قد كتب إليه بولايته الشام وأمره الأمراء مع عامر بن أبي وقاص أخي سعد، وقوم يقولون إن ولاية أبي عبيدة الشام أتته والناس محاصرون دمشق فكتمها خالداً أياماً لأن خالداً كان أمير الناس في الحرب فلما سأله خالد عما دعاه إلى ذلك قال «كرهت أن أكسرك وأوهن أمرك وأنت بازاء علوّ»؛ وكان سبب الوقعة أن هرقل لما صار إلى أنطاكية استنفر الروم وأهل الجزيرة وبعث عليهم رجلاً من خاصته وثقاته فلقوا المسلمين بفحل فقاتلوهم أشد قتال وأبرحه حتى أظهرهم الله عليهم وقتل بطريقهم وزهاء عشرة آلاف معه وتفرق الباقون في مدن الشام ولحق بعضهم بهرقل، وتحصن أهل فحل فحصرهم المسلمون حتى سألوا الأمان على أداء الجزية عن رؤوسهم والخراج عن أرضهم فأمنوهم على أنفسهم وأموالهم وأن لا تُهدم حيطانهم، وتولى عقد ذلك أبو عبيدة ويقال شرحبيل بن حسنة."
  en: "In al-Baladhuri: the battle of Fihl of al-Urdunn fell two nights remaining of Dhu al-Qa'da, five months after Umar ibn al-Khattab's accession, the people's commander being Abu Ubayda ibn al-Jarrah — Umar having written to him investing him with Syria and the commanders concurring, together with Amir ibn Abi Waqqas, Sa'd's brother; some say Abu Ubayda's command reached him while the people were besieging Damascus and he concealed it from Khalid for days since Khalid commanded in war, telling him when asked 'I disliked to break you and weaken your standing while you were upon heights'; the battle's cause was Heraclius, come to Antioch, summoning the Romans and the people of the Jazira and setting over them a man of his intimates and trusted men, who met the Muslims at Fihl and fought them hardest until God gave them victory, their patrician and near ten thousand with him falling, the rest scattering through Syria's towns or joining Heraclius; Fihl's people fortified themselves and the Muslims besieged them until they asked safety on paying jizya for their heads and kharaj for their land, securing themselves and their wealth with their walls not to be demolished — Abu Ubayda concluding the compact, some say Shurahbil ibn Hasana."
