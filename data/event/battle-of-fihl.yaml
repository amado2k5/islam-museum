label: { ar: "وقعة فحل", en: "The Battle of Fihl", fr: "La bataille de Fihl", es: "La batalla de Fihl" }
summary:
  ar: "عند البلاذري: كانت وقعة فحل من الأردن لليلتين بقيتا من ذي القعدة بعد خلافة عمر بن الخطاب بخمسة أشهر، وأمير الناس أبو عبيدة بن الجراح وكان عمر قد كتب إليه بولايته الشام وأمره الأمراء مع عامر بن أبي وقاص أخي سعد، وقوم يقولون إن ولاية أبي عبيدة الشام أتته والناس محاصرون دمشق فكتمها خالداً أياماً لأن خالداً كان أمير الناس في الحرب فلما سأله خالد عما دعاه إلى ذلك قال «كرهت أن أكسرك وأوهن أمرك وأنت بازاء علوّ»؛ وكان سبب الوقعة أن هرقل لما صار إلى أنطاكية استنفر الروم وأهل الجزيرة وبعث عليهم رجلاً من خاصته وثقاته فلقوا المسلمين بفحل فقاتلوهم أشد قتال وأبرحه حتى أظهرهم الله عليهم وقتل بطريقهم وزهاء عشرة آلاف معه وتفرق الباقون في مدن الشام ولحق بعضهم بهرقل، وتحصن أهل فحل فحصرهم المسلمون حتى سألوا الأمان على أداء الجزية عن رؤوسهم والخراج عن أرضهم فأمنوهم على أنفسهم وأموالهم وأن لا تُهدم حيطانهم، وتولى عقد ذلك أبو عبيدة ويقال شرحبيل بن حسنة."
  en: "In al-Baladhuri: the battle of Fihl of al-Urdunn fell two nights remaining of Dhu al-Qa'da, five months after Umar ibn al-Khattab's accession, the people's commander being Abu Ubayda ibn al-Jarrah — Umar having written to him investing him with Syria and the commanders concurring, together with Amir ibn Abi Waqqas, Sa'd's brother; some say Abu Ubayda's command reached him while the people were besieging Damascus and he concealed it from Khalid for days since Khalid commanded in war, telling him when asked 'I disliked to break you and weaken your standing while you were upon heights'; the battle's cause was Heraclius, come to Antioch, summoning the Romans and the people of the Jazira and setting over them a man of his intimates and trusted men, who met the Muslims at Fihl and fought them hardest until God gave them victory, their patrician and near ten thousand with him falling, the rest scattering through Syria's towns or joining Heraclius; Fihl's people fortified themselves and the Muslims besieged them until they asked safety on paying jizya for their heads and kharaj for their land, securing themselves and their wealth with their walls not to be demolished — Abu Ubayda concluding the compact, some say Shurahbil ibn Hasana."
  fr: "Chez al-Baladhuri : la bataille de Fihl, en al-Urdunn, eut lieu deux nuits avant la fin de Dhu al-Qa'da, cinq mois après l'avènement d'Umar ibn al-Khattab, le commandant des gens étant Abu Ubayda ibn al-Jarrah, Umar lui ayant écrit pour l'investir de la Syrie et les commandants s'y étant ralliés, avec Amir ibn Abi Waqqas, frère de Sa'd ; certains disent que la nomination d'Abu Ubayda lui parvint pendant que les gens assiégeaient Damas et qu'il la cacha quelques jours à Khalid, puisque Khalid commandait à la guerre, lui disant quand celui-ci l'interrogea : « Je n'ai pas voulu te briser ni affaiblir ta position alors que tu étais sur les hauteurs » ; la cause de la bataille fut qu'Héraclius, venu à Antioche, appela les Romains et les gens de la Jazira et mit à leur tête un homme de ses intimes et de ses hommes de confiance, qui rencontra les musulmans à Fihl et les combattit avec la plus grande âpreté jusqu'à ce que Dieu leur donne la victoire, leur patrice et près de dix mille hommes avec lui tombant, le reste se dispersant dans les villes de Syrie ou rejoignant Héraclius ; les gens de Fihl se fortifièrent et les musulmans les assiégèrent jusqu'à ce qu'ils demandent la sauvegarde moyennant la jizya sur leurs têtes et le kharaj sur leur terre, obtenant la sécurité pour eux-mêmes et leurs biens, leurs murailles ne devant pas être démolies ; Abu Ubayda conclut le pacte, Shurahbil ibn Hasana selon certains."
  es: "En al-Baladhuri: la batalla de Fihl de al-Urdunn tuvo lugar dos noches antes de Dhu al-Qa'da, cinco meses después de la ascensión de Umar ibn al-Khattab, siendo el comandante del pueblo Abu Ubayda ibn al-Jarrah — Umar le había escrito investiéndolo con Siria y los comandantes estaban de acuerdo, junto con Amir ibn Abi Waqqas, hermano de Sa'd; algunos dicen que la orden de Abu Ubayda le llegó mientras el pueblo estaba sitiando Damasco y que se la ocultó a Khalid durante días ya que Khalid comandaba en la guerra, diciéndole cuando le preguntaron: \"No me gustaba quebrarte y debilitar tu posición mientras estabas en las alturas\"; La causa de la batalla fue Heraclio, quien llegó a Antioquía, convocó a los romanos y a la gente de Jazira y puso al mando de ellos a un hombre de su círculo íntimo y de confianza, que se enfrentó a los musulmanes en Fihl y luchó con fiereza hasta que Dios les concedió la victoria. Su patricio y cerca de diez mil hombres con él cayeron, el resto se dispersó por las ciudades de Siria o se unió a Heraclio. La gente de Fihl se fortificó y los musulmanes los sitiaron hasta que pidieron protección pagando la jizya por sus cabezas y el kharaj por sus tierras, asegurándose a sí mismos y a sus riquezas con sus murallas, que no debían ser demolidas. Abu Ubayda concluyó el pacto, según algunos, Shurahbil ibn Hasana."
