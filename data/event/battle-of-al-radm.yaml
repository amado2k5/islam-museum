label: { ar: "يوم الردم بين مراد وهمدان", en: "The Day of al-Radm between Murad and Hamdan" }
summary:
  ar: "وقعة قبيل الإسلام بين مراد وهمدان أصابت فيها همدان من مراد ما أرادوا حتى أثخنوهم؛ قاد همدان فيها الأجدع بن مالك عند ابن إسحاق، ومالك بن حريم الهمداني عند ابن هشام؛ وقال فيها فروة بن مسيك المرادي شعراً، وسأله النبي حين قدم عليه: هل ساءك ما أصاب قومك يوم الردم؟"
  en: "A battle shortly before Islam between Murad and Hamdan in which Hamdan did as they wished with Murad and inflicted heavy losses; Hamdan was led by al-Ajda' ibn Malik according to Ibn Ishaq, by Malik ibn Harim al-Hamdani according to Ibn Hisham. Farwa ibn Musayk of Murad composed verses on it, and the Prophet asked him on his arrival whether what befell his people on the Day of al-Radm grieved him."
