id: event/battle-of-al-kiryawn
class: event
kind: battle
label:
  ar: وقعة الكريون
  en: Battle of al-Kiryawn
  ur: کریون کی لڑائی
summary:
  ar: قتال دار بين المسلمين والروم عند الكريون في الطريق إلى الإسكندرية بضعة عشر يوماً، وكان على المقدمة عبد الله بن عمرو وحامل اللواء وردان مولى عمرو، وصلى فيه عمرو صلاة الخوف {cite:futuh-misr-amir-1999 p. 108} {cite:futuh-misr-amir-1999 p. 109}.
  en: Fighting between the Muslims and the Romans at al-Kiryawn on the road to Alexandria for ten-odd days, with Abd Allah ibn Amr leading the vanguard and Wardan, Amr's client, carrying the standard; Amr led the prayer of fear there {cite:futuh-misr-amir-1999 p. 108} {cite:futuh-misr-amir-1999 p. 109}.
  ur: اسکندریہ کے راستے میں کریون کے مقام پر مسلمانوں اور رومیوں کی دس سے زیادہ دن کی لڑائی؛ ہراول پر عبد اللہ بن عمرو تھے اور علم عمرو کے مولیٰ وردان کے ہاتھ میں تھا؛ عمرو نے وہاں صلاۃ الخوف پڑھائی {cite:futuh-misr-amir-1999 p. 108} {cite:futuh-misr-amir-1999 p. 109}۔
