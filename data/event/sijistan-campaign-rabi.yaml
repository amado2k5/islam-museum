label: { ar: "حملة الربيع بن زياد إلى سجستان", en: "al-Rabi' ibn Ziyad's Sijistan Campaign", es: "Campaña de Sijistán de al-Rabi' ibn Ziyad", fr: "Campagne d'al-Rabi' ibn Ziyad au Sijistan", ur: "الربیع ابن زیاد کی سجستان مہم", tr: "Rabi' ibn Ziyad'ın Sicistan'a seferi", id: "Kampanye Rabi' ibn Ziyad ke Sijistan" }
summary:
  ar: "توجه عبد الله بن عامر يريد خراسان سنة ٣٠ فنزل بعسكر شق الشيرجان من كرمان ووجه الربيع بن زياد بن أنس بن الديان الحارثي إلى سجستان فنزل الفهرج ثم قطع المفازة وهي خمسة وسبعون فرسخاً فأتى رستاق زالق فأغار على أهله يوم مهرجان فأخذ دهقانه فافتدى نفسه بأن ركز عنزة ثم غمرها ذهباً وفضة وصالحه على حقن دمه ثم أتى قرية كركوية فصالحوه ولم يقاتلوه ونزل هيسون فأقاموا له النزل وصالحوه ثم أخذ الأدلاء من زالق إلى زرنج وعبر وادي نوق وأتى زوشت فقاتله أهلها قتالاً شديداً فأصيب رجال من المسلمين ثم هزمهم حتى اضطروهم إلى المدينة ثم أتى ناشروذ فظفر بها وأصاب بها عبد الرحمن أبا صالح الذي كتب للحجاج مكان زدانفروخ وولي خراج العراق لسليمان بن عبد الملك فاشترته امرأة من بني مرة يقال لها عبلة ومن ناشروذ إلى شرواذ فغلب عليها وأصاب بها جد إبراهيم بن بسام فصار لابن عمير الليثي ثم حاصر مدينة زرنج فبعث إليه أبرويز مرزبانها يستأمنه فأمر بجسد من أجساد القتلى فوضع له فجلس عليه واتكأ على آخر وأجلس أصحابه على أجساد القتلى وكان الربيع آدم أفوه طويلاً فلما رآه المرزبان هاله فصالحه على ألف وضيف مع كل وصيف جام من ذهب ودخل الربيع المدينة وكانت ولايته سنتين ونصفاً وسبى فيها أربعين ألف رأس وكان كاتبه الحسن البصري."
  en: "Ibn Amir, bound for Khurasan in 30h, camped at Shaq al-Shirjan and sent al-Rabi' ibn Ziyad into Sijistan: al-Fahraj, then the seventy-five-farsakh mafaza, then Rustaq Zaliq raided on Mihrjan day — its dahqan ransomed himself by planting his spear and piling gold and silver over it — then Karkuya and Haysun surrendered unresisted. Guided to Zaranj across Wadi Nuq, he fought Zusht hard — Muslim dead — till they were forced inside the walls; Nashrudh fell with the father of Abu Salih, later al-Hajjaj's secretary — a Marra woman, Abla, bought him — and Shirwadh with Ibrahim ibn Bassam's grandfather. At Zaranj the marzban Aparwiz sought aman: al-Rabi' sat him on a corpse, leaned on another, seated his companions on corpses — dark, long-limbed, loud-voiced — and the awed marzban truced for a thousand slave-youths each bearing a gold cup. His governorship ran two and a half years, forty thousand captives, and al-Hasan al-Basri was his secretary."
  es: "Ibn Amir, rumbo a Jorasán en el año 30, acampó en Shaq al-Shirjan y envió a al-Rabi' ibn Ziyad a Sijistan: al-Fahraj, luego la mafaza de setenta y cinco farsakh, luego Rustaq Zaliq asaltó el día de Mihrjan —su dahqan se redimió plantando su lanza y apilando oro y plata sobre ella— luego Karkuya y Haysun se rindieron sin resistencia. Guiado a Zaranj a través de Wadi Nuq, luchó a Zusht con fiereza —Musulmanes muertos— hasta que se vieron obligados a entrar en las murallas; Nashrudh cayó con el padre de Abu Salih, más tarde secretario de al-Hajjaj —una mujer marra, Abla, lo compró— y Shirwadh con el abuelo de Ibrahim ibn Bassam. En Zaranj, el marzban Aparwiz buscó aman: al-Rabi' lo sentó sobre un cadáver, se apoyó en otro, sentó a sus acompañantes sobre cadáveres —de tez oscura, extremidades largas y voz potente— y el sobrecogido marzban pactó una tregua por mil jóvenes esclavos, cada uno portando una copa de oro. Su gobierno duró dos años y medio, con cuarenta mil cautivos, y al-Hasan al-Basri fue su secretario."
  fr: "Ibn Amir, en route pour le Khorasan en 30 h, campa à Shaq al-Shirjan et envoya al-Rabi' ibn Ziyad au Sijistan. Al-Fahraj, puis le mafaza des soixante-quinze farsakh, puis Rustaq Zaliq furent attaqués le jour de Mihrjan – son chef se racheta lui-même en plantant sa lance et en y accumulant de l'or et de l'argent – puis Karkuya et Haysun se rendirent sans résistance. Guidé jusqu'à Zaranj à travers le Wadi Nuq, il combattit Zusht avec acharnement – des musulmans périrent – jusqu'à ce qu'ils soient contraints de se retrancher derrière les murs; Nashrudh tomba avec le père d'Abu Salih, futur secrétaire d'al-Hajjaj – une femme Marra, Abla, l'avait acheté – et Shirwadh avec le grand-père d'Ibrahim ibn Bassam. À Zaranj, le marzban Aparwiz chercha un aman: al-Rabi’ le fit asseoir sur un cadavre, s’appuya sur un autre, fit asseoir ses compagnons sur des cadavres – sombres, longilignes, à la voix forte – et le marzban, impressionné, accepta un pacte en échange de mille jeunes esclaves, chacun portant une coupe en or. Son gouvernement dura deux ans et demi, quarante mille captifs, et al-Hasan al-Basri était son secrétaire."
  ur: "ابن عامر نے جو 30ھ میں خراسان کی طرف روانہ ہوا، شق الشرجان میں ڈیرہ ڈالا اور ربیع ابن زیاد کو سجستان میں بھیجا: الفرج، پھر پچھتر فرسخ مفازہ، پھر رستاق ذالک نے مہرجان کے دن چڑھائی کی- اس کے دہقان نے فدیہ لیا اور اس پر سونا چڑھایا اور اس پر چاندی چڑھائی اور پھر اس پر سونا چڑھایا۔ ہیسن نے بغیر مزاحمت کے ہتھیار ڈال دیے۔ وادی نوق کے پار زرنج کی طرف رہنمائی کرتے ہوئے، اس نے زشت کا سخت مقابلہ کیا - مسلمان مردہ ہو گئے - یہاں تک کہ وہ دیواروں کے اندر مجبور ہو گئے۔ ناشرود ابو صالح کے والد کے ساتھ گرا، بعد میں الحجاج کے سکریٹری - ایک مررا عورت، ابلہ نے اسے خرید لیا - اور شیرواد ابراہیم بن بسام کے دادا کے ساتھ۔ زرنج میں مرزبان اپرویز نے امان کی تلاش کی: الربیع نے اسے ایک لاش پر بٹھایا، دوسرے پر ٹیک لگایا، اپنے ساتھیوں کو لاشوں پر بٹھایا - سیاہ، لمبے لمبے، اونچی آواز والے - اور خوف زدہ مرزبان نے ایک ہزار غلام نوجوانوں کے لیے ہر ایک کے پاس سونے کا پیالہ اٹھایا۔ اس کی گورنری ڈھائی سال چلی، چالیس ہزار قیدی تھے اور الحسن البصری اس کا سیکرٹری تھا۔"
  tr: "Abdullah ibn Amir, Hicri 30 yılında Horasan'a doğru yola çıktı. Kerman'da Şak el-Şircan'ın ordusunda kamp kurdu ve Rabi' ibn Ziyad ibn Anas ibn el-Dayyan el-Harithi'yi Sijistan'a gönderdi. Rabi' ibn Ziyad ibn Anas ibn el-Dayyan el-Harithi, el-Fahraj'da kamp kurduktan sonra yetmiş beş fersah uzunluğundaki çölü geçti. Zaliq bölgesine ulaştı ve Mihracan günü halkına baskın düzenleyerek muhtarı esir aldı. Muhtar, bir mızrak dikip üzerine altın ve gümüş örterek fidye ödedi ve hayatının bağışlanması şartıyla onunla barıştı. Daha sonra Karkawiya köyüne geldi ve orada da onunla barıştılar ve savaşmadılar. Haysun'da kamp kurdu ve orada da ona konaklama sağladılar ve onunla barıştılar. Sonra Zaliq'ten rehberler alarak Zaranj'a gitti, Nuq Vadisi'ni geçti ve Zuşt'a ulaştı. Orada halkı ona şiddetle karşı koydu. Bazı Müslümanlar öldürüldü, ancak onları şehre geri çekilmeye zorlayana kadar yendi. Sonra Nashrawdh'a geldi ve orayı fethetti. Orada, Zadanfarukh yerine el-Hajjaj'a mektup yazmış ve Süleyman ibn Abd el-Malik için Irak hazinesini toplamakla görevlendirilmiş olan Abd el-Rahman Ebu Salih'i yakaladı. Beni Murrah kabilesinden Ablah adında bir kadın onu satın aldı. Nashrawdh'dan Şarudh'a gitti ve orayı fethetti, orada İbrahim ibn Bassam'ın dedesini yakaladı. Sonra İbn Umayr el-Laythi onun efendisi oldu ve Zaranj şehrini kuşattı. Bunun üzerine Abroiz, güvenli geçiş için Marzban'ı ona gönderdi. Bunun üzerine ölülerden birinin kendisi için hazırlanmasını emretti ve o da birinin üzerine oturdu, diğerine yaslandı ve arkadaşlarını da ölülerin üzerine oturttu. El-Rabi' uzun boylu, esmer tenli bir adamdı. Marzban onu görünce çok korktu ve bin misafir karşılığında, her misafire altın bir kupa verilerek onunla barış yaptı. El-Rabi şehre girdi ve valiliği iki buçuk yıl sürdü; bu süre zarfında kırk bin kişinin başını esir aldı. Katibi ise el-Hasan el-Basri idi."
  id: "Abdullah ibn Amir berangkat ke Khurasan pada tahun 30 Hijriah. Ia berkemah di pasukan Shaq al-Shirjan di Kerman dan mengutus Rabi' ibn Ziyad ibn Anas ibn al-Dayyan al-Harithi ke Sijistan. Rabi' ibn Ziyad ibn Anas ibn al-Dayyan al-Harithi berkemah di al-Fahraj, kemudian menyeberangi padang pasir yang panjangnya tujuh puluh lima farsakh. Ia sampai di distrik Zaliq dan menyerang penduduknya pada hari Mihrajan, menangkap kepala desa. Kepala desa menebus dirinya dengan menancapkan tombak, kemudian melapisinya dengan emas dan perak, dan berdamai dengannya dengan syarat nyawanya akan diselamatkan. Kemudian ia datang ke desa Karkawiya, dan mereka berdamai dengannya dan tidak melawannya. Ia berkemah di Haysun, dan mereka menyediakan penginapan baginya dan berdamai dengannya. Kemudian ia membawa pemandu dari Zaliq ke Zaranj dan menyeberangi Wadi Nuq dan sampai ke Zusht, di mana penduduknya melawannya dengan sengit. Beberapa Muslim terbunuh, tetapi ia mengalahkan mereka sampai mereka terpaksa mundur ke kota. Kemudian ia datang ke Nashrawdh dan menaklukkannya. Di sana ia menangkap Abd al-Rahman Abu Salih, yang telah menulis surat kepada al-Hajjaj atas nama Zadanfarukh dan telah ditunjuk untuk mengumpulkan perbendaharaan Irak untuk Sulayman ibn Abd al-Malik. Seorang wanita dari suku Banu Murrah, bernama Ablah, membelinya. Dari Nashrawdh, ia pergi ke Sharudh dan menaklukkannya, dan di sana ia menangkap kakek Ibrahim ibn Bassam. Kemudian Ibn Umayr al-Laythi menjadi tuannya, dan ia mengepung kota Zaranj. Maka Abroiz mengirim Marzbannya kepadanya untuk meminta jalan aman. Maka ia memerintahkan agar salah satu mayat diletakkan untuknya, lalu ia duduk di atasnya dan bersandar pada mayat lainnya, dan ia mendudukkan para pengikutnya di atas mayat-mayat tersebut. Al-Rabi’ adalah seorang pria tinggi berkulit gelap. Ketika Marzban melihatnya, ia ketakutan, lalu ia berdamai dengannya dengan seribu tamu, dengan setiap tamu memiliki cangkir emas. Al-Rabi’ memasuki kota, dan masa pemerintahannya berlangsung selama dua setengah tahun, dan ia menangkap empat puluh ribu kepala di kota itu. Juru tulisnya adalah al-Hasan al-Basri."
