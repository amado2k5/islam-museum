label: { en: "The hypocrites' ambush at the pass on the return from Tabuk", ar: "مكر المنافقين بالعقبة في رجوع تبوك" }
summary:
  en: "On the return from Tabuk, twelve hypocrites — faces veiled — attempted to frighten the Prophet's camel at a steep pass; Ammar was holding its halter and Hudhayfa driving it, and Hudhayfa struck the ambushers' mounts with his staff until God terrified them into flight; the Prophet told Hudhayfa their names and their plot, whence Hudhayfa was called 'keeper of the Prophet's secret'."
  ar: "حاول اثنا عشر رجلاً من المنافقين الفتك بالنبي عند عقبة في طريق الرجوع من تبوك؛ كان عمار يقود ناقته بزمامها وحذيفة يسوقها، فسمعوا وكزة القوم من ورائهم وقد غشّوهم وهم ملتثمون، فضرب حذيفة وجوه رواحلهم بمحجن فأرعبهم الله فلحقوا بالقوم، وأخبره النبي بأسمائهم وبما همّوا به، ومن ذلك سُمي حذيفة صاحب سرّ رسول الله، وفي ذلك قوله تعالى: «وهَمُّوا بما لم ينالوا»."
