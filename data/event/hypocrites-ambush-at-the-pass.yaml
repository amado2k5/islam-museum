id: event/hypocrites-ambush-at-the-pass
class: event
kind: other
label: { en: "The hypocrites' ambush at the pass on the return from Tabuk", ar: "مكر المنافقين بالعقبة في رجوع تبوك", es: "La emboscada de los hipócritas en el paso al regresar de Tabuk.", fr: "L'embuscade des hypocrites au col sur le retour de Tabuk", ur: "تبوک سے واپسی پر درے پر منافقوں کی گھات", tr: "Tebuk'tan dönüşte Akabe'deki münafıkların ihaneti", id: "Pengkhianatan kaum munafik di Aqaba saat kembali dari Tabuk" }
summary:
  en: "On the return from Tabuk, twelve hypocrites — faces veiled — attempted to frighten the Prophet's camel at a steep pass; Ammar was holding its halter and Hudhayfa driving it, and Hudhayfa struck the ambushers' mounts with his staff until God terrified them into flight; the Prophet told Hudhayfa their names and their plot, whence Hudhayfa was called 'keeper of the Prophet's secret'."
  ar: "حاول اثنا عشر رجلاً من المنافقين الفتك بالنبي عند عقبة في طريق الرجوع من تبوك؛ كان عمار يقود ناقته بزمامها وحذيفة يسوقها، فسمعوا وكزة القوم من ورائهم وقد غشّوهم وهم ملتثمون، فضرب حذيفة وجوه رواحلهم بمحجن فأرعبهم الله فلحقوا بالقوم، وأخبره النبي بأسمائهم وبما همّوا به، ومن ذلك سُمي حذيفة صاحب سرّ رسول الله، وفي ذلك قوله تعالى: «وهَمُّوا بما لم ينالوا»."
  es: "En el regreso de Tabuk, doce hipócritas, con el rostro velado, intentaron asustar al camello del Profeta en un paso escarpado; Ammar sostenía la brida y Hudhayfa lo conducía, y Hudhayfa golpeó las monturas de los emboscadores con su bastón hasta que Dios los aterrorizó y huyeron; el Profeta le reveló a Hudhayfa sus nombres y su complot, por lo que Hudhayfa fue llamado \"el guardián del secreto del Profeta\"."
  fr: "Au retour de Tabuk, douze hypocrites — le visage voilé — tentèrent d'effrayer le chameau du Prophète à un col escarpé; Ammar tenait la bride et Hudhayfa le menait, et Hudhayfa frappa les montures des assaillants avec son bâton jusqu'à ce que Dieu les fasse fuir par terreur; le Prophète révéla à Hudhayfa leurs noms et leur complot, d'où le surnom de « gardien du secret du Prophète » donné à Hudhayfa."
  ur: "تبوک سے واپسی پر، بارہ منافقوں نے - چہروں پر پردہ ڈالے ہوئے - ایک کھڑی درے پر نبی کے اونٹ کو خوفزدہ کرنے کی کوشش کی۔ عمار نے اس کا ہالٹر پکڑا ہوا تھا اور حذیفہ اسے چلا رہے تھے، اور حذیفہ نے اپنے لاٹھی سے گھات لگانے والوں کے پہاڑوں کو مارا یہاں تک کہ خدا نے انہیں خوفزدہ کر دیا۔ نبی نے حذیفہ کو ان کے نام اور ان کی سازش بتائی، اسی لیے حذیفہ کو 'رسول اللہ کے راز کا محافظ' کہا جاتا تھا۔"
  tr: "Münafıklardan on iki adam, Tebük'ten dönüş yolunda Akabe'de Peygamber'i öldürmeye kalkıştılar. Ammar devesini dizginlerinden çekiyor, Hudeyfe ise sürüyordu. Arkalarından gelen adamların dürtüklerini duydular ve yüzlerini örttüler. Hudeyfe, develerinin yüzlerine bir sopayla vurdu, böylece Allah onları korkuttu ve adamlara yetiştiler. Peygamber onlara isimlerini ve ne yapmayı planladıklarını anlattı. Bundan dolayı Hudeyfe, Allah Resulü'nün sırrını saklayan kişi olarak anıldı. Ve bunda Yüce Allah'ın şu sözü vardır: \"Ve onlar, elde edemeyecekleri bir şeyi amaçladılar.\""
  id: "Dua belas orang dari kalangan munafik berusaha membunuh Nabi di Aqaba dalam perjalanan pulang dari Tabuk. Ammar menuntun untanya dengan tali kekang dan Hudhayfa yang mengemudikannya. Mereka mendengar orang-orang itu mendorong dari belakang mereka, dan mereka menutupi wajah mereka. Hudhayfa memukul wajah unta mereka dengan tongkat, sehingga Allah menakuti mereka, dan mereka berhasil mengejar orang-orang itu. Nabi memberitahukan nama mereka dan apa yang mereka rencanakan. Dari situ, Hudhayfa disebut sebagai penjaga rahasia Rasulullah. Dan di situlah firman Allah Yang Maha Kuasa: “Dan mereka bermaksud melakukan apa yang tidak dapat mereka capai.”"
