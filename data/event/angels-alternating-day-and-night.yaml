id: event/angels-alternating-day-and-night
kind: other
label:
  ar: يتعاقبون فيكم ملائكة بالليل وملائكة بالنهار
  en: Angels alternate among you by night and by day
  ur: ملائکہ رات اور دن میں تم میں باری باری آتے جاتے ہیں
summary:
  ar: 'قال الله في الحديث القدسي: يتعاقبون فيكم ملائكة بالليل وملائكة بالنهار ويجتمعون في صلاة الفجر وصلاة العصر ثم يعرج الذين باتوا فيكم فيسألهم وهو أعلم بهم كيف تركتم عبادي فيقولون تركناهم وهم يصلون {cite:sunan-al-nasai} [[passage/nasai-0485|النسائي 485]].'
  en: 'God said in the hadith qudsi: angels alternate among you by night and angels by day, and they gather at the Fajr and Asr prayers; then those who spent the night among you ascend and He asks them — though He knows best — how they left My servants, and they say: we left them praying {cite:sunan-al-nasai} [[passage/nasai-0485|Nasai 485]].'
  ur: 'اللہ نے حدیث قدسی میں کہا: ملائکہ رات میں تم میں باری باری آتے ہیں اور دن میں ملائکہ، اور وہ نماز فجر اور نماز عصر میں جمع ہوتے ہیں؛ پھر جو رات بھر تم میں رہے وہ چڑھتے ہیں اور وہ ان سے پوچھتا ہے — حالانکہ وہ انہیں بہتر جانتا ہے — میرے بندوں کو تم نے کیسے چھوڑا، تو کہتے ہیں ہم نے انہیں نماز پڑھتے چھوڑا {cite:sunan-al-nasai} [[passage/nasai-0485|نسائی 485]]۔'
