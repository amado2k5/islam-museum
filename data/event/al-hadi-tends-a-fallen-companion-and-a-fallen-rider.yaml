id: event/al-hadi-tends-a-fallen-companion-and-a-fallen-rider
class: event
kind: other
label:
  ar: الهادي يعالج صاحباً أصابه مرض وراكباً سقط عن فرسه
  en: Al-Hadi tends a stricken companion and a rider thrown from his horse
  ur: ہادی ایک بیمار ساتھی اور گھوڑے سے گرے سوار کی تیمارداری کرتے ہیں
  es: "Al-Hadi atiende a un compañero herido y a un jinete que se ha caído de su caballo."
  fr: "Al-Hadi soigne un compagnon blessé et un cavalier désarçonné."
  tr: "El-Hadi, hastalanan bir arkadaşını ve atından düşen bir biniciyi tedavi etti."
  id: "Al-Hadi merawat seorang sahabat yang jatuh sakit dan seorang penunggang kuda yang jatuh dari kudanya."
summary:
  ar: رأى الراوي الهادي في الصحراء ينزل عن فرسه إلى محمد بن عباس الصنعاني وقد سقط على الأرض، فمسح وجهه وقرأ عليه وأركبه حماراً إلى صعدة وقشّر له الرمان بيده حتى أفاق، ثم رآه يداوي بيده رجلاً سقط عن فرسه وأصاب الأرض أنفه.
  en: The narrator saw al-Hadi in the open country dismount to a companion, Muhammad ibn Abbas al-San'ani, who had fallen to the ground; he wiped his face, recited over him, had him taken to Sa'da on a donkey and peeled pomegranates for him by hand until he recovered; he also saw him treat with his own hand a rider whose nose was hurt in a fall.
  ur: راوی نے صحرا میں ہادی کو اپنے ساتھی محمد بن عباس صنعانی کے پاس گھوڑے سے اترتے دیکھا جو زمین پر گرا تھا؛ انہوں نے اس کا چہرہ پونچھا، اس پر پڑھا، گدھے پر صعدہ پہنچایا اور اپنے ہاتھ سے انار چھیل کر دیے یہاں تک کہ وہ ٹھیک ہو گیا؛ ایک سوار کا علاج بھی کیا جس کی ناک گرنے سے زخمی ہوئی تھی۔
  es: "El narrador vio a al-Hadi en campo abierto desmontar para ayudar a un compañero, Muhammad ibn Abbas al-San'ani, que había caído al suelo; le limpió la cara, recitó sobre él, lo hizo llevar a Sa'da en un burro y le peló granadas a mano hasta que se recuperó; también lo vio atender con sus propias manos a un jinete que se había lastimado la nariz en una caída."
  fr: "Le narrateur vit al-Hadi, en pleine campagne, descendre de cheval pour se porter secours à un compagnon, Muhammad ibn Abbas al-San'ani, qui était tombé à terre; il lui essuya le visage, récita des mantras sur lui, le fit transporter à Sa'da sur un âne et éplucha des grenades à la main jusqu'à ce qu'il se rétablisse; il le vit également soigner de sa propre main un cavalier dont le nez était blessé lors d'une chute."
  tr: "Anlatıcı, çölde El-Hadi'yi, yere düşmüş olan Muhammed bin Abbas El-San'ani'nin yanına atından inerken gördü. Yüzünü sildi, üzerine dualar okudu ve onu bir eşeğe bindirerek Sa'de'ye götürdü. İyileşene kadar eliyle nar soydu. Sonra, atından düşüp burnunu yere çarpan bir adamı eliyle tedavi ederken gördü."
  id: "Perawi melihat Al-Hadi di padang pasir turun dari kudanya menghampiri Muhammad bin Abbas Al-San’ani yang telah jatuh ke tanah. Ia mengusap wajahnya, membacakan doa untuknya, dan menaikkannya ke atas keledai menuju Sa’dah. Ia mengupas buah delima untuknya dengan tangannya sampai ia pulih. Kemudian ia melihat Al-Hadi mengobati dengan tangannya seorang pria yang telah jatuh dari kudanya dan hidungnya terbentur tanah."
