id: event/al-hadi-tends-a-fallen-companion-and-a-fallen-rider
class: event
kind: other
label:
  ar: الهادي يعالج صاحباً أصابه مرض وراكباً سقط عن فرسه
  en: Al-Hadi tends a stricken companion and a rider thrown from his horse
  ur: ہادی ایک بیمار ساتھی اور گھوڑے سے گرے سوار کی تیمارداری کرتے ہیں
summary:
  ar: رأى الراوي الهادي في الصحراء ينزل عن فرسه إلى محمد بن عباس الصنعاني وقد سقط على الأرض، فمسح وجهه وقرأ عليه وأركبه حماراً إلى صعدة وقشّر له الرمان بيده حتى أفاق، ثم رآه يداوي بيده رجلاً سقط عن فرسه وأصاب الأرض أنفه.
  en: The narrator saw al-Hadi in the open country dismount to a companion, Muhammad ibn Abbas al-San'ani, who had fallen to the ground; he wiped his face, recited over him, had him taken to Sa'da on a donkey and peeled pomegranates for him by hand until he recovered; he also saw him treat with his own hand a rider whose nose was hurt in a fall.
  ur: راوی نے صحرا میں ہادی کو اپنے ساتھی محمد بن عباس صنعانی کے پاس گھوڑے سے اترتے دیکھا جو زمین پر گرا تھا؛ انہوں نے اس کا چہرہ پونچھا، اس پر پڑھا، گدھے پر صعدہ پہنچایا اور اپنے ہاتھ سے انار چھیل کر دیے یہاں تک کہ وہ ٹھیک ہو گیا؛ ایک سوار کا علاج بھی کیا جس کی ناک گرنے سے زخمی ہوئی تھی۔
