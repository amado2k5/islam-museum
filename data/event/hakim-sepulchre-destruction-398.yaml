id: event/hakim-sepulchre-destruction-398
class: event
kind: persecution
label: { ar: "هدم الحاكم كنيسة القيامة وكنائس مصر" }
summary:
  ar: "في سنة ثمان وتسعين هدم الحاكم بيعة قمامة التي بالقدس وهدم جميع الكنائس التي بمصر وأمر النصارى بأن تعمل في أعناقهم الصلبان طول الصليب ذراع ووزنه خمسة أرطال بالمصري واليهود أن يحملوا في أعناقهم قرامي الخشب في زنة الصلبان وأن يلبسوا العمائم السود فأسلم طائفة منهم ثم بعد ذلك أذن في إعادة البيع والكنائس وأذن لمن أسلم أن يعود إلى دينه لكونه مكرهاً {cite:tarikh-khulafa-minhaj-1434 p. 637-638}. ويذكر ابن الجوزي في سبب الهدم أن البيعة تجاور بيت المقدس وكان يجتمع فيها مال عظيم وأنهم كانوا يعلقون القناديل بدهن الزيتون وبين كل قنديلين خيط من حديد مطلي بدهن البلسان يشعلونه فتنتقل النار فتشعل الكل فيظن الحاضرون أنها نار نزلت من السماء، فلما وصفت هذه الحالة للحاكم أمر والي الرملة وأحمد بن يعقوب الداعي بقصد بيت المقدس واستصحاب الأشراف والقضاة والشهود وإباحة العامة نهبها ونقضها، وكتب بنقض جميع البيع والكنائس وبني مساجد مكانها، وشرط على النصارى تعليق صلبان الخشب زنة أربعة أرطال وعلى اليهود خشبة كالمدقة زنة ستة أرطال وأجراساً عند دخولهم الحمامات {cite:muntazam-ibn-al-jawzi j.7 p.239-240}."
  en: "In 398 al-Hakim destroyed Jerusalem's Church of the Sepulchre and all Egypt's churches, ordering Christians to wear arm-length crosses of five Egyptian ratls and Jews wooden qirami of the same weight, with black turbans; a party of them professed Islam. Afterwards he permitted the rebuilding of the churches and let those compelled return to their faith {cite:tarikh-khulafa-minhaj-1434 p. 637-638}."
