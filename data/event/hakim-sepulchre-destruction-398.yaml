id: event/hakim-sepulchre-destruction-398
class: event
kind: persecution
label: { ar: "هدم الحاكم كنيسة القيامة وكنائس مصر", en: "Al-Hakim Destroys the Church of the Resurrection and Egypt's Churches", es: "Al-Hakim destruye la Iglesia de la Resurrección y las iglesias de Egipto.", fr: "Al-Hakim détruit l'église de la Résurrection et les églises d'Égypte", ur: "الحکیم نے کلیسائے قیامت اور مصر کے گرجا گھروں کو تباہ کر دیا۔", tr: "Vali, Kutsal Kabir Kilisesi'ni ve Mısır kiliselerini yıktırdı.", id: "Gubernur menghancurkan Gereja Makam Suci dan gereja-gereja Mesir." }
summary:
  ar: "في سنة ثمان وتسعين هدم الحاكم بيعة قمامة التي بالقدس وهدم جميع الكنائس التي بمصر وأمر النصارى بأن تعمل في أعناقهم الصلبان طول الصليب ذراع ووزنه خمسة أرطال بالمصري واليهود أن يحملوا في أعناقهم قرامي الخشب في زنة الصلبان وأن يلبسوا العمائم السود فأسلم طائفة منهم ثم بعد ذلك أذن في إعادة البيع والكنائس وأذن لمن أسلم أن يعود إلى دينه لكونه مكرهاً {cite:tarikh-khulafa-minhaj-1434 p. 637-638}. ويذكر ابن الجوزي في سبب الهدم أن البيعة تجاور بيت المقدس وكان يجتمع فيها مال عظيم وأنهم كانوا يعلقون القناديل بدهن الزيتون وبين كل قنديلين خيط من حديد مطلي بدهن البلسان يشعلونه فتنتقل النار فتشعل الكل فيظن الحاضرون أنها نار نزلت من السماء، فلما وصفت هذه الحالة للحاكم أمر والي الرملة وأحمد بن يعقوب الداعي بقصد بيت المقدس واستصحاب الأشراف والقضاة والشهود وإباحة العامة نهبها ونقضها، وكتب بنقض جميع البيع والكنائس وبني مساجد مكانها، وشرط على النصارى تعليق صلبان الخشب زنة أربعة أرطال وعلى اليهود خشبة كالمدقة زنة ستة أرطال وأجراساً عند دخولهم الحمامات {cite:muntazam-ibn-al-jawzi j.7 p.239-240}."
  en: "In 398 al-Hakim destroyed Jerusalem's Church of the Sepulchre and all Egypt's churches, ordering Christians to wear arm-length crosses of five Egyptian ratls and Jews wooden qirami of the same weight, with black turbans; a party of them professed Islam. Afterwards he permitted the rebuilding of the churches and let those compelled return to their faith {cite:tarikh-khulafa-minhaj-1434 p. 637-638}."
  es: "En el año 398, al-Hakim destruyó la Iglesia del Santo Sepulcro de Jerusalén y todas las iglesias de Egipto, ordenando a los cristianos que llevaran cruces de cinco ratls egipcios del mismo peso y a los judíos qiramis de madera del mismo peso, con turbantes negros; un grupo de ellos profesó el Islam. Posteriormente, permitió la reconstrucción de las iglesias y dejó que aquellos obligados volvieran a su fe {cite:tarikh-khulafa-minhaj-1434 p. 637-638}."
  fr: "En 398, al-Hakim détruisit l'église du Saint-Sépulcre à Jérusalem et toutes les églises d'Égypte, ordonnant aux chrétiens de porter des croix de cinq ratls égyptiens et aux juifs des qirami en bois de même poids, ainsi que des turbans noirs; certains se convertirent à l'islam. Par la suite, il autorisa la reconstruction des églises et permit à ceux qui en avaient été contraints de revenir à leur foi."
  ur: "398 میں الحکیم نے یروشلم کے چرچ آف دی سیپلچر اور مصر کے تمام گرجا گھروں کو تباہ کر دیا، عیسائیوں کو حکم دیا کہ وہ پانچ مصری رٹلوں کی بازو کی لمبائی والی صلیبیں پہنیں اور اسی وزن کی لکڑی کے قرامی، کالی پگڑیوں کے ساتھ؛ ان میں سے ایک جماعت نے اسلام کا دعویٰ کیا۔ اس کے بعد اس نے گرجا گھروں کی تعمیر نو کی اجازت دی اور مجبور لوگوں کو اپنے عقیدے کی طرف لوٹنے دیا۔ 637-638}۔"
  tr: "98. yılda hükümdar, Kudüs'teki Kumama Kilisesi'ni ve Mısır'daki tüm kiliseleri yıktırdı. Hristiyanların boyunlarına bir arşın uzunluğunda ve beş Mısır lirası ağırlığında haç takmalarını, Yahudilerin ise aynı ağırlıkta tahta haçlar takmalarını ve siyah sarıklar giymelerini emretti. Bir grup Yahudi İslam'ı kabul etti. Bundan sonra, kiliselerin ve sinagogların yeniden inşasına izin verdi ve İslam'ı kabul edenlerin zorla dinlerine geri dönmelerine izin verdi. {cite:tarikh-khulafa-minhaj-1434 s. 637-638} İbn el-Cevzi, yıkımın sebebini şöyle açıklıyor: Kilise Kudüs'e bitişikti ve orada çok miktarda para toplanıyordu. Zeytinyağlı lambalar asılıyor, her iki lamba arasına da balsam yağıyla kaplanmış demir teller geriliyordu. Bu telleri yakarak çıkan ateşin her yeri tutuşturduğunu ve orada bulunanların bunun gökten inen bir ateş olduğunu sandığını anlatıyor. Bu durum hükümdara anlatılınca, hükümdar Ramla valisine ve Ahmed ibn Yakub el-Da'i'ye Kudüs'e gidip yanlarında soyluları, kadıları ve şahitleri getirmelerini emretti ve halkın kiliseyi yağmalayıp yıkmasına izin verdi. Tüm kiliselerin ve sinagogların yıkılıp yerlerine cami yapılması emrini verdi ve Hristiyanların dört kiloluk tahta haçlar, Yahudilerin ise altı kiloluk tahta bir havan tokmağı asıp hamamlara girdiklerinde çanlar takmalarını şart koştu. {cite:muntazam-ibn-al-jawzi j.7 s.239-240}."
  id: "Pada tahun 98, penguasa menghancurkan Gereja Qumama di Yerusalem dan menghancurkan semua gereja di Mesir. Ia memerintahkan orang Kristen untuk mengenakan salib di leher mereka, dengan panjang salib satu hasta dan berat lima pon Mesir, dan orang Yahudi untuk mengenakan salib kayu di leher mereka, dengan berat yang sama seperti salib, dan mengenakan sorban hitam. Sekelompok dari mereka masuk Islam. Setelah itu, ia mengizinkan pembangunan kembali gereja dan sinagoge dan mengizinkan mereka yang telah masuk Islam untuk kembali ke agama mereka karena mereka dipaksa untuk melakukannya. {cite:tarikh-khulafa-minhaj-1434 p. 637-638}. Ibn al-Jawzi menyebutkan alasan pembongkaran tersebut, yaitu gereja itu berdekatan dengan Yerusalem dan banyak uang terkumpul di sana, dan mereka biasa menggantung lampu dengan minyak zaitun, dan di antara setiap dua lampu terdapat benang besi yang dilapisi minyak balsam, yang mereka nyalakan, sehingga api akan menyebar dan membakar semuanya, dan orang-orang yang hadir akan mengira itu adalah api yang turun dari surga. Ketika situasi ini dijelaskan kepada penguasa, ia memerintahkan gubernur Ramla dan Ahmad ibn Yaqub al-Da’i untuk pergi ke Yerusalem dan membawa serta para bangsawan, hakim, dan saksi, dan ia mengizinkan masyarakat umum untuk menjarah dan menghancurkannya. Ia menulis untuk menghancurkan semua gereja dan sinagoge dan membangun masjid di tempatnya, dan ia menetapkan bahwa orang Kristen harus menggantung salib kayu seberat empat pon, dan orang Yahudi harus menggantung salib kayu seperti alu seberat enam pon dan lonceng ketika mereka memasuki pemandian. {kutip:muntazam-ibn-al-jawzi j.7 hal.239-240}."
