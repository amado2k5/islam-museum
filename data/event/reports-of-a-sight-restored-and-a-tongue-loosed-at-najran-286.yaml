id: event/reports-of-a-sight-restored-and-a-tongue-loosed-at-najran-286
class: event
kind: other
label:
  ar: أخبار رد بصر صبي وإفصاح لسان ابن صغير بنجران، وروايات عن عقوبة الطاعنين، جمادى الآخرة 286هـ
  en: Reports of a boy's sight restored and a child's tongue loosed at Najran, and of what befell two detractors, Jumada II 286 AH
  ur: نجران میں ایک بچے کی بینائی لوٹنے اور ایک کم سن بچے کی زبان کھلنے کی روایات، اور دو طعنہ زنوں پر گزری مصیبت کے بیانات، جمادی الآخرہ 286ھ
  es: "En Najrán se reporta la recuperación de la vista de un niño y la liberación de la lengua de otro, así como el destino de dos detractores. Jumada II, 286 d. C."
  fr: "À Najran, on rapporte la guérison d'un garçon et le déblocage de la langue d'un enfant, ainsi que le sort réservé à deux détracteurs (Jumada II, 286 AH)."
  tr: "Najran'da bir çocuğun görme yetisini, küçük bir oğlunun ise konuşma yeteneğini yeniden kazandığı haberi ve iftiracıların cezalandırılmasına dair anlatımlar, Cemadi el-Ahire 286 Hicri."
  id: "Berita tentang seorang anak laki-laki yang penglihatannya pulih dan seorang anak laki-laki yang bicaranya kembali normal di Najran, dan kisah tentang hukuman bagi para pencerca, Jumada al-Akhirah 286 H."
summary:
  ar: ينقل الراوي علي بن محمد أن الهادي مسح بيده بصر صبي ذهب بصره من الجدري ودعا له فأبصر، وأنه رآه يبصر بعد وصولهم نجران، ويروي عن موسى بن علي بن عبد الجبار الصريمي أن ابنه الصغير الذي لم يتكلم تكلم بعدما سُقي ماءً وُضع فيه خاتم الهادي، ويضيف بلاغات سمعها من ثقة عن رجل ثم امرأة تكلما سوءاً في الهادي فأصابتهما بلية. وفي هامش الأصل «كرامة».
  en: Ali ibn Muhammad relates that al-Hadi passed his hand over the eyes of a boy blinded by smallpox and prayed for him and the boy saw, and that he saw the boy seeing after they reached Najran; he also reports Musa ibn Ali ibn Abd al-Jabbar al-Sarimi's account that his small son, who had not spoken, spoke after being given water in which al-Hadi's seal ring had been set, and adds hearsay from a man he trusts about a man and a woman who spoke ill of al-Hadi and met misfortune. The manuscript margin marks each "a karama".
  ur: علی بن محمد بیان کرتے ہیں کہ ہادی نے چیچک سے نابینا ہو جانے والے ایک بچے کی آنکھوں پر ہاتھ پھیرا اور اس کے لیے دعا کی تو وہ دیکھنے لگا اور انہوں نے نجران پہنچنے کے بعد اسے دیکھتے ہوئے دیکھا؛ وہ موسیٰ بن علی بن عبد الجبار صریمی کا یہ بیان بھی نقل کرتے ہیں کہ ان کا چھوٹا بیٹا جو بولتا نہ تھا اس پانی کے پینے کے بعد بولنے لگا جس میں ہادی کی مہر کی انگوٹھی رکھی گئی تھی، اور ایک قابل اعتماد شخص سے سنی ہوئی وہ باتیں بھی جوڑتے ہیں کہ ایک مرد اور ایک عورت نے ہادی کے بارے میں بری بات کہی اور ان پر آفت آئی۔ اصل نسخے کے حاشیے پر ہر جگہ «کرامت» لکھا ہے۔
  es: "Ali ibn Muhammad relata que al-Hadi pasó su mano sobre los ojos de un niño cegado por la viruela y oró por él, y el niño recuperó la vista. También relata que vio al niño recuperar la vista después de que llegaron a Najrán. Asimismo, informa del relato de Musa ibn Ali ibn Abd al-Jabbar al-Sarimi, según el cual su hijo pequeño, que no había hablado, lo hizo después de que le dieran agua en la que había estado colocado el anillo del sello de al-Hadi. Añade, además, el testimonio de un hombre de su confianza sobre un hombre y una mujer que hablaron mal de al-Hadi y sufrieron desgracias. El margen del manuscrito marca cada uno de estos sucesos como \"un karama\"."
  fr: "Ali ibn Muhammad rapporte qu'al-Hadi passa sa main sur les yeux d'un garçon aveuglé par la variole et pria pour lui, ce qui permit au garçon de recouvrer la vue. Il ajoute qu'al-Hadi le vit voir à son tour après leur arrivée à Najran. Il rapporte également le récit de Musa ibn Ali ibn Abd al-Jabbar al-Sarimi, selon lequel son jeune fils, jusque-là muet, se mit à parler après avoir reçu de l'eau dans laquelle avait été placée la bague scellée d'al-Hadi. Enfin, il relate le témoignage d'un homme de confiance concernant un homme et une femme qui avaient médisé d'al-Hadi et connurent un malheur. La marge du manuscrit indique « a karama » pour chaque événement."
  tr: "Rivayetçi Ali ibn Muhammed, Hadid'in çiçek hastalığından görme yetisini kaybetmiş bir çocuğun gözlerini sildiğini ve onun için dua ettiğini, bunun üzerine çocuğun görme yetisini geri kazandığını anlatır. Ayrıca, Necran'a vardıklarında çocuğun görme yetisini geri kazandığını gördüğünü de aktarır. Musa ibn Ali ibn Abd al-Jabbar al-Sarimi'nin rivayetine dayanarak, henüz konuşamayan küçük oğlunun, Hadid'in yüzüğünün konulduğu suya verildikten sonra konuşmaya başladığını da söyler. Güvenilir bir kaynaktan duyduğu, Hadid hakkında kötü konuşan bir erkek ve ardından bir kadının başına gelen felaketler hakkındaki rivayetleri de ekler. Orijinal metinde kenar notunda \"mucize\" kelimesi geçmektedir."
  id: "Narator Ali ibn Muhammad meriwayatkan bahwa al-Hadi mengusap mata seorang anak laki-laki yang kehilangan penglihatannya akibat cacar dan mendoakannya, dan anak itu pun mendapatkan kembali penglihatannya. Ia juga menceritakan bahwa ia melihat anak itu mendapatkan kembali penglihatannya setelah mereka tiba di Najran. Ia lebih lanjut meriwayatkan, berdasarkan riwayat Musa ibn Ali ibn Abd al-Jabbar al-Sarimi, bahwa putranya yang masih kecil, yang belum bisa berbicara, mulai berbicara setelah diberi air yang telah dicampur dengan cincin al-Hadi. Ia menambahkan laporan yang ia dengar dari sumber yang dapat dipercaya tentang seorang pria dan kemudian seorang wanita yang berbicara buruk tentang al-Hadi, dan kemudian ditimpa musibah. Teks aslinya menyertakan kata \"mukjizat\" dalam catatan pinggir."
