id: event/al-hadi-bayat-al-sabr-and-the-eclipse-prayer-286
class: event
kind: other
label:
  ar: بيعة الصبر وصلاة الهادي لكسوف الشمس بصعدة
  en: The pledge of endurance and al-Hadi's prayer at a solar eclipse at Sa'da
  ur: بیعتِ صبر اور صعدہ میں سورج گرہن پر ہادی کی نماز
summary:
  ar: يروي علي بن محمد عن أبيه أن رجلين أتيا الهادي ليلاً يريدان أن يبايعاه بيعة الصبر وإن كانا بايعاه مع الناس، فوعظهما وبيّن أنه يريد إخواناً مؤمنين يصبرون معه على الجوع والجهد والعري حتى يقتسم كل أربعة ثوباً، فقبلا وأخذ عليهما عهداً زاده فيه الصبر على البأساء والضراء. ثم يروي محمد بن سليمان أنه رأى الهادي يصلي بصعدة لكسوف الشمس بعشر ركعات في أربع سجدات بقراءة سور سماها، وأنه دعا بين السجدتين.
  en: Ali ibn Muhammad tells from his father that two men came to al-Hadi at night wishing to pledge to him the pledge of endurance although they had pledged with the people; he exhorted them and said he wanted believing brothers who would endure with him hunger, hardship and nakedness until every four shared one garment, they accepted, and he took from them the covenant with the addition of endurance in distress, hardship, severity and ease. Then Muhammad ibn Sulayman relates that he saw al-Hadi pray at Sa'da at a solar eclipse, ten bowings with four prostrations, reciting named suras, and that he prayed between the prostrations.
  ur: علی بن محمد اپنے والد سے روایت کرتے ہیں کہ دو آدمی رات کو ہادی کے پاس آئے اور چاہا کہ ان سے بیعتِ صبر کریں حالانکہ وہ لوگوں کے ساتھ بیعت کر چکے تھے؛ ہادی نے نصیحت کی اور فرمایا کہ وہ مومن بھائی چاہتے ہیں جو بھوک، مشقت اور برہنگی پر ان کے ساتھ صبر کریں یہاں تک کہ ہر چار آدمی ایک کپڑا بانٹیں؛ انہوں نے قبول کیا اور ہادی نے ان سے عہد لیا جس میں صبر کا اضافہ کیا۔ پھر محمد بن سلیمان بیان کرتے ہیں کہ انہوں نے ہادی کو صعدہ میں سورج گرہن پر دس رکوع اور چار سجدوں کی نماز پڑھتے دیکھا، چند سورتیں پڑھتے اور سجدوں کے درمیان دعا کرتے۔
