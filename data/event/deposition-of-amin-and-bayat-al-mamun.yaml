label: { ar: "خلع الأمين والبيعة للمأمون", en: "Deposition of al-Amin and the pledge of allegiance to al-Ma'mun" }
summary:
  ar: "في سنة ست وتسعين ومائة خُلع محمد الأمين، وأُخذت البيعة لأخيه عبد الله المأمون ببغداد، وحُبس الأمين في قصر أبي جعفر {cite:tabari-tarikh-abu-al-fadl j.8 p.428}. وفي السنة نفسها ذكر الطبري توجيه الأمين الجيوش لحرب طاهر بن الحسين {cite:tabari-tarikh-abu-al-fadl j.8 p.418}، وعند السيوطي في سنة أربع وتسعين عزل أخاه القاسم عما ولاه الرشيد وأغراه الفضل بن الربيع بخلع المأمون فقطع المأمون البريدية عنه وأسقط اسمه من الطراز والضرب وطلب الأمين الكتاب الذي كتبه الرشيد وجعله بالكعبة فأحضروه ومزقه وبايع بولاية العهد لابنه موسى ولقبه الناطق بالحق وهو طفل رضيع فلما تيقن المأمون خلعه تسمى بإمام المؤمنين وكوتب بذلك، ونصح الأمين خزيمة بن خازم لا تجرئ القواد على الخلع فيخلعوك ولا تحملهم على نكث العهد فينكثوا بيعتك فلم ينتصح {cite:tarikh-khulafa-minhaj-1434 p. 473-474}"
  en: "In the year 196 Muhammad al-Amin was deposed, the pledge of allegiance was taken at Baghdad for his brother Abd Allah al-Ma'mun, and al-Amin was confined in the palace of Abu Ja'far {cite:tabari-tarikh-abu-al-fadl j.8 p.428}. In the same year al-Tabari mentions al-Amin sending armies to fight Tahir ibn al-Husayn {cite:tabari-tarikh-abu-al-fadl j.8 p.418}. In al-Suyuti, in the year ninety-four al-Amin removed his brother al-Qasim from what al-Rashid had given him, and al-Fadl ibn al-Rabi' incited him to depose al-Ma'mun. Al-Ma'mun cut off the postal relays from him, removed his name from the tiraz inscriptions and the coinage, and al-Amin demanded the document al-Rashid had written, which had been placed in the Ka'ba; they brought it, and he tore it up. He gave the succession pledge to his son Musa, titled al-Natiq bi'l-Haqq, though the boy was a suckling infant. When al-Ma'mun became certain he had been deposed, he took the title Commander of the Faithful, and letters were sent to that effect. Khuzayma ibn Khazim advised al-Amin: 'Do not let the commanders dare to depose you, lest they depose you; and do not compel them to break the pledge, lest they break your allegiance'; but he did not heed the advice {cite:tarikh-khulafa-minhaj-1434 p. 473-474}"
