id: event/deposition-of-amin-and-bayat-al-mamun
class: event
kind: other
label: { ar: "خلع الأمين والبيعة للمأمون، وعند السيوطي في سنة أربع وتسعين عزل أخاه القاسم عما ولاه الرشيد وأغراه الفضل بن الربيع بخلع المأمون فقطع المأمون البريدية عنه وأسقط اسمه من الطراز والضرب وطلب الأمين الكتاب الذي كتبه الرشيد وجعله بالكعبة فأحضروه ومزقه وبايع بولاية العهد لابنه موسى ولقبه الناطق بالحق وهو طفل رضيع فلما تيقن المأمون خلعه تسمى بإمام المؤمنين وكوتب بذلك، ونصح الأمين خزيمة بن خازم لا تجرئ القواد على الخلع فيخلعوك ولا تحملهم على نكث العهد فينكثوا بيعتك فلم ينتصح {cite:tarikh-khulafa-minhaj-1434 p. 473-474}" }
summary:
  ar: "في سنة ست وتسعين ومائة خُلع محمد الأمين، وأُخذت البيعة لأخيه عبد الله المأمون ببغداد، وحُبس الأمين في قصر أبي جعفر {cite:tabari-tarikh-abu-al-fadl j.8 p.428}. وفي السنة نفسها ذكر الطبري توجيه الأمين الجيوش لحرب طاهر بن الحسين {cite:tabari-tarikh-abu-al-fadl j.8 p.418}."
