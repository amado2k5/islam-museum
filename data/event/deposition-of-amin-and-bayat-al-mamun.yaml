label: { ar: "خلع الأمين والبيعة للمأمون", en: "Deposition of al-Amin and the pledge of allegiance to al-Ma'mun", es: "Deposición de al-Amin y juramento de lealtad a al-Ma'mun.", fr: "Déposition d'al-Amin et serment d'allégeance à al-Ma'mun", ur: "الامین کی معزولی اور مامون کی بیعت" }
summary:
  ar: "في سنة ست وتسعين ومائة خُلع محمد الأمين، وأُخذت البيعة لأخيه عبد الله المأمون ببغداد، وحُبس الأمين في قصر أبي جعفر {cite:tabari-tarikh-abu-al-fadl j.8 p.428}. وفي السنة نفسها ذكر الطبري توجيه الأمين الجيوش لحرب طاهر بن الحسين {cite:tabari-tarikh-abu-al-fadl j.8 p.418}، وعند السيوطي في سنة أربع وتسعين عزل أخاه القاسم عما ولاه الرشيد وأغراه الفضل بن الربيع بخلع المأمون فقطع المأمون البريدية عنه وأسقط اسمه من الطراز والضرب وطلب الأمين الكتاب الذي كتبه الرشيد وجعله بالكعبة فأحضروه ومزقه وبايع بولاية العهد لابنه موسى ولقبه الناطق بالحق وهو طفل رضيع فلما تيقن المأمون خلعه تسمى بإمام المؤمنين وكوتب بذلك، ونصح الأمين خزيمة بن خازم لا تجرئ القواد على الخلع فيخلعوك ولا تحملهم على نكث العهد فينكثوا بيعتك فلم ينتصح {cite:tarikh-khulafa-minhaj-1434 p. 473-474}"
  en: "In the year 196 Muhammad al-Amin was deposed, the pledge of allegiance was taken at Baghdad for his brother Abd Allah al-Ma'mun, and al-Amin was confined in the palace of Abu Ja'far {cite:tabari-tarikh-abu-al-fadl j.8 p.428}. In the same year al-Tabari mentions al-Amin sending armies to fight Tahir ibn al-Husayn {cite:tabari-tarikh-abu-al-fadl j.8 p.418}. In al-Suyuti, in the year ninety-four al-Amin removed his brother al-Qasim from what al-Rashid had given him, and al-Fadl ibn al-Rabi' incited him to depose al-Ma'mun. Al-Ma'mun cut off the postal relays from him, removed his name from the tiraz inscriptions and the coinage, and al-Amin demanded the document al-Rashid had written, which had been placed in the Ka'ba; they brought it, and he tore it up. He gave the succession pledge to his son Musa, titled al-Natiq bi'l-Haqq, though the boy was a suckling infant. When al-Ma'mun became certain he had been deposed, he took the title Commander of the Faithful, and letters were sent to that effect. Khuzayma ibn Khazim advised al-Amin: 'Do not let the commanders dare to depose you, lest they depose you; and do not compel them to break the pledge, lest they break your allegiance'; but he did not heed the advice {cite:tarikh-khulafa-minhaj-1434 p. 473-474}"
  es: "En el año 196 Muhammad al-Amin fue depuesto, se tomó el juramento de lealtad en Bagdad para su hermano Abd Allah al-Ma'mun, y al-Amin fue confinado en el palacio de Abu Ja'far {cite:tabari-tarikh-abu-al-fadl j.8 p.428}. En el mismo año, al-Tabari menciona que al-Amin envió ejércitos para luchar contra Tahir ibn al-Husayn {cite:tabari-tarikh-abu-al-fadl j.8 p.418}. En al-Suyuti, en el año noventa y cuatro, al-Amin despojó a su hermano al-Qasim de lo que al-Rashid le había dado, y al-Fadl ibn al-Rabi' lo incitó a deponer a al-Ma'mun. Al-Ma'mun le cortó el servicio postal, eliminó su nombre de las inscripciones del tiraz y de las monedas, y al-Amin exigió el documento que al-Rashid había escrito y que se encontraba en la Kaaba; se lo trajeron y él lo rompió. Le otorgó la promesa de sucesión a su hijo Musa, titulado al-Natiq bi'l-Haqq, aunque el niño era un lactante. Cuando al-Ma'mun se convenció de que había sido depuesto, asumió el título de Comandante de los Creyentes, y se enviaron cartas al respecto. Khuzayma ibn Khazim aconsejó a al-Amin: «No permitas que los comandantes se atrevan a deponerte, no sea que lo hagan; y no los obligues a romper la promesa, no sea que rompan tu lealtad»; pero él no hizo caso del consejo. {cite:tarikh-khulafa-minhaj-1434 p. 473-474}"
  fr: "En 196, Muhammad al-Amin fut déposé. Le serment d'allégeance fut prêté à Bagdad pour son frère Abd Allah al-Ma'mun, et al-Amin fut emprisonné au palais d'Abu Ja'far (cf. Tabari-tarikh-abu-al-fadl j.8 p.428). La même année, al-Tabari mentionne qu'al-Amin envoya des armées combattre Tahir ibn al-Husayn (cf. Tabari-tarikh-abu-al-fadl j.8 p.418). Selon al-Suyuti, en 94, al-Amin s'appropria le domaine que lui avait légué al-Rashid, et al-Fadl ibn al-Rabi' l'incita à déposer al-Ma'mun. Al-Ma'mun coupa les relais postaux qui le séparaient, fit retirer son nom des inscriptions du tiraz et des pièces de monnaie, et al-Amin exigea le document rédigé par al-Rashid, qui avait été placé dans la Kaaba; on le lui apporta, et il le déchira. Il confia le serment de succession à son fils Musa, titré al-Natiq bi'l-Haqq, alors que l'enfant était encore un nourrisson. Lorsqu'al-Ma'mun eut la certitude d'avoir été déposé, il prit le titre de Commandeur des Croyants, et des lettres furent envoyées à cet effet. Khuzayma ibn Khazim conseilla à al-Amin: « Ne permets pas aux commandants d'oser te déposer, de peur qu'ils ne le fassent; et ne les force pas à rompre le serment, de peur qu'ils ne rompent ton allégeance »; mais il n'écouta pas ce conseil."
  ur: "سنہ 196 میں محمد الامین معزول ہوئے، بغداد میں اپنے بھائی عبد اللہ المامون کی بیعت کی گئی اور الامین کو ابو جعفر کے محل میں نظر بند کر دیا گیا۔ اسی سال الطبری نے طاہر ابن الحسین سے لڑنے کے لیے الامین کے لشکر بھیجنے کا ذکر کیا ہے {حوالہ: طبری-تاریخ-ابو الفضل ج8 ص 418}۔ السیوطی میں ہے کہ سن 94 میں الامین نے اپنے بھائی القاسم کو اس سے ہٹا دیا جو الرشید نے اسے دیا تھا اور الفضل بن الربیع نے اسے مامون کو معزول کرنے پر اکسایا۔ المامون نے اس سے ڈاک کے ریلے کاٹ دیے، تیراز کے نوشتہ جات اور سکے سے اس کا نام ہٹا دیا، اور الامین نے الرشید کی لکھی ہوئی دستاویز کا مطالبہ کیا، جو کعبہ میں رکھی گئی تھی۔ وہ اسے لائے اور اس نے اسے پھاڑ دیا۔ اس نے جانشینی کا عہد اپنے بیٹے موسیٰ کو دیا، جس کا لقب النطیق بلالحق تھا، حالانکہ لڑکا دودھ پلانے والا بچہ تھا۔ جب المامون کو یقین ہو گیا کہ وہ معزول ہو چکا ہے تو اس نے وفاداروں کا کمانڈر کا لقب اختیار کر لیا اور اس سلسلے میں خطوط بھیجے گئے۔ خزیمہ بن خزیم نے امین کو نصیحت کی: 'کمانڈر آپ کو معزول کرنے کی جرأت نہ کریں، ورنہ وہ آپ کو معزول کر دیں گے۔ اور انہیں عہد توڑنے پر مجبور نہ کرو، ورنہ وہ تمہاری بیعت توڑ دیں گے'۔ لیکن اس نے اس نصیحت پر دھیان نہیں دیا۔ 473-474}"
