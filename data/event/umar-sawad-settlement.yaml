label: { ar: "إقرار عمر السواد في أيدي أهله", en: "Umar's Endowment of the Sawad upon Its People" }
summary:
  ar: "عند البلاذري: كتب عمر بن الخطاب إلى سعد بن أبي وقاص حين فتح السواد أما بعد فقد بلغني كتابك تذكر أن الناس سألوك أن تقسم بينهم ما أفاء الله عليهم فإذا أتاك كتابي فانظر ما أجلب عليه أهل العسكر بخيلهم وركابهم من مال أو كراع فأقسمه بينهم بعد الخمس واترك الأرض والأنهار لعمالها ليكون ذلك في أعطيات المسلمين فإنك إن قسمتها بين من حضر لم يكن لمن يبقى بعدهم شيء وسأل عبد الله بن حازم مجاهداً عن أرض السواد فقال لا تشترى ولا تباع لأنها فتحت عنوة ولم تقسم فهي لجميع المسلمين وقال سليمان بن يسار أقر عمر السواد لمن في أصلاب الرجال وأرحام النساء وجعلهم ذمة تؤخذ منهم الجزية ومن أرضهم الخراج وهم ذمة لا رق عليهم وكان الوليد بن عبد الملك أراد أن يجعل أهل السواد فيءً فأخبرته بما كان من عمر في ذلك فرده الله عنهم وأراد عمر قسمة السواد بين المسلمين فأمر أن يحصوا فوجد الرجل منهم نصيبه ثلاثة من الفلاحين فشاور أصحاب رسول الله في ذلك فقال علي دعهم يكونوا مادة للمسلمين فبعث عثمان بن حنيف الأنصاري وعن مالك عن جعفر بن محمد عن أبيه كان للمهاجرين مجلس في المسجد فكان عمر يجلس معهم فيه ويحدثهم عما ينتهي إليه من أمر الآفاق فقال يوماً ما أدري كيف أصنع بالمجوس فوثب عبد الرحمن بن عوف فقال أشهد على رسول الله أنه قال سنوا بهم سنة أهل الكتاب وعن عامر ليس لأهل السواد عهد وإنما نزلوا على الحكم وعن الشعبي لم يكن لديهم عهد فلما رضي منهم بالخراج صار لهم عهد وعن إبراهيم التيمي لما افتتح عمر السواد قالوا له اقسمه بيننا فإنا فتحناه عنوة بسيوفنا فأبى وقال فما لمن جاء بعدكم من المسلمين وأخاف إن قسمته أن تتفاسدوا بينكم في المياه وعن علي لولا أن يضرب بعضكم وجوه بعض لقسمت السواد بينكم وأسلم جميل بن بصبهري دهقان الفلاليج والنهرين وبسطام بن ترسي دهقان بابل وخطرنية والرفيل دهقان العال وفيروز دهقان نهر الملك وكوثى وغيرهم من الدهاقين فلم يعرض لهم عمر ولم يخرج الأرض من أيديهم وأزال الجزية عن رقابهم."
  en: "In al-Baladhuri: Umar wrote to Sa'd ibn Abi Waqqas when he conquered the Sawad: 'as for what follows — your letter reached me saying the people asked you to divide what God granted them; when my letter reaches you, look at what the army's men brought on their horses and mounts of money or chattel and divide it among them after the fifth, and leave the land and rivers to their workers so it may be in the Muslims' stipends — for if you divide it among those present nothing will remain for those after them.' Abdallah ibn Hazim asked Mujahid about the Sawad's land: 'it is neither bought nor sold — it was conquered by force and left undivided, so it belongs to all Muslims.' Sulayman ibn Yasar said Umar confirmed the Sawad for those in men's loins and women's wombs, made its people dhimma — jizya taken from them and kharaj from their land, dhimma with no enslavement — and al-Walid ibn Abd al-Malik had wanted to make the Sawad's people fay' until told of Umar's precedent, so God turned him from it. Umar had wanted to divide the Sawad among the Muslims and ordered them counted — each man's share came to three peasants — so he consulted the Prophet's companions and Ali said 'leave them, a substance for the Muslims'; he then sent Uthman ibn Hunayf al-Ansari. Jamil ibn Busbuhri, dihqan of the two Fallujas and al-Nahrayn, converted, with Bistam ibn Tarsi dihqan of Babil and Khutarniyya, al-Rufayl dihqan of al-Al, Fayruz dihqan of Nahr al-Malik and Kutha, and other dihqans — Umar did not interfere with them, did not take the land from their hands, and lifted the jizya from their necks."
