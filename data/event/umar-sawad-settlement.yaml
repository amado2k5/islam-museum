id: event/umar-sawad-settlement
class: event
kind: other
label: { ar: "إقرار عمر السواد في أيدي أهله", en: "Umar's Endowment of the Sawad upon Its People", es: "La donación del Sawad por parte de Umar a su pueblo", fr: "Le don du Sawad par Umar à son peuple", ur: "عمر کا اہلِ سواد پر عطیہ" }
summary:
  ar: "عند البلاذري: كتب عمر بن الخطاب إلى سعد بن أبي وقاص حين فتح السواد أما بعد فقد بلغني كتابك تذكر أن الناس سألوك أن تقسم بينهم ما أفاء الله عليهم فإذا أتاك كتابي فانظر ما أجلب عليه أهل العسكر بخيلهم وركابهم من مال أو كراع فأقسمه بينهم بعد الخمس واترك الأرض والأنهار لعمالها ليكون ذلك في أعطيات المسلمين فإنك إن قسمتها بين من حضر لم يكن لمن يبقى بعدهم شيء وسأل عبد الله بن حازم مجاهداً عن أرض السواد فقال لا تشترى ولا تباع لأنها فتحت عنوة ولم تقسم فهي لجميع المسلمين وقال سليمان بن يسار أقر عمر السواد لمن في أصلاب الرجال وأرحام النساء وجعلهم ذمة تؤخذ منهم الجزية ومن أرضهم الخراج وهم ذمة لا رق عليهم وكان الوليد بن عبد الملك أراد أن يجعل أهل السواد فيءً فأخبرته بما كان من عمر في ذلك فرده الله عنهم وأراد عمر قسمة السواد بين المسلمين فأمر أن يحصوا فوجد الرجل منهم نصيبه ثلاثة من الفلاحين فشاور أصحاب رسول الله في ذلك فقال علي دعهم يكونوا مادة للمسلمين فبعث عثمان بن حنيف الأنصاري وعن مالك عن جعفر بن محمد عن أبيه كان للمهاجرين مجلس في المسجد فكان عمر يجلس معهم فيه ويحدثهم عما ينتهي إليه من أمر الآفاق فقال يوماً ما أدري كيف أصنع بالمجوس فوثب عبد الرحمن بن عوف فقال أشهد على رسول الله أنه قال سنوا بهم سنة أهل الكتاب وعن عامر ليس لأهل السواد عهد وإنما نزلوا على الحكم وعن الشعبي لم يكن لديهم عهد فلما رضي منهم بالخراج صار لهم عهد وعن إبراهيم التيمي لما افتتح عمر السواد قالوا له اقسمه بيننا فإنا فتحناه عنوة بسيوفنا فأبى وقال فما لمن جاء بعدكم من المسلمين وأخاف إن قسمته أن تتفاسدوا بينكم في المياه وعن علي لولا أن يضرب بعضكم وجوه بعض لقسمت السواد بينكم وأسلم جميل بن بصبهري دهقان الفلاليج والنهرين وبسطام بن ترسي دهقان بابل وخطرنية والرفيل دهقان العال وفيروز دهقان نهر الملك وكوثى وغيرهم من الدهاقين فلم يعرض لهم عمر ولم يخرج الأرض من أيديهم وأزال الجزية عن رقابهم."
  en: "In al-Baladhuri: Umar wrote to Sa'd ibn Abi Waqqas when he conquered the Sawad: 'as for what follows — your letter reached me saying the people asked you to divide what God granted them; when my letter reaches you, look at what the army's men brought on their horses and mounts of money or chattel and divide it among them after the fifth, and leave the land and rivers to their workers so it may be in the Muslims' stipends — for if you divide it among those present nothing will remain for those after them.' Abdallah ibn Hazim asked Mujahid about the Sawad's land: 'it is neither bought nor sold — it was conquered by force and left undivided, so it belongs to all Muslims.' Sulayman ibn Yasar said Umar confirmed the Sawad for those in men's loins and women's wombs, made its people dhimma — jizya taken from them and kharaj from their land, dhimma with no enslavement — and al-Walid ibn Abd al-Malik had wanted to make the Sawad's people fay' until told of Umar's precedent, so God turned him from it. Umar had wanted to divide the Sawad among the Muslims and ordered them counted — each man's share came to three peasants — so he consulted the Prophet's companions and Ali said 'leave them, a substance for the Muslims'; he then sent Uthman ibn Hunayf al-Ansari. Jamil ibn Busbuhri, dihqan of the two Fallujas and al-Nahrayn, converted, with Bistam ibn Tarsi dihqan of Babil and Khutarniyya, al-Rufayl dihqan of al-Al, Fayruz dihqan of Nahr al-Malik and Kutha, and other dihqans — Umar did not interfere with them, did not take the land from their hands, and lifted the jizya from their necks."
  es: "En al-Baladhuri: Umar escribió a Sa'd ibn Abi Waqqas cuando conquistó Sawad: «En cuanto a lo que sigue, me llegó tu carta diciendo que el pueblo te pidió que dividieras lo que Dios les había concedido; cuando te llegue mi carta, fíjate en lo que los hombres del ejército trajeron en sus caballos y en las cantidades de dinero o bienes muebles, y divídelo entre ellos después del quinto día, y deja la tierra y los ríos a sus trabajadores para que formen parte de las asignaciones de los musulmanes; porque si lo divides entre los presentes, no quedará nada para los que vengan después». Abdallah ibn Hazim preguntó a Mujahid acerca de la tierra de Sawad: «No se compró ni se vendió; fue conquistada por la fuerza y quedó indivisa, por lo que pertenece a todos los musulmanes». Sulayman ibn Yasar dijo que Umar confirmó el Sawad para los hombres y las mujeres, y convirtió a sus seguidores en dhimma (yizya cobrada sobre ellos y kharaj sobre sus tierras, dhimma sin esclavitud). Al-Walid ibn Abd al-Malik había querido convertir a los seguidores del Sawad en fay' hasta que se le informó del precedente de Umar, por lo que Dios lo apartó de ello. Umar había querido dividir el Sawad entre los musulmanes y ordenó que se contara (la parte de cada hombre equivalía a tres campesinos), así que consultó con los compañeros del Profeta y Ali dijo: «Déjalos, es una sustancia para los musulmanes». Luego envió a Uthman ibn Hunayf al-Ansari. Jamil ibn Busbuhri, dihqan de los dos Faluyas y al-Nahrayn, se convirtió, junto con Bistam ibn Tarsi, dihqan de Babil y Khutarniyya, al-Rufayl, dihqan de al-Al, Fayruz, dihqan de Nahr al-Malik y Kutha, y otros dihqans; Umar no interfirió con ellos, no les quitó la tierra de las manos y les quitó la yizia del cuello."
  fr: "Dans al-Baladhuri: Umar écrivit à Sa'd ibn Abi Waqqas après la conquête du Sawad: « Quant à la suite, ta lettre m'est parvenue, indiquant que le peuple te demandait de partager ce que Dieu leur avait accordé. Lorsque ma lettre te parviendra, examine ce que les soldats ont apporté sur leurs chevaux et montures, argent ou biens, et répartis-le entre eux après le cinquième. Laisse la terre et les rivières à leurs ouvriers afin qu'elles fassent partie de la rente des musulmans, car si tu les partages entre ceux qui sont présents, il ne restera rien pour les générations futures. » Abdallah ibn Hazim interrogea Mujahid au sujet des terres du Sawad: « Elles ne sont ni achetées ni vendues; elles ont été conquises par la force et laissées indivises, elles appartiennent donc à tous les musulmans. » Sulayman ibn Yasar rapporta qu'Umar avait confirmé le Sawad pour les hommes et les femmes à naître, et avait établi la dhimma (l'impôt sur la jizya et le kharaj sur leurs terres, la dhimma sans esclavage). Al-Walid ibn Abd al-Malik avait voulu rendre les habitants du Sawad fay' (l'expropriation) avant d'être informé du précédent d'Umar, ce qui l'en dissuada. Umar souhaitait partager le Sawad entre les musulmans et ordonna un recensement: la part de chaque homme équivalait à trois paysans. Il consulta alors les compagnons du Prophète, et Ali dit: « Laisse-les, c'est une ressource pour les musulmans. » Umar envoya ensuite Uthman ibn Hunayf al-Ansari. Jamil ibn Busbuhri, dihqan des deux Fallujas et d'al-Nahrayn, converti, avec Bistam ibn Tarsi dihqan de Babil et Khutarniyya, al-Rufayl dihqan d'al-Al, Fayruz dihqan de Nahr al-Malik et Kutha, et d'autres dihqans — Umar n'intervint pas avec eux, ne leur prit pas la terre et leva la jizya de leur cou."
  ur: "بلادوری میں ہے: عمر نے سعد بن ابی وقاص کو جب انہوں نے سواد کو فتح کیا تو ان کو لکھا: 'اس کے بعد کیا ہے - آپ کا خط مجھ تک پہنچا جس میں کہا گیا تھا کہ لوگوں نے آپ سے کہا تھا کہ خدا نے جو کچھ انہیں دیا ہے اسے تقسیم کریں۔ جب میرا خط آپ تک پہنچے تو دیکھو کہ فوج کے جوان اپنے گھوڑوں پر کیا لاتے ہیں اور پیسے یا چپلیں اور پانچویں کے بعد ان میں تقسیم کر دیں، اور زمین اور نہریں اپنے کارکنوں کے لیے چھوڑ دیں تاکہ یہ مسلمانوں کے وظیفوں میں ہو، کیونکہ اگر آپ اسے موجود لوگوں میں تقسیم کر دیں تو ان کے بعد والوں کے لیے کچھ نہیں رہے گا۔ عبداللہ بن حازم نے مجاہد سے سواد کی زمین کے بارے میں پوچھا: 'یہ نہ خریدی جاتی ہے اور نہ بیچی جاتی ہے، اسے طاقت کے ذریعے فتح کیا گیا تھا اور اسے غیر منقسم چھوڑ دیا گیا تھا، اس لیے یہ تمام مسلمانوں کی ملکیت ہے۔' سلیمان بن یسار کہتے ہیں کہ عمر نے مردوں کی کمر اور عورتوں کے پیٹ میں رہنے والوں کے لیے سواد کی تصدیق کی، اس کے لوگوں کو ذم بنایا، ان سے جزیہ لیا گیا اور ان کی زمین سے خرج، بغیر غلامی کے ذم، اور ولید بن عبد الملک نے سواد کو لوگوں کے بارے میں بتانا چاہا، جب تک کہ اللہ نے عمر سے یہ بات نہ فرما دی۔ عمر نے سواد کو مسلمانوں میں تقسیم کرنا چاہا اور ان کی گنتی کا حکم دیا - ہر آدمی کا حصہ تین کسانوں کے پاس آیا - اس لیے انھوں نے رسول اللہ کے ساتھیوں سے مشورہ کیا اور علی نے کہا کہ 'انہیں چھوڑ دو، مسلمانوں کے لیے ایک مال'۔ اس کے بعد اس نے عثمان بن حنیف الانصاری کو بھیجا۔ جمیل بن بسبوہری، دو فلوجہ اور النہرین کے دہقان، بابل اور خترنیہ کے بسطام بن تارسی دہقان، الرفیل دہقان الال، فیروز دہقان نہر الملک اور کوتہ کے ساتھ مذہب تبدیل کیا، اور دیگر دہقان نے ان کے ساتھ زمین نہیں لی، اور عمر کے لوگوں نے ان سے زمین نہیں لی۔ ہاتھ اٹھائے اور ان کی گردنوں سے جزیہ اٹھا لیا۔"
