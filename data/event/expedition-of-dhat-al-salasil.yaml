id: event/expedition-of-dhat-al-salasil
class: event
kind: campaign
label: { en: "The Expedition of Dhat al-Salasil", ar: "سرية ذات السلاسل" }
summary:
  en: "In Jumada II 8 AH (October 629 CE), following the Battle of Mu'tah, the Prophet dispatched Amr ibn al-As with 300 men (later reinforced by 200 led by Abu Ubayda) to Dhat al-Salasil on the borders of Syria to win over and neutralize the Quda'a and Bali tribes; Amr demonstrated tactical prudence, routed the gatherings, and established Muslim authority in the northern deserts."
  ar: "في جمادى الآخرة سنة 8هـ إثر معركة مؤتة، بعث النبي عمرو بن العاص في ثلاثمائة مقاتل ثم أمده بمائتين عليهم أبو عبيدة إلى ذات السلاسل بأرض بلي وعذرة على حدود الشام؛ ففرق جموع قضاعة بحكمة عسكرية ومنع إيقاد النار واللحاق بالعدو، فرجع ظافراً وثبت هيبة المسلمين في أطراف الشام."
