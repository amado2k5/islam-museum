label: { ar: "هلاك جلال الدين خوارزم شاه وخراب الجزيرة سنة 628هـ" }
summary:
  ar: "في سنة ثمان وعشرين وست مئة لما علمت التتار بضعف جلال الدين خوارزم شاه بادروا إلى أذربيجان فلم يقدم على لقائهم فملكوا مراغة وعاثوا وأبدعوا وتفرق جنده فبيتته التتار ليلة فنجا بنفسه وطمع الأكراد والفلاحون ودل أحد في جنده وتخطفوهم وانتقم الله منهم وساقت التتار إلى ماردين يسبون ويقتلون ودخلوا إلى آمد فقتلوا نيفاً وعشرين ألفاً وأخذوا من البنات ما أرادوا ووصلوا إلى أذربيجان ففعلوا كذلك واستقر ملكهم بما وراء النهر وبقيت مدن خراسان خراباً لا يجسر أحد يسكنها {cite:shadharat-dhahab p. 126-127}."
  en: "In 628 the Tatars, learning of Jalal al-Din's weakness, rushed Azerbaijan; he would not face them, Maragha fell, his army scattered, and they surprised him by night — he escaped alone, and the Kurds and peasants plundered his followers; God took vengeance on them all. The Tatars then bore to Mardin slaying and enslaving, entered Amid killing over twenty thousand, repeated it in Azerbaijan, and settled their rule beyond the Oxus while Khurasan's cities lay desolate {cite:shadharat-dhahab p. 126-127}."
