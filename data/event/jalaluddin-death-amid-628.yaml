label: { ar: "هلاك جلال الدين خوارزم شاه وخراب الجزيرة سنة 628هـ", en: "Ruin of Jalal al-Din Khwarazm-Shah and devastation of al-Jazira, 628 AH", es: "Ruina de Jalal al-Din Khwarazm-Shah y devastación de al-Jazira, 628 AH", fr: "Ruine de Jalal al-Din Khwarezm-Shah et dévastation d'al-Jazira, 628 AH" }
summary:
  ar: "في سنة ثمان وعشرين وست مئة لما علمت التتار بضعف جلال الدين خوارزم شاه بادروا إلى أذربيجان فلم يقدم على لقائهم فملكوا مراغة وعاثوا وأبدعوا وتفرق جنده فبيتته التتار ليلة فنجا بنفسه وطمع الأكراد والفلاحون ودل أحد في جنده وتخطفوهم وانتقم الله منهم وساقت التتار إلى ماردين يسبون ويقتلون ودخلوا إلى آمد فقتلوا نيفاً وعشرين ألفاً وأخذوا من البنات ما أرادوا ووصلوا إلى أذربيجان ففعلوا كذلك واستقر ملكهم بما وراء النهر وبقيت مدن خراسان خراباً لا يجسر أحد يسكنها {cite:shadharat-dhahab p. 126-127}."
  en: "In 628 the Tatars, learning of Jalal al-Din's weakness, rushed Azerbaijan; he would not face them, Maragha fell, his army scattered, and they surprised him by night — he escaped alone, and the Kurds and peasants plundered his followers; God took vengeance on them all. The Tatars then bore to Mardin slaying and enslaving, entered Amid killing over twenty thousand, repeated it in Azerbaijan, and settled their rule beyond the Oxus while Khurasan's cities lay desolate {cite:shadharat-dhahab p. 126-127}."
  es: "En 628, los tártaros, al enterarse de la debilidad de Jalal al-Din, atacaron Azerbaiyán; él no les hizo frente, Maragha cayó, su ejército se dispersó y lo sorprendieron por la noche. Escapó solo, y los kurdos y campesinos saquearon a sus seguidores; Dios se vengó de todos ellos. Los tártaros llevaron entonces a Mardin la matanza y la esclavitud, entraron en Amid matando a más de veinte mil personas, repitieron la hazaña en Azerbaiyán y establecieron su dominio más allá del Oxus, mientras las ciudades de Jorasán yacían desoladas {cita: shadharat-dhahab págs. 126-127}."
  fr: "En 628, les Tatars, apprenant la faiblesse de Jalal al-Din, se ruèrent sur l'Azerbaïdjan. Refusant de les affronter, Maragha tomba, son armée se dispersa, et ils le surprirent de nuit. Il s'échappa seul, et les Kurdes et les paysans pillèrent ses partisans; Dieu les punit tous. Les Tatars se portèrent ensuite sur Mardin, semant la mort et l'esclavage, entrèrent dans Amid où ils massacrèrent plus de vingt mille hommes, répétèrent leurs exactions en Azerbaïdjan et établirent leur domination au-delà de l'Oxus, tandis que les villes du Khorasan étaient dévastées (cf. shadharat-dhahab, p. 126-127)."
