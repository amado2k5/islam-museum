label: { ar: "هلاك جلال الدين خوارزم شاه وخراب الجزيرة سنة 628هـ", en: "Ruin of Jalal al-Din Khwarazm-Shah and devastation of al-Jazira, 628 AH", es: "Ruina de Jalal al-Din Khwarazm-Shah y devastación de al-Jazira, 628 AH", fr: "Ruine de Jalal al-Din Khwarezm-Shah et dévastation d'al-Jazira, 628 AH", ur: "جلال الدین خوارزم شاہ کی تباہی اور الجزیرہ کی تباہی، 628ھ", tr: "Celaleddin Harezm Şah'ın ölümü ve adanın 628 Hicri yılında yıkılması.", id: "Kematian Jalal al-Din Khwarazm Shah dan kehancuran pulau tersebut pada tahun 628 Hijriah" }
summary:
  ar: "في سنة ثمان وعشرين وست مئة لما علمت التتار بضعف جلال الدين خوارزم شاه بادروا إلى أذربيجان فلم يقدم على لقائهم فملكوا مراغة وعاثوا وأبدعوا وتفرق جنده فبيتته التتار ليلة فنجا بنفسه وطمع الأكراد والفلاحون ودل أحد في جنده وتخطفوهم وانتقم الله منهم وساقت التتار إلى ماردين يسبون ويقتلون ودخلوا إلى آمد فقتلوا نيفاً وعشرين ألفاً وأخذوا من البنات ما أرادوا ووصلوا إلى أذربيجان ففعلوا كذلك واستقر ملكهم بما وراء النهر وبقيت مدن خراسان خراباً لا يجسر أحد يسكنها {cite:shadharat-dhahab p. 126-127}."
  en: "In 628 the Tatars, learning of Jalal al-Din's weakness, rushed Azerbaijan; he would not face them, Maragha fell, his army scattered, and they surprised him by night — he escaped alone, and the Kurds and peasants plundered his followers; God took vengeance on them all. The Tatars then bore to Mardin slaying and enslaving, entered Amid killing over twenty thousand, repeated it in Azerbaijan, and settled their rule beyond the Oxus while Khurasan's cities lay desolate {cite:shadharat-dhahab p. 126-127}."
  es: "En 628, los tártaros, al enterarse de la debilidad de Jalal al-Din, atacaron Azerbaiyán; él no les hizo frente, Maragha cayó, su ejército se dispersó y lo sorprendieron por la noche. Escapó solo, y los kurdos y campesinos saquearon a sus seguidores; Dios se vengó de todos ellos. Los tártaros llevaron entonces a Mardin la matanza y la esclavitud, entraron en Amid matando a más de veinte mil personas, repitieron la hazaña en Azerbaiyán y establecieron su dominio más allá del Oxus, mientras las ciudades de Jorasán yacían desoladas {cita: shadharat-dhahab págs. 126-127}."
  fr: "En 628, les Tatars, apprenant la faiblesse de Jalal al-Din, se ruèrent sur l'Azerbaïdjan. Refusant de les affronter, Maragha tomba, son armée se dispersa, et ils le surprirent de nuit. Il s'échappa seul, et les Kurdes et les paysans pillèrent ses partisans; Dieu les punit tous. Les Tatars se portèrent ensuite sur Mardin, semant la mort et l'esclavage, entrèrent dans Amid où ils massacrèrent plus de vingt mille hommes, répétèrent leurs exactions en Azerbaïdjan et établirent leur domination au-delà de l'Oxus, tandis que les villes du Khorasan étaient dévastées (cf. shadharat-dhahab, p. 126-127)."
  ur: "628 میں تاتاریوں نے جلال الدین کی کمزوری کو جان کر آذربائیجان کی طرف بھاگا۔ اس نے ان کا سامنا نہیں کیا، مراغہ گر گیا، اس کی فوج بکھر گئی، اور انہوں نے اسے رات کو حیران کر دیا - وہ اکیلا ہی فرار ہو گیا، اور کردوں اور کسانوں نے اس کے پیروکاروں کو لوٹ لیا۔ خدا نے ان سب سے انتقام لیا۔ اس کے بعد تاتاریوں نے ماردین کو قتل اور غلام بنا لیا، بیس ہزار سے زیادہ قتل کرنے کے درمیان داخل ہوئے، اسے آذربائیجان میں دہرایا، اور آکسس سے آگے اپنی حکومت قائم کی جبکہ خراسان کے شہر ویران پڑے تھے۔ 126-127}۔"
  tr: "Hicri 628 yılında Tatarlar, Celaleddin Harezm Şah'ın zayıflığını öğrenince Azerbaycan'a akın ettiler. Şah onlarla karşılaşmaya cesaret edemeyince, Tatarlar Maragheh'i ele geçirip büyük bir yıkım ve tahribat yarattılar. Ordusu dağılmış haldeyken, Tatarlar bir gece Şah'a pusu kurdular, ancak Şah canını kurtardı. Kürtler ve köylüler açgözlülükle dolup taştılar ve birileri Şah'ın ordusuna ihanet ederek onları kaçırdı. Allah onlardan intikam aldı ve Tatarlar Mardin'e doğru ilerleyerek esirler alıp öldürdüler. Amid'e girip yirmi binden fazla insanı öldürdüler ve istedikleri kadar kız kaçırdılar. Azerbaycan'a ulaştılar ve aynı şeyi yaptılar, nehrin ötesinde krallıklarını kurdular. Horasan şehirleri harabe halinde kaldı ve kimse oralarda yaşamaya cesaret edemedi. {kaynak: Şadharat-dhahab s. 126-127}"
  id: "Pada tahun 628 Hijriah, ketika bangsa Tatar mengetahui kelemahan Jalal al-Din Khwarazm Shah, mereka bergegas ke Azerbaijan. Ia tidak berani menghadapi mereka, sehingga mereka menguasai Maragheh dan menimbulkan kekacauan dan kehancuran. Pasukannya tercerai-berai, sehingga bangsa Tatar menyergapnya pada suatu malam, tetapi ia berhasil lolos dengan selamat. Bangsa Kurdi dan para petani menjadi serakah, dan seseorang mengkhianati pasukannya dan menculik mereka. Allah membalas dendam kepada mereka, dan bangsa Tatar menuju Mardin, mengambil tawanan dan membunuh. Mereka memasuki Amid dan membunuh lebih dari dua puluh ribu orang dan mengambil gadis sebanyak yang mereka inginkan. Mereka mencapai Azerbaijan dan melakukan hal yang sama, dan kerajaan mereka didirikan di seberang sungai. Kota-kota Khorasan tetap dalam reruntuhan, dan tidak ada yang berani tinggal di sana. {cite:shadharat-dhahab hlm. 126-127}"
