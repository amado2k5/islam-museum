label: { ar: "تجديد ميزاب الرحمة بالكعبة 960هـ", en: "Renewal of the Mizab al-Rahma of the Ka'ba, 960", es: "Renovación del Mizab al-Rahma de la Kaaba, 960", fr: "Renouvellement du Mizab al-Rahma de la Kaaba, 960", ur: "کعبہ کے میزاب الرحمہ کی تجدید، 960", tr: "Hicri 960 yılında Kabe'deki Rahmet Oluklarının yenilenmesi.", id: "Renovasi Talang Rahmat di Ka'bah pada tahun 960 Hijriah" }
summary:
  ar: "في سنة ستين وتسعمائة وقعت عمارة ميزاب الرحمة من البيت الحرام، وقال في ذلك أبو بكر اليقيم المكي مؤرخاً: «يا أيها المولى الجليل ومن له المسجد — ألا قبل القائم المريجا — ميزاب بيت الله جدد فاقتبسنا — رحمة من ربك التاريخا» {cite:shadharat-dhahab p. 325}."
  en: "In 960 the Mizab al-Rahma of the Ka'ba was renewed; Abu Bakr al-Yaqim al-Makki coined its chronogram: 'The spout of God's house renewed — we took «rahma» as the date from your Lord' {cite:shadharat-dhahab p. 325}."
  es: "En 960 se renovó el Mizab al-Rahma de la Kaaba; Abu Bakr al-Yaqim al-Makki acuñó su cronograma: «El caño de la casa de Dios se renovó; tomamos “rahma” como la fecha de tu Señor» {cita: shadharat-dhahab p. 325}."
  fr: "En 960, le Mizab al-Rahma de la Ka'ba fut renouvelé; Abu Bakr al-Yaqim al-Makki a forgé son chronogramme: « Le bec de la maison de Dieu renouvelé — nous avons pris « rahma » comme date de votre Seigneur » {cite: shadharat-dhahab p. 325}."
  ur: "960 میں کعبہ کے میزاب الرحمہ کی تجدید کی گئی۔ ابوبکر یعقم المکی نے اس کی تاریخ رقم کی ہے: 'خدا کے گھر کی ٹونٹی کی تجدید ہوئی - ہم نے \"رحمہ\" کو آپ کے رب کی تاریخ کے طور پر لیا ہے۔ 325}۔"
  tr: "Dokuz yüz altmış yılında, Kutsal Ev'den rahmet oluğunun yapımı gerçekleşti ve Ebu Bekir el-Yakim el-Mekki bu konuda tarihçi olarak şöyle demiştir: \"Ey Yüce Efendim ve Mescid-i Haram'ın sahibi olan Allah, karışıklık içinde olan ayakta duranın önünde, Allah Evi'nin oluğunu yenile, böylece Rabbinden rahmet elde etmiş oluruz, ey tarihçi\" {alıntı: Şadharat-dahab s. 325}."
  id: "Pada tahun 960, pembangunan saluran air rahmat dari Rumah Suci berlangsung, dan Abu Bakar Al-Yaqim Al-Makki berkata dalam hal itu, sebagai seorang sejarawan: “Wahai Tuhan Yang Maha Agung, dan Pemilik masjid — di hadapan orang yang berdiri dalam keadaan kebingungan — perbaharuilah saluran air Rumah Allah, sehingga kami memperoleh — rahmat dari Tuhanmu, sang sejarawan” {kutip:shadharat-dhahab hlm. 325}."
