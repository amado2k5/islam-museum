id: "event/after-the-killing-the-women-and-children-of-the-house-are-stripped-and-two-boys-taken-captive-295"
class: event
kind: other
label:
  ar: "تجريد نساء البيت وصبيانه وأسر صبيين بعد قتل أبي جعفر، 295هـ، ص378"
  en: "The women and children of the house are stripped after the killing and two boys are taken captive, 295 AH, p. 378"
  fr: "Après le meurtre, les femmes et les enfants de la maison sont dépouillés et deux garçons sont capturés, 295 de l’hégire, p. 378"
  ur: "ابو جعفر کے قتل کے بعد گھر کی خواتین اور بچوں کو برہنہ کیا جاتا ہے اور دو لڑکوں کو قید کر لیا جاتا ہے، 295ھ، ص378"
summary:
  ar: "بعد قتل أبي جعفر جُرّد نساء البيت وصبيانه، وأُصيب بعضهم، وأُخذ اثنان من الصبيان أسيرين إلى منصور بن هشام الدهمي، وأُصيب حفيد لأبي جعفر حين ألقى نفسه على جده."
  en: "After the killing, the men of Banu al-Harith stripped the women and children of the house and wounded some of them. Two boys were taken captive to Mansur ibn Hisham al-Dahmi, and a six-year-old grandson of Abu Ja'far was struck when he threw himself over his grandfather's body."
  fr: "Après le meurtre, les hommes des Banu al-Harith dépouillèrent les femmes et les enfants de la maison et en blessèrent certains. Deux garçons furent emmenés captifs chez Mansur ibn Hisham al-Dahmi et un petit-fils d’Abu Ja'far, âgé de six ans, fut frappé en se jetant sur le corps de son grand-père."
  ur: "ابو جعفر کے قتل کے بعد بنو حارث نے گھر کی خواتین اور بچوں کو برہنہ کیا اور ان میں سے کچھ زخمی ہوئے۔ دو لڑکے منصور بن ہشام الدہمی کے پاس قیدی بنا کر لے جائے گئے، اور ابو جعفر کا چھ سال کا پوتا اپنے دادا کے جسم پر جا گرا تو اسے ضرب لگی۔"
