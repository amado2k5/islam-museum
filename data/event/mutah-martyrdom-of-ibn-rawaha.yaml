id: event/mutah-martyrdom-of-ibn-rawaha
class: event
kind: other
label: { ar: "استشهاد عبد الله بن رواحة بعد تردده", en: "Martyrdom of Abd Allah ibn Rawaha after his hesitation", es: "Martirio de Abd Allah ibn Rawaha tras su vacilación.", fr: "Martyre d'Abd Allah ibn Rawaha après son hésitation", ur: "عبد اللہ بن رواحہ کی ان کے تذبذب کے بعد شہادت", tr: "Abdullah ibn Ravaha, tereddüt ettikten sonra şehit edildi.", id: "Abdullah bin Rawaha gugur sebagai syahid setelah ia ragu-ragu." }
summary:
  ar: "حين قُتل جعفر أخذ عبد الله بن رواحة الراية، وتردد عن الاقتحام فعاتب نفسه بأرجوزة ثم نزل. أتاه ابن عمه بعرق من لحم، فأخذ منه نهسةً ثم سمع الحطمة في الناس فألقاه وتقدم قاتل حتى قُتل شهيدًا. ورأى النبي سريره في الجنة مائلًا عن سريري زيد وجعفر لأنه كان ترددَ قليلًا ثم مضى."
  en: "When Ja'far was killed, Ibn Rawaha took the standard and hesitated; he exhorted his soul in verse then dismounted. His cousin brought him a bone of meat; he bit from it, heard the battle roar and threw it down, advancing to fight until killed. The Prophet reported seeing Ibn Rawaha's throne in Paradise tilted slightly relative to the thrones of Zayd and Ja'far because he had hesitated."
  es: "Cuando Ja'far fue asesinado, Ibn Rawaha tomó el estandarte y vaciló; exaltó su espíritu con versos y luego desmontó. Su primo le trajo un hueso de carne; lo mordió, oyó el fragor de la batalla y lo arrojó al suelo, avanzando para luchar hasta morir. El Profeta relató haber visto el trono de Ibn Rawaha en el Paraíso ligeramente inclinado con respecto a los tronos de Zayd y Ja'far debido a su vacilación."
  fr: "Lorsque Ja'far fut tué, Ibn Rawaha prit l'étendard et hésita; il se remémora des vers puis descendit de cheval. Son cousin lui apporta un os de viande; il en mordit un morceau, entendit le grondement de la bataille et le jeta à terre, s'avançant au combat jusqu'à la mort. Le Prophète rapporta avoir vu le trône d'Ibn Rawaha au Paradis légèrement incliné par rapport à ceux de Zayd et de Ja'far, car il avait hésité."
  ur: "جب جعفر کو قتل کیا گیا تو ابن رواحہ نے معیار کو لیا اور ہچکچاہٹ کا مظاہرہ کیا۔ اس نے اپنی روح کو آیت میں نصیحت کی پھر نیچے اترا۔ اس کا کزن اس کے لیے گوشت کی ہڈی لے کر آیا۔ اس نے اس سے کاٹا، جنگ کی گرج سنی اور اسے نیچے پھینک دیا، یہاں تک کہ مارے جانے تک لڑنے کے لیے آگے بڑھا۔ نبی نے جنت میں ابن رواحہ کے تخت کو زید اور جعفر کے تختوں کی نسبت قدرے جھکا ہوا دیکھا کیونکہ وہ ہچکچاتے تھے۔"
  tr: "Cafer öldürüldüğünde, Abdullah ibn Ravaha sancağı aldı, ancak ileriye doğru hücum etmekte tereddüt etti. Sonra bir sitem şiiri yazdı ve atından indi. Kuzeni ona bir parça et getirdi ve bir lokma aldı. Sonra halk arasındaki gürültüyü duyunca eti fırlattı ve şehit olana kadar savaşmaya devam etti. Peygamber, cennetteki yatağının Zeyd ve Cafer'inkinden biraz farklı olduğunu gördü, çünkü o ilerlemeden önce bir an tereddüt etmişti."
  id: "Ketika Ja'far terbunuh, Abdullah ibn Rawahah mengambil panji, tetapi ragu-ragu untuk maju menyerang. Kemudian ia menggubah syair celaan dan turun dari kudanya. Sepupunya membawakan sepotong daging, dan ia menggigitnya. Kemudian, mendengar keributan di antara orang-orang, ia membuangnya dan maju untuk berperang hingga ia gugur sebagai syahid. Nabi melihat tempat tidurnya di Surga sedikit miring dari tempat tidur Zaid dan Ja'far karena beliau ragu-ragu sejenak sebelum maju."
