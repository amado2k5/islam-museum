label: { ar: "استشهاد عبد الله بن رواحة بعد تردده", en: "Martyrdom of Abd Allah ibn Rawaha after his hesitation" }
summary:
  ar: "حين قُتل جعفر أخذ عبد الله بن رواحة الراية، وتردد عن الاقتحام فعاتب نفسه بأرجوزة ثم نزل. أتاه ابن عمه بعرق من لحم، فأخذ منه نهسةً ثم سمع الحطمة في الناس فألقاه وتقدم قاتل حتى قُتل شهيدًا. ورأى النبي سريره في الجنة مائلًا عن سريري زيد وجعفر لأنه كان ترددَ قليلًا ثم مضى."
  en: "When Ja'far was killed, Ibn Rawaha took the standard and hesitated; he exhorted his soul in verse then dismounted. His cousin brought him a bone of meat; he bit from it, heard the battle roar and threw it down, advancing to fight until killed. The Prophet reported seeing Ibn Rawaha's throne in Paradise tilted slightly relative to the thrones of Zayd and Ja'far because he had hesitated."
