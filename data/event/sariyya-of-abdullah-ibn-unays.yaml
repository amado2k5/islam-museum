label: { en: "Sariyya of Abdullah ibn Unays against Sufyan ibn Khalid", ar: "سرية عبد الله بن أنيس إلى سفيان بن خالد" }
summary:
  en: "A single-man sariyya the Prophet sent in Muharram of the sixth year, as Waqidi reports, to kill Sufyan ibn Khalid al-Hudhali, who was gathering forces at Uranah; Ibn Unays went alone, identified him by the Prophet's description, and joined him to get close."
  ar: "سرية أرسلها النبي في المحرم سنة ست، كما يروي الواقدي، لقتل سفيان بن خالد الهذلي الذي جمع الجموع بعرنة؛ خرج عبد الله بن أنيس وحده، فعرف سفيان بالصفة التي وصفها النبي، واندس إليه ليتمكن منه."
