id: event/sariyya-of-abdullah-ibn-unays
class: event
kind: raid
label: { en: "Sariyya of Abdullah ibn Unays against Sufyan ibn Khalid", ar: "سرية عبد الله بن أنيس إلى سفيان بن خالد", es: "Sariyya de Abdullah ibn Unays contra Sufyan ibn Khalid", fr: "Sariyya d'Abdullah ibn Unays contre Sufyan ibn Khalid", ur: "سفیان بن خالد کے خلاف عبداللہ بن انیس کی ساریہ" }
summary:
  en: "A single-man sariyya the Prophet sent in Muharram of the sixth year, as Waqidi reports, to kill Sufyan ibn Khalid al-Hudhali, who was gathering forces at Uranah; Ibn Unays went alone, identified him by the Prophet's description, and joined him to get close."
  ar: "سرية أرسلها النبي في المحرم سنة ست، كما يروي الواقدي، لقتل سفيان بن خالد الهذلي الذي جمع الجموع بعرنة؛ خرج عبد الله بن أنيس وحده، فعرف سفيان بالصفة التي وصفها النبي، واندس إليه ليتمكن منه."
  es: "Según relata Waqidi, el Profeta envió a un solo sariyya en Muharram del sexto año para matar a Sufyan ibn Khalid al-Hudhali, que estaba reuniendo fuerzas en Uranah. Ibn Unays fue solo, lo identificó por la descripción del Profeta y se unió a él para acercarse."
  fr: "Selon Waqidi, le Prophète envoya un homme seul, un sariyya, au mois de Muharram de la sixième année, pour tuer Sufyan ibn Khalid al-Hudhali, qui rassemblait des forces à Uranah; Ibn Unays partit seul, l'identifia grâce à la description du Prophète et le rejoignit pour s'approcher."
  ur: "جیسا کہ واقدی نے بیان کیا ہے کہ چھٹے سال کے محرم میں نبی نے اکیلا آدمی سریہ بھیجا، سفیان بن خالد الحضلی کو قتل کرنے کے لیے، جو اورانہ میں فوجیں جمع کر رہا تھا۔ ابن انیس اکیلے گئے، نبی کے بیان سے ان کی شناخت کی، اور قریب ہونے کے لیے ان کے ساتھ شامل ہوئے۔"
