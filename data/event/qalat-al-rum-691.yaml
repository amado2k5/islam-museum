label: { ar: "فتح قلعة الروم سنة 691هـ", en: "The fall of Qal'at al-Rum, 691", es: "La caída de Qal'at al-Rum, 691", fr: "La chute de Qal'at al-Rum, 691", ur: "زوال قلات الروم ص 691", tr: "Hicri 691 yılında Roma kalesinin fethi", id: "Penaklukan benteng Romawi pada tahun 691 Hijriah" }
summary:
  ar: "في رجب سنة إحدى وتسعين وستمائة نازل السلطان الملك الأشرف خليل قلعةَ الروم المجاورة لقلعة البيرة، وكان أهلها نصارى من تحت طاعة التتار، فنصب عليها المجانيق وجدّ في حصارها حتى فُتحت بعد خمسة وعشرين يوماً؛ وقال الشهاب محمود في كتاب «الفتح»: فسطا خميس الإسلام يوم السبت على أهل الأحد، فبارك الله للأمة في سبتها وخميسها {cite:shadharat-dhahab p. 729}."
  en: "In Rajab 691 Sultan al-Malik al-Ashraf Khalil laid siege to Qal'at al-Rum, next to Qal'at al-Bira; its people were Christians under Tatar authority. He set up catapults and pressed the siege until it was taken after twenty-five days. Al-Shihab Mahmud said in his book al-Fath: 'The Thursday of Islam (khamis al-Islam) fell upon the people of Sunday (ahad) on a Saturday (sabt), and God blessed the community in its Saturday and its Thursday' {cite:shadharat-dhahab p. 729}."
  es: "En Rajab 691, el sultán al-Malik al-Ashraf Khalil sitió Qal'at al-Rum, contigua a Qal'at al-Bira; sus habitantes eran cristianos bajo autoridad tártara. Instaló catapultas y mantuvo el asedio hasta que fue tomada después de veinticinco días. Al-Shihab Mahmud dijo en su libro al-Fath: «El jueves del Islam (khamis al-Islam) cayó sobre la gente del domingo (ahad) en sábado (sabt), y Dios bendijo a la comunidad en su sábado y en su jueves» {cita: shadharat-dhahab p. 729}."
  fr: "En Rajab 691, le sultan al-Malik al-Ashraf Khalil assiégea Qal'at al-Rum, ville voisine de Qal'at al-Bira. Ses habitants étaient chrétiens et soumis à l'autorité tatare. Il fit installer des catapultes et poursuivit le siège jusqu'à la prise de la ville après vingt-cinq jours. Al-Shihab Mahmud rapporte dans son ouvrage al-Fath: « Le jeudi de l'Islam (khamis al-Islam) tomba un samedi (sabt) alors que les gens étaient d'ordinaire d'habitude un dimanche (ahad), et Dieu bénit la communauté en ce samedi et ce jeudi. » (cf. shadharat-dhahab, p. 729)."
  ur: "رجب 691 میں سلطان الملک الاشرف خلیل نے قلات الروم کا محاصرہ کیا، قلات البیراء کے ساتھ؛ اس کے لوگ تاتاری حکومت کے تحت عیسائی تھے۔ اس نے گلیلیں قائم کیں اور محاصرے کو دبایا یہاں تک کہ پچیس دن کے بعد اسے لے لیا گیا۔ الشہاب محمود نے اپنی کتاب الفتح میں کہا ہے: ''اسلام کی جمعرات ⁦(خمیس الاسلام)⁩ اتوار ⁦(احد)⁩ کے لوگوں پر ہفتہ ⁦(سبط)⁩ کے دن پڑی، اور خدا نے اس کے ہفتہ اور اس کی جمعرات میں برادری کو برکت دی''۔ 729}۔"
  tr: "Hicri 691 yılının Receb ayında Sultan Al-Malik Al-Ashraf Halil, Bireh kalesinin bitişiğindeki Romalılara ait kaleyi kuşattı. Kale sakinleri Tatarların yönetimi altındaki Hristiyanlardı. Sultan kaleye karşı mancınıklar kurdu ve yirmi beş gün süren kuşatmanın ardından kale açıldı. Al-Şihab Mahmud, “Al-Feth” adlı kitabında şöyle demiştir: “İslam’ın Perşembesi, Cumartesi günü Pazar günü halkına saldırdı, bu yüzden Allah ümmeti Cumartesi ve Perşembe günlerinde bereketlendirdi.” {kaynak:şadharat-dhahab s. 729}"
  id: "Pada bulan Rajab tahun 691 H, Sultan Al-Malik Al-Ashraf Khalil mengepung benteng Romawi yang berdekatan dengan benteng Bireh. Penduduknya adalah orang Kristen di bawah kekuasaan Tatar. Ia memasang ketapel untuk menyerang benteng tersebut dan melanjutkan pengepungannya hingga benteng itu berhasil ditembus setelah dua puluh lima hari. Al-Shihab Mahmud berkata dalam kitab “Al-Fath”: “Hari Kamis Islam menyerang penduduk hari Minggu pada hari Sabtu, maka Allah memberkati umat Islam pada hari Sabtu dan Kamisnya.” {kutipan:shadharat-dhahab hlm. 729}"
