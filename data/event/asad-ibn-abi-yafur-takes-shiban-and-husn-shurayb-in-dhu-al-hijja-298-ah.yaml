id: "event/asad-ibn-abi-yafur-takes-shiban-and-husn-shurayb-in-dhu-al-hijja-298-ah"
class: event
kind: other
label:
  ar: "يدخل أسعد بن أبي يعفر شبام ويقهر حصن شريب في ذي الحجة سنة 298هـ، ص397"
  en: "Asad ibn Abi Ya'fur takes Shiban and forces the fortress of Sharib in Dhu al-Hijja 298 AH, p. 397"
  ur: "اسعد بن ابی یعفر ذوالحجہ 298ھ میں شبام پر قبضہ کرتے ہیں اور حصن شریب کو زبردستی لیتے ہیں، ص397"
  fr: "Asad ibn Abi Ya'fur prend Shiban et force la forteresse de Sharib en Dhu al-Hijja 298 H, p. 397"
  es: "Asad ibn Abi Ya'fur toma Shiban y fuerza la fortaleza de Sharib en Dhu al-Hijja 298 AH, p. 397"
  tr: "As'ad ibn Abi Ya'fur, Hicri 298 yılının Zilhicce ayında Şibam'a girdi ve Şarib kalesini fethetti (s. 397)."
  id: "As'ad ibn Abi Ya'fur memasuki Shibam dan menaklukkan benteng Sharib pada bulan Dzul Hijjah tahun 298 H, hlm. 397"
summary:
  ar: "يخرج أسعد بن أبي يعفر من صنعاء إلى شبام في حرب القرامطة يوم الخميس لثمانية أيام باقية من ذي الحجة سنة 298هـ، فيصعد الجبل ويطرد القرامطة، ويدخل حصن شريب قهرا."
  en: "Asad ibn Abi Ya'fur leaves Sanaa for Shiban on Thursday, eight nights before the end of Dhu al-Hijja 298 AH. He goes up the mountain, drives the Qarmatians out and takes the fortress of Sharib by force."
  ur: "اسعد بن ابی یعفر ذوالحجہ 298ھ کے آخر سے آٹھ راتیں پہلے جمعرات کو صنعاء سے شبام کی طرف نکلتے ہیں، پہاڑ پر چڑھ کر قرامطہ کو نکال دیتے ہیں اور حصن شریب کو زبردستی لے لیتے ہیں۔"
  fr: "Asad ibn Abi Ya'fur quitte Sanaa pour Shiban le jeudi, huit nuits avant la fin de Dhu al-Hijja 298 H. Il gravit la montagne, en chasse les Qarmates et prend de force la forteresse de Sharib."
  es: "Asad ibn Abi Ya'fur parte de Sanaa hacia Shiban el jueves, ocho noches antes del final de Dhu al-Hijja del año 298 AH. Sube a la montaña, expulsa a los cármatas y toma por la fuerza la fortaleza de Sharib."
  tr: "As'ad ibn Abi Ya'fur, Hicri 298 yılının Zilhicce ayının bitimine sekiz gün kala, Perşembe günü Karmatilerle savaşmak için Sana'a'dan Şibam'a gitti. Dağa tırmandı, Karmatileri püskürttü ve zorla Şarib kalesine girdi."
  id: "As’ad ibn Abi Ya’fur berangkat dari Sana’a ke Shibam untuk memerangi kaum Qarmatian pada hari Kamis, delapan hari sebelum berakhirnya Dzul Hijjah tahun 298 H. Ia mendaki gunung dan mengusir kaum Qarmatian, lalu memasuki benteng Sharib dengan paksa."
