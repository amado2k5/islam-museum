id: event/al-yafur-and-al-tarif-camp-at-adudan-and-fight-at-the-maydan-of-sanaa-288
class: event
kind: other
label:
  ar: "آل يعفر وآل طريف يعسكرون بعضدان ويقاتلون في ميدان صنعاء، شوال 288هـ"
  en: "Al Ya'fur and Al Tarif camp at Adudan and fight on the parade ground of Sana'a, Shawwal 288 AH"
  ur: "آل یعفر اور آل طریف عضدان میں پڑاؤ ڈالتے ہیں اور صنعاء کے میدان میں لڑتے ہیں، شوال 288ھ"
summary:
  ar: "سار آل يعفر وأبو الغشام بن طريف من شبام بعساكرهم حتى عسكروا بعضدان وأقاموا أياماً، ثم نزلوا في يوم الثلاثاء لأربع عشرة خلت من شوال إلى ميدان صنعاء، فوقف الهادي في وجوههم حتى حضرت الصلاة فصلى، وحملوا على ميسرته فأُصيب جماعة من أصحابه، ثم أمر خيلاً فحملت عليهم فطردتهم إلى معسكرهم."
  en: "Al Ya'fur and Abu al-Ghasham ibn Tarif set out from Shibam with their armies and camped at Adudan for some days; on Tuesday, fourteen days of Shawwal gone, they came down to the parade ground of Sana'a, al-Hadi stood in front of them until the prayer was due, dismounted and prayed, they charged his left and a number of his companions were struck, and he then ordered horse to charge, which drove them back to their camp."
  ur: "آل یعفر اور ابو الغشام بن طریف اپنے لشکروں کے ساتھ شبام سے نکلے اور عضدان میں پڑاؤ ڈال کر کئی دن رہے؛ شوال کے چودہ دن گزرنے پر منگل کے دن وہ صنعاء کے میدان میں اترے، ہادی ان کے سامنے کھڑے ہو گئے یہاں تک کہ نماز کا وقت آیا تو اتر کر نماز پڑھی، مخالفوں نے ان کے بائیں بازو پر حملہ کیا تو ان کے کئی ساتھی زخمی ہوئے، پھر انہوں نے سواروں کو حملے کا حکم دیا تو وہ انہیں ان کے پڑاؤ تک بھگا لے گئے۔"
