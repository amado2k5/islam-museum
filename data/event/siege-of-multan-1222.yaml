label: { ar: "حصار المغول للملتان ١٢٢٢م", en: "The Mongol siege of Multan (1222)" }
summary:
  ar: "في عهد ناصر الدين قباجة على الملتان وأوج بلغ جند المغول نواحي السند في أثر جلال الدين الخوارزمشاه الفارّ أمامهم؛ وتروي كتب التاريخ أن المغول حاصروا الملتان سنة ١٢٢٢م دون أن يأخذوها، فصمدت لقباجة. ثم ضعف مركزه بعد لقائه غير الموفق بجلال الدين سنة ٦٢١هـ/١٢٢٤م حين بلغ النواحي هارباً من المغول المتقدمين {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  en: "In Nasir al-Din Qabacha's days over Multan and Uch, Mongol detachments reached the Indus marches in pursuit of the fleeing Jalal al-Din Khwarazm-Shah; the narrative histories record a Mongol siege of Multan in 1222 that failed to take the city, which held for Qabacha. His position was then weakened by the unsuccessful encounter with Jalal al-Din in 621/1224, when the Khwarazm-Shah reached the area fleeing the advancing Mongols {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  ur: "ناصر الدین قباجہ کے عہدِ ملتان و اُچ میں مغول دستے فرار خوارزم شاہ جلال الدین کے پیچھے سندھ کے کناروں تک پہنچے؛ تواریخ میں ملتان کا 1222ء کا محاصرہ درج ہے جو شہر لینے میں ناکام رہا اور قباجہ کے لیے قائم رہا۔ پھر 621ھ/1224ء میں جلال الدین سے ناکام مقابلے کے بعد — جو بڑھتے ہوئے مغلوں سے بھاگتا ہوا اس علاقے میں آیا — اس کا مرکز کمزور ہو گیا {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}۔"
