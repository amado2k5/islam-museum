id: event/siege-of-multan-1222
class: event
kind: siege
label: { ar: "حصار المغول للملتان ١٢٢٢م", en: "The Mongol siege of Multan (1222)", es: "El asedio mongol de Multán (1222)", fr: "Le siège de Multan par les Mongols (1222)", ur: "ملتان کا منگول محاصرہ (1222)", tr: "Moğolların Multan kuşatması, MS 1222", id: "Pengepungan Multan oleh Mongol tahun 1222 M" }
summary:
  ar: "في عهد ناصر الدين قباجة على الملتان وأوج بلغ جند المغول نواحي السند في أثر جلال الدين الخوارزمشاه الفارّ أمامهم؛ وتروي كتب التاريخ أن المغول حاصروا الملتان سنة ١٢٢٢م دون أن يأخذوها، فصمدت لقباجة. ثم ضعف مركزه بعد لقائه غير الموفق بجلال الدين سنة ٦٢١هـ/١٢٢٤م حين بلغ النواحي هارباً من المغول المتقدمين {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  en: "In Nasir al-Din Qabacha's days over Multan and Uch, Mongol detachments reached the Indus marches in pursuit of the fleeing Jalal al-Din Khwarazm-Shah; the narrative histories record a Mongol siege of Multan in 1222 that failed to take the city, which held for Qabacha. His position was then weakened by the unsuccessful encounter with Jalal al-Din in 621/1224, when the Khwarazm-Shah reached the area fleeing the advancing Mongols {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  ur: "ناصر الدین قباجہ کے عہدِ ملتان و اُچ میں مغول دستے فرار خوارزم شاہ جلال الدین کے پیچھے سندھ کے کناروں تک پہنچے؛ تواریخ میں ملتان کا 1222ء کا محاصرہ درج ہے جو شہر لینے میں ناکام رہا اور قباجہ کے لیے قائم رہا۔ پھر 621ھ/1224ء میں جلال الدین سے ناکام مقابلے کے بعد — جو بڑھتے ہوئے مغلوں سے بھاگتا ہوا اس علاقے میں آیا — اس کا مرکز کمزور ہو گیا {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}۔"
  es: "En los días de Nasir al-Din Qabacha sobre Multan y Uch, destacamentos mongoles llegaron a las marcas del Indo persiguiendo al fugitivo Jalal al-Din Khwarazm-Shah; las crónicas históricas registran un asedio mongol a Multan en 1222 que fracasó en su intento de tomar la ciudad, la cual permaneció en manos de Qabacha. Su posición se debilitó posteriormente por el encuentro fallido con Jalal al-Din en 621/1224, cuando el Khwarazm-Shah llegó a la zona huyendo del avance mongol {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  fr: "Sous le règne de Nasir al-Din Qabacha sur Multan et Uch, des détachements mongols atteignirent les rives de l'Indus à la poursuite de Jalal al-Din Khwarezm-Shah en fuite. Les récits historiques rapportent un siège mongol de Multan en 1222 qui échoua et la ville resta aux mains de Qabacha. Sa position fut ensuite affaiblie par l'échec de son affrontement avec Jalal al-Din en 621/1224, lorsque le Khwarezm-Shah atteignit la région, fuyant l'avancée des Mongols (voir: Encyclopaedia of Islam, vol. 7, p. 603)."
  tr: "Nasır din Kabe'nin Multan'daki hükümdarlığı döneminde, Moğol ordusu, kendilerinden önce kaçmış olan Celal din Harezmşah'ı takip ederek Sind bölgesine ulaştı. Tarihi kaynaklar, Moğolların 1222 yılında Multan'ı kuşattığını ancak ele geçiremediğini ve Kabe'nin direndiğini anlatır. 621 Hicri/1224 yılında Celal din ile yaptığı başarısız karşılaşmanın ardından, ilerleyen Moğollardan kaçarak bölgeye ulaştığında konumu zayıfladı. {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}"
  id: "Pada masa pemerintahan Nasir al-Din Qabaja di Multan, pasukan Mongol mencapai wilayah Sindh untuk mengejar Jalal al-Din Khwarazmshah, yang telah melarikan diri sebelum mereka. Catatan sejarah menyebutkan bahwa Mongol mengepung Multan pada tahun 1222 M tetapi gagal merebutnya, dan Qabaja bertahan. Posisinya melemah setelah pertemuannya yang tidak berhasil dengan Jalal al-Din pada tahun 621 H/1224 M, ketika ia mencapai wilayah tersebut melarikan diri dari pasukan Mongol yang maju. {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}"
