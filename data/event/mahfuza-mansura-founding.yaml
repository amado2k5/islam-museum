label: { ar: "بناء المحفوظة والمنصورة", en: "The Founding of al-Mahfuza and al-Mansura", es: "La fundación de al-Mahfuza y al-Mansura", fr: "La fondation d'al-Mahfuza et d'al-Mansoura", ur: "المحفوظہ اور المنصورہ کی تاسیس" }
summary:
  ar: "ولي الحكم بن عوانة الكلبي وقد كفر أهل الهند إلا أهل قصة فلم ير للمسلمين ملجأ يلجأون إليه فبنى من وراء البحيرة مما يلي الهند مدينة سماها المحفوظة وجعلها مأوى لهم ومعاذاً ومصرها وقال لمشايخ كلب من أهل الشام ما ترون أن نسميها فقال بعضهم دمشق وقال بعضهم حمص وقال رجل منهم سمها تدمر فقال دمر الله عليك يا أحمق ولكني أسميها المحفوظة ونزلها وكان عمرو بن محمد بن القاسم مع الحكم وكان يفوض إليه ويقلده جسيم أموره وأعماله فأغزاه من المحفوظة فلما قدم عليه وقد ظفر أمره فبنى دون البحيرة مدينة وسماها المنصورة فهي التي ينزلها العمال اليوم وتخلص الحكم ما كان في أيدي العدو مما غلبوا عليه ورضي الناس بولايته وكان خالد يقول واعجبا وليت فتى العرب فرفض يعني تميماً ووليت أبخل الناس فرضي به ثم قتل الحكم بها ثم كان العمال بعد يقاتلون العدو فيأخذون ما استطف لهم ويفتحون الناحية قد نكث أهلها فلما كان أول الدولة المباركة ولى أبو مسلم عبد الرحمن بن مسلم مغلساً العبدي ثغر السند وأخذ على طخارستان."
  en: "With Hind apostatized save Qassa's folk and no refuge left, al-Hakam ibn Awana al-Kalbi built al-Mahfuza beyond the lake — Syrian Kalbi shaykhs naming it Dimashq or Hims till one said Tadmur and drew 'God destroy you, fool — it is al-Mahfuza'. Amr ibn Muhammad ibn al-Qasim, his trusted deputy, raided from it and built al-Mansura below the lake — the governors' seat today — while al-Hakam won back enemy holdings to general approval. Khalid marvelled: 'I gave them the Arabs' most generous youth and they rejected him — the most miserly, accepted' — and al-Hakam was killed there. At the da'wa's dawn Abu Muslim gave the frontier to Mughallis al-Abdi, who set out via Tukharistan."
  es: "Con Hind apostatada salvo la gente de Qassa y sin refugio alguno, al-Hakam ibn Awana al-Kalbi construyó al-Mahfuza más allá del lago; los jeques sirios Kalbi la llamaron Dimashq o Hims hasta que uno dijo Tadmur y dibujó: «¡Que Dios te destruya, insensato! ¡Es al-Mahfuza!». Amr ibn Muhammad ibn al-Qasim, su lugarteniente de confianza, saqueó desde allí y construyó al-Mansura debajo del lago —la sede del gobernador en la actualidad— mientras al-Hakam recuperaba posesiones enemigas con la aprobación general. Khalid se maravilló: «Les di al joven más generoso de los árabes y lo rechazaron; al más avaro, lo aceptaron». Al-Hakam lo mataron allí. Al amanecer de la da'wa, Abu Muslim entregó la frontera a Mughallis al-Abdi, quien partió a través de Tukharistán."
  fr: "L'Inde ayant apostasié, à l'exception des habitants de Qassa, et aucun refuge n'étant plus trouvé, al-Hakam ibn Awana al-Kalbi fit construire al-Mahfuza au-delà du lac. Les cheikhs kalbis syriens la nommèrent Dimashq ou Hims, jusqu'à ce que l'un d'eux, s'exclamant « Tadmur ! », écrivit: « Que Dieu te détruise, imbécile ! C'est al-Mahfuza ! » Amr ibn Muhammad ibn al-Qasim, son fidèle adjoint, mena des raids depuis cette base et fit bâtir al-Mansura en aval du lac – siège actuel du gouvernement – tandis qu'al-Hakam reconquérait les territoires ennemis, à la satisfaction générale. Khalid s'étonna: « Je leur ai offert le jeune homme le plus généreux des Arabes et ils l'ont rejeté ! Le plus avare, lui, l'a accepté ! » Al-Hakam y trouva la mort. À l'aube de la da'wa, Abou Muslim confia la frontière au Moghol al-Abdi, qui partit par le Tukharistan."
  ur: "ہند کے مرتد ہونے کے بعد قصہ کے لوگوں کو چھوڑ کر اور کوئی پناہ گاہ نہ چھوڑی گئی، الحکم ابن عوانہ الکلبی نے جھیل کے پار المحفوظہ تعمیر کیا - شامی کلبی شیوخ نے اس کا نام دمشق یا حمس رکھا یہاں تک کہ کسی نے تدمر کہا اور متوجہ کیا کہ 'خدا تمہیں تباہ کرے، احمق - یہ المحفوظہ ہے'۔ عمرو بن محمد بن القاسم، اس کے معتمد نائب، نے اس سے چھاپہ مارا اور جھیل کے نیچے المنصورہ تعمیر کیا - جو آج گورنروں کی نشست ہے - جب کہ الحکم نے دشمن کے قبضے کو عام منظوری تک واپس لے لیا۔ خالد نے حیرت سے کہا: 'میں نے انہیں عربوں کی سب سے زیادہ سخی نوجوان دی اور انہوں نے اسے مسترد کر دیا - سب سے زیادہ کنجوس، قبول کیا' - اور الحکم وہیں مارا گیا۔ دعوت فجر کے وقت ابو مسلم نے مغلس العبدی کو سرحد دے دی، جو تخارستان کے راستے روانہ ہوئے۔"
