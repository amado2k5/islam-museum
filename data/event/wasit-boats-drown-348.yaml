label: { ar: "غرق زوارق الحاج من واسط", en: "The Sinking of the Pilgrim Boats from Wasit", es: "El hundimiento de los barcos de peregrinos de Wasit", fr: "Le naufrage des bateaux de pèlerins de Wasit", ur: "وصیت سے حاجیوں کی کشتیوں کا ڈوبنا", tr: "Wasit'ten gelen hacı tekneleri battı.", id: "Perahu-perahu peziarah dari Wasit tenggelam." }
summary:
  ar: "في سنة ثمان وأربعين وثلاثمائة غرق من الحاج الوارد من واسط بضعة عشر زورقًا كان فيها من الرجال والنساء والصبيان ستمائة نفس؛ وفي جمادى الأولى اشتدت الفتن بين الشيعة والسنة فقُتل بينهم خلق ووقع حريق كثير في باب الطاق {cite:muntazam-ibn-al-jawzi p. 686}."
  en: "In 348 seventeen boats of pilgrims coming from Wasit sank with six hundred men, women and children aboard; that Jumada I the Shi'i–Sunni fitnas killed people and a great fire took Bab al-Taq {cite:muntazam-ibn-al-jawzi p. 686}."
  es: "En 348, diecisiete barcos de peregrinos procedentes de Wasit se hundieron con seiscientos hombres, mujeres y niños a bordo; ese Jumada I, las fitnas chiítas-sunitas mataron gente y un gran incendio arrasó Bab al-Taq {cita:muntazam-ibn-al-jawzi p. 686}."
  fr: "En 348, dix-sept bateaux de pèlerins venant de Wasit coulèrent avec six cents hommes, femmes et enfants à bord; ce Jumada Ier, les fitnas chiites-sunnites tuèrent des gens et un grand incendie ravagea Bab al-Taq {cite:muntazam-ibn-al-jawzi p. 686}."
  ur: "348 میں وصیت سے آنے والے زائرین کی سترہ کشتیاں ڈوب گئیں جن میں چھ سو مرد، عورتیں اور بچے سوار تھے۔ کہ جماد اول کے شیعہ سنی فتنوں نے لوگوں کو قتل کیا اور باب الطاق کو اپنی لپیٹ میں لے لیا۔ 686}۔"
  tr: "Hicri 348 yılında, Wasit'ten hacıları taşıyan on iki tekne battı; içlerinde altı yüz erkek, kadın ve çocuk vardı. Cemâde-i Ula'da Şiiler ve Sünniler arasındaki çekişme şiddetlendi, aralarından birçok insan öldürüldü ve Bab el-Tak'ta büyük bir yangın çıktı. {cite:muntazam-ibn-al-jawzi s. 686}"
  id: "Pada tahun 348 H, selusin perahu yang membawa para peziarah dari Wasit tenggelam, dan di dalamnya terdapat enam ratus orang laki-laki, perempuan, dan anak-anak. Di Jumada al-Ula, perselisihan antara Syiah dan Sunni semakin intensif, dan banyak orang terbunuh di antara mereka, dan kebakaran besar terjadi di Bab al-Taq. {cite:muntazam-ibn-al-jawzi p. 686}"
