label: { ar: "يوم شعب جبلة", en: "The Day of Sha'b Jabala", es: "El día de Sha'b Jabala", fr: "Le jour de Sha'b Jabala", ur: "یوم شعب جبلہ", tr: "Jableh Halk Günü", id: "Hari Rakyat Jableh" }
summary:
  ar: "يوم من أيام العرب بين بني تميم وبني كلاب وأهله؛ شهده لقيط بن زرارة على تميم والرباب فأقبل على برذون مجفف بديباج عليه سرج مذهب من سروج كسرى وكان أول عربي تجفف، وحجي بينه وبين شريح بن الأحوص فأقحم فرسه الجرف فطعنه شريح فسقط مرتثاً ومات يترثى امرأته دختنوس بنت النعمان صاحبة الحيرة، وضربته بنو عبس وهو ميت {cite:ansab-al-ashraf p. 30-31}."
  en: "The day of Sha'b Jabala — Tamim and the Rabab against Kilab and its allies; Laqit ibn Zurara fell in the ravine duel with Shurayh ibn al-Ahwas, dying with his Lakhmid wife Dukhtanus on his lips while Banu Abs beat his corpse {cite:ansab-al-ashraf p. 30-31}."
  es: "El día de Sha'b Jabala — Tamim y los Rabab contra Kilab y sus aliados; Laqit ibn Zurara cayó en el duelo del barranco con Shurayh ibn al-Ahwas, muriendo con su esposa Lakhmid Dukhtanus en sus labios mientras Banu Abs golpeaba su cadáver {cite:ansab-al-ashraf p. 30-31}."
  fr: "Le jour de Sha'b Jabala — Tamim et les Rabab contre Kilab et ses alliés; Laqit ibn Zurara tomba dans le duel du ravin avec Shurayh ibn al-Ahwas, mourant avec sa femme Lakhmid Dukhtanus sur les lèvres tandis que Banu Abs battaient son cadavre {cite:ansab-al-ashraf p. 30-31}."
  ur: "شعب جبلہ کا دن - کلاب اور اس کے اتحادیوں کے خلاف تمیم اور رباب؛ لقیت بن زرارہ شریح ابن الاحواس کے ساتھ گھاٹی کے جھگڑے میں گرا، اپنی لحمید بیوی دختنوس کے ساتھ اس کے ہونٹوں پر مر گیا جب کہ بنو عباس نے اس کی لاش کو مارا۔ 30-31}۔"
  tr: "Beni Tamim ve Beni Kilab ile halkı arasında Arapların yaşadığı günlerden birinde, Lakit bin Zurarah, Tamim ve El-Rabab'a karşı şahitlik etti. Üzerinde Kisra'nın eyerlerinden altın yaldızlı bir eyer bulunan, ipek kumaşla kaplı bir ata bindi. İpek kumaşla kaplı ilk Arap oydu ve Şurayh bin El-Ahvas ile arasında bir hac yolculuğu vardı. Atını kıyıya fırlattı, bunun üzerine Şurayh onu bıçakladı. Yaralanarak yere düştü ve öldü. Hira'nın sahibi karısı Dukhtanus bint El-Nu'man'ın yasını tutarken, Beni Abs onu ölü haldeyken dövdü. {Kaynak: ansab-al-ashraf s. 30-31}"
  id: "Suatu hari di antara Bani Tamim dan Bani Kilab beserta kaumnya, terjadi pertempuran antara Bani Tamim dan Bani Kilab. Laqit bin Zurarah menjadi saksi pertempuran melawan Tamim dan Al-Rabab, lalu ia datang menunggang kuda yang ditutupi kain brokat, dengan pelana berlapis emas dari pelana Kisra. Ia adalah orang Arab pertama yang ditutupi kain brokat. Ia melakukan ziarah antara dirinya dan Shurayh bin Al-Ahwas, lalu ia melemparkan kudanya ke tepi sungai. Shurayh kemudian menusuknya, dan ia jatuh tersungkur karena luka tersebut, lalu meninggal dunia sambil meratapi istrinya, Dukhtanus bint Al-Nu’man, pemilik Al-Hira. Bani Abs kemudian memukulnya saat ia sudah mati. {cite:ansab-al-ashraf p. 30-31}."
