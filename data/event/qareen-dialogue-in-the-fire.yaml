id: event/qareen-dialogue-in-the-fire
kind: other
label:
  ar: حوار القرين في النار
  en: The qareen's dialogue in the Fire
  ur: آگ میں قرین کا محاورہ
  es: "El diálogo del qareen en el Fuego"
  fr: "Le dialogue du qareen dans le Feu"
  tr: "Ateşin içindeki yoldaşın diyaloğu"
  id: "Dialog sang sahabat di dalam api"
summary:
  ar: 'في سورة ق: وَقَالَ قَرِينُهُ هَٰذَا مَا لَدَيَّ عَتِيدٌ ۝ قَالَ قَرِينُهُ رَبَّنَا مَا أَطْغَيْتُهُ وَلَٰكِن كَانَ فِي ضَلَالٍ بَعِيدٍ {cite:tanzil-quran} [[passage/quran-50-23|ق 23]] [[passage/quran-50-27|ق 27]].'
  en: 'In Surat Qaf: and his companion says: this is what I have prepared; his companion says: our Lord, I did not send him astray but he was in far error {cite:tanzil-quran} [[passage/quran-50-23|Qaf 23]] [[passage/quran-50-27|Qaf 27]].'
  ur: 'سورة ق میں: اور اس کا قرین کہتا ہے: یہی وہ چیز ہے جو میرے پاس تیار ہے؛ اس کا قرین کہتا ہے: اے ہمارے رب میں نے اسے گمراہ نہیں کیا بلکہ وہ دور کی گمراہی میں تھا {cite:tanzil-quran} [[passage/quran-50-23|ق 23]] [[passage/quran-50-27|ق 27]]۔'
  es: "En Surat Qaf: y su compañero dice: esto es lo que he preparado; su compañero dice: Señor nuestro, no lo extravié, sino que estaba en un gran error {cite:tanzil-quran} [[passage/quran-50-23|Qaf 23]] [[passage/quran-50-27|Qaf 27]]."
  fr: "Dans la sourate Qaf: et son compagnon dit: voici ce que j'ai préparé; son compagnon dit: notre Seigneur, je ne l'ai pas égaré, mais il était dans une grande égarement {cite:tanzil-quran} [[passage/quran-50-23|Qaf 23]] [[passage/quran-50-27|Qaf 27]]."
  tr: "Kaf Suresi'nde: Arkadaşı, \"Benim hazırladığım budur\" diyecek. Arkadaşı, \"Ey Rabbimiz! Ben onu haddi aşmaya sevk etmedim, fakat o kendisi aşırı bir sapıklık içindeydi\" diyecek. {cite:tanzil-quran} [[passage/quran-50-23|Kaf 23]] [[passage/quran-50-27|Kaf 27]]."
  id: "Dalam Surah Qaf: Dan temannya akan berkata, “Inilah yang telah kusiapkan.” Temannya akan berkata, “Ya Tuhan kami, bukan aku yang menyebabkannya melanggar, tetapi dia sendiri yang berada dalam kesesatan yang sangat besar.” {cite:tanzil-quran} [[passage/quran-50-23|Qaf 23]] [[passage/quran-50-27|Qaf 27]]."
