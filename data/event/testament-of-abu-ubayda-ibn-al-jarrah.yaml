id: event/testament-of-abu-ubayda-ibn-al-jarrah
class: event
kind: death
label:
  ar: وصية أبي عبيدة بن الجراح ووفاته في طاعون عمواس
  en: Testament and death of Abu Ubayda ibn al-Jarrah in the plague of Amwas
  ur: طاعونِ عمواس میں ابو عبیدہ بن الجراح کی وصیت اور وفات
  es: "Testamento y muerte de Abu Ubayda ibn al-Jarrah durante la peste de Amwas."
  fr: "Testament et mort d'Abu Ubayda ibn al-Jarrah lors de l'épidémie d'Amwas"
  tr: "Ebu Ubeyde ibn el-Cerre'nin vasiyeti ve Amvas veba salgınında ölümü"
  id: "Wasiat Abu Ubaidah ibn al-Jarrah dan kematiannya dalam wabah Amwas"
summary:
  ar: "لما طُعن أبو عبيدة بن الجراح بالأردن دعا من حضره من المسلمين وأوصاهم بإقامة الصلاة وإيتاء الزكاة وصوم رمضان والصدقة والحج والعمرة والتواصي والنصح لأمرائهم وألا تهلكهم الدنيا، ثم قال لمعاذ بن جبل صلّ بالناس ومات {cite:hayat-al-sahaba-kandahlawi-sabbani scan vol. 1 p. 515}. وكان قد خطب حين اشتعل الوجع فقال إنه رحمة بهم ودعوة نبيهم وموت الصالحين قبلهم وسأل الله أن يقسم لأبي عبيدة حظه {cite:al-bidaya-wal-nihaya scan vol. 4 p. 81}. وتوفي سنة ثمان عشرة وله ثمان وخمسون سنة {cite:siyar-alam-nubala scan vol. 2 p. 100}، وفي رواية عروة بن رويم أن أجله أدركه بفحل قرب بيسان {cite:siyar-alam-nubala scan vol. 1 p. 347}، وصلى عليه معاذ ونزل في قبره معاذ وعمرو بن العاص والضحاك بن قيس وقبره بالأردن {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 828}."
  en: "When Abu Ubayda ibn al-Jarrah was struck in the Jordan he called those of the Muslims who were present and counselled them to keep prayer, pay zakat, fast Ramadan, give charity, perform hajj and umra, advise one another, be sincere to their commanders and not let the world destroy them; then he told Mu'adh ibn Jabal to lead the people in prayer, and died {cite:hayat-al-sahaba-kandahlawi-sabbani scan vol. 1 p. 515}. When the pain first spread he had preached that it was a mercy to them, the prayer of their Prophet and the death of the righteous before them, and had asked God to apportion Abu Ubayda his share {cite:al-bidaya-wal-nihaya scan vol. 4 p. 81}. He died in the year 18 aged fifty-eight {cite:siyar-alam-nubala scan vol. 2 p. 100}; in the report of Urwa ibn Ruwaym death overtook him at Fahl near Baysan {cite:siyar-alam-nubala scan vol. 1 p. 347}; Mu'adh prayed over him, and Mu'adh, Amr ibn al-As and al-Dahhak ibn Qays went down into his grave, which is in the Jordan district {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 828}."
  ur: "جب ابو عبیدہ بن الجراح کو اردن میں طاعون لگا تو انھوں نے پاس موجود مسلمانوں کو بلا کر وصیت کی کہ نماز قائم کریں، زکوٰۃ دیں، رمضان کے روزے رکھیں، صدقہ کریں، حج اور عمرہ کریں، ایک دوسرے کو نصیحت کریں، اپنے امیروں کے خیرخواہ رہیں اور دنیا انھیں ہلاک نہ کرے؛ پھر معاذ بن جبل سے کہا لوگوں کو نماز پڑھاؤ، اور فوت ہو گئے {cite:hayat-al-sahaba-kandahlawi-sabbani scan vol. 1 p. 515}. بیماری پھیلنے پر انھوں نے خطبہ دیا تھا کہ یہ ان کے لیے رحمت، ان کے نبی کی دعا اور ان سے پہلے صالحین کی موت ہے اور اللہ سے اپنا حصہ مانگا تھا {cite:al-bidaya-wal-nihaya scan vol. 4 p. 81}. وہ سن 18 ہجری میں اٹھاون سال کی عمر میں فوت ہوئے {cite:siyar-alam-nubala scan vol. 2 p. 100}؛ عروہ بن رویم کی روایت ہے کہ بیسان کے قریب فحل میں ان کی موت آئی {cite:siyar-alam-nubala scan vol. 1 p. 347}؛ معاذ نے ان کی نماز پڑھائی اور معاذ، عمرو بن العاص اور ضحاک بن قیس قبر میں اترے، اور ان کی قبر اردن میں ہے {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 828}."
  es: "Cuando Abu Ubayda ibn al-Jarrah fue herido en el Jordán, llamó a los musulmanes presentes y les aconsejó que mantuvieran la oración, pagaran el zakat, ayunaran en Ramadán, dieran caridad, realizaran el hajj y la umra, se aconsejaran unos a otros, fueran sinceros con sus comandantes y no permitieran que el mundo los destruyera; luego le dijo a Mu'adh ibn Jabal que dirigiera al pueblo en la oración, y murió {cite:hayat-al-sahaba-kandahlawi-sabbani scan vol. 1 p. 515}. Cuando el dolor se extendió por primera vez, había predicado que era una misericordia para ellos, la oración de su Profeta y la muerte de los justos antes que ellos, y había pedido a Dios que le diera a Abu Ubayda su parte {cite:al-bidaya-wal-nihaya scan vol. 4 p. 81}. Murió en el año 18 a la edad de cincuenta y ocho {cite:siyar-alam-nubala scan vol. 2 p. 100}; En el informe de Urwa ibn Ruwaym, la muerte lo sorprendió en Fahl cerca de Baysan {cite:siyar-alam-nubala scan vol. 1 p. 347}; Mu'adh oró por él, y Mu'adh, Amr ibn al-As y al-Dahhak ibn Qays descendieron a su tumba, que se encuentra en el distrito de Jordania {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 828}."
  fr: "Lorsque Abu Ubayda ibn al-Jarrah fut frappé dans le Jourdain, il appela les musulmans présents et les exhorta à accomplir la prière, à s'acquitter de la zakat, à jeûner pendant le Ramadan, à faire l'aumône, à accomplir le hajj et la umra, à s'entraider, à être sincères envers leurs chefs et à ne pas se laisser abattre par les épreuves de la vie. Il demanda ensuite à Mu'adh ibn Jabal de diriger la prière et mourut. Dès les premiers signes de la maladie, il avait prêché que c'était une miséricorde pour eux, la prière de leur Prophète et la mort des justes qui les avaient précédés, et avait imploré Dieu d'accorder à Abu Ubayda sa part. Il mourut en l'an 18, à l'âge de cinquante-huit ans. Dans le rapport d'Urwa ibn Ruwaym, la mort le surprit à Fahl près de Baysan {cite:siyar-alam-nubala scan vol. 1 p. 347}; Mu'adh pria sur lui, et Mu'adh, Amr ibn al-As et al-Dahhak ibn Qays descendirent dans sa tombe, qui se trouve dans le district de Jordan {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 828}."
  tr: "Ürdün'de Ebu Ubeyde ibn el-Cerrah bıçaklandığında, orada bulunan Müslümanları çağırdı ve onlara namazı kılmalarını, zekât vermelerini, Ramazan orucunu tutmalarını, sadaka vermelerini, Hac ve Umre yapmalarını, birbirlerine ve liderlerine öğüt vermelerini ve dünyevi arzuların onları mahvetmesine izin vermemelerini emretti. Sonra Muaz ibn Cebel'e insanlara namaz kıldırmasını söyledi ve vefat etti. {Kaynak:hayat-al-sahaba-kandahlawi-sabbani, cilt 1, s. 515}. Acı şiddetlendiğinde bir hutbe verdi ve bunun onlar için bir rahmet, Peygamberlerinin duasına bir cevap ve kendilerinden önce gelen salihlerin ölümü olduğunu söyledi ve Allah'tan Ebu Ubeyde'ye de payını vermesini diledi. {Kaynak:al-bidaya-wal-nihaya, cilt 4, s. 81}. On sekizinci yılda elli sekiz yaşında vefat etti. {Kaynak:siyar-alam-nubala, cilt 2, s. 100}. Urve ibn Ruveym'in rivayetine göre, onun belirlenen zamanı Baysan yakınlarındaki Fahl'da geldi. {cite:siyar-alam-nubala scan vol. 1 p. 347} ve Mu'adh onun için dua etti ve Mu'adh, Amr ibn al-Aas ve al-Dahhak ibn Qais onun kabrine indiler ve kabri Ürdün'dedir. {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 828}."
  id: "Ketika Abu Ubaidah ibn al-Jarrah ditikam di Yordania, ia memanggil kaum Muslimin yang hadir dan memerintahkan mereka untuk mendirikan salat, membayar zakat, berpuasa Ramadhan, memberi sedekah, melaksanakan haji dan umrah, saling menasihati dan memberi nasihat kepada pemimpin mereka, serta tidak membiarkan keinginan duniawi menghancurkan mereka. Kemudian ia menyuruh Mu'adh ibn Jabal untuk memimpin salat dan kemudian wafat. {cite:hayat-al-sahaba-kandahlawi-sabbani scan vol. 1 p. 515}. Ia telah menyampaikan khutbah ketika rasa sakitnya semakin hebat, mengatakan bahwa itu adalah rahmat bagi mereka, jawaban atas doa Nabi mereka, dan kematian orang-orang saleh sebelum mereka, dan ia memohon kepada Allah agar memberikan bagian Abu Ubaidah kepadanya. {cite:al-bidaya-wal-nihaya scan vol. 4 p. 81}. Ia wafat pada tahun kedelapan belas pada usia lima puluh delapan tahun. {cite:siyar-alam-nubala scan vol. 2 p. 100}. Dalam riwayat Urwah ibn Ruwaym, waktu yang telah ditentukan baginya tiba di Fahl, dekat Baysan. {cite:siyar-alam-nubala scan vol. 1 p. 347}, dan Mu’adh berdoa untuknya, lalu Mu’adh, Amr ibn al-Aas, dan al-Dahhak ibn Qais turun ke kuburnya, dan kuburnya berada di Yordania {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 828}."
