id: event/ali-ibn-muhammad-writes-to-al-hadi-with-a-poem-on-the-gathering-294
class: event
kind: other
label:
  ar: "علي بن محمد يكتب إلى الهادي بقصيدة عن الاجتماع، سنة 294-295هـ، ص348-350"
  en: "Ali ibn Muhammad writes to al-Hadi with a poem on the gathering of the tribes, 294 to 295 AH, pp. 348 to 350"
  ur: "علی بن محمد کا ہادی کو اجتماع کے بارے میں خط اور نظم لکھنا، 294 تا 295ھ، ص348 تا 350"
  es: "Ali ibn Muhammad escribe a al-Hadi un poema sobre la reunión de las tribus, 294 a 295 AH, pp. 348 a 350."
  fr: "Ali ibn Muhammad écrit à al-Hadi avec un poème sur le rassemblement des tribus, 294 à 295 AH, pp. 348 à 350"
  tr: "Ali ibn Muhammed, Hicri 294-295 yılında, Hadid el-Hadi'ye bu buluşma hakkında bir şiir yazmıştır (s. 348-350)."
  id: "Ali bin Muhammad menulis puisi kepada al-Hadi tentang pertemuan tersebut, pada tahun 294-295 H, hlm. 348-350."
summary:
  ar: "كتب علي بن محمد إلى الهادي بخبر اجتماع بني الحارث ويأم، وكتب في أسفل كتابه قصيدة يستعجله فيها إلى نجران قبل أن يستحكم أمر القوم، ويعدّد القبائل المجتمعة عليهم والقبائل الناصرة لأهل البيت."
  en: "Ali ibn Muhammad wrote to al-Hadi about the gathering of Banu al-Harith and Ya'am, and added at the foot of the letter a poem urging al-Hadi to come to Najran before the rebels could consolidate. It names the tribes gathered against them and the tribes that support the family of the Prophet."
  ur: "علی بن محمد نے ہادی کو بنو الحارث اور یأم کے اجتماع کی خبر لکھی اور خط کے آخر میں ایک نظم شامل کی جس میں ہادی سے جلد نجران پہنچنے کی درخواست ہے، قبل اس کے کہ باغی مضبوط ہو جائیں۔ نظم میں ان قبیلوں کے نام ہیں جو ان کے خلاف جمع ہوئے اور جو اہلِ بیت کی مدد کرتے ہیں۔"
  es: "Ali ibn Muhammad escribió a al-Hadi sobre la reunión de Banu al-Harith y Ya'am, y añadió al pie de la carta un poema en el que le instaba a ir a Najrán antes de que los rebeldes se consolidaran. En él se mencionan las tribus que se habían reunido contra ellos y las que apoyaban a la familia del Profeta."
  fr: "Ali ibn Muhammad écrivit à al-Hadi au sujet du rassemblement des Banu al-Harith et des Ya'am, et ajouta à la fin de sa lettre un poème exhortant al-Hadi à venir à Najran avant que les rebelles ne puissent se regrouper. Ce poème nomme les tribus qui se sont rassemblées contre eux et celles qui soutiennent la famille du Prophète."
  tr: "Ali bin Muhammed, Beni el-Harith ve Yaam kabilelerinin buluşması hakkında El-Hadi'ye bir mektup yazmış ve mektubunun altına, halkın meselesi çözülmeden önce Necran'a gitmesi için onu teşvik eden bir şiir eklemiş; ayrıca onlara karşı toplanan kabileleri ve Hanedan halkını destekleyen kabileleri sıralamıştır."
  id: "Ali bin Muhammad menulis surat kepada Al-Hadi tentang pertemuan Bani Al-Harith dan Ya'am, dan di bagian bawah suratnya ia menulis sebuah puisi yang isinya mendesak Al-Hadi untuk pergi ke Najran sebelum masalah rakyat terselesaikan, dan ia menyebutkan suku-suku yang telah bersatu melawan mereka dan suku-suku yang mendukung keluarga tersebut."
