id: event/prophet-aisha-race-return
class: event
kind: competition
label:
  ar: سبقة النبي وعائشة الثانية — «هذه بتلك»
  en: The Prophet's second race with Aisha — «this is for that one»
  ur: نبی اور عائشہ کی دوسری دوڑ — «یہ اس کا بدلہ»
  es: "La segunda carrera del Profeta con Aisha: «esto es para aquella»."
  fr: "La deuxième course du Prophète avec Aïcha — « ceci est pour celle-là »"
summary:
  ar: 'حين حملت اللحم سابقها النبي فسبقها، وقال: «هذه بتلك السبقة» — تتمة الحديث عند أبي داود وأحمد {cite:sunan-abi-dawud}.'
  en: When she had grown heavier the Prophet raced her and won, saying «This is for that race» — the rest of her report in
    Abu Dawud and Ahmad {cite:sunan-abi-dawud}.
  ur: جب ان کا وزن بڑھ گیا تو نبی نے دوڑ میں انہیں مات دی اور فرمایا «یہ اس دوڑ کا بدلہ ہے» — روایت کا باقی حصہ ابو داود اور
    احمد میں {cite:sunan-abi-dawud}۔
  es: "Cuando ella hubo aumentado de peso, el Profeta corrió con ella y ganó, diciendo «Esto es para esa carrera» — el resto de su relato en Abu Dawud y Ahmad {cite:sunan-abi-dawud}."
  fr: "Lorsqu'elle eut pris du poids, le Prophète la défia à la course et la gagna, disant: « Ceci est pour cette course » — le reste de son récit dans Abu Dawud et Ahmad {cite:sunan-abi-dawud}."
