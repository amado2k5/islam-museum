id: event/yaqut-egypt-624
class: event
kind: other
label:
  ar: "رحلة ياقوت الثانية إلى مصر ودمشق بالتجارة، ٦٢٤هـ/١٢٢٧م"
  en: "Yaqut's second journey to Egypt and Damascus for trade, 624/1227"
  ur: "یاقوت کا دوسرا تجارتی سفر مصر اور دمشق، 624ھ/1227ء"
  es: "Segundo viaje de Yaqut a Egipto y Damasco con fines comerciales, 624/1227"
  fr: "Deuxième voyage de Yaqut en Égypte et à Damas pour le commerce, 624/1227"
  tr: "Yaqut'un ticaret amacıyla Mısır ve Şam'a yaptığı ikinci yolculuk, Hicri 624/Miladi 1227"
  id: "Perjalanan kedua Yaqut ke Mesir dan Damaskus untuk berdagang, 624 H/1227 M"
summary:
  ar: "تمكّن ياقوت في ظل رعاية القفطي بحلب من تجميع مال وفير، فسافر ببضاعة من الخام إلى مصر وعاد منها ببضاعة أخرى ربح منها {cite:mawsuat-a3lam-ulama-adaba p. 278}. وهي رحلته الثانية حلب–مصر–دمشق، سنة ٦٢٤هـ/١٢٢٧م {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}."
  en: "Under al-Qifti's patronage at Aleppo Yaqut amassed considerable funds, and travelled to Egypt with a cargo of raw cloth, returning with another cargo that brought him profit {cite:mawsuat-a3lam-ulama-adaba p. 278}. This was his second Aleppo–Egypt–Damascus journey, in 624/1227 {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}."
  ur: "حلب میں قفطی کی سرپرستی میں یاقوت نے کافی مال جمع کیا اور کچے کپڑے کی بضاعت لے کر مصر گیا، اور وہاں سے دوسری بضاعت لا کر نفع کمایا {cite:mawsuat-a3lam-ulama-adaba p. 278}. یہ اس کا دوسرا حلب–مصر–دمشق سفر تھا، 624ھ/1227ء {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}۔"
  es: "Bajo el patrocinio de al-Qifti en Alepo, Yaqut amasó considerables fondos y viajó a Egipto con un cargamento de tela cruda, regresando con otro cargamento que le reportó ganancias {cite:mawsuat-a3lam-ulama-adaba p. 278}. Este fue su segundo viaje entre Alepo, Egipto y Damasco, en 624/1227 {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}."
  fr: "Sous le patronage d'al-Qifti à Alep, Yaqut amassa des fonds considérables et se rendit en Égypte avec une cargaison de tissu brut, d'où il revint avec une autre cargaison qui lui rapporta des bénéfices (voir: Mawsuat-a3lam-ulama-adaba, p. 278). Il s'agissait de son deuxième voyage entre Alep, l'Égypte et Damas, en 624/1227 (voir: Encyclopaedia-of-Islam-2, vol. 11, p. 265)."
  tr: "Halep'te el-Kifti'nin himayesi altında Yaqut, önemli bir servet biriktirmeyi başardı. Bir hammadde sevkiyatıyla Mısır'a gitti ve oradan da kâr elde ettiği başka bir sevkiyatla geri döndü {cite:mawsuat-a3lam-ulama-adaba s. 278}. Bu, onun ikinci yolculuğuydu: Halep-Mısır-Şam, Hicri 624/Miladi 1227 yılında {cite:encyclopaedia-of-islam-2 cilt 11 s. 265}."
  id: "Di bawah perlindungan al-Qifti di Aleppo, Yaqut mampu mengumpulkan kekayaan yang cukup besar. Ia melakukan perjalanan dengan kiriman bahan mentah ke Mesir dan kembali dengan kiriman lain yang darinya ia memperoleh keuntungan {cite:mawsuat-a3lam-ulama-adaba p. 278}. Ini adalah perjalanan keduanya: Aleppo-Mesir-Damaskus, pada tahun 624 H/1227 M {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}."
