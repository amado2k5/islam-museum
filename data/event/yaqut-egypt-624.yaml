label:
  ar: "رحلة ياقوت الثانية إلى مصر ودمشق بالتجارة، ٦٢٤هـ/١٢٢٧م"
  en: "Yaqut's second journey to Egypt and Damascus for trade, 624/1227"
  ur: "یاقوت کا دوسرا تجارتی سفر مصر اور دمشق، 624ھ/1227ء"
summary:
  ar: "تمكّن ياقوت في ظل رعاية القفطي بحلب من تجميع مال وفير، فسافر ببضاعة من الخام إلى مصر وعاد منها ببضاعة أخرى ربح منها {cite:mawsuat-a3lam-ulama-adaba p. 278}. وهي رحلته الثانية حلب–مصر–دمشق، سنة ٦٢٤هـ/١٢٢٧م {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}."
  en: "Under al-Qifti's patronage at Aleppo Yaqut amassed considerable funds, and travelled to Egypt with a cargo of raw cloth, returning with another cargo that brought him profit {cite:mawsuat-a3lam-ulama-adaba p. 278}. This was his second Aleppo–Egypt–Damascus journey, in 624/1227 {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}."
  ur: "حلب میں قفطی کی سرپرستی میں یاقوت نے کافی مال جمع کیا اور کچے کپڑے کی بضاعت لے کر مصر گیا، اور وہاں سے دوسری بضاعت لا کر نفع کمایا {cite:mawsuat-a3lam-ulama-adaba p. 278}. یہ اس کا دوسرا حلب–مصر–دمشق سفر تھا، 624ھ/1227ء {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}۔"
