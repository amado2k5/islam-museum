id: event/abu-kalijar-enters-baghdad-436
class: event
kind: other
label: { ar: "دخول أبي كاليجار بغداد وضرب العلبل", en: "Abu Kalijar Enters Baghdad and the Kettledrums Are Beaten for Him", fr: "Abu Kalijar entre à Bagdad et les timbales sont frappées en son honneur", es: "Abu Kalijar entra en Bagdad y los timbales suenan en su honor.", ur: "ابو کالیجر بغداد میں داخل ہوا اور اس کے لیے کیٹل ڈرمز مارے گئے۔", tr: "Ebu Kalijar Bağdat'a girdi ve düşmana saldırdı.", id: "Abu Kalijar memasuki Baghdad dan menyerang musuh." }
summary:
  ar: "في سنة ست وثلاثين وأربعمائة دخل السلطان أبو كاليجار بغداد وضُربت له العلبل في أوقات الصلوات الخمس، ولم تُضرب لأحد قبله إلا ثلاث مرات {cite:shadharat-dhahab p. 256}. وعند ابن الجوزي أنه دخلها يوم الجمعة ثالث عشر صفر ٤٣٦ واتّجه إلى دار الملكة، وكان أول من ضُربت له العلبل في أوقات الصلوات الخمس ولم يُضرب لأحد قبله إلا لعضد الدولة ثلاث مرات، وخلع في المحرم على ابن فستنجس وأجلسه في موضع الوزارة، وقطعت العامة الطريق يوم الجمعة على فقير في السوق فوعدهم أبو كليجار على لسان أمين الأمانة أبا القاسم القزويني بالإحسان إلى الفقراء {cite:muntazam-ibn-al-jawzi j.8 p.461, 463}."
  en: "In 436 Sultan Abu Kalijar entered Baghdad, and the kettle-drums were beaten for him at the five prayer-times — an honour struck for no one before him except three times {cite:shadharat-dhahab p. 256}."
  fr: "En 436, le sultan Abu Kalijar entra à Bagdad et les timbales furent frappées en son honneur aux cinq heures de prière — honneur qui n’avait été accordé avant lui que trois fois {cite:shadharat-dhahab p. 256}."
  es: "En 436, el sultán Abu Kalijar entró en Bagdad, y los timbales fueron tocados en su honor en las cinco horas de oración, un honor que no se le había concedido a nadie antes que a él, excepto tres veces {cite:shadharat-dhahab p. 256}."
  ur: "436 میں سلطان ابو کلیجار بغداد میں داخل ہوا، اور پانچوں نمازوں کے وقت اس کے لیے کیتلی کے ڈرم پیٹے گئے - یہ اعزاز اس سے پہلے کسی کے لیے نہیں تھا سوائے تین بار کے۔ 256}۔"
  tr: "Hicri 436 yılında Sultan Ebu Kalijar Bağdat'a girdi ve beş vakit namaz zamanlarında onun için davullar çalındı. Bu, daha önce sadece üç kez başkası için yapılmıştı {kaynak: Şadharat-Dhaba s. 256}. İbn el-Cevzi'ye göre, Hicri 436 yılının Safer ayının on üçüncü Cuma günü Bağdat'a girdi ve Kraliçe'nin sarayına gitti. Beş vakit namaz zamanlarında onun için davullar çalınan ilk kişiydi ve bu, ondan önce sadece üç kez Adud el-Davla için yapılmıştı. Muharrem ayında İbn Fustancıs'a şeref cübbesi verdi ve onu vezirliğe atadı. Bir Cuma günü, sıradan halk pazarda fakir bir adam için yolu kapatmıştı; bunun üzerine Ebu Kalijar, sekreterliğin sekreteri Ebu el-Kâsim el-Kazvini aracılığıyla onlara fakirlere hayırseverlik yapacağına söz verdi. {cite:muntazam-ibn-al-jawzi j.8 pp. 461, 463}."
  id: "Pada tahun 436 H, Sultan Abu Kalijar memasuki Baghdad, dan genderang ditabuh untuknya pada waktu shalat lima waktu. Hal ini sebelumnya hanya dilakukan tiga kali untuk orang lain {kutip:shadharat-dhahab hlm. 256}. Menurut Ibn al-Jawzi, beliau memasuki kota itu pada hari Jumat, tanggal 13 Safar 436 H, dan pergi ke istana Ratu. Beliau adalah orang pertama yang genderangnya ditabuh untuknya pada waktu shalat lima waktu, dan hal ini sebelumnya hanya dilakukan tiga kali untuk Adud al-Dawla. Pada bulan Muharram, beliau menganugerahkan jubah kehormatan kepada Ibn Fustanjis dan mengangkatnya ke posisi wazir. Pada hari Jumat, rakyat jelata memblokir jalan untuk seorang miskin di pasar, sehingga Abu Kalijar berjanji kepada mereka, melalui sekretaris sekretariat, Abu al-Qasim al-Qazwini, untuk beramal kepada kaum miskin {cite:muntazam-ibn-al-jawzi j.8 pp. 461, 463}."
