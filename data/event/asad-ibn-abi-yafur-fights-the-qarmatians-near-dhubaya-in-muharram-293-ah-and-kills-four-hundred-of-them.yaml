id: "event/asad-ibn-abi-yafur-fights-the-qarmatians-near-dhubaya-in-muharram-293-ah-and-kills-four-hundred-of-them"
class: event
kind: other
label:
  ar: "أسعد بن أبي يعفر يقاتل القرامطة قرب ضبوة في المحرم سنة 293هـ ويقتل منهم أربعمائة، ص390"
  en: "As'ad ibn Abi Ya'fur fights the Qarmatians near Dhubaya in Muharram 293 AH and kills four hundred of them, p. 390"
  ur: "اسعد بن ابی یعفر محرم 293ھ میں ضبوۃ کے قریب قرامطہ سے لڑتا ہے اور ان میں سے چار سو کو قتل کرتا ہے، ص390"
summary:
  ar: "نزل القرامطة بضبوة، فخرج إليهم أسعد بن أبي يعفر فقاتلهم يوم الثلاثاء في المحرم، فقتل منهم أربعمائة رجل، ثم انصرف إلى صنعاء."
  en: "The Qarmatians camped at Dhubaya, and As'ad ibn Abi Ya'fur went out and fought them on a Tuesday in Muharram. He killed four hundred of them and then returned to Sanaa."
  ur: "قرامطہ ضبوۃ میں اترے، اسعد بن ابی یعفر نے محرم میں ایک منگل کو ان سے جنگ کی، ان میں سے چار سو آدمی مارے گئے، پھر وہ صنعاء لوٹ گیا۔"
