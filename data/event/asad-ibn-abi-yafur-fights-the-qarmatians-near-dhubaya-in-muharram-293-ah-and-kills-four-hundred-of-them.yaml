id: "event/asad-ibn-abi-yafur-fights-the-qarmatians-near-dhubaya-in-muharram-293-ah-and-kills-four-hundred-of-them"
class: event
kind: other
label:
  ar: "أسعد بن أبي يعفر يقاتل القرامطة قرب ضبوة في المحرم سنة 293هـ ويقتل منهم أربعمائة، ص390"
  en: "As'ad ibn Abi Ya'fur fights the Qarmatians near Dhubaya in Muharram 293 AH and kills four hundred of them, p. 390"
  ur: "اسعد بن ابی یعفر محرم 293ھ میں ضبوۃ کے قریب قرامطہ سے لڑتا ہے اور ان میں سے چار سو کو قتل کرتا ہے، ص390"
  fr: "As'ad ibn Abi Ya'fur combat les Qarmates près de Dhubaya en Muharram 293 H et en tue quatre cents, p. 390"
  es: "As'ad ibn Abi Ya'fur lucha contra los cármatas cerca de Dhubaya en Muharram 293 AH y mata a cuatrocientos de ellos, pág. 390"
  tr: "As'ad ibn Abi Ya'fur, Hicri 293 yılının Muharrem ayında Dhubwa yakınlarında Karmatilerle savaştı ve onlardan dört yüzünü öldürdü (s. 390)."
  id: "As'ad ibn Abi Ya'fur berperang melawan Qarmatian di dekat Dhubwa pada bulan Muharram tahun 293 H dan membunuh empat ratus dari mereka, hlm. 390"
summary:
  ar: "نزل القرامطة بضبوة، فخرج إليهم أسعد بن أبي يعفر فقاتلهم يوم الثلاثاء في المحرم، فقتل منهم أربعمائة رجل، ثم انصرف إلى صنعاء."
  en: "The Qarmatians camped at Dhubaya, and As'ad ibn Abi Ya'fur went out and fought them on a Tuesday in Muharram. He killed four hundred of them and then returned to Sanaa."
  ur: "قرامطہ ضبوۃ میں اترے، اسعد بن ابی یعفر نے محرم میں ایک منگل کو ان سے جنگ کی، ان میں سے چار سو آدمی مارے گئے، پھر وہ صنعاء لوٹ گیا۔"
  fr: "Les Qarmates campèrent à Dhubaya, et As'ad ibn Abi Ya'fur sortit les combattre un mardi de Muharram. Il en tua quatre cents, puis revint à Sanaa."
  es: "Los cármatas acamparon en Dhubaya, y As'ad ibn Abi Ya'fur salió a combatirlos un martes de Muharram. Mató a cuatrocientos de ellos y luego regresó a Sanaa."
  tr: "Karmatiler Dhubwa'ya saldırdılar, bunun üzerine As'ad ibn Abi Ya'fer onlara gidip Muharrem ayının Salı günü onlarla savaştı ve aralarından dört yüz kişiyi öldürdükten sonra Sana'a'ya döndü."
  id: "Orang-orang Qarmatian menyerbu Dhubwa, maka As’ad ibn Abi Ya’far pergi menemui mereka dan memerangi mereka pada hari Selasa di bulan Muharram, membunuh empat ratus orang dari antara mereka, kemudian ia kembali ke Sana’a."
