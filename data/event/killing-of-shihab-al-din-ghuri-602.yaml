id: event/killing-of-shihab-al-din-ghuri-602
class: event
kind: death
label: { ar: "قتل شهاب الدين الغوري", en: "Killing of Shihab al-Din al-Ghuri", es: "Asesinato de Shihab al-Din al-Ghuri", fr: "Meurtre de Shihab al-Din al-Ghuri", ur: "شہاب الدین الثوری کا قتل", tr: "Şihab el-Din el-Gauri öldürüldü", id: "Shihab al-Din al-Ghauri terbunuh" }
summary:
  ar: "في أول ليلة من شعبان سنة اثنتين وستمائة قتل شهاب الدين أبو المظفر محمد بن سام الغوري ملك غزنة وبعض خراسان بمنزل يقال له دميك وهو عائد من لهاور وقت صلاة العشاء؛ كان سبب قتله أن نفراً من الكوكرية لزموا عسكره عازمين على قتله لما فعل بهم من القتل والأسر والسبي، فلما تفرق عنه أصحابه وبقي وحده في خركاه قتلوا بعض الحرس بباب سرادقه فثار أصحابه وأخلوا مواقفهم فاغتنم الكوكرية غفلتهم فدخلوا عليه وهو في الخركاه فضربوه بالسكاكين اثنتين وعشرين ضربة فقتلوه ووجدوه على مصلاه ساجداً، وقيل إنما قتلته الإسماعيلية لأنهم خافوا خروجه إلى خراسان؛ واجتمع الأمراء عند وزيره مؤيد الملك فتحالفوا على حفظ الخزانة وأجلسوا شهاب الدين وخيطوا جراحه وجعلوه في المحفة والشمسية على حاله في حياته حتى لم ترق محجمة دم، وثار المماليك على فخر الدين الرازي لما قيل إنه أوصل من قتل سيدهم فهرب ونجا، واختلف العسكر فالغورية أميل إلى بهاء الدين سام صاحب باميان ابن أخت شهاب الدين والأتراك إلى غياث الدين محمود أخيه الأكبر، ودفن في التربة بالمدرسة التي أنشأها بغزنة في الثاني والعشرين من شعبان {cite:kamil-ibn-al-athir p. 303-305}."
  en: "On the first night of Sha'ban in 602, Shihab al-Din Abu al-Muzaffar Muhammad ibn Sam al-Ghuri, ruler of Ghazna and part of Khurasan, was killed at a stopping place called Damik as he returned from Lahore, at the time of the evening prayer. The cause was that a group of Khokhars kept to his army, intent on killing him for the slaughter, capture and enslavement they had suffered at his hands. When his companions had scattered from him and he was left alone in his tent, they killed some of the guards at the door of his pavilion; his followers rose up and left their posts, and the Khokhars seized their moment of heedlessness, entered upon him in the tent and struck him with knives twenty-two times, killing him. They found him on his prayer mat, prostrate. It was also said that the Isma'ilis killed him, for they feared his going out to Khurasan. The commanders gathered at his vizier Mu'ayyad al-Mulk and swore oaths to guard the treasury. They seated Shihab al-Din, sewed up his wounds and placed him in the litter and parasol as he had been in life, so that not even a cupping-glass of blood was shed. The Mamluks rose against Fakhr al-Din al-Razi, because it was said he had brought in the men who killed their lord; he fled and escaped. The army divided: the Ghurids leaned toward Baha' al-Din Sam, lord of Bamiyan and son of Shihab al-Din's sister, and the Turks toward Ghiyath al-Din Mahmud, his elder brother. He was buried in the mausoleum of the madrasa he had founded at Ghazna, on the twenty-second of Sha'ban {cite:kamil-ibn-al-athir p. 303-305}."
  es: "En la primera noche de Sha'ban del año 602, Shihab al-Din Abu al-Muzaffar Muhammad ibn Sam al-Ghuri, gobernante de Ghazna y parte de Jorasán, fue asesinado en una parada llamada Damik cuando regresaba de Lahore, a la hora de la oración vespertina. La causa fue que un grupo de khokhars se mantuvo cerca de su ejército, con la intención de matarlo por la matanza, captura y esclavitud que habían sufrido a manos suyas. Cuando sus compañeros se dispersaron y él quedó solo en su tienda, mataron a algunos de los guardias que custodiaban la entrada de su pabellón; sus seguidores se levantaron y abandonaron sus puestos, y los khokhars aprovecharon su descuido para entrar en la tienda y apuñalarlo veintidós veces, causándole la muerte. Lo encontraron postrado sobre su alfombra de oración. También se dice que los ismaelitas lo mataron, pues temían que saliera hacia Jorasán. Los comandantes se reunieron con su visir Mu'ayyad al-Mulk y juraron proteger el tesoro. Acomodaron a Shihab al-Din, le suturaron las heridas y lo colocaron en la litera y la sombrilla, como en vida, de modo que no se derramó ni una gota de sangre. Los mamelucos se alzaron contra Fakhr al-Din al-Razi, pues se decía que había traído a los hombres que mataron a su señor; huyó y escapó. El ejército se dividió: los gúridas se inclinaron hacia Baha' al-Din Sam, señor de Bamiyán e hijo de la hermana de Shihab al-Din, y los turcos hacia Ghiyath al-Din Mahmud, su hermano mayor. Fue enterrado en el mausoleo de la madrasa que había fundado en Ghazna, el veintidós de Sha'ban {cite:kamil-ibn-al-athir p. 303-305}."
  fr: "La première nuit de Sha'ban 602, Shihab al-Din Abu al-Muzaffar Muhammad ibn Sam al-Ghuri, souverain de Ghazna et d'une partie du Khorasan, fut assassiné à Damik, un lieu de halte, sur son retour de Lahore, à l'heure de la prière du soir. Un groupe de Khokhars s'était attaché à son armée, déterminé à le tuer pour le massacre, la capture et l'esclavage qu'il leur avait infligés. Ses compagnons s'étant dispersés et l'ayant laissé seul dans sa tente, ils tuèrent quelques gardes à l'entrée de son pavillon. Ses hommes se levèrent et abandonnèrent leurs postes, et les Khokhars, profitant de leur inattention, entrèrent dans la tente et le frappèrent vingt-deux fois à coups de couteau, le tuant sur le coup. Ils le trouvèrent prosterné sur son tapis de prière. On raconte aussi que les Ismaéliens l'auraient tué, craignant qu'il ne se rende au Khorasan. Les commandants se réunirent auprès de son vizir Mu'ayyad al-Mulk et prêtèrent serment de protéger le trésor. Ils installèrent Shihab al-Din, recousirent ses blessures et le placèrent sur la litière et sous l'ombrelle comme de son vivant, de sorte qu'aucune goutte de sang ne fut versée. Les Mamelouks se soulevèrent contre Fakhr al-Din al-Razi, car on disait qu'il avait livré les hommes qui avaient tué leur seigneur; il prit la fuite et s'échappa. L'armée se divisa: les Ghourides se rallièrent à Baha' al-Din Sam, seigneur de Bamiyan et fils de la sœur de Shihab al-Din, et les Turcs à Ghiyath al-Din Mahmud, son frère aîné. Il fut enterré dans le mausolée de la madrasa qu'il avait fondée à Ghazni, le vingt-deuxième jour de Sha'ban (voir: Kamil ibn al-Athir, p. 303-305)."
  ur: "602 میں شعبان کی پہلی رات، شہاب الدین ابو المظفر محمد بن سام الثوری، جو غزہ اور خراسان کے ایک حصے کا حکمران تھا، شام کی نماز کے وقت لاہور سے واپس آتے ہوئے دمک نامی ایک جگہ پر مارا گیا۔ اس کا سبب یہ تھا کہ کھوکھروں کا ایک گروہ اس کی فوج کے پاس رکھا ہوا تھا، جو اسے قتل کرنے، پکڑنے اور اس کے ہاتھوں غلام بنانے کے لیے اسے قتل کرنے کا ارادہ رکھتا تھا۔ جب اُس کے ساتھی اُس سے منتشر ہو گئے اور وہ اپنے خیمے میں اکیلا رہ گیا تو اُنہوں نے اُس کے برآمدے کے دروازے پر کچھ محافظوں کو مار ڈالا۔ اس کے پیروکار اٹھے اور اپنی پوسٹیں چھوڑ دیں، اور کھوکھروں نے اپنی لاپرواہی کا فائدہ اٹھاتے ہوئے اس پر خیمے میں گھس کر اس پر 22 بار چھریوں کے وار کیے اور اسے قتل کر دیا۔ انہوں نے اسے اپنی نماز کی چٹائی پر سجدے میں پایا۔ یہ بھی کہا گیا کہ اسماعیلیوں نے اسے قتل کر دیا، کیونکہ وہ اس کے خراسان جانے سے ڈرتے تھے۔ کمانڈر اس کے وزیر معایۃ الملک کے پاس جمع ہوئے اور خزانے کی حفاظت کی قسمیں کھائیں۔ انہوں نے شہاب الدین کو بٹھایا، اس کے زخموں کو سلایا اور اس کو کوڑے اور چھتر میں اس طرح ڈال دیا جیسے وہ زندگی میں رہا تھا، تاکہ خون کا ایک گلاس بھی نہ بہے۔ مملوک فخر الدین الرازی کے خلاف اٹھ کھڑے ہوئے، کیونکہ کہا جاتا تھا کہ وہ اپنے آقا کو قتل کرنے والے آدمیوں کو لایا تھا۔ وہ بھاگ گیا اور فرار ہو گیا. فوج تقسیم ہو گئی: غوریوں کا جھکاؤ بہاء الدین سام کی طرف تھا، جو بامیان کے سردار اور شہاب الدین کی بہن کے بیٹے تھے، اور ترک اس کے بڑے بھائی غیاث الدین محمود کی طرف تھے۔ آپ کو شعبان کی بائیس تاریخ کو غزنہ میں جس مدرسہ کی بنیاد رکھی تھی اس کے مقبرے میں دفن کیا گیا۔ 303-305}۔"
  tr: "602 yılının Şaban ayının ilk gecesinde, Gazne ve Horasan'ın bir kısmının hükümdarı Şihab el-Din Ebu el-Muzaffar Muhammed ibn Sam el-Gavri, akşam namazı vaktinde Lahavur'dan dönerken Damik adlı bir evde öldürüldü. Öldürülmesinin sebebi, Kukarilerden bir grubun, ona karşı işlediği öldürme, esir alma ve köleleştirme suçlarından dolayı onu öldürmek amacıyla çadırına yerleşmiş olmasıydı. Arkadaşları dağılıp çadırında yalnız kalınca, çadırının kapısındaki bazı muhafızları öldürdüler. Arkadaşları telaşlanıp yerlerini terk edince, Kukariler bu dikkatsizlikten faydalanarak çadırına girdiler. Onu yirmi iki kez bıçaklayarak öldürdüler. Onu seccadesinde yatarken buldular. İsmaililerin, Horasan'a gitmesinden korktukları için onu öldürdükleri söylenir. Prensler, veziri Muayyad el-Mulk'un evinde toplandılar ve hazineyi korumak için bir anlaşma yaptılar. Şihab el-Din'i oturttular, yaralarını diktiler ve onu hayattayken olduğu gibi sedyeye ve şemsiyeye yerleştirdiler, böylece tek bir damla kan dökülmedi. Memlükler, efendilerini öldüreni teslim ettiği söylendiği için Fahr el-Din el-Razi'ye karşı ayaklandılar, bu yüzden kaçtı. Ordu farklı görüşlere sahipti; Guriyeler, Bamiyan hükümdarı ve Şihab el-Din'in yeğeni Baha' el-Din Sam'a, Türkler ise ağabeyi Gıyat el-Din Mahmud'a meyilliydi. Şaban ayının yirmi ikincisinde Gazne'de kurduğu okulun türbesine defnedildi. {kaynak: Kamil İbn el-Atir s. 303-305}"
  id: "Pada malam pertama bulan Sya'ban tahun 602, Shihab al-Din Abu al-Muzaffar Muhammad ibn Sam al-Ghawri, raja Ghazna dan sebagian Khorasan, dibunuh di sebuah rumah bernama Damik, ketika ia kembali dari Lahavur pada waktu shalat Maghrib. Alasan pembunuhannya adalah karena sekelompok orang Kukar telah menetap di perkemahannya, bermaksud membunuhnya karena apa yang telah ia lakukan kepada mereka berupa pembunuhan, penangkapan, dan perbudakan. Ketika para sahabatnya berpencar meninggalkannya dan ia tinggal sendirian di tendanya, mereka membunuh beberapa penjaga di pintu paviliunnya. Para sahabatnya menjadi gelisah dan meninggalkan posisi mereka, sehingga orang-orang Kukar memanfaatkan kelalaian mereka dan menyerangnya saat ia berada di tendanya. Mereka menusuknya dengan pisau sebanyak dua puluh dua kali dan membunuhnya. Mereka menemukannya sedang sujud di atas sajadahnya. Dikatakan bahwa orang-orang Ismaili membunuhnya karena mereka takut ia akan pergi ke Khorasan. Para pangeran berkumpul di rumah menterinya, Mu'ayyad al-Mulk, dan mereka membuat perjanjian untuk melindungi perbendaharaan. Mereka mendudukkan Shihab al-Din, menjahit lukanya, dan menempatkannya di tandu dan payung seperti saat ia masih hidup, sehingga tidak setetes darah pun tertumpah. Kaum Mamluk memberontak terhadap Fakhr al-Din al-Razi karena dikatakan bahwa ia telah menyerahkan orang yang membunuh tuan mereka, sehingga ia melarikan diri. Pasukan terpecah, dengan kaum Ghuriyya condong kepada Baha' al-Din Sam, penguasa Bamiyan dan keponakan Shihab al-Din, dan kaum Turki condong kepada Ghiyath al-Din Mahmud, kakak laki-lakinya. Ia dimakamkan di makam sekolah yang didirikannya di Ghazna pada tanggal dua puluh dua Sya'ban. {cite:kamil-ibn-al-athir hlm. 303-305}"
