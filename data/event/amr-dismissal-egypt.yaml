label: { ar: "عزل عمرو بن العاص وتولية ابن أبي سرح", en: "Amr's Dismissal and Ibn Abi Sarh's Sole Charge of Egypt", es: "La destitución de Amr y la única responsabilidad de Ibn Abi Sarh en Egipto.", fr: "Le renvoi d'Amr et la nomination d'Ibn Abi Sarh comme seul responsable de l'Égypte", ur: "عمرو کی برطرفی اور ابن ابی سرح کا مصر کا واحد چارج", tr: "Amr ibn al-As'ın görevden alınması ve İbn Abi Sarh'ın atanması", id: "Pemecatan Amr ibn al-As dan pengangkatan Ibn Abi Sarh" }
summary:
  ar: "عند البلاذري: لما ولّى عمرو وردان مولاه الإسكندرية ورجع إلى الفسطاط لم يلبث إلا قليلاً حتى أتاه عزله فولّى عثمان بعده عبد الله بن سعد — وكان أخا عثمان من الرضاعة — وكانت ولايته في سنة خمس وعشرين؛ ويُقال كان عبد الله على خراج مصر من قبل فجرى بينه وبين عمرو كلام فكتب يشكوه فعزله عثمان وجمع العملين له وكتب يعلمه أن الإسكندرية فتحت مرة عنوة وانتقضت مرتين ويأمره أن يلزمها رابطة لا تفارقها وأن يدرّ عليهم الأرزاق ويعقب بينهم في كل ستة أشهر؛ وفي رواية ثالثة سأل أهل مصر عثمان حين نزلت الروم الإسكندرية أن يقرّ عمراً حتى يفرغ من قتالهم لأن له معرفة بالحرب وهيبة في أنفس العدو ففعل حتى هزمهم ثم أراد عثمان أن يجعل عمراً على الحرب وعبد الله على الخراج فأبى ذلك عمرو وقال أنا كماسك قرني البقرة والأمير يحلبها فولّى عثمان ابن سعد مصر. وأقامت الحبش من البيما بعد فتح مصر يقاتلون سبع سنين ما يقدر عليهم لا يفجرون من المياه في الغياض."
  en: "In al-Baladhuri: when Amr set his mawla Wardan over Alexandria and returned to al-Fustat, his dismissal came shortly after — Uthman appointing Abdallah ibn Sa'd, his milk-brother, in year 25; or, some say, Abdallah already held Egypt's kharaj and a quarrel ran between him and Amr, so on his complaint Uthman dismissed Amr, joined both offices to Abdallah, and wrote telling him Alexandria had been opened once by force and had twice revolted — ordering a ribat that never leaves it, provisions dealt out to them, and rotation every six months; in a third account, when the Romans descended on Alexandria Egypt's people begged Uthman to keep Amr until the fighting ended, for his war-knowledge and dread in the enemy's souls — he did till they were routed — then Uthman wished to put Amr over the war and Abdallah over the kharaj, which Amr refused saying 'I am like one holding the cow's horns while the amir milks her', so Uthman gave Ibn Sa'd Egypt. And the Abyssinians of al-Bayma kept fighting seven years after Egypt's conquest, uncatchable, never stirring from the waters amid the thickets."
  es: "En al-Baladhuri: cuando Amr puso a su mawla Wardan al frente de Alejandría y regresó a al-Fustat, su destitución llegó poco después: Uthman nombró a Abdallah ibn Sa'd, su hermano de leche, en el año 25; o, algunos dicen, Abdallah ya poseía el kharaj de Egipto y se produjo una disputa entre él y Amr, por lo que, tras su queja, Uthman destituyó a Amr, unió ambos cargos a Abdallah y le escribió diciéndole que Alejandría había sido abierta una vez por la fuerza y se había rebelado dos veces, ordenando un ribat que nunca la abandonara, provisiones para ellos y rotación cada seis meses; En un tercer relato, cuando los romanos llegaron a Alejandría, el pueblo egipcio suplicó a Uthman que mantuviera a Amr hasta que terminaran los combates, debido a su conocimiento de la guerra y el temor que infundía en el enemigo. Amr permaneció hasta que fueron derrotados. Entonces Uthman quiso poner a Amr al mando de la guerra y a Abdallah al frente del kharaj, pero Amr se negó diciendo: «Soy como quien sujeta los cuernos de la vaca mientras el emir la ordeña». Así pues, Uthman le dio Egipto a Ibn Sa'd. Y los abisinios de al-Bayma siguieron luchando durante siete años después de la conquista de Egipto, inalcanzables, sin moverse jamás de las aguas entre la maleza."
  fr: "Dans al-Baladhuri: lorsqu'Amr confia Alexandrie à son mawla Wardan et retourna à al-Fustat, son renvoi survint peu après — Uthman nommant Abdallah ibn Sa'd, son frère de lait, en l'an 25; ou, selon certains, Abdallah détenait déjà le kharaj d'Égypte et une querelle éclata entre lui et Amr, si bien que sur sa plainte, Uthman destitua Amr, confia les deux charges à Abdallah et lui écrivit pour lui dire qu'Alexandrie avait été ouverte une fois par la force et s'était révoltée deux fois — ordonnant un ribat permanent, des provisions distribuées à ses membres et une rotation tous les six mois; Dans un troisième récit, lorsque les Romains déferlèrent sur Alexandrie, les Égyptiens supplièrent Uthman de garder Amr jusqu'à la fin des combats, en raison de son expérience militaire et de la crainte qu'il inspirait à l'ennemi. Il le fit jusqu'à leur déroute. Uthman voulut alors confier la guerre à Amr et le kharaj à Abdallah, ce qu'Amr refusa, déclarant: « Je suis comme celui qui tient les cornes de la vache pendant que l'émir la trait. » Uthman confia donc l'Égypte à Ibn Sa'd. Et les Abyssiniens d'al-Bayma continuèrent le combat pendant sept ans après la conquête de l'Égypte, insaisissables, demeurant cachés dans les eaux au milieu des fourrés."
  ur: "البلادوری میں ہے: جب عمرو نے اپنے مولا وردان کو اسکندریہ پر مقرر کیا اور الفستات واپس آیا تو اس کی برطرفی جلد ہی ہوئی - عثمان نے 25 میں اپنے دودھ کے بھائی عبداللہ ابن سعد کو مقرر کیا؛ یا بعض کہتے ہیں کہ عبداللہ کے پاس پہلے ہی مصر کا خراج تھا اور اس کے اور عمرو کے درمیان جھگڑا ہوا، چنانچہ اس کی شکایت پر عثمان نے عمرو کو برطرف کر دیا، عبداللہ کے پاس دونوں دفتر شامل ہو گئے، اور اسے لکھا کہ اسکندریہ کو ایک بار زبردستی کھولا گیا اور دو بار بغاوت کر دی گئی، رباط کا حکم دینا جو اسے کبھی نہیں چھوڑتا، ہر چھ ماہ کی رعایت اور چھ ماہ کی سزا کا حکم۔ تیسرے بیان میں جب رومی اسکندریہ پر اترے تو مصر کے لوگوں نے عثمان سے التجا کی کہ وہ عمرو کو لڑائی کے خاتمے تک اپنے پاس رکھیں، کیونکہ اس کی جنگ کے علم اور دشمن کی روحوں میں خوف تھا - اس نے اس وقت تک کیا جب تک کہ وہ شکست نہ دے دیں - پھر عثمان نے عمرو کو جنگ پر اور عبداللہ کو خراج پر ڈالنے کی خواہش کی، جسے عمرو نے انکار کر دیا، جب کہ عمرو نے یہ کہہ کر انکار کر دیا کہ \"میں نے دودھ کو پکڑا ہوا تھا\"۔ اس کا، تو عثمان نے ابن سعد کو مصر دیا۔ اور البیما کے حبشی مصر کی فتح کے سات سال بعد بھی لڑتے رہے، ناقابلِ گرفت، جھاڑیوں کے درمیان پانی سے کبھی ہلچل نہیں پائی۔"
  tr: "El-Baladhuri'ye göre: Amr, azat ettiği kölesi Wardan'ı İskenderiye valisi olarak atadıktan sonra Fustat'a döndüğünde, kısa süre sonra görevden alındı. Bunun üzerine Osman, Hicri 25 yılında onun yerine, Osman'ın üvey kardeşi Abdullah ibn Saad'ı atadı. Abdullah'ın daha önce Mısır hazinesinden sorumlu olduğu ve Amr ile arasında bir anlaşmazlık çıktığı söylenir. Abdullah, Amr'dan şikayet etmek için bir mektup yazdı, bunun üzerine Osman onu görevden aldı ve iki görevi birleştirdi. Ona İskenderiye'nin bir kez zorla ele geçirildiğini ve ardından iki kez isyan ettiğini bildiren bir mektup yazdı ve orada sürekli olarak bulunmasını, erzak akışını sağlamasını ve altı ayda bir aralarında dağıtımı değiştirmesini emretti. Üçüncü bir rivayete göre, Romalılar İskenderiye'yi işgal ettiğinde, Mısır halkı Osman'dan, Amr'ın savaş tecrübesi olduğu ve düşmandan saygı gördüğü için, savaş bitene kadar onun yönetiminde kalmasına izin vermesini istedi. Osman kabul etti ve Amr onları yendi. Osman, Amr'ı ordunun başına, Abdullah'ı da hazinenin başına atamak istedi, ancak Amr, \"Ben, prensin ineği sağdığı sırada ineğin boynuzlarını tutan kişi gibiyim\" diyerek reddetti. Bunun üzerine Osman, İbn Saad'ı Mısır valisi olarak atadı. Mısır'ın fethinden sonra Bima'nın Habeşlileri yedi yıl boyunca savaştılar, ancak onları alt edemediler ve ormanlardan su bile çekmeyi başaramadılar."
  id: "Menurut al-Baladhuri: Ketika Amr mengangkat Wardan, budak yang telah dibebaskannya, sebagai gubernur Alexandria dan kembali ke Fustat, ia segera dipecat. Utsman kemudian mengangkat Abdullah ibn Saad—yang merupakan saudara angkat Utsman—sebagai penggantinya pada tahun 25 Hijriah. Dikatakan bahwa Abdullah sebelumnya bertanggung jawab atas perbendaharaan Mesir, dan terjadi perselisihan antara dia dan Amr. Abdullah menulis surat untuk mengeluh tentang Amr, sehingga Utsman memecatnya dan menggabungkan kedua posisi tersebut untuknya. Ia menulis surat kepadanya yang memberitahukan bahwa Alexandria telah ditaklukkan sekali dengan kekerasan dan kemudian memberontak dua kali, dan memerintahkannya untuk selalu hadir di sana, memastikan kelancaran perbekalan dan mendistribusikannya secara bergantian setiap enam bulan. Dalam catatan ketiga, penduduk Mesir meminta Utsman, ketika Romawi menyerbu Alexandria, untuk mengizinkan Amr tetap bertanggung jawab sampai ia selesai melawan mereka, karena ia berpengalaman dalam peperangan dan dihormati oleh musuh. Utsman setuju, dan Amr mengalahkan mereka. Kemudian Utsman ingin menunjuk Amr sebagai penanggung jawab militer dan Abdullah sebagai penanggung jawab perbendaharaan, tetapi Amr menolak, dengan mengatakan, \"Aku seperti orang yang memegang tanduk sapi sementara pangeran memerah susunya.\" Maka Utsman menunjuk Ibn Saad sebagai gubernur Mesir. Orang-orang Abyssinia dari Bima tetap tinggal setelah penaklukan Mesir, berperang selama tujuh tahun, tidak mampu menaklukkan mereka, dan mereka bahkan tidak berhasil mengambil air dari hutan."
