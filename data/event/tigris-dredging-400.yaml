summary:
  ar: "في ربيع الأول سنة أربعمائة نقص الماء في دجلة نقصاناً فاحشاً لم يُعهد مثله وظهرت فيها جزائر لم تكن قبل، وامتنع سير السفن فيها من أوانا والراشدية من أعالي دجلة، فأُنفذ من كرى هذا الموضع، وكان كرى دجلة مما استظرف وعُجب منه لأنه لم تُكر دجلة قط إلا في هذه السنة {cite:muntazam-ibn-al-jawzi j.7 p.245}."
  en: "In Rabi' I 400 the Tigris fell to an extraordinary low, such as had never been known: islands appeared in it that had not been there before, and boats were stopped from sailing from Anah and al-Rashidiyya on the upper Tigris, so dredging was carried out at this spot. The dredging of the Tigris was remarked and marvelled at, for the river had never been dredged before except in this year. {cite:muntazam-ibn-al-jawzi j.7 p.245}"
