label: { ar: "نقصان ماء دجلة وكريه سنة أربعمائة", en: "Low Water and Dredging of the Tigris in 400 AH", es: "Bajo nivel del agua y dragado del Tigris en el año 400 d. C.", fr: "Basses eaux et dragage du Tigre en 400 AH", ur: "400 ہجری میں دجلہ کا کم پانی اور نکاسی" }
summary:
  ar: "في ربيع الأول سنة أربعمائة نقص الماء في دجلة نقصاناً فاحشاً لم يُعهد مثله وظهرت فيها جزائر لم تكن قبل، وامتنع سير السفن فيها من أوانا والراشدية من أعالي دجلة، فأُنفذ من كرى هذا الموضع، وكان كرى دجلة مما استظرف وعُجب منه لأنه لم تُكر دجلة قط إلا في هذه السنة {cite:muntazam-ibn-al-jawzi j.7 p.245}."
  en: "In Rabi' I 400 the Tigris fell to an extraordinary low, such as had never been known: islands appeared in it that had not been there before, and boats were stopped from sailing from Anah and al-Rashidiyya on the upper Tigris, so dredging was carried out at this spot. The dredging of the Tigris was remarked and marvelled at, for the river had never been dredged before except in this year. {cite:muntazam-ibn-al-jawzi j.7 p.245}"
  es: "En Rabi' I del año 400, el Tigris descendió a un nivel extraordinariamente bajo, como nunca antes se había visto: aparecieron islas que no existían antes, y se prohibió la navegación desde Anah y al-Rashidiyya, en el curso superior del Tigris, por lo que se llevaron a cabo trabajos de dragado en la zona. El dragado del Tigris causó admiración y asombro, pues el río nunca había sido dragado con anterioridad, salvo en ese año. {cite:muntazam-ibn-al-jawzi j.7 p.245}"
  fr: "En Rabi' 1 400, le Tigre atteignit un niveau exceptionnellement bas, jamais vu auparavant: des îles apparurent, et la navigation fut interrompue à Anah et al-Rashidiyya, sur le cours supérieur du fleuve. Un dragage fut donc entrepris à cet endroit. Ce dragage suscita l'étonnement et l'admiration, car le fleuve n'avait jamais été dragué auparavant. {cite:muntazam-ibn-al-jawzi j.7 p.245}"
  ur: "ربیع الثانی 400 میں دجلہ ایک غیر معمولی نچلی سطح پر گر گیا، جیسا کہ کبھی معلوم نہیں تھا: اس میں ایسے جزیرے نمودار ہوئے جو پہلے نہیں تھے، اور دجلہ کے اوپری حصے پر آنہ اور الراشدیہ سے کشتیوں کو جانے سے روک دیا گیا، اس لیے اس مقام پر کھدائی کی گئی۔ دجلہ کی کھدائی کا ذکر کیا گیا اور اس پر حیرت کا اظہار کیا گیا، کیونکہ اس سال کے علاوہ اس سے پہلے کبھی دریا کی کھدائی نہیں کی گئی تھی۔ {حوالہ:منتظم ابن الجوزی ج7 ص245}"
