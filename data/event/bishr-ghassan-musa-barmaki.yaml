label: { ar: "عصيان بشر بن داود وولاية موسى بن يحيى البرمكي", en: "Bishr ibn Dawud's Revolt and Musa ibn Yahya al-Barmaki's Rule", fr: "La révolte de Bishr ibn Dawud et le gouvernement de Musa ibn Yahya al-Barmaki", es: "La revuelta de Bishr ibn Dawud y el gobierno de Musa ibn Yahya al-Barmaki" }
summary:
  ar: "لم يزل أمر ثغر السند مستقيماً حتى وليه بشر بن داود في خلافة المأمون فعصى وخالف فوجه إليه غسان بن عباد وهو رجل من أهل سواد الكوفة فخرج بشر إليه في الأمان وورد به مدينة السلام وخلف غسان على الثغر موسى بن يحيى بن خالد بن برمك فقتل بالة ملك الشرقي وقد بذل له خمس مائة ألف درهم على أن يستبقيه وكان بالة هذا التوى على غسان وكتب إليه في حضرة عسكره فيمن حضره من الملوك فأبى ذلك وأثر موسى أثراً حسناً ومات سنة ٢١٥ واستخلف ابنه عمران بن موسى."
  en: "Sind ran smooth till Bishr ibn Dawud rebelled under al-Ma'mun; Ghassan ibn Abbad of Kufa's sawad drew him out in aman and carried him to Baghdad, then left Musa ibn Yahya al-Barmaki over the thaghr — who slew Bala king of al-Sharqi despite his offered five hundred thousand for life, Bala having once courted Ghassan before the assembled kings. Musa ruled well and died in 215h; his son Imran succeeded."
  fr: "Le Sind fut paisible jusqu'à ce que Bishr ibn Dawud se révolte sous al-Ma'mun ; Ghassan ibn Abbad, du sawad de Koufa, le fit sortir sous aman et l'emmena à Bagdad, puis laissa Musa ibn Yahya al-Barmaki à la tête de la frontière ; celui-ci tua Bala, roi d'al-Sharqi, malgré les cinq cent mille qu'il offrait pour sa vie, Bala ayant jadis tenu tête à Ghassan devant les rois rassemblés. Musa gouverna bien et mourut en 215 H ; son fils Imran lui succéda."
  es: "Sind transcurrió sin problemas hasta que Bishr ibn Dawud se rebeló bajo el mando de al-Ma'mun. Ghassan ibn Abbad, del reino de Kufa, lo sacó en apuros y lo llevó a Bagdad, dejando a Musa ibn Yahya al-Barmaki al frente del Thaghr. Musa asesinó a Bala, rey de al-Sharqi, a pesar de que este le ofreció quinientos mil por su vida, pues Bala había cortejado a Ghassan ante los reyes reunidos. Musa gobernó con sabiduría y murió en el año 215 de la Hégira; su hijo Imran le sucedió en el trono."
