label: { ar: "عصيان بشر بن داود وولاية موسى بن يحيى البرمكي", en: "Bishr ibn Dawud's Revolt and Musa ibn Yahya al-Barmaki's Rule" }
summary:
  ar: "لم يزل أمر ثغر السند مستقيماً حتى وليه بشر بن داود في خلافة المأمون فعصى وخالف فوجه إليه غسان بن عباد وهو رجل من أهل سواد الكوفة فخرج بشر إليه في الأمان وورد به مدينة السلام وخلف غسان على الثغر موسى بن يحيى بن خالد بن برمك فقتل بالة ملك الشرقي وقد بذل له خمس مائة ألف درهم على أن يستبقيه وكان بالة هذا التوى على غسان وكتب إليه في حضرة عسكره فيمن حضره من الملوك فأبى ذلك وأثر موسى أثراً حسناً ومات سنة ٢١٥ واستخلف ابنه عمران بن موسى."
  en: "Sind ran smooth till Bishr ibn Dawud rebelled under al-Ma'mun; Ghassan ibn Abbad of Kufa's sawad drew him out in aman and carried him to Baghdad, then left Musa ibn Yahya al-Barmaki over the thaghr — who slew Bala king of al-Sharqi despite his offered five hundred thousand for life, Bala having once courted Ghassan before the assembled kings. Musa ruled well and died in 215h; his son Imran succeeded."
