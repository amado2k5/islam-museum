label: { ar: "ذعر اجتماع الكواكب الستة في الميزان سنة 582", en: "The scare over the conjunction of six planets in Libra in 582 AH", fr: "La frayeur suscitée par la conjonction de six planètes dans la Balance en 582 H", es: "El pánico por la conjunción de seis planetas en Libra en el año 582 AH", ur: "582 ہجری میں لیبرا میں چھ سیاروں کے ملاپ پر خوف" }
summary:
  ar: "قال العماد الكاتب: أجمع المنجمون في هذا العام في جميع البلاد على خراب العالم في شعبان عند اجتماع الكواكب الستة في الميزان بعلوفان الريح، وخوفوا بذلك الأعاجم والروم فشرعوا في حفر مغارات ونقلوا إليها الماء والزاد وتهيأوا، فلما كانت الليلة التي عينها المنجمون لم يَهُبَّ زبد عاد «وكنا جلوساً عند السلطان والشموع توقد فلا تتحرك، ولم نر ليلة مثل ركودها» {cite:shadharat-dhahab p. 753}."
  en: "Al-Imad the chancery secretary records: in this year astrologers in every land agreed the world would be ruined in Sha'ban when the six planets conjoined in Libra, portending a wind like the wind of 'Ad. They frightened the Persians and the Byzantines, who dug caverns and stocked them with water and provisions. When the appointed night came — 'we were sitting with the sultan and the candles burned without stirring; we never saw a night so still' {cite:shadharat-dhahab p. 753}."
  fr: "Al-Imad, le secrétaire de chancellerie, rapporte : cette année-là, les astrologues de tous les pays s'accordèrent à dire que le monde serait ruiné en Sha'ban, lorsque les six planètes seraient en conjonction dans la Balance, présageant un vent semblable au vent de 'Ad. Ils effrayèrent les Perses et les Byzantins, qui creusèrent des cavernes et les garnirent d'eau et de provisions. Quand vint la nuit annoncée : « nous étions assis avec le sultan et les bougies brûlaient sans vaciller ; nous n'avions jamais vu une nuit aussi calme » {cite:shadharat-dhahab p. 753}."
  es: "Al-Imad, secretario de la cancillería, relata: «En este año, los astrólogos de todas las tierras coincidieron en que el mundo se arruinaría en Sha'ban, cuando los seis planetas se alinearan en Libra, presagiando un viento como el de Ad. Asustaron a los persas y a los bizantinos, quienes excavaron cavernas y las llenaron de agua y provisiones. Cuando llegó la noche señalada, “estábamos sentados con el sultán y las velas ardían sin moverse; nunca habíamos visto una noche tan silenciosa”» {cita: shadharat-dhahab, pág. 753}."
  ur: "العماد چینسری سکریٹری ریکارڈ کرتا ہے: اس سال ہر ملک کے نجومیوں نے اس بات پر اتفاق کیا کہ شعبان میں دنیا تباہ ہو جائے گی جب چھ سیارے برج میں مل جائیں گے، عاد کی ہوا کی طرح ایک ہوا کا اشارہ ہے۔ انہوں نے فارسیوں اور بازنطینیوں کو خوفزدہ کیا، جنہوں نے غاریں کھود کر ان میں پانی اور سامان کا ذخیرہ کیا۔ جب مقررہ رات آئی - 'ہم سلطان کے ساتھ بیٹھے تھے اور موم بتیاں بغیر ہلائے جل رہی تھیں۔ ہم نے کبھی ایسی رات نہیں دیکھی جو اب بھی ہے۔ 753}۔"
