label: { ar: "إنكار عمر وفاة النبي وكلمة أبي بكر", en: "Umar's denial of the Prophet's death and Abu Bakr's reply", es: "La negación de Umar sobre la muerte del Profeta y la respuesta de Abu Bakr", fr: "Le démenti d'Umar concernant la mort du Prophète et la réponse d'Abou Bakr", ur: "عمر کا نبی کی وفات کا انکار اور ابوبکر کا جواب", tr: "Ömer'in Peygamber'in ölümünü inkar etmesi ve Ebu Bekir'in açıklaması", id: "Penyangkalan Umar atas wafatnya Nabi dan pernyataan Abu Bakar." }
summary:
  ar: "لما توفي النبي قام عمر فقال: إن رجالاً من المنافقين يزعمون أن النبي قد توفي، والله ما مات، ولكنه ذهب إلى ربه كما ذهب موسى فغاب أربعين ليلة، وليرجعنّ فليقطعنّ أيدي رجال وأرجلهم زعموا أنه مات. فأقبل أبو بكر ودخل على النبي وكشف عن وجهه فقبّله وقال: بأبي أنت وأمي، أما الموتة التي كتب الله عليك فقد ذقتها، ثم خرج وقال: من كان يعبد محمداً فإن محمداً قد مات، ومن كان يعبد الله فإن الله حيّ لا يموت، وتلا: وما محمد إلا رسول قد خلت من قبله الرسل. فقال عمر: والله ما هو إلا أن سمعت أبا بكر تلاها فعقرت حتى وقعت إلى الأرض، وعرفت أن النبي قد مات."
  en: "When the Prophet died, Umar stood up and said that some hypocrites claimed he had died, that he had not died but had gone to his Lord as Moses did, and would return to cut off the hands and feet of men who said he was dead. Abu Bakr came, uncovered the Prophet's face and kissed him, then went out and said: whoever worshipped Muhammad, Muhammad has died; whoever worshipped God, God lives and does not die; and recited the verse about the messengers. Umar said that when he heard Abu Bakr recite it he collapsed, knowing the Prophet was dead."
  es: "Cuando el Profeta murió, Umar se levantó y dijo que algunos hipócritas afirmaban que había muerto, que no había muerto sino que había ido a su Señor como Moisés, y que volvería para cortar las manos y los pies de quienes decían que había muerto. Abu Bakr llegó, descubrió el rostro del Profeta y lo besó, luego salió y dijo: «Quien adora a Mahoma, Mahoma ha muerto; quien adora a Dios, Dios vive y no muere»; y recitó el versículo sobre los mensajeros. Umar dijo que cuando escuchó a Abu Bakr recitarlo, se desplomó, sabiendo que el Profeta había muerto."
  fr: "À la mort du Prophète, Umar se leva et déclara que certains hypocrites prétendaient qu'il était mort, mais qu'il était resté auprès de son Seigneur, comme Moïse, et qu'il reviendrait pour couper les mains et les pieds de ceux qui le croyaient mort. Abou Bakr s'approcha, découvrit le visage du Prophète et l'embrassa, puis sortit et dit: « Quiconque adorait Muhammad, Muhammad est mort; quiconque adorait Dieu, Dieu vit et ne meurt pas », et il récita le verset concernant les messagers. Umar raconta qu'en entendant Abou Bakr le réciter, il s'effondra, sachant que le Prophète était mort."
  ur: "جب نبی کی وفات ہوئی تو عمر نے کھڑے ہو کر کہا کہ کچھ منافقوں نے دعویٰ کیا کہ میں مر گیا ہوں، وہ نہیں مرے بلکہ اپنے رب کے پاس گئے تھے جیسا کہ موسیٰ نے کیا تھا، اور ان لوگوں کے ہاتھ پاؤں کاٹ کر واپس آ جائیں گے جنہوں نے کہا کہ وہ مر گیا ہے۔ ابوبکر آئے، آپ کے چہرے کو ننگا کیا اور آپ کو بوسہ دیا، پھر باہر گئے اور فرمایا: جس نے محمد کی عبادت کی، محمد فوت ہو گیا۔ جو کوئی خدا کی عبادت کرتا ہے خدا زندہ ہے اور نہیں مرتا۔ اور رسولوں کے بارے میں آیت کی تلاوت کی۔ عمر کہتے ہیں کہ جب میں نے ابو بکر کو پڑھتے ہوئے سنا تو وہ گر پڑے، یہ جانتے ہوئے کہ نبی فوت ہو چکے ہیں۔"
  tr: "Peygamber vefat ettiğinde Ömer ayağa kalkıp şöyle dedi: “Bazı münafıklar Peygamberin öldüğünü iddia ediyorlar. Allah'a yemin ederim ki, o ölmedi. Aksine, Musa gibi Rabbine gitti ve kırk gece orada kaldı. Geri dönecek ve öldüğünü iddia edenlerin ellerini ve ayaklarını kesecektir.” Sonra Ebu Bekir geldi, Peygamberin yanına girdi, yüzünü açtı, öptü ve şöyle dedi: “Babam ve annem sana feda olsun! Allah'ın senin için takdir ettiği ölüme gelince, onu tattın.” Sonra dışarı çıktı ve şöyle dedi: “Kim Muhammed'e taparsa, Muhammed ölmüştür. Ama kim Allah'a taparsa, Allah diridir ve ölmez.” Sonra da “Muhammed sadece bir elçidir; ondan önce de başka elçiler ölmüştür” diye okudu. Ömer dedi ki: “Allah'a yemin ederim ki, Ebu Bekir'in bunu okuduğunu duyar duymaz dilim tutuldu ve yere düştüm ve Peygamberin öldüğünü anladım.”"
  id: "Ketika Nabi wafat, Umar berdiri dan berkata, “Sebagian orang munafik mengaku bahwa Nabi telah wafat. Demi Allah, beliau belum wafat. Sebaliknya, beliau telah menghadap Tuhannya, seperti Musa, dan beliau pergi selama empat puluh malam. Beliau akan kembali dan memotong tangan dan kaki orang-orang yang mengaku beliau telah wafat.” Kemudian Abu Bakar datang dan menemui Nabi, menyingkap wajahnya, menciumnya, dan berkata, “Semoga ayah dan ibuku dikorbankan untukmu! Adapun kematian yang telah Allah tetapkan untukmu, engkau telah merasakannya.” Kemudian ia keluar dan berkata, “Siapa pun yang menyembah Muhammad, maka Muhammad telah wafat. Tetapi siapa pun yang menyembah Allah, maka Allah hidup dan tidak mati.” Kemudian ia membacakan, “Muhammad hanyalah seorang utusan; utusan-utusan lain telah wafat sebelum dia.” Umar berkata, “Demi Allah, begitu aku mendengar Abu Bakar membacanya, aku langsung terdiam dan jatuh ke tanah, dan aku tahu bahwa Nabi telah wafat.”"
