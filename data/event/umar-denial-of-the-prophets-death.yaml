id: event/umar-denial-of-the-prophets-death
class: event
kind: other
label: { ar: "إنكار عمر وفاة النبي وكلمة أبي بكر", en: "Umar's denial of the Prophet's death and Abu Bakr's reply" }
summary:
  ar: "لما توفي النبي قام عمر فقال: إن رجالاً من المنافقين يزعمون أن النبي قد توفي، والله ما مات، ولكنه ذهب إلى ربه كما ذهب موسى فغاب أربعين ليلة، وليرجعنّ فليقطعنّ أيدي رجال وأرجلهم زعموا أنه مات. فأقبل أبو بكر ودخل على النبي وكشف عن وجهه فقبّله وقال: بأبي أنت وأمي، أما الموتة التي كتب الله عليك فقد ذقتها، ثم خرج وقال: من كان يعبد محمداً فإن محمداً قد مات، ومن كان يعبد الله فإن الله حيّ لا يموت، وتلا: وما محمد إلا رسول قد خلت من قبله الرسل. فقال عمر: والله ما هو إلا أن سمعت أبا بكر تلاها فعقرت حتى وقعت إلى الأرض، وعرفت أن النبي قد مات."
  en: "When the Prophet died, Umar stood up and said that some hypocrites claimed he had died, that he had not died but had gone to his Lord as Moses did, and would return to cut off the hands and feet of men who said he was dead. Abu Bakr came, uncovered the Prophet's face and kissed him, then went out and said: whoever worshipped Muhammad, Muhammad has died; whoever worshipped God, God lives and does not die; and recited the verse about the messengers. Umar said that when he heard Abu Bakr recite it he collapsed, knowing the Prophet was dead."
