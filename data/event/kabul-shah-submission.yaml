id: event/kabul-shah-submission
class: event
kind: other
label: { ar: "إذعان كابل شاه للمأمون", en: "Kabul Shah's Submission to al-Ma'mun", es: "La sumisión del sha de Kabul a al-Ma'mun", fr: "Soumission de Kaboul Shah à al-Ma'mun", ur: "کابل شاہ کا المامون کے سامنے سر تسلیم خم کرنا", tr: "Kabil Şah'ın Memun'a teslimiyeti", id: "Penyerahan Kabul Syah kepada Al-Ma'mun" }
summary:
  ar: "لما استخلف المأمون أغزى السغد وأشروسنة ومن انتقض عليه من أهل فرغانة الجند وألح عليهم بالحروب وبالغارات أيام مقامه بخراسان وبعد ذلك وكان مع تسريته الخيول إليهم يكاتبهم بالدعاء إلى الإسلام والطاعة والترغيب فيها ووجه إلى كابل شاه جيشاً فأدى الإتاوة وأذعن بالطاعة واتصل إليها البريد حتى حمل إليه منها هليلج وصل رطباً."
  en: "Al-Ma'mun loosed the troops on Sughd, Ushrusana and Farghana's breachers with incessant raids and daw'a letters; a force sent to Kabul Shah drew his tribute and submission — and the post-road ran till green myrobalan reached the caliph as fresh fruit."
  es: "Al-Ma'mun lanzó tropas contra los rebeldes de Sughd, Ushrusana y Farghana con incesantes incursiones y cartas de propaganda; una fuerza enviada al Shah de Kabul obtuvo su tributo y sumisión, y el camino postal se extendió hasta que el verde mirobalán llegó al califa como fruta fresca."
  fr: "Al-Ma'mun lâcha ses troupes sur les briseurs de Sughd, d'Ushrusana et de Farghana avec des raids incessants et des lettres de daw'a; une force envoyée à Kaboul Shah obtint son tribut et sa soumission — et la route postale continua jusqu'à ce que le myrobalan vert atteigne le calife comme un fruit frais."
  ur: "المامون نے صغد، عشروسانہ اور فرغانہ کی خلاف ورزی کرنے والوں پر مسلسل چھاپوں اور دعوتی خطوط کے ذریعے فوجوں کو کھو دیا۔ کابل شاہ کی طرف بھیجی گئی ایک فوج نے اپنا خراج تحسین پیش کیا - اور بعد کا راستہ اس وقت تک دوڑتا رہا جب تک سبز میروبلان تازہ پھل بن کر خلیفہ کے پاس پہنچا۔"
  tr: "El-Ma'mun halife olunca, Soğdiana, Uşrusana ve Fergana halkından kendisine isyan edenlere asker gönderdi ve Horasan'da kaldığı süre boyunca ve sonrasında onlara savaşlar ve baskınlar düzenledi. Onlara at gönderirken, onlarla mektuplaşarak onları İslam'a ve itaate çağırdı ve bunu yapmaları için teşvik etti. Kabil Şah'a bir ordu gönderdi; Şah haraç ödedi ve itaat etti, posta ona ulaştı ve oradan getirdiği mirobalan taze olarak ulaştı."
  id: "Ketika Al-Ma’mun menjadi Khalifah, ia mengirim pasukan ke Sogdiana, Ushrusana, dan mereka yang memberontak terhadapnya dari kalangan penduduk Fergana, dan ia menekan mereka dengan perang dan penyerbuan selama masa tinggalnya di Khorasan dan setelah itu. Sambil mengirimkan kuda kepada mereka, ia berkorespondensi dengan mereka, menyeru mereka kepada Islam dan ketaatan, serta mendorong mereka untuk melakukannya. Ia mengirimkan pasukan kepada Kabul Shah, yang membayar upeti dan tunduk, dan surat-surat sampai kepadanya hingga ia membawakan myrobalan dari sana dan tiba dalam keadaan segar."
