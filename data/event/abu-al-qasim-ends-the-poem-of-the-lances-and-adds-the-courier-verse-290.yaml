id: event/abu-al-qasim-ends-the-poem-of-the-lances-and-adds-the-courier-verse-290
class: event
kind: other
label:
  ar: تتمة قصيدة «تحت ظل الرماح» وأبيات البريد، ص266، 290هـ
  en: The end of the poem of the lances and the courier verse, p. 266, 290 AH
  ur: نیزوں کے سائے والے قصیدے کا اختتام اور قاصد کے اشعار، ص266، 290ھ
summary:
  ar: تتم ص266 القصيدة التي بدأت في آخر ص265، ثم تأتي أبيات يقول فيها أبو القاسم إن البريد وصل مبشراً وإنه يتمنى لو شهد الوقعة، وتنبه حواشي الصفحة إلى أن هذه الأبيات سبق ذكرها وأبو القاسم بخيوان.
  en: p. 266 completes the poem begun at the foot of p. 265, then gives a piece in which Abu al-Qasim says the courier has come with glad news and he wishes he had been at the battle; the notes of the page say these verses were given earlier when Abu al-Qasim was at Khiwan.
  ur: ص266 اس قصیدے کو مکمل کرتا ہے جو ص265 کے آخر میں شروع ہوا، پھر ایک ٹکڑا دیتا ہے جس میں ابو القاسم کہتے ہیں کہ قاصد خوشخبری لے کر آیا اور وہ تمنا کرتے ہیں کہ معرکے میں ہوتے؛ صفحے کے حواشی بتاتے ہیں کہ یہ اشعار پہلے آ چکے جب ابو القاسم خیوان میں تھے۔
