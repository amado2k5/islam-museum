label:
  ar: "ابن حجر يبدأ تدريس الحديث بالشيخونية، ٨٠٨هـ/١٤٠٦م"
  en: "Ibn Hajar begins hadith lectures at the Shaykhuniyya, 808/1406"
  ur: "ابن حجر کا آغازِ تدریسِ حدیث در شیخونیہ، 808ھ/1406ء"
summary:
  ar: "افتتح ابن حجر دروسه في الحديث بالمدرسة الشيخونية في شوال سنة ٨٠٨هـ/مارس ١٤٠٦م، ثم درّس بالجمالية حين افتُتحت مجددة في رجب ٨١١هـ/نوفمبر ١٤٠٨م، وبالمنكوتمرية في جمادى الآخرة ٨١٢هـ/أكتوبر ١٤٠٩م؛ وتولى أيضاً الإفتاء بدار العدل من ٨١١هـ إلى وفاته، والخطابة والإمامة بالجامع الأزهر وجامع عمرو {cite:encyclopaedia-of-islam-2 vol. 3 p. 809} {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
  en: "Ibn Hajar opened his hadith lectures at the Shaykhuniyya college in Shawwal 808 (March 1406); he later taught at the renovated Jamaliyya from its opening in Rajab 811 (November 1408) and at the Mankutimuriyya from Jumada II 812 (October 1409). He also held the mufti's seat in the Dar al-Adl from 811 until his death and served as associate preacher and imam at al-Azhar and the Mosque of Amr {cite:encyclopaedia-of-islam-2 vol. 3 p. 809} {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
  ur: "ابن حجر نے شوال 808ھ (مارچ 1406ء) میں مدرسہ شیخونیہ میں دروسِ حدیث کا آغاز کیا؛ پھر رجب 811ھ (نومبر 1408ء) سے تجدید شدہ جامعلیہ اور جمادی الثانی 812ھ (اکتوبر 1409ء) سے منکوتمریہ میں پڑھایا۔ اس کے ساتھ وہ 811ھ سے وفات تک دار العدل میں مفتی رہے اور جامع الازہر اور جامعِ عمرو میں معاون خطیب و امام رہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 809} {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}۔"
