id: event/revolt-of-yahya-ibn-umar-al-talibi
class: event
kind: revolt
label: { ar: "ظهور يحيى بن عمر الطالبي", en: "The rising of Yahya ibn 'Umar al-Talibi" }
summary:
  ar: "في سنة خمسين ومائتين ظهر يحيى بن عمر الطالبي ودخل الكوفة، ثم قُتل {cite:tabari-tarikh-abu-al-fadl j.9 p.266} {cite:tabari-tarikh-abu-al-fadl j.9 p.268} {cite:tabari-tarikh-abu-al-fadl j.9 p.270}، وذكر الطبري في الموضع نفسه ظهور الحسن بن زيد العلوي {cite:tabari-tarikh-abu-al-fadl j.9 p.271}. وعند المسعودي استفتح أموره بالكف عن الدماء والتورع عن أموال الناس وأظهر العدل فقتل وحمل رأسه إلى بغداد ونصب فضج الناس، وقال أبو هاشم الجعفري لمحمد بن طاهر إنك لتهنأ بقتل رجل لو كان رسول الله حياً لعزي به، وكان ظهوره لذل نزل به وجفوة من المتوكل والأتراك {cite:muruj-al-dhahab p. 530-531}"
  en: "In 250 Yahya ibn 'Umar al-Talibi appeared and entered Kufa, and then was killed {cite:tabari-tarikh-abu-al-fadl j.9 p.266} {cite:tabari-tarikh-abu-al-fadl j.9 p.268} {cite:tabari-tarikh-abu-al-fadl j.9 p.270}. In the same place al-Tabari mentions the appearance of al-Hasan ibn Zayd al-'Alawi {cite:tabari-tarikh-abu-al-fadl j.9 p.271}. According to al-Mas'udi, he began his affairs by refraining from bloodshed and from taking people's property, and he showed justice; but he was killed, his head was carried to Baghdad and displayed there, and the people cried out in protest. Abu Hashim al-Ja'fari told Muhammad ibn Tahir that he was congratulating himself on killing a man who, had the Messenger of God been alive, would have mourned him. His rising came from a humiliation that befell him and from the neglect he suffered at the hands of al-Mutawakkil and the Turks {cite:muruj-al-dhahab p. 530-531}"
