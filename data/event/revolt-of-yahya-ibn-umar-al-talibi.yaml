label: { ar: "ظهور يحيى بن عمر الطالبي" }
summary:
  ar: "في سنة خمسين ومائتين ظهر يحيى بن عمر الطالبي ودخل الكوفة، ثم قُتل {cite:tabari-tarikh-abu-al-fadl j.9 p.266} {cite:tabari-tarikh-abu-al-fadl j.9 p.268} {cite:tabari-tarikh-abu-al-fadl j.9 p.270}، وذكر الطبري في الموضع نفسه ظهور الحسن بن زيد العلوي {cite:tabari-tarikh-abu-al-fadl j.9 p.271}. وعند المسعودي استفتح أموره بالكف عن الدماء والتورع عن أموال الناس وأظهر العدل فقتل وحمل رأسه إلى بغداد ونصب فضج الناس، وقال أبو هاشم الجعفري لمحمد بن طاهر إنك لتهنأ بقتل رجل لو كان رسول الله حياً لعزي به، وكان ظهوره لذل نزل به وجفوة من المتوكل والأتراك {cite:muruj-al-dhahab p. 530-531}"
