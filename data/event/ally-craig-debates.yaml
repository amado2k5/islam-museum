summary:
  ar: "سلسلة مناظرات جامعية جمعت العالِم السني التورنتي [[person/shabir-ally|شبير علي]] وفيلسوف الدين [[person/william-lane-craig|وليم لين كريغ]]، أبرزها مناظرة 2002 في «هل قام عيسى من الموت؟» ومناظرة 2013 في «مفهوم الله في الإسلام والمسيحية»، فدافع علي عن الموقف السني في البعث النبوي ونفي الصلب عن عيسى، وجادل كريغ بالمنهج التاريخي لقيامة المسيح. وتنشر التسجيلات والتفريغات في أرشيفات الطرفين {cite:reasonablefaith-concept-of-god-debate} {cite:aomin-pretoria-debate-2013}."
  en: "A series of academic debates between the Toronto-based Sunni scholar [[person/shabir-ally|Shabir Ally]] and the philosopher [[person/william-lane-craig|William Lane Craig]], foremost the 2002 'Did Jesus Rise from the Dead?' and the 2013 'The Concept of God in Islam and Christianity'. Ally defended the Sunni position on the prophetic mission and the denial of the crucifixion of Jesus; Craig argued the historical case for the resurrection. Recordings and transcripts are published in both parties' archives {cite:reasonablefaith-concept-of-god-debate} {cite:aomin-pretoria-debate-2013}."
  es: "Una serie de debates académicos entre el erudito sunita de Toronto, Shabir Ally, y el filósofo William Lane Craig, entre los que destacan el de 2002 \"¿Resucitó Jesús de entre los muertos?\" y el de 2013 \"El concepto de Dios en el islam y el cristianismo\". Ally defendió la postura sunita sobre la misión profética y la negación de la crucifixión de Jesús; Craig argumentó a favor de la resurrección desde una perspectiva histórica. Las grabaciones y transcripciones se encuentran publicadas en los archivos de ambas partes {cite:reasonablefaith-concept-of-god-debate} {cite:aomin-pretoria-debate-2013}."
  fr: "Une série de débats universitaires ont opposé le chercheur sunnite torontois Shabir Ally au philosophe William Lane Craig, notamment les débats de 2002 intitulé « Jésus est-il ressuscité ? » et de 2013 intitulé « Le concept de Dieu en islam et en christianisme ». Ally a défendu la position sunnite sur la mission prophétique et le rejet de la crucifixion de Jésus; Craig, quant à lui, a présenté les arguments historiques en faveur de la résurrection. Les enregistrements et les transcriptions de ces débats sont disponibles dans les archives des deux parties."
  ur: "ٹورنٹو میں مقیم سنی اسکالر [[person/shabir-ally|Shabir Alli]] اور فلسفی [[person/william-lane-craig|William Lane Craig]] کے درمیان علمی مباحثوں کا ایک سلسلہ، جو 2002 میں 'کیا عیسیٰ مُردوں سے جی اُٹھا؟' اور 2013 'اسلام اور عیسائیت میں خدا کا تصور'۔ اتحادی نے پیغمبرانہ مشن اور عیسیٰ کی مصلوبیت کے انکار پر سنی موقف کا دفاع کیا۔ کریگ نے قیامت کے لیے تاریخی مقدمے کی دلیل دی۔ ریکارڈنگز اور ٹرانسکرپٹس دونوں فریقوں کے آرکائیوز میں شائع کیے گئے ہیں {cite:reasonablefaith-concept-of-god-debate} {cite:aomin-pretoria-debate-2013}۔"
  tr: "Üniversitelerde düzenlenen bir dizi münazara, Muhafazakâr Sünni alim [[person/shabir-ally|Shabir Ali]] ile din felsefecisi [[person/william-lane-craig|William Lane Craig]]'i bir araya getirdi; bunların en önemlileri 2002'deki \"İsa dirildi mi?\" ve 2013'teki \"İslam ve Hristiyanlıkta Tanrı Kavramı\" münazaralarıydı. Bu münazaralarda Ali, peygamberlik görevi konusunda Sünni görüşü savundu ve İsa'nın çarmıha gerilmesini reddetti; Craig ise tarihsel yöntemi kullanarak Mesih'in dirilişini açıklamaya çalıştı. Bu münazaraların kayıtları ve transkriptleri her iki tarafın arşivlerinde mevcuttur."
  id: "Serangkaian debat universitas mempertemukan cendekiawan Sunni Tory [[person/shabir-ally|Shabir Ali]] dan filsuf agama [[person/william-lane-craig|William Lane Craig]], terutama debat tahun 2002 tentang \"Apakah Yesus bangkit dari kematian?\" dan debat tahun 2013 tentang \"Konsep Tuhan dalam Islam dan Kristen.\" Dalam debat-debat ini, Ali membela posisi Sunni tentang misi kenabian dan menyangkal penyaliban Yesus, sementara Craig berpendapat menggunakan metode historis untuk menjelaskan kebangkitan Kristus. Rekaman dan transkrip debat-debat ini tersedia di arsip kedua partai."
