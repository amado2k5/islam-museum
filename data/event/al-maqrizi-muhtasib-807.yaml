label:
  ar: "آخر ولايات المقريزي للحسبة، ٨٠٧هـ"
  en: "Al-Maqrizi's last muhtasib term, 807/1405"
  ur: "مقریزی کی محتسبی کی آخری مدت، 807ھ"
summary:
  ar: "انتهت آخر مدد حسبة المقريزي بالقاهرة سنة ٨٠٧هـ، وكانت كل ولاية قد دامت أشهراً قليلة فحسب؛ وبذلك ختم صفحة الوظائف الإدارية والتدريسية التي جمعها في شبابه وكمال رجولته، من نيابة الحكم إلى الخطابة والإمامة والتدريس، قبل أن يحزم أمره على التفرغ للتاريخ بعد انتقاله إلى الشام {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}."
  en: "Al-Maqrizi's third and last term as muhtasib of Cairo fell in 807, each appointment lasting only a few months. It closed the chapter of his mixed administrative and scholarly career — deputy judgeship, preaching, imamate, hadith teaching — before his move to Syria led him to abandon public office for history {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}."
  ur: "807ھ میں مقریزی کی محتسبی کی تیسری اور آخری مدت آئی؛ ہر تقرری چند ماہ رہا تھا۔ اس کے ساتھ قاہرہ میں ان کے انتظامی و علمی مناصب کا باب — نائب قاضی، واعظ، امام اور مدرس حدیث — بند ہوا، اور شام کے قیام کے بعد انہوں نے عوامی مناصب کو خیرباد کہہ کر تاریخ کو اپنا شاغل بنا لیا {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}۔"
