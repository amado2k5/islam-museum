label:
  ar: "آخر ولايات المقريزي للحسبة، ٨٠٧هـ"
  en: "Al-Maqrizi's last muhtasib term, 807/1405"
  ur: "مقریزی کی محتسبی کی آخری مدت، 807ھ"
  es: "Último mandato muhtasib de Al-Maqrizi, 807/1405"
  fr: "Dernier mandat muhtasib d'Al-Maqrizi, 807/1405"
  tr: "El-Makrizi'nin pazar müfettişi olarak son görev süresi, Hicri 807."
  id: "Masa jabatan terakhir Al-Maqrizi sebagai inspektur pasar, 807 H."
summary:
  ar: "انتهت آخر مدد حسبة المقريزي بالقاهرة سنة ٨٠٧هـ، وكانت كل ولاية قد دامت أشهراً قليلة فحسب؛ وبذلك ختم صفحة الوظائف الإدارية والتدريسية التي جمعها في شبابه وكمال رجولته، من نيابة الحكم إلى الخطابة والإمامة والتدريس، قبل أن يحزم أمره على التفرغ للتاريخ بعد انتقاله إلى الشام {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}."
  en: "Al-Maqrizi's third and last term as muhtasib of Cairo fell in 807, each appointment lasting only a few months. It closed the chapter of his mixed administrative and scholarly career — deputy judgeship, preaching, imamate, hadith teaching — before his move to Syria led him to abandon public office for history {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}."
  ur: "807ھ میں مقریزی کی محتسبی کی تیسری اور آخری مدت آئی؛ ہر تقرری چند ماہ رہا تھا۔ اس کے ساتھ قاہرہ میں ان کے انتظامی و علمی مناصب کا باب — نائب قاضی، واعظ، امام اور مدرس حدیث — بند ہوا، اور شام کے قیام کے بعد انہوں نے عوامی مناصب کو خیرباد کہہ کر تاریخ کو اپنا شاغل بنا لیا {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}۔"
  es: "El tercer y último mandato de Al-Maqrizi como muhtasib de El Cairo tuvo lugar en 807, y cada nombramiento duró solo unos meses. Con ello se cerró el capítulo de su variada trayectoria administrativa y académica —como juez adjunto, predicador, imamato y profesor de hadices— antes de que su traslado a Siria lo llevara a abandonar la función pública para dedicarse a la historia {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}."
  fr: "Le troisième et dernier mandat d'Al-Maqrizi comme muhtasib du Caire prit fin en 807, chaque nomination ne durant que quelques mois. Il marqua la fin de sa carrière mêlant administration et érudition – juge adjoint, prédication, imamat, enseignement du hadith – avant que son départ pour la Syrie ne le conduise à abandonner la fonction publique pour l'histoire {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}."
  tr: "El-Makrizi'nin Kahire'deki Hisbah görevindeki son dönemi Hicri 807 yılında sona erdi ve her dönem sadece birkaç ay sürdü. Böylece, gençliğinde ve en verimli çağında, vali yardımcılığından vaaz vermeye, namaz kıldırmaya ve öğretmenliğe kadar biriktirdiği idari ve öğretim görevleri dönemini tamamladı; daha sonra Levant'a taşındıktan sonra kendini tarihe adamaya karar verdi. {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}"
  id: "Masa jabatan terakhir Al-Maqrizi sebagai Hisbah di Kairo berakhir pada tahun 807 Hijriah, dan setiap masa jabatannya hanya berlangsung beberapa bulan. Dengan demikian, beliau mengakhiri babak jabatan administratif dan pengajaran yang telah beliau raih di masa muda dan puncak kedewasaannya, dari wakil hingga berdakwah, memimpin salat, dan mengajar, sebelum beliau memutuskan untuk mengabdikan diri pada sejarah setelah pindah ke Levant. {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}"
