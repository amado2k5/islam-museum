id: event/al-ashari-composes-works-basra
class: event
kind: publication
label:
  ar: "الأشعري يصنّف «مقالات الإسلاميين» وكتب الرد على المعتزلة"
  en: "Al-Ash'ari composes Maqalat al-Islamiyyin and his refutations of the Mu'tazila"
  fr: "Al-Ash'ari compose Maqalat al-Islamiyyin et ses réfutations des Mu'tazilites"
  ur: "اشعری «مقالات الاسلامیین» اور معتزلہ کے رد کی کتب تصنیف کرتے ہیں"
  es: "Al-Ash'ari compone Maqalat al-Islamiyyin y sus refutaciones de Mu'tazila"
  tr: "El-Eş'ari, \"Müslümanların Maddeleri\"ni ve Mu'tezile'yi reddeden kitapları sınıflandırır."
  id: "Al-Ash'ari mengklasifikasikan \"Surah-surah Kaum Muslim\" dan buku-buku yang membantah Mu'tazilah."
summary:
  ar: "بعد توبته أخذ الأشعري يرد على المعتزلة ويهتك عوارهم، وصنّف كتباً كثيرة عدّها بنفسه في «العمد في الرؤية»، منها «الفصول في الرد على الملحدين» في اثني عشر كتاباً، و«خلق الأعمال»، و«الصفات»، و«الرؤية بالأبصار»، و«إيضاح البرهان»، و«اللمع في الرد على أهل البدع»، و«النقض على الجباعي»، و«التفسير» {cite:siyar-alam-nubala 15/85-86}؛ وعند ابن النديم منها «اللمع» و«الموجز» و«التبيين عن أصول الدين» و«الشرح والتفصيل في الرد على أهل الإفك والتضليل» {cite:fihrist-ibn-al-nadim pp. 648-649}. وأشهرها «مقالات الإسلاميين واختلاف المصلين»، كتابه الوصفي الذي يعرض مذاهب الفرق وأظهر فيه إحاطة تفصيلية بآراء المعتزلة {cite:encyclopaedia-of-islam-2 vol. 1 p. 743} {cite:maqalat-islamiyyin}."
  en: "After his repentance al-Ash'ari set about refuting the Mu'tazila, and composed the many works he himself lists in al-Umd fi'l-Ru'ya, among them al-Fusul fi'l-Radd ala'l-Mulhidin in twelve books, Khalq al-A'mal, al-Sifat, al-Ru'ya bi'l-Absar, Idah al-Burhan, al-Luma' fi'l-Radd ala Ahl al-Bida', al-Naqd ala'l-Jubba'i, and a tafsir {cite:siyar-alam-nubala 15/85-86}; Ibn al-Nadim names al-Luma', al-Mujaz, al-Tabyin an Usul al-Din and al-Sharh wa'l-Tafsil fi'l-Radd ala Ahl al-Ifk wa'l-Tadlil {cite:fihrist-ibn-al-nadim pp. 648-649}. Most famous is his Maqalat al-Islamiyyin wa-Ikhtilaf al-Musallin, the descriptive work presenting the doctrines of the sects which displays his intimate knowledge of Mu'tazilite views {cite:encyclopaedia-of-islam-2 vol. 1 p. 743} {cite:maqalat-islamiyyin}."
  fr: "Après son repentir, al-Ash'ari entreprit de réfuter les Mu'tazilites et composa les nombreux ouvrages qu’il énumère lui-même dans al-Umd fi'l-Ru'ya, dont al-Fusul fi'l-Radd ala'l-Mulhidin en douze livres, Khalq al-A'mal, al-Sifat, al-Ru'ya bi'l-Absar, Idah al-Burhan, al-Luma' fi'l-Radd ala Ahl al-Bida', al-Naqd ala'l-Jubba'i et un tafsir {cite:siyar-alam-nubala 15/85-86}. Ibn al-Nadim nomme al-Luma', al-Mujaz, al-Tabyin an Usul al-Din et al-Sharh wa'l-Tafsil fi'l-Radd ala Ahl al-Ifk wa'l-Tadlil {cite:fihrist-ibn-al-nadim pp. 648-649}. Son plus célèbre ouvrage, Maqalat al-Islamiyyin wa-Ikhtilaf al-Musallin, présente les doctrines des différentes écoles et témoigne de sa connaissance intime des vues mu'tazilites {cite:encyclopaedia-of-islam-2 vol. 1 p. 743} {cite:maqalat-islamiyyin}."
  ur: "توبہ کے بعد اشعری معتزلہ کے رد میں مشغول ہوئے اور بہت سی کتب تصنیف کیں جن کی فہرست انہوں نے خود «العمد فی الرؤیہ» میں دی، جن میں «الفصول فی الرد علی الملحدین» ⁦(بارہ کتب)⁩، «خلق الاعمال»، «الصفات»، «الرؤیہ بالابصار»، «ایضاح البرہان»، «اللمع فی الرد علی اہل البدع»، «النقض علی الجباعی» اور ایک تفسیر شامل ہیں {cite:siyar-alam-nubala 15/85-86}؛ ابن الندیم نے «اللمع»، «الموجز»، «التبیین عن اصول الدین» اور «الشرح والتفصیل فی الرد علی اہل الافک والتضلیل» کے نام لیے {cite:fihrist-ibn-al-nadim pp. 648-649}۔ سب سے مشہور «مقالات الاسلامیین واختلاف المصلین» ہے، فرقوں کے مذاہب پر ان کی وصفی کتاب جو معتزلہ کے عقائد سے ان کی گہری واقفیت دکھاتی ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 743} {cite:maqalat-islamiyyin}۔"
  es: "Después de su arrepentimiento, al-Ash'ari se dedicó a refutar a Mu'tazila y compuso las muchas obras que él mismo enumera en al-Umd fi'l-Ru'ya, entre ellas al-Fusul fi'l-Radd ala'l-Mulhidin en doce libros, Khalq al-A'mal, al-Sifat, al-Rdah bi'l-Absar, I'l-Absar al-Burhan, al-Luma' fi'l-Radd ala Ahl al-Bida', al-Naqd ala'l-Jubba'i y un tafsir {cita:siyar-alam-nubala 15/85-86}; Ibn al-Nadim nombra a al-Luma', al-Mujaz, al-Tabyin an Usul al-Din y al-Sharh wa'l-Tafsil fi'l-Radd ala Ahl al-Ifk wa'l-Tadlil {citar: fihrist-ibn-al-nadim págs. 648-649}. El más famoso es su Maqalat al-Islamiyyin wa-Ikhtilaf al-Musallin, la obra descriptiva que presenta las doctrinas de las sectas y que muestra su conocimiento íntimo de las opiniones mu'tazilitas {citar:encyclopaedia-of-islam-2 vol. 1 pág. 743} {citar:artículos-islámicos}."
  tr: "Tövbe ettikten sonra, el-Eş'ari Mu'tezilileri çürütmeye ve onların kusurlarını ortaya çıkarmaya başladı. Kendisi \"Al-'Umdah fi al-Ru'yah\" (Ateistlerin Reddedilmesinde Temeller) adlı on iki kitapta saydığı birçok kitap yazmıştır; ayrıca \"Khalq al-A'mal\" (Amellerin Yaratılışı), \"Al-Sifat\" (Nitelikler), \"Al-Ru'yah bil-Absar\" (Gözlerle Görme), \"Idah al-Burhan\" (Delilin Açıklanması), \"Al-Luma' fi al-Radd 'ala Ahl al-Bida'\" (Biddet Ehli Ehli Bidî'nin Reddedilmesinde İhtimaller), \"Al-Naqd 'ala al-Juba'i\" (Cübeyî'nin Reddi) ve \"Al-Tafsir\" (Tevrat Tefsiri) adlı eserleri de bulunmaktadır. {cite:siyar-alam-nubala 15/85-86} İbn el-Nadim bunlar arasında \"El-Luma'\" (Işıklar), \"El-Mujaz\" (Özet), \"El-Tibyan 'an Usul al-Din\" (Din Esaslarının Açıklanması) ve \"El-Şerh ve el-Tafsil fi el-Radd 'ala Ehl el-İfk ve el-Tadlil\" (İftira ve Sapkınlık Ehlinin Reddedilmesinin Açıklaması ve Detaylandırılması) adlı eserleri de saymıştır. {cite:fihrist-ibn-al-nadim ss. 648-649}. Bunların en ünlüsü, mezheplerin doktrinlerini sunan ve Mu'tezile'nin görüşlerine dair detaylı bir genel bakış gösterdiği \"Maqalat al-Islamiyyin wa Ikhtilaf al-Musallin\" (Müslümanların Maddeleri ve İbadet Edenlerin Farklılıkları) adlı betimleyici kitabıdır. {cite:ansiklopedi-of-islam-2 cilt. 1 s. 743} {cite:maqalat-islamiyyin}."
  id: "Setelah bertobat, al-Ash'ari mulai membantah kaum Mu'tazilah dan mengungkap kelemahan mereka. Ia menulis banyak buku, yang menurutnya sendiri berjumlah dua belas buku, yaitu \"Al-'Umdah fi al-Ru'yah\" (Dasar-Dasar Bantahan terhadap Kaum Ateis), \"Khalq al-A'mal\" (Penciptaan Amalan), \"Al-Sifat\" (Sifat-Sifat Allah), \"Al-Ru'yah bil-Absar\" (Penglihatan dengan Mata), \"Idah al-Burhan\" (Penjelasan Bukti), \"Al-Luma' fi al-Radd 'ala Ahl al-Bida'\" (Kilauan dalam Bantahan terhadap Kaum Bid'ah), \"Al-Naqd 'ala al-Juba'i\" (Balasan terhadap al-Juba'i), dan \"Al-Tafsir\" (Penafsiran). {cite:siyar-alam-nubala 15/85-86}. Ibn al-Nadim memasukkan di antara kitab-kitabnya \"Al-Luma'\" (Kilauan), \"Al-Mujaz\" (Ringkasan), \"Al-Tibyan 'an Usul al-Din\" (Penjelasan Prinsip-Prinsip Agama), dan \"Al-Sharh wa al-Tafsil fi al-Radd 'ala Ahl al-Ifk wa al-Tadlil\" (Penjelasan dan Rincian dalam Menolak Orang-orang yang Berfitnah dan Menyesatkan) {cite:fihrist-ibn-al-nadim hlm. 648-649}. Yang paling terkenal di antaranya adalah “Maqalat al-Islamiyyin wa Ikhtilaf al-Musallin” (Artikel-artikel Kaum Muslim dan Perbedaan-Perbedaan Para Penyembah), buku deskriptifnya yang menyajikan doktrin-doktrin sekte dan di mana ia menunjukkan gambaran rinci tentang pandangan-pandangan Mu'tazilah. {cite:encyclopaedia-of-islam-2 vol. 1 hlm. 743} {kutip:maqalat-islamiyyin}."
