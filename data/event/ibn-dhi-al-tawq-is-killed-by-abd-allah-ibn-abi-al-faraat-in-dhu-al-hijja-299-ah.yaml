id: "event/ibn-dhi-al-tawq-is-killed-by-abd-allah-ibn-abi-al-faraat-in-dhu-al-hijja-299-ah"
class: event
kind: other
label:
  ar: "يقتل عبد الله بن أبي الفارات ابن ذي الطوق في ذي الحجة سنة 299هـ، ص400"
  en: "Abd Allah ibn Abi al-Faraat kills Ibn Dhi al-Tawq in Dhu al-Hijja 299 AH, p. 400"
  ur: "عبد اللہ بن ابی الفارات ابن ذی الطوق کو ذوالحجہ 299ھ میں قتل کرتا ہے، ص400"
  es: "Abd Allah ibn Abi al-Faraat mata a Ibn Dhi al-Tawq en Dhu al-Hijja 299 AH, p. 400"
  fr: "Abd Allah ibn Abi al-Faraat tue Ibn Dhi al-Tawq dans Dhu al-Hijja 299 AH, p. 400"
  tr: "Abdullah ibn Ebi el-Ferat, H. 299 yılının Zilhicce'sinde İbn Zî el-Tevk'i öldürdü, s. 400"
  id: "Abdullah ibn Abi al-Farat membunuh Ibnu Dhi al-Tawq pada Dhu al-Hijjah tahun 299 H, hal. 400"
summary:
  ar: "يظفر عبد الله بن أبي الفارات بابن ذي الطوق الجيشاني ومعه رجل، فيقتلهما يوم الجمعة لثلاث عشرة خلت من ذي الحجة سنة 299هـ، ويُبعث برأسيهما إلى ملاحظ بن عبد الله."
  en: "On Friday, thirteen days into Dhu al-Hijja 299 AH, Abd Allah ibn Abi al-Faraat catches Ibn Dhi al-Tawq al-Jayshani with one companion and kills them both. Their heads are sent to Mulahiz ibn Abd Allah."
  ur: "جمعے کے دن، ذوالحجہ 299ھ کے تیرہ دن گزرنے پر، عبد اللہ بن ابی الفارات ابن ذی الطوق الجیشانی کو ایک ساتھی سمیت پکڑ کر قتل کرتا ہے، اور ان کے سر ملاحظ بن عبد اللہ کو بھیجے جاتے ہیں۔"
  es: "El viernes trece días después del inicio de Dhu al-Hijja del año 299 AH, Abd Allah ibn Abi al-Faraat capturó a Ibn Dhi al-Tawq al-Jayshani junto con un compañero y los mató a ambos. Sus cabezas fueron enviadas a Mulahiz ibn Abd Allah."
  fr: "Le vendredi 13 Dhu al-Hijja 299 AH, Abd Allah ibn Abi al-Faraat surprend Ibn Dhi al-Tawq al-Jayshani et un compagnon et les tue tous deux. Leurs têtes sont envoyées à Mulahiz ibn Abd Allah."
  tr: "Abdullah bin Abi Al-Farat, İbn Dhi Al-Tawq Al-Jayshani'yi ve yanındaki bir adamı yakalayıp, Hicri 299 yılının Zilhicce ayının on üçüncü Cuma günü öldürdü ve başlarını Mulahiz bin Abdullah'a gönderdi."
  id: "Abdullah bin Abi Al-Farat menangkap Ibn Dhi Al-Tawq Al-Jayshani dan seorang pria bersamanya, lalu membunuh mereka pada hari Jumat, tanggal 13 Dzul Hijjah tahun 299 Hijriah, dan mengirimkan kepala mereka kepada Mulahiz bin Abdullah."
