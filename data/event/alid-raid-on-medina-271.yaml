label: { ar: "دخول ابني الحسن بن جعفر العلوي المدينة", en: "The entry into Medina of the two sons of al-Hasan ibn Ja'far al-Alawi", es: "La entrada en Medina de los dos hijos de al-Hasan ibn Ja'far al-Alawi.", fr: "L'entrée à Médine des deux fils d'al-Hasan ibn Ja'far al-Alawi" }
summary:
  ar: "في غرة صفر سنة 271هـ دخل محمد وعلي ابنا الحسن بن جعفر بن موسى بن جعفر بن علي بن الحسين المدينة فقتلا جماعة من أهلها وطالبوا أهلها بالمال فلم يصل أهل المدينة في مسجد رسول الله أربع جمع لا جمعة ولا جماعة {cite:muntazam-ibn-al-jawzi p. 101}."
  en: "In Safar 271 the Talibid brothers Muhammad and Ali b. al-Hasan b. Ja'far entered Medina by force, killed townspeople and mulcted them, silencing the Prophet's mosque for four Fridays {cite:muntazam-ibn-al-jawzi p. 101}."
  es: "En Safar 271, los hermanos talibanes Muhammad y Ali b. al-Hasan b. Ja'far entraron por la fuerza en Medina, mataron a los habitantes de la ciudad y los agredieron, silenciando la mezquita del Profeta durante cuatro viernes {cite:muntazam-ibn-al-jawzi p. 101}."
  fr: "En Safar 271, les frères talibides Muhammad et Ali b. al-Hasan b. Ja'far entrèrent de force à Médine, tuèrent des habitants et les massacrèrent, réduisant au silence la mosquée du Prophète pendant quatre vendredis {cite:muntazam-ibn-al-jawzi p. 101}."
