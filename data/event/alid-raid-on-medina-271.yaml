id: event/alid-raid-on-medina-271
class: event
kind: massacre
label: { ar: "دخول ابني الحسن بن جعفر العلوي المدينة", en: "The entry into Medina of the two sons of al-Hasan ibn Ja'far al-Alawi", es: "La entrada en Medina de los dos hijos de al-Hasan ibn Ja'far al-Alawi.", fr: "L'entrée à Médine des deux fils d'al-Hasan ibn Ja'far al-Alawi", ur: "حسن بن جعفر علوی کے دو بیٹوں کا مدینہ میں داخلہ", tr: "Oğlum Hasan ibn Cafer el-Alavi şehre girdi.", id: "Putraku Al-Hasan ibn Ja'far Al-Alawi memasuki kota" }
summary:
  ar: "في غرة صفر سنة 271هـ دخل محمد وعلي ابنا الحسن بن جعفر بن موسى بن جعفر بن علي بن الحسين المدينة فقتلا جماعة من أهلها وطالبوا أهلها بالمال فلم يصل أهل المدينة في مسجد رسول الله أربع جمع لا جمعة ولا جماعة {cite:muntazam-ibn-al-jawzi p. 101}."
  en: "In Safar 271 the Talibid brothers Muhammad and Ali b. al-Hasan b. Ja'far entered Medina by force, killed townspeople and mulcted them, silencing the Prophet's mosque for four Fridays {cite:muntazam-ibn-al-jawzi p. 101}."
  es: "En Safar 271, los hermanos talibanes Muhammad y Ali b. al-Hasan b. Ja'far entraron por la fuerza en Medina, mataron a los habitantes de la ciudad y los agredieron, silenciando la mezquita del Profeta durante cuatro viernes {cite:muntazam-ibn-al-jawzi p. 101}."
  fr: "En Safar 271, les frères talibides Muhammad et Ali b. al-Hasan b. Ja'far entrèrent de force à Médine, tuèrent des habitants et les massacrèrent, réduisant au silence la mosquée du Prophète pendant quatre vendredis {cite:muntazam-ibn-al-jawzi p. 101}."
  ur: "صفر 271 میں طالب بھائی محمد اور علی بن۔ الحسن بی جعفر مدینہ منورہ میں زبردستی داخل ہوا، شہر کے لوگوں کو قتل کیا اور ان کا قتل عام کیا، مسجد نبوی کو چار جمعہ کے لیے خاموش کرایا۔ 101}۔"
  tr: "Hicri 271 yılının Safer ayının ilk günü, Hasan bin Cafer bin Musa bin Cafer bin Ali bin Hüseyin'in oğulları Muhammed ve Ali, Medine'ye girip halkından bir grubu öldürdüler ve onlardan para istediler. Bunun üzerine Medine halkı, dört Cuma günü boyunca ne Cuma namazı ne de cemaat namazı kılmadı. {Kaynak: Muntazam ibn el-Cevzi, s. 101}"
  id: "Pada tanggal 1 Safar tahun 271 Hijriah, Muhammad dan Ali, putra Al-Hasan bin Ja’far bin Musa bin Ja’far bin Ali bin Al-Hussein, memasuki Madinah dan membunuh sekelompok penduduknya serta meminta uang dari mereka. Maka penduduk Madinah tidak melaksanakan salat di masjid Rasulullah selama empat hari Jumat, baik salat Jumat maupun salat berjamaah. {kutipan:muntazam-ibn-al-jawzi hlm. 101}."
