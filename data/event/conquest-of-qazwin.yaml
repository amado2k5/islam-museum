id: event/conquest-of-qazwin
class: event
kind: conquest
label: { ar: "فتح قزوين", en: "Conquest of Qazwin", es: "Conquista de Qazwin", fr: "Conquête de Qazwin", ur: "قزوین کی فتح" }
summary:
  ar: "لما ولي المغيرة بن شعبة الكوفة ولّى البراء بن عازب قزوين وأمره أن يسير إليها فإن فتحها الله على يده غزا الديلم منها فسار ومعه حنظلة بن زيد الخيل حتى أتى أبهر فقام على حصنها فقاتلوه ثم طلبوا الأمان فأمّنهم على مثل ما أمّن عليه حذيفة أهل نهاوند وصالحهم وغلب على أراضي أبهر ثم غزا أهل حصن قزوين فلما بلغهم قصدهم وجهوا إلى الديلم يستنصرونهم فوعدوهم فلما حلّ البراء والمسلمون خرجوا للقتال والديلم وقوف على الجبل لا يمدون إليهم يداً فطلبوا الصلح فأنفوا من الجزية وأظهروا الإسلام فقيل نزلوا على ما نزل عليه أساورة البصرة من الإسلام على أن يكونوا مع من شاؤوا فنزلوا الكوفة وحالفوا زهرة بن حوية فسمّوا حراء الديلم وقيل أسلموا وأقاموا بمكانهم وصارت أرضوهم عشرية ورتب البراء معهم خمسمائة رجل من المسلمين معهم طليحة بن خويلد الأسدي وأقطعهم أرضين لا حق فيها لأحد ثم غزا الديلم حتى أدوا إليه الأتاوة وغزا جيلان والببر والطيلسان وفتح زنجان عنوة وكان حصن قزوين يسمى بالفارسية كشوين معناه الحد المنظور إليه وبينه وبين الديلم جبل وكان فيه مقاتلة من الأساورة يرابطون فيدفعون الديلم."
  en: "When al-Mughira governed Kufa he made al-Bara' ibn Azib governor of Qazwin, ordering him to take it then raid Daylam from it; he marched with Hanzala ibn Zayd, reduced Abhar on Nihawand's terms, then moved on Qazwin's fortress — its people had begged Daylam's aid but the Daylamis stood on the mountain withholding a hand, so they sought terms, scorned the jizya and professed Islam — said to have come down on the asawira-of-Basra terms, settling in Kufa allied to Zuhra ibn Hawiyya as 'Hura' al-Daylam', though others say they Islamized in place on ushr land; al-Bara' posted five hundred Muslims with them under Tulayha ibn Khuwaylid and granted them unclaimed lands, then raided Daylam to tribute, Jilan, al-Babar and al-Taylasan, and took Zanjan by force; the fortress, 'Kashwin' in Persian — the watched bound — had been ribat-manned by Persian asawira who fended Daylam."
  es: "Cuando al-Mughira gobernaba Kufa, nombró a al-Bara' ibn Azib gobernador de Qazwin, ordenándole que lo tomara y luego saqueara Daylam desde allí; marchó con Hanzala ibn Zayd, redujo Abhar en los términos de Nihawand, luego se dirigió a la fortaleza de Qazwin —su gente había implorado la ayuda de Daylam pero los daylamitas estaban en la montaña negándose a ayudar, por lo que buscaron condiciones, despreciaron la jizya y profesaron el Islam— se dice que bajaron en los términos de la asawira de Basora, estableciéndose en Kufa aliados con Zuhra ibn Hawiyya como 'Hura' al-Daylam', aunque otros dicen que se islamizaron en el lugar en tierras ushr; al-Bara' puso quinientos musulmanes con ellos bajo el mando de Tulayha ibn Khuwaylid y les concedió tierras no reclamadas, luego saqueó Daylam para pagar tributo, Jilan, al-Babar y al-Taylasan, y tomó Zanjan por la fuerza; La fortaleza, 'Kashwin' en persa —el límite vigilado— había sido custodiada por asawiras persas que defendían Daylam."
  fr: "Lorsque al-Mughira gouvernait Kufa, il nomma al-Bara' ibn Azib gouverneur de Qazwin, lui ordonnant de s'en emparer puis de mener un raid sur Daylam. Il marcha avec Hanzala ibn Zayd, soumit Abhar aux conditions de Nihawand, puis se dirigea vers la forteresse de Qazwin. Ses habitants avaient imploré l'aide de Daylam, mais les Daylamites, retranchés sur la montagne, refusèrent de leur venir en aide. Ils négocièrent donc des conditions, méprisèrent la jizya et se convertirent à l'islam. On dit qu'ils descendirent à Kufa selon les conditions de l'asawira de Bassora et s'y installèrent, alliés à Zuhra ibn Hawiyya sous le nom de « Hura' al-Daylam' », bien que d'autres affirment qu'ils se convertirent à l'islam sur place, sur des terres ushr. al-Bara' leur confia cinq cents musulmans sous le commandement de Tulayha ibn Khuwaylid et leur octroya des terres non réclamées, puis mena des raids sur Daylam pour exiger un tribut, Jilan, al-Babar et al-Taylasan, et prit Zanjan par la force. la forteresse, « Kashwin » en persan — la limite surveillée — était gardée par des asawira persans qui repoussaient Daylam."
  ur: "جب المغیرہ نے کوفہ پر حکومت کی تو اس نے براء بن عازب کو قزوین کا گورنر بنایا اور اسے حکم دیا کہ وہ اسے لے لے اور پھر اس سے دیلام پر چھاپہ مارے۔ اس نے حنظلہ بن زید کے ساتھ کوچ کیا، نہاوند کی شرائط پر ابھار کو کم کیا، پھر قزوین کے قلعے کی طرف بڑھے - اس کے لوگوں نے دیلم سے مدد کی درخواست کی لیکن دیلامیوں نے ایک ہاتھ روک کر پہاڑ پر کھڑے ہو کر شرائط مانگی، جزیہ کا طعنہ دیا اور اسلام کا اقرار کیا - بعثت کے طور پر مقررہ وقت پر اتر آئے۔ کوفہ نے زہرہ بن حویہ کے ساتھ 'حورۃ الدیلم' کے طور پر اتحاد کیا، حالانکہ دوسرے کہتے ہیں کہ انہوں نے عشر کی سرزمین پر اسلام قبول کیا۔ البراء نے ان کے ساتھ پانچ سو مسلمانوں کو طلیحہ بن خویلد کے ماتحت کیا اور انہیں غیر دعویدار زمینیں عطا کیں، پھر دیلم، جیلان، الببر اور الطیلسان پر چھاپہ مارا اور زنجان پر زبردستی قبضہ کر لیا۔ قلعہ، 'کاشوین' فارسی میں - دیکھا ہوا پابند - فارسی اساویرا نے رباط کا انتظام کیا تھا جس نے دیلام کو روکا تھا۔"
