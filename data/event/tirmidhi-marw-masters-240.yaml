label:
  ar: "سماع الترمذي من مشايخ مرو: محمود بن غيلان وعلي بن حجر وعبد بن حميد، نحو ٢٤٠هـ"
  en: "Al-Tirmidhi hears the masters of Marw: Mahmud ibn Ghaylan, Ali ibn Hujr and Abd ibn Humayd, c. 240/854"
  ur: "ترمذی کی مرو کے مشائخ — محمود بن غیلان، علی بن حجر اور عبد بن حمید — سے سماعت، تقریباً 240ھ/854ء"
summary:
  ar: "كان من أثقل مشايخ الترمذي روايةً في سننه ثلاثة من مرو: محمود بن غيلان العدوي أبو أحمد المروزي (ت ٢٣٩هـ)، وعلي بن حجر بن إياس السعدي أبو الحسن المروزي (ت ٢٤٤هـ) الذي روى له الشيخان والنسائي، وعبد بن حميد بن نصر الكسي أبو محمد المروزي الذي أكثر عنه في كتاب التفسير من سننه {cite:mawsuat-a3lam-ulama-adaba p. 451}."
  en: "Three of Marw's traditionists rank among the eight shaykhs al-Tirmidhi drew on most heavily in his Sunan: Mahmud ibn Ghaylan al-Adawi, Abu Ahmad al-Marwazi (d. 239), Ali ibn Hujr ibn Iyas al-Sa'di, Abu al-Hasan al-Marwazi (d. 244), from whom the two Shaykhs and al-Nasa'i also narrated, and Abd ibn Humayd ibn Nasr al-Kissi, Abu Muhammad al-Marwazi, from whom he narrated most profusely in the Tafsir book of his Sunan {cite:mawsuat-a3lam-ulama-adaba p. 451}."
  ur: "مرو کے تین محدثین ان آٹھ مشائخ میں شامل ہیں جن سے ترمذی نے اپنی سنن میں سب سے زیادہ روایت لی: محمود بن غیلان عدوی ابو احمد مروزی (وفات 239ھ)، علی بن حجر بن اییاس سعدی ابو الحسن مروزی (وفات 244ھ) جن سے بخاری، مسلم اور نسائی نے بھی روایت کی، اور عبد بن حمید بن نصر کسی ابو محمد مروزی جن سے انہوں نے سنن کے کتابِ تفسیر میں سب سے زیادہ روایت نقل کی {cite:mawsuat-a3lam-ulama-adaba p. 451}۔"
