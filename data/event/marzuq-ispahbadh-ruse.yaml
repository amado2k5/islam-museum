id: event/marzuq-ispahbadh-ruse
class: event
kind: campaign
label: { ar: "حيلة مرزوق على الأصبهبذ", en: "Marzuq's Ruse upon the Ispahbadh" }
summary:
  ar: "لما نقض أهل طبرستان في خلافة المنصور وقتلوا المسلمين وجه إليهم خازم بن خزيمة التميمي وروح بن حاتم المهلبي ومعهما مرزوق أبو الخصيب مولاه الذي نسب إليه قصر الخصيب بالكوفة فلما طال الأمر وصعب سألهما أن يضرباه ويحلقا رأسه ولحيته ففعلا فخلص إلى الأصبهبذ فقال إن هذين الرجلين استغشاني وفعلا بي ما ترى وقد هربت إليك فإن قبلت انقطاعي دللتك على عورات العرب فكساه وأعطاه وأظهر الثقة به فلما اطلع على عوراته كتب إلى خازم وروح بما احتاجا إليه واحتال للباب حتى فتحه فدخل المسلمون المدينة وفتحوها وساروا في البلاد فدوخوها."
  en: "When Tabaristan's people breached under al-Mansur and killed Muslims he sent Khazim ibn Khuzayma al-Tamimi and Rawh ibn Hatim al-Muhallabi — with them Marzuq Abu al-Khasib, Khazim's mawla, namesake of Kufa's Qasr al-Khasib. As the siege dragged he begged them to beat him and shave his head and beard; done, he escaped to the Ispahbadh claiming 'these two betrayed me — see what they did — I have fled to you; accept my desertion and I will show you the Arabs' weaknesses'. The Ispahbadh clothed him, rewarded him and showed trust; Marzuq wrote the generals all they needed, contrived the gate till it opened, the Muslims took the city and subdued the land."
