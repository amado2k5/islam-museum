id: event/marzuq-ispahbadh-ruse
class: event
kind: campaign
label: { ar: "حيلة مرزوق على الأصبهبذ", en: "Marzuq's Ruse upon the Ispahbadh", es: "La artimaña de Marzuq sobre Ispahbadh", fr: "La ruse de Marzuq sur l'Ispahbadh", ur: "مرزوق کا اسپہ آباد پر حملہ", tr: "Marzouq'un Al-Asbahbadh'a yönelik numarası", id: "Trik Marzouq pada Al-Asbahbadh" }
summary:
  ar: "لما نقض أهل طبرستان في خلافة المنصور وقتلوا المسلمين وجه إليهم خازم بن خزيمة التميمي وروح بن حاتم المهلبي ومعهما مرزوق أبو الخصيب مولاه الذي نسب إليه قصر الخصيب بالكوفة فلما طال الأمر وصعب سألهما أن يضرباه ويحلقا رأسه ولحيته ففعلا فخلص إلى الأصبهبذ فقال إن هذين الرجلين استغشاني وفعلا بي ما ترى وقد هربت إليك فإن قبلت انقطاعي دللتك على عورات العرب فكساه وأعطاه وأظهر الثقة به فلما اطلع على عوراته كتب إلى خازم وروح بما احتاجا إليه واحتال للباب حتى فتحه فدخل المسلمون المدينة وفتحوها وساروا في البلاد فدوخوها."
  en: "When Tabaristan's people breached under al-Mansur and killed Muslims he sent Khazim ibn Khuzayma al-Tamimi and Rawh ibn Hatim al-Muhallabi — with them Marzuq Abu al-Khasib, Khazim's mawla, namesake of Kufa's Qasr al-Khasib. As the siege dragged he begged them to beat him and shave his head and beard; done, he escaped to the Ispahbadh claiming 'these two betrayed me — see what they did — I have fled to you; accept my desertion and I will show you the Arabs' weaknesses'. The Ispahbadh clothed him, rewarded him and showed trust; Marzuq wrote the generals all they needed, contrived the gate till it opened, the Muslims took the city and subdued the land."
  es: "Cuando el pueblo de Tabaristán rompió el cerco de al-Mansur y mató a musulmanes, envió a Khazim ibn Khuzayma al-Tamimi y a Rawh ibn Hatim al-Muhallabi, con ellos a Marzuq Abu al-Khasib, el mawla de Khazim, homónimo de Qasr al-Khasib de Kufa. Mientras el asedio se prolongaba, les rogó que lo golpearan y le afeitaran la cabeza y la barba; hecho esto, escapó a Ispahbadh alegando: «Estos dos me traicionaron; vean lo que hicieron. He huido a ustedes; acepten mi deserción y les mostraré las debilidades de los árabes». Ispahbadh lo vistió, lo recompensó y le mostró confianza; Marzuq escribió a los generales todo lo que necesitaban, ideó la puerta hasta que se abrió, los musulmanes tomaron la ciudad y sometieron la tierra."
  fr: "Lorsque les hommes du Tabaristan franchirent les lignes d'al-Mansur et massacrèrent des musulmans, il envoya Khazim ibn Khuzayma al-Tamimi et Rawh ibn Hatim al-Muhallabi, accompagnés de Marzuq Abu al-Khasib, le mawla de Khazim, qui donna son nom au Qasr al-Khasib de Koufa. Alors que le siège s'éternisait, il les supplia de le battre et de lui raser la tête et la barbe. Une fois cela fait, il s'enfuit chez les Ispahbadh en déclarant: « Ces deux-là m'ont trahi ! Voyez ce qu'ils ont fait ! Je me suis réfugié chez vous ! Acceptez ma désertion et je vous révélerai les faiblesses des Arabes. » Les Ispahbadh l'accueillirent, le récompensèrent et lui firent confiance. Marzuq écrivit aux généraux tout ce dont ils avaient besoin, manœuvra pour que la porte s'ouvre, et les musulmans prirent la ville et soumirent la région."
  ur: "جب طبرستان کے لوگوں نے المنصور کے ماتحت ہو کر مسلمانوں کو قتل کیا تو اس نے خزیم بن خزیمہ التمیمی اور راو بن حاتم المحلبی کو بھیجا - ان کے ساتھ مرزوق ابو الخصیب، خزیم کا مولا، کوفہ کے قصر الخصیب کا نام تھا۔ جب محاصرہ گھسیٹ رہا تھا تو اس نے ان سے التجا کی کہ اسے مارو اور اس کا سر اور داڑھی منڈواؤ۔ ہو گیا، وہ یہ کہتے ہوئے اصفہ آباد کی طرف فرار ہو گیا کہ 'ان دونوں نے مجھے دھوکہ دیا — دیکھو انہوں نے کیا کیا — میں بھاگ کر تمہارے پاس آیا ہوں۔ میری دستبرداری کو قبول کرو اور میں تمہیں عربوں کی کمزوریاں دکھاؤں گا۔ اصفہ آباد نے اسے لباس پہنایا، انعام دیا اور اعتماد کا اظہار کیا۔ مرزوق نے جرنیلوں کو اپنی ضرورت کے مطابق لکھا، گیٹ کھولنے تک اس کی تعمیر کی، مسلمانوں نے شہر پر قبضہ کر لیا اور زمین کو مسخر کر لیا۔"
  tr: "Al-Mansur halifeliği döneminde Tabaristan halkı isyan edip Müslümanları öldürdüğünde, o da Khazim bin Huzeyme Al-Tamimi ve Rawh bin Hatim Al-Muhallabi'yi, Kufa'daki Al-Khasib Sarayı'nın sahibi olan azatlı kölesi Marzuq Abu Al-Khasib ile birlikte onlara gönderdi. Mesele uzayıp zorlaşınca, onlardan kendisini dövmelerini, başını ve sakalını tıraş etmelerini istedi ve onlar da öyle yaptılar. Sonra Asbahbadh'a ulaştı ve şöyle dedi: \"Bu iki adam beni kandırdı ve bana gördüğünüzü yaptılar, ben de size sığındım. Eğer teslimiyetimi kabul ederseniz, size Arapların zayıflıklarını göstereceğim.\" Böylece onu giydirdi, hediyeler verdi ve ona güven duydu. Zayıflıklarının farkına varınca, Khazim ve Rawh'a ihtiyaç duydukları şeyleri yazdı ve kapıyı açana kadar bir plan yaptı. Böylece Müslümanlar şehre girdiler, şehri fethettiler ve toprakları ele geçirerek boyun eğdirdiler."
  id: "Ketika penduduk Tabaristan memberontak selama kekhalifahan Al-Mansur dan membunuh kaum Muslimin, ia mengirim Khazim bin Khuzaymah Al-Tamimi dan Rawh bin Hatim Al-Muhallabi kepada mereka, bersama dengan Marzuq Abu Al-Khasib, budak yang telah dibebaskannya, yang kepadanya Istana Al-Khasib di Kufa dikaitkan. Ketika masalah tersebut berlarut-larut dan sulit, ia meminta mereka untuk memukulinya dan mencukur kepala serta janggutnya, dan mereka melakukannya. Kemudian ia sampai di Asbahbadh dan berkata, “Kedua orang ini telah menipu saya dan melakukan kepada saya apa yang kalian lihat, dan saya telah melarikan diri kepada kalian. Jika kalian menerima penyerahan saya, saya akan menunjukkan kepada kalian kelemahan orang-orang Arab.” Maka ia memberinya pakaian, memberinya hadiah, dan menunjukkan kepercayaan kepadanya. Ketika ia menyadari kelemahannya, ia menulis surat kepada Khazim dan Rawh tentang apa yang mereka butuhkan dan menyusun rencana untuk gerbang tersebut sampai ia membukanya. Maka kaum Muslimin memasuki kota dan menaklukkannya serta berbaris melalui negeri-negeri dan menundukkan mereka."
