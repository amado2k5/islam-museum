id: event/hajjaj-seals-medinese
class: event
kind: persecution
label: { ar: "ختم الحجاج أعناق أهل المدينة", en: "Al-Hajjaj Seals the Necks of the People of Medina", es: "Al-Hajjaj sella los cuellos de la gente de Medina.", fr: "Al-Hajjaj scelle le cou des habitants de Médine", ur: "الحجاج اہل مدینہ کی گردنوں پر مہر لگاتا ہے۔", tr: "Haccac, Medine halkının boyunlarına dağladı.", id: "Hajjaj mencap leher penduduk Madinah." }
summary:
  ar: "في سنة أربع وسبعين سار الحجاج إلى المدينة فأخذ يتعنت أهلها ويستخف ببقايا من فيها من صحابة رسول الله وختمهم في أعناقهم وأيديهم يذلهم بذلك، كأنس وجابر بن عبد الله وسهل بن سعد الساعدي {cite:tarikh-khulafa-minhaj-1434 p. 354}."
  en: "In year 74 al-Hajjaj marched to Medina and took to harassing its people, humbling the remaining Companions by stamping their necks and hands with seals — among them Anas, Jabir ibn Abdullah and Sahl ibn Sa'd al-Sa'idi {cite:tarikh-khulafa-minhaj-1434 p. 354}."
  es: "En el año 74, al-Hajjaj marchó a Medina y se dedicó a hostigar a su gente, humillando a los Compañeros restantes estampándoles sellos en el cuello y las manos, entre ellos Anas, Jabir ibn Abdullah y Sahl ibn Sa'd al-Sa'idi {cite:tarikh-khulafa-minhaj-1434 p. 354}."
  fr: "En l'an 74, al-Hajjaj marcha sur Médine et se mit à harceler ses habitants, humiliant les Compagnons restants en leur marquant le cou et les mains de sceaux — parmi eux Anas, Jabir ibn Abdullah et Sahl ibn Sa'd al-Sa'idi {cite:tarikh-khulafa-minhaj-1434 p. 354}."
  ur: "سن 74 میں حجاج نے مدینہ کی طرف کوچ کیا اور وہاں کے لوگوں کو اذیت دینے کے لیے نکلے، باقی صحابہ کی گردنیں اور ہاتھوں پر مہریں لگا کر ان کو ذلیل کیا، ان میں انس، جابر ابن عبداللہ اور سہل بن سعد السعدی شامل ہیں۔ 354}۔"
  tr: "74. yılda Haccac, Medine'ye yürüdü ve oradaki halka zulmetmeye, orada bulunan Allah Resulü'nün sahabelerine hakaret etmeye başladı; Enes, Cabir bin Abdullah ve Sahl bin Saad el-Saadi gibi kişilerin boyunlarına ve ellerine dağ damgası vurarak onları aşağıladı. {Kaynak:tarikh-khulafa-minhaj-1434 s. 354}"
  id: "Pada tahun tujuh puluh empat, Al-Hajjaj berbaris ke Madinah dan mulai menindas penduduknya serta meremehkan para sahabat Rasulullah yang masih ada di sana, dan dia memberi cap pada leher dan tangan mereka untuk mempermalukan mereka, seperti Anas, Jabir bin Abdullah, dan Sahl bin Saad Al-Saadi {cite:tarikh-khulafa-minhaj-1434 p. 354}."
