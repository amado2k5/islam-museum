id: event/jahiz-final-years-basra
class: event
kind: other
label:
  ar: "الفالج يصيب الجاحظ في أواخر عمره بالبصرة"
  en: "Hemiplegia strikes al-Jahiz in his last years at Basra"
  ur: "بصرہ میں آخری عمر میں جاحظ کو فالج کی ضرب آئی"
  es: "La hemiplejia afectó a al-Jahiz en sus últimos años en Basora."
  fr: "Al-Jahiz est atteint d'hémiplégie durant ses dernières années à Bassorah."
  tr: "El-Cahiz, Basra'da geçirdiği son yıllarında felç geçirdi."
  id: "Al-Jahiz menderita stroke di tahun-tahun terakhirnya di Basra."
summary:
  ar: "في أواخر عمره أصاب الجاحظَ الفالجُ، فكان يطلي نصفه الأيمن بالصندل والكافور لشدة حرارته، ونصفه الأيسر لو قُرض بالمقاريض ما أحسّ به من خَدَره وشدة برده، وكان يقول في مرضه: استطلحت على جسدي الأضداد {cite:wafayat-ayan p. 405} {cite:muruj-al-dhahab p. 568-569}؛ ويروي ابن خلكان عن بعض البرامكة أنه ركب البحر وانحدر إلى البصرة فأُخبر أن الجاحظ بها عليل بالفالج، فزارَه قبل وفاته {cite:wafayat-ayan p. 405}."
  en: "In his last years al-Jahiz was struck by hemiplegia: he would anoint his right side with sandalwood and camphor for its burning heat, while his left side felt nothing even if cut with scissors, so numbed and cold it was; in his illness he said he had reconciled opposites upon his body {cite:wafayat-ayan p. 405} {cite:muruj-al-dhahab p. 568-569}. Ibn Khallikan relates from one of the Baramika that he sailed down to Basra, heard that al-Jahiz lay ill there with the palsy, and visited him before his death {cite:wafayat-ayan p. 405}."
  ur: "اپنی آخری عمر میں جاحظ کو فالج کی ضرب آئی: وہ دائیں شق کو صندل اور کافور سے ملتے کیونکہ اس میں شدید حرارت تھی، جب کہ بایاں شق قینچیوں سے کاٹا بھی جائے تو اس کے خدر اور سردی سے انہیں کچھ محسوس نہ ہوتا؛ اپنی بیماری میں وہ کہتے تھے کہ میں نے اپنے جسم پر متضاد چیزوں کو ملا دیا {cite:wafayat-ayan p. 405} {cite:muruj-al-dhahab p. 568-569}۔ ابن خلکان ایک برمکی سے روایت کرتے ہیں کہ وہ سمندر کے راستے بصرہ پہنچا اور سنا کہ جاحظ وہاں فالج میں مبتلا ہیں، تو وفات سے پہلے ان کی عیادت کی {cite:wafayat-ayan p. 405}."
  es: "En sus últimos años, al-Jahiz sufrió de hemiplejia: se ungía el lado derecho con sándalo y alcanfor por su intenso calor, mientras que el izquierdo no sentía nada, ni siquiera al cortarlo con tijeras, de tan entumecido y frío que estaba; en su enfermedad decía haber reconciliado los opuestos en su cuerpo {cite:wafayat-ayan p. 405} {cite:muruj-al-dhahab p. 568-569}. Ibn Khallikan relata, citando a uno de los Baramika, que navegó hasta Basora, oyó que al-Jahiz yacía allí enfermo de parálisis y lo visitó antes de su muerte {cite:wafayat-ayan p. 405}."
  fr: "Durant ses dernières années, al-Jahiz fut frappé d'hémiplégie: il s'oignait le côté droit de santal et de camphre pour soulager la brûlure, tandis que son côté gauche était insensible et froid, même lorsqu'on le coupait aux ciseaux. Dans sa maladie, il disait avoir réconcilié les contraires sur son corps (Wafayat-Ayan, p. 405; Muruj-al-Dhahab, p. 568-569). Ibn Khallikan rapporte d'après un Baramika qu'il se rendit à Bassora, apprit qu'al-Jahiz y était alité, atteint de paralysie, et lui rendit visite avant sa mort (Wafayat-Ayan, p. 405)."
  tr: "El-Cehiz, hayatının son yıllarında felç geçirdi. Sağ vücudunun yarısını yoğun ısısından dolayı sandal ağacı ve kafurla ovalardı; sol vücudu ise makasla kesilse bile uyuşukluğunu ve aşırı soğukluğunu hissetmezdi. Hastalığı sırasında şöyle derdi: \"Zıtlıklar bedenime karşı komplo kurdu.\" İbn Hallikan, Barmakidlerden birinin Basra'ya indiğini ve El-Cehiz'in orada felç geçirdiğini öğrendiğini, bu yüzden ölümünden önce onu ziyaret ettiğini rivayet eder."
  id: "Di tahun-tahun terakhirnya, Al-Jahiz menderita stroke. Ia mengoleskan separuh bagian kanan tubuhnya dengan cendana dan kamper karena panasnya yang sangat menyengat, dan separuh bagian kirinya, jika dipotong dengan gunting, ia tidak akan merasakan mati rasa dan dingin yang hebat. Ia biasa berkata selama sakitnya: “Hal-hal yang berlawanan telah bersekongkol melawan tubuhku.” Ibn Khallikan meriwayatkan bahwa salah seorang dari keluarga Barmakid berlayar ke Basra dan diberitahu bahwa Al-Jahiz berada di sana menderita stroke, sehingga ia mengunjunginya sebelum kematiannya."
