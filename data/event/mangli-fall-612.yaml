label: { ar: "قتل منكلي صاحب بلاد الجبل", en: "The fall and death of Mangli (612 AH)", es: "La caída y muerte de Mangli (612 AH)", fr: "La chute et la mort de Mangli (612 AH)", ur: "منگلی کا زوال اور موت ⁦(612ھ)⁩", tr: "Dağlık bölgenin hükümdarı Mankli öldürüldü.", id: "Mankli, penguasa wilayah pegunungan, terbunuh." }
summary:
  ar: "في جمادى الأولى سنة اثنتي عشرة وستمائة انهزم منكلي صاحب همذان وأصفهان والري وما بينها وقتل هارباً؛ كان قد ملك البلاد وقتل أيتغمش، فأنكر الديوان الخلفي ذلك عليه وحرض الخليفة صاحبه الأمير أوزبك بن البهلوان صاحب أذربيجان على قتاله وجلال الدين الإسماعيلي صاحب القلاع على مساعدته مقسمين البلاد بينهم، وجهز الخليفة عسكراً مقدمهم مملوكه مظفر الدين سنقر الملقب بوجه السبع وأمر مظفر الدين كوكبري صاحب إربل أن يكون مقدم العساكر جميعها فحضر ومعه عسكر الموصل وديار الجزيرة وحلب؛ تعلق منكلي بالجبال وضاقت الميرة على عسكر الخليفة حتى لم يمكنهم المقام أكثر من عشرة أيام لكنه طمع فنزل بعسكره فحمل على أوزبك فانهزم، فطمع أكثر ونزل من الغد في جميع عسكره فاقتتلوا أشد قتال فانهزم منكلي ومضى هارباً فقتل، وولي أغلمش ما كان بيده من الممالك {cite:kamil-ibn-al-athir p. 364-365}."
  en: "Jumada I 612: Mangli — master of Hamadan, Isfahan and Rayy — fell to the coalition al-Nasir built around his killer's ambition: Uzbek of Azerbaijan, the Ismaili Jalal al-Din of the castles, and the grand army under Kukburi of Irbil with Mosul, Jazira and Aleppo contingents. Trapped in the mountains he had the caliphal army near starvation — then gambled on a downhill charge, won the first day over Uzbek, lost the second, fled and was killed; his mamluk Aghlamish inherited the kingdoms {cite:kamil-ibn-al-athir p. 364-365}."
  es: "Jumada I 612: Mangli, señor de Hamadán, Isfahán y Rayy, cayó ante la coalición que al-Nasir había formado en torno a la ambición de su asesino: Uzbek de Azerbaiyán, el ismaelita Jalal al-Din de los castillos y el gran ejército bajo el mando de Kukburi de Erbil con contingentes de Mosul, Jazira y Alepo. Atrapado en las montañas, tenía al ejército califal al borde de la inanición; entonces se arriesgó con una carga cuesta abajo, venció a Uzbek el primer día, perdió el segundo, huyó y fue asesinado; su mameluco Aghlamish heredó los reinos {cite:kamil-ibn-al-athir p. 364-365}."
  fr: "Jumada Ier 612: Mangli, maître d’Hamadan, d’Ispahan et de Rayy, tomba aux mains de la coalition qu’al-Nasir avait constituée, nourrie par l’ambition de son assassin: l’Ouzbek d’Azerbaïdjan, l’Ismaélien Jalal al-Din des châteaux, et la grande armée de Kukburi d’Erbil, renforcée par des contingents de Mossoul, de Jazira et d’Alep. Piégé dans les montagnes, il avait réduit l’armée califale à l’extrême famine, puis tenta une charge en descente. Il remporta la première journée face à l’Ouzbek, mais perdit la seconde. Il s’enfuit et fut tué; son mamelouk Aghlamish hérita des royaumes (voir: Kamil ibn al-Athir, p. 364-365)."
  ur: "جمعا اول 612: منگلی - ہمدان، اصفہان اور رے کا آقا - اپنے قاتلوں کے عزائم کے گرد بنائے گئے اتحاد الناصر پر گر پڑا: آذربائیجان کے ازبک، قلعوں کے اسماعیلی جلال الدین، اور اربیل کے کوکبوری کے ماتحت عظیم الشان فوج موصل اور جازیرہ کے ساتھ۔ پہاڑوں میں پھنس کر اس کے پاس خلیفہ کی فوج فاقہ کشی کے قریب تھی - پھر نیچے کی طرف سے جوا کھیلا، پہلے دن ازبک پر جیت گیا، دوسرا ہارا، بھاگ گیا اور مارا گیا۔ اس کے مملوک اغلامش کو سلطنتیں وراثت میں ملی تھیں۔ 364-365}۔"
  tr: "Hicri 612 yılının Cemâde-i Ula ayında, Hamadan, İsfahan, Rayy ve aralarındaki toprakların hükümdarı Mankali, kaçarken yenilgiye uğratılıp öldürüldü. Toprakları fethetmiş ve Aytahmiş'i öldürmüştü. Halifenin sarayı bunu kınadı ve Halife, Azerbaycan hükümdarı dostu Prens Özbek ibn el-Bahlawan'ı onunla savaşmaya, kalelerin hükümdarı Celaleddin el-İsmaili'yi de ona yardım etmeye ve toprakları aralarında paylaşmaya teşvik etti. Halife, Memlük komutanı \"Vajh el-Sab'a\" (Aslan Yüzlü) lakaplı Muzaffar el-Din Sunkur'un önderliğinde bir ordu hazırladı. Erbil hükümdarı Muzaffar el-Din Kukburi'yi tüm orduların komutanı olarak atadı. Böylece Musul, Diyar el-Cezire ve Halep ordusuyla geldi. Mankali dağlara sığındı ve halifenin ordusunun erzakı tükendi, on günden fazla kalamadılar. Fakat o açgözlülüğe kapıldı ve ordusuyla birlikte aşağı inerek Özbekistan'a saldırdı; Özbekistan yenildi. Daha da açgözlülüğe kapıldı ve ertesi gün tüm ordusuyla birlikte aşağı indi. Şiddetli bir savaş yaşandı ve Mankali yenilerek kaçtı ve öldürüldü. Ağlamiş, elinde bulunan krallıkları ele geçirdi. 364-365}"
  id: "Pada bulan Jumada al-Ula tahun 612 H, Mankali, penguasa Hamadan, Isfahan, Rayy, dan wilayah di antara mereka, dikalahkan dan dibunuh saat melarikan diri. Ia telah menaklukkan wilayah tersebut dan membunuh Aytaghmish. Istana Khalifah mengecam hal ini, dan Khalifah menghasut temannya, Pangeran Uzbek ibn al-Bahlawan, penguasa Azerbaijan, untuk melawannya, dan Jalal al-Din al-Isma'ili, penguasa benteng, untuk membantunya, membagi wilayah di antara mereka. Khalifah mempersiapkan pasukan, yang dipimpin oleh Mamluknya, Muzaffar al-Din Sunqur, yang dijuluki \"Wajh al-Sab'a\" (Wajah Singa). Ia memerintahkan Muzaffar al-Din Kukburi, penguasa Irbil, untuk menjadi komandan semua pasukan. Maka ia datang dengan pasukan Mosul, Diyar al-Jazira, dan Aleppo. Mankali berlindung di pegunungan, dan pasukan Khalifah kehabisan perbekalan sehingga mereka tidak dapat bertahan lebih dari sepuluh hari. Tetapi ia menjadi serakah dan turun bersama pasukannya, menyerang Uzbek, yang dikalahkan. Ia menjadi lebih serakah lagi dan turun keesokan harinya dengan seluruh pasukannya. Mereka bertempur sengit, dan Mankali dikalahkan dan melarikan diri, lalu terbunuh. Aghlamish mengambil alih kerajaan-kerajaan yang berada di bawah kekuasaannya. 364-365}."
