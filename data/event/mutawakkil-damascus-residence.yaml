summary:
  ar: "في سنة ثلاث وأربعين قدم المتوكل إلى دمشق فأعجبته وبني له القصر بداريا وعزم على سكناها فقال يزيد بن محمد المهلبي إذا عزم الإمام على انطلاق فإن تدع العراق وساكنيه أظن الشام تشمت بالعراق فقد تبلى المليحة بالطلاق فبدا له ورجع بعد شهرين أو ثلاثة {cite:tarikh-khulafa-minhaj-1434 p. 541}."
  en: "In 243 al-Mutawakkil came to Damascus, admired it, built a palace at Darayya and resolved to reside — Yazid al-Muhallabi versified 'if the imam resolves to depart, forsaking Iraq, I think Syria will gloat; the lovely woman is worn out by divorce' — he changed his mind and returned after two or three months {cite:tarikh-khulafa-minhaj-1434 p. 541}."
