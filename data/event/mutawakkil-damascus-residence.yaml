id: event/mutawakkil-damascus-residence
class: event
kind: other
label: { ar: "عزم المتوكل على سكنى دمشق", en: "Al-Mutawakkil's resolve to reside in Damascus", es: "La decisión de Al-Mutawakkil de residir en Damasco", fr: "La détermination d'Al-Mutawakkil à résider à Damas", ur: "المتوکل کا دمشق میں سکونت اختیار کرنے کا عزم", tr: "El-Mutavakkil Şam'da ikamet etmeye karar verdi.", id: "Al-Mutawakkil memutuskan untuk menetap di Damaskus." }
summary:
  ar: "في سنة ثلاث وأربعين قدم المتوكل إلى دمشق فأعجبته وبني له القصر بداريا وعزم على سكناها فقال يزيد بن محمد المهلبي إذا عزم الإمام على انطلاق فإن تدع العراق وساكنيه أظن الشام تشمت بالعراق فقد تبلى المليحة بالطلاق فبدا له ورجع بعد شهرين أو ثلاثة {cite:tarikh-khulafa-minhaj-1434 p. 541}."
  en: "In 243 al-Mutawakkil came to Damascus, admired it, built a palace at Darayya and resolved to reside — Yazid al-Muhallabi versified 'if the imam resolves to depart, forsaking Iraq, I think Syria will gloat; the lovely woman is worn out by divorce' — he changed his mind and returned after two or three months {cite:tarikh-khulafa-minhaj-1434 p. 541}."
  es: "En 243, al-Mutawakkil llegó a Damasco, la admiró, construyó un palacio en Darayya y decidió residir allí. Yazid al-Muhallabi versificó: «Si el imán decide marcharse, abandonando Irak, creo que Siria se regocijará; la hermosa mujer está agotada por el divorcio». Cambió de opinión y regresó después de dos o tres meses {cite:tarikh-khulafa-minhaj-1434 p. 541}."
  fr: "En 243, al-Mutawakkil vint à Damas, l'admira, construisit un palais à Darayya et décida d'y résider — Yazid al-Muhallabi a écrit en vers: « Si l'imam décide de partir, abandonnant l'Irak, je pense que la Syrie se réjouira; la belle femme est épuisée par le divorce » — il changea d'avis et revint après deux ou trois mois {cite:tarikh-khulafa-minhaj-1434 p. 541}."
  ur: "243 میں المتوکل دمشق آیا، اس کی تعریف کی، درایا میں ایک محل تعمیر کیا اور رہائش کا عزم کیا - یزید المحلبی نے تصدیق کی کہ 'اگر امام عراق کو چھوڑ کر روانہ ہونے کا ارادہ کرتے ہیں تو میرے خیال میں شام خوش ہو جائے گا؛ پیاری عورت طلاق سے بیزار ہو جاتی ہے'' - اس نے اپنا ارادہ بدلا اور دو تین ماہ بعد واپس آیا۔ 541}۔"
  tr: "43 yılında El-Mutavakkil Şam'a geldi ve şehirden çok etkilendi. Daraya'da onun için bir saray inşa ettirdi ve orada yaşamaya karar verdi. Yezid bin Muhammed El-Muhallabi, \"İmam ayrılmaya karar verirse ve sen Irak'ı ve halkını terk edersen, bence Suriye Irak'a sevinecektir, çünkü güzel olan boşanmanın acısını çekmektedir\" dedi. Bunun üzerine fikrini değiştirdi ve iki üç ay sonra geri döndü. {cite:tarikh-khulafa-minhaj-1434 s. 541}"
  id: "Pada tahun 43, Al-Mutawakkil datang ke Damaskus dan terkesan oleh kota itu. Ia membangun istana untuknya di Daraya dan memutuskan untuk tinggal di sana. Yazid bin Muhammad Al-Muhallabi berkata, “Jika Imam memutuskan untuk pergi, dan engkau meninggalkan Irak dan penduduknya, aku pikir Suriah akan mengejek Irak, karena yang indah itu dilanda perceraian.” Maka ia mengubah pikirannya dan kembali setelah dua atau tiga bulan. {cite:tarikh-khulafa-minhaj-1434 p. 541}."
