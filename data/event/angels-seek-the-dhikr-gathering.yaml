id: event/angels-seek-the-dhikr-gathering
kind: other
label:
  ar: ملائكة سياحون يطلبون مجالس الذكر
  en: Roaming angels seek out gatherings of remembrance
  ur: سیاح ملائکہ ذکر کی مجلسیں تلاش کرتے ہیں
  es: "Los ángeles errantes buscan reuniones de recuerdo."
  fr: "Les anges errants recherchent les rassemblements du souvenir"
  tr: "Melekler, anma buluşmaları arayan gezginlerdir."
  id: "Para malaikat adalah pengembara yang mencari tempat berkumpul untuk mengenang."
summary:
  ar: 'قال الله في الحديث القدسي: إن لله ملائكة سياحين في الأرض فضلاً عن كتاب الناس، فإذا وجدوا أقواماً يذكرون الله تنادوا هلموا إلى بغيتكم فيجيئون فيحفون بهم إلى سماء الدنيا فيقول الله على أي شيء تركتم عبادي يصنعون فيقولون تركناهم يحمدونك ويكبرونك ويهلونك {cite:jami-al-tirmidhi} [[passage/tirmidhi-3600|الترمذي 3600]]؛ وفي لفظ: نزلت عليهم السكينة وغشيتهم الرحمة وحفتهم الملائكة وذكرهم الله فيمن عنده ومن بطأ به عمله لم يسرع به نسبه {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-36|الأربعون 36]].'
  en: 'God said in the hadith qudsi: Allah has roaming angels in the land beyond the recording ones; when they find people remembering Allah they call "come to what you seek," come and surround them up to the lowest heaven, and God says: what were My servants doing? They say: we left them praising You, magnifying You and declaring You one; then tranquility descends on them, mercy envelops them, the angels surround them, and God mentions them among those with Him — and whoever is slow in deed is not hastened by lineage {cite:jami-al-tirmidhi} [[passage/tirmidhi-3600|Tirmidhi 3600]]; in another wording: tranquility descends upon them, mercy envelops them, the angels surround them, God mentions them among those with Him, and whoever is slow in deed is not hastened by lineage {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-36|Forty 36]].'
  ur: 'اللہ نے حدیث قدسی میں کہا: اللہ کے بعض سیاح ملائکہ زمین پر ہیں جو لوگوں کے ناموں کے مصنفوں کے علاوہ ہیں؛ جب وہ اللہ کے ذکر کرنے والوں کو پاتے ہیں تو پکارتے ہیں آؤ اپنے مطلوب کی طرف، آتے ہیں اور انہیں آسمانِ دنیا تک گھیر لیتے ہیں، تو اللہ کہتا ہے میرے بندے کیا کر رہے تھے؟ وہ کہتے ہیں ہم نے انہیں تیری تسبیح اور تکبیر اور تہلیل کرتے چھوڑا؛ پھر سکینہ ان پر نازل ہوتی ہے، رحمت انہیں ڈھانپ لیتی ہے، ملائکہ انہیں گھیر لیتے ہیں، اور اللہ انہیں اپنے ہاں والوں میں یاد کرتا ہے — اور جو اپنے عمل میں سست ہو اسے اس کا نسب نہیں بڑھاتا {cite:jami-al-tirmidhi} [[passage/tirmidhi-3600|ترمذی 3600]]؛ دوسری روایت میں: سکینہ ان پر اترتی ہے، رحمت انہیں ڈھانپتی ہے، ملائکہ انہیں گھیرتے ہیں، اللہ انہیں اپنے ہاں والوں میں یاد کرتا ہے، اور جو اپنے عمل میں سست ہو اسے اس کا نسب نہیں بڑھاتا {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-36|چالیس 36]]۔'
  es: "Dios dijo en el hadiz qudsi: Allah tiene ángeles errantes en la tierra más allá de los que registran; cuando encuentran gente que recuerda a Allah, llaman \"venid a lo que buscáis\", venid y los rodean hasta el cielo más bajo, y Dios dice: ¿qué estaban haciendo Mis siervos? Dicen: los dejamos alabándote, engrandeciéndote y declarándote uno; entonces la tranquilidad desciende sobre ellos, la misericordia los envuelve, los ángeles los rodean, y Dios los menciona entre aquellos que están con Él, y quien es lento en la acción no es apresurado por el linaje {cite:jami-al-tirmidhi} [[passage/tirmidhi-3600|Tirmidhi 3600]]; En otra formulación: la tranquilidad desciende sobre ellos, la misericordia los envuelve, los ángeles los rodean, Dios los menciona entre los que están con Él, y quien es lento en la acción no es apresurado por el linaje {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-36|Cuarenta 36]]."
  fr: "Dieu dit dans le hadith qudsi: « Allah a des anges qui errent sur terre, au-delà de ceux qui consignent les événements. Lorsqu'ils trouvent des gens qui invoquent Allah, ils les appellent: \"Venez à ce que vous cherchez !\", \"Venez !\" et les entourent jusqu'au ciel le plus bas. Dieu dit alors: \"Que faisaient Mes serviteurs ?\" Ils répondent: \"Nous les avons laissés Te louer, Te glorifier et Te déclarer Unique.\" Puis la sérénité descend sur eux, la miséricorde les enveloppe, les anges les entourent et Dieu les mentionne parmi ceux qui sont auprès de Lui. Quant à celui qui est lent à agir, sa lignée ne le hâte pas. » en d'autres termes: la tranquillité descend sur eux, la miséricorde les enveloppe, les anges les entourent, Dieu les mentionne parmi ceux qui sont avec Lui, et celui qui est lent dans ses actes n'est pas hâté par la lignée {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-36|Quarante 36]]."
  tr: "Allah, Hadis-i Kudsi'de şöyle buyurmuştur: Allah'ın, insanların amellerini kaydedenlerin yanı sıra, yeryüzünde dolaşan melekleri de vardır. Allah'ı zikreden insanları bulduklarında birbirlerine, \"Aradığınız şeye gelin!\" diye seslenirler. Bunun üzerine gelirler ve onları en alt göğe kadar kuşatırlar. Allah buyurur ki: \"Kullarımı ne yaparken bıraktınız?\" Onlar da derler ki: \"Onları seni övmek, seni yüceltmek ve senin büyüklüğünü ilan etmekle görevlendirdik.\" {cite:jami-al-tirmidhi} [[passage/tirmidhi-3600|التِّرذي 3600]]; ve başka bir rivayette: Onlara huzur indi, rahmet onları kuşattı, melekler onları çevreledi ve Allah onları yanındakilere anlattı. Amelleriyle yavaşlayan kimseyi soyu hızlandırmaz. {alıntı:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-36|الأربعون 36]]."
  id: "Allah berfirman dalam Hadits Qudsi: Allah mempunyai malaikat-malaikat yang berkeliling di seluruh bumi, selain malaikat-malaikat yang mencatat amal perbuatan manusia. Apabila mereka menemukan orang-orang yang mengingat Allah, mereka saling berseru, “Datanglah kepada apa yang kalian cari!” Maka mereka datang dan mengelilingi mereka hingga ke langit terendah. Allah berfirman, “Apa yang kalian tinggalkan hamba-hamba-Ku lakukan?” Mereka menjawab, “Kami meninggalkan mereka memuji-Mu, mengagungkan-Mu, dan menyatakan kebesaran-Mu.” {cite:jami-al-tirmidhi} [[passage/tirmidhi-3600|التِّرذي 3600]]; dan dalam versi lain: Ketenangan turun kepada mereka, rahmat menyelimuti mereka, malaikat-malaikat mengelilingi mereka, dan Allah menyebutkan mereka kepada orang-orang yang bersama-Nya. Dan barangsiapa diperlambat oleh amal perbuatannya, maka keturunannya tidak akan mempercepatnya. {cite:ibnu-rajab-jami-ulum-hikam} [[passage/arbaun-36|الأربعون 36]]."
