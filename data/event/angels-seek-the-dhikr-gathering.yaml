id: event/angels-seek-the-dhikr-gathering
kind: other
label:
  ar: ملائكة سياحون يطلبون مجالس الذكر
  en: Roaming angels seek out gatherings of remembrance
  ur: سیاح ملائکہ ذکر کی مجلسیں تلاش کرتے ہیں
summary:
  ar: 'قال الله في الحديث القدسي: إن لله ملائكة سياحين في الأرض فضلاً عن كتاب الناس، فإذا وجدوا أقواماً يذكرون الله تنادوا هلموا إلى بغيتكم فيجيئون فيحفون بهم إلى سماء الدنيا فيقول الله على أي شيء تركتم عبادي يصنعون فيقولون تركناهم يحمدونك ويكبرونك ويهلونك {cite:jami-al-tirmidhi} [[passage/tirmidhi-3600|الترمذي 3600]]؛ وفي لفظ: نزلت عليهم السكينة وغشيتهم الرحمة وحفتهم الملائكة وذكرهم الله فيمن عنده ومن بطأ به عمله لم يسرع به نسبه {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-36|الأربعون 36]].'
  en: 'God said in the hadith qudsi: Allah has roaming angels in the land beyond the recording ones; when they find people remembering Allah they call "come to what you seek," come and surround them up to the lowest heaven, and God says: what were My servants doing? They say: we left them praising You, magnifying You and declaring You one; then tranquility descends on them, mercy envelops them, the angels surround them, and God mentions them among those with Him — and whoever is slow in deed is not hastened by lineage {cite:jami-al-tirmidhi} [[passage/tirmidhi-3600|Tirmidhi 3600]]; in another wording: tranquility descends upon them, mercy envelops them, the angels surround them, God mentions them among those with Him, and whoever is slow in deed is not hastened by lineage {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-36|Forty 36]].'
  ur: 'اللہ نے حدیث قدسی میں کہا: اللہ کے بعض سیاح ملائکہ زمین پر ہیں جو لوگوں کے ناموں کے مصنفوں کے علاوہ ہیں؛ جب وہ اللہ کے ذکر کرنے والوں کو پاتے ہیں تو پکارتے ہیں آؤ اپنے مطلوب کی طرف، آتے ہیں اور انہیں آسمانِ دنیا تک گھیر لیتے ہیں، تو اللہ کہتا ہے میرے بندے کیا کر رہے تھے؟ وہ کہتے ہیں ہم نے انہیں تیری تسبیح اور تکبیر اور تہلیل کرتے چھوڑا؛ پھر سکینہ ان پر نازل ہوتی ہے، رحمت انہیں ڈھانپ لیتی ہے، ملائکہ انہیں گھیر لیتے ہیں، اور اللہ انہیں اپنے ہاں والوں میں یاد کرتا ہے — اور جو اپنے عمل میں سست ہو اسے اس کا نسب نہیں بڑھاتا {cite:jami-al-tirmidhi} [[passage/tirmidhi-3600|ترمذی 3600]]؛ دوسری روایت میں: سکینہ ان پر اترتی ہے، رحمت انہیں ڈھانپتی ہے، ملائکہ انہیں گھیرتے ہیں، اللہ انہیں اپنے ہاں والوں میں یاد کرتا ہے، اور جو اپنے عمل میں سست ہو اسے اس کا نسب نہیں بڑھاتا {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-36|چالیس 36]]۔'
