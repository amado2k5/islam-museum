label: { ar: "فتح قلعة بسر", en: "The Taking of Qal'at Busr", es: "La toma de Qal'at Busr", fr: "La prise de Qal'at Busr", ur: "قلعت بسر کا لینا", tr: "Sör'ün kalesinin açılışı", id: "Membuka benteng Sir" }
summary:
  ar: "عند البلاذري: وجّه عقبة بن نافع بسر بن أبي أرطاة إلى قلعة من القيروان فافتتحها وقتل وسبى وهي اليوم تعرف بقلعة بسر وهي بالقرب من مدينة تدعى مجّانة عند معدن الفضة؛ وقد سمعت من يذكر أن موسى بن نصير وجّه بسراً وبسر ابن اثنتين وثمانين سنة إلى هذه القلعة فافتتحها وكان مولد بسر قبل وفاة النبي بسنة وغير الواقدي يزعم أنه قد روى عن النبي والله أعلم."
  en: "In al-Baladhuri: Uqba ibn Nafi' sent Busr ibn Abi Artat to a castle of Qayrawan's which he opened, killing and taking captive — it is known today as Qal'at Busr, near a town called Majjana by the silver mine; and I have heard it told that it was Musa ibn Nusayr who sent Busr — then eighty-two years old — to this castle, which he opened, Busr having been born a year before the Prophet's death; and others than al-Waqidi claim he related of the Prophet — God knows best."
  es: "En al-Baladhuri: Uqba ibn Nafi' envió a Busr ibn Abi Artat a un castillo de Qayrawan que abrió, matando y tomando prisionero; hoy se conoce como Qal'at Busr, cerca de una ciudad llamada Majjana junto a la mina de plata; y he oído decir que fue Musa ibn Nusayr quien envió a Busr —entonces de ochenta y dos años— a este castillo, que abrió, habiendo nacido Busr un año antes de la muerte del Profeta; y otros, además de al-Waqidi, afirman que él relató sobre el Profeta; Dios sabe mejor."
  fr: "Dans al-Baladhuri: Uqba ibn Nafi' envoya Busr ibn Abi Artat dans un château de Qayrawan qu'il ouvrit, tuant et faisant prisonnier — il est aujourd'hui connu sous le nom de Qal'at Busr, près d'une ville appelée Majjana, près de la mine d'argent; et j'ai entendu dire que c'est Musa ibn Nusayr qui envoya Busr — alors âgé de quatre-vingt-deux ans — dans ce château, qu'il ouvrit, Busr étant né un an avant la mort du Prophète; et d'autres, outre al-Waqidi, prétendent qu'il a rapporté du Prophète — Dieu est le plus savant."
  ur: "البلادوری میں ہے: عقبہ بن نافع نے بسر بن ابی ارتط کو قیروان کے ایک قلعے میں بھیجا جسے اس نے کھولا، قتل کر کے اسیر کر لیا- یہ آج کل قلات بصر کے نام سے جانا جاتا ہے، چاندی کی کان کے پاس مجانہ نامی قصبے کے قریب؛ اور میں نے سنا ہے کہ یہ موسیٰ بن نصیر ہی تھے جنہوں نے بسر کو جو اس وقت بیاسی سال کا تھا، کو اس قلعہ میں بھیجا تھا، جسے اس نے کھولا تھا، بسر نبی کی وفات سے ایک سال پہلے پیدا ہوا تھا۔ اور الواقدی کے علاوہ دوسروں کا دعویٰ ہے کہ اس نے نبی کی نسبت کی ہے - خدا بہتر جانتا ہے۔"
  tr: "El-Baladhuri'ye göre: Ukba ibn Nafi', Busr ibn Abi Artat'ı Kayrevan'daki bir kaleye gönderdi ve o da kaleyi fethetti, öldürüp esir aldı. Bugün bu kale Busr'ın kalesi olarak bilinir ve Mecana adlı bir şehrin yakınında, gümüş madeninin yanındadır. Birinin Musa ibn Nusayr'ın seksen iki yaşında olan Busr'ı bu kaleye gönderdiğini ve onun da kaleyi fethettiğini söylediğini duydum. Busr, Peygamber'in ölümünden bir yıl önce doğmuştur ve El-Vakidi'nin Peygamber'den rivayet ettiği iddiası dışında başka bir rivayet yoktur, Allah en iyisini bilir."
  id: "Menurut Al-Baladhuri: Uqba ibn Nafi’ mengutus Busr ibn Abi Artat ke sebuah benteng di Kairouan, dan ia menaklukkannya, membunuh dan menawan banyak orang. Saat ini benteng itu dikenal sebagai benteng Busr, dan terletak di dekat kota bernama Majana, dekat tambang perak. Saya mendengar seseorang menyebutkan bahwa Musa ibn Nusayr mengutus Busr, yang berusia delapan puluh dua tahun, ke benteng ini, dan ia menaklukkannya. Busr lahir setahun sebelum wafatnya Nabi, dan selain Al-Waqidi, ada yang mengklaim bahwa ia meriwayatkan dari Nabi, dan Allah Maha Mengetahui."
