label: { ar: "فتح قلعة بسر", en: "The Taking of Qal'at Busr" }
summary:
  ar: "عند البلاذري: وجّه عقبة بن نافع بسر بن أبي أرطاة إلى قلعة من القيروان فافتتحها وقتل وسبى وهي اليوم تعرف بقلعة بسر وهي بالقرب من مدينة تدعى مجّانة عند معدن الفضة؛ وقد سمعت من يذكر أن موسى بن نصير وجّه بسراً وبسر ابن اثنتين وثمانين سنة إلى هذه القلعة فافتتحها وكان مولد بسر قبل وفاة النبي بسنة وغير الواقدي يزعم أنه قد روى عن النبي والله أعلم."
  en: "In al-Baladhuri: Uqba ibn Nafi' sent Busr ibn Abi Artat to a castle of Qayrawan's which he opened, killing and taking captive — it is known today as Qal'at Busr, near a town called Majjana by the silver mine; and I have heard it told that it was Musa ibn Nusayr who sent Busr — then eighty-two years old — to this castle, which he opened, Busr having been born a year before the Prophet's death; and others than al-Waqidi claim he related of the Prophet — God knows best."
