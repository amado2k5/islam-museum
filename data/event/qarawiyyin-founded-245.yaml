label: { ar: "فاطمة الفهرية تؤسس جامع القرويين", en: "Fatima al-Fihri founds al-Qarawiyyin", es: "Fátima al-Fihri funda al-Qarawiyyin", fr: "Fatima al-Fihri fonde al-Qarawiyyin", ur: "فاطمہ الفہری نے القرویین کو پایا", tr: "Fatima el-Fihri Karaviyyin Camii'ni kurdu", id: "Fatima al-Fihri mendirikan Masjid Qarawiyyin" }
summary:
  ar: "أوقفت فاطمة بنت محمد الفهري أموالها على بناء جامع القرويين بفاس فافتُتح سنة 245هـ/859م وصار أشهر جامع للعلم في الغرب الإسلامي {cite:tarikh-ibn-khaldun-ibar}."
  en: "Fatima bint Muhammad al-Fihri endowed her fortune for the al-Qarawiyyin mosque at Fez, opened in 245/859 — the most famous mosque of learning in the Islamic West {cite:tarikh-ibn-khaldun-ibar}."
  ur: "فاطمہ بنت محمد فہری نے اپنی دولت فاس میں قرویین مسجد کے لیے وقف کی جو 245ھ/859ء میں کھلی — مغربی اسلام کا مشہور علمی مرکز {cite:tarikh-ibn-khaldun-ibar}."
  es: "Fatima bint Muhammad al-Fihri donó su fortuna para la mezquita al-Qarawiyyin en Fez, inaugurada en 245/859, la mezquita de aprendizaje más famosa del Occidente islámico {cite:tarikh-ibn-khaldun-ibar}."
  fr: "Fatima bint Muhammad al-Fihri a légué sa fortune à la mosquée al-Qarawiyyin de Fès, ouverte en 245/859 — la mosquée d'apprentissage la plus célèbre de l'Occident islamique {cite:tarikh-ibn-khaldun-ibar}."
  tr: "Fatıma bint Muhammed el-Fihri, parasını Fez'deki El-Karaviyyin Camii'nin inşasına adadı. Cami, Hicri 245/Miladi 859 yılında açıldı ve Batı İslam dünyasının en ünlü ilim camisi oldu. {cite:tarikh-ibn-khaldun-ibar}"
  id: "Fatima bint Muhammad al-Fihri menyumbangkan hartanya untuk membangun Masjid Al-Qarawiyyin di Fez. Masjid ini dibuka pada tahun 245 H/859 M dan menjadi masjid ilmu pengetahuan paling terkenal di dunia Islam Barat {cite:tarikh-ibn-khaldun-ibar}."
