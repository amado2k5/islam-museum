summary:
  ar: "توفي والد المقريزي سنة ٧٧٩هـ/١٣٧٧–١٣٧٨م وله خمسون سنة، وكان قد سبقه جده لأمه الفقيه اللغوي ابن الصائغ بثلاث سنين ⁦(٧٧٦هـ/١٣٧٥م)⁩، ففقد الفتى في نحو الرابعة عشرة أبوه وجده اللذين نشأ في حجرهما؛ وكان أبوه شافعياً وجده لأبيه حنبلياً، وتفقه المقريزي أولاً على المذهب الحنفي مذهب جده لأمه ثم تحول شافعياً بعد مدة طويلة واستقر عليه أمره {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 254-255}."
  en: "Al-Maqrizi's father died in 779/1377-8 at the age of fifty, three years after the maternal grandfather, the philologist-jurist Ibn al-Sa'igh (d. 776/1375); the boy of about fourteen thus lost the two men in whose care he had grown up. His father had been a Shafi'i and his paternal grandfather a Hanbali; al-Maqrizi himself first studied law on the Hanafi rite of his maternal grandfather, then turned Shafi'i after a long interval and settled on it {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 254-255}."
  ur: "مقریزی کے والد 779ھ/1377-78ء میں پچاس سال کی عمر میں فوت ہوئے، ان کی وفات سے تین سال پہلے نانا ابن الصائغ ⁦(وفات 776ھ)⁩ کا انتقال ہو چکا تھا؛ اس طرح تقریباً چودہ سال کا لڑکا ان دونوں سرپرستوں سے محروم ہو گیا جن کی کفالت میں پلا تھا۔ والد شافعی اور دادا حنبلی تھے؛ مقریزی نے پہلے اپنے نانا کے حنفی مذہب پر فقہ پڑھی، پھر ایک طویل عرصے کے بعد شافعی ہو گئے اور اسی پر جم گئے {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 254-255}۔"
  es: "El padre de Al-Maqrizi murió en 779/1377-8 a la edad de cincuenta años, tres años después de su abuelo materno, el filólogo y jurista Ibn al-Sa'igh (m. 776/1375); el muchacho, de unos catorce años, perdió así a los dos hombres bajo cuyo cuidado se había criado. Su padre había sido shafi'í y su abuelo paterno hanbalí; Al-Maqrizi estudió primero derecho según el rito hanafí de su abuelo materno, luego se convirtió al shafi'í después de un largo intervalo y se estableció en él {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 254-255}."
  fr: "Le père d'al-Maqrizi mourut en 779/1377-1378 à l'âge de cinquante ans, trois ans après son grand-père maternel, le philologue et juriste Ibn al-Sa'igh (mort en 776/1375). Le jeune garçon, âgé d'environ quatorze ans, perdit ainsi les deux hommes qui l'avaient élevé. Son père était chaféite et son grand-père paternel hanbalite. Al-Maqrizi lui-même étudia d'abord le droit selon le rite hanafite de son grand-père maternel, puis se convertit au chaféite après une longue période et s'y tint définitivement."
  tr: "El-Makrizi'nin babası 779 Hicri/1377-1378 Miladi yılında elli yaşında vefat etti. Anne tarafından dedesi, hukukçu ve dilbilimci İbn el-Sa'igh, ondan üç yıl önce (776 Hicri/1375 Miladi) vefat etmişti. Dolayısıyla, yaklaşık on dört yaşında olan genç adam, bakımını üstlendiği babasını ve dedesini kaybetti. Babası Şafiî, baba tarafından dedesi ise Hanbeli idi. El-Makrizi önce anne tarafından dedesinin mezhebi olan Hanefi mezhebine göre fıkıh eğitimi aldı, daha sonra uzun bir süre sonra Şafiî mezhebine geçti ve bu mezhebe bağlı kaldı. {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 254-255}."
  id: "Ayah Al-Maqrizi meninggal pada tahun 779 H/1377–1378 M pada usia lima puluh tahun. Kakek dari pihak ibunya, seorang ahli hukum dan linguistik bernama Ibn al-Sa’igh, telah meninggal tiga tahun sebelumnya (776 H/1375 M). Maka pemuda itu, pada usia sekitar empat belas tahun, kehilangan ayah dan kakeknya, yang telah merawatnya sejak kecil. Ayahnya adalah seorang pengikut mazhab Syafi'i dan kakek dari pihak ayahnya adalah seorang pengikut mazhab Hanbali. Al-Maqrizi pertama kali mempelajari fiqih menurut mazhab Hanafi, mazhab kakek dari pihak ibunya, kemudian setelah lama ia memeluk mazhab Syafi'i dan menetap di mazhab tersebut. {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 254-255}."
