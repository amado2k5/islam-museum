label:
  ar: "وفاة والد المقريزي، ٧٧٩هـ/١٣٧٨م"
  en: "Death of al-Maqrizi's father, 779/1378"
  ur: "مقریزی کے والد کی وفات، 779ھ/1378ء"
  es: "Muerte del padre de al-Maqrizi, 779/1378"
  fr: "Mort du père d'al-Maqrizi, 779/1378"
  tr: "El-Makrizi'nin babasının ölümü, H. 779/MS 1378"
