label: { ar: "بناء مدرسة إنجه ميناره بقونية، نحو ٦٦٣هـ", en: "The Ince Minareli Medrese is built at Konya, c. 663/1264", ur: "قونیہ میں انجے مینارلی مدرسہ کی تعمیر، تقریباً 663ھ/1264ء" }
summary:
  ar: "بُنيت مدرسة إنجه ميناره (ذات المئذنة الرفيعة) بقونية نحو سنة ٦٦٣هـ/١٢٦٤–١٢٦٥م بيد الصانع كالوك بن عبد الله؛ وقد رُممت كثيرًا وفقدت ثلثي مئذنتها الطوبية في حريق/انهيار سنة ١٣١٧هـ/١٨٩٩م، وكانت المئذنة تُكمل عصابات الكتابة العملاقة على مدخلها {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 289}."
  en: "The Ince Minareli Medrese ('slender-minaret madrasa') at Konya was built about 663/1264-65 by the master Kaluk (Koluk) ibn Abd Allah. Heavily restored, it lost two-thirds of its brick minaret in 1317/1899; the minaret had served as a foil to the portal's giant inscriptive bands {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 289}."
  ur: "قونیہ کا انجے مینارلی مدرسہ (پتلی مینار والا مدرسہ) تقریباً 663ھ/1264–65ء میں استاد کلوک بن عبد اللہ نے تعمیر کیا۔ بار بار مرمت کے باوجود اس کے اینٹوں کے مینار کا دو تہائی حصہ 1317ھ/1899ء میں گر گیا؛ یہ مینار داخلی دروازے کی دیوہیکل کتباتی پٹیوں کا مکمل تھا۔"
