label: { ar: "بناء مدرسة إنجه ميناره بقونية، نحو ٦٦٣هـ", en: "The Ince Minareli Medrese is built at Konya, c. 663/1264", ur: "قونیہ میں انجے مینارلی مدرسہ کی تعمیر، تقریباً 663ھ/1264ء", es: "La Ince Minareli Medrese se construye en Konya, c. 663/1264", fr: "La Medrese Ince Minareli est construite à Konya, vers 1930. 663/1264", tr: "Konya'daki İnce Minare Medresesi'nin inşası, yaklaşık 663 Hicri yılı.", id: "Pembangunan Madrasah Ince Minare di Konya, sekitar tahun 663 Hijriah" }
summary:
  ar: "بُنيت مدرسة إنجه ميناره ⁦(ذات المئذنة الرفيعة)⁩ بقونية نحو سنة ٦٦٣هـ/١٢٦٤–١٢٦٥م بيد الصانع كالوك بن عبد الله؛ وقد رُممت كثيرًا وفقدت ثلثي مئذنتها الطوبية في حريق/انهيار سنة ١٣١٧هـ/١٨٩٩م، وكانت المئذنة تُكمل عصابات الكتابة العملاقة على مدخلها {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 289}."
  en: "The Ince Minareli Medrese ('slender-minaret madrasa') at Konya was built about 663/1264-65 by the master Kaluk (Koluk) ibn Abd Allah. Heavily restored, it lost two-thirds of its brick minaret in 1317/1899; the minaret had served as a foil to the portal's giant inscriptive bands {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 289}."
  ur: "قونیہ کا انجے مینارلی مدرسہ ⁦(پتلی مینار والا مدرسہ)⁩ تقریباً 663ھ/1264–65ء میں استاد کلوک بن عبد اللہ نے تعمیر کیا۔ بار بار مرمت کے باوجود اس کے اینٹوں کے مینار کا دو تہائی حصہ 1317ھ/1899ء میں گر گیا؛ یہ مینار داخلی دروازے کی دیوہیکل کتباتی پٹیوں کا مکمل تھا۔"
  es: "La madraza Ince Minareli ('madrasa de minarete esbelto') en Konya fue construida alrededor del año 663/1264-65 por el maestro Kaluk (Koluk) ibn Abd Allah. Restaurada en gran medida, perdió dos tercios de su minarete de ladrillo en 1317/1899; el minarete había servido de contrapunto a las gigantescas bandas inscritas del portal {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 289}."
  fr: "La médersa Ince Minareli (« médersa au minaret élancé ») de Konya fut construite vers 663/1264-65 par le maître Kaluk (Koluk) ibn Abd Allah. Largement restaurée, elle perdit les deux tiers de son minaret en briques en 1317/1899; le minaret servait de contrepoint aux bandes inscrites géantes du portail {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 289}."
  tr: "Konya'daki İnce Minare Medresesi (yüksek minareli), yaklaşık 663 Hicri/1264-1265 Miladi yıllarında usta Kaluk bin Abdullah tarafından inşa edilmiştir; büyük ölçüde restore edilmiş ve 1317 Hicri/1899 Miladi yılında bir yangın/çökme sonucu tuğla minaresinin üçte ikisini kaybetmiştir. Minare, girişindeki devasa kitabe bantlarını tamamlamıştır. {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 289}"
  id: "Madrasah Ince Minare (dengan menara yang tinggi) di Konya dibangun sekitar tahun 663 H/1264–1265 M oleh pengrajin Kaluk bin Abdullah; madrasah ini banyak dipugar dan kehilangan dua pertiga menara batunya dalam kebakaran/runtuh pada tahun 1317 H/1899 M. Menara tersebut melengkapi pita prasasti raksasa di pintu masuknya {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 289}."
