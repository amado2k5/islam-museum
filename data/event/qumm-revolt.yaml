label: { ar: "حركة قم وإعادة فتحها", en: "Qumm's Revolt and Re-Conquest" }
summary:
  ar: "عند البلاذري: كان المأمون وجه علي بن هشام المروزي إلى قم وقد عصى أهلها وخالفوا ومنعوا الخراج وأمره بمعاوبتهم وأمده بالجيوش ففعل وقتل رئيسهم وهو يحيى بن عمران وهدم سور مدينتهم وألصقه بالأرض وجباها سبعة آلاف ألف درهم وكسراً وكان أهلها قبل ذلك يتظلمون من ألفي ألف درهم وقد تقاضوها في خلافة عبد الله المعتز بالله بن المتوكل فوجه إليهم موسى بن بغا عامله على الجبل لمحاربة الطالبيين الذين ظهروا بطبرستان ففتحت عنوة وقتل من أهلها خلق كثير وكتب المعتز في حمل جماعة من وجوهها."
  en: "In al-Baladhuri: when Qumm's people defied, withheld kharaj and rebelled, al-Ma'mun sent Ali ibn Hisham al-Marwazi with armies ordered to punish them — he killed their chief Yahya ibn Imran, demolished the city wall flat to the ground, and levied seven million dirhams plus increments, though they had earlier appealed against two million; this fell due in al-Mu'tazz's caliphate, when Musa ibn Bugha, his Jibal agent fighting the Tabaristan Talibis, was sent against them — the city was stormed, many of its people killed, and al-Mu'tazz ordered a group of its notables deported."
