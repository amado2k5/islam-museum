label: { ar: "حركة قم وإعادة فتحها", en: "Qumm's Revolt and Re-Conquest", es: "La revuelta y reconquista de Qumm", fr: "La révolte et la reconquête de Qumm", ur: "قم کی بغاوت اور دوبارہ فتح", tr: "Kum hareketi ve yeniden açılışı", id: "Pergerakan dan pembukaan kembali Qom" }
summary:
  ar: "عند البلاذري: كان المأمون وجه علي بن هشام المروزي إلى قم وقد عصى أهلها وخالفوا ومنعوا الخراج وأمره بمعاوبتهم وأمده بالجيوش ففعل وقتل رئيسهم وهو يحيى بن عمران وهدم سور مدينتهم وألصقه بالأرض وجباها سبعة آلاف ألف درهم وكسراً وكان أهلها قبل ذلك يتظلمون من ألفي ألف درهم وقد تقاضوها في خلافة عبد الله المعتز بالله بن المتوكل فوجه إليهم موسى بن بغا عامله على الجبل لمحاربة الطالبيين الذين ظهروا بطبرستان ففتحت عنوة وقتل من أهلها خلق كثير وكتب المعتز في حمل جماعة من وجوهها."
  en: "In al-Baladhuri: when Qumm's people defied, withheld kharaj and rebelled, al-Ma'mun sent Ali ibn Hisham al-Marwazi with armies ordered to punish them — he killed their chief Yahya ibn Imran, demolished the city wall flat to the ground, and levied seven million dirhams plus increments, though they had earlier appealed against two million; this fell due in al-Mu'tazz's caliphate, when Musa ibn Bugha, his Jibal agent fighting the Tabaristan Talibis, was sent against them — the city was stormed, many of its people killed, and al-Mu'tazz ordered a group of its notables deported."
  es: "En al-Baladhuri: cuando la gente de Qumm desafió, retuvo el kharaj y se rebeló, al-Ma'mun envió a Ali ibn Hisham al-Marwazi con ejércitos para castigarlos; mató a su jefe Yahya ibn Imran, demolió la muralla de la ciudad hasta los cimientos y les impuso siete millones de dirhams más incrementos, aunque anteriormente habían apelado contra dos millones; esto ocurrió durante el califato de al-Mu'tazz, cuando Musa ibn Bugha, su agente de Jibal que luchaba contra los talibanes de Tabaristán, fue enviado contra ellos; la ciudad fue asaltada, muchos de sus habitantes fueron asesinados y al-Mu'tazz ordenó la deportación de un grupo de sus notables."
  fr: "Dans al-Baladhuri: lorsque les habitants de Qumm défièrent, refusèrent le kharaj et se rebellèrent, al-Ma'mun envoya Ali ibn Hisham al-Marwazi avec des armées chargées de les punir — il tua leur chef Yahya ibn Imran, fit raser les remparts de la ville et imposa une amende de sept millions de dirhams, plus des majorations, bien qu'ils aient auparavant fait appel pour deux millions; cette somme était due sous le califat d'al-Mu'tazz, lorsque Musa ibn Bugha, son agent Jibal combattant les talibans du Tabaristan, fut envoyé contre eux — la ville fut prise d'assaut, nombre de ses habitants tués, et al-Mu'tazz ordonna la déportation d'un groupe de notables."
  ur: "البلادوری میں ہے: جب قم کے لوگوں نے خلاف ورزی کی، خرج کو روکا اور بغاوت کی، تو المعون نے علی بن ہشام المروازی کو فوجوں کے ساتھ بھیجا اور انہیں سزا دینے کا حکم دیا - اس نے ان کے سردار یحییٰ ابن عمران کو قتل کر دیا، شہر کی دیوار کو زمین پر گرا دیا، اور 70 لاکھ درہم لگائے، حالانکہ اس سے قبل انہوں نے دو ملین اضافے کے خلاف اپیل کی تھی۔ اس کی وجہ معتز کی خلافت میں پڑی، جب موسیٰ بن بگہ، اس کے جبل ایجنٹ، طبرستان طالبان سے لڑ رہے تھے، کو ان کے خلاف بھیجا گیا - شہر پر دھاوا بول دیا گیا، اس کے بہت سے لوگ مارے گئے، اور المعتز نے اپنے معززین کے ایک گروہ کو ملک بدر کرنے کا حکم دیا۔"
  tr: "El-Baladhuri'ye göre: El-Ma'mun, halkı isyan edip vergi ödemeyi reddeden Kum şehrine Ali bin Hişam el-Marvezi'yi gönderdi. Onları cezalandırmasını emretti ve ona ordular verdi. O da emre uyarak liderleri Yahya bin İmran'ı öldürdü, şehrin surlarını yıktı ve yerle bir etti. Yedi milyon dirhem ve biraz da para topladı. Bundan önce, halkı Abdullah el-Mu'tezz Billah bin el-Mutavakkil'in halifeliği döneminde topladıkları iki milyon dirhemden şikayet ediyordu. Bunun üzerine El-Mu'tezz, dağdaki valisi Musa bin Buga'yı Tabaristan'da ortaya çıkan Talibidlerle savaşması için gönderdi. Şehir zorla fethedildi ve halkının çoğu öldürüldü. El-Mu'tezz, ileri gelenlerden bir grubu götürmesi için emir verdi."
  id: "Menurut Al-Baladhuri: Al-Ma’mun mengutus Ali bin Hisham Al-Marwazi ke Qum, yang penduduknya telah memberontak dan menolak membayar pajak. Beliau memerintahkannya untuk menghukum mereka dan menyediakan pasukan, sehingga ia melakukannya dan membunuh pemimpin mereka, Yahya bin Imran, serta menghancurkan tembok kota mereka dan meratakannya dengan tanah. Ia mengumpulkan tujuh juta dirham dan sedikit uang kembalian. Sebelumnya, penduduknya telah mengeluh tentang dua juta dirham yang telah mereka kumpulkan selama kekhalifahan Abdullah Al-Mu’tazz Billah bin Al-Mutawakkil. Maka beliau mengutus Musa bin Bugha, gubernurnya di gunung, untuk melawan Taliban yang telah muncul di Tabaristan. Kota itu ditaklukkan dengan kekerasan, dan banyak penduduknya terbunuh. Al-Mu’tazz menulis surat untuk membawa sekelompok tokoh penting kota itu."
