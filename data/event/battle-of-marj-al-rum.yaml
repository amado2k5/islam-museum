summary:
  ar: "وقعة مرج الروم غرب دمشق: سار أبو عبيدة وخالد من فِحل قاصدين حمص فنزلا على ذي الكلاع، وبعث هرقل توذر البطريق حتى نزل بمرج الروم ونازل أبا عبيدة شنش الرومي إمدادًا له وردءًا لأهل حمص. سار توذر يطلب دمشق فسار خالد وراءه في جريدة، واستقبله يزيد بن أبي سفيان فاقتتلوا ولحق بهم خالد فأخذهم من خلفهم فلم يفلت إلا الشريد وقتل توذر وغنم المسلمون، وقاتل أبو عبيدة شنشًا بمرج الروم فقتلت الروم مقتلة عظيمة وقُتل شنش، وتبعهم المسلمون إلى حمص فسار هرقل إلى الرها {cite:kamil-ibn-al-athir p. 321}."
  en: "At Marj al-Rum west of Damascus, Heraclius sent the patrician Theodorus against the Muslims' march on Hims, backed by Shans's cavalry. When Theodorus broke off toward Damascus, Khalid shadowed him in a flying column; Yazid ibn Abi Sufyan met him head-on and Khalid took him from behind — none escaped but the scattered, Theodorus killed, the spoils shared between the two armies. Abu 'Ubayda then crushed Shans on the field and chased the remnant to Hims while Heraclius withdrew to Edessa {cite:kamil-ibn-al-athir p. 321}."
