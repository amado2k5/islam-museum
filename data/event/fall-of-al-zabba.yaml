label: { ar: "سقوط الزباء وقتل جذيمة", en: "Jadhima's death and al-Zabba's fall" }
summary:
  ar: "أطمعت الزباء ملكة الشام إلى الفرات جذيمة الأبرش في نفسها حتى قتلته، فنقب قصير نفقاً تحت سريرها ودخل عليها في صندوق على بعير فخرج عليها مصلتاً سيفه، وقال بعضهم إنها مصت خاتمها وفيه سم ساعة وقالت بيدي لا بيد عمرو، وخربت المدينة وسبيت الذراري، وكانت قد فعلت بمارد حصن دومة الجندل والأبلق حصن تيمياء ما فعلت حتى استعصيا عليها {cite:muruj-al-dhahab p. 409-412}."
  en: "al-Zabba's killing of Jadhima and her own fall to Qusayr's tunnel beneath the throne — dying by a poisoned ring (some say) with the famous cry; her city razed and her children captive, after Mard and al-Ablaq had defied her {cite:muruj-al-dhahab p. 409-412}."
