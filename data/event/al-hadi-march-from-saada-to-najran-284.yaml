id: event/al-hadi-march-from-saada-to-najran-284
class: event
kind: other
label:
  ar: تعبئة الهادي جيشه وخطبته وسيره من صعدة إلى نجران، جمادى الآخرة 284هـ
  en: Al-Hadi's drawing up of his army, his sermon and the march from Sa'da to Najran, Jumada II 284 AH
  ur: ہادی کا لشکر کی صف بندی، خطبہ اور صعدہ سے نجران کی روانگی، جمادی الآخرہ 284ھ
  es: "La formación del ejército por parte de Al-Hadi, su sermón y la marcha de Sa'da a Najran, Jumada II 284 AH."
  fr: "Le rassemblement de l'armée d'Al-Hadi, son sermon et la marche de Sa'da à Najran, Jumada II 284 AH"
  tr: "El-Hadi ordusunu seferber etti, konuşmasını yaptı ve Sa'dah'dan Necran'a, Cemada el-Ahirah 284 H.'ye yürüdü."
  id: "Al-Hadi mengerahkan pasukannya, menyampaikan pidatonya, dan berbaris dari Sa'dah ke Najran, Jumada al-Akhirah 284 H."
summary:
  ar: بعد دعوة وفد نجران جمع الهادي الناس وخرج بهم خارج صعدة فعبّأهم ميمنة وميسرة وقلباً ووصف لهم القتال، وخطب الجمعة لأربع خلون من جمادى الآخرة 284هـ في الجهاد وإصلاح العباد، ثم سار يوم الأحد لست خلون منه بعسكر كثيف من خولان وغيرهم إلى نجران في مسيرة يومين.
  en: After the Najran delegation's call al-Hadi gathered the people and led them out of Sa'da, drew them up in right, left and centre and described fighting to them; he preached on Friday 4 Jumada II 284 AH on jihad and reform, and on Sunday the 6th marched with a dense force of Khawlan and others to Najran, a two-day journey.
  ur: نجران کے وفد کی دعوت کے بعد ہادی نے لوگوں کو جمع کیا، صعدہ کے باہر لے جا کر دائیں، بائیں اور قلب میں صف بندی کی اور لڑائی کا طریقہ بتایا؛ جمعہ 4 جمادی الآخرہ 284ھ کو جہاد اور اصلاح پر خطبہ دیا، اور اتوار 6 کو خولان وغیرہ کے بھاری لشکر کے ساتھ دو دن کی مسافت پر نجران روانہ ہوئے۔
  es: "Tras la llamada de la delegación de Najran, al-Hadi reunió a la gente y los sacó de Sa'da, los formó en fila derecha, izquierda y centro y les describió cómo luchar; el viernes 4 de Jumada II de 284 AH predicó sobre la yihad y la reforma, y el domingo 6 marchó con una nutrida fuerza de Khawlan y otros hacia Najran, un viaje de dos días."
  fr: "Après l'appel de la délégation de Najran, al-Hadi rassembla le peuple et le conduisit hors de Sa'da, le disposa à droite, à gauche et au centre et leur décrivit le combat; il prêcha le vendredi 4 Jumada II 284 AH sur le jihad et la réforme, et le dimanche 6, il marcha avec une force dense de Khawlan et d'autres vers Najran, un voyage de deux jours."
  tr: "Necran heyetinin daveti üzerine El-Hadi, halkı topladı ve onları Sa'de'den çıkardı. Onları sağ, sol ve merkez olmak üzere üç gruba ayırdı ve onlara savaşın nasıl olacağını anlattı. Hicri 284 yılının Cemadi el-Ahire ayının dördüncü günü, cihat ve halkın ıslahı üzerine Cuma hutbesi verdi. Ardından, Hicri 6. Pazar günü, Havlan ve diğer yerlerden büyük bir orduyla iki günlük bir yolculukla Necran'a yürüdü."
  id: "Setelah undangan delegasi Najran, Al-Hadi mengumpulkan orang-orang dan membawa mereka keluar dari Sa'dah. Beliau mengorganisir mereka menjadi kelompok kanan, kiri, dan tengah, dan menjelaskan tentang pertempuran kepada mereka. Beliau menyampaikan khutbah Jumat pada tanggal 4 Jumada al-Akhirah 284 H tentang jihad dan reformasi umat. Kemudian, pada hari Minggu tanggal 6 bulan itu, beliau berbaris dengan pasukan besar dari Khawlan dan lainnya ke Najran dalam perjalanan dua hari."
