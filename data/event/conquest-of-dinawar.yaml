  fr: "Dinawar et al-Saymara pris lors du balayage après Nahavand, lorsque 'Umar ordonna aux musulmans de parcourir les terres perses {cite:kamil-ibn-al-athir p. 399}."
  ur: "دیناور اور الصیمارہ کو نہاوند کے بعد جھاڑو میں لے لیا گیا، جب عمر نے مسلمانوں کو فارس کی سرزمین سے نکلنے کا حکم دیا تھا۔ 399}۔"
  tr: "Nahavand Savaşı'nın ardından Dinar, Simera ve ötesinin fethi, Ömer'in emriyle Müslümanların Pers topraklarına doğru genişlemesinin bir parçasıydı. {Kaynak: Kamil ibn al-athir, s. 399}"
  id: "Penaklukan Dinawar, Simera dan sekitarnya, setelah Pertempuran Nahavand, merupakan bagian dari perluasan wilayah Muslim ke tanah Persia atas perintah Umar {cite:kamil-ibn-al-athir p. 399}."
