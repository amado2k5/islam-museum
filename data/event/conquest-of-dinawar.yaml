  ar: "فتح الدينور والصيمرة وما وراءهما في أثر وقعة نهاوند، ضمن انسياح المسلمين في بلاد العجم بأمر عمر {cite:kamil-ibn-al-athir p. 399}."
  en: "Dinawar and al-Saymara taken in the sweep after Nahavand, when 'Umar ordered the Muslims to range through the Persian lands {cite:kamil-ibn-al-athir p. 399}."
