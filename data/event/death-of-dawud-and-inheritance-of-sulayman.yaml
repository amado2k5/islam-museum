id: event/death-of-dawud-and-inheritance-of-sulayman
class: event
kind: death
tags: [wasaya-browser, wasaya-prophets, wasaya-wasiyya, wasaya-ihtidar, wasaya-mirath]
label:
  ar: "وفاة داود وإرث سليمان له"
  en: "Death of Dawud and Sulayman's inheritance from him"
  ur: "داؤد کی وفات اور سلیمان کی وراثت"
summary:
  ar: "يروي ابن كثير عن أبي هريرة، في مسند أحمد، أن داود مات فجأة بعد أن جاءه ملك الموت في داره، وأن ابنه سليمان تولى أمره بعده {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 604} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 605}. وتختلف الروايات في يوم الوفاة وفي عمره، ويذكر ابن كثير أن الله وهبه أربعين سنة من عمر آدم فبلغ مئة سنة {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 604}. وفي آية النمل ورث سليمان داود؛ ويقول ابن كثير إن المراد وراثة النبوة والملك لا المال {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 609}، وينقل القرطبي عن الكلبي أن لداود تسعة عشر ولداً ورث سليمان من بينهم نبوته وملكه {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 5106}. ويذكر ابن الأثير أن داود أوصى سليمان بإتمام بناء المسجد في بيت المقدس {cite:kamil-ibn-al-athir scan vol. 3 p. 178}."
  en: "Ibn Kathir reports from Abu Hurayra, in the Musnad of Ahmad, that Dawud died suddenly after the angel of death came to him in his house, and that his son Sulayman saw to him afterwards {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 604} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 605}. The reports differ on the day of death and his age; Ibn Kathir records that God gave him forty years from Adam's life, making a hundred {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 604}. The verse of al-Naml says Sulayman inherited from Dawud; Ibn Kathir says this is inheritance of prophethood and kingship, not wealth {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 609}, and al-Qurtubi quotes al-Kalbi that Dawud had nineteen sons and Sulayman alone inherited his prophethood and kingship {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 5106}. Ibn al-Athir adds that Dawud charged Sulayman with completing the mosque at Bayt al-Maqdis {cite:kamil-ibn-al-athir scan vol. 3 p. 178}."
  ur: "ابن کثیر مسندِ احمد میں ابو ہریرہ سے روایت کرتے ہیں کہ داؤد اچانک فوت ہوئے، ملک الموت ان کے گھر میں آیا تھا، اور ان کے بیٹے سلیمان نے ان کے بعد معاملات سنبھالے {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 604} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 605}۔ وفات کے دن اور عمر میں روایتیں مختلف ہیں؛ ابن کثیر لکھتے ہیں کہ اللہ نے آدم کی عمر میں سے چالیس سال انھیں دیے اور یوں سو سال ہوئے {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 604}۔ سورۂ نمل کی آیت میں ہے کہ سلیمان داؤد کے وارث ہوئے؛ ابن کثیر کے نزدیک نبوت اور بادشاہت کی وراثت مراد ہے، مال کی نہیں {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 609}، اور قرطبی کلبی سے نقل کرتے ہیں کہ داؤد کے انیس بیٹے تھے اور سلیمان ہی ان کی نبوت اور بادشاہت کے وارث ہوئے {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 5106}۔ ابن اثیر بتاتے ہیں کہ داؤد نے سلیمان کو بیت المقدس کی مسجد مکمل کرنے کی وصیت کی {cite:kamil-ibn-al-athir scan vol. 3 p. 178}۔"
