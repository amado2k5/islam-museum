summary:
  ar: "بطاقة أولية لنهب حلب سنة ٩٦٢م، اقتحام نقفور فوقاس المدينة الحمدانية وسبي أهلها؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Sack of Aleppo in 962, Nikephoros Phokas's storming of the Hamdanid city and its people's captivity; its sources are not yet checked on the page."
