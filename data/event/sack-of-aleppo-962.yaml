  ur: "962 میں حلب کی بوری کے لیے ڈرافٹ کارڈ، نیکیفوروس فوکس کا ہمدانی شہر پر حملہ اور اس کے لوگوں کی قید؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Bu metin, MS 962'de Halep'in yağmalanması, Nicephorus Phocas tarafından Hamdanid şehrinin ele geçirilmesi ve halkının köleleştirilmesine dair ön bir anlatımdır; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Catatan awal tentang penjarahan Aleppo pada tahun 962 M, penyerbuan kota Hamdanid oleh Nicephorus Phocas dan perbudakan penduduknya; sumber-sumbernya belum ditinjau di halaman ini."
