label: { ar: "الغلاء والوباء العام سنة 448", en: "The general famine and plague of 448", es: "La hambruna y la peste generalizadas de 448", fr: "La famine et la peste générales de 448", ur: "448 کا عام قحط اور طاعون", tr: "448 yılında yüksek fiyatlar ve genel salgın", id: "Harga tinggi dan wabah penyakit umum pada tahun 448" }
summary:
  ar: "في سنة ثمان وأربعين وأربعمائة كان القحط الشديد بديار مصر والوباء المفرط، وكانت العراق مموجة بالفتن والخوف والنهب من جماعة طغرل بك ومن الأعراب ومن البساسيري؛ وقع الغلاء والوباء في الناس فاشتد الجوع حتى أكلوا الميتة، وبلغ المكوك من بزر البقلة سبعة دنانير والرمانة ديناراً والخيارة ديناراً، وعمّ الغلاء والوباء جميع البلاد؛ وورد من مصر أن ثلاثة لصوص نقبوا داراً فوُجدوا عند الصباح موتى أحدهم على باب البيت والثاني على رأس الدرجة والثالث على الثياب المكورة {cite:shadharat-dhahab p. 278}."
  en: "In 448 Egypt saw severe drought and rampant plague while Iraq was awash with strife, fear and looting from Tughril Beg's bands, the Bedouin and al-Basasiri; famine and pestilence struck until people ate carrion — a makuk of clover seed reached seven dinars, a pomegranate a dinar — and a report from Egypt told of three thieves found dead mid-burglary, one at the door, one on the stairs, one on the folded clothes {cite:shadharat-dhahab p. 278}."
  es: "En 448, Egipto sufrió una grave sequía y una plaga desenfrenada, mientras que Irak estaba sumido en la discordia, el miedo y el saqueo por parte de las bandas de Tughril Beg, los beduinos y al-Basasiri; la hambruna y la peste azotaron hasta el punto de que la gente comía carroña —un makuk de semillas de trébol llegó a costar siete dinares, una granada un dinar— y un informe procedente de Egipto hablaba de tres ladrones encontrados muertos en pleno robo, uno en la puerta, otro en las escaleras y otro sobre la ropa doblada {cita: shadharat-dhahab p. 278}."
  fr: "En 448, l'Égypte connut une grave sécheresse et une peste galopante tandis que l'Irak était en proie aux conflits, à la peur et aux pillages des bandes de Tughril Beg, des Bédouins et d'al-Basasiri; la famine et la peste frappèrent au point que les gens mangèrent de la charogne — un makuk de graines de trèfle coûtait sept dinars, une grenade un dinar — et un rapport d'Égypte racontait que trois voleurs avaient été retrouvés morts en plein cambriolage, l'un à la porte, l'un dans l'escalier, l'autre sur les vêtements pliés {cite:shadharat-dhahab p. 278}."
  ur: "448 میں مصر نے شدید خشک سالی اور طاعون کو دیکھا جب کہ عراق طغرل بیگ کے گروہوں، بدویوں اور البصیری سے لڑائی، خوف اور لوٹ مار سے بھرا ہوا تھا۔ قحط اور وبا پھیلی یہاں تک کہ لوگوں نے مردار کھا لیا - سہ شاخہ کا ایک مکوک سات دینار تک پہنچ گیا، ایک انار ایک دینار - اور مصر کی ایک رپورٹ میں بتایا گیا کہ تین چور مردہ چوری کرتے ہوئے پائے گئے، ایک دروازے پر، ایک سیڑھیوں پر، ایک تہہ کیے ہوئے کپڑوں پر۔ 278}۔"
  tr: "Hicri 448 yılında Mısır topraklarında şiddetli bir kıtlık ve aşırı bir salgın hastalık hüküm sürdü. Irak, Tuğrul Bey, Bedeviler ve el-Basasiri grubunun yağmalama, korku ve çekişmeleriyle boğuşuyordu. Yüksek fiyatlar ve salgın hastalıklar halkı perişan etti ve açlık o kadar şiddetlendi ki leş bile yediler. Bir ölçek semizotu tohumu yedi dinara, bir nar bir dinara ve bir salatalık bir dinara satılıyordu. Yüksek fiyatlar ve salgın hastalıklar tüm topraklara yayıldı. Mısır'dan gelen haberlere göre, üç hırsız bir eve girmiş ve sabahleyin ölü bulunmuşlardı; biri evin kapısında, ikincisi merdivenlerin başında, üçüncüsü ise sarılmış giysilerin üzerinde. {cite:shadharat-dhahab s. 278}"
  id: "Pada tahun 448 Hijriah, terjadi kelaparan hebat di wilayah Mesir dan wabah penyakit yang meluas. Irak dilanda perselisihan, ketakutan, dan penjarahan oleh kelompok Tughril Beg, suku Badui, dan al-Basasiri. Harga tinggi dan wabah penyakit menimpa rakyat, dan kelaparan menjadi begitu parah sehingga mereka memakan bangkai. Satu takaran biji purslane mencapai tujuh dinar, satu buah delima satu dinar, dan satu buah mentimun satu dinar. Harga tinggi dan wabah penyakit menyebar ke seluruh negeri. Dilaporkan dari Mesir bahwa tiga pencuri membobol sebuah rumah dan ditemukan tewas di pagi hari, satu di pintu rumah, yang kedua di puncak tangga, dan yang ketiga di atas pakaian yang digulung. {cite:shadharat-dhahab hlm. 278}"
