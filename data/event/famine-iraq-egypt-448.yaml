label: { ar: "الغلاء والوباء العام سنة 448" }
summary:
  ar: "في سنة ثمان وأربعين وأربعمائة كان القحط الشديد بديار مصر والوباء المفرط، وكانت العراق مموجة بالفتن والخوف والنهب من جماعة طغرل بك ومن الأعراب ومن البساسيري؛ وقع الغلاء والوباء في الناس فاشتد الجوع حتى أكلوا الميتة، وبلغ المكوك من بزر البقلة سبعة دنانير والرمانة ديناراً والخيارة ديناراً، وعمّ الغلاء والوباء جميع البلاد؛ وورد من مصر أن ثلاثة لصوص نقبوا داراً فوُجدوا عند الصباح موتى أحدهم على باب البيت والثاني على رأس الدرجة والثالث على الثياب المكورة {cite:shadharat-dhahab p. 278}."
  en: "In 448 Egypt saw severe drought and rampant plague while Iraq was awash with strife, fear and looting from Tughril Beg's bands, the Bedouin and al-Basasiri; famine and pestilence struck until people ate carrion — a makuk of clover seed reached seven dinars, a pomegranate a dinar — and a report from Egypt told of three thieves found dead mid-burglary, one at the door, one on the stairs, one on the folded clothes {cite:shadharat-dhahab p. 278}."
