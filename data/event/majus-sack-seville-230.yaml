label: { ar: "نزول المجوس بإشبيلية (230هـ)" }
summary:
  ar: "في أيام عبد الرحمن بن الحكم ظهر المجوس ودخلوا إشبيلية، فأرسل إليهم العساكر مع القواد من قرطبة فنزل المجوس من مراكبهم وقاتلوا المسلمين فهُزموا بعد مقام صعب، ثم جاءت العساكر مدداً فهزمهم المسلمون وغنموا بعض مراكبهم وأحرقوها؛ ورحل المجوس إلى شدونة فأقاموا عليها يومين، ثم إلى لتيلة فأغاروا وسبوا، ثم باجة فأشبونة، وانقطع خبرهم حين أقلعوا من أشبونة وسكنت البلاد، وتقدم عبد الرحمن بإصلاح ما خربوه واكتفى حاميتها {cite:nafh-tib-maqqari pp. 381–382}."
  en: "The great Majus raid of AH 230: the northern sea-raiders entered Seville itself; Córdoba's army fought them 'after a hard stand,' burnt some of their ships, and the raiders withdrew down the coast through Sidonia, Niebla, Beja and Lisbon before vanishing — Abd al-Rahman II then repaired what they had wrecked and reinforced the garrisons {cite:nafh-tib-maqqari pp. 381–382}."
