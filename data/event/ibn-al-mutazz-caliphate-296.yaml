id: event/ibn-al-mutazz-caliphate-296
class: event
kind: civil-war
label: { ar: "خلع المقتدر الأول وبيعة ابن المعتز", en: "The first deposition of al-Muqtadir and the allegiance to Ibn al-Mu'tazz", es: "La primera declaración de al-Muqtadir y la lealtad a Ibn al-Mu'tazz", fr: "Le premier dépôt d'al-Muqtadir et l'allégeance à Ibn al-Mu'tazz", ur: "مقتدیر کی پہلی معزولی اور ابن المعتز کی بیعت", tr: "I. Muktedir'in tahttan indirilmesi ve İbnü'l-Mu'tazz'a biat", id: "Penggulingan al-Muqtadir I dan kesetiaannya kepada Ibnu al-Mu'tazz" }
summary:
  ar: "في العشرين من ربيع الأول سنة ست ركب الخلعاء والمقتدر يلعب الأكرة فهرب وأغلقت الأبواب وقتل الوزير العباس بن الحسن وجماعة وأرسل إلى ابن المعتز فحضر القواد والقضاة والأعيان فبايعوه بالخلافة ولقبوه الغالب بالله واستوزر محمد بن داوود بن الجراح واستقضى أبا المثنى أحمد بن يعقوب ونفذت الكتب بخلافته، ثم ألقى الله في قلوبهم الرعب فانصرفوا بلا قتال وهرب ابن المعتز ووقع النهب والقتل في بغداد وقبض على الفقهاء والأمراء الذين خلعوه فقتلوا إلا أربعة وحبس ابن المعتز ثم أخرج ميتاً {cite:tarikh-khulafa-minhaj-1434 p. 585-586}. وعند ابن الأثير لقّب ابن المعتز المرتضى بالله لا الغالب، وكان الذي تولى قتل الوزير العباس بن الحسن الحسين بن حمدان وبدر المعتضدي ووصيف فقتلوه في طريقه وهو سائر إلى بستان له وقتلوا معه فاتكاً، وركض الحسين بن حمدان إلى الشاطبة ليقتل المقتدر فلم يصادفه إذ طُعن هناك فدخل الدار وأُغلقت الأبواب، وكان المنادي لابن المعتز ينادي يا معشر العامة هذا لخليفتكم السلم البربهاري لأن الحسين بن القاسم البربهاري كان مقدم الحنابلة وإليه من العامة اعتماد عظيم، ولما اصعد مؤنس الخادم ومؤنس الخازن وغريب الخال ومن معهم في الماء بالسامريات يقاتلون هرب أصحاب ابن المعتز قبل أن يصلوا إليهم واختفى ابن المعتز ووزيره محمد بن داود بن الجراح في داره {cite:kamil-ibn-al-athir p. 11-13} وعند ابن الجوزي كان خلع المقتدر الأول بعد استخلافه بأربعة أشهر وسبعة أيام وذلك عند قتل العباس بن الحسن الوزير وفاتك مولى المعتضد واجتماع أكثر الناس ببغداد على البيعة لأبي العباس عبد الله بن المعتز ولقّبوه الراضي {cite:muntazam-ibn-al-jawzi p. 361}. وعند ابن الجوزي اجتمع جماعة القواد والكتاب والقضاة على خلع المقتدر وتناظروا فيمن يجعل مكانه فاجتمع رأيهم على عبد الله بن المعتز فأجابهم على أن لا يكون في ذلك سفك دم {cite:muntazam-ibn-al-jawzi p. 372-373}."
  en: "On 20 Rabi' I 296, while al-Muqtadir played polo, the conspirators struck: the vizier al-Abbas ibn al-Hasan was killed and Ibn al-Mu'tazz was brought in, hailed caliph as 'al-Ghalib bi'llah', with Muhammad ibn Dawud ibn al-Jarrah as vizier and Abu al-Muthanna as qadi. The next day terror fell on them — they scattered without a fight; Ibn al-Mu'tazz fled, was imprisoned, then brought out dead {cite:tarikh-khulafa-minhaj-1434 p. 585-586}."
  es: "El 20 de Rabi' I de 296, mientras al-Muqtadir jugaba al polo, los conspiradores atacaron: el visir al-Abbas ibn al-Hasan fue asesinado y trajeron a Ibn al-Mu'tazz, aclamado califa como 'al-Ghalib bi'llah', con Muhammad ibn Dawud ibn al-Jarrah como visir y Abu al-Muthanna como cadí. Al día siguiente, el terror se apoderó de ellos: se dispersaron sin luchar; Ibn al-Mu'tazz huyó, fue encarcelado y luego liberado muerto {cite:tarikh-khulafa-minhaj-1434 p. 585-586}."
  fr: "Le 20 Rabi' I 296, alors qu'al-Muqtadir jouait au polo, les conspirateurs passèrent à l'acte: le vizir al-Abbas ibn al-Hasan fut assassiné et Ibn al-Mu'tazz fut intronisé calife sous le nom d'« al-Ghalib bi'llah », avec Muhammad ibn Dawud ibn al-Jarrah comme vizir et Abu al-Muthanna comme cadi. Le lendemain, la terreur s'abattit sur eux; ils se dispersèrent sans combattre. Ibn al-Mu'tazz s'enfuit, fut emprisonné, puis retrouvé mort."
  ur: "20 ربیع الثانی 296 کو جب مقتدیر پولو کھیل رہے تھے، سازشیوں نے حملہ کیا: وزیر العباس ابن الحسن کو قتل کر دیا گیا اور ابن المعتز کو لایا گیا، خلیفہ کو 'الغالب باللہ' کہا گیا، محمد بن داؤد الجراح اور ابوذر بن الزبان الذی الذین کے ساتھ۔ قادی اگلے دن ان پر دہشت طاری ہو گئی - وہ بغیر لڑائی کے بکھر گئے۔ ابن المعتز بھاگ گیا، قید کیا گیا، پھر مردہ نکالا گیا۔ 585-586}۔"
  tr: "Altıncı yılın Rebiü'l-Evvel ayının yirminci gününde, isyancılar Muktadir iskambil oynarken dışarı çıktılar. Muktadir kaçtı, kapılar kapatıldı ve vezir Abbas ibn Hasan ve bir grup öldürüldü. İbn Mutazz'ı çağırdı ve komutanlar, kadı ve ileri gelenler gelip ona halife olarak biat ettiler ve ona \"Galib-i Billa\" unvanını verdiler. Muhammed ibn Davud ibn Cerrah'ı vezir, Ebu el-Muthanna Ahmed ibn Yakub'u da kadı olarak atadı ve halifeliğiyle birlikte mektuplar gönderildi. Bunun üzerine Allah onların kalplerine korku saldı, böylece savaşmadan ayrıldılar ve İbn Mutazz kaçtı. Bağdat'ta yağma ve katliamlar oldu ve onu deviren hukukçular ve prensler, dördü hariç, tutuklanıp öldürüldü. İbn Mutazz hapsedildi, sonra ölü olarak çıkarıldı. {cite:tarikh-khulafa-minhaj-1434 s. 585-586}. İbn el-Athir'e göre, İbn el-Mu'tazz'a el-Ghalib değil, el-Murtada Billah unvanı verilmiştir. Vezir el-Abbas ibn el-Hasan el-Hüseyin ibn Hamdan, Badr el-Mu'tadidi ve Wasif'in öldürülmesini gerçekleştiren oydu. Onu bahçesine giderken öldürdüler ve onunla birlikte Fatik'i de öldürdüler. El-Hüseyin ibn Hamdan, el-Muktadir'i öldürmek için el-Şatifa'ya koştu, ancak orada bıçaklandığı için onu bulamadı. Bunun üzerine eve girdi ve kapılar kapalıydı. İbn el-Mu'tezz'in habercisi, \"Ey insanlar, bu sizin halifeniz el-Selam el-Barbahari içindir!\" diye sesleniyordu; çünkü el-Hüseyin ibn el-Kâsim el-Barbahari, Hanbelilerin lideriydi ve halk ona büyük güven duyuyordu. Hizmetkâr Mu'nis, hazinedar Mu'nis, Garib el-Hal ve onlarla birlikte olanlar, Samiriyelilerle savaşmak için suya çıktıklarında, İbn el-Mu'tezz'in arkadaşları onlara ulaşmadan önce kaçtılar ve İbn el-Mu'tezz ile veziri Muhammed ibn Davud ibn el-Cerrah evinde saklandılar. 11-13} İbn el-Cevzi'ye göre, el-Muktadir I, vezir el-Abbas ibn el-Hasan ve el-Mu'tezz'in azatlı kölesi Fatik'in öldürülmesinin ardından tahta çıkışından dört ay yedi gün sonra görevden alındı. Bağdat halkının çoğu daha sonra Ebu el-Abbas Abdullah ibn el-Mu'tazz'a biat etti ve ona el-Radi (İçin) lakabını taktı. {cite:muntazam-ibn-al-jawzi s. 361}. İbn el-Jawzi ayrıca, bir grup komutan, kâtip ve kadının el-Muqtadir'i görevden almak için toplandığını ve yerine kimin geçeceği konusunda tartıştıklarını belirtir. Abdullah ibn el-Mu'tazz üzerinde anlaştılar ve o da kan dökülmemesi şartıyla kabul etti. {cite:muntazam-ibn-al-jawzi s. 372-373}."
  id: "Pada tanggal 20 Rabi' al-Awwal tahun enam, para pemberontak keluar saat al-Muqtadir sedang bermain kartu. Ia melarikan diri, pintu-pintu ditutup, dan wazir al-Abbas ibn al-Hasan beserta sekelompok orang terbunuh. Ia memanggil Ibn al-Mu'tazz, dan para komandan, hakim, dan tokoh terkemuka datang dan menyatakan kesetiaan kepadanya sebagai khalifah, dan mereka memberinya gelar al-Ghalib Billah. Ia mengangkat Muhammad ibn Dawud ibn al-Jarrah sebagai wazir dan Abu al-Muthanna Ahmad ibn Ya'qub sebagai hakim, dan surat-surat pengangkatan khalifah dikirimkan. Kemudian Allah menanamkan rasa takut di hati mereka, sehingga mereka pergi tanpa berperang, dan Ibn al-Mu'tazz melarikan diri. Penjarahan dan pembunuhan terjadi di Baghdad, dan para ahli hukum dan pangeran yang telah menggulingkannya ditangkap dan dibunuh, kecuali empat orang. Ibn al-Mu'tazz dipenjara, kemudian ia dikeluarkan dalam keadaan sudah meninggal. {cite:tarikh-khulafa-minhaj-1434 p. 585-586}. Menurut Ibn al-Athir, Ibn al-Mu'tazz diberi gelar al-Murtada Billah, bukan al-Ghalib. Dialah yang melakukan pembunuhan terhadap wazir al-'Abbas ibn al-Hasan al-Husayn ibn Hamdan, Badr al-Mu'tadidi, dan Wasif. Mereka membunuhnya dalam perjalanan ke kebunnya, dan mereka membunuh Fatik bersamanya. Al-Husayn ibn Hamdan berlari ke al-Shatifa untuk membunuh al-Muqtadir, tetapi dia tidak menemukannya, karena dia ditikam di sana. Jadi dia masuk ke rumah, dan pintu-pintu tertutup. Utusan Ibnu al-Mu'tazz berseru, \"Wahai manusia, ini untuk Khalifah kalian, al-Salam al-Barbahari,\" karena al-Husayn ibn al-Qasim al-Barbahari adalah pemimpin mazhab Hanbali, dan rakyat sangat percaya kepadanya. Ketika Mu'nis sang pelayan, Mu'nis sang bendahara, Gharib al-Khal, dan orang-orang yang bersama mereka naik ke air bersama orang-orang Samaria untuk berperang, para sahabat Ibnu al-Mu'tazz melarikan diri sebelum mereka sampai kepada mereka, dan Ibnu al-Mu'tazz dan wazirnya Muhammad ibn Dawud ibn al-Jarrah bersembunyi di rumahnya. 11-13} Menurut Ibnu al-Jawzi, al-Muqtadir I digulingkan empat bulan tujuh hari setelah naik takhta, menyusul pembunuhan al-Abbas ibn al-Hasan, wazir, dan Fatik, orang merdeka milik al-Mu'tadid. Sebagian besar penduduk Baghdad kemudian menyatakan kesetiaan kepada Abu al-Abbas Abdullah ibn al-Mu'tazz, yang mereka juluki al-Radi (Yang Puas). {cite:muntazam-ibn-al-jawzi hlm. 361}. Ibn al-Jawzi juga menyatakan bahwa sekelompok komandan, ahli Taurat, dan hakim berkumpul untuk menggulingkan al-Muqtadir dan berdebat siapa yang harus menggantikannya. Mereka sepakat pada Abdullah ibn al-Mu'tazz, yang setuju dengan syarat tidak boleh terjadi pertumpahan darah. {cite:muntazam-ibn-al-jawzi hlm. 372-373}."
