id: event/ibn-al-mutazz-caliphate-296
class: event
kind: civil-war
label: { ar: "خلع المقتدر الأول وبيعة ابن المعتز" }
summary:
  ar: "في العشرين من ربيع الأول سنة ست ركب الخلعاء والمقتدر يلعب الأكرة فهرب وأغلقت الأبواب وقتل الوزير العباس بن الحسن وجماعة وأرسل إلى ابن المعتز فحضر القواد والقضاة والأعيان فبايعوه بالخلافة ولقبوه الغالب بالله واستوزر محمد بن داوود بن الجراح واستقضى أبا المثنى أحمد بن يعقوب ونفذت الكتب بخلافته، ثم ألقى الله في قلوبهم الرعب فانصرفوا بلا قتال وهرب ابن المعتز ووقع النهب والقتل في بغداد وقبض على الفقهاء والأمراء الذين خلعوه فقتلوا إلا أربعة وحبس ابن المعتز ثم أخرج ميتاً {cite:tarikh-khulafa-minhaj-1434 p. 585-586}. وعند ابن الأثير لقّب ابن المعتز المرتضى بالله لا الغالب، وكان الذي تولى قتل الوزير العباس بن الحسن الحسين بن حمدان وبدر المعتضدي ووصيف فقتلوه في طريقه وهو سائر إلى بستان له وقتلوا معه فاتكاً، وركض الحسين بن حمدان إلى الشاطبة ليقتل المقتدر فلم يصادفه إذ طُعن هناك فدخل الدار وأُغلقت الأبواب، وكان المنادي لابن المعتز ينادي يا معشر العامة هذا لخليفتكم السلم البربهاري لأن الحسين بن القاسم البربهاري كان مقدم الحنابلة وإليه من العامة اعتماد عظيم، ولما اصعد مؤنس الخادم ومؤنس الخازن وغريب الخال ومن معهم في الماء بالسامريات يقاتلون هرب أصحاب ابن المعتز قبل أن يصلوا إليهم واختفى ابن المعتز ووزيره محمد بن داود بن الجراح في داره {cite:kamil-ibn-al-athir p. 11-13}"
  en: "On 20 Rabi' I 296, while al-Muqtadir played polo, the conspirators struck: the vizier al-Abbas ibn al-Hasan was killed and Ibn al-Mu'tazz was brought in, hailed caliph as 'al-Ghalib bi'llah', with Muhammad ibn Dawud ibn al-Jarrah as vizier and Abu al-Muthanna as qadi. The next day terror fell on them — they scattered without a fight; Ibn al-Mu'tazz fled, was imprisoned, then brought out dead {cite:tarikh-khulafa-minhaj-1434 p. 585-586}."
