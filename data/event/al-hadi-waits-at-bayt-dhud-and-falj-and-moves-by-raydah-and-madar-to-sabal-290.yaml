id: event/al-hadi-waits-at-bayt-dhud-and-falj-and-moves-by-raydah-and-madar-to-sabal-290
class: event
kind: other
label:
  ar: "انتظار الهادي في بيت ذؤد وفلج ثم مسيره بريدة ومدر إلى صبل ونزوله ببيت حاضر، 290هـ"
  en: "Al-Hadi waits at Bayt Dhu'd and Falj, goes by Raydah and Madar to Sabal and moves by night to Bayt Hadir, 290 AH"
  ur: "ہادی کا بیت ذؤد اور فلج میں انتظار، ریدہ اور مدر سے ہوتے ہوئے صبل جانا اور رات کو بیت حاضر منتقل ہونا، 290ھ"
  es: "Al-Hadi espera en Bayt Dhu'd y Falj, pasa por Raydah y Madar hasta Sabal y se traslada de noche a Bayt Hadir, 290 AH."
  fr: "Al-Hadi patiente à Bayt Dhu'd et Falj, puis passe par Raydah et Madar pour rejoindre Sabal et se rend de nuit à Bayt Hadir, en l'an 290 de l'Hégire."
  tr: "Al-Hadi'nin Züd ve Falaj'ın evinde beklenmesi, ardından Burayde ve Madar'a, oradan da Sabl'a yolculuğu ve Hadir'in evinde kalması, Hicri 290"
  id: "Menunggu Al-Hadi di rumah Dhu'd dan Falaj, kemudian perjalanannya ke Buraydah dan Madar ke Sabl dan tinggalnya di rumah Hadir, 290 H."
summary:
  ar: "استنظرت همدان الهادي أياماً فأقام ببيت ذؤد ثم تحول إلى فلج بالظاهر حتى استهل جمادى الآخرة، ثم سار إلى ريدة ومدر ومشرق خولان فنزل قرية يقال لها صبل، فلما بلغه نزول ابن خلف ببيت عقب خرج بالليل إلى بيت حاضر ينتظر مدداً من الجعفري وابني الروية."
  en: "Hamdan asked al-Hadi to wait for them some days and he stayed at Bayt Dhu'd, then moved to a place called Falj in al-Zahir until the new moon of Jumada II; he then went to Raydah, Madar and the east of Khawlan and halted at a village called Sabal, and when news came that Ibn Khalaf had halted at Bayt Aqb he left by night for Bayt Hadir, to wait for aid from al-Ja'fari and the two sons of al-Ruwayya."
  ur: "ہمدان نے ہادی سے چند دن مہلت مانگی تو وہ بیت ذؤد میں ٹھہرے، پھر فلج نامی جگہ منتقل ہوئے جو الظاہر میں ہے اور جمادی الآخرہ کا چاند نکلنے تک رہے؛ پھر ریدہ، مدر اور خولان کے مشرق سے ہوتے ہوئے صبل نامی بستی میں اترے، اور جب خبر آئی کہ ابن خلف بیت عقب اترا ہے تو وہ رات کو بیت حاضر چلے گئے تاکہ جعفری اور ابنی الرویہ کی کمک کا انتظار کریں۔"
  es: "Hamdan le pidió a al-Hadi que los esperara unos días y se quedó en Bayt Dhu'd, luego se trasladó a un lugar llamado Falj en al-Zahir hasta la luna nueva de Jumada II; luego fue a Raydah, Madar y al este de Khawlan y se detuvo en una aldea llamada Sabal, y cuando llegaron noticias de que Ibn Khalaf se había detenido en Bayt Aqb partió de noche hacia Bayt Hadir, para esperar la ayuda de al-Ja'fari y los dos hijos de al-Ruwayya."
  fr: "Hamdan demanda à al-Hadi de les attendre quelques jours et il resta à Bayt Dhu'd, puis se déplaça vers un endroit appelé Falj à al-Zahir jusqu'à la nouvelle lune de Jumada II; il se rendit ensuite à Raydah, Madar et à l'est de Khawlan et s'arrêta dans un village appelé Sabal, et lorsque la nouvelle parvint qu'Ibn Khalaf s'était arrêté à Bayt Aqb, il partit de nuit pour Bayt Hadir, pour attendre l'aide d'al-Ja'fari et des deux fils d'al-Ruwayya."
  tr: "Hamdan el-Hadi günlerce bekledi, bu yüzden Dhu'd'un evinde kaldı, sonra Cemâdî el-Ahir'in başlangıcına kadar el-Zahir'deki Falaj'a gitti, sonra Rıda, Madar ve Havlan'ın doğu kısmına gitti ve Sabl adlı bir köyde mola verdi. İbn Halef'in Akab'ın evinde mola verdiğini duyunca, geceleyin Hadir'in evine gitti ve el-Caferi ile el-Raviye'nin iki oğlundan takviye kuvvet bekledi."
  id: "Hamdan al-Hadi menunggu berhari-hari, lalu ia tinggal di rumah Dhu’d, kemudian pindah ke Falaj di al-Zahir hingga awal Jumada al-Akhirah, lalu pergi ke Rida, Madar dan bagian timur Khawlan dan berhenti di sebuah desa bernama Sabl. Ketika ia mendengar bahwa Ibnu Khalaf telah berhenti di rumah Aqab, ia keluar pada malam hari ke rumah Hadir, menunggu bala bantuan dari al-Ja’fari dan kedua putra al-Rawiya."
