id: event/al-hadi-waits-at-bayt-dhud-and-falj-and-moves-by-raydah-and-madar-to-sabal-290
class: event
kind: other
label:
  ar: "انتظار الهادي في بيت ذؤد وفلج ثم مسيره بريدة ومدر إلى صبل ونزوله ببيت حاضر، 290هـ"
  en: "Al-Hadi waits at Bayt Dhu'd and Falj, goes by Raydah and Madar to Sabal and moves by night to Bayt Hadir, 290 AH"
  ur: "ہادی کا بیت ذؤد اور فلج میں انتظار، ریدہ اور مدر سے ہوتے ہوئے صبل جانا اور رات کو بیت حاضر منتقل ہونا، 290ھ"
summary:
  ar: "استنظرت همدان الهادي أياماً فأقام ببيت ذؤد ثم تحول إلى فلج بالظاهر حتى استهل جمادى الآخرة، ثم سار إلى ريدة ومدر ومشرق خولان فنزل قرية يقال لها صبل، فلما بلغه نزول ابن خلف ببيت عقب خرج بالليل إلى بيت حاضر ينتظر مدداً من الجعفري وابني الروية."
  en: "Hamdan asked al-Hadi to wait for them some days and he stayed at Bayt Dhu'd, then moved to a place called Falj in al-Zahir until the new moon of Jumada II; he then went to Raydah, Madar and the east of Khawlan and halted at a village called Sabal, and when news came that Ibn Khalaf had halted at Bayt Aqb he left by night for Bayt Hadir, to wait for aid from al-Ja'fari and the two sons of al-Ruwayya."
  ur: "ہمدان نے ہادی سے چند دن مہلت مانگی تو وہ بیت ذؤد میں ٹھہرے، پھر فلج نامی جگہ منتقل ہوئے جو الظاہر میں ہے اور جمادی الآخرہ کا چاند نکلنے تک رہے؛ پھر ریدہ، مدر اور خولان کے مشرق سے ہوتے ہوئے صبل نامی بستی میں اترے، اور جب خبر آئی کہ ابن خلف بیت عقب اترا ہے تو وہ رات کو بیت حاضر چلے گئے تاکہ جعفری اور ابنی الرویہ کی کمک کا انتظار کریں۔"
