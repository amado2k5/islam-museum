label: { ar: "مقتل عبد الله بن خازم", en: "The Killing of Abdallah ibn Khazim", es: "El asesinato de Abdallah ibn Khazim", fr: "L'assassinat d'Abdallah ibn Khazim", ur: "عبداللہ بن خزیم کا قتل", tr: "Abdullah bin Hazim'in öldürülmesi", id: "Pembunuhan Abdullah bin Khazim" }
summary:
  ar: "ولى ابن خازم ابنه محمداً هراة فهاجت بنو تميم وقتلوه فظفر أبوه بعثمان بن بشير بن المحتفز فقتله صبراً وقتل رجلاً من بني تميم فدبرت تميم خلعه فتحول جماعة منهم مع بجير بن ورقاء الصرعي إلى أبرشهر وخلعوه وأرسل ثقله مع ابنه موسى إلى الترمذ وورد كتاب عبد الملك بن مروان عليه بولاية خراسان فأطعم رسوله الكتاب وقال ما كنت لألقى الله وقد نكثت بيعة ابن حواري رسول الله وبايعت ابن طريده فكتب عبد الملك إلى بكير بن وشاح بولايتها وقد كان بكير خلعه وأخذ السلاح وبيت المال ودعا أهل مرو إلى بيعة عبد الملك فبايعوه فمضى ابن خازم يريد ابنه موسى بالترمذ فأتبعه بجير فقاتله بقرب مرو وخرج وكيع بن الدورقية القريعي بدرعه وسلاحه فحمل عليه مع بجير فطعناه وقعد وكيع على صدره وقال يا لثارات دويلة ودويلة أخوه لأمه قتله ابن خازم فتنخم ابن خازم في وجهه وقال لعنك الله أتقتل كبش مضر بأخيك علج لا يساوي كفاً من نوى فقال وكيع ذق يا ابن عجلى مثل ما قد أذقتني ولا تحسبني كنت عن ذاك غافلاً وقتل معه ابناه عنبسة ويحيى وطعن طهمان مولاه جد يعقوب بن داود كاتب المهدي وأتى بكير برأسه فبعث به إلى عبد الملك فنصب بدمشق وقطعوا يده اليمنى وبعثوا بها إلى ولد عثمان بن بشير."
  en: "Tamim rose at Herat and killed Ibn Khazim's son Muhammad; the father took Uthman ibn Bashir ibn al-Muhtafiz and slew him in cold blood, with a Tamimi. Tamim conspired his deposition — Bujayr ibn Waraqa's party shifted to Abarshahr and renounced him as he sent his baggage with Musa to Tirmidh. Abd al-Malik's writ appointing him arrived; he fed the messenger the letter: 'I could not meet God having broken my bay'a to the son of the Prophet's hawari and given bay'a to the son of his exile'. Abd al-Malik gave it to Bukayr ibn Wishah — who had already deposed him, seized arms and treasury, and won Marw's bay'a. Marching for Tirmidh, Ibn Khazim was overtaken by Bujayr near Marw; Waki' ibn al-Dawraqiyya came out in arms and with Bujayr stabbed him, sat on his chest crying 'for Duwayla's vengeance' — his slain half-brother — as Ibn Khazim spat 'curse you: you kill Mudar's ram for a brother not worth a palm of date-stones', and Waki' answered in verse. His sons Anbasa and Yahya fell with him, his mawla Tahman — grandfather of the Mahdi's secretary Ya'qub ibn Dawud — was wounded; Bukayr sent his head to be displayed at Damascus and his severed right hand to Uthman ibn Bashir's sons."
  es: "Tamim se levantó en Herat y mató al hijo de Ibn Khazim, Muhammad; el padre tomó a Uthman ibn Bashir ibn al-Muhtafiz y lo mató a sangre fría, con un Tamimi. Tamim conspiró para su deposición: el grupo de Bujayr ibn Waraqa se trasladó a Abarshahr y lo repudió cuando envió su equipaje con Musa a Tirmidh. Llegó el edicto de Abd al-Malik que lo nombraba; le entregó al mensajero la carta: 'No pude encontrarme con Dios habiendo roto mi bay'a al hijo del hawari del Profeta y dado bay'a al hijo de su exilio'. Abd al-Malik se la dio a Bukayr ibn Wishah, quien ya lo había depuesto, se había apoderado de armas y tesoros, y había ganado el bay'a de Marw. Marchando hacia Tirmidh, Ibn Khazim fue alcanzado por Bujayr cerca de Marw; Waki' ibn al-Dawraqiyya salió armado y, junto con Bujayr, lo apuñaló. Se sentó sobre su pecho clamando \"por la venganza de Duwayla\" —su medio hermano asesinado— mientras Ibn Khazim escupía \"maldito seas: matas al carnero de Mudar por un hermano que no vale ni la palma de una mano de dátiles\", y Waki' respondió en verso. Sus hijos Anbasa y Yahya cayeron con él; su mawla Tahman —abuelo del secretario del Mahdi, Ya'qub ibn Dawud— resultó herido; Bujayr envió su cabeza para ser exhibida en Damasco y su mano derecha cercenada a los hijos de Uthman ibn Bashir."
  fr: "Tamim se souleva à Hérat et tua Muhammad, le fils d'Ibn Khazim. Le père, accompagné de Tamimi, fit assassiner de sang-froid Uthman ibn Bashir ibn al-Muhtafiz. Tamim complota sa destitution. Le groupe de Bujayr ibn Waraqa se déplaça vers Abarshahr et le renia, tandis qu'il envoyait ses bagages avec Musa à Tirmidh. L'ordre d'Abd al-Malik le nommant parvint à destination. Il remit la lettre au messager: « Je ne pouvais rencontrer Dieu après avoir rompu mon serment d'allégeance au fils du hawari du Prophète et prêté allégeance au fils de son exilé. » Abd al-Malik la remit à Bukayr ibn Wishah, qui l'avait déjà destitué, s'était emparé des armes et du trésor, et avait obtenu l'allégeance de Marw. En marche vers Tirmidh, Ibn Khazim fut rattrapé par Bujayr près de Marw. Waki' ibn al-Dawraqiyya sortit en armes et, avec Bujayr, le poignarda. Assis sur sa poitrine, il criait « pour la vengeance de Duwayla » — son demi-frère assassiné — tandis qu'Ibn Khazim crachait: « Maudit sois-tu ! Tu as tué le bélier de Mudar pour un frère qui ne vaut même pas une poignée de dattes ! » Waki' répondit en vers. Ses fils Anbasa et Yahya périrent avec lui, son mawla Tahman — grand-père du secrétaire du Mahdi, Ya'qub ibn Dawud — fut blessé; Bujayr envoya sa tête être exposée à Damas et sa main droite tranchée aux fils d'Uthman ibn Bashir."
  ur: "تمیم نے ہرات پر چڑھائی کی اور ابن خزیم کے بیٹے محمد کو قتل کر دیا۔ باپ نے عثمان بن بشیر ابن المحتف کو پکڑ کر تمیمی کے ساتھ سرد خون میں قتل کر دیا۔ تمیم نے اپنی معزولی کی سازش کی - بوجیر بن ورقہ کی جماعت ابرشہر کی طرف چلی گئی اور موسیٰ کے ساتھ اپنا سامان ترمذ کے پاس بھیجتے ہوئے اسے ترک کر دیا۔ عبد الملک کی رٹ پہنچی جس میں ان کی تقرری ہوئی۔ اس نے قاصد کو خط کھلایا: 'میں خدا سے نہیں مل سکا کہ رسول اللہ کے حواری کے بیٹے سے بیعت توڑ دی اور اس کے جلاوطن بیٹے کو بیعت دے دی'۔ عبد الملک نے اسے بکیر بن وشح کو دے دیا - جو اسے پہلے ہی معزول کرچکا تھا، اسلحے اور خزانے پر قبضہ کرچکا تھا اور مرو کی بیعت جیت لی تھی۔ ترمذ کی طرف کوچ کرتے ہوئے، ابن خزیم کو مرو کے قریب بوجائر نے عبور کیا۔ وکیع بن الدورقیہ بازوؤں میں باہر نکلے اور بوجائر نے اس پر وار کیا، اس کے سینے پر بیٹھ کر 'دویلہ کے انتقام کے لیے' پکار رہا تھا - اس کا مقتول سوتیلا بھائی - جیسا کہ ابن خزیم نے 'تم پر لعنت بھیجی: تم نے مدر کے مینڈھے کو اس بھائی کے لیے مارا جس کی قیمت ایک پتھر اور کھجور میں نہیں'۔ اس کے بیٹے عنباسہ اور یحییٰ اس کے ساتھ گر گئے، اس کا مولا طہمان - مہدی کے سکریٹری یعقوب بن داؤد کے دادا - زخمی ہو گئے۔ بقیر نے اپنا سر دمشق اور کٹا ہوا دایاں ہاتھ عثمان بن بشیر کے بیٹوں کے پاس بھیج دیا۔"
  tr: "İbn Hazim, oğlu Muhammed'i Herat valisi olarak atadı, ancak Beni Tamim isyan edip onu öldürdü. Babası daha sonra Osman ibn Beşir ibn el-Muhtafiz'i yakalayıp, Beni Tamim'den başka bir adamla birlikte idam etti. Beni Tamim onu devirmek için komplo kurdu ve bir grup Bujayr ibn Varak el-Sar'i ile birlikte Aberşahr'a giderek onu görevden aldı. Eşyalarını oğlu Musa ile Tirmizi'ye gönderdi. Abdülmalik ibn Mervan'dan Horasan valisi olarak atanmasını bildiren bir mektup geldi. Peygamberi doyurdu ve şöyle dedi: \"Allah'ın huzuruna, Resulünün öğrencisinin oğluna olan biatımı bozup, bir kaçakın oğluna biat ederek çıkmayacağım.\" Abdülmalik daha sonra Bukayr ibn Washah'a vali olarak atadığını bildiren bir mektup yazdı; oysa Bukayr daha önce onu görevden almış, silahları ve hazineyi ele geçirmiş ve Merv halkını Abdülmalik'e biat etmeye çağırmıştı ve onlar da biat ettiler. İbn Khazim daha sonra Tirmizi'de oğlu Musa'ya saldırmak üzere yola çıktı, ancak Bujayr onu takip etti ve Merv yakınlarında onunla savaştı. Waki' ibn al-Durqiyah al-Quray'i zırhı ve silahlarıyla ortaya çıktı ve Bujayr ile birlikte ona saldırdı. Onu bıçakladılar ve Waki' göğsüne oturup \"Duwaylah'ın intikamı!\" diye bağırdı. Duwaylah, İbn Khazim tarafından öldürülen üvey kardeşiydi. İbn Khazim daha sonra tükürdü. Khazim ona karşı çıktı ve \"Allah seni lanetlesin! Kardeşin için, bir avuç hurma çekirdeğinden bile az değersiz bir yabancı için Mudar'ın koçunu mu öldürüyorsun?\" dedi. Vaki’ dedi ki: “Ey Ajla oğlu, bana tattırdığın şeyi sen de tat ve bundan habersiz olduğumu sanma.” İki oğlu Enbasa ve Yahya’yı öldürdü ve efendisi, Mehdi’nin kâtibi Ya’kub ibn Davud’un dedesi Tahman’ı bıçakladı. Bakir onun başını getirip Abdülmalik’e gönderdi, böylece Şam’da sergilendi. Sağ elini kesip Osman ibn Beşir’in oğluna gönderdiler."
  id: "Ibn Khazim mengangkat putranya, Muhammad, sebagai gubernur Herat, tetapi Bani Tamim memberontak dan membunuhnya. Ayahnya kemudian menangkap Utsman ibn Bashir ibn al-Muhtafiz dan mengeksekusinya, bersama dengan seorang pria lain dari Bani Tamim. Bani Tamim bersekongkol untuk menggulingkannya, dan sekelompok dari mereka, bersama dengan Bujayr ibn Warqa' al-Sar'i, pindah ke Abarshahr dan menggulingkannya. Ia mengirimkan barang bawaannya bersama putranya, Musa, ke Tirmidz. Sebuah surat tiba dari Abd al-Malik ibn Marwan yang mengangkatnya sebagai gubernur Khurasan. Ia memberi makan utusan itu dan berkata, \"Aku tidak akan bertemu Allah setelah melanggar sumpah setiaku kepada putra murid Rasulullah dan berjanji setia kepada putra seorang buronan.\" Abd al-Malik kemudian menulis surat kepada Bukayr ibn Washah dan mengangkatnya sebagai gubernur, meskipun Bukayr sebelumnya telah mencopotnya, menyita senjata dan perbendaharaan, serta menyeru penduduk Merv untuk menyatakan kesetiaan kepada Abd al-Malik, yang kemudian mereka lakukan. Ibn Khazim kemudian berangkat untuk menyerang putranya, Musa, di Tirmidz, tetapi Bukayr mengejarnya dan melawannya di dekat Merv. Waki' ibn al-Durqiyah al-Quray'i keluar dengan baju besi dan senjatanya dan menyerangnya bersama Bukayr. Mereka menikamnya, dan Waki' duduk di dadanya, sambil berteriak, \"Balas dendam untuk Duwaylah!\" Duwaylah adalah saudara tirinya dari pihak ibu, yang dibunuh oleh Ibn Khazim. Ibn Khazim kemudian meludah. Khazim menghadapinya dan berkata, “Semoga Allah melaknatmu! Apakah kau membunuh domba Mudar untuk saudaramu, orang asing yang tidak berharga seperti segenggam biji kurma?” Waki’ berkata, “Rasakan, wahai putra ‘Ajla, sama seperti yang kau perlakukan padaku, dan jangan mengira aku tidak menyadarinya.” Dia membunuh kedua putranya, ‘Anbasa dan Yahya, dan menikam Tahman, tuannya, kakek dari Ya’qub ibn Dawud, juru tulis al-Mahdi. Bakir membawa kepalanya dan mengirimkannya kepada Abd al-Malik, lalu dipajang di Damaskus. Mereka memotong tangan kanannya dan mengirimkannya kepada putra ‘Uthman ibn Bashir."
