id: event/wednesday-battle-at-darb-gate-breaks-the-wall-and-abu-jafar-charges-back-295
class: event
kind: battle
label:
  ar: "القتال عند باب الدرب يوم الأربعاء: هدم الجدار وحملة أبي جعفر، 295هـ"
  en: "Battle at the Darb gate on Wednesday, 21 Dhu al-Hijja 295 AH: the wall breaks and Abu Ja'far's men charge back, p. 368"
  ur: "بدھ کو درب کے دروازے پر لڑائی: دیوار کا ٹوٹنا اور ابو جعفر کے لوگوں کا جوابی حملہ، 21 ذوالحجہ 295ھ، ص368"
  es: "Batalla en la puerta de Darb el miércoles 21 de Dhu al-Hijja del año 295 de la Hégira: la muralla se rompe y los hombres de Abu Ja'far contraatacan, pág. 368."
summary:
  ar: "يوم الأربعاء سار ابن حميد بجميع بني الحارث، فالتحم القتال عند باب الدرب، وهدموا جانباً من القرية فتحول القتال إليه، وأبلى فيه أحمد بن عبد الله. ثم حمل أبو جعفر بجماعة من خدمه فطردوا القوم من الجدار، وأعادوا بناء ما هدموه بعد انصرافهم."
  en: "On Wednesday Ibn Humayd led all of Banu al-Harith forward, and the fighting at the Darb gate became general. They broke down part of the village wall, and the fighting moved to the breach. Ahmad ibn Abdallah distinguished himself there. Abu Ja'far then charged with a group of his servants and drove the enemy back from the wall; after they withdrew, the defenders rebuilt what had been broken."
  ur: "بدھ کو ابن حمید نے بنو حارث کے سب آدمیوں کو لے کر پیش قدمی کی، اور درب کے دروازے پر لڑائی عام ہو گئی۔ انہوں نے گاؤں کی دیوار کا ایک حصہ توڑ دیا اور لڑائی اس ٹوٹے ہوئے حصے کی طرف منتقل ہو گئی۔ وہاں احمد بن عبداللہ نے نمایاں کارکردگی دکھائی۔ پھر ابو جعفر اپنے کچھ خدمت گاروں کے ساتھ حملہ آور ہوا اور دشمن کو دیوار سے ہٹا دیا؛ ان کے واپس جانے کے بعد ٹوٹا ہوا حصہ دوبارہ بنایا گیا۔"
  es: "El miércoles, Ibn Humayd dirigió a todos los Banu al-Harith hacia adelante, y la lucha en la puerta de Darb se generalizó. Derribaron parte de la muralla del pueblo y el combate se trasladó a la brecha. Ahmad ibn Abdallah se distinguió allí. Abu Ja'far cargó entonces con un grupo de sus sirvientes y obligó al enemigo a retroceder de la muralla; tras su retirada, los defensores reconstruyeron lo que había sido destruido."
