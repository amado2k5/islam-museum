class: event
kind: revolt
label: { ar: "فتنة الحبطات بسجستان", en: "The Habata Unrest in Sijistan", es: "Los disturbios de Habata en Sijistan", fr: "Les troubles d'Habata au Sijistan" }
summary:
  ar: "أقام عبد الرحمن بن سمرة بزرنج حتى اضطرب أمر عثمان فاستخلف أميراً بن الأحمر اليشكري وانصرف فأخرجه أهل زرنج وأغلقوها ولزياد الأعجم فيه لو لا أمير هلكت يشكر ويشكر هلكى على كل حال. فلما فرغ علي بن أبي طالب من أمر الجمل خرج حسكة بن عتاب الحبطي وعمران بن الفصيل البرجمي في صماليك من العرب حتى نزلوا زالق وقد نكث أهلها فأصابوا منها مالاً وأخذوا جد البختري الأصم بن مجاهد مولى شيبان ثم أتوا زرنج وقد خافهم مرزبانها فصالحهم ودخلوها وبعث علي عبد الرحمن بن جزء الطائي إلى سجستان فقتله حسكة فقال علي لأقتلن من الحبطات أربعة آلاف فقيل له إن الحبطات لا تكون خمسمائة وقال أبو مخنف بعث علي عون بن جمدة بن هبيرة المخزومي إلى سجستان فقتله بهدالي اللص الطائي في طريق العراق فكتب علي إلى عبد الله بن العباس يأمره أن يولي سجستان رجلاً في أربعة آلاف فوجه ربعي بن الكاس العنبري في أربعة آلاف ومعه الحصين بن أبي الحر ونايل بن ذي الحرة الحميري وكان على مقدمته فلما وردوا سجستان قاتلهم حسكة فقتلوه وضبط ربعي البلاد وقال راجزهم تمن الذين اقتحموا سجستان أن لا نوالي شيعة ابن عفان إنا وجدنا في منير الفرقان."
  en: "Ibn Samura left Umair ibn al-Ahmar al-Yashkuri over Zaranj when Uthman's affair unravelled — its people expelled him and shut the gates. After the Camel, Hasaka ibn Utab al-Habati and Imran ibn al-Fasil al-Burjumi rode out with Arab desperadoes: plundered Zaliq whose folk had broken, captured al-Bakhtari's grandfather al-Asamm ibn Mujahid, and entered Zaranj whose marzban truced. Ali's envoy Abd al-Rahman ibn Jaza' al-Ta'i was killed by Hasaka — 'I will kill four thousand of the Habata', and it was said 'the Habata are not even five hundred'; Abu Mikhnaf adds that Awn ibn Jamda al-Makhzumi, sent likewise, was killed by the bandit Buhadali al-Ta'i. Ali then had Ibn Abbas send Rubay'i ibn al-Kas al-Anbari with four thousand — with al-Husayn ibn Abi al-Hurr and Na'il ibn Dhi al-Hurra on the vanguard — who killed Hasaka and secured the country, their rajaz vow: 'we will not befriend the party of Ibn Affan — we found it in the Book of the Furqan'."
  es: "Ibn Samura dejó a Umair ibn al-Ahmar al-Yashkuri al frente de Zaranj cuando el asunto de Uthman se desmoronó: su gente lo expulsó y cerró las puertas. Tras el Camello, Hasaka ibn Utab al-Habati e Imran ibn al-Fasil al-Burjumi salieron con forajidos árabes: saquearon Zaliq, cuyo pueblo se había rebelado, capturaron al abuelo de al-Bakhtari, al-Asamm ibn Mujahid, y entraron en Zaranj, cuyo marzban había hecho una tregua. El enviado de Ali, Abd al-Rahman ibn Jaza' al-Ta'i, fue asesinado por Hasaka: «Mataré a cuatro mil de los Habata», y se dijo: «Los Habata no son ni quinientos». Abu Mikhnaf añade que Awn ibn Jamda al-Makhzumi, enviado de igual manera, fue asesinado por el bandido Buhadali al-Ta'i. Ali hizo entonces que Ibn Abbas enviara a Rubay'i ibn al-Kas al-Anbari con cuatro mil hombres —con al-Husayn ibn Abi al-Hurr y Na'il ibn Dhi al-Hurra en la vanguardia— quienes mataron a Hasaka y aseguraron el país, su juramento de rajaz: 'No nos haremos amigos del partido de Ibn Affan; lo encontramos en el Libro del Furqan'."
  fr: "Ibn Samura confia Zaranj à Umair ibn al-Ahmar al-Yashkuri lorsque l'affaire d'Uthman se détériora: ses habitants l'expulsèrent et fermèrent les portes de la ville. Après l'expédition du Chameau, Hasaka ibn Utab al-Habati et Imran ibn al-Fasil al-Burjumi partirent avec des bandits arabes: ils pillèrent Zaliq, dont les habitants s'étaient soumis, capturèrent le grand-père d'al-Bakhtari, al-Asamm ibn Mujahid, et entrèrent à Zaranj, dont le marzban avait conclu une trêve. L'envoyé d'Ali, Abd al-Rahman ibn Jaza' al-Ta'i, fut tué par Hasaka: « Je tuerai quatre mille Habata », et l'on disait: « Les Habata ne sont même pas cinq cents ». Abou Mikhnaf ajoute qu'Awn ibn Jamda al-Makhzumi, également envoyé, fut tué par le bandit Buhadali al-Ta'i. Ali chargea ensuite Ibn Abbas d'envoyer Rubay'i ibn al-Kas al-Anbari avec quatre mille hommes — avec al-Husayn ibn Abi al-Hurr et Na'il ibn Dhi al-Hurra à l'avant-garde — qui tuèrent Hasaka et sécurisèrent le pays, leur serment de rajaz: « Nous ne nous allierons pas au parti d'Ibn Affan — nous l'avons trouvé dans le Livre du Furqan »."
