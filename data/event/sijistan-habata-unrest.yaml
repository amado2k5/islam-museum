id: event/sijistan-habata-unrest
class: event
kind: revolt
label: { ar: "فتنة الحبطات بسجستان", en: "The Habata Unrest in Sijistan", es: "Los disturbios de Habata en Sijistan", fr: "Les troubles d'Habata au Sijistan", ur: "سجستان میں حباٹا بدامنی", tr: "Sijistan'daki Habbatların fitnesi", id: "Fitnah kaum Habbat di Sijistan" }
summary:
  ar: "أقام عبد الرحمن بن سمرة بزرنج حتى اضطرب أمر عثمان فاستخلف أميراً بن الأحمر اليشكري وانصرف فأخرجه أهل زرنج وأغلقوها ولزياد الأعجم فيه لو لا أمير هلكت يشكر ويشكر هلكى على كل حال. فلما فرغ علي بن أبي طالب من أمر الجمل خرج حسكة بن عتاب الحبطي وعمران بن الفصيل البرجمي في صماليك من العرب حتى نزلوا زالق وقد نكث أهلها فأصابوا منها مالاً وأخذوا جد البختري الأصم بن مجاهد مولى شيبان ثم أتوا زرنج وقد خافهم مرزبانها فصالحهم ودخلوها وبعث علي عبد الرحمن بن جزء الطائي إلى سجستان فقتله حسكة فقال علي لأقتلن من الحبطات أربعة آلاف فقيل له إن الحبطات لا تكون خمسمائة وقال أبو مخنف بعث علي عون بن جمدة بن هبيرة المخزومي إلى سجستان فقتله بهدالي اللص الطائي في طريق العراق فكتب علي إلى عبد الله بن العباس يأمره أن يولي سجستان رجلاً في أربعة آلاف فوجه ربعي بن الكاس العنبري في أربعة آلاف ومعه الحصين بن أبي الحر ونايل بن ذي الحرة الحميري وكان على مقدمته فلما وردوا سجستان قاتلهم حسكة فقتلوه وضبط ربعي البلاد وقال راجزهم تمن الذين اقتحموا سجستان أن لا نوالي شيعة ابن عفان إنا وجدنا في منير الفرقان."
  en: "Ibn Samura left Umair ibn al-Ahmar al-Yashkuri over Zaranj when Uthman's affair unravelled — its people expelled him and shut the gates. After the Camel, Hasaka ibn Utab al-Habati and Imran ibn al-Fasil al-Burjumi rode out with Arab desperadoes: plundered Zaliq whose folk had broken, captured al-Bakhtari's grandfather al-Asamm ibn Mujahid, and entered Zaranj whose marzban truced. Ali's envoy Abd al-Rahman ibn Jaza' al-Ta'i was killed by Hasaka — 'I will kill four thousand of the Habata', and it was said 'the Habata are not even five hundred'; Abu Mikhnaf adds that Awn ibn Jamda al-Makhzumi, sent likewise, was killed by the bandit Buhadali al-Ta'i. Ali then had Ibn Abbas send Rubay'i ibn al-Kas al-Anbari with four thousand — with al-Husayn ibn Abi al-Hurr and Na'il ibn Dhi al-Hurra on the vanguard — who killed Hasaka and secured the country, their rajaz vow: 'we will not befriend the party of Ibn Affan — we found it in the Book of the Furqan'."
  es: "Ibn Samura dejó a Umair ibn al-Ahmar al-Yashkuri al frente de Zaranj cuando el asunto de Uthman se desmoronó: su gente lo expulsó y cerró las puertas. Tras el Camello, Hasaka ibn Utab al-Habati e Imran ibn al-Fasil al-Burjumi salieron con forajidos árabes: saquearon Zaliq, cuyo pueblo se había rebelado, capturaron al abuelo de al-Bakhtari, al-Asamm ibn Mujahid, y entraron en Zaranj, cuyo marzban había hecho una tregua. El enviado de Ali, Abd al-Rahman ibn Jaza' al-Ta'i, fue asesinado por Hasaka: «Mataré a cuatro mil de los Habata», y se dijo: «Los Habata no son ni quinientos». Abu Mikhnaf añade que Awn ibn Jamda al-Makhzumi, enviado de igual manera, fue asesinado por el bandido Buhadali al-Ta'i. Ali hizo entonces que Ibn Abbas enviara a Rubay'i ibn al-Kas al-Anbari con cuatro mil hombres —con al-Husayn ibn Abi al-Hurr y Na'il ibn Dhi al-Hurra en la vanguardia— quienes mataron a Hasaka y aseguraron el país, su juramento de rajaz: 'No nos haremos amigos del partido de Ibn Affan; lo encontramos en el Libro del Furqan'."
  fr: "Ibn Samura confia Zaranj à Umair ibn al-Ahmar al-Yashkuri lorsque l'affaire d'Uthman se détériora: ses habitants l'expulsèrent et fermèrent les portes de la ville. Après l'expédition du Chameau, Hasaka ibn Utab al-Habati et Imran ibn al-Fasil al-Burjumi partirent avec des bandits arabes: ils pillèrent Zaliq, dont les habitants s'étaient soumis, capturèrent le grand-père d'al-Bakhtari, al-Asamm ibn Mujahid, et entrèrent à Zaranj, dont le marzban avait conclu une trêve. L'envoyé d'Ali, Abd al-Rahman ibn Jaza' al-Ta'i, fut tué par Hasaka: « Je tuerai quatre mille Habata », et l'on disait: « Les Habata ne sont même pas cinq cents ». Abou Mikhnaf ajoute qu'Awn ibn Jamda al-Makhzumi, également envoyé, fut tué par le bandit Buhadali al-Ta'i. Ali chargea ensuite Ibn Abbas d'envoyer Rubay'i ibn al-Kas al-Anbari avec quatre mille hommes — avec al-Husayn ibn Abi al-Hurr et Na'il ibn Dhi al-Hurra à l'avant-garde — qui tuèrent Hasaka et sécurisèrent le pays, leur serment de rajaz: « Nous ne nous allierons pas au parti d'Ibn Affan — nous l'avons trouvé dans le Livre du Furqan »."
  ur: "ابن سمرہ نے عمیر بن الاحمر ال یشکوری کو زرنج پر چھوڑ دیا جب عثمان کا معاملہ کھل گیا - اس کے لوگوں نے اسے نکال دیا اور دروازے بند کر دیئے۔ اونٹ کے بعد، حسقہ بن عتاب الحباتی اور عمران بن الفصل البرجومی عرب مایوسیوں کے ساتھ نکلے: ذالک کو لوٹا جس کے لوگ ٹوٹ چکے تھے، البختاری کے دادا العصام ابن مجاہد کو پکڑ لیا، اور زرنج میں داخل ہوئے جس کا مرزبان ٹوٹ گیا۔ علی کے ایلچی عبدالرحمٰن بن جزاء الطائی کو حسکا نے قتل کر دیا تھا - 'میں چار ہزار حبات کو قتل کروں گا'، اور کہا گیا کہ 'حبتہ پانچ سو بھی نہیں ہیں'؛ ابو مخنف مزید کہتے ہیں کہ اسی طرح بھیجے گئے عون بن جمدہ المخزومی کو ڈاکو بوہدالی الطائی نے قتل کر دیا۔ اس کے بعد علی نے ابن عباس نے روبی ابن القاس الانباری کو چار ہزار کے ساتھ - الحسین ابن ابی الحر اور نائل بن ذی الحریرہ کے ساتھ بھیجا تھا - جس نے ہسکہ کو قتل کیا اور ملک کو محفوظ کیا، ان کے رجز نے عہد کیا: 'ہم اس سے دوستی نہیں کریں گے جو کہ ابن الثقان کی کتاب میں پائی جاتی ہے'۔"
  tr: "Abdülrahman ibn Samra, Osman'ın işleri karışıncaya kadar Zaranj'da kaldı. Bunun üzerine halefi olarak Emir ibn el-Ahmar el-Yashkuri'yi atadı ve oradan ayrıldı. Zaranj halkı onu kovdu ve şehri kapattı. Ziyad el-Acem şöyle dedi: \"Eğer Emir olmasaydı, Yashkur yok olurdu ve Yashkur her halükarda yok olurdu.\" Ali ibn Abi Talib, Deve Muharebesi'ni bitirdikten sonra, Haseke ibn Attab el-Habti ve İmran ibn el-Fasil el-Barjami, bir Arap birliğiyle birlikte Zaliq'e kadar yola çıktılar. Zaliq sakinleri ahitlerini bozmuşlardı, bu yüzden onlardan mal mülk ele geçirdiler ve Şeyban'ın himayesindeki el-Bakhtari'nin dedesi el-Asamm ibn Mujahid'i esir aldılar. Sonra Zaranj'a gittiler. Şehrin valisi onlardan korktuğu için onlarla barış yaptı ve şehre girdiler. Ali, Abdülrahman ibn Cüz el-Tai'yi Sijistan'a gönderdi, ancak Haşeka onu öldürdü. Ali, \"Habeta'dan dört bin kişiyi öldüreceğim\" dedi. Ona, \"Habeta'nın sayısı beş yüz kişi değil\" denildi. Ebu Mikhnaf, Ali'nin Awn ibn Cümme ibn Hubeyrah el-Makhzumi'yi Sijistan'a gönderdiğini, ancak hırsız Bahdali el-Tai'nin onu Irak yolunda öldürdüğünü söyledi. Ali, Abdullah ibn Abbas'a Sijistan'a dört bin adamla bir adam atamasını emretti. Bunun üzerine, Rabi' ibn el-Kas el-Anbari'yi dört bin adamla, yanında Hüseyin ibn Ebu el-Hur ve öncü birliğin komutanı Nayil ibn Zhi el-Hurrah el-Himyari ile birlikte gönderdi. Sijistan'a vardıklarında Haşeka onlarla savaştı ve onu öldürdü. Rabi' toprakların kontrolünü ele geçirdi ve şairleri, \"İçeri girenler...\" dedi. Sijistan ise, \"İbn Affan Şiilerini desteklemiyoruz. Bunu Munir el-Furqan'da bulduk.\" dedi."
  id: "Abd al-Rahman ibn Samra tinggal di Zaranj sampai urusan Utsman menjadi kacau, sehingga ia menunjuk Amir ibn al-Ahmar al-Yashkuri sebagai penggantinya dan pergi. Penduduk Zaranj mengusirnya dan menutup kota itu. Dan Ziyad al-Ajam berkata, “Jika bukan karena Amir, Yashkur pasti akan binasa, dan Yashkur akan binasa dalam keadaan apa pun.” Ketika Ali ibn Abi Talib menyelesaikan Perang Unta, Hasakah ibn Attab al-Habti dan Imran ibn al-Fasil al-Barjami berangkat dengan rombongan orang Arab sampai mereka mencapai Zaliq. Penduduknya telah melanggar perjanjian mereka, sehingga mereka merampas harta benda mereka dan menangkap kakek al-Bakhtari, al-Asamm ibn Mujahid, seorang pengikut Shayban. Kemudian mereka pergi ke Zaranj, yang gubernurnya takut kepada mereka, sehingga ia berdamai dengan mereka, dan mereka memasuki kota itu. Ali mengutus Abd al-Rahman ibn Juz' al-Ta'i ke Sijistan, tetapi Hasakah membunuhnya. Ali berkata, \"Aku akan membunuh empat ribu orang Habtah.\" Dikatakan kepadanya, \"Orang Habtah tidak berjumlah lima ratus.\" Abu Mikhnaf berkata bahwa Ali mengutus Awn ibn Jumdah ibn Hubayrah al-Makhzumi ke Sijistan, tetapi Bahdali si pencuri al-Ta'i membunuhnya di jalan menuju Irak. Ali menulis surat kepada Abdullah ibn Abbas, memerintahkannya untuk menunjuk seseorang ke Sijistan dengan empat ribu orang. Maka ia mengutus Rabi' ibn al-Kas al-Anbari dengan empat ribu orang, didampingi oleh al-Husayn ibn Abi al-Hur dan Nayil ibn Dhi al-Hurrah al-Himyari, yang memimpin barisan depan. Ketika mereka sampai di Sijistan, Hasakah memerangi mereka dan membunuhnya. Rabi' menguasai tanah itu, dan penyair mereka berkata, \"Mereka yang menyerbu masuk...\" Sijistan berkata: Kami tidak mendukung Syiah Ibn Affan. Kami menemukannya di Munir al-Furqan."
