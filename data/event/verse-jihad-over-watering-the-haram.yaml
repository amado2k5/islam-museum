id: event/verse-jihad-over-watering-the-haram
class: event
kind: other
label: { ar: "نزول الآية في تفضيل الجهاد على سقاية الحاج وعمارة المسجد الحرام", en: "The verse preferring jihad to watering the pilgrims and tending the Sacred Mosque", es: "El versículo que prefiere la yihad a dar de beber a los peregrinos y cuidar la Mezquita Sagrada.", fr: "Le verset qui préfère le jihad à l'abreuvement des pèlerins et à l'entretien de la Mosquée sacrée", ur: "یہ آیت حجاج کو پانی پلانے اور مسجد حرام کی دیکھ بھال پر جہاد کو ترجیح دیتی ہے۔" }
summary:
  ar: "قال رجل: لا أبالي ألا أعمل عملاً بعد الإسلام إلا عمارة المسجد الحرام، فردّ عليه علي بأن الجهاد في سبيل الله أفضل من ذلك كله، فنهى عمر عن رفع الأصوات عند منبر النبي، وأمر بسؤاله بعد الصلاة، فنزلت آية التوبة في تفضيل الإيمان والجهاد على سقاية الحاج وعمارة المسجد الحرام. يورد الصلابي هذه الرواية في باب منهج علي في معرفة أسباب النزول ⁦(ص 47)⁩."
  en: "A man said he would do no deed after Islam but tend the Sacred Mosque; Ali answered that jihad is better than all of that; the verse of al-Tawba preferring faith and jihad to watering the pilgrims was revealed afterwards, as al-Sallabi reports it under Ali's method of knowing the occasions of revelation (p. 47)."
  es: "Un hombre dijo que después del Islam no haría otra cosa que cuidar la Mezquita Sagrada; Ali respondió que la yihad es mejor que todo eso; el versículo de al-Tawba que prefiere la fe y la yihad a dar de beber a los peregrinos fue revelado posteriormente, como lo relata al-Sallabi según el método de Ali para conocer las ocasiones de la revelación (p. 47)."
  fr: "Un homme a dit qu'il ne ferait rien après l'islam, sauf s'occuper de la Mosquée sacrée; Ali a répondu que le jihad est meilleur que tout cela; le verset d'al-Tawba préférant la foi et le jihad à l'abreuvement des pèlerins a été révélé plus tard, comme al-Sallabi le rapporte selon la méthode d'Ali pour connaître les occasions de révélation (p. 47)."
  ur: "ایک آدمی نے کہا کہ وہ اسلام کے بعد کوئی کام نہیں کرے گا لیکن مسجد حرام کی نگہبانی کرے گا۔ علی نے جواب دیا کہ جہاد ان سب سے بہتر ہے۔ التوبہ کی آیت حجاج کو پانی پلانے پر ایمان اور جہاد کو ترجیح دیتی ہے اس کے بعد نازل ہوئی، جیسا کہ السلبی نے اسے نزول کے مواقع جاننے کے علی کے طریقہ کے تحت بیان کیا ہے ⁦(ص 47)⁩۔"
