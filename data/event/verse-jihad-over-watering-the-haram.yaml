label: { ar: "نزول الآية في تفضيل الجهاد على سقاية الحاج وعمارة المسجد الحرام", en: "The verse preferring jihad to watering the pilgrims and tending the Sacred Mosque" }
summary:
  ar: "قال رجل: لا أبالي ألا أعمل عملاً بعد الإسلام إلا عمارة المسجد الحرام، فردّ عليه علي بأن الجهاد في سبيل الله أفضل من ذلك كله، فنهى عمر عن رفع الأصوات عند منبر النبي، وأمر بسؤاله بعد الصلاة، فنزلت آية التوبة في تفضيل الإيمان والجهاد على سقاية الحاج وعمارة المسجد الحرام. يورد الصلابي هذه الرواية في باب منهج علي في معرفة أسباب النزول (ص 47)."
  en: "A man said he would do no deed after Islam but tend the Sacred Mosque; Ali answered that jihad is better than all of that; the verse of al-Tawba preferring faith and jihad to watering the pilgrims was revealed afterwards, as al-Sallabi reports it under Ali's method of knowing the occasions of revelation (p. 47)."
