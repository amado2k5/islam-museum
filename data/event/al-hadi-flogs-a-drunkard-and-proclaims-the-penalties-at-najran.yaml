id: event/al-hadi-flogs-a-drunkard-and-proclaims-the-penalties-at-najran
class: event
kind: other
label:
  ar: الهادي يجلد سكراناً ويكتب إلى أهل نجران كتاب تقدمة بالحدود
  en: Al-Hadi has a drunk flogged and writes to the people of Najran a proclamation on the penalties
  ur: ہادی نشے میں پکڑے گئے شخص کو کوڑے لگواتے ہیں اور اہل نجران کو حدود کا اعلان نامہ لکھتے ہیں
summary:
  ar: بعد البيعة بيوم أخذ عمال الهادي رجلاً سكران، فقال إنه غمّه أخذه قبل أن يعذر إلى أهل البلد وينذر، وأمر بجلده ثمانين سوطاً بعد أن صحا، ثم كتب تقدمة يُقرأ على الناس فيها أن الله أوجب العقاب على الزنا والسرقة والقذف وأكل الربا وشرب الخمر وشهادة الزور وسائر المعاصي، وأن الحدود لاحقة بمن أوجبها على نفسه.
  en: A day after the pledge al-Hadi's agents seized a drunk man; he said he was troubled that he was seized before he had warned the townspeople, and had him flogged eighty lashes after he sobered; then he wrote a proclamation to be read to everyone, stating that God has fixed penalties for fornication, theft, slander, usury, wine and false witness and the other sins, and that the penalties apply to whoever incurs them.
  ur: بیعت کے ایک دن بعد ہادی کے کارندوں نے ایک نشے میں آدمی کو پکڑا؛ انہوں نے کہا انہیں اس کا پکڑا جانا اس سے پہلے کہ وہ اہل شہر کو ڈرائیں دکھ دیتا ہے، اور اس کے ہوش میں آنے کے بعد اسّی کوڑے لگوائے؛ پھر ایک اعلان نامہ لکھا جو لوگوں کو پڑھ کر سنایا گیا جس میں ہے کہ اللہ نے زنا، چوری، تہمت، سود، شراب، جھوٹی گواہی اور دوسرے گناہوں پر سزا مقرر کی ہے اور حدود اس پر لاگو ہیں جو انہیں اپنے اوپر واجب کرے۔
