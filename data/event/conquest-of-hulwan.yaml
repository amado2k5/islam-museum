label: { ar: "فتح حلوان وقرماسين", en: "The Conquest of Hulwan and Qarmasin", es: "La conquista de Hulwan y Qarmasin", fr: "La conquête de Hulwan et de Qarmasin", ur: "حلوان اور قرمسین کی فتح" }
summary:
  ar: "عند البلاذري: لما فرغ المسلمون من أمر جلولاء الوقيعة ضم هاشم بن عتبة بن أبي وقاص إلى جرير بن عبد الله البجلي خيلاً كثيفة ورتبه بجلولاء ليكون بين المسلمين وبين عدوهم ثم إن سعداً وجه إليهم زهاء ثلاثة آلاف وأمره أن ينهض بهم وبمن معه إلى حلوان فلما كان بالقرب منها هرب يزدجرد إلى ناحية أصبهان ففتح جرير حلوان صلحاً على أن كف عنهم وآمنهم على دمائهم وأموالهم وجعل لمن أحب منهم الهرب أن لا يعرض لهم ثم خلف بحلوان عزرة بن قيس بن غزية البجلي ومضى نحو الدينور فلم يفتحها وفتح قرماسين على مثل ما فتح عليه حلوان وقدم حلوان فأقام بها والياً عليها إلى أن قدم عمار بن ياسر الكوفة فكتب إليه يعلمه أن عمر أمره أن يمد به أبا موسى الأشعري فخلف عزرة بن قيس على حلوان وسار حتى أتى أبا موسى الأشعري في سنة 19 وقد نزل حلوان قوم من ولد جرير بن عبد الله فأعاقبهم بها."
  en: "In al-Baladhuri: when the Muslims finished the affair of Jalula's battle, Hashim ibn Utba joined heavy horse to Jarir ibn Abdallah al-Bajali, stationed at Jalula as a screen between the Muslims and their enemy; Sa'd then sent some three thousand, ordering him to rise with them and his men for Hulwan. As he neared it Yazdgard fled toward Isbahan; Jarir took Hulwan by treaty — staying his hand, securing their blood and wealth, and letting whoever wished flee go unmolested. He left Uzra ibn Qays ibn Ghaziyya al-Bajali at Hulwan, marched on al-Dinawar which he did not take, and conquered Qarmasin on Hulwan's terms; he then stayed governing at Hulwan until Ammar ibn Yasir came to Kufa — Umar having ordered him to reinforce Abu Musa al-Ash'ari — leaving Uzra over Hulwan and marching to Abu Musa in year 19; a group of Jarir's descendants settled Hulwan, whose posterity remain there."
  es: "En al-Baladhuri: cuando los musulmanes terminaron el asunto de la batalla de Jalula, Hashim ibn Utba unió su caballería pesada a Jarir ibn Abdallah al-Bajali, apostado en Jalula como pantalla entre los musulmanes y su enemigo; Sa'd entonces envió unos tres mil, ordenándole que se levantara con ellos y sus hombres hacia Hulwan. Cuando se acercaba a ella, Yazdgard huyó hacia Isbahan; Jarir tomó Hulwan por tratado, deteniendo su mano, asegurando su sangre y riquezas, y dejando que quien quisiera huir lo hiciera sin ser molestado. Dejó a Uzra ibn Qays ibn Ghaziyya al-Bajali en Hulwan, marchó sobre al-Dinawar, que no tomó, y conquistó Qarmasin en los términos de Hulwan; Luego permaneció gobernando en Hulwan hasta que Ammar ibn Yasir llegó a Kufa —Umar le había ordenado reforzar a Abu Musa al-Ash'ari—, dejando a Uzra al mando de Hulwan y marchando hacia Abu Musa en el año 19; un grupo de descendientes de Jarir se estableció en Hulwan, y su posteridad permanece allí."
  fr: "Dans al-Baladhuri: une fois la bataille de Jalula terminée, Hashim ibn Utba rejoignit la cavalerie lourde de Jarir ibn Abdallah al-Bajali, stationné à Jalula pour faire écran entre les musulmans et leurs ennemis. Sa'd envoya alors environ trois mille hommes, lui ordonnant de se lever avec eux et ses troupes pour Hulwan. À l'approche de la ville, Yazdgard s'enfuit vers Isbahan. Jarir prit Hulwan par traité, retenant son action, s'assurant la sécurité des soldats et de leurs biens, et laissant partir sans être inquiété ceux qui le souhaitaient. Il laissa Uzra ibn Qays ibn Ghaziyya al-Bajali à Hulwan, marcha sur al-Dinawar sans la prendre, et conquit Qarmasin aux conditions de Hulwan. Il resta ensuite à la tête de Hulwan jusqu'à ce qu'Ammar ibn Yasir arrive à Kufa — Umar lui ayant ordonné de renforcer Abu Musa al-Ash'ari — laissant Uzra à la tête de Hulwan et marchant vers Abu Musa en l'an 19; un groupe de descendants de Jarir s'installa à Hulwan, dont la postérité y demeure."
  ur: "البلادھوری میں ہے: جب مسلمانوں نے جلولا کی لڑائی کا معاملہ ختم کیا تو ہاشم بن عتبہ بھاری گھوڑے کے ساتھ جریر بن عبداللہ البجلی کے پاس گیا، جو جلولا میں مسلمانوں اور ان کے دشمنوں کے درمیان پردے کے طور پر تعینات تھا۔ اس کے بعد سعد نے تقریباً تین ہزار بھیجے اور اسے حکم دیا کہ وہ اپنے اور اپنے آدمیوں کے ساتھ حلوان کی طرف اٹھے۔ جیسے ہی وہ اس کے قریب پہنچا یزدگرد اسبہان کی طرف بھاگا۔ جریر نے حلوان کو معاہدہ کے ذریعے اپنے ہاتھ میں لے لیا، ان کے خون اور مال کی حفاظت کی، اور جو چاہے بھاگے بغیر چھیڑ چھاڑ کرے۔ اس نے عزرہ بن قیس بن غازیہ البجالی کو حلوان میں چھوڑ دیا، الدنور پر چڑھائی کی جسے اس نے قبول نہیں کیا، اور حلوان کی شرائط پر قرمسین کو فتح کیا۔ اس کے بعد وہ حلوان میں حکومت کرتا رہا یہاں تک کہ عمار بن یاسر کوفہ آیا - عمر نے اسے ابو موسیٰ الاشعری کو تقویت دینے کا حکم دیا - عذرا کو حلوان پر چھوڑ کر 19 میں ابو موسیٰ کی طرف کوچ کیا۔ جریر کی اولاد کے ایک گروہ نے حلوان کو آباد کیا، جن کی نسلیں وہیں باقی ہیں۔"
