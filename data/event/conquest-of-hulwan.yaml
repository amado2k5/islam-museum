label: { ar: "فتح حلوان وقرماسين", en: "The Conquest of Hulwan and Qarmasin" }
summary:
  ar: "عند البلاذري: لما فرغ المسلمون من أمر جلولاء الوقيعة ضم هاشم بن عتبة بن أبي وقاص إلى جرير بن عبد الله البجلي خيلاً كثيفة ورتبه بجلولاء ليكون بين المسلمين وبين عدوهم ثم إن سعداً وجه إليهم زهاء ثلاثة آلاف وأمره أن ينهض بهم وبمن معه إلى حلوان فلما كان بالقرب منها هرب يزدجرد إلى ناحية أصبهان ففتح جرير حلوان صلحاً على أن كف عنهم وآمنهم على دمائهم وأموالهم وجعل لمن أحب منهم الهرب أن لا يعرض لهم ثم خلف بحلوان عزرة بن قيس بن غزية البجلي ومضى نحو الدينور فلم يفتحها وفتح قرماسين على مثل ما فتح عليه حلوان وقدم حلوان فأقام بها والياً عليها إلى أن قدم عمار بن ياسر الكوفة فكتب إليه يعلمه أن عمر أمره أن يمد به أبا موسى الأشعري فخلف عزرة بن قيس على حلوان وسار حتى أتى أبا موسى الأشعري في سنة 19 وقد نزل حلوان قوم من ولد جرير بن عبد الله فأعاقبهم بها."
  en: "In al-Baladhuri: when the Muslims finished the affair of Jalula's battle, Hashim ibn Utba joined heavy horse to Jarir ibn Abdallah al-Bajali, stationed at Jalula as a screen between the Muslims and their enemy; Sa'd then sent some three thousand, ordering him to rise with them and his men for Hulwan. As he neared it Yazdgard fled toward Isbahan; Jarir took Hulwan by treaty — staying his hand, securing their blood and wealth, and letting whoever wished flee go unmolested. He left Uzra ibn Qays ibn Ghaziyya al-Bajali at Hulwan, marched on al-Dinawar which he did not take, and conquered Qarmasin on Hulwan's terms; he then stayed governing at Hulwan until Ammar ibn Yasir came to Kufa — Umar having ordered him to reinforce Abu Musa al-Ash'ari — leaving Uzra over Hulwan and marching to Abu Musa in year 19; a group of Jarir's descendants settled Hulwan, whose posterity remain there."
