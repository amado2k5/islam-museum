  id: "Catatan pendahuluan tentang perang Mesir-Ottoman pertama dari tahun 1831 hingga 1833 M, kampanye Ibrahim Pasha melawan Levant yang berakhir dengan Perjanjian Kutahya; sumber-sumber di halaman ini belum ditinjau."
