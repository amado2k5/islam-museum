label: { ar: "وقعة الزاب" }
summary:
  ar: "في سنة اثنتين وثلاثين ومائة هُزم مروان بن محمد بالزاب {cite:tabari-tarikh-abu-al-fadl j.7 p.432}، ثم قُتل بعد الهزيمة {cite:tabari-tarikh-abu-al-fadl j.7 p.437}، وعند السيوطي خرج على مروان بنو العباس وعليهم عبد الله بن علي عم السفاح فسار لحربهم فالتقى الجمعان بقرب الموصل فانكسر مروان فرجع إلى الشام وتبعه عبد الله {cite:tarikh-khulafa-minhaj-1434 p. 413}، وعند المسعودي نزل مروان على الزاب الصغير وعقد عليه الجسر وأتاه عبد الله بن علي في عساكر أهل خراسان ليلتين خلتا من جمادى الآخرة سنة اثنتين وثلاثين ومائة، وكردس مروان خيله كراديس ألفاً وألفين فكانت على مروان فانهزم يوم السبت لإحدى عشرة ليلة خلت من جمادى الآخرة وغرق من بني أمية ثلاثمائة رجل فيهم إبراهيم بن الوليد المخلوع {cite:muruj-al-dhahab p. 231-232}"
