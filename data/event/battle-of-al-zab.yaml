summary:
  ar: "في سنة اثنتين وثلاثين ومائة هُزم مروان بن محمد بالزاب {cite:tabari-tarikh-abu-al-fadl j.7 p.432}، ثم قُتل بعد الهزيمة {cite:tabari-tarikh-abu-al-fadl j.7 p.437}، وعند السيوطي خرج على مروان بنو العباس وعليهم عبد الله بن علي عم السفاح فسار لحربهم فالتقى الجمعان بقرب الموصل فانكسر مروان فرجع إلى الشام وتبعه عبد الله {cite:tarikh-khulafa-minhaj-1434 p. 413}، وعند المسعودي نزل مروان على الزاب الصغير وعقد عليه الجسر وأتاه عبد الله بن علي في عساكر أهل خراسان ليلتين خلتا من جمادى الآخرة سنة اثنتين وثلاثين ومائة، وكردس مروان خيله كراديس ألفاً وألفين فكانت على مروان فانهزم يوم السبت لإحدى عشرة ليلة خلت من جمادى الآخرة وغرق من بني أمية ثلاثمائة رجل فيهم إبراهيم بن الوليد المخلوع {cite:muruj-al-dhahab p. 231-232}"
  en: "In the year 132 Marwan ibn Muhammad was defeated at al-Zab {cite:tabari-tarikh-abu-al-fadl j.7 p.432}, and was killed after the defeat {cite:tabari-tarikh-abu-al-fadl j.7 p.437}. According to al-Suyuti, the Abbasids rose against Marwan under Abd Allah ibn Ali, paternal uncle of al-Saffah; he marched against them, the two hosts met near Mosul, Marwan was broken and returned to Syria, and Abd Allah followed him {cite:tarikh-khulafa-minhaj-1434 p. 413}. According to al-Mas'udi, Marwan camped at the Lesser Zab and had a bridge built over it; Abd Allah ibn Ali came to him with the armies of the people of Khurasan two nights into Jumada II of the year 132, and Marwan arranged his cavalry in squadrons of one thousand and two thousand. It went against Marwan: he was routed on Saturday, eleven nights into Jumada II, and three hundred men of the Umayyads drowned, among them Ibrahim ibn al-Walid, who had been deposed {cite:muruj-al-dhahab p. 231-232}"
  fr: "En l'an 132, Marwan ibn Muhammad fut vaincu au Zab {cite:tabari-tarikh-abu-al-fadl j.7 p.432}, et fut tué après la défaite {cite:tabari-tarikh-abu-al-fadl j.7 p.437}. Selon al-Suyuti, les Abbassides se soulevèrent contre Marwan sous Abd Allah ibn Ali, oncle paternel d'al-Saffah ; il marcha contre eux, les deux armées se rencontrèrent près de Mossoul, Marwan fut brisé et revint en Syrie, et Abd Allah le suivit {cite:tarikh-khulafa-minhaj-1434 p. 413}. Selon al-Mas'udi, Marwan campa au Petit Zab et y fit construire un pont ; Abd Allah ibn Ali vint à lui avec les armées des gens du Khorasan deux nuits après le début de Jumada II de l'an 132, et Marwan disposa sa cavalerie en escadrons de mille et de deux mille. L'affaire tourna contre Marwan : il fut mis en déroute le samedi, onze nuits après le début de Jumada II, et trois cents hommes des Omeyyades se noyèrent, parmi lesquels Ibrahim ibn al-Walid, qui avait été déposé {cite:muruj-al-dhahab p. 231-232}"
  es: "En el año 132 Marwan ibn Muhammad fue derrotado en al-Zab {cite:tabari-tarikh-abu-al-fadl j.7 p.432}, y fue asesinado después de la derrota {cite:tabari-tarikh-abu-al-fadl j.7 p.437}. Según al-Suyuti, los abasíes se alzaron contra Marwan bajo el mando de Abd Allah ibn Ali, tío paterno de al-Saffah; marchó contra ellos, los dos ejércitos se encontraron cerca de Mosul, Marwan fue derrotado y regresó a Siria, y Abd Allah lo siguió {cite:tarikh-khulafa-minhaj-1434 p. 413}. Según al-Mas'udi, Marwan acampó en el Zab Menor e hizo construir un puente sobre él; Abd Allah ibn Ali llegó a él con los ejércitos del pueblo de Jorasán dos noches después del comienzo del segundo mes de Jumada del año 132, y Marwan dispuso su caballería en escuadrones de mil y dos mil hombres. Esta se volvió contra Marwan: fue derrotado el sábado, once noches después del comienzo del segundo mes de Jumada, y trescientos hombres de los Omeyas se ahogaron, entre ellos Ibrahim ibn al-Walid, quien había sido depuesto {cite:muruj-al-dhahab p. 231-232}."
  ur: "سنہ 132 میں مروان ابن محمد کو الزاب میں شکست ہوئی {حوالہ:طبری-تاریخ-ابو الفضل ج.7 ص.432}، اور اس شکست کے بعد مارا گیا۔ السیوطی کے مطابق، عباسی الصفح کے چچا عبداللہ ابن علی کے ماتحت مروان کے خلاف اٹھ کھڑے ہوئے۔ اس نے ان کے خلاف مارچ کیا، دونوں لشکر موصل کے قریب ملے، مروان ٹوٹ کر شام کی طرف لوٹ گیا، اور عبداللہ اس کا پیچھا کیا۔ 413}۔ المسعودی کے مطابق، مروان نے کم زاب میں ڈیرہ ڈالا اور اس پر ایک پل بنایا ہوا تھا۔ عبداللہ ابن علی 132 جمادی الثانی کی دو راتوں کو اہل خراسان کے لشکر کے ساتھ اس کے پاس آیا اور مروان نے اپنے گھڑ سواروں کو ایک ہزار دو ہزار کے دستوں میں ترتیب دیا۔ یہ مروان کے خلاف ہوا: اسے ہفتہ کے دن، گیارہ راتیں جمادی الثانی میں شکست دی گئی، اور بنی امیہ کے تین سو آدمی غرق ہو گئے، ان میں ابراہیم بن ولید بھی تھے، جو معزول ہو چکے تھے۔ 231-232}"
  tr: "Hicri 132 yılında Mervan ibn Muhammed, Zeb'de yenilgiye uğradı {kaynak: Tabari-tarikh-abu-al-fadl c.7 s.432} ve yenilgiden sonra öldürüldü {kaynak: Tabari-tarikh-abu-al-fadl c.7 s.437}. El-Suyuti'ye göre, Abbasiler, Saffe'nin amcası Abdullah ibn Ali önderliğinde Mervan'a karşı isyan ettiler. Onlarla savaşmak için yürüdü ve iki ordu Musul yakınlarında karşılaştı. Mervan yenildi ve Abdullah'ın ardından Suriye'ye döndü {kaynak: Tarikat-hulafa-minhaj-1434 s. 413}. El-Mas'udi'ye göre, Mervan küçük Zeb'e indi ve üzerine bir köprü inşa etti. Abdullah bin Ali, 132 yılında Cemâde-i Ahiret'in bitimine iki gece kala Horasan halkının ordusuyla ona geldi. Mervan, süvarilerini bin ve iki bin kişilik gruplar halinde konuşlandırdı ve süvariler Mervan'ın üzerine saldırdı. Böylece Mervan, Cemâdî ahiretin bitiminden on bir gece önce, Cumartesi günü yenilgiye uğradı. Beni Umayya kabilesinden üç yüz kişi boğuldu; bunların arasında tahttan indirilen İbrahim bin el-Velid de vardı. {kaynak: Muruj el-Dhahab s. 231-232}"
  id: "Pada tahun 132 H, Marwan bin Muhammad dikalahkan di Zab {cite:tabari-tarikh-abu-al-fadl j.7 p.432}, kemudian ia terbunuh setelah kekalahan tersebut {cite:tabari-tarikh-abu-al-fadl j.7 p.437}. Menurut Al-Suyuti, kaum Abbasiyah memberontak melawan Marwan, dipimpin oleh Abdullah bin Ali, paman Al-Saffah. Ia bergerak untuk melawan mereka, dan kedua pasukan bertemu di dekat Mosul. Marwan dikalahkan dan kembali ke Suriah, diikuti oleh Abdullah {cite:tarikh-khulafa-minhaj-1434 p. 413}. Menurut Al-Mas’udi, Marwan turun ke Zab yang kecil dan membangun jembatan di atasnya. Abdullah bin Ali datang kepadanya dengan pasukan penduduk Khorasan dua malam sebelum berakhirnya Jumada al-Akhirah pada tahun seratus tiga puluh dua. Marwan mengerahkan pasukannya dalam kelompok seribu dan dua ribu orang, dan mereka menyerang Marwan, sehingga ia dikalahkan pada hari Sabtu, sebelas malam sebelum berakhirnya Jumada al-Akhirah. Tiga ratus orang dari Bani Umayyah tenggelam, di antaranya Ibrahim bin al-Walid, yang telah digulingkan. {cite:muruj-al-dhahab hlm. 231-232}"
