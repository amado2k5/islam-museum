id: event/battle-of-al-zab
education:
  did_you_know:
    ar: "في سنة اثنتين وثلاثين ومائة هُزم مروان بن محمد بالزاب ثم قُتل بعد الهزيمة، وختمت الموقعة الدولة الأموية في المشرق."
    en: "In 132 AH Marwan ibn Muhammad was routed at the Zab and killed after the defeat — the battle that closed the Umayyad state in the East."
    ur: "132ھ میں مروان بن محمد کو زاب پر شکست ہوئی اور شکست کے بعد وہ مارا گیا — وہ لڑائی جس نے مشرق میں اموی سلطنت کا خاتمہ کر دیا۔"
    sources: [source/tabari-tarikh-abu-al-fadl, source/tarikh-khulafa-minhaj-1434]
class: event
kind: battle
label: { ar: "وقعة الزاب", en: "The battle of al-Zab" }
summary:
  ar: "في سنة اثنتين وثلاثين ومائة هُزم مروان بن محمد بالزاب {cite:tabari-tarikh-abu-al-fadl j.7 p.432}، ثم قُتل بعد الهزيمة {cite:tabari-tarikh-abu-al-fadl j.7 p.437}، وعند السيوطي خرج على مروان بنو العباس وعليهم عبد الله بن علي عم السفاح فسار لحربهم فالتقى الجمعان بقرب الموصل فانكسر مروان فرجع إلى الشام وتبعه عبد الله {cite:tarikh-khulafa-minhaj-1434 p. 413}، وعند المسعودي نزل مروان على الزاب الصغير وعقد عليه الجسر وأتاه عبد الله بن علي في عساكر أهل خراسان ليلتين خلتا من جمادى الآخرة سنة اثنتين وثلاثين ومائة، وكردس مروان خيله كراديس ألفاً وألفين فكانت على مروان فانهزم يوم السبت لإحدى عشرة ليلة خلت من جمادى الآخرة وغرق من بني أمية ثلاثمائة رجل فيهم إبراهيم بن الوليد المخلوع {cite:muruj-al-dhahab p. 231-232}"
  en: "In the year 132 Marwan ibn Muhammad was defeated at al-Zab {cite:tabari-tarikh-abu-al-fadl j.7 p.432}, and was killed after the defeat {cite:tabari-tarikh-abu-al-fadl j.7 p.437}. According to al-Suyuti, the Abbasids rose against Marwan under Abd Allah ibn Ali, paternal uncle of al-Saffah; he marched against them, the two hosts met near Mosul, Marwan was broken and returned to Syria, and Abd Allah followed him {cite:tarikh-khulafa-minhaj-1434 p. 413}. According to al-Mas'udi, Marwan camped at the Lesser Zab and had a bridge built over it; Abd Allah ibn Ali came to him with the armies of the people of Khurasan two nights into Jumada II of the year 132, and Marwan arranged his cavalry in squadrons of one thousand and two thousand. It went against Marwan: he was routed on Saturday, eleven nights into Jumada II, and three hundred men of the Umayyads drowned, among them Ibrahim ibn al-Walid, who had been deposed {cite:muruj-al-dhahab p. 231-232}"
