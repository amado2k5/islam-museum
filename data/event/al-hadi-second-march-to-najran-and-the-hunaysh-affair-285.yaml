id: event/al-hadi-second-march-to-najran-and-the-hunaysh-affair-285
class: event
kind: other
label:
  ar: خروج الهادي إلى نجران المرة الثانية بعد نهب مال عماله على يد حنيش الوادعي، جمادى الأولى 285هـ
  en: Al-Hadi's second march to Najran after Hunaysh al-Wadi'i seized his agents' money, Jumada I 285 AH
  ur: ہادی کا نجران کی طرف دوسرا سفر جب حنیش وادعی نے ان کے کارندوں کا مال لوٹا، جمادی الاولیٰ 285ھ
summary:
  ar: خرج عمال للهادي من نجران ومعهم مال نحو ألف دينار فتبعهم حنيش من وادعة في جماعة من عشيرته في موضع الركب، وأخذوا المال وقتلوا رجلاً، فسار الهادي إلى نجران يوم الاثنين 12 جمادى الأولى 285هـ ونزل شوكان قرية حنيش، ولما أبى رد المال أمر بقطع نخله وأعنابه وهدم منزله، ثم يروي الراوي موت حنيش بعد يومين من طعنة في يده.
  en: Al-Hadi's agents leaving Najran with about a thousand dinars were followed at a place called al-Rakb by Hunaysh of Wadi'a with a band of his clan, who took the money and killed a man; on Monday 12 Jumada I 285 AH al-Hadi marched to Najran and camped at Shawkan, Hunaysh's village, and when he refused to return the money ordered his palms and vines cut and his house pulled down; the narrator then relates Hunaysh's death two days later of a stab wound in the hand.
  ur: نجران سے نکلتے ہادی کے کارندے، جن کے پاس تقریباً ہزار دینار تھے، «الرکب» نامی جگہ پر وادعہ کے حنیش اور اس کے قبیلے کی جماعت کے پیچھا کرنے پر لٹ گئے اور ایک آدمی قتل ہوا؛ ہادی پیر 12 جمادی الاولیٰ 285ھ کو نجران روانہ ہوئے اور حنیش کی بستی شوکان میں اترے، اور جب اس نے مال لوٹانے سے انکار کیا تو اس کے کھجور اور انگور کاٹنے اور گھر گرانے کا حکم دیا؛ پھر راوی بتاتا ہے کہ حنیش دو دن بعد ہاتھ کے زخم سے مر گیا۔
