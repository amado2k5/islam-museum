id: event/al-hadi-second-march-to-najran-and-the-hunaysh-affair-285
class: event
kind: other
label:
  ar: خروج الهادي إلى نجران المرة الثانية بعد نهب مال عماله على يد حنيش الوادعي، جمادى الأولى 285هـ
  en: Al-Hadi's second march to Najran after Hunaysh al-Wadi'i seized his agents' money, Jumada I 285 AH
  ur: ہادی کا نجران کی طرف دوسرا سفر جب حنیش وادعی نے ان کے کارندوں کا مال لوٹا، جمادی الاولیٰ 285ھ
  es: "Segunda marcha de Al-Hadi a Najrán después de que Hunaysh al-Wadi'i se apoderara del dinero de sus agentes, Jumada I 285 AH"
  fr: "La seconde marche d'Al-Hadi vers Najran après la saisie de l'argent de ses agents par Hunaysh al-Wadi'i eut lieu le 1er juillet 285 de l'Hégire."
  tr: "El-Hadi, işçilerinin parası Haniş el-Vadi'i tarafından yağmalandıktan sonra ikinci kez Necran'a gitti (Hicri Cemâde el-Evvel 285)."
  id: "Al-Hadi berangkat ke Najran untuk kedua kalinya setelah uang para pekerjanya dirampok oleh Hanish Al-Wadi'i, Jumada Al-Awwal 285 H."
summary:
  ar: خرج عمال للهادي من نجران ومعهم مال نحو ألف دينار فتبعهم حنيش من وادعة في جماعة من عشيرته في موضع الركب، وأخذوا المال وقتلوا رجلاً، فسار الهادي إلى نجران يوم الاثنين 12 جمادى الأولى 285هـ ونزل شوكان قرية حنيش، ولما أبى رد المال أمر بقطع نخله وأعنابه وهدم منزله، ثم يروي الراوي موت حنيش بعد يومين من طعنة في يده.
  en: Al-Hadi's agents leaving Najran with about a thousand dinars were followed at a place called al-Rakb by Hunaysh of Wadi'a with a band of his clan, who took the money and killed a man; on Monday 12 Jumada I 285 AH al-Hadi marched to Najran and camped at Shawkan, Hunaysh's village, and when he refused to return the money ordered his palms and vines cut and his house pulled down; the narrator then relates Hunaysh's death two days later of a stab wound in the hand.
  ur: نجران سے نکلتے ہادی کے کارندے، جن کے پاس تقریباً ہزار دینار تھے، «الرکب» نامی جگہ پر وادعہ کے حنیش اور اس کے قبیلے کی جماعت کے پیچھا کرنے پر لٹ گئے اور ایک آدمی قتل ہوا؛ ہادی پیر 12 جمادی الاولیٰ 285ھ کو نجران روانہ ہوئے اور حنیش کی بستی شوکان میں اترے، اور جب اس نے مال لوٹانے سے انکار کیا تو اس کے کھجور اور انگور کاٹنے اور گھر گرانے کا حکم دیا؛ پھر راوی بتاتا ہے کہ حنیش دو دن بعد ہاتھ کے زخم سے مر گیا۔
  es: "Los agentes de Al-Hadi que salieron de Najran con unos mil dinares fueron seguidos en un lugar llamado al-Rakb por Hunaysh de Wadi'a con una banda de su clan, quienes tomaron el dinero y mataron a un hombre; el lunes 12 de Jumada I de 285 AH, Al-Hadi marchó a Najran y acampó en Shawkan, la aldea de Hunaysh, y cuando este se negó a devolver el dinero, ordenó que le cortaran las palmas de las manos y las vides y que derribaran su casa; el narrador relata luego la muerte de Hunaysh dos días después por una puñalada en la mano."
  fr: "Les agents d'Al-Hadi quittèrent Najran avec environ mille dinars. Ils furent suivis à un endroit appelé al-Rakb par Hunaysh de Wadi'a et une bande de son clan, qui s'emparèrent de l'argent et tuèrent un homme. Le lundi 12 Jumada I 285 AH, al-Hadi marcha sur Najran et campa à Shawkan, le village de Hunaysh. Comme ce dernier refusait de rendre l'argent, il ordonna de couper ses palmiers et ses vignes et de démolir sa maison. Le narrateur relate ensuite la mort de Hunaysh deux jours plus tard, des suites d'une blessure par arme blanche à la main."
  tr: "El-Hadi'nin işçileri yaklaşık bin dinar parayla Necran'dan ayrıldılar ve Vadi'ah'tan Haniş, kervanın bulunduğu yerde aşiretinden bir grupla onları takip etti. Parayı aldılar ve bir adamı öldürdüler. Bunun üzerine El-Hadi, Hicri 285 yılının Cemadi el-Ula ayının 12. Pazartesi günü Necran'a gitti ve Haniş'in köyü Şevkan'da kaldı. Parayı iade etmeyi reddedince, hurma ağaçlarının ve üzüm bağlarının kesilmesini ve evinin yıkılmasını emretti. Ardından anlatıcı, Haniş'in iki gün sonra elinden bıçaklanarak öldüğünü anlatır."
  id: "Para pekerja Al-Hadi meninggalkan Najran dengan membawa uang sekitar seribu dinar, dan Hanish dari Wadi’ah mengikuti mereka bersama sekelompok anggota klannya di tempat kafilah itu berada. Mereka mengambil uang itu dan membunuh seorang pria. Maka Al-Hadi pergi ke Najran pada hari Senin, tanggal 12 Jumada al-Ula, 285 H, dan tinggal di Shawkan, desa Hanish. Ketika Hanish menolak mengembalikan uang itu, Al-Hadi memerintahkan pohon kurma dan tanaman anggurnya ditebang dan rumahnya dihancurkan. Kemudian perawi menceritakan bahwa Hanish meninggal dua hari kemudian karena luka tusukan di tangannya."
