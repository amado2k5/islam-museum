label: { ar: "وفاة صلاح الدين وتركته", en: "Death of Salah al-Din and his estate", es: "Fallecimiento de Saladino y su legado", fr: "Décès de Saladin et de ses biens", ur: "صلاح الدین کی موت اور اس کی جائیداد", tr: "Selahaddin'in ölümü ve mirası", id: "Kematian dan warisan Saladin" }
summary:
  ar: "وفي سنة تسع وثمانين مات السلطان صلاح الدين فوصل إلى بغداد الرسول وفي صحبته لأمة الحرب التي لصلاح الدين وفرسه ودينار واحد وستة وثلاثون درهماً لم يخلف من المال سواها واستقرت مصر لابنه عماد الدين عثمان الملك العزيز ودمشق لابنه الملك الأفضل نور الدين علي وحلب لابنه الملك الظاهر غياث الدين غازي {cite:tarikh-khulafa-minhaj-1434 p. 693}."
  en: "In 589 sultan Salah al-Din died; the envoy reached Baghdad with his war-standard, his horse, and one dinar with thirty-six dirhams — all the wealth he left. Egypt settled for his son al-Aziz Imad al-Din Uthman, Damascus for al-Afdal Nur al-Din Ali, Aleppo for al-Zahir Ghiyath al-Din Ghazi {cite:tarikh-khulafa-minhaj-1434 p. 693}."
  es: "En 589 murió el sultán Saladino; el enviado llegó a Bagdad con su estandarte de guerra, su caballo y un dinar con treinta y seis dirhams, toda la riqueza que dejó. Egipto se estableció para su hijo al-Aziz Imad al-Din Uthman, Damasco para al-Afdal Nur al-Din Ali, Alepo para al-Zahir Ghiyath al-Din Ghazi {cite:tarikh-khulafa-minhaj-1434 p. 693}."
  fr: "En 589, le sultan Saladin mourut; l’envoyé arriva à Bagdad avec son étendard de guerre, son cheval et un dinar accompagné de trente-six dirhams – l’intégralité de ses biens. L’Égypte s’établit en faveur de son fils al-Aziz Imad al-Din Uthman, Damas en faveur d’al-Afdal Nur al-Din Ali, et Alep en faveur d’al-Zahir Ghiyath al-Din Ghazi (voir: Tarikh-Khulafa-Minhaj-1434, p. 693)."
  ur: "589 میں سلطان صلاح الدین کا انتقال ہوا۔ ایلچی اپنے جنگی معیار، گھوڑے اور ایک دینار کے ساتھ چھتیس درہم کے ساتھ بغداد پہنچا - تمام دولت اس نے چھوڑ دی۔ مصر اپنے بیٹے العزیز عماد الدین عثمان کے لیے، دمشق نے الفضل نورالدین علی کے لیے، حلب الظاہر غیاث الدین غازی کے لیے بسایا۔ 693}۔"
  tr: "89 yılında Sultan Selahaddin vefat etti. Elçi, Selahaddin'in savaş makinesi, atı, bir dinar ve otuz altı dirhem eşliğinde Bağdat'a ulaştı. Bunların dışında başka para bırakmadı. Mısır, oğlu İmaddin Osman el-Malik el-Aziz'e, Şam oğlu el-Malik el-Afdal Nur el-Din Ali'ye ve Halep oğlu el-Malik el-Zahir Gıyat el-Din Gazi'ye bırakıldı. {cite:tarikh-khulafa-minhaj-1434 s. 693}"
  id: "Pada tahun 89, Sultan Salah al-Din wafat. Utusan tiba di Baghdad, ditem ditemani oleh mesin perang Salah al-Din, kudanya, satu dinar, dan tiga puluh enam dirham. Ia tidak meninggalkan uang lain selain itu. Mesir diberikan kepada putranya Imad al-Din Uthman al-Malik al-Aziz, Damaskus kepada putranya al-Malik al-Afdal Nur al-Din Ali, dan Aleppo kepada putranya al-Malik al-Zahir Ghiyath al-Din Ghazi. {cite:tarikh-khulafa-minhaj-1434 p. 693}."
