summary:
  ar: "وفي سنة تسع وثمانين مات السلطان صلاح الدين فوصل إلى بغداد الرسول وفي صحبته لأمة الحرب التي لصلاح الدين وفرسه ودينار واحد وستة وثلاثون درهماً لم يخلف من المال سواها واستقرت مصر لابنه عماد الدين عثمان الملك العزيز ودمشق لابنه الملك الأفضل نور الدين علي وحلب لابنه الملك الظاهر غياث الدين غازي {cite:tarikh-khulafa-minhaj-1434 p. 693}."
  en: "In 589 sultan Salah al-Din died; the envoy reached Baghdad with his war-standard, his horse, and one dinar with thirty-six dirhams — all the wealth he left. Egypt settled for his son al-Aziz Imad al-Din Uthman, Damascus for al-Afdal Nur al-Din Ali, Aleppo for al-Zahir Ghiyath al-Din Ghazi {cite:tarikh-khulafa-minhaj-1434 p. 693}."
