label: { ar: "وصية النبي لمعاذ بن جبل عند توديعه إلى اليمن", en: "The Prophet's parting counsel to Mu'adh ibn Jabal on sending him to Yemen", ur: "یمن بھیجتے وقت معاذ بن جبل کو نبی کی رخصتی کی وصیت", es: "El consejo de despedida del Profeta a Mu'adh ibn Jabal al enviarlo a Yemen.", fr: "Conseils d'adieu du Prophète à Mu'adh ibn Jabal avant son départ pour le Yémen", tr: "Peygamberimizin, Mu'adh ibn Jabal'ı Yemen'den uğurlarken verdiği öğütler.", id: "Nasihat Nabi kepada Mu'adz bin Jabal saat berpamitan kepadanya di Yaman." }
summary:
  ar: "روى معاذ بن جبل أن النبي لما بعثه إلى اليمن خرج معه يوصيه ومعاذ راكب والنبي يمشي تحت راحلته، فلما فرغ قال: يا معاذ إنك عسى أن لا تلقاني بعد عامي هذا ولعلك أن تمر بمسجدي وقبري، فبكى معاذ خشعاً لفراقه {cite:al-bidaya-wal-nihaya scan vol. 3 p. 109}{cite:dalail-al-nubuwwa-bayhaqi scan vol. 3 p. 416}. وفي روايات أخرى عند ابن كثير أوصاه أن يدعو أهل الكتاب إلى الشهادة ثم الصلوات الخمس ثم الصدقة التي تؤخذ من أغنيائهم فتردّ على فقرائهم وأن يتقي كرائم أموالهم ودعوة المظلوم {cite:al-bidaya-wal-nihaya scan vol. 3 p. 108}، وقال له: اتق الله حيثما كنت، وأتبع السيئة الحسنة تمحها، وخالق الناس بخلق حسن {cite:al-bidaya-wal-nihaya scan vol. 3 p. 110}."
  en: "Mu'adh ibn Jabal reports that when the Prophet sent him to Yemen he went out with him counselling him, Mu'adh riding and the Prophet walking beneath his mount, and when he had finished he said: O Mu'adh, you may not meet me after this year of mine, and perhaps you will pass by this mosque of mine and my grave; and Mu'adh wept from distress at parting {cite:al-bidaya-wal-nihaya scan vol. 3 p. 109}{cite:dalail-al-nubuwwa-bayhaqi scan vol. 3 p. 416}. In other reports in Ibn Kathir he told him to call the People of the Book first to the testimony, then to the five prayers, then to the alms taken from their rich and returned to their poor, and to avoid the best of their property and the supplication of the wronged {cite:al-bidaya-wal-nihaya scan vol. 3 p. 108}, and said to him: fear God wherever you are, follow a bad deed with a good one and it will erase it, and treat people with good character {cite:al-bidaya-wal-nihaya scan vol. 3 p. 110}."
  ur: "معاذ بن جبل روایت کرتے ہیں کہ جب نبی نے انھیں یمن بھیجا تو آپ ان کے ساتھ نصیحت کرتے ہوئے نکلے، معاذ سوار تھے اور نبی ان کی سواری کے نیچے پیدل چل رہے تھے؛ جب بات ختم کی تو فرمایا: اے معاذ! شاید تم اس سال کے بعد مجھ سے نہ مل سکو، اور شاید میری اس مسجد اور میری قبر کے پاس سے گزرو؛ تو معاذ جدائی کے غم سے رو پڑے {cite:al-bidaya-wal-nihaya scan vol. 3 p. 109}{cite:dalail-al-nubuwwa-bayhaqi scan vol. 3 p. 416}۔ ابن کثیر کی دوسری روایات میں ہے کہ آپ نے انھیں حکم دیا کہ اہلِ کتاب کو پہلے شہادت کی دعوت دیں، پھر پانچ نمازوں کی، پھر اس صدقے کی جو ان کے مال داروں سے لے کر ان کے فقیروں کو لوٹایا جائے، اور ان کے عمدہ مالوں اور مظلوم کی بددعا سے بچیں {cite:al-bidaya-wal-nihaya scan vol. 3 p. 108}؛ اور فرمایا: جہاں بھی ہو اللہ سے ڈرو، برائی کے بعد نیکی کرو وہ اسے مٹا دے گی، اور لوگوں سے اچھے اخلاق سے پیش آؤ {cite:al-bidaya-wal-nihaya scan vol. 3 p. 110}۔"
  es: "Mu'adh ibn Jabal relata que cuando el Profeta lo envió a Yemen, salió con él aconsejándole, Mu'adh cabalgando y el Profeta caminando bajo su montura, y cuando hubo terminado dijo: Oh Mu'adh, puede que no me encuentres después de este año mío, y tal vez pases por esta mezquita mía y mi tumba; y Mu'adh lloró de angustia al separarse {cite:al-bidaya-wal-nihaya scan vol. 3 p. 109}{cite:dalail-al-nubuwwa-bayhaqi scan vol. 3 p. 416}. En otros relatos de Ibn Kathir le dijo que llamara a la Gente del Libro primero al testimonio, luego a las cinco oraciones, luego a la limosna tomada de sus ricos y devuelta a sus pobres, y a evitar lo mejor de sus propiedades y la súplica de los agraviados {cite:al-bidaya-wal-nihaya scan vol. 3 p. 108}, y le dijo: Teme a Dios dondequiera que estés, sigue una mala acción con una buena y la borrará, y trata a la gente con buen carácter {cite:al-bidaya-wal-nihaya scan vol. 3 p. 110}."
  fr: "Mu'adh ibn Jabal rapporte que lorsque le Prophète l'envoya au Yémen, il l'accompagna pour le conseiller. Mu'adh chevauchait et le Prophète marchait sous sa monture. Lorsqu'il eut terminé, il dit: « Ô Mu'adh, il est possible que tu ne me revoies plus après cette année, et peut-être passeras-tu devant ma mosquée et ma tombe. » Mu'adh pleura de chagrin au moment des adieux. (Voir: al-bidaya-wal-nihaya, vol. 3, p. 109) (Voir: dalail-al-nubuwwa-bayhaqi, vol. 3, p. 416). Dans d'autres récits rapportés par Ibn Kathir, il lui conseilla d'appeler d'abord les Gens du Livre au témoignage, puis aux cinq prières, puis à l'aumône prise aux riches et redistribuée aux pauvres, et de s'abstenir de prendre le meilleur de leurs biens et d'implorer les lésés. (Voir: al-bidaya-wal-nihaya, vol. 3, p. 416). 108}, et lui dit: crains Dieu où que tu sois, fais suivre une mauvaise action par une bonne et elle l'effacera, et traite les gens avec un bon caractère {cite:al-bidaya-wal-nihaya scan vol. 3 p. 110}."
  tr: "Mu'az ibn Cebel rivayet etti ki, Peygamber onu Yemen'e gönderdiğinde, ona talimatlar vermek için onunla birlikte yola çıktı. Mu'az binek hayvanı üzerindeydi ve Peygamber onun binek hayvanının altında yürüyordu. İşini bitirdiğinde, \"Ey Mu'az, belki bu yıldan sonra benimle karşılaşmayacaksın ve belki de mescidimin ve kabrimin yanından geçeceksin\" dedi. Mu'az, ayrılık düşüncesiyle tevazudan ağladı. {al-bidaya-wal-nihaya tarama cilt 3 s. 109}{dalail-al-nubuwwa-bayhaqi tarama cilt 3 s. 416}. İbn Kathir'in diğer rivayetlerinde ise, ona Kitap Ehli'ni önce imana çağırıp, sonra beş vakit namaza, sonra da zenginlerinden alıp fakirlerine vermelerini ve mallarının en iyisini ve mazlumların dualarını almaktan sakınmasını öğütledi. {al-bidaya-wal-nihaya tarama cilt 3 s. 108}. Ayrıca ona şöyle dedi: \"Nerede olursan ol Allah'tan kork, kötü bir ameli iyi bir alemle telafi et ve insanlara iyi ahlakla davran.\" {cite:al-bidaya-wal-nihaya scan vol. 3 p. 109} 3 p. 110}."
  id: "Mu'adh bin Jabal meriwayatkan bahwa ketika Nabi mengutusnya ke Yaman, ia pergi bersamanya untuk memberikan petunjuk. Mu'adh menunggang kuda, dan Nabi berjalan di bawah tunggangannya. Setelah selesai, beliau berkata, \"Wahai Mu'adh, mungkin engkau tidak akan bertemu denganku lagi setelah tahun ini, dan mungkin engkau akan melewati masjidku dan kuburku.\" Mu'adh menangis karena iba memikirkan perpisahan itu. {cite:al-bidaya-wal-nihaya scan vol. 3 p. 109}{cite:dalail-al-nubuwwa-bayhaqi scan vol. 3 p. 416}. Dalam riwayat lain oleh Ibn Kathir, beliau menginstruksikan Mu'adh untuk mengajak Ahli Kitab kepada keimanan, kemudian kepada shalat lima waktu, kemudian kepada sedekah yang diambil dari orang kaya dan diberikan kepada orang miskin, dan untuk berhati-hati dalam mengambil harta terbaik mereka dan doa orang-orang yang tertindas. {cite:al-bidaya-wal-nihaya scan vol. 3 p. 108}. Dia juga berpesan kepadanya, \"Takutlah kepada Allah di mana pun kamu berada, dan perbaikilah perbuatan buruk dengan perbuatan baik untuk menghapusnya, dan perlakukanlah orang lain dengan akhlak yang baik.\" {cite:al-bidaya-wal-nihaya scan vol. 3 p. 109} 3 p. 110}."
