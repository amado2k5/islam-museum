label: { ar: "يوم بُعاث", en: "The day of Bu'ath" }
summary:
  ar: "آخر حروب الأوس والخزرج وأكبرها قبل الإسلام، على بعد نحو خمس سنين من الهجرة على الأصح؛ وكانت قد دارت بينهم قبله حرب مُتَيمر وحرب كعب بن عمرو ويوم السرارة ويوم الديك، ويذكر السمهودي أيضاً يوم فارع والفجارين الأول والثاني وحرب حضير بن الأسلت وحرب حاطب بن قيس، حتى قال الخطابي إن الحرب ظلت قائمة مائة وعشرين سنة إلى الإسلام على ما رُوي عن ابن إسحاق {cite:samhudi-wafa-al-wafa p. 227}. اقتتلوا في بُعاث وهو موضع عند أعلى قَوْرى، بعد أن تحالفت الأوس — وقد غُلبت في الحروب السالفة — مع قريظة والنضير ونزل بعض بطونها خيبر نحو سنة، وكان قد سبق ذلك أن سعت الأوس إلى حلف قريش بمكة فنقضته قريش بحيلة، نسبها ابن شبة إلى الوليد بن المغيرة {cite:samhudi-wafa-al-wafa p. 227-229}. فلما افتخرت الخزرج بالفوز وأخذت رهن اليهود تمّت الحرب، وقُتل فيها رئيسا الفريقين: حُضَيْر الكتائب والد أسيد بن حضير للأوس، وعمرو بن النعمان البياضي للخزرج — وقد أنذره عبد الله بن أُبيّ أنه يُحمَل قتيلاً فأجابه بعصيان، فجيء به محمولاً على أربعة كما قال — وكانت الدَّبْرة أولاً على الخزرج ثم ثبّت حضير الأوس فرجعوا وانتصروا، ونجا سعد بن معاذ بجوار عمرو بن الجموح؛ وفي الصحيح قالت عائشة «كان يوم بعاث يوماً قدَّمه الله رسوله في دخولهم في الإسلام، فقدِم رسول الله وقد افترق ملؤهم وقُتلت سراتهم» {cite:sahih-al-bukhari 3777}، ويورده السمهودي في بابها {cite:samhudi-wafa-al-wafa p. 227-230}."
  en: "The last and greatest of the Aws–Khazraj wars before Islam, about five years before the Hijra on the soundest view; before it ran the war of Mutaymir, the war of Ka'b ibn 'Amr, the day of al-Sarara and the day of al-Dayk — al-Samhudi adds the day of Fari', the two Fijar wars, and the wars of Hudayr ibn al-Aslat and Hatib ibn Qays — until al-Khattabi reports a tradition that war stood between them a hundred and twenty years to Islam {cite:samhudi-wafa-al-wafa p. 227}. They fought at Bu'ath, a site at the head of Qawra, after the long-bested Aws allied with Qurayza and al-Nadir — its earlier bid for a Quraysh pact at Mecca having been dissolved by a ruse Ibn Shabba ascribes to al-Walid ibn al-Mughira — and some of its clans withdrew about a year to Khaybar {cite:samhudi-wafa-al-wafa p. 227-229}. When the Khazraj boasted of victory and seized the Jews' hostages, the war was joined. Both chiefs fell: Hudayr 'al-Kata'ib', father of Usayd, for the Aws, and 'Amr ibn al-Nu'man al-Bayadi for the Khazraj — 'Abdallah ibn Ubayy had warned him he would be borne off slain, and four men carried him in as foretold; the rout first fell on the Khazraj until Hudayr rallied the Aws to victory, and Sa'd ibn Mu'adh escaped under 'Amr ibn al-Jamuh's protection; in the Sahih 'A'isha says 'the day of Bu'ath was a day God sent ahead of His Messenger for their entering Islam — he came when their assembly had scattered and their chiefs been slain' {cite:sahih-al-bukhari 3777}, a report al-Samhudi also transmits in her chapter {cite:samhudi-wafa-al-wafa p. 227-230}."
