id: event/yawm-buath
class: event
kind: battle
label: { ar: "يوم بُعاث", en: "The day of Bu'ath", es: "El día de Bu'ath", fr: "Le jour de Bu'ath", ur: "بعثت کا دن", tr: "Buath Günü", id: "Hari Bu'ath" }
summary:
  ar: "آخر حروب الأوس والخزرج وأكبرها قبل الإسلام، على بعد نحو خمس سنين من الهجرة على الأصح؛ وكانت قد دارت بينهم قبله حرب مُتَيمر وحرب كعب بن عمرو ويوم السرارة ويوم الديك، ويذكر السمهودي أيضاً يوم فارع والفجارين الأول والثاني وحرب حضير بن الأسلت وحرب حاطب بن قيس، حتى قال الخطابي إن الحرب ظلت قائمة مائة وعشرين سنة إلى الإسلام على ما رُوي عن ابن إسحاق {cite:samhudi-wafa-al-wafa p. 227}. اقتتلوا في بُعاث وهو موضع عند أعلى قَوْرى، بعد أن تحالفت الأوس — وقد غُلبت في الحروب السالفة — مع قريظة والنضير ونزل بعض بطونها خيبر نحو سنة، وكان قد سبق ذلك أن سعت الأوس إلى حلف قريش بمكة فنقضته قريش بحيلة، نسبها ابن شبة إلى الوليد بن المغيرة {cite:samhudi-wafa-al-wafa p. 227-229}. فلما افتخرت الخزرج بالفوز وأخذت رهن اليهود تمّت الحرب، وقُتل فيها رئيسا الفريقين: حُضَيْر الكتائب والد أسيد بن حضير للأوس، وعمرو بن النعمان البياضي للخزرج — وقد أنذره عبد الله بن أُبيّ أنه يُحمَل قتيلاً فأجابه بعصيان، فجيء به محمولاً على أربعة كما قال — وكانت الدَّبْرة أولاً على الخزرج ثم ثبّت حضير الأوس فرجعوا وانتصروا، ونجا سعد بن معاذ بجوار عمرو بن الجموح؛ وفي الصحيح قالت عائشة «كان يوم بعاث يوماً قدَّمه الله رسوله في دخولهم في الإسلام، فقدِم رسول الله وقد افترق ملؤهم وقُتلت سراتهم» {cite:sahih-al-bukhari 3777}، ويورده السمهودي في بابها {cite:samhudi-wafa-al-wafa p. 227-230} ومن مشاهده أن حضير الكتائب لما انهزمت الأوس برك وطعن قدمه بسنان رمحه وصاح واعقراه كعقر الجمل والله لا أعود حتى أقتل فعطفوا عليه، وأن عبد الله بن أبي تخلف عن الخزرج فلما طلع عليه عمرو بن النعمان رئيسهم قتيلًا في عباءة قال ذق وبال البغي، وأن صائحًا صاح يا معشر الأوس أحسنوا ولا تهلكوا إخوانكم فجوارهم خير من جوار الثعالب فكفوا عنهم ولم يسلبوهم وإنما سلبهم قريظة والنضير، وأجار سعد بن معاذ الأشهلي أموال بني سلمة، وجز أحدهم ناصية الزبير بن إياس بن باطا وأطلقه وهي اليد التي جازى بها ثابت بن قيس يوم بني قريظة {cite:kamil-ibn-al-athir p. 509-510}."
  en: "The last and greatest of the Aws–Khazraj wars before Islam, about five years before the Hijra on the soundest view; before it ran the war of Mutaymir, the war of Ka'b ibn 'Amr, the day of al-Sarara and the day of al-Dayk — al-Samhudi adds the day of Fari', the two Fijar wars, and the wars of Hudayr ibn al-Aslat and Hatib ibn Qays — until al-Khattabi reports a tradition that war stood between them a hundred and twenty years to Islam {cite:samhudi-wafa-al-wafa p. 227}. They fought at Bu'ath, a site at the head of Qawra, after the long-bested Aws allied with Qurayza and al-Nadir — its earlier bid for a Quraysh pact at Mecca having been dissolved by a ruse Ibn Shabba ascribes to al-Walid ibn al-Mughira — and some of its clans withdrew about a year to Khaybar {cite:samhudi-wafa-al-wafa p. 227-229}. When the Khazraj boasted of victory and seized the Jews' hostages, the war was joined. Both chiefs fell: Hudayr 'al-Kata'ib', father of Usayd, for the Aws, and 'Amr ibn al-Nu'man al-Bayadi for the Khazraj — 'Abdallah ibn Ubayy had warned him he would be borne off slain, and four men carried him in as foretold; the rout first fell on the Khazraj until Hudayr rallied the Aws to victory, and Sa'd ibn Mu'adh escaped under 'Amr ibn al-Jamuh's protection; in the Sahih 'A'isha says 'the day of Bu'ath was a day God sent ahead of His Messenger for their entering Islam — he came when their assembly had scattered and their chiefs been slain' {cite:sahih-al-bukhari 3777}, a report al-Samhudi also transmits in her chapter {cite:samhudi-wafa-al-wafa p. 227-230}."
  es: "La última y más grande de las guerras de Aws-Khazraj antes del Islam, unos cinco años antes de la Hégira según la opinión más sólida; antes de ella se desarrolló la guerra de Mutaymir, la guerra de Ka'b ibn 'Amr, el día de al-Sarara y el día de al-Dayk —al-Samhudi añade el día de Fari', las dos guerras de Fijar y las guerras de Hudayr ibn al-Aslat y Hatib ibn Qays— hasta que al-Khattabi informa de una tradición que afirma que hubo guerra entre ellos ciento veinte años antes del Islam {cite:samhudi-wafa-al-wafa p. 227}. Lucharon en Bu'ath, un sitio en la cabecera de Qawra, después de que los Aws, largamente derrotados, se aliaran con Qurayza y al-Nadir —su intento anterior de un pacto con los Quraysh en La Meca había sido disuelto por una estratagema que Ibn Shabba atribuye a al-Walid ibn al-Mughira— y algunos de sus clanes se retiraron aproximadamente un año a Khaybar {cite:samhudi-wafa-al-wafa p. 227-229}. Cuando los Khazraj se jactaron de la victoria y tomaron a los rehenes judíos, se unió la guerra. Ambos jefes cayeron: Hudayr 'al-Kata'ib', padre de Usayd, por los Aws, y 'Amr ibn al-Nu'man al-Bayadi por los Khazraj —'Abdallah ibn Ubayy le había advertido que sería llevado muerto, y cuatro hombres lo llevaron como se predijo; La derrota recayó primero sobre los Khazraj hasta que Hudayr reagrupó a los Aws para la victoria, y Sa'd ibn Mu'adh escapó bajo la protección de 'Amr ibn al-Jamuh; en el Sahih 'A'isha dice 'el día de Bu'ath fue un día que Dios envió antes de Su Mensajero para que entraran en el Islam; él llegó cuando su asamblea se había dispersado y sus jefes habían sido asesinados' {cite:sahih-al-bukhari 3777}, un informe que al-Samhudi también transmite en su capítulo {cite:samhudi-wafa-al-wafa p. 227-230}."
  fr: "La dernière et la plus importante des guerres Aws-Khazraj avant l'Islam, environ cinq ans avant l'Hégire selon l'avis le plus solide; avant elle eurent lieu la guerre de Mutaymir, la guerre de Ka'b ibn 'Amr, le jour d'al-Sarara et le jour d'al-Dayk — al-Samhudi ajoute le jour de Fari', les deux guerres de Fidji, et les guerres de Hudayr ibn al-Aslat et Hatib ibn Qays — jusqu'à ce qu'al-Khattabi rapporte une tradition selon laquelle une guerre les sépara pendant cent vingt ans avant l'Islam {cite:samhudi-wafa-al-wafa p. 227}. Ils combattirent à Bu'ath, un site situé à l'entrée de Qawra, après que les Aws, longtemps vaincus, se furent alliés aux Qurayzas et à al-Nadir — leur précédente tentative de pacte avec les Qurayshites à La Mecque ayant été déjouée par une ruse qu'Ibn Shabba attribue à al-Walid ibn al-Mughira — et que certains de leurs clans se furent retirés environ un an plus tard à Khaybar (voir Samhudi-Wafa-Al-Wafa, p. 227-229). Lorsque les Khazraj se vantèrent de leur victoire et s'emparèrent des otages juifs, la guerre reprit. Les deux chefs tombèrent: Hudayr al-Kata'ib, père d'Usayd, pour les Aws, et Amr ibn al-Nu'man al-Bayadi pour les Khazraj — Abdallah ibn Ubayy l'avait averti qu'il serait emporté mort, et quatre hommes le portèrent comme prédit. La déroute s'abattit d'abord sur les Khazraj jusqu'à ce que Hudayr rallie les Aws à la victoire, et Sa'd ibn Mu'adh s'échappa sous la protection d'Amr ibn al-Jamuh; dans le Sahih, Aïcha dit: « Le jour de Bu'ath fut un jour que Dieu envoya devant Son Messager pour leur entrée dans l'Islam — il arriva alors que leur assemblée s'était dispersée et que leurs chefs avaient été tués » {cite: sahih-al-bukhari 3777}, un récit qu'al-Samhudi transmet également dans son chapitre {cite: samhudi-wafa-al-wafa p. 227-230}."
  ur: "اسلام سے پہلے کی آخری اور سب سے بڑی اوس – خزرج جنگیں، ہجرت سے تقریباً پانچ سال پہلے کے بہترین منظر پر۔ اس سے قبل معتمیر کی جنگ، کعب بن عمرو کی جنگ، یوم الصرارہ اور یوم الدائک - السمھودی نے فاری کے دن کا اضافہ کیا، دو فجر کی جنگیں، اور حذیر بن الاصلت اور حاطب بن قیس کی جنگیں - یہاں تک کہ ایک روایت میں ہے کہ ستودہ اور ابن قیس کے درمیان جنگ ہوئی ہے۔ اسلام کے سال 227}۔ انہوں نے قریظہ اور النضیر کے ساتھ طویل عرصے سے سب سے اچھے اوس کے اتحاد کے بعد قورہ کے سرے پر واقع ایک مقام بوعث پر جنگ کی - مکہ میں قریش کے معاہدے کے لیے اس کی ابتدائی بولی ابن شبہ کے الولید ابن مغیرہ سے منسوب ایک چال سے تحلیل ہو گئی تھی - اور اس کے کچھ قبیلوں کے ساتھ تقریباً ایک سال تک {حوالہ: سمہدی وفا الوفاء ص۔ 227-229}۔ جب خزرج نے فتح کا گھمنڈ کیا اور یہودیوں کے یرغمالیوں کو پکڑ لیا تو جنگ میں شامل ہو گئے۔ دونوں سردار گر گئے: اوسید کے والد حیدر الکاتیب اور خزرج کے لیے عمرو بن نعمان البیادی - 'عبداللہ ابن ابی نے اسے خبردار کیا تھا کہ اسے قتل کیا جائے گا، اور چار آدمی اسے پیشگوئی کے مطابق لے گئے۔ سب سے پہلے خزرج پر شکست ہوئی یہاں تک کہ حُدیر نے اوس کو فتح کے لیے پیش کیا، اور سعد بن معاذ، عمرو بن جموح کی حفاظت میں فرار ہو گئے۔ صحیح میں عائشہ ا کہتی ہیں کہ بعثت کا دن وہ دن تھا جب اللہ نے اپنے رسول سے پہلے ان کے اسلام میں داخل ہونے کے لیے بھیجا تھا - وہ اس وقت آیا جب ان کی مجلس منتشر ہو چکی تھی اور ان کے سردار مارے گئے تھے۔ 227-230}۔"
  tr: "En güvenilir rivayete göre, Aws ve Hazrec kabileleri arasında İslam öncesi dönemde yaşanan son ve en büyük savaş, Hicret'ten yaklaşık beş yıl sonra gerçekleşti. Bundan önce, Mutaymir, Ka'b ibn Amr, Sara Günü ve Horoz Günü savaşlarını yapmışlardı. El-Samhudi ayrıca Fari' Günü, Fijar'ın birinci ve ikinci savaşları, Hudeyr ibn el-Aslat savaşı ve Hatib ibn Kays savaşından da bahseder. El-Hattabî ise, İbn İshak'ın rivayetine göre, savaşın İslam'ın gelişine kadar yüz yirmi yıl sürdüğünü belirtmiştir. {cite:samhudi-wafa-al-wafa s. 227}. Önceki savaşlarda yenilgiye uğrayan Aws kabilesi, Kurayza ve Nadir kabileleriyle ittifak kurduktan sonra, Qawra'nın yukarı kesimlerine yakın bir yer olan Bu'ath'ta savaştılar. Kabilenin bazı üyeleri yaklaşık bir yıldır Hayber'de yerleşmişti. Bundan önce Evsler, Mekke'de Kureyş ile ittifak kurmaya çalışmışlardı, ancak Kureyş, İbn Şabah'ın el-Velid ibn el-Muğire'ye atfettiği bir hileyle bu ittifakı bozmuştu. {cite:samhudi-wafa-al-wafa s. 227}. 227-229}. Hazrec, zaferleriyle övündüklerinde ve Yahudileri rehin aldıklarında savaş sona erdi ve iki tarafın iki lideri öldürüldü: Evsler adına Usayd ibn Hudhayr'ın babası Hudhayr al-Kata'ib ve Hazrecler adına Amr ibn al-Nu'man al-Bayadi—Abdullah ibn Ubay ona ölü olarak götürüleceği konusunda uyarıda bulunmuştu, ancak o meydan okuyarak karşılık verdi, bu yüzden dediği gibi dört adam tarafından taşınarak getirildi—ve Hazrecler başlangıçta yenildi, sonra Hudhayr Evsleri toparladı, böylece geri döndüler ve zafer kazandılar ve Sa'd ibn Mu'adh, Amr ibn al-Jamuh'un koruması altında kaçtı; Sahih'te Aişe şöyle demiştir: \"Bu'ath günü, Allah'ın Resulü'nün İslam'a girişleri için öne aldığı bir gündü. Allah'ın Resulü geldiğinde, liderleri dağılmış ve reisleri öldürülmüştü.\" {Sahih-i Buhari 3777} ve Samhudi de bunu bölümünde zikretmiştir. {Samhudi-Vafa-i Vafa s. 227-230} Onun gözlemlerinden biri şudur: Evsler yenilgiye uğradığında, tabur komutanı diz çökmüş, mızrağının ucuyla ayağına saplamış ve \"Vay halime!\" diye bağırmıştır, tıpkı devenin bacağının bağlanması gibi! Allah'a yemin ederim ki, öldürülene kadar geri dönmeyeceğim! Bunun üzerine ona yönelmişlerdir. Abdullah bin Abi ise Hazrec'ten geride kalmış ve liderleri Amr bin Nu'man ona ölü olarak, bir pelerin içinde göründüğünde, \"Gürültünün sonuçlarını tad!\" demiştir. Ve bir tellal şöyle bağırdı: “Ey Evs halkı, iyilik yapın ve kardeşlerinizi yok etmeyin, çünkü onların korunması tilkilerin korunmasından daha iyidir!” Bunun üzerine onlardan uzak durdular ve onları yağmalamadılar; aksine onları yağmalayanlar Kureyza ve Nadir oldu. Sa'd bin Mu'adh el-Eşhali, Beni Salama'nın mallarını korudu ve içlerinden biri Zübeyr bin İyas bin Bata'nın alnından bir tutam kesti ve onu serbest bıraktı; bu, Beni Kureyza günü Sabit bin Kays'ı ödüllendirdiği eldi. {Kaynak: Kamil İbn el-Athir, s. 509-510}"
  id: "Perang terakhir dan terbesar dari perang-perang pra-Islam antara suku Aws dan Khazraj terjadi sekitar lima tahun setelah Hijrah, menurut catatan yang paling dapat diandalkan. Sebelumnya, mereka telah berperang dalam perang Mutaymir, Ka'b ibn Amr, Hari Sarara, dan Hari Ayam Jantan. Al-Samhudi juga menyebutkan Hari Fari', pertempuran Fijar pertama dan kedua, perang Hudayr ibn al-Aslat, dan perang Hatib ibn Qays. Al-Khattabi bahkan menyatakan bahwa perang tersebut berlanjut selama seratus dua puluh tahun hingga kedatangan Islam, sebagaimana diriwayatkan oleh Ibn Ishaq. {cite:samhudi-wafa-al-wafa hlm. 227}. Mereka berperang di Bu'ath, sebuah tempat di dekat hulu Qawra, setelah suku Aws—yang telah dikalahkan dalam perang-perang sebelumnya—bersekutu dengan suku Qurayza dan Nadir. Sebagian klan mereka telah menetap di Khaybar selama sekitar satu tahun. Sebelumnya, suku Aws telah berupaya menjalin aliansi dengan suku Quraisy di Mekah, tetapi suku Quraisy menggagalkannya melalui tipu daya yang dinisbahkan oleh Ibnu Shabah kepada al-Walid ibn al-Mughirah. {cite:samhudi-wafa-al-wafa p. 227}. 227-229}. Ketika kaum Khazraj membual tentang kemenangan mereka dan menjadikan orang-orang Yahudi sebagai sandera, perang berakhir, dan kedua pemimpin dari kedua pihak terbunuh: Hudhayr al-Kata'ib, ayah dari Usayd ibn Hudhayr, dari pihak Aws, dan Amr ibn al-Nu'man al-Bayadi dari pihak Khazraj—Abdullah ibn Ubay telah memperingatkannya bahwa ia akan dibawa pergi dalam keadaan mati, tetapi ia menanggapi dengan sikap menantang, sehingga ia dibawa di atas empat orang, seperti yang telah ia katakan—dan kaum Khazraj awalnya dikalahkan, kemudian Hudhayr mengumpulkan kembali kaum Aws, sehingga mereka kembali dan meraih kemenangan, dan Sa'd ibn Mu'adh melarikan diri di bawah perlindungan Amr ibn al-Jamuh; Dan dalam Sahih, Aisyah berkata, “Hari Bu'ath adalah hari yang telah Allah persiapkan bagi Rasul-Nya untuk masuknya mereka ke dalam Islam, sehingga Rasulullah tiba dan para pemimpin mereka telah tercerai-berai dan para kepala suku mereka telah terbunuh” {kutip:sahih-al-bukhari 3777}, dan al-Samhudi menyebutkannya dalam babnya {kutip:samhudi-wafa-al-wafa hlm. 227-230}. Di antara pengamatannya adalah bahwa ketika Aws dikalahkan, komandan batalion berlutut dan menusuk kakinya dengan ujung tombaknya dan berteriak, “Celaka aku!” seperti unta yang pincang! Demi Allah, aku tidak akan kembali sampai aku terbunuh! Maka mereka berpaling kepadanya. Dan bahwa Abdullah bin Abi tertinggal dari Khazraj, dan ketika Amr bin Al-Nu’man, pemimpin mereka, muncul kepadanya dalam keadaan mati dengan jubah, dia berkata, “Rasakan akibat dari pelanggaran!” Dan seorang penyeru berseru, “Wahai kaum Aws, berbaik hatilah dan janganlah kalian menghancurkan saudara-saudara kalian, karena perlindungan mereka lebih baik daripada perlindungan rubah!” Maka mereka menahan diri dan tidak menjarah mereka, tetapi justru kaum Qurayza dan Nadir yang menjarah mereka. Dan Sa’d bin Mu’adh Al-Ashhali melindungi harta Banu Salama, dan salah seorang dari mereka memotong ubun-ubun Al-Zubayr bin Iyas bin Bata dan membebaskannya, dan inilah tangan yang digunakannya untuk memberi hadiah kepada Thabit bin Qais pada hari Banu Qurayza. {kutipan:kamil-ibn-al-athir hlm. 509-510}."
