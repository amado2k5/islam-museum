label: { ar: "يوم بُعاث", en: "The day of Bu'ath" }
summary:
  ar: "آخر حروب الأوس والخزرج وأكبرها قبل الإسلام، على بعد نحو خمس سنين من الهجرة على الأصح؛ اقتتلوا في بُعاث وهو موضع عند أعلى قَوْرى، بعد أن تحالفت الأوس — وقد غُلبت في الحروب السالفة — مع قريظة والنضير ونزل بعض بطونها خيبر، فلما افتخرت الخزرج بالفوز وأخذت رهن اليهود تمّت الحرب، وقُتل فيها رئيسا الفريقين: حُضَيْر الكتائب والد أسيد بن حضير للأوس، وعمرو بن النعمان البياضي للخزرج — وقد أنذره عبد الله بن أُبيّ أنه يُحمَل قتيلاً فأجابه بعصيان، فجيء به محمولاً على أربعة كما قال — وكانت الدَّبْرة أولاً على الخزرج ثم ثبّت حضير الأوس فرجعوا وانتصروا؛ وفي الصحيح قالت عائشة «كان يوم بعاث يوماً قدَّمه الله رسوله في دخولهم في الإسلام، فقدِم رسول الله وقد افترق ملؤهم وقُتلت سراتهم» {cite:samhudi-wafa-al-wafa p. 227-230}."
  en: "The last and greatest of the Aws–Khazraj wars before Islam, about five years before the Hijra on the soundest view; they fought at Bu'ath, a site at the head of Qawra, after the long-bested Aws allied with Qurayza and al-Nadir and some of its clans withdrew to Khaybar — when the Khazraj boasted of victory and seized the Jews' hostages, the war was joined. Both chiefs fell: Hudayr 'al-Kata'ib', father of Usayd, for the Aws, and 'Amr ibn al-Nu'man al-Bayadi for the Khazraj — 'Abdallah ibn Ubayy had warned him he would be borne off slain, and four men carried him in as foretold; the rout first fell on the Khazraj until Hudayr rallied the Aws to victory; and in the Sahih 'A'isha says 'the day of Bu'ath was a day God sent ahead of His Messenger for their entering Islam — he came when their assembly had scattered and their chiefs been slain' {cite:samhudi-wafa-al-wafa p. 227-230}."
