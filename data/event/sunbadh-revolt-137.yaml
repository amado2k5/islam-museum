id: event/sunbadh-revolt-137
class: event
kind: battle
label: { ar: "حركة سنباذ المجوسي", en: "The Revolt of Sunbadh the Magian", es: "La revuelta de Sunbadh el Mago", fr: "La révolte de Sunbadh le Mage", ur: "سنبد دی مجنون کی بغاوت", tr: "Magian Sanbadh'ın hareketi", id: "Pergerakan Sanbadh sang Majusi" }
summary:
  ar: "في سنة ١٣٧هـ خرج سنباذ المجوسي غضباً لمقتل أبي مسلم وطلباً لثأره، فغلب على نيسابور وقومس والري وتسمى بفيروز أصبهذ واستولى على خزائن أبي مسلم وأعلن عزمه على هدم الكعبة؛ فأرسل إليه أبو جعفر المنصور جيشاً بقيادة جهور بن مرّار العجلي اصطدم به بين همذان والري وقضى عليه بعد سبعين يوماً من قيام حركته {cite:tarikh-dawla-abbasiyya-taqqush p. 54-55}. وكانت الحركة أولى حركات «المبيضة» — الجماعات التي اقترنت باسم أبي مسلم وارتدت البياض وحملت الأعلام البيضاء — وتلتها حركة الراوندية سنة ١٤١ وحركة أستاذسيس سنة ١٥٠ {cite:tarikh-dawla-abbasiyya-taqqush p. 55}."
  en: "The seventy-day rising of Sunbadh the Magian — first of the 'Mubayyida' movements that gathered under Abu Muslim's name, crushed between Hamadhan and Rayy, 137 AH {cite:tarikh-dawla-abbasiyya-taqqush p. 54-55}."
  es: "El levantamiento de setenta días de Sunbadh el Magian, el primero de los movimientos 'Mubayyida' que se reunieron bajo el nombre de Abu Muslim, fue aplastado entre Hamadhan y Rayy, 137 AH {cite:tarikh-dawla-abbasiyya-taqqush p. 54-55}."
  fr: "Le soulèvement de soixante-dix jours de Sunbadh le Mage — le premier des mouvements « Mubayyida » qui se sont rassemblés sous le nom d'Abu Muslim, écrasé entre Hamadhan et Rayy, 137 AH {cite:tarikh-dawla-abbasiyya-taqqush p. 54-55}."
  ur: "سنبد مجنون کا ستر روزہ عروج - ابو مسلم کے نام سے جمع ہونے والی 'مبائدہ' تحریکوں میں سے پہلی، حمادان اور رے کے درمیان کچل دی گئی، 137 ہجری۔ 54-55}۔"
  tr: "Hicri 137 yılında, Mecusi Sinbadh, Ebu Müslim'in öldürülmesine öfkelenerek ve intikam almak isteyerek ayaklandı. Nişapur, Kumis ve Rayy'ı ele geçirdi, kendisine Firuz Asbahadh adını verdi ve Ebu Müslim'in hazinelerine el koydu. Kâbe'yi yıkma niyetini açıkladı. Ebu Cafer el-Mansur, ona karşı Cahver ibn Marrar el-Ajli komutasında bir ordu gönderdi. Hamadan ve Rayy arasında onunla çatıştılar ve yetmiş günlük isyanından sonra onu yenilgiye uğrattılar. {kaynak:tarikh-dawla-abbasiyya-taqqush s. 54-55}. Bu isyan, Ebu Müslim'in adıyla özdeşleşen, beyaz giyen ve beyaz bayraklar taşıyan grupların oluşturduğu \"Beyaz Hareketler\"in ilkiydi ve bunu Hicri 141 yılında Ravandiyye hareketi ve Hicri 150 yılında Üstadlar hareketi izledi. {cite:tarikh-dawla-abbasiyya-taqqush s. 55}."
  id: "Pada tahun 137 H, Sinbadh dari kelompok Majusi bangkit dalam kemarahan atas pembunuhan Abu Muslim dan ingin membalas dendam. Ia menguasai Nishapur, Qumis, dan Rayy, menyebut dirinya Firuz Asbahadh, dan mengambil alih harta benda Abu Muslim. Ia menyatakan niatnya untuk menghancurkan Ka'bah. Abu Ja'far al-Mansur mengirimkan pasukan melawannya di bawah komando Jahwar ibn Marrar al-Ajli, yang bertempur dengannya di antara Hamadan dan Rayy dan mengalahkannya setelah tujuh puluh hari pemberontakannya. {cite:tarikh-dawla-abbasiyya-taqqush hlm. 54-55}. Pemberontakan ini adalah yang pertama dari \"Gerakan Putih\"—kelompok-kelompok yang mengaitkan diri mereka dengan nama Abu Muslim, mengenakan pakaian putih, dan membawa panji-panji putih—dan diikuti oleh gerakan Rawandiyya pada tahun 141 H dan gerakan Ustadsi pada tahun 150 H. {cite:tarikh-dawla-abbasiyya-taqqush hal. 55}."
