label: { ar: "حركة سنباذ المجوسي" }
summary:
  ar: "في سنة ١٣٧هـ خرج سنباذ المجوسي غضباً لمقتل أبي مسلم وطلباً لثأره، فغلب على نيسابور وقومس والري وتسمى بفيروز أصبهذ واستولى على خزائن أبي مسلم وأعلن عزمه على هدم الكعبة؛ فأرسل إليه أبو جعفر المنصور جيشاً بقيادة جهور بن مرّار العجلي اصطدم به بين همذان والري وقضى عليه بعد سبعين يوماً من قيام حركته {cite:tarikh-dawla-abbasiyya-taqqush p. 54-55}. وكانت الحركة أولى حركات «المبيضة» — الجماعات التي اقترنت باسم أبي مسلم وارتدت البياض وحملت الأعلام البيضاء — وتلتها حركة الراوندية سنة ١٤١ وحركة أستاذسيس سنة ١٥٠ {cite:tarikh-dawla-abbasiyya-taqqush p. 55}."
  en: "The seventy-day rising of Sunbadh the Magian — first of the 'Mubayyida' movements that gathered under Abu Muslim's name, crushed between Hamadhan and Rayy, 137 AH {cite:tarikh-dawla-abbasiyya-taqqush p. 54-55}."
