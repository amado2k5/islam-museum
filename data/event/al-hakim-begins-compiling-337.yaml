id: event/al-hakim-begins-compiling-337
class: event
kind: other
label:
  ar: "الحاكم النيسابوري يشرع في التصنيف، ٣٣٧هـ"
  en: "Al-Hakim begins his compilations, 337/948"
  ur: "حاکم نیشاپوری تصنیف کا آغاز، 337ھ/948ء"
  es: "Al-Hakim comienza sus compilaciones, 337/948"
  fr: "Al-Hakim commence ses compilations, 337/948"
  tr: "Al-Hakim al-Nisaburi sınıflandırmaya Hicri 337 yılında başlıyor."
  id: "Al-Hakim al-Nisaburi memulai klasifikasi tersebut, 337 H."
summary:
  ar: "شرع الحاكم في التصنيف سنة سبع وثلاثين، فاتفق له من التصانيف ما يبلغ قريباً من ألف جزء من تخريج الصحيحين والعلل والتراجم والأبواب والشيوخ، ثم المجموعات مثل «معرفة علوم الحديث» و«المستدرك على الصحيحين» و«تاريخ النيسابوريين» {cite:tarikh-islam-dhahabi p. 128}."
  en: "Al-Hakim began writing his compilations in 337/948-9; his output approached a thousand parts — takhridj of the two Sahihs, 'ilal, biographies, chapters and shaykh-collections — besides the large books such as Ma'rifat 'ulum al-hadith, the Mustadrak 'ala al-Sahihayn and Tarikh al-Naysaburiyyin {cite:tarikh-islam-dhahabi p. 128}."
  ur: "حاکم نے 337ھ/948ء میں تصنیف کا آغاز کیا؛ ان کی تصانیف تقریباً ایک ہزار اجزا تک پہنچیں — صحیحین کی تخریج، علل، تراجم، ابواب اور مشائخ کے مجموعات — پھر معرفۃ علوم الحدیث، المستدرک علی الصحیحین اور تاریخ النیسابوریین جیسی بڑی کتابیں {cite:tarikh-islam-dhahabi p. 128}۔"
  es: "Al-Hakim comenzó a escribir sus compilaciones en 337/948-9; su producción se acercó a las mil partes —takhridj de los dos Sahihs, 'ilal, biografías, capítulos y colecciones de shaykhs— además de los grandes libros como Ma'rifat 'ulum al-hadith, el Mustadrak 'ala al-Sahihayn y Tarikh al-Naysaburiyyin {cite:tarikh-islam-dhahabi p. 128}."
  fr: "Al-Hakim a commencé à écrire ses compilations en 337/948-9; sa production a approché un millier de parties — takhridj des deux Sahihs, 'ilal, biographies, chapitres et recueils de cheikhs — outre les grands livres tels que Ma'rifat 'ulum al-hadith, le Mustadrak 'ala al-Sahihayn et Tarikh al-Naysaburiyyin {cite:tarikh-islam-dhahabi p. 128}."
  tr: "Hükümdar otuz yedinci yılda sınıflandırmaya başladı ve iki Sahih'in özeti, eksiklikleri, biyografileri, bölümleri ve şeyhleri içeren yaklaşık bin parçalık sınıflandırmayla karşılaştı; daha sonra \"Hadis İlimleri\", \"İki Sahih'e Ek\" ve \"Nisaburilerin Tarihi\" gibi derlemeler ortaya çıktı. {Kaynak:tarikh-islam-dhahabi s. 128}"
  id: "Penguasa mulai mengklasifikasikan pada tahun tiga puluh tujuh, dan ia menemukan klasifikasi yang berjumlah hampir seribu bagian dari kutipan dua kitab Sahih, kekurangan, biografi, bab dan para syekh, kemudian koleksi seperti “Pengetahuan Ilmu-ilmu Hadits” dan “Tambahan untuk Dua Kitab Sahih” dan “Sejarah Nisaburi” {cite:tarikh-islam-dhahabi p. 128}."
