id: event/ibn-al-salah-shahrazur-mosul-590
class: event
kind: other
label:
  ar: "ابن الصلاح يتفقه على والده بشهرزور ثم يُعيد بالموصل عند ابن يونس، نحو ٥٩٠هـ"
  en: "Ibn al-Salah studies fiqh under his father at Shahrazur, then repeats for Ibn Yunus at Mosul, c. 590"
  ur: "ابن الصلاح شہرزور میں اپنے والد سے فقہ پڑھتے ہیں، پھر موصل میں ابن یونس کے ہاں اعادہ کرتے ہیں، تقریباً 590ھ"
  es: "Ibn al-Salah estudia fiqh con su padre en Shahrazur, y luego repite el curso con Ibn Yunus en Mosul, alrededor del año 590."
  fr: "Ibn al-Salah étudie le fiqh auprès de son père à Shahrazur, puis reprend ses études auprès d'Ibn Yunus à Mossoul, vers 590."
  tr: "İbn el-Salah, fıkıh eğitimini Şahrazur'da babasının yanında aldı, ardından yaklaşık 590 Hicri yılında Musul'da İbn Yunus'un yanında eğitimini tekrarladı."
  id: "Ibn al-Salah mempelajari ilmu hukum di bawah bimbingan ayahnya di Shahrazur, kemudian melanjutkan studinya di Mosul di bawah bimbingan Ibn Yunus, sekitar tahun 590 H."
summary:
  ar: "تفقّه ابن الصلاح على والده الصلاح بشهرزور، وكان والده شيخ تلك الناحية، ثم نقله إلى الموصل فاشتغل بها مدة وبرع في المذهب؛ قال ابن خلكان إنه كرر على جميع «المهذب» ولم يطر شاربه، ثم ولي الإعادة عند العلامة العماد ابن يونس، وسمع بالموصل من عبيد الله بن السمين ونصر الله بن سلامة الهيتي وعبد المحسن خطيب الموصل وغيرهم {cite:tarikh-islam-dhahabi p. 185} {cite:shadharat-dhahab p. 229} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  en: "Ibn al-Salah read fiqh under his father Salah at Shahrazur, whose father was the district's shaykh, then was taken to Mosul where he studied a while and excelled in the madhhab; Ibn Khallikan reports that he repeated the whole of the 'Muhadhdhab' before his beard had grown, then took the post of repeater (mu'id) under the scholar al-Imad Ibn Yunus, and heard at Mosul from 'Ubayd Allah b. al-Samin, Nasr Allah b. Salama al-Hayti, 'Abd al-Muhsin the khatib of Mosul and others {cite:tarikh-islam-dhahabi p. 185} {cite:shadharat-dhahab p. 229} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  ur: "ابن الصلاح نے شہرزور میں اپنے والد صلاح سے فقہ پڑھی، جو اس علاقے کے شیخ تھے، پھر وہ اپنے والد کے ساتھ موصل گئے جہاں کچھ عرصہ پڑھتے رہے اور مذہب میں مہارت پائی؛ ابن خلکان کے مطابق انہوں نے داڑھی اگنے سے پہلے پوری «مہذب» دہرائی، پھر علامہ عماد ابن یونس کے ہاں اعادہ کا منصب سنبھالا اور موصل میں عبید اللہ بن سمین، نصر اللہ بن سلامہ ہیتی، عبد المحسن خطیبِ موصل اور دیگر سے سماعت کی {cite:tarikh-islam-dhahabi p. 185} {cite:shadharat-dhahab p. 229} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}۔"
  es: "Ibn al-Salah estudió fiqh con su padre Salah en Shahrazur, cuyo padre era el shaykh del distrito, luego fue llevado a Mosul donde estudió un tiempo y sobresalió en el madhhab; Ibn Khallikan informa que repitió todo el 'Muhadhdhab' antes de que le creciera la barba, luego tomó el puesto de repetidor (mu'id) con el erudito al-Imad Ibn Yunus, y escuchó en Mosul a 'Ubayd Allah b. al-Samin, Nasr Allah b. Salama al-Hayti, 'Abd al-Muhsin el khatib de Mosul y otros {cite:tarikh-islam-dhahabi p. 185} {cite:shadharat-dhahab p. 229} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  fr: "Ibn al-Salah étudia le fiqh auprès de son père Salah à Shahrazur, dont le père était le cheikh du district, puis fut emmené à Mossoul où il étudia quelque temps et excella dans le madhhab. Ibn Khallikan rapporte qu'il récita l'intégralité du Muhadhdhab avant même que sa barbe n'ait poussé, puis prit la fonction de répétiteur (mu'id) auprès du savant al-Imad Ibn Yunus, et étudia à Mossoul auprès de 'Ubayd Allah b. al-Samin, Nasr Allah b. Salama al-Hayti, 'Abd al-Muhsin, le khatib de Mossoul, et d'autres."
  tr: "İbn el-Salah, Şahrazur'da babası el-Salah'ın yanında fıkıh eğitimi aldı. Babası o bölgenin şeyhiydi. Daha sonra onu Musul'a götürdü ve orada bir süre eğitim gördü ve fetih ekolünde üstün başarı gösterdi. İbn Hallikan, \"el-Muhadhdhab\"ın tamamını tekrar ettiğini ve bıyıklarının çıkmadığını söylemiştir. Daha sonra alim el-İmad İbn Yunus'un yanında öğretim görevini üstlendi ve Musul'da Ubeydullah İbn el-Samin, Nasrullah İbn Salamah el-Hiti, Musul vaizi Abd el-Muhsin ve diğerlerinden dersler aldı. {cite:tarikh-islam-dhahabi s. 185} {cite:shadharat-dhahab s. 229} {cite:encyclopaedia-of-islam-2 cilt 3 s. 959}."
  id: "Ibn al-Salah mempelajari fiqih di bawah bimbingan ayahnya, al-Salah, di Shahrazur. Ayahnya adalah syekh di wilayah tersebut. Kemudian ia pindah ke Mosul, di mana ia belajar untuk sementara waktu dan unggul dalam mazhab tersebut. Ibn Khallikan mengatakan bahwa ia mengulang seluruh isi kitab “al-Muhadhdhab” dan kumisnya tidak tumbuh. Kemudian ia mengambil alih posisi mengajar di bawah ulama al-Imad Ibn Yunus, dan ia belajar di Mosul dari Ubayd Allah Ibn al-Samin, Nasr Allah Ibn Salamah al-Hiti, Abd al-Muhsin, pendakwah Mosul, dan lainnya. {cite:tarikh-islam-dhahabi p. 185} {cite:shadharat-dhahab p. 229} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
