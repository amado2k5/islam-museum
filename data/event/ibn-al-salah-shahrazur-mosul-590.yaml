id: event/ibn-al-salah-shahrazur-mosul-590
class: event
kind: other
label:
  ar: "ابن الصلاح يتفقه على والده بشهرزور ثم يُعيد بالموصل عند ابن يونس، نحو ٥٩٠هـ"
  en: "Ibn al-Salah studies fiqh under his father at Shahrazur, then repeats for Ibn Yunus at Mosul, c. 590"
  ur: "ابن الصلاح شہرزور میں اپنے والد سے فقہ پڑھتے ہیں، پھر موصل میں ابن یونس کے ہاں اعادہ کرتے ہیں، تقریباً 590ھ"
summary:
  ar: "تفقّه ابن الصلاح على والده الصلاح بشهرزور، وكان والده شيخ تلك الناحية، ثم نقله إلى الموصل فاشتغل بها مدة وبرع في المذهب؛ قال ابن خلكان إنه كرر على جميع «المهذب» ولم يطر شاربه، ثم ولي الإعادة عند العلامة العماد ابن يونس، وسمع بالموصل من عبيد الله بن السمين ونصر الله بن سلامة الهيتي وعبد المحسن خطيب الموصل وغيرهم {cite:tarikh-islam-dhahabi p. 185} {cite:shadharat-dhahab p. 229} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  en: "Ibn al-Salah read fiqh under his father Salah at Shahrazur, whose father was the district's shaykh, then was taken to Mosul where he studied a while and excelled in the madhhab; Ibn Khallikan reports that he repeated the whole of the 'Muhadhdhab' before his beard had grown, then took the post of repeater (mu'id) under the scholar al-Imad Ibn Yunus, and heard at Mosul from 'Ubayd Allah b. al-Samin, Nasr Allah b. Salama al-Hayti, 'Abd al-Muhsin the khatib of Mosul and others {cite:tarikh-islam-dhahabi p. 185} {cite:shadharat-dhahab p. 229} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  ur: "ابن الصلاح نے شہرزور میں اپنے والد صلاح سے فقہ پڑھی، جو اس علاقے کے شیخ تھے، پھر وہ اپنے والد کے ساتھ موصل گئے جہاں کچھ عرصہ پڑھتے رہے اور مذہب میں مہارت پائی؛ ابن خلکان کے مطابق انہوں نے داڑھی اگنے سے پہلے پوری «مہذب» دہرائی، پھر علامہ عماد ابن یونس کے ہاں اعادہ کا منصب سنبھالا اور موصل میں عبید اللہ بن سمین، نصر اللہ بن سلامہ ہیتی، عبد المحسن خطیبِ موصل اور دیگر سے سماعت کی {cite:tarikh-islam-dhahabi p. 185} {cite:shadharat-dhahab p. 229} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}۔"
