label: { ar: "انتصار المسترشد على دبيس الأسدي سنة 517" }
summary:
  ar: "في أول سنة سبع عشرة وخمسمائة التقى الخليفة المسترشد بالله ودبيس الأسدي وكان دبيس قد طغى وتمرد ووعد عسكره بنهب بغداد، فجرد المسترشد يومئذ سيفه ووقف على تل فانهزم جمع دبيس وقتل خلق منهم وقتل من جيش الخليفة نحو العشرين وعاد مؤيداً منصوراً، وذهب دبيس فعاث ونهب وقتل بنواحي البصرة {cite:shadharat-dhahab p. 533}."
  en: "Early in 517 the caliph al-Mustarshid met Dubays al-Asadi in battle — Dubays had grown insolent and promised his army the sack of Baghdad, so the caliph drew his own sword and stood on a hill until Dubays's host broke, with about twenty of the caliph's men killed; Dubays fled to ravage the outskirts of Basra {cite:shadharat-dhahab p. 533}."
