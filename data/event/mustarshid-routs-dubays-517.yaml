id: event/mustarshid-routs-dubays-517
class: event
kind: battle
label: { ar: "انتصار المسترشد على دبيس الأسدي سنة 517", en: "Al-Mustarshid's victory over Dubays al-Asadi in 517", es: "La victoria de Al-Mustarshid sobre Dubays al-Asadi en 517", fr: "Victoire d'Al-Mustarshid sur Dubays al-Asadi en 517", ur: "المسترشد کی 517 میں دبئی الاسدی پر فتح", tr: "El-Mustarşid'in 517 yılında Dubays el-Asadi'ye karşı kazandığı zafer.", id: "Kemenangan Al-Mustarshid atas Dubays al-Asadi pada tahun 517" }
summary:
  ar: "في أول سنة سبع عشرة وخمسمائة التقى الخليفة المسترشد بالله ودبيس الأسدي وكان دبيس قد طغى وتمرد ووعد عسكره بنهب بغداد، فجرد المسترشد يومئذ سيفه ووقف على تل فانهزم جمع دبيس وقتل خلق منهم وقتل من جيش الخليفة نحو العشرين وعاد مؤيداً منصوراً، وذهب دبيس فعاث ونهب وقتل بنواحي البصرة {cite:shadharat-dhahab p. 533}."
  en: "Early in 517 the caliph al-Mustarshid met Dubays al-Asadi in battle — Dubays had grown insolent and promised his army the sack of Baghdad, so the caliph drew his own sword and stood on a hill until Dubays's host broke, with about twenty of the caliph's men killed; Dubays fled to ravage the outskirts of Basra {cite:shadharat-dhahab p. 533}."
  es: "A principios de 517, el califa al-Mustarshid se enfrentó en batalla a Dubays al-Asadi. Dubays se había vuelto insolente y había prometido a su ejército el saqueo de Bagdad, por lo que el califa desenvainó su espada y se mantuvo en una colina hasta que el ejército de Dubays se rompió, resultando muertos unos veinte de sus hombres. Dubays huyó para asolar las afueras de Basora {cita: shadharat-dhahab p. 533}."
  fr: "Au début de l'année 517, le calife al-Mustarshid rencontra Dubays al-Asadi au combat. Dubays était devenu insolent et avait promis à son armée le sac de Bagdad. Le calife tira donc son épée et se tint sur une colline jusqu'à ce que l'armée de Dubays cède, avec une vingtaine d'hommes tués. Dubays s'enfuit pour ravager les abords de Bassora {cite:shadharat-dhahab p. 533}."
  ur: "517 کے اوائل میں خلیفہ المسترشد نے جنگ میں دوبئیس الاسدی سے ملاقات کی - دوبئیس گستاخ ہو گیا تھا اور اس نے اپنی فوج سے بغداد کو برطرف کرنے کا وعدہ کیا تھا، لہذا خلیفہ نے اپنی تلوار نکالی اور ایک پہاڑی پر کھڑا رہا یہاں تک کہ دوبئیس کا میزبان ٹوٹ گیا، جس میں خلیفہ کے تقریباً بیس آدمی مارے گئے۔ بصرہ کے مضافات میں تباہی پھیلانے کے لیے دوبئی فرار ہو گئے 533}۔"
  tr: "517 yılının ilk yılında Halife Müstarşid Billa, Dubays el-Esadi ile karşılaştı. Dubays zalimleşmiş ve isyankar hale gelmişti ve ordusuna Bağdat'ı yağmalama sözü vermişti. Bunun üzerine Müstarşid o gün kılıcını çekti ve bir tepeye çıktı; Dubays'ın ordusu yenildi ve birçoğu öldürüldü. Halifenin ordusundan yaklaşık yirmi kişi öldürüldü ve Halife zaferle geri döndü. Dubays gidip Basra civarında yıkım, yağma ve katliam yaptı. {kaynak: Şadharat-dhahab s. 533}"
  id: "Pada tahun pertama tahun 517, Khalifah Al-Mustarshid Billah bertemu dengan Dubays Al-Asadi. Dubays telah menjadi tiran dan pemberontak dan berjanji akan menjarah Baghdad dengan pasukannya. Maka Al-Mustarshid menghunus pedangnya pada hari itu dan berdiri di atas sebuah bukit, dan pasukan Dubays dikalahkan dan banyak dari mereka terbunuh. Sekitar dua puluh orang dari pasukan Khalifah terbunuh, dan ia kembali dengan kemenangan dan kejayaan. Dubays pergi dan menimbulkan kekacauan, menjarah, dan membunuh di sekitar Basra. {cite:shadharat-dhahab p. 533}"
