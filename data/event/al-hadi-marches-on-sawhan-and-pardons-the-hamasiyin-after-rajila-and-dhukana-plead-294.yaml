id: event/al-hadi-marches-on-sawhan-and-pardons-the-hamasiyin-after-rajila-and-dhukana-plead-294
class: event
kind: other
label:
  ar: "الهادي يتوجه إلى سوحان فيعفو عن الحماسيين بعد شفاعة رجيلة وذكانة، شعبان 294هـ، ص338"
  en: "Al-Hadi marches on Sawhan and pardons the Hamasiyin after Rajila and Dhukana plead, Sha'ban 294 AH, p. 338"
  ur: "ہادی کا سوحان کی طرف بڑھنا اور رجیلہ و ذکانہ کی سفارش پر الحماسیین کو معاف کرنا، شعبان 294ھ، ص338"
  es: "Al-Hadi marcha hacia Sawhan y perdona a Hamasiyin después de que Rajila y Dhukana suplicaran, Sha'ban 294 AH, p. 338"
  fr: "Al-Hadi marche sur Sawhan et pardonne aux Hamasiyin après que Rajila et Dhukana ont plaidé, Sha'ban 294 AH, p. 338"
summary:
  ar: "توجه الهادي إلى سوحان لهدمها، فشفع فيه رجيلة وذكانة، ثم عفا عن الحماسيين الذين جاء بهم ابن بسطام مستأمنين."
  en: "Al-Hadi marched on Sawhan to raze it; Rajila and Dhukana pleaded with him, and he later pardoned the Hamasiyin, whom Ibn Bistam brought to him seeking safety."
  ur: "ہادی سوحان کو گرانے کے لیے بڑھے؛ رجیلہ اور ذکانہ نے سفارش کی، اور بعد میں انہوں نے الحماسیین کو معاف کیا جنہیں ابن بسطام امان طلب کرتے ہوئے لائے تھے۔"
  es: "Al-Hadi marchó sobre Sawhan para arrasarla; Rajila y Dhukana le suplicaron, y más tarde perdonó a los Hamasiyin, a quienes Ibn Bistam le llevó buscando refugio."
  fr: "Al-Hadi marcha sur Sawhan pour la raser; Rajila et Dhukana le supplièrent, et il gracia plus tard les Hamasiyin, qu'Ibn Bistam lui avait amenés pour chercher refuge."
