label: { ar: "يوم الأجفر", en: "Yawm al-Ajfar" }
summary:
  ar: "وقع صالح بن مدرك الطائي في نبهان وسنبس وغيرهم من طيء بحاج سنة خمس وثمانين ومائتين وعلى الحاج جيء الكبير، فكانت بينهم حرب عظيمة في الموضع المعروف بقاع الأجفر تشوش فيها الحاج وأخذهم السيف فمات عطشاً وقتلاً خلائق من الحاج وأصيب جيء بضربات كثيرة، وأخذ من الناس نحو ألفي ألف دينار، وكانت العرب ترتجز ما إن رأى الناس كيوم الأجفر الناس صرعى والقبور تحفر {cite:muruj-al-dhahab p. 622}. وعند ابن الجوزي كان خروجه على الحاج يوم الأربعاء لاثنتي عشرة ليلة بقين من المحرم فأخذ الأدوال والتجارات والنساء الحرائر والمماليك {cite:muntazam-ibn-al-jawzi p. 294}."
  en: "285/898: the Tayyi' raiders' slaughter of the pilgrim caravan at Qa' al-Ajfar — pilgrims dead of sword and thirst {cite:muruj-al-dhahab p. 622}."
