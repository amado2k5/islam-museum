summary:
  ar: "وقع صالح بن مدرك الطائي في نبهان وسنبس وغيرهم من طيء بحاج سنة خمس وثمانين ومائتين وعلى الحاج جيء الكبير، فكانت بينهم حرب عظيمة في الموضع المعروف بقاع الأجفر تشوش فيها الحاج وأخذهم السيف فمات عطشاً وقتلاً خلائق من الحاج وأصيب جيء بضربات كثيرة، وأخذ من الناس نحو ألفي ألف دينار، وكانت العرب ترتجز ما إن رأى الناس كيوم الأجفر الناس صرعى والقبور تحفر {cite:muruj-al-dhahab p. 622}. وعند ابن الجوزي كان خروجه على الحاج يوم الأربعاء لاثنتي عشرة ليلة بقين من المحرم فأخذ الأدوال والتجارات والنساء الحرائر والمماليك {cite:muntazam-ibn-al-jawzi p. 294}."
  en: "285/898: the Tayyi' raiders' slaughter of the pilgrim caravan at Qa' al-Ajfar — pilgrims dead of sword and thirst {cite:muruj-al-dhahab p. 622}."
  es: "285/898: la matanza de la caravana de peregrinos en Qa' al-Ajfar por los asaltantes Tayyi': peregrinos muertos por espada y sed {cita:muruj-al-dhahab p. 622}."
  fr: "285/898: le massacre de la caravane de pèlerins par les pillards Tayyi' à Qa' al-Ajfar — pèlerins morts par l'épée et la soif {cite: muruj-al-dhahab p. 622}."
  ur: "285/898: طائی کے حملہ آوروں کا قع الظفر میں حاجیوں کے قافلے کو ذبح کرنا - حجاج تلوار اور پیاس سے مر گئے 622}۔"
  tr: "Salih ibn Mudrik el-Ta'i, Hicri 285 yılında Nabhan, Sanbis ve Tayy kabilesinden diğerleriyle birlikte hacılara saldırdı. Hacılara büyük Ji'i önderlik ediyordu ve aralarında Ka' el-Ajfar olarak bilinen yerde büyük bir savaş çıktı. Hacılar dağıldı ve birçoğu kılıçla öldürüldü. Çok sayıda hacı susuzluktan öldü ve öldürüldü, Ji'i ise ağır yaralandı. Halktan yaklaşık iki milyon dinar ele geçirdi. Araplar, \"İnsanlar el-Ajfar günü gibi bir şey görmemişlerdir! İnsanlar ölü yatıyordu ve mezarlar kazılıyordu.\" diye şiirler okurlardı (kaynak: Muruj-al-Dhahab, s. 622). İbn el-Cevzi'ye göre, hacılara saldırısı Muharrem ayının bitiminden on iki gece önce, Çarşamba günü gerçekleşti. Hazineleri, malları, hür kadınları ve köleleri ele geçirdi. (alıntı: müntezam-ibn-el-cevzi s. 294)."
  id: "Salih ibn Mudrik al-Ta'i menyerang para peziarah pada tahun 285 H, bersama dengan Nabhan, Sanbis, dan lainnya dari suku Tayy. Para peziarah dipimpin oleh Ji'i yang agung, dan pertempuran besar terjadi di antara mereka di tempat yang dikenal sebagai Qa' al-Ajfar. Para peziarah menjadi kacau, dan banyak yang terbunuh oleh pedang. Sejumlah besar peziarah meninggal karena kehausan dan terbunuh, dan Ji'i terluka parah. Ia merampas sekitar dua juta dinar dari rakyat. Orang-orang Arab biasa melantunkan puisi, \"Belum pernah ada orang yang melihat sesuatu seperti hari al-Ajfar! Orang-orang tergeletak mati dan kuburan digali.\" (kutipan: Muruj-al-Dhahab hlm. 622). Menurut Ibn al-Jawzi, serangannya terhadap para peziarah terjadi pada hari Rabu, dua belas malam sebelum berakhirnya Muharram. Ia merampas harta benda, barang dagangan, wanita merdeka, dan budak. (kutip:muntazam-ibn-al-jawzi hal. 294)."
