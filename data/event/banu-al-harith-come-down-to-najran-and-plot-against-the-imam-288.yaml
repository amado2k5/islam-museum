id: event/banu-al-harith-come-down-to-najran-and-plot-against-the-imam-288
class: event
kind: other
label:
  ar: "بنو الحارث ينزلون نجران ويتآمرون على الإمام، رمضان 288هـ"
  en: "Banu al-Harith come down to Najran and plot against the imam, Ramadan 288 AH"
  ur: "بنو حارث نجران اترتے ہیں اور امام کے خلاف سازش کرتے ہیں، رمضان 288ھ"
summary:
  ar: "قال علي بن محمد إن بني الحارث هبطوا إلى نجران في رمضان حين كانت حرب الهادي وآل يعفر وآل طريف، عند حضور الثمر في الخريف، وحضّهم ابن بسطام ليكون له وجه عندهم، فاجتمع رأيهم على الفساد على الإمام، وجمع ابن حميد وابن بسطام بني الحارث وبادية شاكر وتيام وجعلوا لهم بعض أموال المساكين."
  en: "Ali ibn Muhammad says that Banu al-Harith came down to Najran in Ramadan, when the war between al-Hadi and Al Ya'fur and Al Tarif was on, at the time the dates were ripe in the autumn, and that Ibn Bustam urged them on so that he would have standing and obedience among them; they agreed on disorder against the imam, and Ibn Humayd and Ibn Bustam gathered Banu al-Harith and the Bedouin of Shakir and Yam, giving them some of the property of the poor."
  ur: "علی بن محمد کہتے ہیں کہ جب ہادی اور آل یعفر و آل طریف کے درمیان جنگ ہو رہی تھی تو رمضان میں، خزاں میں کھجوریں پکنے کے وقت، بنو حارث نجران اتر آئے، اور ابن بسطام نے انہیں اس لیے ابھارا کہ اس کا ان کے ہاں مقام اور ان میں فرماں برداری ہو؛ ان کی رائے امام کے خلاف فساد پر جمع ہوئی، اور ابن حمید اور ابن بسطام نے بنو حارث اور شاکر و یام کے بدویوں کو جمع کیا اور انہیں مسکینوں کے کچھ مال دینے کا وعدہ کیا۔"
