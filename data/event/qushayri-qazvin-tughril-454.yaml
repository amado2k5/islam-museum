class: event
kind: other
label:
  ar: "القشيري بظاهر قزوين في صحبة طغرل بك، ٤٥٤هـ"
  en: "Al-Qushayri at the outskirts of Qazvin in Sultan Tughril Beg's company, 454/1062"
  ur: "قشیری قزوین کے نواح میں سلطان طغرل بیک کی صحبت میں، 454ھ/1062ء"
summary:
  ar: "أنشد أبو القاسم القشيري بظاهر قزوين سنة أربع وخمسين وأربعمائة وهو في صحبة السلطان طغرل بك، منها قوله لنفسه: «من قبل أن أُتوفّى مرّةً عودي ... قلبي على النار مثل الندّ والعودِ»؛ وكان يختلف في مدة نفيه من نيسابور إلى طوس بأهله وبعض أولاده {cite:tarikh-islam-dhahabi pp. 175-176}."
  en: "In 454/1062 Abu al-Qasim al-Qushayri was at the outskirts of Qazvin in Sultan Tughril Beg's company, reciting his own verse — among it the line 'my heart is on the fire like the aloeswood and the oud'; through these years of exile from Hanafi-dominated Nishapur he was moving between refuges with his family and some of his sons, making Tus his seat {cite:tarikh-islam-dhahabi pp. 175-176} {cite:encyclopaedia-of-islam-2 vol. 5 p. 564}."
  ur: "454ھ/1062ء میں ابو القاسم قشیری قزوین کے نواح میں سلطان طغرل بیک کی صحبت میں تھے اور اپنے اشعار پڑھتے رہے؛ حنفیوں کے غلبے والے نیشاپور سے جلاوطنی کے ان برسوں میں وہ اہل و عیال اور کچھ بیٹوں کے ساتھ ٹھکانے بدلتے رہے اور طوس کو اپنا مرکز بنایا {cite:tarikh-islam-dhahabi pp. 175-176} {cite:encyclopaedia-of-islam-2 vol. 5 p. 564}۔"
