label: { ar: "الوقعة بين أصحاب السلطان وصاحب الشامة", en: "The battle between the sultan's men and the Sahib al-Shama" }
summary:
  ar: "في سنة إحدى وتسعين ومائتين ذكر الطبري الوقعة بين أصحاب السلطان وأصحاب القرمطي صاحب الشامة؛ ففي المحرم هزم أصحاب السلطان أصحاب القرمطي وأسروا منهم كثيراً، ثم سار القرمطي في البادية فاراً {cite:tabari-tarikh-abu-al-fadl j.10 p.108}. وعند ابن الجوزي أُخذ بموضع يقال له التقرمطي وحُمل إلى الرقة وعليه برنس، ثم جُعل له كرسي ارتفاعه ذراعان ونصف على ظهر فيل ودخل به المكتفي بغداد وفي فيه خشبة مخروطة كاللجام، وأمر المكتفي ببناء دكة في المصلى العتيق ارتفاعها عشر أذرع، فلما كان يوم الاثنين لسبع بقين من ربيع الأول قُدِّم له أربعة وثلاثون من الأسارى فقُطعت أيديهم وأرجلهم وضُربت أعناقهم واحدًا بعد واحد، ثم قُدِّم فضُرب مائتي سوط وقُطعت يداه ورجلاه وكُوي ثم أُحرق ورُفع رأسه على خشبة وصُلب بدنه في طرف الجسر الأعلى {cite:muntazam-ibn-al-jawzi p. 335-336}."
  en: "In 291 al-Tabari records the battle between the sultan's men and the men of the Qarmatian, the Sahib al-Shama. In Muharram the sultan's men defeated the Qarmatian's men and took many of them prisoner; then the Qarmatian fled into the desert {cite:tabari-tarikh-abu-al-fadl j.10 p.108}. According to Ibn al-Jawzi, he was seized at a place called al-Taqarmati and taken to al-Raqqa wearing a burnous. He was then placed on a chair two and a half cubits high on the back of an elephant, and al-Muktafi brought him into Baghdad with a conical piece of wood in his mouth like a bridle. Al-Muktafi ordered a platform ten cubits high built in the old prayer ground. On Monday, with seven days left in Rabi' I, thirty-four prisoners were brought before him; their hands and feet were cut off and their necks struck one by one. Then he was brought forward and given two hundred lashes, had his hands and feet cut off, was branded and burned. His head was raised on a pole, and his body was crucified at the end of the upper bridge {cite:muntazam-ibn-al-jawzi p. 335-336}."
