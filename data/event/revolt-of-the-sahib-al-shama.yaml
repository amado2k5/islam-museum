label: { ar: "الوقعة بين أصحاب السلطان وصاحب الشامة", en: "The battle between the sultan's men and the Sahib al-Shama", es: "La batalla entre los hombres del sultán y el Sahib al-Shama", fr: "La bataille entre les hommes du sultan et le Sahib al-Shama" }
summary:
  ar: "في سنة إحدى وتسعين ومائتين ذكر الطبري الوقعة بين أصحاب السلطان وأصحاب القرمطي صاحب الشامة؛ ففي المحرم هزم أصحاب السلطان أصحاب القرمطي وأسروا منهم كثيراً، ثم سار القرمطي في البادية فاراً {cite:tabari-tarikh-abu-al-fadl j.10 p.108}. وعند ابن الجوزي أُخذ بموضع يقال له التقرمطي وحُمل إلى الرقة وعليه برنس، ثم جُعل له كرسي ارتفاعه ذراعان ونصف على ظهر فيل ودخل به المكتفي بغداد وفي فيه خشبة مخروطة كاللجام، وأمر المكتفي ببناء دكة في المصلى العتيق ارتفاعها عشر أذرع، فلما كان يوم الاثنين لسبع بقين من ربيع الأول قُدِّم له أربعة وثلاثون من الأسارى فقُطعت أيديهم وأرجلهم وضُربت أعناقهم واحدًا بعد واحد، ثم قُدِّم فضُرب مائتي سوط وقُطعت يداه ورجلاه وكُوي ثم أُحرق ورُفع رأسه على خشبة وصُلب بدنه في طرف الجسر الأعلى {cite:muntazam-ibn-al-jawzi p. 335-336}."
  en: "In 291 al-Tabari records the battle between the sultan's men and the men of the Qarmatian, the Sahib al-Shama. In Muharram the sultan's men defeated the Qarmatian's men and took many of them prisoner; then the Qarmatian fled into the desert {cite:tabari-tarikh-abu-al-fadl j.10 p.108}. According to Ibn al-Jawzi, he was seized at a place called al-Taqarmati and taken to al-Raqqa wearing a burnous. He was then placed on a chair two and a half cubits high on the back of an elephant, and al-Muktafi brought him into Baghdad with a conical piece of wood in his mouth like a bridle. Al-Muktafi ordered a platform ten cubits high built in the old prayer ground. On Monday, with seven days left in Rabi' I, thirty-four prisoners were brought before him; their hands and feet were cut off and their necks struck one by one. Then he was brought forward and given two hundred lashes, had his hands and feet cut off, was branded and burned. His head was raised on a pole, and his body was crucified at the end of the upper bridge {cite:muntazam-ibn-al-jawzi p. 335-336}."
  es: "En 291 al-Tabari registra la batalla entre los hombres del sultán y los hombres del cármata, el Sahib al-Shama. En Muharram los hombres del sultán derrotaron a los hombres del cármata y tomaron a muchos de ellos prisioneros; luego el cármata huyó al desierto {cite:tabari-tarikh-abu-al-fadl j.10 p.108}. Según Ibn al-Jawzi, fue apresado en un lugar llamado al-Taqarmati y llevado a al-Raqqa vistiendo un burnús. Luego lo colocaron en una silla de dos codos y medio de altura sobre el lomo de un elefante, y al-Muktafi lo llevó a Bagdad con un trozo de madera cónico en su boca a modo de brida. Al-Muktafi ordenó construir una plataforma de diez codos de altura en el antiguo lugar de oración. El lunes, con siete días restantes de Rabi' I, treinta y cuatro prisioneros fueron llevados ante él; Les cortaron las manos y los pies, y les golpearon el cuello uno por uno. Luego lo trajeron y le dieron doscientos latigazos, le cortaron las manos y los pies, lo marcaron con hierro candente y lo quemaron. Le alzaron la cabeza en un poste y crucificaron el cuerpo al final del puente superior {cite:muntazam-ibn-al-jawzi p. 335-336}."
  fr: "En 291, al-Tabari relate la bataille entre les hommes du sultan et ceux du Qarmate, Sahib al-Shama. Durant le mois de Muharram, les hommes du sultan vainquirent ceux du Qarmate et firent de nombreux prisonniers; le Qarmate s'enfuit alors dans le désert (voir: Tabari Tarikh Abu al-Fadl, vol. 10, p. 108). Selon Ibn al-Jawzi, il fut capturé à al-Taqarmati et emmené à Raqqa, vêtu d'un burnous. Il fut ensuite placé sur un siège de deux coudées et demie de haut, sur le dos d'un éléphant, et al-Muktafi le conduisit à Bagdad, un morceau de bois conique dans la bouche, faisant office de bride. Al-Muktafi ordonna la construction d'une estrade de dix coudées de haut sur l'ancien lieu de prière. Le lundi, à sept jours de la fin du mois de Rabi' I, trente-quatre prisonniers furent amenés devant lui. On leur coupa les mains et les pieds, et on leur trancha la nuque un à un. Puis on l'amena et on lui infligea deux cents coups de fouet, on lui coupa les mains et les pieds, on le marqua au fer rouge et on le brûla. Sa tête fut dressée sur une perche, et son corps crucifié au bout du pont supérieur {cite:muntazam-ibn-al-jawzi p. 335-336}."
