kids:
  ar: "بعد حرب مع روسيا وُقّعت معاهدة أدرنة عام 1829م، وتنازلت فيها الدولة العثمانية عن أراضٍ وموانئ وقبلت أن تنال الصرب واليونان حكماً أوسع."
  en: "After a war with Russia, the Treaty of Edirne of 1829 made the Ottomans give up lands and ports and accept more self-rule for Serbia and Greece."
  ur: "روس کے ساتھ جنگ کے بعد 1829ء کے معاہدۂ ادرنہ میں عثمانیوں نے زمینیں اور بندرگاہیں چھوڑیں اور سربیا اور یونان کی زیادہ خود مختاری مان لی۔"
