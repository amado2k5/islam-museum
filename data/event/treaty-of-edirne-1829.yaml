label: { ar: "معاهدة أدرنة ⁦(١٨٢٩)⁩", en: "Treaty of Edirne (Adrianople), 1829", ur: "معاہدۂ ادرنہ ⁦(١٨٢٩ء)⁩" }
summary:
  ar: "معاهدة السلام التي أنهت الحرب الروسية العثمانية في 14 أيلول 1829م/1245هـ بعد أن احتل الجنرال ديبيتش أدرنة. تنازلت الدولة العثمانية لروسيا عن دلتا الدانوب في أوروبا وولاية أخالتسيخه في آسيا، ودفعت تعويضاً حربياً كبيراً، وأقرت حكماً ذاتياً لصربيا والأفلاق والبغدان واليونان تحت الحماية الروسية، وخسرت ميناءي أنابا وبوتي وحقوقها في بلاد الشركس {cite:encyclopaedia-of-islam-2 vol. 6 p. 68} {cite:encyclopaedia-of-islam-2 vol. 2 p. 39}."
  en: "The peace treaty that ended the Russo-Ottoman war on 14 September 1829 (1245 AH), after General Diebitsch's army took Edirne. The Ottomans ceded the Danube delta in Europe and the province of Akhaltsikhe in Asia to Russia, paid a heavy war indemnity, accepted autonomy for Serbia, Moldavia, Wallachia and Greece under Russian protection, and lost the Black Sea ports of Anapa and Poti and their rights in Circassia {cite:encyclopaedia-of-islam-2 vol. 6 p. 68} {cite:encyclopaedia-of-islam-2 vol. 2 p. 39}."
  ur: "وہ صلح نامہ جس نے 14 ستمبر 1829ء/1245ھ کو روسی عثمانی جنگ ختم کی، جب جنرل ڈیبیچ کی فوج نے ادرنہ پر قبضہ کر لیا تھا۔ عثمانیوں نے یورپ میں ڈینیوب کا ڈیلٹا اور ایشیا میں اخالتسیخہ کا صوبہ روس کو دے دیا، بھاری جنگی تاوان ادا کیا، روسی سرپرستی میں سربیا، افلاق، بغدان اور یونان کی خودمختاری مانی، اور بحیرۂ اسود کی بندرگاہیں انابا اور پوتی اور چرکس علاقے پر اپنے حقوق کھو دیے {cite:encyclopaedia-of-islam-2 vol. 6 p. 68} {cite:encyclopaedia-of-islam-2 vol. 2 p. 39}۔"
