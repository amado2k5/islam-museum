label: { ar: "معاهدة أدرنة ⁦(١٨٢٩)⁩", en: "Treaty of Edirne (Adrianople), 1829", ur: "معاہدۂ ادرنہ ⁦(١٨٢٩ء)⁩", es: "Tratado de Edirne (Adrianópolis), 1829", fr: "Traité d'Edirne (Adrianople), 1829", tr: "Edirne Antlaşması (1829)", id: "Perjanjian Adrianople (1829)" }
summary:
  ar: "معاهدة السلام التي أنهت الحرب الروسية العثمانية في 14 أيلول 1829م/1245هـ بعد أن احتل الجنرال ديبيتش أدرنة. تنازلت الدولة العثمانية لروسيا عن دلتا الدانوب في أوروبا وولاية أخالتسيخه في آسيا، ودفعت تعويضاً حربياً كبيراً، وأقرت حكماً ذاتياً لصربيا والأفلاق والبغدان واليونان تحت الحماية الروسية، وخسرت ميناءي أنابا وبوتي وحقوقها في بلاد الشركس {cite:encyclopaedia-of-islam-2 vol. 6 p. 68} {cite:encyclopaedia-of-islam-2 vol. 2 p. 39}."
  en: "The peace treaty that ended the Russo-Ottoman war on 14 September 1829 (1245 AH), after General Diebitsch's army took Edirne. The Ottomans ceded the Danube delta in Europe and the province of Akhaltsikhe in Asia to Russia, paid a heavy war indemnity, accepted autonomy for Serbia, Moldavia, Wallachia and Greece under Russian protection, and lost the Black Sea ports of Anapa and Poti and their rights in Circassia {cite:encyclopaedia-of-islam-2 vol. 6 p. 68} {cite:encyclopaedia-of-islam-2 vol. 2 p. 39}."
  ur: "وہ صلح نامہ جس نے 14 ستمبر 1829ء/1245ھ کو روسی عثمانی جنگ ختم کی، جب جنرل ڈیبیچ کی فوج نے ادرنہ پر قبضہ کر لیا تھا۔ عثمانیوں نے یورپ میں ڈینیوب کا ڈیلٹا اور ایشیا میں اخالتسیخہ کا صوبہ روس کو دے دیا، بھاری جنگی تاوان ادا کیا، روسی سرپرستی میں سربیا، افلاق، بغدان اور یونان کی خودمختاری مانی، اور بحیرۂ اسود کی بندرگاہیں انابا اور پوتی اور چرکس علاقے پر اپنے حقوق کھو دیے {cite:encyclopaedia-of-islam-2 vol. 6 p. 68} {cite:encyclopaedia-of-islam-2 vol. 2 p. 39}۔"
  es: "El tratado de paz que puso fin a la guerra ruso-otomana el 14 de septiembre de 1829 (1245 AH), después de que el ejército del general Diebitsch tomara Edirne. Los otomanos cedieron el delta del Danubio en Europa y la provincia de Akhaltsikhe en Asia a Rusia, pagaron una fuerte indemnización de guerra, aceptaron la autonomía para Serbia, Moldavia, Valaquia y Grecia bajo protección rusa, y perdieron los puertos del Mar Negro de Anapa y Poti y sus derechos en Circasia {cite:encyclopaedia-of-islam-2 vol. 6 p. 68} {cite:encyclopaedia-of-islam-2 vol. 2 p. 39}."
  fr: "Le traité de paix qui mit fin à la guerre russo-ottomane le 14 septembre 1829 (1245 AH), après la prise d'Edirne par l'armée du général Diebitsch, vit les Ottomans céder à la Russie le delta du Danube en Europe et la province d'Akhaltsikhe en Asie, payer une lourde indemnité de guerre, accepter l'autonomie de la Serbie, de la Moldavie, de la Valachie et de la Grèce sous protectorat russe, et perdre les ports d'Anapa et de Poti sur la mer Noire ainsi que leurs droits en Circassie."
  tr: "14 Eylül 1829'da (Hicri 1245) General Depic'in Edirne'yi işgalinden sonra imzalanan ve Rus-Türk Savaşı'nı sona erdiren barış antlaşmasıyla Osmanlı İmparatorluğu, Avrupa'daki Tuna Deltası'nı ve Asya'daki Ahaltsikhe vilayetini Rusya'ya devretti. Ayrıca önemli miktarda savaş tazminatı ödedi, Rusya'nın himayesi altında Sırbistan, Eflak, Moldavya ve Yunanistan'a özerklik tanıdı ve Anapa ile Poti limanlarını ve Çerkesya'daki haklarını kaybetti. {cite:encyclopaedia-of-islam-2 vol. 6 p. 68} {cite:encyclopaedia-of-islam-2 vol. 2 p. 39}."
  id: "Perjanjian damai yang mengakhiri Perang Rusia-Turki pada 14 September 1829 (1245 H), setelah pendudukan Edirne oleh Jenderal Depic, membuat Kekaisaran Ottoman menyerahkan Delta Danube di Eropa dan provinsi Akhaltsikhe di Asia kepada Rusia. Kekaisaran Ottoman juga membayar ganti rugi perang yang besar, memberikan otonomi kepada Serbia, Wallachia, Moldavia, dan Yunani di bawah perlindungan Rusia, dan kehilangan pelabuhan Anapa dan Poti, serta hak-haknya di Circassia. {cite:encyclopaedia-of-islam-2 vol. 6 p. 68} {cite:encyclopaedia-of-islam-2 vol. 2 p. 39}."
