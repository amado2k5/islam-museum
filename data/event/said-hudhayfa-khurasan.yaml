id: event/said-hudhayfa-khurasan
class: event
kind: other
label: { ar: "ولاية سعيد حذيفة خراسان وهزيمة سورة", en: "Sa'id 'Hudhayfa' over Khurasan and Sawra's Defeat", es: "Sa'id 'Hudhayfa' sobre la derrota de Khurasan y Sawra", fr: "Sa'id 'Hudhayfa' à propos de la défaite du Khurasan et de Sawra", ur: "خراسان اور سوارہ کی شکست پر سعید 'حذیفہ'" }
summary:
  ar: "ولي يزيد بن عبد الملك فولى مسلمة بن عبد الملك العراق وخراسان فولى مسلمة سعيد بن عبد العزيز بن الحارث بن الحكم بن أبي العاصي بن أمية خراسان وسعيد هذا يلقب حذيفة وذلك أن بعض دهاقين ما وراء النهر دخل عليه وعليه معصفر وقد رجل شعره فقال هذا حذيفة يعني دهقانة وكان سعيد صهر مسلمة على ابنته فقدم سعيد سورة بن الحر الحنظلي ثم ابنه فتوجه إلى ما وراء النهر فنزل إشتيخن وقد صارت الترك إليها فحاربهم وهزمهم ومنع الناس من طلبهم حيناً ثم لقي الترك ثانية فهزموه وأكثروا القتل في أصحابه وولى سعيد نصر بن سيار وفي سعيد يقول الشاعر فأيرك مشهود وسيفك مشمد سرت إلى الأعداء تلهو يلعبة وشخص قوم من وجوه أهل خراسان إلى مسلمة يشكون سعيداً فعزله وكان الجراح بن عبد الله يتخذ نقراً من فضة وذهب ويصيرها تحت بساط في مجلسه على أوزان مختلفة فإذا دخل عليه الداخل من إخوته والمعتزين به رمى إلى كل امرئ منهم مقدار ما يؤهل له."
  en: "Under Yazid ibn Abd al-Malik, Maslama gave Khurasan to his son-in-law Sa'id ibn Abd al-Aziz — nicknamed 'Hudhayfa' when a dahqan saw him saffron-dyed with combed hair and called him effeminate. His man Sawra ibn al-Hurr retook Ishtikhan from the Turks and routed them, then lost the second battle with heavy loss; the obscene lampoon on Sa'id survives. Khurasan's notables complained to Maslama and he was deposed — al-Jarrah meanwhile had kept weighed silver and gold pieces under his carpet, tossing each visitor his due."
  es: "Bajo el reinado de Yazid ibn Abd al-Malik, Maslama entregó Jorasán a su yerno Sa'id ibn Abd al-Aziz, apodado «Hudhayfa» cuando un dahqan lo vio teñido de azafrán y con el cabello peinado, y lo tildó de afeminado. Su hombre, Sawra ibn al-Hurr, reconquistó Ishtikhan a los turcos y los derrotó, pero perdió la segunda batalla con grandes pérdidas; la sátira obscena sobre Sa'id aún perdura. Los notables de Jorasán se quejaron ante Maslama, quien fue depuesto. Mientras tanto, al-Jarrah guardaba monedas de plata y oro pesadas bajo su alfombra, arrojando a cada visitante lo que le correspondía."
  fr: "Sous Yazid ibn Abd al-Malik, Maslama confia le Khorasan à son gendre Sa'id ibn Abd al-Aziz, surnommé « Hudhayfa » lorsqu'un dahqan, l'ayant vu teint au safran et coiffé, le qualifia d'efféminé. Son homme, Sawra ibn al-Hurr, reprit Ishtikhan aux Turcs et les mit en déroute, puis subit une lourde défaite lors de la seconde bataille; la satire obscène de Sa'id nous est parvenue. Les notables du Khorasan se plaignirent à Maslama, qui fut destitué. Al-Jarrah, quant à lui, conservait sous son tapis des pièces d'argent et d'or pesées, qu'il distribuait à chaque visiteur."
  ur: "یزید بن عبد الملک کے دور میں، مسلمہ نے خراسان کو اپنے داماد سعید بن عبد العزیز کو دے دیا - جسے 'حذیفہ' کا لقب دیا گیا جب ایک دہقان نے اسے کنگھی والے بالوں سے زعفرانی رنگے ہوئے دیکھا اور اسے عفیف کہا۔ اس کے آدمی سوارا بن الحر نے ترکوں سے استخان کو واپس لیا اور انہیں شکست دی، پھر دوسری جنگ بھاری نقصان کے ساتھ ہار گئی۔ سعید پر فحش چراغ بچ گیا۔ خراسان کے معززین نے مسلمہ سے شکایت کی اور اسے معزول کر دیا گیا - اس دوران الجراح نے اپنے قالین کے نیچے وزنی چاندی اور سونے کے ٹکڑے رکھے تھے اور ہر آنے والے کو اس کا حق ادا کیا تھا۔"
