label: { ar: "ولاية سعيد حذيفة خراسان وهزيمة سورة", en: "Sa'id 'Hudhayfa' over Khurasan and Sawra's Defeat", es: "Sa'id 'Hudhayfa' sobre la derrota de Khurasan y Sawra", fr: "Sa'id 'Hudhayfa' à propos de la défaite du Khurasan et de Sawra", ur: "خراسان اور سوارہ کی شکست پر سعید 'حذیفہ'", tr: "Said Hudeyfe'nin Horasan valiliği ve Surenin yenilgisi", id: "Masa pemerintahan Sa'id Hudhayfah di Khorasan dan kekalahan Surah" }
summary:
  ar: "ولي يزيد بن عبد الملك فولى مسلمة بن عبد الملك العراق وخراسان فولى مسلمة سعيد بن عبد العزيز بن الحارث بن الحكم بن أبي العاصي بن أمية خراسان وسعيد هذا يلقب حذيفة وذلك أن بعض دهاقين ما وراء النهر دخل عليه وعليه معصفر وقد رجل شعره فقال هذا حذيفة يعني دهقانة وكان سعيد صهر مسلمة على ابنته فقدم سعيد سورة بن الحر الحنظلي ثم ابنه فتوجه إلى ما وراء النهر فنزل إشتيخن وقد صارت الترك إليها فحاربهم وهزمهم ومنع الناس من طلبهم حيناً ثم لقي الترك ثانية فهزموه وأكثروا القتل في أصحابه وولى سعيد نصر بن سيار وفي سعيد يقول الشاعر فأيرك مشهود وسيفك مشمد سرت إلى الأعداء تلهو يلعبة وشخص قوم من وجوه أهل خراسان إلى مسلمة يشكون سعيداً فعزله وكان الجراح بن عبد الله يتخذ نقراً من فضة وذهب ويصيرها تحت بساط في مجلسه على أوزان مختلفة فإذا دخل عليه الداخل من إخوته والمعتزين به رمى إلى كل امرئ منهم مقدار ما يؤهل له."
  en: "Under Yazid ibn Abd al-Malik, Maslama gave Khurasan to his son-in-law Sa'id ibn Abd al-Aziz — nicknamed 'Hudhayfa' when a dahqan saw him saffron-dyed with combed hair and called him effeminate. His man Sawra ibn al-Hurr retook Ishtikhan from the Turks and routed them, then lost the second battle with heavy loss; the obscene lampoon on Sa'id survives. Khurasan's notables complained to Maslama and he was deposed — al-Jarrah meanwhile had kept weighed silver and gold pieces under his carpet, tossing each visitor his due."
  es: "Bajo el reinado de Yazid ibn Abd al-Malik, Maslama entregó Jorasán a su yerno Sa'id ibn Abd al-Aziz, apodado «Hudhayfa» cuando un dahqan lo vio teñido de azafrán y con el cabello peinado, y lo tildó de afeminado. Su hombre, Sawra ibn al-Hurr, reconquistó Ishtikhan a los turcos y los derrotó, pero perdió la segunda batalla con grandes pérdidas; la sátira obscena sobre Sa'id aún perdura. Los notables de Jorasán se quejaron ante Maslama, quien fue depuesto. Mientras tanto, al-Jarrah guardaba monedas de plata y oro pesadas bajo su alfombra, arrojando a cada visitante lo que le correspondía."
  fr: "Sous Yazid ibn Abd al-Malik, Maslama confia le Khorasan à son gendre Sa'id ibn Abd al-Aziz, surnommé « Hudhayfa » lorsqu'un dahqan, l'ayant vu teint au safran et coiffé, le qualifia d'efféminé. Son homme, Sawra ibn al-Hurr, reprit Ishtikhan aux Turcs et les mit en déroute, puis subit une lourde défaite lors de la seconde bataille; la satire obscène de Sa'id nous est parvenue. Les notables du Khorasan se plaignirent à Maslama, qui fut destitué. Al-Jarrah, quant à lui, conservait sous son tapis des pièces d'argent et d'or pesées, qu'il distribuait à chaque visiteur."
  ur: "یزید بن عبد الملک کے دور میں، مسلمہ نے خراسان کو اپنے داماد سعید بن عبد العزیز کو دے دیا - جسے 'حذیفہ' کا لقب دیا گیا جب ایک دہقان نے اسے کنگھی والے بالوں سے زعفرانی رنگے ہوئے دیکھا اور اسے عفیف کہا۔ اس کے آدمی سوارا بن الحر نے ترکوں سے استخان کو واپس لیا اور انہیں شکست دی، پھر دوسری جنگ بھاری نقصان کے ساتھ ہار گئی۔ سعید پر فحش چراغ بچ گیا۔ خراسان کے معززین نے مسلمہ سے شکایت کی اور اسے معزول کر دیا گیا - اس دوران الجراح نے اپنے قالین کے نیچے وزنی چاندی اور سونے کے ٹکڑے رکھے تھے اور ہر آنے والے کو اس کا حق ادا کیا تھا۔"
  tr: "Yezid ibn Abdülmalik Irak ve Horasan valiliğine atandı ve Maslama ibn Abdülmalik, Said ibn Abdülaziz ibn el-Harith ibn el-Hakam ibn Abi el-As ibn Umeyye'yi Horasan'a atadı. Bu Said'e Hudeyfa lakabı takıldı çünkü Transoksanya'nın toprak sahiplerinden biri yanına geldi, safran giymiş ve saçlarını taramıştı ve \"Bu Hudeyfa\" dedi, yani bir toprak sahibi. Said, Maslama'nın kızı aracılığıyla damadıydı. Said, oğlu Surah ibn el-Hürr el-Hanzali'yi atadı ve Transoksanya'ya giderek Türklerin geldiği İştikhan'da kamp kurdu. Onlarla savaştı, onları yendi ve bir süre insanların onları takip etmesini engelledi. Sonra Türklerle ikinci kez karşılaştı ve onu yendiler ve birçok arkadaşını öldürdüler. Said, Nasr ibn Sayyar'ı atadı. Şair, Said hakkında şöyle der: “Penisiniz şahit, kılıcınız bilenmiş. Düşmanlara oyun oynayarak gittiniz.” Horasan halkından bir grup ileri gelen, Said hakkında şikayette bulunmak için Maslama'ya gitti, bunun üzerine Maslama onları görevden aldı. El-Cerrah ibn Abd Allah, meclisinde bir halının altına farklı ağırlıklarda gümüş ve altın dolu bir kutu koyardı. Kardeşlerinden ve onunla gurur duyanlardan biri yanına girdiğinde, her birine hak ettiği miktarda altın atardı."
  id: "Yazid ibn Abd al-Malik diangkat menjadi gubernur Irak dan Khurasan, dan Maslama ibn Abd al-Malik menunjuk Saeed ibn Abd al-Aziz ibn al-Harith ibn al-Hakam ibn Abi al-As ibn Umayya ke Khurasan. Saeed ini dijuluki Hudhayfa, karena salah seorang pemilik tanah di Transoxiana mendatanginya, dan ia mengenakan pakaian berwarna safron dan menyisir rambutnya, lalu berkata, “Ini Hudhayfa,” yang berarti seorang pemilik tanah. Saeed adalah menantu Maslama melalui putrinya. Saeed menunjuk Surah ibn al-Hurr al-Hanzali, kemudian putranya, dan ia menuju Transoxiana dan berkemah di Ishtikhan, tempat orang-orang Turki tiba. Ia melawan mereka dan mengalahkan mereka serta mencegah orang-orang mengejar mereka untuk sementara waktu. Kemudian ia bertemu dengan orang-orang Turki untuk kedua kalinya, dan mereka mengalahkannya serta membunuh banyak sahabatnya. Saeed menunjuk Nasr ibn Sayyar. Dan tentang Saeed, penyair itu berkata: “Kemaluanmu disaksikan dan pedangmu diasah. Kau pergi ke pihak musuh, bermain-main.” Sekelompok tokoh terkemuka dari penduduk Khurasan pergi ke Maslama untuk mengadu tentang Saeed, sehingga ia memecatnya. Al-Jarrah ibn Abd Allah biasa membuat kotak dari perak dan emas dan meletakkannya di bawah karpet di ruang dewannya dengan berat yang berbeda-beda. Ketika salah satu saudaranya dan orang-orang yang bangga padanya masuk menemuinya, ia akan melemparkan kepada masing-masing dari mereka sejumlah yang pantas mereka terima."
