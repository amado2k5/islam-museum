id: event/conquest-of-ras-al-ayn
class: event
kind: conquest
label: { ar: "فتح رأس العين", en: "The Conquest of Ra's al-Ayn" }
summary:
  ar: "عند البلاذري عن الحجاج بن أبي منيع عن أبيه عن جده: امتنعت رأس العين — وهي عين الوردة — على إياد بن غنم ففتحها عمير بن سعد وهو والي عمر على الجزيرة بعد أن قاتل أهلها المسلمين قتالاً شديداً فدخلها المسلمون عنوة ثم صالحوهم بعد ذلك على أن دُفعت الأرض إليهم ووُضعت الجزية على رؤوسهم على كل رأس أربعة دنانير ولم تسب نساؤهم ولا أولادهم؛ وعند الواقدي عن أبي وهب الجيشاني: كتب عمر إلى إياد يأمره أن يوجه عمير بن سعد إلى عين الوردة فوجهه إليها فقدم الطلائع أمامه فأصابوا قوماً من الفلاحين وغنموا مواشي من مواشي العدو ثم إن أهل المدينة أغلقوا أبوابها ونصبوا العرادات عليها فقتل من المسلمين بالحجارة والسهام بشر واطلع عليهم بطريق من بطارقتها فشتمهم وقال «لسنا كمن لقيتم» ثم إنها فتحت بعد على صلح؛ وسمع مشايخ من أهلها أن عميراً لما دخلها قال لهم «لا بأس، لا بأس، إليّ إليّ» فكان ذلك أماناً لهم؛ وزعم هيثم بن عدي أن عمر بعث أبا موسى الأشعري إلى عين الوردة فغزاها بجند الجزيرة بعد وفاة إياد — والأثبت أن عميراً فتحها عنوة فلم تسب وجعل عليهم الخراج والجزية ولم يقل بهذا أحد غير هيثم؛ وجلا خلق من أهل رأس العين واعتمل المسلمون أواضيهم وازدرعوها بإقطاع."
  en: "In al-Baladhuri through al-Hajjaj ibn Abi Mani' from his grandfather: Ra's al-Ayn — that is Ayn al-Warda — resisted Iyad ibn Ghanm and Umayr ibn Sa'd took it while Umar's governor over the Jazira, after its people fought the Muslims bitterly; the Muslims entered it by force then compounded with them, the land assigned them and jizya laid on their heads at four dinars each without captives of women or children; in al-Waqidi's report Umar wrote to Iyad ordering him to send Umayr against Ayn al-Warda — the advance guard took peasants and enemy herds, the citizens shut the gates and set up mangonels, Muslims were killed by stones and arrows, and a patrician mocked them 'we are not like those you have met' — then it fell afterwards by treaty; elders of the city recount that when Umayr entered he called 'no harm, no harm — to me, to me', and that was their aman; Haytham ibn Adi claimed Umar sent Abu Musa al-Ash'ari who took it with the Jazira's army after Iyad's death, but the sound report is Umayr took it by force without enslavement, laying kharaj and jizya — none but Haytham says otherwise; a body of Ra's al-Ayn's people departed and the Muslims worked their fields, sowing them by land-grants."
