summary:
  ar: "عند البلاذري عن الحجاج بن أبي منيع عن أبيه عن جده: امتنعت رأس العين — وهي عين الوردة — على إياد بن غنم ففتحها عمير بن سعد وهو والي عمر على الجزيرة بعد أن قاتل أهلها المسلمين قتالاً شديداً فدخلها المسلمون عنوة ثم صالحوهم بعد ذلك على أن دُفعت الأرض إليهم ووُضعت الجزية على رؤوسهم على كل رأس أربعة دنانير ولم تسب نساؤهم ولا أولادهم؛ وعند الواقدي عن أبي وهب الجيشاني: كتب عمر إلى إياد يأمره أن يوجه عمير بن سعد إلى عين الوردة فوجهه إليها فقدم الطلائع أمامه فأصابوا قوماً من الفلاحين وغنموا مواشي من مواشي العدو ثم إن أهل المدينة أغلقوا أبوابها ونصبوا العرادات عليها فقتل من المسلمين بالحجارة والسهام بشر واطلع عليهم بطريق من بطارقتها فشتمهم وقال «لسنا كمن لقيتم» ثم إنها فتحت بعد على صلح؛ وسمع مشايخ من أهلها أن عميراً لما دخلها قال لهم «لا بأس، لا بأس، إليّ إليّ» فكان ذلك أماناً لهم؛ وزعم هيثم بن عدي أن عمر بعث أبا موسى الأشعري إلى عين الوردة فغزاها بجند الجزيرة بعد وفاة إياد — والأثبت أن عميراً فتحها عنوة فلم تسب وجعل عليهم الخراج والجزية ولم يقل بهذا أحد غير هيثم؛ وجلا خلق من أهل رأس العين واعتمل المسلمون أواضيهم وازدرعوها بإقطاع."
  en: "In al-Baladhuri through al-Hajjaj ibn Abi Mani' from his grandfather: Ra's al-Ayn — that is Ayn al-Warda — resisted Iyad ibn Ghanm and Umayr ibn Sa'd took it while Umar's governor over the Jazira, after its people fought the Muslims bitterly; the Muslims entered it by force then compounded with them, the land assigned them and jizya laid on their heads at four dinars each without captives of women or children; in al-Waqidi's report Umar wrote to Iyad ordering him to send Umayr against Ayn al-Warda — the advance guard took peasants and enemy herds, the citizens shut the gates and set up mangonels, Muslims were killed by stones and arrows, and a patrician mocked them 'we are not like those you have met' — then it fell afterwards by treaty; elders of the city recount that when Umayr entered he called 'no harm, no harm — to me, to me', and that was their aman; Haytham ibn Adi claimed Umar sent Abu Musa al-Ash'ari who took it with the Jazira's army after Iyad's death, but the sound report is Umayr took it by force without enslavement, laying kharaj and jizya — none but Haytham says otherwise; a body of Ra's al-Ayn's people departed and the Muslims worked their fields, sowing them by land-grants."
  es: "En al-Baladhuri a través de al-Hajjaj ibn Abi Mani' de su abuelo: Ra's al-Ayn — es decir, Ayn al-Warda — resistió a Iyad ibn Ghanm y Umayr ibn Sa'd la tomó mientras Umar era gobernador de Jazira, después de que su gente luchara encarnizadamente contra los musulmanes; los musulmanes entraron por la fuerza y luego llegaron a un acuerdo con ellos, la tierra les fue asignada y se les impuso una jizya de cuatro dinares cada uno sin cautivos de mujeres ni niños; en el informe de al-Waqidi Umar escribió a Iyad ordenándole que enviara a Umayr contra Ayn al-Warda — la vanguardia tomó campesinos y rebaños enemigos, los ciudadanos cerraron las puertas y colocaron mangoneles, los musulmanes fueron asesinados con piedras y flechas, y un patricio se burló de ellos diciendo \"no somos como aquellos que habéis encontrado\" — luego cayó después por tratado; Los ancianos de la ciudad cuentan que cuando Umayr entró gritó \"no hay daño, no hay daño, a mí, a mí\", y ese era su aman; Haytham ibn Adi afirmó que Umar envió a Abu Musa al-Ash'ari, quien la tomó con el ejército de Jazira después de la muerte de Iyad, pero el relato fidedigno es que Umayr la tomó por la fuerza sin esclavitud, estableciendo kharaj y jizya; nadie más que Haytham dice lo contrario; un grupo de la gente de Ra's al-Ayn partió y los musulmanes trabajaron sus campos, sembrándolos mediante concesiones de tierras."
  fr: "Dans al-Baladhuri, transmis par al-Hajjaj ibn Abi Mani' d'après son grand-père: Ra's al-Ayn — c'est-à-dire Ayn al-Warda — résista à Iyad ibn Ghanm et Umayr ibn Sa'd s'en empara alors qu'Umar était gouverneur de la Jazira, après que ses habitants eurent combattu avec acharnement les musulmans; les musulmans y entrèrent par la force, puis conclurent un pacte avec eux, la terre leur fut attribuée et la jizya fut imposée sur leurs têtes à hauteur de quatre dinars chacun, sans captifs de femmes ni d'enfants; dans le rapport d'al-Waqidi, Umar écrivit à Iyad lui ordonnant d'envoyer Umayr contre Ayn al-Warda — l'avant-garde prit des paysans et du bétail ennemi, les citoyens fermèrent les portes et installèrent des mangonneaux, les musulmans furent tués à coups de pierres et de flèches, et un patricien se moqua d'eux: « Nous ne sommes pas comme ceux que vous avez rencontrés » — puis elle tomba par la suite par traité; Les anciens de la ville racontent que lorsqu'Umayr entra, il s'écria « Pas de mal, pas de mal — à moi, à moi », et ce fut leur aman; Haytham ibn Adi affirma qu'Umar envoya Abu Musa al-Ash'ari qui s'en empara avec l'armée de la Jazira après la mort d'Iyad, mais le récit le plus fiable est qu'Umayr la prit par la force sans esclavage, imposant le kharaj et la jizya — seul Haytham dit le contraire; une partie des habitants de Ra's al-Ayn partit et les musulmans cultivèrent leurs champs, les semant grâce à des concessions de terres."
