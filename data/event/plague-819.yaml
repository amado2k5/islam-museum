summary:
  ar: "استهلت سنة تسع عشرة وثمان مئة والغلاء والطاعون باقيان زائدان بمصر وطرابلس حتى قيل مات بطرابلس في عشرة أيام عشرة آلاف نفس وتواتر انتشار الطاعون في البلاد حتى قيل إن أهل أصبهان لم يبق منهم إلا النادر وإن أهل فاس أحصوا من مات منهم في شهر واحد فكانوا ستة وثلاثين ألفاً حتى كادت البلدان تخلو من أهلها وفيها أمر السلطان الخطباء إذا وصلوا إلى الدعاء له في الخطبة أن يهبطوا من المنبر درجة أدباً ليكون اسم الله ورسوله في مكان أعلى من المكان الذي يذكر فيه السلطان فصنع ذلك واستمر {cite:shadharat-dhahab p. 142}."
  en: "819 opened with dearth and plague still mounting in Egypt and Tripoli — it was said ten thousand died at Tripoli in ten days, that of Isfahan's people only the rare survived, and that Fez counted thirty-six thousand dead in a single month, the lands nearly emptied of their people. That year the sultan ordered the khatibs, when they reached the prayer for him in the sermon, to step down one step of the minbar in courtesy, so God's name and His Messenger's would stand higher than the spot where the sultan is named — and the custom endured {cite:shadharat-dhahab p. 142}."
