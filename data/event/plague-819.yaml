label: { ar: "طاعون سنة 819هـ", en: "The Plague of 819 AH", es: "La plaga del año 819 d. C.", fr: "La peste de 819 AH", ur: "طاعون 819ھ", tr: "Hicri 819 yılının veba salgını", id: "Wabah tahun 819 Hijriah" }
summary:
  ar: "استهلت سنة تسع عشرة وثمان مئة والغلاء والطاعون باقيان زائدان بمصر وطرابلس حتى قيل مات بطرابلس في عشرة أيام عشرة آلاف نفس وتواتر انتشار الطاعون في البلاد حتى قيل إن أهل أصبهان لم يبق منهم إلا النادر وإن أهل فاس أحصوا من مات منهم في شهر واحد فكانوا ستة وثلاثين ألفاً حتى كادت البلدان تخلو من أهلها وفيها أمر السلطان الخطباء إذا وصلوا إلى الدعاء له في الخطبة أن يهبطوا من المنبر درجة أدباً ليكون اسم الله ورسوله في مكان أعلى من المكان الذي يذكر فيه السلطان فصنع ذلك واستمر {cite:shadharat-dhahab p. 142}."
  en: "819 opened with dearth and plague still mounting in Egypt and Tripoli — it was said ten thousand died at Tripoli in ten days, that of Isfahan's people only the rare survived, and that Fez counted thirty-six thousand dead in a single month, the lands nearly emptied of their people. That year the sultan ordered the khatibs, when they reached the prayer for him in the sermon, to step down one step of the minbar in courtesy, so God's name and His Messenger's would stand higher than the spot where the sultan is named — and the custom endured {cite:shadharat-dhahab p. 142}."
  es: "El año 819 comenzó con escasez y plagas que seguían extendiéndose por Egipto y Trípoli. Se decía que diez mil personas murieron en Trípoli en diez días, que de la población de Isfahán solo sobrevivieron unos pocos, y que en Fez se contabilizaron treinta y seis mil muertos en un solo mes, quedando las tierras prácticamente deshabitadas. Ese año, el sultán ordenó a los khatibs que, al llegar a la oración en su honor durante el sermón, bajaran un escalón del minbar en señal de cortesía, para que el nombre de Dios y el de su Mensajero quedaran por encima del lugar donde se nombraba al sultán. Esta costumbre perduró {cite:shadharat-dhahab p. 142}."
  fr: "L'année 819 commença alors que la famine et la peste continuaient de sévir en Égypte et à Tripoli. On rapportait que dix mille personnes périrent à Tripoli en dix jours, que seuls quelques rares survivants s'en sortirent à Ispahan, et que Fès dénombra trente-six mille morts en un seul mois, ses terres étant presque entièrement vidées de leurs habitants. Cette année-là, le sultan ordonna aux khatibs, lors de la prière prononcée en son honneur pendant le sermon, de descendre d'une marche du minbar par courtoisie, afin que le nom de Dieu et celui de Son Messager soient plus visibles que le nom du sultan lui-même. Cette coutume perdura (cf. shadharat-dhahab, p. 142)."
  ur: "مصر اور طرابلس میں قلت اور طاعون کے ساتھ 819 کا آغاز ہوا - کہا جاتا ہے کہ دس دنوں میں طرابلس میں دس ہزار لوگ مر گئے، اصفہان کے لوگوں میں سے صرف نایاب زندہ بچ گئے، اور فیز نے ایک ہی مہینے میں چھتیس ہزار مرنے والوں کی گنتی کی، زمینیں ان کے لوگوں سے تقریباً خالی ہو گئیں۔ اس سال سلطان نے خطیبوں کو حکم دیا کہ جب وہ خطبہ میں اس کے لیے دعا کے لیے پہنچیں تو شائستگی کے ساتھ منبر سے ایک قدم نیچے اتریں، تاکہ خدا اور اس کے رسول کا نام اس جگہ سے اونچا ہو جہاں سلطان کا نام رکھا گیا ہو۔ 142}۔"
  tr: "819 yılı başladı ve Mısır ile Trablus'ta kıtlık ve veba giderek artıyordu; öyle ki Trablus'ta on günde on bin kişinin öldüğü söyleniyordu. Veba tüm ülkeye yayıldı ve İsfahan'da sadece birkaç kişinin kaldığı, Fez halkının bir ayda ölenlerin sayısını otuz altı bin olarak hesapladığı, ülkelerin neredeyse tamamen boşaldığı söyleniyordu. Sultan, vaazda kendisine dua etme noktasına geldiklerinde, Allah'ın ve Resulünün adının Sultan'ın adından daha yüksek bir yerde olması için saygı göstergesi olarak minberden bir adım aşağı inmelerini emretti. O da öyle yaptı ve bu durum devam etti. {kaynak: Şadharat-dahab s. 142}"
  id: "Tahun 819 dimulai, dan kelaparan serta wabah penyakit masih meningkat di Mesir dan Tripoli, hingga dikatakan bahwa sepuluh ribu orang meninggal di Tripoli dalam sepuluh hari. Wabah penyakit menyebar ke seluruh negeri hingga dikatakan bahwa hanya sedikit orang yang tersisa di Isfahan, dan bahwa penduduk Fez menghitung orang-orang yang meninggal di antara mereka dalam satu bulan, dan jumlahnya mencapai tiga puluh enam ribu, hingga negara-negara tersebut hampir kosong dari penduduknya. Dalam hal ini, Sultan memerintahkan para pengkhotbah, ketika mereka sampai pada bagian berdoa untuknya dalam khotbah, untuk turun satu langkah dari mimbar sebagai tanda penghormatan, sehingga nama Allah dan Rasul-Nya berada di tempat yang lebih tinggi daripada tempat di mana Sultan disebutkan. Maka beliau melakukan itu dan hal itu berlanjut. {cite:shadharat-dhahab p. 142}"
