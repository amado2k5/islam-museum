id: event/safadi-meets-ibn-taymiyya-717
class: event
kind: other
label:
  ar: "الصفدي بدمشق يلقى ابن تيمية، ٧١٧هـ"
  en: "Al-Safadi at Damascus meets Ibn Taymiyya, 717/1317"
  ur: "صفدی دمشق میں ابن تیمیہ سے ملاقات، 717ھ/1317ء"
summary:
  ar: "قدم الصفدي دمشق شاباً في العشرين من عمره ولقي فيها ابن تيمية سنة ٧١٧هـ أو ٧١٨هـ، وقد ظهر عليه حينئذ كثرة محصوله كما يفخر هو ويكرر ذكره في كتبه؛ وأخذ عن الشهاب محمود وابن سيد الناس وابن نباتة وأبي حيان، وسمع بدمشق من المزي وابن جماعة {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88}."
  en: "Al-Safadi came to Damascus as a young man of twenty and had his first meeting with Ibn Taymiyya in 717/1317 or 718/1318, displaying a store of knowledge he proudly and repeatedly recalls in his own works; he read with al-Shihab Mahmud, Ibn Sayyid al-Nas, Ibn Nubata and Abu Hayyan, and heard hadith at Damascus from al-Mizzi and Ibn Jama'a {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88}."
  ur: "صفدی بیس برس کی عمر میں دمشق آیا اور 717ھ/1317ء یا 718ھ/1318ء میں ابن تیمیہ سے پہلی ملاقات کی، جس موقع پر وہ اپنے علمی ذخیرے کا مظاہرہ کر کے فخر سے اپنی تصانیف میں بار بار یاد کرتا ہے؛ اس نے شہاب محمود، ابن سید الناس، ابن نباتہ اور ابو حیان سے پڑھا اور دمشق میں مزّی اور ابن جماعہ سے سمع کیا {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88}۔"
