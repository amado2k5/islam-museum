label: { ar: "ولادة الحسن بن علي وتسميته وعقيقته", en: "The birth, naming and aqiqa of Hasan ibn Ali" }
summary:
  ar: "يذكر الصلابي أن الحسن ولد للنصف من رمضان سنة ثلاث للهجرة، وأن أقوالاً أخرى قيلت في شعبان أو في سنة أربع أو خمس، وأنه اختار في كتابه السيرة النبوية أنه ولد في العام الرابع (ص 86-87 والهامش). سمّاه علي حرباً فسمّاه النبي حسناً، وأذّن النبي في أذنه، وأمرت فاطمة بوزن شعره فضة تُتصدّق على المساكين وأهل الصفة بدل الذبح (ص 86)."
  en: "Al-Sallabi gives Hasan's birth as the middle of Ramadan in the third year after the Hijra, notes other reports, and says he prefers the fourth year in his own sira; Ali first named him Harb, and the Prophet renamed him Hasan; for the aqiqa, silver equal to the weight of the infant's hair was given in charity instead of sacrifice (p. 86)."
