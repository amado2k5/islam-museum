id: event/battle-of-sillabra
class: event
kind: battle
label:
  ar: وقعة سلّبرى ومقتل نافع بن الأزرق
  en: Battle of Sillabra and the death of Nafi' ibn al-Azraq
  ur: سلبریٰ کی لڑائی اور نافع بن ازرق کا قتل
summary:
  ar: لقاء المهلب بن أبي صفرة والأزارقة بموضع يقرأه المحقق سلّبرى قرب مناذر، قُتل فيه رئيسهم نافع بن الأزرق، فيما يروي الدينوري {cite:akhbar-tiwal-amir p. 272} {cite:akhbar-tiwal-amir p. 273}.
  en: Al-Muhallab ibn Abi Sufra's encounter with the Azariqa at a place the editor reads as Sillabra near Manadhir, in which their leader Nafi' ibn al-Azraq was killed, as al-Dinawari reports {cite:akhbar-tiwal-amir p. 272} {cite:akhbar-tiwal-amir p. 273}.
  ur: مہلب بن ابی صفرہ اور ازارقہ کا مقابلہ ایک ایسے مقام پر جسے محقق مناذر کے قریب سلبریٰ پڑھتے ہیں، جس میں ان کا سردار نافع بن ازرق مارا گیا، جیسا کہ دینوری روایت کرتے ہیں {cite:akhbar-tiwal-amir p. 272} {cite:akhbar-tiwal-amir p. 273}۔
