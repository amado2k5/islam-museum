summary:
  ar: "احتبس ملك من ملوك اليمن بعض وفد معد رهينة وقال ائتوني برؤساء قومكم لآخذ عليهم المواثيق وإلا قتلت أصحابكم، فبعث كليب وائل إلى ربيعة فجمعهم واجتمعت عليه معد — وهو أحد ثلاثة اجتمعت عليهم معد — وجعل على مقدمته السفاح التغلبي وأمرهم أن يوقدوا على خزاز نارًا ليهتدوا بها وإن غشيهم العدو أوقدوا نارين، وخزاز جبل بطخفة ما بين البصرة إلى مكة قريب من سالع. فسارت مذحج بجموع اليمن فأوقد السفاح نارين فصحبهم كليب بالجموع فالتقوا بخزاز فانهزمت مذحج وانفضت جموعها، وقيل لم يعلم من كان الرئيس يوم خزاز لأن عمرو بن كلثوم وهو ابن ابنة كليب لم يدع له الرياسة في فخره وهي أشرف ما كان يفتخر به {cite:kamil-ibn-al-athir p. 392-393}."
  en: "A Yemeni king held part of a Maʿadd embassy hostage, demanding their chiefs come covenant obedience or the captives die. Kulayb ibn Rabīʿa summoned Rabīʿa and all Maʿadd gathered to him — one of only three men ever so followed — with al-Saffāḥ al-Taghlibī leading the van and ordered to light signal fires on Mount Khazāz, by Ṭakhfā on the Basra–Mecca road: two fires if the enemy closed. When the fires rose, Kulayb brought the host and at Khazāz they broke Madhḥij and scattered the Yemen host — though the genealogists said no one knows who held the chief command that day, for ʿAmr ibn Kulthūm never claimed it in his boast though his mother was Kulayb's daughter {cite:kamil-ibn-al-athir p. 392-393}."
