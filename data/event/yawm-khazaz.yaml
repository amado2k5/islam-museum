  start: { edtf: "0470", calendar: julian, precision: year, status: tradition, derived: true, note: "جاهلي؛ التاريخ تقريبي عند أهل الأيام {cite:kamil-ibn-al-athir p. 392-393}." }
summary:
  ar: "احتبس ملك من ملوك اليمن بعض وفد معد رهينة وقال ائتوني برؤساء قومكم لآخذ عليهم المواثيق وإلا قتلت أصحابكم، فبعث كليب وائل إلى ربيعة فجمعهم واجتمعت عليه معد — وهو أحد ثلاثة اجتمعت عليهم معد — وجعل على مقدمته السفاح التغلبي وأمرهم أن يوقدوا على خزاز نارًا ليهتدوا بها وإن غشيهم العدو أوقدوا نارين، وخزاز جبل بطخفة ما بين البصرة إلى مكة قريب من سالع. فسارت مذحج بجموع اليمن فأوقد السفاح نارين فصحبهم كليب بالجموع فالتقوا بخزاز فانهزمت مذحج وانفضت جموعها، وقيل لم يعلم من كان الرئيس يوم خزاز لأن عمرو بن كلثوم وهو ابن ابنة كليب لم يدع له الرياسة في فخره وهي أشرف ما كان يفتخر به {cite:kamil-ibn-al-athir p. 392-393}."
  en: "A Yemeni king held part of a Maʿadd embassy hostage, demanding their chiefs come covenant obedience or the captives die. Kulayb ibn Rabīʿa summoned Rabīʿa and all Maʿadd gathered to him — one of only three men ever so followed — with al-Saffāḥ al-Taghlibī leading the van and ordered to light signal fires on Mount Khazāz, by Ṭakhfā on the Basra–Mecca road: two fires if the enemy closed. When the fires rose, Kulayb brought the host and at Khazāz they broke Madhḥij and scattered the Yemen host — though the genealogists said no one knows who held the chief command that day, for ʿAmr ibn Kulthūm never claimed it in his boast though his mother was Kulayb's daughter {cite:kamil-ibn-al-athir p. 392-393}."
  es: "Un rey yemení mantuvo como rehenes a parte de una embajada de Maʿadd, exigiendo que sus jefes obedecieran el pacto o los cautivos morirían. Kulayb ibn Rabīʿa convocó a Rabīʿa y todo Maʿadd se reunió con él —uno de los únicos tres hombres que lo siguieron— con al-Saffāḥ al-Taghlibī al frente de la vanguardia y ordenó encender hogueras de señales en el monte Khazāz, cerca de Ṭakhfā en el camino Basora-La Meca: dos hogueras si el enemigo se acercaba. Cuando las hogueras se encendieron, Kulayb trajo al ejército y en Khazāz rompieron Madhḥij y dispersaron al ejército yemení —aunque los genealogistas dijeron que nadie sabe quién ostentó el mando principal ese día, pues ʿAmr ibn Kulthūm nunca lo reclamó en su jactancia, aunque su madre era hija de Kulayb {cite:kamil-ibn-al-athir p. 392-393}."
  fr: "Un roi yéménite prit en otage une partie de l'ambassade du Ma'add, exigeant que leurs chefs se soumettent à l'alliance sous peine de mort. Kulayb ibn Rabīʿa convoqua Rabīʿa et tout le Ma'add se rassembla autour de lui – un des trois seuls hommes à avoir jamais reçu un tel accueil – avec al-Saffāḥ al-Taghlibī en tête. Il reçut l'ordre d'allumer des feux de signalisation sur le mont Khazāz, près de Ṭakhfā, sur la route de Bassora à La Mecque: deux feux si l'ennemi s'approchait. Lorsque les feux s'élevèrent, Kulayb mena l'armée et, à Khazāz, ils brisèrent le Madhḥij et dispersèrent les troupes yéménites. Cependant, les généalogistes affirment que nul ne sait qui commandait ce jour-là, car ʿAmr ibn Kulthūm ne le revendiqua jamais, bien que sa mère fût la fille de Kulayb (voir: Kamil-ibn-al-athir, p. 392-393)."
  ur: "ایک یمنی بادشاہ نے معد کے سفارت خانے کے ایک حصے کو یرغمال بنا کر اپنے سربراہوں سے مطالبہ کیا کہ وہ عہد کی اطاعت کریں یا اسیروں کی موت ہو جائے۔ کلیب بن ربیعہ نے ربیعہ کو بلوایا اور تمام معد اس کے پاس جمع ہوئے - صرف تین آدمیوں میں سے ایک جو اب تک اس کے پیچھے آیا تھا - الصفح الطغلبی وین کی قیادت کر رہا تھا اور کوہ خزاز پر سگنل فائر کرنے کا حکم دیا، دشمن نے بصرہ پر طخفہ کے ذریعہ دو فائر بند کردیئے: جب آگ بھڑک اٹھی تو کلیب میزبان لے کر آئے اور خزاز کے مقام پر انہوں نے مدحج کو توڑ دیا اور یمن کے میزبان کو تتر بتر کر دیا - حالانکہ ماہرین نسب کا کہنا ہے کہ کوئی نہیں جانتا کہ اس دن سربراہی کس کے پاس تھی، کیونکہ عمرو بن کلثوم نے کبھی اپنے فخر میں یہ دعویٰ نہیں کیا حالانکہ اس کی والدہ کلیب کی بیٹی تھیں۔ 392-393}۔"
  tr: "Yemen kralı, Ma'ad heyetinin bazı üyelerini rehin aldı ve \"Bana aşiret liderlerinizi getirin ki onlardan yemin alayım, yoksa yoldaşlarınızı öldürürüm\" dedi. Kulayb ibn Wa'il, Rabi'ah'a haber gönderdi ve Rabi'ah onları bir araya topladı. Ma'ad, Rabi'ah'ın etrafında toplandı - o, Ma'ad'ın birleştiği üç liderden biriydi - ve el-Saffah el-Taghlibi'yi öncü birliğin başına getirdi. Onlara, yol göstermek için Khazaz'da bir ateş yakmalarını ve düşman saldırırsa iki ateş yakmalarını emretti. Khazaz, Basra ile Mekke arasında, Sal'a yakınlarındaki Takhfah'ta bulunan bir dağdır. Madhhij, Yemen kuvvetleriyle birlikte yürüdü ve el-Saffah iki ateş yaktı. Kulayb, askerleriyle birlikte onlara eşlik etti ve Khazaz'da buluştular. Madhhij yenildi ve kuvvetleri dağıldı. Khazaz günü önderinin bilinmemesinin sebebi, Kulayb'ın kızının oğlu Amr ibn Kulsum'un, övündüğü en şerefli şey olan önderliği kendi övünçlerinde öne sürmemesidir. {kaynak: Kamil ibn al-athir s. 392-393}"
  id: "Seorang raja Yaman menyandera beberapa anggota delegasi Ma'ad dan berkata, \"Bawalah para pemimpin suku kalian kepadaku agar aku dapat meminta sumpah dari mereka, atau aku akan membunuh rekan-rekan kalian.\" Kulayb ibn Wa'il mengirim pesan kepada Rabi'ah, yang mengumpulkan mereka. Ma'ad bersatu di sekelilingnya—ia adalah salah satu dari tiga pemimpin yang menyatukan Ma'ad—dan ia menempatkan al-Saffah al-Taghlibi sebagai komandan barisan depan. Ia memerintahkan mereka untuk menyalakan api di Khazaz untuk memandu mereka, dan jika musuh menyerang, untuk menyalakan dua api. Khazaz adalah sebuah gunung di Takhfah, antara Basra dan Mekah, dekat Sal'a. Madhhij berbaris bersama pasukan Yaman, dan al-Saffah menyalakan dua api. Kulayb menemani mereka dengan pasukannya, dan mereka bertemu di Khazaz. Madhhij dikalahkan, dan pasukannya tercerai-berai. Dikatakan bahwa pemimpin pada hari Khazaz tidak diketahui karena 'Amr ibn Kulthum, putra putri Kulayb, tidak mengklaim kepemimpinan untuknya dalam sesumbarannya, yang merupakan hal paling terhormat yang biasa ia banggakan. {cite:kamil-ibn-al-athir hlm. 392-393}"
