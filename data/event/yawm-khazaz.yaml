label: { ar: "يوم خزاز — اجتماع معد على كليب", en: "the day of Khazāz — all Maʿadd under Kulayb break the Yemen host", es: "El día de Khazāz: todos los Maʿadd bajo el mando de Kulayb rompen el ejército de Yemen.", fr: "le jour de Khazāz — tous les Maʿadd sous Kulayb rompent l'hôte du Yémen", ur: "خزاز کا دن - کلیب کے ماتحت تمام معد یمن کی میزبانی کو توڑ دیتے ہیں۔", tr: "Khazzaz Günü — Bir klip üzerine hazırlanmış bir toplantı", id: "Hari Khazzaz — Pertemuan yang disiapkan dalam bentuk klip" }
