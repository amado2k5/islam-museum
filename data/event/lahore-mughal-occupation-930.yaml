id: event/lahore-mughal-occupation-930
class: event
kind: conquest
label:
  ar: "المغول يحتلون لاهور بقيادة بابر، ٩٣٠هـ/١٥٢٤م"
  en: "The Mughals occupy Lahore under Babur, 930/1524"
  ur: "بابر کی قیادت میں مغلوں کا لہور پر قبضہ، 930ھ/1524ء"
  es: "Los mogoles ocupan Lahore bajo el mando de Babur, 930/1524."
  fr: "Les Moghols occupent Lahore sous Babur, 930/1524"
  tr: "Babür önderliğindeki Babürler, Hicri 930/Miladi 1524 yılında Lahor'u fethetti."
  id: "Dinasti Mughal menaklukkan Lahore di bawah kepemimpinan Babur, 930 H/1524 M."
summary:
  ar: "شجَّع دولت خان لودي والي البنجاب، وهو من أقارب سلطان دهلي، طموحَ بابر نحو الهند، فانتهى ذلك إلى احتلال المغول للاهور سنة ٩٣٠هـ/١٥٢٤م {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  en: "Daulat Khan Lodi, the sultan's kinsman who governed the Punjab, encouraged Babur's designs on Hindustan, leading to the occupation of Lahore by the Mughals in 930/1524 {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  ur: "سلطان کے رشتے دار اور پنجاب کے گورنر دولت خان لودی نے بابر کو ہندوستان پر حملے کی ترغیب دی، جس کا نتیجہ 930ھ/1524ء میں مغلوں کا لہور پر قبضہ نکلا {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  es: "Daulat Khan Lodi, pariente del sultán que gobernaba el Punjab, alentó los designios de Babur sobre Hindustan, lo que llevó a la ocupación de Lahore por los mogoles en 930/1524 {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  fr: "Daulat Khan Lodi, le parent du sultan qui gouvernait le Pendjab, encouragea les desseins de Babur sur l'Hindoustan, ce qui mena à l'occupation de Lahore par les Moghols en 930/1524 {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  tr: "Pencap valisi ve Delhi Sultanı'nın akrabası olan Daulat Han Lodi, Babür'ün Hindistan'a yönelik emellerini destekledi ve bu emeller, 930 Hicri/1524 Miladi yılında Lahor'un Babürler tarafından işgal edilmesiyle sonuçlandı. {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}"
  id: "Daulat Khan Lodi, gubernur Punjab dan kerabat Sultan Delhi, mendorong ambisi Babur terhadap India, yang berujung pada pendudukan Mughal atas Lahore pada tahun 930 H/1524 M {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
