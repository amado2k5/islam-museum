label:
  ar: "عماد الدين الأصبهاني يعاين نسخة «تاريخ مدينة دمشق» في سبعين مجلداً، ٥٦٢هـ/١١٦٧م"
  en: "Imad al-Din al-Isfahani sees the Tarikh Madinat Dimashq at seventy volumes, 562/1167"
  ur: "عماد الدین اصفہانی کی «تاريخ مدينہ دمشق» کی ستر جلد والی نسخہ دیکھی، 562ھ/1167ء"
summary:
  ar: "بلغ «تاريخ مدينة دمشق» سنة اثنتين وستين وخمسمائة حين قدم عماد الدين الأصبهاني دمشق سبعين مجلداً كل منها عشرة أجزاء، بعد أن كان سبعة وخمسين مجلداً سنة ٥٤٩هـ؛ وصار الكتاب في تمامه ثمانين مجلداً في ثمانمائة جزء كما يذكر ابنه القاسم، وهو أعظم معجم للتراجم رُتّب على الحروف فافتتح بمن اسمه أحمد {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  en: "By 562/1167, when Imad al-Din came to Damascus, the Tarikh Madinat Dimashq ran to seventy books of ten parts each — up from fifty-seven in 549 — and in its final form it reached eighty volumes of eight hundred parts, as the author's son al-Qasim reports; the vast biographical dictionary is arranged alphabetically, opening with all who bore the name Ahmad {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  ur: "562ھ/1167ء میں جب عماد الدین اصفہانی دمشق آئے تو «تاريخ مدينہ دمشق» ستر جلدوں پر مشتمل تھی — 549ھ میں سنتاون تھی — اور مکمل صورت میں مصنف کے بیٹے قاسم کے بیان کے مطابق اسی جلدیں یعنی آٹھ سو اجزاء ہوئیں؛ یہ عظیم معجمِ تراجم حروفِ تہجی کے ترتیب پر ہے اور احمد نامی اعلام سے شروع ہوتا ہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}۔"
