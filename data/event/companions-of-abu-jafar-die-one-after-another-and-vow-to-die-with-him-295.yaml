id: "event/companions-of-abu-jafar-die-one-after-another-and-vow-to-die-with-him-295"
class: event
kind: other
label:
  ar: "أصحاب أبي جعفر يقتلون واحداً بعد آخر، ويعاهدونه على الموت معه، 295هـ"
  en: "Abu Ja'far's companions die one after another and pledge to die with him, 295 AH, pp. 374-375"
  ur: "ابو جعفر کے ساتھی ایک ایک کر کے شہید ہوتے ہیں اور اس کے ساتھ مرنے کا عہد کرتے ہیں، 295ھ، ص374-375"
  es: "Los compañeros de Abu Ja'far mueren uno tras otro y juran morir con él, 295 AH, pp. 374-375"
summary:
  ar: "برز الواحد بعد الآخر من أصحاب أبي جعفر، منهم ميمون بن محمد المدني وإسحاق بن إبراهيم وإبراهيم بن محمد الخولاني ويوسف بن يعقوب وأحمد بن عبد الله الخولاني، حتى قتلوا. ثم قال أصحابه إنهم لا حياة لهم بعد أصحابهم، وخرجوا خرجة رجل واحد حتى قتلوا جميعاً."
  en: "Abu Ja'far's companions went out one after another and were killed, among them Maymun ibn Muhammad al-Madani, Ishaq ibn Ibrahim, Ibrahim ibn Muhammad of Khawlan, Yusuf ibn Ya'qub, and Ahmad ibn Abdallah of Khawlan. The rest said there was no life left for them after their companions, went out together in one charge, and were all killed."
  ur: "ابو جعفر کے ساتھی ایک ایک کر کے نکلے اور شہید ہوتے گئے، ان میں میمون بن محمد المدنی، اسحاق بن ابراہیم، خولان کے ابراہیم بن محمد، یوسف بن یعقوب اور خولان کے احمد بن عبداللہ شامل تھے۔ باقی ساتھیوں نے کہا کہ اپنے ساتھیوں کے بعد ان کے لیے زندگی نہیں، پھر وہ سب ایک ہی یلغار میں نکلے اور سب شہید ہو گئے۔"
  es: "Los compañeros de Abu Ja'far salieron uno tras otro y fueron asesinados, entre ellos Maymun ibn Muhammad al-Madani, Ishaq ibn Ibrahim, Ibrahim ibn Muhammad de Khawlan, Yusuf ibn Ya'qub y Ahmad ibn Abdallah de Khawlan. El resto, que afirmaba que no les quedaba vida después de sus compañeros, salieron juntos en una carga y fueron asesinados."
