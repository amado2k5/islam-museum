id: event/habasha-spear-play-mosque
class: event
kind: competition
label:
  ar: لعب الحبشة بالحراب في المسجد
  en: The Abyssinians' spear-play in the mosque
  ur: مسجد میں حبشیوں کا نیزہ بازی کا کھیل
  es: "El juego de lanzas de los abisinios en la mezquita"
  fr: "Les combats de lances des Abyssins dans la mosquée"
summary:
  ar: يوم العيد جاء الحبشة يلعبون بحرابهم في مسجد النبي، فأذن لهم، ووقفت عائشة خلف النبي تنظر إليهم حتى ملّت — حديثها في الصحيحين
    {cite:sahih-al-bukhari}.
  en: On the day of Eid the Abyssinians came playing with their spears in the Prophet's mosque; he allowed them, and Aisha
    stood behind him watching until she tired — her report in the two Sahihs {cite:sahih-al-bukhari}.
  ur: عید کے دن حبشی نبی کی مسجد میں نیزوں سے کھیلنے آئے؛ آپ نے انہیں اجازت دی، اور عائشہ آپ کے پیچھے کھڑی ہو کر دیکھتی رہیں
    یہاں تک کہ تھک گئیں — ان کی روایت صحیحین میں {cite:sahih-al-bukhari}۔
  es: "El día del Eid, los abisinios vinieron a jugar con sus lanzas a la mezquita del Profeta; él se lo permitió, y Aisha se quedó detrás de él mirando hasta que se cansó; su relato se encuentra en los dos Sahihs {cite:sahih-al-bukhari}."
  fr: "Le jour de l'Aïd, les Abyssins vinrent jouer avec leurs lances dans la mosquée du Prophète; il les laissa faire, et Aïcha se tint derrière lui à regarder jusqu'à ce qu'elle soit fatiguée — son récit se trouve dans les deux Sahihs {cite:sahih-al-bukhari}."
