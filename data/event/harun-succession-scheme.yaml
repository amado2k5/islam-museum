label: { ar: "قسمة الخلافة بين أبناء الرشيد" }
summary:
  ar: "بايع الرشيد بولاية العهد لابنه محمد سنة خمس وسبعين ومئة ولقبه الأمين وله خمس سنين لحرص أمه زبيدة، ثم بايع لابنه عبد الله من بعده سنة اثنتين وثمانين ولقبه المأمون وولاه ممالك خراسان بأسرها، ثم بايع لابنه القاسم من بعدهما سنة ست وثمانين ولقبه المؤتمن وولاه الجزيرة والثغور وهو صبي، وعلق نسخة البيعة في البيت العتيق، قال الذهبي فكان هذا أول وهن جرى في دولة الإسلام من حيث الإمامة، وقال بعض العقلاء قد ألقى بأسهم بينهم وغائلة ذلك تضر بالرعية، وقيل زوى الرشيد الخلافة عن ولده المعتصم لكونه أمياً فساقها الله إليه وجعل الخلفاء بعده كلهم من ذريته {cite:tarikh-khulafa-minhaj-1434 p. 463-464}."
  en: "Al-Rashid settled the succession on his son Muhammad — titled al-Amin, aged five, at his mother Zubayda's urging — in 175; on Abdallah — al-Ma'mun, with all Khurasan — after him in 182; and on al-Qasim — al-Mu'tamin, with the Jazira and the marches, still a boy — in 186, and hung a copy of the compact in the Ka'ba. Al-Dhahabi calls this the first weakening to enter the Islamic state from the imamate's side; a sage said he had cast enmity between them to the flock's harm. Some add that al-Mu'tasim was passed over for illiteracy — yet God brought him the rule and made all later caliphs his descendants {cite:tarikh-khulafa-minhaj-1434 p. 463-464}."
