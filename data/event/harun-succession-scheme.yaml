id: event/harun-succession-scheme
class: event
kind: declaration
label: { ar: "قسمة الخلافة بين أبناء الرشيد", en: "The Division of the Caliphate among al-Rashid's Sons", es: "La división del califato entre los hijos de al-Rashid", fr: "Le partage du califat entre les fils d'al-Rachid", ur: "راشد کے بیٹوں میں خلافت کی تقسیم" }
summary:
  ar: "بايع الرشيد بولاية العهد لابنه محمد سنة خمس وسبعين ومئة ولقبه الأمين وله خمس سنين لحرص أمه زبيدة، ثم بايع لابنه عبد الله من بعده سنة اثنتين وثمانين ولقبه المأمون وولاه ممالك خراسان بأسرها، ثم بايع لابنه القاسم من بعدهما سنة ست وثمانين ولقبه المؤتمن وولاه الجزيرة والثغور وهو صبي، وعلق نسخة البيعة في البيت العتيق، قال الذهبي فكان هذا أول وهن جرى في دولة الإسلام من حيث الإمامة، وقال بعض العقلاء قد ألقى بأسهم بينهم وغائلة ذلك تضر بالرعية، وقيل زوى الرشيد الخلافة عن ولده المعتصم لكونه أمياً فساقها الله إليه وجعل الخلفاء بعده كلهم من ذريته {cite:tarikh-khulafa-minhaj-1434 p. 463-464}."
  en: "Al-Rashid settled the succession on his son Muhammad — titled al-Amin, aged five, at his mother Zubayda's urging — in 175; on Abdallah — al-Ma'mun, with all Khurasan — after him in 182; and on al-Qasim — al-Mu'tamin, with the Jazira and the marches, still a boy — in 186, and hung a copy of the compact in the Ka'ba. Al-Dhahabi calls this the first weakening to enter the Islamic state from the imamate's side; a sage said he had cast enmity between them to the flock's harm. Some add that al-Mu'tasim was passed over for illiteracy — yet God brought him the rule and made all later caliphs his descendants {cite:tarikh-khulafa-minhaj-1434 p. 463-464}."
  es: "Al-Rashid estableció la sucesión en su hijo Muhammad —titulado al-Amin, de cinco años, a instancias de su madre Zubayda— en 175; en Abdallah —al-Ma'mun, con todo Jorasán— después de él en 182; y en al-Qasim —al-Mu'tamin, con Jazira y las marcas, aún niño— en 186, y colgó una copia del pacto en la Kaaba. Al-Dhahabi considera esto el primer debilitamiento del Estado islámico por parte del imamato; un sabio dijo que había sembrado la enemistad entre ellos para perjuicio de la comunidad. Algunos añaden que al-Mu'tamin fue excluido por analfabetismo; sin embargo, Dios le concedió el gobierno e hizo que todos los califas posteriores fueran sus descendientes {cite:tarikh-khulafa-minhaj-1434 p. 463-464}."
  fr: "En 175, Al-Rashid confia la succession à son fils Muhammad, alors âgé de cinq ans et portant le titre d'al-Amin, à la demande de sa mère Zubayda; puis, en 182, à Abdallah, qui prit le titre d'al-Ma'mun et hérita de tout le Khorasan; et enfin, en 186, à al-Qasim, qui prit le titre d'al-Mu'tamin et hérita de la Jazira et des marches, alors qu'il était encore enfant. Il fit accrocher une copie du pacte dans la Kaaba. Al-Dhahabi considère cet événement comme le premier affaiblissement de l'État islamique du côté de l'imamat; un sage affirma qu'il avait semé la discorde entre eux, au détriment du troupeau. Certains ajoutent qu'al-Mu'tasim fut écarté en raison de son illettrisme; pourtant, Dieu lui confia le pouvoir et fit de tous les califes suivants ses descendants (voir: Tarikh-Khulafa-Minhaj-1434, p. 463-464)."
  ur: "الرشید نے 175 میں اپنی والدہ زبیدہ کے کہنے پر اپنے بیٹے محمد پر جانشینی طے کی - جسے پانچ سال کی عمر میں الامین کا لقب دیا گیا۔ عبداللہ پر - المامون، تمام خراسان کے ساتھ - اس کے بعد 182 میں؛ اور القاسم پر - المطمین، جزیرہ اور مارچوں کے ساتھ، اب بھی ایک لڑکا ہے - 186 میں، اور کعبہ میں کمپیکٹ کی ایک کاپی لٹکا دی۔ الذہبی اسے امامت کی طرف سے اسلامی ریاست میں داخل ہونے کی پہلی کمزوری قرار دیتا ہے۔ ایک بابا نے کہا کہ اس نے ریوڑ کو نقصان پہنچانے کے لیے ان کے درمیان دشمنی کی تھی۔ کچھ کہتے ہیں کہ معتصم کو ناخواندگی کی وجہ سے انتقال کر دیا گیا تھا - پھر بھی خدا نے اسے حکومت لایا اور بعد کے تمام خلفاء کو اس کی اولاد بنایا۔ 463-464}۔"
