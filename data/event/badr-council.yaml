date:
  start: { hijri: "0002-09", calendar: julian, precision: month, status: tradition, note: "قبل الوصول إلى بدر بأيام، إثر وصول الخبر بوادي ذفران (الرحيق ص208)." }
outcome:
  en: "Decision to advance on Badr; the Ansar pledge support outside their own territory."
  ar: "قرار المضي إلى بدر؛ التزام الأنصار بالقتال خارج ديارهم."
significance:
  ar: "تجاوزت بيعة الأنصار في هذا المجلس نصوص العقبة التي لم تكن تلزمهم بالقتال خارج ديارهم (الرحيق ص209)."
