label: { en: "The Badr war council", ar: "المجلس الاستشاري عشية بدر" }
summary:
  en: "The consultative council the Prophet held at Dhi Afran after news of the Quraysh levy reached him, in which the Muslim commanders — and Sa'd ibn Mu'adh speaking for the Ansar — pledged to fight beyond the letter of the Aqaba pledge."
  ar: "مجلس عسكري استشاري عقده النبي بوادي ذي أفران بعدما بلغه خبر العير والنفير؛ تكلم فيه أبو بكر وعمر والمقداد، وأجاب سعد بن معاذ عن الأنصار ببيعة قتال تتجاوز نصوص العقبة."
