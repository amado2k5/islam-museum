label: { en: "The Badr war council", ar: "المجلس الاستشاري عشية بدر", fr: "Le conseil de guerre de Badr", es: "El consejo de guerra de Badr", ur: "بدر جنگی کونسل", tr: "Badr Bayramı arifesinde Danışma Konseyi", id: "Dewan Penasihat menjelang Pertempuran Badr" }
summary:
  en: "The consultative council the Prophet held at Dhi Afran after news of the Quraysh levy reached him, in which the Muslim commanders — and Sa'd ibn Mu'adh speaking for the Ansar — pledged to fight beyond the letter of the Aqaba pledge."
  ar: "مجلس عسكري استشاري عقده النبي بوادي ذي أفران بعدما بلغه خبر العير والنفير؛ تكلم فيه أبو بكر وعمر والمقداد، وأجاب سعد بن معاذ عن الأنصار ببيعة قتال تتجاوز نصوص العقبة."
  fr: "Le conseil consultatif que le Prophète tint à Dhi Afran après avoir appris la levée de Quraysh, au cours duquel les chefs musulmans, et Sa'd ibn Mu'adh au nom des Ansar, s'engagèrent à combattre au-delà de la lettre du serment d'Aqaba."
  es: "El consejo consultivo que el Profeta celebró en Dhi Afran tras recibir la noticia del reclutamiento de los Quraysh, en el que los comandantes musulmanes —y Sa'd ibn Mu'adh, en representación de los Ansar— se comprometieron a luchar más allá de la letra del juramento de Aqaba."
  ur: "قریش کے محصول کی خبر پہنچنے کے بعد نبی نے ذی عفرین میں مشاورتی کونسل کا انعقاد کیا، جس میں مسلم کمانڈروں نے - اور سعد بن معاذ نے انصار کی طرف سے بات کرتے ہوئے - عقبہ کے عہد کے خط سے آگے لڑنے کا عہد کیا۔"
  tr: "Peygamber, kervan ve seferberlik haberini aldıktan sonra Zilhicce Afrane vadisinde bir askeri danışma konseyi topladı; bu konseyde Ebu Bekir, Ömer ve Mikdad konuştu ve Saad bin Muadh, Ensar adına Akabe metinlerinin ötesine geçen bir savaş yemini ile karşılık verdi."
  id: "Sebuah dewan penasihat militer diadakan oleh Nabi di lembah Dhi Afrane setelah beliau menerima kabar tentang kafilah dan mobilisasi; Abu Bakar, Umar, dan Al-Miqdad berbicara di dalamnya, dan Saad bin Muadh menanggapi atas nama kaum Ansar dengan janji perang yang melampaui teks-teks Aqaba."
