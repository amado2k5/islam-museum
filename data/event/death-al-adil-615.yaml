summary:
  ar: "توفي الملك العادل أبو بكر بن أيوب وقد بلغ من العمر عتيا، فملك ولده الكامل مصر والمعظم دمشق والأشرف الجزيرة، وأطاع أكثرهم للكامل وكان أمر الأيوبيين فيه مجتمعًا {cite:kamil-ibn-al-athir p. 393}. وعند سبط ابن الجوزي، وقد شهد دفنه، أنه مرض لما بلغه أخذ الفرنج برج السلسلة بدمياط وتوفي بعالقين يوم الجمعة سابع أو ثامن جمادى الآخرة سنة 615هـ، فكتم المعظم موته وحمله في محفة إلى قلعة دمشق ودفنه فيها، ثم نُقل سنة 619هـ إلى تربته عند دار العقيقي {cite:mirat-al-zaman-risala-2013-v22 p. 231-233}."
  en: "al-Adil died in extreme old age; al-Kamil took Egypt, al-Mu'azzam Damascus, al-Ashraf the Jazira — all deferring to al-Kamil, so the Ayyubid house held together {cite:kamil-ibn-al-athir p. 393}. Sibt ibn al-Jawzi, who was present at the burial, says he fell ill on hearing that the Franks had taken the chain tower of Damietta and died at Aliqin on Friday 7 or 8 Jumada II 615; al-Mu'azzam hid the death, carried him in a litter to the citadel of Damascus and buried him there, and in 619 he was moved to his tomb by the house of al-Aqiqi {cite:mirat-al-zaman-risala-2013-v22 p. 231-233}."
  es: "Al-Adil murió en extrema vejez; Al-Kamil tomó Egipto, Al-Mu'azzam Damasco, Al-Ashraf la Jazira; todos se sometieron a Al-Kamil, por lo que la casa ayubí se mantuvo unida {cite:kamil-ibn-al-athir p. 393}. Sibt ibn al-Jawzi, quien estuvo presente en el entierro, dice que enfermó al enterarse de que los francos habían tomado la torre de la cadena de Damietta y murió en Aliqin el viernes 7 u 8 de Jumada II de 615; Al-Mu'azzam ocultó la muerte, lo llevó en una litera a la ciudadela de Damasco y lo enterró allí, y en 619 fue trasladado a su tumba por la casa de Al-Aqiqi {cite:mirat-al-zaman-risala-2013-v22 p. 231-233}."
  fr: "Al-Adil mourut à un âge très avancé; al-Kamil prit l'Égypte, al-Mu'azzam Damas, al-Ashraf la Jazira – tous se soumettant à al-Kamil, ce qui permit à la maison ayyoubide de rester unie {cite:kamil-ibn-al-athir p. 393}. Sibt ibn al-Jawzi, présent lors des funérailles, raconte qu'il tomba malade en apprenant la prise de la tour de la Chaîne de Damiette par les Francs et mourut à Aliqin le vendredi 7 ou 8 Jumada II 615; al-Mu'azzam dissimula le décès, le transporta en litière jusqu'à la citadelle de Damas et l'y enterra. En 619, sa dépouille fut transférée dans son tombeau par la maison d'al-Aqiqi {cite:mirat-al-zaman-risala-2013-v22 p. 231-233}."
  ur: "العادل انتہائی بڑھاپے میں انتقال کر گئے۔ الکامل نے مصر، المعظم دمشق، الاشرف جزیرہ پر قبضہ کر لیا - یہ سب الکامل کی طرف موخر کرتے ہوئے، چنانچہ ایوبی گھر نے اکٹھا رکھا۔ 393}۔ سبط ابن الجوزی، جو تدفین کے وقت موجود تھے، کہتے ہیں کہ وہ یہ سن کر بیمار ہو گئے کہ فرینکوں نے دمیتا کے زنجیر کے مینار پر قبضہ کر لیا ہے اور جمعہ 7 یا 8 جمادی الثانی 615 کو علیقین میں انتقال کر گئے ہیں۔ المعظم نے موت کو چھپایا، اسے ایک کوڑے میں ڈال کر دمشق کے قلعہ میں دفن کیا اور 619 میں اسے العقیقی کے گھر سے ان کے مقبرے میں منتقل کیا گیا۔ 231-233}۔"
  tr: "El-Malik el-Adil Ebu Bekir ibn Eyyub ileri yaşta vefat etti. Oğlu el-Kamil Mısır'ı, el-Mu'azzam Şam'ı ve el-Eşref Cezire'yi yönetti. Çoğu el-Kamil'e itaat etti ve Eyyubi işleri onun yönetimi altında birleşti. {kaynak: Kamil ibn el-Atir s. 393}. Cenaze törenine şahit olan Sibt İbn el-Cevzi'ye göre, Frankların Dimyat'taki Zincir Kulesi'ni ele geçirdiğini öğrenince hastalandı. Hicri 615 yılında Cemâde el-Ahirah'ın yedinci veya sekizinci Cuma günü Alaqin'de vefat etti. El-Mu'azzam ölümünü gizledi ve onu bir sedyeyle Şam Kalesi'ne taşıyarak oraya defnetti. Daha sonra, Hicri 619 yılında Dar el-Akiki yakınlarındaki türbesine nakledildi. {cite:mirat-al-zaman-risala-2013-v22 s. 231-233}."
  id: "Al-Malik al-Adil Abu Bakr ibn Ayyub meninggal pada usia lanjut. Putranya, al-Kamil, memerintah Mesir, al-Mu'azzam memerintah Damaskus, dan al-Ashraf memerintah al-Jazira. Sebagian besar dari mereka mematuhi al-Kamil, dan urusan Ayyubiyah disatukan di bawah kepemimpinannya. {cite:kamil-ibn-al-athir hlm. 393}. Menurut Sibt Ibn al-Jawzi, yang menyaksikan pemakamannya, ia jatuh sakit ketika mengetahui bahwa kaum Frank telah merebut Menara Rantai di Damietta. Ia meninggal di Alaqin pada hari Jumat, tanggal tujuh atau delapan Jumada al-Akhirah tahun 615 H. Al-Mu'azzam menyembunyikan kematiannya dan membawanya dengan tandu ke Benteng Damaskus dan menguburkannya di sana. Kemudian, pada tahun 619 H, jenazahnya dipindahkan ke makamnya di dekat Dar al-Aqiqi. {mengutip:mirat-al-zaman-risala-2013-v22 hal. 231-233}."
