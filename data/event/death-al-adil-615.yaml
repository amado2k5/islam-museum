date:
  start: { edtf: "1218-08-30/1218-08-31", hijri: "0615-06-07", calendar: julian, precision: day, status: debated, derived: true, note: "«وأقام مريضاً إلى يوم الجُمُعة إلى سابع أو ثامن جُمادى الآخرة، فتوفي بعالقين» (مرآة الزمان 22/231)؛ والسنة 615 عند ابن الأثير (الكامل ص393). التحويل الميلادي مشتق تقريبي.", sources: [source/mirat-al-zaman-risala-2013-v22, source/kamil-ibn-al-athir] }
summary:
  ar: "توفي الملك العادل أبو بكر بن أيوب وقد بلغ من العمر عتيا، فملك ولده الكامل مصر والمعظم دمشق والأشرف الجزيرة، وأطاع أكثرهم للكامل وكان أمر الأيوبيين فيه مجتمعًا {cite:kamil-ibn-al-athir p. 393}. وعند سبط ابن الجوزي، وقد شهد دفنه، أنه مرض لما بلغه أخذ الفرنج برج السلسلة بدمياط وتوفي بعالقين يوم الجمعة سابع أو ثامن جمادى الآخرة سنة 615هـ، فكتم المعظم موته وحمله في محفة إلى قلعة دمشق ودفنه فيها، ثم نُقل سنة 619هـ إلى تربته عند دار العقيقي {cite:mirat-al-zaman-risala-2013-v22 p. 231-233}."
  en: "al-Adil died in extreme old age; al-Kamil took Egypt, al-Mu'azzam Damascus, al-Ashraf the Jazira — all deferring to al-Kamil, so the Ayyubid house held together {cite:kamil-ibn-al-athir p. 393}. Sibt ibn al-Jawzi, who was present at the burial, says he fell ill on hearing that the Franks had taken the chain tower of Damietta and died at Aliqin on Friday 7 or 8 Jumada II 615; al-Mu'azzam hid the death, carried him in a litter to the citadel of Damascus and buried him there, and in 619 he was moved to his tomb by the house of al-Aqiqi {cite:mirat-al-zaman-risala-2013-v22 p. 231-233}."
