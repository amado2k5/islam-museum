summary:
  ar: "انطلق الأسطول العثماني بقيادة خير الدين بعد خلعته بخلعة الوزارة في حلب، فدخل عنابة وتزود بالإمدادات ثم تقدم نحو بنزرت واتجه إلى حلق الواد فتمكن منها بلا صعوبة، واستقبله الخطباء والعلماء، وهرب السلطان الحفصي الحسن بن محمد إلى أسبانيا، وعين خير الدين أخاه الأمير الرشيد على تونس وأعلن ضمها للأملاك العثمانية، في وقت بدت فيه السيادة العثمانية في حوض البحر المتوسط الغربي {cite:dawlat-uthmaniyya-salabi p. 218}."
  en: "After receiving the vizier's robe at Aleppo, Khayr al-Din's fleet took Bizerte and La Goulette unopposed; the Hafsid sultan al-Hasan b. Muhammad fled to Spain, and Khayr al-Din installed his brother al-Rashid and declared Tunis annexed to the Ottoman dominions {cite:dawlat-uthmaniyya-salabi p. 218}."
