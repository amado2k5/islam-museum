id: event/conquest-of-tunis-1534
class: event
kind: conquest
label: { ar: "دخول خير الدين بربروسة تونس ⁦(١٥٣٤م)⁩", en: "Khayr al-Din takes Tunis (1534)", es: "Khayr al-Din toma Túnez (1534)", fr: "Khayr al-Din prend Tunis (1534)", ur: "خیر الدین نے تیونس لیا (1534)", tr: "Khair ad-Din Barbarossa'nın Tunus'a girişi (1534 MS)", id: "Masuknya Khair ad-Din Barbarossa ke Tunis (1534 M)" }
summary:
  ar: "انطلق الأسطول العثماني بقيادة خير الدين بعد خلعته بخلعة الوزارة في حلب، فدخل عنابة وتزود بالإمدادات ثم تقدم نحو بنزرت واتجه إلى حلق الواد فتمكن منها بلا صعوبة، واستقبله الخطباء والعلماء، وهرب السلطان الحفصي الحسن بن محمد إلى أسبانيا، وعين خير الدين أخاه الأمير الرشيد على تونس وأعلن ضمها للأملاك العثمانية، في وقت بدت فيه السيادة العثمانية في حوض البحر المتوسط الغربي {cite:dawlat-uthmaniyya-salabi p. 218}."
  en: "After receiving the vizier's robe at Aleppo, Khayr al-Din's fleet took Bizerte and La Goulette unopposed; the Hafsid sultan al-Hasan b. Muhammad fled to Spain, and Khayr al-Din installed his brother al-Rashid and declared Tunis annexed to the Ottoman dominions {cite:dawlat-uthmaniyya-salabi p. 218}."
  es: "Tras recibir la túnica de visir en Alepo, la flota de Khayr al-Din tomó Bizerta y La Goulette sin oposición; el sultán hafsí al-Hasan b. Muhammad huyó a España, y Khayr al-Din instaló a su hermano al-Rashid y declaró Túnez anexado a los dominios otomanos {cite:dawlat-uthmaniyya-salabi p. 218}."
  fr: "Après avoir reçu la robe de vizir à Alep, la flotte de Khayr al-Din prit Bizerte et La Goulette sans rencontrer de résistance; le sultan hafside al-Hasan b. Muhammad s'enfuit en Espagne, et Khayr al-Din installa son frère al-Rashid et déclara Tunis annexée aux domaines ottomans {cite:dawlat-uthmaniyya-salabi p. 218}."
  ur: "حلب میں وزیر کا لباس حاصل کرنے کے بعد، خیرالدین کے بحری بیڑے نے Bizerte اور La Goulette کو بلا مقابلہ لے لیا۔ حفصید سلطان الحسن بی۔ محمد اسپین بھاگ گیا، اور خیرالدین نے اپنے بھائی الرشید کو بٹھایا اور تیونس کو عثمانی سلطنت کے ساتھ الحاق کا اعلان کر دیا۔ 218}۔"
  tr: "Hayr ad-Din'in Halep'te vezir unvanıyla görevden alınmasının ardından, onun önderliğindeki Osmanlı donanması yola çıktı. Annaba'ya girip ikmal yaptıktan sonra Bizerte'ye doğru ilerledi ve Halq al-Wadi'ye yöneldi; burayı da zorlanmadan ele geçirdi. Vaizler ve alimler tarafından karşılandı. Hafsid Sultanı Hasan ibn Muhammed İspanya'ya kaçtı. Hayr ad-Din, kardeşi Prens Raşid'i Tunus'un başına atadı ve Osmanlı egemenliğinin Batı Akdeniz havzasında ortaya çıktığı bir dönemde Tunus'u Osmanlı topraklarına ilhak etti. {cite:dawlat-uthmaniyya-salabi s. 218}"
  id: "Armada Ottoman, yang dipimpin oleh Khayr ad-Din, berangkat setelah ia dicopot dari jabatannya sebagai wazir di Aleppo. Ia memasuki Annaba dan mengisi kembali persediaan, kemudian maju menuju Bizerte dan menuju Halq al-Wadi, yang direbutnya tanpa kesulitan. Ia disambut oleh para pendakwah dan ulama. Sultan Hafsid, Hassan ibn Muhammad, melarikan diri ke Spanyol. Khayr ad-Din menunjuk saudaranya, Pangeran Rashid, sebagai penguasa Tunisia dan menyatakan aneksasi wilayah tersebut ke wilayah Ottoman, pada saat kedaulatan Ottoman tampak di cekungan Mediterania barat. {cite:dawlat-uthmaniyya-salabi p. 218}."
