label:
  ar: "تدريس ابن رجب في مدارس دمشق ومجالس وعظه، نحو ٧٧٥هـ فصاعداً"
  en: "Ibn Rajab's teaching posts in Damascus and his preaching sessions, c. 775 onward"
  ur: "دمشق کی مدارس میں ابن رجب کا تدرس اور وعظ کے مجالس، تقریباً 775ھ سے آگے"
summary:
  ar: "درّس ابن رجب بدمشق في المدرسة الحنبلية والشريفية والعمرية الشيخية وفي التربة العزية، وكان يسكن بالمدرسة السكرية بالقصاعين؛ وقال ابن العماد: كانت مجالس تذكيره للقلوب صارعة وللناس عامة مباركة نافعة، اجتمعت الفرق عليه {cite:encyclopaedia-of-islam-2 vol. 3 p. 934} {cite:ibn-rajab-jami-ulum-hikam p. 14}."
  en: "Ibn Rajab taught in Damascus in the madrasas al-Hanbaliyya, al-Sharifiyya and al-'Umariyya al-Shaykhiyya, and in al-Turba al-'Izziyya, and he lived at al-Madrasa al-Sukkariyya at al-Qusa'in; Ibn al-Imad says his sessions of counsel broke hearts and benefited the public, and every faction gathered around him {cite:encyclopaedia-of-islam-2 vol. 3 p. 934} {cite:ibn-rajab-jami-ulum-hikam p. 14}."
  ur: "ابن رجب نے دمشق میں حنبلیہ، شریفیہ اور عمریہ شیخیہ مدارس اور تربہ عزیہ میں تدریس کی، اور وہ قصاعین میں سکریہ مدرسہ میں مقیم تھے؛ ابن العماد کہتے ہیں کہ ان کے وعظ دلوں کو توڑ دیتے تھے اور عام لوگوں کے لیے مبارک و مفید تھے اور ہر فرقہ ان کے گرد جمع ہوتا تھا {cite:encyclopaedia-of-islam-2 vol. 3 p. 934} {cite:ibn-rajab-jami-ulum-hikam p. 14}۔"
