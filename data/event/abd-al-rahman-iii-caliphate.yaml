label: { ar: "تلقب عبد الرحمن الناصر بأمير المؤمنين", en: "Abd al-Rahman al-Nasir Takes the Title Commander of the Faithful", fr: "Abd al-Rahman al-Nasir prend le titre de Commandeur des croyants", es: "Abd al-Rahman al-Nasir asume el título de Comandante de los Creyentes.", ur: "عبدالرحمن الناصر نے وفاداروں کے کمانڈر کا لقب اختیار کیا۔" }
summary:
  ar: "لما ضعف أمر الأمة ووهت أركان الدولة العباسية وتغلبت القرامطة والمبتدعة على الأقاليم قويت همة صاحب الأندلس الأمير عبد الرحمن بن محمد الأموي المرواني وقال أنا أولى الناس بالخلافة وتسمى بأمير المؤمنين الناصر لدين الله واستولى على أكثر الأندلس وكانت له الهيبة الزائدة والجهاد والغزو والسيرة المحمودة استأصل المتغلبين وفتح سبعين حصناً فصار المسمون بأمير المؤمنين في الدنيا ثلاثة العباسي ببغداد وهذا بالأندلس والمهدي بالقيروان {cite:tarikh-khulafa-minhaj-1434 p. 605}."
  en: "When the umma's affairs weakened, the Abbasid pillars tottered and the Qarmatians and innovators overran the provinces, the Andalusian amir Abd al-Rahman ibn Muhammad the Umayyad grew resolute: 'I am the worthiest of the caliphate' — he styled himself amir al-mu'minin al-Nasir li-Din Allah, mastered most of al-Andalus, rooted out the usurpers and took seventy fortresses. Now there were three men in the world called amir al-mu'minin: the Abbasid in Baghdad, this one in al-Andalus, and the Mahdi at Qayrawan {cite:tarikh-khulafa-minhaj-1434 p. 605}."
  fr: "Alors que les affaires de la communauté s’affaiblissaient, que les piliers abbassides vacillaient et que les Qarmates et les innovateurs envahissaient les provinces, l’émir andalou omeyyade Abd al-Rahman ibn Muhammad s’affermit : « Je suis le plus digne du califat ». Il prit le titre d’amir al-mu'minin al-Nasir li-Din Allah, domina la majeure partie d’al-Andalus, élimina les usurpateurs et prit soixante-dix forteresses. Trois hommes étaient désormais appelés amir al-mu'minin dans le monde : l’Abbasside à Bagdad, celui-ci en al-Andalus et le Mahdi à Kairouan {cite:tarikh-khulafa-minhaj-1434 p. 605}."
  es: "Cuando los asuntos de la umma se debilitaron, los pilares abasíes se tambalearon y los cármatas e innovadores invadieron las provincias, el emir andalusí Abd al-Rahman ibn Muhammad el Omeya se mostró resuelto: «Soy el más digno del califato». Se autodenominó amir al-mu'minin al-Nasir li-Din Allah, dominó la mayor parte de al-Ándalus, expulsó a los usurpadores y tomó setenta fortalezas. Ahora bien, había tres hombres en el mundo llamados amir al-mu'minin: el abasí en Bagdad, este en al-Ándalus y el Mahdi en Qayrawan {cite:tarikh-khulafa-minhaj-1434 p. 605}."
  ur: "جب امت کے معاملات کمزور پڑ گئے، عباسی ستون ٹوٹ گئے اور قرامطیوں اور اختراعیوں نے صوبوں پر قبضہ کر لیا تو اندلس کے امیر عبدالرحمٰن بن محمد بن امیہ نے پختہ عزم کیا: 'میں خلافت کا سب سے زیادہ حقدار ہوں' - اس نے اپنے آپ کو سب سے زیادہ امیر المومنین المومنین علی المرتضیٰ کا روپ دھارا۔ اندلس نے غاصبوں کو جڑ سے اکھاڑ پھینکا اور ستر قلعے لے لیے۔ اب دنیا میں تین آدمی تھے جنہیں امیر المومنین کہا جاتا تھا: بغداد میں عباسی، یہ اندلس میں اور مہدی قیروان میں۔ 605}۔"
