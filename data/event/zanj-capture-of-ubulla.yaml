summary:
  ar: "في سنة ست وخمسين ومائتين دخل الزنج الأبلة في رجب {cite:tabari-tarikh-abu-al-fadl j.9 p.471}، ثم استسلم أهل عبادان لصاحب الزنج {cite:tabari-tarikh-abu-al-fadl j.9 p.472}."
  en: "In 256 the Zanj entered al-Ubulla in Rajab {cite:tabari-tarikh-abu-al-fadl j.9 p.471}, and then the people of Abbadan submitted to the Zanj leader {cite:tabari-tarikh-abu-al-fadl j.9 p.472}."
  es: "En 256, los Zanj entraron en al-Ubulla en Rajab {cite:tabari-tarikh-abu-al-fadl j.9 p.471}, y entonces la gente de Abbadan se sometió al líder Zanj {cite:tabari-tarikh-abu-al-fadl j.9 p.472}."
  fr: "En 256, les Zanj entrèrent à al-Ubulla en Rajab {cite:tabari-tarikh-abu-al-fadl j.9 p.471}, puis les habitants d'Abbadan se soumirent au chef Zanj {cite:tabari-tarikh-abu-al-fadl j.9 p.472}."
  ur: "256 میں زنج رجب میں الابلہ میں داخل ہوا {حوالہ:طبری-تاریخ-ابو الفضل ج.9 ص471}، اور پھر عبادان کے لوگوں نے زنج کے سردار کے پاس عرض کیا {حوالہ:طبری-تاریخ-ابو الفضل ج.9 ص472}۔"
