summary:
  ar: "فتح الريّ: خرج الزينبي أبو الفرخان من الريّ فلقي نعيمًا طالبًا الصلح مخالفًا لملك الريّ سياوخش بن مهران بن بهرام جوبين، فاستمد سياوخش أهل دنباوند وطبرستان وقومس وجرجان فأمدّوه خوفًا من المسلمين فالتقوا في سفح جبل الريّ. قال الزينبي لنعيم: القوم كثير وأنت في قلة فابعث معي خيلًا أدخل بهم مدينتهم من مدخل لا يشعرون به وناهدهم أنت فإنهم إذا خرجنا عليهم لم يثبتوا لك، فأدخلهم الزينبي ليلًا على ابن أخيه المنذر بن عمرو ولا يشعر القوم، وبيّتهم نعيم فشغلهم عن مدينتهم حتى سمعوا التكبير من ورائهم فانهزموا فقُتلوا مقتلة عدّوا بالقصب، وأفاء الله على المسلمين بالريّ نحوًا مما في المدائن، وأخرب نعيم المدينة العتيقة وأمر الزينبي فبنى مدينة الريّ الحدثى ولم يزل شرف الريّ في أهل الزينبي {cite:kamil-ibn-al-athir p. 407-408}."
  en: "Rayy fell by stratagem: al-Zaynabi Abu'l-Farrakhan defected from its marzban Siyawakhsh and offered to lead a cavalry detachment through a gate the defenders could not see; al-Mundhir ibn 'Amr's horse was slipped in by night, Nu'aym fixed the allied host before the walls, and when the takbir rose behind them the Persian line dissolved — the dead were counted with fathoms. The plunder rivaled al-Mada'in's; Nu'aym razed the old city and had al-Zaynabi build «New Rayy,« whose sheriffship stayed in his family {cite:kamil-ibn-al-athir p. 407-408}."
