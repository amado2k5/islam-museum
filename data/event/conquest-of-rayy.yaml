summary:
  ar: "فتح الريّ: خرج الزينبي أبو الفرخان من الريّ فلقي نعيمًا طالبًا الصلح مخالفًا لملك الريّ سياوخش بن مهران بن بهرام جوبين، فاستمد سياوخش أهل دنباوند وطبرستان وقومس وجرجان فأمدّوه خوفًا من المسلمين فالتقوا في سفح جبل الريّ. قال الزينبي لنعيم: القوم كثير وأنت في قلة فابعث معي خيلًا أدخل بهم مدينتهم من مدخل لا يشعرون به وناهدهم أنت فإنهم إذا خرجنا عليهم لم يثبتوا لك، فأدخلهم الزينبي ليلًا على ابن أخيه المنذر بن عمرو ولا يشعر القوم، وبيّتهم نعيم فشغلهم عن مدينتهم حتى سمعوا التكبير من ورائهم فانهزموا فقُتلوا مقتلة عدّوا بالقصب، وأفاء الله على المسلمين بالريّ نحوًا مما في المدائن، وأخرب نعيم المدينة العتيقة وأمر الزينبي فبنى مدينة الريّ الحدثى ولم يزل شرف الريّ في أهل الزينبي {cite:kamil-ibn-al-athir p. 407-408}."
  en: "Rayy fell by stratagem: al-Zaynabi Abu'l-Farrakhan defected from its marzban Siyawakhsh and offered to lead a cavalry detachment through a gate the defenders could not see; al-Mundhir ibn 'Amr's horse was slipped in by night, Nu'aym fixed the allied host before the walls, and when the takbir rose behind them the Persian line dissolved — the dead were counted with fathoms. The plunder rivaled al-Mada'in's; Nu'aym razed the old city and had al-Zaynabi build «New Rayy,« whose sheriffship stayed in his family {cite:kamil-ibn-al-athir p. 407-408}."
  es: "Rayy cayó por estratagema: al-Zaynabi Abu'l-Farrakhan desertó de su marzban Siyawakhsh y se ofreció a guiar un destacamento de caballería a través de una puerta que los defensores no podían ver; el caballo de al-Mundhir ibn 'Amr fue introducido de noche, Nu'aym colocó al ejército aliado frente a las murallas, y cuando el takbir se alzó tras ellos, la línea persa se disolvió; los muertos fueron contados por brazas. El saqueo rivalizó con el de al-Mada'in; Nu'aym arrasó la ciudad vieja e hizo que al-Zaynabi construyera «Nueva Rayy», cuyo cargo de sheriff permaneció en su familia {cite:kamil-ibn-al-athir p. 407-408}."
  fr: "Rayy tomba par ruse: al-Zaynabi Abu'l-Farrakhan fit défection de son marzban Siyawakhsh et proposa de mener un détachement de cavalerie par une porte invisible aux défenseurs; la cavalerie d'al-Mundhir ibn 'Amr fut introduite de nuit, Nu'aym positionna les troupes alliées devant les remparts, et lorsque le takbir retentit derrière eux, la ligne perse se dispersa – les morts furent comptés en brasses. Le pillage rivalisa avec celui d'al-Mada'in; Nu'aym rasa la vieille ville et chargea al-Zaynabi de construire « Nouvelle Rayy », dont la charge de shérif resta dans sa famille (voir: Kamil ibn al-Athir, p. 407-408)."
  ur: "رے تدبیر سے گرا: الزینبی ابوالفرقان اپنے مرزبان سیوخش سے منحرف ہو گیا اور اس دروازے سے گھڑسوار دستے کی قیادت کرنے کی پیشکش کی جسے محافظ نہیں دیکھ سکتے تھے۔ المنذر بن عمرو کا گھوڑا رات کو پھسل گیا، نعیم نے اتحادی لشکر کو دیواروں کے آگے کھڑا کر دیا، اور جب تکبیر ان کے پیچھے اٹھی تو فارسی کی لکیر تحلیل ہو گئی- مرنے والوں کا شمار فتوحات کے ساتھ کیا گیا۔ لوٹ مار نے المدائن کا مقابلہ کیا۔ نعیم نے پرانے شہر کو مسمار کر دیا اور زینبی کو \"نئی رے\" تعمیر کروائی، جس کی شیرف شپ ان کے خاندان میں رہی۔ 407-408}۔"
  tr: "Rayy'ın Fethi: Zeynebî Ebu el-Farhan, Rayy'dan ayrılıp Nuaym ile buluştu; barış arayışında olan bu kişi, Rayy hükümdarı Siyawkhsh ibn Mihran ibn Bahram Jubin'e karşıydı. Siyawkhsh, Dunbawand, Tabaristan, Kumis ve Jurjan halkından takviye istedi ve onlar da Müslümanlardan korktukları için ona yardım ettiler. Rayy Dağı'nın eteğinde buluştular. Zeynebî Nuaym'a şöyle dedi: \"Düşman çok, siz azsınız. Benimle birlikte süvari gönderin ki, fark etmeyecekleri bir girişten şehirlerine gireyim ve siz de onlarla çatışmaya girin. Eğer onlara saldırırsak, size karşı koyamayacaklar.\" Zeynebî, geceleyin düşmanın fark etmemesi için onları yeğeni el-Mundhir ibn Amr'ın yanına götürdü. Nuaym onlara pusu kurarak, arkalarından tekbir (Allahu Ekber) duyana kadar şehirlerinden uzaklaştırdı. Kaçtılar ve öyle büyük bir katliamda yok edildiler ki, kamışlar arasında sayıldılar. Allah, Rayy'daki Müslümanlara Ktesifon'unkine benzer bir pay verdi. Nu'aym eski şehri yıktı ve Zeynep'e Rayy'ın modern şehrini inşa etmesini emretti. Rayy'ın itibarı Zeynep'in soyundan gelenlerde kaldı. {kaynak: Kamil İbn el-Athir s. 407-408}"
  id: "Penaklukan Rayy: Zaynabi Abu al-Farkhan meninggalkan Rayy dan bertemu Nu'aym, mencari perdamaian, dalam penentangan terhadap penguasa Rayy, Siyawkhsh ibn Mihran ibn Bahram Jubin. Siyawkhsh meminta bala bantuan dari penduduk Dunbawand, Tabaristan, Qumis, dan Jurjan, yang membantunya karena takut kepada kaum Muslim. Mereka bertemu di kaki Gunung Rayy. Zaynabi berkata kepada Nu'aym: \"Musuh banyak, dan kamu sedikit. Kirimkan pasukan berkuda bersamaku agar aku dapat memasuki kota mereka melalui pintu masuk yang tidak akan mereka sadari, dan kamu dapat melawan mereka. Jika kita menyerang mereka, mereka tidak akan mampu melawanmu.\" Zaynabi memimpin mereka pada malam hari kepada keponakannya, al-Mundhir ibn Amr, tanpa diketahui musuh. Nu'aym menyergap mereka, mengalihkan perhatian mereka dari kota mereka sampai mereka mendengar takbir (Allahu Akbar) di belakang mereka. Mereka melarikan diri dan dibantai dalam pembantaian yang begitu besar sehingga mereka dihitung di antara alang-alang. Allah menganugerahkan kepada kaum Muslim di Rayy bagian yang serupa dengan yang diterima Ctesiphon. Nu'aym menghancurkan kota tua dan memerintahkan Zaynabi untuk membangun kota Rayy modern. Kejayaan Rayy tetap berada di tangan keturunan Zaynabi. {cite:kamil-ibn-al-athir p. 407-408}"
