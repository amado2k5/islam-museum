id: event/conquest-of-cordoba-92
class: event
kind: conquest
label: { ar: "فتح قرطبة", en: "Conquest of Cordoba", es: "Conquista de Córdoba", fr: "Conquête de Cordoue", ur: "قرطبہ کی فتح", tr: "Kurtuba'nın Fethi", id: "Penaklukan Cordoba" }
summary:
  ar: "بعث طارق بن زياد مغيثاً الرومي إلى قرطبة في سبعمائة فارس، فدله راعي غنم على ثغرة في السور تعلقوا بها من شجرة تين بعد أن أرسل الله رذاذاً أخفى دقدقة حوافر الخيل، فكسروا أقفال الباب وملكوا المدينة عنوة، وتحصن ملكها في كنيسة بغربيها حتى قطع المسلمون عنها قناة الماء ففر فأدركه مغيث قرب تطليرة {cite:nafh-tib-maqqari p. 297-299}."
  en: "Tariq's lieutenant Mughith al-Rumi took Cordoba in 92 by a wall-breach a shepherd showed him — a fig tree for scaling and a heaven-sent drizzle masking the hooves — and captured its fleeing lord near Tatlira {cite:nafh-tib-maqqari p. 297-299}."
  es: "El lugarteniente de Tariq, Mughith al-Rumi, tomó Córdoba en el año 92 por una brecha en la muralla que le mostró un pastor —una higuera para escalar y una llovizna enviada por el cielo que ocultaba las pezuñas— y capturó a su señor fugitivo cerca de Tatlira {cite:nafh-tib-maqqari p. 297-299}."
  fr: "Le lieutenant de Tariq, Mughith al-Rumi, prit Cordoue en 92 par une brèche dans un mur qu'un berger lui avait montrée — un figuier pour l'escalader et une bruine envoyée par le ciel masquant les sabots — et captura son seigneur en fuite près de Tatlira {cite:nafh-tib-maqqari p. 297-299}."
  ur: "طارق کے لیفٹیننٹ مغیث الرومی نے 92 میں قرطبہ کو دیوار کی توڑ پھوڑ کے ذریعے لے لیا جس میں ایک چرواہے نے اسے دکھایا - ایک انجیر کا درخت جس نے کھروں کو چھپا رکھا تھا اور آسمان سے بھیجی گئی بوندا باندی نے تتلیرا کے قریب اس کے بھاگنے والے مالک کو پکڑ لیا۔ 297-299}۔"
  tr: "Tarık ibn Ziyad, Muğit el-Rumi'yi yedi yüz süvariyle Kurtuba'ya gönderdi. Bir çoban ona surda bir gedik gösterdi ve Allah'ın gönderdiği hafif yağmur atların toynaklarının sesini gizledikten sonra bir incir ağacına tutundular. Kapının kilitlerini kırdılar ve şehri zorla ele geçirdiler. Kral, Müslümanlar su kaynağını kesene kadar şehrin batısındaki bir kilisede kendini tahkim etti. Kaçtı ve Muğit onu Talira yakınlarında yakaladı. {kaynak:nafh-tib-maqqari s. 297-299}"
  id: "Tariq ibn Ziyad mengutus Mughith al-Rumi ke Cordoba dengan tujuh ratus penunggang kuda. Seorang gembala menunjukkan kepadanya celah di tembok, dan mereka berpegangan pada pohon ara setelah Allah mengirimkan gerimis yang menyembunyikan suara derap kaki kuda. Mereka mendobrak kunci gerbang dan menguasai kota dengan paksa. Rajanya membentengi diri di sebuah gereja di sebelah barat kota sampai kaum Muslim memutus pasokan airnya. Ia melarikan diri, dan Mughith menyusulnya di dekat Talira. {cite:nafh-tib-maqqari p. 297-299}"
