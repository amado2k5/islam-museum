label:
  ar: ملحمة تينملل وقطع دابر بني عبد المؤمن
  en: The Tinmel massacre — end of Banu Abd al-Mu'min
summary:
  ar: "في سنة أربع وسبعين وستمائة صمد فل بني عبد المؤمن إلى جبل تينملل جرثومة أمرهم ودار إمامهم ومسجد مهديهم، وقد بايعوا إسمحاق أخا عمر المرتضى سنة 669هـ، فأوقع بهم محمد بن علي بن محلى عامل السلطان أبي يوسف على أعمال مراكش واقتحم الجبل عنوة وقتل خليفتهم المستضعف ووزيرهم ابن عطوش في جوانب الملحمة، وضربت أعناق من قبض عليهم بمراكش وصلبت أشلاؤهم، وبعثرت قبور الخلفاء من بني عبد المؤمن واستخرج شلو يوسف وابنه يعقوب المنصور فقطعت رؤوسهم، وتولى كبر ذلك أبو علي الملياني الذي كان السلطان أقطعه بلاد أغمات فنكرها السلطان لجلاله وتجاوز عنها تأنيساً لقربته، وانقطعت دابر بني عبد المؤمن."
  en: "In 674 the Almohad remnant, who had sworn to Ishaq brother of Umar al-Murtada in 669, stood to their last refuge at Mount Tinmel — cradle of their da'wa, their imam's house and their Mahdi's mosque; Muhammad ibn Ali ibn Mahalla, Abu Yusuf's governor of Marrakesh, stormed the height, killed their puppet caliph and the vizier Ibn Attush in the battle, beheaded and crucified the captives at Marrakesh, scattered the Almohad caliphs' tombs and exhumed the bodies of Yusuf and his son Ya'qub al-Mansur to cut off their heads — the work of Abu Ali al-Milyani whom the sultan had enfeoffed with Aghmat; the sultan disowned the deed for its enormity yet pardoned it for the man's fealty — and the seed of Banu Abd al-Mu'min was cut off."
