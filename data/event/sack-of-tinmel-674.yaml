id: event/sack-of-tinmel-674
class: event
kind: massacre
label:
  ar: ملحمة تينملل وقطع دابر بني عبد المؤمن
  en: The Tinmel massacre — end of Banu Abd al-Mu'min
  es: "La masacre de Tinmel: el fin de Banu Abd al-Mu'min."
  fr: "Le massacre de Tinmel — la fin des Banu Abd al-Mu'min"
  ur: "تنمل کا قتل عام - بنو عبد المومن کا خاتمہ"
  tr: "Tinmel Destanı ve Abdülmümin'in Soyundan Gelenlerin Yok Edilmesi"
  id: "Kisah epik Tinmel dan pemusnahan keturunan Abd al-Mu'min"
summary:
  ar: "في سنة أربع وسبعين وستمائة صمد فل بني عبد المؤمن إلى جبل تينملل جرثومة أمرهم ودار إمامهم ومسجد مهديهم، وقد بايعوا إسمحاق أخا عمر المرتضى سنة 669هـ، فأوقع بهم محمد بن علي بن محلى عامل السلطان أبي يوسف على أعمال مراكش واقتحم الجبل عنوة وقتل خليفتهم المستضعف ووزيرهم ابن عطوش في جوانب الملحمة، وضربت أعناق من قبض عليهم بمراكش وصلبت أشلاؤهم، وبعثرت قبور الخلفاء من بني عبد المؤمن واستخرج شلو يوسف وابنه يعقوب المنصور فقطعت رؤوسهم، وتولى كبر ذلك أبو علي الملياني الذي كان السلطان أقطعه بلاد أغمات فنكرها السلطان لجلاله وتجاوز عنها تأنيساً لقربته، وانقطعت دابر بني عبد المؤمن."
  en: "In 674 the Almohad remnant, who had sworn to Ishaq brother of Umar al-Murtada in 669, stood to their last refuge at Mount Tinmel — cradle of their da'wa, their imam's house and their Mahdi's mosque; Muhammad ibn Ali ibn Mahalla, Abu Yusuf's governor of Marrakesh, stormed the height, killed their puppet caliph and the vizier Ibn Attush in the battle, beheaded and crucified the captives at Marrakesh, scattered the Almohad caliphs' tombs and exhumed the bodies of Yusuf and his son Ya'qub al-Mansur to cut off their heads — the work of Abu Ali al-Milyani whom the sultan had enfeoffed with Aghmat; the sultan disowned the deed for its enormity yet pardoned it for the man's fealty — and the seed of Banu Abd al-Mu'min was cut off."
  es: "En 674, el remanente almohade, que había jurado lealtad a Ishaq, hermano de Umar al-Murtada, en 669, se refugió en el monte Tinmel, cuna de su da'wa, casa de su imán y mezquita de su Mahdi; Muhammad ibn Ali ibn Mahalla, gobernador de Marrakech por Abu Yusuf, asaltó la cima, mató a su califa títere y al visir Ibn Attush en la batalla, decapitó y crucificó a los cautivos en Marrakech, profanó las tumbas de los califas almohades y exhumó los cuerpos de Yusuf y su hijo Ya'qub al-Mansur para cortarles la cabeza, obra de Abu Ali al-Milyani, a quien el sultán había otorgado el título de Aghmat; El sultán desautorizó el acto por su enormidad, pero lo perdonó por la lealtad del hombre, y así se extinguió la descendencia de Banu Abd al-Mu'min."
  fr: "En 674, les derniers Almohades, qui avaient prêté allégeance à Ishaq, frère d'Umar al-Murtada, en 669, se réfugièrent au mont Tinmel — berceau de leur da'wa, maison de leur imam et mosquée de leur Mahdi; Muhammad ibn Ali ibn Mahalla, gouverneur de Marrakech sous Abu Yusuf, prit d'assaut la montagne, tua leur calife fantoche et le vizir Ibn Attush lors de la bataille, décapita et crucifia les captifs à Marrakech, dispersa les tombeaux des califes almohades et exhuma les corps de Yusuf et de son fils Ya'qub al-Mansur pour leur couper la tête — œuvre d'Abu Ali al-Milyani que le sultan avait investi d'Aghmat; Le sultan désavoua l'acte en raison de son caractère énorme, mais le pardonna en raison de la fidélité de l'homme — et la descendance des Banu Abd al-Mu'min fut anéantie."
  ur: "674 میں باقیات الموحد، جنہوں نے 669 میں عمر المرتضیٰ کے بھائی اسحاق سے قسم کھائی تھی، اپنی آخری پناہ گاہ کوہ ٹنمیل پر کھڑے ہوئے - ان کی دعوت کا گہوارہ، ان کے امام کا گھر اور ان کی مہدی کی مسجد؛ مراکش کے ابو یوسف کے گورنر محمد بن علی ابن محلہ نے بلندی پر حملہ کیا، ان کے کٹھ پتلی خلیفہ اور وزیر ابن عطش کو جنگ میں قتل کیا، مراکش میں اسیروں کے سر قلم کیے اور سولی پر چڑھا دیے، المحدث خلفاء کے مقبروں کو تتر بتر کر دیا اور ان کے بیٹے یعقوب کی لاشیں کاٹ دیں۔ سر — ابو علی الملیانی کا کام جسے سلطان نے اخمت سے جوڑ دیا تھا۔ سلطان نے اس عمل کو اس کی وسعت کی وجہ سے مسترد کر دیا لیکن اس شخص کی وفا کی وجہ سے اسے معاف کر دیا - اور بنو عبد المومن کی نسل کاٹ دی گئی۔"
  tr: "Hicri 674 yılında, Abdülmümin'in soyundan gelenler, işlerinin merkezi, imamlarının evi ve Mehdilerinin mescidi olan Tinmel Dağı'na çekildiler. Hicri 669 yılında Ömer el-Murtada'nın kardeşi İsmah'a biat etmişlerdi. Sultan Ebu Yusuf'un Marakeş işlerinden sorumlu temsilcisi Muhammed ibn Ali ibn Mahli, onlara saldırdı ve dağa zorla baskın düzenleyerek, destansı savaşın ortasında zayıf halifelerini ve vezirleri İbn Attus'u öldürdü. Marakeş'te esir alınanların boyunları kesildi ve cesetleri çarmıha gerildi. Abdülmümin'in soyundan gelen halifelerin mezarları dağıtıldı ve Yusuf ile oğlu Yakub el-Mansur'un cesetleri çıkarılarak başları kesildi. Sultanın Ağmat topraklarını kendisine verdiği Ebu Ali el-Milyani, bu olaydan sorumluydu. Sultan, onun kibirli tavırları yüzünden onu reddetti ve yakınlığı nedeniyle onu memnun etmek için bazı şeyleri görmezden geldi. Abdülmümin'in soyundan gelenlerle bağlantı kesildi."
  id: "Pada tahun 674 H, keturunan Abd al-Mu'min mundur ke Gunung Tinmel, pusat urusan mereka, rumah imam mereka, dan masjid Mahdi mereka. Mereka telah berjanji setia kepada Ismahak, saudara Umar al-Murtada, pada tahun 669 H. Muhammad ibn Ali ibn Mahli, wakil Sultan Abu Yusuf atas urusan Marrakesh, menyerang mereka dan menyerbu gunung itu dengan paksa, membunuh khalifah mereka yang lemah dan menteri mereka Ibn Attoush di sisi pertempuran epik tersebut. Leher orang-orang yang ditangkap di Marrakesh dipenggal, dan jenazah mereka disalib. Kuburan para khalifah keturunan Abd al-Mu'min disebar, dan jenazah Yusuf dan putranya Yaqub al-Mansur dikeluarkan dan kepala mereka dipenggal. Abu Ali al-Milyani, yang kepadanya sultan telah memberikan tanah Aghmat, bertanggung jawab atas hal ini. Sultan menolaknya karena keangkuhannya, namun mengabaikannya demi menyenangkan hatinya karena kedekatannya. Keturunan Abd al-Mu'min pun terputus."
