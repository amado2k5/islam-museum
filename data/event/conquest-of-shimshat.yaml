id: event/conquest-of-shimshat
class: event
kind: conquest
label: { ar: "فتح شمشاط", en: "The Conquest of Shimshat", es: "La conquista de Shimshat", fr: "La conquête de Shimshat" }
summary:
  ar: "عند البلاذري: لما استخلف عثمان بن عفان كتب إلى معاوية بولاية الشام وولى عمير بن سعد الأنصاري الجزيرة ثم عزله وجمع لمعاوية الشام والجزيرة وثغورهما وأمره أن يغزو شمشاط — وهي أرمينية الرابعة — فوجّه إليها حبيب بن مسلمة الفهري وصفوان بن المعطل السلمي ففتحاها بعد أيام من نزولهما عليها على مثل صلح الرها، وأقام صفوان بها وبها توفي في آخر خلافة معاوية — ويقال بل غزاها معاوية نفسه وهذان معه فولّاها صفوان فأوطنها؛ وقد كان قسطنطين الطاغية أناخ عليها بعد نزوله في ملطية في سنة 133 فلم يمكنه فيها شيء فأغار على ما حولها ثم انصرف؛ ولم تزل شمشاط خراجية حتى صيّرها المتوكل على الله عشرية أسوة غيرها من الثغور."
  en: "In al-Baladhuri: when Uthman ibn Affan acceded he wrote to Mu'awiya with Syria's governorship and gave Umayr ibn Sa'd al-Ansari the Jazira, then removed him and joined Syria, the Jazira and their frontier to Mu'awiya, ordering him to raid Shimshat — the fourth Armenia — so he sent Habib ibn Maslama al-Fihri and Safwan ibn al-Mu'attal al-Sulami, who took it days after arriving on the like of al-Ruha's treaty; Safwan settled it and died there late in Mu'awiya's caliphate — some say Mu'awiya himself raided it with the two and appointed Safwan, who made it home; Constantine the tyrant later camped on it after alighting at Malatya in year 133, gained nothing there, raided its environs and withdrew; Shimshat stayed kharaj-land until al-Mutawakkil made it tithe-land like the rest of the frontier."
  es: "En al-Baladhuri: cuando Uthman ibn Affan accedió, escribió a Mu'awiya con el gobierno de Siria y le dio a Umayr ibn Sa'd al-Ansari la Jazira, luego lo destituyó y unió Siria, la Jazira y su frontera a Mu'awiya, ordenándole que saqueara Shimshat —la cuarta Armenia—, así que envió a Habib ibn Maslama al-Fihri y a Safwan ibn al-Mu'attal al-Sulami, quienes la tomaron días después de llegar en virtud de un tratado similar al de al-Ruha; Safwan se estableció allí y murió allí al final del califato de Mu'awiya; algunos dicen que el propio Mu'awiya la saqueó con los dos y nombró a Safwan, quien la convirtió en su hogar; Constantino el tirano acampó más tarde allí después de desembarcar en Malatya en el año 133, no obtuvo nada allí, saqueó sus alrededores y se retiró; Shimshat siguió siendo tierra de kharaj hasta que al-Mutawakkil la convirtió en tierra de diezmo, al igual que el resto de la frontera."
  fr: "Dans al-Baladhuri: lorsque Uthman ibn Affan accéda au califat, il écrivit à Mu'awiya pour lui confier le gouvernement de la Syrie et donna la jazira à Umayr ibn Sa'd al-Ansari, puis le destitua et rattacha la Syrie, la jazira et leur frontière à Mu'awiya, lui ordonnant de piller Shimshat — la quatrième Arménie — et il envoya Habib ibn Maslama al-Fihri et Safwan ibn al-Mu'attal al-Sulami, qui s'en emparèrent quelques jours après leur arrivée, conformément au traité d'al-Ruha; Safwan s'y installa et y mourut à la fin du califat de Mu'awiya — certains disent que Mu'awiya lui-même y mena un raid avec les deux hommes et nomma Safwan, qui en fit sa demeure; Constantin le tyran y campa plus tard après avoir débarqué à Malatya en l'an 133, n'y gagna rien, pilla ses environs et se retira; Shimshat resta une terre de kharaj jusqu'à ce qu'al-Mutawakkil en fasse une terre de dîme comme le reste de la frontière."
