label: { ar: "فتح شمشاط", en: "The Conquest of Shimshat" }
summary:
  ar: "عند البلاذري: لما استخلف عثمان بن عفان كتب إلى معاوية بولاية الشام وولى عمير بن سعد الأنصاري الجزيرة ثم عزله وجمع لمعاوية الشام والجزيرة وثغورهما وأمره أن يغزو شمشاط — وهي أرمينية الرابعة — فوجّه إليها حبيب بن مسلمة الفهري وصفوان بن المعطل السلمي ففتحاها بعد أيام من نزولهما عليها على مثل صلح الرها، وأقام صفوان بها وبها توفي في آخر خلافة معاوية — ويقال بل غزاها معاوية نفسه وهذان معه فولّاها صفوان فأوطنها؛ وقد كان قسطنطين الطاغية أناخ عليها بعد نزوله في ملطية في سنة 133 فلم يمكنه فيها شيء فأغار على ما حولها ثم انصرف؛ ولم تزل شمشاط خراجية حتى صيّرها المتوكل على الله عشرية أسوة غيرها من الثغور."
  en: "In al-Baladhuri: when Uthman ibn Affan acceded he wrote to Mu'awiya with Syria's governorship and gave Umayr ibn Sa'd al-Ansari the Jazira, then removed him and joined Syria, the Jazira and their frontier to Mu'awiya, ordering him to raid Shimshat — the fourth Armenia — so he sent Habib ibn Maslama al-Fihri and Safwan ibn al-Mu'attal al-Sulami, who took it days after arriving on the like of al-Ruha's treaty; Safwan settled it and died there late in Mu'awiya's caliphate — some say Mu'awiya himself raided it with the two and appointed Safwan, who made it home; Constantine the tyrant later camped on it after alighting at Malatya in year 133, gained nothing there, raided its environs and withdrew; Shimshat stayed kharaj-land until al-Mutawakkil made it tithe-land like the rest of the frontier."
