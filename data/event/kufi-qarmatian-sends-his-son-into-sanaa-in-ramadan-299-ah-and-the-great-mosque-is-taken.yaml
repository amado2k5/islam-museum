id: "event/kufi-qarmatian-sends-his-son-into-sanaa-in-ramadan-299-ah-and-the-great-mosque-is-taken"
class: event
kind: other
label:
  ar: "يدخل ابن الكوفي القرمطي صنعاء في رمضان سنة 299هـ وينزل المسجد الجامع، ص399"
  en: "A Qarmatian party with the Kufi's son enters Sanaa in Ramadan 299 AH and takes the Great Mosque, p. 399"
  ur: "کوفی قرمطی کے بیٹے کے ساتھ ایک قرمطی جماعت رمضان 299ھ میں صنعاء میں داخل ہو کر جامع مسجد میں اترتی ہے، ص399"
  es: "Un grupo de cármatas, con el hijo del kufí a la cabeza, entra en Saná en Ramadán del año 299 de la Hégira y toma la Gran Mezquita, pág. 399."
  fr: "Un groupe qarmate, accompagné du fils du Kufi, entre à Sanaa durant le Ramadan 299 AH et prend la Grande Mosquée, p. 399"
  tr: "İbn el-Kufi el-Karmati, Hicri 299 yılının Ramazan ayında Sana'a'ya girmiş ve Mescid-i Haram'da kalmıştır (s. 399)."
  id: "Ibn al-Kufi al-Qarmati memasuki Sana'a pada bulan Ramadan tahun 299 H dan tinggal di Masjidil Haram, hlm. 399."
summary:
  ar: "ينصرف ابن الفضل من صاحبه الكوفي، ثم يكاتبه ويجامله، ويبعث معه ابن الكوفي، فيدخل صنعاء يوم الإثنين لتسع ليال خلت من شهر رمضان سنة 299هـ، فينزل المسجد الجامع. ويذكر المؤلف أفعالا وقعت فيه ينكرها."
  en: "Ibn al-Fadl makes peace with the Kufi and sends the Kufi's son with him. The party enters Sanaa on Monday, nine nights into Ramadan 299 AH, and takes the Great Mosque. The author reports acts there that he condemns, given here only in general terms."
  ur: "ابن الفضل کوفی سے صلح کرتا ہے اور اس کے بیٹے کو اپنے ساتھ بھیجتا ہے۔ یہ جماعت رمضان 299ھ کی نو راتیں گزرنے پر پیر کو صنعاء میں داخل ہو کر جامع مسجد میں اترتی ہے۔ مصنف وہاں ہونے والے ایسے افعال بیان کرتا ہے جن کی وہ مذمت کرتا ہے، جنہیں یہاں عمومی الفاظ میں درج کیا گیا ہے۔"
  es: "Ibn al-Fadl hace las paces con el Kufi y envía a su hijo con él. El grupo entra en Saná el lunes, nueve noches después del inicio del Ramadán del año 299 de la Hégira, y toma la Gran Mezquita. El autor relata allí actos que condena, descritos aquí solo en términos generales."
  fr: "Ibn al-Fadl fait la paix avec le Kufi et envoie le fils de ce dernier avec lui. Le groupe entre à Sanaa le lundi de la neuvième nuit du Ramadan 299 AH et s'empare de la Grande Mosquée. L'auteur rapporte des actes qui s'y déroulent et qu'il condamne, mais ne les décrit ici qu'en termes généraux."
  tr: "İbn el-Fadl, arkadaşı el-Kufi'den ayrıldıktan sonra onunla mektuplaştı ve ona iyi davrandı. İbn el-Kufi'yi de yanına gönderdi ve ikisi Hicri 299 yılının Ramazan ayının dokuzuncu gecesi, Pazartesi günü Sana'a'ya girdiler ve Mescid-i Haram'da kaldılar. Yazar, orada meydana gelen ve onaylamadığı olaylardan bahsetmektedir."
  id: "Ibn al-Fadl berpisah dari temannya, al-Kufi, kemudian berkorespondensi dengannya dan memperlakukannya dengan baik. Ia mengutus Ibn al-Kufi bersamanya, dan mereka memasuki Sana'a pada hari Senin, malam kesembilan bulan Ramadan tahun 299 H, dan tinggal di Masjidil Haram. Penulis menyebutkan beberapa kejadian yang terjadi di sana yang tidak disetujuinya."
