id: event/testament-of-yusuf-and-his-remains
class: event
kind: death
label:
  ar: وصية يوسف بجثمانه ونقل موسى له من مصر
  en: Yusuf's charge about his remains and Musa carrying them out of Egypt
  ur: یوسف کی اپنے جسد کے بارے میں وصیت اور موسیٰ کا اسے مصر سے لے جانا
  es: "La acusación de Yusuf sobre sus restos y Musa sacándolos de Egipto."
  fr: "Les instructions de Yusuf concernant sa dépouille et le fait que Moïse l'emporte hors d'Égypte"
  tr: "Yusuf'un bedeniyle ilgili vasiyeti ve Musa'nın onu Mısır'dan getirmesi."
  id: "Wasiat Yusuf mengenai jenazahnya dan pemindahannya oleh Musa dari Mesir."
summary:
  ar: يروي ابن كثير أن يوسف سأل ربه أن يتوفاه على الإسلام {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 331} وأوصى أن تُحمل جثته مع بني إسرائيل إذا خرجوا من مصر، فحُنّط ووُضع في تابوت حتى أخرجه موسى {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 333} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224}؛ ويروي الطبري وابن كثير وابن الأثير خبر عجوز من بني إسرائيل دلّت موسى على قبره في النيل {cite:tarikh-al-tabari scan vol. 2 p. 488} {cite:tafsir-ibn-kathir scan vol. 1 p. 3388} {cite:kamil-ibn-al-athir scan vol. 3 p. 151}، ويصف ابن كثير حديث أبي موسى فيها بأنه غريب جداً والأقرب أنه موقوف {cite:tafsir-ibn-kathir scan vol. 1 p. 3389}.
  en: Ibn Kathir reports that Yusuf asked his Lord to take him in submission {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 331} and charged that his body be carried with the Israelites when they left Egypt; he was embalmed and placed in a coffin until Musa took him out {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 333} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224}; al-Tabari, Ibn Kathir and Ibn al-Athir relate how an old woman of the Israelites showed Musa his grave in the Nile {cite:tarikh-al-tabari scan vol. 2 p. 488} {cite:tafsir-ibn-kathir scan vol. 1 p. 3388} {cite:kamil-ibn-al-athir scan vol. 3 p. 151}, and Ibn Kathir calls the hadith of Abu Musa about her very strange and probably a Companion's statement {cite:tafsir-ibn-kathir scan vol. 1 p. 3389}.
  ur: ابن کثیر بتاتے ہیں کہ یوسف نے رب سے اسلام پر وفات کی دعا کی {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 331} اور وصیت کی کہ بنی اسرائیل کے مصر سے نکلنے پر ان کا جسد ساتھ لے جایا جائے؛ انھیں حنوط کر کے تابوت میں رکھا گیا یہاں تک کہ موسیٰ انھیں نکال لے گئے {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 333} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224}؛ طبری، ابن کثیر اور ابن اثیر بنی اسرائیل کی ایک بوڑھی عورت کا ذکر کرتے ہیں جس نے موسیٰ کو نیل میں ان کی قبر بتائی {cite:tarikh-al-tabari scan vol. 2 p. 488} {cite:tafsir-ibn-kathir scan vol. 1 p. 3388} {cite:kamil-ibn-al-athir scan vol. 3 p. 151}، اور ابن کثیر ابو موسیٰ کی اس حدیث کو بہت غریب اور غالباً موقوف کہتے ہیں {cite:tafsir-ibn-kathir scan vol. 1 p. 3389}۔
  es: "Ibn Kathir informa que Yusuf le pidió a su Señor que lo tomara en sumisión {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 331} y ordenó que su cuerpo fuera llevado con los israelitas cuando salieran de Egipto; fue embalsamado y colocado en un ataúd hasta que Musa lo sacó {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 333} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224}; al-Tabari, Ibn Kathir e Ibn al-Athir relatan cómo una anciana de los israelitas le mostró a Musa su tumba en el Nilo {cite:tarikh-al-tabari scan vol. 2 p. 488} {cite:tafsir-ibn-kathir scan vol. 1 p. 3388} {cite:kamil-ibn-al-athir scan vol. 3 p. 151}, e Ibn Kathir llama al hadiz de Abu Musa sobre ella muy extraño y probablemente una declaración de un Compañero {cite:tafsir-ibn-kathir scan vol. 1 p. 3389}."
  fr: "Ibn Kathir rapporte que Yusuf demanda à son Seigneur de le prendre en soumission {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 331} et ordonna que son corps soit emporté avec les Israélites lors de leur départ d'Égypte; il fut embaumé et placé dans un cercueil jusqu'à ce que Moïse le sorte {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 333} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224}; al-Tabari, Ibn Kathir et Ibn al-Athir racontent comment une vieille femme israélite montra à Moïse sa tombe dans le Nil {cite:tarikh-al-tabari scan vol. 2 p. 488} {cite:tafsir-ibn-kathir scan vol. 1 p. 3388} {cite:kamil-ibn-al-athir scan vol. 3 p. 151}, et Ibn Kathir qualifie le hadith d'Abu Musa à son sujet de très étrange et probablement d'une déclaration d'un Compagnon {cite:tafsir-ibn-kathir scan vol. 1 p. 3389}."
  tr: "İbn Kathir, Yusuf'un Rabbinden İslam halinde ölmesine izin vermesini istediğini {kaynak:kısas-ı enbiya-ibn-kathir-ikra-e-kitap tarama s. 331} ve İsrailoğulları Mısır'dan ayrılırken cesedinin onlarla birlikte taşınmasını emrettiğini rivayet eder. Böylece mumyalanarak bir tabuta konuldu ve Musa onu çıkarana kadar orada kaldı {kaynak:kısas-ı enbiya-ibn-kathir-ikra-e-kitap tarama s. 333} {kaynak:el-bidaya-wal-nihaya tarama cilt 2 s. 224}; ve el-Taberi, İbn Kathir ve İbn el-Athir, İsrailoğullarından yaşlı bir kadının Musa'ya Nil'deki mezarını gösterdiğini anlatırlar {kaynak:tarikh-al-tabari tarama cilt 2 s. 488} {kaynak:tefsir-ibn-kathir tarama cilt 1 s. 3388} {cite:kamil-ibn-al-athir scan vol. 3 p. 151} İbn Kathir, Ebu Musa'nın hadisini çok garip olarak nitelendirir ve en muhtemelinin bir Sahabenin sözü olduğunu belirtir. {cite:tafsir-ibn-kathir scan vol. 1 p. 3389}."
  id: "Ibn Kathir meriwayatkan bahwa Yusuf meminta kepada Tuhannya agar ia meninggal dalam keadaan Islam {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 331} dan memerintahkan agar jenazahnya dibawa bersama Bani Israel ketika mereka meninggalkan Mesir. Maka ia dibalsem dan ditempatkan dalam peti mati sampai Musa mengeluarkannya {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 333} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224}; dan al-Tabari, Ibn Kathir, dan Ibn al-Athir meriwayatkan kisah seorang wanita tua dari Bani Israel yang menunjukkan kepada Musa kuburnya di Sungai Nil {cite:tarikh-al-tabari scan vol. 2 p. 488} {cite:tafsir-ibn-kathir scan vol. 1 p. 3388} {cite:kamil-ibn-al-athir scan vol. 3 hal. 151} Ibn Kathir menggambarkan hadits Abu Musa di dalamnya sebagai sangat aneh dan kemungkinan besar itu adalah pernyataan seorang Sahabat {kutip:tafsir-ibn-kathir scan vol. 1 hal. 3389}."
