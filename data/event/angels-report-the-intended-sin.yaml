id: event/angels-report-the-intended-sin
kind: other
label:
  ar: 'قول الملائكة: رب ذاك عبدك يريد أن يعمل سيئة وهو أبصر به'
  en: 'The angels say: My Lord, that is Your servant who intends an evil deed — You know him best'
  ur: 'ملائکہ کہتے ہیں: اے رب وہ تیرا بندہ ہے جو برائی کرنا چاہتا ہے اور تو اسے بہتر جانتا ہے'
summary:
  ar: 'في الحديث القدسي: إذا هم العبد بسيئة لم تكتب عليه حتى يعملها، فإن عملها كتبت عليه سيئة أو خطيئة؛ وإذا هم بحسنة لم تكتب له حتى يعملها، فإن عملها كتبها الله عنده عشراً إلى سبعمئة ضعف، وقالت الملائكة: رب ذاك عبدك يريد أن يعمل سيئة وهو أبصر به {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-37|الأربعون 37]].'
  en: 'In the hadith qudsi: if a servant intends an evil deed it is not written against him until he does it; if he does it a sin or crime is written; if he intends a good deed it is not written for him until he does it; if he does it Allah writes it ten to seven hundred fold; and the angels say: My Lord, that is Your servant who intends an evil deed — You know him best {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-37|Forty 37]].'
  ur: 'حدیث قدسی میں: جب بندہ برائی کا ارادہ کرے تو اس پر تب تک نہیں لکھی جاتی جب تک وہ اسے نہ کرے؛ اگر وہ اسے کرے تو اس پر گناہ یا جرم لکھا جاتا ہے؛ اور جب وہ نیکی کا ارادہ کرے تو اس کے لیے تب تک نہیں لکھی جاتی جب تک وہ اسے نہ کرے؛ اگر وہ اسے کرے تو اللہ اسے دس سے سات سو گنا کے لکھتا ہے؛ اور ملائکہ کہتے ہیں: اے رب وہ تیرا بندہ ہے جو برائی کرنا چاہتا ہے اور تو اسے بہتر جانتا ہے {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-37|چالیس 37]]۔'
