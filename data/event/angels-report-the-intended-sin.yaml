id: event/angels-report-the-intended-sin
kind: other
label:
  ar: 'قول الملائكة: رب ذاك عبدك يريد أن يعمل سيئة وهو أبصر به'
  en: 'The angels say: My Lord, that is Your servant who intends an evil deed — You know him best'
  ur: 'ملائکہ کہتے ہیں: اے رب وہ تیرا بندہ ہے جو برائی کرنا چاہتا ہے اور تو اسے بہتر جانتا ہے'
  es: "Los ángeles dicen: Señor mío, ese es tu siervo que trama una mala acción; tú lo conoces mejor."
  fr: "Les anges disent: « Seigneur, c'est Ton serviteur qui projette de faire le mal; Tu le connais mieux que quiconque. »"
  tr: "Melekler şöyle dediler: \"Rabbim, işte kötülük yapmaya niyetli olan kulun budur ve Sen onu benden daha iyi bilirsin.\""
  id: "Para malaikat berkata: \"Ya Tuhanku, dialah hamba-Mu yang berniat melakukan kejahatan, dan Engkau lebih mengetahui tentang dia daripada aku.\""
summary:
  ar: 'في الحديث القدسي: إذا هم العبد بسيئة لم تكتب عليه حتى يعملها، فإن عملها كتبت عليه سيئة أو خطيئة؛ وإذا هم بحسنة لم تكتب له حتى يعملها، فإن عملها كتبها الله عنده عشراً إلى سبعمئة ضعف، وقالت الملائكة: رب ذاك عبدك يريد أن يعمل سيئة وهو أبصر به {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-37|الأربعون 37]].'
  en: 'In the hadith qudsi: if a servant intends an evil deed it is not written against him until he does it; if he does it a sin or crime is written; if he intends a good deed it is not written for him until he does it; if he does it Allah writes it ten to seven hundred fold; and the angels say: My Lord, that is Your servant who intends an evil deed — You know him best {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-37|Forty 37]].'
  ur: 'حدیث قدسی میں: جب بندہ برائی کا ارادہ کرے تو اس پر تب تک نہیں لکھی جاتی جب تک وہ اسے نہ کرے؛ اگر وہ اسے کرے تو اس پر گناہ یا جرم لکھا جاتا ہے؛ اور جب وہ نیکی کا ارادہ کرے تو اس کے لیے تب تک نہیں لکھی جاتی جب تک وہ اسے نہ کرے؛ اگر وہ اسے کرے تو اللہ اسے دس سے سات سو گنا کے لکھتا ہے؛ اور ملائکہ کہتے ہیں: اے رب وہ تیرا بندہ ہے جو برائی کرنا چاہتا ہے اور تو اسے بہتر جانتا ہے {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-37|چالیس 37]]۔'
  es: "En el hadiz qudsi: si un siervo tiene la intención de hacer una mala acción, no se le escribe en contra hasta que la hace; si la hace, se le escribe un pecado o crimen; si tiene la intención de hacer una buena acción, no se le escribe a favor hasta que la hace; si la hace, Alá la escribe diez a setecientas veces; y los ángeles dicen: Señor mío, ese es Tu siervo que tiene la intención de hacer una mala acción; Tú lo conoces mejor {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-37|Cuarenta 37]]."
  fr: "Dans le hadith qudsi: si un serviteur a l'intention de commettre une mauvaise action, cela n'est pas écrit contre lui tant qu'il ne l'a pas accomplie; s'il l'accomplit, un péché ou un crime est inscrit; s'il a l'intention de commettre une bonne action, cela n'est pas inscrit pour lui tant qu'il ne l'a pas accomplie; s'il l'accomplit, Allah l'inscrit dix à sept cents fois; et les anges disent: « Mon Seigneur, c'est Ton serviteur qui a l'intention de commettre une mauvaise action — Tu le connais mieux » {cite: ibn-rajab-jami-ulum-hikam} [[passage/arbaun-37|Quarante 37]]."
  tr: "Hadis-i Kudsi'de şöyle buyurulmuştur: Bir kul kötü bir amel işlemeyi niyet ederse, onu yapana kadar aleyhine yazılmaz. Eğer yaparsa, kötü amel veya günah olarak aleyhine yazılır. İyi bir amel işlemeyi niyet ederse, onu yapana kadar aleyhine yazılmaz. Eğer yaparsa, Allah onu onun namına on ila yedi yüz katı kadar yazar. Melekler şöyle buyurdular: Ey Rabbim, işte kötü bir amel işlemeyi niyet eden kulun budur ve Sen ondan daha çok haberdarsın. {İbn-Receb-Cami-ulum-Hikam} [[Arbaun 37]]."
  id: "Dalam Hadits Qudsi: Jika seorang hamba berniat melakukan perbuatan buruk, maka perbuatan itu tidak dicatat atas dirinya sampai ia melakukannya. Jika ia melakukannya, maka perbuatan itu dicatat atas dirinya sebagai perbuatan buruk atau dosa. Jika ia berniat melakukan perbuatan baik, maka perbuatan itu tidak dicatat atas dirinya sampai ia melakukannya. Jika ia melakukannya, Allah mencatatnya pada dirinya sepuluh hingga tujuh ratus kali lipat. Para malaikat berkata: Ya Tuhan, itulah hamba-Mu yang berniat melakukan perbuatan buruk, dan Engkau lebih mengetahui perbuatannya daripada dirinya sendiri. {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-37|الأربعون 37]]."
