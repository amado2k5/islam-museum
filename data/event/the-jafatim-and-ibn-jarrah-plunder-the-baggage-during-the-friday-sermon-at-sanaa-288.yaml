id: event/the-jafatim-and-ibn-jarrah-plunder-the-baggage-during-the-friday-sermon-at-sanaa-288
class: event
label:
  ar: "الجفاتم وابن جراح ينهبون أثقال أصحاب الهادي أثناء خطبة الجمعة بصنعاء، محرم 288هـ"
  en: "The Jafatim and Ibn Jarrah plunder the baggage during the Friday sermon at Sana'a, Muharram 288 AH"
  ur: "جمعہ کے خطبے کے دوران صنعاء میں جفاتم اور ابن جراح ہادی کے ساتھیوں کا سامان لوٹتے ہیں، محرم 288ھ"
summary:
  ar: "يبلغ الخبر عبد الله بن جراح والجفاتم من السر بأن أبا العتاهية أدخل الهادي صنعاء فيقبلون وهم يقولون إنهم لا يريدون العلوي، وكذلك آل طريف، ويتفق إبراهيم بن خلف وأبو زياد مع جيش من الخيل والرجال على إثارة الفتنة حين ينشغل الناس بالجمعة، فينهب الجفاتم وابن جراح أثقال أصحاب الهادي وهو على المنبر ولا يلتفت حتى يتم خطبته ويصلي."
  en: "News reaches Abdullah ibn Jarrah and the Jafatim at al-Sirr that Abu al-Atahiya has brought al-Hadi into Sana'a and they ride in saying they do not want the Alawi, as Al Tarif say too; Ibrahim ibn Khalaf and Abu Ziyad, with a large force of horse and men, plan to stir the sedition once people are busy with the Friday prayer, and the Jafatim and Ibn Jarrah plunder the baggage of al-Hadi's men while he is on the pulpit; he does not turn aside but finishes the sermon and leads the prayer."
  ur: "عبد اللہ بن جراح اور جفاتم کو السر میں خبر پہنچتی ہے کہ ابو العتاہیہ ہادی کو صنعاء میں لے آئے ہیں، وہ یہ کہتے ہوئے آتے ہیں کہ انہیں علوی نہیں چاہیے، اور آل طریف بھی یہی کہتے ہیں؛ ابراہیم بن خلف اور ابو زیاد گھڑ سواروں اور آدمیوں کے بڑے لشکر کے ساتھ طے کرتے ہیں کہ جب لوگ جمعہ میں مصروف ہوں تو فتنہ اٹھائیں، چنانچہ جب ہادی منبر پر ہیں جفاتم اور ابن جراح ان کے ساتھیوں کا سامان لوٹتے ہیں؛ ہادی توجہ نہیں دیتے اور خطبہ پورا کر کے نماز پڑھاتے ہیں۔"
