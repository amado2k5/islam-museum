id: event/the-jafatim-and-ibn-jarrah-plunder-the-baggage-during-the-friday-sermon-at-sanaa-288
class: event
label:
  ar: "الجفاتم وابن جراح ينهبون أثقال أصحاب الهادي أثناء خطبة الجمعة بصنعاء، محرم 288هـ"
  en: "The Jafatim and Ibn Jarrah plunder the baggage during the Friday sermon at Sana'a, Muharram 288 AH"
  ur: "جمعہ کے خطبے کے دوران صنعاء میں جفاتم اور ابن جراح ہادی کے ساتھیوں کا سامان لوٹتے ہیں، محرم 288ھ"
  es: "Jafatim e Ibn Jarrah saquean el equipaje durante el sermón del viernes en Saná, Muharram 288 AH."
  fr: "Les Jafatim et Ibn Jarrah pillent les bagages pendant le sermon du vendredi à Sanaa, en Muharram 288 AH."
  tr: "El-Cafetim ve İbn Cerrah, Hicri 288 Muharrem ayında Sana'a'da cuma hutbesi sırasında El-Hadi'nin arkadaşlarının eşyalarını yağmaladılar."
  id: "Al-Jafatem dan Ibn Jarrah menjarah harta benda para sahabat Al-Hadi selama khutbah Jumat di Sana'a, Muharram 288 H."
summary:
  ar: "يبلغ الخبر عبد الله بن جراح والجفاتم من السر بأن أبا العتاهية أدخل الهادي صنعاء فيقبلون وهم يقولون إنهم لا يريدون العلوي، وكذلك آل طريف، ويتفق إبراهيم بن خلف وأبو زياد مع جيش من الخيل والرجال على إثارة الفتنة حين ينشغل الناس بالجمعة، فينهب الجفاتم وابن جراح أثقال أصحاب الهادي وهو على المنبر ولا يلتفت حتى يتم خطبته ويصلي."
  en: "News reaches Abdullah ibn Jarrah and the Jafatim at al-Sirr that Abu al-Atahiya has brought al-Hadi into Sana'a and they ride in saying they do not want the Alawi, as Al Tarif say too; Ibrahim ibn Khalaf and Abu Ziyad, with a large force of horse and men, plan to stir the sedition once people are busy with the Friday prayer, and the Jafatim and Ibn Jarrah plunder the baggage of al-Hadi's men while he is on the pulpit; he does not turn aside but finishes the sermon and leads the prayer."
  ur: "عبد اللہ بن جراح اور جفاتم کو السر میں خبر پہنچتی ہے کہ ابو العتاہیہ ہادی کو صنعاء میں لے آئے ہیں، وہ یہ کہتے ہوئے آتے ہیں کہ انہیں علوی نہیں چاہیے، اور آل طریف بھی یہی کہتے ہیں؛ ابراہیم بن خلف اور ابو زیاد گھڑ سواروں اور آدمیوں کے بڑے لشکر کے ساتھ طے کرتے ہیں کہ جب لوگ جمعہ میں مصروف ہوں تو فتنہ اٹھائیں، چنانچہ جب ہادی منبر پر ہیں جفاتم اور ابن جراح ان کے ساتھیوں کا سامان لوٹتے ہیں؛ ہادی توجہ نہیں دیتے اور خطبہ پورا کر کے نماز پڑھاتے ہیں۔"
  es: "Llegan noticias a Abdullah ibn Jarrah y a los Jafatim en al-Sirr de que Abu al-Atahiya ha traído a al-Hadi a Sana'a y entran diciendo que no quieren al Alawi, como también dicen Al Tarif; Ibrahim ibn Khalaf y Abu Ziyad, con una gran fuerza de caballos y hombres, planean incitar a la sedición una vez que la gente esté ocupada con la oración del viernes, y los Jafatim e Ibn Jarrah saquean el equipaje de los hombres de al-Hadi mientras él está en el púlpito; él no se aparta sino que termina el sermón y dirige la oración."
  fr: "La nouvelle parvient à Abdullah ibn Jarrah et aux Jafatim à al-Sirr qu'Abu al-Atahiya a amené al-Hadi à Sanaa et ils arrivent à cheval en disant qu'ils ne veulent pas de l'Alawite, comme le disent aussi Al-Tariah. Ibrahim ibn Khalaf et Abu Ziyad, avec une importante troupe de cavaliers et d'hommes, projettent de fomenter la sédition pendant que les fidèles sont occupés par la prière du vendredi. Les Jafatim et Ibn Jarrah pillent les bagages des hommes d'al-Hadi pendant qu'il est en chaire; il ne se détourne pas, termine son sermon et dirige la prière."
  tr: "El-Sir'den Abdullah bin Cerrah ve El-Cafetem'e, Ebu El-Atahiye'nin El-Hadi'yi Sana'a'ya getirdiği haberi ulaşır. Bunun üzerine, Alevileri ve Tarif ailesini istemediklerini söyleyerek gelirler. İbrahim bin Halef ve Ebu Ziyad, halk Cuma namazıyla meşgulken fitne çıkarmak için atlı ve askerli bir orduyla anlaşırlar. Bunun üzerine El-Cafetem ve İbn Cerrah, El-Hadi minberde iken arkadaşlarının eşyalarını yağmalarlar ve o hutbesini bitirip namaz kılana kadar arkasına bakmazlar."
  id: "Kabar sampai kepada Abdullah bin Jarrah dan Al-Jafatem dari Al-Sir bahwa Abu Al-Atahiyah membawa Al-Hadi ke Sana'a, sehingga mereka datang dan mengatakan bahwa mereka tidak menginginkan kaum Alawi, begitu pula keluarga Al Tarif. Ibrahim bin Khalaf dan Abu Ziyad bersekongkol dengan pasukan berkuda dan manusia untuk menimbulkan pemberontakan ketika orang-orang sedang sibuk melaksanakan salat Jumat, sehingga Al-Jafatem dan Ibn Jarrah merampas barang bawaan para sahabat Al-Hadi saat beliau sedang berkhutbah dan tidak berbalik sampai beliau selesai berkhutbah dan salat."
