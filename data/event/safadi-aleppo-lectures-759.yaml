summary:
  ar: "جال الصفدي في الشام في جولات إفادة علمية أوصلته إلى حلب سنة ٧٥٩هـ، كما يشهد سماع «تصحيح التصحيف»، وكان أكثر وقته بين دمشق والقاهرة موزعاً بين وظيفته وعمله العلمي {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}."
  en: "Al-Safadi travelled widely in Syria on lecture tours that brought him to Aleppo in 759/1358, as a sama' note in his Tashih al-tashif records; most of his time was divided between Damascus and Cairo and between his government post and his scholarly work {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}."
  ur: "صفدی نے شام میں علمی افادت کے دورے کیے جن میں 759ھ/1358ء میں حلب بھی شامل رہا، جیسا کہ «تصحيح التصحيف» کے سماع سے ثابت ہوتا ہے؛ اس کا بیشتر وقت دمشق اور قاہرہ اور اس کی ملازمت اور علمی کام کے درمیان بٹا رہا {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}۔"
