summary:
  ar: "جال الصفدي في الشام في جولات إفادة علمية أوصلته إلى حلب سنة ٧٥٩هـ، كما يشهد سماع «تصحيح التصحيف»، وكان أكثر وقته بين دمشق والقاهرة موزعاً بين وظيفته وعمله العلمي {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}."
  en: "Al-Safadi travelled widely in Syria on lecture tours that brought him to Aleppo in 759/1358, as a sama' note in his Tashih al-tashif records; most of his time was divided between Damascus and Cairo and between his government post and his scholarly work {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}."
  ur: "صفدی نے شام میں علمی افادت کے دورے کیے جن میں 759ھ/1358ء میں حلب بھی شامل رہا، جیسا کہ «تصحيح التصحيف» کے سماع سے ثابت ہوتا ہے؛ اس کا بیشتر وقت دمشق اور قاہرہ اور اس کی ملازمت اور علمی کام کے درمیان بٹا رہا {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}۔"
  es: "Al-Safadi viajó extensamente por Siria en giras de conferencias que lo llevaron a Alepo en 759/1358, como una nota sama' en sus registros Tashih al-tashif; la mayor parte de su tiempo lo dividió entre Damasco y El Cairo y entre su cargo gubernamental y su trabajo académico {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}."
  fr: "Al-Safadi a beaucoup voyagé en Syrie lors de tournées de conférences qui l'ont amené à Alep en 759/1358, comme le mentionne une note sama' dans ses archives Tashih al-tashif; la plupart de son temps était partagé entre Damas et le Caire et entre son poste gouvernemental et son travail savant {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}."
  tr: "El-Safadi, bilimsel fayda sağlamak amacıyla Levant'ı gezmiş ve bu geziler sırasında Hicri 759 yılında Halep'e gitmiştir; bu durum \"yazım hatalarının düzeltilmesi\" olayından da anlaşılmaktadır. Zamanının büyük bir bölümünü Şam ve Kahire arasında, işi ve bilimsel çalışmaları arasında bölüştürerek geçirmiştir. {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}"
  id: "Al-Safadi melakukan perjalanan keliling Levant untuk tujuan ilmiah yang membawanya ke Aleppo pada tahun 759 H, sebagaimana dibuktikan oleh adanya \"koreksi kesalahan ejaan\". Sebagian besar waktunya dihabiskan antara Damaskus dan Kairo, dibagi antara pekerjaannya dan karya ilmiahnya {cite:encyclopaedia-of-islam-2 vol. 8 p. 759}."
