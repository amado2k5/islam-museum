label:
  ar: "محمد بن عبيد الله يستشير ابني الهيثم والأربد ويوجه ابن منير إلى يسر بني مازن، 295هـ"
  en: "Muhammad ibn Ubaydallah consults two advisers and sends Abdallah ibn Munir to the Yasr of Banu Mazin, 295 AH, p. 363"
  ur: "محمد بن عبیداللہ کا دو مشیروں سے مشورہ اور عبداللہ بن منیر کو یسر بنی مازن بھیجنا، 295ھ، ص363"
summary:
  ar: "شاور محمد بن عبيد الله محمد بن الهيثم وأحمد بن الأربد في أمر ابن حميد، فنصحاه أن يوجه رجلاً من أصحابه يجمع إليه بني عمرو وبني بشر، فوجه عبد الله بن منير المزوي إلى يسر بني مازن."
  en: "Muhammad ibn Ubaydallah consulted Muhammad ibn al-Haytham and Ahmad ibn al-Arbad about Ibn Humayd. They advised him to send a man of his own to gather Banu Amr and Banu Bishr, and he sent Abdallah ibn Munir al-Muzawi to the Yasr of Banu Mazin."
  ur: "محمد بن عبیداللہ نے ابن حمید کے معاملے میں محمد بن الہیثم اور احمد بن الأربد سے مشورہ کیا۔ انہوں نے مشورہ دیا کہ اپنا ایک آدمی بھیجیں جو بنو عمرو اور بنو بشر کو جمع کرے، تو اس نے عبداللہ بن منیر المزوی کو یسر بنی مازن بھیجا۔"
