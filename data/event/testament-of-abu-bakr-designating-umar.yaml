id: event/testament-of-abu-bakr-designating-umar
class: event
kind: declaration
tags: [wasaya-browser, wasaya-caliphs, wasaya-wasiyya, wasaya-ihtidar]
label: { ar: "عهد أبي بكر بالخلافة إلى عمر", en: "Testament of Abu Bakr designating Umar", ur: "ابو بکر کا عمر کو خلیفہ نامزد کرنے کا عہد نامہ", es: "Testamento de Abu Bakr que designa a Umar", fr: "Testament d'Abu Bakr désignant Umar", tr: "Ebu Bekir halifeliği Ömer'e emanet etti.", id: "Abu Bakr mempercayakan kekhalifahan kepada Umar." }
summary:
  ar: "لما ثقل المرض بأبي بكر سأل عبد الرحمن بن عوف وعثمان عن عمر وشاور غيرهما، فرويا أن عمر سريرته خير من علانيته {cite:kamil-ibn-al-athir scan vol. 1 p. 267}. ثم أملى على عثمان عهداً باستخلاف عمر، وفي رواية الكامل أُغمي عليه بعد مطلعه فأتمه عثمان {cite:kamil-ibn-al-athir scan vol. 1 p. 267}، وفي رواية ابن سعد يرد نص العهد كاملاً {cite:usd-al-ghaba scan vol. 1 p. 908}. وقُرئ الكتاب على الناس بحضور عمر فسمعوا وأطاعوا وبايعوا {cite:kamil-ibn-al-athir scan vol. 1 p. 267}. وتختلف الروايات في اسم المعترض وهل كان طلحة، وفي ما نُقل عن علي في الرضا بالعهد {cite:usd-al-ghaba scan vol. 1 p. 909}."
  en: "As illness grew heavy Abu Bakr asked Abd al-Rahman ibn Awf and Uthman about Umar and consulted others; Uthman said Umar's inner self was better than his outward self {cite:kamil-ibn-al-athir scan vol. 1 p. 267}. He then had Uthman write a covenant naming Umar; in al-Kamil he fainted after the opening and Uthman completed it {cite:kamil-ibn-al-athir scan vol. 1 p. 267}, while Ibn Sa'd's version gives the whole text {cite:usd-al-ghaba scan vol. 1 p. 908}. The document was read to the people with Umar present, and they listened, obeyed and pledged allegiance {cite:kamil-ibn-al-athir scan vol. 1 p. 267}. The reports differ over who objected, whether Talha, and over what is attributed to Ali about accepting the covenant {cite:usd-al-ghaba scan vol. 1 p. 909}."
  ur: "بیماری شدید ہونے پر ابو بکر نے عبد الرحمن بن عوف اور عثمان سے عمر کے بارے میں پوچھا اور دوسروں سے بھی مشورہ کیا؛ عثمان نے کہا کہ عمر کا باطن ان کے ظاہر سے بہتر ہے {cite:kamil-ibn-al-athir scan vol. 1 p. 267}۔ پھر انھوں نے عثمان سے عمر کے تقرر کا عہد نامہ لکھوایا؛ الکامل کے مطابق ابتدا کے بعد وہ بے ہوش ہو گئے اور عثمان نے مکمل کیا {cite:kamil-ibn-al-athir scan vol. 1 p. 267}، جبکہ ابن سعد کی روایت میں پورا متن ملتا ہے {cite:usd-al-ghaba scan vol. 1 p. 908}۔ تحریر لوگوں کو عمر کی موجودگی میں پڑھ کر سنائی گئی تو انھوں نے سنا، مانا اور بیعت کی {cite:kamil-ibn-al-athir scan vol. 1 p. 267}۔ روایتیں اس میں مختلف ہیں کہ اعتراض کرنے والے طلحہ تھے یا نہیں، اور علی سے عہد کو ماننے کے بارے میں کیا منسوب ہے {cite:usd-al-ghaba scan vol. 1 p. 909}۔"
  es: "A medida que la enfermedad se agravaba, Abu Bakr preguntó a Abd al-Rahman ibn Awf y a Uthman acerca de Umar y consultó con otros; Uthman dijo que el ser interior de Umar era mejor que su ser exterior {cite:kamil-ibn-al-athir scan vol. 1 p. 267}. Luego le pidió a Uthman que escribiera un pacto nombrando a Umar; en al-Kamil, Umar se desmayó después de la apertura y Uthman lo completó {cite:kamil-ibn-al-athir scan vol. 1 p. 267}, mientras que la versión de Ibn Sa'd da el texto completo {cite:usd-al-ghaba scan vol. 1 p. 908}. El documento fue leído al pueblo con Umar presente, y ellos escucharon, obedecieron y juraron lealtad {cite:kamil-ibn-al-athir scan vol. 1 p. 267}. Los informes difieren en cuanto a quién se opuso, si Talha, y en cuanto a lo que se le atribuye a Ali sobre la aceptación del pacto {cite:usd-al-ghaba scan vol. 1 p. 909}."
  fr: "Alors que la maladie d'Umar s'aggravait, Abou Bakr interrogea Abd al-Rahman ibn Awf et Uthman à son sujet, et consulta d'autres personnes. Uthman affirma que la valeur intérieure d'Umar surpassait son apparence (cf. Kamil ibn al-Athir, vol. 1, p. 267). Abou Bakr chargea alors Uthman de rédiger un pacte mentionnant Umar. Selon al-Kamil, Umar s'évanouit après avoir commencé le pacte, et Uthman le termina (cf. Kamil ibn al-Athir, vol. 1, p. 267), tandis que la version d'Ibn Sa'd en donne le texte intégral (cf. Usd al-Ghaba, vol. 1, p. 908). Le document fut lu au peuple en présence d'Umar, qui écouta, obéit et prêta serment d'allégeance (cf. Kamil ibn al-Athir, vol. 1, p. 267). Les rapports divergent quant à savoir qui a objecté, s'il s'agissait de Talha, et quant à ce qui est attribué à Ali concernant l'acceptation de l'alliance {cite:usd-al-ghaba scan vol. 1 p. 909}."
  tr: "Ebu Bekir'in hastalığı kötüleşince, Abdurrahman ibn Avf ve Osman'a Ömer hakkında danıştı ve başkalarına da danıştı. Onlar da Ömer'in iç dünyasının dış görünüşünden daha iyi olduğunu bildirdiler. {Kaynak: Kamil ibn el-Atir, cilt 1, s. 267}. Sonra Osman'a Ömer'i halefi olarak atayan bir ahdi dikte ettirdi. Kamil rivayetine göre, ahdi okumaya başladıktan sonra bayıldı, bu yüzden Osman tamamladı. {Kaynak: Kamil ibn el-Atir, cilt 1, s. 267}. İbn Sa'd'ın rivayetinde ise ahdin metni tam olarak verilmiştir. {Kaynak: Usd el-Ghaba, cilt 1, s. 908}. Belge, Ömer'in huzurunda halka okundu ve onlar da dinleyip itaat ettiler ve biat ettiler. {Kaynak: Kamil ibn el-Atir, cilt 1, s. 267}. İtiraz edenin adı ve Talha olup olmadığı ile Ali'nin ahdi kabul etmesi hakkında bildirilenler konusunda anlatımlar farklılık göstermektedir. {cite:usd-al-ghaba scan vol. 1 p. 909}."
  id: "Ketika penyakit Abu Bakr memburuk, ia bertanya kepada Abd al-Rahman ibn Awf dan Uthman tentang Umar dan berkonsultasi dengan orang lain. Mereka melaporkan bahwa batin Umar lebih baik daripada penampilan luarnya. {cite:kamil-ibn-al-athir scan vol. 1 p. 267}. Kemudian ia mendiktekan kepada Uthman sebuah perjanjian yang menunjuk Umar sebagai penggantinya. Menurut riwayat Kamil, ia pingsan setelah memulainya, sehingga Uthman menyelesaikannya. {cite:kamil-ibn-al-athir scan vol. 1 p. 267}. Dalam riwayat Ibn Sa'd, teks perjanjian tersebut diberikan secara lengkap. {cite:usd-al-ghaba scan vol. 1 p. 908}. Dokumen itu dibacakan kepada orang-orang di hadapan Umar, dan mereka mendengarkan, menaati, dan berjanji setia. {cite:kamil-ibn-al-athir scan vol. 1 p. 267}. Catatan-catatan tersebut berbeda mengenai nama penentang dan apakah orang tersebut adalah Talha, serta mengenai apa yang dilaporkan tentang penerimaan perjanjian oleh Ali. {cite:usd-al-ghaba scan vol. 1 p. 909}."
