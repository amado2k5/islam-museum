id: event/al-hadi-razes-akili-houses-and-cuts-vines-at-saada-and-afqayn-287
class: event
kind: other
label:
  ar: "الهادي يهدم منازل الأكيليين ويقطع أعنابهم بصعدة وأفقين، جمادى الآخرة 287هـ"
  en: "Al-Hadi pulls down Akili houses and cuts their vines at Sa'da and Afqayn, Jumada II 287 AH"
  ur: "ہادی کا صعدہ اور افقین میں اکیلیوں کے مکان گرانا اور بیلیں کاٹنا، جمادیٰ الآخرہ 287ھ"
summary:
  ar: "سار الهادي إلى صعدة في جمادى الآخرة 287هـ فلقيه بنو سعد، وحارب الأكيليون وأحلافهم من ربيعة وانحازوا إلى حصنين، فأمر بهدم منازل الأكيليين إلا منازل الضعيفات وقطع أعنابهم، فاجتمع الربيعة بصرخة ابن عباد."
  en: "Al-Hadi went to Sa'da in Jumada II 287 AH and Banu Sa'd met him; the Akilis and their allies of Rabi'a fought and withdrew to two forts, and he ordered the Akilis' houses pulled down, except the weak women's houses, and their vines cut, whereupon the Rabi'a gathered at Ibn Abbad's cry."
  ur: "ہادی جمادیٰ الآخرہ 287ھ میں صعدہ گئے اور بنو سعد ان سے ملے؛ اکیلی اور ان کے ربیعہ کے حلیف لڑے اور دو قلعوں میں چلے گئے، تو انہوں نے اکیلیوں کے مکان، سوائے کمزور عورتوں کے، گرانے اور بیلیں کاٹنے کا حکم دیا، اور ابن عباد کی پکار پر ربیعہ جمع ہو گئے۔"
