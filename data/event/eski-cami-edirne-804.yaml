id: event/eski-cami-edirne-804
class: event
kind: founding
label: { ar: "بناء الجامع القديم ⁦(إسكي جامع)⁩ بأدرنة", en: "Edirne's Eski Cami (Old Mosque) is built", ur: "ادرنہ کی اسکی جامع کی تعمیر", es: "Se construye la Eski Cami (antigua mezquita) de Edirne", fr: "L'Eski Cami (ancienne mosquée) d'Edirne est construite", tr: "Edirne'de eski cami (Eski Cami) inşaatı", id: "Pembangunan masjid tua (Eski Cami) di Edirne" }
summary:
  ar: "بدأ الأمير سليمان بن بايزيد الأول بناء الجامع القديم بأدرنة سنة ٨٠٤هـ/١٤٠٢م في فترة العرش الفاطر، وأكمله محمد الأول سنة ٨١٦هـ/١٤١٣م {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}. ويسجّل فريلي أن النقوش سمّت محمداً الأول مؤسساً والبناء عمر بن إبراهيم والمعمار الحاج علاء الدين القونوي {cite:freely-ottoman-architecture-2011 p. 65}."
  en: "Emir Süleyman, son of Bayezid I, began Edirne's Eski Cami in 804/1402 during the interregnum, and Mehmed I completed it in 816/1413 {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}. Freely records inscriptions naming Mehmed I as founder, Ömer ibn Ibrahim as builder and Hacı Alaettin of Konya as architect {cite:freely-ottoman-architecture-2011 p. 65}."
  ur: "امیر سلیمان بن بایزید اول نے 804ھ/1402ء میں ادرنہ کی اسکی جامع کی بنیاد رکھی اور محمد اول نے 816ھ/1413ء میں اسے مکمل کیا {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}۔ فریلی کے مطابق کتبوں میں محمد اول کو بانی، عمر بن ابراہیم کو معمار اور حاجی علاء الدین قونوی کو سازندہ لکھا گیا ہے {cite:freely-ottoman-architecture-2011 p. 65}۔"
  es: "Emir Süleyman, hijo de Bayezid I, comenzó la construcción de la Mezquita Eski de Edirne en 804/1402 durante el interregno, y Mehmed I la completó en 816/1413 {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}. Freely registra inscripciones que nombran a Mehmed I como fundador, a Ömer ibn Ibrahim como constructor y a Hacı Alaettin de Konya como arquitecto {cite:freely-ottoman-architecture-2011 p. 65}."
  fr: "L'émir Soliman, fils de Bayezid Ier, commença la construction de la mosquée Eski Cami d'Edirne en 804/1402 durant l'interrègne, et Mehmed Ier l'acheva en 816/1413 {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}. Freely recense des inscriptions mentionnant Mehmed Ier comme fondateur, Ömer ibn Ibrahim comme constructeur et Hacı Alaettin de Konya comme architecte {cite:freely-ottoman-architecture-2011 p. 65}."
  tr: "Prens Süleyman ibn Bayezid I, Sultan Fatım döneminde Hicri 804/Miladi 1402 yılında Edirne'deki Eski Cami'nin inşasına başlamış ve cami Hicri 816/Miladi 1413 yılında I. Mehmed tarafından tamamlanmıştır. {kaynak:encyclopaedia-of-islam-2 cilt 2 s. 712}. Freely, kitabelerde kurucu olarak I. Mehmed, inşaatçı olarak Ömer ibn İbrahim ve mimar olarak Hacı Alaeddin el-Kunevi'nin adlarının geçtiğini belirtmektedir. {kaynak:freely-ottoman-architecture-2011 s. 65}."
  id: "Pangeran Suleiman ibn Bayezid I memulai pembangunan Masjid Tua di Edirne pada tahun 804 H/1402 M pada masa pemerintahan Sultan Fatim, dan diselesaikan oleh Mehmed I pada tahun 816 H/1413 M {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}. Freely mencatat bahwa prasasti tersebut menyebut Mehmed I sebagai pendiri, Omar ibn Ibrahim sebagai pembangun, dan Hajj Alaeddin al-Qunawi sebagai arsitek {cite:freely-ottoman-architecture-2011 p. 65}."
