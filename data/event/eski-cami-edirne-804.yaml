id: event/eski-cami-edirne-804
class: event
kind: founding
label: { ar: "بناء الجامع القديم (إسكي جامع) بأدرنة", en: "Edirne's Eski Cami (Old Mosque) is built", ur: "ادرنہ کی اسکی جامع کی تعمیر" }
summary:
  ar: "بدأ الأمير سليمان بن بايزيد الأول بناء الجامع القديم بأدرنة سنة ٨٠٤هـ/١٤٠٢م في فترة العرش الفاطر، وأكمله محمد الأول سنة ٨١٦هـ/١٤١٣م {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}. ويسجّل فريلي أن النقوش سمّت محمداً الأول مؤسساً والبناء عمر بن إبراهيم والمعمار الحاج علاء الدين القونوي {cite:freely-ottoman-architecture-2011 p. 65}."
  en: "Emir Süleyman, son of Bayezid I, began Edirne's Eski Cami in 804/1402 during the interregnum, and Mehmed I completed it in 816/1413 {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}. Freely records inscriptions naming Mehmed I as founder, Ömer ibn Ibrahim as builder and Hacı Alaettin of Konya as architect {cite:freely-ottoman-architecture-2011 p. 65}."
  ur: "امیر سلیمان بن بایزید اول نے 804ھ/1402ء میں ادرنہ کی اسکی جامع کی بنیاد رکھی اور محمد اول نے 816ھ/1413ء میں اسے مکمل کیا {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}۔ فریلی کے مطابق کتبوں میں محمد اول کو بانی، عمر بن ابراہیم کو معمار اور حاجی علاء الدین قونوی کو سازندہ لکھا گیا ہے {cite:freely-ottoman-architecture-2011 p. 65}۔"
