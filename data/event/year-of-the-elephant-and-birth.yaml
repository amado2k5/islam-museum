education:
  did_you_know:
    ar: "وُلد النبي محمد في مكة سنة الفيل التي تحقق المصادر أنها توافق نحو ٥٧٠–٥٧١م، قبل بدء بعثته بنحو أربعين عاماً."
    en: "The Prophet Muhammad was born in Mecca in the Year of the Elephant, which scholarship places around 570–571 CE, some forty years before his mission began."
