id: event/year-of-the-elephant-and-birth
education:
  did_you_know:
    ar: "وُلد النبي محمد في مكة سنة الفيل التي تحقق المصادر أنها توافق نحو ٥٧٠–٥٧١م، قبل بدء بعثته بنحو أربعين عاماً."
    en: "The Prophet Muhammad was born in Mecca in the Year of the Elephant, which scholarship places around 570–571 CE, some forty years before his mission began."
    ur: "نبی محمد مکہ میں عام الفیل میں پیدا ہوئے، جسے محققین تقریباً 570–571ء بتاتے ہیں — بعثت سے کوئی چالیس سال پہلے۔"
    sources: [source/ibn-ishaq-guillaume, source/mubarakpuri-raheeq]
class: event
kind: birth
label: { en: "The Year of the Elephant and the Prophet's birth", ar: "عام الفيل ومولد النبي", es: "El año del elefante y el nacimiento del profeta", fr: "L'année de l'Éléphant et la naissance du Prophète", ur: "ہاتھی کا سال اور نبی کی پیدائش", tr: "Fil Yılı ve Peygamberin Doğumu", id: "Tahun Gajah dan Kelahiran Nabi" }
summary:
  en: "The traditional year of the Prophet Muhammad's birth in Mecca — Monday 9 Rabi' I of the Year of the Elephant, given in the book as 20 or 22 April 571 CE."
  ar: "العام الذي تروي المصادر أن النبي محمدًا وُلد فيه بشعب بني هاشم بمكة — صبيحة الإثنين التاسع من ربيع الأول لأول عام من حادثة الفيل، ويوافق 20 أو 22 أبريل 571م كما حققه المنصور فوري ومحمود باشا الفلكي."
  es: "El año tradicional del nacimiento del Profeta Mahoma en La Meca: lunes 9 de Rabi' I del Año del Elefante, que en el libro se indica como el 20 o el 22 de abril de 571 d.C."
  fr: "L'année traditionnelle de naissance du prophète Mahomet à La Mecque — le lundi 9 Rabi' I de l'année de l'Éléphant, donnée dans le livre comme le 20 ou le 22 avril 571 de notre ère."
  ur: "مکہ میں نبی محمد کی پیدائش کا روایتی سال - ہاتھی کے سال کا پیر 9 ربیع اول، کتاب میں 20 یا 22 اپریل 571 عیسوی کے طور پر دیا گیا ہے۔"
  tr: "Kaynaklara göre Hz. Muhammed'in Mekke'de, Beni Haşim kabilesinden doğduğu yıl, Rebiü'l-Evvel ayının dokuzuncu Pazartesi sabahı, Fil Yılı'nın ilk yılıdır; bu da El-Mansur Furi ve Mahmud Paşa El-Falaki tarafından doğrulandığı üzere, 20 veya 22 Nisan 571'e denk gelmektedir."
  id: "Tahun kelahiran Nabi Muhammad menurut sumber-sumber resmi, yaitu di klan Banu Hasyim di Mekah — pada pagi hari Senin, tanggal sembilan Rabi' al-Awwal, tahun pertama Tahun Gajah, yang bertepatan dengan tanggal 20 atau 22 April 571 M, sebagaimana diverifikasi oleh Al-Mansur Furi dan Mahmoud Pasha Al-Falaki."
