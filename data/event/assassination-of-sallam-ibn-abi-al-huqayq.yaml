  ar: "في ذي الحجة سنة 5هـ بعد غزوة قريظة، تسلل خمسة من أبطال الخزرج بقيادة عبد الله بن عتيك إلى حصن خيبر ليلاً، فقتلوا سلام بن أبي الحقيق (أبا رافع) تاجر أهل الحجاز وأحد أكابر المحرضين والممولين لجيش الأحزاب."
