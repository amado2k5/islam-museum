label: { ar: "حرب الحارث الأعرج على بني تغلب", en: "The War of al-Harith al-A'raj on Banu Taghlib", es: "La guerra de al-Harith al-A'raj en Banu Taghlib", fr: "La guerre d'al-Harith al-A'raj contre Banu Taghlib", ur: "بنو تغلب پر حارث العراج کی جنگ", tr: "Al-Harith Al-A'raj'ın Banu Taghlib'e karşı savaşı", id: "Perang Al-Harith Al-A'raj melawan Bani Taghlib" }
summary:
  ar: "غزوة الحارث بن أبي شمر الغساني الملقب الأعرج على بني تغلب؛ خرج ملك غسان بالشام فمر بأفاريق من تغلب فلم يستقبلوه فتوعدهم «لأغزونهم غزوة تتركهم أيقاظاً لقدومي»، فرد عليه عمرو بن كلثوم «ما استيقظ قوم قط إلا نبل رأيهم وعزت جماعتهم فلا توقظن نائمهم»، فتوعده الحارث باجتياث أصولهم ونفي فلهم إلى اليابس الجدد والنازح الثمد، فلما غزاهم اقتتلوا قتالاً شديداً فانهزم الحارث وبنو غسان وقتل أخو الحارث في عدد كثير، وقال فيه عمرو بن كلثوم معلقته {cite:kamil-ibn-al-athir p. 403}."
  en: "The Ghassanid king al-Harith ibn Abi Shamir's war on Taghlib: ungreeted by their riders on his march, he swore a raid that 'would leave them wide-awake for his coming'; Amr ibn Kulthum answered that peoples wake only to their own counsel — and when al-Harith invaded he was routed and his brother slain, the occasion of Amr's great qasida {cite:kamil-ibn-al-athir p. 403}."
  es: "La guerra del rey gasánida al-Harith ibn Abi Shamir contra Taghlib: al no ser recibido por sus jinetes en su marcha, juró una incursión que \"los dejaría bien despiertos para su llegada\"; Amr ibn Kulthum respondió que los pueblos solo despiertan a sus propios consejos, y cuando al-Harith invadió fue derrotado y su hermano asesinado, ocasión de la gran qasida de Amr {cite:kamil-ibn-al-athir p. 403}."
  fr: "La guerre du roi ghassanide al-Harith ibn Abi Shamir contre Taghlib: n'étant pas accueilli par leurs cavaliers lors de sa marche, il jura un raid qui « les laisserait bien éveillés à son arrivée »; Amr ibn Kulthum répondit que les peuples ne s'éveillent qu'à leurs propres conseils — et lorsqu'al-Harith envahit, il fut mis en déroute et son frère tué, ce qui donna lieu à la grande qasida d'Amr {cite:kamil-ibn-al-athir p. 403}."
  ur: "غسانی بادشاہ الحارث ابن ابی شمر کی تغلب کے خلاف جنگ: ان کے سواروں کی طرف سے اس کے مارچ پر ان کا استقبال نہ کرتے ہوئے، اس نے ایک چھاپہ مارنے کی قسم کھائی کہ 'ان کے آنے کے لیے انہیں بیدار چھوڑ دیں گے'؛ عمرو بن کلثوم نے جواب دیا کہ لوگ صرف اپنے مشورے پر جاگتے ہیں - اور جب حارث نے حملہ کیا تو وہ مارا گیا اور اس کا بھائی مارا گیا، عمرو کے عظیم قصیدہ کے موقع پر۔ 403}۔"
  tr: "El-Harith bin Abi Şamir el-Gassanî'nin (lakabı El-A'raj) Beni Tağlib'e yaptığı baskın; Gassan kralı Levant'a gitti ve Beni Tağlib'in bazı üyelerinin yanından geçti, ancak onu karşılamadılar. Bunun üzerine onları tehdit etti: \"Onları öyle bir baskınla yağmalayacağım ki, ben geldiğimde uyanık kalacaklar.\" Amr bin Kulsum ona şöyle cevap verdi: \"Hiçbir topluluk uyandığında, görüşleri yücelmiş ve toplulukları güçlenmiş olur; bu yüzden uyuyanlarını uyandırma.\" El-Harith, kökenlerini söküp, soylarını kurak yeni topraklara ve uzak baraja süreceğini söyleyerek onu tehdit etti. Baskın sırasında şiddetli bir savaş yaşandı ve El-Harith ile Beni Gassan yenildi. El-Harith'in kardeşi büyük bir kalabalıkla öldürüldü ve Amr bin Kulsum onun hakkında Mu'allaqa'sını söyledi. {Kaynak: Kamil-ibn-al-athir s. 403}"
  id: "Serangan Al-Harith bin Abi Shamir Al-Ghassani, yang dijuluki Al-A’raj, terhadap Bani Taghlib; raja Ghassan pergi ke Levant dan melewati beberapa Bani Taghlib, tetapi mereka tidak menerimanya, sehingga ia mengancam mereka, “Aku akan menyerang mereka dengan serangan yang akan membuat mereka terjaga menantikan kedatanganku.” Amr bin Kulthum menjawabnya, “Tidak ada kaum yang pernah terbangun kecuali pendapat mereka menjadi mulia dan kelompok mereka menjadi kuat, jadi jangan membangunkan mereka yang sedang tidur.” Al-Harith mengancamnya untuk mencabut asal-usul mereka dan mengusir keturunan mereka ke tanah baru yang kering dan bendungan yang jauh. Ketika ia menyerang mereka, mereka bertempur dengan sengit, dan Al-Harith dan Bani Ghassan dikalahkan, dan saudara laki-laki Al-Harith terbunuh dalam jumlah besar, dan Amr bin Kulthum mengatakan tentangnya Mu’allaqa-nya {kutip:kamil-ibn-al-athir hlm. 403}."
