label: { ar: "حرب الحارث الأعرج على بني تغلب" }
summary:
  ar: "غزوة الحارث بن أبي شمر الغساني الملقب الأعرج على بني تغلب؛ خرج ملك غسان بالشام فمر بأفاريق من تغلب فلم يستقبلوه فتوعدهم «لأغزونهم غزوة تتركهم أيقاظاً لقدومي»، فرد عليه عمرو بن كلثوم «ما استيقظ قوم قط إلا نبل رأيهم وعزت جماعتهم فلا توقظن نائمهم»، فتوعده الحارث باجتياث أصولهم ونفي فلهم إلى اليابس الجدد والنازح الثمد، فلما غزاهم اقتتلوا قتالاً شديداً فانهزم الحارث وبنو غسان وقتل أخو الحارث في عدد كثير، وقال فيه عمرو بن كلثوم معلقته {cite:kamil-ibn-al-athir p. 403}."
  en: "The Ghassanid king al-Harith ibn Abi Shamir's war on Taghlib: ungreeted by their riders on his march, he swore a raid that 'would leave them wide-awake for his coming'; Amr ibn Kulthum answered that peoples wake only to their own counsel — and when al-Harith invaded he was routed and his brother slain, the occasion of Amr's great qasida {cite:kamil-ibn-al-athir p. 403}."
