label:
  ar: "السيوطي يحيي إملاء الحديث في جامع ابن طولون، ٨٧٢هـ/١٤٦٧م"
  en: "Al-Suyuti revives hadith dictation at the mosque of Ibn Tulun, 872/1467"
  ur: "سیوطی کا جامع ابن طولون میں املاء حدیث کی تجدید، 872ھ/1467ء"
summary:
  ar: "سنة ٨٧٢هـ/١٤٦٧م استأنف السيوطي تقليد إملاء الحديث في جامع ابن طولون، حيث كان أبوه قد خطب، وكانت هذه الطريقة قد انقطعت منذ نحو عشرين سنة بوفاة ابن حجر العسقلاني {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  en: "In 872/1467 al-Suyuti took up again the tradition of dictating hadith (imlaʿ) in the mosque of Ibn Tulun, where his father had been a preacher; the practice had lapsed some twenty years earlier at the death of Ibn Hajar al-ʿAsqalani {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  ur: "872ھ/1467ء میں سیوطی نے جامع ابن طولون میں — جہاں ان کے والد خطیب رہے تھے — املاء حدیث کی روایت دوبارہ جاری کی؛ یہ طریقہ ابن حجر عسقلانی کی وفات کے بعد تقریباً بیس سال سے منقطع تھا {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}۔"
