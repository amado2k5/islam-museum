label: { ar: "استدعاء ملك خوارزم قتيبة على أخيه", en: "Khwarizm's King Summoning Qutayba against his Brother", es: "El rey de Khwarizm convoca a Qutayba contra su hermano.", fr: "Le roi du Khwarezm convoque Qutayba contre son frère", ur: "خوارزم کے بادشاہ کا قتیبہ کو اپنے بھائی کے خلاف بلانا" }
summary:
  ar: "كان ملك خوارزم ضعيفاً وكان أخوه خرزاد قد ضاده وقوي عليه فبعث ملك خوارزم إلى قتيبة إني أعطيك كذا وكذا وأدفع إليك المفاتيح على أن تملكني على بلادي دون أخي وخوارزم ثلاث مدائن يحاط بها فارقين ومدينة الفيل أحصنها وقال علي بن مجاهد إنما مدينة الفيل سمرقند فنزل الملك أحصن المدائن وبعث إلى قتيبة بالمال."
  en: "Khwarizm's king, weak, with his brother Khurrazad risen strong against him, sent Qutayba an offer: so much money and the keys, if Qutayba would make him king over his lands instead. Khwarizm is three cities ringed by Fariqin, Madinat al-Fil the strongest — Ali ibn Mujahid says Madinat al-Fil is Samarqand — where the king took his seat and sent on the money."
  es: "El rey de Corasmia, debilitado y con su hermano Khurrazad fortalecido en su contra, le hizo una oferta a Qutayba: una gran suma de dinero y las llaves, a cambio de que Qutayba lo nombrara rey de sus tierras. Corasmia consta de tres ciudades rodeadas por Fariqin, siendo Madinat al-Fil la más poderosa —Ali ibn Mujahid afirma que Madinat al-Fil es Samarcanda—, donde el rey tomó posesión de su trono y envió el dinero."
  fr: "Le roi du Khwarezm, affaibli et confronté à la puissante opposition de son frère Khourrazad, fit une proposition à Qutayba: une somme d’argent considérable et les clés de ses terres, en échange de quoi Qutayba le nommerait roi. Le Khwarezm est composé de trois villes entourées par Fariqin, dont Madinat al-Fil, la plus importante (identifiée à Samarcande par Ali ibn Mujahid), où le roi s’installa et envoya l’argent."
  ur: "خوارزم کا بادشاہ، کمزور، اپنے بھائی خرزاد کے ساتھ اس کے خلاف مضبوط کھڑا ہوا، قتیبہ کو ایک پیشکش بھیجی: اتنی رقم اور چابیاں، اگر قتیبہ اس کی بجائے اسے اپنی زمینوں کا بادشاہ بنا دے۔ خوارزم تین شہر ہیں جو فارقین کے ہاتھ میں ہیں، مدینۃ الفل سب سے مضبوط - علی ابن مجاہد کہتے ہیں کہ مدینۃ الفل سمرقند ہے - جہاں بادشاہ نے اپنی نشست سنبھالی اور رقم بھیجی۔"
