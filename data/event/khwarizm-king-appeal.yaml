summary:
  ar: "كان ملك خوارزم ضعيفاً وكان أخوه خرزاد قد ضاده وقوي عليه فبعث ملك خوارزم إلى قتيبة إني أعطيك كذا وكذا وأدفع إليك المفاتيح على أن تملكني على بلادي دون أخي وخوارزم ثلاث مدائن يحاط بها فارقين ومدينة الفيل أحصنها وقال علي بن مجاهد إنما مدينة الفيل سمرقند فنزل الملك أحصن المدائن وبعث إلى قتيبة بالمال."
  en: "Khwarizm's king, weak, with his brother Khurrazad risen strong against him, sent Qutayba an offer: so much money and the keys, if Qutayba would make him king over his lands instead. Khwarizm is three cities ringed by Fariqin, Madinat al-Fil the strongest — Ali ibn Mujahid says Madinat al-Fil is Samarqand — where the king took his seat and sent on the money."
