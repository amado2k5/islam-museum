  fr: "Carte de projet pour la chute de Tlemcen en 1518, la prise de la capitale zayyanide par Aruj Barberousse et sa mort cette année-là; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1518 میں Tlemcen کے زوال کے لیے ڈرافٹ کارڈ، Aruj Barbarossa کی طرف سے Zyyanid دارالحکومت پر قبضہ اور اسی سال اس کی موت؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1518 yılında Tlemcen'in düşüşü, Banu Zayyan'ın başkentinin Aruj Barbarossa tarafından işgali ve Al-Mansar'da ölümüyle ilgili ön bilgiler; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang jatuhnya Tlemcen pada tahun 1518 M, pendudukan ibu kota Banu Zayyan oleh Aruj Barbarossa dan kematiannya di Al-Mansar; sumber-sumbernya belum ditinjau di halaman ini."
