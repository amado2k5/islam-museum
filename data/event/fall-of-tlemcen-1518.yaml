summary:
  ar: "بطاقة أولية لسقوط تلمسان سنة ١٥١٨م، احتلال عروج بربروسا لعاصمة بني زيان ومقتله في المنسر؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Fall of Tlemcen in 1518, Aruj Barbarossa's capture of the Zayyanid capital and his death that year; its sources are not yet checked on the page."
