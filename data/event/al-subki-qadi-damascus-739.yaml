label:
  ar: "السبكي قاضي قضاة دمشق، ٧٣٩هـ"
  en: "Al-Subki becomes chief qadi of Damascus, 739/1339"
  ur: "سبکی دمشق کے قاضی القضاة، 739ھ/1339ء"
summary:
  ar: "في سنة ٧٣٩هـ قدِم القاضي تقي الدين علي بن عبد الكافي السبكي الشافعي من الديار المصرية حاكماً على دمشق وأعمالها، ففرح الناس به لعلمه وديانته وأمانته، ونزل بالعادلية الكبيرة على عادة من تقدّمه، ودرّس بالغزالية والأتابكية، وكانت ولايته بعد وفاة قاضي القضاة جلال الدين محمد بن عبد الرحمن القزويني {cite:al-bidaya-wal-nihaya s.a. 739 pp. 195-196}؛ ودام في الحكم نحو سبع عشرة سنة {cite:al-bidaya-wal-nihaya s.a. 756 p. 264}."
  en: "In 739 AH Taqi al-Din al-Subki came from Egypt as judge of Damascus and its districts; the people rejoiced at his learning, piety and honesty. He lodged at the Adiliyya al-Kubra as his predecessors had, taught at the Ghazzaliyya and the Atabakiyya, and succeeded the late chief qadi Jalal al-Din Muhammad ibn Abd al-Rahman al-Qazwini {cite:al-bidaya-wal-nihaya s.a. 739 pp. 195-196}. He held the bench about seventeen years {cite:al-bidaya-wal-nihaya s.a. 756 p. 264}."
  ur: "739ھ میں تقی الدین سبکی مصر سے دمشق اور اس کے اطراف کے قاضی بن کر آئے؛ لوگ ان کے علم، دینداری اور امانت پر خوش ہوئے۔ وہ روایتی طور پر عادلیہ کبریٰ میں ٹھہرے، غزالیہ اور اتابکیہ میں تدریس کی، اور جلال الدین محمد بن عبد الرحمٰن قزوینی کے منصب پر فائز ہوئے {cite:al-bidaya-wal-nihaya s.a. 739 pp. 195-196}۔ وہ تقریباً سترہ برس قاضی رہے {cite:al-bidaya-wal-nihaya s.a. 756 p. 264}۔"
