label: { ar: "مقتل السلطان ألب أرسلان وقيام ملكشاه", en: "The killing of Sultan Alp Arslan and the accession of Malikshah", es: "El asesinato del sultán Alp Arslan y la ascensión al trono de Malikshah", fr: "L'assassinat du sultan Alp Arslan et l'accession au trône de Malikshah" }
summary:
  ar: "في سنة خمس وستين وأربعمائة عبر السلطان ألب أرسلان جيحون على جسر مُدّه ومعه زيادة على مائتي ألف فارس يقصد بخارا، فأُتي بصاحب قلعة يعرف بيوسف الخوارزمي أسيرًا في سادس ربيع الأول، فشتمه السلطان وتقدّم بأن يُضرب له أربعة أوتاد وتُشد أطرافه إليها، فقال يوسف: يا مخنث، مثلي يُقتل هذه القتلة؟ فاحتدّ السلطان وأخذ القوس والنشابة وأمر غلاميه بإطلاقه فرماه بسهم فأخطأ، فعدا يوسف إليه وكان جالسًا على سدة فنهض لينزل فعثر ووقع على وجهه، فوثب عليه يوسف فضربه بسكين كانت معه في خاصرته، ولحقه الجند فقتلوه وشُدّت جراحة السلطان وعاد بهم إلى جيحون فتوفى يوم السبت عاشر ربيع الأول. فلما مات جُمع العسكر وجلس ولده ملكشاه على سدة الملك والأمراء قيام، فقال نظام الملك: تكلّم أيها السلطان، فقال: الأكبر منكم أبي، والأوسط انحى، والأصغر ولدي، وسأفعل معكم ما لم يُسبق إليه — فأجابوا بالسمع والطاعة، وتولّى نظام الملك وأبو سعد المستوفي أخذ البيعة له. وكان قد بلغ أهل بخارا عبوره فاجتمع الصالحون وصاموا ودعوا عليه فهلك {cite:muntazam-ibn-al-jawzi j.8 p.618-619}. وكان عمره حين قُتل أربعين سنة وخمسة أشهر، وكانت ولايته تسع سنين وستة أشهر {cite:muntazam-ibn-al-jawzi j.8 p.640}."
  en: "Crossing the Oxus toward Bukhara with more than two hundred thousand horse, Alp Arslan had the captured fortress-commander Yusuf al-Khwarizmi brought before him and ordered him staked; Yusuf sneered 'shall the likes of me die such a death?', the sultan seized bow and arrows, shot and missed, stumbled rising from his dais — and Yusuf was on him with a knife in his side. The attendants killed Yusuf; the sultan's wound was bound and he died back at the Oxus on Saturday 10 Rabi' I 465, aged forty years and five months, after nine years and six months of rule. On his dais his son Malikshah spoke his first command — 'the eldest of you is my father, the middle my uncle, the youngest my son, and I shall do for you what has not been done before' — and the army gave bay'a through Nizam al-Mulk and Abu Sa'd the mustawfi {cite:muntazam-ibn-al-jawzi j.8 p.618-619,640}."
  es: "Al cruzar el Oxus hacia Bujará con más de doscientos mil jinetes, Alp Arslan mandó traer ante él al comandante de la fortaleza capturado, Yusuf al-Khwarizmi, y ordenó que lo empalaran. Yusuf se burló: \"¿Acaso alguien como yo morirá de esa manera?\". El sultán tomó un arco y flechas, disparó y falló, tropezó al levantarse de su estrado, y Yusuf se abalanzó sobre él con un cuchillo clavado en el costado. Los sirvientes mataron a Yusuf; le vendaron la herida y murió de regreso en el Oxus el sábado 10 de Rabi' I de 465, a la edad de cuarenta años y cinco meses, después de nueve años y seis meses de reinado. En su estrado, su hijo Malikshah pronunció su primera orden: «El mayor de vosotros es mi padre, el del medio mi tío, el menor mi hijo, y haré por vosotros lo que no se ha hecho antes», y el ejército prestó juramento de lealtad a través de Nizam al-Mulk y Abu Sa'd el mustawfi {cite:muntazam-ibn-al-jawzi j.8 p.618-619,640}."
  fr: "Traversant l'Oxus en direction de Boukhara avec plus de deux cent mille cavaliers, Alp Arslan fit amener devant lui le commandant de la forteresse, Yusuf al-Khwarizmi, et ordonna qu'on l'empale. Yusuf, narquois, lança: « Un homme comme moi devrait-il mourir ainsi ? » Le sultan s'empara d'un arc et de flèches, décocha une flèche, mais manqua sa cible. Se relevant péniblement de son estrade, il découvrit Yusuf sur lui, un couteau planté dans le flanc. Les gardes achevèrent Yusuf; la blessure du sultan fut pansée et il mourut sur les rives de l'Oxus le samedi 10 Rabi' I 465, à l'âge de quarante ans et cinq mois, après neuf ans et six mois de règne. Sur son estrade, son fils Malikshah prononça son premier ordre: « L'aîné d'entre vous est mon père, le deuxième mon oncle, le plus jeune mon fils, et je ferai pour vous ce qui n'a jamais été fait auparavant » — et l'armée prêta allégeance par l'intermédiaire de Nizam al-Mulk et d'Abu Sa'd le mustawfi {cite:muntazam-ibn-al-jawzi j.8 p.618-619,640}."
