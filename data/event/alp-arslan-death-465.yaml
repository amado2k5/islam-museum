label: { ar: "مقتل السلطان ألب أرسلان وقيام ملكشاه", en: "The killing of Sultan Alp Arslan and the accession of Malikshah", es: "El asesinato del sultán Alp Arslan y la ascensión al trono de Malikshah", fr: "L'assassinat du sultan Alp Arslan et l'accession au trône de Malikshah", ur: "سلطان الپ ارسلان کا قتل اور ملک شاہ کا الحاق", tr: "Sultan Alp Arslan'ın ölümü ve Malik Şah'ın yükselişi", id: "Kematian Sultan Alp Arslan dan naiknya Malik Shah" }
summary:
  ar: "في سنة خمس وستين وأربعمائة عبر السلطان ألب أرسلان جيحون على جسر مُدّه ومعه زيادة على مائتي ألف فارس يقصد بخارا، فأُتي بصاحب قلعة يعرف بيوسف الخوارزمي أسيرًا في سادس ربيع الأول، فشتمه السلطان وتقدّم بأن يُضرب له أربعة أوتاد وتُشد أطرافه إليها، فقال يوسف: يا مخنث، مثلي يُقتل هذه القتلة؟ فاحتدّ السلطان وأخذ القوس والنشابة وأمر غلاميه بإطلاقه فرماه بسهم فأخطأ، فعدا يوسف إليه وكان جالسًا على سدة فنهض لينزل فعثر ووقع على وجهه، فوثب عليه يوسف فضربه بسكين كانت معه في خاصرته، ولحقه الجند فقتلوه وشُدّت جراحة السلطان وعاد بهم إلى جيحون فتوفى يوم السبت عاشر ربيع الأول. فلما مات جُمع العسكر وجلس ولده ملكشاه على سدة الملك والأمراء قيام، فقال نظام الملك: تكلّم أيها السلطان، فقال: الأكبر منكم أبي، والأوسط انحى، والأصغر ولدي، وسأفعل معكم ما لم يُسبق إليه — فأجابوا بالسمع والطاعة، وتولّى نظام الملك وأبو سعد المستوفي أخذ البيعة له. وكان قد بلغ أهل بخارا عبوره فاجتمع الصالحون وصاموا ودعوا عليه فهلك {cite:muntazam-ibn-al-jawzi j.8 p.618-619}. وكان عمره حين قُتل أربعين سنة وخمسة أشهر، وكانت ولايته تسع سنين وستة أشهر {cite:muntazam-ibn-al-jawzi j.8 p.640}."
  en: "Crossing the Oxus toward Bukhara with more than two hundred thousand horse, Alp Arslan had the captured fortress-commander Yusuf al-Khwarizmi brought before him and ordered him staked; Yusuf sneered 'shall the likes of me die such a death?', the sultan seized bow and arrows, shot and missed, stumbled rising from his dais — and Yusuf was on him with a knife in his side. The attendants killed Yusuf; the sultan's wound was bound and he died back at the Oxus on Saturday 10 Rabi' I 465, aged forty years and five months, after nine years and six months of rule. On his dais his son Malikshah spoke his first command — 'the eldest of you is my father, the middle my uncle, the youngest my son, and I shall do for you what has not been done before' — and the army gave bay'a through Nizam al-Mulk and Abu Sa'd the mustawfi {cite:muntazam-ibn-al-jawzi j.8 p.618-619,640}."
  es: "Al cruzar el Oxus hacia Bujará con más de doscientos mil jinetes, Alp Arslan mandó traer ante él al comandante de la fortaleza capturado, Yusuf al-Khwarizmi, y ordenó que lo empalaran. Yusuf se burló: \"¿Acaso alguien como yo morirá de esa manera?\". El sultán tomó un arco y flechas, disparó y falló, tropezó al levantarse de su estrado, y Yusuf se abalanzó sobre él con un cuchillo clavado en el costado. Los sirvientes mataron a Yusuf; le vendaron la herida y murió de regreso en el Oxus el sábado 10 de Rabi' I de 465, a la edad de cuarenta años y cinco meses, después de nueve años y seis meses de reinado. En su estrado, su hijo Malikshah pronunció su primera orden: «El mayor de vosotros es mi padre, el del medio mi tío, el menor mi hijo, y haré por vosotros lo que no se ha hecho antes», y el ejército prestó juramento de lealtad a través de Nizam al-Mulk y Abu Sa'd el mustawfi {cite:muntazam-ibn-al-jawzi j.8 p.618-619,640}."
  fr: "Traversant l'Oxus en direction de Boukhara avec plus de deux cent mille cavaliers, Alp Arslan fit amener devant lui le commandant de la forteresse, Yusuf al-Khwarizmi, et ordonna qu'on l'empale. Yusuf, narquois, lança: « Un homme comme moi devrait-il mourir ainsi ? » Le sultan s'empara d'un arc et de flèches, décocha une flèche, mais manqua sa cible. Se relevant péniblement de son estrade, il découvrit Yusuf sur lui, un couteau planté dans le flanc. Les gardes achevèrent Yusuf; la blessure du sultan fut pansée et il mourut sur les rives de l'Oxus le samedi 10 Rabi' I 465, à l'âge de quarante ans et cinq mois, après neuf ans et six mois de règne. Sur son estrade, son fils Malikshah prononça son premier ordre: « L'aîné d'entre vous est mon père, le deuxième mon oncle, le plus jeune mon fils, et je ferai pour vous ce qui n'a jamais été fait auparavant » — et l'armée prêta allégeance par l'intermédiaire de Nizam al-Mulk et d'Abu Sa'd le mustawfi {cite:muntazam-ibn-al-jawzi j.8 p.618-619,640}."
  ur: "دو لاکھ سے زیادہ گھوڑوں کے ساتھ بخارا کی طرف آکسس کو عبور کرتے ہوئے، الپ ارسلان نے قبضہ کر لیا قلعہ کے کمانڈر یوسف الخوارزمی کو اپنے سامنے لایا اور اسے داؤ پر لگانے کا حکم دیا۔ یوسف نے طعنہ دیا کہ 'کیا مجھ جیسے لوگ ایسی موت مریں گے؟'، سلطان نے کمان اور تیر پکڑ لیے، گولی ماری اور چھوٹ گئے، اپنی منزل سے اٹھتے ہوئے لڑکھڑا گئے - اور یوسف اس کے پہلو میں چھری لیے ہوئے تھا۔ حاضرین نے یوسف کو قتل کر دیا۔ سلطان کا زخم بند تھا اور وہ نو سال اور چھ ماہ کی حکمرانی کے بعد 10 ربیع الثانی 465 بروز ہفتہ، چالیس سال اور پانچ ماہ کی عمر میں آکسس میں واپس مر گیا۔ ان کے تخت پر اس کے بیٹے ملک شاہ نے اپنا پہلا حکم دیا - 'تم میں سب سے بڑا میرا باپ، درمیانی میرا چچا، سب سے چھوٹا میرا بیٹا، اور میں تمہارے لیے وہ کروں گا جو پہلے نہیں کیا گیا' - اور فوج نے نظام الملک اور ابو سعد مستوفی کے ذریعے بیعت کی۔"
  tr: "Hicri 465 yılında Sultan Alp Arslan, iki yüz binden fazla süvariyle birlikte Buhara'ya doğru giderken, bir köprüden geçerek Oxus Nehri'ni (Amu Darya) geçti. Rabi'ü'l-Evvel ayının altıncı gününde, Yusuf el-Harezmi adındaki bir kale sahibi esir olarak getirildi. Sultan ona hakaret etti ve vücuduna dört kazık çakılmasını ve uzuvlarının bunlara bağlanmasını emretti. Yusuf, \"Ey kadınsı olan, benim gibi biri böyle mi öldürülecek?\" dedi. Sultan öfkelendi, ok ve yayını aldı ve iki hizmetkarına onu serbest bırakmalarını emretti. Ona bir ok attı ama ıskaladı. Yusuf ona doğru koştu, o bir platformda oturuyordu. Aşağı inmek için kalktı ama tökezleyip yüzüstü yere düştü. Yusuf üzerine atladı ve yanında bulunan bıçakla onu yanından bıçakladı. Askerler ona yetişip öldürdüler. Sultanın yarası sarıldı ve onlarla birlikte Oxus Nehri'ne döndü; orada Rebiü'l-Evvel ayının onuncu günü, Cumartesi günü öldü. Ölümünün ardından ordu toplandı ve emirler ayakta dururken oğlu Malikşah tahta çıktı. Nizam el-Mulk, \"Konuşun, ey Sultan\" dedi. Sultan, \"Aranızdaki en büyük benim babam, ortanca olan benim oğlum, en küçük olan da benim oğlumdur. Sizin için daha önce hiç yapılmamış bir şey yapacağım\" diye cevap verdi. Emirler itaat ve teslimiyetle karşılık verdiler. Nizam el-Mulk ve Ebu Sa'd el-Mustavfi daha sonra onun adına biat yemini alma işini üstlendiler. Onun geliş haberi Buhara halkına ulaşmıştı, bu yüzden dindarlar toplandı, oruç tuttular ve ona karşı dua ettiler; böylece Sultan öldü. Öldürüldüğünde kırk yaş beş aylıktı ve saltanatı dokuz yıl altı ay sürmüştü."
  id: "Pada tahun 465 H, Sultan Alp Arslan menyeberangi Sungai Oxus (Amu Darya) melalui jembatan, diiringi lebih dari dua ratus ribu pasukan berkuda, menuju Bukhara. Pemilik benteng yang dikenal sebagai Yusuf al-Khwarizmi dibawa sebagai tawanan pada tanggal enam Rabi' al-Awwal. Sultan menghinanya dan memerintahkan agar empat tiang ditancapkan ke tubuhnya dan anggota badannya diikatkan ke tiang-tiang tersebut. Yusuf berkata: \"Wahai orang banci, apakah orang seperti aku harus dibunuh dengan cara ini?\" Sultan menjadi marah, mengambil busur dan anak panah, dan memerintahkan kedua pelayannya untuk membebaskannya. Ia menembakkan anak panah ke arahnya tetapi meleset. Yusuf berlari menghampirinya, dan ia sedang duduk di atas sebuah platform. Ia bangkit untuk turun, tetapi tersandung dan jatuh tersungkur. Yusuf melompat ke arahnya dan menusuknya di bagian samping dengan pisau yang dibawanya. Para prajurit mengejarnya dan membunuhnya. Luka Sultan dibalut, dan ia kembali bersama mereka ke Sungai Oxus, tempat ia wafat pada hari Sabtu, tanggal sepuluh Rabi' al-Awwal. Ketika ia wafat, pasukan dikumpulkan, dan putranya Malikshah naik tahta sementara para emir berdiri. Nizam al-Mulk berkata, \"Bicaralah, wahai Sultan.\" Ia menjawab, \"Yang tertua di antara kalian adalah ayahku, yang tengah adalah putraku, dan yang termuda adalah putraku. Aku akan melakukan untuk kalian apa yang belum pernah dilakukan sebelumnya.\" Mereka menanggapi dengan ketaatan dan kepatuhan. Nizam al-Mulk dan Abu Sa'd al-Mustawfi kemudian bertugas menerima sumpah setia untuknya. Kabar kedatangannya telah sampai kepada penduduk Bukhara, sehingga orang-orang saleh berkumpul, berpuasa, dan berdoa untuknya, dan ia pun binasa. Ia berusia empat puluh tahun lima bulan ketika ia terbunuh, dan masa pemerintahannya telah berlangsung selama sembilan tahun enam bulan."
