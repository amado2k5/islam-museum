summary:
  ar: "في ليلة الأربعاء السادس عشر من صفر سنة ثلاث وسبعين وثلثمائة ظهر كوكب له ذنب من مغرب دلو إلى قطب الجدي صعد إلى دائرة البروج، فكان أهل بغداد يصفرون عنده ويقولون: انظر إليه، وبقي إلى ما بعد طلوع الفجر {cite:muntazam-ibn-al-jawzi j.7 p.131}."
  en: "On the night of Wednesday 16 Safar 373 a tailed star appeared from Aquarius in the west toward Capricorn, rising into the zodiac; the people of Baghdad whistled and pointed at it, and it stayed past dawn {cite:muntazam-ibn-al-jawzi j.7 p.131}."
  fr: "Dans la nuit du mercredi 16 Safar 373, une étoile à queue apparut depuis le Verseau à l'ouest vers le Capricorne, s'élevant dans le zodiaque ; les gens de Bagdad sifflaient et la montraient du doigt, et elle demeura au-delà de l'aube {cite:muntazam-ibn-al-jawzi j.7 p.131}."
  es: "En la noche del miércoles 16 de Safar 373 apareció una estrella con cola desde Acuario en el oeste hacia Capricornio, ascendiendo en el zodíaco; la gente de Bagdad silbó y la señaló, y permaneció allí más allá del amanecer {cite:muntazam-ibn-al-jawzi j.7 p.131}."
  ur: "بدھ 16 صفر 373 کی رات کو ایک دم والا ستارہ مغرب میں کوب سے مکر کی طرف نمودار ہوا، رقم میں بڑھتا ہوا؛ بغداد کے لوگوں نے سیٹی بجائی اور اس کی طرف اشارہ کیا، اور یہ طلوع فجر سے گزر گیا۔"
