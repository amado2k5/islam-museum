  tr: "Bu metin, 996-998 yılları arasında Allaqah önderliğindeki Sur halkının Fatimilere karşı ayaklanmasını konu alan Sur isyanının ön anlatımını içermektedir; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan awal tentang pemberontakan Tirus pada tahun 996–998 M, di mana penduduknya, yang dipimpin oleh Allaqah, memberontak melawan Dinasti Fatimiyah; sumber-sumber yang tercantum di halaman ini belum ditinjau."
