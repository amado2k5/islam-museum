label:
  ar: "ابن الأبار كاتبًا في ديوان ولاة بلنسية المؤمنيين، نحو ٦٣٠هـ"
  en: "Ibn al-Abbar acts as secretary to the Mu'minid governors of Valencia, ~630/1233"
  ur: "ابن ابار بلنسیہ کے مؤمنی حکمرانوں کے کاتب ہوئے، ~630ھ/1233ء"
summary:
  ar: "رحل ابن الأبار في جزيرة الأندلس رحلات في طلب العلم، ثم عمل كاتبًا لولاة بلنسية من بني مؤمن (آل ابن مردنيش) في أواخر عهد قضاعة المحلي، قبل أن يسقط حكمهم بسقوط المدينة سنة ٦٣٦هـ {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}."
  en: "After several journeys in the Peninsula fi talab al-'ilm, Ibn al-Abbar acted as secretary to the Mu'minid (Ibn Mardanish's) governors of Valencia in the last years of local Quda'i rule, before their government fell with the city in 636/1238 {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}."
  ur: "جزیرہ نما اسپین میں طلب علم کے چند سفر کے بعد ابن ابار نے بلنسیہ کے مؤمنی (آل ابن مردنیش) حکمرانوں کے کاتب کی حیثیت سے خدمت کی، یہ ان آخری برسوں میں جب شہر 636ھ/1238ء میں سقوط کو پہنچا {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}."
