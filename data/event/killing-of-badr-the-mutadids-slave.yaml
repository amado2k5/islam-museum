label: { ar: "مقتل بدر غلام المعتضد", en: "The killing of Badr, the slave of al-Mu'tadid" }
summary:
  ar: "في سنة تسع وثمانين ومائتين ذكر الطبري مقتل بدر غلام المعتضد؛ وذكر أن القاسم بن عبيد الله خشي أن يقدم بدر على المكتفى فيخبره بما همّ به القاسم من صرف الخلافة عن ولد المعتضد، فسعى في هلاكه {cite:tabari-tarikh-abu-al-fadl j.10 p.89}."
  en: "In the year 289 al-Tabari mentions the killing of Badr, the slave of al-Mu'tadid. He reports that al-Qasim ibn Ubayd Allah feared that Badr would go to al-Muktafi and tell him of what al-Qasim had resolved, namely turning the caliphate away from the sons of al-Mu'tadid, so he sought Badr's destruction {cite:tabari-tarikh-abu-al-fadl j.10 p.89}."
