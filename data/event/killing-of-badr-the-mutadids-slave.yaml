id: event/killing-of-badr-the-mutadids-slave
class: event
kind: death
label: { ar: "مقتل بدر غلام المعتضد", en: "The killing of Badr, the slave of al-Mu'tadid", es: "El asesinato de Badr, el esclavo de al-Mu'tadid", fr: "Le meurtre de Badr, l'esclave d'al-Mu'tadid", ur: "معتدد کے غلام بدر کا قتل" }
summary:
  ar: "في سنة تسع وثمانين ومائتين ذكر الطبري مقتل بدر غلام المعتضد؛ وذكر أن القاسم بن عبيد الله خشي أن يقدم بدر على المكتفى فيخبره بما همّ به القاسم من صرف الخلافة عن ولد المعتضد، فسعى في هلاكه {cite:tabari-tarikh-abu-al-fadl j.10 p.89}."
  en: "In the year 289 al-Tabari mentions the killing of Badr, the slave of al-Mu'tadid. He reports that al-Qasim ibn Ubayd Allah feared that Badr would go to al-Muktafi and tell him of what al-Qasim had resolved, namely turning the caliphate away from the sons of al-Mu'tadid, so he sought Badr's destruction {cite:tabari-tarikh-abu-al-fadl j.10 p.89}."
  es: "En el año 289, al-Tabari menciona el asesinato de Badr, el esclavo de al-Mu'tadid. Relata que al-Qasim ibn Ubayd Allah temía que Badr fuera a ver a al-Muktafi y le contara lo que al-Qasim había decidido, a saber, apartar el califato de los hijos de al-Mu'tadid, por lo que buscó la destrucción de Badr {cite:tabari-tarikh-abu-al-fadl j.10 p.89}."
  fr: "En l'an 289, al-Tabari mentionne le meurtre de Badr, l'esclave d'al-Mu'tadid. Il rapporte qu'al-Qasim ibn Ubayd Allah craignait que Badr n'aille révéler à al-Muktafi la décision qu'al-Qasim avait prise, à savoir détourner le califat des fils d'al-Mu'tadid; il chercha donc à faire éliminer Badr (cite: Tabari-Tarikh-Abu-al-Fadl, vol. 10, p. 89)."
  ur: "الطبری نے 289 میں المتدید کے غلام بدر کے قتل کا ذکر کیا ہے۔ وہ بیان کرتے ہیں کہ القاسم بن عبید اللہ کو خدشہ تھا کہ بدر المکتفی کے پاس جائے گا اور اسے بتائے گا کہ القاسم نے کیا فیصلہ کیا ہے، یعنی خلافت کو المتعد کے بیٹوں سے ہٹانا ہے، اس لیے اس نے بدر کی تباہی کی کوشش کی۔"
