id: event/ibn-al-mulaqqin-talab-747
class: event
kind: gathering
label:
  ar: "طلب ابن الملقن الحديث على الرحبي ومغلطاي، نحو ٧٤٧هـ"
  en: "Ibn al-Mulaqqin's own quest for hadith under al-Rahbi and Mughaltay, about 747/1346"
  ur: "ابن ملقن کا ذاتی طلبِ حدیث، رحبی اور مغلطائے کے ہاں، تقریباً 747ھ/1346ء"
summary:
  ar: "طلب ابن الملقن الحديث بنفسه وعني به، وسمع الكثير من حفاظ عصره كابن عبد الدائم وغيره، وتخرج في الحديث بزين الدين الرحبي وعلاء الدين مغلطاي وكتب عنهما الكثير، وأكثر من تحصيل الأجزاء وسماع الكتب الكبار، وعني بالفقه فأخذ عن شيوخ عصره ومهّر في الفنون {cite:durar-kamina-jil-1993 dhayl pp. 121-122} {cite:shadharat-dhahab 7/44}."
  en: "Ibn al-Mulaqqin set out after hadith on his own account and heard much from the hafizes of his age — Ibn 'Abd al-Da'im and others of his circle — and graduated in hadith under Zayn al-Din al-Rahbi (d. 749) and 'Ala' al-Din Mughaltay, copying a great deal from them, gathering the ajza' and hearing the big books, while also taking fiqh from the shaykhs of his time until he mastered the disciplines {cite:durar-kamina-jil-1993 dhayl pp. 121-122} {cite:shadharat-dhahab 7/44}."
  ur: "ابن ملقن نے خود طلبِ حدیث کی، اپنے عصر کے حفاظ سے — ابن عبدالدائم اور ان کے حلقے کے دیگر علماء سے — کثیر سماعت کی، زین الدین رحبی ⁦(وفات 749ھ)⁩ اور علاء الدین مغلطائے سے حدیث کی تکمیل کی اور ان سے بے شمار نقل لکھی، اجزاء حاصل کیے اور بڑی کتابیں سنیں، اور اپنے عصر کے مشایخ سے فقہ بھی لیا جب تک فنون میں ماہر ہوئے {cite:durar-kamina-jil-1993 dhayl pp. 121-122} {cite:shadharat-dhahab 7/44}۔"
