id: event/turanshah-takes-zabid-569
class: event
kind: conquest
label: { ar: "ملك شمس الدولة زبيد ودخول اليمن", en: "Turanshah's conquest of Zabid (569 AH)", es: "La conquista de Zabid por Turanshah (569 AH)", fr: "La conquête de Zabid par Turanshah (569 AH)", ur: "توران شاہ کی فتح زبید ⁦(569ھ)⁩", tr: "Kral Şems el-Davla Zabid ve Yemen'e giriş", id: "Raja Shams al-Dawla Zabid dan masuknya ke Yaman" }
summary:
  ar: "استأذن صلاح الدين وأهله نور الدين في تسيير شمس الدولة تورانشاه إلى اليمن لقصد عبد النبي صاحب زبيد لأجل قطعه الخطبة العباسية، فأذن؛ وكان بمصر شاعر يقال له عمارة من أهل اليمن يحسن لشمس الدولة قصدها ويعظم البلاد في عينه فزادته رغبة، فجهز وجمع وسار عن مصر في مستهل رجب سنة تسع وستين وخمسمائة إلى مكة ومنها إلى زبيد؛ خرج إليه عبد النبي بعسكره فانهزم أهل زبيد ولم يجدوا على السور من يمنعهم فنصبوا السلالم وملكوا البلد عنوة ونهبوه، وأُسر عبد النبي وزوجته المدعوة بالحرة — وكانت امرأة صالحة كثيرة الصدقة على فقراء الحاج — وسلمه إلى سيف الدولة مبارك بن كامل من بني منقذ أصحاب شيزر يستخرج منه الأموال فدلّه على دفائن قبر أبيه، ثم دانت أهل زبيد وأقيمت فيها الخطبة العباسية {cite:kamil-ibn-al-athir p. 52-53}."
  en: "Rajab 569 (early 1174): with Nur al-Din's leave — for Abd al-Nabi of Zabid had cut the Abbasid khutba — Shams al-Dawla Turanshah marched from Egypt via Mecca, routed Abd al-Nabi outside Zabid, scaled its wall and sacked the town, taking him and his wife al-Hurra prisoner; Zabid submitted and the Abbasid khutba was proclaimed — the first move of the Ayyubid conquest of Yemen, urged on by the Yemeni poet Umara at Cairo {cite:kamil-ibn-al-athir p. 52-53}."
  es: "Rajab 569 (principios de 1174): con el permiso de Nur al-Din —pues Abd al-Nabi de Zabid había cortado la jutba abasí— Shams al-Dawla Turanshah marchó desde Egipto vía La Meca, derrotó a Abd al-Nabi a las afueras de Zabid, escaló su muralla y saqueó la ciudad, tomándolo prisionero a él y a su esposa al-Hurra; Zabid se sometió y se proclamó la jutba abasí —el primer paso de la conquista ayubí de Yemen, impulsada por el poeta yemení Umara en El Cairo {cite:kamil-ibn-al-athir p. 52-53}."
  fr: "Rajab 569 (début 1174): avec la permission de Nur al-Din — car Abd al-Nabi de Zabid avait interrompu le khutba abbasside — Shams al-Dawla Turanshah marcha d'Égypte via La Mecque, mit en déroute Abd al-Nabi aux portes de Zabid, escalada ses remparts et pilla la ville, faisant prisonnier Abd al-Nabi et son épouse al-Hurra; Zabid se soumit et le khutba abbasside fut proclamé — premier pas de la conquête ayyoubide du Yémen, encouragée par le poète yéménite Umara au Caire {cite: kamil-ibn-al-athir p. 52-53}."
  ur: "رجب 569 ⁦(1174 کے اوائل)⁩: نورالدین کی رخصت کے ساتھ - کیونکہ زبید کے عبد النبی نے عباسی خطبہ کاٹ دیا تھا - شمس الدولہ تورانشاہ نے مصر سے مکہ کے راستے کوچ کیا، عبد النبی کو زبید سے باہر نکالا، اس کی دیوار کو تراش لیا اور شہر کو توڑ دیا، اسے اور اس کی بیوی کو قید کر لیا۔ زبید نے عرض کیا اور عباسی خطبہ کا اعلان کیا گیا - یمن پر ایوبیوں کی فتح کا پہلا اقدام، جس کی تاکید یمنی شاعر عمارہ نے قاہرہ میں کی تھی۔ 52-53}۔"
  tr: "Selahaddin ve ailesi, Abbasilerin vaazlarını kesen Zebid hükümdarı Abdülnebi ile yüzleşmek üzere Şemsül-Devla Turanşah'ı Yemen'e göndermek için Nur-Din'den izin istediler. İzin verildi. Mısır'da, Yemen halkından Amara adında bir şair vardı; bu şair Şemsül-Devla'ya görevi için iyilik yapmış ve ülkesini onun gözünde yüceltmişti, bu da onun arzusunu artırmıştı. Bu yüzden hazırlıklarını yaptı, asker topladı ve Hicri 569 yılının Receb ayının başında Mısır'dan Mekke'ye, oradan da Zebid'e doğru yola çıktı. Abdülnebi ordusuyla birlikte ona doğru geldi ve Zebid halkı yenilgiye uğradı; surlarda onları durduracak kimse bulamadılar, bu yüzden merdivenler kurarak şehri zorla ele geçirdiler ve yağmaladılar. Abdülnebi ve eşi, hacıların fakirlerine çokça sadaka veren dindar bir kadın olan el-Hurra, yakalanarak Şeyzar'ın yöneticileri olan Beni Münkid kabilesinden Sayf el-Davla Mübarek bin Kamil'e teslim edildi. Ona babasının mezarındaki hazineleri gösterdi. Bunun üzerine Zebid halkı teslim oldu ve orada Abbasi hutbesi kuruldu. {Kaynak: Kamil ibn el-Athir s. 52-53}"
  id: "Saladin dan keluarganya meminta izin kepada Nur al-Din untuk mengirim Shams al-Dawla Turanshah ke Yaman untuk menghadapi Abd al-Nabi, penguasa Zabid, karena telah menghentikan dakwah Abbasiyah. Izin pun diberikan. Ada seorang penyair di Mesir bernama Amara, dari kalangan Yaman, yang bersikap baik kepada Shams al-Dawla atas misinya dan membuat negara itu tampak hebat di matanya, yang meningkatkan keinginannya. Maka ia mempersiapkan diri, mengumpulkan pasukan, dan berangkat dari Mesir pada awal bulan Rajab tahun 569 H ke Mekah dan dari sana ke Zabid. Abd al-Nabi datang menemuinya dengan pasukannya, dan penduduk Zabid dikalahkan dan mereka tidak menemukan siapa pun di tembok untuk menghentikan mereka, sehingga mereka memasang tangga dan menguasai kota itu dengan paksa dan menjarahnya. Abd al-Nabi dan istrinya, yang bernama al-Hurra - seorang wanita saleh yang banyak memberi sedekah kepada kaum miskin peziarah - ditangkap dan diserahkan kepada Sayf al-Dawla Mubarak bin Kamil dari Banu Munqidh, penguasa Shayzar, untuk memeras uang darinya. Ia memperlihatkan kepadanya harta karun makam ayahnya. Kemudian penduduk Zabid tunduk dan dakwah Abbasiyah ditegakkan di sana. {cite:kamil-ibn-al-athir p. 52-53}."
