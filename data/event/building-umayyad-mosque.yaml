summary:
  ar: "في سنة سبع وثمانين شرع الوليد بن عبد الملك في بناء جامع دمشق وكتب بتوسيع المسجد النبوي وبنائه، ويذكر ابن أبي عبلة أن الوليد افتتح الهند والأندلس وبنى مسجد دمشق وكان يعطيه قصاع الفضة يقسمها على قراء مسجد بيت المقدس {cite:tarikh-khulafa-minhaj-1434 p. 367}."
  en: "In year 87 al-Walid ibn Abd al-Malik began building the congregational mosque of Damascus and ordered the enlargement and rebuilding of the Prophet's Mosque; Ibn Abi Abla couples the conquests of India and al-Andalus with 'he built the mosque of Damascus', and recalls the silver basins al-Walid gave him to distribute among the qurra' of the Jerusalem mosque {cite:tarikh-khulafa-minhaj-1434 p. 367}."
