label: { en: "The conversion of Abu Quhafa", fr: "Conversion d’Abu Quhafa", ar: "إسلام أبي قحافة عثمان بن عامر", es: "La conversión de Abu Quhafa", ur: "ابو قحافہ کی تبدیلی", tr: "Ebu Kuhafa Osman ibn Amir'in İslam'ı", id: "Islam Abu Quhafa Utsman bin Amir" }
summary:
  en: "At Dhu Tuwa or upon the entry into Mecca, Abu Bakr led his aged, blind father Abu Quhafa to the Prophet to profess Islam; the Prophet remarked with tenderness that he should have gone to the old man instead, and instructed that his white hair be dyed."
  fr: "À Dhu Tuwa ou à l’entrée de La Mecque, Abu Bakr conduisit son père Abu Quhafa, âgé et aveugle, auprès du Prophète pour professer l’islam ; le Prophète fit remarquer avec douceur qu’il aurait dû aller lui-même auprès du vieil homme et demanda que ses cheveux blancs soient teints."
  ar: "بذي طوى عند مشارف مكة، قاد أبو بكر الصديق أباه الكفيف الطاعن في السن أبا قحافة إلى النبي ليعلن إسلامه؛ فرحب به النبي تكريماً وقال: «هلا تركت الشيخ في بيته حتى نكون نحن نأتيه»، وأمر بصبغ شيبه."
  es: "En Dhu Tuwa, o al entrar en La Meca, Abu Bakr llevó a su anciano padre ciego, Abu Quhafa, ante el Profeta para que profesara el Islam; el Profeta comentó con ternura que debería haber ido al anciano en su lugar, y le ordenó que se tiñera el cabello blanco."
  ur: "ذو طویٰ کے موقع پر یا مکہ میں داخل ہونے پر، ابوبکر اپنے بوڑھے، نابینا والد ابو قحافہ کو اسلام کا دعویٰ کرنے کے لیے نبی کے پاس لے گئے۔ نبی نے نرمی کے ساتھ کہا کہ اس کے بجائے اسے بوڑھے کے پاس جانا چاہیے تھا، اور اس کے سفید بالوں کو رنگنے کا حکم دیا۔"
  tr: "Mekke'nin dışındaki Zü've'de, Ebu Bekir Sıddık, kör ve yaşlı babası Ebu Kufe'yi İslam'ı ilan etmesi için Peygamber'in yanına götürdü. Peygamber onu saygıyla karşıladı ve \"Yaşlı adamı evinde bırakıp yanına gelmemize izin vermeseydin neden?\" dedi. Ardından, yaşlı adamın beyaz saçlarının boyanmasını emretti."
  id: "Di Dhu Tuwa, di pinggiran Mekah, Abu Bakr Al-Siddiq membawa ayahnya yang buta dan lanjut usia, Abu Quhafa, kepada Nabi untuk menyatakan keislamannya. Nabi menyambutnya dengan hormat dan berkata, “Mengapa kamu tidak meninggalkan orang tua itu di rumahnya agar kami bisa datang kepadanya?” Kemudian beliau memerintahkan agar rambut beruban ayahnya diwarnai."
