label: { en: "The conversion of Abu Quhafa", ar: "إسلام أبي قحافة عثمان بن عامر" }
summary:
  en: "At Dhu Tuwa or upon the entry into Mecca, Abu Bakr led his aged, blind father Abu Quhafa to the Prophet to profess Islam; the Prophet remarked with tenderness that he should have gone to the old man instead, and instructed that his white hair be dyed."
  ar: "بذي طوى عند مشارف مكة، قاد أبو بكر الصديق أباه الكفيف الطاعن في السن أبا قحافة إلى النبي ليعلن إسلامه؛ فرحب به النبي تكريماً وقال: «هلا تركت الشيخ في بيته حتى نكون نحن نأتيه»، وأمر بصبغ شيبه."
