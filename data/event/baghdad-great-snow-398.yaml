id: event/baghdad-great-snow-398
class: event
kind: other
label: { ar: "ثلج بغداد العظيم سنة ثمان وتسعين", en: "The Great Snowfall of Baghdad in 398", fr: "La grande chute de neige de Bagdad en 398", es: "La gran nevada de Bagdad en 398", ur: "398 میں بغداد کی عظیم برف باری" }
summary:
  ar: "وقع الثلج ببغداد يوم الأربعاء الحادي عشر من ربيع الأول سنة ثمان وتسعين فعلا على وجه الأرض ذراعاً في موضع وذراعاً ونصفاً وأقام أسبوعاً لم يذب فرماه الناس عن سطوحهم بالرفوش إلى الشوارع والدروب وبقيت منه بقايا في موضع نحو عشرين يوماً، وبلغ سقوطه إلى تكريت ووردت الكتب من واسط بسقوطه فيها وبين البطيحة والبصرة والكوفة وعكبرا ومهروبان {cite:muntazam-ibn-al-jawzi j.7 p.238}."
  en: "On Wednesday, 11 Rabi' I 398, snow fell on Baghdad and lay on the ground a cubit deep in one place and a cubit and a half in another. It stayed for a week without melting, and people shovelled it from their roofs into the streets and alleys, while remnants lingered in one spot for about twenty days. Its fall reached Tikrit, and reports came of its falling at Wasit and in the area between al-Batiha, Basra, Kufa, 'Ukbara and Mihrubān {cite:muntazam-ibn-al-jawzi j.7 p.238}."
  fr: "Le mercredi 11 Rabi' I 398, la neige tomba sur Bagdad et couvrit le sol d'une coudée en un endroit et d'une coudée et demie en un autre. Elle resta une semaine sans fondre, et les gens la pelletaient de leurs toits dans les rues et les ruelles, tandis que des restes subsistèrent en un endroit une vingtaine de jours. Sa chute atteignit Tikrit, et des nouvelles vinrent de sa chute à Wasit et dans la région entre al-Batiha, Bassora, Koufa, 'Ukbara et Mihrubān {cite:muntazam-ibn-al-jawzi j.7 p.238}."
  es: "El miércoles 11 de Rabi' I de 398, nevó en Bagdad y la nieve cubrió el suelo con una capa de un codo de espesor en un lugar y de un codo y medio en otro. Permaneció allí durante una semana sin derretirse, y la gente la paleaba desde los tejados hacia las calles y callejones, mientras que algunos restos permanecieron en un mismo lugar durante unos veinte días. La nieve llegó hasta Tikrit, y se reportaron nevadas en Wasit y en la zona comprendida entre al-Batiha, Basora, Kufa, 'Ukbara y Mihrubān {cite:muntazam-ibn-al-jawzi j.7 p.238}."
  ur: "بدھ 11 ربیع الثانی 398 کو بغداد پر برف پڑی اور ایک جگہ ڈیڑھ ہاتھ اور دوسری جگہ ڈیڑھ ہاتھ گہری زمین پر پڑی۔ یہ پگھلائے بغیر ایک ہفتہ تک رہا، اور لوگوں نے اسے اپنی چھتوں سے گلیوں اور گلیوں میں پھینک دیا، جبکہ باقیات تقریباً بیس دن تک ایک جگہ پر پڑی رہیں۔ اس کا زوال تکریت تک پہنچا اور وسط اور البطحہ، بصرہ، کوفہ، عقبرہ اور محرابان کے درمیان کے علاقے میں اس کے گرنے کی خبریں آئیں۔"
