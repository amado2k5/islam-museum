label: { ar: "ثلج بغداد العظيم سنة ثمان وتسعين", en: "The Great Snowfall of Baghdad in 398" }
summary:
  ar: "وقع الثلج ببغداد يوم الأربعاء الحادي عشر من ربيع الأول سنة ثمان وتسعين فعلا على وجه الأرض ذراعاً في موضع وذراعاً ونصفاً وأقام أسبوعاً لم يذب فرماه الناس عن سطوحهم بالرفوش إلى الشوارع والدروب وبقيت منه بقايا في موضع نحو عشرين يوماً، وبلغ سقوطه إلى تكريت ووردت الكتب من واسط بسقوطه فيها وبين البطيحة والبصرة والكوفة وعكبرا ومهروبان {cite:muntazam-ibn-al-jawzi j.7 p.238}."
  en: "On Wednesday, 11 Rabi' I 398, snow fell on Baghdad and lay on the ground a cubit deep in one place and a cubit and a half in another. It stayed for a week without melting, and people shovelled it from their roofs into the streets and alleys, while remnants lingered in one spot for about twenty days. Its fall reached Tikrit, and reports came of its falling at Wasit and in the area between al-Batiha, Basra, Kufa, 'Ukbara and Mihrubān {cite:muntazam-ibn-al-jawzi j.7 p.238}."
