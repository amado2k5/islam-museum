id: event/disobedience-of-adam
class: event
kind: other
label:
  ar: "معصية آدم وإبليس"
  en: "Adam's disobedience and Iblis"
  ur: "آدم کی نافرمانی اور إبلیس"
summary:
  ar: "أمر الله الملائكة بالسجود لآدم فسجدوا وأبى إبليس «أنا خير منه» فطُرد، ثم وسوس لهما إبليس فذاقا من الشجرة فبدت لهما سَوآتهما وناديا ربهما «ربنا ظلمنا أنفسنا» فتاب الله عليهما {cite:tanzil-quran}. وهي أول واقعة في القرآن يقع فيها الشيطان بإغواء البشر {cite:tanzil-quran}."
  en: "God commanded the angels to prostrate to Adam; they did, but Iblis refused — 'I am better than him' — and was expelled. Then Iblis whispered to the two of them, they tasted of the tree, their nakedness appeared to them, and they called on their Lord 'our Lord, we have wronged ourselves', and God accepted their repentance {cite:tanzil-quran}. It is the first incident in the Qur'an in which Satan leads human beings astray."
  ur: "اللہ نے فرشتوں کو آدم کے سامنے سجدے کا حکم دیا تو انہوں نے سجدہ کیا، لیکن إبلیس نے انکار کیا — «میں اس سے بہتر ہوں» — اور اسے نکال دیا گیا۔ پھر إبلیس نے دونوں کو وسوسہ دیا، انہوں نے درخت کا پھل چکھا، ان پر شرمگاہ ظاہر ہوئی، اور انہوں نے رب سے کہا «اے ہمارے رب ہم نے اپنی جانوں پر ظلم کیا»، تو اللہ نے ان کی توبہ قبول کی {cite:tanzil-quran}۔ یہ قرآن کی پہلی واقعہ ہے جس میں شیطان انسانوں کو گمراہ کرتا ہے {cite:tanzil-quran}۔"
