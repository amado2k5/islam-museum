id: event/disobedience-of-adam
class: event
kind: other
label:
  ar: "معصية آدم وإبليس"
  en: "Adam's disobedience and Iblis"
  ur: "آدم کی نافرمانی اور إبلیس"
  es: "La desobediencia de Adán e Iblis"
  fr: "La désobéissance d'Adam et Iblis"
  tr: "Âdem ve İblis'in günahı"
  id: "Dosa Adam dan Iblis"
summary:
  ar: "أمر الله الملائكة بالسجود لآدم فسجدوا وأبى إبليس «أنا خير منه» فطُرد، ثم وسوس لهما إبليس فذاقا من الشجرة فبدت لهما سَوآتهما وناديا ربهما «ربنا ظلمنا أنفسنا» فتاب الله عليهما {cite:tanzil-quran}. وهي أول واقعة في القرآن يقع فيها الشيطان بإغواء البشر {cite:tanzil-quran}."
  en: "God commanded the angels to prostrate to Adam; they did, but Iblis refused — 'I am better than him' — and was expelled. Then Iblis whispered to the two of them, they tasted of the tree, their nakedness appeared to them, and they called on their Lord 'our Lord, we have wronged ourselves', and God accepted their repentance {cite:tanzil-quran}. It is the first incident in the Qur'an in which Satan leads human beings astray."
  ur: "اللہ نے فرشتوں کو آدم کے سامنے سجدے کا حکم دیا تو انہوں نے سجدہ کیا، لیکن إبلیس نے انکار کیا — «میں اس سے بہتر ہوں» — اور اسے نکال دیا گیا۔ پھر إبلیس نے دونوں کو وسوسہ دیا، انہوں نے درخت کا پھل چکھا، ان پر شرمگاہ ظاہر ہوئی، اور انہوں نے رب سے کہا «اے ہمارے رب ہم نے اپنی جانوں پر ظلم کیا»، تو اللہ نے ان کی توبہ قبول کی {cite:tanzil-quran}۔ یہ قرآن کی پہلی واقعہ ہے جس میں شیطان انسانوں کو گمراہ کرتا ہے {cite:tanzil-quran}۔"
  es: "Dios ordenó a los ángeles que se postraran ante Adán; lo hicieron, pero Iblis se negó —«Yo soy mejor que él»— y fue expulsado. Entonces Iblis les susurró a los dos, probaron del árbol, se les reveló su desnudez y clamaron a su Señor: «¡Señor nuestro, nos hemos hecho daño a nosotros mismos!», y Dios aceptó su arrepentimiento {cita:tanzil-quran}. Este es el primer incidente en el Corán en el que Satanás desvía a los seres humanos del buen camino."
  fr: "Dieu ordonna aux anges de se prosterner devant Adam; ils obéirent, mais Iblis refusa – « Je suis meilleur que lui » – et fut chassé. Alors Iblis murmura à l’oreille des deux hommes, ils goûtèrent au fruit de l’arbre, leur nudité leur apparut, et ils implorèrent leur Seigneur: « Seigneur, nous avons commis une injustice envers nous-mêmes », et Dieu accepta leur repentir (citation: Tanzil-Quran). C’est le premier épisode du Coran où Satan égare les hommes."
  tr: "Allah meleklere Âdem'in önünde secde etmelerini emretti ve onlar da öyle yaptılar. Fakat İblis, \"Ben ondan daha üstünüm\" diyerek reddetti ve kovuldu. Sonra İblis onlara fısıldadı ve onlar da ağacın meyvesinden tattılar; cinsel organları görünür hale geldi ve Rablerine, \"Ey Rabbimiz! Biz kendimize zulmettik!\" diye yalvardılar ve Allah onların tövbelerini kabul etti. Bu, Kur'an'da şeytanın insanlığı ayartmaya çalıştığı ilk olaydır."
  id: "Allah memerintahkan para malaikat untuk bersujud di hadapan Adam, dan mereka melakukannya. Tetapi Iblis menolak, berkata, \"Aku lebih baik darinya,\" dan diusir. Kemudian Iblis membisikkan sesuatu kepada mereka, dan mereka mencicipi buah pohon itu, dan kemaluan mereka menjadi terlihat oleh mereka, dan mereka berseru kepada Tuhan mereka, \"Ya Tuhan kami, kami telah menzalimi diri kami sendiri,\" dan Allah menerima taubat mereka. Inilah kejadian pertama dalam Al-Quran di mana Setan menggoda umat manusia."
