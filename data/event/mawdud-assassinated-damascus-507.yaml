label: { ar: "اغتيال مودود صاحب الموصل بجامع دمشق سنة 507", en: "The Assassination of Mawdud, Lord of Mosul, in the Great Mosque of Damascus, 507", es: "El asesinato de Mawdud, señor de Mosul, en la Gran Mezquita de Damasco, 507", fr: "L'assassinat de Mawdud, seigneur de Mossoul, dans la Grande Mosquée de Damas, en 507" }
summary:
  ar: "في سنة سبع وخمسمائة جاء مودود صاحب الموصل بعسكر ليقاتل ملك الفرنج فوقع بينهم معركة هائلة، ثم رجع مودود إلى دمشق فصلى الجمعة في الجامع وإذا بباطني وثب عليه فجرحه فمات من يومه؛ وكتب ملك الفرنج إلى صاحب دمشق متعجباً أن أمة قتلت عميدها في يوم عيدها في بيت معبودها {cite:shadharat-dhahab p. 500-501}."
  en: "In 507 Mawdud lord of Mosul marched against the Frankish king and fought a great battle, then returned to Damascus where, at Friday prayer in the mosque, a Batini sprang on him, wounded him, and he died that day; the Frankish king wrote Damascus's lord wondering at a nation that killed its champion on its feast day in its house of worship {cite:shadharat-dhahab p. 500-501}."
  es: "En 507, Mawdud, señor de Mosul, marchó contra el rey franco y libró una gran batalla; luego regresó a Damasco, donde, durante la oración del viernes en la mezquita, un Batini saltó sobre él, lo hirió y murió ese mismo día. El rey franco escribió al señor de Damasco asombrado de que una nación matara a su campeón en su día festivo en su lugar de culto {cita: shadharat-dhahab págs. 500-501}."
  fr: "En 507, Mawdud, seigneur de Mossoul, marcha contre le roi franc et livra une grande bataille, puis retourna à Damas où, lors de la prière du vendredi à la mosquée, un Batini se jeta sur lui, le blessa, et il mourut ce jour-là; le roi franc écrivit au seigneur de Damas, s'étonnant qu'une nation puisse tuer son champion le jour de sa fête dans son lieu de culte {cite:shadharat-dhahab p. 500-501}."
