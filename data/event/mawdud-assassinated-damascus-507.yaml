label: { ar: "اغتيال مودود صاحب الموصل بجامع دمشق سنة 507" }
summary:
  ar: "في سنة سبع وخمسمائة جاء مودود صاحب الموصل بعسكر ليقاتل ملك الفرنج فوقع بينهم معركة هائلة، ثم رجع مودود إلى دمشق فصلى الجمعة في الجامع وإذا بباطني وثب عليه فجرحه فمات من يومه؛ وكتب ملك الفرنج إلى صاحب دمشق متعجباً أن أمة قتلت عميدها في يوم عيدها في بيت معبودها {cite:shadharat-dhahab p. 500-501}."
  en: "In 507 Mawdud lord of Mosul marched against the Frankish king and fought a great battle, then returned to Damascus where, at Friday prayer in the mosque, a Batini sprang on him, wounded him, and he died that day; the Frankish king wrote Damascus's lord wondering at a nation that killed its champion on its feast day in its house of worship {cite:shadharat-dhahab p. 500-501}."
