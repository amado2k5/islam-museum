id: event/al-hadi-small-acts-of-restitution-at-najran-and-bisha
class: event
kind: other
label:
  ar: 'أفعال ردّ الحقوق الصغيرة في نجران وبيشة: الباذنجان والبيض والقرطاس والإبرة'
  en: 'Small acts of restitution at Najran and Bisha: aubergines, eggs, paper and a needle'
  ur: 'نجران اور بیشہ میں چھوٹے حقوق لوٹانے کے واقعات: بینگن، انڈے، کاغذ اور سوئی'
summary:
  ar: 'تجمع روايات الكوفي ومحمد بن عبيد الله أخباراً عن تحرز الهادي في نجران وبيشة وخيوان: قطع باذنجان من شجرة في دار نزلها وبعث به إلى أصحاب الدار، وأمر برد بيض وجده غلمانه، ومنع قرطاس العشر وقلالاً اشتُريت من فضل ثمنه، وإرجاع إبرة جوشن لأهل صانعه، وضربه من وقف من جنده على باب دار يستسقون.'
  en: 'Reports from al-Kufi and others gather acts of care by al-Hadi at Najran, Bisha and Khiwan: cutting aubergines from a bush in a house he lodged in and sending them to its owners, returning eggs his servants found, refusing paper bought from the tithe and jars bought with its change, returning the needle of an armour to its maker''s family, and rebuking soldiers who stopped at a door to ask for water.'
  ur: 'کوفی اور دوسروں کی روایات نجران، بیشہ اور خیوان میں ہادی کی احتیاط کے واقعات جمع کرتی ہیں: جس گھر میں ٹھہرے اس کے بینگن توڑ کر مالکوں کو بھیجنا، غلاموں کو ملے انڈے لوٹانا، عشر کے کاغذ اور اس کی بقیہ رقم سے خریدے گھڑوں کو رد کرنا، زرہ بنانے والے کے گھر والوں کو سوئی لوٹانا، اور دروازے پر پانی مانگنے رکنے والے سپاہیوں کو ڈانٹنا۔'
