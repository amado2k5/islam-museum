id: event/al-hadi-small-acts-of-restitution-at-najran-and-bisha
class: event
kind: other
label:
  ar: 'أفعال ردّ الحقوق الصغيرة في نجران وبيشة: الباذنجان والبيض والقرطاس والإبرة'
  en: 'Small acts of restitution at Najran and Bisha: aubergines, eggs, paper and a needle'
  ur: 'نجران اور بیشہ میں چھوٹے حقوق لوٹانے کے واقعات: بینگن، انڈے، کاغذ اور سوئی'
  es: "Pequeños actos de restitución en Najran y Bisha: berenjenas, huevos, papel y una aguja."
  fr: "Petits actes de restitution à Najran et Bisha: aubergines, œufs, papier et une aiguille"
  tr: "Najran ve Bisha'da küçük hakların iadesine ilişkin eylemler: patlıcan, yumurta, kağıt ve iğne"
  id: "Tindakan mengembalikan hak-hak kecil di Najran dan Bisha: terong, telur, kertas, dan jarum."
summary:
  ar: 'تجمع روايات الكوفي ومحمد بن عبيد الله أخباراً عن تحرز الهادي في نجران وبيشة وخيوان: قطع باذنجان من شجرة في دار نزلها وبعث به إلى أصحاب الدار، وأمر برد بيض وجده غلمانه، ومنع قرطاس العشر وقلالاً اشتُريت من فضل ثمنه، وإرجاع إبرة جوشن لأهل صانعه، وضربه من وقف من جنده على باب دار يستسقون.'
  en: 'Reports from al-Kufi and others gather acts of care by al-Hadi at Najran, Bisha and Khiwan: cutting aubergines from a bush in a house he lodged in and sending them to its owners, returning eggs his servants found, refusing paper bought from the tithe and jars bought with its change, returning the needle of an armour to its maker''s family, and rebuking soldiers who stopped at a door to ask for water.'
  ur: 'کوفی اور دوسروں کی روایات نجران، بیشہ اور خیوان میں ہادی کی احتیاط کے واقعات جمع کرتی ہیں: جس گھر میں ٹھہرے اس کے بینگن توڑ کر مالکوں کو بھیجنا، غلاموں کو ملے انڈے لوٹانا، عشر کے کاغذ اور اس کی بقیہ رقم سے خریدے گھڑوں کو رد کرنا، زرہ بنانے والے کے گھر والوں کو سوئی لوٹانا، اور دروازے پر پانی مانگنے رکنے والے سپاہیوں کو ڈانٹنا۔'
  es: "Los informes de al-Kufi y otros recogen actos de bondad de al-Hadi en Najran, Bisha y Khiwan: cortar berenjenas de un arbusto en una casa donde se hospedaba y enviárselas a sus dueños, devolver los huevos que encontraban sus sirvientes, rechazar el papel comprado con el diezmo y las jarras compradas con el cambio, devolver la aguja de una armadura a la familia de su fabricante y reprender a los soldados que se detenían en una puerta para pedir agua."
  fr: "Les récits d'al-Kufi et d'autres recensent les actes de bienveillance d'al-Hadi à Najran, Bisha et Khiwan: il coupait des aubergines d'un buisson dans une maison où il logeait et les envoyait à ses propriétaires, rendait les œufs trouvés par ses serviteurs, refusait le papier acheté avec la dîme et les jarres achetées avec sa monnaie, rendait l'aiguille d'une armure à la famille de son fabricant et réprimandait les soldats qui s'étaient arrêtés à une porte pour demander de l'eau."
  tr: "El-Kufi ve Muhammed ibn Ubeydullah'ın rivayetlerinde, El-Hadi'nin Necran, Bişa ve Hayvan'daki eylemleri hakkında haberler yer almaktadır: Kaldığı bir evdeki ağaçtan bir patlıcan kesip evin sahiplerine göndermiş, hizmetkarlarının bulduğu yumurtaların iadesini emretmiş, zekât kağıdını ve fazlasından alınan kapları engellemiş, bir zırhın iğnesini yapımcısına iade etmiş ve bir evin kapısında su isteyen askerlerini dövmüştür."
  id: "Catatan al-Kufi dan Muhammad ibn Ubayd Allah mencakup berita tentang tindakan al-Hadi di Najran, Bisha, dan Khaywan: ia memetik terong dari pohon di sebuah rumah tempat ia tinggal dan mengirimkannya kepada pemilik rumah tersebut, memerintahkan pengembalian telur yang ditemukan oleh para pelayannya, mencegah pengembalian kertas zakat dan panci yang dibeli dengan kelebihan harganya, mengembalikan jarum baju zirah kepada pembuatnya, dan memukuli tentara-tentaranya yang berdiri di depan pintu sebuah rumah meminta air."
