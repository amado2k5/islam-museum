label: { ar: "خلع الطائع وتولية القادر", en: "Deposition of al-Ta'i' and Accession of al-Qadir", es: "Deposición de al-Ta'i' y Ascenso de al-Qadir", fr: "Déposition d'al-Ta'i' et accession d'al-Qadir", ur: "الطائی کی معزولی اور القادر کا الحاق" }
summary:
  ar: "في سنة إحدى وثمانين قبض على الطائع وسببه أنه حبس رجلاً من خواص بهاء الدولة فجاء بهاء الدولة وقد جلس الطائع في الرواق متقلداً سيفاً فلما قرب بهاء الدولة قبل الأرض وجلس على الكرسي وتقدم أصحاب بهاء الدولة فجذبوا الطائع من سريره وتكاثر عليه الديلم فلفوه في كساء وأصعدوه إلى دار السلطان وارتج البلد ورجع بهاء الدولة إلى داره وكتب على الطائع كتاباً بخلع نفسه وأنه سلم الأمر إلى القادر بالله وشهد عليه الأكابر والأشراف وذلك في تاسع عشر شعبان ونفذ إلى القادر بالله ليحضر وهو بالبطيحة واستمر الطائع في دار القادر مكرماً محترماً في أحسن حال حتى أنه حمل إليه ليلة شمعة قد أوقد نصفها فأنكر ذلك فحملوا إليه غيرها إلى أن مات ليلة عيد الفطر سنة ثلاث وتسعين وصلى عليه القادر وشيعه الأكابر والخدم ورثاه الشريف الرضي وكان شديد الانحراف على آل أبي طالب وسقطت الهيبة في أيامه جداً حتى هجاه الشعراء {cite:tarikh-khulafa-minhaj-1434 p. 631-632}."
  en: "In 381 al-Ta'i' was seized — for jailing one of Baha' al-Dawla's intimates: the Daylamites dragged him from his throne, wrapped him in a cloak and bore him off while the city shook; they wrote on him his self-deposition for al-Qadir, witnessed by the grandees on 19 Sha'ban. He lived honoured in al-Qadir's house — once complaining when brought a half-burnt candle — till he died on Fitr night 393, al-Qadir praying over him and al-Sharif al-Radi elegising him; he was fiercely set against the Alids, and awe fell so low in his days the poets satirised him {cite:tarikh-khulafa-minhaj-1434 p. 631-632}."
  es: "En 381, al-Ta'i' fue apresado por encarcelar a uno de los íntimos de Baha' al-Dawla: los daylamitas lo arrastraron de su trono, lo envolvieron en un manto y se lo llevaron mientras la ciudad temblaba; escribieron sobre él su autodeposición a favor de al-Qadir, presenciada por los grandes dignatarios el 19 de Sha'ban. Vivió honrado en la casa de al-Qadir —una vez quejándose cuando le trajeron una vela medio consumida— hasta que murió en la noche de Fitr de 393, al-Qadir orando por él y al-Sharif al-Radi pronunciándole una elegía; se oponía ferozmente a los Alids, y el respeto que se le tenía cayó tan bajo en sus días que los poetas lo satirizaron {cite:tarikh-khulafa-minhaj-1434 p. 631-632}."
  fr: "En 381, al-Ta'i' fut arrêté pour avoir emprisonné un proche de Baha' al-Dawla. Les Daylamites le traînèrent de son trône, l'enveloppèrent dans un manteau et l'emportèrent sous les secousses de la ville. Ils inscrivirent sur lui sa déposition pour al-Qadir, attestée par les dignitaires le 19 Sha'ban. Il vécut honoré dans la demeure d'al-Qadir – se plaignant un jour lorsqu'on lui apporta une bougie à moitié consumée – jusqu'à sa mort, la nuit de Fitr 393. Al-Qadir pria pour lui et al-Sharif al-Radi prononça son éloge funèbre. Farouchement opposé aux Alides, il inspira tellement de crainte à son époque que les poètes le raillèrent (voir: Tarikh-Khulafa-Minhaj-1434, p. 631-632)."
  ur: "381 میں الطائی کو گرفتار کیا گیا - بہاء الدولہ کے قریبیوں میں سے ایک کو جیل میں ڈالنے کے لئے: دیلامیوں نے اسے اس کے تخت سے گھسیٹ لیا، اسے چادر میں لپیٹ کر اٹھا لیا جب کہ شہر ہل رہا تھا۔ انہوں نے اس پر القادر کے لیے اس کی خود بیانی لکھی جس کی گواہی 19 شعبان کو بزرگوں نے دی تھی۔ وہ القادر کے گھر میں عزت سے رہتا تھا - ایک بار جب شکایت کی کہ آدھی جلی ہوئی موم بتی لائی تھی - یہاں تک کہ وہ فطر کی رات 393 کو مر گیا، القادر نے اس پر دعا کی اور الشریف الرادی نے اس کی تعظیم کی۔ وہ علیز کے خلاف سخت کھڑا تھا، اور اس کے زمانے میں اس کا خوف اتنا کم ہو گیا تھا کہ شاعروں نے اس پر طنز کیا تھا۔ 631-632}۔"
