id: "event/ali-ibn-muhammad-composes-an-elegy-for-his-father-as-he-returns-to-al-hisn-295"
class: event
kind: other
label:
  ar: "علي بن محمد يرثي أباه بقصيدة على بحر الخفيف عند عودته إلى الحصن، 295هـ، ص382-383"
  en: "Ali ibn Muhammad composes an elegy for his father in the khafif metre on his return to the fort, 295 AH, pp. 382-383"
  ur: "علی بن محمد واپس حصن جاتے ہوئے اپنے باپ کا مرثیہ بحرِ خفیف میں کہتا ہے، 295ھ، ص382-383"
summary:
  ar: "قال علي بن محمد قصيدة على بحر الخفيف وهو عائد إلى الحصن، يرثي فيها أباه، ويمدح الفرسان الثقفيين الذين أجابوه، ويعاتب من لم ينصره، وينادي همدان للدفاع عن الإسلام، ويطلب الثأر من القاتلين."
  en: "Ali ibn Muhammad recited an elegy in the khafif metre on his return to the fort. It mourns his father and the killing, praises the Thaqif horsemen who answered his call, reproaches those who did not help him, calls on Hamdan to defend Islam, and demands vengeance on the killers."
  ur: "علی بن محمد نے حصن کی طرف واپسی پر بحرِ خفیف میں ایک قصیدہ کہا۔ اس میں اس نے باپ اور اس کے قتل کا غم بیان کیا، ان لوگوں پر ملامت کی جنہوں نے مدد نہ کی، ثقیف کے ان گھڑ سواروں کی تعریف کی جنہوں نے پکار کا جواب دیا، ہمدان کو اسلام کے دفاع کے لیے بلایا، اور قاتلوں سے بدلہ مانگا۔"
