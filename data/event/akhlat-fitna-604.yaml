summary:
  ar: "لما تم ملك خلاط للملك الأوحد نجم الدين بن العادل سار عنها إلى ملازكرد فوثب أهلها على من بها من العسكر وأخرجوهم وحصروا القلعة ونادوا بشعار شاه أرمن وإن كان ميتاً يريدون رد الملك إلى أصحابه ومماليكه، فعاد الأوحد وقد وافاه عسكر من الجزيرة فحصر خلاط حتى مال إليه بعض أهلها حسداً للآخرين فملكها وقتل بها خلقاً كثيراً وأسر جماعة من الأعيان سيرهم إلى ميافارقين وكان كل يوم يرسل إليهم فيقتل منهم جماعة فلم يسلم إلا القليل؛ ويذكر ابن الأثير أن أهل خلاط ذلوا بعد هذه الوقعة وتفرقت كلمة الفتيان الذين كان الحكم إليهم وكفى الناس شرهم، فإنهم صاروا يقيمون ملكاً ويقتلون آخر {cite:kamil-ibn-al-athir p. 342-343}."
  en: "604: the moment al-Awhad's back was turned, Akhlat's people expelled his garrison and cried a dead Shah-Arman's name; he returned with Jaziran reinforcements, breached the city on the people's own envy of one another, massacred many, and sent the notables to Mayyafariqin to be killed in daily batches — 'the fitiyan, who had made and unmade kings, were scattered and the people spared their evil' {cite:kamil-ibn-al-athir p. 342-343}."
  fr: "604 : dès le départ d’al-Awhad, les habitants d’Akhlat expulsèrent sa garnison et crièrent le nom d’un Shah-Arman défunt. Il revint avec des renforts de Jazira, prit la ville en profitant de la jalousie entre habitants, en massacra beaucoup et envoya les notables à Mayyafariqin pour y être tués par groupes quotidiens. Selon le chroniqueur, les fityan, qui faisaient et défaisaient les rois, furent dispersés et la population délivrée de leur mal {cite:kamil-ibn-al-athir p. 342-343}."
  es: "604: en el momento en que al-Awhad dio la espalda, la gente de Akhlat expulsó a su guarnición y clamó el nombre del difunto Shah-Arman; él regresó con refuerzos de Jaziran, irrumpió en la ciudad aprovechando la envidia que la gente sentía entre sí, masacró a muchos y envió a los notables a Mayyafariqin para que fueran asesinados en grupos diarios: «los fitiyan, que habían hecho y deshecho reyes, fueron dispersados y la gente se libró de su maldad» {cita:kamil-ibn-al-athir p. 342-343}."
  ur: "604: جس لمحے احد کی پیٹھ پھیری گئی، اخلت کے لوگوں نے اس کی چوکی کو باہر نکال دیا اور ایک مردہ شاہ ارمان کا نام پکارا۔ وہ جزیران کی کمک کے ساتھ واپس آیا، لوگوں کی ایک دوسرے سے حسد پر شہر میں توڑ پھوڑ کی، بہت سے لوگوں کا قتل عام کیا، اور معززین کو مایافارقین کے پاس بھیج دیا کہ وہ روزانہ کی کھیپوں میں مارے جائیں - 'فتیان، جنہوں نے بادشاہ بنائے اور بنائے تھے، بکھر گئے اور لوگوں نے ان کے شر سے بچایا'۔ 342-343}۔"
  tr: "Kral Al-Awhad Najm Al-Din İbn Al-Adil için Hilafet Krallığı kurulduğunda, oradan Malazgird'e yürüdü. Halk orada orduya karşı ayaklandı, onları püskürttü, kaleyi kuşattı ve ölmüş olmasına rağmen Şah Armen'in sloganını haykırarak krallığı arkadaşlarına ve Memlüklere geri istedi. Al-Awhad geri döndü ve Al-Jazira'dan bir ordu ona katıldı. Hilafet'i kuşattı, ta ki bazı halk diğerlerine duydukları kıskançlıktan dolayı onun safına geçene kadar. Şehrin kontrolünü ele geçirdi ve orada birçok insanı öldürdü, bir grup ileri geleni esir alarak Mayyafariqin'e gönderdi. Her gün onları çağırıp bir grubunu öldürüyordu, bu yüzden sadece birkaç kişi kurtuldu. İbn Al-Athir, bu savaştan sonra Hilafet halkının aşağılandığını, hüküm süren gençlerin sözünün bölündüğünü ve halkın kötülüklerinden kurtulduğunu, çünkü bir kral kurup diğerini öldürmeye başladıklarını belirtir. {alıntı: kamil-ibn-el-esir s. 342-343}."
  id: "Ketika kerajaan Khilat didirikan untuk Raja Al-Awhad Najm Al-Din Ibn Al-Adil, ia bergerak dari sana ke Malazgird. Rakyatnya bangkit melawan pasukan di sana, mengusir mereka, mengepung benteng, dan meneriakkan slogan Shah Armen, meskipun ia telah meninggal, karena ingin mengembalikan kerajaan kepada para sahabatnya dan Mamluk. Al-Awhad kembali, dan pasukan dari Al-Jazira bergabung dengannya. Ia mengepung Khilat hingga sebagian rakyatnya memihak kepadanya karena iri terhadap yang lain. Ia menguasainya dan membunuh banyak orang di sana serta menangkap sekelompok tokoh penting, lalu mengirim mereka ke Mayyafariqin. Setiap hari ia memanggil mereka dan membunuh sebagian dari mereka, sehingga hanya sedikit yang selamat. Ibn Al-Athir menyebutkan bahwa rakyat Khilat dipermalukan setelah pertempuran ini, dan pendapat para pemuda yang telah memerintah terpecah, dan rakyat terhindar dari kejahatan mereka, karena mereka mulai mengangkat seorang raja dan membunuh raja lainnya. {mengutip: kamil-ibn-al-athir hal. 342-343}."
