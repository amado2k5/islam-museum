label: { ar: "فتنة خلاط وقتل أهلها", en: "The Akhlat fitna and massacre (604 AH)" }
summary:
  ar: "لما تم ملك خلاط للملك الأوحد نجم الدين بن العادل سار عنها إلى ملازكرد فوثب أهلها على من بها من العسكر وأخرجوهم وحصروا القلعة ونادوا بشعار شاه أرمن وإن كان ميتاً يريدون رد الملك إلى أصحابه ومماليكه، فعاد الأوحد وقد وافاه عسكر من الجزيرة فحصر خلاط حتى مال إليه بعض أهلها حسداً للآخرين فملكها وقتل بها خلقاً كثيراً وأسر جماعة من الأعيان سيرهم إلى ميافارقين وكان كل يوم يرسل إليهم فيقتل منهم جماعة فلم يسلم إلا القليل؛ ويذكر ابن الأثير أن أهل خلاط ذلوا بعد هذه الوقعة وتفرقت كلمة الفتيان الذين كان الحكم إليهم وكفى الناس شرهم، فإنهم صاروا يقيمون ملكاً ويقتلون آخر {cite:kamil-ibn-al-athir p. 342-343}."
  en: "604: the moment al-Awhad's back was turned, Akhlat's people expelled his garrison and cried a dead Shah-Arman's name; he returned with Jaziran reinforcements, breached the city on the people's own envy of one another, massacred many, and sent the notables to Mayyafariqin to be killed in daily batches — 'the fitiyan, who had made and unmade kings, were scattered and the people spared their evil' {cite:kamil-ibn-al-athir p. 342-343}."
