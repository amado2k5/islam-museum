id: "event/aqil-ibn-abdallah-warns-abu-jafar-that-the-people-have-united-against-him-295"
class: event
kind: other
label:
  ar: "عاقل بن عبد الله النجراني يحذر أبا جعفر من إجماع القوم عليه، 295هـ"
  en: "Aqil ibn Abdallah warns Abu Ja'far that the people have united against him, 295 AH, pp. 369-370"
  ur: "عاقل بن عبداللہ کا ابو جعفر کو خبردار کرنا کہ لوگ اس کے خلاف متحد ہو گئے ہیں، 295ھ، ص369-370"
  es: "Aqil ibn Abdallah advierte a Abu Ja'far que el pueblo se ha unido contra él, 295 AH, pp. 369-370"
summary:
  ar: "بعد أن اجتمعت بنو الحارث في معسكرها ليلة الجمعة وقررت الكمين، جاء عاقل بن عبد الله النجراني إلى أبي جعفر محمد بن عبيد الله يحذره من إجماع القوم عليه. فأجابه أبو جعفر بأنه لن يبرح ما دام يجد من القوم ناصراً، وأنه يرجو أن ينصره الله عليهم وإن أجمعوا كلهم عليه."
  en: "After Banu al-Harith gathered in their camp on the Friday night and settled on the ambush, Aqil ibn Abdallah of Najran went to Abu Ja'far Muhammad ibn Ubaydallah and warned him that the people had united against him. Abu Ja'far answered that he would not leave while he still found a supporter among them, and that he hoped God would give him victory over them even if they all turned against him."
  ur: "جمعہ کی رات بنو حارث کے اپنے کیمپ میں جمع ہونے اور گھات کا فیصلہ کرنے کے بعد، نجران کے عاقل بن عبداللہ ابو جعفر محمد بن عبیداللہ کے پاس گئے اور اسے خبردار کیا کہ لوگ اس کے خلاف متحد ہو گئے ہیں۔ ابو جعفر نے جواب دیا کہ جب تک اسے ان میں کوئی حامی ملتا ہے وہ نہیں نکلے گا، اور امید ظاہر کی کہ اگر سب لوگ اس کے خلاف ہو جائیں تب بھی اللہ اسے ان پر فتح دے گا۔"
  es: "Después de que los Banu al-Harith se reunieran en su campamento la noche del viernes y prepararan la emboscada, Aqil ibn Abdallah de Najran fue a ver a Abu Ja'far Muhammad ibn Ubaydallah y le advirtió que el pueblo se había unido contra él. Abu Ja'far respondió que no se iría mientras encontrara un aliado entre ellos, y que esperaba que Dios le concediera la victoria, incluso si todos se volvían contra él."
