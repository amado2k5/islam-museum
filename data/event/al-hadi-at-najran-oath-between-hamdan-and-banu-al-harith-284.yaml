class: event
kind: other
label:
  ar: 'الهادي في نجران: لقاء القبائل والصلح بين همدان وبني الحارث والبيعة'
  en: 'Al-Hadi at Najran: meeting the tribes, the oath between Hamdan and Banu al-Harith, and the pledge'
  ur: 'نجران میں ہادی: قبائل سے ملاقات، ہمدان اور بنو الحارث کے درمیان حلف اور بیعت'
summary:
  ar: لقيته في أعلى نجران وادعة وشاكر وثقيف ويام والأحلاف وبايعوه، ثم نزل قرب القرية تحت شجر أثل ودعا همدان وبني الحارث فخطب فيهم واستحلف بعضهم لبعض على ترك الفتنة والسمع والطاعة، وبايعه خلق كثير، ثم سار إلى قرية الأجر فأقام أياماً أظهر فيها العدل ورد المظالم وبايعه الناس يوم الجمعة.
  en: At upper Najran Wadi'a, Shakir, Thaqif, Yam and the Ahlaf met him and pledged; he camped near the village under tamarisk trees, called Hamdan and Banu al-Harith, preached and had them swear to one another to give up the feud and to hear and obey; many pledged, and he then went to a village the text reads as al-Ajar, stayed days, showed justice and righted wrongs, and received allegiance after the Friday prayer.
  ur: اعلیٰ نجران میں وادعہ، شاکر، ثقیف، یام اور احلاف نے ان سے ملاقات کی اور بیعت کی؛ وہ گاؤں کے پاس اثل کے درختوں تلے اترے، ہمدان اور بنو الحارث کو بلا کر خطبہ دیا اور فتنہ چھوڑنے، سننے اور ماننے پر ایک دوسرے سے حلف لیا؛ بہت لوگوں نے بیعت کی؛ پھر «الاجر» پڑھی جانے والی بستی گئے، چند دن رہے، عدل ظاہر کیا، مظالم لوٹائے اور جمعہ کی نماز کے بعد لوگوں کی بیعت لی۔
