summary:
  ar: "توفي علاء الدين تكش بن إيل أرسلان خوارزم شاه وقد ملك بعد ظفره على سلطان شاه أكثر خراسان وما وراءها وأصفهان والجبل حتى دانت له أكثر بلاد العجم، وملك بعده ولده قطب الدين محمد الذي لُقّب علاء الدين وكان يخطب له بالملوك قبل موت أبيه {cite:kamil-ibn-al-athir p. 266}."
  en: "Ala al-Din Tekish ibn Il-Arslan died, lord by then of most of Khurasan, the lands beyond, Isfahan and the Jibal — the eastern half of the Islamicate world. His son Qutb al-Din Muhammad, already laqabed Ala al-Din, succeeded him {cite:kamil-ibn-al-athir p. 266}."
  es: "Ala al-Din Tekish ibn Il-Arslan murió siendo para entonces señor de la mayor parte de Jorasán, las tierras más allá, Isfahán y Jibal — la mitad oriental del mundo islámico—. Su hijo Qutb al-Din Muhammad, ya laqabed Ala al-Din, le sucedió {cite:kamil-ibn-al-athir p. 266}."
  fr: "Ala al-Din Tekish ibn Il-Arslan mourut, seigneur de la majeure partie du Khorasan, des terres au-delà, d'Ispahan et du Jibal — soit la moitié orientale du monde islamique. Son fils Qutb al-Din Muhammad, déjà nommé Ala al-Din, lui succéda (voir Kamil ibn al-Athir, p. 266)."
  ur: "علاء الدین تکیش ابن الارسلان کا انتقال ہوگیا، اس وقت تک خراسان کے بیشتر علاقوں، اس سے آگے کی سرزمین، اصفہان اور جبل - اسلامی دنیا کا مشرقی نصف حصہ۔ اس کا بیٹا قطب الدین محمد، جو پہلے ہی مقبوض علاء الدین تھا، اس کا جانشین بنا۔ 266}۔"
  tr: "Ala ad-Din Tekiş bin İl Arslan Harezm Şah öldü ve Sultan Şah'ı yendikten sonra Horasan'ın büyük bir bölümünü, İsfahan'ı ve dağları yönetti; ta ki Pers topraklarının çoğu ona boyun eğene kadar. Ondan sonra, Ala ad-Din lakaplı oğlu Kutub ad-Din Muhammed hüküm sürdü ve babasının ölümünden önce kral olarak anıldı. {cite:kamil-ibn-al-athir s. 266}"
  id: "Ala ad-Din Tekish bin Il Arslan Khwarazm Shah wafat, dan setelah kemenangannya atas Sultan Shah, ia memerintah sebagian besar Khorasan dan sekitarnya, Isfahan dan pegunungan, hingga sebagian besar wilayah Persia tunduk kepadanya. Setelahnya, putranya Qutb ad-Din Muhammad, yang dijuluki Ala ad-Din, memerintah, dan ia disebut sebagai raja sebelum kematian ayahnya. {cite:kamil-ibn-al-athir p. 266}"
