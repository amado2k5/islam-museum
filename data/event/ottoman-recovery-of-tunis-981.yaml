class: event
kind: conquest
label: { ar: "استرداد تونس من الإسبان", en: "The Recovery of Tunis from the Spanish", es: "La recuperación de Túnez de los españoles", fr: "La reconquête de Tunis sur les Espagnols", ur: "ہسپانوی سے تیونس کی بازیابی۔", tr: "Tunus'un İspanyol işgalinden kurtulması", id: "Pemulihan Tunisia dari Spanyol" }
summary:
  ar: "أصدر السلطان سليم الثاني أوامره إلى وزيره سنان باشا وقبودانه قلج علي بالاستعداد للتوجه إلى تونس لفتحها نهائياً وإعادة نفوذ الدولة العثمانية إليها، وتعبأت مائتان وثمان وثلاثون سفينة مختلفة الأحجام وأُحضر المجدفون اللازمون، وأخذ حيدر باشا الحاكم العثماني في تونس — وقد انسحب إلى القيروان — في حشد المجاهدين من الأهالي الذين التفوا حوله. أبحر الأسطول بقيادة سنان باشا وقلج علي في ٢٣ محرم ٩٨٢هـ/١٤ مايو ١٥٧٤م فضرب ساحل كالابريا ومسينا واستولى على سفينة مسيحية ثم قطع عرض البحر في خمسة أيام، ووصل حيدر باشا وقوة من الجزائريين بقيادة رمضان باشا وقوة طرابلس بقيادة مصطفى باشا ومتطوعون من مصر. بدأ القتال في ربيع سنة ٩٨١هـ/١٥٧٤م فاستولى العثمانيون على حلق الواد بعد حصار محكم، وحوصرت مدينة تونس ففرّ الإسبان ومعهم الملك الحفصي محمد بن الحسن إلى البستيون التي بالغ الإسبان في تحصينها وجعلوها من أمنع الحصون في شمال أفريقية، فتوجه العثمانيون بعد تجمع قواتهم إلى حصارها وضيّقوا الخناق عليها {cite:dawlat-uthmaniyya-salabi p. 285}."
  en: "The final Ottoman recovery of Tunis, 1574 — Selim II sent Sinan Pasha and Kapudan Kılıç Ali with 238 ships; La Goulette fell to a tight siege and the Spanish, with the Hafsid king Muhammad b. al-Hasan, were driven into their showpiece fortress, the Bastion {cite:dawlat-uthmaniyya-salabi p. 285}."
  es: "La recuperación final de Túnez por los otomanos, 1574: Selim II envió a Sinan Pasha y Kapudan Kılıç Ali con 238 barcos; La Goulette cayó bajo un asedio férreo y los españoles, con el rey hafsí Muhammad b. al-Hasan, fueron obligados a refugiarse en su fortaleza estrella, el Bastión {cite:dawlat-uthmaniyya-salabi p. 285}."
  fr: "La dernière reprise ottomane de Tunis, 1574 — Selim II envoya Sinan Pacha et Kapudan Kılıç Ali avec 238 navires; La Goulette tomba sous un siège serré et les Espagnols, avec le roi hafside Muhammad b. al-Hasan, furent repoussés dans leur forteresse phare, le Bastion {cite:dawlat-uthmaniyya-salabi p. 285}."
  ur: "تیونس کی آخری عثمانی بازیابی، 1574 - سلیم دوم نے سنان پاشا اور کپودان کلیچ علی کو 238 جہازوں کے ساتھ بھیجا۔ لا Goulette ایک سخت محاصرہ اور ہسپانوی، Hafsid بادشاہ محمد b کے ساتھ گر گیا. الحسن کو ان کے شوپیس قلعہ، گڑھ میں دھکیل دیا گیا تھا۔ 285}۔"
  tr: "Sultan II. Selim, veziri Sinan Paşa ve amirali Kılıç Ali'ye Tunus'u tamamen fethetmek ve Osmanlı etkisini yeniden tesis etmek için yelken açmaya hazırlanmalarını emretti. Çeşitli büyüklükte 238 gemi seferber edildi ve gerekli kürekçiler getirildi. Kayrevan'a çekilmiş olan Tunus'un Osmanlı valisi Haydar Paşa, etrafında toplanan yerel mücahitleri bir araya getirmeye başladı. Sinan Paşa ve Kılıç Ali önderliğindeki filo, Hicri 982 yılının Muharrem ayının 23'ünde (Miladi 14 Mayıs 1574) yola çıktı, Kalabriya ve Messina kıyılarına saldırdı, bir Hristiyan gemisini ele geçirdi ve ardından beş gün içinde açık denizi geçti. Haydar Paşa, Ramazan Paşa komutasındaki Cezayirlilerden, Mustafa Paşa komutasındaki Trabluslulardan ve Mısır'dan gönüllülerden oluşan bir kuvvetle geldi. Savaşlar Hicri 981 yılının baharında (Miladi 1574) başladı. Osmanlılar, sıkı bir kuşatmanın ardından Halq al-Wad'ı ele geçirdi ve Tunus şehri kuşatıldı. İspanyollar, Hafsid kralı Muhammed ibn al-Hasan ile birlikte, İspanyolların kapsamlı bir şekilde tahkim ettiği ve Kuzey Afrika'nın en aşılmaz kalelerinden biri haline getirdiği Bastion'a kaçtı. Osmanlılar, güçlerini topladıktan sonra kaleyi kuşattılar ve çemberi daralttılar. {cite:dawlat-uthmaniyya-salabi s. 285}"
  id: "Sultan Selim II memerintahkan wazirnya, Sinan Pasha, dan laksamana Kilij Ali untuk bersiap berlayar ke Tunis guna menaklukkannya sekali dan untuk selamanya serta memulihkan pengaruh Ottoman di sana. Dua ratus tiga puluh delapan kapal dengan berbagai ukuran dimobilisasi, dan para pendayung yang dibutuhkan didatangkan. Haydar Pasha, gubernur Ottoman di Tunis—yang telah mundur ke Kairouan—mulai mengumpulkan mujahidin setempat yang kemudian bergabung dengannya. Armada, yang dipimpin oleh Sinan Pasha dan Kilij Ali, berlayar pada tanggal 23 Muharram 982 H/14 Mei 1574 M, menyerang pantai Calabria dan Messina, menangkap sebuah kapal Kristen, dan kemudian melintasi laut lepas dalam lima hari. Haydar Pasha tiba dengan pasukan Aljazair di bawah pimpinan Ramadan Pasha, pasukan dari Tripoli di bawah pimpinan Mustafa Pasha, dan sukarelawan dari Mesir. Pertempuran dimulai pada musim semi tahun 981 H/1574 M. Kesultanan Utsmaniyah merebut Halq al-Wad setelah pengepungan ketat, dan kota Tunis dikepung. Pasukan Spanyol melarikan diri bersama raja Hafsid, Muhammad ibn al-Hasan, ke Bastion, yang telah diperkuat secara ekstensif oleh Spanyol, menjadikannya salah satu benteng yang paling tak tertembus di Afrika Utara. Setelah mengumpulkan pasukan mereka, Kesultanan Utsmaniyah melanjutkan pengepungan dan memperketat kepungan di sekitarnya. {cite:dawlat-uthmaniyya-salabi p. 285}."
