label: { ar: "استرداد تونس من الإسبان" }
summary:
  ar: "أصدر السلطان سليم الثاني أوامره إلى وزيره سنان باشا وقبودانه قلج علي بالاستعداد للتوجه إلى تونس لفتحها نهائياً وإعادة نفوذ الدولة العثمانية إليها، وتعبأت مائتان وثمان وثلاثون سفينة مختلفة الأحجام وأُحضر المجدفون اللازمون، وأخذ حيدر باشا الحاكم العثماني في تونس — وقد انسحب إلى القيروان — في حشد المجاهدين من الأهالي الذين التفوا حوله. أبحر الأسطول بقيادة سنان باشا وقلج علي في ٢٣ محرم ٩٨٢هـ/١٤ مايو ١٥٧٤م فضرب ساحل كالابريا ومسينا واستولى على سفينة مسيحية ثم قطع عرض البحر في خمسة أيام، ووصل حيدر باشا وقوة من الجزائريين بقيادة رمضان باشا وقوة طرابلس بقيادة مصطفى باشا ومتطوعون من مصر. بدأ القتال في ربيع سنة ٩٨١هـ/١٥٧٤م فاستولى العثمانيون على حلق الواد بعد حصار محكم، وحوصرت مدينة تونس ففرّ الإسبان ومعهم الملك الحفصي محمد بن الحسن إلى البستيون التي بالغ الإسبان في تحصينها وجعلوها من أمنع الحصون في شمال أفريقية، فتوجه العثمانيون بعد تجمع قواتهم إلى حصارها وضيّقوا الخناق عليها {cite:dawlat-uthmaniyya-salabi p. 285}."
  en: "The final Ottoman recovery of Tunis, 1574 — Selim II sent Sinan Pasha and Kapudan Kılıç Ali with 238 ships; La Goulette fell to a tight siege and the Spanish, with the Hafsid king Muhammad b. al-Hasan, were driven into their showpiece fortress, the Bastion {cite:dawlat-uthmaniyya-salabi p. 285}."
