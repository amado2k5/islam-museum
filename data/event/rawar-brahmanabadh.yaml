label: { ar: "فتح راور وبرهمباذ", en: "The Storming of Rawar and Brahmanabadh", es: "El asalto a Rawar y Brahmanabadh", fr: "La prise d'assaut de Rawar et de Brahmanabad" }
summary:
  ar: "فتح محمد بن القاسم راور عنوة وكانت بها امرأة لداهر فخافت أن تؤخذ فأحرقت نفسها وجواريها وجميع مالها ثم أتى برهمباذ العتيقة وهي على رأس فرسخين من المنصورة ولم تكن المنصورة يومئذ إنما كان موضعها غيضة وكان فل داهر ببرهمباذ هذه فقاتلوه ففتحها محمد عنوة وقتل بها ثمانية آلاف وقيل ستة وعشرون ألفاً وخلف فيها عامله وهي اليوم خراب وسار محمد يريد الرور وبغرور فتلقاه أهل ساوندرا فسألوه الأمان فأعطاهم إياه واشترط عليهم ضيافة المسلمين ودلالتهم وأهل ساوندرا اليوم مسلمون ثم تقدم إلى بسمد فصالح أهلها على مثل صلح ساوندرا وقال ابن الكلبي الذي قتل داهر القاسم بن ثعلبة بن عبد الله بن حصن الطائي."
  en: "Muhammad stormed Rawar, where a wife of Dahir, fearing capture, burned herself, her maids and her wealth; then Brahmanabadh al-Atiqa — two farsakhs from the later al-Mansura, then mere thicket — where Dahir's remnant fought and fell, eight thousand dead or twenty-six thousand by the larger count, and today ruins. Sawandra's folk won aman on hosting and guiding the Muslims — Muslims today — and Basmad truced the same. Ibn al-Kalbi names Dahir's killer al-Qasim ibn Tha'laba al-Ta'i."
  es: "Muhammad asaltó Rawar, donde una esposa de Dahir, temiendo ser capturada, se inmoló junto con sus criadas y sus bienes; luego Brahmanabadh al-Atiqa —dos farsakhs de la posterior al-Mansura, entonces un simple matorral— donde los supervivientes de Dahir lucharon y cayeron, ocho mil muertos o veintiséis mil según la versión más amplia, y hoy ruinas. La gente de Sawandra obtuvo un aman por acoger y guiar a los musulmanes —los musulmanes de hoy— y Basmad firmó una tregua al respecto. Ibn al-Kalbi nombra al asesino de Dahir al-Qasim ibn Tha'laba al-Ta'i."
  fr: "Muhammad prit d'assaut Rawar, où une épouse de Dahir, craignant d'être capturée, s'immola par le feu avec ses servantes et ses biens. Puis, à Brahmanabadh al-Atiqa – à deux farsakhs de ce qui deviendra plus tard al-Mansura, alors simple fourré –, les survivants de Dahir combattirent et périrent: huit mille morts, ou vingt-six mille selon le décompte le plus élevé. Aujourd'hui, il n'en reste que des ruines. Les habitants de Sawandra obtinrent l'aman en accueillant et en guidant les musulmans – les musulmans d'aujourd'hui – et Basmad conclut une trêve en ce sens. Ibn al-Kalbi nomme le meurtrier de Dahir al-Qasim ibn Tha'laba al-Ta'i."
