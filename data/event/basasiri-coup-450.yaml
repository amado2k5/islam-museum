label: { ar: "وقعة البساسيري والخطبة للمستنصر العبيدي ببغداد", en: "The battle of al-Basasiri and the sermon for the Ubaydi al-Mustansir in Baghdad" }
summary:
  ar: "عظم أمر أرسلان التركي البساسيري ودعي له على المنابر وجبى الأموال ولم يكن القائم يقطع أمراً دونه ثم صح عنده سوء عقيدته وبلغه أنه عزم على نهب دار الخلافة والقبض على الخليفة فكاتب القائم طغرل بك وهو بالري يستنهضه في القدوم فقدم في سنة سبع وأربعين وذهب البساسيري إلى الرحبة وكاتب صاحب مصر فأمده بالأموال وكاتب ينال أخا طغرل بك وأطمعه بمنصب أخيه فاشتغل به طغرل بك ثم قدم البساسيري بغداد في سنة خمسين ومعه الرايات المصرية ودعي لصاحب مصر المستنصر بجامع المنصور وزيد في الأذان حي على خير العمل ودام القتال شهراً ثم قبض على الخليفة في ذي الحجة وسيره إلى عانة فحبسه بها وروي أن الخليفة كتب قصة نفذها إلى مكة فعلقت في الكعبة فيها إلى الله العظيم من المسكين عبده ثم ظفر طغرل بك بأخيه وقتله وكاتب متولي عانة في رد الخليفة إلى داره مكرماً فحصل في مقر عزه في الخامس والعشرين من ذي القعدة سنة إحدى وخمسين وجهز طغرل بك جيشاً فظفروا بالبساسيري فقتل وحمل رأسه إلى بغداد {cite:tarikh-khulafa-minhaj-1434 p. 642-643}. وآوى أمير العرب هارش بن المجلى العقيلي صاحب الحديثة الخليفة القائم سنة كاملة حتى جاء طغرلك وقتل البساسيري منتصف ذي الحجة وعاد القائم إلى بغداد في مثل اليوم الذي خرج منها بعد حول كامل وكان ذلك من غريب الاتفاق {cite:shadharat-dhahab p. 296}. ويوثق ابن الجوزي فزع بغداد المشهود: طارت على دار الخليفة ليلة الهلع نحو عشر بومات مجتمعات يصحن صياحاً من عجب، وقطع الكندري وربيبه أنوشروان الجسر وراءهما فارّين إلى الجانب الغربي فانتُهبت دارهما، ونزل قريش بن بدران في نحو مائتي فارس على مشرعة باب البصرة، ودخل البساسيري بغداد وعلى رأسه أعلام مكتوب عليها الإمام المستنصر بالله أبو تميم معد أمير المؤمنين، وكان قد جمع العيارين وأهل الرساتيق وأطمعهم في نهب دار الخلافة والناس في ضر ومجاعة {cite:muntazam-ibn-al-jawzi j.8 p.110-112}. ثم إن طغرل بك لما قدم أعاد الخليفة إلى دار الخلافة مكرماً، وخرج البساسيري إلى الكوفة فقتله عسكر السلطان يوم الخميس منتصف ذي الحجة سنة ٤٥١ ووُجد في جيبه خمسة دنانير، وحُمل رأسه إلى بغداد فطيف به على قناة وصُلب بباب النوبي، وأُحرقت الكرخ يومئذ إحراقاً لم يسلم منه دار الكتب، ووقع ذلك يوم الثلاثاء الذي كان قد دخل فيه بغداد أول مرة {cite:muntazam-ibn-al-jawzi j.8 p.547-553}."
  en: "Arslan al-Basasiri grew so mighty he was preached on the minbars and the caliph decided nothing without him; when his ill creed proved out and his plan to sack the palace surfaced, al-Qa'im wrote secretly to Tughrul Beg at Rayy. Tughrul came in 447; al-Basasiri fell back to Rahba, took the Egyptian al-Mustansir's money and the treacherous brother Inal's distraction. In 450 he entered Baghdad under Egyptian banners — the khutba went to al-Mustansir at the Mansur mosque, 'hayya ala khayr al-amal' entered the adhan — and seized the caliph in Dhu'l-Hijja, jailing him at Ana; the caliph's letter to God was hung on the Ka'ba. Tughrul killed Inal, had the caliph returned in honour on 25 Dhu'l-Qa'da 451, and al-Basasiri's head reached Baghdad {cite:tarikh-khulafa-minhaj-1434 p. 642-643}."
