id: event/basasiri-coup-450
class: event
kind: revolt
label: { ar: "وقعة البساسيري والخطبة للمستنصر العبيدي ببغداد" }
summary:
  ar: "عظم أمر أرسلان التركي البساسيري ودعي له على المنابر وجبى الأموال ولم يكن القائم يقطع أمراً دونه ثم صح عنده سوء عقيدته وبلغه أنه عزم على نهب دار الخلافة والقبض على الخليفة فكاتب القائم طغرل بك وهو بالري يستنهضه في القدوم فقدم في سنة سبع وأربعين وذهب البساسيري إلى الرحبة وكاتب صاحب مصر فأمده بالأموال وكاتب ينال أخا طغرل بك وأطمعه بمنصب أخيه فاشتغل به طغرل بك ثم قدم البساسيري بغداد في سنة خمسين ومعه الرايات المصرية ودعي لصاحب مصر المستنصر بجامع المنصور وزيد في الأذان حي على خير العمل ودام القتال شهراً ثم قبض على الخليفة في ذي الحجة وسيره إلى عانة فحبسه بها وروي أن الخليفة كتب قصة نفذها إلى مكة فعلقت في الكعبة فيها إلى الله العظيم من المسكين عبده ثم ظفر طغرل بك بأخيه وقتله وكاتب متولي عانة في رد الخليفة إلى داره مكرماً فحصل في مقر عزه في الخامس والعشرين من ذي القعدة سنة إحدى وخمسين وجهز طغرل بك جيشاً فظفروا بالبساسيري فقتل وحمل رأسه إلى بغداد {cite:tarikh-khulafa-minhaj-1434 p. 642-643}. وآوى أمير العرب هارش بن المجلى العقيلي صاحب الحديثة الخليفة القائم سنة كاملة حتى جاء طغرلك وقتل البساسيري منتصف ذي الحجة وعاد القائم إلى بغداد في مثل اليوم الذي خرج منها بعد حول كامل وكان ذلك من غريب الاتفاق {cite:shadharat-dhahab p. 296}."
  en: "Arslan al-Basasiri grew so mighty he was preached on the minbars and the caliph decided nothing without him; when his ill creed proved out and his plan to sack the palace surfaced, al-Qa'im wrote secretly to Tughrul Beg at Rayy. Tughrul came in 447; al-Basasiri fell back to Rahba, took the Egyptian al-Mustansir's money and the treacherous brother Inal's distraction. In 450 he entered Baghdad under Egyptian banners — the khutba went to al-Mustansir at the Mansur mosque, 'hayya ala khayr al-amal' entered the adhan — and seized the caliph in Dhu'l-Hijja, jailing him at Ana; the caliph's letter to God was hung on the Ka'ba. Tughrul killed Inal, had the caliph returned in honour on 25 Dhu'l-Qa'da 451, and al-Basasiri's head reached Baghdad {cite:tarikh-khulafa-minhaj-1434 p. 642-643}."
