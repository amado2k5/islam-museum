label: { ar: "وقعة البساسيري والخطبة للمستنصر العبيدي ببغداد", en: "The battle of al-Basasiri and the sermon for the Ubaydi al-Mustansir in Baghdad", fr: "La bataille d'al-Basasiri et le sermon pour l'Ubaydide al-Mustansir à Bagdad", es: "La batalla de al-Basasiri y el sermón para el Ubaydi al-Mustansir en Bagdad", ur: "البصیری کی جنگ اور بغداد میں عبیدی المستنصر کا خطبہ", tr: "Basasiri Muharebesi ve Bağdat'ta Mustansir el-Ubaydı'nın vaazı", id: "Perang al-Basasiri dan khutbah al-Mustansir al-Ubaydi di Baghdad" }
summary:
  ar: "عظم أمر أرسلان التركي البساسيري ودعي له على المنابر وجبى الأموال ولم يكن القائم يقطع أمراً دونه ثم صح عنده سوء عقيدته وبلغه أنه عزم على نهب دار الخلافة والقبض على الخليفة فكاتب القائم طغرل بك وهو بالري يستنهضه في القدوم فقدم في سنة سبع وأربعين وذهب البساسيري إلى الرحبة وكاتب صاحب مصر فأمده بالأموال وكاتب ينال أخا طغرل بك وأطمعه بمنصب أخيه فاشتغل به طغرل بك ثم قدم البساسيري بغداد في سنة خمسين ومعه الرايات المصرية ودعي لصاحب مصر المستنصر بجامع المنصور وزيد في الأذان حي على خير العمل ودام القتال شهراً ثم قبض على الخليفة في ذي الحجة وسيره إلى عانة فحبسه بها وروي أن الخليفة كتب قصة نفذها إلى مكة فعلقت في الكعبة فيها إلى الله العظيم من المسكين عبده ثم ظفر طغرل بك بأخيه وقتله وكاتب متولي عانة في رد الخليفة إلى داره مكرماً فحصل في مقر عزه في الخامس والعشرين من ذي القعدة سنة إحدى وخمسين وجهز طغرل بك جيشاً فظفروا بالبساسيري فقتل وحمل رأسه إلى بغداد {cite:tarikh-khulafa-minhaj-1434 p. 642-643}. وآوى أمير العرب هارش بن المجلى العقيلي صاحب الحديثة الخليفة القائم سنة كاملة حتى جاء طغرلك وقتل البساسيري منتصف ذي الحجة وعاد القائم إلى بغداد في مثل اليوم الذي خرج منها بعد حول كامل وكان ذلك من غريب الاتفاق {cite:shadharat-dhahab p. 296}. ويوثق ابن الجوزي فزع بغداد المشهود: طارت على دار الخليفة ليلة الهلع نحو عشر بومات مجتمعات يصحن صياحاً من عجب، وقطع الكندري وربيبه أنوشروان الجسر وراءهما فارّين إلى الجانب الغربي فانتُهبت دارهما، ونزل قريش بن بدران في نحو مائتي فارس على مشرعة باب البصرة، ودخل البساسيري بغداد وعلى رأسه أعلام مكتوب عليها الإمام المستنصر بالله أبو تميم معد أمير المؤمنين، وكان قد جمع العيارين وأهل الرساتيق وأطمعهم في نهب دار الخلافة والناس في ضر ومجاعة {cite:muntazam-ibn-al-jawzi j.8 p.110-112}. ثم إن طغرل بك لما قدم أعاد الخليفة إلى دار الخلافة مكرماً، وخرج البساسيري إلى الكوفة فقتله عسكر السلطان يوم الخميس منتصف ذي الحجة سنة ٤٥١ ووُجد في جيبه خمسة دنانير، وحُمل رأسه إلى بغداد فطيف به على قناة وصُلب بباب النوبي، وأُحرقت الكرخ يومئذ إحراقاً لم يسلم منه دار الكتب، ووقع ذلك يوم الثلاثاء الذي كان قد دخل فيه بغداد أول مرة {cite:muntazam-ibn-al-jawzi j.8 p.547-553}."
  en: "Arslan al-Basasiri grew so mighty he was preached on the minbars and the caliph decided nothing without him; when his ill creed proved out and his plan to sack the palace surfaced, al-Qa'im wrote secretly to Tughrul Beg at Rayy. Tughrul came in 447; al-Basasiri fell back to Rahba, took the Egyptian al-Mustansir's money and the treacherous brother Inal's distraction. In 450 he entered Baghdad under Egyptian banners — the khutba went to al-Mustansir at the Mansur mosque, 'hayya ala khayr al-amal' entered the adhan — and seized the caliph in Dhu'l-Hijja, jailing him at Ana; the caliph's letter to God was hung on the Ka'ba. Tughrul killed Inal, had the caliph returned in honour on 25 Dhu'l-Qa'da 451, and al-Basasiri's head reached Baghdad {cite:tarikh-khulafa-minhaj-1434 p. 642-643}."
  fr: "Arslan al-Basasiri devint si puissant qu'on prêchait en son nom sur les chaires et que le calife ne décidait rien sans lui ; quand sa mauvaise croyance se confirma et que son projet de piller le palais fut découvert, al-Qa'im écrivit secrètement à Tughrul Beg à Rayy. Tughrul vint en 447 ; al-Basasiri se replia sur Rahba, prit l'argent de l'Égyptien al-Mustansir et profita de la diversion du frère traître Inal. En 450, il entra dans Bagdad sous les bannières égyptiennes ; la khutba fut prononcée pour al-Mustansir à la mosquée d'al-Mansur, « hayya ala khayr al-amal » entra dans l'appel à la prière, et il saisit le calife en Dhu'l-Hijja, l'emprisonnant à Ana ; la lettre du calife à Dieu fut suspendue à la Kaaba. Tughrul tua Inal, fit ramener le calife avec honneur le 25 Dhu'l-Qa'da 451, et la tête d'al-Basasiri parvint à Bagdad {cite:tarikh-khulafa-minhaj-1434 p. 642-643}."
  es: "Arslan al-Basasiri se hizo tan poderoso que predicaba en los minbares y el califa no tomaba ninguna decisión sin él; cuando su perversa ideología quedó al descubierto y salió a la luz su plan para saquear el palacio, al-Qa'im escribió en secreto a Tughrul Beg en Rayy. Tughrul llegó en 447; al-Basasiri se replegó a Rahba, tomó el dinero del egipcio al-Mustansir y la distracción de su traicionero hermano Inal. En 450 entró en Bagdad bajo estandartes egipcios —la jutba se dirigió a al-Mustansir en la mezquita de Mansur, 'hayya ala khayr al-amal' entró en el adhan— y apresó al califa en Dhu'l-Hijja, encarcelándolo en Ana; la carta del califa a Dios fue colgada en la Kaaba. Tughrul mató a Inal, el califa regresó con honores el 25 de Dhu'l-Qa'da de 451 y la cabeza de al-Basasiri llegó a Bagdad {cita:tarikh-khulafa-minhaj-1434 p. 642-643}."
  ur: "ارسلان البصیری اتنا طاقتور ہو گیا کہ منبروں پر اس کی تبلیغ کی گئی اور خلیفہ نے اس کے بغیر کوئی فیصلہ نہیں کیا۔ جب اس کی بدعت ثابت ہوئی اور اس کا محل کو توڑنے کا منصوبہ سامنے آیا تو القائم نے طغرل بیگ کو رے میں خفیہ طور پر خط لکھا۔ تغرل 447 میں آیا۔ البصیری واپس رہبہ میں گر گیا، مصری المستنصر کی رقم اور غدار بھائی انال کی خلفشار کے ساتھ لے گیا۔ 450 میں وہ مصری جھنڈے تلے بغداد میں داخل ہوا - منصور کی مسجد میں خطبہ المستنصر میں گیا، 'حیا الا خیر الامال' اذان میں داخل ہوا - اور ذی الحجہ میں خلیفہ کو پکڑ کر عنا میں جیل بھیج دیا۔ خدا کے نام خلیفہ کا خط خانہ کعبہ پر لٹکا دیا گیا۔ طغرل نے عنال کو قتل کیا، 25 ذوالقعدہ 451 کو خلیفہ عزت کے ساتھ واپس آیا اور البصیری کا سر بغداد پہنچا۔ 642-643}۔"
  tr: "Arslan el-Turki el-Basasiri'nin gücü arttı ve camilerde onun için dualar edildi. Vergi topladı ve halife onun onayı olmadan hiçbir karar almadı. Sonra halife, inançlarının bozulduğunun farkına vardı ve halifenin sarayını yağmalayıp halifeyi tutuklamayı planladığını öğrendi. Bunun üzerine halife, Rayy'da bulunan Tuğrul Bey'e mektup yazarak onu gelmeye çağırdı. Tuğrul Bey 447 Hicri yılında geldi. El-Basasiri, Rahba'ya gitti ve Mısır hükümdarına mektup yazdı; hükümdar ona fon sağladı. Ayrıca Tuğrul Bey'in kardeşi Yanal'a da mektup yazarak onu kardeşinin makamıyla cezbetmeye çalıştı. Tuğrul Bey bu durumla meşgul oldu. Sonra El-Basasiri, 550 Hicri yılında Mısır sancaklarını taşıyarak Bağdat'a geldi. El-Mansur Camii'nde Mısır hükümdarı el-Mustansir için dualar edildi ve ezana \"En hayırlı amellere gel\" ifadesi eklendi. Savaş bir ay sürdü, ardından halife Zilhicce ayında tutuklandı ve Ana'ya gönderilerek hapsedildi. Rivayetlere göre halife bir mektup yazdı ve Mekke'ye gönderdi, bu mektup Kâbe'ye asıldı. Mektupta \"Yüce Allah'a, zavallı kulundan\" yazıyordu. Sonra Tuğrul Bey kardeşini yakalayıp öldürdü. Ana valisine bir mektup yazarak halifenin şerefle sarayına dönmesini istedi. Halife Zilhicce ayının 25'inde iktidarına kavuştu. 51 yılında Tuğrul Bey bir ordu hazırladı ve el-Basasiri'yi yakalayıp öldürdüler ve başını Bağdat'a götürdüler. {cite:tarikh-khulafa-minhaj-1434 s. 642-643}. Arap prensi Harş ibn el-Mücelli el-Ukayili, el-Haditha hükümdarı, Halife el-Kaim'i tam bir yıl boyunca himaye etti, ta ki Tuğrul Bey gelip Zilhicce ayının ortasında el-Basasiri'yi öldürene kadar. El-Kaim, bir yıl sonra ayrıldığı gün Bağdat'a geri döndü ve bu garip bir tesadüftü. {kaynak: Şadharat-dhahab s. 296}. İbn el-Cevzi, Bağdat'ta tanık olunan paniği şöyle belgeliyor: Panik gecesi, Halife'nin evinin üzerinden yaklaşık on baykuş uçtu, bir araya toplandılar ve hayretle öttüler. El-Kandari ve evlatlık oğlu Anuşirvan, onların arkasından köprüden geçerek batı tarafına kaçtılar ve evleri yağmalandı. Kureyş bin Bediran, Bab el-Basra'nın eteklerine yaklaşık iki yüz süvariyle indi. El-Basasiri, başında “İmam el-Mustansir Billah Abu Tamim Ma’ad, Müminlerin Komutanı” yazılı sancaklarla Bağdat'a girdi. Haydutları ve kırsal kesim halkını toplayıp, halk zorluk ve kıtlık çekerken halifenin evini yağmalamaları için onları kışkırtmıştı. {cite:muntazam-ibn-al-jawzi j.8 s.110-112}. Sonra Tuğrul Bey geldiğinde, halifeyi onurla halifelik sarayına geri götürdü. El-Basasiri Kufa'ya gitti ve Sultan'ın ordusu onu 451 yılının Zilhicce ayının ortasında, Perşembe günü öldürdü. Cebinde beş dinar bulundu. Başı Bağdat'a götürüldü, bir kanalda dolaştırıldı ve Bab el-Nubi'de çarmıha gerildi. O gün El-Karkh yakıldı ve Kitap Evi de kurtulamadı. Bu olay, onun Bağdat'a ilk giriş yaptığı Salı günü gerçekleşti. {cite:muntazam-ibn-al-jawzi j.8 p.547-553}"
  id: "Kekuasaan Arslan al-Turki al-Basasiri semakin besar, dan doa-doa dipanjatkan untuknya di masjid-masjid. Ia memungut pajak, dan Khalifah tidak mengambil keputusan tanpa persetujuannya. Kemudian Khalifah menyadari kerusakan keyakinannya dan mengetahui bahwa ia bermaksud menjarah istana Khalifah dan menangkap Khalifah. Maka Khalifah menulis surat kepada Tughril Beg, yang berada di Rayy, mendesaknya untuk datang. Tughril Beg tiba pada tahun 447 H. Al-Basasiri pergi ke al-Rahba dan menulis surat kepada penguasa Mesir, yang memberinya dana. Ia juga menulis surat kepada Yanal, saudara Tughril Beg, membujuknya dengan posisi saudaranya. Tughril Beg menjadi tertarik dengan hal ini. Kemudian al-Basasiri tiba di Baghdad pada tahun 550 H, membawa panji-panji Mesir. Doa dipanjatkan untuk penguasa Mesir, al-Mustansir, di Masjid al-Mansur, dan frasa \"Marilah kepada amal perbuatan yang terbaik\" ditambahkan pada seruan azan. Perang berlangsung selama sebulan, kemudian Khalifah ditangkap pada bulan Dzul Hijjah dan dikirim ke Ana, tempat ia dipenjara. Dikatakan bahwa Khalifah menulis surat yang dikirimnya ke Mekah, dan surat itu digantung di Ka'bah. Surat itu berisi kata-kata, \"Kepada Allah Yang Maha Kuasa, dari hamba-Nya yang miskin.\" Kemudian Tughril Beg menangkap saudaranya dan membunuhnya. Ia menulis surat kepada gubernur Ana, meminta Khalifah kembali ke istananya dengan hormat. Ia tiba di tempat kekuasaannya pada tanggal 25 Dzul 51. Pada tahun 51, Tughril Beg mempersiapkan pasukan, dan mereka menangkap al-Basasiri, yang kemudian dibunuh, dan kepalanya dibawa ke Baghdad. {cite:tarikh-khulafa-minhaj-1434 p. 642-643}. Pangeran Arab, Harsh ibn al-Mujalli al-Uqaili, penguasa al-Haditha, melindungi Khalifah al-Qaim selama setahun penuh hingga Tughril Beg datang dan membunuh al-Basasiri di pertengahan Dzul Hijjah. Al-Qaim kembali ke Baghdad pada hari yang sama setelah setahun penuh, dan itu adalah kebetulan yang aneh. {cite:shadharat-dhahab hlm. 296}. Ibn al-Jawzi mendokumentasikan kepanikan yang disaksikan di Baghdad: Pada malam kepanikan itu, sekitar sepuluh burung hantu terbang di atas rumah Khalifah, berkumpul bersama, berteriak keheranan. Al-Kandari dan putra angkatnya Anushirwan menyeberangi jembatan di belakang mereka, melarikan diri ke sisi barat, dan rumah mereka dijarah. Quraish bin Badran turun dengan sekitar dua ratus penunggang kuda di pinggiran Bab al-Basra. Al-Basasiri memasuki Baghdad dengan panji-panji di kepalanya yang bertuliskan, “Imam al-Mustansir Billah Abu Tamim Ma’ad, Panglima Kaum Beriman.” Ia telah mengumpulkan para perampok dan penduduk pedesaan dan membujuk mereka untuk menjarah rumah Khalifah, sementara rakyat menderita kesulitan dan kelaparan. {cite:muntazam-ibn-al-jawzi j.8 p.110-112}. Kemudian, ketika Tughril Beg tiba, ia mengembalikan Khalifah ke Istana Kekhalifahan dengan hormat. Al-Basasiri pergi ke Kufa, dan tentara Sultan membunuhnya pada hari Kamis, pertengahan Dzul Hijjah tahun 451. Lima dinar ditemukan di sakunya. Kepalanya dibawa ke Baghdad dan diarak di sebuah kanal dan disalibkan di Bab al-Nubi. Al-Karkh dibakar pada hari itu, dan Rumah Kitab pun tidak luput. Ini terjadi pada hari Selasa ketika ia pertama kali memasuki Baghdad. {kutip:muntazam-ibn-al-jawzi j.8 hal.547-553}"
