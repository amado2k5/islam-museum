id: event/basasiri-coup-450
education:
  did_you_know:
    ar: "عظم أمر البساسيري التركي حتى دُعي له على المنابر وجبى الأموال، ولم يكن القائم يقطع أمراً دونه، حتى صح عنده سوء عقيدته وبلغه أنه عزم على نهب دار الخلافة."
    en: "The Turk al-Basasiri rose so high the khutba named him and he collected the revenue while caliph al-Qa'im decided nothing without him — until word came that he meant to plunder the caliphal palace."
    ur: "ترک بساسیری کا رعب اتنا بڑھا کہ منبروں پر اس کا نام لیا گیا اور خلیفہ قائم اس کے بغیر کوئی فیصلہ نہیں کرتا تھا — یہاں تک کہ خبر آئی کہ وہ دارالخلافہ لوٹنا چاہتا ہے۔"
    sources: [source/tabari-tarikh-abu-al-fadl, source/tarikh-khulafa-minhaj-1434]
