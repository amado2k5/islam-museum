id: event/shaytan-eats-and-drinks-with-the-left-hand
class: event
kind: other
label:
  ar: الشيطان يأكل ويشرب بشماله
  en: The shaytan eats and drinks with his left
  ur: شیطان بائیں ہاتھ سے کھاتا اور پیتا ہے
summary:
  ar: عن عبد الله بن عمر أن رسول الله قال إذا أكل أحدكم فليأكل بيمينه وليشرب بيمينه فإن الشيطان يأكل بشماله ويشرب بشماله {cite:muwatta-maruf-1997} [[passage/muwatta-31-2671|الموطأ 2671]].
  en: 'Abdullah ibn Umar reported that the Messenger of God said: when one of you eats let him eat with his right hand and drink with his right hand, for the shaytan eats with his left and drinks with his
    left {cite:muwatta-maruf-1997} [[passage/muwatta-31-2671|Muwatta 2671]].'
  ur: 'عبد اللہ بن عمر سے روایت ہے کہ رسول اللہ نے کہا: جب تم میں سے کوئی کھائے تو اپنے دائیں ہاتھ سے کھائے اور دائیں ہاتھ سے پئے، کیونکہ شیطان بائیں ہاتھ سے کھاتا اور بائیں ہاتھ سے پیتا ہے {cite:muwatta-maruf-1997}
    [[passage/muwatta-31-2671|موطأ 2671]]۔'
