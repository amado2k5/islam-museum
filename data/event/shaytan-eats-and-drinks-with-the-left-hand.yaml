id: event/shaytan-eats-and-drinks-with-the-left-hand
class: event
kind: other
label:
  ar: الشيطان يأكل ويشرب بشماله
  en: The shaytan eats and drinks with his left
  ur: شیطان بائیں ہاتھ سے کھاتا اور پیتا ہے
  es: "El shaytan come y bebe con su izquierda"
  fr: "Le shaytan mange et boit de la main gauche."
  tr: "Şeytan sol eliyle yer ve içer."
  id: "Setan makan dan minum dengan tangan kirinya."
summary:
  ar: عن عبد الله بن عمر أن رسول الله قال إذا أكل أحدكم فليأكل بيمينه وليشرب بيمينه فإن الشيطان يأكل بشماله ويشرب بشماله {cite:muwatta-maruf-1997} [[passage/muwatta-31-2671|الموطأ 2671]].
  en: 'Abdullah ibn Umar reported that the Messenger of God said: when one of you eats let him eat with his right hand and drink with his right hand, for the shaytan eats with his left and drinks with his
    left {cite:muwatta-maruf-1997} [[passage/muwatta-31-2671|Muwatta 2671]].'
  ur: 'عبد اللہ بن عمر سے روایت ہے کہ رسول اللہ نے کہا: جب تم میں سے کوئی کھائے تو اپنے دائیں ہاتھ سے کھائے اور دائیں ہاتھ سے پئے، کیونکہ شیطان بائیں ہاتھ سے کھاتا اور بائیں ہاتھ سے پیتا ہے {cite:muwatta-maruf-1997}
    [[passage/muwatta-31-2671|موطأ 2671]]۔'
  es: "Abdullah ibn Umar informó que el Mensajero de Dios dijo: cuando uno de vosotros coma, que coma con su mano derecha y beba con su mano derecha, pues el shaytan come con su izquierda y bebe con su izquierda {cite:muwatta-maruf-1997} [[passage/muwatta-31-2671|Muwatta 2671]]."
  fr: "Abdullah ibn Umar a rapporté que le Messager de Dieu a dit: lorsque l'un d'entre vous mange, qu'il mange avec sa main droite et boive avec sa main droite, car le shaytan mange avec sa gauche et boit avec sa gauche {cite:muwatta-maruf-1997} [[passage/muwatta-31-2671|Muwatta 2671])."
  tr: "Abdullah bin Ömer'den rivayet edildiğine göre, Allah Resulü şöyle buyurmuştur: \"Sizden biri yemek yerken sağ eliyle yesin, sağ eliyle içsin; çünkü şeytan sol eliyle yer, sol eliyle içer.\" {cite:muwatta-maruf-1997} [[passage/muwatta-31-2671|Al-Muwatta 2671]]."
  id: "Berdasarkan riwayat Abdullah bin Omar, bahwa Rasulullah SAW bersabda: “Apabila salah seorang dari kalian makan, hendaklah ia makan dengan tangan kanan dan minum dengan tangan kanan, karena setan makan dengan tangan kiri dan minum dengan tangan kiri.” {cite:muwatta-maruf-1997} [[passage/muwatta-31-2671|Al-Muwatta 2671]]."
