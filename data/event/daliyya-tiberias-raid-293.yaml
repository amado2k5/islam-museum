id: event/daliyya-tiberias-raid-293
class: event
kind: raid
label: { ar: "خروج أخي صاحب الشامة ووقعة طبرية", en: "The Rising of the Brother of Sahib al-Shama and the Battle of Tiberias", es: "El levantamiento del hermano de Sahib al-Shama y la batalla de Tiberíades", fr: "Le soulèvement du frère de Sahib al-Shama et la bataille de Tibériade", ur: "صاحب الشاما کے بھائی کا عروج اور تبریاس کی جنگ", tr: "Benli kardeşimin gidişi ve Taberiye Savaşı", id: "Kepergian saudaraku, yang punya tahi lalat, dan Pertempuran Tiberias" }
summary:
  ar: "في سنة ثلاث وتسعين ومائتين ورد الخبر أن أخا الحسين بن زكرويه المعروف بصاحب الشامة ظهر بالدالية من طريق الفرات واجتمع إليه جماعة من الأعراب والمتلصصة فدعا بتلك الناحية وحارب أهلها فخرج إليه الجند، ثم صار إلى طبرية فامتنعوا من إدخاله فحاربهم حتى دخلها فقتل عامة من بها من الرجال والنساء ونهبها وانصرف إلى ناحية البادية {cite:muntazam-ibn-al-jawzi p. 348-349}."
  en: "In 293 the brother of al-Husayn ibn Zikrawayh, Sahib al-Shama, appeared at al-Daliyya on the Euphrates road drawing Arabs and footpads; refused entry to Tiberias he fought his way in, killed most of the men and women in it, plundered it and withdrew to the desert {cite:muntazam-ibn-al-jawzi p. 348-349}."
  es: "En 293, el hermano de al-Husayn ibn Zikrawayh, Sahib al-Shama, apareció en al-Daliyya, en el camino del Éufrates, atrayendo a árabes y soldados a pie; al negársele la entrada a Tiberíades, se abrió paso a la fuerza, mató a la mayoría de los hombres y mujeres que había en ella, la saqueó y se retiró al desierto {cite:muntazam-ibn-al-jawzi p. 348-349}."
  fr: "En 293, le frère d'al-Husayn ibn Zikrawayh, Sahib al-Shama, apparut à al-Daliyya sur la route de l'Euphrate, attirant des Arabes et des pillards; s'étant vu refuser l'entrée à Tibériade, il s'y fraya un chemin, tua la plupart des hommes et des femmes qui s'y trouvaient, la pilla et se retira dans le désert {cite:muntazam-ibn-al-jawzi p. 348-349}."
  ur: "293 میں الحسین ابن زکراویہ کے بھائی صاحب الشامہ، فرات کی سڑک پر الدالیہ میں عربوں اور قدموں کو کھینچتے ہوئے نمودار ہوئے۔ اس نے تبریاس میں داخلے سے انکار کر دیا، اس نے اپنے راستے سے لڑا، اس میں موجود زیادہ تر مردوں اور عورتوں کو قتل کر دیا، اسے لوٹ لیا اور صحرا کی طرف واپس چلا گیا۔ 348-349}۔"
  tr: "Hicri 293 yılında, Köstebek sahibi olarak bilinen Hüseyin ibn Zekrawayh'ın kardeşinin Fırat yolundaki Daliye'de ortaya çıktığı haberi geldi. Etrafında bir grup Bedevi ve hırsız toplandı, bu yüzden o bölgeye saldırı emri verdi ve halkıyla savaştı. Askerler ona doğru geldi, sonra Taberiye'ye gitti, ancak onu içeri almayı reddettiler. Bunun üzerine içeri girene kadar onlarla savaştı ve oradaki erkek ve kadınların çoğunu öldürdü, yağmaladı ve çöl bölgesine geri döndü. {cite:muntazam-ibn-al-jawzi s. 348-349}"
  id: "Pada tahun 293 H, kabar datang bahwa saudara laki-laki Al-Husayn ibn Zakrawayh, yang dikenal sebagai pemilik tahi lalat, muncul di Al-Daliyah dalam perjalanan ke Efrat. Sekelompok Badui dan pencuri berkumpul di sekitarnya, sehingga ia menyerukan serangan di daerah itu dan melawan penduduknya. Para tentara keluar untuk menghadapinya, lalu ia pergi ke Tiberias, tetapi mereka menolak untuk membiarkannya masuk. Maka ia melawan mereka sampai ia memasuki kota itu, dan ia membunuh sebagian besar pria dan wanita di dalamnya, menjarahnya, dan kembali ke daerah gurun. {cite:muntazam-ibn-al-jawzi p. 348-349}."
