summary:
  ar: "في سنة ثلاث وتسعين ومائتين ورد الخبر أن أخا الحسين بن زكرويه المعروف بصاحب الشامة ظهر بالدالية من طريق الفرات واجتمع إليه جماعة من الأعراب والمتلصصة فدعا بتلك الناحية وحارب أهلها فخرج إليه الجند، ثم صار إلى طبرية فامتنعوا من إدخاله فحاربهم حتى دخلها فقتل عامة من بها من الرجال والنساء ونهبها وانصرف إلى ناحية البادية {cite:muntazam-ibn-al-jawzi p. 348-349}."
  en: "In 293 the brother of al-Husayn ibn Zikrawayh, Sahib al-Shama, appeared at al-Daliyya on the Euphrates road drawing Arabs and footpads; refused entry to Tiberias he fought his way in, killed most of the men and women in it, plundered it and withdrew to the desert {cite:muntazam-ibn-al-jawzi p. 348-349}."
