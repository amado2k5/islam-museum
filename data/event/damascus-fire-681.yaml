label: { ar: "حريق دمشق العظيم سنة 681هـ", en: "The Great Fire of Damascus in 681 AH", es: "El Gran Incendio de Damasco en el año 681 d. C.", fr: "Le grand incendie de Damas en 681 AH", ur: "681ھ میں دمشق کی عظیم آگ", tr: "Hicri 681 yılında Şam'da meydana gelen Büyük Yangın", id: "Kebakaran Besar Damaskus pada tahun 681 Hijriah" }
summary:
  ar: "في سنة إحدى وثمانين وست مئة كان بدمشق الحريق العظيم الذي لم يسمع بمثله أقامت النار ثلاثة أيام ليلاً ونهاراً وكان مبدؤه من الذهبيين وذهب للناس شيء كثير ولكن لم يحترق فيه أحد من الناس ومن جملة ما ذهب للشيخ شمس الدين الكتي المعروف بالفاشوشة خمسة عشر ألف مجلد، وحكى جمال الدين بن السراج البصروي قال تبنافى في الجامع وإذا الهواء يقذف ورقة من الحريق مكتوب فيها سلم الأمر راضياً جف بالكائن القلم {cite:shadharat-dhahab p. 379}."
  en: "The great fire of Damascus in 681 — three days and nights from the goldsmiths' quarter; al-Katti 'al-Fashusha' lost fifteen thousand volumes, yet no person burned; a wind-blown scrap carried verses of surrender {cite:shadharat-dhahab p. 379}."
  es: "El gran incendio de Damasco en 681 — tres días y tres noches desde el barrio de los orfebres; al-Katti 'al-Fashusha' perdió quince mil volúmenes, pero ninguna persona se quemó; un trozo arrastrado por el viento llevaba versos de rendición {cite:shadharat-dhahab p. 379}."
  fr: "Le grand incendie de Damas en 681 — trois jours et trois nuits depuis le quartier des orfèvres; al-Katti 'al-Fashusha' a perdu quinze mille volumes, pourtant personne n'a brûlé; un morceau de tissu emporté par le vent portait des versets de reddition {cite:shadharat-dhahab p. 379}."
  ur: "681 میں دمشق کی عظیم آگ - سناروں کے کوارٹر سے تین دن اور راتیں؛ الکتی 'الفشوشہ' کی پندرہ ہزار جلدیں ضائع ہوئیں، پھر بھی کوئی شخص نہیں جلا۔ ایک ہوا سے اڑا ہوا سکریپ ہتھیار ڈالنے کی آیات رکھتا ہے 379}۔"
  tr: "Hicri 681 yılında Şam'da, daha önce hiç duyulmamış büyük bir yangın çıktı. Yangın üç gün üç gece sürdü ve kuyumcularla başladı. Halkın birçok malı yok oldu, ancak kimse yanmadı. Yok olanlar arasında, el-Faşuşa olarak bilinen Şeyh Şemseddin el-Kutti'ye ait on beş bin cilt kitap da vardı. Cemaleddin ibn Siraj el-Basravi şöyle dedi: “Biz camideydik, rüzgar yangından bir yaprak savurdu; üzerinde şöyle yazıyordu: ‘Meseleyi memnuniyetle kabul ediyorum. Kalem, gelecek olanla kurudu.’” {kaynak: Şadharat-dhahab s. 379}"
  id: "Pada tahun 681 Hijriah, terjadi kebakaran besar di Damaskus, yang belum pernah terjadi sebelumnya. Kebakaran itu berlangsung selama tiga hari tiga malam, dan bermula dari para pengrajin emas. Banyak harta benda yang hilang, tetapi tidak ada seorang pun yang terbakar. Di antara yang hilang adalah lima belas ribu jilid buku milik Syekh Shams al-Din al-Kutti, yang dikenal sebagai al-Fashushah. Jamal al-Din ibn al-Siraj al-Basrawi berkata: “Kami berada di masjid ketika angin menerbangkan selembar daun dari api yang bertuliskan: ‘Aku menyerahkan perkara ini dengan tenang. Pena telah kering dengan apa yang akan datang.’” {kutip:shadharat-dhahab hlm. 379}"
