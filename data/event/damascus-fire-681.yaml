summary:
  ar: "في سنة إحدى وثمانين وست مئة كان بدمشق الحريق العظيم الذي لم يسمع بمثله أقامت النار ثلاثة أيام ليلاً ونهاراً وكان مبدؤه من الذهبيين وذهب للناس شيء كثير ولكن لم يحترق فيه أحد من الناس ومن جملة ما ذهب للشيخ شمس الدين الكتي المعروف بالفاشوشة خمسة عشر ألف مجلد، وحكى جمال الدين بن السراج البصروي قال تبنافى في الجامع وإذا الهواء يقذف ورقة من الحريق مكتوب فيها سلم الأمر راضياً جف بالكائن القلم {cite:shadharat-dhahab p. 379}."
  en: "The great fire of Damascus in 681 — three days and nights from the goldsmiths' quarter; al-Katti 'al-Fashusha' lost fifteen thousand volumes, yet no person burned; a wind-blown scrap carried verses of surrender {cite:shadharat-dhahab p. 379}."
