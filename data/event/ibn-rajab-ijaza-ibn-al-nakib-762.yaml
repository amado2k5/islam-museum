id: event/ibn-rajab-ijaza-ibn-al-nakib-762
class: event
kind: other
label:
  ar: "إجازة ابن النقيب لابن رجب، قبل ٧٦٤هـ"
  en: "Ibn al-Nakib's ijaza for Ibn Rajab, before 764"
  ur: "ابن نقیب کی طرف سے ابن رجب کو اجازت، 764ھ سے پہلے"
  es: "La ijaza de Ibn al-Nakib para Ibn Rajab, antes del 764"
  fr: "L'ijaza d'Ibn al-Nakib pour Ibn Rajab, avant 764"
  tr: "İbn el-Nakib'in İbn Receb'e verdiği izin, Hicri 764 yılından önce."
  id: "Izin Ibn al-Naqib kepada Ibn Rajab, sebelum tahun 764 H."
summary:
  ar: "أجاز لابن رجب المحدث شهاب الدين ابن النقيب ⁦(٦٩٤–٧٦٤هـ)⁩، فيكون ذلك قبل وفاة شيخه سنة ٧٦٤هـ، وكان ابن رجب يومها شاباً في العشرينات من عمره {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 8}."
  en: "The traditionist Shihab al-Din Ibn al-Nakib (694-764) gave Ibn Rajab an ijaza, which must have been before the shaykh's death in 764, when Ibn Rajab was a young man in his twenties {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 8}."
  ur: "محدث شہاب الدین ابن نقیب ⁦(694-764ھ)⁩ نے ابن رجب کو اجازت دی، جو شیخ کی وفات 764ھ سے پہلے ہونی چاہیے، جب ابن رجب بیس برس کے نوجوان تھے {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 8}۔"
  es: "El tradicionalista Shihab al-Din Ibn al-Nakib (694-764) le dio a Ibn Rajab una ijaza, que debió haber sido antes de la muerte del shaykh en 764, cuando Ibn Rajab era un joven de veintitantos años {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 8}."
  fr: "Le traditionniste Shihab al-Din Ibn al-Nakib (694-764) a donné à Ibn Rajab une ijaza, ce qui a dû se produire avant la mort du cheikh en 764, alors qu'Ibn Rajab était un jeune homme d'une vingtaine d'années {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 8}."
  tr: "Hadis âlimi Şihab el-Din İbn el-Nakib (694-764 Hicri), İbn Receb'e izin vermişti; bu da şeyhinin 764 Hicri yılında vefatından önce olmalıydı. İbn Receb o zamanlar yirmili yaşlarında genç bir adamdı. {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 8}."
  id: "Ulama hadits Shihab al-Din Ibn al-Naqib (694–764 H) memberikan izin kepada Ibn Rajab, sehingga hal itu terjadi sebelum wafatnya gurunya pada tahun 764 H. Ibn Rajab saat itu masih muda, berusia sekitar dua puluhan tahun. {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 8}."
