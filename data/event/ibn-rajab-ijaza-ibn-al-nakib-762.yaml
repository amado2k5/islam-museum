label:
  ar: "إجازة ابن النقيب لابن رجب، قبل ٧٦٤هـ"
  en: "Ibn al-Nakib's ijaza for Ibn Rajab, before 764"
  ur: "ابن نقیب کی طرف سے ابن رجب کو اجازت، 764ھ سے پہلے"
summary:
  ar: "أجاز لابن رجب المحدث شهاب الدين ابن النقيب (٦٩٤–٧٦٤هـ)، فيكون ذلك قبل وفاة شيخه سنة ٧٦٤هـ، وكان ابن رجب يومها شاباً في العشرينات من عمره {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 8}."
  en: "The traditionist Shihab al-Din Ibn al-Nakib (694-764) gave Ibn Rajab an ijaza, which must have been before the shaykh's death in 764, when Ibn Rajab was a young man in his twenties {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 8}."
  ur: "محدث شہاب الدین ابن نقیب (694-764ھ) نے ابن رجب کو اجازت دی، جو شیخ کی وفات 764ھ سے پہلے ہونی چاہیے، جب ابن رجب بیس برس کے نوجوان تھے {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 8}۔"
