summary:
  ar: "أشهر نص مناظرة مكتوب بين السنة والشيعة في القرن العشرين: كتاب يقدّمه ناشروه باعتباره 112 رسالة متبادلة بين العلامة الشيعي اللبناني [[person/abd-al-husayn-sharaf-al-din|عبد الحسين شرف الدين الموسوي]] وشيخ الأزهر [[person/salim-al-bishri|سليم البشري]] نحو 1911–1913، نشر الكتاب سنة 1936 بعد وفاة البشري بعقود، في مباحث الخلافة والإمامة وحجية كتب الحديث السنية. ويُلزم المتحف التنبيه على أن المؤرخين والدفاعيين السنة يطعنون بقوة في صحة النسبة وسلامة التفريغ لصدوره بعد وفاة البشري بلا تحقيق مخطوط خارجي، فهو نص أدب مناظرة لا وثيقة مقطوعة {cite:al-islam-murajaat}."
  en: "The most famous written Sunni–Shia debate text of the twentieth century: a book its publishers present as 112 letters exchanged between the Lebanese Shia scholar [[person/abd-al-husayn-sharaf-al-din|Abd al-Husayn Sharaf al-Din al-Musawi]] and the Shaykh of al-Azhar [[person/salim-al-bishri|Salim al-Bishri]] around 1911–1913, published in 1936 decades after al-Bishri's death, on the succession, the Imamate and the authority of the Sunni hadith collections. The museum must note that Sunni historians and apologists strongly contest its attribution and transcription, since it appeared decades after al-Bishri's death without external manuscript verification — it is a disputation text, not a secured document {cite:al-islam-murajaat}."
  es: "El texto escrito más famoso del siglo XX sobre el debate suní-chií: un libro que sus editores presentan como 112 cartas intercambiadas entre el erudito chií libanés [[person/abd-al-husayn-sharaf-al-din|Abd al-Husayn Sharaf al-Din al-Musawi]] y el jeque de al-Azhar [[person/salim-al-bishri|Salim al-Bishri]] entre 1911 y 1913, publicado en 1936, décadas después de la muerte de al-Bishri, sobre la sucesión, el Imamato y la autoridad de las colecciones de hadices suníes. El museo debe señalar que los historiadores y apologistas suníes cuestionan enérgicamente su atribución y transcripción, ya que apareció décadas después de la muerte de al-Bishri sin verificación manuscrita externa; se trata de un texto de disputa, no de un documento fidedigno {cite:al-islam-murajaat}."
  fr: "Le texte de débat sunnite-chiite le plus célèbre du XXe siècle: un ouvrage présenté par ses éditeurs comme un recueil de 112 lettres échangées entre le savant chiite libanais Abd al-Husayn Sharaf al-Din al-Musawi et le cheikh d’al-Azhar Salim al-Bishri, entre 1911 et 1913 environ. Publié en 1936, plusieurs décennies après la mort d’al-Bishri, il porte sur la succession, l’imamat et l’autorité des recueils de hadiths sunnites. Le musée tient à préciser que les historiens et apologistes sunnites contestent fermement son attribution et sa transcription, car il est paru des décennies après la mort d’al-Bishri sans vérification manuscrite externe; il s’agit d’un texte de controverse, et non d’un document officiel."
  ur: "بیسویں صدی کا سب سے مشہور تحریری سنی-شیعہ مباحثہ متن: ایک کتاب جس کے پبلشرز نے لبنانی شیعہ عالم [[شخص/عبدالحسین شرف الدین|عبدالحسین شرف الدین الموسوی]] اور الشیخ کے درمیان 112 خطوط کا تبادلہ کیا ہے۔ [[شخص/سالم البشری|سلیم البشری]] 1911-1913 کے آس پاس، البشری کی وفات کے بعد 1936 کے عشروں میں، جانشینی، امامت اور سنی احادیث کے مجموعے کے اختیار پر شائع ہوا۔ میوزیم کو یہ یاد رکھنا چاہیے کہ سنی مورخین اور معذرت خواہ اس کے انتساب اور نقل کی سختی سے مخالفت کرتے ہیں، کیونکہ یہ البشری کی موت کے کئی دہائیوں بعد بغیر کسی بیرونی نسخہ کی تصدیق کے شائع ہوا تھا - یہ ایک متنازعہ متن ہے، محفوظ دستاویز نہیں {حوالہ: الاسلام-مراجات}۔"
