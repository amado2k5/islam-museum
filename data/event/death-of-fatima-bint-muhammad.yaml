label: { en: "The death and burial of Fatima bint Muhammad", ar: "وفاة فاطمة بنت النبي ودفنها", es: "La muerte y el entierro de Fátima bint Muhammad", fr: "La mort et l'enterrement de Fatima bint Muhammad", ur: "فاطمہ بنت محمد کی وفات اور تدفین" }
summary:
  en: "Fatima died in Medina six months after the Prophet, on the night of Tuesday, 3 Ramadan 11 AH, in a narration Sallabi cites through Malik and Ali ibn al-Husayn. Abu Bakr and Umar came to condole with Ali; in one report Abu Bakr led the funeral prayer, while Muslim's report, which the book prefers, says Ali led it."
  ar: "توفيت فاطمة بالمدينة بعد النبي بنحو ستة أشهر، ليلة الثلاثاء لثلاث خلون من رمضان سنة 11هـ، في رواية ينقلها الكتاب عن مالك عن جعفر عن أبيه عن علي بن الحسين. وجاء أبو بكر وعمر يعزيان علياً، وفي رواية صلى عليها أبو بكر، ورواية مسلم التي يرجحها الكتاب أن علياً صلى عليها."
  es: "Fátima falleció en Medina seis meses después del Profeta, la noche del martes 3 de Ramadán del año 11 de la Hégira, según una narración que Sallabi cita a través de Malik y Ali ibn al-Husayn. Abu Bakr y Umar acudieron a dar el pésame a Ali; en un relato, Abu Bakr dirigió la oración fúnebre, mientras que el relato de Muslim, que es el que prefiere el libro, afirma que fue Ali quien la dirigió."
  fr: "Fatima mourut à Médine six mois après le Prophète, dans la nuit du mardi 3 Ramadan de l'an 11 de l'Hégire, selon un récit rapporté par Sallabi d'après Malik et Ali ibn al-Husayn. Abou Bakr et Umar vinrent présenter leurs condoléances à Ali; selon un récit, Abou Bakr dirigea la prière funéraire, tandis que selon le récit de Muslim, privilégié par l'ouvrage, c'est Ali qui la dirigea."
  ur: "فاطمہ ا کا انتقال نبی کے چھ ماہ بعد منگل کی رات 3 رمضان 11 ہجری کو ہوا، ایک روایت میں سلبی نے مالک اور علی بن الحسین کے ذریعے نقل کیا ہے۔ ابوبکر اور عمر علی سے تعزیت کے لیے آئے۔ ایک رپورٹ میں ابو بکر نے نماز جنازہ پڑھائی، جبکہ مسلم کی رپورٹ، جسے کتاب ترجیح دیتی ہے، کہتی ہے کہ علی نے نماز جنازہ پڑھائی۔"
