label: { en: "The death and burial of Fatima bint Muhammad", ar: "وفاة فاطمة بنت النبي ودفنها" }
summary:
  en: "Fatima died in Medina six months after the Prophet, on the night of Tuesday, 3 Ramadan 11 AH, in a narration Sallabi cites through Malik and Ali ibn al-Husayn. Abu Bakr and Umar came to condole with Ali; in one report Abu Bakr led the funeral prayer, while Muslim's report, which the book prefers, says Ali led it."
  ar: "توفيت فاطمة بالمدينة بعد النبي بنحو ستة أشهر، ليلة الثلاثاء لثلاث خلون من رمضان سنة 11هـ، في رواية ينقلها الكتاب عن مالك عن جعفر عن أبيه عن علي بن الحسين. وجاء أبو بكر وعمر يعزيان علياً، وفي رواية صلى عليها أبو بكر، ورواية مسلم التي يرجحها الكتاب أن علياً صلى عليها."
