id: "event/ali-ibn-al-fadl-leaves-sanaa-and-raids-al-maghrib-taking-captives-and-goods-after-293-ah"
class: event
kind: other
label:
  ar: "ابن فضل يخرج من صنعاء ويغير على المغرب فينهبه ويسبي النساء، بعد 293هـ، ص391"
  en: "Ibn al-Fadl leaves Sanaa, raids al-Maghrib, plunders it and takes women captive, after 293 AH, p. 391"
  ur: "ابن فضل صنعاء سے نکلتا ہے، مغرب پر حملہ کر کے لوٹتا ہے اور عورتوں کو قید کرتا ہے، 293ھ کے بعد، ص391"
  es: "Ibn al-Fadl abandona Sanaa, asalta al-Maghrib, lo saquea y toma mujeres cautivas, después del año 293 AH, pág. 391"
  fr: "Ibn al-Fadl quitte Sanaa, pille al-Maghrib et fait des prisonniers parmi les femmes, après 293 AH, p. 391"
  tr: "İbn Fadl, Hicri 293 yılından sonra Sana'a'yı terk ederek Mağrip'e baskınlar düzenledi, orayı yağmaladı ve kadınları esir aldı (s. 391)."
  id: "Ibn Fadl meninggalkan Sana'a dan menyerbu Maghreb, menjarahnya dan menawan wanita, setelah tahun 293 H, hlm. 391"
summary:
  ar: "خرج ابن فضل من صنعاء إلى بلد قدم، ثم صار إلى شبام، ثم إلى المغرب، فاستباحوه ونهبوه وسبوا النساء وأخذوا الأموال."
  en: "Ibn al-Fadl left Sanaa for the place called Qadam, then went to Shiban, then to al-Maghrib, where his men plundered, took women captive and seized property."
  ur: "ابن فضل صنعاء سے قدم کی طرف نکلا، پھر شبام گیا، پھر مغرب، جہاں اس کے لوگوں نے لوٹ مار کی، عورتوں کو قید کیا اور مال لے لیا۔"
  es: "Ibn al-Fadl partió de Sanaa hacia un lugar llamado Qadam, luego fue a Shiban y después a al-Maghrib, donde sus hombres saquearon, tomaron mujeres cautivas y se apoderaron de propiedades."
  fr: "Ibn al-Fadl quitta Sanaa pour l'endroit appelé Qadam, puis se rendit à Shiban, puis à al-Maghrib, où ses hommes pillèrent, prirent des femmes captives et s'emparèrent de biens."
  tr: "İbn Fadl, Sana'a'dan daha önce geldiği bir kasabaya gitti, sonra Şibam'a, ardından da Mağrip'e geçti; orada işgal edip yağmaladılar, kadınları esir aldılar ve paraya el koydular."
  id: "Ibn Fadl meninggalkan Sana'a menuju kota yang telah ia kunjungi, kemudian ia pergi ke Shibam, lalu ke Maghreb, di mana mereka menyerbu kota itu, menjarahnya, menawan para wanita, dan merampas uangnya."
