label: { ar: "إنفاق عثمان على جيش العسرة", en: "Uthman funds the army of hardship" }
summary:
  ar: "حضّ النبي أهل الغنى على النفقة والحملان في سبيل الله فحمل رجال منهم، وأنفق عثمان بن عفان نفقة عظيمة لم ينفق أحد مثلها بحسب ابن إسحاق؛ وأضاف ابن هشام عن «من يثق به» أنها ألف دينار وأن النبي قال: اللهم ارض عن عثمان فإني عنه راض."
  en: "The Prophet urged the wealthy to spend and provide mounts in God's path, and men among them did. Uthman ibn Affan spent a vast sum such as no one else spent, in Ibn Ishaq's account; Ibn Hisham adds, from 'one who is trusted', that it was a thousand dinars and that the Prophet said: God, be pleased with Uthman, for I am pleased with him."
