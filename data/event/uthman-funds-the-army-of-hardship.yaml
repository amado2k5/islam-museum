label: { ar: "إنفاق عثمان على جيش العسرة", en: "Uthman funds the army of hardship", es: "Uthman financia el ejército de la adversidad.", fr: "Uthman finance l'armée des épreuves" }
summary:
  ar: "حضّ النبي أهل الغنى على النفقة والحملان في سبيل الله فحمل رجال منهم، وأنفق عثمان بن عفان نفقة عظيمة لم ينفق أحد مثلها بحسب ابن إسحاق؛ وأضاف ابن هشام عن «من يثق به» أنها ألف دينار وأن النبي قال: اللهم ارض عن عثمان فإني عنه راض."
  en: "The Prophet urged the wealthy to spend and provide mounts in God's path, and men among them did. Uthman ibn Affan spent a vast sum such as no one else spent, in Ibn Ishaq's account; Ibn Hisham adds, from 'one who is trusted', that it was a thousand dinars and that the Prophet said: God, be pleased with Uthman, for I am pleased with him."
  es: "El Profeta exhortó a los ricos a gastar y proveer para el camino de Dios, y muchos de ellos lo hicieron. Según Ibn Ishaq, Uthman ibn Affan gastó una suma inmensa, como nadie más. Ibn Hisham añade, citando a una fuente confiable, que fueron mil dinares y que el Profeta dijo: «Dios, complácete con Uthman, porque yo estoy complacido con él»."
  fr: "Le Prophète exhorta les riches à dépenser et à fournir des montures pour la cause de Dieu, et certains d'entre eux s'exécutèrent. Selon Ibn Ishaq, Uthman ibn Affan dépensa une somme considérable, sans précédent. Ibn Hisham ajoute, d'après une source digne de confiance, qu'il s'agissait de mille dinars et que le Prophète dit: « Ô Dieu, sois satisfait d'Uthman, car je suis satisfait de lui. »"
