label: { ar: "خروج الخرّيت بن راشد وبني ناجية على علي", en: "al-Khirrīt ibn Rāshid and Banū Nājiya's break with ʿAli (38 AH)", es: "La ruptura de al-Khirrīt ibn Rāshid y Banū Nājiya con ʿAli (38 AH)", fr: "La rupture d'al-Khirrīt ibn Rāshid et de Banū Nājiya avec ʿAli (38 AH)", ur: "الخیریت بن راشد اور بنو ناجیہ کا علی سے علیحدگی ⁦(38ھ)⁩", tr: "El-Harit ibn Reşid ve Banu Najiyah'ın Ali'ye karşı isyanı", id: "Pemberontakan al-Kharit ibn Rasyid dan Bani Najiyah melawan Ali" }
date:
  start: { edtf: "0658", hijri: "0038", calendar: julian, precision: year, status: tradition, derived: true, note: "سنة 38؛ التحويل مشتق {cite:kamil-ibn-al-athir p. 714-715}." }
summary:
  ar: "أظهر الخرّيت بن راشد الناجي الخلاف على علي بعد تحكيم الحكمين، وكان معه ثلاثمائة من بني ناجية شهدوا الجمل وصفين، فحضر عليه في ثلاثين راكبًا فقال: يا علي والله لا أطيع أمرك ولا أصلي خلفك وإني غدًا مفارق لك، فعرض عليه علي مناظرة الكتاب والسنن فأبى وقال لأنك حكّمت وضعفت عن الحق وركنت إلى الظالمين، فخرج من ليلته بأصحابه، فقال علي بعدًا لهم كما بعدت ثمود، فقتلوا رجلًا من الدهاقين أسلم، وأمر علي زيادًا باتباعهم {cite:kamil-ibn-al-athir p. 714-715}."
  en: "al-Khirrīt ibn Rāshid al-Nājī — with three hundred of Banū Nājiya who had fought beside ʿAli at the Camel and Ṣiffīn — declared: «by God I will not obey your command nor pray behind you, and tomorrow I leave you«. ʿAli offered to debate him through Book and Sunna; the Khirrit answered «you set men to arbitrate and grew weak from the truth, siding with the wrongdoers», and rode out that night. ʿAli said «away with them as Thamūd was cast away«, and they killed a Muslim dihqān before Ziyād was ordered in pursuit {cite:kamil-ibn-al-athir p. 714-715}."
  es: "Al-Khirrīt ibn Rāshid al-Nājī —junto con trescientos Banū Nājiya que habían luchado al lado de ʿAli en Camel y Ṣiffīn— declaró: «¡Por Dios! No obedeceré tu mandato ni rezaré detrás de ti, y mañana te dejaré». ʿAli se ofreció a debatir con él sobre el Libro y la Sunna; Khirrit respondió: «Pusiste hombres a arbitrar y te debilitaste ante la verdad, poniéndote del lado de los malhechores», y partió esa noche. ʿAli dijo: «¡Fuera con ellos como fue expulsado Thamūd!», y mataron a un dihqān musulmán antes de que se ordenara a Ziyād perseguirlos {cite:kamil-ibn-al-athir p. 714-715}."
  fr: "Al-Khirrīt ibn Rāshid al-Nājī, accompagné de trois cents Banū Nājiya ayant combattu aux côtés d'ʿAli à la bataille du Chameau et de Ṣiffīn, déclara: « Par Dieu, je n'obéirai pas à ton ordre et je ne prierai pas derrière toi. Demain, je te quitte. » ʿAli proposa de débattre avec lui en s'appuyant sur le Coran et la Sunna. Les Khirrit répondirent: « Tu as désigné des arbitres et tu as faibli loin de la vérité, prenant le parti des injustes », et ils partirent cette nuit-là. ʿAli dit: « Qu'ils partent, comme Thamūd a été chassé ! » et ils tuèrent un dihqān musulman avant que Ziyād ne reçoive l'ordre de les poursuivre. (Voir: Kamil-ibn-al-athir, p. 714-715.)"
  ur: "الخیریت بن راشد النجی - بنو ناجیہ کے تین سو افراد کے ساتھ جو اونٹ اور صفین پر علی کے ساتھ لڑے تھے - نے اعلان کیا: \"خدا کی قسم میں آپ کے حکم کی تعمیل نہیں کروں گا اور نہ ہی آپ کے پیچھے نماز پڑھوں گا، اور کل میں آپ کو چھوڑوں گا\"۔ علی نے اسے کتاب و سنت کے ذریعے بحث کرنے کی پیشکش کی۔ خریت نے جواب دیا \"تم نے لوگوں کو ثالثی کے لیے مقرر کیا اور حق سے کمزور ہو کر ظالموں کا ساتھ دیا\"، اور اسی رات سوار ہو کر نکلے۔ علی نے کہا کہ \"ان کے ساتھ دفع ہو جاؤ جیسا کہ ثمود کو پھینک دیا گیا تھا\"، اور انہوں نے ایک مسلمان دہقان کو قتل کر دیا اس سے پہلے کہ زیاد کو تعاقب میں حکم دیا جائے۔ 714-715}۔"
  tr: "İki hakemin tahkiminden sonra, el-Harit bin Raşid el-Neci, Ali ile anlaşmazlığını dile getirdi. Yanında, Deve Muharebesi ve Sıffin Muharebesi'ne şahit olan üç yüz Beni Neciye vardı. Otuz süvariyle birlikte Ali'ye geldi ve şöyle dedi: \"Ey Ali, Allah'a yemin ederim ki, senin emrine itaat etmeyeceğim, senin ardından namaz kılmayacağım ve yarın seni terk edeceğim.\" Ali ona Kitap ve Sünnet üzerine bir tartışma teklif etti, ancak o reddetti ve şöyle dedi: \"Çünkü sen bir hakem tayin ettin ve hakikatte zayıftın, zalimlerin safında yer aldın.\" Böylece o gece arkadaşlarıyla birlikte ayrıldı ve Ali şöyle dedi: \"Samud ne kadar uzaksa, onlar da o kadar uzak olsunlar.\" İslam'ı kabul eden toprak sahiplerinden birini öldürdüler ve Ali, Ziyad'a onları takip etmesini emretti. {Kaynak: Kamil ibn el-Atir s. 714-715}"
  id: "Al-Kharit bin Rashid Al-Naji menunjukkan ketidaksepakatannya dengan Ali setelah arbitrase dua penengah. Ia membawa serta tiga ratus orang Bani Najiyah yang menyaksikan Perang Unta dan Perang Siffin. Ia datang kepada Ali dengan tiga puluh penunggang kuda dan berkata: Wahai Ali, demi Allah, aku tidak akan menaati perintahmu dan tidak akan shalat di belakangmu, dan besok aku akan meninggalkanmu. Ali menawarkan debat tentang Al-Quran dan Sunnah, tetapi ia menolak dan berkata: Karena engkau telah menjadikan seseorang sebagai penengah dan engkau lemah dalam kebenaran dan engkau berpihak kepada orang-orang zalim. Maka ia pergi malam itu bersama para sahabatnya, dan Ali berkata: Semoga mereka jauh seperti kaum Tsamud yang jauh. Mereka membunuh seorang dari para pemilik tanah yang telah masuk Islam, dan Ali memerintahkan Ziyad untuk mengejar mereka. {cite:kamil-ibn-al-athir p. 714-715}."
