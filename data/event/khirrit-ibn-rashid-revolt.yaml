label: { ar: "خروج الخرّيت بن راشد وبني ناجية على علي", en: "al-Khirrīt ibn Rāshid and Banū Nājiya's break with ʿAli (38 AH)", es: "La ruptura de al-Khirrīt ibn Rāshid y Banū Nājiya con ʿAli (38 AH)", fr: "La rupture d'al-Khirrīt ibn Rāshid et de Banū Nājiya avec ʿAli (38 AH)", ur: "الخیریت بن راشد اور بنو ناجیہ کا علی سے علیحدگی ⁦(38ھ)⁩" }
