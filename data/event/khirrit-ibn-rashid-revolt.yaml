date:
  start: { edtf: "0658", hijri: "0038", calendar: julian, precision: year, status: tradition, derived: true, note: "سنة 38؛ التحويل مشتق {cite:kamil-ibn-al-athir p. 714-715}." }
summary:
  ar: "أظهر الخرّيت بن راشد الناجي الخلاف على علي بعد تحكيم الحكمين، وكان معه ثلاثمائة من بني ناجية شهدوا الجمل وصفين، فحضر عليه في ثلاثين راكبًا فقال: يا علي والله لا أطيع أمرك ولا أصلي خلفك وإني غدًا مفارق لك، فعرض عليه علي مناظرة الكتاب والسنن فأبى وقال لأنك حكّمت وضعفت عن الحق وركنت إلى الظالمين، فخرج من ليلته بأصحابه، فقال علي بعدًا لهم كما بعدت ثمود، فقتلوا رجلًا من الدهاقين أسلم، وأمر علي زيادًا باتباعهم {cite:kamil-ibn-al-athir p. 714-715}."
  en: "al-Khirrīt ibn Rāshid al-Nājī — with three hundred of Banū Nājiya who had fought beside ʿAli at the Camel and Ṣiffīn — declared: «by God I will not obey your command nor pray behind you, and tomorrow I leave you«. ʿAli offered to debate him through Book and Sunna; the Khirrit answered «you set men to arbitrate and grew weak from the truth, siding with the wrongdoers», and rode out that night. ʿAli said «away with them as Thamūd was cast away«, and they killed a Muslim dihqān before Ziyād was ordered in pursuit {cite:kamil-ibn-al-athir p. 714-715}."
