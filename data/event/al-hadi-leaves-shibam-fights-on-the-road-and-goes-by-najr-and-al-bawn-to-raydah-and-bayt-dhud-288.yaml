id: event/al-hadi-leaves-shibam-fights-on-the-road-and-goes-by-najr-and-al-bawn-to-raydah-and-bayt-dhud-288
class: event
kind: other
label:
  ar: "الهادي يخرج من شبام ويقاتل في الطريق ويمر بنجر والبون إلى ريدة وبيت ذؤد، جمادى الآخرة 288هـ"
  en: "Al-Hadi leaves Shibam, fights on the road and goes by Najr and al-Bawn to Raydah and Bayt Dhu'd, Jumada II 288 AH"
  ur: "ہادی شبام سے نکلتے ہیں، راستے میں لڑتے ہیں اور نجر اور البون سے ریدہ اور بیت ذؤد جاتے ہیں، جمادی الآخرہ 288ھ"
summary:
  ar: "خرج الهادي من شبام ومعه أبو العتاهية والدعام، فاجتمع من بشبام وهموا به فحمل عليهم وقتل أكثرهم وفُقد جملان من جماله، ثم سار قرب نجر ولقيه علي بن أبي العباس وعارضه أهل البون فحمل أبو القاسم عليهم، ونزل بريدة ثم غدا إلى بيت ذؤد فأقام أياماً ووجه بالحرم إلى درب بني صريم."
  en: "Al-Hadi left Shibam with Abu al-Atahiya and al-Da'am; those at Shibam gathered and made for him, he charged and killed most of them, two of his camels were lost, then he went by Najr where Ali ibn Abi al-Abbas met him, the people of al-Bawn stood in his way and Abu al-Qasim charged them, and he spent a night at Raydah and next went to Bayt Dhu'd, staying some days and sending the women to Darb Banu Sarim."
  ur: "ہادی ابو العتاہیہ اور دعام کے ساتھ شبام سے نکلے؛ شبام میں موجود لوگ جمع ہو کر ان پر آئے تو انہوں نے ان پر حملہ کر کے اکثر کو مار دیا اور ان کے دو اونٹ رہ گئے، پھر نجر کے قریب سے گزرے جہاں علی بن ابی عباس نے ان سے ملاقات کی، اہل البون نے راستہ روکا تو ابو القاسم نے حملہ کیا، اور ریدہ میں رات گزاری، پھر بیت ذؤد گئے، کئی دن ٹھہرے اور خواتین کو درب بنی صریم بھیج دیا۔"
