label: { ar: "سرية علي إلى الفُلس لهدم صنم طيء", en: "Ali's expedition to Fals to destroy the idol of Tayy", es: "La expedición de Ali a Fals para destruir el ídolo de Tayy.", fr: "L'expédition d'Ali à Fals pour détruire l'idole de Tayy", ur: "طائی کے بت کو تباہ کرنے کے لیے علی کا فالس کی طرف مہم", tr: "Ali'nin Tayy'ın putunu yok etme gizli görevi", id: "Misi rahasia Ali untuk menghancurkan berhala Tayy" }
summary:
  ar: "بعد أن طهّر النبي البيت الحرام من الأوثان أرسل سرايا لتطهير الجزيرة من بقايا البيوت الجاهلية، فكانت سرية علي إلى الفُلس صنم طيء في ربيع الآخر؛ فشنّ الغارة على محلة آل حاتم فهدموه وغنموا السبي والنعم والشاء، وفر عدي بن حاتم إلى الشام."
  tr: "Peygamber, Kutsal Evi putlardan arındırdıktan sonra, adayı İslam öncesi dönemden kalma yapıların kalıntılarından temizlemek için birlikler gönderdi. Ali'nin birliği, Rabi' el-Shani'deki Tayy'ın putu olan El-Fuls'a gönderildi. Hatim ailesinin yaşadığı mahalleye baskın düzenledi, bunun üzerine orayı yıktılar ve esirler, büyükbaş hayvanlar ve koyunlar aldılar; Adi bin Hatim ise Levant'a kaçtı."
  id: "Setelah Nabi membersihkan Baitullah dari berhala-berhala, beliau mengirimkan pasukan untuk membersihkan pulau itu dari sisa-sisa rumah pra-Islam. Pasukan Ali dikirim ke Al-Fuls, berhala Tayy, pada bulan Rabi' al-Thani. Ia melancarkan serangan ke lingkungan keluarga Hatim, sehingga mereka menghancurkannya dan mengambil tawanan, ternak, dan domba sebagai rampasan perang, dan Adi bin Hatim melarikan diri ke Levant."
