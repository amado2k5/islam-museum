summary:
  ar: "بعث معاوية مسلم بن عقبة المري إلى دومة الجندل وكان أهلها امتنعوا من بيعة علي ومعاوية جميعًا، فدعاهم إلى طاعة معاوية فامتنعوا، فسيّر عليّ مالك بن كعب الهمداني في جمع فوافاهم فاقتتلوا يومًا ثم انصرف مسلم منهزمًا، وأقام مالك أيامًا يدعوهم إلى البيعة لعلي فقالوا لا نبايع حتى يجتمع الناس على إمام فانصرف وتركهم {cite:kamil-ibn-al-athir p. 730}."
  en: "Dūmat al-Jandal refused both bayʿas. Muʿāwiya sent Muslim ibn ʿUqba al-Murrī to call them to his side; they refused, and ʿAli sent Mālik ibn Kaʿb al-Hamdānī, who fought Muslim a day and drove him off — but when Mālik called the town to ʿAli's bayʿa they answered «we will not swear until the people unite upon one imam», and he left them as they were {cite:kamil-ibn-al-athir p. 730}."
