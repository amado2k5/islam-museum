summary:
  ar: "بعث معاوية مسلم بن عقبة المري إلى دومة الجندل وكان أهلها امتنعوا من بيعة علي ومعاوية جميعًا، فدعاهم إلى طاعة معاوية فامتنعوا، فسيّر عليّ مالك بن كعب الهمداني في جمع فوافاهم فاقتتلوا يومًا ثم انصرف مسلم منهزمًا، وأقام مالك أيامًا يدعوهم إلى البيعة لعلي فقالوا لا نبايع حتى يجتمع الناس على إمام فانصرف وتركهم {cite:kamil-ibn-al-athir p. 730}."
  en: "Dūmat al-Jandal refused both bayʿas. Muʿāwiya sent Muslim ibn ʿUqba al-Murrī to call them to his side; they refused, and ʿAli sent Mālik ibn Kaʿb al-Hamdānī, who fought Muslim a day and drove him off — but when Mālik called the town to ʿAli's bayʿa they answered «we will not swear until the people unite upon one imam», and he left them as they were {cite:kamil-ibn-al-athir p. 730}."
  es: "Dūmat al-Jandal rechazó ambos bayʿas. Muʿāwiya envió a Muslim ibn ʿUqba al-Murrī para que los llamara a su lado; ellos se negaron, y ʿAli envió a Mālik ibn Kaʿb al-Hamdānī, quien luchó contra Muslim durante un día y lo expulsó; pero cuando Mālik llamó a la ciudad para que ʿAli le pidiera lealtad, ellos respondieron «no juraremos hasta que el pueblo se una en torno a un solo imán», y él los dejó como estaban {cite:kamil-ibn-al-athir p. 730}."
  fr: "Dūmat al-Jandal refusa les deux bayʿas. Muʿāwiya envoya Muslim ibn ʿUqba al-Murrī pour les appeler à sa cause; ils refusèrent, et ʿAli envoya Mālik ibn Kaʿb al-Hamdānī, qui combattit Muslim pendant une journée et le repoussa. Mais lorsque Mālik appela la ville à la bayʿa d’ʿAli, ils répondirent: « Nous ne prêterons pas serment tant que le peuple ne sera pas uni autour d’un seul imam », et il les laissa en l’état {cite:kamil-ibn-al-athir p. 730}."
  ur: "دومۃ الجندل نے دونوں بیعتوں سے انکار کیا۔ معاویہ نے مسلم بن عقبہ المری کو اپنے پاس بلانے کے لیے بھیجا۔ انہوں نے انکار کر دیا اور علی نے مالک بن کعب الحمدانی کو بھیجا جس نے ایک دن مسلمانوں سے جنگ کی اور اسے بھگا دیا لیکن جب مالک نے شہر کو علی کی بیع میں بلایا تو انہوں نے جواب دیا کہ ہم اس وقت تک قسم نہیں کھائیں گے جب تک کہ لوگ ایک امام پر اکٹھے نہ ہو جائیں، اور انہوں نے انہیں اسی طرح چھوڑ دیا جیسے وہ تھے۔ 730}۔"
  tr: "Muaviye, Müslim ibn Ukbe el-Murri'yi, halkı hem Ali'ye hem de Muaviye'ye biat etmeyi reddeden Dumat el-Cendal'a gönderdi. Müslim, halkı Muaviye'ye itaat etmeye çağırdı, ancak onlar reddettiler. Bunun üzerine Ali, Malik ibn Ka'b el-Hamdani'yi bir grupla gönderdi ve onlar da onlarla karşılaştılar ve bir gün savaştılar. Ardından Müslim yenilerek ayrıldı. Malik günlerce kalıp onları Ali'ye biat etmeye çağırdı, ancak onlar, \"İnsanlar bir imamın etrafında toplanmadıkça biat etmeyeceğiz\" dediler. Bunun üzerine Malik onları terk etti. {kaynak: Kamil ibn el-Athir s. 730}"
  id: "Muawiyah mengutus Muslim ibn Uqbah al-Murri ke Dumat al-Jandal, yang penduduknya menolak untuk berbaiat kepada Ali dan Muawiyah. Ia menyeru mereka untuk menaati Muawiyah, tetapi mereka menolak. Kemudian Ali mengutus Malik ibn Ka’b al-Hamdani bersama sekelompok orang, dan mereka bertemu dengan penduduk Dumat al-Jandal dan berperang selama sehari. Kemudian Muslim pergi dengan kekalahan. Malik tinggal selama beberapa hari menyeru mereka untuk berbaiat kepada Ali, tetapi mereka berkata, “Kami tidak akan berbaiat sampai orang-orang berkumpul di sekitar seorang imam.” Maka ia meninggalkan mereka. {cite:kamil-ibn-al-athir p. 730}"
