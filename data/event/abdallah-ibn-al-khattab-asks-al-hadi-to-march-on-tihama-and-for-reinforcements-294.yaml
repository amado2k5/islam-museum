id: event/abdallah-ibn-al-khattab-asks-al-hadi-to-march-on-tihama-and-for-reinforcements-294
class: event
kind: other
label:
  ar: "عبد الله بن الخطاب الحكمي يسأل الهادي الخروج إلى تهامة والمدد، سنة 294هـ، ص346"
  en: "Abdallah ibn al-Khattab al-Hakami asks al-Hadi to march on Tihama and for reinforcements, 294 AH, p. 346"
  fr: "Abdallah ibn al-Khattab al-Hakami demande à al-Hadi de marcher sur la Tihama et de lui envoyer des renforts, 294 de l’hégire, p. 346"
  ur: "عبد اللہ بن الخطاب الحکمی کا ہادی سے تہامہ کی طرف روانگی اور کمک مانگنا، 294ھ، ص346"
  es: "Abdallah ibn al-Khattab al-Hakami pide a al-Hadi que marche sobre Tihama y que envíe refuerzos, 294 AH, pág. 346."
  tr: "Abdullah ibn al-Khattab al-Hakami, al-Hadi'den Tihama'ya gidip takviye kuvvet göndermesini ister, Hicri 294 yılı, s. 346"
  id: "Abdullah ibn al-Khattab al-Hakami meminta al-Hadi untuk pergi ke Tihama dan memberikan bala bantuan, tahun 294 H, hlm. 346"
summary:
  ar: "بعد استواء أمور نجران سأل عبد الله بن الخطاب الحكمي الهادي الخروج إلى تهامة وطلب مدداً، فأمده الإمام بخيل ورجال، وكتب إلى محمد بن عبيد الله أن يصرف إليه العسكر الذي عنده."
  en: "Once affairs in Najran were settled, Abdallah ibn al-Khattab al-Hakami asked al-Hadi to march on Tihama and for reinforcements. The imam sent horsemen and foot soldiers, and wrote to Muhammad ibn Ubaydallah to send him the force he had."
  fr: "Une fois la situation réglée à Najran, Abdallah ibn al-Khattab al-Hakami demanda à al-Hadi de marcher sur la Tihama et de lui envoyer des renforts. L’imam envoya des cavaliers et des fantassins et écrivit à Muhammad ibn Ubaydallah de lui envoyer les troupes dont il disposait."
  ur: "نجران کے معاملات درست ہونے کے بعد عبد اللہ بن الخطاب الحکمی نے ہادی سے تہامہ کی طرف جانے اور کمک مانگی۔ امام نے گھڑسوار اور پیادہ بھیجے اور محمد بن عبید اللہ کو لکھا کہ ان کے پاس جو لشکر ہے وہ ان کی طرف روانہ کریں۔"
  es: "Una vez resueltos los asuntos en Najrán, Abdallah ibn al-Khattab al-Hakami pidió a al-Hadi que marchara sobre Tihama y que enviara refuerzos. El imán envió jinetes e infantería, y escribió a Muhammad ibn Ubaydallah para que le enviara las tropas que tenía."
  tr: "Necran'daki durum çözüldükten sonra Abdullah bin Al-Khattab Al-Hakami, Al-Hadi'den Tihama'ya gitmesini ve takviye kuvvet istemesini rica etti. İmam ona at ve asker gönderdi ve Muhammed bin Ubaid Allah'a, yanında bulunan orduyu kendisine göndermesi için mektup yazdı."
  id: "Setelah situasi di Najran mereda, Abdullah bin Al-Khattab Al-Hakami meminta Al-Hadi untuk pergi ke Tihama dan meminta bala bantuan. Imam menyediakan kuda dan pasukan, dan menulis surat kepada Muhammad bin Ubaid Allah untuk mengirimkan pasukan yang bersamanya."
