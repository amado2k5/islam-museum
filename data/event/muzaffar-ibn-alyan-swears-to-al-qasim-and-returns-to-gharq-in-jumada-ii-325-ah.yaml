id: "event/muzaffar-ibn-alyan-swears-to-al-qasim-and-returns-to-gharq-in-jumada-ii-325-ah"
class: event
kind: other
label:
  ar: "يحلف مظفر بن عليان للقاسم بن أحمد وينصرف إلى غرق في جمادى الآخرة سنة 325هـ، ص409"
  en: "Muzaffar ibn Alyan swears to al-Qasim ibn Ahmad and returns to Gharq in Jumada II 325 AH, p. 409"
  ur: "مظفر بن علیان جمادی الآخرہ 325ھ میں قاسم بن احمد کو قسم دیتا ہے اور غرق لوٹ جاتا ہے، ص409"
  es: "Muzaffar ibn Alyan jura ante al-Qasim ibn Ahmad y regresa a Gharq en Jumada II 325 AH, p. 409"
  fr: "Muzaffar ibn Alyan jure devant al-Qasim ibn Ahmad et retourne à Gharq dans Joumada II 325 AH, p. 409"
  tr: "Muzaffar ibn Aliyan, el-Kasım ibn Ahmed'e biat eder ve Cemada el-Ahirah'ta Gharq'a doğru yola çıkar, 325 H., s. 409"
  id: "Muzaffar ibn Aliyan bersumpah setia kepada al-Qasim ibn Ahmad dan berangkat ke Gharq pada Jumada al-Akhirah, 325 H, hal. 409"
summary:
  ar: "يكاتب مظفر بن عليان القاسم بن أحمد، ويعده بنصيب في بلده، ويحلف له، ثم ينصرف إلى غرق يوم السبت لمنتصف جمادى الآخرة سنة 325هـ."
  en: "Muzaffar ibn Alyan corresponds with al-Qasim ibn Ahmad, promises him a share of his land, swears to him, and returns to Gharq on Saturday in mid Jumada II 325 AH."
  ur: "مظفر بن علیان قاسم بن احمد سے خط و کتابت کرتا ہے، اسے اپنے علاقے میں حصے کا وعدہ دیتا ہے، قسم کھاتا ہے، اور جمادی الآخرہ 325ھ کے وسط میں ہفتے کے دن غرق لوٹ جاتا ہے۔"
  es: "Muzaffar ibn Alyan se cartea con al-Qasim ibn Ahmad, le promete una parte de sus tierras, le jura lealtad y regresa a Gharq el sábado a mediados de Jumada II del año 325 AH."
  fr: "Muzaffar ibn Alyan correspond avec al-Qasim ibn Ahmad, lui promet une part de ses terres, lui jure fidélité et retourne à Gharq le samedi de la mi-Jumada II 325 AH."
  tr: "Muzaffar bin Aliyan, Al-Qasim bin Ahmad'a ülkesinden pay alacağına dair yemin ederek bir mektup yazar, ardından Hicri 325 yılının Cemadi ahiret ayının ortasında, Cumartesi günü boğularak ölür."
  id: "Muzaffar bin Aliyan menulis surat kepada Al-Qasim bin Ahmad, menjanjikan bagian warisan di negerinya, bersumpah setia kepadanya, lalu ia pergi untuk menenggelamkan diri pada hari Sabtu, pertengahan Jumada al-Akhirah, 325 H."
