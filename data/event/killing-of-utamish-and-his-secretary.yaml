id: event/killing-of-utamish-and-his-secretary
class: event
kind: death
label: { ar: "قتل أوتامش وكاتبه", en: "Killing of Utamish and his secretary", es: "Asesinato de Utamish y su secretaria.", fr: "Meurtre d'Utamish et de sa secrétaire", ur: "اتمیش اور اس کے سیکرٹری کا قتل", tr: "Utâmsh ve kâtibi öldürüldü.", id: "Utâmsh dan juru tulisnya terbunuh." }
summary:
  ar: "في سنة تسع وأربعين ومائتين ذكر الطبري قتل أوتامش وكاتبه {cite:tabari-tarikh-abu-al-fadl j.9 p.263}، وذكر الطبري أحداث فتنة الأتراك بسامراء مع وصيف وبغا وعامة الأتراك {cite:tabari-tarikh-abu-al-fadl j.9 p.263}."
  en: "In 249 al-Tabari records the killing of Utamish and his secretary {cite:tabari-tarikh-abu-al-fadl j.9 p.263}, and he records the events of the Turkish strife at Samarra involving Wasif, Bugha and the Turkish troops at large {cite:tabari-tarikh-abu-al-fadl j.9 p.263}."
  es: "En 249, al-Tabari registra el asesinato de Utamish y su secretario {cite:tabari-tarikh-abu-al-fadl j.9 p.263}, y registra los eventos de la lucha turca en Samarra en la que participaron Wasif, Bugha y las tropas turcas en general {cite:tabari-tarikh-abu-al-fadl j.9 p.263}."
  fr: "En 249, al-Tabari relate le meurtre d'Utamish et de son secrétaire {cite:tabari-tarikh-abu-al-fadl j.9 p.263}, et il relate les événements de la lutte turque à Samarra impliquant Wasif, Bugha et les troupes turques en liberté {cite:tabari-tarikh-abu-al-fadl j.9 p.263}."
  ur: "249 میں الطبری نے اتمش اور اس کے سکریٹری کے قتل کو درج کیا ہے {حوالہ: طبری-تاریخ-ابو الفضل ج.9 صفحہ 263}، اور اس نے سامرا میں ترکوں کی لڑائی کے واقعات کو ریکارڈ کیا ہے جس میں واصف، بوغہ اور ترکی کی فوجیں بڑے پیمانے پر شامل تھیں۔ صفحہ 263}۔"
  tr: "İki yüz kırk dokuz yılında, el-Tabari, Utamish ve kâtibinin öldürülmesinden bahsetmiştir (kaynak:tabari-tarikh-abu-al-fadl j.9 s.263) ve el-Tabari, Wasif, Bugha ve genel Türk halkıyla birlikte Samarra'daki Türk isyanı olaylarından bahsetmiştir (kaynak:tabari-tarikh-abu-al-fadl j.9 s.263)."
  id: "Pada tahun 249, al-Tabari menyebutkan pembunuhan Utamish dan juru tulisnya {cite:tabari-tarikh-abu-al-fadl j.9 p.263}, dan al-Tabari menyebutkan peristiwa pemberontakan Turki di Samarra dengan Wasif, Bugha dan penduduk Turki pada umumnya {cite:tabari-tarikh-abu-al-fadl j.9 p.263}."
