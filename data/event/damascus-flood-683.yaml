label: { ar: "السيول العظام بدمشق سنة 683هـ", en: "The great Damascus flood, Sha'ban 683", es: "La gran inundación de Damasco, Sha'ban 683", fr: "Le grand déluge de Damas, Sha'ban 683", ur: "دمشق کا عظیم سیلاب، شعبان 683", tr: "Hicri 683 yılında Şam'da büyük seller meydana geldi.", id: "Banjir besar di Damaskus pada tahun 683 Hijriah" }
summary:
  ar: "في شعبان سنة ثلاث وثمانين كانت الزيادة الهائلة بدمشق بالليل، وكان عسكر المصريين نزالاً بالوادي فذهب لهم ما لا يوصف، وخربت البيوت وانطمّت الأنهار، وكسر الماء أقفال باب الفراديس ودخل حتى وصل إلى مدرسة المقدمية، وكسر جسر باب الفراديس {cite:shadharat-dhahab p. 652}."
  en: "Sha'ban 683 — the night flood at Damascus: the Egyptian army camped in the wadi was swept away beyond description, houses ruined, channels drowned, the water broke Bab al-Faradis's lock and bridge and reached the Muqaddamiyya {cite:shadharat-dhahab p. 652}."
  es: "Sha'ban 683 — la inundación nocturna en Damasco: el ejército egipcio acampado en el uadi fue arrastrado de forma indescriptible, las casas quedaron destruidas, los canales se inundaron, el agua rompió la esclusa y el puente de Bab al-Faradis y llegó a Muqaddamiyya {cite:shadharat-dhahab p. 652}."
  fr: "Sha'ban 683 — l'inondation nocturne à Damas: l'armée égyptienne campée dans le wadi fut emportée au-delà de toute description, les maisons furent détruites, les canaux inondés, l'eau brisa l'écluse et le pont de Bab al-Faradis et atteignit la Muqaddamiyya {cite: shadharat-dhahab p. 652}."
  ur: "شعبان 683 - دمشق میں رات کا سیلاب: مصری فوج نے وادی میں جو ڈیرے ڈالے تھے بہہ گئے، مکانات اجڑ گئے، نالے ڈوب گئے، پانی باب الفرادیس کے تالا اور پل کو توڑ کر مقدامیہ تک پہنچا۔ 652}۔"
  tr: "Seksen üç yılının Şaban ayında, Şam'da geceleyin muazzam bir artış oldu ve Mısır ordusu vadide konuşlanmıştı, bu yüzden tarifsiz kayıplar verdiler. Evler yıkıldı, nehirler tıkandı ve su, Bab el-Faradis'in kilitlerini kırarak el-Mukaddamiye Okulu'na kadar ulaştı ve Bab el-Faradis köprüsünü yıktı. {kaynak: Shadharat-dhahab s. 652}"
  id: "Pada bulan Sya'ban tahun delapan puluh tiga, terjadi peningkatan yang luar biasa di Damaskus pada malam hari, dan tentara Mesir ditempatkan di lembah, sehingga mereka menderita kerugian yang tak terlukiskan. Rumah-rumah hancur, sungai-sungai tersumbat, dan air merusak pintu air Bab al-Faradis dan masuk hingga mencapai Sekolah al-Muqaddamiya, dan merusak jembatan Bab al-Faradis {cite:shadharat-dhahab p. 652}."
