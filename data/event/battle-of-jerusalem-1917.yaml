summary:
  ar: "بطاقة أولية لمعركة القدس سنة ١٩١٧م، دخول الجنرال أللنبي المدينة على أنقاض الحكم العثماني في الحرب العالمية الأولى؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Jerusalem in 1917, Allenby's entry into the city as Ottoman rule ended in the First World War; its sources are not yet checked on the page."
  es: "Ficha de reclutamiento para la Batalla de Jerusalén en 1917, la entrada de Allenby en la ciudad cuando el dominio otomano terminó en la Primera Guerra Mundial; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de conscription pour la bataille de Jérusalem en 1917, l'entrée d'Allenby dans la ville alors que la domination ottomane prenait fin lors de la Première Guerre mondiale; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1917 میں یروشلم کی جنگ کے لیے ڈرافٹ کارڈ، پہلی جنگ عظیم میں عثمانی حکومت کے خاتمے کے بعد شہر میں ایلنبی کا داخلہ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1917 yılında gerçekleşen Kudüs Muharebesi'nin ön raporu; General Allenby'nin Birinci Dünya Savaşı'nda Osmanlı egemenliğinin yıkıntıları üzerine şehre girişi; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Yerusalem pada tahun 1917 M, masuknya Jenderal Allenby ke kota di atas reruntuhan kekuasaan Ottoman pada Perang Dunia Pertama; sumber-sumber di halaman ini belum ditinjau."
