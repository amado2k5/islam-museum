label: { ar: "قتل صالح بن عبد القدوس" }
summary:
  ar: "رفع صالح بن عبد القدوس البصري إلى المهدي في الزندقة فأراد قتله فقال أتوب إلى الله وأنشده ما يبلغ الأعداء من جاهل ما يبلغ الجاهل من نفسه والشيخ لا يترك أخلاقه حتى يوارى في ثرى رمسه فصرفه فلما قرب من الخروج رده فقال ألم تقل والشيخ لا يترك أخلاقه قال بلى قال فكذلك أنت لا تدع أخلاقك حتى تموت ثم أمر بقتله {cite:tarikh-khulafa-minhaj-1434 p. 444}."
  en: "Salih ibn Abd al-Quddus of Basra was denounced to al-Mahdi for zandaqa and the caliph meant to kill him; 'I repent to God,' he said, and recited: 'what foes inflict on a fool is less than the fool inflicts on himself — and the old man never leaves his ways until buried in the dust of his grave.' Released and nearly gone, he was called back: 'Did you not say the old man never leaves his ways?' 'Yes.' 'So you will not leave yours until you die' — and ordered his execution {cite:tarikh-khulafa-minhaj-1434 p. 444}."
