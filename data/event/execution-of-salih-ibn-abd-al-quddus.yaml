label: { ar: "قتل صالح بن عبد القدوس", en: "The execution of Salih ibn Abd al-Quddus", es: "La ejecución de Salih ibn Abd al-Quddus", fr: "L'exécution de Salih ibn Abd al-Quddus", ur: "صالح بن عبد القدوس کی پھانسی" }
summary:
  ar: "رفع صالح بن عبد القدوس البصري إلى المهدي في الزندقة فأراد قتله فقال أتوب إلى الله وأنشده ما يبلغ الأعداء من جاهل ما يبلغ الجاهل من نفسه والشيخ لا يترك أخلاقه حتى يوارى في ثرى رمسه فصرفه فلما قرب من الخروج رده فقال ألم تقل والشيخ لا يترك أخلاقه قال بلى قال فكذلك أنت لا تدع أخلاقك حتى تموت ثم أمر بقتله {cite:tarikh-khulafa-minhaj-1434 p. 444}."
  en: "Salih ibn Abd al-Quddus of Basra was denounced to al-Mahdi for zandaqa and the caliph meant to kill him; 'I repent to God,' he said, and recited: 'what foes inflict on a fool is less than the fool inflicts on himself — and the old man never leaves his ways until buried in the dust of his grave.' Released and nearly gone, he was called back: 'Did you not say the old man never leaves his ways?' 'Yes.' 'So you will not leave yours until you die' — and ordered his execution {cite:tarikh-khulafa-minhaj-1434 p. 444}."
  es: "Salih ibn Abd al-Quddus de Basora fue denunciado ante al-Mahdi por zandaqa y el califa pretendía matarlo; «Me arrepiento ante Dios», dijo, y recitó: «Lo que los enemigos infligen a un necio es menos de lo que el necio se inflige a sí mismo, y el anciano nunca abandona sus caminos hasta que es enterrado en el polvo de su tumba». Liberado y casi muerto, fue llamado de nuevo: «¿No dijiste que el anciano nunca abandona sus caminos?». «Sí». «Así que tú tampoco abandonarás los tuyos hasta que mueras», y ordenó su ejecución {cite:tarikh-khulafa-minhaj-1434 p. 444}."
  fr: "Salih ibn Abd al-Quddus de Bassora fut dénoncé à al-Mahdi pour aumône illégale (zandaqa), et le calife voulut le faire exécuter. « Je me repens auprès de Dieu », dit-il, et il récita: « Ce que les ennemis infligent à un insensé est moindre que ce que l'insensé s'inflige à lui-même – et le vieil homme ne change jamais de voie jusqu'à ce qu'il soit enterré dans la poussière de sa tombe. » Libéré et sur le point d'être exécuté, il fut rappelé: « N'as-tu pas dit que le vieil homme ne change jamais de voie ? » « Si. » « Ainsi, tu ne changeras pas de voie jusqu'à ta mort », et il fut exécuté."
  ur: "بصرہ کے صالح بن عبد القدوس کو المہدی کے لیے زندقہ کے لیے ملامت کی گئی تھی اور خلیفہ کا مقصد اسے قتل کرنا تھا۔ 'میں خدا سے توبہ کرتا ہوں،' اس نے کہا، اور تلاوت کی: 'جو کچھ دشمن احمق کو دیتے ہیں وہ احمق کے اپنے اوپر ہونے سے کم ہے - اور بوڑھا آدمی اپنی قبر کی مٹی میں دفن ہونے تک اپنا راستہ نہیں چھوڑتا۔' رہا ہوا اور قریب ہی چلا گیا، اسے واپس بلایا گیا: 'کیا تم نے نہیں کہا کہ بوڑھا کبھی اپنا راستہ نہیں چھوڑتا؟' 'ہاں۔' 'لہذا تم مرتے دم تک اپنا نہیں چھوڑو گے' - اور اس کی پھانسی کا حکم دیا۔ 444}۔"
