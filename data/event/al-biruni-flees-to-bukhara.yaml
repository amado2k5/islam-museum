summary:
  ar: "حين اندلعت الحرب الأهلية في خوارزم نحو 996–998م فرّ البيروني إلى بخارى عاصمة السامانيين طالباً رعايتهم {cite:britannica-al-biruni}."
  en: "When civil war broke out in Khwārezm about 996–998, al-Bīrūnī fled to the Sāmānid capital Bukhara seeking patronage {cite:britannica-al-biruni}."
  ur: "جب خوارزم میں تقریباً 996–998ء خانہ جنگی چھڑی تو بیرونی رعایت کے طلبگار سامانی دارالحکومت بخارا چلا گیا {cite:britannica-al-biruni}."
  es: "Cuando estalló la guerra civil en Khwārezm alrededor de 996–998, al-Bīrūnī huyó a la capital sāmāní, Bukhara, en busca de mecenazgo {cite:britannica-al-biruni}."
  fr: "Lorsque la guerre civile éclata au Khwārezm vers 996-998, al-Bīrūnī s'enfuit dans la capitale samanide de Boukhara à la recherche d'un patronage {cite:britannica-al-biruni}."
  tr: "996-998 yılları civarında Harezm'de iç savaş çıktığında, El-Biruni, Samanilerin başkenti Buhara'ya kaçarak onların korumasına sığındı."
  id: "Ketika perang saudara pecah di Khwarazm sekitar tahun 996–998 M, Al-Biruni melarikan diri ke Bukhara, ibu kota Dinasti Samanid, untuk mencari perlindungan mereka."
