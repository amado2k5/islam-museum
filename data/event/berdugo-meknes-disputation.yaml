label: { ar: "مناظرة مكناس بين الحاخام بردوغو وعالم سني", en: "The Meknes Disputation — Rabbi Berdugo vs a Sunni scholar", fr: "La dispute de Meknès : le rabbin Berdugo face à un savant sunnite", es: "La disputa de Meknes: el rabino Berdugo contra un erudito sunita" }
summary:
  ar: "مخطوطة عبرية مشهورة من [[place/meknes|مكناس]] بالمغرب تسجل مناظرة لاهوتية مباشرة في أواخر القرن الثامن عشر بين الحاخام المغربي البارز [[person/petahia-mordekhai-berdugo|بتاحيا مردخاي بردوغو]] وعالم سني مغربي لم يسمَّ، في مباحث النسخ أي إلغاء القرآن لشرائع التوراة، وثبات التوراة، ودلالة الازدهار أو المنفى على الرضا الإلهي. وتدرس المخطوطة بوصفها أندر النصوص الباقية لمناظرة يهودية–سنية مباشرة في العصر الحديث المبكر {cite:tandfonline-berdugo-meknes}."
  en: "A famous Hebrew manuscript from [[place/meknes|Meknes]], Morocco, recording a direct theological disputation in the late eighteenth century between the prominent Moroccan rabbi [[person/petahia-mordekhai-berdugo|Petahia Mordekhai Berdugo]] and an unnamed Moroccan Sunni scholar, on naskh — the Qur'an's abrogation of Torah laws — the immutability of the Torah, and whether prosperity or exile signals divine favour. The manuscript is studied as the rarest surviving text of a direct Jewish–Sunni disputation of the early modern period {cite:tandfonline-berdugo-meknes}."
  fr: "Un célèbre manuscrit hébreu de [[place/meknes|Meknès]], au Maroc, consignant une dispute théologique directe, à la fin du XVIIIe siècle, entre l'éminent rabbin marocain [[person/petahia-mordekhai-berdugo|Petahia Mordekhai Berdugo]] et un savant sunnite marocain anonyme, sur le naskh, l'abrogation de lois de la Torah par le Coran, l'immuabilité de la Torah, et la question de savoir si la prospérité ou l'exil signale la faveur divine. Le manuscrit est étudié comme le plus rare des textes conservés d'une dispute directe judéo-sunnite de l'époque moderne {cite:tandfonline-berdugo-meknes}."
  es: "Un famoso manuscrito hebreo de Meknes, Marruecos, recoge una disputa teológica directa de finales del siglo XVIII entre el prominente rabino marroquí Petahia Mordekhai Berdugo y un erudito sunita marroquí anónimo, sobre el naskh —la abrogación de las leyes de la Torá por el Corán—, la inmutabilidad de la Torá y si la prosperidad o el exilio son señal de favor divino. El manuscrito se estudia como el texto más raro que se conserva de una disputa directa judeo-suní de principios de la Edad Moderna."
