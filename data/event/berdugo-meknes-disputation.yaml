summary:
  ar: "مخطوطة عبرية مشهورة من [[place/meknes|مكناس]] بالمغرب تسجل مناظرة لاهوتية مباشرة في أواخر القرن الثامن عشر بين الحاخام المغربي البارز [[person/petahia-mordekhai-berdugo|بتاحيا مردخاي بردوغو]] وعالم سني مغربي لم يسمَّ، في مباحث النسخ أي إلغاء القرآن لشرائع التوراة، وثبات التوراة، ودلالة الازدهار أو المنفى على الرضا الإلهي. وتدرس المخطوطة بوصفها أندر النصوص الباقية لمناظرة يهودية–سنية مباشرة في العصر الحديث المبكر {cite:tandfonline-berdugo-meknes}."
  en: "A famous Hebrew manuscript from [[place/meknes|Meknes]], Morocco, recording a direct theological disputation in the late eighteenth century between the prominent Moroccan rabbi [[person/petahia-mordekhai-berdugo|Petahia Mordekhai Berdugo]] and an unnamed Moroccan Sunni scholar, on naskh — the Qur'an's abrogation of Torah laws — the immutability of the Torah, and whether prosperity or exile signals divine favour. The manuscript is studied as the rarest surviving text of a direct Jewish–Sunni disputation of the early modern period {cite:tandfonline-berdugo-meknes}."
