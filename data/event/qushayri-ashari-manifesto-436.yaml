id: event/qushayri-ashari-manifesto-436
class: event
kind: declaration
label:
  ar: "محضر القشيري في الذب عن الأشعري، ٤٣٦هـ"
  en: "Al-Qushayri's manifesto defending al-Ash'ari, 436/1045"
  ur: "قشیری کا ابو الحسن اشعری کے دفاع میں محضر، 436ھ/1045ء"
summary:
  ar: "بعد دخول نيسابور تحت حكم السلاجقة سنة ٤٢٩هـ اشتدت منازعة الحنفية والأشاعرة الشافعية، فأصدر القشيري سنة ٤٣٦هـ محضراً يعلن فيه سلامة مذهب أبي الحسن الأشعري ووقّعه أعيان شافعية المدينة؛ وحفظه ابن عساكر في «تبيين كذب المفتري» وأورده السبكي {cite:encyclopaedia-of-islam-2 vol. 5 p. 564}."
  en: "After Nishapur passed under Seljuk rule in 429/1038 the struggle between the Hanafi and the Ash'ari-Shafi'i factions sharpened, and in 436/1045 al-Qushayri issued a manifesto declaring the orthodoxy of Abu al-Hasan al-Ash'ari, signed by the city's most renowned Shafi'i scholars; the document is preserved in Ibn Asakir's Tabyin kadhib al-muftari and cited by al-Subki {cite:encyclopaedia-of-islam-2 vol. 5 p. 564}."
  ur: "429ھ/1038ء میں نیشاپور سلجوقیوں کے قبضے میں آنے کے بعد حنفی اور اشعری-شافعی گروہوں کا تنازع تیز ہو گیا، تو 436ھ/1045ء میں قشیری نے ابو الحسن اشعری کے مذہب کی اصحیت کا محضر جاری کیا جس پر شہر کے معروف شافعی علماء نے دستخط کیے؛ یہ دستاویز ابن عساکر کی «تبیین کذب المفتری» میں محفوظ ہے اور سبکی نے نقل کی ہے {cite:encyclopaedia-of-islam-2 vol. 5 p. 564}۔"
