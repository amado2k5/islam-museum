label: { ar: "محنة سلم بن زياد مع ابن الزبير", en: "Salm ibn Ziyad's Ordeal under Ibn al-Zubayr", es: "La dura prueba de Salm ibn Ziyad bajo el mando de Ibn al-Zubayr", fr: "L'épreuve de Salm ibn Ziyad sous Ibn al-Zubayr" }
summary:
  ar: "لما مات يزيد بن معاوية التاث الناس على سلم وقالوا بئس ما ظن ابن سمية إن ظن أنه يتأمر علينا في الجماعة والفتنة كما قيل لأخيه عبيد الله بالبصرة فشخص عن خراسان وأتى عبد الله بن الزبير فأغرمه أربعة آلاف ألف درهم وحبسه وكان سلم يقول ليتني أتيت الشام ولم أنفذ من خدمة أخي عبيد الله بن زياد فكنت أغسل رجله ولم آت ابن الزبير فلم يزل بمكة حتى حصر ابن الزبير الحجاج بن يوسف فنقب السجن وصار إلى الحجاج ثم إلى عبد الملك فقال له عبد الملك أما والله لو أقمت بمكة ما كان لها وال غيرك ولا كان بها عليك أمير وولاه خراسان فلما قدم البصرة مات بها."
  en: "At Yazid's death the people turned on Salm — 'ill did Ibn Sumayya think to command us in community and strife', as had been said to his brother Ubaydallah at Basra — and he left Khurasan to Ibn al-Zubayr, who fined him four million dirhams and imprisoned him. Salm would say 'would I had gone to Syria and stayed in my brother Ubaydallah's service — washing his foot — rather than come to Ibn al-Zubayr'. At Mecca until al-Hajjaj's siege, he tunneled from prison to al-Hajjaj, then Abd al-Malik — 'by God, had you stayed at Mecca she would have no governor but you' — who gave him Khurasan; reaching Basra, he died there."
  es: "Tras la muerte de Yazid, el pueblo se volvió contra Salm —«¡Qué insensible fue Ibn Sumayya al mandarnos en la comunidad y en la contienda!», como se le había dicho a su hermano Ubaydallah en Basora— y dejó Jorasán a Ibn al-Zubayr, quien le impuso una multa de cuatro millones de dirhams y lo encarceló. Salm solía decir: «Ojalá hubiera ido a Siria y me hubiera quedado al servicio de mi hermano Ubaydallah —lavándole los pies— en lugar de ir con Ibn al-Zubayr». En La Meca, hasta el asedio de al-Hajjaj, cavó un túnel desde la prisión hasta al-Hajjaj, y luego a Abd al-Malik —«¡Por Dios, si te hubieras quedado en La Meca, no habría tenido otro gobernador que tú!»— quien le dio Jorasán; al llegar a Basora, murió allí."
  fr: "À la mort de Yazid, le peuple se retourna contre Salm – « Ibn Sumayya a bien mal pensé nous commander, nous semant la discorde et la paix », comme cela avait été dit à son frère Ubaydallah à Bassora – et il laissa le Khorasan à Ibn al-Zubayr, qui le condamna à une amende de quatre millions de dirhams et l'emprisonna. Salm disait: « Si seulement j'étais allé en Syrie et resté au service de mon frère Ubaydallah – à lui laver les pieds – plutôt que de venir auprès d'Ibn al-Zubayr ! » À La Mecque, jusqu'au siège d'al-Hajjaj, il creusa un tunnel depuis sa prison jusqu'à al-Hajjaj, puis Abd al-Malik – « Par Dieu, si tu étais resté à La Mecque, elle n'aurait eu d'autre gouverneur que toi ! » – qui lui confia le Khorasan; parvenu à Bassora, il y mourut."
