label: { ar: "محنة سلم بن زياد مع ابن الزبير", en: "Salm ibn Ziyad's Ordeal under Ibn al-Zubayr", es: "La dura prueba de Salm ibn Ziyad bajo el mando de Ibn al-Zubayr", fr: "L'épreuve de Salm ibn Ziyad sous Ibn al-Zubayr", ur: "ابن الزبیر کے تحت سالم ابن زیاد کی آزمائش", tr: "Salim ibn Ziyad'ın İbn al-Zubayr ile yaşadığı çile", id: "Cobaan yang dialami Salim ibn Ziyad bersama Ibn al-Zubayr" }
summary:
  ar: "لما مات يزيد بن معاوية التاث الناس على سلم وقالوا بئس ما ظن ابن سمية إن ظن أنه يتأمر علينا في الجماعة والفتنة كما قيل لأخيه عبيد الله بالبصرة فشخص عن خراسان وأتى عبد الله بن الزبير فأغرمه أربعة آلاف ألف درهم وحبسه وكان سلم يقول ليتني أتيت الشام ولم أنفذ من خدمة أخي عبيد الله بن زياد فكنت أغسل رجله ولم آت ابن الزبير فلم يزل بمكة حتى حصر ابن الزبير الحجاج بن يوسف فنقب السجن وصار إلى الحجاج ثم إلى عبد الملك فقال له عبد الملك أما والله لو أقمت بمكة ما كان لها وال غيرك ولا كان بها عليك أمير وولاه خراسان فلما قدم البصرة مات بها."
  en: "At Yazid's death the people turned on Salm — 'ill did Ibn Sumayya think to command us in community and strife', as had been said to his brother Ubaydallah at Basra — and he left Khurasan to Ibn al-Zubayr, who fined him four million dirhams and imprisoned him. Salm would say 'would I had gone to Syria and stayed in my brother Ubaydallah's service — washing his foot — rather than come to Ibn al-Zubayr'. At Mecca until al-Hajjaj's siege, he tunneled from prison to al-Hajjaj, then Abd al-Malik — 'by God, had you stayed at Mecca she would have no governor but you' — who gave him Khurasan; reaching Basra, he died there."
  es: "Tras la muerte de Yazid, el pueblo se volvió contra Salm —«¡Qué insensible fue Ibn Sumayya al mandarnos en la comunidad y en la contienda!», como se le había dicho a su hermano Ubaydallah en Basora— y dejó Jorasán a Ibn al-Zubayr, quien le impuso una multa de cuatro millones de dirhams y lo encarceló. Salm solía decir: «Ojalá hubiera ido a Siria y me hubiera quedado al servicio de mi hermano Ubaydallah —lavándole los pies— en lugar de ir con Ibn al-Zubayr». En La Meca, hasta el asedio de al-Hajjaj, cavó un túnel desde la prisión hasta al-Hajjaj, y luego a Abd al-Malik —«¡Por Dios, si te hubieras quedado en La Meca, no habría tenido otro gobernador que tú!»— quien le dio Jorasán; al llegar a Basora, murió allí."
  fr: "À la mort de Yazid, le peuple se retourna contre Salm – « Ibn Sumayya a bien mal pensé nous commander, nous semant la discorde et la paix », comme cela avait été dit à son frère Ubaydallah à Bassora – et il laissa le Khorasan à Ibn al-Zubayr, qui le condamna à une amende de quatre millions de dirhams et l'emprisonna. Salm disait: « Si seulement j'étais allé en Syrie et resté au service de mon frère Ubaydallah – à lui laver les pieds – plutôt que de venir auprès d'Ibn al-Zubayr ! » À La Mecque, jusqu'au siège d'al-Hajjaj, il creusa un tunnel depuis sa prison jusqu'à al-Hajjaj, puis Abd al-Malik – « Par Dieu, si tu étais resté à La Mecque, elle n'aurait eu d'autre gouverneur que toi ! » – qui lui confia le Khorasan; parvenu à Bassora, il y mourut."
  ur: "یزید کی موت کے بعد لوگوں نے سالم کو شروع کر دیا - 'ابن سمیہ نے ہمیں برادری اور جھگڑے میں حکم دینے کا سوچا تھا'، جیسا کہ بصرہ میں اس کے بھائی عبیداللہ سے کہا گیا تھا - اور اس نے خراسان کو ابن الزبیر کے پاس چھوڑ دیا، جس نے اس پر چالیس لاکھ درہم جرمانہ کیا اور اسے قید کر دیا۔ سالم کہتا کہ کیا میں شام چلا جاتا اور ابن الزبیر کے پاس آنے کے بجائے اپنے بھائی عبیداللہ کی خدمت میں رہتا - ان کے پاؤں دھوتا۔ مکہ میں الحجاج کے محاصرے تک، اس نے جیل سے الحجاج تک سرنگ کی، پھر عبد الملک - 'خدا کی قسم، اگر آپ مکہ میں رہتے تو اس کا کوئی گورنر نہ ہوتا مگر آپ کے' - جس نے اسے خراسان دیا۔ بصرہ پہنچ کر وہیں وفات پائی۔"
  tr: "Yezid ibn Muaviye öldüğünde, halk Salim'e kızdı ve şöyle dedi: \"İbn Sumeyye, Basra'da kardeşi Ubeydullah'a söylendiği gibi, hem toplulukta hem de fitnede bize emir verebileceğini düşünüyorsa ne korkunç bir şey düşünmüş!\" Bunun üzerine Horasan'ı terk edip Abdullah ibn el-Zübeyr'e gitti. Abdullah ibn el-Zübeyr onu dört milyon dirhem para cezasına çarptırdı ve hapse attı. Salim şöyle derdi: \"Keşke Şam'a gitseydim de kardeşim Ubeydullah ibn Ziyad'a hizmet etmekten kaçmasaydım, ayaklarını yıkardım ve İbn el-Zübeyr'e gitmezdim.\" İbn el-Zübeyr, el-Haccac ibn Yusuf'u kuşatana kadar Mekke'de kaldı. Bunun üzerine hapishaneye girdi ve el-Haccac'a, ardından da Abd el-Malik'e gitti. Abd el-Malik ona şöyle dedi: \"Allah'a yemin ederim ki, Mekke'de kalsaydın, senden başka vali olmazdı ve orada senden başka emir de olmazdı.\" Onu Horasan valisi olarak atadı. Basra'ya vardığında orada öldü."
  id: "Ketika Yazid ibn Muawiyah meninggal, orang-orang marah kepada Salim dan berkata, “Betapa mengerikan pemikiran Ibn Sumayyah jika dia mengira dia bisa memimpin kita di masyarakat dan dalam pemberontakan, seperti yang dikatakan kepada saudaranya Ubayd Allah di Basra.” Maka dia meninggalkan Khorasan dan pergi ke Abdullah ibn al-Zubayr, yang mendendanya empat juta dirham dan memenjarakannya. Salim biasa berkata, “Seandainya aku pergi ke Syam dan tidak melarikan diri dari mengabdi kepada saudaraku Ubayd Allah ibn Ziyad, maka aku akan membasuh kakinya dan tidak pergi ke Ibn al-Zubayr.” Dia tetap tinggal di Mekah sampai Ibn al-Zubayr mengepung al-Hajjaj ibn Yusuf, lalu dia menerobos masuk penjara dan pergi ke al-Hajjaj dan kemudian ke Abd al-Malik. Abd al-Malik berkata kepadanya, “Demi Allah, seandainya engkau tinggal di Mekah, tidak akan ada gubernur selain engkau, dan tidak akan ada seorang pun di sana yang menjadi amir bagimu.” Ia kemudian mengangkatnya sebagai gubernur Khorasan. Ketika tiba di Basra, ia meninggal di sana."
