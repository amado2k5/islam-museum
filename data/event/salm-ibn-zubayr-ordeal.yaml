id: event/salm-ibn-zubayr-ordeal
class: event
kind: other
label: { ar: "محنة سلم بن زياد مع ابن الزبير", en: "Salm ibn Ziyad's Ordeal under Ibn al-Zubayr" }
summary:
  ar: "لما مات يزيد بن معاوية التاث الناس على سلم وقالوا بئس ما ظن ابن سمية إن ظن أنه يتأمر علينا في الجماعة والفتنة كما قيل لأخيه عبيد الله بالبصرة فشخص عن خراسان وأتى عبد الله بن الزبير فأغرمه أربعة آلاف ألف درهم وحبسه وكان سلم يقول ليتني أتيت الشام ولم أنفذ من خدمة أخي عبيد الله بن زياد فكنت أغسل رجله ولم آت ابن الزبير فلم يزل بمكة حتى حصر ابن الزبير الحجاج بن يوسف فنقب السجن وصار إلى الحجاج ثم إلى عبد الملك فقال له عبد الملك أما والله لو أقمت بمكة ما كان لها وال غيرك ولا كان بها عليك أمير وولاه خراسان فلما قدم البصرة مات بها."
  en: "At Yazid's death the people turned on Salm — 'ill did Ibn Sumayya think to command us in community and strife', as had been said to his brother Ubaydallah at Basra — and he left Khurasan to Ibn al-Zubayr, who fined him four million dirhams and imprisoned him. Salm would say 'would I had gone to Syria and stayed in my brother Ubaydallah's service — washing his foot — rather than come to Ibn al-Zubayr'. At Mecca until al-Hajjaj's siege, he tunneled from prison to al-Hajjaj, then Abd al-Malik — 'by God, had you stayed at Mecca she would have no governor but you' — who gave him Khurasan; reaching Basra, he died there."
