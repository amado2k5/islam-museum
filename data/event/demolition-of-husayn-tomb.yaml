label: { ar: "هدم قبر الحسين", en: "Demolition of the tomb of al-Husayn" }
summary:
  ar: "في سنة ست وثلاثين أمر المتوكل بهدم قبر الحسين وهدم ما حوله من الدور وأن يعمل مزارع ومنع الناس من زيارته فحرث وبقي صحراء، وكان المتوكل معروفاً بالنصب فتألم المسلمون لذلك وكتب أهل بغداد شتمه على الحيطان والمساجد وهجاه الشعراء فقيل تالله إن كانت أمية قد أتت قتل ابن بنت نبيها مظلوما فلقد أتاه بنو أبيه بمثله هذا لعمرك قبره مهدوما {cite:tarikh-khulafa-minhaj-1434 p. 539}."
  en: "In 236 al-Mutawakkil ordered al-Husayn's tomb demolished with the houses around it, the site ploughed into farmland and visits forbidden — he was known for nasb; the Muslims grieved, Baghdadis wrote curses on walls and mosques, and poets lampooned: 'by God, if Umayya did the killing of the Prophet's daughter's son wronged, his father's sons did the like — his tomb demolished' {cite:tarikh-khulafa-minhaj-1434 p. 539}."
