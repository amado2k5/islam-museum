id: event/demolition-of-husayn-tomb
class: event
kind: other
label: { ar: "هدم قبر الحسين", en: "Demolition of the tomb of al-Husayn", es: "Demolición de la tumba de al-Husayn", fr: "Démolition du tombeau d'al-Husayn", ur: "قبر حسین کی مسماری" }
summary:
  ar: "في سنة ست وثلاثين أمر المتوكل بهدم قبر الحسين وهدم ما حوله من الدور وأن يعمل مزارع ومنع الناس من زيارته فحرث وبقي صحراء، وكان المتوكل معروفاً بالنصب فتألم المسلمون لذلك وكتب أهل بغداد شتمه على الحيطان والمساجد وهجاه الشعراء فقيل تالله إن كانت أمية قد أتت قتل ابن بنت نبيها مظلوما فلقد أتاه بنو أبيه بمثله هذا لعمرك قبره مهدوما {cite:tarikh-khulafa-minhaj-1434 p. 539}."
  en: "In 236 al-Mutawakkil ordered al-Husayn's tomb demolished with the houses around it, the site ploughed into farmland and visits forbidden — he was known for nasb; the Muslims grieved, Baghdadis wrote curses on walls and mosques, and poets lampooned: 'by God, if Umayya did the killing of the Prophet's daughter's son wronged, his father's sons did the like — his tomb demolished' {cite:tarikh-khulafa-minhaj-1434 p. 539}."
  es: "En 236, al-Mutawakkil ordenó la demolición de la tumba de al-Husayn junto con las casas que la rodeaban, el terreno fue arado para convertirlo en tierras de cultivo y se prohibieron las visitas; era conocido por su nasb (indulgencia). Los musulmanes se lamentaron, los bagdadíes escribieron maldiciones en muros y mezquitas, y los poetas satirizaron: «¡Por Dios!, si Omayya cometió la injusticia de matar al hijo de la hija del Profeta, los hijos de su padre hicieron lo mismo: ¡demolan su tumba!» {cite:tarikh-khulafa-minhaj-1434 p. 539}."
  fr: "En 236, al-Mutawakkil ordonna la démolition du tombeau d'al-Husayn ainsi que des maisons qui l'entouraient, le site fut labouré en terres agricoles et les visites interdites — il était connu pour son nasb; les musulmans furent affligés, les Bagdadis écrivirent des malédictions sur les murs et les mosquées, et les poètes raillèrent: « Par Dieu, si les Omeyyades ont commis l'injustice en tuant le fils de la fille du Prophète, les fils de son père ont fait de même — son tombeau démoli » {cite: tarikh-khulafa-minhaj-1434 p. 539}."
  ur: "236 میں المتوکل نے حکم دیا کہ امام حسین کے مقبرے کو اس کے ارد گرد کے مکانات کے ساتھ منہدم کر دیا جائے، اس جگہ کو کھیتی باڑی میں جوت دیا گیا اور دورہ ممنوع قرار دیا گیا۔ مسلمان غمزدہ ہوئے، بغدادیوں نے دیواروں اور مساجد پر لعنتیں لکھیں، اور شاعروں نے چراغاں کیا: 'خدا کی قسم، اگر امیہ نے پیغمبر کی بیٹی کے بیٹے کا قتل ظلم کیا، تو اس کے باپ کے بیٹوں نے ایسا ہی کیا - اس کی قبر کو منہدم کردیا'۔ 539}۔"
