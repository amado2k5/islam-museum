label: { ar: "إمداد سلمان الخيل وأمر الغنيمة", en: "Salman al-Khayl's Reinforcement and the Spoils Dispute", es: "El refuerzo de Salman al-Khayl y la disputa por el botín", fr: "Le renforcement des troupes de Salman al-Khayl et le différend sur le butin", ur: "سلمان الخیل کی کمک اور غنیمت کا تنازعہ", tr: "Salman'ın at tedariki ve ganimetlerin dağılımı", id: "Persediaan kuda Salman dan urutan rampasan perang" }
summary:
  ar: "عند البلاذري: لما ورد على عثمان كتاب حبيب بن مسلمة يذكر جمع بطريق أرميناقس كتب إلى سعيد بن العاص بن سعيد بن العاص بن أمية — وهو عامله على الكوفة — يأمره بإمداده بجيش عليه سلمان بن ربيعة الباهلي وهو سلمان الخيل وكان خيّراً فاضلاً غزّاءَ فسار سلمان الخيل إليه في ستة آلاف رجل من أهل الكوفة، وقد أقبلت الروم ومن معها فنزلوا على الفذات وقد أبطأ على حبيب المدد فبيّتهم المسلمون فاجتاحوهم؛ ثم إن سلمان ورد وقد فرغ المسلمون من عدوهم فطلب أهل الكوفة إليهم أن يشركوهم في الغنيمة فلم يفعلوا حتى تغالظ حبيب وسلمان في القول وتوعّد بعض المسلمين سلمان بالقتل وقال الشاعر «إن تقتلوا سلمان نقتل حبيبكم وإن ترحلوا تخو ابنَ عفان ترحل» وكتب إلى عثمان بذلك فكتب أن الغنيمة باردة لأهل الشام وكتب إلى سلمان بأمره بغزو أران؛ وقد روى بعضهم أن سلمان بن ربيعة توجه إلى أرمينية في خلافة عثمان فسبى وغنم وانصرف إلى الوليد بن عقبة وهو بحديثة الموصل سنة 25 فأتاه كتاب عثمان يعلمه أن معاوية كتب يذكر أن الروم قد اجلبوا على المسلمين بجموع عظيمة يسأل المدد ويأمره أن يبعث إليه ثمانية آلاف رجل فوجّه بهم وعليهم سلمان بن ربيعة الباهلي ووجّه معاوية حبيب بن مسلمة الفهري معه في مثل تلك العدة فافتتحا حصوناً وأصابا سبياً وتنازعا الإمارة وهمّ أهل الشام بسلمان فقال الشاعر البيت السابق — والخبر الأول أثبت حدثني به عدة من مشايخ أهل قاليقلا وكتب إليّ به العطاف بن سفيان أبو الأصبغ قاضيها."
  en: "In al-Baladhuri: when Habib ibn Maslama's letter reached Uthman with word of the Armeniakos patrikios's host, he wrote to Sa'id ibn al-As ibn Sa'id ibn al-As ibn Umayya — his governor of Kufa — ordering him to reinforce with an army under Salman ibn Rabi'a al-Bahili, that is Salman al-Khayl, a good, virtuous raider, who marched to him with six thousand Kufans; the Romans and their allies had come and camped on al-Fudhat — the reinforcement slow — and the Muslims night-attacked and overran them; then Salman arrived when the Muslims were done with their enemy, and the Kufans asked to be given a share in the spoils, which was refused until Habib and Salman exchanged hard words and some Muslims threatened Salman with death, the poet saying 'if you kill Salman we kill your Habib, and if you march home the son of Affan's affair marches too'; he wrote of it to Uthman, who wrote that the spoils were cold — free — for the Syrians, and wrote to Salman ordering him to raid Arran; some also relate that Salman ibn Rabi'a went to Armenia in Uthman's caliphate, took captives and spoils, and returned to al-Walid ibn Uqba at Hadithat al-Mawsil in year 25, where Uthman's letter reached him: Mu'awiya had written of a great Roman massing, asking aid and ordering eight thousand sent under Salman ibn Rabi'a al-Bahili, while Mu'awiya dispatched Habib ibn Maslama al-Fihri with a like number — the two took fortresses and captives and disputed the command, the Syrians threatening Salman, whence the same verse — but the first report is sounder, transmitted to me by several shaykhs of Qaliqala and written to me by al-Attaf ibn Sufyan Abu al-Asbagh its qadi."
  es: "En al-Baladhuri: cuando la carta de Habib ibn Maslama llegó a Uthman con noticias del ejército del patricio armenio, escribió a Sa'id ibn al-As ibn Sa'id ibn al-As ibn Umayya — su gobernador de Kufa — ordenándole que reforzara con un ejército bajo el mando de Salman ibn Rabi'a al-Bahili, es decir, Salman al-Khayl, un buen y virtuoso asaltante, que marchó hacia él con seis mil kufanos; los romanos y sus aliados habían llegado y acampado en al-Fudhat — el refuerzo era lento — y los musulmanes atacaron de noche y los invadieron; Entonces llegó Salman cuando los musulmanes habían terminado con su enemigo, y los kufanos pidieron una parte del botín, lo cual fue denegado hasta que Habib y Salman intercambiaron palabras duras y algunos musulmanes amenazaron a Salman de muerte, diciendo el poeta: \"Si matas a Salman, mataremos a tu Habib, y si regresas a casa, el hijo del asunto de Affan también regresará\"; le escribió a Uthman, quien escribió que el botín estaba frío —gratis— para los sirios, y le escribió a Salman ordenándole que saqueara Arran; Algunos también relatan que Salman ibn Rabi'a fue a Armenia en el califato de Uthman, tomó cautivos y botín, y regresó a al-Walid ibn Uqba en Hadithat al-Mawsil en el año 25, donde le llegó la carta de Uthman: Mu'awiya había escrito sobre una gran concentración romana, pidiendo ayuda y ordenando el envío de ocho mil hombres bajo el mando de Salman ibn Rabi'a al-Bahili, mientras que Mu'awiya envió a Habib ibn Maslama al-Fihri con un número similar; los dos tomaron fortalezas y cautivos y disputaron el mando, los sirios amenazaron a Salman, de donde proviene el mismo versículo; pero el primer relato es más sólido, transmitido a mí por varios shaykhs de Qaliqala y escrito a mí por al-Attaf ibn Sufyan Abu al-Asbagh, su cadí."
  fr: "Dans al-Baladhuri: lorsque la lettre d'Habib ibn Maslama parvint à Uthman avec la nouvelle de l'armée du patrikios Armeniakos, il écrivit à Sa'id ibn al-As ibn Sa'id ibn al-As ibn Umayya — son gouverneur de Kufa — lui ordonnant de le renforcer avec une armée sous le commandement de Salman ibn Rabi'a al-Bahili, c'est-à-dire Salman al-Khayl, un pillard vertueux et vertueux, qui marcha vers lui avec six mille Kufans; les Romains et leurs alliés étaient venus camper sur al-Fudhat — les renforts tardant à arriver — et les musulmans les attaquèrent de nuit et les submergèrent; Salman arriva alors que les musulmans en avaient fini avec leur ennemi, et les Koufans demandèrent une part du butin, ce qui leur fut refusé jusqu'à ce qu'Habib et Salman échangent des mots durs et que certains musulmans menacent Salman de mort, le poète disant: « Si vous tuez Salman, nous tuerons votre Habib, et si vous rentrez chez vous, le fils de l'affaire d'Affan rentrera aussi. » Il en écrivit à Uthman, qui écrivit que le butin était froid — gratuit — pour les Syriens, et écrivit à Salman lui ordonnant de piller Arran; D'autres rapportent également que Salman ibn Rabi'a se rendit en Arménie sous le califat d'Uthman, fit des prisonniers et prit du butin, puis retourna auprès d'al-Walid ibn Uqba à Hadithat al-Mawsil en l'an 25, où la lettre d'Uthman lui parvint: Mu'awiya avait écrit au sujet d'un grand rassemblement romain, demandant de l'aide et ordonnant l'envoi de huit mille hommes sous le commandement de Salman ibn Rabi'a al-Bahili, tandis que Mu'awiya dépêchait Habib ibn Maslama al-Fihri avec un nombre équivalent — les deux hommes prirent des forteresses et firent des prisonniers et se disputèrent le commandement, les Syriens menaçant Salman, d'où le même verset — mais le premier rapport est plus fiable, transmis par plusieurs cheikhs de Qaliqala et écrit par al-Attaf ibn Sufyan Abu al-Asbagh, son cadi."
  ur: "البلادوری میں ہے: جب حبیب بن مسلمہ کا خط عثمان کو آرمینیاکوس پیٹرکیوس کے میزبان کی بات کے ساتھ پہنچا تو اس نے سعید بن العاص ابن سعید ابن العاص بن امیہ کو لکھا جو اس کے کوفہ کے گورنر کو حکم دیتا ہے کہ صالحی کے ماتحت ایک لشکر کے ساتھ مل کر اس کی مدد کرے۔ الخیل، ایک اچھا، نیک حملہ آور، جس نے چھ ہزار کوفان کے ساتھ اس کی طرف کوچ کیا۔ رومیوں اور ان کے اتحادیوں نے آکر الفدات پر ڈیرے ڈالے تھے - کمک سست تھی - اور مسلمانوں نے رات کو حملہ کیا اور ان پر قبضہ کر لیا۔ پھر سلمان اس وقت پہنچے جب مسلمانوں کا ان کے دشمن کے ساتھ ہو چکا تھا اور کوفہ والوں نے مال غنیمت میں حصہ دینے کا مطالبہ کیا جسے انکار کر دیا گیا یہاں تک کہ حبیب اور سلمان نے سخت الفاظ کا تبادلہ کیا اور کچھ مسلمانوں نے سلمان کو جان سے مارنے کی دھمکی دی، شاعر کہتا ہے کہ اگر تم سلمان کو مارو گے تو ہم تمہارے حبیب کو قتل کر دیں گے اور اگر تم نے عفان کے بیٹے کے گھر کو مارچ کیا تو وہ بھی مارچ کرے گا۔ اس نے اس کے بارے میں عثمان کو لکھا، جس نے لکھا کہ شامیوں کے لیے غنیمت ٹھنڈا ہے - مفت ہے، اور سلمان کو خط لکھا کہ وہ ارران پر حملہ کرنے کا حکم دے؛ بعض نے یہ بھی نقل کیا ہے کہ سلمان بن ربیعہ عثمان کے دور خلافت میں آرمینیا گئے، قیدی اور مال غنیمت لے کر 25 میں الحدیث الموسل میں ولید بن عقبہ کے پاس واپس آئے، جہاں عثمان کا خط ان کے پاس پہنچا: معاویہ نے رومیوں کے ایک بڑے اجتماع کے بارے میں لکھا تھا، جس میں سالبی کے حکم پر آٹھ ہزار امداد بھیجی گئی تھی۔ الباہلی، جب کہ معاویہ نے حبیب بن مسلمہ الفہری کو اتنی ہی تعداد کے ساتھ روانہ کیا - دونوں نے قلعے اور قیدی بنائے اور حکم میں اختلاف کیا، شامیوں نے سلمان کو دھمکی دی، یہاں سے وہی آیت ہے - لیکن پہلی روایت بہت اچھی ہے، جسے قلقالہ کے متعدد شیوخ نے مجھ تک پہنچایا ہے اور ابو ثقفی الصبح نے مجھے لکھا ہے۔"
  tr: "El-Baladhuri'ye göre: Habib ibn Maslama'nın Arminakus Patriği'nin toplanmasından bahseden mektubu Osman'a ulaştığında, Osman, Kufa valisi olan Said ibn el-As ibn Said ibn el-As ibn Umeyye'ye, Salman ibn Rabi'a el-Bahili komutasındaki bir orduyla takviye göndermesini emretti. Salman el-Hayl, iyi, erdemli ve cesur bir savaşçıydı. Bunun üzerine Salman el-Hayl, Kufa halkından altı bin adamla Osman'a doğru yürüdü. Romalılar ve onlarla birlikte olanlar gelip el-Fadhat'ta kamp kurmuşlardı ve Habib'in takviye birlikleri gecikmişti, bu yüzden Müslümanlar geceleyin onlara saldırdılar ve onları ezici bir şekilde yendiler. Sonra Salman geldi ve Müslümanlar düşmanlarıyla işlerini bitirmişti. Bunun üzerine Kufe halkı onlardan ganimetleri paylaşmalarını istedi, ancak Habib ve Salman sert bir şekilde konuşana kadar bunu yapmadılar. Müslümanlardan bazıları Salman'ı ölümle tehdit etti ve şair, \"Salman'ı öldürürseniz, Habib'inizi de öldürürüz; eğer giderseniz, İbn Affan'dan korkarak gidersiniz\" dedi. Bunu Osman'a yazdı; Osman da ganimetin Suriye halkı için kolay olduğunu yazdı ve Salman'a Arran'ı işgal etmesini emretti. Bazıları, Salman bin Rabi'ah'ın Osman'ın halifeliği döneminde Ermenistan'a gittiğini, ganimetleri ele geçirdiğini ve 25 yılında Musul'daki Haditha'da bulunan El-Valid bin Ukbe'ye döndüğünü anlattı. Sonra Osman'dan ona bir mektup geldi; mektupta Muaviye'nin Romalıların büyük ordularla Müslümanlara karşı geldiğini, takviye istediğini ve sekiz bin adam göndermesini emrettiğini bildiriyordu. Böylece onları gönderdi ve Salman bin Rabi'ah Al-Bahili onların başındaydı. Mu'awiyah, aynı sayıda adamla birlikte Habib bin Maslamah Al-Fihri'yi de onunla birlikte gönderdi. Böylece kaleleri fethettiler ve esirler aldılar, liderlik konusunda çekiştiler ve Levant halkı Salman'dan endişelendi. Şair önceki dizeyi söyledi - ve ilk rivayet daha güvenilirdir. Kalikla şeyhlerinden birkaçı bana bunu anlattı ve kadısı Al-Attaf bin Sufyan Abu Al-Asbagh da bana bunu yazdı."
  id: "Menurut Al-Baladhuri: Ketika surat Habib ibn Maslama sampai kepada Uthman, yang menyebutkan pertemuan Patriark Arminacus, ia menulis kepada Saeed ibn al-As ibn Saeed ibn al-As ibn Umayya — yang merupakan gubernurnya di Kufa — memerintahkannya untuk memperkuatnya dengan pasukan di bawah komando Salman ibn Rabi’a al-Bahili, yang merupakan Salman al-Khayl, dan ia adalah seorang pejuang yang baik, berbudi luhur, dan gagah berani. Maka Salman al-Khayl berbaris kepadanya dengan enam ribu orang dari penduduk Kufa. Orang-orang Romawi dan mereka yang bersama mereka telah datang dan berkemah di al-Fadhat, dan bala bantuan Habib terlambat, sehingga kaum Muslim menyerang mereka pada malam hari dan mengalahkan mereka. Kemudian Salman tiba, dan kaum Muslim telah mengalahkan musuh mereka, sehingga penduduk Kufa meminta mereka untuk berbagi rampasan perang, tetapi mereka tidak melakukannya sampai Habib dan Salman berbicara dengan kasar, dan sebagian kaum Muslim mengancam Salman dengan kematian, dan penyair itu berkata, “Jika kalian membunuh Salman, kami akan membunuh Habib kalian, dan jika kalian pergi, kalian akan pergi dengan rasa takut kepada Ibn Affan.” Dia menulis kepada Utsman tentang hal itu, lalu Utsman menulis bahwa rampasan perang mudah didapatkan oleh penduduk Suriah, dan dia menulis kepada Salman memerintahkannya untuk menyerang Arran. Sebagian dari mereka meriwayatkan bahwa Salman bin Rabi’ah pergi ke Armenia selama kekhalifahan Utsman, lalu dia merebut dan mengambil rampasan perang, dan kembali kepada Al-Walid bin Uqbah, yang berada di Haditha, Mosul, pada tahun 25. Kemudian sebuah surat datang kepadanya dari Utsman yang memberitahunya bahwa Mu’awiyah telah menulis menyebutkan bahwa orang-orang Romawi telah datang melawan kaum Muslim dengan pasukan besar, meminta bala bantuan, dan memerintahkannya untuk mengirimkan delapan ribu orang. Maka ia mengutus mereka, dan Salman bin Rabi’ah Al-Bahili yang memimpin mereka. Mu’awiyah mengutus Habib bin Maslamah Al-Fihri bersamanya dengan jumlah pasukan yang sama. Maka mereka menaklukkan benteng-benteng dan menawan tawanan, dan mereka berselisih mengenai kepemimpinan, dan penduduk Levant khawatir tentang Salman. Maka penyair itu mengucapkan bait sebelumnya — dan riwayat pertama lebih dapat dipercaya. Beberapa syekh Qaliqla menceritakan hal itu kepadaku, dan Al-Attaf bin Sufyan Abu Al-Asbagh, hakimnya, menulis surat kepadaku tentang hal itu."
