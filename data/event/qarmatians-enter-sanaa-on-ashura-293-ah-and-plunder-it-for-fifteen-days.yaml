id: "event/qarmatians-enter-sanaa-on-ashura-293-ah-and-plunder-it-for-fifteen-days"
class: event
kind: other
label:
  ar: "القرامطة يدخلون صنعاء يوم عاشوراء سنة 293هـ وينهبونها خمسة عشر يوماً، ص390"
  en: "The Qarmatians enter Sanaa on Ashura 293 AH and plunder it for fifteen days, p. 390"
  ur: "قرامطہ عاشورہ 293ھ کو صنعاء میں داخل ہو کر پندرہ دن لوٹ مار کرتے ہیں، ص390"
  es: "Los cármatas entran en Saná en Ashura 293 AH y la saquean durante quince días, pág. 390."
summary:
  ar: "دخل علي بن فضل بخمسة آلاف من أصحابه صنعاء ليلاً، فأصبحوا قد أموا غمدان ومسجد الجامع يوم عاشوراء، فنهبوا الأموال والأثاث خمسة عشر يوماً."
  en: "Ali ibn al-Fadl entered Sanaa at night with five thousand of his men, and by morning on Ashura they held Ghumdan and the great mosque. They plundered goods and furniture for fifteen days."
  ur: "علی بن فضل پانچ ہزار ساتھیوں کے ساتھ رات کو صنعاء میں داخل ہوا، اور عاشورہ کی صبح تک غمدان اور جامع مسجد پر قابض تھا۔ پندرہ دن تک مال اور سامان لوٹتے رہے۔"
  es: "Ali ibn al-Fadl entró en Sanaa de noche con cinco mil hombres, y al amanecer del día de Ashura ya controlaban Ghumdan y la gran mezquita. Durante quince días saquearon bienes y muebles."
