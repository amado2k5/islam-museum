id: event/killing-of-yazid-ibn-al-muhallab
class: event
kind: death
label: { ar: "مقتل يزيد بن المهلب", en: "Killing of Yazid ibn al-Muhallab", es: "Asesinato de Yazid ibn al-Muhallab", fr: "Meurtre de Yazid ibn al-Muhallab", ur: "یزید بن المحلب کا قتل", tr: "Yezid ibn el-Muhallab'ın öldürülmesi", id: "Pembunuhan Yazid ibn al-Muhallab" }
summary:
  ar: "في صفر سنة اثنتين ومائة قُتل يزيد بن المهلب بعد أن جاء العباس بن الوليد ومسلمة بن عبد الملك لحربه بتوجيه من يزيد بن عبد الملك {cite:tabari-tarikh-abu-al-fadl j.6 p.590}، وعند السيوطي كان ذلك بالعَقر موضع بقرب كربلاء وقال الكلبي نشأت وهم يقولون ضحى بنو أمية يوم كربلاء بالدين ويوم العقر بالكرم {cite:tarikh-khulafa-minhaj-1434 p. 399-400}"
  en: "In Safar 102 Yazid ibn al-Muhallab was killed, after al-Abbas ibn al-Walid and Maslama ibn Abd al-Malik came to fight him on the orders of Yazid ibn Abd al-Malik {cite:tabari-tarikh-abu-al-fadl j.6 p.590}. According to al-Suyuti, this took place at al-Aqar, a place near Karbala. Al-Kalbi said: 'I grew up hearing them say: the Umayyads sacrificed religion on the day of Karbala and generosity on the day of al-Aqar' {cite:tarikh-khulafa-minhaj-1434 p. 399-400}."
  es: "En Safar 102, Yazid ibn al-Muhallab fue asesinado después de que al-Abbas ibn al-Walid y Maslama ibn Abd al-Malik acudieran a combatirlo por orden de Yazid ibn Abd al-Malik {cite:tabari-tarikh-abu-al-fadl j.6 p.590}. Según al-Suyuti, esto ocurrió en al-Aqar, un lugar cercano a Karbala. Al-Kalbi dijo: «Crecí oyéndoles decir: los omeyas sacrificaron la religión el día de Karbala y la generosidad el día de al-Aqar» {cite:tarikh-khulafa-minhaj-1434 p. 399-400}."
  fr: "En Safar 102, Yazid ibn al-Muhallab fut tué après qu'al-Abbas ibn al-Walid et Maslama ibn Abd al-Malik furent venus le combattre sur ordre de Yazid ibn Abd al-Malik (voir: Tabari Tarikh Abu al-Fadl, vol. 6, p. 590). Selon al-Suyuti, l'événement se déroula à al-Aqar, près de Karbala. Al-Kalbi rapporta: « J'ai grandi en entendant dire: les Omeyyades ont sacrifié la religion le jour de Karbala et la générosité le jour d'al-Aqar » (voir: Tarikh Khulafa Minhaj, vol. 1434, p. 399-400)."
  ur: "صفر 102 میں یزید ابن المحلب کو قتل کر دیا گیا، اس کے بعد عباس بن الولید اور مسلمہ بن عبد الملک یزید بن عبد الملک کے حکم پر اس سے لڑنے آئے۔ سیوطی کے مطابق یہ واقعہ کربلا کے قریب واقع مقام الاقر میں ہوا۔ الکلبی نے کہا: میں نے انہیں یہ کہتے سنا کہ: بنی امیہ نے کربلا کے دن دین کو قربان کیا اور الآخر کے دن سخاوت کی۔ 399-400}۔"
  tr: "102 yılının Safer ayında, Yezid ibn el-Muhallab, Yezid ibn el-Velid ve Maslama ibn Abd el-Malik'in emriyle onunla savaşmaya gelmeleri sonucu öldürüldü. {Kaynak: Tabari-tarikh-abu-el-fadl c.6 s. 590}. El-Suyuti'ye göre bu olay Kerbela yakınlarındaki el-Akr'da gerçekleşti. El-Kalbi şöyle demiştir: \"Ben büyürken şöyle derdim: 'Emeviler Kerbela günü dini, el-Akr günü ise cömertliği feda ettiler'\" {Kaynak: Tarikat-Kulafa-Minhaj-1434 s. 399-400}."
  id: "Pada bulan Safar tahun seratus dua, Yazid ibn al-Muhallab terbunuh setelah al-Abbas ibn al-Walid dan Maslama ibn Abd al-Malik datang untuk melawannya atas perintah Yazid ibn Abd al-Malik {cite:tabari-tarikh-abu-al-fadl j.6 p.590}. Menurut al-Suyuti, ini terjadi di al-Aqr, sebuah tempat dekat Karbala. Al-Kalbi berkata, “Saya dibesarkan dengan mengatakan, ‘Kaum Umayyah mengorbankan agama pada hari Karbala dan kedermawanan pada hari al-Aqr’” {cite:tarikh-khulafa-minhaj-1434 p. 399-400}."
