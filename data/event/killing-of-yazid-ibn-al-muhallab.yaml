label: { ar: "مقتل يزيد بن المهلب", en: "Killing of Yazid ibn al-Muhallab" }
summary:
  ar: "في صفر سنة اثنتين ومائة قُتل يزيد بن المهلب بعد أن جاء العباس بن الوليد ومسلمة بن عبد الملك لحربه بتوجيه من يزيد بن عبد الملك {cite:tabari-tarikh-abu-al-fadl j.6 p.590}، وعند السيوطي كان ذلك بالعَقر موضع بقرب كربلاء وقال الكلبي نشأت وهم يقولون ضحى بنو أمية يوم كربلاء بالدين ويوم العقر بالكرم {cite:tarikh-khulafa-minhaj-1434 p. 399-400}"
  en: "In Safar 102 Yazid ibn al-Muhallab was killed, after al-Abbas ibn al-Walid and Maslama ibn Abd al-Malik came to fight him on the orders of Yazid ibn Abd al-Malik {cite:tabari-tarikh-abu-al-fadl j.6 p.590}. According to al-Suyuti, this took place at al-Aqar, a place near Karbala. Al-Kalbi said: 'I grew up hearing them say: the Umayyads sacrificed religion on the day of Karbala and generosity on the day of al-Aqar' {cite:tarikh-khulafa-minhaj-1434 p. 399-400}."
