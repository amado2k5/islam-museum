label: { ar: "نزول سعد المدائن وفتحها" }
summary:
  ar: "نزل سعد بن أبي وقاص المدائن وقسم المنازل، وأنزل العيالات الدور، وأقاموا بها حتى فرغوا من جلولاء وتكريت والمتوصّل ثم تحولوا إلى الكوفة. وأدخل سعد الخُمس ما أراد أن يعجب عمر منه من ثياب كسرى وحليه وسيفه، فبعث به إلى عمر {cite:tabari-tarikh-abu-al-fadl j.4 p.21}."
