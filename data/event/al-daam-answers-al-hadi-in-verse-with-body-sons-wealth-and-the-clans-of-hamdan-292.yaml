id: event/al-daam-answers-al-hadi-in-verse-with-body-sons-wealth-and-the-clans-of-hamdan-292
class: event
kind: other
label:
  ar: "جواب في الشعر على لسان الدعام للهادي، يعد فيه بنصره بالبدن والبنين والمال وعشائر همدان، ويُنسب في عنوانه إلى أحمد بن عبد الله التميمي، ص322-323"
  en: "A verse answer in al-Da'am's voice to al-Hadi, promising aid with body, sons, wealth and the clans of Hamdan, headed as by Ahmad ibn Abdullah al-Tamimi, pp. 322-323"
  fr: "Réponse en vers à al-Hadi dans la voix d’al-Da'am, promettant corps, fils, biens et clans de Hamdan, attribuée en titre à Ahmad ibn Abdullah al-Tamimi, pp. 322-323"
  ur: "دعام کی زبان میں ہادی کو منظوم جواب جس میں وہ بدن، بیٹوں، مال اور ہمدان کے قبیلوں سے مدد کا وعدہ کرتا ہے، عنوان میں احمد بن عبد اللہ التمیمی سے منسوب، ص322-323"
summary:
  ar: "تحت عنوان «جوابها على لسان الدعام لأحمد بن عبد الله التميمي، وقيل لعبد الله بن أحمد التميمي» ⁦(ص322)⁩ قصيدة تقول على لسان الدعام إنه جاءه كتاب إمام صادق من بني الحسن أبي الحسين الذكي الهاشمي، وإن طاعته فرض، ويعد بنصره بالبدن والبنين والأموال وعشائر همدان وفرسانها، ويذكر أجداده الذين نصروا جد الإمام وأنه خليفتهم، ويرى من تنحى عن ولايته كجاحد، ويدعوه إلى العزم على ما أراه الله من رشد."
  en: "Under the heading \"its answer on the tongue of al-Da'am, for Ahmad ibn Abdullah al-Tamimi, and it is said for Abdullah ibn Ahmad al-Tamimi\" (p. 322) comes a poem which says, in al-Da'am's voice, that the letter of a truthful imam of Banu al-Hasan, Abu al-Husayn the pure Hashimi, has reached him and that obedience to him is a duty, promises aid with body, sons, wealth and the clans and horsemen of Hamdan, recalls his forebears who aided the imam's grandfather and says he is their successor, regards whoever withdrew from his allegiance as a denier, and urges him to resolve on the guidance God shows him."
  fr: "Sous le titre « sa réponse dans la voix d’al-Da'am, pour Ahmad ibn Abdullah al-Tamimi, ou, dit-on, pour Abdullah ibn Ahmad al-Tamimi » (p. 322), un poème dit, par la voix d’al-Da'am, qu’il a reçu la lettre d’un imam véridique des Banu al-Hasan, Abu al-Husayn le pur Hashimite, et que lui obéir est un devoir. Il promet son aide par son corps, ses fils, tous ses biens et les clans et cavaliers de Hamdan, rappelle ses ancêtres qui aidèrent le grand-père de l’imam et se dit leur successeur, qualifie de négateur celui qui retire son allégeance et l’exhorte à suivre la guidance que Dieu lui montre."
  ur: "عنوان «اس کا جواب دعام کی زبان میں احمد بن عبد اللہ التمیمی کے لیے، اور کہا گیا عبد اللہ بن احمد التمیمی کے لیے» ⁦(ص322)⁩ کے تحت ایک نظم ہے جو دعام کی آواز میں کہتی ہے کہ اس کے پاس بنو حسن کے سچے امام ابو الحسین پاک ہاشمی کا خط آیا اور ان کی اطاعت فرض ہے، بدن، بیٹوں، مال اور ہمدان کے قبیلوں اور سواروں سے مدد کا وعدہ کرتی ہے، اپنے ان اجداد کو یاد کرتی ہے جنہوں نے امام کے دادا کی مدد کی اور کہتی ہے کہ وہ ان کا جانشین ہے، اس کی ولایت سے ہٹنے والے کو منکر سمجھتی ہے، اور اسے اس ہدایت پر ارادہ کرنے کی ترغیب دیتی ہے جو اللہ دکھائے۔"
