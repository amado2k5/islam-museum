class: event
kind: persecution
label: { ar: "فتنة الحافظ عبد الغني بدمشق سنة 595", en: "The Fitna of the Hafiz Abd al-Ghani in Damascus in 595", fr: "La fitna du hafiz Abd al-Ghani à Damas en 595", es: "La Fitna de Hafiz Abd al-Ghani en Damasco en 595", ur: "595 میں دمشق میں حافظ عبد الغنی کا فتنہ", tr: "Hafız Abdül-Gani'nin 595 yılında Şam'da gerçekleştirdiği isyan.", id: "Pemberontakan yang dilakukan oleh Hafiz Abd al-Ghani di Damaskus pada tahun 595" }
summary:
  ar: "في سنة خمس وتسعين كانت بدمشق فتنة الحافظ عبد الغني الخطيب وكان صاحب مأثر معروف داعية إلى السنة، فقام عليه الأشعرية وأفتوا بقتله فأُخرج من دمشق طريداً {cite:shadharat-dhahab p. 799}."
  en: "In 595 Damascus saw the fitna of the hafiz Abd al-Ghani the khatib — a man of known merits, a caller to the Sunna. The Ash'aris rose against him and licensed his killing, so he was driven out of Damascus, a fugitive {cite:shadharat-dhahab p. 799}."
  fr: "En 595, Damas connut la fitna du hafiz Abd al-Ghani, le prédicateur, homme aux mérites reconnus qui appelait à la Sunna. Les ash'arites se soulevèrent contre lui et autorisèrent sa mise à mort ; il fut donc chassé de Damas et prit la fuite {cite:shadharat-dhahab p. 799}."
  es: "En 595, Damasco fue testigo de la fitna del hafiz Abd al-Ghani el khatib, un hombre de méritos reconocidos, predicador de la Sunna. Los ash'aris se alzaron contra él y autorizaron su asesinato, por lo que fue expulsado de Damasco y se convirtió en fugitivo {cite:shadharat-dhahab p. 799}."
  ur: "595 میں دمشق نے حافظ عبد الغنی خطیب کا فتنہ دیکھا - ایک معروف شخصیت، سنت کی طرف دعوت دینے والا۔ اشعری اس کے خلاف اٹھ کھڑے ہوئے اور اس کے قتل کی اجازت دے دی، چنانچہ اسے دمشق سے نکال دیا گیا، ایک مفرور۔ 799}۔"
  tr: "95 yılında, tanınmış bir sünnet davetçisi olan Hafız Abdül Gani El-Hatib'in Şam'da bir fitnesi çıktı. Eş'ariler ona karşı ayaklandılar ve onu öldürmek için fetva verdiler, bu yüzden o da firari olarak Şam'dan sürüldü. {Kaynak: Şadharat-Dhaba s. 799}"
  id: "Pada tahun 95, terjadi fitnah di Damaskus yang dilakukan oleh Al-Hafiz Abdul Ghani Al-Khatib, seorang tokoh yang terkenal baik dan penyeru Sunnah. Kaum Asy'ari bangkit melawannya dan mengeluarkan fatwa untuk membunuhnya, sehingga ia diusir dari Damaskus sebagai buronan {cite:shadharat-dhahab p. 799}."
