id: event/harb-kab-ibn-amr
class: event
kind: battle
label: { ar: "حرب كعب بن عمرو المازني", en: "The War of Ka'b ibn Amr al-Mazini", es: "La guerra de Ka'b ibn Amr al-Mazini", fr: "La guerre de Ka'b ibn Amr al-Mazini", ur: "کعب بن عمرو المزنی کی جنگ" }
summary:
  ar: "حرب بين بني جحجبا من الأوس وبني مازن بن النجار من الخزرج؛ سببها أن كعب بن عمرو المازني تزوج امرأة من بني سالم فكان يختلف إليها فأمر أحيحة بن الجلاح سيد بني جحجبا جماعة فرصدوه حتى ظفروا به فقتلوه، فبلغ ذلك أخاه عاصم بن عمرو فاستعد قومه للقتال وأرسل إلى بني جحجبا يؤذنهم بالحرب، فالتقوا بالرحابة فاقتتلوا قتالاً شديداً فانهزمت بنو جحجبا وانهزم معهم أحيحة فطلبه عاصم فأدركه وقد دخل حصنه فرماه بسهم فوقع في باب الحصن وقتل عاصم أخاً لأحيحة {cite:kamil-ibn-al-athir p. 488-489}."
  en: "The war of Ka'b ibn Amr al-Mazini: Banu Juhjuba of Aws against Banu Mazin of Khazraj — Uhayha ibn al-Julah had Ka'b ambushed and killed for visiting his Banu Salim wife, whereupon his brother Asim declared war; at al-Rihaba Juhjuba were routed and Uhayha fled to his fortress with Asim's arrow lodging in its gate {cite:kamil-ibn-al-athir p. 488-489}."
  es: "La guerra de Ka'b ibn Amr al-Mazini: Banu Juhjuba de Aws contra Banu Mazin de Khazraj — Uhayha ibn al-Julah hizo emboscar y matar a Ka'b por visitar a su esposa Banu Salim, tras lo cual su hermano Asim declaró la guerra; en al-Rihaba, los Juhjuba fueron derrotados y Uhayha huyó a su fortaleza con la flecha de Asim clavada en su puerta {cite:kamil-ibn-al-athir p. 488-489}."
  fr: "La guerre de Ka'b ibn Amr al-Mazini: Banu Juhjuba d'Aws contre Banu Mazin de Khazraj — Uhayha ibn al-Julah fit tendre une embuscade à Ka'b et le tua pour avoir rendu visite à sa femme Banu Salim, sur quoi son frère Asim déclara la guerre; à al-Rihaba, les Juhjuba furent mis en déroute et Uhayha s'enfuit dans sa forteresse avec la flèche d'Asim logée dans sa porte {cite: kamil-ibn-al-athir p. 488-489}."
  ur: "کعب بن عمرو المزینی کی جنگ: خزرج کے بنو مازن کے خلاف اوس کے بنو جحجوبہ - عحیہ بن الجولہ نے کعب کو اپنی بنو سالم کی بیوی سے ملنے کے لیے گھات لگا کر قتل کر دیا تھا، جس کے بعد اس کے بھائی عاصم نے اعلان جنگ کیا۔ الریحبہ میں جحجوبہ کو شکست دی گئی اور عحیہ عاصم کے تیر کو اس کے دروازے میں رکھ کر اپنے قلعے کی طرف بھاگ گیا۔ 488-489}۔"
