id: "event/asad-ibn-abi-yafur-besieges-al-mudhaykhira-from-rajab-303-ah-and-takes-it-in-rajab-304-ah"
class: event
kind: other
label:
  ar: "يحاصر أسعد بن أبي يعفر المذيخرة من رجب سنة 303هـ حتى يدخلها قهرا في رجب سنة 304هـ، ثم يدخل صنعاء في شوال، ص403"
  en: "Asad ibn Abi Ya'fur besieges al-Mudhaykhira from Rajab 303 AH, enters it by force in Rajab 304 AH, and enters Sanaa at the start of Shawwal, pp. 403-404"
  ur: "اسعد بن ابی یعفر 303ھ کے رجب سے المذیخرہ کا محاصرہ کرتا ہے، 304ھ کے رجب میں زبردستی داخل ہوتا ہے، اور شوال کے آغاز میں صنعاء پہنچتا ہے، ص403-404"
  fr: "Asad ibn Abi Ya'fur assiège al-Mudhaykhira à partir de Rajab 303 H, y entre de force en Rajab 304 H et entre à Sanaa au début de Shawwal, p. 403-404"
  es: "Asad ibn Abi Ya'fur asedia al-Mudhaykhira desde Rajab 303 AH, entra por la fuerza en Rajab 304 AH y entra en Saná al comienzo de Shawwal, págs. 403-404."
  tr: "As'ad ibn Abi Ya'fur, Hicri 303 yılının Receb ayından itibaren el-Mudhaykhirah'ı kuşattı ve Hicri 304 yılının Receb ayında zorla şehre girdi, ardından Şevval ayında Sana'a'ya girdi (s. 403)."
  id: "As'ad ibn Abi Ya'fur mengepung al-Mudhaykhirah dari bulan Rajab 303 H hingga ia memasukinya secara paksa pada bulan Rajab 304 H, kemudian ia memasuki Sana'a pada bulan Syawal, hlm. 403"
