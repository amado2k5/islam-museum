id: event/muqanna-revolt
class: event
kind: battle
label: { ar: "حركة المقنَّع الخراساني", en: "The movement of al-Muqanna' al-Khurasani (the Veiled One)", es: "El movimiento de al-Muqanna' al-Khurasani (el Velado)", fr: "Le mouvement d'al-Muqanna' al-Khurasani (le Voilé)", ur: "تحریک المقنۃ الخراسانی ⁦(پردہ دار)⁩", tr: "Horasan Maskeli Hareketi", id: "Gerakan Bertopeng Khorasani" }
summary:
  ar: "في عهد المهدي قامت حركة المقنع الخراساني ⁦(١٥٩-١٦١هـ)⁩ في ناحية مرو، امتداداً لحركتي سنباذ والراوندية واتصالاً بذكرى أبي مسلم؛ تبعه خلق كثير في بخارى والصغد وانتشر أتباعه المبيضة في نواحي كش ونسف يغيرون على المناطق الآمنة، حتى هزمهم سعيد الحرشي وقضى عليهم، وأحرق المقنع نفسه قبل القبض عليه {cite:tarikh-dawla-abbasiyya-taqqush p. 79}."
  en: "The rising of the Veiled One in Marw's region, 159-161 AH — the last of the movements bound to Abu Muslim's name, broken by Sa'id al-Harashi {cite:tarikh-dawla-abbasiyya-taqqush p. 79}."
  es: "El surgimiento del Velado en la región de Marw, 159-161 AH — el último de los movimientos vinculados al nombre de Abu Muslim, interrumpido por Sa'id al-Harashi {cite:tarikh-dawla-abbasiyya-taqqush p. 79}."
  fr: "Le soulèvement de la Voilée dans la région de Marw, 159-161 AH — le dernier des mouvements liés au nom d'Abu Muslim, brisé par Sa'id al-Harashi {cite:tarikh-dawla-abbasiyya-taqqush p. 79}."
  ur: "مرو کے علاقے میں پردہ دار کا عروج، 159-161 ہجری - ابو مسلم کے نام سے جڑی آخری تحریک جسے سعید الحارشی نے توڑا ہے۔ 79}۔"
  tr: "El-Mehdi'nin hükümdarlığı döneminde, El-Mukanna' El-Horasani'nin (159-161 Hicri) hareketi, Sunbadh ve El-Ravandiyye hareketlerinin bir uzantısı olarak ve Ebu Müslim'in hatırasıyla bağlantılı olarak Merv bölgesinde gerçekleşti. Birçok kişi Buhara ve Soğdiana'da onu takip etti ve takipçileri Kaş ve Nesef bölgelerine yayılarak güvenli bölgelere baskınlar düzenlediler; ta ki Said el-Harşi onları yenip ortadan kaldırana kadar. El-Mukanna' yakalanmadan önce kendini yaktı. {Kaynak:tarikh-dawla-abbasiyya-taqqush s. 79}"
  id: "Pada masa pemerintahan Al-Mahdi, gerakan Al-Muqanna’ Al-Khorasani (159-161 H) terjadi di wilayah Marw, sebagai perluasan dari gerakan Sunbadh dan Al-Rawandiyya dan terkait dengan mengenang Abu Muslim. Banyak orang mengikutinya di Bukhara dan Sogdiana, dan para pengikutnya menyebar di wilayah Kash dan Nasaf, menyerang daerah-daerah yang aman, hingga Saeed Al-Harshi mengalahkan dan melenyapkan mereka. Al-Muqanna’ membakar dirinya sendiri sebelum ditangkap {cite:tarikh-dawla-abbasiyya-taqqush p. 79}."
