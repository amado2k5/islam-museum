label: { ar: "هجوم محمد الشيخ على تلمسان ⁦(٩٦٣هـ/١٥٥٦م)⁩", en: "the Sa'di attack on Tlemcen (963/1556)", es: "El ataque sa'dí a Tlemcen (963/1556)", fr: "l'attaque saadie de Tlemcen (963/1556)", ur: "تلمسن پر سعدی کا حملہ (963/1556)", tr: "Muhammed el-Şeyh'in Tlemcen'e saldırısı (H. 963/MS 1556)", id: "Serangan Muhammad al-Sheikh ke Tlemcen (963 H/1556 M)" }
summary:
  ar: "انتهز الشريف السعدي محمد الشيخ إبحار الأسطول العثماني إلى استانبول فأرسل جيوشه نحو تلمسان وقد كان رجالها انضموا إلى المجاهدين في محاولة استرجاع وهران، فدخلها على غفلة ووضع على رأسها القائد ابن غنام زعيم قبائل بني راشد، لكن الحامية العثمانية بقيادة محمود صفا بك صمدت حتى احتوى الهجوم {cite:dawlat-uthmaniyya-salabi p. 244}."
  en: "With the Ottoman fleet sailed for Istanbul, Muhammad al-Shaykh sent his armies on Tlemcen — whose men had joined the mujahidun in the attempt on Oran — and entered it unawares, setting over it the commander Ibn Ghannam, chief of Bani Rashid; but the Ottoman garrison under Mahmud Safa Bak held until the attack was contained {cite:dawlat-uthmaniyya-salabi p. 244}."
  es: "Con la flota otomana zarpando hacia Estambul, Muhammad al-Shaykh envió sus ejércitos a Tlemcen —cuyos hombres se habían unido a los muyahidines en el intento de Orán— y entró en ella sin ser detectado, poniendo al mando al comandante Ibn Ghannam, jefe de Bani Rashid; pero la guarnición otomana bajo el mando de Mahmud Safa Bak resistió hasta que el ataque fue contenido {cite:dawlat-uthmaniyya-salabi p. 244}."
  fr: "Alors que la flotte ottomane faisait voile vers Istanbul, Muhammad al-Shaykh envoya ses armées sur Tlemcen — dont les hommes avaient rejoint les moudjahidines dans la tentative sur Oran — et y entra par surprise, y plaçant le commandant Ibn Ghannam, chef des Bani Rashid; mais la garnison ottomane sous Mahmud Safa Bak tint bon jusqu'à ce que l'attaque soit contenue {cite:dawlat-uthmaniyya-salabi p. 244}."
  ur: "عثمانی بحری بیڑے کے استنبول کے لیے روانہ ہونے کے ساتھ، محمد الشیخ نے اپنی فوجیں تلمسن پر بھیجیں - جن کے آدمی اوران کی کوشش میں مجاہدین میں شامل ہوئے تھے - اور اس میں بے خبری میں داخل ہو گئے، اس پر بنی راشد کے سربراہ کمانڈر ابن غنم کو مقرر کیا۔ لیکن محمود صفا باک کے ماتحت عثمانی چھاؤنی اس وقت تک قائم رہی جب تک کہ حملہ نہیں ہو جاتا۔ 244}۔"
  tr: "Şerif el-Saadi Muhammed el-Şeyh, Osmanlı filosunun İstanbul'a doğru yelken açmasından faydalanarak ordularını Tlemcen'e gönderdi. Tlemcen halkı, Oran'ı geri almak için mücahitlere katılmıştı. Şerif el-Saadi, şehre sürpriz bir baskın düzenleyerek başına Beni Raşid kabilelerinin lideri İbn Ganam'ı getirdi. Ancak Mahmud Safa Bey önderliğindeki Osmanlı garnizonu, saldırı püskürtülene kadar direndi. {cite:dawlat-uthmaniyya-salabi s. 244}"
  id: "Sharif al-Saadi Muhammad al-Sheikh memanfaatkan armada Utsmani yang berlayar ke Istanbul dan mengirimkan pasukannya ke arah Tlemcen, yang penduduknya telah bergabung dengan Mujahidin dalam upaya merebut kembali Oran. Ia memasuki kota itu secara tiba-tiba dan menempatkan komandan Ibn Ghannam, pemimpin suku Bani Rashid, sebagai kepala pasukan. Namun, garnisun Utsmani, yang dipimpin oleh Mahmud Safa Bey, bertahan hingga serangan tersebut berhasil dipatahkan. {cite:dawlat-uthmaniyya-salabi p. 244}."
