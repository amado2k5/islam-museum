summary:
  ar: "انتهز الشريف السعدي محمد الشيخ إبحار الأسطول العثماني إلى استانبول فأرسل جيوشه نحو تلمسان وقد كان رجالها انضموا إلى المجاهدين في محاولة استرجاع وهران، فدخلها على غفلة ووضع على رأسها القائد ابن غنام زعيم قبائل بني راشد، لكن الحامية العثمانية بقيادة محمود صفا بك صمدت حتى احتوى الهجوم {cite:dawlat-uthmaniyya-salabi p. 244}."
  en: "With the Ottoman fleet sailed for Istanbul, Muhammad al-Shaykh sent his armies on Tlemcen — whose men had joined the mujahidun in the attempt on Oran — and entered it unawares, setting over it the commander Ibn Ghannam, chief of Bani Rashid; but the Ottoman garrison under Mahmud Safa Bak held until the attack was contained {cite:dawlat-uthmaniyya-salabi p. 244}."
