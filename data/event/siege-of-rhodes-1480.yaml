summary:
  ar: "أرسل السلطان محمد الفاتح أسطولاً بقيادة مصيح باشا لحصار رودس معقل فرسان الإسبتارية، فصمد الحصار وأبحرت الحملة بعد شهور {cite:dawlat-uthmaniyya-salabi}."
  en: "Mehmed II sent a fleet under Mesih Pasha to besiege Hospitaller Rhodes; the fortress held and the expedition sailed home after months {cite:dawlat-uthmaniyya-salabi}."
  ur: "سلطان محمد فاتح نے مسیح پاشا کی قیادت میں بحریہ بھیجا تا کہ اسپتاریوں کے گڑھ روڈس کا محاصرہ کرے؛ قلعہ ڈٹا رہا اور مہم مہینوں بعد واپس چلی گئی {cite:dawlat-uthmaniyya-salabi}."
  es: "Mehmed II envió una flota al mando de Mesih Pasha para sitiar Rodas Hospitalaria; la fortaleza resistió y la expedición regresó a casa después de meses {cite:dawlat-uthmaniyya-salabi}."
  fr: "Mehmed II envoya une flotte sous le commandement de Mesih Pacha pour assiéger Rhodes des Hospitaliers; la forteresse tint bon et l'expédition rentra chez elle après des mois {cite:dawlat-uthmaniyya-salabi}."
