label: { ar: "غدر خوارزمشاه بتجار التتار وقتل الرسل", en: "Khwarazmshah's betrayal of the Tatar merchants and the killing of envoys", es: "La traición de Khwarazmshah a los mercaderes tártaros y el asesinato de los enviados.", fr: "La trahison des marchands tatars par Khwarezmshah et l'assassinat des envoyés", ur: "خوارزمشاہ کی تاتاری تاجروں سے غداری اور سفیروں کا قتل", tr: "Harezmşah Tatar tüccarlarına ihanet etti ve habercileri öldürdü.", id: "Khwarazmshah mengkhianati para pedagang Tatar dan membunuh para utusan." }
summary:
  ar: "أرسل جنكزخان إلى السلطان خوارزم شاه رسلاً وهدايا وقال الرسول إن القان الأعظم يسلم عليك ويقول لك ليس يخفى علي عظم شأنك وأنا أرى مسالمتك من جملة الواجبات وأنت عندي مثل أعز أولادي فإن رأيت أن تعقد بيننا المودة وتأمر التجار بالسفر لتعم المصلحتين فعلت فأجابه إلى ملتمسه، وكان خال خوارزم شاه ينوب على بلاد ما وراء النهر فشرهت نفسه إلى أموال التجار وكاتب السلطان يقول إن هؤلاء القوم قد جاءوا بزي التجار وما قصدهم إلا التجسس فأذن له بالاحتياط عليهم فقبض عليهم وأخذ أموالهم فوردت رسل جنكزخان تقول إنك أعطيت أمانك للتجار فغدرت والغدر قبيح وهو من سلطان الإسلام أقبح فإن زعمت أن الذي فعله خالك بغير أمرك فسلمه إلينا وإلا سوف تشاهد مني ما تعرفني به فحصل عند خوارزم شاه من الرعب ما خامر عقله فتجلد وأمر بقتل الرسل فقتلوا، قال السيوطي فيا لها من حركة لما هدرت من دماء الإسلام أجرت بكل نقطة سيلاً من الدم {cite:tarikh-khulafa-minhaj-1434 p. 713-714}. وفي شذرات الذهب جاءت رسل جنكيزخان ملك التتار محمود الخوارزمي وعلي البخاري بتقدمة مستظرفة إلى خوارزم شاه تطلب المسالمة والهدنة فاستمال خوارزم شاه محموداً الخوارزمي وقال أنت منا وإلينا وأعطاه معضدة جوهر وقدر معه أن يكون عيناً للمسلمين ثم قال له أصدقني أيملك جنكيزخان طمغاج الصين قال نعم قال فما ترى قال الهدنة فأجاب وسر جنكيزخان بإجابته واستقر الحال إلى أن جاء من بلاده تجار إلى ما وراء النهر وعليها خال خوارزم شاه فقبض عليهم وأخذ أموالهم شرهاً منه ثم كاتب خوارزم شاه يقول إنهم تتار في زي التجار وقصدهم يجسون البلاد ثم جاءت رسل جنكيزخان إلى خوارزم شاه تقول إن كان ما فعله خالك بأمره فسلمه إلينا وإن كان بأمرك فالعذر قبيح وستشاهد ما تعرفني به فندم خوارزم شاه وتجلد وأمر بالرسل فقتلوا ليقضى الله أمراً كان مفعولاً فيا لها من حركة عظيمة الشؤم أجرت بكل قطرة بحراً من الدماء {cite:shadharat-dhahab p. 69-70}."
  en: "Genghis Khan sent envoys and gifts — 'I hold your peace a duty and you as a dearest son; let traders pass for both our goods'. Khwarazmshah's uncle at Transoxiana coveted the Muslim traders' wealth, claimed them spies, seized them; the envoys came — 'you gave your aman then broke faith, foulest in a sultan of Islam; hand us your uncle or see what you shall know me by'. The terror clouded his reason — he had the envoys killed. 'O what a move', writes al-Suyuti: 'for every drop of Muslim blood it spilled, it ran a river of blood' {cite:tarikh-khulafa-minhaj-1434 p. 713-714}."
  es: "Gengis Kan envió emisarios y regalos: «Considero vuestra paz un deber y a vosotros como a un hijo muy querido; que los comerciantes pasen por nuestras mercancías». El tío de Corasmia, en Transoxiana, codició la riqueza de los comerciantes musulmanes, los acusó de espías y los capturó. Llegaron los emisarios: «Habéis traicionado vuestra lealtad, lo cual es la mayor vileza para un sultán del Islam; entregadnos a vuestro tío o veréis cómo me conoceréis». El terror nubló su juicio: mandó matar a los emisarios. «¡Qué jugada tan cruel!», escribe al-Suyuti: «Por cada gota de sangre musulmana derramada, corrió un río de sangre» {cita: tarikh-khulafa-minhaj-1434 págs. 713-714}."
  fr: "Gengis Khan envoya des émissaires et des présents: « Je tiens votre silence pour un devoir et vous considère comme mon fils le plus cher; que les marchands passent pour nos deux biens. » L'oncle de Khwarezmshah, en Transoxiane, convoitait les richesses des marchands musulmans, les accusa d'espionnage et les fit arrêter. Les émissaires arrivèrent: « Vous avez prêté serment puis trahi votre parole, acte des plus ignobles pour un sultan de l'Islam ! Livrez-nous votre oncle ou vous verrez ce que vous saurez de moi ! » La terreur l'aveugla: il fit exécuter les émissaires. « Quel acte terrible ! », écrit al-Suyuti: « Pour chaque goutte de sang musulman versée, un fleuve de sang coula. » (cité: Tarikh-Khulafa-Minhaj-1434, p. 713-714)."
  ur: "چنگیز خان نے ایلچی اور تحائف بھیجے - 'میں آپ کی سلامتی کو فرض سمجھتا ہوں اور آپ ایک پیارے بیٹے کے طور پر۔ تاجروں کو ہمارے دونوں سامان کے لیے گزرنے دیں۔ خوارزمشاہ کے چچا نے ٹرانسکسیانا میں مسلمان تاجروں کی دولت کا لالچ کیا، ان پر جاسوسی کا دعویٰ کیا، انہیں پکڑ لیا۔ ایلچی آئے - 'تم نے اپنی امان دے دی پھر ایمان توڑا، اسلام کے سلطان پر سب سے گھٹیا۔ اپنے چچا کو ہمارے حوالے کر دو یا دیکھو کہ تم مجھے کس چیز سے پہچانو گے‘‘۔ دہشت نے اس کی وجہ کو بادل میں ڈال دیا - اس نے سفیروں کو مار ڈالا۔ 'اے کیا حرکت ہے'، السیوطی لکھتے ہیں: 'مسلمانوں کے خون کے ہر قطرے کے بدلے اس نے خون کا دریا بہایا'۔ 713-714}۔"
  tr: "Cengiz Han, Sultan Harezm Şah'a elçiler ve hediyeler gönderdi. Elçi şöyle dedi: \"Büyük Han selamlarını iletiyor ve 'Büyüklüğünüz benden gizli değil ve sizinle barışı bir görev olarak görüyorum. Siz benim en sevgili oğlum gibisiniz. Eğer aramızda dostluk kurmayı ve tüccarların seyahat etmesini emretmeyi uygun görürseniz, böylece her ikimiz de fayda görürüz, bunu yapacağım.'\" Sultan bu isteği kabul etti. Harezm Şah'ın anne tarafından amcası Transoksanya valisiydi ve tüccarların servetine göz dikmişti. Sultana şöyle yazdı: \"Bu kişiler tüccar kılığına girerek geldiler, ancak tek amaçları casusluk yapmaktır.\" Sultan, onlara karşı önlem alması için ona yetki verdi, böylece onları tutuklayıp paralarına el koydu. Sonra Cengiz Han'dan elçiler geldi ve şöyle dediler: \"Tüccarlara güvenli geçiş izni verdiniz, ama onlara ihanet ettiniz. İhanet çirkindir, hele ki Müslüman bir hükümdardan daha da çirkindir. Eğer amcanızın bunu sizin emriniz olmadan yaptığını iddia ediyorsanız, onu bize teslim edin, yoksa benden bildiklerinizi bana şahit olarak göreceksiniz.\" Harezm Şah o kadar korktu ki aklını kaybetti ve elçilerin öldürülmesini emretti. Onlar öldürüldü. As-Suyuti şöyle dedi: \"Ne büyük bir iş! Dökülen her bir damla Müslüman kanı için, bir kan seli aktı.\" {cite:tarikh-khulafa-minhaj-1434 s. 713-714} \"Şedharat el-Dhahab\" (Altın Parçaları) adlı kitapta, Moğol hükümdarı Cengiz Han'dan gelen elçilerin, Mahmud el-Harezmi ve Ali el-Buhari ile birlikte Harezm Şah'a barış ve ateşkes çağrısında bulundukları anlatılır. Harezm Şah, Mahmud el-Harezmi'yi \"Sen bizdensin ve bize aitsin\" diyerek ikna etti ve ona mücevherli bir bileklik vererek Müslümanlar için muhbir olarak atadı. Sonra ona, \"Bana doğruyu söyle: Cengiz Han Çin'in Tammağ bölgesini yönetiyor mu?\" diye sordu. Mahmud, \"Evet\" diye cevap verdi. Soru soran kişi, \"Ne öneriyorsun?\" diye sordu. Mahmud, \"Ateşkes\" diye cevapladı. Cengiz Han bu cevaptan memnun kaldı ve durum, topraklarından tüccarlar Harezm Şah'ın amcasının bulunduğu Transoksanya'ya seyahat edene kadar istikrarlı kaldı. Amca, açgözlülükten dolayı onları yakaladı ve mallarına el koydu. Daha sonra Harezm Şah'a, tüccar kılığına girmiş Moğollar olduklarını ve ülkeyi yağmalamayı amaçladıklarını iddia eden bir mektup yazdı. Daha sonra Cengiz Han'dan Harezm Şah'a elçiler geldi ve şöyle dediler: \"Eğer amcanız onun emriyle hareket ettiyse, onu bize teslim edin. Eğer sizin emrinizle olduysa, mazeretiniz kabul edilemez ve bildiklerinize şahit olacaksınız.\" Harezm Şah pişman oldu, kendini toparladı ve elçilerin öldürülmesini emretti, böylece Tanrı'nın iradesini yerine getirdi. Ne büyük bir olay! Her damlasıyla bir kan denizi oluştu. {kaynak: Şadharat-dhahab s. 69-70}"
  id: "Genghis Khan mengirim utusan dan hadiah kepada Sultan Khwarazm Shah. Utusan itu berkata, \"Khan Agung menyampaikan salamnya dan berkata, 'Kebesaranmu tidak tersembunyi dariku, dan aku menganggap perdamaian denganmu sebagai kewajiban. Engkau seperti putraku tersayang bagiku. Jika engkau berkenan menjalin persahabatan antara kita dan memerintahkan para pedagang untuk bepergian, agar kita berdua mendapat manfaat, aku akan melakukannya.'\" Sultan menyetujui permintaannya. Paman dari pihak ibu Khwarazm Shah adalah gubernur Transoxiana, dan ia menginginkan kekayaan para pedagang. Ia menulis kepada Sultan, mengatakan, \"Orang-orang ini datang menyamar sebagai pedagang, tetapi satu-satunya niat mereka adalah untuk memata-matai.\" Sultan mengizinkannya untuk mengambil tindakan pencegahan terhadap mereka, sehingga ia menangkap mereka dan menyita uang mereka. Kemudian, utusan dari Genghis Khan tiba, berkata, \"Kau memberi para pedagang jalan aman, tetapi kau mengkhianati mereka. Pengkhianatan itu buruk, dan bahkan lebih buruk lagi jika dilakukan oleh seorang penguasa Muslim. Jika kau mengklaim bahwa pamanmu melakukan apa yang dilakukannya tanpa perintahmu, maka serahkan dia kepada kami, atau kau akan menjadi saksi dariku apa yang kau ketahui tentangku.\" Khwarazm Shah sangat ketakutan sehingga ia kehilangan ketenangannya dan memerintahkan agar para utusan itu dibunuh. Mereka dibunuh. As-Suyuti berkata, \"Sungguh perbuatan yang mengerikan! Setiap tetes darah Muslim yang tertumpah menyebabkan aliran darah yang deras.\" {cite:tarikh-khulafa-minhaj-1434 p. 713-714}. Dalam buku \"Shadharat al-Dhahab\" (Fragmen Emas), diceritakan bahwa utusan dari Genghis Khan, penguasa Mongol, tiba bersama Mahmud al-Khwarizmi dan Ali al-Bukhari, membawa permohonan perdamaian dan gencatan senjata kepada Khwarazm Shah. Khwarazm Shah membujuk Mahmud al-Khwarizmi, dengan berkata, \"Kau adalah salah satu dari kami dan milik kami,\" dan menganugerahinya sebuah gelang bertatahkan permata, serta menunjuknya sebagai informan bagi kaum Muslim. Kemudian ia bertanya kepadanya, \"Katakan yang sebenarnya: Apakah Genghis Khan memerintah Tammagh di Tiongkok?\" Mahmud menjawab, \"Ya.\" Penanya kemudian bertanya, \"Apa yang kau usulkan?\" Mahmud menjawab, \"Gencatan senjata.\" Genghis Khan senang dengan jawabannya, dan situasi tetap stabil hingga para pedagang dari wilayahnya melakukan perjalanan ke Transoxiana, tempat paman Khwarazm Shah ditempatkan. Pamannya menangkap mereka dan menyita kekayaan mereka karena keserakahan. Kemudian ia menulis surat kepada Khwarazm Shah, mengklaim bahwa mereka adalah Mongol yang menyamar sebagai pedagang, berniat untuk menjarah wilayah tersebut. Kemudian, utusan dari Genghis Khan tiba di Khwarazm Shah, berkata, \"Jika pamanmu bertindak atas perintahnya, serahkan dia kepada kami. Jika itu atas perintahmu, alasanmu tidak dapat diterima, dan kau akan menyaksikan apa yang kau ketahui.\" Khwarazm Shah menyesal, menguatkan dirinya, dan memerintahkan para utusan itu untuk dibunuh, sehingga memenuhi kehendak Tuhan. Sungguh peristiwa yang sangat penting! Kemalangan menyebabkan lautan darah dengan setiap tetesnya {cite:shadharat-dhahab p. 69-70}."
