id: event/khwarazmshah-trader-betrayal
class: event
kind: other
label: { ar: "غدر خوارزمشاه بتجار التتار وقتل الرسل", en: "Khwarazmshah's betrayal of the Tatar merchants and the killing of envoys", es: "La traición de Khwarazmshah a los mercaderes tártaros y el asesinato de los enviados.", fr: "La trahison des marchands tatars par Khwarezmshah et l'assassinat des envoyés", ur: "خوارزمشاہ کی تاتاری تاجروں سے غداری اور سفیروں کا قتل" }
summary:
  ar: "أرسل جنكزخان إلى السلطان خوارزم شاه رسلاً وهدايا وقال الرسول إن القان الأعظم يسلم عليك ويقول لك ليس يخفى علي عظم شأنك وأنا أرى مسالمتك من جملة الواجبات وأنت عندي مثل أعز أولادي فإن رأيت أن تعقد بيننا المودة وتأمر التجار بالسفر لتعم المصلحتين فعلت فأجابه إلى ملتمسه، وكان خال خوارزم شاه ينوب على بلاد ما وراء النهر فشرهت نفسه إلى أموال التجار وكاتب السلطان يقول إن هؤلاء القوم قد جاءوا بزي التجار وما قصدهم إلا التجسس فأذن له بالاحتياط عليهم فقبض عليهم وأخذ أموالهم فوردت رسل جنكزخان تقول إنك أعطيت أمانك للتجار فغدرت والغدر قبيح وهو من سلطان الإسلام أقبح فإن زعمت أن الذي فعله خالك بغير أمرك فسلمه إلينا وإلا سوف تشاهد مني ما تعرفني به فحصل عند خوارزم شاه من الرعب ما خامر عقله فتجلد وأمر بقتل الرسل فقتلوا، قال السيوطي فيا لها من حركة لما هدرت من دماء الإسلام أجرت بكل نقطة سيلاً من الدم {cite:tarikh-khulafa-minhaj-1434 p. 713-714}. وفي شذرات الذهب جاءت رسل جنكيزخان ملك التتار محمود الخوارزمي وعلي البخاري بتقدمة مستظرفة إلى خوارزم شاه تطلب المسالمة والهدنة فاستمال خوارزم شاه محموداً الخوارزمي وقال أنت منا وإلينا وأعطاه معضدة جوهر وقدر معه أن يكون عيناً للمسلمين ثم قال له أصدقني أيملك جنكيزخان طمغاج الصين قال نعم قال فما ترى قال الهدنة فأجاب وسر جنكيزخان بإجابته واستقر الحال إلى أن جاء من بلاده تجار إلى ما وراء النهر وعليها خال خوارزم شاه فقبض عليهم وأخذ أموالهم شرهاً منه ثم كاتب خوارزم شاه يقول إنهم تتار في زي التجار وقصدهم يجسون البلاد ثم جاءت رسل جنكيزخان إلى خوارزم شاه تقول إن كان ما فعله خالك بأمره فسلمه إلينا وإن كان بأمرك فالعذر قبيح وستشاهد ما تعرفني به فندم خوارزم شاه وتجلد وأمر بالرسل فقتلوا ليقضى الله أمراً كان مفعولاً فيا لها من حركة عظيمة الشؤم أجرت بكل قطرة بحراً من الدماء {cite:shadharat-dhahab p. 69-70}."
  en: "Genghis Khan sent envoys and gifts — 'I hold your peace a duty and you as a dearest son; let traders pass for both our goods'. Khwarazmshah's uncle at Transoxiana coveted the Muslim traders' wealth, claimed them spies, seized them; the envoys came — 'you gave your aman then broke faith, foulest in a sultan of Islam; hand us your uncle or see what you shall know me by'. The terror clouded his reason — he had the envoys killed. 'O what a move', writes al-Suyuti: 'for every drop of Muslim blood it spilled, it ran a river of blood' {cite:tarikh-khulafa-minhaj-1434 p. 713-714}."
  es: "Gengis Kan envió emisarios y regalos: «Considero vuestra paz un deber y a vosotros como a un hijo muy querido; que los comerciantes pasen por nuestras mercancías». El tío de Corasmia, en Transoxiana, codició la riqueza de los comerciantes musulmanes, los acusó de espías y los capturó. Llegaron los emisarios: «Habéis traicionado vuestra lealtad, lo cual es la mayor vileza para un sultán del Islam; entregadnos a vuestro tío o veréis cómo me conoceréis». El terror nubló su juicio: mandó matar a los emisarios. «¡Qué jugada tan cruel!», escribe al-Suyuti: «Por cada gota de sangre musulmana derramada, corrió un río de sangre» {cita: tarikh-khulafa-minhaj-1434 págs. 713-714}."
  fr: "Gengis Khan envoya des émissaires et des présents: « Je tiens votre silence pour un devoir et vous considère comme mon fils le plus cher; que les marchands passent pour nos deux biens. » L'oncle de Khwarezmshah, en Transoxiane, convoitait les richesses des marchands musulmans, les accusa d'espionnage et les fit arrêter. Les émissaires arrivèrent: « Vous avez prêté serment puis trahi votre parole, acte des plus ignobles pour un sultan de l'Islam ! Livrez-nous votre oncle ou vous verrez ce que vous saurez de moi ! » La terreur l'aveugla: il fit exécuter les émissaires. « Quel acte terrible ! », écrit al-Suyuti: « Pour chaque goutte de sang musulman versée, un fleuve de sang coula. » (cité: Tarikh-Khulafa-Minhaj-1434, p. 713-714)."
  ur: "چنگیز خان نے ایلچی اور تحائف بھیجے - 'میں آپ کی سلامتی کو فرض سمجھتا ہوں اور آپ ایک پیارے بیٹے کے طور پر۔ تاجروں کو ہمارے دونوں سامان کے لیے گزرنے دیں۔ خوارزمشاہ کے چچا نے ٹرانسکسیانا میں مسلمان تاجروں کی دولت کا لالچ کیا، ان پر جاسوسی کا دعویٰ کیا، انہیں پکڑ لیا۔ ایلچی آئے - 'تم نے اپنی امان دے دی پھر ایمان توڑا، اسلام کے سلطان پر سب سے گھٹیا۔ اپنے چچا کو ہمارے حوالے کر دو یا دیکھو کہ تم مجھے کس چیز سے پہچانو گے‘‘۔ دہشت نے اس کی وجہ کو بادل میں ڈال دیا - اس نے سفیروں کو مار ڈالا۔ 'اے کیا حرکت ہے'، السیوطی لکھتے ہیں: 'مسلمانوں کے خون کے ہر قطرے کے بدلے اس نے خون کا دریا بہایا'۔ 713-714}۔"
