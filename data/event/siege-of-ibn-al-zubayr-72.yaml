summary:
  ar: "أقام الحجاج بالطائف شهوراً ثم زحف إلى مكة فحاصر ابن الزبير من هلال ذي القعدة سنة اثنتين وسبعين خمسين ليلة، فلما ظفر بأبي قبيس كتب إلى عبد الملك فكبر مع أهله ومن بجامع دمشق واتصل التكبير بأهل الأسواق، ومنع ابن الزبير الحجاج أن يطوف بالبيت ووقف الحجاج بالناس بعرفة محرماً في درع ومغفر وهو ابن إحدى وثلاثين سنة، ونحر ابن الزبير بمكة ولم يخرج إلى عرفة {cite:muruj-al-dhahab p. 104-105}."
  en: "al-Hajjaj closed on Mecca in Dhu'l-Qa'da 72 for a fifty-night siege; the takbir for the fall of Abu Qubays rolled through Damascus, while the thirty-one-year-old stood armoured at 'Arafa barred by Ibn al-Zubayr from the tawaf {cite:muruj-al-dhahab p. 104-105}."
