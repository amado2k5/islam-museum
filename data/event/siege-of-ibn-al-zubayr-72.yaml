label: { ar: "حصار الحجاج لابن الزبير سنة اثنتين وسبعين", en: "al-Hajjaj's siege of Mecca, 72", es: "Asedio de La Meca por al-Hajjaj, 72", fr: "Siège de La Mecque par al-Hajjaj, 72.", ur: "الحجاج کا مکہ کا محاصرہ، 72" }
summary:
  ar: "أقام الحجاج بالطائف شهوراً ثم زحف إلى مكة فحاصر ابن الزبير من هلال ذي القعدة سنة اثنتين وسبعين خمسين ليلة، فلما ظفر بأبي قبيس كتب إلى عبد الملك فكبر مع أهله ومن بجامع دمشق واتصل التكبير بأهل الأسواق، ومنع ابن الزبير الحجاج أن يطوف بالبيت ووقف الحجاج بالناس بعرفة محرماً في درع ومغفر وهو ابن إحدى وثلاثين سنة، ونحر ابن الزبير بمكة ولم يخرج إلى عرفة {cite:muruj-al-dhahab p. 104-105}."
  en: "al-Hajjaj closed on Mecca in Dhu'l-Qa'da 72 for a fifty-night siege; the takbir for the fall of Abu Qubays rolled through Damascus, while the thirty-one-year-old stood armoured at 'Arafa barred by Ibn al-Zubayr from the tawaf {cite:muruj-al-dhahab p. 104-105}."
  es: "Al-Hajjaj cerró el cerco a La Meca en Dhu'l-Qa'da 72 para un asedio de cincuenta noches; el takbir por la caída de Abu Qubays resonó en Damasco, mientras que el joven de treinta y un años permanecía con armadura en Arafa, impedido por Ibn al-Zubayr del tawaf {cite:muruj-al-dhahab p. 104-105}."
  fr: "al-Hajjaj se rapprocha de La Mecque en Dhu'l-Qa'da 72 pour un siège de cinquante nuits; le takbir pour la chute d'Abu Qubays résonna à Damas, tandis que le trentenaire se tenait en armure à 'Arafa, empêché par Ibn al-Zubayr d'effectuer le tawaf {cite:muruj-al-dhahab p. 104-105}."
  ur: "ذوالقعدہ 72 میں الحجاج مکہ پر پچاس رات کے محاصرے کے لیے بند ہو گیا۔ ابو قبیس کے زوال کی تکبیر دمشق میں پھیلی، جب کہ اکتیس سالہ نوجوان عرفہ میں بکتر بند کھڑا تھا جسے ابن الزبیر نے طواف سے روک دیا تھا۔ 104-105}۔"
