id: event/qareen-of-every-son-of-adam
class: event
kind: other
label:
  ar: "قرين كل ابن آدم من الجن"
  en: "Every son of Adam's jinn companion"
  ur: "ہر ابن آدم کا جنوں والا ساتھی"
summary:
  ar: "يروي الترمذي أن النبي قال «إنه لا يزال قرين ابن آدم من الجن يلازمه حتى يكون خيراً منه أو شراً مثله»، وأن قرين المؤمن من الجن يوافقه على الخير وقرين الكافر يوافقه على الشر {cite:jami-al-tirmidhi}. وهو من أوضح نصوص السنة على مباشرة الجن للإنسان بقرينة دائمة {cite:jami-al-tirmidhi} {cite:sahih-muslim}."
  en: "Al-Tirmidhi relates that the Prophet said 'the companion of every son of Adam from among the jinn stays with him until he is better than him or an evil like him', and that the believer's jinn companion agrees with him on good while the disbeliever's agrees with him on evil {cite:jami-al-tirmidhi}. It is among the Sunnah's clearest texts on jinn accompanying a human being as a constant partner {cite:jami-al-tirmidhi} {cite:sahih-muslim}."
  ur: "ترمذی میں آیا ہے کہ نبی نے کہا «ہر ابن آدم کا جنوں والا ساتھی اس کے ساتھ رہتا ہے یہاں تک کہ وہ اس سے بہتر ہو جائے یا اس جیسا برا ہو جائے»، اور مومن کا جن ساتھی اس کی بھلائی میں موافق ہوتا ہے اور کافر کا جن ساتھی اس کی برائی میں {cite:jami-al-tirmidhi}۔ یہ جنوں کے انسان کے ساتھ مستقل ساتھی کے طور پر براہ راست مداخلت کی صریح ترین روایات میں سے ہے {cite:jami-al-tirmidhi} {cite:sahih-muslim}۔"
