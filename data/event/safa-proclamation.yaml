label: { en: "The proclamation on al-Safa", ar: "الصيحة على الصفا" }
summary:
  en: "Assured of Abu Talib's protection, the Prophet climbed al-Safa and cried 'Ya sabahah', gathering the clans of Quraysh; he warned them of a severe punishment ahead, named them clan by clan down to Fatima bint Muhammad, and Abu Lahab's 'Tabban laka' drew the revelation of surat al-Masad."
  ar: "بعد تطمّن النبي من تعهد أبي طالب بالحماية صعد على الصفا فصرخ «يا صباحاه» فاجتمعت إليه بطون قريش، فنذرهم بعذاب شديد وسمّاهم بطناً بطناً حتى فاطمة بنت محمد؛ فقال أبو لهب «تباً لك» فنزلت سورة المسد."
