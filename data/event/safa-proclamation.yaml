id: event/safa-proclamation
class: event
kind: declaration
label: { en: "The proclamation on al-Safa", ar: "الصيحة على الصفا", es: "La proclamación sobre al-Safa", fr: "La proclamation sur al-Safa", ur: "الصفا پر اعلان", tr: "Kayadaki çığlık", id: "Tangisan di atas batu karang" }
summary:
  en: "Assured of Abu Talib's protection, the Prophet climbed al-Safa and cried 'Ya sabahah', gathering the clans of Quraysh; he warned them of a severe punishment ahead, named them clan by clan down to Fatima bint Muhammad, and Abu Lahab's 'Tabban laka' drew the revelation of surat al-Masad."
  ar: "بعد تطمّن النبي من تعهد أبي طالب بالحماية صعد على الصفا فصرخ «يا صباحاه» فاجتمعت إليه بطون قريش، فنذرهم بعذاب شديد وسمّاهم بطناً بطناً حتى فاطمة بنت محمد؛ فقال أبو لهب «تباً لك» فنزلت سورة المسد."
  es: "Con la seguridad de la protección de Abu Talib, el Profeta subió a al-Safa y gritó 'Ya sabahah', reuniendo a los clanes de Quraysh; les advirtió de un severo castigo que les esperaba, los nombró clan por clan hasta llegar a Fátima bint Muhammad, y el 'Tabban laka' de Abu Lahab atrajo la revelación de la sura al-Masad."
  fr: "Assuré de la protection d'Abu Talib, le Prophète gravit al-Safa et cria « Ya sabahah », rassemblant les clans de Quraysh; il les avertit d'un châtiment sévère à venir, les nomma clan par clan jusqu'à Fatima bint Muhammad, et le « Tabban laka » d'Abu Lahab provoqua la révélation de la sourate al-Masad."
  ur: "ابو طالب کی حفاظت کا یقین دلاتے ہوئے، نبی کریم صفا پر چڑھے اور قریش کے قبیلوں کو جمع کرتے ہوئے 'یَا صباح' کہا؛ اس نے انہیں آگے سخت عذاب سے خبردار کیا، ان کا نام قبیلہ بہ قبیلہ فاطمہ بنت محمد رکھا، اور ابو لہب کی 'تبن لکہ' نے سورۃ المساد کا نزول کیا۔"
  tr: "Peygamber, Ebu Talib'in koruma sözüyle rahatladıktan sonra Safa Dağı'na çıktı ve \"Ey sabah!\" diye bağırdı. Bunun üzerine Kureyş kabileleri etrafına toplandı ve Peygamber, kabileleri tek tek sayarak, hatta Muhammed'in kızı Fatıma'yı bile, şiddetli bir cezayla uyardı. Ebu Lahab, \"Hayret olsun!\" dedi. Bunun üzerine Mesad Suresi nazil oldu."
  id: "Setelah Nabi merasa tenang dengan janji perlindungan Abu Talib, beliau mendaki Safa dan berseru, “Wahai fajar!” Maka kaum Quraisy berkumpul di sekelilingnya, dan beliau memperingatkan mereka akan hukuman yang berat, menyebutkan nama mereka satu per satu, termasuk Fatimah, putri Muhammad. Abu Lahab berkata, “Semoga kalian binasa!” Kemudian Surah Al-Masad diturunkan."
