id: event/safa-proclamation
class: event
kind: declaration
label: { en: "The proclamation on al-Safa", ar: "الصيحة على الصفا", es: "La proclamación sobre al-Safa", fr: "La proclamation sur al-Safa" }
summary:
  en: "Assured of Abu Talib's protection, the Prophet climbed al-Safa and cried 'Ya sabahah', gathering the clans of Quraysh; he warned them of a severe punishment ahead, named them clan by clan down to Fatima bint Muhammad, and Abu Lahab's 'Tabban laka' drew the revelation of surat al-Masad."
  ar: "بعد تطمّن النبي من تعهد أبي طالب بالحماية صعد على الصفا فصرخ «يا صباحاه» فاجتمعت إليه بطون قريش، فنذرهم بعذاب شديد وسمّاهم بطناً بطناً حتى فاطمة بنت محمد؛ فقال أبو لهب «تباً لك» فنزلت سورة المسد."
  es: "Con la seguridad de la protección de Abu Talib, el Profeta subió a al-Safa y gritó 'Ya sabahah', reuniendo a los clanes de Quraysh; les advirtió de un severo castigo que les esperaba, los nombró clan por clan hasta llegar a Fátima bint Muhammad, y el 'Tabban laka' de Abu Lahab atrajo la revelación de la sura al-Masad."
  fr: "Assuré de la protection d'Abu Talib, le Prophète gravit al-Safa et cria « Ya sabahah », rassemblant les clans de Quraysh; il les avertit d'un châtiment sévère à venir, les nomma clan par clan jusqu'à Fatima bint Muhammad, et le « Tabban laka » d'Abu Lahab provoqua la révélation de la sourate al-Masad."
