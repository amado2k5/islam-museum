label:
  ar: "أبيات الهادي إلى بني الحارث: «أبلغ بني حارث عني»، ص284-285"
  en: "Al-Hadi's verses to Banu al-Harith, \"carry to Banu Harith from me\", pp. 284-285"
  ur: "ہادی کے بنو حارث کے نام اشعار، «بنو حارث کو میری طرف سے پہنچاؤ»، ص284-285"
  es: "Versículos de Al-Hadi a Banu al-Harith, \"llévenlos a Banu Harith de mi parte\", págs. 284-285"
  fr: "Versets d'Al-Hadi aux Banu al-Harith, « transmettez-les de ma part aux Banu Harith », pp. 284-285"
  tr: "Hadi'nin Beni'l-Hâris'e yazdığı ayetler: \"Mesajımı Beni'l-Hâris'e ilet\", s. 284-285"
  id: "Ayat Al-Hadi kepada Bani al-Harith: “Sampaikan pesanku kepada Bani al-Harith,” hal. 284-285"
summary:
  ar: "يرسل الهادي إلى محمد بن عبيد الله أبياتاً ليوجه بها إلى بني الحارث، يذكر فيها أنه أحياهم بعد أن دنت منيتهم ويحذرهم حرباً تأتيهم كالسحاب والبرق، ويصف رماح المؤمنين وسيوفهم وراياتهم، ويشبّه ثباته بصخرة راسية."
  en: "Al-Hadi sends Muhammad ibn Ubaydallah verses to forward to Banu al-Harith, saying he gave them life when their death was near and warning of a war that comes like cloud and lightning, describing the lances, swords and banners of the believers and likening his steadiness to a rooted rock."
  ur: "ہادی محمد بن عبید اللہ کو اشعار بھیجتے ہیں کہ بنو حارث کو پہنچا دیں، جن میں کہتے ہیں کہ انہیں موت کے قریب سے زندگی دی اور ایک ایسی جنگ سے خبردار کرتے ہیں جو بادل اور بجلی کی طرح آتی ہے، مومنوں کے نیزوں، تلواروں اور جھنڈوں کا ذکر ہے اور اپنی ثابت قدمی کو جمی ہوئی چٹان سے تشبیہ دیتے ہیں۔"
  es: "Al-Hadi envía a Muhammad ibn Ubaydallah versículos para que los transmita a Banu al-Harith, diciendo que les dio vida cuando su muerte estaba cerca y advirtiéndoles de una guerra que llega como nubes y relámpagos, describiendo las lanzas, espadas y estandartes de los creyentes y comparando su firmeza con una roca arraigada."
  fr: "Al-Hadi envoie à Muhammad ibn Ubaydallah des versets à transmettre aux Banu al-Harith, disant qu'il leur a donné la vie alors que leur mort était proche et les avertissant d'une guerre qui viendra comme un nuage et un éclair, décrivant les lances, les épées et les bannières des croyants et comparant sa constance à un roc enraciné."
  tr: "El-Hadi, Muhammed ibn Ubeydullah'a, Beni el-Harith'e iletmesi için ayetler gönderir; bu ayetlerde, ölümlerinin yaklaştığı bir anda onları dirilttiğini belirtir ve onlara bulutlar ve şimşekler gibi gelecek bir savaş konusunda uyarıda bulunur; müminlerin mızraklarını, kılıçlarını ve sancaklarını anlatır ve kendi metanetini sağlam bir kayaya benzetir."
  id: "Al-Hadi mengirimkan ayat-ayat kepada Muhammad ibn Ubayd Allah untuk disampaikan kepada Bani al-Harith, di mana beliau menyebutkan bahwa beliau menghidupkan kembali mereka setelah kematian mereka sudah dekat, dan memperingatkan mereka tentang perang yang akan datang kepada mereka seperti awan dan kilat, serta menggambarkan tombak, pedang, dan panji-panji orang-orang beriman, dan menyamakan keteguhan beliau dengan batu karang yang kokoh."
