id: event/al-hadi-answers-and-sends-a-poem-to-banu-al-harith-292
class: event
kind: other
label:
  ar: "أبيات الهادي إلى بني الحارث: «أبلغ بني حارث عني»، ص284-285"
  en: "Al-Hadi's verses to Banu al-Harith, \"carry to Banu Harith from me\", pp. 284-285"
  ur: "ہادی کے بنو حارث کے نام اشعار، «بنو حارث کو میری طرف سے پہنچاؤ»، ص284-285"
summary:
  ar: "يرسل الهادي إلى محمد بن عبيد الله أبياتاً ليوجه بها إلى بني الحارث، يذكر فيها أنه أحياهم بعد أن دنت منيتهم ويحذرهم حرباً تأتيهم كالسحاب والبرق، ويصف رماح المؤمنين وسيوفهم وراياتهم، ويشبّه ثباته بصخرة راسية."
  en: "Al-Hadi sends Muhammad ibn Ubaydallah verses to forward to Banu al-Harith, saying he gave them life when their death was near and warning of a war that comes like cloud and lightning, describing the lances, swords and banners of the believers and likening his steadiness to a rooted rock."
  ur: "ہادی محمد بن عبید اللہ کو اشعار بھیجتے ہیں کہ بنو حارث کو پہنچا دیں، جن میں کہتے ہیں کہ انہیں موت کے قریب سے زندگی دی اور ایک ایسی جنگ سے خبردار کرتے ہیں جو بادل اور بجلی کی طرح آتی ہے، مومنوں کے نیزوں، تلواروں اور جھنڈوں کا ذکر ہے اور اپنی ثابت قدمی کو جمی ہوئی چٹان سے تشبیہ دیتے ہیں۔"
