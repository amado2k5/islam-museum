id: event/ibn-bistam-seeks-amnesty-for-banu-al-harith-and-al-hadi-grants-it-on-conditions-295
class: event
kind: other
label:
  ar: "ابن بسطام يستأمن لبني الحارث، والهادي يؤمنهم بشروط، سنة 295هـ، ص357"
  en: "Ibn Bistam asks amnesty for Banu al-Harith and al-Hadi grants it on conditions, 295 AH, p. 357"
  ur: "ابن بسطام کا بنو حارث کے لیے امان مانگنا اور ہادی کا شرائط پر امان دینا، 295ھ، ص357"
  es: "Ibn Bistam solicita amnistía para Banu al-Harith y al-Hadi la concede bajo ciertas condiciones, 295 AH, p. 357."
summary:
  ar: "استأمن ابن بسطام لبني الحارث، فآمنهم الهادي على أن يؤدوا الصدقات الواجبة، ولا يُردّ عليهم عبيدهم الفارون، وأن يدخلوا فيما دخل فيه الناس، ولا يحدثوا حدثاً، ومن أحدث منهم أُخذ الجميع به. وبعث الهادي من يقبض الصدقات من سرّ بني مازن."
  en: "Ibn Bistam asked amnesty for Banu al-Harith, and al-Hadi granted it on conditions: they must pay the zakat due, their runaway slaves who came over would not be returned, they must enter the community as the people had, they must not cause any innovation or side with an innovator, and if one of them rose, they would all be answerable together. Al-Hadi sent men to collect the zakat from the sirr of Banu Mazin."
  ur: "ابن بسطام نے بنو حارث کے لیے امان مانگی تو ہادی نے شرائط پر امان دی: وہ واجب زکوٰۃ ادا کریں، ان کے بھاگے ہوئے غلام جو ہادی کے پاس آئیں واپس نہ کیے جائیں، وہ دوسرے لوگوں کی طرح جماعت میں شامل ہوں، کوئی نیا فتنہ نہ اٹھائیں اور نہ کسی فتنہ پرور کا ساتھ دیں، اور اگر ان میں سے کوئی بغاوت کرے تو سب اس کے ذمہ دار ہوں گے۔ ہادی نے بنو مازن کے سرّ سے زکوٰۃ وصول کرنے کے لیے آدمی بھیجے۔"
  es: "Ibn Bistam solicitó amnistía para Banu al-Harith, y al-Hadi la concedió con ciertas condiciones: debían pagar el zakat correspondiente, no devolver a sus esclavos fugitivos que hubieran llegado a la comunidad, integrarse en ella como lo habían hecho los demás, no incitar a ninguna innovación ni apoyar a ningún innovador, y si alguno de ellos se rebelaba, todos serían responsables conjuntamente. Al-Hadi envió hombres a recaudar el zakat del sirr de Banu Mazin."
