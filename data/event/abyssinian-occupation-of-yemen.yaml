summary:
  en: "In 525, answering the Najran atrocity, the Roman emperors equipped an Abyssinian fleet which landed seventy thousand under Aryat; Aryat governed until his general Abraha killed him and ruled in his place — the Abraha of the elephant campaign against the Kaaba."
  ar: "سنة 525م، وكنقمة لما فعله ذو نواس، هيأ أباطرة الروم للأحباش الأسطول فنزل سبعون ألف جندي بقيادة أرباط؛ فظل حاكماً حتى اغتاله أبرهة أحد قواد جيشه وحكم بدله — وهو صاحب حملة الفيل على الكعبة."
