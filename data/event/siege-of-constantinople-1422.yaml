label: { ar: "حصار القسطنطينية (١٤٢٢)", en: "Siege of Constantinople (1422)" }
summary:
  ar: "بدأ السلطان مراد الثاني حصار القسطنطينية سنة 825هـ/1422م، وكان قد تولى العرش بعد وفاة أبيه محمد الأول وقضى على دعوى المدعي المعروف في التاريخ التركي بدزمه مصطفى الذي سنده الإمبراطور مانويل؛ ورُفع الحصار إما لمال بيزنطي وصل إلى الوزير إبراهيم باشا المحب للروم، أو لظهور مدعٍّ جديد للعرش في إزنيق هو أخو السلطان الأصغر مصطفى الذي خانه أنصاره فيما بعد وقُتل {cite:encyclopaedia-of-islam-2 vol. 7 p. 648-649}."
  en: "In 825/1422 Sultan Murad II began a siege of Constantinople. He had come to the throne after the death of his father Mehemmed I and had just overcome the pretender known in Turkish history as Düzme Mustafa, whom the emperor Manuel had supported. The siege was raised, either through Byzantine gold reaching the graecophile vizier Ibrahim Pasha, or because a new pretender appeared in Iznik in the person of Murad's younger brother Mustafa, who was later betrayed by his supporters and killed {cite:encyclopaedia-of-islam-2 vol. 7 p. 648-649}."
