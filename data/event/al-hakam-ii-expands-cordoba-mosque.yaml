  es: "Al-Hakam al-Mustansir realizó la célebre ampliación de la mezquita (961-976), perfeccionando el mihrab y la maqsura con cúpulas nervadas entrelazadas y mosaicos enviados por el rey bizantino {cite:nafh-tib-maqqari}."
  fr: "Al-Hakam al-Mustansir a réalisé le célèbre agrandissement de la mosquée (961-976), perfectionnant le mihrab et la maqsura avec des dômes nervurés entrelacés et une mosaïque envoyée par le roi byzantin {cite:nafh-tib-maqqari}."
