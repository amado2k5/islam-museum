label: { ar: "قتل الأمير أقطاي سنة 652هـ", en: "The killing of the amir Aqtay in 652 AH", es: "El asesinato del emir Aqtay en el año 652 de la Hégira.", fr: "L'assassinat de l'émir Aqtay en 652 AH", ur: "652 ہجری میں امیر اقتعی کا قتل", tr: "Prens Aktay, Hicri 652 yılında öldürüldü.", id: "Pangeran Aqtai terbunuh pada tahun 652 Hijriah." }
summary:
  ar: "وفيها قتل الأمير فارس الدين أقطاي التركي الصالحي النجمي وكان موصوفاً بالشجاعة والكرم اشتراه الصالح بألف دينار فلما اتصلت السلطنة إلى رفيقه الملك المعز بالغ أقطاي في الإذلال والتجبر وبقي يركب ركبة ملك وتزوج بابنة صاحب حماة وقال للمعز أريد أعمل العرس في قلعة الجبل فأخلها لي وكان يدخل الخزائن ويتصرف في الأموال فاتفق المعز وزوجته شجرة الدر عليه ورتبا من قتله وأغلقت أبواب القلعة فركبت مماليكه وكانوا سبعمائة وأحاطوا بالقلعة فألقى إليهم رأسه فهربوا وتفرقوا ودان قتله في شعبان {cite:shadharat-dhahab p. 263}."
  en: "In Sha'ban 652 the amir Faris al-Din Aqtay — al-Salih's thousand-dinar mamluk turned overbearing under his comrade al-Mu'izz, demanding the Citadel itself for his wedding to the Hamah prince's daughter — was killed by plot of al-Mu'izz and Shajar al-Durr; when his seven hundred mamluks ringed the Citadel, his head was thrown down and they scattered {cite:shadharat-dhahab p. 263}."
  es: "En Sha'ban 652, el emir Faris al-Din Aqtay —el mameluco de mil dinares de al-Salih se volvió prepotente bajo el mando de su camarada al-Mu'izz, exigiendo la propia Ciudadela para su boda con la hija del príncipe de Hamah— fue asesinado por una conspiración de al-Mu'izz y Shajar al-Durr; cuando sus setecientos mamelucos rodearon la Ciudadela, su cabeza fue arrojada al suelo y se dispersaron {cite:shadharat-dhahab p. 263}."
  fr: "En Sha'ban 652, l'émir Faris al-Din Aqtay — le mamelouk de mille dinars d'al-Salih devenu arrogant sous son camarade al-Mu'izz, exigeant la Citadelle elle-même pour son mariage avec la fille du prince de Hamah — fut tué par un complot d'al-Mu'izz et de Shajar al-Durr; lorsque ses sept cents mamelouks encerclèrent la Citadelle, sa tête fut jetée à terre et ils se dispersèrent {cite:shadharat-dhahab p. 263}."
  ur: "شعبان 652 میں امیر فارس الدین اقتی - الصالح کا ہزار دینار مملوک اپنے ساتھی المعز کے ماتحت دبنگ ہو گیا اور حماہ کے شہزادے کی بیٹی سے شادی کے لیے خود قلعہ کا مطالبہ کیا - المعز اور شجر الدّی کی سازش سے مارا گیا۔ جب اس کے سات سو مملوکوں نے قلعہ کو گھیر لیا تو اس کا سر نیچے پھینک دیا گیا اور وہ بکھر گئے۔ 263}۔"
  tr: "Bu olayda Prens Faris el-Din Aktay el-Turki el-Salihi el-Najmi öldürüldü. Cesareti ve cömertliğiyle tanınıyordu. El-Salihi onu bin dinara satın almıştı. Sultanlık arkadaşı Kral el-Muizz'e geçtiğinde, Aktay aşırı derecede aşağılayıcı ve zalim bir tavır sergiledi. Kral gibi at sürmeye devam etti ve Hama hükümdarının kızıyla evlendi. El-Muizz'e, \"Düğünü Dağ Kalesi'nde yapmak istiyorum, orayı benim için boşalt\" dedi. Hazinelere girip parayı harcayacaktı. El-Muizz ve karısı Şeceret el-Durr ona karşı komplo kurarak öldürülmesini ayarladılar. Kalenin kapıları kapatıldı ve yedi yüz kişilik Memlük askerleri dışarı çıkıp kaleyi kuşattılar. Aktay başını onlara fırlattı ve onlar kaçıp dağıldılar. Cinayeti Şaban ayında gerçekleşti. {alıntı: shadharat-dhahab s. 263}"
  id: "Di dalamnya, Pangeran Faris al-Din Aqtai al-Turki al-Salihi al-Najmi terbunuh. Ia dikenal karena keberanian dan kemurahannya. Al-Salihi membelinya seharga seribu dinar. Ketika Kesultanan beralih ke sahabatnya, Raja al-Mu’izz, Aqtai bertindak sangat hina dan tirani. Ia terus bertindak seperti raja dan menikahi putri penguasa Hama. Ia berkata kepada al-Mu’izz, “Aku ingin mengadakan pernikahan di Benteng Gunung, jadi bersihkanlah untukku.” Ia akan memasuki perbendaharaan dan menghabiskan uangnya. Al-Mu’izz dan istrinya, Shajarat al-Durr, bersekongkol melawannya dan merencanakan pembunuhannya. Gerbang Benteng ditutup, dan para Mamluknya, yang berjumlah tujuh ratus orang, keluar dan mengepung Benteng. Ia melemparkan kepalanya ke arah mereka, dan mereka melarikan diri dan berpencar. Pembunuhannya terjadi pada bulan Sya'ban. {cite:shadharat-dhahab p. 263}"
