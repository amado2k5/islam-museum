label: { ar: "قتل الأمير أقطاي سنة 652هـ" }
summary:
  ar: "وفيها قتل الأمير فارس الدين أقطاي التركي الصالحي النجمي وكان موصوفاً بالشجاعة والكرم اشتراه الصالح بألف دينار فلما اتصلت السلطنة إلى رفيقه الملك المعز بالغ أقطاي في الإذلال والتجبر وبقي يركب ركبة ملك وتزوج بابنة صاحب حماة وقال للمعز أريد أعمل العرس في قلعة الجبل فأخلها لي وكان يدخل الخزائن ويتصرف في الأموال فاتفق المعز وزوجته شجرة الدر عليه ورتبا من قتله وأغلقت أبواب القلعة فركبت مماليكه وكانوا سبعمائة وأحاطوا بالقلعة فألقى إليهم رأسه فهربوا وتفرقوا ودان قتله في شعبان {cite:shadharat-dhahab p. 263}."
  en: "In Sha'ban 652 the amir Faris al-Din Aqtay — al-Salih's thousand-dinar mamluk turned overbearing under his comrade al-Mu'izz, demanding the Citadel itself for his wedding to the Hamah prince's daughter — was killed by plot of al-Mu'izz and Shajar al-Durr; when his seven hundred mamluks ringed the Citadel, his head was thrown down and they scattered {cite:shadharat-dhahab p. 263}."
