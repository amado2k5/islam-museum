label: { ar: "قتل الأمير أقطاي سنة 652هـ", en: "The killing of the amir Aqtay in 652 AH", es: "El asesinato del emir Aqtay en el año 652 de la Hégira.", fr: "L'assassinat de l'émir Aqtay en 652 AH" }
summary:
  ar: "وفيها قتل الأمير فارس الدين أقطاي التركي الصالحي النجمي وكان موصوفاً بالشجاعة والكرم اشتراه الصالح بألف دينار فلما اتصلت السلطنة إلى رفيقه الملك المعز بالغ أقطاي في الإذلال والتجبر وبقي يركب ركبة ملك وتزوج بابنة صاحب حماة وقال للمعز أريد أعمل العرس في قلعة الجبل فأخلها لي وكان يدخل الخزائن ويتصرف في الأموال فاتفق المعز وزوجته شجرة الدر عليه ورتبا من قتله وأغلقت أبواب القلعة فركبت مماليكه وكانوا سبعمائة وأحاطوا بالقلعة فألقى إليهم رأسه فهربوا وتفرقوا ودان قتله في شعبان {cite:shadharat-dhahab p. 263}."
  en: "In Sha'ban 652 the amir Faris al-Din Aqtay — al-Salih's thousand-dinar mamluk turned overbearing under his comrade al-Mu'izz, demanding the Citadel itself for his wedding to the Hamah prince's daughter — was killed by plot of al-Mu'izz and Shajar al-Durr; when his seven hundred mamluks ringed the Citadel, his head was thrown down and they scattered {cite:shadharat-dhahab p. 263}."
  es: "En Sha'ban 652, el emir Faris al-Din Aqtay —el mameluco de mil dinares de al-Salih se volvió prepotente bajo el mando de su camarada al-Mu'izz, exigiendo la propia Ciudadela para su boda con la hija del príncipe de Hamah— fue asesinado por una conspiración de al-Mu'izz y Shajar al-Durr; cuando sus setecientos mamelucos rodearon la Ciudadela, su cabeza fue arrojada al suelo y se dispersaron {cite:shadharat-dhahab p. 263}."
  fr: "En Sha'ban 652, l'émir Faris al-Din Aqtay — le mamelouk de mille dinars d'al-Salih devenu arrogant sous son camarade al-Mu'izz, exigeant la Citadelle elle-même pour son mariage avec la fille du prince de Hamah — fut tué par un complot d'al-Mu'izz et de Shajar al-Durr; lorsque ses sept cents mamelouks encerclèrent la Citadelle, sa tête fut jetée à terre et ils se dispersèrent {cite:shadharat-dhahab p. 263}."
