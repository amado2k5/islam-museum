label: { ar: "معاهدة كريسبي دي فالوا ⁦(١٥٤٤م)⁩", en: "Treaty of Crépy-en-Laonnois (1544)", es: "Tratado de Crépy-en-Laonnois (1544)", fr: "Traité de Crépy-en-Laonnois (1544)", ur: "معاہدہ کریپی این لاونوس (1544)", tr: "Crispi de Valois Antlaşması (MS 1544)", id: "Perjanjian Crispi de Valois (1544 M)" }
summary:
  ar: "المعاهدة التي عقدها شارل الخامس مع ملك فرنسا في ١٨ سبتمبر ١٥٤٤م في مدينة كريسبي دي فالوا، بعد أن هوى نجمه إثر نكبته أمام الجزائر وضغط التمرد البروتستانتي في ألمانيا في وصف الصلابي؛ ونتج عنها جلاء خير الدين بربروسة وقواته عن مدينة طولون وعودته إلى استانبول {cite:dawlat-uthmaniyya-salabi p. 232}."
  en: "The treaty Charles V concluded with the king of France at Crépy-en-Laonnois on 18 September 1544 — after, in al-Salabi's phrase, his star sank with the Algiers disaster and the Protestant rising pressed him in Germany; by it Khayr al-Din's forces evacuated Toulon for Istanbul {cite:dawlat-uthmaniyya-salabi p. 232}."
  es: "El tratado que Carlos V concluyó con el rey de Francia en Crépy-en-Laonnois el 18 de septiembre de 1544, después de que, en palabras de al-Salabi, su estrella se apagara con el desastre de Argel y el levantamiento protestante lo presionara en Alemania; gracias a él, las fuerzas de Khayr al-Din evacuaron Tolón hacia Estambul {cite:dawlat-uthmaniyya-salabi p. 232}."
  fr: "Le traité que Charles Quint conclut avec le roi de France à Crépy-en-Laonnois le 18 septembre 1544 — après que, selon l'expression d'al-Salabi, son étoile ait sombré avec le désastre d'Alger et que le soulèvement protestant l'ait pressé en Allemagne; grâce à lui, les forces de Khayr al-Din évacuèrent Toulon pour Istanbul {cite:dawlat-uthmaniyya-salabi p. 232}."
  ur: "چارلس پنجم کا معاہدہ فرانس کے بادشاہ کے ساتھ 18 ستمبر 1544 کو Crépy-en-Laonnois میں ہوا - السلابی کے فقرے کے بعد، الجزائر کی تباہی کے ساتھ اس کا ستارہ ڈوب گیا اور پروٹسٹنٹ کے عروج نے اسے جرمنی میں دبا دیا۔ اس کے ذریعے خیرالدین کی افواج نے تولون کو استنبول کے لیے خالی کر دیا۔ 232}۔"
  tr: "El-Salabi'nin anlattığına göre, V. Charles'ın Cezayir'deki yenilgisi ve Almanya'daki Protestan isyanının baskısı sonucu yıldızının sönmesinin ardından, 18 Eylül 1544'te Crespi de Valois şehrinde Fransa Kralı ile imzaladığı antlaşma; bu antlaşma, Khair ad-Din Barbarossa ve kuvvetlerinin Toulon şehrinden tahliyesine ve İstanbul'a dönüşüne yol açmıştır. {cite:dawlat-uthmaniyya-salabi s. 232}"
  id: "Perjanjian yang dibuat Charles V dengan Raja Prancis pada tanggal 18 September 1544, di kota Crespi de Valois, setelah popularitasnya menurun menyusul kekalahannya di Aljazair dan tekanan pemberontakan Protestan di Jerman, seperti yang dijelaskan oleh al-Salabi; dan hal itu mengakibatkan evakuasi Khair ad-Din Barbarossa dan pasukannya dari kota Toulon dan kepulangannya ke Istanbul {cite:dawlat-uthmaniyya-salabi p. 232}."
