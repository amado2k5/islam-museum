id: event/a-poem-after-the-killing-of-hamdan-at-saada-that-the-heading-gives-to-muhammad-ibn-al-mukhtar
class: event
kind: other
label:
  ar: "قصيدة من الوافر بعد القتل بصعدة، يذكر العنوان أنها لمحمد بن المختار، ص328 إلى ص329"
  en: "A poem in the wafir metre after a killing at Sa'da, which its heading says is by Muhammad ibn al-Mukhtar, pp. 328 to 329"
  fr: "Un poème en mètre wafir après une tuerie à Sa'da, attribué par son titre à Muhammad ibn al-Mukhtar, p. 328 à 329"
  ur: "صعدہ میں قتل کے بعد وافر بحر کی نظم جس کا عنوان کہتا ہے کہ وہ محمد بن المختار کی ہے، ص328 تا ص329"
  es: "Un poema en metro wafir después de un asesinato en Sa'da, que según su encabezado es de Muhammad ibn al-Mukhtar, págs. 328 a 329."
  tr: "Sa'de katliamından sonra yazılmış, Vefir vezniyle yazılmış bir şiir; başlıkta Muhammed bin el-Mukhtar tarafından yazıldığı belirtiliyor, s. 328-329"
  id: "Sebuah puisi dalam meter Wafir setelah pembunuhan di Sa'dah; judulnya menyatakan bahwa puisi tersebut karya Muhammad bin al-Mukhtar, hlm. 328-329"
summary:
  ar: "قصيدة من الوافر تحت عنوان «وله أيضاً» في ص328، ويضيف العنوان أن القصيدة لمحمد بن المختار بالصحيح وأنها قيلت بعد قتله لـ«همدان» بصعدة، وتنص حاشية ص على أنها ليست للهادي بل للمنتصر محمد بن المختار قالها بعد الثأر لأبيه في ريدة؛ يسأل فيها الشاعر سلمى لم تلومه، ويذكر فتكه وطعنه وضربه وشفاء نفسه بقتل قتلة الإمام."
  en: "A poem in the wafir metre under the heading \"and also of his\" on p. 328; the heading adds that the poem is correctly by Muhammad ibn al-Mukhtar and was said after his killing of \"Hamdan\" at Sa'da, and the margin of manuscript S says it is not al-Hadi's but al-Muntasir Muhammad ibn al-Mukhtar's, said when he took vengeance for his father at Raydah; in it the poet asks Salma why she blames him and tells of his attack, his thrusting and striking, and the easing of his heart by the killing of those who killed the imam."
  fr: "Un poème en mètre wafir figure sous le titre « et encore de lui » à la p. 328 ; le titre précise qu’il est en réalité de Muhammad ibn al-Mukhtar et fut composé après qu’il eut tué « Hamdan » à Sa'da. La marge du manuscrit S indique qu’il n’est pas d’al-Hadi mais d’al-Muntasir Muhammad ibn al-Mukhtar, qui le composa en vengeant son père à Raydah. Le poète y demande à Salma pourquoi elle le blâme et évoque son attaque, ses coups de lance et d’épée, et l’apaisement de son cœur par la mort des meurtriers de l’imam."
  ur: "وافر بحر کی نظم، ص328 پر عنوان «اور اس کا یہ بھی» کے تحت؛ عنوان اضافہ کرتا ہے کہ نظم درست یہ ہے کہ محمد بن المختار کی ہے اور صعدہ میں «ہمدان» کو قتل کرنے کے بعد کہی گئی، اور نسخہ ص کا حاشیہ کہتا ہے کہ یہ ہادی کی نہیں بلکہ المنتصر محمد بن المختار کی ہے جو انہوں نے ریدہ میں اپنے والد کا بدلہ لینے پر کہی؛ اس میں شاعر سلمیٰ سے پوچھتا ہے کہ وہ اسے کیوں ملامت کرتی ہے، اپنے حملے، نیزے اور ضرب کا ذکر کرتا ہے اور اس کا کہ امام کے قاتلوں کو قتل کر کے اس کے دل کو شفا ملی۔"
  es: "Un poema en metro wafir bajo el título \"y también suyo\" en la página 328; el título añade que el poema es correctamente de Muhammad ibn al-Mukhtar y fue dicho después de que matara a \"Hamdan\" en Sa'da, y el margen del manuscrito S dice que no es de al-Hadi sino de al-Muntasir Muhammad ibn al-Mukhtar, dicho cuando se vengó de su padre en Raydah; en él el poeta le pregunta a Salma por qué lo culpa y le cuenta su ataque, sus embestidas y golpes, y el alivio de su corazón por la muerte de quienes mataron al imán."
  tr: "328. sayfada, Veafir ölçüsünde yazılmış “Ve onun için de” başlıklı bir şiir bulunmaktadır. Başlıkta, şiirin Muhammed bin Al-Mukhtar tarafından yazıldığı ve Saada'da “Hamdan”ı öldürdükten sonra söylendiği belirtilmektedir. 328. sayfadaki bir dipnotta ise şiirin Al-Hadi'ye değil, babasının intikamını Rida'da aldıktan sonra söyleyen Al-Muntasir Muhammed bin Al-Mukhtar'a ait olduğu ifade edilmektedir. Şiirde şair, Salma'ya neden kendisini suçlamadığını sorar ve İmam'ın katillerini öldürme, bıçaklama, dövme ve bu şekilde kendini iyileştirme eylemlerinden bahseder."
  id: "Sebuah puisi dalam meter Waafir berjudul “Dan untuknya juga” di halaman 328. Judul tersebut menambahkan bahwa puisi itu karya Muhammad bin Al-Mukhtar, dan bahwa puisi itu diucapkan setelah ia membunuh “Hamdan” di Saada. Catatan kaki di halaman 328 menyatakan bahwa puisi itu bukan karya Al-Hadi, tetapi karya Al-Muntasir Muhammad bin Al-Mukhtar, yang mengucapkannya setelah membalas dendam atas kematian ayahnya di Rida. Di dalamnya, penyair bertanya kepada Salma mengapa ia tidak menyalahkannya, dan ia menyebutkan pembunuhan, penusukan, dan pemukulan yang dilakukannya, serta penyembuhan dirinya sendiri dengan membunuh para pembunuh Imam."
