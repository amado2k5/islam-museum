summary:
  ar: "بطاقة أولية لحصار سميرنا سنة ١٤٠٢م، أخذ تيمور للقلعة الصليبية وإغراق الحامية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Siege of Smyrna in 1402, Timur's storming of the Crusader castle and drowning of its garrison; its sources are not yet checked on the page."
