  ur: "1402 میں سمرنا کے محاصرے کے لیے ڈرافٹ کارڈ، تیمور کا صلیبی قلعے پر حملہ اور اس کی چوکی کا غرقاب؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1402 yılında Timur'un Haçlı kalesini ele geçirmesi ve garnizonun boğulmasıyla sonuçlanan İzmir kuşatmasının ön anlatımı; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang pengepungan Smyrna pada tahun 1402 M, penaklukan benteng Tentara Salib oleh Timur dan tenggelamnya garnisun; sumber-sumber di halaman ini belum ditinjau."
