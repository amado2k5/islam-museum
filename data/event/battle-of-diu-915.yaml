label: { ar: "معركة ديو البحرية", en: "Naval Battle of Diu", fr: "La bataille navale de Diu", es: "Batalla naval de Diu", ur: "دیو کی بحری جنگ", tr: "Dio Savaşı", id: "Pertempuran Dio" }
summary:
  ar: "شعر المماليك بالمسؤولية عن حماية الأماكن المقدسة من التوسع البرتغالي رغم وهن دولتهم، فأرسل السلطان قانصوه الغوري حملة بحرية من ثلاث عشرة سفينة عليها ألف وخمسمائة رجل بقيادة حسين الكردي، وصلت إلى جزيرة ديو ثم شاول والتقت بالأسطول البرتغالي بقيادة ألونزو دي ألميدا عام ٩١٤هـ/١٥٠٨م فكان النصر حليف المسلمين، لكن البرتغاليين عززوا قواتهم وأعادوا الكرة فهُزم الأسطول الإسلامي سنة ٩١٥هـ/١٥٠٩م في معركة ديو الشهيرة في التاريخ. وأرسل السلطان بايزيد الثاني العثماني مساعدة للغوري في شوال ٩١٦هـ/١٥١١م من مكاحل وأسهم وأربعين قنطار بارود لكنها لم تصل سالمة لتعرضها لقرصنة فرسان القديس يوحنا {cite:dawlat-uthmaniyya-salabi p. 195-196}."
  en: "Diu (1509): the Mamluk fleet under Husayn al-Kurdi beat the Portuguese at Chaul in 1508, then was destroyed off Diu when Almeida's reinforcements returned — a turning point that gave Portugal command of the Indian Ocean approaches {cite:dawlat-uthmaniyya-salabi p. 195-196}."
  fr: "Diu (1509) : la flotte mamelouke de Husayn al-Kurdi battit les Portugais à Chaul en 1508, puis fut détruite au large de Diu quand les renforts d'Almeida revinrent : un tournant qui donna au Portugal la maîtrise des approches de l'océan Indien {cite:dawlat-uthmaniyya-salabi p. 195-196}."
  es: "Diu (1509): la flota mameluca al mando de Husayn al-Kurdi derrotó a los portugueses en Chaul en 1508, y luego fue destruida frente a Diu cuando regresaron los refuerzos de Almeida, un punto de inflexión que le dio a Portugal el control de los accesos al Océano Índico {cite:dawlat-uthmaniyya-salabi p. 195-196}."
  ur: "دیو (1509): حسین الکردی کے ماتحت مملوک بحری بیڑے نے 1508 میں چول کے مقام پر پرتگالیوں کو شکست دی، پھر دیو سے اس وقت تباہ ہو گیا جب المیڈا کی کمک واپس آگئی - ایک اہم موڑ جس نے بحر ہند کی پرتگال کی کمان کو قریب پہنچایا۔ 195-196}۔"
  tr: "Devletlerinin zayıflığına rağmen, Memlükler kutsal yerleri Portekiz yayılmacılığından koruma sorumluluğunu hissettiler. Sultan Kansuh el-Gavri, Hüseyin el-Kurdi komutasında 1500 adam taşıyan on üç gemiden oluşan bir deniz seferi düzenledi. Diu adasına ve ardından Şevval'e ulaşan bu sefer, 914 Hicri/1508 Miladi yılında Alonso de Almeida komutasındaki Portekiz filosuyla karşılaştı. Müslümanlar galip geldi, ancak Portekizliler güçlerini takviye ederek başka bir saldırı başlattılar. Müslüman filosu, 915 Hicri/1509 Miladi yılında ünlü Diu Muharebesi'nde yenildi. Şevval 916 Hicri/1511 Miladi yılında Osmanlı İmparatorluğu Sultanı II. Bayezid, el-Gavri'ye sürme, ok ve kırk kuintal baruttan oluşan yardım gönderdi, ancak Aziz Yahya Şövalyeleri'nin korsanlığı nedeniyle yardım güvenli bir şekilde ulaşmadı. {cite:dawlat-uthmaniyya-salabi s. 195-196}"
  id: "Meskipun negara mereka lemah, Mamluk merasa bertanggung jawab untuk melindungi tempat-tempat suci dari ekspansi Portugis. Sultan Qansuh al-Ghawri mengirimkan ekspedisi angkatan laut yang terdiri dari tiga belas kapal yang membawa 1.500 orang, dipimpin oleh Husayn al-Kurdi. Mereka mencapai pulau Diu dan kemudian Shawal, bertemu dengan armada Portugis di bawah komando Alonso de Almeida pada tahun 914 H/1508 M. Umat Muslim meraih kemenangan, tetapi Portugis memperkuat pasukan mereka dan melancarkan serangan lain. Armada Muslim dikalahkan pada tahun 915 H/1509 M dalam Pertempuran Diu yang terkenal. Pada bulan Shawal 916 H/1511 M, Sultan Bayezid II dari Kekaisaran Ottoman mengirimkan bantuan kepada al-Ghawri berupa celak, anak panah, dan empat puluh kuintal bubuk mesiu, tetapi bantuan tersebut tidak sampai dengan selamat karena pembajakan oleh Ksatria Santo Yohanes. {cite:dawlat-uthmaniyya-salabi p. 195-196}"
