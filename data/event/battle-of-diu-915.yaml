label: { ar: "معركة ديو البحرية" }
summary:
  ar: "شعر المماليك بالمسؤولية عن حماية الأماكن المقدسة من التوسع البرتغالي رغم وهن دولتهم، فأرسل السلطان قانصوه الغوري حملة بحرية من ثلاث عشرة سفينة عليها ألف وخمسمائة رجل بقيادة حسين الكردي، وصلت إلى جزيرة ديو ثم شاول والتقت بالأسطول البرتغالي بقيادة ألونزو دي ألميدا عام ٩١٤هـ/١٥٠٨م فكان النصر حليف المسلمين، لكن البرتغاليين عززوا قواتهم وأعادوا الكرة فهُزم الأسطول الإسلامي سنة ٩١٥هـ/١٥٠٩م في معركة ديو الشهيرة في التاريخ. وأرسل السلطان بايزيد الثاني العثماني مساعدة للغوري في شوال ٩١٦هـ/١٥١١م من مكاحل وأسهم وأربعين قنطار بارود لكنها لم تصل سالمة لتعرضها لقرصنة فرسان القديس يوحنا {cite:dawlat-uthmaniyya-salabi p. 195-196}."
  en: "Diu (1509): the Mamluk fleet under Husayn al-Kurdi beat the Portuguese at Chaul in 1508, then was destroyed off Diu when Almeida's reinforcements returned — a turning point that gave Portugal command of the Indian Ocean approaches {cite:dawlat-uthmaniyya-salabi p. 195-196}."
