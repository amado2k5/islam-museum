id: event/al-hadi-breaches-the-wall-of-al-hajar-286
class: event
kind: other
label:
  ar: هجوم الهادي على قرية الهجر وفتحه نقباً في سورها، 286هـ
  en: Al-Hadi's attack on the village of al-Hajar and the breach he opens in its wall, 286 AH
  ur: قریۂ الہجر پر ہادی کا حملہ اور اس کی دیوار میں شگاف، 286ھ
  es: "El ataque de Al-Hadi a la aldea de Al-Hajar y la brecha que abre en su muralla, 286 AH."
  fr: "Attaque d'Al-Hadi contre le village d'al-Hajar et brèche qu'il ouvre dans ses remparts, 286 AH"
  tr: "El-Hadi'nin El-Hacer köyüne saldırısı ve surlarının yıkılması, Hicri 286"
  id: "Serangan Al-Hadi terhadap desa Al-Hajar dan penembusan temboknya, 286 H."
summary:
  ar: تصل كتب الهادي إلى محمد بن عبيد الله وإلى المهرا وخولان فيحشدون ويأتيه عسكر كثير، وكان قد اصطنع رجالاً من همدان نجران، فيسير بمن معه إلى قرية بني الحارث المسماة الهجر، ويلتحم القتال على باب الدرب، ثم يفتح في جدار الحصن نقباً يدخل منه فارس وقد انتخب ثلاثمائة راجل وثلاثين فارساً لذلك، ويدخل القرية ويأمر الناس بالدخول معه.
  en: Al-Hadi's letters reach Muhammad ibn Ubaydallah and al-Mahra and Khawlan, who muster and send a large army; he had also drawn men of Hamdan of Najran to himself, and he marches with them to the village of Banu al-Harith called al-Hajar, fighting joins at the gate of the pass, then he has a breach opened in the wall wide enough for a horseman, having picked three hundred foot and thirty horse for it, and goes into the village calling the people in behind him.
  ur: ہادی کے خطوط محمد بن عبید اللہ اور مہرا اور خولان کو پہنچتے ہیں جو جمع ہو کر بڑا لشکر بھیجتے ہیں؛ انہوں نے نجران کے ہمدان کے کچھ لوگوں کو بھی اپنے ساتھ ملا رکھا تھا، وہ ان کے ساتھ بنو حارث کی بستی الہجر کی طرف چلتے ہیں، درے کے دروازے پر لڑائی چھڑتی ہے، پھر وہ قلعے کی دیوار میں اتنا شگاف کرواتے ہیں کہ ایک سوار داخل ہو سکے، اس کے لیے تین سو پیادے اور تیس سوار چن رکھے تھے، اور بستی میں داخل ہو کر لوگوں کو اپنے پیچھے آنے کی پکار دیتے ہیں۔
  es: "Las cartas de Al-Hadi llegan a Muhammad ibn Ubaydallah, al-Mahra y Khawlan, quienes reúnen y envían un gran ejército; también había reclutado a hombres de Hamdan de Najran, y marcha con ellos hacia la aldea de Banu al-Harith llamada al-Hajar, donde se unen combatiendo en la puerta del paso. Luego, hace abrir una brecha en la muralla lo suficientemente ancha para un jinete, para lo cual ha escogido trescientos infantes y treinta caballos, y entra en la aldea llamando a la gente que lo sigue."
  fr: "Les lettres d'Al-Hadi parviennent à Muhammad ibn Ubaydallah, à al-Mahra et à Khawlan, qui rassemblent et envoient une grande armée; il a également rallié à sa cause des hommes de Hamdan de Najran, et il marche avec eux jusqu'au village de Banu al-Harith appelé al-Hajar, les combats s'engagent à la porte du col, puis il fait ouvrir une brèche dans le mur suffisamment large pour un cavalier, ayant choisi trois cents fantassins et trente cavaliers pour cela, et entre dans le village en appelant les habitants à le suivre."
  tr: "El-Hadi'nin mektupları Muhammed bin Ubeydullah'a, Mahra ve Havlan'a ulaşır, bunun üzerine toplanırlar ve büyük bir ordu ona gelir. Hamdan-Najran'dan adamlar toplamıştı, bu yüzden yanındakilerle birlikte Beni-Harith'in El-Hacer denilen köyüne doğru yürür ve yolun kapısında çatışma çıkar. Sonra kalenin duvarında bir delik açar ve bir süvari içeri girer; bu amaçla üç yüz piyade ve otuz süvari seçmiştir. Köye girer ve halka kendisiyle birlikte içeri girmelerini emreder."
  id: "Surat-surat Al-Hadi sampai kepada Muhammad bin Ubaid Allah dan Mahra serta Khawlan, sehingga mereka berkumpul dan pasukan besar datang kepadanya. Ia telah merekrut orang-orang dari Hamdan Najran, lalu ia berbaris bersama mereka ke desa Bani Al-Harith yang disebut Al-Hajar, dan pertempuran pecah di gerbang jalan. Kemudian ia membuat lubang di dinding benteng tempat seorang penunggang kuda masuk, dan ia telah memilih tiga ratus prajurit infanteri dan tiga puluh penunggang kuda untuk tujuan itu. Ia memasuki desa dan memerintahkan orang-orang untuk masuk bersamanya."
