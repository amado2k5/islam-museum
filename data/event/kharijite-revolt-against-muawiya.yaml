label: { ar: "خروج الخوارج على معاوية", en: "The Kharijite revolt against Mu'awiya", es: "La revuelta jarijita contra Mu'awiya", fr: "La révolte des Kharijites contre Mu'awiya", ur: "خارجیوں نے معاویہ کے خلاف بغاوت کی۔", tr: "Haricilerin Muaviye'ye isyanı", id: "Pemberontakan kaum Khawarij melawan Muawiyah" }
summary:
  ar: "خرج الخوارج على معاوية في سنة إحدى وأربعين، وعنوانه في فهرس الجزء الخامس «ذكر خروج الخوارج على معاوية» {cite:tabari-tarikh-abu-al-fadl j.5 p.165} {cite:tabari-tarikh-abu-al-fadl j.5 p.627}."
  en: "The Kharijites rose against Mu'awiya in the year 41. Its heading in the index to volume five reads 'Account of the Kharijite rising against Mu'awiya' {cite:tabari-tarikh-abu-al-fadl j.5 p.165} {cite:tabari-tarikh-abu-al-fadl j.5 p.627}."
  es: "Los jariyitas se alzaron contra Mu'awiya en el año 41. Su encabezado en el índice del volumen cinco dice 'Relato del levantamiento jariyita contra Mu'awiya' {cite:tabari-tarikh-abu-al-fadl j.5 p.165} {cite:tabari-tarikh-abu-al-fadl j.5 p.627}."
  fr: "Les Kharijites se soulevèrent contre Mu'awiya en l'an 41. Son titre dans l'index du volume cinq se lit comme suit: « Récit du soulèvement des Kharijites contre Mu'awiya » {cite:tabari-tarikh-abu-al-fadl j.5 p.165} {cite:tabari-tarikh-abu-al-fadl j.5 p.627}."
  ur: "خوارج 41 میں معاویہ کے خلاف اٹھ کھڑے ہوئے۔ پانچویں جلد کے اشاریہ میں اس کا سرخی 'معاویہ کے خلاف خارجیوں کا محاسبہ' پڑھتا ہے۔"
  tr: "Hariciler, 41. yılda Muaviye'ye karşı isyan ettiler ve beşinci bölümün indeksinde bunun başlığı \"Haricilerin Muaviye'ye karşı isyanının anılması\" şeklindedir. {cite:tabari-tarikh-abu-al-fadl j.5 s.165} {cite:tabari-tarikh-abu-al-fadl j.5 s.627}"
  id: "Kaum Kharijites memberontak terhadap Muawiyah pada tahun empat puluh satu, dan judulnya dalam indeks bagian kelima adalah “Penyebutan pemberontakan kaum Kharijites terhadap Muawiyah” {cite:tabari-tarikh-abu-al-fadl j.5 p.165} {cite:tabari-tarikh-abu-al-fadl j.5 p.627}."
