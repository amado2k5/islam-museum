  ur: "1541 میں بودا کی فتح کے لیے ڈرافٹ کارڈ، سلیمان کا داخلہ جس نے شہر کو ڈیڑھ صدی تک عثمانی ریاست کے ساتھ الحاق کیا؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
