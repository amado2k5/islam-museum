  id: "Sebuah kartu pendahuluan untuk penaklukan Buda pada tahun 1541 M, masuknya Suleiman Agung ke kota tersebut dan penggabungannya ke negara selama seratus lima puluh tahun; sumber-sumbernya belum ditinjau di halaman ini."
