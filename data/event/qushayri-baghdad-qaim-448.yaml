label:
  ar: "القشيري ببغداد محدّثاً في قصر القائم، ٤٤٨هـ"
  en: "Al-Qushayri at Baghdad, teaching hadith in the caliph al-Qa'im's palace, 448/1056"
  ur: "قشیری بغداد میں خلیفہ قائم کے قصر میں حدیث پڑھاتے ہوئے، 448ھ/1056ء"
summary:
  ar: "امتدّت مسيرة القشيري في أثناء المحنة إلى بغداد فورد على الخليفة القائم بأمر الله ولقي قبولاً، وعقد له المجلس في منازله المخصصة به بمحضر منه ومرأى، وخرج الأمر بإعزازه وإكرامه؛ وعند دائرة المعارف كلفه القائم بتدريس الحديث في قصره سنة ٤٤٨هـ {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi p. 175}."
  en: "Al-Qushayri's wanderings in the ordeal reached Baghdad, where he came before the caliph al-Qa'im bi-amr Allah and was received with favour: a session was held for him in the caliph's own residence, in his presence and under his eye, and a decree of honour was issued for him — the Encyclopaedia of Islam dates al-Qa'im's commission to teach hadith in the palace to 448/1056 {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi p. 175}."
  ur: "قشیری کا سفرِ محنت بغداد تک پہنچا، جہاں وہ خلیفہ قائم بأمر اللہ کی بارگاہ میں حاضر ہوئے اور قدر و منزلت پائی: ان کے لیے خلیفہ کی اپنی رحیش گاہ میں ان کی موجودگی میں مجلس قائم ہوئی اور اعزاز کا فرمان صادر ہوا — دائرۃ المعارف کے مطابق قائم نے انھیں 448ھ/1056ء میں قصر میں تدریسِ حدیث کی ذمہ داری دی {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi p. 175}۔"
