id: event/qushayri-baghdad-qaim-448
class: event
kind: other
label:
  ar: "القشيري ببغداد محدّثاً في قصر القائم، ٤٤٨هـ"
  en: "Al-Qushayri at Baghdad, teaching hadith in the caliph al-Qa'im's palace, 448/1056"
  ur: "قشیری بغداد میں خلیفہ قائم کے قصر میں حدیث پڑھاتے ہوئے، 448ھ/1056ء"
  es: "Al-Qushayri en Bagdad, enseñando hadices en el palacio del califa al-Qa'im, 448/1056"
  fr: "Al-Qushayri à Bagdad, enseignant le hadith au palais du calife al-Qa'im, 448/1056"
  tr: "El-Kuşeyri, Bağdat'ta, El-Kaim Sarayı'nda hadis dersleri veriyor, Hicri 448."
  id: "Al-Qushayri di Baghdad, mengajarkan hadits di Istana Al-Qaim, 448 Hijriah"
summary:
  ar: "امتدّت مسيرة القشيري في أثناء المحنة إلى بغداد فورد على الخليفة القائم بأمر الله ولقي قبولاً، وعقد له المجلس في منازله المخصصة به بمحضر منه ومرأى، وخرج الأمر بإعزازه وإكرامه؛ وعند دائرة المعارف كلفه القائم بتدريس الحديث في قصره سنة ٤٤٨هـ {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi p. 175}."
  en: "Al-Qushayri's wanderings in the ordeal reached Baghdad, where he came before the caliph al-Qa'im bi-amr Allah and was received with favour: a session was held for him in the caliph's own residence, in his presence and under his eye, and a decree of honour was issued for him — the Encyclopaedia of Islam dates al-Qa'im's commission to teach hadith in the palace to 448/1056 {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi p. 175}."
  ur: "قشیری کا سفرِ محنت بغداد تک پہنچا، جہاں وہ خلیفہ قائم بأمر اللہ کی بارگاہ میں حاضر ہوئے اور قدر و منزلت پائی: ان کے لیے خلیفہ کی اپنی رحیش گاہ میں ان کی موجودگی میں مجلس قائم ہوئی اور اعزاز کا فرمان صادر ہوا — دائرۃ المعارف کے مطابق قائم نے انھیں 448ھ/1056ء میں قصر میں تدریسِ حدیث کی ذمہ داری دی {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi p. 175}۔"
  es: "Las andanzas de Al-Qushayri durante la prueba lo llevaron a Bagdad, donde se presentó ante el califa al-Qa'im bi-amr Allah y fue recibido con favor: se celebró una sesión para él en la propia residencia del califa, en su presencia y bajo su mirada, y se emitió un decreto de honor para él. La Enciclopedia del Islam fecha la comisión de al-Qa'im para enseñar hadices en el palacio en 448/1056 {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi p. 175}."
  fr: "Les pérégrinations d'Al-Qushayri durant cette épreuve le menèrent à Bagdad, où il se présenta devant le calife al-Qa'im bi-amr Allah et fut reçu avec faveur: une session fut organisée pour lui dans la résidence même du calife, en sa présence et sous son regard, et un décret d'honneur fut émis en son honneur — l'Encyclopédie de l'Islam date la mission d'al-Qa'im d'enseigner le hadith au palais à 448/1056 {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi p. 175}."
  tr: "El-Kuşeyri'nin çileli yolculuğu Bağdat'a kadar uzandı; burada Halife El-Kaim bi-Amr Allah ile görüştü ve sıcak bir şekilde karşılandı. Belirlenen ikametgahlarında huzurunda ve gözetiminde bir konsey düzenlendi ve kendisine saygı ve hürmet gösterilmesi emri verildi. El-Kaim, İslam Ansiklopedisi'nde onu 448 Hicri yılında sarayında Hadis dersi vermesi için görevlendirdi. {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi p. 175}"
  id: "Perjalanan Al-Qushayri selama masa sulit itu berlanjut hingga Baghdad, di mana ia bertemu dengan Khalifah Al-Qa’im bi-Amr Allah dan diterima dengan baik. Sebuah dewan diadakan untuknya di kediaman yang telah ditentukan di hadapannya, dan sebuah perintah dikeluarkan untuk menghormati dan menghargainya. Di Ensiklopedia, Al-Qa’im menugaskannya untuk mengajar Hadits di istananya pada tahun 448 H. {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:tarikh-islam-dhahabi p. 175}."
