id: event/mission-of-amr-ibn-hazm-to-najran
class: event
kind: other
label: { ar: "بعث عمرو بن حزم إلى بني الحارث بن كعب وعهد النبي إليه", en: "The sending of Amr ibn Hazm to Banu al-Harith ibn Ka'b and the Prophet's written charge to him", es: "El envío de Amr ibn Hazm a Banu al-Harith ibn Ka'b y el encargo escrito del Profeta a él.", fr: "L'envoi d'Amr ibn Hazm aux Banu al-Harith ibn Ka'b et les instructions écrites du Prophète à son égard.", ur: "عمرو بن حزم کا بنی حارث بن کعب کی طرف بھیجنا اور اس کی طرف رسول اللہ کا تحریری چارج", tr: "Amr ibn Hazm, Beni el-Harith ibn Ka'b'a gönderildi ve Peygamber ona bu görevi emanet etti.", id: "Amr bin Hazm diutus kepada Bani al-Harith bin Ka'b, dan Nabi mempercayakan tugas ini kepadanya." }
summary:
  ar: "بعد أن ولّى وفد بني الحارث بن كعب بعث إليهم النبي عمرو بن حزم ليفقههم في الدين ويعلمهم السنة ومعالم الإسلام ويأخذ منهم صدقاتهم، وكتب له كتاباً عهد إليه فيه عهده: تقوى الله، والأخذ بالحق، وتعليم القرآن وألا يمسه إلا طاهر، واللين في الحق والشدة في الظلم، ومعالم الحج والصلاة ومواقيتها والوضوء والجمعة، والنهي عن دعوى الجاهلية والقبائل، وخمس المغانم وفرائض الصدقة، وحكم من أسلم من أهل الكتاب ومن بقي على دينه وعليه الجزية."
  en: "After the Banu al-Harith delegation left, the Prophet sent Amr ibn Hazm to teach them religion, the sunna and the landmarks of Islam and to collect their sadaqa, writing him a charge: fear of God, taking what is right, teaching the Qur'an which none may touch but the pure, gentleness in right and severity against wrong, the rites of hajj, the prayer and its times, ablution and Friday, the ban on tribal rallying-cries, the fifth of booty and the sadaqa rates, and the rule for People of the Book who convert and for those who keep their faith and pay the jizya."
  es: "Después de que la delegación de Banu al-Harith partió, el Profeta envió a Amr ibn Hazm para enseñarles la religión, la sunna y los hitos del Islam, y para recolectar su sadaqa, escribiéndole una instrucción: temor de Dios, tomar lo que es correcto, enseñar el Corán que nadie puede tocar excepto los puros, gentileza en lo correcto y severidad contra lo incorrecto, los ritos del hajj, la oración y sus horarios, la ablución y el viernes, la prohibición de los gritos de guerra tribales, la quinta parte del botín y las tasas de sadaqa, y la regla para la Gente del Libro que se convierte y para aquellos que mantienen su fe y pagan la jizya."
  fr: "Après le départ de la délégation des Banu al-Harith, le Prophète envoya Amr ibn Hazm leur enseigner la religion, la sunna et les fondements de l'islam, et collecter leur sadaqa, en lui confiant les instructions suivantes: la crainte de Dieu, la pratique du bien, l'enseignement du Coran que seuls les purs peuvent toucher, la douceur dans le bien et la sévérité face au mal, les rites du hajj, la prière et ses horaires, les ablutions et le vendredi, l'interdiction des cris de ralliement tribaux, le cinquième du butin et les taux de sadaqa, ainsi que la règle applicable aux Gens du Livre qui se convertissent et à ceux qui conservent leur foi et paient la jizya."
  ur: "بنی حارث کے وفد کے چلے جانے کے بعد رسول اللہ نے عمرو بن حزم کو بھیجا کہ وہ انہیں دین، سنت اور اسلام کی نشانیاں سکھائیں اور ان کا صدقہ جمع کریں، ان کے لیے یہ تحریر لکھی: خوف خدا، صحیح کو اختیار کرنا، قرآن کی تعلیم دینا جس کو کوئی ہاتھ نہیں لگا سکتا، لیکن پاکیزگی، حق میں نرمی اور برائی کے خلاف سختی، حج اور نماز کی پابندی، نماز جمعہ کی پابندی۔ رونا دھونا، مال غنیمت کا پانچواں حصہ اور صدقہ کی شرح، اور اہل کتاب کے لیے جو مذہب تبدیل کرتے ہیں اور ان لوگوں کے لیے جو اپنا ایمان رکھتے ہیں اور جزیہ دیتے ہیں۔"
  tr: "Beni el-Harith ibn Ka'b heyeti ayrıldıktan sonra, Peygamberimiz, onlara din hakkında bilgi vermek, sünneti ve İslam'ın özelliklerini öğretmek ve zekâtlarını toplamak için Amr ibn Hazm'ı onlara gönderdi. Ona bir mektup yazarak şu taahhütlerini iletti: Allah'tan korkmak, doğruyu almak, Kur'an'ı öğretmek ve ona sadece temiz olanların dokunması gerektiğini bilmek, doğruyu savunmada yumuşak, haksızlıkta ise kararlı olmak, Hac ve namazın özelliklerini ve vakitlerini, abdesti ve Cuma gününü, cahilliğin ve kabilelerin iddialarının yasaklanmasını, savaş ganimetlerinin beşte birini ve zekâtın yükümlülüklerini, Kitap Ehli'nden İslam'a geçenler ve dinlerinde kalanlar hakkında cizye vermenin yükümlülüğünü."
  id: "Setelah delegasi Bani al-Harith bin Ka'b pergi, Nabi mengutus Amr bin Hazm kepada mereka untuk mengajari mereka tentang agama, mengajarkan Sunnah dan ciri-ciri Islam, serta mengumpulkan zakat dari mereka. Beliau menulis surat kepadanya yang berisi perjanjiannya: takut kepada Allah, berpegang pada kebenaran, mengajarkan Al-Qur'an dan bahwa hanya orang yang suci yang boleh menyentuhnya, bersikap lembut dalam menegakkan kebenaran dan teguh dalam ketidakadilan, ciri-ciri haji dan salat serta waktunya, wudhu dan hari Jumat, larangan klaim ketidaktahuan dan suku-suku, seperlima rampasan perang dan kewajiban zakat, serta hukum bagi orang-orang yang masuk Islam dari Ahli Kitab dan orang-orang yang tetap beragama dan wajib membayar jizya."
