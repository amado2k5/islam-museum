label: { ar: "بعث عمرو بن حزم إلى بني الحارث بن كعب وعهد النبي إليه", en: "The sending of Amr ibn Hazm to Banu al-Harith ibn Ka'b and the Prophet's written charge to him" }
summary:
  ar: "بعد أن ولّى وفد بني الحارث بن كعب بعث إليهم النبي عمرو بن حزم ليفقههم في الدين ويعلمهم السنة ومعالم الإسلام ويأخذ منهم صدقاتهم، وكتب له كتاباً عهد إليه فيه عهده: تقوى الله، والأخذ بالحق، وتعليم القرآن وألا يمسه إلا طاهر، واللين في الحق والشدة في الظلم، ومعالم الحج والصلاة ومواقيتها والوضوء والجمعة، والنهي عن دعوى الجاهلية والقبائل، وخمس المغانم وفرائض الصدقة، وحكم من أسلم من أهل الكتاب ومن بقي على دينه وعليه الجزية."
  en: "After the Banu al-Harith delegation left, the Prophet sent Amr ibn Hazm to teach them religion, the sunna and the landmarks of Islam and to collect their sadaqa, writing him a charge: fear of God, taking what is right, teaching the Qur'an which none may touch but the pure, gentleness in right and severity against wrong, the rites of hajj, the prayer and its times, ablution and Friday, the ban on tribal rallying-cries, the fifth of booty and the sadaqa rates, and the rule for People of the Book who convert and for those who keep their faith and pay the jizya."
