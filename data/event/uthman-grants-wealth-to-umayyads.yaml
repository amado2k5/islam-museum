label: { ar: "ما نُسب إلى عثمان من إعطاء ماله وأرضه لبني أمية" }
summary:
  ar: "ذكر الخضري من المطاعن التي وجهها المعترضون على عثمان أنه قسم ماله وأرضه في بني أمية، وجعل ولده كبعض من يُعطى فيه؛ فبدأ ببني أبي العاص فأعطى آل الحكم رجالهم عشرة آلاف فأخذوا مئة ألف، وأعطى بني عثمان مثل ذلك، وقسم في بني العاص وفي بني العيص وفي بني حرب، فلانت حاشية عثمان لتلك الطوائف {cite:khudari-umayyad-state p.225}. ودافع عثمان عن نفسه بأنه إنما يعطيهم من ماله الخاص لا من أموال المسلمين، وأنه كان يعطي في عهد النبي وأبي بكر وعمر من صلب ماله {cite:khudari-umayyad-state p.224}."
