id: event/al-hadi-describes-his-armies-and-asks-them-to-spare-their-blood-in-verse-292
class: event
kind: other
label:
  ar: "أبيات للهادي في وصف جيوشه وسيره إلى خصومه ودعوتهم إلى حقن دمائهم، ص306-307"
  en: "Verses of al-Hadi on his armies, his march on his opponents and his call to them to spare their blood, pp. 306-307"
  ur: "ہادی کے اشعار: اپنے لشکروں، مخالفین کی طرف کوچ اور انہیں خون بچانے کی دعوت، ص306-307"
  es: "Versículos de al-Hadi sobre sus ejércitos, su marcha contra sus oponentes y su llamado a perdonarles la sangre, págs. 306-307."
summary:
  ar: "قصيدة من الوافر يبدأ أولها في أسفل ص306 ويصف فيها الشاعر سيره إلى خصومه في جيوش مظفرة وسيوفاً ورماحاً وخيلاً مجففة، ويقول إنه أعذر ولم يعجل وطلب إليهم أن يحقنوا دماءهم، وإلا فإنه يعدّ دماءهم وأرضهم حلالاً له بحق."
  en: "A poem in the wafir metre that begins at the foot of p. 306, in which the poet describes his march on his opponents in victorious armies with swords, lances and armoured horses, says he gave them excuse and did not hasten and asked them to spare their blood, and otherwise counts their blood and their land lawful to him by right."
  ur: "وافر بحر کی نظم جو ص306 کے آخر میں شروع ہوتی ہے، جس میں شاعر اپنے مخالفین کی طرف فاتح لشکروں کے ساتھ کوچ، تلواروں، نیزوں اور زرہ پوش گھوڑوں کا بیان کرتا ہے، کہتا ہے کہ اس نے عذر کا موقع دیا اور جلدی نہ کی اور ان سے کہا کہ اپنا خون بچا لو، ورنہ وہ ان کے خون اور زمین کو اپنے لیے حق سے جائز گنتا ہے۔"
  es: "Un poema en metro wafir que comienza al pie de la página 306, en el que el poeta describe su marcha sobre sus oponentes en ejércitos victoriosos con espadas, lanzas y caballos acorazados, dice que les dio excusas y no se apresuró y les pidió que perdonaran su sangre, y por lo demás considera que su sangre y su tierra le son legítimas por derecho."
