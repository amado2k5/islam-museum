label: { ar: "غزوة ابن أبي حدرد بطن إضم ومقتل عامر بن الأضبط", en: "Ibn Abi Hadrad's raid on Batn Idam and the killing of Amir ibn al-Adbat" }
summary:
  ar: "سرية بعثها النبي قبل الفتح إلى إضم في نفر فيهم أبو قتادة ومحلّم بن جثامة؛ مرّ بهم عامر بن الأضبط الأشجعي فسلّم بتحية الإسلام، فحمل عليه محلّم فقتله لشيء كان بينهما وأخذ بعيره ومتاعه، فنزلت فيهم آية النساء 94 بحسب ابن أبي حدرد؛ ثم اختصم عيينة بن حصن والأقرع بن حابس في دمه عند النبي بحنين فقُبلت الدية، ودعا النبي على محلّم ثلاثاً: اللهم لا تغفر لمحلّم."
  en: "A detachment the Prophet sent before the conquest of Mecca to Idam, with Abu Qatada and Muhallim ibn Jaththama among its men; Amir ibn al-Adbat al-Ashja'i passed them and gave the greeting of Islam, but Muhallim attacked and killed him over an old grudge and took his camel and goods; Ibn Abi Hadrad says Qur'an 4:94 was revealed about them. At Hunayn Uyayna ibn Hisn and al-Aqra' ibn Habis disputed the blood before the Prophet until blood-money was accepted, and the Prophet prayed three times: 'O God, do not forgive Muhallim'."
