id: event/raid-of-ibn-abi-hadrad-on-batn-idam
class: event
kind: raid
label: { ar: "غزوة ابن أبي حدرد بطن إضم ومقتل عامر بن الأضبط", en: "Ibn Abi Hadrad's raid on Batn Idam and the killing of Amir ibn al-Adbat", es: "La incursión de Ibn Abi Hadrad en Batn Idam y el asesinato de Amir ibn al-Adbat", fr: "Le raid d'Ibn Abi Hadrad sur Batn Idam et le meurtre d'Amir ibn al-Adbat", ur: "ابن ابی حدرد کا بنت ادم پر حملہ اور امیر بن العدب کا قتل" }
summary:
  ar: "سرية بعثها النبي قبل الفتح إلى إضم في نفر فيهم أبو قتادة ومحلّم بن جثامة؛ مرّ بهم عامر بن الأضبط الأشجعي فسلّم بتحية الإسلام، فحمل عليه محلّم فقتله لشيء كان بينهما وأخذ بعيره ومتاعه، فنزلت فيهم آية النساء 94 بحسب ابن أبي حدرد؛ ثم اختصم عيينة بن حصن والأقرع بن حابس في دمه عند النبي بحنين فقُبلت الدية، ودعا النبي على محلّم ثلاثاً: اللهم لا تغفر لمحلّم."
  en: "A detachment the Prophet sent before the conquest of Mecca to Idam, with Abu Qatada and Muhallim ibn Jaththama among its men; Amir ibn al-Adbat al-Ashja'i passed them and gave the greeting of Islam, but Muhallim attacked and killed him over an old grudge and took his camel and goods; Ibn Abi Hadrad says Qur'an 4:94 was revealed about them. At Hunayn Uyayna ibn Hisn and al-Aqra' ibn Habis disputed the blood before the Prophet until blood-money was accepted, and the Prophet prayed three times: 'O God, do not forgive Muhallim'."
  es: "Un destacamento que el Profeta envió antes de la conquista de La Meca a Idam, con Abu Qatada y Muhallim ibn Jaththama entre sus hombres; Amir ibn al-Adbat al-Ashja'i pasó junto a ellos y les dio el saludo del Islam, pero Muhallim lo atacó y lo mató por un viejo rencor y se llevó su camello y sus bienes; Ibn Abi Hadrad dice que el Corán 4:94 fue revelado acerca de ellos. En Hunayn, Uyayna ibn Hisn y al-Aqra' ibn Habis disputaron la sangre ante el Profeta hasta que se aceptó el dinero de la sangre, y el Profeta oró tres veces: 'Oh Dios, no perdones a Muhallim'."
  fr: "Avant la conquête de La Mecque, le Prophète envoya à Idam un détachement comprenant Abu Qatada et Muhallim ibn Jaththama. Amir ibn al-Adbat al-Ashja'i les croisa et leur annonça la conversion à l'islam, mais Muhallim l'attaqua et le tua par vengeance, s'emparant de son chameau et de ses biens. Ibn Abi Hadrad rapporte que le verset 94 du Coran fut révélé à leur sujet. À Hunayn, Uyayna ibn Hisn et al-Aqra' ibn Habis se disputèrent le sang versé devant le Prophète jusqu'à ce que le prix du sang soit accepté. Le Prophète pria alors trois fois: « Ô Dieu, ne pardonne pas à Muhallim ! »"
  ur: "فتح مکہ سے پہلے نبی نے ایک دستہ ادم کی طرف بھیجا تھا جس کے آدمیوں میں ابو قتادہ اور محلم بن جثثمہ شامل تھے۔ امیر بن العدبۃ اشجعی ان کے پاس سے گزرے اور اسلام کا سلام پیش کیا، لیکن محلم نے پرانی رنجش پر حملہ کر کے اسے قتل کر دیا اور اس کا اونٹ اور سامان لے لیا۔ ابن ابی حدرد کہتے ہیں کہ ان کے بارے میں قرآن 4:94 نازل ہوا۔ حنین میں عیینہ بن حصین اور اقرع بن حابس نے رسول اللہ کے سامنے خون کا جھگڑا کیا یہاں تک کہ خون کی رقم قبول ہو گئی، اور نبی نے تین بار دعا کی: اے اللہ، محرم کو معاف نہ کرنا۔"
