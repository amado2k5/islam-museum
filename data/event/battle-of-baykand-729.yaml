summary:
  ar: "بطاقة أولية لمعركة بيكند سنة ٧٢٩م، قتال الأشرس السلمي والترك قرب بخارى في فتنة ما وراء النهر؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Baykand in 729, al-Ashras al-Sulami's fight with the Turks near Bukhara in the Transoxanian troubles; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Batalla de Baykand en 729, la lucha de al-Ashras al-Sulami contra los turcos cerca de Bujará en los disturbios de Transoxiana; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour la bataille de Baykand en 729, le combat d'al-Ashras al-Sulami contre les Turcs près de Boukhara lors des troubles transoxaniens; ses sources ne sont pas encore vérifiées sur la page."
  ur: "729 میں جنگ بای قند کے لیے ڈرافٹ کارڈ، الشراس السلمی کی بخارا کے قریب ترکوں کے ساتھ ٹرانسکسانی مشکلات میں لڑائی؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "729 yılında gerçekleşen Paykand Muharebesi'nin ön açıklaması; Transoksanya çatışması kapsamında Buhara yakınlarında Aşra el-Salmi ile Türkler arasındaki çatışmayı anlatmaktadır; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Paykand pada tahun 729 M, pertempuran antara Ashras al-Salmi dan Turki di dekat Bukhara dalam konflik Transoxiana; sumber-sumbernya belum ditinjau di halaman ini."
