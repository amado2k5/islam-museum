label: { ar: "نظام الأرزاق الشهرية لعمر", en: "Umar's Monthly Rations", es: "Las raciones mensuales de Umar", fr: "Rations mensuelles d'Umar", ur: "عمر کا ماہانہ راشن", tr: "Ömer için aylık yemek yardımı sistemi.", id: "Sistem tunjangan makanan bulanan untuk Omar" }
summary:
  ar: "أمر عمر بجريب من طعام فعجن ثم خبز ثم رد زيتاً فأكل منه ثلاثون رجلاً غداءهم ثم فعل بالعشي مثل ذلك فقال يكفي الرجل جريبان كل شهر فكان يرزق الناس الرجل والمرأة والمملوك جريبين كل شهر وكان الرجل يدعو على صاحبه فيقول رفع الله جريبيك أي قطعهما عنك بالموت فبقي ذلك في ألسن الناس وقال أبو الدرداء رب سنة راشدة مهدية قد منحها عمر في أمة محمد منها المديان والقسطان وصعد عمر المنبر والمود والقسط في يديه فقال إنا أجرينا عليكم أعطياتكم وأرزاقكم في كل شهر وقال سفيان بن وهب إني قد فرضت لكل نفس مسلمة في كل شهر مداً وقسط زيت وقسط خلاً فقال رجل والعبد قال نعم والعبد وفي العيال فرض عمر لعياله المقاتلة وذريتهم العشرات فأمضى عثمان ومن بعده ذلك وجعلوها موروثة يرثها ورثة الميت ممن ليس في العطاء حتى كان عمر بن عبد العزيز فسأل سليمان بن حبيب عن ذلك فأخبره فأنكر الوراثة وقال اقطعها وأعم بالفريضة فقال سليمان فإني أتخوف أن يستن بك من بعدك في قطع الوراثة ولا يستن بك عموم الفريضة قال صدقت وتركهم وكان عمر يفرض للمولود إذا ولد في عشرة فلما كان معاوية فرض ذلك للفطيم فلما كان عبد الملك قطع ذلك إلا عمن شاء وقال ابن عمر لم يكن عمر يفرض للمولود حتى يفطم فنادى مناديه لا تعجلوا أولادكم عن الفطام فإنا نفرض لكل مولود في الإسلام."
  en: "Umar had a jarib of food kneaded and baked and oiled — thirty men ate lunch from it, and the same at supper — 'two jaribs a month suffice a man', and so each man, woman and mamluk drew two jaribs monthly; a man would curse his fellow 'may God lift your two jaribs' — death cut them — 'and that is on tongues to this day'. Abu al-Darda' counted 'rightly-guided sunnas Umar granted the umma — among them the two mudds and the two qists'; on the minbar, mudd and qist in hand: 'we run your stipends and your rizq every month — for every Muslim soul each month a mudd, a qist of oil, a qist of vinegar' — 'and the slave?' — 'yes, and the slave'. For dependents he set the fighters' households and their descendants at tens; Uthman and his governors kept it and made it heritable to non-stipended heirs till Umar II, who heard Sulayman ibn Habib's account, disliked the inheritance — 'cut it and generalize the stipend' — 'I fear they will imitate your cutting and not your generalizing' — 'truly said', and he left them. The newborn drew ten; Mu'awiya deferred it to the weanling; Abd al-Malik cut it save whom he willed — and 'do not hasten weaning your children: we stipend every newborn in Islam'."
  es: "Umar tenía un jarib de comida amasada, horneada y aceitada —treinta hombres comían de él el almuerzo y lo mismo en la cena— «dos jaribs al mes bastan a un hombre», y así cada hombre, mujer y mameluco recibía dos jaribs mensualmente; un hombre maldecía a su compañero «que Dios te quite tus dos jaribs» — la muerte los cortó — «y eso está en boca de todos hasta el día de hoy». Abu al-Darda' contaba «sunas bien guiadas que Umar concedió a la umma — entre ellas los dos mudds y los dos qists»; en el minbar, mudd y qist en mano: «administramos vuestros estipendios y vuestro rizq cada mes — para cada alma musulmana cada mes un mudd, un qist de aceite, un qist de vinagre» — «¿y el esclavo?» — «sí, y el esclavo». Para los dependientes, fijó las familias de los combatientes y sus descendientes en diez; Uthman y sus gobernadores lo mantuvieron y lo hicieron heredable a los herederos sin estipendio hasta que Umar II, quien escuchó el relato de Sulayman ibn Habib, desaprobó la herencia: «Recortadla y generalizad el estipendio». «Temo que imiten vuestro recorte y no vuestra generalización». «En verdad lo dijiste», y los abandonó. El recién nacido recibía diez; Mu'awiya lo pospuso para el destetado; Abd al-Malik lo recortó salvo a quien él quisiera, y «no apresuréis el destete de vuestros hijos: en el Islam se otorga un estipendio a cada recién nacido»."
  fr: "Umar fit pétrir, cuire et huiler un jarib de nourriture – trente hommes en mangèrent à midi, et autant au souper – « deux jaribs par mois suffisent à un homme », et ainsi chaque homme, femme et mamelouk puisait deux jaribs mensuellement; un homme maudissait son prochain: « Que Dieu te retire tes deux jaribs ! » – la mort les frappait – « et cela se murmure encore aujourd'hui ». Abou al-Darda' compta les « sunnas bien guidées qu'Umar accorda à la umma – parmi lesquelles les deux mudds et les deux qists »; sur le minbar, mudd et qist à la main: « Nous versons vos allocations et votre rizq chaque mois – pour chaque musulman, chaque mois, un mudd, un qist d'huile, un qist de vinaigre » – « et l'esclave ? » – « oui, et l'esclave ». Pour les personnes à charge, il fixa à dix le nombre de familles des combattants et de leurs descendants. Uthman et ses gouverneurs conservèrent cet héritage et le rendirent héréditaire aux seuls héritiers non subventionnés jusqu'à ce qu'Umar II, ayant entendu le récit de Sulayman ibn Habib, désapprouve cet héritage: « Réduisez-le et généralisez la subvention ! » « Je crains qu'ils n'imitent votre réduction plutôt que votre généralisation », répondit-il, « c'est vrai », et il les quitta. Le nouveau-né recevait dix dollars; Mu'awiya reporta le versement à l'enfant sevré; Abd al-Malik le réduisit, sauf à qui il voulait, et dit: « Ne vous hâtez pas de sevrer vos enfants: en Islam, nous subventionnons chaque nouveau-né. »"
  ur: "عمر کے پاس گوندھا اور سینکا ہوا اور تیل لگا ہوا کھانا تھا - تیس آدمیوں نے اس سے دوپہر کا کھانا کھایا، اور اسی طرح رات کے کھانے میں - 'ایک مہینے میں دو جریب ایک آدمی کو کافی ہے'، اور اس طرح ہر ایک مرد، عورت اور مملوک ماہانہ دو جریب نکالتے تھے۔ ایک آدمی اپنے ساتھی پر لعنت بھیجتا ہے 'خدا تمہارے دونوں جریب اٹھائے' - موت نے انہیں کاٹ دیا - 'اور یہ آج تک زبانوں پر ہے'۔ ابو الدرداء نے 'صحیح ہدایت والی سنتوں کو عمر نے امت کو عطا کیا تھا - ان میں سے دو مٹی اور دو قستیاں'؛ منبر پر، مٹی اور کسٹ ہاتھ میں: 'ہم ہر ماہ آپ کا وظیفہ اور آپ کا رزق چلاتے ہیں - ہر مسلمان کے لیے ہر ماہ ایک مد، ایک قِسِٹ تیل، ایک قِسِٹ سرکہ' - 'اور غلام؟' - 'ہاں، اور غلام'۔ انحصار کرنے والوں کے لیے اس نے جنگجوؤں کے گھرانوں اور ان کی اولادوں کو دسیوں میں مقرر کیا۔ عثمان اور ان کے گورنروں نے اسے اپنے پاس رکھا اور اسے غیر وظیفہ دار وارثوں کے لیے وراثت میں دے دیا یہاں تک کہ عمر دوم، جنہوں نے سلیمان بن حبیب کا احوال سنا، وراثت کو ناپسند کیا - 'اسے کاٹ کر وظیفہ کو عام کر دیں' - 'مجھے ڈر ہے کہ وہ آپ کی کٹوتی کی نقل کریں گے نہ کہ آپ کے عام کرنے کی' - 'سچ کہا'، اور اس نے انہیں چھوڑ دیا۔ نوزائیدہ نے دس نکالا؛ معاویہ نے اسے دودھ چھڑانے تک موخر کر دیا۔ عبد المالک نے اسے کاٹ دیا سوائے اس کے جسے وہ چاہتا ہے - اور 'اپنے بچوں کا دودھ چھڑانے میں جلدی نہ کریں: ہم اسلام میں ہر نوزائیدہ کو وظیفہ دیتے ہیں'۔"
  tr: "Ömer, bir jariblik yemeğin yoğrulmasını, pişirilmesini ve üzerine yağ eklenmesini emretti. Otuz adam bundan öğle yemeği yedi. Akşam da aynısını yaptı ve \"Her ay bir adama iki jarib yeter\" dedi. Böylece her erkeğe, kadına ve köleye her ay iki jarib verdi. Adamlardan biri arkadaşına, \"Allah senin iki jaribini alsın\" yani \"Ölüm onları senden alsın\" diyerek lanet okurdu. Bu söz insanların dilinde kaldı. Ebu el-Darda şöyle dedi: \"Ömer, Muhammed ümmetinde birçok doğru ve ilahi rehberlik içeren uygulamayı yerleştirdi; bunlar arasında mudd ve qist de vardır.\" Ömer, elinde mudd ve qist ile minbere çıktı ve \"Sizin için her ayki geçim ve erzaklarınızı belirledik\" dedi. Sufyan ibn Vahb şöyle dedi: \"Her Müslüman için her ay bir mudd, bir qist yağ ve bir qist sirke ayırdım.\" Bir adam, \"Peki ya köle?\" diye sordu. Adam, \"Evet, köle.\" diye cevap verdi. Muhtaçlara gelince, Ömer, savaşçı muhafızları ve onların soyundan gelenler için onar tane ayırmıştı. Osman ve ondan sonra gelenler bunu desteklediler ve bunu, maaşa dahil olmayan ölenlerin mirasçılarına geçecek bir miras haline getirdiler. Bu, Ömer ibn Abdülaziz zamanına kadar devam etti. Ömer, Süleyman ibn Habib'e bu konuda sordu. Süleyman ona durumu anlattı ve Ömer, \"Bunu durdurun ve maaşı genel hale getirin\" diyerek mirası reddetti. Süleyman, \"Senden sonra gelenlerin bu konuda senin örneğini izlemesinden korkuyorum.\" dedi. Mirası kesti ve genel yükümlülüğü yerine getirmedi. \"Haklısınız,\" dedi ve onları terk etti. Ömer, onar tane doğan yeni doğanlar için de pay ayırırdı. Muaviye iktidardayken, bunu sütten kesilmiş çocuklar için ayırdı. Abdül Malik iktidardayken ise, dilediği kişiler hariç, bunu kesti. İbn Ömer şöyle dedi: “Ömer, yeni doğan bebek sütten kesilene kadar ona pay ayırmazdı. Bunun üzerine habercisi şöyle seslendi: ‘Çocuklarınızı sütten kesmekte acele etmeyin, çünkü İslam'da her yeni doğan bebeğe pay ayırırız.’”"
  id: "Umar memerintahkan agar satu jarib makanan diuleni, kemudian dipanggang, lalu ditambahkan minyak. Tiga puluh orang makan siang dari makanan itu. Ia melakukan hal yang sama di malam hari, seraya berkata, \"Dua jarib cukup untuk seorang pria setiap bulan.\" Maka, ia menyediakan dua jarib untuk setiap pria, wanita, dan budak setiap bulan. Seorang pria akan mengutuk temannya, seraya berkata, \"Semoga Allah mengambil dua jaribmu,\" yang berarti, \"Semoga kematian memisahkannya darimu.\" Ucapan ini tetap terucap di lidah orang-orang. Abu al-Darda' berkata, \"Banyak praktik yang benar dan dibimbing oleh Tuhan telah ditetapkan oleh Umar di kalangan umat Muhammad, termasuk mudd dan qist.\" Umar naik ke mimbar dengan mudd dan qist di tangannya dan berkata, \"Kami telah menetapkan tunjangan dan bekal kalian setiap bulan.\" Sufyan ibn Wahb berkata, \"Aku telah mengalokasikan untuk setiap Muslim setiap bulan satu mudd, satu qist minyak, dan satu qist cuka.\" Seorang pria bertanya, \"Dan budaknya?\" Ia menjawab, \"Ya, budaknya.\" Mengenai tanggungan, Umar mengalokasikan sepuluh bagian untuk tanggungan pejuangnya dan keturunan mereka. Utsman dan orang-orang setelahnya mempertahankan hal ini dan menjadikannya warisan, yang akan diteruskan kepada ahli waris orang yang meninggal yang tidak termasuk dalam tunjangan. Hal ini berlanjut hingga masa Umar bin Abd al-Aziz, yang bertanya kepada Sulaiman bin Habib tentang hal itu. Sulaiman memberitahunya, dan Umar menolak warisan tersebut, dengan mengatakan, \"Hentikan dan jadikan tunjangan itu umum.\" Sulaiman berkata, \"Aku khawatir orang-orang setelahmu akan mengikuti contohmu dalam hal ini.\" Dia menghentikan warisan tersebut dan tidak mengikuti kewajiban umum. Dia berkata, \"Engkau benar,\" dan dia meninggalkan mereka. Umar biasa mengalokasikan untuk bayi yang baru lahir jika ia lahir dalam sepuluh bagian. Ketika Muawiyah berkuasa, dia mengalokasikan itu untuk anak yang sudah disapih. Ketika Abdul Malik berkuasa, dia menghentikan itu kecuali untuk siapa pun yang dia inginkan. Ibnu Umar berkata, “Umar tidak memberikan alokasi untuk bayi yang baru lahir sampai ia disapih. Maka utusannya menyerukan, ‘Jangan terburu-buru menyapih anak-anak kalian, karena dalam Islam kami memberikan alokasi untuk setiap bayi yang baru lahir.’”"
