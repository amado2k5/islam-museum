label: { ar: "حصار العرب للقسطنطينية في خلافة معاوية", en: "The early Arab siege of Constantinople under Mu'awiya" }
summary:
  ar: "يعرض شكيب أرسلان في فصل «محاصرات العرب للقسطنطينية» الحصار الأول الذي ضربه المسلمون على المدينة. يذكر أن أسطولاً عربياً جُهّز سنة 653م في طرابلس الشام بقيادة بسر بن أبي أرطاة، وأن الجيش البري بدأ الحصار سنة 667م على ما يرجّحه، وأن الأسطول أقلع عن المدينة سنة 673م. ويذكر أن أبا أيوب الأنصاري توفي في الحصار، ويعرض اختلاف المؤرخين في سنة وفاته، ويناقش ما يُروى عن قبره، ويرد على موسوعة إسلامية في نسبة ذكره إلى ابن قتيبة. وفي الفصل أيضاً ذكر حصار هارون الرشيد للمدينة وما انتهى إليه من صلح ودفع للجزية. هذه صورة من رواية المؤلف عن مصادر متعددة، والتواريخ فيها مختلفة بين المصادر."
  en: "Arslan's chapter on Arab sieges of Constantinople describes the first large attempt, under Mu'awiya, when a fleet sailed from Tripoli in Syria under Busr ibn Abi Artat, and a land army is thought to have begun the siege. He reports disagreement among Arab historians over the death of Abu Ayyub al-Ansari during the siege, and doubts the later legend of his grave. The same chapter notes a later siege under Harun al-Rashid that ended in a truce and tribute. This is Arslan's compilation of sources that disagree on the dates."
wings: [place, people]
