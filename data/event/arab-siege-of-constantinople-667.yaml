# Verification: one source (Arslan's commentary, scan pages 231-233, book pp. 214-216). Arslan gives the fleet's date as 653 CE, the land siege as probably 667 CE and the fleet's withdrawal as 673 CE; these must be checked against Byzantine sources (Theophanes) and a modern study. The date of Abu Ayyub al-Ansari's death differs across sources in Arslan's own survey. The grave legend is discussed by Arslan with reference to Ibn Sa'd and must be checked. Do not use dates from this entry without two sources.
