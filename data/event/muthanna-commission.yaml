id: event/muthanna-commission
class: event
kind: other
label: { ar: "عهد أبي بكر للمثنى بن حارثة", en: "Abu Bakr's Commission to al-Muthanna ibn Haritha" }
summary:
  ar: "عند البلاذري: كان المثنى بن حارثة بن سلامة بن ضمضم الشيباني يغير على السواد في رجال من قومه فبلغ أبا بكر خبره فسأل عنه فقال له قيس بن عاصم بن سنان المنقري: هذا رجل غير خامل الذكر ولا مجهول النسب ولا ذليل العماد هذا المثنى بن حارثة الشيباني ثم إن المثنى قدم على أبي بكر فقال له يا خليفة رسول الله استعملني على من أسلم من قومي أقاتل هذه الأعاجم من أهل فارس فكتب له أبو بكر في ذلك عهداً فسار حتى نزل خفان ودعا قومه إلى الإسلام فأسلموا ثم إن أبا بكر كتب إلى خالد بن الوليد المخزومي يأمره بالمسير إلى العراق — ويقال بل وجّهه من المدينة — وكتب إلى المثنى يأمره بالسمع والطاعة له وتلقّيه."
  en: "In al-Baladhuri: al-Muthanna ibn Haritha ibn Salama ibn Damdam al-Shaybani raided the Sawad with men of his people; news reached Abu Bakr who asked about him, and Qays ibn Asim ibn Sinan al-Minqari said 'a man neither of hidden fame nor unknown lineage nor weak support — this is al-Muthanna ibn Haritha al-Shaybani.' Then al-Muthanna came to Abu Bakr saying 'O caliph of God's messenger, employ me over those of my people who have Islamized to fight these Persians'; Abu Bakr wrote him a patent for it, and he went to Khaffan, called his people to Islam and they Islamized. Then Abu Bakr wrote Khalid ibn al-Walid al-Makhzumi ordering him to march to Iraq — it is said he dispatched him from Medina — and wrote al-Muthanna ordering his hearing, obeying and supporting him."
