id: event/muthanna-commission
class: event
kind: other
label: { ar: "عهد أبي بكر للمثنى بن حارثة", en: "Abu Bakr's Commission to al-Muthanna ibn Haritha", es: "La comisión de Abu Bakr a al-Muthanna ibn Haritha", fr: "Commission d'Abou Bakr à al-Muthanna ibn Haritha", ur: "ابوبکر کا المثنیٰ ابن حارثہ کو کمیشن" }
summary:
  ar: "عند البلاذري: كان المثنى بن حارثة بن سلامة بن ضمضم الشيباني يغير على السواد في رجال من قومه فبلغ أبا بكر خبره فسأل عنه فقال له قيس بن عاصم بن سنان المنقري: هذا رجل غير خامل الذكر ولا مجهول النسب ولا ذليل العماد هذا المثنى بن حارثة الشيباني ثم إن المثنى قدم على أبي بكر فقال له يا خليفة رسول الله استعملني على من أسلم من قومي أقاتل هذه الأعاجم من أهل فارس فكتب له أبو بكر في ذلك عهداً فسار حتى نزل خفان ودعا قومه إلى الإسلام فأسلموا ثم إن أبا بكر كتب إلى خالد بن الوليد المخزومي يأمره بالمسير إلى العراق — ويقال بل وجّهه من المدينة — وكتب إلى المثنى يأمره بالسمع والطاعة له وتلقّيه."
  en: "In al-Baladhuri: al-Muthanna ibn Haritha ibn Salama ibn Damdam al-Shaybani raided the Sawad with men of his people; news reached Abu Bakr who asked about him, and Qays ibn Asim ibn Sinan al-Minqari said 'a man neither of hidden fame nor unknown lineage nor weak support — this is al-Muthanna ibn Haritha al-Shaybani.' Then al-Muthanna came to Abu Bakr saying 'O caliph of God's messenger, employ me over those of my people who have Islamized to fight these Persians'; Abu Bakr wrote him a patent for it, and he went to Khaffan, called his people to Islam and they Islamized. Then Abu Bakr wrote Khalid ibn al-Walid al-Makhzumi ordering him to march to Iraq — it is said he dispatched him from Medina — and wrote al-Muthanna ordering his hearing, obeying and supporting him."
  es: "En al-Baladhuri: al-Muthanna ibn Haritha ibn Salama ibn Damdam al-Shaybani asaltó Sawad con hombres de su pueblo; la noticia llegó a Abu Bakr, quien preguntó por él, y Qays ibn Asim ibn Sinan al-Minqari dijo: «Un hombre sin fama oculta, linaje desconocido ni apoyo débil: este es al-Muthanna ibn Haritha al-Shaybani». Entonces al-Muthanna fue a Abu Bakr diciendo: «¡Oh califa del mensajero de Dios, úsame para dirigir a aquellos de mi pueblo que se han islamizado para luchar contra estos persas!». Abu Bakr le escribió una patente para ello, y él fue a Khaffan, llamó a su pueblo al Islam y se islamizaron. Luego Abu Bakr escribió a Khalid ibn al-Walid al-Makhzumi ordenándole que marchara a Irak —se dice que lo envió desde Medina— y escribió a al-Muthanna ordenándole que lo escuchara, obedeciera y apoyara."
  fr: "Dans al-Baladhuri: al-Muthanna ibn Haritha ibn Salama ibn Damdam al-Shaybani mena une attaque contre le Sawad avec des hommes de son peuple. La nouvelle parvint à Abu Bakr, qui s'enquit de lui. Qays ibn Asim ibn Sinan al-Minqari déclara: « Un homme dont la renommée n'est pas cachée, la lignée inconnue et le soutien faible: il s'agit d'al-Muthanna ibn Haritha al-Shaybani. » Al-Muthanna se rendit alors auprès d'Abu Bakr et dit: « Ô calife du Messager de Dieu, chargez-moi de commander ceux de mon peuple qui se sont convertis à l'islam pour combattre ces Perses. » Abu Bakr lui remit une patente à cet effet, et il se rendit à Khaffan, appela son peuple à l'islam, et ils se convertirent. Abu Bakr écrivit ensuite à Khalid ibn al-Walid al-Makhzumi pour lui ordonner de marcher vers l'Irak – on dit qu'il l'envoya de Médine – et écrivit à al-Muthanna pour lui ordonner de l'écouter, de lui obéir et de le soutenir."
  ur: "البلاذری میں ہے: المثنیٰ بن حارثہ بن سلمہ ابن دمدم الشیبانی نے اپنی قوم کے آدمیوں کے ساتھ سواد پر چھاپہ مارا۔ ابوبکر تک خبر پہنچی جس نے ان کے بارے میں پوچھا تو قیس بن عاصم بن سنان المنقری نے کہا کہ 'ایک آدمی نہ چھپی ہوئی شہرت کا، نہ نامعلوم نسب کا اور نہ ہی کمزور حمایت - یہ المثنیٰ بن حارثہ الشیبانی ہے۔' پھر المثنیٰ ابوبکر کے پاس آیا کہ اے خدا کے رسول کے خلیفہ، مجھے میری قوم کے ان لوگوں پر مقرر کر دو جنہوں نے ان فارسیوں سے لڑنے کے لیے اسلام قبول کیا ہے۔ ابوبکر نے اسے اس کا پیٹنٹ لکھا، اور وہ خفان گئے، اپنی قوم کو اسلام کی دعوت دی اور انہوں نے اسلام قبول کیا۔ پھر ابوبکر نے خالد بن الولید المخزومی کو لکھا کہ اسے عراق کی طرف کوچ کرنے کا حکم دیا گیا - کہا جاتا ہے کہ اس نے اسے مدینہ سے روانہ کیا - اور المطنا کو اس کی سماعت، اطاعت اور حمایت کا حکم دیتے ہوئے لکھا۔"
