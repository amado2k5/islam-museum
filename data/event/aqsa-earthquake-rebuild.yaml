summary:
  ar: "زلزلة وقعت في دولة بني العباس طرحت مغطّى المسجد الأقصى إلا ما حول المحراب؛ فلما بلغ الخليفة خبره قيل له إن بيت مال المسلمين لا يفي بردّه إلى ما كان فكتب إلى أمراء الأطراف وسائر القواد أن يبني كل واحد منهم رواقاً، فبنوه أوثق وأغلظ صناعة مما كان وبقيت تلك القطعة شامة فيه إلى أعمدة الرخام، وأحدث عبد الله بن طاهر فيه أروقة على أعمدة رخام {cite:ahsan-al-taqasim p. 143}."
  en: "The Abbasid-era earthquake that felled the Aqsa's roofed part save the mihrab: when the treasury pleaded it could not restore it as before, the caliph ordered each provincial amir and commander to rebuild one arcade — raising it stronger and thicker, the repair still legible as a 'seam' in al-Muqaddasi's day — and Abdallah ibn Tahir added marble arcades {cite:ahsan-al-taqasim p. 143}."
