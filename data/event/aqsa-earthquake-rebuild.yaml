id: event/aqsa-earthquake-rebuild
class: event
kind: disaster-relief
label: { ar: "زلزلة المسجد الأقصى وإعمارته في الدولة العباسية", en: "The Aqsa Mosque earthquake and its rebuilding under the Abbasids", es: "El terremoto de la mezquita de Al-Aqsa y su reconstrucción bajo el mandato de los abasíes.", fr: "Le tremblement de terre de la mosquée Al-Aqsa et sa reconstruction sous les Abbassides", ur: "مسجد اقصیٰ کا زلزلہ اور عباسیوں کے دور میں اس کی تعمیر نو" }
summary:
  ar: "زلزلة وقعت في دولة بني العباس طرحت مغطّى المسجد الأقصى إلا ما حول المحراب؛ فلما بلغ الخليفة خبره قيل له إن بيت مال المسلمين لا يفي بردّه إلى ما كان فكتب إلى أمراء الأطراف وسائر القواد أن يبني كل واحد منهم رواقاً، فبنوه أوثق وأغلظ صناعة مما كان وبقيت تلك القطعة شامة فيه إلى أعمدة الرخام، وأحدث عبد الله بن طاهر فيه أروقة على أعمدة رخام {cite:ahsan-al-taqasim p. 143}."
  en: "The Abbasid-era earthquake that felled the Aqsa's roofed part save the mihrab: when the treasury pleaded it could not restore it as before, the caliph ordered each provincial amir and commander to rebuild one arcade — raising it stronger and thicker, the repair still legible as a 'seam' in al-Muqaddasi's day — and Abdallah ibn Tahir added marble arcades {cite:ahsan-al-taqasim p. 143}."
  es: "El terremoto de la era abasí que derribó la parte techada de Aqsa, excepto el mihrab: cuando el tesoro alegó que no podía restaurarlo como antes, el califa ordenó a cada emir y comandante provincial que reconstruyera una arcada, levantándola más fuerte y gruesa, la reparación aún legible como una 'costura' en la época de al-Muqaddasi, y Abdallah ibn Tahir añadió arcadas de mármol {cite:ahsan-al-taqasim p. 143}."
  fr: "Le tremblement de terre de l'époque abbasside qui a détruit la partie couverte de la mosquée Aqsa, à l'exception du mihrab: lorsque le trésor a plaidé qu'il ne pouvait pas la restaurer comme avant, le calife a ordonné à chaque émir et commandant provincial de reconstruire une arcade — la surélevant plus solide et plus épaisse, la réparation étant encore lisible comme une « couture » à l'époque d'al-Muqaddasi — et Abdallah ibn Tahir a ajouté des arcades en marbre {cite:ahsan-al-taqasim p. 143}."
  ur: "عباسی دور کا زلزلہ جس نے محراب کو چھوڑ کر اقصیٰ کے چھت والے حصے کو گرا دیا: جب خزانے نے درخواست کی کہ وہ اسے پہلے کی طرح بحال نہیں کرسکا، تو خلیفہ نے ہر صوبائی امیر اور کمانڈر کو ایک ایک آرکیڈ تعمیر کرنے کا حکم دیا - اسے مزید مضبوط اور موٹا کرتے ہوئے، مرمت اب بھی ایک 'سیمن' کے طور پر قابل قبول ہے - اور تقدیر الصیغۃ المسلم میں اضافہ کیا گیا۔ ماربل آرکیڈز {حوالہ: احسن التقاسم ص۔ 143}۔"
