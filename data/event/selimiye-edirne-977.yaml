label: { ar: "سنان يبني جامع السليمية بأدرنة", en: "Sinan builds the Selimiye Mosque at Edirne", ur: "معمار سنان کی ادرنہ میں سلیمیہ مسجد کی تعمیر" }
summary:
  ar: "بنى المعمار سنان جامع السليمية بأدرنة في الأعوام 1569-1575م للسلطان سليم الثاني الذي توفي قبل سنة من إتمامه، وعدّه سنان نفسه ذروة أعماله متفوقاً حتى على السليمانية بإستانبول {cite:freely-ottoman-architecture-2011 p. 73}. وقبته الكبرى أعلى من قبة آيا صوفيا بستة أذرع {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}."
  en: "The architect Sinan built the Selimiye mosque complex at Edirne in 1569-75 for Selim II, who died the year before it was completed; Sinan himself considered it the crowning achievement of his career, surpassing even the Süleymaniye in Istanbul {cite:freely-ottoman-architecture-2011 p. 73}. Its great dome stands six cubits higher than that of Ayasofya {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}."
  ur: "معمار سنان نے 1569-75ء میں سلیم ثانی کے لیے ادرنہ میں سلیمیہ مسجد بنائی جو اتمام سے ایک سال پہلے وفات پا گیا؛ سنان نے اسے اپنے فن کی عروج سمجھا یہاں تک کہ استنبول کی سلیمانیہ سے بھی افزیل {cite:freely-ottoman-architecture-2011 p. 73}۔ اس کا عظیم گنبد آیا صوفیا سے چھ ذرع بلند ہے {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}۔"
