summary:
  ar: "في سنة ثمان وتسعين استوحش قبجق المنصوري نائب الشام وبكتمري السلحدار وغيرهما من فعائل منكوتمر وخافوا أن يبطش بهم وبلغهم دخول ملك التتار في الإسلام فأجمعوا على المسير إليه من حمص، فلم يلبثوا أن جاء الخبر بقتل السلطان لاجين ونائبه منكوتمر على يد كرجي الأشرفي ومن قام معه: هجم عليه كرجي في ستة أنفس وهو يلعب بالشطرنج بعد العشاء، وشهد القاضي حسام الدين الحنفي سبعة أسياف تنزل عليه، ثم قُبض على نائبه فذُبح من الغد، ونودي للملك الناصر وأُحضر من الكرك فاستناب سلاراً في المملكة ثم قُتل طغجي وكرجي الأشرفيان، وركب الملك الناصر بخلعة الخليفة وتقليده وقدم الأفرم على نيابة دمشق في جمادى الأولى {cite:shadharat-dhahab p. 769-770}."
  en: "In 698 Qabjaq al-Mansuri, governor of Syria, Baktamur al-Silahdar and others of Mankutimur's faction grew uneasy, fearing that Mankutimur would strike at them. News had reached them of the Tatar ruler's conversion to Islam, so they resolved to march to him from Homs. Before long word came that Sultan Lajin and his deputy Mankutimur had been killed at the hands of Karaji al-Ashrafi and those who stood with him. Karaji had fallen upon Lajin with six men while he was playing chess after the evening prayer, and the Hanafi judge Husam al-Din witnessed seven swords come down on him. His deputy was then seized and executed the next day. Al-Malik al-Nasir was proclaimed and brought from al-Karak; he appointed Salar as deputy of the realm, and then Tughji and Karaji, the two Ashrafis, were killed. Al-Nasir rode out in the Caliph's robe of honour and investiture, and al-Afram was advanced to the governorship of Damascus in Jumada I {cite:shadharat-dhahab p. 769-770}."
