label: { ar: "قتل لاجين وعودة الملك الناصر سنة 698هـ", en: "Lajin murdered; al-Nasir restored, 698", es: "Lajín asesinado; al-Nasir restaurado, 698", fr: "Lajin assassiné; al-Nasir restauré, 698", ur: "لاجن قتل؛ الناصر بحال، 698" }
summary:
  ar: "في سنة ثمان وتسعين استوحش قبجق المنصوري نائب الشام وبكتمري السلحدار وغيرهما من فعائل منكوتمر وخافوا أن يبطش بهم وبلغهم دخول ملك التتار في الإسلام فأجمعوا على المسير إليه من حمص، فلم يلبثوا أن جاء الخبر بقتل السلطان لاجين ونائبه منكوتمر على يد كرجي الأشرفي ومن قام معه: هجم عليه كرجي في ستة أنفس وهو يلعب بالشطرنج بعد العشاء، وشهد القاضي حسام الدين الحنفي سبعة أسياف تنزل عليه، ثم قُبض على نائبه فذُبح من الغد، ونودي للملك الناصر وأُحضر من الكرك فاستناب سلاراً في المملكة ثم قُتل طغجي وكرجي الأشرفيان، وركب الملك الناصر بخلعة الخليفة وتقليده وقدم الأفرم على نيابة دمشق في جمادى الأولى {cite:shadharat-dhahab p. 769-770}."
  en: "In 698 Qabjaq al-Mansuri, governor of Syria, Baktamur al-Silahdar and others of Mankutimur's faction grew uneasy, fearing that Mankutimur would strike at them. News had reached them of the Tatar ruler's conversion to Islam, so they resolved to march to him from Homs. Before long word came that Sultan Lajin and his deputy Mankutimur had been killed at the hands of Karaji al-Ashrafi and those who stood with him. Karaji had fallen upon Lajin with six men while he was playing chess after the evening prayer, and the Hanafi judge Husam al-Din witnessed seven swords come down on him. His deputy was then seized and executed the next day. Al-Malik al-Nasir was proclaimed and brought from al-Karak; he appointed Salar as deputy of the realm, and then Tughji and Karaji, the two Ashrafis, were killed. Al-Nasir rode out in the Caliph's robe of honour and investiture, and al-Afram was advanced to the governorship of Damascus in Jumada I {cite:shadharat-dhahab p. 769-770}."
  es: "En 698, Qabjaq al-Mansuri, gobernador de Siria, Baktamur al-Silahdar y otros miembros de la facción de Mankutimur se inquietaron, temiendo que Mankutimur los atacara. Les llegó la noticia de la conversión del gobernante tártaro al islam, por lo que decidieron marchar hacia él desde Homs. Poco después, se supo que el sultán Lajin y su lugarteniente Mankutimur habían sido asesinados por Karaji al-Ashrafi y sus aliados. Karaji atacó a Lajin con seis hombres mientras jugaba al ajedrez después de la oración vespertina, y el juez hanafí Husam al-Din presenció cómo siete espadas caían sobre él. Su lugarteniente fue apresado y ejecutado al día siguiente. Al-Malik al-Nasir fue proclamado y traído de al-Karak; nombró a Salar como lugarteniente del reino, y entonces Tughji y Karaji, los dos ashrafíes, fueron asesinados. Al-Nasir salió ataviado con la túnica de honor e investidura del califa, y al-Afram fue ascendido al cargo de gobernador de Damasco en Jumada I {cite:shadharat-dhahab p. 769-770}."
  fr: "En 698, Qabjaq al-Mansuri, gouverneur de Syrie, Baktamur al-Silahdar et d'autres membres de la faction de Mankutimur s'inquiétèrent, craignant une attaque de ce dernier. Ayant appris la conversion du souverain tatar à l'islam, ils décidèrent de marcher sur lui depuis Homs. Peu après, la nouvelle parvint que le sultan Lajin et son lieutenant Mankutimur avaient été tués par Karaji al-Ashrafi et ses partisans. Karaji avait attaqué Lajin avec six hommes alors qu'il jouait aux échecs après la prière du soir, et le juge hanafite Husam al-Din fut témoin de la scène. Son lieutenant fut capturé et exécuté le lendemain. Al-Malik al-Nasir fut proclamé et amené d'al-Karak; il nomma Salar lieutenant du royaume, puis Tughji et Karaji, les deux Ashrafi, furent tués. Al-Nasir sortit vêtu de la robe d'honneur et d'investiture du calife, et al-Afram fut promu gouverneur de Damas en Jumada I {cite:shadharat-dhahab p. 769-770}."
  ur: "698 میں قبجاق المنصوری، شام کے گورنر، بکطامور السلاہدر اور منکوتیمور کے دھڑے کے دیگر افراد اس خوف سے بے چین ہو گئے کہ منکوتیمور ان پر حملہ کر دے گا۔ تاتاری حکمران کے اسلام قبول کرنے کی خبر ان تک پہنچی، اس لیے انہوں نے حمص سے اس کی طرف کوچ کرنے کا عزم کیا۔ اس سے پہلے کہ یہ بات آتی کہ سلطان لاجین اور اس کا نائب منکوتیمور کراجی الاشرفی اور اس کے ساتھ کھڑے لوگوں کے ہاتھوں مارا گیا ہے۔ کاراجی چھ آدمیوں کے ساتھ لاجن پر اس وقت گرا تھا جب وہ شام کی نماز کے بعد شطرنج کھیل رہا تھا اور حنفی جج حسام الدین نے اس پر سات تلواریں اترتی دیکھی تھیں۔ اس کے بعد اس کے نائب کو پکڑ لیا گیا اور اگلے دن اسے پھانسی دے دی گئی۔ المالک النصیر کا اعلان کیا گیا اور الکرک سے لایا گیا۔ اس نے سالار کو سلطنت کا نائب مقرر کیا، اور پھر تغجی اور کراجی، دو اشرفیاں مارے گئے۔ النصیر خلیفہ کے اعزاز اور سرمایہ کاری کے لباس میں سوار ہوا، اور الافرام کو جمعہ اول میں دمشق کی گورنری تک پہنچایا گیا۔ 769-770}۔"
