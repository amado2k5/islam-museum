summary:
  ar: "في سنة ثمان وتسعين استوحش قبجق المنصوري نائب الشام وبكتمري السلحدار وغيرهما من فعائل منكوتمر وخافوا أن يبطش بهم وبلغهم دخول ملك التتار في الإسلام فأجمعوا على المسير إليه من حمص، فلم يلبثوا أن جاء الخبر بقتل السلطان لاجين ونائبه منكوتمر على يد كرجي الأشرفي ومن قام معه: هجم عليه كرجي في ستة أنفس وهو يلعب بالشطرنج بعد العشاء، وشهد القاضي حسام الدين الحنفي سبعة أسياف تنزل عليه، ثم قُبض على نائبه فذُبح من الغد، ونودي للملك الناصر وأُحضر من الكرك فاستناب سلاراً في المملكة ثم قُتل طغجي وكرجي الأشرفيان، وركب الملك الناصر بخلعة الخليفة وتقليده وقدم الأفرم على نيابة دمشق في جمادى الأولى {cite:shadharat-dhahab p. 769-770}."
