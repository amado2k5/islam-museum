id: event/angels-would-visit-your-houses
kind: other
label:
  ar: لولا ذنوبكم لزارتكم الملائكة في بيوتكم
  en: Were it not for your sins the angels would visit you in your houses
  ur: اگر تمہارے گناہ نہ ہوتے تو ملائکہ تمہارے گھروں میں آتے
summary:
  ar: 'قال الله في الحديث القدسي عن دعوة المظلوم: وعزتي لأنصرنك ولو بعد حين، ولو أنكم تكونون إذا خرجتم من عندي كنتم على حالكم ذلك لزارتكم الملائكة في بيوتكم ولو لم تذنبوا لجاء الله بخلق جديد كي يذنبوا فيغفر لهم {cite:jami-al-tirmidhi} [[passage/tirmidhi-2526|الترمذي 2526]].'
  en: 'God said in the hadith qudsi on the prayer of the wronged: by My might I will surely aid you even after a while; and had you remained in that state of yours when you left Me, the angels would have visited you in your houses; had you not sinned Allah would have brought a new creation to sin so that He could forgive them {cite:jami-al-tirmidhi} [[passage/tirmidhi-2526|Tirmidhi 2526]].'
  ur: 'اللہ نے مظلوم کی دعا کے بارے میں حدیث قدسی میں کہا: میری عزت کی قسم میں تمہاری مدد ضرور کروں گا چاہے دیر سے ہو؛ اور اگر تم یہ حالت برقرار رکھتے جب میں سے نکلتے تو ملائکہ تمہارے گھروں میں آتے؛ اور اگر تم گناہ نہ کرتے تو اللہ ایک نئی مخلوق لاتا جو گناہ کرے تاکہ وہ اسے بخش دے {cite:jami-al-tirmidhi} [[passage/tirmidhi-2526|ترمذی 2526]]۔'
