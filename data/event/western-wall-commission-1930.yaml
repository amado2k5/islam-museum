label:
  ar: لجنة حائط البراق الدولية (1930)
  en: League of Nations commission on the Western Wall (1930)
summary:
  ar: "لجنة شكّلها مجلس عصبة الأمم بقرار في 14 يناير 1930م بعد اضطرابات آب 1929م حول الحائط الغربي للحرم الشريف، لتسوية حقوق المسلمين واليهود فيه؛ ضمت ثلاثة أعضاء من غير البريطانيين رأسهم وزير الخارجية السويدي السابق إلياس لوفغرن. عملت في القدس من حزيران إلى تموز 1930م، وأصدرت قرارها في كانون الأول 1930م بإجماع أعضائها: الحائط جزء من ساحة الحرم، وملكيته للمسلمين وحدهم بوصفه وقفا، وتُحفظ الحالة الراهنة في الصلاة اليهودية عنده. يعرض كتاب عمارة نص التقرير كما نشرته الدراسة {cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar p. 66-70}، ويقرؤه الكتاب شهادة على حق الوقف الإسلامي في الحائط، وهي قراءة الكتاب نفسه {cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar p. 66}."
  en: "A commission set up by the League of Nations Council on 14 January 1930 after the August 1929 disturbances over the Western Wall of the Haram al-Sharif, to settle Muslim and Jewish claims there; three non-British members led by former Swedish foreign minister Eliel Lofgren. It sat in Jerusalem in June and July 1930 and its unanimous decision of December 1930 held the wall part of the Haram and Muslim waqf property, and kept the status quo for Jewish worship there. Imara's book reprints the report and reads it as proof of Muslim ownership; the reading is the book's own."
