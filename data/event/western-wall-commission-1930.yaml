label:
  ar: لجنة حائط البراق الدولية (1930)
  en: League of Nations commission on the Western Wall (1930)
  es: "Comisión de la Sociedad de Naciones sobre el Muro de las Lamentaciones (1930)"
  fr: "Commission de la Société des Nations sur le Mur occidental (1930)"
summary:
  ar: "لجنة شكّلها مجلس عصبة الأمم بقرار في 14 يناير 1930م بعد اضطرابات آب 1929م حول الحائط الغربي للحرم الشريف، لتسوية حقوق المسلمين واليهود فيه؛ ضمت ثلاثة أعضاء من غير البريطانيين رأسهم وزير الخارجية السويدي السابق إلياس لوفغرن. عملت في القدس من حزيران إلى تموز 1930م، وأصدرت قرارها في كانون الأول 1930م بإجماع أعضائها: الحائط جزء من ساحة الحرم، وملكيته للمسلمين وحدهم بوصفه وقفا، وتُحفظ الحالة الراهنة في الصلاة اليهودية عنده. يعرض كتاب عمارة نص التقرير كما نشرته الدراسة {cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar p. 66-70}، ويقرؤه الكتاب شهادة على حق الوقف الإسلامي في الحائط، وهي قراءة الكتاب نفسه {cite:al-quds-bayn-al-yahudiyya-wal-islam-azhar p. 66}."
  en: "A commission set up by the League of Nations Council on 14 January 1930 after the August 1929 disturbances over the Western Wall of the Haram al-Sharif, to settle Muslim and Jewish claims there; three non-British members led by former Swedish foreign minister Eliel Lofgren. It sat in Jerusalem in June and July 1930 and its unanimous decision of December 1930 held the wall part of the Haram and Muslim waqf property, and kept the status quo for Jewish worship there. Imara's book reprints the report and reads it as proof of Muslim ownership; the reading is the book's own."
  es: "Una comisión creada por el Consejo de la Sociedad de Naciones el 14 de enero de 1930, tras los disturbios de agosto de 1929 por el Muro de las Lamentaciones del Haram al-Sharif, para dirimir las reclamaciones musulmanas y judías sobre el lugar; integrada por tres miembros no británicos, encabezados por el exministro de Asuntos Exteriores sueco Eliel Lofgren. La comisión sesionó en Jerusalén en junio y julio de 1930 y su decisión unánime de diciembre de 1930 sostuvo que el muro formaba parte del Haram y de la propiedad del waqf musulmán, manteniendo el statu quo para el culto judío en el lugar. El libro de Imara reproduce el informe y lo interpreta como prueba de la propiedad musulmana; la interpretación es propia del libro."
  fr: "Une commission fut créée par le Conseil de la Société des Nations le 14 janvier 1930, suite aux troubles d'août 1929 concernant le Mur occidental du Haram al-Sharif, afin de régler les revendications musulmanes et juives sur ce lieu. Composée de trois membres non britanniques et présidée par l'ancien ministre suédois des Affaires étrangères, Eliel Löfgren, elle siégea à Jérusalem en juin et juillet 1930. Sa décision unanime de décembre 1930 confirmait que le Mur faisait partie du Haram et constituait un bien waqf musulman, et maintenait le statu quo concernant le culte juif. L'ouvrage d'Imara reproduit ce rapport et l'interprète comme une preuve de la propriété musulmane; cette interprétation est propre à l'auteur."
