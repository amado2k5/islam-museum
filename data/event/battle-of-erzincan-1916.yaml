summary:
  ar: "بطاقة أولية لمعركة أرزنجان سنة ١٩١٦م، هزيمة الجيش العثماني الثالث أمام الروس في حملة القوقاز؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Erzincan in 1916, the Ottoman Third Army's defeat by Russia in the Caucasus campaign; its sources are not yet checked on the page."
  es: "Boceto de ficha para la batalla de Erzincan en 1916, la derrota del Tercer Ejército otomano a manos de Rusia en la campaña del Cáucaso; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de campagne pour la bataille d'Erzincan en 1916, la défaite de la Troisième armée ottomane face à la Russie lors de la campagne du Caucase; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1916 میں ایرزنکن کی جنگ کے لیے ڈرافٹ کارڈ، قفقاز مہم میں روس کے ہاتھوں عثمانی تیسری فوج کی شکست؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1916 yılında gerçekleşen Erzincan Muharebesi'nin (Kafkasya Seferi'nde Osmanlı Üçüncü Ordusu'nun Ruslar tarafından yenilgiye uğratılması) ön raporu; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Erzincan pada tahun 1916 M, kekalahan Tentara Ottoman Ketiga oleh Rusia dalam Kampanye Kaukasus; sumber-sumbernya belum ditinjau di halaman ini."
