id: event/al-hadi-and-abu-al-atahiya-meet-between-the-armies-and-pledge-288
class: event
label:
  ar: "لقاء الهادي وأبي العتاهية بين العسكرين وبيعة أبي العتاهية ودخول صنعاء، محرم 288هـ"
  en: "Al-Hadi and Abu al-Atahiya meet between the armies, the pledge and the entry into Sana'a, Muharram 288 AH"
  ur: "ہادی اور ابو العتاہیہ کی دونوں لشکروں کے بیچ ملاقات، بیعت اور صنعاء میں داخلہ، محرم 288ھ"
summary:
  ar: "يرسل أبو العتاهية إلى الهادي أن يلقاه في عشرة فرسان، فيخرج الهادي في ثلاثين، ويترجل أبو العتاهية وقد رمى رمحه وكشف رأسه فيعانقه الهادي، ثم يبايعه على الحق والأمر بالمعروف والنهي عن المنكر، ويبايع محمد بن أبي عباد وأصحابه ويحلف معظم العسكر، ويتصل العسكران ويصلي الهادي العصر على غيل حدقان، ثم يدخل صنعاء ليلة الجمعة في سبع ليال بقين من المحرم."
  en: "Abu al-Atahiya sends asking to meet al-Hadi with ten horsemen; al-Hadi goes out with thirty; Abu al-Atahiya throws down his spear, bares his head and dismounts, and the two embrace; he then swears to stand with al-Hadi for the truth and for commanding the good and forbidding the wrong, Muhammad ibn Abi Abbad and his men pledge, most of his army swears, the armies mingle and al-Hadi prays the afternoon prayer at the spring of Hadaqan, and he enters Sana'a on the night of Friday, seven nights from the end of Muharram."
  ur: "ابو العتاہیہ ہادی کو پیغام بھیجتے ہیں کہ دس سواروں کے ساتھ ملیں؛ ہادی تیس کے ساتھ نکلتے ہیں؛ ابو العتاہیہ نیزہ پھینک کر، سر کھول کر اتر پڑتے ہیں اور دونوں گلے ملتے ہیں؛ پھر وہ حق کے ساتھ کھڑے رہنے، نیکی کا حکم دینے اور برائی سے روکنے پر بیعت کرتے ہیں، محمد بن ابی عباد اور ان کے ساتھی بیعت کرتے ہیں، لشکر کا بڑا حصہ حلف اٹھاتا ہے، دونوں لشکر مل جاتے ہیں، ہادی حدقان کے چشمے پر عصر پڑھتے ہیں اور محرم کے آخر سے سات راتیں رہتے جمعہ کی رات صنعاء میں داخل ہوتے ہیں۔"
