summary:
  ar: "في سنة إحدى وستين بايع المعتمد بولاية العهد بعده لابنه المفوض إلى الله جعفر ثم من بعده لأخيه الموفق طلحة، وولى ولده المغرب والشام والجزيرة وأرمينية وولى أخاه المشرق والعراق وبغداد والحجاز واليمن وفارس وأصبهان والري وخراسان وطبرستان وسجستان والسند، وعقد لكل منهما لواءين أبيض وأسود وشرط إن حدث به حدث أن الأمر لأخيه إن لم يكن ابنه جعفر قد بلغ وكتب العهد ونفذه مع قاضي القضاة ابن أبي الشوارب ليعلقه في الكعبة {cite:tarikh-khulafa-minhaj-1434 p. 565}."
  en: "In 261 al-Mu'tamid took bay'a for the succession after him to his son Ja'far 'al-Mufawwid ila'llah', then to his brother al-Muwaffaq Talha — the son assigned Maghreb, Syria, Jazira and Armenia; the brother the East, Iraq, Baghdad, Hijaz, Yemen, Fars, Isfahan, Rayy, Khurasan, Tabaristan, Sijistan and Sind. Each got two banners, white and black; the deed stipulated the brother takes the matter if the son be under age — written and dispatched with qadi Ibn Abi al-Shawarib to hang in the Ka'ba {cite:tarikh-khulafa-minhaj-1434 p. 565}."
  es: "En 261, al-Mu'tamid tomó juramento de sucesión para su hijo Ja'far 'al-Mufawwid ila'llah', y luego para su hermano al-Muwaffaq Talha. Al hijo se le asignaron el Magreb, Siria, Jazira y Armenia; al hermano, el Este, Irak, Bagdad, Hiyaz, Yemen, Fars, Isfahán, Rayy, Jorasán, Tabaristán, Sijistán y Sind. Cada uno recibió dos estandartes, uno blanco y otro negro. El documento estipulaba que el hermano se haría cargo del asunto si el hijo era menor de edad. El documento fue escrito y enviado con el cadí Ibn Abi al-Shawarib para ser colgado en la Kaaba {cite:tarikh-khulafa-minhaj-1434 p. 565}."
  fr: "En 261, al-Mu'tamid prêta allégeance à son fils Ja'far al-Mufawwid ila'llah, puis à son frère al-Muwaffaq Talha. Le fils reçut le Maghreb, la Syrie, la Jazira et l'Arménie; le frère, l'Orient, l'Irak, Bagdad, le Hedjaz, le Yémen, le Fars, Ispahan, Rayy, le Khorasan, le Tabaristan, le Sijistan et le Sind. Chacun reçut deux bannières, l'une blanche et l'autre noire. L'acte stipulait que le frère assumerait la succession si le fils était mineur. Cet acte fut rédigé et envoyé par le cadi Ibn Abi al-Shawarib pour être affiché à la Kaaba (voir: Tarikh-Khulafa-Minhaj-1434, p. 565)."
  ur: "261 میں المتمید نے اپنے بعد جانشینی کے لیے اپنے بیٹے جعفر المفواد الا اللہ کے لیے بیعت کی، پھر اپنے بھائی الموفق طلحہ کو - بیٹے نے مغرب، شام، جزیرہ اور آرمینیا کو تفویض کیا۔ بھائی مشرق، عراق، بغداد، حجاز، یمن، فارس، اصفہان، رے، خراسان، طبرستان، سجستان اور سندھ۔ ہر ایک کو دو بینر ملے، سفید اور سیاہ۔ اگر بیٹا اس سے کم عمر کا ہو تو بھائی کا معاملہ لے جاتا ہے — جسے لکھ کر قاضی ابن ابی الشوارب کے ساتھ خانہ کعبہ میں لٹکانے کے لیے روانہ کیا گیا تھا۔ 565}۔"
  tr: "61. yılda, el-Mu'tamid, oğlu el-Mufawwad ila Allah Cafer'i halefi olarak, ondan sonra da kardeşi el-Muwaffaq Talha'yı biat etti. Oğlunu Mağrip, Levant, Cezire ve Ermenistan'ın başına, kardeşini ise Meşrik, Irak, Bağdat, Hicaz, Yemen, Fars, İsfahan, Rayy, Horasan, Taberistan, Sijistan ve Sindh'in başına atadı. Her birine biri beyaz, diğeri siyah olmak üzere iki sancak verdi ve kendisine bir şey olursa, oğlu Cafer henüz reşit olmamışsa, meselenin kardeşine geçeceğini şart koştu. Bu ahdi yazdı ve Baş Yargıç İbn Abi el-Şevarib'e Kâbe'ye asması için teslim etti. {cite:tarikh-khulafa-minhaj-1434 s. 565}"
  id: "Pada tahun 61, al-Mu'tamid berjanji setia kepada putranya, al-Mufawwad ila Allah Ja'far, sebagai penggantinya, dan kemudian setelahnya kepada saudaranya, al-Muwaffaq Talha. Ia menunjuk putranya untuk memerintah Maghreb, Levant, Jazira, dan Armenia, dan menunjuk saudaranya untuk memerintah Mashriq, Irak, Baghdad, Hijaz, Yaman, Fars, Isfahan, Rayy, Khurasan, Tabaristan, Sijistan, dan Sindh. Ia memberi masing-masing dari mereka dua panji, satu putih dan satu hitam, dan menetapkan bahwa jika sesuatu terjadi padanya, masalah tersebut akan diserahkan kepada saudaranya jika putranya Ja'far belum mencapai usia dewasa. Ia menulis perjanjian tersebut dan melaksanakannya bersama Hakim Agung Ibn Abi al-Shawarib untuk menggantungnya di Ka'bah. {cite:tarikh-khulafa-minhaj-1434 p. 565}"
