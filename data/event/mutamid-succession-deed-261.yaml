label: { ar: "عهد المعتمد للمفوض والموفق" }
summary:
  ar: "في سنة إحدى وستين بايع المعتمد بولاية العهد بعده لابنه المفوض إلى الله جعفر ثم من بعده لأخيه الموفق طلحة، وولى ولده المغرب والشام والجزيرة وأرمينية وولى أخاه المشرق والعراق وبغداد والحجاز واليمن وفارس وأصبهان والري وخراسان وطبرستان وسجستان والسند، وعقد لكل منهما لواءين أبيض وأسود وشرط إن حدث به حدث أن الأمر لأخيه إن لم يكن ابنه جعفر قد بلغ وكتب العهد ونفذه مع قاضي القضاة ابن أبي الشوارب ليعلقه في الكعبة {cite:tarikh-khulafa-minhaj-1434 p. 565}."
  en: "In 261 al-Mu'tamid took bay'a for the succession after him to his son Ja'far 'al-Mufawwid ila'llah', then to his brother al-Muwaffaq Talha — the son assigned Maghreb, Syria, Jazira and Armenia; the brother the East, Iraq, Baghdad, Hijaz, Yemen, Fars, Isfahan, Rayy, Khurasan, Tabaristan, Sijistan and Sind. Each got two banners, white and black; the deed stipulated the brother takes the matter if the son be under age — written and dispatched with qadi Ibn Abi al-Shawarib to hang in the Ka'ba {cite:tarikh-khulafa-minhaj-1434 p. 565}."
