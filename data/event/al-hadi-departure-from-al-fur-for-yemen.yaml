id: event/al-hadi-departure-from-al-fur-for-yemen
class: event
kind: migration
label:
  ar: خروج الهادي من الفرع إلى اليمن
  en: Al-Hadi's departure from al-Fur' for Yemen
  ur: ہادی کا فرع سے یمن روانہ ہونا
summary:
  ar: بعد تردد الهادي في الخروج وإعراضه عن رسل اليمن، رأى النبي في المنام يحثه على النهوض، فأمر أصحابه بالرحيل وخرج ومعه قلة، وودّعه عمه محمد بن القاسم بدعاء.
  en: After hesitating and meaning to send the Yemeni envoys away, al-Hadi saw the Prophet in a dream urging him to rise; he told his companions to set out, and went with a small party, his uncle Muhammad ibn al-Qasim bidding him farewell with a prayer.
  ur: ہچکچاہٹ اور یمنی قاصدوں کو لوٹا دینے کے ارادے کے بعد ہادی نے خواب میں نبی کو اٹھنے پر ابھارتے دیکھا؛ انہوں نے ساتھیوں کو کوچ کا حکم دیا اور ایک چھوٹی جماعت کے ساتھ نکلے، اور ان کے چچا محمد بن قاسم نے دعا کے ساتھ انہیں رخصت کیا۔
