label: { en: "Uhud war council and Muslim mobilization", ar: "المجلس الاستشاري وتجهيز الجيش لأحد" }
summary:
  ar: "لما بلغ النبي خبر جيش قريش المتجه نحو المدينة عقد مجلساً استشارياً عسكرياً أعلى تبادل فيه الرأي في الدفاع. رأى النبي المكوث في المدينة وقتال المشركين من خلال الأزقة، ووافقه عبد الله بن أبي، لكن شباب الصحابة ممن فاتهم بدر ألحّوا بالخروج حتى وافقهم. لبس النبي درعيه وتقلّد سيفه، ثم قسّم جيشه ثلاث كتائب: كتيبة المهاجرين براية مصعب بن عمير، وكتيبة الأوس برايةِ أسيد بن حضير، وكتيبة الخزرج برايةِ الحباب بن المنذر {cite:mubarakpuri-raheeq p.252}."
  en: "When news of the Quraysh army heading for Medina reached the Prophet he held a senior war council. His view was to stay in Medina and fight the polytheists through the alleys, and Abdullah ibn Ubayy agreed; but the young Companions who had missed Badr pressed to march out until he yielded. The Prophet put on his armour and girt his sword, then divided his army into three battalions: the Muhajirun under the banner of Mus'ab ibn Umayr, the Aws under Usayd ibn Hudayr, and the Khazraj under al-Hubab ibn al-Mundhir {cite:mubarakpuri-raheeq p.252}."
