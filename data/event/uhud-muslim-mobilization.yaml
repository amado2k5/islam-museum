label: { en: "Uhud war council and Muslim mobilization", ar: "المجلس الاستشاري وتجهيز الجيش لأحد", es: "Consejo de guerra de Uhud y movilización musulmana", fr: "Conseil de guerre d'Uhud et mobilisation musulmane", ur: "احد جنگی کونسل اور مسلمانوں کی تحریک", tr: "Danışma Konseyi ve Ordu Pazar Gününe Hazırlık", id: "Persiapan Dewan Penasihat dan Angkatan Darat untuk Hari Minggu" }
summary:
  ar: "لما بلغ النبي خبر جيش قريش المتجه نحو المدينة عقد مجلساً استشارياً عسكرياً أعلى تبادل فيه الرأي في الدفاع. رأى النبي المكوث في المدينة وقتال المشركين من خلال الأزقة، ووافقه عبد الله بن أبي، لكن شباب الصحابة ممن فاتهم بدر ألحّوا بالخروج حتى وافقهم. لبس النبي درعيه وتقلّد سيفه، ثم قسّم جيشه ثلاث كتائب: كتيبة المهاجرين براية مصعب بن عمير، وكتيبة الأوس برايةِ أسيد بن حضير، وكتيبة الخزرج برايةِ الحباب بن المنذر {cite:mubarakpuri-raheeq p.252}."
  en: "When news of the Quraysh army heading for Medina reached the Prophet he held a senior war council. His view was to stay in Medina and fight the polytheists through the alleys, and Abdullah ibn Ubayy agreed; but the young Companions who had missed Badr pressed to march out until he yielded. The Prophet put on his armour and girt his sword, then divided his army into three battalions: the Muhajirun under the banner of Mus'ab ibn Umayr, the Aws under Usayd ibn Hudayr, and the Khazraj under al-Hubab ibn al-Mundhir {cite:mubarakpuri-raheeq p.252}."
  es: "Cuando la noticia de que el ejército de los Quraysh se dirigía a Medina llegó al Profeta, este convocó un consejo de guerra de alto nivel. Su opinión era permanecer en Medina y combatir a los politeístas por los callejones, y Abdullah ibn Ubayy estuvo de acuerdo; pero los jóvenes Compañeros que habían perdido la batalla de Badr insistieron en marchar hasta que él cedió. El Profeta se puso su armadura y se ciñó la espada, y luego dividió su ejército en tres batallones: los Muhajirun bajo el estandarte de Mus'ab ibn Umayr, los Aws bajo Usayd ibn Hudayr y los Khazraj bajo al-Hubab ibn al-Mundhir {cite:mubarakpuri-raheeq p.252}."
  fr: "Lorsque la nouvelle de l'arrivée de l'armée qurayshite sur Médine parvint au Prophète, celui-ci convoqua un conseil de guerre. Il était d'avis de rester à Médine et de combattre les polythéistes par les ruelles, et Abdullah ibn Ubayy approuva. Cependant, les jeunes Compagnons qui avaient manqué la bataille de Badr insistèrent pour partir, jusqu'à ce qu'il cède. Le Prophète revêtit son armure et ceignit son épée, puis divisa son armée en trois bataillons: les Muhajirun sous le commandement de Mus'ab ibn Umayr, les Aws sous celui d'Usayd ibn Hudayr, et les Khazraj sous celui d'al-Hubab ibn al-Mundhir (voir Mubarakpuri-Raheeq, p. 252)."
  ur: "جب قریش کے لشکر کی مدینہ کی طرف روانگی کی خبر پہنچی تو آپ نے ایک اعلیٰ جنگی کونسل کا انعقاد کیا۔ اس کا نظریہ مدینہ میں رہ کر مشرکین سے گلی کوچوں میں لڑنے کا تھا، اور عبداللہ بن ابی نے اس پر اتفاق کیا۔ لیکن جو نوجوان صحابہ بدر سے محروم ہو گئے تھے، انہوں نے آگے بڑھنے کے لیے دباؤ ڈالا یہاں تک کہ وہ ہار گئے۔ نبی نے اپنی زرہ باندھی اور اپنی تلوار باندھی، پھر اپنی فوج کو تین بٹالین میں تقسیم کیا: مہاجرین مصعب بن عمیر کے جھنڈے تلے، اوس اسید بن حضیر کے ماتحت اور خزرج الحباب بن المنذر کے ماتحت تھے۔"
  tr: "Peygamber, Kureyş ordusunun Medine'ye doğru ilerlediği haberini alınca, savunma stratejilerini görüşmek üzere üst düzey bir askeri konsey topladı. Peygamber, Medine'de kalıp dar sokaklarda müşriklerle savaşmayı tercih ediyordu; bu görüşü Abdullah ibn Ubayy de paylaşıyordu. Ancak Bedir Savaşı'nı kaçırmış olan genç sahabeler savaşa çıkmakta ısrar ettiler ve sonunda Peygamber de kabul etti. Peygamber iki zırhını giydi ve kılıcını kuşandı, ardından ordusunu üç tabura ayırdı: Mus'ab ibn Umayr'ın sancağı altında Muhacir taburu, Usayd ibn Hudayr'ın sancağı altında Evs taburu ve el-Hubab ibn el-Mundhir'in sancağı altında Hazrec taburu."
  id: "Ketika Nabi menerima kabar tentang pasukan Quraisy yang maju menuju Madinah, beliau mengadakan dewan militer tingkat tinggi untuk membahas strategi pertahanan. Nabi lebih menyukai untuk tetap tinggal di Madinah dan memerangi kaum musyrik melalui jalan-jalan sempit, pandangan yang juga dianut oleh Abdullah ibn Ubayy. Namun, para sahabat yang lebih muda yang melewatkan Perang Badar bersikeras untuk ikut berperang, dan akhirnya beliau setuju. Nabi mengenakan dua baju zirah dan mengambil pedangnya, kemudian membagi pasukannya menjadi tiga batalion: batalion Muhajirin di bawah panji Mus'ab ibn Umayr, batalion Aws di bawah panji Usayd ibn Hudayr, dan batalion Khazraj di bawah panji al-Hubab ibn al-Mundhir."
