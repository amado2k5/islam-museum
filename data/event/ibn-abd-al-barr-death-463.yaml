id: event/ibn-abd-al-barr-death-463
class: event
kind: death
label:
  ar: "وفاة ابن عبد البر بشاطبة ليلة الجمعة سلخ ربيع الآخر ٤٦٣هـ"
  en: "Ibn 'Abd al-Barr dies at Shatiba, eve of Friday, end of Rabi' II 463/early 1071"
  ur: "ابن عبد البر کی وفات شاطبہ میں، جمعہ کی رات، ربیع الثانی 463ھ کے آخر میں/1071ء کے اوائل"
  es: "Ibn 'Abd al-Barr muere en Shatiba, víspera del viernes, a finales de Rabi' II de 463/principios de 1071."
  fr: "Ibn 'Abd al-Barr meurt à Shatiba, à la veille du vendredi, fin du mois de Rabi' II 463/début 1071"
  tr: "İbn Abdülbarr, Hicri 463 yılının Rebiü'l-Sani ayının son günü olan Cuma gecesi Xativa'da vefat etti."
  id: "Ibn Abd al-Barr wafat di Xativa pada Jumat malam, hari terakhir bulan Rabi' al-Thani 463 H."
summary:
  ar: "توفي الحافظ أبو عمر ابن عبد البر بشاطبة من شرق الأندلس ليلة الجمعة آخر يوم من شهر ربيع الآخر سنة ثلاث وستين وأربعمائة، ودفن يوم الجمعة بعد العصر وصلى عليه صاحبه أبو الحسن طاهر بن مفوز المعافري، وقد استكمل خمساً وتسعين سنة وخمسة أيام {cite:wafayat-ayan p. 71} {cite:tarikh-islam-dhahabi p. 142}؛ وكان أعلى أهل الأندلس إسناداً في وقته ولم يخرج من الأندلس {cite:tarikh-islam-dhahabi p. 142}."
  en: "The hafiz Abu 'Amr Ibn 'Abd al-Barr died at Shatiba in eastern al-Andalus on the eve of Friday, the last day of Rabi' II 463; he was buried on Friday afternoon and his companion Abu al-Hasan Tahir ibn Mufawwiz al-Mu'afiri led the prayer — he had completed ninety-five years and five days {cite:wafayat-ayan p. 71} {cite:tarikh-islam-dhahabi p. 142}. He was the highest isnad in al-Andalus of his time and never left the peninsula {cite:tarikh-islam-dhahabi p. 142}."
  ur: "حافظ ابو عمر ابن عبد البر مشرقی اندلس کے شہر شاطبہ میں جمعہ کی رات ربیع الثانی 463ھ کے آخری دن فوت ہوئے؛ جمعہ کے دن عصر کے بعد دفنائے گئے اور ان کے ساتھی ابوالحسن طاہر بن مفوز معافری نے نماز جنازہ پڑھائی — عمر پچھانوے برس اور پانچ دن پوری کی {cite:wafayat-ayan p. 71} {cite:tarikh-islam-dhahabi p. 142}۔ وہ اپنے زمانے میں اندلس کے بلند ترین سند رکھنے والے تھے اور کبھی جزیرہ سے باہر نہیں نکلے {cite:tarikh-islam-dhahabi p. 142}۔"
  es: "El hafiz Abu 'Amr Ibn 'Abd al-Barr murió en Shatiba, en el este de al-Ándalus, en la víspera del viernes, último día de Rabi' II 463; fue enterrado el viernes por la tarde y su compañero Abu al-Hasan Tahir ibn Mufawwiz al-Mu'afiri dirigió la oración; había cumplido noventa y cinco años y cinco días {cite:wafayat-ayan p. 71} {cite:tarikh-islam-dhahabi p. 142}. Fue el isnad más alto de al-Ándalus de su época y nunca abandonó la península {cite:tarikh-islam-dhahabi p. 142}."
  fr: "Le hafiz Abu 'Amr Ibn 'Abd al-Barr mourut à Shatiba, dans l'est d'al-Andalus, à la veille du vendredi, dernier jour de Rabi' II 463. Il fut inhumé le vendredi après-midi et son compagnon, Abu al-Hasan Tahir ibn Mufawwiz al-Mu'afiri, dirigea la prière. Il avait atteint l'âge de quatre-vingt-quinze ans et cinq jours (voir: Wafayat-ayan, p. 71; Tarikh-Islam-Dhahabi, p. 142). Il était le plus éminent isnad d'al-Andalus de son temps et ne quitta jamais la péninsule (voir: Tarikh-Islam-Dhahabi, p. 142)."
  tr: "Alim Ebu Ömer İbn Abdülberr, Hicri 463 yılının Rebiü'l-Ahir ayının son günü olan Cuma gecesi, Doğu Endülüs'teki Xativa'da vefat etti. Cuma günü ikindi namazından sonra defnedildi ve arkadaşı Ebu el-Hasan Tahir İbn Mafuz el-Ma'afiri onun için dua etti. Doksan beş yıl beş gün yaşamıştı. Zamanında Endülüs halkı arasında hadis zinciri bakımından en üst düzeydeydi ve Endülüs'ten hiç ayrılmadı."
  id: "Ulama Abu Omar Ibn Abd al-Barr wafat di Xativa, Andalusia timur, pada malam Jumat, hari terakhir bulan Rabi' al-Akhir tahun 463 Hijriah. Beliau dimakamkan pada hari Jumat setelah salat Asar, dan sahabatnya, Abu al-Hasan Tahir Ibn Mafuz al-Ma'afiri, mendoakannya. Beliau telah berumur sembilan puluh lima tahun lima hari. Beliau adalah ulama terkemuka di Andalusia dalam hal sanad pada masanya, dan beliau tidak pernah meninggalkan Andalusia."
