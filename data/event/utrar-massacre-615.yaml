summary:
  ar: "حادثة أطرار نحو سنة 615هـ؛ وصل تجار من بلاد جنكزخان إلى أطرار وبها أنيال خان ابن خال خوارزم شاه فعثر على أموالهم ورفع إلى السلطان أنهم عيون على البلاد فأمره بالاحتياط عليهم فأخذ أموالهم وقتلهم خفية، فبعث جنكزخان بالنكير على السلطان يطالبه بأنيال خان فأنزعج السلطان وقتل الرسل، فسار جنكزخان في العساكر إلى بلاده فكان الحادث سبباً لغزو التتر ممالك الإسلام."
  en: "The Utrar affair, around 615 AH; merchants from Genghis Khan's lands reached Utrar whose lord Inal Khan, the sultan's uncle's son, seized their goods and reported them as spies — ordered to hold them he killed them secretly and took their wealth; Genghis Khan sent demanding Inal Khan's surrender, the sultan recoiled and killed the envoys, and the khan marched his armies into the sultanate — the incident becoming the cause of the Tatar invasion of the Islamic realms."
  es: "El incidente de Utrar, alrededor del año 615 de la Hégira, ocurrió cuando unos mercaderes de las tierras de Gengis Kan llegaron a Utrar, cuyo señor, Inal Khan, hijo del tío del sultán, se apoderó de sus mercancías y los denunció como espías. Recibió la orden de retenerlos, los asesinó en secreto y se apropió de sus riquezas. Gengis Kan envió a Inal Khan exigiendo su rendición, pero el sultán reaccionó con hostilidad, mató a los enviados y marchó con sus ejércitos hacia el sultanato. Este incidente fue la causa de la invasión tártara de los reinos islámicos."
  fr: "L'affaire d'Utrar, vers 615 AH; des marchands des terres de Gengis Khan atteignirent Utrar, où leur seigneur Inal Khan, fils de l'oncle du sultan, s'empara de leurs biens et les dénonça comme espions. Sommé de les garder, il les fit tuer secrètement et s'empara de leurs richesses. Gengis Khan envoya des émissaires exiger la reddition d'Inal Khan, mais le sultan, furieux, les fit tuer et marcha sur ses armées jusqu'au sultanat. Cet incident fut la cause de l'invasion tatare des royaumes islamiques."
  ur: "اتر کا معاملہ، تقریباً 615 ہجری؛ چنگیز خان کی زمینوں کے سوداگر اترار پہنچ گئے جن کے آقا انال خان نے، سلطان کے چچا کے بیٹے، ان کا سامان قبضے میں لے لیا اور انہیں جاسوس بتانے کا حکم دیا۔ چنگیز خان نے انال خان کے ہتھیار ڈالنے کا مطالبہ کرتے ہوئے بھیجا، سلطان نے پیچھے ہٹ کر ایلچیوں کو قتل کر دیا، اور خان نے اپنی فوجوں کو سلطنت میں داخل کر دیا - یہ واقعہ تاتاریوں کے اسلامی شعائر پر حملے کا سبب بنا۔"
  tr: "Atrar olayı, Hicri 615 yılı civarında meydana geldi. Cengiz Han ülkesinden tüccarlar Atrar'a geldiler ve aralarında Harezm Şah'ın dayısı Anyal Han da vardı. Anyal Han, tüccarların parasını buldu ve Sultan'a casus olduklarını bildirdi. Bunun üzerine Sultan, Anyal Han'dan onlara karşı önlem almasını istedi ve Anyal Han da paralarını alıp onları gizlice öldürdü. Cengiz Han, Sultan'a Anyal Han'ı geri isteyen bir ihbar gönderdi. Sultan öfkelenerek habercileri öldürdü. Bunun üzerine Cengiz Han askerleriyle ülkesine döndü ve bu olay, Tatarların İslam krallıklarını işgal etmesine sebep oldu."
  id: "Peristiwa Atrar terjadi sekitar tahun 615 Hijriah. Para pedagang dari negeri Genghis Khan tiba di Atrar, dan di sana ada Anyal Khan, paman dari pihak ibu Khwarazm Shah. Ia menemukan uang mereka dan melaporkan kepada Sultan bahwa mereka adalah mata-mata negara. Maka Sultan memerintahkannya untuk mengambil tindakan pencegahan terhadap mereka, lalu ia mengambil uang mereka dan membunuh mereka secara diam-diam. Genghis Khan mengirimkan surat pengaduan kepada Sultan menuntut Anyal Khan darinya. Maka Sultan menjadi marah dan membunuh para utusan tersebut. Kemudian Genghis Khan berbaris dengan pasukannya kembali ke negaranya, dan peristiwa itu menjadi alasan bagi bangsa Tatar untuk menyerang kerajaan-kerajaan Islam."
