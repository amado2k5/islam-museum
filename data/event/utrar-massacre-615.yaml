label:
  ar: حادثة أطرار
  en: The Utrar massacre
summary:
  ar: "حادثة أطرار نحو سنة 615هـ؛ وصل تجار من بلاد جنكزخان إلى أطرار وبها أنيال خان ابن خال خوارزم شاه فعثر على أموالهم ورفع إلى السلطان أنهم عيون على البلاد فأمره بالاحتياط عليهم فأخذ أموالهم وقتلهم خفية، فبعث جنكزخان بالنكير على السلطان يطالبه بأنيال خان فأنزعج السلطان وقتل الرسل، فسار جنكزخان في العساكر إلى بلاده فكان الحادث سبباً لغزو التتر ممالك الإسلام."
  en: "The Utrar affair, around 615 AH; merchants from Genghis Khan's lands reached Utrar whose lord Inal Khan, the sultan's uncle's son, seized their goods and reported them as spies — ordered to hold them he killed them secretly and took their wealth; Genghis Khan sent demanding Inal Khan's surrender, the sultan recoiled and killed the envoys, and the khan marched his armies into the sultanate — the incident becoming the cause of the Tatar invasion of the Islamic realms."
