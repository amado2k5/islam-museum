label:
  ar: 'ساعة الجمعة: ما من دابة إلا مصيخة إلا الجن والإنس'
  en: 'The Friday hour: every creature prostrates save jinn and humans'
  ur: 'جمعے کی ساعت: ہر مخلوق سجدے میں سوائے جن اور انسان'
summary:
  ar: 'خرج أبو هريرة إلى الطور فلقي كعب الأحبار فحدثه كعب عن التوراة وحدثه هو عن النبي: خير يوم طلعت عليه الشمس يوم الجمعة، فيه خُلق آدم وأُهبط من الجنة وتيب عليه ومات، وفيه تقوم الساعة، وما من دابة إلا
    وهي مصيخة يوم الجمعة شفقاً من الساعة إلا الجن والإنس، وفيه ساعة لا يصادفها عبد مسلم وهو يصلي يسأل الله شيئاً إلا أعطاه. فقال كعب: ذلك في كل سنة يوم، فقال أبو هريرة: بل في كل جمعة، فقرأ كعب التوراة وصدّق؛
    ولقاء عبد الله بن سلام الذي أخبره أن تلك الساعة آخر ساعة في يوم الجمعة {cite:muwatta-maruf-1997} [[passage/muwatta-1-291|الموطأ 291]].'
  en: 'Abu Hurayra went out to Mount Tur and met Ka b al-Ahbar; Ka b told him of the Torah and he told him of the Prophet: the best day on which the sun rose is Friday — Adam was created on it, sent down
    from Paradise, repented and died on it; the Hour rises on it; every creature prostrates on Friday in awe of the Hour save the jinn and humans; and it holds an hour in which a Muslim servant praying
    asks God for anything and is given it. Ka b said: that is one day every year; Abu Hurayra said: rather every Friday — and Ka b read the Torah and confirmed it; then Abdullah ibn Salam told him that
    hour is the last hour of Friday {cite:muwatta-maruf-1997} [[passage/muwatta-1-291|Muwatta 291]].'
  ur: 'ابو ہریرہ طور کو گئے تو انہوں نے کعب الاحبار سے ملاقات کی؛ کعب نے انہیں توریت سنائی اور انہوں نے انہیں نبی کی حدیث سنائی: وہ بہترین دن جس پر سورج طلوع ہوا جمعہ ہے — اس دن آدم پیدا ہوئے، جنت سے اتارے
    گئے، توبہ کی اور اس دن وفات پائی؛ اس دن قیامت قائم ہوگی؛ ہر مخلوق جمعے کے دن قیامت کے خوف سے سجدے میں ہو گی سوائے جن اور انسان کے۔'
