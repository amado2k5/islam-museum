summary:
  ar: "في جمادى الأولى سنة ثمان من الهجرة، أرسل النبي جيشًا من ثلاثة آلاف مقاتل إلى الشام، وعيَّن عليهم ثلاثة قادة بالترتيب: زيد بن حارثة، فجعفر بن أبي طالب، فعبد الله بن رواحة، وودّع الناس قادتهم عند خروجهم من المدينة."
  en: "In Jumada I of year 8 AH, the Prophet dispatched an army of three thousand to Syria, appointing three commanders in succession — Zayd ibn Haritha, then Jafar ibn Abi Talib, then Abd Allah ibn Rawaha — and the people bade farewell to the commanders at their departure."
