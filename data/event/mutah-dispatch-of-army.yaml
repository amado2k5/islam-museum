id: event/mutah-dispatch-of-army
class: event
kind: other
label: { ar: "تجهيز جيش مؤتة وتوديعه", en: "Dispatch of the Mu'tah army", es: "Despacho del ejército de Mu'tah", fr: "Dépêche de l'armée Mu'tah", ur: "متعہ کی فوج کی روانگی", tr: "Mu'tah'ın ordusuna hazırlanmak ve veda etmek", id: "Mempersiapkan dan mengucapkan selamat tinggal kepada pasukan Mu'tah." }
summary:
  ar: "في جمادى الأولى سنة ثمان من الهجرة، أرسل النبي جيشًا من ثلاثة آلاف مقاتل إلى الشام، وعيَّن عليهم ثلاثة قادة بالترتيب: زيد بن حارثة، فجعفر بن أبي طالب، فعبد الله بن رواحة، وودّع الناس قادتهم عند خروجهم من المدينة."
  en: "In Jumada I of year 8 AH, the Prophet dispatched an army of three thousand to Syria, appointing three commanders in succession — Zayd ibn Haritha, then Jafar ibn Abi Talib, then Abd Allah ibn Rawaha — and the people bade farewell to the commanders at their departure."
  es: "En Jumada I del año 8 AH, el Profeta envió un ejército de tres mil hombres a Siria, nombrando a tres comandantes sucesivamente: Zayd ibn Haritha, luego Jafar ibn Abi Talib y después Abd Allah ibn Rawaha; y el pueblo se despidió de los comandantes a su partida."
  fr: "En Jumada I de l'an 8 AH, le Prophète envoya une armée de trois mille hommes en Syrie, nommant successivement trois commandants: Zayd ibn Haritha, puis Jafar ibn Abi Talib, puis Abd Allah ibn Rawaha. Le peuple fit ses adieux aux commandants lors de leur départ."
  ur: "سنہ 8 ہجری کے جمادی الاول میں، رسول اللہ نے تین ہزار کا لشکر شام کی طرف روانہ کیا، یکے بعد دیگرے تین سپہ سالار، زید بن حارثہ، پھر جعفر بن ابی طالب، پھر عبد اللہ بن رواحہ — اور لوگوں نے ان کے رخصت ہوتے ہی کمانڈروں کو الوداع کیا۔"
  tr: "Hicretin sekizinci yılı Cemâdeü'l-Ula'da Peygamberimiz Suriye'ye üç bin savaşçıdan oluşan bir ordu gönderdi ve sırasıyla Zeyd ibn Harita, sonra Cafer ibn Ebu Talib, sonra da Abdullah ibn Ravaha olmak üzere üç komutan atadı. Halk, Medine'den ayrılırken komutanlarına veda etti."
  id: "Pada bulan Jumada al-Ula, tahun kedelapan Hijrah, Nabi mengirimkan pasukan yang terdiri dari tiga ribu pejuang ke Suriah, dan menunjuk tiga komandan atas mereka secara berurutan: Zayd ibn Haritha, kemudian Jafar ibn Abi Talib, kemudian Abdullah ibn Rawaha, dan orang-orang mengucapkan selamat tinggal kepada komandan mereka ketika mereka meninggalkan Madinah."
