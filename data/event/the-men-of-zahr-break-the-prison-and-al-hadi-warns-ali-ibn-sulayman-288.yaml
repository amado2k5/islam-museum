id: event/the-men-of-zahr-break-the-prison-and-al-hadi-warns-ali-ibn-sulayman-288
class: event
kind: other
label:
  ar: "أهل ظهر يكسرون الحبس والهادي يحذر علي بن سليمان من الخروج من صنعاء، جمادى الآخرة 288هـ"
  en: "The men of Zahr break the prison and al-Hadi warns Ali ibn Sulayman not to leave Sana'a, Jumada II 288 AH"
  ur: "اہل ظہر قید خانہ توڑتے ہیں اور ہادی علی بن سلیمان کو صنعاء سے نہ نکلنے کی تنبیہ کرتے ہیں، جمادی الآخرہ 288ھ"
  es: "Los hombres de Zahr escapan de la prisión y al-Hadi advierte a Ali ibn Sulayman que no abandone Saná, Jumada II 288 AH."
  fr: "Les hommes de Zahr prennent d'assaut la prison et al-Hadi avertit Ali ibn Sulayman de ne pas quitter Sanaa (Jumada II 288 AH)."
  tr: "Dhahr halkı hapishaneyi kırıyor ve Al-Hadi, Ali bin Süleyman'ı Sana'a'dan ayrılmaması konusunda uyarıyor, Cemada el-Ahirah 288 H."
  id: "Penduduk Dhahr mendobrak penjara, dan Al-Hadi memperingatkan Ali bin Sulaiman agar tidak meninggalkan Sana'a, Jumada al-Akhirah 288 H."
summary:
  ar: "بعد مقتل ابن أبي عباد فرّ الناس إلى صنعاء والبون وظهر، وقال الذين وجههم عبيد الله بن محمد مدداً من ظهر بعضهم لبعض أن يهولوا على واليهم، فصاحوا بالسلاح ورموا درب ظهر، فهرب الوالي إلى صنعاء وفتحوا أبا الغشام بن طريف ومن معه من آل يعفر، فكتب الهادي إلى علي بن سليمان ألا يخرج من صنعاء."
  en: "After Ibn Abi Abbad was killed the people fled to Sana'a, al-Bawn and Zahr; the men whom Ubaydallah ibn Muhammad had sent from Zahr as reinforcement agreed to alarm their governor, shouted for arms and shot at the gate of Zahr, the governor fled to Sana'a and they freed Abu al-Ghasham ibn Tarif and the men of Al Ya'fur with him; al-Hadi wrote to Ali ibn Sulayman not to leave Sana'a."
  ur: "ابن ابی عباد کے قتل کے بعد لوگ صنعاء، البون اور ظہر کی طرف بھاگے؛ جنہیں عبید اللہ بن محمد نے ظہر سے کمک کے طور پر بھیجا تھا انہوں نے آپس میں طے کیا کہ اپنے والی کو ڈرائیں، ہتھیاروں کی پکار لگائی اور ظہر کے درب پر تیر پھینکے، والی صنعاء بھاگ گیا اور انہوں نے ابو الغشام بن طریف اور آل یعفر کے ساتھیوں کو آزاد کر دیا؛ ہادی نے علی بن سلیمان کو لکھا کہ صنعاء سے نہ نکلیں۔"
  es: "Tras la muerte de Ibn Abi Abbad, la gente huyó a Sana'a, al-Bawn y Zahr; los hombres que Ubaydallah ibn Muhammad había enviado desde Zahr como refuerzo acordaron alertar a su gobernador, pidieron armas a gritos y dispararon contra la puerta de Zahr. El gobernador huyó a Sana'a y liberaron con él a Abu al-Ghasham ibn Tarif y a los hombres de Al Ya'fur; al-Hadi escribió a Ali ibn Sulayman que no abandonara Sana'a."
  fr: "Après la mort d'Ibn Abi Abbad, les habitants s'enfuirent à Sanaa, al-Bawn et Zahr; les hommes qu'Ubaydallah ibn Muhammad avait envoyés de Zahr en renfort décidèrent d'alerter leur gouverneur, réclamèrent des armes et tirèrent à la porte de Zahr. Le gouverneur s'enfuit à Sanaa et ils libérèrent Abu al-Ghasham ibn Tarif et les hommes d'Al Ya'fur qui l'accompagnaient; al-Hadi écrivit à Ali ibn Sulayman de ne pas quitter Sanaa."
  tr: "İbn Abi Abbad'ın öldürülmesinden sonra halk Sana'a, El-Bawn ve Dahr'a kaçtı. Ubeyd Allah ibn Muhammed'in Dahr'dan takviye olarak gönderdiği kişiler birbirlerine valilerini korkutmalarını söylediler. Bunun üzerine silahlarıyla bağırıp Darb Dahr'a taş attılar. Vali Sana'a kaçtı ve Ya'fur ailesinden Ebu el-Gaşam ibn Tarif ve yanındakiler esir alındı. El-Hadi, Ali ibn Süleyman'a Sana'a'dan ayrılmaması için yazdı."
  id: "Setelah pembunuhan Ibnu Abbad, orang-orang melarikan diri ke Sana'a, Al-Bawn, dan Dhahr. Orang-orang yang dikirim Ubayd Allah ibn Muhammad sebagai bala bantuan dari Dhahr saling memberi tahu untuk mengintimidasi gubernur mereka. Maka mereka berteriak dengan senjata dan melempari batu ke Darb Dhahr. Gubernur melarikan diri ke Sana'a, dan mereka menangkap Abu Al-Ghasham ibn Tarif dan orang-orang yang bersamanya dari keluarga Ya'fur. Al-Hadi menulis surat kepada Ali ibn Sulayman agar tidak meninggalkan Sana'a."
