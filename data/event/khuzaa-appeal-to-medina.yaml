id: event/khuzaa-appeal-to-medina
class: event
kind: other
aliases: [work/amr-ibn-salim-istighatha]
label: { en: "Khuza'a's appeal to Medina", ar: "استغاثة خزاعة بالنبي", es: "La apelación de Khuza'a a Medina", fr: "L'appel de Khuza'a à Médine", ur: "خزاعہ کی مدینہ سے اپیل", tr: "Huza'a'nın Peygambere yalvarışı", id: "Permohonan Khuza'a kepada Nabi" }
summary:
  en: "After al-Watir, Amr ibn Salim al-Khuza'i stood before the Prophet in the Medina mosque and recited his plea invoking the pact of the fathers — 'and that was what stirred the conquest of Mecca' — then Budayl ibn Warqa' arrived with Khuza'i men reporting Quraysh's backing of Bakr."
  ar: "خرج عمرو بن سالم الخزاعي بعد اعتداء الوتير فوقف على النبي في مسجد المدينة يناشده حلف الآباء بأبياته — «وكان ذلك مما هاج فتح مكة» — ثم قدم بديل بن ورقاء في نفر من خزاعة فأخبروه بمظاهرة قريش بني بكر ونقضهم العهد."
  es: "Después de al-Watir, Amr ibn Salim al-Khuza'i se presentó ante el Profeta en la mezquita de Medina y recitó su súplica invocando el pacto de los padres —'y eso fue lo que impulsó la conquista de La Meca'—, luego Budayl ibn Warqa' llegó con hombres de Khuza'i informando del apoyo de Quraysh a Bakr."
  fr: "Après al-Watir, Amr ibn Salim al-Khuza'i se tint devant le Prophète dans la mosquée de Médine et récita son plaidoyer invoquant le pacte des pères — « et c'est ce qui a déclenché la conquête de La Mecque » — puis Budayl ibn Warqa' arriva avec des hommes de Khuza'i rapportant le soutien des Quraysh à Bakr."
  ur: "الطیر کے بعد عمرو بن سالم الخزاعی مدینہ کی مسجد میں رسول اللہ کے سامنے کھڑے ہوئے اور باپ دادا کے معاہدے کی دعوت دیتے ہوئے اپنی التجا سنائی - 'اور اسی چیز نے فتح مکہ کو ہلایا' - پھر بدیل بن ورقع خزاعی آدمیوں کے ساتھ وہاں پہنچا جس نے بکر کی قریش کی حمایت کی اطلاع دی۔"
  tr: "Amr ibn Salim el-Huzaî, Vetir saldırısından sonra Medine mescidinde Peygamber'in huzuruna çıktı ve atalarının yeminiyle ayetler okuyarak ona yalvardı: \"İşte bu, Mekke'nin fethine sebep olan şeylerden biriydi.\" Ardından Budayl ibn Varakî, Huzaî'den bir grupla geldi ve Kureyş'in Beni Bekir'i desteklediğini ve ahdi bozduklarını ona bildirdi."
  id: "Amr ibn Salim al-Khuza’i keluar setelah serangan terhadap al-Watir dan berdiri di hadapan Nabi di masjid Madinah, memohon kepadanya dengan sumpah para leluhur disertai ayat-ayatnya — “dan itu adalah salah satu hal yang memicu penaklukan Mekah” — kemudian Budayl ibn Warqa’ datang bersama sekelompok orang dari Khuza’a dan mereka memberitahukan kepadanya tentang dukungan Quraisy kepada Bani Bakr dan pelanggaran perjanjian mereka."
