label: { en: "Khuza'a's appeal to Medina", ar: "استغاثة خزاعة بالنبي" }
summary:
  en: "After al-Watir, Amr ibn Salim al-Khuza'i stood before the Prophet in the Medina mosque and recited his plea invoking the pact of the fathers — 'and that was what stirred the conquest of Mecca' — then Budayl ibn Warqa' arrived with Khuza'i men reporting Quraysh's backing of Bakr."
  ar: "خرج عمرو بن سالم الخزاعي بعد اعتداء الوتير فوقف على النبي في مسجد المدينة يناشده حلف الآباء بأبياته — «وكان ذلك مما هاج فتح مكة» — ثم قدم بديل بن ورقاء في نفر من خزاعة فأخبروه بمظاهرة قريش بني بكر ونقضهم العهد."
