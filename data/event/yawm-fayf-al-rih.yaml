summary:
  ar: "يوم فيف الريح من أيام بني عامر بن صعصعة، التقى فيه الصميل بن الأعور الكلابي وعمرو بن صبيح النهدي فطعنه عمر، واقتتلوا ثلاثة أيام يعاودون القتال، وشهدت بنو نمير مع عامر بن الطفيل فأبلوا وسمّوا يومهم حريجة الطعان لاجتماع رماحهم كالحرجة، وكان عامر يتعهد الناس فيقول من أبلى فليرني سيفه أو رمحه، فأتاه رجل من الحرثيين اسمه مسهر فلما أقبل لينظر وجأه بالرمح في وجنته ففلقها وفقأ عينه، وقد طعن عامر يومئذ ما بين ثغرة نحره إلى سرته عشرين طعنة، وأسروا سيد مراد جريحًا فلما برأ أطلق {cite:kamil-ibn-al-athir p. 475-476}."
  en: "At Fayf al-Rīḥ the armies fought three days running. ʿĀmir ibn al-Ṭufayl took twenty lance-thrusts from collar to navel and still went through the ranks demanding each man show a bloodied blade or go prove himself — until a Ḥārithī named Mūshir offered his spear for inspection and drove it through ʿĀmir's cheek, gouging out the eye. Banū Numayr stood with him so densely their day was named «the thicket of lances»; the chief of Murād was taken wounded and freed on recovery {cite:kamil-ibn-al-athir p. 475-476}."
  es: "En Fayf al-Rīḥ, los ejércitos lucharon durante tres días seguidos. ʿĀmir ibn al-Ṭufayl recibió veinte estocadas de lanza desde el cuello hasta el ombligo y aun así recorrió las filas exigiendo a cada hombre que mostrara una hoja ensangrentada o que fuera a demostrar su valía, hasta que un Ḥārithī llamado Mūshir ofreció su lanza para que la inspeccionaran y se la clavó en la mejilla a ʿĀmir, arrancándole el ojo. Los Banū Numayr se mantuvieron tan unidos a él que aquel día fue bautizado como «el matorral de lanzas»; el jefe de Murād fue capturado herido y liberado al recuperarse {cite:kamil-ibn-al-athir p. 475-476}."
  fr: "À Fayf al-Rīḥ, les armées s'affrontèrent pendant trois jours consécutifs. ʿĀmir ibn al-Ṭufayl reçut vingt coups de lance du col au nombril et continua de parcourir les rangs, exigeant de chaque homme qu'il montre une lame ensanglantée ou qu'il aille faire ses preuves – jusqu'à ce qu'un Ḥārithī nommé Mūshir lui offre sa lance pour inspection et la lui enfonce dans la joue, lui crevant l'œil. Les Banū Numayr se tenaient à ses côtés si nombreux que cette journée fut surnommée « le fourré de lances »; le chef de Murād fut fait prisonnier, blessé, puis libéré après sa convalescence (voir: Kamil ibn al-Athir, p. 475-476)."
  ur: "فیف الریح میں فوجیں تین دن تک لڑتی رہیں۔ عامر بن الطفیل نے گریبان سے ناف تک 20 لانس مارے اور پھر بھی ہر ایک سے خون آلود بلیڈ دکھانے یا اپنے آپ کو ثابت کرنے کا مطالبہ کرتے ہوئے صفوں میں سے گزرتا رہا - یہاں تک کہ مشیر نامی ایک ہاریٹھی نے معائنہ کے لیے اپنا نیزہ پیش کیا اور اسے چیخمیرنگ آنکھ سے باہر نکال دیا۔ بنو نمیر اس کے ساتھ اتنے گھنے کھڑے تھے کہ ان کے دن کا نام \"نیلوں کی جھاڑی\" پڑ گیا۔ مراد کے سردار کو زخمی حالت میں لے جایا گیا اور صحت یاب ہونے پر رہا کر دیا گیا۔ 475-476}۔"
