summary:
  ar: "يوم فيف الريح من أيام بني عامر بن صعصعة، التقى فيه الصميل بن الأعور الكلابي وعمرو بن صبيح النهدي فطعنه عمر، واقتتلوا ثلاثة أيام يعاودون القتال، وشهدت بنو نمير مع عامر بن الطفيل فأبلوا وسمّوا يومهم حريجة الطعان لاجتماع رماحهم كالحرجة، وكان عامر يتعهد الناس فيقول من أبلى فليرني سيفه أو رمحه، فأتاه رجل من الحرثيين اسمه مسهر فلما أقبل لينظر وجأه بالرمح في وجنته ففلقها وفقأ عينه، وقد طعن عامر يومئذ ما بين ثغرة نحره إلى سرته عشرين طعنة، وأسروا سيد مراد جريحًا فلما برأ أطلق {cite:kamil-ibn-al-athir p. 475-476}."
  en: "At Fayf al-Rīḥ the armies fought three days running. ʿĀmir ibn al-Ṭufayl took twenty lance-thrusts from collar to navel and still went through the ranks demanding each man show a bloodied blade or go prove himself — until a Ḥārithī named Mūshir offered his spear for inspection and drove it through ʿĀmir's cheek, gouging out the eye. Banū Numayr stood with him so densely their day was named «the thicket of lances»; the chief of Murād was taken wounded and freed on recovery {cite:kamil-ibn-al-athir p. 475-476}."
