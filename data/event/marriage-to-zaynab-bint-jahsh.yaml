summary:
  ar: "تزوج النبي بزينب بنت جحش بعد طلاق زيد بن حارثة لها في ذي القعدة سنة 5هـ، إبطالاً لقاعدة التبني الجاهلية التي كانت تحرم زوجة الابن بالتبني؛ ونزل فيها آيات سورة الأحزاب وأثار المنافقون حولها دعايات."
  en: "The Prophet married Zaynab bint Jahsh after Zayd ibn Haritha divorced her, in Dhu al-Qa'da 5 AH, abolishing by act the jahili adoption rule that had treated an adopted son's wife as a real son's wife; verses of sura al-Ahzab were revealed about it and the hypocrites spread propaganda around it."
  es: "El Profeta se casó con Zaynab bint Jahsh después de que Zayd ibn Haritha se divorciara de ella, en Dhu al-Qa'da 5 AH, aboliendo por medio de un acto la regla de adopción jahili que había tratado a la esposa de un hijo adoptivo como la esposa de un hijo biológico; se revelaron versículos de la sura al-Ahzab al respecto y los hipócritas difundieron propaganda sobre ello."
  fr: "Le Prophète épousa Zaynab bint Jahsh après que Zayd ibn Haritha eut divorcé d'elle, en Dhu al-Qa'da de l'an 5 AH, abolissant ainsi par acte la règle d'adoption jahili qui traitait l'épouse d'un fils adoptif comme l'épouse d'un fils biologique; des versets de la sourate al-Ahzab furent révélés à ce sujet et les hypocrites répandirent de la propagande à ce sujet."
  ur: "ذی القعدہ 5 ہجری میں زید بن حارثہ کی طلاق کے بعد نبی نے زینب بنت جحش سے شادی کی، اس جاہلی گود لینے کے اصول کو ختم کر دیا جس میں گود لیے ہوئے بیٹے کی بیوی کو حقیقی بیٹے کی بیوی سمجھا جاتا تھا۔ اس کے بارے میں سورۃ الاحزاب کی آیات نازل ہوئیں اور منافقین نے اس کے ارد گرد پروپیگنڈہ پھیلا دیا۔"
