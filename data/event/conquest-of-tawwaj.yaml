label: { ar: "فتح توج", en: "Conquest of Tawwaj", es: "Conquista de Tawwaj", fr: "Conquête de Tawwaj", ur: "فتح تواج", tr: "Touj'un Açılışı", id: "Pembukaan Touj" }
summary:
  ar: "لما ولى عمر عثمان بن أبي العاص البحرين وعمان فدوخهما وجه أخاه الحكم بن أبي العاص في البحر إلى فارس في جيش عظيم من عبد القيس والأزد وتميم وبني ناجية ففتح جزيرة أبر كاوان ثم صار إلى توج من أرض أردشير خرة وفي رواية أبي مخنف أن عثمان بن أبي العاص نفسه قطع البحر إلى فارس فنزل توج ففتحها وبنى بها المساجد وجعلها داراً للمسلمين وأسكنها عبد القيس وغيرهم فكان يغير منها على أرجان ثم شخص إلى عمان والبحرين واستخلف أخاه الحكم وقال غير أبي مخنف إن الحكم فتح توج وأنزلها المسلمين سنة ١٩."
  en: "When Umar gave Uthman ibn Abi al-As Bahrain and Uman, pacified and obedient, he sent his brother al-Hakam by sea to Fars with a great host of Abd al-Qays, Azd, Tamim and Najiya — taking the island Abr Kawan, then Tawwaj of Ardashir-Khurra's land. In Abu Mikhnaf's telling Uthman himself crossed, took Tawwaj, built its mosques, made it a Muslim settlement-house for Abd al-Qays and raided Arrajan from it till Umar's letter recalled him — others say al-Hakam opened it and settled the Muslims in 19h."
  es: "Cuando Umar entregó a Uthman ibn Abi al-As Bahrain y a Uman, apaciguados y obedientes, envió a su hermano al-Hakam por mar a Fars con un gran ejército de Abd al-Qays, Azd, Tamim y Najiya, tomando la isla de Abr Kawan y luego Tawwaj de la tierra de Ardashir-Khurra. Según el relato de Abu Mikhnaf, el propio Uthman cruzó, tomó Tawwaj, construyó sus mezquitas, la convirtió en un asentamiento musulmán para Abd al-Qays y saqueó Arrajan desde allí hasta que la carta de Umar lo llamó de vuelta; otros dicen que al-Hakam la abrió y asentó a los musulmanes en el año 19."
  fr: "Lorsque Umar confia Bahreïn à Uthman ibn Abi al-As et qu'Uman, apaisé et obéissant, il envoya son frère al-Hakam par la mer vers le Fars avec une importante armée composée d'Abd al-Qays, Azd, Tamim et Najiya. Ils s'emparèrent de l'île d'Abr Kawan, alors appelée Tawwaj, sur les terres d'Ardashir-Khurra. Selon le récit d'Abu Mikhnaf, Uthman traversa lui-même la mer, prit Tawwaj, y fit construire des mosquées, en fit un lieu de peuplement musulman pour Abd al-Qays et mena des raids contre Arrajan depuis cette île, jusqu'à ce qu'une lettre d'Umar le rappelle. D'autres affirment qu'al-Hakam s'en empara et y installa les musulmans en l'an 19 de l'Hégire."
  ur: "جب عمر نے عثمان بن ابی العاص بحرین اور عمان کو مطمئن اور فرمانبردار دیا تو اس نے اپنے بھائی الحکم کو عبد القیس، ازد، تمیم اور ناجیہ کے ایک بڑے لشکر کے ساتھ سمندری راستے سے فارس بھیج دیا - جزیرہ ابر کاون لے کر پھر اردشیر خرہ کی سرزمین کا توج۔ ابو مخنف کے کہنے میں کہ عثمان نے خود تجاوز کیا، تواج لیا، اس کی مساجد تعمیر کیں، اسے عبد القیس کے لیے مسلمانوں کی بستی بنایا اور اس سے ارجان پر چھاپہ مارا یہاں تک کہ عمر کے خط نے اسے واپس بلا لیا - دوسرے کہتے ہیں کہ الحکم نے اسے کھولا اور 19ھ میں مسلمانوں کو آباد کیا۔"
  tr: "Ömer, Osman ibn Abi el-As'ı Bahreyn ve Umman valisi olarak atadığında, Osman bu bölgeleri fethetti. Kardeşi el-Hakam ibn Abi el-As'ı, Abd el-Kays, el-Azd, Tamim ve Beni Neciye'den oluşan büyük bir orduyla deniz yoluyla İran'a gönderdi. El-Hakam, Abar Kawan adasını fethetti, ardından Ardaşir Khurra topraklarındaki Tavaj'a gitti. Ebu Mikhnaf'ın anlatımına göre, Osman ibn Abi el-As bizzat deniz yoluyla İran'a geçti, Tavaj'a çıktı, orayı fethetti, orada camiler inşa etti, Müslümanlar için bir yurt haline getirdi ve Abd el-Kays ile diğerlerini oraya yerleştirdi. Oradan Arjan'a baskınlar düzenlerdi. Sonra Umman ve Bahreyn'e gitti ve kardeşi el-Hakam'ı halefi olarak atadı. Ebu Mikhnaf'ın yanı sıra başkaları da el-Hakam'ın Tavaj'ı fethettiğini ve 19 yılında Müslümanları oraya yerleştirdiğini söyler."
  id: "Ketika Umar mengangkat Utsman bin Abi al-As sebagai gubernur Bahrain dan Oman, ia menaklukkan kedua wilayah tersebut. Ia mengirim saudaranya, al-Hakam bin Abi al-As, melalui laut ke Persia dengan pasukan besar yang terdiri dari Abd al-Qays, al-Azd, Tamim, dan Bani Najiyah. Ia menaklukkan pulau Abar Kawan, kemudian pergi ke Tawaj di tanah Ardashir Khurra. Dalam catatan Abu Mikhnaf, Utsman bin Abi al-As sendiri menyeberangi laut ke Persia, mendarat di Tawaj, menaklukkannya, membangun masjid di sana, menjadikannya tempat tinggal bagi kaum Muslim, dan menempatkan Abd al-Qays dan lainnya di sana. Ia biasa menyerang Arjan dari sana. Kemudian ia pergi ke Oman dan Bahrain dan mengangkat saudaranya, al-Hakam, sebagai penggantinya. Selain Abu Mikhnaf, ada pula yang mengatakan bahwa al-Hakam menaklukkan Tawaj dan menempatkan kaum Muslim di sana pada tahun 19."
