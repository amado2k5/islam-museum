label: { ar: "هدم المسجد النبوي وإعادة بنائه في عهد الوليد", en: "The Demolition and Rebuilding of the Prophet's Mosque under al-Walid" }
summary:
  ar: "في صفر سنة ثمان وثمانين ابتُدئ بهدم مسجد رسول الله، وبعث الوليد إلى ملك الروم يعلمه بذلك ويطلب معونته، فبعث إليه بمائة ألف مثقال ذهب ومائة عامل وأربعين حملاً من الفسيفساء {cite:tabari-tarikh-abu-al-fadl j.6 p.436}، وعند السيوطي شرع الوليد في بناء جامع دمشق وكتب بتوسيع المسجد النبوي وبنائه سنة سبع وثمانين {cite:tarikh-khulafa-minhaj-1434 p. 367} ويذكر الكتاب أن الوليد أراد توسعة المسجد النبوي فأدخل حجر أمهات المؤمنين وحجرة فاطمة وحجرة عائشة في المسجد، وأن عمر بن عبد العزيز بلغه الأمر من المدينة فجمع الفقهاء العشرة ووجوه الناس، فأنكروا ذلك وكرهوه. {cite:salabi-umayyad-state-2020 p.129-130} ويذكر الكتاب أن الفقهاء رأوا أن تُترك الحجرات على حالها، وأن عمر بن عبد العزيز كتب إلى الوليد بما أجمع عليه الفقهاء العشرة، فأمره الوليد بتجديد البناء كما أراد. {cite:salabi-umayyad-state-2020 p.130-131}"
  en: "In Safar of the year 88 the demolition of the Prophet's Mosque began. Al-Walid informed the king of the Romans of this and asked for his help, and the king sent him a hundred thousand mithqals of gold, a hundred workers and forty loads of mosaic {cite:tabari-tarikh-abu-al-fadl j.6 p.436}. According to al-Suyuti, al-Walid began building the Mosque of Damascus, and he ordered the widening and rebuilding of the Prophet's Mosque in the year 87 {cite:tarikh-khulafa-minhaj-1434 p. 367}. The same book relates that al-Walid wished to widen the Prophet's Mosque and brought into it the chambers of the Mothers of the Believers, the chamber of Fatima and the chamber of Aisha; when the matter reached Umar ibn Abd al-Aziz from Medina, he gathered the ten jurists and the notables, and they disapproved of it and disliked it. {cite:salabi-umayyad-state-2020 p.129-130} The book relates that the jurists judged the chambers should be left as they were, and that Umar ibn Abd al-Aziz wrote to al-Walid with what the ten jurists agreed upon, and al-Walid ordered him to rebuild as he wished. {cite:salabi-umayyad-state-2020 p.130-131}"
