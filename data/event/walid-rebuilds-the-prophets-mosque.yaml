label: { ar: "هدم المسجد النبوي وإعادة بنائه في عهد الوليد", en: "The Demolition and Rebuilding of the Prophet's Mosque under al-Walid", es: "La demolición y reconstrucción de la Mezquita del Profeta bajo el mandato de al-Walid.", fr: "La démolition et la reconstruction de la mosquée du Prophète sous al-Walid", ur: "الولید کے تحت مسجد نبوی کی مسماری اور دوبارہ تعمیر" }
summary:
  ar: "في صفر سنة ثمان وثمانين ابتُدئ بهدم مسجد رسول الله، وبعث الوليد إلى ملك الروم يعلمه بذلك ويطلب معونته، فبعث إليه بمائة ألف مثقال ذهب ومائة عامل وأربعين حملاً من الفسيفساء {cite:tabari-tarikh-abu-al-fadl j.6 p.436}، وعند السيوطي شرع الوليد في بناء جامع دمشق وكتب بتوسيع المسجد النبوي وبنائه سنة سبع وثمانين {cite:tarikh-khulafa-minhaj-1434 p. 367} ويذكر الكتاب أن الوليد أراد توسعة المسجد النبوي فأدخل حجر أمهات المؤمنين وحجرة فاطمة وحجرة عائشة في المسجد، وأن عمر بن عبد العزيز بلغه الأمر من المدينة فجمع الفقهاء العشرة ووجوه الناس، فأنكروا ذلك وكرهوه. {cite:salabi-umayyad-state-2020 p.129-130} ويذكر الكتاب أن الفقهاء رأوا أن تُترك الحجرات على حالها، وأن عمر بن عبد العزيز كتب إلى الوليد بما أجمع عليه الفقهاء العشرة، فأمره الوليد بتجديد البناء كما أراد. {cite:salabi-umayyad-state-2020 p.130-131}"
  en: "In Safar of the year 88 the demolition of the Prophet's Mosque began. Al-Walid informed the king of the Romans of this and asked for his help, and the king sent him a hundred thousand mithqals of gold, a hundred workers and forty loads of mosaic {cite:tabari-tarikh-abu-al-fadl j.6 p.436}. According to al-Suyuti, al-Walid began building the Mosque of Damascus, and he ordered the widening and rebuilding of the Prophet's Mosque in the year 87 {cite:tarikh-khulafa-minhaj-1434 p. 367}. The same book relates that al-Walid wished to widen the Prophet's Mosque and brought into it the chambers of the Mothers of the Believers, the chamber of Fatima and the chamber of Aisha; when the matter reached Umar ibn Abd al-Aziz from Medina, he gathered the ten jurists and the notables, and they disapproved of it and disliked it. {cite:salabi-umayyad-state-2020 p.129-130} The book relates that the jurists judged the chambers should be left as they were, and that Umar ibn Abd al-Aziz wrote to al-Walid with what the ten jurists agreed upon, and al-Walid ordered him to rebuild as he wished. {cite:salabi-umayyad-state-2020 p.130-131}"
  es: "En Safar del año 88 comenzó la demolición de la Mezquita del Profeta. Al-Walid informó al rey de los romanos de esto y pidió su ayuda, y el rey le envió cien mil mithqals de oro, cien trabajadores y cuarenta cargas de mosaico {cite:tabari-tarikh-abu-al-fadl j.6 p.436}. Según al-Suyuti, al-Walid comenzó a construir la Mezquita de Damasco, y ordenó la ampliación y reconstrucción de la Mezquita del Profeta en el año 87 {cite:tarikh-khulafa-minhaj-1434 p. 367}. El mismo libro relata que al-Walid deseaba ampliar la Mezquita del Profeta y trajo a ella las cámaras de las Madres de los Creyentes, la cámara de Fátima y la cámara de Aisha; Cuando el asunto llegó a oídos de Umar ibn Abd al-Aziz desde Medina, reunió a los diez juristas y a los notables, quienes lo desaprobaron y lo rechazaron. {cite:salabi-umayyad-state-2020 p.129-130} El libro relata que los juristas consideraron que las cámaras debían permanecer como estaban, y que Umar ibn Abd al-Aziz escribió a al-Walid con la opinión de los diez juristas, y al-Walid le ordenó reconstruirlas según su criterio. {cite:salabi-umayyad-state-2020 p.130-131}"
  fr: "En Safar de l'an 88, la démolition de la Mosquée du Prophète commença. Al-Walid en informa le roi des Romains et lui demanda son aide. Le roi lui envoya cent mille mithqals d'or, cent ouvriers et quarante charges de mosaïque (voir: Tabari-Tarikh-Abu-Al-Fadl, vol. 6, p. 436). Selon al-Suyuti, al-Walid entreprit la construction de la Mosquée de Damas et ordonna l'agrandissement et la reconstruction de la Mosquée du Prophète en l'an 87 (voir: Tarikh-Khulafa-Minhaj, vol. 1434, p. 367). Le même ouvrage rapporte qu'al-Walid souhaitait agrandir la Mosquée du Prophète et y fit intégrer les chambres des Mères des Croyants, la chambre de Fatima et la chambre d'Aïcha. Lorsque l'affaire parvint à Umar ibn Abd al-Aziz de Médine, il réunit les dix juristes et les notables, qui la désapprouvèrent et la rejetèrent. {cite:salabi-umayyad-state-2020 p.129-130} L'ouvrage rapporte que les juristes décidèrent que les chambres devaient rester en l'état, et qu'Umar ibn Abd al-Aziz écrivit à al-Walid pour lui faire part de la décision des dix juristes. Al-Walid lui ordonna alors de reconstruire selon ses souhaits. {cite:salabi-umayyad-state-2020 p.130-131}"
  ur: "سن 88 کے صفر میں مسجد نبوی کی انہدام کا آغاز ہوا۔ الولید نے رومیوں کے بادشاہ کو اس کی اطلاع دی اور اس سے مدد طلب کی اور بادشاہ نے اس کے لیے ایک لاکھ مثقال سونا، ایک سو مزدور اور چالیس وزنی مسواک بھیجی۔ السیوطی کے مطابق، الولید نے دمشق کی مسجد کی تعمیر شروع کی، اور اس نے سن 87 میں مسجد نبوی کو چوڑا اور دوبارہ تعمیر کرنے کا حکم دیا۔ 367}۔ اسی کتاب میں بتایا گیا ہے کہ الولید نے مسجد نبوی کو کشادہ کرنا چاہا اور اس میں مومنین کی ماؤں کے حجرے، فاطمہ کے حجرے اور عائشہ کے حجرے کو لایا۔ جب بات مدینہ سے عمر بن عبدالعزیز تک پہنچی تو انہوں نے دس فقہاء اور مشائخ کو جمع کیا تو انہوں نے اسے ناپسند کیا اور ناپسند کیا۔ کتاب میں بتایا گیا ہے کہ فقہا نے فیصلہ کیا کہ ایوانوں کو ویسا ہی چھوڑ دیا جائے جیسا کہ وہ تھے اور عمر بن عبدالعزیز نے الولید کو لکھا جس پر دس فقہا نے اتفاق کیا، اور الولید نے اسے حکم دیا کہ وہ دوبارہ تعمیر کرے۔ {حوالہ: سلبی-امیاد-ریاست-2020 صفحہ 130-131}"
