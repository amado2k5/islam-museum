label: { ar: "إقطاع معز الدولة السواد لقواده وجنده سنة 334هـ", en: "Mu'izz al-Dawla grants the Sawad as iqta' to his commanders and troops, 334 AH", ur: "334ھ میں معز الدولہ کا سواد کو اپنے سرداروں اور سپاہیوں میں بطور اقطاع بانٹنا", es: "Mu'izz al-Dawla concede el Sawad como iqta' a sus comandantes y tropas, 334 AH.", fr: "Mu'izz al-Dawla accorde le Sawad comme iqta' à ses commandants et à ses troupes, en 334 AH.", tr: "Mu'izz al-Dawla, Hicri 334 yılında Sawad bölgesini komutanlarına ve askerlerine bağışladı.", id: "Mu'izz al-Dawla memberikan wilayah Sawad kepada para komandan dan tentaranya pada tahun 334 Hijriah." }
summary:
  ar: "بعد شغب الديلم على معز الدولة سنة 334هـ وعجزه عن أرزاقهم أقطع قواده وخواصه وأتراكه ضياع السلطان وضياع المستترين وحق بيت المال في ضياع الرعية، فصار أكثر السواد مغلقاً وزالت عنه أيدي العمال، وجُمعت الأعمال في ديوان واحد؛ ويعقد مسكويه فصلاً في سوء عاقبة هذا التدبير: خراب البلاد وبطلان الدواوين وفساد العساكر والتنافس بين الديلم والأتراك {cite:tajarib-al-umam-surush-v6 p. 128-133}."
  en: "After the Daylamites mutinied against Mu'izz al-Dawla in 334 AH over their pay, he granted his commanders, intimates and Turks the sultan's estates, the estates of those in hiding and the treasury's share in the subjects' estates. Most of the Sawad was closed to the tax officials and the bureaus were merged into one. Miskawayh devotes a chapter to the outcome: ruined land, defunct bureaus, a corrupted army and rivalry between Daylamites and Turks {cite:tajarib-al-umam-surush-v6 p. 128-133}."
  es: "Tras el motín de los daylamitas contra Mu'izz al-Dawla en el año 334 de la Hégira por su salario, este concedió a sus comandantes, allegados y turcos las propiedades del sultán, las de quienes se escondían y la parte del tesoro correspondiente a las propiedades de los súbditos. La mayor parte del Sawad quedó cerrada a los funcionarios tributarios y las oficinas se fusionaron en una sola. Miskawayh dedica un capítulo a las consecuencias: tierras arruinadas, oficinas disueltas, un ejército corrupto y rivalidad entre daylamitas y turcos {cite:tajarib-al-umam-surush-v6 p. 128-133}."
  fr: "Après la mutinerie des Daylamites contre Mu'izz al-Dawla en 334 AH au sujet de leur solde, ce dernier accorda à ses commandants, ses proches et aux Turcs les domaines du sultan, ceux des personnes cachées et la part du trésor dans les biens des sujets. La majeure partie du Sawad fut interdite aux agents du fisc et les administrations fusionnèrent. Miskawayh consacre un chapitre aux conséquences de cette situation: terres dévastées, administrations inopérantes, armée corrompue et rivalité exacerbée entre Daylamites et Turcs (voir: Tajarib al-Unam Surush, vol. 6, p. 128-133)."
  ur: "334 ہجری میں دیلامیوں کے معاذ الدولہ کے خلاف ان کی تنخواہ پر بغاوت کے بعد، اس نے اپنے کمانڈروں، مقربوں اور ترکوں کو سلطان کی جاگیریں، چھپنے والوں کی جاگیریں اور رعایا کی جاگیروں میں خزانے کا حصہ دیا۔ سواد کا بیشتر حصہ ٹیکس حکام کے لیے بند کر دیا گیا اور بیوروز کو ایک میں ضم کر دیا گیا۔ مسکاویہ نے نتیجہ کے لیے ایک باب مختص کیا ہے: تباہ شدہ زمین، ناکارہ دفتر، ایک بگڑی ہوئی فوج اور دیلامائٹس اور ترکوں کے درمیان دشمنی 128-133}۔"
  tr: "Hicri 334 yılında Delamîler Mu'izz el-Dawla'ya karşı ayaklanınca ve onun kendilerine gerekeni sağlayamaması üzerine, komutanlarını, sırdaşlarını ve Türklerini Sultan'ın mülklerinden, gizli kişilerin mülklerinden ve hazinenin tebaanın mülkleri üzerindeki hakkından mahrum etti. Böylece, Sawad'ın büyük bir kısmı kapatıldı, işçilerin elleri oradan çekildi ve işler tek bir Divan'da toplandı. Miskawayh, bu önlemin kötü sonuçlarına bir bölüm ayırır: ülkenin yıkımı, Divanların geçersiz kılınması, orduların yozlaşması ve Delamîler ile Türkler arasındaki rekabet. {cite:tajarib-al-umam-surush-v6 s. 128-133}."
  id: "Setelah kaum Daylam memberontak melawan Mu’izz al-Dawla pada tahun 334 H dan ketidakmampuannya untuk memenuhi kebutuhan mereka, ia memutus hubungan para komandannya, orang-orang kepercayaannya, dan orang-orang Turki dari tanah milik Sultan, tanah milik orang-orang tersembunyi, dan hak perbendaharaan atas tanah milik rakyat. Dengan demikian, sebagian besar Sawad menjadi tertutup, dan tangan para pekerja disingkirkan, dan pekerjaan dikumpulkan di satu Diwan. Miskawayh mendedikasikan satu bab untuk konsekuensi buruk dari tindakan ini: kehancuran negara, pembatalan Diwan, korupsi tentara, dan persaingan antara kaum Daylam dan Turki. {cite:tajarib-al-umam-surush-v6 p. 128-133}."
