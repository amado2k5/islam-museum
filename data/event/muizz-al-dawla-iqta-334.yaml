label: { ar: "إقطاع معز الدولة السواد لقواده وجنده سنة 334هـ", en: "Mu'izz al-Dawla grants the Sawad as iqta' to his commanders and troops, 334 AH", ur: "334ھ میں معز الدولہ کا سواد کو اپنے سرداروں اور سپاہیوں میں بطور اقطاع بانٹنا" }
summary:
  ar: "بعد شغب الديلم على معز الدولة سنة 334هـ وعجزه عن أرزاقهم أقطع قواده وخواصه وأتراكه ضياع السلطان وضياع المستترين وحق بيت المال في ضياع الرعية، فصار أكثر السواد مغلقاً وزالت عنه أيدي العمال، وجُمعت الأعمال في ديوان واحد؛ ويعقد مسكويه فصلاً في سوء عاقبة هذا التدبير: خراب البلاد وبطلان الدواوين وفساد العساكر والتنافس بين الديلم والأتراك {cite:tajarib-al-umam-surush-v6 p. 128-133}."
  en: "After the Daylamites mutinied against Mu'izz al-Dawla in 334 AH over their pay, he granted his commanders, intimates and Turks the sultan's estates, the estates of those in hiding and the treasury's share in the subjects' estates. Most of the Sawad was closed to the tax officials and the bureaus were merged into one. Miskawayh devotes a chapter to the outcome: ruined land, defunct bureaus, a corrupted army and rivalry between Daylamites and Turks {cite:tajarib-al-umam-surush-v6 p. 128-133}."
