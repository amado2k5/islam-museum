label: { ar: "عزم المعتضد على لعن معاوية على المنابر" }
summary:
  ar: "قال ابن جرير في سنة أربع وثمانين عزم المعتضد على لعنة معاوية على المنابر فخوفه عبيد الله الوزير اضطراب العامة فلم يلتفت وكتب كتاباً ذكر فيه كثيراً من مناقب علي وثكب معاوية فقال له القاضي يوسف يا أمير المؤمنين أخاف الفتنة عند سماعه فقال إن تحركت العامة وضعت السيف فيها قال فما تصنع بالعلويين الذين هم في كل ناحية قد خرجوا عليك وإذا سمع الناس هذا من فضائل أهل البيت كانوا إليهم أميل فأمسك المعتضد عن ذلك {cite:tarikh-khulafa-minhaj-1434 p. 574-575}."
  en: "In 284, per Ibn Jarir, al-Mu'tadid resolved to curse Mu'awiya on the minbars; the vizier Ubayd Allah's warning of popular unrest failed to move him, and he had a document written full of Ali's virtues and Mu'awiya's censures. Qadi Yusuf asked: 'what of the Alawids risen against you in every quarter — if people hear the house's merits they will incline to them' — and al-Mu'tadid desisted {cite:tarikh-khulafa-minhaj-1434 p. 574-575}."
