label: { ar: "عزم المعتضد على لعن معاوية على المنابر", en: "Al-Mu'tadid's resolve to curse Mu'awiya from the pulpits", es: "La determinación de Al-Mu'tadid de maldecir a Mu'awiya desde los púlpitos.", fr: "La détermination d'Al-Mu'tadid à maudire Mu'awiya depuis les chaires", ur: "المتدید کا منبروں سے معاویہ پر لعنت بھیجنے کا عزم", tr: "El-Mu'tadid, Mu'awiya'yı minberden lanetlemeye karar verdi", id: "Al-Mu'tadid memutuskan untuk mengutuk Mu'awiya dari mimbar" }
summary:
  ar: "قال ابن جرير في سنة أربع وثمانين عزم المعتضد على لعنة معاوية على المنابر فخوفه عبيد الله الوزير اضطراب العامة فلم يلتفت وكتب كتاباً ذكر فيه كثيراً من مناقب علي وثكب معاوية فقال له القاضي يوسف يا أمير المؤمنين أخاف الفتنة عند سماعه فقال إن تحركت العامة وضعت السيف فيها قال فما تصنع بالعلويين الذين هم في كل ناحية قد خرجوا عليك وإذا سمع الناس هذا من فضائل أهل البيت كانوا إليهم أميل فأمسك المعتضد عن ذلك {cite:tarikh-khulafa-minhaj-1434 p. 574-575}. وعند ابن الجوزي رواية أشد: عزم المعتضد على لعن معاوية بن أبي سفيان على المنابر وأمر بإنشاء كتاب يُقرأ على الناس، فخوّفه عبيد الله بن سليمان اضطراب العامة وحذّره الفتنة فلم يلتفت إلى قوله، وعملت النسخ وقُرئت بالجانبين يوم الأربعاء لست بقين من جمادى الأولى، وتقدّم إلى العوام بترك العصبية ومنع القصّاص القعود في الجامع والطرقات، وتقدّم إلى الذين يسقون الماء في الجامع أن لا يترحموا على معاوية ولا يذكروه، وخرج مكتوب بذلك على الناس {cite:muntazam-ibn-al-jawzi p. 172}."
  en: "In 284, per Ibn Jarir, al-Mu'tadid resolved to curse Mu'awiya on the minbars; the vizier Ubayd Allah's warning of popular unrest failed to move him, and he had a document written full of Ali's virtues and Mu'awiya's censures. Qadi Yusuf asked: 'what of the Alawids risen against you in every quarter — if people hear the house's merits they will incline to them' — and al-Mu'tadid desisted {cite:tarikh-khulafa-minhaj-1434 p. 574-575}."
  es: "En 284, según Ibn Jarir, al-Mu'tadid decidió maldecir a Mu'awiya en los minbares; la advertencia del visir Ubayd Allah sobre el descontento popular no lo conmovió, y mandó escribir un documento lleno de virtudes de Ali y censuras de Mu'awiya. El cadí Yusuf preguntó: «¿Qué hay de los alauitas que se han alzado contra ti en todas partes? Si la gente oye hablar de los méritos de la casa, se inclinará hacia ellos», y al-Mu'tadid desistió {cite:tarikh-khulafa-minhaj-1434 p. 574-575}."
  fr: "En 284, selon Ibn Jarir, al-Mu'tadid résolut de maudire Mu'awiya sur les minbars. L'avertissement du vizir Ubayd Allah concernant les troubles populaires resta sans effet sur lui, et il fit rédiger un document vantant les mérites d'Ali et critiquant Mu'awiya. Le cadi Yusuf demanda: « Qu'en est-il des Alaouites qui se sont soulevés contre toi de toutes parts ? Si le peuple entend les mérites de cette maison, il se ralliera à elle. » Al-Mu'tadid renonça alors à son projet (voir Tarikh-Khulafa-Minhaj-1434, p. 574-575)."
  ur: "284 میں، ابن جریر کے مطابق، المتدید نے منبر پر معاویہ پر لعنت بھیجنے کا فیصلہ کیا۔ عوامی بدامنی کے بارے میں وزیر عبید اللہ کا انتباہ اسے منتقل کرنے میں ناکام رہا، اور اس کے پاس ایک دستاویز تھی جو علی کے فضائل اور معاویہ کی مذمت سے بھری ہوئی تھی۔ قادی یوسف نے پوچھا: 'ہر سہ ماہی میں آپ کے خلاف کیا علوی اٹھے ہیں - اگر لوگ گھر کی خوبیاں سنیں تو وہ ان کی طرف مائل ہوں گے' - اور المتدید نے ترک کر دیا {حوالہ: تاریخ الخلفاء منہاج 1434 ص۔ 574-575}۔"
  tr: "İbn Jarir, 84. yılda Mu'tedid'in minberde Mu'aviye'ye lanet okumayı planladığını, ancak vezir Ubeydullah'ın onu halkın huzursuzluğu konusunda uyardığını, bu yüzden Mu'tedid'in buna aldırış etmediğini ve Ali'nin birçok erdemini zikredip Mu'aviye'yi kötüleyen bir kitap yazdığını söyledi. Kadı Yusuf ona, \"Ey Müminlerin Emiri, bunu duyduğunda fitne çıkmasından korkuyorum\" dedi. Mu'tedid, \"Halk ayaklanırsa, kılıcımı çekeceğim\" dedi. Yusuf, \"Her bölgede sana isyan eden Alevilerle ne yapacaksın? Ve insanlar Peygamber ailesinin erdemleri hakkında bunu duyarlarsa, onlara daha çok meyilli olacaklar\" dedi. Bunun üzerine Mu'tedid bundan vazgeçti. {kaynak:tarikh-khulafa-minhaj-1434 s. 574-575} İbn el-Cevzi ise daha sert bir anlatıma sahiptir: El-Mu'tedid, minberlerde Mu'aviye ibn Ebu Sufyan'ı lanetlemeye karar verdi ve halka okunacak bir kitap hazırlanmasını emretti. Ubeydullah ibn Süleyman onu halkın huzursuzluğu konusunda uyardı ve fitneye karşı ikaz etti, ancak o sözlerine kulak asmadı. Kopyalar yapıldı ve Cemâdî Ula ayının altıncı günü Çarşamba günü iki taraflı okundu. Halkı fanatizmden vazgeçmeye çağırdı ve hikaye anlatıcılarının camide ve sokaklarda oturmasını engelledi. Camiyi sulayanlara Mu'aviye'ye merhamet göstermemelerini ve ondan bahsetmemelerini emretti ve bu konuda halka yazılı bir bildirim yayınlandı. {cite:muntazam-ibn-al-jawzi s. 172}"
  id: "Ibn Jarir berkata bahwa pada tahun 184, Al-Mu’tadid bermaksud mengutuk Mu’awiya di mimbar-mimbar, tetapi menteri Ubayd Allah memperingatkannya tentang keresahan masyarakat, sehingga ia tidak mengindahkan peringatan itu dan menulis sebuah buku di mana ia menyebutkan banyak kebaikan Ali dan mencela Mu’awiya. Hakim Yusuf berkata kepadanya, “Wahai Amirul Mukminin, aku khawatir akan terjadi pemberontakan ketika ia mendengarnya.” Ia berkata, “Jika masyarakat bergejolak, aku akan menggunakan pedang untuk melawannya.” Ia berkata, “Apa yang akan kau lakukan terhadap kaum Alawiyah yang berada di setiap wilayah dan telah memberontak terhadapmu? Dan jika orang-orang mendengar tentang kebaikan keluarga Nabi, mereka akan lebih condong kepada mereka.” Maka Al-Mu’tadid menahan diri dari hal itu. {cite:tarikh-khulafa-minhaj-1434 p. 574-575}. Dan Ibn al-Jawzi memiliki catatan yang lebih keras: Al-Mu’tadid memutuskan untuk mengutuk Mu’awiya ibn Abi Sufyan di mimbar dan memerintahkan pembuatan sebuah buku untuk dibacakan kepada orang-orang. Ubayd Allah ibn Sulayman memperingatkannya tentang keresahan massa dan menasihatinya agar tidak melakukan hasutan, tetapi dia tidak mengindahkan kata-katanya. Salinan buku itu dibuat dan dibacakan di kedua sisinya pada hari Rabu, tanggal enam Jumada al-Ula. Dia menginstruksikan rakyat jelata untuk meninggalkan fanatisme dan melarang para pendongeng duduk di masjid dan di jalan-jalan. Dia menginstruksikan mereka yang menyirami masjid untuk tidak menunjukkan belas kasihan kepada Mu’awiya atau menyebut namanya, dan pemberitahuan tertulis tentang hal itu dikeluarkan kepada orang-orang. {cite:muntazam-ibn-al-jawzi p. 172}"
