label: { en: "The death of Amina at al-Abwa", ar: "وفاة آمنة بالأبواء", es: "La muerte de Amina en al-Abwa", fr: "La mort d'Amina à al-Abwa", ur: "آمنہ کی وفات العبواء میں" }
summary:
  en: "On the way back from a month in Yathrib visiting the grave of her husband, Amina bint Wahb fell ill and died at al-Abwa between Mecca and Medina, leaving her six-year-old son an orphan a second time."
  ar: "في طريق العودة من زيارة قبر زوجها بيثرب بعد مقام شهر، دهم المرض آمنة بنت وهب فماتت بالأبواء بين مكة والمدينة، فتيتم ابنها ذو السنين الست مرة ثانية."
  es: "De regreso tras pasar un mes en Yathrib visitando la tumba de su esposo, Amina bint Wahb enfermó y murió en al-Abwa, entre La Meca y Medina, dejando a su hijo de seis años huérfano por segunda vez."
  fr: "Sur le chemin du retour d'un mois passé à Yathrib à se recueillir sur la tombe de son mari, Amina bint Wahb tomba malade et mourut à al-Abwa, entre La Mecque et Médine, laissant son fils de six ans orphelin pour la deuxième fois."
  ur: "یثرب میں ایک ماہ سے اپنے شوہر کی قبر کی زیارت سے واپسی پر، آمنہ بنت وہب بیمار ہوگئیں اور مکہ اور مدینہ کے درمیان العبوا میں انتقال کر گئیں، جس سے اس کا چھ سالہ بیٹا دوسری بار یتیم ہوگیا۔"
