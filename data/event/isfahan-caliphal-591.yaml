label: { ar: "ملك عسكر الخليفة أصفهان", en: "The caliphal army's takeover of Isfahan (591 AH)", es: "La toma de Isfahán por el ejército califal (591 AH)", fr: "La prise d'Ispahan par l'armée califale (591 AH)", ur: "خلیفہ کی فوج کا اصفہان پر قبضہ ⁦(591ھ)⁩", tr: "Malik Askar el-Halife İsfahan", id: "Malik Askar al-Khalifa Isfahan" }
summary:
  ar: "في سنة إحدى وتسعين وخمسمائة جهّز الخليفة الناصر لدين الله جيشاً مقدمهم سيف الدين طغرل مقطع بلد اللحف من العراق إلى أصفهان، وكان بها عسكر لخوارزم شاه مع ولده وأهلها يكرهونهم، فكتب صدر الدين الخجندي رئيس الشافعية بأصفهان — وهو بعد الحاكم على جميع أهلها — إلى الديوان ببغداد يبذل من نفسه تسليم البلد إلى من يصل من عساكر الديوان؛ فوصلوا ونزلوا بظاهر البلد وفارقه الخوارزمية عائدين إلى خراسان وتبعهم بعض العسكر فأخذوا من ساقتهم من قدروا عليه، ودخل عسكر الخليفة أصفهان وملكوها {cite:kamil-ibn-al-athir p. 238-239}."
  en: "591: al-Nasir's troops under Sayf al-Din Tughril entered Isfahan after Sadr al-Din al-Khujandi — ra'is of its Shafi'is and de facto second ruler — offered the city to Baghdad's Diwan; the hated Khwarazmian garrison withdrew to Khurasan with the caliphals taking stragglers — a rare Abbasid territorial gain deep in the Jibal {cite:kamil-ibn-al-athir p. 238-239}."
  es: "591: Las tropas de al-Nasir, bajo el mando de Sayf al-Din Tughril, entraron en Isfahán después de que Sadr al-Din al-Khujandi — ra'is de sus shafi'is y segundo gobernante de facto — ofreciera la ciudad al Diwan de Bagdad; la odiada guarnición de Khwarazmian se retiró a Jorasán, y los califas se llevaron a los rezagados, una rara ganancia territorial abasí en lo profundo del Jibal {cite:kamil-ibn-al-athir p. 238-239}."
  fr: "591: les troupes d'al-Nasir sous Sayf al-Din Tughril entrèrent à Ispahan après que Sadr al-Din al-Khujandi — ra'is de ses Shafi'is et second dirigeant de facto — eut offert la ville au Diwan de Bagdad; la garnison khwarezmienne détestée se retira au Khorasan avec les califes emmenant les traînards — un rare gain territorial abbasside au cœur du Jibal {cite: kamil-ibn-al-athir p. 238-239}."
  ur: "591: سیف الدین تغرل کے ماتحت الناصر کی فوجیں اصفہان میں داخل ہوئیں جب صدرالدین الخجندی - اس کے شافعیوں کے رئیس اور حقیقت میں دوسرے حکمران - نے بغداد کے دیوان کو شہر کی پیشکش کی۔ خوارزمیوں سے نفرت کرنے والی فوج نے خلیفہ کے ساتھ خراسان کی طرف پسپائی اختیار کر لی - جبل میں ایک نادر عباسی علاقائی فائدہ {حوالہ: کامل ابن الاثیر صفحہ 238-239}۔"
  tr: "Hicri 591 yılında Halife el-Nasır li-Din Allah, Irak'tan İsfahan'a giden yolu kesmek için Seyf el-Din Tuğrul önderliğinde bir ordu hazırladı. Harezm Şah ve oğlunun ordusu vardı ve halkı onlardan nefret ediyordu. İsfahan'daki Şafiîlerin başı ve aynı zamanda tüm halkın hükümdarı olan Sadr el-Din el-Hucundi, Bağdat'taki Divan'a mektup yazarak, Divan'ın hangi ordusu gelirse gelsin şehri ona teslim etmeyi teklif etti. Ordu geldi ve şehrin dışında kamp kurdu, Harezmliler şehri terk ederek Horasan'a döndüler. Ordunun bir kısmı onları takip etti ve arka muhafızlarından alabildikleri kişileri ele geçirdi. Halifenin ordusu İsfahan'a girdi ve şehri ele geçirdi. {Kaynak: Kamil İbn el-Atir s. 238-239}"
  id: "Pada tahun 591 Hijriah, Khalifah al-Nasir li-Din Allah mempersiapkan pasukan, yang dipimpin oleh Saif al-Din Tughrul, untuk memutus hubungan kota al-Lahf dari Irak ke Isfahan. Terdapat pasukan Khwarazm Shah beserta putranya, dan penduduk kota membenci mereka. Sadr al-Din al-Khujandi, kepala mazhab Syafi'i di Isfahan—yang juga penguasa seluruh penduduknya—menulis surat kepada Diwan di Baghdad menawarkan diri untuk menyerahkan kota tersebut kepada pasukan Diwan mana pun yang tiba. Mereka tiba dan berkemah di luar kota, dan pasukan Khwarazm meninggalkannya, kembali ke Khorasan. Sebagian pasukan mengikuti mereka dan mengambil orang-orang yang bisa mereka tangkap dari barisan belakang mereka. Pasukan Khalifah memasuki Isfahan dan merebutnya. {cite:kamil-ibn-al-athir hlm. 238-239}"
