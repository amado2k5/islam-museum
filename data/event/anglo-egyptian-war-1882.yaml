summary:
  ar: "بطاقة أولية للحرب الإنجليزية المصرية سنة ١٨٨٢م، الحملة التي أسقطت الثورة العرابية في التل الكبير واحتلت مصر؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Anglo-Egyptian War of 1882, the campaign that broke Urabi's revolution at Tel el-Kebir and occupied Egypt; its sources are not yet checked on the page."
  es: "Ficha de borrador para la guerra anglo-egipcia de 1882, la campaña que desbarató la revolución de Urabi en Tel el-Kebir y ocupó Egipto; sus fuentes aún no han sido verificadas en la página."
  fr: "Fiche de campagne pour la guerre anglo-égyptienne de 1882, la campagne qui a brisé la révolution d'Urabi à Tel el-Kebir et occupé l'Égypte; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1882 کی اینگلو-مصری جنگ کے لیے ڈرافٹ کارڈ، وہ مہم جس نے تل الکبیر میں ارابی کے انقلاب کو توڑا اور مصر پر قبضہ کر لیا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1882 İngiliz-Mısır Savaşı'na dair ön bir açıklama; bu savaşta Tell El Kebir'deki Urabi İsyanı bastırılmış ve Mısır işgal edilmişti. Sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Sebuah uraian pendahuluan tentang Perang Inggris-Mesir tahun 1882, kampanye yang menghancurkan Pemberontakan Urabi di Tell El Kebir dan menduduki Mesir; sumber-sumber yang tercantum di halaman ini belum ditinjau."
