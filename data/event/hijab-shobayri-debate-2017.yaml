summary:
  ar: "مناظرة مطولة واسعة المشاهدة في العالم الناطق بالإنجليزية سنة 2017 بين الداعية السني [[person/muhammad-hijab|محمد حجاب]] والداعية الشيعي السيد علي الشوبيري في ثلاثة مباحث: حفظ القرآن، ومقام الصحابة، وعقيدة الإمامة؛ والتسجيل الكامل والتفريغ منشوران ومتداولان {cite:youtube-hijab-shobayri}."
  en: "A widely viewed long-form debate in the English-speaking world in 2017 between the Sunni speaker [[person/muhammad-hijab|Muhammad Hijab]] and the Shia speaker Sayed Ali al-Shobayri on three pillars: the preservation of the Qur'an, the standing of the Companions and the doctrine of the Imamate; the full recording and transcript are published and circulating {cite:youtube-hijab-shobayri}."
  es: "Un debate extenso y ampliamente visto en el mundo de habla inglesa en 2017 entre el orador sunita [[person/muhammad-hijab|Muhammad Hijab]] y el orador chiita Sayed Ali al-Shobayri sobre tres pilares: la preservación del Corán, la posición de los Compañeros y la doctrina del Imamato; la grabación completa y la transcripción están publicadas y circulan {cite:youtube-hijab-shobayri}."
  fr: "Un débat de longue durée largement suivi dans le monde anglophone en 2017 entre l'orateur sunnite [[person/muhammad-hijab|Muhammad Hijab]] et l'orateur chiite Sayed Ali al-Shobayri sur trois piliers: la préservation du Coran, le statut des Compagnons et la doctrine de l'Imamat; l'enregistrement complet et la transcription sont publiés et circulent {cite:youtube-hijab-shobayri}."
  ur: "2017 میں انگریزی بولنے والی دنیا میں سنی مقرر [[شخص/محمد-حجاب|محمد حجاب]] اور شیعہ مقرر سید علی الشوبائری کے درمیان تین ستونوں پر وسیع پیمانے پر دیکھی جانے والی طویل بحث: قرآن کی حفاظت، صحابہ کا موقف اور امامت کا عقیدہ؛ مکمل ریکارڈنگ اور ٹرانسکرپٹ شائع اور گردش کر رہے ہیں {حوالہ: یوٹیوب-حجاب-شوبیری}۔"
  tr: "2017 yılında İngilizce konuşulan dünyada Sünni vaiz Muhammed Hijab ile Şii vaiz Seyyid Ali el-Şobayri arasında Kur'an ezberi, Sahabelerin statüsü ve İmamet doktrini olmak üzere üç konu üzerine uzun ve geniş yankı uyandıran bir tartışma yaşandı; tartışmanın tam kaydı ve metni yayınlandı ve dolaşıma girdi {cite:youtube-hijab-shobayri}."
  id: "Debat panjang dan banyak disaksikan di dunia berbahasa Inggris pada tahun 2017 antara pendakwah Sunni [[person/muhammad-hijab|محمد حجاب]] dan pendakwah Syiah Sayyid Ali al-Shobayri mengenai tiga topik: hafalan Al-Qur'an, kedudukan para Sahabat, dan doktrin Imamah; rekaman dan transkrip lengkapnya dipublikasikan dan disebarluaskan {cite:youtube-hijab-shobayri}."
