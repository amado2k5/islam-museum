label:
  ar: كتب أبي القاسم إلى مخالفيه وبني معمر وخبر العبيد وآبار خيوان، 286هـ
  en: Abu al-Qasim's letters to his opponents and Banu Ma'mar, the slaves and the wells at Khiwan, 286 AH
  ur: ابو القاسم کے مخالفین اور بنو معمر کو خطوط، غلاموں اور خیوان کے کنوؤں کا بیان، 286ھ
summary:
  ar: يكتب أبو القاسم إلى مخالفيه بوقعة الهادي ونصره على بني الحارث، وإلى بني معمر يحثهم على الرجوع إلى الله وطرد العبيد الذين مع ابن الضحاك، وكانوا يقطعون الطريق على الضعفاء؛ ويُذكر دفن بئر يشرب منها الناس وطرح قطران في بئر بخيوان ليضيق الأمر بأبي القاسم فيخرج، ثم يعظهم ويذكّرهم بهمدان مع علي.
  en: Abu al-Qasim writes to his opponents of al-Hadi's fight and victory over Banu al-Harith, and to Banu Ma'mar urging them to turn back to God and drive out the slaves with Ibn al-Dahhak, who were cutting the road on the weak; a well the people drank from is buried, tar is thrown into a well at Khiwan to press Abu al-Qasim into leaving, and he admonishes them and reminds them of Hamdan with Ali.
  ur: ابو القاسم اپنے مخالفین کو ہادی کی لڑائی اور بنو حارث پر فتح کی خبر لکھتے ہیں، اور بنو معمر کو لکھتے ہیں کہ اللہ کی طرف لوٹیں اور ابن ضحاک کے ساتھ غلاموں کو نکال دیں جو کمزوروں پر راستے کاٹتے تھے؛ ایک کنواں جس سے لوگ پیتے تھے دفن کر دیا جاتا ہے اور خیوان کے ایک کنویں میں تارکول ڈالا جاتا ہے تاکہ ابو القاسم تنگ ہو کر نکل جائیں، اور وہ انہیں نصیحت کرتے اور ہمدان کا علی کے ساتھ ہونا یاد دلاتے ہیں۔
