id: event/ibn-habib-tarikh-atrak-777
class: event
kind: other
label:
  ar: "ابن حبيب يختم «تاريخ دولة الترك» عند سنة ٧٧٧هـ"
  en: "Ibn Habib brings his Tarikh Dawlat al-Atrak down to 777/1376"
  ur: "ابن حبیب نے «تاریخ دولۃ ترک» 777ھ/1376ء تک پہنچائی"
summary:
  ar: "أنها ابن حبيب تاريخه «دولة الترك» — وهو «درة الأسلاك في دولة الأتراك» — إلى سنة سبع وسبعين وسبعمائة، وذيّل عليه ولده أبو العز طاهر {cite:nujum-zahira 11/189}؛ وعند الزركلي أنه أرّخ به أخبارهم من سنة ٦٤٨هـ إلى ٧٧٨هـ {cite:al-aalam 2/218-219}."
  en: "Ibn Habib carried his Tarikh Dawlat al-Atrak — the Durrat al-Aslak fi Dawlat al-Atrak — down to the year 777, and his son Abu al-'Izz Tahir added a continuation {cite:nujum-zahira 11/189}; al-Zirikli describes it as recording their annals from 648 to 778 {cite:al-aalam 2/218-219}."
  ur: "ابن حبیب نے اپنی «تاریخ دولۃ ترک» — یعنی «درۃ الاسلاک فی دولۃ الاتراک» — سن 777ھ تک پہنچائی، اور بیٹے ابو العز طاہر نے اس پر ذیل لکھی {cite:nujum-zahira 11/189}؛ زرکلی کے مطابق اس نے ان کے واقعات 648ھ سے 778ھ تک درج کیے {cite:al-aalam 2/218-219}."
