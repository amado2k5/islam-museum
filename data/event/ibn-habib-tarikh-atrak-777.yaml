id: event/ibn-habib-tarikh-atrak-777
class: event
kind: other
label:
  ar: "ابن حبيب يختم «تاريخ دولة الترك» عند سنة ٧٧٧هـ"
  en: "Ibn Habib brings his Tarikh Dawlat al-Atrak down to 777/1376"
  ur: "ابن حبیب نے «تاریخ دولۃ ترک» 777ھ/1376ء تک پہنچائی"
  es: "Ibn Habib reduce su Tarikh Dawlat al-Atrak a 777/1376"
  fr: "Ibn Habib ramène son Tarikh Dawlat al-Atrak à 777/1376"
  tr: "İbn Habib, \"Türk Devleti Tarihi\" adlı eserini Hicri 777 yılında sonlandırır."
  id: "Ibn Habib mengakhiri karyanya \"Sejarah Negara Turki\" pada tahun 777 Hijriah."
summary:
  ar: "أنها ابن حبيب تاريخه «دولة الترك» — وهو «درة الأسلاك في دولة الأتراك» — إلى سنة سبع وسبعين وسبعمائة، وذيّل عليه ولده أبو العز طاهر {cite:nujum-zahira 11/189}؛ وعند الزركلي أنه أرّخ به أخبارهم من سنة ٦٤٨هـ إلى ٧٧٨هـ {cite:al-aalam 2/218-219}."
  en: "Ibn Habib carried his Tarikh Dawlat al-Atrak — the Durrat al-Aslak fi Dawlat al-Atrak — down to the year 777, and his son Abu al-'Izz Tahir added a continuation {cite:nujum-zahira 11/189}; al-Zirikli describes it as recording their annals from 648 to 778 {cite:al-aalam 2/218-219}."
  ur: "ابن حبیب نے اپنی «تاریخ دولۃ ترک» — یعنی «درۃ الاسلاک فی دولۃ الاتراک» — سن 777ھ تک پہنچائی، اور بیٹے ابو العز طاہر نے اس پر ذیل لکھی {cite:nujum-zahira 11/189}؛ زرکلی کے مطابق اس نے ان کے واقعات 648ھ سے 778ھ تک درج کیے {cite:al-aalam 2/218-219}."
  es: "Ibn Habib llevó su Tarikh Dawlat al-Atrak —el Durrat al-Aslak fi Dawlat al-Atrak— hasta el año 777, y su hijo Abu al-'Izz Tahir añadió una continuación {cita:nujum-zahira 11/189}; al-Zirikli lo describe como un registro de sus anales del 648 al 778 {cita:al-aalam 2/218-219}."
  fr: "Ibn Habib a porté son Tarikh Dawlat al-Atrak — le Durrat al-Aslak fi Dawlat al-Atrak — jusqu'en 777, et son fils Abu al-'Izz Tahir a ajouté une suite {cite:nujum-zahira 11/189}; al-Zirikli le décrit comme enregistrant leurs annales de 648 à 778 {cite: al-aalam 2/218-219}."
  tr: "İbn Habib'in \"Türk Devleti\"nin -ki bu \"Türk Devleti'ndeki Zincirlerin İncisi\"dir- 777 yılına kadar olan tarihini ve oğlu Ebu el-İzz Tahir'in buna eklemeler yaptığını belirtiyoruz {kaynak: nujum-zahira 11/189}; ve el-Zarkali'ye göre, haberlerini 648 Hicri ile 778 Hicri yılları arasına tarihlendirmiştir {kaynak: el-aalam 2/218-219}."
  id: "Ini adalah sejarah Ibn Habib tentang “Negara Turki” — yang merupakan “Mutiara Rantai dalam Negara Turki” — hingga tahun tujuh ratus tujuh puluh tujuh, dan putranya Abu al-Izz Tahir menambahkan catatan di atasnya {kutip:nujum-zahira 11/189}; dan menurut al-Zarkali, ia memberi tanggal berita mereka dari tahun 648 H hingga 778 H {kutip:al-aalam 2/218-219}."
