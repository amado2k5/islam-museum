label: { ar: "تأخر كعب بن مالك عن التجهز لتبوك", en: "Ka'b ibn Malik puts off his preparations for Tabuk" }
summary:
  ar: "روى كعب أنه لم يتخلف عن غزوة قط غير بدر، وأنه لم يكن أقوى ولا أيسر منه حين تخلف عن تبوك، وجعل يؤجل التجهز يوماً بعد يوم حتى فاته الجيش، ثم سأل عنه النبي في تبوك فدافع عنه معاذ بن جبل."
  en: "Ka'b related that he had never stayed behind from any campaign except Badr, and that he was never stronger or better provided than when he stayed behind from Tabuk: he kept putting off his preparations day after day until the army left without him. When the Prophet asked about him at Tabuk, Mu'adh ibn Jabal spoke in his defence."
