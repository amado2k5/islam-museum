id: event/kaab-ibn-malik-delays-his-preparations
class: event
kind: other
label: { ar: "تأخر كعب بن مالك عن التجهز لتبوك", en: "Ka'b ibn Malik puts off his preparations for Tabuk", es: "Ka'b ibn Malik pospone sus preparativos para Tabuk.", fr: "Ka'b ibn Malik reporte ses préparatifs pour Tabuk", ur: "کعب بن مالک نے تبوک کی تیاریوں کو روک دیا۔", tr: "Ka'b ibn Malik Tebük'e hazırlıkta gecikti", id: "Ka'b bin Malik terlambat mempersiapkan Tabuk" }
summary:
  ar: "روى كعب أنه لم يتخلف عن غزوة قط غير بدر، وأنه لم يكن أقوى ولا أيسر منه حين تخلف عن تبوك، وجعل يؤجل التجهز يوماً بعد يوم حتى فاته الجيش، ثم سأل عنه النبي في تبوك فدافع عنه معاذ بن جبل."
  en: "Ka'b related that he had never stayed behind from any campaign except Badr, and that he was never stronger or better provided than when he stayed behind from Tabuk: he kept putting off his preparations day after day until the army left without him. When the Prophet asked about him at Tabuk, Mu'adh ibn Jabal spoke in his defence."
  es: "Ka'b relató que nunca se había quedado atrás en ninguna campaña, excepto en Badr, y que nunca había estado más fuerte ni mejor provisto que cuando se quedó atrás en Tabuk: posponía sus preparativos día tras día hasta que el ejército partía sin él. Cuando el Profeta preguntó por él en Tabuk, Mu'adh ibn Jabal habló en su defensa."
  fr: "Ka'b raconta qu'il n'était jamais resté en arrière lors d'une campagne, sauf à Badr, et qu'il n'avait jamais été aussi fort ni aussi bien approvisionné que lorsqu'il était resté en arrière après Tabuk: il repoussait sans cesse ses préparatifs jusqu'à ce que l'armée parte sans lui. Lorsque le Prophète s'enquit de lui à Tabuk, Mu'adh ibn Jabal prit sa défense."
  ur: "کعب نے بیان کیا کہ وہ بدر کے علاوہ کسی مہم سے پیچھے نہیں رہے تھے، اور یہ کہ وہ تبوک سے پیچھے رہنے کے مقابلے میں کبھی بھی زیادہ مضبوط یا بہتر فراہم نہیں کیا گیا تھا: وہ دن بہ دن اپنی تیاریوں کو روکتا رہا یہاں تک کہ فوج اس کے بغیر نکل گئی۔ جب نبی نے تبوک میں ان کے بارے میں پوچھا تو معاذ بن جبل نے ان کے دفاع میں کہا۔"
  tr: "Ka'b rivayet etti ki, Bedir hariç hiçbir savaşı kaçırmadı ve Tebük savaşını kaçırdığı zamanki kadar güçlü ve rahat bir durumda hiç olmamıştı. Orduyu kaçırana kadar hazırlıklarını günlerce erteledi. Sonra Peygamber Tebük'te onun hakkında sordu ve Mu'az ibn Cebel onu savundu."
  id: "Ka’b meriwayatkan bahwa ia tidak pernah absen dalam pertempuran kecuali Badr, dan bahwa ia tidak pernah merasa lebih kuat atau lebih tenang daripada ketika ia absen dalam pertempuran Tabuk. Ia terus menunda persiapan hari demi hari hingga akhirnya ia ketinggalan pasukan. Kemudian Nabi bertanya tentang dirinya di Tabuk, dan Mu’adz ibn Jabal membela dirinya."
