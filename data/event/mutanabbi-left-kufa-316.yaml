label:
  ar: "خروج المتنبي من الكوفة شاعراً طوّافاً، ٣١٦هـ/٩٢٨م"
  en: "Al-Mutanabbi leaves Kufa as a wandering poet, 316/928"
  ur: "متنبی کا کوفہ سے سفر، 316ھ/928ء"
summary:
  ar: "ترك المتنبي الكوفة في أواخر سنة ٣١٦هـ/٩٢٨م، ويرجَّح أن ذلك كان إثر نهب القرامطة لها مرة أخرى، فقصد بغداد حيث صار مدّاحاً لمحمد بن عبيد الله العلوي، ثم راح إلى الشام فقاد حياة شاعر طوّاف سنتين، ينظم القصائد في أمراء بدو حول منبج وفي أدباء طرابلس واللاذقية، وكانت قصائد هذا العهد متعجلة متوسطة وإن بدت فيها بوادر عبقريته {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-770}."
  en: "Al-Mutanabbi left Kufa towards the end of 316/928, probably after the town was again sacked by the Karmatians. He went to Baghdad and became panegyrist to his compatriot Muhammad ibn Ubayd Allah al-Alawi, then moved to Syria where for two years he led the life of a wandering troubadour, addressing Bedouin chiefs around Manbij and the educated circles of Tripoli and Latakia; the poems of this apprenticeship are hurried and mediocre, though his real genius already shows through {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-770}."
  ur: "متنبی 316ھ/928ء کے آخر میں کوفہ چھوڑ آئے، غالباً قرمطیوں کی دوسری لٹ مار کے بعد۔ بغداد پہنچ کر اپنے ہم وطن محمد بن عبید اللہ علوی کے مداح بنے، پھر شام گئے جہاں دو برس آوارہ شاعر کی حیات بسر کی — منبج کے بدوی سرداروں اور طرابلس و لاذقیہ کے ادباء کے لیے قصیدے کہے؛ اس زمانے کی نظمیں جلدباز اور درمیانے درجے کی ہیں مگر اصل عبقریت جھلکنے لگی تھی {cite:encyclopaedia-of-islam-2 vol. 7 p. 769-770}۔"
