id: event/ibn-al-abbar-settles-tunis-636
class: event
kind: migration
label:
  ar: "ابن الأبار يفارق بلنسية ويستقر بتونس رئيسًا للديوان، ٦٣٦هـ"
  en: "Ibn al-Abbar leaves fallen Valencia and settles at Tunis as head of the chancellery, 636/1238"
  ur: "ابن ابار نے سقوط کے بعد بلنسیہ چھوڑا اور تونس میں دیوان کا سربراہ مقرر ہوا، 636ھ/1238ء"
  es: "Ibn al-Abbar abandona la Valencia caída y se instala en Túnez como jefe de la cancillería, 636/1238."
  fr: "Ibn al-Abbar quitte Valence, tombée au combat, et s'installe à Tunis comme chef de la chancellerie, 636/1238"
  tr: "İbn el-Abbar, Hicri 636 yılında Valensiya'dan ayrılıp Divan başkanı olarak Tunus'a yerleşti."
  id: "Ibn al-Abbar meninggalkan Valencia dan menetap di Tunis sebagai kepala Diwan, 636 H."
summary:
  ar: "عاد ابن الأبار إلى بلنسية ثم فارقها بعد أيام من سقوطها في ١٧ صفر ٦٣٦هـ ⁦(٢٨ سبتمبر 1238م)⁩، ونزل بجاية ثم قصد تونس، فاستقبله أبو زكريا أحسن استقبال وعيّنه رئيسًا لديوان الإنشاء {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}."
  en: "Ibn al-Abbar returned to Valencia but left it a few days after it was captured by James I on 17 Safar 636 (28 September 1238); he stopped at Bougie before going on to Tunis, where Abu Zakariyya' received him favourably and appointed him chief of his chancellery {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}."
  ur: "ابن ابار بلنسیہ واپس آیا مگر جیمز اول کے 17 صفر 636ھ ⁦(28 ستمبر 1238ء)⁩ کو شہر فتح کرنے کے چند روز بعد وہاں سے رخصت ہوا؛ بجایہ میں ٹھہرنے کے بعد تونس گیا جہاں ابو زکریا نے اس کا خیر مقدم کیا اور اسے دیوان انشا کا سربراہ مقرر کیا {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}."
  es: "Ibn al-Abbar regresó a Valencia, pero la abandonó pocos días después de que fuera capturada por Jaime I el 17 de Safar de 636 (28 de septiembre de 1238); se detuvo en Bougie antes de dirigirse a Túnez, donde Abu Zakariyya' lo recibió favorablemente y lo nombró jefe de su cancillería {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}."
  fr: "Ibn al-Abbar retourna à Valence, mais la quitta quelques jours après sa capture par Jacques Ier le 17 Safar 636 (28 septembre 1238); il s'arrêta à Bougie avant de se rendre à Tunis, où Abu Zakariyya' le reçut favorablement et le nomma chef de sa chancellerie {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}."
  tr: "İbn el-Abbar Valensiya'ya döndü, ardından 17 Safer 636 Hicri (28 Eylül 1238 Miladi) tarihinde şehrin düşüşünden birkaç gün sonra oradan ayrıldı. Bejaia'ya indi ve oradan Tunus'a yöneldi. Orada Ebu Zekeriya onu çok iyi karşıladı ve onu şansölyeliğin başına atadı. {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}"
  id: "Ibn al-Abbar kembali ke Valencia, lalu meninggalkannya beberapa hari setelah jatuhnya kota itu pada tanggal 17 Safar 636 H (28 September 1238 M). Ia pergi ke Bejaia dan kemudian menuju Tunis, di mana Abu Zakariya menerimanya dengan sangat baik dan mengangkatnya sebagai kepala kantor pemerintahan {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}."
