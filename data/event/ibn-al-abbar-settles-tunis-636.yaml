label:
  ar: "ابن الأبار يفارق بلنسية ويستقر بتونس رئيسًا للديوان، ٦٣٦هـ"
  en: "Ibn al-Abbar leaves fallen Valencia and settles at Tunis as head of the chancellery, 636/1238"
  ur: "ابن ابار نے سقوط کے بعد بلنسیہ چھوڑا اور تونس میں دیوان کا سربراہ مقرر ہوا، 636ھ/1238ء"
summary:
  ar: "عاد ابن الأبار إلى بلنسية ثم فارقها بعد أيام من سقوطها في ١٧ صفر ٦٣٦هـ (٢٨ سبتمبر 1238م)، ونزل بجاية ثم قصد تونس، فاستقبله أبو زكريا أحسن استقبال وعيّنه رئيسًا لديوان الإنشاء {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}."
  en: "Ibn al-Abbar returned to Valencia but left it a few days after it was captured by James I on 17 Safar 636 (28 September 1238); he stopped at Bougie before going on to Tunis, where Abu Zakariyya' received him favourably and appointed him chief of his chancellery {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}."
  ur: "ابن ابار بلنسیہ واپس آیا مگر جیمز اول کے 17 صفر 636ھ (28 ستمبر 1238ء) کو شہر فتح کرنے کے چند روز بعد وہاں سے رخصت ہوا؛ بجایہ میں ٹھہرنے کے بعد تونس گیا جہاں ابو زکریا نے اس کا خیر مقدم کیا اور اسے دیوان انشا کا سربراہ مقرر کیا {cite:encyclopaedia-of-islam-2 vol. 3 p. 705}."
