label:
  ar: مؤتمر الأديان المزعوم في طوكيو
  en: "The reported Tokyo congress of religions (1907)"
  es: "El congreso de religiones de Tokio (1907)"
  fr: "Le congrès des religions de Tokyo (1907) a fait l'objet d'un rapport."
summary:
  ar: "في سنة ١٩٠٧م نشرت جريدة «الوقت» الصادرة في تركستان خبراً عن عزم اليابان عقد مؤتمر للأديان في طوكيو؛ فرشحت جريدة «اللواء» محمد فريد وجدي والشيخ طنطاوي جوهري مندوبين عن مصر، وأعد وجدي رسالته بالفرنسية «سفير الإسلام»، فلما وصلت الرسائل تبين أن المؤتمر لا وجود له {cite:sufara-al-islam-azhar p. 19}{cite:sufara-al-islam-azhar p. 20}. ويذكر الكتاب أن فكرة المؤتمر تحققت بعد نحو ثلاثين عاماً، وأن الشيخ محمد مصطفى المراغي أرسل رسالة قُرئت فيه {cite:sufara-al-islam-azhar p. 20}."
  en: "In 1907 the newspaper al-Waqt, published in Turkestan, reported that Japan would host a congress of religions in Tokyo. Al-Liwa proposed Muhammad Farid Wajdi and Shaykh Tantawi Jawhari as Egypt's delegates. The book says the congress did not exist when the messages arrived. Its author's account only; no second source yet."
  es: "En 1907, el periódico al-Waqt, publicado en Turkestán, informó que Japón organizaría un congreso de religiones en Tokio. Al-Liwa propuso a Muhammad Farid Wajdi y al jeque Tantawi Jawhari como delegados de Egipto. El libro afirma que el congreso no existía cuando llegaron los mensajes. Se trata únicamente del relato del autor; aún no hay una segunda fuente."
  fr: "En 1907, le journal al-Waqt, publié au Turkestan, annonçait que le Japon accueillerait un congrès des religions à Tokyo. Al-Liwa proposait Muhammad Farid Wajdi et le cheikh Tantawi Jawhari comme délégués de l'Égypte. L'ouvrage précise que ce congrès n'existait pas encore à la réception de ces messages. Il s'agit du seul témoignage de son auteur; aucune autre source n'a été trouvée à ce jour."
