label:
  ar: مؤتمر الأديان المزعوم في طوكيو
  en: "The reported Tokyo congress of religions (1907)"
summary:
  ar: "في سنة ١٩٠٧م نشرت جريدة «الوقت» الصادرة في تركستان خبراً عن عزم اليابان عقد مؤتمر للأديان في طوكيو؛ فرشحت جريدة «اللواء» محمد فريد وجدي والشيخ طنطاوي جوهري مندوبين عن مصر، وأعد وجدي رسالته بالفرنسية «سفير الإسلام»، فلما وصلت الرسائل تبين أن المؤتمر لا وجود له {cite:sufara-al-islam-azhar p. 19}{cite:sufara-al-islam-azhar p. 20}. ويذكر الكتاب أن فكرة المؤتمر تحققت بعد نحو ثلاثين عاماً، وأن الشيخ محمد مصطفى المراغي أرسل رسالة قُرئت فيه {cite:sufara-al-islam-azhar p. 20}."
  en: "In 1907 the newspaper al-Waqt, published in Turkestan, reported that Japan would host a congress of religions in Tokyo. Al-Liwa proposed Muhammad Farid Wajdi and Shaykh Tantawi Jawhari as Egypt's delegates. The book says the congress did not exist when the messages arrived. Its author's account only; no second source yet."
