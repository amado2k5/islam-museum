id: event/sariyya-of-qutba-to-khatham
class: event
kind: raid
label: { en: "Qutba ibn Amir's raid on Khath'am", ar: "سرية قطبة بن عامر إلى خثعم", es: "La incursión de Qutba ibn Amir en Khath'am", fr: "Raid de Qutba ibn Amir sur Khath'am", ur: "قطبہ بن عامر کا خثعم پر حملہ", tr: "Kutube ibn Amir'in Khath'am'a seferi", id: "Ekspedisi Qutbah bin Amir ke Khath'am" }
summary:
  en: "In Safar 9 AH the Prophet sent Qutba ibn Amir ibn Hadida with twenty men on ten camels they shared in turns against a clan of Khath'am near Tabala in the Turba region; the raid met hard fighting with many wounded on both sides, and the Muslims drove cattle, captives and sheep back to Medina."
  ar: "بعث النبي قطبة بن عامر بن حديدة في صفر سنة 9هـ في عشرين رجلاً على عشرة أبعرة يعتقبونها إلى حي من خثعم بناحية تبالة بالقرب من تربة؛ فشنّ الغارة فاقتتلوا قتالاً شديداً حتى كثر الجرحى في الفريقين جميعاً، وقتل قطبة من قتل، وساق المسلمون النعم والنساء والشاء إلى المدينة."
  es: "En Safar del año 9 de la Hégira, el Profeta envió a Qutba ibn Amir ibn Hadida con veinte hombres en diez camellos que se turnaban para atacar a un clan de Khath'am cerca de Tabala, en la región de Turba. La incursión se topó con una dura lucha, con muchos heridos en ambos bandos, y los musulmanes llevaron ganado, cautivos y ovejas de vuelta a Medina."
  fr: "En Safar 9 AH, le Prophète envoya Qutba ibn Amir ibn Hadida avec vingt hommes sur dix chameaux qu'ils se partageaient à tour de rôle contre un clan de Khath'am près de Tabala dans la région de Turba; le raid se solda par de violents combats avec de nombreux blessés des deux côtés, et les musulmans ramenèrent le bétail, les captifs et les moutons à Médine."
  ur: "صفر 9 ہجری میں نبی نے قطبہ بن عامر بن حدیدہ کو بیس آدمیوں کے ساتھ دس اونٹوں پر بھیجا جو تربہ کے علاقے میں طبلہ کے قریب خثعم کے قبیلے کے خلاف تھے۔ چھاپے میں دونوں طرف سے بہت سے زخمیوں کے ساتھ سخت لڑائی ہوئی، اور مسلمانوں نے مویشیوں، اسیروں اور بھیڑوں کو واپس مدینہ پہنچا دیا۔"
  tr: "Peygamberimiz, Hicri 9. yılın Safer ayında, Kutbe bin Amer bin Hadide'yi, sırayla bindikleri on deveye binmiş yirmi adamla birlikte, Turbe yakınlarındaki Tabala bölgesinde bulunan bir Hatim kabilesine gönderdi. Baskın başladı ve her iki taraftan da birçok kişinin yaralandığı şiddetli bir savaş yaşandı. Kutbe, öldürdüğü kişileri öldürdü ve Müslümanlar, hayvanları, kadınları ve koyunları Medine'ye götürdüler."
  id: "Nabi Muhammad SAW mengutus Qutbah bin Amer bin Hadidah pada bulan Safar tahun 9 Hijriah bersama dua puluh orang yang menunggangi sepuluh unta secara bergantian, menuju suku Khatsam di daerah Tabalah dekat Turbah. Ia melancarkan serangan, dan mereka bertempur sengit hingga banyak yang terluka di kedua belah pihak. Qutbah membunuh orang-orang yang terbunuh, dan kaum Muslim membawa ternak, wanita, dan domba ke Madinah."
