label: { en: "Qutba ibn Amir's raid on Khath'am", ar: "سرية قطبة بن عامر إلى خثعم" }
summary:
  en: "In Safar 9 AH the Prophet sent Qutba ibn Amir ibn Hadida with twenty men on ten camels they shared in turns against a clan of Khath'am near Tabala in the Turba region; the raid met hard fighting with many wounded on both sides, and the Muslims drove cattle, captives and sheep back to Medina."
  ar: "بعث النبي قطبة بن عامر بن حديدة في صفر سنة 9هـ في عشرين رجلاً على عشرة أبعرة يعتقبونها إلى حي من خثعم بناحية تبالة بالقرب من تربة؛ فشنّ الغارة فاقتتلوا قتالاً شديداً حتى كثر الجرحى في الفريقين جميعاً، وقتل قطبة من قتل، وساق المسلمون النعم والنساء والشاء إلى المدينة."
