  en: "Al-Sakhawi first hears hadith from Ibn Hajar, by night with his father, 838/1434"
  ur: "سخاوی کا ابن حجر سے حدیث کی پہلی سماعت، والد کے ساتھ رات کو، 838ھ/1434ء"
summary:
  ar: "يقول السخاوي في ترجمة نفسه إنه سمع مع والده ليلاً الكثير من الحديث على شيخه ابن حجر، فكان أول ما وقف عليه من ذلك في سنة ثمان وثلاثين ⁦(٨٣٨هـ)⁩، فأوقع في قلبه محبة هذا العلم ولازم مجلسه {cite:daw-lami-jil-1992 8/5}."
  en: "In his autobiographical entry al-Sakhawi says he heard much hadith by night, with his father, from his shaykh Ibn Hajar, the first of it in 838/1434 — 'God set love of this science in my heart and I kept to his circle' {cite:daw-lami-jil-1992 8/5}."
  ur: "سخاوی اپنی سوانح میں لکھتا ہے کہ اس نے والد کے ساتھ رات کے وقت اپنے شیخ ابن حجر سے بہت سی احادیث سماعت کیں، جن میں پہلی سماعت سنہ ثمان وثلاثین (838ھ/1434ء) میں ہوئی، جس کے بعد اس نے مجلس کی ملازمت اختیار کی {cite:daw-lami-jil-1992 8/5}۔"
