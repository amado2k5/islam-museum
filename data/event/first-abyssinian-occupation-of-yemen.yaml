id: event/first-abyssinian-occupation-of-yemen
class: event
kind: conquest
label: { en: "The First Abyssinian Occupation of Yemen", ar: "الاحتلال الحبشي الأول لليمن", es: "La primera ocupación abisinia de Yemen", fr: "La première occupation abyssinienne du Yémen", ur: "یمن پر حبشیوں کا پہلا قبضہ", tr: "Habeşistan'ın Yemen'i ilk işgali", id: "Pendudukan pertama bangsa Abyssinia di Yaman" }
summary:
  en: "In the age of disorder after 300 CE the Romans entered Aden and with their help the Abyssinians occupied Yemen for the first time in 340 CE, exploiting the rivalry of Hamdan and Himyar; the occupation lasted until 378 CE and brought Christian missions into Yemen, in al-Raheeq al-Makhtum's account."
  ar: "في عهد الاضطرابات بعد سنة 300م دخل الرومان في عدن، وبمعونتهم احتلت الأحباش اليمن لأول مرة سنة 340م مستغلين التنافس بين همدان وحمير، واستمر احتلالهم إلى سنة 378م، وفي زمانه دخل التبشير المسيحي ربوع اليمن، في رواية الرحيق المختوم."
  es: "En la época de desorden posterior al año 300 d. C., los romanos entraron en Adén y, con su ayuda, los abisinios ocuparon Yemen por primera vez en el año 340 d. C., aprovechando la rivalidad entre Hamdan e Himyar; la ocupación duró hasta el año 378 d. C. y trajo consigo misiones cristianas a Yemen, según el relato de al-Raheeq al-Makhtum."
  fr: "À l'époque du désordre qui suivit 300 après J.-C., les Romains entrèrent à Aden et, avec leur aide, les Abyssins occupèrent le Yémen pour la première fois en 340 après J.-C., exploitant la rivalité entre Hamdan et Himyar; l'occupation dura jusqu'en 378 après J.-C. et amena des missions chrétiennes au Yémen, selon le récit d'al-Raheeq al-Makhtum."
  ur: "300 عیسوی کے بعد بدامنی کے دور میں رومی عدن میں داخل ہوئے اور ان کی مدد سے حبشیوں نے پہلی بار 340 عیسوی میں یمن پر قبضہ کیا، ہمدان اور حمیار کی دشمنی سے فائدہ اٹھایا۔ الرحیق المختم کے بیان میں یہ قبضہ 378 عیسوی تک جاری رہا اور یمن میں عیسائی مشن لے آیا۔"
  tr: "MS 300 yılından sonraki karışıklık döneminde Romalılar Aden'e girdiler ve onların yardımıyla Habeşliler, Hamdan ve Himyar arasındaki rekabetten yararlanarak MS 340 yılında Yemen'i ilk kez işgal ettiler. İşgalleri MS 378 yılına kadar sürdü ve bu dönemde, Mühürlü Nektar romanına göre, Hristiyan misyonerlik faaliyetleri Yemen bölgelerine girdi."
  id: "Selama periode kekacauan setelah tahun 300 M, bangsa Romawi memasuki Aden, dan dengan bantuan mereka, bangsa Abyssinia menduduki Yaman untuk pertama kalinya pada tahun 340 M, memanfaatkan persaingan antara Hamdan dan Himyar. Pendudukan mereka berlanjut hingga tahun 378 M, dan pada masa itu, kegiatan misionaris Kristen memasuki wilayah Yaman, menurut novel The Sealed Nectar."
