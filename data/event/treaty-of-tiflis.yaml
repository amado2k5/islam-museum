label: { ar: "صلح أهل تفليس", en: "The Treaty with the People of Tiflis", es: "El Tratado con el Pueblo de Tiflis", fr: "Le traité avec le peuple de Tbilissi", ur: "اہل طفلس کے ساتھ معاہدہ", tr: "Tiflis halkının barışı", id: "Kedamaian rakyat Tbilisi" }
summary:
  ar: "عند البلاذري ورد حبيب بن مسلمة تفليس وكتب لأهلها صلحاً نصّه: «هذا كتاب من حبيب بن مسلمة لأهل تفليس من منجاليس من جرزان القرمز بالأمان على أنفسهم وبيعهم وصوامعهم وصلواتهم ودينهم، على إقرار بالصغار والجزية على كل أهل بيت دينار، وليس لكم أن تجمعوا بين أهل البيوتات تخفيفاً للجزية ولا لنا أن نفرّق بينهم استكثاراً منها، ولنا نصيحتكم وضلعكم على أعداء الله ورسوله ما استطعتم، وقِرى المسلم المحتاج ليلة بالمعروف من حلال طعام أهل الكتاب لنا، وإن انقطع برجل من المسلمين عندكم فعليكم أداؤه إلى أدنى فئة من المؤمنين إلا أن يحال بينهم، وإن أنبتم وأقمتم الصلاة فإخواننا في الدين وإلا فالجزية عليكم، وإن عرض للمسلمين شغل عنكم فقهركم عدوّكم فغير مأخوذين بذلك ولا هو ناقض عهدكم — هذا لكم وهذا عليكم شهد الله وملائكته وكفى بالله شهيداً»؛ وكتب الجرّاح بن عبد الله الحكمي لأهل تفليس كتاباً نسخته: «هذا كتاب من الجرّاح بن عبد الله لأهل تفليس من رستاق منجاليس من كورة جرزان إنه أتوني بكتاب أمان لهم من حبيب بن مسلمة على الإقرار بصغار الجزية وإنه صالحهم على أرضين لهم وكروم وأرحاء يقال لها أواري وسابينا من رستاق منجاليس وعن طعام من رستاق قحويط من كورة جرزان على أن يؤدّوا عن هذه الأرحاء والكروم في كل سنة مائة درهم بلا ثانية فأنفذت لهم أمانهم وصلحهم وأمرت الإيراد عليهم فمن قارع كتابي فلا يتعدّ ذلك فيهم إن شاء الله»."
  en: "In al-Baladhuri Habib ibn Maslama reached Tiflis and wrote its people a peace whose text runs: 'This is a writ from Habib ibn Maslama to the people of Tiflis of Manjalis, of Jurzan al-Qirmiz: aman on yourselves, your houses of worship, your monasteries, your prayers and your religion — on your acknowledgment of subordination and a jizya of one dinar per household; you may not join households to lighten the jizya, nor may we divide them to multiply it; we have your counsel and your back against the enemies of God and His messenger as you are able; the quartering of a needy Muslim for one night with the lawful food of the People of the Book that is ours; and if a man of the Muslims is stranded among you, it is on you to convey him to the nearest band of believers unless harm is between them; if you repent and keep the prayer you are our brothers in religion, else the jizya is on you; and if the Muslims are distracted from you and your enemy overcomes you, you are not held to blame for that, nor does it break your covenant — this is yours, and this is upon you; God and His angels witness, and God suffices as witness'; and al-Jarrah ibn Abdallah al-Hakami wrote the people of Tiflis a writ whose copy runs: 'This is a writ from al-Jarrah ibn Abdallah to the people of Tiflis of Rustaq Manjalis, of the district of Jurzan: they brought me Habib ibn Maslama's writ of aman for them acknowledging the jizya's subordination, and his treaty with them over lands of theirs — vineyards and water-mills called Awari and Sabina of Rustaq Manjalis, and Ta'am of Rustaq Quhuyt of Jurzan's district — on their paying for these mills and vineyards a hundred dirhams yearly, no second term; so I have executed their aman and their treaty for them and have ordered the revenue-officers that whoever resists my writ shall not exceed it against them, God willing.'"
  es: "En al-Baladhuri, Habib ibn Maslama llegó a Tiflis y escribió a su gente una paz cuyo texto dice: 'Este es un edicto de Habib ibn Maslama para la gente de Tiflis de Manjalis, de Jurzan al-Qirmiz: aman sobre vosotros, vuestras casas de culto, vuestros monasterios, vuestras oraciones y vuestra religión, sobre vuestro reconocimiento de subordinación y una jizya de un dinar por hogar; no podéis unir hogares para aligerar la jizya, ni podemos dividirlos para multiplicarla; tenemos vuestro consejo y vuestro apoyo contra los enemigos de Dios y Su mensajero en la medida de vuestras posibilidades; el alojamiento de un musulmán necesitado durante una noche con la comida lícita de la Gente del Libro que es nuestra; y si un hombre de los musulmanes está varado entre vosotros, es vuestra obligación llevarlo al grupo de creyentes más cercano a menos que haya daño entre ellos; si os arrepentís y cumplís la oración sois nuestros hermanos en la religión, de lo contrario la jizya es sobre vosotros; y si los musulmanes se distraen de ti y tu enemigo te vence, no se te considera culpable por ello, ni se rompe tu pacto; esto es tuyo y esto recae sobre ti; Dios y Sus ángeles son testigos, y Dios basta como testigo'; y al-Jarrah ibn Abdallah al-Hakami escribió a la gente de Tiflis un edicto cuya copia dice: 'Este es un edicto de al-Jarrah ibn Abdallah a la gente de Tiflis de Rustaq Manjalis, del distrito de Jurzan: me trajeron el edicto de aman de Habib ibn Maslama para ellos reconociendo la subordinación de la jizya, y su tratado con ellos sobre sus tierras: viñedos y molinos de agua llamados Awari y Sabina de Rustaq Manjalis, y Ta'am de Rustaq Quhuyt del distrito de Jurzan, pagando por estos molinos y viñedos cien dirhams al año, sin segundo plazo; Así pues, he ejecutado su aman y su tratado en su favor, y he ordenado a los funcionarios de hacienda que quien se resista a mi mandato no lo exceda contra ellos, si Dios quiere."
  fr: "En al-Baladhuri, Habib ibn Maslama arriva à Tiflis et écrivit à ses habitants une lettre de paix dont le texte est le suivant: « Voici une lettre d'Habib ibn Maslama aux habitants de Tiflis, de Manjalis, de Jurzan al-Qirmiz: que Dieu vous accorde sa protection, ainsi que vos lieux de culte, vos monastères, vos prières et votre religion, en reconnaissant votre subordination et une jizya d'un dinar par foyer. Il est interdit de regrouper les foyers pour alléger la jizya, et nous ne pouvons pas non plus les diviser pour la multiplier. Nous avons votre soutien et vous défendons contre les ennemis de Dieu et de Son Messager, dans la mesure de vos moyens. Vous devez héberger un musulman nécessiteux pour une nuit, en lui fournissant la nourriture licite des Gens du Livre, qui est la nôtre. Si un musulman se trouve en détresse parmi vous, il vous incombe de le conduire au groupe de croyants le plus proche, sauf en cas de conflit entre eux. Si vous vous repentez et accomplissez la prière, vous êtes nos frères en religion; sinon, la jizya vous incombe. » et si les musulmans sont distraits de vous et que votre ennemi vous vainc, vous n'en serez pas tenus responsables, et cela ne rompt pas votre alliance — ceci est à vous, et ceci est sur vous; Dieu et Ses anges en témoignent, et Dieu suffit comme témoin »; et al-Jarrah ibn Abdallah al-Hakami écrivit aux habitants de Tiflis un acte dont la copie se lit comme suit: « Ceci est un acte d'al-Jarrah ibn Abdallah aux habitants de Tiflis de Rustaq Manjalis, du district de Jurzan: ils m'ont apporté l'acte d'aman de Habib ibn Maslama pour eux reconnaissant la subordination de la jizya, et son traité avec eux sur leurs terres — des vignobles et des moulins à eau appelés Awari et Sabina de Rustaq Manjalis, et Ta'am de Rustaq Quhuyt du district de Jurzan — sur le paiement pour ces moulins et vignobles de cent dirhams par an, sans deuxième terme; J'ai donc exécuté leur aman et leur traité en leur faveur et j'ai ordonné aux agents du fisc que quiconque s'oppose à mon ordre ne le transgresse pas à leur encontre, si Dieu le veut."
  ur: "البلادوری میں حبیب ابن مسلمہ نے طفلس پہنچ کر وہاں کے لوگوں کو ایک امن لکھا جس کا متن چلتا ہے: 'یہ حبیب بن مسلمہ کی طرف سے طفلس منجالس کے لوگوں کے نام، جرزن القرمیز کے لیے ایک تحریر ہے: اپنی ذات پر، اپنی عبادت گاہوں، اپنی خانقاہوں، اپنی نمازوں اور آپ کے ایک دین کے حکم پر۔ دینار فی گھر؛ آپ جزیہ کو ہلکا کرنے کے لیے گھرانوں میں شامل نہ ہو جائیں اور نہ ہی ہم اسے ضرب دینے کے لیے تقسیم کریں۔ ہمارے پاس خدا اور اس کے رسول کے دشمنوں کے خلاف آپ کی صلاح اور آپ کی پیٹھ ہے جیسا کہ آپ کر سکتے ہیں۔ کسی مسکین مسلمان کو ایک رات کے لیے اہل کتاب کے حلال کھانے سے جو ہمارا ہے۔ اور اگر مسلمانوں میں سے کوئی آدمی تم میں پھنسا ہوا ہے تو اسے مومنین کے قریبی گروہ تک پہنچانا تم پر ہے، الا یہ کہ ان کے درمیان کوئی نقصان نہ ہو۔ اگر تم توبہ کر لو اور نماز قائم کرو تو تم ہمارے دین میں بھائی ہو ورنہ جزیہ تم پر ہے۔ اور اگر مسلمان آپ سے ہٹ جائیں اور آپ کا دشمن آپ پر غالب آجائے تو اس کے لیے آپ کو قصوروار نہیں ٹھہرایا جائے گا اور نہ ہی آپ کے عہد کی خلاف ورزی ہوگی، یہ آپ کا ہے اور یہ آپ پر ہے۔ خدا اور اس کے فرشتے گواہی دیتے ہیں اور خدا گواہی کے لئے کافی ہے۔ اور الجراح بن عبداللہ الحکمی نے اہل طفلس کو ایک رٹ لکھی جس کی نقل چلتی ہے: 'یہ الجراح بن عبداللہ کی طرف سے طفلس کے لوگوں کو رستاق منجالس کے ضلع جرزان کے نام لکھی گئی ہے: وہ میرے پاس حبیب بن مسلمہ کی امانت کی تحریر لے کر آئے اور ان کے ماتحت ان کے ساتھ سلوک کیا۔ ان کی زمینیں — انگور کے باغات اور پانی کی ملیں جسے رستاق منجالی کی آواری اور سبینا کہا جاتا ہے، اور جورزان کے ضلع رستاق قویت کا طعم — ان ملوں اور انگور کے باغوں کے لیے سالانہ سو درہم ادا کرتے ہیں، دوسری مدت کے لیے نہیں۔ اس لیے میں نے ان کے لیے ان کے امن اور ان کے معاہدے پر عمل کیا ہے اور ریونیو افسران کو حکم دیا ہے کہ جو کوئی میری رٹ کی مخالفت کرے گا وہ ان کے خلاف تجاوز نہیں کرے گا، انشاء اللہ۔'"
  tr: "El-Baladhuri, Habib ibn Maslama'nın Tiflis'e geldiğini ve halkına bir barış antlaşması yazdığını rivayet etmiştir. Antlaşmanın metni şöyledir: “Bu, Kızıl Adalar'ın Mangali halkından Habib ibn Maslama'nın Tiflis halkına yazdığı bir mektuptur. Kendilerinin, kiliselerinin, manastırlarının, namazlarının ve dinlerinin güvenliğini, boyun eğmeyi ve her hane için bir dinar cizye ödemeyi kabul etmeleri şartıyla garanti ediyoruz. Cizyeyi azaltmak için haneleri birleştirmenize izin verilmez, cizyeyi artırmak için de ayırmamıza izin verilmez. Allah'ın ve Resulünün düşmanlarına karşı, elinizden geldiğince bize nasihat ve destek vermenizi rica ediyoruz. Muhtaç bir Müslümanın bir gecelik konaklaması, Kitap Ehli'nin helal yiyeceklerinden makul bir şekilde karşılanacaktır. Eğer bir Müslüman sizinle mahsur kalırsa, onu en yakın mümin topluluğuna teslim etmelisiniz, aksi takdirde engellenmedikleri sürece. Eğer tövbe edip namazı kılarsanız, din kardeşlerimizsiniz; aksi takdirde cizye sizin üzerinizedir. Müslümanlar meşgul oldukları için size yardımcı olamıyorlarsa ve düşmanınız sizi alt ediyorsa, bundan sorumlu tutulmazsınız ve bu, aranızdaki ahdi geçersiz kılmaz; bu sizin için de geçerlidir, bu da size karşıdır. Allah ve melekleri şahitlik eder ve Allah şahit olarak yeterlidir.” El-Cerrah bin Abdullah El-Hakami, Tiflis halkına bir mektup yazdı; mektubun bir nüshası şöyledir: “Bu, El-Cerrah bin Abdullah'ın, Jerzan bölgesindeki Manjalis bölgesinden Tiflis halkına yazdığı bir mektuptur. Bana, Habib bin Müslimah'tan, küçük bir cizye ödemeleri şartıyla, kendilerine ait iki arazi, Manjalis bölgesindeki Awari ve Sabina adlı bağlar ve değirmenler ile Jerzan bölgesindeki Qahwit bölgesindeki yiyecekler konusunda onlarla barış anlaşması yapmış bir güvenli geçiş mektubuyla geldiler. Bu değirmenler ve bağlar için her yıl ikinci bir vergi olmaksızın yüz dirhem ödemeleri şartıyla. Ben de onların güvenli geçişlerini ve barış anlaşmalarını sağladım ve onlardan vergi tahsil edilmesini emrettim. Bu yüzden mektubumu kim tartışırsa, Allah'ın izniyle, onlardan daha fazlasını yapmasın.”"
  id: "Al-Baladhuri melaporkan bahwa Habib ibn Maslama tiba di Tbilisi dan menulis perjanjian perdamaian kepada penduduknya, yang teksnya berbunyi: “Ini adalah surat dari Habib ibn Maslama kepada penduduk Tbilisi, dari suku Mangali di Kepulauan Merah, yang menjamin keselamatan bagi mereka, gereja-gereja mereka, biara-biara mereka, salat-salat mereka, dan agama mereka, dengan syarat mengakui penaklukan dan jizya satu dinar untuk setiap rumah tangga. Kalian tidak diperbolehkan menggabungkan rumah tangga untuk mengurangi jizya, dan kami juga tidak diperbolehkan memisahkan mereka untuk meningkatkannya. Kami berhak atas nasihat dan dukungan kalian melawan musuh-musuh Allah dan Rasul-Nya sebanyak yang kalian mampu. Keramahtamahan seorang Muslim yang membutuhkan untuk satu malam disediakan dengan cara yang wajar dari makanan halal Ahli Kitab. Jika seorang Muslim terlantar bersama kalian, kalian harus mengantarkannya kepada kelompok orang beriman terdekat kecuali jika mereka dicegah untuk melakukannya. Jika kalian bertaubat dan mendirikan salat, maka kalian adalah saudara kami dalam agama; jika tidak, jizya akan dibebankan kepada kalian. Jika kaum Muslim Jika ia sibuk dan tidak dapat memperhatikanmu, dan musuhmu mengalahkanmu, maka kamu tidak akan dimintai pertanggungjawaban atas hal itu, dan hal itu tidak membatalkan perjanjianmu—ini berlaku untukmu dan ini berlaku melawanmu. Allah dan para malaikat-Nya memberi kesaksian, dan Allah cukup sebagai saksi.” Al-Jarrah bin Abdullah Al-Hakami menulis surat kepada penduduk Tiflis, salinannya berbunyi: “Ini adalah surat dari Al-Jarrah bin Abdullah kepada penduduk Tiflis dari distrik Manjalis di wilayah Jerzan. Mereka datang kepadaku dengan surat jaminan keselamatan dari Habib bin Muslimah dengan syarat mengakui jizya kecil, dan bahwa dia berdamai dengan mereka atas dua bidang tanah mereka, kebun anggur dan penggilingan yang disebut Awari dan Sabina dari distrik Manjalis dan atas hasil bumi dari distrik Qahwit di wilayah Jerzan, dengan syarat mereka membayar seratus dirham setiap tahun untuk penggilingan dan kebun anggur tersebut tanpa tambahan. Maka aku melaksanakan jaminan keselamatan dan perdamaian untuk mereka dan memerintahkan agar pajak dipungut dari mereka. Maka siapa pun yang mempersoalkan suratku, janganlah ia melampaui itu dengan mereka, insya Allah.”"
