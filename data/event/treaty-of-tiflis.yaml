id: event/treaty-of-tiflis
class: event
kind: treaty
label: { ar: "صلح أهل تفليس", en: "The Treaty with the People of Tiflis" }
summary:
  ar: "عند البلاذري ورد حبيب بن مسلمة تفليس وكتب لأهلها صلحاً نصّه: «هذا كتاب من حبيب بن مسلمة لأهل تفليس من منجاليس من جرزان القرمز بالأمان على أنفسهم وبيعهم وصوامعهم وصلواتهم ودينهم، على إقرار بالصغار والجزية على كل أهل بيت دينار، وليس لكم أن تجمعوا بين أهل البيوتات تخفيفاً للجزية ولا لنا أن نفرّق بينهم استكثاراً منها، ولنا نصيحتكم وضلعكم على أعداء الله ورسوله ما استطعتم، وقِرى المسلم المحتاج ليلة بالمعروف من حلال طعام أهل الكتاب لنا، وإن انقطع برجل من المسلمين عندكم فعليكم أداؤه إلى أدنى فئة من المؤمنين إلا أن يحال بينهم، وإن أنبتم وأقمتم الصلاة فإخواننا في الدين وإلا فالجزية عليكم، وإن عرض للمسلمين شغل عنكم فقهركم عدوّكم فغير مأخوذين بذلك ولا هو ناقض عهدكم — هذا لكم وهذا عليكم شهد الله وملائكته وكفى بالله شهيداً»؛ وكتب الجرّاح بن عبد الله الحكمي لأهل تفليس كتاباً نسخته: «هذا كتاب من الجرّاح بن عبد الله لأهل تفليس من رستاق منجاليس من كورة جرزان إنه أتوني بكتاب أمان لهم من حبيب بن مسلمة على الإقرار بصغار الجزية وإنه صالحهم على أرضين لهم وكروم وأرحاء يقال لها أواري وسابينا من رستاق منجاليس وعن طعام من رستاق قحويط من كورة جرزان على أن يؤدّوا عن هذه الأرحاء والكروم في كل سنة مائة درهم بلا ثانية فأنفذت لهم أمانهم وصلحهم وأمرت الإيراد عليهم فمن قارع كتابي فلا يتعدّ ذلك فيهم إن شاء الله»."
  en: "In al-Baladhuri Habib ibn Maslama reached Tiflis and wrote its people a peace whose text runs: 'This is a writ from Habib ibn Maslama to the people of Tiflis of Manjalis, of Jurzan al-Qirmiz: aman on yourselves, your houses of worship, your monasteries, your prayers and your religion — on your acknowledgment of subordination and a jizya of one dinar per household; you may not join households to lighten the jizya, nor may we divide them to multiply it; we have your counsel and your back against the enemies of God and His messenger as you are able; the quartering of a needy Muslim for one night with the lawful food of the People of the Book that is ours; and if a man of the Muslims is stranded among you, it is on you to convey him to the nearest band of believers unless harm is between them; if you repent and keep the prayer you are our brothers in religion, else the jizya is on you; and if the Muslims are distracted from you and your enemy overcomes you, you are not held to blame for that, nor does it break your covenant — this is yours, and this is upon you; God and His angels witness, and God suffices as witness'; and al-Jarrah ibn Abdallah al-Hakami wrote the people of Tiflis a writ whose copy runs: 'This is a writ from al-Jarrah ibn Abdallah to the people of Tiflis of Rustaq Manjalis, of the district of Jurzan: they brought me Habib ibn Maslama's writ of aman for them acknowledging the jizya's subordination, and his treaty with them over lands of theirs — vineyards and water-mills called Awari and Sabina of Rustaq Manjalis, and Ta'am of Rustaq Quhuyt of Jurzan's district — on their paying for these mills and vineyards a hundred dirhams yearly, no second term; so I have executed their aman and their treaty for them and have ordered the revenue-officers that whoever resists my writ shall not exceed it against them, God willing.'"
