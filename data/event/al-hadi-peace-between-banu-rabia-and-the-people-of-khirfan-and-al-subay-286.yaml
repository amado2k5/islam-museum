id: event/al-hadi-peace-between-banu-rabia-and-the-people-of-khirfan-and-al-subay-286
class: event
kind: other
label:
  ar: صلح الهادي بين بني ربيعة وأهل خرفان والسبيع في دعوى القتل، 286هـ
  en: Al-Hadi's peace between Banu Rabi'a and the people of Khirfan and al-Subay' over a killing claim, 286 AH
  ur: قتل کے دعوے پر بنو ربیعہ اور اہل خرفان و السبیع کے بیچ ہادی کی صلح، 286ھ
  es: "Paz firmada por Al-Hadi entre Banu Rabi'a y los pueblos de Khirfan y al-Subay' tras una acusación de asesinato, 286 AH."
  fr: "Paix d'Al-Hadi entre les Banu Rabi'a et les populations de Khirfan et d'al-Subay' suite à une revendication de meurtre, 286 AH"
  tr: "El-Hadi, Hicri 286 yılında, Beni Rabi’ah (Hurfan halkı) ile El-Subey’ arasında işlenen bir cinayet davasında barışı sağladı."
  id: "Al-Hadi mendamaikan Bani Rabi’ah, penduduk Khurfan, dan Al-Subay’ dalam kasus pembunuhan, 286 Hijriah."
summary:
  ar: ادّعت بنو ربيعة على أهل السبيع وخرفان دعوى في نفس لهم، فحضر الفريقان عند الهادي في أثافت فجمع بينهم وأصلح ذات بينهم وحسم الأمر على تسعمئة دينار واختلطوا، ثم خرج يوم السبت من أثافت واستعمل عليها حسين بن الحسن العلوي ووصل إلى خيوان من يومه وأقام بها.
  en: Banu Rabi'a claimed against the people of al-Subay' and Khirfan over a life held against them; both sides came to al-Hadi at Athafit, he brought them together, set things right between them and settled the matter at nine hundred dinars, after which they mixed freely; on the Saturday he left Athafit, appointed Husayn ibn al-Hasan al-Alawi over it, and reached Khiwan the same day to stay.
  ur: بنو ربیعہ نے السبیع اور خرفان والوں پر ان کے پاس ایک جان کا دعویٰ کیا؛ دونوں فریق ہادی کے پاس اثافت میں حاضر ہوئے، انہوں نے انہیں جمع کر کے آپس میں صلح کرا دی اور معاملہ نو سو دینار پر طے کر دیا اور وہ مل گئے؛ پھر ہفتے کے دن اثافت سے نکلے، حسین بن حسن العلوی کو وہاں عامل مقرر کیا اور اسی دن خیوان پہنچ کر وہیں ٹھہرے۔
  es: "Los Banu Rabi'a reclamaron contra la gente de al-Subay' y Khirfan por una vida que se les había impuesto; ambas partes acudieron a al-Hadi en Athafit, él los reunió, arregló las cosas entre ellos y resolvió el asunto por novecientos dinares, después de lo cual se relacionaron libremente; el sábado partió de Athafit, nombró a Husayn ibn al-Hasan al-Alawi como su jefe y llegó a Khiwan ese mismo día para quedarse."
  fr: "Les Banu Rabi'a réclamèrent une rançon aux habitants d'al-Subay' et de Khirfan au sujet d'une vie qui leur était imputée; les deux camps se rendirent auprès d'al-Hadi à Athafit, qui les réunit, aplanit les différends et régla l'affaire pour neuf cents dinars, après quoi ils se mêlèrent librement; le samedi, il quitta Athafit, nomma Husayn ibn al-Hasan al-Alawi à sa tête et arriva à Khiwan le même jour pour y rester."
  tr: "Beni Rabi’ah, El-Sabi’ ve Khurfan halkına karşı bir hak iddiasında bulundu. İki taraf da Athafit’te El-Hadi’nin huzurundaydı. El-Hadi onları bir araya getirdi, uzlaştırdı ve meseleyi dokuz yüz dinar üzerinden çözdü ve taraflar bir araya geldi. Daha sonra Cumartesi günü Athafit’ten ayrıldı ve Hüseyin bin El-Hasan El-Alawi’yi başına atadı. Aynı gün Hayvan’a geldi ve orada kaldı."
  id: "Bani Rabi’ah mengajukan tuntutan terhadap penduduk Al-Sabi’ dan Khurfan terkait tuntutan terhadap mereka. Kedua pihak hadir di hadapan Al-Hadi di Athafit, lalu beliau mempertemukan mereka dan mendamaikan mereka serta menyelesaikan masalah tersebut dengan sembilan ratus dinar, dan mereka bersatu kembali. Kemudian beliau meninggalkan Athafit pada hari Sabtu dan menunjuk Hussein bin Al-Hassan Al-Alawi untuk memimpinnya, lalu tiba di Khaywan pada hari yang sama dan menetap di sana."
