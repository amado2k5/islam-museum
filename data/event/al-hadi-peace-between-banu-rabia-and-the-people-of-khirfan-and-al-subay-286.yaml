id: event/al-hadi-peace-between-banu-rabia-and-the-people-of-khirfan-and-al-subay-286
class: event
kind: other
label:
  ar: صلح الهادي بين بني ربيعة وأهل خرفان والسبيع في دعوى القتل، 286هـ
  en: Al-Hadi's peace between Banu Rabi'a and the people of Khirfan and al-Subay' over a killing claim, 286 AH
  ur: قتل کے دعوے پر بنو ربیعہ اور اہل خرفان و السبیع کے بیچ ہادی کی صلح، 286ھ
summary:
  ar: ادّعت بنو ربيعة على أهل السبيع وخرفان دعوى في نفس لهم، فحضر الفريقان عند الهادي في أثافت فجمع بينهم وأصلح ذات بينهم وحسم الأمر على تسعمئة دينار واختلطوا، ثم خرج يوم السبت من أثافت واستعمل عليها حسين بن الحسن العلوي ووصل إلى خيوان من يومه وأقام بها.
  en: Banu Rabi'a claimed against the people of al-Subay' and Khirfan over a life held against them; both sides came to al-Hadi at Athafit, he brought them together, set things right between them and settled the matter at nine hundred dinars, after which they mixed freely; on the Saturday he left Athafit, appointed Husayn ibn al-Hasan al-Alawi over it, and reached Khiwan the same day to stay.
  ur: بنو ربیعہ نے السبیع اور خرفان والوں پر ان کے پاس ایک جان کا دعویٰ کیا؛ دونوں فریق ہادی کے پاس اثافت میں حاضر ہوئے، انہوں نے انہیں جمع کر کے آپس میں صلح کرا دی اور معاملہ نو سو دینار پر طے کر دیا اور وہ مل گئے؛ پھر ہفتے کے دن اثافت سے نکلے، حسین بن حسن العلوی کو وہاں عامل مقرر کیا اور اسی دن خیوان پہنچ کر وہیں ٹھہرے۔
