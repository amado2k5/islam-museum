label: { ar: "يوم بدر: الصف والمبارزة ونصر الله", en: "The day of Badr: the lines, the duels and the victory", fr: "La journée de Badr : les rangs, les duels et la victoire", es: "El día de Badr: las líneas, los duelos y la victoria.", ur: "بدر کا دن: خطوط، مقابلہ اور فتح", tr: "Bedir Günü: Rütbeler, Düellolar ve Tanrı'nın Zaferi", id: "Hari Badr: Peringkat, Duel, dan Kemenangan Dewa" }
summary:
  ar: "في الجمعة السابع عشر من رمضان سنة اثنتين من الهجرة وقف الجيشان في بدر؛ دعا النبي ربه ساعة اشتد القتال، ثم نزلت الملائكة، فهزم الله جيش مكة، وقُتل صناديدهم بعد مبارزات أولها بين حمزة وعلي وعبيدة وبين عتبة وشيبة والوليد، وفرّ إبليس في صورة سراقة."
  en: "On the Friday of 17 Ramadan in the second year of the Hijra the two armies met at Badr; the Prophet prayed to his Lord at the height of the fighting, the angels came down, God routed the Meccan army, and their chiefs fell after duels whose first were between Hamza, Ali and Ubayda and Utba, Shayba and al-Walid; Iblis fled in the form of Suraqa."
  fr: "Le vendredi 17 Ramadan de la deuxième année de l'hégire, les deux armées se rencontrèrent à Badr ; le Prophète implora son Seigneur au plus fort du combat, les anges descendirent, Dieu mit en déroute l'armée mecquoise, et ses chefs tombèrent après des duels dont les premiers opposèrent Hamza, Ali et Ubayda à Utba, Shayba et al-Walid ; Iblis s'enfuit sous la forme de Suraqa."
  es: "El viernes 17 de Ramadán del segundo año de la Hégira, los dos ejércitos se encontraron en Badr; el Profeta oró a su Señor en el fragor de la batalla, los ángeles descendieron, Dios derrotó al ejército de La Meca y sus jefes cayeron tras duelos, los primeros de los cuales fueron entre Hamza, Ali y Ubayda, y Utba, Shayba y al-Walid; Iblis huyó bajo la forma de Suraqa."
  ur: "ہجرت کے دوسرے سال 17 رمضان کے جمعہ کو بدر کے مقام پر دونوں فوجیں آمنے سامنے ہوئیں۔ جنگ کے عروج پر نبی نے اپنے رب سے دعا کی، فرشتے نیچے آئے، اللہ تعالیٰ نے مکہ کی فوج کو شکست دی، اور ان کے سردار جنگ کے بعد گر پڑے جن کا پہلا مقابلہ حمزہ، علی اور عبیدہ اور عتبہ، شیبہ اور الولید کے درمیان تھا۔ ابلیس سراقہ کی صورت میں بھاگا۔"
  tr: "Hicretin ikinci yılında Ramazan ayının on yedinci Cuma günü, iki ordu Bedir'de karşı karşıya geldi. Savaş şiddetlenince Peygamberimiz Rabbine dua etti, bunun üzerine melekler indi ve Allah Mekke ordusunu yenilgiye uğrattı. Liderleri düellolardan sonra öldürüldü; bunlardan ilki Hamza, Ali ve Ubaida arasında, ikincisi ise Utbe, Şeyba ve El-Velid arasında gerçekleşti. İblis ise Surakah suretinde kaçtı."
  id: "Pada Jumat ketujuh belas bulan Ramadan tahun kedua Hijrah, kedua pasukan berdiri di Badr. Nabi Muhammad SAW memohon kepada Tuhannya ketika pertempuran semakin sengit, kemudian para malaikat turun, dan Allah mengalahkan pasukan Mekah, dan para pemimpin mereka terbunuh setelah duel, yang pertama adalah antara Hamza, Ali dan Ubaida, dan antara Utbah, Shaiba dan Al-Walid, dan Iblis melarikan diri dalam wujud Suraqah."
