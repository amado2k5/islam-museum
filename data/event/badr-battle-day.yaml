id: event/badr-battle-day
education:
  did_you_know:
    ar: "يوم الجمعة ١٧ رمضان سنة ٢هـ التقى الجيشان في بدر؛ دعا النبي ربه ساعة اشتد القتال فنصر الله المسلمين كما في الصحيح."
    en: "On Friday 17 Ramadan, year 2, the armies met at Badr; the Prophet prayed at the battle's height and God granted the Muslims victory, as the Sahih records."
    ur: "جمعہ ۱۷ رمضان سن ۲ھ کو دونوں لشکر بدر میں آملے؛ جنگ کی شدت پر نبی نے دعا کی اور اللہ نے مسلمانوں کو فتح دی، جیسا کہ صحیح میں ہے۔"
    sources: [source/mubarakpuri-raheeq, source/sahih-muslim]
class: event
kind: battle
label: { ar: "يوم بدر: الصف والمبارزة ونصر الله", en: "The day of Badr: the lines, the duels and the victory" }
summary:
  ar: "في الجمعة السابع عشر من رمضان سنة اثنتين من الهجرة وقف الجيشان في بدر؛ دعا النبي ربه ساعة اشتد القتال، ثم نزلت الملائكة، فهزم الله جيش مكة، وقُتل صناديدهم بعد مبارزات أولها بين حمزة وعلي وعبيدة وبين عتبة وشيبة والوليد، وفرّ إبليس في صورة سراقة."
  en: "On the Friday of 17 Ramadan in the second year of the Hijra the two armies met at Badr; the Prophet prayed to his Lord at the height of the fighting, the angels came down, God routed the Meccan army, and their chiefs fell after duels whose first were between Hamza, Ali and Ubayda and Utba, Shayba and al-Walid; Iblis fled in the form of Suraqa."
