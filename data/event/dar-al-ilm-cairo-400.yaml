label: { ar: "دار العلم بالقاهرة", en: "Dar al-Ilm in Cairo", es: "Dar al-Ilm en El Cairo", fr: "Dar al-Ilm au Caire", ur: "دار العلم قاہرہ میں", tr: "Kahire'deki Dar Al-Ilm", id: "Dar Al-Ilm di Kairo" }
summary:
  ar: "أقبل الحاكم بأمر الله على التأله والدين فأمر بإنشاء دار العلم بمصر وأحضر فيها الفقهاء والمحدثين وعمر الجامع الحاكمي بالقاهرة وكثر الدعاء له فبقى كذلك ثلاث سنين ثم أخذ يقتل أهل العلم وأغلق تلك الدار ومنع من فعل كثير من الخير {cite:shadharat-dhahab p. 165-166}."
  en: "Al-Hakim's early piety built Cairo's Dar al-Ilm, gathered jurists and hadith-men and raised the Jami' al-Hakimi — for three years; then he turned to killing men of learning, closed the house and barred much good {cite:shadharat-dhahab p. 165-166}."
  es: "La piedad inicial de Al-Hakim construyó el Dar al-Ilm de El Cairo, reunió a juristas y expertos en hadices y levantó el Jami' al-Hakimi — durante tres años; luego se dedicó a matar a hombres de conocimiento, cerró la casa y prohibió muchas cosas buenas {cite:shadharat-dhahab p. 165-166}."
  fr: "La piété précoce d'Al-Hakim a construit le Dar al-Ilm du Caire, rassemblé des juristes et des hommes de hadith et fondé le Jami' al-Hakimi — pendant trois ans; puis il s'est tourné vers le meurtre d'hommes de savoir, a fermé la maison et a interdit beaucoup de bien {cite:shadharat-dhahab p. 165-166}."
  ur: "الحکیم کی ابتدائی تقویٰ نے قاہرہ کا دارالعلم بنایا، فقہاء اور محدثین کو اکٹھا کیا اور تین سال تک جامع الحکیمی کی پرورش کی۔ پھر اس نے اہل علم کو قتل کرنے کی طرف رجوع کیا، گھر بند کر دیا اور بہت سے اچھے کاموں کو روک دیا 165-166}۔"
  tr: "El-Hakim bi-Amr Allah takva ve dine yöneldi, bu yüzden Mısır'da İlim Evi'nin kurulmasını emretti ve oraya fıkıhçılar ve hadis âlimleri getirdi. Ayrıca Kahire'deki El-Hakim Camii'ni yeniledi ve onun için dualar edildi. Üç yıl bu halde kaldı, sonra âlimleri öldürmeye başladı, o evi kapattı ve birçok hayırlı işin yapılmasını engelledi. {kaynak: Şadharat-dahab s. 165-166}"
  id: "Al-Hakim bi-Amr Allah beralih kepada ketakwaan dan agama, sehingga ia memerintahkan pendirian Rumah Ilmu di Mesir dan mendatangkan para ahli fiqih dan ulama hadits ke sana. Ia juga merenovasi Masjid Al-Hakim di Kairo, dan salat dipanjatkan untuknya. Ia tetap dalam keadaan ini selama tiga tahun, kemudian ia mulai membunuh para ulama, menutup rumah ilmu tersebut, dan mencegah banyak amal kebaikan dilakukan. {cite:shadharat-dhahab p. 165-166}"
