summary:
  ar: "في سنة ثلاث وثلاثين وتسعمائة قُتل قرا قاضي مفتش أوقاف حلب في جامعها، وقُتل معه بدر الدين أحمد بن قاضي القضاة تقي الدين الموي ناظر أوقاف الحرمين الشريفين بحلب الذي كان قد انضم إليه فصارت له عنده اليد النافذة، وأراد العامة حرقه فاستخلصه منهم أهله وجماعته فغسلوه وكفنوه ودفنوه {cite:shadharat-dhahab p. 578}."
  en: "In 933 Qara Qadi, Aleppo's waqf inspector, was killed inside its congregational mosque; Badr al-Din Ahmad b. al-Mawlawi — nazir of the Two Sanctuaries' endowments at Aleppo and his close lieutenant — was killed with him, and the mob sought to burn his body before his people rescued and buried it {cite:shadharat-dhahab p. 578}."
