id: event/qara-qadi-killed-aleppo-933
class: event
kind: other
label: { ar: "مقتل قره قاضي بجامع حلب 933هـ", en: "Qara Qadi killed in Aleppo's mosque, 933", es: "Qara Qadi asesinado en la mezquita de Alepo, 933", fr: "Qara Qadi tué dans la mosquée d'Alep, 933", ur: "قارا قادی حلب کی مسجد میں مارا گیا، 933" }
summary:
  ar: "في سنة ثلاث وثلاثين وتسعمائة قُتل قرا قاضي مفتش أوقاف حلب في جامعها، وقُتل معه بدر الدين أحمد بن قاضي القضاة تقي الدين الموي ناظر أوقاف الحرمين الشريفين بحلب الذي كان قد انضم إليه فصارت له عنده اليد النافذة، وأراد العامة حرقه فاستخلصه منهم أهله وجماعته فغسلوه وكفنوه ودفنوه {cite:shadharat-dhahab p. 578}."
  en: "In 933 Qara Qadi, Aleppo's waqf inspector, was killed inside its congregational mosque; Badr al-Din Ahmad b. al-Mawlawi — nazir of the Two Sanctuaries' endowments at Aleppo and his close lieutenant — was killed with him, and the mob sought to burn his body before his people rescued and buried it {cite:shadharat-dhahab p. 578}."
  es: "En 933, Qara Qadi, inspector del waqf de Alepo, fue asesinado dentro de su mezquita congregacional; Badr al-Din Ahmad b. al-Mawlawi, nazir de las dotaciones de los Dos Santuarios en Alepo y su lugarteniente cercano, fue asesinado con él, y la turba intentó quemar su cuerpo antes de que su gente lo rescatara y lo enterrara {cite:shadharat-dhahab p. 578}."
  fr: "En 933, Qara Qadi, inspecteur des waqfs d'Alep, fut tué à l'intérieur de sa mosquée du vendredi; Badr al-Din Ahmad b. al-Mawlawi — nazir des dotations des Deux Sanctuaires à Alep et son proche lieutenant — fut tué avec lui, et la foule chercha à brûler son corps avant que son peuple ne le sauve et ne l'enterre {cite:shadharat-dhahab p. 578}."
  ur: "933 میں حلب کے وقف انسپکٹر قرہ قادی کو اس کی اجتماعی مسجد کے اندر قتل کر دیا گیا۔ بدر الدین احمد بی۔ المولوی - حلب میں دو پناہ گزینوں کے اوقاف کے نذیر اور اس کا قریبی لیفٹیننٹ - اس کے ساتھ مارا گیا تھا، اور ہجوم نے اس کی لاش کو جلانے کی کوشش کی اس سے پہلے کہ اس کے لوگوں نے اسے بچا لیا اور اسے دفن کیا {حوالہ: شدارت ذہاب صفحہ 578}۔"
