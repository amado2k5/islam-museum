id: event/qarmatians-taken-at-thala-and-al-dahhaf-taken-at-al-muwaqqiha-294
class: event
kind: raid
label:
  ar: "أسر قرامطة في حصن ثلا وأسر الدهف في الموقحة، سنة 294هـ، ص345"
  en: "Qarmatians are taken at the fort of Thala and al-Dahhaf is taken at al-Muwaqqiha, 294 AH, p. 345"
  ur: "حصن ثلا میں قرامطہ کا پکڑا جانا اور الموقحہ میں دہف کی گرفتاری، 294ھ، ص345"
  es: "Los qarmatianos son capturados en el fuerte de Thala y al-Dahhaf es capturado en al-Muwaqqiha, 294 AH, p. 345"
  fr: "Les Qarmates sont pris au fort de Thala et al-Dahhaf est pris à al-Muwaqqiha, 294 AH, p. 345"
summary:
  ar: "بلغ محمد بن عبيد الله أن قرامطة في حصن ثلا عند نفر من بني الحارث، فأرسل ابنيه علياً والقاسم فظفرا برجلين منهم، ثم ظفر علي بالدهف ورفاقه في الموقحة من قرى نجران وأودعهم الحبس."
  en: "Muhammad ibn Ubaydallah learned that some Qarmatians were in the fort of Thala with men of Banu al-Harith. He sent his sons Ali and al-Qasim, who took two Qarmatians. Then Ali took al-Dahhaf and his companions at al-Muwaqqiha, a village of Najran, and had them put in prison."
  ur: "محمد بن عبید اللہ کو خبر ملی کہ حصن ثلا میں بنی الحارث کے کچھ لوگوں کے پاس قرامطہ ہیں۔ انہوں نے بیٹوں علی اور قاسم کو بھیجا جنہوں نے دو قرامطہ پکڑے۔ پھر علی نے نجران کے گاؤں الموقحہ میں دہف اور اس کے ساتھیوں کو پکڑ کر قید کر دیا۔"
  es: "Muhammad ibn Ubaydallah supo que algunos cármatas se encontraban en la fortaleza de Thala con hombres de Banu al-Harith. Envió a sus hijos Ali y al-Qasim, quienes capturaron a dos cármatas. Luego, Ali capturó a al-Dahhaf y a sus compañeros en al-Muwaqqiha, una aldea de Najran, y los hizo encarcelar."
  fr: "Muhammad ibn Ubaydallah apprit que des Qarmates se trouvaient dans la forteresse de Thala avec des hommes des Banu al-Harith. Il envoya ses fils Ali et al-Qasim, qui capturèrent deux Qarmates. Ali captura ensuite al-Dahhaf et ses compagnons à al-Muwaqqiha, un village de Najran, et les fit emprisonner."
