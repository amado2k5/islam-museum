id: event/ibn-al-ashath-siege-qayrawan
class: event
kind: other
label: { ar: "وثبة جند إفريقية بابن الأشعث في قصره", en: "The Ifriqiyan Army's Rising against Ibn al-Ash'ath in His Palace", es: "El levantamiento del ejército ifriqiya contra Ibn al-Ash'ath en su palacio.", fr: "Le soulèvement de l'armée ifriqiyan contre Ibn al-Ash'ath dans son palais" }
summary:
  ar: "عند البلاذري: دخل محمد بن الأشعث الخزاعي إفريقية والياً في آخر خلافة أبي العباس في سبعين ألفاً ويُقال في أربعين ألفاً فولّاها أربع سنين فرمّ مدينة القيروان ثم وثب عليه جند البلد وغيرهم — وسمع البلاذري ممن حدّث أن أهل البلد والجند المقيمين وثبوا به فمكث يقاتلهم أربعين يوماً وهو في قصره حتى اجتمع إليه أهل الطاعة ممن كان شخص معه من أهل خراسان وغيرهم فظفر بمن حاربه وعرضهم على الأسماء فمن كان اسمه معاوية أو سفيان أو مروان أو اسماً موافقاً لأسماء بني أمية قتله ومن كان اسمه خلاف ذلك استبقاه فعزله المنصور."
  en: "In al-Baladhuri: Muhammad ibn al-Ash'ath al-Khuza'i entered Ifriqiya as governor at Abu al-Abbas's caliphate's end in seventy thousand — it is said forty — and governed it four years, repairing Qayrawan's city; then the province's army and others rose on him — al-Baladhuri heard from informants that the townspeople and resident troops rose on him and he fought them forty days in his palace until the obedient gathered to him of the Khurasanis who had come with him and others, and he prevailed over his foes and passed them over the names: whoever was named Mu'awiya or Sufyan or Marwan or a name matching the Umayyads' he killed, and whoever was named otherwise he spared — then al-Mansur dismissed him."
  es: "En al-Baladhuri: Muhammad ibn al-Ash'ath al-Khuza'i entró en Ifriqiya como gobernador al final del califato de Abu al-Abbas en setenta mil —se dice cuarenta— y la gobernó durante cuatro años, reparando la ciudad de Qayrawan; entonces el ejército de la provincia y otros se alzaron contra él —al-Baladhuri supo por informantes que los habitantes de la ciudad y las tropas residentes se alzaron contra él y luchó contra ellos durante cuarenta días en su palacio hasta que los obedientes se reunieron con él de los khurasaníes que habían venido con él y otros, y prevaleció sobre sus enemigos y les pasó los nombres: a quien se llamaba Mu'awiya o Sufyan o Marwan o un nombre que coincidiera con el de los omeyas, lo mataba, y a quien se llamaba de otra manera, lo perdonaba —entonces al-Mansur lo destituyó."
  fr: "Selon al-Baladhuri: Muhammad ibn al-Ash'ath al-Khuza'i entra en Ifriqiya comme gouverneur à la fin du califat d'Abu al-Abbas, en soixante-dix mille ans – on dit quarante ans – et la gouverna pendant quatre ans, restaurant la ville de Qayrawan; puis l'armée de la province et d'autres se soulevèrent contre lui – al-Baladhuri apprit de sources anonymes que les habitants et les troupes résidentes se soulevèrent contre lui et qu'il les combattit pendant quarante jours dans son palais jusqu'à ce que les Khorasanites qui lui étaient fidèles se rassemblent autour de lui, et il triompha de ses ennemis et leur fit passer l'ordre suivant: quiconque s'appelait Mu'awiya, Sufyan, Marwan ou portait un nom correspondant à celui des Omeyyades, il le tua, et quiconque portait un autre nom, il l'épargna – puis al-Mansur le destitua."
