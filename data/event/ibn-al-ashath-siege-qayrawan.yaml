id: event/ibn-al-ashath-siege-qayrawan
class: event
kind: other
label: { ar: "وثبة جند إفريقية بابن الأشعث في قصره", en: "The Ifriqiyan Army's Rising against Ibn al-Ash'ath in His Palace" }
summary:
  ar: "عند البلاذري: دخل محمد بن الأشعث الخزاعي إفريقية والياً في آخر خلافة أبي العباس في سبعين ألفاً ويُقال في أربعين ألفاً فولّاها أربع سنين فرمّ مدينة القيروان ثم وثب عليه جند البلد وغيرهم — وسمع البلاذري ممن حدّث أن أهل البلد والجند المقيمين وثبوا به فمكث يقاتلهم أربعين يوماً وهو في قصره حتى اجتمع إليه أهل الطاعة ممن كان شخص معه من أهل خراسان وغيرهم فظفر بمن حاربه وعرضهم على الأسماء فمن كان اسمه معاوية أو سفيان أو مروان أو اسماً موافقاً لأسماء بني أمية قتله ومن كان اسمه خلاف ذلك استبقاه فعزله المنصور."
  en: "In al-Baladhuri: Muhammad ibn al-Ash'ath al-Khuza'i entered Ifriqiya as governor at Abu al-Abbas's caliphate's end in seventy thousand — it is said forty — and governed it four years, repairing Qayrawan's city; then the province's army and others rose on him — al-Baladhuri heard from informants that the townspeople and resident troops rose on him and he fought them forty days in his palace until the obedient gathered to him of the Khurasanis who had come with him and others, and he prevailed over his foes and passed them over the names: whoever was named Mu'awiya or Sufyan or Marwan or a name matching the Umayyads' he killed, and whoever was named otherwise he spared — then al-Mansur dismissed him."
