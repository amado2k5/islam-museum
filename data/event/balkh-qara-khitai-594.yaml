id: event/balkh-qara-khitai-594
class: event
kind: conquest
label: { ar: "ملك الغورية بلخ من الخطا", en: "The Ghurid capture of Balkh from the Qara Khitai (594 AH)", fr: "La prise de Balkh aux Qara Khitai par les Ghourides (594 H)", es: "La conquista de Balkh por los gúridas a los Qara Khitai (594 AH)", ur: "قرہ خیطائی سے غوریوں کا بلخ پر قبضہ ⁦(594ھ)⁩" }
summary:
  ar: "في سنة أربع وتسعين وخمسمائة توفي صاحب بلخ وكان تركياً اسمه أزيه يحمل الخراج كل سنة إلى الخطا بما وراء النهر، فسار بهاء الدين سام بن محمد بن مسعود — وهو ابن أخت غياث الدين وشهاب الدين وله باميان — إلى المدينة فملكها وتمكن منها وقطع الحمل إلى الخطا وخطب لغياث الدين، فصارت من جملة بلاد الإسلام بعد أن كانت في طاعتهم؛ فأرسل خوارزم شاه تكش إلى الخطا يستنجدهم على غياث الدين فعبر ملك الخطا بجيش مقدمه طاينكوا جيحون في جمادى الآخرة — والزمان شتاء — فلقيهم عسكر غياث الدين فانهزموا {cite:kamil-ibn-al-athir p. 252-253}."
  en: "594: on the death of its Turkish tribute-lord Aziya, Baha al-Din Sam of Bamiyan — nephew of both Ghurid sultans — marched on Balkh, took it, cut the yearly tribute to the Qara Khitai and raised the khutba for Ghiyath al-Din, 'returning it to the lands of Islam'; the Khita's answering expedition under Tayanku crossed the Oxus that winter and broke before the Ghurid army {cite:kamil-ibn-al-athir p. 252-253}."
  fr: "594 : à la mort de son seigneur turc tributaire Aziya, Baha al-Din Sam de Bamiyan, neveu des deux sultans ghourides, marcha sur Balkh, la prit, cessa le tribut annuel aux Qara Khitai et fit prononcer la khutba au nom de Ghiyath al-Din, « la rendant aux terres de l'islam » ; l'expédition de riposte des Khitai sous Tayanku franchit l'Oxus cet hiver-là et se brisa devant l'armée ghouride {cite:kamil-ibn-al-athir p. 252-253}."
  es: "594: tras la muerte de su señor tributario turco Aziya, Baha al-Din Sam de Bamiyán —sobrino de ambos sultanes Ghurid— marchó sobre Balkh, la tomó, cortó el tributo anual a los Qara Khitai y levantó la jutba para Ghiyath al-Din, 'devolviéndola a las tierras del Islam'; la expedición de respuesta de Khita, bajo el mando de Tayanku, cruzó el Oxus ese invierno y se rompió ante el ejército Ghurid {cita:kamil-ibn-al-athir págs. 252-253}."
  ur: "594: اپنے ترک خراجِ عقیدت پیش کرنے والے عزیہ کی موت پر، بامیان کے بہا الدین سام نے - دونوں غورید سلاطین کے بھتیجے - نے بلخ پر چڑھائی کی، اسے لے لیا، قرہ خیطائی کو سالانہ خراج تحسین پیش کیا اور غیاث الدین کے لیے خطبہ اٹھایا، 'اسے اسلام کی سرزمین پر واپس لوٹا دیا'؛ تیانکو کی قیادت میں خیتا کی جوابی مہم نے اس موسم سرما میں آکسس کو عبور کیا اور غوری فوج کے سامنے ٹوٹ پڑا۔ 252-253}۔"
