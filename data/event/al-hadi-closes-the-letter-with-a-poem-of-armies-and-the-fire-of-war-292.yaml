label:
  ar: "ختام الكتاب بقصيدة الجنود ونار الحرب، ص278-280"
  en: "The poem of the armies and the fire of war that closes the letter, pp. 278-280"
  ur: "خط کے آخر میں لشکروں اور جنگ کی آگ کی نظم، ص278-280"
summary:
  ar: "يكتب الهادي في أسفل كتابه إلى بني الحارث قصيدة يحذرهم فيها من جنود الله التي يسيّرها، ويصف خيلها وسيوفها ورماحها، ويذكر أن النار التي يوقدها المرء عن غرة تدور عليه بالمصائب، وأن من يحارب ليثاً يحمي أشباله خاب."
  en: "At the foot of his letter al-Hadi writes to Banu al-Harith a poem warning them of the armies of God he is sending, describing their horses, swords and lances, saying that the fire a reckless man kindles turns calamities on him and that whoever fights a lion defending its cubs fails."
  ur: "ہادی اپنے خط کے نیچے بنو حارث کے نام ایک نظم لکھتے ہیں جس میں اللہ کے ان لشکروں سے خبردار کرتے ہیں جو وہ بھیج رہے ہیں، ان کے گھوڑوں، تلواروں اور نیزوں کا بیان ہے، اور یہ کہ جو بے خبری میں آگ بھڑکائے اس پر مصیبتیں آتی ہیں اور جو اپنے بچوں کی حفاظت کرنے والے شیر سے لڑے وہ ناکام ہوتا ہے۔"
