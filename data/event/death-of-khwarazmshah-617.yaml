label: { ar: "هلاك خوارزمشاه بجزيرة بحر قزوين", en: "Perishing of the Khwarazmshah on an island in the Caspian Sea", es: "Muerte del sha de Corasmia en una isla del mar Caspio.", fr: "La disparition du Khwarezmshah sur une île de la mer Caspienne", ur: "بحیرہ کیسپین کے ایک جزیرے پر خوارزمشاہ کا فنا ہونا", tr: "Hazar Denizi'ndeki bir adada Harezmşah'ın yıkımı", id: "Kehancuran Khwarazmshah di sebuah pulau di Laut Kaspia" }
summary:
  ar: "سار جنكزخان إلى خوارزم شاه فانجفل عن جيحون إلى نيسابور ثم ساق إلى مرج همدان رعباً من التتار فأحدق به العدو فقتلوا كل من معه ونجا هو بنفسه فخاض الماء إلى جزيرة ولحقته علة ذات الجنب فمات بها وحيداً فريداً وكفن في شاش فراش كان معه وذلك في سنة سبع عشرة وست مئة وملكوا جميع مملكة خوارزم شاه، وقال سبط الجوزي كان أول ظهور التتار بما وراء النهر سنة خمس عشرة فأخذوا بخارى وسمرقند وقتلوا أهلها، وقال ابن الأثير حادثة التتار من الحوادث العظمى والمصائب الكبرى التي عقمت الدهور عن مثلها عمت الخلائق وخصت المسلمين فلو قال قائل إن العالم منذ خلقه الله إلى الآن لم يبتلوا بمثلها لكان صادقاً {cite:tarikh-khulafa-minhaj-1434 p. 714}. وعند ابن الأثير أن جنكزخان لما ملك سمرقند سير عشرين ألف فارس وقال لهم اطلبوا خوارزم شاه أين كان ولو تعلق بالسماء حتى تدركوه، وهي الطائفة التي يسميها التتر المغربة، فعبروا جيحون في أحواض كبار من الخشب ألبسوها جلود البقر وضعوا فيها سلاحهم وألقوا الخيل في الماء وأمسكوا أذنابها فجذب كل فرس حوضه، فرحل خوارزم شاه في نفر من خاصته إلى نيسابور فمازندران، والتتر في أثره كلما رحل عن منزلة نزلوها لا يعرجون على نهب ولا قتل، حتى وصل إلى قلعة له في بحر طبرستان تعرف بآب سكون فركب في السفن فوقف التتر على ساحل البحر أيِّسين من لحاقه فرجعوا، ومات خوارزم شاه في تلك القلعة {cite:kamil-ibn-al-athir p. 406-407}."
  en: "Genghis marched; Khwarazmshah fled the Jayhun to Nishapur, then Hamadan's field, where the enemy ringed him, killed his company, and he alone swam to an island — pleurisy took him, alone, shrouded in a farrash's cloth, in 617; his whole realm fell. Ibn al-Athir: 'the Tatar calamity — had one said the world since creation was never tried its like, he would speak true' {cite:tarikh-khulafa-minhaj-1434 p. 714}."
  es: "Gengis Kan marchó; Corasmia huyó del Jayhun a Nishapur, luego al campo de Hamadán, donde el enemigo lo rodeó, mató a su compañía y él solo nadó hasta una isla; la pleuresía lo alcanzó, solo, envuelto en una tela de farrash, en el año 617; todo su reino cayó. Ibn al-Athir: «La calamidad tártara: si alguien hubiera dicho que el mundo desde su creación jamás había experimentado algo semejante, estaría diciendo la verdad» {cita: tarikh-khulafa-minhaj-1434 p. 714}."
  fr: "Gengis Khan marcha; Khwarezmshah s'enfuit du Jainho jusqu'à Nishapur, puis dans le champ d'Hamadan, où l'ennemi l'encercla, massacra ses hommes, et il parvint seul à rejoindre une île à la nage. La pleurésie l'emporta, seul, enveloppé dans un farrash, en 617; tout son royaume s'effondra. Ibn al-Athir: « Le désastre tatar – si quelqu'un avait dit que le monde, depuis la création, n'avait jamais connu de tel, il aurait dit vrai » {cite: Tarikh-Khulafa-Minhaj-1434, p. 714}."
  ur: "چنگیز نے مارچ کیا؛ خوارزمشاہ جیہون سے بھاگ کر نیشاپور چلا گیا، پھر ہمدان کا میدان، جہاں دشمن نے اسے گھیر لیا، اس کے ساتھی کو مار ڈالا، اور وہ اکیلے ہی ایک جزیرے پر تیراکی کی طرف چلا گیا — 617 میں اسے فروش کے کپڑے میں کفن دیا گیا؛ اس کی پوری سلطنت گر گئی. ابن اثیر: 'تاتاری آفت - اگر کسی نے کہا کہ جب سے دنیا کی تخلیق اس کی طرح آزمائی نہیں گئی تو وہ سچ کہے گا'۔ 714}۔"
  tr: "Cengiz Han, Harezm Şah'a doğru ilerledi, ardından Öküz Nehri'nden Nişapur'a kaçtı, sonra Tatarların korkusuyla Hamadan ovasına doğru ilerledi. Düşman onu kuşattı ve yanındaki herkesi öldürdü, o ise canını kurtardı. Bir adaya geçti, orada zatürreye yakalandı ve yalnız başına öldü. Yanında getirdiği bir yatağın tülüne sarıldı. Bu olay Hicri 617 yılında gerçekleşti. Harezm Şah'ın tüm krallığını fethettiler. Sibt el-Cevzi, Tatarların nehrin ötesinde ilk ortaya çıkışının Hicri 615 yılında olduğunu ve Buhara ile Semerkant'ı ele geçirip halkını öldürdüklerini söyledi. İbn el-Atir, Tatar olayının, çağlar boyunca benzeri görülmemiş en büyük olaylardan ve büyük felaketlerden biri olduğunu söyledi. Tüm yaratılışı etkiledi ve özellikle Müslümanlar için çok acı vericiydi. Birisi, Tanrı'nın dünyayı yarattığı zamandan bugüne kadar, böyle bir felaketin hiç yaşanmadığını söylese, doğruyu söylemiş olurdu. {cite:tarikh-khulafa-minhaj-1434 s. 714} İbn el-Athir'e göre, Cengiz Han Semerkant'ı fethettiğinde, yirmi bin süvari gönderdi ve onlara Harezm Şah'ı nerede olursa olsun, hatta gökyüzüne tutunmuş olsa bile, yakalayana kadar aramalarını söyledi. Bu, Tatarların Mağribiler diye adlandırdığı gruptu. Büyük, deriyle kaplı tahta leğenlerle Oxus Nehri'ni geçtiler; leğenlere silahlarını koydular, atları suya attılar ve kuyruklarından tuttular. Her at kendi leğenini çekti. Harezm Şah, birkaç yakın arkadaşıyla birlikte Nişapur'a ve ardından Mazandaran'a gitti, Tatarlar da onu takip etti. Bir yerden ayrıldığında, orada kamp kurarlardı; yağmalama veya öldürme için durmazlardı, ta ki Taberistan Denizi'ndeki Ab Sukun adlı kalesine ulaşana kadar. Gemilere bindi ve Tatarlar onu yakalamaktan umutsuzluğa kapılarak kıyıda beklediler ve geri döndüler. Harezm Şah o kalede öldü. {cite:kamil-ibn-al-athir s. 406-407}"
  id: "Genghis Khan berbaris menuju Khwarazm Shah, kemudian melarikan diri dari Sungai Oxus ke Nishapur, lalu menuju dataran Hamadan karena ketakutan terhadap bangsa Tatar. Musuh mengepungnya dan membunuh semua orang yang bersamanya, namun ia berhasil lolos dengan selamat. Ia menyeberangi sungai ke sebuah pulau, dan terkena radang selaput dada lalu meninggal di sana sendirian dan terisolasi. Ia diselubungi kain kasa dari tempat tidur yang dibawanya. Peristiwa ini terjadi pada tahun 617 Hijriah. Mereka menaklukkan seluruh kerajaan Khwarazm Shah. Sibt al-Jawzi mengatakan bahwa kemunculan pertama bangsa Tatar di seberang sungai adalah pada tahun 615 Hijriah, dan mereka merebut Bukhara dan Samarkand serta membunuh penduduknya. Ibn al-Athir mengatakan bahwa peristiwa Tatar adalah salah satu peristiwa terbesar dan malapetaka besar yang belum pernah terjadi sebelumnya. Peristiwa ini memengaruhi seluruh ciptaan dan sangat menyusahkan bagi umat Islam. Jika seseorang mengatakan bahwa dunia, sejak Tuhan menciptakannya hingga sekarang, belum pernah dilanda sesuatu yang seperti itu, maka ia mengatakan yang sebenarnya. {cite:tarikh-khulafa-minhaj-1434 p. 714} Menurut Ibn al-Athir, ketika Genghis Khan menaklukkan Samarkand, ia mengirim dua puluh ribu penunggang kuda dan menyuruh mereka mencari Khwarazm Shah di mana pun ia berada, bahkan jika ia sedang melayang di langit, sampai mereka menangkapnya. Inilah kelompok yang oleh Tatar disebut Maghrebis. Mereka menyeberangi Sungai Oxus dengan baskom kayu besar yang ditutupi kulit sapi, di mana mereka meletakkan senjata mereka, melemparkan kuda-kuda ke dalam air, dan memegang ekornya. Setiap kuda menarik baskomnya masing-masing. Khwarazm Shah melakukan perjalanan dengan beberapa rekan dekatnya ke Nishapur dan kemudian Mazandaran, dengan Tatar mengikutinya. Setiap kali ia meninggalkan suatu tempat, mereka akan berkemah di sana, tanpa berhenti untuk menjarah atau membunuh, hingga ia mencapai bentengnya di Laut Tabaristan yang dikenal sebagai Ab Sukun. Ia menaiki kapal, dan orang-orang Tatar berdiri di tepi pantai, putus asa untuk menangkapnya, sehingga mereka kembali. Khwarazm Shah meninggal di benteng itu. {cite:kamil-ibn-al-athir p. 406-407}"
