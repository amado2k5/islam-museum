id: event/qarmatian-actions-in-mecca
class: event
kind: revolt
label: { ar: "الحوادث التي أحدثها القرامطة بمكة", en: "The incidents caused by the Qarmatians in Mecca", es: "Los incidentes provocados por los cármatas en La Meca", fr: "Les incidents provoqués par les Qarmates à La Mecque" }
summary:
  ar: "في سنة ست عشرة وثلاثمائة دخل الجنابي القرمطي مكة عند اجتماع الحجاج للموسم، فقتل المسلمين في المسجد الحرام، واقتلع الحجر، وأخذ ما فيها من حلي وآثار، ثم رُدّ الحجر بعد أعوام، وفي الوقت نفسه عاث قرامطة في سواد الفرات {cite:tabari-tarikh-abu-al-fadl j.11 p.119}. وذكر المسعودي في سجل أمراء الحج أنه لم يتم حج في موسم سنة سبع عشرة وثلثمائة من أجل حادثة القرامطة إلا لقوم يسير غزوا وأقيم حجهم دون إمام وكانوا رجالة {cite:muruj-al-dhahab p. 750}، وعند ابن الأثير وفي سنة 317هـ حج بالناس منصور الديلمي فوافاهم أبو طاهر بمكة يوم التروية فنهب أموال الحجاج وقتلوهم حتى في المسجد الحرام وفي البيت نفسه وقلع الحجر الأسود ونقله إلى هجر، وأخرج الوالي ابن مخلد أمير مكة في جماعة من الأشراف فسالوه في أموالهم فلم يشفعوا فقاتلوه فقتلوهم أجمعين، وقلع باب البيت وأصعد رجلاً ليقلع الميزاب فسقط فمات، وطرح القتلى في بئر زمزم ودفن الباقين في المسجد الحرام حيث قُتلوا بغير كفن ولا غسل ولا صُلي على أحد منهم، وأخذ كسوة البيت فقسمها بين أصحابه، فلما بلغ ذلك المهدي أبا محمد عبيد الله بإفريقية كتب إليه ينكر عليه ويلعنه ويقول قد ألحق على شيعتنا ودعاة دولتنا اسم الكفر والإلحاد وإن لم ترد على أهل مكة وعلى الحجاج ما أخذت منهم وترد الحجر الأسود إلى مكانه وكسوة الكعبة فأنا بريء منك في الدنيا والآخرة، فلما وصله الكتاب أعاد الحجر على ما ذُكره واستعاد ما أمكنه من الأموال {cite:kamil-ibn-al-athir p. 154-155}"
  en: "In 316 the Qarmatian al-Janabi entered Mecca as the pilgrims gathered for the season; he killed Muslims in the Sacred Mosque, pulled out the Black Stone and took whatever ornaments and treasures were there. The stone was returned years later. At the same time Qarmatians ravaged the countryside of the Euphrates {cite:tabari-tarikh-abu-al-fadl j.11 p.119}. Al-Mas'udi, in his register of the pilgrimage commanders, notes that in the season of 317 no pilgrimage was completed because of the Qarmatian incident, except for a small group who went out as a raiding party; their pilgrimage was held without an imam, and they were on foot {cite:muruj-al-dhahab p. 750}. According to Ibn al-Athir, in 317 Mansur al-Daylami led the pilgrims, and Abu Tahir reached them in Mecca on the day of Tarwiya. He plundered the pilgrims' property and killed them, even within the Sacred Mosque and inside the House itself, and pulled out the Black Stone and carried it to Hajar. The governor of Mecca, Ibn Makhlad, went out with a group of the ashraf who asked him for their property; they were not granted it, they fought him, and he killed them all. They tore off the Ka'ba's door and sent a man up to pull out the spout, who fell and died; the dead were thrown into the well of Zamzam and the rest buried where they had been killed in the Sacred Mosque, without shroud, washing or prayer. They took the Ka'ba's covering and divided it among their companions. When al-Mahdi Abu Muhammad Ubayd Allah in Ifriqiya heard of this, he wrote to rebuke and curse him: 'You have attached the name of unbelief and apostasy to our Shi'a and the propagandists of our dynasty. Unless you return to the people of Mecca and the pilgrims what you took from them, and restore the Black Stone to its place with the Ka'ba's covering, I am innocent of you in this world and the next.' When the letter reached him he put the stone back as described and recovered what money he could {cite:kamil-ibn-al-athir p. 154-155}"
  es: "En 316, el cármata al-Janabi entró en La Meca cuando los peregrinos se reunían para la temporada; mató a musulmanes en la Mezquita Sagrada, arrancó la Piedra Negra y se llevó todos los ornamentos y tesoros que había allí. La piedra fue devuelta años después. Al mismo tiempo, los cármatas asolaron la campiña del Éufrates {cite:tabari-tarikh-abu-al-fadl j.11 p.119}. Al-Mas'udi, en su registro de comandantes de peregrinación, señala que en la temporada de 317 ninguna peregrinación se completó debido al incidente de los cármatas, excepto un pequeño grupo que salió como partida de asalto; su peregrinación se realizó sin imán y fueron a pie {cite:muruj-al-dhahab p. 750}. Según Ibn al-Athir, en 317 Mansur al-Daylami dirigió a los peregrinos, y Abu Tahir los alcanzó en La Meca el día de Tarwiya. Saqueó las propiedades de los peregrinos y los mató, incluso dentro de la Mezquita Sagrada y dentro de la Casa misma, y arrancó la Piedra Negra y la llevó a Hajar. El gobernador de La Meca, Ibn Makhlad, salió con un grupo de los ashraf que le pidieron sus propiedades; no se las concedió, lucharon contra él y los mató a todos. Arrancaron la puerta de la Kaaba y enviaron a un hombre a sacar el caño, quien cayó y murió; los muertos fueron arrojados al pozo de Zamzam y el resto enterrado donde habían sido asesinados en la Mezquita Sagrada, sin mortaja, lavado ni oración. Tomaron la cubierta de la Kaaba y la dividieron entre sus compañeros. Cuando al-Mahdi Abu Muhammad Ubayd Allah en Ifriqiya se enteró de esto, escribió para reprenderlo y maldecirlo: 'Has asociado el nombre de incredulidad y apostasía a nuestros chiítas y a los propagandistas de nuestra dinastía. A menos que devuelvas a la gente de La Meca y a los peregrinos lo que les quitaste, y coloques la Piedra Negra en su lugar junto con la cubierta de la Kaaba, no tengo nada que ver contigo en este mundo ni en el próximo. Cuando la carta le llegó, volvió a colocar la piedra como se describía y recuperó el dinero que pudo. {cita:kamil-ibn-al-athir págs. 154-155}"
  fr: "En 316, le Qarmate al-Janabi entra à La Mecque alors que les pèlerins s'y rassemblaient pour la saison. Il massacra des musulmans dans la Mosquée sacrée, arracha la Pierre Noire et s'empara de tous les ornements et trésors qui s'y trouvaient. La pierre fut restituée des années plus tard. Au même moment, les Qarmates ravagèrent la campagne de l'Euphrate (voir Tabari-Tarikh-Abu-al-Fadl, vol. 11, p. 119). Al-Mas'udi, dans son registre des chefs de pèlerinage, note qu'en 317, aucun pèlerinage ne put être accompli en raison de l'incident qarmate, à l'exception d'un petit groupe parti en expédition de pillage; leur pèlerinage se déroula sans imam et ils parcoururent la région à pied (voir Muruj-al-Dhahab, p. 750). Selon Ibn al-Athir, en 317, Mansur al-Daylami mena les pèlerins, et Abu Tahir les rejoignit à La Mecque le jour de Tarwiya. Il pilla les biens des pèlerins et les massacra, même à l'intérieur de la Mosquée sacrée et de la Kaaba elle-même, puis arracha la Pierre Noire et la transporta à Hajar. Le gouverneur de La Mecque, Ibn Makhlad, sortit avec un groupe d'ashraf qui lui réclamèrent leurs biens; ils les lui refusèrent, ils le combattirent et il les tua tous. Ils arrachèrent la porte de la Kaaba et envoyèrent un homme en extraire le bec verseur, mais celui-ci tomba et mourut. Les morts furent jetés dans le puits de Zamzam et les autres enterrés là où ils avaient été tués, dans la Mosquée sacrée, sans linceul, sans ablution ni prière. Ils prirent le revêtement de la Kaaba et le partagèrent entre leurs compagnons. Lorsqu'al-Mahdi Abu Muhammad Ubayd Allah, à Ifriqiya, apprit cela, il lui écrivit pour le réprimander et le maudire: « Tu as associé le nom d'incroyance et d'apostasie à nos chiites et aux propagandistes de notre dynastie. » À moins que tu ne rendes aux habitants de La Mecque et aux pèlerins ce que tu leur as pris, et que tu ne remettes la Pierre Noire à sa place, recouverte du voile de la Kaaba, je te serai innocenté dans ce monde et dans l'autre. Lorsque la lettre lui parvint, il remit la pierre en place comme indiqué et récupéra l'argent qu'il put obtenir. {cite:kamil-ibn-al-athir p. 154-155}"
