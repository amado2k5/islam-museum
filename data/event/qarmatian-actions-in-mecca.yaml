id: event/qarmatian-actions-in-mecca
class: event
kind: revolt
label: { ar: "الحوادث التي أحدثها القرامطة بمكة", en: "The incidents caused by the Qarmatians in Mecca" }
summary:
  ar: "في سنة ست عشرة وثلاثمائة دخل الجنابي القرمطي مكة عند اجتماع الحجاج للموسم، فقتل المسلمين في المسجد الحرام، واقتلع الحجر، وأخذ ما فيها من حلي وآثار، ثم رُدّ الحجر بعد أعوام، وفي الوقت نفسه عاث قرامطة في سواد الفرات {cite:tabari-tarikh-abu-al-fadl j.11 p.119}. وذكر المسعودي في سجل أمراء الحج أنه لم يتم حج في موسم سنة سبع عشرة وثلثمائة من أجل حادثة القرامطة إلا لقوم يسير غزوا وأقيم حجهم دون إمام وكانوا رجالة {cite:muruj-al-dhahab p. 750}، وعند ابن الأثير وفي سنة 317هـ حج بالناس منصور الديلمي فوافاهم أبو طاهر بمكة يوم التروية فنهب أموال الحجاج وقتلوهم حتى في المسجد الحرام وفي البيت نفسه وقلع الحجر الأسود ونقله إلى هجر، وأخرج الوالي ابن مخلد أمير مكة في جماعة من الأشراف فسالوه في أموالهم فلم يشفعوا فقاتلوه فقتلوهم أجمعين، وقلع باب البيت وأصعد رجلاً ليقلع الميزاب فسقط فمات، وطرح القتلى في بئر زمزم ودفن الباقين في المسجد الحرام حيث قُتلوا بغير كفن ولا غسل ولا صُلي على أحد منهم، وأخذ كسوة البيت فقسمها بين أصحابه، فلما بلغ ذلك المهدي أبا محمد عبيد الله بإفريقية كتب إليه ينكر عليه ويلعنه ويقول قد ألحق على شيعتنا ودعاة دولتنا اسم الكفر والإلحاد وإن لم ترد على أهل مكة وعلى الحجاج ما أخذت منهم وترد الحجر الأسود إلى مكانه وكسوة الكعبة فأنا بريء منك في الدنيا والآخرة، فلما وصله الكتاب أعاد الحجر على ما ذُكره واستعاد ما أمكنه من الأموال {cite:kamil-ibn-al-athir p. 154-155}"
  en: "In 316 the Qarmatian al-Janabi entered Mecca as the pilgrims gathered for the season; he killed Muslims in the Sacred Mosque, pulled out the Black Stone and took whatever ornaments and treasures were there. The stone was returned years later. At the same time Qarmatians ravaged the countryside of the Euphrates {cite:tabari-tarikh-abu-al-fadl j.11 p.119}. Al-Mas'udi, in his register of the pilgrimage commanders, notes that in the season of 317 no pilgrimage was completed because of the Qarmatian incident, except for a small group who went out as a raiding party; their pilgrimage was held without an imam, and they were on foot {cite:muruj-al-dhahab p. 750}. According to Ibn al-Athir, in 317 Mansur al-Daylami led the pilgrims, and Abu Tahir reached them in Mecca on the day of Tarwiya. He plundered the pilgrims' property and killed them, even within the Sacred Mosque and inside the House itself, and pulled out the Black Stone and carried it to Hajar. The governor of Mecca, Ibn Makhlad, went out with a group of the ashraf who asked him for their property; they were not granted it, they fought him, and he killed them all. They tore off the Ka'ba's door and sent a man up to pull out the spout, who fell and died; the dead were thrown into the well of Zamzam and the rest buried where they had been killed in the Sacred Mosque, without shroud, washing or prayer. They took the Ka'ba's covering and divided it among their companions. When al-Mahdi Abu Muhammad Ubayd Allah in Ifriqiya heard of this, he wrote to rebuke and curse him: 'You have attached the name of unbelief and apostasy to our Shi'a and the propagandists of our dynasty. Unless you return to the people of Mecca and the pilgrims what you took from them, and restore the Black Stone to its place with the Ka'ba's covering, I am innocent of you in this world and the next.' When the letter reached him he put the stone back as described and recovered what money he could {cite:kamil-ibn-al-athir p. 154-155}"
