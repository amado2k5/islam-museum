label: { ar: "الحوادث التي أحدثها القرامطة بمكة" }
summary:
  ar: "في سنة ست عشرة وثلاثمائة دخل الجنابي القرمطي مكة عند اجتماع الحجاج للموسم، فقتل المسلمين في المسجد الحرام، واقتلع الحجر، وأخذ ما فيها من حلي وآثار، ثم رُدّ الحجر بعد أعوام، وفي الوقت نفسه عاث قرامطة في سواد الفرات {cite:tabari-tarikh-abu-al-fadl j.11 p.119}.، وذكر المسعودي في سجل أمراء الحج أنه لم يتم حج في موسم سنة سبع عشرة وثلثمائة من أجل حادثة القرامطة إلا لقوم يسير غزوا وأقيم حجهم دون إمام وكانوا رجالة {cite:muruj-al-dhahab p. 750}"
