summary:
  ar: "قال أبو قيس بن الأسلت للأوس ما كنت رئيس قوم قط إلا هزموا فرئسوا عليكم من أحببتم فرأسوا حضير الكتائب بن السماك الأشهلي والد أسيد بن حضير، فالتقى الأوس والخزرج بالغرس فكان الظفر للأوس، ثم تراسلوا في الصلح فاصطلحوا أن يحسبوا القتلى فمن كان عليه الفضل أعطى الدية فأفضلت الأوس على الخزرج ثلاثة نفر فدفعت الخزرج ثلاثة غلمة رهنًا بالديات فغدرت الأوس فقتلت الغلمان {cite:kamil-ibn-al-athir p. 506}."
  en: "Abū Qays ibn al-Aslat, saying no people he led had ever won, gave the Aws leave to choose their own chief: they picked Ḥuḍayr al-Katāʾib ibn al-Simmāk, father of Usayd. At al-Ghars the day went to the Aws. They agreed to settle the dead — excess for blood-price — and the Aws proved ahead by three, so the Khazraj gave three lads as surety for the dīyat; the Aws treacherously killed the hostages {cite:kamil-ibn-al-athir p. 506}."
