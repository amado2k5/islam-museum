label: { ar: "يوم الغرس — رئاسة حضير الكتائب على الأوس والصلح بالتفاضل", en: "the day of al-Ghars — Ḥuḍayr given command, victory to the Aws, the three-man blood-price", es: "El día de al-Ghars: Ḥuḍayr recibe el mando, victoria para los Aws, el sacrificio de sangre de tres hombres.", fr: "Le jour d'al-Ghars — Ḥuḍayr reçoit le commandement, victoire aux Aws, le prix du sang des trois hommes", ur: "یوم الغرس - حُدیر کو حکم دیا گیا، اوس کو فتح، تین آدمیوں کے خون کی قیمت" }
date:
  start: { edtf: "0610~", calendar: julian, precision: century, status: tradition, derived: true, note: "جاهلي؛ التاريخ تقريبي عند أهل الأيام {cite:kamil-ibn-al-athir p. 506}." }
summary:
  ar: "قال أبو قيس بن الأسلت للأوس ما كنت رئيس قوم قط إلا هزموا فرئسوا عليكم من أحببتم فرأسوا حضير الكتائب بن السماك الأشهلي والد أسيد بن حضير، فالتقى الأوس والخزرج بالغرس فكان الظفر للأوس، ثم تراسلوا في الصلح فاصطلحوا أن يحسبوا القتلى فمن كان عليه الفضل أعطى الدية فأفضلت الأوس على الخزرج ثلاثة نفر فدفعت الخزرج ثلاثة غلمة رهنًا بالديات فغدرت الأوس فقتلت الغلمان {cite:kamil-ibn-al-athir p. 506}."
  en: "Abū Qays ibn al-Aslat, saying no people he led had ever won, gave the Aws leave to choose their own chief: they picked Ḥuḍayr al-Katāʾib ibn al-Simmāk, father of Usayd. At al-Ghars the day went to the Aws. They agreed to settle the dead — excess for blood-price — and the Aws proved ahead by three, so the Khazraj gave three lads as surety for the dīyat; the Aws treacherously killed the hostages {cite:kamil-ibn-al-athir p. 506}."
  es: "Abū Qays ibn al-Aslat, diciendo que ningún pueblo que él liderara había ganado jamás, dio permiso a los Aws para elegir a su propio jefe: escogieron a Ḥuḍayr al-Katāʾib ibn al-Simmāk, padre de Usayd. En al-Ghars, la victoria fue para los Aws. Acordaron pagar por los muertos —el excedente por el precio de la sangre— y los Aws demostraron tener una ventaja de tres, por lo que el Khazraj dio tres muchachos como fiadores para el dīyat; los Aws asesinaron traicioneramente a los rehenes {cite:kamil-ibn-al-athir p. 506}."
  fr: "Abū Qays ibn al-Aslat, affirmant qu'aucun peuple qu'il avait mené n'avait jamais remporté de victoire, autorisa les Aws à choisir leur chef: ils choisirent Ḥuḍayr al-Katāʾib ibn al-Simmāk, père d'Usayd. À al-Ghars, la victoire revint aux Aws. Ils convinrent de régler le sort des morts – l'excédent contre le prix du sang – et les Aws l'emportèrent de trois hommes. Le Khazraj offrit alors trois jeunes gens en garantie pour la dīyat; les Aws, par traîtrise, exécutèrent les otages (voir: Kamil ibn al-Athir, p. 506)."
  ur: "ابو قیس بن الاصلت نے یہ کہتے ہوئے کہ ان کی قیادت میں کوئی بھی قوم کبھی نہیں جیتی تھی، اوس کو اجازت دی کہ وہ اپنا سردار منتخب کریں: انہوں نے اسید کے والد حذیر الکتاب ابن الصمق کو چن لیا۔ الغرس میں دن اوس کو گیا۔ وہ مُردوں کو طے کرنے پر راضی ہو گئے - خون کی زیادتی - اور اوس تین سے آگے ثابت ہوا، تو خزرج نے دیت کے ضامن کے طور پر تین لڑکوں کو دیا۔ اوس نے غداری کے ساتھ یرغمالیوں کو قتل کیا 506}۔"
