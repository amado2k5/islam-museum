label: { ar: "سيرة ابن سمرة إلى كابل", en: "Ibn Samura's March to Kabul", es: "La marcha de Ibn Samura a Kabul", fr: "La marche d'Ibn Samura vers Kaboul", ur: "ابن سمرہ کا کابل کی طرف مارچ", tr: "İbn Samra'nın Kabil'e biyografisi", id: "Biografi Ibnu Samra ke Kabul" }
summary:
  ar: "لما استعمل معاوية ابن عامر على البصرة ولّى عبد الرحمن بن سمرة سجستان وعلى شرطته عباد بن الحصين الحبطي ومعه من الأشراف عمر بن عبيد الله بن معمر التيمي وعبد الله بن خازم السلمي وقطري بن الفجاءة والمهلب بن أبي صفرة فكان يغزو البلد قد كفر أهلها فيفتحه عنوة أو يصالح أهله حتى بلغ كابل فنزل بها فحاصر أهلها أشهراً يقاتلهم ويرميهم بالمنجنيق حتى ثلم ثلمة عظيمة فبات عليها عباد بن الحصين ليلة يطاعن المشركين حتى أصبح فلم يقدروا على سدها وكان الحسن البصري يقول ما ظننت أن رجلاً يقوم مقام ألف حتى رأيت عباد بن الحصين ولما أصبح الكفرة خرجوا يقاتلون المسلمين فضرب ابن خازم فيلاً كان معهم فسقط على الباب الذي خرجوا منه فلم يقدروا على غلقه فدخلها المسلمون عنوة وقال أبو مخنف الذي عقر الفيل المهلب ووجه ابن سمرة بشارة الفتح عمر بن عبيد الله بن معمر والمهلب بن أبي صفرة ثم قطع وادي نسل فأتى خواش وقوزان بست ففتحها عنوة وسار إلى وزان فهرب أهلها وغلب عليها ثم خشك فصالحه أهلها ثم الأخج فقاتلوه فظفر بهم وفتحها ثم زابلستان وقد نكث أهلها ففتحها وأصاب سبياً وأتى كابل وقد نكث أهلها ففتحها."
  en: "Mu'awiya's appointment of Ibn Amir over Basra sent Ibn Samura back to Sijistan — Abbad ibn al-Husayn al-Habati over his shurta, and with him the ashraf Umar ibn Ubaydallah ibn Ma'mar, Abdullah ibn Khazim, Qatari ibn al-Fuja'a and al-Muhallab ibn Abi Sufra — reconquering town after town whose folk had apostatized, by force or sulh, until Kabul. Months of siege and mangonels opened a great breach; Abbad spent the night spearing the polytheists so they could not close it — al-Hasan: 'I never thought one man could stand for a thousand until I saw Abbad ibn al-Husayn'. At dawn the foe sallied; Ibn Khazim hamstrung their elephant which fell blocking the gate so they could not shut it — Abu Mikhnaf says it was al-Muhallab — and the Muslims entered by force. Victory-dispatch went with Umar ibn Ubaydallah and al-Muhallab; then Ibn Samura crossed Wadi Nasl, took Khawash and Quzan by force, Wazan whose folk fled, Khushak by sulh, al-Akhj by fighting, Zabulistan broken with captives, and Kabul again."
  es: "El nombramiento de Ibn Amir por parte de Mu'awiya sobre Basora envió a Ibn Samura de regreso a Sijistan — Abbad ibn al-Husayn al-Habati sobre su shurta, y con él los ashraf Umar ibn Ubaydallah ibn Ma'mar, Abdullah ibn Khazim, Qatari ibn al-Fuja'a y al-Muhallab ibn Abi Sufra — reconquistando ciudad tras ciudad cuyos habitantes habían apostatado, por la fuerza o por sulh, hasta Kabul. Meses de asedio y mangoneles abrieron una gran brecha; Abbad pasó la noche lanzando a los politeístas para que no pudieran cerrarla — al-Hasan: 'Nunca pensé que un hombre pudiera resistir por mil hasta que vi a Abbad ibn al-Husayn'. Al amanecer el enemigo salió; Ibn Khazim inmovilizó a su elefante, que cayó bloqueando la puerta, impidiendo que la cerraran —Abu Mikhnaf afirma que fue al-Muhallab—, y los musulmanes entraron por la fuerza. El mensaje de la victoria fue enviado con Umar ibn Ubaydallah y al-Muhallab; luego Ibn Samura cruzó Wadi Nasl, tomó Khawash y Quzan por la fuerza, Wazan, cuyos habitantes huyeron, Khushak por sulh, al-Akhj combatiendo, Zabulistán fue conquistado con cautivos, y Kabul fue nuevamente tomada."
  fr: "La nomination d'Ibn Amir à la tête de Bassora par Mu'awiya força Ibn Samura à retourner au Sijistan, Abbad ibn al-Husayn al-Habati à la tête de sa shurta, accompagné de ses disciples Umar ibn Ubaydallah ibn Ma'mar, Abdullah ibn Khazim, Qatari ibn al-Fuja'a et al-Muhallab ibn Abi Sufra. Ils reconquirent ville après ville, par la force ou par la sulh, les habitants ayant apostasié, jusqu'à Kaboul. Des mois de siège et de mangonneaux ouvrirent une brèche béante. Abbad passa la nuit à transpercer les polythéistes de ses lances afin qu'ils ne puissent la refermer. Al-Hasan déclara: « Je n'aurais jamais cru qu'un seul homme puisse en affronter mille avant de voir Abbad ibn al-Husayn. » À l'aube, l'ennemi lança une sortie. Ibn Khazim blessa leur éléphant, qui tomba et bloqua la porte, les empêchant de la fermer. Abu Mikhnaf affirme qu'il s'agissait d'al-Muhallab. Les musulmans entrèrent alors par la force. La charge victorieuse accompagna Umar ibn Ubaydallah et al-Muhallab. Ibn Samura traversa ensuite le Wadi Nasl, prit Khawash et Quzan par la force, puis Wazan dont les habitants s'enfuirent, Khushak par la force, al-Akhj par les combats, Zabulistan fut dévasté et les captifs furent faits, et Kaboul reprit le contrôle de la ville."
  ur: "معاویہ کی بصرہ پر ابن عامر کی تقرری نے ابن سمرہ کو واپس سجستان بھیج دیا - عباد بن الحسین الحباطی کو اس کی شرارت پر اور اس کے ساتھ اشرف عمر بن عبیداللہ ابن معمر، عبداللہ ابن خزیم، قطری ابن الفضلابعنبی۔ ایک شہر کے بعد شہر دوبارہ فتح کرنے والا جس کے لوگوں نے زبردستی یا سلہ کے ذریعے کابل تک مرتد کر دیا تھا۔ مہینوں کے محاصرے اور مینگونیل نے ایک عظیم خلاف ورزی کا آغاز کیا۔ عباد نے رات مشرکین کے نیزے پر گزاری تاکہ وہ اسے بند نہ کر سکیں - الحسن: 'میں نے کبھی سوچا بھی نہیں تھا کہ ایک آدمی ہزار کے لیے کھڑا ہو سکتا ہے جب تک میں نے عباد بن الحسین کو نہ دیکھا'۔ فجر کے وقت دشمن نے حملہ کیا۔ ابن خزیم نے ان کے ہاتھی کو کاٹ دیا جو دروازے کو روکتا ہوا گر گیا اس لیے وہ اسے بند نہ کر سکے - ابو مخنف کہتے ہیں کہ یہ المحلب تھا - اور مسلمان طاقت کے ساتھ داخل ہوئے۔ فتح کی روانگی عمر بن عبیداللہ اور المحلب کے ساتھ گئی۔ اس کے بعد ابن سمرہ نے وادی نصل کو عبور کیا، خواش اور قزان کو زبردستی لے لیا، وازان جس کے لوگ بھاگ گئے، خوشک کے ذریعے سلح، الخج نے لڑائی سے، زابلستان کو قیدیوں کے ساتھ توڑ دیا، اور دوبارہ کابل۔"
  tr: "Muaviye ibn Emir onu Basra valisi olarak atadığında, Abdurrahman ibn Samura'yı Sijistan valisi ve Abbasi ibn Hüseyin el-Habti'yi de polis şefi olarak atadı. Yanında bazı soylular da vardı: Ömer ibn Ubeydullah ibn Muammar el-Taymi, Abdullah ibn Khazim el-Sulami, Katari ibn el-Fuja'ah ve el-Muhallab ibn Abi Sufrah. Kabil'e ulaşana kadar, halkı kâfir olmuş şehirleri yağmaladı, onları zorla ele geçirdi veya onlarla barış yaptı. Aylarca şehrin sakinlerini kuşattı, onlarla savaştı ve mancınıklarla bombaladı, ta ki büyük bir gedik açana kadar. Abbasi ibn Hüseyin bu gedikte geceyi geçirdi, kâfirlerle sabaha kadar savaştı, ancak sabah gedikleri kapatılamadı. Hasan el-Basri, \"Abbad ibn el-Hüseynin'i görene kadar bir insanın bin kişiye bedel olabileceğini hiç düşünmemiştim\" dedi. Sabah olunca kâfirler Müslümanlarla savaşmak için çıktılar, fakat İbn Hazim onlarla birlikte olan bir file vurdu ve fil, çıktıkları kapının üzerine düşerek kapıyı kapatmalarını engelledi. Bunun üzerine Müslümanlar şehre zorla girdiler. Ebu Mikhnaf, fili sakatlayanın el-Muhallab olduğunu söyledi. İbn Samurah, zaferin müjdesini Ömer ibn Ubeyd Allah ibn Muammar ve el-Muhallab ibn Abi Sufrah'a gönderdi. Sonra Nasl Vadisi'ni geçip şehre ulaştı. Khawash ve Qozan'ı zorla ele geçirdi, sonra Wazzan'a yürüdü, halkı kaçtı ve şehri fethetti. Sonra Khashak ve halkı onunla barıştı. Sonra Al-Akhaj'a gitti ve onunla savaştılar, ama o onlara karşı zafer kazandı ve şehri fethetti. Sonra Zabulistan ve halkı yeminlerini bozdu, bu yüzden orayı fethetti ve esir aldı. Sonra Kabil'e geldi ve oradaki halk da yeminlerini bozdu, bu yüzden orayı da fethetti."
  id: "Ketika Mu'awiyah ibn 'Amir mengangkatnya sebagai gubernur Basra, ia juga mengangkat 'Abd al-Rahman ibn Samurah sebagai gubernur Sijistan dan 'Abbad ibn al-Husayn al-Habti sebagai kepala polisi. Bersamanya ada beberapa bangsawan: 'Umar ibn 'Ubayd Allah ibn Mu'ammar al-Taymi, 'Abd Allah ibn Khazim al-Sulami, Qatari ibn al-Fuja'ah, dan al-Muhallab ibn Abi Sufrah. Ia akan menyerbu kota-kota yang penduduknya telah menjadi kafir, menaklukkannya dengan kekerasan atau berdamai dengan mereka, hingga ia mencapai Kabul. Ia mengepung penduduknya selama berbulan-bulan, memerangi mereka dan membombardir mereka dengan ketapel hingga ia berhasil membuat celah besar. 'Abbad ibn al-Husayn menghabiskan malam di celah ini, memerangi orang-orang kafir hingga pagi hari, ketika mereka tidak mampu menutupnya kembali. Al-Hasan al-Basri berkata, \"Aku tidak pernah menyangka satu orang bisa bernilai seribu orang sampai aku melihat 'Abbad ibn al-Husayn.\" Ketika pagi tiba, orang-orang kafir keluar untuk memerangi kaum Muslimin, tetapi Ibn Khazim memukul seekor gajah yang bersama mereka, menyebabkan gajah itu jatuh di gerbang tempat mereka keluar, sehingga mereka tidak dapat menutupnya. Kaum Muslimin kemudian memasuki kota dengan paksa. Abu Mikhnaf berkata bahwa al-Muhallab-lah yang melumpuhkan gajah itu. Ibn Samurah mengutus 'Umar ibn 'Ubayd Allah ibn Mu'ammar dan al-Muhallab ibn Abi Sufrah dengan kabar gembira tentang kemenangan itu. Kemudian ia menyeberangi Wadi Nasl dan tiba. Ia menaklukkan Khawash dan Qozan dengan paksa, kemudian berbaris ke Wazzan, dan penduduknya melarikan diri, dan ia menaklukkannya. Kemudian Khashak, dan penduduknya berdamai dengannya. Kemudian Al-Akhaj, dan mereka memeranginya, tetapi ia menang atas mereka dan menaklukkannya. Kemudian Zabulistan dan penduduknya melanggar sumpah mereka, sehingga ia menaklukkannya dan menawan mereka. Lalu ia datang ke Kabul, dan penduduknya melanggar sumpah mereka, sehingga ia menaklukkannya."
