summary:
  ar: "ملك شمس الدين إيلدكز أتابك أذربيجان مدينة الريّ، وكان ملكه لها بواسطة ابن عربشاه الإبراهيمي وزير السلطان أرسلان بن طغرل، ثم استقلّ بأذربيجان والجبل {cite:kamil-ibn-al-athir p. 20}."
  en: "Shams al-Dīn Īldigiz, atabeg of Azerbaijan, took al-Rayy — won through the vizier Ibn ʿArabshāh al-Ibrāhīmī — then held Azerbaijan and the Jibāl as an independent power {cite:kamil-ibn-al-athir p. 20}."
  es: "Shams al-Dīn Īldigiz, atabeg de Azerbaiyán, tomó al-Rayy (ganado a través del visir Ibn ʿArabshāh al-Ibrāhīmī) y luego mantuvo Azerbaiyán y el Jibāl como una potencia independiente {citar:kamil-ibn-al-athir p. 20}."
  fr: "Shams al-Dīn Īldigiz, atabeg d'Azerbaïdjan, prit al-Rayy — gagné par l'intermédiaire du vizir Ibn ʿArabshāh al-Ibrāhīmī — puis détena l'Azerbaïdjan et le Jibāl comme puissance indépendante {cite:kamil-ibn-al-athir p. 20}."
  ur: "آذربائیجان کے اتابیگ شمس الدین الدجیز نے الرائے پر قبضہ کیا - وزیر ابن عربشاہ الابراہیمی کے ذریعے جیت لیا - پھر آذربائیجان اور جبل کو ایک آزاد طاقت کے طور پر تھام لیا۔ 20}۔"
