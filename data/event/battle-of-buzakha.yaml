label: { ar: "وقعة بزاخة", en: "The Battle of Buzakha" }
summary:
  ar: "عند البلاذري: عقد أبو بكر وهو بالقصّة لخالد بن الوليد على الناس ولثابت بن قيس على الأنصار وأمر خالداً أن يصمد لطليحة بن خويلد الأسدي وكان قد ادعى النبوة وهو يومئذ ببزاخة وبزاحة ماء لبني أسد بن خزيمة؛ فسار إليه خالد وقدّم أمامه عكاشة بن محصن الأسدي حليف بني عبد شمس وثابت بن أقرم البلوي حليف الأنصار فلقيهما هبال بن خويلد فقتلاهما وخرج طليحة وسلمة أخوه فلقيا عكاشة وثابتاً فقتلاهما، وقال فيهما طليحة شعره المروي؛ ثم التقى المسلمون وعدوهم فاقتتلوا قتالاً شديداً وكان عيينة بن حصن الفزاري مع طليحة في سبعمائة من بني فزارة، فلما رأى سيوف المسلمين قد استلحمت المشركين سأل طليحة «هل جاءك جبريل بشيء؟» فقال «نعم، جاءني فقال: إن لك رحاً كرحاه ويوماً لا تنساه» فقال عيينة «أرى والله أن لك يوماً لا تنساه — يا بني فزارة هذا كذاب» وولّى عن عسكره فانهزم الناس وظهر المسلمون؛ وأُسر عيينة فقُدم به المدينة فحقن أبو بكر دمه وخلى سبيله، وهرب طليحة فاغتسل وأحرم بعمرة ثم أتى المدينة."
  en: "In al-Baladhuri: Abu Bakr, while at al-Qassa, gave the command of the army to Khalid ibn al-Walid and of the Ansar to Thabit ibn Qays, ordering Khalid to confront Tulayha ibn Khuwaylid al-Asadi — who had claimed prophecy and was then at Buzakha and Buzaha, the watering-place of Banu Asad ibn Khuzayma; Khalid marched on him sending ahead Ukasha ibn Mihsan al-Asadi, ally of Banu Abd Shams, and Thabit ibn Aqram al-Balawi, ally of the Ansar, whom Hibal ibn Khuwaylid met and killed — and Tulayha and his brother Salama then went out, met Ukasha and Thabit and killed them, Tulayha reciting his verse on it; the Muslims and their enemy then met in hard fighting, Uyayna ibn Hisn al-Fazari being with Tulayha in seven hundred of Banu Fazara, and when he saw the Muslims' swords had prevailed over the polytheists he asked Tulayha 'has Gabriel brought you anything?' — 'yes, he came and said you shall have a millstone like his and a day you will not forget' — whereupon Uyayna cried 'by God I see you shall have a day you will not forget! Banu Fazara — this man is a liar', wheeled his men away, the people routed and the Muslims prevailed; Uyayna was captured, brought to Medina, and Abu Bakr spared his blood and released him, while Tulayha fled, washed, entered ihram for an umra and then came to Medina."
