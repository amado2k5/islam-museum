id: event/digging-of-nahr-ibn-umar
class: event
kind: other
label: { ar: "حفر نهر ابن عمر", en: "Digging of Nahr Ibn Umar", es: "La excavación de Nahr Ibn Umar", fr: "Creusement du Nahr Ibn Umar" }
summary:
  ar: "لما قدم عبد الله بن عمر بن عبد العزيز عاملاً على الأعمال من قبل يزيد بن الوليد أتاه أهل البصرة فشكوا إليه ملوحة مائهم وحملوا إليه قارورتين في إحداهما ماء من ماء البصرة وفي الأخرى ماء من ماء البطيحة فرأى بينهما فصلاً فقالوا إنك إن حفرت لنا نهراً شربنا من هذا العذب فكتب بذلك إلى يزيد فكتب إليه يزيد إن بلغت نفقة هذا النهر خراج العراق ما كان في أيدينا فأنفقه عليه فحفر النهر الذي يعرف بنهر ابن عمر وقال رجل في مجلس ابن عمر والله إني أحسب نفقة هذا النهر تبلغ ثلاثمائة ألف أو أكثر فقال ابن عمر لو بلغت لخراج العراق لأنفقته عليه."
  en: "Abdallah ibn Umar ibn Abd al-Aziz, Yazid ibn al-Walid's governor, received the Basrans with two flasks — Basra water and batiha water — and saw the difference: 'dig us a canal and we drink this sweet'. He wrote Yazid, who answered 'if the canal's cost reaches Iraq's kharaj, spend what we hold on it'; Nahr Ibn Umar was dug, and when a man guessed the cost at three hundred thousand, Ibn Umar said 'were it Iraq's whole kharaj, I would spend it'."
  es: "Abdallah ibn Umar ibn Abd al-Aziz, gobernador de Yazid ibn al-Walid, recibió a los basranos con dos cantimploras —una de agua de Basora y otra de agua de batiha— y notó la diferencia: «Cavad un canal para nosotros y beberemos esta agua dulce». Escribió a Yazid, quien respondió: «Si el coste del canal alcanza el kharaj de Irak, gastad lo que tenemos en él». Se excavó el canal Nahr Ibn Umar, y cuando un hombre estimó el coste en trescientos mil, Ibn Umar dijo: «Aunque fuera todo el kharaj de Irak, lo gastaría»."
  fr: "Abdallah ibn Umar ibn Abd al-Aziz, gouverneur de Yazid ibn al-Walid, reçut les habitants de Basra avec deux fioles: l'une contenant de l'eau de Basra, l'autre de l'eau de batiha. Constatant la différence, il s'exclama: « Creusez-nous un canal et nous boirons cette eau douce ! » Il écrivit à Yazid, qui répondit: « Si le coût du canal atteint le kharaj de l'Irak, dépensez-y toutes nos économies. » Le canal Nahr Ibn Umar fut creusé, et lorsqu'un homme estima le coût à trois cent mille roupies, Ibn Umar déclara: « Même si cela représentait le kharaj de l'Irak tout entier, je le dépenserais. »"
