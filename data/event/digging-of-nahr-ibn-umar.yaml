label: { ar: "حفر نهر ابن عمر", en: "Digging of Nahr Ibn Umar" }
summary:
  ar: "لما قدم عبد الله بن عمر بن عبد العزيز عاملاً على الأعمال من قبل يزيد بن الوليد أتاه أهل البصرة فشكوا إليه ملوحة مائهم وحملوا إليه قارورتين في إحداهما ماء من ماء البصرة وفي الأخرى ماء من ماء البطيحة فرأى بينهما فصلاً فقالوا إنك إن حفرت لنا نهراً شربنا من هذا العذب فكتب بذلك إلى يزيد فكتب إليه يزيد إن بلغت نفقة هذا النهر خراج العراق ما كان في أيدينا فأنفقه عليه فحفر النهر الذي يعرف بنهر ابن عمر وقال رجل في مجلس ابن عمر والله إني أحسب نفقة هذا النهر تبلغ ثلاثمائة ألف أو أكثر فقال ابن عمر لو بلغت لخراج العراق لأنفقته عليه."
  en: "Abdallah ibn Umar ibn Abd al-Aziz, Yazid ibn al-Walid's governor, received the Basrans with two flasks — Basra water and batiha water — and saw the difference: 'dig us a canal and we drink this sweet'. He wrote Yazid, who answered 'if the canal's cost reaches Iraq's kharaj, spend what we hold on it'; Nahr Ibn Umar was dug, and when a man guessed the cost at three hundred thousand, Ibn Umar said 'were it Iraq's whole kharaj, I would spend it'."
