label: { ar: "دخول العثمانيين اليمن", en: "The Ottoman Entry into Yemen", es: "La entrada del Imperio Otomano en Yemen", fr: "L'entrée ottomane au Yémen", ur: "یمن میں عثمانیوں کا داخلہ", tr: "Osmanlı İmparatorluğu'nun Yemen'e girişi", id: "Masuknya Ottoman ke Yaman" }
summary:
  ar: "بعد انهزام المماليك قدّم حاكم اليمن المملوكي إسكندر وفداً إلى السلطان سليم يعلن الولاء والطاعة فأبقاه في منصبه، وكانت السيطرة العثمانية أول الأمر ضعيفة لصراعات القادة ونفوذ الإمامة الزيدية بين قبائل الجبال والخطر البرتغالي على السواحل. ثم أرسل السلطان سليمان حملة سلمان باشا الأرناؤطي سنة ٩٤٥هـ/١٥٣٨م تضم ٧٤ سفينة وعشرين ألف مقاتل بهدف احتلال عدن وإغلاق باب المندب أمام السفن البرتغالية، فدخل العثمانيون عدن عام ٩٤٦هـ/١٥٣٩م وتعز عام ٩٥٢هـ/١٥٤٥م وسقطت صنعاء عام ٩٥٤هـ/١٥٤٧م، وتحرك سلمان بأسطوله فاستولى على موانئ حضرموت كالشحر والمكلا واجتاح ساحل الحبشة وسواكن ومصوع عام ٩٦٤هـ/١٥٥٧م. وظلت اليمن طيلة فترة خضوعها ⁦(١٥٣٨–١٦٣٥م)⁩ متنازعاً بين العثمانيين والأئمة الزيدية، فلم يضمن العثمانيون سيطرة حقيقية على البلاد {cite:dawlat-uthmaniyya-salabi p. 191-192}."
  en: "The first Ottoman entry into Yemen: Sulayman's 1538 expedition under Salman Pasha with 74 ships and 20,000 men took Aden, Taiz and finally Sanaa by 1547, closing Bab al-Mandab to the Portuguese — yet Yemen stayed contested with the Zaydi imams until 1635 {cite:dawlat-uthmaniyya-salabi p. 191-192}."
  es: "La primera entrada otomana en Yemen: la expedición de Sulayman de 1538 bajo el mando de Salman Pasha con 74 barcos y 20.000 hombres tomó Adén, Taiz y finalmente Sanaa en 1547, cerrando Bab al-Mandab a los portugueses; sin embargo, Yemen siguió siendo disputado con los imanes zaidíes hasta 1635 {cite:dawlat-uthmaniyya-salabi p. 191-192}."
  fr: "La première entrée ottomane au Yémen: l'expédition de Sulayman en 1538 sous le commandement de Salman Pacha avec 74 navires et 20 000 hommes prit Aden, Taïz et finalement Sanaa en 1547, fermant Bab el-Mandeb aux Portugais — mais le Yémen resta disputé avec les imams zaydites jusqu'en 1635 {cite:dawlat-uthmaniyya-salabi p. 191-192}."
  ur: "یمن میں عثمانیوں کا پہلا داخلہ: سلیمان کی 1538 کی مہم جو سلمان پاشا کی قیادت میں 74 بحری جہازوں اور 20,000 آدمیوں کے ساتھ عدن، طائز اور آخر کار صنعا کو 1547 تک لے گئی، باب المندب کو پرتگالیوں کے لیے بند کر دیا - پھر بھی یمن زیدیما کے ساتھ مقابلہ کرتا رہا۔ {حوالہ:دولت عثمانیہ سلبی ص۔ 191-192}۔"
  tr: "Memlüklerin yenilgisinden sonra, Yemen'in Memlük valisi İskender, Sultan Selim'e bağlılığını ve itaatini bildiren bir heyet sundu ve Sultan onu görevinde tuttu. Başlangıçta, komutanlar arasındaki iç çatışmalar, dağ kabileleri arasında Zeydi İmamlığının etkisi ve kıyı boyunca Portekiz tehdidi nedeniyle Osmanlı kontrolü zayıftı. Daha sonra, Hicri 945/Miladi 1538'de Sultan Süleyman, Aden'i fethetmek ve Bab el-Mandeb Boğazı'nı Portekiz gemilerine kapatmak amacıyla 74 gemi ve 20.000 askerden oluşan Salman Paşa el-Arnauti'nin seferini başlattı. Osmanlılar Hicri 946/Miladi 1539'da Aden'e, Hicri 952/Miladi 1545'te Taiz'e girdiler ve Sana'a Hicri 954/Miladi 1547'de düştü. Salman daha sonra filosuyla ilerleyerek Hadhramaut'taki Ash-Shihr ve Al-Mukalla gibi limanları ele geçirdi ve 964 Hicri/1557 Miladi yılında Suakin ve Massawa dahil olmak üzere Habeşistan kıyılarını işgal etti. Yemen, Osmanlılar ve Zeydi İmamları arasında çekişme konusu olmaya devam etti (1538-1635 Miladi yılları arasında). Osmanlılar ülke üzerinde gerçek bir kontrol sağlayamadılar. {cite:dawlat-uthmaniyya-salabi s. 191-192}"
  id: "Setelah kekalahan Mamluk, gubernur Mamluk Yaman, Iskandar, menyampaikan delegasi kepada Sultan Selim yang menyatakan kesetiaan dan ketaatannya, sehingga Sultan mempertahankan posisinya. Awalnya, kendali Ottoman lemah karena konflik internal di antara para komandan, pengaruh Imamah Zaidi di antara suku-suku pegunungan, dan ancaman Portugis di sepanjang pantai. Kemudian, pada tahun 945 H/1538 M, Sultan Suleiman mengirimkan pasukan Salman Pasha al-Arnaouti, yang terdiri dari 74 kapal dan 20.000 tentara, dengan tujuan menaklukkan Aden dan menutup Selat Bab el-Mandeb bagi kapal-kapal Portugis. Ottoman memasuki Aden pada tahun 946 H/1539 M, Taiz pada tahun 952 H/1545 M, dan Sana'a jatuh pada tahun 954 H/1547 M. Salman kemudian maju dengan armadanya, merebut pelabuhan-pelabuhan di Hadhramaut seperti Ash-Shihr dan Al-Mukalla, dan menginvasi pantai Abyssinia, termasuk Suakin dan Massawa, pada tahun 964 H/1557 M. Sepanjang periode penaklukannya (1538–1635 M), Yaman tetap menjadi wilayah yang diperebutkan antara Ottoman dan Imam Zaidi, dan Ottoman tidak berhasil menguasai negara tersebut secara nyata {cite:dawlat-uthmaniyya-salabi hlm. 191-192}."
