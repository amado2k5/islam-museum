id: event/muqasama-of-amr-ibn-al-as
class: event
kind: other
label:
  ar: مقاسمة عمر بن الخطاب عمرو بن العاص ماله
  en: Umar's halving of Amr ibn al-As's wealth
  ur: عمر بن الخطاب کا عمرو بن العاص کے مال کی تقسیم
  es: "La división a la mitad de la riqueza de Amr ibn al-As por parte de Umar"
  fr: "La réduction de moitié de la richesse d'Amr ibn al-As par Umar"
  tr: "Ömer ibn el-Hattab, servetini Amr ibn el-As ile paylaşıyor."
  id: "Umar bin al-Khattab membagi kekayaannya dengan Amr bin al-Aas."
summary:
  ar: بعث عمر بن الخطاب محمد بن مسلمة إلى عمرو بن العاص بمصر ليقاسمه ماله، ضمن مقاسمته عماله، وكان سببها فيما يروي ابن عبد الحكم شعراً بلغ عمر يحثه على محاسبة العمال {cite:futuh-misr-amir-1999 p. 198} {cite:futuh-misr-amir-1999 p. 199} {cite:futuh-misr-amir-1999 p. 200}.
  en: Umar ibn al-Khattab sent Muhammad ibn Maslama to Amr ibn al-As in Egypt to split his wealth with him, as part of his halving of his governors' wealth; Ibn Abd al-Hakam reports that it was prompted by a poem urging Umar to call his governors to account {cite:futuh-misr-amir-1999 p. 198} {cite:futuh-misr-amir-1999 p. 199} {cite:futuh-misr-amir-1999 p. 200}.
  ur: عمر بن الخطاب نے محمد بن مسلمہ کو مصر میں عمرو بن العاص کے پاس ان کا مال آدھا آدھا تقسیم کرنے بھیجا، جو عاملوں کے مال کی تقسیم کا حصہ تھا؛ ابن عبد الحکم کے مطابق اس کا سبب ایک نظم تھی جس میں عمر کو عاملوں کے محاسبے پر ابھارا گیا تھا {cite:futuh-misr-amir-1999 p. 198} {cite:futuh-misr-amir-1999 p. 199} {cite:futuh-misr-amir-1999 p. 200}۔
  es: "Umar ibn al-Khattab envió a Muhammad ibn Maslama a Amr ibn al-As en Egipto para dividir su riqueza con él, como parte de la división a la mitad de la riqueza de sus gobernadores; Ibn Abd al-Hakam informa que esto fue motivado por un poema que instaba a Umar a pedir cuentas a sus gobernadores {cite:futuh-misr-amir-1999 p. 198} {cite:futuh-misr-amir-1999 p. 199} {cite:futuh-misr-amir-1999 p. 200}."
  fr: "Umar ibn al-Khattab envoya Muhammad ibn Maslama auprès d'Amr ibn al-As en Égypte pour partager sa richesse avec lui, dans le cadre du partage de moitié de la richesse de ses gouverneurs; Ibn Abd al-Hakam rapporte que cela fut motivé par un poème exhortant Umar à demander des comptes à ses gouverneurs {cite:futuh-misr-amir-1999 p. 198} {cite:futuh-misr-amir-1999 p. 199} {cite:futuh-misr-amir-1999 p. 200}."
  tr: "Ömer ibn el-Hattab, servetini işçileriyle paylaşmasının bir parçası olarak, Muhammed ibn Maslamah'ı Mısır'daki Amr ibn el-As'a gönderdi. İbn Abd el-Hakam'ın rivayetine göre bunun sebebi, Ömer'e ulaşan ve işçileri sorumlu tutmasını öğütleyen bir şiirdi. {cite:futuh-misr-amir-1999 s. 198} {cite:futuh-misr-amir-1999 s. 199} {cite:futuh-misr-amir-1999 s. 200}"
  id: "Umar ibn al-Khattab mengutus Muhammad ibn Maslamah kepada Amr ibn al-As di Mesir untuk membagi kekayaannya dengannya, sebagai bagian dari pembagiannya dengan para pekerjanya. Alasannya, menurut riwayat Ibnu Abd al-Hakam, adalah sebuah puisi yang sampai kepada Umar yang mendesaknya untuk meminta pertanggungjawaban para pekerja. {cite:futuh-misr-amir-1999 p. 198} {cite:futuh-misr-amir-1999 p. 199} {cite:futuh-misr-amir-1999 p. 200}."
