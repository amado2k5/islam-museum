id: event/death-of-al-mutamid
class: event
kind: death
label: { ar: "وفاة المعتمد", en: "Death of al-Mu'tamid", es: "Muerte de al-Mu'tamid", fr: "Mort d'al-Mu'tamid", ur: "المتمید کی وفات" }
summary:
  ar: "في سنة تسع وسبعين ومائتين ذكر الطبري وفاة المعتمد على الله ليلة الاثنين لإحدى عشرة ليلة بقيت من رجب، بعد أن شرب كثيراً على الشط في الحسنى وتعشى، فيما ذُكر، وكانت خلافته ثلاثاً وعشرين سنة {cite:tabari-tarikh-abu-al-fadl j.10 p.29}، وعند السيوطي ضعف أمره جداً سنة تسع وسبعين لتمكن أبي العباس بن الموفق فجلس مجلساً عاماً أشهد فيه على نفسه أنه خلع ولده المفوض وبايع لأبي العباس ولقبه المعتضد ومات بعد أشهر فجأة فقيل إنه سم وقيل بل نام فغم في بساط وذلك ليلة الاثنين لإحدى عشرة بقيت من رجب وكانت خلافته ثلاثاً وعشرين سنة ومات وهو كالمحجور عليه، وممن مات في أيامه من الأعلام البخاري ومسلم وأبو داوود والترمذي وابن ماجه والمزني والزبير بن بكار وأبو زرعة الرازي وداود الظاهري وبقي بن مخلد وابن قتيبة وأبو حاتم الرازي {cite:tarikh-khulafa-minhaj-1434 p. 569-570}. وعند المسعودي قعد للغداء واصطبح يوم الاثنين لإحدى عشرة ليلة بقيت من رجب سنة تسع وسبعين فقدمت له رؤوس حملان فأكل معه على المائدة قف الملقم وخلف المضحك فتهرأ أحدهما في الليل ومات الآخر قبل الصباح وأصبح المعتمد ميتاً قد لحق بالقوم، وذكروا أن سبب وفاته أنه سقي نوعاً من السم في شرابه يقال له البيش يحمل من بلاد الهند وجبال الترك والتبت وهو ألوان ثلاثة وفيه خواص عجيبة، فشهد العدول أنه مات فجأة لا أثر به وغسل وحمل إلى سامرا فدفن بها {cite:muruj-al-dhahab p. 595-596}، ويوثق ابن الجوزي وفاته وبيعة المعتضد في حوادث سنة تسع وسبعين ومائتين {cite:muntazam-ibn-al-jawzi p. 122}"
  en: "In 279 Tabari records the death of al-Mu'tamid 'ala Allah on the night of Monday, eleven nights before the end of Rajab, after he had drunk heavily on the bank at al-Husna and dined, so it is reported; his caliphate lasted twenty-three years {cite:tabari-tarikh-abu-al-fadl j.10 p.29}. In al-Suyuti his authority had sharply declined by 279, as Abu'l-Abbas ibn al-Muwaffaq gained power. He held a public session and testified against himself that he had deposed his son al-Mufawwad and given allegiance to Abu'l-Abbas, who took the regnal title al-Mu'tadid. He died suddenly a few months later; it was said he was poisoned, and it was said he fell asleep and was smothered under a carpet, on that Monday night, eleven nights before the end of Rajab, after a caliphate of twenty-three years; he died as one under restraint. Among the scholars who died in his time were al-Bukhari, Muslim, Abu Dawud, al-Tirmidhi, Ibn Maja, al-Muzani, al-Zubayr ibn Bakkar, Abu Zur'a al-Razi, Dawud al-Zahiri, Baqi ibn Makhlad, Ibn Qutayba and Abu Hatim al-Razi {cite:tarikh-khulafa-minhaj-1434 p. 569-570}. In al-Mas'udi he sat for lunch and took his morning drink on that Monday, eleven nights before the end of Rajab in 279. Two lambs' heads were brought to him and he ate at the table with Waqf al-Mulaqqim and Khalaf al-Mudhhik; one of the two wasted away in the night and the other died before morning, and by morning al-Mu'tamid was dead, having gone to join them. The cause of his death was said to be a poison in his drink called al-bish, brought from India, the Turkish mountains and Tibet, which comes in three colours and has strange properties. Trustworthy witnesses attested that he died suddenly without any mark; he was washed, carried to Samarra and buried there {cite:muruj-al-dhahab p. 595-596}. Ibn al-Jawzi records his death and the oath to al-Mu'tadid under the events of 279 {cite:muntazam-ibn-al-jawzi p. 122}."
  es: "En 279 Tabari registra la muerte de al-Mu'tamid 'ala Allah la noche del lunes, once noches antes del final de Rajab, después de haber bebido mucho a orillas del río en al-Husna y haber cenado, según se informa; su califato duró veintitrés años {cite:tabari-tarikh-abu-al-fadl j.10 p.29}. En al-Suyuti su autoridad había disminuido drásticamente hacia 279, cuando Abu'l-Abbas ibn al-Muwaffaq tomó el poder. Celebró una sesión pública y testificó contra sí mismo que había depuesto a su hijo al-Mufawwad y jurado lealtad a Abu'l-Abbas, quien tomó el título real de al-Mu'tadid. Murió repentinamente unos meses después; Se decía que había sido envenenado, que se había quedado dormido y que lo habían asfixiado bajo una alfombra aquella noche de lunes, once noches antes del final de Rajab, tras un califato de veintitrés años; murió como si estuviera bajo coacción. Entre los eruditos que murieron en su época se encontraban al-Bujari, Muslim, Abu Dawud, al-Tirmidhi, Ibn Majah, al-Muzani, al-Zubayr ibn Bakkar, Abu Zur'a al-Razi, Dawud al-Zahiri, Baqi ibn Makhlad, Ibn Qutayba y Abu Hatim al-Razi {cite:tarikh-khulafa-minhaj-1434 p. 569-570}. En al-Mas'udi, almorzó y tomó su bebida matutina aquel lunes, once noches antes del final de Rajab en 279. Le trajeron dos cabezas de cordero y comió en la mesa con Waqf al-Mulaqqim y Khalaf al-Mudhhik; uno de ellos se consumió durante la noche y el otro murió antes del amanecer, y al amanecer al-Mu'tamid había muerto, habiéndose reunido con ellos. Se dice que la causa de su muerte fue un veneno en su bebida llamado al-bish, traído de la India, las montañas turcas y el Tíbet, que se presenta en tres colores y tiene propiedades extrañas. Testigos fidedignos atestiguaron que murió repentinamente sin dejar rastro; fue lavado, llevado a Samarra y enterrado allí {cite:muruj-al-dhahab p. 595-596}. Ibn al-Jawzi registra su muerte y el juramento a al-Mu'tadid bajo los eventos de 279 {cite:muntazam-ibn-al-jawzi p. 122}."
  fr: "En 279, Tabari rapporte la mort d'al-Mu'tamid 'ala Allah dans la nuit du lundi, onze nuits avant la fin du mois de Rajab, après qu'il eut beaucoup bu sur les rives d'al-Husna et dîné, selon les dires. Son califat dura vingt-trois ans (cite: Tabari-Tarikh-Abu-al-Fadl j.10 p.29). Dans al-Suyuti, son autorité avait fortement décliné en 279, tandis qu'Abu'l-Abbas ibn al-Muwaffaq gagnait en puissance. Il tint une session publique et témoigna contre lui-même qu'il avait déposé son fils al-Mufawwad et prêté allégeance à Abu'l-Abbas, qui prit le titre de règne d'al-Mu'tadid. Il mourut subitement quelques mois plus tard. On disait qu'il avait été empoisonné, qu'il s'était endormi et qu'on l'avait étouffé sous un tapis, ce lundi soir, onze nuits avant la fin du mois de Rajab, après un califat de vingt-trois ans; il mourut sous la contrainte. Parmi les savants décédés à son époque figuraient al-Bukhari, Muslim, Abu Dawud, al-Tirmidhi, Ibn Maja, al-Muzani, al-Zubayr ibn Bakkar, Abu Zur'a al-Razi, Dawud al-Zahiri, Baqi ibn Makhlad, Ibn Qutayba et Abu Hatim al-Razi (voir: Tarikh-Khulafa-Minhaj-1434, p. 569-570). À al-Mas'udi, ce lundi, onze nuits avant la fin du mois de Rajab en 279, il déjeuna et prit sa boisson matinale. On lui apporta deux têtes d'agneau et il mangea à table avec Waqf al-Mulaqqim et Khalaf al-Mudhhik. L'un des deux mourut dans la nuit et l'autre avant l'aube. Au matin, al-Mu'tadid était mort, les ayant rejoints. La cause de sa mort aurait été un poison contenu dans sa boisson, appelé al-bish, rapporté d'Inde, des montagnes turques et du Tibet, qui se présente sous trois couleurs et possède d'étranges propriétés. Des témoins dignes de foi attestèrent qu'il mourut subitement, sans aucune trace de maladie. On le lava, on le transporta à Samarra et on l'y enterra (Muruj al-Dhahab, p. 595-596). Ibn al-Jawzi relate sa mort et le serment prêté à al-Mu'tadid lors des événements de l'année 279 (Muntazam ibn al-Jawzi, p. 595-596). 122}."
  ur: "279 میں طبری نے المتمدع اللہ کی وفات سوموار کی رات، رجب کے اختتام سے گیارہ راتیں پہلے درج کی ہے، جب انہوں نے حسنہ کے کنارے پر بہت زیادہ شراب پی اور کھانا کھایا، چنانچہ روایت ہے؛ ان کی خلافت تئیس سال جاری رہی {حوالہ: طبری-تاریخ-ابو الفضل ج 10 ص 29}۔ السیوطی میں اس کے اختیار میں 279 کی تیزی سے کمی واقع ہوئی تھی، جب ابو العباس ابن الموفق نے اقتدار حاصل کیا تھا۔ اس نے ایک عوامی اجلاس منعقد کیا اور اپنے خلاف گواہی دی کہ اس نے اپنے بیٹے المفواد کو معزول کر دیا ہے اور ابو العباس کی بیعت کی ہے، جس نے رجائی لقب المتعد لیا تھا۔ چند مہینوں بعد اچانک اس کی موت ہو گئی۔ کہا جاتا ہے کہ اسے زہر دیا گیا تھا، اور کہا جاتا ہے کہ وہ سو گئے تھے اور ایک قالین کے نیچے دبا دیا گیا تھا، اس سوموار کی رات، رجب کی گیارہ راتیں پہلے، تئیس سال کی خلافت کے بعد؛ وہ ضبط کے تحت مر گیا. ان کے زمانے میں فوت ہونے والے علماء میں البخاری، مسلم، ابوداؤد، الترمذی، ابن ماجہ، المزانی، الزبیر بن بکر، ابو زرعہ الرازی، داؤد الظاہری، بقی ابن مخلد، ابن قتیبہ اور ابوحاذی شامل ہیں۔ {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 569-570}۔ المسعودی میں وہ دوپہر کے کھانے کے لیے بیٹھا اور 279 میں رجب کے اختتام سے گیارہ رات پہلے اس سوموار کو صبح کا مشروب پیا۔ اس کے پاس دو میمنوں کے سر لائے گئے اور اس نے وقف المقام اور خلف المدخ کے ساتھ دسترخوان پر کھانا کھایا۔ ان دونوں میں سے ایک رات کو ضائع ہو گیا اور دوسرا صبح سے پہلے ہی مر گیا اور صبح تک معتمد ان کے ساتھ جا کر مر گیا۔ ان کی موت کی وجہ ہندوستان، ترکی کے پہاڑوں اور تبت سے لائے جانے والے البیش نامی مشروب میں ایک زہر بتایا گیا جو تین رنگوں میں آتا ہے اور عجیب و غریب خصوصیات رکھتا ہے۔ ثقہ گواہوں نے تصدیق کی کہ وہ بغیر کسی نشان کے اچانک مر گیا۔ اسے غسل دیا گیا، سامرہ لے جایا گیا اور وہاں دفن کیا گیا۔ 595-596}۔ ابن الجوزی نے 279 کے واقعات کے تحت ان کی موت اور المعتدد کی بیعت درج کی ہے۔ 122}۔"
