label: { ar: "وفاة المعتمد", en: "Death of al-Mu'tamid" }
summary:
  ar: "في سنة تسع وسبعين ومائتين ذكر الطبري وفاة المعتمد على الله ليلة الاثنين لإحدى عشرة ليلة بقيت من رجب، بعد أن شرب كثيراً على الشط في الحسنى وتعشى، فيما ذُكر، وكانت خلافته ثلاثاً وعشرين سنة {cite:tabari-tarikh-abu-al-fadl j.10 p.29}، وعند السيوطي ضعف أمره جداً سنة تسع وسبعين لتمكن أبي العباس بن الموفق فجلس مجلساً عاماً أشهد فيه على نفسه أنه خلع ولده المفوض وبايع لأبي العباس ولقبه المعتضد ومات بعد أشهر فجأة فقيل إنه سم وقيل بل نام فغم في بساط وذلك ليلة الاثنين لإحدى عشرة بقيت من رجب وكانت خلافته ثلاثاً وعشرين سنة ومات وهو كالمحجور عليه، وممن مات في أيامه من الأعلام البخاري ومسلم وأبو داوود والترمذي وابن ماجه والمزني والزبير بن بكار وأبو زرعة الرازي وداود الظاهري وبقي بن مخلد وابن قتيبة وأبو حاتم الرازي {cite:tarikh-khulafa-minhaj-1434 p. 569-570}. وعند المسعودي قعد للغداء واصطبح يوم الاثنين لإحدى عشرة ليلة بقيت من رجب سنة تسع وسبعين فقدمت له رؤوس حملان فأكل معه على المائدة قف الملقم وخلف المضحك فتهرأ أحدهما في الليل ومات الآخر قبل الصباح وأصبح المعتمد ميتاً قد لحق بالقوم، وذكروا أن سبب وفاته أنه سقي نوعاً من السم في شرابه يقال له البيش يحمل من بلاد الهند وجبال الترك والتبت وهو ألوان ثلاثة وفيه خواص عجيبة، فشهد العدول أنه مات فجأة لا أثر به وغسل وحمل إلى سامرا فدفن بها {cite:muruj-al-dhahab p. 595-596}، ويوثق ابن الجوزي وفاته وبيعة المعتضد في حوادث سنة تسع وسبعين ومائتين {cite:muntazam-ibn-al-jawzi p. 122}"
  en: "In 279 Tabari records the death of al-Mu'tamid 'ala Allah on the night of Monday, eleven nights before the end of Rajab, after he had drunk heavily on the bank at al-Husna and dined, so it is reported; his caliphate lasted twenty-three years {cite:tabari-tarikh-abu-al-fadl j.10 p.29}. In al-Suyuti his authority had sharply declined by 279, as Abu'l-Abbas ibn al-Muwaffaq gained power. He held a public session and testified against himself that he had deposed his son al-Mufawwad and given allegiance to Abu'l-Abbas, who took the regnal title al-Mu'tadid. He died suddenly a few months later; it was said he was poisoned, and it was said he fell asleep and was smothered under a carpet, on that Monday night, eleven nights before the end of Rajab, after a caliphate of twenty-three years; he died as one under restraint. Among the scholars who died in his time were al-Bukhari, Muslim, Abu Dawud, al-Tirmidhi, Ibn Maja, al-Muzani, al-Zubayr ibn Bakkar, Abu Zur'a al-Razi, Dawud al-Zahiri, Baqi ibn Makhlad, Ibn Qutayba and Abu Hatim al-Razi {cite:tarikh-khulafa-minhaj-1434 p. 569-570}. In al-Mas'udi he sat for lunch and took his morning drink on that Monday, eleven nights before the end of Rajab in 279. Two lambs' heads were brought to him and he ate at the table with Waqf al-Mulaqqim and Khalaf al-Mudhhik; one of the two wasted away in the night and the other died before morning, and by morning al-Mu'tamid was dead, having gone to join them. The cause of his death was said to be a poison in his drink called al-bish, brought from India, the Turkish mountains and Tibet, which comes in three colours and has strange properties. Trustworthy witnesses attested that he died suddenly without any mark; he was washed, carried to Samarra and buried there {cite:muruj-al-dhahab p. 595-596}. Ibn al-Jawzi records his death and the oath to al-Mu'tadid under the events of 279 {cite:muntazam-ibn-al-jawzi p. 122}."
