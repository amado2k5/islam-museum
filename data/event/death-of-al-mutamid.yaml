label: { ar: "وفاة المعتمد" }
summary:
  ar: "في سنة تسع وسبعين ومائتين ذكر الطبري وفاة المعتمد على الله ليلة الاثنين لإحدى عشرة ليلة بقيت من رجب، بعد أن شرب كثيراً على الشط في الحسنى وتعشى، فيما ذُكر، وكانت خلافته ثلاثاً وعشرين سنة {cite:tabari-tarikh-abu-al-fadl j.10 p.29}، وعند السيوطي ضعف أمره جداً سنة تسع وسبعين لتمكن أبي العباس بن الموفق فجلس مجلساً عاماً أشهد فيه على نفسه أنه خلع ولده المفوض وبايع لأبي العباس ولقبه المعتضد ومات بعد أشهر فجأة فقيل إنه سم وقيل بل نام فغم في بساط وذلك ليلة الاثنين لإحدى عشرة بقيت من رجب وكانت خلافته ثلاثاً وعشرين سنة ومات وهو كالمحجور عليه، وممن مات في أيامه من الأعلام البخاري ومسلم وأبو داوود والترمذي وابن ماجه والمزني والزبير بن بكار وأبو زرعة الرازي وداود الظاهري وبقي بن مخلد وابن قتيبة وأبو حاتم الرازي {cite:tarikh-khulafa-minhaj-1434 p. 569-570}.، وعند المسعودي قعد للغداء واصطبح يوم الاثنين لإحدى عشرة ليلة بقيت من رجب سنة تسع وسبعين فقدمت له رؤوس حملان فأكل معه على المائدة قف الملقم وخلف المضحك فتهرأ أحدهما في الليل ومات الآخر قبل الصباح وأصبح المعتمد ميتاً قد لحق بالقوم، وذكروا أن سبب وفاته أنه سقي نوعاً من السم في شرابه يقال له البيش يحمل من بلاد الهند وجبال الترك والتبت وهو ألوان ثلاثة وفيه خواص عجيبة، فشهد العدول أنه مات فجأة لا أثر به وغسل وحمل إلى سامرا فدفن بها {cite:muruj-al-dhahab p. 595-596}"
