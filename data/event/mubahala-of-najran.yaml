label: { ar: "مباهلة نجران", en: "The Mubahala of Najran", es: "El Mubahala de Najrán", fr: "Le Mubahala de Najran", ur: "نجران کا مباہلہ", tr: "Najran Mubahala", id: "Najran Mubahala" }
summary:
  ar: "لمّا قدم وفد نصارى نجران المدينة سنة 10هـ ونزلوا بالمسجد، اشتدّ الجدال بينهم وبين رسول الله في أمر عيسى ابن مريم، فأنزل الله مطلع سورة آل عمران يردّ عليهم بأن مثل عيسى كمثل آدم خلقه من تراب ثم قال له كن فيكون {cite:ibn-hisham-sira 1/573-575}. ولما ثبتوا على قولهم دعاهم النبي إلى المباهلة بموجب الآية فقال تعالى بعد بيان الحجة: «فمن حاجّك فيه من بعد ما جاءك من العلم فقل تعالوا ندع أبناءنا وأبناءكم ونساءنا ونساءكم وأنفسنا وأنفسكم ثم نبتهل فنجعل لعنة الله على الكاذبين» {cite:sahih-muslim 2404}. فتحاور أساقفة الوفد فيما بينهم وخافوا أن يباهلوا فيهلكوا، فطلبوا الموادعة وصالحوا على الجزية وأن تحفظ لهم كنائسهم وحقوقهم، فكان الموقف نفسه حجة استقام فيها الدليل بالدليل {cite:ibn-hisham-sira 1/577}."
  en: "When the delegation of the Christians of Najran came to Medina in 10 AH and lodged in the mosque, the disputation between them and the Messenger of God grew sharp over the person of Jesus son of Mary, and God sent down the opening of Surat Al Imran answering them: the likeness of Jesus is as the likeness of Adam, He created him from dust then said 'Be' and he was {cite:ibn-hisham-sira 1/573-575}. When they held to their view, the Prophet invited them to mutual imprecation under the verse that follows the proof: 'Whoever disputes with you about him after the knowledge that has come to you, say: Come, let us call our sons and your sons, our women and your women, ourselves and yourselves, then let us pray ardently and lay the curse of God on the liars' {cite:sahih-muslim 2404}. The bishops of the delegation consulted among themselves, feared that imprecating him would destroy them, and asked for a truce; they made peace on the jizya with their churches and rights preserved, and the standoff itself stood as the argument — proof answered by proof {cite:ibn-hisham-sira 1/577}."
  es: "Cuando la delegación de los cristianos de Najrán llegó a Medina en el año 10 de la Hégira y se hospedó en la mezquita, la disputa entre ellos y el Mensajero de Dios se agudizó acerca de la persona de Jesús, hijo de María, y Dios envió el comienzo de la Sura Al Imran respondiéndoles: la semejanza de Jesús es como la de Adán, Él lo creó del polvo y luego dijo 'Sé' y fue {cite:ibn-hisham-sira 1/573-575}. Cuando se mantuvieron firmes en su punto de vista, el Profeta los invitó a una imprecación mutua bajo el versículo que sigue a la prueba: 'Quien dispute contigo acerca de él después del conocimiento que te ha llegado, di: Venid, llamemos a nuestros hijos y a vuestros hijos, a nuestras mujeres y a vuestras mujeres, a nosotros mismos y a vosotros mismos, luego oremos fervientemente e impongamos la maldición de Dios sobre los mentirosos' {cite:sahih-muslim 2404}. Los obispos de la delegación consultaron entre sí, temieron que imprecarlo los destruiría y pidieron una tregua; hicieron las paces con la jizya, conservando sus iglesias y derechos, y el enfrentamiento mismo sirvió como argumento: prueba respondida con prueba {cite:ibn-hisham-sira 1/577}."
  fr: "Lorsque la délégation chrétienne de Najran arriva à Médine en l'an 10 de l'Hégire et s'installa à la mosquée, la controverse entre eux et le Messager de Dieu s'intensifia au sujet de la personne de Jésus, fils de Marie. Dieu révéla alors le début de la sourate Al Imran, répondant à leur question: « La ressemblance de Jésus est semblable à celle d'Adam. Il le créa de poussière, puis dit: « Sois ! » et il fut. » (Ibn Hisham Sira 1/573-575). Face à leur obstination, le Prophète les invita à s'injurier mutuellement en citant le verset suivant la preuve: « Quiconque conteste avec toi à son sujet après que la science t'est parvenue, dis: Venez ! Appelons nos fils et vos fils, nos femmes et vos femmes, nous-mêmes et vous-mêmes, puis prions avec ferveur et maudissons les menteurs. » (Sahih Muslim 2404). Les évêques de la délégation se consultèrent entre eux, craignant que l'imprécation ne les détruise, et demandèrent une trêve; ils firent la paix sur la jizya avec leurs églises et leurs droits préservés, et l'impasse elle-même servit d'argument — preuve répondue par preuve {cite:ibn-hisham-sira 1/577}."
  ur: "10 ہجری میں جب نجران کے عیسائیوں کا وفد مدینہ آیا اور مسجد میں ٹھہرا تو ان کا اور رسول اللہ کے درمیان عیسیٰ ابن مریم کی ذات پر جھگڑا بڑھ گیا اور اللہ تعالیٰ نے ان کے جواب میں سورۃ آل عمران کی ابتداء نازل فرمائی کہ عیسیٰ کی مثال آدم کی سی ہے، آپ نے انہیں مٹی سے پیدا کیا اور پھر فرمایا: بِسْتِیْحِمْ۔ 1/573-575}۔ جب وہ اپنے موقف پر قائم رہے تو نبی نے ان کو اس آیت کے تحت آپس میں بدگمانی کی طرف بلایا جو دلیل کے بعد ہے: ’’جو کوئی تمہارے پاس علم کے آنے کے بعد اس کے بارے میں تم سے جھگڑے تو کہو: آؤ ہم اپنے بیٹوں اور تمہارے بیٹوں کو، اپنی عورتوں کو اور تمہاری عورتوں کو، اپنے آپ کو اور اپنے آپ کو بلائیں، پھر ہم جوش سے دعا کریں اور خدا کی لعنت بھیجیں‘‘۔ وفد کے بشپوں نے آپس میں مشورہ کیا، ڈرتے تھے کہ اس کی تقلید انہیں تباہ کر دے گی، اور جنگ بندی کی درخواست کی۔ انہوں نے اپنے گرجا گھروں اور حقوق کے تحفظ کے ساتھ جزیہ پر صلح کی، اور یہ تعطل خود دلیل کے طور پر کھڑا ہوا - ثبوت کے ذریعے جواب دیا گیا {حوالہ: ابن ہشام سیرہ 1/577}۔"
  tr: "Hicri 10 yılında Necran'dan gelen Hristiyan heyeti Medine'ye gelip mescitte konakladığında, aralarında ve Allah Resulü arasında Meryem oğlu İsa hakkında şiddetli bir tartışma çıktı. Bunun üzerine Allah, İsa'nın, Allah'ın topraktan yarattığı ve \"Ol!\" dediği Âdem gibi olduğunu belirterek, iddialarını çürüten Al İmran Suresi'nin başlangıcını indirdi. {İbn-i Hişam-Sira 1/573-575}. Onlar ısrarcı olunca, Peygamberimiz ayete uygun olarak onları karşılıklı bir lanete davet etti. Yüce Allah, delili sunduktan sonra şöyle buyurdu: \"Bu bilgi size ulaştıktan sonra kim sizinle onun hakkında tartışırsa, deyin ki: 'Gelin, oğullarımızı ve sizin oğullarınızı, kadınlarımızı ve sizin kadınlarınızı, kendimizi ve sizi çağıralım, sonra da yalancılara Allah'ın lanetini okuyalım.'\" {Sahih-Müslim 2404}. Heyetteki piskoposlar kendi aralarında konuşup, karşılıklı lanetleşmeye kalkışırlarsa helak olacaklarından korktular. Bu yüzden ateşkes istediler ve cizye ödemeleri ve kiliselerinin ve haklarının korunması şartıyla barıştılar. Aynı durum, delillerle desteklenen bir tartışma konusuydu {alıntı: İbn-i Hişam-Sira 1/577}."
  id: "Ketika delegasi orang-orang Kristen dari Najran datang ke Madinah pada tahun 10 Hijriah dan tinggal di masjid, terjadi perdebatan sengit antara mereka dan Rasulullah mengenai Isa, putra Maryam. Allah kemudian menurunkan permulaan Surah Al Imran, membantah klaim mereka dengan menyatakan bahwa Isa seperti Adam, yang diciptakan-Nya dari debu dan kemudian Dia berkata kepadanya, \"Jadilah,\" dan dia pun jadi. {kutipan: ibn-hisham-sira 1/573-575}. Ketika mereka tetap bersikeras pada pendirian mereka, Nabi mengajak mereka untuk saling mengutuk (mubahala) sesuai dengan ayat tersebut. Allah SWT berfirman, setelah memberikan bukti: \"Maka barangsiapa yang berdebat denganmu tentang dia setelah pengetahuan ini datang kepadamu, katakanlah, 'Mari kita panggil anak-anak kita dan anak-anakmu, wanita-wanita kita dan wanita-wanitamu, diri kita dan dirimu, kemudian mari kita memohon laknat Allah atas orang-orang yang berbohong.'\" {kutipan: sahih-muslim 2404}. Para uskup delegasi berbincang-bincang di antara mereka sendiri dan khawatir bahwa jika mereka saling mengutuk, mereka akan binasa. Maka mereka meminta gencatan senjata dan berdamai dengan syarat membayar jizya dan gereja serta hak-hak mereka akan dilindungi. Posisi yang sama merupakan argumen yang buktinya ditegakkan oleh bukti {cite:ibn-hisham-sira 1/577}."
