id: event/burning-of-ghazali-books-maghrib
class: event
kind: persecution
label: { ar: "إحراق كتب الغزالي في المغرب", en: "The burning of al-Ghazali's books in the Maghrib", ur: "مغرب میں غزالی کی کتابوں کا جلایا جانا" }
summary:
  ar: "خبر ينقله العيدروس في «تعريف الأحياء» أن السلطان علي بن يوسف أمر بإحراق مصنفات الغزالي لما وصلت إلى المغرب، لتوهّمه اشتمالها على الفلسفة، وتوعّد بالقتل من وُجدت عنده؛ ويذكر أن ابن السمعاني نقل رؤيا عُبّرت بهذه البدعة، وأن حال السلطان انقلبت بعد ذلك {cite:ihya-kitab-al-shab-pts13-16 p. 788}. وينقل حاجي خليفة أن بعض المغاربة أنكروا الإحياء أول وصوله إليهم {cite:kashf-zunun-furqan p. 221-223}."
  en: "An account given by al-Aydarus in Ta'rif al-Ahya': when al-Ghazali's works reached the Maghrib, its sultan Ali ibn Yusuf ordered them burned, thinking they contained philosophy, and threatened with death anyone found holding them; al-Aydarus adds that Ibn al-Sam'ani reported a dream interpreted as foretelling this innovation, and that the sultan's fortunes turned afterwards {cite:ihya-kitab-al-shab-pts13-16 p. 788}. Hajji Khalifa reports that some Maghribis rejected the Ihya' when it first reached them {cite:kashf-zunun-furqan p. 221-223}."
  ur: "عیدروس «تعریف الاحیاء» میں نقل کرتے ہیں کہ جب غزالی کی تصانیف مغرب پہنچیں تو وہاں کے سلطان علی بن یوسف نے انہیں جلانے کا حکم دیا، یہ سمجھ کر کہ ان میں فلسفہ ہے، اور جس کے پاس ملیں اسے قتل کی دھمکی دی؛ وہ مزید کہتے ہیں کہ ابن السمعانی نے ایک خواب نقل کیا جس کی تعبیر اس بدعت سے کی گئی، اور اس کے بعد سلطان کا حال بدل گیا {cite:ihya-kitab-al-shab-pts13-16 p. 788}۔ حاجی خلیفہ نقل کرتے ہیں کہ بعض اہلِ مغرب نے احیاء کے پہلی بار پہنچنے پر اس کا انکار کیا {cite:kashf-zunun-furqan p. 221-223}۔"
