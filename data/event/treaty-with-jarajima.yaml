label: { ar: "صلح الجراجمة", en: "The Treaty with the Jarajima", es: "El Tratado con los Jarajima", fr: "Le traité avec les Jarajima", ur: "جراجیما کے ساتھ معاہدہ" }
summary:
  ar: "عند البلاذري عن مشايخ من أهل أنطاكية: الجراجمة من مدينة على جبل اللكام عند معدن الزاج فيما بين بياس وبوقا يقال لها الجرجومة وكان أمرهم في أيام استيلاء الروم على الشام إلى بطريق أنطاكية وواليها، فلما فتحها أبو عبيدة لزموا مدينتهم وهموا باللحاق بالروم خوفاً على أنفسهم فلم ينبه عليهم، ثم لما نقض أهل أنطاكية وجّه حبيب بن مسلمة ففتحها فأتى الجرجومة فبادروا بطلب الأمان فصالحهم على أن يكونوا أعواناً للمسلمين وعيوناً ومسالح في جبل اللكام وأن لا يؤخذوا بالجزية وأن يُنفّلوا أسلاب من يقتلون من عدو المسلمين إذا حضروا معهم حرباً، ودخل في هذا الصلح من كان في مدينتهم من تاجر وأجير وتابع من الأنباط وغيرهم وأهل القرى فسُمّوا الرواديف لأنهم تلوهم وليسوا منهم؛ فكانوا يستقيمون للولاة مرة ويعوجون أخرى يكاتبون الروم ويمالئونهم، حتى إذا كانت أيام ابن الزبير خرجت خيل للروم إلى جبل اللكام ثم صارت إلى لبنان وقد ضوت إليها جماعة كثيرة من الجراجمة وأنباط وعبيد آباق من عبيد المسلمين فاضطر عبد الملك أن صالحهم على ألف دينار في كل جمعة وصالح طاغية الروم على مال يؤديه إليه اقتداءً بمعاوية حين شغل بحرب أهل العراق؛ ثم وجه عبد الملك إلى الرومي سُحيم بن المهاجر فتلطف حتى دخل عليه متنكراً يظهر الممالأة حتى أمِنه فانكفأ عليه فقتله ومن معه ونادى بالأمان فتفرق الجراجمة بقرى حمص ودمشق ورجع أكثرهم إلى مدينتهم ورجع العبيد إلى مواليهم."
  en: "In al-Baladhuri from shaykhs of Antioch: the Jarajima are of a city on Jabal al-Lukkam by the vitriol mine between Bayyas and Buqa called al-Jurjuma; in the days of Byzantine rule over Syria they answered to the patrician and governor of Antioch, and when Abu Ubayda took it they stayed in their city, meaning to join the Byzantines for fear of their lives but unreported; when Antioch's people broke faith he sent Habib ibn Maslama who retook it, then came to al-Jurjuma whose people hastened to ask for aman, compounding to be auxiliaries, scouts and watchmen for the Muslims in Jabal al-Lukkam, exempted from jizya and granted the spoils of those they killed when attending the Muslims' wars — the treaty taking in the traders, hirelings, Nabataean clients and villagers among them who were called the Rawadif for following after them; they would keep faith with the governors one while and veer another, corresponding with and favouring the Byzantines, until in Ibn al-Zubayr's days a Byzantine cavalry came to Jabal al-Lukkam then moved to Lebanon, drawing to it a great company of Jarajima, Nabataeans and runaway slaves of the Muslims, forcing Abd al-Malik to compound with them for a thousand dinars every Friday and with the Byzantine tyrant for a payment to keep him occupied — after Mu'awiya's example when preoccupied with Iraq; then Abd al-Malik sent Suhaym ibn al-Muhajir to the Byzantine leader, who wormed his way in by feigned favour until trusted, then fell on him and his company and killed them, proclaiming aman so the Jarajima scattered through the villages of Hims and Damascus, most returning to their city and the slaves to their masters."
  es: "En al-Baladhuri de los shaykhs de Antioquía: los Jarajima son de una ciudad en Jabal al-Lukkam junto a la mina de vitriolo entre Bayyas y Buqa llamada al-Jurjuma; en los días del dominio bizantino sobre Siria respondían al patricio y gobernador de Antioquía, y cuando Abu Ubayda la tomó se quedaron en su ciudad, con la intención de unirse a los bizantinos por temor a sus vidas pero no se informó; cuando el pueblo de Antioquía rompió la fe, envió a Habib ibn Maslama que la reconquistó, luego llegó a al-Jurjuma cuyo pueblo se apresuró a pedir aman, comprometiéndose a ser auxiliares, exploradores y centinelas para los musulmanes en Jabal al-Lukkam, exentos de jizya y concedidos los botines de aquellos que mataban cuando asistían a las guerras de los musulmanes; el tratado incluía entre ellos a comerciantes, mercenarios, clientes nabateos y aldeanos que eran llamados Rawadif por seguirlos; En ocasiones mantenían la lealtad a los gobernadores y en otras la traicionaban, manteniendo correspondencia y favoreciendo a los bizantinos, hasta que en tiempos de Ibn al-Zubayr una caballería bizantina llegó a Jabal al-Lukkam y luego se dirigió al Líbano, atrayendo a una gran compañía de Jarajima, nabateos y esclavos fugitivos de los musulmanes, lo que obligó a Abd al-Malik a llegar a un acuerdo con ellos por mil dinares cada viernes y con el tirano bizantino por un pago para mantenerlo ocupado, siguiendo el ejemplo de Mu'awiya cuando estaba ocupado con Irak; entonces Abd al-Malik envió a Suhaym ibn al-Muhajir al líder bizantino, quien se abrió paso fingiendo favores hasta ganarse su confianza, luego lo atacó a él y a su compañía y los mató, proclamando la victoria, por lo que los Jarajima se dispersaron por las aldeas de Hims y Damasco, la mayoría regresando a su ciudad y los esclavos a sus amos."
  fr: "Dans al-Baladhuri, d'après les cheikhs d'Antioche: les Jarajima sont originaires d'une ville du Jabal al-Lukkam, près de la mine de vitriol entre Bayyas et Buqa, appelée al-Jurjuma; à l'époque de la domination byzantine sur la Syrie, ils répondaient au patricien et gouverneur d'Antioche, et lorsque Abu Ubayda s'en empara, ils restèrent dans leur ville, ayant l'intention de rejoindre les Byzantins par crainte pour leur vie, mais cela ne fut pas rapporté; lorsque les habitants d'Antioche manquèrent à leur parole, il envoya Habib ibn Maslama qui la reprit, puis vint à al-Jurjuma dont les habitants s'empressèrent de demander l'aman, s'engageant à devenir auxiliaires, éclaireurs et gardes pour les musulmans du Jabal al-Lukkam, exemptés de jizya et recevant le butin de ceux qu'ils tuaient en participant aux guerres musulmanes — le traité englobant parmi eux les marchands, les mercenaires, les clients nabatéens et les villageois qui furent appelés les Rawadif pour les avoir suivis; Ils restaient fidèles aux gouverneurs tantôt, tantôt changeaient d'avis, correspondant avec les Byzantins et les favorisant, jusqu'à ce que, du temps d'Ibn al-Zubayr, une cavalerie byzantine arrive à Jabal al-Lukkam puis se dirige vers le Liban, attirant à elle une importante troupe de Jarajima, de Nabatéens et d'esclaves musulmans fugitifs. Abd al-Malik fut alors contraint de conclure un pacte avec eux pour mille dinars chaque vendredi et avec le tyran byzantin pour un paiement afin de l'occuper, suivant l'exemple de Mu'awiya lorsqu'il était préoccupé par l'Irak. Abd al-Malik envoya ensuite Suhaym ibn al-Muhajir auprès du chef byzantin, qui s'insinua en feignant sa faveur jusqu'à gagner sa confiance, puis s'attaqua à lui et à sa troupe et les massacra, proclamant l'aman. Les Jarajima se dispersèrent alors dans les villages de Hims et de Damas, la plupart retournant dans leur ville et les esclaves chez leurs maîtres."
  ur: "البلادوری میں انطاکیہ کے شیوخ سے: جراجیما جبل لکم پر ایک شہر سے ہیں جو بیاس اور بوکا کے درمیان وٹریول کان کے ذریعہ ہے جسے الجرجمہ کہتے ہیں۔ شام پر بازنطینی حکومت کے دنوں میں انہوں نے انطاکیہ کے سرپرست اور گورنر کو جواب دیا، اور جب ابو عبیدہ نے اسے لے لیا تو وہ اپنے شہر میں ہی ٹھہرے رہے، یعنی اپنی جان کے خوف سے بازنطینیوں میں شامل ہو گئے لیکن اس کی اطلاع نہیں دی گئی۔ جب انطاکیہ کے لوگوں نے عقیدہ توڑا تو اس نے حبیب بن مسلمہ کو بھیجا جس نے اسے واپس لے لیا، پھر الجرجمہ کے پاس آئے جن کے لوگوں نے جبل لکم میں مسلمانوں کے لیے معاون، اسکاؤٹ اور چوکیدار بننے کے لیے جلدی کی، جزیہ سے مستثنیٰ قرار دیا اور ان لوگوں کا مال غنیمت دیا جو وہ تجارت میں شریک ہوتے ہوئے مسلمانوں کے ساتھ تجارت میں شریک تھے۔ کرایہ دار، نباطین کے گاہک اور ان میں سے دیہاتی جنہیں ان کی پیروی کرنے پر روادیف کہا جاتا تھا۔ وہ ایک وقت میں گورنروں کے ساتھ ایمان رکھتے اور بازنطینیوں کے ساتھ میل جول رکھتے اور ان کی حمایت کرتے، یہاں تک کہ ابن الزبیر کے زمانے میں بازنطینی گھڑ سوار دستہ جبل لکم میں آیا اور پھر لبنان چلا گیا، اس کی طرف جرجیما، نباطین اور مسلمانوں کے بھگوڑوں کے ساتھ الحاق کرنے کے لیے ایک بڑی جماعت لے کر لبنان چلا گیا۔ ہر جمعہ کو ایک ہزار دینار کے عوض اور بازنطینی ظالم کے ساتھ اس کے قبضے میں رکھنے کے لیے ادائیگی کے لیے - معاویہ کی مثال کے بعد جب عراق میں مصروف تھے۔ پھر عبد الملک نے سہیم بن المہاجر کو بازنطینی رہنما کے پاس بھیجا، جس نے اس پر بھروسہ کرنے تک اس کی حمایت کا دعویٰ کیا، پھر اس پر اور اس کے ساتھی پر برس پڑے اور انہیں قتل کر دیا، امن کا اعلان کرتے ہوئے جراجیما حمص اور دمشق کے دیہاتوں میں بکھر گئے، زیادہ تر اپنے شہر اور غلام اپنے غلاموں کو واپس لوٹ گئے۔"
