id: event/abu-al-qasim-ibn-al-hadi-verses-on-the-lance-and-the-lions-of-war-290
class: event
kind: other
label:
  ar: "أبيات أبي القاسم في الرمح وأسود الحرب، ص264-265، 290هـ"
  en: "Abu al-Qasim's verses on the lance and the lions of war, pp. 264-265, 290 AH"
  ur: "نیزے اور جنگ کے شیروں پر ابو القاسم کے اشعار، ص264-265، 290ھ"
summary:
  ar: "مقطوعات يقول فيها أبو القاسم إن همه السيوف والرماح لا الغناء والشراب، وإنهم أسود الحرب لا يهابون عدواً، وأن أباهم رسول الله، ويدعو ويتوعد من حاد عن حقهم، وتتصل بمقطوعة تنبه حاشية ص266 إلى أنها ذُكرت من قبل وأبو القاسم بخيوان."
  en: "Pieces in which Abu al-Qasim says that his concern is swords and lances and not song or drink, that they are lions of war who do not fear an enemy and that their father is the Messenger of God; a piece starting at the foot of p. 265 has a note on p. 266 that it was mentioned earlier when Abu al-Qasim was at Khiwan."
  ur: "ایسے ٹکڑے جن میں ابو القاسم کہتے ہیں کہ ان کی فکر تلواریں اور نیزے ہیں نہ کہ گانا اور شراب، وہ جنگ کے شیر ہیں جو دشمن سے نہیں ڈرتے اور ان کے والد رسول اللہ ہیں؛ ص265 کے آخر کے ٹکڑے پر ص266 کا حاشیہ کہتا ہے کہ وہ پہلے آ چکا جب ابو القاسم خیوان میں تھے۔"
