  en: "The Prophet's dream of the Highest Assembly's dispute"
  ur: "اعلیٰ مجلس کے جھگڑے کا نبی کا خواب"
summary:
  ar: "أتاني الليلة ربي في أحسن صورة في المنام فقال يا محمد هل تدري فيم يختصم الملأ الأعلى {cite:jami-al-tirmidhi} [[passage/tirmidhi-3233|الترمذي 3233]]."
  en: "Tonight my Lord came to me in the fairest form in a dream and said: O Muhammad, do you know what the Highest Assembly disputes about? {cite:jami-al-tirmidhi} [[passage/tirmidhi-3233|Tirmidhi 3233]]."
  ur: "آج رات میرے رب نے خواب میں آکر مجھ سے کہا: یا محمد کیا تم جانتے ہو کہ اعلیٰ مجلس کن چیزوں پر جھگڑتی ہے؟ {cite:jami-al-tirmidhi} [[passage/tirmidhi-3233|ترمذی 3233]]۔"
