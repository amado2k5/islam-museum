label:
  ar: "اعتزال السيوطي التام في الروضة، ٩٠٦هـ/١٥٠١م"
  en: "Al-Suyuti’s complete retreat to Rawda island, 906/1501"
  ur: "سیوطی کا جزیرہ روضہ میں مکمل عزلت، 906ھ/1501ء"
summary:
  ar: "سنة ٩٠٦هـ/١٥٠١م تمّ اعتزال السيوطي الكامل في بيته بجزيرة الروضة، إثر نزاع بينه وبين سكان خانقاه البيبرسية الذين كان يراهم من صوفية الدعوى؛ فاضطر إلى تخفيض رواتبهم ثم إلى الاختباء هرباً من تسلّط السلطان طومان باي الذي كان ينصر خصومه، وفُصل من وظائفه، فانصرف في بيته إلى تصنيف كتبه ومراجعتها {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  en: "Al-Suyuti’s complete retreat to his house on Rawda island took place in 906/1501, following the conflict with the residents of the Baybarsiyya khankah, whom he regarded as pseudo-Sufis. Forced to reduce their salaries, he had to go into hiding to escape the persecution of Sultan Tuman Bay, who supported his adversaries, and was dismissed from his functions; in his house he concentrated on composing and revising his works {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  ur: "906ھ/1501ء میں سیوطی جزیرہ روضہ میں اپنے گھر میں مکمل طور پر عزلت اختیار کر گئے، یہ بیبرسیہ خانقاہ کے ساکنان سے جھگڑے کے بعد ہوا جنھیں وہ جعلی صوفی سمجھتے تھے۔ ان کے وظیفے کم کرنے پر مجبور ہوئے، پھر سلطان طومان بائے کے ظلم سے بچنے کے لیے چھپنا پڑا جس نے ان کے مخالفین کی حمایت کی، اور وہ اپنے مناصب سے برطرف ہوئے؛ گھر میں انہوں نے اپنی کتابوں کی تصنیف و نظرثانی میں مصروف رہے {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}۔"
