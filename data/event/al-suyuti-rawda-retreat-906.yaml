label:
  ar: "اعتزال السيوطي التام في الروضة، ٩٠٦هـ/١٥٠١م"
  en: "Al-Suyuti’s complete retreat to Rawda island, 906/1501"
  ur: "سیوطی کا جزیرہ روضہ میں مکمل عزلت، 906ھ/1501ء"
  es: "Retirada completa de Al-Suyuti a la isla de Rawda, 906/1501"
  fr: "Retraite complète d'Al-Suyuti sur l'île de Rawda, 906/1501"
  tr: "Al-Suyuti'nin Al-Rawda'da tamamen inzivaya çekilmesi, H. 906/MS 1501"
  id: "Pengasingan total Al-Suyuti di Al-Rawda, 906 H/1501 M."
summary:
  ar: "سنة ٩٠٦هـ/١٥٠١م تمّ اعتزال السيوطي الكامل في بيته بجزيرة الروضة، إثر نزاع بينه وبين سكان خانقاه البيبرسية الذين كان يراهم من صوفية الدعوى؛ فاضطر إلى تخفيض رواتبهم ثم إلى الاختباء هرباً من تسلّط السلطان طومان باي الذي كان ينصر خصومه، وفُصل من وظائفه، فانصرف في بيته إلى تصنيف كتبه ومراجعتها {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  en: "Al-Suyuti’s complete retreat to his house on Rawda island took place in 906/1501, following the conflict with the residents of the Baybarsiyya khankah, whom he regarded as pseudo-Sufis. Forced to reduce their salaries, he had to go into hiding to escape the persecution of Sultan Tuman Bay, who supported his adversaries, and was dismissed from his functions; in his house he concentrated on composing and revising his works {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  ur: "906ھ/1501ء میں سیوطی جزیرہ روضہ میں اپنے گھر میں مکمل طور پر عزلت اختیار کر گئے، یہ بیبرسیہ خانقاہ کے ساکنان سے جھگڑے کے بعد ہوا جنھیں وہ جعلی صوفی سمجھتے تھے۔ ان کے وظیفے کم کرنے پر مجبور ہوئے، پھر سلطان طومان بائے کے ظلم سے بچنے کے لیے چھپنا پڑا جس نے ان کے مخالفین کی حمایت کی، اور وہ اپنے مناصب سے برطرف ہوئے؛ گھر میں انہوں نے اپنی کتابوں کی تصنیف و نظرثانی میں مصروف رہے {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}۔"
  es: "El retiro total de Al-Suyuti a su casa en la isla de Rawda tuvo lugar en 906/1501, tras el conflicto con los residentes de la khankah Baybarsiyya, a quienes consideraba pseudosufíes. Obligado a reducir sus salarios, tuvo que esconderse para escapar de la persecución del sultán Tuman Bay, quien apoyaba a sus adversarios, y fue destituido de sus funciones; en su casa se concentró en componer y revisar sus obras {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  fr: "Le retrait définitif d'Al-Suyuti dans sa demeure de l'île de Rawda eut lieu en 906/1501, suite au conflit avec les habitants du khankah de Baybarsiyya, qu'il considérait comme de faux soufis. Contraint de réduire leurs salaires, il dut se cacher pour échapper à la persécution du sultan Tuman Bay, qui soutenait ses adversaires, et fut démis de ses fonctions. Dans sa maison, il se consacra à la composition et à la révision de ses œuvres (voir Encyclopaedia of Islam, vol. 9, p. 914)."
  tr: "Hicri 906/Miladi 1501 yılında, Suyuti, Baybarsiyye Hankası sakinleriyle arasında çıkan bir anlaşmazlık sonucu, Ravda Adası'ndaki evine tamamen kapandı. Bu sakinleri, Sufi taklitçileri olarak görüyordu. Maaşlarını azaltmak zorunda kaldı ve ardından, muhaliflerini destekleyen Sultan Tuman Bey'in zulmünden kaçarak saklandı. İşlerinden de uzaklaştırıldı ve evinde kitaplarını sınıflandırmaya ve gözden geçirmeye kendini adadı. {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}"
  id: "Pada tahun 906 H/1501 M, Al-Suyuti mengasingkan diri sepenuhnya di rumahnya di Pulau Rawda, setelah perselisihan antara dirinya dan penghuni Khanqah Baybarsiyya, yang dianggapnya sebagai penipu Sufi. Ia terpaksa mengurangi gaji mereka dan kemudian bersembunyi, melarikan diri dari tirani Sultan Tuman Bay, yang mendukung lawan-lawannya. Ia dipecat dari pekerjaannya, sehingga ia mengabdikan dirinya di rumah untuk mengklasifikasikan dan meninjau buku-bukunya. {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
