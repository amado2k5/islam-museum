label:
  ar: "مصنفات الجاحظ في الإمامة تستحسن لدى المأمون"
  en: "al-Jahiz's works on the imamate win al-Ma'mun's praise"
  ur: "جاحظ کی امامت پر تصانیف مامون کی توجہ حاصل کرتی ہیں"
summary:
  ar: "نحو سنة ٢٠٠هـ/٨١٥م يظهر أول دليل على نشاط الجاحظ الأدبي: مصنفات له في الإمامة نالت استحسان المأمون، ففتحت له باب عاصمة الخلافة ومجدها، فأخذ منذ ذلك الحين يقيم ببغداد — ومن بعدها سرّ من رأى — مقامات طويلة دون أن يقطع صلته بالبصرة {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  en: "About 200/815-6 comes the first proof of al-Jahiz's literary activity: several works of his on the imamate won the compliments of al-Ma'mun and thereby the recognition of the capital, and from then on, without abandoning Basra, he stayed for long periods in Baghdad and later Samarra {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  ur: "تقریباً 200ھ/815-16ء میں جاحظ کی ادبی سرگرمی کا پہلا ثبوت ملتا ہے: امامت پر ان کی تصانیف نے خلیفہ مامون کی تحسین حاصل کی اور اس سے دارالخلافہ میں ان کی پہچان بنی؛ اسی سے وہ بصرہ سے تعلق قائم رکھتے ہوئے بغداد اور بعد میں سامرا میں طویل قیام کرنے لگے {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
