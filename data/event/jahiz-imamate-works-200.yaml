id: event/jahiz-imamate-works-200
class: event
kind: publication
label:
  ar: "مصنفات الجاحظ في الإمامة تستحسن لدى المأمون"
  en: "al-Jahiz's works on the imamate win al-Ma'mun's praise"
  ur: "جاحظ کی امامت پر تصانیف مامون کی توجہ حاصل کرتی ہیں"
  es: "Las obras de al-Jahiz sobre el imamato reciben elogios de al-Ma'mun."
  fr: "Les travaux d'al-Jahiz sur l'imamat suscitent l'admiration d'al-Ma'mun."
  tr: "El-Cahiz'in imamlık hakkındaki yazıları El-Ma'mun tarafından beğenilmiştir."
  id: "Tulisan-tulisan Al-Jahiz tentang Imamah disukai oleh Al-Ma'mun."
summary:
  ar: "نحو سنة ٢٠٠هـ/٨١٥م يظهر أول دليل على نشاط الجاحظ الأدبي: مصنفات له في الإمامة نالت استحسان المأمون، ففتحت له باب عاصمة الخلافة ومجدها، فأخذ منذ ذلك الحين يقيم ببغداد — ومن بعدها سرّ من رأى — مقامات طويلة دون أن يقطع صلته بالبصرة {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  en: "About 200/815-6 comes the first proof of al-Jahiz's literary activity: several works of his on the imamate won the compliments of al-Ma'mun and thereby the recognition of the capital, and from then on, without abandoning Basra, he stayed for long periods in Baghdad and later Samarra {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  ur: "تقریباً 200ھ/815-16ء میں جاحظ کی ادبی سرگرمی کا پہلا ثبوت ملتا ہے: امامت پر ان کی تصانیف نے خلیفہ مامون کی تحسین حاصل کی اور اس سے دارالخلافہ میں ان کی پہچان بنی؛ اسی سے وہ بصرہ سے تعلق قائم رکھتے ہوئے بغداد اور بعد میں سامرا میں طویل قیام کرنے لگے {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  es: "Hacia el año 200/815-6 aparece la primera prueba de la actividad literaria de al-Jahiz: varias obras suyas sobre el imamato obtuvieron los elogios de al-Ma'mun y, por lo tanto, el reconocimiento de la capital, y desde entonces, sin abandonar Basora, permaneció durante largos períodos en Bagdad y más tarde en Samarra {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  fr: "Vers 200/815-6 apparaît la première preuve de l'activité littéraire d'al-Jahiz: plusieurs de ses œuvres sur l'imamat ont reçu les compliments d'al-Ma'mun et par conséquent la reconnaissance de la capitale, et à partir de ce moment-là, sans abandonner Bassora, il séjourna pendant de longues périodes à Bagdad et plus tard à Samarra {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  tr: "Hicri 200/Miladi 815 yılı civarında, El-Cahiz'in edebi faaliyetine dair ilk kanıtlar ortaya çıkar: İmamlık üzerine yazdığı eserler El-Ma'mun'un onayını alır ve bu da ona halifeliğin başkentine ve ihtişamına giden kapıyı açar. O zamandan itibaren, Basra ile bağını koparmadan uzun süreler boyunca Bağdat'ta ve daha sonra Samarra'da ikamet etmeye başlar. {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}"
  id: "Sekitar tahun 200 H/815 M, bukti pertama aktivitas sastra Al-Jahiz muncul: tulisannya tentang Imamah mendapat persetujuan Al-Ma'mun, yang membukakan pintu baginya ke ibu kota Kekhalifahan dan kejayaannya. Sejak saat itu, ia mulai menetap di Baghdad — dan setelah itu, Samarra — untuk jangka waktu yang lama tanpa memutuskan hubungannya dengan Basra {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
