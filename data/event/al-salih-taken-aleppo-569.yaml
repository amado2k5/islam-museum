summary:
  ar: "سار سعد الدين كمشتكين إلى دمشق في المحرم فأخذ الملك الصالح بن نور الدين وعاد به إلى حلب، فقبض على شمس الدين بن الداية وإخوته ورئيس بن الخشاب واستبد بتربية الملك الصالح، فخاف ابن المقدم وأمراء دمشق وكاتبوا سيف الدين غازي ليعبر الفرات فيسلموا إليه دمشق فلم يفعل بمشورة زلفندار، فانتهى الأمر إلى تسليمها لصلاح الدين {cite:kamil-ibn-al-athir p. 60-61}."
  en: "In Muharram Saʿd al-Dīn Kumashtakīn fetched the child-king al-Ṣāliḥ Ismāʿīl from Damascus to Aleppo, seized Ibn al-Dāya and his brothers and the raʾīs Ibn al-Khashshāb, and made himself sole regent — «براقش على نفسها تجني». Damascus's emirs, fearing the same, offered the city to Sayf al-Dīn Ghāzī; on Zulfandār's counsel he refused, suspecting a trap — and so it came to Saladin {cite:kamil-ibn-al-athir p. 60-61}."
