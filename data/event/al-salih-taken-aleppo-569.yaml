label: { ar: "نقل الملك الصالح إلى حلب وتسلط سعد الدين كمشتكين", en: "al-Malik al-Ṣāliḥ moved to Aleppo — Saʿd al-Dīn Kumashtakīn seizes the regency", es: "al-Malik al-Ṣāliḥ se mudó a Alepo - Saʿd al-Dīn Kumashtakīn toma la regencia", fr: "al-Malik al-Ṣāliḥ s'installe à Alep — Saʿd al-Dīn Kumashtakīn s'empare de la régence", ur: "المالک الصالح حلب منتقل ہو گئے - سعدالدین کمشتکین نے ریاست پر قبضہ کر لیا", tr: "Kral Salih Halep'e nakledildi ve Saad Din Kumuştakin iktidarı ele geçirdi.", id: "Raja Al-Salih dipindahkan ke Aleppo, dan Saad Al-Din Kumushtakin merebut kekuasaan." }
date:
  start: { edtf: "1173~", hijri: "0569", calendar: julian, precision: year, status: tradition, derived: true }
summary:
  ar: "سار سعد الدين كمشتكين إلى دمشق في المحرم فأخذ الملك الصالح بن نور الدين وعاد به إلى حلب، فقبض على شمس الدين بن الداية وإخوته ورئيس بن الخشاب واستبد بتربية الملك الصالح، فخاف ابن المقدم وأمراء دمشق وكاتبوا سيف الدين غازي ليعبر الفرات فيسلموا إليه دمشق فلم يفعل بمشورة زلفندار، فانتهى الأمر إلى تسليمها لصلاح الدين {cite:kamil-ibn-al-athir p. 60-61}."
  en: "In Muharram Saʿd al-Dīn Kumashtakīn fetched the child-king al-Ṣāliḥ Ismāʿīl from Damascus to Aleppo, seized Ibn al-Dāya and his brothers and the raʾīs Ibn al-Khashshāb, and made himself sole regent — «براقش على نفسها تجني». Damascus's emirs, fearing the same, offered the city to Sayf al-Dīn Ghāzī; on Zulfandār's counsel he refused, suspecting a trap — and so it came to Saladin {cite:kamil-ibn-al-athir p. 60-61}."
  es: "En Muharram, Saʿd al-Dīn Kumashtakīn trajo al niño rey al-Ṣāliḥ Ismāʿīl de Damasco a Alepo, apresó a Ibn al-Dāya y a sus hermanos, así como al raʾīs Ibn al-Khashshāb, y se proclamó regente único. Los emires de Damasco, temiendo lo mismo, ofrecieron la ciudad a Sayf al-Dīn Ghāzī; siguiendo el consejo de Zulfandār, este se negó, sospechando una trampa, y así fue como la ciudad pasó a manos de Saladino {cite:kamil-ibn-al-athir p. 60-61}."
  fr: "Durant le mois de Muharram, Saʿd al-Dīn Kumashtakīn fit venir le jeune roi al-Ṣāliḥ Ismāʿīl de Damas à Alep, captura Ibn al-Dāya et ses frères ainsi que les raʾīs Ibn al-Khashshāb, et s'autoproclama régent. Les émirs de Damas, craignant le même sort, offrirent la ville à Sayf al-Dīn Ghāzī; sur les conseils de Zulfandār, il refusa, soupçonnant un piège – et c'est ainsi qu'elle revint à Saladin (voir: Kamil-ibn-al-athir, p. 60-61)."
  ur: "محرم میں سعدالدین کمشتکین نے بچہ بادشاہ الصالح اسماعیل کو دمشق سے حلب لایا، ابن الدایا اور اس کے بھائیوں اور راعی ابن الخشاب کو پکڑ لیا، اور خود کو واحد ولی عہد بنا لیا۔ دمشق کے امیروں نے اسی ڈر سے شہر سیف الدین غازی کو پیش کیا۔ ذوالفقار کے مشورے پر اس نے پھندے کا شبہ کرتے ہوئے انکار کر دیا - اور یوں بات صلاح الدین تک پہنچی۔ 60-61}۔"
  tr: "Saad al-Din Kamshtakin Muharrem ayında Şam'a yürüdü ve Kral al-Salih ibn Nur al-Din'i yanına alarak Halep'e geri döndü. Şems al-Din ibn al-Dayah ve kardeşlerini ve Ra'is ibn al-Khashab'ı tutukladı ve Kral al-Salih'in yetiştirilmesini kontrol altına aldı. İbn al-Muqaddam ve Şam prensleri korktular ve Saif al-Din Gazi'ye Fırat'ı geçmesi ve Şam'ı kendisine teslim etmesi için mektup yazdılar, ancak Zulfindar'ın tavsiyesi üzerine bunu yapmadı. Mesele, Şam'ın Selahaddin'e teslim edilmesiyle sonuçlandı. {kaynak: Kamil ibn al-athir s. 60-61}"
  id: "Saad al-Din Kamshtakin berbaris ke Damaskus pada bulan Muharram dan membawa Raja al-Salih ibn Nur al-Din, lalu kembali bersamanya ke Aleppo. Ia menangkap Shams al-Din ibn al-Dayah dan saudara-saudaranya serta Ra’is ibn al-Khashab dan mengambil alih pengasuhan Raja al-Salih. Ibn al-Muqaddam dan para pangeran Damaskus merasa takut dan menulis surat kepada Saif al-Din Ghazi untuk menyeberangi Sungai Eufrat agar mereka menyerahkan Damaskus kepadanya, tetapi ia tidak melakukannya atas saran Zulfindar. Masalah itu berakhir dengan penyerahannya kepada Saladin. {cite:kamil-ibn-al-athir p. 60-61}."
