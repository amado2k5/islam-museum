label: { ar: "نقل الملك الصالح إلى حلب وتسلط سعد الدين كمشتكين", en: "al-Malik al-Ṣāliḥ moved to Aleppo — Saʿd al-Dīn Kumashtakīn seizes the regency", es: "al-Malik al-Ṣāliḥ se mudó a Alepo - Saʿd al-Dīn Kumashtakīn toma la regencia", fr: "al-Malik al-Ṣāliḥ s'installe à Alep — Saʿd al-Dīn Kumashtakīn s'empare de la régence" }
date:
  start: { edtf: "1173~", hijri: "0569", calendar: julian, precision: year, status: tradition, derived: true }
summary:
  ar: "سار سعد الدين كمشتكين إلى دمشق في المحرم فأخذ الملك الصالح بن نور الدين وعاد به إلى حلب، فقبض على شمس الدين بن الداية وإخوته ورئيس بن الخشاب واستبد بتربية الملك الصالح، فخاف ابن المقدم وأمراء دمشق وكاتبوا سيف الدين غازي ليعبر الفرات فيسلموا إليه دمشق فلم يفعل بمشورة زلفندار، فانتهى الأمر إلى تسليمها لصلاح الدين {cite:kamil-ibn-al-athir p. 60-61}."
  en: "In Muharram Saʿd al-Dīn Kumashtakīn fetched the child-king al-Ṣāliḥ Ismāʿīl from Damascus to Aleppo, seized Ibn al-Dāya and his brothers and the raʾīs Ibn al-Khashshāb, and made himself sole regent — «براقش على نفسها تجني». Damascus's emirs, fearing the same, offered the city to Sayf al-Dīn Ghāzī; on Zulfandār's counsel he refused, suspecting a trap — and so it came to Saladin {cite:kamil-ibn-al-athir p. 60-61}."
  es: "En Muharram, Saʿd al-Dīn Kumashtakīn trajo al niño rey al-Ṣāliḥ Ismāʿīl de Damasco a Alepo, apresó a Ibn al-Dāya y a sus hermanos, así como al raʾīs Ibn al-Khashshāb, y se proclamó regente único. Los emires de Damasco, temiendo lo mismo, ofrecieron la ciudad a Sayf al-Dīn Ghāzī; siguiendo el consejo de Zulfandār, este se negó, sospechando una trampa, y así fue como la ciudad pasó a manos de Saladino {cite:kamil-ibn-al-athir p. 60-61}."
  fr: "Durant le mois de Muharram, Saʿd al-Dīn Kumashtakīn fit venir le jeune roi al-Ṣāliḥ Ismāʿīl de Damas à Alep, captura Ibn al-Dāya et ses frères ainsi que les raʾīs Ibn al-Khashshāb, et s'autoproclama régent. Les émirs de Damas, craignant le même sort, offrirent la ville à Sayf al-Dīn Ghāzī; sur les conseils de Zulfandār, il refusa, soupçonnant un piège – et c'est ainsi qu'elle revint à Saladin (voir: Kamil-ibn-al-athir, p. 60-61)."
