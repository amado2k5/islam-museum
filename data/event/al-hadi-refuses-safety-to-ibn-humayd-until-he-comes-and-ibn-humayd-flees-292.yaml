id: event/al-hadi-refuses-safety-to-ibn-humayd-until-he-comes-and-ibn-humayd-flees-292
class: event
kind: other
label:
  ar: "رفض الهادي أمان ابن حميد إلا أن يأتيه وفرار ابن حميد إلى البادية، ص294-295"
  en: "Al-Hadi refuses Ibn Humayd safety unless he comes in person, and Ibn Humayd flees to the desert, pp. 294-295"
  ur: "ہادی کا ابن حمید کو امان دینے سے انکار جب تک وہ خود نہ آئے، اور ابن حمید کا صحرا کو بھاگنا، ص294-295"
  es: "Al-Hadi le niega seguridad a Ibn Humayd a menos que se presente en persona, e Ibn Humayd huye al desierto, págs. 294-295."
summary:
  ar: "في أيام بقيت من رمضان بلغ الهادي أن ابن حميد يجمع أعراباً من يأم وبني الحارث، فغدا إليه فلم يجده وقطع نخلاً كثيراً، فسألوه بنو الحارث الكفّ، وطلبوا الأمان لابن حميد فقال لا آمنه إلا أن يطأ بساطي، فلما بلغه ذلك سار إلى البادية."
  en: "In the last days of Ramadan al-Hadi heard that Ibn Humayd was meeting bedouin of Yam and Banu al-Harith to gather them to disorder; he went out and did not find him and had many palms cut; Banu al-Harith asked him to stop and sought safety for Ibn Humayd, and he said he would not give it unless he stepped on his carpet; when this reached Ibn Humayd he left for the desert."
  ur: "رمضان کے آخری دنوں میں ہادی کو خبر ملی کہ ابن حمید یام اور بنو حارث کے بدوؤں سے مل کر انہیں فساد کے لیے جمع کر رہا ہے؛ وہ اس کی طرف نکلے، وہ نہ ملا، انہوں نے بہت سی کھجوریں کٹوا دیں؛ بنو حارث نے رکنے کی درخواست کی اور ابن حمید کے لیے امان مانگی تو ہادی نے کہا کہ میں اسے امان نہ دوں گا جب تک وہ میرے فرش پر قدم نہ رکھے؛ جب یہ ابن حمید کو پہنچا تو وہ صحرا کو چلا گیا۔"
  es: "En los últimos días de Ramadán, al-Hadi supo que Ibn Humayd se reunía con beduinos de Yam y Banu al-Harith para incitarlos al desorden; salió y no lo encontró, y le cortaron muchas palmas de las manos; Banu al-Harith le pidió que se detuviera y suplicó protección para Ibn Humayd, y él dijo que no se la daría a menos que pisara su alfombra; cuando esto llegó a oídos de Ibn Humayd, partió hacia el desierto."
