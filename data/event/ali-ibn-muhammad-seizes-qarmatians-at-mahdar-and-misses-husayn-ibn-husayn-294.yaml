id: event/ali-ibn-muhammad-seizes-qarmatians-at-mahdar-and-misses-husayn-ibn-husayn-294
class: event
kind: raid
label:
  ar: "علي بن محمد يأخذ قرامطة بمحضر ويفوته داعيتهم حسين بن حسين، سنة 294هـ، ص340"
  en: "Ali ibn Muhammad seizes Qarmatians at Mahdar and misses their missionary Husayn ibn Husayn, 294 AH, p. 340"
  ur: "علی بن محمد کا محضر میں قرامطہ کو پکڑنا اور ان کے داعی حسین بن حسین کا نکل جانا، 294ھ، ص340"
  es: "Ali ibn Muhammad captura a los Qarmatianos en Mahdar y extraña a su misionero Husayn ibn Husayn, 294 AH, p. 340"
summary:
  ar: "أمر الهادي محمد بن عبيد الله بطلب القرامطة، فخرج ابناه علي والقاسم بمائة رجل، فأخذ علي خمسة عشر قرمطياً في محضر، ولم يجد القاسم داعيتهم في منزله برجلاء."
  en: "Al-Hadi ordered Muhammad ibn Ubaydallah to seek out the Qarmatians. His sons Ali and al-Qasim rode with a hundred men; Ali took fifteen Qarmatians at Mahdar, and al-Qasim did not find their missionary at his house in Rijla."
  ur: "ہادی نے محمد بن عبید اللہ کو قرامطہ کی تلاش کا حکم دیا۔ ان کے بیٹے علی اور قاسم سو آدمیوں کے ساتھ نکلے؛ علی نے محضر میں پندرہ قرامطہ پکڑے، اور قاسم کو رجلاء میں ان کا داعی گھر پر نہیں ملا۔"
  es: "Al-Hadi ordenó a Muhammad ibn Ubaydallah que buscara a los cármatas. Sus hijos Ali y al-Qasim cabalgaron con cien hombres; Ali capturó a quince cármatas en Mahdar, y al-Qasim no encontró a su misionero en su casa de Rijla."
