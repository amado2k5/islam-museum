id: event/ibn-qayyim-musabaqa-746
class: event
kind: other
label:
  ar: "خلاف ابن قيم الجوزية مع السبكي في مسألة المسابقة، محرم ٧٤٦هـ/١٣٤٥م"
  en: "Ibn Qayyim's dispute with al-Subki over the contest stake, Muharram 746/1345"
  ur: "مسابقہ کے صلے پر ابن قیم اور سبکی کا اختلاف، محرم 746ھ/1345ء"
summary:
  ar: "في محرم سنة ٧٤٦هـ/مايو-يونيو ١٣٤٥م اختلف ابن قيم الجوزية مع قاضي قضاة الشافعية تقي الدين السبكي في مسألة المسابقة: هل يجوز أن يتسابق اثنان ويضع كلٌّ منهما عوضاً من غير مشاركة ثالث (المحلِّل) الذي يدخل بغير عوض فيخرج العمل بذلك من القمار؛ فذهب ابن قيم على مذهب ابن تيمية إلى أن المحلّل لا يُشترط، فاستدعاه قاضي القضاة الشافعي وآل الأمر إلى أن رجع عما كان أفتى به {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}؛ وذكر ابن حجر أن ذلك كان في ربيع الأول وأن السبكي أنكر عليه فتاواه بجواز المسابقة بغير محلّل {cite:durar-kamina-jil-1993 3/402-403}."
  en: "In Muharram 746/May-June 1345 Ibn Qayyim clashed with the Shafi'i chief qadi Taqi al-Din al-Subki over whether a race or shooting contest is lawful when each of the two competitors puts down a stake without a third party (the muhallil) who enters stakeless and so legitimizes the contest; following Ibn Taymiyya's doctrine, Ibn Qayyim held the muhallil unnecessary, and, summoned before the Shafi'i qadi al-qudat, he had to submit to the qadi's opinion {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}. Ibn Hajar places the dispute in Rabi' I and records al-Subki's objection to his fatwa permitting a contest without a muhallil {cite:durar-kamina-jil-1993 3/402-403}."
  ur: "محرم 746ھ/مئی-جون 1345ء میں ابن قیم کا شافعی قاضی القضاة تقی الدین سبکی سے اس سوال پر اختلاف ہوا کہ کیا دو متسابقوں کا صلہ رکھ کر مسابقت جائز ہے بغیر تیسرے شریک (محلل) کے جو بلا صلہ داخل ہو کر معاملہ کو قمار سے خارج کرے؛ ابن قیم نے ابن تیمیہ کے مسلک پر محلل کو غیر ضروری قرار دیا، اور شافعی قاضی القضاة کے سامنے طلب ہونے پر انہیں قاضی کی رائے ماننی پڑی {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}۔ ابن حجر نے یہ واقعہ ربیع الاول میں رکھا اور ابن قیم کے فتویٰ پر سبکی کے اعتراض کو نقل کیا {cite:durar-kamina-jil-1993 3/402-403}۔"
