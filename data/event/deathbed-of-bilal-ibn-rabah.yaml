id: event/deathbed-of-bilal-ibn-rabah
class: event
kind: death
label:
  ar: وفاة بلال بن رباح بالشام واختلاف الروايات في قبره
  en: Death of Bilal ibn Rabah in Syria and the differing reports on his grave
  ur: شام میں بلال بن رباح کی وفات اور ان کی قبر کے بارے میں روایات کا اختلاف
  es: "Muerte de Bilal ibn Rabah en Siria y los diferentes relatos sobre su tumba."
  fr: "Mort de Bilal ibn Rabah en Syrie et récits contradictoires concernant sa tombe"
  tr: "Bilal ibn Rabah'ın Suriye'deki ölümü ve mezarı hakkındaki farklı rivayetler"
  id: "Kematian Bilal ibn Rabah di Suriah dan berbagai versi mengenai makamnya."
summary:
  ar: "تروي كتب التراجم أن بلالاً قال حين حضرته الوفاة غداً نلقى الأحبة محمداً وحزبه، وكانت امرأته تقول واويلاه فيقول وافرحتاه {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 1 p. 318}. وسأل أبا بكر ثم عمر أن يأذنا له بالخروج إلى الشام فخرج وبقي بها حتى مات {cite:usd-al-ghaba scan vol. 1 p. 130}. وفي تاريخ وفاته أقوال: سنة عشرين عند ابن إسحاق وغيره، وسنة ثماني عشرة في الطاعون عند ابن بكير، وإحدى وعشرين عند آخرين {cite:al-bidaya-wal-nihaya scan vol. 4 p. 104}. وفي قبره أربع روايات: دُفن بباب الصغير بدمشق عند الواقدي، وبباب كيسان عند غيره، وفي داريا بمقبرة خولان، وفي حلب عند باب الأربعين {cite:siyar-alam-nubala scan vol. 2 p. 345}."
  en: "The biographical books report that as death came to Bilal he said, tomorrow we meet the beloved ones, Muhammad and his party, while his wife cried out in grief and he answered, rather, in joy {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 1 p. 318}. He had asked Abu Bakr and then Umar to let him go to Syria, and stayed there until he died {cite:usd-al-ghaba scan vol. 1 p. 130}. His date of death is given as the year 20 by Ibn Ishaq and others, as the year of the plague, 18, by Ibn Bukayr, and as 21 by some {cite:al-bidaya-wal-nihaya scan vol. 4 p. 104}. His grave has four reports: at Bab al-Saghir in Damascus per al-Waqidi, at Bab Kaysan per others, at Darayya in the cemetery of Khawlan, and at Aleppo by the Bab al-Arba'in {cite:siyar-alam-nubala scan vol. 2 p. 345}."
  ur: "تراجم کی کتابوں میں ہے کہ نزع کے وقت بلال نے کہا: کل ہم احباب سے ملیں گے، محمد اور ان کی جماعت سے؛ ان کی بیوی ہائے ہائے کرتی تو وہ کہتے: ہائے خوشی {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 1 p. 318}. انھوں نے ابوبکر اور پھر عمر سے شام جانے کی اجازت مانگی اور وہاں رہے یہاں تک کہ فوت ہوئے {cite:usd-al-ghaba scan vol. 1 p. 130}. ان کی وفات کا سال ابن اسحاق وغیرہ کے نزدیک 20 ہجری، ابن بکیر کے نزدیک طاعون کا سال 18، اور بعض کے نزدیک 21 ہے {cite:al-bidaya-wal-nihaya scan vol. 4 p. 104}. ان کی قبر کے بارے میں چار روایات ہیں: واقدی کے نزدیک دمشق کے باب الصغیر میں، دوسروں کے نزدیک باب کیسان میں، داریا کے خولان کے قبرستان میں، اور حلب میں باب الاربعین کے پاس {cite:siyar-alam-nubala scan vol. 2 p. 345}."
  es: "Los libros biográficos informan que cuando Bilal murió, dijo: «Mañana nos encontraremos con los amados, Muhammad y su grupo», mientras su esposa lloraba desconsoladamente y él respondía, más bien, con alegría {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 1 p. 318}. Le había pedido a Abu Bakr y luego a Umar que lo dejaran ir a Siria, y permaneció allí hasta su muerte {cite:usd-al-ghaba scan vol. 1 p. 130}. Su fecha de muerte es dada como el año 20 por Ibn Ishaq y otros, como el año de la peste, 18, por Ibn Bukayr, y como el 21 por algunos {cite:al-bidaya-wal-nihaya scan vol. 4 p. 104}. Su tumba tiene cuatro menciones: en Bab al-Saghir en Damasco según al-Waqidi, en Bab Kaysan según otros, en Darayya en el cementerio de Khawlan, y en Alepo por Bab al-Arba'in {cite:siyar-alam-nubala scan vol. 2 p. 345}."
  fr: "Les biographies rapportent qu'à l'approche de la mort, Bilal aurait déclaré: « Demain, nous retrouverons les êtres chers, Muhammad et son groupe. » Son épouse, accablée de chagrin, s'écria, tandis que lui, au contraire, répondit avec joie (cite: tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 1 p. 318). Il avait demandé à Abou Bakr, puis à Omar, la permission de se rendre en Syrie, où il demeura jusqu'à son décès (cite: usd-al-ghaba scan vol. 1 p. 130). La date de sa mort est fixée à l'an 20 par Ibn Ishaq et d'autres, à l'an 18, année de la peste, par Ibn Bukayr, et à l'an 21 par certains (cite: al-bidaya-wal-nihaya scan vol. 4 p. 104). Sa tombe est mentionnée à quatre reprises: à Bab al-Saghir à Damas selon al-Waqidi, à Bab Kaysan selon d'autres, à Darayya dans le cimetière de Khawlan et à Alep près de Bab al-Arba'in {cite: siyar-alam-nubala scan vol. 2 p. 345}."
  tr: "Biyografik eserler, Bilal'in ölüm yaklaşırken, \"Yarın sevdiklerimizle, Muhammed ve sahabeleriyle buluşacağız\" dediğini anlatır. Karısı \"Vay bana!\" diye haykırmış, o da \"Neşem!\" diye cevap vermiştir. {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 1 p. 318}. Ebu Bekir'den ve ardından Ömer'den Suriye'ye gitmek için izin istemiş, böylece yola çıkmış ve ölümüne kadar orada kalmıştır. {cite:usd-al-ghaba scan vol. 1 p. 130}. Ölüm tarihi konusunda farklı rivayetler vardır: İbn İshak ve diğerlerine göre Hicri 20, İbn Bukayr'a göre veba salgını sırasında Hicri 18 ve diğerlerine göre Hicri 21. {cite:al-bidaya-wal-nihaya scan vol. 4 p. 104}. Mezarının yeri hakkında dört farklı rivayet bulunmaktadır: El-Vakidi'ye göre Şam'daki Bab el-Sağri'ye, diğerlerine göre Bab Kisan'a, Darayya'daki Havlan mezarlığına ve Halep'teki Bab el-Arba'in'e gömülmüştür. {cite:siyar-alam-nubala scan vol. 2 p. 345}."
  id: "Karya-karya biografi menceritakan bahwa Bilal berkata, menjelang ajal menjemput, \"Besok kita akan bertemu dengan orang-orang yang kita cintai, Muhammad dan para sahabatnya.\" Istrinya berseru, \"Celaka aku!\" dan dia menjawab, \"Oh, betapa bahagianya aku!\" {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 1 p. 318}. Dia meminta izin kepada Abu Bakr dan kemudian Umar untuk pergi ke Suriah, lalu dia berangkat dan tinggal di sana sampai dia meninggal. {cite:usd-al-ghaba scan vol. 1 p. 130}. Ada berbagai catatan tentang tanggal kematiannya: 20 H menurut Ibn Ishaq dan lainnya, 18 H selama wabah menurut Ibn Bukayr, dan 21 H menurut yang lain. {cite:al-bidaya-wal-nihaya scan vol. 4 p. 104}. Terdapat empat catatan mengenai tempat pemakamannya: menurut al-Waqidi, ia dimakamkan di Bab al-Saghir di Damaskus, menurut catatan lain di Bab Kisan, di Darayya di pemakaman Khawlan, dan di Aleppo di Bab al-Arba'in. {cite:siyar-alam-nubala scan vol. 2 p. 345}."
