label: { ar: "نزول المسلمين بالحجر ونهي النبي عن الماء", en: "The army camps at al-Hijr and the Prophet bans its water", fr: "L'armée campe à al-Hijr et le Prophète interdit son eau", es: "El ejército acampa en al-Hijr y el Profeta prohíbe su agua.", ur: "فوج نے الحجر میں پڑاؤ ڈالا اور نبی نے اس کے پانی پر پابندی لگا دی۔", tr: "Müslümanlar taşı getirerek indiler ve Peygamber suyu yasakladı.", id: "Kaum Muslimin turun membawa batu itu dan Nabi melarang air." }
summary:
  ar: "نزل النبي بالحجر في طريقه إلى تبوك، واستقى الناس من بئرها، فلما راحوا نهاهم أن يشربوا من مائها أو يتوضؤوا منه أو يأكلوا ما عجنوا به، وأمرهم ألا يخرج أحد ليلاً إلا ومعه صاحب؛ فخالف رجلان من بني ساعدة فأُصيب أحدهما بالخنق وحملت الريح الآخر إلى جبلي طيئ."
  en: "On the road to Tabuk the Prophet stopped at al-Hijr, and the people drew water from its well. After they had rested he forbade them to drink its water, perform ablutions from it or eat dough kneaded with it, and ordered that no one go out at night without a companion; two men of Banu Sa'ida disobeyed — one was strangled and the wind carried the other to the mountains of Tayy."
  fr: "Sur la route de Tabuk, le Prophète fit halte à al-Hijr, et les gens puisèrent l'eau de son puits. Après qu'ils se furent reposés, il leur interdit de boire de son eau, d'en faire leurs ablutions ou de manger la pâte pétrie avec elle, et ordonna que nul ne sorte la nuit sans compagnon ; deux hommes des Banu Sa'ida désobéirent : l'un fut étranglé et le vent emporta l'autre jusqu'aux montagnes de Tayy."
  es: "En el camino a Tabuk, el Profeta se detuvo en al-Hijr, y la gente sacó agua de su pozo. Después de que descansaron, les prohibió beber de su agua, realizar abluciones con ella o comer masa amasada con ella, y ordenó que nadie saliera de noche sin compañía. Dos hombres de Banu Sa'ida desobedecieron: uno fue estrangulado y el viento se llevó al otro a las montañas de Tayy."
  ur: "تبوک کے راستے پر الحجر کے مقام پر نبی رکے اور لوگوں نے اس کے کنویں سے پانی نکالا۔ جب وہ آرام کر چکے تو آپ نے انہیں اس کا پانی پینے، اس سے وضو کرنے یا اس کے ساتھ گوندھا ہوا آٹا کھانے سے منع فرمایا، اور حکم دیا کہ رات کو بغیر ساتھی کے کوئی باہر نہ نکلے۔ بنو ساعدہ کے دو آدمیوں نے نافرمانی کی، ایک کا گلا گھونٹ دیا گیا اور ہوا دوسرے کو طی کے پہاڑوں پر لے گئی۔"
  tr: "Peygamberimiz Tebük yolunda Hicr'de durdu ve insanlar oradaki kuyudan su çektiler. Ayrılırken, onlara bu sudan içmeyi, onunla abdest almayı ve onunla yoğurdukları şeyleri yemeyi yasakladı. Geceleyin yanlarında bir arkadaş olmadan dışarı çıkmamalarını emretti. Beni Sa'ida kabilesinden iki kişi bu emre uymadı; içlerinden biri boğularak öldü, diğeri ise rüzgârla Tayy dağlarına sürüklendi."
  id: "Nabi berhenti di Al-Hijr dalam perjalanannya ke Tabuk, dan orang-orang mengambil air dari sumurnya. Ketika mereka pergi, beliau melarang mereka meminum airnya, berwudhu dengannya, atau memakan apa yang telah mereka uleni dengan air itu. Beliau memerintahkan agar tidak seorang pun keluar pada malam hari kecuali bersama seorang pendamping. Dua orang dari Bani Sa'ida membangkang, dan salah seorang dari mereka tersedak, dan yang lainnya terbawa angin ke pegunungan Tayy."
