label: { ar: "نزول المسلمين بالحجر ونهي النبي عن الماء", en: "The army camps at al-Hijr and the Prophet bans its water" }
summary:
  ar: "نزل النبي بالحجر في طريقه إلى تبوك، واستقى الناس من بئرها، فلما راحوا نهاهم أن يشربوا من مائها أو يتوضؤوا منه أو يأكلوا ما عجنوا به، وأمرهم ألا يخرج أحد ليلاً إلا ومعه صاحب؛ فخالف رجلان من بني ساعدة فأُصيب أحدهما بالخنق وحملت الريح الآخر إلى جبلي طيئ."
  en: "On the road to Tabuk the Prophet stopped at al-Hijr, and the people drew water from its well. After they had rested he forbade them to drink its water, perform ablutions from it or eat dough kneaded with it, and ordered that no one go out at night without a companion; two men of Banu Sa'ida disobeyed — one was strangled and the wind carried the other to the mountains of Tayy."
