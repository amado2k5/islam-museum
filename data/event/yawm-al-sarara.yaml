  en: "The day of al-Sarara — the war between Yathrib's Banu Amr ibn Awf and Banu al-Akhrath before Islam, sung by Hassan ibn Thabit and answered in verse by Qays ibn al-Khatim {cite:kamil-ibn-al-athir p. 491-496}."
