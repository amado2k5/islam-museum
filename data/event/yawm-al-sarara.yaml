label: { ar: "يوم السرارة", en: "The Day of al-Sarara", es: "El día de al-Sarara", fr: "Le jour d'al-Sarara", ur: "یوم الصرارہ", tr: "Sevinç günü", id: "Hari penuh sukacita" }
summary:
  ar: "يوم السرارة، الحرب بين بني عمرو بن عوف وبني أخرث من أهل يثرب قبل الإسلام؛ فيها قال حسان بن ثابت «فدى لبني النجار أمي وخالتي، وصرم من الأحياء عمرو بن مالك»، وفيها محاورته الشعرية مع قيس بن الخطيم ومنها قوله «فإني لأغنى الناس عن متكلف، وذي شيمة عسراء خالف شيمتي، فما المال والأخلاق إلا معارة، متى ما تقد بالباطل الحق يأبه، إذا ما أتيت الأمر من غير بابه» {cite:kamil-ibn-al-athir p. 491-496}."
  en: "The day of al-Sarara — the war between Yathrib's Banu Amr ibn Awf and Banu al-Akhrath before Islam, sung by Hassan ibn Thabit and answered in verse by Qays ibn al-Khatim {cite:kamil-ibn-al-athir p. 491-496}."
  es: "El día de al-Sarara: la guerra entre los Banu Amr ibn Awf de Yathrib y los Banu al-Akhrath antes del Islam, cantada por Hassan ibn Thabit y contestada en verso por Qays ibn al-Khatim {citar:kamil-ibn-al-athir p. 491-496}."
  fr: "Le jour d'al-Sarara — la guerre entre les Banu Amr ibn Awf de Yathrib et les Banu al-Akhrath avant l'Islam, chantée par Hassan ibn Thabit et répondue en vers par Qays ibn al-Khatim {cite: kamil-ibn-al-athir p. 491-496}."
  ur: "السرارہ کا دن - اسلام سے پہلے یثرب کے بنو عمرو بن عوف اور بنو الاخرۃ کے درمیان جنگ جسے حسان بن ثابت نے گایا اور قیس بن الخطیم نے آیت میں جواب دیا 491-496}۔"
  tr: "İslam öncesi dönemde Yathrib halkının Beni Amr ibn Awf ve Beni Akhrath kabileleri arasındaki savaş olan Sarara Günü'nde, Hasan ibn Sabit şöyle der: \"Annem ve teyzem Beni Najjar için fidyedir ve Amr ibn Malik hayattan koparılmıştır.\" Ayrıca, Kays ibn Al-Hatim ile yaptığı şiirsel diyalogda şu sözleri de yer alır: \"Çünkü ben, sahtekârı olmayan, zor bir karaktere sahip olan ve doğama aykırı davranan en zengin insanım; çünkü servet ve ahlak sadece birer borçtur, hakikate yalan sunulduğunda, yanlış kapıdan yaklaşıldığında ihmal edilir.\" {Kaynak: Kamil ibn Al-Athir, s. 491-496}."
  id: "Hari Al-Sarara, perang antara Bani Amr ibn Awf dan Bani Akhrath dari penduduk Yathrib sebelum Islam; di dalamnya Hassan ibn Thabit berkata, “Ibuku dan bibiku adalah tebusan bagi Bani Najjar, dan Amr ibn Malik terputus dari kehidupan,” dan di dalamnya terdapat dialog puitisnya dengan Qais ibn Al-Khatim, termasuk ucapannya, “Karena aku adalah orang terkaya tanpa seorang penipu, dan orang yang memiliki sifat sulit yang bertentangan dengan sifatku, karena kekayaan dan akhlak hanyalah pinjaman, setiap kali kebohongan disajikan kepada kebenaran, ia diabaikan, jika kau mendekati masalah dari pintu yang salah.” {kutip:kamil-ibn-al-athir hlm. 491-496}."
