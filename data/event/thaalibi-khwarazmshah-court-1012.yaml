id: event/thaalibi-khwarazmshah-court-1012
class: event
kind: other
label:
  ar: "الثعالبي في بلاط الخوارزمشاه بجرجانية، نحو ٤٠٣هـ"
  en: "Al-Tha'alibi at the Khwarazmshah's court, Jurjaniyya, c. 403/1012"
  ur: "جرجانیہ میں خوارزمشاہ کے دربار میں ثعالبی، تقریباً 403ھ/1012ء"
summary:
  ar: "دعا الخوارزمشاه مأمون بن مأمون الثعالبي من جرجان إلى بلاطه بجرجانية عاصمة خوارزم، فأهدى في مقامه مصنفات إلى الخوارزمشاه وإلى وزيره أبي عبد الله الحامدي، منها «آداب الملوك» و«تحفة الوزراء»، وصحب في ذلك البلاط ابن سينا والبيروني {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-452}."
  en: "From Jurjan the Khwarazmshah Ma'mun ibn Ma'mun invited al-Tha'alibi to his court at Jurjaniyya; during his stay he dedicated works to the Khwarazmshah and his vizier Abu Abd Allah al-Hamidi — among them the mirrors-for-princes Adab al-Muluk and Tuhfat al-Wuzara' — and enjoyed the company of fellow protégés such as Ibn Sina and al-Biruni {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-452}."
  ur: "جرجان سے خوارزمشاہ مامون بن مامون نے ثعالبی کو جرجانیہ میں اپنے دربار کی دعوت دی؛ قیام کے دوران انھوں نے خوارزمشاہ اور اس کے وزیر ابو عبد اللہ حامدی کے نام تصانیف وقف کیں جن میں آداب الملوک اور تحفۃ الوزراء شامل ہیں، اور ابن سینا اور بیرونی جیسے ہم درباریوں کی صحبت پائی {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-452}۔"
