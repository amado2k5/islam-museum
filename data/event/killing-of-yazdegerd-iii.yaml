label: { ar: "مقتل يزدجرد ملك فارس", en: "Killing of Yazdegerd III, king of Persia" }
summary:
  ar: "هرب يزدجرد بن شهريار إلى خراسان بعد أن افتتح عبد الله بن عامر فارس، وأرسل ابن عامر في أثره مجاشع بن مسعود السلمي حتى كرمان، فمات يزدجرد بعد ذلك {cite:tabari-tarikh-abu-al-fadl j.4 p.286}. ويذكر فهرس الجزء «ذكر الخبر عن مقتل يزدجرد ملك فارس» في سنة 31هـ {cite:tabari-tarikh-abu-al-fadl j.4 p.581}."
  en: "Yazdegerd ibn Shahriyar fled to Khurasan after Abd Allah ibn Amir had conquered Fars. Ibn Amir sent Mujashi' ibn Mas'ud al-Sulami in pursuit as far as Kirman, and Yazdegerd died after that {cite:tabari-tarikh-abu-al-fadl j.4 p.286}. The index of the volume lists a section headed 'The account of the killing of Yazdegerd, king of Fars' under the year 31 AH {cite:tabari-tarikh-abu-al-fadl j.4 p.581}."
