id: event/killing-of-yazdegerd-iii
class: event
kind: death
label: { ar: "مقتل يزدجرد ملك فارس", en: "Killing of Yazdegerd III, king of Persia", es: "Asesinato de Yazdegerd III, rey de Persia.", fr: "Meurtre de Yazdegerd III, roi de Perse" }
summary:
  ar: "هرب يزدجرد بن شهريار إلى خراسان بعد أن افتتح عبد الله بن عامر فارس، وأرسل ابن عامر في أثره مجاشع بن مسعود السلمي حتى كرمان، فمات يزدجرد بعد ذلك {cite:tabari-tarikh-abu-al-fadl j.4 p.286}. ويذكر فهرس الجزء «ذكر الخبر عن مقتل يزدجرد ملك فارس» في سنة 31هـ {cite:tabari-tarikh-abu-al-fadl j.4 p.581}."
  en: "Yazdegerd ibn Shahriyar fled to Khurasan after Abd Allah ibn Amir had conquered Fars. Ibn Amir sent Mujashi' ibn Mas'ud al-Sulami in pursuit as far as Kirman, and Yazdegerd died after that {cite:tabari-tarikh-abu-al-fadl j.4 p.286}. The index of the volume lists a section headed 'The account of the killing of Yazdegerd, king of Fars' under the year 31 AH {cite:tabari-tarikh-abu-al-fadl j.4 p.581}."
  es: "Yazdegerd ibn Shahriyar huyó a Jorasán después de que Abd Allah ibn Amir conquistara Fars. Ibn Amir envió a Mujashi' ibn Mas'ud al-Sulami en su persecución hasta Kirman, y Yazdegerd murió después de eso {cite:tabari-tarikh-abu-al-fadl j.4 p.286}. El índice del volumen incluye una sección titulada «El relato de la muerte de Yazdegerd, rey de Fars», correspondiente al año 31 AH {cite:tabari-tarikh-abu-al-fadl j.4 p.581}."
  fr: "Après la conquête du Fars par Abd Allah ibn Amir, Yazdegerd ibn Shahriyar s'enfuit au Khorasan. Ibn Amir envoya Mujashi' ibn Mas'ud al-Sulami à sa poursuite jusqu'à Kirman, où Yazdegerd mourut (voir Tabari Tarikh Abu al-Fadl, vol. 4, p. 286). L'index du volume mentionne une section intitulée « Récit de la mort de Yazdegerd, roi du Fars », sous l'an 31 de l'Hégire (voir Tabari Tarikh Abu al-Fadl, vol. 4, p. 581)."
