label: { ar: "مقتل يزدجرد ملك فارس" }
summary:
  ar: "هرب يزدجرد بن شهريار إلى خراسان بعد أن افتتح عبد الله بن عامر فارس، وأرسل ابن عامر في أثره مجاشع بن مسعود السلمي حتى كرمان، فمات يزدجرد بعد ذلك {cite:tabari-tarikh-abu-al-fadl j.4 p.286}. ويذكر فهرس الجزء «ذكر الخبر عن مقتل يزدجرد ملك فارس» في سنة 31هـ {cite:tabari-tarikh-abu-al-fadl j.4 p.581}."
