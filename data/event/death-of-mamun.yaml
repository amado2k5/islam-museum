label: { ar: "وفاة المأمون", en: "Death of al-Ma'mun" }
summary:
  ar: "في سنة ثماني عشرة ومائتين توفي المأمون، ونُقل من بلاد الثغر قرب طرطوس إلى طرسوس فدُفن بها {cite:tabari-tarikh-abu-al-fadl j.8 p.646}، وذكر الطبري أن أخاه أبا إسحاق المعتصم صلّى عليه {cite:tabari-tarikh-abu-al-fadl j.8 p.650}، وعند السيوطي نزل على عين البذندون من أدنى الروم فأعجبه بردها وصفاؤها ورأى فيها سمكة كأنها الفضة فاصطيدت فتنضح صدره وثوبه فأخذته رعدة وأتي بالسمكة فما ذاقها ثم سأل عن اسم البقعة فقيل الرقة وكان فيما عمل من مولده أنه يموت بالرقة فعرف وأيس وقال يا من لا يزول ملكه ارحم من قد زال ملكه، وقيل إن الكتب التي نفذت بالنص على أخيه أبي إسحاق وقعت بأمره وقيل كتبت وقت غشي أصابه، ومات يوم الخميس لاثنتي عشرة بقيت من رجب سنة ثمان عشرة ونقل إلى طرسوس فدفن بها {cite:tarikh-khulafa-minhaj-1434 p. 493-494}"
  en: "In 218 al-Ma'mun died. He was carried from the frontier near Tartus to Tarsus and buried there {cite:tabari-tarikh-abu-al-fadl j.8 p.646}; Tabari reports that his brother Abu Ishaq al-Mu'tasim led the prayer over him {cite:tabari-tarikh-abu-al-fadl j.8 p.650}. In al-Suyuti he halted by the spring of al-Bandun in the Byzantine frontier lands. He liked its coolness and clarity and saw in it a fish like silver; when it was caught it splashed his chest and clothes and a tremor seized him. The fish was brought to him, but he did not taste it. He asked the name of the place and was told al-Raqqa. His birth horoscope had shown that he would die at al-Raqqa; he recognised it and despaired, saying, 'O You whose dominion does not pass, have mercy on one whose dominion has passed.' It is also said that the letters naming his brother Abu Ishaq as successor were issued by his order, or were written during a faint that overtook him. He died on Thursday, twelve nights before the end of Rajab in 218, was carried to Tarsus and buried there {cite:tarikh-khulafa-minhaj-1434 p. 493-494}."
