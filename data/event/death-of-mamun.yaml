label: { ar: "وفاة المأمون", en: "Death of al-Ma'mun", es: "Muerte de al-Ma'mun", fr: "Mort d'al-Ma'mun", ur: "المامون کی وفات" }
summary:
  ar: "في سنة ثماني عشرة ومائتين توفي المأمون، ونُقل من بلاد الثغر قرب طرطوس إلى طرسوس فدُفن بها {cite:tabari-tarikh-abu-al-fadl j.8 p.646}، وذكر الطبري أن أخاه أبا إسحاق المعتصم صلّى عليه {cite:tabari-tarikh-abu-al-fadl j.8 p.650}، وعند السيوطي نزل على عين البذندون من أدنى الروم فأعجبه بردها وصفاؤها ورأى فيها سمكة كأنها الفضة فاصطيدت فتنضح صدره وثوبه فأخذته رعدة وأتي بالسمكة فما ذاقها ثم سأل عن اسم البقعة فقيل الرقة وكان فيما عمل من مولده أنه يموت بالرقة فعرف وأيس وقال يا من لا يزول ملكه ارحم من قد زال ملكه، وقيل إن الكتب التي نفذت بالنص على أخيه أبي إسحاق وقعت بأمره وقيل كتبت وقت غشي أصابه، ومات يوم الخميس لاثنتي عشرة بقيت من رجب سنة ثمان عشرة ونقل إلى طرسوس فدفن بها {cite:tarikh-khulafa-minhaj-1434 p. 493-494}"
  en: "In 218 al-Ma'mun died. He was carried from the frontier near Tartus to Tarsus and buried there {cite:tabari-tarikh-abu-al-fadl j.8 p.646}; Tabari reports that his brother Abu Ishaq al-Mu'tasim led the prayer over him {cite:tabari-tarikh-abu-al-fadl j.8 p.650}. In al-Suyuti he halted by the spring of al-Bandun in the Byzantine frontier lands. He liked its coolness and clarity and saw in it a fish like silver; when it was caught it splashed his chest and clothes and a tremor seized him. The fish was brought to him, but he did not taste it. He asked the name of the place and was told al-Raqqa. His birth horoscope had shown that he would die at al-Raqqa; he recognised it and despaired, saying, 'O You whose dominion does not pass, have mercy on one whose dominion has passed.' It is also said that the letters naming his brother Abu Ishaq as successor were issued by his order, or were written during a faint that overtook him. He died on Thursday, twelve nights before the end of Rajab in 218, was carried to Tarsus and buried there {cite:tarikh-khulafa-minhaj-1434 p. 493-494}."
  es: "En 218 murió al-Ma'mun. Fue llevado desde la frontera cerca de Tartus a Tarsus y enterrado allí {cite:tabari-tarikh-abu-al-fadl j.8 p.646}; Tabari informa que su hermano Abu Ishaq al-Mu'tasim dirigió la oración por él {cite:tabari-tarikh-abu-al-fadl j.8 p.650}. En al-Suyuti se detuvo junto al manantial de al-Bandun en las tierras fronterizas bizantinas. Le gustó su frescura y claridad y vio en él un pez como de plata; cuando lo atraparon, salpicó su pecho y ropas y un temblor se apoderó de él. Le trajeron el pez, pero no lo probó. Preguntó el nombre del lugar y le dijeron al-Raqqa. Su horóscopo natal había mostrado que moriría en al-Raqqa; Lo reconoció y se desesperó, diciendo: «¡Oh, Tú cuyo dominio no pasa, ten misericordia de aquel cuyo dominio ha pasado!». También se dice que las cartas que nombraban a su hermano Abu Ishaq como sucesor fueron emitidas por orden suya, o escritas durante un desmayo que lo sorprendió. Murió un jueves, doce noches antes del final de Rajab en 218, fue llevado a Tarso y enterrado allí {cite:tarikh-khulafa-minhaj-1434 p. 493-494}."
  fr: "En 218, al-Ma'mun mourut. Son corps fut transporté de la frontière près de Tartous jusqu'à Tarse et y fut enterré (Tabari-tarikh-abu-al-fadl j.8 p.646). Tabari rapporte que son frère Abu Ishaq al-Mu'tasim dirigea la prière funéraire (Tabari-tarikh-abu-al-fadl j.8 p.650). À al-Suyuti, il fit halte à la source d'al-Bandun, aux confins byzantins. Il apprécia sa fraîcheur et sa clarté et y aperçut un poisson argenté. Lorsqu'on le pêcha, l'eau l'éclaboussa la poitrine et les vêtements, et il fut saisi d'un frisson. On lui apporta le poisson, mais il n'y goûta pas. Il demanda le nom du lieu et on lui répondit al-Raqqa. Son horoscope natal indiquait qu'il mourrait à al-Raqqa. Il le reconnut et, désespéré, dit: « Ô Toi dont le règne ne passe pas, aie pitié de celui dont le règne est passé. » On raconte aussi que les lettres désignant son frère Abou Ishaq comme successeur furent émises sur son ordre, ou écrites lors d'un malaise. Il mourut un jeudi, douze nuits avant la fin du mois de Rajab 218, fut transporté à Tarse et y fut enterré (voir Tarikh-Khulafa-Minhaj-1434, p. 493-494)."
  ur: "218ء میں مامون کا انتقال ہوا۔ اسے طرطوس کے قریب سرحد سے ترسس لے جایا گیا اور وہیں دفن کیا گیا طبری روایت کرتا ہے کہ ان کے بھائی ابو اسحاق المعتصم نے ان پر نماز پڑھائی۔ السیوطی میں وہ بازنطینی سرحدی سرزمینوں میں البندون کے موسم بہار سے رک گیا۔ اس کو اس کی ٹھنڈک اور فصاحت پسند آئی اور اس میں چاندی جیسی مچھلی دیکھی۔ جب اسے پکڑا گیا تو اس نے اس کے سینے اور کپڑوں کو چھڑک دیا اور اسے ایک کپکپاہٹ نے پکڑ لیا۔ مچھلی اس کے پاس لائی گئی لیکن اس نے اس کا ذائقہ نہ چکھا۔ اس نے اس جگہ کا نام پوچھا تو اسے الرقہ بتایا گیا۔ اس کی پیدائش کا زائچہ ظاہر کرتا تھا کہ وہ الرقہ میں مرے گا۔ اس نے اسے پہچان لیا اور مایوس ہو کر کہا، 'اے وہ جس کی بادشاہی ختم نہیں ہوتی، اس پر رحم کر جس کی سلطنت گزر گئی۔' یہ بھی کہا جاتا ہے کہ ان کے بھائی ابو اسحاق کو جانشین کے طور پر نامزد کرنے والے خطوط ان کے حکم سے جاری کیے گئے تھے، یا کسی بیہوشی کے دوران لکھے گئے تھے جو ان پر گر پڑے تھے۔ 218 میں رجب کے اختتام سے بارہ راتیں پہلے جمعرات کو آپ کا انتقال ہوا، اسے ترسس لے جایا گیا اور وہاں دفن کیا گیا۔ 493-494}۔"
