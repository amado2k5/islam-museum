label: { ar: "استيلاء السلاجقة على خراسان وهزيمة مسعود الغزنوي", en: "The Seljuk takeover of Khurasan and the defeat of Mas'ud the Ghaznavid" }
summary:
  ar: "في جمادى الآخرة سنة 430هـ ملك سلجوق خراسان والجيل وهرب مسعود بن محمود سبكتكين وأخذوا الدواة، واستولى طغرلبك أبو طالب محمد وأخوه داود وبهرم؟ ونيروز أولاد ميكائيل على البلاد وتقسموا الأطراف. وبحلول سنة 432هـ انصرف مسعود إلى غزنة وعاد طغرلبك إلى نيسابور واستولت الغز على جميع خراسان، وظهر من خرقهم الهيبة وإطراحهم الحشمة وقتلهم الناس ما خرج عن الحد وقصدوا خلقاً كثيراً من الكتاب وغيرهم فقتلوا منهم وصانعوا بعضهم {cite:muntazam-ibn-al-jawzi j.8 p.400, 413}."
  en: "In Jumada II 430 the Seljuks took Khurasan and Jibal, Mas'ud ibn Mahmud ibn Sebuktigin fled, and they took the inkwell. Tughril Beg Abu Talib Muhammad, his brother Dawud, Bahram? and Nayruz, sons of Mika'il, seized the lands and divided the outlying provinces among themselves. By 432 Mas'ud had gone back to Ghazna and Tughril to Nishapur, and the Ghuzz seized all of Khurasan. Their breaches of awe, their casting off of decorum and their killing of people went beyond all bounds: they targeted many scribes and others, killing some and coming to terms with others {cite:muntazam-ibn-al-jawzi j.8 p.400, 413}."
