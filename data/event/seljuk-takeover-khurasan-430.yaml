label: { ar: "استيلاء السلاجقة على خراسان وهزيمة مسعود الغزنوي", en: "The Seljuk takeover of Khurasan and the defeat of Mas'ud the Ghaznavid", es: "La toma de Jorasán por los selyúcidas y la derrota de Mas'ud el gaznávida.", fr: "La conquête du Khorasan par les Seldjoukides et la défaite de Massoud le Ghaznévide", ur: "سلجوک کا خراسان پر قبضہ اور مسعود غزنوی کی شکست", tr: "Selçukluların Horasan'ı fethi ve Gazneli Mes'ud'un yenilgisi", id: "Penaklukan Khorasan oleh Seljuk dan kekalahan Mas'ud dari Ghazni" }
summary:
  ar: "في جمادى الآخرة سنة 430هـ ملك سلجوق خراسان والجيل وهرب مسعود بن محمود سبكتكين وأخذوا الدواة، واستولى طغرلبك أبو طالب محمد وأخوه داود وبهرم؟ ونيروز أولاد ميكائيل على البلاد وتقسموا الأطراف. وبحلول سنة 432هـ انصرف مسعود إلى غزنة وعاد طغرلبك إلى نيسابور واستولت الغز على جميع خراسان، وظهر من خرقهم الهيبة وإطراحهم الحشمة وقتلهم الناس ما خرج عن الحد وقصدوا خلقاً كثيراً من الكتاب وغيرهم فقتلوا منهم وصانعوا بعضهم {cite:muntazam-ibn-al-jawzi j.8 p.400, 413}."
  en: "In Jumada II 430 the Seljuks took Khurasan and Jibal, Mas'ud ibn Mahmud ibn Sebuktigin fled, and they took the inkwell. Tughril Beg Abu Talib Muhammad, his brother Dawud, Bahram? and Nayruz, sons of Mika'il, seized the lands and divided the outlying provinces among themselves. By 432 Mas'ud had gone back to Ghazna and Tughril to Nishapur, and the Ghuzz seized all of Khurasan. Their breaches of awe, their casting off of decorum and their killing of people went beyond all bounds: they targeted many scribes and others, killing some and coming to terms with others {cite:muntazam-ibn-al-jawzi j.8 p.400, 413}."
  es: "En Jumada II 430, los selyúcidas tomaron Jorasán y Jibal. Mas'ud ibn Mahmud ibn Sebuktigin huyó y se apoderaron del tintero. Tughril Beg Abu Talib Muhammad, su hermano Dawud, Bahram? y Nayruz, hijos de Mika'il, se apoderaron de las tierras y se repartieron las provincias periféricas. Para el año 432, Mas'ud había regresado a Ghazna y Tughril a Nishapur, y los Ghuzz se apoderaron de todo Jorasán. Sus transgresiones, su abandono del decoro y sus asesinatos fueron más allá de todos los límites: atacaron a muchos escribas y otras personas, matando a algunos y pactando con otros {cite:muntazam-ibn-al-jawzi j.8 p.400, 413}."
  fr: "En Jumada II 430, les Seldjoukides s'emparèrent du Khorasan et de Jibal. Mas'ud ibn Mahmud ibn Sebuktigin prit la fuite et ils s'emparèrent de l'encrier. Tughril Beg Abu Talib Muhammad, son frère Dawud, Bahram et Nayruz, fils de Mika'il, conquirent les terres et se partagèrent les provinces périphériques. En 432, Mas'ud était retourné à Ghazni et Tughril à Nishapur, tandis que les Ghuzz s'emparaient de tout le Khorasan. Leurs violations des règles de bienséance, leur mépris des convenances et leurs massacres atteignirent des proportions inimaginables: ils prirent pour cible de nombreux scribes et autres personnes, en tuant certains et en négociant avec d'autres (cf. Muntazam ibn al-Jawzi, vol. 8, p. 400, 413)."
  ur: "جمادی الثانی 430 میں سلجوقیوں نے خراسان اور جبل پر قبضہ کر لیا، مسعود بن محمود ابن سیبوکتگین بھاگ گئے، اور انہوں نے انک ویل لے لیا۔ طغرل بیگ ابو طالب محمد، ان کے بھائی داؤد، بہرام؟ اور میکائیل کے بیٹوں نیروز نے زمینوں پر قبضہ کر لیا اور باہر کے صوبوں کو آپس میں بانٹ لیا۔ 432 تک مسعود غزنہ اور طغرل نیشاپور واپس چلے گئے اور غزوہ نے سارے خراسان پر قبضہ کر لیا۔ اُن کی خوف و ہراس، اُن کی عصمت کو ختم کرنا اور اُن کا قتلِ عام ہر حد سے بڑھ گیا: اُنہوں نے بہت سے کاتبوں اور دوسروں کو نشانہ بنایا، بعض کو قتل کر دیا اور دوسروں کے ساتھ معاہدہ کر لیا۔"
  tr: "Hicri 430 yılının Cemâde-i Ahiret ayında Selçuklular Horasan ve Gilan'ı fethettiler. Mes'ud ibn Mahmud Sabuktigin kaçtı ve mürekkep hokkasını ele geçirdiler. Tuğrul Bey, Ebu Talib Muhammed, kardeşi Davud, Bahram ve Mikail'in oğulları Nayruz, toprakların kontrolünü ele geçirdiler ve bölgeleri paylaştılar. Hicri 432 yılına gelindiğinde Mes'ud Gazne'ye gitmiş, Tuğrul Bey ise Nişapur'a dönmüştü. Guzzlar Horasan'ın tamamını ele geçirmişlerdi ve cüretkarlıkları ve ahlak kurallarına saygısızlıkları apaçık ortadaydı. Çok sayıda insanı öldürdüler ve birçok kâtibi ve diğerlerini hedef alarak bazılarını öldürdüler, bazılarını ise bağışladılar. {cite:muntazam-ibn-al-jawzi vol. 8 pp. 400, 413}"
  id: "Pada bulan Jumada al-Akhirah tahun 430 H, Seljuk menaklukkan Khorasan dan Gilan. Mas'ud ibn Mahmud Sabuktigin melarikan diri, dan mereka merebut tempat tinta. Tughril Beg, Abu Talib Muhammad, saudaranya Dawud, Bahram, dan Nayruz, putra-putra Mika'il, menguasai wilayah tersebut dan membagi-bagi daerahnya. Pada tahun 432 H, Mas'ud telah berangkat ke Ghazna, dan Tughril Beg telah kembali ke Nishapur. Ghazna telah merebut seluruh Khorasan, dan keberanian serta pengabaian mereka terhadap kesopanan sangat jelas terlihat. Mereka membunuh banyak orang dan menargetkan banyak juru tulis dan lainnya, membunuh sebagian dan mengampuni sebagian lainnya. {cite:muntazam-ibn-al-jawzi vol. 8 pp. 400, 413}"
