id: event/battle-of-ajnadayn
class: event
kind: battle
label: { ar: "وقعة أجنادين", en: "The Battle of Ajnadayn", fr: "La bataille d'Ajnadayn", es: "La batalla de Ajnadayn", ur: "اجنادین کی جنگ" }
summary:
  ar: "عند البلاذري: ثم كانت وقعة أجنادين — ويقال أجتادين — وشهدها من الروم زهاء مائة ألف، سرّب هرقل أكثرهم وتجمع باقوهم من النواحي وهرقل يومئذ مقيم بحمص، فقاتلهم المسلمون قتالاً شديداً وأبلى خالد بن الوليد يومئذ بلاءً حسناً ثم هزم الله أعداءه ومزقهم كل ممزق وقتل منهم خلق كثير؛ واستشهد يومئذ عبد الله بن الزبير بن عبد المطلب بن هاشم، وعمرو بن سعيد بن العاص بن أمية وأخوه أبان ⁦(وقيل توفي أبان سنة 29)⁩، وطُليب بن عمير بن وهب بن قصي بارزه علج فضربه فأبان يده اليمنى فسقط سيفه مع كفّه ثم غشيه فقتله وأمه أروى بنت المطلب عمة النبي ويكنى أبا عدي، وسلمة بن هشام بن المغيرة ⁦(وقيل قتل بمرج الصفر)⁩، وعكرمة بن أبي جهل بن هشام المخزومي ⁦(وقيل قتل يوم مؤتة)⁩، ونعيم بن عبد الله النحام العدوي ⁦(وقيل قتل يوم اليرموك)⁩، وهشام بن العاص بن وائل السهمي ⁦(وقيل قتل يوم اليرموك)⁩، وعمرو بن الطقيل بن عمرو الدوسي ⁦(وقيل قتل يوم اليرموك)⁩، وجندب بن عمرو الدوسي، وسعيد والحارث والحجاج بنو الحارث بن قيس بن عدي السهمي، وقال هشام بن محمد الكلبي قتل النعام يوم مؤتة وسعيد الحارث يوم اليرموك وتميم بن الحارث يوم أجنادين وأخوه عبيد الله بن عبد الأسد يوم اليرموك، وقتل الحارث بن هشام بن المغيرة يوم أجنادين؛ ولما انتهى خبر الوقعة إلى هرقل نُحب قلبه وسقط في يده ومُلي رعباً فهرب من حمص إلى أنطاكية — وقيل كان هربه عند قدوم المسلمين الشام؛ وكانت يوم الاثنين لاثنتي عشرة ليلة بقيت من جمادى الأولى سنة 13 ويقال لليلتين خلتا من جمادى الآخرة ويقال لليلتين بقيتا منه؛ ثم جمعت الروم جمعاً بالياقوصة — وهي وادٍ فمه الفوّارة — فلقيهم المسلمون فكشفوهم وهزموهم وقتلوا كثيراً ولحق فلّهم بمدن الشام، وتوفي أبو بكر في جمادى الآخرة سنة 13 فأتت المسلمين نعيته وهم بالياقوصة."
  en: "In al-Baladhuri: then came the battle of Ajnadayn — also Ajtadayn — attended by near a hundred thousand Romans, Heraclius chaining most of them and their bravest gathering from the districts, Heraclius then residing at Hims; the Muslims fought them fiercely, Khalid ibn al-Walid showing fine valour that day, then God defeated His enemies and scattered them utterly, killing many; martyred that day were Abdullah ibn al-Zubayr ibn Abd al-Muttalib ibn Hashim, Amr ibn Sa'id ibn al-As ibn Umayya and his brother Aban (some say Aban died in year 29), Tulayb ibn Umayr ibn Wahb ibn Qusayy — a Byzantine champion challenged him and severed his right hand so his sword fell with his palm, then covered and killed him, his mother Arwa bint al-Muttalib the Prophet's aunt, his kunya Abu Adi — Salama ibn Hisham ibn al-Mughira (some say he fell at Marj al-Suffar), Ikrama ibn Abi Jahl ibn Hisham al-Makhzumi (some say at Mu'ta), Nu'aym ibn Abdullah al-Nahham al-Adawi (some say at the Yarmuk), Hisham ibn al-As ibn Wa'il al-Sahmi (some say at the Yarmuk), Amr ibn al-Tuqayl ibn Amr al-Dawsi (some say at the Yarmuk), Jundub ibn Amr al-Dawsi, and Sa'id, al-Harith and al-Hajjaj sons of al-Harith ibn Qays ibn Adi al-Sahmi — Hisham ibn Muhammad al-Kalbi placing al-Na'am at Mu'ta, Sa'id at the Yarmuk, Tamim at Ajnadayn and his brother Ubaydullah ibn Abd al-Asad at the Yarmuk — and al-Harith ibn Hisham ibn al-Mughira fell at Ajnadayn; when the report reached Heraclius his heart sank, his hand failed and he was filled with terror, fleeing from Hims to Antioch — some say his flight came at the Muslims' very arrival in Syria; the battle fell on Monday twelve nights remaining of Jumada I year 13 — some say two nights into Jumada II, some say two remaining of it; the Romans then massed at al-Yaqusa — a valley whose mouth is al-Fawwara — where the Muslims met, exposed and routed them killing many, their remnant reaching Syria's towns; Abu Bakr died in Jumada II year 13, his obituary reaching the Muslims at al-Yaqusa."
  fr: "Chez al-Baladhuri : vint ensuite la bataille d'Ajnadayn, dite aussi Ajtadayn, à laquelle assistèrent près de cent mille Romains, Héraclius ayant enchaîné la plupart d'entre eux et leurs plus braves s'étant rassemblés depuis les districts, Héraclius résidant alors à Hims ; les musulmans les combattirent âprement, Khalid ibn al-Walid montrant ce jour-là une belle vaillance, puis Dieu vainquit Ses ennemis et les dispersa entièrement, en tuant beaucoup ; tombèrent en martyrs ce jour-là Abdullah ibn al-Zubayr ibn Abd al-Muttalib ibn Hashim, Amr ibn Sa'id ibn al-As ibn Umayya et son frère Aban (certains disent qu'Aban mourut en l'an 29), Tulayb ibn Umayr ibn Wahb ibn Qusayy (un champion byzantin le défia et lui trancha la main droite, si bien que son sabre tomba avec sa paume, puis le couvrit et le tua ; sa mère était Arwa bint al-Muttalib, tante du Prophète, et sa kunya Abu Adi), Salama ibn Hisham ibn al-Mughira (certains disent qu'il tomba à Marj al-Suffar), Ikrima ibn Abi Jahl ibn Hisham al-Makhzumi (certains disent à Mu'ta), Nu'aym ibn Abdullah al-Nahham al-Adawi (certains disent au Yarmouk), Hisham ibn al-As ibn Wa'il al-Sahmi (certains disent au Yarmouk), Amr ibn al-Tuqayl ibn Amr al-Dawsi (certains disent au Yarmouk), Jundub ibn Amr al-Dawsi, et Sa'id, al-Harith et al-Hajjaj, fils d'al-Harith ibn Qays ibn Adi al-Sahmi, Hisham ibn Muhammad al-Kalbi plaçant al-Na'am à Mu'ta, Sa'id au Yarmouk, Tamim à Ajnadayn et son frère Ubaydullah ibn Abd al-Asad au Yarmouk ; et al-Harith ibn Hisham ibn al-Mughira tomba à Ajnadayn ; quand la nouvelle parvint à Héraclius, son cœur défaillit, sa main faiblit et il fut rempli d'effroi, fuyant de Hims vers Antioche (certains disent que sa fuite eut lieu dès l'arrivée des musulmans en Syrie) ; la bataille eut lieu un lundi, douze nuits avant la fin de Jumada I de l'an 13 (certains disent deux nuits après le début de Jumada II, d'autres deux nuits avant sa fin) ; les Romains se massèrent ensuite à al-Yaqusa, une vallée dont l'embouchure est al-Fawwara, où les musulmans les rencontrèrent, les mirent à découvert et les mirent en déroute en en tuant beaucoup, leur reste gagnant les villes de Syrie ; Abu Bakr mourut en Jumada II de l'an 13, et la nouvelle de sa mort parvint aux musulmans à al-Yaqusa."
  es: "En al-Baladhuri: luego vino la batalla de Ajnadayn — también Ajtadayn — a la que asistieron cerca de cien mil romanos, Heraclio encadenó a la mayoría de ellos y a sus más valientes reunidos de los distritos, Heraclio residía entonces en Hims; los musulmanes lucharon ferozmente contra ellos, Khalid ibn al-Walid mostró gran valor ese día, entonces Dios derrotó a Sus enemigos y los dispersó por completo, matando a muchos; Martirizados ese día fueron Abdullah ibn al-Zubayr ibn Abd al-Muttalib ibn Hashim, Amr ibn Sa'id ibn al-As ibn Umayya y su hermano Aban (algunos dicen que Aban murió en el año 29), Tulayb ibn Umayr ibn Wahb ibn Qusayy —un campeón bizantino lo desafió y le cortó la mano derecha de modo que su espada cayó con la palma, luego lo cubrió y lo mató, su madre Arwa bint al-Muttalib la tía del Profeta, su kunya Abu Adi — Salama ibn Hisham ibn al-Mughira (algunos dicen que cayó en Marj al-Suffar), Ikrama ibn Abi Jahl ibn Hisham al-Makhzumi (algunos dicen que en Mu'ta), Nu'aym ibn Abdullah al-Nahham al-Adawi (algunos dicen que en Yarmuk), Hisham ibn al-As ibn Wa'il al-Sahmi (algunos dicen que en el Yarmuk), Amr ibn al-Tuqayl ibn Amr al-Dawsi (algunos dicen que en el Yarmuk), Jundub ibn Amr al-Dawsi y Sa'id, al-Harith y al-Hajjaj hijos de al-Harith ibn Qays ibn Adi al-Sahmi — Hisham ibn Muhammad al-Kalbi colocando a al-Na'am en Mu'ta, Sa'id en el Yarmuk, Tamim en Ajnadayn y su hermano Ubaydullah ibn Abd al-Asad en el Yarmuk — y al-Harith ibn Hisham ibn al-Mughira cayó en Ajnadayn; cuando el informe llegó a Heraclio, su corazón se hundió, su mano falló y se llenó de terror, huyendo de Hims a Antioquía — algunos dicen que su huida se produjo con la llegada misma de los musulmanes a Siria; La batalla tuvo lugar el lunes, doce noches antes de que terminara el año 13 de Jumada I —algunos dicen que dos noches después del inicio de Jumada II, otros que dos noches antes de que terminara—; los romanos se concentraron entonces en al-Yaqusa —un valle cuya desembocadura es al-Fawwara— donde los musulmanes los encontraron, los expusieron y los derrotaron, matando a muchos, y los supervivientes llegaron a las ciudades de Siria; Abu Bakr murió en el año 13 de Jumada II, y su obituario llegó a oídos de los musulmanes en al-Yaqusa."
  ur: "البلادھوری میں ہے: پھر اجنادین کی جنگ آئی - اجتہادین بھی - جس میں تقریباً ایک لاکھ رومیوں نے شرکت کی، ہرقلس نے ان میں سے بیشتر کو جکڑ رکھا تھا اور اضلاع سے ان کا سب سے بہادر اجتماع، ہیراکلئس پھر ہیمس میں مقیم تھا۔ مسلمانوں نے ان کا زبردست مقابلہ کیا، خالد بن ولید نے اس دن شاندار بہادری کا مظاہرہ کیا، پھر اللہ تعالیٰ نے اپنے دشمنوں کو شکست دی اور انہیں مکمل طور پر تتر بتر کر دیا، بہت سے لوگ مارے گئے۔ اس دن شہید ہونے والے عبداللہ بن الزبیر بن عبدالمطلب بن ہاشم، عمرو بن سعید بن العاص بن امیہ اور ان کے بھائی ابان ⁦(کچھ کہتے ہیں کہ ابان کا انتقال 29 میں ہوا)⁩، طلیب بن عمیر بن وھب ابن قصی نے سخت الفاظ میں اس کے دائیں ہاتھ سے للکارا۔ اپنی ہتھیلی سے ڈھانپ کر اس کو قتل کیا، ان کی والدہ عروہ بنت المطلب رسول اللہ کی پھوپھی، ان کی کنیت ابو عدی - سلمہ بن ہشام بن المغیرہ ⁦(کچھ کہتے ہیں کہ وہ مرج الصفر میں گرے)⁩، عکرمہ بن ابی جہل ابن ہشام المخزومی ⁦(بعض النحمۃ المطابع)⁩ کہتے ہیں۔ ⁦(بعض کہتے ہیں یرموک میں)⁩، ہشام بن العاص بن وائل السحمی ⁦(بعض کہتے ہیں یرموک میں)⁩، عمرو بن التقیل بن عمرو الدوسی ⁦(بعض کہتے ہیں یرموک میں)⁩، جندب بن عمرو الدوسی، اور سعید، الحارثین بن الحارثین اور الحیثین۔ عدی السہمی - ہشام بن محمد الکلبی نے النعم کو موتہ میں، سعید کو یرموک میں، تمیم کو اجنادین میں اور اس کے بھائی عبید اللہ ابن عبد الاسد کو یرموک میں - اور الحارث ابن ہشام ابن المغیرہ اجنادی میں گرے؛ جب یہ اطلاع ہرقل تک پہنچی تو اس کا دل ڈوب گیا، اس کا ہاتھ ناکام ہوگیا اور وہ دہشت سے بھر گیا، ہمس سے انطاکیہ کی طرف بھاگا - بعض کہتے ہیں کہ اس کی پرواز مسلمانوں کے شام پہنچنے پر ہوئی تھی۔ جنگ سوموار کو ہوئی 12 جمادی الاول کی 13 راتیں باقی تھیں - کچھ کہتے ہیں جمادہ دوم میں دو راتیں، کچھ کہتے ہیں اس کی دو راتیں باقی تھیں۔ اس کے بعد رومیوں نے ال یاقوسہ پر جمع کیا - ایک وادی جس کا منہ الفوارہ ہے - جہاں مسلمانوں نے ملاقات کی، بے نقاب کیا اور انہیں بے نقاب کیا اور بہت سے لوگوں کو مار ڈالا، ان کے بقیہ شام کے قصبوں تک پہنچ گئے۔ ابوبکر کا انتقال جمادی الثانی 13 ہجری میں ہوا، ان کا وصال یعقوس میں مسلمانوں تک پہنچا۔"
