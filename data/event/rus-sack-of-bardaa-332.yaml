label: { ar: "ملك الروس مدينة بردعة", en: "The Rus seize the city of Barda'a", ur: "روس کا شہر بردعہ پر قبضہ", es: "Los rusos se apoderan de la ciudad de Barda'a.", fr: "Les Rus s'emparent de la ville de Barda'a", tr: "Rusların kralı, Barda şehri", id: "Raja Rusia, kota Barda" }
summary:
  ar: "في سنة 332هـ خرجت طائفة من الروس في البحر فركبوا نهر الكر إلى بردعة فانهزم نائب المرزبان في جمع من الديلم والمطوعة يربو على خمسة آلاف ودخلوا البلد ونادوا بالأمان وأحسنوا السيرة وكانوا ينهون العامة عن الرعب بهم، ثم لما طال عليهم الأمر نادى مناديهم بخروج أهل البلد في ثلاثة أيام فبقي أكثرهم فوضعوا فيهم السلاح وقتلوا خلقاً كثيراً وأسروا بعد القتل بضعة عشر ألف نفس وجمعوا من بقي بالجامع وقالوا اشتروا أنفسكم فسعى لهم إنسان نصراني فقرروا عن كل رجل عشرين درهماً فلما لم يحصل لهم شيء قتلوهم عن آخرهم وغنموا الأموال واستعبدوا السبي واختاروا من النساء من استحسنوهن، وأكثروا من أكل الفواكه فأصابهم الوباء وكثرت الأمراض والموت فيهم فأعمل المرزبان الحيلة فكمن لهم كميناً وتطارد لهم حتى جازوه فقتل منهم قتلاً كثيراً منهم أميرهم وحاصر الباقين في حصن شهرستان {cite:kamil-ibn-al-athir p. 308-310}."
  en: "In 332 a Rus fleet came up the Kur river to Barda'a, routed the garrison, proclaimed security, then trapped the townsmen who stayed past the three-day deadline — some fifteen thousand captives, the survivors penned in the mosque and slaughtered when a twenty-dirham ransom failed. Fruit-gluttony brought them plague, and Marzuban's ambush destroyed their prince and penned the rest in the citadel {cite:kamil-ibn-al-athir p. 308-310}."
  es: "En el año 332, una flota rusa remontó el río Kur hasta Barda'a, derrotó a la guarnición, proclamó la seguridad y luego atrapó a los habitantes que permanecieron allí más allá del plazo de tres días: unos quince mil cautivos. Los supervivientes fueron encerrados en la mezquita y masacrados cuando fracasó el rescate de veinte dirhams. La glotonería les trajo la peste, y la emboscada de Marzuban acabó con la vida de su príncipe y confinó al resto en la ciudadela {cite:kamil-ibn-al-athir p. 308-310}."
  fr: "En 332, une flotte russe remonta le fleuve Kour jusqu'à Barda'a, mit en déroute la garnison, proclama la sécurité, puis piégea les habitants restés au-delà du délai de trois jours – environ quinze mille captifs. Les survivants furent enfermés dans la mosquée et massacrés après l'échec du versement d'une rançon de vingt dirhams. La gourmandise excessive leur apporta la peste, et l'embuscade de Marzuban décima leur prince et confina les autres dans la citadelle (voir Kamil ibn al-Athir, p. 308-310)."
  ur: "332 میں روس کا ایک بحری بیڑہ دریائے کر پر بردعہ آیا، گیریژن کو روٹ دیا، سیکورٹی کا اعلان کیا، پھر تین دن کی ڈیڈ لائن سے گزرنے والے قصبوں کو پھنسایا - تقریباً پندرہ ہزار قیدی، زندہ بچ جانے والوں نے مسجد میں لکھا اور بیس درہم کے تاوان کی ناکامی پر ذبح کیا۔ پھلوں کی لالچ ان کے لیے طاعون لے آئی، اور مرزوبان کی گھات نے ان کے شہزادے کو تباہ کر دیا اور باقیوں کو قلعہ میں لکھا۔ 308-310}۔"
  tr: "Hicri 332 yılında, bir grup Rus deniz yoluyla yola çıktı ve Kar Nehri'nden Bardaa'ya doğru ilerledi. Marzban'ın vekili, beş binden fazla Daylamlı ve gönüllüden oluşan bir kuvvetle birlikte yenilgiye uğratıldı. Şehre girdiler, güvenli bir ortam ilan ettiler ve halkın onlardan korkmasını yasaklayarak iyi davrandılar. Ancak yönetimleri uzadıkça, habercileri şehir sakinlerinin üç gün içinde şehri terk etmelerini istedi. Çoğu kaldı, bu yüzden onları silahlandırdılar, birçoğunu öldürdüler ve birkaç binini esir aldılar. Katliamdan sonra, kalanları camide topladılar ve \"Kendinizi satın alın\" dediler. Bir Hristiyan onları ikna etmeye çalıştı ve her adam için yirmi dirhem fiyat belirlediler. Hiçbir şey alamayınca, hepsini öldürdüler, mallarına el koydular, esirleri köleleştirdiler ve beğendikleri kadınları seçtiler. Çok fazla meyve yediler, bu yüzden aralarında bir veba salgını baş gösterdi ve hastalıklar ve ölümler yaygınlaştı. Marzban bir hileye başvurdu, onlara pusu kurdu ve topraklarından geçene kadar onları takip etti. Liderleri de dahil olmak üzere birçoğunu öldürdü ve geri kalanları Şahristan kalesinde kuşattı. (308-310)"
  id: "Pada tahun 332 H, sekelompok orang Rusia berangkat melalui laut dan berlayar menyusuri Sungai Kar menuju Bardaa. Wakil Marzban dikalahkan bersama pasukan Daylam dan sukarelawan yang berjumlah lebih dari lima ribu orang. Mereka memasuki kota dan menyatakan keamanan serta berperilaku baik, melarang rakyat jelata untuk takut kepada mereka. Kemudian, ketika kekuasaan mereka berlarut-larut, utusan mereka menyerukan penduduk kota untuk pergi dalam waktu tiga hari. Sebagian besar dari mereka tetap tinggal, sehingga mereka mempersenjatai mereka, membunuh banyak orang dan menawan beberapa ribu orang. Setelah pembunuhan itu, mereka mengumpulkan orang-orang yang tersisa di masjid dan berkata, \"Belilah diri kalian sendiri.\" Seorang pria Kristen mencoba membujuk mereka, dan mereka menetapkan harga dua puluh dirham untuk setiap orang. Ketika mereka tidak menerima apa pun, mereka membunuh mereka semua, merampas harta benda, memperbudak para tawanan, dan memilih wanita yang mereka sukai. Mereka makan banyak buah, sehingga wabah penyakit menyerang mereka, dan penyakit serta kematian menjadi meluas di antara mereka. Marzban menggunakan tipu daya, menyergap mereka dan mengejar mereka sampai mereka melewati wilayahnya. Dia membunuh banyak dari mereka, termasuk pemimpin mereka, dan mengepung sisanya di benteng Shahristan. 308-310}."
