label: { ar: "ملك الروس مدينة بردعة" }
summary:
  ar: "في سنة 332هـ خرجت طائفة من الروس في البحر فركبوا نهر الكر إلى بردعة فانهزم نائب المرزبان في جمع من الديلم والمطوعة يربو على خمسة آلاف ودخلوا البلد ونادوا بالأمان وأحسنوا السيرة وكانوا ينهون العامة عن الرعب بهم، ثم لما طال عليهم الأمر نادى مناديهم بخروج أهل البلد في ثلاثة أيام فبقي أكثرهم فوضعوا فيهم السلاح وقتلوا خلقاً كثيراً وأسروا بعد القتل بضعة عشر ألف نفس وجمعوا من بقي بالجامع وقالوا اشتروا أنفسكم فسعى لهم إنسان نصراني فقرروا عن كل رجل عشرين درهماً فلما لم يحصل لهم شيء قتلوهم عن آخرهم وغنموا الأموال واستعبدوا السبي واختاروا من النساء من استحسنوهن، وأكثروا من أكل الفواكه فأصابهم الوباء وكثرت الأمراض والموت فيهم فأعمل المرزبان الحيلة فكمن لهم كميناً وتطارد لهم حتى جازوه فقتل منهم قتلاً كثيراً منهم أميرهم وحاصر الباقين في حصن شهرستان {cite:kamil-ibn-al-athir p. 308-310}."
  en: "In 332 a Rus fleet came up the Kur river to Barda'a, routed the garrison, proclaimed security, then trapped the townsmen who stayed past the three-day deadline — some fifteen thousand captives, the survivors penned in the mosque and slaughtered when a twenty-dirham ransom failed. Fruit-gluttony brought them plague, and Marzuban's ambush destroyed their prince and penned the rest in the citadel {cite:kamil-ibn-al-athir p. 308-310}."
