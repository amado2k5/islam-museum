id: event/al-hadi-army-drives-banu-al-harith-to-the-peaks-295
class: event
kind: other
label:
  ar: "جيش الهادي يطرد بني الحارث إلى رؤوس الجبال ويغنم أموالهم، سنة 295هـ، ص355"
  en: "Al-Hadi's army drives Banu al-Harith to the mountain peaks and takes their herds, 295 AH, p. 355"
  ur: "ہادی کے لشکر کا بنو حارث کو پہاڑوں کی چوٹیوں تک دھکیلنا اور ان کے مویشی لینا، 295ھ، ص355"
  es: "El ejército de Al-Hadi expulsa a los Banu al-Harith hacia las cumbres de las montañas y se apodera de sus rebaños, 295 AH, pág. 355."
summary:
  ar: "أحاط الهادي بالجبل، فطرد أخوه عبد الله بن الحسين قوماً من صرمهم، وغنم العسكر منازلهم ومواشيهم. ثم أغار القلب الخولاني على نعم بني الحارث، فطردت بنو الحارث إلى رؤوس الجبال، وتركت منازلها وأموالها."
  en: "Al-Hadi closed in on the mountain. His brother Abdallah ibn al-Husayn drove a clan from its camp, and the army took the dwellings and herds. The Khawlani division then raided Banu al-Harith's herds, and Banu al-Harith fled to the mountain peaks, leaving their homes and property."
  ur: "ہادی نے پہاڑ کو گھیر لیا۔ ان کے بھائی عبداللہ بن حسین نے ایک قوم کے ڈیرے سے انہیں نکالا، اور لشکر نے ٹھکانے اور مویشی لے لیے۔ پھر خولانی دستے نے بنو حارث کے مویشیوں پر چھاپہ مارا، اور بنو حارث پہاڑوں کی چوٹیوں کی طرف بھاگ گئے اور اپنے گھر اور مال چھوڑ گئے۔"
  es: "Al-Hadi se acercó a la montaña. Su hermano Abdallah ibn al-Husayn expulsó a un clan de su campamento, y el ejército se apoderó de las viviendas y los rebaños. La división Khawlani asaltó entonces los rebaños de Banu al-Harith, y estos huyeron a las cumbres de la montaña, abandonando sus hogares y propiedades."
