label: { ar: "حصار فيينا الثاني", en: "Second Siege of Vienna", es: "Segundo asedio de Viena", fr: "Second siège de Vienne", ur: "ویانا کا دوسرا محاصرہ", tr: "Viyana'nın İkinci Kuşatması", id: "Pengepungan Wina Kedua" }
summary:
  ar: "بطاقة أولية لحصار فيينا الثاني سنة ١٦٨٣م، حين حاصر الصدر الأعظم قرة مصطفى باشا بجيش عثماني العاصمة الهابسبورغية فهُزم أمام الجيش البولندي-الإمبراطوري بقيادة يان سوبيسكي في كهلنبرغ وبدأ بعدها تراجع العثمانيين في أوروبا الوسطى؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the second siege of Vienna in 1683, when Kara Mustafa Pasha's Ottoman army besieged the Habsburg capital and was defeated by the Polish-Imperial relief under John Sobieski at Kahlenberg, opening the long Ottoman retreat from Central Europe; sources not yet checked on the page."
  es: "Boceto para el segundo asedio de Viena en 1683, cuando el ejército otomano de Kara Mustafa Pasha sitió la capital de los Habsburgo y fue derrotado por el refuerzo polaco-imperial al mando de Juan Sobieski en Kahlenberg, lo que dio inicio a la larga retirada otomana de Europa Central; las fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour le second siège de Vienne en 1683, lorsque l'armée ottomane de Kara Mustafa Pacha assiégea la capitale des Habsbourg et fut vaincue par les secours polono-impériaux de John Sobieski à Kahlenberg, ouvrant la longue retraite ottomane d'Europe centrale; sources non encore vérifiées sur la page."
  ur: "1683 میں ویانا کے دوسرے محاصرے کے لیے ڈرافٹ کارڈ، جب کارا مصطفی پاشا کی عثمانی فوج نے ہیبسبرگ کے دارالحکومت کا محاصرہ کیا اور کاہلنبرگ میں جان سوبیسکی کی قیادت میں پولش-امپیریل ریلیف کے ہاتھوں شکست ہوئی، وسطی یورپ سے عثمانیوں کی طویل پسپائی کا آغاز ہوا۔ ذرائع ابھی تک صفحہ پر چیک نہیں ہوئے ہیں۔"
  tr: "1683 yılında gerçekleşen İkinci Viyana Kuşatması'na dair ön bir anlatım; bu kuşatmada Sadrazam Kara Mustafa Paşa, Osmanlı ordusuyla Habsburg başkentini kuşatmış ve Kehlenberg'de Jan Sobieski komutasındaki Polonya-İmparatorluk ordusu tarafından yenilgiye uğratılmış, ardından Osmanlılar Orta Avrupa'da geri çekilmeye başlamıştır; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Pengepungan Wina Kedua pada tahun 1683 M, ketika Wazir Agung Kara Mustafa Pasha mengepung ibu kota Habsburg dengan pasukan Ottoman dan dikalahkan oleh pasukan Kekaisaran Polandia yang dipimpin oleh Jan Sobieski di Kehlenberg, setelah itu pasukan Ottoman mulai mundur di Eropa Tengah; sumber-sumber di halaman ini belum ditinjau."
