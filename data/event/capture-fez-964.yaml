id: event/capture-fez-964
class: event
kind: conquest
label: { ar: "دخول العثمانيين فاس ⁦(٩٦٤هـ/١٥٥٤م)⁩", en: "Ottoman entry into Fez (964/1554)", fr: "L'entrée ottomane à Fès (964/1554)", es: "Entrada otomana en Fez (964/1554)", ur: "فیز میں عثمانی داخلہ (964/1554)" }
summary:
  ar: "بعد هزيمة القوات السعدية قرب بادس وسقوط تازة ومعركة كدية المخالى في ساحة فاس، تقدمت القوات العثمانية ومعها أبو حسون الوطاسي فدخلت فاس في ٣ صفر ٩٦١هـ/٨ يناير ١٥٥٤م ⁦(النص المطبوع «٩٦٤هـ»)⁩؛ وخطب الإمام للسلطان العثماني وأعلن الباب العالي ضم المغرب إلى الدولة العثمانية. مكث صالح رايس فيها أربعة أشهر قبل أن تعود فاس للسعديين لاحقاً {cite:dawlat-uthmaniyya-salabi p. 238-241}."
  en: "After the Sa'di defeat near Badis, the fall of Taza, and the battle of Kadiyat al-Makhali before Fez, the Ottoman forces with Bu Hasun entered Fez on 3 Safar 961/8 January 1554 (the printed text reads 964); the imam preached in the Ottoman sultan's name and the Porte declared Morocco annexed. Salih Reis stayed four months before Fez later returned to the Sa'dis {cite:dawlat-uthmaniyya-salabi p. 238-241}."
  fr: "Après la défaite saadienne près de Badis, la chute de Taza et la bataille de Kadiyat al-Makhali devant Fès, les forces ottomanes, avec Bu Hasun, entrèrent à Fès le 3 Safar 961/8 janvier 1554 (le texte imprimé porte 964) ; l'imam prêcha au nom du sultan ottoman et la Porte déclara le Maroc annexé. Salih Reis resta quatre mois avant que Fès ne revienne plus tard aux Saadiens {cite:dawlat-uthmaniyya-salabi p. 238-241}."
  es: "Tras la derrota de los Sa'díes cerca de Badis, la caída de Taza y la batalla de Kadiyat al-Makhali, frente a Fez, las fuerzas otomanas, al mando de Bu Hasun, entraron en Fez el 3 de Safar de 961/8 de enero de 1554 (el texto impreso indica 964); el imán predicó en nombre del sultán otomano y la Sublime Puerta declaró la anexión de Marruecos. Salih Reis permaneció allí cuatro meses antes de que Fez volviera a manos de los Sa'díes {cite:dawlat-uthmaniyya-salabi p. 238-241}."
  ur: "بادیس کے قریب سعدی کی شکست، تعزیہ کے زوال، اور فیز سے پہلے کدیات المخلی کی لڑائی کے بعد، عثمانی فوجیں بو حسن کے ساتھ 3 صفر 961/8 جنوری 1554 کو فیز میں داخل ہوئیں ⁦(مطبوعہ متن 964 ہے)⁩؛ امام نے عثمانی سلطان کے نام کی تبلیغ کی اور پورٹی نے مراکش کو الحاق کا اعلان کیا۔ صالح رئیس چار ماہ ٹھہرے اس سے پہلے کہ فیض بعد میں سعدیوں میں واپس آئے۔ 238-241}۔"
