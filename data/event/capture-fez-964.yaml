label: { ar: "دخول العثمانيين فاس (٩٦٤هـ/١٥٥٤م)", en: "Ottoman entry into Fez (964/1554)" }
summary:
  ar: "بعد هزيمة القوات السعدية قرب بادس وسقوط تازة ومعركة كدية المخالى في ساحة فاس، تقدمت القوات العثمانية ومعها أبو حسون الوطاسي فدخلت فاس في ٣ صفر ٩٦١هـ/٨ يناير ١٥٥٤م (النص المطبوع «٩٦٤هـ»)؛ وخطب الإمام للسلطان العثماني وأعلن الباب العالي ضم المغرب إلى الدولة العثمانية. مكث صالح رايس فيها أربعة أشهر قبل أن تعود فاس للسعديين لاحقاً {cite:dawlat-uthmaniyya-salabi p. 238-241}."
  en: "After the Sa'di defeat near Badis, the fall of Taza, and the battle of Kadiyat al-Makhali before Fez, the Ottoman forces with Bu Hasun entered Fez on 3 Safar 961/8 January 1554 (the printed text reads 964); the imam preached in the Ottoman sultan's name and the Porte declared Morocco annexed. Salih Reis stayed four months before Fez later returned to the Sa'dis {cite:dawlat-uthmaniyya-salabi p. 238-241}."
