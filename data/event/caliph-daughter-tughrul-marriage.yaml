id: event/caliph-daughter-tughrul-marriage
class: event
kind: other
label: { ar: "تزويج بنت الخليفة لطغرل بك", en: "Marriage of the caliph's daughter to Tughrul Beg", fr: "Le mariage de la fille du calife avec Tughrul Beg", es: "Matrimonio de la hija del califa con Tughrul Beg" }
summary:
  ar: "في سنة أربع وخمسين زوج القائم بنته لطغرل بك بعد أن دافع بكل ممكن وانزعج واستعفى ثم لان لذلك برغم منه وهذا أمر لم ينله أحد من ملوك بني بويه مع قهرهم للخلفاء وتحكمهم فيهم، ثم قدم طغرل بك في سنة خمس فدخل بابنة الخليفة وأعاد المواريث والمكوس وضمن بغداد بمئة وخمسين ألف دينار ثم رجع إلى الري فمات بها في رمضان {cite:tarikh-khulafa-minhaj-1434 p. 645}."
  en: "In 454 al-Qa'im gave his daughter to Tughrul Beg after resisting every way, shaken and begging release — an honour no Buyid king ever won for all their coercion. Tughrul came in 455, entered with the caliph's daughter, restored the inheritances and the makus, farmed Baghdad for a hundred and fifty thousand dinars, and died at Rayy in Ramadan {cite:tarikh-khulafa-minhaj-1434 p. 645}."
  fr: "En 454, al-Qa'im donna sa fille à Tughrul Beg après avoir résisté par tous les moyens, ébranlé et suppliant d'en être dispensé : un honneur qu'aucun roi bouyide n'obtint jamais malgré toutes leurs contraintes. Tughrul vint en 455, consomma le mariage avec la fille du calife, rétablit les héritages et les mukus, afferma Bagdad pour cent cinquante mille dinars, et mourut à Rayy en Ramadan {cite:tarikh-khulafa-minhaj-1434 p. 645}."
  es: "En 454, al-Qa'im entregó a su hija a Tughrul Beg tras resistirse por todos los medios, conmocionado y suplicando su liberación; un honor que ningún rey buyí jamás obtuvo a pesar de toda su coacción. Tughrul llegó en 455, entró con la hija del califa, restituyó las herencias y el makus, cultivó Bagdad por ciento cincuenta mil dinares y murió en Rayy durante el Ramadán {cite:tarikh-khulafa-minhaj-1434 p. 645}."
