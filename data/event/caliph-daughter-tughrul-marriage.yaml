label: { ar: "تزويج بنت الخليفة لطغرل بك" }
summary:
  ar: "في سنة أربع وخمسين زوج القائم بنته لطغرل بك بعد أن دافع بكل ممكن وانزعج واستعفى ثم لان لذلك برغم منه وهذا أمر لم ينله أحد من ملوك بني بويه مع قهرهم للخلفاء وتحكمهم فيهم، ثم قدم طغرل بك في سنة خمس فدخل بابنة الخليفة وأعاد المواريث والمكوس وضمن بغداد بمئة وخمسين ألف دينار ثم رجع إلى الري فمات بها في رمضان {cite:tarikh-khulafa-minhaj-1434 p. 645}."
  en: "In 454 al-Qa'im gave his daughter to Tughrul Beg after resisting every way, shaken and begging release — an honour no Buyid king ever won for all their coercion. Tughrul came in 455, entered with the caliph's daughter, restored the inheritances and the makus, farmed Baghdad for a hundred and fifty thousand dinars, and died at Rayy in Ramadan {cite:tarikh-khulafa-minhaj-1434 p. 645}."
