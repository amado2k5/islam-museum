id: event/sayabija-treasury-killing
class: event
kind: other
label: { ar: "قتل السيايجة حراس بيت المال", en: "Killing of the Sayabija Treasury Guards", es: "Asesinato de los guardias del tesoro de Sayabija", fr: "Assassinat des gardes du trésor de Sayabija", ur: "سیابیجا ٹریژری گارڈز کا قتل", tr: "Seyyidja, hazine muhafızlarını öldürdü.", id: "Sayyidja membunuh para penjaga perbendaharaan." }
summary:
  ar: "كانت جماعة من السيايجة موكلين ببيت مال البصرة يقال أربعون ويقال أربعمائة فلما قدم طلحة بن عبيد الله والزبير بن العوام البصرة وعليها من قبل علي بن أبي طالب عثمان بن حنيف الأنصاري أبوا أن يسلموا بيت المال إلى قدوم علي فأتوهم في السحر فقتلوهم وكان عبد الله بن الزبير المتولي لأمرهم في جماعة تسرعوا إليهم معه وكان على السيايجة يومئذ أبو سلمة الزطي وكان رجلاً صالحاً."
  en: "A body of Sayabija — forty or four hundred — stood watch over Basra's treasury; when Talha and al-Zubayr came to Basra, held for Ali by Uthman ibn Hunayf, they refused to surrender the treasury till Ali's arrival — so they were fallen upon at dawn and killed, Abdallah ibn al-Zubayr leading that party; over the Sayabija then was Abu Salama al-Zutti, a righteous man."
  es: "Un grupo de Sayabija —cuarenta o cuatrocientos— custodiaba el tesoro de Basora; cuando Talha y al-Zubayr llegaron a Basora, reservada para Ali por Uthman ibn Hunayf, se negaron a entregar el tesoro hasta la llegada de Ali, por lo que fueron atacados al amanecer y asesinados, con Abdallah ibn al-Zubayr al frente de aquel grupo; al frente de los Sayabija estaba entonces Abu Salama al-Zutti, un hombre justo."
  fr: "Un corps de Sayabija — quarante ou quatre cents — gardait le trésor de Bassora; lorsque Talha et al-Zubayr arrivèrent à Bassora, tenus pour Ali par Uthman ibn Hunayf, ils refusèrent de rendre le trésor jusqu'à l'arrivée d'Ali — ils furent donc attaqués à l'aube et tués, Abdallah ibn al-Zubayr menant ce groupe; à ce moment-là, Abu Salama al-Zutti, un homme juste, était à la tête des Sayabija."
  ur: "سیابیجہ کا ایک جسم - چالیس یا چار سو - بصرہ کے خزانے پر نظر رکھے ہوئے تھے۔ جب طلحہ اور الزبیر بصرہ پہنچے، جسے عثمان بن حنیف نے علی کے پاس رکھا تھا، تو انہوں نے علی کے آنے تک خزانے کو حوالے کرنے سے انکار کر دیا - چنانچہ وہ فجر کے وقت ان پر گرے اور مارے گئے، عبداللہ بن الزبیر اس جماعت کی قیادت کر رہے تھے۔ سیابیجہ پر اس وقت ابو سلمہ الزطی ایک صالح آدمی تھے۔"
  tr: "Basra hazinesinden sorumlu, sayıları kırk ile dört yüz arasında değişen bir grup Seyyide vardı. Talha bin Ubeydullah ve Zübeyr bin Evvem Basra'ya geldiklerinde, Ali bin Ebu Talib adına Osman bin Hanif el-Ensari hazinenin sorumlusuydu. Seyyideler, Ali gelene kadar hazineyi teslim etmeyi reddettiler. Bunun üzerine şafak vakti yanlarına gelip onları öldürdüler. Onların işlerinden sorumlu olan Abdullah bin Zübeyr de onlarla birlikte gelen bir grupla birlikteydi. O gün Seyyidelerin başında Ebu Seleme el-Zütti vardı ve o da dürüst bir adamdı."
  id: "Ada sekelompok Sayyidah yang dipercayakan dengan perbendaharaan Basra, yang konon berjumlah empat puluh atau empat ratus orang. Ketika Talha bin Ubaid Allah dan Al-Zubayr bin Al-Awwam datang ke Basra, dan atas nama Ali bin Abi Talib, Uthman bin Hanif Al-Ansari yang bertanggung jawab atas perbendaharaan tersebut, mereka menolak untuk menyerahkan perbendaharaan sampai Ali datang. Maka mereka datang kepada mereka pada waktu subuh dan membunuh mereka. Abdullah bin Al-Zubayr, yang bertanggung jawab atas urusan mereka, bersama sekelompok orang bergegas menghampiri mereka bersamanya. Pada hari itu, Abu Salama Al-Zutti yang bertanggung jawab atas para Sayyidah, dan dia adalah seorang yang saleh."
