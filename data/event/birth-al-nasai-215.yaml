label:
  ar: "مولد الإمام أحمد بن شعيب النسائي بنسا بخراسان، ٢١٥هـ"
  en: "Birth of Imam Ahmad ibn Shu'ayb al-Nasa'i at Nasa in Khurasan, 215/830"
  ur: "امام احمد بن شعیب نسائی کی پیدائش خراسان کے شہر نسا میں، 215ھ/830ء"
summary:
  ar: "وُلد أبو عبد الرحمن أحمد بن شعيب بن علي بن سنان بن بحر بن دينار الخراساني النسائي بمدينة نسا من أعمال خراسان سنة خمس عشرة ومائتين، وقيل أربع عشرة ومائتين {cite:tazkirat-al-huffaz j.2 p. 617} {cite:wafayat-ayan i p. 26-27} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1023}."
  en: "Abu Abd al-Rahman Ahmad ibn Shu'ayb ibn Ali ibn Sinan ibn Bahr ibn Dinar al-Khurasani al-Nasa'i was born at the city of Nasa in Khurasan in 215/830, with 214 also reported {cite:tazkirat-al-huffaz j.2 p. 617} {cite:wafayat-ayan i p. 26-27} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1023}."
  ur: "ابو عبد الرحمن احمد بن شعیب بن علی بن سنان بن بحر بن دینار خراسانی نسائی خراسان کے شہر نسا میں 215ھ/830ء میں پیدا ہوئے؛ 214ھ کی روایت بھی ہے {cite:tazkirat-al-huffaz j.2 p. 617} {cite:wafayat-ayan i p. 26-27} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1023}۔"
