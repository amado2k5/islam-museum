summary:
  ar: "في 7 أبريل 1972 أطلق أربعة مسلحين النار على عبيد كرومي فقتلوه وهو يلعب الباو في مقر حزب أفروشيرازي بمدينة زنجبار."
  en: "On 7 April 1972 four gunmen shot Abeid Karume dead as he played bao at the Afro-Shirazi Party headquarters in Zanzibar Town."
  ur: "7 اپریل 1972ء کو چار مسلح افراد نے زنجبار شہر میں افروشیرازی پارٹی کے صدر دفتر میں باؤ کھیلتے ہوئے عبید کرومی کو گولی مار کر ہلاک کر دیا۔"
  fr: "Le 7 avril 1972, quatre hommes armés abattirent Abeid Karume alors qu'il jouait au bao au siège de l'Afro-Shirazi Party, à Zanzibar Town."
  es: "El 7 de abril de 1972, cuatro hombres armados asesinaron a tiros a Abeid Karume mientras jugaba al bao en la sede del Partido Afro-Shirazi en la ciudad de Zanzíbar."
  tr: "7 Nisan 1972'de dört silahlı kişi, Zanzibar şehrindeki Afro-Şirazi Partisi genel merkezinde yay çalarken Abeid Karume'yi vurarak öldürdü."
  id: "Pada tanggal 7 April 1972, empat orang bersenjata menembak dan membunuh Abeid Karume saat ia memainkan busur di markas besar Partai Afro-Shirazi di Kota Zanzibar."
