id: event/expedition-of-badr-al-mawida
class: event
kind: campaign
label: { en: "The Expedition of Badr al-Maw'ida", ar: "غزوة بدر الموعد", es: "La expedición de Badr al-Maw'ida", fr: "L'expédition de Badr al-Maw'ida", ur: "غزوہ بدر الموائدہ", tr: "Bedir el-Mev'id Muharebesi", id: "Pertempuran Badr al-Maw'id" }
summary:
  en: "In Sha'ban 4 AH (January 626 CE), the Prophet marched with 1,500 fighters to Badr to meet Abu Sufyan according to their Uhud rendezvous; Abu Sufyan departed with 2,000 Meccans but retreated from Majanna citing a drought year, leaving the Muslims in full mastery of the annual Badr fair for eight days."
  ar: "في شعبان سنة 4هـ ⁦(يناير 626م)⁩ خرج النبي في ألف وخمسمائة لميعاد أبي سفيان يوم أحد، وخرج أبو سفيان في ألفين من مكة فثبطه الجدب ورجع من مجنة، فأقام المسلمون ببدر ثمانية أيام يبيعون ويبتاعون وبسطوا هيبتهم في جزيرة العرب."
  es: "En Sha'ban 4 AH (enero de 626 d. C.), el Profeta marchó con 1.500 guerreros a Badr para reunirse con Abu Sufyan según lo acordado en Uhud; Abu Sufyan partió con 2.000 mecanos, pero se retiró de Majanna alegando un año de sequía, dejando a los musulmanes con el control total de la feria anual de Badr durante ocho días."
  fr: "En Sha'ban 4 AH (janvier 626 CE), le Prophète marcha avec 1 500 combattants vers Badr pour rencontrer Abu Sufyan selon leur rendez-vous d'Uhud; Abu Sufyan partit avec 2 000 Mecquois mais se retira de Majanna en invoquant une année de sécheresse, laissant les musulmans en pleine maîtrise de la foire annuelle de Badr pendant huit jours."
  ur: "شعبان 4 ہجری ⁦(جنوری 626 عیسوی)⁩ میں، نبی نے 1500 جنگجوؤں کے ساتھ بدر کی طرف کوچ کیا تاکہ ان کے احد ملاقات کے مطابق ابو سفیان سے ملاقات کی جا سکے۔ ابو سفیان 2000 مکہ والوں کے ساتھ روانہ ہوا لیکن قحط سالی کا حوالہ دیتے ہوئے مجنا سے پیچھے ہٹ گیا، جس سے مسلمانوں کو بدر کے سالانہ میلے میں آٹھ دن تک مکمل مہارت حاصل رہی۔"
  tr: "Hicri 4. yılın Şaban ayında (Ocak 626), Peygamberimiz Uhud günü Ebu Sufyan ile görüşmek üzere bin beş yüz kişiyle yola çıktı. Ebu Sufyan Mekke'den iki bin kişiyle yola çıkmış, ancak kuraklık onu yavaşlatmış ve Mecvana'dan geri dönmüştü. Müslümanlar Bedir'de sekiz gün kalıp, alım satım yaparak Arap Yarımadası'nda itibar kazandılar."
  id: "Pada bulan Sya'ban tahun 4 Hijriah (Januari 626 M), Nabi Muhammad SAW berangkat bersama seribu lima ratus orang untuk menemui Abu Sufyan pada hari Perang Uhud. Abu Sufyan berangkat bersama dua ribu orang dari Mekah, tetapi kekeringan memperlambat perjalanannya dan ia kembali dari Majanna. Kaum Muslimin tinggal di Badr selama delapan hari, melakukan jual beli, dan mereka menyebarkan pengaruh mereka di Semenanjung Arab."
