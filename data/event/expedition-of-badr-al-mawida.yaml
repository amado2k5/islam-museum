label: { en: "The Expedition of Badr al-Maw'ida", ar: "غزوة بدر الموعد" }
summary:
  en: "In Sha'ban 4 AH (January 626 CE), the Prophet marched with 1,500 fighters to Badr to meet Abu Sufyan according to their Uhud rendezvous; Abu Sufyan departed with 2,000 Meccans but retreated from Majanna citing a drought year, leaving the Muslims in full mastery of the annual Badr fair for eight days."
  ar: "في شعبان سنة 4هـ (يناير 626م) خرج النبي في ألف وخمسمائة لميعاد أبي سفيان يوم أحد، وخرج أبو سفيان في ألفين من مكة فثبطه الجدب ورجع من مجنة، فأقام المسلمون ببدر ثمانية أيام يبيعون ويبتاعون وبسطوا هيبتهم في جزيرة العرب."
