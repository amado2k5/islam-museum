id: event/expedition-of-usama
class: event
kind: campaign
label: { en: "The expedition of Usama ibn Zayd", ar: "بعث أسامة بن زيد", es: "La expedición de Usama ibn Zayd", fr: "L'expédition d'Oussama ibn Zayd", ur: "اسامہ بن زید کی غزوہ", tr: "Usama ibn Zayd gönderdi", id: "Usama ibn Zayd mengirim" }
summary:
  en: "In Safar 11 AH the Prophet equipped a great army under the young Usama ibn Zayd to strike the Byzantine marches of al-Balqa' and al-Darum in Palestine — answering the empire's killing of Muslim converts; the troops camped at al-Jurf until the Prophet's illness delayed them, and the campaign was carried out under Abu Bakr."
  ar: "جهّز النبي في صفر سنة 11هـ جيشاً كبيراً على أسامة بن زيد ليوطئ الخيل تخوم البلقاء والداروم من أرض فلسطين جواباً لقتل الروم من أسلم من أتباعها؛ تكلم الناس في إمارته لحداثة سنه فثبّتها النبي، ونزل الجيش الجرف حتى أخّره مرض النبي فنُفّذ البعث في خلافة أبي بكر."
  es: "En Safar del año 11 de la Hégira, el Profeta equipó un gran ejército bajo el mando del joven Usama ibn Zayd para atacar las fronteras bizantinas de al-Balqa' y al-Darum en Palestina, en respuesta a la matanza de conversos musulmanes por parte del imperio; las tropas acamparon en al-Jurf hasta que la enfermedad del Profeta las retrasó, y la campaña se llevó a cabo bajo el mando de Abu Bakr."
  fr: "En Safar 11 AH, le Prophète a équipé une grande armée sous le commandement du jeune Oussama ibn Zayd pour frapper les marches byzantines d'al-Balqa' et d'al-Darum en Palestine, en réponse au massacre des convertis musulmans par l'empire; les troupes campèrent à al-Jurf jusqu'à ce que la maladie du Prophète les retarde, et la campagne fut menée sous le commandement d'Abu Bakr."
  ur: "صفر 11 ہجری میں نبی نے نوجوان اسامہ بن زید کے ماتحت ایک عظیم لشکر کو فلسطین میں البلقہ اور الدارم کے بازنطینی مارچوں پر حملہ کرنے کے لیے لیس کیا - سلطنت کی طرف سے مسلمانوں کے قتل کا جواب دینا؛ فوجوں نے الجرف میں پڑاؤ ڈالا یہاں تک کہ رسول اللہ کی بیماری نے ان میں تاخیر کر دی، اور یہ مہم ابوبکر کی قیادت میں چلائی گئی۔"
  tr: "Hicri 11. yılın Safer ayında, Romalıların İslam'ı kabul edenleri öldürmesine karşılık olarak, Peygamberimiz, Usame bin Zeyd komutasında büyük bir orduyu Filistin topraklarındaki Belka ve Darum sınırlarına doğru atlı yürüyüşe geçirdi. Genç yaşından dolayı liderliği hakkında konuşuldu ve Peygamberimiz bunu doğruladı. Ordu, Peygamberimizin hastalığı nedeniyle gecikene kadar El-Curuf'a doğru ilerledi; bu nedenle sefer, Ebu Bekir'in halifeliği döneminde gerçekleştirildi."
  id: "Pada bulan Safar tahun 11 Hijriah, Nabi mempersiapkan pasukan besar di bawah pimpinan Usama bin Zaid untuk memimpin pasukan berkuda menuju perbatasan Balqa dan Darum di tanah Palestina sebagai balasan atas pembunuhan yang dilakukan oleh bangsa Romawi terhadap para pengikut Islam yang telah memeluk agama Islam. Orang-orang membicarakan kepemimpinannya karena usianya yang masih muda, sehingga Nabi menegaskan hal itu. Pasukan tersebut bergerak menuju Al-Juruf hingga penyakit Nabi menundanya, sehingga ekspedisi tersebut dilakukan pada masa kekhalifahan Abu Bakar."
