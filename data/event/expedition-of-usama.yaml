label: { en: "The expedition of Usama ibn Zayd", ar: "بعث أسامة بن زيد" }
summary:
  en: "In Safar 11 AH the Prophet equipped a great army under the young Usama ibn Zayd to strike the Byzantine marches of al-Balqa' and al-Darum in Palestine — answering the empire's killing of Muslim converts; the troops camped at al-Jurf until the Prophet's illness delayed them, and the campaign was carried out under Abu Bakr."
  ar: "جهّز النبي في صفر سنة 11هـ جيشاً كبيراً على أسامة بن زيد ليوطئ الخيل تخوم البلقاء والداروم من أرض فلسطين جواباً لقتل الروم من أسلم من أتباعها؛ تكلم الناس في إمارته لحداثة سنه فثبّتها النبي، ونزل الجيش الجرف حتى أخّره مرض النبي فنُفّذ البعث في خلافة أبي بكر."
