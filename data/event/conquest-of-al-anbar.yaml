id: event/conquest-of-al-anbar
class: event
kind: conquest
label: { ar: "فتح الأنبار وغارة سوق بغداذ", en: "The Conquest of al-Anbar and the Raid on Baghdad's Market", es: "La conquista de al-Anbar y el asalto al mercado de Bagdad.", fr: "La conquête d'al-Anbar et le raid sur le marché de Bagdad", ur: "الانبار کی فتح اور بغداد کے بازار پر حملہ" }
summary:
  ar: "عند البلاذري: سار خالد إلى الأنبار فتحصن أهلها ثم أتاه من دلّه على سوق بغداذ وهو السوق العتيق الذي كان عند قرن الصراط فبعث خالد المثنى بن حارثة فأغار عليه فملأ المسلمون أيديهم من الصفراء والبيضاء وما خف محمله من المتاع ثم باتوا بالسيلحين وأتوا الأنبار وخالد بها فحصروا أهلها وحرقوا في نواحيها وأنما سميت الأنبار لأن أهراء العجم كانت بها وكان أصحاب النعمان وصنائعه يعطون أرزاقهم منها فلما رأى أهل الأنبار ما نزل بهم صالحوا خالداً على شيء رضي بهم فأقرهم. ويقال إن خالداً قدم المثنى إلى بغداذ ثم سار بعده فتولى الغارة عليها وليس ذلك بثبت. وعن الشعبي: لأهل الأنبار عهد وعقد. وحدث البلاذري مشايخ من أهل الأنبار أنهم صولحوا في خلافة عمر على طسوجهم على أربع مائة ألف درهم وألف عباءة قطوانية في كل سنة وتولى الصلح جرير بن عبد الله البجلي ويقال صالحهم على ثمانين ألفاً والله أعلم."
  en: "In al-Baladhuri: Khalid marched to al-Anbar whose people fortified; a guide told him of Baghdad's market — the old market at Qarn al-Sarat — so he sent al-Muthanna ibn Haritha raiding on it and the Muslims filled their hands with gold, silver and light goods, then overnighted at al-Saylahin and came to al-Anbar where Khalid was; they besieged its people and burned through its outskirts — al-Anbar being named for the Persians' granaries there, from which al-Nu'man's retainers and clients drew their rations — so when they saw what befell them they made peace with Khalid on terms he accepted from them. It is also said Khalid sent al-Muthanna ahead to Baghdad then marched after and himself led the raid — not established. Via al-Sha'bi: Anbar's people have a covenant and contract. Shaykhs of Anbar told al-Baladhuri they were pacified in Umar's caliphate on their canals: four hundred thousand dirhams and a thousand Qatawani cloaks yearly, Jarir ibn Abdallah al-Bajali conducting the peace — or, it is said, on eighty thousand; God knows best."
  es: "En al-Baladhuri: Khalid marchó a al-Anbar, cuya gente estaba fortificada; un guía le habló del mercado de Bagdad —el antiguo mercado de Qarn al-Sarat—, así que envió a al-Muthanna ibn Haritha a saquearlo y los musulmanes llenaron sus manos de oro, plata y mercancías ligeras, luego pasaron la noche en al-Saylahin y llegaron a al-Anbar, donde estaba Khalid; sitiaron a su gente e incendiaron sus alrededores —al-Anbar recibió su nombre de los graneros persas allí, de donde los vasallos y clientes de al-Nu'man tomaban sus raciones— así que cuando vieron lo que les sucedió, hicieron la paz con Khalid en los términos que él aceptó de ellos. También se dice que Khalid envió a al-Muthanna por delante a Bagdad y luego marchó tras él y él mismo dirigió el saqueo —esto no está comprobado—. Según al-Sha'bi: la gente de Anbar tiene un pacto y un contrato. Los jeques de Anbar le dijeron a al-Baladhuri que en el califato de Umar se les había pacificado con sus canales: cuatrocientos mil dirhams y mil mantos de Qatawani al año, con Jarir ibn Abdallah al-Bajali dirigiendo la paz, o, según se dice, con ochenta mil; Dios lo sabe mejor."
  fr: "Selon al-Baladhuri: Khalid marcha sur al-Anbar, dont les habitants s'étaient retranchés dans des fortifications. Un guide lui parla du marché de Bagdad – l'ancien marché de Qarn al-Sarat – et il envoya al-Muthanna ibn Haritha le piller. Les musulmans s'emparèrent d'or, d'argent et de marchandises légères, puis passèrent la nuit à al-Saylahin avant de rejoindre al-Anbar où se trouvait Khalid. Ils assiégèrent la ville et incendièrent ses abords. al-Anbar tire son nom des greniers persans qui s'y trouvaient, d'où les fidèles et les clients d'al-Nu'man tiraient leurs rations. Voyant leur sort, ils conclurent la paix avec Khalid aux conditions qu'il accepta. On raconte aussi que Khalid envoya al-Muthanna en éclaireur à Bagdad, puis marcha à sa suite et mena lui-même le raid – information non confirmée. D'après al-Sha'bi: les habitants d'Anbar ont conclu une alliance et un contrat. Les cheikhs d'Anbar ont dit à al-Baladhuri qu'ils avaient été pacifiés dans le califat d'Umar sur leurs canaux: quatre cent mille dirhams et mille manteaux Qatawani par an, Jarir ibn Abdallah al-Bajali menant la paix — ou, dit-on, sur quatre-vingt mille; Dieu sait mieux."
  ur: "البلادوری میں ہے: خالد نے الانبار کی طرف کوچ کیا جس کے لوگوں نے قلعہ بندی کی۔ ایک گائیڈ نے اسے بغداد کے بازار کے بارے میں بتایا - قرن الصراط کے پرانے بازار - تو اس نے المثنیٰ بن حارثہ کو اس پر چھاپہ مارنے کے لیے بھیجا اور مسلمانوں نے سونے، چاندی اور ہلکے سامان سے اپنے ہاتھ بھر لیے، پھر السلیحین میں رات گزار کر الانبار پہنچے جہاں خالد تھے۔ انہوں نے اس کے لوگوں کا محاصرہ کیا اور اس کے مضافات میں جلا دیا - الانبار کا نام وہاں پر فارسیوں کے اناج کے لئے رکھا گیا تھا، جہاں سے النعمان کے محافظ اور مؤکل اپنا راشن نکالتے تھے - لہذا جب انہوں نے دیکھا کہ ان پر کیا گزری تو انہوں نے خالد سے ان شرائط پر صلح کر لی جو اس نے ان سے قبول کر لی۔ یہ بھی کہا جاتا ہے کہ خالد نے المتنہ کو بغداد سے آگے بھیجا پھر اس کے بعد مارچ کیا اور خود اس چھاپے کی قیادت کی۔ بذریعہ الشعبی: انبار کے لوگوں کا ایک عہد اور معاہدہ ہے۔ الانبار کے شیوخ نے البلادھوری کو بتایا کہ عمر کی خلافت میں انہیں ان کی نہروں پر تسلی دی گئی: چار لاکھ درہم اور ایک ہزار قتاوانی چادر سالانہ، جریر بن عبداللہ البجلی صلح کا انتظام کرتے ہیں - یا کہا جاتا ہے، اسی ہزار پر؛ خدا ہی بہتر جانتا ہے۔"
