label: { en: "The Prophet's address to the Ansar at al-Ji'rana", ar: "خطبة النبي في الأنصار بالجعرانة" }
summary:
  en: "When the Ansar received nothing of the lavish Hunayn grants and grumbled that 'the Prophet has rejoined his own people', Sa'd ibn Ubada conveyed their hurt and gathered them in an enclosure; the Prophet reminded them they had been astray and God guided them, destitute and God enriched them, enemies and God reconciled their hearts — then asked whether they were not content that people return with sheep and camels while they return to their homes with the Messenger of God; the Ansar wept until their beards were wet and declared themselves content with the Messenger of God as their share."
  ar: "لما أعطى النبي سادات قريش ورؤساء قبائل نجد العطايا الجزلة ولم يصب الأنصار منها شيء، كثرت فيهم القالة حتى قال قائلهم: لقي رسول الله قومه، فدخل عليه سعد بن عبادة وأخبره بما يقولون ثم جمعهم له في حظيرة؛ فذكّرهم النبي بما أتاهم به من الهدى والغنى والألفة، ثم قال: «ألا ترضون أن يذهب الناس بالشاة والبعير وترجعوا برسول الله إلى رحالكم؟» فبكوا حتى أخضلوا لحاهم وقالوا: رضينا برسول الله قسماً وحظاً."
