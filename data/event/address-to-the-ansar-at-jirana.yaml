label: { en: "The Prophet's address to the Ansar at al-Ji'rana", fr: "Discours du Prophète aux Ansar à al-Ji'rana", ar: "خطبة النبي في الأنصار بالجعرانة", es: "El discurso del Profeta a los Ansar en al-Ji'rana", ur: "الجیرانہ میں انصار سے پیغمبر کا خطاب" }
summary:
  en: "When the Ansar received nothing of the lavish Hunayn grants and grumbled that 'the Prophet has rejoined his own people', Sa'd ibn Ubada conveyed their hurt and gathered them in an enclosure; the Prophet reminded them they had been astray and God guided them, destitute and God enriched them, enemies and God reconciled their hearts — then asked whether they were not content that people return with sheep and camels while they return to their homes with the Messenger of God; the Ansar wept until their beards were wet and declared themselves content with the Messenger of God as their share."
  fr: "Quand les Ansar ne reçurent rien des généreux dons de Hunayn et murmurèrent que « le Prophète avait rejoint les siens », Sa'd ibn Ubada transmit leur peine et les réunit dans un enclos. Le Prophète leur rappela qu’ils étaient égarés et que Dieu les avait guidés, démunis et que Dieu les avait enrichis, ennemis et que Dieu avait réconcilié leurs cœurs ; il demanda s’ils n’étaient pas satisfaits que les gens repartent avec moutons et chameaux tandis qu’eux rentreraient chez eux avec le Messager de Dieu. Les Ansar pleurèrent jusqu’à mouiller leurs barbes et se déclarèrent satisfaits de l’avoir pour part."
  ar: "لما أعطى النبي سادات قريش ورؤساء قبائل نجد العطايا الجزلة ولم يصب الأنصار منها شيء، كثرت فيهم القالة حتى قال قائلهم: لقي رسول الله قومه، فدخل عليه سعد بن عبادة وأخبره بما يقولون ثم جمعهم له في حظيرة؛ فذكّرهم النبي بما أتاهم به من الهدى والغنى والألفة، ثم قال: «ألا ترضون أن يذهب الناس بالشاة والبعير وترجعوا برسول الله إلى رحالكم؟» فبكوا حتى أخضلوا لحاهم وقالوا: رضينا برسول الله قسماً وحظاً."
  es: "Cuando los Ansar no recibieron nada de las generosas concesiones de Hunayn y se quejaron de que \"el Profeta se ha reunido con su propia gente\", Sa'd ibn Ubada les transmitió su aflicción y los reunió en un recinto. El Profeta les recordó que habían estado extraviados y que Dios los había guiado; que habían estado desamparados y que Dios los había enriquecido; que habían sido enemigos y que Dios había reconciliado sus corazones. Luego les preguntó si no estaban contentos de que la gente regresara con ovejas y camellos mientras ellos regresaban a sus hogares con el Mensajero de Dios. Los Ansar lloraron hasta que se les mojaron las barbas y se declararon contentos con el Mensajero de Dios como su parte."
  ur: "جب انصار کو حنین کی عطیات میں سے کچھ نہ ملا اور وہ بڑبڑانے لگے کہ 'نبی اپنی قوم میں دوبارہ شامل ہو گئے ہیں' تو سعد بن عبادہ نے ان کی تکلیف پہنچائی اور انہیں ایک دیوار میں جمع کیا۔ نبی نے انہیں یاد دلایا کہ وہ گمراہ تھے اور خدا نے ان کی رہنمائی کی، بے سہارا اور خدا نے انہیں غنی کیا، دشمنوں اور خدا نے ان کے دلوں کو ملایا - پھر پوچھا کہ کیا وہ اس بات پر راضی نہیں ہیں کہ لوگ بھیڑ بکریوں اور اونٹوں کے ساتھ واپس جائیں جب کہ وہ رسول اللہ کے ساتھ اپنے گھروں کو لوٹیں؟ انصار اس وقت تک روتے رہے جب تک ان کی داڑھیاں گیلی نہ ہو گئیں اور انہوں نے رسول اللہ کے ساتھ اپنا حصہ قرار دیا۔"
