id: event/abu-al-atahiya-fights-at-ayman-and-warraqatayn-and-withdraws-to-nuqm-288
class: event
kind: other
label:
  ar: "أبو العتاهية يقاتل بعيمان وورّاقتين وينحاز إلى نقم، شعبان 288هـ"
  en: "Abu al-Atahiya fights at Ayman and Warraqatayn and withdraws to Nuqm, Sha'ban 288 AH"
  fr: "Abu al-Atahiya combat à Ayman et Warraqatayn et se replie à Nuqm, sha'ban 288 de l’hégire"
  ur: "ابو العتاہیہ عیمان اور وراقتین میں لڑتے ہیں اور نقم کی طرف ہٹ جاتے ہیں، شعبان 288ھ"
  es: "Abu al-Atahiya lucha en Ayman y Warraqatayn y se retira a Nuqm, Sha'ban 288 AH"
  tr: "Ebu el-Atahiye iki savaş atıyla savaşarak Naqam'a katıldı, Şaban 288 Hicri."
  id: "Abu al-Atahiyah berperang dengan dua kuda perang dan bergabung dengan Naqam, Sya'ban 288 H."
summary:
  ar: "أخرج الهادي أبا العتاهية مساء ليلة السبت بخيل ورجال إلى موضع عيمان وفيه جيش آل يعفر وآل طريف، فوقع القتال، وأرسل القوم إلى بيت بوس فاستمدوا عسكرهم هناك، والتقى القوم في موضع يقال له وراقتين فاقتتلوا قتالاً شديداً، ثم انحاز أبو العتاهية ومن معه إلى جبل نقم."
  en: "On the evening of Friday night al-Hadi sent Abu al-Atahiya with horse and foot to a place called Ayman, where the army of Al Ya'fur and Al Tarif lay; fighting broke out, the men sent to Bayt Bus for their army there, they met at a place called Warraqatayn and fought hard, and Abu al-Atahiya and his men then drew off to the mountain of Nuqm."
  fr: "Au soir de la nuit du vendredi, al-Hadi envoya Abu al-Atahiya avec des cavaliers et des fantassins à un lieu appelé Ayman, où se trouvait l’armée des Al Ya'fur et des Al Tarif ; les combats éclatèrent, les hommes firent chercher leur armée à Bayt Bus, les adversaires se rencontrèrent à un lieu appelé Warraqatayn et combattirent durement, puis Abu al-Atahiya et ses hommes se replièrent sur la montagne de Nuqm."
  ur: "ہادی نے جمعہ کی شام ابو العتاہیہ کو سواروں اور پیادوں کے ساتھ عیمان نامی جگہ بھیجا جہاں آل یعفر اور آل طریف کا لشکر تھا؛ لڑائی چھڑ گئی، ان لوگوں نے بیت بوس کی طرف ہلکارہ بھیج کر وہاں کے لشکر کو بلایا، وہ وراقتین نامی جگہ مل کر سخت لڑے، پھر ابو العتاہیہ اور ان کے ساتھی جبلِ نقم کی طرف ہٹ گئے۔"
  es: "En la noche del viernes, al-Hadi envió a Abu al-Atahiya a caballo y a pie a un lugar llamado Ayman, donde se encontraba el ejército de Al Ya'fur y Al Tarif; se desató la lucha, los hombres fueron enviados a Bayt Bus a buscar a su ejército, se encontraron en un lugar llamado Warraqatayn y lucharon encarnizadamente, y luego Abu al-Atahiya y sus hombres se retiraron a la montaña de Nuqm."
  tr: "Cumartesi gecesi, El-Hadi, Ebu el-Atahiya'yı atları ve adamlarıyla birlikte, El Ya'fer ve El Tarif ailelerinin ordusunun bulunduğu Ayman bölgesine gönderdi. Çatışma çıktı ve halk, ordularını takviye etmek için Beyt Bos'a gitti. Halk, Varaktin denilen bir yerde buluştu ve şiddetli bir şekilde savaştı. Ardından Ebu el-Atahiya ve yanındakiler Nakm Dağı'na çekildi."
  id: "Pada Sabtu malam, Al-Hadi mengutus Abu Al-Atahiya beserta kuda dan pasukannya ke tempat Ayman, di mana pasukan keluarga Al Ya’far dan Al Tarif berada. Pertempuran pun pecah, dan orang-orang dikirim ke Beit Bos untuk memperkuat pasukan mereka di sana. Mereka bertemu di tempat bernama Waraqteen dan bertempur dengan sengit. Kemudian Abu Al-Atahiya dan orang-orang yang bersamanya mundur ke Gunung Naqm."
