id: event/abu-al-atahiya-fights-at-ayman-and-warraqatayn-and-withdraws-to-nuqm-288
class: event
kind: other
label:
  ar: "أبو العتاهية يقاتل بعيمان وورّاقتين وينحاز إلى نقم، شعبان 288هـ"
  en: "Abu al-Atahiya fights at Ayman and Warraqatayn and withdraws to Nuqm, Sha'ban 288 AH"
  ur: "ابو العتاہیہ عیمان اور وراقتین میں لڑتے ہیں اور نقم کی طرف ہٹ جاتے ہیں، شعبان 288ھ"
summary:
  ar: "أخرج الهادي أبا العتاهية مساء ليلة السبت بخيل ورجال إلى موضع عيمان وفيه جيش آل يعفر وآل طريف، فوقع القتال، وأرسل القوم إلى بيت بوس فاستمدوا عسكرهم هناك، والتقى القوم في موضع يقال له وراقتين فاقتتلوا قتالاً شديداً، ثم انحاز أبو العتاهية ومن معه إلى جبل نقم."
  en: "On the evening of Friday night al-Hadi sent Abu al-Atahiya with horse and foot to a place called Ayman, where the army of Al Ya'fur and Al Tarif lay; fighting broke out, the men sent to Bayt Bus for their army there, they met at a place called Warraqatayn and fought hard, and Abu al-Atahiya and his men then drew off to the mountain of Nuqm."
  ur: "ہادی نے جمعہ کی شام ابو العتاہیہ کو سواروں اور پیادوں کے ساتھ عیمان نامی جگہ بھیجا جہاں آل یعفر اور آل طریف کا لشکر تھا؛ لڑائی چھڑ گئی، ان لوگوں نے بیت بوس کی طرف ہلکارہ بھیج کر وہاں کے لشکر کو بلایا، وہ وراقتین نامی جگہ مل کر سخت لڑے، پھر ابو العتاہیہ اور ان کے ساتھی جبلِ نقم کی طرف ہٹ گئے۔"
