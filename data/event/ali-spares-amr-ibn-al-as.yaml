label: { ar: "علي يترك عمرو بن العاص بعد أن انكشف", en: "Ali spares Amr ibn al-As after he was exposed" }
summary:
  ar: "في صفين، ظفر علي بعمرو بن العاص وقد سقط مكشوف السوأة، فأعرض عنه ولم يقتله، وفق ما يرويه العقاد عن أدب الفروسية عند علي {cite:abqariyyat-ali-aqqad p.35}. ويعدّ المؤلف ذلك من أندر المروءات، لأن عمرو كان أخطر على علي من جيش كامل في رأيه {cite:abqariyyat-ali-aqqad p.25}."
  en: "At Siffin Ali got the upper hand over Amr ibn al-As, who had fallen with his private parts exposed, and turned away without killing him, in the author's account of Ali's chivalry {cite:abqariyyat-ali-aqqad p.35}. Al-Aqqad counts this among the rarest acts of generosity, since Amr was more dangerous to Ali than an army {cite:abqariyyat-ali-aqqad p.25}."
