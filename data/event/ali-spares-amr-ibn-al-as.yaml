id: event/ali-spares-amr-ibn-al-as
class: event
kind: other
label: { ar: "علي يترك عمرو بن العاص بعد أن انكشف", en: "Ali spares Amr ibn al-As after he was exposed", es: "Ali perdona a Amr ibn al-As después de que este quedara al descubierto.", fr: "Ali épargne Amr ibn al-As après que celui-ci ait été démasqué.", ur: "علی نے عمرو بن العاص کو بے نقاب ہونے کے بعد بخش دیا۔", tr: "Ali, Amr ibn al-Aas'ın foyası ortaya çıktıktan sonra onu terk eder.", id: "Ali meninggalkan Amr ibn al-Aas setelah kedoknya terbongkar." }
summary:
  ar: "في صفين، ظفر علي بعمرو بن العاص وقد سقط مكشوف السوأة، فأعرض عنه ولم يقتله، وفق ما يرويه العقاد عن أدب الفروسية عند علي {cite:abqariyyat-ali-aqqad p.35}. ويعدّ المؤلف ذلك من أندر المروءات، لأن عمرو كان أخطر على علي من جيش كامل في رأيه {cite:abqariyyat-ali-aqqad p.25}."
  en: "At Siffin Ali got the upper hand over Amr ibn al-As, who had fallen with his private parts exposed, and turned away without killing him, in the author's account of Ali's chivalry {cite:abqariyyat-ali-aqqad p.35}. Al-Aqqad counts this among the rarest acts of generosity, since Amr was more dangerous to Ali than an army {cite:abqariyyat-ali-aqqad p.25}."
  es: "En Siffin, Ali se impuso a Amr ibn al-As, quien había caído con sus partes íntimas expuestas, y se apartó sin matarlo, según el relato del autor sobre la caballerosidad de Ali {cite:abqariyyat-ali-aqqad p.35}. Al-Aqqad considera este acto como uno de los más excepcionales actos de generosidad, ya que Amr representaba un peligro mayor para Ali que un ejército {cite:abqariyyat-ali-aqqad p.25}."
  fr: "À Siffin, Ali prit le dessus sur Amr ibn al-As, tombé les parties intimes exposées, et se détourna sans le tuer, selon le récit de l'auteur relatant la chevalerie d'Ali {cite:abqariyyat-ali-aqqad p.35}. Al-Aqqad considère cet acte comme l'un des plus rares actes de générosité, car Amr était plus dangereux pour Ali qu'une armée {cite:abqariyyat-ali-aqqad p.25}."
  ur: "صفین میں علی کو عمرو بن العاص پر غلبہ حاصل ہوا، جو اپنی شرمگاہ کو بے نقاب کرتے ہوئے گر گیا تھا، اور اسے قتل کیے بغیر واپس چلا گیا، مصنف کے علی کی شجاعت کے بیان میں ہے {حوالہ:عبقریۃ علی عقد ص35}۔ العقاد اسے سخاوت کے نادر ترین کاموں میں شمار کرتا ہے کیونکہ عمرو علی کے لیے لشکر سے زیادہ خطرناک تھا"
  tr: "Siffin'de Ali, yere düşmüş ve savunmasız kalmış olan Amr ibn al-As'ı yakaladı, ancak el-Aqqad'ın Ali'nin şövalyelik kuralları hakkında anlattıklarına göre Ali ondan yüz çevirdi ve onu öldürmedi {kaynak:abqariyyat-ali-aqqad s.35}. Yazar bunu en nadir şövalyelik eylemlerinden biri olarak değerlendirir, çünkü Ali'nin görüşüne göre Amr, onun için koca bir ordudan daha tehlikeliydi {kaynak:abqariyyat-ali-aqqad s.25}."
  id: "Di Siffin, Ali menangkap Amr ibn al-As, yang telah jatuh dan posisinya terbuka, tetapi Ali berpaling darinya dan tidak membunuhnya, menurut apa yang diceritakan al-Aqqad tentang kode kesatria Ali {cite:abqariyyat-ali-aqqad p.35}. Penulis menganggap ini sebagai salah satu tindakan kesatria yang paling langka, karena, menurut pendapat Ali, Amr lebih berbahaya baginya daripada seluruh pasukan {cite:abqariyyat-ali-aqqad p.25}."
