  es: "Sitio de al-Rahba por Ghazan, 702 de la Hégira"
  tr: "Gazan'ın Rahba şehrini kuşatması 702"
  id: "Pengepungan kota Rahba oleh Ghazan 702"
summary:
  ar: "في سنة 702 هـ، حين قدم غازان خان لحصار الرحبة الواقعة على شاطئ الفرات، كلّف رشيد الدين بترجمة أوامره ورسائله إلى العربية، وأمره أن يكتب باسمه خطاباً بالعربية ينذر المحاصرين بالتسليم حتى لا يعرضوا أهلها للخطر بدفاع غير مجد، فأحدث الخطاب أثره، واستولى غازان على المكان دون قتال {cite:jami-al-tawarikh-khashshab-1960 p. 43}."
  en: "In 702 AH Ghazan Khan came to besiege al-Rahba on the Euphrates and charged Rashid al-Din with rendering his orders and letters into Arabic. Rashid wrote, in the sultan's name, an Arabic letter calling on the defenders to surrender rather than endanger their people in a useless defence; the letter had its effect, and Ghazan took the town without a battle {cite:jami-al-tawarikh-khashshab-1960 p. 43}. The introduction presents this as an example of Rashid's service on campaign, and also places the Mongol camp at Anah on the Euphrates during the same campaign {cite:jami-al-tawarikh-khashshab-1960 p. 43}."
  es: "En 702 de la Hégira, Ghazan Jan vino a sitiar al-Rahba, a orillas del Éufrates, y encargó a Rashid al-Din traducir al árabe sus órdenes y cartas. Rashid redactó, en nombre del sultán, una carta en árabe que llamaba a los defensores a rendirse para no poner en peligro a su pueblo en una defensa inútil; la carta surtió efecto y Ghazan tomó la plaza sin combate {cite:jami-al-tawarikh-khashshab-1960 p. 43}. La introducción presenta esto como ejemplo del servicio de Rashid en campaña {cite:jami-al-tawarikh-khashshab-1960 p. 43}."
  fr: "En 702 de l'Hégire, Ghazan Khan vint assiéger al-Rahba, sur l'Euphrate, et chargea Rashid al-Din de mettre en arabe ses ordres et ses lettres. Rashid rédigea, au nom du sultan, une lettre en arabe appelant les défenseurs à se rendre pour ne pas exposer leurs gens à une défense inutile ; la lettre produisit son effet et Ghazan prit la place sans combat {cite:jami-al-tawarikh-khashshab-1960 p. 43}. L'introduction présente ce fait comme un exemple du service de Rashid en campagne {cite:jami-al-tawarikh-khashshab-1960 p. 43}."
  ur: "702ھ میں غازان خان فرات کے کنارے رحبہ کا محاصرہ کرنے آئے اور رشید الدین کو ان کے احکام اور خطوط عربی میں ترجمہ کرنے کا کام سونپا گیا۔ رشید الدین نے سلطان کے نام سے عربی میں ایک خط لکھا جس میں محصورین کو ہتھیار ڈالنے کی دعوت دی گئی تاکہ بے فائدہ دفاع سے ان کے لوگ خطرے میں نہ پڑیں؛ خط نے اثر دکھایا اور غازان نے جنگ کے بغیر شہر لے لیا {cite:jami-al-tawarikh-khashshab-1960 p. 43}۔ مقدمہ اسے رشید الدین کی مہم میں خدمت کی مثال کے طور پر پیش کرتا ہے {cite:jami-al-tawarikh-khashshab-1960 p. 43}۔"
  tr: "Hicri 702 yılında, Gazan Han, Fırat Nehri kıyısında bulunan Rahbe şehrini kuşatmaya geldiğinde, Raşid Din'i emirlerini ve mektuplarını Arapçaya çevirmekle görevlendirdi ve kuşatanları teslim olmaya çağıran, böylece halkını boş bir savunmayla tehlikeye atmayacakları bir mektubu kendi adına Arapça yazmasını emretti. Mektup etkisini gösterdi ve Gazan Han, herhangi bir çatışma olmadan şehrin kontrolünü ele geçirdi. {cite:jami-al-tawarikh-khashshab-1960 s. 43}"
  id: "Pada tahun 702 H, ketika Ghazan Khan datang untuk mengepung Al-Rahba, yang terletak di tepi Sungai Eufrat, ia menugaskan Rashid al-Din untuk menerjemahkan perintah dan surat-suratnya ke dalam bahasa Arab, dan memerintahkannya untuk menulis surat atas namanya dalam bahasa Arab yang memperingatkan para pengepung untuk menyerah agar mereka tidak membahayakan penduduknya dengan pertahanan yang sia-sia. Surat itu berhasil, dan Ghazan menguasai tempat itu tanpa pertempuran. {cite:jami-al-tawarikh-khashshab-1960 p. 43}."
