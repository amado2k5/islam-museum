label: { en: "The expedition to Awtas", ar: "سرية أوطاس" }
summary:
  en: "A detachment sent by the Prophet under Abu Amir al-Ash'ari in pursuit of the routed Hawazin remnants encamped at Awtas; Abu Amir was struck by an arrow and martyred after routing nine enemy champions, whereupon Abu Musa al-Ash'ari took the banner and secured victory."
  ar: "سرية بعثها النبي في آثار منهزمي هوازن بأوطاس بقيادة أبي عامر الأشعري؛ قاتل تسعة إخوة فغلبهم ثم رماه سلمة بن دريد بسهم في ركبته فاستشهد، فأخذ الراية ابن أخيه أبو موسى الأشعري وفتح الله عليه."
