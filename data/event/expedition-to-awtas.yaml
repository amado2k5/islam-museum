id: event/expedition-to-awtas
class: event
kind: raid
label: { en: "The expedition to Awtas", ar: "سرية أوطاس", es: "La expedición a Awtas", fr: "L'expédition à Awtas", ur: "اوطاس کی مہم", tr: "Awtas'ın Sırrı", id: "Rahasia Awtas" }
summary:
  en: "A detachment sent by the Prophet under Abu Amir al-Ash'ari in pursuit of the routed Hawazin remnants encamped at Awtas; Abu Amir was struck by an arrow and martyred after routing nine enemy champions, whereupon Abu Musa al-Ash'ari took the banner and secured victory."
  ar: "سرية بعثها النبي في آثار منهزمي هوازن بأوطاس بقيادة أبي عامر الأشعري؛ قاتل تسعة إخوة فغلبهم ثم رماه سلمة بن دريد بسهم في ركبته فاستشهد، فأخذ الراية ابن أخيه أبو موسى الأشعري وفتح الله عليه."
  es: "Un destacamento enviado por el Profeta bajo el mando de Abu Amir al-Ash'ari persiguió a los restos derrotados de los Hawazin acampados en Awtas; Abu Amir fue alcanzado por una flecha y murió como mártir tras derrotar a nueve campeones enemigos, tras lo cual Abu Musa al-Ash'ari tomó el estandarte y aseguró la victoria."
  fr: "Un détachement envoyé par le Prophète sous le commandement d'Abu Amir al-Ash'ari à la poursuite des restes des Hawazin en déroute, campés à Awtas; Abu Amir fut frappé par une flèche et martyrisé après avoir mis en déroute neuf champions ennemis, après quoi Abu Musa al-Ash'ari prit l'étendard et assura la victoire."
  ur: "ابو عامر اشعری کی قیادت میں نبی کی طرف سے بھیجی گئی ایک دستہ اوطاس میں پڑی ہوازن کی باقیات کے تعاقب میں؛ ابو عامر کو تیر مارا گیا اور دشمن کے نو چیمپیئنوں کو شکست دے کر شہید ہو گئے، اس کے بعد ابو موسیٰ اشعری نے جھنڈا سنبھالا اور فتح حاصل کی۔"
  tr: "Peygamber tarafından Awtas'ta yenilgiye uğrayan Hawazin'in peşine gönderilen, Ebu Amir el-Eş'ari önderliğindeki bir birlik, dokuz kardeşle savaştı ve onları yendi. Ardından Salama bin Duraid, onu dizinden okla vurdu ve şehit oldu. Daha sonra yeğeni Ebu Musa el-Eş'ari sancağı devraldı ve Allah ona zafer verdi."
  id: "Sebuah pasukan yang dikirim oleh Nabi untuk mengejar Hawazin yang kalah di Awtas, dipimpin oleh Abu Amir al-Ash’ari. Ia bertempur melawan sembilan bersaudara dan mengalahkan mereka, kemudian Salama bin Duraid menembaknya dengan panah di lututnya dan ia gugur sebagai syahid. Kemudian keponakannya, Abu Musa al-Ash’ari, mengambil panji dan Allah menganugerahinya kemenangan."
