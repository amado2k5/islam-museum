id: "event/al-qasim-gathers-1500-men-and-100-riders-from-the-sayhani-and-bawadia-and-enters-jilajil-in-328-ah"
class: event
kind: other
label:
  ar: "يستنصر القاسم بن أحمد بابن عمرو السيحاني وبوادعة فيخرج معه ألف وخمسمائة رجل ومائة راكب، سنة 328هـ، ص414-415"
  en: "Al-Qasim ibn Ahmad gathers help from Ibn Amr al-Sayhani and Bawada'a, with 1,500 men and 100 riders, in 328 AH, pp. 414-415"
  ur: "قاسم بن احمد ابن عمرو السیحانی اور بوادعہ سے مدد لے کر 1500 آدمی اور 100 سوار جمع کرتا ہے، 328ھ، ص414-415"
  es: "Al-Qasim ibn Ahmad reúne ayuda de Ibn Amr al-Sayhani y Bawada'a, con 1.500 hombres y 100 jinetes, en el año 328 de la Hégira, págs. 414-415."
summary:
  ar: "يمضي القاسم إلى غيل جلاجل فيستنصر ابن عمرو السيحاني وبوادعة، فيخرج معه منهم ألف رجل وخمسمائة ومائة راكب، ويلقاه بنو سعد كلها، فيدخل البلد، وينصرف أخوه يحيى إلى علاف يوم الجمعة لإحدى وعشرين ليلة باقية من جمادى الآخرة."
  en: "Al-Qasim goes to the Jilajil ghayl and seeks help from Ibn Amr al-Sayhani and Bawada'a. A thousand five hundred men and a hundred riders come out with him, all of Banu Sa'd meet him, and he enters the town. His brother Yahya returns to Alaf on Friday, twenty-one days before the end of Jumada II."
  ur: "قاسم جلاجل کے غیل کی طرف جاتا ہے اور ابن عمرو السیحانی اور بوادعہ سے مدد مانگتا ہے۔ ان میں سے ایک ہزار پانچ سو آدمی اور سو سوار اس کے ساتھ نکلتے ہیں، سارے بنو سعد اس سے آ ملتے ہیں اور وہ شہر میں داخل ہو جاتا ہے۔ اس کا بھائی یحییٰ جمادی الآخرہ کی اکیس راتیں باقی ہونے پر جمعے کے دن علاف لوٹ جاتا ہے۔"
  es: "Al-Qasim acude al Jilajil ghayl y pide ayuda a Ibn Amr al-Sayhani y a Bawada'a. Mil quinientos hombres y cien jinetes salen con él, todos los Banu Sa'd lo reciben y entra en la ciudad. Su hermano Yahya regresa a Alaf el viernes, veintiún días antes del final de Jumada II."
