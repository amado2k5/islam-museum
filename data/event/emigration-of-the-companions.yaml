summary:
  ar: "بعد بيعة العقبة الثانية أذن النبي للمسلمين بالهجرة، فخرجوا أرسالاً، وحال المشركون بين بعضهم وبين الخروج، كأبي سلمة وزوجه أم سلمة، وصهيب الذي فدى نفسه بماله، وعمر وعياش وهشام الذين حُبس منهم عياش وهشام؛ وبقي النبي وأبو بكر وعلي بمكة."
  en: "After the second pledge of al-Aqaba the Prophet authorised the Muslims to emigrate, and they left in groups; the Meccans hindered some, such as Abu Salama and his wife Umm Salama, Suhayb who ransomed himself with his wealth, and Ayyash and Hisham, who were held back; the Prophet, Abu Bakr and Ali remained at Mecca."
