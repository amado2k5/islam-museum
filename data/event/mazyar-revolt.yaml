id: event/mazyar-revolt
class: event
kind: revolt
label: { ar: "خروج مازيار بن قارن", en: "Mazyar ibn Qarin's Revolt" }
summary:
  ar: "ولّى المأمون مازيار بن قارن أعمال طبرستان والرويان ودنباوند وسمّاه محمداً وجعل له مرتبة الأصبهبذ فلم يزل والياً حتى توفي المأمون فأقرّه المعتصم ثم كفر وغدر بعد ست سنين وأشهر من خلافته فكتب إلى عبد الله بن طاهر عامل خراسان والري وقومس وجرجان بمحاربته فوجه عبد الله الحسن بن الحسين عمه في رجال خراسان ووجه المعتصم محمد بن إبراهيم بن مصعب فيمن ضم إليه من جند الحضرة وكان قوهيار بن قارن أخوه يكاتب الحسن ومحمداً يعلمهما أنه معهما عليه ويحقد عليه استخفافه وكان أهل عمله ملّوا سيرته لتجبره فأشار الحسن أن يكمن له وأخبره أن الحسن يدعوه إلى الأمان فسار مازيار فلما قرب آذنه قوهيار بمجيئه فخرج عليه في أصحابه المتقمصين في الغياض فأراد الهرب فأخذ قوهيار بمنطقته وانطوى عليه أصحاب الحسن فأخذوه سلماً بغير عهد فحمل إلى سر من رأى سنة خمس وعشرين ومائتين فضرب بالسياط بين يدي المعتصم حتى مات وصلب مع بابك الخرمي على العقبة التي بحضرة مجلس الشرطة ووثب بقوهيار بعض خاصة أخيه فقتل بطبرستان وافتتحت سهلها وجبلها فتولاها عبد الله بن طاهر وطاهر بن عبد الله من بعده.، وعند المسعودي كان المازيار قد اصطنعه المأمون فعصى أيام المعتصم فكتب إلى عبد الله بن طاهر بحربه فسير عمه الحسن بن الحسين بن مصعب فنزل السارية وبادره حين ركب إلى الصيد في نفر يسير فأسره وحمله إلى سامرا {cite:muruj-al-dhahab p. 450-451}"
  en: "Al-Ma'mun gave Mazyar ibn Qarin Tabaristan, al-Ruwayan and Dumbawand, named him Muhammad and gave him the Ispahbadh's rank; al-Mu'tasim confirmed him, then he apostatized and broke faith six years into the caliphate. Abdallah ibn Tahir sent his uncle al-Hasan ibn al-Husayn with Khurasan's men and the caliph sent Muhammad ibn Ibrahim ibn Mus'ab; Mazyar's brother Quhyar ibn Qarin, nursing slights, was secretly theirs. The ruse: al-Hasan hides, Quhyar tells Mazyar al-Hasan offers aman at another spot — marching there, Quhyar's signal brings the ambushers out of the thickets, he seizes Mazyar's belt, they take him unharmed, no pledge — carried to Samarra in 225, flogged to death before al-Mu'tasim, crucified beside Babak at the arch by the shurta-hall; Quhyar was killed by his brother's retainers, and Tabaristan, plain and mountain, was conquered for Abdallah ibn Tahir and Tahir after him."
