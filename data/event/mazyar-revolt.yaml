label: { ar: "خروج مازيار بن قارن", en: "Mazyar ibn Qarin's Revolt", es: "La revuelta de Mazyar ibn Qarin", fr: "La révolte de Mazyar ibn Qarin", ur: "مزیار بن قرین کی بغاوت" }
summary:
  ar: "ولّى المأمون مازيار بن قارن أعمال طبرستان والرويان ودنباوند وسمّاه محمداً وجعل له مرتبة الأصبهبذ فلم يزل والياً حتى توفي المأمون فأقرّه المعتصم ثم كفر وغدر بعد ست سنين وأشهر من خلافته فكتب إلى عبد الله بن طاهر عامل خراسان والري وقومس وجرجان بمحاربته فوجه عبد الله الحسن بن الحسين عمه في رجال خراسان ووجه المعتصم محمد بن إبراهيم بن مصعب فيمن ضم إليه من جند الحضرة وكان قوهيار بن قارن أخوه يكاتب الحسن ومحمداً يعلمهما أنه معهما عليه ويحقد عليه استخفافه وكان أهل عمله ملّوا سيرته لتجبره فأشار الحسن أن يكمن له وأخبره أن الحسن يدعوه إلى الأمان فسار مازيار فلما قرب آذنه قوهيار بمجيئه فخرج عليه في أصحابه المتقمصين في الغياض فأراد الهرب فأخذ قوهيار بمنطقته وانطوى عليه أصحاب الحسن فأخذوه سلماً بغير عهد فحمل إلى سر من رأى سنة خمس وعشرين ومائتين فضرب بالسياط بين يدي المعتصم حتى مات وصلب مع بابك الخرمي على العقبة التي بحضرة مجلس الشرطة ووثب بقوهيار بعض خاصة أخيه فقتل بطبرستان وافتتحت سهلها وجبلها فتولاها عبد الله بن طاهر وطاهر بن عبد الله من بعده. وعند المسعودي كان المازيار قد اصطنعه المأمون فعصى أيام المعتصم فكتب إلى عبد الله بن طاهر بحربه فسير عمه الحسن بن الحسين بن مصعب فنزل السارية وبادره حين ركب إلى الصيد في نفر يسير فأسره وحمله إلى سامرا {cite:muruj-al-dhahab p. 450-451}"
  en: "Al-Ma'mun gave Mazyar ibn Qarin Tabaristan, al-Ruwayan and Dumbawand, named him Muhammad and gave him the Ispahbadh's rank; al-Mu'tasim confirmed him, then he apostatized and broke faith six years into the caliphate. Abdallah ibn Tahir sent his uncle al-Hasan ibn al-Husayn with Khurasan's men and the caliph sent Muhammad ibn Ibrahim ibn Mus'ab; Mazyar's brother Quhyar ibn Qarin, nursing slights, was secretly theirs. The ruse: al-Hasan hides, Quhyar tells Mazyar al-Hasan offers aman at another spot — marching there, Quhyar's signal brings the ambushers out of the thickets, he seizes Mazyar's belt, they take him unharmed, no pledge — carried to Samarra in 225, flogged to death before al-Mu'tasim, crucified beside Babak at the arch by the shurta-hall; Quhyar was killed by his brother's retainers, and Tabaristan, plain and mountain, was conquered for Abdallah ibn Tahir and Tahir after him."
  es: "Al-Ma'mun le dio a Mazyar ibn Qarin Tabaristan, al-Ruwayan y Dumbawand, lo llamó Muhammad y le otorgó el rango de Ispahbadh; al-Mu'tasim lo confirmó, pero luego apostó y rompió la fe seis años después del califato. Abdallah ibn Tahir envió a su tío al-Hasan ibn al-Husayn con los hombres de Jorasán y el califa envió a Muhammad ibn Ibrahim ibn Mus'ab; el hermano de Mazyar, Quhyar ibn Qarin, resentido, era secretamente de su lado. La estratagema: al-Hasan se esconde, Quhyar le dice a Mazyar que al-Hasan ofrece un aman en otro lugar; marchando hacia allí, la señal de Quhyar hace que los emboscadores salgan de la maleza, él toma el cinturón de Mazyar, lo toman ileso, sin juramento, llevado a Samarra en 225, azotado hasta la muerte ante al-Mu'tasim, crucificado junto a Babak en el arco junto a la sala shurta; Quhyar fue asesinado por los vasallos de su hermano, y Tabaristán, llanura y montaña, fue conquistado para Abdallah ibn Tahir y Tahir después de él."
  fr: "Al-Ma'mun confia à Mazyar ibn Qarin le Tabaristan, l'al-Ruwayan et le Dumbawand, le nomma Muhammad et lui conféra le rang d'Ispahbadh; al-Mu'tasim le confirma, puis il apostasia et renonça à sa foi six ans après l'instauration du califat. Abdallah ibn Tahir envoya son oncle al-Hasan ibn al-Husayn avec les hommes du Khorasan et le calife dépêcha Muhammad ibn Ibrahim ibn Mus'ab; le frère de Mazyar, Quhyar ibn Qarin, nourrissant une rancune tenace, était secrètement à leur service. La ruse: al-Hasan se cache, Quhyar dit à Mazyar qu'al-Hasan offre l'aman à un autre endroit — s'y rendant, le signal de Quhyar fait sortir les embusqués des fourrés, il saisit la ceinture de Mazyar, ils le prennent indemne, sans gage — emmené à Samarra en 225, fouetté à mort devant al-Mu'tasim, crucifié aux côtés de Babak sous l'arche près de la salle de prière; Quhyar fut tué par les hommes de son frère, et le Tabaristan, plaine et montagne, fut conquis pour Abdallah ibn Tahir et Tahir après lui."
  ur: "المامون نے مضار بن قرین کو طبرستان، الرویان اور دمباونڈ دیا، اس کا نام محمد رکھا اور اسپہ باد کا درجہ دیا۔ معتصم نے اس کی تصدیق کی، پھر اس نے ارتداد کیا اور خلافت میں چھ سال ایمان توڑ دیا۔ عبداللہ ابن طاہر نے اپنے چچا الحسن بن الحسین کو خراسان کے آدمیوں کے ساتھ بھیجا اور خلیفہ نے محمد بن ابراہیم ابن مصعب کو بھیجا؛ مزیار کا بھائی قحار ابن قرین، جو دودھ پلانے والا تھا، خفیہ طور پر ان کا تھا۔ چال: الحسن چھپ جاتا ہے، قہیار نے بتایا کہ مزیار الحسن نے ایک اور جگہ پر امن کی پیشکش کی - وہاں مارچ کرتے ہوئے، قہیار کے اشارے سے گھات لگانے والوں کو جھاڑیوں سے باہر لایا، اس نے مزیار کی پٹی پکڑ لی، وہ اسے بغیر کسی نقصان کے لے گئے، کوئی عہد نہیں - 225 میں سامرا لے جایا گیا، بابا کو کوڑے مارے جانے سے پہلے، موت کے گھاٹ اتار دیا گیا۔ شورتا ہال کی طرف سے محراب؛ قہیار اپنے بھائی کے محافظوں کے ہاتھوں مارا گیا، اور تبرستان، میدانی اور پہاڑی، عبداللہ ابن طاہر اور اس کے بعد طاہر کے لیے فتح ہوا۔"
