summary:
  ar: "لما اضطرب صف قريش صمد أبو جهل يحرّض جيشه، ثم قتله غلامان من الأنصار، هما معاذ بن عمرو بن الجموح ومعوذ بن عفراء، فأثخناه، ثم أجهز عليه عبد الله بن مسعود فاحتز رأسه، فقال النبي: هذا فرعون هذه الأمة."
  en: "When Quraysh's ranks broke, Abu Jahl stood firm and urged his men on, then two young Helpers, Mu'adh ibn Amr ibn al-Jamuh and Mu'awwidh ibn Afra, struck him down; Ibn Mas'ud finished him and cut off his head, and the Prophet called him the Pharaoh of this community."
