id: event/death-of-abu-jahl
class: event
kind: death
label: { ar: "مقتل أبي جهل في بدر", en: "The death of Abu Jahl at Badr", es: "La muerte de Abu Jahl en Badr", fr: "La mort d'Abu Jahl à Badr", ur: "بدر میں ابوجہل کی موت", tr: "Bedir'de Ebu Cehl'in öldürülmesi", id: "Pembunuhan Abu Jahl di Badr" }
summary:
  ar: "لما اضطرب صف قريش صمد أبو جهل يحرّض جيشه، ثم قتله غلامان من الأنصار، هما معاذ بن عمرو بن الجموح ومعوذ بن عفراء، فأثخناه، ثم أجهز عليه عبد الله بن مسعود فاحتز رأسه، فقال النبي: هذا فرعون هذه الأمة."
  en: "When Quraysh's ranks broke, Abu Jahl stood firm and urged his men on, then two young Helpers, Mu'adh ibn Amr ibn al-Jamuh and Mu'awwidh ibn Afra, struck him down; Ibn Mas'ud finished him and cut off his head, and the Prophet called him the Pharaoh of this community."
  es: "Cuando las filas de Quraysh se rompieron, Abu Jahl se mantuvo firme e instó a sus hombres a seguir adelante; entonces dos jóvenes Ayudantes, Mu'adh ibn Amr ibn al-Jamuh y Mu'awwidh ibn Afra, lo derribaron; Ibn Mas'ud lo remató y le cortó la cabeza, y el Profeta lo llamó el Faraón de esta comunidad."
  fr: "Lorsque les rangs des Quraysh se rompirent, Abu Jahl resta ferme et encouragea ses hommes, puis deux jeunes auxiliaires, Mu'adh ibn Amr ibn al-Jamuh et Mu'awwidh ibn Afra, le frappèrent; Ibn Mas'ud l'acheva et lui coupa la tête, et le Prophète l'appela le Pharaon de cette communauté."
  ur: "جب قریش کی صفیں ٹوٹ گئیں تو ابو جہل ڈٹ گیا اور اپنے آدمیوں کو آگے بڑھایا، پھر دو نوجوان مددگار معاذ بن عمرو بن الجموع اور معاوذ بن عفرہ نے اسے مارا۔ ابن مسعود نے اسے ختم کیا اور اس کا سر کاٹ دیا، اور نبی نے اسے اس جماعت کا فرعون کہا۔"
  tr: "Kureyş safları dağılmışken, Ebu Cehl dimdik durdu ve ordusunu kışkırttı. Bunun üzerine Ensar'dan iki genç adam, Mu'az ibn Amr ibn el-Cemuh ve Mu'avvez ibn Afra', onu öldürdüler ve ağır yaraladılar. Ardından Abdullah ibn Mes'ud, başını keserek işini bitirdi. Peygamberimiz şöyle buyurdu: \"İşte bu, bu ümmetin Firavunudur.\""
  id: "Ketika barisan Quraisy kacau, Abu Jahl berdiri teguh, membangkitkan semangat pasukannya. Kemudian dua pemuda dari kaum Ansar, Mu’adh ibn Amr ibn al-Jamuh dan Mu’awwadh ibn Afra’, membunuhnya, melukainya dengan parah. Kemudian Abdullah ibn Mas’ud menghabisinya dengan memenggal kepalanya. Nabi bersabda: Inilah Firaun umat ini."
