summary:
  ar: "بطاقة أولية لمعركة عين جوزة ⁦(الكريسون)⁩ سنة ١١٨٧م، إبادة صلاح الدين لفوج فرسان المعبد والاستشفار قرب الناصرة؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Cresson in 1187, Saladin's destruction of the Templar-Hospitaller force near Nazareth weeks before Hattin; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Batalla de Cresson en 1187, la destrucción por parte de Saladino de las fuerzas templarias-hospitalarias cerca de Nazaret semanas antes de Hattin; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de brouillon pour la bataille de Cresson en 1187, la destruction par Saladin des forces templières et hospitalières près de Nazareth quelques semaines avant Hattin; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1187 میں کریسن کی جنگ کے لیے ڈرافٹ کارڈ، ہیٹن سے چند ہفتے قبل ناصرت کے قریب صلاح الدین کی ٹیمپلر-ہسپتال فورس کی تباہی؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1187 yılında gerçekleşen Ayn Jawza (el-Krisun) Muharebesi'nin ön anlatımı; Selahaddin Eyyubi'nin Nasıra yakınlarındaki Tapınak Şövalyeleri alayını ve İstişfar'ı yok etmesi; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Ain Jawza (al-Krisun) pada tahun 1187 M, penghancuran resimen Ksatria Templar oleh Saladin dan Istishfar di dekat Nazareth; sumber-sumbernya belum ditinjau di halaman ini."
