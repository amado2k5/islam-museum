label: { ar: "فتح دار جعفر الصادق بالمدينة ونقل آثاره إلى مصر", en: "The opening of Ja'far al-Sadiq's house in Medina and the removal of its relics to Egypt" }
summary:
  ar: "في سنة أربعمائة أنفذ الحاكم صاحب مصر رجلاً ومعه رسوم الحسنيين والحسينيين وزادهم فيها، وأمره بفتح دار جعفر بن محمد الصادق بالمدينة بعد استئذانهم، ولم يتعرض لتلك الدار أحد منذ وفاة جعفر، فحُمل منها مصحفه وقعب من خشب مطوّق بحديد ودرقة خيزران وحربة وسرير إلى مصر، فرد الحاكم عليهم السرير وأخذ الباقي مدعياً أنه أحق به {cite:muntazam-ibn-al-jawzi j.7 p.246-247}."
  en: "In the year 400, al-Hakim, ruler of Egypt, sent a man with the stipends (rusum) of the Hasanids and Husaynids and added to them, ordering him to open the house of Ja'far ibn Muhammad al-Sadiq in Medina after seeking their permission. No one had touched that house since Ja'far's death. From it were carried to Egypt his copy of the Qur'an, a wooden bowl bound with iron, a bamboo shield, a spear and a bed. Al-Hakim returned the bed to them and took the rest, claiming a better right to it {cite:muntazam-ibn-al-jawzi j.7 p.246-247}."
