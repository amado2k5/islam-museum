id: event/jaffar-al-sadiq-house-400
class: event
kind: other
label: { ar: "فتح دار جعفر الصادق بالمدينة ونقل آثاره إلى مصر", en: "The opening of Ja'far al-Sadiq's house in Medina and the removal of its relics to Egypt", es: "La apertura de la casa de Ja'far al-Sadiq en Medina y el traslado de sus reliquias a Egipto.", fr: "L'ouverture de la maison de Ja'far al-Sadiq à Médine et le transfert de ses reliques en Égypte", ur: "مدینہ میں جعفر الصادق کے گھر کا افتتاح اور اس کے آثار مصر کو ہٹانا", tr: "Medine'deki Cafer el-Sadık'ın evi açıldı ve kalıntıları Mısır'a nakledildi.", id: "Rumah Ja'far al-Sadiq di Madinah dibuka dan reliknya dipindahkan ke Mesir." }
summary:
  ar: "في سنة أربعمائة أنفذ الحاكم صاحب مصر رجلاً ومعه رسوم الحسنيين والحسينيين وزادهم فيها، وأمره بفتح دار جعفر بن محمد الصادق بالمدينة بعد استئذانهم، ولم يتعرض لتلك الدار أحد منذ وفاة جعفر، فحُمل منها مصحفه وقعب من خشب مطوّق بحديد ودرقة خيزران وحربة وسرير إلى مصر، فرد الحاكم عليهم السرير وأخذ الباقي مدعياً أنه أحق به {cite:muntazam-ibn-al-jawzi j.7 p.246-247}."
  en: "In the year 400, al-Hakim, ruler of Egypt, sent a man with the stipends (rusum) of the Hasanids and Husaynids and added to them, ordering him to open the house of Ja'far ibn Muhammad al-Sadiq in Medina after seeking their permission. No one had touched that house since Ja'far's death. From it were carried to Egypt his copy of the Qur'an, a wooden bowl bound with iron, a bamboo shield, a spear and a bed. Al-Hakim returned the bed to them and took the rest, claiming a better right to it {cite:muntazam-ibn-al-jawzi j.7 p.246-247}."
  es: "En el año 400, al-Hakim, gobernante de Egipto, envió a un hombre con los estipendios (rusum) de los hasánidas y husaynidas, a los que añadió más, ordenándole que abriera la casa de Ja'far ibn Muhammad al-Sadiq en Medina tras obtener su permiso. Nadie había tocado esa casa desde la muerte de Ja'far. De ella fueron llevados a Egipto su ejemplar del Corán, un cuenco de madera reforzado con hierro, un escudo de bambú, una lanza y una cama. Al-Hakim les devolvió la cama y se quedó con el resto, alegando tener un derecho superior sobre él {cite:muntazam-ibn-al-jawzi, vol. 7, págs. 246-247}."
  fr: "En l'an 400, al-Hakim, souverain d'Égypte, envoya un homme avec les revenus (rusum) des Hassanides et des Husaynides, auxquels il ajouta des sommes, et lui ordonna d'ouvrir la maison de Ja'far ibn Muhammad al-Sadiq à Médine après avoir obtenu leur permission. Personne n'y avait touché depuis la mort de Ja'far. On en rapporta en Égypte un exemplaire du Coran, un bol en bois cerclé de fer, un bouclier en bambou, une lance et un lit. Al-Hakim leur restitua le lit et s'empara du reste, revendiquant un droit supérieur sur celui-ci (voir Muntazam ibn al-Jawzi, vol. 7, p. 246-247)."
  ur: "سنہ 400 میں مصر کے حاکم الحکیم نے ایک شخص کو حسنیوں اور حسینیوں کے وظیفوں کے ساتھ بھیجا اور ان میں اضافہ کر کے ان سے اجازت لینے کے بعد مدینہ میں جعفر بن محمد الصادق کا گھر کھولنے کا حکم دیا۔ جعفر کی وفات کے بعد سے کسی نے اس گھر کو ہاتھ تک نہیں لگایا۔ اس سے اس کا قرآن کا نسخہ، ایک لکڑی کا پیالہ جو لوہے سے بندھا ہوا تھا، ایک بانس کی ڈھال، ایک نیزہ اور ایک بستر مصر پہنچایا گیا۔ الحکیم نے ان کو بستر واپس کر دیا اور باقی کو لے لیا اور اس پر بہتر حق کا دعویٰ کیا"
  tr: "MÖ 400 yılında Mısır hükümdarı, Hasani ve Hüseyinilerin ücretlerini getiren ve bunları artıran bir adam gönderdi ve onlardan izin aldıktan sonra Medine'deki Cafer bin Muhammed el-Sadık'ın evini açmasını emretti. Cafer'in ölümünden beri o eve kimse dokunmamıştı, bu yüzden Kur'an'ı, demir halkalı tahta bir kaseyi, bambu bir kalkanı, bir mızrağı ve bir yatağı oradan alıp Mısır'a götürdü. Hükümdar yatağı onlara geri verdi ve geri kalanını, kendisinin daha çok hakkı olduğunu iddia ederek aldı. {cite:muntazam-ibn-al-jawzi j.7 p.246-247}"
  id: "Pada tahun 400, penguasa Mesir mengirim seorang utusan dengan uang upah dari kaum Hasan dan Husayni dan menambahkannya, serta memerintahkannya untuk membuka rumah Ja'far bin Muhammad al-Sadiq di Madinah setelah meminta izin mereka. Tidak seorang pun menyentuh rumah itu sejak kematian Ja'far, sehingga Al-Qur'an, sebuah mangkuk kayu dengan cincin besi, sebuah perisai bambu, sebuah tombak, dan sebuah tempat tidur diambil dari rumah itu ke Mesir. Penguasa mengembalikan tempat tidur itu kepada mereka dan mengambil sisanya, dengan alasan bahwa dia lebih berhak atasnya. {cite:muntazam-ibn-al-jawzi j.7 p.246-247}."
