id: event/umar-and-hisham-ibn-hakim-surat-al-furqan
class: event
kind: other
label:
  ar: عمر وهشام بن حكيم وسورة الفرقان بين يدي النبي
  en: Umar, Hisham ibn Hakim and Surat al-Furqan before the Prophet
  ur: عمر، ہشام بن حکیم اور سورۂ فرقان نبی کے سامنے
  es: "Umar, Hisham ibn Hakim y la Sura al-Furqan antes del Profeta"
  fr: "Umar, Hisham ibn Hakim et la sourate al-Furqan avant le Prophète"
  tr: "Ömer, Hişam ibn Hakim ve Peygamberden Önce Furkan Suresi"
  id: "Omar, Hisham ibn Hakim, dan Surah Al-Furqan sebelum Nabi"
summary:
  ar: "سمع عمر بن الخطاب هشام بن حكيم يقرأ سورة الفرقان على غير ما أقرأها النبي، فكاد يعجل عليه ثم أمهله حتى انصرف، وأخذه بردائه إلى النبي؛ فأمر كلاً منهما بالقراءة وقال لكل: هكذا أنزلت، وإن هذا القرآن أنزل على سبعة أحرف فاقرؤوا ما تيسر منه {cite:muwatta-maruf-1997 p.277} {cite:sahih-al-bukhari 2419}."
  en: "Umar ibn al-Khattab heard Hisham ibn Hakim reading Surat al-Furqan in a way other than the Prophet had taught him, nearly rushed on him, then waited until he finished and took him by his cloak to the Prophet; he had each of them recite and told each: it was revealed so, and this Qur'an was revealed in seven ahruf, so read of it what is easy {cite:muwatta-maruf-1997 p.277} {cite:sahih-al-bukhari 2419}."
  ur: "عمر بن الخطاب نے ہشام بن حکیم کو سورۂ فرقان اس طرح پڑھتے سنا جس طرح نبی نے انھیں نہ پڑھائی تھی، قریب تھا کہ ان پر جلدی کریں پھر مہلت دی یہاں تک کہ وہ پھرے، اور انھیں چادر سے پکڑ کر نبی کے پاس لے گئے؛ آپ نے ہر ایک کو پڑھوایا اور ہر ایک سے فرمایا: یوں ہی نازل ہوئی، اور یہ قرآن سات احرف پر نازل ہوا ہے تو جتنا آسان ہو پڑھو {cite:muwatta-maruf-1997 p.277} {cite:sahih-al-bukhari 2419}۔"
  es: "Umar ibn al-Khattab oyó a Hisham ibn Hakim leyendo la Sura al-Furqan de una manera distinta a como el Profeta se la había enseñado, casi se abalanzó sobre él, luego esperó hasta que terminó y lo llevó por su manto ante el Profeta; les hizo recitar a cada uno y les dijo: así fue revelado, y este Corán fue revelado en siete ahruf, así que recitad de él lo que sea fácil {cite:muwatta-maruf-1997 p.277} {cite:sahih-al-bukhari 2419}."
  fr: "Umar ibn al-Khattab entendit Hisham ibn Hakim lire la sourate al-Furqan d'une manière différente de celle que le Prophète lui avait enseignée, faillit se précipiter sur lui, puis attendit qu'il ait terminé et le prit par son manteau pour le conduire au Prophète; celui-ci leur fit réciter à chacun et leur dit: « Il a été révélé ainsi, et ce Coran a été révélé en sept ahruf, alors lisez-en ce qui est facile. » {cite:muwatta-maruf-1997 p.277} {cite:sahih-al-bukhari 2419}."
  tr: "Ömer ibn el-Hattab, Hişam ibn Hakim'in Furkan Suresi'ni Peygamber'in okuduğundan farklı bir şekilde okuduğunu duydu. Neredeyse ona doğru koşacaktı, sonra gitmesini bekledi ve onu cübbesinden tutarak Peygamber'in yanına götürdü. Her birine okumalarını emretti ve her birine şöyle dedi: \"Bu sure böyle indirilmiştir ve bu Kur'an yedi farklı okuma şekliyle indirilmiştir, öyleyse size kolay gelenini okuyun.\" {cite:muwatta-maruf-1997 s.277} {cite:sahih-al-bukhari 2419}"
  id: "Umar bin al-Khattab mendengar Hisham bin Hakim membaca Surat al-Furqan dengan cara yang berbeda dari cara Nabi membacanya. Ia hampir saja menerjangnya, lalu menunggu sampai Hisham pergi, dan menarik jubahnya ke hadapan Nabi. Beliau memerintahkan masing-masing dari mereka untuk membaca dan berkata kepada masing-masing: \"Beginilah cara Al-Qur'an ini diturunkan, dan Al-Qur'an ini diturunkan dalam tujuh cara bacaan, maka bacalah bagian yang mudah bagi kalian.\" {cite:muwatta-maruf-1997 p.277} {cite:sahih-al-bukhari 2419}."
