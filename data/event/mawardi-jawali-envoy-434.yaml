id: event/mawardi-jawali-envoy-434
class: event
kind: other
label:
  ar: "الماوردي رسول الخليفة بتوقيع إلى جلال الدولة في شأن الجوالي، ٤٣٤هـ"
  en: "Al-Mawardi carries the caliph's rescript to Jalal al-Dawla over the Jawali, 434/1042-3"
  ur: "جوالی کے معاملے پر جلال الدولہ کے پاس خلیفہ کے توقیع کے ساتھ ماوردی بطور رسول، 434ھ/1042-3ء"
  es: "Al-Mawardi lleva el rescripto del califa a Jalal al-Dawla sobre el Jawali, 434/1042-3"
  fr: "Al-Mawardi porte le rescrit du calife à Jalal al-Dawla par-dessus le Jawali, 434/1042-3"
  tr: "Halifenin elçisi El-Mawardi, Hicri 434 yılında Celal el-Davla'ya el-Cevali meselesiyle ilgili bir mektup gönderdi."
  id: "Al-Mawardi, utusan Khalifah, mengirim surat kepada Jalal al-Dawla mengenai masalah al-Jawali, pada tahun 434 H."
summary:
  ar: "في سنة أربع وثلاثين وأربعمائة افتُتحت الجوالي في أول المحرم، فأنفذ الملك [[person/jalal-al-dawla|جلال الدولة]] من منع أصحاب الخليفة عنها وأخذ ما استخرجوه منها، فشقّ على الخليفة [[person/al-qaim-bi-amr-illah|القائم]] ذلك وخرج توقيعه إلى جلال الدولة وكان [[person/al-mawardi|الماوردي]] هو الرسول، يقول: «خرج التوقيع من الخليفة وكنت أنا الرسول»، وفيه إنكار عدوله عن شهوده والوفاء بعقوده ونقض ما عقده في الجوالي {cite:muntazam-ibn-al-jawzi j.8 p.455-456}. ويعدّها معجم الإسلام ثالث مهماته الأربع {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}."
  en: "In 434 AH the Jawali was opened in early Muharram, and the king [[person/jalal-al-dawla|Jalal al-Dawla]] sent men to bar the caliph's servants from it and seize what they had collected. This weighed on the caliph [[person/al-qaim-bi-amr-illah|al-Qa'im]], and his rescript went out to Jalal al-Dawla with [[person/al-mawardi|al-Mawardi]] as the messenger — 'the rescript went out from the caliph and I was the messenger', he says — censuring his breach of oaths and repudiation of what he had covenanted over the Jawali {cite:muntazam-ibn-al-jawzi j.8 p.455-456}. The EI2 counts it the third of his four missions {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}."
  ur: "434ھ میں محرم کے آغاز میں جوالی کھول دی گئی اور بادشاہ [[person/jalal-al-dawla|جلال الدولہ]] نے خلیفہ کے کارکنوں کو اس سے روکنے اور ان کے جمع کردہ مال کو چھیننے والے بھیجے۔ اس نے خلیفہ [[person/al-qaim-bi-amr-illah|قائم]] پر گراں گزرا اور ان کا توقیع جلال الدولہ کو بھیجا گیا جس کے رسول [[person/al-mawardi|ماوردی]] تھے — ان کا کہنا ہے «خلیفہ سے توقیع نکلا اور میں رسول تھا» — جس میں ان کے شہود کے خلاف عدول، عہد کی وفا اور جوالی کے معاہدے کی خلاف ورزی کی مذمت تھی {cite:muntazam-ibn-al-jawzi j.8 p.455-456}۔ دائرۃ المعارفِ اسلام اسے ان کی چار مہموں میں تیسری گنتی ہے {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}۔"
  es: "En 434 AH, el Jawali se abrió a principios de Muharram, y el rey [[persona/jalal-al-dawla|Jalal al-Dawla]] envió hombres para impedir el acceso a los sirvientes del califa y confiscar lo que habían recolectado. Esto pesó sobre el califa [[persona/al-qaim-bi-amr-illah|al-Qa'im]], y su rescripto fue enviado a Jalal al-Dawla con [[persona/al-mawardi|al-Mawardi]] como mensajero —'el rescripto salió del califa y yo fui el mensajero', dice— censurando su violación de juramentos y el repudio de lo que había pactado sobre el Jawali {cite:muntazam-ibn-al-jawzi j.8 p.455-456}. El EI2 lo cuenta como la tercera de sus cuatro misiones {cite:encyclopaedia-of-islam-2 vol. 6 pág. 896}."
  fr: "En 434 AH, le Jawali fut ouvert au début du mois de Muharram, et le roi Jalal al-Dawla envoya des hommes pour en interdire l'accès aux serviteurs du calife et saisir ce qu'ils y avaient amassé. Le calife al-Qaim al-Amr-illah en fut affecté, et son rescrit fut adressé à Jalal al-Dawla par al-Mawardi, qui en fut le messager – « le rescrit émanait du calife et j'étais le messager », précise-t-il –, le condamnant pour violation de serment et reniement de l'engagement pris concernant le Jawali (Muntazam ibn al-Jawzi, vol. 8, p. 455-456). L'EI2 la considère comme la troisième de ses quatre missions {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}."
  tr: "Hicri 434 yılında, Muharrem ayının başında el-Cevali açıldı. Kral Celaled-Devla, halifenin adamlarının buraya girmelerinin engellenmesini ve çıkardıkları şeylere el konulmasını emretti. Bu durum Halife el-Kaim'i çok üzdü ve Celaled-Devla'ya bir ferman gönderdi. El-Mevdi elçi olarak, \"Ferman halifeden geldi ve ben elçiydim\" dedi. Ferman, halifenin şahitlerine karşı sözünü tutmadığını ve sözleşmelerine uymadığını reddediyor ve el-Cevali ile ilgili olarak üzerinde anlaştığı şeyden geri adım atıyordu. İslam Ansiklopedisi bunu dört önemli olaydan üçüncüsü olarak kabul eder."
  id: "Pada tahun 434 H, al-Jawali dibuka pada awal Muharram. Raja Jalal al-Dawla kemudian memerintahkan agar para sekutu Khalifah dicegah mengaksesnya dan untuk menyita apa yang telah mereka ambil. Hal ini sangat membuat Khalifah al-Qaim sedih, dan beliau mengirimkan dekrit kepada Jalal al-Dawla. Al-Mawardi adalah utusannya, yang mengatakan, \"Dekrit itu datang dari Khalifah, dan aku adalah utusannya.\" Dekrit tersebut berisi penolakan terhadap pengingkaran saksi oleh Khalifah dan kegagalannya untuk menghormati perjanjiannya, serta pembatalan apa yang telah disepakati mengenai al-Jawali. Ensiklopedia Islam menganggap ini sebagai peristiwa ketiga dari empat peristiwa besar."
