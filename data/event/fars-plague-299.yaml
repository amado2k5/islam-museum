summary:
  ar: "في سنة تسع وتسعين ومائتين ورد الخبر من فارس بطاعون مات فيه سبعة آلاف إنسان، وظهرت ثلاثة كواكب مذنبة في رمضان وذي القعدة منها — في برج الأسد وفي المشرق وفي برج العقرب — وبقيت أيامًا ثم اضمحلت، وفيها غضب المقتدر على علي بن الفرات فحبس وأُخذ كل ما وُجد له ولأهله وأصحابه وانتُهبت دورهم، ووصلت أربعة أحمال مال من مصر قيل إنه وُجد كنز قديم فيه ضلع إنسان طوله أربعة عشر شبرًا زعموا أنه من قوم عاد {cite:muntazam-ibn-al-jawzi p. 390-391}."
  en: "In 299 word came of a plague in Fars that killed seven thousand; three comets appeared in Ramadan and Dhu'l-Qa'da — in Leo, in the east, in Scorpio — lingering days then fading; al-Muqtadir turned on Ibn al-Furat, seized all his household's wealth; and four camel-loads of treasure arrived from Egypt, said to include a fourteen-span human rib ascribed to the people of 'Ad {cite:muntazam-ibn-al-jawzi p. 390-391}."
