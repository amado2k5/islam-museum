label: { ar: "طاعون فارس وثلاثة كواكب مذنبة", en: "The plague in Fars and three comets", es: "La peste en Fars y tres cometas", fr: "La peste à Fars et les trois comètes", ur: "فارس اور تین دومکیت میں طاعون", tr: "İran Vebası ve Üç Kuyruklu Yıldız", id: "Wabah Persia dan Tiga Komet" }
summary:
  ar: "في سنة تسع وتسعين ومائتين ورد الخبر من فارس بطاعون مات فيه سبعة آلاف إنسان، وظهرت ثلاثة كواكب مذنبة في رمضان وذي القعدة منها — في برج الأسد وفي المشرق وفي برج العقرب — وبقيت أيامًا ثم اضمحلت، وفيها غضب المقتدر على علي بن الفرات فحبس وأُخذ كل ما وُجد له ولأهله وأصحابه وانتُهبت دورهم، ووصلت أربعة أحمال مال من مصر قيل إنه وُجد كنز قديم فيه ضلع إنسان طوله أربعة عشر شبرًا زعموا أنه من قوم عاد {cite:muntazam-ibn-al-jawzi p. 390-391}."
  en: "In 299 word came of a plague in Fars that killed seven thousand; three comets appeared in Ramadan and Dhu'l-Qa'da — in Leo, in the east, in Scorpio — lingering days then fading; al-Muqtadir turned on Ibn al-Furat, seized all his household's wealth; and four camel-loads of treasure arrived from Egypt, said to include a fourteen-span human rib ascribed to the people of 'Ad {cite:muntazam-ibn-al-jawzi p. 390-391}."
  es: "En 299 llegó la noticia de una plaga en Fars que mató a siete mil personas; tres cometas aparecieron en Ramadán y Dhu'l-Qa'da —en Leo, en el este, en Escorpio—, días prolongados que luego se desvanecieron; al-Muqtadir se volvió contra Ibn al-Furat y se apoderó de todas las riquezas de su familia; y llegaron de Egipto cuatro cargamentos de camellos con tesoros, que se decía incluían una costilla humana de catorce palmos atribuida a la gente de 'Ad {cite:muntazam-ibn-al-jawzi p. 390-391}."
  fr: "En 299, la nouvelle d'une peste dans le Fars qui tua sept mille personnes parvint; trois comètes apparurent pendant le Ramadan et Dhu'l-Qa'da — dans le Lion, à l'est, dans le Scorpion — pendant quelques jours avant de disparaître; al-Muqtadir se retourna contre Ibn al-Furat, s'empara de toutes les richesses de sa maison; et quatre chargements de chameaux de trésor arrivèrent d'Égypte, comprenant, dit-on, une côte humaine de quatorze empan attribuée au peuple d'Ad {cite: muntazam-ibn-al-jawzi p. 390-391}."
  ur: "299 میں فارس میں طاعون کا ذکر آیا جس نے سات ہزار افراد کو ہلاک کیا۔ رمضان اور ذوالقعدہ میں تین دومکیت نمودار ہوئے — لیو میں، مشرق میں، اسکرپیو میں — طویل عرصے کے بعد دھندلا جاتا ہے۔ مقتدیر نے ابن الفرات کو آن کر دیا، اس کے گھر کا سارا مال ضبط کر لیا۔ اور مصر سے خزانے سے بھرے چار اونٹ آئے، جن میں کہا جاتا ہے کہ ایک چودہ دور والی انسانی پسلی بھی شامل ہے جو قوم عاد سے منسوب ہے۔ 390-391}۔"
  tr: "Hicri 299 yılında İran'dan yedi bin kişinin öldüğü bir veba salgını haberi geldi. Ramazan ve Zilhicce aylarında üç kuyruklu yıldız belirdi; biri Aslan takımyıldızında, biri doğuda ve biri Akrep takımyıldızında. Birkaç gün göründükten sonra kayboldular. O yıl Muktedir, Ali ibn el-Furat'a kızdı, onu hapse attı ve kendisine, ailesine ve arkadaşlarına ait bulunan her şeye el koydu, evlerini yağmaladı. Mısır'dan dört deve yükü para geldi ve içinde on dört karış uzunluğunda bir insan kaburga kemiği bulunan eski bir hazine bulunduğu söylendi; bunun Ad kavmine ait olduğu iddia edildi. {cite:muntazam-ibn-al-jawzi s. 390-391}"
  id: "Pada tahun 299 H, kabar datang dari Persia tentang wabah penyakit yang menewaskan tujuh ribu orang. Tiga komet muncul pada bulan Ramadan dan Dzul Qi'dah, satu di rasi bintang Leo, satu di timur, dan satu di rasi bintang Scorpio. Komet-komet itu bertahan selama beberapa hari lalu menghilang. Pada tahun itu, al-Muqtadir marah kepada Ali ibn al-Furat, sehingga ia memenjarakannya dan menyita semua harta benda miliknya, keluarganya, dan para sahabatnya, serta menjarah rumah-rumah mereka. Empat muatan unta berisi uang tiba dari Mesir, dan konon ditemukan harta karun kuno di dalamnya, berisi tulang rusuk manusia sepanjang empat belas jengkal, yang mereka klaim milik kaum 'Ad. {cite:muntazam-ibn-al-jawzi hlm. 390-391}"
