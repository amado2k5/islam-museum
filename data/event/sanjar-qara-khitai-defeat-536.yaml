summary:
  ar: "في سنة ست وثلاثين وخمسمائة كانت ملحمة عظيمة بين السلطان سنجر وبين الترك الكفرة بما وراء النهر، أُصيب فيها المسلمون وأفلت سنجر في نفر يسير بحيث إنه وصل بلخ في ستة أنفس، وأُسرت زوجته وبنته وقُتل من جيشه مائة ألف أو أكثر، وكانت الترك في ثلاثمائة ألف فارس {cite:shadharat-dhahab p. 591}."
  en: "In 536 the great slaughter between Sultan Sanjar and the unbelieving Turks beyond the River: the Muslims were crushed, Sanjar escaped with a mere handful — reaching Balkh with six souls — his wife and daughter were captured, a hundred thousand or more of his army were killed, and the Turks fielded three hundred thousand horse {cite:shadharat-dhahab p. 591}."
