id: event/sanjar-qara-khitai-defeat-536
class: event
kind: battle
label: { ar: "هزيمة السلطان سنجر أمام الترك وراء النهر سنة 536", en: "Sultan Sanjar's defeat by the Turks beyond the river in 536", es: "La derrota del sultán Sanjar a manos de los turcos al otro lado del río en 536.", fr: "La défaite du sultan Sanjar face aux Turcs au-delà du fleuve en 536", ur: "سلطان سنجر کی 536 میں دریا کے پار ترکوں کے ہاتھوں شکست", tr: "Sultan Sancar'ın 536 yılında nehrin ötesinde Türkler tarafından yenilgiye uğratılması.", id: "Kekalahan Sultan Sanjar oleh bangsa Turki di seberang sungai pada tahun 536" }
summary:
  ar: "في سنة ست وثلاثين وخمسمائة كانت ملحمة عظيمة بين السلطان سنجر وبين الترك الكفرة بما وراء النهر، أُصيب فيها المسلمون وأفلت سنجر في نفر يسير بحيث إنه وصل بلخ في ستة أنفس، وأُسرت زوجته وبنته وقُتل من جيشه مائة ألف أو أكثر، وكانت الترك في ثلاثمائة ألف فارس {cite:shadharat-dhahab p. 591}."
  en: "In 536 the great slaughter between Sultan Sanjar and the unbelieving Turks beyond the River: the Muslims were crushed, Sanjar escaped with a mere handful — reaching Balkh with six souls — his wife and daughter were captured, a hundred thousand or more of his army were killed, and the Turks fielded three hundred thousand horse {cite:shadharat-dhahab p. 591}."
  es: "En 536 tuvo lugar la gran matanza entre el sultán Sanjar y los turcos infieles al otro lado del río: los musulmanes fueron aplastados, Sanjar escapó con apenas un puñado de hombres —llegando a Balkh con seis almas—, su esposa e hija fueron capturadas, cien mil o más de su ejército murieron, y los turcos desplegaron trescientos mil jinetes {cita: shadharat-dhahab p. 591}."
  fr: "En 536, le grand massacre eut lieu entre le sultan Sanjar et les Turcs incrédules au-delà du fleuve: les musulmans furent écrasés, Sanjar s'échappa avec une poignée d'hommes seulement — atteignant Balkh avec six âmes — sa femme et sa fille furent capturées, cent mille hommes ou plus de son armée furent tués, et les Turcs alignèrent trois cent mille cavaliers {cite: shadharat-dhahab p. 591}."
  ur: "536 میں سلطان سنجر اور دریا کے پار کافر ترکوں کے درمیان زبردست قتل عام: مسلمانوں کو کچل دیا گیا، سنجر محض مٹھی بھر فرار ہو کر چھ جانوں کے ساتھ بلخ پہنچا- اس کی بیوی اور بیٹی کو گرفتار کر لیا گیا، اس کی ایک لاکھ یا اس سے زیادہ فوج ماری گئی، اور ترکوں نے تین لاکھ گھوڑوں کو میدان میں اتارا۔ 591}۔"
  tr: "Hicri 536 yılında, Sultan Sancar ile nehrin ötesindeki kâfir Türkler arasında büyük bir savaş oldu. Bu savaşta Müslümanlar zarar gördü ve Sancar küçük bir grupla kaçarak altı kişiyle Belh'e ulaştı. Karısı ve kızı esir alındı ve ordusundan yüz binden fazla kişi öldürüldü. Türklerin ise üç yüz bin süvarisi vardı. {Kaynak: Şadharat-dhahab s. 591}"
  id: "Pada tahun 536 H, terjadi pertempuran besar antara Sultan Sanjar dan kaum kafir Turki di seberang sungai, di mana kaum Muslimin menderita kerugian dan Sanjar melarikan diri dengan sekelompok kecil orang, sehingga ia sampai di Balkh dengan enam orang. Istri dan putrinya ditawan, dan seratus ribu atau lebih pasukannya tewas, sedangkan pasukan Turki berjumlah tiga ratus ribu penunggang kuda. {cite:shadharat-dhahab p. 591}."
