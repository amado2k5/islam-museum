id: event/al-hadi-offers-his-judgment-or-war-and-names-his-descent-in-verse-292
class: event
kind: other
label:
  ar: "أبيات للهادي في عرض حكمه أو الحرب وذكر نسبه وصبره عند النزال، ص307-308"
  en: "Verses of al-Hadi offering his judgment or war, naming his descent and his steadiness at the clash, pp. 307-308"
  ur: "ہادی کے اشعار: اپنے فیصلے یا جنگ کی پیشکش، نسب کا ذکر اور معرکے میں ثابت قدمی، ص307-308"
  es: "Versículos de al-Hadi ofreciendo su juicio o guerra, nombrando su linaje y su firmeza en el choque, págs. 307-308."
  fr: "Versets d'al-Hadi présentant son jugement ou sa guerre, mentionnant sa descente et sa constance lors de l'affrontement, pp. 307-308"
summary:
  ar: "تتمة قصيدة الوافر في ص308: إن صاروا إلى «محمود حكمي» سلموا من حربي، وإلا فليثبتوا للحرب، وقد أعطاه الرحمن نصراً وجيشاً، وحزب الله منصور، ثم يقول إنه ابن محمد وأبوه علي، وإنه الموت لمن رام خداعه وغيث لوليه، ويعيد المحقق إلى ص158-159."
  en: "The rest of the wafir poem on p. 308: if they come to \"my praiseworthy judgment\" they are safe from his war, and if not they should stand for the war, for the Merciful has given him victory and an army and God's party is victorious; then he says he is son of Muhammad and his father is Ali, that he is death to whoever tries to deceive him and rain to his friend, and the editor refers the reader back to pp. 158-159."
  ur: "ص308 پر وافر نظم کا باقی حصہ: اگر وہ «میرے پسندیدہ فیصلے» کی طرف آ جائیں تو میری جنگ سے محفوظ رہیں گے، ورنہ جنگ کے لیے ڈٹ جائیں، کیونکہ رحمان نے اسے فتح اور لشکر دیا ہے اور اللہ کا گروہ فتح یاب ہے؛ پھر وہ کہتا ہے کہ وہ محمد کا بیٹا ہے اور اس کا باپ علی ہے، وہ فریب دینے والے کے لیے موت اور اپنے دوست کے لیے بارش ہے، اور محقق قاری کو ص158-159 کی طرف بھیجتا ہے۔"
  es: "El resto del poema wafir en la página 308: si llegan a \"mi juicio digno de alabanza\" están a salvo de su guerra, y si no, deben mantenerse firmes en la guerra, porque el Misericordioso le ha dado la victoria y un ejército y el partido de Dios es victorioso; luego dice que es hijo de Mahoma y su padre es Ali, que es la muerte para quien intente engañarlo y la lluvia para su amigo, y el editor remite al lector a las páginas 158-159."
  fr: "Le reste du poème du wafir à la page 308: s’ils se soumettent à « mon jugement louable », ils sont à l’abri de sa guerre; sinon, ils doivent se battre, car le Miséricordieux lui a donné la victoire et une armée, et le parti de Dieu est victorieux; puis il dit qu’il est le fils de Muhammad et que son père est Ali, qu’il est la mort pour quiconque tente de le tromper et la pluie pour son ami, et l’éditeur renvoie le lecteur aux pages 158-159."
