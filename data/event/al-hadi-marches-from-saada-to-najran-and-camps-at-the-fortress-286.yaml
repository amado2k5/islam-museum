id: event/al-hadi-marches-from-saada-to-najran-and-camps-at-the-fortress-286
class: event
kind: other
label:
  ar: خروج الهادي من صعدة إلى نجران لليومين مضيا من ذي الحجة ونزوله بالحصن، 286هـ
  en: Al-Hadi's march from Sa'da to Najran on the second of Dhu al-Hijja and his camp at the fortress, 286 AH
  ur: ذی الحجہ کی دو تاریخ کو ہادی کا صعدہ سے نجران روانہ ہونا اور قلعے میں پڑاؤ، 286ھ
summary:
  ar: يخرج الهادي إلى نجران ليومين مضيا من ذي الحجة ويخلف محمد بن عبيد الله والياً بصعدة وعلياً معه ولا عسكر، فينزل البطنة من بلاد بني سعد من خولان ويستنفرهم، ثم يبيت بالركب ويلقاه الوادعيون وأبو محمد وأبو الحسين في أهل الحصن من شاكر وثقيف، فينزل بالحصن في أرض حرث ويبيت فيه.
  en: Al-Hadi leaves for Najran on the second of Dhu al-Hijja, leaving Muhammad ibn Ubaydallah as governor at Sa'da with Ali beside him and no troops, camps at al-Batna in the land of Banu Sa'd of Khawlan and calls them out, spends a night at al-Rakb, is met by the Wadi'is and then by Abu Muhammad and Abu al-Husayn with the people of the fortress from Shakir and Thaqif, and pitches his tent at the fortress in ploughland.
  ur: ہادی ذی الحجہ کی دو تاریخ کو نجران کے لیے نکلتے ہیں، محمد بن عبید اللہ کو صعدہ کا والی اور علی کو ان کے ساتھ چھوڑ جاتے ہیں اور کوئی لشکر نہیں، خولان کے بنو سعد کے علاقے البطنہ میں اترتے اور انہیں بلاتے ہیں، الرکب میں رات گزارتے ہیں، وادعی اور پھر ابو محمد اور ابو الحسین شاکر و ثقیف کے قلعے والوں کے ساتھ ان سے ملتے ہیں، اور وہ قلعے میں کھیت کی زمین پر خیمہ لگاتے ہیں۔
