label: { ar: "هزيمة يوسف بن أبي الساج وأخذ الأنبار" }
summary:
  ar: "في سنة 315هـ سار يوسف بن أبي الساج من واسط إلى الكوفة فوصلها يوم الجمعة ثامن شوال بعد وصول أبي طاهر القرمطي بيوم، فاحتقر قلتهم وتقدم بكتابة كتاب الفتح والبشارة بالظهر قبل اللقاء، فاقتتلوا يوم السبت من محو النهار إلى الغروب ثم باشر أبو طاهر الحرب بنفسه فهزمهم وأسر يوسف وقت المغرب، فخاف أهل بغداد وهموا بالهرب إلى حلوان وهمدان، وأنفذ المقتدر خمسمائة سامرية فيها المقاتلة لتمنعهم من عبور الفرات، فقصدوا الأنبار فقطع أهلها الجسر فنقل أبو طاهر أصحابه إلى الحديثة وأتوه بسفن وعبروا فيها ثلاثمائة رجل فهزموا عسكر الخليفة واستولوا على الأنبار وعقدوا جسرها {cite:kamil-ibn-al-athir p. 125-126}."
  en: "In Shawwal 315 Yusuf ibn Abi'l-Saj reached Kufa a day behind Abu Tahir, despised their fewness, drafted the victory despatch beforehand, and was defeated and taken at sunset; Baghdad panicked toward flight while the Qarmatians crossed from al-Haditha and took al-Anbar, rebuilding its bridge {cite:kamil-ibn-al-athir p. 125-126}."
