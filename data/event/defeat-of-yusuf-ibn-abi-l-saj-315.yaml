label: { ar: "هزيمة يوسف بن أبي الساج وأخذ الأنبار", en: "Defeat of Yusuf ibn Abi l-Saj and the taking of al-Anbar", es: "Derrota de Yusuf ibn Abi l-Saj y toma de al-Anbar.", fr: "Défaite de Yusuf ibn Abi l-Saj et prise d'al-Anbar", ur: "یوسف بن ابی السج کی شکست اور الانبار پر قبضہ", tr: "Yusuf ibn Abi al-Saj'ın yenilgisi ve Anbar'ın ele geçirilmesi", id: "Kekalahan Yusuf ibn Abi al-Saj dan penaklukan Anbar" }
summary:
  ar: "في سنة 315هـ سار يوسف بن أبي الساج من واسط إلى الكوفة فوصلها يوم الجمعة ثامن شوال بعد وصول أبي طاهر القرمطي بيوم، فاحتقر قلتهم وتقدم بكتابة كتاب الفتح والبشارة بالظهر قبل اللقاء، فاقتتلوا يوم السبت من محو النهار إلى الغروب ثم باشر أبو طاهر الحرب بنفسه فهزمهم وأسر يوسف وقت المغرب، فخاف أهل بغداد وهموا بالهرب إلى حلوان وهمدان، وأنفذ المقتدر خمسمائة سامرية فيها المقاتلة لتمنعهم من عبور الفرات، فقصدوا الأنبار فقطع أهلها الجسر فنقل أبو طاهر أصحابه إلى الحديثة وأتوه بسفن وعبروا فيها ثلاثمائة رجل فهزموا عسكر الخليفة واستولوا على الأنبار وعقدوا جسرها {cite:kamil-ibn-al-athir p. 125-126}."
  en: "In Shawwal 315 Yusuf ibn Abi'l-Saj reached Kufa a day behind Abu Tahir, despised their fewness, drafted the victory despatch beforehand, and was defeated and taken at sunset; Baghdad panicked toward flight while the Qarmatians crossed from al-Haditha and took al-Anbar, rebuilding its bridge {cite:kamil-ibn-al-athir p. 125-126}."
  es: "En Shawwal 315, Yusuf ibn Abi'l-Saj llegó a Kufa un día después que Abu Tahir, despreció su escaso número, redactó el informe de victoria con antelación y fue derrotado y tomado al atardecer; Bagdad entró en pánico y huyó mientras los cármatas cruzaban desde al-Haditha y tomaban al-Anbar, reconstruyendo su puente {cite:kamil-ibn-al-athir p. 125-126}."
  fr: "En Shawwal 315, Yusuf ibn Abi'l-Saj atteignit Kufa un jour après Abu Tahir, méprisa leur infériorité numérique, rédigea à l'avance le message de victoire, et fut vaincu et pris au coucher du soleil; Bagdad paniqua et prit la fuite tandis que les Qarmates traversèrent depuis al-Haditha et prirent al-Anbar, reconstruisant son pont {cite:kamil-ibn-al-athir p. 125-126}."
  ur: "شوال 315 میں یوسف بن ابی السج ابو طاہر سے ایک دن پیچھے کوفہ پہنچا، ان کی کمی کو حقیر سمجھ کر، فتح کی روانگی کا مسودہ پہلے سے تیار کیا، اور غروب آفتاب کے وقت شکست کھا کر لے گئے۔ بغداد گھبرا کر پرواز کی طرف بڑھ گیا جب کہ قرمطین نے الحدیدہ سے عبور کیا اور الانبار پر قبضہ کیا، اس کے پل کو دوبارہ تعمیر کیا۔ 125-126}۔"
  tr: "Hicri 315 yılında Yusuf ibn Abi el-Saj, Wasit'ten Kufa'ya doğru yürüdü ve Şevval ayının sekizinci günü, Cuma günü, Ebu Tahir el-Karmati'nin gelişinden bir gün sonra oraya ulaştı. Sayılarının az olduğunu hafife alan Ebu Tahir, karşılaşmadan önce öğle vakti zafer ve müjde mektubu yazdı. Cumartesi günü öğle vaktinden gün batımına kadar savaştılar, ardından Ebu Tahir bizzat savaşa önderlik etti, onları yendi ve gün batımında Yusuf'u esir aldı. Bağdat halkı korktu ve Hulvan ile Hamadan'a kaçmayı planladı. El-Muktadir, Fırat'ı geçmelerini engellemek için beş yüz Samiriyeli savaşçı gönderdi. Anbar'a doğru yöneldiler, ancak Anbar halkı köprüyü kesti. Ebu Tahir, arkadaşlarını Haditha'ya götürdü ve ona gemiler getirdiler; üç yüz adam bu gemilerle karşıya geçti ve halifenin ordusunu yenerek Anbar'ı ele geçirdi ve köprüsünü onardı. {Kaynak: Kamil ibn el-Atir s. 125-126}"
  id: "Pada tahun 315 H, Yusuf bin Abi al-Saj berangkat dari Wasit ke Kufa dan tiba di sana pada hari Jumat, tanggal 8 Syawal, sehari setelah kedatangan Abu Tahir al-Qarmati. Ia meremehkan jumlah mereka yang sedikit dan menulis surat kemenangan dan kabar gembira pada siang hari sebelum pertempuran. Mereka bertempur pada hari Sabtu dari tengah hari hingga matahari terbenam, kemudian Abu Tahir sendiri memimpin pertempuran dan mengalahkan mereka serta menangkap Yusuf saat matahari terbenam. Penduduk Baghdad ketakutan dan bermaksud melarikan diri ke Hulwan dan Hamadan. Al-Muqtadir mengirim lima ratus orang Samaria beserta para pejuang untuk mencegah mereka menyeberangi Sungai Eufrat. Mereka menuju Anbar, tetapi penduduknya memutus jembatan. Abu Tahir memindahkan para sahabatnya ke Haditha, dan mereka membawakan kapal untuknya, dan tiga ratus orang menyeberanginya dan mengalahkan pasukan Khalifah serta merebut Anbar dan memperbaiki jembatannya. {cite:kamil-ibn-al-athir hlm. 125-126}"
