id: event/defeat-of-yusuf-ibn-abi-l-saj-315
class: event
kind: battle
label: { ar: "هزيمة يوسف بن أبي الساج وأخذ الأنبار", en: "Defeat of Yusuf ibn Abi l-Saj and the taking of al-Anbar", es: "Derrota de Yusuf ibn Abi l-Saj y toma de al-Anbar.", fr: "Défaite de Yusuf ibn Abi l-Saj et prise d'al-Anbar", ur: "یوسف بن ابی السج کی شکست اور الانبار پر قبضہ" }
summary:
  ar: "في سنة 315هـ سار يوسف بن أبي الساج من واسط إلى الكوفة فوصلها يوم الجمعة ثامن شوال بعد وصول أبي طاهر القرمطي بيوم، فاحتقر قلتهم وتقدم بكتابة كتاب الفتح والبشارة بالظهر قبل اللقاء، فاقتتلوا يوم السبت من محو النهار إلى الغروب ثم باشر أبو طاهر الحرب بنفسه فهزمهم وأسر يوسف وقت المغرب، فخاف أهل بغداد وهموا بالهرب إلى حلوان وهمدان، وأنفذ المقتدر خمسمائة سامرية فيها المقاتلة لتمنعهم من عبور الفرات، فقصدوا الأنبار فقطع أهلها الجسر فنقل أبو طاهر أصحابه إلى الحديثة وأتوه بسفن وعبروا فيها ثلاثمائة رجل فهزموا عسكر الخليفة واستولوا على الأنبار وعقدوا جسرها {cite:kamil-ibn-al-athir p. 125-126}."
  en: "In Shawwal 315 Yusuf ibn Abi'l-Saj reached Kufa a day behind Abu Tahir, despised their fewness, drafted the victory despatch beforehand, and was defeated and taken at sunset; Baghdad panicked toward flight while the Qarmatians crossed from al-Haditha and took al-Anbar, rebuilding its bridge {cite:kamil-ibn-al-athir p. 125-126}."
  es: "En Shawwal 315, Yusuf ibn Abi'l-Saj llegó a Kufa un día después que Abu Tahir, despreció su escaso número, redactó el informe de victoria con antelación y fue derrotado y tomado al atardecer; Bagdad entró en pánico y huyó mientras los cármatas cruzaban desde al-Haditha y tomaban al-Anbar, reconstruyendo su puente {cite:kamil-ibn-al-athir p. 125-126}."
  fr: "En Shawwal 315, Yusuf ibn Abi'l-Saj atteignit Kufa un jour après Abu Tahir, méprisa leur infériorité numérique, rédigea à l'avance le message de victoire, et fut vaincu et pris au coucher du soleil; Bagdad paniqua et prit la fuite tandis que les Qarmates traversèrent depuis al-Haditha et prirent al-Anbar, reconstruisant son pont {cite:kamil-ibn-al-athir p. 125-126}."
  ur: "شوال 315 میں یوسف بن ابی السج ابو طاہر سے ایک دن پیچھے کوفہ پہنچا، ان کی کمی کو حقیر سمجھ کر، فتح کی روانگی کا مسودہ پہلے سے تیار کیا، اور غروب آفتاب کے وقت شکست کھا کر لے گئے۔ بغداد گھبرا کر پرواز کی طرف بڑھ گیا جب کہ قرمطین نے الحدیدہ سے عبور کیا اور الانبار پر قبضہ کیا، اس کے پل کو دوبارہ تعمیر کیا۔ 125-126}۔"
