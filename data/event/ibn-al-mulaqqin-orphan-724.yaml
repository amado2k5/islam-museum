id: event/ibn-al-mulaqqin-orphan-724
class: event
kind: other
label:
  ar: "يتم ابن الملقن وتربيته في بيت الملقن، نحو ٧٢٤هـ"
  en: "Orphaned, the boy is raised in al-Mulaqqin's house, about 724/1324"
  ur: "یتمی اور ملقن کے گھر میں پرورش، تقریباً 724ھ/1324ء"
summary:
  ar: "توفي والد سراج الدين عمر وله من العمر سنة واحدة، وأوصى به إلى الشيخ شرف الدين عيسى المغربي الملقِّن لكتاب الله بالجامع الطولوني، وكان صالحاً؛ فتزوج أم الشيخ سراج الدين ورباه فعُرف بابن الملقن نسبةً إليه {cite:shadharat-dhahab 7/44}. وفي الإنباء: فمات وله سنة، وأوصى به إلى الشيخ عيسى المغربي وكان يلقن القرآن في الجامع الطولوني فتزوج بأمه فعرف به {cite:durar-kamina-jil-1993 dhayl p. 121 note 2}."
  en: "The boy's father died when 'Umar was one year old, entrusting him to the shaykh Sharaf al-Din 'Isa al-Maghribi — 'al-Mulaqqin', the Qur'an repetition-teacher of the Tulunid mosque — who married the boy's mother and raised him, so that he came to be known as Ibn al-Mulaqqin after him {cite:shadharat-dhahab 7/44} {cite:durar-kamina-jil-1993 dhayl p. 121 note 2}."
  ur: "عمر ایک سال کے تھے کہ والد فوت ہو گئے اور انہیں شیخ شرف الدین عیسیٰ مغربی — «ملقن»، جامع طولون کے معلم قرآن — کے سپرد کیا؛ انہوں نے بچے کی والدہ سے نکاح کیا اور پرورش کی، اسی نسبت سے وہ ابن ملقن کہلائے {cite:shadharat-dhahab 7/44} {cite:durar-kamina-jil-1993 dhayl p. 121 note 2}۔"
