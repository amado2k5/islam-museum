id: event/ibn-al-mulaqqin-orphan-724
class: event
kind: other
label:
  ar: "يتم ابن الملقن وتربيته في بيت الملقن، نحو ٧٢٤هـ"
  en: "Orphaned, the boy is raised in al-Mulaqqin's house, about 724/1324"
  ur: "یتمی اور ملقن کے گھر میں پرورش، تقریباً 724ھ/1324ء"
  es: "Huérfano, el niño es criado en la casa de al-Mulaqqin, alrededor del año 724/1324."
  fr: "Orphelin, le garçon est élevé dans la maison d'al-Mulaqqin, vers 724/1324."
  tr: "Rivayet edenin oğlu, Hicri 724 yılı civarında rivayet edenin evinde büyütülmüştür."
  id: "Putra dari si pembaca Al-Quran dibesarkan di rumah si pembaca Al-Quran, sekitar tahun 724 Hijriah."
summary:
  ar: "توفي والد سراج الدين عمر وله من العمر سنة واحدة، وأوصى به إلى الشيخ شرف الدين عيسى المغربي الملقِّن لكتاب الله بالجامع الطولوني، وكان صالحاً؛ فتزوج أم الشيخ سراج الدين ورباه فعُرف بابن الملقن نسبةً إليه {cite:shadharat-dhahab 7/44}. وفي الإنباء: فمات وله سنة، وأوصى به إلى الشيخ عيسى المغربي وكان يلقن القرآن في الجامع الطولوني فتزوج بأمه فعرف به {cite:durar-kamina-jil-1993 dhayl p. 121 note 2}."
  en: "The boy's father died when 'Umar was one year old, entrusting him to the shaykh Sharaf al-Din 'Isa al-Maghribi — 'al-Mulaqqin', the Qur'an repetition-teacher of the Tulunid mosque — who married the boy's mother and raised him, so that he came to be known as Ibn al-Mulaqqin after him {cite:shadharat-dhahab 7/44} {cite:durar-kamina-jil-1993 dhayl p. 121 note 2}."
  ur: "عمر ایک سال کے تھے کہ والد فوت ہو گئے اور انہیں شیخ شرف الدین عیسیٰ مغربی — «ملقن»، جامع طولون کے معلم قرآن — کے سپرد کیا؛ انہوں نے بچے کی والدہ سے نکاح کیا اور پرورش کی، اسی نسبت سے وہ ابن ملقن کہلائے {cite:shadharat-dhahab 7/44} {cite:durar-kamina-jil-1993 dhayl p. 121 note 2}۔"
  es: "El padre del niño murió cuando 'Umar tenía un año, confiándolo al shaykh Sharaf al-Din 'Isa al-Maghribi — 'al-Mulaqqin', el maestro de repetición del Corán de la mezquita Tulunid — quien se casó con la madre del niño y lo crió, de modo que llegó a ser conocido como Ibn al-Mulaqqin en su honor {cite:shadharat-dhahab 7/44} {cite:durar-kamina-jil-1993 dhayl p. 121 nota 2}."
  fr: "Le père du garçon mourut lorsque 'Umar avait un an, le confiant au cheikh Sharaf al-Din 'Isa al-Maghribi — 'al-Mulaqqin', le professeur de répétition du Coran de la mosquée toulounide — qui épousa la mère du garçon et l'éleva, de sorte qu'il fut connu sous le nom d'Ibn al-Mulaqqin après lui {cite:shadharat-dhahab 7/44} {cite:durar-kamina-jil-1993 dhayl p. 121 note 2}."
  tr: "Siraj al-Din Umar'ın babası o bir yaşındayken vefat etmiş ve onu İbn Tulun Camii'nde Kur'an öğretmeni olan Şeyh Şaraf al-Din İsa al-Maghribi'ye emanet etmiştir. Şeyh Şaraf al-Din İsa al-Maghribi dürüst bir adamdı ve Siraj al-Din'in annesiyle evlenip onu büyütmüştür; bu yüzden ondan sonra İbn al-Mulaqqin (öğretmenin oğlu) olarak tanınmıştır. {kaynak:shadharat-dhahab 7/44}. El-İnba'da ise şöyle denmektedir: Bir yaşındayken vefat etmiş ve onu İbn Tulun Camii'nde Kur'an öğreten Şeyh İsa al-Maghribi'ye emanet etmiştir. Annesiyle evlenmiş ve bu isimle tanınmıştır. {kaynak:durar-kamina-jil-1993 dhayl s. 121 not 2}."
  id: "Ayah Siraj al-Din Umar meninggal dunia ketika ia berusia satu tahun, dan mempercayakannya kepada Syekh Sharaf al-Din Isa al-Maghribi, guru Al-Quran di Masjid Ibn Tulun. Beliau adalah seorang yang saleh, dan beliau menikahi ibu Siraj al-Din dan membesarkannya, sehingga ia dikenal sebagai Ibn al-Mulaqqin (putra guru) sesuai namanya. {kutipan:shadharat-dhahab 7/44}. Dalam al-Inba', disebutkan: Beliau meninggal dunia ketika ia berusia satu tahun, dan mempercayakannya kepada Syekh Isa al-Maghribi, yang mengajar Al-Quran di Masjid Ibn Tulun. Beliau menikahi ibunya, dan ia dikenal dengan nama itu. {kutipan:durar-kamina-jil-1993 dhayl hal. 121 catatan 2}."
