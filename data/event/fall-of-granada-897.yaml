class: event
kind: treaty
label: { ar: "تسليم غرناطة ودخول النصارى الحمراء", en: "The surrender of Granada and the Christian entry into the Alhambra" }
summary:
  ar: "سلّم بوعبديل، آخر سلاطين بني نصر، غرناطة رسمياً إلى الملكين الكاثوليكيين في 2 يناير 1492، أي ثاني ربيع الأول سنة 897هـ، وبه انتهت المملكة النصرية. وتعزو دائرة المعارف الإسلامية السقوط إلى الانقسام بين بوعبديل وعمه الزغل، وإلى استغلال قشتالة للخلافات وتفوقها بالمدفعية وحرب الاستنزاف، وعجز المغرب ومصر المملوكية عن المدد. وتذكر شروط التسليم السبعة والستين رواية المقري، ونقضها النصارى حتى حُمل المسلمون على التنصر سنة 904هـ."
  en: "Boabdil, the last Nasrid sultan, formally surrendered Granada to the Catholic Monarchs on 2 January 1492, 2 Rabi I 897, ending the Nasrid kingdom. The Encyclopaedia of Islam attributes the fall to the split between Boabdil and his uncle al-Zaghal, Castile's exploitation of divisions, its artillery and war of attrition, and the Maghrib's and Mamluk Egypt's inability to send help. Al-Maqqari records sixty-seven surrender conditions, which the Christians later broke until forced conversion in 904 AH."
  ur: "نصری سلطنت کے آخری سلطان بوعبدیل نے 2 جنوری 1492ء کو، یعنی 2 ربیع الاول 897ھ کو، غرناطہ باضابطہ طور پر کیتھولک بادشاہوں کے حوالے کر دیا اور اس کے ساتھ نصری مملکت ختم ہو گئی۔ دائرۃ المعارف الاسلامیہ زوال کا سبب بوعبدیل اور ان کے چچا الزغل کی پھوٹ، قشتالہ کے اختلافات سے فائدہ اٹھانے، توپ خانے اور اعصابی تھکاوٹ کی جنگ، اور مغرب و مملوک مصر کی مدد سے معذوری کو بتاتی ہے۔ مقری سڑسٹھ شرائطِ تسلیم نقل کرتے ہیں جنہیں عیسائیوں نے توڑا، یہاں تک کہ 904ھ میں جبری تنصیر ہوئی۔"
