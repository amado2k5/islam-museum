label: { ar: "تسليم غرناطة ودخول النصارى الحمراء", en: "The surrender of Granada and the Christian entry into the Alhambra" }
summary:
  ar: "في ثاني ربيع الأول سنة سبع وتسعين وثمانمائة استولى النصارى على الحمراء ودخلوها، بعد أن اجتمع سلطان غرناطة أبو عبد الله بأهل الدولة وأرباب المشورة فاتفق الرأي على ارتكاب أخف الضررين وعُقدت بينهم وبين صاحب قشتالة الوثائق على سبعة وستين شرطاً قرئت على أهل غرناطة فانقادوا إليها، منها تأمين الصغير والكبير في النفس والأهل والمال وإبقاء الناس في أماكنهم، وإقامة شريعتهم على ما كانت فلا يحكم عليهم أحد إلا بشريعتهم، وأن تبقى المساجد والأوقاف كما كانت ولا يدخل نصراني دار مسلم ولا يطلع للسور ولا يتطلع على دورهم ولا يدخل مسجداً من مساجدهم، وألا يولى عليهم إلا مسلم أو يهودي ممن كان يتولى عليهم، وأن يفتكّ جميع من أُسر في غرناطة، ومن أراد الجواز إلى بر العدوة لا يمنع ويُجاز في مراكب السلطان، ولا يمنع مؤذن ولا مصلٍ ولا صائم ومن ضحك منه يعاقب، واستوثقوا من أهل غرناطة بنحو خمسمائة من الأعيان رهناً خوف الغدر، ونزل السلطان من الحمراء إلى سكنى البشرات فأندرش ثم احتال في ارتحاله إلى بر العدوة بنص كتاب من صاحب قشتالة فركب البحر ونزل بمليلة واستوطن فاساً؛ ثم إن النصارى نكثوا العهد ونقضوا الشروط عروة عروة حتى آل الحال لحملهم المسلمين على التنصر سنة أربع وتسعمائة بعد أمور أقواها أنهم قالوا للرجل إن جدك كان نصرانياً فأسلم فترجع نصرانياً، فقام أهل البيازين على الحكام وقتلوهم فكان ذلك السبب للتنصر، وامتنعت قرى منها بلفيق وأندرش فاستأصلهم العدو قتلاً وسبياً إلا أهل جبل بلنقة فإن الله أعانهم وقتلوا من العدو مقتلة عظيمة مات فيها صاحب قرطبة وأُخرجوا على الأمان إلى فاس بعيالهم {cite:nafh-tib-maqqari p. 529-531}."
  en: "On 2 Rabi I 897 the Christians took the Alhambra: Granada's sultan Abu Abdallah surrendered on sixty-seven conditions — safety of life, family and property, the shari'a kept, mosques and waqfs untouched, free passage to North Africa — then withdrew to the Alpujarras and crossed to Fez; the Christians broke the treaty clause by clause until forced conversion followed in 904 {cite:nafh-tib-maqqari p. 529-531}."
