label: { ar: "تسليم غرناطة ودخول النصارى الحمراء", en: "The surrender of Granada and the Christian entry into the Alhambra", es: "La rendición de Granada y la entrada de los cristianos a la Alhambra", fr: "La reddition de Grenade et l'entrée des chrétiens dans l'Alhambra", ur: "غرناطہ کا ہتھیار ڈالنا اور الہمبرا میں عیسائیوں کا داخلہ", tr: "Granada'nın teslim olması ve Hristiyanların Elhamra'ya girmesi", id: "Penyerahan diri Granada dan masuknya umat Kristen ke Alhambra" }
summary:
  ar: "سلّم بوعبديل، آخر سلاطين بني نصر، غرناطة رسمياً إلى الملكين الكاثوليكيين في 2 يناير 1492، أي ثاني ربيع الأول سنة 897هـ، وبه انتهت المملكة النصرية. وتعزو دائرة المعارف الإسلامية السقوط إلى الانقسام بين بوعبديل وعمه الزغل، وإلى استغلال قشتالة للخلافات وتفوقها بالمدفعية وحرب الاستنزاف، وعجز المغرب ومصر المملوكية عن المدد. وتذكر شروط التسليم السبعة والستين رواية المقري، ونقضها النصارى حتى حُمل المسلمون على التنصر سنة 904هـ."
  en: "Boabdil, the last Nasrid sultan, formally surrendered Granada to the Catholic Monarchs on 2 January 1492, 2 Rabi I 897, ending the Nasrid kingdom. The Encyclopaedia of Islam attributes the fall to the split between Boabdil and his uncle al-Zaghal, Castile's exploitation of divisions, its artillery and war of attrition, and the Maghrib's and Mamluk Egypt's inability to send help. Al-Maqqari records sixty-seven surrender conditions, which the Christians later broke until forced conversion in 904 AH."
  ur: "نصری سلطنت کے آخری سلطان بوعبدیل نے 2 جنوری 1492ء کو، یعنی 2 ربیع الاول 897ھ کو، غرناطہ باضابطہ طور پر کیتھولک بادشاہوں کے حوالے کر دیا اور اس کے ساتھ نصری مملکت ختم ہو گئی۔ دائرۃ المعارف الاسلامیہ زوال کا سبب بوعبدیل اور ان کے چچا الزغل کی پھوٹ، قشتالہ کے اختلافات سے فائدہ اٹھانے، توپ خانے اور اعصابی تھکاوٹ کی جنگ، اور مغرب و مملوک مصر کی مدد سے معذوری کو بتاتی ہے۔ مقری سڑسٹھ شرائطِ تسلیم نقل کرتے ہیں جنہیں عیسائیوں نے توڑا، یہاں تک کہ 904ھ میں جبری تنصیر ہوئی۔"
  es: "Boabdil, el último sultán nazarí, entregó formalmente Granada a los Reyes Católicos el 2 de enero de 1492 (2 de Rabi I de 897), poniendo fin al reino nazarí. La Enciclopedia del Islam atribuye la caída a la ruptura entre Boabdil y su tío al-Zaghal, al aprovechamiento de las divisiones por parte de Castilla, su artillería y su guerra de desgaste, así como a la incapacidad del Magreb y del Egipto mameluco para enviar ayuda. Al-Maqqari registra sesenta y siete condiciones de rendición, que los cristianos incumplieron posteriormente hasta la conversión forzada en el año 904 de la Hégira."
  fr: "Boabdil, le dernier sultan nasride, capitula officiellement à Grenade face aux Rois Catholiques le 2 janvier 1492 (2 Rabi I 897 de l'Hégire), mettant ainsi fin au royaume nasride. L'Encyclopédie de l'Islam attribue cette chute à la scission entre Boabdil et son oncle al-Zaghal, à l'exploitation des divisions par la Castille, à sa puissance d'artillerie et à sa guerre d'usure, ainsi qu'à l'incapacité du Maghreb et de l'Égypte mamelouke à envoyer des renforts. Al-Maqqari recense soixante-sept conditions de capitulation, que les chrétiens transgressèrent par la suite jusqu'à leur conversion forcée en 904 de l'Hégire."
  tr: "2 Ocak 1492'de (Hicri 897 Rebiü'l-Evvel) son Nasrid sultanı Buabdil, Granada'yı resmen Katolik hükümdarlara teslim ederek Nasrid krallığına son verdi. İslam Ansiklopedisi, bu düşüşü Buabdil ile amcası Zağil arasındaki bölünmeye, Kastilya'nın bu anlaşmazlıklardan faydalanmasına, üstün topçu ve savaş taktiklerine ve Fas ile Memlük Mısır'ın takviye sağlayamamasına bağlar. El-Makkari'nin anlattığı altmış yedi teslimiyet şartı Hristiyanlar tarafından ihlal edilmiş ve bu da Hicri 904 yılında Müslümanların zorla din değiştirmesine yol açmıştır."
  id: "Pada tanggal 2 Januari 1492 (bertepatan dengan Rabi' al-Awwal 897 H), Bu'abdil, sultan Nasrid terakhir, secara resmi menyerahkan Granada kepada Raja dan Ratu Katolik, sehingga mengakhiri kerajaan Nasrid. Ensiklopedia Islam mengaitkan kejatuhan tersebut dengan perpecahan antara Bu'abdil dan pamannya, al-Zaghil, dan eksploitasi perselisihan ini oleh Kastilia, artileri dan taktik perang yang unggul, serta ketidakmampuan Maroko dan Mesir Mamluk untuk menyediakan bala bantuan. Enam puluh tujuh syarat penyerahan, sebagaimana diceritakan oleh al-Maqqari, dilanggar oleh orang-orang Kristen, yang akhirnya menyebabkan pemaksaan konversi umat Islam pada tahun 904 H."
