label: { ar: "سقوط ملطية وهدمها سنة 133", en: "The Fall and Demolition of Malatya, 133" }
summary:
  ar: "عند البلاذري عن الواقدي: لما كانت سنة 133 أقبل قسطنطين الطاغية عامداً لملطية — وكمخ يومئذ في أيدي المسلمين وعليها رجل من بني سليم — فبعث أهل كمخ الصريخ إلى أهل ملطية فخرج إلى الروم منهم بمائتي فارس فواقعهم خيل الروم فهزمتهم، ومال الرومي فأناخ على ملطية فحصر من فيها — والجزيرة يومئذ مفتونة وعاملها موسى بن كعب بحران فوجّهوا رسولاً لهم إليه فلم يمكنه إغاثتهم — وبلغ ذلك قسطنطين فقال لهم «يا أهل ملطية إني لم آتكم إلا على علم بأمركم وتشاغل سلطانكم عنكم، انزلوا على الأمان وأخلوا المدينة أخربها وأمضي عنكم» فأبوا عليه فوضع عليها المجانيق فلما جهدهم البلاء واشتد عليهم الحصار سألوه أن يوثق لهم ففعل ثم استعدوا للرحلة وحملوا ما استثقل لهم وألقوا كثيراً مما ثقل عليهم في الآبار والمخابي ثم خرجوا، وأقام لهم الروم صفين من باب المدينة إلى منقطع أخرهم مخترطي السيوف طرف سيف كل واحد منهم مع طرف سيف الذي يقابله حتى كأنها عقد قنطرة ثم شيّعوهم حتى بلغوا مأمنهم وتوجهوا نحو الجزيرة فتفرقوا فيها، وهدم الروم ملطية فلم يبقوا منها إلا هرياً إنهم شعثوا منه شيئاً يسيراً وهدموا حصن قلوذية."
  en: "In al-Baladhuri from al-Waqidi: in year 133 Constantine the tyrant advanced deliberately on Malatya — Kamkh then being Muslim-held under a Sulami — and Kamkh's people sent the appeal to Malatya's, who rode out with two hundred horse and were beaten by the Roman cavalry; the Roman camped on Malatya and besieged those inside — the Jazira then in turmoil, its governor Musa ibn Ka'b at Harran, the messenger they sent him unable to relieve them — and when Constantine heard of it he told them: 'people of Malatya, I came only knowing your state and your sultan's distraction from you — come down on aman, evacuate the city for me to demolish, and I depart from you'; they refused, so he set mangonels on it, and when affliction ground them down and the siege hardened they asked him for sureties, which he gave; they prepared to march, loaded what they could, threw much of the weight into wells and caches, and went out — the Romans formed two files from the city gate to the end of their line with drawn swords held tip to tip like a bridge's arch, then escorted them to safety, whence they dispersed through the Jazira; the Romans demolished Malatya leaving but a tower they had partly wrecked, and demolished the fortress of Qaludhiya."
