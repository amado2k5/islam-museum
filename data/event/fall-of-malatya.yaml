label: { ar: "سقوط ملطية وهدمها سنة 133", en: "The Fall and Demolition of Malatya, 133", es: "La caída y demolición de Malatya, 133", fr: "La chute et la démolition de Malatya, 133", ur: "ملاتیا کا زوال اور انہدام، 133" }
summary:
  ar: "عند البلاذري عن الواقدي: لما كانت سنة 133 أقبل قسطنطين الطاغية عامداً لملطية — وكمخ يومئذ في أيدي المسلمين وعليها رجل من بني سليم — فبعث أهل كمخ الصريخ إلى أهل ملطية فخرج إلى الروم منهم بمائتي فارس فواقعهم خيل الروم فهزمتهم، ومال الرومي فأناخ على ملطية فحصر من فيها — والجزيرة يومئذ مفتونة وعاملها موسى بن كعب بحران فوجّهوا رسولاً لهم إليه فلم يمكنه إغاثتهم — وبلغ ذلك قسطنطين فقال لهم «يا أهل ملطية إني لم آتكم إلا على علم بأمركم وتشاغل سلطانكم عنكم، انزلوا على الأمان وأخلوا المدينة أخربها وأمضي عنكم» فأبوا عليه فوضع عليها المجانيق فلما جهدهم البلاء واشتد عليهم الحصار سألوه أن يوثق لهم ففعل ثم استعدوا للرحلة وحملوا ما استثقل لهم وألقوا كثيراً مما ثقل عليهم في الآبار والمخابي ثم خرجوا، وأقام لهم الروم صفين من باب المدينة إلى منقطع أخرهم مخترطي السيوف طرف سيف كل واحد منهم مع طرف سيف الذي يقابله حتى كأنها عقد قنطرة ثم شيّعوهم حتى بلغوا مأمنهم وتوجهوا نحو الجزيرة فتفرقوا فيها، وهدم الروم ملطية فلم يبقوا منها إلا هرياً إنهم شعثوا منه شيئاً يسيراً وهدموا حصن قلوذية."
  en: "In al-Baladhuri from al-Waqidi: in year 133 Constantine the tyrant advanced deliberately on Malatya — Kamkh then being Muslim-held under a Sulami — and Kamkh's people sent the appeal to Malatya's, who rode out with two hundred horse and were beaten by the Roman cavalry; the Roman camped on Malatya and besieged those inside — the Jazira then in turmoil, its governor Musa ibn Ka'b at Harran, the messenger they sent him unable to relieve them — and when Constantine heard of it he told them: 'people of Malatya, I came only knowing your state and your sultan's distraction from you — come down on aman, evacuate the city for me to demolish, and I depart from you'; they refused, so he set mangonels on it, and when affliction ground them down and the siege hardened they asked him for sureties, which he gave; they prepared to march, loaded what they could, threw much of the weight into wells and caches, and went out — the Romans formed two files from the city gate to the end of their line with drawn swords held tip to tip like a bridge's arch, then escorted them to safety, whence they dispersed through the Jazira; the Romans demolished Malatya leaving but a tower they had partly wrecked, and demolished the fortress of Qaludhiya."
  es: "En al-Baladhuri de al-Waqidi: en el año 133 Constantino el tirano avanzó deliberadamente sobre Malatya —Kamkh estaba entonces en manos musulmanas bajo el dominio de un Sulami— y la gente de Kamkh envió una petición a la de Malatya, que salió con doscientos caballos y fue derrotada por la caballería romana; los romanos acamparon en Malatya y sitiaron a los que estaban dentro —la Jazira estaba entonces en caos, su gobernador Musa ibn Ka'b en Harran, el mensajero que le enviaron no pudo socorrerlos— y cuando Constantino se enteró de ello les dijo: «gente de Malatya, solo he venido conociendo vuestro estado y la distracción de vuestro sultán de vosotros; bajad a Aman, evacuad la ciudad para que yo la demuela, y me iré de vosotros»; se negaron, así que él colocó mangoneles sobre ella, y cuando la aflicción los debilitó y el asedio se endureció, le pidieron fiadores, que él dio; Se prepararon para marchar, cargaron lo que pudieron, arrojaron gran parte del peso a pozos y depósitos, y salieron. Los romanos formaron dos filas desde la puerta de la ciudad hasta el final de su línea con las espadas desenvainadas, sostenidas punta con punta como el arco de un puente, y luego los escoltaron a un lugar seguro, desde donde se dispersaron por el Jazira. Los romanos demolieron Malatya, dejando solo una torre que habían destruido parcialmente, y demolieron la fortaleza de Qaludhiya."
  fr: "Dans al-Baladhuri d'après al-Waqidi: en l'an 133, Constantin le tyran marcha délibérément sur Malatya — Kamkh étant alors sous domination musulmane et gouvernée par un sulami — et les habitants de Kamkh envoyèrent un appel à ceux de Malatya, qui partirent avec deux cents cavaliers et furent battus par la cavalerie romaine; les Romains campèrent à Malatya et assiégèrent ses habitants — la Jazira était alors en proie au chaos, son gouverneur Musa ibn Ka'b se trouvant à Harran, le messager qu'ils lui envoyèrent étant incapable de les secourir — et lorsque Constantin l'apprit, il leur dit: « Habitants de Malatya, je ne suis venu que parce que je connais votre état et que votre sultan vous détourne de vous — descendez sur terre, évacuez la ville pour que je la démolisse, et je vous quitterai »; ils refusèrent, alors il fit installer des mangonneaux sur la ville, et lorsque l'affliction les accabla et que le siège s'intensifia, ils lui demandèrent des cautions, qu'il leur accorda; Ils se préparèrent à marcher, chargèrent ce qu'ils purent, jetèrent une grande partie de leur butin dans des puits et des caches, et sortirent. Les Romains formèrent deux files depuis la porte de la ville jusqu'au bout de leur ligne, les épées dégainées point à point comme les arches d'un pont, puis les escortèrent en lieu sûr, d'où ils se dispersèrent à travers la Jazira. Les Romains rasèrent Malatya, ne laissant derrière eux qu'une tour partiellement détruite, et détruisirent la forteresse de Qaludhiya."
  ur: "الواقدی سے البلادھوری میں: سال 133 میں قسطنطنیہ نے جان بوجھ کر مالتیا پر پیش قدمی کی - کامخ اس وقت ایک سلیمی کے زیر قبضہ تھا - اور کامخ کے لوگوں نے مالٹیہ کے پاس اپیل بھیجی، جو دو سو گھوڑوں کے ساتھ نکلے اور رومی گھڑ سواروں کے ہاتھوں مارے گئے۔ رومیوں نے ملطیہ پر ڈیرے ڈالے اور اندر والوں کا محاصرہ کر لیا- جزیرہ پھر ہنگامہ آرائی میں، حران میں اس کے گورنر موسیٰ بن کعب کو قاصد بھیجا کہ وہ انہیں فارغ کرنے میں ناکام رہے- اور جب قسطنطین کو یہ خبر ملی تو اس نے ان سے کہا: 'ملاتیہ کے لوگو، میں صرف تمہاری حالت کو جان کر آیا ہوں اور تمہارا ایک سلطان میرے لیے شہر سے باہر نکلا ہے، اور تمھارے شہر سے باہر نکلنے کے لیے تمھارا سلطان آیا ہے۔' مسمار کرنے کے لیے، اور میں تم سے دور ہو جاؤں گا۔ انہوں نے انکار کر دیا، تو اس نے اس پر منگولین لگا دیے، اور جب مصیبت نے انہیں گرا دیا اور محاصرہ سخت ہو گیا تو انہوں نے اس سے ضمانتیں مانگیں، جو اس نے دے دیں۔ انہوں نے مارچ کرنے کی تیاری کی، جو کچھ وہ لاد سکتے تھے، بہت زیادہ وزن کنوؤں اور کیچوں میں پھینک دیا، اور باہر نکل گئے - رومیوں نے شہر کے دروازے سے اپنی لکیر کے آخر تک دو فائلیں بنائیں جن پر تلواریں تھیں جن میں پل کی محراب کی طرح نوکیں تھیں، پھر انہیں حفاظت کی طرف لے گئے، جہاں سے وہ جزیرے کے راستے منتشر ہو گئے۔ رومیوں نے مالتیا کو چھوڑ کر گرا دیا لیکن ایک ٹاور جو انہوں نے جزوی طور پر تباہ کر دیا تھا، اور قلودیہ کے قلعے کو منہدم کر دیا۔"
