label: { ar: "زواج القائم بأمر الله بأخت طغرل بك", en: "The marriage of al-Qa'im bi-Amr Allah to Tughril Beg's sister", es: "El matrimonio de al-Qa'im bi-Amr Allah con la hermana de Tughril Beg", fr: "Le mariage d'al-Qa'im bi-Amr Allah avec la sœur de Tughril Beg", ur: "القائم بن عمرو اللہ کی شادی طغرل بیگ کی بہن سے", tr: "Al-Qaim Amr Allah'ın Tughril Beg'in kız kardeşiyle evliliği", id: "Pernikahan Al-Qaim Amr Allah dengan saudara perempuan Tughril Beg." }
summary:
  ar: "في سنة ثمان وأربعين وأربعمائة تزوج القائم بأمر الله بأخت طغرل بك، وتمكن القائم وعظمت الخلافة بسلطنة طغرل بك {cite:shadharat-dhahab p. 278}."
  en: "In 448 the caliph al-Qa'im bi-Amr Allah married Tughril Beg's sister; al-Qa'im's position was secured and the caliphate magnified by Tughril's sultanate {cite:shadharat-dhahab p. 278}."
  es: "En 448, el califa al-Qa'im bi-Amr Allah se casó con la hermana de Tughril Beg; la posición de al-Qa'im quedó asegurada y el califato se engrandeció con el sultanato de Tughril {cite:shadharat-dhahab p. 278}."
  fr: "En 448, le calife al-Qa'im bi-Amr Allah épousa la sœur de Tughril Beg; la position d'al-Qa'im fut assurée et le califat magnifié par le sultanat de Tughril {cite:shadharat-dhahab p. 278}."
  ur: "448 میں خلیفہ القائم بن عمرو اللہ نے طغرل بیگ کی بہن سے شادی کی۔ القائم کا عہدہ محفوظ ہو گیا اور خلافت طغرل کی سلطنت نے بڑھائی۔ 278}۔"
  tr: "Hicri 448 yılında Al-Qaim bi-Amr Allah, Tughril Beg'in kız kardeşiyle evlendi ve Al-Qaim güçlendi, Tughril Beg'in saltanatı ile birlikte halifelik de güçlendi. {kaynak: Shadharat-dhahab s. 278}"
  id: "Pada tahun 448 H, Al-Qaim bi-Amr Allah menikahi saudara perempuan Tughril Beg, dan Al-Qaim menjadi kuat dan Kekhalifahan semakin berkuasa dengan kesultanan Tughril Beg {cite:shadharat-dhahab p. 278}."
