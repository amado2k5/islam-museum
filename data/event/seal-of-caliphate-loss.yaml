id: event/seal-of-caliphate-loss
class: event
kind: other
label: { ar: "ضياع خاتم الخلافة في بئر أريس", en: "The Caliphal Seal Lost in the Well", es: "El sello califal perdido en el pozo", fr: "Le sceau caliphal perdu dans le puits", ur: "خلیفہ کی مہر کنویں میں کھو گئی۔", tr: "Aris kuyusunda halifelik yüzüğünün kaybolması", id: "Hilangnya cincin Kekhalifahan di sumur Aris" }
summary:
  ar: "اتخذ رسول الله خاتماً من فضة ونقش عليه محمد رسول الله فكان أبو بكر يختم به ثم عمر ثم عثمان وكان في يده فسقط من يده في البئر فنزحت فلم يقدر عليه وذلك في النصف من خلافته فاتخذ خاتماً ونقش عليه محمد رسول الله في ثلاثة أسطر وقال الحسن كان خاتم رسول الله من ورق وكان فصه حبشياً وقال أنس قال النبي قد صنعت خاتماً فلا ينقشن أحد على نقشه."
  en: "The Prophet's silver seal, engraved 'Muhammad, Messenger of God', passed to Abu Bakr's sealing, then Umar's, then Uthman's — and slipped from his hand into the well mid-caliphate; it was emptied and the seal not recovered, so he had a seal made engraved 'Muhammad, Messenger of God' in three lines. Variants: all silver, fass and ring, or a silver ring with an Abyssinian stone; and his word, 'I have made a seal — let no one engrave upon its engraving'."
  es: "El sello de plata del Profeta, grabado con la inscripción \"Muhammad, Mensajero de Dios\", pasó a manos de Abu Bakr, luego a las de Umar, después a las de Uthman, y se le cayó de la mano al pozo a mediados del califato; este se vació y el sello no se recuperó, por lo que mandó hacer un sello con la inscripción \"Muhammad, Mensajero de Dios\" en tres líneas. Variantes: todo de plata, fass y anillo, o un anillo de plata con una piedra abisinia; y su palabra: \"He hecho un sello; que nadie grabe sobre su grabado\"."
  fr: "Le sceau d'argent du Prophète, portant l'inscription « Muhammad, Messager de Dieu », passa entre les mains d'Abou Bakr, puis d'Omar, puis d'Othman. Il tomba ensuite dans un puits au milieu du califat; celui-ci fut vidé et le sceau ne fut pas retrouvé. Le Prophète fit alors réaliser un nouveau sceau portant l'inscription « Muhammad, Messager de Dieu » sur trois lignes. Il en existait des variantes: entièrement en argent, avec un anneau, ou un anneau d'argent orné d'une pierre d'Abyssinie. Il prononça alors ces mots: « J'ai fait apposer un sceau; que nul n'y grave. »"
  ur: "نبی کی چاندی کی مہر، جس پر 'محمد، رسول اللہ' کندہ تھا، ابوبکر کی مہر، پھر عمر کی، پھر عثمان کی - اور ان کے ہاتھ سے پھسل کر خلافت کے وسط میں گر گئی۔ اسے خالی کر دیا گیا اور مہر بحال نہیں ہوئی، اس لیے اس نے ایک مہر بنائی تھی جس پر تین سطروں میں 'محمد، رسول اللہ' کندہ تھا۔ متغیرات: تمام چاندی، فاس اور انگوٹھی، یا حبشی پتھر کے ساتھ چاندی کی انگوٹھی؛ اور اس کا کلام، 'میں نے ایک مہر بنائی ہے - اس کی کندہ کاری پر کوئی کندہ نہ کرے'۔"
  tr: "Allah'ın Elçisi gümüş bir yüzük aldı ve üzerine \"Muhammed, Allah'ın Elçisi\" yazısını kazıdı. Ebu Bekir, sonra Ömer, sonra Osman bu yüzükle mühür vururdu. Yüzük onun elindeydi, sonra elinden düşüp kuyuya düştü ve onu geri alamadı. Bu, halifeliğinin ortasındaydı. Bunun üzerine bir yüzük aldı ve üzerine üç satır halinde \"Muhammed, Allah'ın Elçisi\" yazısını kazıdı. Hasan, Allah'ın Elçisi'nin yüzüğünün gümüşten yapıldığını ve taşının Habeş taşından olduğunu söyledi. Enes, Peygamber'in \"Bir yüzük yaptırdım, kimse üzerine yazı kazımasın\" dediğini rivayet etti."
  id: "Rasulullah SAW mengambil sebuah cincin perak dan mengukir di atasnya tulisan Muhammad, Rasulullah SAW. Abu Bakar biasa menggunakannya sebagai stempel, kemudian Umar, lalu Utsman. Cincin itu berada di tangannya, lalu jatuh ke dalam sumur, sehingga airnya habis dan ia tidak dapat mengambilnya kembali. Kejadian ini terjadi di tengah masa kekhalifahannya. Maka beliau mengambil sebuah cincin dan mengukir di atasnya tulisan Muhammad, Rasulullah SAW, dalam tiga baris. Al-Hasan berkata bahwa cincin Rasulullah SAW terbuat dari perak dan batunya berasal dari Abyssinia. Anas berkata bahwa Nabi SAW bersabda, “Aku telah membuat sebuah cincin, maka jangan ada yang mengukir di atas ukirannya.”"
