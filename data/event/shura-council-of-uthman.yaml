summary:
  ar: "جعل عمر الأمر شورى بين ستة من أصحاب النبي، تكلم سعد بن أبي وقاص وعلي، وذكر عمر طلحة بالاسم وأسند الأمر إلى عبد الرحمن بن عوف {cite:tabari-tarikh-abu-al-fadl j.4 p.236}. وفهرس الجزء يسمّي «قصة الشورى» في أخبار سنة 23هـ {cite:tabari-tarikh-abu-al-fadl j.4 p.579}."
  en: "Umar made the succession a shura among six of the Prophet's Companions. Sa'd ibn Abi Waqqas and Ali spoke; Umar mentioned Talha by name and entrusted the matter to Abd al-Rahman ibn Awf {cite:tabari-tarikh-abu-al-fadl j.4 p.236}. The volume's index names 'the story of the shura' under the events of the year 23 AH {cite:tabari-tarikh-abu-al-fadl j.4 p.579}."
