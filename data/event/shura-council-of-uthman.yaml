label: { ar: "الشورى في خلافة عثمان", en: "The shura council in the caliphate of Uthman", es: "El consejo shura en el califato de Uthman", fr: "Le conseil de la choura dans le califat d'Uthman", ur: "خلافت عثمان میں شوریٰ کونسل", tr: "Osman'ın Halifeliği Döneminde İstişare", id: "Konsultasi pada masa Kekhalifahan Utsman" }
summary:
  ar: "جعل عمر الأمر شورى بين ستة من أصحاب النبي، تكلم سعد بن أبي وقاص وعلي، وذكر عمر طلحة بالاسم وأسند الأمر إلى عبد الرحمن بن عوف {cite:tabari-tarikh-abu-al-fadl j.4 p.236}. وفهرس الجزء يسمّي «قصة الشورى» في أخبار سنة 23هـ {cite:tabari-tarikh-abu-al-fadl j.4 p.579}."
  en: "Umar made the succession a shura among six of the Prophet's Companions. Sa'd ibn Abi Waqqas and Ali spoke; Umar mentioned Talha by name and entrusted the matter to Abd al-Rahman ibn Awf {cite:tabari-tarikh-abu-al-fadl j.4 p.236}. The volume's index names 'the story of the shura' under the events of the year 23 AH {cite:tabari-tarikh-abu-al-fadl j.4 p.579}."
  es: "Umar convirtió la sucesión en una shura entre seis de los Compañeros del Profeta. Sa'd ibn Abi Waqqas y Ali hablaron; Umar mencionó a Talha por su nombre y encomendó el asunto a Abd al-Rahman ibn Awf {cite:tabari-tarikh-abu-al-fadl j.4 p.236}. El índice del volumen titula «la historia de la shura» bajo los acontecimientos del año 23 AH {cite:tabari-tarikh-abu-al-fadl j.4 p.579}."
  fr: "Umar organisa une shura (assemblée consultative) sur la succession du Prophète, réunissant six de ses Compagnons. Sa'd ibn Abi Waqqas et Ali prirent la parole; Umar mentionna Talha nommément et confia la question à Abd al-Rahman ibn Awf (voir: Tabari-tarikh-abu-al-fadl, vol. 4, p. 236). L'index du volume mentionne « le récit de la shura » dans la section consacrée aux événements de l'an 23 de l'Hégire (voir: Tabari-tarikh-abu-al-fadl, vol. 4, p. 579)."
  ur: "عمر نے جانشینی کو چھ صحابہ میں سے ایک شوری بنایا۔ سعد ابن ابی وقاص اور علی نے کہا؛ عمر نے طلحہ کا نام لے کر ذکر کیا اور معاملہ عبدالرحمٰن بن عوف کے سپرد کر دیا۔ جلد کے اشاریہ میں سال 23 ہجری کے واقعات کے تحت 'شوری کی کہانی' کا نام دیا گیا ہے۔"
  tr: "Ömer, meseleyi Peygamberin altı sahabesi arasında istişareye açtı. Sa'd ibn Abi Waqqas ve Ali konuştular ve Ömer, Talha'nın adını anarak meseleyi Abdülrahman ibn Awf'a emanet etti. {Kaynak: Tabari-tarikh-abu-al-fadl cilt 4, s. 236}. Kitabın indeksi, Hicri 23. yıl olaylarında \"İstişare Öyküsü\" başlığını taşımaktadır. {Kaynak: Tabari-tarikh-abu-al-fadl cilt 4, s. 579}."
  id: "Umar menjadikan masalah itu sebagai musyawarah di antara enam sahabat Nabi. Sa'd ibn Abi Waqqas dan Ali berbicara, dan Umar menyebut nama Talha dan mempercayakan masalah itu kepada Abd al-Rahman ibn Awf {cite:tabari-tarikh-abu-al-fadl j.4 p.236}. Indeks buku tersebut berjudul \"Kisah Musyawarah\" dalam peristiwa tahun 23 H {cite:tabari-tarikh-abu-al-fadl j.4 p.579}."
