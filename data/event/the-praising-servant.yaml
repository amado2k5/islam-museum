id: event/the-praising-servant
class: event
kind: other
label:
  ar: "العبد الذي قال مقالة عظّمت الملائكة"
  en: "The servant whose words stumped the angels"
  ur: "وہ بندہ جس کی بات پر فرشتے حیران"
summary:
  ar: "يروي ابن ماجه عن النبي أن عبداً من عباد الله قال «يا رب لك الحمد كما ينبغي لجلال وجهك ولعظيم سلطانك»، فعجز الملكان عن كتابتها فصعدا إلى السماء، فأوحى الله إليهما «اكتبها، ثم ارفعها، حتى أتقدم بين يديها أربع كلمات» {cite:sunan-ibn-majah} [[passage/ibnmajah-3801|ابن ماجه 3801]]."
  en: "Ibn Majah relates from the Prophet that a servant of God said 'my Lord, Yours is the praise as befits the majesty of Your face and the greatness of Your dominion'; the two angels could not write it, so they ascended to heaven, and God revealed to them 'write it, then raise it — until I precede it with four words' {cite:sunan-ibn-majah} [[passage/ibnmajah-3801|Ibn Majah 3801]]."
  ur: "ابن ماجہ نبی سے روایت کرتے ہیں کہ اللہ کے ایک بندے نے کہا «اے میرے رب، تیری ہی حمد ہے جیسی تیری صورت کی شان اور تیری بادشاہت کی عظمت کے لائق ہے»، تو دونوں فرشتے اسے لکھنے سے عاجز ہو گئے اور آسمان پر چڑھ گئے، تو اللہ نے ان پر وحی فرمائی «اسے لکھو، پھر اسے اوپر اٹھاؤ، یہاں تک کہ میں اس سے پہلے چار الفاظ رکھتا ہوں» {cite:sunan-ibn-majah} [[passage/ibnmajah-3801|ابن ماجہ 3801]]۔"
