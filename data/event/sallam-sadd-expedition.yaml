label: { ar: "بعثة سلام الترجمان إلى سد يأجوج ومأجوج", en: "Sallam the Interpreter's mission to the barrier of Gog and Magog", es: "La misión de Sallam el Intérprete a la barrera de Gog y Magog.", fr: "La mission de Sallam l'Interprète au-delà de la barrière de Gog et Magog", ur: "یاجوج و ماجوج کی رکاوٹ کے لیے ترجمان کا مشن سلام" }
summary:
  ar: "رأى الواثق مناماً كأن سدّ ذي القرنين قد انفتل، فلم يجد في دولته من يصلح لمعاينته إلا سلام الترجمان الذي يتكلم بثلاثين لساناً؛ فجهّزه بخمسين رجلاً وخمسة آلاف دينار ووصله بعشرة آلاف درهم ومائتي بغل للزاد والماء واللبابيد والكستباذات بالفراء، وسار بسلسلة كتب من صاحب أرمينية إلى صاحب السرير إلى ملك اللان إلى فيلان شاه إلى طرخان ملك الخزر، ثم سار من عند ملك الخزر نحو سبعة وعشرين يوماً فاجتاز أرضاً سوداء منتنة ومدناً خربتها يأجوج ومأجوج حتى بلغ حصوناً ينزلها أهل الجبال الناطقون بالعربية والفارسية قرب شعبة الجبل التي فيها السد، فرأى الباب الحديد مصراعاه خمسون ذراعاً في خمس وسبعين ذراعاً وعليه قفل سبعة أذرع لا يحتضنه رجلان ومفتاح ذو اثنتي عشرة دندانة، وكان رئيس الحصون يقرع القفل كل اثنين وخميس فيسمع من وراء الباب أن هناك حفظة، وأملى سلام الخبر جملة على ابن خرداذبه {cite:masalik-mamalik-ibn-khurdadhbih pp. 162-168}."
  en: "Al-Wathiq dreamt that Dhu'l-Qarnayn's barrier had loosened, and found none fit to inspect it save Sallam the Interpreter of thirty tongues: equipped with fifty men, five thousand dinars, two hundred mules and cold-weather gear, he passed by letters of introduction from the governor of Armenia to the lord of Sarir, the Alan king, Filan Shah and the Khazar Tarkhan, then crossed the black stinking land and the cities ruined by Gog and Magog to the forts near the mountain cleft — seeing the iron gate with leaves fifty by seventy-five cubits, a lock two men cannot embrace, a twelve-toothed key, and the ritual of knocking on it each Monday and Thursday so those beyond know guards remain; he dictated the whole report to Ibn Khurdadhbih {cite:masalik-mamalik-ibn-khurdadhbih pp. 162-168}."
  es: "Al-Wathiq soñó que la barrera de Dhu'l-Qarnayn se había aflojado y no encontró a nadie apto para inspeccionarla salvo Sallam, el intérprete de treinta lenguas: equipado con cincuenta hombres, cinco mil dinares, doscientas mulas y ropa de abrigo, pasó por cartas de presentación del gobernador de Armenia al señor de Sarir, al rey Alan, a Filan Shah y al jázaro Tarkhan, luego cruzó la tierra negra y maloliente y las ciudades arruinadas por Gog y Magog hasta los fuertes cerca de la hendidura de la montaña, viendo la puerta de hierro con hojas de cincuenta por setenta y cinco codos, una cerradura que dos hombres no pueden abrazar, una llave de doce dientes y el ritual de llamar a ella cada lunes y jueves para que los que están más allá no tengan guardias; dictó todo el informe a Ibn Khurdadhbih {cite:masalik-mamalik-ibn-khurdadhbih pp. 162-168}."
  fr: "Al-Wathiq rêva que la barrière de Dhu'l-Qarnayn s'était relâchée et ne trouva personne d'autre que Sallam, l'interprète des trente langues, apte à l'inspecter. Accompagné de cinquante hommes, de cinq mille dinars, de deux cents mules et de vêtements chauds, il passa, muni de lettres de recommandation du gouverneur d'Arménie, auprès du seigneur de Sarir, du roi Alan, de Filan Shah et du Khazar Tarkhan, puis traversa la terre noire et nauséabonde et les villes ravagées par Gog et Magog jusqu'aux forts situés près de la faille montagneuse. Il y vit la porte de fer aux vantaux de cinquante coudées sur soixante-quinze, une serrure que deux hommes ne pouvaient saisir, une clé à douze dents et le rituel consistant à frapper à sa porte chaque lundi et jeudi afin que ceux qui étaient au-delà sachent qu'il n'y avait pas de gardes. Il dicta le récit complet à Ibn Khurdadhbih {cite:masalik-mamalik-ibn-khurdadhbih pp. 162-168}."
  ur: "الوثیق نے خواب میں دیکھا کہ ذوالقرنین کی رکاوٹ ڈھیلی ہو گئی ہے، اور اس کا معائنہ کرنے کے لیے تیس زبانوں کے مترجم کے علاوہ کوئی نہیں پایا: پچاس آدمیوں، پانچ ہزار دینار، دو سو خچروں اور سرد موسم کے سامان سے لیس، وہ ارمین کے گورنر کے تعارفی خطوط سے گزرا۔ فلان شاہ اور خضر ترکھان، پھر کالی بدبودار سرزمین اور یاجوج ماجوج کے تباہ شدہ شہروں کو پار کرتے ہوئے پہاڑی شگاف کے قریب قلعوں تک پہنچے - پچاس پچہتر ہاتھ پتوں والے لوہے کے دروازے کو دیکھ کر، ایک تالہ دو آدمیوں کو گلے نہیں لگا سکتا، ایک بارہ دانت والی چابی، اور ہر پیر اور جمعرات کو دستک دینے کی رسم ہے، اس لیے ہر سوموار اور جمعرات کو اس کی حفاظت کی رسم جاری ہے۔ اس نے پوری رپورٹ ابن خردذبیح کو لکھوائی {حوالہ: مسالک-ممالک-ابن خردابیح صفحہ 162-168}۔"
