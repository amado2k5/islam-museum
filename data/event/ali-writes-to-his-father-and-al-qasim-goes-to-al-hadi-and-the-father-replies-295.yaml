id: event/ali-writes-to-his-father-and-al-qasim-goes-to-al-hadi-and-the-father-replies-295
class: event
kind: other
label:
  ar: "علي يكتب إلى أبيه ويرسل القاسم إلى الهادي، والأب يرد بالثبات وترك طلب الخروج، 295هـ"
  en: "Ali ibn Muhammad writes to his father, al-Qasim goes to al-Hadi, and the father replies to hold the fort and not ask leave again, 295 AH, pp. 368-369"
  ur: "علی کا والد کو لکھنا، القاسم کا ہادی کے پاس جانا، اور والد کا ثابت قدم رہنے اور دوبارہ اجازت نہ مانگنے کا جواب، 295ھ، ص368-369"
  es: "Ali ibn Muhammad escribe a su padre, al-Qasim va a al-Hadi, y el padre responde que mantenga la posición y no vuelva a pedir permiso, 295 AH, pp. 368-369"
  fr: "Ali ibn Muhammad écrit à son père, al-Qasim se rend auprès d'al-Hadi, et le père répond de tenir bon et de ne plus demander de permission, 295 AH, pp. 368-369"
  tr: "Ali babasına mektup yazar ve el-Kâsım'ı el-Hadi'ye gönderir; babası ise kararlılığını koruyarak ayrılma isteğini reddeder (Hicri 295)."
  id: "Ali menulis surat kepada ayahnya dan mengirim al-Qasim kepada al-Hadi, dan sang ayah menjawab dengan tetap teguh dan membatalkan permintaan untuk pergi, 295 H."
summary:
  ar: "لما رأى علي بن محمد خذلان همدان له، أرسل أخاه القاسم إلى الهادي يخبره ويسأله تعجيل المدد، وكتب إلى أبيه يسأله الخروج من القرية. فرد عليه أبوه بالثبات في موضعه حتى يرد المدد، ثم كتب إليه كتاباً ثانياً يقول فيه إنهم لم يقوموا إلا طاعة لله، وينهاه عن أن يعيد طلب الخروج."
  en: "When Ali ibn Muhammad saw Hamdan's desertion, he sent his brother al-Qasim to al-Hadi to report it and ask for speedy reinforcements, and wrote to his father asking to leave the village. His father replied that he should hold his position until reinforcements arrived. In a second letter the father wrote that they had risen only in obedience to God, and told his son not to write again asking leave."
  ur: "جب علی بن محمد نے ہمدان کی بے وفائی دیکھی تو اس نے اپنے بھائی القاسم کو ہادی کے پاس اطلاع دینے اور جلد کمک مانگنے کے لیے بھیجا، اور اپنے والد کو لکھ کر گاؤں سے نکلنے کی اجازت مانگی۔ والد نے جواب دیا کہ کمک آنے تک اپنی جگہ ثابت رہے۔ پھر اس نے دوسرا خط لکھا جس میں کہا کہ وہ صرف اللہ کی اطاعت میں اٹھے تھے، اور بیٹے کو دوبارہ اجازت مانگنے سے منع کیا۔"
  es: "Cuando Ali ibn Muhammad vio la deserción de Hamdan, envió a su hermano al-Qasim a al-Hadi para informarle y pedir refuerzos con urgencia, y escribió a su padre pidiéndole permiso para abandonar la aldea. Su padre le respondió que debía mantener su puesto hasta que llegaran los refuerzos. En una segunda carta, el padre escribió que se habían alzado en obediencia a Dios y le dijo a su hijo que no volviera a escribir pidiendo permiso."
  fr: "Quand Ali ibn Muhammad constata la désertion d'Hamdan, il envoya son frère al-Qasim auprès d'al-Hadi pour l'informer et solliciter des renforts au plus vite, et écrivit à son père pour lui demander l'autorisation de quitter le village. Son père lui répondit de rester sur place jusqu'à l'arrivée des renforts. Dans une seconde lettre, il écrivit qu'ils s'étaient soulevés uniquement par obéissance à Dieu et demanda à son fils de ne plus écrire pour demander la permission de partir."
  tr: "Ali ibn Muhammed, Hamdan'ın kendisini terk ettiğini görünce, kardeşi el-Kâsım'ı el-Hadi'ye göndererek durumu bildirmesini ve takviye kuvvetlerinin hızla gelmesini rica etti. Ayrıca babasına da köyden ayrılmak istediğini belirten bir mektup yazdı. Babası ise takviye kuvvetleri gelene kadar yerinde kalmasını söyledi, ardından ikinci bir mektup yazarak sadece Allah'ın emriyle ayaklandıklarını belirtti ve bir daha ayrılmak istemesini yasakladı."
  id: "Ketika Ali bin Muhammad melihat bahwa Hamdan telah meninggalkannya, ia mengutus saudaranya, al-Qasim, kepada al-Hadi untuk memberitahukannya dan memintanya untuk mempercepat pengiriman bala bantuan, dan ia menulis surat kepada ayahnya memintanya untuk meninggalkan desa. Ayahnya menjawabnya untuk tetap tinggal di tempatnya sampai bala bantuan tiba, kemudian ia menulis surat kedua kepadanya yang mengatakan bahwa mereka hanya bangkit karena ketaatan kepada Allah, dan ia melarangnya untuk meminta pergi lagi."
