label: { ar: "غزوة حسان بن النعمان للكاهنة", en: "Hassan ibn al-Nu'man's Campaigns against al-Kahina", es: "Las campañas de Hassan ibn al-Nu'man contra al-Kahina", fr: "Campagnes de Hassan ibn al-Nu'man contre al-Kahina", ur: "حسن بن نعمان کی القہینہ کے خلاف مہمات", tr: "Hasan ibn el-Nu'man'ın kahine düzenlediği baskın", id: "Serangan Hassan ibn al-Nu'man terhadap peramal." }
summary:
  ar: "عند البلاذري: ولّى حسّان بن النعمان الغساني فغزا ملكة البربر الكاهنة فهزمته فأتى قصوراً في حيز برقة فنزلها وهي قصور يضمّها قصر سقوفه زجاج فسمّيت قصور حسان ثم إن حساناً غزاها ثانية فقتلها وسبى سبياً من البربر وبعث به إلى عبد العزيز فكان أبو محجن نصيب الشاعر يقول لقد حضرت عند عبد العزيز سبياً من البربر ما رأيت قط وجوهاً أحسن من وجوهم. وعند ابن خلدون وفي رواية ابن خلدون زحف حسان إليها سنة 79هـ فدخل القيروان وغزا قرطاجنة فافتتحها عنوة وذهب من كان بقي بها من الإفرنج إلى صقلية والأندلس ثم نزل وادي مسكيانة فانهزم المسلمون وأسر خالد بن يزيد القيسي وأقامت في سلطان إفريقية خمس سنين حتى عاد حسان سنة 74هـ فخربت المدن والضياع من طرابلس إلى طنجة فشق ذلك على البربر فاستأمنوا لحسان فقتلت بمكان البئر بجبل أوراس واستأمن البربر على أن يكون منهم اثنا عشر ألفاً مجاهدين معه {cite:tarikh-ibn-khaldun-ibar p. 1607-1608} ويذكر الكتاب أن حسان دخل قرطاجنة عنوة ثم عاد إلى القيروان، وأن الكاهنة هزمته قرب قابس، وأن البيزنطيين استعادوا قرطاجنة في غيابه، وأنه عاد بعد قتل الكاهنة فأعاد فتح قرطاجنة. {cite:salabi-umayyad-state-2020 p.58-60}"
  en: "In al-Baladhuri: Hassan ibn al-Nu'man al-Ghassani was appointed and raided the Berbers' queen al-Kahina, who routed him; he came to castles within Barqa's bounds and lodged them — a keep among them roofed in glass, whence they were named Qusur Hassan; then Hassan raided her a second time, killed her, and sent a captivity of Berbers to Abd al-Aziz — whereupon Abu Muhjan Nusayb the poet would say 'I was present at Abd al-Aziz's when a captivity of Berbers came: I never saw faces fairer than theirs'."
  es: "En al-Baladhuri: Hassan ibn al-Nu'man al-Ghassani fue nombrado y asaltó a la reina bereber al-Kahina, quien lo derrotó; llegó a los castillos dentro de los límites de Barqa y los alojó; entre ellos había una torre con techo de cristal, por lo que fueron llamados Qusur Hassan; luego Hassan la asaltó por segunda vez, la mató y envió un cautiverio de bereberes a Abd al-Aziz, tras lo cual el poeta Abu Muhjan Nusayb diría: \"Estuve presente en casa de Abd al-Aziz cuando llegó un cautiverio de bereberes: nunca vi rostros más hermosos que los suyos\"."
  fr: "Dans al-Baladhuri: Hassan ibn al-Nu'man al-Ghassani fut nommé et attaqua la reine berbère al-Kahina, qui le mit en déroute; il se rendit dans des châteaux situés dans les limites de Barqa et les y logea — un donjon parmi eux, au toit de verre, d'où leur nom de Qusur Hassan; puis Hassan l'attaqua une seconde fois, la tua et envoya des captifs berbères à Abd al-Aziz — à ce sujet, le poète Abu Muhjan Nusayb disait: « J'étais présent chez Abd al-Aziz lorsqu'arrivèrent des captifs berbères: je n'ai jamais vu de visages plus beaux que les leurs. »"
  ur: "البلادوری میں ہے: حسن بن النعمان الغسانی کو مقرر کیا گیا اور اس نے بربر کی ملکہ الکہینہ پر چھاپہ مارا، جس نے اسے شکست دی۔ وہ برقہ کی حدود میں قلعوں میں آیا اور انہیں ٹھہرایا - ان کے درمیان شیشے کی چھت تھی، جہاں سے ان کا نام قصر حسن رکھا گیا۔ پھر حسن نے دوسری بار اس پر چھاپہ مارا، اسے قتل کر دیا، اور بربروں کی ایک اسیری کو عبد العزیز کے پاس بھیج دیا - اس پر ابو محجن نصیب شاعر کہے گا کہ میں عبد العزیز کے پاس موجود تھا جب بربر کی قید آئی: میں نے ان سے زیادہ حسین چہرے کبھی نہیں دیکھے۔"
  tr: "El-Baladhuri'ye göre: Hasan bin el-Nu'man el-Ghassani, Berberi kraliçesi rahibeye karşı savaşa girdi ve kraliçe onu yendi. Hasan, Barqa bölgesindeki saraylara gitti ve orada kaldı. Bunlar arasında cam tavanlı bir saray da bulunan saraylar, Hasan'ın sarayları olarak adlandırılıyordu. Sonra Hasan ikinci kez ona karşı savaşa girdi, onu öldürdü ve Berberilerden esirler alarak Abdül Aziz'e gönderdi. Şair Ebu Mahcan Nasib şöyle derdi: Abdül Aziz'in yanında Berberilerden esirlerle birlikteydim ve onlarınkinden daha güzel yüzler hiç görmedim. İbn Haldun'un anlatımına göre, Hasan Hicri 79 yılında oraya doğru yürüdü, Kayrevan'a girdi ve Kartaca'yı zorla ele geçirdi. Orada kalan Franklar Sicilya ve Endülüs'e gittiler. Sonra Miskiana vadisine indi ve Müslümanlar yenilgiye uğratıldı, Halid bin Yezid el-Kaisi esir alındı. Hasan 74 Hicri yılında geri dönene kadar beş yıl boyunca İfrikiye Sultanlığı'nda kaldı. Trablus'tan Tanca'ya kadar olan şehirler ve köyler yıkıldı ve bu durum Berberileri üzdü, bu yüzden Hasan'a teslim oldular. Halife, Aures Dağları'ndaki kuyuda öldürüldü ve Berberiler, on iki bininin onunla birlikte mücahit olması şartıyla teslim oldular. {cite:tarikh-ibn-khaldun-ibar s. 1607-1608} Kitapta, Hasan'ın zorla Kartaca'ya girdiği ve sonra Kayrevan'a döndüğü, Kahina'nın onu Gabes yakınlarında yenilgiye uğrattığı, Bizanslıların yokluğunda Kartaca'yı geri aldığı ve Kahina'yı öldürdükten sonra geri dönerek Kartaca'yı yeniden fethettiği belirtiliyor. {cite:salabi-umayyad-state-2020 s.58-60}"
  id: "Menurut Al-Baladhuri: Hassan bin Al-Nu’man Al-Ghassani berperang melawan ratu Berber, seorang pendeta wanita, dan ia dikalahkan. Ia datang ke istana-istana di daerah Barqa dan tinggal di sana. Istana-istana ini termasuk istana dengan atap kaca, sehingga disebut istana Hassan. Kemudian Hassan berperang melawannya untuk kedua kalinya, membunuhnya, dan mengambil tawanan dari Berber dan mengirim mereka ke Abdul Aziz. Penyair Abu Mahjan Nasib biasa berkata: Aku hadir bersama tawanan dari Berber di tempat Abdul Aziz, dan aku belum pernah melihat wajah yang lebih indah dari mereka. Menurut Ibn Khaldun, dalam catatannya, Hassan berbaris menuju ke sana pada tahun 79 H, memasuki Kairouan, dan menyerbu Kartago, menaklukkannya dengan paksa. Mereka yang tersisa dari suku Frank pergi ke Sisilia dan Andalusia. Kemudian ia turun ke lembah Miskiana, dan kaum Muslim dikalahkan, dan Khalid bin Yazid al-Qaisi ditangkap. Ia tinggal di Kesultanan Ifriqiya selama lima tahun hingga Hassan kembali pada tahun 74 Hijriah. Kota-kota dan desa-desa dari Tripoli hingga Tangier dihancurkan, dan ini membuat orang-orang Berber sedih, sehingga mereka menyerah kepada Hassan. Ia terbunuh di sumur di Pegunungan Aures, dan orang-orang Berber menyerah dengan syarat bahwa dua belas ribu dari mereka akan menjadi mujahidin bersamanya. {cite:tarikh-ibn-khaldun-ibar hlm. 1607-1608} Buku tersebut menyebutkan bahwa Hassan memasuki Kartago dengan paksa dan kemudian kembali ke Kairouan, dan bahwa Kahina mengalahkannya di dekat Gabes, dan bahwa Bizantium merebut kembali Kartago saat ia tidak ada, dan bahwa ia kembali setelah membunuh Kahina dan menaklukkan kembali Kartago. {cite:salabi-umayyad-state-2020 p.58-60}"
