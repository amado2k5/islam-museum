label: { ar: "غزوة حسان بن النعمان للكاهنة", en: "Hassan ibn al-Nu'man's Campaigns against al-Kahina" }
summary:
  ar: "عند البلاذري: ولّى حسّان بن النعمان الغساني فغزا ملكة البربر الكاهنة فهزمته فأتى قصوراً في حيز برقة فنزلها وهي قصور يضمّها قصر سقوفه زجاج فسمّيت قصور حسان ثم إن حساناً غزاها ثانية فقتلها وسبى سبياً من البربر وبعث به إلى عبد العزيز فكان أبو محجن نصيب الشاعر يقول لقد حضرت عند عبد العزيز سبياً من البربر ما رأيت قط وجوهاً أحسن من وجوهم. وعند ابن خلدون وفي رواية ابن خلدون زحف حسان إليها سنة 79هـ فدخل القيروان وغزا قرطاجنة فافتتحها عنوة وذهب من كان بقي بها من الإفرنج إلى صقلية والأندلس ثم نزل وادي مسكيانة فانهزم المسلمون وأسر خالد بن يزيد القيسي وأقامت في سلطان إفريقية خمس سنين حتى عاد حسان سنة 74هـ فخربت المدن والضياع من طرابلس إلى طنجة فشق ذلك على البربر فاستأمنوا لحسان فقتلت بمكان البئر بجبل أوراس واستأمن البربر على أن يكون منهم اثنا عشر ألفاً مجاهدين معه {cite:tarikh-ibn-khaldun-ibar p. 1607-1608} ويذكر الكتاب أن حسان دخل قرطاجنة عنوة ثم عاد إلى القيروان، وأن الكاهنة هزمته قرب قابس، وأن البيزنطيين استعادوا قرطاجنة في غيابه، وأنه عاد بعد قتل الكاهنة فأعاد فتح قرطاجنة. {cite:salabi-umayyad-state-2020 p.58-60}"
  en: "In al-Baladhuri: Hassan ibn al-Nu'man al-Ghassani was appointed and raided the Berbers' queen al-Kahina, who routed him; he came to castles within Barqa's bounds and lodged them — a keep among them roofed in glass, whence they were named Qusur Hassan; then Hassan raided her a second time, killed her, and sent a captivity of Berbers to Abd al-Aziz — whereupon Abu Muhjan Nusayb the poet would say 'I was present at Abd al-Aziz's when a captivity of Berbers came: I never saw faces fairer than theirs'."
