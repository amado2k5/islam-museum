summary:
  ar: "بطاقة أولية لمعركة أنطاكية على مينيدر سنة ١٢١١م، هزيمة سلطان الروم كيخسرو أمام نيقية ومقتله؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Antioch on the Meander in 1211, where the Sultan of Rum Kaykhusraw was defeated and killed by Nicaea; its sources are not yet checked on the page."
