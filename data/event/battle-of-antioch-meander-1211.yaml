  fr: "Carte provisoire pour la bataille d'Antioche sur le Méandre en 1211, où le sultan de Roum Kaykhusraw fut vaincu et tué par Nicée; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1211 میں مینڈر پر انطاکیہ کی لڑائی کے لیے ڈرافٹ کارڈ، جہاں رم کیخسرو کے سلطان کو نیکیا کے ہاتھوں شکست ہوئی اور قتل کر دیا گیا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1211 yılında Menider'de gerçekleşen Antakya Muharebesi'ne, Roma Sultanı Kaykhusraw'ın İznik'teki yenilgisine ve ölümüne dair ön bir anlatım; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Antiokhia di Menider pada tahun 1211 M, kekalahan Sultan Romawi Kaykhusraw di Nicaea dan kematiannya; sumber-sumber yang tercantum di halaman ini belum ditinjau."
