label: { ar: "بيعة علي بن أبي طالب" }
summary:
  ar: "بويع علي بالخلافة الغد من قتل عثمان بالمدينة، فبايعه جميع من كان بها من الصحابة، ويقال إن طلحة والزبير بايعا كارهين غير طائعين، ثم خرجا إلى مكة وعائشة بها فأخذاها وخرجوا إلى البصرة يطلبون بدم عثمان {cite:tarikh-khulafa-minhaj-1434 p. 293-294}. وقد كان علي امتنع أولاً وقال ليس ذلك إليكم إنما ذلك إلى أهل بدر فمن رضي به أهل بدر فهو خليفة، فلم يبق أحد من أهل بدر إلا أتاه فبايعوه {cite:tarikh-khulafa-minhaj-1434 p. 275}."
  en: "Ali was given the bay'a the day after Uthman was killed, at Medina; all the Companions present pledged — though it is said Talha and al-Zubayr pledged unwillingly before leaving for Mecca, where they took Aisha and set out for Basra seeking vengeance for Uthman's blood. Ali had at first refused: 'that is not yours to give; it belongs to the men of Badr — whoever they approve is caliph'; every remaining Badri then came to him and pledged {cite:tarikh-khulafa-minhaj-1434 p. 275, 293-294}."
