id: event/bayat-ali
class: event
kind: declaration
label: { ar: "بيعة علي بن أبي طالب", en: "Bay'a of Ali ibn Abi Talib", fr: "La bay'a d'Ali ibn Abi Talib", es: "Bay'a de Ali ibn Abi Talib", ur: "علی ابن ابی طالب کی بیعت" }
summary:
  ar: "بويع علي بالخلافة الغد من قتل عثمان بالمدينة، فبايعه جميع من كان بها من الصحابة، ويقال إن طلحة والزبير بايعا كارهين غير طائعين، ثم خرجا إلى مكة وعائشة بها فأخذاها وخرجوا إلى البصرة يطلبون بدم عثمان {cite:tarikh-khulafa-minhaj-1434 p. 293-294}. وقد كان علي امتنع أولاً وقال ليس ذلك إليكم إنما ذلك إلى أهل بدر فمن رضي به أهل بدر فهو خليفة، فلم يبق أحد من أهل بدر إلا أتاه فبايعوه {cite:tarikh-khulafa-minhaj-1434 p. 275}."
  en: "Ali was given the bay'a the day after Uthman was killed, at Medina; all the Companions present pledged — though it is said Talha and al-Zubayr pledged unwillingly before leaving for Mecca, where they took Aisha and set out for Basra seeking vengeance for Uthman's blood. Ali had at first refused: 'that is not yours to give; it belongs to the men of Badr — whoever they approve is caliph'; every remaining Badri then came to him and pledged {cite:tarikh-khulafa-minhaj-1434 p. 275, 293-294}."
  fr: "Ali reçut la bay'a le lendemain du meurtre d'Uthman, à Médine ; tous les Compagnons présents prêtèrent allégeance, quoiqu'on dise que Talha et al-Zubayr prêtèrent allégeance à contrecœur avant de partir pour La Mecque, où ils prirent Aïcha et partirent pour Bassora en réclamant vengeance pour le sang d'Uthman. Ali avait d'abord refusé : « ce n'est pas à vous de la donner ; elle appartient aux gens de Badr ; celui qu'ils approuvent est calife » ; tous les Badrites restants vinrent alors à lui et lui prêtèrent allégeance {cite:tarikh-khulafa-minhaj-1434 p. 275, 293-294}."
  es: "Ali recibió el bay'a al día siguiente de la muerte de Uthman en Medina; todos los Compañeros presentes prestaron juramento, aunque se dice que Talha y al-Zubayr lo hicieron a regañadientes antes de partir hacia La Meca, donde tomaron a Aisha y se dirigieron a Basora en busca de venganza por la sangre de Uthman. Ali se negó al principio: «Eso no te corresponde a ti darlo; pertenece a los hombres de Badr; quien ellos aprueben será califa». Entonces, todos los Badri restantes acudieron a él y prestaron juramento {cite:tarikh-khulafa-minhaj-1434 p. 275, 293-294}."
  ur: "مدینہ میں عثمان کے قتل کے اگلے دن علی کو بیعت دی گئی۔ تمام حاضر صحابہ نے عہد کیا - حالانکہ یہ کہا جاتا ہے کہ طلحہ اور الزبیر نے مکہ جانے سے پہلے ناخوشی سے عہد کیا، جہاں وہ عائشہ کو لے کر عثمان کے خون کا بدلہ لینے کے لیے بصرہ کے لیے روانہ ہوئے۔ علی نے پہلے تو انکار کر دیا تھا: 'یہ دینا تمہارا نہیں ہے۔ یہ اہل بدر کا ہے - جس کو وہ منظور کریں وہ خلیفہ ہے'۔ باقی سب بدری پھر اس کے پاس آئے اور بیعت کی۔ 275، 293-294}۔"
