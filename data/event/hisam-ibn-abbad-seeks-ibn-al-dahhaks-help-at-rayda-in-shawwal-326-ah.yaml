id: "event/hisam-ibn-abbad-seeks-ibn-al-dahhaks-help-at-rayda-in-shawwal-326-ah"
class: event
kind: other
label:
  ar: "يذهب هصيم بن عباد الأكيلي إلى ابن الضحاك في ريدة طلبا للنصرة في شوال سنة 326هـ، ص412"
  en: "Hisam ibn Abbad al-Akili goes to Ibn al-Dahhak at Rayda seeking help in Shawwal 326 AH, p. 412"
  ur: "ہصیم بن عباد الاکیلی شوال 326ھ میں مدد مانگنے ریدہ میں ابن الضحاک کے پاس جاتا ہے، ص412"
  es: "Hisam ibn Abbad al-Akili acude a Ibn al-Dahhak en Rayda en busca de ayuda en Shawwal 326 AH, pág. 412"
  fr: "Hisam ibn Abbad al-Akili se rend à Rayda pour demander de l'aide en Shawwal 326 AH, p. 412"
summary:
  ar: "يخرج هصيم بن عباد الأكيلي إلى ابن الضحاك في ريدة ليستنصره على القاسم بن أحمد وبني سعد، فيخرج معه عسكر من همدان يوم الأربعاء لثمانية أيام باقية من شوال، حتى يصلوا إلى الحسن بن أحمد والأكيليين."
  en: "Hisam ibn Abbad al-Akili goes to Ibn al-Dahhak at Rayda to seek his help against al-Qasim ibn Ahmad and Banu Sa'd. A Hamdan force goes with him on Wednesday, eight days before the end of Shawwal, and they reach al-Hasan ibn Ahmad and the Akil."
  ur: "ہصیم بن عباد الاکیلی ابن الضحاک کے پاس ریدہ جاتا ہے تاکہ قاسم بن احمد اور بنی سعد کے خلاف مدد لے۔ شوال کے آخر سے آٹھ دن پہلے بدھ کو ہمدان کا ایک لشکر اس کے ساتھ نکلتا ہے، یہاں تک کہ وہ حسن بن احمد اور اکیلیوں تک پہنچ جاتے ہیں۔"
  es: "Hisam ibn Abbad al-Akili acude a Ibn al-Dahhak en Rayda para pedirle ayuda contra al-Qasim ibn Ahmad y Banu Sa'd. Una fuerza de Hamdan lo acompaña el miércoles, ocho días antes del final de Shawwal, y llegan hasta al-Hasan ibn Ahmad y los Akil."
  fr: "Hisam ibn Abbad al-Akili se rend à Rayda auprès d'Ibn al-Dahhak pour solliciter son aide contre al-Qasim ibn Ahmad et les Banu Sa'd. Une troupe hamdan l'accompagne le mercredi, huit jours avant la fin de Shawwal, et ils atteignent al-Hasan ibn Ahmad et les Akil."
