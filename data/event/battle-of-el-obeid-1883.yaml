summary:
  ar: "بطاقة أولية لمعركة الأبيض سنة ١٨٨٣م، إبادة المهدي لجيش هيكس باشا المصري في كردفان؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of El Obeid in 1883, the Mahdi's annihilation of Hicks Pasha's Egyptian army in Kordofan; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Batalla de El Obeid en 1883, la aniquilación del ejército egipcio de Hicks Pasha por parte del Mahdi en Kordofán; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de campagne pour la bataille d'El Obeid en 1883, l'anéantissement par le Mahdi de l'armée égyptienne de Hicks Pacha au Kordofan; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1883 میں ال عبید کی جنگ کے لیے ڈرافٹ کارڈ، مہدی کا کوردوفان میں ہکس پاشا کی مصری فوج کا خاتمہ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1883 yılında gerçekleşen El Obeid Muharebesi'nin (Mehdi'nin Kordofan'da Hicks Paşa'nın Mısır ordusunu yok etmesi) ön raporu; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran El Obeid pada tahun 1883 M, penghancuran pasukan Mesir Hicks Pasha oleh Mahdi di Kordofan; sumber-sumbernya belum ditinjau di halaman ini."
