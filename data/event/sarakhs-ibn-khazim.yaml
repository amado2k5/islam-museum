id: event/sarakhs-ibn-khazim
class: event
kind: treaty
label: { ar: "صلح سرخس", en: "The Sarakhs Treaty" }
summary:
  ar: "وجه ابن عامر عبد الله بن خازم إلى سرخس فقاتلهم ثم طلب زاذويه مرزبانها الصلح على إيمان مائة رجل وأن يدفع إليه النساء فصارت ابنته في سهم ابن خازم واتخذها وسماها ميشاء وغلب ابن خازم على أرض سرخس ويقال إنه صالحه على أن يؤمن مائة نفس فسمى له المائة ولم يسم نفسه فقتله ودخل سرخس عنوة ووجه ابن خازم من سرخس يزيد بن سالم مولى شريك بن الأعور إلى كيف ويينة ففتحها."
  en: "Ibn Khazim fought Sarakhs; its marzban Zadhuya sought peace on aman for a hundred men and the surrender of its women — his own daughter fell to Ibn Khazim's lot, who took her and named her Maysha' — and he ruled Sarakhs's land. Another telling: he truced on aman for a hundred souls, named the hundred, omitted himself — and was killed, and the town entered by force. From Sarakhs Ibn Khazim sent his mawla Yazid ibn Salim to take Kif and Yabina."
