label: { ar: "صلح سرخس", en: "The Sarakhs Treaty", es: "El Tratado de Sarakhs", fr: "Le traité de Sarakhs", ur: "سارخ معاہدہ", tr: "Sarkhas'ın Barışı", id: "Kedamaian Sarkhas" }
summary:
  ar: "وجه ابن عامر عبد الله بن خازم إلى سرخس فقاتلهم ثم طلب زاذويه مرزبانها الصلح على إيمان مائة رجل وأن يدفع إليه النساء فصارت ابنته في سهم ابن خازم واتخذها وسماها ميشاء وغلب ابن خازم على أرض سرخس ويقال إنه صالحه على أن يؤمن مائة نفس فسمى له المائة ولم يسم نفسه فقتله ودخل سرخس عنوة ووجه ابن خازم من سرخس يزيد بن سالم مولى شريك بن الأعور إلى كيف ويينة ففتحها."
  en: "Ibn Khazim fought Sarakhs; its marzban Zadhuya sought peace on aman for a hundred men and the surrender of its women — his own daughter fell to Ibn Khazim's lot, who took her and named her Maysha' — and he ruled Sarakhs's land. Another telling: he truced on aman for a hundred souls, named the hundred, omitted himself — and was killed, and the town entered by force. From Sarakhs Ibn Khazim sent his mawla Yazid ibn Salim to take Kif and Yabina."
  es: "Ibn Khazim luchó contra Sarakhs; su marzban Zadhuya pidió la paz por un pacto a cambio de cien hombres y la rendición de sus mujeres. Su propia hija cayó en manos de Ibn Khazim, quien la tomó y la llamó Maysha'. Luego gobernó las tierras de Sarakhs. Otra versión cuenta que pactó una tregua por cien almas, nombró a los cien, se excluyó a sí mismo y fue asesinado. La ciudad fue tomada por la fuerza. Desde Sarakhs, Ibn Khazim envió a su mawla Yazid ibn Salim a tomar Kif y Yabina."
  fr: "Ibn Khazim combattit Sarakhs; son marzban, Zadhuya, proposa la paix en échange d'un aman pour cent hommes et de la reddition de ses femmes – sa propre fille tomba entre les mains d'Ibn Khazim, qui la prit sous son aile et la nomma Maysha' – et il gouverna les terres de Sarakhs. Selon une autre version: il conclut une trêve en échange d'un aman pour cent âmes, nomma les cent, s'omettant de lui-même – et fut tué, et la ville fut prise d'assaut. De Sarakhs, Ibn Khazim envoya son mawla Yazid ibn Salim conquérir Kif et Yabina."
  ur: "ابن خزیم نے سرخوں سے جنگ کی۔ اس کے مرزبن زدھویہ نے سو مردوں کے لیے امان اور اس کی عورتوں کے ہتھیار ڈالنے کی کوشش کی - اس کی اپنی بیٹی ابن خزیم کے حصے میں آئی، جس نے اسے لے لیا اور اس کا نام میشا رکھا - اور اس نے سرخ کی سرزمین پر حکومت کی۔ ایک اور بتانا: اس نے سو جانوں کے لیے امان پر اعتماد کیا، سو کا نام رکھا، خود کو چھوڑ دیا - اور مارا گیا، اور شہر میں زبردستی داخل ہوا۔ سرخص سے ابن خزیم نے اپنے مولا یزید بن سلیم کو کیف اور یبینہ لینے کے لیے بھیجا۔"
  tr: "İbn Amir, Abdullah bin Khazim'i Sarakhs'a gönderdi ve o da onlarla savaştı. Bunun üzerine Sarakhs'ın Marzbanı Zadhuwayh, yüz erkeğin iman etmesi ve kadınların kendisine teslim edilmesi şartıyla barış istedi. Böylece kızı İbn Khazim'in payına düştü ve İbn Khazim onu yanına alıp Misha adını verdi. İbn Khazim Sarakhs topraklarını fethetti ve yüz kişinin iman etmesi şartıyla onlarla barış yaptığı söylenir. Bu yüzden yüz kişiye onun adını verdi, kendisine isim vermedi; bunun üzerine İbn Khazim onu öldürdü ve zorla Sarakhs'a girdi. İbn Khazim, Sarakhs'tan Şarik bin Al-Awar'ın azatlı kölesi Yazid bin Salim'i Kayf ve Yayna'ya gönderdi ve o da buraları fethetti."
  id: "Ibn Amir mengutus Abdullah bin Khazim ke Sarakhs, dan ia memerangi mereka. Kemudian Zadhuwayh, Marzbannya, meminta perdamaian dengan syarat seratus orang laki-laki akan beriman dan para wanita akan diserahkan kepadanya. Maka putrinya menjadi bagian dari jatah Ibn Khazim, dan ia mengambilnya serta menamainya Misha. Ibn Khazim menaklukkan tanah Sarakhs, dan dikatakan bahwa ia berdamai dengan mereka dengan syarat seratus orang akan beriman. Maka ia menamai seratus orang itu untuknya dan tidak menamai dirinya sendiri, sehingga ia membunuhnya dan memasuki Sarakhs dengan paksa. Ibn Khazim mengutus Yazid bin Salim dari Sarakhs, budak yang dibebaskan oleh Sharik bin Al-Awar, ke Kayf dan Yayna, dan ia menaklukkan mereka."
