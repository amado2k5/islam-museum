id: event/banu-abd-al-madan-advise-closing-the-darb-gate-and-mustering-their-clients-295
class: event
kind: other
label:
  ar: "بنو عبد المدان يشيرون بإغلاق باب الدرب وجمع الموالي، 295هـ"
  en: "Banu Abd al-Madan advise closing the Darb gate and mustering their clients, 295 AH, pp. 366-367"
  ur: "بنو عبد المدان کا دروازۂ درب بند کرنے اور موالی جمع کرنے کا مشورہ، 295ھ، ص366-367"
  fr: "Les Banu Abd al-Madan conseillent de fermer la porte du Darb et de rassembler leurs clients, 295 H, p. 366-367"
summary:
  ar: "أرسل محمد إلى رجال من بني عبد المدان يسألهم الهجوم على ابن حميد قبل أن تجتمع إليه بنو الحارث، فأبوا، وقالوا: نرى أن تأمر بإغلاق باب الدرب، ونجمع الموالي على باب الدار، وتأمر عشيرتك بالحضور بالسلاح. وأكدوا أن بني الحارث إن أرادوا حربه فلن يتحركوا من قريتهم شيئاً حتى تأتيه مادة من الهادي."
  en: "Muhammad sent to men of Banu Abd al-Madan asking them to attack Ibn Humayd before Banu al-Harith could join him. They refused, saying they would not leave their village, nor would any of their men. They advised him to close the Darb gate, gather the clients at the house door, and order his kin to come armed. They said that if Banu al-Harith meant to fight him they would not move from their village until reinforcements came to him from al-Hadi."
  ur: "محمد نے بنو عبد المدان کے کچھ آدمیوں کو بلا کر کہا کہ بنو حارث کے اس کے پاس جمع ہونے سے پہلے ابن حمید پر حملہ کریں۔ انہوں نے انکار کیا اور کہا کہ وہ اپنا گاؤں نہیں چھوڑیں گے، اور ان کا کوئی آدمی بھی نہیں نکلے گا۔ انہوں نے مشورہ دیا کہ درب کا دروازہ بند کیا جائے، موالی کو گھر کے دروازے پر جمع کیا جائے، اور اپنے قبیلے کو ہتھیار کے ساتھ حاضر ہونے کا حکم دیا جائے۔ انہوں نے کہا کہ اگر بنو حارث اس سے لڑنا چاہیں تو وہ اس وقت تک اپنے گاؤں سے کچھ نہیں کریں گے جب تک ہادی کی طرف سے کمک نہ آ جائے۔"
  fr: "Muhammad envoya dire à des hommes des Banu Abd al-Madan d'attaquer Ibn Humayd avant que les Banu al-Harith ne puissent le rejoindre. Ils refusèrent, disant qu'ils ne quitteraient pas leur village, ni aucun de leurs hommes. Ils lui conseillèrent de fermer la porte du Darb, de rassembler les clients à la porte de la maison et d'ordonner à ses proches de venir en armes. Ils dirent que si les Banu al-Harith voulaient le combattre, ils ne bougeraient pas de leur village tant que des renforts ne lui viendraient pas d'al-Hadi."
