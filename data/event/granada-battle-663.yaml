label: { ar: "ملحمة غرناطة وكسر الفنش سنة 663هـ", en: "The great battle of Granada, 663", es: "La gran batalla de Granada, 663", fr: "La grande bataille de Grenade, 663", ur: "گریناڈا کی عظیم جنگ، 663" }
summary:
  ar: "كانت سنة ثلاث وستين ملحمة عظمى بالأندلس: التقى الفنش ملك قشتالة وأبو عبد الله ابن الأحمر غير مرة ثم انهزمت الملاعين وأسر الفنش ثم أفلت وحشد وجيش ونازل غرناطة فخرج ابن الأحمر فكسرهم وأسر منهم عشرة آلاف وقتل المسلمون فوق الأربعين ألفاً وجمعوا كوماً هائلاً من رؤوس الفرنج وأذنوا عليه واستعادوا عدة مدائن من الفرنج {cite:shadharat-dhahab p. 541}."
  en: "The great Andalus struggle of 663: the Castilian king 'al-Funsh' (Alfonso) met Abu Abdallah Ibn al-Ahmar repeatedly — the Nasrid army routed them, the king was taken then slipped free; when he besieged Granada itself Ibn al-Ahmar came out and broke him, taking ten thousand prisoners while over forty thousand of the Franks fell; a great heap of heads was piled and the adhan sounded over it, and several towns were retaken {cite:shadharat-dhahab p. 541}."
  es: "La gran lucha de Al-Ándalus de 663: el rey castellano 'al-Funsh' (Alfonso) se enfrentó repetidamente a Abu Abdallah Ibn al-Ahmar; el ejército nazarí los derrotó, el rey fue capturado y luego escapó; cuando sitió la propia Granada, Ibn al-Ahmar salió y lo derrotó, tomando diez mil prisioneros mientras que más de cuarenta mil francos cayeron; se apiló una gran pila de cabezas y se tocó el adhan sobre ella, y varias ciudades fueron retomadas {cita: shadharat-dhahab p. 541}."
  fr: "La grande bataille d'Andalousie de 663: le roi castillan al-Funsh (Alphonse) rencontra à plusieurs reprises Abu Abdallah Ibn al-Ahmar — l'armée nasride les mit en déroute, le roi fut capturé puis s'échappa; lorsqu'il assiégea Grenade, Ibn al-Ahmar sortit et le brisa, faisant dix mille prisonniers tandis que plus de quarante mille Francs tombèrent; un grand tas de têtes fut entassé et l'adhan retentit dessus, et plusieurs villes furent reprises {cite: shadharat-dhahab p. 541}."
  ur: "663 کی اندلس کی عظیم جدوجہد: کاسٹیلین بادشاہ 'الفنش' ⁦(الفونسو)⁩ نے ابو عبداللہ ابن الاحمر سے بار بار ملاقات کی - نصری فوج نے انہیں شکست دی، بادشاہ کو پکڑ لیا گیا اور پھر آزاد ہو گیا۔ جب اس نے غرناطہ کا محاصرہ کیا تو ابن الاحمر باہر نکلا اور اسے توڑ ڈالا، دس ہزار قیدی لے لیے جبکہ چالیس ہزار سے زیادہ فرینک مارے گئے۔ سروں کا ایک بہت بڑا ڈھیر لگا دیا گیا اور اس پر اذان ہوئی اور کئی قصبوں پر دوبارہ قبضہ کر لیا گیا۔ 541}۔"
