summary:
  ar: "كانت سنة ثلاث وستين ملحمة عظمى بالأندلس: التقى الفنش ملك قشتالة وأبو عبد الله ابن الأحمر غير مرة ثم انهزمت الملاعين وأسر الفنش ثم أفلت وحشد وجيش ونازل غرناطة فخرج ابن الأحمر فكسرهم وأسر منهم عشرة آلاف وقتل المسلمون فوق الأربعين ألفاً وجمعوا كوماً هائلاً من رؤوس الفرنج وأذنوا عليه واستعادوا عدة مدائن من الفرنج {cite:shadharat-dhahab p. 541}."
  en: "The great Andalus struggle of 663: the Castilian king 'al-Funsh' (Alfonso) met Abu Abdallah Ibn al-Ahmar repeatedly — the Nasrid army routed them, the king was taken then slipped free; when he besieged Granada itself Ibn al-Ahmar came out and broke him, taking ten thousand prisoners while over forty thousand of the Franks fell; a great heap of heads was piled and the adhan sounded over it, and several towns were retaken {cite:shadharat-dhahab p. 541}."
