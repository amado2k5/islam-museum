id: event/ibn-al-salah-ashrafiyya-630
class: event
kind: other
label:
  ar: "ابن الصلاح يتولى مشيخة دار الحديث الأشرفية بدمشق ثم الشامية الصغرى، ٦٣٠هـ/١٢٣٣م"
  en: "Ibn al-Salah takes the mashyakha of the al-Ashrafiyya dar al-hadith, then the Shamiyya al-Sughra, 630/1233"
  ur: "ابن الصلاح دمشق میں دار الحدیث اشرفیہ کی مشیخت سنبھالتے ہیں، پھر شامیہ صغریٰ، 630ھ/1233ء"
  es: "Ibn al-Salah toma el mashyakha del al-Ashrafiyya dar al-hadith, luego el Shamiyya al-Sughra, 630/1233"
  fr: "Ibn al-Salah prend le mashyakha du al-Ashrafiyya dar al-hadith, puis le Shamiyya al-Sughra, 630/1233"
  tr: "İbn al-Salah, Hicri 630/Miladi 1233 yılında Şam'da Eşrafiyye Hadis Okulu'nun (daha sonra Küçük Şamiyye) liderliğini üstlendi."
  id: "Ibn al-Salah mengambil alih kepemimpinan Mazhab Hadits Ashrafiyya di Damaskus, yang saat itu bernama Mazhab Syamiyya Kecil, pada tahun 630 H/1233 M."
summary:
  ar: "وُلي ابن الصلاح سنة ثلاثين وستمائة مشيخة الدار الأشرفية بدمشق، فلما بنى الأشرف دار الحديث فوّض تدريسها إليه، ثم تدريس الشامية الصغرى مدرسة ست الشام التي قبل المارستان النوري، وكان يقوم بوظائف الجهات الثلاث — الرواحية والأشرفية والشامية — من غير إخلال بشيء منها {cite:tarikh-islam-dhahabi p. 186} {cite:shadharat-dhahab p. 230} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  en: "In 630/1233 Ibn al-Salah took the mashyakha of the al-Ashrafiyya dar al-hadith in Damascus: when al-Malik al-Ashraf built the dar al-hadith he entrusted its teaching to him, then the Shamiyya al-Sughra — the madrasa of Sitt al-Sham opposite the Nur al-Din bimaristan. He discharged all three posts — Rawahiyya, Ashrafiyya and Shamiyya — without neglecting a single one {cite:tarikh-islam-dhahabi p. 186} {cite:shadharat-dhahab p. 230} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  ur: "630ھ/1233ء میں ابن الصلاح نے دمشق کی دار الحدیث اشرفیہ کی مشیخت سنبھالی: جب ملک الاشرف نے دار الحدیث بنائی تو اس کی تدریس انھی کے سپرد کی، پھر شامیہ صغریٰ — ست الشام کی مدرسہ جو نور الدین بیمارستان کے سامنے تھی۔ انہوں نے تینوں مناصب — رواحیہ، اشرفیہ اور شامیہ — کی ذمہ داریاں بغیر کسی کوتاہی کے ادا کیں {cite:tarikh-islam-dhahabi p. 186} {cite:shadharat-dhahab p. 230} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}۔"
  es: "En 630/1233 Ibn al-Salah tomó el mashyakha del dar al-hadith al-Ashrafiyya en Damasco: cuando al-Malik al-Ashraf construyó el dar al-hadith le confió su enseñanza, luego la Shamiyya al-Sughra — la madrasa de Sitt al-Sham frente al bimaristan Nur al-Din. Desempeñó los tres cargos — Rawahiyya, Ashrafiyya y Shamiyya — sin descuidar ninguno {cite:tarikh-islam-dhahabi p. 186} {cite:shadharat-dhahab p. 230} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  fr: "En 630/1233, Ibn al-Salah prit la direction de la madrasa al-Ashrafiyya dar al-hadith à Damas: lorsqu’al-Malik al-Ashraf fonda cette madrasa, il lui en confia l’enseignement. Il prit ensuite la direction de la Shamiyya al-Sughra, la madrasa de Sitt al-Sham, située en face du bimaristan de Nur al-Din. Il assuma les trois fonctions – Rawahiyya, Ashrafiyya et Shamiyya – sans en négliger aucune {cite:tarikh-islam-dhahabi p. 186} {cite:shadharat-dhahab p. 230} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  tr: "Hicri 630 yılında İbn el-Salah, Şam'daki Eşrefîyye Evi'nin başına atandı. Eşrefîyye Hadis Evi'ni inşa ettiğinde, buradaki öğretimi ona emanet etti; daha sonra da Nuri Hastanesi'nden önce var olan Sitt el-Şam ekolü olan Küçük Şamiyye'nin öğretimini ona verdi. Üç bölümün de (Ravahiyye, Eşrefîyye ve Şamiyye) görevlerini hiçbirini ihmal etmeden yerine getirdi. {cite:tarikh-islam-dhahabi s. 186} {cite:shadharat-dhahab s. 230} {cite:encyclopaedia-of-islam-2 cilt 3 s. 959}"
  id: "Pada tahun 630 H, Ibn al-Salah diangkat menjadi kepala Rumah Ashrafiyya di Damaskus. Ketika al-Ashraf membangun Rumah Hadits, beliau mempercayakan pengajarannya kepada Ibn al-Salah, dan kemudian pengajaran Shamiyya Kecil, sekolah Sitt al-Sham, yang berada sebelum Rumah Sakit Nuri. Beliau menjalankan tugas ketiga departemen—Rawahiyya, Ashrafiyya, dan Shamiyya—tanpa mengabaikan salah satu pun. {cite:tarikh-islam-dhahabi p. 186} {cite:shadharat-dhahab p. 230} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
