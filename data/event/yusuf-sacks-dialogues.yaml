label: { ar: "حوارات حمزة يوسف والربي جوناثان ساكس", en: "Hamza Yusuf–Jonathan Sacks dialogues", es: "Diálogos entre Hamza Yusuf y Jonathan Sacks", fr: "Dialogues entre Hamza Yusuf et Jonathan Sacks", ur: "حمزہ یوسف – جوناتھن سیکس کے مکالمے", tr: "Hamza Yusuf ve Haham Jonathan Sachs Arasındaki Diyaloglar", id: "Dialog antara Hamza Yusuf dan Rabbi Jonathan Sachs" }
summary:
  ar: "محادثات عامة مسجلة بين شخصيات سنية بارزة كالشيخ [[person/hamza-yusuf|حمزة يوسف]] والحاخام الأكبر الراحل [[person/jonathan-sacks|جوناثان ساكس]] في التوحيد والعلمانية وسلطة الكتب، تُستشهد بكثرة في أدب المقارنة الحديث بوصفها أنضبط الصيغ الجارية للمواجهة الفكرية الإسلامية–اليهودية، وإن كانت حواراً مشتركاً لا منازعة {cite:youtube-sunni-jewish-debate}."
  en: "Recorded public conversations between prominent Sunni figures such as Shaykh [[person/hamza-yusuf|Hamza Yusuf]] and the late Chief Rabbi [[person/jonathan-sacks|Lord Jonathan Sacks]] on monotheism, secularism and scriptural authority, widely cited in modern comparative literature as the most disciplined current form of Muslim–Jewish intellectual encounter — a shared dialogue rather than a polemic {cite:youtube-sunni-jewish-debate}."
  es: "Conversaciones públicas grabadas entre figuras sunitas prominentes como el jeque [[person/hamza-yusuf|Hamza Yusuf]] y el difunto rabino principal [[person/jonathan-sacks|Lord Jonathan Sacks]] sobre monoteísmo, secularismo y autoridad escritural, ampliamente citadas en la literatura comparada moderna como la forma más disciplinada actual de encuentro intelectual musulmán-judío: un diálogo compartido en lugar de una polémica {cite:youtube-sunni-jewish-debate}."
  fr: "Les conversations publiques enregistrées entre des personnalités sunnites éminentes telles que le cheikh Hamza Yusuf et le regretté grand rabbin Lord Jonathan Sacks sur le monothéisme, la laïcité et l'autorité scripturaire, largement citées dans la littérature comparée moderne comme la forme actuelle la plus disciplinée de rencontre intellectuelle musulmane-juive — un dialogue partagé plutôt qu'une polémique {cite:youtube-sunni-jewish-debate}."
  ur: "توحید، سیکولرازم اور صحیفائی اتھارٹی پر شیخ [[شخص/حمزہ-یوسف|حمزہ یوسف]] اور مرحوم چیف ربی [[person/jonathan-sacks|Lord Jonathan Sacks]] جیسی ممتاز سنی شخصیات کے درمیان ریکارڈ شدہ عوامی گفتگو، جو کہ جدید ترین تقابلی ادب میں جدید تقابلی ادب کے طور پر نقل کیا گیا ہے۔ انکاؤنٹر — ایک متنازعہ بات چیت کے بجائے ایک مشترکہ مکالمہ۔"
  tr: "Şeyh Hamza Yusuf ile merhum Baş Haham Jonathan Sacks gibi önde gelen Sünni şahsiyetler arasında tek tanrıcılık, laiklik ve kutsal kitapların otoritesi üzerine yapılan kayıtlı kamuya açık konuşmalar, modern karşılaştırmalı literatürde sıklıkla İslam-Yahudi entelektüel çatışmasının en disiplinli formülleri olarak gösterilmektedir; bu, bir anlaşmazlıktan ziyade ortak bir diyalog olsa bile."
  id: "Rekaman percakapan publik antara tokoh-tokoh Sunni terkemuka seperti Syekh Hamza Yusuf dan almarhum Kepala Rabbi Jonathan Sacks tentang monoteisme, sekularisme, dan otoritas kitab suci sering dikutip dalam literatur perbandingan modern sebagai formula yang paling terstruktur dari berbagai pendekatan intelektual Islam-Yahudi saat ini, meskipun itu adalah dialog bersama dan bukan perselisihan."
