label: { ar: "قتل شهاب الدين السهروردي بحلب سنة 587" }
summary:
  ar: "في سنة سبع وثمانين قُتل الفيلسوف شهاب الدين يحيى السهروردي بحلب؛ قدمها واشتهر اسمه فأقام له الملك الظاهر غازي ولد السلطان صلاح الدين مجلساً فبان فضله وبهر علمه فارتبط عليه الظاهر واختص به، وظهر للعلماء منه زندقة وانحلال فعلّموا حُرُماً بكفره وسيروه إلى صلاح الدين وخوفوه من أن يفسد عقيدة ولده، فبعث إلى ولده بأن يقتله بلا مراجعة، فخُيّره فاختار أن يموت جوعاً لأنه كان له عادة بالرياضة، فمُنع من الطعام حتى تلف وعاش ستاً وثلاثين سنة؛ وقال السيف الآمدي رأيته كثير العلم قليل العقل {cite:shadharat-dhahab p. 770}."
  en: "In 587 the philosopher Shihab al-Din Yahya al-Suhrawardi was killed at Aleppo. He had come there famous; al-Malik al-Zahir Ghazi, Salah al-Din's son, sat him in session, his brilliance dazzled, and the prince attached himself to him. The scholars marked him for heresy, drew up a warrant of unbelief, and warned Salah al-Din he would corrupt his son's creed — so the sultan ordered him killed without further consultation. Offered the manner of his death, he chose starvation, for austerity was his habit; food was withheld till he perished, aged thirty-six. Sayf al-Amidi: 'I saw him — much learning, little sense' {cite:shadharat-dhahab p. 770}."
