id: event/suhrawardi-execution-587
class: event
kind: death
label: { ar: "قتل شهاب الدين السهروردي بحلب سنة 587", en: "Killing of Shihab al-Din al-Suhrawardi in Aleppo, 587", es: "Asesinato de Shihab al-Din al-Suhrawardi en Alepo, 587", fr: "Meurtre de Shihab al-Din al-Suhrawardi à Alep, 587", ur: "حلب میں شہاب الدین السحروردی کا قتل، 587" }
summary:
  ar: "في سنة سبع وثمانين قُتل الفيلسوف شهاب الدين يحيى السهروردي بحلب؛ قدمها واشتهر اسمه فأقام له الملك الظاهر غازي ولد السلطان صلاح الدين مجلساً فبان فضله وبهر علمه فارتبط عليه الظاهر واختص به، وظهر للعلماء منه زندقة وانحلال فعلّموا حُرُماً بكفره وسيروه إلى صلاح الدين وخوفوه من أن يفسد عقيدة ولده، فبعث إلى ولده بأن يقتله بلا مراجعة، فخُيّره فاختار أن يموت جوعاً لأنه كان له عادة بالرياضة، فمُنع من الطعام حتى تلف وعاش ستاً وثلاثين سنة؛ وقال السيف الآمدي رأيته كثير العلم قليل العقل {cite:shadharat-dhahab p. 770}."
  en: "In 587 the philosopher Shihab al-Din Yahya al-Suhrawardi was killed at Aleppo. He had come there famous; al-Malik al-Zahir Ghazi, Salah al-Din's son, sat him in session, his brilliance dazzled, and the prince attached himself to him. The scholars marked him for heresy, drew up a warrant of unbelief, and warned Salah al-Din he would corrupt his son's creed — so the sultan ordered him killed without further consultation. Offered the manner of his death, he chose starvation, for austerity was his habit; food was withheld till he perished, aged thirty-six. Sayf al-Amidi: 'I saw him — much learning, little sense' {cite:shadharat-dhahab p. 770}."
  es: "En 587, el filósofo Shihab al-Din Yahya al-Suhrawardi fue asesinado en Alepo. Había llegado allí con gran fama; al-Malik al-Zahir Ghazi, hijo de Saladino, lo invitó a una sesión, deslumbrándolo con su brillantez, y el príncipe le tomó gran aprecio. Los eruditos lo señalaron como hereje, emitieron una orden de incredulidad y advirtieron a Saladino que corrompería el credo de su hijo; por lo tanto, el sultán ordenó su muerte sin más consultas. Al ofrecérsele la forma de morir, eligió la inanición, pues la austeridad era su costumbre; se le negó la comida hasta que falleció a los treinta y seis años. Sayf al-Amidi: «Lo vi: mucho saber, poco sentido común» {cita: shadharat-dhahab, pág. 770}."
  fr: "En 587, le philosophe Shihab al-Din Yahya al-Suhrawardi fut assassiné à Alep. Il y était arrivé célèbre; al-Malik al-Zahir Ghazi, fils de Saladin, le reçut en assemblée. Son intelligence éblouissant, le prince s'attacha à lui. Les savants le déclarèrent hérétique, rédigèrent un mandat d'infidélité et avertirent Saladin qu'il corromprait la foi de son fils. Le sultan ordonna alors son exécution sans autre consultation. Interrogé sur le mode de sa mort, il choisit la famine, car l'austérité était sa coutume; on lui refusa toute nourriture jusqu'à son décès, à l'âge de trente-six ans. Sayf al-Amidi: « Je l'ai vu – beaucoup de savoir, peu de bon sens » (cit.: shadharat-dhahab, p. 770)."
  ur: "587 میں فلسفی شہاب الدین یحییٰ السحروردی کو حلب میں قتل کر دیا گیا۔ وہ وہاں مشہور ہوا تھا۔ صلاح الدین کے بیٹے المالک الظاہر غازی نے اسے سیشن میں بٹھایا، اس کی چمک دمک اٹھی اور شہزادے نے خود کو اس سے جوڑ لیا۔ علماء نے اسے بدعت کے لئے نشان زد کیا، کفر کا وارنٹ تیار کیا، اور صلاح الدین کو متنبہ کیا کہ وہ اپنے بیٹے کے عقیدے کو خراب کرے گا - چنانچہ سلطان نے مزید مشاورت کے بغیر اسے قتل کرنے کا حکم دیا۔ اپنی موت کا طریقہ پیش کیا، اس نے بھوک کا انتخاب کیا، کیونکہ کفایت شعاری اس کی عادت تھی۔ کھانا روک دیا گیا یہاں تک کہ اس کی عمر چھتیس سال تھی۔ سیف العمدی: 'میں نے اسے دیکھا - بہت سیکھنے والا، کم عقل' 770}۔"
