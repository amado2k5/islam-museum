id: event/horse-race-musalla-al-ghaba
class: event
kind: competition
label:
  ar: سبق الخيل من الحفياء إلى الثنية
  en: The Prophet's horse race from al-Hafya' to al-Thaniyya
  ur: حفیاء سے ثنیہ تک نبی کی گھڑ دوڑ
  es: "La carrera de caballos del Profeta desde al-Hafya' hasta al-Thaniyya."
summary:
  ar: سابق النبي بين الخيل المضمرة من الحفياء إلى ثنية الوداع مسافة ستة أميال أو سبعة، وبين الخيل غير المضمرة من الثنية إلى
    مسجد بني زريق ميلًا أو نحوه، وكان عبد الله بن عمر فيمن سبق — حديث ابن عمر في الصحيحين {cite:sahih-al-bukhari}.
  en: The Prophet held a race for the trained horses from al-Hafya' to Thaniyyat al-Wada' — some six or seven miles — and
    one for the untrained from al-Thaniyya to the mosque of Banu Zurayq, a mile or so; Abdullah ibn Umar was among the winners
    — his report in the two Sahihs {cite:sahih-al-bukhari}.
  ur: نبی نے مضمر گھوڑوں کی دوڑ حفیاء سے ثنیہ الوداع تک چھ سات میل اور غیر مضمر کی ثنیہ سے مسجد بنو زریق تک ایک میل کے قریب
    کرائی؛ عبد اللہ بن عمر جیتنے والوں میں تھے — ان کی روایت صحیحین میں {cite:sahih-al-bukhari}۔
  es: "El Profeta organizó una carrera para caballos entrenados desde al-Hafya' hasta Thaniyyat al-Wada' —unas seis o siete millas— y otra para caballos sin entrenar desde al-Thaniyya hasta la mezquita de Banu Zurayq, una milla más o menos; Abdullah ibn Umar estuvo entre los ganadores —su relato se encuentra en los dos Sahihs {cite:sahih-al-bukhari}."
