id: event/ibn-asakir-death-571
class: event
kind: death
label:
  ar: "وفاة ابن عساكر ودفنه بمقبرة باب الصغير، ١١ رجب ٥٧١هـ/٢٥ يناير ١١٧٦م"
  en: "Ibn 'Asakir dies and is buried at Bab al-Saghir, 11 Rajab 571/25 January 1176"
  ur: "ابن عساکر کی وفات اور باب الصغیر میں تدفین، 11 رجب 571ھ/25 جنوری 1176ء"
  es: "Ibn 'Asakir muere y es enterrado en Bab al-Saghir, el 11 de Rajab de 571/25 de enero de 1176."
  fr: "Ibn 'Asakir meurt et est enterré à Bab al-Saghir, le 11 Rajab 571/25 janvier 1176"
  tr: "İbn Asakir'in ölümü ve Bab al-Saghir mezarlığına defnedilmesi, 11 Recep 571 H. / 25 Ocak 1176"
  id: "Wafatnya Ibnu Asakir dan penguburannya di pekuburan Bab al-Saghir, 11 Rajab 571 H / 25 Januari 1176 M."
summary:
  ar: "قال ابنه أبو محمد القاسم: توفي أبي في حادي عشر رجب، وحضر الصلاة عليه السلطان صلاح الدين، وصلّيت عليه في الجامع والشيخ قطب الدين في الميدان الذي يقابل المصلّى، ودُفن بمقبرة باب الصغير؛ وقبره مشهور يُزار {cite:tarikh-islam-dhahabi p. 82}، وذلك في ٢٥ يناير ١١٧٦م إلى جانب أبيه وسائر أهل بيته {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  en: "His son Abu Muhammad al-Qasim said: my father died on 11 Rajab, the sultan Salah al-Din attended the prayer over him, I prayed over him in the Great Mosque and Shaykh Qutb al-Din led it at the Maydan facing the musalla, and he was buried in the cemetery of Bab al-Saghir where his grave is well known and visited {cite:tarikh-islam-dhahabi p. 82} — 25 January 1176 — beside his father and the other members of his family {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  ur: "بیٹے ابو محمد قاسم کہتے ہیں: والد 11 رجب کو فوت ہوئے، سلطان صلاح الدین نمازِ جنازہ میں حاضر ہوا، میں نے جامع میں ان کی نماز پڑھائی اور شیخ قطب الدین نے مصلیٰ کے سامنے میدان میں، اور وہ باب الصغیر کے قبرستان میں دفن ہوئے جہاں ان کا مزار معروف اور متبرک مقامِ زیارت ہے {cite:tarikh-islam-dhahabi p. 82} — 25 جنوری 1176ء — والد اور خاندان کے دیگر افراد کے پہلو میں {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}۔"
  es: "Su hijo Abu Muhammad al-Qasim dijo: mi padre murió el 11 de Rajab, el sultán Salah al-Din asistió a la oración por él, yo oré por él en la Gran Mezquita y el jeque Qutb al-Din la dirigió en el Maydan frente a la musalla, y fue enterrado en el cementerio de Bab al-Saghir donde su tumba es bien conocida y visitada {cite:tarikh-islam-dhahabi p. 82} — 25 de enero de 1176 — junto a su padre y los demás miembros de su familia {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  fr: "Son fils Abu Muhammad al-Qasim a dit: mon père est décédé le 11 Rajab, le sultan Salah al-Din a assisté à la prière funéraire, j'ai prié pour lui dans la Grande Mosquée et le cheikh Qutb al-Din l'a dirigée au Maydan face à la musalla, et il a été enterré au cimetière de Bab al-Saghir où sa tombe est bien connue et visitée {cite:tarikh-islam-dhahabi p. 82} — 25 janvier 1176 — aux côtés de son père et des autres membres de sa famille {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  tr: "Oğlu Ebu Muhammed el-Kâsım şöyle dedi: Babam Receb ayının on birinci günü vefat etti ve Sultan Salah el-Din onun için cenaze namazına katıldı. Ben camide namaz kıldım, Şeyh Kutub el-Din ise namaz kılma yerinin karşısındaki meydanda namaz kıldı. Bab el-Sağrir mezarlığına defnedildi; mezarı meşhurdur ve ziyaret edilir. {kaynak:tarikh-islam-dhahabi s. 82}, 25 Ocak 1176'da babası ve ailesinin geri kalanıyla birlikte. {kaynak:encyclopaedia-of-islam-2 cilt 3 s. 746}"
  id: "Putranya, Abu Muhammad al-Qasim, berkata: Ayahku wafat pada tanggal sebelas Rajab, dan Sultan Salah al-Din menghadiri salat jenazahnya. Aku mendoakannya di masjid, dan Syekh Qutb al-Din mendoakannya di alun-alun di seberang tempat salat. Beliau dimakamkan di pemakaman Bab al-Saghir; makamnya terkenal dan banyak dikunjungi. {cite:tarikh-islam-dhahabi hlm. 82}, pada tanggal 25 Januari 1176 M, bersama ayahnya dan anggota keluarganya yang lain. {cite:encyclopaedia-of-islam-2 vol. 3 hlm. 746}."
