  en: "Al-Nuwayri's birth at Akhmim, 21 Dhu al-Qa'da 677/5 April 1279"
  ur: "نويری کی پیدائش اخمیم میں، 21 ذیقعدہ 677ھ/5 اپریل 1279ء"
  es: "Nacimiento de Al-Nuwayri en Akhmim, 21 Dhu al-Qa'da 677/5 de abril de 1279"
  fr: "Naissance d'Al-Nuwayri à Akhmim, 21 Dhu al-Qa'da 677/5 avril 1279"
  tr: "Al-Nuwayri, 21 Zilkade H. 677 / 5 Nisan 1279'da Akhmim'de doğdu."
  id: "Al-Nuwayri lahir di Akhmim, pada tanggal 21 Dhu al-Qi'dah 677 H / 5 April 1279 M."
summary:
  ar: "ولد شهاب الدين أحمد بن عبد الوهاب القرشي التيمي البكري النويري بأخميم في صعيد مصر يوم ٢١ ذي القعدة سنة ٦٧٧هـ/٥ أبريل ١٢٧٩م؛ والزركلي يجعل مولده ومنشأه بقوص. وأسرته ربما أصلها من بلدة نويرة الصغيرة بالصعيد وإن لم تكن له بها صلة مباشرة، وأبوه تاج الدين عبد الوهاب ⁦(٦١٨-٦٩٩هـ)⁩ ولد بمصر في المدرسة المعروفة بمنازل العز ووُصف بالتدين الشديد {cite:encyclopaedia-of-islam-2 vol. 8 p. 156} {cite:al-aalam j. 1 s.v. al-Nuwayri}."
  en: "Shihab al-Din Ahmad ibn Abd al-Wahhab al-Qurashi al-Taymi al-Bakri al-Nuwayri was born at Akhmim in Upper Egypt on 21 Dhu al-Qa'da 677/5 April 1279 — al-Zirikli makes his birth and upbringing at Qus. His family may have come from the small Sa'id township of al-Nuwayra though he had no direct link with it, and his father Taj al-Din Abd al-Wahhab (618-699) was born at Misr in the madrasa known as Manazil al-Izz and was remembered for his piety {cite:encyclopaedia-of-islam-2 vol. 8 p. 156} {cite:al-aalam j. 1 s.v. al-Nuwayri}."
  ur: "شہاب الدین احمد بن عبدالوہاب قرشی تیمی بکری نويری اخمیم، صعید مصر میں 21 ذیقعدہ 677ھ/5 اپریل 1279ء کو پیدا ہوئے — زرکلی ان کی پیدائش و پرورش قوص بتاتا ہے۔ خاندان شاید صعید کی چھوٹی بستی نویرہ سے تھا البتہ ان کا اس سے براہ راست تعلق نہ تھا؛ والد تاج الدین عبدالوہاب ⁦(618-699ھ)⁩ مصر میں منازل العز نام کی مدرسہ میں پیدا ہوئے اور دینداری میں مشہور تھے {cite:encyclopaedia-of-islam-2 vol. 8 p. 156} {cite:al-aalam j. 1 s.v. al-Nuwayri}۔"
  es: "Shihab al-Din Ahmad ibn Abd al-Wahhab al-Qurashi al-Taymi al-Bakri al-Nuwayri nació en Akhmim, en el Alto Egipto, el 21 de Dhu al-Qa'da de 677/5 de abril de 1279. Al-Zirikli sitúa su nacimiento y crianza en Qus. Su familia pudo haber provenido del pequeño pueblo Sa'id de al-Nuwayra, aunque no tuvo ningún vínculo directo con él, y su padre, Taj al-Din Abd al-Wahhab (618-699), nació en Misr, en la madrasa conocida como Manazil al-Izz, y fue recordado por su piedad {cite:encyclopaedia-of-islam-2 vol. 8 p. 156} {cite:al-aalam j. 1 sv al-Nuwayri}."
  fr: "Shihab al-Din Ahmad ibn Abd al-Wahhab al-Qurashi al-Taymi al-Bakri al-Nuwayri naquit à Akhmim, en Haute-Égypte, le 21 Dhu al-Qa'da 677 (5 avril 1279). Al-Zirikli situe sa naissance et son enfance à Qus. Sa famille était peut-être originaire de la petite ville de Saïd, al-Nuwayra, bien qu'il n'y ait eu aucun lien direct. Son père, Taj al-Din Abd al-Wahhab (618-699), naquit à Misr, dans la madrasa Manazil al-Izz, et était réputé pour sa piété (voir Encyclopaedia of Islam, vol. 8, p. 156; Al-Aalam, vol. 1, sv al-Nuwayri)."
  tr: "Şihab el-Din Ahmed ibn Abd el-Vahhab el-Kureşi el-Taymi el-Bakri el-Nuwayri, Hicri 677 yılının Zilhicce ayının 21'inde / Miladi 5 Nisan 1279'da Yukarı Mısır'ın Akhmim şehrinde doğmuştur. El-Zarkali, doğum ve yetişme yerini Kus olarak belirtir. Ailesinin Yukarı Mısır'daki küçük Nuwayrah kasabasından gelmiş olabileceği düşünülmektedir, ancak bu kasabayla doğrudan bir bağlantısı yoktur. Babası Tac el-Din Abd el-Vahhab (Hicri 618-699), Mısır'da Manazil el-İzz olarak bilinen okulda doğmuş ve son derece dindar biri olarak tanımlanmıştır. {cite:encyclopaedia-of-islam-2 vol. 8 p. 156} {cite:al-aalam j. 1 sv al-Nuwayri}."
  id: "Shihab al-Din Ahmad ibn Abd al-Wahhab al-Qurashi al-Taymi al-Bakri al-Nuwayri lahir di Akhmim, Mesir Hulu, pada tanggal 21 Dzul Qi'dah, 677 H/5 April 1279 M. Al-Zarkali menempatkan kelahiran dan masa kecilnya di Qus. Keluarganya mungkin berasal dari kota kecil Nuwayrah di Mesir Hulu, meskipun ia tidak memiliki hubungan langsung dengan kota tersebut. Ayahnya, Taj al-Din Abd al-Wahhab (618-699 H), lahir di Mesir di sekolah yang dikenal sebagai Manazil al-Izz dan digambarkan sebagai orang yang sangat religius. {cite:encyclopaedia-of-islam-2 vol. 8 p. 156} {cite:al-aalam j. 1 sv al-Nuwayri}."
