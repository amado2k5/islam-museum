label:
  ar: "ولادة النويري بأخميم، ٢١ ذي القعدة ٦٧٧هـ/٥ أبريل ١٢٧٩م"
  en: "Al-Nuwayri's birth at Akhmim, 21 Dhu al-Qa'da 677/5 April 1279"
  ur: "نويری کی پیدائش اخمیم میں، 21 ذیقعدہ 677ھ/5 اپریل 1279ء"
summary:
  ar: "ولد شهاب الدين أحمد بن عبد الوهاب القرشي التيمي البكري النويري بأخميم في صعيد مصر يوم ٢١ ذي القعدة سنة ٦٧٧هـ/٥ أبريل ١٢٧٩م؛ والزركلي يجعل مولده ومنشأه بقوص. وأسرته ربما أصلها من بلدة نويرة الصغيرة بالصعيد وإن لم تكن له بها صلة مباشرة، وأبوه تاج الدين عبد الوهاب ⁦(٦١٨-٦٩٩هـ)⁩ ولد بمصر في المدرسة المعروفة بمنازل العز ووُصف بالتدين الشديد {cite:encyclopaedia-of-islam-2 vol. 8 p. 156} {cite:al-aalam j. 1 s.v. al-Nuwayri}."
  en: "Shihab al-Din Ahmad ibn Abd al-Wahhab al-Qurashi al-Taymi al-Bakri al-Nuwayri was born at Akhmim in Upper Egypt on 21 Dhu al-Qa'da 677/5 April 1279 — al-Zirikli makes his birth and upbringing at Qus. His family may have come from the small Sa'id township of al-Nuwayra though he had no direct link with it, and his father Taj al-Din Abd al-Wahhab (618-699) was born at Misr in the madrasa known as Manazil al-Izz and was remembered for his piety {cite:encyclopaedia-of-islam-2 vol. 8 p. 156} {cite:al-aalam j. 1 s.v. al-Nuwayri}."
  ur: "شہاب الدین احمد بن عبدالوہاب قرشی تیمی بکری نويری اخمیم، صعید مصر میں 21 ذیقعدہ 677ھ/5 اپریل 1279ء کو پیدا ہوئے — زرکلی ان کی پیدائش و پرورش قوص بتاتا ہے۔ خاندان شاید صعید کی چھوٹی بستی نویرہ سے تھا البتہ ان کا اس سے براہ راست تعلق نہ تھا؛ والد تاج الدین عبدالوہاب ⁦(618-699ھ)⁩ مصر میں منازل العز نام کی مدرسہ میں پیدا ہوئے اور دینداری میں مشہور تھے {cite:encyclopaedia-of-islam-2 vol. 8 p. 156} {cite:al-aalam j. 1 s.v. al-Nuwayri}۔"
