label: { ar: "قيام بلاي بأشتوريش", en: "Pelayo's Uprising in Asturias", es: "La revuelta de Pelayo en Asturias", fr: "Le soulèvement de Pelayo dans les Asturies", ur: "Asturias میں پیلیو کی بغاوت", tr: "Play'in Ashtrush'u", id: "Asbak Play" }
summary:
  ar: "قال غير واحد من المؤرخين: أول من جمع فل النصارى بالأندلس بعد غلبة العرب لهم علج يقال له بلاي من أهل أشتوريش من جليقية، كان رهينة عن طاعة أهل بلده فهرب من قرطبة أيام الحر بن عبد الرحمن الثقفي في السنة السادسة من افتتاح الأندلس وهي سنة ثمان وتسعين، وثار النصارى معه على نائب الحر فطردوه وملكوا البلاد وبقي الملك فيهم، وكانت عدة من ملك منهم إلى آخر أيام الناصر لدين الله اثنين وعشرين ملكاً {cite:nafh-tib-maqqari p. 354}. وعند الرازي: لاذ بالصخرة في ثلاثمائة رجل ولم يزل المسلمون يقاتلونه حتى مات أصحابه جوعاً وبقي في ثلاثين رجلاً وعشر نسوة ولا طعام لهم إلا العسل يشتارونه من خروق بالصخرة حتى أعيا المسلمين أمرهم وقالوا: ثلاثون علجاً ما عسى أن يجيء منهم؟ فبلغ أمرهم من القوة والكثرة ما لا خفاء به؛ وفي سنة 133 هلك بلاي وملك ابنه فافله بعده ثم أذفونش بن بيطر جد بني أذفونش الذين اتصل ملكهم إلى اليوم {cite:nafh-tib-maqqari p. 355}. يذكر الكتاب أن المقاومة المسيحية انتعشت في المنطقة الشمالية الغربية بزعامة بلاي، فاضطر الحر بن عبد الرحمن الثقفي إلى العودة للقضاء عليها. {cite:salabi-umayyad-state-2020 p.83-84}"
  en: "Pelayo's revolt in Asturias: the hostage who fled Cordoba in 98 AH and rallied the Christians of Galicia-Asturias, and al-Razi's account of the rock where thirty men and ten women survived on wild honey until the Muslims despaired — 'what can thirty infidels do?' — the seed from which the northern kingdoms grew {cite:nafh-tib-maqqari p. 354-355}."
  es: "La revuelta de Pelayo en Asturias: el rehén que huyó de Córdoba en el año 98 de la Hégira y reunió a los cristianos de Galicia-Asturias, y el relato de al-Razi sobre la roca donde treinta hombres y diez mujeres sobrevivieron con miel silvestre hasta que los musulmanes se desesperaron —«¿qué pueden hacer treinta infieles?»— la semilla de la que surgieron los reinos del norte {cite:nafh-tib-maqqari p. 354-355}."
  fr: "La révolte de Pelayo dans les Asturies: l'otage qui s'enfuit de Cordoue en 98 AH et rallia les chrétiens de Galicie-Asturies, et le récit d'al-Razi sur le rocher où trente hommes et dix femmes survécurent grâce au miel sauvage jusqu'à ce que les musulmans désespèrent — « que peuvent faire trente infidèles ? » — la graine à partir de laquelle les royaumes du nord ont poussé {cite: nafh-tib-maqqari p. 354-355}."
  ur: "استوریہ میں پیلیو کی بغاوت: یرغمال جو 98 ہجری میں قرطبہ سے فرار ہوا اور گیلیسیا-آسٹوریاس کے عیسائیوں کو اکٹھا کیا، اور الرازی کا اس چٹان کا بیان جہاں تیس مرد اور دس عورتیں جنگلی شہد پر زندہ رہیں یہاں تک کہ مسلمان مایوس ہو گئے — 'تیس لوگ کیا کر سکتے ہیں؟' وہ بیج جس سے شمالی سلطنتیں پروان چڑھیں 354-355}۔"
  tr: "Birçok tarihçi şöyle demiştir: Arapların Endülüs'ü fethettikten sonra Hristiyanları ilk toplayan kişi, Galiçya'daki Asturias'tan Pelayo adında gayrimüslim biriydi. Ülkesinin halkının itaatine rehin olduğu için, Endülüs'ün fethinin altıncı yılında, yani 98. yılda, El-Hurr ibn Abdülrahman el-Sakkafi döneminde Kurtuba'dan kaçtı. Hristiyanlar onunla birlikte El-Hurr'un vekiline karşı ayaklandılar, onu kovdular ve ülkenin kontrolünü ele geçirdiler, krallık da onlarda kaldı. El-Nasir li-Din Allah'ın günlerinin sonuna kadar aralarından hüküm sürenlerin sayısı yirmi iki kraldı. {Kaynak: Nafh-tib-makqkari s. 354} Ve El-Razi'ye göre: Üç yüz adamıyla kayaya sığındı ve Müslümanlar onunla savaşmaya devam ettiler, ta ki arkadaşları açlıktan ölene kadar. Otuz erkek ve on kadınla kaldı ve kayadaki deliklerden topladıkları bal dışında yiyecekleri yoktu. Müslümanlar onun durumundan dolayı yorgun düştüler ve şöyle dediler: Otuz gayrimüslim, onlardan ne çıkabilir ki? Böylece güçleri ve sayıları o kadar arttı ki gizlenemedi. 133 yılında Pelayo öldü ve yerine oğlu Fafalah geçti, ardından da Alfonso hanedanının atası olan ve yönetimi günümüze kadar devam eden Alfonso ibn Bitar geçti. {kaynak:nafh-tib-maqqari s. 355}. Kitap, Pelayo'nun önderliğinde kuzeybatı bölgesinde Hristiyan direnişinin yeniden canlandığını ve Al-Hurr ibn Abd al-Rahman al-Thaqafi'nin bunu bastırmak için geri dönmek zorunda kaldığını belirtiyor. {kaynak:salabi-umayyad-state-2020 s. 83-84}"
  id: "Beberapa sejarawan mengatakan: Orang pertama yang mengumpulkan orang-orang Kristen di Andalusia setelah bangsa Arab menaklukkannya adalah seorang non-Muslim bernama Pelayo dari Asturias di Galicia. Ia menjadi sandera atas ketaatan rakyat negaranya, sehingga ia melarikan diri dari Cordoba pada masa pemerintahan Al-Hurr ibn Abd al-Rahman al-Thaqafi pada tahun keenam penaklukan Andalusia, yaitu tahun sembilan puluh delapan. Orang-orang Kristen memberontak bersamanya melawan wakil Al-Hurr, sehingga mereka mengusirnya dan mengambil alih kendali negara, dan kekuasaan raja tetap berada di tangan mereka. Jumlah penguasa dari kalangan mereka hingga akhir masa Al-Nasir li-Din Allah adalah dua puluh dua raja {kutip:nafh-tib-maqqari hlm. 354}. Dan menurut Al-Razi: Ia berlindung di balik batu karang bersama tiga ratus orang, dan kaum Muslim terus memeranginya hingga para sahabatnya meninggal karena kelaparan, dan ia hanya tinggal bersama tiga puluh orang laki-laki dan sepuluh orang perempuan, dan mereka tidak memiliki makanan kecuali madu, yang mereka kumpulkan dari lubang-lubang di batu karang, hingga kaum Muslim kelelahan melihat keadaannya dan berkata: Tiga puluh orang non-Muslim, apa yang bisa mereka lakukan? Maka kekuatan dan jumlah mereka menjadi begitu besar sehingga tidak dapat disembunyikan. Pada tahun 133, Pelayo meninggal, dan putranya Fafalah menggantikannya, diikuti oleh Alfonso ibn Bitar, leluhur dinasti Alfonso, yang pemerintahannya berlanjut hingga hari ini. {cite:nafh-tib-maqqari hlm. 355}. Buku tersebut menyebutkan bahwa perlawanan Kristen bangkit kembali di wilayah barat laut di bawah kepemimpinan Pelayo, memaksa Al-Hurr ibn Abd al-Rahman al-Thaqafi untuk kembali menumpasnya. {cite:salabi-umayyad-state-2020 hlm. 83-84}"
