label: { ar: "قيام بلاي بأشتوريش" }
summary:
  ar: "قال غير واحد من المؤرخين: أول من جمع فل النصارى بالأندلس بعد غلبة العرب لهم علج يقال له بلاي من أهل أشتوريش من جليقية، كان رهينة عن طاعة أهل بلده فهرب من قرطبة أيام الحر بن عبد الرحمن الثقفي في السنة السادسة من افتتاح الأندلس وهي سنة ثمان وتسعين، وثار النصارى معه على نائب الحر فطردوه وملكوا البلاد وبقي الملك فيهم، وكانت عدة من ملك منهم إلى آخر أيام الناصر لدين الله اثنين وعشرين ملكاً {cite:nafh-tib-maqqari p. 354}. وعند الرازي: لاذ بالصخرة في ثلاثمائة رجل ولم يزل المسلمون يقاتلونه حتى مات أصحابه جوعاً وبقي في ثلاثين رجلاً وعشر نسوة ولا طعام لهم إلا العسل يشتارونه من خروق بالصخرة حتى أعيا المسلمين أمرهم وقالوا: ثلاثون علجاً ما عسى أن يجيء منهم؟ فبلغ أمرهم من القوة والكثرة ما لا خفاء به؛ وفي سنة 133 هلك بلاي وملك ابنه فافله بعده ثم أذفونش بن بيطر جد بني أذفونش الذين اتصل ملكهم إلى اليوم {cite:nafh-tib-maqqari p. 355}. يذكر الكتاب أن المقاومة المسيحية انتعشت في المنطقة الشمالية الغربية بزعامة بلاي، فاضطر الحر بن عبد الرحمن الثقفي إلى العودة للقضاء عليها. {cite:salabi-umayyad-state-2020 p.83-84}"
  en: "Pelayo's revolt in Asturias: the hostage who fled Cordoba in 98 AH and rallied the Christians of Galicia-Asturias, and al-Razi's account of the rock where thirty men and ten women survived on wild honey until the Muslims despaired — 'what can thirty infidels do?' — the seed from which the northern kingdoms grew {cite:nafh-tib-maqqari p. 354-355}."
