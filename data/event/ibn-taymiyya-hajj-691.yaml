label:
  ar: "حج ابن تيمية ورسالته في المناسك، ٦٩١هـ/١٢٩٢م"
  en: "Ibn Taymiyya's pilgrimage and his treatise on the rites, 691/1292"
  ur: "ابن تیمیہ کا حج اور مناسک پر رسالہ، 691ھ/1292ء"
summary:
  ar: "حج ابن تيمية إلى مكة في أواخر سنة ٦٩١هـ/نوفمبر ١٢٩٢م وعاد إلى دمشق في ٦٩٢هـ/فبراير ١٢٩٣م، حاملاً من هذه الرحلة مادة رسالته في «مناسك الحج» التي أنكر فيها بدعاً دخلت على أعمال الحج {cite:encyclopaedia-of-islam-2 vol. 3 p. 983}."
  en: "Ibn Taymiyya performed the pilgrimage to Mecca toward the end of 691/November 1292 and was back in Damascus in 692/February 1293, bringing from the journey the substance of his treatise Manasik al-hajj, in which he denounced a number of innovations that had entered the rites of the pilgrimage {cite:encyclopaedia-of-islam-2 vol. 3 p. 983}."
  ur: "ابن تیمیہ نے 691ھ کے آخر/نومبر 1292ء میں حج کیا اور 692ھ/فروری 1293ء میں دمشق لوٹ آئے، اس سفر سے اپنے رسالے «مناسک الحج» کی مادہ معمور کیا جس میں انہوں نے حج کے اعمال میں داخل ہونے والی متعدد بدعات کی تردید کی {cite:encyclopaedia-of-islam-2 vol. 3 p. 983}۔"
