label:
  ar: "جواب علي بن أبي جعفر العلوي على قصيدة الوادعي، ص288-290"
  en: "The answer of Ali ibn Abi Jafar al-Alawi to the Wadi'i's poem, pp. 288-290"
  ur: "علی بن ابی جعفر علوی کا وادعی کی نظم پر جواب، ص288-290"
  es: "La respuesta de Ali ibn Abi Jafar al-Alawi al poema de Wadi'i, págs. 288-290"
  fr: "Réponse d'Ali ibn Abi Jafar al-Alawi au poème du Wadi'i, pp. 288-290"
  tr: "Ali ibn Abi Cafer el-Alavi'nin el-Vadi'i'nin şiirine cevabı, s. 288-290"
  id: "Tanggapan Ali ibn Abi Ja'far al-Alawi terhadap puisi al-Wadi'i, hlm. 288-290"
summary:
  ar: "يجيب علي بن أبي جعفر العلوي بقصيدة يصف فيها الدار ويذكر تحوله عن اللهو إلى الحلم والأدب وتمسكه بسبب الهادي، ثم يعجب مما صدر عن الحارثيين، ويخاطب كعب همدان بأنهم شركاء له في الدين والفضل، ويقول إن الأمر سيظهر قريباً."
  en: "Ali ibn Abi Jafar al-Alawi answers with a poem that describes the abode, tells of his turning from idle pleasure to forbearance and courtesy and of clinging to the tie of al-Hadi, wonders at what came from the Harithis, and addresses Ka'b of Hamdan as partners in religion and merit, saying their cause will soon show."
  ur: "علی بن ابی جعفر علوی ایک نظم میں جواب دیتے ہیں جس میں وہ گھر کی تصویر کھینچتے ہیں، کھیل کود سے حلم اور ادب کی طرف اپنے پلٹنے اور ہادی کے سبب سے وابستہ ہونے کا ذکر کرتے ہیں، حارثیوں کے کیے پر تعجب کرتے ہیں اور کعب ہمدان کو دین اور فضل میں اپنا شریک کہتے ہوئے کہتے ہیں کہ معاملہ جلد ظاہر ہوگا۔"
  es: "Ali ibn Abi Jafar al-Alawi responde con un poema que describe la morada, narra su transición de los placeres ociosos a la paciencia y la cortesía, y su apego al vínculo de al-Hadi, se maravilla de lo que provino de los Harithis y se dirige a Ka'b de Hamdan como socios en la religión y el mérito, diciendo que su causa pronto se demostrará."
  fr: "Ali ibn Abi Jafar al-Alawi répond par un poème qui décrit la demeure, raconte son passage des plaisirs futiles à la patience et à la courtoisie et à son attachement au lien d'al-Hadi, s'étonne de ce qui est venu des Harithis et s'adresse à Ka'b de Hamdan comme partenaires en religion et en mérite, disant que leur cause sera bientôt révélée."
  tr: "Ali ibn Abi Cafer el-Alavi, bir şiirle karşılık verir; şiirinde evi anlatır ve eğlenceden hayal kurmaya ve edebiyata yönelişini ve Hadi'nin rehberliğine bağlılığını dile getirir. Ardından Harisilerin söylediklerine hayret eder ve Kâb-ı Hamdan'a hitaben, onların din ve erdemde ortakları olduğunu söyler ve meselenin yakında açıklığa kavuşacağını belirtir."
  id: "Ali ibn Abi Jaafar al-Alawi menjawab dengan sebuah puisi di mana ia menggambarkan rumah tersebut dan menyebutkan peralihannya dari hiburan ke mimpi dan sastra serta ketaatannya pada petunjuk al-Hadi. Kemudian ia kagum dengan apa yang dikeluarkan oleh kaum Harithi, dan menyapa Kaab Hamdan, mengatakan bahwa mereka adalah sekutunya dalam agama dan kebajikan, dan ia mengatakan bahwa masalah ini akan segera menjadi jelas."
