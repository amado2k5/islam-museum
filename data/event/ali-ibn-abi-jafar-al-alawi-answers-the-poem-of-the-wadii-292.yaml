label:
  ar: "جواب علي بن أبي جعفر العلوي على قصيدة الوادعي، ص288-290"
  en: "The answer of Ali ibn Abi Jafar al-Alawi to the Wadi'i's poem, pp. 288-290"
  ur: "علی بن ابی جعفر علوی کا وادعی کی نظم پر جواب، ص288-290"
summary:
  ar: "يجيب علي بن أبي جعفر العلوي بقصيدة يصف فيها الدار ويذكر تحوله عن اللهو إلى الحلم والأدب وتمسكه بسبب الهادي، ثم يعجب مما صدر عن الحارثيين، ويخاطب كعب همدان بأنهم شركاء له في الدين والفضل، ويقول إن الأمر سيظهر قريباً."
  en: "Ali ibn Abi Jafar al-Alawi answers with a poem that describes the abode, tells of his turning from idle pleasure to forbearance and courtesy and of clinging to the tie of al-Hadi, wonders at what came from the Harithis, and addresses Ka'b of Hamdan as partners in religion and merit, saying their cause will soon show."
  ur: "علی بن ابی جعفر علوی ایک نظم میں جواب دیتے ہیں جس میں وہ گھر کی تصویر کھینچتے ہیں، کھیل کود سے حلم اور ادب کی طرف اپنے پلٹنے اور ہادی کے سبب سے وابستہ ہونے کا ذکر کرتے ہیں، حارثیوں کے کیے پر تعجب کرتے ہیں اور کعب ہمدان کو دین اور فضل میں اپنا شریک کہتے ہوئے کہتے ہیں کہ معاملہ جلد ظاہر ہوگا۔"
