label: { ar: "قتل أيتغمش صاحب همذان", en: "The killing of Ayatghamish, lord of Hamadan (610 AH)", es: "El asesinato de Ayatghamish, señor de Hamadán (610 AH)", fr: "L'assassinat d'Ayatghamish, seigneur d'Hamadan (610 AH)" }
summary:
  ar: "في المحرم سنة عشر وستمائة قتل أيتغمش الذي كان صاحب همذان؛ كان قد قدم بغداد فأنعم عليه الخليفة وشرفه بالخلع وسيره إلى همذان، فوصل إلى بلاد ابن ترجم منتظراً عساكر بغداد، وكان الخليفة قد عزل سليمان بن ترجم عن إمارة عشيرته من التركمان الأيوانية وولى أخاه الأصغر، فأرسل سليمان إلى منكلي يعرفه بحال أيتغمش فأخذوه وقتلوه وحملوا رأسه إلى منكلي وتفرق أصحابه في البلاد، فعظم ذلك على الخليفة وأرسل إلى منكلي ينكر عليه فأجاب جواباً شديداً وتمكن من البلاد {cite:kamil-ibn-al-athir p. 360}."
  en: "Muharram 610: the caliph's restored client Ayatghamish was betrayed on the road to Hamadan — Sulayman ibn Tarjam, displaced as amir of the Aywaniyya Turkmens, sold his position to Mangli, whose men took and killed him and carried his head to their master; al-Nasir's angry rebuke met only a harsh answer from Mangli now master of the Jibal {cite:kamil-ibn-al-athir p. 360}."
  es: "Muharram 610: el cliente restaurado del califa, Ayatghamish, fue traicionado en el camino a Hamadán. Sulayman ibn Tarjam, desplazado como emir de los turcomanos Aywaniyya, vendió su puesto a Mangli, cuyos hombres lo capturaron, lo mataron y llevaron su cabeza a su amo. La airada reprimenda de al-Nasir solo recibió una dura respuesta de Mangli, ahora amo del Jibal {cite:kamil-ibn-al-athir p. 360}."
  fr: "Muharram 610: l'Ayatghamish, client restauré du calife, fut trahi sur la route d'Hamadan — Sulayman ibn Tarjam, dépossédé de son poste d'émir des Turkmènes Aywaniyya, vendit sa position à Mangli, dont les hommes le capturèrent, le tuèrent et apportèrent sa tête à leur maître; la réprimande furieuse d'al-Nasir ne reçut qu'une réponse brutale de Mangli, désormais maître du Jibal {cite: kamil-ibn-al-athir p. 360}."
