label: { ar: "قتل أيتغمش صاحب همذان", en: "The killing of Ayatghamish, lord of Hamadan (610 AH)" }
summary:
  ar: "في المحرم سنة عشر وستمائة قتل أيتغمش الذي كان صاحب همذان؛ كان قد قدم بغداد فأنعم عليه الخليفة وشرفه بالخلع وسيره إلى همذان، فوصل إلى بلاد ابن ترجم منتظراً عساكر بغداد، وكان الخليفة قد عزل سليمان بن ترجم عن إمارة عشيرته من التركمان الأيوانية وولى أخاه الأصغر، فأرسل سليمان إلى منكلي يعرفه بحال أيتغمش فأخذوه وقتلوه وحملوا رأسه إلى منكلي وتفرق أصحابه في البلاد، فعظم ذلك على الخليفة وأرسل إلى منكلي ينكر عليه فأجاب جواباً شديداً وتمكن من البلاد {cite:kamil-ibn-al-athir p. 360}."
  en: "Muharram 610: the caliph's restored client Ayatghamish was betrayed on the road to Hamadan — Sulayman ibn Tarjam, displaced as amir of the Aywaniyya Turkmens, sold his position to Mangli, whose men took and killed him and carried his head to their master; al-Nasir's angry rebuke met only a harsh answer from Mangli now master of the Jibal {cite:kamil-ibn-al-athir p. 360}."
