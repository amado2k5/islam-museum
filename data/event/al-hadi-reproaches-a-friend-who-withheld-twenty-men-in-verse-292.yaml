id: event/al-hadi-reproaches-a-friend-who-withheld-twenty-men-in-verse-292
class: event
kind: other
label:
  ar: "أبيات للهادي يعاتب فيها صاحب بيت قصده فاعتذر ولم يمدّه بنحو عشرين رجلاً، ص314-315"
  en: "Verses of al-Hadi reproaching the master of a house he made for, who excused himself and did not send some twenty men, pp. 314-315"
  ur: "ہادی کے اشعار جن میں وہ ایک گھر والے کو عتاب کرتا ہے جس کے پاس وہ گیا تو اس نے عذر کیا اور تقریباً بیس آدمی نہ بھیجے، ص314-315"
  es: "Versos de al-Hadi reprochando al dueño de una casa que construyó, quien se excusó y no envió a unos veinte hombres, págs. 314-315."
summary:
  ar: "يتابع الهادي القصيدة في ص314-315 فيقول إنهم قصدوا بيت المخاطَب معتقدين أخوته فاعتذر بالانشغال، وطلبوا منه قوماً إلى العشرين فلم يفعل وقال إنهم عصوه، وزعم أن عنده كل ليث، ثم يذكر أنهم ظنوا فيه أنه لن يتخلف، وأن خيلهم مضت للصيد وفرت عن لقاء الآساد حين نهضوا للطعان."
  en: "Al-Hadi goes on with the poem over pp. 314-315, saying they made for the addressee's house trusting his brotherhood and he excused himself as busy, that they asked him for people up to twenty and he did not, saying they had disobeyed him, and claimed every lion was with him, then saying they had thought he would not hold back, and that his horse went off to the chase and fled from meeting the lions when they rose for the thrust."
  ur: "ہادی ص314-315 پر نظم جاری رکھتا ہے اور کہتا ہے کہ وہ مخاطب کے گھر اس کی برادری پر بھروسا کر کے گئے تو اس نے مصروفیت کا عذر کیا، ان سے بیس تک آدمی مانگے تو اس نے نہ دیے اور کہا کہ انہوں نے اس کی نافرمانی کی، اور دعویٰ کیا کہ ہر شیر اس کے پاس ہے، پھر کہتا ہے کہ انہوں نے گمان کیا تھا کہ وہ پیچھے نہ رہے گا، اور کہ اس کے گھوڑے شکار کو چلے گئے اور نیزہ زنی کے لیے اٹھنے پر شیروں کی ملاقات سے بھاگ گئے۔"
  es: "Al-Hadi prosigue con el poema en las páginas 314-315, diciendo que se dirigieron a la casa del destinatario confiando en su hermandad y que él se excusó diciendo que estaba ocupado, que le pidieron hasta veinte personas y él no lo hizo, diciendo que lo habían desobedecido y afirmando que todos los leones estaban con él, luego diciendo que habían pensado que no se detendría y que su caballo salió a la persecución y huyó para no encontrarse con los leones cuando se levantaron para el ataque."
