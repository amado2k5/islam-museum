id: event/umar-ii-returns-fadak
class: event
kind: law-enacted
label: { ar: "رد فدك إلى حالها النبوية", en: "Returning Fadak to Its Condition in the Prophet's Time", es: "Devolver a Fadak su estado de la época del Profeta.", fr: "Rétablir Fadak dans son état du temps du Prophète", ur: "عہد نبوی میں فدک کو اس کی حالت پر لوٹانا", tr: "Fadak'ı eski peygamberane haline geri döndürün.", id: "Kembalikan Fadak ke keadaan kenabiannya." }
summary:
  ar: "جمع عمر بن عبد العزيز بني مروان حين استخلف وقال إن رسول الله كانت له فدك ينفق منها ويعول منها على صغير بني هاشم ويزوج منها أيمهم وإن فاطمة سألته أن يجعلها لها فأبى فكانت كذلك حياة أبي بكر ثم عمر ثم أقطعها مروان ثم صارت لعمر فقال رأيت أمراً منعه رسول الله فاطمة ليس لي بحق وأشهدكم أني قد رددتها على ما كانت على عهد رسول الله، وبدأ بلحمته وأهل بيته فأخذ ما بأيديهم وسماها مظالم {cite:tarikh-khulafa-minhaj-1434 p. 378}."
  en: "On his accession Umar ibn Abd al-Aziz gathered the Banu Marwan and declared: the Prophet held Fadak, spending from it, providing for the young Banu Hashim and marrying off their widows; Fatima asked him for it and he refused, and it remained so through Abu Bakr and Umar, then Marwan granted it as iqta' until it reached Umar himself — 'I saw a thing the Prophet withheld from Fatima and it is not lawful for me; I bear you witness that I have returned it to what it was in the Prophet's time.' He began with his own kin, confiscating their holdings and naming them mazalim {cite:tarikh-khulafa-minhaj-1434 p. 378}."
  es: "Al ascender al trono, Umar ibn Abd al-Aziz reunió a los Banu Marwan y declaró: el Profeta poseía Fadak, gastando de él, proveyendo para los jóvenes Banu Hashim y casando a sus viudas; Fátima se lo pidió y él se negó, y así permaneció a través de Abu Bakr y Umar, luego Marwan lo otorgó como iqta' hasta que llegó al propio Umar: 'Vi algo que el Profeta le retuvo a Fátima y no me es lícito; les doy testimonio de que lo he devuelto a lo que era en tiempos del Profeta'. Comenzó con sus propios parientes, confiscando sus posesiones y nombrándolos mazalim {cite:tarikh-khulafa-minhaj-1434 p. 378}."
  fr: "À son accession au trône, Umar ibn Abd al-Aziz réunit les Banu Marwan et déclara: le Prophète possédait Fadak, dont il dépensait les biens pour subvenir aux besoins des jeunes Banu Hashim et marier leurs veuves; Fatima le lui demanda et il refusa, et cela resta ainsi entre les mains d’Abu Bakr et d’Umar, puis Marwan l’accorda en iqta’ jusqu’à ce qu’il parvienne à Umar lui-même — « J’ai vu une chose que le Prophète a cachée à Fatima et elle ne m’est pas licite; je vous atteste que je l’ai restituée à ce qu’elle était du temps du Prophète. » Il commença par ses propres proches, confisquant leurs biens et les déclarant mazalim (maison de confiscation)."
  ur: "ان کے الحاق پر عمر بن عبدالعزیز نے بنو مروان کو جمع کیا اور اعلان کیا: نبی نے فدک پر قبضہ کیا، اس میں سے خرچ کیا، نوجوان بنو ہاشم کی پرورش کی اور ان کی بیواؤں کی شادیاں کیں۔ فاطمہ نے ان سے مانگی تو انہوں نے انکار کر دیا اور ابوبکر و عمر کے ذریعے ایسا ہی رہا، پھر مروان نے اسے اقامت دے دیا، یہاں تک کہ خود عمر تک پہنچ گئی، میں نے دیکھا کہ رسول اللہ نے ایک چیز کو فاطمہ سے روک رکھا ہے اور وہ میرے لیے حلال نہیں ہے۔ میں آپ کو گواہی دیتا ہوں کہ میں نے اسے واپس کر دیا ہے جیسا کہ یہ پیغمبر کے زمانے میں تھا۔ اس نے اپنے رشتہ داروں کے ساتھ شروع کیا، ان کی ملکیت کو ضبط کیا اور ان کا نام مزلیم رکھا۔ 378}۔"
  tr: "Ömer ibn Abdülaziz halife olunca Beni Mervan'ı topladı ve şöyle dedi: “Allah Resulü'nün Fadak'ı vardı; bundan harcardı, Beni Haşim'in gençlerini geçindirir ve dullarını evlendirirdi. Fatıma ondan bunu kendisine vermesini istedi, ama o reddetti. Bu durum Ebu Bekir döneminde de böyle kaldı, sonra Ömer, sonra Mervan onu başkasına verdi, sonra Ömer'in oldu. Ömer, 'Allah Resulü'nün Fatıma'ya haram kıldığı bir şeyi gördüm ve ona hakkım yok. Şahitlik ederim ki, onu Allah Resulü zamanındaki haline geri döndürdüm' dedi. Kendi öz kanından ve ailesinden başladı, böylece ellerinde olanı aldı ve buna haksızlık dedi.” {cite:tarikh-khulafa-minhaj-1434 s. 378}"
  id: "Ketika Umar ibn Abd al-Aziz menjadi Khalifah, ia mengumpulkan Bani Marwan dan berkata, “Rasulullah memiliki Fadak, yang darinya beliau menghabiskan dan mendukung anak-anak muda Bani Hasyim serta menikahkan para janda mereka. Fatimah meminta agar Fadak diberikan kepadanya, tetapi beliau menolak. Hal itu tetap demikian selama masa hidup Abu Bakar, kemudian Umar, lalu Marwan memberikannya, kemudian menjadi milik Umar. Beliau berkata, ‘Aku melihat sesuatu yang dilarang oleh Rasulullah kepada Fatimah, dan aku tidak berhak atasnya. Aku bersaksi bahwa aku telah mengembalikannya seperti semula pada masa Rasulullah.’ Beliau memulai dengan darah dagingnya sendiri dan keluarganya, lalu beliau mengambil apa yang ada di tangan mereka dan menyebutnya sebagai ketidakadilan.” {cite:tarikh-khulafa-minhaj-1434 p. 378}"
