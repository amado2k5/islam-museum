label: { ar: "دخول بني بويه بغداد وتلقيبهم سنة 334" }
summary:
  ar: "في سنة 334هـ وجه المستكفي بالأطاف والنفائس والطعام إلى أبي الحسين أحمد بن بويه فدخل فلقي المستكفي ووقف بين يديه طويلاً وأخذت عليه البيعة واستحلف له بأغلظ الإيمان وحلف المستكفي لأبي الحسين بن بويه وأخويه وكتب بذلك كتاب ووقعت فيه الشهادة عليه ولبس أبو الحسين الخلع وطوق وسود وعقد إهواء وجعل أمير الأمراء وهو أول ملوك بني بويه ولقب أخواه الأكبر علي عماد الدولة والأوسط أبا علي الحسن ركن الدولة وأمر أن تضرب ألقابهم وكناهم على الدنانير والدراهم ونزل الديلم والأتراك دور الناس ولم يكن يعرف بغداد قبل هذا التنزل فصار من هذا اليوم رسماً {cite:muntazam-ibn-al-jawzi p. 632-633}."
  en: "In 334 al-Mustakfi received Abu'l-Husayn Ahmad ibn Buwayh with oaths and robes, made him amir al-umara — the first Buyid sovereign — titled his brothers Imad al-Dawla and Rukn al-Dawla and had the three titles struck on the coinage; Daylamites and Turks were quartered in Baghdad's houses, a custom new to the city {cite:muntazam-ibn-al-jawzi p. 632-633}."
