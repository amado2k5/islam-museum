label: { ar: "دخول بني بويه بغداد وتلقيبهم سنة 334", en: "The Buyids enter Baghdad and receive their titles, 334 AH", ur: "334ھ میں بنی بویہ کا بغداد میں داخلہ اور ان کے القاب" }
summary:
  ar: "في سنة 334هـ وجه المستكفي بالأطاف والنفائس والطعام إلى أبي الحسين أحمد بن بويه فدخل فلقي المستكفي ووقف بين يديه طويلاً وأخذت عليه البيعة واستحلف له بأغلظ الإيمان وحلف المستكفي لأبي الحسين بن بويه وأخويه وكتب بذلك كتاب ووقعت فيه الشهادة عليه ولبس أبو الحسين الخلع وطوق وسود وعقد إهواء وجعل أمير الأمراء وهو أول ملوك بني بويه ولقب أخواه الأكبر علي عماد الدولة والأوسط أبا علي الحسن ركن الدولة وأمر أن تضرب ألقابهم وكناهم على الدنانير والدراهم ونزل الديلم والأتراك دور الناس ولم يكن يعرف بغداد قبل هذا التنزل فصار من هذا اليوم رسماً {cite:muntazam-ibn-al-jawzi p. 632-633}. وعند مسكويه أن ذلك كان يوم السبت لإحدى عشرة ليلة خلت من جمادى الآخرة سنة 334هـ، بعد موت توزون في المحرم وإمارة ابن شيرزاد ثلاثة أشهر وعشرين يوماً واستتاره هو والمستكفي، ونزل أبو الحسين بباب الشماسية ولُقّب معز الدولة {cite:tajarib-al-umam-surush-v6 p. 111-115}."
  en: "In 334 al-Mustakfi received Abu'l-Husayn Ahmad ibn Buwayh with oaths and robes, made him amir al-umara — the first Buyid sovereign — titled his brothers Imad al-Dawla and Rukn al-Dawla and had the three titles struck on the coinage; Daylamites and Turks were quartered in Baghdad's houses, a custom new to the city {cite:muntazam-ibn-al-jawzi p. 632-633}. Miskawayh dates the audience to Saturday 11 Jumada II 334, after Tuzun's death in Muharram and Ibn Shirzad's three months and twenty days in command {cite:tajarib-al-umam-surush-v6 p. 111-115}."
