id: event/buyid-entry-baghdad-334
class: event
kind: conquest
label: { ar: "دخول بني بويه بغداد وتلقيبهم سنة 334", en: "The Buyids enter Baghdad and receive their titles, 334 AH", ur: "334ھ میں بنی بویہ کا بغداد میں داخلہ اور ان کے القاب", fr: "Les Bouyides entrent à Bagdad et reçoivent leurs titres, 334 H", es: "Los buyíes entran en Bagdad y reciben sus títulos, 334 AH.", tr: "Buyid hanedanı 334 yılında Bağdat'a girdi ve unvanlar aldı.", id: "Dinasti Buyid memasuki Baghdad dan diberi gelar pada tahun 334." }
summary:
  ar: "في سنة 334هـ وجه المستكفي بالأطاف والنفائس والطعام إلى أبي الحسين أحمد بن بويه فدخل فلقي المستكفي ووقف بين يديه طويلاً وأخذت عليه البيعة واستحلف له بأغلظ الإيمان وحلف المستكفي لأبي الحسين بن بويه وأخويه وكتب بذلك كتاب ووقعت فيه الشهادة عليه ولبس أبو الحسين الخلع وطوق وسود وعقد إهواء وجعل أمير الأمراء وهو أول ملوك بني بويه ولقب أخواه الأكبر علي عماد الدولة والأوسط أبا علي الحسن ركن الدولة وأمر أن تضرب ألقابهم وكناهم على الدنانير والدراهم ونزل الديلم والأتراك دور الناس ولم يكن يعرف بغداد قبل هذا التنزل فصار من هذا اليوم رسماً {cite:muntazam-ibn-al-jawzi p. 632-633}. وعند مسكويه أن ذلك كان يوم السبت لإحدى عشرة ليلة خلت من جمادى الآخرة سنة 334هـ، بعد موت توزون في المحرم وإمارة ابن شيرزاد ثلاثة أشهر وعشرين يوماً واستتاره هو والمستكفي، ونزل أبو الحسين بباب الشماسية ولُقّب معز الدولة {cite:tajarib-al-umam-surush-v6 p. 111-115}."
  en: "In 334 al-Mustakfi received Abu'l-Husayn Ahmad ibn Buwayh with oaths and robes, made him amir al-umara — the first Buyid sovereign — titled his brothers Imad al-Dawla and Rukn al-Dawla and had the three titles struck on the coinage; Daylamites and Turks were quartered in Baghdad's houses, a custom new to the city {cite:muntazam-ibn-al-jawzi p. 632-633}. Miskawayh dates the audience to Saturday 11 Jumada II 334, after Tuzun's death in Muharram and Ibn Shirzad's three months and twenty days in command {cite:tajarib-al-umam-surush-v6 p. 111-115}."
  fr: "En 334, al-Mustakfi reçut Abu'l-Husayn Ahmad ibn Buwayh avec serments et robes d'honneur, le fit amir al-umara (le premier souverain bouyide), conféra à ses frères les titres d'Imad al-Dawla et de Rukn al-Dawla et fit frapper les trois titres sur la monnaie ; Daylamites et Turcs furent logés dans les maisons de Bagdad, une coutume nouvelle pour la ville {cite:muntazam-ibn-al-jawzi p. 632-633}. Miskawayh date l'audience du samedi 11 Jumada II 334, après la mort de Tuzun en Muharram et les trois mois et vingt jours de commandement d'Ibn Shirzad {cite:tajarib-al-umam-surush-v6 p. 111-115}."
  es: "En 334, al-Mustakfi recibió a Abu'l-Husayn Ahmad ibn Buwayh con juramentos y vestiduras, lo nombró amir al-umara —el primer soberano buyí—, nombró a sus hermanos Imad al-Dawla y Rukn al-Dawla e hizo acuñar los tres títulos en las monedas; los daylamitas y los turcos se alojaron en casas de Bagdad, una costumbre nueva en la ciudad {cite:muntazam-ibn-al-jawzi p. 632-633}. Miskawayh fecha la audiencia el sábado 11 de Jumada II de 334, después de la muerte de Tuzun en Muharram y de los tres meses y veinte días de Ibn Shirzad al mando {cite:tajarib-al-umam-surush-v6 p. 111-115}."
  ur: "334 میں المستقفی نے ابو الحسین احمد بن بویہ کو بیعتوں اور لباسوں سے نوازا، اسے امیر العمرہ - پہلا خریدار حاکم - اپنے بھائیوں عماد الدولہ اور رکن الدولہ کا لقب دیا اور تینوں القابات کو سکوں پر نقش کیا؛ دیلامائٹس اور ترکوں کو بغداد کے گھروں میں رکھا گیا تھا، جو شہر کے لیے ایک نیا رواج تھا۔ 632-633}۔ مسکاوی نے سامعین کے لیے سنیچر 11 جمادی الثانی 334، محرم میں تزون کی موت اور ابن شیرزاد کے تین ماہ اور بیس دن کے حکم کے بعد تاریخ بیان کی ہے۔ 111-115}۔"
  tr: "Hicri 334 yılında, Müstekfi, Ebu Hüseyin Ahmed İbn Buveyh'e hediyeler, kıymetli eşyalar ve yiyecekler gönderdi. Ebu Hüseyin içeri girdi, Müstekfi ile görüştü ve uzun süre onun önünde durdu. Ondan biat yemini alındı ve ona en ciddi yeminlerle bağlılık yemini etti. Müstekfi, Ebu Hüseyin İbn Buveyh'e ve iki kardeşine yemin etti ve bu konuda bir belge yazdı ve şahitlik belgeye imza attı. Ebu Hüseyin'e şeref elbiseleri giydirildi, başına bir yaka ve siyah bir çelenk takıldı ve Emirler Emiri ilan edildi; Buyid hanedanının ilk kralı oldu. İki kardeşinden büyüğü Ali'ye İmadül-Devle, ortancası Ebu Ali el-Hasan'a ise Rukn-Devle unvanı verildi. Ünvanlarının ve lakaplarının dinar ve dirhemlere yazılmasını emretti. Delamîler ve Türkler halkın evlerine yerleştiler ve bu yerleşimden önce Bağdat bilinmiyordu ve bu günden itibaren bu durum gelenek haline geldi. {kaynak:muntazam-ibn-al-jawzi s. 632-633}. Miskawayh'a göre bu olay, Hicri 334 yılında Cemâde-i Ahiret'in bitiminden on bir gece önce, Cumartesi günü, Tuzun'un Muharrem ayındaki ölümünden ve İbn Şirzad'ın üç ay yirmi günlük hükümdarlığından ve onun ve el-Mustakfi'nin ortadan kaybolmasından sonra gerçekleşti. Ebu el-Hüseyin, Bab el-Şamasiye'de kaldı ve Mu'izz el-Dawla unvanı verildi. {kaynak:tajarib-al-umam-surush-v6 s. 111-115}."
  id: "Pada tahun 334 H, Al-Mustakfi mengirimkan hadiah, barang-barang berharga, dan makanan kepada Abu Al-Hussein Ahmad Ibn Buwayh. Ia masuk dan menemui Al-Mustakfi, dan berdiri di hadapannya untuk waktu yang lama. Sumpah setia diambil darinya, dan ia bersumpah kepadanya dengan sumpah yang paling khidmat. Al-Mustakfi bersumpah kepada Abu Al-Hussein Ibn Buwayh dan kedua saudaranya, dan ia menulis sebuah dokumen untuk itu, dan kesaksian tersebut ditandatangani. Abu Al-Hussein diberi jubah kehormatan, dan kalung serta karangan bunga hitam diletakkan di lehernya, dan ia diangkat menjadi Amir para Amir, dan ia adalah raja pertama dari dinasti Buyid. Kedua saudaranya, Ali yang lebih tua, diberi gelar Imad Al-Dawla, dan yang tengah, Abu Ali Al-Hasan, diberi gelar Rukn Al-Dawla. Ia memerintahkan agar gelar dan julukan mereka diukir pada dinar dan dirham. Kaum Daylam dan Turki menetap di rumah-rumah penduduk, dan Baghdad tidak dikenal sebelum pemukiman ini, dan sejak hari itu menjadi kebiasaan. {cite:muntazam-ibn-al-jawzi hlm. 632-633}. Menurut Miskawayh, ini terjadi pada hari Sabtu, sebelas malam sebelum berakhirnya Jumada al-Akhirah pada tahun 334 H, setelah kematian Tuzun di bulan Muharram dan pemerintahan Ibn Shirzad selama tiga bulan dua puluh hari, dan menghilangnya beliau dan al-Mustakfi. Abu al-Husayn tinggal di Bab al-Shamasiya dan diberi gelar Mu’izz al-Dawla {cite:tajarib-al-umam-surush-v6 hlm. 111-115}."
