label: { ar: "وقعة وارنه ونقض المعاهدة" }
summary:
  ar: "حرض أحد الملوك النصارى ملوكهم على نقض المعاهدة مع المسلمين وأقنع كل من اعترض عليه أنه باسم البابا يبرئ ذمتهم من نكثها ويبارك جنودهم وأسلحتهم، فنقض النصارى عهودهم وحشدوا الجيوش وحاصروا مدينة وارنه البلغارية الواقعة على ساحل البحر الأسود والتي كانت قد تحررت على أيدي المسلمين. ولما سمع المسلمون في أدرنة بزحف الصليبيين انتابهم الفزع وبعث رجال الدولة إلى السلطان مراد الثاني يستعجلون قدومه، فخرج من خلوته ليقود الجيوش، واتفق مع الأسطول الجنوي فنقل أربعين ألفاً من الجيش العثماني من آسيا إلى أوروبا تحت سمع الأسطول الصليبي وبصره في مقابل دينار لكل جندي. وأسرع مراد في السير فوصل وارنه في اليوم نفسه الذي وصل فيه الصليبيون، ووضع المعاهدة التي نقضها أعداؤها على رأس رمح ليشهدهم ويشهد السماء والأرض على الغدر، ودارت معركة رهيبة كاد فيها النصر للنصارى حتى التقى الملك لاديسلاس مع السلطان مراد وجهاً لوجه فعاجله بضربة من رمحه أسقطته عن جواده فجز المجاهدون رأسه ورفعوه على رمح مهللين مكبرين، فاستحوذ الفزع على جموع النصارى وبددت شملهم وولّوا مدبرين {cite:dawlat-uthmaniyya-salabi p. 81-82}."
  en: "Varna 1444 — Murad II came out of his retreat, ferried 40,000 men past the crusader fleet on Genoese hulls, raised the broken treaty on a spear-point, and unhorsed King Ladislas with his own lance {cite:dawlat-uthmaniyya-salabi p. 81-82}."
