label: { ar: "وقعة وارنه ونقض المعاهدة", en: "Battle of Varna and the breach of the treaty", fr: "La bataille de Varna et la rupture du traité", es: "La batalla de Varna y la violación del tratado", ur: "ورنا کی جنگ اور معاہدے کی خلاف ورزی", tr: "Warna Muharebesi ve antlaşmanın ihlali", id: "Pertempuran Warna dan pelanggaran perjanjian" }
summary:
  ar: "حرض أحد الملوك النصارى ملوكهم على نقض المعاهدة مع المسلمين وأقنع كل من اعترض عليه أنه باسم البابا يبرئ ذمتهم من نكثها ويبارك جنودهم وأسلحتهم، فنقض النصارى عهودهم وحشدوا الجيوش وحاصروا مدينة وارنه البلغارية الواقعة على ساحل البحر الأسود والتي كانت قد تحررت على أيدي المسلمين. ولما سمع المسلمون في أدرنة بزحف الصليبيين انتابهم الفزع وبعث رجال الدولة إلى السلطان مراد الثاني يستعجلون قدومه، فخرج من خلوته ليقود الجيوش، واتفق مع الأسطول الجنوي فنقل أربعين ألفاً من الجيش العثماني من آسيا إلى أوروبا تحت سمع الأسطول الصليبي وبصره في مقابل دينار لكل جندي. وأسرع مراد في السير فوصل وارنه في اليوم نفسه الذي وصل فيه الصليبيون، ووضع المعاهدة التي نقضها أعداؤها على رأس رمح ليشهدهم ويشهد السماء والأرض على الغدر، ودارت معركة رهيبة كاد فيها النصر للنصارى حتى التقى الملك لاديسلاس مع السلطان مراد وجهاً لوجه فعاجله بضربة من رمحه أسقطته عن جواده فجز المجاهدون رأسه ورفعوه على رمح مهللين مكبرين، فاستحوذ الفزع على جموع النصارى وبددت شملهم وولّوا مدبرين {cite:dawlat-uthmaniyya-salabi p. 81-82}."
  en: "Varna 1444 — Murad II came out of his retreat, ferried 40,000 men past the crusader fleet on Genoese hulls, raised the broken treaty on a spear-point, and unhorsed King Ladislas with his own lance {cite:dawlat-uthmaniyya-salabi p. 81-82}."
  fr: "Varna, 1444 : Murad II sortit de sa retraite, fit passer quarante mille hommes devant la flotte croisée sur des coques génoises, éleva le traité rompu au bout d'une lance et désarçonna le roi Ladislas de sa propre lance {cite:dawlat-uthmaniyya-salabi p. 81-82}."
  es: "Varna 1444 — Murad II salió de su retiro, transportó a 40.000 hombres más allá de la flota cruzada en cascos genoveses, levantó el tratado roto en la punta de una lanza y derribó al rey Ladislao de su caballo con su propia lanza {cite:dawlat-uthmaniyya-salabi p. 81-82}."
  ur: "ورنا 1444 - مراد دوم اپنی پسپائی سے باہر نکلا، 40,000 آدمیوں کو صلیبی بحری بیڑے سے گزر کر جینویس ہلز پر لے گیا، ٹوٹے ہوئے معاہدے کو نیزے کی نوک پر اٹھایا، اور بادشاہ لاڈیسلاس کو اپنے لانس سے اتار دیا {حوالہ: دولت عثمانیہ صلابی ص 81-82}۔"
  tr: "Hristiyan krallardan biri, diğer hükümdarları Müslümanlarla yapılan antlaşmayı bozmaya teşvik etti ve itiraz eden herkesi, Papa adına, antlaşmayı bozmaktan sorumlu olmadıklarına ikna ederek askerlerini ve silahlarını kutsadı. Bunun üzerine Hristiyanlar antlaşmalarını bozdular, ordular topladılar ve Karadeniz kıyısında bulunan ve Müslümanlar tarafından kurtarılmış olan Bulgar şehri Varna'yı kuşattılar. Edirne'deki Müslümanlar Haçlıların ilerleyişini duyunca paniğe kapıldılar ve Sultan'ın yetkilileri Sultan II. Murad'a haberciler göndererek hızla gelmesini rica ettiler. Murad, orduları yönetmek için inzivadan çıktı ve Ceneviz filosuyla bir anlaşma yaparak, Haçlı filosunun burnunun dibinden kırk bin Osmanlı askerini Asya'dan Avrupa'ya, asker başına bir dinar karşılığında taşıdı. Murad yürüyüşünü hızlandırdı ve Haçlıların vardığı gün Varna'ya ulaştı. Düşmanlarının bozduğu antlaşmayı, ihanetlerine şahitlik etmeleri için, gökleri ve yeri şahit tutmak amacıyla bir mızrağın ucuna yerleştirdi. Korkunç bir savaş başladı ve zafer neredeyse Hristiyanların elindeydi ki Kral Ladislas, Sultan Murad ile yüz yüze geldi. Mızrağıyla ona bir darbe indirdi ve onu atından düşürdü. Mücahitler başını kesip bir mızrağın ucuna takarak, ilahiler okuyup Tanrı'yı övdüler. Hristiyan kitleleri paniğe kapıldı, saflarını dağıttılar ve kaçıp gittiler. {cite:dawlat-uthmaniyya-salabi s. 81-82}"
  id: "Salah satu raja Kristen menghasut para penguasa lainnya untuk melanggar perjanjian dengan kaum Muslim, meyakinkan semua yang menentang bahwa, atas nama Paus, ia membebaskan mereka dari tanggung jawab apa pun atas pelanggaran tersebut dan memberkati tentara serta senjata mereka. Kaum Kristen kemudian melanggar perjanjian mereka, mengumpulkan pasukan, dan mengepung kota Varna di Bulgaria, yang terletak di pantai Laut Hitam, yang telah dibebaskan oleh kaum Muslim. Ketika kaum Muslim di Edirne mendengar tentang kemajuan Tentara Salib, kepanikan melanda mereka, dan para pejabat Sultan mengirim utusan kepada Sultan Murad II, mendesaknya untuk segera datang. Ia keluar dari pengasingannya untuk memimpin pasukan dan membuat kesepakatan dengan armada Genoa, mengangkut empat puluh ribu tentara Ottoman dari Asia ke Eropa tepat di depan mata armada Tentara Salib, dengan imbalan satu dinar per tentara. Murad mempercepat perjalanannya dan mencapai Varna pada hari yang sama dengan kedatangan Tentara Salib. Ia meletakkan perjanjian yang telah dilanggar musuh-musuhnya di ujung tombak untuk menjadi saksi bagi mereka dan bagi langit dan bumi untuk menyaksikan pengkhianatan itu. Pertempuran dahsyat pun terjadi di mana kemenangan hampir berada di pihak Kristen hingga Raja Ladislas bertemu Sultan Murad secara langsung. Ia menikamnya dengan tombak, menjatuhkannya dari kudanya. Para mujahidin memenggal kepalanya dan mengangkatnya di atas tombak, sambil melantunkan doa dan memuji Tuhan. Kepanikan melanda massa Kristen, membubarkan barisan mereka, dan mereka berbalik dan melarikan diri. {cite:dawlat-uthmaniyya-salabi p. 81-82}"
