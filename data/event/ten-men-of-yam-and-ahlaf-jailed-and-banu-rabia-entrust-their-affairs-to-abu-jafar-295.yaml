id: event/ten-men-of-yam-and-ahlaf-jailed-and-banu-rabia-entrust-their-affairs-to-abu-jafar-295
class: event
kind: other
label:
  ar: "حبس عشرة من يأم والأحلاف، وإسناد أمر بني ربيعة إلى أبي جعفر، سنة 295هـ، ص361"
  en: "Ten men of Yam and Ahlaf are jailed in chains, and Banu Rabi'a's affairs are entrusted to Abu Ja'far, 295 AH, p. 361"
  ur: "یأم اور احلاف کے دس آدمیوں کو زنجیروں میں قید، اور بنو ربیعہ کے معاملات ابو جعفر کے سپرد، 295ھ، ص361"
  es: "Diez hombres de Yam y Ahlaf son encarcelados encadenados, y los asuntos de Banu Rabi'a son confiados a Abu Ja'far, 295 AH, pág. 361"
  fr: "Dix hommes de Yam et d'Ahlaf sont emprisonnés et enchaînés, et les affaires des Banu Rabi'a sont confiées à Abu Ja'far, 295 AH, p. 361"
summary:
  ar: "حبس الهادي عشرة رجال من يأم والأحلاف في الحديد، وجاءت بنو ربيعة تسأله أن يوصي بهم أبا جعفر محمد بن عبيد الله، فأجابهم، واستحلف أبا جعفر على النصرة لبني ربيعة والعناية بأمرهم."
  en: "Al-Hadi had ten men of Yam and Ahlaf jailed in chains. Banu Rabi'a came to him asking that he commend them to Abu Ja'far Muhammad ibn Ubaydallah, saying that after Ibn Bistam they had no one but al-Hadi. He agreed, and had Abu Ja'far swear to support Banu Rabi'a and to look after their affairs."
  ur: "ہادی نے یأم اور احلاف کے دس آدمیوں کو زنجیروں میں قید کر دیا۔ بنو ربیعہ ہادی کے پاس آئے اور مطالبہ کیا کہ وہ انہیں ابو جعفر محمد بن عبیداللہ کے سپرد کریں، کیونکہ ابن بسطام کے بعد ان کا ہادی کے سوا کوئی نہ تھا۔ ہادی نے منظور کیا اور ابو جعفر سے حلف لیا کہ وہ بنو ربیعہ کی مدد اور ان کے معاملات کی دیکھ بھال کریں گے۔"
  es: "Al-Hadi tenía diez hombres de Yam y Ahlaf encarcelados y encadenados. Los Banu Rabi'a acudieron a él pidiéndole que los recomendara a Abu Ja'far Muhammad ibn Ubaydallah, argumentando que, después de Ibn Bistam, no tenían a nadie más que a Al-Hadi. Él accedió e hizo que Abu Ja'far jurara apoyar a los Banu Rabi'a y velar por sus asuntos."
  fr: "Al-Hadi avait fait emprisonner et enchaîner dix hommes de Yam et d'Ahlaf. Les Banu Rabi'a vinrent le trouver pour lui demander de les recommander à Abu Ja'far Muhammad ibn Ubaydallah, affirmant qu'après Ibn Bistam, ils n'avaient plus personne d'autre qu'al-Hadi. Il accepta et fit jurer à Abu Ja'far de soutenir les Banu Rabi'a et de veiller sur leurs affaires."
