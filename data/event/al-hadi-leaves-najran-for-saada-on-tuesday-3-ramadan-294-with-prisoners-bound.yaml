label:
  ar: "الهادي يغادر نجران إلى صعدة يوم الثلاثاء 3 رمضان 294هـ ومعه الأسرى مقيدون، ص341"
  en: "Al-Hadi leaves Najran for Sa'da on Tuesday 3 Ramadan 294 AH with the prisoners bound, p. 341"
  ur: "ہادی کا منگل 3 رمضان 294ھ کو قیدیوں کو باندھ کر نجران سے صعدہ روانہ ہونا، ص341"
summary:
  ar: "خرج الهادي من نجران يوم الثلاثاء لثلاث خلون من رمضان، ومعه القرامطة مربوطين بالحبال وأسرى اليأميين على الجمال وابن الربيع موثوقاً، وشيّعه محمد بن عبيد الله إلى القدر الأعلى ثم رجع إلى الهجر."
  en: "Al-Hadi left Najran on Tuesday, 3 Ramadan. He took the Qarmatian prisoners tied with ropes, the Ya'am prisoners on camels, and Ali ibn al-Rabi' bound. Muhammad ibn Ubaydallah escorted him to al-Qadar al-A'la and then went back to al-Hijr."
  ur: "ہادی منگل کے دن 3 رمضان کو نجران سے نکلے۔ قرامطہ کو رسیوں سے باندھا گیا، یامیین کے قیدی اونٹوں پر لادے گئے اور علی بن الربیع کو بندھا ہوا ساتھ لیا گیا۔ محمد بن عبید اللہ قدر الاعلیٰ تک ساتھ گئے اور پھر الہجر لوٹ آئے۔"
