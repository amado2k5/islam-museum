id: event/death-of-mutawakkil
class: event
kind: death
label: { ar: "مقتل المتوكل", en: "Killing of al-Mutawakkil", es: "Asesinato de al-Mutawakkil", fr: "Meurtre d'al-Mutawakkil", ur: "متوکل کا قتل", tr: "El-Mutavakkil'in öldürülmesi", id: "Pembunuhan Al-Mutawakkil" }
summary:
  ar: "في سنة سبع وأربعين ومائتين قُتل المتوكل في مجلسه بعد أن دخل عليه جماعة من الأتراك {cite:tabari-tarikh-abu-al-fadl j.9 p.226} {cite:tabari-tarikh-abu-al-fadl j.9 p.228}، وذكر الطبري بعض أموره وسيرته {cite:tabari-tarikh-abu-al-fadl j.9 p.230}، وعند السيوطي بايع بولاية العهد لابنه المنتصر ثم المعتز ثم المؤيد ثم أراد أن يقدم المعتز لمحبته لأمه فسأل المنتصر أن ينزل فأبى فكان يحط منزلته ويهدده ويشتمه واتفق أن الأتراك انحرفوا عنه فاتفقوا مع المنتصر على قتل أبيه فدخل عليه خمسة وهو في جوف الليل في مجلس لهوه فقتلوه هو ووزيره الفتح بن خاقان وذلك في خامس شوال سنة سبع وأربعين، ورئي في النوم فقيل ما فعل الله بك قال غفر لي بقليل من السنة أحييتها {cite:tarikh-khulafa-minhaj-1434 p. 543-544}. وعند المسعودي عن البحتري أن المتوكل اشترى سيفاً من اليمن بعشرة آلاف درهم ودفعه إلى باغر ليقف به على رأسه فما انتضاه إلا ليلة قتله إياه، وأنه سجد لله وعفر وجهه بالتراب ونثره في لحيته ثم قعد للشراب، وأن قبيحة وجهت بخلعة حمراء فخرق مطرفها وقال احتفظي به ليكون كفناً لي، ثم أقبل باغر وعشرة متلثمين فضربه باغر على جانبه الأيمن فقده إلى خاصرته ثم الأيسر، والفتح يمانعهم حتى بعجوه، وذلك ليلة الأربعاء لثلاث خلون من شوال سنة سبع وأربعين ومائتين، وكان مولده بفم الصلح {cite:muruj-al-dhahab p. 504-506}، وكان الموضع الذي قتل فيه يعرف بالماخورة وهو الموضع الذي قتل فيه شيرويه أباه أبرويز، وفي بساطه صورة ملك الفرس مكتوب ملك ستة أشهر وصورة يزيد بن الوليد ملك ستة أشهر {cite:muruj-al-dhahab p. 514}"
  en: "In 247 al-Mutawakkil was killed in his own assembly after a group of Turks entered upon him {cite:tabari-tarikh-abu-al-fadl j.9 p.226} {cite:tabari-tarikh-abu-al-fadl j.9 p.228}; Tabari also records some of his affairs and conduct {cite:tabari-tarikh-abu-al-fadl j.9 p.230}. In al-Suyuti he had named his son al-Muntasir heir, then al-Mu'tazz, then al-Mu'ayyad; later, out of love for their mother, he wished to advance al-Mu'tazz and asked al-Muntasir to step down. When al-Muntasir refused, al-Mutawakkil diminished his standing, threatened him and insulted him. The Turks turned from al-Mutawakkil and agreed with al-Muntasir to kill his father; five of them entered upon him in the dead of night while he was in his assembly of revelry, and they killed him and his vizier al-Fath ibn Khaqan on the fifth of Shawwal 247. He was seen in a dream and asked what God had done with him; he said, 'He forgave me for a little of the Sunna that I revived' {cite:tarikh-khulafa-minhaj-1434 p. 543-544}. In al-Mas'udi, citing al-Buhturi, al-Mutawakkil bought a sword from Yemen for ten thousand dirhams and gave it to Bagir to stand at his head; Bagir drew it only on the night he killed him. He prostrated to God, rubbed his face in dust and scattered it on his beard, then sat down to drink. Qabiha sent him a red robe; he tore its edge and said, 'Keep it, so that it may be my shroud.' Then Bagir came with ten masked men; he struck him on the right side, cutting down to the flank, then on the left, while al-Fath held them off until they overpowered him. This was on the night of Wednesday, three nights into Shawwal 247. He was born at Fam al-Sulh {cite:muruj-al-dhahab p. 504-506}. The place where he was killed was known as al-Makhura, where Shiruyah had killed his father Khusraw Parviz. On the carpet was an image of a Persian king inscribed 'king for six months', and an image of Yazid ibn al-Walid inscribed 'king for six months' {cite:muruj-al-dhahab p. 514}."
  es: "En 247 al-Mutawakkil fue asesinado en su propia asamblea después de que un grupo de turcos entrara en su lugar {cite:tabari-tarikh-abu-al-fadl j.9 p.226} {cite:tabari-tarikh-abu-al-fadl j.9 p.228}; Tabari también registra algunos de sus asuntos y conducta {cite:tabari-tarikh-abu-al-fadl j.9 p.230}. En al-Suyuti había nombrado a su hijo al-Muntasir heredero, luego al-Mu'tazz, luego al-Mu'ayyad; más tarde, por amor a su madre, deseó ascender a al-Mu'tazz y le pidió a al-Muntasir que se retirara. Cuando al-Muntasir se negó, al-Mutawakkil disminuyó su posición, lo amenazó y lo insultó. Los turcos se apartaron de al-Mutawakkil y acordaron con al-Muntasir matar a su padre; Cinco de ellos lo atacaron en la oscuridad de la noche mientras estaba en su asamblea de juerga, y lo mataron a él y a su visir al-Fath ibn Khaqan el cinco de Shawwal de 247. Se le apareció en un sueño y le preguntó qué había hecho Dios con él; dijo: «Me perdonó por un poco de la Sunna que reviví» {cite:tarikh-khulafa-minhaj-1434 p. 543-544}. En al-Mas'udi, citando a al-Buhturi, al-Mutawakkil compró una espada en Yemen por diez mil dirhams y se la dio a Bagir para que la colocara a la cabecera; Bagir la desenvainó solo la noche en que lo mató. Se postró ante Dios, se frotó la cara con polvo y lo esparció sobre su barba, luego se sentó a beber. Qabiha le envió una túnica roja; él rasgó el borde y dijo: «Consérvala, para que sea mi mortaja». Entonces Bagir llegó con diez hombres enmascarados; lo golpeó en el lado derecho, cortando hasta el flanco, y luego en el izquierdo, mientras al-Fath los contenía hasta que lo dominaron. Esto ocurrió la noche del miércoles, tres noches después del inicio de Shawwal 247. Nació en Fam al-Sulh {cite:muruj-al-dhahab p. 504-506}. El lugar donde fue asesinado se conocía como al-Makhura, donde Shiruyah había matado a su padre, Khusraw Parviz. En la alfombra había una imagen de un rey persa con la inscripción \"rey durante seis meses\" y una imagen de Yazid ibn al-Walid con la inscripción \"rey durante seis meses\" {cite:muruj-al-dhahab p. 514}."
  fr: "En 247, al-Mutawakkil fut tué dans sa propre assemblée après l'assaut d'un groupe de Turcs (voir Tabari-tarikh-abu-al-fadl, vol. 9, p. 226; Tabari-tarikh-abu-al-fadl, vol. 9, p. 228). Tabari relate également certains de ses actes et de sa conduite (voir Tabari-tarikh-abu-al-fadl, vol. 9, p. 230). Dans son ouvrage al-Suyuti, il avait désigné son fils al-Muntasir comme héritier, puis al-Mu'tazz, puis al-Mu'ayyad. Plus tard, par amour pour leur mère, il souhaita promouvoir al-Mu'tazz et demanda à al-Muntasir de se retirer. Face au refus de ce dernier, al-Mutawakkil le rabaissa, le menaça et l'insulta. Les Turcs se détournèrent alors d'al-Mutawakkil et s'allièrent avec al-Muntasir pour assassiner son père. Cinq d'entre eux l'attaquèrent en pleine nuit, alors qu'il était en pleine fête, et ils le tuèrent, ainsi que son vizir al-Fath ibn Khaqan, le 5 Shawwal 247. Il apparut en songe et demanda à Dieu ce qu'il lui avait fait; il répondit: « Il m'a pardonné d'avoir ravivé un peu de la Sunna » (voir Tarikh-Khulafa-Minhaj, vol. 1434, p. 543-544). Dans al-Mas'udi, citant al-Buhturi, al-Mutawakkil acheta une épée au Yémen pour dix mille dirhams et la donna à Bagir, qui la brandit à sa tête. Bagir ne la tira que la nuit où il le tua. Il se prosterna devant Dieu, se frotta le visage dans la poussière et la répandit sur sa barbe, puis s'assit pour boire. Qabiha lui envoya une robe rouge; il en déchira le bord et dit: « Garde-la, qu'elle me serve de linceul. » Bagir arriva alors avec dix hommes masqués; il le frappa sur le flanc droit, le tailladant, puis sur le flanc gauche, tandis qu’al-Fath les retint jusqu’à ce qu’ils le maîtrisent. C’était dans la nuit du mercredi, trois nuits après le début de Shawwal 247. Il était né à Fam al-Sulh (voir Muruj-al-Dhahab, p. 504-506). Le lieu où il fut tué était connu sous le nom d’al-Makhura, où Shiruyah avait tué son père, Khusraw Parviz. Sur le tapis se trouvaient l’image d’un roi perse avec l’inscription « roi pendant six mois », et une image de Yazid ibn al-Walid avec la même inscription (voir Muruj-al-Dhahab, p. 514)."
  ur: "247 میں متوکل کو اپنی ہی مجلس میں اس وقت قتل کر دیا گیا جب ترکوں کا ایک گروہ اس پر داخل ہوا {حوالہ: طبری-تاریخ-ابو الفضل ج.9 ص226} {حوالہ: طبری-تاریخ-ابو الفضل ج.9 ص228} طبری نے اس کے کچھ معاملات اور طرز عمل کو بھی درج کیا ہے {حوالہ: طبری-تاریخ-ابو الفضل ج.9 صفحہ 230}۔ السیوطی میں اس نے اپنے بیٹے کا نام المنتصر وارث رکھا، پھر المعتز، پھر المعیاد؛ بعد میں، اپنی ماں کی محبت میں، اس نے المعتز کو آگے بڑھانا چاہا اور المنتصر سے کہا کہ وہ سبکدوش ہو جائیں۔ جب المنتصر نے انکار کیا تو متوکل نے اس کا موقف کم کر دیا، اسے دھمکیاں دیں اور اس کی توہین کی۔ ترکوں نے المتوکل سے رجوع کیا اور المنتصر سے اپنے والد کو قتل کرنے پر رضامندی ظاہر کی۔ ان میں سے پانچ لوگ رات کے آخری پہر میں اس کے پاس آئے جب وہ محفل میلاد میں تھا اور انہوں نے اسے اور اس کے وزیر الفتح ابن خاقان کو پانچویں شوال 247 کو قتل کر دیا۔ اسے خواب میں دیکھا گیا اور پوچھا کہ خدا نے اس کے ساتھ کیا کیا؟ اس نے کہا، 'اس نے مجھے تھوڑی سی سنت کے لیے معاف کر دیا جسے میں نے زندہ کیا تھا'۔ 543-544}۔ المسعودی میں، البطوری کا حوالہ دیتے ہوئے، المتوکل نے یمن سے ایک تلوار دس ہزار درہم میں خریدی اور اسے اپنے سر پر کھڑا ہونے کے لیے بغیر کو دیا۔ بگیر نے اسے اسی رات کھینچا جب اس نے اسے قتل کیا۔ اس نے خدا کو سجدہ کیا، اپنا چہرہ خاک میں ملایا اور اسے اپنی داڑھی پر بکھیر دیا، پھر پینے بیٹھ گیا۔ قبیحہ نے اسے سرخ چوغہ بھیجا۔ اس نے اس کا کنارہ پھاڑ دیا اور کہا اسے رکھو تاکہ یہ میرا کفن ہو۔ پھر بگیر دس نقاب پوش آدمیوں کے ساتھ آیا۔ اس نے اسے دائیں طرف سے مارا، پہلو تک کاٹ دیا، پھر بائیں طرف، جب کہ الفتح نے انہیں روکے رکھا یہاں تک کہ وہ اس پر قابو پا گئے۔ یہ بدھ کی رات تھی، شوال 247 کی تین راتیں، آپ کی ولادت فم السلح میں ہوئی۔ 504-506}۔ وہ جگہ جہاں اسے قتل کیا گیا وہ المخورا کے نام سے مشہور تھا جہاں شیرویہ نے اپنے والد خسرو پرویز کو قتل کیا تھا۔ قالین پر ایک فارسی بادشاہ کی تصویر تھی جس پر 'چھ ماہ کے لیے بادشاہ' لکھا ہوا تھا، اور یزید بن الولید کی تصویر 'چھ ماہ کے لیے بادشاہ' لکھا ہوا تھا۔ 514}۔"
  tr: "Hicri 247 yılında, bir grup Türk'ün sarayına girmesi sonucu el-Mutavakkil öldürüldü. Taberi, onun bazı işlerinden ve biyografisinden bahseder. Suyuti'ye göre, önce oğlu el-Muntasir'e veliaht olarak biat etti, sonra el-Mu'tazz'a, ardından da el-Muayyad'a. Daha sonra annesine olan sevgisinden dolayı el-Mu'tazz'ı yükseltmek istedi ve el-Muntasir'den geri çekilmesini istedi, ancak el-Muntasir reddetti. Bunun üzerine onu küçümsedi, tehdit etti ve hakaret etti. Bunun üzerine Türkler ona karşı döndüler ve el-Muntasir ile birlikte babasını öldürmek için komplo kurdular. Beş adam gece yarısı, zevk odasındayken ona girdiler ve onu ve veziri el-Fath ibn Khaqan'ı öldürdüler. Bu olay, Hicri 247 yılının Şevval ayının beşinci gününde gerçekleşti. Rüyada görülmüş ve kendisine, \"Allah sana ne yaptı?\" diye sorulmuştur. O da, \"Canlandırdığım Sünnet'ten birazcık dolayı beni bağışladı.\" diye cevap vermiştir. {Kaynak:tarikh-khulafa-minhaj-1434 s. 543-544}. Ve Mes'udi'ye göre, Buhturi'nin rivayetine göre, Mutevakkil Yemen'den on bin dirheme bir kılıç satın almış ve onu Baghir'e başının üzerinde tutması için vermiştir, ancak Baghir onu öldürdüğü geceye kadar kılıcı çekmemiştir. Ve Allah'a secde etmiş, yüzünü toprakla ovmuş ve sakalına serpmiş, sonra oturup su içmiştir. Ve Kubeyha ona kırmızı bir elbise göndermiş, o da elbisenin eteğini yırtmış ve \"Bunu kefenim olarak saklayın\" demiştir. Sonra Baghir on maskeli adamla gelmiş ve Baghir onun sağ tarafına kalçasına kadar vurmuş, sonra da sol tarafına vurmuştur ve Feth onlara karşı koymuş, ta ki onu öldürene kadar. Bu olay, 247 yılının Şevval ayının üçüncü Çarşamba gecesi gerçekleşti. Fam Al-Sulh'da doğdu (kaynak: Muruj-al-Dhahab, s. 504-506) ve öldürüldüğü yer, Şiruyeh'in babası Parviz'i öldürdüğü yer olan Al-Makhura olarak biliniyordu. Halısının üzerinde, \"altı ay kral\" yazılı bir Pers kralı resmi ve \"altı ay kral\" yazılı bir Yazid ibn al-Walid resmi vardı (kaynak: Muruj-al-Dhahab, s. 514)."
  id: "Pada tahun 247 H, al-Mutawakkil terbunuh di istananya setelah sekelompok orang Turki menyerangnya. Al-Tabari menyebutkan beberapa urusan dan biografinya. Menurut al-Suyuti, ia berjanji setia kepada putranya, al-Muntasir, sebagai pewaris takhta, kemudian kepada al-Mu'tazz, lalu kepada al-Mu'ayyad. Kemudian ia ingin mempromosikan al-Mu'tazz karena kecintaannya kepada ibunya, jadi ia meminta al-Muntasir untuk mengundurkan diri, tetapi ia menolak. Maka ia meremehkannya, mengancamnya, dan menghinanya. Terjadilah bahwa orang-orang Turki berbalik melawannya dan bersekongkol dengan al-Muntasir untuk membunuh ayahnya. Lima orang menyerangnya di tengah malam saat ia berada di ruang pribadinya dan membunuhnya bersama wazirnya, al-Fath ibn Khaqan. Peristiwa ini terjadi pada tanggal 5 Syawal tahun 247 H. Ia terlihat dalam mimpi, dan ditanyakan, \"Apa yang Allah lakukan terhadapmu?\" Dia menjawab, \"Dia memaafkanku karena sedikit Sunnah yang kuhidupkan kembali.\" {kutip:tarikh-khulafa-minhaj-1434 hlm. 543-544}. Dan menurut Al-Mas'udi, berdasarkan riwayat Al-Buhturi, bahwa Al-Mutawakkil membeli pedang dari Yaman seharga sepuluh ribu dirham dan memberikannya kepada Baghir untuk diletakkan di atas kepalanya, tetapi dia tidak menghunusnya sampai malam dia membunuhnya. Dan bahwa dia bersujud kepada Allah dan mengusap wajahnya dengan debu dan menaburkannya di janggutnya, lalu duduk untuk minum. Dan bahwa Qubayha mengiriminya jubah merah, lalu dia merobek ujungnya dan berkata, \"Simpanlah ini untuk kain kafanku.\" Kemudian Baghir datang dengan sepuluh orang bertopeng, dan Baghir memukulnya di sisi kanannya, memotongnya sampai ke pinggulnya, lalu di sisi kirinya, dan Al-Fath melawan mereka sampai mereka membunuhnya. Dan itu terjadi pada malam Rabu, tanggal tiga Syawal, tahun dua ratus empat puluh tujuh. Dan dia lahir di Fam Al-Sulh {kutip:muruj-al-dhahab hlm. 504-506}, dan tempat dia dibunuh dikenal sebagai Al-Makhura, yaitu tempat Shiruyeh membunuh ayahnya, Parviz. Di atas karpetnya terdapat gambar raja Persia, tertulis sebagai raja selama enam bulan, dan gambar Yazid ibn al-Walid, raja selama enam bulan. {kutip:muruj-al-dhahab hlm. 514}"
