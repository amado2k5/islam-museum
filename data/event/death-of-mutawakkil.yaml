label: { ar: "مقتل المتوكل" }
summary:
  ar: "في سنة سبع وأربعين ومائتين قُتل المتوكل في مجلسه بعد أن دخل عليه جماعة من الأتراك {cite:tabari-tarikh-abu-al-fadl j.9 p.226} {cite:tabari-tarikh-abu-al-fadl j.9 p.228}، وذكر الطبري بعض أموره وسيرته {cite:tabari-tarikh-abu-al-fadl j.9 p.230}، وعند السيوطي بايع بولاية العهد لابنه المنتصر ثم المعتز ثم المؤيد ثم أراد أن يقدم المعتز لمحبته لأمه فسأل المنتصر أن ينزل فأبى فكان يحط منزلته ويهدده ويشتمه واتفق أن الأتراك انحرفوا عنه فاتفقوا مع المنتصر على قتل أبيه فدخل عليه خمسة وهو في جوف الليل في مجلس لهوه فقتلوه هو ووزيره الفتح بن خاقان وذلك في خامس شوال سنة سبع وأربعين، ورئي في النوم فقيل ما فعل الله بك قال غفر لي بقليل من السنة أحييتها {cite:tarikh-khulafa-minhaj-1434 p. 543-544}."
