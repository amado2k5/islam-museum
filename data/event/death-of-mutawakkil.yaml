id: event/death-of-mutawakkil
class: event
kind: death
label: { ar: "مقتل المتوكل", en: "Killing of al-Mutawakkil" }
summary:
  ar: "في سنة سبع وأربعين ومائتين قُتل المتوكل في مجلسه بعد أن دخل عليه جماعة من الأتراك {cite:tabari-tarikh-abu-al-fadl j.9 p.226} {cite:tabari-tarikh-abu-al-fadl j.9 p.228}، وذكر الطبري بعض أموره وسيرته {cite:tabari-tarikh-abu-al-fadl j.9 p.230}، وعند السيوطي بايع بولاية العهد لابنه المنتصر ثم المعتز ثم المؤيد ثم أراد أن يقدم المعتز لمحبته لأمه فسأل المنتصر أن ينزل فأبى فكان يحط منزلته ويهدده ويشتمه واتفق أن الأتراك انحرفوا عنه فاتفقوا مع المنتصر على قتل أبيه فدخل عليه خمسة وهو في جوف الليل في مجلس لهوه فقتلوه هو ووزيره الفتح بن خاقان وذلك في خامس شوال سنة سبع وأربعين، ورئي في النوم فقيل ما فعل الله بك قال غفر لي بقليل من السنة أحييتها {cite:tarikh-khulafa-minhaj-1434 p. 543-544}. وعند المسعودي عن البحتري أن المتوكل اشترى سيفاً من اليمن بعشرة آلاف درهم ودفعه إلى باغر ليقف به على رأسه فما انتضاه إلا ليلة قتله إياه، وأنه سجد لله وعفر وجهه بالتراب ونثره في لحيته ثم قعد للشراب، وأن قبيحة وجهت بخلعة حمراء فخرق مطرفها وقال احتفظي به ليكون كفناً لي، ثم أقبل باغر وعشرة متلثمين فضربه باغر على جانبه الأيمن فقده إلى خاصرته ثم الأيسر، والفتح يمانعهم حتى بعجوه، وذلك ليلة الأربعاء لثلاث خلون من شوال سنة سبع وأربعين ومائتين، وكان مولده بفم الصلح {cite:muruj-al-dhahab p. 504-506}، وكان الموضع الذي قتل فيه يعرف بالماخورة وهو الموضع الذي قتل فيه شيرويه أباه أبرويز، وفي بساطه صورة ملك الفرس مكتوب ملك ستة أشهر وصورة يزيد بن الوليد ملك ستة أشهر {cite:muruj-al-dhahab p. 514}"
  en: "In 247 al-Mutawakkil was killed in his own assembly after a group of Turks entered upon him {cite:tabari-tarikh-abu-al-fadl j.9 p.226} {cite:tabari-tarikh-abu-al-fadl j.9 p.228}; Tabari also records some of his affairs and conduct {cite:tabari-tarikh-abu-al-fadl j.9 p.230}. In al-Suyuti he had named his son al-Muntasir heir, then al-Mu'tazz, then al-Mu'ayyad; later, out of love for their mother, he wished to advance al-Mu'tazz and asked al-Muntasir to step down. When al-Muntasir refused, al-Mutawakkil diminished his standing, threatened him and insulted him. The Turks turned from al-Mutawakkil and agreed with al-Muntasir to kill his father; five of them entered upon him in the dead of night while he was in his assembly of revelry, and they killed him and his vizier al-Fath ibn Khaqan on the fifth of Shawwal 247. He was seen in a dream and asked what God had done with him; he said, 'He forgave me for a little of the Sunna that I revived' {cite:tarikh-khulafa-minhaj-1434 p. 543-544}. In al-Mas'udi, citing al-Buhturi, al-Mutawakkil bought a sword from Yemen for ten thousand dirhams and gave it to Bagir to stand at his head; Bagir drew it only on the night he killed him. He prostrated to God, rubbed his face in dust and scattered it on his beard, then sat down to drink. Qabiha sent him a red robe; he tore its edge and said, 'Keep it, so that it may be my shroud.' Then Bagir came with ten masked men; he struck him on the right side, cutting down to the flank, then on the left, while al-Fath held them off until they overpowered him. This was on the night of Wednesday, three nights into Shawwal 247. He was born at Fam al-Sulh {cite:muruj-al-dhahab p. 504-506}. The place where he was killed was known as al-Makhura, where Shiruyah had killed his father Khusraw Parviz. On the carpet was an image of a Persian king inscribed 'king for six months', and an image of Yazid ibn al-Walid inscribed 'king for six months' {cite:muruj-al-dhahab p. 514}."
