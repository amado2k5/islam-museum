id: event/al-hadi-army-finds-banu-al-harith-gone-to-zabid-lands-295
class: event
kind: other
label:
  ar: "انسحاب بني الحارث إلى أرض زبيد ورجوع الجيش إلى قرية الهجر، سنة 295هـ، ص356"
  en: "Banu al-Harith withdraw to the land of Zabid and the army returns to the village of al-Hajr, 295 AH, p. 356"
  ur: "بنو حارث کا زبید کی سرزمین کی طرف نکل جانا اور لشکر کا الہجر لوٹنا، 295ھ، ص356"
  es: "Los Banu al-Harith se retiran a la tierra de Zabid y el ejército regresa a la aldea de al-Hajr, 295 AH, pág. 356."
  fr: "Les Banu al-Harith se retirent sur les terres de Zabid et l'armée retourne au village d'al-Hajr, 295 AH, p. 356"
summary:
  ar: "طلب الجيش بني الحارث في الجبال، فوجدهم قد ظعنوا ولحقوا ببلاد زبيد، فعاد الهادي بالعسكر سالماً غانماً حتى صار إلى قرية الهجر وأقام فيها أياماً."
  en: "The army searched the mountains for Banu al-Harith and found that they had moved on and fled to the lands of Zabid. Al-Hadi returned with his army, unhurt and with booty, to the village of al-Hajr, where he stayed several days."
  ur: "لشکر نے پہاڑوں میں بنو حارث کو ڈھونڈا، مگر وہ نکل چکے تھے اور زبید کے علاقے کی طرف بھاگ گئے تھے۔ ہادی سالم اور مال غنیمت کے ساتھ الہجر کی بستی لوٹے اور وہاں کئی دن ٹھہرے۔"
  es: "El ejército rastreó las montañas en busca de Banu al-Harith y descubrió que se habían marchado y huido a las tierras de Zabid. Al-Hadi regresó con su ejército, ileso y con botín, a la aldea de al-Hajr, donde permaneció varios días."
  fr: "L'armée fouilla les montagnes à la recherche des Banu al-Harith et constata qu'ils avaient fui vers les terres de Zabid. Al-Hadi revint avec son armée, sain et sauf et chargé de butin, au village d'al-Hajr, où il séjourna plusieurs jours."
