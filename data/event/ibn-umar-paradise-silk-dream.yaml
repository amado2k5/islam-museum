id: event/ibn-umar-paradise-silk-dream
class: event
kind: other
label:
  ar: "خيط ابن عمر في المنام وقول النبي نعم الرجل"
  en: "Ibn Umar's silk thread in the dream and the Prophet's praise"
  ur: "ابن عمر کا خواب میں ریشم کا دھاگا اور نبی کی تعریف"
summary:
  ar: "رأى عبد الله بن عمر في المنام كأن في يده قطعة إستبرق لا يريد مكاناً من الجنة إلا طارت إليه، فقصها على حفصة فقصتها على النبي فقال «نعم الرجل عبد الله، لو كان يصلي من الليل» {cite:sahih-muslim} [[passage/muslim-2479|مسلم 2479]]."
  en: "Abdullah ibn Umar saw in a dream as though a piece of silk brocade was in his hand, and wherever he wished in Paradise it flew to him; he told it to Hafsa who told the Prophet, who said 'Abdullah is a righteous man; would that he prayed at night' {cite:sahih-muslim} [[passage/muslim-2479|Muslim 2479]]."
  ur: "عبد اللہ بن عمر نے خواب دیکھا گویا اس کے ہاتھ میں ریشم کا ایک ٹکڑا ہے، اور جہاں بھی وہ جنت میں چاہتا وہاں اڑ کر پہنچ جاتا؛ اس نے اسے حفصہ کو سنایا تو اس نے نبی کو سنایا تو وہ کہنے لگے «ابن عمر نیک آدمی ہے، کاش وہ رات کو نماز کرتا» {cite:sahih-muslim} [[passage/muslim-2479|مسلم 2479]]۔"
