id: event/qusayy-takes-mecca
class: event
kind: conquest
label: { en: "Qusayy ibn Kilab Takes Mecca", ar: "استيلاء قصي بن كلاب على مكة", es: "Qusayy ibn Kilab toma La Meca", fr: "Qusayy ibn Kilab prend La Mecque", ur: "قصی بن کلاب مکہ لے گئے۔", tr: "Kusay ibn Kilab'ın Mekke'yi fethi", id: "Penaklukan Mekah oleh Qusay ibn Kilab" }
summary:
  en: "Around 440 CE Qusayy wrests the custody of the Kaaba and the rule of Mecca from Khuzaʾa — by alliance and, in one account, purchase from Abu Ghubshan — the two sides fight, then accept the arbitration of Yaʾmar ibn Awf who rules for Qusayy; Qusayy then gathers Quraysh into Mecca’s quarters, founds Dar al-Nadwa, and assumes the five offices of Meccan leadership."
  ar: "نحو سنة 440م أخذ قصي بن كلاب ولاية البيت وأمر مكة من خزاعة — بالحلف والقتال، وبشرائها في رواية من أبي غبشان بزقّ خمر — ثم اقتتلوا فتحاكموا إلى يعمر بن عوف فقضى لقصي؛ فجمع قريشاً إلى مكة، وأسس دار الندوة، وتوالت عليه مناصب الرياسة واللواء والحجابة والسقاية والرفادة."
  es: "Hacia el año 440 d. C., Qusayy arrebata la custodia de la Kaaba y el gobierno de La Meca a Khuzaʾa —mediante una alianza y, según una versión, mediante la compra a Abu Ghubshan—. Los dos bandos luchan y luego aceptan el arbitraje de Yaʾmar ibn Awf, quien falla a favor de Qusayy. Posteriormente, Qusayy reúne a los Quraysh en los aposentos de La Meca, funda Dar al-Nadwa y asume los cinco cargos de liderazgo de La Meca."
  fr: "Vers 440 de notre ère, Qusayy arrache la garde de la Kaaba et le pouvoir à Khuzaʾa — par alliance et, selon une version, par achat auprès d'Abu Ghubshan — les deux camps s'affrontent, puis acceptent l'arbitrage de Yaʾmar ibn Awf qui tranche en faveur de Qusayy; Qusayy rassemble alors les Quraysh dans les quartiers de La Mecque, fonde Dar al-Nadwa et assume les cinq fonctions de direction mecquoise."
  ur: "440 عیسوی کے لگ بھگ قصی نے خزاعہ سے کعبہ کی تحویل اور مکہ کی حکمرانی پر قبضہ کیا - اتحاد کے ذریعہ اور ایک اکاؤنٹ میں، ابو غبشن سے خریداری - دونوں فریق لڑتے ہیں، پھر یمر بن عوف کی ثالثی کو قبول کرتے ہیں جو قصی کے لیے حکومت کرتے ہیں۔ قصی پھر قریش کو مکہ کے کوارٹرز میں جمع کرتا ہے، دار الندوہ کی بنیاد رکھتا ہے، اور مکہ کی قیادت کے پانچ دفاتر سنبھالتا ہے۔"
  tr: "Yaklaşık 440 yılında Kusai bin Kilab, ittifaklar kurarak, savaşarak ve bir rivayete göre Ebu Gubşan'dan bir tulum karşılığında satın alarak, Huza'a'dan Mekke'nin yönetimini ve yönetimini devraldı. Daha sonra savaştılar ve davalarını Yamar bin Avf'a götürdüler; o da Kusai lehine hüküm verdi. Böylece Kureyş'i Mekke'ye topladı, Meclis'i kurdu ve liderlik, sancak, muhafızlık, sulama ve besleme görevleri sırasıyla ona verildi."
  id: "Sekitar tahun 440 M, Qusai bin Kilab mengambil alih perwalian Baitullah dan urusan Mekah dari Khuza’a — melalui persekutuan dan pertempuran, dan dengan membelinya, menurut satu catatan, dari Abu Ghubshan dengan sebuah kantung anggur — kemudian mereka berperang dan membawa perkara mereka kepada Ya’mar bin Awf, yang memutuskan untuk memihak Qusai. Maka ia mengumpulkan kaum Quraisy di Mekah, mendirikan Majelis, dan posisi kepemimpinan, pembawa panji, perwalian, penyediaan air, dan pemberian makanan secara berturut-turut diberikan kepadanya."
