id: event/qusayy-takes-mecca
class: event
kind: conquest
label: { en: "Qusayy ibn Kilab Takes Mecca", ar: "استيلاء قصي بن كلاب على مكة" }
summary:
  en: "Around 440 CE Qusayy wrests the custody of the Kaaba and the rule of Mecca from Khuzaʾa — by alliance and, in one account, purchase from Abu Ghubshan — the two sides fight, then accept the arbitration of Yaʾmar ibn Awf who rules for Qusayy; Qusayy then gathers Quraysh into Mecca’s quarters, founds Dar al-Nadwa, and assumes the five offices of Meccan leadership."
  ar: "نحو سنة 440م أخذ قصي بن كلاب ولاية البيت وأمر مكة من خزاعة — بالحلف والقتال، وبشرائها في رواية من أبي غبشان بزقّ خمر — ثم اقتتلوا فتحاكموا إلى يعمر بن عوف فقضى لقصي؛ فجمع قريشاً إلى مكة، وأسس دار الندوة، وتوالت عليه مناصب الرياسة واللواء والحجابة والسقاية والرفادة."
