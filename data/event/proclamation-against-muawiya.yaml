id: event/proclamation-against-muawiya
class: event
kind: declaration
label: { ar: "نداء المأمون في أمر معاوية", en: "al-Ma'mun's proclamation on Mu'awiya", es: "Proclamación de al-Ma'mun sobre Mu'awiya", fr: "proclamation d'al-Ma'mun sur Mu'awiya", ur: "معاویہ کے بارے میں مامون کا اعلان", tr: "El-Me'mun'un Muaviye ile ilgili itirazı", id: "Himbauan Al-Ma'mun mengenai Mu'awiya" }
summary:
  ar: "في سنة اثنتي عشرة ومائتين نادى منادي المأمون برئت الذمة من أحد من الناس ذكر معاوية بخير أو قدمه على أحد من أصحاب رسول الله، وتنازعوا في سببه فقيل منها ما رواه الزبير بن بكار عن المدائني عن مطرف بن المغيرة بن شعبة أن أباه خلا بمعاوية فدعاه إلى العدل ووصل أرحام بني هاشم فأجاب هيهات هيهات ملك أخو تيم فعدل فما عدا أن هلك فهلك ذكره وأخو هاشم يصرخ به كل يوم خمس مرات فأي عمل يبقى مع هذا لا أم لك والله ألا دفناً دفناً، فلما سمعه المأمون أمر بالنداء وأنشئت الكتب إلى الآفاق بلعنه على المنابر فأعظم الناس ذلك واضطربت العامة فأشير عليه بتركه {cite:muruj-al-dhahab p. 433-434}."
  en: "The 212 proclamation barring good mention of Mu'awiya — blamed on Mutarrif's report of his father's audience — reversed when the people found it monstrous {cite:muruj-al-dhahab p. 433-434}."
  es: "La proclamación de 212 que prohibía cualquier mención positiva de Mu'awiya —atribuida al informe de Mutarrif sobre la audiencia de su padre— fue revocada cuando el pueblo la consideró monstruosa {cite:muruj-al-dhahab p. 433-434}."
  fr: "La proclamation de 212 interdisant une bonne mention de Mu'awiya — imputée au rapport de Mutarrif sur l'audience de son père — a été annulée lorsque le peuple l'a trouvée monstrueuse {cite:muruj-al-dhahab p. 433-434}."
  ur: "212 کا اعلان جس میں معاویہ کے اچھے تذکرے کو چھوڑ دیا گیا تھا - جس کا الزام مطرف کے اپنے والد کے سامعین کی رپورٹ پر لگایا گیا تھا - اس وقت الٹ گیا جب لوگوں نے اسے شیطانی پایا۔ 433-434}۔"
  tr: "212 yılında, el-Ma'mun'un habercisi, Muaviye hakkında iyi konuşan veya onu Allah Resulü'nün sahabelerinden herhangi birine üstün tutan herkesten sorumlu olmadığını ilan etti. Bunun sebebini tartıştılar ve aralarında el-Zübeyr ibn Bakkar'ın, el-Mada'ini'den, o da Mutarrif ibn el-Muğira ibn Şuba'dan rivayet ettiği şu rivayet de vardı: Babası Muaviye ile özel bir görüşme yapmış ve onu adalete çağırmış, Beni Haşim ile akrabalık bağlarını korumasını istemişti. Muaviye ise şöyle cevap vermişti: \"Uzak olsun, uzak olsun! Taym'ın kardeşi hüküm sürdü ve adaletliydi, fakat o öldükten hemen sonra hatırası silindi ve Haşim'in kardeşi her gün beş defa ona karşı feryat etti. Bunun ne gibi bir amel'i kaldı ki? Allah'a yemin ederim ki, annenden mahrum kal, ancak gömül, gömül!\" El-Ma'mun bunu duyunca, ilan emri verdi ve bölgelere mektuplar gönderilerek minberlerde kendisine lanet okunması istendi. Bu durum halkı çok rahatsız etti ve kamuoyunu ayağa kaldırdı. Bunun üzerine kendisine bu işten vazgeçmesi önerildi. {Kaynak: Muruj-al-Dhahab s. 433-434}"
  id: "Pada tahun 212, utusan al-Ma'mun mengumumkan bahwa ia dibebaskan dari tanggung jawab atas siapa pun yang berbicara baik tentang Mu'awiya atau mendahulukannya daripada sahabat-sahabat Rasulullah. Mereka memperdebatkan alasan hal ini, dan di antara mereka adalah apa yang diriwayatkan oleh al-Zubayr ibn Bakkar dari al-Mada'ini dari Mutarrif ibn al-Mughira ibn Shu'ba, bahwa ayahnya melakukan percakapan pribadi dengan Mu'awiya dan menyerukan kepadanya untuk bersikap adil dan menjaga hubungan kekerabatan dengan Bani Hasyim, lalu ia menjawab, \"Jauhkanlah, jauhkanlah! Saudara Taym memerintah dan bersikap adil, tetapi begitu ia meninggal, ingatannya pun lenyap, dan saudara Hasyim mencelanya lima kali setiap hari. Jadi, amal apa yang tersisa dari ini? Semoga engkau kehilangan ibumu, demi Allah, kecuali untuk dikuburkan, dikuburkan!\" Ketika al-Ma'mun mendengar hal ini, ia memerintahkan pengumuman dan surat-surat dikirim ke berbagai daerah untuk mengutuknya di mimbar-mimbar, sehingga orang-orang sangat terganggu oleh hal ini dan masyarakat umum menjadi gelisah, sehingga disarankan kepadanya untuk membiarkannya saja {kutip:muruj-al-dhahab hlm. 433-434}."
