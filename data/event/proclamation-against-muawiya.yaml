label: { ar: "نداء المأمون في أمر معاوية", en: "al-Ma'mun's proclamation on Mu'awiya" }
summary:
  ar: "في سنة اثنتي عشرة ومائتين نادى منادي المأمون برئت الذمة من أحد من الناس ذكر معاوية بخير أو قدمه على أحد من أصحاب رسول الله، وتنازعوا في سببه فقيل منها ما رواه الزبير بن بكار عن المدائني عن مطرف بن المغيرة بن شعبة أن أباه خلا بمعاوية فدعاه إلى العدل ووصل أرحام بني هاشم فأجاب هيهات هيهات ملك أخو تيم فعدل فما عدا أن هلك فهلك ذكره وأخو هاشم يصرخ به كل يوم خمس مرات فأي عمل يبقى مع هذا لا أم لك والله ألا دفناً دفناً، فلما سمعه المأمون أمر بالنداء وأنشئت الكتب إلى الآفاق بلعنه على المنابر فأعظم الناس ذلك واضطربت العامة فأشير عليه بتركه {cite:muruj-al-dhahab p. 433-434}."
  en: "The 212 proclamation barring good mention of Mu'awiya — blamed on Mutarrif's report of his father's audience — reversed when the people found it monstrous {cite:muruj-al-dhahab p. 433-434}."
