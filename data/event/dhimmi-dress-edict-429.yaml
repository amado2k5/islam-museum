tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "توقيع القادر بإلزام أهل الذمة تغيير اللباس"
  en: "Al-Qadir's rescript imposing distinguishing dress on the dhimmis"
  es: "Rescripto de Al-Qadir que impone vestimenta distintiva a los dhimmis"
  fr: "Rescrit d'Al-Qadir imposant une tenue vestimentaire distinctive aux dhimmis"
summary:
  ar: "في سلخ رجب سنة تسع وعشرين وأربعمائة جُمع الأشراف والقضاة والشهود والفقهاء والوجوه إلى بيت النوبة، واستُدعي جاثليق النصارى ورأس جالوت اليهود، وخرج توقيع الخليفة في أمر العيار وإلزام أهل الذمة إياه: تليت القراءة التي تذكر أن الخلفاء الراشدين فرضوا على أهل الذمة حدودًا معقودة على الاستشعار والإخبات والاستكانة والتفرد عن المسلمين، وأن هذه الطائفة لما تطرّق عليها الإغفال تشبّهت بالمسلمين في زيّهم، فرأى أمير المؤمنين الإيعاز إلى جميع أهل الذمة بتغيير اللباس الظاهر مما يُعرفون به عند المشاهدة {cite:muntazam-ibn-al-jawzi j.8 p.438-439}."
  en: "At the end of Rajab 429 the ashraf, qadis, witnesses, jurists and notables were assembled at Bayt al-Nawba, the Nestorian katholikos and the Jewish Ra's al-Jalut were summoned, and the caliph's rescript was read: recalling the bounds the Rashidun caliphs had laid on the dhimmis — distinction, humility and separateness from the Muslims — it ordered all dhimmis to alter their outward dress into what would mark them on sight, their neglect having let them assimilate to Muslim dress {cite:muntazam-ibn-al-jawzi j.8 p.438-439}."
  es: "A finales de Rajab 429, los ashraf, cadíes, testigos, juristas y notables se reunieron en Bayt al-Nawba, se convocó al katholikos nestoriano y al Ra's al-Jalut judío, y se leyó el rescripto del califa: recordando los límites que los califas Rashidun habían impuesto a los dhimmis —distinción, humildad y separación de los musulmanes—, ordenaba a todos los dhimmis que modificaran su vestimenta exterior para que los distinguiera a simple vista, ya que su negligencia les había permitido asimilarse a la vestimenta musulmana {cite:muntazam-ibn-al-jawzi j.8 p.438-439}."
  fr: "À la fin du Rajab 429, l'ashraf, les qadis, les témoins, les juristes et les notables furent réunis à Bayt al-Nawba, le katholikos nestorien et le Ra's al-Jalut juif furent convoqués, et le rescrit du calife fut lu: rappelant les limites que les califes rashidun avaient imposées aux dhimmis — distinction, humilité et séparation des musulmans — il ordonnait à tous les dhimmis de modifier leur tenue extérieure pour qu'elle les reconnaisse à vue, leur négligence leur ayant permis de s'assimiler à la tenue musulmane {cite:muntazam-ibn-al-jawzi j.8 p.438-439}."
