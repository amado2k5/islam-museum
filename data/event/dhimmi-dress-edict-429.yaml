id: event/dhimmi-dress-edict-429
class: event
kind: law-enacted
label:
  ar: "توقيع القادر بإلزام أهل الذمة تغيير اللباس"
  en: "Al-Qadir's rescript imposing distinguishing dress on the dhimmis"
summary:
  ar: "في سلخ رجب سنة تسع وعشرين وأربعمائة جُمع الأشراف والقضاة والشهود والفقهاء والوجوه إلى بيت النوبة، واستُدعي جاثليق النصارى ورأس جالوت اليهود، وخرج توقيع الخليفة في أمر العيار وإلزام أهل الذمة إياه: تليت القراءة التي تذكر أن الخلفاء الراشدين فرضوا على أهل الذمة حدودًا معقودة على الاستشعار والإخبات والاستكانة والتفرد عن المسلمين، وأن هذه الطائفة لما تطرّق عليها الإغفال تشبّهت بالمسلمين في زيّهم، فرأى أمير المؤمنين الإيعاز إلى جميع أهل الذمة بتغيير اللباس الظاهر مما يُعرفون به عند المشاهدة {cite:muntazam-ibn-al-jawzi j.8 p.438-439}."
  en: "At the end of Rajab 429 the ashraf, qadis, witnesses, jurists and notables were assembled at Bayt al-Nawba, the Nestorian katholikos and the Jewish Ra's al-Jalut were summoned, and the caliph's rescript was read: recalling the bounds the Rashidun caliphs had laid on the dhimmis — distinction, humility and separateness from the Muslims — it ordered all dhimmis to alter their outward dress into what would mark them on sight, their neglect having let them assimilate to Muslim dress {cite:muntazam-ibn-al-jawzi j.8 p.438-439}."
