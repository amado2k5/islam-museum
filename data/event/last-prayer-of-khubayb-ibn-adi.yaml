id: event/last-prayer-of-khubayb-ibn-adi
class: event
kind: death
label:
  ar: ركعتا خبيب بن عدي قبل قتله بالتنعيم ودعاؤه وشعره
  en: The two rakas, words and verses of Khubayb ibn Adi before his killing
  ur: قتل سے پہلے خبیب بن عدی کی دو رکعتیں، دعا اور اشعار
  es: "Los dos rakas, palabras y versos de Khubayb ibn Adi antes de su muerte."
summary:
  ar: "بعد غدر هذيل بسرية الرجيع بيع خبيب بن عدي بمكة، فاشتراه بنو الحارث بن عامر الذي كان قتله يوم بدر، ولبث عندهم أسيراً حتى انقضت الأشهر الحرم {cite:fath-al-bari scan vol. 2 p. 192} {cite:ibn-hisham-sira scan p. 434}. ولما أخرجوه إلى التنعيم ليصلبوه طلب أن يركع ركعتين فتُرك، فأتمهما وأحسنهما ثم قال إنه لولا أن يظنوه جزعاً لأطال، فكان أول من سنّ الركعتين عند القتل {cite:ibn-hisham-sira scan p. 434} {cite:fath-al-bari scan vol. 2 p. 192}. ودعا على قاتليه، وقال شعراً يعلن فيه أنه لا يبالي على أي جنب كان مصرعه في الله {cite:ibn-hisham-sira scan p. 434} {cite:isaba scan vol. 2 p. 385}. وتختلف الروايات في من أنزل جسده: عمرو بن أمية في رواية ابن إسحاق، أو المقداد والزبير في رواية ذكرها ابن حجر {cite:al-bidaya-wal-nihaya scan vol. 6 p. 490} {cite:isaba scan vol. 2 p. 385}."
  en: "After the treachery against the Raji party, Khubayb ibn Adi was sold in Mecca and bought by the Banu al-Harith ibn Amir, whose man he had killed at Badr; he stayed in their hands as a prisoner until the sacred months had passed {cite:fath-al-bari scan vol. 2 p. 192} {cite:ibn-hisham-sira scan p. 434}. When they brought him to al-Tanim to crucify him he asked to pray two rakas and was allowed; he completed them well and then said that, but for fear they would think he was lengthening them from dread, he would have prayed more, and so he was the first to set the practice of the two rakas before being killed {cite:ibn-hisham-sira scan p. 434} {cite:fath-al-bari scan vol. 2 p. 192}. He prayed against his killers and recited verses declaring that he did not mind on which side his death fell for God's sake {cite:ibn-hisham-sira scan p. 434} {cite:isaba scan vol. 2 p. 385}. The reports differ on who took his body down: Amr ibn Umayya in Ibn Ishaq's account, or al-Miqdad and al-Zubayr in a report Ibn Hajar mentions {cite:al-bidaya-wal-nihaya scan vol. 6 p. 490} {cite:isaba scan vol. 2 p. 385}."
  ur: "رجیع کی سریہ سے غداری کے بعد خبیب بن عدی کو مکہ میں بیچ دیا گیا اور انھیں بنو حارث بن عامر نے خریدا جن کے آدمی کو انھوں نے بدر میں قتل کیا تھا؛ وہ حرمت والے مہینے گزرنے تک ان کے ہاں قیدی رہے {cite:fath-al-bari scan vol. 2 p. 192} {cite:ibn-hisham-sira scan p. 434}. جب انھیں سولی دینے تنعیم لے گئے تو انھوں نے دو رکعت پڑھنے کی اجازت مانگی اور انھیں چھوڑ دیا گیا؛ انھوں نے انھیں مکمل اور اچھی طرح پڑھا اور کہا کہ اگر یہ گمان نہ ہوتا کہ موت کے خوف سے لمبی کر رہا ہوں تو اور پڑھتا، اس طرح وہ قتل سے پہلے دو رکعت کا طریقہ جاری کرنے والے پہلے شخص بنے {cite:ibn-hisham-sira scan p. 434} {cite:fath-al-bari scan vol. 2 p. 192}. انھوں نے قاتلوں کے خلاف دعا کی اور اشعار کہے جن میں اعلان ہے کہ اللہ کی راہ میں ان کا مصرع کس پہلو پر ہو انھیں پروا نہیں {cite:ibn-hisham-sira scan p. 434} {cite:isaba scan vol. 2 p. 385}. جسم کس نے اتارا اس میں روایات مختلف ہیں: ابن اسحاق کی روایت میں عمرو بن امیہ، یا ابن حجر کی ذکر کردہ روایت میں مقداد اور زبیر {cite:al-bidaya-wal-nihaya scan vol. 6 p. 490} {cite:isaba scan vol. 2 p. 385}."
  es: "Después de la traición contra el partido Raji, Khubayb ibn Adi fue vendido en La Meca y comprado por los Banu al-Harith ibn Amir, cuyo hombre había matado en Badr; permaneció en sus manos como prisionero hasta que pasaron los meses sagrados {cite:fath-al-bari scan vol. 2 p. 192} {cite:ibn-hisham-sira scan p. 434}. Cuando lo llevaron ante al-Tanim para crucificarlo, pidió rezar dos rakats y se le permitió; los completó bien y luego dijo que, pero por temor a que pensaran que los estaba alargando por miedo, habría rezado más, y así fue el primero en establecer la práctica de los dos rakats antes de ser asesinado {cite:ibn-hisham-sira scan p. 434} {cite:fath-al-bari scan vol. 2 p. 192}. Oró contra sus asesinos y recitó versículos declarando que no le importaba de qué lado cayera su muerte por amor de Dios {cite:ibn-hisham-sira scan p. 434} {cite:isaba scan vol. 2 p. 385}. Los informes difieren sobre quién bajó su cuerpo: Amr ibn Umayya en el relato de Ibn Ishaq, o al-Miqdad y al-Zubayr en un informe que menciona Ibn Hajar {cite:al-bidaya-wal-nihaya scan vol. 6 p. 490} {cite:isaba scan vol. 2 p. 385}."
