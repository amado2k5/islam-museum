label: { ar: "خروج الحسين من مكة إلى العراق", en: "Husayn leaves Mecca for Iraq", es: "Husayn abandona La Meca rumbo a Irak.", fr: "Husayn quitte La Mecque pour l'Irak", ur: "حسین مکہ سے عراق کے لیے روانہ ہوئے۔" }
summary:
  ar: "كتب الحسين إلى أهل الكوفة بأنه شخص إليهم من مكة يوم الثلاثاء لثمان مضين من ذي الحجة يوم التروية، وأمرهم أن يجدّوا إذا قدم عليهم رسوله {cite:tabari-tarikh-abu-al-fadl j.5 p.395}."
  en: "Husayn wrote to the people of Kufa that he had set out toward them from Mecca on Tuesday, eight days into Dhu'l-Hijja, which was the Day of Tarwiya, and he told them to exert themselves when his messenger came to them {cite:tabari-tarikh-abu-al-fadl j.5 p.395}."
  es: "Husayn escribió a la gente de Kufa que había partido hacia ellos desde La Meca el martes, ocho días después de Dhu'l-Hijja, que era el Día de Tarwiya, y les dijo que se esforzaran cuando su mensajero llegara a ellos {cite:tabari-tarikh-abu-al-fadl j.5 p.395}."
  fr: "Husayn écrivit aux habitants de Kufa qu'il était parti vers eux depuis La Mecque le mardi, huit jours après le début du mois de Dhu'l-Hijja, qui était le jour de Tarwiya, et il leur dit de faire des efforts lorsque son messager viendrait à eux {cite:tabari-tarikh-abu-al-fadl j.5 p.395}."
  ur: "حسین نے اہل کوفہ کو لکھا کہ وہ ان کی طرف منگل کے دن مکہ سے آٹھویں ذی الحجہ کو روانہ ہوئے تھے جو یوم ترویہ تھا اور جب ان کے پاس ان کا قاصد آیا تو اس نے ان سے کہا کہ وہ مشقت کریں۔"
