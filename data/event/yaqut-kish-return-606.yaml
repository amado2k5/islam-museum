label:
  ar: "عودة ياقوت من كيش فيجد مولاه قد مات، فيتجر بالكتب، ٦٠٦هـ/١٢٠٩م"
  en: "Yaqut returns from Kish to find his former master dead, and takes to the book trade, 606/1209"
  ur: "یاقوت کیش سے واپس آیا تو مولیٰ کا انتقال ہو چکا تھا، کتابوں کی تجارت شروع کی، 606ھ/1209ء"
summary:
  ar: "سفّره مولاه إلى كيش بالمضاربة، فلما عاد سنة ٦٠٦هـ/١٢٠٩م وجد أن عسكراً قد مات، فأعطى أولاده وزوجته ما رضوا به وبقى بيده بقية جعلها رأس ماله وسافر بها، وجعل بعض تجارته كتباً {cite:shadharat-dhahab p. 121} {cite:encyclopaedia-of-islam-2 vol. 11 p. 264}؛ وبدأ بيع الكتب ببغداد مما دفعه إلى الاطلاع على مخطوطات نادرة وسهّل عليه التعرف على كبار علماء العالم الإسلامي {cite:mawsuat-a3lam-ulama-adaba p. 277}."
  en: "His former master sent him to Kish as a mudarib; on his return in 606/1209 he found Askar dead. He gave the widow and sons their satisfaction, kept the remainder as his capital and travelled with it, making books part of his trade {cite:shadharat-dhahab p. 121} {cite:encyclopaedia-of-islam-2 vol. 11 p. 264}. Selling books in Baghdad drew him to rare manuscripts and introduced him to the leading scholars of the Islamic world {cite:mawsuat-a3lam-ulama-adaba p. 277}."
  ur: "سابق مولیٰ نے اسے مضاربے پر کیش بھیجا؛ 606ھ/1209ء میں لوٹا تو عسکر فوت کر چکا تھا۔ بیوہ اور بیٹوں کو ان کا حصہ دیا، باقی سرمایہ بنا کر سفر کیا اور تجارت کا کچھ حصہ کتابیں بنا لیا {cite:shadharat-dhahab p. 121} {cite:encyclopaedia-of-islam-2 vol. 11 p. 264}. بغداد میں کتابیں بیچنے سے نایاب مخطوطات دیکھنے اور اسلامی دنیا کے بڑے علماء سے ملنے کا موقع ملا {cite:mawsuat-a3lam-ulama-adaba p. 277}۔"
