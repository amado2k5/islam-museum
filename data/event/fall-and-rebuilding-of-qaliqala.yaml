label: { ar: "سقوط قاليقلا سنة 133 وعمارتها", en: "The Fall of Qaliqala, 133, and its Rebuilding" }
summary:
  ar: "عند البلاذري عن محمد بن بشر وابن ورز القاليان عن مشايخ أهل قاليقلا: لم تزل مدينة قاليقلا مذ فُتحت ممتنعة بمن فيها من أهلها حتى خرج الطاغية في سنة 133 فحصر أهل ملطية وهدم حائطها وأجلى من بها من المسلمين إلى الجزيرة ثم نزل مرج الحصى فوجّه كوسان الأرمني حتى أناخ على قاليقلا فحصرها وأهلها يومئذ قليل وعاملها أبو كريمة، فنقب أخوان من الأرمن من أهل مدينة قاليقلا ردماً كان في سورها وخرجا إلى كوسان فأدخلاه المدينة فغلب عليها فقتل وسبى وهدمها وساق ما حوى إلى الطاغية وفرّق السبي على أصحابه؛ وقال الواقدي لما كانت سنة 139 فادى المنصور بمن كان حياً من أسرى أهل قاليقلا وبنى قاليقلا وعمّرها وردّ من فادى به إليها وندب إليها جنداً من أهل الجزيرة وغيرهم، وقد كان طاغية الروم خرج إلى قاليقلا في خلافة المعتصم بالله فرمى سورها حتى كاد يسقط فأنفق المعتصم عليها خمسمائة ألف درهم حتى حصّنت."
  en: "In al-Baladhuri from Muhammad ibn Bishr and Ibn Warz al-Qaliyan from the shaykhs of Qaliqala: the city had remained defiant with its folk since its conquest until the tyrant came out in year 133, besieged Malatya's people, razed its wall and evacuated its Muslims to the Jazira, then camped at Marj al-Hasa and sent Kusan the Armenian, who camped on Qaliqala and besieged it — its people then few and its governor Abu Karima — whereupon two Armenian brothers of the city undermined an earthwork in its wall, went out to Kusan and let him into the city; he took it, killed, captured, demolished, drove the spoil to the tyrant and divided the captives among his men; al-Waqidi says: in year 139 al-Mansur ransomed those of Qaliqala's captives still alive, rebuilt and resettled the city, returned the ransomed to it and levied for it a garrison of Jazirans and others; and the Roman tyrant had come out against Qaliqala in al-Mu'tasim's caliphate and battered its wall near collapse, whereupon al-Mu'tasim spent five hundred thousand dirhams on it until it was fortified."
