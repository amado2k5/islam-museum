label: { ar: "سقوط قاليقلا سنة 133 وعمارتها", en: "The Fall of Qaliqala, 133, and its Rebuilding", es: "La caída de Qaliqala, 133, y su reconstrucción.", fr: "La chute de Qaliqala, 133, et sa reconstruction", ur: "قلیقلہ کا زوال، 133، اور اس کی تعمیر نو", tr: "133 yılında Qaliqla'nın düşüşü ve yeniden inşası", id: "Jatuhnya Qaliqla pada tahun 133 dan pembangunannya kembali" }
summary:
  ar: "عند البلاذري عن محمد بن بشر وابن ورز القاليان عن مشايخ أهل قاليقلا: لم تزل مدينة قاليقلا مذ فُتحت ممتنعة بمن فيها من أهلها حتى خرج الطاغية في سنة 133 فحصر أهل ملطية وهدم حائطها وأجلى من بها من المسلمين إلى الجزيرة ثم نزل مرج الحصى فوجّه كوسان الأرمني حتى أناخ على قاليقلا فحصرها وأهلها يومئذ قليل وعاملها أبو كريمة، فنقب أخوان من الأرمن من أهل مدينة قاليقلا ردماً كان في سورها وخرجا إلى كوسان فأدخلاه المدينة فغلب عليها فقتل وسبى وهدمها وساق ما حوى إلى الطاغية وفرّق السبي على أصحابه؛ وقال الواقدي لما كانت سنة 139 فادى المنصور بمن كان حياً من أسرى أهل قاليقلا وبنى قاليقلا وعمّرها وردّ من فادى به إليها وندب إليها جنداً من أهل الجزيرة وغيرهم، وقد كان طاغية الروم خرج إلى قاليقلا في خلافة المعتصم بالله فرمى سورها حتى كاد يسقط فأنفق المعتصم عليها خمسمائة ألف درهم حتى حصّنت."
  en: "In al-Baladhuri from Muhammad ibn Bishr and Ibn Warz al-Qaliyan from the shaykhs of Qaliqala: the city had remained defiant with its folk since its conquest until the tyrant came out in year 133, besieged Malatya's people, razed its wall and evacuated its Muslims to the Jazira, then camped at Marj al-Hasa and sent Kusan the Armenian, who camped on Qaliqala and besieged it — its people then few and its governor Abu Karima — whereupon two Armenian brothers of the city undermined an earthwork in its wall, went out to Kusan and let him into the city; he took it, killed, captured, demolished, drove the spoil to the tyrant and divided the captives among his men; al-Waqidi says: in year 139 al-Mansur ransomed those of Qaliqala's captives still alive, rebuilt and resettled the city, returned the ransomed to it and levied for it a garrison of Jazirans and others; and the Roman tyrant had come out against Qaliqala in al-Mu'tasim's caliphate and battered its wall near collapse, whereupon al-Mu'tasim spent five hundred thousand dirhams on it until it was fortified."
  es: "En al-Baladhuri de Muhammad ibn Bishr e Ibn Warz al-Qaliyan de los shaykhs de Qaliqala: la ciudad se había mantenido desafiante con su gente desde su conquista hasta que el tirano salió en el año 133, sitió a la gente de Malatya, arrasó su muralla y evacuó a sus musulmanes a Jazira, luego acampó en Marj al-Hasa y envió a Kusan el armenio, quien acampó en Qaliqala y la sitió —su gente entonces era poca y su gobernador Abu Karima— entonces dos hermanos armenios de la ciudad socavaron una fortificación de tierra en su muralla, salieron a ver a Kusan y lo dejaron entrar en la ciudad; él la tomó, mató, capturó, demolió, llevó el botín al tirano y dividió a los cautivos entre sus hombres; Al-Waqidi dice: en el año 139, Al-Mansur rescató a los cautivos de Qaliqala que aún vivían, reconstruyó y repobló la ciudad, devolvió a los rescatados y reclutó para ella una guarnición de jaziranos y otros; y el tirano romano había salido contra Qaliqala en el califato de Al-Mu'tasim y había dañado su muralla hasta casi derrumbarla, tras lo cual Al-Mu'tasim gastó quinientos mil dirhams en ella hasta fortificarla."
  fr: "Dans al-Baladhuri, d'après Muhammad ibn Bishr et Ibn Warz al-Qaliyan, d'après les cheikhs de Qaliqala: la ville était restée rebelle avec ses habitants depuis sa conquête jusqu'à ce que le tyran arrive en l'an 133, assiège les habitants de Malatya, rase ses remparts et évacue ses musulmans vers la Jazira, puis campe à Marj al-Hasa et envoie Kusan l'Arménien, qui campe à Qaliqala et l'assiège — ses habitants étaient alors peu nombreux et son gouverneur Abu Karima — alors deux frères arméniens de la ville minent un ouvrage de terre dans ses remparts, vont à la rencontre de Kusan et le laissent entrer dans la ville; il la prend, tue, capture, la démolit, livre le butin au tyran et répartit les captifs entre ses hommes; al-Waqidi dit: en l'an 139, al-Mansur racheta les captifs de Qaliqala encore en vie, reconstruisit et repeupla la ville, y ramena les rachetés et leva pour elle une garnison de Jazirans et d'autres; et le tyran romain était sorti contre Qaliqala dans le califat d'al-Mu'tasim et avait presque détruit ses murs, sur quoi al-Mu'tasim dépensa cinq cent mille dirhams pour la fortifier."
  ur: "محمد بن بشر اور قلقلہ کے شیوخ سے ابن ورز القلیان کی البادوری میں ہے: یہ شہر اپنی فتح کے بعد سے اپنے لوگوں سے منحرف رہا یہاں تک کہ 133 میں ظالم نے مالطہ کے لوگوں کا محاصرہ کیا، اس کی دیوار کو گرا دیا اور اس کے مسلمانوں کو خالی کر دیا، پھر جزیرہ اور مرصعہ کے کیمپوں میں بھیج دیا۔ جس نے قلیقلہ پر ڈیرہ ڈالا اور اس کا محاصرہ کیا - اس کے بعد کے لوگ اور اس کے گورنر ابو کریمہ - جس کے بعد شہر کے دو آرمینی بھائیوں نے اس کی دیوار میں مٹی کا کام توڑ دیا، کوسان کی طرف نکلے اور اسے شہر میں جانے دیا۔ اس نے اسے لے لیا، مار ڈالا، قبضہ کر لیا، مسمار کر دیا، مال غنیمت کو ظالم کے پاس پہنچا دیا اور اسیروں کو اپنے آدمیوں میں بانٹ دیا۔ الواقدی کہتے ہیں: 139 میں المنصور نے قلیقلہ کے قیدیوں میں سے جو ابھی تک زندہ ہیں ان کو فدیہ دیا، اس شہر کو دوبارہ تعمیر کیا اور آباد کیا، فدیہ واپس لوٹا دیا اور اس کے لیے جزیریوں اور دیگر لوگوں کی ایک چوکی لگا دی۔ اور رومی ظالم نے معتصم کی خلافت میں قلیقلہ کے خلاف نکل کر اس کی دیوار کو گرانے کے قریب پہنچا دیا تھا، اس کے بعد معتصم نے اس پر پانچ لاکھ درہم خرچ کیے یہاں تک کہ اسے مضبوط کر دیا گیا۔"
  tr: "El-Baladhuri, Muhammed ibn Bişr ve İbn Warz el-Kaliyan'dan, Kalikla ileri gelenlerinden rivayetle şöyle der: Kalikla şehri, halkıyla birlikte fethedildiğinden beri, zalim hükümdar 133 yılında Malatya halkını kuşatıp surlarını yıkıp Müslümanları adaya sürene kadar ele geçirilemez durumda kaldı. Sonra Merj el-Hasa'ya indi ve Ermeni Kuşan'ı Kalikla'ya gelmesi ve şehri kuşatması için gönderdi. O zamanlar halkı azdı ve valisi Ebu Kerime idi. Kalikla şehrindeki Ermenilerden iki kardeş, surlardaki bir bariyeri delerek Kuşan'a gittiler ve onu şehre getirdiler. Kuşan şehri fethetti, öldürdü ve esir aldı, şehri yıktı ve elindekileri zalim hükümdara götürdü ve esirleri arkadaşlarına dağıttı. El-Vakidi şöyle dedi: 139 yılında El-Mansur, Kalikla'daki esirlerden hayatta kalanları fidye karşılığında kurtardı, Kalikla'yı inşa etti ve geliştirdi, fidye karşılığında kurtarılanları oraya geri gönderdi ve Cezire halkından ve diğerlerinden askerler gönderdi. Romalıların zalim hükümdarı, El-Mu'tesim Billa'nın halifeliği döneminde Kalikla'ya gitti ve surlarına taş attı, sur neredeyse yıkılacaktı. Bunun üzerine El-Mu'tesim, surları güçlendirilene kadar beş yüz bin dirhem harcadı."
  id: "Al-Baladhuri, berdasarkan riwayat Muhammad ibn Bishr dan Ibn Warz al-Qaliyan, berdasarkan riwayat para tetua Qaliqla: Kota Qaliqla tetap tak tertembus sejak ditaklukkan, beserta penduduknya, hingga sang tiran datang pada tahun 133 dan mengepung penduduk Malatya, menghancurkan temboknya, dan mengusir kaum Muslim dari sana ke pulau. Kemudian ia turun ke Marj al-Hasa dan mengirim Kusan orang Armenia hingga ia sampai di Qaliqla dan mengepungnya. Penduduknya sedikit pada waktu itu, dan gubernurnya adalah Abu Karima. Dua bersaudara dari orang Armenia di kota Qaliqla menggali melalui penghalang yang ada di temboknya dan pergi menemui Kusan dan membawanya ke kota. Ia menaklukkannya, membunuh dan menawan orang, menghancurkannya, dan membawa apa yang dimilikinya kepada sang tiran dan membagikan tawanan di antara para pengikutnya. Al-Waqidi berkata: Pada tahun 139, Al-Mansur menebus orang-orang yang masih hidup dari tawanan Qaliqla, dan dia membangun Qaliqla serta mengembangkannya, dan dia mengembalikan orang-orang yang telah ditebus ke sana, dan dia mengirimkan tentara dari penduduk Al-Jazira dan lainnya ke sana. Penguasa Romawi yang kejam pernah pergi ke Qaliqla pada masa kekhalifahan Al-Mu’tasim Billah, dan dia melempari temboknya dengan batu hingga hampir runtuh, sehingga Al-Mu’tasim menghabiskan lima ratus ribu dirham untuk memperkuatnya."
