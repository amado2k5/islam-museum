class: event
kind: birth
label:
  ar: "ولادة تقي الدين المقريزي بالقاهرة، نحو ٧٦٥هـ/١٣٦٤م"
  en: "Birth of Taqi al-Din al-Maqrizi in Cairo, c. 765/1364"
  ur: "قاہرہ میں تقی الدین مقریزی کی پیدائش، تقریباً 765ھ/1364ء"
  fr: "La naissance de Taqi al-Din al-Maqrizi au Caire, vers 765/1364"
  es: "Nacimiento de Taqi al-Din al-Maqrizi en El Cairo, c. 765/1"
  tr: "Takiyüddin el-Makrizi, 765 H./1364 civarında Kahire'de doğdu."
  id: "Taqi al-Din al-Maqrizi lahir di Kairo sekitar tahun 765 H/1364 M."
summary:
  ar: "وُلد أحمد بن علي بن عبد القادر المقريزي بالقاهرة فيما يظهر سنة ٧٦٥هـ/١٣٦٣–١٣٦٤م، وقال ابن العماد إنه ولد بعد سنة ستين وسبعمائة؛ ونشأ في بيت علم ميسور: فجده لأمه العلامة شمس الدين محمد بن الصائغ الحنفي ⁦(ت ٧٧٦هـ)⁩ هو الذي أثر في تربيته الأولى، وأما نسبة «المقريزي» فإلى حارة المقارزة ببعلبك التي خرجت منها أسرة أبيه {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 254-255}."
  en: "Ahmad ibn Ali ibn Abd al-Qadir al-Maqrizi was born in Cairo, apparently in 765/1363-4 — Ibn al-Imad says 'after 760' — into a prosperous scholarly family. His maternal grandfather, the Hanafi jurist Shams al-Din Muhammad Ibn al-Sa'igh (d. 776/1375), shaped his early upbringing, while the nisba al-Maqrizi points to the Maqariza quarter of Baalbek from which his paternal family came {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 254-255}."
  ur: "احمد بن علی بن عبد القادر مقریزی قاہرہ میں ظاہراً 765ھ/1363-64ء میں پیدا ہوئے — ابن العماد کے مطابق «760ھ کے بعد» — اور وہ مالدار علمی گھرانے میں پلے۔ ان کے نانا، حنفی فقیہ شمس الدین محمد بن الصائغ ⁦(وفات 776ھ)⁩، نے ابتدائی تربیت پر اثر ڈالا، جبکہ نسبت «مقریزی» بعلبک کی محلہ مقارزہ کی طرف اشارہ ہے جہاں سے ان کا پدری خاندان آیا تھا {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 254-255}۔"
  fr: "Ahmad ibn Ali ibn Abd al-Qadir al-Maqrizi naquit au Caire, apparemment en 765/1363-1364 (Ibn al-Imad dit « après 760 »), dans une famille savante et prospère. Son grand-père maternel, le juriste hanafite Shams al-Din Muhammad Ibn al-Sa'igh (m. 776/1375), façonna sa première éducation, tandis que la nisba al-Maqrizi renvoie au quartier des Maqariza de Baalbek, d'où venait sa famille paternelle {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 254-255}."
  es: "Ahmad ibn Ali ibn Abd al-Qadir al-Maqrizi nació en El Cairo, aparentemente en 765/1363-4 — Ibn al-Imad dice 'después de 760' — en el seno de una próspera familia de eruditos. Su abuelo materno, el jurista hanafí Shams al-Din Muhammad Ibn al-Sa'igh (m. 776/1375), influyó en su educación temprana, mientras que la nisba al-Maqrizi señala el barrio de Maqariza de Baalbek, de donde procedía su familia paterna {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 254-255}."
  tr: "Ahmed ibn Ali ibn Abdülkadir el-Makrizi, görünüşe göre Hicri 765/Miladi 1363-1364 yılında Kahire'de doğmuştur. İbn el-İmad ise onun 760 yılından sonra doğduğunu söylemiştir. Varlıklı ve ilim sahibi bir ailede büyüdü: Annesinin dedesi, ilim sahibi Şemseddin Muhammed ibn el-Sayg el-Hanafi (ö. Hicri 776), erken dönemdeki yetiştirilmesinde etkili oldu. \"El-Makrizi\" soyadının kaynağı ise babasının ailesinin geldiği Baalbek'teki el-Makariza mahallesidir. {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 254-255}."
  id: "Ahmad ibn Ali ibn Abd al-Qadir al-Maqrizi lahir di Kairo, tampaknya pada tahun 765 H/1363–1364 M. Ibn al-Imad mengatakan bahwa ia lahir setelah tahun tujuh ratus enam puluh. Ia dibesarkan dalam keluarga terpelajar yang kaya: kakek dari pihak ibunya, ulama Shams al-Din Muhammad ibn al-Saigh al-Hanafi (wafat 776 H), adalah orang yang memengaruhi pendidikan awalnya. Adapun atribusi \"al-Maqrizi\", itu merujuk pada kawasan al-Maqariza di Baalbek, tempat asal keluarga ayahnya. {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 254-255}."
