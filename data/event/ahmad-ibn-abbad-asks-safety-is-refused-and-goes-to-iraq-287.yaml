id: event/ahmad-ibn-abbad-asks-safety-is-refused-and-goes-to-iraq-287
class: event
kind: other
label:
  ar: "أحمد بن عباد يطلب الأمان فلا يؤمَّن ويخرج إلى العراق، 287هـ"
  en: "Ahmad ibn Abbad asks for safety, is refused and goes to Iraq, 287 AH"
  fr: "Ahmad ibn Abbad demande une garantie de sécurité, essuie un refus et part en Irak, 287 de l’hégire"
  ur: "احمد بن عباد کی امان کی درخواست، انکار اور عراق روانگی، 287ھ"
  es: "Ahmad ibn Abbad pide protección, se le niega y se marcha a Irak, 287 AH."
  tr: "Ahmed ibn Abbad güvenli geçiş talebinde bulundu ancak bu talebi kabul edilmedi ve Hicri 287 yılında Irak'a gitti."
  id: "Ahmad ibn Abbad meminta jalan aman tetapi tidak dikabulkan, dan dia berangkat ke Irak, 287 H."
summary:
  ar: "يكتب أحمد بن عباد الأكيلي إلى الهادي يطلب الأمان فيأبى، ويعلل الراوي ذلك بأن الهادي عرف أنه لا ينصحه، فيخرج إلى تهامة ثم مكة ثم العراق يستصرخ بالمسودة على الهادي ويقيم سنة دون إجابة ثم يعود إلى مكة واليمن، وفي حاشية المحقق خبران من كتابين متأخرين."
  en: "Ahmad ibn Abbad al-Akili writes to al-Hadi asking for safety and is refused, the narrator explaining that al-Hadi knew he would not counsel him well; he goes to Tihama, Mecca and Iraq to call the black-clad force against al-Hadi, stays a year unanswered, and returns to Mecca and Yemen; the editor's note gives two reports from later books."
  fr: "Ahmad ibn Abbad al-Akili écrit à al-Hadi pour demander une garantie de sécurité et essuie un refus, le narrateur expliquant qu’al-Hadi savait qu’il ne le conseillerait pas bien. Il va à Tihama, à La Mecque et en Irak pour appeler l’armée vêtue de noir contre al-Hadi, reste un an sans réponse et revient à La Mecque puis au Yémen ; la note de l’éditeur donne deux récits de livres postérieurs."
  ur: "احمد بن عباد اکیلی ہادی کو امان کے لیے لکھتا ہے اور انکار ہوتا ہے، راوی کی وضاحت کے مطابق ہادی جانتے تھے کہ وہ ان کا خیر خواہ نہیں؛ وہ تہامہ، مکہ اور عراق جاتا ہے تاکہ مسودہ لشکر کو ہادی کے خلاف پکارے، ایک سال بغیر جواب رہتا ہے اور مکہ و یمن لوٹ آتا ہے؛ مدیر کا حاشیہ دو بعد کی کتابوں کی دو روایات دیتا ہے۔"
  es: "Ahmad ibn Abbad al-Akili escribe a al-Hadi pidiéndole protección, pero este se la niega. El narrador explica que al-Hadi sabía que no le aconsejaría bien. Va a Tihama, La Meca e Irak para llamar a la fuerza vestida de negro contra al-Hadi, permanece un año sin respuesta y regresa a La Meca y Yemen. La nota del editor incluye dos informes de libros posteriores."
  tr: "Ahmed ibn Abbad el-Akili, el-Hadi'ye güvenliğe dair bir mektup yazar, ancak el-Hadi reddeder. Anlatıcı, el-Hadi'nin ona tavsiye vermeyeceğini bildiğini açıklar. Bunun üzerine Ahmed, asker taslağı konusunda el-Hadi'den yardım istemek için önce Tihama'ya, sonra Mekke'ye, ardından Irak'a gider ve bir yıl boyunca cevap alamadan orada kalır. Daha sonra Mekke'ye ve Yemen'e döner. Editörün notlarında, daha sonraki iki kitaptan iki rapor bulunmaktadır."
  id: "Ahmad ibn Abbad al-Akili menulis surat kepada al-Hadi meminta perlindungan, tetapi al-Hadi menolak. Narator menjelaskan bahwa al-Hadi tahu bahwa ia tidak akan menasihatinya. Maka ia pergi ke Tihama, kemudian Mekah, lalu Irak, meminta bantuan al-Hadi terkait wajib militer, dan tinggal selama setahun tanpa mendapat tanggapan. Kemudian ia kembali ke Mekah dan Yaman. Di margin editor terdapat dua laporan dari dua buku selanjutnya."
