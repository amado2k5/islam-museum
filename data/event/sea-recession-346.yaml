summary:
  ar: "في سنة ست وأربعين وثلاثمائة تقَصّ البحر ثمانين ذراعًا وظهرت فيه جبال وجزائر لا يُعرفها أحد ولا سمع بها، وفي ذي الحجة ورد الخبر بأنه كان بالري ونواحيها زلزلة عظيمة مات فيها خلق كثير من الناس {cite:muntazam-ibn-al-jawzi p. 670}."
  en: "In 346 the sea fell eighty cubits revealing mountains and islands no one knew or had heard of; that Dhu'l-Hijja word came of a great earthquake at Rayy and its environs killing many {cite:muntazam-ibn-al-jawzi p. 670}."
  es: "En 346 el mar descendió ochenta codos, revelando montañas e islas que nadie conocía ni había oído mencionar; ese Dhu'l-Hijja llegó la noticia de un gran terremoto en Rayy y sus alrededores que causó la muerte de muchos {cite:muntazam-ibn-al-jawzi p. 670}."
  fr: "En 346, la mer baissa de quatre-vingts coudées révélant des montagnes et des îles que personne ne connaissait ni n'avait jamais vues; ce Dhu'l-Hijja, la nouvelle parvint d'un grand tremblement de terre à Rayy et dans ses environs, tuant de nombreuses personnes {cite:muntazam-ibn-al-jawzi p. 670}."
  ur: "346 میں سمندر اسّی ہاتھ تک گرا اور پہاڑوں اور جزیروں کو ظاہر کرتا تھا جن کے بارے میں کوئی نہیں جانتا تھا اور نہ ہی سنا تھا۔ کہ ذی الحجہ کا لفظ رے میں ایک زبردست زلزلہ کا آیا اور اس کے ماحول نے بہت سے لوگوں کو ہلاک کر دیا۔ 670}۔"
