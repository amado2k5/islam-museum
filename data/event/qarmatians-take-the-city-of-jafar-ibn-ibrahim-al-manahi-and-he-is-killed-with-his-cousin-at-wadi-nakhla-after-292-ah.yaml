label:
  ar: "القرامطة يملكون بلد جعفر بن إبراهيم المناحي، ثم يُقتل هو وابن عمه بوادي نخلة، بعد 292هـ، ص389-390"
  en: "The Qarmatians take the city of Ja'far ibn Ibrahim al-Manahi, and he and his cousin are later killed at Wadi Nakhla, after 292 AH, pp. 389-390"
  ur: "قرامطہ جعفر بن ابراہیم المناحی کا شہر لے لیتے ہیں، پھر وہ اور اس کا چچازاد وادی نخلہ میں قتل ہوتے ہیں، 292ھ کے بعد، ص389-390"
summary:
  ar: "ملك القرامطة بلد جعفر بن إبراهيم المناحي في منتصف ربيع الأول سنة 292، فهرب إلى القرتب بناحية زبيد، ثم قُتل هو وابن عمه أبو الفتوح بن أبي سلمة بوادي نخلة."
  en: "The Qarmatians took the city of Ja'far ibn Ibrahim al-Manahi in mid-Rabi' I 292 AH. He fled to al-Qurtab near Zabid and was later killed with his cousin Abu al-Futuh ibn Abi Salama at Wadi Nakhla."
  ur: "قرامطہ نے ربیع الاول 292ھ کے وسط میں جعفر بن ابراہیم المناحی کا شہر لے لیا۔ وہ زبید کے نواح میں القرتب بھاگ گیا، پھر وادی نخلہ میں اس کا چچازاد ابو الفتوح بن ابی سلمہ اور وہ خود قتل ہوئے۔"
