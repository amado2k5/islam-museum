label: { en: "The soothsayer episode in Banu Sa'd", ar: "حادثة الكاهن في بني سعد" }
summary:
  en: "As Halima's account is transmitted by Bayhaqi, she brought the boy to a soothsayer in Banu Sa'd after the chest-opening; the soothsayer urged his killing, Halima refused, and she returned him to Mecca, where he was briefly lost at the great gate."
  ar: "تروي حليمة كما نقلها البيهقي أنها عرضت الغلام على كاهن في بني سعد بعد حادثة شق الصدر، فدعا إلى قتله فرفضت، وعادت به إلى مكة، فاختفى عنها لحظة عند الباب الأعظم ثم عاد إليها."
