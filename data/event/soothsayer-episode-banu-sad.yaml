id: event/soothsayer-episode-banu-sad
class: event
kind: other
label: { en: "The soothsayer episode in Banu Sa'd", ar: "حادثة الكاهن في بني سعد", es: "El episodio del adivino en Banu Sa'd", fr: "L'épisode du devin à Banu Sa'd", ur: "بنو سعد میں کاہن کا واقعہ" }
summary:
  en: "As Halima's account is transmitted by Bayhaqi, she brought the boy to a soothsayer in Banu Sa'd after the chest-opening; the soothsayer urged his killing, Halima refused, and she returned him to Mecca, where he was briefly lost at the great gate."
  ar: "تروي حليمة كما نقلها البيهقي أنها عرضت الغلام على كاهن في بني سعد بعد حادثة شق الصدر، فدعا إلى قتله فرفضت، وعادت به إلى مكة، فاختفى عنها لحظة عند الباب الأعظم ثم عاد إليها."
  es: "Según el relato de Halima transmitido por Bayhaqi, ella llevó al niño ante un adivino en Banu Sa'd después de abrir el cofre; el adivino instó a matarlo, Halima se negó y lo devolvió a La Meca, donde se perdió brevemente en la gran puerta."
  fr: "D'après le récit d'Halima rapporté par Bayhaqi, après l'ouverture du coffre, elle amena le garçon chez un devin à Banu Sa'd; le devin lui conseilla de le tuer, Halima refusa et le ramena à La Mecque, où il fut brièvement perdu à la grande porte."
  ur: "جیسا کہ حلیمہ کا بیان بیہقی نے نقل کیا ہے، وہ اس لڑکے کو سینہ کھولنے کے بعد بنو سعد میں ایک کاہن کے پاس لے آئی۔ کاہن نے اس کے قتل پر زور دیا، حلیمہ نے انکار کر دیا، اور وہ اسے مکہ واپس لے آئی، جہاں وہ مختصر وقت کے لیے عظیم دروازے پر کھو گیا۔"
