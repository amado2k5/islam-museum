label:
  ar: "كتب ابن بسطام إلى الطرفين وعزم بنو الحارث على المسير إلى وادعة، ص286"
  en: "Ibn Bustam writes to both sides and Banu al-Harith resolve to march on Wadi'a, p. 286"
  ur: "ابن بسطام کا دونوں فریقوں کو لکھنا اور بنو حارث کا وادعہ پر چڑھائی کا عزم، ص286"
summary:
  ar: "لما بلغ بني الحارث شعر الهادي اغتموا واضطربت أمورهم، وكتب ابن بسطام إلى محمد بن عبيد الله بالمودة والعهد وإلى الهادي، وبعد خروج أبي جعفر من القرية أغارت بنو الحارث على ما فيها وأجمعوا على المسير إلى وادعة لإخراجه."
  en: "When al-Hadi's verses reached Banu al-Harith they were deeply distressed and their affairs unsettled; Ibn Bustam wrote to Muhammad ibn Ubaydallah of his affection and pledge and kept writing to al-Hadi; after Abu Ja'far left the village, Banu al-Harith raided what was in it and agreed to march on Wadi'a to drive him out."
  ur: "جب ہادی کے اشعار بنو حارث تک پہنچے تو وہ سخت غمگین ہوئے اور ان کے معاملات بگڑ گئے؛ ابن بسطام نے محمد بن عبید اللہ کو محبت اور عہد کا خط لکھا اور ہادی کو بھی لکھتا رہا؛ ابو جعفر کے بستی چھوڑنے کے بعد بنو حارث نے اس کے سامان پر چھاپہ مارا اور وادعہ پر چڑھائی کا ارادہ کیا تاکہ انہیں نکال دیں۔"
