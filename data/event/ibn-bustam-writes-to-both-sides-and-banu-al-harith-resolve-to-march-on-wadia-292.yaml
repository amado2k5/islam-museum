id: event/ibn-bustam-writes-to-both-sides-and-banu-al-harith-resolve-to-march-on-wadia-292
class: event
kind: other
label:
  ar: "كتب ابن بسطام إلى الطرفين وعزم بنو الحارث على المسير إلى وادعة، ص286"
  en: "Ibn Bustam writes to both sides and Banu al-Harith resolve to march on Wadi'a, p. 286"
  ur: "ابن بسطام کا دونوں فریقوں کو لکھنا اور بنو حارث کا وادعہ پر چڑھائی کا عزم، ص286"
  es: "Ibn Bustam escribe a ambos bandos y Banu al-Harith decide marchar sobre Wadi'a, pág. 286."
  fr: "Ibn Bustam écrit aux deux camps et les Banu al-Harith décident de marcher sur Wadi'a, p. 286"
summary:
  ar: "لما بلغ بني الحارث شعر الهادي اغتموا واضطربت أمورهم، وكتب ابن بسطام إلى محمد بن عبيد الله بالمودة والعهد وإلى الهادي، وبعد خروج أبي جعفر من القرية أغارت بنو الحارث على ما فيها وأجمعوا على المسير إلى وادعة لإخراجه."
  en: "When al-Hadi's verses reached Banu al-Harith they were deeply distressed and their affairs unsettled; Ibn Bustam wrote to Muhammad ibn Ubaydallah of his affection and pledge and kept writing to al-Hadi; after Abu Ja'far left the village, Banu al-Harith raided what was in it and agreed to march on Wadi'a to drive him out."
  ur: "جب ہادی کے اشعار بنو حارث تک پہنچے تو وہ سخت غمگین ہوئے اور ان کے معاملات بگڑ گئے؛ ابن بسطام نے محمد بن عبید اللہ کو محبت اور عہد کا خط لکھا اور ہادی کو بھی لکھتا رہا؛ ابو جعفر کے بستی چھوڑنے کے بعد بنو حارث نے اس کے سامان پر چھاپہ مارا اور وادعہ پر چڑھائی کا ارادہ کیا تاکہ انہیں نکال دیں۔"
  es: "Cuando los versos de al-Hadi llegaron a Banu al-Harith, se sintieron profundamente angustiados y sus asuntos se vieron afectados; Ibn Bustam escribió a Muhammad ibn Ubaydallah expresándole su afecto y promesa, y continuó escribiendo a al-Hadi; después de que Abu Ja'far abandonara la aldea, Banu al-Harith saqueó lo que había en ella y acordó marchar hacia Wadi'a para expulsarlo."
  fr: "Lorsque les vers d'al-Hadi parvinrent aux Banu al-Harith, ils furent profondément affligés et leurs affaires bouleversées; Ibn Bustam écrivit à Muhammad ibn Ubaydallah pour lui faire part de son affection et de son engagement, et continua d'écrire à al-Hadi; après le départ d'Abu Ja'far du village, les Banu al-Harith pillèrent ce qui s'y trouvait et décidèrent de marcher sur Wadi'a pour le chasser."
