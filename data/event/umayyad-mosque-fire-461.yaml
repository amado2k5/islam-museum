summary:
  ar: "احترق الجامع الأموي بدمشق في نصف شعبان سنة إحدى وستين وأربعمائة؛ وكان سببه أن أمير الجيوش بدراً الجمالي ورد من مصر إلى دمشق فوقع القتال بين المشارقة والمغاربة بعد العصر يوم النصف فضربوا داراً مجاورة للجامع بالنار فبادرت إليه، وترك المقاتلون القتال لإطفائه وعظم الأمر، ووصف العماد الكاتب الحريق ووصفه الصفدي {cite:umari-masalik-1924 p. 198-200}."
  en: "The Umayyad Mosque burned in mid-Sha'ban 461: Badr al-Jamali had arrived from Egypt and fighting broke out between the easterners and westerners, who torched houses adjoining the mosque until the fire reached it; the combatants dropped the feud to fight the flames. Al-Imad al-Katib and al-Safadi described the blaze {cite:umari-masalik-1924 p. 198-200}."
