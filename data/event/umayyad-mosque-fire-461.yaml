label: { ar: "حريق الجامع الأموي سنة 461", en: "the Umayyad Mosque fire of 461", es: "El incendio de la mezquita de los Omeyas en 461", fr: "l'incendie de la mosquée des Omeyyades en 461" }
summary:
  ar: "احترق الجامع الأموي بدمشق في نصف شعبان سنة إحدى وستين وأربعمائة؛ وكان سببه أن أمير الجيوش بدراً الجمالي ورد من مصر إلى دمشق فوقع القتال بين المشارقة والمغاربة بعد العصر يوم النصف فضربوا داراً مجاورة للجامع بالنار فبادرت إليه، وترك المقاتلون القتال لإطفائه وعظم الأمر، ووصف العماد الكاتب الحريق ووصفه الصفدي {cite:umari-masalik-1924 p. 198-200}."
  en: "The Umayyad Mosque burned in mid-Sha'ban 461: Badr al-Jamali had arrived from Egypt and fighting broke out between the easterners and westerners, who torched houses adjoining the mosque until the fire reached it; the combatants dropped the feud to fight the flames. Al-Imad al-Katib and al-Safadi described the blaze {cite:umari-masalik-1924 p. 198-200}."
  es: "La mezquita de los Omeyas se incendió a mediados de Sha'ban 461: Badr al-Jamali había llegado de Egipto y estallaron combates entre orientales y occidentales, quienes incendiaron las casas contiguas a la mezquita hasta que el fuego la alcanzó; los combatientes abandonaron su disputa para luchar contra las llamas. Al-Imad al-Katib y al-Safadi describieron el incendio {cite:umari-masalik-1924 p. 198-200}."
  fr: "La mosquée omeyyade brûla au milieu du mois de Sha'ban 461: Badr al-Jamali était arrivé d'Égypte et des combats éclatèrent entre les orientaux et les occidentaux, qui incendièrent les maisons voisines jusqu'à ce que le feu atteigne la mosquée; les belligérants abandonnèrent leur querelle pour combattre les flammes. Al-Imad al-Katib et al-Safadi ont décrit l'incendie (voir: umari-masalik-1924, p. 198-200)."
