id: event/ali-judgment-on-the-debased-dirham-kufa
class: event
kind: court-ruling
label: { ar: "قضاء علي في الصفعة على الدرهم المغموز بالكوفة", en: "Ali's judgment on a slap over a debased dirham in Kufa" }
summary:
  ar: "باع رجل شاة إلى آخر بشرط ألا يعطيه درهماً مغموزاً أو محذّقاً، فأعطاه درهماً مغموزاً، فرده البائع، فلطمه المشتري. رفع الأمر إلى علي في السوق، فقضى أن يجلس اللاطم، وخيّر الملطوم بين القصاص والعفو، فلما جاز الرجل قال علي: «يا معشر المسلمين خذوه»، فحُمل على ظهر رجل وضُرب خمس عشرة درة، وقال: «هذا نكال لما انتهكت من حرمته» {cite:sallabi-ali-vol1 p. 228}."
  en: "A man sold a sheep on the condition of no debased coin and gave one; the buyer returned it and was slapped by the seller. Ali, passing through the market, ruled that the slapper sit, let the slapped man choose between retaliation and pardon, then had the slapper carried on a man's back and beaten fifteen strokes, saying this was the punishment for violating the other man's sanctity."
