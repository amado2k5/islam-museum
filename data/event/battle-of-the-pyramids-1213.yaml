label: { ar: "وقعة إمبابة ⁦(معركة الأهرام)⁩ سنة 1213هـ / 1798م", en: "The battle of Imbaba (Battle of the Pyramids), 1213 AH / 1798", ur: "1213ھ / 1798ء میں امبابہ کی لڑائی ⁦(اہرام کی جنگ)⁩" }
summary:
  ar: "الوقعة التي انكسر فيها مراد بيك وعسكر المماليك أمام الفرنسيس ببر إمبابة غربي النيل يوم السبت سابع صفر سنة 1213هـ، كما يرويها الجبرتي: تقاتلوا نحو ثلاثة أرباع ساعة والريح تسفّ الرمال في وجوه المصريين، ثم انهزم العسكر الغربي وغرق كثير من الخيالة، وفر مراد بيك إلى الصعيد، وترك إبراهيم بيك والباشا خيامهم في البر الشرقي، وخرج معظم أهل القاهرة ليلاً فنهبتهم العربان {cite:ajaib-al-athar-moreh-v3 p. 39-41}."
  en: "The battle in which Murad Bey and the Mamluk army broke before the French on the Imbaba bank west of the Nile on Saturday 7 Safar 1213 AH, as al-Jabarti tells it: they fought for about three-quarters of an hour with the wind driving sand into the Egyptians' faces; the western army broke, many horsemen drowned, Murad Bey fled south, Ibrahim Bey and the pasha abandoned their tents on the east bank, and most of the people of Cairo fled by night, to be stripped by Bedouin {cite:ajaib-al-athar-moreh-v3 p. 39-41}."
