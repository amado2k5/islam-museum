label: { ar: "وصية عبادة بن الصامت لابنه في القدر ووفاته بفلسطين", en: "Ubada ibn al-Samit's counsel to his son on the decree, and his death in Palestine", ur: "عبادہ بن الصامت کی بیٹے کو تقدیر پر نصیحت اور فلسطین میں وفات", es: "El consejo de Ubada ibn al-Samit a su hijo sobre el decreto y su muerte en Palestina.", fr: "Les conseils d'Ubada ibn al-Samit à son fils au sujet du décret, et sa mort en Palestine", tr: "Ubadah ibn al-Samit'in oğluna kader ve Filistin'deki ölümüyle ilgili vasiyeti.", id: "Wasiat Ubadah ibn al-Samit kepada putranya mengenai takdir dan kematiannya di Palestina" }
summary:
  ar: "روى أبو نعيم عن عبادة بن الصامت قوله لابنه إنه لن يجد حقيقة الإيمان حتى يعلم أن ما أصابه لم يكن ليخطئه وما أخطأه لم يكن ليصيبه، وساق حديث أول ما خلق الله القلم {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 5 p. 248}. ويروى أنه اشتكى فأقبل الصنابحي فقال له: لئن سُئلت لأشهدن لك، ولئن شُفّعت لأشفعن لك، ولئن قدرت لأنفعنك {cite:usd-al-ghaba scan vol. 1 p. 1357}. وتوفي سنة أربع وثلاثين بالرملة، وقيل ببيت المقدس، وهو ابن اثنتين وسبعين {cite:isti-ab-ibn-abd-al-barr scan vol. 2 p. 469}، ويقول ابن عبد البر إن قبره ببيت المقدس معروف {cite:isti-ab-ibn-abd-al-barr scan vol. 1 p. 461}."
  en: "Abu Nu'aym relates that Ubada ibn al-Samit told his son he would never find the reality of faith until he knew that what befell him could not have missed him and what missed him could not have befallen him, citing the report that God's first creation was the pen {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 5 p. 248}. It is reported that in an illness al-Sunabihi came to him and Ubada said: if I am asked I will testify for you, if intercession is allowed I will intercede for you, if I am able I will benefit you {cite:usd-al-ghaba scan vol. 1 p. 1357}. He died in 34 AH at al-Ramla, or, it is said, at Bayt al-Maqdis, aged seventy-two {cite:isti-ab-ibn-abd-al-barr scan vol. 2 p. 469}; Ibn Abd al-Barr says his grave at Bayt al-Maqdis is well known {cite:isti-ab-ibn-abd-al-barr scan vol. 1 p. 461}."
  ur: "ابو نعیم روایت کرتے ہیں کہ عبادہ بن الصامت نے اپنے بیٹے سے کہا کہ تم ایمان کی حقیقت اس وقت تک نہ پاؤ گے جب تک نہ جان لو کہ جو تمھیں پہنچا وہ تم سے چوکنے والا نہ تھا اور جو تم سے چوکا وہ تمھیں پہنچنے والا نہ تھا، اور انھوں نے اس حدیث کا حوالہ دیا کہ اللہ نے سب سے پہلے قلم کو پیدا کیا {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 5 p. 248}۔ روایت ہے کہ ایک بیماری میں صنابحی ان کے پاس آئے تو عبادہ نے کہا: اگر مجھ سے پوچھا گیا تو میں تمھارے حق میں گواہی دوں گا، اگر شفاعت کی اجازت ہوئی تو شفاعت کروں گا، اگر قدرت ہوئی تو تمھیں نفع پہنچاؤں گا {cite:usd-al-ghaba scan vol. 1 p. 1357}۔ وہ ۳۴ ہجری میں رملہ میں، اور ایک قول کے مطابق بیت المقدس میں، بہتر سال کی عمر میں فوت ہوئے {cite:isti-ab-ibn-abd-al-barr scan vol. 2 p. 469}؛ ابن عبد البر کہتے ہیں کہ بیت المقدس میں ان کی قبر معروف ہے {cite:isti-ab-ibn-abd-al-barr scan vol. 1 p. 461}۔"
  es: "Abu Nu'aym relata que Ubada ibn al-Samit le dijo a su hijo que nunca encontraría la realidad de la fe hasta que supiera que lo que le sucedió no pudo haberlo pasado por alto y lo que no le pudo haber sucedido no pudo haberle sucedido, citando el informe de que la primera creación de Dios fue la pluma {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 5 p. 248}. Se informa que en una enfermedad al-Sunabihi fue a verlo y Ubada dijo: si me lo piden, testificaré por ti; si se permite la intercesión, intercederé por ti; si puedo, te beneficiaré {cite:usd-al-ghaba scan vol. 1 p. 1357}. Murió en el año 34 AH en al-Ramla, o, se dice, en Bayt al-Maqdis, a la edad de setenta y dos años {cite:isti-ab-ibn-abd-al-barr scan vol. 2 pág. 469}; Ibn Abd al-Barr dice que su tumba en Bayt al-Maqdis es bien conocida {cite:isti-ab-ibn-abd-al-barr scan vol. 1 pág. 461}."
  fr: "Abou Nu'aym rapporte qu'Ubada ibn al-Samit dit à son fils qu'il ne trouverait jamais la véritable vérité de la foi tant qu'il ne saurait pas que ce qui lui arrivait ne pouvait l'avoir épargné et que ce qui l'avait épargné ne pouvait lui être arrivé, citant le hadith selon lequel la première création de Dieu fut la plume {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 5 p. 248}. On rapporte que, malade, al-Sunabihi vint le voir et qu'Ubada lui dit: « Si on me le demande, je témoignerai pour toi; si l'intercession est permise, j'intercéderai pour toi; si j'en suis capable, je te serai utile » {cite:usd-al-ghaba scan vol. 1 p. 1357}. Il mourut en 34 AH à al-Ramla, ou, dit-on, à Bayt al-Maqdis, à l'âge de soixante-douze ans {cite:isti-ab-ibn-abd-al-barr scan vol. 2 p. 469}; Ibn Abd al-Barr dit que sa tombe à Bayt al-Maqdis est bien connue {cite:isti-ab-ibn-abd-al-barr scan vol. 1 p. 461}."
  tr: "Ebu Nuaym, Ubadah ibn el-Samit'ten rivayetle, oğluna şöyle dediğini aktarmıştır: \"Ona gelenin ondan kaçamayacağını ve ondan kaçanın da ona gelmeyeceğini anlamadıkça imanın gerçek özünü bulamayacaktır.\" Sonra da Allah'ın yarattığı ilk şey olan kalem hakkında hadis rivayet etmiştir. {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 5 p. 248}. Ayrıca, şikayette bulunduğunda, el-Sunabihi'nin yanına gelip şöyle dediği de rivayet edilir: \"Senden istenirse senin için şahitlik ederim; senden şefaat etmen istenirse senin için şefaat ederim; ve eğer gücüm yeterse sana fayda sağlarım.\" {cite:usd-al-ghaba scan vol. 1 p. 1357}. Hicri 34 yılında Ramla'da, ya da rivayete göre Kudüs'te, yetmiş iki yaşında vefat etti. {cite:isti-ab-ibn-abd-al-barr scan vol. 2 p. 469} ve İbn Abd al-Barr, Kudüs'teki mezarının iyi bilindiğini söylüyor. {cite:isti-ab-ibn-abd-al-barr scan vol. 1 p. 461}"
  id: "Abu Nu'aym meriwayatkan dari 'Ubadah ibn al-Samit bahwa ia berkata kepada putranya, \"Ia tidak akan menemukan hakikat iman yang sejati sampai ia mengetahui bahwa apa yang menimpanya tidak mungkin luput darinya, dan apa yang luput darinya tidak mungkin menimpanya.\" Kemudian ia meriwayatkan hadits tentang hal pertama yang diciptakan Allah: Pena. {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 5 p. 248}. Diriwayatkan juga bahwa ia mengeluh, dan al-Sunabihi datang kepadanya dan berkata, \"Jika engkau diminta, aku akan bersaksi untukmu; jika engkau diminta untuk memberi syafaat, aku akan memberi syafaat untukmu; dan jika aku mampu, aku akan memberimu manfaat.\" {cite:usd-al-ghaba scan vol. 1 p. 1357}. Ia wafat pada tahun 34 H di Ramla, atau dikatakan juga di Yerusalem, pada usia tujuh puluh dua tahun. {cite:isti-ab-ibn-abd-al-barr scan vol. 2 p. 469}, dan Ibn Abd al-Barr mengatakan bahwa makamnya di Yerusalem sangat terkenal {cite:isti-ab-ibn-abd-al-barr scan vol. 1 p. 461}."
