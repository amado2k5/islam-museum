summary:
  ar: "بطاقة أولية لمعركة القديس غوتهارد سنة ١٦٦٤م، هزيمة العثمانيين أمام جيش الائتلاف الإمبراطوري في الحرب النمساوية التركية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Saint Gotthard in 1664, the Ottoman defeat by the Imperial coalition army in the Austro-Turkish war; its sources are not yet checked on the page."
  es: "Boceto de ficha para la batalla de San Gotardo en 1664, la derrota otomana a manos del ejército de la coalición imperial en la guerra austro-turca; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour la bataille du Saint-Gothard en 1664, la défaite ottomane face à l'armée de la coalition impériale lors de la guerre austro-turque; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1664 میں سینٹ گوتھرڈ کی جنگ کے لیے ڈرافٹ کارڈ، آسٹرو ترک جنگ میں شاہی اتحادی فوج کے ہاتھوں عثمانی شکست؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1664'te gerçekleşen ve Osmanlı İmparatorluğu'nun Avusturya-Türk Savaşı'nda İmparatorluk Koalisyon Ordusu tarafından yenilgiye uğratıldığı St. Gotthard Muharebesi'ne dair ön bilgiler; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran St. Gotthard pada tahun 1664, kekalahan Ottoman oleh Tentara Koalisi Kekaisaran dalam Perang Austro-Turki; sumber-sumber di halaman ini belum ditinjau."
