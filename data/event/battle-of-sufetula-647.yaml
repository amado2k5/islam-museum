summary:
  ar: "بطاقة أولية لمعركة سبيطلة سنة ٦٤٧م، نصر عبد الله بن سعد على البطريق غريغوريوس وفتح إفريقية للإسلام؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Sufetula in 647, Abd Allah ibn Sa'd's victory over the exarch Gregory that opened Ifriqiya; its sources are not yet checked on the page."
  fr: "Fiche provisoire pour la bataille de Sufetula en 647, victoire d'Abd Allah ibn Sa'd sur l'exarque Grégoire, qui ouvrit l'Ifriqiya ; ses sources n'ont pas encore été vérifiées à la page."
  es: "Boceto de ficha para la Batalla de Sufetula en 647, la victoria de Abd Allah ibn Sa'd sobre el exarca Gregorio que abrió Ifriqiya; sus fuentes aún no han sido verificadas en la página."
  ur: "647 میں جنگ صفیولا کے لیے ڈرافٹ کارڈ، عبد اللہ بن سعد کی گریگوری پر فتح جس سے افریقیہ کا آغاز ہوا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "647 yılında gerçekleşen Sbeitla Muharebesi'nin, Abdullah bin Saad'ın Patrik Gregory'ye karşı kazandığı zaferin ve Afrika'nın İslam'a açılmasının ön anlatımı; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Sbeitla pada tahun 647 M, kemenangan Abdullah bin Saad atas Patriark Gregorius dan pembukaan Afrika bagi Islam; sumber-sumber di halaman ini belum ditinjau."
