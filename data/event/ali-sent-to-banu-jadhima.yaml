id: event/ali-sent-to-banu-jadhima
class: event
kind: other
label: { ar: "إرسال علي إلى بني جذيمة لإصلاح خطأ خالد", en: "Ali sent to Banu Jadhima to correct Khalid's error", es: "Ali envió a Banu Jadhima para corregir el error de Khalid.", fr: "Ali a envoyé un message à Banu Jadhima pour corriger l'erreur de Khalid.", ur: "علی نے خالد کی غلطی کو دور کرنے کے لیے بنو جدھیمہ کو بھیجا۔" }
summary:
  ar: "بعد فتح مكة في السنة الثامنة أرسل النبي خالد بن الوليد إلى بني جذيمة يدعوهم إلى الإسلام، فلم يحسنوا أن يقولوا أسلمنا، فقالوا صبأنا، فأخذ خالد يقتل منهم؛ فبعث النبي علياً لينظر في أمرهم ويتلافى الخطأ، وأنكر النبي ما صنع خالد."
  en: "After the conquest of Mecca in the eighth year AH the Prophet sent Khalid ibn al-Walid to the Banu Jadhima. They could not say 'we have submitted' and said 'we have turned away', and Khalid began killing some of them; the Prophet sent Ali to look into the matter and repair the error."
  es: "Tras la conquista de La Meca en el octavo año de la Hégira, el Profeta envió a Khalid ibn al-Walid a los Banu Jadhima. Estos no pudieron decir \"nos hemos sometido\" y dijeron \"nos hemos apartado\", y Khalid comenzó a matar a algunos de ellos. El Profeta envió a Ali para que investigara el asunto y enmendara el error."
  fr: "Après la conquête de La Mecque en l'an 8 de l'Hégire, le Prophète envoya Khalid ibn al-Walid auprès des Banu Jadhima. Incapables de dire « nous nous sommes soumis », ils déclarèrent « nous nous sommes détournés », et Khalid commença à en tuer certains. Le Prophète envoya alors Ali enquêter sur la situation et remédier à cette erreur."
  ur: "آٹھویں سال فتح مکہ کے بعد نبی نے خالد بن ولید کو بنو جذیمہ کی طرف بھیجا۔ وہ یہ نہ کہہ سکے کہ 'ہم نے عرض کیا' اور کہا 'ہم نے منہ موڑ لیا'، اور خالد نے ان میں سے بعض کو قتل کرنا شروع کر دیا۔ نبی نے علی کو بھیجا کہ وہ اس معاملے کو دیکھیں اور غلطی کو دور کریں۔"
