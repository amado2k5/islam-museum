summary:
  ar: "بعد فتح مكة في السنة الثامنة أرسل النبي خالد بن الوليد إلى بني جذيمة يدعوهم إلى الإسلام، فلم يحسنوا أن يقولوا أسلمنا، فقالوا صبأنا، فأخذ خالد يقتل منهم؛ فبعث النبي علياً لينظر في أمرهم ويتلافى الخطأ، وأنكر النبي ما صنع خالد."
  en: "After the conquest of Mecca in the eighth year AH the Prophet sent Khalid ibn al-Walid to the Banu Jadhima. They could not say 'we have submitted' and said 'we have turned away', and Khalid began killing some of them; the Prophet sent Ali to look into the matter and repair the error."
