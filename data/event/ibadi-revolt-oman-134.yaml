summary:
  ar: "في سنة ١٣٤ — ما استقر السفاح في خلافته حتى — تحرك خوارج عُمان الإباضية على رأسهم الجلندى بن مسعود؛ فأرسل إليهم خازم بن خزيمة جيشاً سار في البحر حتى أرسى على ساحل عمان، وتقاتلوا قتالاً شديداً سجالاً، حتى أوقد الجيش العباسي بيوت الثائرين الخشبية بمشاقة مغموسة بالنفط فاشتغل الثائرون بإنقاذ أهاليهم، فحمل عليهم خازم فوضعوا فيهم السيف وقُتل الجلندى فيمن قتل، وبلغت عدة القتلى نحو عشرة آلاف وبُعث برءوسهم إلى البصرة {cite:duha-islam p. 950}."
  en: "The Ibadi rising of al-Julanda ibn Mas'ud in Oman, crushed by al-Saffah's general Khazim ibn Khuzayma with some ten thousand dead, 134 AH {cite:duha-islam p. 950}."
