label: { ar: "ثورة الجلندى الإباضية في عُمان", en: "The Ibadi revolt of al-Julanda in Oman", es: "La revuelta ibadí de al-Julanda en Omán", fr: "La révolte ibadite d'al-Julanda à Oman", ur: "عمان میں الجولندا کی عبادی بغاوت", tr: "Umman'daki İbadi Julanda isyanı", id: "Pemberontakan Ibadi Julanda di Oman" }
summary:
  ar: "في سنة ١٣٤ — ما استقر السفاح في خلافته حتى — تحرك خوارج عُمان الإباضية على رأسهم الجلندى بن مسعود؛ فأرسل إليهم خازم بن خزيمة جيشاً سار في البحر حتى أرسى على ساحل عمان، وتقاتلوا قتالاً شديداً سجالاً، حتى أوقد الجيش العباسي بيوت الثائرين الخشبية بمشاقة مغموسة بالنفط فاشتغل الثائرون بإنقاذ أهاليهم، فحمل عليهم خازم فوضعوا فيهم السيف وقُتل الجلندى فيمن قتل، وبلغت عدة القتلى نحو عشرة آلاف وبُعث برءوسهم إلى البصرة {cite:duha-islam p. 950}."
  en: "The Ibadi rising of al-Julanda ibn Mas'ud in Oman, crushed by al-Saffah's general Khazim ibn Khuzayma with some ten thousand dead, 134 AH {cite:duha-islam p. 950}."
  es: "El levantamiento ibadí de al-Julanda ibn Mas'ud en Omán, aplastado por el general de al-Saffah, Khazim ibn Khuzayma, con unos diez mil muertos, 134 d.H. {cita:duha-islam p. 950}."
  fr: "Le soulèvement ibadite d'al-Julanda ibn Mas'ud à Oman, écrasé par le général d'al-Saffah Khazim ibn Khuzayma avec quelque dix mille morts, 134 AH {cite:duha-islam p. 950}."
  ur: "عمان میں الجلندہ ابن مسعود کا عبادی عروج، الصفح کے جنرل خزیم ابن خزیمہ نے تقریباً دس ہزار کے ساتھ کچل دیا، 134 ہجری۔ 950}۔"
  tr: "134 yılında, Saffe halifeliğini kurar kurmaz, Umman'daki İbadi Hariciler, Julanda bin Mesud önderliğinde onlara karşı harekete geçti. Hazim bin Huzeyme, deniz yoluyla Umman kıyılarına ulaşana kadar onlara bir ordu gönderdi. Şiddetli bir savaş yaşandı; Abbasi ordusu, isyancıların ahşap evlerini yağa batırılmış dallarla ateşe verdi. İsyancılar ailelerini kurtarmakla meşgul oldukları için Hazim onlara saldırdı ve onları kılıçtan geçirdi. Ölenler arasında Julanda da vardı ve ölü sayısı on bine ulaştı; başları Basra'ya gönderildi. {cite:duha-islam s. 950}"
  id: "Pada tahun 134 - segera setelah al-Saffah menetapkan kekhalifahannya, kaum Ibadi Kharijites dari Oman, yang dipimpin oleh Julanda bin Masoud, bergerak melawan mereka. Khazim bin Khuzaymah mengirimkan pasukan yang berlayar melalui laut hingga mendarat di pantai Oman. Mereka bertempur sengit, hingga pasukan Abbasiyah membakar rumah-rumah kayu para pemberontak dengan ranting yang direndam minyak. Para pemberontak sibuk menyelamatkan keluarga mereka, sehingga Khazim menyerang mereka, dan mereka membantai para pemberontak. Julanda terbunuh di antara mereka yang tewas, dan jumlah korban tewas mencapai sekitar sepuluh ribu, dan kepala mereka dikirim ke Basra. {cite:duha-islam p. 950}"
