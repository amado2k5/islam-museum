id: event/al-hadi-at-athafit-and-the-people-of-bayt-dhud-285
class: event
kind: other
label:
  ar: أهل بيت ذؤد يستغيثون بالهادي من الدعام في أثافت وتولية والٍ من ولد عمر بن علي، شعبان–رمضان 285هـ
  en: The people of Bayt Dhu'd appeal to al-Hadi at Athafit against al-Da'am, and a governor of the line of Umar ibn Ali is sent, Sha'ban–Ramadan 285 AH
  ur: بیت ذؤد کے لوگوں کی اثافت میں دعام کے خلاف ہادی سے فریاد اور عمر بن علی کی اولاد کے والی کی روانگی، شعبان–رمضان 285ھ
summary:
  ar: وصل أهل بيت ذؤد، وهو موضع قرب أثافت في يد الدعام بن إبراهيم، بالهادي في أثافت يشكون ما يجري في بلدهم من جند الدعام الذين وصفهم الراوي بالفسق، وزعموا أن جندياً أخذ جارية غصباً وقتل أباها فلم يتناكر الدعام، فوجه الهادي معهم رجلاً من بني عمه من ولد عمر بن علي فأخرج ولاة الدعام وأمر بالمعروف ونهى عن المنكر، وبايعه صعصعة بن جعفر من ريدة.
  en: The people of Bayt Dhu'd, a place near Athafit held by al-Da'am ibn Ibrahim, came to al-Hadi at Athafit complaining of what al-Da'am's troops, whom the narrator calls profligate, were doing in their land, alleging that a soldier had taken a girl by force and killed her father and al-Da'am did not object; al-Hadi sent with them a man of his cousins of the line of Umar ibn Ali, who put out al-Da'am's governors and enjoined good and forbade wrong; Sa'sa'a ibn Ja'far of Raydah also pledged.
  ur: بیت ذؤد کے لوگ، جو اثافت کے قریب دعام بن ابراہیم کے قبضے میں ایک مقام ہے، اثافت میں ہادی کے پاس آ کر اپنے ملک میں دعام کے ان سپاہیوں کے طرز عمل کی شکایت کرنے لگے جنہیں راوی فاسق کہتا ہے، اور بتایا کہ ایک سپاہی نے ایک لڑکی کو زبردستی پکڑا اور اس کے باپ کو قتل کیا اور دعام نے ناراضی ظاہر نہ کی؛ ہادی نے ان کے ساتھ عمر بن علی کی اولاد سے اپنے ایک چچازاد کو بھیجا جس نے دعام کے عمال کو نکالا اور نیکی کا حکم اور برائی سے روکنا قائم کیا؛ ریدہ کے صعصعہ بن جعفر نے بھی بیعت کی۔
