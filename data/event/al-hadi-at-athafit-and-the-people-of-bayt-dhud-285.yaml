id: event/al-hadi-at-athafit-and-the-people-of-bayt-dhud-285
class: event
kind: other
label:
  ar: أهل بيت ذؤد يستغيثون بالهادي من الدعام في أثافت وتولية والٍ من ولد عمر بن علي، شعبان–رمضان 285هـ
  en: The people of Bayt Dhu'd appeal to al-Hadi at Athafit against al-Da'am, and a governor of the line of Umar ibn Ali is sent, Sha'ban–Ramadan 285 AH
  ur: بیت ذؤد کے لوگوں کی اثافت میں دعام کے خلاف ہادی سے فریاد اور عمر بن علی کی اولاد کے والی کی روانگی، شعبان–رمضان 285ھ
  es: "La gente de Bayt Dhu'd apela a al-Hadi en Athafit contra al-Da'am, y se envía un gobernador de la línea de Umar ibn Ali, Sha'ban-Ramadán 285 AH."
  fr: "Les habitants de Bayt Dhu'd font appel à al-Hadi à Athafit contre al-Da'am, et un gouverneur issu de la lignée d'Umar ibn Ali est envoyé (Sha'ban-Ramadan 285 AH)."
  tr: "Zuld hanedanından olanlar, Athaf'taki Al-Da'am'dan Al-Hadi'den yardım ve Ömer bin Ali'nin soyundan bir vali atanmasını talep ederler. (Şaban-Ramazan 285 Hicri)"
  id: "Kaum dari keluarga Dhu'd meminta pertolongan kepada Al-Hadi dari Al-Da'am di Athafat dan pengangkatan seorang gubernur dari keturunan Umar bin Ali, Sya'ban Ramadan 285 H."
summary:
  ar: وصل أهل بيت ذؤد، وهو موضع قرب أثافت في يد الدعام بن إبراهيم، بالهادي في أثافت يشكون ما يجري في بلدهم من جند الدعام الذين وصفهم الراوي بالفسق، وزعموا أن جندياً أخذ جارية غصباً وقتل أباها فلم يتناكر الدعام، فوجه الهادي معهم رجلاً من بني عمه من ولد عمر بن علي فأخرج ولاة الدعام وأمر بالمعروف ونهى عن المنكر، وبايعه صعصعة بن جعفر من ريدة.
  en: The people of Bayt Dhu'd, a place near Athafit held by al-Da'am ibn Ibrahim, came to al-Hadi at Athafit complaining of what al-Da'am's troops, whom the narrator calls profligate, were doing in their land, alleging that a soldier had taken a girl by force and killed her father and al-Da'am did not object; al-Hadi sent with them a man of his cousins of the line of Umar ibn Ali, who put out al-Da'am's governors and enjoined good and forbade wrong; Sa'sa'a ibn Ja'far of Raydah also pledged.
  ur: بیت ذؤد کے لوگ، جو اثافت کے قریب دعام بن ابراہیم کے قبضے میں ایک مقام ہے، اثافت میں ہادی کے پاس آ کر اپنے ملک میں دعام کے ان سپاہیوں کے طرز عمل کی شکایت کرنے لگے جنہیں راوی فاسق کہتا ہے، اور بتایا کہ ایک سپاہی نے ایک لڑکی کو زبردستی پکڑا اور اس کے باپ کو قتل کیا اور دعام نے ناراضی ظاہر نہ کی؛ ہادی نے ان کے ساتھ عمر بن علی کی اولاد سے اپنے ایک چچازاد کو بھیجا جس نے دعام کے عمال کو نکالا اور نیکی کا حکم اور برائی سے روکنا قائم کیا؛ ریدہ کے صعصعہ بن جعفر نے بھی بیعت کی۔
  es: "La gente de Bayt Dhu'd, un lugar cerca de Athafit que estaba en manos de al-Da'am ibn Ibrahim, llegó a Athafit para quejarse de lo que las tropas de al-Da'am, a quienes el narrador llama derrochadores, estaban haciendo en su tierra, alegando que un soldado había tomado a una niña por la fuerza y matado a su padre y al-Da'am no se opuso; al-Hadi envió con ellos a un hombre de sus primos de la línea de Umar ibn Ali, quien expulsó a los gobernadores de al-Da'am y ordenó el bien y prohibió el mal; Sa'sa'a ibn Ja'far de Raydah también se comprometió."
  fr: "Les habitants de Bayt Dhu'd, un lieu près d'Athafit tenu par al-Da'am ibn Ibrahim, vinrent trouver al-Hadi à Athafit se plaignant de ce que les troupes d'al-Da'am, que le narrateur qualifie de dissolues, faisaient sur leurs terres, alléguant qu'un soldat avait enlevé une fille de force et tué son père et qu'al-Da'am n'avait pas protesté; al-Hadi envoya avec eux un homme de sa lignée, cousin d'Umar ibn Ali, qui destitua les gouverneurs d'al-Da'am et ordonna le bien et interdit le mal; Sa'sa'a ibn Ja'far de Raydah prêta également serment."
  tr: "Athafit yakınlarındaki, Al-Da'am bin İbrahim'in elinde bulunan Beyt Dhu'd halkı, anlatıcının ahlaksız olarak tanımladığı Al-Da'am askerlerinin ülkelerinde yaptıklarından şikayet etmek için Athafit'teki Al-Hadi'ye geldiler. Bir askerin zorla bir cariyeyi kaçırdığını ve babasını öldürdüğünü, Al-Da'am'ın ise buna itiraz etmediğini iddia ettiler. Bunun üzerine Al-Hadi, Ömer bin Ali'nin soyundan gelen kuzenlerinden birini onlarla birlikte gönderdi ve bu adam Al-Da'am valilerini kovdu, iyiliği emretti ve kötülüğü yasakladı; Rıza'dan Sa'sa'ah bin Cafer de ona biat etti."
  id: "Penduduk Beit Dhu’d, sebuah tempat dekat Athafit yang berada di bawah kekuasaan Al-Da’am bin Ibrahim, datang kepada Al-Hadi di Athafit untuk mengadu tentang apa yang terjadi di negeri mereka akibat ulah tentara Al-Da’am, yang oleh perawi digambarkan sebagai orang-orang yang tidak bermoral. Mereka mengklaim bahwa seorang tentara telah mengambil seorang budak perempuan secara paksa dan membunuh ayahnya, dan Al-Da’am tidak keberatan. Maka Al-Hadi mengutus seorang pria dari kalangan sepupunya, keturunan Umar bin Ali, dan pria itu mengusir para penguasa Al-Da’am serta memerintahkan kebaikan dan melarang keburukan, dan Sa’sa’ah bin Ja’far dari Rida berbaiat kepadanya."
