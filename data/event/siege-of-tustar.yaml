id: event/siege-of-tustar
class: event
kind: conquest
label: { ar: "حصار تستر", en: "Siege of Tustar" }
summary:
  ar: "سار أبو موسى إلى تستر وبها شوكة العدو وحدهم فكتب إلى عمر يستمده فكتب عمر إلى عمار بن ياسر يأمره بالمسير إليه في أهل الكوفة فقدم عمار جرير بن عبد الله البجلي وسار حتى أتى تستر وعلى ميمنة أبي موسى البراء بن مالك أخو أنس بن مالك وعلى ميسرته مجزأة بن ثور السدوسي وعلى الخيل أنس بن مالك وعلى ميمنة عمار البراء بن عازب الأنصاري وعلى ميسرته حذيفة بن اليمان العبسي وعلى خيله قرظة بن كعب الأنصاري وعلى رجالته النعمان بن مقرن المزني فقاتلهم أهل تستر قتالاً شديداً وحمل أهل البصرة وأهل الكوفة حتى بلغوا باب تستر فضاربهم البراء بن مالك على الباب حتى استشهد ودخل الهرمزان."
  en: "Abu Musa marched on Tustar, the enemy's strength and edge — and wrote Umar for aid; Umar ordered Ammar ibn Yasir out of Kufa, putting Jarir ibn Abdallah al-Bajali first. The wings: Abu Musa's right al-Bara' ibn Malik, Anas's brother; left Majza'a ibn Thawr al-Sadusi; horse Anas ibn Malik — Ammar's right al-Bara' ibn Azib, left Hudhayfa ibn al-Yaman, horse Qaraza ibn Ka'b, foot al-Nu'man ibn Muqarrin al-Muzani. The fighting ran to Tustar's gate where al-Bara' ibn Malik fought till martyred, and Hurmuzan went in."
