id: event/death-of-yazdgard
class: event
kind: death
label: { ar: "مقتل يزدجرد بن شهريار", en: "The Death of Yazdgard ibn Shahriyar", es: "La muerte de Yazdgard ibn Shahriyar", fr: "La mort de Yazdgard ibn Shahriyar", ur: "یزدگرد ابن شہریار کی وفات", tr: "Şahriyar'ın oğlu Yazdegerd'in öldürülmesi", id: "Pembunuhan Yazdegerd putra Shahriyar" }
summary:
  ar: "عند البلاذري: هرب يزدجرد بن شهريار بن كسرى أبرويز بن هرمز بن أنوشروان من المدائن إلى حلوان ثم إلى أصبهان فلما فرغ المسلمون من أمر نهاوند هرب من أصبهان إلى إصطخر فتوجه عبد الله بن بديل بعد فتح أصبهان لاتباعه فلم يقدر عليه ووافى أبو موسى الأشعري إصطخر فرام فتحها فلم يمكنه ذلك وعاناها عثمان بن أبي العاص فلم يقدر عليها وقدم عبد الله بن عامر البصرة سنة 29 وقد افتتحت فارس كلها إلا إصطخر وجور وهم يزدجرد بأن يأتي طبرستان وذلك أن مرزبانها عرض عليه وهو بأصبهان أن يأتيها وأخبره بحصانتها ثم بدا له فهرب إلى كرمان واتبعه ابن عامر مجاشع بن مسعود السلمي وهرم بن حيان العبدي فمضى مجاشع فنزل بيمند من كرمان فأصاب الناس الدمق فهلك جيشه فلم ينج إلا القليل فسمي القصر قصر مجاشع وانصرف مجاشع إلى ابن عامر وكان يزدجرد جلس ذات يوم بكرمان فدخل عليه مرزبانها فلم يكلمه تيهاً فأمر بجر رجله وقال ما أنت بأهل لولاية قرية فضلاً عن الملك ولو علم الله فيك خيراً ما صيرك إلى هذه الحال فمضى إلى سجستان فأكرمه ملكه وأعظمه فلما مضت عليه أيام سأله عن الخراج فتنكر له فلما رأى يزدجرد ذلك سار إلى خراسان فلما صار إلى حد مرو تلقاه ماهويه مرزبانها معظماً مبجلاً وقدم عليه نيزك طرخان فحمله وخلع عليه وأكرمه فأقام نيزك عنده شهراً ثم شخص وكتب إليه يخطب ابنته فأحفظ ذلك يزدجرد وقال اكتبوا إليه إنما أنت عبد من عبيدي فما جرأك على أن تخطب إلي وأمر بمحاسبة ماهويه مرزبان مرو وسأله عن الأموال فكتب ماهويه إلى نيزك يحرضه عليه ويقول هذا الذي قدم مفلولاً طريداً فمنت عليه ليرد عليه ملكه فكتب إليك بما كتب به ثم تضافرا على قتله وأقبل نيزك في الأتراك حتى نزل الجنابذ فحاربوه فتكافأ الترك ثم عادت الدائرة عليه فقتل أصحابه ونهب عسكره فأتى مدينة مرو فلم يفتح له فنزل عن دابته ومشى حتى دخل بيت طحان على الرغاب ويقال إن ماهويه بعث إليه رسله حين بلغه خبره فقتلوه في بيت الطحان ويقال إنه دس إلى الطحان فأمره بقتله فقتله ثم قال ما ينبغي لقاتل ملك أن يعيش فأمر بالطحان فقتل ويقال إن الطحان قدم له طعاماً وأتاه بشراب فسكر فلما كان المساء أخرج تاجه فوضعه على رأسه فبصر به الطحان فطمع فيه فعمد إلى رحى فألقاها عليه فلما قتل أخذ تاجه وثيابه وألقاه في الماء ثم عرف ماهويه خبره فقتل الطحان وأهل بيته وأخذ التاج والثياب ويقال إن يزدجرد نذر بوسل ماهويه فهرب ونزل الماء فطلب من الطحان فقال قد خرج من بيتي فوجدوه في الماء فقال خلوا عني أعطكم منطقتي وخاتمي وتاجي فتغيبوا عنه وسألهم شيئاً يأكل به خبزاً فأعطاه بعضهم أربعة دراهم فضحك وقال لقد قيل لي إنك ستحتاج إلى أربعة دراهم ثم إنه هجم عليه بعد ذلك قوم وجههم ماهويه لطلبه فقال لا تقتلوني واحملوني إلى ملك العرب أصالحه عني وعنكم فتأمنوا فأبوا ذلك وخنقوه بوتر ثم أخذوا ثيابه فجعلت في جراب وألقوا جثته في الماء ووقع فيروز بن يزدجرد فيما يزعمون إلى الترك فزوجوه وأقام عندهم."
  en: "In al-Baladhuri: Yazdgard ibn Shahriyar ibn Kisra Abarwiz ibn Hurmuz ibn Anushirwan fled al-Mada'in to Hulwan, then Isbahan, then — after Nihawand — Istakhr; Ibn Budayl pursued without catching him, Abu Musa tried Istakhr and could not take it, and Uthman ibn Abi al-As failed likewise, so that when Abdallah ibn Amir reached Basra in year 29 all Fars was conquered save Istakhr and Jur. Yazdgard meant for Tabaristan — its marzban having offered its strength — then fled to Kirman; Ibn Amir sent Mujashi' ibn Mas'ud al-Sulami and Harm ibn Hayyan after him, but the damaq struck his camp at Bimandh, destroying the army save a few — the fort named Qasr Mujashi'. Yazdgard, seated at Kirman, would not speak to its marzban for hauteur and had his leg dragged — 'you are not fit to govern a village, let alone a kingdom; had God known good in you He would not have brought you to this' — then went to Sijistan whose king honored him until, asked for kharaj, he feigned deafness, and moved on to Khurasan. At Marw's border the marzban Mahuwayh received him with honor, and Nizak Tarkhan lodged and robed him a month — then wrote asking his daughter in marriage; enraged, Yazdgard answered 'you are but my slave — what emboldens you?' and ordered Mahuwayh's accounts audited. Mahuwayh wrote Nizak inciting him: 'he came beaten and fugitive, you honored him, and this is his answer' — and together they moved to kill him. Nizak came with the Turks to al-Janabidh; the fight held even then turned — his companions were slain and camp plundered. Marw's city refused him entry; he dismounted and walked to a miller's house on the Arghab. It is said Mahuwayh's men slew him there; or he incited the miller, killed him, then had the miller killed since 'a king's slayer should not live'; or the miller fed him, plied him drink till drunken, spied his crown at evening, coveted it, and dropped a millstone on him — taking crown and robes and casting him in the water, whereupon Mahuwayh killed the miller and household; or, hiding in the water he bargained 'release me for my belt, seal and crown,' laughed when told bread cost four dirhams — 'I was told I would need four dirhams' — and when Mahuwayh's seekers came begged 'do not kill me; take me to the Arabs' king to treat for myself and you' — refused, they strangled him with a bowstring, sacked his clothes and cast his body in the water. His son Firuz fell to the Turks, it is said, who married him off among them."
  es: "En al-Baladhuri: Yazdgard ibn Shahriyar ibn Kisra Abarwiz ibn Hurmuz ibn Anushirwan huyó de al-Mada'in a Hulwan, luego a Isbahan, luego —después de Nihawand— a Istakhr; Ibn Budayl lo persiguió sin alcanzarlo, Abu Musa intentó tomar Istakhr y no pudo, y Uthman ibn Abi al-As fracasó igualmente, de modo que cuando Abdallah ibn Amir llegó a Basora en el año 29 todo Fars estaba conquistado excepto Istakhr y Jur. Yazdgard se dirigió a Tabaristán —su marzban había ofrecido su fuerza— luego huyó a Kirman; Ibn Amir envió a Mujashi' ibn Mas'ud al-Sulami y Harm ibn Hayyan tras él, pero el damaq atacó su campamento en Bimandh, destruyendo al ejército excepto a unos pocos —el fuerte llamado Qasr Mujashi'. Yazdgard, sentado en Kirman, no quiso hablar con su marzban por altivez y lo hizo arrastrar la pierna: «No eres apto para gobernar una aldea, y mucho menos un reino; si Dios hubiera conocido la bondad en ti, no te habría traído a esto». Luego fue a Sijistan, cuyo rey lo honró hasta que, al pedirle kharaj, fingió sordera y se trasladó a Jorasán. En la frontera de Marw, el marzban Mahuwayh lo recibió con honores, y Nizak Tarkhan lo hospedó y lo vistió durante un mes; luego escribió pidiendo la mano de su hija en matrimonio; enfurecido, Yazdgard respondió: «No eres más que mi esclavo, ¿qué te envalentona?» y ordenó que se auditaran las cuentas de Mahuwayh. Mahuwayh escribió a Nizak incitándolo: «Llegó golpeado y fugitivo, lo honraste, y esta es su respuesta»; y juntos se dispusieron a matarlo. Nizak llegó con los turcos a al-Janabidh; La lucha continuó incluso entonces cambió: sus compañeros fueron asesinados y el campamento saqueado. La ciudad de Marw le negó la entrada; desmontó y caminó hasta la casa de un molinero en el Arghab. Se dice que los hombres de Mahuwayh lo mataron allí; o él incitó al molinero, lo mató, y luego hizo matar al molinero ya que 'un asesino de rey no debe vivir'; o el molinero lo alimentó, lo emborrachó, vio su corona al atardecer, la codició y le dejó caer una piedra de molino encima, tomando la corona y las vestiduras y arrojándolo al agua, tras lo cual Mahuwayh mató al molinero y a su familia; o, escondido en el agua negoció 'libérame por mi cinturón, sello y corona', se rió cuando le dijeron que el pan costaba cuatro dirhams - 'me dijeron que necesitaría cuatro dirhams' - y cuando llegaron los buscadores de Mahuwayh suplicó 'no me maten; «Llévenme ante el rey de los árabes para que me ayude a mí y a ustedes». Al negarse, lo estrangularon con la cuerda de un arco, le robaron la ropa y arrojaron su cuerpo al agua. Se dice que su hijo Firuz cayó en manos de los turcos, quienes lo casaron con una de ellos."
  fr: "Dans al-Baladhuri: Yazdgard ibn Shahriyar ibn Kisra Abarwiz ibn Hurmuz ibn Anushirwan s’enfuit d’al-Mada’in vers Hulwan, puis Isbahan, puis – après Nihawand – Istakhr; Ibn Budayl le poursuivit sans succès, Abu Musa tenta de prendre Istakhr sans y parvenir, et Uthman ibn Abi al-As échoua également. Ainsi, lorsqu’Abdallah ibn Amir atteignit Bassora en l’an 29, tout le Fars était conquis, à l’exception d’Istakhr et de Jur. Yazdgard se dirigea vers le Tabaristan – son marzban lui ayant offert sa protection – puis s’enfuit vers Kirman; Ibn Amir envoya Mujashi’ ibn Mas’ud al-Sulami et Harm ibn Hayyan à sa poursuite, mais les damaq attaquèrent son camp à Bimandh, anéantissant l’armée à l’exception de quelques hommes – le fort nommé Qasr Mujashi’. Yazdgard, installé à Kirman, refusa de parler à son marzban par arrogance et se fit traîner par la jambe: « Tu n'es même pas digne de gouverner un village, encore moins un royaume ! Si Dieu te connaissait, il ne t'aurait pas conduit jusqu'ici. » Il se rendit ensuite au Sijistan, dont le roi l'honora jusqu'à ce que, lorsqu'il demanda le kharaj, il feigne la surdité et poursuive sa route vers le Khorasan. À la frontière de Marw, le marzban Mahuwayh le reçut avec honneur, et Nizak Tarkhan l'hébergea et le revêtit d'un vêtement pendant un mois. Puis, il écrivit pour demander sa fille en mariage. Furieux, Yazdgard répondit: « Tu n'es que mon esclave ! Qu'est-ce qui t'ose ? » et ordonna que les comptes de Mahuwayh soient vérifiés. Mahuwayh écrivit à Nizak pour l'inciter: « Il est arrivé battu et fugitif, tu l'as honoré, et voilà sa réponse ! » Et ensemble, ils complotèrent pour le tuer. Nizak arriva avec les Turcs à al-Janabidh. Le combat se poursuivit malgré tout, mais tourna mal: ses compagnons furent tués et son camp pillé. La ville de Marw lui refusa l'entrée; il descendit de cheval et se rendit à pied chez un meunier sur l'Arghab. On raconte que les hommes de Mahuwayh l'y tuèrent; ou bien il incita le meunier à la mort, le tua, puis le fit tuer car « le meurtrier d'un roi ne doit pas vivre »; ou encore le meunier le nourrit, l'enivra, aperçut sa couronne le soir venu, la convoita et laissa tomber une meule sur lui, s'emparant de sa couronne et de ses vêtements et le jetant à l'eau, après quoi Mahuwayh tua le meunier et sa famille; ou bien, caché dans l'eau, il marchanda « libérez-moi contre ma ceinture, mon sceau et ma couronne », rit lorsqu'on lui dit que le pain coûtait quatre dirhams – « On m'a dit qu'il me faudrait quatre dirhams » – et lorsque les poursuivants de Mahuwayh arrivèrent, il implora « ne me tuez pas ». « Conduisez-moi auprès du roi des Arabes pour négocier pour vous et moi », dit-il. Il refusa; ils l’étranglèrent avec une corde d’arc, dépouillèrent ses vêtements et jetèrent son corps à l’eau. Son fils Firuz, dit-on, tomba aux mains des Turcs, qui le marièrent à l’une d’entre eux."
  ur: "البلادوری میں ہے: یزدگرد ابن شہریار ابن کسرہ ابرویز ابن ہرمز ابن انوشیروان مدعین سے حلوان کی طرف بھاگا، پھر اسبہان، پھر — نہاوند کے بعد — استخار؛ ابن بدیل نے اسے پکڑے بغیر تعاقب کیا، ابو موسیٰ نے استخارہ کرنے کی کوشش کی اور اسے نہ لے سکے، اور عثمان بن ابی العاص بھی اسی طرح ناکام رہے، چنانچہ جب عبداللہ بن عامر 29 میں بصرہ پہنچے تو تمام فارس فتح ہو گیا سوائے استخار اور جر کے۔ یزدگرد کا مطلب طبرستان تھا - اس کے مرزبان نے اپنی طاقت پیش کی - پھر کرمان کی طرف بھاگ گیا۔ ابن عامر نے مجاشی ابن مسعود السلمی اور حرم بن حیان کو اس کے بعد بھیجا، لیکن دمق نے بمند کے مقام پر اس کے کیمپ پر حملہ کیا، جس سے چند افراد کو چھوڑ کر فوج تباہ ہوگئی - قصر مجاشی نام کا قلعہ۔ کرمان میں بیٹھا ہوا یزدگرد اپنے مرزبان سے ہوٹر کے لیے بات نہیں کرتا تھا اور اس کی ٹانگ گھسیٹتا تھا - 'تم گاؤں پر حکومت کرنے کے قابل نہیں ہو، ایک بادشاہی کو چھوڑ دو۔ اگر خدا کو تم میں بھلائی معلوم ہوتی تو وہ تمہیں یہاں تک نہ لاتا'' - پھر سجستان گئے جس کے بادشاہ نے اس کی عزت کی یہاں تک کہ خرج طلب کی، اس نے بہرے پن کا بہانہ کیا اور خراسان چلا گیا۔ مرو کی سرحد پر مرزبن مہویہ نے اس کا احترام کے ساتھ استقبال کیا، اور نزاق ترکھان نے اسے ایک مہینہ تک گھر میں رکھا اور لوٹا - پھر لکھا کہ اپنی بیٹی سے شادی کرنا چاہیں؛ غصے میں آکر یزدگرد نے جواب دیا 'تم میرے غلام ہو، تمہیں کیا حوصلہ دیتا ہے؟' اور مہویہ کے اکاؤنٹس کے آڈٹ کا حکم دیا۔ مہویہ نے نزاک کو اکسانے کے لیے لکھا: 'وہ مارا پیٹا اور فرار ہو گیا، تم نے اس کی عزت کی، اور یہ اس کا جواب ہے' - اور وہ مل کر اسے مارنے کے لیے آگے بڑھے۔ نزاک ترکوں کے ساتھ الجنابد آیا۔ لڑائی پھر بھی بدل گئی - اس کے ساتھی مارے گئے اور کیمپ لوٹ لیا گیا۔ مرو کے شہر نے اسے داخلے سے منع کر دیا۔ وہ اترا اور ارغاب پر ایک ملر کے گھر چلا گیا۔ کہا جاتا ہے کہ مہویہ کے آدمیوں نے اسے وہیں قتل کر دیا۔ یا اس نے ملر کو اکسایا، اسے مار ڈالا، پھر ملر کو مار ڈالا کیونکہ 'بادشاہ کے قاتل کو زندہ نہیں رہنا چاہئے'؛ یا ملر نے اسے کھلایا، شرابی ہونے تک اسے پلایا، شام کو اس کے تاج کی جاسوسی کی، اس کی لالچ میں، اور اس پر چکی کا پتھر گرایا - تاج اور لباس لے کر اسے پانی میں ڈال دیا، جس کے بعد مہویہ نے ملر اور گھر والوں کو قتل کر دیا۔ یا، پانی میں چھپ کر اس نے سودا کیا کہ 'میری بیلٹ، مہر اور تاج کے لیے مجھے چھوڑ دو،' جب روٹی کی قیمت چار درہم بتائی گئی تو ہنس پڑا - 'مجھے بتایا گیا کہ مجھے چار درہم درکار ہوں گے' - اور جب مہویہ کے متلاشیوں نے التجا کی کہ 'مجھے مت مارو'۔ مجھے عربوں کے بادشاہ کے پاس لے چلو کہ میں اپنا اور تمہارا علاج کروں۔‘‘ انکار کرنے پر انہوں نے کمان سے اس کا گلا گھونٹ دیا، اس کے کپڑے توڑ دیے اور اس کی لاش کو پانی میں پھینک دیا۔ کہا جاتا ہے کہ اس کا بیٹا فیروز ترکوں سے جا پڑا جس نے ان کے درمیان اس کی شادی کر دی۔"
  tr: "El-Baladhuri'ye göre: Şahriyar'ın oğlu, Hüsrü Parviz'in oğlu, Hormizd'in oğlu, Anuşirvan'ın oğlu Yazdegerd, Ktesifon'dan Hulvan'a, oradan da İsfahan'a kaçtı. Müslümanlar Nahavand'ı ele geçirdikten sonra İsfahan'dan İstakhr'a kaçtı. İsfahan'ın fethinden sonra Abdullah ibn Budayl onu takip etti ama yakalayamadı. Ebu Musa el-Eş'ari İstakhr'a geldi ve şehri fethetmeye çalıştı ama başaramadı. Osman ibn Abi el-As da şehri fethetmeye çalıştı ama başaramadı. Abdullah ibn Amir Hicri 29 yılında Basra'ya geldi. İstakhr ve Jur hariç Fars'ın tamamı fethedilmişti. Yazdegerd, İsfahan'dayken valisinin kendisine gitme fırsatı sunması ve güçlü savunmalarından bahsetmesi üzerine Tabaristan'a gitmeyi düşünüyordu. Sonra fikrini değiştirdi ve Kerman'a kaçtı. İbn Amir, Mücaşi' ibn Mes'ud el-Sulami ve Haram ibn Hayyan el-Abdi onu takip etti. Mücaşi' Kerman'daki Yamand'da kamp kurdu; orada halk veba salgınına yakalandı ve ordusu yok oldu, sadece birkaç kişi hayatta kaldı. Kampın adı Kasr Mücaşi' (Mücaşi'nin Sarayı) olarak konuldu. Mücaşi' İbn Amir'e geri döndü. Yazdegerd bir gün Kerman'da otururken, vali yanına geldi, ancak Yazdegerd kibirinden dolayı onunla konuşmadı. Bunun üzerine Yazdegerd onu bacağından sürükleyerek, \"Sen bir köyü yönetmeye bile layık değilsin, kral olmaya hiç layık değilsin. Eğer Allah sende bir iyilik bilseydi, seni bu duruma düşürmezdi\" dedi. Bunun üzerine Yazdegerd Sistan'a gitti; orada kral onu onurlandırdı ve saygı gösterdi. Birkaç gün sonra, kral ona haraç hakkında sordu, ancak Yazdegerd bunu reddetti. Yazdegerd bunu görünce Horasan'a yürüdü. Merv sınırlarına ulaştığında, valisi Mahuyeh onu büyük bir onur ve saygıyla karşıladı. Nizak Tarkhan onun huzuruna getirildi ve Yazdegerd onu taşıdı, ona onur elbiseleri giydirdi ve ona büyük bir saygı gösterdi. Nizak bir ay onunla kaldı, sonra ayrıldı ve ona kızının elini istemek için bir mektup yazdı. Bu Yazdegerd'i öfkelendirdi ve şöyle dedi: \"Ona yaz: Sen benim kölelerimden birisin. Kızımın elini istemeye nasıl cüret edersin?\" Merv valisi Mahuyeh'den hesap sormasını istedi ve onu paralar hakkında sorguladı. Mahuyeh, Nizak'a onu kışkırtarak şöyle yazdı: \"Bu, yenilmiş ve sürgün edilmiş olarak gelen kişidir. Krallığını geri kazanması için ona merhamet gösterdiniz ve o da size yazdıklarıyla karşılık verdi.\" Sonra onu öldürmek için komplo kurdular ve Nizak Türklerle birlikte Janabidh'e kadar ilerledi ve orada onunla savaştılar. Türkler ona denk güçteydi, ama sonra işler tersine döndü. Arkadaşları öldürüldü ve ordusu yağmalandı. Merv şehrine geldi, ama şehir ona açılmadı. Atından indi ve tepedeki bir değirmencinin evine girene kadar yürüdü. Rivayete göre, Mahuyah onun hakkında haber aldığında ona haberciler gönderdi ve onu değirmencinin evinde öldürdüler. Ayrıca, gizlice değirmenciye onu öldürmesini emrettiği ve değirmencinin de bunu yaptığı söylenir. Sonra, \"Bir kralın katili yaşamamalı\" dedi ve değirmencinin öldürülmesini emretti. Rivayete göre, değirmenci ona yemek ve içki ikram etti ve o da sarhoş oldu. Akşam olunca tacını çıkarıp başına koydu. Değirmenci onu gördü ve ona göz dikti, bu yüzden bir değirmen taşı alıp üzerine fırlattı. Değirmenci öldürüldüğünde, tacını ve elbiselerini alıp onu suya attı. Sonra Mahuyah bunu öğrendi ve değirmenciyi ve ailesini öldürüp tacı ve elbiseleri aldı. Rivayete göre Yazdegerd, Mahuyah'ı öldürmeye yemin etmiş ve bu yüzden kaçarak suya inmiş. Değirmenciye sormuş, değirmenci de \"Evimden ayrıldı\" demiş. Onu suda bulmuşlar. Yazdegerd, \"Beni rahat bırakın. Size kemerimi, yüzüğümü ve tacımı vereceğim\" demiş. Onlar yanından kaybolmuşlar ve Yazdegerd onlardan yiyecek bir şeyler istemiş. Yanında ekmek olduğu için bazıları ona dört dirhem vermiş. Yazdegerd gülerek, \"Size dört dirhem gerekeceği söylenmişti\" demiş. Sonra Mahuyeh tarafından onu bulmak için gönderilen bir grup insan ona saldırmış. Yazdegerd, \"Beni öldürmeyin, beni Arapların kralına götürün ki, hem benim hem de sizin adınıza onunla barış yapayım ve siz güvende olasınız\" demiş. Ama onlar reddetmiş ve onu bir iple boğmuşlar. Sonra elbiselerini alıp bir torbaya koymuşlar ve cesedini suya atmışlar. İddialarına göre Firuz bin Yazdegerd Türklerin eline düştü, bu yüzden onu evlendirdiler ve o da onlarla kaldı."
  id: "Menurut al-Baladhuri: Yazdegerd, putra Shahriyar, putra Khosrow Parviz, putra Hormizd, putra Anushirvan, melarikan diri dari Ctesiphon ke Hulwan, kemudian ke Isfahan. Setelah kaum Muslimin menaklukkan Nahavand, ia melarikan diri dari Isfahan ke Istakhr. Abdullah ibn Budayl mengejarnya setelah penaklukan Isfahan tetapi tidak berhasil menangkapnya. Abu Musa al-Ash'ari tiba di Istakhr dan berusaha menaklukkannya, tetapi ia gagal. Uthman ibn Abi al-As juga mencoba menaklukkannya tetapi gagal. Abdullah ibn Amir tiba di Basra pada tahun 29 Hijriah. Seluruh Fars telah ditaklukkan kecuali Istakhr dan Jur. Yazdegerd bermaksud pergi ke Tabaristan karena gubernurnya telah menawarkannya kesempatan untuk pergi ke sana saat ia berada di Isfahan dan menceritakan tentang pertahanannya yang kuat. Kemudian ia berubah pikiran dan melarikan diri ke Kerman. Ibn Amir, Mujashi' ibn Mas'ud al-Sulami, dan Haram ibn Hayyan al-Abdi mengikutinya. Mujashi' pergi dan berkemah di Yamand di Kerman, di mana penduduknya dilanda wabah penyakit, dan pasukannya binasa, hanya sedikit yang selamat. Perkemahan itu diberi nama Qasr Mujashi' (Istana Mujashi). Mujashi' kembali kepada Ibn Amir. Suatu hari Yazdegerd sedang duduk di Kerman, gubernurnya datang menemuinya, tetapi ia tidak berbicara kepadanya karena kesombongan. Maka gubernur memerintahkan agar ia diseret kakinya dan berkata, “Kau tidak layak memerintah bahkan sebuah desa, apalagi menjadi raja. Jika Allah mengetahui kebaikan dalam dirimu, Dia tidak akan membawamu ke keadaan ini.” Maka ia pergi ke Sistan, di mana raja menghormati dan memujanya. Setelah beberapa hari, raja menanyakan tentang upeti, tetapi ia menyangkalnya. Ketika Yazdegerd melihat ini, ia berbaris ke Khorasan. Ketika ia sampai di perbatasan Merv, Mahuyeh, gubernurnya, menerimanya dengan penuh hormat dan penghargaan. Nizak Tarkhan dibawa ke hadapannya, dan Yazdegerd menggendongnya, memberinya jubah kehormatan, dan memperlakukannya dengan sangat hormat. Nizak tinggal bersamanya selama sebulan, kemudian pergi dan menulis surat kepadanya meminta tangan putrinya untuk dinikahi. Hal ini membuat Yazdegerd marah, dan ia berkata, “Tulislah surat kepadanya: Kau hanyalah salah satu budakku. Beraninya kau meminta tangan putriku?” Ia memerintahkan Mahuyeh, gubernur Merv, untuk melakukan perhitungan dan menanyainya tentang dana tersebut. Mahuyeh menulis surat kepada Nizak, menghasutnya untuk melawannya, dengan mengatakan, “Inilah orang yang datang dalam keadaan kalah dan diasingkan. Kau menunjukkan belas kasihan kepadanya agar ia dapat merebut kembali kerajaannya, dan ia menulis surat kepadamu dengan apa yang telah ditulisnya.” Kemudian mereka bersekongkol untuk membunuhnya, dan Nizak maju bersama orang-orang Turki sampai ia mencapai Janabidh, di mana mereka melawannya. Pasukan Turki seimbang, tetapi kemudian keadaan berbalik melawannya. Para pengikutnya terbunuh, dan pasukannya dijarah. Ia sampai di kota Merv, tetapi kota itu tidak dibuka untuknya. Ia turun dari kudanya dan berjalan sampai ia memasuki rumah seorang penggiling gandum di atas bukit. Dikatakan bahwa Mahuyah mengirim utusan kepadanya ketika berita tentang dirinya sampai kepadanya, dan mereka membunuhnya di rumah penggiling gandum itu. Dikatakan juga bahwa ia secara diam-diam memerintahkan penggiling gandum itu untuk membunuhnya, dan penggiling gandum itu melakukannya. Kemudian ia berkata, \"Seorang pembunuh raja tidak boleh hidup,\" dan ia memerintahkan agar penggiling gandum itu dibunuh. Dikatakan bahwa penggiling gandum itu menawarkannya makanan dan minuman, dan ia menjadi mabuk. Ketika malam tiba, ia mengeluarkan mahkotanya dan meletakkannya di kepalanya. Penggiling gandum itu melihatnya dan menginginkannya, jadi ia mengambil batu penggiling dan melemparkannya ke atasnya. Ketika ia terbunuh, ia mengambil mahkota dan pakaiannya dan melemparkannya ke dalam air. Kemudian Mahuyah mengetahui hal ini dan membunuh penggiling gandum dan keluarganya serta mengambil mahkota dan pakaiannya. Dikatakan bahwa Yazdegerd bersumpah akan membunuh Mahuyah, sehingga ia melarikan diri dan pergi ke tepi air. Ia bertanya kepada tukang giling, yang berkata, \"Ia telah meninggalkan rumahku.\" Mereka menemukannya di dalam air. Ia berkata, \"Tinggalkan aku sendiri. Aku akan memberikan ikat pinggangku, cincinku, dan mahkotaku.\" Mereka menghilang darinya, dan ia meminta mereka untuk makan. Ia membawa roti, sehingga beberapa dari mereka memberinya empat dirham. Ia tertawa dan berkata, \"Aku sudah diberitahu bahwa kalian akan membutuhkan empat dirham.\" Kemudian, setelah itu, sekelompok orang menyerangnya, yang dikirim oleh Mahuyeh untuk mencarinya. Ia berkata, \"Jangan bunuh aku, tetapi bawalah aku kepada raja Arab agar aku dapat berdamai dengannya atas namaku dan atas nama kalian, dan kalian akan selamat.\" Tetapi mereka menolak dan mencekiknya dengan tali. Kemudian mereka mengambil pakaiannya dan memasukkannya ke dalam karung lalu membuang tubuhnya ke dalam air. Dan Firuz bin Yazdegerd, seperti yang mereka klaim, jatuh ke tangan orang Turki, jadi mereka menikahkan dia dan dia tinggal bersama mereka."
