label: { ar: "مقتل يزدجرد بن شهريار", en: "The Death of Yazdgard ibn Shahriyar" }
summary:
  ar: "عند البلاذري: هرب يزدجرد بن شهريار بن كسرى أبرويز بن هرمز بن أنوشروان من المدائن إلى حلوان ثم إلى أصبهان فلما فرغ المسلمون من أمر نهاوند هرب من أصبهان إلى إصطخر فتوجه عبد الله بن بديل بعد فتح أصبهان لاتباعه فلم يقدر عليه ووافى أبو موسى الأشعري إصطخر فرام فتحها فلم يمكنه ذلك وعاناها عثمان بن أبي العاص فلم يقدر عليها وقدم عبد الله بن عامر البصرة سنة 29 وقد افتتحت فارس كلها إلا إصطخر وجور وهم يزدجرد بأن يأتي طبرستان وذلك أن مرزبانها عرض عليه وهو بأصبهان أن يأتيها وأخبره بحصانتها ثم بدا له فهرب إلى كرمان واتبعه ابن عامر مجاشع بن مسعود السلمي وهرم بن حيان العبدي فمضى مجاشع فنزل بيمند من كرمان فأصاب الناس الدمق فهلك جيشه فلم ينج إلا القليل فسمي القصر قصر مجاشع وانصرف مجاشع إلى ابن عامر وكان يزدجرد جلس ذات يوم بكرمان فدخل عليه مرزبانها فلم يكلمه تيهاً فأمر بجر رجله وقال ما أنت بأهل لولاية قرية فضلاً عن الملك ولو علم الله فيك خيراً ما صيرك إلى هذه الحال فمضى إلى سجستان فأكرمه ملكه وأعظمه فلما مضت عليه أيام سأله عن الخراج فتنكر له فلما رأى يزدجرد ذلك سار إلى خراسان فلما صار إلى حد مرو تلقاه ماهويه مرزبانها معظماً مبجلاً وقدم عليه نيزك طرخان فحمله وخلع عليه وأكرمه فأقام نيزك عنده شهراً ثم شخص وكتب إليه يخطب ابنته فأحفظ ذلك يزدجرد وقال اكتبوا إليه إنما أنت عبد من عبيدي فما جرأك على أن تخطب إلي وأمر بمحاسبة ماهويه مرزبان مرو وسأله عن الأموال فكتب ماهويه إلى نيزك يحرضه عليه ويقول هذا الذي قدم مفلولاً طريداً فمنت عليه ليرد عليه ملكه فكتب إليك بما كتب به ثم تضافرا على قتله وأقبل نيزك في الأتراك حتى نزل الجنابذ فحاربوه فتكافأ الترك ثم عادت الدائرة عليه فقتل أصحابه ونهب عسكره فأتى مدينة مرو فلم يفتح له فنزل عن دابته ومشى حتى دخل بيت طحان على الرغاب ويقال إن ماهويه بعث إليه رسله حين بلغه خبره فقتلوه في بيت الطحان ويقال إنه دس إلى الطحان فأمره بقتله فقتله ثم قال ما ينبغي لقاتل ملك أن يعيش فأمر بالطحان فقتل ويقال إن الطحان قدم له طعاماً وأتاه بشراب فسكر فلما كان المساء أخرج تاجه فوضعه على رأسه فبصر به الطحان فطمع فيه فعمد إلى رحى فألقاها عليه فلما قتل أخذ تاجه وثيابه وألقاه في الماء ثم عرف ماهويه خبره فقتل الطحان وأهل بيته وأخذ التاج والثياب ويقال إن يزدجرد نذر بوسل ماهويه فهرب ونزل الماء فطلب من الطحان فقال قد خرج من بيتي فوجدوه في الماء فقال خلوا عني أعطكم منطقتي وخاتمي وتاجي فتغيبوا عنه وسألهم شيئاً يأكل به خبزاً فأعطاه بعضهم أربعة دراهم فضحك وقال لقد قيل لي إنك ستحتاج إلى أربعة دراهم ثم إنه هجم عليه بعد ذلك قوم وجههم ماهويه لطلبه فقال لا تقتلوني واحملوني إلى ملك العرب أصالحه عني وعنكم فتأمنوا فأبوا ذلك وخنقوه بوتر ثم أخذوا ثيابه فجعلت في جراب وألقوا جثته في الماء ووقع فيروز بن يزدجرد فيما يزعمون إلى الترك فزوجوه وأقام عندهم."
  en: "In al-Baladhuri: Yazdgard ibn Shahriyar ibn Kisra Abarwiz ibn Hurmuz ibn Anushirwan fled al-Mada'in to Hulwan, then Isbahan, then — after Nihawand — Istakhr; Ibn Budayl pursued without catching him, Abu Musa tried Istakhr and could not take it, and Uthman ibn Abi al-As failed likewise, so that when Abdallah ibn Amir reached Basra in year 29 all Fars was conquered save Istakhr and Jur. Yazdgard meant for Tabaristan — its marzban having offered its strength — then fled to Kirman; Ibn Amir sent Mujashi' ibn Mas'ud al-Sulami and Harm ibn Hayyan after him, but the damaq struck his camp at Bimandh, destroying the army save a few — the fort named Qasr Mujashi'. Yazdgard, seated at Kirman, would not speak to its marzban for hauteur and had his leg dragged — 'you are not fit to govern a village, let alone a kingdom; had God known good in you He would not have brought you to this' — then went to Sijistan whose king honored him until, asked for kharaj, he feigned deafness, and moved on to Khurasan. At Marw's border the marzban Mahuwayh received him with honor, and Nizak Tarkhan lodged and robed him a month — then wrote asking his daughter in marriage; enraged, Yazdgard answered 'you are but my slave — what emboldens you?' and ordered Mahuwayh's accounts audited. Mahuwayh wrote Nizak inciting him: 'he came beaten and fugitive, you honored him, and this is his answer' — and together they moved to kill him. Nizak came with the Turks to al-Janabidh; the fight held even then turned — his companions were slain and camp plundered. Marw's city refused him entry; he dismounted and walked to a miller's house on the Arghab. It is said Mahuwayh's men slew him there; or he incited the miller, killed him, then had the miller killed since 'a king's slayer should not live'; or the miller fed him, plied him drink till drunken, spied his crown at evening, coveted it, and dropped a millstone on him — taking crown and robes and casting him in the water, whereupon Mahuwayh killed the miller and household; or, hiding in the water he bargained 'release me for my belt, seal and crown,' laughed when told bread cost four dirhams — 'I was told I would need four dirhams' — and when Mahuwayh's seekers came begged 'do not kill me; take me to the Arabs' king to treat for myself and you' — refused, they strangled him with a bowstring, sacked his clothes and cast his body in the water. His son Firuz fell to the Turks, it is said, who married him off among them."
