label: { ar: "سقوط دمشق بيد أتسز", en: "Fall of Damascus to Atsiz", es: "Caída de Damasco a Atsiz", fr: "Chute de Damas aux mains d'Atsiz", ur: "دمشق سے عتزیز کا زوال", tr: "Şam'ın Atsezi'nin eliyle düşüşü", id: "Jatuhnya Damaskus di tangan Atsez" }
summary:
  ar: "اتسعت الدولة السلجوقية في عهد السلطان ملكشاه لتبلغ أقصى امتدادها من أفغانستان شرقاً إلى آسيا الصغرى غرباً وبلاد الشام جنوباً، وذلك بعد أن سقطت دمشق على يد قائده أتسز سنة ٤٦٨هـ/١٠٧٥م وأُقيمت فيها الدعوة للخليفة العباسي {cite:dawlat-uthmaniyya-salabi p. 33}."
  en: "Damascus fell to Alp Arslan's commander Atsiz in 1075 and the Abbasid khutba was proclaimed — the Seljuk realm reaching its greatest extent from Afghanistan to Asia Minor {cite:dawlat-uthmaniyya-salabi p. 33}."
  es: "Damasco cayó en manos de Atsiz, comandante de Alp Arslan, en 1075, y se proclamó la jutba abasí; el reino selyúcida alcanzó su máxima extensión desde Afganistán hasta Asia Menor {cite:dawlat-uthmaniyya-salabi p. 33}."
  fr: "Damas tomba aux mains du commandant d'Alp Arslan, Atsiz, en 1075 et la khutba abbasside fut proclamée — le royaume seldjoukide atteignant son extension maximale de l'Afghanistan à l'Asie Mineure {cite:dawlat-uthmaniyya-salabi p. 33}."
  ur: "دمشق 1075 میں الپ ارسلان کے کمانڈر اتزیز کے ہاتھوں گرا اور عباسی خطبہ کا اعلان کیا گیا - سلجوقی ریاست افغانستان سے لے کر ایشیا مائنر تک اپنی سب سے بڑی حد تک پہنچ گئی۔ 33}۔"
  tr: "Selçuklu devleti, Sultan Malik Şah'ın saltanatı sırasında, Şam'ın 468 Hicri/1075 Miladi yılında komutanı Atsız tarafından ele geçirilmesi ve Abbasi Halifesine biat çağrısının orada yapılması sonrasında, doğuda Afganistan'dan batıda Küçük Asya'ya ve güneyde Levant'a kadar en geniş sınırlarına ulaşmıştır. {cite:dawlat-uthmaniyya-salabi s. 33}"
  id: "Negara Seljuk meluas selama pemerintahan Sultan Malik Shah hingga mencapai wilayah terluasnya dari Afghanistan di timur hingga Asia Kecil di barat dan Levant di selatan, setelah Damaskus jatuh ke tangan komandannya, Atsiz, pada tahun 468 H/1075 M dan seruan untuk setia kepada Khalifah Abbasiyah ditegakkan di sana {cite:dawlat-uthmaniyya-salabi p. 33}."
