id: event/iyad-incursion-into-armenia
class: event
kind: campaign
label: { ar: "دخول إياد الدرب إلى خلاط", en: "Iyad's Incursion toward Khilat", es: "La incursión de Iyad hacia Khilat", fr: "L'incursion d'Iyad vers le Khilat", ur: "خلعت کی طرف عیاد کا حملہ", tr: "Iyad Al-Darb miksere giriyor.", id: "Iyad Al-Darb memasuki ruang diskusi." }
summary:
  ar: "عند البلاذري: فتح إياد آمد بغير قتال على مثل صلح الرها وفتح ميافارقين على مثل ذلك وفتح حصن كفرتونا وفتح نصيبين بعد قتال على مثل صلح الرها وفتح طور عبدين وحصن ماردين ودارا على مثل ذلك وفتح قردى وباذبدى على مثل صلح نصيبين، وأتاه بطريق الزوزان فصالحه عن أرضه على أتاوة، وكل ذلك في سنة 19 وأيام من المحرم سنة 20؛ ثم سار إلى أرزن ففتحها على مثل صلح نصيبين ودخل الدرب فبلغ بدليس وجازها إلى خلاط وصالح بطريقها وانتهى إلى العين الحامضة من أرمينية فلم يمدها ثم عاد فضمن صاحب بدليس خراج خلاط وجماجها وما على بطريقها ثم انصرف إلى الرقة ومضى إلى حمص وقد كان عمر ولاه إياها فمات سنة 20."
  en: "In al-Baladhuri: Iyad took Amid without fighting on the like of al-Ruha's treaty, Mayyafariqin likewise, the fortress of Kafr Tuta, Nasibin after fighting on the like of al-Ruha's terms, Tur Abdin and the fortress of Mardin with Dara likewise, and Qarda and Bazabda on the like of Nasibin's terms — and the patrician of al-Zawzan came to him compounding for his land at a tribute, all in year 19 and days of Muharram year 20; then he marched to Arzan, taking it on Nasibin's terms, entered the pass to Badlis, crossed to Khilat and compounded with its patrician, reached al-Ayn al-Hamida of Armenia which he did not cross, and returning held Badlis's lord guarantor for the kharaj of Khilat, its dependencies and its patrician's lands, then withdrew to al-Raqqa and went to Hims — Umar having given it to him — where he died in year 20."
  es: "En al-Baladhuri: Iyad tomó Amid sin luchar según el tratado de al-Ruha, Mayyafariqin de igual manera, la fortaleza de Kafr Tuta, Nasibin después de luchar según los términos de al-Ruha, Tur Abdin y la fortaleza de Mardin con Dara de igual manera, y Qarda y Bazabda según los términos de Nasibin; y el patricio de al-Zawzan vino a él a pagar tributo por su tierra, todo en el año 19 y días de Muharram del año 20; Luego marchó a Arzan, tomándola en los términos de Nasibin, entró en el paso hacia Badlis, cruzó a Khilat y llegó a un acuerdo con su patricio, llegó a al-Ayn al-Hamida de Armenia, que no cruzó, y al regresar tomó al señor de Badlis como garante del kharaj de Khilat, sus dependencias y las tierras de su patricio, luego se retiró a al-Raqqa y fue a Hims —que Umar le había dado— donde murió en el año 20."
  fr: "Dans al-Baladhuri: Iyad prit Amid sans combattre selon les termes du traité d'al-Ruha, Mayyafariqin de même, la forteresse de Kafr Tuta, Nasibin après avoir combattu selon les termes d'al-Ruha, Tur Abdin et la forteresse de Mardin avec Dara de même, et Qarda et Bazabda selon les termes de Nasibin — et le patricien d'al-Zawzan vint à lui pour négocier sa terre en échange d'un tribut, le tout en l'an 19 et jours de Muharram an 20; Il marcha ensuite vers Arzan, s'en empara aux conditions de Nasibin, entra dans le col de Badlis, traversa jusqu'à Khilat et conclut un accord avec son patricien, atteignit al-Ayn al-Hamida d'Arménie qu'il ne traversa pas, et, de retour, prit le seigneur de Badlis comme garant du kharaj de Khilat, de ses dépendances et des terres de son patricien, puis se retira à al-Raqqa et alla à Hims — qu'Umar lui avait donnée — où il mourut en l'an 20."
  ur: "البلادوری میں ہے: عیاد نے الروح کے معاہدے کی طرح جنگ کیے بغیر امد پر قبضہ کر لیا، مایافارکین اسی طرح، کفر توطہ کا قلعہ، الروح کی شرائط پر لڑنے کے بعد نصیبین، تور عبدین اور مردین کا قلعہ دارا کے ساتھ، اور قردہ اور بزبدہ کو بھی اسی طرح پر اور نابصی کی طرح ناصبین پر قبضہ کیا۔ الزوزان سال 19 اور محرم سال 20 کے دنوں میں، ایک خراج کے لیے اس کے پاس آیا۔ اس کے بعد اس نے ارزان کی طرف کوچ کیا، اسے ناصبین کی شرطوں پر لے کر، درہ بدلس میں داخل ہوا، خلات کو عبور کیا اور اس کے سرپرست کے ساتھ مل کر آرمینیا کے العین الحمدہ تک پہنچا جسے اس نے عبور نہیں کیا تھا، اور واپسی پر اس نے خلت، اس کے انحصار اور اس کے پیروکاروں کے ساتھ اس کی زمینوں کے خرج کے لیے بدلیس کے آقا کو ضامن بنایا۔ اور ہِمس کے پاس گئے - عمر نے اسے دے دیا - جہاں سال 20 میں ان کا انتقال ہوا۔"
  tr: "El-Baladhuri'ye göre: İyad, Edessa Antlaşması'ndaki şartlarla savaşmadan Amid'i fethetti; aynı şartlarla Mayyafariqin'i fethetti; Kafrtuna kalesini fethetti; Edessa Antlaşması'ndaki şartlarla savaşarak Nisibin'i fethetti; aynı şartlarla Tur Abdin'i, Mardin kalesini ve Dara'yı fethetti; ve Nisibin Antlaşması'ndaki şartlarla Qarda ve Badabdi'yi fethetti. Sonra Zavzan hükümdarı ona geldi ve toprakları konusunda haraç karşılığında onunla barıştı; bunların hepsi 19. yılda ve 20. yılın Muharrem ayının birkaç gününde oldu. Sonra Arzan'a yürüdü ve Nisibin Antlaşması'ndaki şartlarla orayı fethetti, yola girdi ve Badlis'e ulaştı, oradan geçerek Hilafet'e gitti ve hükümdarıyla barış yaptı, Ermenistan'ın ekşi pınarına ulaştı, ancak orayı genişletmedi, sonra geri döndü ve Badlis hükümdarına Hilafet'in ve çevresinin ve yolundaki toprakların haraçlarını garanti etti, sonra Rakka'ya gitti ve Ömer'in kendisine tayin ettiği Homs'a gitti ve 20. yılda öldü."
  id: "Menurut Al-Baladhuri: Iyad menaklukkan Amid tanpa pertempuran dengan syarat yang sama seperti Perjanjian Edessa, dan dia menaklukkan Mayyafariqin dengan syarat yang sama, dan dia menaklukkan benteng Kafrtuna, dan dia menaklukkan Nisibin setelah pertempuran dengan syarat yang sama seperti Perjanjian Edessa, dan dia menaklukkan Tur Abdin, benteng Mardin dan Dara dengan syarat yang sama, dan dia menaklukkan Qarda dan Badabdi dengan syarat yang sama seperti Perjanjian Nisibin. Kemudian penguasa Al-Zawzan datang kepadanya dan berdamai dengannya mengenai tanahnya berdasarkan upeti, dan semua itu terjadi pada tahun 19 dan beberapa hari Muharram tahun 20. Kemudian dia berbaris ke Arzan dan menaklukkannya dengan syarat yang sama seperti Perjanjian Nisibin, dan dia memasuki jalan dan mencapai Badlis dan menyeberanginya ke Khilat dan berdamai dengan penguasanya, dan dia mencapai mata air asam Armenia, tetapi dia tidak memperluasnya, kemudian dia kembali dan menjamin penguasa Badlis upeti Khilat dan sekitarnya serta apa yang ada di jalannya, kemudian dia berangkat ke Al-Raqqa dan pergi ke Homs, yang telah ditunjuk Umar kepadanya, dan dia meninggal pada tahun 20."
