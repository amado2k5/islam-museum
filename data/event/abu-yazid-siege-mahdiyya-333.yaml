id: event/abu-yazid-siege-mahdiyya-333
class: event
kind: siege
label: { ar: "حصار أبي يزيد للمهدية", en: "The Siege of al-Mahdiyya by Abu Yazid", fr: "Siège d’al-Mahdiyya par Abu Yazid", es: "El asedio de al-Mahdiyya por Abu Yazid", ur: "ابو یزید کی طرف سے المہدیہ کا محاصرہ", tr: "Ebu Yezid'in Mehdi kuşatması", id: "Pengepungan Mahdia oleh Abu Yazid" }
summary:
  ar: "في سنة ثلاث وثلاثين وثلاثمائة حاصر أبو يزيد مخلد بن كيداد صاحب الحمار القائمَ العبيدي في المهدية؛ فلما تهيّأت صنهاجة وكتامة لنصرة القائم خاف ورحل نحو المهدية فنزل على خمسة عشر ميلاً منها وبثّ سراياه، واتفقت كتامة وأصحاب القائم على الخروج إليه فباغتهم وقد وصله ولده بعسكر من القيروان فهزمهم وتبعهم إلى باب الفتح، ثم تقّدم في جمادى الآخرة فجاوز السور وأشرف على المدينة حتى بلغ بابها عند مصلّى العيد وأهل زويلة يطلبون الأمان، وخاف المقامَ لما وصل زيري بن مناد في صنهاجة فتحيّر وردّه أهل الناحية فعاد إلى منزله ثم رحل إلى ترفوضة فحفر على معسكره خندقاً، واجتمع إليه خلق عظيم من إفريقية والبربر ونفوسة والزاب وأقصى المغرب فحصر المهدية حصاراً شديداً ومنع الناس الدخول والخروج، وزحف إليها أربع زحوف من جمادى الآخرة إلى شوال وفي إحداها قبض عبيدي على لجام فرسه فكاد يؤخذ لولا أن قطع رجل من أصحابه يد القابض، وعظم البلاء على أهل المهدية حتى أكلوا الدواب والميتة وفتح القائم أهراء المهدي وفرّق ما فيها على رجاله، وكان البربر يأخذون من خرج فيقتلونه ويشقون بطنه طلباً للذهب حتى لم يبق في إفريقية معمور ولا سقف مرفوع {cite:kamil-ibn-al-athir p. 318-321}."
  en: "In 333, Abu Yazid Makhlad ibn Kaydad — 'the man of the donkey' — besieged the Ubaydid caliph al-Qa'im in al-Mahdiyya. Four assaults followed through the year; famine inside the walls grew so severe that the people ate beasts and carrion, and al-Qa'im opened the Mahdi's granaries to his men {cite:kamil-ibn-al-athir p. 318-321}."
  fr: "En 333, Abu Yazid Makhlad ibn Kaydad, « l’homme à l’âne », assiégea le calife ubaydide al-Qa'im à al-Mahdiyya. Quatre assauts suivirent au cours de l’année ; la famine devint telle à l’intérieur des murs que les habitants mangèrent bêtes et charognes, et al-Qa'im ouvrit à ses hommes les greniers d’al-Mahdi {cite:kamil-ibn-al-athir p. 318-321}."
  es: "En 333, Abu Yazid Makhlad ibn Kaydad —'el hombre del asno'— sitió al califa ubaydí al-Qa'im en al-Mahdiyya. Se produjeron cuatro asaltos a lo largo del año; la hambruna dentro de las murallas se agravó tanto que la gente comía animales y carroña, y al-Qa'im abrió los graneros del Mahdi a sus hombres {cite:kamil-ibn-al-athir p. 318-321}."
  ur: "333 میں، ابو یزید مخلد ابن کیداد - 'گدھے کا آدمی' - نے المہدیہ میں عبیدیت خلیفہ القائم کا محاصرہ کیا۔ سال بھر میں چار حملے ہوئے؛ دیواروں کے اندر قحط اتنا شدید ہو گیا کہ لوگ درندے اور مردار کھا گئے، اور القائم نے مہدی کے اناج کو اپنے آدمیوں کے لیے کھول دیا۔ 318-321}۔"
  tr: "Hicri 333 yılında, eşeğin sahibi Ebu Yezid Muhallad ibn Kaydad, Fatımi Halifesi el-Kaim'i Mehdiye'de kuşattı. Sanhaja ve Kutama kabileleri el-Kaim'i desteklemeye hazırlanırken, o korktu ve Mehdiye'ye doğru yürüdü. Şehirden 24 kilometre uzakta kamp kurdu ve birliklerini gönderdi. Kutama ve el-Kaim'in takipçileri ona karşı yürümeyi kabul ettiler, ancak o onları şaşırttı. Oğlu Kayrevan'dan bir orduyla gelmişti, bu yüzden onları yendi ve Bab el-Fath'a kadar kovaladı. Sonra Cemâde el-Ahira'da daha da ilerledi, şehir surlarını geçti ve bayram namazı alanının yakınındaki kapısına kadar şehre hakim oldu. Zavila halkı güvenli bir geçiş arıyordu. Ziri ibn Manad Sanhaja ile birlikte geldiğinde şehirde kalmaktan korktuğu için kafası karıştı ve yerliler tarafından geri çevrildi. Evine döndükten sonra Tarfuda'ya doğru yürüdü ve kampının etrafına bir hendek kazdırdı. İfrikiye, Berberiler, Nafusa, Zeb ve Mağrip'in uzak bölgelerinden büyük bir kalabalık onun etrafında toplandı. Mehdi'yi sıkı bir kuşatma altına aldı ve insanların giriş çıkışını engelledi. Cemadi el-Ahira'dan Şevval'e kadar dört sefer düzenledi. Bu seferlerden birinde Ubaydı atının dizginlerini kaptı ve neredeyse yakalandı, ancak arkadaşlarından biri onu yakalayanın elini kesti. Mehdi halkının çektiği acılar o kadar arttı ki hayvanlarını yemeye başladılar. Ölen adam Mehdi'nin ambarlarını açtı ve içindekileri adamlarına dağıttı. Berberiler dışarı çıkan herkesi yakalayıp öldürüyor ve altın aramak için karınlarını yarıp geçiyorlardı; ta ki Afrika'da yaşanabilir yer veya çatı kalmayana kadar. {Kaynak: Kamil İbn el-Atir s. 318-321}"
  id: "Pada tahun 333 H, Abu Yazid Mukhallad ibn Kaydad, pemilik keledai, mengepung Khalifah Fatimiyah al-Qaim di Mahdia. Ketika suku Sanhaja dan Kutama bersiap untuk mendukung al-Qa'im, ia menjadi takut dan bergerak menuju Mahdia. Ia berkemah lima belas mil dari kota dan mengirimkan pasukannya. Suku Kutama dan pengikut al-Qa'im setuju untuk menyerangnya, tetapi ia mengejutkan mereka. Putranya telah tiba dengan pasukan dari Kairouan, sehingga ia mengalahkan mereka dan mengejar mereka hingga Bab al-Fath. Kemudian, di Jumada al-Akhira, ia maju lebih jauh, melewati tembok kota dan mengawasi kota hingga mencapai gerbangnya di dekat lapangan shalat Id. Penduduk Zawila sedang mencari jalan keluar yang aman. Ia takut tinggal di kota ketika Ziri ibn Manad tiba bersama suku Sanhaja, sehingga ia menjadi bingung dan dipukul mundur oleh penduduk setempat. Ia kembali ke rumahnya dan kemudian berbaris ke Tarfuda, di mana ia menggali parit di sekitar perkemahannya. Sejumlah besar orang dari Ifriqiya, Berber, Nafusa, Zab, dan wilayah Maghreb yang jauh berkumpul di sekelilingnya. Ia mengepung Mahdia dengan ketat, mencegah orang masuk atau keluar. Ia melancarkan empat kampanye melawan kota itu dari Jumada al-Akhira hingga Shawwal. Dalam salah satu kampanye ini, Ubaydi meraih kendali kudanya dan hampir tertangkap, tetapi salah satu temannya memotong tangan orang yang menangkapnya. Penderitaan penduduk Mahdia menjadi begitu hebat sehingga mereka terpaksa memakan hewan ternak mereka. Orang mati membuka lumbung Mahdi dan membagikan isinya kepada anak buahnya. Orang Berber akan menangkap siapa pun yang keluar dan membunuhnya serta membelah perutnya untuk mencari emas hingga tidak ada lagi tempat berpenghuni atau atap yang tersisa di Afrika. {cite:kamil-ibn-al-athir hlm. 318-321}."
