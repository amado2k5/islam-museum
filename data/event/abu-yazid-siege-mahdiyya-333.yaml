label: { ar: "حصار أبي يزيد للمهدية", en: "The Siege of al-Mahdiyya by Abu Yazid" }
summary:
  ar: "في سنة ثلاث وثلاثين وثلاثمائة حاصر أبو يزيد مخلد بن كيداد صاحب الحمار القائمَ العبيدي في المهدية؛ فلما تهيّأت صنهاجة وكتامة لنصرة القائم خاف ورحل نحو المهدية فنزل على خمسة عشر ميلاً منها وبثّ سراياه، واتفقت كتامة وأصحاب القائم على الخروج إليه فباغتهم وقد وصله ولده بعسكر من القيروان فهزمهم وتبعهم إلى باب الفتح، ثم تقّدم في جمادى الآخرة فجاوز السور وأشرف على المدينة حتى بلغ بابها عند مصلّى العيد وأهل زويلة يطلبون الأمان، وخاف المقامَ لما وصل زيري بن مناد في صنهاجة فتحيّر وردّه أهل الناحية فعاد إلى منزله ثم رحل إلى ترفوضة فحفر على معسكره خندقاً، واجتمع إليه خلق عظيم من إفريقية والبربر ونفوسة والزاب وأقصى المغرب فحصر المهدية حصاراً شديداً ومنع الناس الدخول والخروج، وزحف إليها أربع زحوف من جمادى الآخرة إلى شوال وفي إحداها قبض عبيدي على لجام فرسه فكاد يؤخذ لولا أن قطع رجل من أصحابه يد القابض، وعظم البلاء على أهل المهدية حتى أكلوا الدواب والميتة وفتح القائم أهراء المهدي وفرّق ما فيها على رجاله، وكان البربر يأخذون من خرج فيقتلونه ويشقون بطنه طلباً للذهب حتى لم يبق في إفريقية معمور ولا سقف مرفوع {cite:kamil-ibn-al-athir p. 318-321}."
  en: "In 333, Abu Yazid Makhlad ibn Kaydad — 'the man of the donkey' — besieged the Ubaydid caliph al-Qa'im in al-Mahdiyya. Four assaults followed through the year; famine inside the walls grew so severe that the people ate beasts and carrion, and al-Qa'im opened the Mahdi's granaries to his men {cite:kamil-ibn-al-athir p. 318-321}."
