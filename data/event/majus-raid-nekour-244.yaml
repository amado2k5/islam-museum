label: { ar: "غارة المجوس على نكور سنة 244", en: "Majus raid on Nekour, 244", es: "Incursión de Majus en Nekour, 244", fr: "Raid de Majus sur Nekour, 244", ur: "نیکور پر مجوس کا چھاپہ، 244", tr: "Magi'nin 244 yılında Nekor'a düzenlediği baskın.", id: "Penyerbuan para Majus ke Nekor pada tahun 244" }
summary:
  ar: "سنة 244هـ غزا المجوس مدينة نكور على ساحل المغرب الأقصى في أساطيلهم فتغلبوا عليها واستباحوها ثمانية أيام، ثم اجتمع إلى سعيد بن صالح ملكها من بني صالح بن منصور نجدة من البربر فتزاحفوا معهم فأظهرهم الله عليهم وفرق جماعتهم وقتل مقدمهم واستوسق أمره إلى أن هلك سنة 188هـ لسبع وثلاثين من ملكه {cite:tarikh-ibn-khaldun-ibar p. 1662-1663}."
  en: "In 244 AH the Majus (Norse seafarers) raided Nekour on the Maghreb's coast in their fleets, overran it and sacked it for eight days, until Sa'id ibn Salih of the Banu Salih gathered Berber succour, met them in battle, routed their host and killed their leader {cite:tarikh-ibn-khaldun-ibar p. 1662-1663}."
  es: "En el año 244 AH, los Majus (navegantes nórdicos) asaltaron Nekour en la costa del Magreb con sus flotas, la invadieron y la saquearon durante ocho días, hasta que Sa'id ibn Salih de los Banu Salih reunió ayuda bereber, los enfrentó en batalla, derrotó a su ejército y mató a su líder {cite:tarikh-ibn-khaldun-ibar p. 1662-1663}."
  fr: "En 244 AH, les Majus (navigateurs nordiques) ont attaqué Nekour sur la côte du Maghreb avec leurs flottes, l'ont envahie et l'ont pillée pendant huit jours, jusqu'à ce que Sa'id ibn Salih des Banu Salih rassemble des renforts berbères, les affronte au combat, mette en déroute leur armée et tue leur chef {cite:tarikh-ibn-khaldun-ibar p. 1662-1663}."
  ur: "244 ہجری میں مجوس نے مغرب کے ساحل پر نیکور پر اپنے بحری بیڑوں کے ساتھ حملہ کیا، اس پر قبضہ کیا اور اسے آٹھ دن تک برطرف کیا، یہاں تک کہ بنو صالح کے سعید بن صالح نے بربر کی مدد جمع کی، جنگ میں ان سے ملاقات کی، ان کے میزبان کو شکست دی اور ان کے سردار کو قتل کر دیا۔ 1662-1663}۔"
  tr: "Hicri 244 yılında, Mecusiler filolarıyla uzak Mağrip kıyısındaki Nekor şehrine saldırdılar ve şehri sekiz gün boyunca yağmaladılar. Bunun üzerine Beni Salih bin Mansur kabilesinden kralları Seyyid bin Salih, Berberilerle bir araya gelerek onlara karşı yürüdüler. Ancak Allah onları galip kıldı, topluluklarını dağıttı ve liderlerini öldürdü. Böylece, hükümdarlığının otuz yedinci yılında, Hicri 188 yılında vefat edene kadar işleri yolunda gitti. {cite:tarikh-ibn-khaldun-ibar s. 1662-1663}"
  id: "Pada tahun 244 H, kaum Majusi menyerbu kota Nekor di pesisir Maghreb yang jauh dengan armada mereka, dan mereka menaklukkannya serta menjarahnya selama delapan hari. Kemudian Saeed bin Saleh, rajanya dari Bani Saleh bin Mansour, mengumpulkan orang-orang Berber, dan mereka berbaris melawan mereka, tetapi Allah menjadikan mereka pemenang atas mereka, dan Dia membubarkan kelompok mereka dan membunuh pemimpin mereka, dan urusannya diselesaikan sampai dia meninggal pada tahun 188 H, tiga puluh tujuh tahun setelah masa pemerintahannya. {cite:tarikh-ibn-khaldun-ibar p. 1662-1663}."
