label:
  ar: "قدوم الشيرازي بغداد، ٤١٥هـ"
  en: "Al-Shirazi's arrival in Baghdad, 415/1024"
  ur: "شیرازی کی بغداد آمد، 415ھ/1024ء"
summary:
  ar: "سنة ٤١٥هـ كان أبو إسحاق الشيرازي ببغداد يحضر دروس القزويني الفقيه حامل طريقة الباقلاني ⁦(ت ٤٤٠هـ)⁩، وصار أبرز تلاميذ القاضي أبي الطيب الطبري ⁦(ت ٤٥٠هـ)⁩ ومُعيده المعتمد عنده {cite:encyclopaedia-of-islam-2 vol. 9 p. 494}."
  en: "In 415/1024 Abu Ishaq al-Shirazi was in Baghdad, attending the classes of the jurist al-Qazwini (d. 440/1048), a proponent of the legal thinking developed by al-Baqillani, and — more significantly — becoming the leading disciple and accredited assistant (mu'id) of the qadi Abu al-Tayyib al-Tabari (d. 450/1058) {cite:encyclopaedia-of-islam-2 vol. 9 p. 494}."
  ur: "415ھ/1024ء میں ابو اسحاق شیرازی بغداد میں تھے، فقیہ قزوینی (ت 440ھ) کے دروس میں حاضر ہوتے جو باقلانی کے فقہی منہج کا حامل تھا، اور زیادہ اہم یہ کہ وہ قاضی ابو الطیب طبری (ت 450ھ) کے ممتاز شاگرد اور ان کے معتمد معید بن گئے {cite:encyclopaedia-of-islam-2 vol. 9 p. 494}۔"
