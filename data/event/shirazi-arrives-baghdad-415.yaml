label:
  ar: "قدوم الشيرازي بغداد، ٤١٥هـ"
  en: "Al-Shirazi's arrival in Baghdad, 415/1024"
  ur: "شیرازی کی بغداد آمد، 415ھ/1024ء"
  es: "Llegada de Al-Shirazi a Bagdad, 415/1024"
  fr: "Arrivée d'Al-Shirazi à Bagdad, 415/1024"
  tr: "Şirazi'nin Bağdat'a gelişi, Hicri 415"
  id: "Kedatangan Al-Shirazi di Baghdad, 415 H"
summary:
  ar: "سنة ٤١٥هـ كان أبو إسحاق الشيرازي ببغداد يحضر دروس القزويني الفقيه حامل طريقة الباقلاني ⁦(ت ٤٤٠هـ)⁩، وصار أبرز تلاميذ القاضي أبي الطيب الطبري ⁦(ت ٤٥٠هـ)⁩ ومُعيده المعتمد عنده {cite:encyclopaedia-of-islam-2 vol. 9 p. 494}."
  en: "In 415/1024 Abu Ishaq al-Shirazi was in Baghdad, attending the classes of the jurist al-Qazwini (d. 440/1048), a proponent of the legal thinking developed by al-Baqillani, and — more significantly — becoming the leading disciple and accredited assistant (mu'id) of the qadi Abu al-Tayyib al-Tabari (d. 450/1058) {cite:encyclopaedia-of-islam-2 vol. 9 p. 494}."
  ur: "415ھ/1024ء میں ابو اسحاق شیرازی بغداد میں تھے، فقیہ قزوینی ⁦(ت 440ھ)⁩ کے دروس میں حاضر ہوتے جو باقلانی کے فقہی منہج کا حامل تھا، اور زیادہ اہم یہ کہ وہ قاضی ابو الطیب طبری ⁦(ت 450ھ)⁩ کے ممتاز شاگرد اور ان کے معتمد معید بن گئے {cite:encyclopaedia-of-islam-2 vol. 9 p. 494}۔"
  es: "En 415/1024, Abu Ishaq al-Shirazi estaba en Bagdad, asistiendo a las clases del jurista al-Qazwini (m. 440/1048), un defensor del pensamiento jurídico desarrollado por al-Baqillani, y, más significativamente, convirtiéndose en el principal discípulo y asistente acreditado (mu'id) del qadi Abu al-Tayyib al-Tabari (m. 450/1058). {citar:enciclopedia-del-islam-2 vol. 9p. 494}."
  fr: "En 415/1024, Abu Ishaq al-Shirazi était à Bagdad, suivant les cours du juriste al-Qazwini (mort en 440/1048), partisan de la pensée juridique développée par al-Baqillani, et - plus important encore - devenant le principal disciple et assistant accrédité (mu'id) du cadi Abu al-Tayyib al-Tabari (mort en 450/1058). {cite: encyclopédie-de-l'islam-2 vol. 21h. 494}."
  tr: "Hicri 415 yılında Ebu İshak el-Şirazi, Bağdat'ta el-Baqillani'nin (ö. 440 Hicri) yöntemini benimseyen hukukçu el-Kazvini'nin derslerine katılıyor ve Kadı Ebu el-Tayyib el-Taberi'nin (ö. 450 Hicri) en önde gelen öğrencisi ve güvenilir yardımcısı oluyor. {cite:encyclopaedia-of-islam-2 vol. 9 p. 494}"
  id: "Pada tahun 415 H, Abu Ishaq al-Shirazi berada di Baghdad mengikuti pelajaran al-Qazwini, seorang ahli hukum yang menerapkan metode al-Baqillani (wafat 440 H), dan ia menjadi murid terkemuka Hakim Abu al-Tayyib al-Tabari (wafat 450 H) dan asisten kepercayaannya {cite:encyclopaedia-of-islam-2 vol. 9 p. 494}."
