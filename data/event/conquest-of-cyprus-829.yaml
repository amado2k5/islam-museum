label: { ar: "فتح قبرص وأسر ملكها جينوس", en: "The Conquest of Cyprus and Capture of King Janus", es: "La conquista de Chipre y la captura del rey Jano", fr: "La conquête de Chypre et la capture du roi Janus", ur: "قبرص کی فتح اور بادشاہ جانس کی گرفتاری۔", tr: "Kıbrıs'ın fethi ve kralı Cenova'nın yakalanması", id: "Penaklukan Siprus dan penangkapan rajanya, Gennos." }
summary:
  ar: "في شذرات الذهب في رمضان سنة تسع وعشرين وثمان مئة كان فتح قبرص في أيام السلطان الأشرف برسباي وعمل زين الدين عبد الرحمن بن محمد بن الخراط موقع الدست بالقلعة قصيدة فائية أولها بشراك يا ملك الملوك الأشرف بفتح قبرص بالحسام المشرفى وفي ترجمة برسباي أنه فتحت في أيامه عدة فتوحات منها ماغوصة قبرص ثم بقية جزيرة قبرص وأسر ملكها جينوس ولم يقتل من المسلمين إلا القليل ثم عرض عليه جينوس ومن معه من الأسرى وهو يرفل في قيوده فذرفت عينا برسباي وأعلن بالحمد والشكر ورتب له ما يكفيه ثم أطلقه وأعاده بعد أن ضرب عليه الجزية فاستمرت ووعى السبايا والغنائم وحمل الثمن إلى الخزانة السلطانية وفرق في المجاهدين منه بعضه {cite:shadharat-dhahab p. 195, 247}."
  en: "Ramadan 829: the Mamluk conquest of Cyprus under Barsbay — Famagusta, then the rest of the island, King Janus taken captive with few Muslim dead; paraded in chains before the sultan, whose eyes welled as he released him under tribute {cite:shadharat-dhahab p. 195, 247}."
  es: "Ramadán 829: la conquista mameluca de Chipre bajo Barsbay — Famagusta, luego el resto de la isla, el rey Jano hecho prisionero con pocos musulmanes muertos; exhibido encadenado ante el sultán, cuyos ojos se llenaron de lágrimas cuando lo liberó bajo tributo {cite:shadharat-dhahab p. 195, 247}."
  fr: "Ramadan 829: la conquête mamelouke de Chypre sous Barsbay — Famagouste, puis le reste de l'île, le roi Janus fait prisonnier avec quelques morts musulmans; il est exhibé enchaîné devant le sultan, dont les yeux se sont remplis de larmes lorsqu'il l'a libéré sous tribut {cite: shadharat-dhahab p. 195, 247}."
  ur: "رمضان 829: بارسبے کے تحت قبرص پر مملوک کی فتح - فاماگوسٹا، پھر جزیرے کا باقی حصہ، بادشاہ جانس کو چند مسلمانوں کے ساتھ اسیر کر لیا گیا۔ سلطان کے سامنے زنجیروں میں جکڑا ہوا تھا، جس کی آنکھیں بھیگ گئیں جب اس نے اسے خراج تحسین کے تحت رہا کیا۔ 195، 247}۔"
  tr: "Hicri 829 yılının Ramazan ayında, Şadharat el-Dhahab'da, Sultan el-Eşref Barsbay döneminde Kıbrıs'ın fethi gerçekleşti. Zeyn el-Din Abdül-Rahman ibn Muhammed ibn el-Harat, Fa'iyye ölçüsünde, \"Ey Kralların Kralı, el-Eşref, keskin kılıçla Kıbrıs'ı fethettiğin için sana müjde olsun!\" diye başlayan bir şiir yazdı. Barsbay'ın biyografisinde, saltanatı sırasında Maghosah, Kıbrıs ve daha sonra Kıbrıs adasının geri kalanı da dahil olmak üzere birçok fetih gerçekleştiği belirtilir. Kral Genius esir alındı ve sadece birkaç Müslüman öldürüldü. Genius ve onunla birlikte esirler zincirlenmiş halde ona sunuldu. Barsbay'ın gözleri yaşlarla doldu, övgü ve şükranlarını dile getirdi ve ona yeterli olanı sağladı. Sonra onu serbest bıraktı ve cizye vergisini aldıktan sonra geri gönderdi. Esirleri ve ganimetleri topladı, bedelini Sultanın hazinesine götürdü ve bir kısmını mücahitlere dağıttı. {cite:shadharat-dhahab s. 195, 247}"
  id: "Dalam Shadharat al-Dhahab, pada bulan Ramadan tahun 829 H, penaklukan Siprus terjadi pada masa pemerintahan Sultan al-Ashraf Barsbay. Zayn al-Din Abd al-Rahman ibn Muhammad ibn al-Kharrat menggubah sebuah puisi dalam meter Fa’iyyah, yang dimulai dengan: “Kabar gembira bagimu, wahai Raja segala Raja, al-Ashraf, atas penaklukan Siprus dengan pedang yang tajam.” Dalam biografi Barsbay, disebutkan bahwa beberapa penaklukan terjadi selama pemerintahannya, termasuk Maghosah, Siprus, dan kemudian seluruh pulau Siprus. Rajanya, Genius, ditangkap, dan hanya sedikit Muslim yang terbunuh. Genius dan para tawanan bersamanya dipersembahkan kepadanya, berjalan dengan gagah dalam rantai mereka. Mata Barsbay berlinang air mata, dan ia menyatakan pujian dan terima kasih, serta mengatur apa yang cukup untuknya. Kemudian ia membebaskannya dan mengirimnya kembali setelah mengenakan jizya kepadanya, yang terus berlanjut. Dia mengumpulkan tawanan dan rampasan perang, lalu membawa hadiahnya ke perbendaharaan Sultan, dan membagikan sebagiannya kepada para mujahidin. {cite:shadharat-dhahab p. 195, 247}"
