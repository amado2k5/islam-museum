label: { ar: "فتح إقريطش", en: "The Conquest of Crete" }
summary:
  ar: "عند البلاذري: غزا جنادة إقريطش فلما كان زمن الوليد فتح بعضها ثم أُغلق وغزاها حميد بن معيوف الهمداني في خلافة الرشيد ففتح بعضها ثم غزاها في خلافة المأمون أبو حفص عمر بن عيسى الأندلسي المعروف بالإقريطشي فافتتح منها حصناً واحداً ونزله ثم لم يزل يفتح شيئاً بعد شيء حتى لم يبق فيها من الروم أحد وأخرب حصونهم."
  en: "In al-Baladhuri: Janada raided Crete; in al-Walid's time part of it was opened then it closed; Humayd ibn Ma'yuf al-Hamdani raided it in al-Rashid's caliphate and opened part; then in al-Ma'mun's caliphate Abu Hafs Umar ibn Isa al-Andalusi — known as al-Iqritishi — raided it, opened a single fortress and settled it, then kept opening bit by bit until no Romans remained in it and he ruined their fortresses."
