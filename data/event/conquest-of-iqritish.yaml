id: event/conquest-of-iqritish
class: event
kind: conquest
label: { ar: "فتح إقريطش", en: "The Conquest of Crete", es: "La conquista de Creta", fr: "La conquête de la Crète", ur: "کریٹ کی فتح", tr: "Girit'in Fethi", id: "Penaklukan Kreta" }
summary:
  ar: "عند البلاذري: غزا جنادة إقريطش فلما كان زمن الوليد فتح بعضها ثم أُغلق وغزاها حميد بن معيوف الهمداني في خلافة الرشيد ففتح بعضها ثم غزاها في خلافة المأمون أبو حفص عمر بن عيسى الأندلسي المعروف بالإقريطشي فافتتح منها حصناً واحداً ونزله ثم لم يزل يفتح شيئاً بعد شيء حتى لم يبق فيها من الروم أحد وأخرب حصونهم. وعند المقري ومن سبب تسلط الأندلسيين على أقريطيش أن ثائرين من أهل ربض قرطبة لحقوا بالإسكندرية ثم ثاروا بها فزحف إليهم عبد الله بن طاهر صاحب مصر للمأمون فغلبهم وأجازهم إلى جزيرة أقريطيش فلم يزالوا بها إلى أن ملكها الإفرنج من أيديهم {cite:nafh-tib-maqqari p. 375}"
  en: "In al-Baladhuri: Janada raided Crete; in al-Walid's time part of it was opened then it closed; Humayd ibn Ma'yuf al-Hamdani raided it in al-Rashid's caliphate and opened part; then in al-Ma'mun's caliphate Abu Hafs Umar ibn Isa al-Andalusi — known as al-Iqritishi — raided it, opened a single fortress and settled it, then kept opening bit by bit until no Romans remained in it and he ruined their fortresses."
  es: "En al-Baladhuri: Janada saqueó Creta; en tiempos de al-Walid se abrió parte de ella y luego se cerró; Humayd ibn Ma'yuf al-Hamdani la saqueó en el califato de al-Rashid y abrió parte; luego en el califato de al-Ma'mun Abu Hafs Umar ibn Isa al-Andalusi —conocido como al-Iqritishi— la saqueó, abrió una sola fortaleza y se estableció allí, luego siguió abriéndola poco a poco hasta que no quedaron romanos y arruinó sus fortalezas."
  fr: "Selon al-Baladhuri: Janada a pillé la Crète; à l’époque d’al-Walid, une partie de la forteresse fut ouverte puis fermée; Humayd ibn Ma’yuf al-Hamdani l’a pillée sous le califat d’al-Rashid et en a ouvert une partie; puis, sous le califat d’al-Ma’mun, Abu Hafs Umar ibn Isa al-Andalusi — connu sous le nom d’al-Iqritishi — l’a pillée, a ouvert une seule forteresse et s’y est installé, puis a continué à l’ouvrir petit à petit jusqu’à ce qu’il n’y ait plus aucun Romain et qu’il détruise leurs forteresses."
  ur: "البلادھوری میں ہے: جنڈا نے کریٹ پر چھاپہ مارا۔ الولید کے زمانے میں اس کا کچھ حصہ کھولا گیا پھر بند ہوگیا۔ حمید بن مایوف الحمدانی نے الرشید کی خلافت میں اس پر چھاپہ مارا اور حصہ کھول دیا۔ پھر مامون کی خلافت میں ابو حفص عمر بن عیسیٰ الاندلسی - جسے العقریتشی کے نام سے جانا جاتا ہے - نے اس پر چھاپہ مارا، ایک ہی قلعہ کھولا اور اسے آباد کیا، پھر تھوڑا سا کھولتا رہا یہاں تک کہ اس میں کوئی رومی باقی نہ رہا اور اس نے ان کے قلعوں کو تباہ کردیا۔"
  tr: "El-Baladhuri'ye göre: Cunade Girit'i işgal etti. El-Valid döneminde bir kısmını fethetti, sonra kapandı. Hamid ibn Ma'yuf el-Hamdani, el-Raşid halifeliği döneminde Girit'i işgal etti ve bir kısmını ele geçirdi. Daha sonra, el-Ma'mun halifeliği döneminde, el-İkritşi olarak bilinen Ebu Hafs Ömer ibn İsa el-Endülüs, Girit'i işgal etti, bir kaleyi ele geçirdi ve işgal etti. Romalılar orada kalmayana kadar yavaş yavaş fethetmeye devam etti ve kalelerini yıktı. El-Makkari'ye göre, Endülüslerin Girit'e hakim olmasının nedenlerinden biri, Kurtuba banliyölerinden gelen isyancıların İskenderiye'deki isyana katılması ve orada ayaklanmasıydı. El-Ma'mun'un Mısır valisi Abdullah ibn Tahir, onlara karşı yürüdü, onları yendi ve Girit adasına geçmeye zorladı. Franklar orayı ellerinden alana kadar orada kaldılar. {cite:nafh-tib-maqqari s. 375}"
  id: "Menurut al-Baladhuri: Junadah menginvasi Kreta. Pada masa pemerintahan al-Walid, ia menaklukkan sebagian wilayahnya, kemudian wilayah itu ditutup. Hamid ibn Ma'yuf al-Hamdani menginvasi wilayah itu pada masa kekhalifahan al-Rashid dan menaklukkan sebagian wilayahnya. Kemudian, pada masa kekhalifahan al-Ma'mun, Abu Hafs Umar ibn Isa al-Andalusi, yang dikenal sebagai al-Iqritshi, menginvasi wilayah itu dan menaklukkan satu benteng serta mendudukinya. Ia terus menaklukkannya sedikit demi sedikit hingga tidak ada lagi orang Romawi yang tersisa di sana, dan ia menghancurkan benteng-benteng mereka. Menurut al-Maqqari, salah satu alasan dominasi Andalusia atas Kreta adalah karena pemberontak dari pinggiran Cordoba bergabung dengan pemberontakan di Alexandria dan kemudian memberontak di sana. Abdullah ibn Tahir, gubernur Mesir untuk al-Ma'mun, menyerang mereka, mengalahkan mereka, dan memaksa mereka menyeberang ke pulau Kreta. Mereka tinggal di sana hingga bangsa Frank merebutnya dari mereka. {mengutip:nafh-tib-maqqari hal. 375}"
