label: { ar: "فتح إقريطش", en: "The Conquest of Crete", es: "La conquista de Creta", fr: "La conquête de la Crète" }
summary:
  ar: "عند البلاذري: غزا جنادة إقريطش فلما كان زمن الوليد فتح بعضها ثم أُغلق وغزاها حميد بن معيوف الهمداني في خلافة الرشيد ففتح بعضها ثم غزاها في خلافة المأمون أبو حفص عمر بن عيسى الأندلسي المعروف بالإقريطشي فافتتح منها حصناً واحداً ونزله ثم لم يزل يفتح شيئاً بعد شيء حتى لم يبق فيها من الروم أحد وأخرب حصونهم. وعند المقري ومن سبب تسلط الأندلسيين على أقريطيش أن ثائرين من أهل ربض قرطبة لحقوا بالإسكندرية ثم ثاروا بها فزحف إليهم عبد الله بن طاهر صاحب مصر للمأمون فغلبهم وأجازهم إلى جزيرة أقريطيش فلم يزالوا بها إلى أن ملكها الإفرنج من أيديهم {cite:nafh-tib-maqqari p. 375}"
  en: "In al-Baladhuri: Janada raided Crete; in al-Walid's time part of it was opened then it closed; Humayd ibn Ma'yuf al-Hamdani raided it in al-Rashid's caliphate and opened part; then in al-Ma'mun's caliphate Abu Hafs Umar ibn Isa al-Andalusi — known as al-Iqritishi — raided it, opened a single fortress and settled it, then kept opening bit by bit until no Romans remained in it and he ruined their fortresses."
  es: "En al-Baladhuri: Janada saqueó Creta; en tiempos de al-Walid se abrió parte de ella y luego se cerró; Humayd ibn Ma'yuf al-Hamdani la saqueó en el califato de al-Rashid y abrió parte; luego en el califato de al-Ma'mun Abu Hafs Umar ibn Isa al-Andalusi —conocido como al-Iqritishi— la saqueó, abrió una sola fortaleza y se estableció allí, luego siguió abriéndola poco a poco hasta que no quedaron romanos y arruinó sus fortalezas."
  fr: "Selon al-Baladhuri: Janada a pillé la Crète; à l’époque d’al-Walid, une partie de la forteresse fut ouverte puis fermée; Humayd ibn Ma’yuf al-Hamdani l’a pillée sous le califat d’al-Rashid et en a ouvert une partie; puis, sous le califat d’al-Ma’mun, Abu Hafs Umar ibn Isa al-Andalusi — connu sous le nom d’al-Iqritishi — l’a pillée, a ouvert une seule forteresse et s’y est installé, puis a continué à l’ouvrir petit à petit jusqu’à ce qu’il n’y ait plus aucun Romain et qu’il détruise leurs forteresses."
