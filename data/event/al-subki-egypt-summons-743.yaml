label:
  ar: "طلب السبكي إلى مصر ثم عودته إلى قضاء دمشق، ٧٤٣هـ"
  en: "Al-Subki summoned to Egypt, then restored at Damascus, 743/1342"
  ur: "سبکی کا مصر طلب ہونا اور دمشق واپسی، 743ھ/1342ء"
summary:
  ar: "ورد البريد من الديار المصرية بطلب قاضي القضاة تقي الدين السبكي حاكماً بها في جمادى الأولى ٧٤٣هـ، فسار إليها صحبة البريد وخرج الكبراء والأعيان لتوديعه، ثم رجع إلى دمشق على القضاء يوم الأحد ٨ رجب ومعه تقليد بالخطابة أيضاً؛ فأثار العوام شغباً على الخطابة لصالح خطيبهم ابن الجلال حتى نزل عنها السبكي له وبقي في القضاء {cite:al-bidaya-wal-nihaya s.a. 743 pp. 215-217}."
  en: "In Jumada I 743 the post brought a summons calling chief qadi Taqi al-Din al-Subki to Egypt as its judge; he rode out with the courier while the notables saw him off. He returned to his bench in Damascus on Sunday 8 Rajab carrying a decree of the khitaba as well — but the populace rioted in favour of their own khatib Ibn al-Jalal until al-Subki ceded the pulpit to him and kept the judgeship {cite:al-bidaya-wal-nihaya s.a. 743 pp. 215-217}."
  ur: "جمادی الاولیٰ 743ھ میں ڈاک کے ذریعے قاضی القضاة تقی الدین سبکی کو مصر کا حاکم بنا کر بلایا گیا؛ وہ کورئیر کے ساتھ روانہ ہوئے اور بڑے لوگوں نے رخصت کیا۔ وہ 8 رجب بروز اتوار خطابت کے فرمان کے ساتھ دمشق کے منصبِ قضاء پر لوٹے — مگر عوام نے اپنے خطیب ابن الجلال کے حق میں ہنگامہ کیا یہاں تک کہ سبکی نے ان کے لیے خطابت چھوڑ دی اور قضاء پر رہے {cite:al-bidaya-wal-nihaya s.a. 743 pp. 215-217}۔"
