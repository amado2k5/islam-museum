id: event/ibn-bustam-is-given-safety-and-al-hadi-leaves-najran-for-saada-287
class: event
kind: other
label:
  ar: "ابن بسطام يؤمَّن ويبني بميناس والهادي يخرج من نجران إلى صعدة، جمادى 287هـ"
  en: "Ibn Bustam is given safety and builds at Minas, and al-Hadi leaves Najran for Sa'da, Jumada 287 AH"
  ur: "ابن بسطام کو امان اور میناس میں تعمیر، اور ہادی کا نجران سے صعدہ روانہ ہونا، جمادیٰ 287ھ"
  es: "Ibn Bustam recibe protección y construye en Minas, y al-Hadi parte de Najrán hacia Sa'da, en Jumada del año 287 de la Hégira."
  fr: "Ibn Bustam est mis en sécurité et construit à Minas, tandis qu'al-Hadi quitte Najran pour Sa'da (Jumada 287 AH)."
  tr: "İbn Bistam Minas'ta güvenlik sağlayıp inşaat yapar ve Al-Hadi Hicri 287 Cemâde'sinde Necran'dan Sa'de'ye gider."
  id: "Ibn Bistam mengamankan dan membangun di Minas, dan Al-Hadi berangkat dari Najran ke Sa'dah, Jumada 287 H."
summary:
  ar: "أعطى الهادي ابن بسطام الأمان وأذن له ببناء منزله بميناس، وأقام بنجران شهرين، وأعفى أحمد بن محمد من ولايتها وولى عليها أبا جعفر محمد بن عبيد الله العلوي، وحذر بني الحارث وأمر الناس بالأهبة آخر جمادى الأولى."
  en: "Al-Hadi gave Ibn Bustam safety and leave to build his house at Minas, stayed two months at Najran, relieved Ahmad ibn Muhammad of its governorship and set Abu Ja'far Muhammad ibn Ubaydallah al-Alawi over it, warned Banu al-Harith and ordered the people to make ready at the end of Jumada I."
  ur: "ہادی نے ابن بسطام کو امان دی اور میناس میں اپنا مکان بنانے کی اجازت دی، دو مہینے نجران میں رہے، احمد بن محمد کو اس کی ولایت سے سبکدوش کیا اور ابو جعفر محمد بن عبید اللہ علوی کو اس پر مقرر کیا، بنو حارث کو خبردار کیا اور جمادی الاولیٰ کے آخر میں لوگوں کو تیاری کا حکم دیا۔"
  es: "Al-Hadi le concedió a Ibn Bustam seguridad y permiso para construir su casa en Minas, permaneció dos meses en Najran, relevó a Ahmad ibn Muhammad de su gobernación y nombró a Abu Ja'far Muhammad ibn Ubaydallah al-Alawi al frente, advirtió a Banu al-Harith y ordenó a la gente que se preparara para el final del Jumada I."
  fr: "Al-Hadi accorda à Ibn Bustam la sécurité et la permission de construire sa maison à Minas, séjourna deux mois à Najran, releva Ahmad ibn Muhammad de son gouvernement et y installa Abu Ja'far Muhammad ibn Ubaydallah al-Alawi, avertit Banu al-Harith et ordonna au peuple de se préparer à la fin de Jumada I."
  tr: "El-Hadi, İbn Bustam'a güvenli geçiş izni verdi ve Minas'ta evini inşa etmesine izin verdi. İki ay boyunca Necran'da kaldı, Ahmed İbn Muhammed'i valilik görevinden aldı ve yerine Ebu Cafer Muhammed İbn Ubeyd Allah el-Alavi'yi vali olarak atadı. Beni El-Harith'i uyardı ve Cemâdî-i Ula ayının sonunda halkın hazırlık yapmasını emretti."
  id: "Al-Hadi memberi Ibnu Bustam jalan aman dan mengizinkannya membangun rumahnya di Minas. Ia tinggal di Najran selama dua bulan, memecat Ahmad Ibnu Muhammad dari jabatan gubernurnya dan mengangkat Abu Jaafar Muhammad Ibnu Ubaid Allah Al-Alawi sebagai gubernur. Ia memperingatkan Bani Al-Harith dan memerintahkan orang-orang untuk bersiap-siap pada akhir Jumada Al-Ula."
