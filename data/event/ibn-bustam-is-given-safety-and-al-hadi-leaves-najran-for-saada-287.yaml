label:
  ar: "ابن بسطام يؤمَّن ويبني بميناس والهادي يخرج من نجران إلى صعدة، جمادى 287هـ"
  en: "Ibn Bustam is given safety and builds at Minas, and al-Hadi leaves Najran for Sa'da, Jumada 287 AH"
  ur: "ابن بسطام کو امان اور میناس میں تعمیر، اور ہادی کا نجران سے صعدہ روانہ ہونا، جمادیٰ 287ھ"
summary:
  ar: "أعطى الهادي ابن بسطام الأمان وأذن له ببناء منزله بميناس، وأقام بنجران شهرين، وأعفى أحمد بن محمد من ولايتها وولى عليها أبا جعفر محمد بن عبيد الله العلوي، وحذر بني الحارث وأمر الناس بالأهبة آخر جمادى الأولى."
  en: "Al-Hadi gave Ibn Bustam safety and leave to build his house at Minas, stayed two months at Najran, relieved Ahmad ibn Muhammad of its governorship and set Abu Ja'far Muhammad ibn Ubaydallah al-Alawi over it, warned Banu al-Harith and ordered the people to make ready at the end of Jumada I."
  ur: "ہادی نے ابن بسطام کو امان دی اور میناس میں اپنا مکان بنانے کی اجازت دی، دو مہینے نجران میں رہے، احمد بن محمد کو اس کی ولایت سے سبکدوش کیا اور ابو جعفر محمد بن عبید اللہ علوی کو اس پر مقرر کیا، بنو حارث کو خبردار کیا اور جمادی الاولیٰ کے آخر میں لوگوں کو تیاری کا حکم دیا۔"
