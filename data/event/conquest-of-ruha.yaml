label: { ar: "فتح الرها", en: "The Conquest of Edessa (al-Ruha)", es: "La conquista de Edesa (al-Ruha)", fr: "La conquête d'Édesse (al-Ruha)" }
summary:
  ar: "عند البلاذري عن النفيلي عن سليمان بن عطاء: لما فتح إياد بن غنم الرها — وكان أبو عبيدة وجّهه — وقف على بابها على فرس له كميت فصالحوه على أن لهم هيكلهم وما حوله وعلى أن لا يحدثوا كنيسة إلا ما كان لهم وعلى معونة المسلمين على عدوهم، فإن تركوا شيئاً مما شرط عليهم فلا ذمة لهم؛ ودخل أهل الجزيرة فيما دخل فيه أهل الرها."
  en: "In al-Baladhuri through al-Nufayli from Sulayman ibn Ata: when Iyad ibn Ghanm took al-Ruha — Abu Ubayda had sent him — he stood at its gate on a chestnut horse and they compounded with him on the terms that their great church and its surroundings were theirs, that they raise no new church beyond what they had, and that they aid the Muslims against their enemy — any of these left unkept and they had no dhimma; and the people of the Jazira entered into what Edessa's people entered into."
  es: "En al-Baladhuri a través de al-Nufayli de Sulayman ibn Ata: cuando Iyad ibn Ghanm tomó al-Ruha — Abu Ubayda lo había enviado — se paró en su puerta sobre un caballo castaño y llegaron a un acuerdo con él en los términos de que su gran iglesia y sus alrededores eran suyos, que no levantaran ninguna iglesia nueva más allá de la que tenían, y que ayudaran a los musulmanes contra su enemigo — cualquiera de estos términos no se cumplía y no tenían dhimma; y la gente de Jazira entró en lo mismo que la gente de Edesa."
  fr: "Dans al-Baladhuri, transmis par al-Nufayli d'après Sulayman ibn Ata: lorsque Iyad ibn Ghanm prit al-Ruha — envoyé par Abu Ubayda —, il se tint à sa porte sur un cheval alezan et ils conclurent un pacte avec lui aux termes desquels leur grande église et ses environs leur appartenaient, qu'ils ne construiraient aucune nouvelle église au-delà de celle qu'ils possédaient déjà, et qu'ils aideraient les musulmans contre leur ennemi — aucun de ces points n'étant respecté, ils n'avaient pas de dhimma; et les habitants de la Jazira entrèrent dans le même pacte que les habitants d'Édesse."
