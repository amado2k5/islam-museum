label: { ar: "فتح الرها", en: "The Conquest of Edessa (al-Ruha)" }
summary:
  ar: "عند البلاذري عن النفيلي عن سليمان بن عطاء: لما فتح إياد بن غنم الرها — وكان أبو عبيدة وجّهه — وقف على بابها على فرس له كميت فصالحوه على أن لهم هيكلهم وما حوله وعلى أن لا يحدثوا كنيسة إلا ما كان لهم وعلى معونة المسلمين على عدوهم، فإن تركوا شيئاً مما شرط عليهم فلا ذمة لهم؛ ودخل أهل الجزيرة فيما دخل فيه أهل الرها."
  en: "In al-Baladhuri through al-Nufayli from Sulayman ibn Ata: when Iyad ibn Ghanm took al-Ruha — Abu Ubayda had sent him — he stood at its gate on a chestnut horse and they compounded with him on the terms that their great church and its surroundings were theirs, that they raise no new church beyond what they had, and that they aid the Muslims against their enemy — any of these left unkept and they had no dhimma; and the people of the Jazira entered into what Edessa's people entered into."
