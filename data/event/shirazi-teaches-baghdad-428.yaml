label:
  ar: "بدء التدريس في مساجد بغداد، ٤٢٨هـ"
  en: "The start of al-Shirazi's teaching in the mosques of Baghdad, 428/1036"
  ur: "بغداد کی مسجدوں میں شیرازی کے تدریس کا آغاز، 428ھ/1036ء"
summary:
  ar: "سنة ٤٢٨هـ بدأت مسيرة أبي إسحاق الشيرازي الطويلة في التدريس، أولاً في مساجد بغداد ثم من سنة ٤٥٩هـ في المدرسة النظامية التي شيّدها له نظام الملك؛ وتصفه التراجم رقيقاً ظريفاً وديعاً حيّاً في زهد، وأنه كان «غضنفراً في المناظرة» {cite:encyclopaedia-of-islam-2 vol. 9 pp. 494-495}."
  en: "In 428/1036 Abu Ishaq al-Shirazi's long teaching career began, first in various mosques of Baghdad and then, from 459/1066, in the Nizamiyya madrasa built for him by Nizam al-Mulk; the biographers portray him as gentle, refined and affable, living a life of asceticism, and 'a lion of the disputatio' {cite:encyclopaedia-of-islam-2 vol. 9 pp. 494-495}."
  ur: "428ھ/1036ء میں ابو اسحاق شیرازی کی طویل تدریسی خدمات کا آغاز ہوا، پہلے بغداد کی مختلف مسجدوں میں پھر 459ھ/1066ء سے نظام الملک کی بنائی ہوئی نظامیہ مدرسہ میں؛ تراجم انھیں نفیس، مہذب اور زاہدانہ زندگی کا حامل بتاتی ہیں اور «مناظرہ کا شیر» {cite:encyclopaedia-of-islam-2 vol. 9 pp. 494-495}۔"
