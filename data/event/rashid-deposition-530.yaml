id: event/rashid-deposition-530
class: event
kind: other
label: { ar: "خلع الراشد بالله بالمحضر الفقهي", en: "The deposition of al-Rashid billah by a jurists' attestation", es: "La declaración de al-Rashid billah mediante la certificación de juristas.", fr: "La déposition d'al-Rashid billah par une attestation de juristes", ur: "فقہا کی تصدیق سے الرشید باللہ کا بیان" }
summary:
  ar: "لما عاد السلطان مسعود إلى بغداد خرج الراشد إلى الموصل فأحضروا القضاة والأعيان والعلماء وكتبوا محضراً فيه شهادة طائفة بما جرى من الراشد من الظلم وأخذ الأموال وسفك الدماء وشرب الخمر واستفتوا الفقهاء فيمن فعل ذلك هل تصح إمامته وهل إذا ثبت فسقه يجوز لسلطان الوقت أن يخلعه فأفتوا بجواز خلعه وحكم بخلعه ابن الكرخي قاضي البلد وبايعوا عمه محمد بن المستظهر ولقب المقتفي لأمر الله في سادس عشر ذي القعدة سنة ثلاثين، وقال ابن الجوزي وقد ذكر الصولي أن الناس يقولون إن كل سادس يقوم للناس يخلع فتأملت هذا فرأيته عجباً {cite:tarikh-khulafa-minhaj-1434 p. 669-670}."
  en: "On sultan Mas'ud's return, al-Rashid went out to Mosul; the judges, notables and scholars wrote an instrument of testimony — injustice, seizure of wealth, bloodshed, wine — and asked the jurists whether such a one's imamate holds and whether the sultan of the day may depose him. They fatwa'd the deposition lawful; Ibn al-Karkhi, judge of the city, ruled it, and his uncle Muhammad ibn al-Mustazhir was hailed al-Muqtafi on 16 Dhu'l-Qa'da 530. Ibn al-Jawzi cites al-Suli: people say every sixth caliph is deposed {cite:tarikh-khulafa-minhaj-1434 p. 669-670}."
  es: "Al regreso del sultán Mas'ud, al-Rashid fue a Mosul; los jueces, notables y eruditos escribieron un instrumento de testimonio —injusticia, confiscación de riquezas, derramamiento de sangre, vino— y preguntaron a los juristas si el imamato de tal persona se mantenía y si el sultán de turno podía deponerlo. Ellos declararon lícita la deposición; Ibn al-Karkhi, juez de la ciudad, la gobernó, y su tío Muhammad ibn al-Mustazhir fue aclamado como al-Muqtafi el 16 de Dhu'l-Qa'da de 530. Ibn al-Jawzi cita a al-Suli: la gente dice que cada sexto califa es depuesto {cite:tarikh-khulafa-minhaj-1434 p. 669-670}."
  fr: "Au retour du sultan Massoud, al-Rachid se rendit à Mossoul. Les juges, notables et érudits rédigèrent un acte de témoignage – mentionnant injustices, confiscations de biens, effusions de sang et corruption – et consultèrent les juristes sur la validité de l'imamat de l'intéressé et sur la légitimité de sa destitution par le sultan en exercice. Ils approuvèrent la destitution par fatwa. Ibn al-Karkhi, juge de la ville, la gouverna, et son oncle, Muhammad ibn al-Mustazhir, fut proclamé al-Muqtafi le 16 Dhu al-Qa'da 530. Ibn al-Jawzi cite al-Suli: « On dit que tous les six califes sont déposés » (voir: Tarikh-Khulafa-Minhaj-1434, p. 669-670)."
  ur: "سلطان مسعود کی واپسی پر الرشید موصل کی طرف نکل گیا۔ ججوں، معززین اور علماء نے گواہی کا ایک آلہ لکھا - ناانصافی، دولت کی ضبطی، خونریزی، شراب - اور فقہاء سے پوچھا کہ کیا اس کی امامت ہے اور کیا اس دن کا سلطان اسے معزول کرسکتا ہے۔ انہوں نے بیان حلال کا فتویٰ دیا۔ شہر کے قاضی ابن الکرخی نے اس کا فیصلہ دیا اور اس کے چچا محمد بن المستضیر کو 16 ذوالقعدہ 530 کو المقطفی کہا گیا۔ ابن الجوزی نے السلی کا حوالہ دیا: لوگ کہتے ہیں کہ ہر چھٹا خلیفہ معزول ہوتا ہے۔ 669-670}۔"
