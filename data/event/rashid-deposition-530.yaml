label: { ar: "خلع الراشد بالله بالمحضر الفقهي" }
summary:
  ar: "لما عاد السلطان مسعود إلى بغداد خرج الراشد إلى الموصل فأحضروا القضاة والأعيان والعلماء وكتبوا محضراً فيه شهادة طائفة بما جرى من الراشد من الظلم وأخذ الأموال وسفك الدماء وشرب الخمر واستفتوا الفقهاء فيمن فعل ذلك هل تصح إمامته وهل إذا ثبت فسقه يجوز لسلطان الوقت أن يخلعه فأفتوا بجواز خلعه وحكم بخلعه ابن الكرخي قاضي البلد وبايعوا عمه محمد بن المستظهر ولقب المقتفي لأمر الله في سادس عشر ذي القعدة سنة ثلاثين، وقال ابن الجوزي وقد ذكر الصولي أن الناس يقولون إن كل سادس يقوم للناس يخلع فتأملت هذا فرأيته عجباً {cite:tarikh-khulafa-minhaj-1434 p. 669-670}."
  en: "On sultan Mas'ud's return, al-Rashid went out to Mosul; the judges, notables and scholars wrote an instrument of testimony — injustice, seizure of wealth, bloodshed, wine — and asked the jurists whether such a one's imamate holds and whether the sultan of the day may depose him. They fatwa'd the deposition lawful; Ibn al-Karkhi, judge of the city, ruled it, and his uncle Muhammad ibn al-Mustazhir was hailed al-Muqtafi on 16 Dhu'l-Qa'da 530. Ibn al-Jawzi cites al-Suli: people say every sixth caliph is deposed {cite:tarikh-khulafa-minhaj-1434 p. 669-670}."
