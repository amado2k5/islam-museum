id: event/mahdi-zindiq-inquisition
class: event
kind: persecution
label: { ar: "تتبع الزنادقة في عهد المهدي", en: "Pursuit of the zanadiqa under al-Mahdi", es: "La búsqueda de la zanadiqa bajo al-Mahdi", fr: "Poursuite de la zanadiqa sous al-Mahdi", ur: "المہدی کے تحت زنادقہ کا حصول", tr: "Mehdi'nin hükümdarlığı döneminde sapkınların takibi", id: "Perburuan terhadap kaum sesat selama pemerintahan Mahdi" }
summary:
  ar: "تتبع المهدي الزنادقة وأفنى منهم خلقاً كثيراً، وهو أول من أمر بتصنيف كتب الجدل في الرد على الزنادقة والملحدين، وفي سنة ست وستين ومئة وما بعدها جد في تتبعهم وإبادتهم والبحث عنهم في الآفاق وقتل على التهمة {cite:tarikh-khulafa-minhaj-1434 p. 440,443}."
  en: "Al-Mahdi hunted down the zanadiqa and destroyed a great many of them — he was the first to commission books of polemic in refutation of the zanadiqa and the atheists; in year 166 and after he redoubled the pursuit, searching for them in the furthest lands and killing on mere suspicion {cite:tarikh-khulafa-minhaj-1434 p. 440,443}."
  es: "Al-Mahdi persiguió a los zanadiqa y destruyó a muchos de ellos; fue el primero en encargar libros de polémica para refutar a los zanadiqa y a los ateos; en el año 166 y después redobló la persecución, buscándolos en las tierras más lejanas y matándolos por mera sospecha {cite:tarikh-khulafa-minhaj-1434 p. 440,443}."
  fr: "Al-Mahdi traqua les zanadiqa et en détruisit un grand nombre — il fut le premier à commander des livres de polémique réfutant les zanadiqa et les athées; en l'an 166 et après, il redoubla la poursuite, les recherchant dans les terres les plus reculées et les tuant sur simple suspicion {cite:tarikh-khulafa-minhaj-1434 p. 440,443}."
  ur: "المہدی نے زندیقہ کا شکار کیا اور ان میں سے بہت سے لوگوں کو تباہ کر دیا - وہ پہلا شخص تھا جس نے زنادیقہ اور ملحدوں کی تردید میں بحث کی کتابیں لکھیں۔ سن 166 میں اور اس نے تعاقب کو دوگنا کرنے کے بعد، دور دراز علاقوں میں ان کی تلاش کی اور محض شک کی بنیاد پر قتل کر دیا۔ 440,443}۔"
  tr: "El-Mehdi, sapkınların peşine düştü ve birçoğunu yok etti. Sapkınlara ve ateistlere karşı argüman kitaplarının sınıflandırılmasını emreden ilk kişiydi. 166 yılından sonra, onları takip etmek, yok etmek, ufuklarda aramak ve şüphe üzerine öldürmek konusunda gayretliydi. {cite:tarikh-khulafa-minhaj-1434 s. 440,443}"
  id: "Al-Mahdi memburu kaum bid'ah dan menghancurkan banyak dari mereka. Beliau adalah orang pertama yang memerintahkan pengklasifikasian buku-buku argumentasi sebagai tanggapan terhadap kaum bid'ah dan ateis. Pada tahun 166 dan setelahnya, beliau tekun memburu mereka, menghancurkan mereka, mencari mereka di cakrawala, dan membunuh mereka atas dasar kecurigaan. {cite:tarikh-khulafa-minhaj-1434 p. 440,443}."
