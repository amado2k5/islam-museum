label: { ar: "وصية أبي أيوب الأنصاري بدفنه في أرض الروم وقبره عند القسطنطينية", en: "Abu Ayyub al-Ansari's request to be buried in enemy land, and his grave at Constantinople", ur: "ابو ایوب انصاری کی دشمن کی سرزمین میں دفن ہونے کی وصیت اور قسطنطنیہ میں قبر", es: "La petición de Abu Ayyub al-Ansari de ser enterrado en territorio enemigo, y su tumba en Constantinopla.", fr: "La demande d'Abu Ayyub al-Ansari d'être enterré en territoire ennemi et sa tombe à Constantinople", tr: "Ebu Eyyub el-Ensari'nin vasiyeti, Roma topraklarında defnedilmek ve mezarının Konstantinopolis yakınlarında olmasıdır.", id: "Wasiat Abu Ayyub al-Ansari untuk dimakamkan di tanah Romawi, dan makamnya berada di dekat Konstantinopel." }
summary:
  ar: "لما غزا أبو أيوب الأنصاري زمن معاوية ومرض، قال لأصحابه إذا مات حملوه، وإذا صافّوا العدو دفنوه تحت أقدامهم {cite:siyar-alam-nubala scan vol. 1 p. 1595}. وفي رواية أخرى أمرهم بركوب الخيل حتى يلقوا العدو ثم يحفروا له ويدفنوه ويسوّوه حتى لا يُعرف، وأن يخبروا الناس أن النبي أخبره أنه لا يدخل النار من قال لا إله إلا الله {cite:siyar-alam-nubala scan vol. 1 p. 1596}. ويذكر الواقدي أنه مات سنة اثنتين وخمسين وصلى عليه يزيد ودُفن عند أصل حصن القسطنطينية، وأن الروم يتعاهدون قبره ويستسقون به {cite:siyar-alam-nubala scan vol. 1 p. 1596}. ويذكر ابن كثير قولاً بأن على قبره مزاراً ومسجداً {cite:al-bidaya-wal-nihaya scan vol. 4 p. 424}."
  en: "When Abu Ayyub al-Ansari raided in Mu'awiya's time and fell ill, he told his companions to carry him when he died and to bury him under their feet when they lined up against the enemy {cite:siyar-alam-nubala scan vol. 1 p. 1595}. Another report has him bid them ride on until they met the enemy, then dig, bury and level the grave so it would not be known, and tell people that the Prophet had told him no one who says there is no god but God enters the Fire {cite:siyar-alam-nubala scan vol. 1 p. 1596}. Al-Waqidi says he died in 52, Yazid prayed over him and he was buried at the foot of the fortress of Constantinople, and that the Romans tend his grave and seek rain by it {cite:siyar-alam-nubala scan vol. 1 p. 1596}. Ibn Kathir records a report that a shrine and mosque stand over his grave {cite:al-bidaya-wal-nihaya scan vol. 4 p. 424}."
  ur: "جب ابو ایوب انصاری معاویہ کے زمانے میں جہاد کے لیے نکلے اور بیمار ہوئے تو اپنے ساتھیوں سے کہا کہ مرنے پر مجھے اٹھا لے چلنا اور جب دشمن کے مقابل صف بنا لو تو مجھے اپنے قدموں تلے دفن کر دینا {cite:siyar-alam-nubala scan vol. 1 p. 1595}۔ ایک دوسری روایت میں ہے کہ انھوں نے کہا کہ گھوڑے دوڑاتے ہوئے دشمن سے جا ملو، پھر میرے لیے قبر کھودو، دفن کرو اور برابر کر دو تاکہ پہچانی نہ جائے، اور لوگوں کو بتانا کہ نبی نے انھیں خبر دی تھی کہ لا الہ الا اللہ کہنے والا آگ میں داخل نہ ہوگا {cite:siyar-alam-nubala scan vol. 1 p. 1596}۔ واقدی کہتے ہیں کہ وہ ۵۲ ہجری میں فوت ہوئے، یزید نے نماز پڑھائی اور انھیں قسطنطنیہ کے قلعے کی بنیاد کے پاس دفن کیا گیا، اور رومی ان کی قبر کی دیکھ بھال کرتے اور اس کے وسیلے سے بارش مانگتے ہیں {cite:siyar-alam-nubala scan vol. 1 p. 1596}۔ ابن کثیر ایک قول نقل کرتے ہیں کہ ان کی قبر پر زیارت گاہ اور مسجد ہے {cite:al-bidaya-wal-nihaya scan vol. 4 p. 424}۔"
  es: "Cuando Abu Ayyub al-Ansari realizó una incursión en tiempos de Mu'awiya y enfermó, les dijo a sus compañeros que lo llevaran consigo cuando muriera y que lo enterraran bajo sus pies cuando se alinearan contra el enemigo {cite:siyar-alam-nubala scan vol. 1 p. 1595}. Otro relato dice que les ordenó que siguieran cabalgando hasta encontrarse con el enemigo, que luego cavaran, enterraran y nivelaran la tumba para que no se supiera, y que dijeran a la gente que el Profeta le había dicho que nadie que diga que no hay más dios que Dios entra en el Fuego {cite:siyar-alam-nubala scan vol. 1 p. 1596}. Al-Waqidi dice que murió en el año 52, que Yazid oró por él y que fue enterrado al pie de la fortaleza de Constantinopla, y que los romanos cuidaban su tumba y buscaban la lluvia junto a ella {cite:siyar-alam-nubala scan vol. 1 p. 1596}. Ibn Kathir registra un informe que indica que un santuario y una mezquita se encuentran sobre su tumba {cite:al-bidaya-wal-nihaya scan vol. 4 p. 424}."
  fr: "Lorsqu'Abu Ayyub al-Ansari mena un raid sous le règne de Mu'awiya et tomba malade, il ordonna à ses compagnons de le porter à sa mort et de l'enterrer sous leurs pieds lorsqu'ils se rassembleraient face à l'ennemi (Siyar-alam-nubala, vol. 1, p. 1595). Selon un autre récit, il leur aurait ordonné de poursuivre leur route jusqu'à rencontrer l'ennemi, puis de creuser, d'enterrer et de niveler la tombe afin qu'elle reste secrète, et de dire à tous que le Prophète lui avait dit que quiconque nie la divinité entre en Feu (Siyar-alam-nubala, vol. 1, p. 1596). Al-Waqidi rapporte qu'il mourut en 52, que Yazid pria sur lui et qu'il fut enterré au pied de la forteresse de Constantinople, et que les Romains entretenaient sa tombe et imploraient la pluie à proximité (Siyar-alam-nubala, vol. 1, p. 1596). Ibn Kathir rapporte qu'un sanctuaire et une mosquée se dressent au-dessus de sa tombe {cite:al-bidaya-wal-nihaya scan vol. 4 p. 424}."
  tr: "Muaviye döneminde Ebu Eyyub el-Ensari bir sefere çıktığında hastalanmış ve arkadaşlarına, \"Ölürsem beni taşıyın, düşmanla karşılaşırsak beni ayaklarımızın altına gömün\" demiştir. Başka bir rivayette ise, düşmanla karşılaşana kadar atlarına binmelerini, sonra kendisi için bir mezar kazıp gömmelerini ve tanınmaması için toprağı düzleştirmelerini emretmiştir. Ayrıca, Peygamberin kendisine \"Allah'tan başka ilah yoktur\" diyen kimsenin cehenneme girmeyeceğini söylediğini halka bildirmelerini de tembih etmiştir. El-Vakidi, onun Hicri 52 yılında öldüğünü ve Yezid'in cenaze namazını kıldırdığını belirtir. İstanbul kalesinin eteğine gömülmüş ve Romalıların mezarını sık sık ziyaret ederek oradan yağmur diledikleri söylenir. İbn Kathir, mezarının üzerine bir türbe ve cami inşa edildiğine dair bir ifadeyi aktarır. 424}"
  id: "Ketika Abu Ayyub al-Ansari memimpin sebuah kampanye pada masa pemerintahan Mu'awiyah dan jatuh sakit, ia berkata kepada para sahabatnya, \"Jika aku mati, bawalah aku, dan jika kita menghadapi musuh, kuburkan aku di bawah kaki kita.\" Dalam riwayat lain, ia memerintahkan mereka untuk menunggang kuda hingga bertemu musuh, kemudian menggali kuburan untuknya, menguburkannya, dan meratakan tanah agar ia tidak dikenali. Ia juga menginstruksikan mereka untuk memberitahu orang-orang bahwa Nabi telah mengatakan kepadanya bahwa tidak seorang pun yang mengucapkan \"Tidak ada Tuhan selain Allah\" akan masuk Neraka. Al-Waqidi menyebutkan bahwa ia meninggal pada tahun 52 Hijriah, dan Yazid memimpin salat jenazah untuknya. Ia dimakamkan di kaki benteng Konstantinopel, dan orang-orang Romawi sering mengunjungi makamnya dan memohon hujan melalui makam tersebut. Ibn Kathir menyebutkan sebuah pernyataan bahwa ada sebuah kuil dan sebuah masjid yang dibangun di atas makamnya. 424}."
