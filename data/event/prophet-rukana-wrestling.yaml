label:
  ar: مصارعة النبي لركانة
  en: The Prophet's wrestling bout with Rukana
  ur: نبی کی رکانہ سے کشتی
  es: "El combate de lucha libre del Profeta con Rukana"
summary:
  ar: 'روى ابن إسحاق أن النبي دعا ركانة بن عبد يزيد المطلبي إلى الإسلام وقال له: «أرأيت إن صرعتك أتعلم أن ذلك حق؟» فقال: نعم،
    فصرعه مرتين {cite:sira-ibn-ishaq-zakkar p. 276}؛ وأورد ابن حجر الخبر في الإصابة مع كلام على سنده {cite:ibn-hajar-isaba}.'
  en: Ibn Ishaq narrates that the Prophet called Rukana ibn Abd Yazid al-Muttalibi to Islam and asked «If I throw you, will
    you know that it is true?»; Rukana agreed and the Prophet threw him twice {cite:sira-ibn-ishaq-zakkar p. 276}; Ibn Hajar
    carries the report in al-Isaba with discussion of its chain {cite:ibn-hajar-isaba}.
  ur: ابن اسحاق روایت کرتے ہیں کہ نبی نے رکانہ بن عبد یزید مطلبی کو اسلام کی دعوت دی اور فرمایا «اگر میں تمہیں پچھاڑ دوں تو
    کیا تم جان لو گے؟»؛ رکانہ نے ہاں کہی اور آپ نے انہیں دو مرتبہ پچھاڑا {cite:sira-ibn-ishaq-zakkar p. 276}؛ ابن حجر نے اصابہ
    میں یہ خبر سند کی بحث کے ساتھ نقل کی {cite:ibn-hajar-isaba}۔
  es: "Ibn Ishaq narra que el Profeta llamó a Rukana ibn Abd Yazid al-Muttalibi al Islam y le preguntó: «Si te arrojo, ¿sabrás que es verdad?»; Rukana aceptó y el Profeta lo arrolló dos veces {cite:sira-ibn-ishaq-zakkar p. 276}; Ibn Hajar recoge el relato en al-Isaba con una discusión sobre su cadena de transmisión {cite:ibn-hajar-isaba}."
