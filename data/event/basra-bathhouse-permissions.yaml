label: { ar: "إذن الحمامات بالبصرة", en: "The Basra Bathhouse Permissions", fr: "Les autorisations de bains à Bassora", es: "Permisos para los baños termales de Basora", ur: "بصرہ غسل خانہ کی اجازت", tr: "Basra'daki hamamlar işte böyle.", id: "Jadi, pemandian di Basra" }
summary:
  ar: "كان مسلم بن أبي بكرة يغتال من حمامه في كل يوم ألف درهم وطعاماً كثيراً فلما مرض أوصى إلى أخيه عبد الرحمن وأخبره بغلة حمامه فأفشى ذلك واستأذن السلطان في بناء حمام فأذن له وكانت الحمامات لا تبنى بالبصرة إلا بإذن الولاة فاستأذن عبيد الله بن أبي بكرة والحكم بن أبي العاص وسياه الأسواري والحصين بن أبي الحر العنبري وريطة بنت زياد ولبابة بنت أوفى الجرشي في حمامين والمنجاب بن راشد الضبي فأذن لهم وأفاق مسلم من مرضه وقد فسدت عليه غلة حمامه فجعل يلوم عبد الرحمن ويقول ما له قطع الله رحمه."
  en: "Muslim ibn Abi Bakra drew a thousand dirhams and much food daily from his bathhouse; sick, he willed it to his brother Abd al-Rahman and told him the yield — who disclosed it and asked the Sultan's leave to build his own, baths being built at Basra only by the governors' permission. Leave followed for Ubaydallah ibn Abi Bakra, al-Hakam ibn Abi al-As, Siyah al-Uswari, al-Husayn ibn Abi al-Hurr al-Anbari, Rayta bint Ziyad, Lababa bint Awfa al-Jarashi for two, and al-Munjab ibn Rashid; Muslim recovered to find his yield ruined and kept saying 'may God cut his mercy'."
  fr: "Muslim ibn Abi Bakra tirait chaque jour de son bain mille dirhams et beaucoup de nourriture ; malade, il le légua à son frère Abd al-Rahman et lui en dit le rendement ; celui-ci le divulgua et demanda au Sultan la permission de construire le sien, les bains ne se construisant à Bassora qu'avec la permission des gouverneurs. Des permissions suivirent pour Ubaydallah ibn Abi Bakra, al-Hakam ibn Abi al-As, Siyah al-Uswari, al-Husayn ibn Abi al-Hurr al-Anbari, Rayta bint Ziyad, Lababa bint Awfa al-Jarashi pour deux, et al-Munjab ibn Rashid ; Muslim guérit pour trouver son rendement ruiné et ne cessait de dire « que Dieu lui retranche Sa miséricorde »."
  es: "Muslim ibn Abi Bakra obtenía diariamente mil dirhams y abundante comida de sus baños. Enfermo, se los legó a su hermano Abd al-Rahman y le informó de las ganancias, quien las reveló y solicitó permiso al sultán para construir los suyos, ya que en Basora solo se construían baños con la autorización de los gobernadores. Posteriormente, se concedió permiso a Ubaydallah ibn Abi Bakra, al-Hakam ibn Abi al-As, Siyah al-Uswari, al-Husayn ibn Abi al-Hurr al-Anbari, Rayta bint Ziyad, Lababa bint Awfa al-Jarashi (dos personas) y al-Munjab ibn Rashid. Muslim se recuperó y descubrió que sus ganancias se habían arruinado, repitiendo una y otra vez: «Que Dios nos libre de su misericordia»."
  ur: "مسلم بن ابی بکرہ اپنے حمام سے روزانہ ایک ہزار درہم اور بہت سا کھانا نکالتا تھا۔ بیمار تھا، اس نے اسے اپنے بھائی عبدالرحمٰن کو وصیت کی اور اسے پیداوار بتائی - جس نے اس کا انکشاف کیا اور سلطان سے اجازت طلب کی کہ وہ اپنا اپنا حمام بصرہ میں صرف گورنروں کی اجازت سے بنائے جائیں۔ عبیداللہ ابن ابی بکرہ، الحکم ابن ابی العاص، سیاح العسویری، الحسین ابن ابی الحر الانباری، رائتہ بنت زیاد، لبابہ بنت عوفۃ الجراشی کے لیے دو، اور المنبع کے لیے چھوڑ دیں۔ مسلمان اپنی پیداوار کو برباد پا کر صحت یاب ہو گیا اور کہتا رہا کہ خدا اس کی رحمت کو کاٹ دے۔"
  tr: "Müslim ibn Abi Bakra her gün hamamından bin dirhem ve bol miktarda yiyecek çalardı. Hastalandığında mal varlığını kardeşi Abdülrahman'a miras bıraktı ve hamamından elde ettiği geliri ona anlattı. Abdülrahman bunu açıkladı ve Sultan'dan hamam inşa etmek için izin istedi ve Sultan da ona izin verdi. Basra'da hamamlar valilerin izni olmadan inşa edilmezdi. Bu yüzden Ubeydullah ibn Abi Bakra, el-Hakam ibn Abi el-As, Siyah el-Aswari, el-Hüseyn ibn Abi el-Hur el-Anbari, Rayta bint Ziyad, Lubaba bint Evfe el-Cerşi'den iki hamam için ve el-Münceb ibn Raşid el-Dabbi'den izin istedi ve Sultan onlara da izin verdi. Müslim hastalığından iyileşmişti, ancak hamamından elde ettiği gelir mahvolmuştu. Bunun üzerine Abdülrahman'ı suçlamaya başladı ve \"Onun neyi var? Allah onun akrabalık bağlarını koparsın\" dedi."
  id: "Muslim ibn Abi Bakra biasa mencuri seribu dirham dan banyak makanan dari pemandiannya setiap hari. Ketika ia jatuh sakit, ia mewariskan hartanya kepada saudaranya, Abd al-Rahman, dan menceritakan tentang pendapatan dari pemandiannya. Abd al-Rahman membocorkan hal ini dan meminta izin kepada Sultan untuk membangun pemandian, dan Sultan memberikannya izin. Pemandian tidak dibangun di Basra kecuali dengan izin gubernur. Maka ia meminta izin kepada Ubayd Allah ibn Abi Bakra, al-Hakam ibn Abi al-As, Siyah al-Aswari, al-Husayn ibn Abi al-Hur al-Anbari, Rayta bint Ziyad, Lubaba bint Awfa al-Jarshi untuk dua pemandian, dan al-Munjab ibn Rashid al-Dabbi, dan Sultan memberikan izin kepada mereka. Muslim sembuh dari sakitnya, dan pendapatan dari rumah mandinya hancur, sehingga ia mulai menyalahkan Abd al-Rahman dan berkata, “Ada apa dengannya? Semoga Allah memutuskan hubungan kekerabatannya.”"
