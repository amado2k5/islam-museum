summary:
  ar: "عند البلاذري: لما فرغ أبو بكر من أمر أهل الردة رأى توجيه الجيوش إلى الشام فكتب إلى أهل مكة والطائف واليمن وجميع العرب بنجد والحجاز يستنفرهم للجهاد ويرغبهم في غنائم الروم فسارعوا من كل أوب، فعقد ثلاثة ألوية لثلاثة رجال — خالد بن سعيد بن العاص، وشرحبيل بن حسنة ⁦(عند الواقدي ابن عبد الله بن المطاع الكندي وحسنة أمه، وعند الكلبي ابن ربيعة بن المطاع من ولد صوفة)⁩، وعمرو بن العاص السهمي — وكان عقده هذه الألوية يوم الخميس لمستهل صفر سنة 13 بعد مقام الجيوش معسكرين بالجرف المحرم كله، وأبو عبيدة بن الجراح يصلي بهم، وقد أراد أبو بكر أبا عبيدة أن يعقد له فاستعفاه — وروي أنه عقد له وليس بثابت — وذكر أبو يخنف أن أبا بكر قال للأمراء إن اجتمعتم على قتال فأميركم أبو عبيدة وإلا فيزيد بن أبي سفيان، وذُكر أن عمراً إنما كان مدداً للمسلمين وأميراً على من ضُمّ إليه؛ فلما عقد لخالد بن سعيد كرهه عمر وكلم أبا بكر في عزله وقال إنه رجل فخور يحمل أمره على المغالبة والتعصب فعزله ووجّه أبا أدوى الدوسي لأخذ لوائه فلقيه بذي المروة فأخذه منه فدفعه إلى يزيد بن أبي سفيان فسار به ومعاوية أخوه يحمله بين يديه — وقيل بل سُلّم إليه بذي المروة فمضى على جيش خالد، وسار خالد بن سعيد محتسباً في جيش شرحبيل؛ وأمر عمراً أن يسلك طريق أيلة عامداً لفلسطين، ويزيد طريق تبوك، وشرحبيل طريق تبوك أيضاً؛ وكان المقد لكل أمير في بدء الأمر ثلاثة آلاف رجل فلم يزل يتبعهم الأمداد حتى صار مع كل أمير سبعة آلاف وخمسمائة ثم تتامّ جمعهم أربعة وعشرين ألفاً؛ وروي عن الواقدي أن أبا بكر ولّى عمراً فلسطين وشرحبيل الأردن ويزيد دمشق، وقال إذا كان بكم قتال فأميركم الذي تكونون في عمله، وروي أيضاً أنه أمر عمراً مشافهةً أن يصلي بالناس."
  en: "In al-Baladhuri: when Abu Bakr had finished with the apostates he resolved to direct the armies to Syria, writing to the people of Mecca, al-Ta'if, Yemen and all the Arabs of Najd and the Hijaz summoning them to jihad and stirring their desire for Byzantine spoil, and they hastened from every quarter; he bound three banners for three men — Khalid ibn Sa'id ibn al-As, Shurahbil ibn Hasana (per al-Waqidi son of Abdullah ibn al-Mutta' al-Kindi with Hasana his mother, per al-Kalbi son of Rabi'a ibn al-Mutta' of the children of Sufa) and Amr ibn al-As al-Sahmi — the binding being on Thursday at the opening of Safar year 13, after the armies had camped at al-Jurf the whole of al-Muharram, with Abu Ubayda ibn al-Jarrah leading their prayers; Abu Bakr had wanted to bind a banner for Abu Ubayda who begged off — some report he did bind it, which is not established — and Abu Yakhnaf records Abu Bakr telling the commanders 'if you join in battle your commander is Abu Ubayda, otherwise Yazid ibn Abi Sufyan', while Amr is said to have been only a reinforcement and commander over those joined to him; when he bound Khalid ibn Sa'id's banner Umar disliked it and spoke to Abu Bakr of deposing him — 'he is a proud man who carries his charge with contentiousness and partisanship' — so he deposed him and sent Abu Adwa' al-Dawsi to take his banner, who met him at Dhu al-Marwa and took it, and it was given to Yazid ibn Abi Sufyan, who marched with his brother Mu'awiya bearing it before him — others say it was handed to him at Dhu al-Marwa and he took over Khalid's army, Khalid ibn Sa'id marching on as a volunteer in Shurahbil's army; he ordered Amr to take the Ayla road toward Filastin, Yazid the Tabuk road and Shurahbil likewise; each commander set out with three thousand men, then he kept sending reinforcements until each had seven thousand five hundred, and their total completed at twenty-four thousand; al-Waqidi reports Abu Bakr gave Amr Filastin, Shurahbil al-Urdunn and Yazid Dimashq — 'if you have fighting, your commander is the one in whose charge you stand' — and that he ordered Amr verbally to lead the people in prayer."
  es: "En al-Baladhuri: cuando Abu Bakr hubo terminado con los apóstatas, resolvió dirigir los ejércitos a Siria, escribiendo a la gente de La Meca, al-Ta'if, Yemen y a todos los árabes de Najd y el Hiyaz, convocándolos a la yihad y avivando su deseo de botín bizantino, y se apresuraron desde todas partes; ató tres estandartes para tres hombres: Khalid ibn Sa'id ibn al-As, Shurahbil ibn Hasana (por al-Waqidi hijo de Abdullah ibn al-Mutta' al-Kindi con Hasana su madre, por al-Kalbi hijo de Rabi'a ibn al-Mutta' de los hijos de Sufa) y Amr ibn al-As al-Sahmi; la atadura fue el jueves al comienzo del Safar del año 13, después de que los ejércitos hubieran acampado en al-Jurf durante todo al-Muharram, con Abu Ubayda ibn al-Jarrah dirigiendo sus oraciones; Abu Bakr había querido atar un estandarte para Abu Ubayda, quien se negó a participar; algunos informan que lo hizo, aunque esto no está comprobado. Abu Yakhnaf registra que Abu Bakr les dijo a los comandantes: \"Si se unen a la batalla, su comandante es Abu Ubayda; de lo contrario, Yazid ibn Abi Sufyan\". Se dice que Amr solo era un refuerzo y comandante de los que se unieron a él. Cuando ató el estandarte de Khalid ibn Sa'id, a Umar no le gustó y habló con Abu Bakr sobre deponerlo: «es un hombre orgulloso que lleva su cargo con disputa y parcialidad». Así que lo depuso y envió a Abu Adwa' al-Dawsi a tomar su estandarte, quien lo encontró en Dhu al-Marwa y lo tomó, y fue entregado a Yazid ibn Abi Sufyan, quien marchó con su hermano Mu'awiya llevándolo delante de él. Otros dicen que fue entregado en Dhu al-Marwa y que tomó el mando del ejército de Khalid, mientras que Khalid ibn Sa'id marchó como voluntario en el ejército de Shurahbil; ordenó a Amr que tomara el camino de Ayla hacia Filastin, a Yazid el camino de Tabuk y a Shurahbil de igual manera; cada comandante partió con tres mil hombres, luego siguió enviando refuerzos hasta que cada uno tuvo siete mil quinientos, y su total se completó en veinticuatro mil; Al-Waqidi relata que Abu Bakr le dio a Amr Filastin, Shurahbil al-Urdunn y Yazid Dimashq la instrucción de que \"si tenéis que luchar, vuestro comandante es aquel bajo cuyo mando estáis\" y que le ordenó verbalmente a Amr que dirigiera al pueblo en la oración."
  fr: "Dans al-Baladhuri: lorsqu'Abu Bakr eut fini avec les apostats, il résolut de diriger les armées vers la Syrie, écrivant aux habitants de La Mecque, d'al-Ta'if, du Yémen et à tous les Arabes du Najd et du Hedjaz les appelant au jihad et attisant leur désir de butin byzantin, et ils accoururent de toutes parts; il a attaché trois bannières pour trois hommes — Khalid ibn Sa'id ibn al-As, Shurahbil ibn Hasana (selon al-Waqidi, fils d'Abdullah ibn al-Mutta' al-Kindi, avec Hasana sa mère, selon al-Kalbi, fils de Rabi'a ibn al-Mutta' des enfants de Sufa) et Amr ibn al-As al-Sahmi — l'attachement ayant lieu le jeudi au début de l'année Safar 13, après que les armées eurent campé à al-Jurf pendant tout le mois d'al-Muharram, avec Abu Ubayda ibn al-Jarrah dirigeant leurs prières; Abou Bakr avait voulu fixer une bannière pour Abou Ubayda qui a décliné l'offre — certains rapportent qu'il l'a finalement fixée, ce qui n'est pas établi — et Abou Yakhnaf rapporte qu'Abou Bakr a dit aux commandants: « Si vous participez à la bataille, votre commandant est Abou Ubayda, sinon Yazid ibn Abi Sufyan », tandis qu'Amr n'aurait été qu'un renfort et un commandant pour ceux qui l'ont rejoint; Lorsque Umar attacha l'étendard de Khalid ibn Sa'id, il le désapprouva et parla à Abu Bakr de le destituer — « c'est un homme orgueilleux qui exerce ses fonctions avec querelle et esprit de parti » — il le destitua donc et envoya Abu Adwa' al-Dawsi récupérer son étendard. Ce dernier le rencontra à Dhu al-Marwa, s'en empara et le remit à Yazid ibn Abi Sufyan, qui marcha avec son frère Mu'awiya, le portant devant lui — d'autres disent qu'il le reçut à Dhu al-Marwa. Il prit alors le commandement de l'armée de Khalid, tandis que Khalid ibn Sa'id continuait sa marche comme volontaire dans l'armée de Shurahbil. Il ordonna à Amr de prendre la route d'Ayla vers Filastin, à Yazid celle de Tabuk et à Shurahbil de faire de même. Chaque commandant partit avec trois mille hommes, puis il continua d'envoyer des renforts jusqu'à ce que chacun en compte sept mille cinq cents, portant leur total à vingt-quatre mille. al-Waqidi rapporte qu'Abu Bakr a dit à Amr Filastin, Shurahbil al-Urdunn et Yazid Dimashq: « Si vous devez combattre, votre commandant est celui sous la responsabilité duquel vous vous tenez », et qu'il a ordonné verbalement à Amr de diriger la prière du peuple."
  ur: "البلادوری میں ہے: جب ابوبکر نے مرتدین سے فارغ ہونے کا ارادہ کیا تو انہوں نے لشکروں کو شام کی طرف بھیجنے کا عزم کیا، مکہ، الطائف، یمن اور نجد اور حجاز کے تمام عربوں کو خط لکھ کر انہیں جہاد کے لیے بلایا اور بازنطینی مال غنیمت کی خواہش کو ابھارا، اور انہوں نے ہر طرف سے جلدی کی۔ اس نے تین آدمیوں کے لیے تین جھنڈے باندھے - خالد بن سعید ابن العاص، شورابیل ابن حسنہ ⁦(فی الواقیدی ولد عبداللہ ابن المطع الکندی اپنی والدہ حسنہ کے ساتھ، فی الکلبی ولد ربیعہ ابن المطع - بنی سفیان النساء النساء النساء النساء)⁩ جمعرات کو صفر 13 کے آغاز پر، جب فوجوں نے پورے محرم میں الجرف میں ڈیرے ڈالے تھے، ابو عبیدہ بن الجراح ان کی نماز کی امامت کر رہے تھے۔ ابوبکر نے ابو عبیدہ کے لیے ایک جھنڈا باندھنا چاہا تھا جس نے بھیک مانگی تھی - کچھ کہتے ہیں کہ انھوں نے اسے باندھ دیا تھا، جو ثابت نہیں ہے - اور ابو یخنف نے ابو بکر کو کمانڈروں سے کہا تھا کہ 'اگر تم جنگ میں شامل ہو تو تمہارا کمانڈر ابو عبیدہ ہے، ورنہ یزید بن ابی سفیان'، جب کہ عمرو کے بارے میں کہا جاتا ہے کہ وہ صرف ان کی کمک میں شامل ہونے کے لیے کمانڈر تھے۔ جب اس نے خالد بن سعید کا جھنڈا باندھا تو عمر نے اسے ناپسند کیا اور ابوبکر سے ان کو معزول کرنے کی بات کہی - 'وہ ایک متکبر آدمی ہے جو جھگڑا اور تعصب کا ذمہ دار ہے' - تو اس نے اسے معزول کر دیا اور ابو عدوا الدوسی کو اس کا جھنڈا لینے کے لیے بھیجا، جس نے ذو المروہ میں اس سے ملاقات کی اور اسے مرثیبی اور صوفی کو دے دیا، جس نے اسے لے لیا۔ اپنے بھائی معاویہ کے ساتھ اسے اپنے سامنے اٹھائے ہوئے تھے - دوسروں کا کہنا ہے کہ اسے ذی المروہ میں دیا گیا تھا اور اس نے خالد کی فوج کو سنبھال لیا تھا، خالد بن سعید شورابیل کی فوج میں رضاکار کے طور پر آگے بڑھ رہے تھے۔ اس نے عمرو کو حکم دیا کہ عائلہ کا راستہ فلاسطین، یزید کو تبوک روڈ اور شورابیل کی طرف لے جائے۔ ہر ایک کمانڈر تین ہزار آدمیوں کے ساتھ روانہ ہوا، پھر وہ کمک بھیجتا رہا یہاں تک کہ ہر ایک کو سات ہزار پانچ سو ہو گئے اور ان کی کل تعداد چوبیس ہزار ہو گئی۔ الواقدی بیان کرتے ہیں کہ ابوبکر نے عمرو فلاسطین، شورابیل الاردن اور یزید دمشق - 'اگر تم سے لڑائی ہو تو تمہارا کمانڈر وہ ہے جس کے ذمہ تم کھڑے ہو' - اور یہ کہ اس نے عمرو کو زبانی حکم دیا کہ وہ لوگوں کو نماز پڑھائیں۔"
  tr: "El-Baladhuri'ye göre: Ebu Bekir mürtedlerle işini bitirdikten sonra Suriye'ye ordular göndermeye karar verdi. Mekke, Taif, Yemen ve Necd ile Hicaz'daki tüm Araplara mektuplar yazarak onları cihat etmeye çağırdı ve Romalılardan elde edilen savaş ganimetleriyle onları cesaretlendirdi. Her yönden akın ettiler. Üç kişiye üç komutan atadı: Halid ibn Sa'id ibn el-As, Şurahbil ibn Hasana (el-Vakidi'ye göre, Hasana annesi olan ibn Abdullah ibn el-Muta' el-Kindi; el-Kalbi'ye göre, Sufah soyundan gelen ibn Rabi'a ibn el-Muta') ve Amr ibn el-As el-Sahmi. Bu komutanları, ordular Muharrem'in el-Curuf'unda kamp kurduktan sonra, Hicri 13. yılın Safer ayının ilk Perşembe günü atadı. Ebu Ubeyde ibn el-Cerrah onlara namaz kıldırdı. Ebu Bekir, Ebu Ubeyde'nin onu atamasını istemişti, ancak o reddetti. Ayrıca onu atadığı da rivayet edilir, ancak bu kesin değildir. Ebu Yaknaf, Ebu Bekir'in komutanlara, \"Eğer savaşmayı kabul ederseniz, komutanınız Ebu Ubeyde'dir; aksi takdirde, Yazid ibn Ebu Sufyan'dır\" dediğini aktarmıştır. Amr'ın sadece Müslümanlar için bir takviye ve... olanların komutanı olduğu belirtilmiştir. O da buna eklendi; Ömer Halid bin Said'i atadığında, Ömer ondan hoşlanmadı ve Ebu Bekir'e onu görevden almaktan bahsetti, onun kibirli, işlerini rekabet ve fanatizmle yürüten bir adam olduğunu söyledi. Bunun üzerine Ebu Bekir onu görevden aldı ve sancağını almak için Ebu Adve el-Davsi'yi gönderdi. Ebu Adve el-Davsi, Zülmerve'de onunla buluştu, sancağı ondan aldı ve Yezid bin Ebu Sufyan'a verdi. Yezid sancakla birlikte yürüdü ve kardeşi Muaviye onu önünde taşıdı - hatta Zülmerve'de kendisine teslim edildiği söylenir - böylece Yezid'in ordusuyla birlikte ilerledi ve Halid bin Said, Şurahbil'in ordusunda ödül arayarak yürüdü; Ömer'e Filistin'e doğru giden Ayla yolunu, Yezid'e Tebük yolunu ve Şurahbil'e de Tebük yolunu izlemelerini emretti. Başlangıçta her komutanın emrinde üç bin kişi vardı ve takviyeler gelmeye devam etti, ta ki her komutanın emrinde yedi bin beş yüz kişi olana kadar; daha sonra sayıları yirmi dört bine ulaştı. Vakidi'den rivayet edildiğine göre, Ebu Bekir Ömer'i Filistin'e, Şurahbil'i Ürdün'e ve Yezid'i Şam'a atadı ve \"Aranızda kavga çıkarsa, komutanınız bulunduğunuz bölgenin komutanı olacaktır\" dedi. Ayrıca Ömer'e sözlü olarak halkı namaza imamlık etmesini emrettiği de rivayet edilmiştir."
  id: "Menurut al-Baladhuri: Ketika Abu Bakr selesai menangani kaum murtad, ia memutuskan untuk mengirim pasukan ke Suriah. Ia menulis surat kepada penduduk Mekah, Ta'if, Yaman, dan semua orang Arab di Najd dan Hijaz, mendesak mereka untuk berjihad dan menyemangati mereka dengan rampasan perang dari Romawi. Mereka bergegas dari segala arah. Ia menunjuk tiga komandan untuk tiga orang: Khalid ibn Sa'id ibn al-'As, Shurahbil ibn Hasana (menurut al-Waqidi, ibn 'Abd Allah ibn al-Muta' al-Kindi, Hasana adalah ibunya; menurut al-Kalbi, ibn Rabi'a ibn al-Muta', keturunan Sufah), dan 'Amr ibn al-'As al-Sahmi. Beliau menunjuk para komandan ini pada hari Kamis, tanggal satu Safar tahun 13 Hijriah, setelah pasukan berkemah di al-Juruf al-Muharram. Abu 'Ubayda ibn al-Jarrah memimpin mereka dalam salat. Abu Bakr ingin Abu 'Ubayda menunjuknya, tetapi ia menolak. Diriwayatkan juga bahwa beliau memang menunjuknya, tetapi hal ini tidak terbukti. Abu Yakhnaf menyebutkan bahwa Abu Bakr berkata kepada para komandan, \"Jika kalian setuju untuk berperang, komandan kalian adalah Abu 'Ubayda; jika tidak, komandan kalian adalah Yazid ibn Abi Sufyan.\" Disebutkan bahwa 'Amr hanyalah bala bantuan bagi kaum Muslimin dan komandan atas mereka yang... Ia ditambahkan ke dalamnya; Maka ketika ia mengangkat Khalid bin Saeed, Umar tidak menyukainya dan berbicara kepada Abu Bakr tentang pemecatannya, dengan mengatakan bahwa ia adalah orang yang sombong yang menjalankan urusannya berdasarkan persaingan dan fanatisme, maka ia memecatnya dan mengirim Abu Adwa al-Dawsi untuk mengambil panjinya, lalu ia bertemu dengannya di Dhu al-Marwa dan mengambilnya darinya lalu memberikannya kepada Yazid bin Abi Sufyan, lalu Yazid berbaris dengan panji itu dan Muawiya, saudaranya, membawanya di depannya — dan dikatakan bahwa panji itu diserahkan kepadanya di Dhu al-Marwa, lalu ia melanjutkan perjalanan dengan pasukan Khalid, dan Khalid bin Saeed berbaris, mencari imbalan, dalam pasukan Syurabil; dan ia memerintahkan Umar untuk mengambil jalan ke Ayla menuju Palestina, dan Yazid jalan ke Tabuk, dan Syurabil jalan ke Tabuk juga; dan komandan dari setiap komandan pada awalnya berjumlah tiga ribu orang, dan bala bantuan terus menyusul mereka sampai setiap komandan memiliki tujuh ribu lima ratus orang, kemudian jumlah mereka bertambah menjadi dua puluh empat ribu; dan diriwayatkan dari al-Waqidi bahwa Abu Bakr menunjuk Umar ke Palestina, Shurahbil ke Yordania, dan Yazid ke Damaskus, dan beliau berkata, “Jika terjadi pertempuran di antara kalian, maka komandan kalian adalah orang yang wilayah hukumnya kalian berada,” dan diriwayatkan juga bahwa beliau memerintahkan Umar secara lisan untuk memimpin orang-orang dalam salat."
