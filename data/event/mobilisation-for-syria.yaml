label: { ar: "توجيه جيوش الشام", en: "The Dispatch of the Armies to Syria" }
summary:
  ar: "عند البلاذري: لما فرغ أبو بكر من أمر أهل الردة رأى توجيه الجيوش إلى الشام فكتب إلى أهل مكة والطائف واليمن وجميع العرب بنجد والحجاز يستنفرهم للجهاد ويرغبهم في غنائم الروم فسارعوا من كل أوب، فعقد ثلاثة ألوية لثلاثة رجال — خالد بن سعيد بن العاص، وشرحبيل بن حسنة (عند الواقدي ابن عبد الله بن المطاع الكندي وحسنة أمه، وعند الكلبي ابن ربيعة بن المطاع من ولد صوفة)، وعمرو بن العاص السهمي — وكان عقده هذه الألوية يوم الخميس لمستهل صفر سنة 13 بعد مقام الجيوش معسكرين بالجرف المحرم كله، وأبو عبيدة بن الجراح يصلي بهم، وقد أراد أبو بكر أبا عبيدة أن يعقد له فاستعفاه — وروي أنه عقد له وليس بثابت — وذكر أبو يخنف أن أبا بكر قال للأمراء إن اجتمعتم على قتال فأميركم أبو عبيدة وإلا فيزيد بن أبي سفيان، وذُكر أن عمراً إنما كان مدداً للمسلمين وأميراً على من ضُمّ إليه؛ فلما عقد لخالد بن سعيد كرهه عمر وكلم أبا بكر في عزله وقال إنه رجل فخور يحمل أمره على المغالبة والتعصب فعزله ووجّه أبا أدوى الدوسي لأخذ لوائه فلقيه بذي المروة فأخذه منه فدفعه إلى يزيد بن أبي سفيان فسار به ومعاوية أخوه يحمله بين يديه — وقيل بل سُلّم إليه بذي المروة فمضى على جيش خالد، وسار خالد بن سعيد محتسباً في جيش شرحبيل؛ وأمر عمراً أن يسلك طريق أيلة عامداً لفلسطين، ويزيد طريق تبوك، وشرحبيل طريق تبوك أيضاً؛ وكان المقد لكل أمير في بدء الأمر ثلاثة آلاف رجل فلم يزل يتبعهم الأمداد حتى صار مع كل أمير سبعة آلاف وخمسمائة ثم تتامّ جمعهم أربعة وعشرين ألفاً؛ وروي عن الواقدي أن أبا بكر ولّى عمراً فلسطين وشرحبيل الأردن ويزيد دمشق، وقال إذا كان بكم قتال فأميركم الذي تكونون في عمله، وروي أيضاً أنه أمر عمراً مشافهةً أن يصلي بالناس."
  en: "In al-Baladhuri: when Abu Bakr had finished with the apostates he resolved to direct the armies to Syria, writing to the people of Mecca, al-Ta'if, Yemen and all the Arabs of Najd and the Hijaz summoning them to jihad and stirring their desire for Byzantine spoil, and they hastened from every quarter; he bound three banners for three men — Khalid ibn Sa'id ibn al-As, Shurahbil ibn Hasana (per al-Waqidi son of Abdullah ibn al-Mutta' al-Kindi with Hasana his mother, per al-Kalbi son of Rabi'a ibn al-Mutta' of the children of Sufa) and Amr ibn al-As al-Sahmi — the binding being on Thursday at the opening of Safar year 13, after the armies had camped at al-Jurf the whole of al-Muharram, with Abu Ubayda ibn al-Jarrah leading their prayers; Abu Bakr had wanted to bind a banner for Abu Ubayda who begged off — some report he did bind it, which is not established — and Abu Yakhnaf records Abu Bakr telling the commanders 'if you join in battle your commander is Abu Ubayda, otherwise Yazid ibn Abi Sufyan', while Amr is said to have been only a reinforcement and commander over those joined to him; when he bound Khalid ibn Sa'id's banner Umar disliked it and spoke to Abu Bakr of deposing him — 'he is a proud man who carries his charge with contentiousness and partisanship' — so he deposed him and sent Abu Adwa' al-Dawsi to take his banner, who met him at Dhu al-Marwa and took it, and it was given to Yazid ibn Abi Sufyan, who marched with his brother Mu'awiya bearing it before him — others say it was handed to him at Dhu al-Marwa and he took over Khalid's army, Khalid ibn Sa'id marching on as a volunteer in Shurahbil's army; he ordered Amr to take the Ayla road toward Filastin, Yazid the Tabuk road and Shurahbil likewise; each commander set out with three thousand men, then he kept sending reinforcements until each had seven thousand five hundred, and their total completed at twenty-four thousand; al-Waqidi reports Abu Bakr gave Amr Filastin, Shurahbil al-Urdunn and Yazid Dimashq — 'if you have fighting, your commander is the one in whose charge you stand' — and that he ordered Amr verbally to lead the people in prayer."
