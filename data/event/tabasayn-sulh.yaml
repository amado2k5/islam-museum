label: { ar: "صلح الطبسين وفتح باب خراسان", en: "The Tabasayn Treaty — Khurasan's Gate", es: "El Tratado de Tabasayn: la puerta de Khurasan", fr: "Le Traité de Tabasayn – La Porte du Khurasan", ur: "تباسین معاہدہ - خراسان کا دروازہ" }
summary:
  ar: "وجه أبو موسى الأشعري عبد الله بن بديل بن ورقاء الخزاعي غازياً فأتى كرمان ومضى حتى بلغ الطبسين وهما حصنان يقال لأحدهما طبس وللآخر قرين وهما جرم فيهما نخل وهما باب خراسان فأصاب مغنماً وأتى قوم من أهل الطبسين عمر بن الخطاب فصالحوه على ستين ألفاً ويقال خمسة وسبعين ألفاً وكتب لهم كتاباً ويقال بل توجه عبد الله بن بديل من أصبهان من تلقاء نفسه."
  en: "Abu Musa al-Ash'ari sent Abdallah ibn Budayl ibn Warqa' al-Khuza'i raiding through Kirman to the Tabasayn — two fortresses, Tabas and Qurayn, a palm-bearing jurm that is the gate of Khurasan — where he took booty; men of the Tabasayn came to Umar ibn al-Khattab and truced for sixty thousand, some say seventy-five, and were given a writ. Another telling has Ibn Budayl going of his own accord from Isbahan."
  es: "Abu Musa al-Ash'ari envió a Abdallah ibn Budayl ibn Warqa' al-Khuza'i a saquear a través de Kirman hasta los Tabasayn —dos fortalezas, Tabas y Qurayn, un jurm con palmeras que es la puerta de Jorasán— donde tomó botín; los hombres de los Tabasayn fueron a ver a Umar ibn al-Khattab y firmaron una tregua por sesenta mil, algunos dicen setenta y cinco, y recibieron un decreto. Otra versión cuenta que Ibn Budayl partió por su propia voluntad desde Isbahan."
  fr: "Abou Moussa al-Ash'ari envoya Abdallah ibn Budayl ibn Warqa' al-Khuza'i piller Kirman jusqu'aux Tabasayn — deux forteresses, Tabas et Qurayn, un jurm orné de palmiers qui marque la porte du Khorasan — où il s'empara d'un butin. Les hommes des Tabasayn se présentèrent ensuite auprès d'Umar ibn al-Khattab et négocièrent une trêve pour soixante mille, voire soixante-quinze selon certains, et reçurent un mandat. Une autre version rapporte qu'Ibn Budayl partit de son propre chef d'Isbahan."
  ur: "ابو موسیٰ اشعری نے عبداللہ بن بدیل بن ورقع الخزاعی کو کرمان کے راستے تبسائین کی طرف چھاپہ مارنے کے لیے بھیجا - دو قلعے، طبس اور قرائن، ایک کھجور والا جرم جو خراسان کا دروازہ ہے - جہاں اس نے مال غنیمت لیا۔ تبسائین کے لوگ عمر بن الخطاب کے پاس آئے اور ساٹھ ہزار، بعض کا کہنا ہے کہ 75، اور انہیں ایک تحریر دی گئی۔ ایک اور روایت ابن بدیل نے اسبہان سے اپنی مرضی سے کی ہے۔"
