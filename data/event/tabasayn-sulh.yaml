label: { ar: "صلح الطبسين وفتح باب خراسان", en: "The Tabasayn Treaty — Khurasan's Gate" }
summary:
  ar: "وجه أبو موسى الأشعري عبد الله بن بديل بن ورقاء الخزاعي غازياً فأتى كرمان ومضى حتى بلغ الطبسين وهما حصنان يقال لأحدهما طبس وللآخر قرين وهما جرم فيهما نخل وهما باب خراسان فأصاب مغنماً وأتى قوم من أهل الطبسين عمر بن الخطاب فصالحوه على ستين ألفاً ويقال خمسة وسبعين ألفاً وكتب لهم كتاباً ويقال بل توجه عبد الله بن بديل من أصبهان من تلقاء نفسه."
  en: "Abu Musa al-Ash'ari sent Abdallah ibn Budayl ibn Warqa' al-Khuza'i raiding through Kirman to the Tabasayn — two fortresses, Tabas and Qurayn, a palm-bearing jurm that is the gate of Khurasan — where he took booty; men of the Tabasayn came to Umar ibn al-Khattab and truced for sixty thousand, some say seventy-five, and were given a writ. Another telling has Ibn Budayl going of his own accord from Isbahan."
