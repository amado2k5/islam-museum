summary:
  ar: "قتل محمد بن أبي حذيفة بمصر: كان كفيل عثمان وتربيته وقد حدّه في شراب ثم تنسّك، وشهد ذات الصواري، وطعن على عثمان وألب المصريين عليه حتى ساروا إلى المدينة، واستولى على مصر وأخرج عنها عبد الله بن سعد عامل عثمان، وردّ هدية عثمان من ثلاثين ألف درهم قائلًا ألا ترون إلى عثمان يخادعني عن ديني ويرشوني عليه. وروي أن معاوية وعمرو بن العاص خدعاه فخرج إلى العريش في ألف رجل فنصبا عليه المنجنيق حتى نزل في ثلاثين من أصحابه فقتل، وقد شكك ابن الأثير في هذا الخبر لأن استيلاء معاوية وعمرو على مصر كان بعد صفين لا قبلها {cite:kamil-ibn-al-athir p. 620-621}."
  en: "Muḥammad ibn Abī Ḥudhayfa — orphaned at al-Yamāma, raised by ʿUthmān, flogged for drink and then turned ascetic — agitated the Egyptians against his foster-father, returned ʿUthmān's gift of 30,000 dirhams crying «do you not see ʿUthmān deceiving me about my religion and bribing me over it?«, expelled governor ʿAbdallāh ibn Saʿd and held Egypt himself. One report has Muʿāwiya and ʿAmr ibn al-ʿĀṣ luring him to al-ʿArīsh, mangoneling him out, and killing him with thirty companions — a chronology Ibn al-Athīr himself rejects, since the conquest of Egypt came after Ṣiffīn {cite:kamil-ibn-al-athir p. 620-621}."
