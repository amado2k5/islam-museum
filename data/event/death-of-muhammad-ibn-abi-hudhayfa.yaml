label: { ar: "مقتل محمد بن أبي حذيفة بمصر", en: "the killing of Muḥammad ibn Abī Ḥudhayfa in Egypt (36 AH, disputed)", es: "el asesinato de Muḥammad ibn Abī Ḥudhayfa en Egipto (36 AH, en disputa)", fr: "le meurtre de Muḥammad ibn Abī Ḥudhayfa en Égypte (36 AH, contesté)", ur: "مصر میں محمد بن ابی حذیفہ کا قتل ⁦(36ھ، متنازعہ)⁩" }
date:
  start: { edtf: "0656", hijri: "0036", calendar: julian, precision: year, status: tradition, derived: true, note: "سنة 36؛ التحويل مشتق {cite:kamil-ibn-al-athir p. 620-621}." }
summary:
  ar: "قتل محمد بن أبي حذيفة بمصر: كان كفيل عثمان وتربيته وقد حدّه في شراب ثم تنسّك، وشهد ذات الصواري، وطعن على عثمان وألب المصريين عليه حتى ساروا إلى المدينة، واستولى على مصر وأخرج عنها عبد الله بن سعد عامل عثمان، وردّ هدية عثمان من ثلاثين ألف درهم قائلًا ألا ترون إلى عثمان يخادعني عن ديني ويرشوني عليه. وروي أن معاوية وعمرو بن العاص خدعاه فخرج إلى العريش في ألف رجل فنصبا عليه المنجنيق حتى نزل في ثلاثين من أصحابه فقتل، وقد شكك ابن الأثير في هذا الخبر لأن استيلاء معاوية وعمرو على مصر كان بعد صفين لا قبلها {cite:kamil-ibn-al-athir p. 620-621}."
  en: "Muḥammad ibn Abī Ḥudhayfa — orphaned at al-Yamāma, raised by ʿUthmān, flogged for drink and then turned ascetic — agitated the Egyptians against his foster-father, returned ʿUthmān's gift of 30,000 dirhams crying «do you not see ʿUthmān deceiving me about my religion and bribing me over it?«, expelled governor ʿAbdallāh ibn Saʿd and held Egypt himself. One report has Muʿāwiya and ʿAmr ibn al-ʿĀṣ luring him to al-ʿArīsh, mangoneling him out, and killing him with thirty companions — a chronology Ibn al-Athīr himself rejects, since the conquest of Egypt came after Ṣiffīn {cite:kamil-ibn-al-athir p. 620-621}."
  es: "Muḥammad ibn Abī Ḥudhayfa —huérfano en al-Yamāma, criado por ʿUthmān, azotado por beber y luego convertido en asceta— incitó a los egipcios contra su padre adoptivo, devolvió el regalo de ʿUthmān de 30.000 dirhams gritando «¿Acaso no veis cómo ʿUthmān me engaña sobre mi religión y me soborna por ella?», expulsó al gobernador ʿAbdallāh ibn Saʿd y gobernó Egipto él mismo. Un relato cuenta que Muʿāwiya y ʿAmr ibn al-ʿĀṣ lo atrajeron a al-ʿArīsh, lo sacaron a empalamiento y lo mataron con treinta compañeros; una cronología que el propio Ibn al-Athīr rechaza, ya que la conquista de Egipto tuvo lugar después de Ṣiffīn {cite:kamil-ibn-al-athir p. 620-621}."
  fr: "Muḥammad ibn Abī Ḥudhayfa — orphelin à al-Yamāma, élevé par ʿUthmān, fouetté pour avoir bu puis devenu ascète — agita les Égyptiens contre son père adoptif, retourna le cadeau de ʿUthmān de 30 000 dirhams en criant « ne voyez-vous pas ʿUthmān me tromper au sujet de ma religion et me corrompre à ce sujet ? », expulsa le gouverneur ʿAbdallāh ibn Saʿd et prit le contrôle de l'Égypte. Un récit rapporte que Muʿāwiya et ʿAmr ibn al-ʿĀṣ l'ont attiré à al-ʿArīsh, l'ont mangonné et l'ont tué avec trente compagnons — une chronologie qu'Ibn al-Athīr lui-même rejette, puisque la conquête de l'Égypte est survenue après Ṣiffīn {cite:kamil-ibn-al-athir p. 620-621}."
  ur: "محمد بن ابی حذیفہ - یمامہ میں یتیم، عثمان نے پرورش کی، شراب پینے پر کوڑے مارے اور پھر سنیاسی بن گئے - مصریوں کو اپنے رضاعی باپ کے خلاف مشتعل کیا، عثمان کا 30,000 درہم کا تحفہ واپس کر دیا جس کے بارے میں آپ مجھے روتے نہیں دیکھ رہے تھے۔ مذہب اور اس پر مجھے رشوت دے رہے ہیں؟\"، گورنر عبداللہ بن سعد کو نکال دیا اور مصر کو خود سنبھال لیا۔ ایک روایت میں ہے کہ معاویہ اور عمرو بن العاص نے اسے العریش کی طرف راغب کیا، اسے باہر نکال دیا، اور اسے تیس ساتھیوں کے ساتھ قتل کر دیا، جسے ابن الاثیر خود رد کرتے ہیں، چونکہ مصر کی فتح صِفِیْنِ الْقَیْطِنِیْنَ کے بعد ہوئی تھی۔ 620-621}۔"
