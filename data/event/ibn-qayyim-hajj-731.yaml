label:
  ar: "حج ابن قيم الجوزية في قافلة الشام، ٧٣١هـ/١٣٣١م"
  en: "Ibn Qayyim's pilgrimage with the Syrian caravan, 731/1331"
  ur: "ابن قیم کا حج، شامی قافلے کے ساتھ، 731ھ/1331ء"
summary:
  ar: "حجّ ابن قيم الجوزية سنة ٧٣١هـ/١٣٣١-١٣٣٢م؛ ويُروى أن قافلة الشام التي خرجت من دمشق بقيادة الأمير عز الدين أيبك ضمّت عدداً كبيراً من الفقهاء والمحدّثين {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}."
  en: "Ibn Qayyim al-Jawziyya made the pilgrimage to Mecca in 731/1331-2; the Syrian caravan that left Damascus under the leadership of the amir Izz al-Din Aybak is said to have included a considerable number of jurisconsults and traditionists {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}."
  ur: "ابن قیم الجوزیہ نے 731ھ/1331-2ء میں حج کیا؛ کہا جاتا ہے کہ امیر عز الدین ایبک کی قیادت میں دمشق سے روانہ ہونے والے شامی قافلے میں فقہا اور محدثین کی بڑی تعداد شامل تھی {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}۔"
