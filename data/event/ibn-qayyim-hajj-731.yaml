label:
  ar: "حج ابن قيم الجوزية في قافلة الشام، ٧٣١هـ/١٣٣١م"
  en: "Ibn Qayyim's pilgrimage with the Syrian caravan, 731/1331"
  ur: "ابن قیم کا حج، شامی قافلے کے ساتھ، 731ھ/1331ء"
  es: "La peregrinación de Ibn Qayyim con la caravana siria, 731/1331"
  fr: "Le pèlerinage d'Ibn Qayyim avec la caravane syrienne, 731/1331"
  tr: "İbn Kayyım el-Cevziyye, Hac ziyaretini Suriye'den bir kervanla gerçekleştirdi, 731 H./1331"
  id: "Ibnu Qayyim al-Jawziyya menunaikan ibadah haji dengan kafilah dari Syam, 731 H/1331 M."
summary:
  ar: "حجّ ابن قيم الجوزية سنة ٧٣١هـ/١٣٣١-١٣٣٢م؛ ويُروى أن قافلة الشام التي خرجت من دمشق بقيادة الأمير عز الدين أيبك ضمّت عدداً كبيراً من الفقهاء والمحدّثين {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}."
  en: "Ibn Qayyim al-Jawziyya made the pilgrimage to Mecca in 731/1331-2; the Syrian caravan that left Damascus under the leadership of the amir Izz al-Din Aybak is said to have included a considerable number of jurisconsults and traditionists {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}."
  ur: "ابن قیم الجوزیہ نے 731ھ/1331-2ء میں حج کیا؛ کہا جاتا ہے کہ امیر عز الدین ایبک کی قیادت میں دمشق سے روانہ ہونے والے شامی قافلے میں فقہا اور محدثین کی بڑی تعداد شامل تھی {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}۔"
  es: "Ibn Qayyim al-Jawziyya realizó la peregrinación a La Meca en 731/1331-2; se dice que la caravana siria que partió de Damasco bajo el liderazgo del emir Izz al-Din Aybak incluía un número considerable de juristas y tradicionalistas {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}."
  fr: "Ibn Qayyim al-Jawziyya fit le pèlerinage à La Mecque en 731/1331-2; la caravane syrienne qui quitta Damas sous la direction de l'émir Izz al-Din Aybak aurait inclus un nombre considérable de jurisconsultes et de traditionnistes {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}."
  tr: "İbn Kayyim el-Cevziyye, Hicri 731/Miladi 1331-1332 yılında Hac ibadetini yerine getirmiştir; ve rivayete göre, Prens İzz el-Din Aybak önderliğinde Şam'dan yola çıkan Levant kervanında çok sayıda fıkıhçı ve hadis âlimi bulunmaktaydı. {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}"
  id: "Ibn Qayyim al-Jawziyya melaksanakan ibadah haji pada tahun 731 H/1331-1332 M; dan diriwayatkan bahwa kafilah dari Levant yang berangkat dari Damaskus di bawah pimpinan Pangeran Izz al-Din Aybak mencakup sejumlah besar ahli fiqih dan ulama hadits {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}."
