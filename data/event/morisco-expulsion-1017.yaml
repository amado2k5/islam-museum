label: { ar: "إخراج الموريسكيين من الأندلس", en: "Expulsion of the Moriscos from al-Andalus", es: "Expulsión de los moriscos de al-Ándalus", fr: "Expulsion des Morisques d'al-Andalus", ur: "موریسکو کو اندلس سے نکال باہر کرنا", tr: "Moriskoların Endülüs'ten sürülmesi", id: "Pengusiran kaum Morisco dari Andalusia" }
summary:
  ar: "عند المقري أن النصارى أخرجوا من بقي من مسلمي الأندلس بهذا العصر القريب أعوام سبعة عشر وألف، بعد أن كانوا يعبدون الله في خفية ويصلّون فشدد عليهم النصارى في البحث حتى أحرقوا منهم كثيراً ومنعوهم من حمل السكين الصغيرة فضلاً عن غيرها من الحديد، وقاموا في بعض الجبال على النصارى مراراً ولم يُقيض الله لهم ناصراً؛ فخرجت ألوف بفاس وألوف أخر بتلمسان من وهران وجمهورهم خرج بتونس، فتسلط عليهم الأعراب ومن لا يخشى الله في الطرقات ونهبوا أموالهم ونجا القليل من هذه المعرة في بلاد تلمسان وفاس، وأما الذين خرجوا بنواحي تونس فسلم أكثرهم وعمروا قراها وبلادها وكذلك بتطاوين وسلا ومتيجة الجزائر، ولما استخدم سلطان المغرب الأقصى منهم عسكراً جراراً وسكنوا سلا كان منهم من الجهاد في البحر ما هو مشهور وحصنوا قلعة سلا وبنوا بها القصور والدور والحمامات، ووصل جماعة إلى القسطنطينية العظمى وإلى مصر والشام وغيرها من بلاد الإسلام {cite:nafh-tib-maqqari p. 528}."
  en: "Al-Maqqari records the near-contemporary expulsion of the Moriscos 'in this recent era, in the year 1017': thousands landed at Fez, Tlemcen and Tunis, robbed on the roads by Arabs — the Tunis-bound mostly prospered; those settled at Sale by the Maghreb sultan fortified its castle, built palaces and became famed for jihad at sea — the corsairs of Sale {cite:nafh-tib-maqqari p. 528}."
  es: "Al-Maqqari registra la expulsión casi contemporánea de los moriscos \"en esta época reciente, en el año 1017\": miles de ellos desembarcaron en Fez, Tlemcen y Túnez, siendo robados en los caminos por los árabes; los que se dirigieron a Túnez prosperaron en su mayoría; los que se asentaron en Salé por el sultán del Magreb fortificaron su castillo, construyeron palacios y se hicieron famosos por la yihad en el mar: los corsarios de Salé {cite:nafh-tib-maqqari p. 528}."
  fr: "Al-Maqqari relate l'expulsion quasi contemporaine des Morisques « à cette époque récente, en l'an 1017 »: des milliers débarquèrent à Fès, Tlemcen et Tunis, pillés sur les routes par des Arabes — ceux qui se rendaient à Tunis prospérèrent pour la plupart; ceux qui s'installèrent à Salé sous le sultan du Maghreb fortifièrent son château, construisirent des palais et devinrent célèbres pour leur jihad en mer — les corsaires de Salé {cite:nafh-tib-maqqari p. 528}."
  ur: "المقاری نے 'اس حالیہ دور میں، سال 1017 میں' موریسکوس کے قریب قریب عصری اخراج کو ریکارڈ کیا: ہزاروں لوگ فیز، تلمسن اور تیونس میں اترے، عربوں نے سڑکوں پر لوٹ مار کی - تیونس سے تعلق رکھنے والے زیادہ تر خوشحال؛ مغرب سلطان کی طرف سے سیل پر آباد ہونے والوں نے اس کے قلعے کو مضبوط کیا، محلات بنائے اور سمندر میں جہاد کے لیے مشہور ہوئے۔ 528}۔"
  tr: "El-Makri'ye göre, Hristiyanlar, 1017 yılında, gizlice Tanrı'ya ibadet edip dua eden Endülüs'ün geri kalan Müslümanlarını kovdular. Hristiyanlar, onları arama faaliyetlerini yoğunlaştırarak birçoğunu yaktılar ve küçük bir bıçak bile taşımalarına izin vermediler, demir eşyalardan bahsetmeye bile gerek yok. Bazı dağlarda Hristiyanlara karşı defalarca ayaklandılar, ancak Tanrı onlara bir yardımcı göndermedi. Binlercesi Oran'dan Fez'e, binlercesi de Tlemcen'e gitti ve çoğunluğu Tunus'a gitti. Bedeviler ve Tanrı'dan korkmayanlar yollarda onlara saldırdılar ve paralarını yağmaladılar. Birkaç kişi Tlemcen ve Fez topraklarında bu rezaletten kurtuldu. Tunus bölgelerine gidenlerin çoğu güvende kaldı ve köylerini ve topraklarını, ayrıca Cezayir'in Tetouan, Salé ve Mitidja bölgelerini yeniden inşa ettiler. Uzak Mağrip Sultanı, onların arasından büyük bir ordu toplayıp Salé'ye yerleştiğinde, içlerinden bazıları denizde ünlü bir cihat yapmış, Salé kalesini tahkim etmiş ve içinde saraylar, evler ve hamamlar inşa etmişlerdir. Bir kısmı ise Büyük Konstantinopolis'e, Mısır'a, Levant'a ve diğer İslam topraklarına ulaşmıştır. {cite:nafh-tib-maqqari s. 528}"
  id: "Menurut Al-Maqri, orang-orang Kristen mengusir sisa-sisa Muslim Andalusia pada era modern ini, pada tahun 1017, setelah mereka beribadah kepada Tuhan secara diam-diam dan berdoa. Orang-orang Kristen meningkatkan pencarian mereka hingga membakar banyak dari mereka dan melarang mereka membawa pisau kecil sekalipun, apalagi benda-benda besi lainnya. Mereka berulang kali memberontak melawan orang-orang Kristen di beberapa pegunungan, tetapi Tuhan tidak memberi mereka pertolongan. Ribuan orang pergi ke Fez dan ribuan lainnya ke Tlemcen dari Oran, dan sebagian besar dari mereka pergi ke Tunis. Orang-orang Badui dan mereka yang tidak takut kepada Tuhan menyerang mereka di jalan dan menjarah harta benda mereka. Beberapa orang lolos dari penghinaan ini di tanah Tlemcen dan Fez. Adapun mereka yang pergi ke wilayah Tunis, sebagian besar dari mereka selamat dan mereka membangun kembali desa-desa dan tanah mereka, serta di Tetouan, Salé dan Mitidja di Aljazair. Ketika Sultan Maghreb yang jauh mengerahkan pasukan besar dari antara mereka dan mereka menetap di Salé, beberapa dari mereka melakukan jihad yang terkenal di laut, dan mereka membentengi benteng Salé dan membangun istana, rumah, dan pemandian di dalamnya. Sekelompok dari mereka mencapai Konstantinopel Agung dan Mesir dan Levant dan negeri-negeri Islam lainnya. {cite:nafh-tib-maqqari p. 528}."
