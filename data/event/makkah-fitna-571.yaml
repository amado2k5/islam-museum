label: { ar: "فتنة مكة وعزل مكثر بن عيسى", en: "The Mecca fitna and deposition of Mukaththir (571 AH)", es: "La fitna de La Meca y la deposición de Mukathtir (571 AH)", fr: "La fitna de La Mecque et la déposition de Mukaththir (571 AH)" }
summary:
  ar: "في ذي الحجة سنة إحدى وسبعين وخمسمائة كان بمكة حرب شديدة بين أمير الحاج طاشتكين وبين الأمير مكثر بن عيسى أمير مكة، وكان الخليفة قد أمر أمير الحاج بعزل مكثر وإقامة أخيه داود مقامه لبنائه قلعة على جبل أبي قبيس؛ فلم يبت الحاج بالمزدلفة بل اجتازوا بها ورمى بعضهم الجمار وهو سائر، ونزلوا الأبطح فخرج إليهم ناس من أهل مكة فحاربوهم وقتل من الفريقين جماعة وصاح الناس الغزاة إلى مكة فهجموا عليها؛ وهرب مكثر إلى قلعته على جبل أبي قبيس فحُصر بها ثم فارقها وسار عن مكة وولي أخوه داود الإمارة، ونهب الحاج كثيراً وأخذوا من أموال التجار المقيمين بها شيئاً كثيراً وأحرقوا دوراً كثيرة — ومن أعجبها أن رجلاً أزرق أحرق داراً لأيتام بقارورة نفط فلما ذهب ليضرب بأخرى أصابها حجر فكسرها فاحترق بها وبقي ثلاثة أيام يعذب ثم مات {cite:kamil-ibn-al-athir p. 77-78}."
  en: "Dhu al-Hijja 571: fierce war in Mecca between the Hajj's amir Tashtakin and Mecca's amir Mukaththir ibn Isa, whom the caliph had ordered deposed for his brother Dawud over the castle he had built on Abu Qubays; the pilgrims stormed the city from al-Abtah, burned houses and plundered residents and merchants, Mukaththir was besieged in his hill-fort then fled, and Dawud took the emirate — and a blue-eyed arsonist who burned an orphans' house with a naphtha flask was struck by a stone mid-throw and burned in his own fire three days {cite:kamil-ibn-al-athir p. 77-78}."
  es: "Dhu al-Hijja 571: feroz guerra en La Meca entre el emir del Hajj, Tashtakin, y el emir de La Meca, Mukaththir ibn Isa, a quien el califa había ordenado deponer en favor de su hermano Dawud por el castillo que había construido en Abu Qubays; los peregrinos asaltaron la ciudad desde al-Abtah, quemaron casas y saquearon a residentes y comerciantes, Mukaththir fue asediado en su fortaleza en la colina y luego huyó, y Dawud tomó el emirato; y un pirómano de ojos azules que quemó una casa de huérfanos con un frasco de nafta fue golpeado por una piedra en pleno lanzamiento y ardió en su propio fuego durante tres días {cite:kamil-ibn-al-athir p. 77-78}."
  fr: "Dhu al-Hijja 571: une guerre féroce éclate à La Mecque entre l'émir du Hajj, Tashtakin, et l'émir de La Mecque, Mukaththir ibn Isa, que le calife avait ordonné de déposer au profit de son frère Dawud à cause du château qu'il avait fait construire sur Abu Qubays; les pèlerins prennent d'assaut la ville depuis al-Abtah, incendient les maisons et pillent les habitants et les marchands, Mukaththir est assiégé dans sa forteresse sur la colline puis s'enfuit, et Dawud prend l'émirat — et un pyromane aux yeux bleus qui a incendié une maison d'orphelins avec une fiole de naphte a été frappé par une pierre en plein jet et a brûlé dans son propre feu pendant trois jours {cite:kamil-ibn-al-athir p. 77-78}."
