id: "event/al-hadi-visits-the-prison-cleans-it-has-the-prisoners-taught-to-read-and-examines-their-cases-after-295"
class: event
kind: other
label:
  ar: "الهادي يتفقد السجن فيأمر بتنقيته ويعلّم من فيه القراءة وينظر في قضاياهم، بعد 295هـ، ص386-387"
  en: "Al-Hadi visits the prison, has it cleaned, teaches the prisoners to read and examines their cases, after 295 AH, pp. 386-387"
  ur: "ہادی جیل کا معائنہ کرتا، اسے صاف کرواتا، قیدیوں کو پڑھنا سکھواتا اور ان کے مقدمات دیکھتا ہے، 295ھ کے بعد، ص386-387"
  es: "Al-Hadi visita la prisión, la limpia, enseña a leer a los presos y examina sus casos, después del año 295 de la Hégira, págs. 386-387."
  fr: "Al-Hadi visite la prison, la fait nettoyer, enseigne aux prisonniers à lire et examine leurs dossiers, après 295 AH, pp. 386-387"
summary:
  ar: "يقف الهادي على الحبس فيأمر بتنقيته، ويأمر القراء فيه بتعليم من لا يقرأ، ثم ينظر في ديون المدينين وذنوب الجناة."
  en: "Al-Hadi visits the prison, orders it cleaned, has the readers among the prisoners teach those who cannot read, and then examines the debts of debtors and the offences of the guilty."
  ur: "ہادی جیل جا کر اسے صاف کرواتا، قیدیوں میں جو پڑھ سکتے ہیں انہیں ان پڑھوں کو سکھانے کا حکم دیتا، اور پھر مقروضوں کے قرض اور مجرموں کے جرم کی تحقیق کرتا ہے۔"
  es: "Al-Hadi visita la prisión, ordena que la limpien, hace que los presos que saben leer enseñen a los que no saben leer y, a continuación, examina las deudas de los deudores y los delitos de los culpables."
  fr: "Al-Hadi visite la prison, ordonne son nettoyage, charge les prisonniers qui savent lire d'enseigner à ceux qui ne savent pas lire, puis examine les dettes des débiteurs et les délits des coupables."
