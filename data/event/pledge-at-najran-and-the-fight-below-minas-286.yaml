id: event/pledge-at-najran-and-the-fight-below-minas-286
class: event
kind: other
label:
  ar: التحالف بنجران والقتال دون حصن ميناس، 286هـ
  en: The pledge at Najran and the fight below the fort of Minas, 286 AH
  ur: نجران میں معاہدۂ نصرت اور میناس کے قلعے کے نیچے لڑائی، 286ھ
  es: "La promesa de Najrán y la batalla bajo la fortaleza de Minas, 286 AH."
  fr: "Le serment à Najran et le combat au pied de la forteresse de Minas, 286 AH"
  tr: "Najran'daki ittifak ve Minas kalesi dışındaki çatışmalar, Hicri 286"
  id: "Persekutuan di Najran dan pertempuran di luar benteng Minas, 286 H"
summary:
  ar: يرسل نفر من بني عبد المدان والمجاهر بن زياد من بني قطن إلى أبي محمد ليلقاهم بهمدان وثقيف والأحلاف فيتحالفون على النصرة، ثم يعبئ ابن بسطام بني الحارث وأهل ميناس دون حصنه، فيكمن أبو محمد كميناً ويحمل فيطرد القوم ويقتل رجلين ويخرب الحصن ويغنم عسكره ما فيه ثم يكتب إلى الهادي.
  en: Some of Banu Abd al-Madan and al-Mujahir ibn Ziyad of Banu Qatan send to Abu Muhammad to meet them with Hamdan, Thaqif and al-Ahlaf, and they pledge mutual support; Ibn Bustam then draws up Banu al-Harith and the people of Minas before his fort, Abu Muhammad hides an ambush and charges, drives the people out, kills two men, razes the fort, his army takes what is in it, and he writes to al-Hadi.
  ur: بنو عبد المدان کے کچھ لوگ اور بنو قطن کے مجاہر بن زیاد ابو محمد کو پیغام بھیجتے ہیں کہ ہمدان، ثقیف اور احلاف کے ساتھ ان سے ملیں، اور وہ نصرت کا عہد کرتے ہیں؛ پھر ابن بسطام بنو حارث اور میناس والوں کو اپنے قلعے کے سامنے صف بند کرتا ہے، ابو محمد گھات لگا کر حملہ کرتے ہیں، قوم کو نکال دیتے ہیں، دو آدمیوں کو مارتے ہیں، قلعہ ڈھا دیتے ہیں، ان کا لشکر اس کا مال لیتا ہے اور وہ ہادی کو لکھتے ہیں۔
  es: "Algunos miembros de Banu Abd al-Madan y al-Mujahir ibn Ziyad de Banu Qatan envían mensajeros a Abu Muhammad para reunirse con ellos junto con Hamdan, Thaqif y al-Ahlaf, y se prometen apoyo mutuo; Ibn Bustam reúne entonces a Banu al-Harith y a la gente de Minas frente a su fortaleza, Abu Muhammad esconde una emboscada y ataca, expulsa a la gente, mata a dos hombres, arrasa la fortaleza, su ejército toma lo que hay dentro y escribe a al-Hadi."
  fr: "Certains membres de Banu Abd al-Madan et al-Mujahir ibn Ziyad de Banu Qatan envoient des hommes à Abu Muhammad pour les rencontrer avec Hamdan, Thaqif et al-Ahlaf, et ils s'engagent à se soutenir mutuellement; Ibn Bustam rassemble alors Banu al-Harith et les habitants de Minas devant son fort, Abu Muhammad dissimule une embuscade et charge, chasse les habitants, tue deux hommes, rase le fort, son armée prend ce qui s'y trouve, et il écrit à al-Hadi."
  tr: "Beni Abdülmeden kabilesinden bir grup adam ve Beni Katan kabilesinden Mücahir ibn Ziyad, Hamdan, Sakif ve müttefikleriyle görüşmek üzere Ebu Muhammed'e haber gönderir ve destek için bir ittifak kurarlar. Ardından İbn Bustam, Beni Harith kabilesini ve Minas halkını kalesinin etrafında toplar. Ebu Muhammed bir pusu kurar, saldırır, halkı dağıtır, iki adamı öldürür, kaleyi yıkar ve ordusu içindekileri ganimet olarak alır. Sonra da Hadi'ye mektup yazar."
  id: "Sekelompok orang dari Bani Abd al-Madan dan al-Mujahir ibn Ziyad dari Bani Qatan mengirim utusan kepada Abu Muhammad untuk menemui mereka bersama Hamdan, Thaqif, dan sekutu-sekutunya, dan mereka membentuk aliansi untuk mendapatkan dukungan. Kemudian Ibnu Bustam memobilisasi Bani al-Harith dan penduduk Minas di sekitar bentengnya. Abu Muhammad memasang jebakan, menyerang, mengusir orang-orang, membunuh dua orang, menghancurkan benteng, dan pasukannya mengambil apa yang ada di dalamnya sebagai rampasan perang. Kemudian dia menulis surat kepada al-Hadi."
