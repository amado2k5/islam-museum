id: event/pledge-at-najran-and-the-fight-below-minas-286
class: event
kind: other
label:
  ar: التحالف بنجران والقتال دون حصن ميناس، 286هـ
  en: The pledge at Najran and the fight below the fort of Minas, 286 AH
  ur: نجران میں معاہدۂ نصرت اور میناس کے قلعے کے نیچے لڑائی، 286ھ
summary:
  ar: يرسل نفر من بني عبد المدان والمجاهر بن زياد من بني قطن إلى أبي محمد ليلقاهم بهمدان وثقيف والأحلاف فيتحالفون على النصرة، ثم يعبئ ابن بسطام بني الحارث وأهل ميناس دون حصنه، فيكمن أبو محمد كميناً ويحمل فيطرد القوم ويقتل رجلين ويخرب الحصن ويغنم عسكره ما فيه ثم يكتب إلى الهادي.
  en: Some of Banu Abd al-Madan and al-Mujahir ibn Ziyad of Banu Qatan send to Abu Muhammad to meet them with Hamdan, Thaqif and al-Ahlaf, and they pledge mutual support; Ibn Bustam then draws up Banu al-Harith and the people of Minas before his fort, Abu Muhammad hides an ambush and charges, drives the people out, kills two men, razes the fort, his army takes what is in it, and he writes to al-Hadi.
  ur: بنو عبد المدان کے کچھ لوگ اور بنو قطن کے مجاہر بن زیاد ابو محمد کو پیغام بھیجتے ہیں کہ ہمدان، ثقیف اور احلاف کے ساتھ ان سے ملیں، اور وہ نصرت کا عہد کرتے ہیں؛ پھر ابن بسطام بنو حارث اور میناس والوں کو اپنے قلعے کے سامنے صف بند کرتا ہے، ابو محمد گھات لگا کر حملہ کرتے ہیں، قوم کو نکال دیتے ہیں، دو آدمیوں کو مارتے ہیں، قلعہ ڈھا دیتے ہیں، ان کا لشکر اس کا مال لیتا ہے اور وہ ہادی کو لکھتے ہیں۔
