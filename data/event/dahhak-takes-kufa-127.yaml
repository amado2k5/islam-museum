kind: civil-war
label: { ar: "ملك الضحاك بن قيس الكوفة وصالح ابن عمر على القسمة", en: "al-Dahhak ibn Qays Takes Kufa and Agrees a Division with Ibn Umar", es: "al-Dahhak ibn Qays toma Kufa y acuerda una división con Ibn Umar", fr: "al-Dahhak ibn Qays prend Kufa et accepte une division avec Ibn Umar", ur: "ضحاک بن قیس نے کوفہ پر قبضہ کر لیا اور ابن عمر سے علیحدگی اختیار کر لی", tr: "Al-Dahhak ibn Qays, Kfe'yi yönetti ve Salih ibn Ömer bölünme konusunda anlaştı.", id: "Al-Dahhak ibn Qays memerintah Kufah dan Salih ibn Umar menyetujui pembagian tersebut." }
summary:
  ar: "في سنة سبع وعشرين ومائة لما استقام لمروان بن محمد الشام ووجه يزيد بن عمر بن هبيرة عاملاً على العراق ضاماً إليه أجناد الجزيرة، صالح عبد الله بن عمر بن عبد العزيز عامل الكوفة الضحاكَ بن قيس الشيباني أمير الخوارج على أن يكون بيد الضحاك ما غلب عليه من الكوفة وسوادها وبيد ابن عمر ما كان بيده من واسط وميسان وتستر وكور الجدة والأهواز وفارس، فارتج الضحاك حتى نحى مروان بكفر توثا من أرض الجزيرة، وكان قد أخذ الموصل في ذي القعدة، واستعمل على الكوفة ملحان الشيباني فقتله النصر بن سعيد عامل ابن هبيرة، فاستعمل الضحاك المثنى بن عمران العائذي فالتقى ابنَ هبيرة بغزة فاقتتلوا قتالاً شديداً أياماً متوالية فقتل المثنى وعزير وعمرو من رؤساء أصحاب الضحاك وانهزمت الخوارج وقرب منصور بن جمهور، ثم جمع منصور أهل الكوفة من اليمانية والمضرية ممن تخلف عن الضحاك وسار بهم حتى نزل الروحاء فأقبل ابن هبيرة في أجناده فلقيهم فقاتلهم أياماً ثم هزمهم وقتل البردون بن مرزوق الشيباني وهرب منصور، وأقبل ابن هبيرة حتى نزل الكوفة ونفى عنها الخوارج {cite:tabari-khayyat-part2 p. 641-643}."
  en: "In 127, when Marwan ibn Muhammad had secured Syria and appointed Yazid ibn Umar ibn Hubayra as governor of Iraq, bringing with him the armies of al-Jazira, Abdallah ibn Umar ibn Abd al-Aziz, governor of Kufa, made terms with al-Dahhak ibn Qays al-Shaybani, leader of the Kharijites, on the basis that al-Dahhak would hold what he had seized of Kufa and its countryside, while Ibn Umar would keep what he held of Wasit, Maysan, Tustar, the districts of al-Jiddah, al-Ahwaz and Fars. Al-Dahhak surged forward and drove Marwan out to Kafr Tutha in the Jazira, having taken Mosul in Dhu al-Qa'da. He appointed Mulhan al-Shaybani over Kufa, and Mulhan was killed by al-Nadr ibn Sa'id, agent of Ibn Hubayra. Al-Dahhak then appointed al-Muthanna ibn Imran al-A'idhi, who met Ibn Hubayra at Ghazza, and they fought fiercely for several days. Al-Muthanna, Uzayr and Amr, leaders of al-Dahhak's companions, were killed and the Kharijites were routed, and Mansur ibn Jumhur drew near. Mansur gathered the people of Kufa, Yemeni and Mudari, who had held back from al-Dahhak, and marched with them until they camped at al-Rawha. Ibn Hubayra came with his troops and fought them for days, then defeated them and killed al-Bardun ibn Marzuq al-Shaybani, and Mansur fled. Ibn Hubayra then came and camped in Kufa and expelled the Kharijites from it {cite:tabari-khayyat-part2 p. 641-643}."
  es: "En el año 127, cuando Marwan ibn Muhammad aseguró Siria y nombró a Yazid ibn Umar ibn Hubayra gobernador de Irak, trayendo consigo los ejércitos de al-Jazira, Abdallah ibn Umar ibn Abd al-Aziz, gobernador de Kufa, llegó a un acuerdo con al-Dahhak ibn Qays al-Shaybani, líder de los jariyitas, según el cual al-Dahhak conservaría lo que había tomado de Kufa y sus alrededores, mientras que Ibn Umar mantendría lo que controlaba de Wasit, Maysan, Tustar, los distritos de al-Jiddah, al-Ahwaz y Fars. Al-Dahhak avanzó y expulsó a Marwan hasta Kafr Tutha en Jazira, tras haber tomado Mosul en Dhu al-Qa'da. Nombró a Mulhan al-Shaybani al frente de Kufa, y Mulhan fue asesinado por al-Nadr ibn Sa'id, agente de Ibn Hubayra. Al-Dahhak nombró entonces a al-Muthanna ibn Imran al-A'idhi, quien se reunió con Ibn Hubayra en Ghazza, y lucharon ferozmente durante varios días. Al-Muthanna, Uzayr y Amr, líderes de los compañeros de al-Dahhak, murieron y los jariyitas fueron derrotados, y Mansur ibn Jumhur se acercó. Mansur reunió a la gente de Kufa, Yemeni y Mudari, que se habían resistido a al-Dahhak, y marchó con ellos hasta acampar en al-Rawha. Ibn Hubayra llegó con sus tropas y luchó contra ellos durante días, luego los derrotó y mató a al-Bardun ibn Marzuq al-Shaybani, y Mansur huyó. Ibn Hubayra llegó entonces y acampó en Kufa y expulsó a los jariyitas de allí {cite:tabari-khayyat-part2 p. 641-643}."
  fr: "En 127, après que Marwan ibn Muhammad eut sécurisé la Syrie et nommé Yazid ibn Umar ibn Hubayra gouverneur d'Irak, à la tête des armées d'al-Jazira, Abdallah ibn Umar ibn Abd al-Aziz, gouverneur de Koufa, conclut un accord avec al-Dahhak ibn Qays al-Shaybani, chef des Kharijites. Al-Dahhak conserverait les territoires conquis à Koufa et dans ses environs, tandis qu'Ibn Umar garderait Wasit, Maysan, Tustar, ainsi que les districts d'al-Jiddah, d'al-Ahwaz et de Fars. Al-Dahhak lança une offensive et repoussa Marwan jusqu'à Kafr Tutha, en Jazira, après avoir pris Mossoul à Dhu al-Qa'da. Il nomma Mulhan al-Shaybani à la tête de Kufa, mais ce dernier fut tué par al-Nadr ibn Sa'id, agent d'Ibn Hubayra. Al-Dahhak nomma alors al-Muthanna ibn Imran al-A'idhi, qui rencontra Ibn Hubayra à Ghazza. Un combat acharné s'ensuivit pendant plusieurs jours. Al-Muthanna, Uzayr et Amr, chefs des compagnons d'al-Dahhak, furent tués et les Kharijites mis en déroute. Mansur ibn Jumhur approcha. Il rassembla les habitants de Kufa, les Yéménites et les Mudari, qui avaient résisté à al-Dahhak, et marcha avec eux jusqu'à ce qu'ils campent à al-Rawha. Ibn Hubayra arriva avec ses troupes et les combattit pendant plusieurs jours, puis les vainquit et tua al-Bardun ibn Marzuq al-Shaybani. Mansur prit alors la fuite. Ibn Hubayra vint alors camper à Kufa et en expulsa les Kharijites {cite:tabari-khayyat-part2 p. 641-643}."
  ur: "127ء میں جب مروان بن محمد نے شام پر قبضہ کر لیا اور یزید بن عمر بن ہبیرہ کو عراق کا گورنر مقرر کیا اور الجزیرہ کی فوجیں اپنے ساتھ لے کر آئیں تو کوفہ کے گورنر عبداللہ بن عمر بن عبدالعزیز نے الضحاک بن قحیص کے رہنما الضحاک بن خزیص کے ساتھ معاہدہ کیا کہ الضحاک جو کچھ اس نے کوفہ اور اس کے دیہی علاقوں پر قبضہ کیا تھا اسے اپنے پاس رکھیں گے، جب کہ ابن عمر اس کے پاس وصیت، میسان، تسطار، الجدہ، الاحواز اور فارس کے اضلاع کو اپنے پاس رکھیں گے۔ الضحاک آگے بڑھا اور ذوالقعدہ میں موصل پر قبضہ کرنے کے بعد مروان کو جزیرہ میں کفر توتہ کی طرف بھگا دیا۔ اس نے ملحان الشیبانی کو کوفہ پر مقرر کیا اور ملحان کو ابن ہبیرہ کے ایجنٹ الندر بن سعید نے قتل کر دیا۔ الضحاک نے اس کے بعد المثنیٰ ابن عمران العیضی کو مقرر کیا، جس کی ملاقات غزہ میں ابن ہبیرہ سے ہوئی، اور وہ کئی دنوں تک شدید لڑائی کرتے رہے۔ الضحاک کے ساتھیوں کے سردار المثنا، عزیر اور عمرو مارے گئے اور خوارج کو شکست دی گئی اور منصور بن جمحور قریب آ گیا۔ منصور نے کوفہ، یمنی اور مدری کے لوگوں کو اکٹھا کیا، جو الضحاک سے پیچھے ہٹ گئے تھے، اور ان کے ساتھ کوچ کیا یہاں تک کہ انہوں نے الروحہ میں پڑاؤ ڈالا۔ ابن ہبیرہ اپنی فوج کے ساتھ آیا اور کئی دن تک ان سے لڑتا رہا، پھر انہیں شکست دی اور البردون بن مرزوق الشیبانی کو قتل کر دیا اور منصور بھاگ گیا۔ اس کے بعد ابن ہبیرہ آیا اور کوفہ میں پڑاؤ ڈالا اور خارجیوں کو وہاں سے نکال دیا۔ 641-643}۔"
  tr: "Hicri 127 yılında, Mervan ibn Muhammed Suriye üzerindeki kontrolünü sağlamlaştırıp Yazid ibn Ömer ibn Hubeyra'yı Irak valisi olarak atadığında ve Cezire bölgesinin ordularını kendi egemenliğine kattığında, Kufa valisi Abdullah ibn Ömer ibn Abdülaziz, Haricilerin lideri el-Dahhak ibn Kays el-Şeybani ile barış yaptı. Anlaşmaya göre el-Dahhak Kufa ve çevresindeki kırsal alanın kontrolünü elinde tutacak, İbn Ömer ise Vesit, Maysan, Tustar, Cedde, Ahvaz ve Fars bölgelerinin kontrolünü elinde tutacaktı. Bunun üzerine el-Dahhak isyan etti ve sonunda Mervan'ı Cezire bölgesindeki Kafr Tutha'dan kovdu. Zaten Zülkade'deki Musul'u ele geçirmişti. El-Dahhak, Milhan el-Şeybani'yi Kufa valisi olarak atadı, ancak İbn Hubeyra'nın valisi el-Nasr ibn Sa'id onu öldürdü. Daha sonra El-Dahhak, Gazze'de İbn Hubeyra ile görüşen el-Muthanna ibn İmran el-A'idhi'yi görevlendirdi. Birkaç gün süren şiddetli bir savaş yaşandı ve bu savaş sırasında El-Dahhak'ın güçlerinin liderleri El-Muthanna, Uzayr ve Amr öldürüldü. Hariciler yenildi ve Mansur ibn Cümhur yaklaştırıldı. Mansur daha sonra El-Dahhak'ı terk eden Yemen ve Mudari kabilelerinden Kufa halkını topladı ve onlarla birlikte yürüdü... El-Ravha indi ve İbn Hubeyra askerleriyle birlikte geldi, onlarla karşılaştı ve günlerce savaştı, sonra onları yendi ve El-Bardun bin Marzuk el-Şeybani'yi öldürdü ve Mansur kaçtı. İbn Hubeyra Kufa'ya inene kadar geldi ve Haricileri oradan kovdu. {cite:tabari-khayyat-part2 s. 641-643}."
  id: "Pada tahun 127 H, ketika Marwan bin Muhammad telah memperkuat kekuasaannya atas Suriah dan mengangkat Yazid bin Umar bin Hubayra sebagai gubernur Irak, serta mencaplok pasukan wilayah Jazira ke wilayah kekuasaannya, Abdullah bin Umar bin Abd al-Aziz, gubernur Kufa, berdamai dengan al-Dahhak bin Qays al-Shaybani, pemimpin kaum Kharijites. Perjanjian tersebut menetapkan bahwa al-Dahhak akan mempertahankan kendali atas Kufa dan daerah sekitarnya, sementara Ibn Umar akan mempertahankan kendali atas Wasit, Maysan, Tustar, distrik al-Jaddah, Ahwaz, dan Fars. Al-Dahhak kemudian memberontak, dan akhirnya mengusir Marwan dari Kafr Tutha di wilayah Jazira. Ia telah merebut Mosul pada bulan Dzul Qa'dah. Al-Dahhak menunjuk Milhan al-Shaybani sebagai gubernur Kufa, tetapi al-Nasr ibn Sa'id, gubernur Ibn Hubayra, membunuhnya. Al-Dahhak kemudian menunjuk al-Muthanna ibn Imran al-A'idhi, yang bertemu Ibn Hubayra di Gaza. Pertempuran sengit terjadi, berlangsung selama beberapa hari, di mana al-Muthanna, Uzayr, dan Amr, pemimpin pasukan al-Dahhak, terbunuh. Kaum Kharijites dikalahkan, dan Mansur ibn Jumhur dibawa mendekat. Mansur kemudian mengumpulkan penduduk Kufa dari suku Yaman dan Mudari yang telah meninggalkan al-Dahhak dan berbaris bersama mereka hingga... Al-Rawha’ turun, dan Ibn Hubayra datang dengan pasukannya dan bertemu mereka dan bertempur dengan mereka selama beberapa hari, kemudian ia mengalahkan mereka dan membunuh Al-Bardun bin Marzuq Al-Shaybani dan Mansur melarikan diri. Ibn Hubayra datang hingga ia turun ke Kufa dan mengusir kaum Kharijites dari sana. {cite:tabari-khayyat-part2 p. 641-643}."
