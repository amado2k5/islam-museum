id: event/al-hadi-keeps-abu-jafar-household-in-najran-and-leaves-for-saada-295
class: event
kind: other
label:
  ar: "الهادي يبقي عيال أبي جعفر في داره بنجران، ثم يخرج إلى صعدة، سنة 295هـ، ص361-362"
  en: "Al-Hadi keeps Abu Ja'far's household in his house at Najran and then leaves for Sa'da, 295 AH, pp. 361-362"
  ur: "ہادی کا ابو جعفر کے گھر والوں کو نجران میں اپنے گھر میں رکھنا، پھر صعدہ کی طرف روانگی، 295ھ، ص361-362"
  es: "Al-Hadi aloja a la familia de Abu Ja'far en su casa de Najran y luego parte hacia Sa'da, 295 AH, pp. 361-362"
  fr: "Al-Hadi héberge la famille d'Abu Ja'far dans sa maison à Najran puis part pour Sa'da, 295 AH, pp. 361-362"
summary:
  ar: "سأل أبو جعفر أن يعفيه من البلد لأن أهله أهل سوء، ثم سأل أن يصير عياله إلى الحصن عند همدان وهو يبقى مع بني الحارث، فأجابه الهادي. فلما وقع قتل ابن بسطام أرسل الهادي يمنعه من نقل عياله إلى الحصن لأن ذلك يوهن أمره، ويأمره أن يتركهم في داره. ثم خرج الهادي إلى صعدة وترك مع محمد ثلاثة وعشرين فارساً وخمسة وخمسين راجلاً."
  en: "Abu Ja'far asked to be relieved of the town, saying its people were bad. He then asked that his household be placed at the fort among Hamdan while he stayed with Banu al-Harith, and al-Hadi agreed. After Ibn Bistam was killed, al-Hadi sent to forbid the move, saying it would weaken his position, and told Abu Ja'far to keep his household in the house where they were. Al-Hadi then left for Sa'da and left with Muhammad twenty-three horsemen and fifty-five foot soldiers."
  ur: "ابو جعفر نے شہر کی ذمہ داری سے سبکدوش ہونے کی درخواست کی، کیونکہ ان کے بقول یہاں کے لوگ برے ہیں۔ پھر انہوں نے کہا کہ ان کے گھر والوں کو ہمدان کے قلعے میں رکھا جائے اور وہ خود بنو حارث کے ساتھ رہیں، ہادی نے منظور کیا۔ ابن بسطام کے قتل کے بعد ہادی نے یہ منتقلی روک دی، کیونکہ اس سے ان کی پوزیشن کمزور ہوتی، اور حکم دیا کہ گھر والے اسی گھر میں رہیں۔ پھر ہادی صعدہ روانہ ہوئے اور محمد کے ساتھ تئیس سوار اور پچپن پیادے چھوڑ گئے۔"
  es: "Abu Ja'far pidió ser relevado de la ciudad, alegando que sus habitantes eran malvados. Luego solicitó que su familia fuera trasladada a la fortaleza de Hamdan mientras él permanecía con Banu al-Harith, a lo que al-Hadi accedió. Tras la muerte de Ibn Bistam, al-Hadi envió un mensajero para prohibir el traslado, argumentando que debilitaría su posición, y ordenó a Abu Ja'far que mantuviera a su familia en la casa donde se encontraban. Posteriormente, al-Hadi partió hacia Sa'da, acompañado de Muhammad, con veintitrés jinetes y cincuenta y cinco soldados de infantería."
  fr: "Abou Ja'far demanda à être relevé de ses fonctions dans la ville, prétextant la mauvaise réputation de ses habitants. Il sollicita ensuite que sa famille soit logée au fort, parmi les Hamdan, tandis que lui-même resterait avec les Banu al-Harith. Al-Hadi y consentit. Après la mort d'Ibn Bistam, il envoya un message pour interdire ce déplacement, arguant qu'il affaiblirait sa position, et ordonna à Abou Ja'far de maintenir sa famille dans la maison où elle se trouvait. Al-Hadi partit ensuite pour Sa'da, accompagné de Muhammad, à la tête de vingt-trois cavaliers et cinquante-cinq fantassins."
