summary:
  ar: "مضى سعيد بن عثمان بالرهن الذين أخذهم من السغد حتى ورد بهم المدينة فدفع ثيابهم ومناطقهم إلى مواليه وألبسهم جباب الصوف وألزمهم السقي والسواني والعمل فدخلوا عليه مجلسه ففتكوا به ثم قتلوا أنفسهم وفي سعيد قال مالك بن الريب وخالد بن عقبة بن أبي معيط قصيدتان."
  en: "Sa'id carried his Sughd hostages to Medina, gave their clothes and belts to his mawali, dressed them in wool, and set them to water-carrying, wells and labour — they entered his majlis, butchered him, then killed themselves. Malik ibn al-Rayb and Khalid ibn Uqba ibn Abi Mu'ayt each have verses on him."
