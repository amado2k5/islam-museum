id: event/said-ibn-uthman-assassination
class: event
kind: death
label: { ar: "قتل رهن السغد سعيد بن عثمان", en: "The Sughd Hostages' Killing of Sa'id ibn Uthman", es: "El asesinato de Sa'id ibn Uthman por los rehenes Sughd", fr: "Meurtre de Sa'id ibn Uthman par les otages Sughd", ur: "صغد یرغمالیوں کا سعید بن عثمان کا قتل" }
summary:
  ar: "مضى سعيد بن عثمان بالرهن الذين أخذهم من السغد حتى ورد بهم المدينة فدفع ثيابهم ومناطقهم إلى مواليه وألبسهم جباب الصوف وألزمهم السقي والسواني والعمل فدخلوا عليه مجلسه ففتكوا به ثم قتلوا أنفسهم وفي سعيد قال مالك بن الريب وخالد بن عقبة بن أبي معيط قصيدتان."
  en: "Sa'id carried his Sughd hostages to Medina, gave their clothes and belts to his mawali, dressed them in wool, and set them to water-carrying, wells and labour — they entered his majlis, butchered him, then killed themselves. Malik ibn al-Rayb and Khalid ibn Uqba ibn Abi Mu'ayt each have verses on him."
  es: "Sa'id llevó a sus rehenes Sughd a Medina, entregó sus ropas y cinturones a su mawali, los vistió con lana y los puso a acarrear agua, a cavar pozos y a realizar trabajos forzados. Entraron en su majlis, lo asesinaron y luego se suicidaron. Malik ibn al-Rayb y Khalid ibn Uqba ibn Abi Mu'ayt tienen versículos dedicados a él."
  fr: "Sa'id emmena ses otages Sughd à Médine, donna leurs vêtements et leurs ceintures à son mawali, les vêtit de laine et les affecta au transport d'eau, au forage de puits et à d'autres travaux forcés. Ils entrèrent dans son majlis, le massacrèrent, puis se suicidèrent. Malik ibn al-Rayb et Khalid ibn Uqba ibn Abi Mu'ayt lui ont chacun consacré des versets."
  ur: "سعید اپنے سغد کو یرغمال بنا کر مدینہ لے گیا، ان کے کپڑے اور بیلٹ اپنے موالی کو دیے، انہیں اون پہنایا اور انہیں پانی پہنچانے، کنوئیں اور مزدوری پر بٹھایا - وہ اس کی مجلس میں داخل ہوئے، اسے قتل کیا، پھر خود کو مار ڈالا۔ مالک بن الریب اور خالد بن عقبہ بن ابی معیط ہر ایک کی اس پر آیات ہیں۔"
