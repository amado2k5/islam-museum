label: { ar: "إلباس المعظم القاضي زكي الدين القباء والكلوتة سنة 616هـ", en: "Al-Mu'azzam forces the qadi Zaki al-Din to wear the qaba' and kalawta, 616 AH (1219)", ur: "616ھ میں معظم کا قاضی زکی الدین کو قبا اور کلوتہ پہنانا" }
summary:
  ar: "في سنة 616هـ أرسل الملك المعظم عيسى إلى قاضي دمشق زكي الدين بقجة فيها قباء وكلوتة، وهما من لباس الأجناد، وأمره أن يحكم بين الناس وهما عليه، فلبسهما وحكم بين اثنين، ثم مرض ومات؛ ويرويه سبط ابن الجوزي، وكان من خواص المعظم، ويعدّه «من غلطات المعظم»، ويذكر أسبابه: شكوى المعظم من أن القاضي لا ينفذ الأحكام، وحضوره دار ست الشام بغير إذنه، وضربه جابي المدرسة العزيزية في مجلس الحكم {cite:mirat-al-zaman-risala-2013-v22 p. 239-240}."
  en: "In 616 AH al-Malik al-Mu'azzam Isa sent the qadi of Damascus, Zaki al-Din, a bundle containing a qaba' and a kalawta — soldiers' dress — and ordered him to sit in judgement wearing them; he put them on and judged between two litigants, then fell ill and died. Sibt ibn al-Jawzi, one of al-Mu'azzam's intimates, tells it, calls it 'one of al-Mu'azzam's blunders', and gives the causes: al-Mu'azzam's complaint that the qadi did not enforce judgements, his visit to Sitt al-Sham's house without leave, and his having the collector of the Aziziyya madrasa beaten in court {cite:mirat-al-zaman-risala-2013-v22 p. 239-240}."
