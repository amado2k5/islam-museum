id: event/qatr-al-nada-marriage
class: event
kind: other
label: { ar: "زفاف قطر الندى إلى المعتضد", en: "The marriage of Qatr al-Nada to al-Mu'tadid", es: "El matrimonio de Qatr al-Nada con al-Mu'tadid", fr: "Le mariage de Qatr al-Nada avec al-Mu'tadid", ur: "قطر الندا کا المتعدید سے نکاح", tr: "Katr el-Nada'nın el-Mu'tadid ile düğünü", id: "Pernikahan Qatr al-Nada dengan al-Mu'tadid" }
summary:
  ar: "في سنة اثنتين وثمانين زفت إلى المعتضد قطر الندى بنت خمارويه بن أحمد بن طولون فدخل عليها في ربيع الأول وكان في جهازها أربعة آلاف تكة مجوهرة وعشرة صناديق جوهر {cite:tarikh-khulafa-minhaj-1434 p. 574}."
  en: "In 282 Qatr al-Nada bint Khumarawayh ibn Ahmad ibn Tulun was escorted to al-Mu'tadid — he went in to her in Rabi' I, her trousseau four thousand jewelled girdles and ten jewel chests {cite:tarikh-khulafa-minhaj-1434 p. 574}."
  es: "En 282 Qatr al-Nada bint Khumarawayh ibn Ahmad ibn Tulun fue escoltada a al-Mu'tadid; él entró a verla en Rabi' I, su ajuar consistía en cuatro mil cinturones enjoyados y diez cofres de joyas {cite:tarikh-khulafa-minhaj-1434 p. 574}."
  fr: "En 282, Qatr al-Nada bint Khumarawayh ibn Ahmad ibn Tulun fut escorté jusqu'à al-Mu'tadid — il entra chez elle en Rabi' I, son trousseau quatre mille ceintures ornées de bijoux et dix coffres à bijoux {cite:tarikh-khulafa-minhaj-1434 p. 574}."
  ur: "282 میں قطر الندا بنت خمارویہ ابن احمد بن طولون کو معتدد کے پاس لے جایا گیا - وہ ربیع الثانی میں ان کے پاس گیا، اس کے چار ہزار جواہرات والے کمربند اور دس جواہرات کے صندوق تھے۔ 574}۔"
  tr: "Seksen iki yılında, Humarawayh ibn Ahmed ibn Tulun'un kızı Katr el-Nada, el-Mu'tadid ile evlendi. El-Mu'tadid, Rabi' el-Evvel ayında onunla evlendi. Çeyizinde dört bin mücevherli kemer ve on sandık dolusu mücevher bulunuyordu. {cite:tarikh-khulafa-minhaj-1434 s. 574}"
  id: "Pada tahun delapan puluh dua, Qatr al-Nada, putri Khumarawayh ibn Ahmad ibn Tulun, menikah dengan al-Mu’tadid. Ia menikahinya pada bulan Rabi’ al-Awwal. Mas kawinnya termasuk empat ribu ikat pinggang berhiaskan permata dan sepuluh peti berisi permata. {cite:tarikh-khulafa-minhaj-1434 p. 574}."
