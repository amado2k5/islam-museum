tags: [wasaya-browser, wasaya-prophets, wasaya-ihtidar, wasaya-athar]
label:
  ar: "وفاة النبي سليمان بن داود وعصاه التي أكلتها الأرضة"
  en: "Death of the prophet Sulayman (Solomon) and the staff eaten by the termite"
  ur: "نبی سلیمان بن داؤد کی وفات اور دیمک کی کھائی ہوئی لاٹھی"
  es: "La muerte del profeta Sulayman (Salomón) y el bastón devorado por las termitas."
summary:
  ar: "تذكر آية سبأ أن الجن لم يعلموا بموت سليمان حتى أكلت دابة الأرض عصاه فسقط، ويشرح ابن كثير أنه بقي متوكئاً على عصاه نحواً من سنة {cite:tafsir-ibn-kathir scan vol. 1 p. 3801}. وتعرض الكتب ثلاث روايات في كيفية وفاته: شجرة الخروب عن ابن عباس {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 630}، وخلوته في محراب بيت المقدس برواية السدي {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 631}، وقصر القوارير في رواية عبد الرحمن بن زيد بن أسلم {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 632}. ويصف ابن كثير ما في بعضها بأنه من الإسرائيليات التي لا تصدق ولا تكذب {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 632}. وتذكر الأخبار أنه عاش نيفاً وخمسين سنة {cite:tarikh-al-tabari scan vol. 2 p. 603}."
  en: "The verse of Saba says the jinn did not learn of Sulayman's death until the creature of the earth ate his staff and he fell; Ibn Kathir explains that he stayed leaning on his staff for about a year {cite:tafsir-ibn-kathir scan vol. 1 p. 3801}. The books give three accounts of how he died: the carob tree, from Ibn Abbas {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 630}; his retreat in the prayer chamber at Bayt al-Maqdis, in al-Suddi's report {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 631}; and the glass palace, in the report of Abd al-Rahman ibn Zayd ibn Aslam {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 632}. Ibn Kathir calls some of this Israelite material that is neither believed nor denied {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 632}. The reports give his age as a little over fifty {cite:tarikh-al-tabari scan vol. 2 p. 603}."
  ur: "سورۂ سبا کی آیت بتاتی ہے کہ جنات کو سلیمان کی موت کا پتا اسی وقت چلا جب زمین کے کیڑے نے ان کی لاٹھی کھا لی اور وہ گر پڑے؛ ابن کثیر کے مطابق وہ تقریباً ایک سال لاٹھی پر ٹیک لگائے رہے {cite:tafsir-ibn-kathir scan vol. 1 p. 3801}۔ کتابیں ان کی وفات کی تین روایتیں دیتی ہیں: ابن عباس سے خروب کا درخت {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 630}، سدی کی روایت میں بیت المقدس کے محراب میں خلوت {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 631}، اور عبد الرحمن بن زید بن اسلم کی روایت میں شیشے کا محل {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 632}۔ ابن کثیر بعض کو اسرائیلی روایات کہتے ہیں جنھیں نہ سچ کہا جاتا ہے نہ جھوٹ {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 632}۔ ان کی عمر پچاس سے کچھ اوپر بتائی گئی ہے {cite:tarikh-al-tabari scan vol. 2 p. 603}۔"
  es: "El versículo de Saba dice que los genios no supieron de la muerte de Sulayman hasta que la criatura de la tierra se comió su bastón y cayó; Ibn Kathir explica que permaneció apoyado en su bastón durante aproximadamente un año {cite:tafsir-ibn-kathir scan vol. 1 p. 3801}. Los libros dan tres relatos de cómo murió: el algarrobo, de Ibn Abbas {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 630}; su retiro en la cámara de oración en Bayt al-Maqdis, en el informe de al-Suddi {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 631}; y el palacio de cristal, en el informe de Abd al-Rahman ibn Zayd ibn Aslam {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 632}. Ibn Kathir llama a parte de este material israelita que no es ni creído ni negado {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 632}. Los informes dan su edad como un poco más de cincuenta {cite:tarikh-al-tabari scan vol. 2 p. 603}."
