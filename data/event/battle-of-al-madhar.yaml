summary:
  ar: وقعة يذكرها خليفة بن خياط في سنة سبع وستين، في السنة التي قُتل فيها المختار بن أبي عبيد في قصره بالكوفة على يد أخوين من بني حنيفة أتيا مصعب بن الزبير برأسه {cite:tarikh-khalifa-umari-1985 p. 264}.
  en: A battle that Khalifa ibn Khayyat records under the year 67, the year in which al-Mukhtar ibn Abi Ubayd was killed in his palace at Kufa by two brothers of Banu Hanifa, who brought his head to Mus'ab ibn al-Zubayr {cite:tarikh-khalifa-umari-1985 p. 264}.
  ur: ایک لڑائی جسے خلیفہ بن خیاط سنہ 67 کے تحت درج کرتے ہیں، وہ سال جس میں مختار بن ابی عبید کوفہ میں اپنے محل میں بنو حنیفہ کے دو بھائیوں کے ہاتھوں قتل ہوا جو اس کا سر مصعب بن زبیر کے پاس لائے {cite:tarikh-khalifa-umari-1985 p. 264}۔
