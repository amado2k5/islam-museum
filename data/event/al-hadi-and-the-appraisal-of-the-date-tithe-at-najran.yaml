id: event/al-hadi-and-the-appraisal-of-the-date-tithe-at-najran
class: event
kind: other
label:
  ar: الهادي وخرص ثمر النخل في نجران وعشر الثمر
  en: Al-Hadi and the appraisal of the date harvest for the tithe at Najran
  ur: نجران میں کھجور کے عشر کا اندازہ ⁦(خرص)⁩ اور ہادی
summary:
  ar: لما حضرت جباية الثمر جمع الهادي خيار أهل نجران وشاورهم، فقالوا إن خرص التمر أرفق بهم من أخذ الرطب والرجيز والخشو، فأجابهم لما صح له من الرفق، وقال إن النبي خرص المدينة وخيبر، وأشاروا بقوم عدول فاستحلفهم أن لا يأخذوا إلا الحق وألا يأخذوا فيما دون ثلاثة وثلاثين فرقاً وثلثاً، وأمرهم أن يخرصوا العنب على ذلك.
  en: When the date harvest fell due al-Hadi gathered the notables of Najran and consulted them; they said appraising the dates suited them better than taking fresh dates, ripe and poor dates, and he agreed as it proved easier for them, noting the Prophet had appraised Medina and Khaybar; they named just men whom he made swear to take only what is due and nothing below thirty-three and a third farq, and to appraise the grapes likewise.
  ur: کھجور کی وصولی کا وقت آیا تو ہادی نے نجران کے سرکردہ لوگوں کو جمع کر کے مشورہ کیا؛ انہوں نے کہا کہ تازہ، پکی اور ردی کھجور لینے سے اندازہ لگانا ان کے لیے آسان ہے، تو انہوں نے مان لیا کیونکہ یہ ان کے لیے سہولت ثابت ہوا اور کہا کہ نبی نے مدینہ اور خیبر کا اندازہ لگایا تھا؛ انہوں نے عادل لوگ تجویز کیے جنہیں حلف دلایا کہ حق ہی لیں گے اور تینتیس اور ایک تہائی فرق سے کم پر کچھ نہ لیں، اور انگور کا بھی اسی پر اندازہ لگائیں۔
