label: { ar: "وفاة خديجة بنت خويلد", en: "Death of Khadija bint Khuwaylid", es: "Muerte de Jadiya bint Juwaylid", fr: "Décès de Khadija bint Khuwaylid", ur: "خدیجہ بنت خویلد کی وفات", tr: "Hatice bint Huveylid'in ölümü", id: "Kematian Khadijah binti Khuwaylid" }
summary:
  ar: "توفيت خديجة أم المؤمنين في رمضان من السنة العاشرة من البعثة، بعد وفاة أبي طالب بنحو شهرين أو ثلاثة، ولها خمس وستون سنة والنبي في الخمسين."
  en: "Khadija, mother of the believers, died in Ramadan of the tenth year of the mission, about two or three months after Abu Talib, aged sixty-five while the Prophet was fifty."
  es: "Khadija, madre de los creyentes, murió en Ramadán del décimo año de la misión, unos dos o tres meses después de Abu Talib, a la edad de sesenta y cinco años, mientras que el Profeta tenía cincuenta."
  fr: "Khadija, la mère des croyants, mourut durant le Ramadan de la dixième année de la mission, environ deux ou trois mois après Abou Talib, à l'âge de soixante-cinq ans, tandis que le Prophète en avait cinquante."
  ur: "مومنین کی والدہ خدیجہ کا انتقال مشن کے دسویں سال کے رمضان میں، ابو طالب کے تقریباً دو یا تین ماہ بعد، پینسٹھ سال کی عمر میں جبکہ نبی کی عمر پچاس سال تھی۔"
  tr: "Müminlerin annesi Hatice, Peygamber Efendimiz'in tebliğ yılının onuncu yılının Ramazan ayında, Ebu Talib'in ölümünden yaklaşık iki veya üç ay sonra vefat etti. Hatice altmış beş yaşındaydı, Peygamber Efendimiz ise elli yaşındaydı."
  id: "Khadija, ibu para mukmin, wafat pada bulan Ramadan tahun kesepuluh dakwah, sekitar dua atau tiga bulan setelah wafatnya Abu Talib. Beliau berusia enam puluh lima tahun dan Nabi berusia lima puluh tahun."
