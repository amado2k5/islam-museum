summary:
  ar: "بطاقة أولية لآخر الحروب الساسانية البيزنطية من ٦٠٢ إلى ٦٢٨م، الصراع الذي أنهك الإمبراطوريتين عشية الفتوحات الإسلامية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the last Byzantine–Sasanian war of 602–628, the struggle that exhausted both empires on the eve of the Islamic conquests; its sources are not yet checked on the page."
  es: "Boceto de ficha para la última guerra bizantino-sasánida de 602-628, la lucha que agotó a ambos imperios en vísperas de las conquistas islámicas; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour la dernière guerre byzantino-sassanide de 602-628, la lutte qui épuisa les deux empires à la veille des conquêtes islamiques; ses sources ne sont pas encore vérifiées sur la page."
  ur: "602-628 کی آخری بازنطینی-ساسانی جنگ کے لیے ڈرافٹ کارڈ، وہ جدوجہد جس نے اسلامی فتوحات کے موقع پر دونوں سلطنتوں کو تھکا دیا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "İslam fetihlerinin arifesinde her iki imparatorluğu da tüketen, 602-628 yılları arasındaki son Sasani-Bizans savaşlarına dair ön bir özet; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang perang Sasaniyah-Bizantium terakhir dari tahun 602 hingga 628 M, konflik yang melemahkan kedua kekaisaran menjelang penaklukan Islam; sumber-sumber yang tercantum di halaman ini belum ditinjau."
