summary:
  ar: "كتب محمد بن عبيد الله إلى الهادي يخبره بالفساد في نجران ويحضه على الخروج إليها لإصلاحه، وذكر الكتاب غرض الرسالة دون نصها."
  en: "Muhammad ibn Ubaydallah wrote to al-Hadi about the disorder at Najran and urged him to go out and set it right; the book gives the purpose of the letter, not its text."
  ur: "محمد بن عبید اللہ نے ہادی کو نجران کے فساد کی خبر دی اور انہیں اصلاح کے لیے نکلنے کی ترغیب دی؛ کتاب خط کا مقصد بیان کرتی ہے، متن نہیں۔"
  es: "Muhammad ibn Ubaydallah escribió a al-Hadi sobre el desorden en Najran y le instó a salir y solucionarlo; el libro indica el propósito de la carta, no su texto."
