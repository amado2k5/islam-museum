id: event/al-hadi-reconciles-khawlan-and-banu-salman-at-madhab-and-the-cloud-286
class: event
kind: other
label:
  ar: إصلاح الهادي بين خولان وبني سلمان بمذاب وظل الغمامة، جمادى الآخرة 286هـ
  en: Al-Hadi reconciles Khawlan and Banu Salman at Madhab, and the shade of the cloud, Jumada II 286 AH
  ur: مذاب میں خولان اور بنو سلمان کے بیچ ہادی کی صلح اور بادل کا سایہ، جمادی الآخرہ 286ھ
  es: "Al-Hadi reconcilia a Khawlan y Banu Salman en Madhab, y la sombra de la nube, Jumada II 286 AH"
  fr: "Al-Hadi réconcilie Khawlan et Banu Salman à Madhab et à l'ombre du nuage, Jumada II 286 AH"
  tr: "Al-Hadi'nin, Mezhep ve Bulutun Gölgesi adlı eserinde, Havlan ile Beni Salman arasında yaptığı uzlaşma, Cemadi el-Ahire 286 Hicri"
  id: "Rekonsiliasi Al-Hadi antara Khawlan dan Bani Salman di Madhab dan naungan awan, Jumada al-Akhirah 286 H."
summary:
  ar: يروي علي بن محمد أن أباه محمد بن عبيد الله صرخ في خولان فاجتمع عسكر كبير لقوا الهادي بأسل، فاستشار الهادي أولياء المقتولين فوهبوا له الدم، ثم ذهب إلى مذاب للقاء الدعام، وأمر بإيقاف خولان بنقيل العجلة خشية الفتنة بين خولان وهمدان. ويذكر الراوي ظهور سحابة أظلّت الهادي وأصحابه في يوم شديد الحر، وهو عنده من آيات الله لابن نبيه. ثم أصلح بين الخولانيين والهمدانيين ومضى إلى صعدة ومعه محمد بن الدعام.
  en: Ali ibn Muhammad tells that his father Muhammad ibn Ubaydallah called the Khawlan out and a large force gathered and met al-Hadi at Asal; al-Hadi asked the guardians of the two slain, who gave him the matter of the blood, and he went to Madhab to meet al-Da'am, having Khawlan halted at Naqil al-Ajala for fear of strife between Khawlan and Hamdan. The narrator reports a cloud that shaded al-Hadi and his companions on a day of fierce heat and takes it as a sign of God for the son of His prophet; al-Hadi reconciled Khawlan and Hamdan and went on to Sa'da with al-Da'am's son Muhammad.
  ur: علی بن محمد بیان کرتے ہیں کہ ان کے والد محمد بن عبید اللہ نے خولان کو پکارا تو ایک بڑا لشکر جمع ہو گیا اور وہ اسل میں ہادی سے ملے؛ ہادی نے مقتولین کے ولیوں سے مشورہ کیا تو انہوں نے خون ان کے سپرد کر دیا، پھر وہ دعام سے ملاقات کے لیے مذاب گئے اور خولان کو نقیل العجلہ پر روکنے کا حکم دیا کہ خولان اور ہمدان کے بیچ فتنہ نہ ہو۔ راوی ایک بادل کا ذکر کرتا ہے جس نے سخت گرمی کے دن ہادی اور ان کے ساتھیوں پر سایہ کیا اور اسے وہ اللہ کے نبی کے بیٹے کے لیے اللہ کی نشانی سمجھتا ہے؛ ہادی نے خولانیوں اور ہمدانیوں میں صلح کرائی اور دعام کے بیٹے محمد کے ساتھ صعدہ گئے۔
  es: "Ali ibn Muhammad relata que su padre Muhammad ibn Ubaydallah convocó a los Khawlan y una gran fuerza se reunió para encontrarse con al-Hadi en Asal. Al-Hadi preguntó a los guardianes de los dos caídos, quienes le informaron sobre la sangre derramada, y partió hacia Madhab para encontrarse con al-Da'am, haciendo que Khawlan se detuviera en Naqil al-Ajala por temor a una contienda entre Khawlan y Hamdan. El narrador menciona una nube que protegió a al-Hadi y a sus compañeros en un día de intenso calor y la interpreta como una señal de Dios para el hijo de su profeta. Al-Hadi reconcilió a Khawlan y Hamdan y continuó su viaje hacia Sa'da con Muhammad, hijo de al-Da'am."
  fr: "Ali ibn Muhammad raconte que son père, Muhammad ibn Ubaydallah, appela les Khawlan à la rescousse. Une importante armée se rassembla et rencontra al-Hadi à Asal. Al-Hadi interrogea les tuteurs des deux hommes tués, qui lui révélèrent la vérité sur le sang versé. Il se rendit ensuite à Madhab pour rencontrer al-Da'am, faisant halte aux Khawlan à Naqil al-Ajala par crainte d'un conflit entre les deux hommes. Le narrateur rapporte qu'un nuage apparut par une journée de forte chaleur et protégea al-Hadi et ses compagnons, y voyant un signe divin pour le fils de Son Prophète. Al-Hadi réconcilia Khawlan et Hamdan, puis poursuivit sa route vers Sa'da avec Muhammad, le fils d'al-Da'am."
  tr: "Ali ibn Muhammed, babası Muhammed ibn Ubeydullah'ın Havlan'da feryat ettiğini ve büyük bir ordunun toplanarak Asal'da el-Hadi ile buluştuğunu anlatır. El-Hadi, öldürülenlerin akrabalarıyla istişare etti ve onlardan merhamet gördü. Daha sonra el-Da'am ile görüşmek üzere Madhab'a gitti ve Havlan ile Hamdan arasında çatışma çıkmasından korkarak Havlan'ın Nakil el-Acelah'ta durmasını emretti. Rivayet eden kişi, çok sıcak bir günde el-Hadi ve arkadaşlarını gölgeleyen bir bulutun göründüğünü ve bunu Allah'tan Peygamberine bir işaret olarak kabul ettiğini belirtir. Daha sonra Havlan ve Hamdan kabilelerini uzlaştırdı ve Muhammed ibn el-Da'am ile birlikte Sa'de'ye gitti."
  id: "Ali ibn Muhammad menceritakan bahwa ayahnya, Muhammad ibn Ubayd Allah, berseru di Khawlan, dan pasukan besar berkumpul dan menemui al-Hadi di Asal. Al-Hadi berkonsultasi dengan kerabat orang-orang yang terbunuh, yang memberinya pengampunan. Kemudian ia pergi ke Madhab untuk menemui al-Da'am dan memerintahkan Khawlan untuk berhenti di Naqil al-Ajalah karena khawatir akan terjadi konflik antara Khawlan dan Hamdan. Perawi menyebutkan munculnya awan yang menaungi al-Hadi dan para sahabatnya pada hari yang sangat panas, yang dianggapnya sebagai tanda dari Tuhan kepada Nabinya. Kemudian ia mendamaikan suku Khawlan dan Hamdan dan melanjutkan perjalanan ke Sa'dah bersama Muhammad ibn al-Da'am."
