id: event/al-hadi-reconciles-khawlan-and-banu-salman-at-madhab-and-the-cloud-286
class: event
kind: other
label:
  ar: إصلاح الهادي بين خولان وبني سلمان بمذاب وظل الغمامة، جمادى الآخرة 286هـ
  en: Al-Hadi reconciles Khawlan and Banu Salman at Madhab, and the shade of the cloud, Jumada II 286 AH
  ur: مذاب میں خولان اور بنو سلمان کے بیچ ہادی کی صلح اور بادل کا سایہ، جمادی الآخرہ 286ھ
summary:
  ar: يروي علي بن محمد أن أباه محمد بن عبيد الله صرخ في خولان فاجتمع عسكر كبير لقوا الهادي بأسل، فاستشار الهادي أولياء المقتولين فوهبوا له الدم، ثم ذهب إلى مذاب للقاء الدعام، وأمر بإيقاف خولان بنقيل العجلة خشية الفتنة بين خولان وهمدان. ويذكر الراوي ظهور سحابة أظلّت الهادي وأصحابه في يوم شديد الحر، وهو عنده من آيات الله لابن نبيه. ثم أصلح بين الخولانيين والهمدانيين ومضى إلى صعدة ومعه محمد بن الدعام.
  en: Ali ibn Muhammad tells that his father Muhammad ibn Ubaydallah called the Khawlan out and a large force gathered and met al-Hadi at Asal; al-Hadi asked the guardians of the two slain, who gave him the matter of the blood, and he went to Madhab to meet al-Da'am, having Khawlan halted at Naqil al-Ajala for fear of strife between Khawlan and Hamdan. The narrator reports a cloud that shaded al-Hadi and his companions on a day of fierce heat and takes it as a sign of God for the son of His prophet; al-Hadi reconciled Khawlan and Hamdan and went on to Sa'da with al-Da'am's son Muhammad.
  ur: علی بن محمد بیان کرتے ہیں کہ ان کے والد محمد بن عبید اللہ نے خولان کو پکارا تو ایک بڑا لشکر جمع ہو گیا اور وہ اسل میں ہادی سے ملے؛ ہادی نے مقتولین کے ولیوں سے مشورہ کیا تو انہوں نے خون ان کے سپرد کر دیا، پھر وہ دعام سے ملاقات کے لیے مذاب گئے اور خولان کو نقیل العجلہ پر روکنے کا حکم دیا کہ خولان اور ہمدان کے بیچ فتنہ نہ ہو۔ راوی ایک بادل کا ذکر کرتا ہے جس نے سخت گرمی کے دن ہادی اور ان کے ساتھیوں پر سایہ کیا اور اسے وہ اللہ کے نبی کے بیٹے کے لیے اللہ کی نشانی سمجھتا ہے؛ ہادی نے خولانیوں اور ہمدانیوں میں صلح کرائی اور دعام کے بیٹے محمد کے ساتھ صعدہ گئے۔
