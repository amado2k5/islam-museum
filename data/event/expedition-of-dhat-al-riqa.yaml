label: { en: "The Expedition of Dhat al-Riqa'", ar: "غزوة ذات الرقاع" }
summary:
  en: "In the 7th year AH after Khaybar (debated timing), the Prophet led an expedition into Najd against gathering clans of Ghatafan; named from the rags the Muslims wrapped around their injured feet; here Salat al-Khawf (prayer of fear) was performed and the incident of Abbad ibn Bishr praying while struck by arrows occurred."
  ar: "غزوة قادها النبي إلى نجد لتأديب جموع من غطفان في السنة السابعة للهجرة بعد خيبر؛ سميت بذات الرقاع لربط المسلمين الخرق على أقدامهم التي نقبت من وعورة الأرض؛ شُرعت فيها صلاة الخوف وشهدت ثبات عباد بن بشر في صلاته وقد رشقه العدو بثلاثة أسهم."
