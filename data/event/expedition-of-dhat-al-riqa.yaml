label: { en: "The Expedition of Dhat al-Riqa'", ar: "غزوة ذات الرقاع", es: "La expedición de Dhat al-Riqa'", fr: "L'expédition de Dhat al-Riqa'" }
summary:
  en: "In the 7th year AH after Khaybar (debated timing), the Prophet led an expedition into Najd against gathering clans of Ghatafan; named from the rags the Muslims wrapped around their injured feet; here Salat al-Khawf (prayer of fear) was performed and the incident of Abbad ibn Bishr praying while struck by arrows occurred."
  ar: "غزوة قادها النبي إلى نجد لتأديب جموع من غطفان في السنة السابعة للهجرة بعد خيبر؛ سميت بذات الرقاع لربط المسلمين الخرق على أقدامهم التي نقبت من وعورة الأرض؛ شُرعت فيها صلاة الخوف وشهدت ثبات عباد بن بشر في صلاته وقد رشقه العدو بثلاثة أسهم."
  es: "En el séptimo año de la Hégira, después de Khaybar (fecha debatida), el Profeta dirigió una expedición a Najd contra los clanes de Ghatafan, llamados así por los harapos con los que los musulmanes se envolvían los pies heridos; allí se realizó el Salat al-Khawf (oración del temor) y tuvo lugar el incidente de Abbad ibn Bishr orando mientras era alcanzado por flechas."
  fr: "La septième année de l'Hégire après Khaybar (date sujette à débat), le Prophète mena une expédition au Najd contre les clans Ghatafan rassemblés; ainsi nommés d'après les chiffons que les musulmans enroulaient autour de leurs pieds blessés; c'est là que fut accomplie la Salat al-Khawf (prière de la peur) et que se produisit l'incident d'Abbad ibn Bishr priant alors qu'il était frappé par des flèches."
