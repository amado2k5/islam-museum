class: event
kind: massacre
label: { ar: "واقعة القيروان ضد الرافضة أيام المعز بن باديس", en: "Kairouan incident against the Rafida under al-Mu'izz ibn Badis", es: "Incidente de Kairuán contra Rafida bajo el mando de al-Mu'izz ibn Badis", fr: "Incident de Kairouan contre les Rafida sous al-Mu'izz ibn Badis", ur: "المعز بن بدیس کے ماتحت رفدہ کے خلاف کائروآن کا واقعہ", tr: "El-Mu'izz ibn Badis'in hükümdarlığı sırasında Kairouan'da Şiilere karşı yaşanan olay", id: "Peristiwa di Kairouan terhadap kaum Syi'ah pada masa pemerintahan Al-Mu'izz ibn Badis" }
summary:
  ar: "كان المعز بن باديس منحرفاً عن مذاهب الرافضة منتحلاً للسنة فأعلن بمذهبه لأول ولايته ولعن الرافضة ثم صار إلى قتل من وجد منهم، وكبا به فرسه ذات يوم فنادى مستغيثاً باسم أبي بكر وعمر فسمعته العامة فثاروا لحينهم بالشيعة وقتلوهم أبرح قتل وقتل دعاة الرافضة يومئذ وامتعض لذلك خلفاء الشيعة بالقاهرة حتى انقطع الدعاء لهم سنة 440هـ على عهد المستنصر {cite:tarikh-ibn-khaldun-ibar p. 1634}."
  en: "Al-Mu'izz b. Badis broke with the Rafida and proclaimed Sunnism; when his horse stumbled and he called on Abu Bakr and Umar, the commons rose against the Shia and slew them wholesale — the rift deepened until the khutba for the Cairo caliphs was cut in 440 {cite:tarikh-ibn-khaldun-ibar p. 1634}."
  es: "Al-Mu'izz b. Badis rompió con los Rafida y proclamó el sunismo; cuando su caballo tropezó y llamó a Abu Bakr y Umar, el pueblo se levantó contra los chiítas y los masacró en masa; la división se profundizó hasta que se cortó la jutba para los califas de El Cairo en 440 {cite:tarikh-ibn-khaldun-ibar p. 1634}."
  fr: "Al-Mu'izz b. Badis rompit avec les Rafida et proclama le sunnisme; lorsque son cheval trébucha et qu'il appela Abu Bakr et Umar, le peuple se souleva contre les chiites et les massacra en masse — la fracture s'approfondit jusqu'à ce que le sermon des califes du Caire soit interrompu en 440 {cite:tarikh-ibn-khaldun-ibar p. 1634}."
  ur: "المعز ب۔ بادیوں نے رافضی سے رشتہ توڑ دیا اور سنّت کا اعلان کیا۔ جب اس کے گھوڑے کو ٹھوکر لگی اور اس نے ابوبکر اور عمر کو پکارا تو عام لوگ شیعوں کے خلاف اٹھ کھڑے ہوئے اور انہیں تھوک مار کر قتل کر دیا - یہ دراڑ اس وقت تک گہری ہوتی گئی جب تک کہ قاہرہ کے خلفاء کا خطبہ 440 میں منقطع نہ ہو گیا۔ 1634}۔"
  tr: "El-Mu'izz ibn Bedis, Rafizilerin öğretilerinden sapmış, Sünni olduğunu iddia eden bir kişiydi. Hükümranlığının başında bu öğretisini ilan etti ve Rafizileri lanetledi. Ardından aralarından bulduğu herkesi öldürmeye başladı. Bir gün atı tökezledi ve Ebu Bekir ile Ömer adına yardım çağrısında bulundu. Halk onu duydu ve hemen Şiilere karşı ayaklanarak onları en vahşi şekilde öldürdü. O gün Rafizi vaizlerini öldürdü ve Kahire'deki Şii halifeler bundan hoşnut kalmadılar. 440 Hicri yılında El-Mustansir döneminde onlar için yapılan dua durduruldu. {Kaynak: Tarik İbn Haldun İbar, s. 1634}"
  id: "Al-Mu’izz ibn Badis adalah seorang yang menyimpang dari ajaran Rafidiyah, mengaku sebagai seorang Sunni. Ia menyatakan doktrinnya pada awal pemerintahannya dan mengutuk kaum Rafidiyah. Kemudian ia mulai membunuh siapa pun yang ia temukan di antara mereka. Suatu hari kudanya tersandung, dan ia meminta pertolongan atas nama Abu Bakar dan Umar. Rakyat jelata mendengarnya dan segera bangkit melawan kaum Syiah dan membunuh mereka dengan cara yang paling brutal. Ia membunuh para pendakwah Rafidiyah pada hari itu, dan para khalifah Syiah di Kairo tidak senang dengan hal itu sampai doa untuk mereka dihentikan pada tahun 440 H pada masa pemerintahan Al-Mustansir. {cite:tarikh-ibn-khaldun-ibar p. 1634}."
