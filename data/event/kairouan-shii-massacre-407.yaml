summary:
  ar: "كان المعز بن باديس منحرفاً عن مذاهب الرافضة منتحلاً للسنة فأعلن بمذهبه لأول ولايته ولعن الرافضة ثم صار إلى قتل من وجد منهم، وكبا به فرسه ذات يوم فنادى مستغيثاً باسم أبي بكر وعمر فسمعته العامة فثاروا لحينهم بالشيعة وقتلوهم أبرح قتل وقتل دعاة الرافضة يومئذ وامتعض لذلك خلفاء الشيعة بالقاهرة حتى انقطع الدعاء لهم سنة 440هـ على عهد المستنصر {cite:tarikh-ibn-khaldun-ibar p. 1634}."
  en: "Al-Mu'izz b. Badis broke with the Rafida and proclaimed Sunnism; when his horse stumbled and he called on Abu Bakr and Umar, the commons rose against the Shia and slew them wholesale — the rift deepened until the khutba for the Cairo caliphs was cut in 440 {cite:tarikh-ibn-khaldun-ibar p. 1634}."
