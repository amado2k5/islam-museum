label: { ar: "وقعة صفين", en: "Battle of Siffin" }
summary:
  ar: "بين علي بن أبي طالب ومعاوية بن أبي سفيان في سنة سبع وثلاثين. خطب علي أصحابه قبل القتال يوصيهم بثبات الصف وحفظ الرايات {cite:tabari-tarikh-abu-al-fadl j.5 p.17}. وفي أثنائها اقترح عمرو بن العاص على معاوية رفع المصاحف، فرفعها أهل الشام بالرماح ودعوا إلى كتاب الله، فأجاب كثير من أهل العراق {cite:tabari-tarikh-abu-al-fadl j.5 p.48}. ويذكر فهرس الجزء ليلة الهرير وخبر هاشم بن عتبة المرقال {cite:tabari-tarikh-abu-al-fadl j.5 p.627}. وذكر المسعودي أن قتلى صفين سبعون ألفاً من أهل الشام خمسة وأربعون ألفاً ومن أهل العراق خمسة وعشرون ألفاً، وكان المقام بها مائة يوم وعشرة أيام وعدة الوقائع سبعون وقعة، وقتل من الصحابة مع علي خمسة وعشرون رجلاً منهم عمار بن ياسر وهو ابن ثلاث وسبعين سنة، وشهد مع علي من أصحاب بدر سبعة وثمانون منهم سبعة عشر من المهاجرين وسبعون من الأنصار ومن أصحاب بيعة الرضوان تسعمائة وجميع الصحابة ألفان وثمانمائة {cite:muruj-al-dhahab p. 645-646}، وسار علي من الكوفة لخمس خلون من شوال سنة ست وثلاثين فجاور الرقة وعبر على جسر، والمتفق عليه أن معه تسعون ألفاً ومع معاوية خمس وثمانين ألفاً، وسبقه معاوية فاستولى على الشريعة بأبي الأعور السلمي في أربعين ألفاً فحيل بينهم وبين الماء وقال معاوية أو يموتوا عطشاً كما مات عثمان، حتى ألقيت في فسطاط الأشعث رقعة فخرج في أربعة آلاف من الخيل وكسر الحصار عن الماء {cite:muruj-al-dhahab p. 667-668}، واستشهد فيه عمار بن ياسر وهو ابن ثلاث وتسعين سنة وهاشم بن عتبة المرقال وذو الكلاع وصفوان وسعد ابنا حذيفة، وحين اشتد القتل انتدب لعلي عشرة آلاف فأكثر من ربيعة وغيرهم فحمل بهم حملة رجل واحد وهو على البغلة الشهباء يقول من أي يومي من الموت أفر حتى بلغ قبة معاوية {cite:muruj-al-dhahab p. 673-677}. ويرى الصلابي أن علياً قبل وقف القتال ورجع إلى الكوفة معلقاً على التحكيم آمالاً في إزالة الخلاف، وأن أكثرية جيشه كانت في اتجاه الموادعة حتى قالوا قد أكلتنا الحرب، مما ينقض عنده قول من روّج أن رفع المصاحف كان خدعة من عمرو بن العاص، إذ لم تكن الفكرة جديدة بل سبق رفعها في وقعة الجمل حيث رُشق حامله قتيلاً؛ ويورد الصلابي أقوال ابن حجر والنووي وابن كثير والذهبي وابن العربي وابن تيمية وابن باز وسعيد حوى على أن «الفئة الباغية» في مقتل عمار هي جيش معاوية، مع تنزيههم لهؤلاء المجتهدين بأنهم طلبوا القصاص لعثمان فأخطأوا {cite:sallabi-ali-tawzi-2004 p. 558} {cite:sallabi-ali-tawzi-2004 p. 559-562}"
  en: "Between Ali ibn Abi Talib and Mu'awiya ibn Abi Sufyan in 37 AH. Before the fighting Ali addressed his companions, urging them to keep their line firm and guard the banners {cite:tabari-tarikh-abu-al-fadl j.5 p.17}. During the battle Amr ibn al-As proposed to Mu'awiya that the copies of the Qur'an be raised; the people of Syria raised them on their lances and called for the Book of God, and many of the people of Iraq responded {cite:tabari-tarikh-abu-al-fadl j.5 p.48}. The index of that volume mentions the night of al-Harir and the account of Hashim ibn Utba al-Mirqal {cite:tabari-tarikh-abu-al-fadl j.5 p.627}. In al-Mas'udi's account, the dead at Siffin were seventy thousand: forty-five thousand from Syria and twenty-five thousand from Iraq. They stayed there one hundred and ten days, with seventy engagements. Among the Companions who fell fighting with Ali were twenty-five men, including Ammar ibn Yasir, who was seventy-three years old. Eighty-seven veterans of Badr fought with Ali: seventeen of the Muhajirun and seventy of the Ansar; nine hundred of the people of the Pledge of Ridwan; and the Companions in all numbered two thousand eight hundred {cite:muruj-al-dhahab p. 645-646}. Ali left Kufa on the fifth day of Shawwal 36 AH, passed by Raqqa and crossed on a bridge. It is agreed that he had ninety thousand men and Mu'awiya eighty-five thousand. Mu'awiya got there first and seized the water-point with Abu al-A'war al-Sulami and forty thousand men, and Ali's men were cut off from water. Mu'awiya said, 'Let them die of thirst as Uthman died', until a note was dropped into al-Ash'ath's tent; he went out with four thousand horsemen and broke the siege of the water {cite:muruj-al-dhahab p. 667-668}. Ammar ibn Yasir, aged ninety-three, fell there, along with Hashim ibn Utba al-Mirqal, Dhu al-Kala', Safwan and Sa'd, the two sons of Hudhayfa. As the killing intensified, ten thousand or more men, mostly from Rabi'a and others, volunteered for Ali; he charged with them in a single charge, on his white mule, saying, 'From which of my days of death shall I flee?' until he reached Mu'awiya's pavilion {cite:muruj-al-dhahab p. 673-677}. al-Sallabi holds that Ali accepted the ceasefire and returned to Kufa pinning hopes of removing the dispute on the arbitration, that most of his army longed for the truce — 'the war has consumed us' — which in his view refutes the claim that raising the mushafs was Amr ibn al-As's ruse, the idea not being new since it had been tried at the Camel where its bearer was shot dead; and he sets out the readings of Ibn Hajar, al-Nawawi, Ibn Kathir, al-Dhahabi, Ibn al-Arabi, Ibn Taymiyya, Ibn Baz and Sa'id Hawwa that the 'transgressing faction' of the hadith on Ammar's killing was Muawiya's army, while excusing those mujtahids as seekers of qisas for Uthman who erred {cite:sallabi-ali-tawzi-2004 p. 558} {cite:sallabi-ali-tawzi-2004 p. 559-562}."
