    summary:
      ar: "يرى الصلابي، من منظور أهل السنة، أن علياً كان على الحق وأن معاوية مجتهد متأول، وأن الحرب لم تكن لطلب الخلافة عند معاوية بل لطلب القصاص أولاً، مع نقد روايات أبي مخنف ونصر بن مزاحم {cite:sallabi-ali-vol2 p. 104} {cite:sallabi-ali-vol2 p. 148}."
      en: "al-Sallabi, from a Sunni standpoint, holds that Ali was in the right and Muawiya a mujtahid who was mistaken, and that Muawiya fought for qisas first rather than for the caliphate; he grades the Abu Mikhnaf and Nasr ibn Muzahim narrations weak."
