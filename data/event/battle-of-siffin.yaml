label: { ar: "وقعة صفين" }
summary:
  ar: "بين علي بن أبي طالب ومعاوية بن أبي سفيان في سنة سبع وثلاثين. خطب علي أصحابه قبل القتال يوصيهم بثبات الصف وحفظ الرايات {cite:tabari-tarikh-abu-al-fadl j.5 p.17}. وفي أثنائها اقترح عمرو بن العاص على معاوية رفع المصاحف، فرفعها أهل الشام بالرماح ودعوا إلى كتاب الله، فأجاب كثير من أهل العراق {cite:tabari-tarikh-abu-al-fadl j.5 p.48}. ويذكر فهرس الجزء ليلة الهرير وخبر هاشم بن عتبة المرقال {cite:tabari-tarikh-abu-al-fadl j.5 p.627}."
