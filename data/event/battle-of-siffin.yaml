label: { ar: "وقعة صفين" }
summary:
  ar: "بين علي بن أبي طالب ومعاوية بن أبي سفيان في سنة سبع وثلاثين. خطب علي أصحابه قبل القتال يوصيهم بثبات الصف وحفظ الرايات {cite:tabari-tarikh-abu-al-fadl j.5 p.17}. وفي أثنائها اقترح عمرو بن العاص على معاوية رفع المصاحف، فرفعها أهل الشام بالرماح ودعوا إلى كتاب الله، فأجاب كثير من أهل العراق {cite:tabari-tarikh-abu-al-fadl j.5 p.48}. ويذكر فهرس الجزء ليلة الهرير وخبر هاشم بن عتبة المرقال {cite:tabari-tarikh-abu-al-fadl j.5 p.627}.، وذكر المسعودي أن قتلى صفين سبعون ألفاً من أهل الشام خمسة وأربعون ألفاً ومن أهل العراق خمسة وعشرون ألفاً، وكان المقام بها مائة يوم وعشرة أيام وعدة الوقائع سبعون وقعة، وقتل من الصحابة مع علي خمسة وعشرون رجلاً منهم عمار بن ياسر وهو ابن ثلاث وسبعين سنة، وشهد مع علي من أصحاب بدر سبعة وثمانون منهم سبعة عشر من المهاجرين وسبعون من الأنصار ومن أصحاب بيعة الرضوان تسعمائة وجميع الصحابة ألفان وثمانمائة {cite:muruj-al-dhahab p. 645-646}، وسار علي من الكوفة لخمس خلون من شوال سنة ست وثلاثين فجاور الرقة وعبر على جسر، والمتفق عليه أن معه تسعون ألفاً ومع معاوية خمس وثمانين ألفاً، وسبقه معاوية فاستولى على الشريعة بأبي الأعور السلمي في أربعين ألفاً فحيل بينهم وبين الماء وقال معاوية أو يموتوا عطشاً كما مات عثمان، حتى ألقيت في فسطاط الأشعث رقعة فخرج في أربعة آلاف من الخيل وكسر الحصار عن الماء {cite:muruj-al-dhahab p. 667-668}"
