label: { ar: "وقعة صفين", en: "Battle of Siffin" }
summary:
  ar: "وقعة صفين سنة 37هـ/657م بين علي بن أبي طالب ومعاوية بن أبي سفيان، وتصفها دائرة المعارف الإسلامية بأنها سلسلة من المبارزات والمناوشات بين العراقيين والشاميين، وقعت قرب الرقة على الفرات بعد أن تقابل الجيشان نحو سبعة وسبعين يوماً. وتبين المقالة انقسام القبائل بين المعسكرين وأثر الدعاية والوعود المادية وخلاف الروايات في أعداد المقاتلين والقتلى وفي عدد الصحابة مع كل فريق. وتذكر المصادر أن رفع المصاحف دعا كثيراً من أهل العراق إلى الإجابة، وعند الصلابي، من منظور أهل السنة، أن الحق كان مع علي وأن معاوية مجتهد."
  en: "The battle of Siffin was fought in 37 AH/657 CE between Ali ibn Abi Talib and Mu'awiya ibn Abi Sufyan. The Encyclopaedia of Islam describes it as a series of duels and skirmishes between Iraqis and Syrians near al-Raqqa on the Euphrates, after the two armies had faced each other for about 77 days. The article sets out how the tribes divided between the two camps, the part played by propaganda and material promises, and the conflicting reports of the numbers of fighters, of the dead and of Companions on each side. The sources report that the raising of the Qur'an copies drew a response from many in Iraq, and al-Sallabi, from a Sunni standpoint, holds that Ali was in the right and Mu'awiya a mujtahid."
  ur: "صفین کی جنگ 37ھ/657ء میں علی بن ابی طالب اور معاویہ بن ابی سفیان کے درمیان ہوئی۔ انسائیکلوپیڈیا آف اسلام اسے الرقہ کے قریب فرات پر عراقیوں اور شامیوں کے درمیان انفرادی مقابلوں اور جھڑپوں کا سلسلہ بتاتا ہے، جب دونوں لشکر تقریباً ستتر دن آمنے سامنے رہے تھے۔ مضمون بتاتا ہے کہ قبائل دونوں کیمپوں میں کیسے بٹے، پروپیگنڈے اور مادی وعدوں کا کیا کردار رہا، اور جنگجوؤں، مقتولین اور ہر فریق کے ساتھ صحابہ کی تعداد کے بارے میں روایات کیسے مختلف ہیں۔ ماخذ بتاتے ہیں کہ مصاحف اٹھانے پر عراق کے بہت سے لوگ مائل ہوئے، اور صلابی، اہلِ سنت کے نقطۂ نظر سے، کہتے ہیں کہ حق علی کے ساتھ تھا اور معاویہ مجتہد تھے۔"
