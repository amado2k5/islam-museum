id: event/lahore-timur-khokar-801
class: event
kind: other
label:
  ar: "شيخة كوكر يذعن لتيمور في لاهور ثم يُخمد، ٨٠١هـ/١٣٩٨م"
  en: "Shaykha Khokar submits to Timur at Lahore and is suppressed, 801/1398"
  ur: "شیخہ کھوکر کا لہور میں تیمور کے سامنے سر تسلیم خم کرنا اور پھر دبا دیا جانا، 801ھ/1398ء"
  es: "Shaykha Khokar se somete a Timur en Lahore y es reprimida, 801/1398"
  fr: "Le cheikha Khokar se soumet à Timour à Lahore et est réprimé, 801/1398"
  tr: "Şeyh Koker, Lahor'da Timur'a teslim olur ve ardından 801 Hicri/1398 Miladi yılında bastırılır."
  id: "Sheikh Koker tunduk kepada Timur di Lahore dan kemudian ditindas, 801 H/1398 M"
summary:
  ar: "كان شيخة كوكر قد عُيِّن واليًا على لاهور من طرف محمود شاه طغلق، فبادر إلى إظهار الطاعة لتيمور سنة ٨٠١هـ/١٣٩٨م، ولكنه لما أبدى بوادر خروج عن الطاعة أخمدته حملة قادها بير محمد بن جهانكير حفيد تيمور {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  en: "Shaykha Khokar, appointed governor of Lahore by Mahmud Shah Tughluq, made a timely submission to Timur in 801/1398; but on showing signs of disaffection he was suppressed by an army under the conqueror's grandson Pir Muhammad b. Jahangir {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  ur: "شیخہ کھوکر جسے محمود شاہ طغلق نے لہور کا گورنر مقرر کیا تھا، نے 801ھ/1398ء میں تیمور کے آگے بروقت سر تسلیم خم کیا؛ لیکن بے وفائی کے آثار دکھانے پر فاتح کے پوتے پیر محمد بن جہانگیر کی قیادت میں ایک فوج نے اسے کچل دیا {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  es: "Shaykha Khokar, nombrado gobernador de Lahore por Mahmud Shah Tughluq, se sometió oportunamente a Timur en 801/1398; pero al mostrar signos de desafección, fue reprimido por un ejército bajo el mando del nieto del conquistador, Pir Muhammad b. Jahangir {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  fr: "Shaykha Khokar, nommé gouverneur de Lahore par Mahmud Shah Tughluq, fit une soumission opportune à Timur en 801/1398; mais, ayant montré des signes de dissidence, il fut réprimé par une armée sous le commandement du petit-fils du conquérant, Pir Muhammad b. Jahangir {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  tr: "Şeyh Koker, Mahmud Şah Tuğluk tarafından Lahor valisi olarak atanmış ve 801 Hicri/1398 Miladi yılında Timur'a itaat göstermeye acele etmişti; ancak isyan belirtileri gösterince, Timur'un torunu Pir Muhammed bin Cihangir önderliğindeki bir seferle bastırıldı. {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}"
  id: "Sheikh Koker diangkat menjadi gubernur Lahore oleh Mahmud Shah Tughluq, dan ia segera menunjukkan ketaatan kepada Timur pada tahun 801 H/1398 M, tetapi ketika ia menunjukkan tanda-tanda pemberontakan, ia ditumpas oleh sebuah kampanye yang dipimpin oleh Pir Muhammad bin Jahangir, cucu Timur. {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
