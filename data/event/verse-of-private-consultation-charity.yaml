label: { ar: "آية النجوى وتقديم الصدقة قبل مناجاة النبي", en: "The verse of private consultation: charity before speaking privately with the Prophet" }
summary:
  ar: "روى علي أن النبي أمره أن يأمر الناس بالصدقة قبل مناجاتهم له، فسأل: بكم؟ فقال: بدينار، ثم بنصف دينار، ثم بشعيرة من ذهب، فقال النبي: إنك لزهيد، فنزلت الآية بالتخفيف، فكان علي يقول: «فبي خفف الله عن هذه الأمة». يورد الصلابي الرواية من سنن الترمذي وهو يذكر أنها من تفسير النبي لآيات القرآن (ص 47)، وقد ضعّف الألباني هذه الرواية في هامش الكتاب."
  en: "Ali reports that the Prophet told him to order people to give charity before they consulted him privately; he gave a dinar, then half a dinar, then a barley-grain's weight of gold; the Prophet called him frugal and the verse eased the duty, which Ali took as the relief of this community. Al-Sallabi cites al-Tirmidhi, while the book's footnote records al-Albani's weakening of the report (p. 47)."
