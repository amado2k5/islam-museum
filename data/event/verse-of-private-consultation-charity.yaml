id: event/verse-of-private-consultation-charity
class: event
kind: other
label: { ar: "آية النجوى وتقديم الصدقة قبل مناجاة النبي", en: "The verse of private consultation: charity before speaking privately with the Prophet", es: "El versículo de la consulta privada: la caridad antes de hablar en privado con el Profeta", fr: "Le verset de la consultation privée: faire l'aumône avant de parler en privé avec le Prophète", ur: "ذاتی مشورے کی آیت: نبی سے رازداری میں بات کرنے سے پہلے صدقہ کرنا" }
summary:
  ar: "روى علي أن النبي أمره أن يأمر الناس بالصدقة قبل مناجاتهم له، فسأل: بكم؟ فقال: بدينار، ثم بنصف دينار، ثم بشعيرة من ذهب، فقال النبي: إنك لزهيد، فنزلت الآية بالتخفيف، فكان علي يقول: «فبي خفف الله عن هذه الأمة». يورد الصلابي الرواية من سنن الترمذي وهو يذكر أنها من تفسير النبي لآيات القرآن ⁦(ص 47)⁩، وقد ضعّف الألباني هذه الرواية في هامش الكتاب."
  en: "Ali reports that the Prophet told him to order people to give charity before they consulted him privately; he gave a dinar, then half a dinar, then a barley-grain's weight of gold; the Prophet called him frugal and the verse eased the duty, which Ali took as the relief of this community. Al-Sallabi cites al-Tirmidhi, while the book's footnote records al-Albani's weakening of the report (p. 47)."
  es: "Ali relata que el Profeta le ordenó que instruyera a la gente para que diera limosna antes de consultarle en privado; dio un dinar, luego medio dinar, y después el equivalente al peso de un grano de cebada en oro. El Profeta lo calificó de frugal y el versículo alivió la obligación, lo cual Ali interpretó como un alivio para la comunidad. Al-Sallabi cita a al-Tirmidhi, mientras que la nota al pie del libro registra la atenuación del relato por parte de al-Albani (p. 47)."
  fr: "Ali rapporte que le Prophète lui a ordonné d'enjoindre les gens à faire l'aumône avant même de le consulter en privé; il donna d'abord un dinar, puis un demi-dinar, puis l'équivalent d'un grain d'orge en or; le Prophète le qualifia de frugal et le verset allège l'obligation, ce qu'Ali considéra comme un soulagement pour la communauté. Al-Sallabi cite al-Tirmidhi, tandis que la note de bas de page de l'ouvrage mentionne l'interprétation atténuée de ce récit par al-Albani (p. 47)."
  ur: "علی بیان کرتے ہیں کہ نبی نے ان سے کہا کہ لوگوں کو صدقہ دینے کا حکم دیں اس سے پہلے کہ وہ ان سے نجی طور پر مشورہ کریں۔ اس نے ایک دینار، پھر آدھا دینار، پھر جو کے دانے کے برابر سونا دیا۔ نبی نے اسے سستی کہا اور آیت نے اس فرض کو آسان کر دیا، جسے علی نے اس کمیونٹی کی راحت کے طور پر لیا۔ السلبی نے ترمذی کا حوالہ دیا ہے، جب کہ کتاب کے حاشیہ میں البانی کی رپورٹ کے کمزور ہونے کو درج کیا گیا ہے ⁦(ص 47)⁩۔"
