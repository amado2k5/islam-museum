label: { ar: "نفر من الجن يستمعون القرآن بوادي نخلة", en: "A company of jinn hear the Qur'an at Wadi Nakhla", es: "Un grupo de genios escucha el Corán en Wadi Nakhla.", fr: "Une compagnie de djinns écoute le Coran à Wadi Nakhla", ur: "جنات کی ایک جماعت وادی نخلہ میں قرآن سن رہی ہے۔", tr: "Nakhla vadisinde Kur'an dinleyen bir cin grubu.", id: "Sekelompok jin mendengarkan Al-Quran di lembah Nakhla." }
summary:
  ar: "أقام النبي بوادي نخلة في طريقه إلى مكة بعد الطائف، فاستمع إليه نفر من الجن لم يعلم بحضورهم حتى أعلمه الله بذلك، فآمنوا ورجعوا منذرين قومهم؛ وفي ذلك بشارة بنجاح الدعوة."
  en: "While the Prophet stayed at Wadi Nakhla on his way back from al-Taif, a company of jinn listened to the Qur'an without his knowing of their presence until God informed him; they believed and returned to warn their people."
  es: "Mientras el Profeta se alojaba en Wadi Nakhla de regreso de al-Taif, un grupo de genios escuchó el Corán sin que él supiera de su presencia, hasta que Dios se lo reveló; ellos creyeron y regresaron para advertir a su pueblo."
  fr: "Alors que le Prophète séjournait à Wadi Nakhla sur le chemin du retour d'al-Taif, un groupe de djinns écouta le Coran à son insu jusqu'à ce que Dieu l'en informe; ils crurent et retournèrent avertir leur peuple."
  ur: "جب نبی طائف سے واپسی پر وادی نخلہ میں ٹھہرے تو جنات کی ایک جماعت نے قرآن سنا جب تک کہ اللہ تعالیٰ نے ان کی موجودگی کو نہ جانا۔ وہ ایمان لائے اور اپنے لوگوں کو خبردار کرنے کے لیے واپس آئے۔"
  tr: "Peygamber, Taif'ten sonra Mekke yolunda Nahla vadisinde kaldı. Bir grup cin onu dinledi, ancak Allah ona bildirinceye kadar onların varlığından habersizdi. Onlar inandılar ve halklarını uyarmak için geri döndüler; bu da tebliğin başarısının müjdesiydi."
  id: "Nabi Muhammad SAW singgah di lembah Nakhla dalam perjalanan ke Mekah setelah Taif. Sekelompok jin mendengarkan dakwahnya, tetapi beliau tidak menyadari kehadiran mereka sampai Allah memberitahukannya. Mereka beriman dan kembali untuk memperingatkan kaum mereka; dan di dalamnya terdapat kabar gembira tentang keberhasilan dakwah tersebut."
