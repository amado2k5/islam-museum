id: event/baghdadi-aq-departs-nishapur-429
class: event
kind: other
label:
  ar: "فتنة التركمان تضطر البغدادي إلى مفارقة نيسابور نحو إسفرايين، ٤٢٩هـ"
  en: "The Turkmen troubles drive al-Baghdadi out of Nishapur to Isfarayin, 429/1038"
  ur: "ترکمانوں کی فتنے نے بغدادی کو نیشاپور سے اسفراین جانے پر مجبور کیا، 429ھ/1038ء"
  fr: "Les troubles turkmènes chassent al-Baghdadi de Nishapur vers Isfarayin, 429/1038"
  es: "Los problemas con los turcomanos obligan a al-Baghdadi a abandonar Nishapur y trasladarse a Isfarayin, 429/1038."
  tr: "Türkmen isyanı, el-Bağdadi'yi Hicri 429 yılında Nişapur'dan İsfarayin'e gitmeye zorladı."
  id: "Pemberontakan Turkmenistan memaksa al-Baghdadi meninggalkan Nishapur menuju Isfarayin, 429 H."
summary:
  ar: "فارق أبو منصور البغدادي نيسابور بسبب فتنة وقعت بها من التركمان — وقد قيل: «ومن خراب نيسابور أن اضطر مثله إلى مفارقتها» — فخرج منها في أيام التركمانية وفتنتهم إلى إسفرايين سنة ٤٢٩هـ، وهي سنة دخول السلاجقة المدينة {cite:tabaqat-shafiiyya-subki p. 238} {cite:mawsuat-a3lam-ulama-adaba p. 635} {cite:tarikh-islam-dhahabi p. 265}."
  en: "Abu Mansur al-Baghdadi left Nishapur because of the Turkmen disturbance that struck it — it was said that among the calamities of Nishapur was that a man like him was forced to leave — departing for Isfarayin in the days of the Turkmen ascendancy in 429/1038, the year the Seljuks entered the city {cite:tabaqat-shafiiyya-subki p. 238} {cite:mawsuat-a3lam-ulama-adaba p. 635} {cite:tarikh-islam-dhahabi p. 265}."
  ur: "ابو منصور بغدادی نے ترکمانوں کے فتنے کی وجہ سے نیشاپور چھوڑا — کہا گیا کہ نیشاپور کی خرابیوں میں سے ایک یہ تھی کہ ان جیسے شخص کو اسے چھوڑنا پڑا — اور 429ھ میں ترکمانوں کے ایام میں اسفراین چلے گئے، یہی وہ سال ہے جب سلجوق شہر میں داخل ہوئے {cite:tabaqat-shafiiyya-subki p. 238} {cite:mawsuat-a3lam-ulama-adaba p. 635} {cite:tarikh-islam-dhahabi p. 265}۔"
  fr: "Abu Mansur al-Baghdadi quitta Nishapur à cause des troubles turkmènes qui la frappèrent ; on disait que, parmi les malheurs de Nishapur, il y avait qu'un homme comme lui fût contraint de partir ; il partit pour Isfarayin aux jours de l'ascendant turkmène, en 429/1038, l'année où les Seldjoukides entrèrent dans la ville {cite:tabaqat-shafiiyya-subki p. 238} {cite:mawsuat-a3lam-ulama-adaba p. 635} {cite:tarikh-islam-dhahabi p. 265}."
  es: "Abu Mansur al-Baghdadi abandonó Nishapur debido a la revuelta turcomana que la azotó —se decía que entre las calamidades de Nishapur estaba el hecho de que un hombre como él se viera obligado a marcharse— partiendo hacia Isfarayin en los días del auge turcomano en 429/1038, el año en que los selyúcidas entraron en la ciudad {cite:tabaqat-shafiiyya-subki p. 238} {cite:mawsuat-a3lam-ulama-adaba p. 635} {cite:tarikh-islam-dhahabi p. 265}."
  tr: "Ebu Mansur el-Bağdadi, Türkmenlerin orada yarattığı bir felaket nedeniyle Nişapur'dan ayrıldı - ve şöyle denmiştir: \"Nishapur'un yıkımı yüzünden onun gibi biri bile orayı terk etmek zorunda kaldı\" - böylece Türkmenlerin ve onların felaket günlerinde, Hicri 429 yılında, Selçukluların şehre girdiği yılda, İsfarayin'e gitti. {cite:tabaqat-shafiiyya-subki s. 238} {cite:mawsuat-a3lam-ulama-adaba s. 635} {cite:tarikh-islam-dhahabi s. 265}."
  id: "Abu Mansur al-Baghdadi meninggalkan Nishapur karena cobaan yang terjadi di sana dari bangsa Turkmenistan — dan dikatakan: “Dan karena kehancuran Nishapur itulah seseorang seperti dia terpaksa meninggalkannya” — jadi dia meninggalkannya pada masa kekuasaan bangsa Turkmenistan dan cobaan mereka ke Isfarayin pada tahun 429 H, yaitu tahun ketika Seljuk memasuki kota tersebut {cite:tabaqat-shafiiyya-subki hlm. 238} {cite:mawsuat-a3lam-ulama-adaba hlm. 635} {cite:tarikh-islam-dhahabi hlm. 265}."
