id: event/baghdadi-aq-departs-nishapur-429
class: event
kind: other
label:
  ar: "فتنة التركمان تضطر البغدادي إلى مفارقة نيسابور نحو إسفرايين، ٤٢٩هـ"
  en: "The Turkmen troubles drive al-Baghdadi out of Nishapur to Isfarayin, 429/1038"
  ur: "ترکمانوں کی فتنے نے بغدادی کو نیشاپور سے اسفراین جانے پر مجبور کیا، 429ھ/1038ء"
summary:
  ar: "فارق أبو منصور البغدادي نيسابور بسبب فتنة وقعت بها من التركمان — وقد قيل: «ومن خراب نيسابور أن اضطر مثله إلى مفارقتها» — فخرج منها في أيام التركمانية وفتنتهم إلى إسفرايين سنة ٤٢٩هـ، وهي سنة دخول السلاجقة المدينة {cite:tabaqat-shafiiyya-subki p. 238} {cite:mawsuat-a3lam-ulama-adaba p. 635} {cite:tarikh-islam-dhahabi p. 265}."
  en: "Abu Mansur al-Baghdadi left Nishapur because of the Turkmen disturbance that struck it — it was said that among the calamities of Nishapur was that a man like him was forced to leave — departing for Isfarayin in the days of the Turkmen ascendancy in 429/1038, the year the Seljuks entered the city {cite:tabaqat-shafiiyya-subki p. 238} {cite:mawsuat-a3lam-ulama-adaba p. 635} {cite:tarikh-islam-dhahabi p. 265}."
  ur: "ابو منصور بغدادی نے ترکمانوں کے فتنے کی وجہ سے نیشاپور چھوڑا — کہا گیا کہ نیشاپور کی خرابیوں میں سے ایک یہ تھی کہ ان جیسے شخص کو اسے چھوڑنا پڑا — اور 429ھ میں ترکمانوں کے ایام میں اسفراین چلے گئے، یہی وہ سال ہے جب سلجوق شہر میں داخل ہوئے {cite:tabaqat-shafiiyya-subki p. 238} {cite:mawsuat-a3lam-ulama-adaba p. 635} {cite:tarikh-islam-dhahabi p. 265}۔"
