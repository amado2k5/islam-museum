label: { ar: "خلع المهتدى ثم موته", en: "The deposition and death of al-Muhtadi" }
summary:
  ar: "في سنة ست وخمسين ومائتين خُلع المهتدى في رجب بعد تحرك أهل الكرخ والدور طلباً لأرزاقهم، وتوفي في الشهر نفسه {cite:tabari-tarikh-abu-al-fadl j.9 p.456}، ودخل موسى بن بغا ومفلح سامراء بعد وفاته {cite:tabari-tarikh-abu-al-fadl j.9 p.462}، وعند السيوطي قدم موسى بن بغا من الري لقتل صالح بن وصيف بدم المعتز فهجم على المهتدي وهو جالس في دار العدل فأقاموه على فرس ضعيفة وانتهبوا القصر ثم أعادوه بعد أن حلف ألا يمالئ صالحاً، ونادى موسى من جاء بصالح فله عشرة آلاف دينار فوجده بعض الغلمان نائماً في دهليز فقطعت رأسه وطيف بها، ثم رحل موسى وباكباك إلى السن في طلب مساور فكتب المهتدي إلى باكباك أن يقتل موسى ومفلحاً فأوقف باكباك موسى على كتابه فأجمعوا على قتله فقاتل عنه المغاربة والفراغنة والأشروسنية وقتل من الأتراك في يوم أربعة آلاف ودام القتال إلى أن هزم جيشه وأمسك فعصر على خصيتيه فمات في رجب سنة ست وخمسين وكانت خلافته سنة إلا خمسة عشر يوماً، وكان الأعم قد ثاروا وكتبوا رقاعاً ألقوها في المساجد ادعوا الله لخليفتكم العدل الرضي المضاهي لعمر بن عبد العزيز {cite:tarikh-khulafa-minhaj-1434 p. 562-563}. وعند المسعودي أشرف بايكيال على المهتدي بجسر سامرا فكانت بينهما حرب عظيمة انكشف فيها بايكيال ثم خرج كمينه وفيه يارجوج التركي فولى المهتدي يستغيث بالعامة في الأسواق فلا مغيث، فمضى إلى دار ابن جيعونة مختفياً فهجموا عليه وحملوه إلى دار يارجوج، وانقادوا له حتى قام فيهم سليمان بن وهب الكاتب فقال إن أعطاكم بلسانه فنيته فيكم غير هذا فجاءوه بالخناجر، وكان أول من جرحه ابن عم لبايكيال جرحه في أوداجه والتقم الجرح يمص الدم حتى روي وهو سكران، وتنوزع في قتله فقيل بالخناجر وقيل عصرت مذاكيره وقيل شد بين لوحين بالحبال وقيل خنقاً وقيل كبس بالبسط والوسائد، وكان يوم الثلاثاء لأربع عشرة بقيت من رجب سنة خمس وخمسين ومائتين، وداروا به ينوحون ندماً لما تبينوا من نسكه {cite:muruj-al-dhahab p. 559-561}"
  en: "In the year 256 al-Muhtadi was deposed in Rajab, after the people of al-Karkh and the quarters stirred demanding their stipends, and he died in the same month {cite:tabari-tarikh-abu-al-fadl j.9 p.456}. Musa ibn Bugha and Muflih entered Samarra after his death {cite:tabari-tarikh-abu-al-fadl j.9 p.462}. According to al-Suyuti, Musa ibn Bugha came from al-Rayy to kill Salih ibn Wasif in revenge for the blood of al-Mu'tazz. He fell upon al-Muhtadi while he sat in the Dar al-Adl; they set him on a weak horse and plundered the palace, then brought him back after he swore not to side with Salih. Musa proclaimed that whoever brought Salih would receive ten thousand dinars; one of the slaves found Salih asleep in a corridor, and his head was cut off and paraded. Then Musa and Bakbak set out for al-Sinn in pursuit of Musawir. Al-Muhtadi wrote to Bakbak ordering him to kill Musa and Muflih; Bakbak showed Musa the letter, and they agreed to kill him. The Maghariba, the Farghanis and the Ushrusaniyya fought for al-Muhtadi, and four thousand Turks were killed in one day. The fighting went on until his army was routed and he was seized; they squeezed his testicles, and he died in Rajab of the year 256. His caliphate lasted a year less fifteen days. The common folk had risen and written notes that they left in the mosques: 'Pray to God for your just and pleasing caliph, the equal of Umar ibn Abd al-Aziz' {cite:tarikh-khulafa-minhaj-1434 p. 562-563}. According to al-Mas'udi, Bayakbal confronted al-Muhtadi on the bridge of Samarra and a great battle took place in which Bayakbal was routed; then his ambush came out, among them the Turk Yarjuj, and al-Muhtadi turned and cried out to the common people in the markets for help, but no one came to his aid. He went into hiding at the house of Ibn Ja'una, and they attacked him and carried him to the house of Yarjuj. They submitted to him until Sulayman ibn Wahb the secretary stood among them and said: 'If he gives you his tongue, his intention toward you is something other than this'; and they brought daggers. The first to wound him was a cousin of Bayakbal, who cut into his jugular, and he put his mouth to the wound, sucking the blood until he was sated, while drunk. They disagreed about how to kill him: some said with daggers, some that his genitals were squeezed, some that he was tied between two boards with ropes, some that he was strangled, and some that he was smothered under rugs and cushions. This happened on Tuesday, fourteen nights before the end of Rajab of the year 255, and they went around with him lamenting in remorse for what they had come to realise of his piety {cite:muruj-al-dhahab p. 559-561}."
