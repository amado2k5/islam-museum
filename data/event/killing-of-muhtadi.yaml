id: event/killing-of-muhtadi
class: event
kind: death
label: { ar: "خلع المهتدى ثم موته", en: "The deposition and death of al-Muhtadi", es: "La deposición y muerte de al-Muhtadi", fr: "La destitution et la mort d'al-Muhtadi", ur: "المحتدی کی معزولی اور وفات", tr: "El-Muhtadi'nin görevden alınması ve ardından ölümü", id: "Pencopotan al-Muhtadi dan kemudian kematiannya" }
summary:
  ar: "في سنة ست وخمسين ومائتين خُلع المهتدى في رجب بعد تحرك أهل الكرخ والدور طلباً لأرزاقهم، وتوفي في الشهر نفسه {cite:tabari-tarikh-abu-al-fadl j.9 p.456}، ودخل موسى بن بغا ومفلح سامراء بعد وفاته {cite:tabari-tarikh-abu-al-fadl j.9 p.462}، وعند السيوطي قدم موسى بن بغا من الري لقتل صالح بن وصيف بدم المعتز فهجم على المهتدي وهو جالس في دار العدل فأقاموه على فرس ضعيفة وانتهبوا القصر ثم أعادوه بعد أن حلف ألا يمالئ صالحاً، ونادى موسى من جاء بصالح فله عشرة آلاف دينار فوجده بعض الغلمان نائماً في دهليز فقطعت رأسه وطيف بها، ثم رحل موسى وباكباك إلى السن في طلب مساور فكتب المهتدي إلى باكباك أن يقتل موسى ومفلحاً فأوقف باكباك موسى على كتابه فأجمعوا على قتله فقاتل عنه المغاربة والفراغنة والأشروسنية وقتل من الأتراك في يوم أربعة آلاف ودام القتال إلى أن هزم جيشه وأمسك فعصر على خصيتيه فمات في رجب سنة ست وخمسين وكانت خلافته سنة إلا خمسة عشر يوماً، وكان الأعم قد ثاروا وكتبوا رقاعاً ألقوها في المساجد ادعوا الله لخليفتكم العدل الرضي المضاهي لعمر بن عبد العزيز {cite:tarikh-khulafa-minhaj-1434 p. 562-563}. وعند المسعودي أشرف بايكيال على المهتدي بجسر سامرا فكانت بينهما حرب عظيمة انكشف فيها بايكيال ثم خرج كمينه وفيه يارجوج التركي فولى المهتدي يستغيث بالعامة في الأسواق فلا مغيث، فمضى إلى دار ابن جيعونة مختفياً فهجموا عليه وحملوه إلى دار يارجوج، وانقادوا له حتى قام فيهم سليمان بن وهب الكاتب فقال إن أعطاكم بلسانه فنيته فيكم غير هذا فجاءوه بالخناجر، وكان أول من جرحه ابن عم لبايكيال جرحه في أوداجه والتقم الجرح يمص الدم حتى روي وهو سكران، وتنوزع في قتله فقيل بالخناجر وقيل عصرت مذاكيره وقيل شد بين لوحين بالحبال وقيل خنقاً وقيل كبس بالبسط والوسائد، وكان يوم الثلاثاء لأربع عشرة بقيت من رجب سنة خمس وخمسين ومائتين، وداروا به ينوحون ندماً لما تبينوا من نسكه {cite:muruj-al-dhahab p. 559-561}"
  en: "In the year 256 al-Muhtadi was deposed in Rajab, after the people of al-Karkh and the quarters stirred demanding their stipends, and he died in the same month {cite:tabari-tarikh-abu-al-fadl j.9 p.456}. Musa ibn Bugha and Muflih entered Samarra after his death {cite:tabari-tarikh-abu-al-fadl j.9 p.462}. According to al-Suyuti, Musa ibn Bugha came from al-Rayy to kill Salih ibn Wasif in revenge for the blood of al-Mu'tazz. He fell upon al-Muhtadi while he sat in the Dar al-Adl; they set him on a weak horse and plundered the palace, then brought him back after he swore not to side with Salih. Musa proclaimed that whoever brought Salih would receive ten thousand dinars; one of the slaves found Salih asleep in a corridor, and his head was cut off and paraded. Then Musa and Bakbak set out for al-Sinn in pursuit of Musawir. Al-Muhtadi wrote to Bakbak ordering him to kill Musa and Muflih; Bakbak showed Musa the letter, and they agreed to kill him. The Maghariba, the Farghanis and the Ushrusaniyya fought for al-Muhtadi, and four thousand Turks were killed in one day. The fighting went on until his army was routed and he was seized; they squeezed his testicles, and he died in Rajab of the year 256. His caliphate lasted a year less fifteen days. The common folk had risen and written notes that they left in the mosques: 'Pray to God for your just and pleasing caliph, the equal of Umar ibn Abd al-Aziz' {cite:tarikh-khulafa-minhaj-1434 p. 562-563}. According to al-Mas'udi, Bayakbal confronted al-Muhtadi on the bridge of Samarra and a great battle took place in which Bayakbal was routed; then his ambush came out, among them the Turk Yarjuj, and al-Muhtadi turned and cried out to the common people in the markets for help, but no one came to his aid. He went into hiding at the house of Ibn Ja'una, and they attacked him and carried him to the house of Yarjuj. They submitted to him until Sulayman ibn Wahb the secretary stood among them and said: 'If he gives you his tongue, his intention toward you is something other than this'; and they brought daggers. The first to wound him was a cousin of Bayakbal, who cut into his jugular, and he put his mouth to the wound, sucking the blood until he was sated, while drunk. They disagreed about how to kill him: some said with daggers, some that his genitals were squeezed, some that he was tied between two boards with ropes, some that he was strangled, and some that he was smothered under rugs and cushions. This happened on Tuesday, fourteen nights before the end of Rajab of the year 255, and they went around with him lamenting in remorse for what they had come to realise of his piety {cite:muruj-al-dhahab p. 559-561}."
  es: "En el año 256 al-Muhtadi fue depuesto en Rajab, después de que la gente de al-Karkh y los barrios se sublevaran exigiendo sus estipendios, y murió en el mismo mes {cite:tabari-tarikh-abu-al-fadl j.9 p.456}. Musa ibn Bugha y Muflih entraron en Samarra después de su muerte {cite:tabari-tarikh-abu-al-fadl j.9 p.462}. Según al-Suyuti, Musa ibn Bugha vino de al-Rayy para matar a Salih ibn Wasif en venganza por la sangre de al-Mu'tazz. Atacó a al-Muhtadi mientras estaba sentado en Dar al-Adl; lo pusieron en un caballo débil y saquearon el palacio, luego lo trajeron de vuelta después de que juró no ponerse del lado de Salih. Musa proclamó que quien trajera a Salih recibiría diez mil dinares; Uno de los esclavos encontró a Salih dormido en un corredor, y le cortaron la cabeza y la exhibieron. Luego Musa y Bakbak partieron hacia al-Sinn en persecución de Musawir. Al-Muhtadi escribió a Bakbak ordenándole que matara a Musa y Muflih; Bakbak le mostró la carta a Musa, y acordaron matarlo. Los Maghariba, los Farghani y los Ushrusaniyya lucharon por al-Muhtadi, y cuatro mil turcos murieron en un día. La lucha continuó hasta que su ejército fue derrotado y él fue apresado; le apretaron los testículos y murió en Rajab del año 256. Su califato duró un año menos quince días. El pueblo se había levantado y había escrito notas que dejaron en las mezquitas: 'Rueguen a Dios por su califa justo y agradable, igual a Umar ibn Abd al-Aziz' {cite:tarikh-khulafa-minhaj-1434 p. 562-563}. Según al-Mas'udi, Bayakbal se enfrentó a al-Muhtadi en el puente de Samarra y tuvo lugar una gran batalla en la que Bayakbal fue derrotado; entonces salió su emboscada, entre ellos el turco Yarjuj, y al-Muhtadi se volvió y gritó a la gente común en los mercados pidiendo ayuda, pero nadie acudió en su auxilio. Se escondió en la casa de Ibn Ja'una, y lo atacaron y lo llevaron a la casa de Yarjuj. Se sometieron a él hasta que Sulayman ibn Wahb, el secretario, se puso entre ellos y dijo: 'Si te da la lengua, su intención hacia ti es otra'; y trajeron dagas. El primero en herirlo fue un primo de Bayakbal, quien le cortó la yugular, y puso la boca en la herida, chupando la sangre hasta saciarse, estando ebrio. Discrepaban sobre cómo matarlo: algunos decían que con dagas, otros que le apretaron los genitales, otros que lo ataron entre dos tablas con cuerdas, otros que lo estrangularon y otros que lo asfixiaron con alfombras y cojines. Esto ocurrió un martes, catorce noches antes del final de Rajab del año 255, y lo acompañaron lamentándose con remordimiento por lo que habían llegado a comprender de su piedad {cite:muruj-al-dhahab p. 559-561}."
  fr: "En 256, al-Muhtadi fut déposé en Rajab, suite aux protestations des habitants d'al-Karkh et des environs qui réclamaient leurs allocations. Il mourut le même mois (voir Tabari Tarikh Abu al-Fadl, vol. 9, p. 456). Musa ibn Bugha et Muflih entrèrent à Samarra après sa mort (voir Tabari Tarikh Abu al-Fadl, vol. 9, p. 462). Selon al-Suyuti, Musa ibn Bugha, venu d'al-Rayy, avait pour mission de tuer Salih ibn Wasif en représailles au meurtre d'al-Mu'tazz. Il attaqua al-Muhtadi alors qu'il siégeait au Dar al-Adl; ils le firent monter sur un cheval chétif et pillèrent le palais, puis le ramenèrent après qu'il eut juré de ne pas se ranger du côté de Salih. Musa proclama que quiconque ramènerait Salih recevrait dix mille dinars. Un des esclaves trouva Salih endormi dans un couloir; sa tête fut tranchée et exhibée. Puis Musa et Bakbak partirent pour le Sinn à la poursuite de Musawir. Al-Muhtadi écrivit à Bakbak lui ordonnant de tuer Musa et Muflih; Bakbak montra la lettre à Musa, et ils convinrent de le tuer. Les Maghariba, les Farghanis et les Ushrusaniyya combattirent pour al-Muhtadi, et quatre mille Turcs furent tués en une seule journée. Les combats se poursuivirent jusqu'à la déroute de son armée et sa capture; on lui écrasa les testicules, et il mourut en Rajab de l'an 256. Son califat dura un an moins quinze jours. Le peuple s'était soulevé et avait écrit des messages qu'il laissa dans les mosquées: « Priez Dieu pour votre calife juste et agréable, l'égal d'Umar ibn Abd al-Aziz » (cite: tarikh-khulafa-minhaj-1434 p. 1). 562-563. Selon al-Mas'udi, Bayakbal affronta al-Muhtadi sur le pont de Samarra et une grande bataille s'ensuivit, au cours de laquelle Bayakbal fut mis en déroute. Une embuscade se déroula alors, parmi laquelle se trouvait le Turc Yarjuj. Al-Muhtadi se retourna et appela à l'aide la foule sur les marchés, mais personne ne vint à son secours. Il se réfugia chez Ibn Ja'una, mais ses hommes l'attaquèrent et le conduisirent chez Yarjuj. Ils se soumirent à lui jusqu'à ce que Sulayman ibn Wahb, le secrétaire, se tienne parmi eux et dise: « S'il vous parle, ses intentions à votre égard sont tout autres. » Ils apportèrent alors des poignards. Le premier à le blesser fut un cousin de Bayakbal, qui lui trancha la jugulaire. Al-Muhtadi porta sa bouche à la plaie et, ivre, suça le sang jusqu'à satiété. Ils divergeaient sur la manière de le tuer: certains disaient qu’il fallait le poignarder, d’autres qu’on lui serrait les parties génitales, d’autres encore qu’il fallait l’attacher entre deux planches avec des cordes, d’autres qu’il fallait l’étrangler, et d’autres enfin qu’il fallait l’étouffer sous des tapis et des coussins. Cela se produisit un mardi, quatorze nuits avant la fin du mois de Rajab de l’an 255, et ils l’accompagnèrent en pleurant et en se lamentant sur ce qu’ils avaient compris de sa piété {cite: Muruj-al-Dhahab, p. 559-561}."
  ur: "256 رجب میں المحتدی کو اس وقت معزول کر دیا گیا جب اہل کرخ اور حلقوں نے اپنے وظیفہ کے مطالبہ پر ہلچل مچائی اور اسی مہینے میں ان کا انتقال ہو گیا۔ موسیٰ ابن بغضہ اور مفلح ان کی وفات کے بعد سامرہ میں داخل ہوئے۔ سیوطی کے مطابق، موسیٰ بن بوغہ الری سے آیا تھا تاکہ صالح بن واصف کو معتز کے خون کا بدلہ لے سکے۔ جب وہ دارالعدل میں بیٹھا تھا تو وہ المحتدی پر گر پڑا۔ انہوں نے اسے ایک کمزور گھوڑے پر بٹھایا اور محل کو لوٹ لیا، پھر صالح کا ساتھ نہ دینے کی قسم کھانے کے بعد اسے واپس لے آئے۔ موسیٰ نے اعلان کیا کہ جو کوئی صالح کو لے کر آئے گا اسے دس ہزار دینار ملیں گے۔ غلاموں میں سے ایک نے صالح کو ایک راہداری میں سوتے ہوئے پایا، اور اس کا سر کاٹ کر پریڈ کی گئی۔ پھر موسیٰ اور بکبک مساویر کے تعاقب میں السن کی طرف روانہ ہوئے۔ المحتدی نے بکبک کو لکھا کہ موسیٰ اور مفلح کو قتل کر دو۔ بکبک نے موسیٰ کو خط دکھایا، اور وہ اسے قتل کرنے پر راضی ہوگئے۔ مغرب، فرغانی اور عشروسیان المحتدی کے لیے لڑے اور ایک دن میں چار ہزار ترک مارے گئے۔ لڑائی جاری رہی یہاں تک کہ اس کی فوج کو شکست دی گئی اور اس پر قبضہ کر لیا گیا۔ انہوں نے آپ کے خصیے کو نچوڑ لیا اور آپ کی وفات 256 رجب میں ہوئی۔ عام لوگ اٹھے تھے اور انہوں نے مسجدوں میں چھوڑے ہوئے نوٹ لکھے تھے: 'خدا سے اپنے منصف اور خوشنما خلیفہ عمر بن عبدالعزیز کے برابر کے لیے دعا کرو'۔ 562-563}۔ المسعودی کے مطابق، بیاقبل نے سامرہ کے پل پر المحتدی کا مقابلہ کیا اور ایک عظیم جنگ ہوئی جس میں بیاقبل کو شکست ہوئی۔ پھر اس کا گھات لگا کر نکلا، ان میں ترک یرجوج بھی تھا، اور المحتدی نے مڑ کر بازاروں میں عام لوگوں سے مدد کے لیے پکارا، لیکن کوئی اس کی مدد کو نہ آیا۔ وہ ابن جعونہ کے گھر چھپ گیا اور وہ اس پر حملہ کر کے اسے یرجوج کے گھر لے گئے۔ انہوں نے آپ کے سامنے عرض کیا یہاں تک کہ سلیمان بن وھب سکریٹری ان کے درمیان کھڑا ہوا اور کہا: اگر وہ آپ کو اپنی زبان دے گا تو آپ کی طرف اس کا ارادہ اس کے سوا کچھ اور ہے۔ اور وہ خنجر لائے۔ سب سے پہلے اسے زخمی کرنے والا بائقبل کا کزن تھا، جس نے اس کے گٹھے کو کاٹ لیا، اور اس نے اپنا منہ زخم پر ڈالا، جب تک وہ نشے میں تھا، خون چوستا رہا۔ وہ اس بات پر متفق نہیں تھے کہ اسے کیسے مارا جائے: کچھ نے خنجر سے کہا، کچھ نے کہا کہ اس کے عضو تناسل کو نچوڑا گیا تھا، کچھ نے کہا کہ اسے رسیوں سے دو تختوں کے درمیان باندھا گیا تھا، کچھ نے اس کا گلا گھونٹ دیا تھا، اور کچھ نے کہا کہ اسے قالینوں اور تکیوں کے نیچے دبا دیا گیا تھا۔ یہ 255 رجب المرجب کے اختتام سے چودہ راتیں پہلے منگل کے دن ہوا، اور وہ اس کے ساتھ اس کے ساتھ اس بات پر ندامت کے ساتھ گھوم رہے تھے کہ انہیں اس کی تقویٰ کا احساس ہوا تھا۔ 559-561}۔"
  tr: "Hicri 256 yılında, Kerkh ve Dur halkının geçim kaynaklarını talep ederek ayaklanmasının ardından, Muhtadi Recep ayında görevden alındı. Aynı ayda öldü. Ölümünden sonra Musa ibn Bugha ve Muflih, Samarra'ya girdiler. Suyuti'ye göre, Musa ibn Bugha, Mu'tazz'ın kanının intikamını almak için Salih ibn Wasif'i öldürmek üzere Rayy'den geldi. Muhtadi Adalet Sarayı'nda otururken ona saldırdı, onu zayıf bir ata bindirdi ve sarayı yağmaladı. Daha sonra Salih'in yanında yer almayacağına yemin ettikten sonra onu serbest bıraktılar. Musa, Salih'i getirene on bin dinar vereceğini duyurdu. Bazı hizmetkarlar onu bir antrede uyurken buldular, bu yüzden başını kesip etrafta dolaştırdılar. Sonra Musa ve Bakbak, Musawir'i aramak için Sincar'a gittiler. Muhtadi, Bakbak'a Musa ve Muflih'i öldürmesini emreden bir mektup yazdı. Bakbak, Musa'ya mektubunu gösterdi ve hepsi onu öldürmeye karar verdi. Mağribiler ve Ferganalılar onun adına savaştılar. Aşrusaniler bir günde dört bin Türk'ü öldürdüler ve savaş, ordusu yenilip esir alınana kadar devam etti. Testislerine sıkılarak elli altıncı yılın Receb ayında öldü. Halifeliği bir yıl eksi on beş gün sürdü. Halk isyan etti ve camilere attıkları notlar yazdılar. \"Allah'tan, Ömer ibn Abdülaziz'e denk, adil ve hoş bir halife isteyin.\" {cite:tarikh-khulafa-minhaj-1434 s. 562-563}. Ve el-Mas'udi'ye göre, Baykial, Samarra köprüsünde el-Muhtadi'yi gözetledi ve aralarında büyük bir savaş çıktı ve Baykial yenildi. Sonra pusuya düştü, içinde Türk Yarjuj vardı. El-Muhtadi kaçtı, çarşılardaki halktan yardım istedi, ama ona yardım edecek kimse yoktu. Bunun üzerine İbn Ji'una'nın evine saklanarak gitti. Orada ona saldırdılar ve onu Yarjuj'un evine götürdüler. Onlar da ona boyun eğdiler. Ta ki kâtip Süleyman ibn Vahb aralarında ayağa kalkıp, \"Eğer size diliyle bir şey veriyorsa, size karşı niyeti bundan başkadır\" diyene kadar. Bunun üzerine ona hançerler getirdiler ve onu ilk yaralayan, Baykial'ın bir kuzeni oldu. Şah damarından yaraladı ve sarhoşken kanını emdi. Nasıl öldürüldüğüne dair farklı rivayetler vardır: Kimisi hançerlerle, kimisi cinsel organlarının sıkılarak, kimisi iplerle iki tahta arasına bağlanarak, kimisi boğularak, kimisi de halı ve yastıklarla ezilerek öldürüldüğünü söyler. Bu olay, 255 yılının Receb ayının on dördüncü Salı günü gerçekleşti ve onun zühdünden gördükleri için pişmanlıkla etrafını sardılar ve ağladılar. 559-561"
  id: "Pada tahun 256 H, al-Muhtadi digulingkan pada bulan Rajab setelah penduduk Karkh dan al-Dur memberontak menuntut penghidupan mereka. Ia meninggal pada bulan yang sama. Musa ibn Bugha dan Muflih memasuki Samarra setelah kematiannya. Menurut al-Suyuti, Musa ibn Bugha datang dari Rayy untuk membunuh Salih ibn Wasif sebagai balas dendam atas darah al-Mu'tazz. Ia menyerang al-Muhtadi saat ia sedang duduk di Gedung Pengadilan, memaksanya menaiki kuda yang lemah, dan menjarah istana. Kemudian mereka membebaskannya setelah ia bersumpah untuk tidak memihak Salih. Musa mengumumkan bahwa siapa pun yang membawa Salih akan menerima sepuluh ribu dinar. Beberapa pelayan menemukannya sedang tidur di serambi, sehingga mereka memenggal kepalanya dan mengaraknya berkeliling. Kemudian Musa dan Bakbak pergi ke Sinjar untuk mencari Musawir. Al-Muhtadi menulis surat kepada Bakbak memerintahkannya untuk membunuh Musa dan Muflih. Bakbak menunjukkan suratnya kepada Musa, dan mereka semua setuju untuk membunuhnya. Kaum Maghreb dan Farghana berperang untuknya. Dan kaum Ashrusaniyya membunuh empat ribu orang Turki dalam satu hari, dan pertempuran berlanjut hingga pasukannya dikalahkan dan ditangkap. Ia diremas di testisnya dan meninggal pada bulan Rajab tahun lima puluh enam. Kekhalifahannya berlangsung selama satu tahun minus lima belas hari. Rakyat telah memberontak dan menulis catatan yang mereka lemparkan ke masjid-masjid. Berdoalah kepada Allah untuk khalifahmu yang adil dan menyenangkan yang sebanding dengan Umar ibn Abd al-Aziz. {cite:tarikh-khulafa-minhaj-1434 p. 562-563}. Dan menurut al-Mas'udi, Baykial mengawasi al-Muhtadi di jembatan Samarra, dan pertempuran besar terjadi di antara mereka di mana Baykial dikalahkan. Kemudian penyergapannya muncul, di mana Yarjuj orang Turki berada. Al-Muhtadi melarikan diri, mencari bantuan dari rakyat jelata di pasar, tetapi tidak ada seorang pun yang membantunya. Maka ia pergi ke rumah Ibnu Ji'una secara sembunyi-sembunyi, dan mereka menyerangnya dan membawanya ke rumah Yarjuj, dan mereka tunduk kepadanya sampai Sulaiman bin Wahb, sang juru tulis, berdiri di antara mereka dan berkata, \"Jika dia memberi kalian dengan lidahnya, niatnya terhadap kalian bukanlah seperti ini.\" Maka mereka membawakan belati kepadanya, dan orang pertama yang melukainya adalah sepupu Baykial, yang melukainya di pembuluh darah lehernya dan menghisap darahnya sampai ia kenyang dalam keadaan mabuk. Ada berbagai versi tentang bagaimana ia dibunuh: ada yang mengatakan dengan belati, ada yang mengatakan alat kelaminnya diremas, ada yang mengatakan ia diikat di antara dua papan dengan tali, ada yang mengatakan ia dicekik, dan ada yang mengatakan ia ditekan dengan karpet dan bantal. Itu terjadi pada hari Selasa, tanggal empat belas Rajab, tahun dua ratus lima puluh lima, dan mereka mengelilinginya sambil meratap menyesal atas apa yang telah mereka lihat dari kesalehannya. 559-561"
