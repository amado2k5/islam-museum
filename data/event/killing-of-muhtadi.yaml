id: event/killing-of-muhtadi
class: event
kind: death
label: { ar: "خلع المهتدى ثم موته" }
summary:
  ar: "في سنة ست وخمسين ومائتين خُلع المهتدى في رجب بعد تحرك أهل الكرخ والدور طلباً لأرزاقهم، وتوفي في الشهر نفسه {cite:tabari-tarikh-abu-al-fadl j.9 p.456}، ودخل موسى بن بغا ومفلح سامراء بعد وفاته {cite:tabari-tarikh-abu-al-fadl j.9 p.462}، وعند السيوطي قدم موسى بن بغا من الري لقتل صالح بن وصيف بدم المعتز فهجم على المهتدي وهو جالس في دار العدل فأقاموه على فرس ضعيفة وانتهبوا القصر ثم أعادوه بعد أن حلف ألا يمالئ صالحاً، ونادى موسى من جاء بصالح فله عشرة آلاف دينار فوجده بعض الغلمان نائماً في دهليز فقطعت رأسه وطيف بها، ثم رحل موسى وباكباك إلى السن في طلب مساور فكتب المهتدي إلى باكباك أن يقتل موسى ومفلحاً فأوقف باكباك موسى على كتابه فأجمعوا على قتله فقاتل عنه المغاربة والفراغنة والأشروسنية وقتل من الأتراك في يوم أربعة آلاف ودام القتال إلى أن هزم جيشه وأمسك فعصر على خصيتيه فمات في رجب سنة ست وخمسين وكانت خلافته سنة إلا خمسة عشر يوماً، وكان الأعم قد ثاروا وكتبوا رقاعاً ألقوها في المساجد ادعوا الله لخليفتكم العدل الرضي المضاهي لعمر بن عبد العزيز {cite:tarikh-khulafa-minhaj-1434 p. 562-563}."
