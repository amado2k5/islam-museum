id: event/al-hadi-takes-hostages-from-yam-and-banu-al-harith-and-ibn-abbad-arrives-with-aid-from-al-tarif-289
class: event
kind: other
label:
  ar: "أخذ الهادي رهائن من يأم وبني الحارث وقدوم ابن عباد الأكيلي بمادة آل طريف، رمضان 289هـ"
  en: "Al-Hadi takes hostages from Yam and Banu al-Harith and Ibn Abbad al-Akili arrives with aid from Al Tarif, Ramadan 289 AH"
  ur: "ہادی کا یام اور بنو حارث سے یرغمال لینا اور ابن عباد اکیلی کا آل طریف کی کمک کے ساتھ آنا، رمضان 289ھ"
  es: "Al-Hadi toma rehenes de Yam y Banu al-Harith, e Ibn Abbad al-Akili llega con ayuda de Al Tarif, Ramadán 289 AH."
  fr: "Al-Hadi prend des otages à Yam et Banu al-Harith, et Ibn Abbad al-Akili arrive avec l'aide d'Al-Tarial (Ramadan 289 AH)."
  tr: "El-Hadi, Ya'am ve Beni el-Harith'ten rehinler aldı ve İbn Abbad el-Akili, El Tarif ailesinin erzaklarıyla geldi, Ramazan 289 Hicri."
  id: "Al-Hadi menyandera orang-orang dari Ya'am dan Bani al-Harith, dan Ibnu Abbas al-Akili tiba dengan perbekalan keluarga Al Tarif, Ramadan 289 H."
summary:
  ar: "وقعت فتنة بين يأم وبني الحارث أخافت الطريق وقطعت السبل، فخرج الهادي إلى نجران وأخذ أربعين رجلاً من اليأميين وثلاثين من بني الحارث وثلاثين من أهل الوادي وحبسهم بصعدة شهراً، ثم كلّمه ابن بسطام ومحمد بن عبد الملك وجماعة من يأم فأطلقهم وكساهم؛ وقدم ابن عباد الأكيلي بمادة من قبل آل طريف في آخر رمضان من سنة 289هـ."
  en: "A strife between Yam and Banu al-Harith made the road unsafe and cut the ways; al-Hadi went to Najran and took forty men of Yam, thirty of Banu al-Harith and thirty of the people of the wadi, and held them at Sa'da for a month, until Ibn Bustam, Muhammad ibn Abd al-Malik and a party of Yam spoke to him for them and he freed them and clothed them; and Ibn Abbad al-Akili came with aid from Al Tarif at the end of Ramadan 289 AH."
  ur: "یام اور بنو حارث کے بیچ ایک فتنہ ہوا جس نے راستہ غیر محفوظ کر دیا؛ ہادی نجران گئے، یام کے چالیس، بنو حارث کے تیس اور وادی والوں کے تیس آدمی لے کر انہیں صعدہ میں ایک مہینہ قید رکھا، یہاں تک کہ ابن بسطام، محمد بن عبد الملک اور یام کی ایک جماعت نے ان سے بات کی تو انہوں نے انہیں چھوڑ دیا اور کپڑے پہنائے؛ اور رمضان 289ھ کے آخر میں ابن عباد اکیلی آل طریف کی طرف سے کمک لے کر آیا۔"
  es: "Un conflicto entre Yam y Banu al-Harith hizo que el camino fuera inseguro y cortó los senderos; al-Hadi fue a Najran y tomó cuarenta hombres de Yam, treinta de Banu al-Harith y treinta de la gente del wadi, y los retuvo en Sa'da durante un mes, hasta que Ibn Bustam, Muhammad ibn Abd al-Malik y un grupo de Yam hablaron con él por ellos y los liberó y los vistió; e Ibn Abbad al-Akili llegó con ayuda de Al Tarif al final del Ramadán del 289 AH."
  fr: "Une querelle entre les Yam et les Banu al-Harith rendit la route dangereuse et coupa les passages; al-Hadi se rendit à Najran et prit quarante hommes des Yam, trente des Banu al-Harith et trente des habitants du wadi, et les tint à Sa'da pendant un mois, jusqu'à ce qu'Ibn Bustam, Muhammad ibn Abd al-Malik et un groupe de Yam intercèdent en leur faveur et qu'il les libère et les vête; et Ibn Abbad al-Akili arriva avec l'aide d'Al Tarif à la fin du Ramadan 289 AH."
  tr: "Ya'am ve Beni el-Harith arasında bir çatışma çıktı, bu da yolları tehlikeye attı ve ulaşımı kesti. El-Hadi, Necran'a giderek Ya'amlılardan kırk, Beni el-Harith'ten otuz ve vadi halkından otuz kişiyi yanına alıp bir ay boyunca Sa'de'de hapsetti. Sonra İbn Bistam, Muhammed İbn Abd el-Malik ve Ya'am'dan bir grup onunla konuştu, bunun üzerine onları serbest bıraktı ve giydirdi. İbn Abbad el-Akili, Hicri 289 yılının Ramazan ayının sonunda Tarif ailesinden erzak getirdi."
  id: "Terjadi konflik antara Ya’am dan Bani al-Harith, yang membuat jalanan menjadi kacau dan memutus jalur lalu lintas. Al-Hadi pergi ke Najran dan membawa empat puluh orang dari Ya’am, tiga puluh orang dari Bani al-Harith, dan tiga puluh orang dari penduduk lembah, lalu memenjarakan mereka di Sa’dah selama sebulan. Kemudian Ibn Bistam, Muhammad Ibn Abd al-Malik, dan sekelompok orang dari Ya’am berbicara kepadanya, sehingga ia membebaskan mereka dan memberi mereka pakaian. Ibn Abbad al-Akili datang membawa perbekalan dari keluarga Al Tarif pada akhir Ramadan tahun 289 Hijriah."
