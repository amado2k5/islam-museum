id: event/al-hadi-takes-hostages-from-yam-and-banu-al-harith-and-ibn-abbad-arrives-with-aid-from-al-tarif-289
class: event
kind: other
label:
  ar: "أخذ الهادي رهائن من يأم وبني الحارث وقدوم ابن عباد الأكيلي بمادة آل طريف، رمضان 289هـ"
  en: "Al-Hadi takes hostages from Yam and Banu al-Harith and Ibn Abbad al-Akili arrives with aid from Al Tarif, Ramadan 289 AH"
  ur: "ہادی کا یام اور بنو حارث سے یرغمال لینا اور ابن عباد اکیلی کا آل طریف کی کمک کے ساتھ آنا، رمضان 289ھ"
summary:
  ar: "وقعت فتنة بين يأم وبني الحارث أخافت الطريق وقطعت السبل، فخرج الهادي إلى نجران وأخذ أربعين رجلاً من اليأميين وثلاثين من بني الحارث وثلاثين من أهل الوادي وحبسهم بصعدة شهراً، ثم كلّمه ابن بسطام ومحمد بن عبد الملك وجماعة من يأم فأطلقهم وكساهم؛ وقدم ابن عباد الأكيلي بمادة من قبل آل طريف في آخر رمضان من سنة 289هـ."
  en: "A strife between Yam and Banu al-Harith made the road unsafe and cut the ways; al-Hadi went to Najran and took forty men of Yam, thirty of Banu al-Harith and thirty of the people of the wadi, and held them at Sa'da for a month, until Ibn Bustam, Muhammad ibn Abd al-Malik and a party of Yam spoke to him for them and he freed them and clothed them; and Ibn Abbad al-Akili came with aid from Al Tarif at the end of Ramadan 289 AH."
  ur: "یام اور بنو حارث کے بیچ ایک فتنہ ہوا جس نے راستہ غیر محفوظ کر دیا؛ ہادی نجران گئے، یام کے چالیس، بنو حارث کے تیس اور وادی والوں کے تیس آدمی لے کر انہیں صعدہ میں ایک مہینہ قید رکھا، یہاں تک کہ ابن بسطام، محمد بن عبد الملک اور یام کی ایک جماعت نے ان سے بات کی تو انہوں نے انہیں چھوڑ دیا اور کپڑے پہنائے؛ اور رمضان 289ھ کے آخر میں ابن عباد اکیلی آل طریف کی طرف سے کمک لے کر آیا۔"
