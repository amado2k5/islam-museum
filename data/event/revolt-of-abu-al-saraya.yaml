id: event/revolt-of-abu-al-saraya
class: event
kind: revolt
label: { ar: "خروج أبي السرايا", en: "The revolt of Abu al-Saraya", es: "La revuelta de Abu al-Saraya", fr: "La révolte d'Abu al-Saraya", ur: "ابو السرایا کی بغاوت", tr: "Ebu el-Saraya'nın ayrılışı", id: "Keluarnya Abu al-Saraya" }
summary:
  ar: "كان أبو السرايا القيّم بتدبير ثورة ابن طباطبا في الكوفة في سنة تسع وتسعين ومائة {cite:tabari-tarikh-abu-al-fadl j.8 p.528}، ثم هرب من الكوفة في المحرم سنة مائتين، وقُتل في ربيع الأول من السنة نفسها {cite:tabari-tarikh-abu-al-fadl j.8 p.534} {cite:tabari-tarikh-abu-al-fadl j.8 p.535}. وعند المسعودي خرج سنة تسع وتسعين ومائة ومعه محمد بن إبراهيم بن إسماعيل ابن طباطبا، ووثب بالمدينة محمد بن سليمان بن داود وبالبصرة علي بن محمد بن جعفر وزيد بن موسى بن جعفر فغلبوا عليها، ومات ابن طباطبا فأقام مكانه محمد بن محمد بن يحيى بن زيد بن علي، وظهر باليمن إبراهيم بن موسى بن جعفر وبمكة سنة مائتين محمد بن جعفر بن محمد وإليه دعت السبطية {cite:muruj-al-dhahab p. 419-420}"
  en: "Abu al-Saraya was the one who managed Ibn Tabataba's revolt in Kufa in 199 {cite:tabari-tarikh-abu-al-fadl j.8 p.528}. He then fled Kufa in Muharram 200 and was killed in Rabi' I of the same year {cite:tabari-tarikh-abu-al-fadl j.8 p.534} {cite:tabari-tarikh-abu-al-fadl j.8 p.535}. According to al-Mas'udi, he rose in 199 with Muhammad ibn Ibrahim ibn Isma'il ibn Tabataba. Muhammad ibn Sulayman ibn Dawud rose in Medina, and 'Ali ibn Muhammad ibn Ja'far and Zayd ibn Musa ibn Ja'far rose in Basra and took control of it. When Ibn Tabataba died, Muhammad ibn Muhammad ibn Yahya ibn Zayd ibn 'Ali was set up in his place. Ibrahim ibn Musa ibn Ja'far appeared in Yemen, and in 200 Muhammad ibn Ja'far ibn Muhammad appeared in Mecca, and the Sababiyya were called to him {cite:muruj-al-dhahab p. 419-420}"
  es: "Abu al-Saraya fue quien dirigió la revuelta de Ibn Tabataba en Kufa en el año 199 de la Hégira (véase: al-Tabari, Tarikh Abu al-Fadl, vol. 8, pág. 528). Luego huyó de Kufa en Muharram del año 200 de la Hégira y fue asesinado en Rabi' I del mismo año (véase: al-Tabari, Tarikh Abu al-Fadl, vol. 8, pág. 534, vol. 8, pág. 535). Según al-Mas'udi, se alzó en el poder en el año 199 de la Hégira con Muhammad ibn Ibrahim ibn Isma'il ibn Tabataba. Muhammad ibn Sulayman ibn Dawud se alzó en Medina, y 'Ali ibn Muhammad ibn Ja'far y Zayd ibn Musa ibn Ja'far se alzaron en Basora y tomaron el control de la ciudad. Cuando Ibn Tabataba murió, Muhammad ibn Muhammad ibn Yahya ibn Zayd ibn 'Ali fue instalado en su lugar. Ibrahim ibn Musa ibn Ja'far apareció en Yemen, y en el año 200 Muhammad ibn Ja'far ibn Muhammad apareció en La Meca, y los Sababiyya fueron llamados a él {cite:muruj-al-dhahab p. 419-420}"
  fr: "Abu al-Saraya fut celui qui mena la révolte d'Ibn Tabataba à Koufa en 199 AH (voir: al-Tabari, Tarikh Abu al-Fadl, vol. 8, p. 528). Il s'enfuit ensuite de Koufa en Muharram 200 AH et fut tué en Rabi' I de la même année (voir: al-Tabari, Tarikh Abu al-Fadl, vol. 8, p. 534 et 535). Selon al-Mas'udi, il se souleva en 199 AH avec Muhammad ibn Ibrahim ibn Isma'il ibn Tabataba. Muhammad ibn Sulayman ibn Dawud se souleva à Médine, et 'Ali ibn Muhammad ibn Ja'far et Zayd ibn Musa ibn Ja'far se soulevèrent à Bassora et en prirent le contrôle. À la mort d'Ibn Tabataba, Muhammad ibn Muhammad ibn Yahya ibn Zayd ibn 'Ali lui succéda. Ibrahim ibn Musa ibn Ja'far apparut au Yémen, et en 200, Muhammad ibn Ja'far ibn Muhammad apparut à La Mecque, et les Sababiyya furent appelés à le rejoindre. (Voir Muruj-al-Dhahab, p. 419-420.)"
  ur: "ابو السرایا وہ شخص تھا جس نے 199 ہجری میں کوفہ میں ابن طباطبہ کی بغاوت کا انتظام کیا تھا ⁦(دیکھیں: الطبری، تاریخ ابو الفضل، جلد 8، صفحہ 528)⁩۔ اس کے بعد وہ محرم 200 ہجری میں کوفہ سے فرار ہوئے اور اسی سال ربیع اول میں قتل ہوئے ⁦(دیکھیں: الطبری، تاریخ ابو الفضل، ج8، ص534، جلد 8، صفحہ 535)⁩۔ المسعودی کے مطابق، وہ 199 ہجری میں محمد بن ابراہیم بن اسماعیل بن طباطبہ کے ساتھ طلوع ہوا۔ محمد بن سلیمان بن داؤد مدینہ میں اٹھے اور علی بن محمد بن جعفر اور زید بن موسیٰ بن جعفر بصرہ میں اٹھے اور اس پر قبضہ کر لیا۔ جب ابن طباطبہ کا انتقال ہوا تو ان کی جگہ محمد بن محمد ابن یحییٰ ابن زید ابن علی کو نصب کیا گیا۔ ابراہیم بن موسیٰ بن جعفر یمن میں ظاہر ہوئے اور 200 میں محمد بن جعفر ابن محمد مکہ میں نمودار ہوئے اور صابیہ ان کے پاس بلائے گئے۔ 419-420}"
  tr: "Ebu el-Saraya, Hicri 199 yılında Kûfe'de İbn Tabata'nın isyanını organize etmekle görevliydi {kaynak:tabari-tarikh-ebu el-fadl c.8 s.528}, daha sonra Hicri 200 yılının Muharrem ayında Kûfe'den kaçtı ve aynı yılın Rebiü'l-Evvel ayında öldürüldü {kaynak:tabari-tarikh-ebu el-fadl c.8 s.534} {kaynak:tabari-tarikh-ebu el-fadl c.8 s.535}. El-Mas'udi'ye göre, Hicri 199 yılında Muhammed ibn İbrahim ibn İsmail ibn Tabata ile birlikte yola çıktı. Medine'de Muhammed ibn Süleyman ibn Davud ayaklandı ve Ali ibn Muhammed ibn Cafer ile Zeyd ibn Musa ibn Cafer Basra'nın kontrolünü ele geçirdi. İbn Tabataba öldü ve yerine Muhammed ibn Muhammed ibn Yahya ibn Zeyd ibn Ali geçti. İbrahim ibn Musa ibn Cafer, Yemen'de ortaya çıktı ve H. 200 yılında Mekke'de Muhammed ibn Cafer ibn Muhammed ayağa kalktı ve Sabatiyye ona seslendi. {alıntı:muruj-al-dhahab s. 419-420}"
  id: "Abu al-Saraya bertanggung jawab mengorganisir pemberontakan Ibn Tabataba di Kufa pada tahun 199 H {cite:tabari-tarikh-abu-al-fadl j.8 p.528}, kemudian ia melarikan diri dari Kufa pada bulan Muharram tahun 200 H, dan terbunuh pada bulan Rabi’ al-Awwal tahun yang sama {cite:tabari-tarikh-abu-al-fadl j.8 p.534} {cite:tabari-tarikh-abu-al-fadl j.8 p.535}. Menurut Al-Mas'udi, ia pergi pada tahun 199 H, ditemani oleh Muhammad ibn Ibrahim ibn Ismail ibn Tabataba. Muhammad ibn Sulayman ibn Dawud bangkit di Madinah, dan Ali ibn Muhammad ibn Ja'far dan Zayd ibn Musa ibn Ja'far merebut kendali Basra. Ibnu Tabataba meninggal, dan Muhammad ibn Muhammad ibn Yahya ibn Zayd ibn Ali menggantikannya. Ibrahim ibn Musa ibn Ja'far muncul di Yaman, dan di Mekah pada tahun 200 H, Muhammad ibn Ja'far ibn Muhammad bangkit, dan Sabatiyya memanggilnya. {mengutip:muruj-al-dhahab hal. 419-420}"
