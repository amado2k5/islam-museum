label: { ar: "خروج أبي السرايا" }
summary:
  ar: "كان أبو السرايا القيّم بتدبير ثورة ابن طباطبا في الكوفة في سنة تسع وتسعين ومائة {cite:tabari-tarikh-abu-al-fadl j.8 p.528}، ثم هرب من الكوفة في المحرم سنة مائتين، وقُتل في ربيع الأول من السنة نفسها {cite:tabari-tarikh-abu-al-fadl j.8 p.534} {cite:tabari-tarikh-abu-al-fadl j.8 p.535}.، وعند المسعودي خرج سنة تسع وتسعين ومائة ومعه محمد بن إبراهيم بن إسماعيل ابن طباطبا، ووثب بالمدينة محمد بن سليمان بن داود وبالبصرة علي بن محمد بن جعفر وزيد بن موسى بن جعفر فغلبوا عليها، ومات ابن طباطبا فأقام مكانه محمد بن محمد بن يحيى بن زيد بن علي، وظهر باليمن إبراهيم بن موسى بن جعفر وبمكة سنة مائتين محمد بن جعفر بن محمد وإليه دعت السبطية {cite:muruj-al-dhahab p. 419-420}"
date:
  start: { hijri: "0200", precision: year, status: debated, note: "فهرس الجزء الثامن ص681؛ الطبري: ثورة ابن طباطبا بالكوفة سنة ١٩٩ (ص528)، ومقتل أبي السرايا في ربيع الأول سنة ٢٠٠ (ص535)", sources: [source/tabari-tarikh-abu-al-fadl] }
