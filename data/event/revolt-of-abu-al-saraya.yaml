label: { ar: "خروج أبي السرايا", en: "The revolt of Abu al-Saraya" }
summary:
  ar: "كان أبو السرايا القيّم بتدبير ثورة ابن طباطبا في الكوفة في سنة تسع وتسعين ومائة {cite:tabari-tarikh-abu-al-fadl j.8 p.528}، ثم هرب من الكوفة في المحرم سنة مائتين، وقُتل في ربيع الأول من السنة نفسها {cite:tabari-tarikh-abu-al-fadl j.8 p.534} {cite:tabari-tarikh-abu-al-fadl j.8 p.535}. وعند المسعودي خرج سنة تسع وتسعين ومائة ومعه محمد بن إبراهيم بن إسماعيل ابن طباطبا، ووثب بالمدينة محمد بن سليمان بن داود وبالبصرة علي بن محمد بن جعفر وزيد بن موسى بن جعفر فغلبوا عليها، ومات ابن طباطبا فأقام مكانه محمد بن محمد بن يحيى بن زيد بن علي، وظهر باليمن إبراهيم بن موسى بن جعفر وبمكة سنة مائتين محمد بن جعفر بن محمد وإليه دعت السبطية {cite:muruj-al-dhahab p. 419-420}"
  en: "Abu al-Saraya was the one who managed Ibn Tabataba's revolt in Kufa in 199 {cite:tabari-tarikh-abu-al-fadl j.8 p.528}. He then fled Kufa in Muharram 200 and was killed in Rabi' I of the same year {cite:tabari-tarikh-abu-al-fadl j.8 p.534} {cite:tabari-tarikh-abu-al-fadl j.8 p.535}. According to al-Mas'udi, he rose in 199 with Muhammad ibn Ibrahim ibn Isma'il ibn Tabataba. Muhammad ibn Sulayman ibn Dawud rose in Medina, and 'Ali ibn Muhammad ibn Ja'far and Zayd ibn Musa ibn Ja'far rose in Basra and took control of it. When Ibn Tabataba died, Muhammad ibn Muhammad ibn Yahya ibn Zayd ibn 'Ali was set up in his place. Ibrahim ibn Musa ibn Ja'far appeared in Yemen, and in 200 Muhammad ibn Ja'far ibn Muhammad appeared in Mecca, and the Sababiyya were called to him {cite:muruj-al-dhahab p. 419-420}"
