id: event/death-of-al-hadi
class: event
kind: death
label: { ar: "وفاة الهادي", en: "Death of al-Hadi" }
summary:
  ar: "مات الهادي في ربيع الآخر سنة سبعين ومئة واختلف في سبب موته فقيل دفع نديماً له من جرف على أصول قصب قد قطع فتعلق النديم به فوقعا فدخلت قصبة في مخرجه فماتا جميعاً وقيل أصابته قرحة في جوفه وقيل سمته أمه الخيزران لما عزم على قتل الرشيد ليعهد إلى ولده وقيل كانت أمه حاكمة مستبدة بالأمور الكبار وكانت المواكب تغدو إلى بابها فزجرهم وقال لها أما لك مغزل يشغلك أو مصحف يذكرك أو سبحة فقامت لا تعقل من الغضب فقيل إنه بعث إليها بطعام مسموم فأطعمت منه كلباً فانتثر فعملت على قتله لما وعك بأن غموا وجهه ببساط جلسوا على جوانبه وخلف سبعة بنين {cite:tarikh-khulafa-minhaj-1434 p. 451-452}."
  en: "Al-Hadi died in Rabi' II 170 and accounts differ: he pushed a boon-companion off a ledge onto cut reed-stumps and the man clutched him so both fell, a stump entering his anus; or a stomach ulcer; or his mother Khayzuran poisoned him when he resolved to kill al-Rashid and settle the succession on his own son; or — she having ruled affairs absolutely while processions thronged her door — he rebuked her, 'have you no spindle to keep you, no Mushaf, no rosary?', she sent him poisoned food she first fed a dog, and when he fell ill she had his face covered with a carpet they sat upon. He left seven sons {cite:tarikh-khulafa-minhaj-1434 p. 451-452}."
