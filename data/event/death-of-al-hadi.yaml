label: { ar: "وفاة الهادي", en: "Death of al-Hadi", es: "Muerte de al-Hadi", fr: "Mort d'al-Hadi", ur: "الہادی کی موت", tr: "El-Hadi'nin Ölümü", id: "Kematian Al-Hadi" }
summary:
  ar: "مات الهادي في ربيع الآخر سنة سبعين ومئة واختلف في سبب موته فقيل دفع نديماً له من جرف على أصول قصب قد قطع فتعلق النديم به فوقعا فدخلت قصبة في مخرجه فماتا جميعاً وقيل أصابته قرحة في جوفه وقيل سمته أمه الخيزران لما عزم على قتل الرشيد ليعهد إلى ولده وقيل كانت أمه حاكمة مستبدة بالأمور الكبار وكانت المواكب تغدو إلى بابها فزجرهم وقال لها أما لك مغزل يشغلك أو مصحف يذكرك أو سبحة فقامت لا تعقل من الغضب فقيل إنه بعث إليها بطعام مسموم فأطعمت منه كلباً فانتثر فعملت على قتله لما وعك بأن غموا وجهه ببساط جلسوا على جوانبه وخلف سبعة بنين {cite:tarikh-khulafa-minhaj-1434 p. 451-452}."
  en: "Al-Hadi died in Rabi' II 170 and accounts differ: he pushed a boon-companion off a ledge onto cut reed-stumps and the man clutched him so both fell, a stump entering his anus; or a stomach ulcer; or his mother Khayzuran poisoned him when he resolved to kill al-Rashid and settle the succession on his own son; or — she having ruled affairs absolutely while processions thronged her door — he rebuked her, 'have you no spindle to keep you, no Mushaf, no rosary?', she sent him poisoned food she first fed a dog, and when he fell ill she had his face covered with a carpet they sat upon. He left seven sons {cite:tarikh-khulafa-minhaj-1434 p. 451-452}."
  es: "Al-Hadi murió en Rabi' II 170 y las versiones difieren: empujó a un compañero de aventuras desde una cornisa sobre tocones de caña cortados y el hombre lo agarró, cayendo ambos, y un tocón se le incrustó en el ano; o una úlcera estomacal; o su madre Khayzuran lo envenenó cuando decidió matar a al-Rashid y asegurar la sucesión a su propio hijo; o —habiendo ella gobernado los asuntos con absoluta autoridad mientras procesiones se agolpaban en su puerta— él la reprendió: \"¿No tienes huso para guardarte, ni Corán, ni rosario?\", ella le envió comida envenenada que primero le dio a un perro, y cuando enfermó, ella hizo que le cubriera la cara con la alfombra sobre la que estaban sentados. Dejó siete hijos {cite:tarikh-khulafa-minhaj-1434 p. 451-452}."
  fr: "Al-Hadi mourut en Rabi' II 170, et les récits divergent: il aurait poussé un compagnon du haut d'une corniche sur des souches de roseaux coupées, et l'homme s'accrocha à lui, provoquant leur chute et la pénétration d'une souche dans son anus; ou bien il souffrit d'un ulcère à l'estomac; ou encore sa mère, Khayzuran, l'aurait empoisonné lorsqu'il résolut de tuer al-Rashid et de confier la succession à son propre fils; ou bien, alors qu'elle régnait en maître absolu et que des processions se pressaient à sa porte, il la réprimanda: « N'as-tu donc ni fuseau pour te nourrir, ni mushaf, ni chapelet ? », et elle lui envoya de la nourriture empoisonnée qu'elle avait d'abord donnée à un chien. Lorsqu'il tomba malade, elle lui fit recouvrir le visage d'un tapis sur lequel ils étaient assis. Il laissa sept fils (voir: Tarikh-Khulafa-Minhaj-1434, p. 451-452)."
  ur: "الہادی کا انتقال ربیع الثانی 170 میں ہوا اور روایتیں مختلف ہیں: اس نے ایک رفیق ساتھی کو ایک کنارے سے کٹے ہوئے سرکنڈوں پر دھکیل دیا اور اس شخص نے اسے پکڑ لیا تو دونوں گر گئے، ایک سٹمپ اس کے مقعد میں داخل ہو گیا۔ یا پیٹ کا السر؛ یا اس کی ماں خیزوران نے اسے زہر دے دیا جب اس نے الرشید کو قتل کرنے اور جانشینی اپنے بیٹے پر طے کرنے کا عزم کیا۔ یا - اس نے معاملات کو مکمل طور پر سنبھال لیا جب کہ جلوس اس کے دروازے پر آتے تھے - اس نے اسے ڈانٹا، 'کیا تمہارے پاس رکھنے کے لیے کوئی تکلا نہیں، کوئی مصحف نہیں، کوئی مالا نہیں؟'، اس نے اسے زہر آلود کھانا بھیجا، اس نے پہلے ایک کتے کو کھلایا، اور جب وہ بیمار ہوا تو اس کا چہرہ قالین سے ڈھانپ کر اس پر بیٹھ گیا۔ آپ نے سات بیٹے چھوڑے ہیں۔ 451-452}۔"
  tr: "El-Hadi, Hicri 170 yılının Rebiü'l-Sani ayında vefat etmiştir. Ölüm sebebi hakkında farklı rivayetler vardır. Bir rivayete göre, bir arkadaşını uçurumdan aşağıya, kesilmiş kamışların köklerine itmiştir. Arkadaşı onu tutmuş ve ikisi birlikte düşmüş, bir kamış arkadaşının anüsüne girmiş ve ikisi de ölmüştür. Ayrıca midesinde ülser olduğu da rivayet edilir. Bir başka rivayete göre ise, halifeliği oğluna miras bırakabilmek için el-Raşid'i öldürmeye karar verdiğinde annesi el-Hayzuran tarafından zehirlenmiştir. Annesinin önemli konularda zalim bir yönetici olduğu ve kapısına tören alaylarının geldiği de rivayet edilir. El-Hadi onları azarlayarak annesine, \"Oyalanacak bir iğneniz, sizi hatırlatacak bir Kur'an'ınız veya bir tesbihiniz yok mu?\" demiştir. Bunun üzerine annesi öfkeden aklını yitirmiş bir şekilde ayağa kalkmıştır. Bir başka rivayete göre ise, annesine zehirli yiyecek göndermiş ve annesi de bu yiyeceklerden bir kısmını köpeğe yedirmiş, köpek de bu yiyeceklerden kaçmıştır. Daha sonra, adam hastalandığında yüzünü bir kilimle örtüp üzerine oturarak onu öldürmeyi planladı. Geride yedi oğul bıraktı. {cite:tarikh-khulafa-minhaj-1434 s. 451-452}"
  id: "Al-Hadi wafat pada bulan Rabi' al-Thani tahun 170 H. Terdapat berbagai versi mengenai penyebab kematiannya. Dikatakan bahwa ia mendorong seorang sahabatnya dari tebing ke akar-akar alang-alang yang telah dipotong. Sahabatnya itu meraihnya dan keduanya jatuh, lalu sebatang alang-alang masuk ke anusnya, sehingga keduanya meninggal. Dikatakan juga bahwa ia menderita tukak lambung. Dikatakan pula bahwa ibunya, al-Khayzuran, meracuninya ketika ia bertekad untuk membunuh al-Rashid agar ia dapat mewariskan kekhalifahan kepada putranya. Dikatakan juga bahwa ibunya adalah penguasa yang tirani dalam hal-hal penting, dan rombongan-rombongan akan datang ke rumahnya. Ia menegur mereka dan berkata kepadanya, \"Apakah engkau tidak mempunyai alat tenun untuk menyibukkanmu, atau Al-Qur'an untuk mengingatkanmu, atau tasbih?\" Maka ia bangkit, tidak berpikir jernih karena marah. Dikatakan juga bahwa ia mengirimkan makanan beracun kepada ibunya, dan ibunya memberi sebagian makanan itu kepada seekor anjing, sehingga makanan itu berhamburan. Kemudian, ia berencana membunuhnya ketika ia jatuh sakit dengan cara menutupi wajahnya dengan permadani dan duduk di sisi permadani tersebut. Ia meninggalkan tujuh putra. {cite:tarikh-khulafa-minhaj-1434 p. 451-452}"
