label:
  ar: "هروب ياقوت إلى خراسان: نيسابور وشذياخها، نحو ٦١٤هـ/١٢١٧م"
  en: "Yaqut's flight into Khurasan: Nishapur and its Shadhiyakh, c. 614/1217"
  ur: "یاقوت کی خراسان فرار: نیشاپور اور اس کی شذیاخ، تقریباً 614ھ/1217ء"
  es: "La huida de Yaqut a Khurasan: Nishapur y su Shadhiyakh, c. 614/1217"
  fr: "La fuite de Yaqut vers le Khurasan: Nishapur et son Shadhiyakh, v. 614/1217"
  tr: "Yaqut'un Horasan'a kaçışı: Nişapur ve çevresi, yaklaşık 614 Hicri/1217 Miladi"
  id: "Pelarian Yaqut ke Khorasan: Nishapur dan sekitarnya, sekitar tahun 614 H/1217 M"
summary:
  ar: "من حلب رحل إلى الموصل فإربل ثم توجه نحو خراسان، ولم يمر ببغداد خشية أن يلقى فيها مناظره فيعرفه وينقل خبره فيُقتل {cite:mawsuat-a3lam-ulama-adaba p. 277}. وفي نيسابور وقع في هوى جارية تركية جميلة من أهلها فأقام بها نحو عامين، ثم فارقها إلى الري وسرخس على غصة {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 277}."
  en: "From Aleppo he travelled to Mosul and Irbil, then on towards Khurasan, keeping clear of Baghdad for fear of meeting his debating opponent, who would recognise him and spread the news — and he would be killed {cite:mawsuat-a3lam-ulama-adaba p. 277}. At Nishapur (Shadhiyakh) he fell in love with a beautiful Turkish slave girl and stayed about two years, then tore himself away to Ray and Sarakhs in sorrow {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 277}."
  ur: "حلب سے موصل اور اربل ہو کر خراسان کی طرف بڑھا، بغداد سے گریز کیا کہ وہاں مناظرے کا حریف مل کر اسے پہچان لے اور خبر پھیلا دے تو مارا جائے {cite:mawsuat-a3lam-ulama-adaba p. 277}. نیشاپور ⁦(شذیاخ)⁩ میں ایک خوبصورت ترک لونڈی کے عشق میں پڑا اور قریب دو سال رہا، پھر غم میں رے اور سرخس کی طرف گیا {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 277}۔"
  es: "Desde Alepo viajó a Mosul e Irbil, luego hacia Jorasán, evitando Bagdad por temor a encontrarse con su oponente en el debate, quien lo reconocería y difundiría la noticia, y sería asesinado {cite:mawsuat-a3lam-ulama-adaba p. 277}. En Nishapur (Shadhiyakh) se enamoró de una hermosa esclava turca y permaneció allí unos dos años, luego se marchó a Ray y Sarakhs con tristeza {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 277}."
  fr: "D'Alep, il se rendit à Mossoul et à Erbil, puis vers le Khorasan, évitant Bagdad par crainte d'y croiser son adversaire lors d'un débat, qui l'aurait reconnu et aurait répandu la nouvelle – et il aurait été tué {cite:mawsuat-a3lam-ulama-adaba p. 277}. À Nishapur (Shadhiyakh), il tomba amoureux d'une belle esclave turque et y resta environ deux ans, puis, accablé de chagrin, il retourna à Ray et Sarakhs {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 277}."
  tr: "Halep'ten Musul'a, oradan Erbil'e, daha sonra da Horasan'a gitti. Bağdat'tan geçmedi, çünkü orada rakibiyle karşılaşmaktan ve rakibinin onu tanıyıp haberi yayarak ölümüne yol açmasından korkuyordu. Nişapur'da, halkından güzel bir Türk cariyeye aşık oldu ve yaklaşık iki yıl orada kaldı. Sonra ağır bir kalple onu bırakıp Ray ve Sarakhs'a gitti."
  id: "Dari Aleppo, ia melakukan perjalanan ke Mosul, lalu ke Irbil, kemudian menuju Khorasan. Ia tidak melewati Baghdad karena takut bertemu saingannya di sana, yang akan mengenalinya dan menyebarkan berita tersebut, yang berujung pada kematiannya. Di Nishapur, ia jatuh cinta dengan seorang budak perempuan Turki yang cantik dari kalangan penduduk setempat dan tinggal di sana selama sekitar dua tahun. Kemudian dengan berat hati ia meninggalkannya untuk Ray dan Sarakhs."
