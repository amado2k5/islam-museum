label:
  ar: "هروب ياقوت إلى خراسان: نيسابور وشذياخها، نحو ٦١٤هـ/١٢١٧م"
  en: "Yaqut's flight into Khurasan: Nishapur and its Shadhiyakh, c. 614/1217"
  ur: "یاقوت کی خراسان فرار: نیشاپور اور اس کی شذیاخ، تقریباً 614ھ/1217ء"
summary:
  ar: "من حلب رحل إلى الموصل فإربل ثم توجه نحو خراسان، ولم يمر ببغداد خشية أن يلقى فيها مناظره فيعرفه وينقل خبره فيُقتل {cite:mawsuat-a3lam-ulama-adaba p. 277}. وفي نيسابور وقع في هوى جارية تركية جميلة من أهلها فأقام بها نحو عامين، ثم فارقها إلى الري وسرخس على غصة {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 277}."
  en: "From Aleppo he travelled to Mosul and Irbil, then on towards Khurasan, keeping clear of Baghdad for fear of meeting his debating opponent, who would recognise him and spread the news — and he would be killed {cite:mawsuat-a3lam-ulama-adaba p. 277}. At Nishapur (Shadhiyakh) he fell in love with a beautiful Turkish slave girl and stayed about two years, then tore himself away to Ray and Sarakhs in sorrow {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 277}."
  ur: "حلب سے موصل اور اربل ہو کر خراسان کی طرف بڑھا، بغداد سے گریز کیا کہ وہاں مناظرے کا حریف مل کر اسے پہچان لے اور خبر پھیلا دے تو مارا جائے {cite:mawsuat-a3lam-ulama-adaba p. 277}. نیشاپور ⁦(شذیاخ)⁩ میں ایک خوبصورت ترک لونڈی کے عشق میں پڑا اور قریب دو سال رہا، پھر غم میں رے اور سرخس کی طرف گیا {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 277}۔"
