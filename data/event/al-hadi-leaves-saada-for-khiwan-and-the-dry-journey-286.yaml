id: event/al-hadi-leaves-saada-for-khiwan-and-the-dry-journey-286
class: event
kind: other
label:
  ar: خروج الهادي من صعدة إلى خيوان ووصيته لمحمد بن عبيد الله والرحلة بلا مطر، رجب 286هـ
  en: Al-Hadi leaves Sa'da for Khiwan, his charge to Muhammad ibn Ubaydallah and the journey without rain, Rajab 286 AH
  ur: صعدہ سے خیوان کی طرف ہادی کی روانگی، محمد بن عبید اللہ کو ان کی وصیت اور بارش کے بغیر سفر، رجب 286ھ
summary:
  ar: خرج الهادي من صعدة إلى خيوان يوم الأحد لستة عشر يوماً من رجب بعد أن أوصى محمد بن عبيد الله بالقيام بصعدة وتفقد الرعية والاحتفاظ بمن حُبس في الغيل من الحارثيين وتفقد حديدهم كل يومين، ونقلهم إلى غرفة علوية بطلبهم. ويذكر الراوي أن الناس خافوا المطر لأن الخروج كان في وقت غيث فلم يصبهم مطر حتى دخلوا خيوان في الثامن عشر من رجب، ثم أصابهم الغيث في منازلهم.
  en: Al-Hadi left Sa'da for Khiwan on Sunday, sixteen days into Rajab, after charging Muhammad ibn Ubaydallah to hold Sa'da, look after the people, keep the Harithis jailed at al-Ghayl and inspect their irons every two days, and, at their request, moving them to an upper room. The narrator says people feared rain because it was the season of rain, but none fell on them until they entered Khiwan on the eighteenth of Rajab, when the rain came on them in their quarters.
  ur: ہادی رجب کے سولہ دن گزرنے پر اتوار کو صعدہ سے خیوان کی طرف نکلے، اس سے پہلے انہوں نے محمد بن عبید اللہ کو صعدہ سنبھالنے، رعایا کی خبرگیری، الغیل میں قید حارثیوں کی نگہبانی اور ہر دو دن بعد ان کی بیڑیاں دیکھنے کی وصیت کی، اور ان کی درخواست پر انہیں بالائی کمرے میں منتقل کیا۔ راوی کہتا ہے کہ لوگ بارش سے ڈرتے تھے کیونکہ روانگی بارش کے موسم میں تھی، مگر خیوان میں داخل ہونے تک ان پر بارش نہ پڑی، اور اٹھارہ رجب کو خیوان پہنچ کر جب لوگ اپنے ٹھکانوں میں ہو گئے تو بارش ہوئی۔
