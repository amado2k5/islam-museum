id: event/marriage-taking-the-forelock
class: event
kind: other
label:
  ar: أخذ بناصية المرأة عند النكاح
  en: Taking the forelock at marriage
  ur: نکاح کے وقت عورت کے پیشانی کے بال پکڑنا
  es: "Tomar el flequillo al casarse"
  fr: "Prendre la mèche au mariage"
  tr: "Cinsel ilişki sırasında kadının ön saç tutamını tutmak"
  id: "Memegang rambut bagian depan wanita saat berhubungan seksual"
summary:
  ar: عن زيد بن أسلم أن رسول الله قال إذا تزوج أحدكم المرأة أو اشترى الجارية فليأخذ بناصيتها وليدع بالبركة وإذا اشترى البعير فليأخذ بذروة سنامه وليستعذ بالله من الشيطان {cite:muwatta-maruf-1997} [[passage/muwatta-14-1575|الموطأ
    1575]].
  en: 'Zayd ibn Aslam reported that the Messenger of God said: when one of you marries a woman or buys a slave-girl let him take her forelock and invoke blessing, and when he buys a camel let him take the
    top of its hump, and let him seek refuge in God from the shaytan {cite:muwatta-maruf-1997} [[passage/muwatta-14-1575|Muwatta 1575]].'
  ur: 'زید بن اسلم سے روایت ہے کہ رسول اللہ نے کہا: جب تم میں سے کوئی عورت سے نکاح کرے یا کنیز خریدے تو اس کے پیشانی کے بال پکڑے اور برکت کی دعا کرے، اور جب اونٹ خریدے تو اس کی گومڑ کی چوٹی پکڑے، اور اللہ
    سے شیطان کی پناہ مانگے {cite:muwatta-maruf-1997} [[passage/muwatta-14-1575|موطأ 1575]]۔'
  es: "Zayd ibn Aslam informó que el Mensajero de Dios dijo: cuando uno de vosotros se case con una mujer o compre una esclava, que tome su mechón de pelo y le invoque bendiciones, y cuando compre un camello, que tome la parte superior de su joroba y que busque refugio en Dios del shaytan {cite:muwatta-maruf-1997} [[passage/muwatta-14-1575|Muwatta 1575]]."
  fr: "Zayd ibn Aslam a rapporté que le Messager de Dieu a dit: lorsque l'un d'entre vous épouse une femme ou achète une esclave, qu'il prenne sa mèche de devant et invoque la bénédiction, et lorsqu'il achète un chameau, qu'il prenne le sommet de sa bosse et qu'il cherche refuge auprès de Dieu contre le shaytan {cite:muwatta-maruf-1997} [[passage/muwatta-14-1575|Muwatta 1575])."
  tr: "Zeyd bin Aslam'ın rivayetine göre, Allah'ın Resulü şöyle buyurmuştur: \"Sizden biri bir kadınla evlenirse veya bir cariye satın alırsa, onun alın yelesinden tutsun ve bereket duası etsin. Bir deve satın alırsa, hörgücünün tepesinden tutsun ve şeytandan Allah'a sığınsın.\" [[Muvatta 1575]]."
  id: "Dari Zaid bin Aslam, Rasulullah SAW bersabda: “Jika salah seorang dari kalian menikahi seorang wanita atau membeli seorang budak perempuan, hendaklah ia memegang ubun-ubunnya dan berdoa memohon keberkahan. Dan jika ia membeli seekor unta, hendaklah ia memegang punuknya dan memohon perlindungan kepada Allah dari setan.” {cite:muwatta-maruf-1997} [[passage/muwatta-14-1575|Al-Muwatta 1575]]."
