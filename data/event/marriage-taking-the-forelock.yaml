id: event/marriage-taking-the-forelock
class: event
kind: other
label:
  ar: أخذ بناصية المرأة عند النكاح
  en: Taking the forelock at marriage
  ur: نکاح کے وقت عورت کے پیشانی کے بال پکڑنا
summary:
  ar: عن زيد بن أسلم أن رسول الله قال إذا تزوج أحدكم المرأة أو اشترى الجارية فليأخذ بناصيتها وليدع بالبركة وإذا اشترى البعير فليأخذ بذروة سنامه وليستعذ بالله من الشيطان {cite:muwatta-maruf-1997} [[passage/muwatta-14-1575|الموطأ
    1575]].
  en: 'Zayd ibn Aslam reported that the Messenger of God said: when one of you marries a woman or buys a slave-girl let him take her forelock and invoke blessing, and when he buys a camel let him take the
    top of its hump, and let him seek refuge in God from the shaytan {cite:muwatta-maruf-1997} [[passage/muwatta-14-1575|Muwatta 1575]].'
  ur: 'زید بن اسلم سے روایت ہے کہ رسول اللہ نے کہا: جب تم میں سے کوئی عورت سے نکاح کرے یا کنیز خریدے تو اس کے پیشانی کے بال پکڑے اور برکت کی دعا کرے، اور جب اونٹ خریدے تو اس کی گومڑ کی چوٹی پکڑے، اور اللہ
    سے شیطان کی پناہ مانگے {cite:muwatta-maruf-1997} [[passage/muwatta-14-1575|موطأ 1575]]۔'
