summary:
  ar: "احتل اليونانيون أزمير ⁦(إزمير)⁩ سنة ١٣٣٨هـ/١٩١٩م بتمكين من بريطانيا وتوغلوا في الأناضول، فقام مصطفى كمال باستثارة روح الجهاد في الأتراك ورد اليونانيين على أعقابهم وتراجعت أمامه قوات الحلفاء، فابتهج العالم الإسلامي وأطلق عليه لقب الغازي ومدحه أحمد شوقي مقرناً إياه بخالد بن الوليد وشاهباً انتصاره بيوم بدر {cite:dawlat-uthmaniyya-salabi p. 468}."
  en: "The Greek landing at Izmir (1919), enabled by Britain, and Mustafa Kemal's counter-campaign that drove them out and won him the title Ghazi across the Muslim world {cite:dawlat-uthmaniyya-salabi p. 468}."
  es: "El desembarco griego en Izmir (1919), posibilitado por Gran Bretaña, y la contracampaña de Mustafa Kemal que los expulsó y le valió el título de Ghazi en todo el mundo musulmán {cite:dawlat-uthmaniyya-salabi p. 468}."
  fr: "Le débarquement grec à Izmir (1919), rendu possible par la Grande-Bretagne, et la contre-campagne de Mustafa Kemal qui les a chassés et lui a valu le titre de Ghazi dans le monde musulman {cite:dawlat-uthmaniyya-salabi p. 468}."
  ur: "ازمیر میں یونانی لینڈنگ (1919)، جسے برطانیہ نے فعال کیا، اور مصطفیٰ کمال کی جوابی مہم جس نے انہیں باہر نکال دیا اور انہیں پوری مسلم دنیا میں غازی کا خطاب حاصل کیا۔ 468}۔"
  tr: "Yunanlılar, Britanya'nın desteğiyle Hicri 1338/Miladi 1919 yılında İzmir'i işgal ederek Anadolu'ya girdiler. Mustafa Kemal, Türklerde cihat ruhunu uyandırarak Yunanlıları püskürttü ve müttefik kuvvetler onun önünde geri çekildi. İslam dünyası sevinçle onu fatih ilan etti ve Ahmed Şevki onu Halid bin El-Velid'e benzeterek ve zaferini Bedir gününe benzeterek övdü. {cite:dawlat-uthmaniyya-salabi s. 468}"
  id: "Bangsa Yunani menduduki Izmir (Izmir) pada tahun 1338 H/1919 M dengan dukungan Britania dan menembus Anatolia. Mustafa Kemal membangkitkan semangat jihad di kalangan Turki dan memukul mundur bangsa Yunani, dan pasukan Sekutu mundur di hadapannya. Dunia Islam bersukacita dan memberinya gelar penakluk, dan Ahmed Shawqi memujinya, membandingkannya dengan Khalid bin Al-Walid dan menyamakan kemenangannya dengan hari Perang Badar. {cite:dawlat-uthmaniyya-salabi p. 468}."
