id: event/al-suyuti-shaykhu-mosque-867
class: event
kind: other
label:
  ar: "السيوطي يخلف أباه في التدريس بجامع شيخو، ٨٦٧هـ/١٤٦٣م"
  en: "Al-Suyuti succeeds his father teaching at the mosque of Shaykhu, 867/1463"
  ur: "سیوطی کا جامع شیخو میں تدریس سنبھالنا، 867ھ/1463ء"
  es: "Al-Suyuti sucede a su padre enseñando en la mezquita de Shaykhu, 867/1463."
  fr: "Al-Suyuti succède à son père comme enseignant à la mosquée de Shaykhu, 867/1463"
  tr: "El-Suyuti, 867 Hicri/1463 Miladi yılında babasının yerine Şeyh Camii'nde öğretmenlik yapmaya başladı."
  id: "Al-Suyuti menggantikan ayahnya sebagai pengajar di Masjid Syekh, 867 H/1463 M."
summary:
  ar: "سنة ٨٦٧هـ/١٤٦٣م، وله نحو ثمان عشرة سنة، خلف السيوطي أباه في منصبه فدرّس الفقه الشافعي في جامع شيخو وأفتى، متناولاً في فتاويه علوماً شتى ببراعة {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  en: "In 867/1463, hardly eighteen years old, al-Suyuti inherited his father’s position: he taught Shafiʿi law in the mosque of Shaykhu and gave juridical consultations, handling a range of sciences in his fatwas with remarkable brilliance {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  ur: "867ھ/1463ء میں محض اٹھارہ سال کی عمر میں سیوطی اپنے والد کے منصب پر فائز ہوئے: انہوں نے جامع شیخو میں شافعی فقہ پڑھائی اور فتاوے دیے، جن میں انہوں نے مختلف علوم کو غیر معمولی مہارت سے نبھایا {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}۔"
  es: "En 867/1463, con apenas dieciocho años, al-Suyuti heredó el puesto de su padre: enseñó derecho shafiʿi en la mezquita de Shaykhu y ofreció consultas jurídicas, manejando una variedad de ciencias en sus fatwas con notable brillantez {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  fr: "En 867/1463, à peine âgé de dix-huit ans, al-Suyuti hérita de la position de son père: il enseigna le droit chaféite dans la mosquée de Shaykhu et donna des consultations juridiques, traitant d'un large éventail de sciences dans ses fatwas avec une remarquable brillance {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  tr: "Hicri 867/Miladi 1463 yılında, yaklaşık on sekiz yaşında olan El-Suyuti, babasının yerine geçerek Şeyh Mescidi'nde Şafiî fıkıhı dersleri verdi ve çeşitli ilimleri ele alan fetvalar yayımladı. {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}"
  id: "Pada tahun 867 H/1463 M, pada usia sekitar delapan belas tahun, Al-Suyuti menggantikan ayahnya dalam kedudukannya dan mengajar fiqih Syafi'i di Masjid Syekh serta mengeluarkan fatwa, membahas berbagai ilmu dalam fatwanya dengan mahir {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
