label:
  ar: "السيوطي يخلف أباه في التدريس بجامع شيخو، ٨٦٧هـ/١٤٦٣م"
  en: "Al-Suyuti succeeds his father teaching at the mosque of Shaykhu, 867/1463"
  ur: "سیوطی کا جامع شیخو میں تدریس سنبھالنا، 867ھ/1463ء"
summary:
  ar: "سنة ٨٦٧هـ/١٤٦٣م، وله نحو ثمان عشرة سنة، خلف السيوطي أباه في منصبه فدرّس الفقه الشافعي في جامع شيخو وأفتى، متناولاً في فتاويه علوماً شتى ببراعة {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  en: "In 867/1463, hardly eighteen years old, al-Suyuti inherited his father’s position: he taught Shafiʿi law in the mosque of Shaykhu and gave juridical consultations, handling a range of sciences in his fatwas with remarkable brilliance {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  ur: "867ھ/1463ء میں محض اٹھارہ سال کی عمر میں سیوطی اپنے والد کے منصب پر فائز ہوئے: انہوں نے جامع شیخو میں شافعی فقہ پڑھائی اور فتاوے دیے، جن میں انہوں نے مختلف علوم کو غیر معمولی مہارت سے نبھایا {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}۔"
