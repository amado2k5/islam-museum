label: { ar: "سقوط رندة والغربية بيد القشتاليين", en: "The fall of Ronda and the west to the Castilians", es: "La caída de Ronda y el oeste en manos de los castellanos.", fr: "La chute de Ronda et de l'ouest aux mains des Castillans", ur: "رونڈا کا زوال اور کاسٹیلین کے مغرب میں", tr: "Ronda ve Batı Roma İmparatorluğu Kastilyalıların eline geçti.", id: "Ronda dan Kekaisaran Romawi Barat jatuh ke tangan orang-orang Kastilia." }
summary:
  ar: "في جمادى الأولى سنة تسعين وثمانمائة انتقل صاحب قشتالة إلى رندة وحاصرها وكان أهلها خرجوا إلى نصرة ذكوان وسواها، فهدم أسوارها وخرج أهلها على الأمان وطاعت له جميع تلك البلاد ولم يبق بغربي مالقة إلا من دخل في طاعته وتحت ذمته، وفرق حصصه على بعض الحصون ليحاصروا مالقة {cite:nafh-tib-maqqari p. 520}. وفي رمضان من العام توجه لحصن قنبيل فهدم أسواره وخرج أهله بالأمان، واستولى على حصون مثل مشاقر وحصن اللوز، وضيق بجميع بلاد المسلمين ولم يتوجه لناحية إلا استأصلها {cite:nafh-tib-maqqari p. 520}."
  en: "The Castilian siege of Ronda (Jumada I 890): its walls battered while its men were away relieving Cartama, the town surrendered on aman and all western Malaga followed — then the autumn campaign took Qanbil, Mishaqar and Hisn al-Lawz until 'he turned nowhere without uprooting it' {cite:nafh-tib-maqqari p. 520}."
  es: "El asedio castellano de Ronda (Jumada I 890): sus murallas fueron derribadas mientras sus hombres estaban fuera socorriendo a Cartama, la ciudad se rindió el día de aman y todo el oeste de Málaga siguió su ejemplo; luego la campaña de otoño tomó Qanbil, Mishaqar e Hisn al-Lawz hasta que \"no se movió de un lado a otro sin arrasarla\" {cite:nafh-tib-maqqari p. 520}."
  fr: "Le siège castillan de Ronda (Jumada I 890): ses murs défoncés pendant que ses hommes étaient partis secourir Cartama, la ville se rendit à aman et tout l'ouest de Malaga suivit — puis la campagne d'automne prit Qanbil, Mishaqar et Hisn al-Lawz jusqu'à ce qu'« il ne se tournait nulle part sans la déraciner » {cite:nafh-tib-maqqari p. 520}."
  ur: "رونڈا کا کاسٹیلین محاصرہ ⁦(جمعہ اول 890)⁩: اس کی دیواریں اس وقت ٹوٹ گئیں جب اس کے آدمی کارٹاما سے نجات پا رہے تھے، اس قصبے نے امان پر ہتھیار ڈال دیے اور تمام مغربی ملاگا نے اس کا پیچھا کیا - پھر موسم خزاں کی مہم نے قنبیل، مشاقر اور حسن اللوز کو اپنی لپیٹ میں لے لیا یہاں تک کہ وہ اسے اکھاڑ پھینکے بغیر کہیں کا رخ نہیں کیا۔ 520}۔"
  tr: "Hicri 890 yılının Cemâde-i Ula ayında Kastilya hükümdarı Ronda'ya giderek şehri kuşattı. Şehir halkı, Dakvan ve diğerlerini desteklemek için dışarı çıkmıştı. Hükümdar şehrin surlarını yıktı ve halkı güvenlik garantisi karşılığında teslim oldu. Bütün bu topraklar ona boyun eğdi ve Malaga'nın batısında, onun otoritesine boyun eğen ve koruması altında olanlar dışında kimse kalmadı. Malaga'yı kuşatmak için bazı kalelere paylarını dağıttı. Aynı yılın Ramazan ayında Kanbil kalesine yürüdü, surlarını yıktı ve halkı güvenlik garantisi karşılığında teslim oldu. Meşakir ve El-Lavz kalesi gibi kaleleri ele geçirdi ve Müslümanların tüm topraklarına zulmetti; hiçbir bölgeye girmeden orayı yok etmeden bırakmadı."
  id: "Pada bulan Jumada al-Ula tahun 890 H, penguasa Kastilia bergerak ke Ronda dan mengepungnya. Penduduknya telah keluar untuk mendukung Dhakwan dan yang lainnya. Ia menghancurkan tembok-temboknya, dan penduduknya menyerah dengan jaminan keselamatan. Semua wilayah itu tunduk kepadanya, dan tidak ada seorang pun yang tersisa di sebelah barat Malaga kecuali mereka yang tunduk pada kekuasaannya dan berada di bawah perlindungannya. Ia membagikan bagiannya di antara beberapa benteng untuk mengepung Malaga. Pada bulan Ramadan tahun yang sama, ia bergerak menuju benteng Qanbil, menghancurkan tembok-temboknya, dan penduduknya menyerah dengan jaminan keselamatan. Ia merebut benteng-benteng seperti Mashaqir dan benteng Al-Lawz, dan ia menindas semua wilayah kaum Muslimin, dan ia tidak beralih ke wilayah mana pun tanpa memusnahkannya."
