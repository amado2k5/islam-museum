label: { ar: "سقوط رندة والغربية بيد القشتاليين" }
summary:
  ar: "في جمادى الأولى سنة تسعين وثمانمائة انتقل صاحب قشتالة إلى رندة وحاصرها وكان أهلها خرجوا إلى نصرة ذكوان وسواها، فهدم أسوارها وخرج أهلها على الأمان وطاعت له جميع تلك البلاد ولم يبق بغربي مالقة إلا من دخل في طاعته وتحت ذمته، وفرق حصصه على بعض الحصون ليحاصروا مالقة {cite:nafh-tib-maqqari p. 520}. وفي رمضان من العام توجه لحصن قنبيل فهدم أسواره وخرج أهله بالأمان، واستولى على حصون مثل مشاقر وحصن اللوز، وضيق بجميع بلاد المسلمين ولم يتوجه لناحية إلا استأصلها {cite:nafh-tib-maqqari p. 520}."
  en: "The Castilian siege of Ronda (Jumada I 890): its walls battered while its men were away relieving Cartama, the town surrendered on aman and all western Malaga followed — then the autumn campaign took Qanbil, Mishaqar and Hisn al-Lawz until 'he turned nowhere without uprooting it' {cite:nafh-tib-maqqari p. 520}."
