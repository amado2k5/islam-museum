label: { ar: "سقوط رندة والغربية بيد القشتاليين", en: "The fall of Ronda and the west to the Castilians", es: "La caída de Ronda y el oeste en manos de los castellanos.", fr: "La chute de Ronda et de l'ouest aux mains des Castillans" }
summary:
  ar: "في جمادى الأولى سنة تسعين وثمانمائة انتقل صاحب قشتالة إلى رندة وحاصرها وكان أهلها خرجوا إلى نصرة ذكوان وسواها، فهدم أسوارها وخرج أهلها على الأمان وطاعت له جميع تلك البلاد ولم يبق بغربي مالقة إلا من دخل في طاعته وتحت ذمته، وفرق حصصه على بعض الحصون ليحاصروا مالقة {cite:nafh-tib-maqqari p. 520}. وفي رمضان من العام توجه لحصن قنبيل فهدم أسواره وخرج أهله بالأمان، واستولى على حصون مثل مشاقر وحصن اللوز، وضيق بجميع بلاد المسلمين ولم يتوجه لناحية إلا استأصلها {cite:nafh-tib-maqqari p. 520}."
  en: "The Castilian siege of Ronda (Jumada I 890): its walls battered while its men were away relieving Cartama, the town surrendered on aman and all western Malaga followed — then the autumn campaign took Qanbil, Mishaqar and Hisn al-Lawz until 'he turned nowhere without uprooting it' {cite:nafh-tib-maqqari p. 520}."
  es: "El asedio castellano de Ronda (Jumada I 890): sus murallas fueron derribadas mientras sus hombres estaban fuera socorriendo a Cartama, la ciudad se rindió el día de aman y todo el oeste de Málaga siguió su ejemplo; luego la campaña de otoño tomó Qanbil, Mishaqar e Hisn al-Lawz hasta que \"no se movió de un lado a otro sin arrasarla\" {cite:nafh-tib-maqqari p. 520}."
  fr: "Le siège castillan de Ronda (Jumada I 890): ses murs défoncés pendant que ses hommes étaient partis secourir Cartama, la ville se rendit à aman et tout l'ouest de Malaga suivit — puis la campagne d'automne prit Qanbil, Mishaqar et Hisn al-Lawz jusqu'à ce qu'« il ne se tournait nulle part sans la déraciner » {cite:nafh-tib-maqqari p. 520}."
