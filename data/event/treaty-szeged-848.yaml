summary:
  ar: "معاهدة صلح لعشر سنين أُبرمت في سيزجادن في يوليو سنة ٨٤٨هـ/١٤٤٤م بعد أن أوقع القائد المجري يوحنا هنيادي بالعثمانيين هزيمتين فادحتين عام ٨٤٦هـ/١٤٤٢م فاضطروا لطلب الصلح. تنازل فيها السلطان مراد الثاني عن الصرب فاعترف بجورج برانكوفيتش أميراً عليها، وعن الأفلاق للمجر، وافتدى زوج ابنته محمود جلبي قائد الجيوش العثمانية بستين ألف دوقية، وحُررت باللغتين العثمانية والمجرية وأقسم لاديسلاس ملك المجر على الإنجيل وأقسم السلطان مراد على القرآن على مراعاة شروطها بذمة وشرف {cite:dawlat-uthmaniyya-salabi p. 80}. ويذكر الكتاب أن الكاردينال سيزاريني والبابا أوجين الرابع دعوا النصارى لنقضها بحجة أنها عُقدت دون إذن البابا، فنقضها الحلف وكانت وقعة وارنه {cite:dawlat-uthmaniyya-salabi p. 81-82}."
  en: "The ten-year peace sworn at Szeged in July 848/1444 after Hunyadi's double victory: Murad II ceded Serbia to George Branković and Wallachia to Hungary, ransomed his son-in-law Mahmud Çelebi for 60,000 ducats, and swore on the Qur'an as King Ladislas swore on the Gospel {cite:dawlat-uthmaniyya-salabi p. 80}. The book narrates Cardinal Cesarini and Pope Eugene IV preaching its annulment as made without papal leave — the coalition broke it, and Varna followed {cite:dawlat-uthmaniyya-salabi p. 81-82}."
  es: "La paz de diez años jurada en Szeged en julio de 848/1444 después de la doble victoria de Hunyadi: Murad II cedió Serbia a George Branković y Valaquia a Hungría, rescató a su yerno Mahmud Çelebi por 60.000 ducados y juró sobre el Corán como el rey Ladislao juró sobre el Evangelio {cite:dawlat-uthmaniyya-salabi p. 80}. El libro narra que el cardenal Cesarini y el papa Eugenio IV predicaron su anulación por haberse realizado sin permiso papal; la coalición la rompió y Varna siguió {cite:dawlat-uthmaniyya-salabi pp. 81-82}."
  fr: "La paix de dix ans scellée à Szeged en juillet 848/1444 après la double victoire de Hunyadi: Murad II céda la Serbie à Georges Branković et la Valachie à la Hongrie, racheta son gendre Mahmoud Çelebi pour 60 000 ducats et prêta serment sur le Coran, comme le roi Ladislas avait prêté serment sur l’Évangile (voir: Dawlat-Uthmaniyya-Salabi, p. 80). L’ouvrage relate comment le cardinal Cesarini et le pape Eugène IV prêchèrent son annulation, la jugeant non autorisée par le pape; la coalition la rompit et Varna suivit le mouvement (voir: Dawlat-Uthmaniyya-Salabi, p. 81-82)."
  ur: "ہنیادی کی دوہری فتح کے بعد جولائی 848/1444 میں شیزڈ میں دس سالہ امن کا حلف اٹھایا: مراد دوم نے سربیا کو جارج برانکوویچ اور والاچیا کو ہنگری کے حوالے کر دیا، اپنے داماد محمود سلیبی کو 60,000 ducats کے عوض فدیہ دیا، اور لاؤرسپل کے بادشاہ کے طور پر حلف لیا۔ {حوالہ:دولت عثمانیہ سلبی ص۔ 80}۔ اس کتاب میں کارڈینل سیسرینی اور پوپ یوجین چہارم نے اس کی منسوخی کی تبلیغ کی ہے جیسا کہ پوپ کی اجازت کے بغیر کیا گیا تھا - اتحاد نے اسے توڑ دیا، اور ورنا نے پیروی کی۔ 81-82}۔"
  tr: "Macar komutan John Hunyadi'nin 846 Hicri/1442 yılında Osmanlılara iki ağır yenilgi yaşatmasının ardından, Osmanlıları barış aramaya zorlamak için 848 Hicri/1444 Miladi yılının Temmuz ayında Szeged'de on yıllık bir barış antlaşması imzalandı. Bu antlaşmada Sultan Murad II, Sırbistan'ı Macaristan'a devretti ve George Branković'i prens olarak tanıdı; Eflak'ı ise Macaristan'a bıraktı. Osmanlı ordularının komutanı olan damadı Mahmud Çelebi'yi altmış bin duka karşılığında fidye olarak serbest bıraktı. Antlaşma hem Osmanlı Türkçesi hem de Macarca olarak yazıldı ve Macaristan Kralı Ladislaus İncil üzerine, Sultan Murad ise Kur'an üzerine yemin ederek şartlarına dürüstlük ve şerefle bağlı kalacaklarına söz verdi. {cite:dawlat-uthmaniyya-salabi s. 80} Kitapta, Kardinal Cesarini ve Papa IV. Eugene'in, anlaşmanın papalığın izni olmadan yapıldığını savunarak Hristiyanları anlaşmayı bozmaya çağırdıkları belirtiliyor. İttifak daha sonra anlaşmayı bozdu ve bu da Warna Savaşı'na yol açtı. {cite:dawlat-uthmaniyya-salabi s. 80} 81-82}."
  id: "Perjanjian damai sepuluh tahun disepakati di Szeged pada Juli 848 H/1444 M setelah komandan Hungaria John Hunyadi memberikan dua kekalahan telak kepada Ottoman pada 846 H/1442 M, memaksa mereka untuk mencari perdamaian. Dalam perjanjian itu, Sultan Murad II menyerahkan Serbia, mengakui George Branković sebagai pangerannya, dan Wallachia kepada Hungaria. Ia menebus menantunya, Mahmud Çelebi, komandan pasukan Ottoman, dengan enam puluh ribu ducat. Perjanjian itu ditulis dalam bahasa Turki Ottoman dan Hungaria, dan Ladislaus, Raja Hungaria, bersumpah di atas Alkitab, sementara Sultan Murad bersumpah di atas Al-Quran untuk menjunjung tinggi ketentuan-ketentuannya dengan integritas dan kehormatan. {cite:dawlat-uthmaniyya-salabi hlm. 80}. Buku tersebut menyebutkan bahwa Kardinal Cesarini dan Paus Eugene IV menyerukan kepada umat Kristen untuk melanggar perjanjian tersebut, dengan alasan bahwa perjanjian itu telah disepakati tanpa izin Paus. Aliansi tersebut kemudian bubar, yang menyebabkan Pertempuran Warna. {cite:dawlat-uthmaniyya-salabi p. 80} 81-82}."
