summary:
  ar: "في [[place/durban|ديربان]] بجنوب أفريقيا سنة 1981 واجه أحمد ديدات الكاتب الدفاعي المسيحي [[person/josh-mcdowell|جوش ماكدويل]] في مناظرة بعنوان «هل صُلب المسيح؟»، فدفع ديدات بأن القرآن نفى الصلب والقتل في [[passage/quran-4-157|النساء 157]] وعرض مآخذه التاريخية والنصية، ودافع ماكدويل عن واقعة الصلب والقيامة بأدلة البشائر والتحقيق التاريخي. وبقي تفريغ المناظرة وتسجيلها من أثبت الوثائق في أرشيف الديانة المقارنة {cite:answering-islam-debates-index}."
  en: "In [[place/durban|Durban]], South Africa, in 1981 Ahmed Deedat faced the Christian apologist [[person/josh-mcdowell|Josh McDowell]] in a debate titled 'Was Christ Crucified?'. Deedat argued from the Qur'an's denial of the crucifixion in [[passage/quran-4-157|al-Nisa 157]] and presented his historical and textual objections; McDowell defended the fact of the crucifixion and resurrection from the Gospels and historical investigation. The transcript and recording remain among the firmest documents in the comparative-religion archive {cite:answering-islam-debates-index}."
  es: "En Durban, Sudáfrica, en 1981, Ahmed Deedat se enfrentó al apologista cristiano Josh McDowell en un debate titulado \"¿Fue crucificado Cristo?\". Deedat argumentó basándose en la negación de la crucifixión en el Corán, en Al-Nisa 157, y presentó sus objeciones históricas y textuales; McDowell defendió la crucifixión y resurrección a partir de los Evangelios y la investigación histórica. La transcripción y la grabación se encuentran entre los documentos más fiables del archivo de religión comparada {cite:answering-islam-debates-index}."
  fr: "À Durban, en Afrique du Sud, en 1981, Ahmed Deedat affronta l'apologiste chrétien Josh McDowell lors d'un débat intitulé « Le Christ a-t-il été crucifié ? ». Deedat s'appuya sur le passage du Coran niant la crucifixion (An-Nisa 157, 4) et présenta ses objections historiques et textuelles; McDowell, quant à lui, défendit la réalité de la crucifixion et de la résurrection en se basant sur les Évangiles et les recherches historiques. La transcription et l'enregistrement de ce débat figurent parmi les documents les plus importants des archives de religions comparées."
