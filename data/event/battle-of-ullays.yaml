summary:
  ar: "وقعة ألّيس على الفرات: غضب نصارى بكر بن وائل لمصاب إخوانهم يوم الولجة فكاتبوا الفرس واجتمعوا على ألّيس وعليهم عبد الأسود العجلي، وأرسل بهمن جاذويه جابان إليهم. عصى الأعاجم جابان فبسطوا الطعام ليُظهروا أنهم لا يحفلون بالمسلمين فانتهى إليهم خالد وقد وُضع الطعام فبارز مالكًا بن قيس فقتله، وقاتلوهم حتى هزموهم، وأقسم خالد ليُجرينّ دماءهم فاستمر يضرب أعناقهم يومًا وليلة حتى قال له القعقاع وغيره: لو قتلت أهل الأرض لم تجر دماؤهم فأرسل عليهم الماء تبرّ يمينك، ففعل وسُمّي نهر الدم، ووقف على الطعام فقال قد نفّلتكموه، وبلغ عدد القتلى سبعين ألفًا. ثم سار إلى أمغيشيا فأصاب فيها ما لم يصب مثله وأرسل بذلك إلى أبي بكر فقال عجزت النساء أن يلدن مثل خالد {cite:kamil-ibn-al-athir p. 237-238}."
  en: "The battle of Ullays on the Euphrates: Christian tribesmen of Bakr ibn Wa'il, avenging Walaja, joined Jaban's Persian army; when they spread their meal to show contempt Khalid fell upon them before they could eat, killed Malik ibn Qays in a duel, then vowed to make their blood flow — a day and a night of executions until al-Qa'qa' told him to release the river's water over the field to fulfill the oath, and it was named the River of Blood. The dead were reckoned at seventy thousand; at Amghishiya next he took more plunder than anywhere before, and Abu Bakr said: 'Women are powerless to bear the like of Khalid' {cite:kamil-ibn-al-athir p. 237-238}."
