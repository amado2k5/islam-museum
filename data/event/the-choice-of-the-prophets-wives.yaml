date:
  start: { hijri: "0009~", calendar: julian, precision: year, status: tradition, note: "تاريخ تقريبي غير مؤكد؛ بعد استقرار البيت النبوي بالمدينة؛ لم يثبت تاريخ محدد، والسنة تقريبية ⁦(الرحيق المختوم ص 478)⁩", sources: [source/mubarakpuri-raheeq] }
summary:
  ar: "لمّا طلبت أزواج النبي تحسين العيش مع شظف البيت النبوي، نزلت آية التخيير في سورة الأحزاب: إن كنتن تردن الحياة الدنيا وزينتها فتعالين أمتعكن، وإن كنتن تردن الله ورسوله والدار الآخرة فإن الله أعد للمحسنات منكن أجراً عظيماً؛ فاخترن الله ورسوله جميعاً."
  en: "When the Prophet's wives asked for a better standard of living amid the austerity of his household, the verse of choice was revealed (al-Ahzab 28-29): if you desire the life of this world and its adornment, come, I will provide for you and release you graciously; but if you desire Allah and His Messenger and the abode of the Hereafter, Allah has prepared a great reward for the doers of good among you. All of them chose Allah and His Messenger."
  es: "Cuando las esposas del Profeta pidieron un mejor nivel de vida en medio de la austeridad de su hogar, se reveló el versículo de elección (al-Ahzab 28-29): «Si deseáis la vida de este mundo y sus adornos, venid, os proveeré y os liberaré con benevolencia; pero si deseáis a Alá, a Su Mensajero y la morada del Más Allá, Alá ha preparado una gran recompensa para quienes obran bien entre vosotros». Todas ellas eligieron a Alá y a Su Mensajero."
  fr: "Lorsque les épouses du Prophète demandèrent un meilleur niveau de vie face à l'austérité de sa famille, le verset du choix fut révélé (Al-Ahzab 28-29): « Si vous désirez la vie d'ici-bas et ses ornements, venez, Je vous y pourvoirai et vous libérerai avec grâce. Mais si vous désirez Allah, Son Messager et la demeure de l'au-delà, Allah a préparé une immense récompense pour les vertueux parmi vous. » Toutes choisirent Allah et Son Messager."
