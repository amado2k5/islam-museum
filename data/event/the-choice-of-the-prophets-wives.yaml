summary:
  ar: "لمّا طلبت أزواج النبي تحسين العيش مع شظف البيت النبوي، نزلت آية التخيير في سورة الأحزاب: إن كنتن تردن الحياة الدنيا وزينتها فتعالين أمتعكن، وإن كنتن تردن الله ورسوله والدار الآخرة فإن الله أعد للمحسنات منكن أجراً عظيماً؛ فاخترن الله ورسوله جميعاً."
  en: "When the Prophet's wives asked for a better standard of living amid the austerity of his household, the verse of choice was revealed (al-Ahzab 28-29): if you desire the life of this world and its adornment, come, I will provide for you and release you graciously; but if you desire Allah and His Messenger and the abode of the Hereafter, Allah has prepared a great reward for the doers of good among you. All of them chose Allah and His Messenger."
