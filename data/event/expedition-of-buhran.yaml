label: { en: "Expedition of Buhran", ar: "غزوة بحران", es: "Expedición de Buhran", fr: "Expédition de Buhran", ur: "بوہران کی مہم", tr: "Bahran Muharebesi", id: "Pertempuran Bahrain" }
summary:
  en: "An expedition led by the Prophet with 300 men in Rabi' al-Thani 3 AH to Buhran in the direction of al-Furu'; stayed through Jumada al-Ula without encounter."
  ar: "دورية قتال في ثلاثمائة مقاتل قادها النبي في ربيع الآخر سنة 3هـ إلى بحران بناحية الفرع في الحجاز لترصد تحركات المشركين؛ أقام بها شهرين ورجع دون قتال."
  es: "Una expedición liderada por el Profeta con 300 hombres en Rabi' al-Thani 3 AH a Buhran en dirección a al-Furu'; permanecieron hasta Jumada al-Ula sin encontrar ningún encuentro."
  fr: "Une expédition menée par le Prophète avec 300 hommes en Rabi' al-Thani 3 AH à Buhran en direction d'al-Furu'; resta jusqu'à Jumada al-Ula sans rencontrer d'ennemis."
  ur: "ربیع الثانی 3 ہجری میں 300 آدمیوں کے ساتھ رسول اللہ کی قیادت میں ایک مہم جو الفورو کی سمت میں بوہران کی طرف روانہ ہوئی۔ جمادی الاول میں بغیر ملاقات کے قیام کیا۔"
  tr: "Peygamberimiz önderliğindeki üç yüz savaşçıdan oluşan bir devriye birliği, Hicri 3. yılın Rebiü'l-Sani ayında, müşriklerin hareketlerini izlemek amacıyla Hicaz'ın Fara bölgesindeki Bahran'a gitti; orada iki ay kaldı ve herhangi bir çatışma olmadan geri döndü."
  id: "Sebuah patroli tempur yang terdiri dari tiga ratus pejuang dipimpin oleh Nabi pada bulan Rabi' al-Thani tahun 3 H ke Bahran di daerah Al-Fara' di Hijaz untuk memantau pergerakan kaum musyrik; beliau tinggal di sana selama dua bulan dan kembali tanpa berperang."
