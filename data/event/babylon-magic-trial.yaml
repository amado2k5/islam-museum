id: event/babylon-magic-trial
class: event
kind: other
label:
  ar: "امتحان السحر في بابل: هاروت وماروت"
  en: "The trial of magic in Babylon: Harut and Marut"
  ur: "بابل میں جادو کا امتحان: ہاروت اور ماروت"
  fr: "L'épreuve de la magie à Babylone : Harut et Marut"
  es: "El juicio por magia en Babilonia: Harut y Marut"
  tr: "Babil'de Büyü Sınavı: Harut ve Marut"
  id: "Ujian Sihir di Babilonia: Harut dan Marut"
summary:
  ar: "يخبر القرآن أن الشياطين علّمت الناس السحر وأنه نزل على ملكين ببابل «ماروت وماروت» ما يُبتلون به، وأنهم «ما يعلمان أحداً حتى يقولا إنما نحن فتنة فلا تكفر» {cite:tanzil-quran} [[passage/quran-2-102|البقرة 102]]. وفي التفسير أن هذين المَلَكين أو من في حكمهما هما من فتنوا الناس بالسحر حتى عصاهم الله {cite:tafsir-ibn-kathir}."
  en: "The Qur'an reports that the devils taught people sorcery and that it was sent down upon two beings in Babylon — 'Marut and Harut' — by which they would be tested, and that they 'do not teach anyone until they say: we are only a trial, so do not disbelieve' {cite:tanzil-quran} [[passage/quran-2-102|al-Baqarah 102]]. In the tafsir they are the two beings — understood variously as angels, jinn or humans — through whom people were tried by magic until God punished them {cite:tafsir-ibn-kathir}."
  ur: "قرآن بتاتا ہے کہ شیطانوں نے لوگوں کو جادو سکھایا اور بابل میں «ماروت اور ہاروت» نامی دو ہستیوں پر وہ چیز نازل ہوئی جس سے ان کی آزمائش ہو، اور «وہ کسی کو نہیں سکھاتے جب تک یہ نہ کہیں کہ ہم تو آزمائش ہیں، اس لیے کفر نہ کرو» {cite:tanzil-quran} [[passage/quran-2-102|البقرہ 102]]۔ تفسیر میں یہی وہ دو ہستیاں ہیں — جنہیں فرشتے، جن یا انسان کے طور پر سمجھا گیا — جن کے ذریعے لوگوں کو جادو سے آزمایا گیا یہاں تک کہ اللہ نے ان پر سزا دی {cite:tafsir-ibn-kathir}۔"
  fr: "Le Coran rapporte que les démons enseignaient la sorcellerie aux gens et qu'elle fut descendue sur deux êtres à Babylone, « Marut et Harut », par lesquels les gens seraient éprouvés, et qu'ils « n'enseignent à personne sans dire : nous ne sommes qu'une épreuve, ne mécroie donc pas » {cite:tanzil-quran} [[passage/quran-2-102|al-Baqarah 102]]. Dans le tafsir, ce sont les deux êtres, compris tantôt comme des anges, des djinns ou des humains, par lesquels les gens furent éprouvés par la magie jusqu'à ce que Dieu les punisse {cite:tafsir-ibn-kathir}."
  es: "El Corán relata que los demonios enseñaron a la gente la hechicería y que esta fue enviada a dos seres en Babilonia —Marut y Harut— mediante los cuales serían puestos a prueba, y que «no enseñan a nadie hasta que dicen: “Somos solo una prueba, así que no descreáis”» {cita:tanzil-quran} [[passage/quran-2-102|al-Baqarah 102]]. En el tafsir, son los dos seres —entendidos de diversas maneras como ángeles, genios o humanos— a través de los cuales la gente fue probada con magia hasta que Dios los castigó {cita:tafsir-ibn-kathir}."
  tr: "Kur'an bize şeytanların insanlara sihir öğrettiğini ve Babil'de Marut ve Marut adında iki meleğin, sınanacakları bir imtihana tabi tutulduklarını ve \"onlar, 'Biz sadece bir imtihanız, sakın inkâr etmeyin' demeden kimseye öğretmezler\" (Bakara 2:102) dediklerini anlatır. Tefsirde, bu iki meleğin veya onlara benzerlerinin, insanları sihirle ayartarak Allah'a isyan etmelerine neden oldukları açıklanır (İbn Kathir Tefsiri)."
  id: "Al-Quran memberitahu kita bahwa setan-setan mengajarkan sihir kepada manusia, dan bahwa dua malaikat di Babilonia, Marut dan Marut, diberi ujian untuk menguji mereka, dan bahwa mereka “tidak mengajarkan sihir kepada siapa pun sampai mereka berkata, ‘Sesungguhnya kami hanyalah ujian, maka janganlah kamu kafir’” (Al-Baqarah 2:102). Tafsir menjelaskan bahwa kedua malaikat ini, atau yang seperti mereka, adalah orang-orang yang menggoda manusia dengan sihir sampai mereka durhaka kepada Allah (Tafsir Ibn Kathir)."
