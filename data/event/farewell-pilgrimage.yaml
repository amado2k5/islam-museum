    ar: "حجة الوداع في السنة العاشرة هي الحجة الوحيدة التي حجّها النبي؛ بيّن فيها للناس مناسكهم وألقى خطبته المشهورة."
    en: "The Farewell Pilgrimage in 10 AH was the only hajj the Prophet led; in it he showed the people their rites and delivered the well-known sermon."
