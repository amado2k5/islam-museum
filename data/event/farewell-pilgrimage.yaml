label: { en: "The Farewell Pilgrimage", ar: "حجة الوداع", es: "La peregrinación de despedida", fr: "Le pèlerinage d'adieu", ur: "الوداعی حج", tr: "Veda Hac Yolculuğu", id: "Ziarah Perpisahan" }
summary:
  ar: "الحجة الوحيدة التي قادها النبي، وألقى فيها الخطبة المعروفة بخطبة الوداع. وأطول نص نبوي لمناسكها حديث جابر بن عبد الله عند مسلم — من التلبية إلى الرمي والنحر، وفيه خطبة عرفة «إن دماءكم وأموالكم حرام عليكم» {cite:sahih-muslim 1218}. وتضعها دائرة المعارف الإسلامية في السنة العاشرة للهجرة، وتذكر من ترتيباتها إلغاء النسيء وإقرار السنة القمرية الخالصة، وتعرض قراءات أكاديمية لقوله في مواقف عرفة ومزدلفة ومنى."
  en: "The only pilgrimage the Prophet led, during which he gave the sermon known as the Farewell Sermon. The Encyclopaedia of Islam places it in the tenth year of the Hijra and names among its arrangements the abolition of intercalation and the purely lunar year; it also reports academic readings of his saying on the standing places at Arafat, Muzdalifa and Mina, set apart from the Muslim reports."
  ur: "وہ واحد حج جس کی قیادت نبی نے کی اور جس میں انھوں نے خطبۂ وداع دیا۔ دائرۃ المعارف الاسلامیہ اسے ہجرت کے دسویں سال میں رکھتا ہے اور اس کے انتظامات میں نسیء کے خاتمے اور خالص قمری سال کا ذکر کرتا ہے، اور عرفات، مزدلفہ اور منیٰ کے مقامات پر ان کے قول کی علمی تعبیریں اسلامی روایات سے الگ بیان کرتا ہے۔"
  es: "La única peregrinación que dirigió el Profeta, durante la cual pronunció el sermón conocido como el Sermón de Despedida. La Enciclopedia del Islam la sitúa en el décimo año de la Hégira y menciona, entre sus disposiciones, la abolición de la intercalación y el calendario lunar puro; también recoge lecturas académicas de sus palabras sobre los lugares de descanso en Arafat, Muzdalifa y Mina, que se distinguen de los relatos musulmanes."
  fr: "Le seul pèlerinage que le Prophète ait dirigé, durant lequel il prononça le sermon connu sous le nom de Sermon d'adieu. L'Encyclopédie de l'Islam le situe dans la dixième année de l'Hégire et mentionne parmi ses dispositions l'abolition de l'intercalation et l'adoption d'une année lunaire pure; elle rapporte également des lectures académiques de ses paroles sur les lieux saints d'Arafat, de Muzdalifa et de Mina, distinctes des récits musulmans."
  tr: "Peygamberin bizzat önderlik ettiği tek hac yolculuğu olup, bu yolculuk sırasında Veda Hutbesi olarak bilinen hutbeyi vermiştir. Ritüellerini anlatan en uzun peygamberlik metni, Sahih Müslim'de yer alan Cabir ibn Abdullah'ın hadisidir; Talbiye'den Cemarat'ın taşlanmasına ve kurban kesimine kadar olan ritüelleri içerir ve Arafat hutbesini de kapsar: \"Kanınız ve malınız sizin için kutsaldır\" (sahih-müslim 1218). İslam Ansiklopedisi, bu yolculuğu Hicretin onuncu yılına yerleştirir ve düzenlemeleri arasında araya eklemelerin kaldırılmasını ve tamamen hilale dayalı bir takvimin kurulmasını belirtir; ayrıca Arafat, Muzdalifa ve Mina'daki sözlerinin âlimlerce yorumlanmasını sunar."
  id: "Satu-satunya ibadah haji yang dipimpin oleh Nabi, di mana beliau menyampaikan khutbah yang dikenal sebagai Khutbah Perpisahan. Teks kenabian terpanjang yang menjelaskan ritualnya adalah hadits Jabir bin Abdullah dalam Sahih Muslim—dari Talbiyah hingga pelemparan batu Jamarat dan kurban—yang mencakup khutbah Arafat, “Darah dan hartamu adalah suci bagimu” (kutipan: sahih-muslim 1218). Ensiklopedia Islam menempatkannya pada tahun kesepuluh Hijrah, menyebutkan di antara pengaturannya penghapusan penambahan waktu dan penetapan kalender murni lunar, dan menyajikan interpretasi ilmiah tentang kata-kata beliau di Arafat, Muzdalifah, dan Mina."
