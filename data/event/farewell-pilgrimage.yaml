id: event/farewell-pilgrimage
class: event
kind: pilgrimage
label: { en: "The Farewell Pilgrimage", ar: "حجة الوداع" }
summary:
  ar: "الحجة الوحيدة التي قادها النبي، وألقى فيها الخطبة المعروفة بخطبة الوداع. وأطول نص نبوي لمناسكها حديث جابر بن عبد الله عند مسلم — من التلبية إلى الرمي والنحر، وفيه خطبة عرفة «إن دماءكم وأموالكم حرام عليكم» {cite:sahih-muslim 1218}. وتضعها دائرة المعارف الإسلامية في السنة العاشرة للهجرة، وتذكر من ترتيباتها إلغاء النسيء وإقرار السنة القمرية الخالصة، وتعرض قراءات أكاديمية لقوله في مواقف عرفة ومزدلفة ومنى."
  en: "The only pilgrimage the Prophet led, during which he gave the sermon known as the Farewell Sermon. The Encyclopaedia of Islam places it in the tenth year of the Hijra and names among its arrangements the abolition of intercalation and the purely lunar year; it also reports academic readings of his saying on the standing places at Arafat, Muzdalifa and Mina, set apart from the Muslim reports."
  ur: "وہ واحد حج جس کی قیادت نبی نے کی اور جس میں انھوں نے خطبۂ وداع دیا۔ دائرۃ المعارف الاسلامیہ اسے ہجرت کے دسویں سال میں رکھتا ہے اور اس کے انتظامات میں نسیء کے خاتمے اور خالص قمری سال کا ذکر کرتا ہے، اور عرفات، مزدلفہ اور منیٰ کے مقامات پر ان کے قول کی علمی تعبیریں اسلامی روایات سے الگ بیان کرتا ہے۔"
