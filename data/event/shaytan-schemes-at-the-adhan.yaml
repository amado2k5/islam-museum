id: event/shaytan-schemes-at-the-adhan
class: event
kind: other
label:
  ar: "تدبير الشيطان عند الأذان"
  en: "The shaytan's scheming at the call to prayer"
  ur: "اذان کے وقت شیطان کی چال"
  es: "Las maquinaciones de Satanás durante la llamada a la oración."
  fr: "Les manigances du shaytan lors de l'appel à la prière"
  tr: "Ezan vaktinde şeytanın planı"
  id: "Tipu daya setan pada saat seruan azan berkumandang"
summary:
  ar: "يدبر الشيطان عند الأذان حتى لا يسمعه فإذا انقضى أقبل فإذا أقيمت الصلاة أدبر فإذا انقضت الإقامة أقبل حتى يخطر بين المرء ونفسه يذكّره ما لم يكن يذكر {cite:muwatta-maruf-1997} [[passage/muwatta-1-177|الموطأ 177]]."
  en: "The shaytan schemes at the adhan so that people do not hear it; when it ends he returns, when the iqama is set he withdraws, and when it ends he returns to whisper between a man and himself, reminding him of what he had forgotten {cite:muwatta-maruf-1997} [[passage/muwatta-1-177|Muwatta 177]]."
  ur: "شیطان اذان کے وقت چال چلاتا ہے تاکہ لوگ اسے نہ سنیں؛ جب اذان ختم ہو تو وہ لوٹتا ہے، اقامت ہو تو پیچھے ہٹتا ہے، اور اقامت ختم ہو تو واپس آ کر انسان اور اس کے نفس کے درمیان خیال ڈالتا ہے، اسے وہ یاد دلاتا ہے جو بھول گیا تھا {cite:muwatta-maruf-1997} [[passage/muwatta-1-177|موطأ 177]]۔"
  es: "El shaytan trama en el adhan para que la gente no lo oiga; cuando termina, regresa; cuando se establece el iqama, se retira; y cuando termina, regresa para susurrar entre un hombre y él mismo, recordándole lo que había olvidado {cite:muwatta-maruf-1997} [[passage/muwatta-1-177|Muwatta 177]]."
  fr: "Le shaytan orchestre l'adhan pour que les gens ne l'entendent pas; lorsqu'il se termine, il revient, lorsque l'iqama est fixée, il se retire, et lorsqu'il se termine, il revient murmurer entre un homme et lui-même, lui rappelant ce qu'il avait oublié {cite:muwatta-maruf-1997} [[passage/muwatta-1-177|Muwatta 177])."
  tr: "Şeytan ezan okunduğunda geri çekilir, böylece onu duymaz. Ezan bittiğinde öne çıkar. Namaz kılındığında geri çekilir. Namaz kılındığında öne çıkar ve sonunda insanla kendi nefsi arasında fısıldayarak, hatırlamadığı şeyleri ona hatırlatır. {cite:muwatta-maruf-1997} [[passage/muwatta-1-177|الموطأ 177]]."
  id: "Setan mundur ketika azan berkumandang sehingga ia tidak mendengarnya. Setelah azan selesai, ia muncul kembali. Ketika salat telah ditegakkan, ia mundur. Ketika salat telah ditegakkan, ia muncul kembali hingga ia berbisik di antara seseorang dan jiwanya sendiri, mengingatkannya tentang apa yang tidak diingatnya. {cite:muwatta-maruf-1997} [[passage/muwatta-1-177|الموطأ 177]]."
