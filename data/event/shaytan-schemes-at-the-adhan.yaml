id: event/shaytan-schemes-at-the-adhan
class: event
kind: other
label:
  ar: "تدبير الشيطان عند الأذان"
  en: "The shaytan's scheming at the call to prayer"
  ur: "اذان کے وقت شیطان کی چال"
summary:
  ar: "يدبر الشيطان عند الأذان حتى لا يسمعه فإذا انقضى أقبل فإذا أقيمت الصلاة أدبر فإذا انقضت الإقامة أقبل حتى يخطر بين المرء ونفسه يذكّره ما لم يكن يذكر {cite:muwatta-maruf-1997} [[passage/muwatta-1-177|الموطأ 177]]."
  en: "The shaytan schemes at the adhan so that people do not hear it; when it ends he returns, when the iqama is set he withdraws, and when it ends he returns to whisper between a man and himself, reminding him of what he had forgotten {cite:muwatta-maruf-1997} [[passage/muwatta-1-177|Muwatta 177]]."
  ur: "شیطان اذان کے وقت چال چلاتا ہے تاکہ لوگ اسے نہ سنیں؛ جب اذان ختم ہو تو وہ لوٹتا ہے، اقامت ہو تو پیچھے ہٹتا ہے، اور اقامت ختم ہو تو واپس آ کر انسان اور اس کے نفس کے درمیان خیال ڈالتا ہے، اسے وہ یاد دلاتا ہے جو بھول گیا تھا {cite:muwatta-maruf-1997} [[passage/muwatta-1-177|موطأ 177]]۔"
