id: event/timur-sack-damascus-803
class: event
kind: conquest
label: { ar: "كائنة تيمور بدمشق سنة 803هـ", en: "Timur's Event at Damascus in 803 AH", es: "El evento de Timur en Damasco en el año 803 AH", fr: "L'événement de Timour à Damas en 803 AH", ur: "تیمور کا واقعہ دمشق میں 803 ہجری میں", tr: "Timur'un Hicri 803 yılında Şam'daki ikametgahı.", id: "Kediaman Timur di Damaskus pada tahun 803 Hijriah" }
summary:
  ar: "في سنة ثلاث وثمانمائة ملك تيمور خوارزم وما وراء النهر وسمرقند وخراسان وهراة وطبرستان وجرجان وتبريز وأصبهان ثم بغداد وسيواس وبهسنا ثم نازل حلب في ربيع الأول فملكها وفعل فيها الأفاعيل الشنيعة ثم تحول إلى دمشق في ربيع الآخر وسار حتى أناخ على ظاهر دمشق من داريا إلى قطنا والحولة ثم احتاط بالمدينة وانتشرت عساكره في ظواهرها تتخطف الهاربين وصار يلقي من ظفر به تحت أرجل القيلة حتى خرج إليه أعيان المدينة بعد أن أعياه أمرهم يطلبون منه الأمان فأجلسهم وقدم إليهم طعاماً وأخلع عليهم وأكرمهم ونادى في المدينة بالأمان والاطمئنان وألا يعتدي أحد على أحد فاتفق أن بعض عسكره نهب شيئاً من السوق فشنقه وصلبه برأس سوق البزوريين ففشا ذلك في الشاميين وفتحوا أبواب المدينة ووزعت الأموال التي فرضها عليهم لأجل الأمان على الحارات وجعلوا دار الذهب هي المستخرج ونزل تيمور بالقصر الأبلق من الميدان وعبر المدينة من باب الصغير حتى صلى الجمعة بجامع بني أمية وقدم القاضي الحنفي محمود بن الكشك للخطبة والصلاة ثم جرت مناظرة بين إمامه عبد الجبار وفقهاء دمشق وهو يترجم عن تيمور بأشياء منها وقائع علي بن أبي طالب مع معاوية وما وقع ليزيد بن معاوية مع الحسين وأن ذلك كله كان بمعاونة أهل دمشق له فإن كانوا استحلوه فهم كفار وإلا فهم عصاة بغاة وكيف هؤلاء على أولئك فأجابوه بأجوبة قبل بعضها ورد البعض ثم جد في حصار القلعة وقد أعياه أمرها ولم يكن بها إلا نفر يسير فضرب عليها عدة مناحيق وأمر فبنيت لها قلعة عظيمة من خشب فرمى من بالقلعة على القلعة الخشبية بسهم فيه نار فاحترقت عن آخرها فأنشأ قلعة أخرى ثم سلموها له بعد أربعين يوماً بالأمان ولما أخذ تيمور قلعة دمشق أباح لمن معه النهب والسلب والقتل والإحراق فهجموا المدينة ولم يدعوا بها شيئاً قدروا عليه وطرحوا على أهلها أنواع العذاب وسبوا النساء والأولاد ولا زالوا على ذلك أياماً وألقوا النار في المباني حتى احترقت بأسرها ورحل عنها {cite:shadharat-dhahab p. 71-73}."
  en: "In 803 Timur, master of Transoxiana, Khurasan and Baghdad, took Aleppo in Rabi' I with unspeakable deeds, then turned to Damascus in Rabi' II and encamped from Darayya to Qatana, ringed the city, and trod captives beneath the mounts until the notables came out pleading quarter; he feasted, robed and honoured them, proclaimed safety, and hanged a soldier who looted the bazaar atop the Seed-Market — so the gates opened. He entered through Bab al-Saghir and prayed Friday at the Umayyad mosque, where his Mu'tazili imam Abd al-Jabbar debated Damascus's jurists on Ali's wars and Husayn's killing — 'if the Damascenes sanctioned it they are unbelievers, else rebels: how then do they stand?' The Citadel held out forty days till a wooden siege-tower was burned by fire-arrows and rebuilt; on its surrender Timur licensed plunder, slaughter and burning — women and children enslaved, torments inflicted for days, the buildings torched until all burned, then he departed {cite:shadharat-dhahab p. 71-73}."
  es: "En 803, Timur, señor de Transoxiana, Jorasán y Bagdad, tomó Alepo en Rabi' I con actos indescriptibles, luego se dirigió a Damasco en Rabi' II y acampó desde Darayya hasta Qatana, rodeó la ciudad y pisoteó a los cautivos bajo las montañas hasta que los notables salieron implorando clemencia; los agasajó, los vistió y honró, proclamó seguridad y ahorcó a un soldado que saqueó el bazar en la cima del Mercado de Semillas, por lo que las puertas se abrieron. Entró por Bab al-Saghir y rezó el viernes en la mezquita omeya, donde su imán mu'tazilí Abd al-Jabbar debatió con los juristas de Damasco sobre las guerras de Alí y el asesinato de Husayn: «Si los damascenos lo sancionaron, son infieles; de lo contrario, rebeldes: ¿cómo se sostienen entonces?». La Ciudadela resistió cuarenta días hasta que una torre de asedio de madera fue incendiada por flechas incendiarias y reconstruida; tras su rendición, Timur autorizó el saqueo, la matanza y la quema: mujeres y niños fueron esclavizados, se les infligieron tormentos durante días, los edificios fueron incendiados hasta que todo se quemó, y luego se marchó {cite:shadharat-dhahab p. 71-73}."
  fr: "En 803, Timour, maître de la Transoxiane, du Khorasan et de Bagdad, prit Alep au mois de Rabi' I par des actes innommables, puis se tourna vers Damas au mois de Rabi' II et campa de Darayya à Qatana, encerclant la ville et faisant piétiner les captifs au pied des montagnes jusqu'à ce que les notables sortent implorer sa clémence; il festoya, les revêtit d'habits et les honora, proclama la sécurité et fit pendre un soldat qui avait pillé le bazar au-dessus du marché aux semences – alors les portes s'ouvrirent. Il entra par Bab al-Saghir et pria le vendredi à la mosquée des Omeyyades, où son imam mu'tazilite, Abd al-Jabbar, débattait avec les juristes de Damas des guerres d'Ali et du meurtre de Hussein: « Si les Damascènes l'ont approuvé, ce sont des infidèles, sinon des rebelles: comment alors se maintiennent-ils ? » La citadelle tint quarante jours jusqu'à ce qu'une tour de siège en bois soit incendiée par des flèches enflammées et reconstruite; lors de sa reddition, Timour autorisa le pillage, le massacre et l'incendie — femmes et enfants réduits en esclavage, tourments infligés pendant des jours, les bâtiments incendiés jusqu'à ce que tout soit brûlé, puis il partit {cite:shadharat-dhahab p. 71-73}."
  ur: "803 میں ٹرانسوکسیانا، خراسان اور بغداد کے مالک تیمور نے ربیع اول میں حلب کو ناقابل بیان اعمال کے ساتھ لیا، پھر ربیع دوم میں دمشق کا رخ کیا اور درایا سے قطانہ تک ڈیرہ ڈالا، شہر کا چکر لگایا اور پہاڑوں کے نیچے قیدیوں کو روندتا رہا یہاں تک کہ قابل ذکر لوگ نکل آئے۔ اس نے ضیافت کی، لباس پہنایا اور ان کی عزت افزائی کی، حفاظت کا اعلان کیا، اور ایک سپاہی کو پھانسی پر لٹکا دیا جس نے سیڈ مارکیٹ کے اوپر بازار کو لوٹا — تو دروازے کھل گئے۔ وہ باب الصغیر سے داخل ہوئے اور اموی مسجد میں جمعہ کی نماز ادا کی، جہاں ان کے معتزلی امام عبد الجبار نے دمشق کے فقہاء سے علی کی جنگوں اور حسین کے قتل پر بحث کی تھی - 'اگر دمشق نے اسے منظور کیا تو وہ کافر ہیں، ورنہ باغی: پھر وہ کیسے کھڑے ہوں گے؟' قلعہ چالیس دن تک جاری رہا یہاں تک کہ لکڑی کے ایک ٹاور کو آگ کے تیروں سے جلا کر دوبارہ تعمیر کیا گیا۔ اس کے ہتھیار ڈالنے پر تیمور نے لوٹ مار، ذبح اور جلانے کا لائسنس یافتہ - عورتوں اور بچوں کو غلام بنایا، کئی دن تک اذیتیں دی گئیں، عمارتیں جلا دی گئیں یہاں تک کہ سب جل گئے، پھر وہ چلا گیا۔ 71-73}۔"
  tr: "Hicri 803 yılında (Miladi 1403), Timur Harezm, Transoksanya, Semerkant, Horasan, Herat, Taberistan, Cürcan, Tebriz, İsfahan, ardından Bağdat, Sivas ve Behesna'yı fethetti. Daha sonra Rebiü'l-Evvel ayında Halep'i kuşattı, ele geçirdi ve orada korkunç eylemler gerçekleştirdi. Ardından Rebiü'l-Sani ayında Şam'a yöneldi ve Darayya'dan Katana ve el-Havla'ya kadar Şam'ın eteklerinde kamp kurana kadar ilerledi. Daha sonra şehri kuşattı ve askerleri şehrin dışına yayılarak kaçakları yakaladı. Yakaladıkları kişileri sırtlanların ayaklarının altına attı, ta ki şehrin ileri gelenleri, içinde bulundukları zor durumdan bitkin düşerek güvenli bir geçiş için ona gelene kadar. Onları kabul etti, onlara yiyecek ikram etti, onur elbiseleri verdi ve onlara büyük saygı gösterdi. Şehrin her yerinde barış ve huzur dönemi ilan etti ve kimsenin başkasına zarar vermesini yasakladı. Tesadüfen askerlerinden biri çarşıda bir şeyler yağmaladı, bu yüzden onu Bazuriyyin çarşısının başında astı ve çarmıha gerdi. Bu haber Şam halkı arasında yayıldı ve şehir kapıları açıldı. Güvenli geçiş için onlardan aldığı para, Darü'l-Dhahab (Altın Ev) gelir kaynağı olmak üzere mahallelere dağıtıldı. Timur daha sonra Mescid-i Midan'daki Ablaq Sarayı'na yerleşti ve Babü'l-Sağri'den geçerek Emevi Camii'nde Cuma namazını kıldı. Hanefi kadı Mahmud ibn el-Keşk hutbe verdi ve namazı kıldırdı. Ardından imamı Abdül-Cebber ile Şam hukukçuları arasında bir tartışma yaşandı. Timur'un sözlerini tercüme ediyordu; Ali ibn Abi Talib'in Muaviye ile olan olayları ve Yezid ibn Muaviye'nin Hüseyin ile olan olayları da dahil olmak üzere, tüm bunların Şam halkının yardımıyla gerçekleştiğini söylüyordu. Eğer bunu caiz görürlerse kâfirdirler, görmezlerse isyankar ve itaatsizdirler. Bu insanlar o insanlarla nasıl kıyaslanabilir? Ona bazı cevaplar verdiler, bazılarını kabul etti, bazılarını reddetti. Bunun üzerine, kendisini yormuş olan kalenin kuşatmasını yoğunlaştırdı; kalede sadece birkaç kişi kalmıştı. Bu yüzden kaleyi birkaç kez kuşattı ve yerine büyük bir tahta kale inşa edilmesini emretti. Kaledekiler tahta kaleye ateş dolu bir ok attılar ve kale yerle bir oldu. Bunun üzerine başka bir kale inşa etti ve kırk gün sonra güvenlik garantisi karşılığında kaleyi ona teslim ettiler. Timur Şam kalesini ele geçirdiğinde, adamlarına yağmalama, talan etme, öldürme ve yakma izni verdi. Böylece şehre saldırdılar ve ellerinden gelen her şeyi bırakmadılar; halkına her türlü işkenceyi uyguladılar ve kadınları ve çocukları esir aldılar. Günlerce bu şekilde devam ettiler ve binaları yerle bir olana kadar ateşe verdiler, sonra da şehri terk ettiler. 71-73}"
  id: "Pada tahun 803 H (1403 M), Timur menaklukkan Khwarazm, Transoxiana, Samarkand, Khorasan, Herat, Tabaristan, Jurjan, Tabriz, Isfahan, kemudian Baghdad, Sivas, dan Behesna. Ia kemudian mengepung Aleppo pada bulan Rabi' al-Awwal, merebutnya, dan melakukan tindakan keji di sana. Ia kemudian menuju Damaskus pada bulan Rabi' al-Thani dan berbaris hingga berkemah di pinggiran Damaskus, dari Darayya hingga Qatana dan al-Hawla. Ia kemudian mengepung kota itu, dan pasukannya menyebar ke pinggiran kota, menangkap para buronan. Ia melemparkan orang-orang yang ditangkapnya ke kaki hyena hingga para tokoh penting kota, yang kelelahan karena penderitaan mereka, keluar kepadanya untuk mencari jalan keluar yang aman. Ia menerima mereka, menawarkan makanan, menganugerahi mereka jubah kehormatan, dan memperlakukan mereka dengan sangat hormat. Ia memproklamirkan masa damai dan ketenangan di seluruh kota, melarang siapa pun untuk menyakiti orang lain. Kebetulan, salah seorang tentaranya menjarah sesuatu di pasar, sehingga ia menggantung dan menyalibnya di depan pasar al-Bazuriyyin. Berita ini menyebar di antara penduduk Damaskus, dan mereka membuka gerbang kota. Uang yang telah ia kenakan untuk perjalanan aman dibagikan ke berbagai wilayah, dengan Dar al-Dhahab (Rumah Emas) sebagai sumber pendapatan. Timur kemudian menetap di Istana Ablaq di al-Midan (alun-alun) dan melintasi kota melalui Bab al-Saghir (gerbang kecil) hingga ia melaksanakan salat Jumat di Masjid Umayyah. Hakim Hanafi, Mahmud ibn al-Kashk, menyampaikan khutbah dan memimpin salat. Kemudian terjadi debat antara imamnya, Abd al-Jabbar, dan para ahli hukum Damaskus. Ia menerjemahkan ucapan Timur tentang berbagai hal, termasuk peristiwa Ali ibn Abi Talib dengan Muawiyah dan apa yang terjadi pada Yazid ibn Muawiyah dengan al-Husayn, dan bahwa semua itu terjadi dengan bantuan penduduk Damaskus. Jika mereka menganggapnya diperbolehkan, maka mereka adalah orang kafir, dan jika tidak, maka mereka adalah pemberontak dan durhaka. Bagaimana orang-orang ini dapat dibandingkan dengan orang-orang itu? Mereka menjawabnya dengan beberapa jawaban, sebagian di antaranya diterima dan sebagian lagi ditolak. Kemudian ia mengintensifkan pengepungan benteng, yang telah melelahkannya, dan hanya ada sedikit orang di dalamnya. Maka ia melakukan beberapa pengepungan dan memerintahkan agar benteng kayu besar dibangun untuknya. Orang-orang di benteng menembakkan panah berisi api ke benteng kayu itu, dan benteng itu terbakar habis. Maka ia membangun benteng lain, dan kemudian mereka menyerahkannya kepadanya setelah empat puluh hari dengan jaminan keamanan. Ketika Timur merebut benteng Damaskus, ia mengizinkan pasukannya untuk menjarah, merampok, membunuh, dan membakar. Maka mereka menyerbu kota itu dan tidak meninggalkan apa pun yang bisa mereka selamatkan, dan mereka menyiksa penduduknya dengan berbagai cara, dan mereka menawan perempuan dan anak-anak. Mereka terus melakukan hal ini selama berhari-hari, dan mereka membakar bangunan-bangunan sampai rata dengan tanah, lalu mereka meninggalkannya. 71-73}."
