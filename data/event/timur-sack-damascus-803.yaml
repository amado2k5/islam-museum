label: { ar: "كائنة تيمور بدمشق سنة 803هـ" }
summary:
  ar: "في سنة ثلاث وثمانمائة ملك تيمور خوارزم وما وراء النهر وسمرقند وخراسان وهراة وطبرستان وجرجان وتبريز وأصبهان ثم بغداد وسيواس وبهسنا ثم نازل حلب في ربيع الأول فملكها وفعل فيها الأفاعيل الشنيعة ثم تحول إلى دمشق في ربيع الآخر وسار حتى أناخ على ظاهر دمشق من داريا إلى قطنا والحولة ثم احتاط بالمدينة وانتشرت عساكره في ظواهرها تتخطف الهاربين وصار يلقي من ظفر به تحت أرجل القيلة حتى خرج إليه أعيان المدينة بعد أن أعياه أمرهم يطلبون منه الأمان فأجلسهم وقدم إليهم طعاماً وأخلع عليهم وأكرمهم ونادى في المدينة بالأمان والاطمئنان وألا يعتدي أحد على أحد فاتفق أن بعض عسكره نهب شيئاً من السوق فشنقه وصلبه برأس سوق البزوريين ففشا ذلك في الشاميين وفتحوا أبواب المدينة ووزعت الأموال التي فرضها عليهم لأجل الأمان على الحارات وجعلوا دار الذهب هي المستخرج ونزل تيمور بالقصر الأبلق من الميدان وعبر المدينة من باب الصغير حتى صلى الجمعة بجامع بني أمية وقدم القاضي الحنفي محمود بن الكشك للخطبة والصلاة ثم جرت مناظرة بين إمامه عبد الجبار وفقهاء دمشق وهو يترجم عن تيمور بأشياء منها وقائع علي بن أبي طالب مع معاوية وما وقع ليزيد بن معاوية مع الحسين وأن ذلك كله كان بمعاونة أهل دمشق له فإن كانوا استحلوه فهم كفار وإلا فهم عصاة بغاة وكيف هؤلاء على أولئك فأجابوه بأجوبة قبل بعضها ورد البعض ثم جد في حصار القلعة وقد أعياه أمرها ولم يكن بها إلا نفر يسير فضرب عليها عدة مناحيق وأمر فبنيت لها قلعة عظيمة من خشب فرمى من بالقلعة على القلعة الخشبية بسهم فيه نار فاحترقت عن آخرها فأنشأ قلعة أخرى ثم سلموها له بعد أربعين يوماً بالأمان ولما أخذ تيمور قلعة دمشق أباح لمن معه النهب والسلب والقتل والإحراق فهجموا المدينة ولم يدعوا بها شيئاً قدروا عليه وطرحوا على أهلها أنواع العذاب وسبوا النساء والأولاد ولا زالوا على ذلك أياماً وألقوا النار في المباني حتى احترقت بأسرها ورحل عنها {cite:shadharat-dhahab p. 71-73}."
  en: "In 803 Timur, master of Transoxiana, Khurasan and Baghdad, took Aleppo in Rabi' I with unspeakable deeds, then turned to Damascus in Rabi' II and encamped from Darayya to Qatana, ringed the city, and trod captives beneath the mounts until the notables came out pleading quarter; he feasted, robed and honoured them, proclaimed safety, and hanged a soldier who looted the bazaar atop the Seed-Market — so the gates opened. He entered through Bab al-Saghir and prayed Friday at the Umayyad mosque, where his Mu'tazili imam Abd al-Jabbar debated Damascus's jurists on Ali's wars and Husayn's killing — 'if the Damascenes sanctioned it they are unbelievers, else rebels: how then do they stand?' The Citadel held out forty days till a wooden siege-tower was burned by fire-arrows and rebuilt; on its surrender Timur licensed plunder, slaughter and burning — women and children enslaved, torments inflicted for days, the buildings torched until all burned, then he departed {cite:shadharat-dhahab p. 71-73}."
