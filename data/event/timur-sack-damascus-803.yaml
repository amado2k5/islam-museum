label: { ar: "كائنة تيمور بدمشق سنة 803هـ", en: "Timur's Event at Damascus in 803 AH", es: "El evento de Timur en Damasco en el año 803 AH", fr: "L'événement de Timour à Damas en 803 AH", ur: "تیمور کا واقعہ دمشق میں 803 ہجری میں" }
summary:
  ar: "في سنة ثلاث وثمانمائة ملك تيمور خوارزم وما وراء النهر وسمرقند وخراسان وهراة وطبرستان وجرجان وتبريز وأصبهان ثم بغداد وسيواس وبهسنا ثم نازل حلب في ربيع الأول فملكها وفعل فيها الأفاعيل الشنيعة ثم تحول إلى دمشق في ربيع الآخر وسار حتى أناخ على ظاهر دمشق من داريا إلى قطنا والحولة ثم احتاط بالمدينة وانتشرت عساكره في ظواهرها تتخطف الهاربين وصار يلقي من ظفر به تحت أرجل القيلة حتى خرج إليه أعيان المدينة بعد أن أعياه أمرهم يطلبون منه الأمان فأجلسهم وقدم إليهم طعاماً وأخلع عليهم وأكرمهم ونادى في المدينة بالأمان والاطمئنان وألا يعتدي أحد على أحد فاتفق أن بعض عسكره نهب شيئاً من السوق فشنقه وصلبه برأس سوق البزوريين ففشا ذلك في الشاميين وفتحوا أبواب المدينة ووزعت الأموال التي فرضها عليهم لأجل الأمان على الحارات وجعلوا دار الذهب هي المستخرج ونزل تيمور بالقصر الأبلق من الميدان وعبر المدينة من باب الصغير حتى صلى الجمعة بجامع بني أمية وقدم القاضي الحنفي محمود بن الكشك للخطبة والصلاة ثم جرت مناظرة بين إمامه عبد الجبار وفقهاء دمشق وهو يترجم عن تيمور بأشياء منها وقائع علي بن أبي طالب مع معاوية وما وقع ليزيد بن معاوية مع الحسين وأن ذلك كله كان بمعاونة أهل دمشق له فإن كانوا استحلوه فهم كفار وإلا فهم عصاة بغاة وكيف هؤلاء على أولئك فأجابوه بأجوبة قبل بعضها ورد البعض ثم جد في حصار القلعة وقد أعياه أمرها ولم يكن بها إلا نفر يسير فضرب عليها عدة مناحيق وأمر فبنيت لها قلعة عظيمة من خشب فرمى من بالقلعة على القلعة الخشبية بسهم فيه نار فاحترقت عن آخرها فأنشأ قلعة أخرى ثم سلموها له بعد أربعين يوماً بالأمان ولما أخذ تيمور قلعة دمشق أباح لمن معه النهب والسلب والقتل والإحراق فهجموا المدينة ولم يدعوا بها شيئاً قدروا عليه وطرحوا على أهلها أنواع العذاب وسبوا النساء والأولاد ولا زالوا على ذلك أياماً وألقوا النار في المباني حتى احترقت بأسرها ورحل عنها {cite:shadharat-dhahab p. 71-73}."
  en: "In 803 Timur, master of Transoxiana, Khurasan and Baghdad, took Aleppo in Rabi' I with unspeakable deeds, then turned to Damascus in Rabi' II and encamped from Darayya to Qatana, ringed the city, and trod captives beneath the mounts until the notables came out pleading quarter; he feasted, robed and honoured them, proclaimed safety, and hanged a soldier who looted the bazaar atop the Seed-Market — so the gates opened. He entered through Bab al-Saghir and prayed Friday at the Umayyad mosque, where his Mu'tazili imam Abd al-Jabbar debated Damascus's jurists on Ali's wars and Husayn's killing — 'if the Damascenes sanctioned it they are unbelievers, else rebels: how then do they stand?' The Citadel held out forty days till a wooden siege-tower was burned by fire-arrows and rebuilt; on its surrender Timur licensed plunder, slaughter and burning — women and children enslaved, torments inflicted for days, the buildings torched until all burned, then he departed {cite:shadharat-dhahab p. 71-73}."
  es: "En 803, Timur, señor de Transoxiana, Jorasán y Bagdad, tomó Alepo en Rabi' I con actos indescriptibles, luego se dirigió a Damasco en Rabi' II y acampó desde Darayya hasta Qatana, rodeó la ciudad y pisoteó a los cautivos bajo las montañas hasta que los notables salieron implorando clemencia; los agasajó, los vistió y honró, proclamó seguridad y ahorcó a un soldado que saqueó el bazar en la cima del Mercado de Semillas, por lo que las puertas se abrieron. Entró por Bab al-Saghir y rezó el viernes en la mezquita omeya, donde su imán mu'tazilí Abd al-Jabbar debatió con los juristas de Damasco sobre las guerras de Alí y el asesinato de Husayn: «Si los damascenos lo sancionaron, son infieles; de lo contrario, rebeldes: ¿cómo se sostienen entonces?». La Ciudadela resistió cuarenta días hasta que una torre de asedio de madera fue incendiada por flechas incendiarias y reconstruida; tras su rendición, Timur autorizó el saqueo, la matanza y la quema: mujeres y niños fueron esclavizados, se les infligieron tormentos durante días, los edificios fueron incendiados hasta que todo se quemó, y luego se marchó {cite:shadharat-dhahab p. 71-73}."
  fr: "En 803, Timour, maître de la Transoxiane, du Khorasan et de Bagdad, prit Alep au mois de Rabi' I par des actes innommables, puis se tourna vers Damas au mois de Rabi' II et campa de Darayya à Qatana, encerclant la ville et faisant piétiner les captifs au pied des montagnes jusqu'à ce que les notables sortent implorer sa clémence; il festoya, les revêtit d'habits et les honora, proclama la sécurité et fit pendre un soldat qui avait pillé le bazar au-dessus du marché aux semences – alors les portes s'ouvrirent. Il entra par Bab al-Saghir et pria le vendredi à la mosquée des Omeyyades, où son imam mu'tazilite, Abd al-Jabbar, débattait avec les juristes de Damas des guerres d'Ali et du meurtre de Hussein: « Si les Damascènes l'ont approuvé, ce sont des infidèles, sinon des rebelles: comment alors se maintiennent-ils ? » La citadelle tint quarante jours jusqu'à ce qu'une tour de siège en bois soit incendiée par des flèches enflammées et reconstruite; lors de sa reddition, Timour autorisa le pillage, le massacre et l'incendie — femmes et enfants réduits en esclavage, tourments infligés pendant des jours, les bâtiments incendiés jusqu'à ce que tout soit brûlé, puis il partit {cite:shadharat-dhahab p. 71-73}."
  ur: "803 میں ٹرانسوکسیانا، خراسان اور بغداد کے مالک تیمور نے ربیع اول میں حلب کو ناقابل بیان اعمال کے ساتھ لیا، پھر ربیع دوم میں دمشق کا رخ کیا اور درایا سے قطانہ تک ڈیرہ ڈالا، شہر کا چکر لگایا اور پہاڑوں کے نیچے قیدیوں کو روندتا رہا یہاں تک کہ قابل ذکر لوگ نکل آئے۔ اس نے ضیافت کی، لباس پہنایا اور ان کی عزت افزائی کی، حفاظت کا اعلان کیا، اور ایک سپاہی کو پھانسی پر لٹکا دیا جس نے سیڈ مارکیٹ کے اوپر بازار کو لوٹا — تو دروازے کھل گئے۔ وہ باب الصغیر سے داخل ہوئے اور اموی مسجد میں جمعہ کی نماز ادا کی، جہاں ان کے معتزلی امام عبد الجبار نے دمشق کے فقہاء سے علی کی جنگوں اور حسین کے قتل پر بحث کی تھی - 'اگر دمشق نے اسے منظور کیا تو وہ کافر ہیں، ورنہ باغی: پھر وہ کیسے کھڑے ہوں گے؟' قلعہ چالیس دن تک جاری رہا یہاں تک کہ لکڑی کے ایک ٹاور کو آگ کے تیروں سے جلا کر دوبارہ تعمیر کیا گیا۔ اس کے ہتھیار ڈالنے پر تیمور نے لوٹ مار، ذبح اور جلانے کا لائسنس یافتہ - عورتوں اور بچوں کو غلام بنایا، کئی دن تک اذیتیں دی گئیں، عمارتیں جلا دی گئیں یہاں تک کہ سب جل گئے، پھر وہ چلا گیا۔ 71-73}۔"
