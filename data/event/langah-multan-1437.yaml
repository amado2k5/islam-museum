label: { ar: "قيام سلطنة اللنكاه بالملتان ١٤٣٧م", en: "The Langah sultanate rises at Multan, 1437" }
summary:
  ar: "بعدما ضعفت قبضة السيديين على النواحي صارت الملتان مركز دولة اللنكاه التي حكمت من سنة ١٤٣٧م إلى ١٥٢٦م، وتصدت بجدارة لمحاولات اللوديين ضمّ الملتان إلى دولتهم {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  en: "As the Sayyids' grip on the area weakened, Multan became the centre of the Langah dynasty, which ruled from 1437 to 1526 and successfully defied Lodi attempts to incorporate Multan into their state {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  ur: "جب سیدوں کی گرفت اس علاقے پر کمزور ہوئی تو ملتان لنگاہ خاندان کا مرکز بن گیا، جس نے 1437ء سے 1526ء تک حکومت کی اور لودھیوں کی کوششوں کو — جن میں ملتان کو ان کی ریاست میں ملانا مقصود تھا — کامیابی سے روکا {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}۔"
