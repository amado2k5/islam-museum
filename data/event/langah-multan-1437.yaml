label: { ar: "قيام سلطنة اللنكاه بالملتان ١٤٣٧م", en: "The Langah sultanate rises at Multan, 1437", es: "El sultanato de Langah surge en Multan, 1437.", fr: "Le sultanat de Langah s'élève à Multan, 1437", ur: "1437 میں ملتان میں لانگاہ سلطنت کا عروج ہوا۔", tr: "1437 yılında Multan'da Lenkah Sultanlığı'nın kurulması", id: "Pendirian Kesultanan Lenkah di Multan pada tahun 1437 M." }
summary:
  ar: "بعدما ضعفت قبضة السيديين على النواحي صارت الملتان مركز دولة اللنكاه التي حكمت من سنة ١٤٣٧م إلى ١٥٢٦م، وتصدت بجدارة لمحاولات اللوديين ضمّ الملتان إلى دولتهم {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  en: "As the Sayyids' grip on the area weakened, Multan became the centre of the Langah dynasty, which ruled from 1437 to 1526 and successfully defied Lodi attempts to incorporate Multan into their state {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  ur: "جب سیدوں کی گرفت اس علاقے پر کمزور ہوئی تو ملتان لنگاہ خاندان کا مرکز بن گیا، جس نے 1437ء سے 1526ء تک حکومت کی اور لودھیوں کی کوششوں کو — جن میں ملتان کو ان کی ریاست میں ملانا مقصود تھا — کامیابی سے روکا {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}۔"
  es: "A medida que el control de los Sayyids sobre la zona se debilitaba, Multan se convirtió en el centro de la dinastía Langah, que gobernó desde 1437 hasta 1526 y desafió con éxito los intentos de los Lodi de incorporar Multan a su estado {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  fr: "Alors que l'emprise des Sayyids sur la région s'affaiblissait, Multan devint le centre de la dynastie Langah, qui régna de 1437 à 1526 et résista avec succès aux tentatives des Lodi d'incorporer Multan à leur État {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  tr: "Sidilerin bölgeler üzerindeki hakimiyeti zayıfladıktan sonra Multan, 1437'den 1526'ya kadar hüküm süren Langah devletinin merkezi haline geldi ve Lodilerin Multan'ı kendi devletlerine katma girişimlerine başarıyla direndi. {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}"
  id: "Setelah cengkeraman Sidi di wilayah tersebut melemah, Multan menjadi pusat negara Langah, yang memerintah dari tahun 1437 M hingga 1526 M, dan berhasil melawan upaya Lodi untuk mencaplok Multan ke negara mereka {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
