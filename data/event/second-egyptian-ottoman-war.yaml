summary:
  ar: "بطاقة أولية للحرب المصرية العثمانية الثانية من ١٨٣٩ إلى ١٨٤١م، حرب إبراهيم باشا الثانية التي انتهت بانسحابه من الشام بضغط الدول؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Second Egyptian–Ottoman War of 1839–1841, Ibrahim Pasha's second war ended by his withdrawal from Syria under the powers' pressure; its sources are not yet checked on the page."
  es: "Ficha de borrador para la Segunda Guerra Egipcio-Otomana de 1839-1841, la segunda guerra de Ibrahim Pasha que terminó con su retirada de Siria bajo la presión de las potencias; sus fuentes aún no han sido verificadas en la página."
  fr: "Fiche de convocation pour la seconde guerre égypto-ottomane de 1839-1841, la seconde guerre d'Ibrahim Pacha qui s'est terminée par son retrait de Syrie sous la pression des puissances; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1839-1841 کی دوسری مصری-عثمانی جنگ کے لیے ڈرافٹ کارڈ، ابراہیم پاشا کی دوسری جنگ طاقتوں کے دباؤ میں شام سے ان کے انخلاء سے ختم ہوئی۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1839-1841 yılları arasında gerçekleşen ve İbrahim Paşa'nın devletlerin baskısı altında Levant'tan çekilmesiyle sonuçlanan İkinci Mısır-Osmanlı Savaşı'na dair ön bir anlatım; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Perang Mesir-Ottoman Kedua dari tahun 1839 hingga 1841 M, Perang Kedua Ibrahim Pasha yang berakhir dengan penarikan dirinya dari Levant di bawah tekanan dari negara-negara; sumber-sumber di halaman ini belum ditinjau."
