id: event/aqsa-minbar-nur-al-din
class: event
kind: other
label:
  ar: "منبر نور الدين يُصنع للمسجد الأقصى"
  en: "Nur al-Din's minbar made for al-Aqsa"
  ur: "نور الدین کا منبر مسجدِ اقصیٰ کے لیے تیار"
  es: "El minbar de Nur al-Din hecho para al-Aqsa"
  fr: "Le minbar de Nour al-Din conçu pour al-Aqsa"
  tr: "Mescid-i Aksa için Nur el-Din minberi yapılıyor."
  id: "Mimbar Nur al-Din sedang dibuat untuk Masjid Al-Aqsa."
summary:
  ar: "أمر نور الدين محمود بن زنكي بصنع منبر للمدينة المقدسة التي كان يأمل استردادها، فصُنع سنة 1169م وهو تحفة النجارة الشامية؛ وجلبه صلاح الدين إلى الأقصى حين أعاد المسجد إلى الإسلام سنة 1187م، وبقي فيه حتى أتت عليه يد مُحرق سنة 1969م قبل أن يُدرس كما ينبغي {cite:encyclopaedia-of-islam-2 vol. 6 p. 735}."
  en: "Nur al-Din Mahmud ibn Zangi ordered a minbar made in 1169 for the Holy City he hoped to regain; it was a masterpiece of Syrian woodwork. Saladin brought it into the Aqsa when he reconsecrated the mosque in 1187, and it stood there until an arsonist destroyed it in 1969, before it could be fully studied {cite:encyclopaedia-of-islam-2 vol. 6 p. 735}."
  ur: "نور الدین محمود زنگی نے 1169ء میں اس مقدس شہر کے لیے ایک منبر بنوایا جس کی واپسی کی وہ امید رکھتا تھا؛ یہ شامی نقاشی کا شاہکار تھا۔ صلاح الدین نے 1187ء میں مسجد کی تقدیس بحال کرتے ہوئے اسے مسجدِ اقصیٰ میں نصب کیا اور وہ وہاں 1969ء تک رہا جب ایک آتش زن نے اسے تباہ کر دیا {cite:encyclopaedia-of-islam-2 vol. 6 p. 735}."
  es: "Nur al-Din Mahmud ibn Zangi encargó la construcción de un minbar en 1169 para la Ciudad Santa que esperaba recuperar; fue una obra maestra de la ebanistería siria. Saladino lo llevó a Al-Aqsa cuando reconsagró la mezquita en 1187, y permaneció allí hasta que un pirómano lo destruyó en 1969, antes de que pudiera ser estudiado en su totalidad {cite:encyclopaedia-of-islam-2 vol. 6 p. 735}."
  fr: "Nur al-Din Mahmud ibn Zangi commanda en 1169 un minbar pour la Ville sainte qu'il espérait reconquérir; il s'agissait d'un chef-d'œuvre de l'ébénisterie syrienne. Saladin le fit transporter dans la mosquée Al-Aqsa lors de sa reconsécration en 1187, et il y demeura jusqu'à sa destruction par un incendiaire en 1969, avant qu'il n'ait pu être étudié en détail (voir: Encyclopaedia of Islam, vol. 6, p. 735)."
  tr: "Nur ed-Din Mahmud ibn Zengi, geri almayı umduğu kutsal şehir için bir minber yaptırdı. 1169 yılında yapılan minber, Levant marangozluğunun bir başyapıtıdır. Selahaddin, 1187 yılında camiyi İslam'a geri kazandırdığında minberi Mescid-i Aksa'ya getirdi ve 1969 yılında bir kundakçı tarafından tahrip edilene kadar orada kaldı. {cite:encyclopaedia-of-islam-2 vol. 6 p. 735}"
  id: "Nur ad-Din Mahmud ibn Zangi memerintahkan pembuatan mimbar untuk kota suci, yang ia harapkan dapat direbut kembali. Mimbar itu dibuat pada tahun 1169 M dan merupakan mahakarya pertukangan kayu Levant. Saladin membawanya ke Al-Aqsa ketika ia memulihkan masjid tersebut ke dalam Islam pada tahun 1187 M, dan mimbar itu tetap berada di sana hingga dihancurkan oleh seorang pembakar pada tahun 1969 M sebelum dapat dipelajari dengan saksama. {cite:encyclopaedia-of-islam-2 vol. 6 p. 735}."
