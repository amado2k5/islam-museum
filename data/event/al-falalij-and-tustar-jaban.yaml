id: event/al-falalij-and-tustar-jaban
class: event
kind: skirmish
label: { ar: "مسير الفلاليج وطلب جابان بمستر", en: "The March of al-Falalij and the Pursuit of Jaban at Tustar", es: "La marcha de al-Falalij y la persecución de Jaban en Tustar", fr: "La marche d'al-Falalij et la poursuite de Jaban à Tustar", ur: "الفلج کا مارچ اور تستار میں جبان کا تعاقب" }
summary:
  ar: "عند البلاذري: أتى خالد الفلاليج منصرفه من بانقيا وبها جمع للعجم فتفرقوا ولم يلق كيداً فرجع إلى الحيرة فبلغه أن جابان في جمع عظيم بمستر فوجّه إليه المثنى بن حارثة الشيباني وحنظلة بن الربيع بن رباح الأسدي من بني تميم وهو الذي يقال له حنظلة الكاتب فلما انتهيا إليه هرب."
  en: "In al-Baladhuri: Khalid came to al-Falalij on his return from Baniqya — a Persian host there dispersed and he met no harm — then returned to al-Hira; hearing Jaban was at Tustar in a great host he sent against him al-Muthanna ibn Haritha al-Shaybani and Hanzala ibn al-Rabi' ibn Rabah al-Asadi of Banu Tamim — called Hanzala the Scribe — and when they reached him he fled."
  es: "En al-Baladhuri: Khalid llegó a al-Falalij a su regreso de Baniqya —un ejército persa se dispersó allí y no sufrió daño alguno— luego regresó a al-Hira; al enterarse de que Jaban estaba en Tustar con un gran ejército, envió contra él a al-Muthanna ibn Haritha al-Shaybani y a Hanzala ibn al-Rabi' ibn Rabah al-Asadi de Banu Tamim —llamado Hanzala el Escriba— y cuando llegaron a él, huyó."
  fr: "Dans al-Baladhuri: Khalid arriva à al-Falalij à son retour de Baniqya — une armée perse s'y dispersa et il ne subit aucun dommage — puis retourna à al-Hira; apprenant que Jaban se trouvait à Tustar avec une grande armée, il envoya contre lui al-Muthanna ibn Haritha al-Shaybani et Hanzala ibn al-Rabi' ibn Rabah al-Asadi de Banu Tamim — appelé Hanzala le Scribe — et lorsqu'ils l'atteignirent, il s'enfuit."
  ur: "البلادوری میں ہے: خالد بنیقیہ سے واپسی پر الفلج آیا - وہاں ایک فارسی میزبان منتشر ہو گیا اور اسے کوئی نقصان نہیں پہنچا - پھر الحیرہ واپس آیا۔ جبان کو یہ سن کر کہ وہ تستر میں تھے ایک عظیم لشکر کے ساتھ اس نے اس کے خلاف المثنیٰ بن حارثہ الشیبانی اور بنو تمیم کے حنظلہ بن الربیع بن رباح الاسدی کو بھیجا جنہیں حنظلہ کاتب کہا جاتا ہے اور جب وہ اس کے پاس پہنچے تو وہ بھاگ گئے۔"
