  ar: "عند البلاذري: أتى خالد الفلاليج منصرفه من بانقيا وبها جمع للعجم فتفرقوا ولم يلق كيداً فرجع إلى الحيرة فبلغه أن جابان في جمع عظيم بمستر فوجّه إليه المثنى بن حارثة الشيباني وحنظلة بن الربيع بن رباح الأسدي من بني تميم وهو الذي يقال له حنظلة الكاتب فلما انتهيا إليه هرب."
  en: "In al-Baladhuri: Khalid came to al-Falalij on his return from Baniqya — a Persian host there dispersed and he met no harm — then returned to al-Hira; hearing Jaban was at Tustar in a great host he sent against him al-Muthanna ibn Haritha al-Shaybani and Hanzala ibn al-Rabi' ibn Rabah al-Asadi of Banu Tamim — called Hanzala the Scribe — and when they reached him he fled."
