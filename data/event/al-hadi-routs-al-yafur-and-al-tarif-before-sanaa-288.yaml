id: event/al-hadi-routs-al-yafur-and-al-tarif-before-sanaa-288
class: event
kind: other
label:
  ar: "الهادي يهزم آل يعفر وآل طريف قرب صنعاء، سنة 288هـ"
  en: "Al-Hadi routs Al Ya'fur and Al Tarif before Sana'a, 288 AH"
  ur: "ہادی صنعاء کے قریب آل یعفر اور آل طریف کو شکست دیتے ہیں، 288ھ"
summary:
  ar: "خرج الهادي قاصداً صنعاء، فخرج آل يعفر وآل طريف من صنعاء وشبام وظهر في جيش عظيم، وكان عسكره بحسب الراوي نحو خمسمائة أو ستمائة راجل وأقل من مائة فارس وعسكرهم نحو خمسمائة فارس وألفي راجل، فعبأ عسكره وحمل بنفسه، فقتل صاحب علمهم وانهزموا إلى موضع يقال له المروة وغنم أصحابه سلاحاً وثياباً."
  en: "Al-Hadi set out for Sana'a and Al Ya'fur and Al Tarif came out from Sana'a, Shibam and Zahr in a great army; the narrator puts his force at about five or six hundred foot and under a hundred horse, and theirs at about five hundred horse and two thousand foot; he drew up his army and charged himself, their standard-bearer was killed and they fled to a place called al-Marwa, and his men took weapons, clothes and spoils."
  ur: "ہادی صنعاء کے ارادے سے نکلے تو آل یعفر اور آل طریف صنعاء، شبام اور ظہر سے ایک بڑے لشکر میں نکلے؛ راوی کے مطابق ان کا لشکر قریباً پانچ یا چھ سو پیادے اور سو سے کم سوار تھا اور ان کا قریباً پانچ سو سوار اور دو ہزار پیادے؛ انہوں نے لشکر کی صف بندی کی اور خود حملہ کیا، ان کا علم بردار مارا گیا اور وہ المروۃ نامی جگہ تک بھاگے، اور ان کے ساتھیوں کو ہتھیار، کپڑے اور مال غنیمت ملا۔"
