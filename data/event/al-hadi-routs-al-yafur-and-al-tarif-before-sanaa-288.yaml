id: event/al-hadi-routs-al-yafur-and-al-tarif-before-sanaa-288
class: event
kind: other
label:
  ar: "الهادي يهزم آل يعفر وآل طريف قرب صنعاء، سنة 288هـ"
  en: "Al-Hadi routs Al Ya'fur and Al Tarif before Sana'a, 288 AH"
  ur: "ہادی صنعاء کے قریب آل یعفر اور آل طریف کو شکست دیتے ہیں، 288ھ"
  es: "Al-Hadi derrota a Al Ya'fur y Al Tarif antes de Sana'a, 288 AH"
  fr: "Al-Hadi met en déroute Al Ya'fur et Al Tarif avant Sana'a, 288 AH"
  tr: "El-Hadi, Hicri 288 yılında Sana'a yakınlarında Ya'fur ve Tarif kabilelerini mağlup etti."
  id: "Al-Hadi mengalahkan klan Ya'fur dan Tarif di dekat Sana'a, pada tahun 288 Hijriah."
summary:
  ar: "خرج الهادي قاصداً صنعاء، فخرج آل يعفر وآل طريف من صنعاء وشبام وظهر في جيش عظيم، وكان عسكره بحسب الراوي نحو خمسمائة أو ستمائة راجل وأقل من مائة فارس وعسكرهم نحو خمسمائة فارس وألفي راجل، فعبأ عسكره وحمل بنفسه، فقتل صاحب علمهم وانهزموا إلى موضع يقال له المروة وغنم أصحابه سلاحاً وثياباً."
  en: "Al-Hadi set out for Sana'a and Al Ya'fur and Al Tarif came out from Sana'a, Shibam and Zahr in a great army; the narrator puts his force at about five or six hundred foot and under a hundred horse, and theirs at about five hundred horse and two thousand foot; he drew up his army and charged himself, their standard-bearer was killed and they fled to a place called al-Marwa, and his men took weapons, clothes and spoils."
  ur: "ہادی صنعاء کے ارادے سے نکلے تو آل یعفر اور آل طریف صنعاء، شبام اور ظہر سے ایک بڑے لشکر میں نکلے؛ راوی کے مطابق ان کا لشکر قریباً پانچ یا چھ سو پیادے اور سو سے کم سوار تھا اور ان کا قریباً پانچ سو سوار اور دو ہزار پیادے؛ انہوں نے لشکر کی صف بندی کی اور خود حملہ کیا، ان کا علم بردار مارا گیا اور وہ المروۃ نامی جگہ تک بھاگے، اور ان کے ساتھیوں کو ہتھیار، کپڑے اور مال غنیمت ملا۔"
  es: "Al-Hadi partió hacia Sana'a y Al Ya'fur y Al Tarif salieron de Sana'a, Shibam y Zahr en un gran ejército; el narrador calcula que su fuerza era de unos quinientos o seiscientos infantes y menos de cien jinetes, y la de ellos de unos quinientos jinetes y dos mil infantes; él formó su ejército y cargó, su portaestandarte fue asesinado y huyeron a un lugar llamado al-Marwa, y sus hombres tomaron armas, ropas y botín."
  fr: "Al-Hadi partit pour Sanaa, et Al Ya'fur et Al Tarif sortirent de Sanaa, Shibam et Zahr à la tête d'une grande armée; le narrateur estime ses forces à environ cinq ou six cents fantassins et une centaine de cavaliers, tandis que les leurs comptaient environ cinq cents cavaliers et deux mille fantassins; il déploya son armée et chargea, leur porte-étendard fut tué et ils s'enfuirent vers un lieu appelé al-Marwa, et ses hommes prirent des armes, des vêtements et du butin."
  tr: "El-Hadi Sana'a'ya doğru yola çıktı, bunun üzerine Ya'fur ve Tarif aileleri Sana'a ve Şibam'ı terk ederek büyük bir orduyla ortaya çıktılar. Anlatıcıya göre, onun ordusu yaklaşık beş yüz veya altı yüz piyade ve yüzden az süvariden oluşurken, onların ordusu yaklaşık beş yüz süvari ve iki bin piyadeden oluşuyordu. Ordusunu topladı ve hücuma geçti, sancaktarlarını öldürdü ve onları El-Marve denilen bir yere kadar yenilgiye uğrattı; arkadaşları da silah ve giysileri ele geçirdi."
  id: "Al-Hadi berangkat ke Sana'a, sehingga keluarga Ya'fur dan Tarif meninggalkan Sana'a dan Shibam dan muncul dengan pasukan besar. Menurut perawi, pasukannya terdiri dari sekitar lima ratus atau enam ratus prajurit infanteri dan kurang dari seratus penunggang kuda, sedangkan pasukan mereka terdiri dari sekitar lima ratus penunggang kuda dan dua ribu prajurit infanteri. Dia mengumpulkan pasukannya dan menyerang sendiri, membunuh pembawa panji mereka, dan mereka dikalahkan di tempat yang disebut Al-Marwa, dan para pengikutnya merebut senjata dan pakaian."
