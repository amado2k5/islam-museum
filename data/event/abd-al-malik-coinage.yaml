id: event/abd-al-malik-coinage
education:
  did_you_know:
    ar: "كانت دنانير هرقل ودراهم الفرس ترد على أهل مكة في الجاهلية، وكانوا يتبايعون عليها تبراً ويعرفون المثقال؛ ثم جاءت ضربة عبد الملك بن مروان للدينار الإسلامي."
    en: "Heraclius's dinars and the Persians' baghli dirhams already reached Meccan trade in the Jahiliyya, exchanged as bullion by a known mithqal weight — until Abd al-Malik ibn Marwan struck the Islamic dinar."
    ur: "جاہلیت میں ہرقل کے دینار اور فارس کے بغلی درہم مکہ کی تجارت میں آتے تھے، جنہیں لوگ مثقال کے وزن سے خالص سمجھ کر بیچتے تھے — پھر عبدالملک بن مروان نے اسلامی دینار ڈھالا۔"
    sources: [source/futuh-buldan-maarif-1407, source/tarikh-ibn-khaldun-ibar]
class: event
kind: other
label: { ar: "توحيد النقود في عهد عبد الملك", en: "Abd al-Malik's Coinage Reform", fr: "La réforme monétaire d’Abd al-Malik", es: "La reforma monetaria de Abd al-Malik", ur: "عبد الملک کی سکوں کی اصلاح", tr: "Abdülmalik döneminde para birimlerinin birleştirilmesi", id: "Penyatuan mata uang pada masa pemerintahan Abd al-Malik" }
summary:
  ar: "كانت دنانير هرقل ترد على أهل مكة في الجاهلية وترد عليهم دراهم الفرس البغلية فكانوا لا يتبايعون إلا على أنها تبر وكان المثقال عندهم معروف الوزن وزنه اثنان وعشرون قيراطاً إلا كسراً ووزن العشرة دراهم سبعة مثاقيل وكان الرطل اثنتي عشرة أوقية وكل أوقية أربعون درهماً فأقر رسول الله ذلك وأقره أبو بكر وعمر وعثمان وعلي فكان معاوية فأقر ذلك على حاله ثم ضرب مصعب بن الزبير في أيام عبد الله بن الزبير دراهم قليلة كسرت بعد فلما ولي عبد الملك بن مروان سأل وفحص عن أمر الدراهم والدنانير فكتب إلى الحجاج بن يوسف أن يضرب الدراهم على خمسة عشر قيراطاً من قراريط الدنانير وضرب هو الدنانير الدمشقية فقدمت على المدينة وبها نفر من أصحاب رسول الله وغيرهم من التابعين فلم ينكروا ذلك وقال الحسن بن صالح كانت الدراهم من ضرب الأعاجم مختلفة كباراً وصغاراً مثقالاً واثني عشر قيراطاً وعشرة قراريط فلما جاء الإسلام واحتيج في أداء الزكاة إلى الأمر الوسط جمعوها فوجدوها اثنين وأربعين قيراطاً فضربوا على وزن الثلث وهو أربعة عشر قيراطاً فوزن الدرهم العربي أربعة عشر قيراطاً فصار وزن كل عشرة دراهم سبع مثاقيل وكانت لقريش أوزان في الجاهلية يزنون الفضة بوزن يسميه درهماً والذهب بوزن يسميه ديناراً فكل عشرة من أوزان الدراهم سبعة أوزان الدنانير وكان لهم وزن الشعيرة وهو واحد الستين من وزن الدرهم والأوقية وزن أربعين درهماً والنش وزن عشرين درهماً والنواة وزن خمسة دراهم فلما قدم النبي مكة أقرهم على ذلك وقال سعيد بن المسيب لما سئل من أول من ضرب الدنانير المنقوشة عبد الملك بن مروان وكانت الدنانير ترد رومية والدراهم كسروية وحميرية قليلة. وعند السيوطي أن عبد الملك أول من كتب في صدور الطوامير قل هو الله أحد وذكر النبي مع التاريخ، فكتب ملك الروم إنكم قد أحدثتم في طواميركم شيئاً من ذكر نبيكم فاتركوه وإلا أتاكم من دنانيرنا ذكر ما تكرهون، فعظم ذلك على عبد الملك فشاور خالد بن يزيد بن معاوية فقال حرم دنانيرهم واضرب للناس سككاً فيها ذكر الله وذكر رسوله، فضرب الدنانير سنة خمس وسبعين وكتب عليها قل هو الله أحد وفي الوجه الآخر لا إله إلا الله وطوقه بطوق فضة فيه ضرب بمدينة كذا وخارج الطوق محمد رسول الله أرسله بالهدى ودين الحق {cite:tarikh-khulafa-minhaj-1434 p. 358-359}. ويذكر الكتاب أن عبد الملك عرّب النقد تعريباً نهائياً وأحدث دور الضرب تحت إشراف الخلافة، ويروي أن ملك الروم هدّد بطبع عبارات قادحة في النبي على الدنانير، فعزم على ضرب سكة في بلاده، وأن الدينار وُزن بنحو اثنين وعشرين قيراطاً والدرهم بخمسة عشر قيراطاً، وأن التواريخ على النقود كانت بالتاريخ الهجري. {cite:salabi-umayyad-state-2020 p.17-19}"
  en: "Heraclius's dinars and the Persian Baghliyya dirhams reached Jahiliya Mecca and traded only as bullion: their mithqal twenty-two qirats less a fraction, ten dirhams seven mithqals, the ratl twelve uqiyyas of forty dirhams — weights the Prophet confirmed, and Abu Bakr, Umar, Uthman, Ali, and Mu'awiya after him. Mus'ab ibn al-Zubayr struck a few dirhams under Ibn al-Zubayr, later broken; then Abd al-Malik asked and tested, wrote al-Hajjaj to strike dirhams at fifteen qirats of the dinar-qirats, and struck the Damascene dinars — which came to Medina with Companions and Followers there and none objected. Al-Hasan ibn Salih: the Ajam dirhams ran great and small — twenty, twelve, ten qirats — and when Islam needed the mean for zakah they summed forty-two and struck the third, fourteen qirats, so ten Arab dirhams weigh seven mithqals. Quraysh's weights: the dirham for silver, the dinar for gold, ten dirham-weights to seven dinar-weights, the sha'ira a sixtieth of a dirham, the uqiyya forty dirhams, the nashsh twenty, the nawa five — all confirmed when the Prophet entered Mecca. And Sa'id ibn al-Musayyab, asked who first struck engraved dinars, said 'Abd al-Malik ibn Marwan — dinars came Byzantine, dirhams Kisrawi and few Himyari'."
  fr: "Les dinars d’Héraclius et les dirhams perses baghliyya parvenaient à La Mecque préislamique et ne s’échangeaient qu’au poids du métal : leur mithqal valait vingt-deux qirats moins une fraction, dix dirhams valaient sept mithqals, et le ratl douze uqiyyas de quarante dirhams — poids confirmés par le Prophète, puis par Abu Bakr, Umar, Uthman, Ali et Mu'awiya. Mus'ab ibn al-Zubayr frappa sous Ibn al-Zubayr quelques dirhams, brisés par la suite ; Abd al-Malik s’informa ensuite et procéda à des essais, écrivit à al-Hajjaj de frapper des dirhams à quinze qirats du dinar et frappa les dinars damascènes ; ils parvinrent à Médine, où se trouvaient des Compagnons et des Successeurs, sans susciter d’objection. Al-Hasan ibn Salih : les dirhams des non-Arabes étaient grands et petits — vingt, douze ou dix qirats — et, lorsque l’islam eut besoin d’une moyenne pour la zakat, on additionna ces valeurs, soit quarante-deux, et l’on en frappa le tiers, quatorze qirats, si bien que dix dirhams arabes pèsent sept mithqals. Poids des Quraysh : le dirham pour l’argent, le dinar pour l’or, dix poids-dirhams pour sept poids-dinars, la sha'ira un soixantième de dirham, l’uqiyya quarante dirhams, le nashsh vingt, la nawa cinq — tous confirmés à l’entrée du Prophète à La Mecque. Interrogé sur le premier à frapper des dinars gravés, Sa'id ibn al-Musayyab répondit : « Abd al-Malik ibn Marwan — les dinars étaient byzantins, les dirhams sassanides et, pour quelques-uns, himyarites »."
  es: "Los dinares de Heraclio y los dirhams persas de Baghliyya llegaron a La Meca de la época preislámica y se comerciaban únicamente como metales preciosos: su mithqal veintidós qirats menos una fracción, diez dirhams siete mithqales, el ratl doce uqiyyas de cuarenta dirhams —pesos que el Profeta confirmó, y Abu Bakr, Umar, Uthman, Ali y Mu'awiya después de él. Mus'ab ibn al-Zubayr acuñó algunos dirhams bajo la dirección de Ibn al-Zubayr, que luego se rompieron; luego Abd al-Malik preguntó y probó, escribió a al-Hajjaj para acuñar dirhams a quince qirats de los dinar-qirats, y acuñó los dinares de Damasco, que llegaron a Medina con los Compañeros y Seguidores allí y nadie objetó. Al-Hasan ibn Salih: los dirhams de Ajam variaban en unidades grandes y pequeñas —veinte, doce, diez qirats— y cuando el Islam necesitaba el promedio para el zakat, sumaban cuarenta y dos y acuñaban el tercero, catorce qirats, por lo que diez dirhams árabes pesaban siete mithqals. Los pesos de los Quraysh: el dirham para la plata, el dinar para el oro, pesos de diez dirhams a siete dinares, el sha'ira un sexagésimo de dirham, el uqiyya cuarenta dirhams, el nashsh veinte, el nawa cinco —todos confirmados cuando el Profeta entró en La Meca. Y Sa'id ibn al-Musayyab, al ser preguntado sobre quién acuñó por primera vez dinares grabados, dijo: 'Abd al-Malik ibn Marwan —los dinares llegaron bizantinos, los dirhams kisrawi y algunos himyari'."
  ur: "ہرقل کے دینار اور فارسی بگلیہ درہم جاہلیہ مکہ پہنچے اور صرف بلین کے طور پر تجارت کی: ان کا مثقال بائیس قیراط کم ایک حصہ، دس درہم سات مثقال، رتل بارہ اوقیہ چالیس درہم - حضرت ابوبکر صدیق اور حضرت عمر نے اس کی تصدیق کے بعد وزن کیا، اسے مصعب ابن الزبیر نے ابن الزبیر کے ماتحت چند درہم مارے، بعد میں ٹوٹ گئے۔ پھر عبد الملک نے پوچھا اور آزمایا، حجاج کو پندرہ قیراط دینار قیراط پر درہم مارنے کے لیے لکھا، اور دمشقی دینار مارے - جو صحابہ و تابعین کے ساتھ مدینہ آئے اور وہاں کسی نے اعتراض نہ کیا۔ الحسن بن صالح: عجم درہم بڑے اور چھوٹے - بیس، بارہ، دس قیراط - چلتے تھے اور جب اسلام کو زکوٰۃ کے لیے وسیلہ کی ضرورت تھی تو انہوں نے بیالیس کو جمع کیا اور تیسرا، چودہ قیراط مارا، اس طرح دس عرب درہم کا وزن سات مثقال ہے۔ قریش کے تول: درہم چاندی کے بدلے، سونے کے بدلے دینار، دس درہم وزن سے سات دینار، شعائر ایک درہم کا ساٹھواں، اوقیہ چالیس درہم، بیس ناش، نوا پانچ - سب نے نبی کے مکہ میں داخل ہونے کی تصدیق کی تھی۔ اور سعید بن المسیب نے پوچھا کہ سب سے پہلے کندہ شدہ دینار کس نے مارے تو کہا کہ عبد الملک بن مروان - دینار بازنطینی، درہم کسروی اور چند حمیری آئے۔"
  tr: "Heraklius'un dinarları, İslam öncesi dönemde Fars dirhemleriyle birlikte Mekke halkına iade edildi. Bunlar sadece altın para oldukları varsayımıyla ticaret yapıyorlardı. Mithkal, yirmi iki karattan bir kesir çıkarılarak elde edilen bilinen bir ağırlıktı ve on dirhem yedi mithkal ağırlığındaydı. Ratl on iki ukiya idi ve her ukiya kırk dirhemdi. Allah'ın Resulü, Ebu Bekir, Ömer, Osman ve Ali bunu onayladı. Muaviye de olduğu gibi onayladı. Daha sonra, Abdullah ibn el-Zübeyr zamanında, Musab ibn el-Zübeyr az sayıda dirhem bastırdı, bunlar daha sonra bozuldu. Abdülmalik ibn Mervan halife olduğunda, dirhem ve dinar meselesini araştırdı ve dinarların ağırlığına göre on beş karat dirhem bastırması için el-Haccac ibn Yusuf'a yazdı. Kendisi, Medine'ye gelen Şam dinarlarını bastırdı. Orada Allah Resulü'nün bazı Sahabeleri ve diğer takipçileri vardı ve buna itiraz etmediler. Hasan ibn Salih şöyle dedi: Arap olmayanların bastırdığı dirhemler büyüklük bakımından farklılık gösteriyordu; bazıları miskal, bazıları on iki karat, bazıları da on karattı. İslam geldiğinde, zekât ödeme ihtiyacı doğdu... Zekât ortada toplandı ve kırk iki karat olduğu bulundu. Bunun üzerine, üçte birinin ağırlığı olan on dört karat ağırlığında bastılar. Böylece Arap dirheminin ağırlığı on dört karat oldu. Dolayısıyla her on dirhemin ağırlığı yedi miskal oldu. Kureyş'in İslam öncesi dönemde de ağırlıkları vardı. Gümüşü dirhem dedikleri bir ağırlıkla, altını da dinar dedikleri bir ağırlıkla tartıyorlardı. Dolayısıyla her on dirhemin ağırlığı yedi dinar ağırlığına denk geliyordu. Ve arpa tanesinin ağırlığı, dirhemin ağırlığının altmışta biri, bir ons kırk dirhem, bir ilahi yirmi dirhem ve hurma çekirdeği beş dirhem ağırlığındaydı. Peygamber Mekke'ye geldiğinde, bunları onayladı. Said bin el-Musayyab, üzerine kazınmış dinarları ilk kimin bastığı sorulduğunda, Abdül Malik bin Mervan olduğunu söyledi. Dinarlar Roma dönemine aitti, dirhemler ise Sasani ve Himyar dönemine aitti, sayıları azdı. El-Suyuti'ye göre, Abdül Malik, tomarların ön yüzlerine \"De ki: O, Allah'tır, birdir\" yazıp, Peygamber'i hurma ile birlikte anan ilk kişiydi. Bunun üzerine Roma kralı, \"Tomarlarınıza Peygamberinizi anlatan bir şey eklediniz, bırakın onu, aksi takdirde bizim dinarlarımızdan hoşlanmadığınız şeyler de alacaksınız\" diye yazdı. Bu durum Abdülmalik'i çok üzdü, bu yüzden Halid ibn Yezid ibn Muaviye'ye danıştı. Halid ibn Yezid ibn Muaviye, \"Onların dinarlarını yasakla ve halk için üzerinde Allah'ın ve Resulünün adı yazılı paralar bastır\" dedi. Böylece 75. yılda dinarlar basıldı ve üzerlerinde \"De ki: O, Allah'tır, birdir\" ve diğer tarafında \"Allah'tan başka ilah yoktur\" yazılıydı. Ayrıca, \"Şu ve şu şehirde basılmıştır\" yazılı gümüş bir halka ile çevriliydiler ve halkanın dışında \"Muhammed, Allah'ın hidayet ve hak din ile gönderdiği Resulüdür\" yazıyordu. {kaynak:tarikh-khulafa-minhaj-1434 s. 358-359}. Kitap, Abdülmalik'in para birimini tamamen Araplaştırdığını ve Halifeliğin gözetimi altında darphaneler kurduğunu belirtiyor. Bizans imparatorunun dinarlara Peygamber aleyhinde hakaret içeren ifadeler basmakla tehdit ettiğini, bu yüzden kendi topraklarında kendi parasını basmaya karar verdiğini anlatıyor. Dinar yaklaşık yirmi iki karat, dirhem ise on beş karat ağırlığındaydı ve sikkeler üzerindeki tarihler Hicri takvime göreydi. {cite:salabi-umayyad-state-2020 s.17-19}"
  id: "Dinar Heraclius dikembalikan kepada penduduk Mekah pada era pra-Islam, bersama dengan dirham Persia. Mereka hanya berdagang dengan dasar bahwa koin-koin tersebut adalah koin emas. Mithqal adalah satuan berat yang diketahui, setara dengan dua puluh dua karat dikurangi sebagian kecil, dan sepuluh dirham memiliki berat tujuh mithqal. Ratl adalah dua belas uqiya, dan setiap uqiya bernilai empat puluh dirham. Rasulullah SAW menyetujui hal ini, begitu pula Abu Bakar, Umar, Utsman, dan Ali. Muawiyah juga menyetujuinya sebagaimana adanya. Kemudian, pada masa Abdullah ibn al-Zubayr, Mus'ab ibn al-Zubayr mencetak sejumlah kecil dirham, yang kemudian dipecah. Ketika Abd al-Malik ibn Marwan menjadi khalifah, beliau menanyakan tentang masalah dirham dan dinar dan menulis surat kepada al-Hajjaj ibn Yusuf untuk mencetak dirham dengan berat lima belas karat, berdasarkan berat dinar. Beliau sendiri mencetak dinar Damaskus, yang tiba di Madinah. Ada beberapa Sahabat Rasulullah dan pengikut lainnya di sana, dan mereka tidak keberatan dengan hal ini. Al-Hasan ibn Salih berkata: Dirham yang dicetak oleh non-Arab bervariasi ukurannya, ada yang mithqal, dua belas karat, dan sepuluh karat. Ketika Islam datang, timbul kebutuhan untuk membayar... Zakat dikumpulkan di tengah dan mereka mendapati beratnya empat puluh dua karat. Maka mereka mencetaknya dengan berat sepertiga, yaitu empat belas karat. Jadi berat dirham Arab adalah empat belas karat. Maka berat setiap sepuluh dirham menjadi tujuh mithqal. Dan kaum Quraisy memiliki timbangan pada era pra-Islam. Mereka menimbang perak dengan satuan berat yang mereka sebut dirham dan emas dengan satuan berat yang mereka sebut dinar. Jadi setiap sepuluh dirham setara dengan tujuh dinar. Dan mereka memiliki timbangan biji jelai, yang merupakan seperenam puluh dari berat dirham, dan ons setara dengan empat puluh dirham, dan nasyid setara dengan dua puluh dirham, dan biji kurma setara dengan lima dirham. Maka ketika Nabi datang ke Mekah, beliau menyetujui hal itu. Dan Saeed bin Al-Musayyab berkata ketika ditanya siapa orang pertama yang mencetak dinar berukir, jawabannya adalah Abdul Malik bin Marwan. Dan dinar yang digunakan adalah dinar Romawi, sedangkan dirham yang digunakan adalah dinar Sasaniyah dan Himyariyah, jumlahnya sedikit. Menurut Al-Suyuti, Abd al-Malik adalah orang pertama yang menulis di bagian depan gulungan, “Katakanlah, Dialah Allah Yang Maha Esa,” dan menyebutkan Nabi beserta tanggalnya. Maka raja Romawi menulis, “Kalian telah memasukkan sesuatu ke dalam gulungan kalian yang menyebutkan Nabi kalian, maka tinggalkanlah, jika tidak, kalian akan menerima dari dinar kami penyebutan yang tidak kalian sukai.” Hal ini sangat membuat Abd al-Malik sedih, sehingga ia berkonsultasi dengan Khalid ibn Yazid ibn Muawiyah, yang berkata, “Laranglah penggunaan dinar mereka dan buatlah koin untuk orang-orang dengan penyebutan Allah dan penyebutan Rasul-Nya di atasnya.” Maka dinar-dinar itu dicetak pada tahun tujuh puluh lima, dan di atasnya tertulis, “Katakanlah, Dialah Allah Yang Maha Esa,” dan di sisi lainnya, “Tidak ada tuhan selain Allah,” dan dilingkari dengan cincin perak yang bertuliskan, “Dicetak di kota ini dan itu,” dan di luar cincin, “Muhammad adalah Rasul Allah, yang Dia utus dengan petunjuk dan agama yang benar.” {cite:tarikh-khulafa-minhaj-1434 p. 358-359}. Buku ini menyatakan bahwa Abd al-Malik sepenuhnya mengarabkan mata uang dan mendirikan percetakan uang di bawah pengawasan Kekhalifahan. Buku ini menceritakan bahwa kaisar Bizantium mengancam akan mencetak kalimat-kalimat yang menghina Nabi pada dinar, sehingga ia memutuskan untuk mencetak mata uangnya sendiri di wilayahnya. Dinar memiliki berat sekitar dua puluh dua karat, dirham lima belas karat, dan tanggal pada koin tersebut menggunakan kalender Hijriah. {cite:salabi-umayyad-state-2020 p.17-19}"
