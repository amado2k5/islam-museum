id: event/abd-al-malik-coinage
education:
  did_you_know:
    ar: "كانت دنانير هرقل ودراهم الفرس ترد على أهل مكة في الجاهلية، وكانوا يتبايعون عليها تبراً ويعرفون المثقال؛ ثم جاءت ضربة عبد الملك بن مروان للدينار الإسلامي."
    en: "Heraclius's dinars and the Persians' baghli dirhams already reached Meccan trade in the Jahiliyya, exchanged as bullion by a known mithqal weight — until Abd al-Malik ibn Marwan struck the Islamic dinar."
    ur: "جاہلیت میں ہرقل کے دینار اور فارس کے بغلی درہم مکہ کی تجارت میں آتے تھے، جنہیں لوگ مثقال کے وزن سے خالص سمجھ کر بیچتے تھے — پھر عبدالملک بن مروان نے اسلامی دینار ڈھالا۔"
    sources: [source/futuh-buldan-maarif-1407, source/tarikh-ibn-khaldun-ibar]
