label: { ar: "توحيد النقود في عهد عبد الملك", en: "Abd al-Malik's Coinage Reform" }
summary:
  ar: "كانت دنانير هرقل ترد على أهل مكة في الجاهلية وترد عليهم دراهم الفرس البغلية فكانوا لا يتبايعون إلا على أنها تبر وكان المثقال عندهم معروف الوزن وزنه اثنان وعشرون قيراطاً إلا كسراً ووزن العشرة دراهم سبعة مثاقيل وكان الرطل اثنتي عشرة أوقية وكل أوقية أربعون درهماً فأقر رسول الله ذلك وأقره أبو بكر وعمر وعثمان وعلي فكان معاوية فأقر ذلك على حاله ثم ضرب مصعب بن الزبير في أيام عبد الله بن الزبير دراهم قليلة كسرت بعد فلما ولي عبد الملك بن مروان سأل وفحص عن أمر الدراهم والدنانير فكتب إلى الحجاج بن يوسف أن يضرب الدراهم على خمسة عشر قيراطاً من قراريط الدنانير وضرب هو الدنانير الدمشقية فقدمت على المدينة وبها نفر من أصحاب رسول الله وغيرهم من التابعين فلم ينكروا ذلك وقال الحسن بن صالح كانت الدراهم من ضرب الأعاجم مختلفة كباراً وصغاراً مثقالاً واثني عشر قيراطاً وعشرة قراريط فلما جاء الإسلام واحتيج في أداء الزكاة إلى الأمر الوسط جمعوها فوجدوها اثنين وأربعين قيراطاً فضربوا على وزن الثلث وهو أربعة عشر قيراطاً فوزن الدرهم العربي أربعة عشر قيراطاً فصار وزن كل عشرة دراهم سبع مثاقيل وكانت لقريش أوزان في الجاهلية يزنون الفضة بوزن يسميه درهماً والذهب بوزن يسميه ديناراً فكل عشرة من أوزان الدراهم سبعة أوزان الدنانير وكان لهم وزن الشعيرة وهو واحد الستين من وزن الدرهم والأوقية وزن أربعين درهماً والنش وزن عشرين درهماً والنواة وزن خمسة دراهم فلما قدم النبي مكة أقرهم على ذلك وقال سعيد بن المسيب لما سئل من أول من ضرب الدنانير المنقوشة عبد الملك بن مروان وكانت الدنانير ترد رومية والدراهم كسروية وحميرية قليلة. وعند السيوطي أن عبد الملك أول من كتب في صدور الطوامير قل هو الله أحد وذكر النبي مع التاريخ، فكتب ملك الروم إنكم قد أحدثتم في طواميركم شيئاً من ذكر نبيكم فاتركوه وإلا أتاكم من دنانيرنا ذكر ما تكرهون، فعظم ذلك على عبد الملك فشاور خالد بن يزيد بن معاوية فقال حرم دنانيرهم واضرب للناس سككاً فيها ذكر الله وذكر رسوله، فضرب الدنانير سنة خمس وسبعين وكتب عليها قل هو الله أحد وفي الوجه الآخر لا إله إلا الله وطوقه بطوق فضة فيه ضرب بمدينة كذا وخارج الطوق محمد رسول الله أرسله بالهدى ودين الحق {cite:tarikh-khulafa-minhaj-1434 p. 358-359}. ويذكر الكتاب أن عبد الملك عرّب النقد تعريباً نهائياً وأحدث دور الضرب تحت إشراف الخلافة، ويروي أن ملك الروم هدّد بطبع عبارات قادحة في النبي على الدنانير، فعزم على ضرب سكة في بلاده، وأن الدينار وُزن بنحو اثنين وعشرين قيراطاً والدرهم بخمسة عشر قيراطاً، وأن التواريخ على النقود كانت بالتاريخ الهجري. {cite:salabi-umayyad-state-2020 p.17-19}"
  en: "Heraclius's dinars and the Persian Baghliyya dirhams reached Jahiliya Mecca and traded only as bullion: their mithqal twenty-two qirats less a fraction, ten dirhams seven mithqals, the ratl twelve uqiyyas of forty dirhams — weights the Prophet confirmed, and Abu Bakr, Umar, Uthman, Ali, and Mu'awiya after him. Mus'ab ibn al-Zubayr struck a few dirhams under Ibn al-Zubayr, later broken; then Abd al-Malik asked and tested, wrote al-Hajjaj to strike dirhams at fifteen qirats of the dinar-qirats, and struck the Damascene dinars — which came to Medina with Companions and Followers there and none objected. Al-Hasan ibn Salih: the Ajam dirhams ran great and small — twenty, twelve, ten qirats — and when Islam needed the mean for zakah they summed forty-two and struck the third, fourteen qirats, so ten Arab dirhams weigh seven mithqals. Quraysh's weights: the dirham for silver, the dinar for gold, ten dirham-weights to seven dinar-weights, the sha'ira a sixtieth of a dirham, the uqiyya forty dirhams, the nashsh twenty, the nawa five — all confirmed when the Prophet entered Mecca. And Sa'id ibn al-Musayyab, asked who first struck engraved dinars, said 'Abd al-Malik ibn Marwan — dinars came Byzantine, dirhams Kisrawi and few Himyari'."
