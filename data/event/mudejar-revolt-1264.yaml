summary:
  ar: "بطاقة أولية لثورة المدجنين من ١٢٦٤ إلى ١٢٦٦م، انتفاضة مسلمي قشتالة بتحريض من غرناطة والمرينيين؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Mudéjar revolt of 1264–1266, the rising of Castile's Muslims stirred by Granada and the Marinids; its sources are not yet checked on the page."
