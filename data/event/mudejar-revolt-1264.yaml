  fr: "Projet de fiche pour la révolte mudéjare de 1264-1266, le soulèvement des musulmans de Castille attisé par Grenade et les Mérinides; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1264-1266 کی مدجر بغاوت کے لیے ڈرافٹ کارڈ، کاسٹیل کے مسلمانوں کا عروج گراناڈا اور میرینیڈز کے ذریعے ہلچل مچا دیا؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Granada ve Marinidler tarafından kışkırtılan Kastilya Müslümanlarının 1264-1266 yılları arasındaki ayaklanması olan Mudéjar isyanına dair ön bir açıklama; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan awal tentang pemberontakan Mudéjar dari tahun 1264 hingga 1266 M, sebuah pemberontakan kaum Muslim Kastilia yang dipicu oleh Granada dan Dinasti Marinid; sumber-sumber yang tercantum di halaman ini belum ditinjau."
