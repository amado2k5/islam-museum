summary:
  ar: "في سنة سبع وأربعين ومئة خلع المنصور عمه عيسى بن موسى من ولاية العهد وكان السفاح قد عهد إليه من بعد المنصور وكان عيسى هو الذي حارب له الأخوين محمداً وإبراهيم وظفر بهما فكافأه المنصور بأن خلعه مكرهاً وعهد إلى ولده المهدي {cite:tarikh-khulafa-minhaj-1434 p. 425}."
  en: "In year 147 al-Mansur deposed his uncle Isa ibn Musa from the succession — al-Saffah had settled it on him after al-Mansur, and Isa was the very man who had fought the brothers Muhammad and Ibrahim for him and overcome them; al-Mansur requited him by deposing him under duress and settling the succession on his son al-Mahdi {cite:tarikh-khulafa-minhaj-1434 p. 425}."
