class: event
kind: publication
label:
  ar: "بلوغ إملاء الطبري تاريخَه سنة ٣٠٢هـ"
  en: "al-Tabari's History reaches the year 302 in dictation"
  ur: "طبری کی تاریخ کا املا 302ھ تک پہنچا"
summary:
  ar: "بلغ آخر ما أملاه الطبري من كتابه «تاريخ الرسل والملوك» سنة ٣٠٢هـ/٩١٤م، فيما أخبر ابن النديم؛ وقد اختصره جماعة وحذفوا أسانيده، وألحق به جماعة من حيث قطعه إلى زمان ابن النديم، فيهم أبو محمد عبد الله الفرغاني تلميذ الطبري الذي صنع له ذيلاً اشتمل على ترجمة مطولة له {cite:fihrist-ibn-al-nadim p. 326-327} {cite:encyclopaedia-of-islam-2 vol. 10 p. 21}."
  en: "The last portion of al-Tabari's History of the Prophets and Kings that he dictated reached the year 302/914, as Ibn al-Nadim reports; scholars afterwards abridged it and stripped its isnads, while others appended continuations from where he stopped, among them his own student Abu Muhammad Abd Allah al-Farghani, whose supplement included a long obituary notice of his master {cite:fihrist-ibn-al-nadim p. 326-327} {cite:encyclopaedia-of-islam-2 vol. 10 p. 21}."
  ur: "ابن ندیم کی روایت کے مطابق طبری نے اپنی کتاب «تاریخ الرسل والملوک» کا املا 302ھ/914ء تک کرایا؛ بعد کے علماء نے اس کا اختصار کیا اور اسناد حذف کیں، جب کہ بعض نے جہاں وہ رکا تھا وہاں سے اضافہ کیا، جن میں ان ہی کے شاگرد ابو محمد عبد اللہ فرغانی تھے جن کے ذیل میں استاد کی طویل ترجمانی حیات شامل تھی {cite:fihrist-ibn-al-nadim p. 326-327} {cite:encyclopaedia-of-islam-2 vol. 10 p. 21}."
