id: event/tabari-tarikh-dictation-302
class: event
kind: publication
label:
  ar: "بلوغ إملاء الطبري تاريخَه سنة ٣٠٢هـ"
  en: "al-Tabari's History reaches the year 302 in dictation"
  ur: "طبری کی تاریخ کا املا 302ھ تک پہنچا"
  es: "La Historia de al-Tabari llega al año 302 en dictado."
  fr: "L'Histoire d'al-Tabari s'arrête à l'année 302 sous sa dictée."
  tr: "Taberi'nin bu eseri dikte ettiği tarih Hicri 302 yılıdır."
  id: "Tanggal dikte al-Tabari adalah tahun 302 Hijriah."
summary:
  ar: "بلغ آخر ما أملاه الطبري من كتابه «تاريخ الرسل والملوك» سنة ٣٠٢هـ/٩١٤م، فيما أخبر ابن النديم؛ وقد اختصره جماعة وحذفوا أسانيده، وألحق به جماعة من حيث قطعه إلى زمان ابن النديم، فيهم أبو محمد عبد الله الفرغاني تلميذ الطبري الذي صنع له ذيلاً اشتمل على ترجمة مطولة له {cite:fihrist-ibn-al-nadim p. 326-327} {cite:encyclopaedia-of-islam-2 vol. 10 p. 21}."
  en: "The last portion of al-Tabari's History of the Prophets and Kings that he dictated reached the year 302/914, as Ibn al-Nadim reports; scholars afterwards abridged it and stripped its isnads, while others appended continuations from where he stopped, among them his own student Abu Muhammad Abd Allah al-Farghani, whose supplement included a long obituary notice of his master {cite:fihrist-ibn-al-nadim p. 326-327} {cite:encyclopaedia-of-islam-2 vol. 10 p. 21}."
  ur: "ابن ندیم کی روایت کے مطابق طبری نے اپنی کتاب «تاریخ الرسل والملوک» کا املا 302ھ/914ء تک کرایا؛ بعد کے علماء نے اس کا اختصار کیا اور اسناد حذف کیں، جب کہ بعض نے جہاں وہ رکا تھا وہاں سے اضافہ کیا، جن میں ان ہی کے شاگرد ابو محمد عبد اللہ فرغانی تھے جن کے ذیل میں استاد کی طویل ترجمانی حیات شامل تھی {cite:fihrist-ibn-al-nadim p. 326-327} {cite:encyclopaedia-of-islam-2 vol. 10 p. 21}."
  es: "La última parte de la Historia de los Profetas y los Reyes de al-Tabari que dictó llegó al año 302/914, como informa Ibn al-Nadim; los eruditos posteriormente la abreviaron y eliminaron sus isnads, mientras que otros añadieron continuaciones desde donde él se detuvo, entre ellos su propio alumno Abu Muhammad Abd Allah al-Farghani, cuyo suplemento incluyó una larga nota necrológica de su maestro {cite:fihrist-ibn-al-nadim p. 326-327} {cite:encyclopaedia-of-islam-2 vol. 10 p. 21}."
  fr: "La dernière partie de l'Histoire des Prophètes et des Rois d'al-Tabari, dictée par lui, atteignit l'année 302/914, comme le rapporte Ibn al-Nadim; par la suite, des érudits l'ont abrégée et ont supprimé ses isnads, tandis que d'autres y ont ajouté des continuations à partir de là où il s'était arrêté, parmi lesquels son propre élève Abu Muhammad Abd Allah al-Farghani, dont le supplément comprenait une longue notice nécrologique de son maître {cite:fihrist-ibn-al-nadim p. 326-327} {cite:encyclopaedia-of-islam-2 vol. 10 p. 21}."
  tr: "İbn el-Nadim'in rivayetine göre, el-Taberi'nin \"Peygamberler ve Krallar Tarihi\" adlı eserinden dikte ettiği son kısım Hicri 302/Miladi 914 yılında tamamlanmıştır. Bir grup insan bu eseri kısaltmış ve rivayet zincirini kaldırmış, bir başka grup ise İbn el-Nadim'in zamanına kadar olan kısmı eklemelerle genişletmiştir. Bu gruplar arasında, el-Taberi'nin öğrencisi olan Ebu Muhammed Abdullah el-Fergani de bulunmakta olup, el-Taberi'nin uzun bir biyografisini de içeren bir ek eser hazırlamıştır. {cite:fihrist-ibn-al-nadim s. 326-327} {cite:encyclopaedia-of-islam-2 cilt 10 s. 21}"
  id: "Hal terakhir yang didiktekan al-Tabari dari bukunya “Sejarah Para Nabi dan Raja-raja” diselesaikan pada tahun 302 H/914 M, menurut apa yang dilaporkan oleh Ibnu al-Nadim. Sekelompok orang mempersingkatnya dan menghilangkan sanadnya, dan kelompok lain menambahkannya dari titik yang dipotongnya hingga masa Ibnu al-Nadim, termasuk Abu Muhammad Abdullah al-Farghani, seorang murid al-Tabari, yang membuat suplemen yang mencakup biografi panjang tentang dirinya. {cite:fihrist-ibn-al-nadim hlm. 326-327} {cite:encyclopaedia-of-islam-2 vol. 10 hlm. 21}."
