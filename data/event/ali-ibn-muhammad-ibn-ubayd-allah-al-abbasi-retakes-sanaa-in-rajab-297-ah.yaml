id: "event/ali-ibn-muhammad-ibn-ubayd-allah-al-abbasi-retakes-sanaa-in-rajab-297-ah"
class: event
kind: other
label:
  ar: "يدخل علي بن محمد بن عبيد الله العباسي صنعاء في رجب سنة 297هـ بأمر الهادي، ص395"
  en: "Ali ibn Muhammad ibn Ubayd Allah al-Abbasi enters Sanaa in Rajab 297 AH on al-Hadi's orders, p. 395"
  ur: "ہادی کے حکم پر علی بن محمد بن عبید اللہ العباسی رجب 297ھ میں صنعاء میں داخل ہوتے ہیں، ص395"
summary:
  ar: "يبعث الهادي إلى الحق رجلا عباسيا هو علي بن محمد بن عبيد الله، مع جماعة من أصحابه، فيُخرجون القرامطة من صنعاء، ويدخلونها يوم الخميس لإحدى عشرة ليلة باقية من رجب سنة 297هـ، فيؤمّنون أهلها."
  en: "On al-Hadi's orders an Abbasi named Ali ibn Muhammad ibn Ubayd Allah sets out with a company of his men. They drive the Qarmatian garrison out of Sanaa and enter on Thursday, eleven nights before the end of Rajab 297 AH, and the people of Sanaa are given safety."
  ur: "ہادی کے حکم پر ایک عباسی، علی بن محمد بن عبید اللہ، اپنے ساتھیوں کے ساتھ نکلتے ہیں۔ رجب 297ھ کے آخر سے گیارہ راتیں پہلے جمعرات کو وہ صنعاء سے قرامطہ کے دستے کو نکال کر شہر میں داخل ہوتے ہیں اور اہل صنعاء کو امان ملتی ہے۔"
