id: "event/ali-ibn-muhammad-ibn-ubayd-allah-al-abbasi-retakes-sanaa-in-rajab-297-ah"
class: event
kind: other
label:
  ar: "يدخل علي بن محمد بن عبيد الله العباسي صنعاء في رجب سنة 297هـ بأمر الهادي، ص395"
  en: "Ali ibn Muhammad ibn Ubayd Allah al-Abbasi enters Sanaa in Rajab 297 AH on al-Hadi's orders, p. 395"
  ur: "ہادی کے حکم پر علی بن محمد بن عبید اللہ العباسی رجب 297ھ میں صنعاء میں داخل ہوتے ہیں، ص395"
  es: "Ali ibn Muhammad ibn Ubayd Allah al-Abbasi ingresa a Sanaa en Rajab 297 AH por orden de al-Hadi, p. 395"
  fr: "Ali ibn Muhammad ibn Ubayd Allah al-Abbasi entre à Sanaa à Rajab 297 AH sur ordre d'al-Hadi, p. 395"
  tr: "Ali ibn Muhammed ibn Ubeyd Allah el-Abbasi, el-Hadi'nin emriyle H. 297 yılının Receb ayında Sana'a'ya girdi, s. 395"
  id: "Ali bin Muhammad bin Ubayd Allah al-Abbasi memasuki Sana'a pada Rajab tahun 297 H atas perintah al-Hadi, hal. 395"
summary:
  ar: "يبعث الهادي إلى الحق رجلا عباسيا هو علي بن محمد بن عبيد الله، مع جماعة من أصحابه، فيُخرجون القرامطة من صنعاء، ويدخلونها يوم الخميس لإحدى عشرة ليلة باقية من رجب سنة 297هـ، فيؤمّنون أهلها."
  en: "On al-Hadi's orders an Abbasi named Ali ibn Muhammad ibn Ubayd Allah sets out with a company of his men. They drive the Qarmatian garrison out of Sanaa and enter on Thursday, eleven nights before the end of Rajab 297 AH, and the people of Sanaa are given safety."
  ur: "ہادی کے حکم پر ایک عباسی، علی بن محمد بن عبید اللہ، اپنے ساتھیوں کے ساتھ نکلتے ہیں۔ رجب 297ھ کے آخر سے گیارہ راتیں پہلے جمعرات کو وہ صنعاء سے قرامطہ کے دستے کو نکال کر شہر میں داخل ہوتے ہیں اور اہل صنعاء کو امان ملتی ہے۔"
  es: "Por orden de al-Hadi, un abasí llamado Ali ibn Muhammad ibn Ubayd Allah partió con un grupo de sus hombres. Expulsaron a la guarnición cármata de Saná y entraron el jueves, once noches antes del final de Rajab del año 297 de la Hégira, y así se garantizó la seguridad de los habitantes de Saná."
  fr: "Sur ordre d'al-Hadi, un Abbasi nommé Ali ibn Muhammad ibn Ubayd Allah part avec un groupe d'hommes. Ils chassent la garnison qarmate de Sanaa et y entrent le jeudi, onze nuits avant la fin du mois de Rajab 297 AH, et les habitants de Sanaa sont mis en sécurité."
  tr: "El-Hadi ila el-Haqq, Abbasilerden Ali bin Muhammed bin Ubeydullah'ı ve yanındaki arkadaşlarıyla birlikte gönderir ve onlar Karmatileri Sana'a'dan kovarlar. Hicri 297 yılında, Recep ayının bitimine on bir gece kala, Perşembe günü şehre girerler ve halkına güvenlik sağlarlar."
  id: "Al-Hadi ila al-Haqq mengutus seorang laki-laki dari Dinasti Abbasiyah, Ali bin Muhammad bin Ubaid Allah, bersama sekelompok sahabatnya, dan mereka mengusir kaum Qarmatian dari Sana'a, lalu mereka memasuki kota itu pada hari Kamis, sebelas malam tersisa di bulan Rajab tahun 297 Hijriah, dan mereka memberikan keamanan kepada penduduknya."
