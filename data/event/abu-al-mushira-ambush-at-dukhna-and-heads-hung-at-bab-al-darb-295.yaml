id: event/abu-al-mushira-ambush-at-dukhna-and-heads-hung-at-bab-al-darb-295
class: event
kind: other
label:
  ar: "كمين أبي المشيرة في دخنة على سوحان، ورؤوس القتلى على باب الدرب، سنة 295هـ، ص356"
  en: "Abu al-Mushira's ambush at Dukhna above Suhan, and the heads hung at the gate of al-Darb, 295 AH, p. 356"
  fr: "L’embuscade d’Abu al-Mushira à Dukhna au-dessus de Suhan et les têtes suspendues à la porte d’al-Darb, 295 de l’hégire, p. 356"
  ur: "دخنہ میں ابو المشیرہ کا کمین اور سوحان کے قریب ٹوٹی گئی گردنیں باب الدرب پر لٹکانا، 295ھ، ص356"
  es: "La emboscada de Abu al-Mushira en Dukhna, cerca de Suhan, y las cabezas colgadas en la puerta de al-Darb, 295 AH, pág. 356"
  tr: "Ebu el-Muşayra'nın Dakhna'da Suhan'a düzenlediği pusu ve yol girişinde öldürülenlerin başları, Hicri 295 yılı, s. 356"
  id: "Penyergapan Abu al-Mushayra di Dakhna terhadap Suhan, dan kepala-kepala orang yang terbunuh di gerbang jalan, tahun 295 H, hlm. 356"
summary:
  ar: "أرسل الهادي خادمه أبا المشيرة في جماعة من خدمه ومن شاكر، فكمنوا في جبل دخنة المشرف على سوحان، فقتلوا ثلاثة من بني الحارث، منهم أبو الصرّام بن علي، وأتوا برؤوسهم إلى الهادي، فأمر بها فصُلبت على باب الدرب."
  en: "Al-Hadi sent his servant Abu al-Mushira with some of his servants and men of Shakir. They lay in ambush on Mount Dukhna overlooking Suhan and killed three men of Banu al-Harith, among them Abu al-Surram ibn Ali. They brought the heads to al-Hadi, who ordered them crucified at the gate of al-Darb."
  fr: "Al-Hadi envoya son serviteur Abu al-Mushira avec certains de ses serviteurs et des hommes de Shakir. Ils tendirent une embuscade sur le mont Dukhna dominant Suhan et tuèrent trois hommes des Banu al-Harith, dont Abu al-Surram ibn Ali. Ils apportèrent les têtes à al-Hadi, qui ordonna de les crucifier à la porte d’al-Darb."
  ur: "ہادی نے اپنے خادم ابو المشیرہ کو اپنے کچھ خادموں اور شاکر کے لوگوں کے ساتھ بھیجا۔ وہ سوحان پر نظر رکھنے والے دخنہ پہاڑ میں کمین میں بیٹھے اور بنو حارث کے تین آدمی قتل کیے، جن میں ابو الصرّام بن علی بھی تھا۔ سر ہادی کے پاس لائے گئے تو انہوں نے حکم دیا کہ انہیں باب الدرب پر صلیب پر چڑھا دیا جائے۔"
  es: "Al-Hadi envió a su sirviente Abu al-Mushira con algunos de sus sirvientes y hombres de Shakir. Les tendieron una emboscada en el monte Dukhna, con vistas a Suhan, y mataron a tres hombres de Banu al-Harith, entre ellos Abu al-Surram ibn Ali. Llevaron las cabezas a al-Hadi, quien ordenó que fueran crucificados en la puerta de al-Darb."
  tr: "El-Hadi, hizmetkârı Ebu el-Muşira'yı bir grup hizmetkârı ve Şaker ile birlikte gönderdi ve Suhan'a bakan Cebel Dakhna'da pusu kurdular. Beni el-Harith kabilesinden Ebu el-Sarram bin Ali de dahil olmak üzere üç kişiyi öldürdüler ve başlarını El-Hadi'ye getirdiler. Bunun üzerine El-Hadi, başların yol kenarında çarmıha gerilmesini emretti."
  id: "Al-Hadi mengutus pelayannya, Abu Al-Mushira, bersama sekelompok pelayannya dan Shaker, lalu mereka bersembunyi di Jabal Dakhna yang menghadap Suhan. Mereka membunuh tiga orang dari Bani Al-Harith, termasuk Abu Al-Sarram bin Ali, dan membawa kepala mereka kepada Al-Hadi. Maka Al-Hadi memerintahkan agar kepala-kepala itu disalib di gerbang jalan."
