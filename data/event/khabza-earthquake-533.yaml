label: { ar: "الزلزلة العظمى بخبزة سنة 533", en: "The great earthquake at Khabza, 533", es: "El gran terremoto de Khabza, 533", fr: "Le grand tremblement de terre de Khabza, 533", ur: "خبزہ کے مقام پر 533 کا زبردست زلزلہ", tr: "533 yılında meydana gelen Büyük Khubza Depremi", id: "Gempa Besar Khubza pada tahun 533" }
summary:
  ar: "في سنة ثلاث وثلاثين وخمسمائة كانت زلزلة بخبزة أتت على مائتي ألف وثلاثين ألفاً فأهلكتهم وكانت الزلزلة في عشرة فراسخ؛ وفي التي بعدها خُسف بها وصار مكان البلد ماءً أسود وقدم التجار من أهلها فلزموا المقابر يبكون على أهلهم {cite:shadharat-dhahab p. 582-584}."
  en: "In 533 an earthquake struck Khabza and carried off two hundred and thirty thousand, its reach spanning ten farsakhs; the next year the town was swallowed whole — the site turning to black water — and returning townsfolk-merchants clung to the graveyards weeping for their kin {cite:shadharat-dhahab p. 582-584}."
  es: "En 533, un terremoto azotó Khabza y se llevó a doscientos treinta mil habitantes, abarcando su alcance diez farsakhs; al año siguiente, la ciudad fue engullida por completo —el lugar se convirtió en agua negra— y los habitantes y comerciantes que regresaban se aferraban a los cementerios llorando por sus parientes {cite:shadharat-dhahab p. 582-584}."
  fr: "En 533, un tremblement de terre frappa Khabza et emporta deux cent trente mille personnes, sa portée s'étendant sur dix farsakhs; l'année suivante, la ville fut engloutie tout entière — le site se transformant en eau noire — et les habitants-marchands de retour s'accrochèrent aux cimetières en pleurant leurs proches {cite:shadharat-dhahab p. 582-584}."
  ur: "533 میں خبزہ میں ایک زلزلہ آیا اور دو لاکھ تیس ہزار افراد کو اپنی لپیٹ میں لے لیا، اس کی وسعت دس فرسخ تھی۔ اگلے سال یہ قصبہ پوری طرح نگل گیا — جگہ کالے پانی کی طرف مڑ گئی — اور لوٹنے والے شہر کے تاجر اپنے رشتہ داروں کے لیے روتے ہوئے قبرستانوں سے لپٹ گئے۔ 582-584}۔"
  tr: "Hicri 533 yılında Khubza'da 230.000 kişinin ölümüne neden olan bir deprem oldu. Deprem, 10 fersahlık bir alanda meydana geldi. Bundan bir yıl sonra, şehir sular altında kaldı ve şehrin yeri simsiyah sularla kaplandı. Halkından tüccarlar gelip mezarların başında kalarak, halkları için ağladılar. {Kaynak: Shadharat-dhahab s. 582-584}"
  id: "Pada tahun 533 H, terjadi gempa bumi di Khubza yang menewaskan 230.000 orang. Gempa tersebut terjadi di wilayah seluas 10 farsakh. Setahun setelah itu, kota tersebut tenggelam, dan tempat kota itu menjadi air hitam. Para pedagang dari kalangan penduduknya datang dan tinggal di kuburan, meratapi orang-orang mereka. {cite:shadharat-dhahab p. 582-584}"
