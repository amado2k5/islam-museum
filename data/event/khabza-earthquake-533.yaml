summary:
  ar: "في سنة ثلاث وثلاثين وخمسمائة كانت زلزلة بخبزة أتت على مائتي ألف وثلاثين ألفاً فأهلكتهم وكانت الزلزلة في عشرة فراسخ؛ وفي التي بعدها خُسف بها وصار مكان البلد ماءً أسود وقدم التجار من أهلها فلزموا المقابر يبكون على أهلهم {cite:shadharat-dhahab p. 582-584}."
