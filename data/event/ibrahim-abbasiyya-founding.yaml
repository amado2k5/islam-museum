summary:
  ar: "عند البلاذري: لما حاصر جند الثغر إبراهيم بالقيروان أتاه المُراض والممطون ومعهم مال من خراج مصر فلما أُعطوا تفرقوا فابتنى إبراهيم القصر الأبيض الذي في قبلة القيروان على ميلين منها وخطّ للناس حوله فابتنوا ومصّر ما هناك وبنى مسجداً جامعاً بالحص والآجر وعمد الرخام وسقفه بالأرز وجعله مائتي ذراع في نحو مائتي ذراع وابتاع عبيداً أعتقهم فبلغوا خمسة آلاف وأسكنهم حوله وسمّى تلك المدينة العباسية وهي إلى زمن البلاذري آهلة عامرة."
  en: "In al-Baladhuri: when the frontier army besieged Ibrahim at Qayrawan, al-Muradi and al-Mamrun came to him bearing money from Egypt's kharaj — when paid, they dispersed. Ibrahim then built the White Palace two miles in Qayrawan's qibla direction, laid out plots around it for the people who built and made it a misr, built a congregational mosque of gravel and brick on marble columns roofed with cedar, two hundred cubits by about two hundred; he bought slaves he freed — they reached five thousand — settled them around it and named that city al-Abbasiyya, inhabited and flourishing to al-Baladhuri's day."
