label: { ar: "تأسيس إبراهيم بن الأغلب العباسية", en: "Ibrahim ibn al-Aghlab's Founding of al-Abbasiyya", es: "La fundación de al-Abbasiyya por Ibrahim ibn al-Aghlab", fr: "Fondation d'al-Abbasiyya par Ibrahim ibn al-Aghlab", ur: "ابراہیم بن اغلب کی بنیاد عباسیہ" }
summary:
  ar: "عند البلاذري: لما حاصر جند الثغر إبراهيم بالقيروان أتاه المُراض والممطون ومعهم مال من خراج مصر فلما أُعطوا تفرقوا فابتنى إبراهيم القصر الأبيض الذي في قبلة القيروان على ميلين منها وخطّ للناس حوله فابتنوا ومصّر ما هناك وبنى مسجداً جامعاً بالحص والآجر وعمد الرخام وسقفه بالأرز وجعله مائتي ذراع في نحو مائتي ذراع وابتاع عبيداً أعتقهم فبلغوا خمسة آلاف وأسكنهم حوله وسمّى تلك المدينة العباسية وهي إلى زمن البلاذري آهلة عامرة."
  en: "In al-Baladhuri: when the frontier army besieged Ibrahim at Qayrawan, al-Muradi and al-Mamrun came to him bearing money from Egypt's kharaj — when paid, they dispersed. Ibrahim then built the White Palace two miles in Qayrawan's qibla direction, laid out plots around it for the people who built and made it a misr, built a congregational mosque of gravel and brick on marble columns roofed with cedar, two hundred cubits by about two hundred; he bought slaves he freed — they reached five thousand — settled them around it and named that city al-Abbasiyya, inhabited and flourishing to al-Baladhuri's day."
  es: "En al-Baladhuri: cuando el ejército fronterizo sitió a Ibrahim en Qayrawan, al-Muradi y al-Mamrun acudieron a él con dinero del kharaj de Egipto; una vez pagado, se dispersaron. Ibrahim construyó entonces el Palacio Blanco a dos millas en dirección a la qibla de Qayrawan, trazó parcelas a su alrededor para la gente que lo construyó y lo convirtió en un misr, construyó una mezquita congregacional de grava y ladrillo sobre columnas de mármol con techo de cedro, de doscientos codos por doscientos aproximadamente; compró esclavos que había liberado —llegaron a ser cinco mil—, los asentó a su alrededor y llamó a esa ciudad al-Abbasiyya, habitada y floreciente hasta la época de al-Baladhuri."
  fr: "Dans le récit d'al-Baladhuri: lorsque l'armée frontalière assiégea Ibrahim à Qayrawan, al-Muradi et al-Mamrun vinrent à lui avec de l'argent provenant du kharaj d'Égypte; une fois payés, ils se dispersèrent. Ibrahim fit alors construire le Palais Blanc à deux milles en direction de la qibla de Qayrawan, aménagea des parcelles autour pour les bâtisseurs et en fit un misr (lieu de culte), fit construire une mosquée du vendredi en gravier et en brique sur des colonnes de marbre, couverte de cèdre, mesurant environ deux cents coudées sur deux cents; il racheta les esclaves qu'il avait affranchis – leur nombre atteignit cinq mille –, les installa aux alentours et nomma cette ville al-Abbasiyya, qui fut habitée et prospéra jusqu'à l'époque d'al-Baladhuri."
  ur: "البلادوری میں ہے: جب سرحدی فوج نے ابراہیم کا قیراوان میں محاصرہ کیا تو المرادی اور الممرون مصر کے خرج سے رقم لے کر اس کے پاس آئے - جب ادائیگی کی گئی تو وہ منتشر ہوگئے۔ اس کے بعد ابراہیم نے قیروان کے قبلہ کی سمت میں دو میل کے فاصلے پر سفید محل تعمیر کیا، اس کے ارد گرد ان لوگوں کے لیے پلاٹ بنائے جنہوں نے اسے مصر بنایا اور سنگ مرمر کے ستونوں پر بجری اور اینٹوں کی ایک اجتماعی مسجد تعمیر کروائی جس کی چھت دیودار سے لگی ہوئی تھی، تقریباً دو سو ہاتھ؛ اس نے غلاموں کو خریدا جو اس نے آزاد کیے - وہ پانچ ہزار تک پہنچ گئے - انہیں اس کے ارد گرد آباد کیا اور اس شہر کا نام \"العباسیہ\" رکھا، جو الباضوری کے زمانے تک آباد اور پھلتا پھولتا تھا۔"
