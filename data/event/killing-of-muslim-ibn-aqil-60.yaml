label: { ar: "مقتل مسلم بن عقيل بالكوفة" }
summary:
  ar: "ظهر مسلم بن عقيل بالكوفة في ذي الحجة سنة ستين، فبايعه نحو اثني عشر ألفاً وقيل ثمانية عشر ألفاً {cite:bakr-umayyad-state-1134715 p. 180}. ولما ضرب عبيد الله بن زياد هانئ بن عروة بالقضيب وأمر بحبسه، نادى مسلم بشعار «يا منصور»، فاجتمع إليه ثمانية عشر ألف رجل {cite:bakr-umayyad-state-1134715 p. 183}، ثم تفرق عنه أكثرهم حين حاصره ابن زياد في القصر، فبقي في نحو مائة رجل ثم في ثلاثة {cite:bakr-umayyad-state-1134715 p. 183}. وأعطاه محمد بن الأشعث الأمان بعد أن قاتل حتى أثخن، ثم أُتي به ابن زياد، فأمر أن يُصعد به أعلى القصر، وقال لبكير بن حمران الأحمري، وقد ضربه مسلم، أن يضرب عنقه، فضربها {cite:bakr-umayyad-state-1134715 p. 184-185}. وأُخرج هانئ بن عروة إلى السوق فضُربت عنقه صبراً {cite:bakr-umayyad-state-1134715 p. 184}. وأمر ابن زياد بصلب جثة مسلم، وحُمل رأسه إلى دمشق، وهو أول قتيل صُلب من بني هاشم وأول رأس حُمل من رؤوسهم إلى دمشق {cite:bakr-umayyad-state-1134715 p. 185}. ويذكر الكتاب أن ظهوره كان يوم الثلاثاء لثماني ليال مضين من ذي الحجة، وقيل يوم عرفة لتسع مضين منه {cite:bakr-umayyad-state-1134715 p. 185}."
