id: event/killing-of-muslim-ibn-aqil-60
class: event
kind: death
label: { ar: "مقتل مسلم بن عقيل بالكوفة", en: "The killing of Muslim ibn Aqil in Kufa" }
summary:
  ar: "ظهر مسلم بن عقيل بالكوفة في ذي الحجة سنة ستين، فبايعه نحو اثني عشر ألفاً وقيل ثمانية عشر ألفاً {cite:bakr-umayyad-state-1134715 p. 180}. ولما ضرب عبيد الله بن زياد هانئ بن عروة بالقضيب وأمر بحبسه، نادى مسلم بشعار «يا منصور»، فاجتمع إليه ثمانية عشر ألف رجل {cite:bakr-umayyad-state-1134715 p. 183}، ثم تفرق عنه أكثرهم حين حاصره ابن زياد في القصر، فبقي في نحو مائة رجل ثم في ثلاثة {cite:bakr-umayyad-state-1134715 p. 183}. وأعطاه محمد بن الأشعث الأمان بعد أن قاتل حتى أثخن، ثم أُتي به ابن زياد، فأمر أن يُصعد به أعلى القصر، وقال لبكير بن حمران الأحمري، وقد ضربه مسلم، أن يضرب عنقه، فضربها {cite:bakr-umayyad-state-1134715 p. 184-185}. وأُخرج هانئ بن عروة إلى السوق فضُربت عنقه صبراً {cite:bakr-umayyad-state-1134715 p. 184}. وأمر ابن زياد بصلب جثة مسلم، وحُمل رأسه إلى دمشق، وهو أول قتيل صُلب من بني هاشم وأول رأس حُمل من رؤوسهم إلى دمشق {cite:bakr-umayyad-state-1134715 p. 185}. ويذكر الكتاب أن ظهوره كان يوم الثلاثاء لثماني ليال مضين من ذي الحجة، وقيل يوم عرفة لتسع مضين منه {cite:bakr-umayyad-state-1134715 p. 185}."
  en: "Muslim ibn Aqil appeared in Kufa in Dhu'l-Hijja of the year 60, and about twelve thousand men pledged allegiance to him, though some say eighteen thousand {cite:bakr-umayyad-state-1134715 p. 180}. When Ubayd Allah ibn Ziyad struck Hani ibn Urwa with a cane and ordered him imprisoned, Muslim proclaimed the slogan 'Ya Mansur', and eighteen thousand men gathered to him {cite:bakr-umayyad-state-1134715 p. 183}. Most of them then dispersed from him when Ibn Ziyad besieged him in the palace; he remained with about a hundred men, then with three {cite:bakr-umayyad-state-1134715 p. 183}. Muhammad ibn al-Ash'ath granted him safe-conduct after he had fought until he was badly wounded; he was then brought to Ibn Ziyad, who ordered him taken up to the top of the palace and told Bukayr ibn Humran al-Ahmari, who had been struck by Muslim, to strike his neck, and he did so {cite:bakr-umayyad-state-1134715 p. 184-185}. Hani ibn Urwa was taken out to the market and his neck was struck in cold blood {cite:bakr-umayyad-state-1134715 p. 184}. Ibn Ziyad ordered Muslim's body crucified and his head sent to Damascus; he was the first of the Banu Hashim to be crucified and the first head of theirs to be carried to Damascus {cite:bakr-umayyad-state-1134715 p. 185}. The book notes that his appearance was on Tuesday, eight nights into Dhu'l-Hijja, though some say it was on the day of Arafa, nine days into it {cite:bakr-umayyad-state-1134715 p. 185}."
