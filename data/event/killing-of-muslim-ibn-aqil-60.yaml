id: event/killing-of-muslim-ibn-aqil-60
class: event
kind: death
label: { ar: "مقتل مسلم بن عقيل بالكوفة", en: "The killing of Muslim ibn Aqil in Kufa", es: "El asesinato de Muslim ibn Aqil en Kufa.", fr: "L'assassinat de Muslim ibn Aqil à Kufa", ur: "کوفہ میں مسلم بن عقیل کا قتل", tr: "Kufa'da Müslim ibn Akil'in öldürülmesi.", id: "Pembunuhan Muslim Ibnu Aqi'ah di Kufa" }
summary:
  ar: "ظهر مسلم بن عقيل بالكوفة في ذي الحجة سنة ستين، فبايعه نحو اثني عشر ألفاً وقيل ثمانية عشر ألفاً {cite:bakr-umayyad-state-1134715 p. 180}. ولما ضرب عبيد الله بن زياد هانئ بن عروة بالقضيب وأمر بحبسه، نادى مسلم بشعار «يا منصور»، فاجتمع إليه ثمانية عشر ألف رجل {cite:bakr-umayyad-state-1134715 p. 183}، ثم تفرق عنه أكثرهم حين حاصره ابن زياد في القصر، فبقي في نحو مائة رجل ثم في ثلاثة {cite:bakr-umayyad-state-1134715 p. 183}. وأعطاه محمد بن الأشعث الأمان بعد أن قاتل حتى أثخن، ثم أُتي به ابن زياد، فأمر أن يُصعد به أعلى القصر، وقال لبكير بن حمران الأحمري، وقد ضربه مسلم، أن يضرب عنقه، فضربها {cite:bakr-umayyad-state-1134715 p. 184-185}. وأُخرج هانئ بن عروة إلى السوق فضُربت عنقه صبراً {cite:bakr-umayyad-state-1134715 p. 184}. وأمر ابن زياد بصلب جثة مسلم، وحُمل رأسه إلى دمشق، وهو أول قتيل صُلب من بني هاشم وأول رأس حُمل من رؤوسهم إلى دمشق {cite:bakr-umayyad-state-1134715 p. 185}. ويذكر الكتاب أن ظهوره كان يوم الثلاثاء لثماني ليال مضين من ذي الحجة، وقيل يوم عرفة لتسع مضين منه {cite:bakr-umayyad-state-1134715 p. 185}."
  en: "Muslim ibn Aqil appeared in Kufa in Dhu'l-Hijja of the year 60, and about twelve thousand men pledged allegiance to him, though some say eighteen thousand {cite:bakr-umayyad-state-1134715 p. 180}. When Ubayd Allah ibn Ziyad struck Hani ibn Urwa with a cane and ordered him imprisoned, Muslim proclaimed the slogan 'Ya Mansur', and eighteen thousand men gathered to him {cite:bakr-umayyad-state-1134715 p. 183}. Most of them then dispersed from him when Ibn Ziyad besieged him in the palace; he remained with about a hundred men, then with three {cite:bakr-umayyad-state-1134715 p. 183}. Muhammad ibn al-Ash'ath granted him safe-conduct after he had fought until he was badly wounded; he was then brought to Ibn Ziyad, who ordered him taken up to the top of the palace and told Bukayr ibn Humran al-Ahmari, who had been struck by Muslim, to strike his neck, and he did so {cite:bakr-umayyad-state-1134715 p. 184-185}. Hani ibn Urwa was taken out to the market and his neck was struck in cold blood {cite:bakr-umayyad-state-1134715 p. 184}. Ibn Ziyad ordered Muslim's body crucified and his head sent to Damascus; he was the first of the Banu Hashim to be crucified and the first head of theirs to be carried to Damascus {cite:bakr-umayyad-state-1134715 p. 185}. The book notes that his appearance was on Tuesday, eight nights into Dhu'l-Hijja, though some say it was on the day of Arafa, nine days into it {cite:bakr-umayyad-state-1134715 p. 185}."
  es: "Muslim ibn Aqil apareció en Kufa en Dhu'l-Hijja del año 60, y unos doce mil hombres le juraron lealtad, aunque algunos dicen dieciocho mil {cite:bakr-umayyad-state-1134715 p. 180}. Cuando Ubayd Allah ibn Ziyad golpeó a Hani ibn Urwa con un bastón y ordenó que lo encarcelaran, Muslim proclamó el lema 'Ya Mansur', y dieciocho mil hombres se reunieron con él {cite:bakr-umayyad-state-1134715 p. 183}. La mayoría de ellos se dispersaron de él cuando Ibn Ziyad lo sitió en el palacio; se quedó con unos cien hombres, luego con tres {cite:bakr-umayyad-state-1134715 p. 183}. Muhammad ibn al-Ash'ath le concedió salvoconducto después de que luchó hasta que resultó gravemente herido; Luego lo llevaron ante Ibn Ziyad, quien ordenó que lo subieran a lo alto del palacio y le dijo a Bukayr ibn Humran al-Ahmari, quien había sido golpeado por Muslim, que le golpeara el cuello, y así lo hizo {cite:bakr-umayyad-state-1134715 p. 184-185}. Hani ibn Urwa fue llevado al mercado y le golpearon el cuello a sangre fría {cite:bakr-umayyad-state-1134715 p. 184}. Ibn Ziyad ordenó que el cuerpo de Muslim fuera crucificado y su cabeza enviada a Damasco; fue el primero de los Banu Hashim en ser crucificado y la primera cabeza de ellos en ser llevada a Damasco {cite:bakr-umayyad-state-1134715 p. 185}. El libro señala que su aparición fue el martes, ocho noches después del inicio de Dhu'l-Hijja, aunque algunos dicen que fue el día de Arafa, nueve días después {cite:bakr-umayyad-state-1134715 p. 185}."
  fr: "Muslim ibn Aqil apparut à Kufa en Dhu al-Hijja de l'an 60, et environ douze mille hommes lui prêtèrent allégeance, bien que certains avancent le chiffre de dix-huit mille {cite:bakr-umayyad-state-1134715 p. 180}. Lorsqu'Ubayd Allah ibn Ziyad frappa Hani ibn Urwa d'un coup de canne et ordonna son emprisonnement, Muslim proclama le cri de ralliement « Ya Mansur ! » et dix-huit mille hommes se rallièrent à lui {cite:bakr-umayyad-state-1134715 p. 183}. La plupart d'entre eux se dispersèrent ensuite lorsque Ibn Ziyad l'assiégea dans le palais; il resta avec une centaine d'hommes, puis avec seulement trois {cite:bakr-umayyad-state-1134715 p. 183}. Muhammad ibn al-Ash'ath lui accorda un sauf-conduit après qu'il eut combattu jusqu'à être grièvement blessé. Il fut ensuite amené auprès d'Ibn Ziyad, qui ordonna de le conduire au sommet du palais et chargea Bukayr ibn Humran al-Ahmari, qui avait été frappé par Muslim, de lui trancher la nuque, ce qu'il fit (cite:bakr-umayyad-state-1134715 p. 184-185). Hani ibn Urwa fut conduit au marché et son cou fut transpercé de sang-froid (cite:bakr-umayyad-state-1134715 p. 184). Ibn Ziyad ordonna que le corps de Muslim soit crucifié et que sa tête soit envoyée à Damas; il fut le premier des Banu Hashim à être crucifié et la première tête des leurs à être transportée à Damas (cite:bakr-umayyad-state-1134715 p. 185). Le livre note que son apparition a eu lieu le mardi, huit nuits après le début de Dhu'l-Hijja, bien que certains disent que c'était le jour d'Arafa, neuf jours après le début de celui-ci {cite:bakr-umayyad-state-1134715 p. 185}."
  ur: "مسلم بن عقیل 60 ذی الحجہ کو کوفہ میں نمودار ہوئے اور تقریباً بارہ ہزار آدمیوں نے ان کی بیعت کی، حالانکہ بعض کہتے ہیں اٹھارہ ہزار 180}۔ جب عبید اللہ ابن زیاد نے ہانی بن عروہ کو چھڑی سے مارا اور اسے قید کرنے کا حکم دیا تو مسلم نے 'یا منصور' کا نعرہ لگایا اور اٹھارہ ہزار آدمی اس کے پاس جمع ہو گئے۔ 183}۔ جب ابن زیاد نے اسے محل میں گھیر لیا تو ان میں سے اکثر اس سے منتشر ہو گئے۔ وہ تقریباً ایک سو آدمیوں کے ساتھ رہا، پھر تین کے ساتھ۔ 183}۔ محمد بن اشعث نے اسے بری طرح سے زخمی ہونے تک لڑنے کے بعد محفوظ سلوک عطا کیا۔ اس کے بعد اسے ابن زیاد کے پاس لایا گیا، اس نے حکم دیا کہ اسے محل کی چوٹی پر لے جایا جائے اور بکر بن حمران الاحمری سے کہا، جسے مسلمان نے مارا تھا، اس کی گردن مارو، اور اس نے ایسا ہی کیا۔ 184-185}۔ ہانی بن عروہ کو بازار میں لے جایا گیا اور اس کی گردن ٹھنڈے پیٹوں ماری گئی۔ 184}۔ ابن زیاد نے مسلم کی لاش کو سولی پر چڑھانے اور اس کا سر دمشق بھیجنے کا حکم دیا۔ وہ بنو ہاشم کا پہلا شخص تھا جسے سولی پر چڑھایا گیا تھا اور ان کا پہلا سر تھا جسے دمشق لے جایا گیا تھا۔ 185}۔ کتاب میں بتایا گیا ہے کہ ان کا ظہور منگل کے دن یعنی ذی الحجہ کی آٹھ راتوں میں ہوا، حالانکہ بعض کہتے ہیں کہ عرفہ کے دن تھا، اس میں نو دن تھے۔ 185}۔"
  tr: "Müslim ibn Akil, altmışıncı yılın Zilhicce ayında Kufe'de ortaya çıktı ve yaklaşık on iki bin, hatta on sekiz bin kişi ona biat etti. Ubeydullah ibn Ziyad, Hani ibn Urva'yı bir sopayla vurup hapse attırdığında, Müslim \"Ey Muzaffer Olan!\" diye bağırdı ve on sekiz bin kişi onun etrafında toplandı. Sonra İbn Ziyad onu sarayda kuşattığında çoğu dağıldı, böylece önce yaklaşık yüz, sonra üç kişiyle kaldı. Muhammed ibn el-Eş'at, ağır yaralanana kadar savaştıktan sonra ona güvenli geçiş sağladı. Sonra İbn Ziyad onu huzuruna getirdi ve sarayın tepesine götürülmesini emretti. Müslim tarafından vurulan Bakir ibn Humran el-Ahmari'ye onu başını kesmesini söyledi ve o da öyle yaptı. Hani ibn Urva çarşıya götürüldü ve başı kesildi. İbn Ziyad, Müslim'in cesedinin çarmıha gerilmesini emretti ve başı Şam'a götürüldü. Beni Haşim kabilesinden çarmıha gerilen ilk kişi ve Şam'a götürülen ilk liderleriydi. Kitapta, Zilhicce ayının sekizinci gecesi Salı günü ortaya çıktığı ve dokuzuncu gecesi Arafat günü olduğu söylenmektedir. {cite:bakr-umayyad-state-1134715 s. 185}"
  id: "Muslim ibn Aqil muncul di Kufa pada bulan Dzul Hijjah tahun 60, dan sekitar dua belas ribu, atau konon delapan belas ribu, menyatakan baiat kepadanya. Ketika Ubayd Allah ibn Ziyad memukul Hani ibn Urwa dengan tongkat dan memerintahkannya dipenjarakan, Muslim meneriakkan slogan “Wahai Sang Penakluk!” dan delapan belas ribu orang berkumpul kepadanya. Kemudian sebagian besar dari mereka meninggalkannya ketika Ibn Ziyad mengepungnya di istana, sehingga ia hanya tinggal bersama sekitar seratus orang, lalu tiga orang. Muhammad ibn al-Ash'ath memberinya jalan aman setelah ia bertempur hingga terluka parah. Kemudian Ibn Ziyad membawanya ke hadapannya dan memerintahkannya untuk dibawa ke puncak istana. Ia menyuruh Bakir ibn Humran al-Ahmari, yang telah dipukul oleh Muslim, untuk memenggal kepalanya, dan ia melakukannya. Hani ibn Urwa dibawa ke pasar dan dipenggal kepalanya. Ibn Ziyad memerintahkan jenazah Muslim untuk disalibkan, dan kepalanya dibawa ke Damaskus. Dia adalah orang pertama dari Bani Hasyim yang disalib dan kepala pertama mereka yang dibawa ke Damaskus. Kitab tersebut menyatakan bahwa penampakannya terjadi pada hari Selasa, delapan malam setelah bulan Dzul Hijjah, dan dikatakan terjadi pada hari Arafah, sembilan malam setelahnya. {cite:bakr-umayyad-state-1134715 p. 185}."
