label:
  ar: "رحلة الثعالبي إلى بخارى في أيام السامانيين الأخيرة، نحو ٣٨٩هـ"
  en: "Al-Tha'alibi's journey to Bukhara in the Samanids' last days, c. 389/999"
  ur: "سامانیوں کے آخری ایام میں ثعالبی کا بخارا کا سفر، تقریباً 389ھ/999ء"
summary:
  ar: "رحل الثعالبي باكراً إلى بخارى إبان الاحتضار الأخير للدولة السامانية التي خلفها محمود الغزنوي {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}؛ وانتهى الأمر بالسامانيين سنة ٣٨٩هـ حين دخل محمود وإيلك خان البلاد {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}."
  en: "Early in his career al-Tha'alibi journeyed to Bukhara during the death throes of the Samanid dynasty which Mahmud of Ghazna was to supersede {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}; the Samanids ended in 389/999 when Mahmud and the Ilig Khan partitioned their realm {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}."
  ur: "ابتدائی دور میں ثعالبی نے بخارا کا سفر کیا اس وقت جب سامانی سلطنت اپنے آخری ایام گزار رہی تھی جس کی جگہ محمود غزنوی نے لی {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}؛ سامانیوں کا خاتمہ 389ھ/999ء میں ہوا جب محمود اور ایلک خان نے ان کی ریاست بانٹ لی {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}۔"
