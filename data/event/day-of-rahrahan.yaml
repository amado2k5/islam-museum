id: event/day-of-rahrahan
class: event
kind: battle
label: { ar: "يوم رحرحان", en: "The Day of Rahrahan", es: "El día de Rahrahan", fr: "Le jour de Rahrahan", ur: "رہرہان کا دن", tr: "Rahrahan Günü", id: "Hari Rahrahan" }
summary:
  ar: "يوم من أيام العرب بين بني عامر بن صعصعة وبني دارم بن مالك من تميم؛ سببه أن خالد بن جعفر الكلابي حارب بني عبس وقتل مع أصحابه سيدهم زهير بن جذيمة ثم استجار بالنعمان، فضمن الحارث بن ظالم لغطفان أن يفتك بخالد فقتله غيلة عند النعمان وآواه معبد بن زرارة، فخرج الأحوص بن جعفر ببني عامر يريد بني دارم فالتقوا برحرحان فاقتتلوا وطُعن معبد بن زرارة في كدرة الخيل فأسره عضروط لعامر والطفيل ابنا مالك من غني وأثاباه عشرين بعيراً {cite:ansab-al-ashraf p. 40-41}."
  en: "The day of Rahrahan between Banu Amir and the Darim of Tamim: after al-Harith ibn Zalim's treacherous murder of Khalid ibn Ja'far — sheltered by Ma'bad ibn Zurara — al-Ahwas led Banu Amir to the reckoning, and Ma'bad himself was dragged wounded from the horse-dust by two Ghanni clients {cite:ansab-al-ashraf p. 40-41}."
  es: "El día de Rahrahan entre Banu Amir y el Darim de Tamim: después del traicionero asesinato de Khalid ibn Ja'far por parte de al-Harith ibn Zalim —protegido por Ma'bad ibn Zurara— al-Ahwas llevó a Banu Amir al ajuste de cuentas, y el propio Ma'bad fue arrastrado herido del polvo de caballo por dos clientes de Ghanni {cite:ansab-al-ashraf p. 40-41}."
  fr: "Le jour de Rahrahan entre Banu Amir et le Darim de Tamim: après le meurtre perfide de Khalid ibn Ja'far par al-Harith ibn Zalim — abrité par Ma'bad ibn Zurara — al-Ahwas a conduit Banu Amir au jugement, et Ma'bad lui-même a été tiré blessé de la poussière par deux clients Ghanni {cite:ansab-al-ashraf p. 40-41}."
  ur: "بنو عامر اور تمیم کے داریم کے درمیان رہرہان کا دن: حارث بن ظالم کے خالد بن جعفر کے غدارانہ قتل کے بعد - معبد بن زرارہ کی پناہ میں - الاحواس نے بنو عامر کو حساب کتاب تک پہنچایا، اور معبد خود دو موکلوں کو گھسیٹ کر گھسیٹ کر گھسیٹ کر لے گیا تھا۔ {حوالہ: انساب الاشرف ص۔ 40-41}۔"
  tr: "Arapların günlerinden birinde Beni Amir bin Sa'sa'ah ile Beni Darim bin Malik Tamim arasında bir çatışma yaşandı; bunun sebebi Halid bin Cafer el-Kilabi'nin Beni Abs ile savaşması ve arkadaşlarıyla birlikte liderleri Zuhair bin Judhaymah'ı öldürmesiydi. Sonra Numan'a sığındı, bunun üzerine Harith bin Zalim, Ghatafan'a Halid'i öldüreceğine dair güvence verdi ve onu Numan'ın yanında haince öldürdü. Ma'bad bin Zurarah da ona sığınak buldu. Bunun üzerine Ahvas bin Cafer, Beni Darim'e saldırmak amacıyla Beni Amir ile birlikte yola çıktı. Rahrahan'da karşılaştılar ve savaştılar. Ma'bad bin Zurarah, atların arasında bıçaklandı. Bunun üzerine Adhrut, onu Amir ve Gani'li Malik'in iki oğlu el-Tufayl için esir aldı ve ona yirmi deveyle ödüllendirdiler. {Kaynak: ansab-al-ashraf s. 40-41}"
  id: "Suatu hari di zaman Arab, terjadi pertempuran antara Bani Amir bin Sa’sa’ah dan Bani Darim bin Malik dari Tamim; alasannya adalah Khalid bin Ja’far al-Kilabi berperang melawan Bani Abs dan bersama para pengikutnya membunuh pemimpin mereka, Zuhair bin Judhaymah, kemudian ia mencari perlindungan kepada al-Nu’man, sehingga al-Harith bin Zalim menjamin kepada Ghatafan bahwa ia akan membunuh Khalid, lalu ia membunuhnya secara khianat di tempat al-Nu’man, dan Ma’bad bin Zurarah melindunginya, sehingga al-Ahwas bin Ja’far pergi bersama Bani Amir dengan maksud menyerang Bani Darim, lalu mereka bertemu di Rahrahan dan berperang, dan Ma’bad bin Zurarah ditikam di tengah-tengah kuda, sehingga Adhrut menangkapnya untuk Amir dan al-Tufayl, dua putra Malik dari Ghani, dan mereka memberinya hadiah berupa dua puluh unta {kutipan:ansab-al-ashraf hlm. 40-41}."
