label: { ar: "يوم رحرحان" }
summary:
  ar: "يوم من أيام العرب بين بني عامر بن صعصعة وبني دارم بن مالك من تميم؛ سببه أن خالد بن جعفر الكلابي حارب بني عبس وقتل مع أصحابه سيدهم زهير بن جذيمة ثم استجار بالنعمان، فضمن الحارث بن ظالم لغطفان أن يفتك بخالد فقتله غيلة عند النعمان وآواه معبد بن زرارة، فخرج الأحوص بن جعفر ببني عامر يريد بني دارم فالتقوا برحرحان فاقتتلوا وطُعن معبد بن زرارة في كدرة الخيل فأسره عضروط لعامر والطفيل ابنا مالك من غني وأثاباه عشرين بعيراً {cite:ansab-al-ashraf p. 40-41}."
  en: "The day of Rahrahan between Banu Amir and the Darim of Tamim: after al-Harith ibn Zalim's treacherous murder of Khalid ibn Ja'far — sheltered by Ma'bad ibn Zurara — al-Ahwas led Banu Amir to the reckoning, and Ma'bad himself was dragged wounded from the horse-dust by two Ghanni clients {cite:ansab-al-ashraf p. 40-41}."
