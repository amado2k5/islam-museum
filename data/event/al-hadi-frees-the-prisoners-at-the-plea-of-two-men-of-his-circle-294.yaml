id: event/al-hadi-frees-the-prisoners-at-the-plea-of-two-men-of-his-circle-294
class: event
kind: other
label:
  ar: "إطلاق الهادي الأسرى بشفاعة رجلين من خاصته، سنة 294هـ، ص347"
  en: "Al-Hadi frees the prisoners at the plea of two men of his circle, 294 AH, p. 347"
  ur: "ہادی کا اپنے دو قریبی ساتھیوں کی سفارش پر قیدیوں کو رہا کرنا، 294ھ، ص347"
  es: "Al-Hadi libera a los prisioneros a petición de dos hombres de su círculo, 294 AH, pág. 347."
  fr: "Al-Hadi libère les prisonniers à la demande de deux hommes de son entourage, 294 AH, p. 347"
  tr: "Al-Hadi, yakın arkadaşlarından ikisinin arabuluculuğuyla, Hicri 294 yılında tutsakları serbest bıraktı (s. 347)."
  id: "Al-Hadi membebaskan para tahanan melalui perantaraan dua sahabat dekatnya, pada tahun 294 H, hlm. 347"
summary:
  ar: "شفع محمد بن الهيثم وأحمد بن الأربد المسربالي في عبد الله بن موسى الدهف العمري وأصحابه وفي الجاسيين، فأطلقهم الهادي، فصار أهل الحدث كلهم في وادي نجران وازدادوا حنقاً."
  en: "Muhammad ibn al-Haytham and Ahmad ibn al-Arbad al-Masrabani, who had shown loyalty to al-Hadi, pleaded for Abdallah ibn Musa al-Dahhaf al-Amri, his companions and the men of the Jasiyin. Al-Hadi freed them. The men of trouble then gathered in Wadi Najran and grew more resentful."
  ur: "محمد بن الہیثم اور احمد بن الاربد المسربانی نے، جو ہادی کے خیرخواہ تھے، عبداللہ بن موسیٰ الدہف العمری، اس کے ساتھیوں اور جاسیین کی سفارش کی۔ ہادی نے انہیں رہا کیا، مگر فتنہ انگیز لوگ وادی نجران میں جمع ہو کر مزید برہم ہو گئے۔"
  es: "Muhammad ibn al-Haytham y Ahmad ibn al-Arbad al-Masrabani, quienes habían demostrado lealtad a al-Hadi, intercedieron por Abdallah ibn Musa al-Dahhaf al-Amri, sus compañeros y los hombres de Jasiyin. Al-Hadi los liberó. Los hombres problemáticos se reunieron entonces en Wadi Najran y su resentimiento aumentó."
  fr: "Muhammad ibn al-Haytham et Ahmad ibn al-Arbad al-Masrabani, fidèles à al-Hadi, plaidèrent en faveur d'Abdallah ibn Musa al-Dahhaf al-Amri, de ses compagnons et des hommes de la tribu des Jasiyin. Al-Hadi les libéra. Les rebelles se rassemblèrent alors à Wadi Najran et leur ressentiment s'accrut."
  tr: "Muhammed ibn el-Haytham ve Ahmed ibn el-Arbad el-Musarbali, Abdullah ibn Musa el-Dahf el-Umari ve arkadaşları ile Yasiyanlar adına şefaat ettiler ve böylece el-Hadi onları serbest bıraktı. El-Hadath halkının tamamı Necran Vadisi'ndeydi ve daha da öfkelendiler."
  id: "Muhammad ibn al-Haytham dan Ahmad ibn al-Arbad al-Musarbali menjadi perantara bagi Abdullah ibn Musa al-Dahf al-Umari dan para sahabatnya serta kaum Jasian, sehingga al-Hadi membebaskan mereka. Seluruh penduduk al-Hadath berada di Lembah Najran dan menjadi semakin marah."
