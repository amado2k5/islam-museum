label: { ar: "سقوط المرية بيد النصارى سنة ٥٤٢" }
summary:
  ar: "دخل العدو مدينة المرية يوم الجمعة السابع عشر من جمادى الأولى سنة اثنتين وأربعين وخمسمائة عنوة، وأحصي عدد من سبي من أبكارها فكان أربعة عشر ألفاً {cite:nafh-tib-maqqari p. 466-467}. وقال ابن حبيش آخر الحفاظ بالأندلس: كنت في قلعة المرية لما وقع الاستيلاء عليها فتقدمت إلى زعيم الروم السليطين وهو ابن بنت الأذفونش وقلت له إني أحفظ نسبك منك إلى هرقل فقال لي قل فذكرته له فقال لي اخرج أنت وأهلك ومن معك طلقاء بلا شيء {cite:nafh-tib-maqqari p. 467}. واستشهد فيها الرشاطي الإمام صاحب كتاب اقتباس الأنوار {cite:nafh-tib-maqqari p. 466}. ثم استنقذها الله على يد الموحدين؛ أقبل إليها أبو حفص وأبو سعيد ابنا أمير المؤمنين فحصرا النصارى بها وزحف إليهما ابن مردنيش ملك شرق الأندلس محارباً لهما فكانا يقاتلان النصارى والمسلمين داخلاً وخارجاً حتى رأى ابن مردنيش العار على نفسه في قتالهم وهم يقاتلون النصارى فارتحل فدخل الموحدون المدينة {cite:nafh-tib-maqqari p. 467}."
  en: "The sack of Almeria (Friday 17 Jumada I 542): the Castilian-Genoese force under Alfonso VII — 'the emperor, son of Alfonso's daughter' — stormed the harbour city and carried off fourteen thousand maidens alone; the hafiz Ibn Hubaysh won his household's freedom by reciting the emperor's pedigree back to Heraclius, and the traditionist al-Rushati was martyred in its fall. The Almohads Abd al-Mu'min's sons recovered it — fighting Christians within and Ibn Mardanish without until he withdrew in shame at fighting men who fought the Christians {cite:nafh-tib-maqqari p. 466-467}."
