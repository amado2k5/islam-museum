id: event/fall-of-almeria-542
class: event
kind: conquest
label: { ar: "سقوط المرية بيد النصارى سنة ٥٤٢", en: "The fall of Almeria to the Christians, 542 AH", es: "La caída de Almería en manos de los cristianos, 542 d. C.", fr: "La chute d'Almeria aux mains des chrétiens, 542 AH", ur: "المیریا کا عیسائیوں کے ہاتھوں زوال، 542ھ" }
summary:
  ar: "دخل العدو مدينة المرية يوم الجمعة السابع عشر من جمادى الأولى سنة اثنتين وأربعين وخمسمائة عنوة، وأحصي عدد من سبي من أبكارها فكان أربعة عشر ألفاً {cite:nafh-tib-maqqari p. 466-467}. وقال ابن حبيش آخر الحفاظ بالأندلس: كنت في قلعة المرية لما وقع الاستيلاء عليها فتقدمت إلى زعيم الروم السليطين وهو ابن بنت الأذفونش وقلت له إني أحفظ نسبك منك إلى هرقل فقال لي قل فذكرته له فقال لي اخرج أنت وأهلك ومن معك طلقاء بلا شيء {cite:nafh-tib-maqqari p. 467}. واستشهد فيها الرشاطي الإمام صاحب كتاب اقتباس الأنوار {cite:nafh-tib-maqqari p. 466}. ثم استنقذها الله على يد الموحدين؛ أقبل إليها أبو حفص وأبو سعيد ابنا أمير المؤمنين فحصرا النصارى بها وزحف إليهما ابن مردنيش ملك شرق الأندلس محارباً لهما فكانا يقاتلان النصارى والمسلمين داخلاً وخارجاً حتى رأى ابن مردنيش العار على نفسه في قتالهم وهم يقاتلون النصارى فارتحل فدخل الموحدون المدينة {cite:nafh-tib-maqqari p. 467}."
  en: "The sack of Almeria (Friday 17 Jumada I 542): the Castilian-Genoese force under Alfonso VII — 'the emperor, son of Alfonso's daughter' — stormed the harbour city and carried off fourteen thousand maidens alone; the hafiz Ibn Hubaysh won his household's freedom by reciting the emperor's pedigree back to Heraclius, and the traditionist al-Rushati was martyred in its fall. The Almohads Abd al-Mu'min's sons recovered it — fighting Christians within and Ibn Mardanish without until he withdrew in shame at fighting men who fought the Christians {cite:nafh-tib-maqqari p. 466-467}."
  es: "El saqueo de Almería (viernes 17 de Jumada I de 542): las fuerzas castellano-genovesas al mando de Alfonso VII —«el emperador, hijo de la hija de Alfonso»— asaltaron la ciudad portuaria y se llevaron catorce mil doncellas; el hafiz Ibn Hubaysh consiguió la libertad de su familia recitando el linaje del emperador a Heraclio, y el tradicionalista al-Rushati fue martirizado en su caída. Los hijos de Abd al-Mu'min, de los almohades, la recuperaron, combatiendo a los cristianos en el interior e Ibn Mardanish en el exterior, hasta que este se retiró avergonzado por luchar contra quienes combatían a los cristianos {cite:nafh-tib-maqqari p. 466-467}."
  fr: "Le sac d'Almeria (vendredi 17 Jumada I 542): les troupes castillanes et génoises d'Alphonse VII – « l'empereur, fils de la fille d'Alphonse » – prirent d'assaut la ville portuaire et emmenèrent quatorze mille jeunes filles. Le hafiz Ibn Hubaysh obtint la liberté de sa famille en retraçant la généalogie de l'empereur jusqu'à Héraclius, et le traditionniste al-Rushati fut martyrisé lors de la chute d'Almeria. Les fils d'Abd al-Mu'min, sous domination almohade, reprirent la ville, combattant les chrétiens à l'intérieur et Ibn Mardanish à l'extérieur, jusqu'à ce que ce dernier, honteux d'avoir combattu des hommes qui avaient combattu les chrétiens, se retire. (Voir: Nafh-Tib-Maqqari, p. 466-467)."
  ur: "المیریا کی بوری ⁦(جمعہ 17 جمادی الثانی 542)⁩: الفانسو VII کے تحت کیسٹیلین-جینوس فورس - 'شہنشاہ، الفانسو کی بیٹی کا بیٹا' - نے بندرگاہ کے شہر پر حملہ کیا اور چودہ ہزار کنواریوں کو اکیلے لے گئے۔ حافظ ابن حبیش نے شہنشاہ کا شجرہ نسب ہرقل کو واپس سنا کر اپنے گھر کی آزادی حاصل کی، اور روایت کرنے والے الرشتی اس کے زوال میں شہید ہو گئے۔ المحدث عبد المومن کے بیٹوں نے اسے دوبارہ حاصل کر لیا - اندر کے عیسائیوں سے اور ابن مردانش کے ساتھ اس وقت تک لڑتے رہے جب تک کہ وہ عیسائیوں سے لڑنے والے مردوں سے لڑنے پر شرم سے پیچھے نہ ہٹے۔ 466-467}۔"
