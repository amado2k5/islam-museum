label: { ar: "مناظرة عمر بن عبد العزيز مع الخوارج", en: "Umar ibn Abd al-Aziz's Debate with the Kharijites", es: "El debate de Umar ibn Abd al-Aziz con los jarijitas", fr: "Le débat d'Umar ibn Abd al-Aziz avec les Kharijites" }
summary:
  ar: "في خلافة عمر بن عبد العزيز خرج شوذب الخارجي بالجزيرة في جماعة من المحكّمة من ربيعة وغيرها، فأرسل إليهم عمر محمد بن الزبير الحنظلي وعون بن عبد الله بن عتبة بن مسعود بكتاب {cite:bakr-umayyad-state-1134715 p. 267-268}. فبعثوا معهما رجلين أحدهما من بني شيبان، والآخر وصفه الكتاب بأن فيه حبشية، فاستجوبهما عمر في مجلسه بخناصرة، وكان ذلك بعد أن فتشهما لئلا يكون معهما حديد {cite:bakr-umayyad-state-1134715 p. 268}. وحاجّهما عمر بأن أبا بكر وعمر، اللذين يتولاهما الخوارج، أقرّا قتال المرتدين وسبي الذراري ثم ردّ عمر السبايا، وأن أهل النهروان والكوفة والبصرة تقاتلوا وقتل بعضهم بعضاً، ثم سألهما: هل يجوز لعن أهل الذنوب فريضة، وهل يسعهما لعن أهل بيته والتبرؤ منهم، والدين واحد {cite:bakr-umayyad-state-1134715 p. 268-270}. فقال الحبشي: «ما سمعت كاليوم قط حجة أبين وأقرب مأخذاً من حجتك، أما أنا فأشهد أنك على الحق وأنا برئ ممن برئ منك». وقال الشيباني إنه لا يفتات على المسلمين بأمر يعرض قوله عليهم، فانصرف عمر وأقام الحبشي وأعطاه عطاءه، فمات بعد خمسة عشر يوماً، ولحق الشيباني بأصحابه فقُتل معهم بعد موت عمر {cite:bakr-umayyad-state-1134715 p. 270}."
  en: "In the caliphate of Umar ibn Abd al-Aziz, Shawdhab the Kharijite rose in al-Jazira with a band of the Muhakkima from Rabi'a and others. Umar sent to them Muhammad ibn al-Zubayr al-Hanzali and Awn ibn Abd Allah ibn Utba ibn Mas'ud with a letter {cite:bakr-umayyad-state-1134715 p. 267-268}. They sent back two men with them, one of Banu Shayban and the other whom the book describes as Abyssinian. Umar questioned them in his majlis at Khunasira, after searching them to make sure they carried no iron {cite:bakr-umayyad-state-1134715 p. 268}. He argued against them that Abu Bakr and Umar, whom the Kharijites take as their leaders, had sanctioned fighting the apostates and taking captives, and that Umar later returned the captives; that the people of Nahrawan, Kufa and Basra fought one another and some killed others; and then asked them whether cursing the people of sin is a required duty, and whether they could curse his own household and disown them when the religion is one {cite:bakr-umayyad-state-1134715 p. 268-270}. The Abyssinian said he had never heard an argument so clear and so easily grasped as Umar's, that he bore witness Umar was in the right, and that he disowned whoever had disowned Umar. The Shaybani said he would not presume to decide for the Muslims on a matter without first putting his view to them. Umar left; the Abyssinian stayed, received his stipend, and died fifteen days later; the Shaybani rejoined his companions and was killed with them after Umar's death {cite:bakr-umayyad-state-1134715 p. 270}."
  es: "En el califato de Umar ibn Abd al-Aziz, Shawdhab el jariyita se alzó en al-Jazira con un grupo de los Muhakkima de Rabi'a y otros. Umar les envió a Muhammad ibn al-Zubayr al-Hanzali y a Awn ibn Abd Allah ibn Utba ibn Mas'ud con una carta {cite:bakr-umayyad-state-1134715 p. 267-268}. Ellos enviaron de vuelta a dos hombres, uno de Banu Shayban y el otro que el libro describe como abisinio. Umar los interrogó en su majlis en Khunasira, después de registrarlos para asegurarse de que no llevaran hierro {cite:bakr-umayyad-state-1134715 p. 268}. Argumentó contra ellos que Abu Bakr y Umar, a quienes los jariyitas consideran sus líderes, habían sancionado la lucha contra los apóstatas y la toma de cautivos, y que Umar luego devolvió a los cautivos; que la gente de Nahrawan, Kufa y Basora lucharon entre sí y algunos mataron a otros; y luego les preguntó si maldecir a la gente del pecado es un deber obligatorio, y si podían maldecir a su propia familia y repudiarlos cuando la religión es una sola {cite:bakr-umayyad-state-1134715 p. 268-270}. El abisinio dijo que nunca había escuchado un argumento tan claro y tan fácil de comprender como el de Umar, que atestiguaba que Umar tenía razón, y que repudiaba a cualquiera que hubiera repudiado a Umar. El shaybani dijo que no se atrevería a decidir por los musulmanes sobre un asunto sin antes presentarles su punto de vista. Umar se fue; el abisinio se quedó, recibió su estipendio y murió quince días después; El Shaybani se reunió con sus compañeros y murió con ellos tras la muerte de Umar {cite:bakr-umayyad-state-1134715 p. 270}."
  fr: "Sous le califat d'Umar ibn Abd al-Aziz, Shawdhab le Kharijite se souleva à al-Jazira avec un groupe de Muhakkima venus de Rabi'a et d'autres encore. Umar leur envoya Muhammad ibn al-Zubayr al-Hanzali et Awn ibn Abd Allah ibn Utba ibn Mas'ud, porteurs d'une lettre (voir: Bakr-Umayyad-State-1134715, p. 267-268). Ils renvoyèrent avec eux deux hommes, l'un des Banu Shayban et l'autre que l'ouvrage décrit comme Abyssin. Umar les interrogea dans son majlis à Khunasira, après les avoir fouillés pour s'assurer qu'ils ne portaient pas de fer (voir: Bakr-Umayyad-State-1134715, p. 268). Il leur rétorqua qu'Abou Bakr et Omar, que les Kharijites considéraient comme leurs chefs, avaient autorisé le combat contre les apostats et la capture de prisonniers, et qu'Omar avait ensuite rendu ces derniers; que les habitants de Nahrawan, Koufa et Bassora s'étaient affrontés et que certains s'étaient tués; puis il leur demanda si maudire les pécheurs était un devoir, et s'ils pouvaient maudire sa propre famille et la renier alors que la religion était une (cite: bakr-umayyad-state-1134715 p. 268-270). L'Abyssin déclara n'avoir jamais entendu d'argument aussi clair et aussi facile à comprendre que celui d'Omar, qu'il témoignait qu'Omar avait raison, et qu'il reniait quiconque l'avait renié. Le Shaybani affirma qu'il ne prétendait pas trancher pour les musulmans sur une question sans leur avoir d'abord exposé son point de vue. Omar partit; l'Abyssin resta, reçut sa pension et mourut quinze jours plus tard. Le Shaybani rejoignit ses compagnons et fut tué avec eux après la mort d'Umar {cite:bakr-umayyad-state-1134715 p. 270}."
