label: { ar: "مناظرة عمر بن عبد العزيز مع الخوارج" }
summary:
  ar: "في خلافة عمر بن عبد العزيز خرج شوذب الخارجي بالجزيرة في جماعة من المحكّمة من ربيعة وغيرها، فأرسل إليهم عمر محمد بن الزبير الحنظلي وعون بن عبد الله بن عتبة بن مسعود بكتاب {cite:bakr-umayyad-state-1134715 p. 267-268}. فبعثوا معهما رجلين أحدهما من بني شيبان، والآخر وصفه الكتاب بأن فيه حبشية، فاستجوبهما عمر في مجلسه بخناصرة، وكان ذلك بعد أن فتشهما لئلا يكون معهما حديد {cite:bakr-umayyad-state-1134715 p. 268}. وحاجّهما عمر بأن أبا بكر وعمر، اللذين يتولاهما الخوارج، أقرّا قتال المرتدين وسبي الذراري ثم ردّ عمر السبايا، وأن أهل النهروان والكوفة والبصرة تقاتلوا وقتل بعضهم بعضاً، ثم سألهما: هل يجوز لعن أهل الذنوب فريضة، وهل يسعهما لعن أهل بيته والتبرؤ منهم، والدين واحد {cite:bakr-umayyad-state-1134715 p. 268-270}. فقال الحبشي: «ما سمعت كاليوم قط حجة أبين وأقرب مأخذاً من حجتك، أما أنا فأشهد أنك على الحق وأنا برئ ممن برئ منك». وقال الشيباني إنه لا يفتات على المسلمين بأمر يعرض قوله عليهم، فانصرف عمر وأقام الحبشي وأعطاه عطاءه، فمات بعد خمسة عشر يوماً، ولحق الشيباني بأصحابه فقُتل معهم بعد موت عمر {cite:bakr-umayyad-state-1134715 p. 270}."
