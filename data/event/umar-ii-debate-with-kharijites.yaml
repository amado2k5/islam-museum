id: event/umar-ii-debate-with-kharijites
class: event
kind: other
label: { ar: "مناظرة عمر بن عبد العزيز مع الخوارج", en: "Umar ibn Abd al-Aziz's Debate with the Kharijites" }
summary:
  ar: "في خلافة عمر بن عبد العزيز خرج شوذب الخارجي بالجزيرة في جماعة من المحكّمة من ربيعة وغيرها، فأرسل إليهم عمر محمد بن الزبير الحنظلي وعون بن عبد الله بن عتبة بن مسعود بكتاب {cite:bakr-umayyad-state-1134715 p. 267-268}. فبعثوا معهما رجلين أحدهما من بني شيبان، والآخر وصفه الكتاب بأن فيه حبشية، فاستجوبهما عمر في مجلسه بخناصرة، وكان ذلك بعد أن فتشهما لئلا يكون معهما حديد {cite:bakr-umayyad-state-1134715 p. 268}. وحاجّهما عمر بأن أبا بكر وعمر، اللذين يتولاهما الخوارج، أقرّا قتال المرتدين وسبي الذراري ثم ردّ عمر السبايا، وأن أهل النهروان والكوفة والبصرة تقاتلوا وقتل بعضهم بعضاً، ثم سألهما: هل يجوز لعن أهل الذنوب فريضة، وهل يسعهما لعن أهل بيته والتبرؤ منهم، والدين واحد {cite:bakr-umayyad-state-1134715 p. 268-270}. فقال الحبشي: «ما سمعت كاليوم قط حجة أبين وأقرب مأخذاً من حجتك، أما أنا فأشهد أنك على الحق وأنا برئ ممن برئ منك». وقال الشيباني إنه لا يفتات على المسلمين بأمر يعرض قوله عليهم، فانصرف عمر وأقام الحبشي وأعطاه عطاءه، فمات بعد خمسة عشر يوماً، ولحق الشيباني بأصحابه فقُتل معهم بعد موت عمر {cite:bakr-umayyad-state-1134715 p. 270}."
  en: "In the caliphate of Umar ibn Abd al-Aziz, Shawdhab the Kharijite rose in al-Jazira with a band of the Muhakkima from Rabi'a and others. Umar sent to them Muhammad ibn al-Zubayr al-Hanzali and Awn ibn Abd Allah ibn Utba ibn Mas'ud with a letter {cite:bakr-umayyad-state-1134715 p. 267-268}. They sent back two men with them, one of Banu Shayban and the other whom the book describes as Abyssinian. Umar questioned them in his majlis at Khunasira, after searching them to make sure they carried no iron {cite:bakr-umayyad-state-1134715 p. 268}. He argued against them that Abu Bakr and Umar, whom the Kharijites take as their leaders, had sanctioned fighting the apostates and taking captives, and that Umar later returned the captives; that the people of Nahrawan, Kufa and Basra fought one another and some killed others; and then asked them whether cursing the people of sin is a required duty, and whether they could curse his own household and disown them when the religion is one {cite:bakr-umayyad-state-1134715 p. 268-270}. The Abyssinian said he had never heard an argument so clear and so easily grasped as Umar's, that he bore witness Umar was in the right, and that he disowned whoever had disowned Umar. The Shaybani said he would not presume to decide for the Muslims on a matter without first putting his view to them. Umar left; the Abyssinian stayed, received his stipend, and died fifteen days later; the Shaybani rejoined his companions and was killed with them after Umar's death {cite:bakr-umayyad-state-1134715 p. 270}."
