summary:
  ar: "حقق السعديون نصراً كبيراً على البرتغاليين وفتحوا حصن سانتا كروز — وكان الحاكم السعدي قد صار يملك المدفعية العثمانية والآلات الحربية وجنوداً مدربين، وظهرت تلك الإمدادات عند الحصار. ولما بلغ الملك البرتغالي جان الثالث الخبر أمر حاميتي آسفي وأزمور بالجلاء فوراً، وكتب إلى سفيره بمدريد رسالة في ٢٢ رمضان ٩٤٨هـ/ديسمبر ١٥٤١م يطلع بها شارل الخامس على أسباب القرار وأنه أمر بتحصين مازكان {cite:dawlat-uthmaniyya-salabi p. 227}."
  en: "The Sa'dis took the fortress of Santa Cruz — their ruler now fielding Ottoman-supplied artillery, war engines and drilled troops that showed at the siege. On the news João III ordered Safi and Azemmour evacuated at once, telling his Madrid ambassador in a letter of 22 Ramadan 948/December 1541 — for Charles V's eyes — that Mazagan would be fortified instead {cite:dawlat-uthmaniyya-salabi p. 227}."
