label: { ar: "فتح السعديين حصن سانتا كروز ⁦(٩٤٨هـ/١٥٤١م)⁩", en: "Sa'di capture of Santa Cruz (1541)", fr: "La prise saadienne de Santa Cruz (1541)", es: "Captura sa'dí de Santa Cruz (1541)" }
summary:
  ar: "حقق السعديون نصراً كبيراً على البرتغاليين وفتحوا حصن سانتا كروز — وكان الحاكم السعدي قد صار يملك المدفعية العثمانية والآلات الحربية وجنوداً مدربين، وظهرت تلك الإمدادات عند الحصار. ولما بلغ الملك البرتغالي جان الثالث الخبر أمر حاميتي آسفي وأزمور بالجلاء فوراً، وكتب إلى سفيره بمدريد رسالة في ٢٢ رمضان ٩٤٨هـ/ديسمبر ١٥٤١م يطلع بها شارل الخامس على أسباب القرار وأنه أمر بتحصين مازكان {cite:dawlat-uthmaniyya-salabi p. 227}."
  en: "The Sa'dis took the fortress of Santa Cruz — their ruler now fielding Ottoman-supplied artillery, war engines and drilled troops that showed at the siege. On the news João III ordered Safi and Azemmour evacuated at once, telling his Madrid ambassador in a letter of 22 Ramadan 948/December 1541 — for Charles V's eyes — that Mazagan would be fortified instead {cite:dawlat-uthmaniyya-salabi p. 227}."
  fr: "Les Saadiens prirent la forteresse de Santa Cruz, leur souverain alignant désormais une artillerie, des engins de guerre et des troupes exercées fournis par les Ottomans, qui se montrèrent lors du siège. À cette nouvelle, Jean III ordonna l'évacuation immédiate de Safi et d'Azemmour, écrivant à son ambassadeur à Madrid, dans une lettre du 22 Ramadan 948/décembre 1541 destinée à Charles Quint, que Mazagan serait fortifiée à la place {cite:dawlat-uthmaniyya-salabi p. 227}."
  es: "Los Sadíes tomaron la fortaleza de Santa Cruz; su gobernante ahora desplegaba artillería, máquinas de guerra y tropas entrenadas suministradas por los otomanos, las mismas que se habían presentado en el asedio. Al enterarse de la noticia, Juan III ordenó la evacuación inmediata de Safi y Azemmour, y le comunicó a su embajador en Madrid, en una carta del 22 de Ramadán de 948/diciembre de 1541 —dirigida a Carlos V—, que Mazagan sería fortificada en su lugar {cite:dawlat-uthmaniyya-salabi p. 227}."
