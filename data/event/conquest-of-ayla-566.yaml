label: { ar: "فتح صلاح الدين أيلة", en: "Saladin's Conquest of Ayla" }
summary:
  ar: "في سنة ست وستين وخمسمائة سار صلاح الدين من مصر إلى بلاد الفرنج فأغار على أعمال عسقلان والرملة وهجم على ربض غزة فنهبها، وأتاه ملك الفرنج في قلة من العسكر فقاتلهم وهزمهم وأفلت الملك بعد أن شرف على الأسر، وعاد صلاح الدين إلى مصر فعمل مراكب مفصلة وحملها قطعاً على الجمال في البر حتى قصد أيلة، فجمع قطع المراكب وألقاها في البحر وحصر أيلة براً وبحراً، وفتحها في العشر الأول من ربيع الآخر واستباح أهلها وما فيها {cite:kamil-ibn-al-athir p. 31-32}."
  en: "In the year 566 Saladin marched from Egypt into Frankish lands and raided the districts of Ascalon and Ramla, then attacked the suburb of Gaza and plundered it. The king of the Franks came against him with a small force; he fought and defeated them, and the king escaped after coming close to capture. Saladin returned to Egypt, had ships made in sections and carried the pieces on camels overland until he reached Ayla. There he assembled the pieces, launched them on the sea, and besieged Ayla by land and sea. He took it in the first ten days of Rabi' II and gave its people and all that was in it to plunder {cite:kamil-ibn-al-athir p. 31-32}."
