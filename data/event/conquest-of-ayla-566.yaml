label: { ar: "فتح صلاح الدين أيلة", en: "Saladin's Conquest of Ayla", es: "La conquista de Ayla por Saladino", fr: "La conquête d'Ayla par Saladin" }
summary:
  ar: "في سنة ست وستين وخمسمائة سار صلاح الدين من مصر إلى بلاد الفرنج فأغار على أعمال عسقلان والرملة وهجم على ربض غزة فنهبها، وأتاه ملك الفرنج في قلة من العسكر فقاتلهم وهزمهم وأفلت الملك بعد أن شرف على الأسر، وعاد صلاح الدين إلى مصر فعمل مراكب مفصلة وحملها قطعاً على الجمال في البر حتى قصد أيلة، فجمع قطع المراكب وألقاها في البحر وحصر أيلة براً وبحراً، وفتحها في العشر الأول من ربيع الآخر واستباح أهلها وما فيها {cite:kamil-ibn-al-athir p. 31-32}."
  en: "In the year 566 Saladin marched from Egypt into Frankish lands and raided the districts of Ascalon and Ramla, then attacked the suburb of Gaza and plundered it. The king of the Franks came against him with a small force; he fought and defeated them, and the king escaped after coming close to capture. Saladin returned to Egypt, had ships made in sections and carried the pieces on camels overland until he reached Ayla. There he assembled the pieces, launched them on the sea, and besieged Ayla by land and sea. He took it in the first ten days of Rabi' II and gave its people and all that was in it to plunder {cite:kamil-ibn-al-athir p. 31-32}."
  es: "En el año 566, Saladino marchó desde Egipto hacia tierras francas y saqueó los distritos de Ascalón y Ramla. Luego atacó el suburbio de Gaza y lo expolió. El rey de los francos le arrebató un pequeño ejército; Saladino luchó contra ellos y los derrotó, y el rey escapó tras estar a punto de ser capturado. Saladino regresó a Egipto, mandó construir barcos por secciones y transportó las piezas en camellos por tierra hasta llegar a Ayla. Allí ensambló las piezas, las botó al mar y sitió Ayla por tierra y mar. La conquistó en los primeros diez días de Rabi' II y entregó a sus habitantes y todo lo que contenía para que lo saquearan {cite:kamil-ibn-al-athir p. 31-32}."
  fr: "En 566, Saladin marcha d'Égypte vers les terres franques et pilla les districts d'Ascalon et de Ramla, puis attaqua la banlieue de Gaza et la saccagea. Le roi des Francs se dressa contre lui avec une petite armée; Saladin les combattit et les vainquit, et le roi parvint à s'échapper après avoir échappé de justesse à la capture. De retour en Égypte, Saladin fit construire des navires par sections et transporta les pièces à dos de chameau jusqu'à Aïla. Là, il assembla les navires, les lança à la mer et assiégea Aïla par terre et par mer. Il s'en empara durant les dix premiers jours de Rabi' II et livra ses habitants et tout ce qu'ils contenaient au pillage (voir: Kamil ibn al-Athir, p. 31-32)."
