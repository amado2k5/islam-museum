id: event/uthman-settlement-with-delegations
class: event
kind: treaty
label: { ar: "صلح عثمان مع وفود الأمصار في ذي المروة", en: "Uthman's settlement with the provincial delegations at Dhu al-Marwa", es: "El acuerdo de Uthman con las delegaciones provinciales en Dhu al-Marwa", fr: "L'accord d'Uthman avec les délégations provinciales à Dhu al-Marwa", ur: "ذی المروہ میں عثمان کی صوبائی وفود سے ملاقات", tr: "Osman, Zülmerve'de eyaletlerden gelen heyetlerle barış anlaşması yaptı.", id: "Uthman berdamai dengan delegasi dari berbagai provinsi di Dhu al-Marwa." }
summary:
  ar: "نزل المتمردون من أهل الأمصار في ذي المروة قبل مقتل عثمان بنحو شهر ونصف، فأرسل إليهم عثمان علياً ورجلاً آخر، فعرض عليهم كتاب الله فقبلوا؛ ثم اصطلحوا معه على خمسة أمور، منها أن يُردّ المنفي، ويُعطى المحروم، ويوفر الفيء، ويعدل في الرعية، وأن يبقى أبو موسى على الكوفة؛ ثم صالح عثمان كل وفد على حدة وانصرفت الوفود إلى ديارها ⁦(ص163-164)⁩."
  tr: "Şehirlerden gelen isyancılar, Osman'ın öldürülmesinden yaklaşık bir buçuk ay önce Zülmerve'ye saldırdılar. Osman, Ali'yi ve başka bir adamı onlara gönderdi ve onlara Allah'ın Kitabını sundu; onlar da kitabı kabul ettiler. Sonra beş konuda onunla barıştılar; bunlar arasında sürgün edilenlerin geri gönderilmesi, mahrum bırakılanlara verilmesi, ganimetlerin bollaştırılması, tebaa arasında adaletin sağlanması ve Ebu Musa'nın Kufe'de kalması yer alıyordu. Daha sonra Osman her heyetle ayrı ayrı barıştı ve heyetler evlerine döndüler (s. 163-164)."
  id: "Para pemberontak dari kota-kota menyerbu Dhu al-Marwa sekitar satu setengah bulan sebelum pembunuhan Utsman. Utsman mengutus Ali dan seorang lainnya kepada mereka, dan ia mempersembahkan Kitab Allah kepada mereka, dan mereka menerimanya. Kemudian mereka berdamai dengannya dalam lima hal, termasuk bahwa orang-orang yang diasingkan dikembalikan, orang-orang yang dirampas haknya diberikan, rampasan perang diperbanyak, keadilan ditegakkan di antara rakyat, dan Abu Musa tetap tinggal di Kufa. Kemudian Utsman berdamai dengan setiap delegasi secara terpisah, dan delegasi-delegasi tersebut kembali ke rumah mereka masing-masing (hlm. 163-164)."
