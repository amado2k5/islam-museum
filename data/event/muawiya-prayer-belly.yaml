label: { ar: "دعوة لا شبع الله بطنه على معاوية", en: "The Prayer that Answered on Mu'awiya", es: "La oración que fue respondida en Mu'awiya", fr: "La prière exaucée sur Mu'awiya" }
summary:
  ar: "كتب معاوية لرسول الله عام الفتح ودعاه يوماً وهو يأكل فأبطأ فقال لا شبع الله بطنه فكان معاوية يقول لحقتني دعوة رسول الله وكان يأكل في اليوم سبع أكلات وأكثر وأقل."
  en: "Mu'awiya wrote for the Prophet in the Year of the Conquest; called to him one day while eating he delayed, and he said 'may God not fill his belly' — 'the Prophet's prayer caught me', Mu'awiya said, who ate seven meals a day, more and less."
  es: "Mu'awiya escribió para el Profeta en el Año de la Conquista; un día, mientras comía, lo llamó y él se demoró, diciendo: \"Que Dios no le llene el estómago\". \"La oración del Profeta me alcanzó\", dijo Mu'awiya, quien comía siete comidas al día, más o menos."
  fr: "Mu'awiya écrivait pour le Prophète durant l'année de la Conquête; l'appelant un jour alors qu'il mangeait, il tarda, et il dit « que Dieu ne remplisse pas son ventre » — « la prière du Prophète m'a saisi », dit Mu'awiya, qui prenait sept repas par jour, plus ou moins."
