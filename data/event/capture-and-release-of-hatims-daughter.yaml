id: event/capture-and-release-of-hatims-daughter
class: event
kind: other
label: { ar: "أسر ابنة حاتم الطائي وإطلاقها", en: "The capture and release of Hatim al-Ta'i's daughter", fr: "La capture et la libération de la fille de Hatim al-Ta'i", es: "La captura y liberación de la hija de Hatim al-Ta'i", ur: "حاتم الطائی کی بیٹی کی گرفتاری اور رہائی" }
summary:
  ar: "أصابت خيل للنبي ابنة حاتم في سبايا طيء بعد هرب أخيها عدي إلى الشام، فحُبست في حظيرة بباب المسجد؛ كلّمت النبي ثلاثة أيام: هلك الوالد وغاب الوافد فامنن علي، فأشار إليها علي بن أبي طالب أن تكلّمه، فأطلقها النبي وأمرها ألا تخرج حتى تجد من قومها ثقة، ثم كساها وحملها وأعطاها نفقة فلحقت بأخيها بالشام."
  en: "A cavalry force of the Prophet took Hatim's daughter among the captives of Tayy after her brother Adi fled to Syria, and she was held in the enclosure by the mosque door. For three days she addressed the Prophet, the father is dead and the envoy absent, be gracious to me, until Ali ibn Abi Talib signalled her to speak again; the Prophet released her, told her to wait for trustworthy kin, then clothed her, mounted her and provisioned her, and she joined her brother in Syria."
  fr: "Un détachement de cavaliers du Prophète prit la fille de Hatim parmi les captifs de Tayy après que son frère Adi se fut enfui en Syrie, et elle fut gardée dans l'enclos près de la porte de la mosquée. Trois jours durant, elle s'adressa au Prophète : le père est mort et le garant absent, fais-moi grâce, jusqu'à ce qu'Ali ibn Abi Talib lui fasse signe de parler encore ; le Prophète la libéra, lui dit d'attendre des proches dignes de confiance, puis la vêtit, lui donna une monture et des provisions, et elle rejoignit son frère en Syrie."
  es: "Una caballería del Profeta capturó a la hija de Hatim entre los cautivos de Tayy después de que su hermano Adi huyera a Siria, y la retuvieron en el recinto junto a la puerta de la mezquita. Durante tres días, ella le suplicó al Profeta: «Mi padre ha muerto y el enviado está ausente; ten piedad de mí», hasta que Ali ibn Abi Talib le hizo una señal para que volviera a hablar. El Profeta la liberó, le dijo que esperara a un pariente de confianza, la vistió, la montó en un caballo y la alimentó, y ella se reunió con su hermano en Siria."
  ur: "حاتم کی بیٹی کو اس کے بھائی عدی کے فرار ہونے کے بعد نبی کی ایک گھڑسوار فوج نے طائی کے قیدیوں میں لے لیا اور اسے مسجد کے دروازے کے ساتھ احاطہ میں رکھا۔ تین دن تک اس نے پیغمبر کو مخاطب کیا، والد فوت ہوچکے ہیں اور ایلچی غائب ہے، مجھ پر رحم کرو، یہاں تک کہ علی ابن ابی طالب نے اسے دوبارہ بولنے کا اشارہ کیا۔ رسول اللہ نے اسے رہا کر دیا، اسے امانت دار رشتہ داروں کا انتظار کرنے کا حکم دیا، پھر اسے کپڑے پہنائے، اسے سوار کیا اور اس کا رزق دیا، اور وہ شام میں اپنے بھائی کے ساتھ مل گئی۔"
