label: { ar: "أسر ابنة حاتم الطائي وإطلاقها", en: "The capture and release of Hatim al-Ta'i's daughter" }
summary:
  ar: "أصابت خيل للنبي ابنة حاتم في سبايا طيء بعد هرب أخيها عدي إلى الشام، فحُبست في حظيرة بباب المسجد؛ كلّمت النبي ثلاثة أيام: هلك الوالد وغاب الوافد فامنن علي، فأشار إليها علي بن أبي طالب أن تكلّمه، فأطلقها النبي وأمرها ألا تخرج حتى تجد من قومها ثقة، ثم كساها وحملها وأعطاها نفقة فلحقت بأخيها بالشام."
  en: "A cavalry force of the Prophet took Hatim's daughter among the captives of Tayy after her brother Adi fled to Syria, and she was held in the enclosure by the mosque door. For three days she addressed the Prophet, the father is dead and the envoy absent, be gracious to me, until Ali ibn Abi Talib signalled her to speak again; the Prophet released her, told her to wait for trustworthy kin, then clothed her, mounted her and provisioned her, and she joined her brother in Syria."
