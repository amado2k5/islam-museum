id: event/abu-al-qasim-ibn-al-hadi-verses-on-the-sold-pledge-and-the-banu-tarif-290
class: event
kind: other
label:
  ar: "أبيات أبي القاسم في بيعة بيعت وبني طريف، ص260-261، 290هـ"
  en: "Abu al-Qasim's verses on the sold pledge and Banu Tarif, pp. 260-261, 290 AH"
  fr: "Vers d’Abu al-Qasim sur l’allégeance vendue et les Banu Tarif, p. 260-261, 290 de l’hégire"
  ur: "بیعت بیچنے اور بنو طریف پر ابو القاسم کے اشعار، ص260-261، 290ھ"
  es: "Versículos de Abu al-Qasim sobre la prenda vendida y Banu Tarif, págs. 260-261, 290 AH"
summary:
  ar: "يقول أبو القاسم إن قوماً باعوا بيعة الهادي بالدراهم وأعرضوا إلى اللهو والشراب، ثم يقول إن بني طريف ظنوا أنه مروَّع بين القيود فيرد بفخره بآبائه ويقول إنه يبذل مهجته في الله."
  en: "Abu al-Qasim says that some had sold al-Hadi's pledge for coins and turned to diversion and drink, then that Banu Tarif thought him terrified among the fetters, to which he replies with pride in his forefathers and says he gives his life for God."
  fr: "Abu al-Qasim dit que certains ont vendu leur allégeance à al-Hadi pour des pièces et se sont tournés vers le divertissement et la boisson, puis que les Banu Tarif le croyaient terrifié dans ses entraves ; il leur répond par la fierté de ses ancêtres et dit donner sa vie pour Dieu."
  ur: "ابو القاسم کہتے ہیں کہ کچھ لوگوں نے ہادی کی بیعت درہموں کے عوض بیچی اور لہو و شراب کی طرف مائل ہوئے، پھر یہ کہ بنو طریف نے سمجھا کہ وہ بیڑیوں میں گھبرائے ہوئے ہیں، جس کا جواب وہ آبا پر فخر اور اللہ میں جان دینے سے دیتے ہیں۔"
  es: "Abu al-Qasim dice que algunos vendieron la prenda de al-Hadi por monedas y se entregaron a la diversión y la bebida, y que los Banu Tarif lo consideraron aterrorizado entre los grilletes, a lo que él responde con orgullo por sus antepasados y dice que da su vida por Dios."
