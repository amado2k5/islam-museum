label:
  ar: "أبيات أبي القاسم في بيعة بيعت وبني طريف، ص260-261، 290هـ"
  en: "Abu al-Qasim's verses on the sold pledge and Banu Tarif, pp. 260-261, 290 AH"
  ur: "بیعت بیچنے اور بنو طریف پر ابو القاسم کے اشعار، ص260-261، 290ھ"
summary:
  ar: "يقول أبو القاسم إن قوماً باعوا بيعة الهادي بالدراهم وأعرضوا إلى اللهو والشراب، ثم يقول إن بني طريف ظنوا أنه مروَّع بين القيود فيرد بفخره بآبائه ويقول إنه يبذل مهجته في الله."
  en: "Abu al-Qasim says that some had sold al-Hadi's pledge for coins and turned to diversion and drink, then that Banu Tarif thought him terrified among the fetters, to which he replies with pride in his forefathers and says he gives his life for God."
  ur: "ابو القاسم کہتے ہیں کہ کچھ لوگوں نے ہادی کی بیعت درہموں کے عوض بیچی اور لہو و شراب کی طرف مائل ہوئے، پھر یہ کہ بنو طریف نے سمجھا کہ وہ بیڑیوں میں گھبرائے ہوئے ہیں، جس کا جواب وہ آبا پر فخر اور اللہ میں جان دینے سے دیتے ہیں۔"
