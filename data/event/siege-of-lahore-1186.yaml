id: event/siege-of-lahore-1186
class: event
kind: conquest
label:
  ar: "أخذ الغوريين للاهور ونهاية الدولة الغزنوية، ٥٨٣هـ/١١٨٧م"
  en: "The Ghurid capture of Lahore ends the Ghaznavids, 583/1187"
  ur: "غوریوں کا لہور پر قبضہ اور غزنوی سلطنت کا خاتمہ، 583ھ/1187ء"
  es: "La captura de Lahore por los gúridas pone fin al dominio de los gaznávidas, 583/1187."
  fr: "La prise de Lahore par les Ghurides met fin à la dynastie ghaznévide, 583/1187"
  tr: "Gurlular Lahor'u ele geçirdi ve Gaznevi hanedanlığı 583 Hicri/1187 Miladi yılında sona erdi."
  id: "Dinasti Ghurid merebut Lahore dan dinasti Ghaznavid berakhir pada tahun 583 H/1187 M."
summary:
  ar: "بعد فقدان غزنة نفسها سنة ٥٥٨هـ/١١٦٣م صارت لاهور عاصمة الغزنويين، حتى وضع أخذُ الغوريين لها سنة ٥٨٣هـ/١١٨٧م نهايةً للدولة {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  en: "After the loss of Ghazna itself in 558/1163, Lahore served as the Ghaznavid capital, until its capture by the Ghurids in 583/1187 put an end to the dynasty {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  ur: "558ھ/1163ء میں خود غزنہ کے ہاتھ سے نکل جانے کے بعد لہور غزنویوں کا دارالسلطنت بنا، یہاں تک کہ 583ھ/1187ء میں غوریوں کے قبضے نے اس خاندان کا خاتمہ کر دیا {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  es: "Tras la pérdida de Ghazna en 558/1163, Lahore sirvió como capital gaznávida, hasta que su captura por los gúridas en 583/1187 puso fin a la dinastía {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  fr: "Après la perte de Ghazna elle-même en 558/1163, Lahore servit de capitale ghaznévide, jusqu'à ce que sa capture par les Ghurides en 583/1187 mette fin à la dynastie {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
  tr: "Hicri 558/Miladi 1163 yılında Gazne'nin kaybedilmesinin ardından Lahor, Gaznelilerin başkenti oldu; ancak Hicri 583/Miladi 1187 yılında Gurlular tarafından ele geçirildi ve bu da devletin sonunu getirdi. {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}"
  id: "Setelah Ghazna sendiri jatuh pada tahun 558 H/1163 M, Lahore menjadi ibu kota Dinasti Ghaznavid, hingga Dinasti Ghurid merebutnya pada tahun 583 H/1187 M, yang mengakhiri negara tersebut. {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
