id: event/birth-al-ashari-260
class: event
kind: birth
label:
  ar: "ولادة أبي الحسن الأشعري بالبصرة، ٢٦٠هـ"
  en: "Abu al-Hasan al-Ash'ari is born at Basra, 260/873-4"
  ur: "ابو الحسن اشعری کی ولادت بصرہ میں، 260ھ/873-874ء"
summary:
  ar: "وُلد أبو الحسن علي بن إسماعيل بن أبي بشر (إسحاق بن سالم) الأشعري اليماني البصري بالبصرة سنة ستين ومائتين الموافقة ٨٧٣–٨٧٤م، وقيل بل وُلد سنة سبعين ومائتين {cite:encyclopaedia-of-islam-2 vol. 1 p. 743} {cite:siyar-alam-nubala 15/85}؛ وهو التاسع في النسب إلى الصحابي أبي موسى الأشعري {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}."
  en: "Abu al-Hasan Ali ibn Isma'il ibn Abi Bishr (Ishaq ibn Salim) al-Ash'ari al-Yamani al-Basri was born at Basra in 260/873-4; it is also said that he was born in 270 {cite:encyclopaedia-of-islam-2 vol. 1 p. 743} {cite:siyar-alam-nubala 15/85}. He was ninth in descent from the Companion Abu Musa al-Ash'ari {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}."
  ur: "ابو الحسن علی بن اسماعیل بن ابی بشر (اسحاق بن سالم) اشعری یمانی بصری بصرہ میں سن 260ھ، بمطابق 873-874ء، پیدا ہوئے؛ ایک قول یہ بھی ہے کہ وہ 270ھ میں پیدا ہوئے {cite:encyclopaedia-of-islam-2 vol. 1 p. 743} {cite:siyar-alam-nubala 15/85}۔ وہ صحابی ابو موسیٰ اشعری کی اولاد میں نویں نمبر پر تھے {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}۔"
