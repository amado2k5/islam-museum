id: event/birth-al-ashari-260
class: event
kind: birth
label:
  ar: "ولادة أبي الحسن الأشعري بالبصرة، ٢٦٠هـ"
  en: "Abu al-Hasan al-Ash'ari is born at Basra, 260/873-4"
  ur: "ابو الحسن اشعری کی ولادت بصرہ میں، 260ھ/873-874ء"
  fr: "Abu al-Hasan al-Ash'ari naît à Bassora, 260/873-874"
  es: "Abu al-Hasan al-Ash'ari nació en Basora, 260/873-4"
  tr: "Ebu el-Hasan el-Eş'ari, Hicri 260 yılında Basra'da doğdu."
  id: "Abu al-Hasan al-Ash'ari lahir di Basra pada tahun 260 Hijriah."
summary:
  ar: "وُلد أبو الحسن علي بن إسماعيل بن أبي بشر ⁦(إسحاق بن سالم)⁩ الأشعري اليماني البصري بالبصرة سنة ستين ومائتين الموافقة ٨٧٣–٨٧٤م، وقيل بل وُلد سنة سبعين ومائتين {cite:encyclopaedia-of-islam-2 vol. 1 p. 743} {cite:siyar-alam-nubala 15/85}؛ وهو التاسع في النسب إلى الصحابي أبي موسى الأشعري {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}."
  en: "Abu al-Hasan Ali ibn Isma'il ibn Abi Bishr (Ishaq ibn Salim) al-Ash'ari al-Yamani al-Basri was born at Basra in 260/873-4; it is also said that he was born in 270 {cite:encyclopaedia-of-islam-2 vol. 1 p. 743} {cite:siyar-alam-nubala 15/85}. He was ninth in descent from the Companion Abu Musa al-Ash'ari {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}."
  ur: "ابو الحسن علی بن اسماعیل بن ابی بشر ⁦(اسحاق بن سالم)⁩ اشعری یمانی بصری بصرہ میں سن 260ھ، بمطابق 873-874ء، پیدا ہوئے؛ ایک قول یہ بھی ہے کہ وہ 270ھ میں پیدا ہوئے {cite:encyclopaedia-of-islam-2 vol. 1 p. 743} {cite:siyar-alam-nubala 15/85}۔ وہ صحابی ابو موسیٰ اشعری کی اولاد میں نویں نمبر پر تھے {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}۔"
  fr: "Abu al-Hasan Ali ibn Isma'il ibn Abi Bishr (Ishaq ibn Salim) al-Ash'ari al-Yamani al-Basri naquit à Bassora en 260/873-874 ; on dit aussi qu'il naquit en 270 {cite:encyclopaedia-of-islam-2 vol. 1 p. 743} {cite:siyar-alam-nubala 15/85}. Il était le descendant à la neuvième génération du Compagnon Abu Musa al-Ash'ari {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}."
  es: "Abu al-Hasan Ali ibn Isma'il ibn Abi Bishr (Ishaq ibn Salim) al-Ash'ari al-Yamani al-Basri nació en Basora en 260/873-4; también se dice que nació en 270 {cite:encyclopaedia-of-islam-2 vol. 1 p. 743} {cite:siyar-alam-nubala 15/85}. Fue noveno en descendencia del Compañero Abu Musa al-Ash'ari {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}."
  tr: "Ebu el-Hasan Ali ibn İsmail ibn Abi Bişr (İshak ibn Salim) el-Eş'ari el-Yamani el-Basri, Hicri 260 yılında (Miladi 873-874) Basra'da doğmuştur; ancak bazı kaynaklara göre Hicri 270 yılında doğmuştur. {Kaynak:encyclopaedia-of-islam-2 cilt 1 s. 743} {Kaynak:siyar-alam-nubala 15/85} Sahabe Ebu Musa el-Eş'ari'nin soyundan dokuzuncu kişidir. {Kaynak:encyclopaedia-of-islam-2 cilt 1 s. 743}"
  id: "Abu al-Hasan Ali ibn Ismail ibn Abi Bishr (Ishaq ibn Salim) al-Ash’ari al-Yamani al-Basri lahir di Basra pada tahun 260 H, yang bertepatan dengan tahun 873–874 M, dan ada pula yang mengatakan bahwa ia lahir pada tahun 270 H {cite:encyclopaedia-of-islam-2 vol. 1 p. 743} {cite:siyar-alam-nubala 15/85}; dan beliau adalah orang kesembilan dalam garis keturunan sahabat Abu Musa al-Ash’ari {cite:encyclopaedia-of-islam-2 vol. 1 p. 743}."
