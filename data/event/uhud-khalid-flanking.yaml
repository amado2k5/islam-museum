label: { en: "Khalid's flanking manoeuvre at Uhud", ar: "حركة الالتفاف التي نفّذها خالد بن الوليد في أحد" }
summary:
  ar: "لما خلت ظهور المسلمين من الرماة استدار خالد بن الوليد بسرعة خاطفة حتى وصل إلى مؤخرة الجيش الإسلامي، فأباد عبد الله بن جبير وأصحابه التسعة في الجبل. ثم انقض على المسلمين من خلفهم. سمع المشركون صيحة فرسان خالد فانقلبوا على المسلمين. رفعت امرأة اسمها عمرة بنت علقمة الحارثية لواء المشركين المطروح فالتف حوله المشركون. وقع المسلمون محاصرين بين فرسان خالد من الخلف وجيش قريش المنقلب من الأمام {cite:mubarakpuri-raheeq p.264}."
  en: "When the Muslims' backs were left bare of archers, Khalid ibn al-Walid wheeled with lightning speed to the rear of the Muslim army and wiped out Abdullah ibn Jubayr and his nine companions on the hill, then fell on the Muslims from behind. Hearing the cry of Khalid's cavalry, the polytheists turned back on the Muslims. A woman named Umra bint Alqama al-Harithiyya raised the fallen polytheist standard and they rallied around it. The Muslims were trapped between Khalid's horse behind them and Quraysh's army returning from the front {cite:mubarakpuri-raheeq p.264}."
