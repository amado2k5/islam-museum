label:
  ar: "ابن عبد البر قاضياً في دولة المظفر بن الأفطس، نحو ٤٥٠هـ"
  en: "Ibn 'Abd al-Barr serves as qadi under al-Muzaffar ibn al-Aftas, about 450/1058"
  ur: "ابن عبد البر مظفر بن افطس کے دور میں قاضی مقرر، تقریباً 450ھ/1058ء"
summary:
  ar: "ذكر غير واحد أن أبا عمر ابن عبد البر ولي القضاء بأشبولة في دولة المظفر بن الأفطس مدة {cite:tarikh-islam-dhahabi p. 141}، وعند بلا في دائرة المعارف أنه كان قاضياً بأشبونة وسنترين في عهده {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}، وألف في تلك الأيام «بهجة المجالس وأنس المجالس» نظماً للمظفر {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}."
  en: "Several authorities say Abu 'Amr Ibn 'Abd al-Barr held the judgeship of Ashbula for a time in the state of al-Muzaffar ibn al-Aftas {cite:tarikh-islam-dhahabi p. 141}; Pellat in the Encyclopaedia of Islam places his qadiship at Lisbon and Santarém under the same ruler {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}, and it was for al-Muzaffar that he composed the verse adab book Bahjat al-Majalis {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}."
  ur: "کئی روایات کے مطابق ابو عمر ابن عبد البر مظفر بن افطس کے دور میں کچھ عرصہ اشبولہ کے قاضی رہے {cite:tarikh-islam-dhahabi p. 141}؛ دائرۃ المعارف میں پیلا کے مطابق ان کا قضا لیسبن اور سانترین میں تھا {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}، اور انہی ایام میں انھوں نے مظفر کے لیے منظوم ادبی کتاب «بہجۃ المجالس» تصنیف کی {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}۔"
