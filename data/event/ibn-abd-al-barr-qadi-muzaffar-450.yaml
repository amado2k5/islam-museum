class: event
kind: gathering
label:
  ar: "ابن عبد البر قاضياً في دولة المظفر بن الأفطس، نحو ٤٥٠هـ"
  en: "Ibn 'Abd al-Barr serves as qadi under al-Muzaffar ibn al-Aftas, about 450/1058"
  ur: "ابن عبد البر مظفر بن افطس کے دور میں قاضی مقرر، تقریباً 450ھ/1058ء"
  es: "Ibn 'Abd al-Barr sirve como cadí bajo al-Muzaffar ibn al-Aftas, alrededor de 450/1058"
  fr: "Ibn 'Abd al-Barr sert de cadi sous al-Muzaffar ibn al-Aftas, vers 450/1058"
  tr: "İbn Abdülbarr, Hicri 450 civarında el-Muzaffar ibn el-Aftas devletinde kadı olarak görev yapmıştır."
  id: "Ibn Abd al-Barr menjabat sebagai hakim di negara al-Muzaffar ibn al-Aftas, sekitar tahun 450 H."
summary:
  ar: "ذكر غير واحد أن أبا عمر ابن عبد البر ولي القضاء بأشبولة في دولة المظفر بن الأفطس مدة {cite:tarikh-islam-dhahabi p. 141}، وعند بلا في دائرة المعارف أنه كان قاضياً بأشبونة وسنترين في عهده {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}، وألف في تلك الأيام «بهجة المجالس وأنس المجالس» نظماً للمظفر {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}."
  en: "Several authorities say Abu 'Amr Ibn 'Abd al-Barr held the judgeship of Ashbula for a time in the state of al-Muzaffar ibn al-Aftas {cite:tarikh-islam-dhahabi p. 141}; Pellat in the Encyclopaedia of Islam places his qadiship at Lisbon and Santarém under the same ruler {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}, and it was for al-Muzaffar that he composed the verse adab book Bahjat al-Majalis {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}."
  ur: "کئی روایات کے مطابق ابو عمر ابن عبد البر مظفر بن افطس کے دور میں کچھ عرصہ اشبولہ کے قاضی رہے {cite:tarikh-islam-dhahabi p. 141}؛ دائرۃ المعارف میں پیلا کے مطابق ان کا قضا لیسبن اور سانترین میں تھا {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}، اور انہی ایام میں انھوں نے مظفر کے لیے منظوم ادبی کتاب «بہجۃ المجالس» تصنیف کی {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}۔"
  es: "Varias autoridades afirman que Abu 'Amr Ibn 'Abd al-Barr ocupó el cargo de juez de Ashbula durante un tiempo en el estado de al-Muzaffar ibn al-Aftas {cite:tarikh-islam-dhahabi p. 141}; Pellat, en la Enciclopedia del Islam, sitúa su cadí en Lisboa y Santarém bajo el mismo gobernante {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}, y fue para al-Muzaffar que compuso el libro de adab de versos Bahjat al-Majalis {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}."
  fr: "Plusieurs autorités affirment qu'Abu 'Amr Ibn 'Abd al-Barr a occupé la fonction de juge d'Ashbula pendant un certain temps sous le règne d'al-Muzaffar ibn al-Aftas {cite:tarikh-islam-dhahabi p. 141}; Pellat, dans l'Encyclopédie de l'Islam, situe sa fonction de qadi à Lisbonne et à Santarém sous le même souverain {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}, et c'est pour al-Muzaffar qu'il a composé le livre de poésie adab Bahjat al-Majalis {cite:encyclopaedia-of-islam-2 vol. 3 p. 706}."
  tr: "Birçok kişi, Ebu Ömer İbn Abdülberr'in, Muzaffar İbn el-Aftas'ın hükümdarlığı döneminde bir süre Sevilla'da kadı olarak görev yaptığını belirtmiştir. {kaynak:tarikh-islam-dhahabi s. 141}. Ansiklopedideki Bla'ya göre, Muzaffar'ın hükümdarlığı döneminde Sevilla ve Santorini'de kadı olarak görev yapmıştır. {kaynak:encyclopaedia-of-islam-2 cilt 3 s. 706}. O dönemlerde Muzaffar için manzum olarak \"Bahjat al-Majalis wa Uns al-Majalis\" adlı eserini yazmıştır. {kaynak:encyclopaedia-of-islam-2 cilt 3 s. 706}."
  id: "Beberapa orang menyebutkan bahwa Abu Omar Ibn Abd al-Barr memegang jabatan hakim di Sevilla selama masa pemerintahan al-Muzaffar Ibn al-Aftas untuk beberapa waktu. {cite:tarikh-islam-dhahabi hlm. 141}. Menurut Bla dalam Ensiklopedia, ia adalah hakim di Sevilla dan Santorini selama masa pemerintahannya. {cite:encyclopaedia-of-islam-2 vol. 3 hlm. 706}. Pada masa itu, ia menggubah “Bahjat al-Majalis wa Uns al-Majalis” dalam bentuk syair untuk al-Muzaffar. {cite:encyclopaedia-of-islam-2 vol. 3 hlm. 706}."
