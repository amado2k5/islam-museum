id: event/killing-of-ibrahim-ibn-muhammad-al-imam
class: event
kind: death
label: { ar: "مقتل إبراهيم بن محمد الإمام", en: "The killing of Ibrahim ibn Muhammad al-Imam", es: "El asesinato de Ibrahim ibn Muhammad al-Imam", fr: "Le meurtre d'Ibrahim ibn Muhammad al-Imam", ur: "ابراہیم بن محمد الامام کا قتل", tr: "İbrahim ibn Muhammed el-İmam'ın öldürülmesi", id: "Pembunuhan Ibrahim ibn Muhammad al-Imam" }
summary:
  ar: "في سنة اثنتين وثلاثين ومائة وقع في يد مروان بن محمد كتاب من إبراهيم بن محمد إلى أبي مسلم، فأمر مروان بأخذ إبراهيم، فأُخذ {cite:tabari-tarikh-abu-al-fadl j.7 p.422}، وذكر الطبري قتله في عنوان الفهرس {cite:tabari-tarikh-abu-al-fadl j.7 p.666}، وعند السيوطي عهد محمد الإمام إلى ابنه إبراهيم فبلغ خبره مروان فسجنه ثم قتله فعهد إلى أخيه عبد الله وهو السفاح فاجتمع إليه شيعتهم {cite:tarikh-khulafa-minhaj-1434 p. 418}، وعند المسعودي جعلوا رأسه في جراب فيه نورة مسحوقة فاضطرب ساعة ثم خمد، وجعل على وجهي العباس بن الوليد وعبد الله بن عمر بن عبد العزيز مخاد فقعدوا فوقهما، وكان في كتابه إلى أبي مسلم دونك أمراً قد بدت أشراطه إن السبيل واضح صراطه لم يبق إلا السيف واختراطه {cite:muruj-al-dhahab p. 231}"
  en: "In the year 132 a letter from Ibrahim ibn Muhammad to Abu Muslim fell into the hands of Marwan ibn Muhammad; Marwan ordered Ibrahim seized, and he was seized {cite:tabari-tarikh-abu-al-fadl j.7 p.422}. Al-Tabari mentions his killing in the index heading {cite:tabari-tarikh-abu-al-fadl j.7 p.666}. According to al-Suyuti, Muhammad al-Imam had designated his son Ibrahim as his successor; when the news reached Marwan, he imprisoned him and then killed him; the designation then passed to his brother Abd Allah, who was al-Saffah, and their partisans gathered around him {cite:tarikh-khulafa-minhaj-1434 p. 418}. According to al-Mas'udi, they put his head in a bag containing powdered lime; it trembled for a while, then went still. Cushions were placed over the faces of al-Abbas ibn al-Walid and Abd Allah ibn Umar ibn Abd al-Aziz, and they sat on top of them. His letter to Abu Muslim contained the words: 'Here is a matter whose signs have appeared; the path is clear and its way is open; nothing remains but the sword and its drawing' {cite:muruj-al-dhahab p. 231}."
  es: "En el año 132, una carta de Ibrahim ibn Muhammad a Abu Muslim llegó a manos de Marwan ibn Muhammad; Marwan ordenó que apresaran a Ibrahim, y así fue {cite:tabari-tarikh-abu-al-fadl j.7 p.422}. Al-Tabari menciona su muerte en el encabezado del índice {cite:tabari-tarikh-abu-al-fadl j.7 p.666}. Según al-Suyuti, Muhammad al-Imam había designado a su hijo Ibrahim como su sucesor; cuando la noticia llegó a Marwan, lo encarceló y luego lo mató; la designación pasó entonces a su hermano Abd Allah, que era al-Saffah, y sus partidarios se reunieron a su alrededor {cite:tarikh-khulafa-minhaj-1434 p. 418}. Según al-Mas'udi, pusieron su cabeza en una bolsa que contenía cal en polvo; tembló durante un rato y luego se quedó quieta. Se colocaron cojines sobre los rostros de al-Abbas ibn al-Walid y Abd Allah ibn Umar ibn Abd al-Aziz, y se sentaron sobre ellos. Su carta a Abu Muslim contenía las palabras: «Aquí hay un asunto cuyos signos han aparecido; el camino es claro y su sendero está abierto; no queda nada más que la espada y su desenvainado» {cite:muruj-al-dhahab p. 231}."
  fr: "En l'an 132, une lettre d'Ibrahim ibn Muhammad à Abu Muslim tomba entre les mains de Marwan ibn Muhammad. Marwan ordonna l'arrestation d'Ibrahim, qui fut effectivement arrêté (cit.: Tabari-tarikh-abu-al-fadl j.7 p.422). Al-Tabari mentionne son exécution dans l'index (cit.: Tabari-tarikh-abu-al-fadl j.7 p.666). Selon al-Suyuti, Muhammad al-Imam avait désigné son fils Ibrahim comme successeur. Lorsque Marwan apprit la nouvelle, il le fit emprisonner puis le fit exécuter. La désignation revint alors à son frère Abd Allah, alias al-Saffah, et leurs partisans se rassemblèrent autour de lui (cit.: Tarikh-khulafa-minhaj-1434 p. 418). Selon al-Mas'udi, ils placèrent sa tête dans un sac contenant de la chaux en poudre; elle trembla un instant, puis s'immobilisa. Des coussins furent placés sur les visages d'al-Abbas ibn al-Walid et d'Abd Allah ibn Umar ibn Abd al-Aziz, et ils s'assirent dessus. Sa lettre à Abu Muslim contenait ces mots: « Voici une affaire dont les signes sont apparus; le chemin est clair et son issue est ouverte; il ne reste plus que l'épée et son filement » {cite: Muruj-al-Dhahab, p. 231}."
  ur: "سن 132 میں ابراہیم بن محمد کا ابو مسلم کو ایک خط مروان بن محمد کے ہاتھ لگا۔ مروان نے ابراہیم کو پکڑنے کا حکم دیا اور اسے پکڑ لیا گیا الطبری نے اس کے قتل کا ذکر انڈیکس سرخی {حوالہ:طبری-تاریخ-ابو الفضل ج.7 ص666} میں کیا ہے۔ السیوطی کے مطابق، محمد الامام نے اپنے بیٹے ابراہیم کو اپنا جانشین نامزد کیا تھا۔ جب یہ خبر مروان کو پہنچی تو اس نے اسے قید کر کے قتل کر دیا۔ اس کے بعد یہ عہدہ اس کے بھائی عبد اللہ کے پاس پہنچا جو الصفح تھا اور ان کے حامی اس کے گرد جمع ہو گئے۔ 418}۔ المسعودی کے مطابق، انہوں نے اس کا سر ایک تھیلے میں رکھا جس میں چونے کا پاؤڈر تھا۔ یہ تھوڑی دیر تک کانپتا رہا، پھر خاموش ہو گیا۔ عباس بن ولید اور عبداللہ بن عمر بن عبد العزیز کے چہروں پر تکیے رکھے گئے اور وہ ان کے اوپر بیٹھ گئے۔ ابو مسلم کے نام اس کے خط میں یہ الفاظ تھے: 'یہ ایک معاملہ ہے جس کے آثار ظاہر ہو چکے ہیں۔ راستہ صاف ہے اور اس کا راستہ کھلا ہے۔ تلوار اور اس کے نقش کے سوا کچھ باقی نہیں بچا۔ 231}۔"
  tr: "Hicri 132 yılında, İbrahim ibn Muhammed'in Ebu Müslim'e yazdığı bir mektup Mervan ibn Muhammed'in eline geçti. Mervan, İbrahim'in yakalanmasını emretti ve İbrahim yakalandı {kaynak: Tabari-tarikh-ebu-al-fadl c.7 s.422}. Taberi, onun öldürülmesinden dizinde bahsetmiştir {kaynak: Tabari-tarikh-ebu-al-fadl c.7 s.666}. Suyuti'ye göre, İmam Muhammed halifeliği oğlu İbrahim'e emanet etti, ancak bu haber Mervan'a ulaştı, bu yüzden onu hapse attı ve sonra öldürdü. Daha sonra halifeliği, Saffe olan kardeşi Abdullah'a emanet etti ve takipçileri onun etrafında toplandı {kaynak: Tarikat-hulafa-minhaj-1434 s. 418}. Mes'udi'ye göre ise, başını kireç tozu içeren bir torbaya koydular, bir saat kıvrandı ve sonra sakinleşti. El-Abbas bin El-Valid ve Abdullah bin Ömer bin Abdul Aziz'in yüzlerine yastıklar koyup üzerlerine oturdular. Ve Ebu Müslim'e yazdığı mektupta şöyle dedi: \"İşin alametleri ortaya çıkmıştır. Yol açıktır, yolu bellidir. Geriye sadece kılıç ve onun çekilmesi kalmıştır.\" {kaynak: Muruj-al-Dhahab s. 231}"
  id: "Pada tahun 132 H, sebuah surat dari Ibrahim bin Muhammad kepada Abu Muslim jatuh ke tangan Marwan bin Muhammad. Marwan memerintahkan agar Ibrahim ditangkap, dan dia pun ditangkap {cite:tabari-tarikh-abu-al-fadl j.7 p.422}. Al-Tabari menyebutkan pembunuhannya dalam indeks {cite:tabari-tarikh-abu-al-fadl j.7 p.666}. Menurut Al-Suyuti, Muhammad sang Imam mempercayakan kekhalifahan kepada putranya Ibrahim, tetapi berita ini sampai kepada Marwan, sehingga ia memenjarakannya dan kemudian membunuhnya. Kemudian ia mempercayakan kekhalifahan kepada saudaranya Abdullah, yang merupakan Al-Saffah, dan para pengikut mereka berkumpul di sekelilingnya {cite:tarikh-khulafa-minhaj-1434 p. 418}. Dan menurut Al-Mas’udi, mereka memasukkan kepalanya ke dalam kantong berisi kapur bubuk, sehingga ia menggeliat selama satu jam dan kemudian tenang. Mereka meletakkan bantal di atas wajah Al-Abbas bin Al-Walid dan Abdullah bin Umar bin Abdul Aziz lalu duduk di atasnya. Dan dalam suratnya kepada Abu Muslim, beliau berkata: “Ada suatu perkara yang tanda-tandanya telah tampak. Jalannya jelas, jalannya pun jelas. Tidak ada yang tersisa selain pedang dan penghunusannya.” {cite:muruj-al-dhahab p. 231}"
