id: event/killing-of-ibrahim-ibn-muhammad-al-imam
class: event
kind: death
label: { ar: "مقتل إبراهيم بن محمد الإمام", en: "The killing of Ibrahim ibn Muhammad al-Imam" }
summary:
  ar: "في سنة اثنتين وثلاثين ومائة وقع في يد مروان بن محمد كتاب من إبراهيم بن محمد إلى أبي مسلم، فأمر مروان بأخذ إبراهيم، فأُخذ {cite:tabari-tarikh-abu-al-fadl j.7 p.422}، وذكر الطبري قتله في عنوان الفهرس {cite:tabari-tarikh-abu-al-fadl j.7 p.666}، وعند السيوطي عهد محمد الإمام إلى ابنه إبراهيم فبلغ خبره مروان فسجنه ثم قتله فعهد إلى أخيه عبد الله وهو السفاح فاجتمع إليه شيعتهم {cite:tarikh-khulafa-minhaj-1434 p. 418}، وعند المسعودي جعلوا رأسه في جراب فيه نورة مسحوقة فاضطرب ساعة ثم خمد، وجعل على وجهي العباس بن الوليد وعبد الله بن عمر بن عبد العزيز مخاد فقعدوا فوقهما، وكان في كتابه إلى أبي مسلم دونك أمراً قد بدت أشراطه إن السبيل واضح صراطه لم يبق إلا السيف واختراطه {cite:muruj-al-dhahab p. 231}"
  en: "In the year 132 a letter from Ibrahim ibn Muhammad to Abu Muslim fell into the hands of Marwan ibn Muhammad; Marwan ordered Ibrahim seized, and he was seized {cite:tabari-tarikh-abu-al-fadl j.7 p.422}. Al-Tabari mentions his killing in the index heading {cite:tabari-tarikh-abu-al-fadl j.7 p.666}. According to al-Suyuti, Muhammad al-Imam had designated his son Ibrahim as his successor; when the news reached Marwan, he imprisoned him and then killed him; the designation then passed to his brother Abd Allah, who was al-Saffah, and their partisans gathered around him {cite:tarikh-khulafa-minhaj-1434 p. 418}. According to al-Mas'udi, they put his head in a bag containing powdered lime; it trembled for a while, then went still. Cushions were placed over the faces of al-Abbas ibn al-Walid and Abd Allah ibn Umar ibn Abd al-Aziz, and they sat on top of them. His letter to Abu Muslim contained the words: 'Here is a matter whose signs have appeared; the path is clear and its way is open; nothing remains but the sword and its drawing' {cite:muruj-al-dhahab p. 231}."
