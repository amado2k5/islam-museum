id: event/al-suyuti-father-death-855
class: event
kind: death
label:
  ar: "وفاة والد السيوطي ويتمه، ٨٥٥هـ/١٤٥١م"
  en: "Death of al-Suyuti’s father, 855/1451"
  ur: "سیوطی کے والد کی وفات، 855ھ/1451ء"
  es: "Muerte del padre de al-Suyuti, 855/1451"
  fr: "Mort du père d'al-Suyuti, 855/1451"
  tr: "El-Suyuti'nin babasının ölümü ve yetim kalması, Hicri 855/Miladi 1451"
  id: "Kematian ayah Al-Suyuti dan menjadi yatim piatu, 855 H/1451 M"
summary:
  ar: "توفي والد السيوطي سنة ٨٥٥هـ/١٤٥١م وله من العمر خمس سنين وسبعة أشهر، وقد وصل في القرآن إلى سورة التحريم، فأسند أبوه وصايته إلى جماعة من العلماء منهم الكمال بن الهمام {cite:shadharat-dhahab p. 468-470} {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  en: "Al-Suyuti’s father died prematurely in 855/1451, when the boy was five years and seven months old and had already reached Surat al-Tahrim in the Qur’an; his father had entrusted his guardianship to a group of scholars, among them al-Kamal ibn al-Humam {cite:shadharat-dhahab p. 468-470} {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  ur: "سیوطی کے والد 855ھ/1451ء میں جلد انتقال کر گئے، جب وہ پانچ سال سات ماہ کے تھے اور قرآن میں سورۃ التحریم تک پہنچ چکے تھے؛ والد نے ان کی سرپرستی علما کے ایک گروہ کے سپرد کی جن میں کمال بن ہمام بھی تھے {cite:shadharat-dhahab p. 468-470} {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}۔"
  es: "El padre de Al-Suyuti murió prematuramente en 855/1451, cuando el niño tenía cinco años y siete meses y ya había llegado a la Sura al-Tahrim en el Corán; su padre había confiado su tutela a un grupo de eruditos, entre ellos al-Kamal ibn al-Humam {cite:shadharat-dhahab p. 468-470} {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  fr: "Le père d'Al-Suyuti mourut prématurément en 855/1451, alors que le garçon avait cinq ans et sept mois et avait déjà atteint la sourate al-Tahrim dans le Coran; son père avait confié sa tutelle à un groupe de savants, parmi lesquels al-Kamal ibn al-Humam {cite:shadharat-dhahab p. 468-470} {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  tr: "El-Suyuti'nin babası, kendisi beş yaş yedi aylıkken ve Kur'an'da Tahrim Suresi'ne kadar gelmişken, Hicri 855/Miladi 1451 yılında vefat etti. Babası, onun velayetini aralarında Kemal İbn Al-Humam'ın da bulunduğu bir grup âlime emanet etti. {cite:shadharat-dhahab s. 468-470} {cite:encyclopaedia-of-islam-2 cilt 9 s. 914}."
  id: "Ayah Al-Suyuti meninggal pada tahun 855 H/1451 M ketika ia berusia lima tahun tujuh bulan, dan ia telah sampai pada Surah At-Tahrim dalam Al-Qur'an. Ayahnya mempercayakan perwaliannya kepada sekelompok ulama, termasuk Kamal Ibn Al-Humam. {cite:shadharat-dhahab hlm. 468-470} {cite:encyclopaedia-of-islam-2 vol. 9 hlm. 914}."
