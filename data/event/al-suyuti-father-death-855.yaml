label:
  ar: "وفاة والد السيوطي ويتمه، ٨٥٥هـ/١٤٥١م"
  en: "Death of al-Suyuti’s father, 855/1451"
  ur: "سیوطی کے والد کی وفات، 855ھ/1451ء"
summary:
  ar: "توفي والد السيوطي سنة ٨٥٥هـ/١٤٥١م وله من العمر خمس سنين وسبعة أشهر، وقد وصل في القرآن إلى سورة التحريم، فأسند أبوه وصايته إلى جماعة من العلماء منهم الكمال بن الهمام {cite:shadharat-dhahab p. 468-470} {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  en: "Al-Suyuti’s father died prematurely in 855/1451, when the boy was five years and seven months old and had already reached Surat al-Tahrim in the Qur’an; his father had entrusted his guardianship to a group of scholars, among them al-Kamal ibn al-Humam {cite:shadharat-dhahab p. 468-470} {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  ur: "سیوطی کے والد 855ھ/1451ء میں جلد انتقال کر گئے، جب وہ پانچ سال سات ماہ کے تھے اور قرآن میں سورۃ التحریم تک پہنچ چکے تھے؛ والد نے ان کی سرپرستی علما کے ایک گروہ کے سپرد کی جن میں کمال بن ہمام بھی تھے {cite:shadharat-dhahab p. 468-470} {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}۔"
