id: event/death-al-mawardi-450
class: event
kind: death
label:
  ar: "وفاة الماوردي ببغداد، ربيع الأول ٤٥٠هـ"
  en: "Death of al-Mawardi at Baghdad, Rabi' I 450/1058"
  ur: "ماوردی کی وفات بغداد میں، ربيع الاول 450ھ/1058ء"
summary:
  ar: "توفي [[person/al-mawardi|أبو الحسن علي بن محمد الماوردي]] ببغداد في ربيع الأول سنة خمسين وأربعمائة — عند معجم الإسلام في الثلاثين منه ٢٧ مايو 1058م — عن ست وثمانين سنة، ودفن بمقبرة باب حرب {cite:muntazam-ibn-al-jawzi j.8 p.199-200} {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}. وتوفي بعد موت القاضي أبي الطيب الطبري بأحد عشر يومًا، ولم يكن أبرز شيئًا من مصنفاته في حياته حتى أوصى بها عند موته، فخُفي خبرها ثم نشرت {cite:shadharat-dhahab p. 294}."
  en: "[[person/al-mawardi|Abu al-Hasan Ali ibn Muhammad al-Mawardi]] died at Baghdad in Rabi' I 450 — on its 30th, 27 May 1058 per the EI2 — aged eighty-six, and was buried at the Bab Harb cemetery {cite:muntazam-ibn-al-jawzi j.8 p.199-200} {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}. He died eleven days after the qadi Abu al-Tayyib al-Tabari; none of his works had been brought out in his lifetime — he bequeathed them at his death, and their story came out afterwards {cite:shadharat-dhahab p. 294}."
  ur: "[[person/al-mawardi|ابوالحسن علی بن محمد ماوردی]] ربيع الاول 450ھ میں بغداد میں فوت ہوئے — دائرۃ المعارفِ اسلام کے مطابق اس کی تیس تاریخ 27 مئی 1058ء — چھیاسی برس کی عمر میں، اور باب حرب کے قبرستان میں دفن ہوئے {cite:muntazam-ibn-al-jawzi j.8 p.199-200} {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}۔ وہ قاضی ابوالطیب طبری کی وفات کے گیارہ دن بعد فوت ہوئے؛ اپنی حیات میں انھوں نے اپنی تصانیف میں سے کچھ ظاہر نہیں کیا تھا بلکہ موت کے وقت ان کی وصیت کی، جس کے بعد ان کا ذکر پھیلا {cite:shadharat-dhahab p. 294}۔"
