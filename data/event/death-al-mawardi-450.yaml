label:
  ar: "وفاة الماوردي ببغداد، ربيع الأول ٤٥٠هـ"
  en: "Death of al-Mawardi at Baghdad, Rabi' I 450/1058"
  ur: "ماوردی کی وفات بغداد میں، ربيع الاول 450ھ/1058ء"
  es: "Muerte de al-Mawardi en Bagdad, Rabi' I 450/1058"
  fr: "Mort d'al-Mawardi à Bagdad, Rabi' I 450/1058"
  tr: "El-Maverdi Bağdat'ta öldü, Rabi'ul-Evvel 450 H."
  id: "Al-Mawardi wafat di Bagdad, Rabi' al-Awwal 450 H"
summary:
  ar: "توفي [[person/al-mawardi|أبو الحسن علي بن محمد الماوردي]] ببغداد في ربيع الأول سنة خمسين وأربعمائة — عند معجم الإسلام في الثلاثين منه ٢٧ مايو 1058م — عن ست وثمانين سنة، ودفن بمقبرة باب حرب {cite:muntazam-ibn-al-jawzi j.8 p.199-200} {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}. وتوفي بعد موت القاضي أبي الطيب الطبري بأحد عشر يومًا، ولم يكن أبرز شيئًا من مصنفاته في حياته حتى أوصى بها عند موته، فخُفي خبرها ثم نشرت {cite:shadharat-dhahab p. 294}."
  en: "[[person/al-mawardi|Abu al-Hasan Ali ibn Muhammad al-Mawardi]] died at Baghdad in Rabi' I 450 — on its 30th, 27 May 1058 per the EI2 — aged eighty-six, and was buried at the Bab Harb cemetery {cite:muntazam-ibn-al-jawzi j.8 p.199-200} {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}. He died eleven days after the qadi Abu al-Tayyib al-Tabari; none of his works had been brought out in his lifetime — he bequeathed them at his death, and their story came out afterwards {cite:shadharat-dhahab p. 294}."
  ur: "[[person/al-mawardi|ابوالحسن علی بن محمد ماوردی]] ربيع الاول 450ھ میں بغداد میں فوت ہوئے — دائرۃ المعارفِ اسلام کے مطابق اس کی تیس تاریخ 27 مئی 1058ء — چھیاسی برس کی عمر میں، اور باب حرب کے قبرستان میں دفن ہوئے {cite:muntazam-ibn-al-jawzi j.8 p.199-200} {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}۔ وہ قاضی ابوالطیب طبری کی وفات کے گیارہ دن بعد فوت ہوئے؛ اپنی حیات میں انھوں نے اپنی تصانیف میں سے کچھ ظاہر نہیں کیا تھا بلکہ موت کے وقت ان کی وصیت کی، جس کے بعد ان کا ذکر پھیلا {cite:shadharat-dhahab p. 294}۔"
  es: "Abu al-Hasan Ali ibn Muhammad al-Mawardi murió en Bagdad en Rabi' I 450 — el 30 de ese año, 27 de mayo de 1058 según el EI2 — a la edad de ochenta y seis años, y fue enterrado en el cementerio de Bab Harb {cite:muntazam-ibn-al-jawzi j.8 p.199-200} {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}. Murió once días después del cadí Abu al-Tayyib al-Tabari; ninguna de sus obras se publicó en vida; las legó a su muerte, y su historia se dio a conocer posteriormente {cite:shadharat-dhahab p. 294}."
  fr: "Abu al-Hasan Ali ibn Muhammad al-Mawardi mourut à Bagdad le 30 Rabi' I 450 (soit le 27 mai 1058 selon l'EI2), à l'âge de quatre-vingt-six ans, et fut inhumé au cimetière de Bab Harb (voir Muntazam ibn al-Jawzi, vol. 8, p. 199-200; voir Encyclopaedia of Islam, vol. 6, p. 896). Il mourut onze jours après le cadi Abu al-Tayyib al-Tabari. Aucune de ses œuvres n'avait été publiée de son vivant; il les légua à sa mort, et leur histoire fut révélée ultérieurement (voir Hadharat-Dhahab, p. 294)."
  tr: "Ebu el-Hasan Ali ibn Muhammed el-Mevdi, Hicri 450 yılının Rebiü'l-Evvel ayında (İslam Ansiklopedisi'ne göre, 27 Mayıs 1058) seksen altı yaşında Bağdat'ta vefat etmiş ve Bab Harb mezarlığına defnedilmiştir. Kadı Ebu el-Tayyib el-Taberi'nin ölümünden on bir gün sonra vefat etmiştir. Hayatı boyunca eserlerinden hiçbirini yayınlamamış, ancak ölüm döşeğinde vasiyet yoluyla bunları yayımlamıştır. Eserlerinin varlığı gizli tutulmuş ve daha sonra yayımlanmıştır."
  id: "Abu al-Hasan Ali ibn Muhammad al-Mawardi wafat di Baghdad pada bulan Rabi' al-Awwal tahun 450 H (menurut Ensiklopedia Islam, 27 Mei 1058 M) pada usia delapan puluh enam tahun, dan dimakamkan di pemakaman Bab Harb. Ia wafat sebelas hari setelah wafatnya Hakim Abu al-Tayyib al-Tabari. Ia tidak pernah menerbitkan karya-karyanya selama hidupnya hingga ia mewariskan karya-karyanya di ranjang kematiannya, yang kemudian keberadaannya dirahasiakan dan baru diterbitkan kemudian."
