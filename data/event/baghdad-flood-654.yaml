label: { ar: "غرق بغداد سنة 654هـ", en: "The Flood of Baghdad in 654", fr: "L'inondation de Bagdad en 654", es: "La inundación de Bagdad en 654", ur: "654 میں بغداد کا سیلاب", tr: "Bağdat, Hicri 654 yılında sular altında kaldı.", id: "Baghdad dilanda banjir pada tahun 654 Hijriah." }
summary:
  ar: "وفيها غرقت بغداد الغرق الذي لم يسمع بمثله زادت دجلة زيادة ما رؤى مثلها وغرق خلق كثير ووقع شيء كثير من الدور على أهلها وأشرف الناس على الهلاك وبقيت المراكب تمر في أزقة بغداد وركب الخليفة في مركب وابتهل الناس إلى الله بالدعاء {cite:shadharat-dhahab p. 272}."
  en: "In 654 Baghdad drowned in a flood the like of which had not been heard of: the Tigris rose beyond all precedent, crowds drowned, houses collapsed on their people, boats passed through the alleys and the caliph himself rode a boat while the people implored God {cite:shadharat-dhahab p. 272}."
  fr: "En 654, Bagdad fut noyée par une inondation dont on n'avait jamais entendu la pareille : le Tigre monta au-delà de tout précédent, des foules se noyèrent, des maisons s'écroulèrent sur leurs habitants, des barques passaient dans les ruelles et le calife lui-même monta en barque tandis que les gens imploraient Dieu {cite:shadharat-dhahab p. 272}."
  es: "En 654, Bagdad quedó sumergida en una inundación como nunca antes se había visto: el Tigris creció más allá de todo precedente, multitudes se ahogaron, las casas se derrumbaron sobre sus habitantes, los barcos pasaban por los callejones y el propio califa navegaba en un barco mientras el pueblo imploraba a Dios {cite:shadharat-dhahab p. 272}."
  ur: "654 میں بغداد سیلاب میں ڈوب گیا جس کی مثال نہیں سنی گئی تھی: دجلہ تمام نظیر سے بڑھ گیا، ہجوم ڈوب گیا، گھر ان کے لوگوں پر گرے، کشتیاں گلیوں میں سے گزریں اور خلیفہ خود کشتی پر سوار ہوا جب کہ لوگ خدا سے دعائیں مانگ رہے تھے۔ 272}۔"
  tr: "Ve o sırada Bağdat, daha önce hiç görülmemiş bir şekilde sular altında kaldı. Dicle Nehri daha önce hiç görülmemiş bir seviyeye yükseldi ve birçok insan boğuldu. Birçok ev sakinlerinin üzerine çöktü ve insanlar ölümün eşiğindeydi. Tekneler Bağdat sokaklarından geçmeye devam etti, Halife bir teknede yolculuk etti ve halk Tanrı'ya dua etti. {cite:shadharat-dhahab s. 272}"
  id: "Dan di dalamnya, Baghdad dilanda banjir yang belum pernah terjadi sebelumnya. Sungai Tigris naik ke tingkat yang belum pernah terlihat sebelumnya, dan banyak orang tenggelam. Banyak rumah runtuh menimpa penghuninya, dan orang-orang berada di ambang kematian. Perahu-perahu terus melewati lorong-lorong Baghdad, dan Khalifah menaiki perahu, dan orang-orang berdoa kepada Tuhan. {cite:shadharat-dhahab p. 272}"
