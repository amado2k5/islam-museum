label: { ar: "غرق بغداد سنة 654هـ", en: "The Flood of Baghdad in 654", fr: "L'inondation de Bagdad en 654" }
summary:
  ar: "وفيها غرقت بغداد الغرق الذي لم يسمع بمثله زادت دجلة زيادة ما رؤى مثلها وغرق خلق كثير ووقع شيء كثير من الدور على أهلها وأشرف الناس على الهلاك وبقيت المراكب تمر في أزقة بغداد وركب الخليفة في مركب وابتهل الناس إلى الله بالدعاء {cite:shadharat-dhahab p. 272}."
  en: "In 654 Baghdad drowned in a flood the like of which had not been heard of: the Tigris rose beyond all precedent, crowds drowned, houses collapsed on their people, boats passed through the alleys and the caliph himself rode a boat while the people implored God {cite:shadharat-dhahab p. 272}."
  fr: "En 654, Bagdad fut noyée par une inondation dont on n'avait jamais entendu la pareille : le Tigre monta au-delà de tout précédent, des foules se noyèrent, des maisons s'écroulèrent sur leurs habitants, des barques passaient dans les ruelles et le calife lui-même monta en barque tandis que les gens imploraient Dieu {cite:shadharat-dhahab p. 272}."
