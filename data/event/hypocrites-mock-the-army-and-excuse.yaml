label: { ar: "سخرية رهط من المنافقين واعتذارهم", en: "A group of hypocrites mock the army, then excuse themselves", es: "Un grupo de hipócritas se burla del ejército y luego se excusan.", fr: "Un groupe d'hypocrites se moque de l'armée, puis s'excusent.", ur: "منافقین کا ایک گروہ فوج کا مذاق اڑاتے ہیں، پھر عذر کرتے ہیں۔", tr: "İkiyüzlü bir grubun alay konusu olması ve özür dilemeleri.", id: "Ejekan terhadap sekelompok orang munafik dan permintaan maaf mereka" }
summary:
  ar: "كان رهط من «المنافقين» منهم وديعة بن ثابت ومخشن بن حمير الأشجعي يسيرون إلى النبي وهو منطلق إلى تبوك فقالوا إن قتال بني الأصفر ليس كقتال العرب وإنهم سيُربطون غداً في الحبال؛ فأرسل النبي عمار بن ياسر ليسألهم، فاعتذروا بأنهم كانوا يخوضون ويلعبون، وأنزل الله فيهم آية من سورة التوبة."
  en: A party of the 'hypocrites', among them Wadi'a ibn Thabit and Makhshan ibn Humayr al-Ashja'i, were riding toward the Prophet as he set out for Tabuk and said that fighting the Banu al-Asfar was not like fighting the Arabs and that they would be tied up in ropes tomorrow. The Prophet sent Ammar ibn Yasir to question them; they excused themselves that they had only been jesting and playing, and God revealed a verse of Sura al-Tawba about them.
  es: "Un grupo de hipócritas, entre ellos Wadi'a ibn Thabit y Makhshan ibn Humayr al-Ashja'i, cabalgaban hacia el Profeta cuando este partía hacia Tabuk y le dijeron que luchar contra los Banu al-Asfar no era como luchar contra los árabes y que mañana estarían atados con cuerdas. El Profeta envió a Ammar ibn Yasir para interrogarlos; ellos se excusaron diciendo que solo estaban bromeando y jugando, y Dios reveló un versículo de la Sura al-Tawba sobre ellos."
  fr: "Un groupe d'« hypocrites », parmi lesquels Wadi'a ibn Thabit et Makhshan ibn Humayr al-Ashja'i, se rendaient auprès du Prophète alors qu'il partait pour Tabuk. Ils affirmèrent que combattre les Banu al-Asfar n'était pas comparable à combattre les Arabes et qu'ils seraient ligotés le lendemain. Le Prophète envoya Ammar ibn Yasir les interroger; ils se justifièrent en prétendant plaisanter, et Dieu révéla alors un verset de la sourate At-Tawba à leur sujet."
  ur: "منافقین کی ایک جماعت جن میں ودیع بن ثابت اور مخزن بن حمیر اشجعی تھے سوار ہو کر رسول اللہ کی طرف تبوک کی طرف روانہ ہوئے اور کہا کہ بنو الاصفر سے لڑنا عربوں سے لڑنے کے مترادف نہیں ہے اور وہ کل رسیوں میں بندھ جائیں گے۔ نبی نے عمار بن یاسر کو ان سے سوال کرنے کے لیے بھیجا۔ انہوں نے اپنے آپ کو عذر کیا کہ وہ صرف مذاق اور کھیل رہے تھے، اور خدا نے ان کے بارے میں سورہ توبہ کی ایک آیت نازل کی۔"
  tr: "Peygamberimiz Tebük'e giderken, aralarında Vadi'ah bin Sabit ve Muhşan bin Himyar el-Aşcai'nin de bulunduğu bir grup \"münafık\" ona doğru gidiyordu. Bizanslılarla savaşmanın Araplarla savaşmak gibi olmadığını ve yarın iplerle bağlanacaklarını söylediler. Bunun üzerine Peygamberimiz, onlara sorması için Ammar bin Yasir'i gönderdi. Onlar da şaka yaptıklarını ve oyun oynadıklarını söyleyerek kendilerini savundular. Bunun üzerine Allah, onlar hakkında Tevbe Suresi'nden bir ayet indirdi."
  id: "Sekelompok “orang munafik,” termasuk Wadi’ah bin Thabit dan Mukhshan bin Himyar al-Ashja’i, mendatangi Nabi ketika beliau sedang menuju Tabuk. Mereka mengatakan bahwa memerangi Bizantium tidak seperti memerangi Arab dan bahwa mereka akan diikat dengan tali besok. Maka Nabi mengutus Ammar bin Yasir untuk bertanya kepada mereka, dan mereka beralasan bahwa mereka hanya bercanda dan bermain-main. Dan Allah menurunkan sebuah ayat dari Surat al-Tawbah tentang mereka."
