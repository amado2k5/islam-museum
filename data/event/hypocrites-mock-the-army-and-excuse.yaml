label: { ar: "سخرية رهط من المنافقين واعتذارهم", en: "A group of hypocrites mock the army, then excuse themselves" }
summary:
  ar: "كان رهط من «المنافقين» منهم وديعة بن ثابت ومخشن بن حمير الأشجعي يسيرون إلى النبي وهو منطلق إلى تبوك فقالوا إن قتال بني الأصفر ليس كقتال العرب وإنهم سيُربطون غداً في الحبال؛ فأرسل النبي عمار بن ياسر ليسألهم، فاعتذروا بأنهم كانوا يخوضون ويلعبون، وأنزل الله فيهم آية من سورة التوبة."
  en: A party of the 'hypocrites', among them Wadi'a ibn Thabit and Makhshan ibn Humayr al-Ashja'i, were riding toward the Prophet as he set out for Tabuk and said that fighting the Banu al-Asfar was not like fighting the Arabs and that they would be tied up in ropes tomorrow. The Prophet sent Ammar ibn Yasir to question them; they excused themselves that they had only been jesting and playing, and God revealed a verse of Sura al-Tawba about them.
