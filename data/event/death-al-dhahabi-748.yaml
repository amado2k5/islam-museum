label:
  ar: "وفاة شمس الدين الذهبي بدمشق، ٧٤٨هـ"
  en: "Death of Shams al-Din al-Dhahabi at Damascus, 748/1348"
  ur: "شمس الدین ذہبی کی وفات دمشق میں، 748ھ/1348ء"
summary:
  ar: "توفي الذهبي بدمشق ليلة الثالث من ذي القعدة سنة ٧٤٨هـ {cite:durar-kamina-jil-1993 3/338}، وهو ما ورد عند السبكي والسيوطي بليلة الأحد-الاثنين ثالث ذي القعدة الموافق ٤ فبراير ١٣٤٨م، ودُفن بباب الصغير، وأضرّ قبل موته بسنين؛ وكان من أشهر تلاميذه عبد الوهاب السبكي صاحب «طبقات الشافعية الكبرى»، وكان أبوه تقي الدين السبكي أخلص أصدقائه {cite:encyclopaedia-of-islam-2 vol. 2 p. 214-215}."
  en: "Al-Dhahabi died at Damascus on the night of 3 Dhu al-Qa'da 748 {cite:durar-kamina-jil-1993 3/338} — the Sunday-Monday night corresponding to 4 February 1348 as al-Subki and al-Suyuti report — and was buried at the Bab al-Saghir; he had been blinded some years before. Among his most famous pupils was Abd al-Wahhab al-Subki, author of the Tabaqat al-Shafi'iyya al-Kubra, whose father Taqi al-Din al-Subki was his most intimate friend {cite:encyclopaedia-of-islam-2 vol. 2 p. 214-215}."
  ur: "ذہبی دمشق میں 3 ذی القعدہ 748ھ کی رات فوت ہوئے {cite:durar-kamina-jil-1993 3/338} — سبکی اور سیوطی کے مطابق اتوار-پیر کی وہ رات 4 فروری 1348ء تھی — اور باب الصغیر میں دفن ہوئے؛ وفات سے کچھ برس پہلے نابینا ہو چکے تھے۔ ان کے مشہور ترین شاگرد عبد الوہاب سبکی، صاحبِ «طبقات الشافعیہ الکبری»، تھے جن کے والد تقی الدین سبکی ان کے گہرے دوست تھے {cite:encyclopaedia-of-islam-2 vol. 2 p. 214-215}۔"
