label:
  ar: "وفاة شمس الدين الذهبي بدمشق، ٧٤٨هـ"
  en: "Death of Shams al-Din al-Dhahabi at Damascus, 748/1348"
  ur: "شمس الدین ذہبی کی وفات دمشق میں، 748ھ/1348ء"
  es: "Muerte de Shams al-Din al-Dhahabi en Damasco, 748/1348"
  fr: "Mort de Shams al-Din al-Dhahabi à Damas, 748/1348"
  tr: "Şemseddin Zehebi, Hicri 748 yılında Şam'da vefat etti."
  id: "Shams al-Din al-Dhahabi meninggal di Damaskus pada tahun 748 Hijriah."
summary:
  ar: "توفي الذهبي بدمشق ليلة الثالث من ذي القعدة سنة ٧٤٨هـ {cite:durar-kamina-jil-1993 3/338}، وهو ما ورد عند السبكي والسيوطي بليلة الأحد-الاثنين ثالث ذي القعدة الموافق ٤ فبراير ١٣٤٨م، ودُفن بباب الصغير، وأضرّ قبل موته بسنين؛ وكان من أشهر تلاميذه عبد الوهاب السبكي صاحب «طبقات الشافعية الكبرى»، وكان أبوه تقي الدين السبكي أخلص أصدقائه {cite:encyclopaedia-of-islam-2 vol. 2 p. 214-215}."
  en: "Al-Dhahabi died at Damascus on the night of 3 Dhu al-Qa'da 748 {cite:durar-kamina-jil-1993 3/338} — the Sunday-Monday night corresponding to 4 February 1348 as al-Subki and al-Suyuti report — and was buried at the Bab al-Saghir; he had been blinded some years before. Among his most famous pupils was Abd al-Wahhab al-Subki, author of the Tabaqat al-Shafi'iyya al-Kubra, whose father Taqi al-Din al-Subki was his most intimate friend {cite:encyclopaedia-of-islam-2 vol. 2 p. 214-215}."
  ur: "ذہبی دمشق میں 3 ذی القعدہ 748ھ کی رات فوت ہوئے {cite:durar-kamina-jil-1993 3/338} — سبکی اور سیوطی کے مطابق اتوار-پیر کی وہ رات 4 فروری 1348ء تھی — اور باب الصغیر میں دفن ہوئے؛ وفات سے کچھ برس پہلے نابینا ہو چکے تھے۔ ان کے مشہور ترین شاگرد عبد الوہاب سبکی، صاحبِ «طبقات الشافعیہ الکبری»، تھے جن کے والد تقی الدین سبکی ان کے گہرے دوست تھے {cite:encyclopaedia-of-islam-2 vol. 2 p. 214-215}۔"
  es: "Al-Dhahabi murió en Damasco la noche del 3 de Dhu al-Qa'da de 748 {cite:durar-kamina-jil-1993 3/338} —la noche del domingo al lunes que corresponde al 4 de febrero de 1348, según relataron al-Subki y al-Suyuti— y fue enterrado en Bab al-Saghir; había quedado ciego algunos años antes. Entre sus discípulos más famosos se encontraba Abd al-Wahhab al-Subki, autor del Tabaqat al-Shafi'iyya al-Kubra, cuyo padre, Taqi al-Din al-Subki, fue su amigo más íntimo {cite:encyclopaedia-of-islam-2 vol. 2 p. 214-215}."
  fr: "Al-Dhahabi mourut à Damas dans la nuit du 3 Dhu al-Qa'da 748 (correspondant au 4 février 1348 selon al-Subki et al-Suyuti) et fut inhumé à Bab al-Saghir; il avait été rendu aveugle quelques années auparavant. Parmi ses élèves les plus célèbres figurait Abd al-Wahhab al-Subki, auteur du Tabaqat al-Shafi'iyya al-Kubra, dont le père, Taqi al-Din al-Subki, était son ami le plus intime."
  tr: "El-Dhahabi, Hicri 748 yılının Zilhicce ayının üçüncü gecesi Şam'da vefat etti (kaynak:durar-kamina-jil-1993 3/338). Bu, El-Subki ve El-Suyuti'nin Zilhicce ayının üçüncü günü, Pazar-Pazartesi gecesi, yani Miladi 4 Şubat 1348'e denk gelen tarihte vefat ettiğini bildirmeleriyle örtüşmektedir. Bab el-Saghir'e defnedildi. Ölümünden yıllar önce kör olmuştu. En ünlü öğrencilerinden biri, \"Şafiî Alimlerinin Büyük Dersleri\" adlı eserin yazarı Abdül-Vahhab el-Subki idi. Babası Taki el-Din el-Subki, en yakın arkadaşlarından biriydi (kaynak:encyclopaedia-of-islam-2 cilt 2 s. 214-215)."
  id: "Al-Dhahabi wafat di Damaskus pada malam tanggal 3 Dzul Qi'dah tahun 748 H {cite:durar-kamina-jil-1993 3/338}, yang juga disebutkan oleh Al-Subki dan Al-Suyuti pada malam Minggu-Senin, tanggal 3 Dzul Qi'dah, yang bertepatan dengan tanggal 4 Februari 1348 M. Beliau dimakamkan di Bab al-Saghir. Beliau telah buta selama bertahun-tahun sebelum kematiannya. Salah satu muridnya yang paling terkenal adalah Abd al-Wahhab al-Subki, penulis kitab “Kitab-kitab Besar Ulama Syafi'i”. Ayahnya, Taqi al-Din al-Subki, adalah salah satu sahabat terdekatnya {cite:encyclopaedia-of-islam-2 vol. 2 p. 214-215}."
