label: { ar: "دخول التتر ديار بكر والجزيرة" }
summary:
  ar: "في سنة ثمان وعشرين وستمائة لما انهزم جلال الدين بن خوارزم شاه من التتر على آمد نهب التتر سواد آمد وأرزن وميافارقين وقصدوا مدينة أسعرد فقاتلهم أهلها حتى بذلوا لهم الأمان فوثقوا واستسلموا فلما تمكنوا منهم بذلوا فيهم السيف، وحكى ابن الأثير عن بعض التجار أنهم حزروا القتلى ما يزيد على خمسة عشر ألفاً، ثم ساروا إلى طنزة ففعلوا كذلك، وإلى وادي القريشية وفيه طائفة من الأكراد يقال لهم القريشية فقاتلوهم فمنعوهم وامتنعوا عليهم فعاد التتر ولم يبلغوا منهم غرضاً، فساروا لا مانع يمنعهم إلى ماردين فنهبوا سوادها واحتمى أهلها بالقلعة، وإلى نصيبين الجزيرة فأقاموا عليها بعض نهار ونهبوا سوادها وعادوا عنها، وإلى جبال سنجار والخابور وعرابان، وإلى قرية المؤنسة على مرحلة من نصيبين بينها وبين الموصل فاحتمى أهلها بخان فيها فقتلوا كل من فيه، ويحكي عن رجل اختفى في بيت فيه تبن أنه كان يراهم من نافذة إذا أرادوا قتل إنسان قال لا بالله فيقتلونه ثم رآهم يلعبون على الخيل ويضحكون ويغنون بلغتهم بقولهم لا بالله، ويحكي عن رجل كان معه سبعة عشر فجاءهم فارس من التتر فأمرهم أن يكتف بعضهم بعضاً فلم يجسر أحد على قتله حتى أخذ الرجل سكيناً وقتله فنجوا، ثم ساروا إلى بدليس فأحرقوا المدينة بعد تحصن أهلها بالقلعة والجبال، وإلى باكري من أعمال خلاط وهي من أحصن البلاد فملكوها عنوة وقتلوا كل من بها، وإلى أرجيش ففعلوا كذلك في ذي الحجة، ووصلت طائفة منهم من أذربيجان إلى أعمال إربل فقتلوا في طريقهم من التركمان الأيوائية والأكراد والجوزقان ونهبوا القرى حتى دخلوا بلد إربل، وبرز مظفر الدين صاحب إربل في عساكره مستمداً بعساكر الموصل فلما بلغه عودهم إلى أذربيجان أقام ولم يتبعهم، فوصلوا الكرخيني ودقوقا وعادوا سالمين لم يذعرهم أحد {cite:kamil-ibn-al-athir p. 492-494}."
