label: { ar: "دخول التتر ديار بكر والجزيرة", en: "The Mongols Enter Diyar Bakr and al-Jazira", es: "Los mongoles entran en Diyar Bakr y al-Jazira", fr: "Les Mongols entrent dans Diyar Bakr et al-Jazira" }
summary:
  ar: "في سنة ثمان وعشرين وستمائة لما انهزم جلال الدين بن خوارزم شاه من التتر على آمد نهب التتر سواد آمد وأرزن وميافارقين وقصدوا مدينة أسعرد فقاتلهم أهلها حتى بذلوا لهم الأمان فوثقوا واستسلموا فلما تمكنوا منهم بذلوا فيهم السيف، وحكى ابن الأثير عن بعض التجار أنهم حزروا القتلى ما يزيد على خمسة عشر ألفاً، ثم ساروا إلى طنزة ففعلوا كذلك، وإلى وادي القريشية وفيه طائفة من الأكراد يقال لهم القريشية فقاتلوهم فمنعوهم وامتنعوا عليهم فعاد التتر ولم يبلغوا منهم غرضاً، فساروا لا مانع يمنعهم إلى ماردين فنهبوا سوادها واحتمى أهلها بالقلعة، وإلى نصيبين الجزيرة فأقاموا عليها بعض نهار ونهبوا سوادها وعادوا عنها، وإلى جبال سنجار والخابور وعرابان، وإلى قرية المؤنسة على مرحلة من نصيبين بينها وبين الموصل فاحتمى أهلها بخان فيها فقتلوا كل من فيه، ويحكي عن رجل اختفى في بيت فيه تبن أنه كان يراهم من نافذة إذا أرادوا قتل إنسان قال لا بالله فيقتلونه ثم رآهم يلعبون على الخيل ويضحكون ويغنون بلغتهم بقولهم لا بالله، ويحكي عن رجل كان معه سبعة عشر فجاءهم فارس من التتر فأمرهم أن يكتف بعضهم بعضاً فلم يجسر أحد على قتله حتى أخذ الرجل سكيناً وقتله فنجوا، ثم ساروا إلى بدليس فأحرقوا المدينة بعد تحصن أهلها بالقلعة والجبال، وإلى باكري من أعمال خلاط وهي من أحصن البلاد فملكوها عنوة وقتلوا كل من بها، وإلى أرجيش ففعلوا كذلك في ذي الحجة، ووصلت طائفة منهم من أذربيجان إلى أعمال إربل فقتلوا في طريقهم من التركمان الأيوائية والأكراد والجوزقان ونهبوا القرى حتى دخلوا بلد إربل، وبرز مظفر الدين صاحب إربل في عساكره مستمداً بعساكر الموصل فلما بلغه عودهم إلى أذربيجان أقام ولم يتبعهم، فوصلوا الكرخيني ودقوقا وعادوا سالمين لم يذعرهم أحد {cite:kamil-ibn-al-athir p. 492-494}."
  en: "In 628, after Jalal al-Din ibn Khwarazm-shah was routed by the Mongols at Amid, they plundered the countryside of Amid, Arzan and Mayyafariqin, then marched on the city of Sa'ird. Its people fought them until they were granted safe-conduct; they trusted and surrendered, and once the Mongols had them in their power they put them to the sword. Ibn al-Athir reports from a merchant that the dead were estimated at more than fifteen thousand. They did the same at Tanza, then went to the valley of al-Qurayshiyya, where a Kurdish group called the Qurayshiyya fought them, repelled them and held their ground, so the Mongols turned back without reaching their aim. They then marched unopposed to Mardin and plundered its countryside, while its people sheltered in the citadel; to Nusaybin of al-Jazira, where they stayed part of a day, plundered its environs and withdrew; to the mountains of Sinjar, the Khabur and 'Arabanan; and to the village of al-Mu'nisa, a day's march from Nusaybin on the way to Mosul, whose people took refuge in an inn, and the Mongols killed everyone in it. Ibn al-Athir also tells of a man who hid in a room full of straw and watched through a window: when they wished to kill someone, the victim said 'la billah' ('no, by God') and they killed him anyway. Later he saw them playing on horseback, laughing and singing in their own language, 'la billah'. He tells too of a man with seventeen companions who was met by a Mongol horseman ordering them to bind one another; none dared kill his companion until the man took a knife and killed him, and they escaped. They then went to Bidlis and burned the city after its people had fortified themselves in the citadel and the mountains; to Bakri, in the districts of Khilat, one of the strongest places, which they took by storm, killing all within; and to Arjish, where they did likewise in Dhu'l-Hijja. A group came from Azerbaijan into the districts of Irbil and on the way killed Turkmen of the Ayvā'iyya, Kurds and al-Jawzaqan, plundering the villages until they entered the land of Irbil. Muzaffar al-Din, lord of Irbil, marched out with his troops, seeking reinforcement from Mosul's forces; when he learned they had gone back to Azerbaijan, he stayed put and did not pursue them. The Mongols reached al-Karkhini and Daquqa and returned safely, no one having frightened them {cite:kamil-ibn-al-athir p. 492-494}."
  es: "En 628, después de que Jalal al-Din ibn Khwarazm-shah fuera derrotado por los mongoles en Amid, saquearon los campos de Amid, Arzan y Mayyafariqin, y luego marcharon hacia la ciudad de Sa'ird. Sus habitantes lucharon contra ellos hasta que se les concedió salvoconducto; confiaron y se rindieron, y una vez que los mongoles los tuvieron en su poder, los pasaron a cuchillo. Ibn al-Athir informa de un comerciante que los muertos se estimaron en más de quince mil. Hicieron lo mismo en Tanza, luego fueron al valle de al-Qurayshiyya, donde un grupo kurdo llamado Qurayshiyya luchó contra ellos, los repelió y mantuvo su posición, por lo que los mongoles retrocedieron sin alcanzar su objetivo. Luego marcharon sin oposición a Mardin y saquearon sus campos, mientras sus habitantes se refugiaban en la ciudadela; a Nusaybin de al-Jazira, donde permanecieron parte de un día, saquearon sus alrededores y se retiraron; a las montañas de Sinjar, el Khabur y el 'Arabanan; y al pueblo de al-Mu'nisa, a un día de marcha de Nusaybin en el camino a Mosul, cuya gente se refugió en una posada, y los mongoles mataron a todos los que estaban allí. Ibn al-Athir también cuenta de un hombre que se escondió en una habitación llena de paja y observó a través de una ventana: cuando quisieron matar a alguien, la víctima dijo 'la billah' ('no, por Dios') y lo mataron de todos modos. Más tarde los vio jugando a caballo, riendo y cantando en su propio idioma, 'la billah'. Cuenta también de un hombre con diecisiete compañeros que fue recibido por un jinete mongol que les ordenó atarse unos a otros; ninguno se atrevió a matar a su compañero hasta que el hombre tomó un cuchillo y lo mató, y escaparon. Luego fueron a Bidlis y quemaron la ciudad después de que su gente se hubiera fortificado en la ciudadela y las montañas; a Bakri, en los distritos de Khilat, uno de los lugares más fuertes, que tomaron por asalto, matando a todos los que estaban dentro; y a Arjish, donde hicieron lo mismo en Dhu'l-Hijja. Un grupo llegó desde Azerbaiyán a los distritos de Erbil y en el camino mató a turcomanos de Ayvā'iyya, kurdos y al-Jawzaqan, saqueando las aldeas hasta que entraron en la tierra de Erbil. Muzaffar al-Din, señor de Erbil, salió con sus tropas, buscando refuerzos de las fuerzas de Mosul; cuando supo que habían regresado a Azerbaiyán, se quedó y no los persiguió. Los mongoles llegaron a al-Karkhini y Daquqa y regresaron sanos y salvos, sin que nadie los asustara {cite:kamil-ibn-al-athir p. 492-494}."
  fr: "En 628, après la déroute de Jalal al-Din ibn Khwarazm-shah par les Mongols à Amid, ces derniers pillèrent la campagne d'Amid, d'Arzan et de Mayyafariqin, puis marchèrent sur la ville de Sa'ird. Ses habitants résistèrent jusqu'à obtenir un sauf-conduit; confiants, ils se rendirent, et une fois les Mongols à leur merci, ils les massacrèrent. Ibn al-Athir rapporte d'après un marchand que le nombre de morts fut estimé à plus de quinze mille. Ils agissaient de même à Tanza, puis se rendirent dans la vallée d'al-Qurayshiyya, où un groupe kurde du nom de Qurayshiyya leur opposa une résistance, les repoussa et tint bon, contraignant les Mongols à rebrousser chemin sans atteindre leur objectif. Ils marchèrent ensuite sans rencontrer de résistance jusqu'à Mardin et pillèrent sa campagne, tandis que ses habitants se réfugiaient dans la citadelle; puis jusqu'à Nusaybin d'al-Jazira, où ils s'arrêtèrent une partie de la journée, pillèrent les environs et se retirèrent. jusqu'aux montagnes de Sinjar, du Khabour et d'Arabanan; et jusqu'au village d'al-Mu'nisa, à une journée de marche de Nusaybin sur la route de Mossoul, dont les habitants s'étaient réfugiés dans une auberge, et les Mongols massacrèrent tous ses occupants. Ibn al-Athir raconte aussi l'histoire d'un homme qui se cacha dans une pièce remplie de paille et observa par une fenêtre: lorsqu'ils voulaient tuer quelqu'un, la victime disait « la billah » (« non, par Dieu ») et ils la tuaient malgré tout. Plus tard, il les vit jouer à cheval, riant et chantant dans leur langue, « la billah ». Il raconte également l'histoire d'un homme accompagné de dix-sept compagnons qui furent accueillis par un cavalier mongol leur ordonnant de s'attacher les uns les autres; aucun n'osa tuer son compagnon jusqu'à ce que l'homme prenne un couteau et le tue, et ils s'enfuirent. Ils se rendirent ensuite à Bidlis et incendièrent la ville après que ses habitants se furent retranchés dans la citadelle et les montagnes. À Bakri, dans les districts de Khilat, l'une des places fortes les plus prisées, ils la prirent d'assaut, massacrant tous ses habitants; et à Arjish, où ils firent de même en Dhu'l-Hijja. Un groupe venu d'Azerbaïdjan pénétra dans les districts d'Erbil et, en chemin, massacra des Turkmènes de l'Ayvā'iyya, des Kurdes et des al-Jawzaqan, pillant les villages jusqu'à atteindre le territoire d'Erbil. Muzaffar al-Din, seigneur d'Erbil, partit avec ses troupes chercher des renforts auprès des forces de Mossoul; lorsqu'il apprit qu'elles étaient retournées en Azerbaïdjan, il resta sur place et ne les poursuivit pas. Les Mongols atteignirent al-Karkhini et Daquqa et revinrent sains et saufs, sans avoir été effrayés (voir: Kamil ibn al-Athir, p. 492-494)."
