id: event/kundaj-interception-269
class: event
kind: other
label: { ar: "اعتراض ابن كنداج المعتمد ومحجوره", en: "Ibn Kundaj intercepts al-Mu'tamid and confines him, 269", es: "Ibn Kundaj intercepta a al-Mu'tamid y lo encarcela, 269", fr: "Ibn Kundaj intercepte al-Mu'tamid et le confine, 269", ur: "ابن کندج نے المتمد کو روکا اور اسے قید کر دیا، 269", tr: "İbn Kandaj'ın itirazı ve vasisi", id: "Keberatan Ibnu Kandaj dan walinya" }
summary:
  ar: "في سنة تسع وستين اشتد تخيل المعتمد من أخيه الموفق فكاتب أحمد بن طولون نائبه بمصر فخرج ابن طولون حتى قدم دمشق وخرج المعتمد من سامراء على وجه التنزه وقصده دمشق، فلما بلغ ذلك الموفق كتب إلى إسحاق بن كنداج ليرده فركب من نصيبين فلقيه بين الموصل والحديثة فرده إلى سامراء وأنزل في دار أحمد بن الخصيب ومنع من نزول دار الخلافة ووكل به خمس مئة رجل، فبعث الموفق إلى إسحاق بخلع وأموال ولقبه ذا السيفين ولقب صاعد بن مخلد ذا الوزارتين وليس للمعتمد حل ولا ربط، وهو أول خليفة قهر وحجر عليه ووكل به {cite:tarikh-khulafa-minhaj-1434 p. 566-567}."
  en: "In 269, al-Mu'tamid's fear of his brother al-Muwaffaq peaked — he corresponded with his Egypt deputy Ahmad ibn Tulun and slipped out of Samarra for Damascus. Al-Muwaffaq sent Ishaq ibn Kundaj, who caught him between Mosul and Haditha, escorted him back and confined him to Ibn al-Khasib's house under five hundred guards. Ibn Kundaj received khil'as, money and the title Dhu'l-Sayfayn, Sa'id ibn Makhlad Dhu'l-Wizaratayn — and al-Mu'tamid lost all binding and loosing, the first caliph ever cowed, sequestered and warded {cite:tarikh-khulafa-minhaj-1434 p. 566-567}."
  es: "En 269, el temor de al-Mu'tamid hacia su hermano al-Muwaffaq alcanzó su punto máximo: se carteó con su lugarteniente en Egipto, Ahmad ibn Tulun, y escapó de Samarra rumbo a Damasco. Al-Muwaffaq envió a Ishaq ibn Kundaj, quien lo capturó entre Mosul y Haditha, lo escoltó de regreso y lo confinó en la casa de Ibn al-Khasib bajo quinientos guardias. Ibn Kundaj recibió el título de khil'as, dinero y el título de Dhu'l-Sayfayn, Sa'id ibn Makhlad Dhu'l-Wizaratayn; y al-Mu'tamid perdió todo poder de atar y desatar, convirtiéndose en el primer califa amedrentado, aislado y custodiado {cite:tarikh-khulafa-minhaj-1434 p. 566-567}."
  fr: "En 269, la crainte d'al-Mu'tamid envers son frère al-Muwaffaq atteignit son paroxysme: il correspondit avec son adjoint en Égypte, Ahmad ibn Tulun, et quitta Samarra pour Damas. Al-Muwaffaq envoya Ishaq ibn Kundaj, qui le rattrapa entre Mossoul et Haditha, l'escorta et le confina dans la maison d'Ibn al-Khasib, sous la surveillance de cinq cents gardes. Ibn Kundaj reçut le khil'as, de l'argent et le titre de Dhu'l-Sayfayn, Sa'id ibn Makhlad celui de Dhu'l-Wizaratayn. Al-Mu'tamid perdit tout pouvoir de lier et de délier, devenant ainsi le premier calife jamais soumis, séquestré et mis sous tutelle."
  ur: "269 میں، المتمید کا اپنے بھائی الموفق سے خوف عروج پر تھا - اس نے اپنے مصری نائب احمد بن طولون سے خط و کتابت کی اور سامرا سے دمشق کے لیے نکل گیا۔ الموفق نے اسحاق بن قندج کو بھیجا، جس نے اسے موصل اور حدیدہ کے درمیان پکڑا، اسے واپس لے گیا اور اسے ابن الخصیب کے گھر تک پانچ سو محافظوں میں قید کر دیا۔ ابن قندج کو خلع، رقم اور لقب ذوالصفین، سعید ابن مخلد ذوال وزراتین - اور المتمید نے تمام پابندیاں اور کھوئے ہوئے، سب سے پہلے خلیفہ کو گائے، الگ الگ اور وارد کیا {حوالہ: تاریخ الخلفاء صفحہ 144-43۔ 566-567}۔"
  tr: "69. yılda, El-Mu'tamid'in kardeşi El-Muvaffak'a olan şüphesi arttı ve Mısır'daki vekili Ahmed ibn Tulun'a mektup yazdı. İbn Tulun daha sonra Şam'a kadar gitti ve El-Mu'tamid de Samarra'dan bir geziye çıkarak Şam'a doğru yola koyuldu. Bu durum El-Muvaffak'a ulaştığında, İshak ibn Kandaj'a onu geri getirmesi için mektup yazdı. Bunun üzerine İshak, Nusaybin'den yola çıktı, Musul ile Haditha arasında onunla buluştu ve onu Samarra'ya geri getirdi. Onu Ahmed ibn Al-Khasib'in evine yerleştirdi ve halifenin sarayında kalmasını engelledi; ayrıca onu korumak için beş yüz adam görevlendirdi. El-Muvaffak, İshak'a cübbe ve para gönderdi ve ona Zülsayyn (İki Kılıcın Sahibi) unvanını verdi; Sa'id ibn Mukhallad'a ise Zülvisaratyn (İki Bakanlığın Sahibi) unvanını verdi. El-Mu'tamid'in hiçbir gücü veya yetkisi yoktu ve o, alt edilen ve vesayet altına alınan ve kendisini korumakla görevlendirilen ilk halifeydi. {cite:tarikh-khulafa-minhaj-1434 s. 566-567}"
  id: "Pada tahun 69, kecurigaan Al-Mu'tamid terhadap saudaranya, Al-Muwaffaq, semakin meningkat, sehingga ia menulis surat kepada Ahmad ibn Tulun, wakilnya di Mesir. Ibn Tulun kemudian pergi hingga tiba di Damaskus, dan Al-Mu'tamid meninggalkan Samarra untuk berlibur dan menuju Damaskus. Ketika hal ini sampai kepada Al-Muwaffaq, ia menulis surat kepada Ishaq ibn Kandaj untuk membawanya kembali. Maka ia berangkat dari Nusaybin dan menemuinya di antara Mosul dan Al-Haditha, lalu membawanya kembali ke Samarra dan menempatkannya di rumah Ahmad ibn Al-Khasib serta mencegahnya tinggal di istana Khalifah dan menugaskan lima ratus orang untuk menjaganya. Al-Muwaffaq mengirimkan jubah dan uang kepada Ishaq dan memberinya gelar Dhu al-Sayfayn (Pemegang Dua Pedang) dan memberi Sa'id ibn Mukhallad gelar Dhu al-Wizaratayn (Pemegang Dua Kementerian). Al-Mu'tamid tidak memiliki kekuasaan atau wewenang, dan dia adalah Khalifah pertama yang dikalahkan dan ditempatkan di bawah perwalian serta ditugaskan untuk menjaganya. {cite:tarikh-khulafa-minhaj-1434 p. 566-567}."
