label: { ar: "اعتراض ابن كنداج المعتمد ومحجوره" }
summary:
  ar: "في سنة تسع وستين اشتد تخيل المعتمد من أخيه الموفق فكاتب أحمد بن طولون نائبه بمصر فخرج ابن طولون حتى قدم دمشق وخرج المعتمد من سامراء على وجه التنزه وقصده دمشق، فلما بلغ ذلك الموفق كتب إلى إسحاق بن كنداج ليرده فركب من نصيبين فلقيه بين الموصل والحديثة فرده إلى سامراء وأنزل في دار أحمد بن الخصيب ومنع من نزول دار الخلافة ووكل به خمس مئة رجل، فبعث الموفق إلى إسحاق بخلع وأموال ولقبه ذا السيفين ولقب صاعد بن مخلد ذا الوزارتين وليس للمعتمد حل ولا ربط، وهو أول خليفة قهر وحجر عليه ووكل به {cite:tarikh-khulafa-minhaj-1434 p. 566-567}."
  en: "In 269, al-Mu'tamid's fear of his brother al-Muwaffaq peaked — he corresponded with his Egypt deputy Ahmad ibn Tulun and slipped out of Samarra for Damascus. Al-Muwaffaq sent Ishaq ibn Kundaj, who caught him between Mosul and Haditha, escorted him back and confined him to Ibn al-Khasib's house under five hundred guards. Ibn Kundaj received khil'as, money and the title Dhu'l-Sayfayn, Sa'id ibn Makhlad Dhu'l-Wizaratayn — and al-Mu'tamid lost all binding and loosing, the first caliph ever cowed, sequestered and warded {cite:tarikh-khulafa-minhaj-1434 p. 566-567}."
