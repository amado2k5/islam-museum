label: { ar: "الثلاثة الذين خُلّفوا بعد تبوك", en: "The three who were left behind after Tabuk" }
summary:
  ar: "بعد عودة النبي إلى المدينة نهى عن كلام ثلاثة من المسلمين تخلفوا عن تبوك «من غير شك ولا نفاق» بحسب ابن إسحاق، وهم كعب بن مالك ومرارة بن الربيع وهلال بن أمية، فاعتزلهم الناس خمسين ليلة حتى أُعلنت توبتهم بعد صلاة الفجر. ويروي البخاري القصة كاملة بلسان كعب بن مالك: التخلف دون عذر، والمصارحة بالحق دون كذب، وهجر الناس خمسين ليلة، وكتاب ملك غسان، حتى إعلان التوبة بعد صلاة الفجر {cite:sahih-al-bukhari 4418}."
  en: "After the Prophet returned to Medina he forbade speech with three Muslims who had stayed behind from Tabuk 'without doubt and without hypocrisy' in Ibn Ishaq's words — Ka'b ibn Malik, Murara ibn al-Rabi' and Hilal ibn Umayya. People withdrew from them for fifty nights until their repentance was announced after the dawn prayer."
