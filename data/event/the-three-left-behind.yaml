    summary: { ar: "يروي ابن إسحاق القصة عن كعب بن مالك نفسه، ويصف الثلاثة بأنهم تخلفوا «من غير شك ولا نفاق»، وينقل نزول الآيات في توبتهم (9:117-118)؛ ويستخرج الفقهاء من القصة أحكاماً في التوبة والصدق وهجر العاصي، وهذا الاستخراج يحتاج إلى مراجعة شروح بعينها (needs_source).", en: "Ibn Ishaq relates the story from Ka'b ibn Malik himself, describes the three as having stayed behind 'without doubt and without hypocrisy', and transmits the revelation of the verses on their repentance (9:117-118); jurists derive from the story rulings on repentance, truthfulness and shunning the disobedient — this derivation still needs review of specific commentaries (needs_source)." }
