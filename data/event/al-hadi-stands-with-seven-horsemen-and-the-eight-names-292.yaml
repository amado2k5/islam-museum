id: event/al-hadi-stands-with-seven-horsemen-and-the-eight-names-292
class: event
kind: other
label:
  ar: "وقوف الهادي بسبعة فرسان وذكر أسمائهم الثمانية، ص296-297"
  en: "Al-Hadi stands with seven horsemen and the eight names given, pp. 296-297"
  ur: "ہادی کا سات سواروں کے ساتھ کھڑے ہونا اور دیے گئے آٹھ نام، ص296-297"
  es: "Al-Hadi aparece con siete jinetes y los ocho nombres mencionados, págs. 296-297."
  fr: "Al-Hadi se tient debout avec sept cavaliers et les huit noms mentionnés, pp. 296-297"
summary:
  ar: "يقف الهادي وليس معه إلا سبعة فرسان، ويسمّيهم الكتاب فيعدّون ثمانية، وينبّه المحقق في الحاشية على الفرق ويقول إن العدد الصحيح لعله تسعة؛ ثم يقف الهادي مقابلاً لعسكر الحكمي وقد وقع أصحابه في المعسكر ونهبوه."
  en: "Al-Hadi stands with only seven horsemen whom the book names, though the names make eight, and the editor notes the difference in a footnote and suggests that the right number may be nine; al-Hadi then stands facing the Hakami's camp while his men have fallen on the camp and plundered it."
  ur: "ہادی کے ساتھ صرف سات سوار رہ جاتے ہیں جن کے نام کتاب دیتی ہے مگر وہ آٹھ بنتے ہیں؛ محقق حاشیے میں اس فرق کی طرف توجہ دلاتا ہے اور کہتا ہے کہ درست عدد شاید نو ہو؛ پھر ہادی حکمی کے لشکر کے سامنے کھڑے ہوتے ہیں اور ان کے لوگ لشکرگاہ میں گھس کر اسے لوٹ چکے ہوتے ہیں۔"
  es: "Al-Hadi aparece con tan solo siete jinetes cuyos nombres aparecen en el libro, aunque la suma total es de ocho, y el editor señala la diferencia en una nota a pie de página y sugiere que el número correcto podría ser nueve; luego, Al-Hadi se encuentra frente al campamento de Hakami mientras sus hombres han atacado el campamento y lo han saqueado."
  fr: "Al-Hadi se tient avec seulement sept cavaliers, que le livre nomme, bien que ces noms en fassent huit; l'éditeur note la différence dans une note de bas de page et suggère que le nombre correct pourrait être neuf; al-Hadi se tient alors face au camp du Hakami, tandis que ses hommes ont attaqué le camp et l'ont pillé."
