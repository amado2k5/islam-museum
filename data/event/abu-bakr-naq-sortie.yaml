label: { ar: "خروج أبي بكر إلى نقع وإمرار خالد", en: "Abu Bakr's Sortie to Naq' and Khalid's Command", fr: "Sortie d’Abu Bakr à Naq' et commandement de Khalid", es: "La salida de Abu Bakr a Naq' y el mando de Khalid", ur: "ابوبکر کا نقب اور خالد کا حکم", tr: "Ebu Bekir'in Naqa'ya gidişi ve Halid'in vefatı", id: "Kepergian Abu Bakr ke Naqa' dan wafatnya Khalid" }
summary:
  ar: "خرج أبو بكر في المهاجرين والأنصار حتى بلغ نقعاً حذاء نجد وهربت الأعراب بذراريهم فكلم الناس أبا بكر وقالوا ارجع إلى المدينة وإلى الذرية والنساء وأمر رجلاً على الجيش ولم يزالوا به حتى رجع وأمر خالد بن الوليد وقال له إذا أسلموا وأعطوا الصدقة فمن شاء منكم فليرجع ورجع أبو بكر إلى المدينة وعن ابن عمر لما برز أبو بكر واستوى على راحلته أخذ علي بن أبي طالب بزمامها وقال إلى أين يا خليفة رسول الله أقول لك ما قال لك رسول الله يوم أحد شم سيفك ولا تفجعنا بنفسك وارجع إلى المدينة فوالله لئن فجعنا بك لا يكون للإسلام نظام أبداً وعن حنظلة الليثي أن أبا بكر بعث خالداً وأمره أن يقاتل الناس على خمس من ترك واحدة منهن قاتله كما يقاتل من ترك الخمس جميعاً على شهادة أن لا إله إلا الله وأن محمداً عبده ورسوله وإقام الصلاة وإيتاء الزكاة وصوم رمضان وسار خالد ومن معه في جمادى الآخرة."
  en: "Abu Bakr rode out with the Muhajirun and Ansar to Naq' facing Najd as the a'rab fled with their children; the people pressed him — 'return to Medina, to children and women, and set a man over the army' — till he returned and made Khalid ibn al-Walid commander, 'when they submit and give the sadaqa, whoever will may return'. Ibn Umar: as he sat his mount, Ali took its halter — 'where to, caliph of God's messenger? I tell you what he told you at Uhud: sheathe your sword, do not bereave us of yourself — by God, bereft of you, Islam has no order ever'. And his commission to Khalid: fight the people on the five — the testimony, the prayer, the zakah, the fast — one left out like all five; Khalid marched in Jumada II."
  fr: "Abu Bakr partit avec les Muhajirun et les Ansar jusqu’à Naq', face au Najd, tandis que les Bédouins fuyaient avec leurs enfants. Les gens insistèrent : « Retourne à Médine, auprès des enfants et des femmes, et nomme un homme à la tête de l’armée », jusqu’à ce qu’il revînt et nommât Khalid ibn al-Walid commandant : « Lorsqu’ils se soumettent et versent l’aumône, que celui qui le souhaite revienne. » Selon Ibn Umar, alors qu’il était sur sa monture, Ali en saisit le licol : « Où vas-tu, successeur du Messager de Dieu ? Je te dis ce qu’il te dit à Uhud : rengaine ton épée, ne nous prive pas de toi ; par Dieu, privé de toi, l’islam n’aura jamais d’ordre. » Il chargea Khalid de combattre les gens pour les cinq : l’attestation, la prière, la zakat et le jeûne ; en omettre un revient à les omettre tous les cinq. Khalid partit en jumada II."
  es: "Abu Bakr salió con los Muhajirun y los Ansar hacia Naq' frente a Najd mientras los a'rab huían con sus hijos; la gente lo presionaba: 'regresa a Medina, con los niños y las mujeres, y pon a un hombre al mando del ejército', hasta que regresó y nombró comandante a Khalid ibn al-Walid, 'cuando se sometan y den la sadaqa, quien quiera podrá regresar'. Ibn Umar: mientras montaba a caballo, Ali tomó su cabestro: '¿Adónde, califa del mensajero de Dios? Te diré lo que te dijo en Uhud: envaina tu espada, no nos prives de ti mismo; por Dios, sin ti, el Islam no tiene orden jamás'. Y su encargo a Khalid: lucha contra la gente en los cinco: el testimonio, la oración, el zakat, el ayuno; uno omitido como los cinco; Khalid marchó en Jumada II."
  ur: "ابوبکر مہاجرین اور انصار کے ساتھ نجد کی طرف نقب کی طرف روانہ ہوئے جب اعراب اپنے بچوں کے ساتھ بھاگ رہے تھے۔ لوگوں نے اس پر دباؤ ڈالا - 'مدینہ واپس جاؤ، بچوں اور عورتوں کے پاس، اور ایک آدمی کو فوج پر مقرر کرو' - یہاں تک کہ وہ واپس آئے اور خالد بن ولید کو کمانڈر بنا دیا، 'جب وہ تسلیم کریں اور صدقہ دیں، جو چاہے واپس آئے'۔ ابن عمر: جب وہ اپنی سواری پر بیٹھا تو علی نے اسے روک لیا - 'کہاں جائیں، خدا کے رسول کے خلیفہ؟ میں تمہیں بتاتا ہوں کہ اس نے تمہیں احد کے موقع پر کیا کہا تھا: اپنی تلوار میان کرو، ہمیں اپنے آپ سے محروم نہ کرو، خدا کی قسم، تم سے محروم ہو، اسلام کا کوئی حکم نہیں ہے۔ اور خالد کو اس کا حکم: پانچوں پر لوگوں سے لڑو - گواہی، نماز، زکوٰۃ، روزہ - پانچوں کی طرح ایک چھوڑ دیا گیا تھا۔ خالد نے جمعہ دوم میں مارچ کیا۔"
  tr: "Ebu Bekir, Muhacirler ve Ensar ile birlikte Necd yakınlarındaki Nakka'ya kadar çıktı. Bedeviler aileleriyle birlikte kaçtılar. Halk Ebu Bekir'e şöyle dedi: \"Medine'ye, ailelerine ve kadınlarına dön.\" Ordunun başına bir adam atadı ve o dönene kadar onu beklettiler. Halid ibn el-Velid'e şöyle dedi: \"Eğer İslam'ı kabul ederler ve zekât verirlerse, aranızdan dileyen dönebilir.\" Ebu Bekir Medine'ye döndü. İbn Ömer'in rivayetine göre, Ebu Bekir dışarı çıkıp devesine bindiğinde, Ali ibn Ebu Talib dizginlerini tuttu ve şöyle dedi: \"Ey Allah'ın Resulü'nün halefi, nereye gidiyorsun? Sana Allah'ın Resulü'nün Uhud günü sana söylediğini söylüyorum: Kılıcını kınına sok ve ölümünle bizi üzme. Medine'ye dön, çünkü Allah'a yemin olsun ki, eğer seni üzersek, İslam'da asla düzen olmaz.\" Hanzala el-Laythi'nin rivayetine göre, Ebu Bekir Halid'i göndererek insanlarla beş şey için savaşmasını emretti: Kim bunlardan birini terk ederse, onunla, beşini de terk edenle savaştığı gibi savaşacaktır: Allah'tan başka ilah olmadığına ve Muhammed'in O'nun kulu ve elçisi olduğuna şahitlik etmek, namazı kılmak, zekât vermek ve Ramazan orucunu tutmak. Halid ve yanındakiler Cemâdî-i Ahiret'te yola çıktılar."
  id: "Abu Bakr pergi bersama kaum Muhajirin dan Ansar hingga sampai di Naq’a, dekat Najd. Kaum Badui melarikan diri bersama keluarga mereka. Orang-orang berbicara kepada Abu Bakr dan berkata, “Kembalilah ke Madinah dan kepada keluarga serta para wanita.” Ia menunjuk seorang pemimpin pasukan, dan mereka terus mendesaknya hingga ia kembali. Ia memerintahkan Khalid ibn al-Walid dan berkata kepadanya, “Jika mereka memeluk Islam dan memberikan sedekah, maka siapa pun di antara kalian yang ingin boleh kembali.” Abu Bakr kembali ke Madinah. Berdasarkan riwayat Ibnu Umar, ketika Abu Bakr keluar dan menaiki untanya, Ali ibn Abi Talib memegang kendali unta itu dan berkata, “Ke mana engkau pergi, wahai penerus Rasulullah? Aku akan memberitahumu apa yang dikatakan Rasulullah kepadamu pada hari Perang Uhud: Simpanlah pedangmu dan janganlah engkau membuat kami berduka dengan kematianmu. Kembalilah ke Madinah, karena demi Allah, jika kami membuatmu berduka, Islam tidak akan pernah tertib.” Berdasarkan riwayat dari Hanzala al-Laythi, Abu Bakr mengutus Khalid dan memerintahkannya untuk memerangi orang-orang karena lima hal: siapa pun yang meninggalkan salah satunya, ia harus memeranginya sebagaimana ia memerangi siapa pun yang meninggalkan kelima hal tersebut: kesaksian bahwa tidak ada Tuhan selain Allah dan bahwa Muhammad adalah hamba dan Rasul-Nya, mendirikan salat, memberikan zakat, dan berpuasa Ramadan. Khalid dan orang-orang yang bersamanya berangkat pada Jumada al-Akhirah."
