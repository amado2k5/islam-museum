summary:
  ar: "نزل الإذن بالقتال بعد الهجرة بالمدينة، ولم يكن القصد منه إلا رفع الظلم وإقامة الشعائر، فأرسل النبي الدوريات والسرايا لتأمين طريق قريش التجاري، وعقد الحلف مع القبائل المجاورة، فكانت أول سرية سيف البحر في رمضان سنة اثنتين من الهجرة، ثم تتابعت السرايا والغزوات حتى بدر."
  en: "The permission to fight was revealed after the Hijra in Medina, meant only to lift oppression and to uphold the rites of God; the Prophet sent scouting parties and raids to secure Quraysh's trade route and made alliances with the tribes along it, beginning with the expedition of Sif al-Bahr in Ramadan of the second year of the Hijra, and the raids continued until Badr."
