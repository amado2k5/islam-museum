id: event/permission-to-fight
class: event
kind: law-enacted
label: { ar: "الإذن بالقتال ونشاط السرايا قبل بدر", en: "The permission to fight and the expeditions before Badr", es: "El permiso para luchar y las expediciones antes de Badr", fr: "L'autorisation de combattre et les expéditions avant Badr", ur: "جنگ کی اجازت اور بدر سے پہلے کی مہمات", tr: "Bedir Savaşı öncesinde savaşma izni ve tugayların faaliyetleri", id: "Izin untuk berperang dan aktivitas brigade sebelum Badr" }
summary:
  ar: "نزل الإذن بالقتال بعد الهجرة بالمدينة، ولم يكن القصد منه إلا رفع الظلم وإقامة الشعائر، فأرسل النبي الدوريات والسرايا لتأمين طريق قريش التجاري، وعقد الحلف مع القبائل المجاورة، فكانت أول سرية سيف البحر في رمضان سنة اثنتين من الهجرة، ثم تتابعت السرايا والغزوات حتى بدر."
  en: "The permission to fight was revealed after the Hijra in Medina, meant only to lift oppression and to uphold the rites of God; the Prophet sent scouting parties and raids to secure Quraysh's trade route and made alliances with the tribes along it, beginning with the expedition of Sif al-Bahr in Ramadan of the second year of the Hijra, and the raids continued until Badr."
  es: "El permiso para luchar se reveló después de la Hégira en Medina, con el único propósito de acabar con la opresión y defender los ritos de Dios; el Profeta envió patrullas de reconocimiento e incursiones para asegurar la ruta comercial de los Quraysh y forjó alianzas con las tribus que la bordeaban, comenzando con la expedición de Sif al-Bahr en Ramadán del segundo año de la Hégira, y las incursiones continuaron hasta Badr."
  fr: "L'autorisation de combattre fut révélée après l'Hégire à Médine, dans le seul but de lever l'oppression et de défendre les rites de Dieu; le Prophète envoya des patrouilles et des raids pour sécuriser la route commerciale des Quraysh et forma des alliances avec les tribus qui la bordaient, à commencer par l'expédition de Sif al-Bahr pendant le Ramadan de la deuxième année de l'Hégire, et les raids se poursuivirent jusqu'à Badr."
  ur: "جنگ کی اجازت مدینہ میں ہجرت کے بعد نازل ہوئی، جس کا مقصد صرف ظلم کو اٹھانا اور خدا کی رسومات کو برقرار رکھنا تھا۔ نبی نے قریش کے تجارتی راستے کو محفوظ بنانے کے لیے اسکاؤٹنگ جماعتیں اور چھاپے بھیجے اور اس کے ساتھ موجود قبائل کے ساتھ اتحاد کیا، جس کا آغاز ہجرت کے دوسرے سال رمضان میں سیف البحر کی مہم سے ہوا، اور یہ چھاپے بدر تک جاری رہے۔"
  tr: "Medine'ye hicretten sonra savaşma izni verildi ve amacı sadece adaletsizliği ortadan kaldırmak ve ritüelleri tesis etmekti. Bu nedenle Peygamber, Kureyş ticaret yolunu güvence altına almak için devriyeler ve baskınlar gönderdi ve komşu kabilelerle ittifak kurdu. İlk baskın, hicretin ikinci yılında Ramazan ayında gerçekleşen Deniz Kılıcı baskınıyla oldu ve ardından baskınlar ve savaşlar Bedir'e kadar devam etti."
  id: "Izin untuk berperang diberikan setelah hijrah ke Madinah, dan tujuannya hanya untuk menghilangkan ketidakadilan dan menegakkan ritual. Maka Nabi mengirimkan patroli dan serangan untuk mengamankan jalur perdagangan Quraisy, dan beliau bersekutu dengan suku-suku tetangga. Serangan pertama adalah Perang Pedang Laut pada bulan Ramadan tahun kedua hijrah, dan kemudian serangan dan pertempuran berlanjut hingga Perang Badar."
