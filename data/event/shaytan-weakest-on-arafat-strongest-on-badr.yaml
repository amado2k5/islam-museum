id: event/shaytan-weakest-on-arafat-strongest-on-badr
class: event
kind: other
label:
  ar: "أصغر الشيطان يوم عرفة وأعظم ما رأى يوم بدر"
  en: "The shaytan's least on Arafat and greatest sight on Badr"
  ur: "عرفہ کے دن شیطان کی سب سے چھوٹی حالت اور بدر کے دن اس کا سب سے بڑا منظر"
summary:
  ar: "ما رؤي الشيطان يوما هو فيه أصغر ولا أدحر ولا أحقر ولا أغيظ منه في يوم عرفة، وما ذاك إلا لما رأى من تنزل الرحمة وتجاوز الله عن الذنوب العظام، إلا ما أري يوم بدر فقيل وما رأى يوم بدر قال أما إنه رأى جبريل يزع الملائكة {cite:muwatta-maruf-1997} [[passage/muwatta-6-1269|الموطأ 6:1269]]."
  en: "The shaytan was never seen on a day smaller, more repelled, more despised and more enraged than on the Day of Arafat — all because of the descent of mercy and God's pardoning of great sins — save what he saw on the Day of Badr; asked what he saw, he said: he saw Jibril directing the angels {cite:muwatta-maruf-1997} [[passage/muwatta-6-1269|Muwatta 6:1269]]."
  ur: "شیطان کو کسی دن اتنا چھوٹا، دھکا دیا ہوا، حقیر اور غصے میں نہیں دیکھا گیا جتنا عرفہ کے دن — اور یہ اس رحمت کے نازل ہونے اورالله کی بڑی گناہوں کو معاف کرنے کی وجہ سے تھا — سوائے اس کے جو اس نے بدر کے دن دیکھا؛ پوچھا گیا اس نے کیا دیکھا تو کہا اس نے جبرائیل کو فرشتوں کی قیادت کرتے دیکھا {cite:muwatta-maruf-1997} [[passage/muwatta-6-1269|موطأ 6:1269]]۔"
