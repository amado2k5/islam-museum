id: event/shaytan-weakest-on-arafat-strongest-on-badr
class: event
kind: other
label:
  ar: "أصغر الشيطان يوم عرفة وأعظم ما رأى يوم بدر"
  en: "The shaytan's least on Arafat and greatest sight on Badr"
  ur: "عرفہ کے دن شیطان کی سب سے چھوٹی حالت اور بدر کے دن اس کا سب سے بڑا منظر"
  es: "El shaytan menos en Arafat y la mayor visión en Badr"
  fr: "Le diable est le moins présent à Arafat et le plus présent à Badr."
  tr: "Arafat Günü'nde en küçük şeytan görüldü, Bedir Günü'nde ise en büyük şeytan görüldü."
  id: "Setan terkecil terlihat pada hari Arafah, dan setan terbesar yang dilihatnya adalah pada hari Badr."
summary:
  ar: "ما رؤي الشيطان يوما هو فيه أصغر ولا أدحر ولا أحقر ولا أغيظ منه في يوم عرفة، وما ذاك إلا لما رأى من تنزل الرحمة وتجاوز الله عن الذنوب العظام، إلا ما أري يوم بدر فقيل وما رأى يوم بدر قال أما إنه رأى جبريل يزع الملائكة {cite:muwatta-maruf-1997} [[passage/muwatta-6-1269|الموطأ 6:1269]]."
  en: "The shaytan was never seen on a day smaller, more repelled, more despised and more enraged than on the Day of Arafat — all because of the descent of mercy and God's pardoning of great sins — save what he saw on the Day of Badr; asked what he saw, he said: he saw Jibril directing the angels {cite:muwatta-maruf-1997} [[passage/muwatta-6-1269|Muwatta 6:1269]]."
  ur: "شیطان کو کسی دن اتنا چھوٹا، دھکا دیا ہوا، حقیر اور غصے میں نہیں دیکھا گیا جتنا عرفہ کے دن — اور یہ اس رحمت کے نازل ہونے اورالله کی بڑی گناہوں کو معاف کرنے کی وجہ سے تھا — سوائے اس کے جو اس نے بدر کے دن دیکھا؛ پوچھا گیا اس نے کیا دیکھا تو کہا اس نے جبرائیل کو فرشتوں کی قیادت کرتے دیکھا {cite:muwatta-maruf-1997} [[passage/muwatta-6-1269|موطأ 6:1269]]۔"
  es: "El shaytan nunca fue visto en un día más pequeño, más repelido, más despreciado y más enfurecido que en el Día de Arafat —todo debido al descenso de la misericordia y al perdón de Dios por los grandes pecados— excepto lo que vio en el Día de Badr; al preguntársele qué vio, dijo: vio a Jibril dirigiendo a los ángeles {cite:muwatta-maruf-1997} [[passage/muwatta-6-1269|Muwatta 6:1269]]."
  fr: "Le shaytan n'a jamais été vu un jour plus petit, plus repoussé, plus méprisé et plus enragé que le jour d'Arafat — tout cela à cause de la descente de la miséricorde et du pardon des grands péchés par Dieu — sauf ce qu'il a vu le jour de Badr; lorsqu'on lui a demandé ce qu'il avait vu, il a dit: il a vu Jibril diriger les anges {cite:muwatta-maruf-1997} [[passage/muwatta-6-1269|Muwatta 6:1269]]."
  tr: "Şeytan, Arafat gününden daha küçük, daha yenilmiş, daha aşağılık veya daha öfkeli olduğu başka bir gün görülmemiştir. Bunun tek sebebi, rahmetin inişini ve Allah'ın büyük günahları bağışlamasını görmesiydi; Bedir gününde gördükleri hariç. Denildi ki: \"Bedir gününde ne gördü?\" Dedi ki: \"Cebrail'in melekleri yönettiğini gördü.\" {cite:muwatta-maruf-1997} [[passage/muwatta-6-1269|Al-Muwatta 6:1269]]."
  id: "Setan tidak pernah terlihat pada hari apa pun di mana ia lebih kecil, lebih dikalahkan, lebih hina, atau lebih marah daripada pada hari Arafah. Ini hanya karena apa yang dilihatnya tentang turunnya rahmat dan pengampunan Allah atas dosa-dosa besar, kecuali apa yang dilihatnya pada hari Badar. Dikatakan, “Apa yang dilihatnya pada hari Badar?” Dia berkata, “Dia melihat Jibril memimpin para malaikat.” {cite:muwatta-maruf-1997} [[passage/muwatta-6-1269|Al-Muwatta 6:1269]]."
