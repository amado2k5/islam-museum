label: { ar: "موقعة بئر عقبة ⁦(٩٤٣هـ/١٥٣٦م)⁩", en: "Battle of Bi'r 'Uqba (1536)", fr: "La bataille de Bi'r 'Uqba (1536)", es: "Batalla de Bi'r 'Uqba (1536)", ur: "جنگ بیر عقبہ (1536)" }
summary:
  ar: "الموقعة التي هُزم فيها الملك الوطاسي أحمد أمام السعديين قرب وادي العبيد سنة ٩٤٣هـ/١٥٣٦م، بسبب تخلي قبائل الخلوط التي كانت القوة الأمامية للجيش الوطاسي ونشرها الفوضى في سائر الجيش. قرّبت الهزيمة أحمد الوطاسي من البرتغال فوقّع معها معاهدة أحد عشر عاماً {cite:dawlat-uthmaniyya-salabi p. 221}."
  en: "The 943/1536 battle near Wadi al-'Abid where the Sa'dis defeated Wattasid king Ahmad — the Khalut tribes who formed his vanguard deserted and spread chaos through his army; the defeat drove him into his eleven-year treaty with Portugal {cite:dawlat-uthmaniyya-salabi p. 221}."
  fr: "La bataille de 943/1536 près de l'oued al-'Abid où les Saadiens vainquirent le roi wattasside Ahmad ; les tribus Khalut qui formaient son avant-garde firent défection et semèrent le chaos dans son armée ; la défaite le poussa à conclure son traité de onze ans avec le Portugal {cite:dawlat-uthmaniyya-salabi p. 221}."
  es: "La batalla de 943/1536 cerca de Wadi al-'Abid donde los Sa'dis derrotaron al rey Wattasí Ahmad —las tribus Khalut que formaban su vanguardia desertaron y sembraron el caos en su ejército; la derrota lo llevó a firmar un tratado de once años con Portugal {cite:dawlat-uthmaniyya-salabi p. 221}."
  ur: "وادی العابد کے قریب 943/1536 کی جنگ جہاں سعدیوں نے وطاسد بادشاہ احمد کو شکست دی تھی - خلوت قبائل جنہوں نے اس کا سرغنہ بنایا تھا اور اس کی فوج کے ذریعے افراتفری پھیلائی تھی۔ اس شکست نے اسے پرتگال کے ساتھ گیارہ سالہ معاہدہ کرنے پر مجبور کر دیا۔ 221}۔"
