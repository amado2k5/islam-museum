label: { ar: "عبد الرحمن الثاني يوسع جامع قرطبة", en: "Abd al-Rahman II enlarges the mosque", fr: "Abd al-Rahman II agrandit la mosquée", es: "Abd al-Rahman II amplía la mezquita.", ur: "عبدالرحمٰن ثانی نے مسجد کو بڑا کیا۔", tr: "Abdülrahman II, Kurtuba Ulu Camii'ni genişletti.", id: "Abd al-Rahman II memperluas Masjid Agung Cordoba." }
summary:
  ar: "زاد عبد الرحمن الثاني في جامع قرطبة زيادة كبيرة في صحنه وأسواقه في النصف الأول من القرن التاسع، فاتسع لأهل المدينة {cite:nafh-tib-maqqari}."
  en: "Abd al-Rahman II greatly enlarged the mosque's court and aisles in the first half of the ninth century to take the growing city's congregation {cite:nafh-tib-maqqari}."
  fr: "Abd al-Rahman II agrandit considérablement la cour et les nefs de la mosquée dans la première moitié du IXe siècle pour accueillir les fidèles d’une ville en expansion {cite:nafh-tib-maqqari}."
  ur: "عبد الرحمن ثانی نے نویں صدی کے پہلے نصف میں مسجد کے صحن اور سطونوں میں بڑا اضافہ کیا تا کہ بڑھتی ہوئی جماعت سما سکے {cite:nafh-tib-maqqari}."
  es: "Abd al-Rahman II amplió enormemente el patio y los pasillos de la mezquita en la primera mitad del siglo IX para dar cabida a la creciente congregación de la ciudad {cite:nafh-tib-maqqari}."
  tr: "II. Abdülrahman, 9. yüzyılın ilk yarısında Kurtuba Ulu Camii'nin avlusunu ve çarşılarını büyük ölçüde genişleterek, şehrin halkı için daha ferah bir alan haline getirdi."
  id: "Abd al-Rahman II memperluas halaman dan pasar Masjid Agung Cordoba secara besar-besaran pada paruh pertama abad kesembilan, sehingga membuatnya lebih luas bagi penduduk kota."
