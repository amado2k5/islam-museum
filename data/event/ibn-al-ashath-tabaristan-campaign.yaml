label: { ar: "غزوة ابن الأشعث طبرستان", en: "Ibn al-Ash'ath's Tabaristan Campaign", es: "La campaña de Ibn al-Ash'ath en Tabaristán", fr: "La campagne d'Ibn al-Ash'ath au Tabaristan", ur: "ابن اشعث کی طبرستان مہم", tr: "İbn el-Aş'at'ın Tabaristan'a baskını", id: "Serangan Ibn al-Ash'ath ke Tabaristan" }
summary:
  ar: "ولّى عبيد الله بن زياد محمد بن الأشعث بن قيس الكندي طبرستان فصالحهم وعقد لهم عقداً ثم أمهلوا له حتى دخل فأخذوا عليه المضايق وقتلوا ابنه أبا بكر وفضخوه ثم نجا فكان المسلمون يغزون ذلك الثغر وهم حذرون من التوغل في أرض العدو."
  en: "Ubaydallah ibn Ziyad made Muhammad ibn al-Ash'ath ibn Qays al-Kindi governor of Tabaristan; he treated with them and bound a compact, they let him in, then seized the narrows, killed his son Abu Bakr and crushed his skull — Muhammad escaped, and the raiders of that frontier stayed wary of driving deep into enemy land."
  es: "Ubaydallah ibn Ziyad nombró a Muhammad ibn al-Ash'ath ibn Qays al-Kindi gobernador de Tabaristán; negoció con ellos y selló un pacto, lo dejaron entrar, luego tomaron el estrecho, mataron a su hijo Abu Bakr y le aplastaron el cráneo. Muhammad escapó, y los asaltantes de esa frontera se mantuvieron cautelosos de adentrarse profundamente en territorio enemigo."
  fr: "Ubaydallah ibn Ziyad nomma Muhammad ibn al-Ash'ath ibn Qays al-Kindi gouverneur du Tabaristan; il traita avec eux et conclut un pacte, ils le laissèrent entrer, puis s'emparèrent du détroit, tuèrent son fils Abu Bakr et lui écrasèrent le crâne — Muhammad s'échappa, et les pillards de cette frontière restèrent prudents et n'osèrent plus pénétrer profondément en territoire ennemi."
  ur: "عبیداللہ ابن زیاد نے محمد بن اشعث بن قیس الکندی کو طبرستان کا گورنر بنایا۔ اس نے ان کے ساتھ سلوک کیا اور ایک معاہدہ کیا، انہوں نے اسے اندر جانے دیا، پھر تنگی پر قبضہ کر لیا، اس کے بیٹے ابوبکر کو قتل کر دیا اور اس کی کھوپڑی کو کچل دیا - محمد فرار ہو گیا، اور اس سرحد کے حملہ آور دشمن کی سرزمین میں گہرائی تک جانے سے ہوشیار رہے۔"
  tr: "Ubeydullah ibn Ziyad, Muhammed ibn el-Eş'at ibn Kays el-Kindi'yi Taberistan valisi olarak atadı. Onlarla barış yaptı ve bir anlaşma imzaladı. Sonra ona içeri girmesi için süre verdiler ve dar geçitleri elinden alıp oğlu Ebu Bekir'i öldürdüler ve ezerek öldürdüler. Sonra kaçtı. Böylece Müslümanlar o sınıra baskınlar düzenlerdi ve düşman topraklarına girmemeye özen gösterirlerdi."
  id: "Ubayd Allah ibn Ziyad menunjuk Muhammad ibn al-Ash’ath ibn Qays al-Kindi sebagai gubernur Tabaristan. Ia berdamai dengan mereka dan membuat perjanjian dengan mereka. Kemudian mereka memberinya waktu sebelum ia masuk, dan mereka merebut jalan-jalan sempit darinya dan membunuh putranya, Abu Bakr, serta menghancurkannya. Kemudian ia melarikan diri. Maka kaum Muslimin biasa menyerang perbatasan itu, dan mereka berhati-hati agar tidak memasuki wilayah musuh."
