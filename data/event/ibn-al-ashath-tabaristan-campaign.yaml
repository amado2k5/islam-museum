  ar: "ولّى عبيد الله بن زياد محمد بن الأشعث بن قيس الكندي طبرستان فصالحهم وعقد لهم عقداً ثم أمهلوا له حتى دخل فأخذوا عليه المضايق وقتلوا ابنه أبا بكر وفضخوه ثم نجا فكان المسلمون يغزون ذلك الثغر وهم حذرون من التوغل في أرض العدو."
  en: "Ubaydallah ibn Ziyad made Muhammad ibn al-Ash'ath ibn Qays al-Kindi governor of Tabaristan; he treated with them and bound a compact, they let him in, then seized the narrows, killed his son Abu Bakr and crushed his skull — Muhammad escaped, and the raiders of that frontier stayed wary of driving deep into enemy land."
