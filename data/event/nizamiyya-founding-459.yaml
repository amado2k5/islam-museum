label: { ar: "تشييد المدرسة النظامية ببغداد", en: "The Founding of the Nizamiyya in Baghdad" }
summary:
  ar: "في سنة تسع وخمسين فرغت المدرسة النظامية ببغداد وقرر لتدريسها الشيخ أبو إسحاق الشيرازي فاجتمع الناس فلم يحضر واختفى فدرس ابن الصباغ صاحب الشامل ثم تلطفوا بالشيخ أبي إسحاق حتى أجاب ودرس، وقال الذهبي عن نظام الملك أنه بنى النظامية وقيل وهي أول مدرسة بنيت للفقهاء {cite:tarikh-khulafa-minhaj-1434 p. 645-646}، وقرر لتدريسها أبو إسحاق الشيرازي فلما اجتمع الناس لم يحضر لأنه لقيه صبي فقال كيف تدرس في مكان مغصوب فاختفى فدرس ابن الصباغ مصنف الشامل، فلما وصل الخبر إلى الوزير أقام القيامة حتى درس الشيرازي بها لكنه كان يصلي في غيرها لعلمه أن أكثر آلاتها غصب {cite:shadharat-dhahab p. 315}. ويوثق ابن الجوزي أن العمل بها ابتدئ في ذي الحجة سنة 457هـ ونُقض لأجل بنيانها بقية الدور الشاطية بمشرعة الزوايا والفرضة وباب الشعير ودرب الزعفراني {cite:muntazam-ibn-al-jawzi j.8 p.140}، وأن الشيرازي جلس فيها في عشر ذي الحجة سنة 459هـ بعد عشرين يوماً درسها ابن الصباغ، وكان إذا حضر وقت الصلاة خرج منها وقصد بعض المساجد فأداها {cite:muntazam-ibn-al-jawzi j.8 p.246-247}."
  en: "In 459 Baghdad's Nizamiyya school was finished; Abu Ishaq al-Shirazi was named its teacher, but when the people gathered he had hidden — Ibn al-Sabbagh taught till they coaxed al-Shirazi to accept. Al-Dhahabi reports Nizam al-Mulk built it — 'said to be the first school built for the jurists' {cite:tarikh-khulafa-minhaj-1434 p. 645-646}."
