id: event/death-and-burial-of-abdullah-ibn-abbas-at-taif
class: event
kind: death
label:
  ar: وفاة عبد الله بن عباس بالطائف وصلاة ابن الحنفية عليه
  en: Death and burial of Abdallah ibn Abbas at Ta'if
  ur: طائف میں عبداللہ بن عباس کی وفات اور تدفین
  es: "Muerte y sepultura de Abdallah ibn Abbas en Ta'if."
summary:
  ar: "توفي عبد الله بن عباس بالطائف سنة ثمان وستين وهو ابن إحدى وسبعين سنة في رواية صفة الصفوة، بعد أن أُخرج مع محمد ابن الحنفية من مكة إلى الطائف {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 276} {cite:siyar-alam-nubala scan vol. 1 p. 2415}. وصلى عليه محمد ابن الحنفية وكبّر أربعاً وقال: اليوم مات رباني هذه الأمة، وضُرب على قبره فسطاط {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 424}. ويروي ميمون بن مهران أنه لما وُضع ليُصلى عليه جاء طائر أبيض فدخل في أكفانه فالتُمس فلم يوجد، ولما سُوّي عليه سُمع صوت ولم يُر شخصه {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 276}، وفي روايات أخرى أن الطائر دخل نعشه ولم يُرَ خارجاً منه، وفي رواية عند الذهبي أنهم رأوا أنه علمه {cite:siyar-alam-nubala scan vol. 1 p. 2415}، ويورد ابن عبد البر أنه يُروى أن طائراً أبيض خرج من قبره {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 426}."
  en: "Abdallah ibn Abbas died at Ta'if in the year 68, aged seventy-one in Sifat al-Safwa's report, after he and Muhammad ibn al-Hanafiyya had been taken from Mecca to Ta'if {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 276} {cite:siyar-alam-nubala scan vol. 1 p. 2415}. Muhammad ibn al-Hanafiyya prayed over him with four takbirs and said: today the rabbani of this community has died, and a tent was set up over his grave {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 424}. Maymun ibn Mihran relates that when he was laid out for the prayer a white bird came and entered his shrouds; it was sought and not found, and when the earth was levelled over him a voice was heard but no one was seen {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 276}; other reports say the bird entered his bier and was not seen leaving it, and in one of them people took it to be his knowledge {cite:siyar-alam-nubala scan vol. 1 p. 2415}, while Ibn Abd al-Barr relays that a white bird is said to have come out of his grave {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 426}."
  ur: "عبداللہ بن عباس طائف میں ۶۸ھ میں فوت ہوئے، صفۃ الصفوہ کی روایت میں اکہتر برس کی عمر میں، جب انھیں اور محمد ابن الحنفیہ کو مکہ سے طائف لے جایا گیا تھا {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 276} {cite:siyar-alam-nubala scan vol. 1 p. 2415}. محمد ابن الحنفیہ نے چار تکبیروں کے ساتھ ان کی نماز پڑھائی اور کہا: آج اس امت کا ربانی فوت ہو گیا، اور ان کی قبر پر خیمہ لگایا گیا {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 424}. میمون بن مہران روایت کرتے ہیں کہ جب انھیں نماز کے لیے رکھا گیا تو ایک سفید پرندہ آیا اور ان کے کفن میں داخل ہو گیا؛ تلاش کیا گیا تو نہ ملا، اور جب ان پر مٹی ہموار کی گئی تو ایک آواز سنائی دی مگر کوئی شخص نظر نہ آیا {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 276}؛ دوسری روایات میں ہے کہ پرندہ ان کے جنازے میں داخل ہوا اور نکلتے نہ دیکھا گیا، ان میں سے ایک میں لوگوں نے اسے ان کا علم سمجھا {cite:siyar-alam-nubala scan vol. 1 p. 2415}، اور ابن عبدالبر نقل کرتے ہیں کہ کہا جاتا ہے ایک سفید پرندہ ان کی قبر سے نکلا {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 426}."
  es: "Abdallah ibn Abbas murió en Ta'if en el año 68, a la edad de setenta y un años en el informe de Sifat al-Safwa, después de que él y Muhammad ibn al-Hanafiyya fueron llevados de La Meca a Ta'if {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 276} {cite:siyar-alam-nubala scan vol. 1 p. 2415}. Muhammad ibn al-Hanafiyya oró por él con cuatro takbirs y dijo: hoy ha muerto el rabbani de esta comunidad, y se instaló una tienda sobre su tumba {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 424}. Maymun ibn Mihran relata que cuando lo colocaron para la oración, un pájaro blanco vino y entró en sus sudarios; Se le buscó y no se le encontró, y cuando la tierra se niveló sobre él se oyó una voz pero no se vio a nadie {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 276}; otros informes dicen que el pájaro entró en su tumba y no se le vio salir de ella, y en uno de ellos la gente lo tomó como su conocimiento {cite:siyar-alam-nubala scan vol. 1 p. 2415}, mientras que Ibn Abd al-Barr relata que se dice que un pájaro blanco salió de su tumba {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 426}."
