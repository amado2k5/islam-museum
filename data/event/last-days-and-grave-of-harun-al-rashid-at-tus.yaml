id: event/last-days-and-grave-of-harun-al-rashid-at-tus
class: event
kind: death
label:
  ar: آخر أيام هارون الرشيد بطوس وقبره الذي أمر بحفره ودفنه بسناباذ
  en: Last days and grave of Harun al-Rashid at Tus
  ur: ہارون الرشید کے طوس میں آخری دن اور ان کی قبر
  es: "Últimos días y tumba de Harun al-Rashid en Tus"
  fr: "Derniers jours et tombe de Haroun al-Rashid à Tus"
  tr: "Harun el-Raşid'in Tus'taki son günleri ve kazdırılmasını emrettiği mezarı, Sanabad'a defnedildi."
  id: "Hari-hari terakhir Harun al-Rashid di Tus dan makamnya yang ia perintahkan untuk digali dan ia dimakamkan di Sanabad."
summary:
  ar: "مرض هارون الرشيد في طريقه إلى طوس وكتم طبيبه جبريل بن بختيشوع حاله، وقيل إنه أخطأ في علاجه {cite:al-bidaya-wal-nihaya scan vol. 5 p. 613}. وأمر بحفر قبره في حياته وحُمل حتى نظر إليه وقال: إلى هنا تصير يا ابن آدم، وقُرئت فيه ختمة {cite:tarikh-islam-dhahabi scan vol. 16 p. 14}. وقال عند احتضاره: يا من لا يموت ارحم من يموت {cite:al-bidaya-wal-nihaya scan vol. 5 p. 613}. ومات بطوس سنة ثلاث وتسعين ومئة وصلى عليه ابنه صالح ودُفن بقرية سناباذ {cite:al-bidaya-wal-nihaya scan vol. 5 p. 613}."
  en: "Harun al-Rashid fell ill on the road to Tus, and his physician Jibril ibn Bukhtishu concealed how things stood, though another report says he erred in treating him {cite:al-bidaya-wal-nihaya scan vol. 5 p. 613}. He had his grave dug in his lifetime and was carried to see it, saying: to this you come, son of Adam, and the Qur'an was read through in it {cite:tarikh-islam-dhahabi scan vol. 16 p. 14}. As he died he said: O You who do not die, have mercy on one who dies {cite:al-bidaya-wal-nihaya scan vol. 5 p. 613}. He died at Tus in 193, his son Salih prayed over him and he was buried in the village of Sanabad {cite:al-bidaya-wal-nihaya scan vol. 5 p. 613}."
  ur: "ہارون الرشید طوس کے راستے میں بیمار ہوئے اور ان کے طبیب جبریل بن بختیشوع نے ان کا حال چھپایا، اگرچہ ایک اور روایت میں ہے کہ اس نے علاج میں غلطی کی {cite:al-bidaya-wal-nihaya scan vol. 5 p. 613}۔ انھوں نے زندگی میں اپنی قبر کھدوائی اور لے جائے گئے، دیکھ کر کہا: اے ابنِ آدم، تو یہاں آنے والا ہے، اور اس میں ختمِ قرآن ہوا {cite:tarikh-islam-dhahabi scan vol. 16 p. 14}۔ آخری وقت میں بولے: اے وہ جسے موت نہیں، مرنے والے پر رحم کر {cite:al-bidaya-wal-nihaya scan vol. 5 p. 613}۔ وہ سن 193 میں طوس میں فوت ہوئے، بیٹے صالح نے نماز پڑھائی اور سناباذ بستی میں دفن ہوئے {cite:al-bidaya-wal-nihaya scan vol. 5 p. 613}۔"
  es: "Harun al-Rashid enfermó en el camino a Tus, y su médico Jibril ibn Bukhtishu ocultó su estado, aunque otro informe dice que cometió un error en su tratamiento {cite:al-bidaya-wal-nihaya scan vol. 5 p. 613}. En vida, le cavaron la tumba y lo llevaron a verla, diciendo: «A esto vienes, hijo de Adán», y se leyó el Corán completo en ella {cite:tarikh-islam-dhahabi scan vol. 16 p. 14}. Al morir, dijo: «¡Oh, tú que no mueres, ten misericordia de quien muere!» {cite:al-bidaya-wal-nihaya scan vol. 5 p. 613}. Murió en Tus en 193, su hijo Salih oró por él y fue enterrado en la aldea de Sanabad {cite:al-bidaya-wal-nihaya scan vol. 5 p. 613}."
  fr: "Harun al-Rashid tomba malade sur la route de Tus, et son médecin, Jibril ibn Bukhtishu, dissimula son état, bien qu'un autre récit indique qu'il commit une erreur dans son traitement (cite:al-bidaya-wal-nihaya scan vol. 5 p. 613). De son vivant, sa tombe fut creusée et on l'y transporta, disant: « Te voici, fils d'Adam », et le Coran y fut récité (cite:tarikh-islam-dhahabi scan vol. 16 p. 14). À l'article de la mort, il dit: « Ô Toi qui ne meurs pas, aie pitié du mourant » (cite:al-bidaya-wal-nihaya scan vol. 5 p. 613). Il mourut à Tus en 193; son fils Salih pria sur lui et il fut enterré au village de Sanabad (cite:al-bidaya-wal-nihaya scan vol. 5 p. 613)."
  tr: "Harun el-Raşid, Tus yolunda hastalandı ve doktoru Cibril ibn Bakhişşu onun durumunu gizledi. Tedavisinde hata yaptığı söylenir. Hayattayken mezarının kazılmasını emretti ve onu görüp, \"Ey Âdemoğlu, işte burada son bulacaksın\" diyebilmesi için mezara götürüldü. Mezarı üzerinde Kur'an'ın tamamı okundu. Ölüm döşeğinde, \"Ey ölmeyen, ölmekte olanlara rahmet et\" dedi. Hicri 193 yılında Tus'ta vefat etti ve oğlu Salih cenaze namazını kıldırdı. Sanabadh köyüne defnedildi."
  id: "Harun al-Rashid jatuh sakit dalam perjalanan ke Tus, dan tabibnya, Jibril ibn Bakhtishu, menyembunyikan kondisinya. Dikatakan bahwa ia keliru dalam pengobatannya. Ia memerintahkan agar kuburnya digali semasa hidupnya, dan ia dibawa ke sana agar ia dapat melihatnya dan berkata, \"Di sinilah engkau akan berakhir, wahai anak Adam.\" Sebuah bacaan lengkap Al-Quran dibacakan di atasnya. Di ranjang kematiannya, ia berkata, \"Wahai Engkau Yang tidak mati, kasihanilah orang yang sedang sekarat.\" Ia meninggal di Tus pada tahun 193 Hijriah, dan putranya, Salih, memimpin salat jenazah. Ia dimakamkan di desa Sanabadh."
