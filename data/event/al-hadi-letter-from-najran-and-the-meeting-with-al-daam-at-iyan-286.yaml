id: event/al-hadi-letter-from-najran-and-the-meeting-with-al-daam-at-iyan-286
class: event
kind: other
label:
  ar: كتاب عامل نجران وملاقاة الهادي للدعام بعيان، جمادى الآخرة 286هـ
  en: The Najran governor's letter and al-Hadi's meeting with al-Da'am at Iyan, Jumada II 286 AH
  ur: نجران کے عامل کا خط اور عیان میں ہادی کی دعام سے ملاقات، جمادی الآخرہ 286ھ
summary:
  ar: وصل الهادي يوم الأحد لعشرة أيام خلون من جمادى الآخرة كتاب من أحمد بن محمد العباسي واليه على نجران يذكر أن ابن بسطام أفسد على الإمام وبذل مالاً لليامين لإعادة الفتنة بينهم وبين بني الحارث، فكتب الهادي إلى الدعام أن يلقاه في بلد بني سلمان، وخلّف ابنه أبا القاسم بخيوان، والتقيا بعيان، فطلب الدعام الأمان لبني سلمان فأمّنهم وحلفوا على السمع والطاعة، ثم سارا إلى نجران حتى القمشية.
  en: On the Sunday ten days into Jumada II a letter reached al-Hadi from Ahmad ibn Muhammad al-Abbasi, his governor at Najran, saying that Ibn Bustam had worked mischief against the imam and offered the Yam money to revive strife between them and Banu al-Harith; al-Hadi wrote to al-Da'am to meet him in the land of Banu Salman, left his son Abu al-Qasim at Khiwan, and met him at Iyan, where al-Da'am asked and was given safe-conduct for Banu Salman, who swore hearing and obedience, and the two went on toward Najran as far as al-Qamashiyya.
  ur: جمادی الآخرہ کے دس دن گزرنے پر اتوار کو ہادی کے پاس نجران پر ان کے عامل احمد بن محمد العباسی کا خط پہنچا کہ ابن بسطام نے امام کے خلاف فساد کھڑا کیا اور یام والوں کو مال دیا کہ ان کے اور بنو الحارث کے بیچ فتنہ لوٹ آئے؛ ہادی نے دعام کو لکھا کہ بنو سلمان کے علاقے میں ان سے ملے، اپنے بیٹے ابو القاسم کو خیوان میں چھوڑا اور عیان میں ملاقات ہوئی جہاں دعام نے بنو سلمان کے لیے امان مانگی جو دے دی گئی اور انہوں نے سمع و طاعت پر قسم کھائی، پھر دونوں نجران کی طرف القمشیہ تک چلے۔
