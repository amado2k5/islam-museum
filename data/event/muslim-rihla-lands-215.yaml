label:
  ar: "رحلة مسلم بن الحجاج في طلب الحديث إلى الحجاز والعراق والشام ومصر، نحو ٢١٥هـ"
  en: "Muslim ibn al-Hajjaj's hadith journeys to the Hijaz, Iraq, Syria and Egypt, c. 215/830"
  ur: "مسلم بن حجاج کا طلبِ حدیث کا سفر حجاز، عراق، شام اور مصر، تقریباً 215ھ/830ء"
  es: "Viajes de Muslim ibn al-Hajjaj a Hiyaz, Irak, Siria y Egipto, c. 215/830"
  fr: "Les voyages de Muslim ibn al-Hajjaj pour recueillir des hadiths au Hedjaz, en Irak, en Syrie et en Égypte, vers 215/830"
  tr: "Müslim ibn al-Haccac'ın Hicaz, Irak, Suriye ve Mısır'a hadis arayışı yolculuğu, yaklaşık 215 Hicri yılında gerçekleşmiştir."
  id: "Perjalanan Muslim Ibnu al-Hajjaj dalam mencari Hadits ke Hijaz, Irak, Suriah, dan Mesir, sekitar tahun 215 Hijriah."
summary:
  ar: "رحل مسلم بن الحجاج من حداثته إلى الحجاز والعراق والشام ومصر في طلب الحديث، ودخل بغداد غير مرة {cite:wafayat-ayan v p. 195}، وسمع من شيوخ كثر أبرزهم يحيى بن يحيى النيسابوري ⁦(ت ٢٢٤-٢٢٦هـ)⁩ وعبد الله بن مسلمة القعنبي ⁦(ت ٢٢٠-٢٢١هـ)⁩ وقتيبة بن سعيد ⁦(ت ٢٤٠هـ)⁩، وهم من كبار تلاميذ مالك بن أنس، وسعيد بن منصور ⁦(ت ٢٢٧هـ)⁩ وأحمد بن حنبل ⁦(ت ٢٤١هـ)⁩ وإسحاق بن راهويه ⁦(ت ٢٣٧-٢٣٨هـ)⁩ ومحمد بن بشار بندار ⁦(ت ٢٥٢هـ)⁩ {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-691}."
  en: "From his youth Muslim ibn al-Hajjaj journeyed to the Hijaz, Iraq, Syria and Egypt in the quest for hadith, entering Baghdad more than once {cite:wafayat-ayan v p. 195}; among the many masters he heard were Yahya ibn Yahya al-Naysaburi (d. 224-6), Abd Allah ibn Maslama al-Qa'nabi (d. 220-1) and Qutayba ibn Sa'id (d. 240), all leading pupils of Malik ibn Anas, together with Sa'id ibn Mansur (d. 227), Ahmad ibn Hanbal (d. 241), Ishaq ibn Rahwayh (d. 237-8) and Muhammad ibn Bashshar Bundar (d. 252) {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-691}."
  ur: "مسلم بن حجاج نے جوانی میں طلبِ حدیث کے لیے حجاز، عراق، شام اور مصر کا سفر کیا اور بغداد ایک سے زائد بار حاضر ہوئے {cite:wafayat-ayan v p. 195}؛ جن مشائخ سے انہوں نے سنا ان میں یحییٰ بن یحییٰ نیشاپوری ⁦(وفات 224-226ھ)⁩، عبداللہ بن مسلمہ قعنبی ⁦(وفات 220-221ھ)⁩ اور قتیبہ بن سعید ⁦(وفات 240ھ)⁩ — یہ تینوں مالک بن انس کے بڑے تلامذہ — کے ساتھ سعید بن منصور ⁦(وفات 227ھ)⁩، احمد بن حنبل ⁦(وفات 241ھ)⁩، اسحاق بن راہویہ ⁦(وفات 237-238ھ)⁩ اور محمد بن بشار بندار ⁦(وفات 252ھ)⁩ شامل ہیں {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-691}۔"
  es: "Desde su juventud, Muslim ibn al-Hajjaj viajó al Hijaz, Irak, Siria y Egipto en busca de hadices, entrando a Bagdad más de una vez {cita:wafayat-ayan v p. 195}; entre los muchos maestros que escuchó se encontraban Yahya ibn Yahya al-Naysaburi (m. 224-6), Abd Allah ibn Maslama al-Qa'nabi (m. 220-1) y Qutayba ibn Sa'id (m. 240), todos destacados alumnos de Malik ibn Anas, junto con Sa'id ibn Mansur (m. 227), Ahmad ibn Hanbal (m. 241), Ishaq ibn Rahwayh (m. 237-8) y Muhammad ibn Bashshar Bundar (m. 252) {citar:encyclopaedia-of-islam-2 vol. 7p. 690-691}."
  fr: "Dès sa jeunesse, Muslim ibn al-Hajjaj a voyagé dans le Hedjaz, en Irak, en Syrie et en Égypte à la recherche de hadiths, entrant à Bagdad plus d'une fois {cite: wafayat-ayan v p. 195}; parmi les nombreux maîtres qu'il a entendus se trouvaient Yahya ibn Yahya al-Naysaburi (d. 224-6), Abd Allah ibn Maslama al-Qa'nabi (d. 220-1) et Qutayba ibn Sa'id (d. 240), tous les principaux élèves de Malik ibn Anas, ainsi que Sa'id ibn Mansur (d. 227), Ahmad ibn Hanbal (d. 227). 241), Ishaq ibn Rahwayh (mort 237-8) et Muhammad ibn Bashshar Bundar (mort 252) {cite:encyclopaedia-of-islam-2 vol. 19h. 690-691}."
  tr: "Müslim ibn el-Haccâc, gençliğinden itibaren hadis arayışı içinde Hicaz, Irak, Levant ve Mısır'a seyahat etti ve Bağdat'a birden fazla kez girdi {alıntı:wafayat-ayan v s. 195} ve birçok şeyhten haber alınmıştır; bunların en önde gelenleri Malik ibn Enes'in büyük talebeleri arasında yer alan Yahya ibn Yahya el-Neysaburi (ö. 224-226 H.), Abdullah ibn Muslimah al-Qa'nabi (ö. 220-221 H.), Kuteybe ibn Sa'id (ö. 240 H. 240) ve Malik ibn Enes'in büyük talebeleri arasında yer alan Sa'id ibn Mansur (ö. 227)'dur. AH), Ahmed ibn Hanbel (ö. 241 H.), İshak ibn Rahwayh (ö. 237-238 H.) ve Muhammed ibn Beşar Bundar (ö. 252 H.) {cite:encyclopaedia-of-islam-2 vol. 7 s. 690-691}."
  id: "Muslim Ibn al-Hajjaj sejak masa mudanya melakukan perjalanan ke Hijaz, Irak, Levant, dan Mesir untuk mencari Hadits, dan memasuki Baghdad lebih dari sekali {cite:wafayat-ayan v p. 195}, dan mendengar dari banyak syekh, yang paling terkemuka di antaranya adalah Yahya ibn Yahya al-Naysaburi (w. 224-226 H), Abdullah ibn Muslimah al-Qa’nabi (w. 220-221 H), Qutaybah ibn Sa’id (w. 240 H), yang termasuk murid-murid besar Malik ibn Anas, Sa’id ibn Mansur (w. 227 H), Ahmad ibn Hanbal (w. 241 H), Ishaq ibn Rahwayh (w. 237-238 H), dan Muhammad ibn Bashar Bundar (w. 252 H) {cite:encyclopaedia-of-islam-2 vol. 7 hal. 690-691}."
