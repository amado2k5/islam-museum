id: event/ibn-hajar-baybarsiyya-813
class: event
kind: other
label:
  ar: "تولية ابن حجر مشيخة خانقاه البيبرسية، ٨١٣هـ/١٤١٠م"
  en: "Ibn Hajar installed as head of the Baybarsiyya khanqah, 813/1410"
  ur: "ابن حجر کی خانقاہ بیبرسیہ کی شیخت پر تعینات، 813ھ/1410ء"
  es: "Ibn Hajar fue nombrado jefe del khanqah Baybarsiyya en 813/1410."
  fr: "Ibn Hajar installé à la tête du khanqah de Baybarsiyya, 813/1410"
  tr: "İbn Hacer'in Baybarsiyya Hankası Şeyhi olarak atanması, H. 813/MS 1410"
  id: "Pengangkatan Ibnu Hajar sebagai Syekh Baybarsiyya Khanqah, 813 H/1410 M."
summary:
  ar: "نُصّب ابن حجر شيخاً على خانقاه البيبرسية وناظراً على شؤونها التعليمية والإدارية في ٣ ربيع الأول ٨١٣هـ/٦ يوليو ١٤١٠م؛ فقَد المنصب سنة ٨١٦هـ ثم أُعيد إليه في ربيع الآخر ٨١٨هـ/يونيو ١٤١٥م واحتفظ به نحو إحدى وثلاثين سنة حتى عُزل في ٢٠ جمادى الأولى ٨٤٩هـ/٢٤ أغسطس ١٤٤٥م، فانتقل إلى التدريس بدار الحديث الكاملية، ولمّا رُدّت إليه الخانقاه في ٢ ربيع الآخر ٨٥٢هـ/٦ يونيو ١٤٤٨م درّس بها الشهور الباقية من عمره {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}. وكان مما أدخله من إصلاح في إدارتها نظام فهرسة ألفبائي للمستفيدين قلّدته المدارس الأخرى وديوان الجيش {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
  en: "On 3 Rabi' I 813 (6 July 1410) Ibn Hajar was installed as shaykh of the Baybarsiyya khanqah, in control of its educational and administrative affairs. He lost the post in 816, was reinstated in Rabi' II 818 (June 1415), and held it for almost thirty-one years until ousted on 20 Jumada I 849 (24 August 1445); he then taught at the Dar al-Hadith al-Kamiliyya until, on 2 Rabi' II 852 (6 June 1448), the khanqah was restored to him for the few months before his final illness {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}. Among his administrative innovations was an alphabetical filing system for the institution's beneficiaries, imitated by other colleges and by the army bureau {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
  ur: "3 ربیع الاول 813ھ ⁦(6 جولائی 1410ء)⁩ کو ابن حجر خانقاہ بیبرسیہ کے شیخ اور اس کے تعلیمی و انتظامی امور کے ناظر مقرر ہوئے۔ 816ھ میں عہدہ گیا، ربیع الثانی 818ھ ⁦(جون 1415ء)⁩ میں بحال ہوئے اور تقریباً اکتیس برس اس منصب پر رہے یہاں تک کہ 20 جمادی الاول 849ھ ⁦(24 اگست 1445ء)⁩ کو برطرف ہوئے؛ پھر دار الحدیث کاملیہ میں پڑھاتے رہے یہاں تک کہ 2 ربیع الثانی 852ھ ⁦(6 جون 1448ء)⁩ کو خانقاہ انھیں لوٹا دی گئی اور وہ اپنی آخری بیماری سے پہلے کے چند مہینے وہیں پڑھاتے رہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}۔ ان کی انتظامی اصلاحات میں مستفیدین کی حروفِ تہجی کے حساب سے فائلنگ کا نظام تھا جسے دوسری درس گاہوں اور فوجی دفتر نے اپنایا {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}۔"
  es: "El 3 de Rabi' I de 813 (6 de julio de 1410), Ibn Hajar fue nombrado shaykh del khanqah Baybarsiyya, a cargo de sus asuntos educativos y administrativos. Perdió el puesto en 816, fue restituido en Rabi' II de 818 (junio de 1415) y lo ocupó durante casi treinta y un años hasta que fue destituido el 20 de Jumada I de 849 (24 de agosto de 1445); luego enseñó en el Dar al-Hadith al-Kamiliyya hasta que, el 2 de Rabi' II de 852 (6 de junio de 1448), el khanqah le fue restituido durante los pocos meses previos a su enfermedad final {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}. Entre sus innovaciones administrativas se encontraba un sistema de archivo alfabético para los beneficiarios de la institución, imitado por otros colegios y por la oficina del ejército {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
  fr: "Le 3 Rabi' I 813 (6 juillet 1410), Ibn Hajar fut installé comme cheikh de la khanqah de Baybarsiyya, chargé de ses affaires éducatives et administratives. Il perdit son poste en 816, fut rétabli dans ses fonctions en Rabi' II 818 (juin 1415) et l'occupa pendant près de trente et un ans, jusqu'à son éviction le 20 Jumada I 849 (24 août 1445). Il enseigna ensuite à la Dar al-Hadith al-Kamiliyya jusqu'au 2 Rabi' II 852 (6 juin 1448), date à laquelle la khanqah lui fut restituée pour les quelques mois précédant sa maladie finale (voir Encyclopaedia of Islam, vol. 3, p. 810). Parmi ses innovations administratives figurait un système de classement alphabétique pour les bénéficiaires de l'institution, imité par d'autres collèges et par le bureau de l'armée {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
  tr: "İbn Hacer, Hicri 813 yılının Rebiü'l-Evvel ayının 3'ünde (6 Temmuz 1410) Baybarsiyye Hanka'sının şeyhi ve eğitim ve idari işlerinin sorumlusu olarak atandı. Hicri 816 yılında bu görevi kaybetti, ancak Hicri 818 yılının Rebiü'l-Sani ayında (Haziran 1415) kendisine tekrar verildi ve yaklaşık otuz bir yıl boyunca bu görevi sürdürdü. Hicri 849 yılının Cemâde-i Ula ayının 20'sinde (24 Ağustos 1445) görevden alındı. Daha sonra Kamiliyye Hadis Okulu'nda öğretmenlik yapmaya başladı. Hanka'nın kendisine Hicri 852 yılının Rebiü'l-Sani ayının 2'sinde (6 Haziran 1448) iade edilmesiyle hayatının geri kalan aylarını orada geçirdi. Yönetimine getirdiği reformlar arasında, diğer okullar ve ordu bürosu tarafından da taklit edilen, kullanıcılar için alfabetik bir indeksleme sistemi de vardı."
  id: "Ibn Hajar diangkat menjadi syekh Khanqah Baybarsiyya dan pengawas urusan pendidikan dan administrasinya pada tanggal 3 Rabi' al-Awwal 813 H/6 Juli 1410 M. Ia kehilangan jabatan tersebut pada tahun 816 H, kemudian jabatan itu dikembalikan kepadanya pada Rabi' al-Thani 818 H/Juni 1415 M, dan ia memegang jabatan tersebut selama kurang lebih tiga puluh satu tahun hingga diberhentikan pada tanggal 20 Jumada al-Ula 849 H/24 Agustus 1445 M. Setelah itu, ia pindah untuk mengajar di Sekolah Hadits Kamiliyya. Ketika Khanqah dikembalikan kepadanya pada tanggal 2 Rabi' al-Thani 852 H/6 Juni 1448 M, ia mengajar di sana selama sisa hidupnya. Di antara reformasi yang ia perkenalkan pada administrasinya adalah sistem pengindeksan alfabetis untuk pengguna, yang kemudian ditiru oleh sekolah-sekolah lain dan biro militer."
