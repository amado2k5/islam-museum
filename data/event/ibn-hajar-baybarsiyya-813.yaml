id: event/ibn-hajar-baybarsiyya-813
class: event
kind: other
label:
  ar: "تولية ابن حجر مشيخة خانقاه البيبرسية، ٨١٣هـ/١٤١٠م"
  en: "Ibn Hajar installed as head of the Baybarsiyya khanqah, 813/1410"
  ur: "ابن حجر کی خانقاہ بیبرسیہ کی شیخت پر تعینات، 813ھ/1410ء"
summary:
  ar: "نُصّب ابن حجر شيخاً على خانقاه البيبرسية وناظراً على شؤونها التعليمية والإدارية في ٣ ربيع الأول ٨١٣هـ/٦ يوليو ١٤١٠م؛ فقَد المنصب سنة ٨١٦هـ ثم أُعيد إليه في ربيع الآخر ٨١٨هـ/يونيو ١٤١٥م واحتفظ به نحو إحدى وثلاثين سنة حتى عُزل في ٢٠ جمادى الأولى ٨٤٩هـ/٢٤ أغسطس ١٤٤٥م، فانتقل إلى التدريس بدار الحديث الكاملية، ولمّا رُدّت إليه الخانقاه في ٢ ربيع الآخر ٨٥٢هـ/٦ يونيو ١٤٤٨م درّس بها الشهور الباقية من عمره {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}. وكان مما أدخله من إصلاح في إدارتها نظام فهرسة ألفبائي للمستفيدين قلّدته المدارس الأخرى وديوان الجيش {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
  en: "On 3 Rabi' I 813 (6 July 1410) Ibn Hajar was installed as shaykh of the Baybarsiyya khanqah, in control of its educational and administrative affairs. He lost the post in 816, was reinstated in Rabi' II 818 (June 1415), and held it for almost thirty-one years until ousted on 20 Jumada I 849 (24 August 1445); he then taught at the Dar al-Hadith al-Kamiliyya until, on 2 Rabi' II 852 (6 June 1448), the khanqah was restored to him for the few months before his final illness {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}. Among his administrative innovations was an alphabetical filing system for the institution's beneficiaries, imitated by other colleges and by the army bureau {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}."
  ur: "3 ربیع الاول 813ھ (6 جولائی 1410ء) کو ابن حجر خانقاہ بیبرسیہ کے شیخ اور اس کے تعلیمی و انتظامی امور کے ناظر مقرر ہوئے۔ 816ھ میں عہدہ گیا، ربیع الثانی 818ھ (جون 1415ء) میں بحال ہوئے اور تقریباً اکتیس برس اس منصب پر رہے یہاں تک کہ 20 جمادی الاول 849ھ (24 اگست 1445ء) کو برطرف ہوئے؛ پھر دار الحدیث کاملیہ میں پڑھاتے رہے یہاں تک کہ 2 ربیع الثانی 852ھ (6 جون 1448ء) کو خانقاہ انھیں لوٹا دی گئی اور وہ اپنی آخری بیماری سے پہلے کے چند مہینے وہیں پڑھاتے رہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}۔ ان کی انتظامی اصلاحات میں مستفیدین کی حروفِ تہجی کے حساب سے فائلنگ کا نظام تھا جسے دوسری درس گاہوں اور فوجی دفتر نے اپنایا {cite:encyclopaedia-of-islam-2 vol. 3 p. 810}۔"
