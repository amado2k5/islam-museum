summary:
  ar: "بطاقة أولية لحصار أوتشاكيف سنة ١٧٨٨م، أخذ بوتمكين للقلعة العثمانية على البحر الأسود في حرب ١٧٨٧؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Siege of Ochakov in 1788, Potemkin's storming of the Ottoman Black Sea fortress in the war of 1787–92; its sources are not yet checked on the page."
  es: "Boceto para el asedio de Ochakov en 1788, asalto de Potemkin a la fortaleza otomana del Mar Negro en la guerra de 1787-1792; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour le siège d'Otchakov en 1788, la prise d'assaut par Potemkine de la forteresse ottomane de la mer Noire pendant la guerre de 1787-1792; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1788 میں اوچاکوف کے محاصرے کے لیے ڈرافٹ کارڈ، 1787-92 کی جنگ میں بحیرہ اسود کے عثمانی قلعے پر پوٹیمکن کا طوفان؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1788 yılında gerçekleşen Öçakif kuşatmasının ön haritası; Potemkin'in 1787 savaşında Karadeniz'deki Osmanlı kalesini ele geçirmesi; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Peta pendahuluan pengepungan Ochakif pada tahun 1788 M, penaklukan benteng Ottoman di Laut Hitam oleh Potemkin dalam perang tahun 1787; sumber-sumber di halaman ini belum ditinjau."
