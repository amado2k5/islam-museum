id: event/al-hadi-distributes-the-najran-quarter-and-stays-until-ramadan-284
class: event
kind: other
label:
  ar: توزيع الهادي ربع عشر نجران على المحتاجين وإقامته بها حتى رمضان 284هـ
  en: Al-Hadi's distribution of the Najran quarter to the needy and his stay there until Ramadan 284 AH
  ur: نجران کی وصولی کے چوتھائی کی تقسیم اور رمضان 284ھ تک ہادی کا قیام
summary:
  ar: جعل الهادي ربع ما جُبي من عشر التمر في نجران وجمع الثقات من أهل نجران لصونه وأمرهم بقسمته على المساكين والمحتاجين وأهل البيوتات المستورين، ثم أمر عند جباية الحبوب بكيل الواجب وبقسمة ربعه كذلك، وأقام في نجران جمادى الآخرة ورجباً وشعبان وثمانية عشر يوماً من رمضان.
  en: Al-Hadi took a quarter of what was collected as tithe on dates at Najran, gathered the trustworthy of the people of Najran to guard it and told them to divide it among the poor, the needy and the veiled people of respectable houses; when the grain fell due he ordered the due measured and its quarter divided likewise; he stayed at Najran through Jumada II, Rajab, Sha'ban and eighteen days of Ramadan.
  ur: ہادی نے نجران میں کھجور کے عشر کی وصولی کا چوتھائی الگ کیا، نجران کے معتمد لوگوں کو اس کی حفاظت کے لیے جمع کیا اور مساکین، حاجت مندوں اور پردہ نشین شریف گھرانوں میں بانٹنے کا حکم دیا؛ اناج کی وصولی کے وقت واجب ناپنے اور اس کا چوتھائی اسی طرح بانٹنے کا حکم دیا؛ اور وہ نجران میں جمادی الآخرہ، رجب، شعبان اور رمضان کے اٹھارہ دن رہے۔
