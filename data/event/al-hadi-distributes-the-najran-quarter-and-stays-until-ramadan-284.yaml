id: event/al-hadi-distributes-the-najran-quarter-and-stays-until-ramadan-284
class: event
kind: other
label:
  ar: توزيع الهادي ربع عشر نجران على المحتاجين وإقامته بها حتى رمضان 284هـ
  en: Al-Hadi's distribution of the Najran quarter to the needy and his stay there until Ramadan 284 AH
  ur: نجران کی وصولی کے چوتھائی کی تقسیم اور رمضان 284ھ تک ہادی کا قیام
  es: "La distribución del barrio de Najrán a los necesitados por parte de Al-Hadi y su estancia allí hasta el Ramadán del año 284 de la Hégira."
  fr: "Al-Hadi distribua le quartier de Najran aux nécessiteux et y séjourna jusqu'au Ramadan 284 AH."
  tr: "El-Hadi, Necran'ın onda birinin dörtte birini muhtaçlara dağıttı ve Hicri 284 yılının Ramazan ayına kadar orada kaldı."
  id: "Al-Hadi membagikan seperempat dari sepersepuluh Najran kepada kaum miskin dan tinggal di sana hingga bulan Ramadan 284 Hijriah."
summary:
  ar: جعل الهادي ربع ما جُبي من عشر التمر في نجران وجمع الثقات من أهل نجران لصونه وأمرهم بقسمته على المساكين والمحتاجين وأهل البيوتات المستورين، ثم أمر عند جباية الحبوب بكيل الواجب وبقسمة ربعه كذلك، وأقام في نجران جمادى الآخرة ورجباً وشعبان وثمانية عشر يوماً من رمضان.
  en: Al-Hadi took a quarter of what was collected as tithe on dates at Najran, gathered the trustworthy of the people of Najran to guard it and told them to divide it among the poor, the needy and the veiled people of respectable houses; when the grain fell due he ordered the due measured and its quarter divided likewise; he stayed at Najran through Jumada II, Rajab, Sha'ban and eighteen days of Ramadan.
  ur: ہادی نے نجران میں کھجور کے عشر کی وصولی کا چوتھائی الگ کیا، نجران کے معتمد لوگوں کو اس کی حفاظت کے لیے جمع کیا اور مساکین، حاجت مندوں اور پردہ نشین شریف گھرانوں میں بانٹنے کا حکم دیا؛ اناج کی وصولی کے وقت واجب ناپنے اور اس کا چوتھائی اسی طرح بانٹنے کا حکم دیا؛ اور وہ نجران میں جمادی الآخرہ، رجب، شعبان اور رمضان کے اٹھارہ دن رہے۔
  es: "Al-Hadi tomó una cuarta parte de lo que se recogía como diezmo de los dátiles en Najran, reunió a los más fieles de Najran para que lo custodiaran y les dijo que lo repartieran entre los pobres, los necesitados y las mujeres veladas de casas respetables; cuando llegó el momento de la cosecha, ordenó que se midiera la cantidad debida y se dividiera su cuarta parte de la misma manera; permaneció en Najran durante el segundo día de Jumada, Rajab, Sha'ban y dieciocho días de Ramadán."
  fr: "Al-Hadi prit un quart de la dîme collectée à Najran, rassembla les personnes de confiance de la ville pour la garder et leur dit de la répartir entre les pauvres, les nécessiteux et les femmes voilées de maisons respectables; lorsque le grain arriva à échéance, il ordonna que la somme due soit mesurée et que son quart soit divisé de la même manière; il resta à Najran pendant les mois de Jumada II, Rajab, Sha'ban et dix-huit jours du Ramadan."
  tr: "El-Hadi, Necran'da hurmalardan toplanan zekâtın dörtte birini ayırdı ve onu korumak için Necran'dan güvenilir insanları bir araya getirdi ve fakirlere, muhtaçlara ve mütevazı ailelere dağıtmalarını emretti. Sonra, tahıl toplarken, farz olan miktarın ölçülmesini ve bunun da dörtte birinin dağıtılmasını emretti. Cemâdü'l-Ahirah, Receb, Şaban ve Ramazan'ın on sekiz günü boyunca Necran'da kaldı."
  id: "Al-Hadi mengambil seperempat dari hasil zakat kurma di Najran dan mengumpulkan orang-orang terpercaya dari Najran untuk menjaganya, lalu memerintahkan mereka untuk membagikannya kepada fakir miskin, orang-orang yang membutuhkan, dan orang-orang dari keluarga sederhana. Kemudian, ketika mengumpulkan biji-bijian, beliau memerintahkan agar jumlah yang wajib diukur dan seperempatnya dibagikan dengan cara yang sama. Beliau tinggal di Najran selama Jumada al-Akhirah, Rajab, Sha’ban, dan delapan belas hari di bulan Ramadan."
