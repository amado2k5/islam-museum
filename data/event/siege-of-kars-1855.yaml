  fr: "Fiche de convocation pour le siège de Kars en 1855, la résistance de la garnison ottomane-britannique puis sa reddition à la Russie lors de la guerre de Crimée; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1855 میں کارس کے محاصرے کے لیے ڈرافٹ کارڈ، عثمانی-برطانوی گیریژن کا موقف پھر کریمین جنگ میں روس کے سامنے ہتھیار ڈالنا؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1855 yılında Kars kuşatmasının ön haritası; Osmanlı-İngiliz garnizonunun direnişi ve ardından Kırım Savaşı'nda Ruslara teslim oluşu; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Gambaran umum pengepungan Kars pada tahun 1855 M, perlawanan garnisun Ottoman-Inggris dan kemudian penyerahannya kepada Rusia dalam Perang Krimea; sumber-sumber di halaman ini belum ditinjau."
