summary:
  ar: "بطاقة أولية لحصار قارص سنة ١٨٥٥م، صمود الحامية العثمانية البريطانية ثم استسلامها للروس في حرب القرم؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Siege of Kars in 1855, the Ottoman-British garrison's stand then surrender to Russia in the Crimean War; its sources are not yet checked on the page."
