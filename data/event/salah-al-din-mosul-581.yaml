label: { ar: "حصار صلاح الدين للموصل وصلح شهرزور سنة 581" }
summary:
  ar: "في سنة إحدى وثمانين نازل صلاح الدين الموصل فحاصرها وبذل أهلها نفوسهم وقاتلوا أشد قتال فتردد عنهم لحصانتها، ثم نزل على ميافارقين فأخذها بالأمان ثم عاد إلى الموصل وحاصرها أيضاً حتى وقع الصلح على أن يخطبوا له وأن يكون صاحبها طوعه وأن يكون لصلاح الدين شهرزور وحصونها، ثم رحل فمرض واشتد مرضه بحران حتى أُرجف بموته وسقط شعر لحيته ورأسه {cite:shadharat-dhahab p. 748}."
  en: "In 581 Salah al-Din besieged Mosul; its people fought their hardest and its strength turned him back. He took Mayyafariqin by safe-conduct, returned to the siege, and peace came on terms: the khutba in his name, the city's lord his liege, and Shahrizur and its fortresses ceded. He withdrew, then fell gravely ill at Harran until his death was rumoured and the hair of his beard and head fell out {cite:shadharat-dhahab p. 748}."
