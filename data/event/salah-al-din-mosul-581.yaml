id: event/salah-al-din-mosul-581
class: event
kind: siege
label: { ar: "حصار صلاح الدين للموصل وصلح شهرزور سنة 581", en: "Salah al-Din's siege of Mosul and the settlement of Shahrazur in 581", es: "El asedio de Mosul por Saladino y el asentamiento de Shahrazur en 581", fr: "Le siège de Mossoul par Saladin et l'établissement de Shahrazur en 581", ur: "صلاح الدین کا موصل کا محاصرہ اور 581 میں شہرازور کی آباد کاری", tr: "Selahaddin'in Musul kuşatması ve Hicri 581 yılında Şahrazur barış antlaşması", id: "Pengepungan Mosul oleh Saladin dan perjanjian damai Shahrazur pada tahun 581 Hijriah" }
summary:
  ar: "في سنة إحدى وثمانين نازل صلاح الدين الموصل فحاصرها وبذل أهلها نفوسهم وقاتلوا أشد قتال فتردد عنهم لحصانتها، ثم نزل على ميافارقين فأخذها بالأمان ثم عاد إلى الموصل وحاصرها أيضاً حتى وقع الصلح على أن يخطبوا له وأن يكون صاحبها طوعه وأن يكون لصلاح الدين شهرزور وحصونها، ثم رحل فمرض واشتد مرضه بحران حتى أُرجف بموته وسقط شعر لحيته ورأسه {cite:shadharat-dhahab p. 748}."
  en: "In 581 Salah al-Din besieged Mosul; its people fought their hardest and its strength turned him back. He took Mayyafariqin by safe-conduct, returned to the siege, and peace came on terms: the khutba in his name, the city's lord his liege, and Shahrizur and its fortresses ceded. He withdrew, then fell gravely ill at Harran until his death was rumoured and the hair of his beard and head fell out {cite:shadharat-dhahab p. 748}."
  es: "En 581, Saladino sitió Mosul; sus habitantes lucharon con todas sus fuerzas y su resistencia lo obligó a retroceder. Tomó Mayyafariqin mediante salvoconducto, reanudó el asedio y se llegó a una paz condicionada: la jutba en su nombre, el señor de la ciudad como su vasallo, y Shahrizur y sus fortalezas cedidas. Se retiró y luego enfermó gravemente en Harran hasta que se rumoreó su muerte y se le cayó el pelo de la barba y de la cabeza {cita: shadharat-dhahab p. 748}."
  fr: "En 581, Saladin assiégea Mossoul; ses habitants se défendirent avec acharnement et leur puissance le contraignit à se retirer. Il prit Mayyafariqin grâce à un sauf-conduit, reprit le siège, et la paix fut conclue à certaines conditions: le sermon (khutba) serait prononcé en son nom, le seigneur de la ville lui serait subordonné, et Shahrizur et ses forteresses lui seraient cédées. Il se retira, puis tomba gravement malade à Harran, au point que sa mort fut annoncée par la rumeur et que les cheveux de sa barbe et de son crâne tombèrent (cf. shadharat-dhahab, p. 748)."
  ur: "581 میں صلاح الدین نے موصل کا محاصرہ کیا۔ اس کے لوگوں نے ان کا سخت ترین مقابلہ کیا اور اس کی طاقت نے اسے واپس کر دیا۔ اس نے مایافارقین کو محفوظ طریقے سے لے لیا، محاصرے میں واپس آیا، اور شرائط پر امن قائم ہوا: اس کے نام کا خطبہ، شہر کا مالک اس کا لیج، اور شہرزور اور اس کے قلعے ختم ہوگئے۔ وہ پیچھے ہٹ گیا، پھر حران میں شدید بیمار پڑا یہاں تک کہ اس کی موت کی افواہ پھیل گئی اور اس کی داڑھی اور سر کے بال گر گئے۔ 748}۔"
  tr: "81 yılında Selahaddin, Musul'a indi ve şehri kuşattı. Halkı canlarını feda etti ve şiddetli bir şekilde savaştı, ancak Selahaddin surları nedeniyle tereddüt etti. Sonra Mayyafariqin'e indi ve güvenlik amacıyla şehri ele geçirdi. Ardından Musul'a geri döndü ve barış sağlanana kadar şehri tekrar kuşattı. Barış, halkın kendisine biat etmesi, yöneticisinin kendisine itaat etmesi ve Selahaddin'in Şahrazur ve kalelerini alması şartıyla sağlandı. Sonra ayrıldı ve hastalandı. Harran'da hastalığı kötüleşti ve ölüm söylentileri yayıldı. Sakalındaki ve başındaki saçlar döküldü. {Kaynak: Shadharat-dhahab s. 748}"
  id: "Pada tahun 81, Saladin turun ke Mosul dan mengepungnya. Rakyatnya mengorbankan nyawa mereka dan bertempur dengan sengit, tetapi ia ragu-ragu karena benteng-bentengnya. Kemudian ia turun ke Mayyafariqin dan merebutnya sebagai langkah pengamanan. Kemudian ia kembali ke Mosul dan mengepungnya lagi hingga perdamaian tercapai dengan syarat mereka akan berjanji setia kepadanya, bahwa penguasanya akan patuh kepadanya, dan bahwa Saladin akan mendapatkan Shahrazur dan benteng-bentengnya. Kemudian ia pergi, dan ia jatuh sakit, dan penyakitnya semakin parah di Harran hingga desas-desus tentang kematiannya menyebar, dan rambut di janggut dan kepalanya rontok. {cite:shadharat-dhahab p. 748}"
