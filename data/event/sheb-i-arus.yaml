summary:
  ar: الاحتفال السنوي في قونية بذكرى رحيل جلال الدين الرومي بعروض السماع المولوية للدراويش الدوّارين؛ أشهر تجمع صوفي مشهود
    في العالم.
  en: Konya's annual commemoration of Rumi's death with the Mevlevi whirling-dervish sema — the world's most visible Sufi
    ceremony.
  es: "La conmemoración anual de Konya de la muerte de Rumi con el sema de los derviches giratorios Mevlevi, la ceremonia sufí más visible del mundo."
  fr: "La commémoration annuelle de la mort de Rumi à Konya avec le sema des derviches tourneurs Mevlevi — la cérémonie soufie la plus visible au monde."
  ur: "کونیا میں رومی کی موت کی سالانہ یادگاری میلوی گھومتے ہوئے درویش سیما کے ساتھ - دنیا کی سب سے زیادہ نظر آنے والی صوفی تقریب۔"
  tr: "Konya'da her yıl düzenlenen Celaleddin Rumi'nin vefatını anma törenlerinde, dünyanın en ünlü Sufi topluluğu olan Mevlevi Semesi'nin semazen gösterileri yer alıyor."
  id: "Perayaan tahunan di Konya untuk memperingati wafatnya Jalal al-Din Rumi menampilkan pertunjukan darwis berputar oleh Mevlevi Sama; perkumpulan Sufi paling terkenal di dunia."
