label: { ar: "نصب المقياس على دجلة", en: "Setting Up the Gauge on the Tigris", es: "Instalación del indicador en el Tigris", fr: "Installation du manomètre sur le Tigris", ur: "دجلہ پر گیج قائم کرنا" }
summary:
  ar: "في سنة ثلاث وتسعين ومائتين نُصب المقياس على دجلة من جانبيها طوله خمس وعشرون ذراعًا، على كل ذراع علامة مدوّرة وعلى كل خمس أذرع علامة مربعة مكتوب عليها بحديدة تُعرف بها مبالغ الزيادات {cite:muntazam-ibn-al-jawzi p. 349}."
  en: "In 293 a gauge was set up on the Tigris spanning both banks, twenty-five cubits long — a round mark at each cubit and a square mark every five, with iron inscriptions, to read the river's rises {cite:muntazam-ibn-al-jawzi p. 349}."
  es: "En 293 se instaló un medidor en el Tigris que abarcaba ambas orillas, de veinticinco codos de largo: una marca redonda en cada codo y una marca cuadrada cada cinco, con inscripciones de hierro, para leer las crecidas del río {cite:muntazam-ibn-al-jawzi p. 349}."
  fr: "En 293, une jauge fut installée sur le Tigre, couvrant les deux rives, d'une longueur de vingt-cinq coudées — une marque ronde à chaque coudée et une marque carrée tous les cinq, avec des inscriptions en fer, pour lire les crues du fleuve {cite:muntazam-ibn-al-jawzi p. 349}."
  ur: "293 میں دجلہ کے دونوں کناروں پر پھیلا ہوا ایک گیج بنایا گیا، جو پچیس ہاتھ لمبا تھا - ہر ایک ہاتھ پر ایک گول نشان اور ہر پانچ پر ایک مربع نشان، جس پر لوہے کے نوشتہ تھے، دریا کے طلوع کو پڑھنے کے لیے۔ 349}۔"
