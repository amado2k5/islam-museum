label:
  ar: "أول سماع الخطيب وله إحدى عشرة سنة، نحو ٤٠٣هـ"
  en: "Al-Khatib's first audition, aged eleven, c. 403/1012"
  ur: "خطیب کی پہلی سماعت، عمر گیارہ برس، تقریباً 403ھ/1012ء"
  es: "Primera audición de Al-Khatib, a los once años, c. 403/1012"
  fr: "Première audition d'Al-Khatib, à l'âge de onze ans, vers 403/1012"
  tr: "Vaiz bunu ilk kez on bir yaşındayken, yaklaşık 403 Hicri yılında duydu."
  id: "Pertama kali pendeta itu mendengar hal ini adalah ketika ia berusia sebelas tahun, sekitar tahun 403 Hijriah."
summary:
  ar: "حضّ أبو الحسن الخطيب ولده أبا بكر على السماع في صغره، فسمع وله إحدى عشرة سنة، أي نحو سنة ثلاث وأربعمائة؛ وكان بذلك من أصغر أهل جيله ممن باكروا الطلب {cite:tarikh-islam-dhahabi p. 87}."
  en: "Abu al-Hasan al-Khatib pressed his son Abu Bakr to attend hadith auditions while still a child, and he began hearing at eleven years old — about the year 403 — among the earliest beginners of his generation {cite:tarikh-islam-dhahabi p. 87}."
  ur: "ابوالحسن خطیب نے اپنے بیٹے ابو بکر کو بچپن ہی سے سماعتِ حدیث کی ترغیب دی، اور وہ گیارہ برس کی عمر میں — تقریباً 403ھ — سماعت کرنے لگے، جو اپنے ہم عصر طالبان میں سب سے جلد شروع کرنے والوں میں تھے {cite:tarikh-islam-dhahabi p. 87}۔"
  es: "Abu al-Hasan al-Khatib presionó a su hijo Abu Bakr para que asistiera a las audiciones de hadices cuando aún era un niño, y comenzó a escuchar a los once años, alrededor del año 403, siendo uno de los primeros principiantes de su generación {cite:tarikh-islam-dhahabi p. 87}."
  fr: "Abu al-Hasan al-Khatib a incité son fils Abu Bakr à assister aux auditions de hadiths alors qu'il était encore enfant, et il a commencé à écouter à onze ans — vers l'an 403 — parmi les premiers débutants de sa génération {cite:tarikh-islam-dhahabi p. 87}."
  tr: "Ebu el-Hasan el-Hatib, oğlu Ebu Bekir'i genç yaşta hadis dinlemeye teşvik etmiş, böylece Ebu Bekir on bir yaşındayken, yani Hicri 403 yılı civarında hadis dinlemeye başlamıştır. Dolayısıyla, erken yaşta ilim öğrenmeye başlayan neslinin en gençlerinden biridir. {kaynak:tarikh-islam-dhahabi s. 87}"
  id: "Abu al-Hasan al-Khatib mendorong putranya, Abu Bakr, untuk mendengarkan hadits sejak usia muda, sehingga ia mendengarkan ketika berusia sebelas tahun, yaitu sekitar tahun 403 H. Dengan demikian, ia adalah salah satu yang termuda di generasinya yang mulai mencari ilmu sejak dini. {cite:tarikh-islam-dhahabi p. 87}"
