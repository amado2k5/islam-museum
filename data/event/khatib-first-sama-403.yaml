label:
  ar: "أول سماع الخطيب وله إحدى عشرة سنة، نحو ٤٠٣هـ"
  en: "Al-Khatib's first audition, aged eleven, c. 403/1012"
  ur: "خطیب کی پہلی سماعت، عمر گیارہ برس، تقریباً 403ھ/1012ء"
summary:
  ar: "حضّ أبو الحسن الخطيب ولده أبا بكر على السماع في صغره، فسمع وله إحدى عشرة سنة، أي نحو سنة ثلاث وأربعمائة؛ وكان بذلك من أصغر أهل جيله ممن باكروا الطلب {cite:tarikh-islam-dhahabi p. 87}."
  en: "Abu al-Hasan al-Khatib pressed his son Abu Bakr to attend hadith auditions while still a child, and he began hearing at eleven years old — about the year 403 — among the earliest beginners of his generation {cite:tarikh-islam-dhahabi p. 87}."
  ur: "ابوالحسن خطیب نے اپنے بیٹے ابو بکر کو بچپن ہی سے سماعتِ حدیث کی ترغیب دی، اور وہ گیارہ برس کی عمر میں — تقریباً 403ھ — سماعت کرنے لگے، جو اپنے ہم عصر طالبان میں سب سے جلد شروع کرنے والوں میں تھے {cite:tarikh-islam-dhahabi p. 87}۔"
