label: { ar: "يوم مهران وهو يوم البويب", en: "The Day of Mihran, Being the Day of al-Buwayb" }
summary:
  ar: "عند البلاذري: اجتمع المسلمون بدير هند في سنة أربع عشرة وقد هلك شيرويه وملكت بوران بنت كسرى إلى أن يبلغ يزدجرد بن شهريار فبعثت إليهم مهران بن مهربنداذ الهمذاني في اثني عشر ألفاً فأمهل المسلمون له حتى عبر الجسر وصار مما يلي دير الأعور وروى سيف أن مهران صار عند عبوره الجسر إلى موضع يقال له البويب وهذا الموضع الذي قتل به ويقال إن جنبتي البويب امتلأت عظاماً حتى استوى وعفا عليها التراب زمن الفتنة وكان ما بين السكون وبني سليم مغيضاً للفرات زمن الأكاسرة يصب في الجوف وعسكر المسلمين بالنخيلة وكان على الناس فيما يزعم بجيلة جرير بن عبد الله وفيما تقول ربيعة المثنى بن حارثة وقد قيل إنهم كانوا متساوين على كل قوم رئيسهم فالتقى المسلمون وعدوهم فأبلى شرحبيل بن السمط الكندي يومئذ بلاء حسناً وقتل مسعود بن حارثة أخو المثنى فقال المثنى يا معشر المسلمين لا يرعكم مصرع أخي فإن مصارع خياركم هكذا فحملوا حملة رجل واحد محمّقين صابرين حتى قتل الله مهران وهزم الكفرة فاتبعهم المسلمون يقتلونهم فقل من نجا منهم وضارب قرط بن جماخ العبدي يومئذ حتى انثنى سيفه وجاء الليل فتتاموا إلى عسكرهم وذلك في سنة أربع عشرة فتولى قتل مهران جرير بن عبد الله والمنذر بن حسان بن صرار الضبي فقال هذا أنا قتلته وقال هذا أنا قتلته وتنازعا نزاعاً شديداً فأخذ المنذر منطقته وأخذ جرير سائر سلبه ويقال إن الحصن بن معبد بن زرارة بن عدس التميمي كان ممن قتله ويقال إن مهران والقادسية ثمانية عشر شهراً."
  en: "In al-Baladhuri: the Muslims gathered at Dayr Hind in year 14, Shirawayh having perished and Buran daughter of Kisra ruling till Yazdgard ibn Shahriyar should come of age; she sent Mihran ibn Mihrbandadh al-Hamadhani against them in twelve thousand, and the Muslims gave him leave till he crossed the bridge to Dayr al-A'war's side. Sayf relates Mihran went on crossing to a place called al-Buwayb — where he was killed; al-Buwayb's flanks are said to have filled with bones till dust covered them in the civil-war time, and the stretch between al-Sakun and Banu Sulaym was the Euphrates' outflow into al-Jawf in the Khasraws' day. The Muslims camped at al-Nukhayla, Jarir ibn Abdallah over Bajila by some accounts and al-Muthanna over Rabi'a by others — or each over his own people. The armies met: Shurahbil ibn al-Simt al-Kindi fought well that day; Mas'ud ibn Haritha, al-Muthanna's brother, was killed, and al-Muthanna said 'let not my brother's fall dismay you — the falls of your best are such'; they charged as one man, steadfast, till God killed Mihran and routed the unbelievers, the Muslims pursuing with few escaping; Qurt ibn Jammakh al-Abdi fenced till his sword bent. Night fell and they crept back to camp, in year 14. Killing Mihran was claimed by Jarir ibn Abdallah and al-Mundhir ibn Hassan ibn Sirar al-Dabbi — each saying 'I killed him' — in a sharp dispute: al-Mundhir took his belt, Jarir the rest of his spoil; it is also said al-Husayn ibn Ma'bad ibn Zurara ibn Udas al-Tamimi was among his killers. Mihran and al-Qadisiyya are said to be eighteen months apart."
