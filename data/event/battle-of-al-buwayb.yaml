label: { ar: "يوم مهران وهو يوم البويب", en: "The Day of Mihran, Being the Day of al-Buwayb", fr: "La journée de Mihran, qui est la journée d'al-Buwayb", es: "El Día de Mihran, Siendo el Día de al-Buwayb", ur: "مہران کا دن، یوم البوائب ہونے کی وجہ سے" }
summary:
  ar: "عند البلاذري: اجتمع المسلمون بدير هند في سنة أربع عشرة وقد هلك شيرويه وملكت بوران بنت كسرى إلى أن يبلغ يزدجرد بن شهريار فبعثت إليهم مهران بن مهربنداذ الهمذاني في اثني عشر ألفاً فأمهل المسلمون له حتى عبر الجسر وصار مما يلي دير الأعور وروى سيف أن مهران صار عند عبوره الجسر إلى موضع يقال له البويب وهذا الموضع الذي قتل به ويقال إن جنبتي البويب امتلأت عظاماً حتى استوى وعفا عليها التراب زمن الفتنة وكان ما بين السكون وبني سليم مغيضاً للفرات زمن الأكاسرة يصب في الجوف وعسكر المسلمين بالنخيلة وكان على الناس فيما يزعم بجيلة جرير بن عبد الله وفيما تقول ربيعة المثنى بن حارثة وقد قيل إنهم كانوا متساوين على كل قوم رئيسهم فالتقى المسلمون وعدوهم فأبلى شرحبيل بن السمط الكندي يومئذ بلاء حسناً وقتل مسعود بن حارثة أخو المثنى فقال المثنى يا معشر المسلمين لا يرعكم مصرع أخي فإن مصارع خياركم هكذا فحملوا حملة رجل واحد محمّقين صابرين حتى قتل الله مهران وهزم الكفرة فاتبعهم المسلمون يقتلونهم فقل من نجا منهم وضارب قرط بن جماخ العبدي يومئذ حتى انثنى سيفه وجاء الليل فتتاموا إلى عسكرهم وذلك في سنة أربع عشرة فتولى قتل مهران جرير بن عبد الله والمنذر بن حسان بن صرار الضبي فقال هذا أنا قتلته وقال هذا أنا قتلته وتنازعا نزاعاً شديداً فأخذ المنذر منطقته وأخذ جرير سائر سلبه ويقال إن الحصن بن معبد بن زرارة بن عدس التميمي كان ممن قتله ويقال إن مهران والقادسية ثمانية عشر شهراً."
  en: "In al-Baladhuri: the Muslims gathered at Dayr Hind in year 14, Shirawayh having perished and Buran daughter of Kisra ruling till Yazdgard ibn Shahriyar should come of age; she sent Mihran ibn Mihrbandadh al-Hamadhani against them in twelve thousand, and the Muslims gave him leave till he crossed the bridge to Dayr al-A'war's side. Sayf relates Mihran went on crossing to a place called al-Buwayb — where he was killed; al-Buwayb's flanks are said to have filled with bones till dust covered them in the civil-war time, and the stretch between al-Sakun and Banu Sulaym was the Euphrates' outflow into al-Jawf in the Khasraws' day. The Muslims camped at al-Nukhayla, Jarir ibn Abdallah over Bajila by some accounts and al-Muthanna over Rabi'a by others — or each over his own people. The armies met: Shurahbil ibn al-Simt al-Kindi fought well that day; Mas'ud ibn Haritha, al-Muthanna's brother, was killed, and al-Muthanna said 'let not my brother's fall dismay you — the falls of your best are such'; they charged as one man, steadfast, till God killed Mihran and routed the unbelievers, the Muslims pursuing with few escaping; Qurt ibn Jammakh al-Abdi fenced till his sword bent. Night fell and they crept back to camp, in year 14. Killing Mihran was claimed by Jarir ibn Abdallah and al-Mundhir ibn Hassan ibn Sirar al-Dabbi — each saying 'I killed him' — in a sharp dispute: al-Mundhir took his belt, Jarir the rest of his spoil; it is also said al-Husayn ibn Ma'bad ibn Zurara ibn Udas al-Tamimi was among his killers. Mihran and al-Qadisiyya are said to be eighteen months apart."
  fr: "Chez al-Baladhuri : les musulmans se rassemblèrent à Dayr Hind en l'an 14, Shirawayh ayant péri et Buran, fille de Kisra, régnant jusqu'à ce que Yazdgard ibn Shahriyar atteigne l'âge requis ; elle envoya contre eux Mihran ibn Mihrbandadh al-Hamadhani avec douze mille hommes, et les musulmans le laissèrent faire jusqu'à ce qu'il franchisse le pont du côté de Dayr al-A'war. Sayf rapporte que Mihran continua de traverser jusqu'à un lieu appelé al-Buwayb, où il fut tué ; on dit que les flancs d'al-Buwayb se remplirent d'ossements jusqu'à ce que la poussière les recouvre au temps de la guerre civile, et que l'étendue entre al-Sakun et les Banu Sulaym était le déversoir de l'Euphrate dans al-Jawf au temps des Khosroès. Les musulmans campèrent à al-Nukhayla, Jarir ibn Abdallah commandant les Bajila selon certains récits et al-Muthanna les Rabi'a selon d'autres, ou chacun commandant les siens. Les armées se rencontrèrent : Shurahbil ibn al-Simt al-Kindi combattit bien ce jour-là ; Mas'ud ibn Haritha, frère d'al-Muthanna, fut tué, et al-Muthanna dit : « Que la chute de mon frère ne vous effraie pas : ainsi tombent les meilleurs d'entre vous » ; ils chargèrent comme un seul homme, fermes, jusqu'à ce que Dieu tue Mihran et mette en déroute les mécréants, les musulmans les poursuivant et peu s'échappant ; Qurt ibn Jammakh al-Abdi ferrailla jusqu'à ce que son sabre se torde. La nuit tomba et ils regagnèrent le camp, en l'an 14. Le meurtre de Mihran fut revendiqué par Jarir ibn Abdallah et al-Mundhir ibn Hassan ibn Sirar al-Dabbi, chacun disant « c'est moi qui l'ai tué », dans une vive dispute : al-Mundhir prit sa ceinture, Jarir le reste de ses dépouilles ; on dit aussi qu'al-Husayn ibn Ma'bad ibn Zurara ibn Udas al-Tamimi fut parmi ses meurtriers. On dit que dix-huit mois séparent Mihran d'al-Qadisiyya."
  es: "En al-Baladhuri: los musulmanes se reunieron en Dayr Hind en el año 14, Shirawayh había perecido y Buran, hija de Kisra, gobernaba hasta que Yazdgard ibn Shahriyar alcanzara la mayoría de edad; ella envió a Mihran ibn Mihrbandadh al-Hamadhani contra ellos con doce mil hombres, y los musulmanes le dieron permiso hasta que cruzó el puente hacia el lado de Dayr al-A'war. Sayf relata que Mihran continuó cruzando hasta un lugar llamado al-Buwayb, donde fue asesinado; se dice que los flancos de al-Buwayb se llenaron de huesos hasta que el polvo los cubrió durante la guerra civil, y el tramo entre al-Sakun y Banu Sulaym era la salida del Éufrates hacia al-Jawf en la época de los Khasraws. Los musulmanes acamparon en al-Nukhayla, Jarir ibn Abdallah sobre Bajila según algunos relatos y al-Muthanna sobre Rabi'a según otros, o cada uno sobre su propio pueblo. Los ejércitos se encontraron: Shurahbil ibn al-Simt al-Kindi luchó bien ese día; Mas'ud ibn Haritha, hermano de al-Muthanna, murió, y al-Muthanna dijo: «No dejes que la caída de mi hermano te desanime; las caídas de los mejores son tales»; cargaron como un solo hombre, firmes, hasta que Dios mató a Mihran y derrotó a los incrédulos, los musulmanes persiguiéndolos con pocos escapando; Qurt ibn Jammakh al-Abdi esgrimió hasta que su espada se dobló. Cayó la noche y regresaron sigilosamente al campamento, en el año 14. La muerte de Mihran fue reclamada por Jarir ibn Abdallah y al-Mundhir ibn Hassan ibn Sirar al-Dabbi —cada uno diciendo «Yo lo maté»— en una acalorada disputa: al-Mundhir tomó su cinturón, Jarir el resto de su botín; También se dice que al-Husayn ibn Ma'bad ibn Zurara ibn Udas al-Tamimi estuvo entre sus asesinos. Se dice que Mihran y al-Qadisiyya se encuentran con dieciocho meses de diferencia."
  ur: "البلادوری میں ہے: مسلمان سال 14 میں دیر ہند میں جمع ہوئے، شیراویہ ہلاک ہو گیا اور کسریٰ کی بیٹی بران نے یزدگرد ابن شہریار کی عمر تک حکومت کی۔ اس نے مہران بن مہربندھ الحمدانی کو ان کے خلاف بارہ ہزار میں بھیجا اور مسلمانوں نے اسے اس وقت تک رخصت دے دی جب تک کہ وہ پل پار کر کے دیرالعوار کی طرف نہ چلے۔ سیف بتاتے ہیں کہ مہران کراس کرتے ہوئے البویب نامی جگہ پر گیا جہاں وہ مارا گیا۔ کہا جاتا ہے کہ البویب کے کنارے ہڈیوں سے بھر گئے تھے یہاں تک کہ خانہ جنگی کے زمانے میں خاک ان پر چھا گئی تھی، اور السقون اور بنو سلیم کے درمیان کا حصہ خسرو کے زمانے میں فرات کا الجوف میں نکلنے کا راستہ تھا۔ مسلمانوں نے النخائلہ پر، جریر بن عبداللہ نے بعض کے حساب سے بجیلہ پر اور المثنٰی نے ربیعہ پر یا ہر ایک نے اپنے اپنے لوگوں پر ڈیرے ڈالے۔ فوجیں ملیں: شورابیل بن السمط الکندی اس دن خوب لڑے۔ مسعود بن حارثہ، المثنیٰ کے بھائی کو قتل کر دیا گیا، اور المثنیٰ نے کہا، 'میرے بھائی کا زوال تجھے مایوس نہ کرے، تیرے بہترین زوال ایسے ہیں'؛ وہ ایک آدمی کے طور پر ثابت قدم رہے، یہاں تک کہ خدا نے مہران کو مار ڈالا اور کافروں کو شکست دے دی، مسلمانوں کا پیچھا کر رہے تھے اور چند فرار ہو رہے تھے۔ قرت بن جماخ العبدی نے اپنی تلوار جھکنے تک باڑ لگا دی۔ رات ڈھل گئی اور وہ 14 میں کیمپ میں واپس آگئے۔ مہران کے قتل کا دعوی جریر ابن عبداللہ اور المنذر بن حسن ابن سیرار الدبی نے کیا تھا - ہر ایک کہتا تھا کہ 'میں نے اسے مارا' - ایک شدید تنازعہ میں: المنذر نے اپنی پٹی لے لی، جریر نے اس کا باقی مال غنیمت کیا۔ یہ بھی کہا جاتا ہے کہ ان کے قاتلوں میں الحسین بن معبد بن زرارہ بن اُداس تمیمی بھی تھے۔ مہران اور القدسیہ میں اٹھارہ ماہ کا فرق کہا جاتا ہے۔"
