label: { ar: "نهب بني عامر البصرة", en: "The Banu Amir sack of Basra (588 AH)", fr: "Le sac de Bassora par les Banu Amir (588 H)", es: "El saqueo de Basora por los Banu Amir (588 AH)", ur: "بصرہ کے بنو عامر کی بوری ⁦(588ھ)⁩", tr: "Beni Amerler Basra'yı yağmaladı.", id: "Suku Bani Amer menjarah Basra." }
summary:
  ar: "في صفر سنة ثمان وثمانين وخمسمائة اجتمع بنو عامر في خلق كثير وأميرهم عميرة وقصدوا البصرة وكان أميرها محمد بن إسماعيل ينوب عن مقطعها الأمير طغرل مملوك الخليفة الناصر؛ فوصلوا يوم السبت سادس صفر فخرج إليهم الأمير محمد فيمن معه ووقعت الحرب بدرب الميدان بجانب الخريبة إلى آخر النهار، فثلم العرب في السور ليلاً ودخلوا البلد ونهبوا الخانات بالشاطئ وبعض المحال ثم فارقوها يومهم لبلوغهم قرب خفاجة والمنتفق فقاتلوهم وظفروا بهم وغنموا أموالهم وعادوا إلى البصرة بكرة الاثنين، فانهزم من جمعه الأمير من أهل البصرة والسواد ودخل العرب البصرة ونهبوها وفارقها أهلها ونهبت القسامل يومين ثم فارقوها وعاد أهلها إليها؛ وقال ابن الأثير: وقد رأيت هذه القصة بعينها في سنة ثلاث وتسعين وخمسمائة {cite:kamil-ibn-al-athir p. 214-215}."
  en: "Safar 588: Banu Amir under their amir Umayra stormed Basra — beating the caliphal deputy at the Maydan gate, breaching the wall by night, plundering the shore-khans, then leaving to rout Khafaja and Muntafiq and returning on Monday to finish the sack over two days while the townsfolk fled across the channels; Ibn al-Athir adds he saw the same story with his own eyes in 593 {cite:kamil-ibn-al-athir p. 214-215}."
  fr: "Safar 588 : les Banu Amir, sous leur émir Umayra, prirent d'assaut Bassora, battant le lieutenant califal à la porte du Maydan, perçant le mur de nuit, pillant les khans du rivage, puis partant mettre en déroute les Khafaja et les Muntafiq et revenant le lundi achever le sac en deux jours, tandis que les habitants fuyaient de l'autre côté des canaux ; Ibn al-Athir ajoute qu'il vit de ses propres yeux la même histoire en 593 {cite:kamil-ibn-al-athir p. 214-215}."
  es: "Safar 588: Banu Amir, bajo el mando de su emir Umayra, asaltaron Basora, derrotando al lugarteniente del califa en la puerta de Maydan, abriendo brechas en la muralla durante la noche, saqueando los khanes costeros, para luego partir y derrotar a Khafaja y Muntafiq, regresando el lunes para completar el saqueo durante dos días, mientras los habitantes de la ciudad huían a través de los canales; Ibn al-Athir añade que vio la misma historia con sus propios ojos en 593 {cite:kamil-ibn-al-athir p. 214-215}."
  ur: "صفر 588: بنو امیر نے اپنے امیر عمیرہ کے ماتحت بصرہ پر حملہ کیا - میدان کے دروازے پر خلیفہ کے نائب کو مارا، رات کو دیوار کو توڑا، ساحل خانوں کو لوٹ لیا، پھر خفجہ اور منتفیق کو مارنے کے لیے نکلے اور سوموار کو دو دن میں بوری ختم کرنے کے لیے واپس آئے جب کہ شہر کے لوگ بھاگ گئے۔ ابن اثیر مزید کہتے ہیں کہ انہوں نے یہی کہانی 593 میں اپنی آنکھوں سے دیکھی ہے۔ 214-215}۔"
  tr: "Hicri 588 yılının Safer ayında, Beni Emir kabilesi, liderleri Amira önderliğinde büyük bir kalabalık halinde toplanarak Basra'ya doğru yola çıktı. Liderleri, Halife el-Nasır'ın Memlüklerinden Prens Tuğrul'un adına hareket eden Muhammed ibn İsmail idi. Safer ayının altıncı günü Cumartesi günü Basra'ya vardılar ve Prens Muhammed, yanındakilerle birlikte onları karşılamaya çıktı. Savaş, gün sonuna kadar El-Khuraybah'ın yanındaki Darb el-Midan'da gerçekleşti. Araplar geceleyin surları aşarak şehre girdiler, kıyıdaki kervansarayları ve bazı dükkanları yağmaladılar. Daha sonra aynı gün Khafajah ve el-Muntafiq civarına ulaştıklarında şehri terk ettiler. Onlarla savaştılar, onları yendiler ve mallarına el koydular. Pazartesi sabahı Basra'ya döndüler. Prens'in Basra ve Sawad halkından topladığı kişiler yenilgiye uğradı. Araplar Basra'ya girip şehri yağmaladılar ve halkı şehri terk etti. İki gün boyunca el-Kasamil'i yağmaladılar, sonra orayı terk ettiler ve halkı geri döndü. İbn el-Athir şöyle dedi: Bu olayı tam olarak Hicri 593 yılında gördüm. {cite:kamil-ibn-al-athir s. 214-215}"
  id: "Pada bulan Safar tahun 588 H, Bani Amir berkumpul dalam jumlah besar, dipimpin oleh pemimpin mereka, Amira, dan menuju ke Basra. Pemimpin mereka adalah Muhammad bin Ismail, yang bertindak atas nama gubernur, Pangeran Tughrul, seorang Mamluk dari Khalifah al-Nasir. Mereka tiba pada hari Sabtu, tanggal enam Safar, dan Pangeran Muhammad keluar untuk menemui mereka bersama orang-orang yang bersamanya. Pertempuran terjadi di Darb al-Midan, di dekat al-Khuraybah, hingga akhir hari. Orang-orang Arab menerobos tembok pada malam hari dan memasuki kota, menjarah karavanserai di tepi pantai dan beberapa toko. Kemudian mereka meninggalkannya pada hari itu, ketika mereka mencapai sekitar Khafajah dan al-Muntafiq. Mereka memerangi mereka, mengalahkan mereka, dan merebut harta mereka. Mereka kembali ke Basra pada Senin pagi. Orang-orang yang telah dikumpulkan pangeran dari penduduk Basra dan Sawad dikalahkan. Orang-orang Arab memasuki Basra dan menjarahnya, dan penduduknya meninggalkannya. Mereka menjarah al-Qasamil selama dua hari, kemudian meninggalkannya, dan penduduknya kembali ke sana. Ibn al-Athir berkata: Aku melihat kisah ini persis pada tahun 593 H. {kutip:kamil-ibn-al-athir hlm. 214-215}."
