label: { ar: "نهب بني عامر البصرة", en: "The Banu Amir sack of Basra (588 AH)" }
summary:
  ar: "في صفر سنة ثمان وثمانين وخمسمائة اجتمع بنو عامر في خلق كثير وأميرهم عميرة وقصدوا البصرة وكان أميرها محمد بن إسماعيل ينوب عن مقطعها الأمير طغرل مملوك الخليفة الناصر؛ فوصلوا يوم السبت سادس صفر فخرج إليهم الأمير محمد فيمن معه ووقعت الحرب بدرب الميدان بجانب الخريبة إلى آخر النهار، فثلم العرب في السور ليلاً ودخلوا البلد ونهبوا الخانات بالشاطئ وبعض المحال ثم فارقوها يومهم لبلوغهم قرب خفاجة والمنتفق فقاتلوهم وظفروا بهم وغنموا أموالهم وعادوا إلى البصرة بكرة الاثنين، فانهزم من جمعه الأمير من أهل البصرة والسواد ودخل العرب البصرة ونهبوها وفارقها أهلها ونهبت القسامل يومين ثم فارقوها وعاد أهلها إليها؛ وقال ابن الأثير: وقد رأيت هذه القصة بعينها في سنة ثلاث وتسعين وخمسمائة {cite:kamil-ibn-al-athir p. 214-215}."
  en: "Safar 588: Banu Amir under their amir Umayra stormed Basra — beating the caliphal deputy at the Maydan gate, breaching the wall by night, plundering the shore-khans, then leaving to rout Khafaja and Muntafiq and returning on Monday to finish the sack over two days while the townsfolk fled across the channels; Ibn al-Athir adds he saw the same story with his own eyes in 593 {cite:kamil-ibn-al-athir p. 214-215}."
