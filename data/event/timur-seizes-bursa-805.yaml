id: event/timur-seizes-bursa-805
class: event
kind: conquest
label: { ar: "تيمورلنك يستولي على بورصة", en: "Timur seizes Bursa", ur: "امیر تیمور کا بورصہ پر قبضہ", es: "Timur se apodera de Bursa", fr: "Timour s'empare de Bursa", tr: "Timur Bursa'yı ele geçirdi.", id: "Timur merebut Bursa" }
summary:
  ar: "بعد هزيمة بايزيد الأول في وقعة أنقرة سنة ٨٠٤هـ/١٤٠٢م استولى تيمورلنك على أزنيق وبورصة وغيرها من المدن والحصون {cite:dawlat-uthmaniyya-salabi p. 69-70}، وبذلك انتهت الفترة التي كانت فيها بورصة العاصمة الرئيسة للدولة العثمانية منذ ٧٢٦هـ/١٣٢٦م {cite:encyclopaedia-of-islam-2 vol. 1 p. 1397}."
  en: "After Bayezid I's defeat at Ankara in 804/1402, Timur seized Nicaea (İznik) and Bursa among other towns and fortresses {cite:dawlat-uthmaniyya-salabi p. 69-70}, ending the period since 726/1326 in which Bursa had been the main capital of the Ottoman state {cite:encyclopaedia-of-islam-2 vol. 1 p. 1397}."
  ur: "804ھ/1402ء میں انقرہ میں بایزید اول کی شکست کے بعد امیر تیمور نے ازنیق اور بورصہ سمیت دیگر شہر اور قلعے فتح کیے {cite:dawlat-uthmaniyya-salabi p. 69-70}، اور اس طرح 726ھ/1326ء سے بورصہ کا بطور مرکزی عثمانی دارالحکومت دور ختم ہوا {cite:encyclopaedia-of-islam-2 vol. 1 p. 1397}۔"
  es: "Después de la derrota de Bayezid I en Ankara en 804/1402, Timur se apoderó de Nicea (İznik) y Bursa, entre otras ciudades y fortalezas {cite:dawlat-uthmaniyya-salabi p. 69-70}, poniendo fin al período desde 726/1326 en el que Bursa había sido la capital principal del estado otomano {cite:encyclopaedia-of-islam-2 vol. 1 p. 1397}."
  fr: "Après la défaite de Bayezid Ier à Ankara en 804/1402, Timur s'empara de Nicée (İznik) et de Bursa, entre autres villes et forteresses {cite:dawlat-uthmaniyya-salabi p. 69-70}, mettant fin à la période depuis 726/1326 au cours de laquelle Bursa avait été la principale capitale de l'État ottoman {cite:encyclopaedia-of-islam-2 vol. 1 p. 1397}."
  tr: "Hicri 804/Miladi 1402 yılında Ankara Muharebesi'nde I. Bayezid'in yenilgisinden sonra Timur, İznik, Bursa ve diğer şehir ve kaleleri ele geçirdi {cite:dawlat-uthmaniyya-salabi s. 69-70} ve böylece Hicri 726/Miladi 1326 yılından beri Bursa'nın Osmanlı devletinin ana başkenti olduğu döneme son verdi {cite:encyclopaedia-of-islam-2 cilt 1 s. 1397}."
  id: "Setelah kekalahan Bayezid I dalam Pertempuran Ankara pada tahun 804 H/1402 M, Timur merebut Iznik, Bursa, dan kota-kota serta benteng-benteng lainnya {cite:dawlat-uthmaniyya-salabi hlm. 69-70}, dan dengan demikian mengakhiri periode di mana Bursa menjadi ibu kota utama negara Ottoman sejak tahun 726 H/1326 M {cite:encyclopaedia-of-islam-2 vol. 1 hlm. 1397}."
