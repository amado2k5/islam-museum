label: { en: "The Prophet's marriage to Sawda bint Zam'a", ar: "زواج النبي من سودة بنت زمعة", es: "El matrimonio del Profeta con Sawda bint Zam'a", fr: "Le mariage du Prophète avec Sawda bint Zam'a", ur: "نبی کا سودہ بنت زمعہ سے نکاح", tr: "Peygamberin Sawda bint Zam'a ile evliliği", id: "Pernikahan Nabi dengan Sawda bint Zam'a" }
summary:
  en: "The marriage of Prophet Muhammad to Sawda bint Zam'a in Shawwal of the tenth year of prophethood, his first marriage after the death of Khadija."
  ar: "زواج النبي من سودة بنت زمعة في شوال سنة 10 من النبوة بعد وفاة خديجة، وكانت من المهاجرات إلى الحبشة وتوفي عنها زوجها السكران بن عمرو بمكة."
  es: "El matrimonio del profeta Mahoma con Sawda bint Zam'a en Shawwal del décimo año de su profecía, su primer matrimonio después de la muerte de Khadija."
  fr: "Le mariage du prophète Mahomet avec Sawda bint Zam'a en Shawwal de la dixième année de sa prophétie, son premier mariage après la mort de Khadija."
  ur: "نبوت کے دسویں سال شوال میں سودہ بنت زمعہ سے پیغمبر اسلام کی شادی، خدیجہ کی وفات کے بعد ان کی پہلی شادی۔"
  tr: "Peygamberimiz, Hatice'nin vefatından sonra, peygamberliğinin 10. yılı Şevval ayında Sawda bint Zam'a ile evlendi. Sawda, Habeşistan'a hicret edenlerden biriydi ve kocası Sakran bin Amr Mekke'de vefat etti."
  id: "Nabi Muhammad SAW menikahi Sawda bint Zam’a pada bulan Syawal tahun ke-10 kenabian, setelah wafatnya Khadija. Ia adalah salah satu emigran ke Abyssinia, dan suaminya, Sakran bin Amr, meninggal di Mekah."
