label: { ar: "صلح فدك", en: "The Capitulation of Fadak" }
summary:
  ar: "عند البلاذري: بعث رسول الله منصرفه من خيبر محيصة بن مسعود الأنصاري إلى أهل فدك يدعوهم إلى الإسلام، ورئيسهم يومئذ رجل منهم يقال له يوشع بن نون اليهودي، فصالحوه على نصف الأرض بتربتها فقبل ذلك منهم؛ وفي رواية أن بقية من أهل خيبر تحصنوا وسألوا أن يحقن دماءهم ويسيّرهم فسمع بذلك أهل فدك فنزلوا على مثله — فصار نصف فدك خالصاً للنبي لأنه لم يُوجف عليه بخيل ولا ركاب، وكان يصرف ما يأتيه منها إلى أبناء السبيل."
  en: "In al-Baladhuri: on his return from Khaybar the Prophet sent Muhayyisa ibn Masud al-Ansari to the people of Fadak calling them to Islam — their chief then being a man of theirs called Yusha' ibn Nun the Jew — and they made peace for half the land with its soil, which he accepted; another report has a remnant of Khaybar's people fortify themselves and ask for their blood to be spared and safe passage, whereupon the people of Fadak came down on the like terms — so half of Fadak became the Prophet's alone, since it was not charged upon with horse or camel, and he used to spend its yield on wayfarers."
