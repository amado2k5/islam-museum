id: event/sulh-of-fadak
class: event
kind: treaty
label: { ar: "صلح فدك", en: "The Capitulation of Fadak", es: "La capitulación de Fadak", fr: "La capitulation de Fadak", ur: "فدک کا سر تسلیم خم" }
summary:
  ar: "عند البلاذري: بعث رسول الله منصرفه من خيبر محيصة بن مسعود الأنصاري إلى أهل فدك يدعوهم إلى الإسلام، ورئيسهم يومئذ رجل منهم يقال له يوشع بن نون اليهودي، فصالحوه على نصف الأرض بتربتها فقبل ذلك منهم؛ وفي رواية أن بقية من أهل خيبر تحصنوا وسألوا أن يحقن دماءهم ويسيّرهم فسمع بذلك أهل فدك فنزلوا على مثله — فصار نصف فدك خالصاً للنبي لأنه لم يُوجف عليه بخيل ولا ركاب، وكان يصرف ما يأتيه منها إلى أبناء السبيل."
  en: "In al-Baladhuri: on his return from Khaybar the Prophet sent Muhayyisa ibn Masud al-Ansari to the people of Fadak calling them to Islam — their chief then being a man of theirs called Yusha' ibn Nun the Jew — and they made peace for half the land with its soil, which he accepted; another report has a remnant of Khaybar's people fortify themselves and ask for their blood to be spared and safe passage, whereupon the people of Fadak came down on the like terms — so half of Fadak became the Prophet's alone, since it was not charged upon with horse or camel, and he used to spend its yield on wayfarers."
  es: "En al-Baladhuri: a su regreso de Khaybar, el Profeta envió a Muhayyisa ibn Masud al-Ansari a la gente de Fadak para que los llamara al Islam —su jefe entonces era un hombre de entre ellos llamado Yusha' ibn Nun el judío— y ellos hicieron las paces por la mitad de la tierra con su suelo, lo cual él aceptó; otro relato dice que un remanente de la gente de Khaybar se fortificó y pidió que se les perdonara la vida y un paso seguro, tras lo cual la gente de Fadak bajó en los mismos términos —así que la mitad de Fadak pasó a ser solo del Profeta, ya que no estaba cargada con caballos o camellos, y él solía gastar su producción en los viajeros."
  fr: "Selon al-Baladhuri: à son retour de Khaybar, le Prophète envoya Muhayyisa ibn Masud al-Ansari auprès des habitants de Fadak pour les appeler à l’islam. Leur chef était alors un homme du nom de Yusha’ ibn Nun le Juif. Ils conclurent un accord pour obtenir la moitié du territoire et de sa terre, ce qu’il accepta. Selon un autre récit, un reste des habitants de Khaybar se retrancha et demanda qu’on épargne leur sang et qu’on leur garantisse un sauf-conduit. Les habitants de Fadak acceptèrent alors les mêmes conditions. Ainsi, la moitié de Fadak devint la propriété exclusive du Prophète, car elle n’était pas attaquée à cheval ni à chameau, et il avait coutume de distribuer ses récoltes aux voyageurs."
  ur: "البلادوری میں ہے: نبی نے خیبر سے واپسی پر محیصہ بن مسعود الانصاری کو فدک کے لوگوں کے پاس بھیجا اور انہیں اسلام کی دعوت دی - ان کا سردار پھر ان کا ایک شخص تھا جو یوشع بن نون یہودی کہلاتا تھا - اور انہوں نے آدھی زمین کے لیے اس کی مٹی سے صلح کر لی، جسے آپ نے قبول کر لیا۔ ایک اور روایت میں ہے کہ خیبر کے لوگوں نے اپنے آپ کو مضبوط کیا اور اپنا خون بہا اور محفوظ راستہ طلب کیا، جس پر فدک کے لوگ اسی طرح کی شرائط پر اتر آئے - چنانچہ فدک کا آدھا حصہ نبی کے اکیلے بن گیا، کیوں کہ اس پر گھوڑے یا اونٹ کا الزام نہیں تھا، اور وہ اپنی پیداوار کو مسافروں پر خرچ کرتے تھے۔"
