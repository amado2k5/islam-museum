label: { ar: "قضايا عطاء الورثة والموتى", en: "Stipends of Heirs and the Dead", fr: "Les pensions des héritiers et des défunts", es: "Estipendios de herederos y difuntos", ur: "ورثاء اور مرنے والوں کا وظیفہ", tr: "Mirasçılardan ve vefat eden kişilerden yapılan bağış vakaları", id: "Kasus-kasus donasi dari ahli waris dan orang yang telah meninggal dunia" }
summary:
  ar: "قال الزبير بن العوام لعثمان بعد موت عبد الله بن مسعود أعطني عطاء عبد الله فعياله أحق به من بيت المال فأعطاه خمسة عشر ألفاً وكان الزبير وصي ابن مسعود وكان عمر بن عبد العزيز إذا استوجب الرجل عطاءه ثم مات أعطاه ورثته ومات رجل في الحي بعد ثمانية أشهر مضت من السنة فأعطاه عمر ثلثي عطائه وشهد ثلاثة مملوكين لبني عفان بدراً فكان عمر يعطي كل إنسان منهم كل سنة ثلاثة آلاف درهم وأتي علي بمنبوذ فأثبته في مائة وأثبت عمر بن عبد العزيز مروان بن شجاع وهو فطيم في عشرة دنانير وسئل الحسين بن علي أو الحسن متى يجب سهم المولود قال إذا استهل."
  en: "Al-Zubayr ibn al-Awwam asked Uthman, after Abdallah ibn Mas'ud's death, for Abdallah's stipend — 'his dependents deserve it more than the bayt al-mal' — and took fifteen thousand, being Ibn Mas'ud's executor. Umar II gave an earned stipend to a dead man's heirs; Umar gave two-thirds of a year's stipend to a man who died eight months in. Three mamluks of Banu Affan who witnessed Badr drew three thousand each yearly; Ali enrolled an exposed infant at a hundred; Umar II enrolled Marwan ibn Shuja', still weaning, at ten dinars; and asked when a newborn's share falls due, al-Husayn (or al-Hasan) said 'when he cries out'."
  fr: "Après la mort d'Abdallah ibn Mas'ud, al-Zubayr ibn al-Awwam demanda à Uthman la pension d'Abdallah, « ses dépendants y ont plus droit que le bayt al-mal », et reçut quinze mille, étant l'exécuteur testamentaire d'Ibn Mas'ud. Umar II versait aux héritiers d'un défunt la pension qu'il avait acquise ; Umar donna les deux tiers d'une pension annuelle pour un homme mort au bout de huit mois. Trois mamelouks des Banu Affan, témoins de Badr, touchaient chacun trois mille par an ; Ali inscrivit un enfant trouvé pour cent ; Umar II inscrivit Marwan ibn Shuja', encore au sevrage, pour dix dinars ; et, interrogé sur le moment où la part d'un nouveau-né devient due, al-Husayn (ou al-Hasan) répondit : « quand il pousse son premier cri »."
  es: "Al-Zubayr ibn al-Awwam pidió a Uthman, tras la muerte de Abdallah ibn Mas'ud, la asignación de Abdallah —«sus dependientes la merecen más que el bayt al-mal»— y tomó quince mil, siendo el albacea de Ibn Mas'ud. Umar II dio una asignación ganada a los herederos de un hombre muerto; Umar dio dos tercios de la asignación anual a un hombre que murió a los ocho meses. Tres mamelucos de Banu Affan que presenciaron Badr recibieron tres mil cada uno anualmente; Ali inscribió a un bebé expuesto por cien; Umar II inscribió a Marwan ibn Shuja', aún destetado, por diez dinares; y cuando se le preguntó cuándo vencía la parte de un recién nacido, al-Husayn (o al-Hasan) dijo «cuando llore»."
  ur: "الزبیر بن العوام نے عبداللہ بن مسعود کی وفات کے بعد عثمان سے عبداللہ کا وظیفہ طلب کیا - 'ان کے زیر کفالت اس کے بیت المال سے زیادہ مستحق ہیں' - اور ابن مسعود کے وصی ہونے کی وجہ سے پندرہ ہزار لیے۔ عمر ثانی نے مرنے والے کے ورثاء کو کمایا ہوا وظیفہ دیا۔ عمر نے ایک شخص کو دو تہائی سال کا وظیفہ دیا جو آٹھ مہینے میں فوت ہو گیا۔ علی نے ایک بے نقاب شیر خوار بچے کو ایک سو میں داخل کرایا۔ عمر دوم نے مروان بن شجاع کو دس دینار میں رجسٹر کروایا جو ابھی دودھ چھڑا رہا ہے۔ اور پوچھا کہ جب نومولود کا حصہ واجب الادا ہوتا ہے تو الحسین ⁦(یا الحسن)⁩ نے کہا کہ جب وہ روتا ہے۔"
  tr: "Abdullah ibn Mesud'un ölümünden sonra el-Zübeyr ibn el-Evvem, Osman'a, \"Abdullah'ın maaşını bana ver, çünkü ailesi hazineden daha çok buna layıktır\" dedi. Böylece Osman ona on beş bin dirhem verdi. El-Zübeyr, İbn Mesud'un vasiyetini yerine getiren kişiydi. Ömer ibn Abdülaziz, maaşını hak eden ve sonra ölen bir adama verirdi, sonra da mirasçılarına bırakırdı. Komşulardan bir adam yılın sekizinci ayında öldü, bu yüzden Ömer ona maaşının üçte ikisini verdi. Beni Affan kabilesinden üç köle Bedir'e şahitlik etti, bu yüzden Ömer her birine her yıl üç bin dirhem verirdi. Ali'ye kimsesiz bir bebek getirildi, bu yüzden onu yüz dirhem olarak kaydetti. Ömer ibn Abdülaziz, sütten kesilmiş olan Mervan ibn Şuca'yı on dirhem olarak kaydetti. Hüseyin ibn Ali veya Hasan'a yeni doğan bebeğin payının ne zaman ödeneceği soruldu. “Bağırdığında,” dedi."
  id: "Al-Zubayr ibn al-Awwam berkata kepada Uthman setelah kematian Abdullah ibn Masoud, “Berikan kepadaku uang saku Abdullah, karena keluarganya lebih berhak menerimanya daripada kas negara.” Maka Uthman memberinya lima belas ribu dirham. Al-Zubayr adalah pelaksana wasiat Ibn Masoud. Umar ibn Abd al-Aziz biasa memberikan uang sakunya kepada seseorang yang berhak menerimanya dan kemudian meninggal, lalu memberikannya kepada ahli warisnya. Seorang pria meninggal di lingkungan sekitar setelah delapan bulan berlalu dalam setahun, maka Umar memberinya dua pertiga dari uang sakunya. Tiga budak dari Banu Affan menjadi saksi Perang Badar, maka Umar biasa memberi masing-masing dari mereka tiga ribu dirham setiap tahun. Ali dibawa sebagai anak terlantar, maka Umar mencatatnya dalam seratus dirham. Umar ibn Abd al-Aziz mencatat Marwan ibn Shuja’, yang disapih, dalam sepuluh dinar. Al-Husayn ibn Ali atau al-Hasan ditanya kapan bagian bayi yang baru lahir harus dibayarkan. Dia menjawab, “Saat ia menangis.”"
