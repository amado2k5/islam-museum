id: event/nuwayri-bukhari-sama-715
class: event
kind: gathering
label:
  ar: "النويري في مجالس الإسماع: صحيح البخاري على الشيخة وزيرة، ٧١٥هـ/١٣١٥م"
  en: "Al-Nuwayri in the audition sessions: Sahih al-Bukhari under Wazira bint al-Munadhdha, 715/1315"
  ur: "نويری مجالسِ سماعت میں: شیخہ وزیرہ بنت المنذہ سے صحیح بخاری، 715ھ/1315ء"
summary:
  ar: "ظل النويري طول عمره شغوفاً بتدريس الحديث: سمع صحيح البخاري في مجالس الإسماع التي أقامتها الشيخة وزيرة بنت المنذة ⁦(ت ٧١٦هـ)⁩ سنة ٧١٥هـ/١٣١٥م، وكذلك مجالس الشيخ الصالح الحجار ⁦(ت ٧٣٠هـ)⁩ بالمدرسة المنصورية، وسمع سنن أبي داود من ابن السابوني ⁦(ت ٧٢٠هـ)⁩، وكتاب الشفا من عبد الحق بن فتيان القرشي سنة ٧٠٨هـ بالمدرسة الناصرية، والموطأ وصحيح مسلم من الشريف عز الدين الدمشقي ⁦(ت ٧١٥هـ)⁩؛ ومن شيوخه عبد المؤمن الدمياطي وابن دقيق العيد وقاضي القضاة ابن جماعة والشيخة زينب بنت يحيى {cite:encyclopaedia-of-islam-2 vol. 8 p. 156}."
  en: "Al-Nuwayri kept a lifelong interest in the teaching of hadith: he attended the shaykha Wazira bint al-Munadhdha's (d. 716) transmission sessions of Sahih al-Bukhari in 715/1315, likewise those of al-Salihi al-Hajjar (d. 730) at the Mansuriyya madrasa; he heard the Sunan of Abu Dawud from Ibn al-Sabuni (d. 720), the Kitab al-Shifa from Abd al-Haqq ibn Fityan al-Qurashi in 708/1308 at the Nasiriyya, and Malik's Muwatta' and Sahih Muslim from the Sharif Izz al-Din al-Dimashqi (d. 715); among his masters were Abd al-Mu'min al-Dimyati, Ibn Daqiq al-Id, chief qadi Ibn Jama'a and the shaykha Zaynab bint Yahya {cite:encyclopaedia-of-islam-2 vol. 8 p. 156}."
  ur: "نويری کو عمر بھر تدریسِ حدیث سے دلچسپی رہی: انہوں نے 715ھ/1315ء میں شیخہ وزیرہ بنت المنذہ ⁦(وفات 716ھ)⁩ کے مجالسِ سماعت میں صحیح بخاری سنی، اسی طرح المدرسہ منصوریہ میں صالح الحجار ⁦(وفات 730ھ)⁩ کے مجالس؛ ابن سابونی ⁦(وفات 720ھ)⁩ سے سنن ابی داود، عبدالحق بن فتیان قرشی سے 708ھ/1308ء میں ناصریہ میں کتاب الشفا، اور شریف عز الدین دمشقی ⁦(وفات 715ھ)⁩ سے موطأ اور صحیح مسلم سنے؛ ان کے مشائخ میں عبدالمؤمن دمیاطی، ابن دقیق العید، قاضی القضاة ابن جماعہ اور شیخہ زینب بنت یحییٰ تھے {cite:encyclopaedia-of-islam-2 vol. 8 p. 156}۔"
