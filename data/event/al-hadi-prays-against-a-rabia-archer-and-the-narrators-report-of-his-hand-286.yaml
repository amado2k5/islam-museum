id: event/al-hadi-prays-against-a-rabia-archer-and-the-narrators-report-of-his-hand-286
class: event
kind: other
label:
  ar: دعاء الهادي على رامٍ من بني ربيعة وخبر الراوي عن يده، بعد سقوطه بميناس
  en: Al-Hadi prays against a Banu Rabi'a archer and the narrator's report about his hand, after the fall at Minas
  ur: میناس میں گرنے کے بعد ہادی کی بنو ربیعہ کے ایک تیرانداز کے خلاف دعا اور اس کے ہاتھ کی بابت راوی کی خبر
  es: "Al-Hadi reza contra un arquero de Banu Rabi'a y el relato del narrador sobre su mano, después de la caída en Minas."
  fr: "Al-Hadi prie contre un archer des Banu Rabi'a et le récit du narrateur concernant sa main, après la chute à Minas"
  tr: "El-Hadi'nin Rabi'ah kabilesinden bir savaşçıya karşı yaptığı dua ve rivayetçinin Minas'ta düşüşünden sonra onun elinin nasıl olduğunu anlattığı öykü."
  id: "Doa Al-Hadi melawan seorang pejuang dari suku Rabi'ah, dan catatan perawi tentang tangannya, setelah ia jatuh di Minas."
summary:
  ar: يروي صاحب الكتاب أن رجلاً من بني ربيعة كان يكثر الرمي لأصحاب الهادي يوم سقوطه بميناس فدعا عليه الهادي أن يقطع الله يده، ويقول إن بعض من يثق بهم وبعض بني الحارث أخبروه بعد وصولهم البلد أن أصابع الرجل أصابها ما بلغ الرسغين ومات.
  en: The narrator says a man of Banu Rabi'a shot much at al-Hadi's men on the day he fell at Minas and al-Hadi prayed that God cut off his hand; he says some he trusts and some of Banu al-Harith told him after they reached the land that the man's fingers were affected as far as the wrists and that he died.
  ur: راوی کہتا ہے کہ ہادی کے میناس میں گرنے کے دن بنو ربیعہ کا ایک آدمی ان کے ساتھیوں پر بہت تیر چلاتا تھا اور ہادی نے دعا کی کہ اللہ اس کا ہاتھ کاٹ دے؛ وہ کہتا ہے کہ اپنے معتمد کچھ لوگوں اور بنو حارث کے بعض نے اسے ملک پہنچنے کے بعد بتایا کہ اس شخص کی انگلیوں کو کلائیوں تک کچھ ہوا اور وہ مر گیا۔
  es: "El narrador dice que un hombre de Banu Rabi'a disparó mucho contra los hombres de al-Hadi el día que cayó en Minas y al-Hadi rezó para que Dios le cortara la mano; dice que algunos en quienes confía y algunos de Banu al-Harith le dijeron después de que llegaron a tierra que los dedos del hombre estaban afectados hasta las muñecas y que murió."
  fr: "Le narrateur raconte qu'un homme des Banu Rabi'a a tiré abondamment sur les hommes d'al-Hadi le jour où il est tombé à Minas et qu'al-Hadi a prié pour que Dieu lui coupe la main; il dit que certains de ses fidèles et certains des Banu al-Harith lui ont dit après leur arrivée sur les lieux que les doigts de l'homme avaient été touchés jusqu'aux poignets et qu'il était mort."
  tr: "Kitabın yazarı, Beni Rabi’ah kabilesinden bir adamın Minas’ta düştüğü gün Al-Hadi’nin arkadaşlarına çok sayıda taş attığını, bunun üzerine Al-Hadi’nin Allah’tan adamın elini kesmesini dilediğini anlatıyor. Yazar, şehre vardıklarında güvendiği bazı kişilerin ve Beni Al-Harith kabilesinden bazılarının kendisine adamın parmaklarının bileklerine kadar yaralandığını ve öldüğünü söylediklerini belirtiyor."
  id: "Penulis buku tersebut menceritakan bahwa seorang pria dari Bani Rabi'ah biasa melempari banyak batu kepada para sahabat Al-Hadi pada hari kejatuhannya di Minas, sehingga Al-Hadi berdoa agar Allah memotong tangannya. Ia mengatakan bahwa beberapa orang yang dipercayanya dan beberapa dari Bani Al-Harith memberitahunya setelah mereka tiba di kota bahwa jari-jari pria itu terluka hingga pergelangan tangan dan ia meninggal."
