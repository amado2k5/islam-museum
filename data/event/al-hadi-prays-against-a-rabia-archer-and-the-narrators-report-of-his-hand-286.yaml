id: event/al-hadi-prays-against-a-rabia-archer-and-the-narrators-report-of-his-hand-286
class: event
kind: other
label:
  ar: دعاء الهادي على رامٍ من بني ربيعة وخبر الراوي عن يده، بعد سقوطه بميناس
  en: Al-Hadi prays against a Banu Rabi'a archer and the narrator's report about his hand, after the fall at Minas
  ur: میناس میں گرنے کے بعد ہادی کی بنو ربیعہ کے ایک تیرانداز کے خلاف دعا اور اس کے ہاتھ کی بابت راوی کی خبر
summary:
  ar: يروي صاحب الكتاب أن رجلاً من بني ربيعة كان يكثر الرمي لأصحاب الهادي يوم سقوطه بميناس فدعا عليه الهادي أن يقطع الله يده، ويقول إن بعض من يثق بهم وبعض بني الحارث أخبروه بعد وصولهم البلد أن أصابع الرجل أصابها ما بلغ الرسغين ومات.
  en: The narrator says a man of Banu Rabi'a shot much at al-Hadi's men on the day he fell at Minas and al-Hadi prayed that God cut off his hand; he says some he trusts and some of Banu al-Harith told him after they reached the land that the man's fingers were affected as far as the wrists and that he died.
  ur: راوی کہتا ہے کہ ہادی کے میناس میں گرنے کے دن بنو ربیعہ کا ایک آدمی ان کے ساتھیوں پر بہت تیر چلاتا تھا اور ہادی نے دعا کی کہ اللہ اس کا ہاتھ کاٹ دے؛ وہ کہتا ہے کہ اپنے معتمد کچھ لوگوں اور بنو حارث کے بعض نے اسے ملک پہنچنے کے بعد بتایا کہ اس شخص کی انگلیوں کو کلائیوں تک کچھ ہوا اور وہ مر گیا۔
