id: event/abu-al-qasim-calls-the-community-to-guidance-and-the-quran-as-judge-in-verse-290
class: event
kind: other
label:
  ar: نداء أبي القاسم في الشعر إلى الأمة بالعودة إلى الهدى وتحكيم القرآن، ص268، 290هـ
  en: Abu al-Qasim's verse call to the community to return to guidance and to let the Qur'an judge, p. 268, 290 AH
  ur: امت کو ہدایت کی طرف لوٹنے اور قرآن کو حَکَم بنانے کی ابو القاسم کی منظوم دعوت، ص268، 290ھ
summary:
  ar: قصيدة قصيرة ينسبها الكتاب إلى أبي القاسم يدعو فيها الأمة إلى الهدى وإلى تحكيم القرآن ويقول إن للسيف علينا حكمه، ويدعو إلى اتباع ما قال يحيى.
  en: A short poem the book ascribes to Abu al-Qasim in which he calls the community back to guidance and to let the Qur'an judge, says that the sword has its own judgement on those who refuse, and calls them to follow what Yahya said.
  ur: ایک مختصر قصیدہ جو کتاب ابو القاسم سے منسوب کرتی ہے، جس میں وہ امت کو ہدایت اور قرآن کو حَکَم بنانے کی طرف بلاتے ہیں، کہتے ہیں کہ تلوار کا اپنا فیصلہ ہے، اور یحییٰ کے کہے کی پیروی کی دعوت دیتے ہیں۔
