id: event/al-dhahabi-begins-hadith-690
class: event
kind: other
label:
  ar: "الذهبي يشرع في طلب الحديث بدمشق، ٦٩٠هـ"
  en: "Al-Dhahabi begins the study of hadith at Damascus, 690/1291"
  ur: "ذہبی کا دمشق میں تحصیل حدیث کا آغاز، 690ھ/1291ء"
summary:
  ar: "شرع الذهبي في سماع الحديث بدمشق سنة ٦٩٠هـ أو ٦٩١هـ على يوسف المزي وعمر بن كواس وأحمد بن هبة الله بن عساكر ويوسف بن أحمد الكمولي، وتفقه في الفقه على كمال الدين بن الزملكاني وبرهان الدين الفزاري وكمال الدين ابن قاضي شهبة، وكان شافعي المذهب {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}؛ وذكر ابن حجر أنه طلب نحو عشرين سنة فأكثر عن ابن قدير وابن عساكر ويوسف المزي {cite:durar-kamina-jil-1993 3/336}."
  en: "Al-Dhahabi began hearing hadith at Damascus in 690/1291 or 691 under Yusuf al-Mizzi, Umar ibn Kawwas, Ahmad ibn Hibat Allah ibn Asakir and Yusuf ibn Ahmad al-Kamuli, and studied law under Kamal al-Din ibn al-Zamlikani, Burhan al-Din al-Fazari and Kamal al-Din ibn Qadi Shubba; he was a Shafi'i {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}. Ibn Hajar records that he pursued the quest for some twenty years, hearing much from Ibn Qudayr, Ibn Asakir and Yusuf al-Mizzi {cite:durar-kamina-jil-1993 3/336}."
  ur: "ذہبی نے 690ھ/1291ء یا 691ھ میں دمشق میں یوسف مزی، عمر بن کواس، احمد بن ہبۃ اللہ بن عساکر اور یوسف بن احمد کمولی سے حدیث کا سماع شروع کیا، اور کمال الدین بن الزملکانی، برہان الدین فزاری اور کمال الدین ابن قاضی شہبہ سے فقہ پڑھی؛ وہ شافعی تھے {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}۔ ابن حجر کے مطابق انہوں نے تقریباً بیس برس طلب علم میں گزارے اور ابن قدیر، ابن عساکر اور یوسف مزی سے بے شمار روایات لیں {cite:durar-kamina-jil-1993 3/336}۔"
