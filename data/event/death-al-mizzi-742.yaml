id: event/death-al-mizzi-742
class: event
kind: death
label:
  ar: "وفاة الحافظ جمال الدين المزي بدمشق، ١٢ صفر ٧٤٢هـ"
  en: "The hafiz Jamal al-Din al-Mizzi dies at Damascus, 12 Safar 742/1341"
  ur: "حافظ جمال الدین مزی کی وفات دمشق میں، 12 صفر 742ھ/1341ء"
summary:
  ar: "توفي المزي يوم السبت ثاني عشر صفر سنة اثنتين وأربعين وسبعمائة، ودُفن من الغد بمقابر الصوفية {cite:tarikh-islam-dhahabi p. 493}؛ وذكر صهره ابن كثير أنه مرض أياماً يسيرة وأنه مات بين الظهر والعصر وهو يقرأ آية الكرسي، وصلّى عليه من الناس بالجامع ثم خارج باب النصر، ودُفن بمقابر الصوفية بالقرب من ابن تيمية وكان الجمع في جنازته متوفراً جداً {cite:durar-kamina-jil-1993 4/461}."
  en: "Al-Mizzi died on Saturday 12 Safar 742 and was buried the next day in the Sufi cemetery {cite:tarikh-islam-dhahabi p. 493}; his son-in-law Ibn Kathir relates that he was ill for a few days and died between the zuhr and asr prayers while reciting the Throne Verse; the people prayed over him in the congregational mosque then outside Bab al-Nasr, and he was buried in the Sufi cemetery near Ibn Taymiyya, the funeral gathering being very large {cite:durar-kamina-jil-1993 4/461}."
  ur: "مزی ہفتہ 12 صفر 742ھ کو فوت ہوئے اور اگلے دن صوفیہ کے قبرستان میں دفن کیے گئے {cite:tarikh-islam-dhahabi p. 493}؛ ان کے داماد ابن کثیر کے مطابق وہ چند دن بیمار رہے اور ظہر اور عصر کے درمیان آیت الکرسی پڑھتے ہوئے فوت ہوئے؛ لوگوں نے جامع میں پھر باب النصر کے باہر ان کا جنازہ پڑھا اور انہیں ابن تیمیہ کے قریب صوفیہ کے قبرستان میں دفن کیا گیا، جنازے میں بہت بڑا مجمع تھا {cite:durar-kamina-jil-1993 4/461}۔"
