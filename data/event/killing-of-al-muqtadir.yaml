label: { ar: "مسير مؤنس إلى بغداد وقتل المقتدر" }
summary:
  ar: "في شوال سنة عشرين وثلاثمائة خرج مؤنس من الموصل متجهاً إلى بغداد، ووقعت المعركة بين الجيشين عند الشماسية فقُتل المقتدر فيها، وذكر الطبري أن مؤنساً اشتد جزعه حين حُمل إليه الجثمان {cite:tabari-tarikh-abu-al-fadl j.11 p.148} {cite:tabari-tarikh-abu-al-fadl j.11 p.152}، وعند السيوطي كان معظم جند مؤنس البربر فلما التقى الجمعان رمى بربري المقتدر بحربة سقط منها إلى الأرض ثم ذبحه بالسيف وشيل رأسه على رمح وسلب ما عليه وبقي مكشوف العورة حتى ستر بالحشيش ثم حفر له في الموضع ودفن وذلك يوم الأربعاء لثلاث بقين من شوال سنة عشرين {cite:tarikh-khulafa-minhaj-1434 p. 593}.، وعند المسعودي كان قتله في الوقعة التي كانت بينه وبين مؤنس الخادم بباب الشماسية من الجانب الشرقي يوم الأربعاء لثلاث ليال بقين من شوال سنة عشرين وثلثمائة وقت صلاة العصر، وتولى دفنه العامة، وأخذ الفضل بن جعفر الطالع في وقت ركوبه فقال وقت الزوال فقطب المقتدر وأراد ألا يخرج حتى أشرفت عليه خيل مؤنس {cite:muruj-al-dhahab p. 649,661-662}، وعند ابن الأثير خرج وهو كاره وبين يديه الفقهاء والقراء معهم المصاحف مشهورة وعليه البردة والناس حوله فوقف على تل عال بعيد من المعركة وأرسل قواد أصحابه يسألونه التقدم مرة بعد أخرى وهو واقف فلما ألحوا عليه تقدم من مقدمة فانهزم أصحابه قبل وصوله إليهم وكان قد أمر فنودي من جاء بأسير فله عشرة دنانير ومن جاء برأس فله خمسة دنانير، فلما انهزم أصحابه لقيه علي بن بليق وهو من أصحاب مؤنس فترجل وقبل الأرض وقال إلى أين تذهب ارجع فأراد الرجوع فلحقه قوم من المغاربة والبربر فشهروا عليه سيوفهم فقال ويحكم أنا الخليفة فقالوا قد عرفناك يا صعلوك أنت خليفة إبليس تبذل في كل رأس خمسة دنانير وفي كل أسير عشرة دنانير فضربه أحدهم بسيفه على عاتقه فسقط إلى الأرض وذبحه بعضهم، وكان المقتدر ثقيل البدن عظيم الجثة فرفعوا رأسه على خشبة وهم يكبرون ويلعنونه وأخذوا جميع ما عليه حتى سراويله وتركوه مكشوف العورة حتى مر به رجل من الأكراد فستره بحشيش ثم حفر له موضعه ودفنه وعفّى قبره، وكان مؤنس في الراشدية لم يشهد الحرب فلما حُمل رأس المقتدر إليه بكى ولطم وجهه ورأسه وقال يا مفسدون ما هكذا أوصيتكم قتلتموه وكان هذا آخر أمره والله لنُقتلنّ كلنا، وكان ما فعله مؤنس سبباً لتجرأة أصحاب الأطراف على الخلفاء وطمعهم فيما لم يكن يخطر لهم على بال وانحلّت الهيبة وضعف أمر الخلافة {cite:kamil-ibn-al-athir p. 180-181}"
