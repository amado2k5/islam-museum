id: event/killing-of-al-muqtadir
class: event
kind: death
label: { ar: "مسير مؤنس إلى بغداد وقتل المقتدر" }
summary:
  ar: "في شوال سنة عشرين وثلاثمائة خرج مؤنس من الموصل متجهاً إلى بغداد، ووقعت المعركة بين الجيشين عند الشماسية فقُتل المقتدر فيها، وذكر الطبري أن مؤنساً اشتد جزعه حين حُمل إليه الجثمان {cite:tabari-tarikh-abu-al-fadl j.11 p.148} {cite:tabari-tarikh-abu-al-fadl j.11 p.152}، وعند السيوطي كان معظم جند مؤنس البربر فلما التقى الجمعان رمى بربري المقتدر بحربة سقط منها إلى الأرض ثم ذبحه بالسيف وشيل رأسه على رمح وسلب ما عليه وبقي مكشوف العورة حتى ستر بالحشيش ثم حفر له في الموضع ودفن وذلك يوم الأربعاء لثلاث بقين من شوال سنة عشرين {cite:tarikh-khulafa-minhaj-1434 p. 593}.، وعند المسعودي كان قتله في الوقعة التي كانت بينه وبين مؤنس الخادم بباب الشماسية من الجانب الشرقي يوم الأربعاء لثلاث ليال بقين من شوال سنة عشرين وثلثمائة وقت صلاة العصر، وتولى دفنه العامة، وأخذ الفضل بن جعفر الطالع في وقت ركوبه فقال وقت الزوال فقطب المقتدر وأراد ألا يخرج حتى أشرفت عليه خيل مؤنس {cite:muruj-al-dhahab p. 649,661-662}"
