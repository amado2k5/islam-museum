id: event/killing-of-al-muqtadir
class: event
kind: death
label: { ar: "مسير مؤنس إلى بغداد وقتل المقتدر", en: "Mu'nis's march on Baghdad and the killing of al-Muqtadir", es: "La marcha de Mu'nis sobre Bagdad y el asesinato de al-Muqtadir", fr: "Marche de Mu'nis sur Bagdad et meurtre d'al-Muqtadir" }
summary:
  ar: "في شوال سنة عشرين وثلاثمائة خرج مؤنس من الموصل متجهاً إلى بغداد، ووقعت المعركة بين الجيشين عند الشماسية فقُتل المقتدر فيها، وذكر الطبري أن مؤنساً اشتد جزعه حين حُمل إليه الجثمان {cite:tabari-tarikh-abu-al-fadl j.11 p.148} {cite:tabari-tarikh-abu-al-fadl j.11 p.152}، وعند السيوطي كان معظم جند مؤنس البربر فلما التقى الجمعان رمى بربري المقتدر بحربة سقط منها إلى الأرض ثم ذبحه بالسيف وشيل رأسه على رمح وسلب ما عليه وبقي مكشوف العورة حتى ستر بالحشيش ثم حفر له في الموضع ودفن وذلك يوم الأربعاء لثلاث بقين من شوال سنة عشرين {cite:tarikh-khulafa-minhaj-1434 p. 593}. وعند المسعودي كان قتله في الوقعة التي كانت بينه وبين مؤنس الخادم بباب الشماسية من الجانب الشرقي يوم الأربعاء لثلاث ليال بقين من شوال سنة عشرين وثلثمائة وقت صلاة العصر، وتولى دفنه العامة، وأخذ الفضل بن جعفر الطالع في وقت ركوبه فقال وقت الزوال فقطب المقتدر وأراد ألا يخرج حتى أشرفت عليه خيل مؤنس {cite:muruj-al-dhahab p. 649,661-662}، وعند ابن الأثير خرج وهو كاره وبين يديه الفقهاء والقراء معهم المصاحف مشهورة وعليه البردة والناس حوله فوقف على تل عال بعيد من المعركة وأرسل قواد أصحابه يسألونه التقدم مرة بعد أخرى وهو واقف فلما ألحوا عليه تقدم من مقدمة فانهزم أصحابه قبل وصوله إليهم وكان قد أمر فنودي من جاء بأسير فله عشرة دنانير ومن جاء برأس فله خمسة دنانير، فلما انهزم أصحابه لقيه علي بن بليق وهو من أصحاب مؤنس فترجل وقبل الأرض وقال إلى أين تذهب ارجع فأراد الرجوع فلحقه قوم من المغاربة والبربر فشهروا عليه سيوفهم فقال ويحكم أنا الخليفة فقالوا قد عرفناك يا صعلوك أنت خليفة إبليس تبذل في كل رأس خمسة دنانير وفي كل أسير عشرة دنانير فضربه أحدهم بسيفه على عاتقه فسقط إلى الأرض وذبحه بعضهم، وكان المقتدر ثقيل البدن عظيم الجثة فرفعوا رأسه على خشبة وهم يكبرون ويلعنونه وأخذوا جميع ما عليه حتى سراويله وتركوه مكشوف العورة حتى مر به رجل من الأكراد فستره بحشيش ثم حفر له موضعه ودفنه وعفّى قبره، وكان مؤنس في الراشدية لم يشهد الحرب فلما حُمل رأس المقتدر إليه بكى ولطم وجهه ورأسه وقال يا مفسدون ما هكذا أوصيتكم قتلتموه وكان هذا آخر أمره والله لنُقتلنّ كلنا، وكان ما فعله مؤنس سبباً لتجرأة أصحاب الأطراف على الخلفاء وطمعهم فيما لم يكن يخطر لهم على بال وانحلّت الهيبة وضعف أمر الخلافة {cite:kamil-ibn-al-athir p. 180-181}، وعند ابن الجوزي وعند ابن الجوزي تفصيل مصرعه: ركب يوم الأربعاء لثلاث بقين من شوال سنة 320هـ ومر في الشارع يريد مضربه وعليه قباء فضي وعمامة سوداء والبردة على كتفيه وبين يديه أعلام الملك وحوله جماعة من الآمرين بأيديهم المصاحف وكثر دعاء الناس له ثم جرت الحرب وكان في البربر من أصحاب مؤنس فأحاطوا بالمقتدر وضربه رجل منهم من خلفه ضربة سقط منها إلى الأرض فقال أنا الخليفة فقال بربك أطلب وأضجعه فذبحه بالسيف ورفع رأسه على سيف ثم على خشبة وسلب ثيابه حتى مر به بعض الأكرة فستره بحشيش ثم حفر له في الموضع ودفنت جثته دون رأسه وذلك ببرقة الشماسية مما يلي قرية يحيى وحمل رأسه إلى مؤنس وكان سنه يومئذ ثمانياً وثلاثين سنة وشهراً وخمسة أيام وكان قتله في الساعة الرابعة وكانت خلافته أربعاً وعشرين سنة وأحد عشر شهراً وأربعة عشر يوماً من جملتها يومان وثلاث خلع فيها من الخلافة ثم أعيد {cite:muntazam-ibn-al-jawzi p. 535}"
  en: "In Shawwal of the year 320 Mu'nis set out from Mosul toward Baghdad, and the battle between the two armies took place at al-Shammasiya, where al-Muqtadir was killed. Al-Tabari reports that Mu'nis's grief was intense when the body was carried to him {cite:tabari-tarikh-abu-al-fadl j.11 p.148} {cite:tabari-tarikh-abu-al-fadl j.11 p.152}. According to al-Suyuti, most of Mu'nis's troops were Berbers; when the two sides met, a Berber struck al-Muqtadir with a spear so that he fell to the ground, then slaughtered him with a sword, raised his head on a spear, stripped the clothing from him, and left him exposed until he was covered with grass; a grave was dug on the spot and he was buried, on Wednesday, three days before the end of Shawwal of the year 320 {cite:tarikh-khulafa-minhaj-1434 p. 593}. According to al-Mas'udi, he was killed in the battle between him and Mu'nis the servant at the Shammasiya gate on the eastern side, on Wednesday, three nights before the end of Shawwal of the year 320, at the time of the afternoon prayer; the common people buried him. Al-Fadl ibn Ja'far al-Ta'li' cast the astrological hour for his ride out and named midday, so al-Muqtadir frowned and wished not to go out until Mu'nis's horsemen appeared above him {cite:muruj-al-dhahab p. 649,661-662}. According to Ibn al-Athir, he went out against his will, with jurists and reciters ahead of him carrying well-known copies of the Qur'an, wearing the cloak (burda), with people around him. He stood on a high mound far from the battle while his commanders sent asking him again and again to advance; when they pressed him he advanced from the vanguard, but his men had fled before he reached them. He had proclaimed that whoever brought a prisoner would receive ten dinars and whoever brought a head would receive five. When his men had fled, Ali ibn Baliq, one of Mu'nis's companions, met him, dismounted, kissed the ground and said: 'Where are you going? Turn back.' As he tried to turn back, a group of Maghariba and Berbers caught up with him and drew their swords. He said: 'Woe to you, I am the caliph.' They said: 'We know you, you vagabond; you are the caliph of Iblis. You pay five dinars for every head and ten for every prisoner.' One of them struck him on the shoulder with his sword and he fell to the ground; some of them slaughtered him. Al-Muqtadir was heavy-bodied and large; they raised his head on a pole, shouting 'God is greatest' and cursing him, took everything on him down to his trousers, and left him exposed until a man from the Kurds passed and covered him with grass; they then dug a grave on the spot, buried him and levelled the grave. Mu'nis had been at al-Rashidiya and had not witnessed the battle; when al-Muqtadir's head was brought to him he wept, struck his face and head, and said: 'You corrupters, this is not what I charged you with. You have killed him, and this was the end of his affairs. By God, we will all be killed.' What Mu'nis did emboldened the provincial commanders against the caliphs and made them greedy for things they had never imagined; awe dissolved and the authority of the caliphate weakened {cite:kamil-ibn-al-athir p. 180-181}. According to Ibn al-Jawzi, he rode out on Wednesday, three nights before the end of Shawwal of the year 320, and passed along the street toward his tent, wearing a silver robe and a black turban, with the cloak over his shoulders, banners of kingship before him, and a group of commanders around him holding copies of the Qur'an; people called down blessings on him. Then the battle began. Among Mu'nis's Berbers they surrounded al-Muqtadir, and a man struck him from behind with a blow that brought him to the ground. He said: 'I am the caliph.' The man said: 'By your Lord, it is you I am after,' laid him down and slaughtered him with the sword, raised his head on a sword and then on a pole, and stripped his clothing until one of the farmhands passed and covered him with grass. They dug a grave on the spot and buried his body without his head, at the Barqa of al-Shammasiya on the side of the village of Yahya. His head was taken to Mu'nis. He was thirty-eight years, one month and five days old, and he was killed at the fourth hour. His caliphate had lasted twenty-four years, eleven months and fourteen days, of which two days and three deposals, during which he was removed from the caliphate before being restored {cite:muntazam-ibn-al-jawzi p. 535}."
  es: "En Shawwal del año 320, Mu'nis partió de Mosul hacia Bagdad, y la batalla entre los dos ejércitos tuvo lugar en al-Shammasiya, donde murió al-Muqtadir. Al-Tabari relata que el dolor de Mu'nis fue intenso cuando le trajeron el cuerpo {cite:tabari-tarikh-abu-al-fadl j.11 p.148} {cite:tabari-tarikh-abu-al-fadl j.11 p.152}. Según al-Suyuti, la mayoría de las tropas de Mu'nis eran bereberes; cuando los dos bandos se encontraron, un bereber golpeó a al-Muqtadir con una lanza de modo que cayó al suelo, luego lo mató con una espada, levantó su cabeza en una lanza, le quitó la ropa y lo dejó expuesto hasta que fue cubierto con hierba; Se cavó una tumba en el lugar y fue enterrado, el miércoles, tres días antes del final de Shawwal del año 320 {cite:tarikh-khulafa-minhaj-1434 p. 593}. Según al-Mas'udi, murió en la batalla entre él y Mu'nis el sirviente en la puerta de Shammasiya en el lado oriental, el miércoles, tres noches antes del final de Shawwal del año 320, a la hora de la oración de la tarde; la gente común lo enterró. Al-Fadl ibn Ja'far al-Ta'li' calculó la hora astrológica para su salida y la llamó mediodía, por lo que al-Muqtadir frunció el ceño y deseó no salir hasta que los jinetes de Mu'nis aparecieran sobre él {cite:muruj-al-dhahab p. 649,661-662}. Según Ibn al-Athir, salió contra su voluntad, con juristas y recitadores delante de él portando copias conocidas del Corán, vistiendo el manto (burda), con gente a su alrededor. Se paró en un montículo alto lejos de la batalla mientras sus comandantes le enviaban pidiéndole una y otra vez que avanzara; cuando lo presionaron, avanzó desde la vanguardia, pero sus hombres habían huido antes de que los alcanzara. Había proclamado que quien trajera un prisionero recibiría diez dinares y quien trajera una cabeza recibiría cinco. Cuando sus hombres huyeron, Ali ibn Baliq, uno de los compañeros de Mu'nis, lo encontró, desmontó, besó el suelo y dijo: '¿Adónde vas? Regresa'. Cuando intentó regresar, un grupo de magharibas y bereberes lo alcanzaron y desenvainaron sus espadas. Dijo: '¡Ay de vosotros, yo soy el califa!' Dijeron: 'Te conocemos, vagabundo; eres el califa de Iblis. Pagarás cinco dinares por cada cabeza y diez por cada prisionero.' Uno de ellos lo golpeó en el hombro con su espada y cayó al suelo; algunos lo masacraron. Al-Muqtadir era corpulento y grande; alzaron su cabeza en un poste, gritando 'Dios es el más grande' y maldiciéndolo, le quitaron toda la ropa hasta los pantalones y lo dejaron expuesto hasta que un hombre de los kurdos pasó y lo cubrió con hierba; luego cavaron una tumba en el lugar, lo enterraron y nivelaron la tumba. Mu'nis había estado en al-Rashidiya y no había presenciado la batalla; cuando le trajeron la cabeza de al-Muqtadir, lloró, se golpeó la cara y la cabeza y dijo: 'Corruptores, esto no es de lo que os acusé. Lo habéis matado, y este fue el fin de sus asuntos. ¡Por Dios, todos moriremos!' Lo que hizo Mu'nis envalentonó a los comandantes provinciales contra los califas y los hizo codiciar cosas que jamás habían imaginado; El temor se disolvió y la autoridad del califato se debilitó {cite:kamil-ibn-al-athir p. 180-181}. Según Ibn al-Jawzi, salió a caballo el miércoles, tres noches antes del final de Shawwal del año 320, y pasó por la calle hacia su tienda, vistiendo una túnica plateada y un turbante negro, con el manto sobre sus hombros, estandartes de realeza delante de él, y un grupo de comandantes a su alrededor sosteniendo copias del Corán; la gente le invocó bendiciones. Entonces comenzó la batalla. Entre los bereberes de Mu'nis rodearon a al-Muqtadir, y un hombre lo golpeó por la espalda con un golpe que lo derribó al suelo. Dijo: 'Yo soy el califa'. El hombre dijo: 'Por tu Señor, es a ti a quien busco', lo acostó y lo mató con la espada, levantó su cabeza en una espada y luego en un poste, y lo despojó de sus ropas hasta que uno de los campesinos pasó y lo cubrió con hierba. Cavaron una tumba en el lugar y enterraron su cuerpo sin cabeza en el Barqa de al-Shammasiya, junto a la aldea de Yahya. Su cabeza fue llevada a Mu'nis. Tenía treinta y ocho años, un mes y cinco días, y fue asesinado a la cuarta hora. Su califato duró veinticuatro años, once meses y catorce días, de los cuales dos días y tres deposiciones, durante las cuales fue destituido del califato antes de ser restituido {cite:muntazam-ibn-al-jawzi p. 535}."
  fr: "Au mois de Shawwal de l'an 320, Mu'nis partit de Mossoul en direction de Bagdad. La bataille entre les deux armées eut lieu à al-Shammasiya, où al-Muqtadir trouva la mort. Al-Tabari rapporte que le chagrin de Mu'nis fut immense lorsqu'on lui apporta le corps {cite:tabari-tarikh-abu-al-fadl j.11 p.148} {cite:tabari-tarikh-abu-al-fadl j.11 p.152}. Selon al-Suyuti, la plupart des troupes de Mu'nis étaient berbères. Lors de la rencontre des deux camps, un Berbère frappa al-Muqtadir d'une lance, le faisant tomber à terre, puis l'acheva d'un coup d'épée, planta sa tête sur une lance, le dépouilla de ses vêtements et le laissa à découvert jusqu'à ce que l'herbe le recouvre. Une tombe fut creusée à cet endroit et il y fut enterré le mercredi, trois jours avant la fin du mois de Shawwal de l'an 320 (cite: tarikh-khulafa-minhaj-1434 p. 593). Selon al-Mas'udi, il fut tué lors du combat qui l'opposa à Mu'nis, le serviteur, à la porte de Shammasiya, à l'est, le mercredi, trois nuits avant la fin du mois de Shawwal de l'an 320, à l'heure de la prière de l'après-midi; le peuple l'inhuma. Al-Fadl ibn Ja'far al-Ta'li' consulta l'horoscope pour déterminer l'heure de sa sortie et la fixa à midi. Al-Muqtadir fronça les sourcils et préféra ne pas sortir avant que les cavaliers de Mu'nis n'apparaissent au-dessus de lui (cite: muruj-al-dhahab p. 649, 661-662). Selon Ibn al-Athir, il partit contre son gré, précédé de juristes et de récitants portant des exemplaires connus du Coran, vêtu de la burda, entouré de gens. Il se tenait sur une haute butte, loin du champ de bataille, tandis que ses commandants l'exhortaient sans cesse à avancer. Pressé par leurs demandes, il s'avança en tête, mais ses hommes avaient déjà pris la fuite. Il avait proclamé que quiconque ramènerait un prisonnier recevrait dix dinars et quiconque ramènerait une tête, cinq. Lorsque ses hommes eurent fui, Ali ibn Baliq, un des compagnons de Mu'nis, le rencontra, descendit de cheval, baisa le sol et lui dit: « Où vas-tu ? Rebrousse chemin. » Alors qu'il tentait de rebrousser chemin, un groupe de Magharibas et de Berbères le rattrapa et dégaina leurs épées. Il s'écria: « Malheur à vous ! Je suis le calife ! » Ils répondirent: « Nous te reconnaissons, vagabond ! Tu es le calife d'Iblis ! » « Vous payez cinq dinars par tête et dix par prisonnier. » L'un d'eux le frappa à l'épaule de son épée et il tomba à terre; certains l'égorgeèrent. Al-Muqtadir était corpulent et imposant; ils dressèrent sa tête sur une pique en criant « Dieu est le plus grand ! » et en le maudissant, le dépouillèrent de tout ce qu'il portait jusqu'à son pantalon et le laissèrent exposé jusqu'à ce qu'un Kurde passe et le recouvre d'herbe; ils creusèrent ensuite une tombe à cet endroit, l'enterrèrent et la nivelèrent. Mu'nis se trouvait à al-Rashidiya et n'avait pas assisté à la bataille; lorsqu'on lui apporta la tête d'al-Muqtadir, il pleura, se frappa le visage et la tête et dit: « Ô corrompus, ce n'est pas pour cela que je vous ai accusés. Vous l'avez tué, et c'est la fin de son histoire. Par Dieu, nous allons tous mourir ! » L'acte de Mu'nis enhardit les commandants provinciaux contre les califes et les rendit avides de choses qu'ils n'avaient jamais imaginées. La crainte se dissipa et l'autorité du califat s'affaiblit (voir Kamil Ibn al-Athir, p. 180-181). Selon Ibn al-Jawzi, le calife sortit à cheval le mercredi, trois nuits avant la fin de Shawwal 320, et traversa la rue en direction de sa tente, vêtu d'une robe d'argent et d'un turban noir, le manteau sur les épaules, les bannières royales déployées devant lui, entouré d'un groupe de commandants tenant des exemplaires du Coran; la foule le bénit. Puis la bataille commença. Parmi les Berbères de Mu'nis, ils encerclèrent al-Muqtadir, et un homme le frappa par derrière d'un coup qui le fit tomber à terre. Il s'écria: « Je suis le calife ! » L'homme dit: « Par ton Seigneur, c'est toi que je recherche ! » Il le coucha à terre et l'égorgea d'un coup d'épée. Sa tête fut dressée sur une épée puis sur un pieu, et il fut dévêtu jusqu'à ce qu'un valet de ferme passe et le recouvre d'herbe. On creusa une tombe à cet endroit et on enterra son corps décapité à la Barqa d'al-Shammasiya, près du village de Yahya. Sa tête fut emportée à Mu'nis. Il avait trente-huit ans, un mois et cinq jours, et il fut tué à la quatrième heure. Son califat avait duré vingt-quatre ans, onze mois et quatorze jours, dont deux jours et trois destitutions, durant lesquelles il fut démis de ses fonctions avant d'être rétabli (cf. Muntazam ibn al-Jawzi, p. 535)."
