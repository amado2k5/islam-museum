id: event/abd-al-rahman-enters-andalus
class: event
kind: founding
label: { ar: "دخول عبد الرحمن الداخل الأندلس", en: "The Entry of Abd al-Rahman al-Dakhil into al-Andalus", fr: "L’entrée d’Abd al-Rahman al-Dakhil en al-Andalus", es: "La entrada de Abd al-Rahman al-Dakhil en al-Andalus", ur: "عبد الرحمن الدخیل کا اندلس میں داخلہ", tr: "Abdülrahman I'in Endülüs'e girişi", id: "Masuknya Abd al-Rahman I ke Andalusia" }
summary:
  ar: "في سنة ثمان وثلاثين ومئة دخل عبد الرحمن بن معاوية بن هشام بن عبد الملك المرواني الأموي إلى الأندلس واستولى عليها وامتدت أيامه وبقيت الأندلس في يد أولاده إلى بعد الأربع مئة، وكان من أهل العلم والعدل وأمه بربرية فكانوا يقولون ملك الدنيا ابنا بربريتين المنصور وعبد الرحمن بن معاوية، وفي سنة ثمان وأربعين لم يبق خارجاً عن المنصور سوى جزيرة الأندلس فإنها غلب عليها عبد الرحمن لكنه لم يتلقب بأمير المؤمنين بل بالأمير فقط وكذلك بنوه {cite:tarikh-khulafa-minhaj-1434 p. 423-425}."
  en: "In year 138 Abd al-Rahman ibn Muawiya ibn Hisham the Umayyad entered al-Andalus and seized it; his days extended and al-Andalus remained in his descendants' hands past the year 400. A man of learning and justice whose mother was Berber, they said: 'The world is ruled by two sons of Berber women — al-Mansur and Abd al-Rahman ibn Muawiya.' By year 148 nothing lay outside al-Mansur's sway but al-Andalus, held by Abd al-Rahman, who did not take the title Commander of the Faithful but only amir — as did his sons {cite:tarikh-khulafa-minhaj-1434 p. 423-425}."
  fr: "En l’an 138, l’Omeyyade Abd al-Rahman ibn Muawiya ibn Hisham entra en al-Andalus et s’en empara ; son règne se prolongea et al-Andalus resta aux mains de ses descendants au-delà de l’an 400. Homme de savoir et de justice, né d’une mère berbère, il inspirait cette parole : « Le monde est gouverné par deux fils de femmes berbères : al-Mansur et Abd al-Rahman ibn Muawiya ». En l’an 148, seul al-Andalus échappait à l’autorité d’al-Mansur ; son maître Abd al-Rahman ne prit pas le titre de Commandeur des croyants mais seulement celui d’émir, tout comme ses fils {cite:tarikh-khulafa-minhaj-1434 p. 423-425}."
  es: "En el año 138, Abd al-Rahman ibn Muawiya ibn Hisham, el Omeya, entró en al-Ándalus y la conquistó; sus días se prolongaron y al-Ándalus permaneció en manos de sus descendientes más allá del año 400. Hombre de gran erudición y justicia, cuya madre era bereber, se decía: «El mundo está gobernado por dos hijos de mujeres bereberes: al-Mansur y Abd al-Rahman ibn Muawiya». Para el año 148, nada escapaba al dominio de al-Mansur salvo al-Ándalus, en manos de Abd al-Rahman, quien no adoptó el título de Comandante de los Creyentes, sino solo el de emir, al igual que sus hijos {cite:tarikh-khulafa-minhaj-1434 p. 423-425}."
  ur: "سنہ 138 میں عبدالرحمٰن بن معاویہ بن ہشام اموی اندلس میں داخل ہوا اور اس پر قبضہ کر لیا۔ اس کے دن بڑھتے گئے اور 400 تک الاندلس اس کی اولاد کے ہاتھ میں رہا۔ ایک علم اور انصاف پسند آدمی جس کی ماں بربر تھی، وہ کہتے تھے: 'دنیا پر بربر عورتوں کے دو بیٹوں المنصور اور عبدالرحمٰن بن معاویہ کی حکومت ہے۔' سن 148 تک المنصور کے اقتدار سے باہر کچھ بھی نہیں تھا سوائے الاندلس کے، جس کا قبضہ عبدالرحمٰن کے پاس تھا، جس نے وفاداروں کا کمانڈر نہیں بلکہ صرف امیر کا لقب نہیں لیا تھا - جیسا کہ اس کے بیٹوں نے لکھا تھا۔ 423-425}۔"
  tr: "138 yılında Abdülrahman ibn Muaviye ibn Hişam ibn Abdülmalik el-Mervani el-Umavi, Endülüs'e girdi ve orayı ele geçirdi. Saltanatı uzun sürdü ve Endülüs, 400 yılından sonrasına kadar oğullarının elinde kaldı. O, ilim ve adalet sahibi bir adamdı ve annesi Berberiydi. Berberi kadınlardan doğan iki oğul, el-Mansur ve Abdülrahman ibn Muaviye'nin dünyayı yönettiği söylenirdi. 48 yılında, Abdülrahman'ın fethettiği Endülüs adası dışında el-Mansur'un kontrolü dışında hiçbir şey kalmamıştı. Ancak, o Müminlerin Komutanı unvanını almadı, sadece Emir unvanını aldı, oğulları da aynı şekilde. {cite:tarikh-khulafa-minhaj-1434 s. 423-425}"
  id: "Pada tahun 138, Abd al-Rahman ibn Muawiyah ibn Hisham ibn Abd al-Malik al-Marwani al-Umawi memasuki Andalusia dan merebutnya. Pemerintahannya berlangsung lama, dan Andalusia tetap berada di tangan putra-putranya hingga setelah tahun 400. Ia adalah seorang yang berilmu dan adil, dan ibunya adalah seorang Berber. Konon, kedua putra dari wanita Berber, al-Mansur dan Abd al-Rahman ibn Muawiyah, memerintah dunia. Pada tahun 48, tidak ada yang tersisa di luar kendali al-Mansur kecuali pulau Andalusia, yang ditaklukkan oleh Abd al-Rahman. Namun, ia tidak mengambil gelar Amirul Mukminin, melainkan hanya gelar Emir, begitu pula putra-putranya. {cite:tarikh-khulafa-minhaj-1434 p. 423-425}"
