id: event/rashid-accusation-sermon-jalal-bukhari
class: event
kind: other
label:
  ar: "اتهام رشيد الدين في مجلس وعظ جلال الدين البخاري"
  en: "Accusation against Rashid al-Din at a sermon of Jalal al-Din Bukhari"
  ur: "جلال الدین بخاری کے وعظ میں رشید الدین پر الزام"
  fr: "Accusation contre Rashid al-Din lors d'un sermon de Jalal al-Din Bukhari"
  es: "Acusación contra Rashid al-Din en un sermón de Jalal al-Din Bujari"
summary:
  ar: "بحسب رواية رشيد الدين نفسه في مقدمة جامع التواريخ، دفع رجل حاسد، لم يسمّه الكتاب، إلى أحد الحاضرين جملاً نسبها إلى المؤلف ليسأل عنها الإمام جلال الدين البخاري في مجلس وعظه، فاستنكرها البخاري. ثم قرأ الكتاب فسحب إنكاره وأثنى عليه. ولما استُدعي الرجل أمام ذوي الشأن أنكر أقواله، فانتهى الاجتماع دون نتيجة. فجمع العلماء مذكرة فنّدت الاتهامات بنداً بنداً، ووصفوا الطاعن بالنجاسة والكفر، وطلبوا أن تُلحق برسالة المؤلف {cite:jami-al-tawarikh-khashshab-1960 p. 187}{cite:jami-al-tawarikh-khashshab-1960 p. 188}{cite:jami-al-tawarikh-khashshab-1960 p. 189}. وهذه رواية المؤلف تُنسب إليه، ولا يقف عليها المتحف في هذه الصفحات من مصدر مستقل."
  en: "In Rashid al-Din's own account, given in the preface to the Jami al-Tawarikh, a jealous man whom the book does not name handed some sentences attributed to the author to a listener, who was to put them to Imam Jalal al-Din Bukhari at a sermon. Bukhari disowned them. After reading the book he withdrew his remark and praised it. Summoned before notable people, the accuser denied his words and the meeting ended without a result. The scholars then drew up a memorandum that answered the charges one by one, called the accuser impure and an unbeliever, and asked that it be placed with the author's treatise {cite:jami-al-tawarikh-khashshab-1960 p. 187}{cite:jami-al-tawarikh-khashshab-1960 p. 188}{cite:jami-al-tawarikh-khashshab-1960 p. 189}. This is the author's account and is attributed to him; no independent source for it is read on these pages."
  ur: "رشید الدین کے اپنے بیان کے مطابق، جو جامع التواریخ کے دیباچے میں ہے، ایک حاسد شخص، جس کا نام کتاب میں نہیں، مصنف سے منسوب چند جملے ایک حاضر شخص کو دے گیا تاکہ وہ امام جلال الدین بخاری سے وعظ کے دوران ان کے بارے میں پوچھے۔ بخاری نے ان سے لاتعلقی ظاہر کی۔ کتاب پڑھنے کے بعد انہوں نے اپنا اعتراض واپس لیا اور کتاب کی تعریف کی۔ معززین کے سامنے طلب کیے جانے پر الزام لگانے والے نے اپنے الفاظ سے انکار کیا، اور اجلاس بغیر نتیجے کے ختم ہوا۔ پھر علما نے ایک مذکرہ تیار کیا جس میں الزامات کا ایک ایک کر کے جواب دیا گیا، طعن کرنے والے کو ناپاک اور کافر کہا گیا، اور اسے مصنف کی تحریر کے ساتھ شامل کرنے کی درخواست کی گئی {cite:jami-al-tawarikh-khashshab-1960 p. 187}{cite:jami-al-tawarikh-khashshab-1960 p. 188}{cite:jami-al-tawarikh-khashshab-1960 p. 189}۔ یہ مصنف کا بیان ہے اور اسی سے منسوب ہے؛ ان صفحات میں اس کی کوئی آزاد تصدیق درج نہیں۔"
  fr: "Selon le récit de Rashid al-Din lui-même, dans la préface du Jami al-Tawarikh, un homme envieux, que le livre ne nomme pas, remit à un auditeur des phrases attribuées à l'auteur afin qu'il les soumette à l'imam Jalal al-Din Bukhari lors d'un sermon. Bukhari les désavoua. Après avoir lu le livre, il retira sa remarque et en fit l'éloge. Convoqué devant des personnalités, l'accusateur nia ses propos et la réunion s'acheva sans résultat. Les savants rédigèrent alors un mémoire qui répondait aux accusations point par point, qualifiait l'accusateur d'impur et d'infidèle, et demandait qu'il soit joint au traité de l'auteur {cite:jami-al-tawarikh-khashshab-1960 p. 187}{cite:jami-al-tawarikh-khashshab-1960 p. 188}{cite:jami-al-tawarikh-khashshab-1960 p. 189}. Il s'agit du récit de l'auteur, qui en est responsable ; aucune source indépendante n'est lue sur ces pages."
  es: "Según el relato del propio Rashid al-Din, en el prefacio del Jami al-Tawarikh, un hombre envidioso, a quien el libro no nombra, entregó a un oyente unas frases atribuidas al autor para que las planteara al imán Jalal al-Din Bujari durante un sermón. Bujari las desautorizó. Tras leer el libro retiró su objeción y elogió la obra. Citado ante personas notables, el acusador negó sus palabras y la reunión terminó sin resultado. Los sabios redactaron entonces un memorial que respondía a las acusaciones punto por punto, calificaba al acusador de impuro e incrédulo y pedía que se uniera al tratado del autor {cite:jami-al-tawarikh-khashshab-1960 p. 187}{cite:jami-al-tawarikh-khashshab-1960 p. 188}{cite:jami-al-tawarikh-khashshab-1960 p. 189}. Es el relato del autor, atribuido a él; no se lee aquí ninguna fuente independiente que lo confirme."
