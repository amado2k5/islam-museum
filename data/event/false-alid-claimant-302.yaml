label: { ar: "مدعي نسب الرضا العلوي", en: "The claimant to descent from al-Rida the Alid", es: "El que afirma descender de al-Rida el Alid", fr: "Le prétendant à la descendance d'al-Rida l'Alid", ur: "الریدہ الید سے نزول کا دعویدار", tr: "El-Rida El-Alawi'nin soyundan geldiğini iddia ediyor.", id: "Mengklaim keturunan Al-Rida Al-Alawi" }
summary:
  ar: "في ذي القعدة سنة اثنتين وثلاثمائة دخل رجل إلى المقتدر بالله وادعى أنه ابن الرضا العلوي، فكُشف عن حاله فصحّ أنه ابن الضبعي، فشُهر في الجانبين وحُبس {cite:muntazam-ibn-al-jawzi p. 420}."
  en: "In Dhu'l-Qa'da 302 a man was brought before al-Muqtadir claiming descent from al-Rida the Alid; unmasked as a son of al-Dab'i, he was paraded on both sides of the city and jailed {cite:muntazam-ibn-al-jawzi p. 420}."
  es: "En Dhu'l-Qa'da 302, un hombre fue llevado ante al-Muqtadir afirmando descender de al-Rida el Alid; al ser desenmascarado como hijo de al-Dab'i, fue exhibido en ambos lados de la ciudad y encarcelado {cite:muntazam-ibn-al-jawzi p. 420}."
  fr: "En Dhu'l-Qa'da 302, un homme fut amené devant al-Muqtadir prétendant descendre d'al-Rida l'Alide; démasqué comme fils d'al-Dab'i, il fut exhibé des deux côtés de la ville et emprisonné {cite:muntazam-ibn-al-jawzi p. 420}."
  ur: "ذوالقعدہ 302 میں ایک شخص کو مقتدیر کے سامنے لایا گیا جس کا دعویٰ تھا کہ وہ الریدہ الید سے تعلق رکھتا ہے۔ الدبی کے بیٹے کے طور پر بے نقاب، اسے شہر کے دونوں طرف پریڈ کیا گیا اور جیل بھیج دیا گیا 420}۔"
  tr: "302 yılının Zilhicce ayında, Muktadir Billah'a bir adam girdi ve Rıza el-Alavi'nin oğlu olduğunu iddia etti. Ancak durumu ortaya çıktı ve Dabi'nin oğlu olduğu kanıtlandı. Bunun üzerine her iki tarafça da kötü şöhret kazandı ve hapse atıldı. {Kaynak: Muntazam ibn el-Cevzi, s. 420}"
  id: "Pada bulan Dzul Qa'dah tahun tiga ratus dua, seorang pria mendatangi Al-Muqtadir Billah dan mengaku sebagai putra Al-Rida Al-Alawi, namun keadaan sebenarnya terungkap dan terbukti bahwa ia adalah putra Al-Dab'i, sehingga ia menjadi terkenal di kedua belah pihak dan dipenjara {kutipan:muntazam-ibn-al-jawzi hlm. 420}."
