id: "event/al-hadi-tells-the-story-of-the-people-of-moses-and-balaam-ibn-baura-after-295"
class: event
kind: other
label:
  ar: "الهادي يروي قصة قوم موسى وبلعم بن باعوراء، بعد 295هـ، ص385"
  en: "Al-Hadi tells the story of the people of Moses and Balaam ibn Ba'ura, after 295 AH, p. 385"
  ur: "ہادی موسیٰ کی قوم اور بلعم بن باعوراء کا قصہ سناتا ہے، 295ھ کے بعد، ص385"
  es: "Al-Hadi narra la historia del pueblo de Moisés y Balaam ibn Ba'ura, después del año 295 AH, pág. 385."
  fr: "Al-Hadi raconte l'histoire du peuple de Moïse et de Balaam ibn Ba'ura, après 295 AH, p. 385"
  tr: "El-Hadi, Hicri 295 yılından sonra Musa ve Beor bintli Balaam kavminin hikayesini anlatır (s. 385)."
  id: "Al-Hadi meriwayatkan kisah kaum Musa dan Balaam bin Beor, setelah tahun 295 H, hlm. 385."
summary:
  ar: "يروي الهادي لأصحابه قصة قوم موسى وبلعم بن باعوراء، فيقر القوم بأن انقلابهم كان لسوء فعلهم."
  en: "Al-Hadi tells his companions the story of the people of Moses and of Balaam ibn Ba'ura, and they accept that their turning back was the fault of their own deeds."
  ur: "ہادی اپنے ساتھیوں کو موسیٰ کی قوم اور بلعم بن باعوراء کا قصہ سناتا ہے، اور ساتھی مانتے ہیں کہ ان کا پیٹھ پھیرنا ان کے اپنے عمل کا نتیجہ تھا۔"
  es: "Al-Hadi relata a sus compañeros la historia del pueblo de Moisés y de Balaam ibn Ba'ura, y ellos aceptan que su arrepentimiento fue culpa de sus propios actos."
  fr: "Al-Hadi raconte à ses compagnons l'histoire du peuple de Moïse et de Balaam ibn Ba'ura, et ils reconnaissent que leur retour en arrière était dû à leurs propres actes."
  tr: "El-Hadi, arkadaşlarına Musa ve Beor bintli Balaam kavminin hikayesini anlatır ve kavim, isyanlarının kötü amellerinden kaynaklandığını kabul eder."
  id: "Al-Hadi menceritakan kepada para sahabatnya kisah kaum Musa dan Balaam bin Beor, dan kaum itu mengakui bahwa pemberontakan mereka disebabkan oleh perbuatan buruk mereka."
