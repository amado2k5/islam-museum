id: event/forelock-in-shaytans-hand
class: event
kind: other
label:
  ar: "من رفع رأسه قبل الإمام ناصيته بيد شيطان"
  en: "Whoever raises his head before the imam — his forelock is in a shaytan's hand"
  ur: "جو Imam سے پہلے سر اٹھائے اس کی پیشانی شیطان کے ہاتھ میں"
  es: "Quien levante la cabeza ante el imán, su mechón de pelo está en manos de un demonio."
  fr: "Quiconque lève la tête devant l'imam, sa mèche de cheveux est entre les mains d'un démon."
  tr: "İmamın huzurunda başını kaldıran kimsenin alnı şeytanın elindedir."
  id: "Barang siapa mengangkat kepalanya di hadapan Imam, maka dahinya berada di tangan setan."
summary:
  ar: "يذكر الموطأ عن أبي هريرة أن النبي قال «الذي يرفع رأسه ويخفضه قبل الإمام فإنما ناصيته بيد شيطان» {cite:muwatta-maruf-1997} [[passage/muwatta-1-245|الموطأ 245]]."
  en: "Al-Muwatta relates from Abu Hurayra that the Prophet said 'whoever raises his head and lowers it before the imam — his forelock is only in a shaytan's hand' {cite:muwatta-maruf-1997} [[passage/muwatta-1-245|Muwatta 245]]."
  ur: "موطأ میں ابو ہریرہ سے آیا ہے کہ نبی نے کہا «جو شخص امام سے پہلے اپنا سر اٹھائے اور اتارے تو اس کی پیشانی صرف شیطان کے ہاتھ میں ہے» {cite:muwatta-maruf-1997} [[passage/muwatta-1-245|موطأ 245]]۔"
  es: "Al-Muwatta relata de Abu Hurayra que el Profeta dijo: \"Quien levanta la cabeza y la baja ante el imán, su mechón de pelo está solo en manos de un shaytan\" {cite:muwatta-maruf-1997} [[passage/muwatta-1-245|Muwatta 245]]."
  fr: "Al-Muwatta rapporte d'après Abu Hurayra que le Prophète a dit: « Quiconque lève la tête et la baisse devant l'imam, sa mèche de cheveux n'est que dans la main d'un shaytan » {cite:muwatta-maruf-1997} [[passage/muwatta-1-245|Muwatta 245])."
  tr: "El-Muvatta’, Ebu Hurayra’dan rivayetle Peygamber’in şöyle buyurduğunu bildirir: “İmamın önünde başını kaldırıp indiren kimsenin alnındaki saç tutamı şeytanın elindedir.” {cite:muwatta-maruf-1997} [[passage/muwatta-1-245|El-Muvatta’ 245]]."
  id: "Al-Muwatta’ meriwayatkan dari Abu Hurairah bahwa Nabi bersabda, “Barang siapa yang mengangkat kepalanya lalu menundukkannya di hadapan Imam, maka ubun-ubunnya berada di tangan setan.” {cite:muwatta-maruf-1997} [[passage/muwatta-1-245|Al-Muwatta’ 245]]."
