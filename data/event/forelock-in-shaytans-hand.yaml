id: event/forelock-in-shaytans-hand
class: event
kind: other
label:
  ar: "من رفع رأسه قبل الإمام ناصيته بيد شيطان"
  en: "Whoever raises his head before the imam — his forelock is in a shaytan's hand"
  ur: "جو Imam سے پہلے سر اٹھائے اس کی پیشانی شیطان کے ہاتھ میں"
summary:
  ar: "يذكر الموطأ عن أبي هريرة أن النبي قال «الذي يرفع رأسه ويخفضه قبل الإمام فإنما ناصيته بيد شيطان» {cite:muwatta-maruf-1997} [[passage/muwatta-1-245|الموطأ 245]]."
  en: "Al-Muwatta relates from Abu Hurayra that the Prophet said 'whoever raises his head and lowers it before the imam — his forelock is only in a shaytan's hand' {cite:muwatta-maruf-1997} [[passage/muwatta-1-245|Muwatta 245]]."
  ur: "موطأ میں ابو ہریرہ سے آیا ہے کہ نبی نے کہا «جو شخص امام سے پہلے اپنا سر اٹھائے اور اتارے تو اس کی پیشانی صرف شیطان کے ہاتھ میں ہے» {cite:muwatta-maruf-1997} [[passage/muwatta-1-245|موطأ 245]]۔"
