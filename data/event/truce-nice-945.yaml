summary:
  ar: "الهدنة التي عُقدت في محرم ٩٤٥هـ/يونيو ١٥٣٨م بين شارل الخامس وفرنسا لمدة عشر سنوات، فساد هدوء نسبي القارة الأوروبية مكّن شارل من التفرغ لحملته على الجزائر سنة ١٥٤١م. النص المطبوع في الكتاب يقرأ «١٣٥٨م» وهو ظاهر التصحيف عن ١٥٣٨ {cite:dawlat-uthmaniyya-salabi p. 224}."
  en: "The ten-year truce between Charles V and France, Muharram 945/June 1538, whose calm let Charles turn to the 1541 Algiers campaign. The printed text reads '1358', plainly a misprint for 1538 {cite:dawlat-uthmaniyya-salabi p. 224}."
  es: "La tregua de diez años entre Carlos V y Francia, Muharram 945/junio de 1538, cuya calma permitió a Carlos emprender la campaña de Argel de 1541. El texto impreso dice «1358», claramente un error tipográfico en lugar de 1538 {cite:dawlat-uthmaniyya-salabi p. 224}."
  fr: "La trêve de dix ans entre Charles Quint et la France, conclue en Muharram 945/juin 1538, permit à Charles de se consacrer à la campagne d'Alger de 1541. Le texte imprimé indique « 1358 », une erreur manifeste pour 1538 {cite: dawlat-uthmaniyya-salabi p. 224}."
  ur: "چارلس پنجم اور فرانس کے درمیان دس سالہ جنگ بندی، محرم 945/جون 1538، جس کے سکون نے چارلس کو 1541 کی الجزائر مہم کا رخ کرنے دیا۔ مطبوعہ متن میں '1358' لکھا گیا ہے، جو صاف طور پر 1538 کی غلط پرنٹ ہے {حوالہ:دولت عثمانیہ صلابی صفحہ 224}۔"
