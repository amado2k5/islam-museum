label: { ar: "الزلزلة العظيمة بسواحل الشام سنة 811هـ", en: "The great Levantine coast earthquake, 811" }
summary:
  ar: "في عاشر شعبان سنة إحدى عشرة وثمانمائة جاءت زلزلة عظيمة في نواحي بلاد حلب وطرابلس قرب اللاذقية وجبلة وبلدان أماكن عديدة، وسقطت قلعة بلاطنس فمات تحت الردم خمسة عشر نفساً، وخرب شغر بكاس كلها وقلعتها ومات جميع أهلها إلا عشرين نفساً، وانتقلت بلد قدر ميل بأشجارها وأبنيتها وأهلها لم يُسعَروا بذلك، وخُرب من قبرص أماكن كثيرة، وشوهد بلح على رأس الجبل الأقرع وقد نزل البحر وطلع وبينه وبين البحر عشرة فراسخ، وذكر أهل البحر أن المراكب في البحر المالح وصلت إلى الأرض لما انحسر البحر ثم عاد الماء كما كان، قاله ابن حجر {cite:shadharat-dhahab p. 97}."
  en: "10 Sha'ban 811 — a great earthquake from Aleppo's region to Tripoli, Latakia and Jabla: Balatanus castle fell, Shughr Bakas destroyed with all but twenty of its people, a whole town carried a mile on a landslip with its trees and folk unharmed, Cyprus damaged, and the sea drew back ten parasangs stranding ships before it returned {cite:shadharat-dhahab p. 97}."
