class: event
kind: disaster-relief
label: { ar: "الزلزلة العظيمة بسواحل الشام سنة 811هـ", en: "The great Levantine coast earthquake, 811", es: "El gran terremoto de la costa levantina, 811", fr: "Le grand tremblement de terre de la côte levantine, 811", ur: "عظیم لیونٹائن ساحلی زلزلہ، 811" }
summary:
  ar: "في عاشر شعبان سنة إحدى عشرة وثمانمائة جاءت زلزلة عظيمة في نواحي بلاد حلب وطرابلس قرب اللاذقية وجبلة وبلدان أماكن عديدة، وسقطت قلعة بلاطنس فمات تحت الردم خمسة عشر نفساً، وخرب شغر بكاس كلها وقلعتها ومات جميع أهلها إلا عشرين نفساً، وانتقلت بلد قدر ميل بأشجارها وأبنيتها وأهلها لم يُسعَروا بذلك، وخُرب من قبرص أماكن كثيرة، وشوهد بلح على رأس الجبل الأقرع وقد نزل البحر وطلع وبينه وبين البحر عشرة فراسخ، وذكر أهل البحر أن المراكب في البحر المالح وصلت إلى الأرض لما انحسر البحر ثم عاد الماء كما كان، قاله ابن حجر {cite:shadharat-dhahab p. 97}."
  en: "10 Sha'ban 811 — a great earthquake from Aleppo's region to Tripoli, Latakia and Jabla: Balatanus castle fell, Shughr Bakas destroyed with all but twenty of its people, a whole town carried a mile on a landslip with its trees and folk unharmed, Cyprus damaged, and the sea drew back ten parasangs stranding ships before it returned {cite:shadharat-dhahab p. 97}."
  es: "10 Sha'ban 811 — un gran terremoto desde la región de Alepo hasta Trípoli, Latakia y Jabla: el castillo de Balatanus se derrumbó, Shughr Bakas fue destruido con todos sus habitantes excepto veinte, una ciudad entera fue arrastrada una milla por un deslizamiento de tierra con sus árboles y gente ilesos, Chipre sufrió daños y el mar retrocedió diez parasangs varando barcos antes de regresar {cite:shadharat-dhahab p. 97}."
  fr: "10 Sha'ban 811 — un grand tremblement de terre de la région d'Alep à Tripoli, Lattaquié et Jabla: le château de Balatanus s'est effondré, Shughr Bakas a été détruite avec tous ses habitants sauf vingt, une ville entière a été emportée sur un mile par un glissement de terrain avec ses arbres et ses habitants indemnes, Chypre a été endommagée et la mer a retiré dix parasangs échouant des navires avant de revenir {cite:shadharat-dhahab p. 97}."
  ur: "10 شعبان 811 - حلب کے علاقے سے لے کر طرابلس، لطاکیہ اور جبلہ تک ایک زبردست زلزلہ: بلاطانوس کا قلعہ گر گیا، شغر بکاس اپنے بیس کے علاوہ تمام لوگوں کو لے کر تباہ ہو گیا، ایک پورا قصبہ اپنے درختوں اور عوام کو نقصان نہ پہنچانے کے ساتھ لینڈ سلپ پر ایک میل کا فاصلہ طے کر گیا، قبرص کو نقصان پہنچا، اور دس سمندری بحری جہاز واپس لوٹنے سے پہلے ہی واپس لوٹ گئے۔ {حوالہ: شدھارت ذہاب ص۔ 97}۔"
