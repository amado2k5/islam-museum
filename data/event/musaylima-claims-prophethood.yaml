perspectives:
  - tradition: sunni
    id: medinan-account
    stance: { ar: "حضر مستوراً بالثياب وسأل فردّه النبي" }
    summary: { ar: "يروي ابن إسحاق عن بعض علماء أهل المدينة أن بني حنيفة أتت به النبي تستره بالثياب، فكلّمه وسأله، فقال له النبي: لو سألتني هذا العسيب ما أعطيتكه." }
    sources: [source/ibn-hisham-saqqa]
  - tradition: sunni
    id: hanafi-account
    stance: { ar: "خُلّف في الرحال ولم يحضر" }
    summary: { ar: "يروي ابن إسحاق عن شيخ من بني حنيفة من أهل اليمامة أن الوفد خلّفوه في رحالهم، فلما أسلموا ذكروه فأمر له النبي بمثل ما أمر للقوم وقال: ليس بشركم مكاناً، فاحتج مسيلمة بذلك بعدُ؛ ويعلّق ابن إسحاق: فالله أعلم أي ذلك كان." }
    sources: [source/ibn-hisham-saqqa]
  - tradition: sunni
    id: mubarakpuri
    stance: { ar: "ترجيح الاستنكاف وعدم الحضور" }
    summary: { ar: "يرجّح المباركفوري أن مسيلمة استنكف وطمح إلى الإمارة ولم يحضر مع سائر الوفد، وأن النبي أراد استمالته بالإحسان أولاً." }
    sources: [source/mubarakpuri-raheeq]
  - tradition: academic
    id: academic
    summary: { ar: "يقرأ المؤرخون المحدثون مسيلمة زعيماً دينياً قبلياً حاولت به اليمامة حفظ استقلالها عن المركز الجديد في المدينة؛ مرجع أكاديمي محدد لهذا التلخيص لم يُضف بعد (needs_source)." }
    sources: [source/tabari-donner-1993]
