id: event/musaylima-claims-prophethood
class: event
kind: other
label: { ar: "ارتداد مسيلمة وادعاؤه النبوة باليمامة", en: "Musaylima's apostasy and claim to prophethood at al-Yamama" }
summary:
  ar: "لما رجع وفد بني حنيفة إلى اليمامة ارتد مسيلمة وادعى النبوة وقال إنه قد أُشرك في الأمر مع محمد، واحتج بقول النبي عنه «ليس بشركم مكاناً»، وجعل يسجع لهم أساجيع مضاهاة للقرآن، وأحل لهم الخمر والزنا ووضع عنهم الصلاة، وهو يشهد لمحمد بالنبوة، فأجمعت معه حنيفة. يروي ابن إسحاق الخبر عن شيخ من بني حنيفة ويعلّق: فالله أعلم أي ذلك كان."
  en: "When the Banu Hanifa delegation returned to al-Yamama, Musaylima apostatised and claimed prophethood, saying he had been made a partner in the matter with Muhammad and citing the Prophet's words that he was 'not the worst placed of you'. He produced rhymed sayings imitating the Qur'an, permitted wine and fornication and lifted the prayer, while still testifying that Muhammad was a prophet, and Hanifa rallied to him. Ibn Ishaq has it from a shaykh of Banu Hanifa and adds: God knows best which account is true."
