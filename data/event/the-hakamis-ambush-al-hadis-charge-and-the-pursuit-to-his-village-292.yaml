id: event/the-hakamis-ambush-al-hadis-charge-and-the-pursuit-to-his-village-292
class: event
kind: other
label:
  ar: "خروج كمين الحكمي وأمر الهادي بالحملة وطرد القوم إلى قرية الحكمي، ص297"
  en: "The Hakami's ambush comes out, al-Hadi orders the charge and the pursuit to the Hakami's village, p. 297"
  ur: "حکمی کی گھات کا نکلنا، ہادی کا حملے کا حکم اور حکمی کی بستی تک تعاقب، ص297"
summary:
  ar: "يخرج كمين للحكمي على الهادي وليس معه إلا هؤلاء النفر وقد انهزم أصحابه وحال العدو بينه وبينهم، فيأمر الهادي بالحملة ويطعن رجلاً فيرمي به، وينهزم القوم ويتبعهم، ثم يصيح صائح بأن أصحاب الهادي عطفوا، فينهزم من كان يطرد أصحابه، ويستمر الطرد إلى قرية الحكمي ويلحق الهادي نحو مئتين من أصحابه؛ وتنتهي الصفحة بتنبيه المحقق إلى بياض في الأصل."
  en: "An ambush of the Hakami's comes out on al-Hadi, who has with him only these men, his companions having been routed and the enemy standing between them; al-Hadi orders the charge, thrusts a man and throws him, the people are routed and he follows them, and then a crier cries that al-Hadi's companions have turned back, so those pursuing them flee and the chase goes on until near the Hakami's village, nearly two hundred of his men joining al-Hadi; the page ends with the editor's note on a blank in the original."
  ur: "حکمی کی ایک گھات ہادی پر نکلتی ہے جب کہ ان کے ساتھ صرف یہی چند آدمی ہیں، ان کے ساتھی پسپا ہو چکے ہیں اور دشمن ان کے اور ان کے درمیان حائل ہے؛ ہادی حملے کا حکم دیتے ہیں، ایک آدمی کو نیزہ مار کر گرا دیتے ہیں، لوگ بھاگتے ہیں اور وہ ان کا پیچھا کرتے ہیں؛ پھر ایک پکارنے والا پکارتا ہے کہ ہادی کے ساتھی پلٹ آئے، تو ان کے ساتھیوں کا پیچھا کرنے والے بھاگ جاتے ہیں اور تعاقب حکمی کی بستی کے قریب تک جاتا ہے، اور تقریباً دو سو ساتھی ہادی سے آ ملتے ہیں؛ صفحہ محقق کے اس نوٹ پر ختم ہوتا ہے کہ اصل میں جگہ خالی ہے۔"
