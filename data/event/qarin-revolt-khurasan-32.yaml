label: { ar: "خروج قارن بخراسان (32هـ)" }
summary:
  ar: "جمع قارن جمعاً كثيراً من ناحية الطبسين وأهل باذغيس وهراة وقوهستان وأقبل في أربعين ألفاً؛ فتنازع قيس بن الهيثم وعبد الله بن خازم الأمر — وأخرج ابن خازم كتاباً كان قد افتعله بأنه أمير خراسان إذا كانت حرب — وسار ابن خازم إلى قارن في أربعة آلاف وأمر الناس فحملوا الودك وأدرجوا على زج الرماح خرقاً وقطناً ودهاناً ثم أشعلوا فيها النيران، فناوشتهم مقدمته نصف الليل ورأى المشركون النيران يمنة ويسرة تتقدم وتتأخر فهالهم، ثم غشيهم ابن خازم فقتل قارن وانهزم المشركون وأصابوا سبياً كثيراً، وكتب بالفتح إلى ابن عامر فأقره على خراسان {cite:kamil-ibn-al-athir p. 507 v.2}. وهذا الخبر في أوله لا يوجد إلا في تاريخ خليفة {cite:kamil-ibn-al-athir p. 507 n.3}."
  en: "Qarin's rising in Khurasan (AH 32): forty thousand from Tabasayn, Badghis, Herat and Quhistan — against them Abdallah ibn Khazim marched with four thousand, wrapping spearheads in oiled cotton and firing them in a midnight feint until the host broke; the ruse won him Ibn Amir's confirmation over all Khurasan {cite:kamil-ibn-al-athir v.2 p. 507}."
