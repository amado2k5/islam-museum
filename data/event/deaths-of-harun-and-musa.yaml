id: event/deaths-of-harun-and-musa
class: event
kind: death
label:
  ar: وفاة هارون وموسى في التيه وقبر موسى عند الكثيب الأحمر
  en: Deaths of Harun and Musa in the Tih and the grave by the red dune
  ur: ہارون اور موسیٰ کی تیہ میں وفات اور سرخ ٹیلے کے پاس قبرِ موسیٰ
summary:
  ar: يروي ابن كثير أن هارون مات أولاً في التيه، وأن موسى بعده، وفي الصحيحين حديث مجيء ملك الموت إلى موسى ثم موته وطلبه الدنو من الأرض المقدسة رمية بحجر وقول النبي إن قبره عند الكثيب الأحمر {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 529} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531}؛ أما رواية السرير والبيت وموت هارون ورواية الريح السوداء ويوشع فيصفها ابن كثير بأن فيها نكارة وغرابة {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 532}.
  en: Ibn Kathir reports that Harun died first in the Tih and Musa after him; the Sahihs have the hadith of the angel of death coming to Musa, his death, his request to be brought near the Holy Land by a stone's throw and the Prophet's statement that his grave is by the red dune {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 529} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531}; the bed-and-house report of Harun's death and the black wind report with Yusha' are described by Ibn Kathir as having something objectionable and strange {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 532}.
  ur: ابن کثیر بتاتے ہیں کہ ہارون تیہ میں پہلے فوت ہوئے اور موسیٰ ان کے بعد؛ صحیحین میں ملک الموت کے موسیٰ کے پاس آنے، ان کی وفات، ارضِ مقدس کے قریب پتھر کی دوری تک پہنچانے کی دعا اور نبی کے اس فرمان کی حدیث ہے کہ ان کی قبر سرخ ٹیلے کے پاس ہے {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 529} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531}؛ ہارون کی وفات کا پلنگ اور گھر والا بیان اور کالی آندھی و یوشع والی روایت کو ابن کثیر ناپسندیدگی اور اجنبیت والی کہتے ہیں {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 532}۔
