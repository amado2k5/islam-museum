id: event/deaths-of-harun-and-musa
class: event
kind: death
label:
  ar: وفاة هارون وموسى في التيه وقبر موسى عند الكثيب الأحمر
  en: Deaths of Harun and Musa in the Tih and the grave by the red dune
  ur: ہارون اور موسیٰ کی تیہ میں وفات اور سرخ ٹیلے کے پاس قبرِ موسیٰ
  es: "Muertes de Harún y Musa en Tih y la tumba junto a la duna roja."
  fr: "Morts d'Harun et de Musa dans le Tih et la tombe près de la dune rouge"
  tr: "Harun ve Musa'nın çölde ölümü ve Musa'nın Kızıl Kum Tepesi'ndeki mezarı"
  id: "Kematian Harun dan Musa di padang gurun, dan makam Musa di Bukit Pasir Merah."
summary:
  ar: يروي ابن كثير أن هارون مات أولاً في التيه، وأن موسى بعده، وفي الصحيحين حديث مجيء ملك الموت إلى موسى ثم موته وطلبه الدنو من الأرض المقدسة رمية بحجر وقول النبي إن قبره عند الكثيب الأحمر {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 529} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531}؛ أما رواية السرير والبيت وموت هارون ورواية الريح السوداء ويوشع فيصفها ابن كثير بأن فيها نكارة وغرابة {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 532}.
  en: Ibn Kathir reports that Harun died first in the Tih and Musa after him; the Sahihs have the hadith of the angel of death coming to Musa, his death, his request to be brought near the Holy Land by a stone's throw and the Prophet's statement that his grave is by the red dune {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 529} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531}; the bed-and-house report of Harun's death and the black wind report with Yusha' are described by Ibn Kathir as having something objectionable and strange {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 532}.
  ur: ابن کثیر بتاتے ہیں کہ ہارون تیہ میں پہلے فوت ہوئے اور موسیٰ ان کے بعد؛ صحیحین میں ملک الموت کے موسیٰ کے پاس آنے، ان کی وفات، ارضِ مقدس کے قریب پتھر کی دوری تک پہنچانے کی دعا اور نبی کے اس فرمان کی حدیث ہے کہ ان کی قبر سرخ ٹیلے کے پاس ہے {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 529} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531}؛ ہارون کی وفات کا پلنگ اور گھر والا بیان اور کالی آندھی و یوشع والی روایت کو ابن کثیر ناپسندیدگی اور اجنبیت والی کہتے ہیں {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 532}۔
  es: "Ibn Kathir informa que Harun murió primero en el Tih y Musa después de él; los Sahihs tienen el hadiz del ángel de la muerte viniendo a Musa, su muerte, su petición de ser llevado cerca de la Tierra Santa por un tiro de piedra y la declaración del Profeta de que su tumba está junto a la duna roja {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 529} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531}; el informe de la casa y la cama de la muerte de Harun y el informe del viento negro con Yusha' son descritos por Ibn Kathir como algo objetable y extraño {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 532}."
  fr: "Ibn Kathir rapporte que Harun mourut le premier dans le Tih et Musa après lui; les Sahihs contiennent le hadith de l’ange de la mort venant à Musa, sa mort, sa demande d’être conduit près de la Terre Sainte à un jet de pierre et la déclaration du Prophète selon laquelle sa tombe se trouve près de la dune rouge {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 529} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531}; le récit de la mort de Harun concernant le lit et la maison, ainsi que le récit du vent noir avec Yusha’, sont décrits par Ibn Kathir comme ayant quelque chose d’objectible et d’étrange {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 532}."
  tr: "İbn Kathir, Harun'un çölde ilk önce öldüğünü ve Musa'nın ondan sonra öldüğünü rivayet eder. İki Sahih'te de Azrail'in Musa'ya gelmesi, ardından ölümü ve kutsal topraklara bir taş atımı kadar yaklaştırılma isteği ile Peygamber'in kabrinin kırmızı kum tepesinin yakınında olduğunu söylemesi hakkında bir hadis vardır {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 529} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531}; yatak, ev, Harun'un ölümü ve kara rüzgar ile Yeşu rivayetlerine gelince, İbn Kathir bunları garip ve tuhaf olarak nitelendirir {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531} {alıntı:qisas-al-anbiya-ibn-kathir-iqra-ebook tarama s. 532}."
  id: "Ibn Kathir meriwayatkan bahwa Harun meninggal terlebih dahulu di padang gurun, dan Musa meninggal setelahnya. Dalam dua kitab Sahih terdapat hadits tentang Malaikat Maut yang datang kepada Musa, kemudian kematiannya, dan permintaannya untuk dibawa lebih dekat ke Tanah Suci sejauh lemparan batu, dan sabda Nabi bahwa kuburnya berada di dekat bukit pasir merah {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 529} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531}; adapun riwayat tentang tempat tidur dan rumah serta kematian Harun dan riwayat tentang angin hitam dan Yosua, Ibn Kathir menggambarkannya sebagai sesuatu yang aneh dan ganjil {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 531} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 532}."
