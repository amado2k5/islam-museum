label: { en: "Ali's judgment on three men who lay with one woman in one purity", ar: "قضاء علي في ثلاثة وقعوا على امرأة في طهر واحد", es: "El juicio de Ali sobre tres hombres que se acostaron con una mujer en un acto de pureza.", fr: "Le jugement d'Ali sur trois hommes qui ont couché avec une même femme dans une même pureté", ur: "علی کا فیصلہ تین مردوں کے بارے میں جنہوں نے ایک عورت کے ساتھ ایک ہی پاکیزگی میں صحبت کی۔", tr: "Ali, aynı dönemde bir kadınla cinsel ilişkiye giren üç erkeğin davasında hüküm verdi.", id: "Ali memutuskan perkara tiga pria yang berhubungan intim dengan seorang wanita selama masa suci mereka." }
summary:
  en: "Three men lay with one woman in the same purity period in Yemen. Ali asked two at a time whether they claimed the child, and when neither would, he drew lots and gave the child to the one the lot named, with two-thirds of the diyya. The Prophet laughed and approved; the book notes that the men's act may have been before their Islam."
  ar: "وقع ثلاثة من الرجال على امرأة في طهر واحد في اليمن، فسألهم علي اثنين اثنين هل يقران بالولد، فأبيا، ثم أقرع بينهم، فألحق الولد بمن صارت عليه القرعة، وجعل عليه ثلثي الدية؛ فضحك النبي فرحاً بتوفيق علي للصواب ولم ينكره، ويحتمل الكتاب أن يكون ذلك قبل إسلامهم."
  es: "Tres hombres yacían con una mujer durante el mismo período de pureza en Yemen. Alí preguntó a dos de ellos, uno por uno, si reclamaban al niño, y como ninguno lo hizo, echó suertes y le dio el niño al que salió elegido, junto con dos tercios de la dote. El Profeta rió y aprobó; el libro señala que este acto pudo haber ocurrido antes de que los hombres se convirtieran al Islam."
  fr: "Au Yémen, trois hommes eurent des relations sexuelles avec une femme durant leur période de pureté. Ali demanda à deux d'entre eux, tour à tour, s'ils reconnaissaient l'enfant. Comme aucun ne le faisait, il tira au sort et confia l'enfant à celui désigné par le sort, avec les deux tiers de la diyya. Le Prophète rit et approuva. Le livre précise que cet acte pourrait avoir eu lieu avant leur conversion à l'islam."
  ur: "یمن میں ایک ہی طہارت میں تین مرد ایک عورت کے ساتھ لیٹ گئے۔ علی نے ایک وقت میں دو سے پوچھا کہ کیا انہوں نے بچے کا دعویٰ کیا ہے، اور جب کوئی نہیں کرے گا، تو اس نے قرعہ ڈالا اور بچے کو جس کا نام قرعہ دیا، دو تہائی دیہ کے ساتھ دیا۔ نبی ہنسے اور منظور فرمایا۔ کتاب نوٹ کرتی ہے کہ مردوں کا یہ عمل ان کے اسلام سے پہلے ہو سکتا ہے۔"
  tr: "Yemen'de üç erkek, aynı adet döneminde bir kadınla cinsel ilişkiye girdi. Ali, onlara ikişer ikişer çocuğu kabul edip etmeyeceklerini sordu, ancak kabul etmediler. Bunun üzerine aralarında kura çekti ve kura çıkan kişiye çocuğu verdi ve kan parasının üçte ikisini ona ödetti. Peygamber, Ali'nin doğru tahminde bulunmasından dolayı sevinçle güldü ve bunu inkar etmedi. Bu olayın İslam'ı kabul etmelerinden önce gerçekleşmiş olması mümkündür."
  id: "Tiga pria berhubungan intim dengan seorang wanita selama satu periode menstruasi di Yaman. Ali bertanya kepada mereka berdua-dua apakah mereka akan mengakui anak tersebut, tetapi mereka menolak. Kemudian ia mengundi di antara mereka, dan ia memberikan anak itu kepada orang yang namanya terundi, dan membuatnya membayar dua pertiga dari uang darah. Nabi tertawa gembira atas keberhasilan Ali dalam membuktikan kebenarannya dan tidak menyangkalnya. Ada kemungkinan bahwa peristiwa ini terjadi sebelum mereka masuk Islam."
