id: event/ali-judgment-three-men-one-tuhr
class: event
kind: other
label: { en: "Ali's judgment on three men who lay with one woman in one purity", ar: "قضاء علي في ثلاثة وقعوا على امرأة في طهر واحد" }
summary:
  en: "Three men lay with one woman in the same purity period in Yemen. Ali asked two at a time whether they claimed the child, and when neither would, he drew lots and gave the child to the one the lot named, with two-thirds of the diyya. The Prophet laughed and approved; the book notes that the men's act may have been before their Islam."
  ar: "وقع ثلاثة من الرجال على امرأة في طهر واحد في اليمن، فسألهم علي اثنين اثنين هل يقران بالولد، فأبيا، ثم أقرع بينهم، فألحق الولد بمن صارت عليه القرعة، وجعل عليه ثلثي الدية؛ فضحك النبي فرحاً بتوفيق علي للصواب ولم ينكره، ويحتمل الكتاب أن يكون ذلك قبل إسلامهم."
