label: { ar: "مقتل بغا الشرابي", en: "The killing of Bugha al-Sharabi", es: "El asesinato de Bugha al-Sharabi", fr: "L'assassinat de Bugha al-Sharabi", ur: "بغضاء الشرابی کا قتل", tr: "Bugha el-Şerabi'nin öldürülmesi", id: "Pembunuhan Bugha al-Sharabi" }
summary:
  ar: "في سنة أربع وخمسين ومائتين قُتل بغا الشرابي، وأمر المعتز بإحضار رأسه، فقتله وليد المغربي {cite:tabari-tarikh-abu-al-fadl j.9 p.379} {cite:tabari-tarikh-abu-al-fadl j.9 p.380}."
  en: "In the year 254 Bugha al-Sharabi was killed. Al-Mu'tazz ordered that his head be brought, and Walid al-Maghribi killed him {cite:tabari-tarikh-abu-al-fadl j.9 p.379} {cite:tabari-tarikh-abu-al-fadl j.9 p.380}."
  es: "En el año 254 fue asesinado Bugha al-Sharabi. Al-Mu'tazz ordenó que le trajeran la cabeza y Walid al-Maghribi lo mató {cita:tabari-tarikh-abu-al-fadl j.9 p.379} {cita:tabari-tarikh-abu-al-fadl j.9 p.380}."
  fr: "En 254, Bugha al-Sharabi fut tué. Al-Mu'tazz a ordonné que sa tête soit amenée, et Walid al-Maghribi l'a tué {cite:tabari-tarikh-abu-al-fadl j.9 p.379} {cite:tabari-tarikh-abu-al-fadl j.9 p.380}."
  ur: "سنہ 254 میں بغض الشرابی مارا گیا۔ المعتز نے اس کا سر لانے کا حکم دیا اور ولید المغربی نے اسے قتل کر دیا {حوالہ: طبری تاریخ ابو الفضل ج.9 ص379}"
  tr: "İki yüz elli dördüncü yılda Bugha el-Şerabi öldürüldü ve el-Mu'tezz onun başının getirilmesini emretti, bunun üzerine Walid el-Mağribi onu öldürdü."
  id: "Pada tahun dua ratus lima puluh empat, Bugha al-Sharabi terbunuh, dan al-Mu’tazz memerintahkan agar kepalanya dibawa, lalu Walid al-Maghribi membunuhnya."
