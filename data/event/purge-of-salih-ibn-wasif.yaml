label: { ar: "استتار صالح بن وصيف وتتبّع القواد والكتاب" }
summary:
  ar: "في سنة ست وخمسين ومائتين أصبح الناس وقد استتر صالح بن وصيف، وذكر الطبري القواد الكبار والكتاب الذين استُبروا في تلك الفتنة، وأُطلق الحسن بن مخلد من حبس دار صالح {cite:tabari-tarikh-abu-al-fadl j.9 p.440}. وعند المسعودي خاف موسى بن بغا أن يكون صالح يعمل الحيلة عليهم في حال اختفائه فبث في طلبه العيون حتى وقع عليه فقاتل ومانع فقتل واحتز رأسه، وقيل أحمي له حمام فمات فيه {cite:muruj-al-dhahab p. 559}"
