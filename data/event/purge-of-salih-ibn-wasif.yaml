id: event/purge-of-salih-ibn-wasif
class: event
kind: other
label: { ar: "استتار صالح بن وصيف وتتبّع القواد والكتاب", en: "The disappearance of Salih ibn Wasif and the hunt for the commanders and secretaries" }
summary:
  ar: "في سنة ست وخمسين ومائتين أصبح الناس وقد استتر صالح بن وصيف، وذكر الطبري القواد الكبار والكتاب الذين استُبروا في تلك الفتنة، وأُطلق الحسن بن مخلد من حبس دار صالح {cite:tabari-tarikh-abu-al-fadl j.9 p.440}. وعند المسعودي خاف موسى بن بغا أن يكون صالح يعمل الحيلة عليهم في حال اختفائه فبث في طلبه العيون حتى وقع عليه فقاتل ومانع فقتل واحتز رأسه، وقيل أحمي له حمام فمات فيه {cite:muruj-al-dhahab p. 559}"
  en: "In 256 the people woke to find that Salih ibn Wasif had gone into hiding. Al-Tabari names the senior commanders and secretaries who were put under inquiry in that turmoil, and al-Hasan ibn Makhlad was released from the confinement in Salih's house {cite:tabari-tarikh-abu-al-fadl j.9 p.440}. According to al-Mas'udi, Musa ibn Bugha feared that Salih was devising a scheme against them while in hiding, so he sent agents to hunt him down until they came upon him; he fought back and resisted, was killed and his head was cut off. It was also said that a bath was heated for him and he died in it {cite:muruj-al-dhahab p. 559}."
