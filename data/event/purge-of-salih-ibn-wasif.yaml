id: event/purge-of-salih-ibn-wasif
class: event
kind: other
label: { ar: "استتار صالح بن وصيف وتتبّع القواد والكتاب", en: "The disappearance of Salih ibn Wasif and the hunt for the commanders and secretaries", es: "La desaparición de Salih ibn Wasif y la búsqueda de los comandantes y secretarios.", fr: "La disparition de Salih ibn Wasif et la traque des commandants et des secrétaires", ur: "صالح بن واصف کی گمشدگی اور کمانڈروں اور سیکرٹریوں کی تلاش", tr: "Salih bin Vasif saklandı ve komutanları ve kâtipleri takip etti.", id: "Saleh bin Wasif bersembunyi dan mengejar para komandan dan ahli Taurat." }
summary:
  ar: "في سنة ست وخمسين ومائتين أصبح الناس وقد استتر صالح بن وصيف، وذكر الطبري القواد الكبار والكتاب الذين استُبروا في تلك الفتنة، وأُطلق الحسن بن مخلد من حبس دار صالح {cite:tabari-tarikh-abu-al-fadl j.9 p.440}. وعند المسعودي خاف موسى بن بغا أن يكون صالح يعمل الحيلة عليهم في حال اختفائه فبث في طلبه العيون حتى وقع عليه فقاتل ومانع فقتل واحتز رأسه، وقيل أحمي له حمام فمات فيه {cite:muruj-al-dhahab p. 559}"
  en: "In 256 the people woke to find that Salih ibn Wasif had gone into hiding. Al-Tabari names the senior commanders and secretaries who were put under inquiry in that turmoil, and al-Hasan ibn Makhlad was released from the confinement in Salih's house {cite:tabari-tarikh-abu-al-fadl j.9 p.440}. According to al-Mas'udi, Musa ibn Bugha feared that Salih was devising a scheme against them while in hiding, so he sent agents to hunt him down until they came upon him; he fought back and resisted, was killed and his head was cut off. It was also said that a bath was heated for him and he died in it {cite:muruj-al-dhahab p. 559}."
  es: "En el año 256, el pueblo despertó y descubrió que Salih ibn Wasif se había escondido. Al-Tabari menciona a los altos mandos y secretarios que fueron interrogados durante aquel tumulto, y al-Hasan ibn Makhlad fue liberado del confinamiento en la casa de Salih {cite:tabari-tarikh-abu-al-fadl j.9 p.440}. Según al-Mas'udi, Musa ibn Bugha temía que Salih estuviera tramando un plan contra ellos mientras estaba escondido, así que envió agentes para darle caza hasta que lo encontraron; él se resistió, fue asesinado y decapitado. También se dice que le prepararon un baño y murió en él {cite:muruj-al-dhahab p. 559}."
  fr: "En 256, au réveil, le peuple découvrit que Salih ibn Wasif s'était caché. Al-Tabari cite les commandants et secrétaires de haut rang qui furent interrogés durant cette période de troubles, et al-Hasan ibn Makhlad fut libéré de sa détention chez Salih (cite:tabari-tarikh-abu-al-fadl j.9 p.440). Selon al-Mas'udi, Musa ibn Bugha, craignant que Salih ne fomente un complot contre eux durant sa cachette, envoya des agents à sa poursuite. Ils le trouvèrent, mais il se défendit et résista, fut tué et décapité. On raconte également qu'un bain fut chauffé pour lui et qu'il y mourut (cite:muruj-al-dhahab p. 559)."
  ur: "256 میں لوگوں کو یہ معلوم ہوا کہ صالح بن واصف روپوش ہو گیا ہے۔ الطبری نے ان سینئر کمانڈروں اور سیکرٹریوں کے نام بتائے ہیں جن سے اس ہنگامے میں تفتیش کی گئی تھی، اور حسن بن مخلد کو صالح کے گھر کی قید سے رہا کر دیا گیا تھا۔ المسعودی کے مطابق، موسیٰ ابن بغضہ کو خدشہ تھا کہ صالح چھپتے ہوئے ان کے خلاف کوئی تدبیر کر رہا ہے، اس لیے اس نے اس کا شکار کرنے کے لیے ایجنٹ بھیجے یہاں تک کہ وہ اس پر پہنچ گئے۔ اس نے مقابلہ کیا اور مزاحمت کی، مارا گیا اور اس کا سر کاٹ دیا گیا۔ یہ بھی کہا گیا کہ اس کے لیے غسل گرم کیا گیا اور اس میں وہ فوت ہو گئے۔ 559}۔"
  tr: "Hicri 256 yılında, insanlar Salih ibn Wasif'in saklandığını görünce uyandılar. Taberi, bu isyan sırasında soruşturulan üst düzey komutanlar ve kâtiplerden bahsetmiş ve Hasan ibn Mukhallad'ın Salih'in evinde hapsedildiği yerden serbest bırakıldığını belirtmiştir. {Kaynak: Taberi-tarikh-abu-al-fadl cilt 9, s. 440}. Mes'udi'ye göre, Musa ibn Bugha, Salih'in saklandığı sırada kendilerine karşı komplo kuruyor olabileceğinden korktuğu için onu bulmak üzere casuslar gönderdi. Salih savaştı ve direndi, sonunda öldürüldü ve başı kesildi. Ayrıca ona bir hamamda su içirildiği ve orada öldüğü de söylenmektedir. {Kaynak: Muruj-al-dhahab, s. 559}"
  id: "Pada tahun 256 H, orang-orang terbangun dan mendapati bahwa Salih ibn Wasif telah bersembunyi. Al-Tabari menyebutkan para komandan senior dan ahli Taurat yang diselidiki selama pemberontakan itu, dan al-Hasan ibn Mukhallad dibebaskan dari penjara di rumah Salih {cite:tabari-tarikh-abu-al-fadl vol.9 p.440}. Menurut al-Mas'udi, Musa ibn Bugha khawatir bahwa Salih mungkin sedang merencanakan makar terhadap mereka saat bersembunyi, sehingga ia mengirim mata-mata untuk mencarinya hingga mereka menemukannya. Ia berjuang dan melawan hingga terbunuh dan kepalanya dipenggal. Dikatakan juga bahwa ia diberi pemandian untuk minum dan meninggal di sana {cite:muruj-al-dhahab p. 559}."
