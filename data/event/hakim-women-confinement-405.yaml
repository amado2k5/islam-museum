summary:
  ar: "في سنة خمس وأربعمائة منع الحاكم بأمر الله النساء في مصر من الخروج من بيوتهن أبداً ومن دخول الحمّامات، وأبطل صنعة الخفاف لهن، وقتل عدة نسوة خالفن أمره وغرّق جماعة من العجائز {cite:shadharat-dhahab p. 173}."
  en: "In 405 al-Hakim bi-Amr Allah forbade the women of Egypt ever to leave their houses or enter the bathhouses, abolished women's shoemaking so they could not be shod for the street, and had several women who defied the order killed and a group of old women drowned {cite:shadharat-dhahab p. 173}."
