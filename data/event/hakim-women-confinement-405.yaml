id: event/hakim-women-confinement-405
class: event
kind: law-enacted
label: { ar: "الحاكم يمنع نساء مصر من الخروج", en: "Al-Hakim Forbids the Women of Egypt to Go Out", es: "Al-Hakim prohíbe a las mujeres de Egipto salir a la calle.", fr: "Al-Hakim interdit aux femmes d'Égypte de sortir", ur: "الحکیم نے مصر کی عورتوں کو باہر جانے سے منع کیا ہے۔", tr: "Vali, Mısırlı kadınların dışarı çıkmasını yasakladı.", id: "Gubernur melarang perempuan Mesir untuk keluar rumah." }
summary:
  ar: "في سنة خمس وأربعمائة منع الحاكم بأمر الله النساء في مصر من الخروج من بيوتهن أبداً ومن دخول الحمّامات، وأبطل صنعة الخفاف لهن، وقتل عدة نسوة خالفن أمره وغرّق جماعة من العجائز {cite:shadharat-dhahab p. 173}."
  en: "In 405 al-Hakim bi-Amr Allah forbade the women of Egypt ever to leave their houses or enter the bathhouses, abolished women's shoemaking so they could not be shod for the street, and had several women who defied the order killed and a group of old women drowned {cite:shadharat-dhahab p. 173}."
  es: "En 405, al-Hakim bi-Amr Allah prohibió a las mujeres de Egipto salir de sus casas o entrar en los baños públicos, abolió la fabricación de calzado femenino para que no pudieran usar zapatos en la calle, e hizo matar a varias mujeres que desafiaron la orden y ahogar a un grupo de ancianas {cite:shadharat-dhahab p. 173}."
  fr: "En 405, al-Hakim bi-Amr Allah interdit aux femmes d'Égypte de quitter leurs maisons ou d'entrer dans les bains publics, abolit la fabrication de chaussures par les femmes afin qu'elles ne puissent pas être chaussées pour la rue, et fit tuer plusieurs femmes qui défiaient l'ordre et noya un groupe de vieilles femmes {cite:shadharat-dhahab p. 173}."
  ur: "405 الحکیم بن عمرو اللہ نے مصر کی عورتوں کو گھر سے نکلنے یا حمام میں جانے سے منع کیا، عورتوں کے جوتے بنانے کو ختم کر دیا تاکہ وہ سڑک پر نہ چل سکیں، اور اس حکم کی خلاف ورزی کرنے والی کئی عورتوں کو قتل کر دیا اور بوڑھی عورتوں کا ایک گروہ ڈوب گیا۔ 173}۔"
  tr: "Hicri 405 yılında El-Hakim bi-Amr, Mısır'daki kadınların evlerinden çıkmalarını ve hamamlara girmelerini yasakladı, onlar için terlik yapma mesleğini ortadan kaldırdı ve emrine karşı gelen birkaç kadını öldürdü, bir grup yaşlı kadını da boğarak öldürdü. {Kaynak: Şadharat-Dhaba, s. 173}"
  id: "Pada tahun 405 H, Al-Hakim bi-Amr Allah melarang perempuan di Mesir untuk meninggalkan rumah mereka dan memasuki pemandian umum, dan dia menghapuskan kerajinan pembuatan sandal untuk mereka, dan dia membunuh beberapa perempuan yang tidak taat pada perintahnya dan menenggelamkan sekelompok perempuan tua {cite:shadharat-dhahab p. 173}."
