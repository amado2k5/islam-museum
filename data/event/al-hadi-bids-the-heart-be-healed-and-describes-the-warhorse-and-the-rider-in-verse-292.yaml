id: event/al-hadi-bids-the-heart-be-healed-and-describes-the-warhorse-and-the-rider-in-verse-292
class: event
kind: other
label:
  ar: "قصيدة للهادي من الكامل: داوِ الفؤاد، ولن تروم شهادة حتى تتيقظ، ووصف الفرس والفارس الذي درس الكتاب، ص323-324"
  en: "A poem of al-Hadi in the kamil metre: heal the heart, you will not seek martyrdom until you wake, and the description of the warhorse and the rider who studied the Book, pp. 323-324"
  ur: "ہادی کی کامل بحر میں نظم: دل کو شفا دو، تم شہادت نہ چاہو گے جب تک نہ جاگو، اور گھوڑے اور اس سوار کا بیان جس نے کتاب پڑھی، ص323-324"
  es: "Un poema de al-Hadi en metro kamil: sana el corazón, no buscarás el martirio hasta que despiertes, y la descripción del caballo de guerra y el jinete que estudió el Libro, págs. 323-324"
summary:
  ar: "قصيدة من الكامل تحت عنوان «وللهادي أيضاً» في ص323: يبدأ بأن يطلب شفاء الفؤاد من الأشجان، ويقول إن المخاطَب لن يطلب شهادة حتى ينتبه من الوسن ويضرم النيران بعد خمودها ويشد سرجه على فرس أدهم قارح، ثم يصف الفرس صفة طويلة في سرعته وقوته، ويقول إن راكبه موتور قد درس الكتاب وجال في أرجائه يبغي الهدى حتى تيقن ما عليه وماله وفرائض الله، فنادى بجهاد ذي الطغيان؛ والأبيات تتصل بما بعدها في ص324-325."
  en: "A poem in the kamil metre under the heading \"and also of al-Hadi\" on p. 323: it opens by asking that the heart be healed of sorrows, says the one addressed will not seek martyrdom until he wakes from drowsiness, kindles fires after they died down and girds his saddle on a dark, full-grown horse, then describes the horse at length in its speed and strength, and says its rider is one with a blood-wrong who has studied the Book and ranged through it seeking guidance until he was certain of what is for and against him and of God's obligations, and so called to jihad against the tyrant; the lines run on into pp. 324-325."
  ur: "کامل بحر میں نظم، عنوان «اور ہادی کی یہ بھی» کے تحت ص323 پر: آغاز اس سے ہوتا ہے کہ دل کو غموں سے شفا ملے، کہتا ہے کہ مخاطب شہادت نہیں چاہے گا جب تک اونگھ سے نہ جاگے، بجھنے کے بعد آگ نہ بھڑکائے اور کالے پورے جوان گھوڑے پر اپنی زین نہ کسے، پھر گھوڑے کو اس کی تیزی اور قوت میں طویل بیان کرتا ہے، اور کہتا ہے کہ اس کا سوار وہ ہے جس پر خون کا مطالبہ ہے، جس نے کتاب پڑھی اور اس میں ہدایت ڈھونڈتا پھرا یہاں تک کہ اسے یقین ہو گیا کہ اس کے حق میں کیا ہے اور اس کے خلاف کیا اور اللہ کے فرائض کیا، سو اس نے سرکش کے خلاف جہاد کی پکار دی؛ اشعار ص324-325 پر جاری رہتے ہیں۔"
  es: "Un poema en metro kamil bajo el título \"y también de al-Hadi\" en la página 323: comienza pidiendo que el corazón sea sanado de las penas, dice que aquel a quien se dirige no buscará el martirio hasta que despierte de su somnolencia, encienda fuegos después de que se hayan apagado y ciña su silla de montar sobre un caballo oscuro y adulto, luego describe al caballo extensamente en su velocidad y fuerza, y dice que su jinete es uno con una injusticia de sangre que ha estudiado el Libro y lo ha recorrido buscando guía hasta que estuvo seguro de lo que está a favor y en contra de él y de las obligaciones de Dios, y por lo tanto llamado a la yihad contra el tirano; los versos continúan en las páginas 324-325."
