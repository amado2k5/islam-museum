label: { ar: "خلع الطائع وبيعة القادر 381هـ", en: "Al-Ta'i' deposed, al-Qadir acclaimed, 381", es: "Al-Ta'i' depuesto, al-Qadir aclamado, 381", fr: "Al-Ta'i' déposé, al-Qadir acclamé, 381", ur: "الطائی معزول، القادر الحدیث، 381", tr: "Ta'i'nin tahttan indirilmesi ve Kadir'e biat edilmesi, Hicri 381", id: "Pencopotan Al-Ta'i dan kesetiaan kepada Al-Qadir, 381 H" }
summary:
  ar: "في رمضان سنة إحدى وثمانين وثلثمائة قبض بهاء الدولة على الخليفة الطائع لله في داره، فلُفّ في كساء وحُمل إلى الخزانة في دار الملكة، وأُنفذ إليه الكتاب بخلع نفسه وتسليمه الأمر إلى القادر بالله فوقّع بذلك، وأقيمت الخطبة باسم القادر، وحُوّل من دار الخلافة جميع ما فيها من الآلات والثياب والأواني والصاغ والفروش والسلاح والخدم والجواري، وطاف بهاء الدولة دار الخلافة مجلساً مجلساً {cite:muntazam-ibn-al-jawzi j.7 p.160-161}. وكان القادر قد هرب إلى البطيحة عند مهذب الدولة أيام الطائع فأقام بها نحو سنتين حتى أُظهر أمره {cite:muntazam-ibn-al-jawzi j.7 p.147-148, 161}."
  en: "In Ramadan 381 Baha' al-Dawla's men seized the caliph al-Ta'i' in his palace, wrapped him in a cloak and carried him to the treasury at Dar al-Mamlaka; the deed of self-deposition ceding the rule to al-Qadir was taken to him and he signed it, the khutba was held in al-Qadir's name, and the whole contents of the caliphal palace — vessels, robes, arms, servants and stores — were carried off while Baha' al-Dawla toured it hall by hall. Al-Qadir had himself been a fugitive in the Batiha with Muhdhib al-Dawla for nearly two years under al-Ta'i' {cite:muntazam-ibn-al-jawzi j.7 p.147-148, 160-161}."
  es: "En Ramadán 381, los hombres de Baha' al-Dawla apresaron al califa al-Ta'i' en su palacio, lo envolvieron en una capa y lo llevaron al tesoro de Dar al-Mamlaka; le entregaron el acta de autodeposición que cedía el poder a al-Qadir, la cual firmó. El sermón se celebró en nombre de al-Qadir, y se llevaron todo el contenido del palacio califal: vasijas, túnicas, armas, sirvientes y provisiones, mientras Baha' al-Dawla lo recorría sala por sala. Al-Qadir había sido fugitivo en la Batiha con Muhdhib al-Dawla durante casi dos años bajo el mando de al-Ta'i' {cite:muntazam-ibn-al-jawzi j.7 p.147-148, 160-161}."
  fr: "En Ramadan 381, les hommes de Baha' al-Dawla s'emparèrent du calife al-Ta'i' dans son palais, l'enveloppèrent dans un manteau et le conduisirent au trésor de Dar al-Mamlaka. L'acte d'abdication, cédant le pouvoir à al-Qadir, lui fut présenté et signé. Le sermon (khutba) fut prononcé au nom d'al-Qadir, et tout le contenu du palais califal – vases, vêtements, armes, serviteurs et provisions – fut emporté tandis que Baha' al-Dawla en faisait le tour, salle par salle. Al-Qadir avait lui-même été un fugitif dans la Batiha avec Muhdhib al-Dawla pendant près de deux ans sous le règne d'al-Ta'i' (voir: Muntazam ibn al-Jawzi, vol. 7, p. 147-148, 160-161)."
  ur: "رمضان 381 میں بہاء الدولہ کے آدمیوں نے خلیفہ الطائی کو اس کے محل میں پکڑ لیا، اسے چادر میں لپیٹ کر دار المملکہ کے خزانے میں لے گئے۔ القادر کے حوالے سے خود کو جمع کرنے کا نامہ اس کے پاس لے جایا گیا اور اس نے اس پر دستخط کر دیے، القادر کے نام پر خطبہ دیا گیا، اور خلیفہ کے محل کا سارا سامان - برتن، لباس، اسلحہ، نوکر اور دکانیں لے جایا گیا جب کہ بہاء الدولہ نے ہال کا دورہ کیا۔ القادر خود بطیحہ میں محذوب الدولہ کے ساتھ الطائی کے تحت تقریباً دو سال تک مفرور رہا تھا۔"
  tr: "Hicri 381 yılının Ramazan ayında Baha' el-Davla, Halife el-Tai'yi evinde yakaladı. Bir pelerine sarılıp Kraliçe'nin sarayındaki hazineye götürüldü. Ona, tahttan feragat etmesi ve iktidarı el-Kadir'e devretmesi emredilen bir mektup gönderildi ve Halife bu mektubu imzaladı. Cuma hutbesi el-Kadir adına kılındı ve Halife'nin sarayından tüm eşyalar, giysiler, mutfak eşyaları, altın, mobilyalar, silahlar, hizmetçiler ve cariyeler çıkarıldı. Baha' el-Davla daha sonra Halife'nin sarayını oda oda gezdi. {cite:muntazam-ibn-al-jawzi j.7 pp.160-161}. El-Kadir, el-Tai'nin hükümdarlığı sırasında Muhaddhib el-Davla ile birlikte el-Batiha'ya kaçmış ve davası ortaya çıkana kadar yaklaşık iki yıl orada kalmıştı. {alıntı:muntazam-ibn-el-cevzi j.7 s.147-148, 161}."
  id: "Pada bulan Ramadan tahun 381 Hijriah, Baha' al-Dawla menangkap Khalifah al-Ta'i di rumahnya. Beliau dibungkus jubah dan dibawa ke perbendaharaan di istana Ratu. Sebuah surat dikirim kepadanya yang memerintahkannya untuk turun takhta dan menyerahkan kekuasaan kepada al-Qadir, yang kemudian ditandatanganinya. Khutbah Jumat disampaikan atas nama al-Qadir, dan semua perabotan, pakaian, peralatan, emas, furnitur, senjata, pelayan, dan budak perempuan dikeluarkan dari istana Khalifah. Baha' al-Dawla kemudian berkeliling istana Khalifah, kamar demi kamar. {cite:muntazam-ibn-al-jawzi j.7 pp.160-161}. Al-Qadir telah melarikan diri ke al-Batiha bersama Muhadhdhib al-Dawla selama pemerintahan al-Ta'i dan tinggal di sana selama sekitar dua tahun hingga perjuangannya terungkap. {kutip:muntazam-ibn-al-jawzi j.7 hal.147-148, 161}."
