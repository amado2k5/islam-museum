id: event/al-hadi-answers-yazid-and-abu-rifaa-and-abu-al-atahiyas-army-appears-288
class: event
label:
  ar: "الهادي يجيب يزيد الشاكري وأبا رفاعة ويظهر عسكر أبي العتاهية، محرم 288هـ"
  en: "Al-Hadi answers Yazid and Abu Rifa'a and Abu al-Atahiya's army appears, Muharram 288 AH"
  ur: "ہادی یزید شاکری اور ابو رفاعہ کو جواب دیتے ہیں اور ابو العتاہیہ کا لشکر نمودار ہوتا ہے، محرم 288ھ"
  es: "Al-Hadi responde a Yazid y Abu Rifa'a, y aparece el ejército de Abu al-Atahiya, Muharram 288 AH."
  fr: "Al-Hadi répond à Yazid et à Abou Rifa'a, et l'armée d'Abou al-Atahiya apparaît. Muharram 288 AH"
  tr: "El-Hadi, Yezid el-Şakiri ve Ebu Rifa'a'ya cevap verir ve Ebu el-Atahiya'nın ordusu ortaya çıkar, Muharrem 288 Hicri"
  id: "Al-Hadi menjawab Yazid al-Shakiri dan Abu Rifa’a, dan pasukan Abu al-Atahiya muncul, Muharram 288 H."
summary:
  ar: "تتمة سؤال يزيد بن علي الشاكري وأبي رفاعة الخثعمي للهادي بحدقان عن قلة عسكره، وجواب الهادي بأن صاحبهم سيلقاه وأنهم داخلون صنعاء غداً، ثم أمره الطبريين أن يتقدموا العسكر، وكان اللواء مع علي بن محمد وقد أعطاه إياه بالحائرة، ثم أشرف عسكر أبي العتاهية بأربعمائة فارس وعشرة آلاف راجل بحسب الراوي."
  en: "The question that Yazid al-Shakiri and Abu Rifa'a put to al-Hadi at Hadaqan is completed: they say he has no army for a war with this man; al-Hadi tells them the man will meet him and they will enter Sana'a the next day; he puts the Tabaris in front, Ali ibn Muhammad carries the banner given at al-Ha'ira, and Abu al-Atahiya's army, four hundred horse and ten thousand foot by the narrator's count, comes into view."
  ur: "یزید شاکری اور ابو رفاعہ کا حدقان میں ہادی سے سوال مکمل ہوتا ہے کہ ان کے پاس اس شخص سے جنگ کے لیے لشکر نہیں؛ ہادی انہیں بتاتے ہیں کہ وہ شخص ان سے ملے گا اور وہ کل صنعاء میں داخل ہوں گے؛ وہ طبریوں کو آگے رکھتے ہیں، علی بن محمد کے پاس وہ جھنڈا ہے جو الحائرہ میں دیا گیا تھا، اور راوی کی گنتی میں چار سو سوار اور دس ہزار پیادوں پر مشتمل ابو العتاہیہ کا لشکر نظر آتا ہے۔"
  es: "La pregunta que Yazid al-Shakiri y Abu Rifa'a le hicieron a al-Hadi en Hadaqan ha concluido: le dijeron que no tenía ejército para una guerra contra ese hombre; al-Hadi les dijo que el hombre se encontraría con él y que entrarían en Sana'a al día siguiente; puso a los Tabaris al frente, Ali ibn Muhammad portaba el estandarte entregado en al-Ha'ira, y el ejército de Abu al-Atahiya, cuatrocientos jinetes y diez mil infantes según el recuento del narrador, apareció a la vista."
  fr: "La question que Yazid al-Shakiri et Abu Rifa'a ont posée à al-Hadi à Hadaqan est résolue: ils disent qu'il n'a pas d'armée pour une guerre contre cet homme; al-Hadi leur dit que l'homme le rencontrera et qu'ils entreront à Sanaa le lendemain; il place les Tabaris en tête, Ali ibn Muhammad porte l'étendard donné à al-Ha'ira, et l'armée d'Abu al-Atahiya, quatre cents cavaliers et dix mille fantassins selon le décompte du narrateur, apparaît."
  tr: "Râtînin anlatımına göre, Yezid bin Ali el-Şakiri ve Ebu Rifa'a el-Hath'ami'nin el-Hadi Hadkan'a ordusunun az sayıda olmasıyla ilgili sorusuna ve el-Hadi'nin arkadaşlarının kendisiyle buluşacağını ve yarın Sana'a'ya gireceklerini söylemesine devam edilmesinin ardından, Teberilere orduyu ilerletmelerini emretti ve sancak Ali bin Muhammed'in elindeydi ve ona el-Haira'da verilmişti; ardından Ebu el-Atahiya'nın ordusu, 400 süvari ve 1000 piyade ile ortaya çıktı."
  id: "Melanjutkan pertanyaan Yazid bin Ali al-Shakiri dan Abu Rifa’a al-Khath’ami kepada al-Hadi Hadqan tentang sedikitnya jumlah pasukannya, dan jawaban al-Hadi bahwa teman mereka akan menemuinya dan mereka akan memasuki Sana’a besok, kemudian dia memerintahkan kaum Tabari untuk memajukan pasukan, dan panji berada di tangan Ali bin Muhammad dan dia telah memberikannya kepadanya di al-Ha’ira, kemudian pasukan Abu al-Atahiya muncul dengan empat ratus penunggang kuda dan sepuluh ribu tentara berjalan kaki menurut perawi."
