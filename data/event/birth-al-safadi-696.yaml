label:
  ar: "ولادة الصفدي بصفد، ٦٩٦هـ"
  en: "Al-Safadi is born at Safad, 696/1297"
  ur: "صفدی کی ولادت صفد میں، 696ھ/1297ء"
summary:
  ar: "وُلد صلاح الدين خليل بن أيبك الصفدي بصفد، دار أهله، سنة ست وتسعين وستمائة تقريباً؛ وكان أبوه الأمير عز الدين أيبك تركي الأصل، ولم يُعنَ بتحصيل ابنه العلم حتى بلغ العشرين فطلبه بنفسه {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88}."
  en: "Salah al-Din Khalil ibn Aybak al-Safadi was born at Safad, his family's home town, about 696/1297; his father, the amir Izz al-Din Aybak, was of Turkic origin and showed no concern for the boy's religious-legal studies until he turned twenty, whereupon the youth sought learning on his own {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88}."
  ur: "صلاح الدین خلیل بن ایبک صفدی تقریباً 696ھ/1297ء میں صفد میں پیدا ہوئے — یہی ان کے خاندان کا وطن تھا؛ ان کے والد امیر عز الدین ایبک ترکی نژاد تھے اور بیٹے کی دینی تعلیم کی فکر اس وقت تک نہ کی جب وہ بیس برس کا ہو گیا، تب نوجوان نے خود علم کی طلب کی {cite:encyclopaedia-of-islam-2 vol. 8 p. 759} {cite:durar-kamina-jil-1993 vol. 2 p. 88}۔"
