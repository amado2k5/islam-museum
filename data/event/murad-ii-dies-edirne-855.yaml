label: { ar: "وفاة مراد الثاني بأدرنة", en: "Murad II dies at Edirne", ur: "مراد ثانی کی ادرنہ میں وفات", es: "Murad II muere en Edirne.", fr: "Murad II meurt à Edirne" }
summary:
  ar: "توفي مراد الثاني في قصره بأدرنة سنة ٨٥٥هـ/١٤٥١م عن عمر يناهز ٤٧ عاماً، ودُفن بجانب جامع المرادية في بورصة بناءً على وصيته، وخلفه ابنه محمد الثاني {cite:dawlat-uthmaniyya-salabi p. 83} {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  en: "Murad II died in his palace at Edirne in 855/1451, aged about 47, and was buried beside the Muradiye mosque in Bursa according to his will; he was succeeded by his son Mehmed II {cite:dawlat-uthmaniyya-salabi p. 83} {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  ur: "مراد ثانی 855ھ/1451ء میں ادرنہ کے اپنے محل میں تقریباً 47 سال کی عمر میں فوت ہوا اور وصیت کے مطابق بورصہ کی مرادیہ مسجد کے پاس دفن کیا گیا؛ اس کے بعد اس کا بیٹا محمد ثانی تخت نشیں ہوا {cite:dawlat-uthmaniyya-salabi p. 83} {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}۔"
  es: "Murad II murió en su palacio de Edirne en 855/1451, a la edad de unos 47 años, y fue enterrado junto a la mezquita Muradiye en Bursa según su testamento; fue sucedido por su hijo Mehmed II {cite:dawlat-uthmaniyya-salabi p. 83} {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  fr: "Murad II mourut dans son palais d'Edirne en 855/1451, à l'âge d'environ 47 ans, et fut enterré à côté de la mosquée Muradiye à Bursa selon son testament; son fils Mehmed II lui succéda {cite:dawlat-uthmaniyya-salabi p. 83} {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
