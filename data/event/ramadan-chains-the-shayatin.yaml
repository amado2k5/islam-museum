id: event/ramadan-chains-the-shayatin
kind: other
label:
  ar: إذا دخل رمضان صُفدت الشياطين
  en: When Ramadan enters, the shayatin are chained
  ur: رمضان آتے ہی شیاطین کو زنجیروں میں پابند کر دیا جاتا ہے
summary:
  ar: 'قال النبي: إذا جاء رمضان فتحت أبواب الجنة وغلقت أبواب النار وصفدت الشياطين {cite:sahih-muslim} [[passage/muslim-1079|مسلم 1079]]؛ وفي الموطأ موقوفاً عن أبي هريرة: إذا دخل رمضان فتحت أبواب الجنة وغلقت أبواب النار وصفدت الشياطين، ويذكر المحقق أن له طرقاً مرفوعة {cite:muwatta-maruf-1997} [[passage/muwatta-4-862|الموطأ 862]].'
  en: 'The Prophet said: when Ramadan comes the gates of Paradise are opened, the gates of the Fire are closed, and the shayatin are chained {cite:sahih-muslim} [[passage/muslim-1079|Muslim 1079]]; in the Muwatta mauquf from Abu Hurayra: when Ramadan enters the gates of Paradise are opened, the gates of the Fire are closed, and the shayatin are chained — the editor notes it has marfu'' routes {cite:muwatta-maruf-1997} [[passage/muwatta-4-862|Muwatta 862]].'
  ur: 'نبی نے کہا: جب رمضان آئے تو جنت کے دروازے کھل جاتے ہیں، آگ کے دروازے بند ہو جاتے ہیں، اور شیاطین کو زنجیروں میں پابند کر دیا جاتا ہے {cite:sahih-muslim} [[passage/muslim-1079|مسلم 1079]]؛ اور موطأ میں ابو ہریرہ سے موقوفاً: جب رمضان داخل ہو تو جنت کے دروازے کھل جاتے ہیں، آگ کے دروازے بند ہو جاتے ہیں، اور شیاطین کو زنجیروں میں پابند کر دیا جاتا ہے — محقق نے ذکر کیا کہ اس کی مرفوعہ راہیں ہیں {cite:muwatta-maruf-1997} [[passage/muwatta-4-862|موطأ 862]]۔'
