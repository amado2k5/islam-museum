id: event/ramadan-chains-the-shayatin
kind: other
label:
  ar: إذا دخل رمضان صُفدت الشياطين
  en: When Ramadan enters, the shayatin are chained
  ur: رمضان آتے ہی شیاطین کو زنجیروں میں پابند کر دیا جاتا ہے
  es: "Cuando llega el Ramadán, los shayatin son encadenados."
  fr: "Lorsque le Ramadan commence, les shayatin sont enchaînés"
  tr: "Ramazan ayı gelince, şeytanlar zincirlenir."
  id: "Saat Ramadan tiba, setan-setan dirantai."
summary:
  ar: 'قال النبي: إذا جاء رمضان فتحت أبواب الجنة وغلقت أبواب النار وصفدت الشياطين {cite:sahih-muslim} [[passage/muslim-1079|مسلم 1079]]؛ وفي الموطأ موقوفاً عن أبي هريرة: إذا دخل رمضان فتحت أبواب الجنة وغلقت أبواب النار وصفدت الشياطين، ويذكر المحقق أن له طرقاً مرفوعة {cite:muwatta-maruf-1997} [[passage/muwatta-4-862|الموطأ 862]].'
  en: 'The Prophet said: when Ramadan comes the gates of Paradise are opened, the gates of the Fire are closed, and the shayatin are chained {cite:sahih-muslim} [[passage/muslim-1079|Muslim 1079]]; in the Muwatta mauquf from Abu Hurayra: when Ramadan enters the gates of Paradise are opened, the gates of the Fire are closed, and the shayatin are chained — the editor notes it has marfu'' routes {cite:muwatta-maruf-1997} [[passage/muwatta-4-862|Muwatta 862]].'
  ur: 'نبی نے کہا: جب رمضان آئے تو جنت کے دروازے کھل جاتے ہیں، آگ کے دروازے بند ہو جاتے ہیں، اور شیاطین کو زنجیروں میں پابند کر دیا جاتا ہے {cite:sahih-muslim} [[passage/muslim-1079|مسلم 1079]]؛ اور موطأ میں ابو ہریرہ سے موقوفاً: جب رمضان داخل ہو تو جنت کے دروازے کھل جاتے ہیں، آگ کے دروازے بند ہو جاتے ہیں، اور شیاطین کو زنجیروں میں پابند کر دیا جاتا ہے — محقق نے ذکر کیا کہ اس کی مرفوعہ راہیں ہیں {cite:muwatta-maruf-1997} [[passage/muwatta-4-862|موطأ 862]]۔'
  es: "El Profeta dijo: cuando llega Ramadán, las puertas del Paraíso se abren, las puertas del Fuego se cierran y los shayatin son encadenados {cite:sahih-muslim} [[passage/muslim-1079|Muslim 1079]]; en el Muwatta mauquf de Abu Hurayra: cuando entra Ramadán, las puertas del Paraíso se abren, las puertas del Fuego se cierran y los shayatin son encadenados — el editor señala que tiene rutas marfu' {cite:muwatta-maruf-1997} [[passage/muwatta-4-862|Muwatta 862]]."
  fr: "Le Prophète a dit: « Lorsque le Ramadan arrive, les portes du Paradis s'ouvrent, les portes de l'Enfer se ferment et les démons sont enchaînés » (Sahil Muslim 1079). Dans le Muwatta mauquf d'Abu Hurayra: « Lorsque le Ramadan arrive, les portes du Paradis s'ouvrent, les portes de l'Enfer se ferment et les démons sont enchaînés » (Muwatta 862). L'éditeur note que ce passage a des voies marfu' (Sahil Muslim 1079)."
  tr: "Peygamberimiz şöyle buyurmuştur: \"Ramazan ayı gelince cennetin kapıları açılır, cehennemin kapıları kapanır ve cinler zincirlenir.\" {sahih müslim} [[Muslim 1079]]; ve Muvatta’da Ebu Hurayra'dan rivayet edildiğine göre: \"Ramazan ayı girince cennetin kapıları açılır, cehennemin kapıları kapanır ve cinler zincirlenir.\" Araştırmacı, bu hadisin Peygamberimize kadar uzanan rivayet zincirlerine sahip olduğunu belirtmektedir. {muvatta-maruf-1997} [[Muvatta 4-862]]"
  id: "Nabi Muhammad SAW bersabda: \"Ketika Ramadan tiba, pintu-pintu Surga dibuka, pintu-pintu Neraka ditutup, dan setan-setan dirantai.\" {cite:sahih-muslim} [[passage/muslim-1079|Muslim 1079]]; dan dalam Al-Muwatta’ diriwayatkan dari Abu Hurairah: \"Ketika Ramadan tiba, pintu-pintu Surga dibuka, pintu-pintu Neraka ditutup, dan setan-setan dirantai.\" Peneliti menyebutkan bahwa hadits ini memiliki sanad yang dapat ditelusuri kembali kepada Nabi Muhammad SAW. {cite:muwatta-maruf-1997} [[passage/muwatta-4-862|Al-Muwatta’ 862]]."
