label: { ar: "استيلاء موسى بن عبد الله بن خازم على الترمذ", en: "Musa ibn Khazim's Seizure of Tirmidh", es: "La toma de Tirmidh por Musa ibn Khazim", fr: "La prise de Tirmidh par Musa ibn Khazim", ur: "موسیٰ بن خزیم کی ترمذی ضبطی۔" }
summary:
  ar: "كان موسى بن عبد الله بن خازم السلمي بالترمذ فأتى سمرقند فأكرمه ملكها طرخون فوثب رجل من أصحابه على رجل من السغد فقتله فأخرجه ومن معه وأتى صاحب كش ثم أتى الترمذ وهو حصن فنزل على دهقان الترمذ وهيأ له طعاماً فلما أكل اضطجع فقال له الدهقان اخرج فقال لست أعرف منزلاً مثل هذا وقاتل أهلها."
  en: "Musa ibn Abdallah ibn Khazim was at Tirmidh; he came to Samarqand where king Tarkhon honored him — until one of his men killed a Sughdian and he was expelled — then to Kish's lord, then back to Tirmidh the fortress. Its dahqan lodged and fed him; when Musa lay down to stay, the dahqan said 'leave', and he answered 'I know no home like this' — and fought its people."
  es: "Musa ibn Abdallah ibn Khazim se encontraba en Tirmidh; llegó a Samarcanda, donde el rey Tarkhon lo honró —hasta que uno de sus hombres mató a un sughdián y fue expulsado—, luego al señor de Kish, y finalmente regresó a la fortaleza de Tirmidh. Su dahqan lo hospedó y le dio de comer; cuando Musa se dispuso a descansar, el dahqan le dijo «vete», y él respondió «no conozco otro hogar como este», y luchó contra sus habitantes."
  fr: "Musa ibn Abdallah ibn Khazim se trouvait à Tirmidh; il se rendit à Samarcande où le roi Tarkhon l'accueillit avec honneur – jusqu'à ce que l'un de ses hommes tue un Sughdien et qu'il soit expulsé – puis auprès du seigneur de Kish, avant de retourner à la forteresse de Tirmidh. Son intendant l'accueillit et le nourrit; lorsque Musa voulut s'y reposer, l'intendant lui dit « pars », et il répondit « Je ne connais pas de demeure pareille » – et il combattit ses habitants."
  ur: "موسیٰ بن عبداللہ بن خزیم ترمذی میں تھے۔ وہ سمرقند آیا جہاں ترخون بادشاہ نے اس کی عزت کی - یہاں تک کہ اس کے آدمیوں میں سے ایک نے ایک صغدی کو قتل کر دیا اور اسے نکال دیا گیا - پھر کیش کے آقا کے پاس، پھر واپس قلعہ ترمذ کی طرف۔ اس کے دہقان نے اسے ٹھہرایا اور کھلایا۔ جب موسیٰ ٹھہرنے کے لیے لیٹ گئے تو دہقان نے کہا 'چلے جاؤ'، اور اس نے جواب دیا 'میں ایسا کوئی گھر نہیں جانتا' - اور وہاں کے لوگوں سے لڑا۔"
