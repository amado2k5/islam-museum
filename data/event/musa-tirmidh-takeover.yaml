summary:
  ar: "كان موسى بن عبد الله بن خازم السلمي بالترمذ فأتى سمرقند فأكرمه ملكها طرخون فوثب رجل من أصحابه على رجل من السغد فقتله فأخرجه ومن معه وأتى صاحب كش ثم أتى الترمذ وهو حصن فنزل على دهقان الترمذ وهيأ له طعاماً فلما أكل اضطجع فقال له الدهقان اخرج فقال لست أعرف منزلاً مثل هذا وقاتل أهلها."
  en: "Musa ibn Abdallah ibn Khazim was at Tirmidh; he came to Samarqand where king Tarkhon honored him — until one of his men killed a Sughdian and he was expelled — then to Kish's lord, then back to Tirmidh the fortress. Its dahqan lodged and fed him; when Musa lay down to stay, the dahqan said 'leave', and he answered 'I know no home like this' — and fought its people."
