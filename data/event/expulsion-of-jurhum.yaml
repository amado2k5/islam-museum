kind: expulsion
label: { en: "The Expulsion of Jurhum from Mecca", ar: "إجلاء جرهم عن مكة" }
summary:
  en: "After some twenty centuries of Jurhumite rule over Mecca, their tyranny over pilgrims and appropriation of the Kaaba’s wealth turns the Adnani clans against them; Khuzaʾa, with Banu Bakr ibn Abd Manaf, expels them in the mid-second century CE — and the departing Jurhumites bury Zamzam and carry off the two golden gazelles and the Black Stone."
  ar: "بعد نحو عشرين قرناً من ولاية جرهم على مكة، أساءوا إلى الوافدين واستحلوا مال الكعبة؛ فاستثارت خزاعة نفرة العدنانيين وقاتلتهم بمعونة بني بكر بن عبد مناف حتى أجلتهم في أواسط القرن الثاني الميلادي، فسدّ الراحلون زمزم ودفنوا فيها غزالي الكعبة الذهبيين وحجر الركن."
