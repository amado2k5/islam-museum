id: event/expulsion-of-jurhum
class: event
kind: expulsion
label: { en: "The Expulsion of Jurhum from Mecca", ar: "إجلاء جرهم عن مكة", es: "La expulsión de Jurhum de La Meca", fr: "L'expulsion de Jurhum de La Mecque", ur: "مکہ سے جرہم کا اخراج", tr: "Jurhum'un Mekke'den sürülmesi", id: "Pengusiran Jurhum dari Mekah" }
summary:
  en: "After some twenty centuries of Jurhumite rule over Mecca, their tyranny over pilgrims and appropriation of the Kaaba’s wealth turns the Adnani clans against them; Khuzaʾa, with Banu Bakr ibn Abd Manaf, expels them in the mid-second century CE — and the departing Jurhumites bury Zamzam and carry off the two golden gazelles and the Black Stone."
  ar: "بعد نحو عشرين قرناً من ولاية جرهم على مكة، أساءوا إلى الوافدين واستحلوا مال الكعبة؛ فاستثارت خزاعة نفرة العدنانيين وقاتلتهم بمعونة بني بكر بن عبد مناف حتى أجلتهم في أواسط القرن الثاني الميلادي، فسدّ الراحلون زمزم ودفنوا فيها غزالي الكعبة الذهبيين وحجر الركن."
  es: "Tras unos veinte siglos de dominio yurhumita sobre La Meca, su tiranía sobre los peregrinos y la apropiación de las riquezas de la Kaaba provocan la hostilidad de los clanes adnani; Khuzaʾa, junto con Banu Bakr ibn Abd Manaf, los expulsa a mediados del siglo II d. C., y los yurhumitas que se marchan entierran a Zamzam y se llevan las dos gacelas doradas y la Piedra Negra."
  fr: "Après une vingtaine de siècles de domination jurhumite sur La Mecque, leur tyrannie envers les pèlerins et l'appropriation des richesses de la Kaaba retournent les clans Adnani contre eux; Khuzaʾa, avec Banu Bakr ibn Abd Manaf, les expulse au milieu du IIe siècle de notre ère — et les Jurhumites qui partent enterrent Zamzam et emportent les deux gazelles d'or et la Pierre Noire."
  ur: "مکہ پر تقریباً بیس صدیوں تک جورومیت کی حکمرانی کے بعد، زائرین پر ان کا ظلم اور کعبہ کی دولت کا اختصاص عدنانی قبیلوں کو ان کے خلاف کر دیتا ہے۔ خزاعہ، بنو بکر بن عبد مناف کے ساتھ، دوسری صدی عیسوی کے وسط میں انہیں ملک بدر کر دیتا ہے - اور روانہ ہونے والے زمزم کو دفن کرتے ہیں اور دو سنہری غزالیں اور حجر اسود کو لے جاتے ہیں۔"
  tr: "Yirmi yüzyıl kadar süren Cürhum'un Mekke üzerindeki egemenliğinden sonra, yeni gelenlere kötü muamele ettiler ve Kâbe'nin parasını onlara helal kıldılar. Bunun üzerine Huzaî, Adnanlıların düşmanlığını kışkırttı ve Beni Bekr bin Abd Manaf'ın yardımıyla onlarla savaştı ve milattan sonra ikinci yüzyılın ortalarında onları kovdu. Ayrılanlar Zemzem kanalını kapattılar ve Kâbe'nin iki altın ceylanını ve köşe taşını oraya gömdüler."
  id: "Setelah sekitar dua puluh abad pemerintahan Jurhum atas Mekah, mereka memperlakukan pendatang baru dengan buruk dan menjadikan uang Ka'bah halal bagi mereka. Maka Khuza'a memprovokasi kebencian kaum Adnaniyah dan memerangi mereka dengan bantuan Bani Bakr bin Abd Manaf hingga mereka mengusir mereka pada pertengahan abad ke-2 Masehi. Orang-orang yang pergi itu membendung Zamzam dan mengubur di dalamnya dua kijang emas Ka'bah dan batu penjuru."
