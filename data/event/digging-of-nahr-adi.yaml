label: { ar: "حفر نهر عدي", en: "Digging of Nahr Adi", es: "Excavación de Nahr Adi", fr: "Creusement du Nahr Adi", ur: "نہر عدی کی کھدائی", tr: "Adi Nehri'nin Kazılması", id: "Menggali Sungai Adi" }
summary:
  ar: "كتب عدي بن أرطاة عامل عمر بن عبد العزيز على البصرة إليه وأمر أهل البصرة أن يكتبوا في حفر نهر لهم فكتب إليه وكيع بن أبي سود إنك إن لم تحفر لنا نهراً فلا البصرة لنا بدار ويقال إن عدياً التمس في ذلك الإضرار ببهز بن يزيد بن المهلب فنفعه فكتب عمر يأذن له في حفر نهر فحفر نهر عدي من بثق شيرين وخرج الناس ينظرون إليه فحمل عدي الحسن البصري على سد كان عليه وجعل يشير."
  en: "Adi ibn Arta'a, Umar ibn Abd al-Aziz's governor, consulted the Basrans on digging a canal — Wak'i ibn Abi Sud wrote 'no canal, no home'; some say Adi's aim was to spite Bahz ibn Yazid ibn al-Muhallab. Umar's permission came, the canal was dug from Butq Shirin, the people came out to watch, and Adi bore al-Hasan al-Basri on the dam as he pointed."
  es: "Adi ibn Arta'a, gobernador de Umar ibn Abd al-Aziz, consultó a los basranos sobre la construcción de un canal. Wak'i ibn Abi Sud escribió: «Sin canal, no hay hogar». Algunos dicen que el objetivo de Adi era fastidiar a Bahz ibn Yazid ibn al-Muhallab. Umar dio su permiso, se excavó el canal desde Butq Shirin, la gente salió a observar y Adi llevó a al-Hasan al-Basri a la presa mientras señalaba."
  fr: "Adi ibn Arta'a, gouverneur d'Umar ibn Abd al-Aziz, consulta les habitants de Bassorah au sujet du creusement d'un canal. Wak'i ibn Abi Sud écrivit: « Pas de canal, pas de foyer ». Certains prétendent qu'Adi cherchait ainsi à nuire à Bahz ibn Yazid ibn al-Muhallab. Umar obtint l'autorisation, le canal fut creusé depuis Butq Shirin, la population vint assister aux travaux, et Adi porta al-Hasan al-Basri sur le barrage en lui indiquant du doigt."
  ur: "عمر بن عبدالعزیز کے گورنر عدی بن ارطعہ نے بصریوں سے نہر کھودنے کے بارے میں مشورہ کیا - وکیع ابن ابی سعود نے لکھا کہ 'نہر نہیں، کوئی گھر نہیں'؛ بعض کہتے ہیں کہ عدی کا مقصد بہز بن یزید ابن المحلب کو ناراض کرنا تھا۔ عمر کی اجازت آگئی، بطق شیرین سے نہر کھودی گئی، لوگ دیکھنے کے لیے باہر نکلے، اور عدی نے حسن البصری کے اشارہ کے مطابق ڈیم پر بور کیا۔"
  tr: "Ömer ibn Abdülaziz'in Basra valisi Adi ibn Artat, ona bir mektup yazarak Basra halkından kendileri için bir nehir kazmalarını istedi. Vaki' ibn Ebu Sud ona şöyle yazdı: \"Eğer bizim için bir nehir kazmazsanız, Basra bizim yurdumuz değildir.\" Rivayete göre Adi bu mektupta Bahz ibn Yazid ibn el-Muhallab'a zarar vermeyi amaçlamış, ancak bu ona fayda sağlamıştır. Bunun üzerine Ömer, ona nehir kazması için izin veren bir mektup yazdı. Adi, Şirin kuyusundan nehri kazdı ve halk onu görmek için dışarı çıktı. Adi, üzerinde bulunan bir barajın üzerinde el-Hasan el-Basri'yi taşıdı ve işaret etmeye başladı."
  id: "Adi ibn Artat, gubernur Umar ibn Abd al-Aziz atas Basra, menulis surat kepadanya dan memerintahkan penduduk Basra untuk menulis tentang penggalian sungai untuk mereka. Waki’ ibn Abi Sud menulis kepadanya, “Jika Anda tidak menggali sungai untuk kami, maka Basra bukanlah rumah kami.” Konon, Adi bermaksud mencelakai Bahz ibn Yazid ibn al-Muhallab dalam hal itu, tetapi justru menguntungkannya. Maka Umar menulis surat untuk memberinya izin menggali sungai. Adi menggali sungai dari sumur Shirin, dan orang-orang keluar untuk melihatnya. Adi membawa al-Hasan al-Basri di atas bendungan yang ada di sungai itu dan ia mulai menunjuk."
