id: "event/abu-al-qasim-leaves-shibam-for-saada-after-gifts-and-letters-291"
class: event
kind: other
label:
  ar: "أبو القاسم يخرج من شبام إلى صعدة بعد الهدايا والكتب، 291هـ"
  en: "Abu al-Qasim leaves Shibam for Sa'da after gifts and letters, 291 AH, p. 374"
  ur: "ابو القاسم شبام سے تحائف اور خطوط کے بعد صعدہ کی طرف روانہ ہوتے ہیں، 291ھ، ص374"
summary:
  ar: "كتب أبو القاسم إلى ابني يعفر يشكو طول مقامه وضجره بالموضع، فأرسلا إليه بدواب وخلع وسيفاً، وكتبا كتابين يعتذران فيهما عن مقامه، فقبل عذرهما ووزع ما وصله على خدمه ومن حضر من غيرهم، وكتب إلى علي بن الحسن الأقرعي أن يخرج معه. ثم خرجوا حتى وصلوا صعدة في أيام من سنة إحدى وتسعين ومائتين، والهادي إلى الحق مقيم بصعدة."
  en: "Abu al-Qasim wrote to the two sons of Ya'far complaining of his long stay and his boredom at the place. They sent him mounts, robes and a sword, and two letters apologising for his stay. He accepted their excuse, shared what reached him among his servants and others present, and wrote to Ali ibn al-Hasan al-Aqra' to go with him. They then set out and reached Sa'da in days of the year 291 AH, when al-Hadi ila al-Haqq was living in Sa'da."
  ur: "ابو القاسم نے یعفر کے دونوں بیٹوں کو لکھا کہ اسے اس جگہ طویل قیام اور اکتاہٹ کی شکایت ہے۔ انہوں نے اسے سواریاں، خلعتیں اور ایک تلوار بھیجی اور دو خط بھیجے جن میں اپنے قیام کی معذرت کی۔ اس نے ان کا عذر قبول کیا اور جو کچھ اسے ملا وہ اپنے خادموں اور دوسرے حاضرین میں بانٹ دیا، اور علی بن الحسن الاقرع کو لکھا کہ وہ اس کے ساتھ چلے۔ پھر وہ روانہ ہوئے اور سن 291ھ کے کچھ دنوں میں صعدہ پہنچے، جب الہادی الی الحق صعدہ میں مقیم تھے۔"
