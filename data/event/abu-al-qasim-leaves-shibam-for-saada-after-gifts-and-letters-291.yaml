id: "event/abu-al-qasim-leaves-shibam-for-saada-after-gifts-and-letters-291"
class: event
kind: other
label:
  ar: "أبو القاسم يخرج من شبام إلى صعدة بعد الهدايا والكتب، 291هـ"
  en: "Abu al-Qasim leaves Shibam for Sa'da after gifts and letters, 291 AH, p. 374"
  fr: "Abu al-Qasim quitte Shibam pour Sa'da après des cadeaux et des lettres, 291 de l’hégire, p. 374"
  ur: "ابو القاسم شبام سے تحائف اور خطوط کے بعد صعدہ کی طرف روانہ ہوتے ہیں، 291ھ، ص374"
  es: "Abu al-Qasim abandona Shibam para ir a Sa'da después de recibir regalos y cartas, 291 AH, pág. 374"
  tr: "Ebu el-Kasım, hediyeler ve kitapların ardından Hicri 291 yılında Şibam'dan Sa'de'ye doğru yola çıktı."
  id: "Abu al-Qasim berangkat dari Shibam ke Sa'dah setelah membawa hadiah dan buku, 291 Hijriah"
summary:
  ar: "كتب أبو القاسم إلى ابني يعفر يشكو طول مقامه وضجره بالموضع، فأرسلا إليه بدواب وخلع وسيفاً، وكتبا كتابين يعتذران فيهما عن مقامه، فقبل عذرهما ووزع ما وصله على خدمه ومن حضر من غيرهم، وكتب إلى علي بن الحسن الأقرعي أن يخرج معه. ثم خرجوا حتى وصلوا صعدة في أيام من سنة إحدى وتسعين ومائتين، والهادي إلى الحق مقيم بصعدة."
  en: "Abu al-Qasim wrote to the two sons of Ya'far complaining of his long stay and his boredom at the place. They sent him mounts, robes and a sword, and two letters apologising for his stay. He accepted their excuse, shared what reached him among his servants and others present, and wrote to Ali ibn al-Hasan al-Aqra' to go with him. They then set out and reached Sa'da in days of the year 291 AH, when al-Hadi ila al-Haqq was living in Sa'da."
  fr: "Abu al-Qasim écrivit aux deux fils de Ya'far pour se plaindre de la longueur de son séjour et de son ennui en ce lieu. Ils lui envoyèrent des montures, des robes et une épée, ainsi que deux lettres s’excusant de son séjour. Il accepta leurs excuses, partagea ce qu’il avait reçu entre ses serviteurs et les autres personnes présentes, et écrivit à Ali ibn al-Hasan al-Aqra' pour qu’il l’accompagne. Ils partirent ensuite et atteignirent Sa'da au cours de l’année 291 de l’hégire, alors qu’al-Hadi ila al-Haqq y résidait."
  ur: "ابو القاسم نے یعفر کے دونوں بیٹوں کو لکھا کہ اسے اس جگہ طویل قیام اور اکتاہٹ کی شکایت ہے۔ انہوں نے اسے سواریاں، خلعتیں اور ایک تلوار بھیجی اور دو خط بھیجے جن میں اپنے قیام کی معذرت کی۔ اس نے ان کا عذر قبول کیا اور جو کچھ اسے ملا وہ اپنے خادموں اور دوسرے حاضرین میں بانٹ دیا، اور علی بن الحسن الاقرع کو لکھا کہ وہ اس کے ساتھ چلے۔ پھر وہ روانہ ہوئے اور سن 291ھ کے کچھ دنوں میں صعدہ پہنچے، جب الہادی الی الحق صعدہ میں مقیم تھے۔"
  es: "Abu al-Qasim escribió a los dos hijos de Ya'far quejándose de su larga estancia y del aburrimiento que sentía en aquel lugar. Ellos le enviaron monturas, túnicas y una espada, además de dos cartas disculpándose por su permanencia. Él aceptó sus disculpas, compartió lo que le llegó con sus sirvientes y demás presentes, y le escribió a Ali ibn al-Hasan al-Aqra' para que lo acompañara. Partieron entonces y llegaron a Sa'da en el año 291 de la Hégira, cuando al-Hadi ila al-Haqq vivía allí."
  tr: "Ebu el-Kâsım, iki oğlu Yafur'a uzun süreli kalışından ve yorgunluğundan şikayet eden bir mektup yazdı. Bunun üzerine oğulları ona binekler, şeref elbiseleri ve bir kılıç gönderdiler ve kalışından dolayı özür dileyen iki mektup yazdılar. Özürlerini kabul etti ve aldıklarını hizmetkarları ve orada bulunmayanlar arasında dağıttı. Ali ibn el-Hasan el-Akra'i'ye kendisiyle birlikte gitmesi için mektup yazdı. Sonra yola çıktılar ve Hicri 291 yılının birkaç gününde Sa'de'ye ulaştılar. Sa'de'de ise Hadi ila el-Haqq ikamet ediyordu."
  id: "Abu al-Qasim menulis surat kepada kedua putranya, Ya'fur, mengeluh tentang lamanya ia tinggal dan kelelahan di tempat itu. Maka mereka mengirimkan kuda, jubah kehormatan, dan pedang, serta menulis dua surat permintaan maaf atas lamanya ia tinggal. Ia menerima permintaan maaf mereka dan membagikan apa yang diterimanya kepada para pelayannya dan orang-orang yang tidak hadir. Ia menulis surat kepada Ali ibn al-Hasan al-Aqra'i untuk ikut bersamanya. Kemudian mereka berangkat hingga sampai di Sa'dah beberapa hari kemudian pada tahun 291 H, dan al-Hadi ila al-Haqq tinggal di Sa'dah."
