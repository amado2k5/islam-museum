summary:
  ar: "مات يزيد بن عبد الملك في أواخر شعبان سنة خمس ومئة، وكتب إليه عمر بن عبد العزيز حين احتضر فإنك تدع الدنيا لمن لا يحمدك وتفضي إلى من لا يعذرك {cite:tarikh-khulafa-minhaj-1434 p. 399-400}."
  en: "Yazid ibn Abd al-Malik died in late Sha'ban year 105; Umar ibn Abd al-Aziz had written to him on his own deathbed: 'you leave the world to one who will not praise you, and pass on to One who will not excuse you' {cite:tarikh-khulafa-minhaj-1434 p. 399-400}."
  es: "Yazid ibn Abd al-Malik murió a finales de Sha'ban del año 105; Umar ibn Abd al-Aziz le había escrito en su lecho de muerte: \"Dejas el mundo a alguien que no te alabará y pasas a alguien que no te perdonará\" {cite:tarikh-khulafa-minhaj-1434 p. 399-400}."
  fr: "Yazid ibn Abd al-Malik mourut à la fin de l'année Sha'ban 105; Umar ibn Abd al-Aziz lui avait écrit sur son lit de mort: « Tu quittes le monde à Celui qui ne te louera pas, et tu passes à Celui qui ne t'excusera pas » {cite: tarikh-khulafa-minhaj-1434 p. 399-400}."
  ur: "یزید بن عبد الملک کی وفات شعبان کے اواخر میں سنہ 105۔ عمر بن عبدالعزیز نے بستر مرگ پر انہیں لکھا تھا: ''تم دنیا کو ایسے شخص کے لیے چھوڑ دو جو تمہاری تعریف نہیں کرے گا، اور اس کے پاس چلے جاؤ جو تمہیں معاف نہیں کرے گا''۔ 399-400}۔"
