id: event/al-hadi-answers-the-blame-over-giving-and-says-his-land-is-poor-292
class: event
kind: other
label:
  ar: "جواب الهادي عن عتاب بني عمه في العطاء وقوله إن بلاده فقيرة، ص303-304"
  en: "Al-Hadi answers his cousins' blame over giving and says his land is poor, pp. 303-304"
  ur: "ہادی کا چچازادوں کی عطا پر ملامت کا جواب اور یہ کہنا کہ ان کی سرزمین غریب ہے، ص303-304"
  es: "Al-Hadi responde a las acusaciones de sus primos por haber dado y dice que su tierra es pobre, págs. 303-304."
summary:
  ar: "يتوجه الشاعر إلى بني عمه فيقول إنهم نقموا عليه في العطية، وإنه يجود بنفسه وماله ولا يدّخر كنوزاً، وإنه لا يخادعهم ولا يطمع في مال، وإن أرضه دنية قليلة المال وسكانها جياع، وإنهم نسوا دفاعه عنهم، ثم يدعوهم ألا ييأسوا فالدنيا تدور والدهر ذو حالات، ويختم بسلام الله."
  en: "The poet turns to his cousins and says that they resented him over his giving, that he gives of himself and his wealth and does not store treasures, that he does not deceive them or covet wealth, that his land is poor with little wealth and its people hungry, and that they have forgotten his defence of them; he then asks them not to despair since the world turns and time has changing states, and ends with God's peace."
  ur: "شاعر اپنے چچازادوں سے مخاطب ہو کر کہتا ہے کہ انہوں نے عطا پر اس پر ناراضی کی، کہ وہ اپنی جان اور مال سے سخاوت کرتا ہے اور خزانے جمع نہیں کرتا، کہ وہ انہیں دھوکا نہیں دیتا نہ مال کا لالچ کرتا ہے، کہ اس کی سرزمین غریب ہے جس میں مال کم اور باشندے بھوکے ہیں، اور کہ انہوں نے اس کا ان کی طرف سے دفاع بھلا دیا؛ پھر وہ ان سے کہتا ہے کہ مایوس نہ ہوں کیونکہ دنیا گردش کرتی ہے اور زمانے کی کئی حالتیں ہیں، اور اللہ کے سلام پر ختم کرتا ہے۔"
  es: "El poeta se dirige a sus primos y les dice que le guardaban rencor por su generosidad, que él se entrega a sí mismo y a sus riquezas y no acumula tesoros, que no los engaña ni codicia riquezas, que su tierra es pobre, con pocas riquezas y su gente pasa hambre, y que han olvidado su defensa de ellos; luego les pide que no se desesperen, ya que el mundo gira y el tiempo tiene estados cambiantes, y termina con la paz de Dios."
