label: { ar: "معسكر عبد الله بن أبي وتخلفه", en: "Ibn Ubayy's separate camp and his staying behind", es: "El campamento separado de Ibn Ubayy y su permanencia atrás", fr: "Le camp séparé d'Ibn Ubayy et son maintien à l'écart", ur: "ابن ابی کا الگ کیمپ اور اس کے پیچھے رہنا", tr: "Abdullah ibn Abi'nin kampı ve yokluğu", id: "Kubu Abdullah ibn Abi dan ketidakhadirannya" }
summary:
  ar: "ضرب عبد الله بن أبي عسكره على حدة أسفل من عسكر النبي نحو ذباب، وكان فيما يزعمون ليس بأقل العسكرين؛ فلما سار النبي تخلف عنه ابن أبي فيمن تخلف من «المنافقين وأهل الريب»."
  en: "Abdullah ibn Ubayy pitched his own camp below the Prophet's camp toward Dhubab — as they claim, no smaller than the Prophet's own. When the Prophet marched on, Ibn Ubayy stayed behind with those of the 'hypocrites and doubters' who stayed."
  es: "Abdullah ibn Ubayy instaló su propio campamento debajo del del Profeta, en dirección a Dhubab; según afirman, no era más pequeño que el del Profeta. Cuando el Profeta siguió su marcha, Ibn Ubayy se quedó atrás con aquellos «hipócritas y escépticos» que permanecieron en el campamento."
  fr: "Abdullah ibn Ubayy installa son campement en contrebas de celui du Prophète, en direction de Dhubab; selon ses dires, ce campement n'était pas plus petit que celui du Prophète. Lorsque le Prophète reprit sa marche, Ibn Ubayy resta avec les « hypocrites et les sceptiques » qui étaient restés."
  ur: "عبداللہ ابن ابی نے نبی کے خیمہ کے نیچے ذباب کی طرف اپنا کیمپ لگایا - جیسا کہ ان کا دعوی ہے، رسول اللہ کے کیمپ سے چھوٹا نہیں۔ جب نبی آگے بڑھے تو ابن ابی ان 'منافقوں اور شک کرنے والوں' کے ساتھ پیچھے رہ گئے۔"
  tr: "Abdullah bin Abi, ordusunu Peygamber'in ordusunun arkasında, Dhubab yönüne doğru ayrı bir şekilde konuşlandırdı. Rivayetlere göre, bu ordu iki ordudan daha küçük değildi. Peygamber yola çıktığında, İbn Abi, \"münafıklar ve şüpheciler\" arasından geride kalanlarla birlikte kaldı."
  id: "Abdullah bin Abi membentuk pasukannya sendiri, di bawah pasukan Nabi, menuju Dhubab. Dikatakan bahwa pasukannya tidak lebih kecil dari kedua pasukan tersebut. Ketika Nabi berangkat, Ibnu Abi tinggal di belakang bersama orang-orang yang tinggal di belakang dari kalangan \"orang-orang munafik dan orang-orang yang ragu.\""
