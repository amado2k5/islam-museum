id: event/ahmad-gran-harar-934
class: event
kind: conquest
label: { ar: "أخذ الإمام أحمد جران هرر وفتوحاته بالحبشة", en: "Imam Ahmad Gran's Seizure of Harar and Abyssinian Conquests", fr: "Prise de Harar par l’imam Ahmad Gran et conquêtes en Abyssinie", es: "La toma de Harar por el Imam Ahmad Gran y las conquistas de Abisinia", ur: "امام احمد گران کا حرار اور حبشی فتوحات پر قبضہ", tr: "İmam Ahmed, Harar'ı ve Habeşistan'daki fetihlerini ele geçirdi.", id: "Imam Ahmad merebut Harar dan penaklukannya di Abyssinia." }
summary:
  ar: "في شذرات الذهب سنة أربع وثلاثين وتسع مئة أخذ الإمام الجراد أحمد مدينة هرر من بلاد الحبشة وضعف عن مقاومته سلطانها ولم يزل أمره يعظم واستفتح كثيراً من بلاد الحبشة وواظب على الجهاد والغزو حتى قيل ما تشبه فتوحاته إلا فتوحات الصحابة {cite:shadharat-dhahab p. 617}."
  en: "934: Imam Ahmad took Harar, its sultan powerless to resist; his conquests across the Abyssinian lands grew till 'his conquests were said to resemble only the Companions' conquests' {cite:shadharat-dhahab p. 617}."
  fr: "934 : l’imam Ahmad prit Harar, dont le sultan était impuissant à résister ; ses conquêtes s’étendirent dans les terres abyssines au point qu’on disait qu’elles ne ressemblaient qu’à celles des Compagnons {cite:shadharat-dhahab p. 617}."
  es: "934: El Imam Ahmad tomó Harar, y su sultán fue incapaz de resistir; sus conquistas por las tierras de Abisinia crecieron hasta que \"se decía que sus conquistas se parecían solo a las conquistas de los Compañeros\" {cita: shadharat-dhahab p. 617}."
  ur: "934: امام احمد نے حرار کو لے لیا، اس کے سلطان مزاحمت کرنے کی طاقت نہیں رکھتے تھے۔ حبشہ کی سرزمین پر اس کی فتوحات میں اضافہ ہوا یہاں تک کہ 'اس کی فتوحات صرف صحابہ کی فتوحات سے مشابہت رکھتی ہیں'۔ 617}۔"
  tr: "Şadharat el-Dhahab'da, 934 yılında, İmam el-Cerad Ahmed, Habeşistan topraklarından Harar şehrini aldı ve sultanı ona karşı koyamayacak kadar güçsüz kaldı. Gücü giderek arttı ve Habeşistan'ın birçok bölgesini fethetti. Cihad ve fetihlerde ısrarcı oldu ve fetihlerinin ancak Sahabelerin fetihlerine benzediği söylendi. {kaynak:şadharat-dhahab s. 617}"
  id: "Dalam kitab Shadharat al-Dhahab, pada tahun 934, Imam al-Jarad Ahmad merebut kota Harar dari negeri Abyssinia, dan sultannya terlalu lemah untuk melawannya. Kekuasaannya terus bertambah, dan ia menaklukkan banyak wilayah Abyssinia. Ia terus berjihad dan menaklukkan hingga dikatakan bahwa penaklukannya hanya serupa dengan penaklukan para Sahabat. {cite:shadharat-dhahab p. 617}."
