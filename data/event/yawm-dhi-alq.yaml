summary:
  ar: "يوم ذي علق التقت بنو عامر بن صعصعة وبنو أسد فاقتتلوا قتالًا عظيمًا فقتل في المعركة ربيعة بن مالك بن جعفر الكلابي أبو لبيد الشاعر وانهزمت عامر، فتبعهم خالد بن نضلة الأسدي وابنه حبيب والحرث بن خالد بن المضلل فأمعنوا في الطلب، فخرج عليهم أبو براء عامر بن مالك في نفر من وراء ظهورهم فقال لخالد يا أبا معقل إن شئت أجزتنا وأجزناك حتى نحمل جرحانا وندفن قتلانا قال قد فعلت فتواقفوا، فلما سمع أبو براء بقتل ربيعة حمل ردافتهم، وفي ذلك يقول مالك بن نويرة ونحن عقرنا مهر قابوس بعدما رأى القوم منه الموت والخيل تلجب {cite:kamil-ibn-al-athir p. 481}."
  en: "At Dhū ʿAlaq, where Banū ʿĀmir met Banū Asad, Rabīʿa ibn Mālik — Labīd the poet's father — fell and ʿĀmir broke. Khālid ibn Naḍla al-Asadī, his son Ḥabīb and al-Ḥārith ibn Khālid pressed the pursuit until Abū Barāʾ ʿĀmir ibn Mālik appeared behind them: «if you will, we will carry off our wounded and bury our dead» — the parties stood down; and Mālik ibn Nuwayra sang of hamstringing «the foal of Qābūs» when the host saw death in him {cite:kamil-ibn-al-athir p. 481}."
  es: "En Dhū ʿAlaq, donde Banū ʿĀmir se encontró con Banū Asad, Rabīʿa ibn Mālik — Labīd, el padre del poeta — cayó y ʿĀmir se quebró. Khālid ibn Naḍla al-Asadī, su hijo Ḥabīb y al-Ḥārith ibn Khālid continuaron la persecución hasta que Abū Barāʾ ʿĀmir ibn Mālik apareció detrás de ellos: «Si queréis, llevaremos a nuestros heridos y enterraremos a nuestros muertos». Los grupos se detuvieron; y Mālik ibn Nuwayra cantó sobre desgarrar «al potro de Qābūs» cuando el anfitrión vio la muerte en él {cite:kamil-ibn-al-athir p. 481}."
  fr: "À Dhū ʿAlaq, où Banū ʿĀmir rencontra Banū Asad, Rabīʿa ibn Mālik — le père de Labīd, le poète — tomba et ʿĀmir s'effondra. Khālid ibn Naḍla al-Asadī, son fils Ḥabīb et al-Ḥārith ibn Khālid poursuivirent les troupes jusqu'à ce qu'Abū Barāʾ ʿĀmir ibn Mālik apparaisse derrière eux: « Si vous le voulez, nous emporterons nos blessés et enterrerons nos morts ». Les troupes se retirèrent; et Mālik ibn Nuwayra chanta comment il avait blessé « le poulain de Qābūs » lorsque l'armée vit la mort en lui (voir: Kamil ibn al-Athir, p. 481)."
  ur: "ذوعلق میں جہاں بنو عامر بنو اسد سے ملے ربیعہ بن مالک - لبید شاعر کے والد - گرے اور عامر ٹوٹ گیا۔ خالد بن نضلہ الاسدی، ان کے بیٹے حبیب اور حارث بن خالد نے تعاقب جاری رکھا یہاں تک کہ ابو براء عامر بن مالک ان کے پیچھے نمودار ہوئے: \"اگر تم چاہو تو ہم اپنے زخمیوں کو اٹھا کر اپنے مردوں کو دفن کر دیں گے۔\" - فریقین۔ اور مالک بن نویرہ نے \"قابوس کے بچھڑے\" کے بال کاٹنے کا گانا گایا جب میزبان نے اس میں موت دیکھی۔ 481}۔"
