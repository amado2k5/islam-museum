summary:
  ar: "يوم ذي علق التقت بنو عامر بن صعصعة وبنو أسد فاقتتلوا قتالًا عظيمًا فقتل في المعركة ربيعة بن مالك بن جعفر الكلابي أبو لبيد الشاعر وانهزمت عامر، فتبعهم خالد بن نضلة الأسدي وابنه حبيب والحرث بن خالد بن المضلل فأمعنوا في الطلب، فخرج عليهم أبو براء عامر بن مالك في نفر من وراء ظهورهم فقال لخالد يا أبا معقل إن شئت أجزتنا وأجزناك حتى نحمل جرحانا وندفن قتلانا قال قد فعلت فتواقفوا، فلما سمع أبو براء بقتل ربيعة حمل ردافتهم، وفي ذلك يقول مالك بن نويرة ونحن عقرنا مهر قابوس بعدما رأى القوم منه الموت والخيل تلجب {cite:kamil-ibn-al-athir p. 481}."
  en: "At Dhū ʿAlaq, where Banū ʿĀmir met Banū Asad, Rabīʿa ibn Mālik — Labīd the poet's father — fell and ʿĀmir broke. Khālid ibn Naḍla al-Asadī, his son Ḥabīb and al-Ḥārith ibn Khālid pressed the pursuit until Abū Barāʾ ʿĀmir ibn Mālik appeared behind them: «if you will, we will carry off our wounded and bury our dead» — the parties stood down; and Mālik ibn Nuwayra sang of hamstringing «the foal of Qābūs» when the host saw death in him {cite:kamil-ibn-al-athir p. 481}."
