label: { ar: "يوم ذي علق — عامر وأسد والهدنة بين أبي براء وخالد بن نضلة", en: "the day of Dhū ʿAlaq — Abū Barāʾ's truce with Khālid ibn Naḍla", es: "el día de Dhū ʿAlaq — La tregua de Abū Barāʾ con Khālid ibn Naḍla", fr: "le jour de Dhū ʿAlaq — la trêve d'Abū Barāʾ avec Khālid ibn Naḍla", ur: "ذی علق کا دن - ابو براء کی خالد بن نضلہ کے ساتھ صلح" }
date:
