id: event/fall-of-raqqada-296
class: event
kind: conquest
label: { ar: "دخول أبي عبد الله الشيعي رقادة وانهيار دولة الأغالبة", en: "Abu Abdallah al-Shi'i's entry into Raqqada and the collapse of the Aghlabid state", es: "La entrada de Abu Abdallah al-Shi'i en Raqqada y el colapso del estado aglabí.", fr: "L'entrée d'Abu Abdallah al-Shi'i à Raqqada et l'effondrement de l'État aghlabide", ur: "ابو عبداللہ الشیعی کا رقہ میں داخل ہونا اور ریاست اغلبیت کا خاتمہ", tr: "Ebu Abdullah el-Şii'nin Rakkada'ya girişi ve Ağlabid devletinin çöküşü", id: "Masuknya Abu Abdullah al-Shi’i ke Raqqada dan runtuhnya negara Aghlabid" }
summary:
  ar: "سنة 296هـ هزم أبو عبد الله الشيعي عسكر إبراهيم بن أبي الأغلب وهرب زيادة الله إلى مصر ودخل الشيعي رقادة في رجب سنة ست وتسعين ونزل قصورها وفرق دورها على كتامة ونادى بالأمان وجمع أموال زيادة الله وسلاحه وأمر بحفظها، وكان قد حاصر قسنطينة فافتتحها على الأمان وملك البلاد قصراً قصراً: بلزمة عنوة وطبنة على الأمان وباغاية ومرماجنة وتيفاش والقصرين {cite:tarikh-ibn-khaldun-ibar p. 803-804}."
  en: "In Rajab 296 Abu Abdallah al-Shi'i broke Ibrahim b. Abi'l-Aghlab's army, sent Ziyadat Allah fleeing to Egypt and entered Raqqada, quartering Kutama in its palaces and calling the aman — the Aghlabid state's end {cite:tarikh-ibn-khaldun-ibar p. 803-804}."
  es: "En Rajab 296, Abu Abdallah al-Shi'i derrotó al ejército de Ibrahim b. Abi'l-Aghlab, envió a Ziyadat Allah a huir a Egipto y entró en Raqqada, acuartelando a Kutama en sus palacios y proclamando el aman, el fin del estado aglabí {cite:tarikh-ibn-khaldun-ibar p. 803-804}."
  fr: "En Rajab 296, Abu Abdallah al-Shi'i brisa l'armée d'Ibrahim b. Abi'l-Aghlab, envoya Ziyadat Allah fuir en Égypte et entra à Raqqada, logeant Kutama dans ses palais et appelant l'aman — la fin de l'État aghlabide {cite:tarikh-ibn-khaldun-ibar p. 803-804}."
  ur: "رجب 296 میں ابو عبداللہ الشیعی نے ابراہیم بن کو توڑا۔ ابی الاغلب کی فوج نے زیادت اللہ کو مصر کی طرف بھاگتے ہوئے بھیجا اور رقدہ میں داخل ہوا، کوتامہ کو اس کے محلات میں تقسیم کیا اور امان کو پکارا – اغلب ریاست کا خاتمہ۔ 803-804}۔"
  tr: "Hicri 296 yılında Ebu Abdullah el-Şii, İbrahim ibn Abi el-Ağlab'ın ordusunu yenmiş ve Ziyadet Allah Mısır'a kaçmıştır. El-Şii, 96 yılının Receb ayında Rakkada'ya girmiş, saraylarına yerleşmiş ve evlerini Kutama halkına dağıtmıştır. Güvenlik çağrısında bulunmuş, Ziyadet Allah'ın parasını ve silahlarını toplamış ve bunların güvenli bir şekilde saklanmasını emretmiştir. Konstantin'i kuşatmış ve güvenlik şartıyla fethetmiş, saray saray ülkeyi ele geçirmiştir: Balzma'yı zorla, Tabna'yı ise güvenlik şartıyla almıştır; ayrıca Bağya, Mermecena, Tifaş ve iki sarayı da ele geçirmiştir. {Kaynak: Tarik İbn Haldun İbar, s. 803-804}"
  id: "Pada tahun 296 H, Abu Abdullah al-Shi’i mengalahkan pasukan Ibrahim ibn Abi al-Aghlab, dan Ziyadat Allah melarikan diri ke Mesir. Al-Shi’i memasuki Raqqada pada bulan Rajab tahun sembilan puluh enam dan menetap di istana-istananya serta membagikan rumah-rumahnya kepada orang-orang Kutama. Ia menyerukan perlindungan dan mengumpulkan uang serta senjata Ziyadat Allah dan memerintahkan agar semuanya dijaga dengan aman. Ia telah mengepung Konstantinus dan menaklukkannya dengan syarat keamanan serta menguasai negara istana demi istana: Balzma dengan kekerasan dan Tabna dengan syarat keamanan, dan Baghaia, Marmajana, Tifash dan dua istana {cite:tarikh-ibn-khaldun-ibar p. 803-804}."
