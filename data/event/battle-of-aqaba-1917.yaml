summary:
  ar: "بطاقة أولية لمعركة العقبة سنة ١٩١٧م، أخذ الثورة العربية للميناء العثماني في حملة فيصل ولورنس؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Aqaba in 1917, the Arab Revolt's capture of the Ottoman port in Faisal's and Lawrence's raid; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Batalla de Aqaba en 1917, la captura del puerto otomano por la Revuelta Árabe en la incursión de Faisal y Lawrence; sus fuentes aún no han sido verificadas en la página."
  fr: "Fiche de projet pour la bataille d'Aqaba en 1917, la prise du port ottoman par la révolte arabe lors du raid de Faisal et Lawrence; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1917 میں عقبہ کی جنگ کے لیے ڈرافٹ کارڈ، فیصل اور لارنس کے چھاپے میں عرب بغاوت کا عثمانی بندرگاہ پر قبضہ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1917 yılında gerçekleşen Akabe Muharebesi'nin ön raporu; Faysal ve Lawrence'ın seferi sırasında Osmanlı limanının Arap ayaklanmasıyla sonuçlanmıştır; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Aqaba pada tahun 1917 M, Pemberontakan Arab yang merebut pelabuhan Ottoman dalam kampanye Faisal dan Lawrence; sumber-sumber di halaman ini belum ditinjau."
