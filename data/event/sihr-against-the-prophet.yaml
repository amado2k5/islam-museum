id: event/sihr-against-the-prophet
class: event
kind: other
label:
  ar: سحر أُلقي على النبي
  en: The bewitching done on the Prophet
  ur: نبی پر کیا گیا جادو
  es: "El hechizo realizado sobre el Profeta"
  fr: "L'ensorcellement jeté sur le Prophète"
  tr: "Peygamberin üzerine büyü yapıldı."
  id: "Sihir telah dilakukan terhadap Nabi."
date:
  start: { edtf: "0630~", calendar: julian, precision: year, status: tradition, note: "في السنوات الأخيرة من حياة النبي بالمدينة على رواية الجمهور" }
summary:
  ar: "سحر رجل يهودي من أهل المدينة — قيل هو لبيد بن الأعصم — النبي حتى اشتد به الأمر، فأخبر جبريل أنه مسحور، فنزلت المعوذتان فشُفي، وأُخرج السحر من بئر تحت فراشه فاعترف فُعِرف وأُخرج {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  en: "A Jew of Medina — said to be Labid ibn al-Asam — bewitched the Prophet until his condition grew severe; Gabriel told him he was bewitched, the two Suras of Refuge were revealed and he was cured, the magic drawn from a well beneath his bedding, and the man confessed and was expelled {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  ur: "مدینہ کا ایک یہودی — کہا جاتا ہے لبید بن الاعصم — نے نبی پر جادو کیا یہاں تک کہ ان کی حالت بگڑی؛ جبریل نے بتایا کہ وہ مسحور ہیں، معوذتین نازل ہوئیں اور وہ شفا پائے، اور جادو ان کے بستر کے نیچے کنوئیں سے نکالا گیا، اس نے اعتراف کیا تو معلوم ہوا اور اسے نکال دیا گیا {cite:sahih-al-bukhari} {cite:sahih-muslim}۔"
  es: "Un judío de Medina —se dice que era Labid ibn al-Asam— embrujó al Profeta hasta que su condición se agravó; Gabriel le dijo que estaba embrujado, se revelaron las dos Suras del Refugio y fue curado, la magia fue extraída de un pozo debajo de su cama, y el hombre confesó y fue expulsado {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  fr: "Un Juif de Médine — que l'on dit être Labid ibn al-Asam — jeta un sort au Prophète jusqu'à ce que son état s'aggrave; Gabriel lui dit qu'il était ensorcelé, les deux sourates du Refuge furent révélées et il fut guéri, la magie étant extraite d'un puits sous sa literie, et l'homme confessa et fut expulsé {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  tr: "Medineli bir Yahudi adam - rivayete göre Labid ibn al-A'sam - Peygamberi büyüledi ve durum onun için ağır bir hal aldı. Bunun üzerine Cebrail ona büyülendiğini bildirdi, bunun üzerine iki koruyucu sure nazil oldu ve iyileşti. Büyü, yatağının altındaki bir kuyudan çıkarıldı, o da itiraf etti, teşhis edildi ve dışarı çıkarıldı. {Sahih-i Buhari} {Sahih-i Müslim}"
  id: "Seorang pria Yahudi dari Madinah—konon ia adalah Labid ibn al-A’sam—menyihir Nabi hingga keadaannya menjadi sangat buruk, lalu Jibril memberitahukan kepadanya bahwa ia telah disihir, kemudian dua surah pelindung diturunkan dan ia sembuh, dan sihir itu dikeluarkan dari sebuah sumur di bawah tempat tidurnya, lalu ia mengaku dan diidentifikasi serta dibawa keluar {cite:sahih-al-bukhari} {cite:sahih-muslim}."
