label: { ar: "سحر النبي", en: "The Magic Worked Against the Prophet", ur: "نبی پر جادو" }
summary:
  ar: "ما يُروى أن رجلاً يهودياً اسمه لَبِيد بن الأَصَمّ سحر النبي في المدينة مع ابن أخته وامرأة، فكان النبي يعوذ نفسه بالمعوذتين ويستعيذ من شر ما خلق؛ فنُبِّئ بالثلاثة وأن لَبِيداً في قصة شعره فأُتي به فسُئل فأقرّ، فأمر النبي بإتيان غصن رَطْب فيه ثلاث ورقات فأُحرق حتى صار رماداً ثم نُفث فيه الماء فقُرئ عليه البقرة وآل عمران والمعوذتان فبرأ، وسقط شعر لَبِيد وبدت آثاره."
  en: "The report that a Jewish man named Labid ibn al-Asam bewitched the Prophet along with his nephew and a woman; the Prophet was told of the three and of Labid's location by a comb of hair, was cured by ruqyah with lote-tree leaves and the opening suras, while the sorcerer's hair fell out."
  ur: "روایت کے مطابق یہودی شخص لَبِيد بن الاعصم نے اپنے بھتیجے اور ایک عورت کے ساتھ نبی پر جادو کیا؛ نبی کو تین آدمیوں اور لَبِيد کی نشاندہی باڑ سے ہوئی، پھر نبک کے پتوں کے راکھ میں پانی ملا کر معوذات پڑھنے سے نبی شفا پائے اور جادوگر کے بال گر گئے۔"
