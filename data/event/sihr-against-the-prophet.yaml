id: event/sihr-against-the-prophet
class: event
kind: other
label:
  ar: سحر أُلقي على النبي
  en: The bewitching done on the Prophet
  ur: نبی پر کیا گیا جادو
date:
  start: { edtf: "0630~", calendar: julian, precision: year, status: tradition, note: "في السنوات الأخيرة من حياة النبي بالمدينة على رواية الجمهور" }
summary:
  ar: "سحر رجل يهودي من أهل المدينة — قيل هو لبيد بن الأعصم — النبي حتى اشتد به الأمر، فأخبر جبريل أنه مسحور، فنزلت المعوذتان فشُفي، وأُخرج السحر من بئر تحت فراشه فاعترف فُعِرف وأُخرج {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  en: "A Jew of Medina — said to be Labid ibn al-Asam — bewitched the Prophet until his condition grew severe; Gabriel told him he was bewitched, the two Suras of Refuge were revealed and he was cured, the magic drawn from a well beneath his bedding, and the man confessed and was expelled {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  ur: "مدینہ کا ایک یہودی — کہا جاتا ہے لبید بن الاعصم — نے نبی پر جادو کیا یہاں تک کہ ان کی حالت بگڑی؛ جبریل نے بتایا کہ وہ مسحور ہیں، معوذتین نازل ہوئیں اور وہ شفا پائے، اور جادو ان کے بستر کے نیچے کنوئیں سے نکالا گیا، اس نے اعتراف کیا تو معلوم ہوا اور اسے نکال دیا گیا {cite:sahih-al-bukhari} {cite:sahih-muslim}۔"
