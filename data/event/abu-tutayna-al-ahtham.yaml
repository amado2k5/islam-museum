label: { ar: "قصة ابن الأهثم أبي طينة", en: "The Abu Tutayna Affair", fr: "L’affaire Abu Tutayna", es: "El asunto de Abu Tutayna", ur: "ابو طوطینا معاملہ", tr: "İbn el-Ahtham Ebu Tineh'in hikayesi", id: "Kisah Ibn al-Ahtham Abu Tineh" }
summary:
  ar: "كان عبد الله بن عبد الله بن الأهثم أبو حاقان خليفة قتيبة على مرو إذا غزا فكتب إلى الحجاج يسعى بقتيبة ويخبر بما صار إليه من المال وأنذره بشير أحد بني الأهثم فقال إنك قد انبسطت إلى عبد الله وهو ذو غوائل حسود فلا نأمنه أن يعزلك فيستفسدنا فقال أما قلت هذا حسداً لابن عمك فقال فليكن عذري عندك فإن كان ذلك عذرتني فلما كتب ما كتب به إلى الحجاج طوى الحجاج كتابه إلى قتيبة فجاء الرسول حتى نزل السكة بمرو وجاوزها ولم يأت عبد الله فأحس بالشر فهرب فلحق بالشام فمكث زماناً يبيع الخمر والكتانيات في رزمة على عنقه يطوف بها ثم وضع خرقة وقطنة على إحدى عينيه وعصبها واكتنى بأبي طينة وكان يبيع الزيت فلم يزل على هذه الحال حتى هلك الوليد بن عبد الملك وقام سليمان فألقى عنه ذاك الدنس والخرقة وقام بخطبة تهنيئة لسليمان ووقوعاً في الحجاج وقتيبة فتفرق الناس وهم يقولون أبو طينة الزيات أبلغ الناس فلما انتهى إلى قتيبة كتاب ابن الأهثم إلى الحجاج عقر على بني عمه وبنيه وكان أحدهم شيبة أبو شبيب فقتل تسعة أناسي منهم بشير فقال له بشير اذكر عذري عندك فقال قدمت رجلاً وأخرت رجلاً يا عدو الله فقتلهم جميعاً وكان وكيع بن أبي سود قبل ذلك على بني تميم بخراسان فمزله عنهم قتيبة واستعمل رجلاً من بني ضرار الضبي فقال حين قتلهم قتلني الله إن أقتله ويفقدوه فلم يصل الظهر ولا العصر فقالوا له إنك لم تصل فقال وكيف أصلي لرب قتل منا عامتهم صبياناً ولم يغضب لهم."
  en: "Abdallah ibn al-Ahtham, Abu Haqan, Qutayba's Marw deputy during campaigns, wrote al-Hajjaj denouncing him. Bashir of the Ahtham warned Qutayba — 'you've opened to a treacherous envious man' — dismissed as cousin-envy, though Bashir begged it stand as his excuse. When al-Hajjaj forwarded the letter and the courier rode past the Sakka without stopping, Ibn al-Ahtham sensed the trap and fled to Syria: years peddling wine and flax round his neck, then rag and cotton over one eye, styled Abu Tutayna the oilman — until al-Walid died and Sulayman rose, when he cast off the disguise and preached congratulations to Sulayman with attacks on al-Hajjaj and Qutayba — 'Abu Tutayna the oilman, the most eloquent of men'. Reading the letter, Qutayba struck the Banu Ahtham, killing nine; Bashir said 'remember my excuse' — 'you put one foot forward and held the other back, enemy of God' — and killed them all. Waki' ibn Abi Sud, deposed from Tamim's command for a Dabbi, swore then, missed zhuhr and asr, and when asked answered: 'how should I pray to a Lord who killed our best as boys and was not angered for them?'"
  fr: "Abdallah ibn al-Ahtham, Abu Haqan, suppléant de Qutayba à Marw pendant les campagnes, écrivit à al-Hajjaj pour le dénoncer. Bashir des Ahtham avertit Qutayba : « Tu t’es ouvert à un traître envieux », mais celui-ci n’y vit que jalousie entre cousins, bien que Bashir demandât que cela lui servît d’excuse. Quand al-Hajjaj transmit la lettre et que le courrier passa sans s’arrêter à la Sakka, Ibn al-Ahtham pressentit le piège et s’enfuit en Syrie : il vendit pendant des années du vin et du lin portés au cou, puis se banda un œil de chiffon et de coton et se fit appeler Abu Tutayna le marchand d’huile. À la mort d’al-Walid et à l’avènement de Sulayman, il quitta son déguisement et prononça un sermon félicitant Sulayman et attaquant al-Hajjaj et Qutayba ; on le qualifia de plus éloquent des hommes. À la lecture de la lettre, Qutayba frappa les Banu Ahtham et tua neuf hommes. Bashir lui rappela son excuse ; Qutayba répondit : « Tu as avancé un pied et retenu l’autre, ennemi de Dieu », puis les tua tous. Waki' ibn Abi Sud, destitué du commandement des Tamim au profit d’un Dabbi, jura alors vengeance, manqua les prières de midi et de l’après-midi et répondit : « Comment prier un Seigneur qui a tué les meilleurs des nôtres encore enfants sans s’irriter pour eux ? »"
  es: "Abdallah ibn al-Ahtham, Abu Haqan, lugarteniente de Qutayba en Marw durante las campañas, escribió a al-Hajjaj denunciándolo. Bashir de Ahtham advirtió a Qutayba: «Te has abierto a un hombre traicionero y envidioso», lo cual desestimó como envidia entre primos, aunque Bashir le rogó que lo considerara su excusa. Cuando al-Hajjaj envió la carta y el mensajero pasó por Sakka sin detenerse, Ibn al-Ahtham intuyó la trampa y huyó a Siria: años vendiendo vino y lino alrededor de su cuello, luego trapos y algodón sobre un ojo, se hacía llamar Abu Tutayna el aceitero, hasta que murió al-Walid y ascendió Sulayman, momento en el que se deshizo del disfraz y predicó felicitaciones a Sulayman atacando a al-Hajjaj y Qutayba: «Abu Tutayna el aceitero, el más elocuente de los hombres». Tras leer la carta, Qutayba atacó a los Banu Ahtham, matando a nueve. Bashir dijo: «Recuerda mi excusa»: «Diste un paso adelante y el otro atrás, enemigo de Dios», y los mató a todos. Waki' ibn Abi Sud, depuesto del mando de Tamim para ser nombrado Dabbi, juró entonces, faltó a las oraciones de zhuhr y asr, y al ser preguntado respondió: «¿Cómo puedo rezar a un Señor que mató a los mejores de nosotros cuando eran niños y no se enojó por ellos?»."
  ur: "عبداللہ ابن الاحثم، ابو حقان، قتیبہ کے مرو کے نائب، مہمات کے دوران، الحجاج نے اس کی مذمت کرتے ہوئے لکھا۔ احتشام کے بشیر نے قطیبہ کو خبردار کیا - 'تم نے ایک غدار غیرت مند آدمی کے لیے کھول دیا ہے' - اسے کزن حسد کے طور پر مسترد کر دیا، حالانکہ بشیر نے اسے اپنے عذر کے طور پر کھڑا کرنے کی التجا کی۔ جب الحجاج نے خط آگے بڑھایا اور کورئیر بغیر رکے سکّہ سے گزر گیا، ابن الاحثم کو اس جال کا احساس ہوا اور وہ شام کی طرف بھاگ گیا: برسوں اس کے گلے میں شراب اور سن، پھر ایک آنکھ پر چیتھڑا اور روئی، ابو طوطینا کو آئل مین کا اسٹائل - یہاں تک کہ الولید کی موت ہو گئی اور سلیمان نے جب تک کہ جب ولید کی موت ہو گئی اور سلیمان نے بغاوت شروع کر دی۔ حجاج اور قتیبہ پر حملوں کے ساتھ سلیمان - 'ابو طوطینا تیل والا، مردوں میں سب سے زیادہ فصیح'۔ خط پڑھتے ہوئے قتیبہ نے بنو احتھم کو مارا، نو مارے گئے۔ بشیر نے کہا 'میرا عذر یاد رکھنا' - 'تم نے ایک پاؤں آگے کیا اور دوسرا پیچھے کیا، خدا کے دشمن' - اور ان سب کو مار ڈالا۔ وکیع بن ابی سعود، تمیم کے حکم سے دبی کے لیے معزول ہوئے، اس وقت قسم کھائی، ظہر اور عصر چھوٹ گئی، اور جب اس سے پوچھا گیا: 'میں اس رب سے کیسے دعا کروں جس نے ہمارے بہترین لڑکوں کو مار ڈالا اور ان کے لیے ناراض نہیں ہوا؟'"
  tr: "Abdullah ibn Abdullah ibn el-Ahtham, Ebu Hakan, Kuteybe sefere çıktığında Merv'de onun vekiliydi. El-Haccac'a Kuteybe ve kendisine gelen para hakkında bilgi veren bir mektup yazdı. Beni el-Ahtham kabilesinden Beşir onu uyardı ve şöyle dedi: \"Abdullah'a çok yakınlaştın, o kinci ve kıskanç bir adam. Seni görevden alıp bizi yoldan çıkaracağından emin olamayız.\" El-Haccac, \"Bunu kuzenine duyduğun kıskançlıktan mı söyledin?\" dedi. El-Haccac, \"Öyleyse özür dilerim. Eğer öyleyse, özür dilerim.\" dedi. El-Haccac'a yazdıklarını yazdıktan sonra, El-Haccac mektubunu Kuteybe'ye katladı. Elçi geldi ve Merv'deki sokağa gidip mektubun yanından geçti, ancak Abdullah gelmedi. Kötülüğü sezdi ve Suriye'ye kaçtı. Bir süre boynuna bağladığı bohça içinde şarap ve keten satarak dolaştı. Sonra gözlerinden birinin üzerine bir bez ve pamuk koyup bandajladı ve Ebu Tina lakabını aldı. Yağ satardı. Bu halde, el-Valid ibn Abd el-Malik ölüp Süleyman iktidara gelinceye kadar kaldı. O pisliği ve bezi çıkardı ve Süleyman'ı tebrik eden, el-Haccac ve Kuteybe'ye saldıran bir konuşma yaptı. Bunun üzerine insanlar \"Ebu Tina\" diye dağıldılar. El-Zeyye halkı bilgilendirdi ve İbn el-Ahtam'ın el-Haccac'a yazdığı mektup Kuteybe'ye ulaşınca, kuzenlerini ve oğullarını katletti; bunlardan biri de Şeybe Ebu Şabib'di. Beşir de dahil olmak üzere dokuz kişiyi öldürdü. Beşir ona, \"Sana mazeretimi söyle\" dedi. O da, \"Ey Allah'ın düşmanı, birini öne, diğerini arkaya koydum\" dedi ve hepsini öldürdü. Vaki ibn Abi Sud, daha önce Horasan'daki Beni Tamim kabilesinin başındaydı. Kuteybe onu kabileden uzaklaştırdı ve yerine Beni Dirar el-Dhabi kabilesinden birini atadı. Onları öldürdüğünde, \"Onu öldürürsem ve onu özlerlerse, Allah beni öldürsün\" dedi. Bu yüzden öğle ve ikindi namazlarını kılmadı. Ona, \"Namaz kılmadın\" dediler. O da, \"Çocukken çoğumuzu öldüren ve onlar için öfkelenmeyen bir Rabbime nasıl namaz kılabilirim ki?\" dedi."
  id: "Abdullah ibn Abdullah ibn al-Ahtham, Abu Haqan, adalah wakil Qutaybah di Merv ketika ia pergi berperang. Ia menulis surat kepada al-Hajjaj, memberitahukannya tentang Qutaybah dan uang yang telah diterimanya. Bashir, salah seorang dari Bani al-Ahtham, memperingatkannya, dengan berkata, \"Kau telah terlalu dekat dengan Abdullah, dan dia adalah orang yang pendendam dan iri hati. Kita tidak bisa yakin dia akan memecatmu dan merusak kita.\" Bashir bertanya, \"Bukankah kau mengatakan ini karena iri hati kepada sepupumu?\" Al-Hajjaj menjawab, \"Kalau begitu, maafkan aku. Jika memang demikian, maka maafkan aku.\" Ketika ia menulis surat kepada al-Hajjaj, al-Hajjaj melipat suratnya kepada Qutaybah. Utusan itu datang dan pergi ke gang di Merv dan melewatinya, tetapi Abdullah tidak datang. Ia merasakan adanya kejahatan dan melarikan diri ke Suriah. Ia tinggal di sana untuk sementara waktu, menjual anggur dan linen dalam bundelan di lehernya, berkeliling dengan barang-barang itu. Kemudian ia menutupi salah satu matanya dengan kain dan kapas, lalu membalutnya, dan ia mengambil julukan Abu Tina. Ia biasa berjualan minyak. Ia tetap dalam keadaan ini hingga al-Walid ibn Abd al-Malik meninggal dan Sulaiman berkuasa. Ia melepaskan kain dan kotoran itu, lalu berpidato mengucapkan selamat kepada Sulaiman dan menyerang al-Hajjaj dan Qutaybah. Maka orang-orang bubar sambil berkata, \"Abu Tina.\" Al-Zayyat memberi tahu orang-orang, dan ketika surat Ibn Al-Ahtham kepada Al-Hajjaj sampai ke Qutaybah, ia membantai sepupu-sepupunya dan putra-putranya, dan salah satunya adalah Shaybah Abu Shabib. Ia membunuh sembilan orang, termasuk Bashir. Bashir berkata kepadanya, \"Sebutkan alasanku kepadamu.\" Ia berkata, \"Aku menempatkan satu orang di depan dan satu orang di belakang, wahai musuh Allah.\" Maka ia membunuh mereka semua. Waki’ ibn Abi Sud sebelumnya memimpin Bani Tamim di Khorasan, sehingga Qutaybah memecatnya dan menunjuk seorang pria dari Bani Dirar Al-Dhabi. Ketika ia membunuh mereka, ia berkata, “Semoga Allah membunuhku jika aku membunuhnya dan mereka merindukannya.” Maka ia tidak melaksanakan salat Zuhur atau Asar. Mereka berkata kepadanya, “Engkau tidak salat.” Ia menjawab, “Lalu bagaimana aku dapat salat kepada Tuhan yang telah membunuh sebagian besar dari kita ketika masih anak-anak dan tidak murka atas kematian mereka?”"
