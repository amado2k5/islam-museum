label: { ar: "بعثة أبي عبيد إلى العراق", en: "Abu Ubayd's Dispatch to Iraq", fr: "Envoi d’Abu Ubayd en Irak", es: "Mensaje de Abu Ubayd a Irak", ur: "ابو عبید کی عراق روانگی", tr: "Ebu Ubeyd'in Irak misyonu", id: "Misi Abu Ubaid ke Irak" }
summary:
  ar: "عند البلاذري: لما استُخلف عمر وجّه أبا عبيد بن مسعود بن عمرو بن عمير بن عوف بن عقدة بن غيرة بن عوف بن ثقيف — وهو أبو المختار بن أبي عبيد — إلى العراق في ألف وكتب إلى المثنى يأمره بتلقيه والسمع والطاعة له وبعث معه سليط بن قيس بن عمرو الأنصاري وقال له لولا عجلة فيك لوليتك ولكن الحرب زبون لا يصلح لها إلا الرجل المكيث فأقبل أبو عبيد لا يمر بقوم من العرب إلا رغّبهم في الجهاد والغنيمة فصحبه خلق فلما صار بالمذيب بلغه أن جابان الأعجمي بتستر في جمع كثير فلقيه فهزم جمعه وأسر منهم ثم أتى درنى وبها جمع للعجم فهزمهم إلى كسكر وسار إلى الجالينوس وهو بباروسما فصالحه ابن الأندرزغز عن كل رأس على أربعة دراهم على أن ينصرف ووجّه المثنى إلى زندورد فوجدهم قد نقضوا فحاربهم فظفر وسبى ووجّه عروة بن زيد الخيل الطائي إلى الزوابي فصالح دهقانها على مثل صلح باروسما."
  en: "In al-Baladhuri: when Umar succeeded he sent Abu Ubayd ibn Mas'ud ibn Amr ibn Umayr ibn Awf ibn Uqda ibn Ghiyara ibn Awf ibn Thaqif — being Abu al-Mukhtar ibn Abi Ubayd — to Iraq in a thousand, writing al-Muthanna to receive, hear and obey him, and sent with him Salit ibn Qays ibn Amr al-Ansari, telling him 'but for the haste in you I'd have appointed you — war is cunning, only the patient man suits it.' Abu Ubayd came on urging every Arab tribe to jihad and booty till a host joined him; at al-Mudhayyib he heard Jaban the Persian was at Tustar in a great host — met him, routed his host and took captives; then to Durna whose Persian host he routed to Kaskar; then to the Jalinus at Barusma where Ibn al-Andarzghar made peace at four dirhams a head on withdrawing; he sent al-Muthanna to Zandaward — found repudiated, fought, prevailed and captured — and Urwa ibn Zayd al-Khayl al-Ta'i to al-Zawabi whose dihqan he pacified on Barusma's terms."
  fr: "Selon al-Baladhuri, à son avènement Omar envoya en Irak Abu Ubayd ibn Mas'ud ibn Amr ibn Umayr ibn Awf ibn Uqda ibn Ghiyara ibn Awf ibn Thaqif, Abu al-Mukhtar ibn Abi Ubayd, avec mille hommes. Il écrivit à al-Muthanna de le recevoir, de l’écouter et de lui obéir, et envoya avec lui Salit ibn Qays ibn Amr al-Ansari, lui disant : « Sans ta précipitation, je t’aurais nommé ; la guerre est ruse, seul l’homme patient lui convient. » Abu Ubayd exhorta chaque tribu arabe au jihad et au butin, jusqu’à réunir une multitude. À al-Mudhayyib, il apprit que Jaban le Perse était à Tustar avec de grandes forces ; il l’affronta, le vainquit et fit des captifs. Puis il mit en déroute les Perses de Durna jusqu’à Kaskar et marcha contre al-Jalinus à Barusma, où Ibn al-Andarzghar conclut la paix à quatre dirhams par tête en échange de son retrait. Il envoya al-Muthanna à Zandaward, qui avait rompu l’accord : celui-ci combattit, vainquit et fit des captifs. Il envoya Urwa ibn Zayd al-Khayl al-Ta'i à al-Zawabi, dont le dihqan conclut un accord aux conditions de Barusma."
  es: "En al-Baladhuri: cuando Umar tuvo éxito, envió a Abu Ubayd ibn Mas'ud ibn Amr ibn Umayr ibn Awf ibn Uqda ibn Ghiyara ibn Awf ibn Thaqif —siendo Abu al-Mukhtar ibn Abi Ubayd— a Irak en mil, escribiendo a al-Muthanna para que lo recibiera, escuchara y obedeciera, y envió con él a Salit ibn Qays ibn Amr al-Ansari, diciéndole: «si no fuera por la prisa que hay en ti, te habría nombrado; la guerra es astuta, solo el hombre paciente es apto para ella». Abu Ubayd siguió instando a cada tribu árabe a la yihad y al botín hasta que un ejército se unió a él; en al-Mudhayyib oyó que Jaban el Persa estaba en Tustar en un gran ejército; lo encontró, derrotó a su ejército y tomó cautivos; luego a Durna, cuyo ejército persa derrotó hasta Kaskar; Luego, a Jalinus en Barusma, donde Ibn al-Andarzghar hizo las paces por cuatro dirhams por adelantado al retirarse; envió a al-Muthanna a Zandaward —donde fue repudiado, luchó, prevaleció y fue capturado— y a Urwa ibn Zayd al-Khayl al-Ta'i a al-Zawabi, cuyo dihqan pacificó en los términos de Barusma."
  ur: "البلادوری میں ہے: جب عمر کامیاب ہوئے تو انہوں نے ابو عبید بن مسعود بن عمرو بن عمیر بن عوف بن عقدہ بن غیارہ بن عوف ابن ثقیف کو ایک ہزار کی تعداد میں عراق بھیجا اور اس کے ساتھ صلوٰۃ المختار لکھ کر بھیجا۔ ابن قیس بن عمرو الانصاری نے اس سے کہا 'لیکن میں نے آپ کو جلد بازی کے لئے مقرر کیا تھا - جنگ ایک چالاک ہے، صرف صبر کرنے والا آدمی اس کے مطابق ہوتا ہے'۔ ابو عبید ہر عرب قبیلے کو جہاد اور مال غنیمت کی تلقین کرتے ہوئے آئے یہاں تک کہ ایک میزبان اس کے ساتھ شامل ہو گیا۔ المذائب میں اس نے سنا جبان فارسی ایک عظیم میزبان کے ساتھ تستار میں تھا - اس سے ملا، اس کے میزبان کو بھگا دیا اور قیدیوں کو لے گیا۔ پھر دُرنا کی طرف جس کے فارسی میزبان اس نے کاسکر کو روانہ کیا۔ پھر بروسما میں جالینس تک جہاں ابن الاندرزغر نے واپسی پر چار درہم پر صلح کی تھی۔ اس نے المثنٰی کو زنداورد کے پاس بھیجا - اسے مسترد کیا گیا، لڑا گیا، غالب آیا اور پکڑا گیا - اور عروہ بن زید الخیل الطائی کو الزوابی کے پاس بھیجا گیا جس کے دہقان کو اس نے بروسما کی شرائط پر تسلی دی تھی۔"
  tr: "El-Baladhuri'ye göre: Ömer halife olunca, Ebu Ubeyd ibn Mes'ud ibn Amr ibn Umeyr ibn Awf ibn Uqdah ibn Ghayrah ibn Awf ibn Thaqif'i (ki kendisi el-Mukhtar ibn Abi Ubeyd'in babasıdır) bin adamla Irak'a gönderdi. El-Muthanna'ya mektup yazarak onu karşılamasını ve kendisine itaat etmesini emretti. Ona Sulayt ibn Qays ibn Amr el-Ensari'yi de göndererek, \"Aceleci olmasaydın seni atardım, fakat savaş zor bir iştir ve ancak sabırlı bir adam buna uygundur\" dedi. Böylece Ebu Ubeyd yola çıktı ve nerede bir Arap topluluğuyla karşılaşırsa, onları cihada katılmaya ve ganimet almaya teşvik etti. Birçoğu ona eşlik etti. El-Mudhib'e vardığında, Persli Jaban'ın Tustar'da büyük bir orduyla olduğunu öğrendi. Onunla karşılaştı, ordusunu yendi ve bazılarını esir aldı. Sonra Darna'ya gitti; orada bir Pers ordusu toplanmıştı ve onları Kaskar'da yenilgiye uğrattı. Barusma'da bulunan Celinus'a yürüdü ve İbn el-Andarzaghz, her bir kafa için dört dirhem ödeyerek, Celinus'un geri çekilmesi şartıyla onunla barış yaptı. El-Muthanna'yı Zandurd'a gönderdi, ancak orada anlaşmanın bozulduğunu gördü. Onlarla savaştı, zafer kazandı ve esirler aldı. Urve ibn Zeyd el-Hayl el-Ta'i'yi El-Zawabi'ye gönderdi ve o da Barusma ile aynı şartlarda oradaki heyetle barış yaptı."
  id: "Menurut al-Baladhuri: Ketika Umar menjadi Khalifah, ia mengutus Abu Ubayd ibn Mas'ud ibn Amr ibn Umayr ibn Awf ibn Uqdah ibn Ghayrah ibn Awf ibn Thaqif—yang merupakan ayah dari al-Mukhtar ibn Abi Ubayd—ke Irak dengan seribu orang. Ia menulis surat kepada al-Muthanna, memerintahkannya untuk menerimanya dan menaatinya. Ia mengutus Sulayt ibn Qays ibn Amr al-Ansari bersamanya, dan berkata kepadanya, \"Seandainya bukan karena tergesa-gesamu, aku pasti sudah menunjukmu, tetapi perang adalah urusan yang sulit, dan hanya orang yang sabar yang cocok untuk itu.\" Maka Abu Ubayd berangkat, dan di mana pun ia melewati sekelompok orang Arab, ia mendorong mereka untuk bergabung dalam jihad dan mengambil rampasan perang. Banyak yang menemaninya. Ketika ia sampai di al-Mudhib, ia mengetahui bahwa Jaban orang Persia berada di Tustar dengan pasukan yang besar. Dia bertemu dengannya, mengalahkan pasukannya, dan menawan beberapa dari mereka. Kemudian dia pergi ke Darna, tempat pasukan Persia berkumpul, dan dia mengalahkan mereka hingga ke Kaskar. Dia berbaris ke Jalinus, yang berada di Barusma, dan Ibn al-Andarzaghz berdamai dengannya, membayar empat dirham untuk setiap kepala dengan syarat dia akan mundur. Dia mengirim al-Muthanna ke Zandurd, tetapi dia mendapati bahwa mereka telah melanggar perjanjian. Dia melawan mereka, menang, dan menawan beberapa orang. Dia mengirim Urwah ibn Zayd al-Khayl al-Ta'i ke Al-Zawabi, sehingga dia berdamai dengan dehqan di sana dengan syarat yang sama seperti di Barusma."
