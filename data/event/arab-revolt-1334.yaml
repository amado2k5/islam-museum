label: { ar: "الثورة العربية الكبرى", en: "The Arab Revolt" }
summary:
  ar: "الثورة العربية الكبرى انتفاضة أعلنها الشريف الحسين بن علي شريف مكة على الحكم العثماني في الحجاز يوم 10 يونيو 1916م أثناء الحرب العالمية الأولى، بعد مفاوضات مع البريطانيين ومع جمعيات عربية سرية. قاد ابنه فيصل جيوشها نحو سنتين، وبلغ دمشق في أكتوبر 1918م. وتصفها مداخل دائرة المعارف الإسلامية وصفًا مختلفًا، فتراها حركة عربية أو انتفاضة أسرية انفصالية أو حركة شجعتها بريطانيا."
  en: "The Arab Revolt was the rising proclaimed by Sharif Husayn ibn Ali of Mecca against Ottoman rule in the Hijaz on 10 June 1916, during the First World War, after talks with the British and with secret Arab societies. His son Faysal commanded its armies for about two years and reached Damascus in October 1918. The Encyclopaedia of Islam describes it differently in different entries, as an Arab movement, a dynastic separatist rising, or a movement encouraged by Britain."
  ur: "عرب بغاوت وہ تحریک تھی جس کا اعلان مکہ کے شریف حسین بن علی نے پہلی جنگ عظیم کے دوران 10 جون 1916ء کو حجاز میں عثمانی حکومت کے خلاف کیا، برطانویوں اور خفیہ عرب انجمنوں سے بات چیت کے بعد۔ ان کے بیٹے فیصل نے تقریباً دو سال اس کی فوجوں کی قیادت کی اور اکتوبر 1918ء میں دمشق پہنچے۔ دائرۃ المعارف اسلامیہ کے مضامین اسے مختلف طرح بیان کرتے ہیں: عرب تحریک، خاندانی علیحدگی پسند بغاوت، یا برطانیہ کی شہ پر اٹھنے والی تحریک۔"
