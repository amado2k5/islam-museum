label:
  ar: "قتل رجل من معسكر الحكمي وطبري جريح في معسكره، ص297"
  en: "A man of the Hakami's camp and a wounded Tabari kill each other, p. 297"
  ur: "حکمی کے لشکر کے ایک آدمی اور ایک زخمی طبری کا ایک دوسرے کو مارنا، ص297"
summary:
  ar: "ينظر الهادي إلى رجل من معسكر الحكمي يضرب بسيفه جماعة من الطبريين وقد جُرحوا وصُرعوا في حلقة، فيقول من يقتله، فيقوم رجل من الطبريين الجرحى فيأخذ الرمح ويطعنه ثم يسقط كل منهما ميتاً."
  en: "Al-Hadi sees a man of the Hakami's camp striking with his sword at a group of Tabaris who have been wounded and lie in a ring, and asks whether there is no man to kill him; a wounded Tabari rises, takes a spear and thrusts him, and each of the two falls dead."
  ur: "ہادی حکمی کے لشکر کے ایک آدمی کو دیکھتے ہیں جو اپنی تلوار سے طبریوں کی ایک جماعت کو مار رہا ہے جو زخمی ہو کر حلقہ بنائے پڑے ہیں، وہ پوچھتے ہیں کہ کوئی ہے جو اسے مارے؛ ایک زخمی طبری اٹھتا ہے، نیزہ لے کر اسے مارتا ہے اور دونوں مر کر گر پڑتے ہیں۔"
