id: event/ahnaf-balkh-khwarizm
class: event
kind: conquest
label: { ar: "صلح بلخ ومسير الأحنف إلى خوارزم", en: "Balkh's Sulh and al-Ahnaf's Khwarizm March", fr: "L’accord de Balkh et la marche d’al-Ahnaf sur le Khwarizm", es: "La marcha de Sulh de Balkh y Khwarizm de al-Ahnaf", ur: "بلخ کا سلح اور الاحناف کا خوارزم مارچ", tr: "Belh Antlaşması ve el-Ahnaf'ın Harezm'e yürüyüşü", id: "Perjanjian Balkh dan perjalanan al-Ahnaf ke Khwarazm" }
summary:
  ar: "فتح الأحنف الطالقان صلحاً وفتح الفارياب ويقال بل فتحها أمير بن أحمر ثم سار إلى بلخ وهي مدينة طخارا فصالحه أهلها على أربعمائة ألف ويقال سبعمائة ألف وذلك أثبت فاستعمل على بلخ أسيد بن المتشمس ويقال ابن أخي الأحنف ثم سار إلى خوارزم وهي من سقي النهر جميعاً ومدينتها شرقية فلم يقدر عليها فانصرف إلى بلخ وقد جبى أسيد صلحها."
  en: "Al-Ahnaf took Talaqan by sulh and Faryab — or Umair ibn al-Ahmar did — then marched on Balkh, the city of the Tukhara, whose people truced at four hundred thousand, or seven hundred on the sounder report; he left Asid ibn al-Mutashammis — some say his nephew — over it, then went against Khwarizm, all beyond the river with an eastern city, could not take it, and came back to a Balkh whose sulh Asid had already levied."
  fr: "Al-Ahnaf prit Talaqan par accord et Faryab — ou ce fut Umair ibn al-Ahmar — puis marcha sur Balkh, ville des Tukhara, dont les habitants conclurent une trêve à quatre cent mille, ou sept cent mille selon le récit jugé plus sûr. Il y laissa Asid ibn al-Mutashammis, son neveu selon certains, puis marcha contre le Khwarizm, entièrement situé au-delà du fleuve et doté d’une ville orientale. Ne pouvant le prendre, il revint à Balkh, dont Asid avait déjà perçu le tribut de paix."
  es: "Al-Ahnaf tomó Talaqan por sulh y Faryab —o lo hizo Umair ibn al-Ahmar— luego marchó sobre Balkh, la ciudad de Tukhara, cuya gente pagó una tregua de cuatrocientos mil hombres, o setecientos según el informe más fiable; dejó a Asid ibn al-Mutashammis —algunos dicen que su sobrino— al mando de ella, luego fue contra Khwarizm, todo al otro lado del río con una ciudad oriental, no pudo tomarla y regresó a un Balkh cuyo sulh Asid ya había recaudado."
  ur: "الاحناف نے سلح اور فاریاب کے ذریعے طلقان پر قبضہ کیا - یا عمیر ابن الاحمر نے کیا - پھر بلخ پر کوچ کیا، تخارا کے شہر، جس کے لوگ چار لاکھ، یا سات سو کی تعداد پر فتح پائے۔ اس نے اسید بن المتشمس کو چھوڑ دیا - کچھ کہتے ہیں کہ اس کے بھتیجے - پھر خوارزم کے خلاف چلے گئے، ایک مشرقی شہر کے ساتھ دریا کے اس پار، اسے نہ لے سکا، اور واپس بلخ میں آیا جس پر سل اسید پہلے ہی ٹیکس لگا چکا تھا۔"
  tr: "El-Ahnaf, Talqan'ı barışçıl bir şekilde fethetti ve El-Faryab'ı da ele geçirdi. Rivayetlere göre, Emir ibn Ahmar burayı fethetti. Sonra Takhara şehri olan Belh'e yürüdü ve halkı dört yüz bin, hatta yedi yüz bin (ki bu daha güvenilir) karşılığında onunla barış yaptı. Belh'in başına Asid ibn el-Mutashammis'i atadı, ya da denildiğine göre El-Ahnaf'ın yeğeni. Sonra nehirle sulanan ve doğuda bulunan Harezm'e yürüdü. Burayı fethedemeyince Belh'e geri döndü ve Asid barış teklifini toplamıştı."
  id: "Al-Ahnaf menaklukkan Talqan secara damai dan menaklukkan Al-Faryab. Dikatakan bahwa Amir ibn Ahmar menaklukkannya. Kemudian ia bergerak ke Balkh, yang merupakan kota Takhara, dan penduduknya berdamai dengannya dengan imbalan empat ratus ribu, atau dikatakan tujuh ratus ribu, dan itu lebih dapat dipercaya. Ia menunjuk Asid ibn al-Mutashammis untuk menguasai Balkh, atau dikatakan keponakan Al-Ahnaf. Kemudian ia bergerak ke Khwarazm, yang seluruhnya diairi oleh sungai, dan kotanya terletak di timur. Ia tidak dapat menaklukkannya, sehingga ia kembali ke Balkh, dan Asid telah mengumpulkan persembahan perdamaiannya."
