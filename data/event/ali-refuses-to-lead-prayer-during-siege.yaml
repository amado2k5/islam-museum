id: event/ali-refuses-to-lead-prayer-during-siege
class: event
kind: other
label: { ar: "علي يمتنع عن إمامة الناس والخليفة محصور", en: "Ali refuses to lead prayer while the caliph is besieged", es: "Ali se niega a dirigir la oración mientras el califa está asediado.", fr: "Ali refuse de diriger la prière pendant que le calife est assiégé.", ur: "علی نے نماز پڑھانے سے انکار کر دیا جب کہ خلیفہ کا محاصرہ کیا گیا تھا۔" }
summary:
  ar: "حين حاصر الثائرون عثمان في داره، دعا الناس علياً ليصلي بهم، فامتنع قائلاً إنه لا يصلي بهم والإمام محصور، وصلى وحده وانصرف، وترك ابنيه مع أبناء صحابة لحراسة دار الخليفة {cite:abqariyyat-ali-aqqad p.62}. ويقرأ العقاد الموقف على أنه إعلان أن الاعتداء على الخليفة اعتداء على كل ذي قدر في الإسلام، لعل الثائرين يرتدعون {cite:abqariyyat-ali-aqqad p.62}."
  en: "When the rebels surrounded Uthman in his house, people asked Ali to lead the prayer; he refused, saying he would not lead them while the imam was besieged, prayed alone and went home, leaving his sons with the sons of other companions to guard the caliph's house {cite:abqariyyat-ali-aqqad p.62}. Al-Aqqad reads this as a warning that attacking the caliph was an attack on every notable in Islam {cite:abqariyyat-ali-aqqad p.62}."
  es: "Cuando los rebeldes rodearon a Uthman en su casa, la gente le pidió a Ali que dirigiera la oración; él se negó, diciendo que no los dirigiría mientras el imán estuviera asediado, oró solo y se fue a casa, dejando a sus hijos con los hijos de otros compañeros para que custodiaran la casa del califa {cite:abqariyyat-ali-aqqad p.62}. Al-Aqqad interpreta esto como una advertencia de que atacar al califa era atacar a toda figura importante del Islam {cite:abqariyyat-ali-aqqad p.62}."
  fr: "Lorsque les rebelles encerclèrent Uthman dans sa maison, on demanda à Ali de diriger la prière; il refusa, déclarant qu’il ne pouvait pas les diriger tant que l’imam était assiégé. Il pria seul et rentra chez lui, laissant ses fils avec ceux d’autres compagnons pour garder la maison du calife (voir: Abqariyyat Ali Aqqad, p. 62). Al-Aqqad interprète cela comme un avertissement: attaquer le calife revenait à attaquer toute figure importante de l’islam (voir: Abqariyyat Ali Aqqad, p. 62)."
  ur: "جب باغیوں نے عثمان کو ان کے گھر میں گھیر لیا تو لوگوں نے علی سے کہا کہ وہ نماز پڑھائیں۔ اس نے یہ کہتے ہوئے انکار کر دیا کہ جب امام کا محاصرہ ہو تو وہ ان کی امامت نہیں کرے گا، تنہا نماز ادا کی اور گھر چلا گیا، اپنے بیٹوں کو دوسرے اصحاب کے بیٹوں کے ساتھ خلیفہ کے گھر کی حفاظت کے لیے چھوڑ دیا۔ العقاد اسے ایک تنبیہ کے طور پر پڑھتا ہے کہ خلیفہ پر حملہ کرنا اسلام میں ہر قابل ذکر پر حملہ ہے۔"
