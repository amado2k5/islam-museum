id: event/ali-refuses-to-lead-prayer-during-siege
class: event
kind: other
label: { ar: "علي يمتنع عن إمامة الناس والخليفة محصور", en: "Ali refuses to lead prayer while the caliph is besieged" }
summary:
  ar: "حين حاصر الثائرون عثمان في داره، دعا الناس علياً ليصلي بهم، فامتنع قائلاً إنه لا يصلي بهم والإمام محصور، وصلى وحده وانصرف، وترك ابنيه مع أبناء صحابة لحراسة دار الخليفة {cite:abqariyyat-ali-aqqad p.62}. ويقرأ العقاد الموقف على أنه إعلان أن الاعتداء على الخليفة اعتداء على كل ذي قدر في الإسلام، لعل الثائرين يرتدعون {cite:abqariyyat-ali-aqqad p.62}."
  en: "When the rebels surrounded Uthman in his house, people asked Ali to lead the prayer; he refused, saying he would not lead them while the imam was besieged, prayed alone and went home, leaving his sons with the sons of other companions to guard the caliph's house {cite:abqariyyat-ali-aqqad p.62}. Al-Aqqad reads this as a warning that attacking the caliph was an attack on every notable in Islam {cite:abqariyyat-ali-aqqad p.62}."
