    summary:
      ar: "يرى العقاد أن معاوية كان أقدر على حماية عثمان لو أراد، أما علي فكان بين الخليفة والثائرين ويُتهم من الطرفين {cite:abqariyyat-ali-aqqad p.63}. وهذا حكم المؤلف، ويعرضه هنا بوصفه قراءة."
      en: "Al-Aqqad holds that Muawiya had more means to protect Uthman had he wished it, while Ali stood between the caliph and the rebels and was blamed by both {cite:abqariyyat-ali-aqqad p.63}. This is the author's judgement, recorded here as a reading."
