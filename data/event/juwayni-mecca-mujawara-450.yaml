class: event
kind: other
label:
  ar: "مجاورة الجويني بالحرمين أربع سنين، ٤٥٠–٤٥٤هـ"
  en: "Al-Juwayni's four years of residence at the two sanctuaries, 450–454/1058–1062"
  ur: "جوینی کی حرمین میں چار سالہ مجاورت، 450–454ھ/1058–1062ء"
summary:
  ar: "بلغ الجويني الحجاز سنة ٤٥٠هـ/١٠٥٨م فجاور بمكة والمدينة أربع سنين يدرس ويفتي ويجمع طرق المذهب، ومن هناك لُقب «إمام الحرمين» {cite:encyclopaedia-of-islam-2 vol. 2 p. 605} {cite:tarikh-islam-dhahabi p. 230}؛ ويروي شذرات الذهب أنه أقام بمكة أربع سنين يدرس ويفتي فقيل له إمام الحرمين {cite:shadharat-dhahab p. 310}."
  en: "Al-Juwayni reached the Hijaz in 450/1058 and resided at Mecca and Medina for four years, teaching, giving fatwas and gathering the paths of the school — whence his honorary title 'Imam of the two sanctuaries' {cite:encyclopaedia-of-islam-2 vol. 2 p. 605} {cite:tarikh-islam-dhahabi p. 230}; Shadharat al-Dhahab likewise says he stayed at Mecca four years teaching and giving legal opinions, so he was called Imam al-Haramayn {cite:shadharat-dhahab p. 310}."
  ur: "جوینی 450ھ/1058ء میں حجاز پہنچے اور مکہ و مدینہ میں چار سال مقیم رہے، درس دیتے، فتویٰ دیتے اور مذہب کی طرق جمع کرتے رہے — یہیں سے انھیں 'امام الحرمین' کا لقب ملا {cite:encyclopaedia-of-islam-2 vol. 2 p. 605} {cite:tarikh-islam-dhahabi p. 230}؛ شذرات الذہب کے مطابق بھی وہ مکہ میں چار سال درس و افتاء کرتے رہے جس سے یہ لقب پڑا {cite:shadharat-dhahab p. 310}۔"
