id: event/jarrah-governorship-armenia
class: event
kind: campaign
label: { ar: "ولاية الجرّاح بن عبد الله على أرمينية", en: "Al-Jarrah ibn Abdallah's Governorship of Armenia", es: "El gobierno de Armenia bajo el mandato de Al-Jarrah ibn Abdallah", fr: "Gouvernorat d'Al-Jarrah ibn Abdallah en Arménie" }
summary:
  ar: "عند البلاذري: ولّى سليمان بن عبد الملك أرمينية عديّ بن عديّ بن عميرة الكندي — وكان عديّ بن عميرة ممن نزل الرقة مفارقاً لعلي بن أبي طالب — ثم ولّاه إياها عمر بن عبد العزيز وهو صاحب نهر عدي بالبيلقان، وروى بعضهم أن عامل عمر كان حاتم بن النعمان وليس ذلك بثبت؛ ثم ولّى يزيد بن عبد الملك معلق بن صفار البهراني ثم عزله وولّى الحارث بن عمرو الطائي فغزا أهل اللكز ففتح رستاق حسمدان، وولّى الجرّاح بن عبد الله الحكمي من مذحج أرمينية فنزل برذعة فرفع إليه اختلاف مكاييلها وموازينها فأقامها على العدل والوفاء واتخذ مكيالاً يدعى الجرّاحي فأهلها يتعاملون به إلى اليوم، ثم إنه عبر الكُرّ وسار حتى قطع النهر المعروف بالسمور وصار إلى الخزر فقتل منهم مقتلة عظيمة وقاتل أهل بلاد حمزين ثم صالحهم على أن نقلهم إلى رستاق."
  en: "In al-Baladhuri: Sulayman ibn Abd al-Malik gave Armenia to Adi ibn Adi ibn Amira al-Kindi — Adi ibn Amira being one of those who settled al-Raqqa having parted with Ali ibn Abi Talib — then Umar ibn Abd al-Aziz appointed him, he being the owner of the Nahr Adi at al-Baylaqan, though some say Umar's governor was Hatim ibn al-Nu'man, which is unsound; then Yazid ibn Abd al-Malik appointed Mi'laq ibn Saffar al-Bahrani, removed him for al-Harith ibn Amr al-Ta'i, who raided the Lakz and took Rustaq Hamsadan; and al-Jarrah ibn Abdallah al-Hakami of Mudhhij governed Armenia, settling at Bardha'a, where its conflicting measures and weights were laid before him and he set them on justice and fulness, making a measure called al-Jarrahi which its people deal by to this day; then he crossed the Kurr and marched until he passed the river called al-Samur, reaching the Khazars and killing them in a great slaughter, and fought the people of Bilad Hamzin, then compounded with them to transfer them to a rustaq."
  es: "En al-Baladhuri: Sulayman ibn Abd al-Malik dio Armenia a Adi ibn Adi ibn Amira al-Kindi — Adi ibn Amira siendo uno de los que se establecieron en al-Raqqa tras separarse de Ali ibn Abi Talib — luego Umar ibn Abd al-Aziz lo nombró, siendo él el dueño del Nahr Adi en al-Baylaqan, aunque algunos dicen que el gobernador de Umar era Hatim ibn al-Nu'man, lo cual no es sólido; luego Yazid ibn Abd al-Malik nombró a Mi'laq ibn Saffar al-Bahrani, lo destituyó por al-Harith ibn Amr al-Ta'i, quien saqueó el Lakz y tomó Rustaq Hamsadan; y al-Jarrah ibn Abdallah al-Hakami de Mudhhij gobernó Armenia, estableciéndose en Bardha'a, donde sus medidas y pesos conflictivos fueron puestos ante él y los ajustó a la justicia y la plenitud, creando una medida llamada al-Jarrahi que su gente sigue utilizando hasta el día de hoy; luego cruzó el Kurr y marchó hasta pasar el río llamado al-Samur, llegando a los jázaros y matándolos en una gran matanza, y luchó contra la gente de Bilad Hamzin, luego llegó a un acuerdo con ellos para transferirlos a un rustaq."
  fr: "Dans al-Baladhuri: Sulayman ibn Abd al-Malik donna l'Arménie à Adi ibn Adi ibn Amira al-Kindi — Adi ibn Amira étant l'un de ceux qui s'installèrent à al-Raqqa après s'être séparé d'Ali ibn Abi Talib — puis Umar ibn Abd al-Aziz le nomma, étant le propriétaire du Nahr Adi à al-Baylaqan, bien que certains disent que le gouverneur d'Umar était Hatim ibn al-Nu'man, ce qui est infondé; puis Yazid ibn Abd al-Malik nomma Mi'laq ibn Saffar al-Bahrani, le destitua pour al-Harith ibn Amr al-Ta'i, qui pilla le Lakz et prit Rustaq Hamsadan; et al-Jarrah ibn Abdallah al-Hakami de Mudhhij gouverna l'Arménie, s'installant à Bardha'a, où les mesures et les poids contradictoires lui furent présentés et il les établit sur la justice et la plénitude, créant une mesure appelée al-Jarrahi que son peuple utilise encore aujourd'hui; puis il traversa le Kurr et marcha jusqu'à ce qu'il dépasse la rivière appelée al-Samur, atteignant les Khazars et les tuant dans un grand massacre, et combattit les habitants de Bilad Hamzin, puis s'allia avec eux pour les transférer dans un rustaq."
