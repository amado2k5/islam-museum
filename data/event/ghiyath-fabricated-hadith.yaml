label: { ar: "حديث غياث المكذوب وأشهد أن قفاك قفا كذاب", en: "Ghiyath's Fabricated Hadith and 'Your Nape Is a Liar's Nape'" }
summary:
  ar: "قدم على المهدي بعشرة محدثين منهم فرج بن فضالة وغياث بن إبراهيم، وكان المهدي يحب الحمام، فلما دخل غياث حدثه عن أبي هريرة مرفوعاً لا سبق إلا في حافر أو نصل وزاد فيه أو جناح، فأمر له المهدي بعشرة آلاف درهم فلما قام قال أشهد أن قفاك قفا كذاب وإنما استجلبت ذلك، ثم أمر بالحمام فذبحت {cite:tarikh-khulafa-minhaj-1434 p. 445}."
  en: "Among ten hadith-men brought before al-Mahdi was Ghiyath ibn Ibrahim; the caliph loved pigeons, so Ghiyath transmitted from Abu Hurayra 'there is no wagered race save on hoof or arrowhead' — and added 'or wing'. Al-Mahdi granted him ten thousand dirhams, but as he rose said, 'I bear witness that the back of your head is the back of a liar; you only fished for this' — then ordered the pigeons slaughtered {cite:tarikh-khulafa-minhaj-1434 p. 445}."
