id: event/ghiyath-fabricated-hadith
class: event
kind: other
label: { ar: "حديث غياث المكذوب وأشهد أن قفاك قفا كذاب", en: "Ghiyath's Fabricated Hadith and 'Your Nape Is a Liar's Nape'", es: "El hadiz inventado por Ghiyath y \"Tu nuca es la nuca de un mentiroso\"", fr: "Le hadith fabriqué de toutes pièces par Ghiyath et « Ta nuque est une nuque de menteur »", ur: "غیث کی من گھڑت حدیث اور 'تمہارا گھٹنا جھوٹا ہے'" }
summary:
  ar: "قدم على المهدي بعشرة محدثين منهم فرج بن فضالة وغياث بن إبراهيم، وكان المهدي يحب الحمام، فلما دخل غياث حدثه عن أبي هريرة مرفوعاً لا سبق إلا في حافر أو نصل وزاد فيه أو جناح، فأمر له المهدي بعشرة آلاف درهم فلما قام قال أشهد أن قفاك قفا كذاب وإنما استجلبت ذلك، ثم أمر بالحمام فذبحت {cite:tarikh-khulafa-minhaj-1434 p. 445}."
  en: "Among ten hadith-men brought before al-Mahdi was Ghiyath ibn Ibrahim; the caliph loved pigeons, so Ghiyath transmitted from Abu Hurayra 'there is no wagered race save on hoof or arrowhead' — and added 'or wing'. Al-Mahdi granted him ten thousand dirhams, but as he rose said, 'I bear witness that the back of your head is the back of a liar; you only fished for this' — then ordered the pigeons slaughtered {cite:tarikh-khulafa-minhaj-1434 p. 445}."
  es: "Entre los diez narradores de hadices llevados ante al-Mahdi estaba Ghiyath ibn Ibrahim; el califa amaba a las palomas, así que Ghiyath transmitió de Abu Hurayra: «No hay carrera de apuestas salvo sobre pezuña o punta de flecha», y añadió: «o ala». Al-Mahdi le concedió diez mil dirhams, pero al levantarse dijo: «Doy testimonio de que la parte posterior de tu cabeza es la de un mentiroso; solo buscabas esto», y luego ordenó que sacrificaran a las palomas {cite:tarikh-khulafa-minhaj-1434 p. 445}."
  fr: "Parmi les dix rapporteurs de hadiths amenés devant al-Mahdi se trouvait Ghiyath ibn Ibrahim. Le calife aimait les pigeons, et Ghiyath transmit d'Abu Hurayra: « Il n'y a de pari que sur le sabot ou la pointe de flèche », ajoutant « ou l'aile ». Al-Mahdi lui accorda dix mille dirhams, mais en se levant, il déclara: « Je témoigne que ta tête est celle d'un menteur; tu n'as fait que pêcher cela », puis il ordonna que les pigeons soient abattus."
  ur: "مہدی کے سامنے لائے جانے والے دس محدثین میں غیاث بن ابراہیم بھی شامل تھے۔ خلیفہ کبوتروں سے محبت کرتا تھا، اس لیے غیث نے ابو ہریرہ سے نقل کیا کہ 'کھر یا تیر کے نشان کے علاوہ کوئی دوڑ نہیں لگتی' - اور 'یا بازو' کا اضافہ کیا۔ المہدی نے اسے دس ہزار درہم دیے، لیکن جیسے ہی وہ اٹھے، میں گواہی دیتا ہوں کہ تیرے سر کا پچھلا حصہ جھوٹے کی پشت ہے۔ آپ نے صرف اس کے لیے مچھلیاں پکڑی ہیں'' - پھر کبوتروں کو ذبح کرنے کا حکم دیا 445}"
