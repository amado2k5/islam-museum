label: { ar: "كتاب مسيلمة إلى النبي والجواب عنه", en: "Musaylima's letter to the Prophet and the reply" }
summary:
  ar: "كتب مسيلمة بن حبيب إلى النبي في آخر سنة عشر: من مسيلمة رسول الله إلى محمد رسول الله، أما بعد فإني قد أُشركت في الأمر معك، وإن لنا نصف الأرض ولقريش نصف الأرض، ولكن قريشاً قوم يعتدون؛ وقدم به رسولان له. فسألهما النبي: فما تقولان أنتما؟ قالا: نقول كما قال؛ فقال: لولا أن الرسل لا تُقتل لضربت أعناقكما، ثم كتب: من محمد رسول الله إلى مسيلمة الكذاب، السلام على من اتبع الهدى، أما بعد فإن الأرض لله يورثها من يشاء من عباده والعاقبة للمتقين."
  en: "At the end of 10 AH Musaylima ibn Habib wrote to the Prophet: from Musaylima the messenger of God to Muhammad the messenger of God; I have been made a partner with you in the matter, half the earth is ours and half Quraysh's, but Quraysh are a people who transgress. Two envoys brought it. The Prophet asked what they themselves said; they said, as he says; he said that were envoys not immune from death he would have struck off their heads, then wrote: from Muhammad the messenger of God to Musaylima the liar, peace on whoever follows guidance; the earth is God's, He gives it to whom He wills of His servants, and the outcome is for the God-fearing."
