label: { ar: "كتاب مسيلمة إلى النبي والجواب عنه", en: "Musaylima's letter to the Prophet and the reply", es: "La carta de Musaylima al Profeta y la respuesta.", fr: "Lettre de Musaylima au Prophète et sa réponse", ur: "مسیلمہ کا پیغمبر کو خط اور جواب" }
summary:
  ar: "كتب مسيلمة بن حبيب إلى النبي في آخر سنة عشر: من مسيلمة رسول الله إلى محمد رسول الله، أما بعد فإني قد أُشركت في الأمر معك، وإن لنا نصف الأرض ولقريش نصف الأرض، ولكن قريشاً قوم يعتدون؛ وقدم به رسولان له. فسألهما النبي: فما تقولان أنتما؟ قالا: نقول كما قال؛ فقال: لولا أن الرسل لا تُقتل لضربت أعناقكما، ثم كتب: من محمد رسول الله إلى مسيلمة الكذاب، السلام على من اتبع الهدى، أما بعد فإن الأرض لله يورثها من يشاء من عباده والعاقبة للمتقين."
  en: "At the end of 10 AH Musaylima ibn Habib wrote to the Prophet: from Musaylima the messenger of God to Muhammad the messenger of God; I have been made a partner with you in the matter, half the earth is ours and half Quraysh's, but Quraysh are a people who transgress. Two envoys brought it. The Prophet asked what they themselves said; they said, as he says; he said that were envoys not immune from death he would have struck off their heads, then wrote: from Muhammad the messenger of God to Musaylima the liar, peace on whoever follows guidance; the earth is God's, He gives it to whom He wills of His servants, and the outcome is for the God-fearing."
  es: "A finales del año 10 de la Hégira, Musaylima ibn Habib escribió al Profeta: de Musaylima, el mensajero de Dios, a Muhammad, el mensajero de Dios; he sido hecho socio tuyo en el asunto, la mitad de la tierra es nuestra y la otra mitad de los Quraysh, pero los Quraysh son un pueblo que transgrede. Dos enviados la trajeron. El Profeta preguntó qué dijeron ellos mismos; dijeron, como él dice; dijo que si los enviados no fueran inmunes a la muerte, les habría cortado la cabeza, luego escribió: de Muhammad, el mensajero de Dios, a Musaylima, el mentiroso, paz sobre quien sigue la guía; la tierra es de Dios, Él la da a quien Él quiere de Sus siervos, y el resultado es para los temerosos de Dios."
  fr: "À la fin de l'an 10 de l'Hégire, Musaylima ibn Habib écrivit au Prophète: « De Musaylima, messager de Dieu, à Muhammad, messager de Dieu: Je suis associé à toi dans cette affaire. La moitié de la terre nous appartient, l'autre moitié aux Quraysh. Or, les Quraysh sont un peuple pervers. » Deux émissaires apportèrent ce message. Le Prophète leur demanda ce qu'ils avaient dit; ils répondirent: « Voilà ce qu'il dit. » Il déclara que si les émissaires n'étaient pas immortels, il leur aurait tranché la tête, puis écrivit: « De Muhammad, messager de Dieu, à Musaylima le menteur: Que la paix soit sur celui qui suit le droit chemin ! La terre appartient à Dieu, Il la donne à qui Il veut parmi Ses serviteurs, et la récompense est pour les pieux. »"
  ur: "10 ہجری کے آخر میں مسیلمہ بن حبیب نے رسول اللہ کو لکھا: مسیلمہ خدا کے رسول سے محمد رسول اللہ تک؛ میں تمہارے ساتھ اس معاملے میں شریک بنایا گیا ہوں، آدھی زمین ہماری اور آدھی قریش کی ہے، لیکن قریش فاسق قوم ہیں۔ دو ایلچی اسے لے آئے۔ نبی نے پوچھا کہ وہ خود کیا کہتے ہیں؟ انہوں نے کہا، جیسا کہ وہ کہتا ہے؛ اس نے کہا کہ اگر ایلچی موت سے محفوظ نہ ہوتے تو وہ ان کے سروں کو مار ڈالتا، پھر لکھا: محمد رسول اللہ سے لے کر مسیلمہ جھوٹا تک، سلامتی ہو اس پر جو ہدایت کی پیروی کرے۔ زمین خدا کی ہے وہ اپنے بندوں میں سے جسے چاہتا ہے دیتا ہے اور نتیجہ پرہیزگاروں کے لیے ہے۔"
