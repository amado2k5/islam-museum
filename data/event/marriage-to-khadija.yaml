label: { en: "The Prophet's marriage to Khadija", ar: "زواج النبي من خديجة" }
summary:
  en: "The marriage of Muhammad and Khadija bint Khuwaylid, arranged after her trade trip under his management to Syria; the book gives her dowry as twenty young camels and her age as forty, and notes she remained his only wife until she died."
  ar: "زواج محمد من خديجة بنت خويلد بعد رحلتها التجارية التي خرج بها إلى الشام؛ أصدقها عشرين بكرة وكانت سنها أربعين سنة يومئذ، وهي أول امرأة تزوجها ولم يتزوج عليها حتى ماتت."
