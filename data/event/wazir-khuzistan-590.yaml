summary:
  ar: "سار وزير الخليفة الناصر إلى خوزستان فملكها، وكان سببها أن صاحب قلعتها سوسيان بن شملة توفي واختلف أولاده بعده فراسل أحدهم الخليفة يسلمه إليه {cite:kamil-ibn-al-athir p. 234-235}."
  en: "Al-Nasir sent his vizier against Khuzistan and took it — the castle of Susiyan ibn Shamla falling to Baghdad when its dead lord sons quarreled and one wrote the caliph offering the keys {cite:kamil-ibn-al-athir p. 234-235}."
  es: "Al-Nasir envió a su visir contra Juzestán y lo tomó; el castillo de Susiyan ibn Shamla cayó en manos de Bagdad cuando los hijos de su difunto señor se pelearon y uno escribió al califa ofreciéndole las llaves {cite:kamil-ibn-al-athir p. 234-235}."
  fr: "Al-Nasir envoya son vizir contre le Khuzistan et le prit — le château de Susiyan ibn Shamla tombant aux mains de Bagdad lorsque les fils de son seigneur défunt se querellèrent et que l'un d'eux écrivit au calife en lui offrant les clés {cite:kamil-ibn-al-athir p. 234-235}."
  ur: "النصیر نے اپنے وزیر کو خوزستان کے خلاف بھیجا اور اسے لے لیا - سوسیان ابن شملہ کا قلعہ بغداد پر گرا جب اس کے مردہ آقا کے بیٹوں میں جھگڑا ہوا اور ایک نے خلیفہ کو چابیاں پیش کرتے ہوئے لکھا۔ 234-235}۔"
  tr: "Halife el-Nasır'ın veziri Huzistan'a gitti ve orayı fethetti. Bunun sebebi, kalenin sahibi Susyan bin Şamla'nın ölmesi ve oğullarının ondan sonra anlaşmazlığa düşmesiydi; bu yüzden oğullarından biri halifeye kaleyi kendisine devretmesi için bir mesaj gönderdi. {Kaynak: Kamil ibn el-Asır s. 234-235}"
  id: "Menteri Khalifah Al-Nasir pergi ke Khuzestan dan menaklukkannya. Alasannya adalah karena pemilik bentengnya, Susyan bin Shamla, meninggal dan putra-putranya berselisih setelahnya, sehingga salah satu dari mereka mengirim pesan kepada Khalifah untuk menyerahkannya kepadanya {cite:kamil-ibn-al-athir p. 234-235}."
