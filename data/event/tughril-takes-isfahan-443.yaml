summary:
  ar: "في سنة ثلاث وأربعين وأربعمائة ورد الخبر بفتح أصبهان ودخول طغربك إليها، وكان قد عمّر الري عمارة حسنة، وهدم دارًا فوجد فيها مراكب مرصعة بالجوهر الثمين وقاتم دنانير وبرنيتين صينية مملوءة بالجوهر النفيس ودفينًا عظيمًا، ووجد في عقد قد انشق برنية خضراء فيها عشرون ألف دينار {cite:muntazam-ibn-al-jawzi j.8 p.493}."
  en: "In 443 came the news that Tughril Beg had taken and entered Isfahan — he who had rebuilt Rayy handsomely — and in demolishing a house he found gem-set vessels, buried hoards of dinars, two Chinese jars filled with precious jewels, a great treasure, and a green jar containing twenty thousand dinars in a split-open hoard {cite:muntazam-ibn-al-jawzi j.8 p.493}."
