id: event/tughril-takes-isfahan-443
class: event
kind: conquest
label:
  ar: "طغربك يفتح أصبهان ويصيب دفائنها"
  en: "Tughril Beg takes Isfahan and finds its buried treasures"
  es: "Tughril Beg toma Isfahán y descubre sus tesoros enterrados."
  fr: "Tughril Beg prend Ispahan et découvre ses trésors enfouis."
  ur: "طغرل بیگ اصفہان لے گیا اور اس کے مدفون خزانے کو تلاش کیا۔"
summary:
  ar: "في سنة ثلاث وأربعين وأربعمائة ورد الخبر بفتح أصبهان ودخول طغربك إليها، وكان قد عمّر الري عمارة حسنة، وهدم دارًا فوجد فيها مراكب مرصعة بالجوهر الثمين وقاتم دنانير وبرنيتين صينية مملوءة بالجوهر النفيس ودفينًا عظيمًا، ووجد في عقد قد انشق برنية خضراء فيها عشرون ألف دينار {cite:muntazam-ibn-al-jawzi j.8 p.493}."
  en: "In 443 came the news that Tughril Beg had taken and entered Isfahan — he who had rebuilt Rayy handsomely — and in demolishing a house he found gem-set vessels, buried hoards of dinars, two Chinese jars filled with precious jewels, a great treasure, and a green jar containing twenty thousand dinars in a split-open hoard {cite:muntazam-ibn-al-jawzi j.8 p.493}."
  es: "En 443 llegó la noticia de que Tughril Beg había tomado y entrado en Isfahán —él que había reconstruido Rayy magníficamente— y al demoler una casa encontró vasijas con incrustaciones de gemas, tesoros enterrados de dinares, dos jarrones chinos llenos de joyas preciosas, un gran tesoro y un jarrón verde que contenía veinte mil dinares en un cofre abierto {cite:muntazam-ibn-al-jawzi j.8 p.493}."
  fr: "En 443, la nouvelle parvint que Tughril Beg avait pris et était entré à Ispahan — celui qui avait magnifiquement reconstruit Rayy — et qu'en démolissant une maison, il avait trouvé des vases sertis de pierres précieuses, des trésors de dinars enterrés, deux jarres chinoises remplies de pierres précieuses, un grand trésor et une jarre verte contenant vingt mille dinars dans un trésor ouvert {cite:muntazam-ibn-al-jawzi j.8 p.493}."
  ur: "443 میں خبر آئی کہ طغرل بیگ اصفہان لے کر داخل ہوا ہے - جس نے رے کو خوبصورتی سے دوبارہ تعمیر کیا تھا - اور ایک گھر کو گراتے ہوئے اسے قیمتی جواہرات سے بھرے قیمتی برتن، دینار کے دبے ہوئے ذخیرے، قیمتی جواہرات سے بھرے دو چینی مرتبان، ایک بڑا خزانہ اور ایک سبز مرتبان ملا جس میں دو ہزار دینار کی رقم تھی۔ {حوالہ:منتظم ابن الجوزی ج8 ص493}۔"
