summary:
  ar: "في جمادى الأولى سنة ستين وأربعمائة كانت زلزلة بأرض فلسطين أهلكت بلد الرملة، وكتب بعض التجار في هذه الزلزلة أنها خسفت الرملة جميعها، وانجفل البحر وقت الزلزلة حتى انكشفت أرضه ومشى الناس فيه ثم عاد إلى حاله، وتغيّرت إحدى زوايا الجامع بمصر {cite:muntazam-ibn-al-jawzi j.8 p.598}."
  en: "The great Jumada I 460 earthquake in Palestine destroyed Ramla outright — a merchant's letter says the town was swallowed whole; the sea recoiled so far its floor lay bare and people walked on it before it returned, and one corner of the mosque in Egypt shifted {cite:muntazam-ibn-al-jawzi j.8 p.598}."
