id: event/ramla-earthquake-460
class: event
kind: other
label: { ar: "زلزلة الرملة الكبرى", en: "The great earthquake of Ramla", es: "El gran terremoto de Ramla", fr: "Le grand tremblement de terre de Ramla", ur: "رملا کا زبردست زلزلہ", tr: "Büyük Ramla Depremi", id: "Gempa Besar Ramla" }
summary:
  ar: "في جمادى الأولى سنة ستين وأربعمائة كانت زلزلة بأرض فلسطين أهلكت بلد الرملة، وكتب بعض التجار في هذه الزلزلة أنها خسفت الرملة جميعها، وانجفل البحر وقت الزلزلة حتى انكشفت أرضه ومشى الناس فيه ثم عاد إلى حاله، وتغيّرت إحدى زوايا الجامع بمصر {cite:muntazam-ibn-al-jawzi j.8 p.598}."
  en: "The great Jumada I 460 earthquake in Palestine destroyed Ramla outright — a merchant's letter says the town was swallowed whole; the sea recoiled so far its floor lay bare and people walked on it before it returned, and one corner of the mosque in Egypt shifted {cite:muntazam-ibn-al-jawzi j.8 p.598}."
  es: "El gran terremoto de Jumada I 460 en Palestina destruyó Ramla por completo; una carta de un comerciante dice que la ciudad fue engullida entera; el mar retrocedió tanto que su fondo quedó al descubierto y la gente caminó sobre él antes de que volviera a su cauce, y una esquina de la mezquita en Egipto se movió {cite:muntazam-ibn-al-jawzi j.8 p.598}."
  fr: "Le grand tremblement de terre de Jumada I 460 en Palestine a complètement détruit Ramla — la lettre d'un marchand dit que la ville a été engloutie tout entière; la mer s'est retirée si loin que son fond était à nu et que les gens ont marché dessus avant qu'elle ne revienne, et un coin de la mosquée en Égypte s'est déplacé {cite:muntazam-ibn-al-jawzi j.8 p.598}."
  ur: "فلسطین میں جمعہ اول کے 460 کے عظیم زلزلے نے رملہ کو بالکل تباہ کر دیا - ایک تاجر کا خط کہتا ہے کہ قصبہ پوری طرح نگل گیا تھا۔ سمندر یہاں تک کہ اس کا فرش کھل گیا اور لوگ اس کے واپس آنے سے پہلے ہی اس پر چل پڑے اور مصر میں مسجد کا ایک گوشہ منتقل ہو گیا۔"
  tr: "460 yılının Cemâdî-i Ula ayında Filistin topraklarında Ramla şehrini yerle bir eden bir deprem oldu. Bazı tüccarlar bu deprem hakkında, Ramla'nın tamamının sular altında kaldığını, deprem sırasında denizin yükselerek karanın ortaya çıktığını ve insanların üzerinde yürüdüğünü, sonra tekrar eski haline döndüğünü ve Mısır'daki caminin bir köşesinin değiştiğini yazmışlardır. {cite:muntazam-ibn-al-jawzi j.8 p.598}"
  id: "Pada bulan Jumada al-Ula tahun 460, terjadi gempa bumi di tanah Palestina yang menghancurkan kota Ramla. Beberapa pedagang menulis tentang gempa bumi ini bahwa gempa tersebut menyebabkan seluruh Ramla tenggelam, dan laut bergelombang selama gempa bumi hingga daratannya terlihat dan orang-orang berjalan di atasnya, kemudian kembali ke keadaan semula, dan salah satu sudut masjid di Mesir berubah {cite:muntazam-ibn-al-jawzi j.8 p.598}."
