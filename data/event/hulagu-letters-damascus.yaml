label: { ar: "كتب هولاكو المهددة إلى الناصر صاحب دمشق", en: "Hulagu's threatening letters to al-Nasir, ruler of Damascus", es: "Las cartas amenazantes de Hulagu a al-Nasir, gobernante de Damasco.", fr: "Les lettres de menaces d'Hulagu à al-Nasir, dirigeant de Damas" }
summary:
  ar: "أرسل هولاكو إلى الناصر صاحب دمشق كتاباً فيه يعلم السلطان الملك ناصر أنه لما توجهنا إلى العراق وخرج إلينا جنودهم فقتلناهم بسيف الله وأما صاحب البلدة فإنه خرج إلى خدمتنا ودخل تحت عبوديتنا فسألناه عن أشياء كذبنا فيها فاستحق الإعدام أجب ملك البسيطة ولا تقولن قلاعي المانعات ورجالي المقاتلات فساعة وقوفك على كتابنا تجعل قلاع الشام سماءها أرضاً وطولها عرضاً، ثم كتاب ثان فيه فإنا فتحنا بغداد واستأصلنا ملكها وملكها ونحن في طلب الازدياد على ممر الآباد أجب دعوة ملك البسيطة تأمن شره وتنال بره، وثالث فيه نحن قد أهلكنا البلاد وأبدنا العباد وقتلنا النسوان والأولاد فيا أيها الباقون أنتم بمن مضى لاحقون ونحن جيوش الهلكة لا جيوش الملكة ذلت لهيبتنا الأسود وأصبحت في قبضتي الأمراء والخلفاء ونحن إليكم صائرون ولكم الهرب وعلينا الطلب وقد أعذر من أنذر {cite:tarikh-khulafa-minhaj-1434 p. 718-719}."
  en: "Hulagu's letters to al-Nasir of Damascus: 'We killed their soldiers with God's sword; the city's lord came into our service, lied under questioning, and earned death. Answer the king of the earth — the hour you stand on our letter, Syria's fortresses turn heaven to earth and length to breadth'. And: 'we have wasted lands and slain women and children; you who remain will follow those gone — we are armies of ruin, not of dominion; lions cower at our awe; amirs and caliphs are in my fist; we are coming to you — yours to flee, ours to pursue' {cite:tarikh-khulafa-minhaj-1434 p. 718-719}."
  es: "Cartas de Hulagu a al-Nasir de Damasco: «Matamos a sus soldados con la espada de Dios; el señor de la ciudad se puso a nuestro servicio, mintió al ser interrogado y se ganó la muerte. Responde al rey de la tierra: en el momento en que te encuentres frente a nuestra carta, las fortalezas de Siria convertirán el cielo en tierra y la longitud en anchura». Y: «Hemos devastado tierras y asesinado a mujeres y niños; vosotros, los que quedáis, seguiréis a los que se han ido; somos ejércitos de ruina, no de dominio; los leones se acobardan ante nuestro temor; emires y califas están en mi puño; venimos a vosotros; vosotros debéis huir, nosotros de perseguir» {cite:tarikh-khulafa-minhaj-1434 p. 718-719}."
  fr: "Lettres de Hulagu à al-Nasir de Damas: « Nous avons tué leurs soldats par l’épée de Dieu; le seigneur de la ville est entré à notre service, a menti lors de son interrogatoire et a mérité la mort. Réponds, roi de la terre ! À l’heure où tu liras notre lettre, les forteresses de Syrie s’effondreront. » Et: « Nous avons ravagé des terres et massacré femmes et enfants; vous qui restez, vous subirez le même sort que ceux qui sont partis. Nous sommes des armées de destruction, non de domination; les lions tremblent devant notre crainte; émirs et califes sont à ma merci; nous venons à vous: vous fuirez, nous vous poursuivrons. » {cite: tarikh-khulafa-minhaj-1434 p. 718-719}."
