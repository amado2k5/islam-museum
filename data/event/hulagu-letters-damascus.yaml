label: { ar: "كتب هولاكو المهددة إلى الناصر صاحب دمشق", en: "Hulagu's threatening letters to al-Nasir, ruler of Damascus", es: "Las cartas amenazantes de Hulagu a al-Nasir, gobernante de Damasco.", fr: "Les lettres de menaces d'Hulagu à al-Nasir, dirigeant de Damas", ur: "ہلاگو کا دمشق کے حکمران النصیر کو دھمکی آمیز خطوط", tr: "Hulagu, Şam hükümdarı el-Nasır'a tehdit mektupları yazdı.", id: "Hulagu menulis surat-surat berisi ancaman kepada al-Nasir, penguasa Damaskus." }
summary:
  ar: "أرسل هولاكو إلى الناصر صاحب دمشق كتاباً فيه يعلم السلطان الملك ناصر أنه لما توجهنا إلى العراق وخرج إلينا جنودهم فقتلناهم بسيف الله وأما صاحب البلدة فإنه خرج إلى خدمتنا ودخل تحت عبوديتنا فسألناه عن أشياء كذبنا فيها فاستحق الإعدام أجب ملك البسيطة ولا تقولن قلاعي المانعات ورجالي المقاتلات فساعة وقوفك على كتابنا تجعل قلاع الشام سماءها أرضاً وطولها عرضاً، ثم كتاب ثان فيه فإنا فتحنا بغداد واستأصلنا ملكها وملكها ونحن في طلب الازدياد على ممر الآباد أجب دعوة ملك البسيطة تأمن شره وتنال بره، وثالث فيه نحن قد أهلكنا البلاد وأبدنا العباد وقتلنا النسوان والأولاد فيا أيها الباقون أنتم بمن مضى لاحقون ونحن جيوش الهلكة لا جيوش الملكة ذلت لهيبتنا الأسود وأصبحت في قبضتي الأمراء والخلفاء ونحن إليكم صائرون ولكم الهرب وعلينا الطلب وقد أعذر من أنذر {cite:tarikh-khulafa-minhaj-1434 p. 718-719}."
  en: "Hulagu's letters to al-Nasir of Damascus: 'We killed their soldiers with God's sword; the city's lord came into our service, lied under questioning, and earned death. Answer the king of the earth — the hour you stand on our letter, Syria's fortresses turn heaven to earth and length to breadth'. And: 'we have wasted lands and slain women and children; you who remain will follow those gone — we are armies of ruin, not of dominion; lions cower at our awe; amirs and caliphs are in my fist; we are coming to you — yours to flee, ours to pursue' {cite:tarikh-khulafa-minhaj-1434 p. 718-719}."
  es: "Cartas de Hulagu a al-Nasir de Damasco: «Matamos a sus soldados con la espada de Dios; el señor de la ciudad se puso a nuestro servicio, mintió al ser interrogado y se ganó la muerte. Responde al rey de la tierra: en el momento en que te encuentres frente a nuestra carta, las fortalezas de Siria convertirán el cielo en tierra y la longitud en anchura». Y: «Hemos devastado tierras y asesinado a mujeres y niños; vosotros, los que quedáis, seguiréis a los que se han ido; somos ejércitos de ruina, no de dominio; los leones se acobardan ante nuestro temor; emires y califas están en mi puño; venimos a vosotros; vosotros debéis huir, nosotros de perseguir» {cite:tarikh-khulafa-minhaj-1434 p. 718-719}."
  fr: "Lettres de Hulagu à al-Nasir de Damas: « Nous avons tué leurs soldats par l’épée de Dieu; le seigneur de la ville est entré à notre service, a menti lors de son interrogatoire et a mérité la mort. Réponds, roi de la terre ! À l’heure où tu liras notre lettre, les forteresses de Syrie s’effondreront. » Et: « Nous avons ravagé des terres et massacré femmes et enfants; vous qui restez, vous subirez le même sort que ceux qui sont partis. Nous sommes des armées de destruction, non de domination; les lions tremblent devant notre crainte; émirs et califes sont à ma merci; nous venons à vous: vous fuirez, nous vous poursuivrons. » {cite: tarikh-khulafa-minhaj-1434 p. 718-719}."
  ur: "دمشق کے النصیر کو ہلاگو کے خطوط: 'ہم نے ان کے سپاہیوں کو خدا کی تلوار سے مار ڈالا۔ شہر کا مالک ہماری خدمت میں آیا، سوال کے تحت جھوٹ بولا، اور موت کمائی. زمین کے بادشاہ کو جواب دو - جس گھڑی تم ہمارے خط پر کھڑے ہو، شام کے قلعے آسمان کو زمین میں اور لمبائی چوڑائی میں بدل دیتے ہیں۔ اور: 'ہم نے زمینیں برباد کیں اور عورتوں اور بچوں کو قتل کیا۔ تم جو باقی رہو گے ان کی پیروی کرو گے - ہم بربادی کے لشکر ہیں، سلطنت کے نہیں۔ شیر ہمارے خوف سے ڈرتے ہیں۔ امیر و خلیفہ میری مٹھی میں ہیں۔ ہم آپ کے پاس آ رہے ہیں - آپ کے بھاگنے کے لیے، ہمارے تعاقب کے لیے۔ 718-719}۔"
  tr: "Hulagu, Şam hükümdarı el-Nasır'a bir mektup göndererek, Irak'a doğru ilerlerken askerlerinin kendilerini karşılamaya çıktığını ve onları Allah'ın kılıcıyla öldürdüklerini bildirdi. Şehrin hükümdarı ise onlara hizmet etmek için çıktı ve onların köleliğine girdi. Onlar onu sorguya çektiler ve yalan söylediler, bu yüzden idamı hak etti. Yeryüzünün kralına cevap ver ve \"Kalelerim aşılmaz, adamlarım savaşıyor\" deme. Çünkü mektubumuzu okuduğun anda Suriye kaleleri göklerini yere, uzunluklarını enine çevirecek. Sonra ikinci bir mektup göndererek, \"Bağdat'ı fethettik, kralını ve krallığını yok ettik ve ebediyet üzerindeki egemenliğimizi artırmaya çalışıyoruz. Yeryüzünün kralının çağrısına cevap ver, onun şerrinden korunacaksın ve onun lütfunu kazanacaksın\" dedi. Üçüncüsünde ise şöyle dedi: \"Toprakları harap ettik, halkı yok ettik, kadınları ve çocukları öldürdük. Öyleyse, geride kalanlar, sizden önce gidenlerin izinden gideceksiniz. Biz yıkım ordularıyız, kraliçenin orduları değiliz. Aslanlar bizim korkumuz karşısında dizginlendi, prensler ve halifeler şimdi bizim elimizde. Size geliyoruz ve kaçma seçeneğiniz var, sizi kovalayanlar biziz. Uyaran mazur görülür.\" {cite:tarikh-khulafa-minhaj-1434 s. 718-719}"
  id: "Hulagu mengirim surat kepada al-Nasir, penguasa Damaskus, memberitahukan kepada Sultan al-Malik al-Nasir bahwa ketika mereka berbaris menuju Irak dan tentara mereka keluar untuk menemui mereka, mereka membunuh mereka dengan pedang Tuhan. Adapun penguasa kota itu, ia keluar untuk melayani mereka dan masuk ke dalam perbudakan mereka. Mereka menanyainya tentang hal-hal yang mereka bohongi, dan ia pantas dihukum mati. Jawablah raja bumi, dan jangan berkata, \"Benteng-bentengku tak tertembus, dan pasukanku sedang berperang.\" Karena saat kau membaca surat kami, benteng-benteng Suriah akan mengubah langit menjadi bumi dan panjangnya menjadi lebar. Kemudian surat kedua yang isinya, \"Kami telah menaklukkan Baghdad dan memusnahkan rajanya dan kerajaannya, dan kami berusaha untuk meningkatkan kekuasaan kami atas keabadian. Jawablah seruan raja bumi, dan kau akan aman dari kejahatannya dan menerima karunianya.\" Dan yang ketiga di mana dia berkata, \"Kami telah menghancurkan negeri-negeri dan memusnahkan penduduknya, serta membunuh perempuan dan anak-anak. Maka, kalian yang tersisa, kalian akan mengikuti mereka yang telah mendahului kalian. Kami adalah pasukan penghancur, bukan pasukan ratu. Singa-singa telah direndahkan oleh rasa takut kami, dan para pangeran dan khalifah kini berada dalam genggaman kami. Kami datang kepada kalian, dan kalian memiliki pilihan untuk melarikan diri, dan kamilah yang mengejar kalian. Barangsiapa yang memperingatkan, maka ia dimaafkan.\" {cite:tarikh-khulafa-minhaj-1434 p. 718-719}."
