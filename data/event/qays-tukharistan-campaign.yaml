label: { ar: "سيرة قيس بن الهيثم بطخارستان", en: "Qays ibn al-Haytham's Tukharistan March", es: "Marcha de Tujaristán de Qays ibn al-Haytham", fr: "La marche du Tukharistan de Qays ibn al-Haytham", ur: "قیس بن الہیثم کا تخارستان مارچ" }
summary:
  ar: "استخلف ابن عامر قيس بن الهيثم فسار بعد شخوصه في أرض طخارستان فلم يأت بلداً منها إلا صالحه أهله فأذعنوا له حتى أتى سمنجان فامتنعوا عليه فحصرهم حتى فتحها عنوة وقد قيل إن ابن عامر جعل خراسان بين ثلاثة الأحنف بن قيس وحاتم بن النعمان الباهلي وقيس بن الهيثم والأول أثبت."
  en: "Left in charge, Qays ibn al-Haytham marched through Tukharistan; every land truced and yielded till Siminjan resisted — he besieged and stormed it. It is said Ibn Amir divided Khurasan among three: al-Ahnaf ibn Qays, Hatim ibn al-Nu'man al-Bahili and Qays ibn al-Haytham, the first the most established."
  es: "Al quedar al mando, Qays ibn al-Haytham marchó por Tukharistán; todas las tierras cedieron y se sometieron hasta que Siminjan resistió, momento en el que la asedió y la tomó por asalto. Se dice que Ibn Amir dividió Jorasán entre tres: al-Ahnaf ibn Qays, Hatim ibn al-Nu'man al-Bahili y Qays ibn al-Haytham, siendo el primero el más influyente."
  fr: "Laissé à la tête du Khorasan, Qays ibn al-Haytham traversa le Tukharistan; chaque région signa une trêve et se rendit jusqu'à ce que Siminjan résiste; il l'assiégea et la prit d'assaut. On raconte qu'Ibn Amir partagea le Khorasan entre trois chefs: al-Ahnaf ibn Qays, Hatim ibn al-Nu'man al-Bahili et Qays ibn al-Haytham, le premier étant le plus établi."
  ur: "انچارج چھوڑ کر، قیس بن الہیثم نے تخارستان سے کوچ کیا۔ ہر زمین نے جنگ لڑی اور پیداوار دی یہاں تک کہ سمنجن نے مزاحمت کی - اس نے محاصرہ کیا اور اس پر حملہ کیا۔ کہا جاتا ہے کہ ابن عامر نے خراسان کو تین حصوں میں تقسیم کیا: الاحنف ابن قیس، حاتم ابن النعمان الباہلی اور قیس ابن الہیثم، جو سب سے پہلے قائم تھے۔"
