  ar: "استخلف ابن عامر قيس بن الهيثم فسار بعد شخوصه في أرض طخارستان فلم يأت بلداً منها إلا صالحه أهله فأذعنوا له حتى أتى سمنجان فامتنعوا عليه فحصرهم حتى فتحها عنوة وقد قيل إن ابن عامر جعل خراسان بين ثلاثة الأحنف بن قيس وحاتم بن النعمان الباهلي وقيس بن الهيثم والأول أثبت."
  en: "Left in charge, Qays ibn al-Haytham marched through Tukharistan; every land truced and yielded till Siminjan resisted — he besieged and stormed it. It is said Ibn Amir divided Khurasan among three: al-Ahnaf ibn Qays, Hatim ibn al-Nu'man al-Bahili and Qays ibn al-Haytham, the first the most established."
