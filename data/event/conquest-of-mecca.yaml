id: event/conquest-of-mecca
class: event
kind: conquest
label: { en: "The Conquest of Mecca (Fath Makka)", ar: "فتح مكة ⁦(الفتح الأعظم)⁩" }
summary:
  en: "In Ramadan of 8 AH the Prophet marched on Mecca with about ten thousand men after Quraysh and their allies broke the truce of al-Hudaybiyya, and the city was taken almost without fighting. The idols around the Kaaba were removed and a general amnesty was given to Quraysh: Go, for you are free. He also declared the sanctity of the city on that day {cite:sahih-al-bukhari 3189}. The Encyclopaedia of Islam, an academic reference, dates the departure to December 629 and says the Kaaba became a centre of Islamic worship while the pilgrimage was kept as an Islamic rite."
  ar: "في رمضان سنة 8هـ، إثر نقض قريش وحلفائها لهدنة الحديبية، زحف النبي إلى مكة في نحو عشرة آلاف، فدخلها دون قتال يذكر، وأزيلت الأصنام من حول الكعبة، وأعلن عفوه العام عن قريش: «اذهبوا فأنتم الطلقاء». وفي الصحيح أن الأنصار قالوا يوم الفتح حين أعطى قريشاً «إن سيوفنا لتقطر من دماء قريش وغنائمنا ترد عليهم» فدعاهم وقال «ألا ترضون أن يرجع الناس بالغنائم إلى بيوتهم وترجعون برسول الله إلى بيوتكم» {cite:sahih-al-bukhari 3778}، وبعد الفتح أعلن في مسلم انقطاع الهجرة إليها: «لا هجرة بعد الفتح ولكن جهاد ونية» {cite:sahih-muslim 1864}. وتؤرخ دائرة المعارف الإسلامية الخروج بديسمبر 629م، وتذكر أن الكعبة صارت مركز عبادة إسلامية وأبقي الحج شعيرة إسلامية."
  ur: "رمضان 8 ہجری میں قریش اور ان کے حلیفوں کے صلحِ حدیبیہ توڑنے کے بعد نبی تقریباً دس ہزار کے ساتھ مکہ کی طرف روانہ ہوئے اور شہر تقریباً بغیر لڑائی کے لے لیا گیا۔ کعبہ کے گرد بت ہٹا دیے گئے اور قریش کے لیے عام معافی کا اعلان ہوا: جاؤ، تم آزاد ہو۔ انسائیکلوپیڈیا آف اسلام، جو ایک علمی حوالہ ہے، روانگی کو دسمبر 629ء کا بتاتا ہے اور کہتا ہے کہ کعبہ اسلامی عبادت کا مرکز بنا اور حج اسلامی رسم کے طور پر باقی رکھا گیا۔"
