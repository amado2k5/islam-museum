id: event/conquest-of-mecca
class: event
kind: conquest
label: { en: "The Conquest of Mecca (Fath Makka)", ar: "فتح مكة (الفتح الأعظم)" }
summary:
  en: "In Ramadan 8 AH (January 630 CE), following Banu Bakr and Quraysh's breach of the Hudaybiyya peace at al-Watir, the Prophet mobilized 10,000 Muslims and entered Mecca in triumphant humility; dividing the army into four columns, the city was taken almost without resistance; the 360 idols around the Kaaba were shattered, and the Prophet announced a general amnesty to the populace: 'Go, for you are free'. وخطب يوم الفتح فأعلن حرمة البلد إلى يوم القيامة «لم يحل القتال فيه لأحد قبلي ولم يحل لي إلا ساعة من نهار» واستثنى الإذخر لقينهم وبيوتهم {cite:sahih-al-bukhari 3189}."
  ar: "في 20 رمضان سنة 8هـ (يناير 630م)، إثر نقض قريش وبني بكر لصلح الحديبية بعدوانهم على خزاعة بالوتير، زحف النبي في عشرة آلاف مقاتل ودخل مكة خافضاً رأسه تواضعاً لله؛ قسّم الجيش إلى أربعة ألوية وطهر الكعبة من 360 صنماً وهو يتلو «جاء الحق وزهق الباطل»، وأعلن عفوه العام التاريخي عن قريش: «اذهبوا فأنتم الطلقاء». وفي الصحيح أن الأنصار قالوا يوم الفتح حين أعطى قريشاً «إن سيوفنا لتقطر من دماء قريش وغنائمنا ترد عليهم» فدعاهم وقال «ألا ترضون أن يرجع الناس بالغنائم إلى بيوتهم وترجعون برسول الله إلى بيوتكم» {cite:sahih-al-bukhari 3778}، وبعد الفتح أعلن في مسلم انقطاع الهجرة إليها: «لا هجرة بعد الفتح ولكن جهاد ونية» {cite:sahih-muslim 1864}."
