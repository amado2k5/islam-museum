id: event/saladin-jerusalem-583
class: event
kind: conquest
label: { ar: "استرداد صلاح الدين بيت المقدس", en: "Salah al-Din recovers Jerusalem", es: "Salah al-Din recupera Jerusalén", fr: "Salah al-Din récupère Jérusalem", ur: "صلاح الدین نے یروشلم کو بحال کیا۔", tr: "Selahaddin'in Kudüs'ü yeniden ele geçirmesi", id: "Perebutan kembali Yerusalem oleh Saladin" }
summary:
  ar: "وفي سنة ثلاث وثمانين وخمس مئة كانت الفتوحات الكثيرة أخذ السلطان صلاح الدين كثيراً من البلاد الشامية التي كانت بيد الفرنج وأعظم ذلك بيت المقدس وكان بقاؤه في يد الفرنج إحدى وتسعين سنة وأزال السلطان ما أحدثه الفرنج من الآثار وهدم ما أحدثوه من الكنائس وبنى موضع كنيسة منها مدرسة للشافعية ولم يهدم القمامة اقتداء بعمر حيث لم يهدمها لما فتح بيت المقدس، ومن الغريب أن ابن برجان ذكر في تفسير الم غلبت الروم أن بيت المقدس يبقى في يد الروم إلى سنة ثلاث وثمانين وخمس مئة ثم يغلبون ويفتح ويصير دار إسلام أخذاً من حساب الآية فكان كذلك وقال أبو شامة هذا من عجائب ما اتفق وقد مات ابن برجان قبل ذلك بدهر {cite:tarikh-khulafa-minhaj-1434 p. 692-693}. وفي شذرات الذهب هزم الفرنج وأسر ملوكهم ونازل القدس وأخذه وكان المنجمون قد قالوا له تفتح القدس وتذهب عينك الواحدة فقال رضيت أن أفتحه وأعمى فافتتحها بعد أن كانت بأيدي الفرنج أكثر من تسعين سنة ثم أخذ عكا ثم جال فافتتح عدة حصون ودخل على المسلمين سرور لا يعلمه إلا الله {cite:shadharat-dhahab p. 755}."
  en: "In 583 Salah al-Din took many Frankish-held towns of Syria — Jerusalem greatest of them, ninety-one years in their hands. He cleared their traces, razed their new churches, built a Shafi'i school on one site, yet spared the Holy Sepulchre as Umar had before him. Ibn Barrajan had read in 'Alif Lam Mim — the Romans were defeated' that Jerusalem would stay Roman till 583, then be a house of Islam for ever — 'one of the strangest coincidences', says Abu Shama, 'and Ibn Barrajan died long before' {cite:tarikh-khulafa-minhaj-1434 p. 692-693}."
  es: "En 583, Saladino conquistó numerosas ciudades de Siria en manos francas, siendo Jerusalén la más importante, permaneciendo bajo su dominio durante noventa y un años. Borró sus huellas, arrasó sus nuevas iglesias, construyó una escuela shafi'í en uno de los emplazamientos, pero respetó el Santo Sepulcro, tal como lo había hecho Umar antes que él. Ibn Barraján había leído en «Alif Lam Mim» (La derrota de los romanos) que Jerusalén seguiría siendo romana hasta 583, para luego convertirse en una casa del Islam para siempre; «una de las coincidencias más extrañas», afirma Abu Shama, «e Ibn Barraján murió mucho antes» {cita: tarikh-khulafa-minhaj-1434, págs. 692-693}."
  fr: "En 583, Saladin s'empara de nombreuses villes de Syrie aux mains des Francs, dont Jérusalem, la plus importante, qui resta sous leur domination pendant quatre-vingt-onze ans. Il effaça toute trace de leur présence, rasa leurs églises nouvellement construites, fit bâtir une école chaféite sur l'un de ces sites, mais épargna le Saint-Sépulcre, comme l'avait fait Umar avant lui. Ibn Barrajan avait lu dans « Alif Lam Mim — la défaite des Romains » que Jérusalem resterait romaine jusqu'en 583, puis deviendrait une maison de l'islam pour toujours — « une des plus étranges coïncidences », dit Abou Shama, « et Ibn Barrajan mourut bien avant » (cite: Tarikh Khulafa Minhaj, 1434, p. 692-693)."
  ur: "583 میں صلاح الدین نے شام کے بہت سے فرینکش کے زیر قبضہ قصبوں کو اپنے قبضے میں لے لیا - ان میں سے سب سے بڑا یروشلم، اکانوے سال ان کے ہاتھ میں۔ اس نے ان کے نشانات کو صاف کیا، ان کے نئے گرجا گھروں کو مسمار کیا، ایک جگہ پر ایک شافعی اسکول بنایا، پھر بھی مقدس قبر کو بچایا جیسا کہ عمر اس سے پہلے تھا۔ ابن براجان نے 'الف لام میم - رومیوں کو شکست دی' میں پڑھا تھا کہ یروشلم 583 تک رومی رہے گا، پھر ہمیشہ کے لیے اسلام کا گھر رہے گا - 'عجیب ترین اتفاقات میں سے ایک'، ابو شمع کہتے ہیں، 'اور ابن براجان بہت پہلے فوت ہو گئے تھے'۔ 692-693}۔"
  tr: "Hicri 583 yılında Sultan Selahaddin, Frankların elinde bulunan Levant topraklarının büyük bir bölümünü ele geçirerek birçok fetih gerçekleştirdi. Bunların en büyüğü, doksan bir yıldır Frankların elinde kalan Kudüs'tü. Sultan, Frankların inşa ettiği anıtları ve kiliseleri yıktırdı. Kiliselerden birinin yerine Şafiî mezhebine ait bir okul inşa ettirdi. Ömer'in Kudüs'ü fethettiğinde yaptığı gibi, yıkıntıları yıkmadı. İbn Barjan'ın \"Elif Lam Mim Ghalabat Al-Rum\" tefsirinde, Kudüs'ün Hicri 583 yılına kadar Romalıların elinde kalacağını, daha sonra yenilgiye uğrayacaklarını ve İslam toprakları haline geleceğini, ayetin hesaplamasına dayanarak belirtmesi gariptir. Ve öyle de oldu. Ebu Şama, \"Bu, olanların mucizelerinden biridir\" dedi. İbn Barjan bundan çok önce vefat etmişti. {cite:tarikh-khulafa-minhaj-1434 s. 692-693}. Şadharat el-Dhahab'da Frankları yendi, krallarını esir aldı, Kudüs'ü kuşattı ve ele geçirdi. Astrologlar ona Kudüs'ü fethettiğinde tek gözünü kaybedeceğini söylemişlerdi, bu yüzden \"Onu fethetmeye ve kör olmaya razıyım\" dedi. Böylece doksan yıldan fazla bir süre Frankların elinde kaldıktan sonra Kudüs'ü fethetti. Sonra Akka'yı aldı, sonra dolaştı ve birkaç kaleyi fethetti ve Müslümanlar arasında sadece Allah'ın bildiği bir sevinç oluştu. {cite:shadharat-dhahab s. 755}"
  id: "Pada tahun 583 H, Sultan Saladin melakukan banyak penaklukan, mengambil sebagian besar wilayah Levant yang berada di tangan bangsa Frank. Yang terbesar di antaranya adalah Yerusalem, yang telah berada di tangan bangsa Frank selama sembilan puluh satu tahun. Sultan menyingkirkan monumen-monumen yang dibangun bangsa Frank dan menghancurkan gereja-gereja yang mereka bangun. Di tempat salah satu gereja tersebut, ia membangun sebuah sekolah untuk mazhab Syafi'i. Ia tidak menghancurkan puing-puingnya, mengikuti contoh Umar, yang tidak menghancurkannya ketika ia menaklukkan Yerusalem. Anehnya, Ibnu Barjan menyebutkan dalam tafsirnya tentang “Alif Lam Mim Ghalabat Al-Rum” bahwa Yerusalem akan tetap berada di tangan bangsa Romawi hingga tahun 583 H, kemudian mereka akan dikalahkan dan Yerusalem akan ditaklukkan dan menjadi tanah Islam, berdasarkan perhitungan ayat tersebut. Dan memang demikianlah yang terjadi. Abu Syama berkata, “Ini adalah salah satu keajaiban dari apa yang terjadi.” Ibnu Barjan telah meninggal jauh sebelum itu. {cite:tarikh-khulafa-minhaj-1434 hlm. 692-693}. Dalam Shadharat al-Dhahab, ia mengalahkan bangsa Frank, menangkap raja-raja mereka, mengepung Yerusalem, dan merebutnya. Para ahli astrologi telah mengatakan kepadanya bahwa ia akan menaklukkan Yerusalem dan kehilangan satu matanya, jadi ia berkata, “Aku puas menaklukkannya dan menjadi buta.” Maka ia menaklukkannya setelah kota itu berada di tangan bangsa Frank selama lebih dari sembilan puluh tahun. Kemudian ia merebut Acre, lalu ia berkelana dan menaklukkan beberapa benteng, dan kegembiraan melanda umat Islam yang hanya Allah yang tahu. {cite:shadharat-dhahab hlm. 755}"
