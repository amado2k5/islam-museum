summary:
  en: "A battle in a valley near Mecca against the tribes of Hawazin and Thaqif, shortly after the conquest of Mecca."
  ar: "معركة في وادٍ قرب مكة ضد قبيلتي هوازن وثقيف بُعيد فتح مكة. وفي صحيح البخاري عن البراء بن عازب أن النبي لم يُوَلِّ يوم حنين حين فرشقت هوازن المسلمين بالسهام، وأنه كان على بغلته البيضاء وأبو سفيان بن الحارث آخذ برأسها وهو يقول «أنا النبي لا كذب أنا ابن عبد المطلب» {cite:sahih-al-bukhari 4315-4317}."
