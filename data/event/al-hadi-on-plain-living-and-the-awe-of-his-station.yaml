id: event/al-hadi-on-plain-living-and-the-awe-of-his-station
class: event
kind: other
label:
  ar: حديث الهادي عن حاله وملبسه وهيبته أمام الناس
  en: Al-Hadi on his way of life, dress and the awe of his station
  ur: ہادی کا اپنے طرز زندگی، لباس اور منصب کے رعب پر کلام
  es: "Al-Hadi sobre su forma de vida, su vestimenta y el respeto que inspira su posición."
  fr: "Al-Hadi parle de son mode de vie, de ses vêtements et du prestige lié à son rang."
  tr: "Hadi, halk önünde sağlık durumu, giyim tarzı ve itibarı hakkında konuştu."
  id: "Hadi berbicara tentang kondisinya, pakaiannya, dan prestisenya di hadapan orang banyak."
summary:
  ar: يروي الراوي أن الهادي كان يقول إنه لولا خوفه أن يفسد أمر الأمة لقضى نهاره مع الناس ولبس أدنى اللباس، وأنه يلبس الجيد لحفظ هيبته، وأن الناس لا يطيعون إلا من كان عليه مثل ذلك؛ ويذكر أنه كان يشترى له كل يوم لحم بدرهمين صغيرين.
  en: The narrator relates al-Hadi saying that but for fear of spoiling the community's affairs he would spend his day among the people in the plainest dress, that he wore good clothes to keep awe of his station, and that people obey only one so dressed; he also notes that meat was bought for him each day for two small dirhams.
  ur: راوی بیان کرتا ہے کہ ہادی کہتے تھے کہ اگر امت کا کام بگڑنے کا خوف نہ ہوتا تو وہ سارا دن لوگوں کے ساتھ سادہ ترین لباس میں گزارتے، اچھا لباس رعب باقی رکھنے کو پہنتے ہیں اور لوگ اسی کی اطاعت کرتے ہیں جس پر ایسا لباس ہو؛ نیز ان کے لیے روز دو چھوٹے درہم کا گوشت خریدا جاتا۔
  es: "El narrador relata que al-Hadi decía que, de no ser por el temor a perturbar los asuntos de la comunidad, pasaba el día entre la gente con la ropa más sencilla, que vestía bien para mantener el respeto por su posición y que la gente solo obedecía a quien iba vestido así; también señala que le compraban carne cada día por dos pequeños dirhams."
  fr: "Le narrateur rapporte qu'al-Hadi disait que, sans la crainte de perturber les affaires de la communauté, il passerait ses journées parmi le peuple vêtu très simplement, qu'il portait de beaux vêtements pour maintenir le respect dû à son rang, et que les gens n'obéissaient qu'à celui ainsi vêtu; il note également que de la viande lui était achetée chaque jour pour deux petits dirhams."
  tr: "Anlatıcı, Hadid'in, eğer milletin işlerini bozmaktan korkmasaydı, gününü halkla birlikte en sade kıyafetlerle geçireceğini, onurunu korumak için güzel kıyafetler giydiğini ve insanların ancak böyle olanlara itaat ettiğini söylediğini aktarır; ayrıca kendisine her gün iki dirheme et alındığını da belirtir."
  id: "Narator menceritakan bahwa Al-Hadi biasa berkata bahwa jika bukan karena takut merusak urusan negara, ia akan menghabiskan harinya bersama rakyat dengan mengenakan pakaian paling sederhana, dan bahwa ia mengenakan pakaian bagus untuk menjaga martabatnya, dan bahwa orang hanya menaati mereka yang seperti itu; dan ia menyebutkan bahwa daging dibelikan untuknya setiap hari dengan harga dua dirham kecil."
