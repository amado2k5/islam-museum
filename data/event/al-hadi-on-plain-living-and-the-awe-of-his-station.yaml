id: event/al-hadi-on-plain-living-and-the-awe-of-his-station
class: event
kind: other
label:
  ar: حديث الهادي عن حاله وملبسه وهيبته أمام الناس
  en: Al-Hadi on his way of life, dress and the awe of his station
  ur: ہادی کا اپنے طرز زندگی، لباس اور منصب کے رعب پر کلام
summary:
  ar: يروي الراوي أن الهادي كان يقول إنه لولا خوفه أن يفسد أمر الأمة لقضى نهاره مع الناس ولبس أدنى اللباس، وأنه يلبس الجيد لحفظ هيبته، وأن الناس لا يطيعون إلا من كان عليه مثل ذلك؛ ويذكر أنه كان يشترى له كل يوم لحم بدرهمين صغيرين.
  en: The narrator relates al-Hadi saying that but for fear of spoiling the community's affairs he would spend his day among the people in the plainest dress, that he wore good clothes to keep awe of his station, and that people obey only one so dressed; he also notes that meat was bought for him each day for two small dirhams.
  ur: راوی بیان کرتا ہے کہ ہادی کہتے تھے کہ اگر امت کا کام بگڑنے کا خوف نہ ہوتا تو وہ سارا دن لوگوں کے ساتھ سادہ ترین لباس میں گزارتے، اچھا لباس رعب باقی رکھنے کو پہنتے ہیں اور لوگ اسی کی اطاعت کرتے ہیں جس پر ایسا لباس ہو؛ نیز ان کے لیے روز دو چھوٹے درہم کا گوشت خریدا جاتا۔
