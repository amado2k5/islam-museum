id: event/ibn-asakir-second-rihla-529
class: event
kind: other
label:
  ar: "الرحلة الكبرى الثانية لابن عساكر إلى المشرق، ٥٢٩-٥٣٣هـ/١١٣٥-١١٣٩م"
  en: "Ibn 'Asakir's second great journey east, 529-533/1135-1139"
  ur: "ابن عساکر کا مشرق کی طرف دوسرا بڑا سفر، 529-533ھ/1135-1139ء"
summary:
  ar: "رحل ابن عساكر سنة تسع وعشرين على أذربيجان إلى جرجان وجال في بلادها ودخل أصبهان وبقي في هذه الرحلة نحو أربع سنين، فسمع أبا عبد الله الفراوي وعبد المنعم بن القشيري وخلقاً {cite:tarikh-islam-dhahabi p. 71}؛ وقطع خراسان وزار أصبهان وسافر في ما وراء النهر وأقام بمرو حيث لقي أبا سعد السمعاني وصحبه إلى نيسابور وهراة، وقد دخل نيسابور قبل السمعاني بنحو شهر في سنة تسع وعشرين واتفق خروجه سنة ثلاث وثلاثين {cite:tarikh-islam-dhahabi p. 76}."
  en: "In 529 Ibn 'Asakir set out east by way of Azerbaijan to Jurjan, travelled its lands and entered Isfahan, staying on this journey about four years, hearing Abu 'Abdallah al-Furawi, 'Abd al-Mun'im ibn al-Qushayri and many more {cite:tarikh-islam-dhahabi p. 71}. He crossed Khurasan, visited Isfahan, travelled in Transoxiana and stayed at Marw, where he met Abu Sa'd al-Sam'ani and went with him to Nishapur and Herat; he had entered Nishapur about a month before al-Sam'ani in 529 and agreed to leave in 533 {cite:tarikh-islam-dhahabi p. 76}."
  ur: "529ھ میں ابن عساکر آذربائیجان سے جرجان کی طرف روانہ ہوئے، وہاں کے علاقے پھرے اور اصفہان داخل ہوئے — اس سفر میں تقریباً چار برس لگے — اور ابوعبداللہ فراوی، عبدالمنعم بن قشیری اور بہتوں سے سماعت کی {cite:tarikh-islam-dhahabi p. 71}؛ خراسان سے ہو کر اصفہان آئے، ماوراء النہر میں سفر کیا اور مرو میں قیام کیا جہاں ابو سعد سمعانی سے ملے اور ان کے ساتھ نیشاپور و ہرات گئے؛ وہ 529ھ میں سمعانی سے تقریباً ایک مہینہ پہلے نیشاپور داخل ہوئے اور 533ھ میں روانگی طے پائی {cite:tarikh-islam-dhahabi p. 76}۔"
