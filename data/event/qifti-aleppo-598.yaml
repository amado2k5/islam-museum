id: event/qifti-aleppo-598
class: event
kind: other
label:
  ar: "القفطي يفارق القدس إلى حلب، ٥٩٨هـ"
  en: "Al-Qifti leaves Jerusalem for Aleppo, 598/1201"
  ur: "قفطی قدس سے حلب چلے گئے، 598ھ/1201ء"
  es: "Al-Qifti sale de Jerusalén hacia Alepo, 598/1201"
  fr: "Al-Qifti quitte Jérusalem pour Alep, 598/1201"
  tr: "Al-Qifti, H. 598'de Halep'e gitmek üzere Kudüs'ten ayrılıyor"
  id: "Al-Qifti meninggalkan Yerusalem menuju Aleppo, 598 H"
summary:
  ar: "اضطر القفطي — بسبب الاضطرابات التي تلت وفاة صلاح الدين — إلى الرحيل سنة ثمان وتسعين وخمسمائة إلى حلب، حيث رعاه صديق لأبيه وشجعه فعاد إلى الاشتغال بالعلم سنوات {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  en: "The disturbances that followed Salah al-Din's death forced al-Qifti to leave in 598/1201 for Aleppo, where the protection and encouragement of a friend of his father let him resume his scholarly pursuits for several years {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  ur: "صلاح الدین کی وفات کے بعد مچی گڈ مڈ نے قفطی کو 598ھ/1201ء میں حلب جانے پر مجبور کر دیا، جہاں والد کے ایک دوست کی سرپرستی اور ہمت افزائی سے وہ کئی برس علمی مشاغل میں لگے رہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}۔"
  es: "Los disturbios que siguieron a la muerte de Salah al-Din obligaron a al-Qifti a partir en 598/1201 hacia Alepo, donde la protección y el aliento de un amigo de su padre le permitieron reanudar sus actividades académicas durante varios años {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  fr: "Les troubles qui suivirent la mort de Salah al-Din forcèrent al-Qifti à partir en 598/1201 pour Alep, où la protection et les encouragements d'un ami de son père lui permirent de reprendre ses activités savantes pendant plusieurs années {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  tr: "Selahaddin'in ölümünün ardından yaşanan karışıklıklar nedeniyle, el-Kifti Hicri 598 yılında Halep'e gitmek zorunda kaldı. Orada babasının bir arkadaşı ona sahip çıktı ve onu cesaretlendirdi, böylece yıllarca bilim alanında çalışmaya devam etti. {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}"
  id: "Karena kekacauan yang terjadi setelah kematian Saladin, al-Qifti terpaksa meninggalkan Islam pada tahun 598 Hijriah menuju Aleppo, di mana seorang teman ayahnya merawat dan menyemangatinya, sehingga ia kembali bekerja di bidang ilmu pengetahuan selama bertahun-tahun. {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
