label:
  ar: "وفاة محيي الدين يحيى بن فضل الله، ٧٣٨هـ/١٣٣٨م"
  en: "Death of Muhyi al-Din Yahya ibn Fadl Allah, 738/1338"
  ur: "محی الدین یحیی بن فضل اللہ کی وفات، 738ھ/1338ء"
summary:
  ar: "توفي محيي الدين يحيى بن فضل الله، صاحب ديوان الإنشاء بدمشق ثم بالديار المصرية وكاتب السر الشريف، في تاسع رمضان سنة ٧٣٨هـ وله ثلاث وتسعون سنة، بعد أن استعفى من المنصب وعزم على التحول إلى الشام ليموت بها؛ فاستقر بعده ابنه الأصغر القاضي علاء الدين في كتابة السر {cite:durar-kamina-jil-1993 1/425-426} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  en: "Muhyi al-Din Yahya ibn Fadl Allah, head of the chancery at Damascus then in Egypt and katib al-sirr al-sharif, died on 9 Ramadan 738 at ninety-three, having resigned his post with leave to return to Syria to die there; his younger son, the qadi Ala al-Din, was installed as katib al-sirr after him {cite:durar-kamina-jil-1993 1/425-426} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  ur: "محی الدین یحیی بن فضل اللہ، دمشق اور پھر مصر میں دیوانِ انشا کے صاحب اور کاتبِ سر شریف، 9 رمضان 738ھ کو ترانوے برس کی عمر میں فوت ہوئے؛ انہوں نے عہدے سے استعفا لیا تھا اور شام واپس جا کر وہیں وفات پانے کا ارادہ کیا تھا؛ ان کے بعد چھوٹے بیٹے قاضی علاء الدین کو کاتبِ سر مقرر کیا گیا {cite:durar-kamina-jil-1993 1/425-426} {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}۔"
