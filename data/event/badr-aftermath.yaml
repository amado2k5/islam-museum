label: { ar: "بعد بدر: القتلى والأسرى والأنفال وأخبار المدينة ومكة", en: "After Badr: the dead, the captives, the spoils, and the news in Mecca and Medina", fr: "Après Badr : les morts, les captifs, le butin et la nouvelle à La Mecque et à Médine", es: "Tras Badr: los muertos, los cautivos, el botín y las noticias en La Meca y Medina.", ur: "بدر کے بعد: میت، اسیری، غنیمت اور مکہ اور مدینہ کی خبریں۔" }
summary:
  ar: "استشهد من المسلمين أربعة عشر رجلاً، وقُتل من المشركين نحو سبعين وأُسر نحو سبعين، وألقي القتلى في القليب، وخبرت مكة بالهزيمة، ثم بعث النبي بشيرين إلى المدينة، وقسم الغنائم بعد خلاف، وأطلق الأسرى بالفداء، وفرض الصيام والزكاة."
  en: "Fourteen Muslims were martyred, about seventy Meccans were killed and about seventy taken captive; the dead were thrown into a well, Mecca received the news of the rout, the Prophet sent two messengers to Medina, the spoils were divided after a dispute, the captives were ransomed, and fasting and zakat al-fitr were prescribed."
  fr: "Quatorze musulmans tombèrent en martyrs, environ soixante-dix Mecquois furent tués et environ soixante-dix faits captifs ; les morts furent jetés dans un puits, La Mecque apprit la nouvelle de la déroute, le Prophète envoya deux messagers à Médine, le butin fut partagé après une dispute, les captifs furent rachetés, et le jeûne et la zakat al-fitr furent prescrits."
  es: "Catorce musulmanes fueron martirizados, unos setenta mequenses murieron y otros setenta fueron hechos prisioneros; los muertos fueron arrojados a un pozo, La Meca recibió la noticia de la derrota, el Profeta envió dos mensajeros a Medina, el botín se repartió tras una disputa, los cautivos fueron rescatados y se prescribieron el ayuno y el zakat al-fitr."
  ur: "چودہ مسلمان شہید ہوئے، ستر کے قریب مکہ والے مارے گئے اور ستر کے قریب قیدی بنائے گئے۔ مُردوں کو کنویں میں ڈال دیا گیا، مکہ کو شکست کی خبر ملی، رسول اللہ نے دو قاصد مدینہ بھیجے، جھگڑے کے بعد مال غنیمت تقسیم کیا گیا، قیدیوں کو فدیہ دیا گیا، روزہ اور فطرانہ فرض کیا گیا۔"
