id: event/badr-aftermath
education:
  did_you_know:
    ar: "بعد بدر بلغ الخبر مكة ودخل النبي المدينة غانماً، وفدى الأسرى بمال أو تعليم عشرة غلمان الكتابة كما تروي السيرة."
    en: "After Badr, word reached Mecca while the Prophet entered Medina victorious; captives were ransomed for money or by teaching ten boys to write, the sirah recounts."
    ur: "بدر کے بعد خبر مکہ پہنچی اور نبی مدینہ فاتحانہ داخل ہوئے؛ قیدیوں کا فدیہ مال سے یا دس لڑکوں کو لکھنا سکھا کر لیا گیا، سیرت کے مطابق۔"
    sources: [source/mubarakpuri-raheeq, source/sahih-muslim]
class: event
kind: other
label: { ar: "بعد بدر: القتلى والأسرى والأنفال وأخبار المدينة ومكة", en: "After Badr: the dead, the captives, the spoils, and the news in Mecca and Medina" }
summary:
  ar: "استشهد من المسلمين أربعة عشر رجلاً، وقُتل من المشركين نحو سبعين وأُسر نحو سبعين، وألقي القتلى في القليب، وخبرت مكة بالهزيمة، ثم بعث النبي بشيرين إلى المدينة، وقسم الغنائم بعد خلاف، وأطلق الأسرى بالفداء، وفرض الصيام والزكاة."
  en: "Fourteen Muslims were martyred, about seventy Meccans were killed and about seventy taken captive; the dead were thrown into a well, Mecca received the news of the rout, the Prophet sent two messengers to Medina, the spoils were divided after a dispute, the captives were ransomed, and fasting and zakat al-fitr were prescribed."
