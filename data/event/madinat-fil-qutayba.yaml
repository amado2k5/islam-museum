id: event/madinat-fil-qutayba
class: event
kind: conquest
label: { ar: "فتح قتيبة مدينة الفيل", en: "Qutayba's Conquest of Madinat al-Fil", es: "La conquista de Madinat al-Fil por Qutayba", fr: "La conquête de Madinat al-Fil par Qutayba", ur: "قتیبہ کی فتح مدینۃ الفیل" }
summary:
  ar: "غزا قتيبة مدينة فيل ففتحها وقد كان أمية بن عبد الله بن خالد بن أسيد فتحها ثم نكثوا ورامها يزيد بن المهلب فلم يقدر عليها فقال كعب الأشثري ورامها قبلك الفجفاجة الصلف أعطتك فيل بأيديها وحق لها يعني يزيد بن المهلب."
  en: "Qutayba took Madinat Fil — opened earlier by Umayya ibn Abdallah, then breached, and Yazid ibn al-Muhallab's assault failed — whence Ka'b al-Ashthari's verse: 'Fil gave itself to you with her own hands, and well she deserved'."
  es: "Qutayba tomó Madinat Fil —abierta anteriormente por Umayya ibn Abdallah, luego conquistada, y el asalto de Yazid ibn al-Muhallab fracasó— de donde proviene el verso de Ka'b al-Ashthari: \"Fil se entregó a ti con sus propias manos, y bien lo merecía\"."
  fr: "Qutayba prit Madinat Fil — ouverte plus tôt par Umayya ibn Abdallah, puis percée, et l'assaut de Yazid ibn al-Muhallab échoua — d'où le verset de Ka'b al-Ashthari: « Fil s'est donnée à vous de ses propres mains, et elle le méritait bien »."
  ur: "قتیبہ نے مدینۃ فل کو لے لیا - جو پہلے امیہ بن عبداللہ نے کھولا تھا، پھر اس کی خلاف ورزی کی، اور یزید ابن المحلب کا حملہ ناکام ہوگیا - جہاں کعب الاشتری کی آیت: 'فل نے اپنے ہاتھوں سے آپ کو دے دیا، اور وہ اس کی مستحق تھی'۔"
