label: { ar: "تقليد الخليفة القائم طغربك ملك المشرق والمغرب" }
summary:
  ar: "في ذي القعدة سنة تسع وأربعين وأربعمائة لقي السلطان طغربك الخليفة القائم بأمر الله في لقاء تقرّر كونه بعد مشاورات؛ جلس رئيس الرؤساء في صدر رواق صحن السلام وبين يديه الحجاب، وكتب إلى السلطان بإذن أمير المؤمنين في الحضور، فنزل في الطيار ومعه سميريات وعلى الظهر فيلان، ودخل الدار والأمراء يمشون بين يديه ونحو خمسمائة غلام ترك، حتى وصل إلى باب دهنيز صحن السلام. ودخل على أمير المؤمنين وهو على سرير عالٍ من الإبريسم نحو سبعة أذرع، عليه قيمس وعمامة مصمتان، وعلى منكبه بردة النبي وبيده القضيب؛ فلما شاهده السلطان قبّل الأرض دفعات، وأمره الخليفة أن يصعد إلى سرير لطيف دون ذلك السرير ومعه ابن منصور الكندري، ثم طرح كرسي فجلس عليه السلطان. وقال له أمير المؤمنين على لسان رئيس الرؤساء: يا علي، أمير المؤمنين حامد لسعيك شاكر لفضلك، قد ولاّك جميع ما ولاّه الله من بلاده وردّ إليك مراعاة عباده، فاتق الله فيما ولاّك واجتهد في عمارة البلاد وصلاح العباد ونشر العدل وكف الظلم — فسّر له عميد الملك القول فقام وقبّل الأرض وقال: أنا خادم أمير المؤمنين وعبده ومتصرّف على أمره ونهيه. فأُلبس سبع خلع في زي واحد وترك التاج على رأسه وعاد يمشي بين يدي أمير المؤمنين، وأخرج أمير المؤمنين سيفًا من بين يديه فقلّده إياه وخاطبه بـ«ملك المشرق والمغرب»، واستدعى الألوية — ثلاثة، اثنان خُمريّان بكتائب صفر وآخر بكتائب مذهّبة سُمّي لواء الحمد — فعقد أمير المؤمنين لواء الحمد بيده، وأُحضر العهد فقُرئ عليه، ودفعه إليه منصور بن أحمد نائب الخليفة لديه. وسأل السلطان مصافحة اليد الشريفة فأعطاه أمير المؤمنين يده مرتين يقبّلها ويضعها على عينيه، وخرج والخلع والألوية أمامه فرفعت فوق صحن السلام وحُطّت على روشن بيت النوبة ثم إلى الطيار {cite:muntazam-ibn-al-jawzi j.8 p.523-525}."
  en: "In Dhu'l-Qa'da 449, the full investiture of Sultan Tughril by the caliph al-Qa'im: the caliph seated on a seven-cubit silk couch with the Prophet's mantle on his shoulder and the staff in his hand, Tughril kissing the ground at each approach, mounted on a lower couch, addressed 'O Ali' through the ra'is al-ru'asa' — 'Amir al-Mu'minin has invested you with all the lands God gave him: fear God, spread justice, restrain wrong.' Seven robes in one rite, a sword girded by the caliph's own hand, the style 'king of East and West', three standards with the liwa' al-hamd bound by the caliph himself, the investiture-patent read over him — and Tughril twice kissing the outstretched hand and laying it on his eyes {cite:muntazam-ibn-al-jawzi j.8 p.523-525}."
