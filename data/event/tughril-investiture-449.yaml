label: { ar: "تقليد الخليفة القائم طغربك ملك المشرق والمغرب", en: "Investiture of Tughril as King of the East and West by Caliph al-Qa'im", es: "Investidura de Tughril como Rey de Oriente y Occidente por el califa al-Qa'im", fr: "Investiture de Tughril comme roi d'Orient et d'Occident par le calife al-Qa'im", ur: "خلیفہ القائم کی طرف سے مشرق و مغرب کے بادشاہ کے طور پر طغرل کی سرمایہ کاری", tr: "Doğu ve Batı Kralı Halife el-Kaim Tuğrbak'ın geleneği", id: "Tradisi Khalifah al-Qa'im Tughrbak, Raja Timur dan Barat" }
summary:
  ar: "في ذي القعدة سنة تسع وأربعين وأربعمائة لقي السلطان طغربك الخليفة القائم بأمر الله في لقاء تقرّر كونه بعد مشاورات؛ جلس رئيس الرؤساء في صدر رواق صحن السلام وبين يديه الحجاب، وكتب إلى السلطان بإذن أمير المؤمنين في الحضور، فنزل في الطيار ومعه سميريات وعلى الظهر فيلان، ودخل الدار والأمراء يمشون بين يديه ونحو خمسمائة غلام ترك، حتى وصل إلى باب دهنيز صحن السلام. ودخل على أمير المؤمنين وهو على سرير عالٍ من الإبريسم نحو سبعة أذرع، عليه قيمس وعمامة مصمتان، وعلى منكبه بردة النبي وبيده القضيب؛ فلما شاهده السلطان قبّل الأرض دفعات، وأمره الخليفة أن يصعد إلى سرير لطيف دون ذلك السرير ومعه ابن منصور الكندري، ثم طرح كرسي فجلس عليه السلطان. وقال له أمير المؤمنين على لسان رئيس الرؤساء: يا علي، أمير المؤمنين حامد لسعيك شاكر لفضلك، قد ولاّك جميع ما ولاّه الله من بلاده وردّ إليك مراعاة عباده، فاتق الله فيما ولاّك واجتهد في عمارة البلاد وصلاح العباد ونشر العدل وكف الظلم — فسّر له عميد الملك القول فقام وقبّل الأرض وقال: أنا خادم أمير المؤمنين وعبده ومتصرّف على أمره ونهيه. فأُلبس سبع خلع في زي واحد وترك التاج على رأسه وعاد يمشي بين يدي أمير المؤمنين، وأخرج أمير المؤمنين سيفًا من بين يديه فقلّده إياه وخاطبه بـ«ملك المشرق والمغرب»، واستدعى الألوية — ثلاثة، اثنان خُمريّان بكتائب صفر وآخر بكتائب مذهّبة سُمّي لواء الحمد — فعقد أمير المؤمنين لواء الحمد بيده، وأُحضر العهد فقُرئ عليه، ودفعه إليه منصور بن أحمد نائب الخليفة لديه. وسأل السلطان مصافحة اليد الشريفة فأعطاه أمير المؤمنين يده مرتين يقبّلها ويضعها على عينيه، وخرج والخلع والألوية أمامه فرفعت فوق صحن السلام وحُطّت على روشن بيت النوبة ثم إلى الطيار {cite:muntazam-ibn-al-jawzi j.8 p.523-525}."
  en: "In Dhu'l-Qa'da 449, the full investiture of Sultan Tughril by the caliph al-Qa'im: the caliph seated on a seven-cubit silk couch with the Prophet's mantle on his shoulder and the staff in his hand, Tughril kissing the ground at each approach, mounted on a lower couch, addressed 'O Ali' through the ra'is al-ru'asa' — 'Amir al-Mu'minin has invested you with all the lands God gave him: fear God, spread justice, restrain wrong.' Seven robes in one rite, a sword girded by the caliph's own hand, the style 'king of East and West', three standards with the liwa' al-hamd bound by the caliph himself, the investiture-patent read over him — and Tughril twice kissing the outstretched hand and laying it on his eyes {cite:muntazam-ibn-al-jawzi j.8 p.523-525}."
  es: "En Dhu'l-Qa'da 449, la investidura completa del sultán Tughril por el califa al-Qa'im: el califa sentado en un diván de seda de siete codos con el manto del Profeta sobre su hombro y el bastón en su mano, Tughril besando el suelo en cada aproximación, montado en un diván más bajo, dirigido 'Oh Ali' a través del ra'is al-ru'asa': 'Amir al-Mu'minin te ha investido con todas las tierras que Dios le dio: teme a Dios, difunde la justicia, frena la injusticia'. Siete túnicas en un rito, una espada ceñida por la propia mano del califa, el estilo 'rey de Oriente y Occidente', tres estandartes con el liwa' al-hamd atados por el propio califa, la patente de investidura leída sobre él, y Tughril besando dos veces la mano extendida y poniéndola sobre sus ojos {cite:muntazam-ibn-al-jawzi j.8 p.523-525}."
  fr: "En Dhu'l-Qa'da 449, eut lieu l'investiture complète du sultan Tughril par le calife al-Qa'im: le calife, assis sur un lit de soie de sept coudées, le manteau du Prophète sur l'épaule et le bâton à la main, Tughril, embrassant le sol à chaque approche, monté sur un lit plus bas, s'adressa à lui par le ra'is al-ru'asa': « Amir al-Mu'minin t'a investi de toutes les terres que Dieu lui a données: crains Dieu, répands la justice, réprime le mal. » Sept robes dans un seul rite, une épée ceinte par la main même du calife, le style « roi d'Orient et d'Occident », trois étendards avec le liwa' al-hamd liés par le calife lui-même, l'investiture patente lue sur lui — et Tughril embrassant deux fois la main tendue et la posant sur ses yeux {cite:muntazam-ibn-al-jawzi j.8 p.523-525}."
  ur: "ذوالقعدہ 449 میں، خلیفہ القائم کی طرف سے سلطان طغرل کی مکمل سرمایہ کاری: خلیفہ سات ہاتھ کے ریشمی صوفے پر بیٹھا ہے جس کے کندھے پر رسول اللہ کی چادر اور ہاتھ میں عصا ہے، طغرل زمین کو چوم رہا ہے، ہر ایک طرف زمین کو چوم رہا ہے، نچلے صوفے پر بذریعہ علی نصب ہے۔ 'امیر المومنین نے آپ کو ان تمام زمینوں کے ساتھ سرمایہ کاری کر دی ہے جو خدا نے انہیں دی ہیں: خدا سے ڈرو، انصاف کو پھیلاو، غلط کو روکو۔' ایک رسم میں سات لباس، خلیفہ کے اپنے ہاتھ سے باندھی ہوئی ایک تلوار، 'مشرق و مغرب کا بادشاہ' کا انداز، خود خلیفہ کی طرف سے بندھے ہوئے لیوۃ الحمد کے ساتھ تین معیار، ان کے اوپر پڑھا گیا سرمایہ - اور طغرل نے دو بار بڑھے ہوئے ہاتھ کو بوسہ دیا اور اسے اپنی آنکھوں پر رکھا:۔ صفحہ 523-525}۔"
  tr: "Hicri 449 yılının Zilhicce ayında Sultan Tuğrbek, istişarelerden sonra düzenlenen bir görüşmede Halife el-Kaim bi-Amr Allah ile bir araya geldi. Başkomutan, önünde saray görevlileriyle birlikte, Barış Divanı'nın revakının başında oturuyordu. Müminlerin Emiri'nin izniyle Sultan'a katılmak için mektup yazdı. İki filin eşlik ettiği bir kervanla saraya girdi ve önünde emirler ve yaklaşık beş yüz Türk hizmetkarla birlikte Barış Divanı'nın kapısına kadar geldi. İçeri girdiğinde, yaklaşık yedi arşın yüksekliğinde ipek bir tahtta oturan, cübbe ve kalın bir sarık giymiş, omzunda Peygamberin cübbesi ve elinde bir asa bulunan Müminlerin Emiri'ni gördü. Sultan onu görünce birkaç kez yere öptü. Halife, İbn Mansur el-Kundari eşliğinde daha alçak, daha mütevazı bir tahta çıkmasını emretti. Sonra bir sandalye getirildi ve Sultan üzerine oturdu. Müminlerin Komutanı, başkomutanın başı aracılığıyla ona şöyle dedi: “Ey Ali, Müminlerin Komutanı çabalarını övüyor ve lütfun için minnettardır. Allah'ın kendisine emanet ettiği toprakların tamamını sana emanet etmiş ve kullarının refahını senin sorumluluğuna bırakmıştır. Öyleyse Allah'tan kork ve sana emanet ettiği şeylerde gayret göster, ülkeyi geliştir, halkı ıslah et, adaleti yay ve zulmü önle.” Kralın başı bunu ona açıkladı, o da ayağa kalktı, yeri öptü ve şöyle dedi: “Ben Müminlerin Komutanının hizmetkarıyım, onun kölesiyim ve onun emirlerine ve yasaklarına göre hareket ederim.” Sonra yedi onur elbisesini tek bir kıyafet içinde giydirildi, tacı başında bırakıldı ve tekrar Müminlerin Komutanının önünde yürüdü. Müminlerin Komutanı önünden bir kılıç çıkardı ve ona “Doğu ve Batı Kralı” diye hitap ederek onu ona verdi. Sultan, üç sancağı çağırdı: ikisi sarı taburlu kırmızı, biri de altın taburlu ve \"Övgü Sancağı\" olarak adlandırılan sancak. Müminlerin Komutanı, Övgü Sancağını kendi eliyle bağladı. Ahit kendisine getirildi ve okundu; halifenin vekili Mansur ibn Ahmed, ahiti ona teslim etti. Sultan, asil el sıkışmak istedi; bunun üzerine Müminlerin Komutanı iki kez elini uzattı, Sultan elini öptü ve gözlerine koydu. Önünde cübbeler ve sancaklarla dışarı çıktı; bunlar barış avlusunun üzerine kaldırıldı ve Nubiyalılar Evi'nin penceresine, oradan da pilota yerleştirildi. {cite:muntazam-ibn-al-jawzi j.8 p.523-525}"
  id: "Pada bulan Dzul Qi'dah tahun 449 Hijriah, Sultan Tughrbek bertemu dengan Khalifah al-Qa'im bi-Amr Allah dalam sebuah pertemuan yang telah diatur setelah musyawarah. Pemimpin tertinggi duduk di ujung serambi Halaman Perdamaian, dengan para pengawal di depannya. Ia menulis surat kepada Sultan dengan izin dari Amirul Mukminin untuk hadir. Ia turun dari kafilah, diiringi oleh dua gajah, dan memasuki istana dengan para emir berjalan di depannya dan sekitar lima ratus pengawal Turki, hingga ia mencapai gerbang Halaman Perdamaian. Ia masuk untuk menemui Amirul Mukminin, yang duduk di atas singgasana sutra tinggi sekitar tujuh hasta, mengenakan jubah dan sorban tebal, dengan selendang Nabi di bahunya dan tongkat di tangannya. Ketika Sultan melihatnya, ia mencium tanah beberapa kali. Khalifah memerintahkannya untuk naik ke singgasana yang lebih rendah dan sederhana, diiringi oleh Ibn Mansur al-Kundari. Kemudian sebuah kursi dibawa keluar, dan Sultan duduk di atasnya. Amirul Mukminin, melalui kepala para pemimpin, berkata kepadanya: “Wahai Ali, Amirul Mukminin memuji usahamu dan bersyukur atas karunia yang kau terima. Beliau telah mempercayakan kepadamu segala yang telah Allah percayakan kepadanya dari tanah-Nya dan telah menempatkan dalam pengawasanmu kesejahteraan hamba-hamba-Nya. Maka takutlah kepada Allah dalam apa yang telah Dia percayakan kepadamu, dan berusahalah untuk mengembangkan negeri ini, mereformasi rakyat, menyebarkan keadilan, dan mencegah penindasan.” Kepala raja menjelaskan hal ini kepadanya, lalu ia berdiri, mencium tanah, dan berkata: “Aku adalah hamba Amirul Mukminin, budaknya, dan aku bertindak sesuai dengan perintah dan larangannya.” Kemudian ia mengenakan tujuh jubah kehormatan dalam satu pakaian, mahkota tetap di kepalanya, dan ia berjalan kembali di hadapan Amirul Mukminin. Amirul Mukminin mengeluarkan pedang dari hadapannya dan menganugerahkannya kepadanya, memanggilnya sebagai “Raja Timur dan Barat.” Ia memanggil panji-panji—tiga buah: dua berwarna merah dengan batalion kuning dan satu dengan batalion berlapis emas, yang disebut Panji Pujian—dan Amirul Mukminin mengikat Panji Pujian dengan tangannya sendiri. Perjanjian itu dibawa dan dibacakan kepadanya, dan Mansur bin Ahmad, wakil Khalifah, menyerahkannya kepadanya. Sultan meminta untuk menjabat tangan yang mulia itu, maka Amirul Mukminin memberikan tangannya dua kali, yang kemudian diciumnya dan diletakkan di atas matanya. Ia keluar dengan jubah dan panji-panji di depannya, dan semuanya diangkat di atas halaman perdamaian dan diletakkan di jendela Rumah Orang Nubia, lalu diberikan kepada pilot. {cite:muntazam-ibn-al-jawzi j.8 p.523-525}."
