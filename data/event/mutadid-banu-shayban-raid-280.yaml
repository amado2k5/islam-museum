label: { ar: "غارة المعتضد على بني شيبان", en: "Al-Mu'tadid's raid on Banu Shayban", es: "La incursión de Al-Mu'tadid en Banu Shayban", fr: "Raid d'Al-Mu'tadid sur Banu Shayban", ur: "بنو شیبان پر معتدد کا حملہ", tr: "El-Mu'tadid'in Banu Şeyban'a baskını", id: "Penyerbuan Al-Mu'tadid terhadap Bani Syayban" }
summary:
  ar: "لليلة خلت من صفر سنة ثمانين ومائتين شخص المعتضد من بغداد يريد بني شيبان فقصد الموضع الذي كانوا يتخذونه معقلًا فأوقع بهم وقتل وسبى، ومعه دليل طيب الصوت أنشد أعرابيًا قصيدة النوباذ حتى تغرغرت عين المعتضد وقال ما سلم أحد من الحدثان، ودخل بيوت الأعراب في عدة قليلة فلحقه بدر فقال لو عرفوك وأقدموا عليك كيف كانت تكون حالك، فقال لو عرفوني لتغرّقوا أما علمت أن الرصافة وحدها عشرون ألفًا {cite:muntazam-ibn-al-jawzi p. 142}."
  en: "In early Safar 280 al-Mu'tadid rode out of Baghdad against Banu Shayban's fastness, killed and took captives; at the verses of Nubadh his eyes welled and he said 'none survives time's changes' — and when Badr asked what if the Arabs recognized him with so small an escort, he answered 'they would be the ones to drown; the Rassafa alone is twenty thousand' {cite:muntazam-ibn-al-jawzi p. 142}."
  es: "A principios de Safar 280, al-Mu'tadid salió de Bagdad contra la fortaleza de Banu Shayban, mató y tomó prisioneros; ante los versos de Nubadh se le llenaron los ojos de lágrimas y dijo: «Nadie sobrevive a los cambios del tiempo». Y cuando Badr le preguntó qué pasaría si los árabes lo reconocieran con una escolta tan pequeña, respondió: «Ellos serían los que se ahogarían; solo el Rassafa son veinte mil» {cite:muntazam-ibn-al-jawzi p. 142}."
  fr: "Au début du Safar 280, al-Mu'tadid sortit de Bagdad et marcha sur les remparts des Banu Shayban, tuant et faisant des prisonniers; aux versets de Nubadh, ses yeux s'emplirent de larmes et il dit: « Nul ne survit aux changements du temps » — et lorsque Badr lui demanda ce qui se passerait si les Arabes le reconnaissaient avec une si petite escorte, il répondit: « Ce sont eux qui se noieraient; le Rassafa à lui seul compte vingt mille hommes » {cite: muntazam-ibn-al-jawzi p. 142}."
  ur: "صفر 280 کے اوائل میں المتعد بنو شیبان کی مضبوطی کے خلاف بغداد سے نکلا، قتل کیا اور قیدی بنا لیا۔ نوبد کی آیات پر اس کی آنکھیں اشکبار ہوگئیں اور اس نے کہا کہ وقت کی تبدیلی سے کوئی بھی زندہ نہیں رہتا - اور جب بدر نے پوچھا کہ اگر عربوں نے اسے اتنے چھوٹے دستے سے پہچان لیا تو اس نے جواب دیا کہ وہ ڈوبنے والے ہوں گے۔ صرف راصفہ بیس ہزار ہے'' {حوالہ دیں:منتزم ابن الجوزی ص۔ 142}۔"
  tr: "280 yılının Safer ayında bir gece, Mu'tedid Bağdat'tan Beni Şeyban'a gitti. Onların kale olarak kullandıkları yere gitti ve onlara saldırdı, öldürdü ve esir aldı. Yanında hoş sesli bir rehber vardı; bu rehber bir Bedevi'ye Nevbede şiirini okudu, ta ki Mu'tedid'in gözleri yaşarana ve \"Hiç kimse musibetten kurtulamaz\" diyene kadar. Az sayıda adamıyla Bedevi çadırlarına girdi ve Bedir ona yetişip, \"Seni tanısalar ve peşinden gelselerdi, durumun ne olurdu?\" dedi. Mu'tedid, \"Beni tanısalar boğulurlardı. Bilmiyor muydun ki, sadece Rusafada yirmi bin adam var?\" dedi. {alıntı: Muntazam ibn el-Cevzi s. 142}"
  id: "Pada suatu malam di bulan Safar tahun 280, Al-Mu’tadid pergi dari Baghdad ke Bani Shayban. Ia pergi ke tempat yang telah mereka jadikan benteng, dan ia menyerang mereka, membunuh dan menawan beberapa orang. Ia ditemani seorang pemandu dengan suara merdu yang membacakan puisi Al-Nawbadh kepada seorang Badui hingga mata Al-Mu’tadid berkaca-kaca dan ia berkata, “Tidak ada seorang pun yang aman dari kemalangan.” Ia memasuki tenda-tenda Badui dengan sejumlah kecil orang, dan Badr menyusulnya dan berkata, “Jika mereka mengenalmu dan mengejarmu, bagaimana keadaanmu?” Ia menjawab, “Jika mereka mengenalku, mereka akan tenggelam. Tidakkah kau tahu bahwa Al-Rusafa sendiri memiliki dua puluh ribu orang?” {cite:muntazam-ibn-al-jawzi p. 142}."
