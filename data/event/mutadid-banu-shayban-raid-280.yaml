label: { ar: "غارة المعتضد على بني شيبان" }
summary:
  ar: "لليلة خلت من صفر سنة ثمانين ومائتين شخص المعتضد من بغداد يريد بني شيبان فقصد الموضع الذي كانوا يتخذونه معقلًا فأوقع بهم وقتل وسبى، ومعه دليل طيب الصوت أنشد أعرابيًا قصيدة النوباذ حتى تغرغرت عين المعتضد وقال ما سلم أحد من الحدثان، ودخل بيوت الأعراب في عدة قليلة فلحقه بدر فقال لو عرفوك وأقدموا عليك كيف كانت تكون حالك، فقال لو عرفوني لتغرّقوا أما علمت أن الرصافة وحدها عشرون ألفًا {cite:muntazam-ibn-al-jawzi p. 142}."
  en: "In early Safar 280 al-Mu'tadid rode out of Baghdad against Banu Shayban's fastness, killed and took captives; at the verses of Nubadh his eyes welled and he said 'none survives time's changes' — and when Badr asked what if the Arabs recognized him with so small an escort, he answered 'they would be the ones to drown; the Rassafa alone is twenty thousand' {cite:muntazam-ibn-al-jawzi p. 142}."
