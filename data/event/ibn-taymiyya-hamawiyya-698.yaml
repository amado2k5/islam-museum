label:
  ar: "«العقيدة الحموية الكبرى» ومجالس التبرئة، ٦٩٨هـ/١٢٩٩م"
  en: "The Hamawiyya creed and the councils that cleared it, 698/1299"
  ur: "«عقیدہ حمویہ کبریٰ» اور تبرئت کے مجالس، 698ھ/1299ء"
summary:
  ar: "في سنة ٦٩٨هـ/١٢٩٩م كتب ابن تيمية بناءً على سؤال أهل حماة عقيدته «الحموية الكبرى»، شديدة المعارضة للأشعرية ولعلم الكلام. اتهمه خصومه بالتشبيه فأبى المثول أمام القاضي الحنفي جلال الدين أحمد الرازي لأنه لم يُفوَّض في مسائل الاعتقاد، وبعد مجلس خاص في دار القاضي الشافعي إمام الدين عمر القزويني دُرست فيه الحموية وقُبِلت أجوبته {cite:encyclopaedia-of-islam-2 vol. 3 p. 983}."
  en: "In 698/1299, at the request of the people of Hama, Ibn Taymiyya wrote one of his most famous professions of faith, al-Hamawiyya al-kubra, strongly hostile to Ash'arism and to kalam. Accused by his enemies of anthropomorphism, he refused to appear before the Hanafi qadi Jalal al-Din Ahmad al-Razi, who held no jurisdiction in matters of dogma; after a private council in the house of the Shafi'i qadi Imam al-Din Umar al-Qazwini, at which the Hamawiyya was studied, his answers were judged satisfactory {cite:encyclopaedia-of-islam-2 vol. 3 p. 983}."
  ur: "698ھ/1299ء میں اہل حماہ کی درخواست پر ابن تیمیہ نے اپنی مشہور عقیدہ رسالہ «الحمویہ الکبریٰ» لکھی، جو اشاعرہ اور علم کلام کی سخت مخالف تھی۔ مخالفین نے انہیں تشبیہ کا متهم کیا مگر وہ حنفی قاضی جلال الدین احمد رازی کے سامنے حاضر ہونے سے انکار رہے کیونکہ اسے عقیدہ کے معاملات میں قضا کا اختیار حاصل نہ تھا؛ شافعی قاضی امام الدین عمر قزوینی کے گھر ایک خصوصی مجلس میں حمویہ کا مطالعہ ہوا اور ان کے جوابات تسلیم کیے گئے {cite:encyclopaedia-of-islam-2 vol. 3 p. 983}۔"
