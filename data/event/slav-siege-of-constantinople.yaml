id: event/slav-siege-of-constantinople
class: event
kind: siege
label: { ar: "حصر الصقالبة القسطنطينية", en: "The Saqaliba siege of Constantinople", es: "El asedio de Saqaliba a Constantinopla", fr: "Le siège de Constantinople par Saqaliba", ur: "قسطنطنیہ کا صقلیبہ محاصرہ", tr: "Slavlar Konstantinopolis'i kuşattılar.", id: "Bangsa Slavia mengepung Konstantinopel" }
summary:
  ar: "في سنة ثلاث وثمانين ومائتين ذكر الطبري، فيما ذُكر في كتاب ورد من طرسوس، أن الصقالبة غزوا الروم حتى وصلوا إلى القسطنطينية فأُغلقت أبوابها؛ ثم استعان ملك الروم بمسلمين كانوا عنده فكشفوا الصقالبة، ثم خاف منهم فردّهم وفرّقهم في البلدان {cite:tabari-tarikh-abu-al-fadl j.10 p.45}."
  en: "In 283 al-Tabari records, in what was reported in a letter from Tarsus, that the Saqaliba (Slavs) raided the Romans until they reached Constantinople, whose gates were shut. The Roman king then enlisted Muslims who were with him, and they drove the Saqaliba back; afterwards, fearing them, he sent the Muslims back and scattered them through the towns {cite:tabari-tarikh-abu-al-fadl j.10 p.45}."
  es: "En el año 283, al-Tabari registra, según consta en una carta procedente de Tarso, que los Saqaliba (eslavos) saquearon a los romanos hasta llegar a Constantinopla, cuyas puertas estaban cerradas. El rey romano entonces reclutó a los musulmanes que estaban con él, y estos hicieron retroceder a los Saqaliba; posteriormente, temiéndoles, los envió de vuelta y los dispersó por las ciudades {cite:tabari-tarikh-abu-al-fadl j.10 p.45}."
  fr: "En 283, al-Tabari rapporte, d'après une lettre de Tarse, que les Saqaliba (Slaves) pillèrent les Romains jusqu'à Constantinople, dont les portes étaient fermées. Le roi romain mobilisa alors les musulmans qui l'accompagnaient, et ils repoussèrent les Saqaliba; par la suite, craignant ces derniers, il renvoya les musulmans et les dispersa dans les villes environnantes (voir: Tabari Tarikh Abu al-Fadl, vol. 10, p. 45)."
  ur: "283 میں الطبری ریکارڈ کرتا ہے، جس میں ترسوس کے ایک خط میں بتایا گیا تھا کہ صقالیبہ ⁦(سلاو)⁩ نے رومیوں پر چڑھائی کی یہاں تک کہ وہ قسطنطنیہ پہنچ گئے، جن کے دروازے بند تھے۔ رومی بادشاہ نے پھر مسلمانوں کو جو اس کے ساتھ تھے ان کی فہرست میں شامل کیا، اور انہوں نے صقلیبہ کو واپس بھگا دیا۔ اس کے بعد، ان سے ڈر کر، اس نے مسلمانوں کو واپس بھیج دیا اور ان کو شہروں میں منتشر کر دیا۔"
  tr: "Hicri 283 yılında, Tarsus'tan gelen bir kitapta belirtildiği üzere, Taberi, Slavların Romalılara saldırdığını ve Konstantinopolis'e kadar ulaşarak kapılarını kapattığını anlatmıştır. Bunun üzerine Roma kralı, yanındaki Müslümanlardan yardım istemiş ve onlar Slavları yenmişlerdir. Ancak Roma kralı onlardan korktuğu için onları geri göndermiş ve çeşitli ülkelere dağıtmıştır. {cite:tabari-tarikh-abu-al-fadl j.10 p.45}"
  id: "Pada tahun 283 H, Al-Tabari menyebutkan, dalam apa yang disebutkan dalam sebuah buku yang berasal dari Tarsus, bahwa bangsa Slavia menyerang Romawi hingga mencapai Konstantinopel, sehingga gerbangnya tertutup. Kemudian raja Romawi meminta bantuan dari kaum Muslim yang bersamanya, dan mereka mengalahkan bangsa Slavia. Kemudian ia takut kepada mereka, sehingga ia mengirim mereka kembali dan menyebar mereka ke berbagai negeri. {cite:tabari-tarikh-abu-al-fadl j.10 p.45}."
