label: { ar: "حصر الصقالبة القسطنطينية", en: "The Saqaliba siege of Constantinople" }
summary:
  ar: "في سنة ثلاث وثمانين ومائتين ذكر الطبري، فيما ذُكر في كتاب ورد من طرسوس، أن الصقالبة غزوا الروم حتى وصلوا إلى القسطنطينية فأُغلقت أبوابها؛ ثم استعان ملك الروم بمسلمين كانوا عنده فكشفوا الصقالبة، ثم خاف منهم فردّهم وفرّقهم في البلدان {cite:tabari-tarikh-abu-al-fadl j.10 p.45}."
  en: "In 283 al-Tabari records, in what was reported in a letter from Tarsus, that the Saqaliba (Slavs) raided the Romans until they reached Constantinople, whose gates were shut. The Roman king then enlisted Muslims who were with him, and they drove the Saqaliba back; afterwards, fearing them, he sent the Muslims back and scattered them through the towns {cite:tabari-tarikh-abu-al-fadl j.10 p.45}."
