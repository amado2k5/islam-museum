label:
  ar: "السخاوي يلازم إملاء ابن حجر مع الجماعة من ٨٤٦هـ حتى وفاته"
  en: "Al-Sakhawi joins Ibn Hajar's dictation circle, 846/1442 until the master's death"
  ur: "سخاوی ابن حجر کے مجلسِ املا میں شریک، 846ھ/1442ء سے استاد کی وفات تک"
summary:
  ar: "دوّن السخاوي عن ابن حجر ما كتبه عنه في الإملاء مع الجماعة من سنة ست وأربعين ⁦(٨٤٦هـ)⁩ إلى أن مات شيخه، وداوم على الملازمة حتى حمل عنه عاماً جماً وكان من أكثر الآخذين عنه؛ وكان منزل أبيه مجاوراً لمنزل ابن حجر فلم يفته مما يُقرأ عليه إلا النادر {cite:daw-lami-jil-1992 8/6-7}."
  en: "From 846/1442 al-Sakhawi wrote down what Ibn Hajar dictated 'with the company', continuing until the shaykh's death; his father's house adjoined Ibn Hajar's, so he missed almost nothing that was read to him and became one of his most assiduous transmitters {cite:daw-lami-jil-1992 8/6-7}."
  ur: "846ھ/1442ء سے سخاوی نے ابن حجر کی املا میں «جماعت کے ساتھ» لکھنا شروع کیا اور شیخ کی وفات تک جاری رکھا؛ اس کے والد کا مکان ابن حجر کے مکان سے ملحق تھا اس لیے جو کچھ پڑھایا جاتا اس سے کم ہی محروم رہتا اور وہ استاد کے سب سے زیادہ ناقلین میں شمار ہوا {cite:daw-lami-jil-1992 8/6-7}۔"
