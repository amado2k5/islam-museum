label:
  ar: "رحلة الحاكم النيسابوري إلى العراق والحجاز، ٣٤١هـ"
  en: "Al-Hakim's journey to Iraq and the Hijaz, 341/952"
  ur: "حاکم نیشاپوری کا سفرِ عراق و حجاز، 341ھ/952ء"
summary:
  ar: "رحل الحاكم إلى العراق سنة إحدى وأربعين بعد موت شيخه إسماعيل الصفار بأشهر، وحج ورحل إلى بلاد خراسان وما وراء النهر؛ فسمع بنيسابور وحدها من نحو ألف شيخ وسمع بالعراق وغيرها من البلدان من نحو ألف شيخ {cite:tarikh-islam-dhahabi pp. 122-123}."
  en: "In 341/952-3 al-Hakim travelled to Iraq a few months after the death of his shaykh Isma'il al-Saffar; he performed the hajj and journeyed through the lands of Khurasan and beyond the Oxus. His shaykhs numbered about a thousand in Nishapur alone and about a thousand more in Iraq and the other lands {cite:tarikh-islam-dhahabi pp. 122-123}."
  ur: "341ھ/952ء میں حاکم اپنے شیخ اسماعیل صفار کی وفات کے چند ماہ بعد عراق روانہ ہوئے؛ انہوں نے حج کیا اور خراسان اور ماوراء النہر کے ممالک کا سفر کیا۔ ان کے مشائخ صرف نیشاپور میں تقریباً ایک ہزار اور عراق اور دیگر ممالک میں بھی تقریباً ایک ہزار تھے {cite:tarikh-islam-dhahabi pp. 122-123}۔"
