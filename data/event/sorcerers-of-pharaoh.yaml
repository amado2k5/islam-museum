id: event/sorcerers-of-pharaoh
class: event
kind: other
label:
  ar: "سحرة فرعون بين يدي موسى"
  en: "Pharaoh's sorcerers before Moses"
  ur: "فرعون کے جادوگر موسیٰ کے سامنے"
summary:
  ar: "جمع فرعون سحرةه ليجتمعوا في ميعاد ضيق فطرحوا الحبال والعصي، فرأوا منها ما أوهمهم، وألقى موسى عصاه فالتهمت ما ألقوه، فعرف السحرة أنهم عمل ملك لا عمل بشر، فسجدوا وقالوا آمنا برب هارون وموسى {cite:tanzil-quran}. ويعدهم القرآن من أوائل من آمن من قوم فرعون [[passage/quran-7-120|الأعراف 120]]."
  en: "Pharaoh gathered his sorcerers for an appointed tryst; they threw their cords and staffs and what they saw seemed to move, but when Moses cast his staff it swallowed what they had thrown. The sorcerers knew it was the work of a king, not of mortals, and prostrated saying they believed in the Lord of Moses and Aaron {cite:tanzil-quran}. The Qur'an counts them among the first of Pharaoh's people to believe [[passage/quran-7-120|al-A'raf 120]]."
  ur: "فرعون نے اپنے جادوگروں کو ایک مقررہ دن جمع کیا؛ انہوں نے رسیوں اور چھڑیوں کے جادو دکھائے اور لوگوں کو وہ نظر آیا جو جادو اپنا آپ حرکت کر رہا تھا، لیکن جب موسیٰ نے اپنی چھڑی ڈالی تو اس نے ان کے پھینکے ہوئے تمام جادو کو نگل لی۔ جادوگر جان گئے کہ یہ انسانوں کا نہیں بلکہ بادشاہ کا کام تھا، اس لیے وہ سجدے میں گر گئے اور کہا ہم موسیٰ اور ہارون کے رب پر ایمان لائے {cite:tanzil-quran}۔ قرآن انہیں فرعون کی قوم میں پہلا ایمان لانے والوں میں شمار کرتا ہے [[passage/quran-7-120|الاعراف 120]]۔"
