summary:
  ar: "في رمضان سنة سبعين حولت التتار من تبقى من أهل حران إلى المشرق وخربت ودثرت بالكلية — وكان قد أخليت سنة سبع وستين ووصل منها خطيبها ابن تيمية وغيره {cite:shadharat-dhahab p. 577, 564}."
  en: "Ramadan 670 — the Tatars moved Harran's remaining people east and the city was ruined utterly; it had been emptied three years earlier when its khatib Ibn Taymiyya and others came down to Damascus {cite:shadharat-dhahab p. 577, 564}."
  es: "Ramadán 670: los tártaros trasladaron a los habitantes restantes de Harran hacia el este y la ciudad quedó completamente destruida; había sido vaciada tres años antes cuando su khatib Ibn Taymiyya y otros llegaron a Damasco {cita: shadharat-dhahab pág. 577, 564}."
  fr: "Ramadan 670 — les Tatars ont déplacé les habitants restants de Harran vers l'est et la ville a été entièrement ruinée; elle avait été vidée trois ans plus tôt lorsque son khatib Ibn Taymiyya et d'autres sont descendus à Damas {cite:shadharat-dhahab p. 577, 564}."
  ur: "رمضان 670 - تاتاریوں نے حران کے باقی ماندہ لوگوں کو مشرق کی طرف منتقل کر دیا اور شہر مکمل طور پر تباہ ہو گیا۔ اسے تین سال پہلے اس وقت خالی کر دیا گیا تھا جب اس کے خطیب ابن تیمیہ اور دوسرے دمشق آئے تھے۔ 577، 564}۔"
