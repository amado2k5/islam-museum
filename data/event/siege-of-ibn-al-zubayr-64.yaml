id: event/siege-of-ibn-al-zubayr-64
class: event
kind: siege
label: { ar: "حصار ابن الزبير بمكة", en: "Siege of Ibn al-Zubayr in Mecca", es: "El asedio de Ibn al-Zubayr en La Meca", fr: "Siège d'Ibn al-Zubayr à La Mecque", ur: "مکہ میں ابن الزبیر کا محاصرہ" }
summary:
  ar: "سار جيش الحرة إلى مكة لقتال ابن الزبير فمات أمير الجيش بالطريق فاستخلف عليهم أميراً، وأتوا مكة فحاصروا ابن الزبير وقاتلوه ورموه بالمنجنيق في صفر سنة أربع وستين، فاحترقت من شرارة نيرانهم أستار الكعبة وسقفها وقرنا الكبش الذي فدي به إسماعيل وكانا في السقف، وأهلك الله يزيد في نصف ربيع الأول من هذا العام فجاء الخبر بوفاته والقتال مستمر، فنادى ابن الزبير يا أهل الشام إن طاغيتكم قد هلك فانفلوا وذلوا وتخطفهم الناس، ودعا ابن الزبير إلى بيعة نفسه وتسمى بالخلافة وأهل الشام بايعوا معاوية بن يزيد {cite:tarikh-khulafa-minhaj-1434 p. 345}."
  en: "The Harra army marched on Mecca to fight Ibn al-Zubayr — its commander dying on the road — and besieged him, fighting and casting mangonels in Safar 64; sparks from their fires burned the Ka'ba's curtains and roof and the horns of the ram ransomed for Ishmael which had been kept in the ceiling. Yazid perished in mid-Rabi' I of that year and the news came while the fighting ran on — 'people of Syria, your tyrant has perished', called Ibn al-Zubayr, and they broke away humbled and were plucked off one by one. Ibn al-Zubayr then summoned to his own bay'a and was titled caliph, while the Syrians pledged Mu'awiya ibn Yazid {cite:tarikh-khulafa-minhaj-1434 p. 345}."
  es: "El ejército de Harra marchó sobre La Meca para luchar contra Ibn al-Zubayr —cuyo comandante murió en el camino— y lo sitió, combatiendo y lanzando mangoneles en Safar 64; las chispas de sus incendios quemaron las cortinas y el techo de la Kaaba y los cuernos del carnero rescatado por Ismael que se guardaban en el techo. Yazid pereció a mediados de Rabi' I de ese año y la noticia llegó mientras continuaban los combates: «¡Pueblo de Siria, vuestro tirano ha perecido!», exclamó Ibn al-Zubayr, y se retiraron humillados y fueron descolgados uno a uno. Ibn al-Zubayr fue entonces llamado a su propia bay'a y fue nombrado califa, mientras que los sirios juraron lealtad a Mu'awiya ibn Yazid {cite:tarikh-khulafa-minhaj-1434 p. 345}."
  fr: "L'armée de Harra marcha sur La Mecque pour combattre Ibn al-Zubayr – son commandant mourant en chemin – et l'assiégea, combattant et lançant des mangonneaux en Safar 64; les étincelles de leurs incendies provoquèrent le feu sur les tentures et le toit de la Kaaba, ainsi que sur les cornes du bélier donné en rançon pour Ismaël, qui étaient conservées au plafond. Yazid périt à la mi-Rabi' I de cette année-là et la nouvelle parvint alors que les combats se poursuivaient: « Peuple de Syrie, votre tyran est mort ! », s'écria Ibn al-Zubayr. Humiliés, les Syriens se débandèrent et furent emmenés un à un. Ibn al-Zubayr prêta alors allégeance et fut proclamé calife, tandis que les Syriens s'en prirent à Mu'awiya ibn Yazid."
  ur: "حرہ کی فوج نے ابن الزبیر سے لڑنے کے لیے مکہ کی طرف کوچ کیا - اس کا کمانڈر سڑک پر مر رہا تھا - اور اس کا محاصرہ کیا، صفر 64 میں جنگ اور مینگونیل ڈالے؛ ان کی آگ سے نکلنے والی چنگاریوں نے کعبہ کے پردوں اور چھت کو جلا دیا اور مینڈھے کے سینگ اسماعیل کے لیے فدیہ میں لیے گئے جو چھت میں رکھے ہوئے تھے۔ اسی سال ربیع الاول کے وسط میں یزید ہلاک ہو گیا اور یہ خبر آئی کہ لڑائی جاری تھی - 'اہل شام، تمہارا ظالم ہلاک ہو گیا'، جسے ابن الزبیر کہتے ہیں، اور وہ عاجزی کے ساتھ ٹوٹ گئے اور ایک ایک کر کے اکھاڑ پھینکے گئے۔ اس کے بعد ابن الزبیر نے اپنی بیع میں بلایا اور اسے خلیفہ کا لقب دیا، جب کہ شامیوں نے معاویہ بن یزید سے بیعت کی۔ 345}۔"
