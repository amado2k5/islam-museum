label: { ar: "حصار ابن الزبير بمكة", en: "Siege of Ibn al-Zubayr in Mecca" }
summary:
  ar: "سار جيش الحرة إلى مكة لقتال ابن الزبير فمات أمير الجيش بالطريق فاستخلف عليهم أميراً، وأتوا مكة فحاصروا ابن الزبير وقاتلوه ورموه بالمنجنيق في صفر سنة أربع وستين، فاحترقت من شرارة نيرانهم أستار الكعبة وسقفها وقرنا الكبش الذي فدي به إسماعيل وكانا في السقف، وأهلك الله يزيد في نصف ربيع الأول من هذا العام فجاء الخبر بوفاته والقتال مستمر، فنادى ابن الزبير يا أهل الشام إن طاغيتكم قد هلك فانفلوا وذلوا وتخطفهم الناس، ودعا ابن الزبير إلى بيعة نفسه وتسمى بالخلافة وأهل الشام بايعوا معاوية بن يزيد {cite:tarikh-khulafa-minhaj-1434 p. 345}."
  en: "The Harra army marched on Mecca to fight Ibn al-Zubayr — its commander dying on the road — and besieged him, fighting and casting mangonels in Safar 64; sparks from their fires burned the Ka'ba's curtains and roof and the horns of the ram ransomed for Ishmael which had been kept in the ceiling. Yazid perished in mid-Rabi' I of that year and the news came while the fighting ran on — 'people of Syria, your tyrant has perished', called Ibn al-Zubayr, and they broke away humbled and were plucked off one by one. Ibn al-Zubayr then summoned to his own bay'a and was titled caliph, while the Syrians pledged Mu'awiya ibn Yazid {cite:tarikh-khulafa-minhaj-1434 p. 345}."
