label:
  ar: "السماع من الحاكم النيسابوري، قبل ٤٠٥هـ"
  en: "Hearing hadith from al-Hakim al-Nisaburi, before 405/1014"
  ur: "حاکم نیشاپوری سے سماعِ حدیث، 405ھ/1014ء سے قبل"
summary:
  ar: "روى البيهقي عن الحاكم أبي عبد الله محمد بن عبد الله النيسابوري صاحب «المستدرك» الذي استعمله في تصانيفه، وعن غيره من شيوخ نيسابور حتى بلغوا نحو مائة شيخ؛ وسماعه من الحاكم قبل وفاته سنة ٤٠٥هـ {cite:encyclopaedia-of-islam-2 vol. 1 p. 1190}."
  en: "Al-Bayhaqi transmitted from al-Hakim Abu Abd Allah Muhammad ibn Abd Allah al-Nisaburi, author of the Mustadrak, whose work he used extensively in his own compilations, and from other Nishapuri shaykhs — about a hundred in all; his hearing from al-Hakim predates the master's death in 405/1014 {cite:encyclopaedia-of-islam-2 vol. 1 p. 1190}."
  ur: "بيهقی نے حاکم ابو عبد اللہ محمد بن عبد اللہ نیشاپوری، صاحبِ مستدرک، سے روایت کیا جس کی کتاب کو اپنی تصانیف میں بہت استعمال کیا، اور نیشاپور کے دیگر شیوخ سے بھی — مجموعی طور پر تقریباً سو شیخ؛ حاکم سے سماع ان کی 405ھ/1014ء میں وفات سے پہلے ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 1190}۔"
