summary:
  ar: "بطاقة أولية لمعركة نهر ماريجا سنة ١٣٧١م، انتصار العثمانيين على الصرب الذي فتح البلقان لتوسعهم؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of the Maritsa river in 1371, the Ottoman victory over the Serbs that opened the Balkans to their expansion; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Batalla del río Maritsa en 1371, la victoria otomana sobre los serbios que abrió los Balcanes a su expansión; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour la bataille de la rivière Maritsa en 1371, la victoire ottomane sur les Serbes qui ouvrit les Balkans à leur expansion; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1371 میں ماریسا ندی کی لڑائی کے لیے ڈرافٹ کارڈ، سربوں پر عثمانی فتح جس نے بلقان کو اپنی توسیع کے لیے کھول دیا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1371 yılında gerçekleşen Marija Nehri Muharebesi'nin ön anlatımı; Osmanlıların Sırplara karşı kazandığı ve Balkanlar'ın Osmanlılar tarafından genişletilmesinin önünü açan zafer; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Sungai Marija pada tahun 1371 M, kemenangan Ottoman atas Serbia yang membuka Balkan untuk ekspansi mereka; sumber-sumbernya belum ditinjau di halaman ini."
