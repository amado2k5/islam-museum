label: { ar: "فتح رودس العثماني", en: "The Ottoman Conquest of Rhodes", es: "La conquista otomana de Rodas", fr: "La conquête ottomane de Rhodes", ur: "روڈس کی عثمانی فتح", tr: "Osmanlıların Rodos'u fethi", id: "Penaklukan Rhodes oleh Ottoman" }
summary:
  ar: "شنّ السلطان سليمان القانوني حرباً كبيرة ضد رودس ابتداءً من منتصف عام ١٥٢٢م وفتحها، وأعطى للفرسان حق الانتقال منها فذهبوا إلى مالطة، وهناك أعطاهم شارل كان حق حكم تلك الجزيرة {cite:dawlat-uthmaniyya-salabi p. 201}."
  en: "Sulayman's great war on Rhodes from mid-1522 ended with the island's fall; the Knights of St John were granted the right to depart and were resettled by Charles V on Malta {cite:dawlat-uthmaniyya-salabi p. 201}."
  es: "La gran guerra de Sulayman contra Rodas, desde mediados de 1522, terminó con la caída de la isla; a los Caballeros de San Juan se les concedió el derecho a partir y Carlos V los reasentó en Malta {cite:dawlat-uthmaniyya-salabi p. 201}."
  fr: "La grande guerre de Sulayman sur Rhodes à partir du milieu de l'année 1522 s'est terminée par la chute de l'île; les chevaliers de Saint-Jean ont reçu le droit de partir et ont été réinstallés par Charles V à Malte {cite:dawlat-uthmaniyya-salabi p. 201}."
  ur: "1522 کے وسط سے رہوڈز پر سلیمان کی عظیم جنگ جزیرے کے زوال کے ساتھ ختم ہوئی۔ سینٹ جان کے شورویروں کو روانگی کا حق دیا گیا تھا اور مالٹا پر چارلس پنجم نے انہیں دوبارہ آباد کیا تھا۔ 201}۔"
  tr: "Kanuni Sultan Süleyman, 1522 yılının ortalarında Rodos'a karşı büyük bir savaş başlattı ve adayı fethetti. Şövalyelere adadan ayrılma hakkı verdi, böylece Malta'ya gittiler ve orada Charles Cane onlara adayı yönetme hakkını verdi. {cite:dawlat-uthmaniyya-salabi s. 201}"
  id: "Sultan Suleiman Agung melancarkan perang besar melawan Rhodes mulai pertengahan tahun 1522 M dan menaklukkannya. Ia memberi para ksatria hak untuk pindah dari sana, sehingga mereka pergi ke Malta, dan di sana Charles Cane memberi mereka hak untuk memerintah pulau itu {cite:dawlat-uthmaniyya-salabi p. 201}."
