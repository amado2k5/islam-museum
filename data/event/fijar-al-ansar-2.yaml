label: { ar: "الفجار الثاني للأنصار — قتل عمرو بن النعمان رهن قريظة والنضير", en: "the second Fijār — ʿAmr ibn al-Nuʿmān slaughters the Qurayẓa–Naḍīr hostages", es: "El segundo Fijār: ʿAmr ibn al-Nuʿmān masacra a los rehenes de Qurayẓa-Naḍīr.", fr: "Le deuxième Fijār — ʿAmr ibn al-Nuʿmān massacre les otages Qurayẓa–Naḍīr", ur: "دوسرا فجر - عمرو بن النعمان نے قریظہ نعیر کے یرغمالیوں کو ذبح کیا", tr: "Ensar'ın ikinci kötülüğü ise Kurayza ve Nadir'in rehinesi Amr ibn al-Nu'man'ın öldürülmesidir.", id: "Kejahatan kedua kaum Ansar — pembunuhan Amr ibn al-Nu'man, sandera Qurayza dan Nadir" }
