label: { ar: "الفجار الثاني للأنصار — قتل عمرو بن النعمان رهن قريظة والنضير", en: "the second Fijār — ʿAmr ibn al-Nuʿmān slaughters the Qurayẓa–Naḍīr hostages" }
date:
  start: { edtf: "0615~", calendar: julian, precision: century, status: tradition, derived: true, note: "جاهلي؛ التاريخ تقريبي عند أهل الأيام {cite:kamil-ibn-al-athir p. 509}." }
summary:
  ar: "روي أن سبب الفجار الثاني أن عمرو بن النعمان البياضي الخزرجي حلف أن لا يمس رأسه ماء حتى ينزل قومه بني بياضة منازل قريظة والنضير — وكانت خير البقاع — أو يقتل رهنهم، فأرسل إليهم التخيير فأشار عليهم كعب بن أسد القرظي أن امنعوا دياركم فإنما هي ليلة يصيب أحدكم امرأة فيولد له مثل أحدهم، فعدا على الرهن فقتلهم، وخالفه عبد الله بن أبي بن سلول وقال له هذا بغي وإثم وكأني بك وقد حملت قتيلًا في عباءة يحملك أربعة رجال، فلم يقتل هو ومن أطاعه أحدًا وأطلقوهم ومنهم سليم بن أسد جد محمد بن كعب، وحالفت قريظة والنضير الأوس على الخزرج فكان يوم الفجار الثاني، وهذا القول أشبه بأن يسمى فجارًا عند ابن الأثير {cite:kamil-ibn-al-athir p. 509}."
  en: "In the second account — the one Ibn al-Athīr finds worthier of the name — ʿAmr ibn al-Nuʿmān of Banū Bayāḍa swore not to touch water to his head until his people had the lands of Qurayẓa and al-Naḍīr, or their hostages dead. Kaʿb ibn Asad al-Quraẓī counseled defiance («in one night each of you begets their like»); the hostages were slaughtered. ʿAbdallāh ibn Ubayy broke with him — «this is wrongdoing; I can see you borne a corpse in a cloak by four men» — and his party freed their captives, Sulaym ibn Asad, grandfather of Muḥammad ibn Kaʿb, among them. Qurayẓa and al-Naḍīr now allied with the Aws {cite:kamil-ibn-al-athir p. 509}."
