summary:
  ar: "روي أن سبب الفجار الثاني أن عمرو بن النعمان البياضي الخزرجي حلف أن لا يمس رأسه ماء حتى ينزل قومه بني بياضة منازل قريظة والنضير — وكانت خير البقاع — أو يقتل رهنهم، فأرسل إليهم التخيير فأشار عليهم كعب بن أسد القرظي أن امنعوا دياركم فإنما هي ليلة يصيب أحدكم امرأة فيولد له مثل أحدهم، فعدا على الرهن فقتلهم، وخالفه عبد الله بن أبي بن سلول وقال له هذا بغي وإثم وكأني بك وقد حملت قتيلًا في عباءة يحملك أربعة رجال، فلم يقتل هو ومن أطاعه أحدًا وأطلقوهم ومنهم سليم بن أسد جد محمد بن كعب، وحالفت قريظة والنضير الأوس على الخزرج فكان يوم الفجار الثاني، وهذا القول أشبه بأن يسمى فجارًا عند ابن الأثير {cite:kamil-ibn-al-athir p. 509}."
  en: "In the second account — the one Ibn al-Athīr finds worthier of the name — ʿAmr ibn al-Nuʿmān of Banū Bayāḍa swore not to touch water to his head until his people had the lands of Qurayẓa and al-Naḍīr, or their hostages dead. Kaʿb ibn Asad al-Quraẓī counseled defiance («in one night each of you begets their like»); the hostages were slaughtered. ʿAbdallāh ibn Ubayy broke with him — «this is wrongdoing; I can see you borne a corpse in a cloak by four men» — and his party freed their captives, Sulaym ibn Asad, grandfather of Muḥammad ibn Kaʿb, among them. Qurayẓa and al-Naḍīr now allied with the Aws {cite:kamil-ibn-al-athir p. 509}."
  es: "En el segundo relato —el que Ibn al-Athīr considera más digno de tal nombre— ʿAmr ibn al-Nuʿmān de Banū Bayāḍa juró no tocarse la cabeza con agua hasta que su pueblo tuviera las tierras de Qurayẓa y al-Naḍīr, o hasta que sus rehenes murieran. Kaʿb ibn Asad al-Quraẓī aconsejó la rebeldía («en una noche cada uno de vosotros engendrará a su semejante»); los rehenes fueron masacrados. ʿAbdallāh ibn Ubayy rompió con él —«esto es una injusticia; te veo llevando un cadáver envuelto en un manto por cuatro hombres»— y su grupo liberó a sus cautivos, entre ellos Sulaym ibn Asad, abuelo de Muḥammad ibn Kaʿb. Qurayẓa y al-Naḍīr ahora aliados con los Aws {cite:kamil-ibn-al-athir p. 509}."
  fr: "Dans le second récit — celui qu'Ibn al-Athīr juge le plus digne de ce nom —, ʿAmr ibn al-Nuʿmān, des Banū Bayāḍa, jura de ne pas se mouiller la tête tant que son peuple n'aurait pas conquis les terres de Qurayẓa et d'al-Naḍīr, ou que leurs otages ne seraient pas morts. Kaʿb ibn Asad al-Quraẓī conseilla la rébellion (« en une nuit, chacun de vous engendrera son semblable »); les otages furent massacrés. ʿAbdallāh ibn Ubayy rompit avec lui — « c'est un acte inadmissible; je te vois porter un cadavre enveloppé dans un manteau par quatre hommes » — et son groupe libéra ses captifs, parmi lesquels Sulaym ibn Asad, grand-père de Muḥammad ibn Kaʿb. Qurayẓa et al-Naḍīr sont désormais alliés aux Aws {cite:kamil-ibn-al-athir p. 509}."
  ur: "دوسری روایت میں - جسے ابن اثیر نام کے لائق سمجھتے ہیں - بنو بیاضہ کے عمرو بن النعمان نے قسم کھائی کہ جب تک اس کی قوم قریظہ اور النضیر کی زمینیں یا ان کے یرغمالیوں کو ہلاک نہ کر دیں، اس وقت تک اپنے سر پر پانی نہ لگائیں گے۔ کعب بن اسد القرآنی نے سرکشی کی نصیحت کی ⁦(\"ایک رات میں تم میں سے ہر ایک اپنے جیسا جنم لے گا\")⁩؛ یرغمالیوں کو ذبح کر دیا گیا. عبداللہ بن ابی نے اس سے علیحدگی اختیار کی - \"یہ غلط کام ہے۔ میں دیکھ سکتا ہوں کہ آپ کو چار آدمیوں نے ایک چادر میں ایک لاش اٹھائی ہے\" - اور اس کی جماعت نے ان کے اسیروں کو آزاد کیا، سلیم بن اسد، ان میں سے محمد بن کعب کے دادا تھے۔ قریظہ اور النعیر اب اوس کے ساتھ مل گئے {حوالہ: کامل ابن الاثیر ص۔ 509}۔"
  tr: "Rivayet edildiğine göre, ikinci Ficer'in sebebi, Amr ibn al-Nu'man al-Bayadi al-Khazraji'nin, halkı Beni Bayada, Kurayza ve Nadir'in evlerine yerleşene kadar veya rehinelerini öldürene kadar başını suya değdirmeyeceğine yemin etmesiydi. Bunun üzerine onlara seçim hakkı verdi ve Ka'b ibn Asad al-Kurazi, evlerini savunmalarını tavsiye etti; çünkü içlerinden birinin bir gecede evlenip onlardan biri gibi bir çocuk doğuracağı henüz belli değildi. Bunun üzerine rehinelere saldırdı ve onları öldürdü. Abdullah ibn Ubayy ibn Salul ise ona karşı çıktı ve şöyle dedi: \"Bu bir zulüm ve günahtır, neredeyse seni dört adamın taşıdığı bir pelerin içinde ölü bir adamı taşırken görüyorum.\" Bunun üzerine o ve ona itaat edenler kimseyi öldürmediler ve aralarında Muhammed ibn Ka'b'ın dedesi Salim ibn Asad'ın da bulunduğu rehineleri serbest bıraktılar. Kurayza ve Nadir, Hazrec'e karşı Evs ile ittifak kurdular ve bu, ikinci Fijar dönemiydi. Bu anlatımın İbn el-Athir tarafından Fijar olarak adlandırılması daha olasıdır {cite:kamil-ibn-al-athir s. 509}."
  id: "Diriwayatkan bahwa alasan Fijar kedua adalah karena Amr ibn al-Nu'man al-Bayadi al-Khazraji bersumpah bahwa dia tidak akan menyentuh kepalanya dengan air sampai kaumnya, Banu Bayada, menetap di rumah-rumah Qurayza dan Nadir—yang merupakan tempat terbaik—atau dia membunuh sandera mereka. Maka dia mengirimkan pilihan kepada mereka, dan Ka'b ibn Asad al-Qurazi menasihati mereka untuk mempertahankan rumah mereka, karena hanya dalam satu malam salah seorang dari mereka akan memiliki istri dan melahirkan anak seperti salah seorang dari mereka. Maka dia menyerang sandera dan membunuh mereka, dan Abdullah ibn Ubayy ibn Salul tidak setuju dengannya dan berkata kepadanya, “Ini adalah pelanggaran dan dosa, dan aku hampir dapat melihatmu membawa orang mati dalam jubah, yang dibawa oleh empat orang.” Maka dia dan orang-orang yang menaatinya tidak membunuh siapa pun dan mereka membebaskan mereka, termasuk Salim ibn Asad, kakek dari Muhammad ibn Ka'b. Qurayza dan Nadir bersekutu dengan Aws melawan Khazraj, dan itu adalah hari Fijar kedua. Kisah ini lebih mungkin disebut Fijar oleh Ibn al-Athir {cite:kamil-ibn-al-athir p. 509}."
