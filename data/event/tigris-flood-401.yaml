id: event/tigris-flood-401
class: event
kind: other
label: { ar: "غرق بغداد وفيضان دجلة إحدى وعشرين ذراعاً", en: "The Flooding of Baghdad as the Tigris Rises Twenty-One Cubits", es: "Las inundaciones de Bagdad al crecer el Tigris veintiún codos", fr: "Inondations à Bagdad suite à la crue du Tigre de vingt et une coudées", ur: "دجلہ اکیس ہاتھ بڑھتے ہی بغداد کا سیلاب" }
summary:
  ar: "في رجب سنة إحدى وأربعمائة زادت دجلة وامتدت الزيادة إلى رمضان فبلغت إحدى وعشرين ذراعاً، ودخل الماء أكثر الدور الشاطئة وقطيعة الدقيق وباب التبن وباب الشعير وباب الطاق، وفاض على مسجد الكف بقطيعة الدقيق فخربه واحتمل أفرعته وسقوفه وتفجرت البثوق وغرقت القرى والحصون {cite:muntazam-ibn-al-jawzi j.7 p.251-252}."
  en: "In Rajab 401 the Tigris rose, and the rise continued until Ramadan, reaching twenty-one cubits. Water entered most of the riverside houses and reached Qati'at al-Daqiq, Bab al-Tibn, Bab al-Sha'ir and Bab al-Taq; at Qati'at al-Daqiq it overflowed onto the Mosque of al-Kaff, wrecking it and carrying away its upper parts and roofs. Breaches burst open in the banks, and villages and fortresses were drowned. {cite:muntazam-ibn-al-jawzi j.7 p.251-252}"
  es: "En Rajab 401, el Tigris creció y su nivel continuó hasta Ramadán, alcanzando los veintiún codos. El agua entró en la mayoría de las casas ribereñas y llegó a Qati'at al-Daqiq, Bab al-Tibn, Bab al-Sha'ir y Bab al-Taq; en Qati'at al-Daqiq, se desbordó sobre la Mezquita de al-Kaff, destruyéndola y llevándose consigo sus partes superiores y techos. Se abrieron brechas en las orillas y pueblos y fortalezas quedaron sumergidos. {cite:muntazam-ibn-al-jawzi j.7 p.251-252}"
  fr: "En Rajab 401, le Tigre monta et la crue se poursuivit jusqu'au Ramadan, atteignant vingt et une coudées. L'eau envahit la plupart des maisons riveraines et atteignit Qati'at al-Daqiq, Bab al-Tibn, Bab al-Sha'ir et Bab al-Taq; à Qati'at al-Daqiq, elle déborda sur la mosquée al-Kaff, la détruisant et emportant ses parties supérieures et ses toits. Des brèches s'ouvrirent dans les berges et des villages et des forteresses furent inondés. {cite:muntazam-ibn-al-jawzi j.7 p.251-252}"
  ur: "رجب 401 میں دجلہ طلوع ہوا، اور عروج رمضان تک جاری رہا، اکیس ہاتھ تک پہنچ گیا۔ پانی دریا کے کنارے کے بیشتر گھروں میں داخل ہوا اور قطیۃ الدقیق، باب الطبن، باب الشعر اور باب الطاق تک پہنچ گیا۔ قطیۃ الدقیق کے مقام پر یہ مسجد الکاف پر بہہ گیا اور اسے تباہ کر کے اس کے بالائی حصوں اور چھتوں کو لے گیا۔ کناروں میں شگافیں کھل گئیں، اور گاؤں اور قلعے ڈوب گئے۔ {حوالہ:منتظم ابن الجوزی ج7 ص251-252}"
