label:
  ar: "قصيدة الهادي في حربه الأولى مع الكليبيين والأكيليين، 287هـ"
  en: "Al-Hadi's verse on his first war with the Kulaybis and Akilis, 287 AH"
  ur: "کلیبیوں اور اکیلیوں کے ساتھ ہادی کی پہلی جنگ پر ان کے اشعار، 287ھ"
summary:
  ar: "يختم الراوي خبر حرب الهادي الأولى للكليبيين والأكيليين في علاف وصعدة بقصيدة منسوبة إليه يصف فيها راحة ما بعد الحرب وما تركه خصومه من ديار وزروع وسلاح ومتاع، ويفتخر بجنده ويتوعد من بقي منهم، والمتحف يلخص المعنى ولا ينقل الأبيات."
  en: "The narrator closes the account of al-Hadi's first war with the Kulaybis and Akilis at Allaf and Sa'da with a poem he ascribes to the imam, describing the ease after war and what his opponents left behind of houses, crops, arms and goods, boasting of his troops and warning those left; the museum summarises the sense and does not quote the lines."
  ur: "راوی علاف اور صعدہ میں کلیبیوں اور اکیلیوں سے ہادی کی پہلی جنگ کے بیان کو امام سے منسوب ایک قصیدے پر ختم کرتا ہے جس میں جنگ کے بعد کی راحت، مخالفین کے چھوڑے ہوئے گھروں، کھیتوں، اسلحے اور سامان کا ذکر ہے، اپنے لشکر پر فخر اور باقی رہ جانے والوں کو تنبیہ ہے؛ عجائب گھر مفہوم کا خلاصہ دیتا ہے اور اشعار نقل نہیں کرتا۔"
