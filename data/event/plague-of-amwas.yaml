label: { ar: "طاعون عمواس", en: "The Plague of Amwas" }
summary:
  ar: "عند البلاذري: كان طاعون عمواس سنة 18 فتوفي فيه خلق من المسلمين منهم أبو عبيدة بن الجراح مات وله 58 سنة وهو أمير، ومعاذ بن جبل أحد بني سلمة من الخزرج يكنى أبا عبد الرحمن توفي بناحية الأقحوانة من الأردن وله 38 سنة؛ وكان أبو عبيدة لما احتضر استخلفه (وقيل استخلف إياد بن غنم الفهري، ويقال بل استخلف عمرو بن العاص فاستخلف عمرو ابنه)؛ وذكر عبد الله بن قيس قال كنت فيمن يلقى عمر مع أبي عبيدة مقدمه الشام فبينما عمر يسير إذ لقيه المقّلِسون من أهل أذرعات بالسيوف والريحان فقال عمر امه امنعوهم فقال أبو عبيدة يا أمير المؤمنين هذه سنتهم وإنك إن منعتهم منها رأوا أن في نفسك نقضاً لعهدهم فقال دعوهم."
  en: "In al-Baladhuri: the plague of Amwas came in year 18 and carried off a multitude of the Muslims, among them Abu Ubayda ibn al-Jarrah — dying commander at fifty-eight — and Mu'adh ibn Jabal of Banu Salama of the Khazraj, kunya Abu Abd al-Rahman, dying at al-Aqhwana of al-Urdunn at thirty-eight; on his deathbed Abu Ubayda had named his successor — some say Iyad ibn Ghanm al-Fihri, others that he named Amr ibn al-As who named his own son; Abdullah ibn Qays reports being among those welcoming Umar with Abu Ubayda on his coming to Syria, when the muqallisin of Adhri'at met him with swords and basil — Umar saying 'keep them off' and Abu Ubayda answering 'commander of the faithful, this is their custom, and if you bar them from it they will think you intend to break their covenant', so he said 'let them be'."
