label: { ar: "طاعون عمواس", en: "The Plague of Amwas", es: "La plaga de Amwas", fr: "La peste d'Amwas", ur: "امواس کا طاعون", tr: "Emmaus Vebası", id: "Wabah di Emmaus" }
summary:
  ar: "عند البلاذري: كان طاعون عمواس سنة 18 فتوفي فيه خلق من المسلمين منهم أبو عبيدة بن الجراح مات وله 58 سنة وهو أمير، ومعاذ بن جبل أحد بني سلمة من الخزرج يكنى أبا عبد الرحمن توفي بناحية الأقحوانة من الأردن وله 38 سنة؛ وكان أبو عبيدة لما احتضر استخلفه ⁦(وقيل استخلف إياد بن غنم الفهري، ويقال بل استخلف عمرو بن العاص فاستخلف عمرو ابنه)⁩؛ وذكر عبد الله بن قيس قال كنت فيمن يلقى عمر مع أبي عبيدة مقدمه الشام فبينما عمر يسير إذ لقيه المقّلِسون من أهل أذرعات بالسيوف والريحان فقال عمر امه امنعوهم فقال أبو عبيدة يا أمير المؤمنين هذه سنتهم وإنك إن منعتهم منها رأوا أن في نفسك نقضاً لعهدهم فقال دعوهم."
  en: "In al-Baladhuri: the plague of Amwas came in year 18 and carried off a multitude of the Muslims, among them Abu Ubayda ibn al-Jarrah — dying commander at fifty-eight — and Mu'adh ibn Jabal of Banu Salama of the Khazraj, kunya Abu Abd al-Rahman, dying at al-Aqhwana of al-Urdunn at thirty-eight; on his deathbed Abu Ubayda had named his successor — some say Iyad ibn Ghanm al-Fihri, others that he named Amr ibn al-As who named his own son; Abdullah ibn Qays reports being among those welcoming Umar with Abu Ubayda on his coming to Syria, when the muqallisin of Adhri'at met him with swords and basil — Umar saying 'keep them off' and Abu Ubayda answering 'commander of the faithful, this is their custom, and if you bar them from it they will think you intend to break their covenant', so he said 'let them be'."
  es: "En al-Baladhuri: la plaga de Amwas llegó en el año 18 y se llevó a multitud de musulmanes, entre ellos Abu Ubayda ibn al-Jarrah —comandante que murió a los cincuenta y ocho años— y Mu'adh ibn Jabal de Banu Salama de Khazraj, kunya Abu Abd al-Rahman, que murió en al-Aqhwana de al-Urdunn a los treinta y ocho años; en su lecho de muerte, Abu Ubayda nombró a su sucesor —algunos dicen que a Iyad ibn Ghanm al-Fihri, otros que nombró a Amr ibn al-As, quien nombró a su propio hijo; Abdullah ibn Qays relata que estuvo entre los que dieron la bienvenida a Umar junto con Abu Ubayda a su llegada a Siria, cuando los muqallisin de Adhri'at lo recibieron con espadas y albahaca. Umar dijo: \"Manténganlos alejados\", y Abu Ubayda respondió: \"Comandante de los creyentes, esta es su costumbre, y si se lo prohíbe, pensarán que pretende romper su pacto\", por lo que dijo: \"Déjenlos en paz\"."
  fr: "Dans al-Baladhuri: la peste d'Amwas survint en l'an 18 et emporta une multitude de musulmans, parmi lesquels Abu Ubayda ibn al-Jarrah — commandant mourant à cinquante-huit ans — et Mu'adh ibn Jabal de Banu Salama des Khazraj, kunya Abu Abd al-Rahman, mourant à al-Aqhwana d'al-Urdunn à trente-huit ans; sur son lit de mort, Abu Ubayda avait nommé son successeur — certains disent Iyad ibn Ghanm al-Fihri, d'autres qu'il avait nommé Amr ibn al-As qui nomma son propre fils; Abdullah ibn Qays rapporte avoir été parmi ceux qui ont accueilli Umar avec Abu Ubayda à son arrivée en Syrie, lorsque les muqallisin d'Adhri'at l'ont rencontré avec des épées et du basilic — Umar disant « éloignez-les » et Abu Ubayda répondant « commandeur des croyants, c'est leur coutume, et si vous les en empêchez, ils penseront que vous avez l'intention de rompre leur alliance », alors il a dit « laissez-les »."
  ur: "البلادوری میں ہے: 18 میں طاعون امواس آیا اور مسلمانوں کے ایک ہجوم کو اپنی لپیٹ میں لے لیا، ان میں ابو عبیدہ بن الجراح - جو کہ 58 سال کی عمر میں مر رہے تھے- اور خزرج کے بنو سلمہ کے معاذ بن جبل، کنیہ ابو عبدالرحمٰن، العقونہ میں انتقال کر گئے۔ اڑتیس؛ بستر مرگ پر ابو عبیدہ نے اپنے جانشین کا نام لیا تھا - بعض کہتے ہیں عیاد بن غنم الفہری، بعض کہتے ہیں کہ انہوں نے عمرو بن العاص کا نام اپنے بیٹے کا رکھا۔ عبداللہ بن قیس بیان کرتے ہیں کہ عمر کے شام آنے پر ابو عبیدہ کے ساتھ ان کا استقبال کرنے والوں میں شامل تھے، جب ادھاریت کے مقلّین نے تلواریں اور تلسی لے کر ان سے ملاقات کی، عمر نے کہا کہ انہیں روک دو، اور ابو عبیدہ نے جواب دیا، 'وفاداروں کے سردار، یہ ان کا دستور ہے، اور اگر تم انہیں اس سے روکو گے تو وہ سمجھیں گے کہ وہ تم سے عہد شکنی کریں گے'۔"
  tr: "El-Baladhuri'ye göre: Amwas vebası 18. yılda meydana geldi ve birçok Müslüman öldü. Bunların arasında, komutan iken 58 yaşında ölen Ebu Ubeyde ibn el-Cerrah ve Hazrec kabilesinden Beni Seleme'den Ebu Abdül-Rahman olarak bilinen Muaz ibn Cebel de vardı. Muaz ibn Cebel, Ürdün'ün el-Akhuvanah bölgesinde 38 yaşında öldü. Ebu Ubeyde ölmek üzereyken, halefi olarak onu tayin etti (ve rivayete göre İyad ibn Ghanm el-Fihri'yi tayin etti, rivayete göre Amr ibn el-As'ı tayin etti ve Amr da oğlunu halefi olarak tayin etti). Abdullah ibn Kays, Ömer'in Suriye'ye vardığında onu Ebu Ubeyde ile karşılayanlar arasında olduğunu belirtti. Ömer yürürken, Adhra'at halkından mukallisunlar onu kılıç ve fesleğenle karşıladı. Ömer annesine, \"Onları durdurun\" dedi. Ebu Ubeyde, “Ey Müminlerin Emiri, bu onların adetidir ve eğer onları bundan alıkoyarsan, onlarla yaptığın ahdi bozduğunu anlayacaklardır” dedi. “Onları bırak” diye buyurdu."
  id: "Menurut Al-Baladhuri: Wabah Amwas terjadi pada tahun 18, dan banyak Muslim meninggal di dalamnya, termasuk Abu Ubaidah ibn al-Jarrah, yang meninggal pada usia 58 tahun saat ia menjabat sebagai komandan, dan Muadh ibn Jabal, salah satu dari Bani Salamah dari Khazraj, yang dikenal sebagai Abu Abd al-Rahman, yang meninggal di wilayah al-Aqhuwanah di Yordania pada usia 38 tahun. Ketika Abu Ubaidah sedang sekarat, ia menunjuknya sebagai penggantinya (dan dikatakan bahwa ia menunjuk Iyad ibn Ghanm al-Fihri, dan dikatakan bahwa ia menunjuk Amr ibn al-As, dan Amr menunjuk putranya sebagai penggantinya). Abdullah ibn Qais menyebutkan bahwa ia termasuk di antara mereka yang bertemu Umar bersama Abu Ubaidah ketika mereka tiba di Suriah. Ketika Umar sedang berjalan, para muqallisun dari kaum Adhra’at menemuinya dengan pedang dan kemangi. Umar berkata kepada ibunya, “Hentikan mereka.” Abu Ubaidah berkata, “Wahai Amirul Mukminin, ini adalah kebiasaan mereka, dan jika engkau menghentikan mereka dari kebiasaan ini, mereka akan melihat bahwa engkau telah melanggar perjanjianmu dengan mereka.” Beliau menjawab, “Biarkan saja mereka.”"
