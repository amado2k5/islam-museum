id: event/conquest-of-caesarea
class: event
kind: conquest
label: { ar: "فتح قيسارية", en: "The Conquest of Caesarea", es: "La conquista de Cesarea", fr: "La conquête de Césarée", ur: "قیصریہ کی فتح" }
summary:
  ar: "عند البلاذري: اختلف في أمر قيسارية فقيل فتحها معاوية وقيل إياد بن غنم بعد وفاة أبي عبيدة وقيل عمرو بن العاص وقيل عبد الله ابنه؛ والذي اجتمع عليه العلماء أن أول من حاصرها عمرو بن العاص نزل عليها في جمادى الأولى سنة 13 فكان يقيم عليها ما أقام فإذا كان للمسلمين جمع في أمر عدوهم سار إليهم فشهد أجنادين وفحل والمرج ودمشق واليرموك ثم رجع إلى فلسطين فحاصرها بعد إيلياء ثم خرج إلى مصر من قيسارية، وولّى يزيد بن أبي سفيان بعد أبي عبيدة فوكّل أخاه معاوية بمحاصرتها وتوجه إلى دمشق مطعوناً فمات بها آخر سنة 18 واستخلف على قيسارية معاوية ففتحها وكتب به يزيد إلى عمر؛ وروى الواقدي أنه لما ولّى عمر معاوية الشام حاصرها حتى فتحها وقد كانت حوصرت نحواً من سبع سنين وكان فتحها في شوال سنة 19 — وقال بعضهم في أول سنة 20 — وأن سبب فتحها أن يهودياً يقال له يوسف أتى المسلمين ليلاً فدلهم على طريق في سرب فيه الماء إلى حقو الرجل على أن أمنوه وأهله فأنفذ معاوية ذلك ودخل المسلمون في الليل وكبروا فأراد الروم الهرب من السرب فوجدوا المسلمين عليه ففتح المسلمون الباب فدخل معاوية، وقيل إنه وجد بها من المرتدة سبعمائة ألف ومن السامرة ثلاثين ألفاً ومن اليهود مائتي ألف وبها ثلاثمائة سوق قائمة وكان يحرسها كل ليلة على سورها مائة ألف؛ وبلغ سبيها أربعة آلاف رأس بعث بهم معاوية إلى عمر فأمر بهم فأنزلوا الجرف وقسمهم على يتامى الأنصار وجعل بعضهم في الكتاب والأعمال للمسلمين، وكان أبو بكر قد أخدم بنات أبي أمامة أسعد بن زرارة خادمين من سبي عين التمر فماتا فأعطاهن عمر مكانهما من سبي قيسارية؛ ووجه معاوية بالفتح مع رجلين من جذام ثم خاف ضعفهما فوجّه رجلاً من خثعم فسبقهما ودخل على عمر فكبر؛ وقيل إن فيها كانت شقراء التي قال فيها حسان بن ثابت «تقول شقراء لو صحوت عن الخمر لأصبحت مثري العدد».؛ وعند ابن الأثير سرى معاوية إليها بأمر عمر فحصرها وكانوا يزاحفونه فيهزمهم ثم زاحفوه آخر ذلك مستميتين فبلغت قتلاهم ثمانين ألفًا وكمّلها في هزيمتهم مائة ألف وفتحها، وقيل سنة تسع عشرة وقيل سنة عشرين {cite:kamil-ibn-al-athir p. 327}."
  en: "In al-Baladhuri: the conquest of Caesarea is disputed — some ascribe it to Mu'awiya, others to Iyad ibn Ghanm after Abu Ubayda's death, others to Amr ibn al-As or his son Abdullah; what the scholars agree is that the first to besiege it was Amr ibn al-As, camping against it in Jumada I year 13 and staying as long as he did, marching off whenever the Muslims massed against an enemy — attending Ajnadayn, Fihl, the Marj, Damascus and the Yarmuk — then returning to Filastin to besiege it after Iliya', before leaving from Caesarea for Egypt; Yazid ibn Abi Sufyan, succeeding Abu Ubayda, charged his brother Mu'awiya with the siege and went plague-stricken to Damascus, dying there at the end of year 18, leaving Mu'awiya over Caesarea, who took it and wrote of it to Yazid who wrote to Umar; al-Waqidi reports that when Umar gave Mu'awiya Syria he besieged it until he took it — it had been besieged near seven years — its conquest falling in Shawwal year 19, some say the opening of year 20; the cause of its fall was a Jew named Yusuf who came to the Muslims by night and guided them to a way through a conduit with water to a man's waist, on condition of safety for himself and his house — Mu'awiya carried it out and the Muslims entered by night and magnified God, the Byzantines fleeing toward the conduit finding the Muslims upon it, and the gate being opened Mu'awiya entered with his men; it is said he found in it seven hundred thousand apostates, thirty thousand Samaritans and two hundred thousand Jews, three hundred functioning markets and a hundred thousand guarding its wall each night; its captives reached four thousand heads whom Mu'awiya sent to Umar, who had them quartered at al-Jurf and divided among the orphans of the Ansar, putting some to the script and the Muslims' labours — Abu Bakr had given the daughters of Abu Umama As'ad ibn Zurara two servants of Ayn al-Tamr's captives who died, and Umar gave them their like of Caesarea's; Mu'awiya sent the victory news with two men of Judham, then fearing their weakness sent a man of Khath'am who outpaced them and came to Umar, who magnified God; in it is said to have been Shaqa'iq, of whom Hassan ibn Thabit says 'Shaqa'iq says: had you woken from the wine you would have risen enriched in number'."
  es: "En al-Baladhuri: la conquista de Cesarea es disputada: algunos la atribuyen a Mu'awiya, otros a Iyad ibn Ghanm después de la muerte de Abu Ubayda, otros a Amr ibn al-As o a su hijo Abdullah; en lo que coinciden los eruditos es en que el primero en asediarla fue Amr ibn al-As, acampando contra ella en Jumada I del año 13 y permaneciendo allí todo el tiempo que estuvo, marchando cada vez que los musulmanes se reunían contra un enemigo, asistiendo a Ajnadayn, Fihl, el Marj, Damasco y el Yarmuk, para luego regresar a Filastin para asediarla después de Iliya', antes de partir de Cesarea hacia Egipto; Yazid ibn Abi Sufyan, sucesor de Abu Ubayda, encargó a su hermano Mu'awiya el asedio y, aquejado de peste, fue a Damasco, donde murió a finales del año 18, dejando a Mu'awiya al mando de Cesarea, quien la conquistó y escribió sobre ella a Yazid, quien a su vez escribió a Umar; al-Waqidi relata que cuando Umar le dio Siria a Mu'awiya, la sitió hasta que la tomó —había estado sitiada durante casi siete años— su conquista tuvo lugar en Shawwal del año 19, algunos dicen que al comienzo del año 20; la causa de su caída fue un judío llamado Yusuf que llegó a los musulmanes de noche y los guió a un camino a través de un conducto con agua hasta la cintura de un hombre, a cambio de seguridad para él y su casa — Mu'awiya lo llevó y los musulmanes entraron de noche y glorificaron a Dios, los bizantinos huyendo hacia el conducto encontraron a los musulmanes en él, y al abrirse la puerta, Mu'awiya entró con sus hombres; Se dice que encontró en ella setecientos mil apóstatas, treinta mil samaritanos y doscientos mil judíos, trescientos mercados en funcionamiento y cien mil que custodiaban su muralla cada noche; sus cautivos llegaron a cuatro mil cabezas que Mu'awiya envió a Umar, quien los hizo alojar en al-Jurf y los dividió entre los huérfanos de los Ansar, poniendo algunos a la escritura y los trabajos de los musulmanes: Abu Bakr había dado a las hijas de Abu Umama As'ad ibn Zurara dos sirvientes de los cautivos de Ayn al-Tamr que murieron, y Umar les dio algo parecido a lo de Cesarea; Mu'awiya envió la noticia de la victoria con dos hombres de Judham, luego temiendo su debilidad envió a un hombre de Khath'am que los superó y llegó a Umar, quien glorificó a Dios; se dice que en ella estaba Shaqa'iq, de quien Hassan ibn Thabit dice: 'Shaqa'iq dice: si hubieras despertado del vino, te habrías levantado enriquecido en número'."
  fr: "Dans al-Baladhuri: la conquête de Césarée est controversée — certains l'attribuent à Mu'awiya, d'autres à Iyad ibn Ghanm après la mort d'Abu Ubayda, d'autres encore à Amr ibn al-As ou à son fils Abdullah; ce que les savants s'accordent à dire, c'est que le premier à l'assiéger fut Amr ibn al-As, campant contre elle en Jumada I an 13 et y restant aussi longtemps, partant chaque fois que les musulmans se massaient contre un ennemi — participant aux sièges d'Ajnadayn, de Fihl, du Marj, de Damas et du Yarmouk — puis retournant à Filastin pour l'assiéger après Iliya', avant de quitter Césarée pour l'Égypte; Yazid ibn Abi Sufyan, succédant à Abu Ubayda, confia le siège de la ville à son frère Mu'awiya et, atteint de la peste, se rendit à Damas où il mourut à la fin de l'an 18. Mu'awiya laissa Césarée en sa possession et en informa Yazid, qui écrivit à Umar. Al-Waqidi rapporte que lorsqu'Umar confia la Syrie à Mu'awiya, celui-ci l'assiégea jusqu'à sa prise – le siège dura près de sept ans – la conquête ayant lieu en Shawwal de l'an 19, certains disent au début de l'an 20. La cause de sa chute fut un Juif nommé Yusuf qui vint trouver les musulmans de nuit et les guida vers un passage par un conduit rempli d'eau jusqu'à la taille d'un homme, à condition qu'il garantisse sa sécurité et celle de sa maison. Mu'awiya réalisa ce souhait et les musulmans entrèrent de nuit, glorifiant Dieu. Les Byzantins, fuyant vers le conduit, trouvèrent les musulmans dessus, et la porte s'ouvrit. Mu'awiya entra alors avec ses hommes. On dit qu'il y trouva sept cent mille apostats, trente mille Samaritains et deux cent mille Juifs, trois cents marchés en activité et cent mille hommes gardant ses remparts chaque nuit; ses captifs atteignirent quatre mille têtes que Mu'awiya envoya à Umar, qui les fit loger à al-Jurf et répartir entre les orphelins des Ansar, en affectant certains à l'écriture et aux travaux des musulmans — Abu Bakr avait donné aux filles d'Abu Umama As'ad ibn Zurara deux serviteurs des captifs d'Ayn al-Tamr qui étaient morts, et Umar leur donna des semblables de ceux de Césarée; Mu'awiya envoya la nouvelle de la victoire avec deux hommes de Judham, puis, craignant leur faiblesse, envoya un homme de Khath'am qui les devança et vint auprès d'Umar, qui glorifia Dieu; Il est dit qu'il s'agissait de Shaqa'iq, dont Hassan ibn Thabit dit: « Shaqa'iq dit: si tu t'étais réveillé du vin, tu te serais levé enrichi en nombre »."
  ur: "البلادوری میں ہے: قیصریہ کی فتح متنازعہ ہے - کچھ اسے معاویہ کی طرف منسوب کرتے ہیں، کچھ نے ابو عبیدہ کی موت کے بعد عیاض بن غنم سے، دوسروں نے عمرو بن العاص یا اس کے بیٹے عبداللہ سے؛ علمائے کرام جس بات پر متفق ہیں وہ یہ ہے کہ سب سے پہلے اس کا محاصرہ کرنے والے عمرو بن العاص تھے، انہوں نے جمادی الثانی 13 میں اس کے خلاف پڑاؤ ڈالا اور جب تک مسلمان کسی دشمن کے خلاف جمع ہوئے تو کوچ کیا، اجنادین، فحل، مرج، دمشق اور یرموک میں شرکت کی، پھر مصر سے قالیسری کے لیے روانہ ہونے سے پہلے فلاسطن واپس چلے گئے۔ ابو عبیدہ کے بعد یزید بن ابی سفیان نے اپنے بھائی معاویہ پر محاصرہ کرنے کا الزام لگایا اور طاعون کی زد میں آکر دمشق چلا گیا، وہاں 18 ہجری کے آخر میں مر گیا، معاویہ کو قیصریہ پر چھوڑ دیا، جس نے اسے لے کر یزید کو لکھا جس نے عمر کو لکھا؛ الواقدی نے بیان کیا ہے کہ جب عمر نے معاویہ کو شام دیا تو اس نے اس کا محاصرہ کیا یہاں تک کہ اس نے اسے لے لیا - اس کا محاصرہ سات سال کے قریب ہو چکا تھا - اس کی فتح شوال سنہ 19 میں ہوئی، بعض کہتے ہیں کہ سال 20 کا آغاز ہوا۔ اس کے زوال کا سبب یوسف نام کا ایک یہودی تھا جو رات کو مسلمانوں کے پاس آیا اور اپنی اور اپنے گھر کی حفاظت کی شرط پر ایک آدمی کی کمر تک پانی والی نالی سے ان کو راستہ دکھایا، معاویہ نے اسے انجام دیا اور مسلمان رات کے وقت داخل ہوئے اور خدا کی بڑائی بیان کی، بازنطینی اس نالی کی طرف بھاگے کہ مسلمانوں کو اس پر دروازہ کھلا ہوا پایا، اور معاویہ کے ساتھ اس کے آدمیوں کے دروازے کھلے ہوئے تھے۔ کہا جاتا ہے کہ اس نے اس میں سات لاکھ مرتد، تیس ہزار سامری اور دو لاکھ یہودی، تین سو کام کرنے والے بازار اور ایک لاکھ ہر رات اس کی دیوار کی حفاظت کرتے پائے۔ اس کے قیدیوں کی تعداد چار ہزار تک پہنچ گئی جنہیں معاویہ نے عمر کے پاس بھیجا، جنہوں نے انہیں الجرف میں رکھا اور انصار کے یتیموں میں تقسیم کر دیا، کچھ کو رسم الخط اور مسلمانوں کی مزدوری پر ڈال دیا - ابوبکر نے ابو امامہ اسعد بن زرارہ کی بیٹیوں کو عین الطمر کی دو خادمہیں دیں جنہوں نے ان کو عن الطمر کی طرح مری ہوئی ٹوپی دی سیزریا؛ معاویہ نے فتح کی خبر یہود کے دو آدمیوں کے ساتھ بھیجی، پھر ان کی کمزوری کے ڈر سے خثعم کے ایک آدمی کو بھیجا جو ان سے آگے نکل گیا اور عمر کے پاس آیا، جس نے خدا کی بڑائی کی۔ اس میں شقیق کہا جاتا ہے جن کے بارے میں حسن بن ثابت کہتے ہیں کہ شقیق کہتے ہیں: اگر تم شراب سے بیدار ہوتے تو تعداد میں غنی ہو جاتے۔"
