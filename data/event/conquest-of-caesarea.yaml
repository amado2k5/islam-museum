label: { ar: "فتح قيسارية", en: "The Conquest of Caesarea" }
summary:
  ar: "عند البلاذري: اختلف في أمر قيسارية فقيل فتحها معاوية وقيل إياد بن غنم بعد وفاة أبي عبيدة وقيل عمرو بن العاص وقيل عبد الله ابنه؛ والذي اجتمع عليه العلماء أن أول من حاصرها عمرو بن العاص نزل عليها في جمادى الأولى سنة 13 فكان يقيم عليها ما أقام فإذا كان للمسلمين جمع في أمر عدوهم سار إليهم فشهد أجنادين وفحل والمرج ودمشق واليرموك ثم رجع إلى فلسطين فحاصرها بعد إيلياء ثم خرج إلى مصر من قيسارية، وولّى يزيد بن أبي سفيان بعد أبي عبيدة فوكّل أخاه معاوية بمحاصرتها وتوجه إلى دمشق مطعوناً فمات بها آخر سنة 18 واستخلف على قيسارية معاوية ففتحها وكتب به يزيد إلى عمر؛ وروى الواقدي أنه لما ولّى عمر معاوية الشام حاصرها حتى فتحها وقد كانت حوصرت نحواً من سبع سنين وكان فتحها في شوال سنة 19 — وقال بعضهم في أول سنة 20 — وأن سبب فتحها أن يهودياً يقال له يوسف أتى المسلمين ليلاً فدلهم على طريق في سرب فيه الماء إلى حقو الرجل على أن أمنوه وأهله فأنفذ معاوية ذلك ودخل المسلمون في الليل وكبروا فأراد الروم الهرب من السرب فوجدوا المسلمين عليه ففتح المسلمون الباب فدخل معاوية، وقيل إنه وجد بها من المرتدة سبعمائة ألف ومن السامرة ثلاثين ألفاً ومن اليهود مائتي ألف وبها ثلاثمائة سوق قائمة وكان يحرسها كل ليلة على سورها مائة ألف؛ وبلغ سبيها أربعة آلاف رأس بعث بهم معاوية إلى عمر فأمر بهم فأنزلوا الجرف وقسمهم على يتامى الأنصار وجعل بعضهم في الكتاب والأعمال للمسلمين، وكان أبو بكر قد أخدم بنات أبي أمامة أسعد بن زرارة خادمين من سبي عين التمر فماتا فأعطاهن عمر مكانهما من سبي قيسارية؛ ووجه معاوية بالفتح مع رجلين من جذام ثم خاف ضعفهما فوجّه رجلاً من خثعم فسبقهما ودخل على عمر فكبر؛ وقيل إن فيها كانت شقراء التي قال فيها حسان بن ثابت «تقول شقراء لو صحوت عن الخمر لأصبحت مثري العدد»."
  en: "In al-Baladhuri: the conquest of Caesarea is disputed — some ascribe it to Mu'awiya, others to Iyad ibn Ghanm after Abu Ubayda's death, others to Amr ibn al-As or his son Abdullah; what the scholars agree is that the first to besiege it was Amr ibn al-As, camping against it in Jumada I year 13 and staying as long as he did, marching off whenever the Muslims massed against an enemy — attending Ajnadayn, Fihl, the Marj, Damascus and the Yarmuk — then returning to Filastin to besiege it after Iliya', before leaving from Caesarea for Egypt; Yazid ibn Abi Sufyan, succeeding Abu Ubayda, charged his brother Mu'awiya with the siege and went plague-stricken to Damascus, dying there at the end of year 18, leaving Mu'awiya over Caesarea, who took it and wrote of it to Yazid who wrote to Umar; al-Waqidi reports that when Umar gave Mu'awiya Syria he besieged it until he took it — it had been besieged near seven years — its conquest falling in Shawwal year 19, some say the opening of year 20; the cause of its fall was a Jew named Yusuf who came to the Muslims by night and guided them to a way through a conduit with water to a man's waist, on condition of safety for himself and his house — Mu'awiya carried it out and the Muslims entered by night and magnified God, the Byzantines fleeing toward the conduit finding the Muslims upon it, and the gate being opened Mu'awiya entered with his men; it is said he found in it seven hundred thousand apostates, thirty thousand Samaritans and two hundred thousand Jews, three hundred functioning markets and a hundred thousand guarding its wall each night; its captives reached four thousand heads whom Mu'awiya sent to Umar, who had them quartered at al-Jurf and divided among the orphans of the Ansar, putting some to the script and the Muslims' labours — Abu Bakr had given the daughters of Abu Umama As'ad ibn Zurara two servants of Ayn al-Tamr's captives who died, and Umar gave them their like of Caesarea's; Mu'awiya sent the victory news with two men of Judham, then fearing their weakness sent a man of Khath'am who outpaced them and came to Umar, who magnified God; in it is said to have been Shaqa'iq, of whom Hassan ibn Thabit says 'Shaqa'iq says: had you woken from the wine you would have risen enriched in number'."
