label: { ar: "عودة القائم من الحديثة إلى بغداد", en: "The return of al-Qa'im from Haditha to Baghdad", es: "El regreso de al-Qa'im de Haditha a Bagdad", fr: "Le retour d'al-Qa'im de Haditha à Bagdad", ur: "القائم کی الحدیدہ سے بغداد واپسی", tr: "Valinin Haditha'dan Bağdat'a dönüşü", id: "Kepulangan gubernur dari Haditha ke Baghdad" }
summary:
  ar: "في سنة إحدى وخمسين وأربعمائة استرد الخليفة القائم بأمر الله عاصمته بعد سنة كاملة من ملك البساسيري لبغداد: كان مضيفه مهارش العقيلي صاحب الحديثة قد وفى له ورفض طلب قريش بن بدران إخراجه، فلما وصل طغربك بغداد وأرسل عميد الملك في ثلاثمائة غلام بأربع عشرة بختية عليها السرادق والفروش وستة بغال عليها الثياب وبغل عليه مهد مسجّف وثلاثة أفراس بالمراكب الذهب، نقله ابن فورك من الحديثة إلى قلعة تل عكبرا ثم إلى سرادق النهروان. فلما وقعت عين السلطان على السرادق نزل عن فرسه ومشى إليه ودخل فقبّل الأرض سبع مرات، وأخرج الخليفة من قبائه جبل الياقوت الأحمر الذي كان لبني بويه واثنتي عشرة حبة لؤلؤ كبارًا فطرحها بين يديه وأرسلت أرسلان خاتون تسأل أن تسبح بها سبحة. واعتذر طغربك عن تأخره بعصيان أخيه إبراهيم الذي خنقه بوتر قوسه، وقال: أنا إن شاء الله أمضي وراء هذا الكلب — يعني البساسيري — فأقتنصه وأرم إلى الشام وأفعل بصاحب مصر فيها ما يكون جزاء فعله هنا؛ فقلّده الخليفة بيده سيفًا كان إلى جنبه وقال إنه لم يُسلم معه وقت خروجه غير هذا السيف فقد تبرّك به وشرّفه بتقليده. ودخل الخليفة البلد يوم الاثنين لخمس بقين من ذي القعدة، وتقدّم السلطان إلى باب النوبي وقعد مكان الحاجب على دكته حتى ورد الخليفة والعسكر محتفون به، ولم يكن في بغداد من يستقبله سوى قاضي القضاة وثلاثة أنفس من الشهود لهرب الناس {cite:muntazam-ibn-al-jawzi j.8 p.547-550}. واتفق أن خروج الخليفة من داره كان يوم الثلاثاء ثامن عشر كانون الثاني ومقتل البساسيري يوم الثلاثاء ثامن عشر كانون الثاني من السنة الآتية، وهذا من الاتفاقات الظريفة {cite:muntazam-ibn-al-jawzi j.8 p.552-553}."
  en: "The caliph al-Qa'im's restoration after a full year of al-Basasiri's rule: Mihrash the 'Uqaylid of Haditha refused to surrender him, Tughril sent Amid al-Mulk with three hundred ghilman, fourteen Bactrian camels of tents and furnishings and a gold-plated litter; at the Nahrwan pavilion the sultan dismounted, walked, and kissed the ground seven times, while the caliph brought out the Buyid mountain of red yaqut and twelve large pearls. Tughril begged pardon for his delay — 'my jealous brother Ibrahim; I strangled him with his own bowstring' — and the caliph girded on him the only sword saved from his flight. The caliph entered Monday 25 Dhu'l-Qa'da 451, Tughril seated on the gatekeeper's bench at Bab al-Nubi until the procession passed; only the chief qadi and three witnesses were left in Baghdad to receive him {cite:muntazam-ibn-al-jawzi j.8 p.547-550}."
  es: "La restauración del califa al-Qa'im después de un año completo de gobierno de al-Basasiri: Mihrash el 'Uqaylid de Haditha se negó a entregarlo, Tughril envió a Amid al-Mulk con trescientos ghilman, catorce camellos bactrianos de tiendas y enseres y una litera bañada en oro; en el pabellón Nahrwan el sultán desmontó, caminó y besó el suelo siete veces, mientras el califa sacó la montaña Buyid de yaqut rojo y doce grandes perlas. Tughril pidió perdón por su demora —'mi celoso hermano Ibrahim; lo estrangulé con la cuerda de su propio arco'— y el califa le ciñó la única espada que había salvado de su huida. El califa entró el lunes 25 de Dhu'l-Qa'da 451, Tughril se sentó en el banco del portero en Bab al-Nubi hasta que pasó la procesión; Solo el cadí principal y tres testigos quedaron en Bagdad para recibirlo {cite:muntazam-ibn-al-jawzi j.8 p.547-550}."
  fr: "La restauration du calife al-Qa'im après une année entière de règne d'al-Basasiri: Mihrash l'Uqaylid d'Haditha refusa de se rendre. Tughril envoya Amid al-Mulk avec trois cents ghilman, quatorze chameaux de Bactriane chargés de tentes et de mobilier, ainsi qu'une litière plaquée or. Au pavillon de Nahrwan, le sultan descendit de cheval, marcha et baisa le sol sept fois, tandis que le calife apportait la montagne bouyide de yaqut rouge et douze grosses perles. Tughril implora le pardon pour son retard – « Mon frère jaloux Ibrahim; je l'ai étranglé avec la corde de son propre arc » – et le calife lui remit la seule épée qu'il avait conservée lors de sa fuite. Le calife entra le lundi 25 Dhu'l-Qa'da 451, Tughril étant assis sur le banc du gardien de la porte de Bab al-Nubi jusqu'au passage du cortège. Seuls le cadi en chef et trois témoins restèrent à Bagdad pour le recevoir {cite:muntazam-ibn-al-jawzi j.8 p.547-550}."
  ur: "بصیری کی حکومت کے پورے سال کے بعد خلیفہ القائم کی بحالی: حدیدہ کے محرش عقیل نے اسے ہتھیار ڈالنے سے انکار کر دیا، طغرل نے امیڈ الملک کو تین سو غلمان، خیمہ اور سامان کے چودہ باختری اونٹوں اور سونے کی چادر کے ساتھ بھیجا۔ نہروان پویلین میں سلطان اترا، چل پڑا اور سات بار زمین کو بوسہ دیا، جب کہ خلیفہ نے سرخ یاقوت اور بارہ بڑے موتیوں کا بائید پہاڑ نکالا۔ طغرل نے اپنی تاخیر پر معافی مانگی - 'میرے غیرت مند بھائی ابراہیم؛ میں نے اس کی اپنی کمان سے اس کا گلا گھونٹ دیا'' - اور خلیفہ نے اس کے سر پر وہ واحد تلوار باندھ دی جو اس کی پرواز سے بچ گئی تھی۔ خلیفہ سوموار 25 ذوالقعدہ 451 میں داخل ہوا، تغرل باب النبی میں دربان کے بنچ پر بیٹھا جب تک کہ جلوس گزر نہ گیا۔ بغداد میں ان کے استقبال کے لیے صرف سردار قاضی اور تین گواہ باقی رہ گئے تھے۔"
  tr: "Hicri 451 yılında (Miladi 1067/1068), Halife el-Kaim bi-Amr Allah, Bağdat'ı bir yıl boyunca yöneten el-Basasiri'nin ardından başkentini geri aldı. Ev sahibi, el-Haditha hükümdarı Mahrash el-Uqayli, ona sadık kalmış ve Kureyş ibn Badran'ın onu kovma isteğini reddetmişti. Tuğrak Bağdat'a vardığında, Amid el-Mulk'ü üç yüz hizmetkar, örtülü ve halılı on dört deve, giysili altı katır, örtülü bir sedyeli katır ve altın eyerli üç atla birlikte gönderdi. İbn Furak onu el-Haditha'dan Tell Akbara kalesine, oradan da el-Nahrawan'ın gölgeliğine götürdü. Sultanın gözü gölgeliğe iliştiğinde, atından indi, ona doğru yürüdü, içeri girdi ve yedi kez toprağı öptü. Halife daha sonra cübbesinden Büveyhilere ait bir dağ dolusu kırmızı yakut ve on iki büyük inci çıkardı ve bunları önüne koydu. Arslan Hatun, bunların tesbih yapımında kullanılmasını istedi. Toğrabak gecikmesinden dolayı özür diledi ve bunu, kendisini yay kirişiyle boğan kardeşi İbrahim'in itaatsizliğine bağladı. \"Allah'ın izniyle, bu köpeği -yani el-Basasiri'yi- takip edip yakalayacağım. Sonra onu Suriye'ye göndereceğim ve Mısır hükümdarına burada yaptıklarının karşılığını vereceğim\" dedi. Halife daha sonra yanında bulunan bir kılıcı ona bizzat verdi ve ayrılırken yanına başka hiçbir şey almadığını, onu kutsadığını ve ona vererek onu onurlandırdığını söyledi. Halife, Zilhicce ayının 25'inde, Pazartesi günü şehre girdi. Sultan, Nubya Kapısı'na gitti ve halife ile ordusu gelene kadar, gelişini kutlayarak, kâhyanın yerinde, platformda oturdu. Bağdat'ta onu karşılayacak kimse yoktu, sadece Başyargıç ve üç şahit vardı, çünkü halk kaçmıştı. Halifenin 18 Ocak Salı günü evinden ayrıldığı ve el-Basasiri'nin de ertesi yılın 18 Ocak Salı günü öldürüldüğü konusunda anlaşmaya varıldı. Bu, ilginç tesadüflerden biridir. {cite:muntazam-ibn-al-jawzi j.8 p.552-553}"
  id: "Pada tahun 451 H (1067/1068 M), Khalifah al-Qa'im bi-Amr Allah merebut kembali ibu kotanya setelah setahun penuh pemerintahan al-Basasiri atas Baghdad. Tuan rumahnya, Mahrash al-Uqayli, penguasa al-Haditha, tetap setia kepadanya dan menolak permintaan Quraysh ibn Badran untuk mengusirnya. Ketika Tughrbak tiba di Baghdad, ia mengirim Amid al-Mulk dengan tiga ratus pelayan, empat belas unta dengan kanopi dan karpet, enam keledai dengan pakaian, seekor keledai dengan tandu berbalut kain, dan tiga kuda dengan pelana emas. Ibn Furak mengangkutnya dari al-Haditha ke benteng Tell Akbara, kemudian ke kanopi al-Nahrawan. Ketika mata Sultan tertuju pada kanopi itu, ia turun dari kudanya, berjalan ke arahnya, masuk, dan mencium tanah tujuh kali. Kemudian Khalifah mengeluarkan dari jubahnya setumpuk batu rubi merah yang pernah menjadi milik Dinasti Buyid dan dua belas mutiara besar, lalu meletakkannya di hadapannya. Arslan Khatun mengirim pesan meminta agar batu-batu itu digunakan untuk membuat tasbih. Toghrabak meminta maaf atas keterlambatannya, dengan alasan ketidaktaatan saudaranya Ibrahim, yang telah mencekiknya dengan tali busur. Ia berkata, \"Insya Allah, aku akan mengejar anjing ini—maksudku al-Basasiri—dan menangkapnya. Kemudian aku akan mengirimnya ke Suriah dan melakukan kepada penguasa Mesir apa yang pantas diterimanya atas perbuatannya di sini.\" Khalifah kemudian secara pribadi menganugerahkan kepadanya sebuah pedang yang ada di sampingnya, sambil mengatakan bahwa ia tidak membawa apa pun lagi ketika pergi, dan bahwa ia telah memberkati dan menghormatinya dengan menganugerahkannya kepadanya. Khalifah memasuki kota pada hari Senin, tanggal 25 Dzul Qi'dah. Sultan menuju Gerbang Nubia dan duduk di tempat kepala istana di mimbarnya sampai Khalifah dan pasukannya tiba, merayakan kedatangannya. Tidak seorang pun di Baghdad yang ada di sana untuk menyambutnya kecuali Ketua Mahkamah Agung dan tiga saksi, karena orang-orang telah melarikan diri. Disepakati bahwa Khalifah meninggalkan rumahnya pada hari Selasa, tanggal 18 Januari, dan bahwa al-Basasiri terbunuh pada hari Selasa, tanggal 18 Januari tahun berikutnya. Ini adalah salah satu kebetulan yang menarik {cite:muntazam-ibn-al-jawzi j.8 p.552-553}."
