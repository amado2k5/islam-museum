id: event/mutah-martyrdom-of-zayd
class: event
kind: other
label: { ar: "استشهاد زيد بن حارثة قائدًا أول", en: "Martyrdom of Zayd ibn Haritha as first commander", es: "Martirio de Zayd ibn Haritha como primer comandante", fr: "Martyre de Zayd ibn Haritha en tant que premier commandant", ur: "زید بن حارثہ کی پہلی سپہ سالار کی حیثیت سے شہادت", tr: "İlk komutan Zeyd ibn Harita'nın şehadeti", id: "Kemartiran Zayd ibn Haritha, komandan pertama" }
summary:
  ar: "في معركة مؤتة حمل زيد بن حارثة راية رسول الله وقاتل بها حتى قُتل شهيدًا. أعلن النبي استشهاده غيبًا في المدينة قبل وصول الخبر، ورأى في رؤيا أن الله رفعه على سرير من ذهب."
  en: "At Mu'tah, Zayd ibn Haritha carried the Prophet's standard and fought until he was killed. The Prophet announced his martyrdom in Medina before news arrived, and reported seeing him raised on a golden throne in a vision."
  es: "En Mu'tah, Zayd ibn Haritha portó el estandarte del Profeta y luchó hasta morir. El Profeta anunció su martirio en Medina antes de que llegaran las noticias, y relató haberlo visto elevado a un trono de oro en una visión."
  fr: "À Mu'tah, Zayd ibn Haritha porta l'étendard du Prophète et combattit jusqu'à sa mort. Le Prophète annonça son martyre à Médine avant même que la nouvelle n'arrive et raconta l'avoir vu en vision, élevé sur un trône d'or."
  ur: "موتہ کے مقام پر زید بن حارثہ نے رسول اللہ کا پیمانہ اٹھایا اور اس وقت تک لڑتے رہے جب تک وہ ہلاک نہ ہو گئے۔ نبی نے خبر پہنچنے سے پہلے مدینہ میں اپنی شہادت کا اعلان کر دیا، اور خواب میں انہیں سونے کے تخت پر اٹھائے جانے کی خبر دی۔"
  tr: "Mu'te Muharebesi'nde Zeyd ibn Harita, Allah Resulü'nün sancağını taşıdı ve şehit olana kadar onunla savaştı. Peygamber, Medine'de kendisine haber ulaşmadan önce onun şehit olacağını önceden bildirmişti ve Zeyd bir rüyada Allah'ın onu altından bir taht üzerinde yükselttiğini görmüştü."
  id: "Dalam Perang Mu'tah, Zayd ibn Harithah membawa panji Rasulullah dan berperang dengannya hingga gugur sebagai syahid. Nabi telah meramalkan kesyahidannya di Madinah sebelum berita itu sampai kepadanya, dan beliau melihat dalam sebuah penglihatan bahwa Allah mengangkatnya ke atas singgasana emas."
