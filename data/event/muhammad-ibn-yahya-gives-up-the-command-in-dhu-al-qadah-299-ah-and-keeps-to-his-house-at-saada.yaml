id: "event/muhammad-ibn-yahya-gives-up-the-command-in-dhu-al-qadah-299-ah-and-keeps-to-his-house-at-saada"
class: event
kind: other
label:
  ar: "يتخلى أبو القاسم محمد بن يحيى عن الأمر في ذي القعدة سنة 299هـ ويلزم منزله بصعدة، ص400"
  en: "Muhammad ibn Yahya gives up the command in Dhu al-Qa'dah 299 AH and keeps to his house at Sa'da, p. 400"
  ur: "محمد بن یحییٰ ذوالقعدہ 299ھ میں امر سے دست بردار ہو کر صعدہ میں گھر تک محدود ہوتے ہیں، ص400"
  es: "Muhammad ibn Yahya renuncia al mando en Dhu al-Qa'dah 299 AH y permanece en su casa en Sa'da, pág. 400."
  fr: "Muhammad ibn Yahya abandonne son commandement en Dhu al-Qa'dah 299 AH et reste dans sa maison à Sa'da, p. 400"
  tr: "Ebu el-Kâsım Muhammed ibn Yahya, Hicri 299 yılının Zilhicce ayında görevinden ayrıldı ve Sa'de'deki evinde kaldı (s. 400)."
  id: "Abu al-Qasim Muhammad ibn Yahya melepaskan jabatannya pada bulan Dzul Qi'dah tahun 299 H dan tetap tinggal di rumahnya di Sa'dah, hlm. 400"
summary:
  ar: "يجمع أبو القاسم محمد بن يحيى وجوه العشائر يوم الخميس لإحدى وعشرين ليلة خلت من ذي القعدة سنة 299هـ، ثم يتخلى عن الأمر، ويصرف عماله من نجران وهمدان وغيرهما، ويلزم منزله بصعدة."
  en: "On Thursday, twenty-one nights into Dhu al-Qa'dah 299 AH, Abu al-Qasim Muhammad ibn Yahya gathers the notables of the tribes. He then gives up the command, dismisses his governors in Najran, Hamdan and elsewhere, and keeps to his house at Sa'da."
  ur: "جمعرات کو، ذوالقعدہ 299ھ کی اکیس راتیں گزرنے پر، ابو القاسم محمد بن یحییٰ قبائل کے سرداروں کو جمع کرتے ہیں، پھر امر سے دست بردار ہو جاتے ہیں، نجران، ہمدان اور دوسرے علاقوں کے عاملوں کو ہٹا دیتے ہیں اور صعدہ میں اپنے گھر میں رہتے ہیں۔"
  es: "El jueves, veintiún noches después del inicio de Dhu al-Qa'dah del año 299 de la Hégira, Abu al-Qasim Muhammad ibn Yahya reunió a los notables de las tribus. Luego, renunció al mando, destituyó a sus gobernadores en Najran, Hamdan y otros lugares, y se retiró a su casa en Sa'da."
  fr: "Le jeudi 21 du mois de Dhu al-Qa'dah 299 AH, Abu al-Qasim Muhammad ibn Yahya réunit les notables des tribus. Il abandonne ensuite son commandement, renvoie ses gouverneurs à Najran, Hamdan et ailleurs, et se retire dans sa demeure à Sa'da."
  tr: "Ebu el-Kâsim Muhammed ibn Yahya, Hicri 299 yılının Zilhicce ayının 21. gecesi Perşembe günü aşiret liderlerini bir araya topladı, sonra meseleyi bıraktı, Necran, Hamdan ve diğer yerlerdeki işçilerini gönderdi ve Sa'de'deki evinde kaldı."
  id: "Abu al-Qasim Muhammad ibn Yahya mengumpulkan para pemimpin suku pada hari Kamis, malam ke-21 bulan Dzul Qi'dah tahun 299 Hijriah, kemudian beliau melepaskan perkara tersebut, membubarkan para pekerjanya dari Najran, Hamdan dan tempat-tempat lain, dan tinggal di rumahnya di Sa'dah."
