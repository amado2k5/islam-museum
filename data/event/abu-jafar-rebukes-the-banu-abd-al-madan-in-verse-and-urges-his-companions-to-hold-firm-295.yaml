id: "event/abu-jafar-rebukes-the-banu-abd-al-madan-in-verse-and-urges-his-companions-to-hold-firm-295"
class: event
kind: other
label:
  ar: "أبو جعفر يعاتب بني عبد المدان شعراً، ويحث أصحابه على الثبات، 295هـ"
  en: "Abu Ja'far rebukes Banu Abd al-Madan in verse and urges his companions to hold firm, 295 AH, p. 371"
  fr: "Abu Ja'far blâme les Banu Abd al-Madan en vers et exhorte ses compagnons à tenir ferme, 295 de l’hégire, p. 371"
  ur: "ابو جعفر شعر میں بنو عبدالمدان کو ملامت کرتا ہے اور ساتھیوں کو ثابت قدم رہنے کی تلقین کرتا ہے، 295ھ، ص371"
  es: "Abu Ja'far reprende a Banu Abd al-Madan en verso e insta a sus compañeros a mantenerse firmes, 295 AH, pág. 371"
  tr: "Ebu Cafer, Hicri 295 yılında, Beni Abdülmeden'i şiirle kınayarak arkadaşlarını sebat etmeye çağırmıştır."
  id: "Abu Ja'far menegur Bani Abd al-Madan dalam bentuk syair, mendesak para sahabatnya untuk tetap teguh, 295 H."
summary:
  ar: "قال أبو جعفر شعراً يعاتب فيه بني عبد المدان على غدرهم، ووصفهم بالشرار. ثم أمر أصحابه بالثبات وألا يهنوا ولا يجزعوا لقلتهم وكثرة عدوهم، فأجابوه بأنهم يعلمون أنهم على الحق وعدوهم على الباطل، وأنهم لا يهمهم إلا أن يتمكن العدو منه."
  en: "Abu Ja'far spoke verses rebuking Banu Abd al-Madan for their betrayal and calling them the worst of men. He then told his companions not to weaken or despair at their small number and their enemy's great number. They answered that they knew they stood for the truth and their enemies for falsehood, and that their only fear was that the enemy should get the better of him."
  fr: "Abu Ja'far prononça des vers reprochant aux Banu Abd al-Madan leur trahison et les qualifiant de pires des hommes. Il dit ensuite à ses compagnons de ne pas faiblir ni désespérer devant leur petit nombre et celui, important, de l’ennemi. Ils répondirent qu’ils se savaient dans la vérité et leurs ennemis dans l’erreur, et craignaient seulement que l’ennemi ne l’emportât sur lui."
  ur: "ابو جعفر نے شعر میں بنو عبدالمدان کو ان کی غداری پر ملامت کی اور انہیں بدترین لوگ کہا۔ پھر اس نے ساتھیوں کو حکم دیا کہ وہ کمزور نہ پڑیں اور اپنی قلت اور دشمن کی کثرت سے گھبرائیں نہیں۔ ساتھیوں نے جواب دیا کہ وہ جانتے ہیں کہ وہ حق پر ہیں اور ان کے دشمن باطل پر، اور انہیں صرف یہ خوف ہے کہ دشمن اس پر قابو پا لے۔"
  es: "Abu Ja'far pronunció versos reprendiendo a los Banu Abd al-Madan por su traición y llamándolos los peores hombres. Luego les dijo a sus compañeros que no se desanimaran ni desesperaran por su escaso número frente al gran número de su enemigo. Ellos respondieron que sabían que defendían la verdad y sus enemigos la falsedad, y que su único temor era que el enemigo los venciera."
  tr: "Ebu Cafer, Beni Abdülmeden kabilesini ihanetlerinden dolayı kınayan ve onları kötü olarak nitelendiren bir şiir yazdı. Ardından arkadaşlarına metanetli olmalarını, sayıca az olmalarına ve düşmanlarının sayıca çok olmalarına aldırmamalarını emretti. Onlar da, kendilerinin hakikat tarafında, düşmanlarının ise batıl tarafında olduklarını bildiklerini ve tek kaygılarının düşmanın kendilerine üstün gelmesi olduğunu söylediler."
  id: "Abu Ja'far menggubah sebuah puisi yang menegur Bani Abd al-Madan atas pengkhianatan mereka, menggambarkan mereka sebagai orang-orang jahat. Kemudian ia memerintahkan para sahabatnya untuk tetap teguh dan tidak putus asa atau bersedih karena jumlah mereka yang sedikit dan jumlah musuh yang besar. Mereka menjawab bahwa mereka tahu mereka berada di pihak kebenaran dan musuh mereka berada di pihak kebohongan, dan satu-satunya kekhawatiran mereka adalah agar musuh menang atas mereka."
