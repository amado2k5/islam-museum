id: event/yaqub-ibn-layth-takes-kirman
class: event
kind: conquest
label: { ar: "استيلاء يعقوب بن الليث على كرمان", en: "Ya'qub ibn al-Layth's Seizure of Kirman", es: "La toma de Kirman por parte de Ya'qub ibn al-Layth", fr: "La saisie de Kirman par Ya'qub ibn al-Layth", ur: "یعقوب بن لیث کا کرمان پر قبضہ" }
summary:
  ar: "في سنة خمس وخمسين ومائتين وقعت بين يعقوب بن الليث وطوق بن المغلس خارج كرمان، ثم استولى يعقوب على كرمان {cite:tabari-tarikh-abu-al-fadl j.9 p.382}، ثم دخل فارس وأسر علي بن الحسين بن قريش {cite:tabari-tarikh-abu-al-fadl j.9 p.384}."
  en: "In the year 255 an engagement took place between Ya'qub ibn al-Layth and Tawq ibn al-Mughallis outside Kirman, and then Ya'qub seized Kirman {cite:tabari-tarikh-abu-al-fadl j.9 p.382}; then he entered Fars and captured Ali ibn al-Husayn ibn Quraysh {cite:tabari-tarikh-abu-al-fadl j.9 p.384}."
  es: "En el año 255 tuvo lugar un enfrentamiento entre Ya'qub ibn al-Layth y Tawq ibn al-Mughallis en las afueras de Kirman, y luego Ya'qub tomó Kirman {cite:tabari-tarikh-abu-al-fadl j.9 p.382}; luego entró en Fars y capturó a Ali ibn al-Husayn ibn Quraysh {cite:tabari-tarikh-abu-al-fadl j.9 p.384}."
  fr: "En l'an 255, un affrontement eut lieu entre Ya'qub ibn al-Layth et Tawq ibn al-Mughallis aux abords de Kirman, puis Ya'qub s'empara de Kirman {cite:tabari-tarikh-abu-al-fadl j.9 p.382}; puis il entra dans le Fars et captura Ali ibn al-Husayn ibn Quraysh {cite:tabari-tarikh-abu-al-fadl j.9 p.384}."
  ur: "255 میں کرمان کے باہر یعقوب بن لیث اور طوق ابن المغلس کے درمیان منگنی ہوئی اور پھر یعقوب نے کرمان پر قبضہ کر لیا۔ پھر وہ فارس میں داخل ہوا اور علی ابن الحسین ابن قریش کو گرفتار کر لیا۔"
