label: { ar: "تأسيس المتوكلية", en: "The Founding of al-Mutawakkiliyya", es: "La fundación de al-Mutawakkiliyya", fr: "La fondation d'al-Mutawakkiliyya", ur: "المتوکلیہ کی تاسیس", tr: "El-Mütevekkiliye'nin Kuruluşu", id: "Berdirinya Al-Mutawakkiliya" }
summary:
  ar: "عند البلاذري: استخلف المتوكل في ذي الحجة سنة 232 فأقام بالهاروني وبنى بناء كثيراً واقطع الناس في ظهر سر من رأى بالحائر الذي كان المعتصم احتجره قطائع فاتسعوا بها وبنى مسجداً جامعاً وأعظم النفقة عليه وأمر برفع منارته لتعلوا أصوات المؤذنين حتى نظر إليها من فراسخ فجمع الناس فيه وتركوا المسجد الأول ثم أحدث مدينة سماها المتوكلية وعمرها وأقام بها واقطع الناس فيها القطائع وجعلها فيما بين الكرخ المعروف بفيروز وبين القاطول المعروف بكسرى فدخلت الدور والقرية المعروفة بالماحوزة فيها وبنى بها مسجداً جامعاً وكان من ابتدائه إياها إلى أن نزلها أشهر ونزلها في أول سنة 246 ثم توفي بها في شوال سنة 247 واستخلف المنتصر فانتقل عنها إلى سر من رأى يوم الثلاثاء لعشر خلون من شوال."
  en: "In al-Baladhuri: al-Mutawakkil succeeded in Dhu al-Hijja 232, dwelt at al-Haruni and built much; he granted the people qati'as behind Sur man Ra'a in the preserve al-Mu'tasim had walled, and they spread through it; he built a congregational mosque at vast cost and had its minaret raised so the muezzins' voices would carry — visible from parasangs away — gathering the people who left the first mosque. Then he founded a city he named al-Mutawakkiliyya, between Karkh Fayruz and Qatul Kisra, absorbing the hamlet called al-Ma'huza, built its mosque, granted its qati'as and dwelt there in the first of 246 — a few months after founding it — dying there in Shawwal 247; al-Muntasir succeeded that night and moved back to Sur man Ra'a on Tuesday the tenth of Shawwal."
  es: "En al-Baladhuri: al-Mutawakkil sucedió en Dhu al-Hijja 232, habitó en al-Haruni y construyó mucho; otorgó a la gente qati'as detrás de Sur man Ra'a en la reserva que al-Mu'tasim había amurallado, y se extendieron por ella; construyó una mezquita congregacional a un costo enorme e hizo elevar su minarete para que las voces de los muecines se oyeran —visibles desde parasangs de distancia— reuniendo a la gente que salía de la primera mezquita. Luego fundó una ciudad que llamó al-Mutawakkiliyya, entre Karkh Fayruz y Qatul Kisra, absorbiendo la aldea llamada al-Ma'huza, construyó su mezquita, otorgó sus qati'as y habitó allí en el primero de 246 —pocos meses después de fundarla— muriendo allí en Shawwal 247; al-Muntasir sucedió esa noche y regresó a Sur man Ra'a el martes 10 de Shawwal."
  fr: "Selon al-Baladhuri: al-Mutawakkil succéda en Dhu al-Hijja 232, s’installa à al-Haruni et y fit construire de nombreux bâtiments. Il accorda aux habitants des qati’as derrière Sur man Ra’a, dans l’enceinte fortifiée par al-Mu’tasim, et ils s’y installèrent. Il fit bâtir une mosquée du vendredi à grands frais et en fit élever le minaret afin que la voix des muezzins porte loin, attirant ainsi les fidèles qui avaient quitté la première mosquée. Il fonda ensuite une ville qu’il nomma al-Mutawakkiliyya, entre Karkh Fayruz et Qatul Kisra, absorbant le hameau d’al-Ma’huza, y construisit sa mosquée, lui accorda des qati’as et y résida le premier jour de l’année 246, quelques mois après sa fondation. Il y mourut en Shawwal 247. al-Muntasir lui succéda cette nuit-là et retourna à Sur man Ra’a le mardi 10 Shawwal."
  ur: "البلادوری میں ہے: المتوکل ذی الحجہ 232 میں کامیاب ہوا، ہارونی میں سکونت اختیار کی اور بہت کچھ تعمیر کیا۔ اس نے لوگوں کو سور من راع کے پیچھے محفوظ المعتصم کی دیوار میں قطیعات عطا کیں اور وہ اس میں پھیل گئے۔ اس نے بڑی لاگت سے ایک اجتماعی مسجد بنائی اور اس کے مینار کو اونچا کروایا تاکہ مؤذن کی آوازیں - جو پارسنگ دور سے نظر آتی ہیں - ان لوگوں کو جمع کریں جو پہلی مسجد سے نکلے تھے۔ پھر اس نے کارخ فیروز اور قتال کسرہ کے درمیان المتوکلیہ کے نام سے ایک شہر کی بنیاد رکھی، المحوزہ نامی بستی کو جذب کیا، اس کی مسجد بنائی، اس کے قطیعات دیے اور 246 کی پہلی تاریخ میں - اس کی بنیاد رکھنے کے چند ماہ بعد - شوال 247 میں وہیں رہائش اختیار کی۔ المنتصر اس رات کامیاب ہوا اور شوال کی دسویں بروز منگل کو سورمن راع واپس چلا گیا۔"
  tr: "El-Baladhuri'ye göre: El-Mutavakkil, Zilhicce 232 yılında atandı, bu yüzden El-Haruni'de kaldı ve birçok bina inşa etti ve insanlara Samarra'nın arkasındaki El-Hair'de, El-Mu'tasim'in mülk olarak ayırdığı araziler verdi, böylece insanlar bu arazilerle genişledi ve o da bir cami inşa etti, bunun için büyük miktarda para harcadı ve minaresinin yükseltilmesini emretti ki müezzinlerin sesleri, farsaklardan bile görülebilsin, böylece insanları camiye topladı ve ilk camiyi terk ettiler. Sonra bir şehir kurdu ve ona El-Mutavakkiliye adını verdi, geliştirdi ve orada kaldı, insanlara mülkler verdi ve onu El-Karkh (Firuz olarak da bilinir) ve El-Katul (Kisra olarak da bilinir) arasına yerleştirdi, böylece evler ve El-Mahuza olarak bilinen köy de içine dahil edildi ve orada bir cami inşa etti. Başlangıcından oraya yerleşmesine kadar aylar geçti ve 246 yılının başında oraya yerleşti, sonra 247 yılının Şevval ayında orada vefat etti ve yerine El-Muntasir atandı, böylece Şevval ayının onuncu günü Salı günü oradan Semerra'ya taşındı."
  id: "Menurut Al-Baladhuri: Al-Mutawakkil diangkat pada bulan Dzul Hijjah tahun 232, lalu ia tinggal di Al-Haruni dan membangun banyak bangunan serta memberikan tanah kepada orang-orang di belakang Samarra di Al-Ha'ir, yang sebelumnya dikuasai oleh Al-Mu'tasim sebagai perkebunan. Mereka kemudian memperluas wilayah tersebut dan ia membangun sebuah masjid berjamaah serta menghabiskan banyak uang untuk pembangunannya. Ia juga memerintahkan agar menara masjid ditinggikan sehingga suara muazin dapat terdengar dari kejauhan. Ia mengumpulkan orang-orang di masjid tersebut dan meninggalkan masjid pertama. Kemudian ia mendirikan sebuah kota dan menamakannya Al-Mutawakkiliya, mengembangkannya, tinggal di sana, memberikan perkebunan kepada orang-orang di kota tersebut, dan membangunnya di antara Al-Karkh, yang dikenal sebagai Firuz, dan Al-Qatul, yang dikenal sebagai Kisra. Rumah-rumah dan desa yang dikenal sebagai Al-Mahuza termasuk di dalamnya dan ia membangun sebuah masjid berjamaah di sana. Dari awal hingga ia menetap di sana, dibutuhkan waktu berbulan-bulan, dan ia menetap di sana pada awal tahun 246, kemudian ia meninggal di sana pada bulan Syawal tahun 247, dan Al-Muntasir diangkat sebagai penggantinya, sehingga ia pindah dari sana ke Samarra pada hari Selasa, tanggal sepuluh Syawal."
