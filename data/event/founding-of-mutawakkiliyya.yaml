label: { ar: "عمارة بُغا لشمكور وتسميتها المتوكلية", en: "Bugha's Rebuilding of Shamkur as al-Mutawakkiliyya" }
summary:
  ar: "عند البلاذري عن جماعة من أهل برذعة: كانت شمكور مدينة قديمة فوجّه سلمان بن ربيعة الباهلي من فتحها فلم تزل مسكونة معمورة حتى أخربها الساوردية — وهم قوم تجمعوا في أيام انصراف يزيد بن أسيد عن أرمينية فغلظ أمرهم وكثرت نوائبهم — ثم إن بُغا مولى المعتصم بالله عمّرها في سنة 240 وهو والي أرمينية وأذربيجان وشمشاط وأسكنها قوماً خرجوا إليه من الخزر مستأمنين لرغبتهم في الإسلام ونقل إليها التجار من برذعة وسمّاها المتوكلية."
  en: "In al-Baladhuri from a company of Bardha'a's people: Shamkur was an ancient city which Salman ibn Rabi'a al-Bahili's man took, and it stayed peopled and prosperous until the Sawardiyya ruined it — a people who gathered in the days of Yazid ibn Asid's departure from Armenia, whose power hardened and whose raids multiplied; then Bugha, mawla of al-Mu'tasim, rebuilt it in year 240 while governor of Armenia, Adharbayjan and Shimshat, settling in it a people who had come out to him from the Khazars under safe-conduct desiring Islam, transferring to it the merchants of Bardha'a, and naming it al-Mutawakkiliyya."
