label: { ar: "تأسيس المتوكلية", en: "The Founding of al-Mutawakkiliyya" }
summary:
  ar: "عند البلاذري: استخلف المتوكل في ذي الحجة سنة 232 فأقام بالهاروني وبنى بناء كثيراً واقطع الناس في ظهر سر من رأى بالحائر الذي كان المعتصم احتجره قطائع فاتسعوا بها وبنى مسجداً جامعاً وأعظم النفقة عليه وأمر برفع منارته لتعلوا أصوات المؤذنين حتى نظر إليها من فراسخ فجمع الناس فيه وتركوا المسجد الأول ثم أحدث مدينة سماها المتوكلية وعمرها وأقام بها واقطع الناس فيها القطائع وجعلها فيما بين الكرخ المعروف بفيروز وبين القاطول المعروف بكسرى فدخلت الدور والقرية المعروفة بالماحوزة فيها وبنى بها مسجداً جامعاً وكان من ابتدائه إياها إلى أن نزلها أشهر ونزلها في أول سنة 246 ثم توفي بها في شوال سنة 247 واستخلف المنتصر فانتقل عنها إلى سر من رأى يوم الثلاثاء لعشر خلون من شوال."
  en: "In al-Baladhuri: al-Mutawakkil succeeded in Dhu al-Hijja 232, dwelt at al-Haruni and built much; he granted the people qati'as behind Sur man Ra'a in the preserve al-Mu'tasim had walled, and they spread through it; he built a congregational mosque at vast cost and had its minaret raised so the muezzins' voices would carry — visible from parasangs away — gathering the people who left the first mosque. Then he founded a city he named al-Mutawakkiliyya, between Karkh Fayruz and Qatul Kisra, absorbing the hamlet called al-Ma'huza, built its mosque, granted its qati'as and dwelt there in the first of 246 — a few months after founding it — dying there in Shawwal 247; al-Muntasir succeeded that night and moved back to Sur man Ra'a on Tuesday the tenth of Shawwal."
