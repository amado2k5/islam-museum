id: event/persian-rule-of-yemen
class: event
kind: conquest
label: { en: "Liberation and Persian Rule of Yemen", ar: "تحرير اليمن والولاية الفارسية", es: "Liberación y dominio persa de Yemen", fr: "Libération et domination perse du Yémen", ur: "یمن کی آزادی اور فارسی حکمرانی۔" }
summary:
  en: "In 575 the Yemenis under Sayf ibn Dhi Yazan, aided by Persia, expelled the Abyssinians and won independence; but Sayf’s assassination by his own Abyssinian guard ended the royal house, and Khosrow made Yemen a Persian province whose governors ruled until the last, Badhan, embraced Islam in 638."
  ar: "سنة 575م استنجد اليمانيون بالفرس بقيادة معد يكرب سيف بن ذي يزن فأجلوا الأحباش ونالوا الاستقلال واتخذوه ملكاً؛ فاغتاله من أبقاه من الحبشة في ركابه، فانقطع الملك عن بيت ذي يزن وولّى كسرى عاملاً فارسياً على صنعاء، فتعاقب ولاة فارس حتى أسلم آخرهم باذان سنة 638م."
  es: "En 575, los yemeníes, bajo el mando de Sayf ibn Dhi Yazan y con la ayuda de Persia, expulsaron a los abisinios y lograron la independencia; pero el asesinato de Sayf por su propia guardia abisinia puso fin a la dinastía real, y Cosroes convirtió a Yemen en una provincia persa cuyos gobernadores gobernaron hasta que el último, Badhan, abrazó el Islam en 638."
  fr: "En 575, les Yéménites, sous Sayf ibn Dhi Yazan, aidés par la Perse, expulsèrent les Abyssins et obtinrent leur indépendance; mais l'assassinat de Sayf par sa propre garde abyssinienne mit fin à la maison royale, et Khosrow fit du Yémen une province perse dont les gouverneurs régnèrent jusqu'à ce que le dernier, Badhan, embrasse l'islam en 638."
  ur: "575 میں یمنیوں نے سیف بن ذی یزان کے ماتحت، فارس کی مدد سے، حبشیوں کو نکال باہر کیا اور آزادی حاصل کی۔ لیکن سیف کے اپنے ہی حبشی محافظ کے ہاتھوں قتل نے شاہی گھر کو ختم کر دیا، اور خسرو نے یمن کو ایک فارس صوبہ بنا دیا جس کے گورنروں نے آخری وقت تک حکومت کی، بدھان نے 638 میں اسلام قبول کیا۔"
