label: { en: "Liberation and Persian Rule of Yemen", ar: "تحرير اليمن والولاية الفارسية" }
summary:
  en: "In 575 the Yemenis under Sayf ibn Dhi Yazan, aided by Persia, expelled the Abyssinians and won independence; but Sayf’s assassination by his own Abyssinian guard ended the royal house, and Khosrow made Yemen a Persian province whose governors ruled until the last, Badhan, embraced Islam in 638."
  ar: "سنة 575م استنجد اليمانيون بالفرس بقيادة معد يكرب سيف بن ذي يزن فأجلوا الأحباش ونالوا الاستقلال واتخذوه ملكاً؛ فاغتاله من أبقاه من الحبشة في ركابه، فانقطع الملك عن بيت ذي يزن وولّى كسرى عاملاً فارسياً على صنعاء، فتعاقب ولاة فارس حتى أسلم آخرهم باذان سنة 638م."
