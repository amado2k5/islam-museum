label:
  ar: "عودة المقريزي إلى مصر وانقطاعه للتاريخ، نحو ٨٢٠هـ"
  en: "Return to Egypt and full-time scholarship, c. 820/1418"
  ur: "مصر واپسی اور تاریخ کے لیے وقف، تقریباً 820ھ/1418ء"
summary:
  ar: "عاد المقريزي إلى مصر نحو سنة ٨٢٠هـ بعد نحو عشر سنين في دمشق، فانقطع في داره ملازماً للخلوة والعبادة والتصنيف، قلّ أن يتردد لأحد إلا لضرورة، وصار يضرب به المثل في التاريخ في حياته وبعد موته؛ وأقام سنين عدداً بمكة، وسمع فيها من ابن سكر وغيره {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 254-255}."
  en: "After about ten years in Damascus, al-Maqrizi returned to Egypt around 820 and withdrew to his house, keeping to seclusion, worship and writing; he rarely called on anyone except from necessity, and his fame as a historian became proverbial in his lifetime. He also spent a number of years in Mecca, where he heard traditions from Ibn Sakr and others {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 254-255}."
  ur: "دمشق میں تقریباً دس سال کے بعد مقریزی تقریباً 820ھ میں مصر لوٹ آئے اور اپنے گھر میں خلوت، عبادت اور تصنیف میں جُٹ گئے؛ ضرورت کے سوا کسی سے کم ملتے، اور مورخ کے طور پر ان کی شہرت زندگی ہی میں مثال بن گئی۔ انہوں نے مکہ میں بھی کئی برس گزارے اور وہاں ابن سکر وغیرہ سے سماع کیا {cite:encyclopaedia-of-islam-2 vol. 6 p. 213} {cite:shadharat-dhahab p. 254-255}۔"
