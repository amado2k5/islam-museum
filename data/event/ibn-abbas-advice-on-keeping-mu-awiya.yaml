perspectives:
  - tradition: sunni
    id: sunni-author
    summary:
      ar: "يرد الكتاب الروايات لأن أسانيدها واهية، ولأن متنها يخالف روايات أوثق (منها أن معظم الولاة تركوا ولاياتهم وذهبوا إلى مكة)، ولأن الروايات تصوّر المغيرة بالمداهنة وهو ما لا يوافق سيرته، ويرى الكتاب أن تعيين ولاة جدد كان أدعى إلى بيعة الناس {cite:sallabi-ali-vol1 p. 354}{cite:sallabi-ali-vol1 p. 355}."
      en: "The book rejects the reports: their chains are weak, their texts conflict with more reliable reports (most of those governors had left their provinces for Mecca), and they portray al-Mughira as a flatterer, which does not fit his conduct. It holds that appointing new governors better served the people's pledge {cite:sallabi-ali-vol1 p. 354}{cite:sallabi-ali-vol1 p. 355}."
    sources: [source/sallabi-ali-vol1]
  - tradition: academic
    id: academic-view
    summary:
      ar: "يستند الكتاب في الرد إلى كتاب خلافة علي بن أبي طالب لعبد الحميد علي (هوامش ص 353-354)، وإلى الولاية على البلدان، ولم يُنقل في هذا الموضع حكم أكاديمي مغاير بنص مستقل (needs_source) {cite:sallabi-ali-vol1 p. 353}."
      en: "The book's rejection leans on Abd al-Hamid Ali's study of Ali's caliphate and on the book on governorships (footnotes, pp. 353-354); no separate contrary academic verdict is quoted (needs_source) {cite:sallabi-ali-vol1 p. 353}."
    sources: [source/sallabi-ali-vol1]
  - tradition: other
    id: critics-using-the-reports
    summary:
      ar: "يذكر الكتاب أن كتاباً معاصرين اعتمدوا هذه الروايات للطعن في أكابر الصحابة أهل الشورى في دينهم وعدلهم وأمانتهم، ويعدّ الكتاب ذلك خطأً قائماً على أساس واه {cite:sallabi-ali-vol1 p. 354}. وينسب الكتاب إلى بعض القراء أن عزل علي لولاة عثمان كان ضعفاً في الخبرة السياسية، وإلى آخرين أنه صلابة في الحق {cite:sallabi-ali-vol1 p. 355}."
      en: "The book reports that modern writers relied on these reports to impugn the senior Companions of the shura in their religion, justice and trust, which it calls a flawed foundation. It also reports readers who read Ali's dismissals as weakness of political judgement and others who read them as firmness for the truth {cite:sallabi-ali-vol1 p. 354}{cite:sallabi-ali-vol1 p. 355}."
    sources: [source/sallabi-ali-vol1]
