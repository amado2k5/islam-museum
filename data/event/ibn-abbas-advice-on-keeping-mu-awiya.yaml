label: { ar: "روايات مشورة ابن عباس والمغيرة على علي في إبقاء الولاة", en: "Reported advice to Ali by Ibn Abbas and al-Mughira on keeping or removing Uthman's governors" }
summary:
  ar: "يعرض الكتاب روايات تنسب إلى ابن عباس والمغيرة بن شعبة مشورتين متعارضتين على علي بعد بيعته في شأن ولاة عثمان ومعاوية: إقرارهم حتى يبايعوا، ثم عزلهم وتولية طلحة والزبير، فأبى علي إلا العزل. ويرد الكتاب هذه الروايات لضعف أسانيدها واضطراب متونها، ويرى أنها افتراضية لا تنقل الخبر على حقيقته {cite:sallabi-ali-vol1 p. 352}{cite:sallabi-ali-vol1 p. 353}{cite:sallabi-ali-vol1 p. 354}."
  en: "The book sets out reports that give Ibn Abbas and al-Mughira ibn Shu'ba opposing counsel to Ali after his pledge: keep Uthman's governors until they pledge, or remove them and give Basra and Kufa to Talha and al-Zubayr. Ali refused to keep them. The book rejects these reports for weak chains and confused texts and calls them hypothetical {cite:sallabi-ali-vol1 p. 352}{cite:sallabi-ali-vol1 p. 353}{cite:sallabi-ali-vol1 p. 354}."
