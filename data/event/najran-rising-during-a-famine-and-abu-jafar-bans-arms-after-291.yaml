id: "event/najran-rising-during-a-famine-and-abu-jafar-bans-arms-after-291"
class: event
kind: other
label:
  ar: "ثورة بني الحارث بنجران في زمن الحطمة، ومنع أبي جعفر حمل السلاح، بعد 291هـ"
  en: "Banu al-Harith rise at Najran during a famine, and Abu Ja'far imprisons them and bans arms, after 291 AH, p. 374-375"
  ur: "نجران میں قحط کے دوران بنو حارث کی بغاوت، ابو جعفر کی قید اور ہتھیار پر پابندی، 291ھ کے بعد، ص374-375"
summary:
  ar: "وقعت في اليمن مجاعة شديدة عمت البلاد حتى أكل الناس بعضهم بعضاً، فقام أهل الفساد من بني الحارث وثاروا على عامل الهادي إلى الحق بنجران، فشدّ عليهم أبو جعفر، فحبس من أمكنه منهم، ورفعهم إلى صعدة، وحرّم عليهم حمل السلاح من أعلى الوادي إلى أسفله، فسكن الناس وأمنت البلد وخضع أهل الباطل. ولم يكن معه في ذلك الوقت عسكر إلا خدم من همدان."
  en: "A severe famine spread over Yemen until people ate one another. The troublemakers of Banu al-Harith rose against al-Hadi ila al-Haqq's agent at Najran. Abu Ja'far came down hard on them, imprisoned those he could reach, sent them up to Sa'da, and forbade them to carry arms from the top of the valley to the bottom. No one carried arms, the people mixed, the town was secured, and the men of falsehood submitted. He had no army with him at that time except servants from Hamdan."
  ur: "یمن میں ایک سخت قحط پھیل گیا جو ملک بھر میں ایسا تھا کہ لوگ ایک دوسرے کو کھانے لگے۔ اس موقع پر بنو حارث کے فسادی لوگ نجران میں الہادی الی الحق کے عامل کے خلاف اٹھ کھڑے ہوئے۔ ابو جعفر ان پر سختی سے ٹوٹ پڑا، جن تک پہنچ سکا انہیں قید کیا، انہیں صعدہ بھیج دیا، اور انہیں وادی کے بالائی حصے سے نچلے حصے تک ہتھیار اٹھانے سے منع کر دیا۔ کوئی ہتھیار نہ اٹھاتا تھا، لوگ گھل مل گئے، شہر پرامن ہو گیا اور باطل پر چلنے والے جھک گئے۔ اس وقت اس کے ساتھ ہمدان کے خادموں کے سوا کوئی لشکر نہ تھا۔"
