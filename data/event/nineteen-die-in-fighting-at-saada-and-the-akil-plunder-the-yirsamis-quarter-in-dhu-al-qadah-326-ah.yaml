id: "event/nineteen-die-in-fighting-at-saada-and-the-akil-plunder-the-yirsamis-quarter-in-dhu-al-qadah-326-ah"
class: event
kind: other
label:
  ar: "يقتل تسعة عشر رجلا في القتال في صعدة، وينهب الأكيليون شق اليرسميين في ذي القعدة سنة 326هـ، ص413"
  en: "Nineteen men die in fighting at Saada, and the Akil plunder the Yirsamis quarter in Dhu al-Qa'da 326 AH, p. 413"
  ur: "صعدہ میں لڑائی میں انیس آدمی مارے جاتے ہیں اور ذوالقعدہ 326ھ میں اکیلی یرسمیوں کے محلے کو لوٹتے ہیں، ص413"
  es: "Diecinueve hombres mueren en los combates de Saada, y los Akil saquean el barrio de Yirsamis en Dhu al-Qa'da 326 AH, p. 413"
  fr: "Dix-neuf hommes meurent au combat à Saada, et les Akil pillent le quartier de Yirsamis à Dhu al-Qa'da 326 AH, p. 413"
  tr: "Sa'de'deki çatışmalarda on dokuz adam öldürüldü ve Akiliyunlar, Zilhicce 326 Hicri yılında Yarsamiyyin bölgesini yağmaladı (s. 413)."
  id: "Sembilan belas orang tewas dalam pertempuran di Sa'dah, dan Akiliyun menjarah daerah Yarsamiyyin pada Dhu al-Qi'dah 326 H, hlm. 413"
summary:
  ar: "يقع قتال بين الفريقين يقتل فيه تسعة عشر رجلا، ثم يدخل شق اليرسميين يوم الاثنين لخمس من ذي القعدة سنة 326هـ، فيخربه الأكيليون وينتهبونه، ثم ينصرف ابن الضحاك إلى ريدة."
  en: "A battle between the two sides kills nineteen men. On Monday, five days into Dhu al-Qa'da 326 AH, the Akil enter the Yirsamis quarter, wreck it and plunder it. Ibn al-Dahhak then withdraws to Rayda."
  ur: "دونوں فریقوں کی لڑائی میں انیس آدمی مارے جاتے ہیں۔ ذوالقعدہ 326ھ کی پانچ تاریخ کو پیر کے دن اکیلی یرسمیوں کے محلے میں داخل ہو کر اسے برباد اور لوٹ لیتے ہیں، پھر ابن الضحاک ریدہ واپس چلا جاتا ہے۔"
  es: "Una batalla entre ambos bandos deja diecinueve muertos. El lunes, cinco días después del inicio de Dhu al-Qa'da del año 326 de la Hégira, los Akil entran en el barrio de Yirsamis, lo arrasan y lo saquean. Ibn al-Dahhak se retira entonces a Rayda."
  fr: "Un affrontement entre les deux camps fait dix-neuf morts. Le lundi 5 du mois de Dhu al-Qa'da 326 AH, les Akil pénètrent dans le quartier de Yirsamis, le saccagent et le pillent. Ibn al-Dahhak se retire alors à Rayda."
  tr: "İki taraf arasında bir çatışma çıkar ve on dokuz adam öldürülür. Ardından, Hicri 326 yılının Zilhicce ayının beşinci Pazartesi günü, Yarsamiyinler şehre girer ve Akiliyunlar şehri yıkıp yağmalarlar. Daha sonra İbn el-Dahhak Rıza'ya gider."
  id: "Terjadi pertempuran antara kedua pihak yang mengakibatkan tewasnya sembilan belas orang. Kemudian, pada hari Senin, tanggal lima Dzul Qi'dah tahun 326 Hijriah, kaum Yarsamiyin masuk, dan kaum Akiliyun menghancurkan dan menjarahnya. Kemudian Ibnu al-Dahhak berangkat ke Rida."
