label: { ar: "مراد الأول يبني السراي القديم بأدرنة", en: "Murad I builds the Old Palace at Edirne", ur: "مراد اول کا ادرنہ میں پرانا محل تعمیر کرنا", es: "Murad I construye el Palacio Viejo en Edirne.", fr: "Murad Ier fait construire le Vieux Palais d'Edirne", tr: "Murad I, Edirne'de eski sarayı inşa ettirdi.", id: "Murad I membangun istana tua di Edirne" }
summary:
  ar: "وجد مراد الأول قصر التكفور في قلعة أدرنة غير كافٍ بعد الفتح، فبنى قصراً جديداً خارج القلعة انتقل إليه سنة ٧٦٧هـ/١٣٦٥-١٣٦٦م؛ يذكر أوليا جلبي أنه كان قرب جامع السليم في محلة قاواق ميدان، وأنه استُخدم لاحقاً ثكنةً للعجمي أوغلانلار {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  en: "After the conquest Murad I found the tekfür's palace in the citadel inadequate and built a new palace outside the walls, moving into it in 767/1365-6; Evliya Çelebi places it near the Selim mosque in the Kavak Meydanı quarter and says it was later used as barracks for the acemi oğlanları {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  ur: "فتح کے بعد مراد اول نے قلعے میں تکفور کا محل ناکافی پایا اور قلعے سے باہر نیا محل بنوایا جس میں وہ 767ھ/1365-66ء میں منتقل ہوا؛ اولیا چلبی کے مطابق یہ محل جامع سليم کے قریب قاواق میدان محلے میں تھا اور بعد ازاں عجمی اوغلانوں کے برکس کے طور پر استعمال ہوا {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}۔"
  es: "Tras la conquista, Murad I consideró inadecuado el palacio del tekfür en la ciudadela y construyó un nuevo palacio fuera de las murallas, mudándose a él en 767/1365-6; Evliya Çelebi lo sitúa cerca de la mezquita Selim en el barrio de Kavak Meydanı y dice que posteriormente se utilizó como cuartel para los acemi oğlanları {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  fr: "Après la conquête, Murad Ier trouva le palais du tekfür dans la citadelle inadéquat et construisit un nouveau palais à l'extérieur des murs, s'y installant en 767/1365-6; Evliya Çelebi le situe près de la mosquée Selim dans le quartier de Kavak Meydanı et dit qu'il fut plus tard utilisé comme caserne pour les acemi oğlanları {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  tr: "Murad I, fetihten sonra Edirne Kalesi'ndeki Tekfur Sarayı'nı yetersiz bulmuş ve kale dışında yeni bir saray inşa ettirerek 767 Hicri/1365-1366 Miladi yılında oraya taşınmıştır. Evliya Çelebi, bu sarayın Kavak Meydanı semtindeki Selim Camii yakınlarında olduğunu ve daha sonra Acami Oğlanları için kışla olarak kullanıldığını belirtmektedir. {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}"
  id: "Murad I mendapati Istana Tekfur di Kastil Edirne tidak memadai setelah penaklukan, sehingga ia membangun istana baru di luar kastil dan pindah ke sana pada tahun 767 H/1365-1366 M. Evliya Çelebi menyebutkan bahwa istana itu berada di dekat Masjid Selim di lingkungan Kavak Meydan, dan kemudian digunakan sebagai barak untuk Ajami Oğlanlar {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
