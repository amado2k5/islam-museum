label: { ar: "مراد الأول يبني السراي القديم بأدرنة", en: "Murad I builds the Old Palace at Edirne", ur: "مراد اول کا ادرنہ میں پرانا محل تعمیر کرنا" }
summary:
  ar: "وجد مراد الأول قصر التكفور في قلعة أدرنة غير كافٍ بعد الفتح، فبنى قصراً جديداً خارج القلعة انتقل إليه سنة ٧٦٧هـ/١٣٦٥-١٣٦٦م؛ يذكر أوليا جلبي أنه كان قرب جامع السليم في محلة قاواق ميدان، وأنه استُخدم لاحقاً ثكنةً للعجمي أوغلانلار {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  en: "After the conquest Murad I found the tekfür's palace in the citadel inadequate and built a new palace outside the walls, moving into it in 767/1365-6; Evliya Çelebi places it near the Selim mosque in the Kavak Meydanı quarter and says it was later used as barracks for the acemi oğlanları {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  ur: "فتح کے بعد مراد اول نے قلعے میں تکفور کا محل ناکافی پایا اور قلعے سے باہر نیا محل بنوایا جس میں وہ 767ھ/1365-66ء میں منتقل ہوا؛ اولیا چلبی کے مطابق یہ محل جامع سليم کے قریب قاواق میدان محلے میں تھا اور بعد ازاں عجمی اوغلانوں کے برکس کے طور پر استعمال ہوا {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}۔"
