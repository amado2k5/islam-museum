id: event/uqba-zawila-appointment
class: event
kind: conquest
label: { ar: "ولاية عقبة بن نافع على زويلة وما بينها وبرقة", en: "Uqba ibn Nafi's Charge over Zawila and the Marches to Barqa" }
summary:
  ar: "عند البلاذري عن معاوية بن صالح: كتب عمرو بن العاص إلى عمر بن الخطاب يعلمه أنه قد ولّى عقبة بن نافع الفهري المغرب فبلغ زويلة وأن ما بين زويلة وبرقة سلّم كلهم حسنة طاعتهم قد أدّى مسلمهم الصدقة وأقرّ معاهدهم بالجزية وأنه قد وضع على أهل زويلة ومن بينها وبينها ما رأى أنهم يطيقونه، وأمر عماله جميعاً أن يأخذوا الصدقة من الأغنياء فيردّوها في الفقراء ويأخذوا الجزية من الذمة فتُحمل إليه بمصر وأن يؤخذ من أرض المسلمين العشر ونصف العشر ومن أهل الصلح صلحهم."
  en: "In al-Baladhuri on Mu'awiya ibn Salih's report: Amr ibn al-As wrote to Umar ibn al-Khattab that he had given Uqba ibn Nafi' al-Fihri the Maghreb — he had reached Zawila, and all between Zawila and Barqa had submitted in good obedience, their Muslims paying sadaqa and their covenant-holders confirmed in jizya — and that he had laid on Zawila's people and those between it and Barqa what he judged they could bear; and he charged all his agents to take sadaqa from the rich and return it to the poor, to take the jizya of the dhimma borne to him in Egypt, to take tithe and half-tithe from Muslim lands, and the treaty-terms from treaty folk."
