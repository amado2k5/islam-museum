class: event
kind: conquest
label: { ar: "ولاية عقبة بن نافع على زويلة وما بينها وبرقة", en: "Uqba ibn Nafi's Charge over Zawila and the Marches to Barqa", es: "La carga de Uqba ibn Nafi sobre Zawila y las marchas hacia Barqa.", fr: "La charge d'Uqba ibn Nafi sur Zawila et les marches vers Barqa", ur: "عقبہ بن نافع کا ذویلہ اور برقع کی طرف مارچ", tr: "Uqba ibn Nafi'nin Zawila ve Zawila ile Barqa arasındaki bölge üzerindeki valiliği.", id: "Pemerintahan Uqba ibn Nafi atas Zawila dan wilayah antara Zawila dan Barqa." }
summary:
  ar: "عند البلاذري عن معاوية بن صالح: كتب عمرو بن العاص إلى عمر بن الخطاب يعلمه أنه قد ولّى عقبة بن نافع الفهري المغرب فبلغ زويلة وأن ما بين زويلة وبرقة سلّم كلهم حسنة طاعتهم قد أدّى مسلمهم الصدقة وأقرّ معاهدهم بالجزية وأنه قد وضع على أهل زويلة ومن بينها وبينها ما رأى أنهم يطيقونه، وأمر عماله جميعاً أن يأخذوا الصدقة من الأغنياء فيردّوها في الفقراء ويأخذوا الجزية من الذمة فتُحمل إليه بمصر وأن يؤخذ من أرض المسلمين العشر ونصف العشر ومن أهل الصلح صلحهم."
  en: "In al-Baladhuri on Mu'awiya ibn Salih's report: Amr ibn al-As wrote to Umar ibn al-Khattab that he had given Uqba ibn Nafi' al-Fihri the Maghreb — he had reached Zawila, and all between Zawila and Barqa had submitted in good obedience, their Muslims paying sadaqa and their covenant-holders confirmed in jizya — and that he had laid on Zawila's people and those between it and Barqa what he judged they could bear; and he charged all his agents to take sadaqa from the rich and return it to the poor, to take the jizya of the dhimma borne to him in Egypt, to take tithe and half-tithe from Muslim lands, and the treaty-terms from treaty folk."
  es: "En al-Baladhuri sobre el informe de Mu'awiya ibn Salih: Amr ibn al-As escribió a Umar ibn al-Khattab que le había dado a Uqba ibn Nafi' al-Fihri el Magreb —había llegado a Zawila, y todos entre Zawila y Barqa se habían sometido en buena obediencia, sus musulmanes pagando sadaqa y sus titulares de pactos confirmados en jizya— y que había impuesto a la gente de Zawila y a los que estaban entre ella y Barqa lo que juzgó que podían soportar; y encargó a todos sus agentes que tomaran sadaqa de los ricos y se la devolvieran a los pobres, que tomaran la jizya del dhimma que le fue traído en Egipto, que tomaran el diezmo y el medio diezmo de las tierras musulmanas, y los términos del tratado de la gente del tratado."
  fr: "Dans al-Baladhuri, au sujet du rapport de Mu'awiya ibn Salih: Amr ibn al-As écrivit à Umar ibn al-Khattab qu'il avait remis le Maghreb à Uqba ibn Nafi' al-Fihri — qu'il avait atteint Zawila, et que tous les habitants entre Zawila et Barqa s'étaient soumis en toute obéissance, leurs musulmans payant la sadaqa et leurs signataires de traité confirmés dans la jizya — et qu'il avait imposé aux habitants de Zawila et à ceux situés entre elle et Barqa ce qu'il jugeait qu'ils pouvaient supporter; et il chargea tous ses agents de percevoir la sadaqa auprès des riches et de la restituer aux pauvres, de percevoir la jizya de la dhimma qui lui avait été versée en Égypte, de percevoir la dîme et la demi-dîme des terres musulmanes, et les termes du traité auprès des peuples signataires du traité."
  ur: "بلادوری میں معاویہ بن صالح کی روایت پر ہے: عمرو بن العاص نے عمر بن الخطاب کو لکھا کہ اس نے عقبہ بن نافع الفہری کو مغرب دی ہے - وہ ذویلہ پہنچ چکے ہیں، اور ذویلہ اور برقع کے درمیان سب نے اچھی طرح اطاعت کی تھی، ان کے مسلمانوں نے ان کے عقد اور عزاداری کی تصدیق کی تھی۔ کہ اس نے ذویلہ کی قوم اور اس کے درمیان رہنے والوں اور برقع پر جو فیصلہ کیا تھا وہ وہ برداشت کر سکتے تھے۔ اور اس نے اپنے تمام ایجنٹوں کو حکم دیا کہ وہ امیروں سے صدقہ لے کر غریبوں کو واپس کر دیں، مصر میں اس کے ہاں پیدا ہونے والے ذم کا جزیہ لیں، مسلمانوں کی زمینوں سے دسواں اور نصف دسواں حصہ لیں، اور معاہدوں کی شرائط کو عوام سے دیں۔"
  tr: "El-Baladhuri, Muaviye bin Salih'ten rivayetle şöyle aktarmıştır: Amr bin el-Aas, Ömer bin el-Hattab'a yazdığı mektupta, Ukbe bin Nafi el-Fihri'yi Mağrip'e atadığını, Zavila'ya ulaştığını, Zavila ile Barka arasındaki herkesin teslim olduğunu, itaatlerinin iyi olduğunu, Müslümanların zekâtı ödediğini ve antlaşmalarının cizye ile onaylandığını, Zavila halkına ve aralarındakilere taşıyabilecekleri yükü yüklediğini, tüm temsilcilerine zenginlerden zekâtı alıp fakirlere geri vermelerini, zimmilerden cizyeyi alıp Mısır'a getirmelerini, Müslümanların topraklarından zekâtın yarısını ve barış antlaşması yapanlardan da barış antlaşmalarını almalarını emrettiğini bildirmiştir."
  id: "Al-Baladhuri meriwayatkan dari Muawiyah bin Salih: Amr bin Al-Aas menulis kepada Umar bin Al-Khattab memberitahukannya bahwa ia telah menunjuk Uqbah bin Nafi Al-Fihri ke Maghreb, dan bahwa ia telah sampai di Zawila, dan bahwa semua orang di antara Zawila dan Barqa telah menyerah, dan bahwa ketaatan mereka baik, dan bahwa kaum Muslim mereka telah membayar zakat dan perjanjian mereka telah dikonfirmasi dengan jizya, dan bahwa ia telah mengenakan kepada penduduk Zawila dan orang-orang di antara keduanya apa yang menurutnya mampu mereka tanggung, dan ia memerintahkan semua agennya untuk mengambil zakat dari orang kaya dan mengembalikannya kepada orang miskin, dan untuk mengambil jizya dari kaum dhimmi dan membawanya kepadanya di Mesir, dan untuk mengambil dari tanah kaum Muslim zakat dan setengah zakat, dan dari orang-orang yang terikat perjanjian damai perjanjian damai mereka."
