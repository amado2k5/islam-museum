label: { ar: "سقوط دمياط بيد الفرنج سنة 647هـ" }
summary:
  ar: "في ربيع الأول سنة سبع وأربعين وست مئة نازلت الفرنج دمياط براً وبحراً وكان بها فخر الدين ابن الشيخ وعسكر فتربوا وملكها الفرنج بلا ضربة ولا طعنة وكان السلطان الملك الصالح نجم الدين أيوب على المنصورة فغضب على أهلها لتركهم إياها حتى شنق ستين نفساً من أعيان أهلها وقامت قيامته على العسكر حتى تخوفوه وهموا به فقال فخر الدين أمهلوه فهو على شفا فمات ليلة نصف شعبان وكتم موته أياماً وساق مملوكه أقطاي على البرية إلى حصن كيفا وأخذ الملك المعظم توران شاه ولد الصالح وقدم به، وجرت للمصريين مع الفرنج فصول وحروب إلى أن تمت وقعة المنصورة في ذي القعدة وذلك أن الفرنج حملوا ووصلوا إلى دهليز السلطان فركب مقدم الجيش فخر الدين ابن الشيخ وقاتل فقتل وانهزم المسلمون ثم كروا على الفرنج ونزل النصر وقتل من الفرنج مقتلة عظيمة {cite:shadharat-dhahab p. 245-246}."
  en: "In Rabi' I 647 the Franks invested Damietta by land and sea — the garrison panicked and the city fell without a blow; the dying sultan al-Salih Najm al-Din hanged sixty of its notables, his death was concealed while his mamluk Aqtay raced to fetch Turanshah from Hisn Kayfa, and in Dhu l-Qa'da the Franks reached the sultan's vestibule at Mansura, killed Fakhr al-Din, routed the Muslims — then the Muslims rallied and slaughtered them {cite:shadharat-dhahab p. 245-246}."
