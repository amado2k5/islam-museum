label: { ar: "سقوط دمياط بيد الفرنج سنة 647هـ", en: "The Fall of Damietta to the Franks, 647 AH", es: "La caída de Damietta en manos de los francos, 647 d. C.", fr: "La chute de Damiette aux mains des Francs, 647 AH", ur: "فرانکس کے لیے دمیتا کا زوال، 647ھ", tr: "Hicri 647 yılında Damietta'nın Franklar tarafından ele geçirilmesi.", id: "Jatuhnya Damietta ke tangan bangsa Frank pada tahun 647 AH" }
summary:
  ar: "في ربيع الأول سنة سبع وأربعين وست مئة نازلت الفرنج دمياط براً وبحراً وكان بها فخر الدين ابن الشيخ وعسكر فتربوا وملكها الفرنج بلا ضربة ولا طعنة وكان السلطان الملك الصالح نجم الدين أيوب على المنصورة فغضب على أهلها لتركهم إياها حتى شنق ستين نفساً من أعيان أهلها وقامت قيامته على العسكر حتى تخوفوه وهموا به فقال فخر الدين أمهلوه فهو على شفا فمات ليلة نصف شعبان وكتم موته أياماً وساق مملوكه أقطاي على البرية إلى حصن كيفا وأخذ الملك المعظم توران شاه ولد الصالح وقدم به، وجرت للمصريين مع الفرنج فصول وحروب إلى أن تمت وقعة المنصورة في ذي القعدة وذلك أن الفرنج حملوا ووصلوا إلى دهليز السلطان فركب مقدم الجيش فخر الدين ابن الشيخ وقاتل فقتل وانهزم المسلمون ثم كروا على الفرنج ونزل النصر وقتل من الفرنج مقتلة عظيمة {cite:shadharat-dhahab p. 245-246}."
  en: "In Rabi' I 647 the Franks invested Damietta by land and sea — the garrison panicked and the city fell without a blow; the dying sultan al-Salih Najm al-Din hanged sixty of its notables, his death was concealed while his mamluk Aqtay raced to fetch Turanshah from Hisn Kayfa, and in Dhu l-Qa'da the Franks reached the sultan's vestibule at Mansura, killed Fakhr al-Din, routed the Muslims — then the Muslims rallied and slaughtered them {cite:shadharat-dhahab p. 245-246}."
  es: "En Rabi' I 647, los francos sitiaron Damietta por tierra y mar; la guarnición entró en pánico y la ciudad cayó sin un solo golpe; el moribundo sultán al-Salih Najm al-Din ahorcó a sesenta de sus notables, su muerte fue ocultada mientras su mameluco Aqtay corría a buscar a Turanshah desde Hisn Kayfa, y en Dhu l-Qa'da los francos llegaron al vestíbulo del sultán en Mansura, mataron a Fakhr al-Din, derrotaron a los musulmanes; luego los musulmanes se reagruparon y los masacraron {cite:shadharat-dhahab p. 245-246}."
  fr: "En Rabi' I 647, les Francs investirent Damiette par terre et par mer — la garnison paniqua et la ville tomba sans coup; le sultan mourant al-Salih Najm al-Din fit pendre soixante de ses notables, sa mort fut dissimulée tandis que son mamelouk Aqtay se précipitait pour aller chercher Turanshah à Hisn Kayfa, et en Dhu l-Qa'da, les Francs atteignirent le vestibule du sultan à Mansura, tuèrent Fakhr al-Din, mirent en déroute les musulmans — puis les musulmans se rallièrent et les massacrèrent {cite:shadharat-dhahab p. 245-246}."
  ur: "ربیع اول 647 میں فرینکوں نے ڈیمیٹا کو زمینی اور سمندری راستے سے لگایا - گیریژن گھبرا گیا اور شہر بغیر کسی ضرب کے گر گیا۔ مرنے والے سلطان الصالح نجم الدین نے اپنے ساٹھ معززین کو پھانسی پر لٹکا دیا، اس کی موت کو پوشیدہ رکھا گیا جب کہ اس کے مملوک عقطے نے حسن کیفہ سے تورانشاہ لانے کے لیے دوڑ لگا دی، اور ذوالقعدہ میں فرانکس منصورہ میں سلطان کے مقبرے پر پہنچے، پھر مسلمانوں کو قتل کر دیا، اور فتح الدین نے مسلمانوں کو قتل کر دیا۔ ان کو ذبح کر دیا 245-246}۔"
  tr: "Hicri 647 yılının baharında Franklar, Dimyat'ı karadan ve denizden kuşattılar. Fahreddin ibn Şeyh ve ordusu oradaydı ve yenildiler. Franklar, tek bir darbe veya bıçak darbesi indirmeden şehri ele geçirdiler. Sultan el-Malik el-Salih Necm el-Din Eyyub, Mansur'daydı ve şehri terk eden halka çok kızdı. Altmış ileri gelenini astırdı ve orduya o kadar öfkelendi ki, ondan korkup ona karşı komplo kurdular. Fahreddin, \"Ona zaman verin, çünkü ölümün eşiğinde\" dedi. Şaban ayının ortasındaki bir gecede öldü ve ölümü birkaç gün gizli tutuldu. Memlük Aktay'ını çölün karşısına, Hisn Kayfa'ya gönderdi ve el-Salih'in oğlu el-Malik el-Mu'azzam Turan Şah'ı yanına alıp geri getirdi. Mısırlılar, Zülkade'de gerçekleşen el-Mansur Muharebesi'ne kadar Franklarla birçok savaş ve sefer yaptı. Franklar hücuma geçti ve Sultan'ın sarayına ulaştı. Ordu komutanı Fahreddin ibn Şeyh atıyla çıktı ve savaştı, ancak öldürüldü ve Müslümanlar yenildi. Ardından Franklara saldırdılar ve zafer kazandılar, Franklar büyük bir katliama uğradı. {cite:shadharat-dhahab s. 245-246}"
  id: "Pada musim semi tahun 647 H, bangsa Frank mengepung Damietta melalui darat dan laut. Fakhr al-Din ibn al-Sheikh dan pasukannya berada di sana, dan mereka dikalahkan. Bangsa Frank merebutnya tanpa perlawanan berarti. Sultan al-Malik al-Salih Najm al-Din Ayyub berada di al-Mansura, dan ia marah kepada penduduknya karena meninggalkannya. Ia menggantung enam puluh tokoh penting, dan ia sangat marah kepada pasukannya hingga mereka takut kepadanya dan bersekongkol melawannya. Fakhr al-Din berkata, “Beri dia waktu, karena dia berada di ambang kehancuran.” Ia meninggal pada malam pertengahan bulan Sya'ban, dan kematiannya dirahasiakan selama beberapa hari. Ia mengirim Mamluknya, Aqtai, menyeberangi gurun ke Hisn Kayfa, dan ia membawa al-Malik al-Mu'azzam Turan Shah, putra al-Salih, dan membawanya kembali. Orang Mesir telah beberapa kali berperang dan melakukan kampanye militer melawan bangsa Frank hingga Pertempuran al-Mansura terjadi di Dhu al-Qa’dah. Bangsa Frank menyerang dan mencapai istana Sultan. Komandan pasukan, Fakhr al-Din ibn al-Sheikh, maju dan bertempur, tetapi ia terbunuh, dan kaum Muslim dikalahkan. Kemudian mereka menyerang bangsa Frank, dan kemenangan pun diraih, dan pembantaian besar-besaran terhadap bangsa Frank terjadi. {cite:shadharat-dhahab p. 245-246}"
