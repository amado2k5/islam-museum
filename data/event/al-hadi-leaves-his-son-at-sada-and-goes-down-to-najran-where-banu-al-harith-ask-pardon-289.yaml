id: event/al-hadi-leaves-his-son-at-sada-and-goes-down-to-najran-where-banu-al-harith-ask-pardon-289
class: event
kind: other
label:
  ar: "استخلاف الهادي ابنه بصعدة ونزوله نجران وصفحه عن بني الحارث، جمادى الآخرة 289هـ"
  en: "Al-Hadi leaves his son at Sa'da and goes down to Najran, where Banu al-Harith ask pardon, Jumada II 289 AH"
  ur: "ہادی کا بیٹے کو صعدہ میں چھوڑنا اور نجران اترنا جہاں بنو حارث معافی مانگتے ہیں، جمادی الآخرہ 289ھ"
summary:
  ar: "لما وصل الهادي إلى صعدة في أيام باقية من جمادى الآخرة سنة 289هـ خلّف ابنه أبا القاسم والياً بصعدة وانحدر إلى نجران فلقيه محمد بن عبيد الله وولده وجماعة من همدان قرب الحصن، فلما علمت بنو الحارث بقدومه خافوا فوجهوا إليه جماعة وسألوه الصفح فأجابهم ووهب لهم ما أخذوا من الجباية على أن يدفعوا إلى الناس حقوقهم، ثم دخل قرية الهجر فأقام بها أياماً."
  en: "When al-Hadi reached Sa'da in the last days of Jumada II 289 AH he left his son Abu al-Qasim as governor of Sa'da and went down to Najran, where Muhammad ibn Ubaydallah, his son and a party of Hamdan met him near al-Hisn; Banu al-Harith, hearing of his arrival, were afraid and sent a party asking pardon; he agreed and gave up what they had taken of the levy on condition that they pay the people their dues, then entered the village of al-Hajar and stayed some days."
  ur: "جب ہادی جمادی الآخرہ 289ھ کے آخری دنوں میں صعدہ پہنچے تو انہوں نے اپنے بیٹے ابو القاسم کو صعدہ کا حاکم بنا کر چھوڑا اور نجران کی طرف اترے جہاں محمد بن عبید اللہ، ان کا بیٹا اور ہمدان کی ایک جماعت حصن کے قریب ان سے ملے؛ بنو حارث نے ان کے آنے کا سنا تو ڈر کر ایک جماعت بھیجی اور معافی مانگی؛ انہوں نے مان لیا اور جو محصول وہ لے چکے تھے وہ انہیں بخش دیا بشرطیکہ وہ لوگوں کے حق ادا کریں، پھر بستی ہجر میں چند دن ٹھہرے۔"
