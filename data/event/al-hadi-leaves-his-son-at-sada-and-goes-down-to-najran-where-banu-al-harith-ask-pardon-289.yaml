id: event/al-hadi-leaves-his-son-at-sada-and-goes-down-to-najran-where-banu-al-harith-ask-pardon-289
class: event
kind: other
label:
  ar: "استخلاف الهادي ابنه بصعدة ونزوله نجران وصفحه عن بني الحارث، جمادى الآخرة 289هـ"
  en: "Al-Hadi leaves his son at Sa'da and goes down to Najran, where Banu al-Harith ask pardon, Jumada II 289 AH"
  ur: "ہادی کا بیٹے کو صعدہ میں چھوڑنا اور نجران اترنا جہاں بنو حارث معافی مانگتے ہیں، جمادی الآخرہ 289ھ"
  es: "Al-Hadi deja a su hijo en Sa'da y desciende a Najrán, donde los Banu al-Harith piden perdón, Jumada II 289 AH."
  fr: "Al-Hadi laisse son fils à Sa'da et descend à Najran, où les Banu al-Harith implorent son pardon (Jumada II 289 AH)."
  tr: "El-Hadi, oğlunu Sa'de'de halefi olarak atadı ve Necran'a inerek Beni el-Harith'i affetti (Hicri 289 Cemâdî el-Ahiret)."
  id: "Al-Hadi mengangkat putranya sebagai penggantinya di Sa'dah, dan dia pergi ke Najran dan mengampuni Bani al-Harith, Jumada al-Akhirah 289 H."
summary:
  ar: "لما وصل الهادي إلى صعدة في أيام باقية من جمادى الآخرة سنة 289هـ خلّف ابنه أبا القاسم والياً بصعدة وانحدر إلى نجران فلقيه محمد بن عبيد الله وولده وجماعة من همدان قرب الحصن، فلما علمت بنو الحارث بقدومه خافوا فوجهوا إليه جماعة وسألوه الصفح فأجابهم ووهب لهم ما أخذوا من الجباية على أن يدفعوا إلى الناس حقوقهم، ثم دخل قرية الهجر فأقام بها أياماً."
  en: "When al-Hadi reached Sa'da in the last days of Jumada II 289 AH he left his son Abu al-Qasim as governor of Sa'da and went down to Najran, where Muhammad ibn Ubaydallah, his son and a party of Hamdan met him near al-Hisn; Banu al-Harith, hearing of his arrival, were afraid and sent a party asking pardon; he agreed and gave up what they had taken of the levy on condition that they pay the people their dues, then entered the village of al-Hajar and stayed some days."
  ur: "جب ہادی جمادی الآخرہ 289ھ کے آخری دنوں میں صعدہ پہنچے تو انہوں نے اپنے بیٹے ابو القاسم کو صعدہ کا حاکم بنا کر چھوڑا اور نجران کی طرف اترے جہاں محمد بن عبید اللہ، ان کا بیٹا اور ہمدان کی ایک جماعت حصن کے قریب ان سے ملے؛ بنو حارث نے ان کے آنے کا سنا تو ڈر کر ایک جماعت بھیجی اور معافی مانگی؛ انہوں نے مان لیا اور جو محصول وہ لے چکے تھے وہ انہیں بخش دیا بشرطیکہ وہ لوگوں کے حق ادا کریں، پھر بستی ہجر میں چند دن ٹھہرے۔"
  es: "Cuando al-Hadi llegó a Sa'da en los últimos días de Jumada II 289 AH, dejó a su hijo Abu al-Qasim como gobernador de Sa'da y bajó a Najran, donde Muhammad ibn Ubaydallah, su hijo y un grupo de Hamdan lo recibieron cerca de al-Hisn; los Banu al-Harith, al enterarse de su llegada, se asustaron y enviaron un grupo pidiendo perdón; él accedió y devolvió lo que habían tomado del impuesto con la condición de que pagaran a la gente lo que les correspondía, luego entró en la aldea de al-Hajar y permaneció allí algunos días."
  fr: "Lorsque al-Hadi atteignit Sa'da dans les derniers jours de Jumada II 289 AH, il laissa son fils Abu al-Qasim comme gouverneur de Sa'da et descendit à Najran, où Muhammad ibn Ubaydallah, son fils et un groupe de Hamdan le rencontrèrent près d'al-Hisn; les Banu al-Harith, apprenant son arrivée, furent effrayés et envoyèrent un groupe demander pardon; il accepta et leur renonça à ce qu'ils avaient pris sur la levée à condition qu'ils paient les sommes dues au peuple, puis entra dans le village d'al-Hajar et y séjourna quelques jours."
  tr: "Hicri 289 yılında Cemâde-i Ahiret'in son günlerinde El-Hadi Sa'de'ye vardığında, oğlu Ebu el-Kâsım'ı Sa'de valisi olarak bırakıp Necran'a indi. Oğlu Muhammed bin Ubeydullah ve Hamdan'dan bir grup onu kale yakınlarında karşıladı. Beni el-Harith onun gelişini öğrenince korktular ve ona bir grup göndererek af dilediler. O da onlara cevap verdi ve vergilerden aldıkları parayı, halkın haklarını ödemeleri şartıyla onlara verdi. Sonra El-Hacer köyüne girdi ve orada birkaç gün kaldı."
  id: "Ketika Al-Hadi tiba di Sa'dah pada hari-hari terakhir Jumada al-Akhirah tahun 289 H, ia meninggalkan putranya Abu al-Qasim sebagai gubernur Sa'dah dan pergi ke Najran. Muhammad bin Ubaid Allah, putranya, dan sekelompok orang dari Hamdan menemuinya di dekat benteng. Ketika Bani al-Harith mengetahui kedatangannya, mereka takut, sehingga mereka mengirim sekelompok orang kepadanya dan meminta ampunan. Ia mengabulkan permintaan mereka dan memberi mereka kembali apa yang telah mereka ambil dari pajak dengan syarat mereka membayar hak-hak rakyat. Kemudian ia memasuki desa Al-Hajar dan tinggal di sana selama beberapa hari."
