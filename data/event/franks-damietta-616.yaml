label: { ar: "أخذ الفرنج دمياط وبناء المنصورة" }
summary:
  ar: "في سنة خمس عشرة وست مئة أخذت الفرنج من دمياط برج السلسلة وقال أبو شامة وهذا البرج كان قفل الديار المصرية وهو برج عال في وسط النيل وفي ناحيته سلسلتان تمتد إحداهما على النيل إلى دمياط والأخرى إلى الجيزة يمنعان عبور المراكب من البحر المالح، وفي سنة ست عشرة أخذت الفرنج دمياط بعد حروب ومحاصرات وضعف الملك الكامل عن مقاومتهم فبدعوا فيها وجعلوا الجامع كنيسة فابتنى الملك الكامل مدينة عند مفرق البحرين وسماها المنصورة وبنى عليها سوراً ونزلها بجيشه {cite:tarikh-khulafa-minhaj-1434 p. 696}. وفي شذرات الذهب خرجت الفرنج من دمياط بالفارس والراجل أيام زيادة النيل فنزلوا على ترعة فبثق المسلمون عليها النيل فلم يبلهم وصول إلى دمياط ولا جاء الأسطول فأخذوا مراكب الفرنج وكانوا مائة ألف منهم ثمانمائة فارس فيهم صاحب عكا وخلق من الرجالة فلما عاينوا الخذلان تطلبوا الصلح على أن يسلموا دمياط إلى الكامل فأجابهم ثم جاءه أخواه بالعساكر في رجب فعمل سماطاً عظيماً وأحضر ملوك الفرنج وأنعم عليهم ووقف في خدمته المعظم والأشرف وكان يوماً مشهوداً وقام راجح الحلبي فأنشد قصيدة منها أعباد عيسى إن عيسى وحزبه وموسى جميعاً ينصران محمداً وأشار إلى الإخوة الثلاثة {cite:shadharat-dhahab p. 79}. وعند ابن الأثير أن الفرنج قاتلوا البرج أربعة أشهر حتى ملكوه فقطعوا السلاسل فنصب الملك جسراً عظيماً حتى قطعوه فأغرق الكامل مراكب كباراً في النيل فحفر الفرنج خليجاً يعرف بالأزرق كان النيل يجري عليه قديماً وأصعدوا مراكبهم فيه إلى بورة، واتفق أن اتفق أمير الأمراء بمصر عماد الدين ابن المشطوب الهكاري مع أمراء على خلع الملك الكامل وتمليك أخيه الفائز فبلغ الكامل الخبر ففارق المنزلة ليلاً جريدة إلى قرية شمعون طناح ففقد العسكر سلطانهم فركب كل إنسان هواه وتركوا الميرة والسلاح والدواب والخيام، فأصبح الفرنج لا يرون أحداً فعبروا النيل العشرين من ذي القعدة سنة خمس عشرة آمنين بغير منازع وغنموا ما في عسكر المسلمين، فاتفق من لطف الله أن الملك المعظم عيسى وصل إلى أخيه الكامل بعد الحركة بيومين فثبت وأخرجوا ابن المشطوب إلى الشام فلحق بالملك الأشرف، واجتمعت العرب على اختلاف قبائلها فنهبت البلاد المجاورة وقطعت الطريق فكانت أشد على المسلمين من الفرنج، ولم يكن بدمياط أحد من العسكر فأحاط بها الفرنج وداموا القتال مناوبة والبلد يصبر صبراً لم يسمع بمثله حتى عجز الباقون لقلتهم فسلموها بالأمان في السابع والعشرين من شعبان سنة ست عشرة وستمائة {cite:kamil-ibn-al-athir p. 376-377}."
  en: "In 615 the Franks took Damietta's chain-tower — 'the lock of Egypt's lands', says Abu Shama, a tall tower mid-Nile with two chains barring the salt sea to ships. The next year they took Damietta itself after sieges — al-Kamil too weak to resist — made its mosque a church, while he founded al-Mansura at the seas' fork and camped his army there {cite:tarikh-khulafa-minhaj-1434 p. 696}."
