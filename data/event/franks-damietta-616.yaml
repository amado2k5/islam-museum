label: { ar: "أخذ الفرنج دمياط وبناء المنصورة" }
summary:
  ar: "في سنة خمس عشرة وست مئة أخذت الفرنج من دمياط برج السلسلة وقال أبو شامة وهذا البرج كان قفل الديار المصرية وهو برج عال في وسط النيل وفي ناحيته سلسلتان تمتد إحداهما على النيل إلى دمياط والأخرى إلى الجيزة يمنعان عبور المراكب من البحر المالح، وفي سنة ست عشرة أخذت الفرنج دمياط بعد حروب ومحاصرات وضعف الملك الكامل عن مقاومتهم فبدعوا فيها وجعلوا الجامع كنيسة فابتنى الملك الكامل مدينة عند مفرق البحرين وسماها المنصورة وبنى عليها سوراً ونزلها بجيشه {cite:tarikh-khulafa-minhaj-1434 p. 696}."
  en: "In 615 the Franks took Damietta's chain-tower — 'the lock of Egypt's lands', says Abu Shama, a tall tower mid-Nile with two chains barring the salt sea to ships. The next year they took Damietta itself after sieges — al-Kamil too weak to resist — made its mosque a church, while he founded al-Mansura at the seas' fork and camped his army there {cite:tarikh-khulafa-minhaj-1434 p. 696}."
