label: { ar: "أخذ الفرنج دمياط وبناء المنصورة", en: "The Franks Take Damietta and the Founding of al-Mansura", ur: "فرنگیوں کا دمیاط پر قبضہ اور منصورہ کی تعمیر", es: "Los francos toman Damietta y la fundación de al-Mansura.", fr: "La prise de Damiette par les Francs et la fondation d'al-Mansoura", tr: "Franklar Damietta'yı ele geçirdiler ve Mansoura'yı inşa ettiler.", id: "Bangsa Frank merebut Damietta dan membangun Mansoura." }
summary:
  ar: "في سنة خمس عشرة وست مئة أخذت الفرنج من دمياط برج السلسلة وقال أبو شامة وهذا البرج كان قفل الديار المصرية وهو برج عال في وسط النيل وفي ناحيته سلسلتان تمتد إحداهما على النيل إلى دمياط والأخرى إلى الجيزة يمنعان عبور المراكب من البحر المالح، وفي سنة ست عشرة أخذت الفرنج دمياط بعد حروب ومحاصرات وضعف الملك الكامل عن مقاومتهم فبدعوا فيها وجعلوا الجامع كنيسة فابتنى الملك الكامل مدينة عند مفرق البحرين وسماها المنصورة وبنى عليها سوراً ونزلها بجيشه {cite:tarikh-khulafa-minhaj-1434 p. 696}. وفي شذرات الذهب خرجت الفرنج من دمياط بالفارس والراجل أيام زيادة النيل فنزلوا على ترعة فبثق المسلمون عليها النيل فلم يبلهم وصول إلى دمياط ولا جاء الأسطول فأخذوا مراكب الفرنج وكانوا مائة ألف منهم ثمانمائة فارس فيهم صاحب عكا وخلق من الرجالة فلما عاينوا الخذلان تطلبوا الصلح على أن يسلموا دمياط إلى الكامل فأجابهم ثم جاءه أخواه بالعساكر في رجب فعمل سماطاً عظيماً وأحضر ملوك الفرنج وأنعم عليهم ووقف في خدمته المعظم والأشرف وكان يوماً مشهوداً وقام راجح الحلبي فأنشد قصيدة منها أعباد عيسى إن عيسى وحزبه وموسى جميعاً ينصران محمداً وأشار إلى الإخوة الثلاثة {cite:shadharat-dhahab p. 79}. وعند ابن الأثير أن الفرنج قاتلوا البرج أربعة أشهر حتى ملكوه فقطعوا السلاسل فنصب الملك جسراً عظيماً حتى قطعوه فأغرق الكامل مراكب كباراً في النيل فحفر الفرنج خليجاً يعرف بالأزرق كان النيل يجري عليه قديماً وأصعدوا مراكبهم فيه إلى بورة، واتفق أن اتفق أمير الأمراء بمصر عماد الدين ابن المشطوب الهكاري مع أمراء على خلع الملك الكامل وتمليك أخيه الفائز فبلغ الكامل الخبر ففارق المنزلة ليلاً جريدة إلى قرية شمعون طناح ففقد العسكر سلطانهم فركب كل إنسان هواه وتركوا الميرة والسلاح والدواب والخيام، فأصبح الفرنج لا يرون أحداً فعبروا النيل العشرين من ذي القعدة سنة خمس عشرة آمنين بغير منازع وغنموا ما في عسكر المسلمين، فاتفق من لطف الله أن الملك المعظم عيسى وصل إلى أخيه الكامل بعد الحركة بيومين فثبت وأخرجوا ابن المشطوب إلى الشام فلحق بالملك الأشرف، واجتمعت العرب على اختلاف قبائلها فنهبت البلاد المجاورة وقطعت الطريق فكانت أشد على المسلمين من الفرنج، ولم يكن بدمياط أحد من العسكر فأحاط بها الفرنج وداموا القتال مناوبة والبلد يصبر صبراً لم يسمع بمثله حتى عجز الباقون لقلتهم فسلموها بالأمان في السابع والعشرين من شعبان سنة ست عشرة وستمائة {cite:kamil-ibn-al-athir p. 376-377}."
  en: "In 615 the Franks took Damietta's chain-tower — 'the lock of Egypt's lands', says Abu Shama, a tall tower mid-Nile with two chains barring the salt sea to ships. The next year they took Damietta itself after sieges — al-Kamil too weak to resist — made its mosque a church, while he founded al-Mansura at the seas' fork and camped his army there {cite:tarikh-khulafa-minhaj-1434 p. 696}."
  es: "En 615, los francos tomaron la torre de cadenas de Damietta, «el candado de las tierras de Egipto», según Abu Shama, una alta torre en medio del Nilo con dos cadenas que impedían el paso de los barcos al mar. Al año siguiente, tomaron la propia Damietta tras asedios —al-Kamil, demasiado débil para resistir—, convirtió su mezquita en iglesia, mientras que fundó al-Mansura en la confluencia de los mares y acampó allí con su ejército {cite:tarikh-khulafa-minhaj-1434 p. 696}."
  fr: "En 615, les Francs s'emparèrent de la tour de Damiette, « l'écluse des terres d'Égypte », selon Abou Shama. Cette haute tour, située au milieu du Nil, était fermée à la navigation par deux chaînes qui empêchaient les navires d'accéder à la mer. L'année suivante, après plusieurs sièges, ils prirent Damiette elle-même. Al-Kamil, trop faible pour résister, transforma sa mosquée en église et fonda al-Mansoura au confluent des deux mers, où il installa son camp militaire (voir: Tarikh Khulafa Minhaj, 1434, p. 696)."
  ur: "615 میں فرینکوں نے ڈیمیٹا کے چین ٹاور پر قبضہ کر لیا - 'مصر کی سرزمینوں کا تالا'، ابو شامہ کہتے ہیں، نیل کے وسط میں ایک اونچا ٹاور جس میں دو زنجیریں تھیں جو نمکین سمندر کو بحری جہازوں تک پہنچاتی تھیں۔ اگلے سال انہوں نے محاصروں کے بعد دمیٹا کو خود لے لیا - الکامل مزاحمت کرنے میں بہت کمزور تھا - اس کی مسجد کو چرچ بنا دیا، جب کہ اس نے سمندر کے کنارے پر المنصورہ کی بنیاد رکھی اور وہاں اپنی فوج کو خیمہ لگایا۔ 696}۔"
  tr: "Hicri 615 yılında Franklar, Dimyat'tan Zincir Kulesi'ni aldılar. Ebu Şama şöyle dedi: “Bu kule, Mısır topraklarının kilidiydi. Nil'in ortasında yüksek bir kuledir ve yanlarında iki zincir vardır; bunlardan biri Nil'i geçerek Dimyat'a, diğeri Giza'ya uzanır ve tuzlu denizden gelen gemilerin geçişini engeller.” Hicri 616 yılında Franklar, savaşlar ve kuşatmalardan sonra Dimyat'ı ele geçirdiler ve Kral Kamil onlara karşı koyamayacak kadar güçsüzdü. Şehirde yenilikler yaparak camiyi kiliseye çevirdiler. Bunun üzerine Kral Kamil, iki denizin kavşağında bir şehir inşa etti ve ona El-Mansur adını verdi. Şehrin üzerine bir sur ördü ve ordusuyla oraya yerleşti. {cite:tarikh-khulafa-minhaj-1434 s. 696} Şadharat el-Dhahab'da, Nil'in yükselişi sırasında Frankların süvariler ve piyadelerle Dimyat'tan ayrıldığı belirtilmektedir. Bir kanala indiler ve Müslümanlar Nil'i onlara karşı yarıp geçtiler. Dimyat'a ulaşamadılar, filo da gelmedi. Frankların gemilerini ele geçirdiler; sayıları yüz bine ulaştı, aralarında Akka hükümdarı da bulunan sekiz yüz süvari ve çok sayıda piyade vardı. Yenilgiyi görünce, Dimyat'ı el-Kamil'e teslim etmeleri şartıyla barış istediler. El-Kamil onları kabul etti. Sonra iki kardeşi Receb ayında askerleriyle birlikte yanına geldi. Büyük bir ziyafet hazırladı, Frank krallarını davet etti ve onlara hediyeler verdi. El-Mu'azzam ve el-Eşref onun hizmetindeydi. Unutulmaz bir gündü. Recih el-Halabi ayağa kalktı ve bir şiir okudu, şiirde şöyle yazıyordu: \"Ey İsa'nın kulları, İsa, maiyeti ve Musa, hepsi Muhammed'i destekler.\" Üç kardeşi işaret etti. {kaynak: Şadharat-dhahab s. 79} İbn el-Athir'e göre, Franklar kuleyi ele geçirene kadar dört ay boyunca savaştılar. Zincirleri kestiler, bunun üzerine kral büyük bir köprü inşa etti, ancak onu da kestiler. Bunun üzerine El-Kamil, Nil'de büyük gemileri batırdı. Franklar, Nil'in uzun zamandır üzerinden aktığı Mavi Kanal olarak bilinen bir kanal kazdılar ve gemilerini Bura'ya getirdiler. Tesadüfen, Mısır'daki Emirler Emiri İmadeddin ibn Meştub el-Hakkari, Kral El-Kamil'i tahttan indirmek ve yerine kardeşi Faiz'i kral yapmak için diğer emirlerle komplo kurdu. El-Kamil bunu öğrenince geceleyin El-Manzala'dan ayrılıp Şamun Tanah köyüne doğru yola çıktı. Ordu otoritesini kaybetti ve her adam kendi isteğine göre hareket ederek erzaklarını, silahlarını, hayvanlarını ve çadırlarını terk etti. Ertesi sabah Franklar kimseyi görmediler ve Hicri 15 yılının Zilhicce ayının yirminci gününde, hiçbir engelle karşılaşmadan Nil'i geçerek Müslüman ordusunu yağmaladılar. Allah'ın lütfuyla, Kral Mu'azzam İsa, hareketin başlamasından iki gün sonra kardeşi el-Kamil'e katılmak üzere geldi. Durumu istikrara kavuşturdu ve İbn el-Meştub'u Suriye'ye sürdüler; orada Kral el-Eşref'e katıldı. Çeşitli Arap kabileleri bir araya gelerek çevredeki toprakları yağmaladılar ve yolları kestiler; bu da Müslümanlar için Franklardan daha tehlikeli olduklarını kanıtladı. Dimyat'ta kimse kalmamıştı. Askerlerden biri şehri kuşattı ve Franklar vardiyalı olarak savaşmaya devam ettiler. Ülke, daha önce hiç görülmemiş bir sabırla direndi, ta ki geri kalanlar sayıca az oldukları için dayanamayıp 27 Şaban'da, 1616 yılında şehri teslim edene kadar. {Kaynak: Kamil İbn el-Atir s. 376-377}"
  id: "Pada tahun 615 H, bangsa Frank merebut Menara Rantai dari Damietta. Abu Shama berkata, “Menara ini adalah kunci wilayah Mesir. Ini adalah menara tinggi di tengah Sungai Nil, dan di sisinya terdapat dua rantai, salah satunya membentang di atas Sungai Nil ke Damietta dan yang lainnya ke Giza, mencegah kapal-kapal dari Laut Hitam melewatinya.” Pada tahun 616 H, bangsa Frank merebut Damietta setelah perang dan pengepungan, dan Raja Al-Kamil terlalu lemah untuk melawan mereka. Mereka melakukan inovasi di sana dan mengubah masjid menjadi gereja. Maka Raja Al-Kamil membangun sebuah kota di persimpangan dua laut dan menamakannya Al-Mansura. Ia membangun tembok di atasnya dan menetap di sana bersama pasukannya. {cite:tarikh-khulafa-minhaj-1434 p. 696} Dalam Shadharat al-Dhahab, disebutkan bahwa bangsa Frank meninggalkan Damietta dengan pasukan berkuda dan infanteri selama naiknya permukaan Sungai Nil. Mereka mendarat di sebuah kanal, dan kaum Muslim menerobos Sungai Nil untuk melawan mereka. Mereka tidak sampai ke Damietta, dan armada pun tidak datang. Mereka merebut kapal-kapal kaum Frank, dan jumlah mereka mencapai seratus ribu orang, termasuk delapan ratus penunggang kuda, di antaranya penguasa Acre, dan sejumlah besar tentara infanteri. Ketika mereka melihat kekalahan itu, mereka meminta perdamaian dengan syarat mereka akan menyerahkan Damietta kepada al-Kamil. Dia menyetujuinya. Kemudian kedua saudara laki-lakinya datang kepadanya dengan pasukan di bulan Rajab. Dia menyiapkan jamuan besar dan mengundang raja-raja Frank dan memberi mereka hadiah. Al-Mu'azzam dan al-Ashraf mengabdi kepadanya. Itu adalah hari yang tak terlupakan. Rajih al-Halabi berdiri dan membacakan sebuah puisi, termasuk: \"Wahai hamba-hamba Isa, Isa, pengikutnya, dan Musa semuanya mendukung Muhammad.\" Dia menunjuk kepada ketiga saudara laki-laki itu. {cite:shadharat-dhahab hlm. 79} Menurut Ibn al-Athir, kaum Frank bertempur di menara itu selama empat bulan sampai mereka merebutnya. Mereka memutus rantai, sehingga raja membangun jembatan besar, yang juga mereka putus. Al-Kamil kemudian menenggelamkan kapal-kapal besar di Sungai Nil. Bangsa Frank menggali kanal yang dikenal sebagai Kanal Biru, yang dulunya dialiri Sungai Nil, dan membawa kapal-kapal mereka ke Bura. Kebetulan, Emir Agung Mesir, Imad al-Din ibn al-Mashtub al-Hakkari, bersekongkol dengan emir-emir lain untuk menggulingkan Raja al-Kamil dan mengangkat saudaranya, al-Faiz, sebagai raja. Ketika al-Kamil mengetahui hal ini, ia meninggalkan al-Manzala pada malam hari, menuju desa Shamoun Tanah. Pasukan kehilangan otoritasnya, dan setiap orang bertindak sesuai keinginannya sendiri, meninggalkan perbekalan, senjata, hewan, dan tenda. Keesokan paginya, bangsa Frank tidak melihat siapa pun dan menyeberangi Sungai Nil pada tanggal 20 Dzul Qi'dah tahun 15 Hijriah, tanpa perlawanan dan menjarah pasukan Muslim. Atas rahmat Allah, Raja al-Mu'azzam Isa tiba untuk bergabung dengan saudaranya al-Kamil dua hari setelah pergerakan tersebut. Ia menstabilkan situasi, dan mereka mengusir Ibn al-Mashtub ke Suriah, di mana ia bergabung dengan Raja al-Ashraf. Berbagai suku Arab berkumpul dan menjarah tanah di sekitarnya serta memutus jalan, terbukti lebih berbahaya bagi kaum Muslim daripada kaum Frank. Tidak ada seorang pun di Damietta. Salah satu tentara mengepungnya, dan kaum Frank terus bertempur secara bergantian, dan negeri itu bertahan dengan kesabaran yang belum pernah terdengar sebelumnya, sampai sisanya tidak mampu menanggungnya karena jumlah mereka yang sedikit, sehingga mereka menyerahkannya dengan jaminan keamanan pada tanggal 27 Sya'ban tahun 1666. {cite:kamil-ibn-al-athir hlm. 376-377}."
