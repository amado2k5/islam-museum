label: { ar: "استسقاء أبي طالب بالغلام محمد", en: "Abu Talib's prayer for rain with the boy Muhammad" }
summary:
  ar: "خبر يرويه ابن عساكر عن جلهمة بن عرفطة: قدم مكة وأهلها في قحط فسألت قريش أبا طالب أن يستسقي، فخرج ومعه غلام فألصق ظهره بالكعبة ولاذ الغلام بأصبعه وما في السماء قزعة، فأقبل السحاب وأغدق وانفجر الوادي؛ وإليه أشار أبو طالب في شعره بالأبيض الذي يُستسقى الغمام بوجهه."
  en: "A report Ibn Asakir transmits from Jalhama ibn Urfuta: arriving at Mecca in a drought he saw Quraysh ask Abu Talib to pray for rain; Abu Talib went out with a boy, set his back to the Kaaba while the boy pointed with his finger under a cloudless sky, and the clouds gathered and the valley flooded; Abu Talib's verse about the fair one by whose face rain is sought refers to this."
