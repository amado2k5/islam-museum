label: { ar: "اجتماع الحكمين بدومة الجندل", en: "The meeting of the two arbiters at Dumat al-Jandal" }
summary:
  ar: "اجتماع الحكمين عبد الله بن قيس وعمرو بن العاص بدومة الجندل بعد صحيفة التحكيم، وتذكره فهرس الجزء الخامس في سنة سبع وثلاثين {cite:tabari-tarikh-abu-al-fadl j.5 p.627}. وعند المسعودي كان التقاء الحكمين بدومة الجندل في رمضان سنة ثمان وثلاثين، وبعث علي بعبد الله بن عباس وشريح بن هانئ الهمداني في أربعمائة وبعث معاوية بعمرو بن العاص وشرحبيل بن السمط في أربعمائة، وحضره سعد بن أبي وقاص وعبد الله بن عمرو وعبد الرحمن بن عوف والمغيرة بن شعبة ممن قعد عن بيعة علي، وقال ابن عباس لأبي موسى إن علياً لم يرض بك حكماً لفضل عندك وإني لأظن ذلك لشر يراد بهم، وأوصى معاوية عمراً أن يؤخر الحز ويطبق المفصل {cite:muruj-al-dhahab p. 685-686}، فلما خلع أبو موسى وأثبت عمرو قال له فعلتها لعنك الله فتسابا ولحق أبو موسى بمكة، وانصرف عمرو ولم يأت معاوية فأرسل إليه فقال إنما كنت أجيئك إذ كانت لي إليك حاجة فأما إذا كانت الحاجة إلينا فأنت أحق أن تأتينا {cite:muruj-al-dhahab p. 690-691}"
  en: "The two arbiters, Abdallah ibn Qays and Amr ibn al-As, met at Dumat al-Jandal after the document of arbitration; the index of the fifth volume mentions it under the year thirty-seven {cite:tabari-tarikh-abu-al-fadl j.5 p.627}. Al-Mas'udi places the meeting at Dumat al-Jandal in Ramadan of the year thirty-eight: Ali sent Abdallah ibn Abbas and Shurayh ibn Hani al-Hamdani with four hundred men, and Mu'awiya sent Amr ibn al-As and Shurahbil ibn al-Simt with four hundred. Present were Sa'd ibn Abi Waqqas, Abdallah ibn Amr, Abd al-Rahman ibn Awf and al-Mughira ibn Shu'ba, who had held back from giving allegiance to Ali. Ibn Abbas told Abu Musa that Ali had not approved him as arbiter for any merit he saw in him, and that he suspected some harm was intended against them; Mu'awiya had urged Amr to delay the cut and close the joint {cite:muruj-al-dhahab p. 685-686}. When Abu Musa deposed (Ali) and Amr affirmed (Mu'awiya), Amr said to him: «You have done it, may God curse you», and they exchanged insults; Abu Musa left for Mecca. Amr did not go to Mu'awiya, who sent for him; he replied: «I only came to you when I needed something from you; but if the need is on your side, you are the one who should come to us» {cite:muruj-al-dhahab p. 690-691}"
