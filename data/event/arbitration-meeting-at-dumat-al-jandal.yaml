label: { ar: "اجتماع الحكمين بدومة الجندل" }
summary:
  ar: "اجتماع الحكمين عبد الله بن قيس وعمرو بن العاص بدومة الجندل بعد صحيفة التحكيم، وتذكره فهرس الجزء الخامس في سنة سبع وثلاثين {cite:tabari-tarikh-abu-al-fadl j.5 p.627}.، وعند المسعودي كان التقاء الحكمين بدومة الجندل في رمضان سنة ثمان وثلاثين، وبعث علي بعبد الله بن عباس وشريح بن هانئ الهمداني في أربعمائة وبعث معاوية بعمرو بن العاص وشرحبيل بن السمط في أربعمائة، وحضره سعد بن أبي وقاص وعبد الله بن عمرو وعبد الرحمن بن عوف والمغيرة بن شعبة ممن قعد عن بيعة علي، وقال ابن عباس لأبي موسى إن علياً لم يرض بك حكماً لفضل عندك وإني لأظن ذلك لشر يراد بهم، وأوصى معاوية عمراً أن يؤخر الحز ويطبق المفصل {cite:muruj-al-dhahab p. 685-686}"
