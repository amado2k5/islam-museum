label: { ar: "اجتماع الحكمين بدومة الجندل", en: "The meeting of the two arbiters at Dumat al-Jandal", es: "El encuentro de los dos árbitros en Dumat al-Jandal", fr: "La rencontre des deux arbitres à Dumat al-Jandal", ur: "دومۃ الجندل میں دونوں ثالثوں کی ملاقات" }
summary:
  ar: "اجتماع الحكمين عبد الله بن قيس وعمرو بن العاص بدومة الجندل بعد صحيفة التحكيم، وتذكره فهرس الجزء الخامس في سنة سبع وثلاثين {cite:tabari-tarikh-abu-al-fadl j.5 p.627}. وعند المسعودي كان التقاء الحكمين بدومة الجندل في رمضان سنة ثمان وثلاثين، وبعث علي بعبد الله بن عباس وشريح بن هانئ الهمداني في أربعمائة وبعث معاوية بعمرو بن العاص وشرحبيل بن السمط في أربعمائة، وحضره سعد بن أبي وقاص وعبد الله بن عمرو وعبد الرحمن بن عوف والمغيرة بن شعبة ممن قعد عن بيعة علي، وقال ابن عباس لأبي موسى إن علياً لم يرض بك حكماً لفضل عندك وإني لأظن ذلك لشر يراد بهم، وأوصى معاوية عمراً أن يؤخر الحز ويطبق المفصل {cite:muruj-al-dhahab p. 685-686}، فلما خلع أبو موسى وأثبت عمرو قال له فعلتها لعنك الله فتسابا ولحق أبو موسى بمكة، وانصرف عمرو ولم يأت معاوية فأرسل إليه فقال إنما كنت أجيئك إذ كانت لي إليك حاجة فأما إذا كانت الحاجة إلينا فأنت أحق أن تأتينا {cite:muruj-al-dhahab p. 690-691}"
  en: "The two arbiters, Abdallah ibn Qays and Amr ibn al-As, met at Dumat al-Jandal after the document of arbitration; the index of the fifth volume mentions it under the year thirty-seven {cite:tabari-tarikh-abu-al-fadl j.5 p.627}. Al-Mas'udi places the meeting at Dumat al-Jandal in Ramadan of the year thirty-eight: Ali sent Abdallah ibn Abbas and Shurayh ibn Hani al-Hamdani with four hundred men, and Mu'awiya sent Amr ibn al-As and Shurahbil ibn al-Simt with four hundred. Present were Sa'd ibn Abi Waqqas, Abdallah ibn Amr, Abd al-Rahman ibn Awf and al-Mughira ibn Shu'ba, who had held back from giving allegiance to Ali. Ibn Abbas told Abu Musa that Ali had not approved him as arbiter for any merit he saw in him, and that he suspected some harm was intended against them; Mu'awiya had urged Amr to delay the cut and close the joint {cite:muruj-al-dhahab p. 685-686}. When Abu Musa deposed (Ali) and Amr affirmed (Mu'awiya), Amr said to him: «You have done it, may God curse you», and they exchanged insults; Abu Musa left for Mecca. Amr did not go to Mu'awiya, who sent for him; he replied: «I only came to you when I needed something from you; but if the need is on your side, you are the one who should come to us» {cite:muruj-al-dhahab p. 690-691}"
  es: "Los dos árbitros, Abdallah ibn Qays y Amr ibn al-As, se reunieron en Dumat al-Jandal después del documento de arbitraje; el índice del quinto volumen lo menciona bajo el año treinta y siete {cite:tabari-tarikh-abu-al-fadl j.5 p.627}. Al-Mas'udi sitúa la reunión en Dumat al-Jandal en Ramadán del año treinta y ocho: Ali envió a Abdallah ibn Abbas y Shurayh ibn Hani al-Hamdani con cuatrocientos hombres, y Mu'awiya envió a Amr ibn al-As y Shurahbil ibn al-Simt con cuatrocientos. Estuvieron presentes Sa'd ibn Abi Waqqas, Abdallah ibn Amr, Abd al-Rahman ibn Awf y al-Mughira ibn Shu'ba, quien se había abstenido de prestar juramento de lealtad a Ali. Ibn Abbas le dijo a Abu Musa que Ali no lo había aprobado como árbitro por ningún mérito que viera en él, y que sospechaba que se les pretendía algún daño; Mu'awiya había instado a Amr a retrasar el corte y cerrar la herida {cite:muruj-al-dhahab p. 685-686}. Cuando Abu Musa depuso a Ali y Amr confirmó a Mu'awiya, Amr le dijo: «Lo has hecho, que Dios te maldiga», e intercambiaron insultos; Abu Musa partió hacia La Meca. Amr no fue a ver a Mu'awiya, quien lo mandó llamar; respondió: «Solo vine a ti cuando necesitaba algo de ti; pero si la necesidad está de tu lado, eres tú quien debe venir a nosotros» {cite:muruj-al-dhahab p. 690-691}."
  fr: "Les deux arbitres, Abdallah ibn Qays et Amr ibn al-As, se rencontrèrent à Dumat al-Jandal après la signature du document d'arbitrage; l'index du cinquième volume mentionne cet événement sous l'an trente-sept (cite: Tabari Tarikh Abu al-Fadl, vol. 5, p. 627). Al-Mas'udi situe cette rencontre à Dumat al-Jandal durant le Ramadan de l'an trente-huit: Ali envoya Abdallah ibn Abbas et Shurayh ibn Hani al-Hamdani avec quatre cents hommes, et Mu'awiya envoya Amr ibn al-As et Shurahbil ibn al-Simt avec quatre cents hommes également. Étaient présents Sa'd ibn Abi Waqqas, Abdallah ibn Amr, Abd al-Rahman ibn Awf et al-Mughira ibn Shu'ba, qui s'était abstenu de prêter allégeance à Ali. Ibn Abbas informa Abou Moussa qu'Ali ne l'avait pas agréé comme arbitre, malgré ses mérites, et qu'il soupçonnait des intentions malveillantes à leur égard. Mu'awiya avait exhorté Amr à retarder la coupure et à fermer la jonction (voir Muruj-al-Dhahab, p. 685-686). Lorsqu'Abou Moussa déposa Ali et qu'Amr confirma Mu'awiya, ce dernier lui lança: « Tu l'as fait, que Dieu te maudisse ! » et ils échangèrent des insultes. Abou Moussa partit pour La Mecque. Amr ne se rendit pas auprès de Mu'awiya, qui l'avait fait venir; il répondit: « Je ne suis venu te voir que lorsque j'avais besoin de quelque chose; mais si le besoin est de ton côté, c'est à toi de venir nous voir » (voir Muruj-al-Dhahab, p. 690-691)."
  ur: "دو ثالث، عبداللہ ابن قیس اور عمرو بن العاص، ثالثی کی دستاویز کے بعد دمت الجندل میں ملے۔ پانچویں جلد کے اشاریہ میں اس کا تذکرہ سینتیس کے تحت کیا گیا ہے {حوالہ: طبری-تاریخ-ابو الفضل ج5 ص627}۔ المسعودی نے اڑتیس رمضان المبارک میں دمت الجندل میں ملاقات کی: علی نے عبداللہ ابن عباس اور شریح بن ہانی الحمدانی کو چار سو آدمیوں کے ساتھ بھیجا اور معاویہ نے عمرو بن العاص اور شورابیل بن الصمت کو چار سو آدمیوں کے ساتھ بھیجا۔ سعد بن ابی وقاص، عبداللہ بن عمرو، عبدالرحمٰن بن عوف اور مغیرہ بن شعبہ موجود تھے جنہوں نے علی کی بیعت کرنے سے باز رکھا۔ ابن عباس نے ابو موسیٰ سے کہا کہ علی نے انہیں ثالث کے طور پر منظور نہیں کیا تھا کیونکہ اس نے ان میں کوئی خوبی دیکھی تھی، اور یہ کہ انہیں شبہ ہے کہ ان کے خلاف کوئی نقصان پہنچایا گیا ہے۔ معاویہ نے عمرو کو کٹ میں تاخیر کرنے اور جوڑ بند کرنے کی تاکید کی تھی۔ 685-686}۔ جب ابو موسیٰ ⁦(علی)⁩ نے معزول کیا اور عمرو نے ⁦(معاویہ)⁩ کی تصدیق کی تو عمرو نے ان سے کہا: \"تم نے یہ کیا، خدا تم پر لعنت کرے\"، اور انہوں نے گالیوں کا تبادلہ کیا۔ ابو موسیٰ مکہ روانہ ہوئے۔ عمرو معاویہ کے پاس نہیں گیا جس نے اسے بلایا۔ اس نے جواب دیا: \"میں آپ کے پاس صرف اس وقت آیا تھا جب مجھے آپ سے کسی چیز کی ضرورت تھی۔ لیکن اگر ضرورت آپ کی طرف ہو تو آپ ہی ہمارے پاس آئیں۔ 690-691}"
