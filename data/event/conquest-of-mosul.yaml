id: event/conquest-of-mosul
class: event
kind: conquest
label: { ar: "فتح الموصل", en: "Conquest of Mosul", es: "Conquista de Mosul", fr: "Conquête de Mossoul", ur: "موصل کی فتح", tr: "Musul açıldı", id: "Mosul dibuka" }
summary:
  ar: "ولّى عمر عتبة بن فرقد السلمي الموصل سنة عشرين فقاتله أهل نينوى فأخذ حصنها الشرقي عنوة وعبر دجلة فصالحه أهل الحصن الآخر على الجزية والإذن لمن أراد الجلاء ووجد بالموصل ديارات فصالحه أهلها على الجزية ثم فتح المرج وقراها وأرض باهذرى وباعذرى وحبتون والحيانة والمعلة ودامير وجميع معاقل الأكراد وأتى بني عتا من حزة ففتحها وتل الشهارجة والسلق وكان صالح بن عبادة الهمذاني صاحب رابطة الموصل وكانت أرمية والحور وخوي وسلماس من فتوحه خراجها إلى الموصل حيناً وعزله عمر فولى هرثمة بن عرفجة البارقي فمصّرها وأنزل العرب منازلهم واختط لهم وبنى المسجد الجامع وفرشها ابن تليد صاحب شرطة محمد بن مروان بالحجارة وبنى سعيد بن عبد الملك سورها وهو الذي هدمه الرشيد."
  en: "Umar made Utba ibn Farqad al-Sulami governor of Mosul in year 20; Nineveh's people fought, he took its eastern fort by force, crossed the Tigris, and the other fortress treated for jizya with leave to quit; Mosul's monasteries treated likewise, then al-Marj, Bahadhra, Hibtun, al-Hiyana, al-Ma'alla, Damir and every Kurdish stronghold, Banu Ata of Hizza, Tall al-Shaharija and al-Salaq — Salih ibn Ubada holding Mosul's ribat — with Urmiya, al-Hawr, Khuway and Salamas paying Mosul a while. Umar dismissed him for Harthama ibn Arfaja al-Bariqi, who made it a misr, settled the Arabs in their plots and built the congregational mosque; Ibn Tulayd paved it with stone and Sa'id ibn Abd al-Malik built the wall al-Rashid later razed."
  es: "Umar nombró a Utba ibn Farqad al-Sulami gobernador de Mosul en el año 20; la gente de Nínive luchó, él tomó su fortaleza oriental por la fuerza, cruzó el Tigris y la otra fortaleza negoció con jizya con permiso para abandonarla; los monasterios de Mosul fueron tratados de la misma manera, luego al-Marj, Bahadhra, Hibtun, al-Hiyana, al-Ma'alla, Damir y cada fortaleza kurda, Banu Ata de Hizza, Tall al-Shaharija y al-Salaq — Salih ibn Ubada poseía el ribat de Mosul — con Urmiya, al-Hawr, Khuway y Salamas pagando a Mosul por un tiempo. Umar lo destituyó por Harthama ibn Arfaja al-Bariqi, quien la convirtió en un misr, asentó a los árabes en sus parcelas y construyó la mezquita congregacional; Ibn Tulayd la pavimentó con piedra y Sa'id ibn Abd al-Malik construyó el muro que al-Rashid posteriormente derribó."
  fr: "Umar nomma Utba ibn Farqad al-Sulami gouverneur de Mossoul en l'an 20. Les habitants de Ninive combattirent, il prit de force la forteresse orientale, traversa le Tigre et négocia l'autre forteresse pour la jizya avec possibilité de départ. Les monastères de Mossoul subirent le même sort, puis al-Marj, Bahadhra, Hibtun, al-Hiyana, al-Ma'alla, Damir et chaque place forte kurde, Banu Ata de Hizza, Tall al-Shaharija et al-Salaq — Salih ibn Ubada contrôlant le ribat de Mossoul — tandis qu'Urmiya, al-Hawr, Khuway et Salamas payaient temporairement la jizya à Mossoul. Umar le destitua et le remplaça par Harthama ibn Arfaja al-Bariqi, qui fit de Mossoul un misr, installa les Arabes sur leurs parcelles et fit construire la mosquée du vendredi. Ibn Tulayd l'a pavé de pierres et Sa'id ibn Abd al-Malik a construit le mur qu'al-Rashid a ensuite rasé."
  ur: "عمر نے 20 میں عتبہ بن فرقد السلمی کو موصل کا گورنر بنایا۔ نینوی کے لوگ لڑے، اس نے طاقت کے ذریعے اس کا مشرقی قلعہ لے لیا، دجلہ کو عبور کیا، اور دوسرے قلعے کو چھوڑنے کی اجازت کے ساتھ جزیہ کا علاج کیا گیا۔ موصل کی خانقاہوں کے ساتھ بھی ایسا ہی سلوک کیا گیا، پھر المرج، بہادرہ، ہبتون، الحیانہ، المعلا، دمیر اور ہر کرد گڑھ، بنو عطاء حزہ، قد الشہریجہ اور الصالق - صالح بن عبادہ نے موصل کے عروہ اور صلوٰۃ کو ادا کیا۔ کچھ دیر کے لیے موصل۔ عمر نے اسے حرثمہ بن عرفجہ الباریقی کی وجہ سے برطرف کر دیا، جس نے اسے مسر بنایا، عربوں کو ان کے پلاٹوں میں بسایا اور اجتماعی مسجد تعمیر کی۔ ابن طلید نے اسے پتھر سے ہموار کیا اور سعید بن عبد الملک نے دیوار الرشید تعمیر کی جسے بعد میں گرا دیا۔"
  tr: "Ömer, yirminci yılda Utbe ibn Farqad al-Sulami'yi Musul valisi olarak atadı. Ninova halkı ona karşı savaştı, bu yüzden doğu kalesini zorla ele geçirdi ve Dicle'yi geçti. Diğer kalenin halkı, haraç ödeme ve ayrılmak isteyenlere izin verme şartıyla onunla barıştı. Musul'da manastırlar buldu, bu yüzden halkı da haraç ödeme şartıyla onunla barıştı. Sonra el-Marj ve köylerini, Bahadhri, Ba'adhri, Habtun, el-Hayyanah, el-Ma'la, Damir topraklarını ve tüm Kürt kalelerini fethetti. Hazza'dan Beni Atta'ya geldi ve orayı, el-Şaharjah ve el-Salq tepelerini fethetti. Salih ibn Ubadah al-Hamadhani, Musul garnizonunun başıydı. Armiyah, el-Hawr, Khoy ve Salmas onun fetihleri arasındaydı ve bir süre onlardan alınan haraçlar Musul'a gönderildi. Ömer onu görevden aldı ve Harthama ibn Arfajah el-Bariqi'yi atadı. O da Musul'u kurdu, Arapları evlerine yerleştirdi ve onlar için planlar yaptı. Büyük Camii'yi inşa etti ve Muhammed ibn Mervan'ın polis şefi İbn Talid, camiyi taşlarla döşedi. Said ibn Abd el-Malik surlarını inşa etti, ancak bu surlar el-Raşid tarafından yıkıldı."
  id: "Umar mengangkat Utbah ibn Farqad al-Sulami sebagai gubernur Mosul pada tahun 20. Penduduk Nineveh melawannya, sehingga ia merebut benteng timur Nineveh dengan paksa dan menyeberangi Sungai Tigris. Penduduk benteng lainnya berdamai dengannya dengan syarat membayar upeti dan izin bagi mereka yang ingin pergi. Ia menemukan biara-biara di Mosul, sehingga penduduknya berdamai dengannya dengan syarat membayar upeti. Kemudian ia menaklukkan al-Marj dan desa-desanya, serta tanah Bahadhri, Ba’adhri, Habtun, al-Hayyanah, al-Ma’la, Damir, dan semua benteng Kurdi. Ia datang ke Bani Atta dari Hazza dan menaklukkannya, serta perbukitan al-Shaharjah dan al-Salq. Salih ibn Ubadah al-Hamadhani adalah kepala garnisun Mosul. Armiyah, al-Hawr, Khoy, dan Salmas termasuk di antara wilayah taklukannya, dan upeti mereka dikirim ke Mosul untuk sementara waktu. Umar memecatnya dan menunjuk Harthama ibn Arfajah al-Bariqi, yang mendirikan kota itu dan menempatkan orang-orang Arab di rumah-rumah mereka serta menyusun rencana untuk mereka. Ia membangun Masjid Agung, dan Ibn Talid, kepala polisi Muhammad ibn Marwan, memasang batu di atasnya. Saeed ibn Abd al-Malik membangun temboknya, yang kemudian dihancurkan oleh al-Rashid."
