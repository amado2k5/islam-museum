id: "event/hasan-ibn-ahmad-and-ibn-munir-break-the-darb-gate-and-reach-ali-ibn-muhammad-at-al-buqayra-295"
class: event
kind: other
label:
  ar: "الحسن بن أحمد وابن منير يكسران باب الدرب ويبلغان علي بن محمد في البقيرة، 295هـ، ص380-381"
  en: "Hasan ibn Ahmad and Ibn Munir break the Darb gate and reach Ali ibn Muhammad at al-Buqayra, 295 AH, pp. 380-381"
  ur: "حسن بن احمد اور ابن منیر درب کا دروازہ توڑ کر البقیرہ میں علی بن محمد تک پہنچتے ہیں، 295ھ، ص380-381"
summary:
  ar: "انفصل الحسن بن أحمد وعبد الله بن منير عن أصحابهما، فعطفا على بني الحارث وكشفاهم، ثم كسر الحسن باب الدرب بسيفه، وخرجا بمن معهما إلى علي بن محمد في البقيرة، فأخبراه بسقوط أبيه شهيداً في الكتاب."
  en: "Hasan ibn Ahmad and Abdallah ibn Munir, cut off from their companions, turned on Banu al-Harith and drove them back. At the Yemeni gate of the village, Hasan broke the bolted gate with his sword, and they rode out to Ali ibn Muhammad at al-Buqayra and told him that his father had fallen as a martyr, in the book's word."
  ur: "حسن بن احمد اور عبد اللہ بن منیر اپنے ساتھیوں سے کٹ گئے، انہوں نے بنو حارث کا پیچھا کرنے والوں پر پلٹ کر وار کیا اور انہیں پیچھے ہٹا دیا۔ گاؤں کے یمانی درب پر دروازہ بند تھا تو حسن نے تلوار سے اسے توڑ دیا، پھر وہ البقیرہ میں علی بن محمد کے پاس پہنچے اور اسے بتایا کہ اس کا باپ کتاب کے لفظ کے مطابق شہید ہو گیا ہے۔"
