id: "event/hasan-ibn-ahmad-and-ibn-munir-break-the-darb-gate-and-reach-ali-ibn-muhammad-at-al-buqayra-295"
class: event
kind: other
label:
  ar: "الحسن بن أحمد وابن منير يكسران باب الدرب ويبلغان علي بن محمد في البقيرة، 295هـ، ص380-381"
  en: "Hasan ibn Ahmad and Ibn Munir break the Darb gate and reach Ali ibn Muhammad at al-Buqayra, 295 AH, pp. 380-381"
  ur: "حسن بن احمد اور ابن منیر درب کا دروازہ توڑ کر البقیرہ میں علی بن محمد تک پہنچتے ہیں، 295ھ، ص380-381"
  es: "Hasan ibn Ahmad e Ibn Munir derriban la puerta de Darb y llegan hasta Ali ibn Muhammad en al-Buqayra, 295 AH, págs. 380-381"
  fr: "Hasan ibn Ahmad et Ibn Munir franchissent la porte de Darb et atteignent Ali ibn Muhammad à al-Buqayra, 295 AH, pp. 380-381"
  tr: "Hasan ibn Ahmed ve İbn Munir, Bukayra'da (Hicri 295, s. 380-381) anlatılanlara göre, ara sokağın kapısını kırarak Ali ibn Muhammed'e ulaşırlar."
  id: "Al-Hasan ibn Ahmad dan Ibn Munir mendobrak pintu gang dan menemui Ali ibn Muhammad di Al-Buqayra, 295 H, hlm. 380-381."
summary:
  ar: "انفصل الحسن بن أحمد وعبد الله بن منير عن أصحابهما، فعطفا على بني الحارث وكشفاهم، ثم كسر الحسن باب الدرب بسيفه، وخرجا بمن معهما إلى علي بن محمد في البقيرة، فأخبراه بسقوط أبيه شهيداً في الكتاب."
  en: "Hasan ibn Ahmad and Abdallah ibn Munir, cut off from their companions, turned on Banu al-Harith and drove them back. At the Yemeni gate of the village, Hasan broke the bolted gate with his sword, and they rode out to Ali ibn Muhammad at al-Buqayra and told him that his father had fallen as a martyr, in the book's word."
  ur: "حسن بن احمد اور عبد اللہ بن منیر اپنے ساتھیوں سے کٹ گئے، انہوں نے بنو حارث کا پیچھا کرنے والوں پر پلٹ کر وار کیا اور انہیں پیچھے ہٹا دیا۔ گاؤں کے یمانی درب پر دروازہ بند تھا تو حسن نے تلوار سے اسے توڑ دیا، پھر وہ البقیرہ میں علی بن محمد کے پاس پہنچے اور اسے بتایا کہ اس کا باپ کتاب کے لفظ کے مطابق شہید ہو گیا ہے۔"
  es: "Hasan ibn Ahmad y Abdallah ibn Munir, separados de sus compañeros, se volvieron contra Banu al-Harith y los hicieron retroceder. En la puerta yemení de la aldea, Hasan rompió la puerta cerrada con cerrojo con su espada, y cabalgaron hasta donde estaba Ali ibn Muhammad en al-Buqayra y le dijeron que su padre había caído como mártir, según la palabra del Libro."
  fr: "Hasan ibn Ahmad et Abdallah ibn Munir, séparés de leurs compagnons, se retournèrent contre les Banu al-Harith et les repoussèrent. À la porte yéménite du village, Hasan força la porte verrouillée avec son épée, et ils se rendirent auprès d'Ali ibn Muhammad à al-Buqayra et lui annoncèrent que son père était tombé en martyr, conformément aux Écritures."
  tr: "Hasan ibn Ahmed ve Abdullah ibn Munir, arkadaşlarından ayrılarak Beni el-Harith'e yöneldiler ve onları ifşa ettiler. Ardından Hasan, kılıcıyla ara sokağın kapısını kırdı ve yanlarındakilerle birlikte Bakara'daki Ali ibn Muhammed'in yanına giderek babasının şehit edildiğini ona bildirdiler."
  id: "Al-Hasan ibn Ahmad dan Abdullah ibn Munir berpisah dari para pengikutnya, berbalik menuju Bani al-Harith dan membongkar keberadaan mereka. Kemudian al-Hasan mendobrak pintu lorong dengan pedangnya, dan mereka keluar bersama orang-orang yang bersama mereka menuju Ali ibn Muhammad di al-Baqirah, dan memberitahukan kepadanya tentang kemartiran ayahnya yang tertulis dalam kitab tersebut."
