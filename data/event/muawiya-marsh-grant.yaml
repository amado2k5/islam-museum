id: event/muawiya-marsh-grant
class: event
kind: other
label: { ar: "قطيعة معاوية السبخة", en: "Mu'awiya's Marsh Grant", es: "La concesión de Marsh de Mu'awiya", fr: "La subvention Marsh de Mu'awiya", ur: "معاویہ کی مارش گرانٹ" }
summary:
  ar: "كانت الجزيرة بين النهرين سبخة فأقطعها معاوية بعض بني أخوته فلما قدم الفتى لينظر إليها أمر زياد بالماء فأرسل فيها فقال الفتى إنما أقطعني أمير المؤمنين بطيحة لا حاجة لي فيها فابتاعها زياد منه بمائتي ألف درهم وحفر أنهارها وأقطع منها."
  en: "The marsh between the rivers was a salt-flat Mu'awiya granted one of his nephews; when the lad came to inspect it Ziyad had water released into it — 'the Commander of the Faithful granted me a waterfowl-marsh I have no use for' — so Ziyad bought it for two hundred thousand dirhams, dug its canals and parceled grants from it."
  es: "El pantano entre los ríos era una marisma salina que Mu'awiya le había concedido a uno de sus sobrinos; cuando el muchacho fue a inspeccionarla, Ziyad mandó verter agua en ella —«el Comandante de los Creyentes me concedió una marisma para aves acuáticas que no me sirve de nada»—, así que Ziyad la compró por doscientos mil dirhams, excavó sus canales y repartió concesiones de la misma."
  fr: "Le marais entre les rivières était une saline que Mu'awiya avait concédée à l'un de ses neveux; lorsque le garçon vint l'inspecter, Ziyad y fit déverser de l'eau — « le Commandeur des Croyants m'a concédé un marais à oiseaux aquatiques dont je n'ai aucune utilité » — alors Ziyad l'acheta pour deux cent mille dirhams, creusa ses canaux et en distribua des parcelles."
  ur: "دریاؤں کے درمیان دلدل ایک نمکین فلیٹ تھا جو معاویہ نے اپنے بھتیجے میں سے ایک کو دیا تھا۔ جب لڑکا اس کا معائنہ کرنے آیا تو زیاد نے اس میں پانی چھوڑا تھا - 'صاحبِ وفادار نے مجھے ایک آبی چڑیا دی تھی جس کا مجھے کوئی فائدہ نہیں' - چنانچہ زیاد نے اسے دو لاکھ درہم میں خریدا، اس کی نہریں کھودیں اور اس میں سے گرانٹ تقسیم کیں۔"
