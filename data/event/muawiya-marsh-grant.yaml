  en: "The marsh between the rivers was a salt-flat Mu'awiya granted one of his nephews; when the lad came to inspect it Ziyad had water released into it — 'the Commander of the Faithful granted me a waterfowl-marsh I have no use for' — so Ziyad bought it for two hundred thousand dirhams, dug its canals and parceled grants from it."
