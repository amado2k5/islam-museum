summary:
  ar: "سلسلة مناظرات متلفزة شهيرة استضافتها قناة المستقلة في [[place/london|لندن]] في مطلع الألفين بإدارة محمد الهاشمي الحامدي، جمعت علماء سنة كـ[[person/adnan-al-arur|عدنان العرعور]] و[[person/uthman-al-khamis|عثمان الخميس]] بعلماء شيعة اثني عشرية كآية الله القزويني والسيد علي الميلاني، في جلسات مطولة عن الإمامة والصحابة ومصادر التشريع، وبقيت تفريغاتها وتسجيلاتها مرجعاً متداولاً في العالم العربي {cite:youtube-sunni-jewish-debate}."
  en: "A famous televised debate series hosted by the al-Mustaqillah channel in [[place/london|London]] in the early 2000s under Mohamed El-Hachimi Hamdi, seating Sunni scholars such as [[person/adnan-al-arur|Adnan al-Ar'ur]] and [[person/uthman-al-khamis|Uthman al-Khamis]] against Twelver Shia scholars such as Ayatollah al-Qazwini and Sayyid Ali al-Milani, in long sessions on the Imamate, the Companions and the sources of legislation. The transcripts and recordings remain a circulating reference in the Arab world {cite:youtube-sunni-jewish-debate}."
  es: "Una famosa serie de debates televisados, organizada por el canal al-Mustaqillah en Londres a principios de la década de 2000 bajo la dirección de Mohamed El-Hachimi Hamdi, enfrentó a eruditos sunitas como Adnan al-Ar'ur y Uthman al-Khamis con eruditos chiítas duodecimanos como el ayatolá al-Qazwini y Sayyid Ali al-Milani, en largas sesiones sobre el Imamato, los Compañeros y las fuentes de la legislación. Las transcripciones y grabaciones siguen siendo una referencia circulante en el mundo árabe {cite:youtube-sunni-jewish-debate}."
  fr: "Une célèbre série de débats télévisés, diffusée sur la chaîne Al-Mustaqillah à Londres au début des années 2000 sous la direction de Mohamed El-Hachimi Hamdi, opposait des érudits sunnites tels qu'Adnan al-Ar'ur et Uthman al-Khamis à des érudits chiites duodécimains comme l'ayatollah al-Qazwini et Sayyid Ali al-Milani. Ces débats portaient sur l'imamat, les Compagnons et les sources de la législation. Les transcriptions et les enregistrements de ces débats restent une référence dans le monde arabe."
  ur: "2000 کی دہائی کے اوائل میں [[جگہ/لندن|لندن]] میں [[جگہ/لندن|لندن]] کے زیر اہتمام ٹیلی ویژن پر نشر ہونے والی ایک مشہور مباحثہ سیریز، جس میں [[شخص/عدنان-الارور|عدنان العرور]] اور [[شخص/عثمان الخارمان] کے خلاف سنی علماء کو بٹھایا گیا تھا۔ شیعہ علماء جیسے آیت اللہ القزوینی اور سید علی میلانی نے امامت، صحابہ کرام اور قانون سازی کے ذرائع پر طویل نشستوں میں۔ نقلیں اور ریکارڈنگ عرب دنیا میں گردش کرنے والا حوالہ بنی ہوئی ہے {حوالہ:یوٹیوب-سنی-یہودی-بحث}۔"
  tr: "2000'li yılların başında Londra'daki Al-Mustaqilla TV'de, Muhammed Al-Hashimi Al-Hamdi'nin sunuculuğunu yaptığı ünlü bir televizyon tartışma programı, Adnan Al-Arur ve Osman Al-Khamis gibi Sünni alimleri, Ayetullah Al-Qazwini ve Seyyid Ali Al-Milani gibi On İki İmam Şii alimleriyle bir araya getirerek, İmamlık, Sahabeler ve kanunların kaynakları üzerine uzun oturumlar düzenledi. Tartışmaların metinleri ve kayıtları Arap dünyasında yaygın olarak kullanılan bir referans kaynağı olmaya devam etmektedir."
  id: "Sebuah serial debat televisi terkenal yang diselenggarakan oleh Al-Mustaqilla TV di London pada awal tahun 2000-an, yang dikelola oleh Muhammad Al-Hashimi Al-Hamdi, mempertemukan para ulama Sunni seperti Adnan Al-Arur dan Uthman Al-Khamis dengan para ulama Syiah Dua Belas Imam seperti Ayatollah Al-Qazwini dan Sayyid Ali Al-Milani, dalam sesi-sesi panjang tentang Imamah, para Sahabat, dan sumber-sumber hukum Islam. Transkrip dan rekaman debat tersebut tetap menjadi referensi yang beredar luas di dunia Arab."
