summary:
  ar: "أول جمعية جُمِّعت في الإسلام على رواية عبد الرحمن بن كعب بن مالك: جمَّع بها أسعد بن زرارة في حرة بني بياضة في نقيع يقال له نقيع الخَضِمات، وكانوا أربعين رجلاً، وكان أبوه كعب إذا سمع الأذان للجمعة استغفر لأسعد لأنه أول من جمع بهم؛ ويوافقه ما رُوي عن الزهري أن مصعب بن عمير جمع باثني عشر رجلاً — والجامع أن أسعد أقام الجمعة بمعونة الاثني عشر ومصعب هو الإمام {cite:samhudi-wafa-al-wafa p. 236-237}."
  en: "The first congregational Friday in Islam, on the account of 'Abd al-Rahman ibn Ka'b ibn Malik: As'ad ibn Zurara gathered it at Naqi' al-Khadimat in the harra of Banu Bayada with forty men, and his father Ka'b used to pray for As'ad's forgiveness whenever he heard the Friday call, for he was the first to gather them; al-Zuhri's version that Mus'ab ibn 'Umayr gathered twelve men is reconciled in that As'ad held the prayer with the twelve and Mus'ab led it {cite:samhudi-wafa-al-wafa p. 236-237}."
