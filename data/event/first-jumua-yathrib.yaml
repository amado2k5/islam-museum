label: { ar: "أول جمعة بيثرب قبل الهجرة", en: "The first Friday prayer in Yathrib", es: "La primera oración del viernes en Yathrib", fr: "La première prière du vendredi à Yathrib", ur: "یثرب میں جمعہ کی پہلی نماز", tr: "Hicretten önce Yathrib'de kılınan ilk Cuma namazı.", id: "Salat Jumat pertama di Yathrib sebelum Hijrah." }
summary:
  ar: "أول جمعية جُمِّعت في الإسلام على رواية عبد الرحمن بن كعب بن مالك: جمَّع بها أسعد بن زرارة في حرة بني بياضة في نقيع يقال له نقيع الخَضِمات، وكانوا أربعين رجلاً، وكان أبوه كعب إذا سمع الأذان للجمعة استغفر لأسعد لأنه أول من جمع بهم؛ ويوافقه ما رُوي عن الزهري أن مصعب بن عمير جمع باثني عشر رجلاً — والجامع أن أسعد أقام الجمعة بمعونة الاثني عشر ومصعب هو الإمام {cite:samhudi-wafa-al-wafa p. 236-237}."
  en: "The first congregational Friday in Islam, on the account of 'Abd al-Rahman ibn Ka'b ibn Malik: As'ad ibn Zurara gathered it at Naqi' al-Khadimat in the harra of Banu Bayada with forty men, and his father Ka'b used to pray for As'ad's forgiveness whenever he heard the Friday call, for he was the first to gather them; al-Zuhri's version that Mus'ab ibn 'Umayr gathered twelve men is reconciled in that As'ad held the prayer with the twelve and Mus'ab led it {cite:samhudi-wafa-al-wafa p. 236-237}."
  es: "El primer viernes congregacional en el Islam, según el relato de 'Abd al-Rahman ibn Ka'b ibn Malik: As'ad ibn Zurara lo reunió en Naqi' al-Khadimat en el harra de Banu Bayada con cuarenta hombres, y su padre Ka'b solía orar por el perdón de As'ad cada vez que oía la llamada del viernes, porque él era el primero en reunirlos; la versión de al-Zuhri de que Mus'ab ibn 'Umayr reunió a doce hombres se concilia en que As'ad realizó la oración con los doce y Mus'ab la dirigió {cite:samhudi-wafa-al-wafa p. 236-237}."
  fr: "Le premier vendredi en congrégation dans l'Islam, selon le récit de 'Abd al-Rahman ibn Ka'b ibn Malik: As'ad ibn Zurara l'a rassemblé à Naqi' al-Khadimat dans le harra de Banu Bayada avec quarante hommes, et son père Ka'b avait l'habitude de prier pour le pardon d'As'ad chaque fois qu'il entendait l'appel du vendredi, car il était le premier à les rassembler; la version d'al-Zuhri selon laquelle Mus'ab ibn 'Umayr a rassemblé douze hommes est conciliée par le fait qu'As'ad a tenu la prière avec les douze et que Mus'ab l'a dirigée {cite:samhudi-wafa-al-wafa p. 236-237}."
  ur: "اسلام کا پہلا اجتماعی جمعہ عبدالرحمٰن بن کعب بن مالک کی رو سے: اسعد بن زرارہ نے بنو بیادہ کے علاقے حرہ میں نقی الخدمت میں چالیس آدمیوں کے ساتھ جمع کیا، اور ان کے والد کعب اسعد کی مغفرت کے لیے دعا کیا کرتے تھے، جب بھی وہ جمعہ کی اذان سنتے تو سب سے پہلے ان کے لیے دعا کرتے تھے۔ الزہری کا یہ قول کہ مصعب بن عمیر نے بارہ آدمیوں کو جمع کیا اس میں صلح ہے کہ اسد نے بارہ آدمیوں کے ساتھ نماز ادا کی اور مصعب نے اس کی امامت کی۔ 236-237}۔"
  tr: "Abdülrahman ibn Ka'b ibn Malik'in rivayetine göre, İslam'daki ilk cemaat namazı, Beni Beyde'nin lav tarlalarında, Naki' el-Hadimat denilen yerde, As'ad ibn Zurarah tarafından kıldırılmıştır. Kırk erkek vardı. Babası Ka'b, Cuma namazı için ezanı duyduğunda, As'ad'dan ilk namaz kıldıran kişi olduğu için bağışlanma dilerdi. Bu, el-Zuhri'nin rivayetine göre Mus'ab ibn 'Umeyr'in on iki erkekle cemaat namazı kıldırmasıyla tutarlıdır. Ortak nokta, As'ad'ın on iki kişinin yardımıyla Cuma namazını başlatmış olması ve Mus'ab'ın imam olmasıdır. {cite:samhudi-wafa-al-wafa s. 236-237}"
  id: "Shalat berjamaah pertama dalam Islam, menurut riwayat Abd al-Rahman ibn Ka’b ibn Malik, dipimpin oleh As’ad ibn Zurarah di padang lava Banu Bayadah di tempat bernama Naqi’ al-Khadhimat. Ada empat puluh orang laki-laki. Ayahnya, Ka’b, ketika mendengar seruan shalat Jumat, meminta maaf atas nama As’ad karena dialah yang pertama memimpin mereka dalam shalat. Hal ini sesuai dengan apa yang diriwayatkan dari al-Zuhri bahwa Mus’ab ibn ‘Umayr memimpin shalat berjamaah dengan dua belas orang laki-laki. Kesamaannya adalah bahwa As’ad mendirikan shalat Jumat dengan bantuan dua belas orang tersebut, dan Mus’ab adalah imamnya. {cite:samhudi-wafa-al-wafa hlm. 236-237}"
