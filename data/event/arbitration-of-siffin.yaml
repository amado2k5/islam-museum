id: event/arbitration-of-siffin
class: event
kind: treaty
label: { ar: "التحكيم بعد صفين" }
summary:
  ar: "بعد رفع المصاحف كُتبت صحيفة التحكيم بين علي ومعاوية، فيها أن يحكم عبد الله بن قيس وعمرو بن العاص بين الأمة، وأن يكون القضاء إلى رمضان {cite:tabari-tarikh-abu-al-fadl j.5 p.54}. وقال رجل من جانب المسجد: لا حكم إلا لله، ثم توالى رجال يحكّمون، فرد عليهم علي بأن الحكم لله {cite:tabari-tarikh-abu-al-fadl j.5 p.73}. ويشير فهرس الجزء إلى اجتماع الحكمين بدومة الجندل {cite:tabari-tarikh-abu-al-fadl j.5 p.627}."
