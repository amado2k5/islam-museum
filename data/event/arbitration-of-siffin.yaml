id: event/arbitration-of-siffin
education:
  did_you_know:
    ar: "بعد رفع المصاحف بصفين كُتبت صحيفة التحكيم بين علي ومعاوية على أن يحكم عبد الله بن قيس وعمرو بن العاص، وأن يكون القضاء إلى رمضان."
    en: "After the mushafs were raised at Siffin, the arbitration writ was drawn between Ali and Mu'awiya: Abd Allah ibn Qays and Amr ibn al-As would judge for the community, and the verdict was due by Ramadan."
    ur: "صفین میں مصحف اٹھانے کے بعد علی اور معاویہ کے درمیان تحکیم کا صحیفہ لکھا گیا: عبداللہ بن قیس اور عمرو بن عاص امت کے لیے فیصلہ کریں گے، اور فیصلہ رمضان تک ہونا تھا۔"
    sources: [source/tabari-tarikh-abu-al-fadl, source/tarikh-ibn-khaldun-ibar]
