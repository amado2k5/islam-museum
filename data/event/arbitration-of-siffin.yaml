id: event/arbitration-of-siffin
class: event
kind: treaty
label: { ar: "التحكيم بعد صفين" }
summary:
  ar: "بعد رفع المصاحف كُتبت صحيفة التحكيم بين علي ومعاوية، فيها أن يحكم عبد الله بن قيس وعمرو بن العاص بين الأمة، وأن يكون القضاء إلى رمضان {cite:tabari-tarikh-abu-al-fadl j.5 p.54}. وقال رجل من جانب المسجد: لا حكم إلا لله، ثم توالى رجال يحكّمون، فرد عليهم علي بأن الحكم لله {cite:tabari-tarikh-abu-al-fadl j.5 p.73}. ويشير فهرس الجزء إلى اجتماع الحكمين بدومة الجندل {cite:tabari-tarikh-abu-al-fadl j.5 p.627}. واختار أهل الشام عمرو بن العاص وأصر الأشعث ومن معه على أبي موسى رغم اعتراض علي وقوله ليس بثقة، وكتب في الصحيفة أن يحيي الحكمان ما أحيا القرآن ويميتا ما أمات ولا يتبعا الهوى، وجعل الأجل إلى رمضان وكان عقدها لأيام بقين من صفر سنة سبع وثلاثين، وأول من نطق بلا حكم إلا لله عروة بن أذينة، وتنوزع في القتلى فروى يحيى بن معين مائة ألف وعشرة آلاف من الفريقين في مائة وعشرة أيام، وروى الهيثم بن عدي والشرقي بن القطامي وأبو مخنف سبعين ألفاً فيهم خمسة وعشرون بدرياً، ورجح المسعودي أكثر من ذلك {cite:muruj-al-dhahab p. 682-685}"
date:
  start: { hijri: "0037", precision: year, status: historical, note: "ج5 ص54، ص73، وفهرس ص627", sources: [source/tabari-tarikh-abu-al-fadl] }
perspectives:
  - tradition: sunni
    id: sunni-sallabi
    summary:
      ar: "يرى الصلابي، من منظور أهل السنة، أن التحكيم كان لقضية القصاص لا للخلافة، وأن بيعة علي لم تنحل، وأن الحكمين لم يتفقا على خلعه، وأن رواية الخديعة والسذاجة المنسوبة لأبي موسى وعمرو لا تثبت {cite:sallabi-ali-vol2 p. 139} {cite:sallabi-ali-vol2 p. 142}."
      en: "al-Sallabi, from a Sunni standpoint, holds that the arbitration concerned qisas, not the caliphate, that Ali's bay'a was never dissolved, and that the stories of deception attributed to Abu Musa and Amr are not established."
    sources: [source/sallabi-ali-vol2]
  - tradition: academic
    id: academic
    summary:
      ar: "الرأي الأكاديمي عن التحكيم لم يُعرض بعد من هذا المجلد؛ يُضاف عند توفر مصدر أكاديمي."
      en: "The academic view of the arbitration is not yet set out from this volume; to be added from an academic source."
    sources: []
