perspectives:
  - tradition: sunni
    id: sunni-sallabi
    summary:
      ar: "يرى الصلابي، من منظور أهل السنة، أن التحكيم كان لقضية القصاص لا للخلافة، وأن بيعة علي لم تنحل، وأن الحكمين لم يتفقا على خلعه، وأن رواية الخديعة والسذاجة المنسوبة لأبي موسى وعمرو لا تثبت {cite:sallabi-ali-vol2 p. 139} {cite:sallabi-ali-vol2 p. 142}."
      en: "al-Sallabi, from a Sunni standpoint, holds that the arbitration concerned qisas, not the caliphate, that Ali's bay'a was never dissolved, and that the stories of deception attributed to Abu Musa and Amr are not established."
    sources: [source/sallabi-ali-vol2]
