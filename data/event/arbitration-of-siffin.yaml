label: { ar: "التحكيم بعد صفين", en: "The arbitration after Siffin" }
summary:
  ar: "بعد رفع المصاحف كُتبت صحيفة التحكيم بين علي ومعاوية، فيها أن يحكم عبد الله بن قيس وعمرو بن العاص بين الأمة، وأن يكون القضاء إلى رمضان {cite:tabari-tarikh-abu-al-fadl j.5 p.54}. وقال رجل من جانب المسجد: لا حكم إلا لله، ثم توالى رجال يحكّمون، فرد عليهم علي بأن الحكم لله {cite:tabari-tarikh-abu-al-fadl j.5 p.73}. ويشير فهرس الجزء إلى اجتماع الحكمين بدومة الجندل {cite:tabari-tarikh-abu-al-fadl j.5 p.627}. واختار أهل الشام عمرو بن العاص وأصر الأشعث ومن معه على أبي موسى رغم اعتراض علي وقوله ليس بثقة، وكتب في الصحيفة أن يحيي الحكمان ما أحيا القرآن ويميتا ما أمات ولا يتبعا الهوى، وجعل الأجل إلى رمضان وكان عقدها لأيام بقين من صفر سنة سبع وثلاثين، وأول من نطق بلا حكم إلا لله عروة بن أذينة، وتنوزع في القتلى فروى يحيى بن معين مائة ألف وعشرة آلاف من الفريقين في مائة وعشرة أيام، وروى الهيثم بن عدي والشرقي بن القطامي وأبو مخنف سبعين ألفاً فيهم خمسة وعشرون بدرياً، ورجح المسعودي أكثر من ذلك {cite:muruj-al-dhahab p. 682-685}"
  en: "After the copies of the Qur'an were raised, the document of arbitration was written between Ali and Mu'awiya: Abdallah ibn Qays and Amr ibn al-As were to judge between the community, and the decision would run until Ramadan {cite:tabari-tarikh-abu-al-fadl j.5 p.54}. A man from one side of the mosque cried: «No judgement but God's»; then men came forward one after another calling for arbitration, and Ali replied to them that judgement belongs to God {cite:tabari-tarikh-abu-al-fadl j.5 p.73}. The volume's index points to the meeting of the two arbiters at Dumat al-Jandal {cite:tabari-tarikh-abu-al-fadl j.5 p.627}. The people of Syria chose Amr ibn al-As, while al-Ash'ath and those with him insisted on Abu Musa despite Ali's objection that he was not trustworthy. The document stipulated that the two arbiters should give life to what the Qur'an gives life to and cause to die what it causes to die, and not follow their desires; the term was set until Ramadan. It was concluded a few days before the end of Safar in the year thirty-seven. Urwa ibn Udhayna was the first to utter «No judgement but God's». The death toll was disputed: Yahya ibn Ma'in reported one hundred and ten thousand from both sides, over one hundred and ten days; al-Haytham ibn Adi, al-Sharqi ibn al-Qatami and Abu Mikhnaf reported seventy thousand, among them twenty-five men of Badr; al-Mas'udi favoured a higher figure still {cite:muruj-al-dhahab p. 682-685}"
