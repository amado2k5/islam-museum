label: { ar: "التحكيم بعد صفين", en: "The arbitration after Siffin", es: "El arbitraje después de Siffin", fr: "L'arbitrage après Siffin" }
summary:
  ar: "بعد رفع المصاحف كُتبت صحيفة التحكيم بين علي ومعاوية، فيها أن يحكم عبد الله بن قيس وعمرو بن العاص بين الأمة، وأن يكون القضاء إلى رمضان {cite:tabari-tarikh-abu-al-fadl j.5 p.54}. وقال رجل من جانب المسجد: لا حكم إلا لله، ثم توالى رجال يحكّمون، فرد عليهم علي بأن الحكم لله {cite:tabari-tarikh-abu-al-fadl j.5 p.73}. ويشير فهرس الجزء إلى اجتماع الحكمين بدومة الجندل {cite:tabari-tarikh-abu-al-fadl j.5 p.627}. واختار أهل الشام عمرو بن العاص وأصر الأشعث ومن معه على أبي موسى رغم اعتراض علي وقوله ليس بثقة، وكتب في الصحيفة أن يحيي الحكمان ما أحيا القرآن ويميتا ما أمات ولا يتبعا الهوى، وجعل الأجل إلى رمضان وكان عقدها لأيام بقين من صفر سنة سبع وثلاثين، وأول من نطق بلا حكم إلا لله عروة بن أذينة، وتنوزع في القتلى فروى يحيى بن معين مائة ألف وعشرة آلاف من الفريقين في مائة وعشرة أيام، وروى الهيثم بن عدي والشرقي بن القطامي وأبو مخنف سبعين ألفاً فيهم خمسة وعشرون بدرياً، ورجح المسعودي أكثر من ذلك {cite:muruj-al-dhahab p. 682-685}"
  en: "After the copies of the Qur'an were raised, the document of arbitration was written between Ali and Mu'awiya: Abdallah ibn Qays and Amr ibn al-As were to judge between the community, and the decision would run until Ramadan {cite:tabari-tarikh-abu-al-fadl j.5 p.54}. A man from one side of the mosque cried: «No judgement but God's»; then men came forward one after another calling for arbitration, and Ali replied to them that judgement belongs to God {cite:tabari-tarikh-abu-al-fadl j.5 p.73}. The volume's index points to the meeting of the two arbiters at Dumat al-Jandal {cite:tabari-tarikh-abu-al-fadl j.5 p.627}. The people of Syria chose Amr ibn al-As, while al-Ash'ath and those with him insisted on Abu Musa despite Ali's objection that he was not trustworthy. The document stipulated that the two arbiters should give life to what the Qur'an gives life to and cause to die what it causes to die, and not follow their desires; the term was set until Ramadan. It was concluded a few days before the end of Safar in the year thirty-seven. Urwa ibn Udhayna was the first to utter «No judgement but God's». The death toll was disputed: Yahya ibn Ma'in reported one hundred and ten thousand from both sides, over one hundred and ten days; al-Haytham ibn Adi, al-Sharqi ibn al-Qatami and Abu Mikhnaf reported seventy thousand, among them twenty-five men of Badr; al-Mas'udi favoured a higher figure still {cite:muruj-al-dhahab p. 682-685}"
  es: "Después de que se levantaron las copias del Corán, se redactó el documento de arbitraje entre Ali y Mu'awiya: Abdallah ibn Qays y Amr ibn al-As debían juzgar entre la comunidad, y la decisión se extendería hasta Ramadán {cite:tabari-tarikh-abu-al-fadl j.5 p.54}. Un hombre de un lado de la mezquita gritó: «No hay juicio sino el de Dios»; entonces los hombres se acercaron uno tras otro pidiendo arbitraje, y Ali les respondió que el juicio pertenece a Dios {cite:tabari-tarikh-abu-al-fadl j.5 p.73}. El índice del volumen señala la reunión de los dos árbitros en Dumat al-Jandal {cite:tabari-tarikh-abu-al-fadl j.5 p.627}. El pueblo de Siria eligió a Amr ibn al-As, mientras que al-Ash'ath y los que estaban con él insistieron en Abu Musa a pesar de la objeción de Ali de que no era digno de confianza. El documento estipulaba que los dos árbitros debían dar vida a lo que el Corán da vida y causar la muerte a lo que causa la muerte, y no seguir sus deseos; el plazo se fijó hasta Ramadán. Se concluyó unos días antes del final de Safar en el año treinta y siete. Urwa ibn Udhayna fue el primero en pronunciar «No hay juicio sino el de Dios». El número de muertos fue disputado: Yahya ibn Ma'in informó de ciento diez mil de ambos bandos, durante ciento diez días; al-Haytham ibn Adi, al-Sharqi ibn al-Qatami y Abu Mikhnaf informaron de setenta mil, entre ellos veinticinco hombres de Badr; al-Mas'udi favoreció una cifra aún mayor {cite:muruj-al-dhahab p. 682-685}"
  fr: "Après la levée des exemplaires du Coran, un acte d'arbitrage fut rédigé entre Ali et Mu'awiya: Abdallah ibn Qays et Amr ibn al-As devaient trancher le différend entre les membres de la communauté, et leur décision resterait valable jusqu'à la fin du Ramadan (Tabari Tarikh Abu al-Fadl, vol. 5, p. 54). Un homme, depuis un côté de la mosquée, s'écria: « Il n'y a de jugement que celui de Dieu ! » Puis, des hommes s'avancèrent les uns après les autres pour demander un arbitrage, et Ali leur répondit que le jugement appartient à Dieu (Tabari Tarikh Abu al-Fadl, vol. 5, p. 73). L'index du volume mentionne la rencontre des deux arbitres à Dumat al-Jandal (Tabari Tarikh Abu al-Fadl, vol. 5, p. 627). Les Syriens choisirent Amr ibn al-As, tandis qu'al-Ash'ath et ses partisans insistèrent sur Abu Musa malgré l'objection d'Ali, qui le jugeait indigne de confiance. Le document stipulait que les deux arbitres devaient donner la vie à ce que le Coran donne la vie et faire mourir ce qu'il ordonne de mourir, sans se laisser guider par leurs désirs; le délai était fixé jusqu'au Ramadan. Il fut conclu quelques jours avant la fin du mois de Safar de l'an trente-sept. Urwa ibn Udhayna fut le premier à prononcer: « Nul jugement ne saurait être attribué à Dieu. » Le nombre de morts fut sujet à controverse: Yahya ibn Ma'in rapporta cent dix mille morts de part et d'autre, sur une période de cent dix jours; al-Haytham ibn Adi, al-Sharqi ibn al-Qatami et Abu Mikhnaf en rapportèrent soixante-dix mille, dont vingt-cinq hommes de Badr; al-Mas'udi avançait un chiffre encore plus élevé (voir: Muruj-al-Dhahab, p. 1). 682-685}"
