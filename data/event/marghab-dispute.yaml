id: event/marghab-dispute
class: event
kind: other
label: { ar: "نزاع المرغاب", en: "The Marghab Canal Dispute" }
summary:
  ar: "كانت القطيعة التي فيها المرغاب لهلال بن أحوز المازني أقطعه إياها يزيد بن عبد الملك وهي ثمانية آلاف جريب فحفر بشير بن عبيد الله بن أبي بكرة المرغاب والسواقي والمعترضات بالتغلب وسماه مرغاب مرو وقال هذه قطيعة لي فخاصمه حميري بن هلال فكتب خالد بن عبد الله القسري إلى مالك بن المنذر بن الجارود وهو على أحداث البصرة أن خلّ بين بشير وبين المرغاب وأرضه وذلك أن بشيراً أشخص إلى خالد فتظلم فقبل قوله وكان عمرو بن يزيد الأسيدي يمنى بحميري ويعينه."
  en: "The Marghab tract — eight thousand jarib — was Hilal ibn Ahwaz al-Mazini's grant from Yazid ibn Abd al-Malik; Bashir ibn Ubaydallah ibn Abi Bakra dug its canals by force, named it Marghab Marw and claimed 'this qati'a is mine'. Humayri ibn Hilal sued; Bashir had already complained to Khalid ibn Abdallah al-Qasri and won, so Khalid wrote Malik ibn al-Mundhir ibn al-Jarud on Basra's police: 'leave Bashir alone with the Marghab and its land' — while Amr ibn Yazid al-Usaydi sided with Humayri."
