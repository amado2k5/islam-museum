label: { ar: "نزاع المرغاب", en: "The Marghab Canal Dispute", es: "La disputa del canal de Marghab", fr: "Le différend du canal de Marghab" }
summary:
  ar: "كانت القطيعة التي فيها المرغاب لهلال بن أحوز المازني أقطعه إياها يزيد بن عبد الملك وهي ثمانية آلاف جريب فحفر بشير بن عبيد الله بن أبي بكرة المرغاب والسواقي والمعترضات بالتغلب وسماه مرغاب مرو وقال هذه قطيعة لي فخاصمه حميري بن هلال فكتب خالد بن عبد الله القسري إلى مالك بن المنذر بن الجارود وهو على أحداث البصرة أن خلّ بين بشير وبين المرغاب وأرضه وذلك أن بشيراً أشخص إلى خالد فتظلم فقبل قوله وكان عمرو بن يزيد الأسيدي يمنى بحميري ويعينه."
  en: "The Marghab tract — eight thousand jarib — was Hilal ibn Ahwaz al-Mazini's grant from Yazid ibn Abd al-Malik; Bashir ibn Ubaydallah ibn Abi Bakra dug its canals by force, named it Marghab Marw and claimed 'this qati'a is mine'. Humayri ibn Hilal sued; Bashir had already complained to Khalid ibn Abdallah al-Qasri and won, so Khalid wrote Malik ibn al-Mundhir ibn al-Jarud on Basra's police: 'leave Bashir alone with the Marghab and its land' — while Amr ibn Yazid al-Usaydi sided with Humayri."
  es: "La zona de Marghab (ocho mil jarib) fue una concesión que Hilal ibn Ahwaz al-Mazini recibió de Yazid ibn Abd al-Malik; Bashir ibn Ubaydallah ibn Abi Bakra cavó sus canales por la fuerza, los llamó Marghab Marw y afirmó que \"esta qati'a es mía\". Humayri ibn Hilal presentó una demanda; Bashir ya se había quejado ante Khalid ibn Abdallah al-Qasri y había ganado, por lo que Khalid escribió a Malik ibn al-Mundhir ibn al-Jarud sobre la policía de Basora: \"dejen a Bashir en paz con Marghab y su tierra\", mientras que Amr ibn Yazid al-Usaydi se puso del lado de Humayri."
  fr: "Le traité de Marghab – huit mille jarib – était une concession de Hilal ibn Ahwaz al-Mazini de Yazid ibn Abd al-Malik; Bashir ibn Ubaydallah ibn Abi Bakra a creusé ses canaux de force, l'a nommé Marghab Marw et a affirmé que « cette qati'a est à moi ». Humayri ibn Hilal a poursuivi en justice; Bashir s'était déjà plaint à Khalid ibn Abdallah al-Qasri et avait gagné, alors Khalid a écrit à Malik ibn al-Mundhir ibn al-Jarud à propos de la police de Bassorah: « laissez Bashir seul avec le Marghab et ses terres » – tandis qu'Amr ibn Yazid al-Usaydi s'est rangé du côté de Humayri."
