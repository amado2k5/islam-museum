label: { ar: "بناء حصن المصيصة", en: "The Building of the Fortress of Masisa", fr: "La construction de la forteresse de Massissa", es: "La construcción de la fortaleza de Masisa", ur: "مسیسا کے قلعے کی عمارت" }
summary:
  ar: "عند البلاذري عن الواقدي وغيره: لما كانت سنة 84 غزا على الصائفة عبد الله بن عبد الملك بن مروان فدخل من درب أنطاكية وأتى المصيصة فبنى حصنها على أساسه القديم ووضع بها سكاناً من الجند فيهم ثلاثمائة رجل انتخبهم من ذوي البأس والنجدة المعروفين — ولم يكن المسلمون سكنوها قبل ذلك — وبنى فيها مسجداً فوق تل الحصن؛ وقال أبو الخطاب الأزدي أول من ابتنى حصنها في الإسلام عبد الملك بن مروان على يد ابنه عبد الله سنة 84 فتم بناؤها وشحنها سنة 85، وكانت في الحصن كنيسة جملت هرياً وكانت الطوالع من أنطاكية تطلع عليها في كل عام فتشتوا بها ثم تنصرف وعدة من كان يطلع إليها ألف وخمسمائة إلى الألفين؛ وشخص عمر بن عبد العزيز حتى نزل هري المصيصة وأراد هدمها وهدم الحصون بينها وبين أنطاكية وقال «أكره أن تحاصر الروم أهلها» فأعلمه الناس أنها إنما عُمرت لتدفع من بها عن أنطاكية وأنه إن أخربها لم يكن للعدو ناهية دون أنطاكية فأمسك وبنى لأهلها مسجداً جامعاً من ناحية كفربيا واتخذ فيه صهريجاً وكان اسمه عليه مكتوباً — وهو يدعى مسجد الحصن وخرب في خلافة المعتصم —؛ ثم بنى هشام بن عبد الملك الربض ثم بنى مروان بن محمد الخصوص في شرقي جيحان وبنى عليها حائطاً وأقام عليه باب خشب وخندق خندقاً، فلما استخلف أبو العباس فرض بالمصيصة أربع مائة رجل زيادة في شحنتها وأقطعهم."
  en: "In al-Baladhuri from al-Waqidi and others: in year 84 Abdullah ibn Abd al-Malik ibn Marwan led the summer raid, entering by the pass of Antioch and coming to Masisa, where he built its fortress on the ancient foundation and settled garrison troops among them three hundred picked men of known valour and stoutness — the Muslims had never dwelt there before — and built a mosque atop the fortress hill; Abu al-Khattab al-Azdi says the first to build its fortress in Islam was Abd al-Malik through his son Abdullah in year 84, its building and garrisoning complete in year 85; the fortress held a church called Herya which the summer columns from Antioch would reach and winter at yearly, numbering a thousand five hundred to two thousand; Umar ibn Abd al-Aziz went out to Herya-Masisa meaning to demolish it and the forts between it and Antioch, saying 'I hate for the Byzantines to besiege its people', until the people showed him it was populated only to shield Antioch and that razing it would leave the enemy no barrier before it, so he held back and built them a congregational mosque by Kafarbayya with a cistern bearing his name — called the fortress mosque, ruined in al-Mu'tasim's caliphate; then Hisham built the rabad, Marwan ibn Muhammad built the suburb east of the Jayhan with a wall, timber gate and moat, and Abu al-Abbas set four hundred more men at Masisa, granting them estates."
  fr: "Chez al-Baladhuri, d'après al-Waqidi et d'autres : en l'an 84, Abdullah ibn Abd al-Malik ibn Marwan mena l'expédition d'été, entrant par le défilé d'Antioche et venant à Massissa, où il bâtit sa forteresse sur l'ancienne fondation et installa des troupes de garnison, parmi lesquelles trois cents hommes choisis d'une valeur et d'une robustesse reconnues (les musulmans n'y avaient jamais habité auparavant), et bâtit une mosquée au sommet de la colline de la forteresse ; Abu al-Khattab al-Azdi dit que le premier à bâtir sa forteresse en islam fut Abd al-Malik, par son fils Abdullah, en l'an 84, sa construction et sa garnison étant achevées en l'an 85 ; la forteresse abritait une église appelée Herya, que les colonnes d'été venues d'Antioche atteignaient chaque année pour y hiverner, au nombre de mille cinq cents à deux mille ; Umar ibn Abd al-Aziz se rendit à Herya-Massissa avec l'intention de la démolir, ainsi que les forts entre elle et Antioche, disant : « Je déteste que les Byzantins assiègent ses habitants », jusqu'à ce que les gens lui montrent qu'elle n'était peuplée que pour protéger Antioche et que la raser ne laisserait à l'ennemi aucune barrière devant celle-ci ; il s'en abstint donc et leur bâtit une mosquée cathédrale près de Kafarbayya avec une citerne portant son nom, appelée la mosquée de la forteresse, ruinée sous le califat d'al-Mu'tasim ; puis Hisham bâtit le rabad, Marwan ibn Muhammad bâtit le faubourg à l'est du Jayhan avec un mur, une porte de bois et un fossé, et Abu al-Abbas plaça quatre cents hommes de plus à Massissa, en leur concédant des domaines."
  es: "En al-Baladhuri de al-Waqidi y otros: en el año 84 Abdullah ibn Abd al-Malik ibn Marwan dirigió la incursión de verano, entrando por el paso de Antioquía y llegando a Masisa, donde construyó su fortaleza sobre los cimientos antiguos y estableció tropas de guarnición entre ellas trescientos hombres escogidos de conocido valor y robustez —los musulmanes nunca habían habitado allí antes— y construyó una mezquita en la cima de la colina de la fortaleza; Abu al-Khattab al-Azdi dice que el primero en construir su fortaleza en el Islam fue Abd al-Malik a través de su hijo Abdullah en el año 84, su construcción y guarnición completadas en el año 85; la fortaleza albergaba una iglesia llamada Herya a la que las columnas de verano de Antioquía llegaban y donde pasaban el invierno cada año, con un número de entre mil quinientos y dos mil; Umar ibn Abd al-Aziz salió hacia Herya-Masisa con la intención de demolerla, junto con las fortalezas que la separaban de Antioquía, diciendo: \"Odio que los bizantinos asedien a su gente\". Sin embargo, la gente le demostró que estaba poblada únicamente para proteger a Antioquía y que arrasarla no dejaría ninguna barrera al enemigo. Entonces, se contuvo y construyó una mezquita congregacional junto a Kafarbayya con una cisterna que llevaba su nombre, llamada la mezquita fortaleza, que quedó en ruinas durante el califato de al-Mu'tasim. Luego, Hisham construyó el rabad, Marwan ibn Muhammad construyó el suburbio al este del Jayhan con una muralla, una puerta de madera y un foso, y Abu al-Abbas puso a cuatrocientos hombres más en Masisa, otorgándoles propiedades."
  ur: "البلادوری میں الواقدی اور دیگر سے لکھا ہے: 84 میں عبداللہ ابن عبد الملک ابن مروان نے موسم گرما کے چھاپے کی قیادت کی، انطاکیہ کے درہ سے داخل ہوا اور مسیسا آیا، جہاں اس نے قدیم بنیادوں پر اس کا قلعہ تعمیر کیا اور ان کے درمیان تین سو چنے ہوئے فوجی دستے کو آباد کیا - وہاں مسلمانوں نے پہلے کبھی ایک مسجد تعمیر نہیں کی تھی اور اس سے پہلے مسلمانوں نے مسجد کی تعمیر نہیں کی تھی۔ قلعہ پہاڑی؛ ابو الخطاب العزدی کہتے ہیں کہ اسلام میں سب سے پہلے اس کا قلعہ عبدالملک نے اپنے بیٹے عبداللہ کے ذریعے سن 84 میں بنایا، اس کی عمارت اور چوکی سن 85 میں مکمل ہوئی۔ قلعہ میں ہیریا نامی ایک گرجا گھر تھا جہاں انطاکیہ سے موسم گرما کے کالم پہنچتے تھے اور سالانہ موسم سرما، جن کی تعداد ایک ہزار پانچ سو سے دو ہزار تھی۔ عمر بن عبد العزیز حریۃ المیسیہ کی طرف نکلا جس کا مطلب تھا کہ اسے اور اس کے اور انطاکیہ کے درمیان کے قلعوں کو گرا دیا جائے اور کہا کہ 'مجھے بازنطینیوں کے اس کے لوگوں کا محاصرہ کرنے سے نفرت ہے'، یہاں تک کہ لوگوں نے اسے دکھایا کہ یہ صرف انطاکیہ کو بچانے کے لیے آباد ہے اور اسے مسمار کرنے سے دشمن کو ان کے سامنے کوئی رکاوٹ نہیں رہے گی، اس لیے اس نے ایک مسجد کعبہ کو پیچھے سے روک کر مسجد تعمیر کی۔ اس کا نام رکھنے والا حوض — جسے قلعہ کی مسجد کہا جاتا ہے، المعتصم کی خلافت میں تباہ ہو گئی تھی۔ پھر ہشام نے رباد تعمیر کیا، مروان بن محمد نے جیحان کے مشرق میں نواحی علاقے کو دیوار، لکڑی کے دروازے اور کھائی کے ساتھ تعمیر کیا، اور ابو العباس نے مسیصہ میں مزید چار سو آدمیوں کو جاگیریں عطا کیں۔"
