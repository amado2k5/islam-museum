label: { ar: "بناء حصن المصيصة", en: "The Building of the Fortress of Masisa" }
summary:
  ar: "عند البلاذري عن الواقدي وغيره: لما كانت سنة 84 غزا على الصائفة عبد الله بن عبد الملك بن مروان فدخل من درب أنطاكية وأتى المصيصة فبنى حصنها على أساسه القديم ووضع بها سكاناً من الجند فيهم ثلاثمائة رجل انتخبهم من ذوي البأس والنجدة المعروفين — ولم يكن المسلمون سكنوها قبل ذلك — وبنى فيها مسجداً فوق تل الحصن؛ وقال أبو الخطاب الأزدي أول من ابتنى حصنها في الإسلام عبد الملك بن مروان على يد ابنه عبد الله سنة 84 فتم بناؤها وشحنها سنة 85، وكانت في الحصن كنيسة جملت هرياً وكانت الطوالع من أنطاكية تطلع عليها في كل عام فتشتوا بها ثم تنصرف وعدة من كان يطلع إليها ألف وخمسمائة إلى الألفين؛ وشخص عمر بن عبد العزيز حتى نزل هري المصيصة وأراد هدمها وهدم الحصون بينها وبين أنطاكية وقال «أكره أن تحاصر الروم أهلها» فأعلمه الناس أنها إنما عُمرت لتدفع من بها عن أنطاكية وأنه إن أخربها لم يكن للعدو ناهية دون أنطاكية فأمسك وبنى لأهلها مسجداً جامعاً من ناحية كفربيا واتخذ فيه صهريجاً وكان اسمه عليه مكتوباً — وهو يدعى مسجد الحصن وخرب في خلافة المعتصم —؛ ثم بنى هشام بن عبد الملك الربض ثم بنى مروان بن محمد الخصوص في شرقي جيحان وبنى عليها حائطاً وأقام عليه باب خشب وخندق خندقاً، فلما استخلف أبو العباس فرض بالمصيصة أربع مائة رجل زيادة في شحنتها وأقطعهم."
  en: "In al-Baladhuri from al-Waqidi and others: in year 84 Abdullah ibn Abd al-Malik ibn Marwan led the summer raid, entering by the pass of Antioch and coming to Masisa, where he built its fortress on the ancient foundation and settled garrison troops among them three hundred picked men of known valour and stoutness — the Muslims had never dwelt there before — and built a mosque atop the fortress hill; Abu al-Khattab al-Azdi says the first to build its fortress in Islam was Abd al-Malik through his son Abdullah in year 84, its building and garrisoning complete in year 85; the fortress held a church called Herya which the summer columns from Antioch would reach and winter at yearly, numbering a thousand five hundred to two thousand; Umar ibn Abd al-Aziz went out to Herya-Masisa meaning to demolish it and the forts between it and Antioch, saying 'I hate for the Byzantines to besiege its people', until the people showed him it was populated only to shield Antioch and that razing it would leave the enemy no barrier before it, so he held back and built them a congregational mosque by Kafarbayya with a cistern bearing his name — called the fortress mosque, ruined in al-Mu'tasim's caliphate; then Hisham built the rabad, Marwan ibn Muhammad built the suburb east of the Jayhan with a wall, timber gate and moat, and Abu al-Abbas set four hundred more men at Masisa, granting them estates."
