summary:
  ar: "في ٣٠ نوفمبر ٦٤٢هـ/١٢٤٤م لقي جلال الدين في طرق قونية الدراويشَ المتجول [[person/shams-tabrizi|شمس الدين التبريزي]]، فكانت اللحظة الفاصلة في حياته؛ عاش الصوفيان متلازمين أشهراً فأهمل جلال الدين أصحابه وأهله حتى أضطرّ الغِيرةُ فيهم شمساً إلى مفارقة البلدة في فبراير ٦٤٣هـ/١٢٤٦م، فردّه [[person/sultan-walad|سلطان ولد]] ابنُه الأكبر من الشام {cite:britannica-rumi}."
  en: "On 30 November 642/1244 Jalal al-Din met the wandering dervish Shams al-Din of Tabriz in the streets of Konya — the decisive moment of his life. The two mystics lived closely together for months, until Rumi's scandalised entourage forced Shams to leave the town in February 1246; Rumi's eldest son Sultan Walad eventually brought him back from Syria {cite:britannica-rumi}."
  ur: "30 نومبر 642ھ/1244ء کو جلال الدین کی قونیہ کی گلیوں میں آوارہ درویش شمس الدین تبریزی سے ملاقات ہوئی — ان کی زندگی کا فیصلہ کن لمحہ۔ دونوں عارف مہینوں تک ساتھ رہے، یہاں تک کہ رومی کے ناراض حاشیہ برداروں نے فروری 643ھ/1246ء میں شمس کو شہر چھوڑنے پر مجبور کر دیا؛ ان کے بڑے بیٹے سلطان ولد آخرکار شمس کو شام سے واپس لے آئے۔"
