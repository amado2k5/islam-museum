label: { ar: "خلع الخطبة لخليفتين وخلو المنابر", en: "Dropping the Khutba for Two Caliphs and the Empty Pulpits", es: "Abandonando la jutba por dos califas y los púlpitos vacíos", fr: "Abandonner la khutba pour deux califes et les chaires vides", ur: "دو خلفاء اور خالی منبروں کے لیے خطبہ چھوڑنا" }
summary:
  ar: "لما مات المستكفي بقوص عهد إلى ابنه أحمد فلم يلتفت السلطان إلى ذلك وبايع إبراهيم ابن عمه ولقبه الواثق وكان جده الحاكم قد عهد إليه ثم عدل عنه لما هو فيه من الانهماك في اللعب ومعاشرة الأراذل، وقام قاضي القضاة أبو عمر بن جماعة في صرف رأي السلطان عن إقامة الخطبة باسم الواثق فلم يفعل فاتفق الرأيان على ترك الخطبة للاثنين واكتفي فيها بمجرد اسم السلطان فترجل بموت المستكفي اسم الخلافة عن المنابر كأنه ما علا ذروتها وخلا الدعاء للخلفاء من المحاريب كأنه ما قرع بابها ومروتها فكأنما كان آخر خلفاء بني العباس وشعارها عليه لباس الحداد حتى حضرت السلطان الوفاة فندم وعزل إبراهيم وبايع ولي العهد أحمد ولقب الحاكم في أول المحرم سنة اثنتين وأربعين {cite:tarikh-khulafa-minhaj-1434 p. 739-741}."
  en: "On al-Mustakfi's death at Qus his will named his son Ahmad; the sultan ignored it and hailed his cousin Ibrahim al-Wathiq — a dissolute man his grandfather had passed over. Chief qadi Ibn Jama'a strove to turn the sultan from the khutba in his name and failed, so they agreed to drop BOTH names and keep the sultan's alone: 'the caliphate's name stepped down from the minbars as if it had never climbed, the prayer for caliphs emptied from the mihrabs as if it had never knocked' — till the sultan's deathbed repentance restored Ahmad as al-Hakim, Muharram 741 {cite:tarikh-khulafa-minhaj-1434 p. 739-741}."
  es: "Tras la muerte de al-Mustakfi en Qus, su testamento nombró a su hijo Ahmad; el sultán lo ignoró y aclamó a su primo Ibrahim al-Wathiq, un hombre disoluto al que su abuelo había pasado por alto. El cadí principal Ibn Jama'a intentó que el sultán dejara de pronunciar el sermón en su nombre, pero fracasó, por lo que acordaron eliminar AMBOS nombres y conservar solo el del sultán: «el nombre del califato descendió de los minbares como si nunca hubiera ascendido, la oración por los califas se vació de los mihrabs como si nunca hubiera llamado», hasta que el arrepentimiento del sultán en su lecho de muerte restauró a Ahmad como al-Hakim, Muharram 741 {cite:tarikh-khulafa-minhaj-1434 p. 739-741}."
  fr: "À la mort d'al-Mustakfi à Qos, son testament désigna son fils Ahmad; le sultan l'ignora et salua son cousin Ibrahim al-Wathiq, un homme dissolu que son grand-père avait ignoré. Le grand cadi Ibn Jama'a tenta en vain de dissuader le sultan de prononcer le sermon en son nom. Ils convinrent alors de supprimer les deux noms et de ne conserver que celui du sultan: « le nom du califat descendit des minbars comme s'il n'y avait jamais figuré, la prière pour les califes se vida des mihrabs comme si elle n'y avait jamais résonné » – jusqu'à ce que le repentir du sultan sur son lit de mort rétablisse Ahmad dans ses fonctions d'al-Hakim, en Muharram 741 (cite: tarikh-khulafa-minhaj-1434 p. 739-741)."
  ur: "المستقفی کی قس میں وفات پر اس نے اپنے بیٹے کا نام احمد رکھا۔ سلطان نے اسے نظر انداز کیا اور اپنے کزن ابراہیم الواثیق کی تعریف کی - ایک منتشر آدمی جو اس کے دادا انتقال کر گئے تھے۔ چیف قاضی ابن جماعہ نے سلطان کو اپنے نام کے خطبے سے پھیرنے کی کوشش کی اور ناکام رہے، چنانچہ وہ دونوں ناموں کو چھوڑ کر سلطان کو اکیلا رکھنے پر راضی ہو گئے: 'خلافت کا نام منبروں سے اس طرح اترا جیسے کبھی چڑھا ہی نہ ہو، خلیفہ کی دعا اس طرح خالی ہو گئی جیسے کبھی میحرہ سے خالی نہ ہوئی ہو'۔ سلطان کی بستر مرگ پر توبہ نے احمد کو الحکیم کے طور پر بحال کر دیا، محرم 741 739-741}۔"
