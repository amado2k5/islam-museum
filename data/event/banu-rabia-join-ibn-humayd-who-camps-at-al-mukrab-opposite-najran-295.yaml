id: event/banu-rabia-join-ibn-humayd-who-camps-at-al-mukrab-opposite-najran-295
class: event
kind: other
label:
  ar: "بنو ربيعة ينضمون إلى ابن حميد الذي يعسكر بالمكراب مقابل نجران، 295هـ"
  en: "Banu Rabi'a join Ibn Humayd, who camps at al-Mukrab opposite Najran, 295 AH, p. 366"
  ur: "بنو ربیعہ کا ابن حمید سے آ ملنا، جو نجران کے مقابل المکراب میں ٹھہرتا ہے، 295ھ، ص366"
  fr: "Les Banu Rabi'a rejoignent Ibn Humayd, qui campe à al-Mukrab face à Najran, 295 H, p. 366"
summary:
  ar: "بعد الواقعة دخل ابن حميد وأصحابه قرية ميناس، فأعلموا بني ربيعة بما كان من الحدث، فأجابوهم إلى القيام معهم، وأمروا ابن حميد أن يعسكر بقرية المكراب مقابل قرية نجران، وأخبروه أن بني الحارث ستجتمع إليه قبل المساء."
  en: "After the encounter, Ibn Humayd and his companions entered the village of Maynas and told Banu Rabi'a what had happened. They agreed to stand with him, and told him to camp at the village of al-Mukrab, opposite Najran, saying that Banu al-Harith would gather to him before evening."
  ur: "اس جھڑپ کے بعد ابن حمید اور اس کے ساتھی میناس کے گاؤں میں داخل ہوئے اور بنو ربیعہ کو بتایا کہ کیا ہوا۔ انہوں نے ساتھ دینے کی ہامی بھری، اور ابن حمید سے کہا کہ نجران کے مقابل المکراب کے گاؤں میں ٹھہرے، اور یہ بھی کہ بنو حارث شام سے پہلے اس کے پاس جمع ہو جائیں گے۔"
  fr: "Après l'affrontement, Ibn Humayd et ses compagnons entrèrent dans le village de Maynas et racontèrent aux Banu Rabi'a ce qui s'était passé. Ils acceptèrent de se tenir avec lui et lui dirent de camper au village d'al-Mukrab, face à Najran, disant que les Banu al-Harith se rassembleraient autour de lui avant le soir."
