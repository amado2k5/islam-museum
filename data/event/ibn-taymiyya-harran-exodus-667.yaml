id: event/ibn-taymiyya-harran-exodus-667
class: event
kind: migration
label:
  ar: "خروج آل تيمية من حران إلى دمشق، ٦٦٧هـ/١٢٦٩م"
  en: "The Taymiyya family's flight from Harran to Damascus, 667/1269"
  ur: "آل تیمیہ کا حران سے دمشق کو رخصتی، 667ھ/1269ء"
  es: "La huida de la familia Taymiyya de Harran a Damasco, 667/1269"
  fr: "La fuite de la famille Taymiyya de Harran à Damas, 667/1269"
  tr: "Taymiyyah ailesinin Harran'dan Şam'a göçü, Hicri 667/Miladi 1269"
  id: "Keberangkatan keluarga Taymiyyah dari Harran ke Damaskus, 667 H/1269 M"
summary:
  ar: "لما دنا التتر من حران سنة ٦٦٧هـ/١٢٦٩م اضطر أهلها إلى النزوح، فخرج عبد الحليم بن تيمية بأولاده الأربعة — ومنهم أحمد، ابن ست سنين — إلى دمشق، حيث صار أبوه مدير المدرسة السكرية وتتلمذ الولد على أهلها ومنهم شمس الدين عبد الرحمن المقدسي، أول قاضي قضاة حنابلة الشام بعد إصلاح القضاء في عهد بيبرس {cite:encyclopaedia-of-islam-2 vol. 3 p. 983}."
  en: "As the Mongols closed on Harran in 667/1269 its people were driven to flee; Abd al-Halim ibn Taymiyya took refuge in Damascus with his four sons — among them Ahmad, aged six. There his father directed the Sukkariyya madrasa, and the boy was educated under Damascene masters including Shams al-Din Abd al-Rahman al-Maqdisi, first Hanbali qadi al-qudat of Syria after Baybars' reform of the judiciary {cite:encyclopaedia-of-islam-2 vol. 3 p. 983}."
  ur: "667ھ/1269ء میں جب منگول حران کے قریب پہنچے تو اہل شہر کو نقل مکانی پر مجبور ہونا پڑا؛ عبد الحلیم ابن تیمیہ اپنے چار بیٹوں سمیت — جن میں چھ سالہ احمد بھی تھا — دمشق جا پناہ گزین ہوا۔ وہاں اس کے والد مدرسہ سکریہ کے منتظم رہے اور لڑکے نے دمشق کے علماء سے تعلیم حاصل کی، جن میں شمس الدین عبد الرحمٰن مقدسی شامل ہیں، بیبرس کی عدالتی اصلاح کے بعد شام کے پہلے حنبلی قاضی القضاة {cite:encyclopaedia-of-islam-2 vol. 3 p. 983}۔"
  es: "Cuando los mongoles se acercaron a Harran en 667/1269, su población se vio obligada a huir; Abd al-Halim ibn Taymiyya se refugió en Damasco con sus cuatro hijos, entre ellos Ahmad, de seis años. Allí, su padre dirigió la madrasa Sukkariyya, y el niño fue educado por maestros damascenos, incluido Shams al-Din Abd al-Rahman al-Maqdisi, primer cadí al-qudat hanbalí de Siria tras la reforma judicial de Baybars {cite:encyclopaedia-of-islam-2 vol. 3 p. 983}."
  fr: "Lorsque les Mongols approchèrent de Harran en 667/1269, ses habitants furent contraints à la fuite; Abd al-Halim ibn Taymiyya se réfugia à Damas avec ses quatre fils, dont Ahmad, âgé de six ans. Son père y dirigeait la madrasa Sukkariyya, et le garçon y reçut une éducation auprès de maîtres damascènes, notamment Shams al-Din Abd al-Rahman al-Maqdisi, premier cadi al-qudat hanbalite de Syrie après la réforme judiciaire de Baybars (voir: Encyclopaedia of Islam, vol. 3, p. 983)."
  tr: "Tatarlar Hicri 667/Miladi 1269 yılında Harran'a yaklaşınca, halkı hicret etmek zorunda kaldı. Bunun üzerine Abdül Halim İbn Taymiyye, altı yaşında olan Ahmed de dahil olmak üzere dört çocuğuyla birlikte Şam'a gitti. Babası orada El-Sukariye Okulu'nun müdürü oldu ve çocuk, aralarında Baybars dönemindeki yargı reformundan sonra Levant Hanbelilerinin ilk Başkadı olan Şemseddin Abdülrahman el-Makdisi'nin de bulunduğu okul mensuplarından eğitim gördü. {cite:encyclopaedia-of-islam-2 vol. 3 p. 983}"
  id: "Ketika bangsa Tatar mendekati Harran pada tahun 667 H/1269 M, penduduknya terpaksa berhijrah. Maka Abdul Halim Ibn Taymiyyah pergi bersama keempat anaknya - termasuk Ahmad, yang berusia enam tahun - ke Damaskus, di mana ayahnya menjadi direktur Sekolah Al-Sukariyyah dan anak laki-laki itu belajar di bawah bimbingan para guru di sekolah tersebut, termasuk Shams al-Din Abdul Rahman al-Maqdisi, Ketua Hakim pertama mazhab Hanbali di Levant setelah reformasi peradilan pada masa pemerintahan Baybars {cite:encyclopaedia-of-islam-2 vol. 3 p. 983}."
