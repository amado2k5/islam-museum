id: event/nasai-leaves-misr-302
class: event
kind: other
label:
  ar: "خروج النسائي من مصر إلى دمشق في ذي القعدة ٣٠٢هـ"
  en: "Al-Nasa'i leaves Egypt for Damascus, Dhu al-Qa'da 302/915"
  ur: "نسائی کا مصر سے دمشق کی طرف روانگی، ذیقعدہ 302ھ/915ء"
summary:
  ar: "خرج النسائي من مصر في آخر عمره إلى دمشق في شهر ذي القعدة سنة اثنتين وثلاثمائة، وقال الدارقطني إنه خرج حاجاً {cite:tarikh-islam-dhahabi p. 109} {cite:tazkirat-al-huffaz j.2 p. 620}؛ وكان قد فارق مصر بعد أن امتّحن فيه الناس على حديثه واستشهد بمقالته في الرجال {cite:wafayat-ayan i p. 26}."
  en: "In the last year of his life al-Nasa'i left Egypt for Damascus in Dhu al-Qa'da 302/915, and al-Daraqutni says he set out on hajj {cite:tarikh-islam-dhahabi p. 109} {cite:tazkirat-al-huffaz j.2 p. 620}; he left Egypt after having taught there, his learning and his narrator criticism celebrated {cite:wafayat-ayan i p. 26}."
  ur: "عمر کے آخری حصے میں نسائی ذیقعدہ 302ھ/915ء میں مصر سے دمشق روانہ ہوئے، اور دارقطنی کے مطابق وہ حج کے لیے نکلے تھے {cite:tarikh-islam-dhahabi p. 109} {cite:tazkirat-al-huffaz j.2 p. 620}؛ ان کے علم اور علمِ رجال پر انہیں مصر میں بھرپور شہرت حاصل تھی {cite:wafayat-ayan i p. 26}۔"
