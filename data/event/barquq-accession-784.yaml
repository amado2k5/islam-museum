label: { ar: "تسلطن برقوق أول الجراكسة", en: "Barquq's accession as the first Circassian sultan", ur: "برقوق کی تخت نشینی بطور پہلا چرکسی سلطان", fr: "L'avènement de Barquq, premier sultan circassien", es: "La ascensión de Barquq como el primer sultán circasiano" }
summary:
  ar: "وفي رمضان سنة أربع وثمانين خلع الصالح حاجي وتسلطن برقوق ولقب الظاهر وهو أول من تسلطن من الجراكسة، وفي رجب سنة خمس وثمانين قبض برقوق على الخليفة المتوكل وخلعه وحبسه بقلعة الجبل وبويع بالخلافة عمر بن إبراهيم بن المستمسك ولقب الواثق بالله ثم ندم برقوق على ما فعل بالمتوكل فأخرجه من الحبس وأعاده إلى الخلافة وخلع زكريا المستعصم، وفي صفر سنة اثنتين وتسعين أخرج برقوق من الحبس وعاد إلى ملكه فاستمر إلى أن مات في شوال سنة إحدى وثمان مئة وأقيم مكانه ابنه فرج ولقب الناصر {cite:tarikh-khulafa-minhaj-1434 p. 760-761}."
  en: "In Ramadan 784 Barquq took the sultanate as al-Zahir — the FIRST of the Circassians. In Rajab 785 he seized, deposed and citadel-imprisoned al-Mutawakkil, hailing Umar al-Wathiq then Zakariya al-Musta'sim; repenting, he freed and restored al-Mutawakkil. Imprisoned again then freed in 792, he ruled till his death in Shawwal 801, when his son Faraj rose as al-Nasir {cite:tarikh-khulafa-minhaj-1434 p. 760-761}."
  fr: "En Ramadan 784, Barquq prit le sultanat sous le titre d'al-Zahir, le PREMIER des Circassiens. En Rajab 785, il saisit, déposa et emprisonna à la Citadelle al-Mutawakkil, proclamant Umar al-Wathiq puis Zakariya al-Musta'sim ; se repentant, il libéra et rétablit al-Mutawakkil. Emprisonné à son tour puis libéré en 792, il régna jusqu'à sa mort en Shawwal 801, quand son fils Faraj s'éleva sous le nom d'al-Nasir {cite:tarikh-khulafa-minhaj-1434 p. 760-761}."
  es: "En Ramadán de 784, Barquq tomó el sultanato como al-Zahir, el PRIMERO de los circasianos. En Rajab de 785, capturó, depuso y encarceló en la ciudadela a al-Mutawakkil, aclamando a Umar al-Wathiq y luego a Zakariya al-Musta'sim; arrepentido, liberó y restituyó a al-Mutawakkil. Encarcelado de nuevo y liberado en 792, gobernó hasta su muerte en Shawwal de 801, cuando su hijo Faraj ascendió al trono como al-Nasir {cite:tarikh-khulafa-minhaj-1434 p. 760-761}."
