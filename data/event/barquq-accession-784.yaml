label: { ar: "تسلطن برقوق أول الجراكسة" }
summary:
  ar: "وفي رمضان سنة أربع وثمانين خلع الصالح حاجي وتسلطن برقوق ولقب الظاهر وهو أول من تسلطن من الجراكسة، وفي رجب سنة خمس وثمانين قبض برقوق على الخليفة المتوكل وخلعه وحبسه بقلعة الجبل وبويع بالخلافة عمر بن إبراهيم بن المستمسك ولقب الواثق بالله ثم ندم برقوق على ما فعل بالمتوكل فأخرجه من الحبس وأعاده إلى الخلافة وخلع زكريا المستعصم، وفي صفر سنة اثنتين وتسعين أخرج برقوق من الحبس وعاد إلى ملكه فاستمر إلى أن مات في شوال سنة إحدى وثمان مئة وأقيم مكانه ابنه فرج ولقب الناصر {cite:tarikh-khulafa-minhaj-1434 p. 760-761}."
  en: "In Ramadan 784 Barquq took the sultanate as al-Zahir — the FIRST of the Circassians. In Rajab 785 he seized, deposed and citadel-imprisoned al-Mutawakkil, hailing Umar al-Wathiq then Zakariya al-Musta'sim; repenting, he freed and restored al-Mutawakkil. Imprisoned again then freed in 792, he ruled till his death in Shawwal 801, when his son Faraj rose as al-Nasir {cite:tarikh-khulafa-minhaj-1434 p. 760-761}."
