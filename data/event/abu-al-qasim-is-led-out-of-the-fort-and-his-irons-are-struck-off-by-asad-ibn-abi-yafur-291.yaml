id: event/abu-al-qasim-is-led-out-of-the-fort-and-his-irons-are-struck-off-by-asad-ibn-abi-yafur-291
class: event
kind: other
label:
  ar: خروج أبي القاسم من القلعة وفك أسعد بن أبي يعفر قيده، صفر 291هـ
  en: Abu al-Qasim is led out of the fort and As'ad ibn Abi Ya'fur has his irons struck off, Safar 291 AH
  fr: "Abu al-Qasim sort du fort et As'ad ibn Abi Ya'fur fait briser ses fers, safar 291 de l’hégire"
  ur: ابو القاسم کا قلعے سے نکلنا اور اسعد بن ابی یعفر کے ہاں ان کی بیڑیوں کا کھلنا، صفر 291ھ
  es: "Abu al-Qasim es sacado de la fortaleza y a As'ad ibn Abi Ya'fur le quitan los grilletes, Safar 291 AH."
  tr: "Ebu el-Kâsım kaleden ayrıldı ve Esad ibn Ebu Yafur zincirlerinden kurtuldu, Safar 291 Hicri."
  id: "Abu al-Qasim meninggalkan benteng dan As'ad ibn Abi Ya'fur membebaskan dirinya dari belenggu, Safar 291 H."
summary:
  ar: يخرج أبو القاسم وصاحبه من باب الدار بلا ثياب، فيستر الأعراب عليهما، ويلقاهما أسعد بن أبي يعفر فينزل عن بغله ويسلم عليه ويأمره بركوبه، ثم يفك الحديد من أبي القاسم في مجلس ابن خلف بالقلعة بعد تعب، ويتبرك أسعد بمسّه، ويبيتون في بيت بوس.
  en: Abu al-Qasim and his companion leave by the door of the house with nothing on them, Bedouin throw clothes over them, As'ad ibn Abi Ya'fur meets them, dismounts from his mule, greets him and has him ride it; the irons are then taken off Abu al-Qasim in Ibn Khalaf's council room in the fort after some trouble, As'ad seeks blessing by touching him, and they spend the night at Bayt Bus.
  fr: "Abu al-Qasim et son compagnon sortent par la porte de la maison sans rien sur eux ; des Bédouins leur jettent des vêtements. As'ad ibn Abi Ya'fur les rencontre, descend de sa mule, le salue et l’y fait monter ; les fers d’Abu al-Qasim sont ensuite retirés avec difficulté dans la salle du conseil d’Ibn Khalaf, au fort. As'ad recherche une bénédiction en le touchant, et ils passent la nuit à Bayt Bus."
  ur: ابو القاسم اور ان کے ساتھی گھر کے دروازے سے بغیر کپڑوں کے نکلتے ہیں، بدو ان پر کپڑے ڈالتے ہیں، اسعد بن ابی یعفر ان سے ملتا ہے، اپنے خچر سے اتر کر سلام کرتا ہے اور انہیں اس پر سوار ہونے کا کہتا ہے؛ پھر قلعے میں ابن خلف کی مجلس میں کچھ مشقت کے بعد ابو القاسم کی بیڑیاں کھلتی ہیں، اسعد انہیں چھو کر برکت لیتا ہے، اور وہ رات بیت بوس میں گزارتے ہیں۔
  es: "Abu al-Qasim y su compañero salen por la puerta de la casa desnudos, los beduinos les echan ropas encima, As'ad ibn Abi Ya'fur los recibe, se baja de su mula, lo saluda y le hace montar en ella; luego, tras algunos problemas, le quitan los grilletes a Abu al-Qasim en la sala del consejo de Ibn Khalaf en la fortaleza, As'ad busca su bendición tocándolo y pasan la noche en Bayt Bus."
  tr: "Ebu el-Kâsim ve arkadaşı çıplak halde evden ayrılırlar ve Bedeviler onları örterler. As'ad ibn Abi Ya'fer onları karşılar, katırından iner, onu selamlar ve katıra binmesini emreder. Sonra, büyük bir çaba sarf ederek, İbn Halef'in kaledeki meclisinde Ebu el-Kâsim'in üzerindeki demiri çıkarır. As'ad ona dokunarak bereketlenir ve geceyi Bus'un evinde geçirirler."
  id: "Abu al-Qasim dan temannya meninggalkan rumah tanpa pakaian, dan orang-orang Badui menutupi mereka. As’ad ibn Abi Ya’far menemui mereka, turun dari keledainya, menyapa mereka, dan menyuruh mereka menungganginya. Kemudian, setelah banyak usaha, ia melepaskan besi dari tubuh Abu al-Qasim di hadapan Ibn Khalaf di benteng. As’ad diberkati dengan menyentuhnya, dan mereka bermalam di rumah Bus."
