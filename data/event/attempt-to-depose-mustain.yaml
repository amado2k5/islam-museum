label: { ar: "عزم ابن طاهر على خلع المستعين", en: "Ibn Tahir's plan to depose al-Musta'in", fr: "Le projet d'Ibn Tahir de déposer al-Musta'in", es: "El plan de Ibn Tahir para deponer a al-Musta'in" }
summary:
  ar: "في سنة إحدى وخمسين ومائتين عزم ابن طاهر على خلع المستعين والبيعة للمعتز، فخرجت العامة لنصرة المستعين {cite:tabari-tarikh-abu-al-fadl j.9 p.337}، ثم انتقل المستعين في ذي الحجة إلى دار رزق الخادم بالرصافة {cite:tabari-tarikh-abu-al-fadl j.9 p.340}، وعند السيوطي أرسل الأتراك إليه يعتذرون ويسألونه الرجوع فامتنع فقصدوا الحبس وأخرجوا المعتز وبايعوه وخلعوا المستعين {cite:tarikh-khulafa-minhaj-1434 p. 555}."
  en: "In the year 251 Ibn Tahir resolved to depose al-Musta'in and pledge allegiance to al-Mu'tazz, and the common people went out to support al-Musta'in {cite:tabari-tarikh-abu-al-fadl j.9 p.337}. Then in Dhu'l-Hijja al-Musta'in moved to the house of Rizq al-Khadim at al-Rusafa {cite:tabari-tarikh-abu-al-fadl j.9 p.340}. According to al-Suyuti, the Turks sent to him apologising and asking him to return, but he refused; so they made for the prison, brought out al-Mu'tazz, pledged allegiance to him and deposed al-Musta'in {cite:tarikh-khulafa-minhaj-1434 p. 555}."
  fr: "En l'an 251, Ibn Tahir résolut de déposer al-Musta'in et de prêter allégeance à al-Mu'tazz, et le peuple sortit pour soutenir al-Musta'in {cite:tabari-tarikh-abu-al-fadl j.9 p.337}. Puis, en Dhu al-Hijja, al-Musta'in s'installa dans la maison de Rizq al-Khadim à al-Rusafa {cite:tabari-tarikh-abu-al-fadl j.9 p.340}. Selon al-Suyuti, les Turcs lui envoyèrent des excuses en le priant de revenir, mais il refusa ; ils se dirigèrent alors vers la prison, en firent sortir al-Mu'tazz, lui prêtèrent allégeance et déposèrent al-Musta'in {cite:tarikh-khulafa-minhaj-1434 p. 555}."
  es: "En el año 251, Ibn Tahir decidió deponer a al-Musta'in y jurar lealtad a al-Mu'tazz, y el pueblo salió a apoyar a al-Musta'in {cite:tabari-tarikh-abu-al-fadl j.9 p.337}. Luego, en Dhu'l-Hijja, al-Musta'in se trasladó a la casa de Rizq al-Khadim en al-Rusafa {cite:tabari-tarikh-abu-al-fadl j.9 p.340}. Según al-Suyuti, los turcos le enviaron un mensajero disculpándose y pidiéndole que regresara, pero él se negó; entonces se dirigieron a la prisión, sacaron a al-Mu'tazz, le juraron lealtad y depusieron a al-Musta'in {cite:tarikh-khulafa-minhaj-1434 p. 555}."
