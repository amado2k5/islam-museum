label: { ar: "عزم ابن طاهر على خلع المستعين", en: "Ibn Tahir's plan to depose al-Musta'in" }
summary:
  ar: "في سنة إحدى وخمسين ومائتين عزم ابن طاهر على خلع المستعين والبيعة للمعتز، فخرجت العامة لنصرة المستعين {cite:tabari-tarikh-abu-al-fadl j.9 p.337}، ثم انتقل المستعين في ذي الحجة إلى دار رزق الخادم بالرصافة {cite:tabari-tarikh-abu-al-fadl j.9 p.340}، وعند السيوطي أرسل الأتراك إليه يعتذرون ويسألونه الرجوع فامتنع فقصدوا الحبس وأخرجوا المعتز وبايعوه وخلعوا المستعين {cite:tarikh-khulafa-minhaj-1434 p. 555}."
  en: "In the year 251 Ibn Tahir resolved to depose al-Musta'in and pledge allegiance to al-Mu'tazz, and the common people went out to support al-Musta'in {cite:tabari-tarikh-abu-al-fadl j.9 p.337}. Then in Dhu'l-Hijja al-Musta'in moved to the house of Rizq al-Khadim at al-Rusafa {cite:tabari-tarikh-abu-al-fadl j.9 p.340}. According to al-Suyuti, the Turks sent to him apologising and asking him to return, but he refused; so they made for the prison, brought out al-Mu'tazz, pledged allegiance to him and deposed al-Musta'in {cite:tarikh-khulafa-minhaj-1434 p. 555}."
