class: event
kind: declaration
label: { ar: "خطبة قرواش العقيلي للحاكم بالموصل والكوفة", en: "Qarwash al-Uqayli's khutba for al-Hakim at Mosul and Kufa", es: "Jutba de Qarwash al-Uqayli para al-Hakim en Mosul y Kufa", fr: "Khutba de Qarwash al-Uqayli pour al-Hakim à Mossoul et Kufa" }
summary:
  ar: "في المحرم سنة إحدى وأربعمائة جمع أبو المنيع قرواش بن المقلد أهل الموصل وأظهر طاعة الحاكم صاحب مصر وأقام له الدعوة بالموصل، ثم انحدر إلى الكوفة والمدائن والقصر فأُقيمت فيها الخطبة للحاكم الفاطمي، فزعمت كتب الخلافة ببغداد وراسل القادر عميد الجيوش وبهاء الدولة وأنفذ إليه القاضي أبا بكر الباقلاني، فأطلق بهاء الدولة مائة ألف دينار لنفقات العسكر وكاتب قرواشاً بالإنذار فاعتذر قرواش ووثق من نفسه بإزالة ذلك وأعاد الخطبة للقادر بالله {cite:muntazam-ibn-al-jawzi j.7 p.249-251}."
  en: "In Muharram 401 Abu'l-Mani' Qarwash ibn al-Muqallad gathered the people of Mosul, declared obedience to al-Hakim, ruler of Egypt, and established the da'wa for him at Mosul. He then went down to Kufa, al-Mada'in and al-Qasr, where the khutba was read for the Fatimid al-Hakim. The caliphal chancery at Baghdad alleged this, so al-Qadir sent to Amid al-Juyush and Baha al-Dawla, and dispatched to him the judge Abu Bakr al-Baqillani. Baha al-Dawla released a hundred thousand dinars for the army's expenses and wrote to Qarwash with a warning; Qarwash apologised, pledged to remove the matter, and restored the khutba to al-Qadir billah {cite:muntazam-ibn-al-jawzi j.7 p.249-251}."
  es: "En Muharram del año 401, Abu'l-Mani' Qarwash ibn al-Muqallad reunió a la gente de Mosul, declaró obediencia a al-Hakim, gobernante de Egipto, y estableció la da'wa (proselitismo islámico) para él en Mosul. Luego se dirigió a Kufa, al-Mada'in y al-Qasr, donde se leyó la jutba (sermón) para el fatimí al-Hakim. La cancillería califal en Bagdad alegó esto, por lo que al-Qadir envió a Amid al-Juyush y Baha al-Dawla, y le envió al juez Abu Bakr al-Baqillani. Baha al-Dawla liberó cien mil dinares para los gastos del ejército y escribió a Qarwash con una advertencia; Qarwash se disculpó, prometió solucionar el asunto y restituyó la jutba a al-Qadir billah (cita: Muntazam ibn al-Jawzi, vol. 7, págs. 249-251)."
  fr: "En Muharram 401, Abu'l-Mani' Qarwash ibn al-Muqallad rassembla les habitants de Mossoul, leur déclara obéissance à al-Hakim, souverain d'Égypte, et établit pour lui la da'wa à Mossoul. Il se rendit ensuite à Kufa, al-Mada'in et al-Qasr, où le sermon fut prononcé pour le Fatimide al-Hakim. La chancellerie califale de Bagdad contesta cet acte, et al-Qadir envoya des messagers à Amid al-Juyush et Baha al-Dawla, ainsi que le juge Abu Bakr al-Baqillani. Baha al-Dawla débloqua cent mille dinars pour les dépenses de l'armée et écrivit à Qarwash pour l'avertir; Qarwash présenta ses excuses, s'engagea à régler l'affaire et rétablit al-Qadir dans son rôle de prêcheur (khutba)."
