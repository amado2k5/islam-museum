label: { ar: "صلح السامرة", en: "The Treaty with the Samaritans", es: "El Tratado con los Samaritanos", fr: "Le traité avec les Samaritains", ur: "سامریوں کے ساتھ معاہدہ", tr: "Samarya Barışı", id: "Samaria Damai" }
summary:
  ar: "عند البلاذري عن هشام بن عمار عن الوليد بن مسلم عن صفوان بن عمرو: صالح أبو عبيدة بن الجراح السامرة بالأردن وفلسطين وكانوا مخالفة ما شورطوا عليه فصالحهم على أن يكونوا عيوناً وأدلاء للمسلمين على جزية رؤوسهم وإطمام أرضهم — أي إعفاؤها —؛ وغزاهم المسلمون مرة وسُبوا حتى عادوا إلى النجوع بأمرهم الأول فكُفّ عنهم وجرى أمرهم بعد ذلك إلى وقت المؤلف على صلحهم القديم؛ ولما كان يزيد بن معاوية وضع الخراج على أرضهم وجعل على رأس كل امرئ منهم خمسة دنانير — والسامرة يهود صنفان: الدستان والكوشان —؛ وكان بفلسطين في أول خلافة الرشيد طاعون جارف ربما أتى على جميع أهل البيت فخربت أرضوهم وتعطلت فوكّل السلطان بها من عمّرها وتألّف الأكرة والمزارعين إليها فصارت ضياعاً للخلافة وبها السامرة فلما كانت سنة 246 رفع عنهم شيء من الخراج."
  en: "In al-Baladhuri through the Syrian chain of Hisham ibn Ammar from al-Walid ibn Muslim from Safwan ibn Amr: Abu Ubayda ibn al-Jarrah compounded with the Samaritans of the Jordan and Filastin districts — they being mixed with the other covenant-holders — on the terms that they serve as scouts and guides for the Muslims, against jizya on their heads with their lands exempted; the Muslims once raided them and took captives until they returned to abiding by their first affair, when they were left in peace, their standing continuing to the author's time on their ancient treaty; in Yazid ibn Mu'awiya's day kharaj was laid on their land with five dinars on each man's head — the Samaritans being Jews of two sects, the Dustan and the Kushan; in al-Rashid's early caliphate a sweeping plague struck Filastin, sometimes taking whole households, whose lands fell waste and idle until the sultan charged their cultivation and assembled tenants and farmers to them, making them crown estates including the Samaritans', and in year 246 a portion of their kharaj was remitted."
  es: "En al-Baladhuri a través de la cadena siria de Hisham ibn Ammar de al-Walid ibn Muslim de Safwan ibn Amr: Abu Ubayda ibn al-Jarrah se asoció con los samaritanos de los distritos de Jordania y Filastin —que estaban mezclados con los demás titulares del pacto— con los términos de que sirvieran como exploradores y guías para los musulmanes, a cambio de la yizia sobre sus cabezas y con sus tierras exentas; los musulmanes una vez los asaltaron y tomaron cautivos hasta que volvieron a cumplir su primer acuerdo, cuando fueron dejados en paz, su estatus continuó hasta la época del autor en su antiguo tratado; en la época de Yazid ibn Mu'awiya se estableció el kharaj sobre sus tierras con cinco dinares sobre la cabeza de cada hombre —los samaritanos eran judíos de dos sectas, los Dustan y los Kushan; En los inicios del califato de al-Rashid, una plaga devastadora azotó Filastin, llegando a diezmar a familias enteras, cuyas tierras quedaron abandonadas e improductivas hasta que el sultán impuso el cultivo de estas tierras y reunió a arrendatarios y agricultores, convirtiéndolas en propiedades de la corona, incluidas las de los samaritanos, y en el año 246 se les condonó una parte de sus kharaj (tributos)."
  fr: "Dans al-Baladhuri, par la chaîne syrienne de Hisham ibn Ammar, d'après al-Walid ibn Muslim, d'après Safwan ibn Amr: Abu Ubayda ibn al-Jarrah conclut une alliance avec les Samaritains des districts de Jordan et de Filastin — ces derniers étant mêlés aux autres signataires de l'alliance — à condition qu'ils servent d'éclaireurs et de guides aux musulmans, en échange de la jizya, leurs terres étant exemptées; les musulmans les pillèrent un temps et les firent prisonniers jusqu'à ce qu'ils reviennent à leur accord initial, après quoi ils furent laissés en paix, leur situation se maintenant jusqu'à l'époque de l'auteur en vertu de leur ancien traité; à l'époque de Yazid ibn Mu'awiya, le kharaj fut imposé sur leurs terres à hauteur de cinq dinars par homme — les Samaritains étant des Juifs de deux sectes, les Dustan et les Kushan; Au début du califat d'al-Rashid, une peste dévastatrice frappa Filastin, emportant parfois des familles entières, dont les terres tombèrent en ruine et en friche jusqu'à ce que le sultan leur impose une culture et rassemble des locataires et des agriculteurs, en faisant des domaines de la couronne, y compris ceux des Samaritains, et en l'an 246, une partie de leur kharaj fut remise."
  ur: "البلادوری میں ہشام بن عمار کے شامی سلسلے کے ذریعے الولید بن مسلم سے صفوان بن عمرو سے: ابو عبیدہ بن الجراح نے اردن اور فلاسطین کے اضلاع کے سامریوں کے ساتھ ملایا - ان کو دوسرے عہد کے حاملین کے ساتھ ملایا جارہا ہے - ان شرائط پر جو وہ مسلمانوں کے لئے رہنمائی کے طور پر پیش کرتے ہیں ان کی زمینوں سے مستثنیٰ؛ مسلمانوں نے ایک بار ان پر چھاپہ مارا اور قیدی بنا لیے یہاں تک کہ وہ اپنے پہلے معاملے کی پاسداری کی طرف واپس آئے، جب انہیں امن سے چھوڑ دیا گیا، ان کا اپنے قدیم معاہدے پر مصنف کے زمانے تک قائم رہنا؛ یزید بن معاویہ کے زمانے میں ان کی سرزمین پر خراج رکھا گیا تھا جس میں ہر ایک کے سر پر پانچ دینار تھے - سامری دو فرقوں کے یہودی تھے، دستان اور کشان۔ الرشید کے ابتدائی دور خلافت میں فلاسٹن پر وبائی طاعون نے حملہ کیا، بعض اوقات پورے گھرانوں کو اپنی لپیٹ میں لے لیا، جن کی زمینیں بیکار اور بیکار پڑی تھیں یہاں تک کہ سلطان نے ان کی کاشت کاری کی اور کرایہ داروں اور کسانوں کو ان کے پاس جمع کر کے انہیں سامریوں سمیت تاج کی جاگیر بنا دیا، اور سنہ 246 میں ان کی راجدھانی کا حصہ بن گیا۔"
  tr: "El-Baladhuri, Hişam ibn Ammar'dan, o da El-Valid ibn Müslim'den, o da Safvan ibn Amr'dan rivayet eder: Ebu Ubeyde ibn El-Cerrah, Ürdün ve Filistin'deki Samarya ile barış yaptı. Samarya, üzerinde anlaştıkları şeye aykırı davrandı. Bunun üzerine Ebu Ubeyde ibn El-Cerrah, Müslümanlar için casusluk ve rehberlik yapmaları, başlarına cizye ödemeleri ve topraklarının cizyeden muaf tutulması şartıyla onlarla barış yaptı. Müslümanlar bir kez onlara baskın düzenleyip onları esir aldılar, ta ki ilk emirleri üzerine köylerine dönene kadar. Bunun üzerine Ebu Ubeyde onlara karşı savaştan vazgeçti ve işleri yazarın zamanına kadar eski barışları çerçevesinde devam etti. Yezid ibn Muaviye geldiğinde ise topraklarına haraç koydu ve her birinin başına beş dinar vergi koydu. Samarya, Dastan ve Kuşan olmak üzere iki Yahudi türündendir. Raşid halifeliğinin başlangıcında Filistin'de, muhtemelen tüm halkı yok eden yıkıcı bir veba salgını yaşandı; bu yüzden toprakları harap oldu ve terk edildi. Sultan, bu toprakları geliştirmek için birilerini görevlendirdi ve çiftçiler ile köylüler onlara getirildi; böylece bu topraklar halifeliğin mülkleri haline geldi ve Samarya da bu topraklar arasındaydı. 246 yılı geldiğinde, onlardan bazı haraçları aldı."
  id: "Al-Baladhuri, berdasarkan riwayat Hisham ibn Ammar, berdasarkan riwayat Al-Walid ibn Muslim, berdasarkan riwayat Safwan ibn Amr: Abu Ubaidah ibn Al-Jarrah berdamai dengan orang-orang Samaria di Yordania dan Palestina, dan mereka melanggar kesepakatan yang telah mereka sepakati, maka ia berdamai dengan mereka dengan syarat mereka menjadi mata-mata dan penunjuk jalan bagi kaum Muslimin, dengan syarat membayar jizya atas kepala mereka dan tanah dibebaskan dari jizya - yaitu, dibebaskan dari jizya -; dan kaum Muslimin menyerang mereka sekali dan menawan mereka sampai mereka kembali ke desa-desa atas perintah pertama mereka, maka ia berhenti melawan mereka, dan urusan mereka berlanjut setelah itu sampai zaman penulis berdasarkan perjanjian damai mereka sebelumnya; dan ketika Yazid ibn Muawiyah datang, ia memberlakukan kharaj atas tanah mereka dan menetapkan lima dinar untuk kepala masing-masing dari mereka - dan orang-orang Samaria adalah orang-orang Yahudi dari dua jenis: Dastan dan Kushan -; Dan di Palestina pada awal kekhalifahan Al-Rashid terjadi wabah dahsyat yang mungkin telah merenggut nyawa seluruh penghuni rumah, sehingga tanah mereka hancur dan terbengkalai. Maka sultan menunjuk seseorang untuk mengembangkannya dan para petani serta buruh tani dibawa ke sana, sehingga tanah-tanah itu menjadi wilayah kekuasaan kekhalifahan, dan Samaria termasuk di sana. Maka ketika tahun 246 tiba, beliau mencabut sebagian pajak (kharaj) dari mereka."
