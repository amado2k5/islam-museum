label: { ar: "صلح السامرة", en: "The Treaty with the Samaritans" }
summary:
  ar: "عند البلاذري عن هشام بن عمار عن الوليد بن مسلم عن صفوان بن عمرو: صالح أبو عبيدة بن الجراح السامرة بالأردن وفلسطين وكانوا مخالفة ما شورطوا عليه فصالحهم على أن يكونوا عيوناً وأدلاء للمسلمين على جزية رؤوسهم وإطمام أرضهم — أي إعفاؤها —؛ وغزاهم المسلمون مرة وسُبوا حتى عادوا إلى النجوع بأمرهم الأول فكُفّ عنهم وجرى أمرهم بعد ذلك إلى وقت المؤلف على صلحهم القديم؛ ولما كان يزيد بن معاوية وضع الخراج على أرضهم وجعل على رأس كل امرئ منهم خمسة دنانير — والسامرة يهود صنفان: الدستان والكوشان —؛ وكان بفلسطين في أول خلافة الرشيد طاعون جارف ربما أتى على جميع أهل البيت فخربت أرضوهم وتعطلت فوكّل السلطان بها من عمّرها وتألّف الأكرة والمزارعين إليها فصارت ضياعاً للخلافة وبها السامرة فلما كانت سنة 246 رفع عنهم شيء من الخراج."
  en: "In al-Baladhuri through the Syrian chain of Hisham ibn Ammar from al-Walid ibn Muslim from Safwan ibn Amr: Abu Ubayda ibn al-Jarrah compounded with the Samaritans of the Jordan and Filastin districts — they being mixed with the other covenant-holders — on the terms that they serve as scouts and guides for the Muslims, against jizya on their heads with their lands exempted; the Muslims once raided them and took captives until they returned to abiding by their first affair, when they were left in peace, their standing continuing to the author's time on their ancient treaty; in Yazid ibn Mu'awiya's day kharaj was laid on their land with five dinars on each man's head — the Samaritans being Jews of two sects, the Dustan and the Kushan; in al-Rashid's early caliphate a sweeping plague struck Filastin, sometimes taking whole households, whose lands fell waste and idle until the sultan charged their cultivation and assembled tenants and farmers to them, making them crown estates including the Samaritans', and in year 246 a portion of their kharaj was remitted."
