label: { ar: "محاورة الرشيد مع الزنديق في الحديث", en: "Harun al-Rashid's Exchange with a Zindiq on Hadith", es: "Intercambio de Harun al-Rashid con un Zindiq sobre el Hadith", fr: "Échange de Harun al-Rashid avec un Zindiq sur le Hadith", ur: "ہارون الرشید کا حدیث پر زندیق سے تبادلہ" }
summary:
  ar: "أخذ هارون الرشيد زنديقاً فأمر بضرب عنقه فقال له الزنديق لم تضرب عنقي قال أريح العباد منك قال فأين أنت من ألف حديث وضعتها على رسول الله كلها ما فيها حرف نطق به قال فأين أنت يا عدو الله من أبي إسحاق الفزاري وعبد الله بن المبارك ينخلانها فيخرجانها حرفاً حرفاً {cite:tarikh-khulafa-minhaj-1434 p. 467}."
  en: "Al-Rashid seized a zindiq and ordered his neck struck; 'Why kill me?' he asked — 'to give people rest from you.' 'And what of the thousand hadith I have foisted on the Prophet, not one letter of which he spoke?' 'And what of you, enemy of God, against Abu Ishaq al-Fazari and Abdallah ibn al-Mubarak, who sift them and cast them out letter by letter?' {cite:tarikh-khulafa-minhaj-1434 p. 467}."
  es: "Al-Rashid apresó a un zindiq y ordenó que le golpearan el cuello; «¿Por qué matarme?», preguntó, «para que la gente descanse de ti». «¿Y qué hay de los mil hadices que le he atribuido al Profeta, de los cuales no pronunció ni una sola letra?». «¿Y qué hay de ti, enemigo de Dios, contra Abu Ishaq al-Fazari y Abdallah ibn al-Mubarak, que los examinas y los descartas letra por letra?». {cite:tarikh-khulafa-minhaj-1434 p. 467}."
  fr: "Al-Rashid s'empara d'un zindiq et ordonna qu'on le frappe à la nuque; « Pourquoi me tuer ? » demanda-t-il — « Pour que les gens aient la paix loin de toi. » « Et que dire des mille hadiths que j'ai attribués au Prophète, dont il n'a pas prononcé une seule lettre ? » « Et toi, ennemi de Dieu, que dis-tu d'Abu Ishaq al-Fazari et d'Abdallah ibn al-Mubarak, qui les examinez et les rejetez lettre par lettre ? » {cite:tarikh-khulafa-minhaj-1434 p. 467}."
  ur: "الرشید نے ایک زندیق کو پکڑا اور اس کی گردن مارنے کا حکم دیا۔ 'مجھے کیوں مارا؟' اس نے پوچھا - 'لوگوں کو آپ سے آرام دینا'۔ اور ان ہزار حدیثوں میں سے کیا ہے جو میں نے نبی پر لکھی ہیں، جس میں سے ایک حرف بھی آپ نے نہیں فرمایا؟ 'اور تم میں سے کیا دشمنان خدا ابو اسحاق الفزاری اور عبداللہ بن المبارک کے خلاف، جنہوں نے انہیں چھلنی کر کے انہیں حرف بہ حرف پھینک دیا۔' {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 467}۔"
