label: { ar: "محاورة الرشيد مع الزنديق في الحديث" }
summary:
  ar: "أخذ هارون الرشيد زنديقاً فأمر بضرب عنقه فقال له الزنديق لم تضرب عنقي قال أريح العباد منك قال فأين أنت من ألف حديث وضعتها على رسول الله كلها ما فيها حرف نطق به قال فأين أنت يا عدو الله من أبي إسحاق الفزاري وعبد الله بن المبارك ينخلانها فيخرجانها حرفاً حرفاً {cite:tarikh-khulafa-minhaj-1434 p. 467}."
  en: "Al-Rashid seized a zindiq and ordered his neck struck; 'Why kill me?' he asked — 'to give people rest from you.' 'And what of the thousand hadith I have foisted on the Prophet, not one letter of which he spoke?' 'And what of you, enemy of God, against Abu Ishaq al-Fazari and Abdallah ibn al-Mubarak, who sift them and cast them out letter by letter?' {cite:tarikh-khulafa-minhaj-1434 p. 467}."
