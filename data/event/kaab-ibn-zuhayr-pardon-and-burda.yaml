label: { en: "Ka'b ibn Zuhayr's pardon and recitation of Banat Su'ad", ar: "أمان كعب بن زهير وإنشاد «بانت سعاد»" }
summary:
  en: "Warned by his brother Bujayr after the Prophet's return from al-Ta'if, the poet Ka'b ibn Zuhayr came to Medina, announced himself in the mosque, was spared despite an Ansari's request to strike his neck, and recited his apology-ode Banat Su'ad before the Prophet."
  ar: "جاء الشاعر كعب بن زهير المدينة بعد رجوع النبي من الطائف مُنذِراً بكتاب أخيه بجير، فعرّف بنفسه في المسجد فأمنّه النبي ودفع عنه رجلاً من الأنصار استأذن في ضرب عنقه، فأنشده قصيدته «بانت سعاد» معتذراً ومداحاً."
