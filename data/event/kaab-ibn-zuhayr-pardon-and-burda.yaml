label: { en: "Ka'b ibn Zuhayr's pardon and recitation of Banat Su'ad", ar: "أمان كعب بن زهير وإنشاد «بانت سعاد»", es: "Perdón de Ka'b ibn Zuhayr y recitación de Banat Su'ad", fr: "Le pardon de Ka'b ibn Zuhayr et la récitation du Banat Su'ad", ur: "کعب بن زہیر کی معافی اور بنات سعد کی تلاوت", tr: "Aman Ka'b ibn Zuhair ve \"Banat Su'ad\"ın okunması", id: "Aman Ka'b ibn Zuhair dan pembacaan \"Banat Su'ad\"" }
summary:
  en: "Warned by his brother Bujayr after the Prophet's return from al-Ta'if, the poet Ka'b ibn Zuhayr came to Medina, announced himself in the mosque, was spared despite an Ansari's request to strike his neck, and recited his apology-ode Banat Su'ad before the Prophet."
  ar: "جاء الشاعر كعب بن زهير المدينة بعد رجوع النبي من الطائف مُنذِراً بكتاب أخيه بجير، فعرّف بنفسه في المسجد فأمنّه النبي ودفع عنه رجلاً من الأنصار استأذن في ضرب عنقه، فأنشده قصيدته «بانت سعاد» معتذراً ومداحاً."
  es: "Tras ser advertido por su hermano Bujayr después del regreso del Profeta de al-Ta'if, el poeta Ka'b ibn Zuhayr llegó a Medina, se anunció en la mezquita, se salvó a pesar de la petición de un Ansari de que le cortaran el cuello y recitó su oda de disculpa Banat Su'ad ante el Profeta."
  fr: "Averti par son frère Bujayr après le retour du Prophète d'al-Ta'if, le poète Ka'b ibn Zuhayr vint à Médine, se présenta dans la mosquée, fut épargné malgré la demande d'un Ansari de le frapper au cou, et récita son ode d'excuses Banat Su'ad devant le Prophète."
  ur: "طائف سے نبی کی واپسی کے بعد ان کے بھائی بوجائر کی طرف سے تنبیہ کی گئی، شاعر کعب بن زہیر مدینہ آیا، مسجد میں اعلان کیا، ایک انصاری کی طرف سے ان کی گردن مارنے کی درخواست کے باوجود بچ گیا، اور نبی کے سامنے اپنا معافی نامہ بنات سعود پڑھا۔"
  tr: "Şair Ka'b bin Zuhair, Peygamber Taif'ten döndükten sonra Medine'ye geldi ve kardeşi Bujair'in mektubundan bahsetti. Camide kendini tanıttı ve Peygamber ona güvenlik sağladı, boynuna vurmak için izin isteyen Ensar'dan bir adamdan onu korudu. Bunun üzerine Ka'b bin Zuhair, özür dileyerek ve övgüler yağdırarak \"Banat Su'ad\" şiirini ona okudu."
  id: "Penyair Ka’b bin Zuhair datang ke Madinah setelah Nabi kembali dari Ta’if, memperingatkan tentang surat saudaranya, Bujair. Ia memperkenalkan diri di masjid, dan Nabi memberinya keselamatan dan melindunginya dari seorang pria dari kaum Ansar yang meminta izin untuk mencekiknya. Maka beliau membacakan puisinya “Banat Su’ad” kepadanya, meminta maaf dan memuji."
