label: { ar: "حرق الرجلين بتهمة الرفض بدمشق 942هـ", en: "Two men burned as rafidis at Damascus, 942", es: "Dos hombres quemados como rafidíes en Damasco, 942", fr: "Deux hommes brûlés vifs à Damas, en 942", ur: "دمشق، 942 میں دو افراد کو رافدی کے طور پر جلایا گیا۔", tr: "İki adam, muhalif oldukları gerekçesiyle Hicri 942 yılında Şam'da kazıkta yakıldı.", id: "Kedua pria itu dibakar hidup-hidup di Damaskus pada tahun 942 Hijriah atas tuduhan pembangkangan." }
summary:
  ar: "في سنة اثنتين وأربعين وتسعمائة ثبت عند قاضي دمشق على القاضي شمس الدين محمد بن يوسف الدمشقي الحنفي — وكان قد ناب في القضاء عن ابن الشحنة وابن يونس — وعلى رجل يقال له حسين البقسماطي أنهما رافضيان، فحُرقا تحت قلعة دمشق بعد أن رُبطت رقابهما وأيديهما وأرجلهما في أوتاد وأُلقي عليهما القتب والبوايا والحطب وأُطلقت النار عليهما حتى صارا رماداً ثم أُلقي رمادهما في بردى، وكان ذلك يوم الثلاثاء تاسع رجب؛ وسئل الشيخ قطب الدين بن سلطان مفتي الحنفية عن قتلهما فقال لا يجوز في الشرع بل يستتابان {cite:shadharat-dhahab p. 665-666}."
  en: "In 942 the Hanafi deputy judge Shams al-Din Muhammad b. Yusuf and a man named Husayn al-Baqsimati were convicted before Damascus's qadi as rafidis and burned beneath the citadel — bound to stakes, covered with kindling, burned to ash, the ash thrown into Barada — on Tuesday 9 Rajab; asked whether their killing was lawful, mufti Qutb al-Din b. Sultan said it was not: they should have been asked to repent {cite:shadharat-dhahab p. 665-666}."
  es: "En 942, el juez adjunto hanafi Shams al-Din Muhammad b. Yusuf y un hombre llamado Husayn al-Baqsimati fueron condenados ante el cadí de Damasco como rafidíes y quemados bajo la ciudadela —atados a estacas, cubiertos con leña, reducidos a cenizas, cuyas cenizas fueron arrojadas a Barada— el martes 9 de Rajab; al preguntársele si su asesinato era lícito, el muftí Qutb al-Din b. Sultan dijo que no lo era: se les debería haber pedido que se arrepintieran {cita: shadharat-dhahab pág. 665-666}."
  fr: "En 942, le juge adjoint hanafite Shams al-Din Muhammad b. Yusuf et un homme nommé Husayn al-Baqsimati furent condamnés devant le cadi de Damas comme rafidis et brûlés sous la citadelle — attachés à des pieux, recouverts de bois d'allumage, brûlés jusqu'à ce qu'ils soient réduits en cendres, les cendres jetées à Barada — le mardi 9 Rajab; interrogé sur la légalité de leur mise à mort, le mufti Qutb al-Din b. Sultan déclara qu'elle ne l'était pas: ils auraient dû être invités à se repentir {cite:shadharat-dhahab p. 665-666}."
  ur: "942 میں حنفی نائب جج شمس الدین محمد بن۔ یوسف اور حسین البقسماتی نامی شخص کو دمشق کے قادی کے سامنے رافضیوں کے طور پر سزا سنائی گئی اور قلعہ کے نیچے جلا دیا گیا - داؤ پر باندھ دیا گیا، جلانے سے ڈھانپ دیا گیا، جلا کر راکھ کر دیا گیا، راکھ بردہ میں پھینک دی گئی — منگل 9 رجب؛ مفتی قطب الدین نے پوچھا کہ کیا ان کا قتل جائز ہے؟ سلطان نے کہا کہ ایسا نہیں ہے: انہیں توبہ کرنے کے لیے کہا جانا چاہیے تھا۔ 665-666}۔"
  tr: "942 yılında, Şam kadısı huzurunda, İbn Şahna ve İbn Yunus adına kadılık yapan Şemseddin Muhammed ibn Yusuf el-Dimaşki el-Hanefi ile Hüseyin el-Baksmati adlı bir kişinin Rafizi oldukları ispatlandı. Boyunları, elleri ve ayakları kazıklara bağlanıp üzerlerine eyer çantaları, odun ve tutuşturucu atıldıktan sonra ateşe verilerek küle dönüştürüldüler. Daha sonra külleri Berada Nehri'ne atıldı. Bu olay, Receb ayının dokuzuncu günü, Salı günü gerçekleşti. Hanefilerin müftüsü Şeyh Kutb el-Din ibn Sultan'a bu cinayet hakkında soru sorulduğunda, \"Şeriat'ta caiz değildir, aksine onlara tövbe etme fırsatı verilmelidir\" dedi. {Kaynak: Şadharat-Dhaba, s. 665-666}"
  id: "Pada tahun 942, terbukti di hadapan hakim Damaskus bahwa Hakim Shams al-Din Muhammad ibn Yusuf al-Dimashqi al-Hanafi — yang bertindak sebagai hakim atas nama Ibn al-Shahna dan Ibn Yunus — dan seorang pria bernama Husayn al-Baqsmati adalah Rafidis. Mereka dibakar di bawah benteng Damaskus setelah leher, tangan, dan kaki mereka diikat ke tiang, dan kantong pelana, kayu bakar, dan sumbu dilemparkan ke atas mereka, lalu api dinyalakan hingga mereka menjadi abu. Kemudian abu mereka dibuang ke Sungai Barada. Ini terjadi pada hari Selasa, tanggal sembilan Rajab. Syekh Qutb al-Din ibn Sultan, Mufti mazhab Hanafi, ditanya tentang pembunuhan mereka, dan beliau berkata: “Hal itu tidak diperbolehkan dalam syariat, melainkan mereka harus diberi kesempatan untuk bertaubat.” {cite:shadharat-dhahab hlm. 665-666}"
