label: { ar: "حرق الرجلين بتهمة الرفض بدمشق 942هـ", en: "Two men burned as rafidis at Damascus, 942" }
summary:
  ar: "في سنة اثنتين وأربعين وتسعمائة ثبت عند قاضي دمشق على القاضي شمس الدين محمد بن يوسف الدمشقي الحنفي — وكان قد ناب في القضاء عن ابن الشحنة وابن يونس — وعلى رجل يقال له حسين البقسماطي أنهما رافضيان، فحُرقا تحت قلعة دمشق بعد أن رُبطت رقابهما وأيديهما وأرجلهما في أوتاد وأُلقي عليهما القتب والبوايا والحطب وأُطلقت النار عليهما حتى صارا رماداً ثم أُلقي رمادهما في بردى، وكان ذلك يوم الثلاثاء تاسع رجب؛ وسئل الشيخ قطب الدين بن سلطان مفتي الحنفية عن قتلهما فقال لا يجوز في الشرع بل يستتابان {cite:shadharat-dhahab p. 665-666}."
  en: "In 942 the Hanafi deputy judge Shams al-Din Muhammad b. Yusuf and a man named Husayn al-Baqsimati were convicted before Damascus's qadi as rafidis and burned beneath the citadel — bound to stakes, covered with kindling, burned to ash, the ash thrown into Barada — on Tuesday 9 Rajab; asked whether their killing was lawful, mufti Qutb al-Din b. Sultan said it was not: they should have been asked to repent {cite:shadharat-dhahab p. 665-666}."
