id: event/samani-father-death-510
class: event
kind: death
label:
  ar: "وفاة أبي بكر السمعاني وكفالة العمين للصبي عبد الكريم، ٥١٠هـ/١١١٦م"
  en: "Death of Abu Bakr al-Sam'ani; the boy 'Abd al-Karim is raised by his two learned uncles, 510/1116"
  ur: "ابو بکر سمعانی کی وفات؛ بچے عبدالکریم کی پرورش دو عالم چچاؤں کے سپرد، 510ھ/1116ء"
  es: "Muerte de Abu Bakr al-Sam'ani; el niño 'Abd al-Karim es criado por sus dos tíos eruditos, 510/1116."
  fr: "Mort d'Abu Bakr al-Sam'ani; le jeune Abd al-Karim est élevé par ses deux oncles érudits, 510/1116"
  tr: "Ebu Bekir el-Sam'ani'nin ölümü ve Abdülkerim adlı çocuğun iki amcası tarafından vesayeti altına alınması, Hicri 510/Miladi 1116"
  id: "Wafatnya Abu Bakr al-Sam'ani dan perwalian anak laki-laki Abd al-Karim oleh kedua pamannya, 510 H/1116 M"
summary:
  ar: "مات أبو بكر السمعاني سنة عشر وخمسمائة في أولها، وقد أوصى بابنه قبل وفاته إلى أخويه العالمين، فتربّى أبو سعد بين أعمامه وأهله، فلما راهق أقبل على القرآن والفقه والاشتغال {cite:tarikh-islam-dhahabi p. 120}؛ وتوفي الأب عن ثلاث وأربعين سنة {cite:shadharat-dhahab p. 509}."
  en: "Abu Bakr al-Sam'ani died at the beginning of 510 (1116); foreseeing his death he had entrusted his son to his two learned brothers, and Abu Sa'd grew up among his uncles and family, turning as a youth to Qur'an, fiqh and study {cite:tarikh-islam-dhahabi p. 120}. The father was forty-three {cite:shadharat-dhahab p. 509}."
  ur: "ابو بکر سمعانی 510ھ ⁦(1116ء)⁩ کے آغاز میں فوت ہوئے؛ انہوں نے اپنی وفات سے پہلے بیٹے کو اپنے دو عالم بھائیوں کے سپرد کیا تھا، ابو سعد چچاؤں اور گھر والوں میں پلے اور جوانی کو پہنچتے ہی قرآن، فقہ اور تحصیل کی طرف مائل ہوئے {cite:tarikh-islam-dhahabi p. 120}۔ والد کی عمر تینتالیس سال تھی {cite:shadharat-dhahab p. 509}۔"
  es: "Abu Bakr al-Sam'ani murió a principios del año 510 (1116); previendo su muerte, había confiado a su hijo a sus dos hermanos eruditos, y Abu Sa'd creció entre sus tíos y familiares, dedicándose desde joven al Corán, al fiqh y al estudio {cite:tarikh-islam-dhahabi p. 120}. El padre tenía cuarenta y tres años {cite:shadharat-dhahab p. 509}."
  fr: "Abou Bakr al-Sam'ani mourut au début de l'an 510 (1116); pressentant sa mort, il avait confié son fils à ses deux frères érudits, et Abou Sa'd grandit parmi ses oncles et sa famille, se tournant dès son plus jeune âge vers le Coran, le fiqh et l'étude {cite:tarikh-islam-dhahabi p. 120}. Le père avait quarante-trois ans {cite:shadharat-dhahab p. 509}."
  tr: "Ebu Bekir el-Sam'ani, Hicri 510 yılının başlarında vefat etti. Ölümünden önce oğlunu iki ilim sahibi kardeşine emanet etmişti, bu yüzden Ebu Sa'd amcaları ve ailesi arasında büyüdü. Ergenlik çağına geldiğinde Kur'an'a, fıkıh ilmine ve çalışmalara yöneldi. {Kaynak:tarikh-islam-dhahabi s. 120}; babası ise kırk üç yaşında vefat etti. {Kaynak:shadharat-dhahab s. 509}"
  id: "Abu Bakr al-Sam’ani wafat pada awal tahun 510 Hijriah. Sebelum wafat, beliau telah mempercayakan putranya kepada dua saudara laki-lakinya yang berilmu, sehingga Abu Sa’d dibesarkan di antara paman-pamannya dan keluarganya. Ketika mencapai usia remaja, ia beralih mempelajari Al-Qur'an, fiqih, dan ilmu agama. {cite:tarikh-islam-dhahabi hlm. 120}; dan ayahnya meninggal pada usia empat puluh tiga tahun. {cite:shadharat-dhahab hlm. 509}."
