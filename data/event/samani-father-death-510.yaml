id: event/samani-father-death-510
class: event
kind: death
label:
  ar: "وفاة أبي بكر السمعاني وكفالة العمين للصبي عبد الكريم، ٥١٠هـ/١١١٦م"
  en: "Death of Abu Bakr al-Sam'ani; the boy 'Abd al-Karim is raised by his two learned uncles, 510/1116"
  ur: "ابو بکر سمعانی کی وفات؛ بچے عبدالکریم کی پرورش دو عالم چچاؤں کے سپرد، 510ھ/1116ء"
summary:
  ar: "مات أبو بكر السمعاني سنة عشر وخمسمائة في أولها، وقد أوصى بابنه قبل وفاته إلى أخويه العالمين، فتربّى أبو سعد بين أعمامه وأهله، فلما راهق أقبل على القرآن والفقه والاشتغال {cite:tarikh-islam-dhahabi p. 120}؛ وتوفي الأب عن ثلاث وأربعين سنة {cite:shadharat-dhahab p. 509}."
  en: "Abu Bakr al-Sam'ani died at the beginning of 510 (1116); foreseeing his death he had entrusted his son to his two learned brothers, and Abu Sa'd grew up among his uncles and family, turning as a youth to Qur'an, fiqh and study {cite:tarikh-islam-dhahabi p. 120}. The father was forty-three {cite:shadharat-dhahab p. 509}."
  ur: "ابو بکر سمعانی 510ھ ⁦(1116ء)⁩ کے آغاز میں فوت ہوئے؛ انہوں نے اپنی وفات سے پہلے بیٹے کو اپنے دو عالم بھائیوں کے سپرد کیا تھا، ابو سعد چچاؤں اور گھر والوں میں پلے اور جوانی کو پہنچتے ہی قرآن، فقہ اور تحصیل کی طرف مائل ہوئے {cite:tarikh-islam-dhahabi p. 120}۔ والد کی عمر تینتالیس سال تھی {cite:shadharat-dhahab p. 509}۔"
