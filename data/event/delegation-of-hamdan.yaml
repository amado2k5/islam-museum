id: event/delegation-of-hamdan
class: event
kind: gathering
label: { en: "The delegation and mission to Hamdan", ar: "وفد همدان", es: "La delegación y la misión a Hamdan", fr: "La délégation et la mission à Hamdan", ur: "وفد اور مشن ہمدان", tr: "Hamadan heyeti", id: "Delegasi Hamadan" }
summary:
  en: "A delegation of Hamdan came in 9 AH after Tabuk; the Prophet appointed Malik ibn al-Namt over their Muslims and sent Khalid ibn al-Walid to invite the rest — after six unanswered months Ali ibn Abi Talib was sent instead, the whole tribe embraced Islam, and the Prophet prostrated at the news saying: peace upon Hamdan."
  ar: "قدم وفد همدان سنة 9هـ بعد تبوك فأمّر النبي عليهم مالك بن النمط وبعث خالد بن الوليد يدعو سائرهم فأقام ستة أشهر لم يجيبوه، فبعث علي بن أبي طالب فأسلموا جميعاً، وخرّ النبي ساجداً حين قرأ كتاب علي وقال: السلام على همدان."
  es: "Una delegación de Hamdan llegó en el año 9 de la Hégira después de Tabuk; el Profeta nombró a Malik ibn al-Namt al frente de sus musulmanes y envió a Khalid ibn al-Walid para invitar al resto; después de seis meses sin respuesta, enviaron en su lugar a Ali ibn Abi Talib, toda la tribu abrazó el Islam y el Profeta se postró al oír la noticia diciendo: la paz sea con Hamdan."
  fr: "Une délégation de Hamdan arriva en l'an 9 de l'Hégire après Tabuk; le Prophète nomma Malik ibn al-Namt à la tête de leurs musulmans et envoya Khalid ibn al-Walid inviter le reste — après six mois sans réponse, Ali ibn Abi Talib fut envoyé à sa place, toute la tribu embrassa l'islam et le Prophète se prosterna à la nouvelle en disant: paix sur Hamdan."
  ur: "تبوک کے بعد 9 ہجری میں ہمدان کا وفد آیا۔ نبی نے مالک بن النمط کو ان کے مسلمانوں پر مقرر کیا اور خالد بن ولید کو باقی لوگوں کو دعوت دینے کے لیے بھیجا - چھ مہینوں کے بعد اس کی جگہ علی ابن ابی طالب کو بھیجا گیا، تمام قبیلے نے اسلام قبول کر لیا، اور نبی نے یہ کہتے ہوئے سجدہ کیا: حمدان پر سلام۔"
  tr: "Hamdan heyeti Tebük'ten sonra Hicri 9. yılda geldi. Bunun üzerine Peygamberimiz Malik bin el-Namat'ı onların lideri olarak atadı ve Halid bin el-Velid'i geri kalanını davet etmesi için gönderdi. Halid altı ay kaldı, ancak ona cevap vermediler. Bunun üzerine Peygamberimiz Ali bin Ebu Talib'i gönderdi ve hepsi İslam'ı kabul etti. Peygamberimiz Ali'nin mektubunu okuyunca secdeye kapandı ve şöyle dedi: \"Hamdan'a selam olsun.\""
  id: "Delegasi Hamdan datang pada tahun 9 Hijriah setelah Tabuk, maka Nabi menunjuk Malik bin Al-Namat sebagai pemimpin mereka dan mengutus Khalid bin Al-Walid untuk mengundang mereka yang lain. Ia tinggal selama enam bulan dan mereka tidak menanggapi ajakannya, maka beliau mengutus Ali bin Abi Talib dan mereka semua masuk Islam. Nabi sujud ketika membaca surat Ali dan berkata: Salam sejahtera atas Hamdan."
