label: { en: "The delegation and mission to Hamdan", ar: "وفد همدان" }
summary:
  en: "A delegation of Hamdan came in 9 AH after Tabuk; the Prophet appointed Malik ibn al-Namt over their Muslims and sent Khalid ibn al-Walid to invite the rest — after six unanswered months Ali ibn Abi Talib was sent instead, the whole tribe embraced Islam, and the Prophet prostrated at the news saying: peace upon Hamdan."
  ar: "قدم وفد همدان سنة 9هـ بعد تبوك فأمّر النبي عليهم مالك بن النمط وبعث خالد بن الوليد يدعو سائرهم فأقام ستة أشهر لم يجيبوه، فبعث علي بن أبي طالب فأسلموا جميعاً، وخرّ النبي ساجداً حين قرأ كتاب علي وقال: السلام على همدان."
