id: event/al-harithis-and-their-allies-enter-najran-before-dawn-286
class: event
kind: other
label:
  ar: دخول بني الحارث وحلفائهم نجران قبيل الفجر، 286هـ
  en: The Harithis and their allies enter Najran before dawn, 286 AH
  ur: بنو حارث اور ان کے حلیفوں کا فجر سے پہلے نجران میں داخل ہونا، 286ھ
summary:
  ar: يجتمع بنو الحارث ويبيتون بجانب نجران، وابن بسطام مع بني ربيعة وشاكر بأعلى نجران، فيسيرون عند الفجر إلى القرية ويكسرون جانب الحصن ويدخلون حتى باب دار الهادي وهو يصلي، فيتم صلاته ثم يخرج فيجد همدان قد انحازت إلى باب الدرب وتأبى الرجوع، فيرفض ترك القرية ويقاتل.
  en: Banu al-Harith gather and spend the night beside Najran, Ibn Bustam with Banu Rabi'a and Shakir in the upper part; at dawn they go to the village, break through a side of the fort and reach the door of al-Hadi's house as he prays; he finishes the prayer, finds Hamdan withdrawn to the lane gate and refusing to return, will not leave the village and fights.
  ur: بنو حارث جمع ہو کر نجران کے پہلو میں رات گزارتے ہیں، ابن بسطام بنو ربیعہ کے ساتھ اور شاکر نجران کے بالائی حصے میں؛ فجر کے وقت وہ بستی کی طرف چلتے ہیں، قلعے کا ایک پہلو توڑتے ہیں اور ہادی کے گھر کے دروازے تک پہنچتے ہیں جبکہ وہ نماز پڑھ رہے ہوتے ہیں؛ وہ نماز پوری کرتے ہیں، پھر نکل کر ہمدان کو دروازۂ گلی کی طرف ہٹا ہوا اور لوٹنے سے انکاری پاتے ہیں، وہ بستی چھوڑنے سے انکار کر کے لڑتے ہیں۔
