id: event/umar-covenant-jerusalem
class: event
kind: treaty
label: { ar: "العهدة العمرية لأهل إيلياء ⁦(بيت المقدس)⁩", en: "Umar's covenant with the people of Jerusalem", es: "El pacto de Umar con el pueblo de Jerusalén", fr: "L'alliance d'Umar avec le peuple de Jérusalem", ur: "یروشلم کے لوگوں کے ساتھ عمر کا عہد", tr: "Ömer'in Aelia (Kudüs) halkı için yaptığı antlaşma", id: "Perjanjian Umar untuk kaum Aelia (Yerusalem)" }
summary:
  ar: "وثيقة الأمان التي كتبها عمر بن الخطاب لأهل إيلياء عند صلحه معهم، وينقلها الكتاب عن الطبري: أمان لأنفسهم وأموالهم وكنائسهم وصلبانهم، لا تسكن كنائسهم ولا تهدم، ولا يكره أحد على دينه، ولا يسكن معهم يهودي في إيلياء، وعليهم الجزية. ويذكر الكتاب أنها كُتبت وشهد عليها خالد بن الوليد وعمرو بن العاص وعبد الرحمن بن عوف ومعاوية بن أبي سفيان، سنة 15هـ {cite:bayt-al-maqdis-fi-al-islam-azhar p. 61-62}. ويرى الكتاب أن اسم إيلياء ورد في الوثيقة لأنه كان الأشهر في موضع عقدها، ومعناه بيت الله {cite:bayt-al-maqdis-fi-al-islam-azhar p. 54-55}."
  en: "The covenant of safe-conduct that Umar ibn al-Khattab gave the people of Iliya when they surrendered the city, as the book quotes it from al-Tabari: safety for persons, property, churches and crosses; no church to be taken or destroyed; no compulsion in religion; no Jew to live in Iliya; the jizya to be paid. The book places it in 15 AH with four named witnesses {cite:bayt-al-maqdis-fi-al-islam-azhar p. 61-62}."
  es: "El pacto de salvoconducto que Umar ibn al-Khattab otorgó a los habitantes de Iliya cuando se rindieron a la ciudad, según lo cita el libro de al-Tabari, establecía: seguridad para las personas, los bienes, las iglesias y las cruces; ninguna iglesia sería tomada ni destruida; no habría coacción religiosa; ningún judío podría vivir en Iliya; y se debía pagar la jizya. El libro lo sitúa en el año 15 de la Hégira con cuatro testigos identificados {cite:bayt-al-maqdis-fi-al-islam-azhar, págs. 61-62}."
  fr: "Le pacte de sauf-conduit qu'Umar ibn al-Khattab accorda aux habitants d'Iliya lors de leur reddition, tel que rapporté dans l'ouvrage d'après al-Tabari: la sécurité des personnes, des biens, des églises et des croix; l'interdiction de prendre ou de détruire toute église; l'absence de contrainte religieuse; l'interdiction pour les Juifs de résider à Iliya; et le paiement de la jizya. L'ouvrage situe cet événement en l'an 15 de l'Hégire et mentionne quatre témoins nommés (voir: Bayt al-Maqdis fi al-Islam Azhar, p. 61-62)."
  ur: "حفاظتی سلوک کا وہ عہد جو عمر بن الخطاب نے ایلیا کے لوگوں کو دیا تھا جب انہوں نے شہر کو ہتھیار ڈالے تھے، جیسا کہ کتاب الطبری سے نقل کرتی ہے: افراد، جائیداد، گرجا گھروں اور صلیبوں کی حفاظت؛ کوئی چرچ نہ لیا جائے اور نہ ہی تباہ کیا جائے۔ دین میں جبر نہیں الیہ میں رہنے کے لیے کوئی یہودی نہیں جزیہ ادا کرنا ہے۔ کتاب نے اسے 15 ہجری میں چار نامزد گواہوں کے ساتھ درج کیا ہے {حوالہ: بیت المقدس فی الاسلام الازہر ص۔ 61-62}۔"
  tr: "El-Taberi'nin aktardığına göre, Ömer ibn el-Hattab'ın Kudüs halkıyla yaptığı barış antlaşması üzerine yazdığı koruma belgesinde şunlar belirtilmiştir: \"Hayatları, malları, kiliseleri ve haçları için güvenlik garantisi. Kiliseleri işgal edilmeyecek veya yıkılmayacak, kimse dinini değiştirmeye zorlanmayacak ve hiçbir Yahudi Kudüs'te onlarla birlikte ikamet etmeyecek. Cizye (baş vergisi) ödeyecekler.\" Belge, Hicri 15 yılında (Miladi 1635) Halid ibn el-Velid, Amr ibn el-As, Abd el-Rahman ibn Evf ve Muaviye ibn Ebu Sufyan tarafından yazılmış ve şahitlik edilmiştir. Kitap, belgede Kudüs adının geçmesinin, imzalandığı dönemde en yaygın isim olmasından ve \"Tanrı'nın Evi\" anlamına gelmesinden kaynaklandığını öne sürmektedir."
  id: "Dokumen perlindungan yang ditulis oleh Umar ibn al-Khattab untuk penduduk Yerusalem berdasarkan perjanjian damainya dengan mereka, sebagaimana dikutip oleh al-Tabari, menyatakan: Jaminan keselamatan bagi nyawa mereka, harta benda mereka, gereja-gereja mereka, dan salib-salib mereka. Gereja-gereja mereka tidak boleh dihuni atau dihancurkan, tidak seorang pun boleh dipaksa untuk mengubah agama mereka, dan tidak seorang pun Yahudi boleh tinggal bersama mereka di Yerusalem. Mereka wajib membayar jizya (pajak kepala). Dokumen tersebut ditulis dan disaksikan oleh Khalid ibn al-Walid, Amr ibn al-As, Abd al-Rahman ibn Awf, dan Muawiyah ibn Abi Sufyan pada tahun 15 H (1635 M). Buku tersebut menunjukkan bahwa nama Yerusalem muncul dalam dokumen tersebut karena merupakan nama yang paling umum pada saat penandatanganannya, dan artinya adalah \"Rumah Tuhan.\""
