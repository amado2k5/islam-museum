id: event/umar-covenant-jerusalem
class: event
kind: treaty
label: { ar: "العهدة العمرية لأهل إيلياء (بيت المقدس)", en: "Umar's covenant with the people of Jerusalem" }
summary:
  ar: "وثيقة الأمان التي كتبها عمر بن الخطاب لأهل إيلياء عند صلحه معهم، وينقلها الكتاب عن الطبري: أمان لأنفسهم وأموالهم وكنائسهم وصلبانهم، لا تسكن كنائسهم ولا تهدم، ولا يكره أحد على دينه، ولا يسكن معهم يهودي في إيلياء، وعليهم الجزية. ويذكر الكتاب أنها كُتبت وشهد عليها خالد بن الوليد وعمرو بن العاص وعبد الرحمن بن عوف ومعاوية بن أبي سفيان، سنة 15هـ {cite:bayt-al-maqdis-fi-al-islam-azhar p. 61-62}. ويرى الكتاب أن اسم إيلياء ورد في الوثيقة لأنه كان الأشهر في موضع عقدها، ومعناه بيت الله {cite:bayt-al-maqdis-fi-al-islam-azhar p. 54-55}."
  en: "The covenant of safe-conduct that Umar ibn al-Khattab gave the people of Iliya when they surrendered the city, as the book quotes it from al-Tabari: safety for persons, property, churches and crosses; no church to be taken or destroyed; no compulsion in religion; no Jew to live in Iliya; the jizya to be paid. The book places it in 15 AH with four named witnesses {cite:bayt-al-maqdis-fi-al-islam-azhar p. 61-62}."
