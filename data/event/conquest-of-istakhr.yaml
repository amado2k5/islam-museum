label: { ar: "فتح إصطخر", en: "Conquest of Istakhr", es: "Conquista de Istakhr", fr: "Conquête d'Istakhr", ur: "استخارہ کی فتح", tr: "İstikhr Fethi", id: "Penaklukan Istakhr" }
summary:
  ar: "ذكر أبو معشر والواقدي أن فتح إصطخر الأولى كان سنة ثلاث وعشرين، وقال سيف إنه كان بعد توج الآخرة {cite:tabari-tarikh-abu-al-fadl j.4 p.174}."
  en: "Abu Ma'shar and al-Waqidi report that the first conquest of Istakhr was in the year 23, while Sayf said it came after Tawwaj al-Akhira {cite:tabari-tarikh-abu-al-fadl j.4 p.174}."
  es: "Abu Ma'shar y al-Waqidi informan que la primera conquista de Istakhr fue en el año 23, mientras que Sayf dijo que ocurrió después de Tawwaj al-Akhira {cite:tabari-tarikh-abu-al-fadl j.4 p.174}."
  fr: "Abu Ma'shar et al-Waqidi rapportent que la première conquête d'Istakhr a eu lieu en l'an 23, tandis que Sayf a dit qu'elle est survenue après Tawwaj al-Akhira {cite:tabari-tarikh-abu-al-fadl j.4 p.174}."
  ur: "ابو معشر اور الواقدی بیان کرتے ہیں کہ استخارہ کی پہلی فتح 23 میں ہوئی جبکہ سیف نے کہا کہ یہ تواج الآخرہ کے بعد ہوئی ہے۔"
  tr: "Ebu Ma'şer ve El-Vakidi, İstikr'in ilk fethinin yirmi üçüncü yılda olduğunu belirtmişlerdir; Sayf ise bunun ikinci fetihten sonra olduğunu söylemiştir. {Kaynak: Tabari-tarikh-abu-al-fadl c.4 s.174}"
  id: "Abu Ma’shar dan Al-Waqidi menyebutkan bahwa penaklukan pertama Istakhr terjadi pada tahun dua puluh tiga, dan Sayf mengatakan bahwa itu terjadi setelah penaklukan kedua {cite:tabari-tarikh-abu-al-fadl j.4 p.174}."
