label: { ar: "وفاة القائم بأمر الله وخلافة المقتدي", en: "The death of al-Qa'im bi-Amr Allah and the accession of al-Muqtadi", es: "La muerte de al-Qa'im bi-Amr Allah y la ascensión de al-Muqtadi", fr: "La mort d'al-Qa'im bi-Amr Allah et l'accession au trône d'al-Muqtadi", ur: "القائم بن عمرو اللہ کی وفات اور مقتدی کا الحاق", tr: "El-Kaim'in ölümü ve el-Muktedi'nin halefi", id: "Kematian al-Qa'im dan suksesi al-Muqtadi" }
summary:
  ar: "في صفر سنة سبع وستين وأربعمائة مرض القائم بأمر الله مرضًا شديدًا وانتفخ حلقه، فلما احتضر كتب ولاية العهد لابن ابنه عبد الله بن ذخيرة الدين أبي العباس، فلما توفي استُخلف المقتدي يوم الجمعة ثالث عشر شعبان ولُقّب المقتدي بأمر الله، وجلس في دار الشجرة بقميص أبيض وعمامة لطيفة بيضاء وطرحة قصب درية، ودخل الوزير نحر الدولة وعميد الدولة ومؤيد الملك بن النظام والنقيبان وقاضي القضاة الدامغاني ودبيس ووجوه الأشراف والشهود فبايعوه، وكان أول من بايعه الشريف أبو جعفر بايعه عند غسل القائم قبل الناس وأنشده «إذا سيد منا مضى قام سيد»، ثم حُمل التابوت على الطيار يبكون من غير صراخ وصُلي عليه فكُبّر أربعًا ودُفن في حجرته التي كانت برسم خلوته. وكانت خلافة القائم خمسًا وأربعين سنة وأشهرًا {cite:muntazam-ibn-al-jawzi j.8 p.632-634}. وذُكر أن ملكشاه لما تغيّرت نيته على المقتدي وأراد منه أن يخرج من بغداد قال له أمهلني عشرة أيام فهلك السلطان في اليوم العاشر {cite:muntazam-ibn-al-jawzi j.8 p.634}."
  en: "In Safar 467 the caliph al-Qa'im fell gravely ill, his throat swelling; dying, he wrote the heirship for his grandson Abdallah ibn Dhakhirat al-Din. Al-Muqtadi was acclaimed Friday 13 Sha'ban 467 in the Dar al-Shajara in a white shirt and fine white turban — the first to swear was Sharif Abu Ja'far, who had given him bay'a at the caliph's washing before the people, quoting 'when a lord among us passes, a lord arises'; the bier was borne on the tayyar with weeping but no wailing, prayed over with four takbirs and buried in the caliph's own chamber of retreat. Al-Qa'im's caliphate had run forty-five years and some months; and when Malikshah later turned on al-Muqtadi demanding he quit Baghdad, the caliph asked ten days' respite — and the sultan died on the tenth day {cite:muntazam-ibn-al-jawzi j.8 p.632-634}."
  ur: "صفر 467ھ میں خلیفہ قائم بامر اللہ شدید بیمار ہوئے؛ وفات کے وقت انہوں نے اپنے پوتے عبداللہ بن ذخیرہ الدین کو ولی عہد لکھا۔ جمعہ 13 شعبان 467ھ کو مقتدی کی دار الشجرہ میں بیعت ہوئی اور سب سے پہلے شریف ابو جعفر نے بیعت کی؛ جنازہ چار تکبیرات کے ساتھ خلیفہ کے خلوت گاہ میں دفن ہوا۔ قائم کی خلافت پنتالیس برس اور کچھ مہینے رہی؛ اور جب ملکہ شاہ بعد میں مقتدی سے بغداد چھوڑنے کا مطالبہ کرنے لگا تو خلیفہ نے دس دن کی مہلت مانگی اور دسویں دن سلطان ہلاک ہو گیا {cite:muntazam-ibn-al-jawzi j.8 p.632-634}۔"
  es: "En Safar 467, el califa al-Qa'im enfermó gravemente, con la garganta hinchada; al morir, escribió la sucesión para su nieto Abdallah ibn Dhakhirat al-Din. Al-Muqtadi fue aclamado el viernes 13 de Sha'ban 467 en el Dar al-Shajara, vestido con una camisa blanca y un fino turbante blanco. El primero en jurar fue Sharif Abu Ja'far, quien le había prestado juramento durante el lavado del califa ante el pueblo, citando: «Cuando un señor entre nosotros muere, un señor surge». El féretro fue llevado en el tayyar entre llantos pero sin lamentos, se rezó sobre él con cuatro takbirs y fue enterrado en la cámara de retiro del propio califa. El califato de Al-Qa'im había durado cuarenta y cinco años y algunos meses. y cuando Malikshah más tarde se volvió contra al-Muqtadi exigiéndole que abandonara Bagdad, el califa pidió un respiro de diez días, y el sultán murió al décimo día {cite:muntazam-ibn-al-jawzi j.8 p.632-634}."
  fr: "En Safar 467, le calife al-Qa'im tomba gravement malade, souffrant d'une enflure à la gorge. Sur son lit de mort, il désigna son petit-fils Abdallah ibn Dhakhirat al-Din comme héritier. Al-Muqtadi fut acclamé le vendredi 13 Sha'ban 467 au Dar al-Shajara, vêtu d'une chemise blanche et d'un turban blanc. Le premier à prêter serment fut Sharif Abu Ja'far, qui lui avait prêté allégeance lors des ablutions du calife devant le peuple, citant: « Quand un seigneur parmi nous disparaît, un seigneur se lève ». Le cercueil fut porté sur le tayyar dans un silence empli de larmes mais sans lamentations, suivi de quatre takbirs et inhumé dans la chambre funéraire du calife. Le califat d'al-Qa'im avait duré quarante-cinq ans et quelques mois. et lorsque Malikshah s'est ensuite retourné contre al-Muqtadi en exigeant qu'il quitte Bagdad, le calife a demandé un délai de dix jours — et le sultan est mort le dixième jour {cite:muntazam-ibn-al-jawzi j.8 p.632-634}."
  tr: "Hicri 467 yılının Safer ayında, el-Kaim bi-Amr Allah ağır bir hastalığa yakalandı ve boğazı şişti. Ölüm döşeğindeyken, torunu Abdullah ibn Dakhira el-Din Ebu el-Abbas'ı halefi olarak tayin etti. Ölümünün ardından, el-Muktadi, Şaban ayının on üçüncü Cuma günü onun yerine geçti ve el-Muktadi bi-Amr Allah unvanını aldı. Ağaç Evi'nde beyaz bir gömlek, ince beyaz bir sarık ve ince bir kamış pelerin giyerek oturdu. Vezir Nahr el-Davla, Amid el-Davla, Muayyad el-Mulk ibn el-Nizam, iki Nakib, Baş Yargıç el-Damghani, Dabis ve diğer önde gelen şahsiyetler ve şahitler içeri girip ona biat ettiler. Biat eden ilk kişi, el-Kaim'in cenaze töreninde halkın önünde biat eden ve ona \"Liderlerimizden biri vefat ettiğinde, bir diğeri yükselir\" diye okuyan el-Şerif Ebu Cafer oldu. Ardından tabut omuzlarda taşındı ve yas tutanlar sessizce ağladı. Dört tekbirle cenaze namazı kılındı ve özel odasına defnedildi. El-Kaim'in halifeliği kırk beş yıl ve birkaç ay sürdü. Malikşah'ın el-Muktadi hakkındaki fikrini değiştirip Bağdat'tan ayrılmasını istediğinde, ona on gün süre vermesini söylediği ve Sultan'ın onuncu günde vefat ettiği rivayet edilir. {cite:muntazam-ibn-al-jawzi j.8 p.634}"
  id: "Pada bulan Safar tahun 467 H, al-Qa'im bi-Amr Allah jatuh sakit parah, dan tenggorokannya membengkak. Saat sekarat, beliau menunjuk cucunya, Abdullah ibn Dhakhira al-Din Abu al-Abbas, sebagai penggantinya. Setelah kematiannya, al-Muqtadi menggantikannya pada hari Jumat, tanggal 13 Sya'ban, dan diberi gelar al-Muqtadi bi-Amr Allah. Beliau duduk di Rumah Pohon, mengenakan kemeja putih, sorban putih yang indah, dan jubah alang-alang yang indah. Wazir, Nahr al-Dawla, Amid al-Dawla, Mu'ayyad al-Mulk ibn al-Nizam, kedua Naqib, Ketua Mahkamah Agung al-Damghani, Dabis, dan tokoh-tokoh terkemuka serta saksi lainnya masuk dan mengucapkan baiat kepadanya. Orang pertama yang menyatakan kesetiaan adalah al-Sharif Abu Ja'far, yang melakukannya pada saat pemakaman al-Qa'im, di hadapan orang banyak, dan membacakan kepadanya, \"Ketika salah seorang pemimpin kita wafat, pemimpin lain akan bangkit.\" Kemudian peti mati diusung di pundak, dengan para pelayat menangis dalam diam. Salat jenazah dilakukan, dengan empat takbir, dan ia dimakamkan di kamar pribadinya. Kekhalifahan al-Qa'im berlangsung selama empat puluh lima tahun dan beberapa bulan. Disebutkan bahwa ketika Malikshah berubah pikiran tentang Al-Muqtadi dan ingin dia meninggalkan Baghdad, dia menyuruhnya untuk memberinya waktu sepuluh hari, dan Sultan wafat pada hari kesepuluh. {cite:muntazam-ibn-al-jawzi j.8 p.634}."
