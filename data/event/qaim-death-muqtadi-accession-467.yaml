label: { ar: "وفاة القائم بأمر الله وخلافة المقتدي" }
summary:
  ar: "في صفر سنة سبع وستين وأربعمائة مرض القائم بأمر الله مرضًا شديدًا وانتفخ حلقه، فلما احتضر كتب ولاية العهد لابن ابنه عبد الله بن ذخيرة الدين أبي العباس، فلما توفي استُخلف المقتدي يوم الجمعة ثالث عشر شعبان ولُقّب المقتدي بأمر الله، وجلس في دار الشجرة بقميص أبيض وعمامة لطيفة بيضاء وطرحة قصب درية، ودخل الوزير نحر الدولة وعميد الدولة ومؤيد الملك بن النظام والنقيبان وقاضي القضاة الدامغاني ودبيس ووجوه الأشراف والشهود فبايعوه، وكان أول من بايعه الشريف أبو جعفر بايعه عند غسل القائم قبل الناس وأنشده «إذا سيد منا مضى قام سيد»، ثم حُمل التابوت على الطيار يبكون من غير صراخ وصُلي عليه فكُبّر أربعًا ودُفن في حجرته التي كانت برسم خلوته. وكانت خلافة القائم خمسًا وأربعين سنة وأشهرًا {cite:muntazam-ibn-al-jawzi j.8 p.632-634}. وذُكر أن ملكشاه لما تغيّرت نيته على المقتدي وأراد منه أن يخرج من بغداد قال له أمهلني عشرة أيام فهلك السلطان في اليوم العاشر {cite:muntazam-ibn-al-jawzi j.8 p.634}."
  en: "In Safar 467 the caliph al-Qa'im fell gravely ill, his throat swelling; dying, he wrote the heirship for his grandson Abdallah ibn Dhakhirat al-Din. Al-Muqtadi was acclaimed Friday 13 Sha'ban 467 in the Dar al-Shajara in a white shirt and fine white turban — the first to swear was Sharif Abu Ja'far, who had given him bay'a at the caliph's washing before the people, quoting 'when a lord among us passes, a lord arises'; the bier was borne on the tayyar with weeping but no wailing, prayed over with four takbirs and buried in the caliph's own chamber of retreat. Al-Qa'im's caliphate had run forty-five years and some months; and when Malikshah later turned on al-Muqtadi demanding he quit Baghdad, the caliph asked ten days' respite — and the sultan died on the tenth day {cite:muntazam-ibn-al-jawzi j.8 p.632-634}."
