summary:
  ar: "بطاقة أولية لحرب مليلية سنة ١٩٠٩م، صراع إسبانيا وقبائل الريف حول مليلية الذي سمي حرب المنجم؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the 1909 Melillan campaign, Spain's war with the Rif tribes around Melilla, the so-called Barranco del Lobo war; its sources are not yet checked on the page."
  es: "Ficha de reclutamiento para la campaña de Melilla de 1909, la guerra de España contra las tribus del Rif en los alrededores de Melilla, la llamada guerra del Barranco del Lobo; sus fuentes aún no han sido verificadas en la página."
  fr: "Fiche de conscription pour la campagne de Melilla de 1909, la guerre de l'Espagne contre les tribus du Rif autour de Melilla, la soi-disant guerre du Barranco del Lobo; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1909 میلان مہم کے لیے ڈرافٹ کارڈ، میلیلا کے ارد گرد رائف قبائل کے ساتھ اسپین کی جنگ، نام نہاد بارانکو ڈیل لوبو جنگ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1909 Melilla Savaşı'na (İspanya ile Rif kabileleri arasında Melilla üzerinde yaşanan ve Mayın Savaşı olarak da adlandırılan çatışma) dair ön bir açıklama; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Gambaran awal tentang Perang Melilla tahun 1909, konflik antara Spanyol dan suku-suku Rif memperebutkan Melilla, yang disebut Perang Tambang; sumber-sumbernya belum ditinjau di halaman ini."
