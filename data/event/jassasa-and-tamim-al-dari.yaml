id: event/jassasa-and-tamim-al-dari
class: event
kind: other
label:
  en: "The hadith of al-Jassasa: Tamim al-Dari's island account on the pulpit"
  ar: "حديث الجساسة: خبر تميم الداري في الجزيرة على المنبر"
  ur: "حدیثِ جساسہ: تمیم داری کی جزیرے کی روداد منبر پر"
  es: "El hadiz de al-Jassasa: El relato de Tamim al-Dari sobre la isla en el púlpito."
  fr: "Le hadith d'al-Jassasa: le récit de Tamim al-Dari sur l'île, prêché en chaire"
  tr: "El-Cessasah Hadisi: Tamim el-Dari'nin el-Cezire'deki minberde anlattığı hikaye"
  id: "Hadits al-Jassasah: Kisah Tamim al-Dari di al-Jazirah di mimbar"
summary:
  en: "In Sahih Muslim 2942, Fatima bint Qays relates that the Prophet gathered the people for prayer, sat on the pulpit and told them that Tamim al-Dari, newly Muslim, had described how a month at sea brought him and thirty men of Lakhm and Judham to an island, where a hairy creature called al-Jassasa sent them to a chained man who named himself the Messiah and asked about Baysan's palms, Lake Tiberias, the spring of Zughar and the Prophet {cite:sharh-nawawi-minhaj-risala on Muslim 2942}; al-Nawawi counts the report among Tamim's merits, and al-Suyuti names it the foundation example of a senior narrating from a junior {cite:tadrib-rawi-awwama-v5 p. 266}."
  ar: "في صحيح مسلم 2942 تروي فاطمة بنت قيس أن النبي جمع الناس للصلاة وجلس على المنبر وحدثهم أن تميماً الداري، وقد أسلم حديثاً، أخبره أن موج البحر ألقاه شهراً مع ثلاثين رجلاً من لخم وجذام إلى جزيرة، فلقيتهم دابة كثيرة الشعر تسمى الجساسة دلتهم على رجل مقيد قال إنه المسيح وسأل عن نخل بيسان وبحيرة طبرية وعين زغر ونبي العرب {cite:sharh-nawawi-minhaj-risala on Muslim 2942}؛ وعدّ النووي الخبر من مناقب تميم، وجعله السيوطي الأصل في رواية الأكابر عن الأصاغر {cite:tadrib-rawi-awwama-v5 p. 266}."
  es: "En Sahih Muslim 2942, Fátima bint Qays relata que el Profeta reunió a la gente para la oración, se sentó en el púlpito y les dijo que Tamim al-Dari, recién convertido al Islam, había descrito cómo un mes en el mar lo llevó a él y a treinta hombres de Lakhm y Judham a una isla, donde una criatura peluda llamada al-Jassasa los envió a un hombre encadenado que se hacía llamar el Mesías y preguntó por las palmas de Baysan, el lago Tiberíades, el manantial de Zughar y el Profeta {cite:sharh-nawawi-minhaj-risala on Muslim 2942}; al-Nawawi cuenta el relato entre los méritos de Tamim, y al-Suyuti lo nombra el ejemplo fundamental de un mayor que narra de un menor {cite:tadrib-rawi-awwama-v5 p. 266}."
  fr: "Dans Sahih Muslim 2942, Fatima bint Qays rapporte que le Prophète a rassemblé les gens pour la prière, s'est assis en chaire et leur a dit que Tamim al-Dari, nouvellement converti à l'islam, avait décrit comment un mois en mer l'avait amené, avec trente hommes de Lakhm et de Judham, sur une île, où une créature poilue appelée al-Jassasa les avait envoyés vers un homme enchaîné qui se prétendait le Messie et s'était renseigné sur les palmiers de Baysan, le lac de Tibériade, la source de Zughar et le Prophète {cite:sharh-nawawi-minhaj-risala on Muslim 2942}. Al-Nawawi compte ce récit parmi les mérites de Tamim, et al-Suyuti le cite comme l'exemple fondamental d'un aîné rapportant les propos d'un cadet {cite:tadrib-rawi-awwama-v5 p. 266}."
  ur: "صحیح مسلم 2942 میں فاطمہ بنت قیس بیان کرتی ہیں کہ رسول اللہ نے لوگوں کو نماز کے لیے جمع کیا، منبر پر بیٹھا اور بتایا کہ تمیم الداری، جو کہ نئے مسلمان ہوئے ہیں، نے بیان کیا ہے کہ کس طرح ایک مہینہ سمندر میں اسے اور لخم اور جودھم کے تیس آدمیوں کو ایک جزیرے پر لے آیا، جہاں ایک بالوں والی مخلوق نے ان سے الجسع نامی شخص کے بارے میں پوچھا، جس نے ان کے بارے میں پوچھا۔ بیسن کی کھجوریں، جھیل تبریاس، زغر کا چشمہ اور نبی {حوالہ کریں: شرح نووی منہاج رسالہ مسلم 2942}؛ النووی نے اس رپورٹ کو تمیم کی خوبیوں میں شمار کیا ہے، اور السیوطی نے اسے ایک جونیئر سے روایت کرنے کی بنیادی مثال قرار دیا ہے۔ 266}۔"
  tr: "Sahih Muslim 2942'de Fatıma bint Kays, Peygamber'in insanları namaz için topladığını, minbere oturduğunu ve onlara, yakın zamanda İslam'a geçen Tamim el-Dari'nin kendisine, deniz dalgalarının kendisini bir ay boyunca Lakhm ve Judham'dan otuz adamla birlikte bir adaya sürüklediğini ve orada el-Cessasah adında çok kıllı bir canavarla karşılaştıklarını, bu canavarın onları bağlı bir adama götürdüğünü, bu adamın kendisinin Mesih olduğunu söylediğini ve Beysan'ın hurma ağaçlarını, Celile Denizi'ni, Zuğrar pınarını ve Arapların Peygamberini sorduklarını anlattığını aktarmıştır. {Kaynak: Şerh-Nevevi-Minhaj-Risala, Muslim 2942}. El-Nevevi bu rivayeti Tamim'in faziletlerinden biri olarak kabul etmiş, el-Suyuti ise bunu büyüklerin küçüklerden rivayetine temel oluşturmuştur. {Kaynak: Tedrib-Ravi-Awwama-cilt 5, s. 266}"
  id: "Dalam Sahih Muslim 2942, Fatima bint Qais meriwayatkan bahwa Nabi mengumpulkan orang-orang untuk salat dan duduk di mimbar lalu memberi tahu mereka bahwa Tamim al-Dari, yang baru saja masuk Islam, mengatakan kepadanya bahwa gelombang laut telah menyeretnya selama sebulan bersama tiga puluh orang dari Lakhm dan Judham ke sebuah pulau, dan mereka bertemu dengan seekor binatang buas berbulu lebat bernama al-Jassasah, yang menuntun mereka kepada seorang pria yang terikat yang mengatakan bahwa dia adalah Al-Masih dan bertanya tentang pohon kurma Baysan, Laut Galilea, mata air Zughar, dan Nabi orang Arab {kutip:sharh-nawawi-minhaj-risala pada Muslim 2942}; dan al-Nawawi menganggap riwayat itu sebagai salah satu keutamaan Tamim, dan al-Suyuti menjadikannya dasar untuk riwayat para sesepuh dari para junior {kutip:tadrib-rawi-awwama-v5 hlm. 266}."
