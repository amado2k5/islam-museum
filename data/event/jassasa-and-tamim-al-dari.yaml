id: event/jassasa-and-tamim-al-dari
class: event
kind: other
label:
  en: "The hadith of al-Jassasa: Tamim al-Dari's island account on the pulpit"
  ar: "حديث الجساسة: خبر تميم الداري في الجزيرة على المنبر"
  ur: "حدیثِ جساسہ: تمیم داری کی جزیرے کی روداد منبر پر"
summary:
  en: "In Sahih Muslim 2942, Fatima bint Qays relates that the Prophet gathered the people for prayer, sat on the pulpit and told them that Tamim al-Dari, newly Muslim, had described how a month at sea brought him and thirty men of Lakhm and Judham to an island, where a hairy creature called al-Jassasa sent them to a chained man who named himself the Messiah and asked about Baysan's palms, Lake Tiberias, the spring of Zughar and the Prophet {cite:sharh-nawawi-minhaj-risala on Muslim 2942}; al-Nawawi counts the report among Tamim's merits, and al-Suyuti names it the foundation example of a senior narrating from a junior {cite:tadrib-rawi-awwama-v5 p. 266}."
  ar: "في صحيح مسلم 2942 تروي فاطمة بنت قيس أن النبي جمع الناس للصلاة وجلس على المنبر وحدثهم أن تميماً الداري، وقد أسلم حديثاً، أخبره أن موج البحر ألقاه شهراً مع ثلاثين رجلاً من لخم وجذام إلى جزيرة، فلقيتهم دابة كثيرة الشعر تسمى الجساسة دلتهم على رجل مقيد قال إنه المسيح وسأل عن نخل بيسان وبحيرة طبرية وعين زغر ونبي العرب {cite:sharh-nawawi-minhaj-risala on Muslim 2942}؛ وعدّ النووي الخبر من مناقب تميم، وجعله السيوطي الأصل في رواية الأكابر عن الأصاغر {cite:tadrib-rawi-awwama-v5 p. 266}."
