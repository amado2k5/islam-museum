label: { ar: "فيضان الفرات وخراب باب الأنبار", en: "The Euphrates flood and the ruin of Bab al-Anbar", es: "La inundación del Éufrates y la ruina de Bab al-Anbar", fr: "La crue de l'Euphrate et la ruine de Bab al-Anbar", ur: "فرات کا سیلاب اور باب الانبار کی بربادی۔", tr: "Fırat Nehri'nin taşması ve Anbar Kapısı'nın yıkılması", id: "Banjir Sungai Eufrat dan kehancuran Gerbang Anbar" }
summary:
  ar: "في سنة تسع وعشرين وثلاثمائة زاد الفرات أحد عشر ذراعًا وانبثق من نواحي الأنبار فاجتاح القرى وغرقها وغرق الناس والبهائم والوحش، وصب الماء في الصراة إلى بغداد ودخل شوارع الجانب الغربي فغرق شارع باب الأنبار حتى لم يبق منه منزل إلا سقط، وتساقطت الأبنية على الصراة وسقطت قنطرة الصراة الحديدة وانقطع بعض الدليق، وزادت دجلة ثمانية عشر ذراعًا في أيار وحزيران {cite:muntazam-ibn-al-jawzi p. 608}."
  en: "In 329 the Euphrates rose eleven cubits and burst from the Anbar side, sweeping villages, people, cattle and beasts; water poured down the Sarat into Baghdad's western quarters drowning Bab al-Anbar street to the last house, toppling the Sarat's iron bridge — while the Tigris rose eighteen cubits in May–June {cite:muntazam-ibn-al-jawzi p. 608}."
  es: "En 329, el Éufrates creció once codos y se desbordó desde el lado de Anbar, arrasando aldeas, personas, ganado y bestias; el agua bajó por el Sarat hacia los barrios occidentales de Bagdad, inundando la calle Bab al-Anbar hasta la última casa y derribando el puente de hierro del Sarat, mientras que el Tigris creció dieciocho codos en mayo-junio {cite:muntazam-ibn-al-jawzi p. 608}."
  fr: "En 329, l'Euphrate monta de onze coudées et jaillit du côté d'Anbar, emportant villages, hommes, bétail et bêtes; l'eau se déversa du Sarat dans les quartiers occidentaux de Bagdad, inondant la rue Bab al-Anbar jusqu'à la dernière maison et faisant s'écrouler le pont de fer du Sarat — tandis que le Tigre monta de dix-huit coudées en mai-juin {cite:muntazam-ibn-al-jawzi p. 608}."
  ur: "329 میں فرات گیارہ ہاتھ بڑھی اور انبار کی طرف سے پھٹ گئی، دیہاتوں، لوگوں، مویشیوں اور حیوانوں کو صاف کرتے ہوئے؛ سیرت کو بغداد کے مغربی حلقوں میں پانی بہا دیا گیا اور باب الانبار گلی کو ڈوبتے ہوئے آخری گھر تک پہنچ گیا، سرت کے لوہے کے پل کو گرا دیا - جبکہ دجلہ مئی جون میں اٹھارہ ہاتھ بلند ہوا {حوالہ:منتظم ابن الجوزی صفحہ 608}۔"
  tr: "Hicri 329 yılında Fırat Nehri on bir arşın yükseldi ve Anbar civarından taşarak köyleri sular altında bıraktı; insanları, hayvanları ve vahşi hayvanları boğdu. Sular Bağdat yönünde Sarat Nehri'ne aktı ve batı yakasındaki sokaklara girdi; öyle ki Bab el-Anbar Caddesi sular altında kaldı ve yıkılan evlerin hepsi sular altında kaldı. Binalar Sarat Nehri üzerine yıkıldı, Sarat'ın demir köprüsü çöktü ve bazı sulama kanalları kesildi. Dicle Nehri Mayıs ve Haziran aylarında on sekiz arşın yükseldi. {cite:muntazam-ibn-al-jawzi s. 608}"
  id: "Pada tahun 329 Hijriah, Sungai Eufrat bertambah sebelas hasta dan meluap dari sekitar Anbar, menyapu desa-desa dan menenggelamkannya, serta menewaskan manusia, hewan, dan binatang buas. Air mengalir ke Sungai Sarat menuju Baghdad dan memasuki jalan-jalan di sisi barat, sehingga Jalan Bab al-Anbar tergenang hingga tidak ada rumah yang tersisa kecuali yang telah roboh. Bangunan-bangunan di Sungai Sarat runtuh, jembatan besi Sungai Sarat ambruk, dan beberapa saluran irigasi terputus. Sungai Tigris bertambah delapan belas hasta pada bulan Mei dan Juni. {cite:muntazam-ibn-al-jawzi p. 608}"
