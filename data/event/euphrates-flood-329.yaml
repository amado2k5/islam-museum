label: { ar: "فيضان الفرات وخراب باب الأنبار", en: "The Euphrates flood and the ruin of Bab al-Anbar", es: "La inundación del Éufrates y la ruina de Bab al-Anbar", fr: "La crue de l'Euphrate et la ruine de Bab al-Anbar" }
summary:
  ar: "في سنة تسع وعشرين وثلاثمائة زاد الفرات أحد عشر ذراعًا وانبثق من نواحي الأنبار فاجتاح القرى وغرقها وغرق الناس والبهائم والوحش، وصب الماء في الصراة إلى بغداد ودخل شوارع الجانب الغربي فغرق شارع باب الأنبار حتى لم يبق منه منزل إلا سقط، وتساقطت الأبنية على الصراة وسقطت قنطرة الصراة الحديدة وانقطع بعض الدليق، وزادت دجلة ثمانية عشر ذراعًا في أيار وحزيران {cite:muntazam-ibn-al-jawzi p. 608}."
  en: "In 329 the Euphrates rose eleven cubits and burst from the Anbar side, sweeping villages, people, cattle and beasts; water poured down the Sarat into Baghdad's western quarters drowning Bab al-Anbar street to the last house, toppling the Sarat's iron bridge — while the Tigris rose eighteen cubits in May–June {cite:muntazam-ibn-al-jawzi p. 608}."
  es: "En 329, el Éufrates creció once codos y se desbordó desde el lado de Anbar, arrasando aldeas, personas, ganado y bestias; el agua bajó por el Sarat hacia los barrios occidentales de Bagdad, inundando la calle Bab al-Anbar hasta la última casa y derribando el puente de hierro del Sarat, mientras que el Tigris creció dieciocho codos en mayo-junio {cite:muntazam-ibn-al-jawzi p. 608}."
  fr: "En 329, l'Euphrate monta de onze coudées et jaillit du côté d'Anbar, emportant villages, hommes, bétail et bêtes; l'eau se déversa du Sarat dans les quartiers occidentaux de Bagdad, inondant la rue Bab al-Anbar jusqu'à la dernière maison et faisant s'écrouler le pont de fer du Sarat — tandis que le Tigre monta de dix-huit coudées en mai-juin {cite:muntazam-ibn-al-jawzi p. 608}."
