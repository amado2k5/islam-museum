label: { ar: "فيضان الفرات وخراب باب الأنبار" }
summary:
  ar: "في سنة تسع وعشرين وثلاثمائة زاد الفرات أحد عشر ذراعًا وانبثق من نواحي الأنبار فاجتاح القرى وغرقها وغرق الناس والبهائم والوحش، وصب الماء في الصراة إلى بغداد ودخل شوارع الجانب الغربي فغرق شارع باب الأنبار حتى لم يبق منه منزل إلا سقط، وتساقطت الأبنية على الصراة وسقطت قنطرة الصراة الحديدة وانقطع بعض الدليق، وزادت دجلة ثمانية عشر ذراعًا في أيار وحزيران {cite:muntazam-ibn-al-jawzi p. 608}."
  en: "In 329 the Euphrates rose eleven cubits and burst from the Anbar side, sweeping villages, people, cattle and beasts; water poured down the Sarat into Baghdad's western quarters drowning Bab al-Anbar street to the last house, toppling the Sarat's iron bridge — while the Tigris rose eighteen cubits in May–June {cite:muntazam-ibn-al-jawzi p. 608}."
