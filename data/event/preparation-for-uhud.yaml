  tr: "Bedir Savaşı'ndaki yenilgilerinin ardından Kureyşliler, Müslümanlardan intikam almak için büyük çaplı bir askeri ve mali seferberlik başlattılar."
  id: "Pengerahan militer dan keuangan besar-besaran dilakukan oleh kaum Quraisy untuk membalas dendam kepada kaum Muslimin setelah kekalahan mereka di Badr."
