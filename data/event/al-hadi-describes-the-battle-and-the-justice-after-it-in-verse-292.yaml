id: event/al-hadi-describes-the-battle-and-the-justice-after-it-in-verse-292
class: event
kind: other
label:
  ar: "أبيات للهادي في وصف القتال وفي الحكم بالكتاب والعدل بعده، ص305-306"
  en: "Verses of al-Hadi describing the fighting and judging by the Book, and the justice that follows, pp. 305-306"
  ur: "ہادی کے اشعار: لڑائی کا بیان، کتاب کے مطابق فیصلہ اور اس کے بعد عدل، ص305-306"
  es: "Versículos de al-Hadi que describen la lucha y el juicio según el Libro, y la justicia que le sigue, págs. 305-306."
  fr: "Versets d'al-Hadi décrivant le combat et le jugement selon le Livre, et la justice qui en découle, pp. 305-306"
  tr: "Hadi'nin, kendisinden sonra Kitap ve adaletle savaşmayı ve yönetmeyi anlatan ayetleri, s. 305-306"
  id: "Ayat-ayat Al-Hadi yang menjelaskan tentang peperangan dan pemerintahan berdasarkan Kitab dan keadilan setelahnya, hlm. 305-306"
summary:
  ar: "تتم القصيدة في ص305 بقول الشاعر إنه سيكون بينهم يضرب جماجمهم ومعه المؤمنون أولو المعالي وقبائل يمانية، وإن الله ينصر دينه فيبكون في الأسر، وإنه يحكم بكتاب ربه وسنة جده، ثم في ص306 تصوّر الأبيات زوال الجور وظهور الحق ورضا الله وعودة الناس إلى العدل وإشباع الأرامل واليتامى وقضاء الديون وقسمة الفيء بين الجميع."
  en: "The poem ends on p. 305 with the poet saying that he will be among them striking their skulls with the believers of high station and Yemeni tribes about him, that God will help his religion and they will wail in captivity, and that he will judge by the Book of his Lord and the Sunna of his grandfather; on p. 306 the lines picture tyranny going, the right appearing, God being pleased, the people returning to justice, widows and orphans fed, debts paid and the spoils divided among all."
  ur: "نظم ص305 پر اس پر مکمل ہوتی ہے کہ شاعر کہتا ہے کہ وہ ان کے بیچ ہو گا، ان کی کھوپڑیوں پر وار کرتا ہوا، اور اس کے گرد بلند مرتبہ مومن اور یمانی قبائل ہوں گے، کہ اللہ اپنے دین کی مدد کرے گا تو وہ قید میں روئیں گے، اور کہ وہ اپنے رب کی کتاب اور اپنے دادا کی سنت کے مطابق فیصلہ کرے گا؛ ص306 پر اشعار ظلم کے ختم ہونے، حق کے روشن ہونے، اللہ کے راضی ہونے، لوگوں کے عدل کی طرف لوٹنے، بیواؤں اور یتیموں کو سیر کرنے، قرض ادا ہونے اور مال فئے کے سب میں تقسیم ہونے کی تصویر دکھاتے ہیں۔"
  es: "El poema termina en la página 305 con el poeta diciendo que estará entre ellos golpeando sus cráneos con los creyentes de alta posición y las tribus yemeníes a su alrededor, que Dios ayudará a su religión y ellos se lamentarán en cautiverio, y que juzgará por el Libro de su Señor y la Sunna de su abuelo; en la página 306 los versos describen la tiranía que se va, la justicia que aparece, Dios complacido, el pueblo que regresa a la justicia, viudas y huérfanos alimentados, deudas pagadas y el botín repartido entre todos."
  fr: "Le poème se termine à la page 305 par les propos du poète affirmant qu'il sera parmi eux, frappant leurs crânes avec les croyants de haut rang et les tribus yéménites autour de lui, que Dieu aidera sa religion et qu'ils gémiront en captivité, et qu'il jugera selon le Livre de son Seigneur et la Sunna de son grand-père; à la page 306, les vers décrivent la fin de la tyrannie, le triomphe du droit, la satisfaction de Dieu, le retour du peuple à la justice, les veuves et les orphelins nourris, les dettes payées et le butin partagé entre tous."
  tr: "Şiir, 305. sayfada şairin aralarında olacağını, kafataslarını kıracağını, yanında yüksek mevkideki müminlerin ve Yemen kabilelerinin de bulunacağını, Allah'ın dinini destekleyeceğini, bu yüzden esaret altında ağlayacaklarını ve Rabbinin kitabıyla ve dedesinin sünnetiyle hüküm süreceğini söylemesiyle tamamlanır. Ardından 306. sayfadaki dizeler, adaletsizliğin ortadan kaldırılmasını, hakikatin ortaya çıkmasını, Allah'ın rızasını, insanların adalete dönmesini, dulların ve yetimlerin doyurulmasını, borçların ödenmesini ve ganimetin herkese paylaştırılmasını tasvir eder."
  id: "Puisi tersebut diselesaikan pada halaman 305 dengan sang penyair mengatakan bahwa ia akan berada di antara mereka, memukul tengkorak mereka, dan bersamanya akan ada orang-orang beriman yang berkedudukan tinggi dan suku-suku Yaman, dan bahwa Tuhan akan mendukung agamanya, sehingga mereka akan menangis dalam penawanan, dan bahwa ia akan memerintah dengan kitab Tuhannya dan Sunnah kakeknya. Kemudian pada halaman 306, bait-baitnya menggambarkan penghapusan ketidakadilan, munculnya kebenaran, keridhaan Tuhan, kembalinya manusia kepada keadilan, pemuasan janda dan yatim piatu, pelunasan hutang, dan pembagian rampasan perang di antara semua."
