id: event/al-hadi-describes-the-battle-and-the-justice-after-it-in-verse-292
class: event
kind: other
label:
  ar: "أبيات للهادي في وصف القتال وفي الحكم بالكتاب والعدل بعده، ص305-306"
  en: "Verses of al-Hadi describing the fighting and judging by the Book, and the justice that follows, pp. 305-306"
  ur: "ہادی کے اشعار: لڑائی کا بیان، کتاب کے مطابق فیصلہ اور اس کے بعد عدل، ص305-306"
summary:
  ar: "تتم القصيدة في ص305 بقول الشاعر إنه سيكون بينهم يضرب جماجمهم ومعه المؤمنون أولو المعالي وقبائل يمانية، وإن الله ينصر دينه فيبكون في الأسر، وإنه يحكم بكتاب ربه وسنة جده، ثم في ص306 تصوّر الأبيات زوال الجور وظهور الحق ورضا الله وعودة الناس إلى العدل وإشباع الأرامل واليتامى وقضاء الديون وقسمة الفيء بين الجميع."
  en: "The poem ends on p. 305 with the poet saying that he will be among them striking their skulls with the believers of high station and Yemeni tribes about him, that God will help his religion and they will wail in captivity, and that he will judge by the Book of his Lord and the Sunna of his grandfather; on p. 306 the lines picture tyranny going, the right appearing, God being pleased, the people returning to justice, widows and orphans fed, debts paid and the spoils divided among all."
  ur: "نظم ص305 پر اس پر مکمل ہوتی ہے کہ شاعر کہتا ہے کہ وہ ان کے بیچ ہو گا، ان کی کھوپڑیوں پر وار کرتا ہوا، اور اس کے گرد بلند مرتبہ مومن اور یمانی قبائل ہوں گے، کہ اللہ اپنے دین کی مدد کرے گا تو وہ قید میں روئیں گے، اور کہ وہ اپنے رب کی کتاب اور اپنے دادا کی سنت کے مطابق فیصلہ کرے گا؛ ص306 پر اشعار ظلم کے ختم ہونے، حق کے روشن ہونے، اللہ کے راضی ہونے، لوگوں کے عدل کی طرف لوٹنے، بیواؤں اور یتیموں کو سیر کرنے، قرض ادا ہونے اور مال فئے کے سب میں تقسیم ہونے کی تصویر دکھاتے ہیں۔"
