id: event/last-message-of-sad-ibn-al-rabi-at-uhud
class: event
kind: death
label:
  ar: رسالة سعد بن الربيع الأخيرة يوم أحد وما خلّفه
  en: Last message of Sad ibn al-Rabi at Uhud and what he left
  ur: احد کے دن سعد بن ربیع کا آخری پیغام اور ان کا ترکہ
  es: "Último mensaje de Sad ibn al-Rabi en Uhud y lo que dejó"
  fr: "Dernier message de Sad ibn al-Rabi à Uhud et ce qu'il a laissé."
summary:
  ar: "بعد القتال يوم أحد سأل النبي مَن يأتيه بخبر سعد بن الربيع، فخرج رجل من الأنصار يطوف بين القتلى حتى وجده جريحاً وبه رمق، فحمّله سعد سلامه للنبي ودعاءه له بخير ما جزى نبياً عن أمته، وأن يبلغ قومه أنه لا عذر لهم عند الله إن وُصل إلى نبيهم ومنهم عين تطرف {cite:ibn-hisham-sira scan p. 395} {cite:siyar-alam-nubala scan vol. 2 p. 316}. ويسمّي ابن عبد البر الذاهب أُبيّ بن كعب، ويذكر أنه لم يبرح حتى مات سعد، فقال النبي إنه نصح لله ولرسوله حياً وميتاً {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 280}. وفي رواية زيد بن ثابت أن النبي هو الذي بعثه وأن سعداً كان به سبعون ضربة {cite:siyar-alam-nubala scan vol. 2 p. 317}. وخلّف ابنتين، فقُسم لهما الثلثان، وعمّهما أخذ مالهما قبل ذلك في رواية جابر {cite:siyar-alam-nubala scan vol. 2 p. 317} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 280}. ودُفن مع خارجة بن زيد في قبر واحد بأحد {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 280}."
  en: "After the fighting at Uhud the Prophet asked who would bring him news of Sad ibn al-Rabi; a man of the Ansar went about among the dead until he found Sad wounded and still breathing, and Sad gave him his greeting for the Prophet, his prayer that God reward the Prophet as well as He has ever rewarded a prophet for his people, and a message to his own people that they would have no excuse before God if harm reached their prophet while an eye of theirs still blinked {cite:ibn-hisham-sira scan p. 395} {cite:siyar-alam-nubala scan vol. 2 p. 316}. Ibn Abd al-Barr names the messenger as Ubayy ibn Kab and says he did not leave until Sad died, whereupon the Prophet said that Sad had been sincere to God and His messenger in life and in death {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 280}. In Zayd ibn Thabit's report it was the Prophet who sent him, and Sad bore seventy wounds {cite:siyar-alam-nubala scan vol. 2 p. 317}. He left two daughters who were given two thirds, after their uncle, in Jabir's report, had taken their property {cite:siyar-alam-nubala scan vol. 2 p. 317} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 280}. He was buried with Kharija ibn Zayd in one grave at Uhud {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 280}."
  ur: "احد کی لڑائی کے بعد نبی نے پوچھا کہ سعد بن ربیع کی خبر کون لائے گا؛ انصار کا ایک شخص مقتولوں میں گھومتا رہا یہاں تک کہ سعد کو زخمی اور آخری سانسوں میں پایا، تو سعد نے نبی کے لیے سلام، یہ دعا کہ اللہ آپ کو وہ بہترین بدلہ دے جو کسی نبی کو اس کی امت کی طرف سے دیا ہے، اور اپنی قوم کے نام یہ پیغام دیا کہ اگر ان کی آنکھ جھپکتی رہی اور نبی تک گزند پہنچی تو اللہ کے ہاں ان کا کوئی عذر نہ ہو گا {cite:ibn-hisham-sira scan p. 395} {cite:siyar-alam-nubala scan vol. 2 p. 316}. ابن عبدالبر قاصد کا نام ابی بن کعب بتاتے ہیں اور کہتے ہیں کہ وہ سعد کی وفات تک وہاں رہے، تو نبی نے فرمایا کہ سعد نے زندگی اور موت میں اللہ اور اس کے رسول کی خیرخواہی کی {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 280}. زید بن ثابت کی روایت میں نبی ہی نے انھیں بھیجا اور سعد کو ستر زخم تھے {cite:siyar-alam-nubala scan vol. 2 p. 317}. انھوں نے دو بیٹیاں چھوڑیں جنھیں دو تہائی دیا گیا، جبکہ جابر کی روایت میں ان کے چچا نے پہلے ان کا مال لے لیا تھا {cite:siyar-alam-nubala scan vol. 2 p. 317} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 280}. وہ احد میں خارجہ بن زید کے ساتھ ایک ہی قبر میں دفن ہوئے {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 280}."
  es: "Después de la batalla de Uhud, el Profeta preguntó quién le traería noticias de Sad ibn al-Rabi; un hombre de los Ansar anduvo entre los muertos hasta que encontró a Sad herido y aún respirando, y Sad le transmitió su saludo para el Profeta, su oración para que Dios recompensara al Profeta como siempre ha recompensado a un profeta para su pueblo, y un mensaje a su propio pueblo de que no tendrían excusa ante Dios si el daño alcanzaba a su profeta mientras aún tenían un ojo parpadeando {cite:ibn-hisham-sira scan p. 395} {cite:siyar-alam-nubala scan vol. 2 p. 316}. Ibn Abd al-Barr nombra al mensajero como Ubayy ibn Kab y dice que no se fue hasta que Sad murió, tras lo cual el Profeta dijo que Sad había sido sincero con Dios y Su mensajero en vida y en la muerte {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 280}. En el relato de Zayd ibn Thabit, fue el Profeta quien lo envió, y Sad sufrió setenta heridas {cite:siyar-alam-nubala scan vol. 2 p. 317}. Dejó dos hijas a quienes se les dieron dos tercios, después de que su tío, según el relato de Jabir, se apoderara de sus propiedades {cite:siyar-alam-nubala scan vol. 2 p. 317} {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 280}. Fue enterrado con Kharija ibn Zayd en una tumba en Uhud {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 280}."
  fr: "Après la bataille d'Uhud, le Prophète demanda qui lui apporterait des nouvelles de Sa'd ibn al-Rabi. Un homme des Ansar parcourut les cadavres jusqu'à trouver Sa'd blessé mais encore vivant. Sa'd lui transmit alors les salutations du Prophète, pria pour que Dieu le récompense comme Il l'a toujours fait pour son peuple, et adressa à son peuple un message: ils n'auraient aucune excuse devant Dieu si le malheur atteignait leur Prophète de son vivant. Ibn Hisham Sira, scan. p. 395; Siyar Alam Nubala, scan. vol. 2, p. 316. Ibn Abd al-Barr nomme le messager Ubayy ibn Kab et précise qu'il resta jusqu'à la mort de Sa'd. Le Prophète déclara alors que Sa'd était resté sincère envers Dieu et Son messager, tant dans sa vie que dans sa mort. D'après le récit de Zayd ibn Thabit, c'est le Prophète qui l'envoya, et Sa'd reçut soixante-dix blessures (Siyar-alam-nubala, vol. 2, p. 317). Il laissa deux filles auxquelles il hérita des deux tiers de ses biens, après que leur oncle, selon le récit de Jabir, se fut approprié leurs possessions (Siyar-alam-nubala, vol. 2, p. 317; Isti-ab-ibn-abd-al-barr, vol. 3, p. 280). Il fut enterré avec Kharija ibn Zayd dans une même tombe à Uhud (Isti-ab-ibn-abd-al-barr, vol. 3, p. 280)."
