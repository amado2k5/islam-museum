label:
  ar: "النويري يُبعث إلى الشام لإدارة ديوان الخاص، جمادى الآخرة ٧٠١هـ/يناير ١٣٠٢م"
  en: "Al-Nuwayri sent to Syria to run the diwan al-khass, Jumada II 701/January 1302"
  ur: "نويری دیوان خاص کی انتظامیہ کے لیے شام روانہ، جمادی الثانی 701ھ/جنوری 1302ء"
summary:
  ar: "سافر النويري إلى الشام في جمادى الآخرة سنة ٧٠١هـ بناءً على طلب السلطان ليدير أملاك الدولة، أي ديوان الخاص، وقد اضطرب الشام منذ ٦٩٩هـ بغزوة غازان خان الكبرى؛ وأقام بدمشق سنتين وأربعة أشهر طاف خلالها بالبلاد فيذكر سفراً في الغور ويصف غوطة دمشق بعناية كوصفه الصعيد، وصادق أمير الشد سيف الدين بلبان الجكندر المنصوري الذي ولي شدّ الأملاك سنة ٧٠٢هـ {cite:encyclopaedia-of-islam-2 vol. 8 p. 157}."
  en: "In Jumada II 701 (January 1302) al-Nuwayri travelled to Syria at the sultan's request to manage state property, the diwan al-khass — Syria had been in turmoil since Ghazan Khan's great invasion of 699. He stayed in Damascus two years and four months, travelling the country: he mentions a journey in the Ghawr and describes the Ghuta of Damascus with the same detail he gave Upper Egypt, and he befriended Sayf al-Din Balaban al-Jukandar al-Mansuri, appointed shadd of crown property in 702 {cite:encyclopaedia-of-islam-2 vol. 8 p. 157}."
  ur: "جمادی الثانی 701ھ ⁦(جنوری 1302ء)⁩ میں نويری سلطان کی فرمائش پر ریاستی املاک — دیوان خاص — کی انتظامیہ کے لیے شام گئے؛ شام 699ھ میں غازان خان کی بڑی یلغار سے ابتداء سے بے چین تھا۔ وہ دمشق میں دو سال چار ماہ رہے اور ملک گرد پھرے: غور کا سفر یاد کرتے ہیں اور غوطہ دمشق کو اسی تفصیل سے بیان کرتے ہیں جیسے صعید کو؛ 702ھ میں تاج کی املاک کا شد مقرر ہونے والے سیف الدین بلبان جکندر منصوری سے ان کی دوستی ہوئی {cite:encyclopaedia-of-islam-2 vol. 8 p. 157}۔"
