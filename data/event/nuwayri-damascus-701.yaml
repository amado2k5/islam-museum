label:
  ar: "النويري يُبعث إلى الشام لإدارة ديوان الخاص، جمادى الآخرة ٧٠١هـ/يناير ١٣٠٢م"
  en: "Al-Nuwayri sent to Syria to run the diwan al-khass, Jumada II 701/January 1302"
  ur: "نويری دیوان خاص کی انتظامیہ کے لیے شام روانہ، جمادی الثانی 701ھ/جنوری 1302ء"
  es: "Al-Nuwayri enviado a Siria para dirigir el diwan al-khass, Jumada II 701/enero de 1302"
  fr: "Al-Nuwayri envoyé en Syrie pour diriger le diwan al-khass, Joumada II 701/janvier 1302"
  tr: "Al-Nuwayri, Jumada al-Ahirah (H. 701 / Ocak 1302) adlı özel ofisi yönetmek üzere Şam'a gönderildi."
  id: "Al-Nuwayri dikirim ke Damaskus untuk mengelola kantor swasta, Jumada al-Akhirah 701 H/Januari 1302 M."
summary:
  ar: "سافر النويري إلى الشام في جمادى الآخرة سنة ٧٠١هـ بناءً على طلب السلطان ليدير أملاك الدولة، أي ديوان الخاص، وقد اضطرب الشام منذ ٦٩٩هـ بغزوة غازان خان الكبرى؛ وأقام بدمشق سنتين وأربعة أشهر طاف خلالها بالبلاد فيذكر سفراً في الغور ويصف غوطة دمشق بعناية كوصفه الصعيد، وصادق أمير الشد سيف الدين بلبان الجكندر المنصوري الذي ولي شدّ الأملاك سنة ٧٠٢هـ {cite:encyclopaedia-of-islam-2 vol. 8 p. 157}."
  en: "In Jumada II 701 (January 1302) al-Nuwayri travelled to Syria at the sultan's request to manage state property, the diwan al-khass — Syria had been in turmoil since Ghazan Khan's great invasion of 699. He stayed in Damascus two years and four months, travelling the country: he mentions a journey in the Ghawr and describes the Ghuta of Damascus with the same detail he gave Upper Egypt, and he befriended Sayf al-Din Balaban al-Jukandar al-Mansuri, appointed shadd of crown property in 702 {cite:encyclopaedia-of-islam-2 vol. 8 p. 157}."
  ur: "جمادی الثانی 701ھ ⁦(جنوری 1302ء)⁩ میں نويری سلطان کی فرمائش پر ریاستی املاک — دیوان خاص — کی انتظامیہ کے لیے شام گئے؛ شام 699ھ میں غازان خان کی بڑی یلغار سے ابتداء سے بے چین تھا۔ وہ دمشق میں دو سال چار ماہ رہے اور ملک گرد پھرے: غور کا سفر یاد کرتے ہیں اور غوطہ دمشق کو اسی تفصیل سے بیان کرتے ہیں جیسے صعید کو؛ 702ھ میں تاج کی املاک کا شد مقرر ہونے والے سیف الدین بلبان جکندر منصوری سے ان کی دوستی ہوئی {cite:encyclopaedia-of-islam-2 vol. 8 p. 157}۔"
  es: "En Jumada II 701 (enero de 1302), al-Nuwayri viajó a Siria a petición del sultán para administrar la propiedad estatal, el diwan al-khass; Siria había estado sumida en el caos desde la gran invasión de Ghazan Khan en 699. Permaneció en Damasco dos años y cuatro meses, recorriendo el país: menciona un viaje por el Ghawr y describe la Ghuta de Damasco con el mismo detalle que dio al Alto Egipto, y entabló amistad con Sayf al-Din Balaban al-Jukandar al-Mansuri, nombrado shadd de la propiedad de la corona en 702 {cite:encyclopaedia-of-islam-2 vol. 8 p. 157}."
  fr: "En Jumada II 701 (janvier 1302), al-Nuwayri se rendit en Syrie à la demande du sultan pour gérer les biens de l'État, le diwan al-khass — la Syrie était en proie à des troubles depuis la grande invasion de Ghazan Khan en 699. Il séjourna à Damas pendant deux ans et quatre mois, parcourant le pays: il mentionne un voyage dans le Ghawr et décrit la Ghuta de Damas avec le même niveau de détail que pour la Haute-Égypte, et il se lia d'amitié avec Sayf al-Din Balaban al-Jukandar al-Mansuri, nommé shadd des biens de la couronne en 702 {cite:encyclopaedia-of-islam-2 vol. 8 p. 157}."
  tr: "El-Nuwayri, Hicri 701 yılında Cemâde el-Ahire'de Sultan'ın isteği üzerine devlet mülklerini, yani özel ofisi yönetmek üzere Levant'a gitti. Levant, Hicri 699 yılında Gazan Han'ın büyük istilasıyla karışıklık içindeydi. Şam'da iki yıl dört ay kaldı ve bu süre zarfında ülkeyi gezdi. Guta'ya yaptığı bir yolculuktan bahseder ve Şam Guta'sını Yukarı Mısır'ı anlattığı aynı özenle tasvir eder. Hicri 702 yılında Şadd mülklerini devralan Şadd Emiri Seyf el-Din Balban el-Cakandar el-Mansuri ile dost oldu. {cite:encyclopaedia-of-islam-2 vol. 8 p. 157}"
  id: "Al-Nuwayri melakukan perjalanan ke Levant pada Jumada al-Akhirah pada tahun 701 H atas permintaan Sultan untuk mengelola properti negara, yaitu kantor pribadi. Levant telah dilanda kekacauan sejak tahun 699 H dengan invasi besar Ghazan Khan. Ia tinggal di Damaskus selama dua tahun empat bulan, di mana ia berkeliling negeri. Ia menyebutkan perjalanan di Ghor dan menggambarkan Ghouta di Damaskus dengan detail yang sama seperti saat ia menggambarkan Mesir Hulu. Ia berteman dengan Emir Shadd, Saif al-Din Balban al-Jakandar al-Mansuri, yang mengambil alih properti Shadd pada tahun 702 H. {cite:encyclopaedia-of-islam-2 vol. 8 p. 157}."
