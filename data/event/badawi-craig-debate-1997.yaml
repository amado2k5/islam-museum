summary:
  ar: "مناظرة أكاديمية جمعت سنة 1997 بين العالِم السني وأستاذ الدراسات الإسلامية [[person/jamal-badawi|جمال بدوي]] وفيلسوف الدين المسيحي [[person/william-lane-craig|وليم لين كريغ]] في «مفهوم الله في الإسلام والمسيحية»، فعرض بدوي التوحيد السني الخالص ووحدة الذات والصفات، وعرض كريغ البراهين الفلسفية للثالوث والتجسد. ويوثّق الموقع الرسمي للمناظرة تسجيلها وتفريغها، وهي من أنضبط المناظرات الجامعية أسلوباً {cite:reasonablefaith-concept-of-god-debate}."
  en: "An academic debate held in 1997 between the Sunni scholar and professor of Islamic studies [[person/jamal-badawi|Jamal Badawi]] and the Christian philosopher [[person/william-lane-craig|William Lane Craig]] on 'The Concept of God in Islam and Christianity'. Badawi presented pure Sunni Tawhid and the unity of essence and attributes; Craig presented the philosophical case for the Trinity and incarnation. The ministry's official page documents the recording and transcript, and the exchange is among the most disciplined academic debates in style {cite:reasonablefaith-concept-of-god-debate}."
  fr: "Un débat universitaire tenu en 1997 entre le savant sunnite et professeur d'études islamiques [[person/jamal-badawi|Jamal Badawi]] et le philosophe chrétien [[person/william-lane-craig|William Lane Craig]] sur « Le concept de Dieu dans l'islam et le christianisme ». Badawi présenta le tawhid sunnite pur et l'unité de l'essence et des attributs ; Craig présenta l'argumentation philosophique en faveur de la Trinité et de l'incarnation. La page officielle du ministère documente l'enregistrement et la transcription, et l'échange compte parmi les débats universitaires les plus rigoureux par leur style {cite:reasonablefaith-concept-of-god-debate}."
  es: "En 1997 se celebró un debate académico entre el erudito sunita y profesor de estudios islámicos [[person/jamal-badawi|Jamal Badawi]] y el filósofo cristiano [[person/william-lane-craig|William Lane Craig]] sobre «El concepto de Dios en el islam y el cristianismo». Badawi presentó el Tawhid sunita puro y la unidad de esencia y atributos; Craig expuso el argumento filosófico a favor de la Trinidad y la encarnación. La página oficial del ministerio documenta la grabación y la transcripción, y el intercambio se encuentra entre los debates académicos más disciplinados en cuanto a estilo {cite:reasonablefaith-concept-of-god-debate}."
  ur: "ایک علمی بحث 1997 میں سنی اسکالر اور اسلامیات کے پروفیسر [[شخص/جمال بداوی|جمال بداوی]] اور عیسائی فلسفی [[person/william-lane-craig|William Lane Craig]] کے درمیان 'اسلام اور عیسائیت میں خدا کا تصور' پر منعقد ہوئی۔ بدوی نے خالص سنی توحید اور جوہر و صفات کی وحدت پیش کی۔ کریگ نے تثلیث اور اوتار کے لیے فلسفیانہ مقدمہ پیش کیا۔ وزارت کا آفیشل صفحہ ریکارڈنگ اور ٹرانسکرپٹ کو دستاویز کرتا ہے، اور یہ تبادلہ سب سے زیادہ نظم و ضبط والے تعلیمی مباحثوں میں سے ایک ہے جس انداز میں {cite:reasonablefaith-concept-of-god-debate} ہے۔"
  tr: "1997 yılında düzenlenen akademik bir tartışma, Sünni alim ve İslam araştırmaları profesörü Cemal Badavi ile Hristiyan din felsefecisi William Lane Craig'i \"İslam ve Hristiyanlıkta Tanrı Kavramı\" konusunda bir araya getirdi. Badavi, saf Sünni tek tanrıcılık doktrinini ve Tanrı'nın özünün ve niteliklerinin birliğini savunurken, Craig ise Teslis ve Enkarnasyon için felsefi argümanlar sundu. Resmi web sitesi, üslup açısından en iyi yapılandırılmış üniversite tartışmalarından biri olarak kabul edilen bu tartışmayı belgeliyor ve yazıya döküyor."
  id: "Debat akademis pada tahun 1997 mempertemukan cendekiawan Sunni dan profesor studi Islam, Jamal Badawi, dan filsuf agama Kristen, William Lane Craig, dengan topik \"Konsep Tuhan dalam Islam dan Kekristenan.\" Badawi mempresentasikan doktrin monoteisme Sunni murni dan kesatuan esensi dan atribut Tuhan, sementara Craig mempresentasikan argumen filosofis untuk Trinitas dan Inkarnasi. Situs web resmi mendokumentasikan dan mentranskripsikan debat tersebut, yang dianggap sebagai salah satu debat universitas yang paling terstruktur dari segi gaya."
