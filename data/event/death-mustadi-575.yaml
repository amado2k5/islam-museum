summary:
  ar: "توفي الإمام المستضيء بأمر الله ثاني ذي القعدة وقد كانت خلافته نحو تسع سنين وسبعة أشهر وكان عادلًا حسن السيرة كثير البذل حليمًا قليل المعاقبة فكان الناس معه في أمن عام وإحسان شامل لم يروا مثله فعاش حميدًا ومات سعيدًا، وقام ظهير الدين بن العطار في أخذ البيعة لولده الناصر لدين الله فلما تمت البيعة صار الحاكم في الدولة أستاذ الدار مجد الدين أبو الفضل بن الصاحب {cite:kamil-ibn-al-athir p. 97-98}."
  en: "Al-Mustaḍīʾ died on 2 Dhū'l-Qaʿda — nine years and seven months of a caliphate remembered for general security, generosity, and a clemency the people had never seen; «he lived praised and died happy». Ẓahīr al-Dīn Ibn al-ʿAṭṭār secured the bayʿa for his son al-Nāṣir li-Dīn Allāh — opening the longest caliphate in Abbasid history {cite:kamil-ibn-al-athir p. 97-98}."
