label: { ar: "وفاة المستضيء وخلافة الناصر لدين الله", en: "death of al-Mustaḍīʾ — the forty-seven-year caliphate of al-Nāṣir begins", es: "Muerte de al-Mustaḍīʾ: comienza el califato de al-Nāṣir, que duró cuarenta y siete años.", fr: "La mort d'al-Mustaḍīʾ marque le début du califat d'al-Nāṣir, qui durera quarante-sept ans.", ur: "المستضع کی وفات - النصر کی سینتالیس سالہ خلافت کا آغاز", tr: "El-Mustadi'nin ölümü ve yerine el-Nasır li-Din Allah'ın geçmesi", id: "Wafatnya al-Mustadi' dan suksesi al-Nasir li-Din Allah" }
date:
  start: { edtf: "1179~", hijri: "0575", calendar: julian, precision: year, status: tradition, derived: true }
summary:
  ar: "توفي الإمام المستضيء بأمر الله ثاني ذي القعدة وقد كانت خلافته نحو تسع سنين وسبعة أشهر وكان عادلًا حسن السيرة كثير البذل حليمًا قليل المعاقبة فكان الناس معه في أمن عام وإحسان شامل لم يروا مثله فعاش حميدًا ومات سعيدًا، وقام ظهير الدين بن العطار في أخذ البيعة لولده الناصر لدين الله فلما تمت البيعة صار الحاكم في الدولة أستاذ الدار مجد الدين أبو الفضل بن الصاحب {cite:kamil-ibn-al-athir p. 97-98}."
  en: "Al-Mustaḍīʾ died on 2 Dhū'l-Qaʿda — nine years and seven months of a caliphate remembered for general security, generosity, and a clemency the people had never seen; «he lived praised and died happy». Ẓahīr al-Dīn Ibn al-ʿAṭṭār secured the bayʿa for his son al-Nāṣir li-Dīn Allāh — opening the longest caliphate in Abbasid history {cite:kamil-ibn-al-athir p. 97-98}."
  es: "Al-Mustaḍīʾ murió el 2 de Dhū'l-Qaʿda — nueve años y siete meses de un califato recordado por su seguridad general, generosidad y una clemencia que el pueblo jamás había visto; «vivió alabado y murió feliz». Ẓahīr al-Dīn Ibn al-ʿAṭṭār obtuvo la bayʿa para su hijo al-Nāṣir li-Dīn Allāh — inaugurando el califato más largo en la historia abasí {cite:kamil-ibn-al-athir p. 97-98}."
  fr: "Al-Mustaḍīʾ mourut le 2 Dhū'l-Qaʿda, après neuf ans et sept mois d'un califat resté dans les mémoires pour sa sécurité générale, sa générosité et une clémence sans précédent; « il vécut loué et mourut heureux ». Ẓahīr al-Dīn Ibn al-ʿAṭṭār obtint la bayʿa pour son fils al-Nāṣir li-Dīn Allāh, inaugurant ainsi le plus long califat de l'histoire abbasside (voir: Kamil Ibn al-Athir, p. 97-98)."
  ur: "المستدع کا انتقال 2 ذی القعدہ کو ہوا - خلافت کے نو سال اور سات ماہ جو عام سلامتی، سخاوت اور ایسی نرمی کے لیے یاد رکھی جاتی ہے جو لوگوں نے کبھی نہیں دیکھی تھی۔ \"وہ تعریف کے ساتھ جیا اور خوشی سے مر گیا۔\" ظہیر الدین ابن الطار نے اپنے بیٹے النصر لِیّن اللہ کے لیے بیعت کی - عباسی تاریخ میں سب سے طویل خلافت کا آغاز کیا۔ 97-98}۔"
  tr: "İmam Müstadi bi-Amr Allah, Zilhicce ayının ikinci günü vefat etti. Halifeliği yaklaşık dokuz yıl yedi ay sürdü. Adil, iyi karakterli, cömert, sabırlı ve nadiren cezalandıran bir kişiydi. İnsanlar onun döneminde, daha önce hiç görmedikleri türden genel bir güvenlik ve kapsamlı bir iyilikseverlik içinde yaşadılar. Övgüye değer bir hayat yaşadı ve mutlu bir şekilde vefat etti. Zahir el-Din ibn el-Attar, oğlu El-Nasir li-Din Allah'a biat etti. Biat tamamlandığında, devletin yöneticisi, Majd el-Din Ebu el-Fadl ibn el-Sahib'in evinin reisi oldu. {kaynak: Kamil ibn el-Attir, s. 97-98}"
  id: "Imam Al-Mustadi’ bi-Amr Allah wafat pada tanggal 2 Dzul Qa’dah. Kekhalifahannya berlangsung sekitar sembilan tahun tujuh bulan. Beliau adil, berakhlak mulia, dermawan, sabar, dan jarang dihukum. Rakyat menikmati keamanan umum dan kebaikan yang menyeluruh di bawah kepemimpinannya, yang belum pernah mereka lihat sebelumnya. Beliau menjalani hidup yang terpuji dan wafat dengan bahagia. Zahir al-Din ibn al-Attar mengucapkan sumpah setia kepada putranya, Al-Nasir li-Din Allah. Setelah sumpah setia selesai, penguasa negara menjadi kepala keluarga, Majd al-Din Abu al-Fadl ibn al-Sahib. {cite:kamil-ibn-al-athir p. 97-98}"
