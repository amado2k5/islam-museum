label: { ar: "فتح عمورية", en: "Conquest of Amorium", es: "Conquista de Amorium", fr: "Conquête d'Amorium", ur: "اموریم کی فتح" }
summary:
  ar: "شخص المعتصم غازياً إلى بلاد الروم في سنة ثلاث وعشرين ومائتين، وقيل إن شخوصه كان في سنة أربع وعشرين أو اثنتين وعشرين، بعد قتله بابك {cite:tabari-tarikh-abu-al-fadl j.9 p.57} وعند السيوطي فتحها بالسيف وقتل منها ثلاثين ألفاً وسبى مثلهم، وكان المنجمون لما تجهز حكموا أن الطالع نحس وأنه يكسر فكان من نصره ما لم يخف فقال أبو تمام السيف أصدق أنباء من الكتب {cite:tarikh-khulafa-minhaj-1434 p. 522-523}. وعند المسعودي نفر المعتصم عليه دراعة صوف بيضاء وعمامة الغزاة لما أنشده إبراهيم بن المهدي يا غارة الله قد عاينت فانتهكي، وعكسر بغربي دجلة يوم الاثنين لليلتين خلتا من جمادى الأولى سنة ثلاث وعشرين ومائتين، وجعل مقدمته لأشناس وميمنته لإيتاخ وميسرته لجعفر بن دينار الخياط وساقته لبغا الكبير والقلب لعجيف، فدخل من درب السلامة والأفشين من درب الحدث، ولقي الملك فهزمه، وخرج إليه لاوي البطريق من عمورية فسلمها وأسر باطس وقتل ثلاثين ألفاً وأقام أربعة أيام يهدم ويحرق {cite:muruj-al-dhahab p. 449-450}"
  en: "Al-Mu'tasim set out campaigning into Byzantine lands in the year 223, though some say his departure was in 224 or 222, after he had killed Babak {cite:tabari-tarikh-abu-al-fadl j.9 p.57}. According to al-Suyuti, he took it by the sword, killed thirty thousand of its people and took as many captive. The astrologers had judged the ascendant unlucky when he was preparing and that he would be broken; yet his victory exceeded anything feared, and Abu Tammam said that the sword is truer in its reports than books {cite:tarikh-khulafa-minhaj-1434 p. 522-523}. According to al-Mas'udi, al-Mu'tasim was roused to war, donning a white woollen tunic and the raider's turban, when Ibrahim ibn al-Mahdi recited to him, 'O raid of God, you have now beheld it, so break in.' He encamped on the west bank of the Tigris on Monday, two nights into Jumada I in the year 223. He placed Ashnas in the vanguard, Itakh on the right wing, Ja'far ibn Dinar al-Khayyat on the left, Bugha al-Kabir in the rear, and Ajif at the centre. He entered by the Pass of Safety, while al-Afshin entered by the Pass of Hadath; he met the king and defeated him. Lawi the patrician came out to him from Amorium and surrendered it; he took Batis captive, killed thirty thousand, and stayed four days demolishing and burning {cite:muruj-al-dhahab p. 449-450}."
  es: "Al-Mu'tasim emprendió campaña hacia tierras bizantinas en el año 223, aunque algunos dicen que partió en 224 o 222, después de haber matado a Babak {cite:tabari-tarikh-abu-al-fadl j.9 p.57}. Según al-Suyuti, lo conquistó a espada, mató a treinta mil de sus habitantes y tomó a otros tantos cautivos. Los astrólogos habían predicho que el ascendente sería desafortunado durante su preparación y que sería derrotado; sin embargo, su victoria superó todo temor, y Abu Tammam dijo que la espada es más veraz en sus relatos que los libros {cite:tarikh-khulafa-minhaj-1434 p. 522-523}. Según al-Mas'udi, al-Mu'tasim fue incitado a la guerra, vistiendo una túnica de lana blanca y el turbante de asaltante, cuando Ibrahim ibn al-Mahdi le recitó: «¡Oh, asalto de Dios, ahora lo has visto, así que irrumpe!». Acampó en la orilla oeste del Tigris el lunes, dos noches después del comienzo de Jumada I del año 223. Colocó a Ashnas en la vanguardia, a Itakh en el flanco derecho, a Ja'far ibn Dinar al-Khayyat en el izquierdo, a Bugha al-Kabir en la retaguardia y a Ajif en el centro. Entró por el Paso de la Seguridad, mientras que al-Afshin entró por el Paso de Hadath; se encontró con el rey y lo derrotó. Lawi, el patricio, salió a su encuentro desde Amorium y se rindió; tomó a Batis cautivo, mató a treinta mil y permaneció cuatro días demoliendo y quemando {cite:muruj-al-dhahab p. 449-450}."
  fr: "Al-Mu'tasim entreprit une campagne contre les territoires byzantins en 223, bien que certains situent son départ en 224 ou 222, après avoir tué Babak (voir: Tabari Tarikh Abu al-Fadl, vol. 9, p. 57). Selon al-Suyuti, il s'empara de la ville par l'épée, massacra trente mille habitants et en fit autant de prisonniers. Les astrologues avaient prédit la malchance et l'échec de l'ascendant durant ses préparatifs; pourtant, sa victoire dépassa toutes les craintes, et Abu Tammam affirma que l'épée est plus véridique que les livres (voir: Tarikh Khulafa Minhaj, vol. 1434, p. 522-523). Selon al-Mas'udi, al-Mu'tasim, incité à la guerre, revêtit une tunique de laine blanche et le turban du pillard, lorsqu'Ibrahim ibn al-Mahdi lui récita: « Ô raid de Dieu, tu l'as maintenant contemplé, alors frappe ! » Il campa sur la rive ouest du Tigre le lundi, deux nuits après le début du mois de Jumada I de l'an 223. Il plaça Ashnas à l'avant-garde, Itakh à l'aile droite, Ja'far ibn Dinar al-Khayyat à gauche, Bugha al-Kabir à l'arrière et Ajif au centre. Il entra par le col de la Sécurité, tandis qu'al-Afshin entra par le col de Hadath; il rencontra le roi et le vainquit. Lawi le patricien vint à lui d'Amorium et lui remit la ville; il fit prisonnière Batis, tua trente mille hommes et resta quatre jours à démolir et à incendier la ville (voir Muruj-al-Dhahab, p. 1). 449-450}."
  ur: "المعتصم نے سنہ 223 میں بازنطینی سرزمینوں میں مہم شروع کی، حالانکہ بعض کہتے ہیں کہ اس کی روانگی 224 یا 222 میں ہوئی تھی، جب اس نے بابک کو قتل کر دیا تھا۔ سیوطی کے مطابق اس نے اسے تلوار سے لیا، اس کے تیس ہزار لوگوں کو قتل کیا اور اتنے ہی قیدی بنا لیے۔ نجومیوں نے چڑھنے والے کو بدقسمت قرار دیا تھا جب وہ تیاری کر رہا تھا اور وہ ٹوٹ جائے گا۔ پھر بھی اس کی فتح کسی بھی خوف سے زیادہ تھی، اور ابو تمام نے کہا کہ تلوار اپنی رپورٹوں میں کتابوں سے زیادہ سچی ہے۔ 522-523}۔ المسعودی کے مطابق، معتصم کو سفید اونی چادر اور حملہ آور کی پگڑی پہن کر جنگ کے لیے ابھارا گیا تھا، جب ابراہیم بن المہدی نے اسے پڑھا، 'اے خدا کے چھاپے، اب تم نے اسے دیکھا ہے، اس لیے اندر داخل ہو جاؤ'۔ اس نے پیر کے دن دجلہ کے مغربی کنارے پر 223 میں جمادی الثانی کی دو راتوں میں پڑاؤ ڈالا۔ اس نے اشناس کو صف اول میں، اتخ کو دائیں بازو پر، جعفر ابن دینار الخیاط کو بائیں طرف، بغض الکبیر کو عقب میں اور عجف کو بیچ میں رکھا۔ وہ حفاظت کے درے سے داخل ہوا، جبکہ افشین درہ حدث سے داخل ہوا۔ وہ بادشاہ سے ملا اور اسے شکست دی۔ لاوی سرپرست اموریم سے اس کے پاس آیا اور اسے ہتھیار ڈال دیا۔ اس نے بتیس کو اسیر کر لیا، تیس ہزار قتل کیے، اور چار دن تک مسمار اور جلاتے رہے۔ 449-450}۔"
