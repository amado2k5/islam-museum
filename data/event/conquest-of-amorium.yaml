label: { ar: "فتح عمورية" }
summary:
  ar: "شخص المعتصم غازياً إلى بلاد الروم في سنة ثلاث وعشرين ومائتين، وقيل إن شخوصه كان في سنة أربع وعشرين أو اثنتين وعشرين، بعد قتله بابك {cite:tabari-tarikh-abu-al-fadl j.9 p.57} وعند السيوطي فتحها بالسيف وقتل منها ثلاثين ألفاً وسبى مثلهم، وكان المنجمون لما تجهز حكموا أن الطالع نحس وأنه يكسر فكان من نصره ما لم يخف فقال أبو تمام السيف أصدق أنباء من الكتب {cite:tarikh-khulafa-minhaj-1434 p. 522-523}."
