id: event/conquest-of-amorium
class: event
kind: conquest
label: { ar: "فتح عمورية" }
summary:
  ar: "شخص المعتصم غازياً إلى بلاد الروم في سنة ثلاث وعشرين ومائتين، وقيل إن شخوصه كان في سنة أربع وعشرين أو اثنتين وعشرين، بعد قتله بابك {cite:tabari-tarikh-abu-al-fadl j.9 p.57} وعند السيوطي فتحها بالسيف وقتل منها ثلاثين ألفاً وسبى مثلهم، وكان المنجمون لما تجهز حكموا أن الطالع نحس وأنه يكسر فكان من نصره ما لم يخف فقال أبو تمام السيف أصدق أنباء من الكتب {cite:tarikh-khulafa-minhaj-1434 p. 522-523}. وعند المسعودي نفر المعتصم عليه دراعة صوف بيضاء وعمامة الغزاة لما أنشده إبراهيم بن المهدي يا غارة الله قد عاينت فانتهكي، وعكسر بغربي دجلة يوم الاثنين لليلتين خلتا من جمادى الأولى سنة ثلاث وعشرين ومائتين، وجعل مقدمته لأشناس وميمنته لإيتاخ وميسرته لجعفر بن دينار الخياط وساقته لبغا الكبير والقلب لعجيف، فدخل من درب السلامة والأفشين من درب الحدث، ولقي الملك فهزمه، وخرج إليه لاوي البطريق من عمورية فسلمها وأسر باطس وقتل ثلاثين ألفاً وأقام أربعة أيام يهدم ويحرق {cite:muruj-al-dhahab p. 449-450}"
