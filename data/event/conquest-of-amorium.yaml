label: { ar: "فتح عمورية", en: "Conquest of Amorium" }
summary:
  ar: "شخص المعتصم غازياً إلى بلاد الروم في سنة ثلاث وعشرين ومائتين، وقيل إن شخوصه كان في سنة أربع وعشرين أو اثنتين وعشرين، بعد قتله بابك {cite:tabari-tarikh-abu-al-fadl j.9 p.57} وعند السيوطي فتحها بالسيف وقتل منها ثلاثين ألفاً وسبى مثلهم، وكان المنجمون لما تجهز حكموا أن الطالع نحس وأنه يكسر فكان من نصره ما لم يخف فقال أبو تمام السيف أصدق أنباء من الكتب {cite:tarikh-khulafa-minhaj-1434 p. 522-523}. وعند المسعودي نفر المعتصم عليه دراعة صوف بيضاء وعمامة الغزاة لما أنشده إبراهيم بن المهدي يا غارة الله قد عاينت فانتهكي، وعكسر بغربي دجلة يوم الاثنين لليلتين خلتا من جمادى الأولى سنة ثلاث وعشرين ومائتين، وجعل مقدمته لأشناس وميمنته لإيتاخ وميسرته لجعفر بن دينار الخياط وساقته لبغا الكبير والقلب لعجيف، فدخل من درب السلامة والأفشين من درب الحدث، ولقي الملك فهزمه، وخرج إليه لاوي البطريق من عمورية فسلمها وأسر باطس وقتل ثلاثين ألفاً وأقام أربعة أيام يهدم ويحرق {cite:muruj-al-dhahab p. 449-450}"
  en: "Al-Mu'tasim set out campaigning into Byzantine lands in the year 223, though some say his departure was in 224 or 222, after he had killed Babak {cite:tabari-tarikh-abu-al-fadl j.9 p.57}. According to al-Suyuti, he took it by the sword, killed thirty thousand of its people and took as many captive. The astrologers had judged the ascendant unlucky when he was preparing and that he would be broken; yet his victory exceeded anything feared, and Abu Tammam said that the sword is truer in its reports than books {cite:tarikh-khulafa-minhaj-1434 p. 522-523}. According to al-Mas'udi, al-Mu'tasim was roused to war, donning a white woollen tunic and the raider's turban, when Ibrahim ibn al-Mahdi recited to him, 'O raid of God, you have now beheld it, so break in.' He encamped on the west bank of the Tigris on Monday, two nights into Jumada I in the year 223. He placed Ashnas in the vanguard, Itakh on the right wing, Ja'far ibn Dinar al-Khayyat on the left, Bugha al-Kabir in the rear, and Ajif at the centre. He entered by the Pass of Safety, while al-Afshin entered by the Pass of Hadath; he met the king and defeated him. Lawi the patrician came out to him from Amorium and surrendered it; he took Batis captive, killed thirty thousand, and stayed four days demolishing and burning {cite:muruj-al-dhahab p. 449-450}."
