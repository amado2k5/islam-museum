id: event/banu-al-harith-besiege-muhammad-ibn-ubaydallah-at-al-hajar-288
class: event
kind: other
label:
  ar: "بنو الحارث يحاصرون محمد بن عبيد الله بالهجر، رمضان 288هـ"
  en: "Banu al-Harith besiege Muhammad ibn Ubaydallah at al-Hajar, Ramadan 288 AH"
  ur: "بنو حارث ہجر میں محمد بن عبید اللہ کا محاصرہ کرتے ہیں، رمضان 288ھ"
summary:
  ar: "عسكر بنو الحارث على باب قرية الهجر في نحو ألف وخمسمائة راجل ومائة وثلاثين فارساً، وخرج إليهم محمد بن عبيد الله في خمسة عشر فارساً وخمسين راجلاً ومعه بنو عبد المدان، فحاصروه ثلاثة أيام في رمضان سنة 288هـ، وأمر ابن حميد وابن بسطام أصحابهما بالإفطار، ثم أتاه بنو عبد المدان بوجوه من أهل نجران وسألوه الخروج من قريتهم."
  en: "Banu al-Harith camped at the gate of the village of al-Hajar with about fifteen hundred foot and a hundred and thirty horse, and Muhammad ibn Ubaydallah went out to them with fifteen horse and fifty foot, with Banu Abd al-Madan beside him; they besieged him three days in Ramadan of 288 AH, Ibn Humayd and Ibn Bustam told those with them to break the fast, and Banu Abd al-Madan then came to him with leading men of Najran and asked him to leave their village."
  ur: "بنو حارث نے ہجر کی بستی کے دروازے پر قریباً پندرہ سو پیادوں اور ایک سو تیس سواروں کے ساتھ پڑاؤ ڈالا، اور محمد بن عبید اللہ پندرہ سواروں اور پچاس پیادوں کے ساتھ ان کی طرف نکلے، ان کے ساتھ بنو عبد المدان تھے؛ انہوں نے رمضان 288ھ میں تین دن ان کا محاصرہ کیا، ابن حمید اور ابن بسطام نے اپنے ساتھیوں کو روزہ توڑنے کا حکم دیا، پھر بنو عبد المدان نجران کے کچھ معززین کو لے کر ان کے پاس آئے اور ان سے اپنی بستی سے نکل جانے کی درخواست کی۔"
