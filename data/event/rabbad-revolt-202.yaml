label: { ar: "فتنة الربض بقرطبة", en: "The Rabad fitna in Cordoba", es: "La fitna de Rabad en Córdoba", fr: "La fitna du Rabad à Cordoue", ur: "قرطبہ میں رباد فتنہ", tr: "Kurtuba Ribat'ı", id: "Ribat Cordoba" }
summary:
  ar: "الواقعة الشهيرة بين الأمير الحكم بن هشام وأهل الربض من قرطبة؛ كان في صدر ولايته قد أنهمك في لذاته فاجتمع أهل العلم والورع بقرطبة مثل يحيى بن يحيى الليثي صاحب مالك وأحد رواة الموطأ عنه وطالوت الفقيه وغيرهما فثاروا به وخلعوه وبايعوا بعض قرابته، وكانوا بالربض الغربي من قرطبة وهي محلة متصلة بقصره، فقاتلهم الحكم فغلبهم وافترقوا وهدم دورهم ومساجدهم، ولحقوا بفاس من أرض العدوة وبالإسكندرية من أرض المشرق ونزل بها جمع منهم ثم ثاروا بها فزحف إليهم عبد الله بن طاهر صاحب مصر للمأمون وغلبهم وأجازهم إلى جزيرة إقريطش فلم يزالوا بها إلى أن ملكها الإفرنج من أيديهم بعد مدة {cite:nafh-tib-maqqari p. 375}."
  en: "The famous revolt of the Rabbaḍ of Cordoba under al-Hakam ibn Hisham: the scholars of learning and piety — Yahya ibn Yahya al-Laythi, Malik's companion and Muwatta transmitter, the faqih Talut and others — rose against him, deposed him and gave bay'a to a kinsman; al-Hakam crushed them, demolished their houses and mosques, and the exiles went to Fez and Alexandria — where they revolted again until Abdallah ibn Tahir expelled them to Crete, which they held until the Franks took it {cite:nafh-tib-maqqari p. 375}."
  es: "La famosa revuelta del Rabbaḍ de Córdoba bajo al-Hakam ibn Hisham: los eruditos y piadosos — Yahya ibn Yahya al-Laythi, compañero de Malik y transmisor del Muwatta, el faqih Talut y otros — se alzaron contra él, lo depusieron y prestaron juramento de lealtad a un pariente; al-Hakam los aplastó, demolió sus casas y mezquitas, y los exiliados fueron a Fez y Alejandría — donde se rebelaron de nuevo hasta que Abdallah ibn Tahir los expulsó a Creta, que mantuvieron hasta que los francos la tomaron {cite:nafh-tib-maqqari p. 375}."
  fr: "La célèbre révolte du Rabbaḍ de Cordoue sous al-Hakam ibn Hisham: les savants et les érudits – Yahya ibn Yahya al-Laythi, compagnon de Malik et transmetteur de Muwatta, le faqih Talut et d'autres – se soulevèrent contre lui, le déposèrent et prêtèrent allégeance à un parent; al-Hakam les écrasa, démolit leurs maisons et leurs mosquées, et les exilés se rendirent à Fès et à Alexandrie – où ils se révoltèrent à nouveau jusqu'à ce qu'Abdallah ibn Tahir les expulse en Crète, qu'ils occupèrent jusqu'à ce que les Francs la prennent {cite:nafh-tib-maqqari p. 375}."
  ur: "الحکم ابن ہشام کے ماتحت قرطبہ کے ربّاد کی مشہور بغاوت: علم و تقویٰ کے علما - یحییٰ بن یحییٰ لیثی، مالک کے ساتھی اور موطا کی ترسیل کرنے والے، فقیہ طالوت اور دیگر - اس کے خلاف اٹھے، اس کو معزول کیا اور ایک کو بیعت دی؛ الحکم نے انہیں کچل دیا، ان کے گھروں اور مساجد کو مسمار کر دیا، اور جلاوطن فیز اور اسکندریہ چلے گئے - جہاں انہوں نے دوبارہ بغاوت کی یہاں تک کہ عبداللہ ابن طاہر نے انہیں کریٹ میں نکال دیا، جسے انہوں نے اس وقت تک برقرار رکھا جب تک کہ فرینکوں نے اسے حاصل نہ کر لیا۔ 375}۔"
  tr: "Prens El-Hakam bin Hişam ile Kurtuba banliyösü halkı arasında yaşanan ünlü olay; Hükümranlığının başında zevklerine dalmışken, Kurtuba'daki ilim ve takva sahibi insanlar, Malik'in arkadaşı ve ondan rivayet edilen Muvatta'nın ravîlerinden Yahya bin Yahya el-Layti, hukukçu Talut ve diğerleri, ona karşı ayaklanıp onu tahttan indirdiler ve akrabalarından bazılarına biat ettiler. Kurtuba'nın batı banliyösünde, sarayına yakın bir mahallede bulunuyorlardı. Bunun üzerine El-Hakam onlarla savaştı ve onları yendi, dağıldılar ve evlerini ve camilerini yıktırdı. Kuzeydeki Fez'e ve doğudaki İskenderiye'ye gittiler ve bir kısmı orada yerleşip orada da ayaklandı. Bunun üzerine El-Ma'mun adına Mısır'ı yöneten Abdullah bin Tahir onlara karşı yürüdü, onları yendi ve Girit adasına geçmeye zorladı. Bir süre sonra Franklar adayı ellerinden alana kadar orada kaldılar. {alıntı:nafh-tib-maqqari s. 375}."
  id: "Insiden terkenal antara Pangeran Al-Hakam bin Hisham dan penduduk pinggiran kota Cordoba; Pada awal pemerintahannya, ia tenggelam dalam kesenangan duniawinya, sehingga orang-orang yang berilmu dan saleh di Cordoba berkumpul, seperti Yahya bin Yahya Al-Laythi, sahabat Malik dan salah satu perawi Al-Muwatta’ darinya, dan Talut sang ahli hukum dan lainnya, lalu mereka memberontak melawannya dan menggulingkannya serta berbaiat kepada beberapa kerabatnya. Mereka berada di pinggiran barat Cordoba, yang merupakan lingkungan yang terhubung dengan istananya. Maka Al-Hakam memerangi mereka dan mengalahkan mereka, lalu mereka tercerai-berai dan ia menghancurkan rumah-rumah dan masjid-masjid mereka, dan mereka pergi ke Fez di tanah Utara dan ke Alexandria di tanah Timur, dan sekelompok dari mereka menetap di sana dan kemudian memberontak di sana. Maka Abdullah bin Tahir, penguasa Mesir untuk Al-Ma’mun, menyerang mereka dan mengalahkan mereka serta memaksa mereka pindah ke pulau Kreta, dan mereka tinggal di sana sampai bangsa Frank merebutnya dari tangan mereka setelah beberapa waktu. {mengutip:nafh-tib-maqqari hal. 375}."
