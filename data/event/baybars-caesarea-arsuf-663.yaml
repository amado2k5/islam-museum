label: { ar: "فتح بيبرس قيسارية وأرسوف سنة 663هـ", en: "Baybars takes Caesarea and Arsuf, 663", fr: "Baybars prend Césarée et Arsuf, 663", es: "Baybars toma Cesarea y Arsuf, 663", ur: "Baybars Caesarea اور Arsuf، 663 لیتا ہے۔", tr: "Baybars, Hicri 663 yılında Caesarea ve Arsuf'u fethetti.", id: "Baybars menaklukkan Caesarea dan Arsuf pada tahun 663 Hijriah." }
summary:
  ar: "قدم السلطان بيبرس سنة ثلاث وستين فحاصر قيسارية وافتتحها عنوة وعصت القلعة أياماً ثم أخذت، ثم نازل أرسوف وأخذها بالسيف في رجب، ثم رجع فسلطن ابنه الملك السعيد في شوال وأركبه بأبهة الملك وله خمس سنين {cite:shadharat-dhahab p. 541}."
  en: "In 663 Baybars besieged Caesarea and stormed it — the citadel held out days, then fell — then invested Arsuf and took it by the sword in Rajab; that Shawwal he enthroned his five-year-old son al-Malik al-Sa'id in full royal pomp {cite:shadharat-dhahab p. 541}."
  fr: "En 663, Baybars assiégea Césarée et la prit d'assaut, la citadelle tenant des jours avant de tomber, puis investit Arsuf et la prit par l'épée en Rajab ; ce Shawwal-là, il intronisa son fils de cinq ans, al-Malik al-Sa'id, en grande pompe royale {cite:shadharat-dhahab p. 541}."
  es: "En 663, Baybars sitió Cesarea y la asaltó; la ciudadela resistió días, luego cayó; después, en Rajab, sitió Arsuf y la tomó por la espada; en Shawwal, entronizó a su hijo de cinco años, al-Malik al-Sa'id, con toda la pompa real {cita: shadharat-dhahab p. 541}."
  ur: "663 میں Baybars نے قیصریہ کا محاصرہ کیا اور اس پر دھاوا بول دیا - یہ قلعہ کئی دنوں تک قائم رہا، پھر گر گیا - پھر ارسف پر سرمایہ کاری کی اور رجب میں اسے تلوار سے چھین لیا۔ کہ شوال میں اس نے اپنے پانچ سالہ بیٹے الملک السعید کو پورے شاہانہ انداز میں تخت نشین کیا۔ 541}۔"
  tr: "Sultan Baybars, 63. yılda Caesarea'yı kuşattı ve zorla ele geçirdi. Kale günlerce isyan etti ve sonra ele geçirildi. Ardından Receb ayında Arsuf'u kuşattı ve kılıçla ele geçirdi. Sonra geri döndü ve Şevval ayında oğlu Kral Al-Saeed'i sultan yaptı ve beş yaşındayken ona krallığın ihtişamını yaşattı. {cite:shadharat-dhahab s. 541}"
  id: "Sultan Baybars datang pada tahun enam puluh tiga dan mengepung Caesarea serta menaklukkannya dengan kekerasan. Benteng itu memberontak selama beberapa hari dan kemudian direbut. Kemudian ia mengepung Arsuf dan merebutnya dengan pedang pada bulan Rajab. Kemudian ia kembali dan menjadikan putranya, Raja Al-Saeed, sebagai Sultan pada bulan Syawal dan memberinya kemegahan kekuasaan raja ketika ia berusia lima tahun. {cite:shadharat-dhahab p. 541}"
