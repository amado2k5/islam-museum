summary:
  ar: "بطاقة أولية لمعركة مرو سنة ١٥١٠م، نصر إسماعيل الصفوي وقتل الشيباني الذي أنهى السلطة الأوزبكية في خراسان؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Merv in 1510, Ismail I's victory and Muhammad Shaybani's death ending Uzbek power in Khurasan; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Batalla de Merv en 1510, la victoria de Ismail I y la muerte de Muhammad Shaybani que puso fin al poder uzbeko en Jorasán; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour la bataille de Merv en 1510, la victoire d'Ismaïl Ier et la mort de Muhammad Shaybani mettant fin à la puissance ouzbèke au Khorasan; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1510 میں مرو کی جنگ کے لیے ڈرافٹ کارڈ، اسماعیل اول کی فتح اور محمد شیبانی کی موت خراسان میں ازبک اقتدار کا خاتمہ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1510 yılında gerçekleşen Merv Muharebesi'nin ön anlatımı; İsmail Safavi'nin zaferi ve Horasan'daki Özbek yönetiminin sonunu getiren Şeybani'nin öldürülmesi; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Merv pada tahun 1510 M, kemenangan Ismail Safavi dan pembunuhan Shaybani, yang mengakhiri kekuasaan Uzbek di Khorasan; sumber-sumbernya belum ditinjau di halaman ini."
