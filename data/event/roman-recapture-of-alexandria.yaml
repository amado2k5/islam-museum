label: { ar: "نقض الإسكندرية واستردادها من منويل", en: "The Roman Recapture of Alexandria and Its Recovery from Manuel", es: "La reconquista romana de Alejandría y su recuperación de Manuel", fr: "La reconquête romaine d'Alexandrie et sa reprise à Manuel", ur: "اسکندریہ پر رومن دوبارہ قبضہ اور مینوئل سے اس کی بازیابی۔", tr: "İskenderiye'nin Manuel'den fethi ve geri alınması", id: "Penaklukan dan perebutan kembali Alexandria dari Manuel" }
summary:
  ar: "عند البلاذري: كتب الروم إلى قسطنطين بن هرقل — وهو كان الملك يومئذ — يخبرونه بقلة من عندهم من المسلمين وبما هم فيه من الذلة وأداء الجزية فبعث رجلاً من أصحابه يقال له منويل في ثلاثمائة مركب مشحونة بالمقاتلة فدخل الإسكندرية وقتل من بها من روابط المسلمين إلا من لطف للهرب فنجا وذلك في سنة خمس وعشرين، فبلغ عمرو بن العاص الخبر فسار إليهم في خمسة عشر ألفاً فوجد مقاتلتهم قد خرجوا يعيثون فيما يلي الإسكندرية من قرى مصر فلقيهم المسلمون فرشقوهم بالنشّاب ساعة والمسلمون متترّسون ثم صدقوهم الحملة فالتحمت بينهم الحرب فاقتتلوا قتالاً شديداً ثم إن أولئك الكفرة ولّوا منهزمين فلم يكن لهم ناهياً ولا عرجة دون الإسكندرية فتحصّنوا بها ونصبوا العرّادات فقاتلهم عمرو عليها أشد قتال ونصب المجانيق فأخذت جدرها وألحّ بالحرب حتى دخلها بالسيف عنوة فقتل المقاتلة وسبى الذرية وهرب بعض رومها إلى الروم وقُتل منويل، وهدم عمرو والمسلمون جدار الإسكندرية وكان عمرو نذر لئن فتحها ليفعلنّ ذلك؛ وقال بعض الرواة إن هذه الغزاة كانت في سنة ثلاث وعشرين وروى بعضهم أنهم نقضوا في سنة ثلاث وعشرين وسنة خمس وعشرين والله أعلم. ووضع عمرو على أرض الإسكندرية الخراج وعلى أهلها الجزية؛ وروي أن الموقس اعتزل أهل الإسكندرية حين نقضوا فأقرّه عمرو ومن معه على أمرهم الأول وروي أنه قد كان مات قبل هذه الغزاة. وكان عمر بن عبد العزيز يقول: لم نفتح قرية من المغرب على صلح إلا ثلاثاً: الإسكندرية وكفرتيس وسلطيس فكان يقول من أسلم من أهل هذه المواضع خلّى سبيله وسبيل ماله؛ وكانت جزية الإسكندرية ثمانية عشر ألف دينار فلما كانت ولاية هشام بن عبد الملك بلغت ستة وثلاثين ألف دينار."
  en: "In al-Baladhuri: the Romans wrote to Constantine son of Heraclius — then king — telling how few the Muslims among them were and of their humiliation in paying jizya, whereupon he sent one of his men called Manuel with three hundred ships laden with fighters; he entered Alexandria and slew the Muslim ribat there save those God shielded in flight — in year 25. Amr ibn al-As heard and marched on them with fifteen thousand, finding their fighters out ravaging the villages below Alexandria; the Muslims met them, loosed arrows an hour behind their shields, then charged home, battle joining bitterly, till the unbelievers broke and fled — no halting nor turning short of Alexandria — where they fortified and set up the arrada-engines; Amr fought them hardest, planted mangonels that took the walls, pressed the war till he entered by the sword by force, slew the fighters, captured the offspring — some Romans fleeing to Rome — and Manuel was killed; Amr and the Muslims demolished Alexandria's wall, which Amr had vowed to do should he take it. Some narrators put this raid in year 23, others the breach in 23 or 25 — God knows best. Amr laid kharaj on Alexandria's land and jizya on its people; it is also told that the Muqawqis had withdrawn from Alexandria's folk when they broke, so Amr confirmed him and those with him on their first terms — and also that he had died before this raid. Umar ibn Abd al-Aziz used to say: we opened no village of the Maghreb on treaty save three — Alexandria, Kafr Tis and Sultays — saying whoever of these places' people embraced Islam, his person and property were left free; and Alexandria's jizya was eighteen thousand dinars until in Hisham ibn Abd al-Malik's governorship it reached thirty-six thousand dinars."
  es: "En al-Baladhuri: los romanos escribieron a Constantino hijo de Heraclio —entonces rey— contándole lo pocos musulmanes que eran entre ellos y la humillación que sufrían al pagar la jizya, por lo que envió a uno de sus hombres llamado Manuel con trescientos barcos cargados de guerreros; entró en Alejandría y mató a los musulmanes ribat allí, excepto a aquellos a quienes Dios protegió en la huida —en el año 25. Amr ibn al-As se enteró y marchó contra ellos con quince mil, encontrando a sus guerreros asolando las aldeas debajo de Alejandría; los musulmanes los recibieron, lanzaron flechas una hora detrás de sus escudos, luego cargaron hacia casa, la batalla se entabló encarnizada, hasta que los infieles se rompieron y huyeron —sin detenerse ni retroceder hasta Alejandría— donde fortificaron y colocaron máquinas de arrada; Amr luchó contra ellos con fiereza, plantó mangoneles que tomaron las murallas, presionó la guerra hasta que entró por la fuerza con la espada, mató a los guerreros, capturó a los descendientes —algunos romanos huyeron a Roma— y Manuel fue asesinado; Amr y los musulmanes demolieron la muralla de Alejandría, algo que Amr había prometido hacer si la conquistaba. Algunos narradores sitúan esta incursión en el año 23, otros la brecha en el 23 o el 25; solo Dios lo sabe. Amr impuso el kharaj (impuesto sobre la tierra) a Alejandría y la jizya (impuesto sobre la vida y la muerte) a sus habitantes; también se cuenta que los Muqawqis se habían retirado de Alejandría cuando se separaron, por lo que Amr los confirmó a él y a sus aliados en sus condiciones iniciales, y también que había muerto antes de esta incursión. Umar ibn Abd al-Aziz solía decir: «No abrimos ningún pueblo del Magreb mediante tratado salvo tres: Alejandría, Kafr Tis y Sultays, diciendo que cualquiera de los habitantes de estos lugares que abrazara el Islam, su persona y sus bienes quedarían libres»; y la jizya de Alejandría era de dieciocho mil dinares hasta que, durante el gobierno de Hisham ibn Abd al-Malik, alcanzó los treinta y seis mil dinares."
  fr: "Dans al-Baladhuri: les Romains écrivirent à Constantin, fils d'Héraclius — alors roi — pour lui faire part du petit nombre de musulmans parmi eux et de l'humiliation qu'ils subissaient en payant la jizya. Constantin envoya alors l'un de ses hommes, nommé Manuel, avec trois cents navires chargés de combattants. Ce dernier entra dans Alexandrie et massacra les ribat musulmans qui s'y trouvaient, à l'exception de ceux que Dieu protégea lors de leur fuite — en l'an 25. Amr ibn al-As, ayant entendu parler de lui, marcha sur eux avec quinze mille hommes et découvrit leurs combattants en train de ravager les villages situés en contrebas d'Alexandrie. Les musulmans les rencontrèrent, décochèrent des flèches une heure derrière leurs boucliers, puis chargèrent leurs terres. Le combat s'engagea avec acharnement, jusqu'à ce que les infidèles cèdent et s'enfuient — sans s'arrêter ni faire demi-tour avant Alexandrie — où ils se fortifièrent et installèrent les arradas. Amr les combattit avec acharnement, installa des mangonneaux qui percèrent les murailles, poursuivit la guerre jusqu'à entrer par la force, massacra les combattants, captura leurs enfants – dont certains Romains fuyaient vers Rome – et Manuel fut tué. Amr et les musulmans détruisirent les murailles d'Alexandrie, ce qu'Amr avait juré de faire s'il s'en emparait. Certains narrateurs situent ce raid en l'an 23, d'autres la brèche en 23 ou 25 – Dieu seul le sait. Amr imposa le kharaj sur les terres d'Alexandrie et la jizya sur ses habitants. On raconte également que les Muqawqis s'étaient retirés des Alexandrins lors de la brèche, et qu'Amr confirma donc ses droits et ceux de ses compagnons selon leurs conditions initiales – et qu'il était mort avant ce raid. Umar ibn Abd al-Aziz disait: « Nous n'avons ouvert aucun traité au Maghreb, sauf à trois endroits – Alexandrie, Kafr Tis et Sultays – en précisant que quiconque, parmi les habitants de ces lieux, se convertissait à l'islam, était libre de toute charge et de ses biens. » et la jizya d'Alexandrie était de dix-huit mille dinars jusqu'à ce que, sous le gouvernorat d'Hisham ibn Abd al-Malik, elle atteigne trente-six mille dinars."
  ur: "البلادھوری میں ہے: رومیوں نے ہرقل کے بیٹے قسطنطین کو خط لکھا جو کہ اس وقت کے بادشاہ تھے کہ ان میں مسلمان کتنے کم تھے اور جزیہ دینے میں ان کی ذلت تھی، اس کے بعد اس نے اپنے ایک آدمی مینوئل کو جنگجوؤں سے لدے تین سو بحری جہازوں کے ساتھ بھیجا۔ وہ اسکندریہ میں داخل ہوا اور وہاں مسلمانوں کے رباط کو قتل کر دیا، سوائے ان کے جو خدا نے اڑان میں ڈھال رکھے تھے - سال 25 میں۔ عمرو بن العاص نے یہ سنا اور پندرہ ہزار کے ساتھ ان پر چڑھائی کی، اپنے جنگجوؤں کو اسکندریہ کے نیچے کے دیہاتوں کو تباہ کرنے کے لیے تلاش کیا۔ مسلمانوں نے ان سے ملاقات کی، اپنی ڈھالوں کے پیچھے ایک گھنٹہ پیچھے تیر چھوڑے، پھر گھر واپس چلے گئے، لڑائی میں تلخی سے حصہ لیا، یہاں تک کہ کافر ٹوٹ کر بھاگ گئے - اسکندریہ سے کوئی رکنا یا کم نہیں ہوا - جہاں انہوں نے قلعہ بندی کی اور آراڈا انجن لگائے۔ عمرو نے ان سے سخت ترین مقابلہ کیا، دیواروں کو لے جانے والے مینگونیل لگائے، جنگ کو دبایا یہاں تک کہ وہ طاقت کے زور پر تلوار کے ذریعے داخل ہوا، جنگجوؤں کو مار ڈالا، اولاد کو پکڑ لیا - کچھ رومی روم کی طرف بھاگ رہے تھے - اور مینوئل مارا گیا۔ عمرو اور مسلمانوں نے اسکندریہ کی دیوار کو گرا دیا، جس پر عمرو نے عہد کیا تھا کہ اگر وہ اسے لے لے۔ کچھ راویوں نے اس چھاپے کو 23 سال میں ڈالا، دوسروں نے 23 یا 25 میں خلاف ورزی کی - خدا ہی بہتر جانتا ہے۔ عمرو نے اسکندریہ کی سرزمین پر خاراج اور اس کے لوگوں پر جزیہ لگایا۔ یہ بھی کہا جاتا ہے کہ مقوقس نے اسکندریہ کے لوگوں سے دستبرداری اختیار کی تھی جب وہ ٹوٹ گئے تھے، تو عمرو نے اس کی اور اس کے ساتھ والوں کو ان کی پہلی شرطوں پر تصدیق کی - اور یہ بھی کہ وہ اس چھاپے سے پہلے ہی مر گیا تھا۔ عمر بن عبد العزیز کہا کرتے تھے: ہم نے معاہدۂ مغرب پر کوئی گاؤں نہیں کھولا سوائے اسکندریہ، کفر طیس اور سلطیس کے۔ یہ کہتے تھے کہ ان جگہوں کے لوگوں میں سے جس نے بھی اسلام قبول کیا، اس کا جان و مال آزاد کر دیا گیا۔ اور اسکندریہ کا جزیہ اٹھارہ ہزار دینار تھا یہاں تک کہ ہشام بن عبد الملک کی گورنری میں یہ چھتیس ہزار دینار تک پہنچ گیا۔"
  tr: "El-Baladhuri'ye göre: Romalılar, o zamanlar imparator olan Heraklius'un oğlu Konstantin'e, topraklarındaki Müslümanların sayısının azlığını, aşağılanma durumlarını ve zorla ödenen haraçları bildiren bir mektup yazdılar. Bunun üzerine Konstantin, Manuel adında bir adamını, savaşçılarla dolu üç yüz gemiyle gönderdi. Manuel, İskenderiye'ye girdi ve kaçmayı başaranlar hariç, oradaki tüm Müslüman savunmacıları öldürdü. Bu olay Hicri 25 yılında gerçekleşti. Bu haber Amr ibn al-As'a ulaştığında, on beş bin adamla onlara karşı yürüdü. Savaşçılarının dışarı çıktığını ve İskenderiye'yi çevreleyen Mısır köylerinde büyük tahribat yarattığını gördü. Müslümanlar onlarla karşılaştı ve bir süre ok yağmuruna tuttular, bu sırada Müslümanlar siperlere yerleştiler. Ardından şiddetli bir saldırı başlattılar ve bir savaş başladı. Kâfirler yenilgiyle geri döndüler ve İskenderiye'nin önünde sığınacak veya kaçacak yer bulamayınca kaçtılar. Şehrin içinde kendilerini tahkim ettiler ve kuşatma makineleri kurdular. Amr, surları yıkan mancınıklar kullanarak onlarla şiddetli bir şekilde savaştı. Savaşa devam ederek şehre zorla girdi, savaşçıları öldürdü, kadınları ve çocukları esir aldı ve Romalılardan bazıları Bizans İmparatorluğu'na kaçtı. Manuel öldürüldü ve Amr şehri yerle bir etti. Müslümanlar İskenderiye surlarını kuşattılar ve Amr, şehri fethettiği takdirde bunu yapacağına yemin etmişti. Bazı rivayetçiler bu seferin Hicri 23 yılında gerçekleştiğini söylerken, diğerleri Hicri 23 ve 25 yıllarında gerçekleştiğini söylemektedir; en doğrusunu Allah bilir. Amr, İskenderiye'ye toprak vergisi ve halkına kafa vergisi koydu. Rivayetlere göre, el-Muqas antlaşmayı bozduklarında İskenderiye'den çekildi, bu yüzden Amr ve adamları onun önceki konumunda kalmasına izin verdiler. Ayrıca bu seferden önce öldüğü de rivayet edilmektedir. Ömer ibn Abdülaziz şöyle derdi: \"Mağrip'te barış antlaşmalarıyla fethettiğimiz tek yer İskenderiye, Kafr Tis ve Sultis'ti.\" Bu yerlerin halkından kim İslam'ı kabul ederse, onu ve malını serbest bırakacağını söylerdi. İskenderiye'nin vergi oranı on sekiz bin dinardı ve Hişam ibn Abdülmalik halife olunca otuz altı bin dinara yükseldi."
  id: "Menurut al-Baladhuri: Bangsa Romawi menulis surat kepada Konstantinus, putra Heraclius—yang saat itu adalah kaisar—memberitahukannya tentang sedikitnya jumlah Muslim di wilayah mereka dan keadaan mereka yang terhina serta dipaksa membayar upeti. Ia mengirim salah seorang anak buahnya, bernama Manuel, dengan tiga ratus kapal yang sarat dengan prajurit. Manuel memasuki Alexandria dan membunuh semua pembela Muslim di sana, kecuali mereka yang berhasil melarikan diri. Ini terjadi pada tahun 25 Hijriah. Ketika berita ini sampai kepada Amr ibn al-As, ia menyerang mereka dengan lima belas ribu orang. Ia mendapati para prajurit mereka telah keluar dan menimbulkan kekacauan di desa-desa Mesir di sekitar Alexandria. Kaum Muslim menemui mereka dan menghujani mereka dengan panah untuk sementara waktu, sementara kaum Muslim bertahan di dalam benteng. Kemudian mereka melancarkan serangan sengit, dan pertempuran pun terjadi. Orang-orang kafir berbalik dan melarikan diri dalam kekalahan, tidak menemukan tempat berlindung atau jalan keluar sebelum Alexandria. Mereka membentengi diri di dalam kota dan memasang mesin pengepungan. Amr melawan mereka dengan sengit, mengerahkan ketapel yang menembus tembok-temboknya. Ia terus melanjutkan pertempuran hingga memasuki kota dengan paksa, membunuh para prajurit, menawan wanita dan anak-anak, dan beberapa orang Romawi melarikan diri ke Kekaisaran Bizantium. Manuel terbunuh, dan Amr menghancurkan kota itu. Kaum Muslim mengepung tembok Alexandria, dan Amr telah bersumpah bahwa jika ia menaklukkannya, ia akan melakukannya. Beberapa perawi mengatakan bahwa kampanye ini terjadi pada tahun 23 H, sementara yang lain mengatakan bahwa itu terjadi pada tahun 23 H dan tahun 25 H, dan Allah Maha Mengetahui. Amr memberlakukan pajak tanah di Alexandria dan pajak kepala pada penduduknya. Diriwayatkan bahwa al-Muqas mundur dari Alexandria ketika mereka melanggar perjanjian, sehingga Amr dan anak buahnya mengizinkannya untuk tetap berada di posisinya semula. Diriwayatkan juga bahwa ia telah meninggal sebelum kampanye ini. Umar ibn Abd al-Aziz biasa berkata: \"Kita tidak menaklukkan desa mana pun di Maghreb melalui perjanjian damai kecuali tiga: Alexandria, Kafr Tis, dan Sultis.\" Dia akan mengatakan bahwa siapa pun di antara penduduk tempat-tempat ini yang masuk Islam, dia akan membebaskannya dan hartanya. Pajak kepala di Alexandria adalah delapan belas ribu dinar, dan ketika Hisham ibn Abd al-Malik menjadi khalifah, pajak itu mencapai tiga puluh enam ribu dinar."
