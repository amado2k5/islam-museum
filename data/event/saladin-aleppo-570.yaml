summary:
  ar: "حصر صلاح الدين حلب ثالث جمادى الآخرة فركب الملك الصالح وهو صبي ابن اثنتي عشرة سنة وقال لأهلها قد عرفتم إحسان أبي إليكم وأنا يتيمكم وقد جاء هذا الظالم يأخذ بلدي وبكى فأبكى الناس فبذلوا الأموال والأنفس وجدّوا في القتال عند جبل حوشن، وأرسل سعد الدين كمشتكين إلى سنان مقدم الإسماعيلية بأموال ليقتلوا صلاح الدين فدخل فرسانهم عسكره فعرفهم خمارتكين صاحب بوقيس فجرحوه وحمل أحدهم على صلاح الدين فقُتل دونه وقُتل الباقون، وبقي محاصرًا حتى رحل مستهل رجب حين سار القمص ريموند إلى حمص فقصده صلاح الدين {cite:kamil-ibn-al-athir p. 67-68}."
  en: "At his first siege of Aleppo, the twelve-year-old al-Ṣāliḥ mounted the walls weeping — «you knew my father's goodness; I am your orphan, and this unjust man comes to take my land» — and Aleppo fought for him at Jabal Jawshan. Saʿd al-Dīn bought Sinān's Assassins against Saladin; Khumārtakīn of Būqīs spotted them in camp, one broke for Saladin and was cut down before him. Saladin held the siege until Rajab, when Raymond's march on Homs drew him off {cite:kamil-ibn-al-athir p. 67-68}."
