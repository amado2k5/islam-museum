summary:
  ar: "حصر صلاح الدين حلب ثالث جمادى الآخرة فركب الملك الصالح وهو صبي ابن اثنتي عشرة سنة وقال لأهلها قد عرفتم إحسان أبي إليكم وأنا يتيمكم وقد جاء هذا الظالم يأخذ بلدي وبكى فأبكى الناس فبذلوا الأموال والأنفس وجدّوا في القتال عند جبل حوشن، وأرسل سعد الدين كمشتكين إلى سنان مقدم الإسماعيلية بأموال ليقتلوا صلاح الدين فدخل فرسانهم عسكره فعرفهم خمارتكين صاحب بوقيس فجرحوه وحمل أحدهم على صلاح الدين فقُتل دونه وقُتل الباقون، وبقي محاصرًا حتى رحل مستهل رجب حين سار القمص ريموند إلى حمص فقصده صلاح الدين {cite:kamil-ibn-al-athir p. 67-68}."
  en: "At his first siege of Aleppo, the twelve-year-old al-Ṣāliḥ mounted the walls weeping — «you knew my father's goodness; I am your orphan, and this unjust man comes to take my land» — and Aleppo fought for him at Jabal Jawshan. Saʿd al-Dīn bought Sinān's Assassins against Saladin; Khumārtakīn of Būqīs spotted them in camp, one broke for Saladin and was cut down before him. Saladin held the siege until Rajab, when Raymond's march on Homs drew him off {cite:kamil-ibn-al-athir p. 67-68}."
  es: "En su primer asedio a Alepo, el joven al-Ṣāliḥ, de doce años, subió a las murallas llorando: «Conocías la bondad de mi padre; soy tu huérfano, y este hombre injusto viene a tomar mi tierra». Alepo luchó por él en Jabal Jawshan. Saʿd al-Dīn compró a los Asesinos de Sinān contra Saladino; Khumārtakīn de Būqīs los vio en el campamento, uno de ellos se unió a Saladino y fue abatido ante él. Saladino mantuvo el asedio hasta Rajab, cuando la marcha de Raimundo sobre Homs lo obligó a retirarse {cite:kamil-ibn-al-athir p. 67-68}."
  fr: "Lors de son premier siège d'Alep, al-Ṣāliḥ, âgé de douze ans, monta sur les remparts en pleurant: « Vous connaissiez la bonté de mon père; je suis votre orphelin, et cet homme injuste vient s'emparer de mes terres ! » Alep combattit à ses côtés à Jabal Jawshan. Saʿd al-Dīn s'assura la protection des Assassins du Sinaï contre Saladin; Khumārtakīn de Būqīs les repéra dans leur campement, l'un d'eux se rallia à Saladin et fut abattu sous ses yeux. Saladin tint le siège jusqu'en Rajab, date à laquelle la marche de Raymond sur Homs le contraignit à abandonner la ville (voir: Kamil ibn al-Athir, p. 67-68)."
  ur: "حلب کے اپنے پہلے محاصرے کے وقت، بارہ سالہ الصالح نے روتے ہوئے دیواروں پر چڑھ دیا — \"تم میرے والد کی بھلائی کو جانتے تھے۔ میں تمہارا یتیم ہوں، اور یہ ظالم میری زمین لینے آیا ہے\" - اور حلب اس کے لیے جبل جاوشن میں لڑا۔ سعدالدین نے صلاح الدین کے خلاف سینان کے قاتلوں کو خرید لیا۔ بوقیس کے خمرتکین نے انہیں کیمپ میں دیکھا، ایک صلاح الدین کے لیے توڑا اور اس کے سامنے کاٹا گیا۔ صلاح الدین نے رجب تک محاصرہ کیا، جب ریمنڈ کے حمص پر مارچ نے اسے وہاں سے ہٹایا۔ 67-68}۔"
  tr: "Selahaddin, Cemadi ahiretin üçüncü gününde Halep'i kuşattı. On iki yaşında bir çocuk olan Kral Salih, atına binip halkına şöyle dedi: \"Babamın size olan iyiliğini biliyorsunuz, ben sizin yetiminizim. Bu zalim ülkemi ele geçirmeye geldi.\" Ağladı ve halk da onunla birlikte ağladı. Para ve canlarını verdiler ve Hawshan Dağı'nda cesurca savaştılar. Saad al-Din Kumuştakin, İsmaililerin lideri Sinan'a Selahaddin'i öldürmesi için para gönderdi. Atlıları onun kampına girdi ve Bukays'ın sahibi Humartakin onları tanıdı. Onu yaraladılar ve içlerinden biri Selahaddin'e saldırdı ama ondan önce öldürüldü, diğerleri de öldürüldü. Selahaddin, Receb ayının başında Rahip Raymond Homs'a gittiğinde ve Selahaddin onun yanına gittiğinde kuşatma altında kaldı. {kaynak: Kamil ibn al-athir s. 67-68}"
  id: "Saladin mengepung Aleppo pada tanggal 3 Jumada al-Akhirah. Raja al-Salih, seorang anak laki-laki berusia dua belas tahun, keluar dan berkata kepada penduduknya, “Kalian tahu kebaikan ayahku kepada kalian, dan aku adalah anak yatim kalian. Tirani ini datang untuk merebut negeriku.” Ia menangis, dan rakyat pun menangis bersamanya. Mereka memberikan uang dan nyawa serta bertempur dengan gagah berani di Gunung Hawshan. Saad al-Din Kumushtakin mengirim uang kepada Sinan, pemimpin kaum Ismaili, untuk membunuh Saladin. Pasukan berkuda mereka memasuki perkemahannya, dan Khumartakin, pemilik Buqais, mengenali mereka. Mereka melukainya, dan salah seorang dari mereka menyerang Saladin tetapi terbunuh di hadapannya, dan sisanya terbunuh. Ia tetap terkepung sampai ia pergi pada awal bulan Rajab ketika Pastor Raymond pergi ke Homs, dan Saladin pergi menemuinya. {cite:kamil-ibn-al-athir hlm. 67-68}"
