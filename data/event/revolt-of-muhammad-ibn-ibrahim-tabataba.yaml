label: { ar: "خروج محمد بن إبراهيم بن طباطبا", en: "The revolt of Muhammad ibn Ibrahim ibn Tabataba", es: "La revuelta de Muhammad ibn Ibrahim ibn Tabataba", fr: "La révolte de Muhammad ibn Ibrahim ibn Tabataba", ur: "محمد بن ابراہیم بن طباطبہ کی بغاوت" }
summary:
  ar: "في سنة تسع وتسعين ومائة خرج محمد بن إبراهيم بن طباطبا بالكوفة داعياً إلى «الرضى من آل محمد»، وذكر الطبري أن الروايات اختلفت في سبب خروجه، ومنها صرف المأمون طاهر بن الحسين عن أعمال المشرق وتوجيه الحسن بن سهل إليها {cite:tabari-tarikh-abu-al-fadl j.8 p.528}."
  en: "In 199 Muhammad ibn Ibrahim ibn Tabataba rose in Kufa calling to 'the approved one from the family of Muhammad'. Al-Tabari notes that reports differ on the cause of his rising, among them al-Ma'mun's removal of Tahir ibn al-Husayn from the eastern provinces and his assignment of al-Hasan ibn Sahl to them {cite:tabari-tarikh-abu-al-fadl j.8 p.528}."
  es: "En el año 199, Muhammad ibn Ibrahim ibn Tabataba se levantó en Kufa invocando al «aprobado de la familia de Muhammad». Al-Tabari señala que existen diferentes versiones sobre la causa de su levantamiento, entre ellas la destitución de Tahir ibn al-Husayn de las provincias orientales por parte de al-Ma'mun y la asignación de al-Hasan ibn Sahl a ellas {cite:tabari-tarikh-abu-al-fadl j.8 p.528}."
  fr: "En 199, Muhammad ibn Ibrahim ibn Tabataba se souleva à Kufa, appelant à l'aide « l'élu de la famille de Muhammad ». Al-Tabari note que les sources divergent quant aux causes de ce soulèvement; parmi elles, la destitution de Tahir ibn al-Husayn des provinces orientales par al-Ma'mun et la nomination d'al-Hasan ibn Sahl à leur tête (voir: Tabari-Tarikh-Abu-al-Fadl, vol. 8, p. 528)."
  ur: "199 میں محمد بن ابراہیم بن طباطبہ کوفہ میں 'محمد کے خاندان میں سے منظور شدہ' کو پکارتے ہوئے اٹھے۔ الطبری نے نوٹ کیا ہے کہ ان کے عروج کے سبب کے بارے میں مختلف رپورٹیں ہیں، جن میں المامون کا طاہر بن الحسین کو مشرقی صوبوں سے ہٹانا اور حسن بن سہل کو ان کے سپرد کرنا ہے۔"
