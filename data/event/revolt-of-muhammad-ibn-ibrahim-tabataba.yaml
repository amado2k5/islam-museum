label: { ar: "خروج محمد بن إبراهيم بن طباطبا", en: "The revolt of Muhammad ibn Ibrahim ibn Tabataba" }
summary:
  ar: "في سنة تسع وتسعين ومائة خرج محمد بن إبراهيم بن طباطبا بالكوفة داعياً إلى «الرضى من آل محمد»، وذكر الطبري أن الروايات اختلفت في سبب خروجه، ومنها صرف المأمون طاهر بن الحسين عن أعمال المشرق وتوجيه الحسن بن سهل إليها {cite:tabari-tarikh-abu-al-fadl j.8 p.528}."
  en: "In 199 Muhammad ibn Ibrahim ibn Tabataba rose in Kufa calling to 'the approved one from the family of Muhammad'. Al-Tabari notes that reports differ on the cause of his rising, among them al-Ma'mun's removal of Tahir ibn al-Husayn from the eastern provinces and his assignment of al-Hasan ibn Sahl to them {cite:tabari-tarikh-abu-al-fadl j.8 p.528}."
