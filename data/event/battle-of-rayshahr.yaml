label: { ar: "وقعة ريشهر ومقتل شهرك", en: "Battle of Rayshahr and Shahrak's Death", fr: "La bataille de Rayshahr et la mort de Shahrak", es: "Batalla de Rayshahr y muerte de Shahrak", ur: "ریشہر کی جنگ اور شاہرک کی موت", tr: "Reyşahr Muharebesi ve Şahrak'ın Öldürülmesi", id: "Pertempuran Reyshahr dan Pembunuhan Shahrak" }
summary:
  ar: "كان شهرك مرزبان فارس أعظم ما كان من قدوم العرب فارس فجمع جمعاً عظيماً وسار حتى أتى ريشهر من أرض سابور قرب توج فخرج إليه الحكم بن أبي العاص وعلى مقدمته سوار بن همام العبدي فاقتتلوا قتالاً شديداً وكان هناك واد قد وكل به شهرك رجلاً في جماعة أمره أن لا يجتازه هارب من أصحابه إلا قتله فأقبل رجل من شجعاء الأساورة مولياً من المعركة فأراد الرجل قتله فقال لا تقتلني فما نقاتل قوماً منصورين الله معهم ووضع حجراً فرماه ففلقه ثم قال أترى هذا السهم الذي فلق الحجر والله ما كان ليخدش بعضهم لو رمي به فبينا هو في ذلك إذ أتاه الخبر بقتل شهرك وكان الذي قتله سوار بن همام حمل عليه فطعنه فأذراه عن فرسه وضربه بسيفه حتى فاضت نفسه وحمل ابن شهرك على سوار فقتله وهزم الله المشركين وفتحت ريشهر عنوة وكان يومها في صعوبته وعظيم النعمة على المسلمين كيوم القادسية وتوجه بالفتح إلى عمر عمرو بن الأهتم التميمي."
  en: "Shahrak, marzban of Fars, mustered a great host at Rayshahr near Tawwaj; al-Hakam ibn Abi al-As met him with Sawwar ibn Hammam al-Abdi on the vanguard — a fierce fight, with a warden posted at the wadi to kill any fugitive. An aswari champion fleeing begged him 'we fight a God-aided people — see this arrow split a stone, yet it could not have scratched them' — then word came of Shahrak's death: Sawwar had stabbed him off his horse and finished him, and Shahrak's son charged and killed Sawwar. The polytheists routed, Rayshahr fell by force — a day like al-Qadisiyya in its hardship and blessing; Amr ibn al-Ahtam bore the victory-verse to Umar."
  fr: "Shahrak, marzban du Fars, rassembla une grande armée à Rayshahr, près de Tawwaj ; al-Hakam ibn Abi al-As l'affronta avec Sawwar ibn Hammam al-Abdi à l'avant-garde : un combat acharné, avec un gardien posté à l'oued pour tuer tout fuyard. Un champion des aswari, en fuite, le supplia : « Nous combattons un peuple que Dieu soutient : vois cette flèche fendre une pierre, et pourtant elle n'aurait pu les égratigner » ; puis vint la nouvelle de la mort de Shahrak : Sawwar l'avait désarçonné d'un coup de lance et achevé, et le fils de Shahrak chargea et tua Sawwar. Les polythéistes furent mis en déroute, Rayshahr tomba par la force : une journée semblable à al-Qadisiyya par sa dureté et sa bénédiction ; Amr ibn al-Ahtam porta à Umar les vers de la victoire."
  es: "Shahrak, marzban de Fars, reunió un gran ejército en Rayshahr, cerca de Tawwaj; al-Hakam ibn Abi al-As lo recibió con Sawwar ibn Hammam al-Abdi a la vanguardia; se libró una feroz batalla, con un guardián apostado en el wadi para matar a cualquier fugitivo. Un campeón aswari que huía le suplicó: «Luchamos contra un pueblo auxiliado por Dios; mira, esta flecha partió una piedra, pero no pudo haberlos herido». Entonces llegó la noticia de la muerte de Shahrak: Sawwar lo había apuñalado, derribándolo de su caballo y acabando con su vida. El hijo de Shahrak cargó contra Sawwar y lo mató. Los politeístas fueron derrotados, Rayshahr cayó por la fuerza; un día como el de al-Qadisiyya en su dureza y bendición; Amr ibn al-Ahtam llevó el versículo de la victoria a Umar."
  ur: "شاہرک، فارس کے مرزبان نے تواج کے قریب رائے شہر میں ایک عظیم میزبان کو جمع کیا۔ الحکم ابن ابی العاص نے اس کی ملاقات سوار بن حمام العبدی کے ساتھ فورتھ پر ہوئی - ایک زبردست لڑائی، کسی فراری کو مارنے کے لیے ایک وارڈن کے ساتھ وادی میں تعینات تھا۔ ایک اسواری چیمپیئن نے بھاگتے ہوئے اس سے التجا کی کہ 'ہم خدا کی مدد کرنے والے لوگوں سے لڑتے ہیں - دیکھو یہ تیر ایک پتھر کو پھٹتا ہے، لیکن یہ انہیں نوچ نہیں سکتا تھا' - پھر شاہرک کی موت کا لفظ آیا: سوار نے اسے گھوڑے سے مار کر ختم کردیا تھا، اور شاہرک کے بیٹے نے سوار کو الزام لگایا اور مار ڈالا۔ مشرکوں نے شکست کھائی، ریشہ زور سے گرا - ایک دن القدسیہ کی طرح اپنی مشقت اور برکت میں؛ عمرو بن الاحتم نے فتح کی آیت حضرت عمر کو دی۔"
  tr: "İran Marzbanı Şahrak, İran'ın en büyük Arap fatihiydi. Büyük bir ordu topladı ve Şapur topraklarındaki Tawaj yakınlarındaki Reyşahr'a kadar yürüdü. El-Hakam ibn Abi el-As, ordusunun başında Suwar ibn Hammam el-Abdi ile birlikte onu karşılamaya çıktı. Şiddetli bir savaş yaptılar. Şahrak, bir grup adamıyla birlikte bir vadiye yerleştirmiş ve oradan kaçan adamlarını öldürmesini emretmişti. Asawira savaşçılarından cesur bir adam savaştan kaçarken geldi ve adam onu öldürmek istedi. Adam, \"Beni öldürmeyin, çünkü biz Allah'ın galip geldiği bir kavimle savaşmayız\" dedi. Bir taş koydu ve fırlattı, taş ikiye ayrıldı. Sonra, \"Taşı ikiye ayıran bu oku görüyor musunuz? Allah'a yemin ederim ki, fırlatılmış olsaydı onlardan hiçbirine zarar vermezdi\" dedi. Bu sırada Şahrak'ın ölüm haberi ona ulaştı. Suwar ibn Hammam, ona doğru hücum ederek onu bıçaklayıp atından düşürmüş ve ardından kılıcıyla vurarak öldürmüştü. Bunun üzerine İbn Şahrak, Suwar'a saldırmış ve onu öldürmüştü. Allah, müşrikleri yenmiş ve Reyşahr zorla ele geçirilmişti. O gün, Müslümanlar için Kadisiye günü kadar zor ve büyük bir nimetti. Zafer daha sonra Ömer ibn Amr ibn Al-Ahtam Al-Tamimi'ye iletilmişti."
  id: "Shahrak, Marzban Persia, adalah penakluk Arab terbesar di Persia. Ia mengumpulkan pasukan besar dan berbaris hingga mencapai Reyshahr di tanah Shapur, dekat Tawaj. Al-Hakam ibn Abi al-As keluar untuk menemuinya, dengan Suwar ibn Hammam al-Abdi sebagai kepala pasukannya. Mereka bertempur sengit. Ada sebuah lembah tempat Shahrak menempatkan seorang pria dengan sekelompok orang, memerintahkannya untuk membunuh siapa pun dari pasukannya yang melarikan diri melalui lembah itu. Seorang pria pemberani dari prajurit Asawira datang melarikan diri dari pertempuran, dan pria itu ingin membunuhnya. Pria itu berkata, \"Jangan bunuh aku, karena kita tidak memerangi kaum yang Allah menangkan.\" Ia meletakkan sebuah batu dan melemparkannya, membelahnya. Kemudian ia berkata, \"Apakah kau melihat panah yang membelah batu ini? Demi Allah, panah ini tidak akan melukai siapa pun dari mereka jika dilemparkan.\" Sementara ia sibuk dengan hal itu, kabar kematian Shahrak sampai kepadanya. Suwar bin Hammam telah membunuhnya, menyerangnya dan menikamnya, menjatuhkannya dari kudanya. Kemudian ia memukulnya dengan pedangnya hingga mati. Ibnu Shahrak kemudian menyerang Suwar dan membunuhnya. Allah mengalahkan kaum musyrik, dan Reyshahr ditaklukkan dengan kekuatan. Hari itu sama sulitnya dan sekaligus merupakan berkah besar bagi kaum Muslimin seperti hari Qadisiyah. Kemenangan itu kemudian dikirim kepada Umar bin Amr bin Al-Ahtam Al-Tamimi."
