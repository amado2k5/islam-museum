label:
  ar: بيعة مكة للمستنصر الحفصي
  en: Mecca's bay'a to the Hafsid al-Mustansir
summary:
  ar: "بعد استيلاء التتر على بغداد ومحوهم رسم الخلافة بها وظهور الدعوة الحفصية بإفريقية، أجمع شريف مكة أبو نمي وأخوه إدريس أمرهما على البيعة للمستنصر صاحب إفريقية، وداخلهما في ذلك الفقيه الصوفي ابن سبعين النازل بجوار الحرم فأملى رسالة البيعة وكتبها بخطه، فخطب أهل مكة للمستنصر في موسم الحج ودخلت الحرم في الدعوة الحفصية."
  en: "After the Tatars took Baghdad and erased the caliphate's rite, Mecca's sharifs Abu Numayy and Idris resolved on the bay'a to the Hafsid al-Mustansir of Ifriqiya, the Sufi jurist Ibn Sab'in dwelling by the sanctuary dictating the bay'a letter in his own hand — and Mecca preached the Hafsid name in the pilgrimage season."
