label: { ar: "ولاية الجرشي وفتح حصون السغد", en: "al-Jarashi and the Sughd Fortresses", es: "al-Jarashi y las fortalezas de Sughd", fr: "al-Jarashi et les forteresses de Sughd" }
summary:
  ar: "ولي سعيد بن عمرو الجرشي خراسان فلما قدمها أمر كاتبه بقراءة عهده وكان لحاناً فقال سعيد أيها الناس إن الأمير بريء مما تسمعون من هذا اللحن ووجه إلى السغد يدعوهم إلى الطاعة والمراجعة وكف عن مبايجتهم حتى أتته رسله بإقامتهم على خلافه فزحف إليهم فانقطع عن عظيمهم زهاء اثني عشر ألف رجل وفارقوهم مائلين إلى الطاعة وافتتح الجرشي عامة حصون السغد ونال من المال نيلاً شافياً."
  en: "Sa'id ibn Amr al-Jarashi came to Khurasan; his lettered 'ahd read with solecisms, he told the people 'the amir is innocent of this lahn'. He invited Sughd back to obedience, held off battle till his envoys reported defiance, then marched — some twelve thousand broke from their leader to submission — and he opened most of Sughd's fortresses with satisfying gain."
  es: "Sa'id ibn Amr al-Jarashi llegó a Jorasán; su letrado, con errores ortográficos, decía a la gente: «El emir es inocente de esta injusticia». Invitó a Sughd a someterse, contuvo la batalla hasta que sus enviados informaron de la rebelión, y entonces marchó —unos doce mil hombres se rebelaron contra su líder y se sometieron— y abrió la mayoría de las fortalezas de Sughd con una victoria satisfactoria."
  fr: "Sa'id ibn Amr al-Jarashi arriva au Khorasan; son ahd savant, truffé de solécismes, annonça au peuple: « L'émir est innocent de ce lahn. » Il invita Sughd à revenir à l'obéissance, retarda le combat jusqu'à ce que ses émissaires rapportent une rébellion, puis marcha – quelque douze mille hommes se détachèrent de leur chef pour se soumettre – et il prit la plupart des forteresses de Sughd avec une victoire satisfaisante."
