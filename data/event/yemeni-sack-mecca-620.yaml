label: { ar: "نهب عسكر اليمن مكة سنة 620هـ", en: "The Yemeni army's sack of Mecca (620 AH)", es: "El saqueo de La Meca por el ejército yemení (620 AH)", fr: "Le sac de La Mecque par l'armée yéménite (620 AH)" }
summary:
  ar: "في سنة عشرين وستمائة سار الملك المسعود أتسز بن الملك الكامل صاحب اليمن إلى مكة وصاحبها حينئذٍ الحسن بن قتادة الذي كان أساء إلى الأشراف والمماليك الذين كانوا لأبيه فتفرقوا عنه، فنهبها عسكره إلى العصر، ويحدث ابن الأثير عن بعض المجاورين المتأهلين أنهم نهبوها حتى أخذوا الثياب عن الناس وأفقروهم، وأمر صاحب اليمن أن ينبش قبر قتادة ويحرق فنبشوه فظهر التابوت والناس ينظرون فلم يروا فيه شيئاً، فعلموا حينئذٍ أن الحسن دفن أباه سراً — وكان الحسن قد قتل أباه وأخاه وعمه لأجل الملك فذاق عاقبة قطيعة الرحم وأزال الله عنه ما قتل لأجله {cite:kamil-ibn-al-athir p. 435-436}."
  en: "620: al-Malik al-Mas'ud Atsiz ibn al-Kamil — the Ayyubid sultan of Yemen — reached Mecca, whose new sharif Hasan ibn Qatada had alienated his father's ashraf and mamluks; the army plundered the sanctuary 'until they took the clothes off people and beggared them'. Atsiz ordered Qatada's grave exhumed and burnt — and the coffin proved empty, exposing that Hasan had secretly buried the father he had strangled. Ibn al-Athir moralises: he lost this world and the next for the kingship he killed for {cite:kamil-ibn-al-athir p. 435-436}."
  es: "620: Al-Malik al-Mas'ud Atsiz ibn al-Kamil —el sultán ayubí de Yemen— llegó a La Meca, cuyo nuevo sharif, Hasan ibn Qatada, había enemistado a los ashraf y mamelucos de su padre; el ejército saqueó el santuario «hasta despojar a la gente de sus ropas y dejarla en la miseria». Atsiz ordenó exhumar y quemar la tumba de Qatada, pero el ataúd resultó vacío, revelando que Hasan había enterrado en secreto al padre al que había estrangulado. Ibn al-Athir reflexiona: perdió este mundo y el venidero por el trono que mató {cite:kamil-ibn-al-athir p. 435-436}."
  fr: "620: al-Malik al-Mas'ud Atsiz ibn al-Kamil, sultan ayyoubide du Yémen, arriva à La Mecque. Son nouveau chérif, Hasan ibn Qatada, s'était aliéné l'ashraf de son père et les mamelouks; l'armée pilla le sanctuaire « jusqu'à dévêtir les gens et les réduire à la mendicité ». Atsiz ordonna d'exhumer et de brûler la tombe de Qatada; le cercueil s'avéra vide, révélant qu'Hasan avait secrètement enterré le père qu'il avait étranglé. Ibn al-Athir en tire une leçon morale: il perdit ce monde et l'autre pour le pouvoir royal pour lequel il avait tué (voir: kamil-ibn-al-athir p. 435-436)."
