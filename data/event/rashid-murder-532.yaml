summary:
  ar: "خرج الراشد بعد خلعه إلى بلاد أذربيجان فعاث بمراغة وهمدان وأصبهان ومرض بظاهر أصبهان مرضاً شديداً فدخل عليه جماعة من العجم كانوا فراشين معه فقتلوه بالسكاكين ثم قتلوا كلهم في سادس عشر رمضان سنة اثنتين وثلاثين ولم تؤخذ البردة والقضيب من الراشد حتى قتل فأحضرا بعد قتله إلى المقتفي وقال العماد الكاتب كان للراشد الحسن اليوسفي والكرم الحاتمي {cite:tarikh-khulafa-minhaj-1434 p. 670}."
  en: "The deposed al-Rashid raided through Azerbaijan, Maragha, Hamadan and Isfahan till, gravely ill outside Isfahan, his own Persian farrashin killed him with knives — they were all killed in turn — on 16 Ramadan 532. The cloak and staff were not taken from him till after his death; al-Imad al-Katib: his was Joseph's beauty and Hatim's bounty {cite:tarikh-khulafa-minhaj-1434 p. 670}."
