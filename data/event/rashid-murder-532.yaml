id: event/rashid-murder-532
class: event
kind: other
label: { ar: "قتل الراشد المخلوع بأصبهان", en: "The killing of the deposed al-Rashid at Isfahan", es: "El asesinato del depuesto al-Rashid en Isfahán.", fr: "L'assassinat du déchu al-Rashid à Ispahan", ur: "اصفہان میں معزول الرشید کا قتل", tr: "Devrik Raşid, İsfahan'da öldürüldü.", id: "Rashid yang digulingkan dibunuh di Isfahan." }
summary:
  ar: "خرج الراشد بعد خلعه إلى بلاد أذربيجان فعاث بمراغة وهمدان وأصبهان ومرض بظاهر أصبهان مرضاً شديداً فدخل عليه جماعة من العجم كانوا فراشين معه فقتلوه بالسكاكين ثم قتلوا كلهم في سادس عشر رمضان سنة اثنتين وثلاثين ولم تؤخذ البردة والقضيب من الراشد حتى قتل فأحضرا بعد قتله إلى المقتفي وقال العماد الكاتب كان للراشد الحسن اليوسفي والكرم الحاتمي {cite:tarikh-khulafa-minhaj-1434 p. 670}."
  en: "The deposed al-Rashid raided through Azerbaijan, Maragha, Hamadan and Isfahan till, gravely ill outside Isfahan, his own Persian farrashin killed him with knives — they were all killed in turn — on 16 Ramadan 532. The cloak and staff were not taken from him till after his death; al-Imad al-Katib: his was Joseph's beauty and Hatim's bounty {cite:tarikh-khulafa-minhaj-1434 p. 670}."
  es: "El depuesto al-Rashid saqueó Azerbaiyán, Maragha, Hamadán e Isfahán hasta que, gravemente enfermo a las afueras de Isfahán, su propio farrashin persa lo mató a cuchilladas —todos fueron asesinados a su vez— el 16 de Ramadán de 532. La capa y el bastón no le fueron arrebatados hasta después de su muerte; al-Imad al-Katib: «Él era la belleza de José y la generosidad de Hatim» {cita: tarikh-khulafa-minhaj-1434 p. 670}."
  fr: "Le déchu al-Rashid mena des raids à travers l'Azerbaïdjan, Maragha, Hamadan et Ispahan jusqu'à ce que, gravement malade aux abords d'Ispahan, ses propres farrashin persans le tuent à coups de couteau — ils furent tous tués tour à tour — le 16 Ramadan 532. Le manteau et le bâton ne lui furent retirés qu'après sa mort; al-Imad al-Katib: il possédait la beauté de Joseph et la générosité de Hatim {cite:tarikh-khulafa-minhaj-1434 p. 670}."
  ur: "معزول الرشید نے آذربائیجان، مراثہ، ہمدان اور اصفہان کے راستے چھاپے مارے یہاں تک کہ اصفہان کے باہر شدید بیمار ہوئے، اس کے اپنے فارسی فارشین نے اسے چھریوں کے وار کر کے قتل کر دیا - وہ سب کے سب باری باری 16 رمضان 532 کو مارے گئے۔ عماد الکتب: یوسف کا حسن اور حاتم کا فضل تھا۔ 670}۔"
  tr: "Tahttan indirildikten sonra Raşid, Azerbaycan topraklarına gitti ve Maragheh, Hamadan ve İsfahan'da büyük tahribat yaptı. İsfahan'ın dış mahallelerinde ağır hastalandı ve maiyetindeki Arap olmayan bir grup onu bıçakla öldürdü. Sonra hepsi 32. yılın Ramazan ayının on altıncı gününde öldürüldü. Raşid öldürülene kadar cübbesi ve asası ondan alınmadı ve öldürüldükten sonra Muktafi'ye getirildi. İmad Katib şöyle dedi: Raşid, Yusufi'nin iyiliğine ve Hatim'in cömertliğine sahipti. {kaynak:tarikh-khulafa-minhaj-1434 s. 670}"
  id: "Setelah digulingkan, Al-Rashid pergi ke tanah Azerbaijan dan menimbulkan kekacauan di Maragheh, Hamadan, dan Isfahan. Ia jatuh sakit parah di pinggiran Isfahan, dan sekelompok orang non-Arab yang merupakan pengikutnya mendatanginya dan membunuhnya dengan pisau. Kemudian mereka semua dibunuh pada tanggal enam belas Ramadan tahun tiga puluh dua. Jubah dan tongkat tidak diambil dari Al-Rashid sampai ia terbunuh, dan keduanya dibawa setelah kematiannya kepada Al-Muqtafi. Al-Imad Al-Katib berkata: Al-Rashid memiliki kebaikan Yusufi dan kemurahan hati Hatim. {cite:tarikh-khulafa-minhaj-1434 p. 670}."
