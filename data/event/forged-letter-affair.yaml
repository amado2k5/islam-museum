    summary: { ar: "يرى الصلابي، نقلاً عن ابن كثير، أن الكتاب مزور على عثمان وأن الذين زوروا الكتب على لسان الصحابة هم الذين أوقدوا الفتنة، وأن عثمان لم يأمر به ولم يعلم (ص165-166). وهذا رأي الكتاب وليس حكماً نهائياً على الأشخاص.", en: "Al-Sallabi, citing Ibn Kathir, holds that the letter was forged in Uthman's name and that the forgers were the authors of the fitna (pp. 165-166)." }
