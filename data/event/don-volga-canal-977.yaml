label: { ar: "حملة استراخان ومشروع قناة الدون–الفولغا" }
summary:
  ar: "اشتكى حاكم خوارزم للسلطان سليم الثاني أن شاه فارس يقبض على الحجاج الوافدين من تركستان وأن موسكو بعد استيلائها على استراخان منعت مرور الحجاج والتجارة، فطلب حاكم خوارزم وحاكما بخارى وسمرقند أن يفتح استراخان لإعادة فتح طريق الحج. أعد الصوقللي باشا حملة كبرى سنة ٩٧٦–٩٧٧هـ/١٥٦٨–١٥٦٩م للاستيلاء على استراخان وجعلها قاعدة عثمانية، ووصل ما بين نهري الفولغا والدون بقناة صالحة لمرور السفن ليدخل الأسطول العثماني بحر الخزر عن طريق البحر الأسود، فيوقف التوسع الروسي جنوباً ويطرد الفرس من القوقاز وأذربيجان ويحيي طريق القوافل القديمة. وشرع العثمانيون في التنفيذ وحلّ شهر جمادى الأولى ٩٧٧هـ/أكتوبر ١٥٦٩م وقد اكتمل ثلث القناة، لكن موسم الشتاء أوقف العمل وفشلت الحملة بسبب الظروف الطبيعية، ومع هذا شدّد الصوقللي قبضة السلطان على أمراء مولدافيا وولاشيا وبولندا فاعترضت الدولة مرحلياً توسع روسيا {cite:dawlat-uthmaniyya-salabi p. 278-279}."
  en: "The Astrakhan expedition and Don–Volga canal, 1569 — Sokollu's audacious plan to sail the Ottoman fleet into the Caspian: a third of the canal was dug by October before winter killed the project. The Khivan and Bukharan appeals had asked the Porte to reopen the pilgrimage road that Muscovy's seizure of Astrakhan had cut {cite:dawlat-uthmaniyya-salabi p. 278-279}."
