label: { ar: "حملة استراخان ومشروع قناة الدون–الفولغا", en: "The Astrakhan campaign and the Don–Volga canal project", es: "La campaña de Astracán y el proyecto del canal Don-Volga", fr: "La campagne d'Astrakhan et le projet de canal Don-Volga", ur: "آسٹرخان مہم اور ڈان وولگا کینال پروجیکٹ" }
summary:
  ar: "اشتكى حاكم خوارزم للسلطان سليم الثاني أن شاه فارس يقبض على الحجاج الوافدين من تركستان وأن موسكو بعد استيلائها على استراخان منعت مرور الحجاج والتجارة، فطلب حاكم خوارزم وحاكما بخارى وسمرقند أن يفتح استراخان لإعادة فتح طريق الحج. أعد الصوقللي باشا حملة كبرى سنة ٩٧٦–٩٧٧هـ/١٥٦٨–١٥٦٩م للاستيلاء على استراخان وجعلها قاعدة عثمانية، ووصل ما بين نهري الفولغا والدون بقناة صالحة لمرور السفن ليدخل الأسطول العثماني بحر الخزر عن طريق البحر الأسود، فيوقف التوسع الروسي جنوباً ويطرد الفرس من القوقاز وأذربيجان ويحيي طريق القوافل القديمة. وشرع العثمانيون في التنفيذ وحلّ شهر جمادى الأولى ٩٧٧هـ/أكتوبر ١٥٦٩م وقد اكتمل ثلث القناة، لكن موسم الشتاء أوقف العمل وفشلت الحملة بسبب الظروف الطبيعية، ومع هذا شدّد الصوقللي قبضة السلطان على أمراء مولدافيا وولاشيا وبولندا فاعترضت الدولة مرحلياً توسع روسيا {cite:dawlat-uthmaniyya-salabi p. 278-279}."
  en: "The Astrakhan expedition and Don–Volga canal, 1569 — Sokollu's audacious plan to sail the Ottoman fleet into the Caspian: a third of the canal was dug by October before winter killed the project. The Khivan and Bukharan appeals had asked the Porte to reopen the pilgrimage road that Muscovy's seizure of Astrakhan had cut {cite:dawlat-uthmaniyya-salabi p. 278-279}."
  es: "La expedición a Astracán y el canal Don-Volga, 1569: el audaz plan de Sokollu para llevar la flota otomana al mar Caspio: un tercio del canal se excavó en octubre antes de que el invierno frustrara el proyecto. Las peticiones de Jiva y Bujará habían solicitado a la Sublime Puerta que reabriera la ruta de peregrinación que la toma de Astracán por parte de Moscovia había cortado {cite:dawlat-uthmaniyya-salabi p. 278-279}."
  fr: "L'expédition d'Astrakhan et le canal Don-Volga, 1569 — Le projet audacieux de Sokollu visant à faire naviguer la flotte ottomane jusqu'à la mer Caspienne: un tiers du canal était creusé en octobre avant que l'hiver ne mette fin au projet. Les appels de Khiva et de Boukhara demandaient à la Sublime Porte de rouvrir la route de pèlerinage coupée par la prise d'Astrakhan par la Moscovie (voir: Dawlat-Uthmaniyya-Salabi, p. 278-279)."
  ur: "آسٹرخان مہم اور ڈان وولگا نہر، 1569 - عثمانی بحری بیڑے کو کیسپین میں روانہ کرنے کا سوکولو کا بہادر منصوبہ: سردیوں نے اس منصوبے کو ختم کرنے سے پہلے اکتوبر تک نہر کا ایک تہائی حصہ کھودا تھا۔ خیوان اور بخاران کی اپیلوں نے پورٹے سے کہا تھا کہ وہ زیارت کے راستے کو دوبارہ کھول دے جسے ماسکووی کے استراخان پر قبضے نے کاٹ دیا تھا۔ 278-279}۔"
