label: { ar: "مرض أبي أحمد الموفق ثم موته", en: "The illness and death of Abu Ahmad al-Muwaffaq", es: "La enfermedad y muerte de Abu Ahmad al-Muwaffaq", fr: "La maladie et la mort d'Abu Ahmad al-Muwaffaq", ur: "ابو احمد الموفق کی بیماری اور وفات" }
summary:
  ar: "في سنة ثمان وسبعين ومائتين انصرف أبو أحمد الموفق من الجبل إلى العراق وقد اشتد به وجع النقرس حتى لم يقدر على الركوب، ثم توفي يوم الأربعاء لثمان بقين من صفر ودُفن في الرصافة عند قبر والدته {cite:tabari-tarikh-abu-al-fadl j.10 p.20} {cite:tabari-tarikh-abu-al-fadl j.10 p.22}. وعند المسعودي وافى من أذربيجان عليلاً مدنفاً مورماً في بيت من الخشب مبطن بالخز والحرير تحمله الرجال على الأكتاف نوائب فوصل بغداد يوم الخميس لليلتين خلتا من صفر سنة ثمان وسبعين ومائتين، وكثر اضطراب القواد وأسرعت العامة في نهب دور الجلة والكتاب وفتحت الجسور وأبواب السجون، ومات ليلة الخميس لثلاث بقين من صفر وله تسع وأربعون سنة وأمه أم ولد رومية يقال لها أسحر وكان اسمه طلحة {cite:muruj-al-dhahab p. 594-595}، وعند ابن الجوزي وعند ابن الجوزي وافى أبو أحمد الموفق من الجبل إلى العراق في المحرم فتلقاه الناس بالنهر وإن فركب في الماء وسار في النهروان ثم في نهر ديالى ثم في دجلة وكان مريضاً بالنقرس ودخل داره في أوائل صفر ثم توفي بعد أيام، وطلع لليلتين بقيتا من المحرم كوكب ذو جمّة ثم صارت الجمة ذؤابة {cite:muntazam-ibn-al-jawzi p. 113-114}"
  en: "In 278 Abu Ahmad al-Muwaffaq returned from the highlands to Iraq, his gout so severe that he could not ride. He died on Wednesday, eight days before the end of Safar, and was buried in al-Rusafa beside his mother's grave {cite:tabari-tarikh-abu-al-fadl j.10 p.20} {cite:tabari-tarikh-abu-al-fadl j.10 p.22}. According to al-Mas'udi, he came from Azerbaijan gravely ill, swollen and wasting, in a wooden litter lined with silk and brocade, carried in relays on men's shoulders. He reached Baghdad on Thursday, two nights into Safar of 278. The commanders grew restless, the common people hurried to plunder the houses of the notables and secretaries, and the bridges and prison doors were opened. He died on the night of Thursday, three days before the end of Safar, aged forty-nine. His mother was a Byzantine umm walad called Asahr, and his name was Talha {cite:muruj-al-dhahab p. 594-595}. According to Ibn al-Jawzi, Abu Ahmad al-Muwaffaq came from the highlands to Iraq in Muharram, and people met him at the river; he rode on the water, passing through al-Nahrawan, then the Diyala, then the Tigris. He was sick with gout, entered his house in early Safar, and died a few days later. Two nights before the end of Muharram a star with a mane appeared, and the mane then became a tail {cite:muntazam-ibn-al-jawzi p. 113-114}."
  es: "En 278, Abu Ahmad al-Muwaffaq regresó de las tierras altas a Irak, con una gota tan severa que le impedía montar a caballo. Murió el miércoles, ocho días antes del final del Safar, y fue enterrado en al-Rusafa junto a la tumba de su madre {cite:tabari-tarikh-abu-al-fadl j.10 p.20} {cite:tabari-tarikh-abu-al-fadl j.10 p.22}. Según al-Mas'udi, llegó de Azerbaiyán gravemente enfermo, hinchado y demacrado, en una litera de madera forrada de seda y brocado, transportado por turnos sobre los hombros de varios hombres. Llegó a Bagdad el jueves, dos noches después del inicio del Safar de 278. Los comandantes se inquietaron, el pueblo se apresuró a saquear las casas de los notables y secretarios, y se abrieron los puentes y las puertas de las prisiones. Murió la noche del jueves, tres días antes del final del Safar, a los cuarenta y nueve años. Su madre era una umm walad bizantina llamada Asahr, y su nombre era Talha {cite:muruj-al-dhahab p. 594-595}. Según Ibn al-Jawzi, Abu Ahmad al-Muwaffaq llegó de las tierras altas a Irak en Muharram, y la gente lo recibió en el río; cabalgó sobre el agua, pasando por al-Nahrawan, luego Diyala y finalmente el Tigris. Estaba enfermo de gota, entró en su casa a principios de Safar y murió pocos días después. Dos noches antes del final de Muharram apareció una estrella con melena, y la melena se convirtió entonces en cola {cite:muntazam-ibn-al-jawzi p. 113-114}."
  fr: "En 278, Abou Ahmad al-Muwaffaq revint des hauts plateaux en Irak, souffrant d'une goutte si aiguë qu'il ne pouvait plus monter à cheval. Il mourut le mercredi, huit jours avant la fin du mois de Safar, et fut enterré à al-Rusafa, près de la tombe de sa mère. Selon al-Mas'udi, il arriva d'Azerbaïdjan gravement malade, le corps enflé et amaigri, dans une litière de bois recouverte de soie et de brocart, porté à tour de rôle par des hommes. Il atteignit Bagdad le jeudi, deux nuits après le début du mois de Safar 278. Les commandants s'impatientèrent, le peuple se précipita pour piller les maisons des notables et des secrétaires, et les ponts et les portes des prisons furent ouverts. Il mourut dans la nuit du jeudi, trois jours avant la fin du mois de Safar, à l'âge de quarante-neuf ans. Sa mère était une umm walad byzantine nommée Asahr, et son nom était Talha (cf. Muruj al-Dhahab, p. 594-595). Selon Ibn al-Jawzi, Abu Ahmad al-Muwaffaq arriva des hauts plateaux en Irak au mois de Muharram. On l'accueillit au bord du fleuve; il navigua sur l'eau, passant par al-Nahrawan, puis la Diyala, et enfin le Tigre. Atteint de goutte, il rentra chez lui au début du mois de Safar et mourut quelques jours plus tard. Deux nuits avant la fin de Muharram, une étoile à crinière apparut, dont la crinière se transforma ensuite en queue (cf. Muntazam ibn al-Jawzi, p. 113-114)."
  ur: "278 میں ابو احمد الموفق پہاڑی علاقوں سے عراق واپس آئے، ان کا گاؤٹ اتنا شدید تھا کہ وہ سواری نہیں کر سکتے تھے۔ آپ کا انتقال صفر کے اختتام سے آٹھ دن قبل بدھ کے روز ہوا اور آپ کو الرسافہ میں اپنی والدہ کی قبر کے پاس دفن کیا گیا {حوالہ: طبری تاریخ ابو الفضل ج10 ص20} {حوالہ: طبری تاریخ ابو الفضل ج10 ص22}۔ المسعودی کے مطابق، وہ آذربائیجان سے شدید بیمار، سوجن اور برباد، ریشم اور بروکیڈ سے لیس لکڑی کے کوڑے میں، مردوں کے کندھوں پر ریلے میں لے کر آیا تھا۔ وہ 278 صفر کی دو راتوں میں جمعرات کو بغداد پہنچا۔ کمانڈر بے چین ہو گئے، عام لوگ معززین اور سیکرٹریوں کے گھروں کو لوٹنے کے لیے دوڑ پڑے، اور پل اور جیل کے دروازے کھل گئے۔ ان کا انتقال صفر کے اختتام سے تین دن قبل جمعرات کی رات انتالیس برس کی عمر میں ہوا۔ اس کی والدہ بازنطینی ام ولاد تھیں جن کا نام اشہر تھا اور اس کا نام طلحہ تھا۔ 594-595}۔ ابن الجوزی کے مطابق ابو احمد الموفق محرم میں پہاڑی علاقوں سے عراق آئے اور لوگ دریا کے کنارے ان سے ملے۔ وہ پانی پر سوار ہو کر النہروان، پھر دیالہ، پھر دجلہ سے گزرا۔ وہ گاؤٹ کے مرض میں مبتلا تھے، صفر کے اوائل میں اپنے گھر میں داخل ہوئے، اور کچھ دن بعد انتقال کر گئے۔ محرم کے اختتام سے دو رات قبل ایک ایال والا ستارہ نمودار ہوا اور ایال پھر دم بن گئی۔ 113-114}۔"
