label: { ar: "مرض أبي أحمد الموفق ثم موته", en: "The illness and death of Abu Ahmad al-Muwaffaq" }
summary:
  ar: "في سنة ثمان وسبعين ومائتين انصرف أبو أحمد الموفق من الجبل إلى العراق وقد اشتد به وجع النقرس حتى لم يقدر على الركوب، ثم توفي يوم الأربعاء لثمان بقين من صفر ودُفن في الرصافة عند قبر والدته {cite:tabari-tarikh-abu-al-fadl j.10 p.20} {cite:tabari-tarikh-abu-al-fadl j.10 p.22}. وعند المسعودي وافى من أذربيجان عليلاً مدنفاً مورماً في بيت من الخشب مبطن بالخز والحرير تحمله الرجال على الأكتاف نوائب فوصل بغداد يوم الخميس لليلتين خلتا من صفر سنة ثمان وسبعين ومائتين، وكثر اضطراب القواد وأسرعت العامة في نهب دور الجلة والكتاب وفتحت الجسور وأبواب السجون، ومات ليلة الخميس لثلاث بقين من صفر وله تسع وأربعون سنة وأمه أم ولد رومية يقال لها أسحر وكان اسمه طلحة {cite:muruj-al-dhahab p. 594-595}، وعند ابن الجوزي وعند ابن الجوزي وافى أبو أحمد الموفق من الجبل إلى العراق في المحرم فتلقاه الناس بالنهر وإن فركب في الماء وسار في النهروان ثم في نهر ديالى ثم في دجلة وكان مريضاً بالنقرس ودخل داره في أوائل صفر ثم توفي بعد أيام، وطلع لليلتين بقيتا من المحرم كوكب ذو جمّة ثم صارت الجمة ذؤابة {cite:muntazam-ibn-al-jawzi p. 113-114}"
  en: "In 278 Abu Ahmad al-Muwaffaq returned from the highlands to Iraq, his gout so severe that he could not ride. He died on Wednesday, eight days before the end of Safar, and was buried in al-Rusafa beside his mother's grave {cite:tabari-tarikh-abu-al-fadl j.10 p.20} {cite:tabari-tarikh-abu-al-fadl j.10 p.22}. According to al-Mas'udi, he came from Azerbaijan gravely ill, swollen and wasting, in a wooden litter lined with silk and brocade, carried in relays on men's shoulders. He reached Baghdad on Thursday, two nights into Safar of 278. The commanders grew restless, the common people hurried to plunder the houses of the notables and secretaries, and the bridges and prison doors were opened. He died on the night of Thursday, three days before the end of Safar, aged forty-nine. His mother was a Byzantine umm walad called Asahr, and his name was Talha {cite:muruj-al-dhahab p. 594-595}. According to Ibn al-Jawzi, Abu Ahmad al-Muwaffaq came from the highlands to Iraq in Muharram, and people met him at the river; he rode on the water, passing through al-Nahrawan, then the Diyala, then the Tigris. He was sick with gout, entered his house in early Safar, and died a few days later. Two nights before the end of Muharram a star with a mane appeared, and the mane then became a tail {cite:muntazam-ibn-al-jawzi p. 113-114}."
