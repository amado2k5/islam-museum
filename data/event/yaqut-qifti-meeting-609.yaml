label:
  ar: "ياقوت يُدخَل على القاضي الأكرم القفطي بحلب، ٦٠٩هـ/١٢١٢م"
  en: "Yaqut presented to the vizier al-Qadi al-Akram al-Qifti at Aleppo, 609/1212"
  ur: "یاقوت کو حلب میں وزیر قاضی اکرم قفطی سے ملوایا گیا، 609ھ/1212ء"
summary:
  ar: "في جولته بغداد–الشام–تبريز–بغداد ⁦(٦٠٧–٦١٠هـ)⁩ أدخله سنة ٦٠٩هـ/١٢١٢م أبو علي القيلوي — وسيط شراء الكتب — على القاضي الأكرم ابن القفطي وزير حلب، يحمل ما جمعه من كتب، فقال القفطي: «فلم يكن فيها سوى كتابين ابتعتهما منه، وتأملته في منظره ومخبره فتوسمت فيه أموراً لم يخب حدسي فيها، وعلمت أنه لا يصلح للعشرة» {cite:mawsuat-a3lam-ulama-adaba p. 277} {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}."
  en: "On his Baghdad–Syria–Tabriz–Baghdad circuit (607-10), the book agent Abu Ali al-Qilawi presented Yaqut in 609/1212 to the Qadi al-Akram Ibn al-Kifti (al-Qifti), vizier of Aleppo, carrying his gathered books. Al-Qifti records: 'There were but two books in them that I bought from him; I studied his looks and his talk, divined things in him that my intuition did not belie, and I knew he was not fit for company' {cite:mawsuat-a3lam-ulama-adaba p. 277} {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}."
  ur: "بغداد–شام–تبریز–بغداد کے سفر (607-10ھ) میں کتابوں کے دلال ابو علی قیلوی نے 609ھ/1212ء میں اسے حلب کے وزیر قاضی اکرم ابن قفطی سے ملوایا۔ قفطی لکھتے ہیں: «ان میں صرف دو کتابیں تھیں جو میں نے خریدیں؛ میں نے اس کے چہرے اور گفتگو کا جائزہ لیا، ایسی باتیں سمجھا جن میں میری توقع خاط نہ ہوئی، اور جان لیا کہ وہ صحبت کے قابل نہیں» {cite:mawsuat-a3lam-ulama-adaba p. 277} {cite:encyclopaedia-of-islam-2 vol. 11 p. 265}۔"
