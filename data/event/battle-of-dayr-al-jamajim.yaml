label: { ar: "وقعة دير الجماجم", en: "Battle of Dayr al-Jamajim" }
summary:
  ar: "وقعة دير الجماجم بين الحجاج وعبد الرحمن بن محمد بن الأشعث، أوردها الطبري في سنة اثنتين وثمانين، وذكر أن بعضهم جعلها في سنة ثلاث وثمانين {cite:tabari-tarikh-abu-al-fadl j.6 p.346}. وذكر ترتيب الصفوف يومها {cite:tabari-tarikh-abu-al-fadl j.6 p.349}. وعند المسعودي التقى الحجاج وابن الأشعث بالموضع المعروف بدير الجماجم فكانت بينهم وقائع نيف وثمانون وقعة تفانى فيها خلق وذلك في سنة اثنتين وثمانين وكانت على ابن الأشعث فمضى حتى انتهى إلى ملوك الهند ولم يزل الحجاج يحتال في قتله حتى قتل وأتى برأسه {cite:muruj-al-dhahab p. 123}"
  en: "The battle of Dayr al-Jamajim between al-Hajjaj and Abd al-Rahman ibn Muhammad ibn al-Ash'ath. Al-Tabari records it under the year 82 AH, while noting that some placed it in 83 AH {cite:tabari-tarikh-abu-al-fadl j.6 p.346}. He describes how the lines were arranged that day {cite:tabari-tarikh-abu-al-fadl j.6 p.349}. In al-Mas'udi's account, al-Hajjaj and Ibn al-Ash'ath met at the place known as Dayr al-Jamajim, and there were more than eighty engagements between them in which a multitude perished; this was in 82 AH, and the outcome went against Ibn al-Ash'ath, who went on until he reached the kings of India. Al-Hajjaj kept scheming to kill him until he was killed and his head was brought to him {cite:muruj-al-dhahab p. 123}."
