label: { ar: "وقعة دير الجماجم", en: "Battle of Dayr al-Jamajim", fr: "La bataille de Dayr al-Jamajim", es: "Batalla de Dayr al-Jamajim", ur: "دیرالجمجم کی جنگ", tr: "Deyr el-Cemacem Muharebesi", id: "Pertempuran Deir al-Jamajem" }
summary:
  ar: "وقعة دير الجماجم بين الحجاج وعبد الرحمن بن محمد بن الأشعث، أوردها الطبري في سنة اثنتين وثمانين، وذكر أن بعضهم جعلها في سنة ثلاث وثمانين {cite:tabari-tarikh-abu-al-fadl j.6 p.346}. وذكر ترتيب الصفوف يومها {cite:tabari-tarikh-abu-al-fadl j.6 p.349}. وعند المسعودي التقى الحجاج وابن الأشعث بالموضع المعروف بدير الجماجم فكانت بينهم وقائع نيف وثمانون وقعة تفانى فيها خلق وذلك في سنة اثنتين وثمانين وكانت على ابن الأشعث فمضى حتى انتهى إلى ملوك الهند ولم يزل الحجاج يحتال في قتله حتى قتل وأتى برأسه {cite:muruj-al-dhahab p. 123}"
  en: "The battle of Dayr al-Jamajim between al-Hajjaj and Abd al-Rahman ibn Muhammad ibn al-Ash'ath. Al-Tabari records it under the year 82 AH, while noting that some placed it in 83 AH {cite:tabari-tarikh-abu-al-fadl j.6 p.346}. He describes how the lines were arranged that day {cite:tabari-tarikh-abu-al-fadl j.6 p.349}. In al-Mas'udi's account, al-Hajjaj and Ibn al-Ash'ath met at the place known as Dayr al-Jamajim, and there were more than eighty engagements between them in which a multitude perished; this was in 82 AH, and the outcome went against Ibn al-Ash'ath, who went on until he reached the kings of India. Al-Hajjaj kept scheming to kill him until he was killed and his head was brought to him {cite:muruj-al-dhahab p. 123}."
  fr: "La bataille de Dayr al-Jamajim entre al-Hajjaj et Abd al-Rahman ibn Muhammad ibn al-Ash'ath. Al-Tabari la consigne sous l'année 82 H, tout en notant que certains la placent en 83 H {cite:tabari-tarikh-abu-al-fadl j.6 p.346}. Il décrit la disposition des lignes ce jour-là {cite:tabari-tarikh-abu-al-fadl j.6 p.349}. Dans le récit d'al-Mas'udi, al-Hajjaj et Ibn al-Ash'ath se rencontrèrent au lieu dit Dayr al-Jamajim, et il y eut entre eux plus de quatre-vingts engagements où périt une multitude ; c'était en 82 H, et l'issue tourna contre Ibn al-Ash'ath, qui poursuivit sa route jusqu'à atteindre les rois de l'Inde. Al-Hajjaj ne cessa d'intriguer pour le faire tuer, jusqu'à ce qu'il fût tué et que sa tête lui fût apportée {cite:muruj-al-dhahab p. 123}."
  es: "La batalla de Dayr al-Jamajim entre al-Hajjaj y Abd al-Rahman ibn Muhammad ibn al-Ash'ath. Al-Tabari la registra en el año 82 AH, aunque señala que algunos la ubican en el 83 AH {cite:tabari-tarikh-abu-al-fadl j.6 p.346}. Describe cómo se dispusieron las líneas ese día {cite:tabari-tarikh-abu-al-fadl j.6 p.349}. En el relato de al-Mas'udi, al-Hajjaj e Ibn al-Ash'ath se encontraron en el lugar conocido como Dayr al-Jamajim, y hubo más de ochenta enfrentamientos entre ellos en los que pereció una multitud; esto ocurrió en el año 82 AH, y el resultado fue desfavorable para Ibn al-Ash'ath, quien continuó su camino hasta llegar a los reyes de la India. Al-Hajjaj siguió tramando cómo matarlo hasta que lo mataron y le trajeron su cabeza {cite:muruj-al-dhahab p. 123}."
  ur: "حجاج اور عبدالرحمٰن بن محمد بن اشعث کے درمیان دیر الجماع کی جنگ۔ الطبری نے اسے سنہ 82 ہجری کے تحت درج کیا ہے، جبکہ بعض نے اسے 83 ہجری میں درج کیا ہے۔ وہ بیان کرتا ہے کہ اس دن لائنوں کو کس طرح ترتیب دیا گیا تھا {حوالہ: طبری-تاریخ-ابو الفضل ج.6 صفحہ 349}۔ المسعودی کے بیان میں، الحجاج اور ابن اشعث کی ملاقات اس جگہ پر ہوئی جسے دیرالجمجم کہا جاتا ہے، اور ان کے درمیان اسّی سے زیادہ مصروفیات ہوئیں جن میں ایک ہجوم ہلاک ہوا۔ یہ 82 ہجری میں ہوا، اور اس کا نتیجہ ابن اشعث کے خلاف نکلا، جو ہندوستان کے بادشاہوں تک جا پہنچا۔ الحجاج اسے قتل کرنے کی تدبیر کرتا رہا یہاں تک کہ اسے قتل کر دیا گیا اور اس کا سر اس کے پاس لایا گیا۔ 123}۔"
  tr: "El-Haccac ile Abdül-Rahman ibn Muhammed ibn el-Eş'at arasında gerçekleşen Deyr el-Cemacim Muharebesi, bazı kaynaklara göre Hicri 82 yılında gerçekleşmiştir (kaynak: Tabari-tarikh-ebu-el-Fadl, cilt 6, s. 346). Ayrıca o günkü safların düzenini de anlatmıştır (kaynak: Tabari-tarikh-ebu-el-Fadl, cilt 6, s. 349). El-Mas'udi'ye göre, El-Haccac ve İbn el-Eş'at Deyr el-Cemacim olarak bilinen yerde karşılaşmış ve seksenin üzerinde savaş yaşanmış, bu savaşlarda birçok kişi ölmüştür. Bu olay Hicri 82 yılında gerçekleşmiş ve İbn el-Eş'at mağlup olmuştur. Bunun üzerine Hindistan krallarına kaçtı ve el-Haccac onun ölümünü planlamaya devam etti, sonunda öldürüldü ve başı geri getirildi. {cite:muruj-al-dhahab s. 123}"
  id: "Pertempuran Dayr al-Jamajim antara al-Hajjaj dan Abd al-Rahman ibn Muhammad ibn al-Ash'ath dicatat oleh al-Tabari pada tahun 82 H, meskipun beberapa sumber menyebutkan tahun 83 H {kutip:tabari-tarikh-abu-al-fadl vol. 6 hlm. 346}. Ia juga menggambarkan susunan barisan pada hari itu {kutip:tabari-tarikh-abu-al-fadl vol. 6 hlm. 349}. Menurut al-Mas'udi, al-Hajjaj dan Ibn al-Ash'ath bertemu di tempat yang dikenal sebagai Dayr al-Jamajim, dan terjadi lebih dari delapan puluh pertempuran, di mana banyak yang gugur. Peristiwa ini terjadi pada tahun 82 H, dan Ibn al-Ash'ath dikalahkan. Kemudian ia melarikan diri ke raja-raja India, dan al-Hajjaj terus merencanakan kematiannya hingga akhirnya ia terbunuh, dan kepalanya dibawa kembali {cite:muruj-al-dhahab p. 123}."
