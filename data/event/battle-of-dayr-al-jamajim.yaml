label: { ar: "وقعة دير الجماجم" }
summary:
  ar: "وقعة دير الجماجم بين الحجاج وعبد الرحمن بن محمد بن الأشعث، أوردها الطبري في سنة اثنتين وثمانين، وذكر أن بعضهم جعلها في سنة ثلاث وثمانين {cite:tabari-tarikh-abu-al-fadl j.6 p.346}. وذكر ترتيب الصفوف يومها {cite:tabari-tarikh-abu-al-fadl j.6 p.349}.، وعند المسعودي التقى الحجاج وابن الأشعث بالموضع المعروف بدير الجماجم فكانت بينهم وقائع نيف وثمانون وقعة تفانى فيها خلق وذلك في سنة اثنتين وثمانين وكانت على ابن الأشعث فمضى حتى انتهى إلى ملوك الهند ولم يزل الحجاج يحتال في قتله حتى قتل وأتى برأسه {cite:muruj-al-dhahab p. 123}"
