id: event/sulh-ubaydallah-rutbil
class: event
kind: treaty
label: { ar: "صلح عبيد الله بن أبي بكرة ورتبيل", en: "Ubaydallah ibn Abi Bakra's Peace with Rutbil", es: "La paz de Ubaydallah ibn Abi Bakra con Rutbil", fr: "La paix d'Ubaydallah ibn Abi Bakra avec Rutbil" }
summary:
  ar: "عزل زياد بن أبي سفيان الربيع بن زياد الحارثي وولّى عبيد الله بن أبي بكرة سجستان فغزا فلما كان بزران بعث إليه رتبيل يسأله الصلح عن بلاده وبلاد كابل على ألف ألف ومائتي ألف فأجابه إلى ذلك وسأله أن يهب له مائتي ألف ففعل فتم الصلح على ألف ألف درهم ووفد عبيد الله على زياد فأعلمه ذلك فأمضى الصلح ثم رجع عبيد الله إلى سجستان فأقام بها إلى أن مات زياد."
  en: "Ziyad dismissed al-Rabi' ibn Ziyad and gave Sijistan to Ubaydallah ibn Abi Bakra, who campaigned; at Barzan, Rutbil sent seeking peace for his land and Kabul's at one million two hundred thousand. Ubaydallah consented, and when Rutbil asked that two hundred thousand be waived he agreed — the sulh concluded at a million dirhams. Ubaydallah reported to Ziyad, who ratified it, and he remained in Sijistan until Ziyad's death."
  es: "Ziyad destituyó a al-Rabi' ibn Ziyad y entregó Sijistan a Ubaydallah ibn Abi Bakra, quien emprendió una campaña militar. En Barzan, Rutbil envió a buscar la paz para su tierra y la de Kabul por un millón doscientos mil dirhams. Ubaydallah accedió, y cuando Rutbil pidió que se le condonara la deuda de doscientos mil, aceptó. El acuerdo se cerró por un millón de dirhams. Ubaydallah informó a Ziyad, quien lo ratificó, y permaneció en Sijistan hasta la muerte de Ziyad."
  fr: "Ziyad destitua al-Rabi' ibn Ziyad et confia le Sijistan à Ubaydallah ibn Abi Bakra, qui mena campagne. À Barzan, Rutbil envoya une requête de paix pour son territoire et celui de Kaboul, proposant un montant d'un million deux cent mille dirhams. Ubaydallah y consentit, et lorsque Rutbil demanda une réduction de deux cent mille dirhams, il y consentit également; le traité fut ainsi conclu pour un million de dirhams. Ubaydallah en informa Ziyad, qui le ratifia, et il demeura au Sijistan jusqu'à la mort de Ziyad."
