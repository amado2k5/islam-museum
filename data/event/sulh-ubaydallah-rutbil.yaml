label: { ar: "صلح عبيد الله بن أبي بكرة ورتبيل", en: "Ubaydallah ibn Abi Bakra's Peace with Rutbil" }
summary:
  ar: "عزل زياد بن أبي سفيان الربيع بن زياد الحارثي وولّى عبيد الله بن أبي بكرة سجستان فغزا فلما كان بزران بعث إليه رتبيل يسأله الصلح عن بلاده وبلاد كابل على ألف ألف ومائتي ألف فأجابه إلى ذلك وسأله أن يهب له مائتي ألف ففعل فتم الصلح على ألف ألف درهم ووفد عبيد الله على زياد فأعلمه ذلك فأمضى الصلح ثم رجع عبيد الله إلى سجستان فأقام بها إلى أن مات زياد."
  en: "Ziyad dismissed al-Rabi' ibn Ziyad and gave Sijistan to Ubaydallah ibn Abi Bakra, who campaigned; at Barzan, Rutbil sent seeking peace for his land and Kabul's at one million two hundred thousand. Ubaydallah consented, and when Rutbil asked that two hundred thousand be waived he agreed — the sulh concluded at a million dirhams. Ubaydallah reported to Ziyad, who ratified it, and he remained in Sijistan until Ziyad's death."
