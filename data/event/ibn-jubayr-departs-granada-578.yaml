summary:
  ar: "خرج ابن جبير من غرناطة في صفر سنة 578هـ قاصداً بيت الله الحرام فاجتاز البحر من سبتة وطرابلس الغرب {cite:rihla-ibn-jubayr-1907}."
  en: "In Safar 578/1183 Ibn Jubayr left Granada for the hajj, crossing the sea by way of Ceuta and the west {cite:rihla-ibn-jubayr-1907}."
  ur: "صفر 578ھ میں ابن جبیر غرناطہ سے حج کے لیے نکلا اور سبتہ کے راستے سمندر عبور کیا {cite:rihla-ibn-jubayr-1907}."
  es: "En Safar 578/1183 Ibn Jubayr partió de Granada para el Hajj, cruzando el mar por Ceuta y el oeste {cite:rihla-ibn-jubayr-1907}."
  fr: "En Safar 578/1183, Ibn Jubayr quitta Grenade pour le hajj, traversant la mer par Ceuta et l'ouest {cite:rihla-ibn-jubayr-1907}."
  tr: "İbn Cübeyr, Hicri 578 yılının Safer ayında, Allah'ın Kutsal Evi'ne gitmek amacıyla Granada'dan ayrıldı ve batıdaki Ceuta ve Trablus'tan deniz yoluyla geçti. {cite:rihla-ibn-jubayr-1907}"
  id: "Ibn Jubayr meninggalkan Granada pada bulan Safar tahun 578 H, dengan maksud untuk pergi ke Baitullah, sehingga ia menyeberangi laut dari Ceuta dan Tripoli di sebelah barat {cite:rihla-ibn-jubayr-1907}."
