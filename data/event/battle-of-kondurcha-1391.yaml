  tr: "1391 yılında gerçekleşen Kondorşa Nehri Muharebesi'nin ön anlatımı; bu muharebe, Timur'un Altın Orda Hanı Tokhtamish'e karşı aldığı ilk büyük yenilgidir; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Sungai Kondorsha pada tahun 1391 M, kekalahan besar pertama yang ditimbulkan Timur terhadap Khan dari Gerombolan Emas, Tokhtamish; sumber-sumbernya belum ditinjau di halaman ini."
