significance:
  ar: "من أشهر مشاهد الهجرة؛ ارتبطت عند المسلمين بقوله تعالى «إذ يقول لصاحبه لا تحزن إن الله معنا» (التوبة ٤٠) (الرحيق ص166؛ بخاري 1/516، 1/558)."
