label: { en: "The three nights in the cave of Thawr", ar: "ليالي غار ثور الثلاث" }
summary:
  en: "The Prophet and Abu Bakr hid in the cave of Thawr for the nights of Friday, Saturday and Sunday while Quraysh combed the country offering a hundred camels for each man; their pursuers reached the cave's mouth and turned back."
  ar: "مكث النبي وأبو بكر في غار ثور ثلاث ليالٍ — الجمعة والسبت والأحد — وقريش تطوف البلاد رائجة مائة ناقة عن كل واحد منهما؛ وبلغ المطاردون باب الغار ورجعوا، وكان عبد الله بن أبي بكر ينقل الأخبار وعامر بن فهيرة يعفي الأثر بالغنم."
