label:
  ar: "القادر يحظر التعامل بالدنانير المغربية"
  en: "Al-Qadir bans dealing in Maghrebi dinars"
summary:
  ar: "في سنة سبع وعشرين وأربعمائة تقدّم الخليفة القادر بالله بترك التعامل بالدنانير المغربية — دنانير الدولة العبيدية بمصر — وأمر الشهود ألا يشهدوا في كتاب بيع ولا إجازة ولا مداينة يُذكر فيها هذا الصنف، فعدل الناس إلى الدنانير القادرية والنيسابورية والقاشانية {cite:muntazam-ibn-al-jawzi j.8 p.430}."
  en: "In 427 the caliph al-Qadir ordered an end to dealing in 'Maghrebi' (Fatimid-struck) dinars, and instructed the court witnesses not to attest any deed of sale, licence or loan naming that coin; people accordingly shifted to the Qadiriyya, Nisaburi and Qashani dinars {cite:muntazam-ibn-al-jawzi j.8 p.430}."
