id: event/fatimid-dinar-ban-427
class: event
kind: law-enacted
label:
  ar: "القادر يحظر التعامل بالدنانير المغربية"
  en: "Al-Qadir bans dealing in Maghrebi dinars"
  es: "Al-Qadir prohíbe el comercio con dinares magrebíes."
  fr: "Al-Qadir interdit le commerce des dinars maghrébins"
  ur: "القادر نے مغربی دینار میں لین دین پر پابندی لگا دی۔"
  tr: "El-Kadir, Fas dinarıyla işlem yapılmasını yasaklamıştır."
  id: "Al-Qadir melarang transaksi menggunakan dinar Maroko."
summary:
  ar: "في سنة سبع وعشرين وأربعمائة تقدّم الخليفة القادر بالله بترك التعامل بالدنانير المغربية — دنانير الدولة العبيدية بمصر — وأمر الشهود ألا يشهدوا في كتاب بيع ولا إجازة ولا مداينة يُذكر فيها هذا الصنف، فعدل الناس إلى الدنانير القادرية والنيسابورية والقاشانية {cite:muntazam-ibn-al-jawzi j.8 p.430}."
  en: "In 427 the caliph al-Qadir ordered an end to dealing in 'Maghrebi' (Fatimid-struck) dinars, and instructed the court witnesses not to attest any deed of sale, licence or loan naming that coin; people accordingly shifted to the Qadiriyya, Nisaburi and Qashani dinars {cite:muntazam-ibn-al-jawzi j.8 p.430}."
  es: "En 427, el califa al-Qadir ordenó que se pusiera fin al comercio de dinares 'magrebíes' (acuñados por los fatimíes) e instruyó a los testigos de la corte que no dieran fe de ninguna escritura de venta, licencia o préstamo que mencionara esa moneda; en consecuencia, la gente pasó a utilizar los dinares Qadiriyya, Nisaburi y Qashani {cite:muntazam-ibn-al-jawzi j.8 p.430}."
  fr: "En 427, le calife al-Qadir ordonna la fin du commerce des dinars « maghrébins » (frappés fatimides) et enjoignit aux témoins du tribunal de ne pas attester d'acte de vente, de licence ou de prêt mentionnant cette pièce; les gens passèrent donc aux dinars qadiriyya, nisaburi et qashani {cite:muntazam-ibn-al-jawzi j.8 p.430}."
  ur: "427 میں خلیفہ القادر نے 'مغربی' ⁦(فاطمی زدہ)⁩ دینار میں لین دین کو ختم کرنے کا حکم دیا، اور عدالت کے گواہوں کو ہدایت کی کہ وہ اس سکے کے نام کی فروخت، لائسنس یا قرض کے کسی عمل کی تصدیق نہ کریں۔ اس کے مطابق لوگ قادریہ، نصابوری اور کاشانی دینار کی طرف چلے گئے"
  tr: "Hicri 427 yılında Halife Kadir Billa, Fas dinarlarıyla (Mısır'daki Fatımi devletinin dinarlarıyla) yapılan işlemlerin terk edilmesini emretti ve bu türden dinarların geçtiği hiçbir satış sözleşmesi, yetki belgesi veya kredi belgesinde şahitlik yapmamalarını emretti. Bunun üzerine halk Kadiri, Nişapuri ve Kaşani dinarlarına yöneldi. {cite:muntazam-ibn-al-jawzi j.8 p.430}"
  id: "Pada tahun 427 H, Khalifah al-Qadir Billah memerintahkan penghentian transaksi dengan dinar Maroko — dinar negara Fatimiyah di Mesir — dan memerintahkan saksi untuk tidak memberikan kesaksian dalam kontrak penjualan, otorisasi, atau pinjaman apa pun yang menyebutkan jenis dinar ini. Maka orang-orang beralih ke dinar Qadiri, Nishapuri, dan Kashani. {cite:muntazam-ibn-al-jawzi j.8 p.430}."
