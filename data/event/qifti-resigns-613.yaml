label:
  ar: "القفطي يستقيل عند وفاة الملك الظاهر، ٦١٣هـ"
  en: "Al-Qifti resigns on al-Malik al-Zahir's death, 613/1216"
  ur: "قفطی نے ملک ظاہر کی وفات پر استعفیٰ دیا، 613ھ/1216ء"
summary:
  ar: "لما توفي الملك الظاهر غازي سنة ثلاث عشرة وستمائة استقال القفطي من ديوان المال، ثم أعاده خلف الظاهر الملك العزيز محمد إلى المنصب نفسه بعد ثلاث سنين {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  en: "When al-Malik al-Zahir Ghazi died in 613/1216 al-Qifti resigned; three years later al-Zahir's successor al-Malik al-Aziz Muhammad restored him to the same post {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  ur: "جب 613ھ/1216ء میں ملک ظاہر غازی کا انتقال ہوا تو قفطی نے استعفیٰ دے دیا؛ تین برس بعد ظاہر کے جانشیں ملک عزیز محمد نے انھیں اسی منصب پر بحال کر دیا {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}۔"
