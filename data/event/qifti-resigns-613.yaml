id: event/qifti-resigns-613
class: event
kind: other
label:
  ar: "القفطي يستقيل عند وفاة الملك الظاهر، ٦١٣هـ"
  en: "Al-Qifti resigns on al-Malik al-Zahir's death, 613/1216"
  ur: "قفطی نے ملک ظاہر کی وفات پر استعفیٰ دیا، 613ھ/1216ء"
  es: "Al-Qifti dimite tras la muerte de al-Malik al-Zahir, 613/1216"
  fr: "Al-Qifti démissionne suite à la mort d'al-Malik al-Zahir, 613/1216"
  tr: "El-Kifti, Kral El-Zahir'in ölümünün ardından (Hicri 613) görevinden ayrıldı."
  id: "Al-Qifti mengundurkan diri setelah wafatnya Raja Al-Zahir, 613 H."
summary:
  ar: "لما توفي الملك الظاهر غازي سنة ثلاث عشرة وستمائة استقال القفطي من ديوان المال، ثم أعاده خلف الظاهر الملك العزيز محمد إلى المنصب نفسه بعد ثلاث سنين {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  en: "When al-Malik al-Zahir Ghazi died in 613/1216 al-Qifti resigned; three years later al-Zahir's successor al-Malik al-Aziz Muhammad restored him to the same post {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  ur: "جب 613ھ/1216ء میں ملک ظاہر غازی کا انتقال ہوا تو قفطی نے استعفیٰ دے دیا؛ تین برس بعد ظاہر کے جانشیں ملک عزیز محمد نے انھیں اسی منصب پر بحال کر دیا {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}۔"
  es: "Cuando al-Malik al-Zahir Ghazi murió en 613/1216, al-Qifti renunció; tres años después, el sucesor de al-Zahir, al-Malik al-Aziz Muhammad, lo restituyó en el mismo puesto {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  fr: "Lorsque al-Malik al-Zahir Ghazi mourut en 613/1216, al-Qifti démissionna; trois ans plus tard, le successeur d'al-Zahir, al-Malik al-Aziz Muhammad, le rétablit au même poste {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  tr: "Kral Zahir Gazi 613 Hicri yılında vefat ettiğinde, El-Kifti hazineden istifa etti; daha sonra Zahir'in yerine geçen Kral Aziz Muhammed, üç yıl sonra onu aynı göreve iade etti. {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}"
  id: "Ketika Raja Al-Zahir Ghazi wafat pada tahun 613 H, Al-Qifti mengundurkan diri dari jabatan bendahara, kemudian Raja Al-Aziz Muhammad, yang menggantikan Al-Zahir, mengembalikannya ke posisi yang sama setelah tiga tahun. {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
