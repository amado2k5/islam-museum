id: event/shiraz-wall-abu-kalijar-425
class: event
kind: other
label: { ar: "بناء سور مدينة شيراز في عهد أبي كاليجار البويهي", en: "Abu Kalijar the Buyid builds the wall of Shiraz", es: "Abu Kalijar el Buyid construye la muralla de Shiraz.", fr: "Abou Kalijar le Bouyide construit les murailles de Chiraz", ur: "شیراز کی فصیل ابواللیجر بعید نے تعمیر کی۔", tr: "Ebu Kalijar el-Buveyhi döneminde Şiraz şehir surlarının inşası.", id: "Pembangunan tembok kota Shiraz pada masa pemerintahan Abu Kalijar al-Buwayhi" }
summary:
  ar: "ذكر ابن الأثير في حوادث سنة خمس وعشرين وأربعمائة أن أبا كاليجار البويهي أعاد مَمْدان إلى أملاكه وبنى سور مدينة شيراز، فبلغ طوله اثني عشر ألف ذراع وعرضه ثمانية أذرع وله أحد عشر باباً، وفُرغ من بنائه نحو سنة أربعين وأربعمائة {cite:tarikh-islam-hasan-ibrahim p. 15}."
  en: "Ibn al-Athir records under the events of 425 that the Buyid ruler Abu Kalijar restored Mamdhan's estates and built the wall of the city of Shiraz — twelve thousand cubits long, eight cubits wide, with eleven gates; the work was finished about 440 {cite:tarikh-islam-hasan-ibrahim p. 15}."
  es: "Ibn al-Athir registra, en los sucesos de 425, que el gobernante buyí Abu Kalijar restauró las propiedades de Mamdhan y construyó la muralla de la ciudad de Shiraz, de doce mil codos de largo, ocho codos de ancho y once puertas; la obra se terminó alrededor del año 440 {cite:tarikh-islam-hasan-ibrahim p. 15}."
  fr: "Ibn al-Athir rapporte, à propos des événements de 425, que le souverain bouyide Abu Kalijar a restauré les domaines de Mamdhan et construit le mur de la ville de Shiraz — douze mille coudées de long, huit coudées de large, avec onze portes; les travaux ont été achevés vers 440 {cite:tarikh-islam-hasan-ibrahim p. 15}."
  ur: "ابن الثیر نے 425 کے واقعات کے تحت درج کیا ہے کہ بوید حکمران ابو کلیجار نے مامدان کی جاگیریں بحال کیں اور شیراز شہر کی دیوار تعمیر کی - بارہ ہزار ہاتھ لمبی، آٹھ ہاتھ چوڑی، گیارہ دروازے؛ یہ کام تقریباً 440 میں ختم ہوا {حوالہ:تاریخ اسلام حسن ابراہیم ص۔ 15}۔"
  tr: "İbn el-Athir, Hicri 425 yılındaki olaylarda, Ebu Kalijar el-Buveyhi'nin Mamdan'ı tekrar kendi mülküne kattığını ve Şiraz şehrinin surlarını inşa ettirdiğini belirtmiştir. Surların uzunluğu on iki bin arşın, genişliği sekiz arşın olup on bir kapısı bulunmaktaydı ve yapımı Hicri 440 yılı civarında tamamlanmıştır. {Kaynak:tarikh-islam-hasan-ibrahim s. 15}"
  id: "Ibn al-Athir menyebutkan dalam peristiwa tahun 425 H bahwa Abu Kalijar al-Buwayhi mengembalikan Mamdan ke wilayah kekuasaannya dan membangun tembok kota Shiraz. Panjangnya mencapai dua belas ribu hasta dan lebarnya delapan hasta serta memiliki sebelas gerbang, dan pembangunannya selesai sekitar tahun 440 H {cite:tarikh-islam-hasan-ibrahim p. 15}."
