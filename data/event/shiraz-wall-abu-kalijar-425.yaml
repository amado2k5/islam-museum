summary:
  ar: "ذكر ابن الأثير في حوادث سنة خمس وعشرين وأربعمائة أن أبا كاليجار البويهي أعاد مَمْدان إلى أملاكه وبنى سور مدينة شيراز، فبلغ طوله اثني عشر ألف ذراع وعرضه ثمانية أذرع وله أحد عشر باباً، وفُرغ من بنائه نحو سنة أربعين وأربعمائة {cite:tarikh-islam-hasan-ibrahim p. 15}."
  en: "Ibn al-Athir records under the events of 425 that the Buyid ruler Abu Kalijar restored Mamdhan's estates and built the wall of the city of Shiraz — twelve thousand cubits long, eight cubits wide, with eleven gates; the work was finished about 440 {cite:tarikh-islam-hasan-ibrahim p. 15}."
