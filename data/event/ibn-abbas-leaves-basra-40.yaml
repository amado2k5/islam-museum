label: { ar: "فراق عبد الله بن عباس البصرة", en: "Ibn ʿAbbās quits Basra for Mecca (40 AH)" }
date:
  start: { edtf: "0660", hijri: "0040", calendar: julian, precision: year, status: tradition, derived: true, note: "سنة 40؛ التحويل مشتق {cite:kamil-ibn-al-athir p. 735-736}." }
summary:
  ar: "خرج عبد الله بن عباس من البصرة إلى مكة في قول أكثر أهل السير، وسببه أن أبا الأسود الدؤلي كتب إلى علي يذكر أن ابن عمه أكل ما تحت يديه، فكاتبه علي في ذلك فقال ابن عباس الذي بلغك باطل، فطالبه علي بحساب الجزية فقال ابعث إلى عملك من أحببت فإني ظاعن عنه، واستدعى أخواله من بني هلال بن عامر فاجتمعت معه قيس كلها وحمل مالًا قال هذه أرزاقنا، فتبعه أهل البصرة بالطف يريدون أخذه، فقالت قيس لا يوصل إليه وفينا عين تطرف، وقال صبرة بن شيمان الحداني لأهل البصرة هم لكم خير من المال فانصرف أكثرهم، وقاتلهم بنو تميم فاعتزلهم الأحنف لما لم يقبلوا نهيه، ومضى ابن عباس إلى مكة {cite:kamil-ibn-al-athir p. 735-736}."
  en: "Ibn ʿAbbās left Basra for Mecca — so most sīra men say, against the report that he stayed governor till ʿAli's death. Abū'l-Aswad al-Duʾalī had written to ʿAli that his cousin had consumed what was under his hand; ʿAli demanded the jizya accounts, Ibn ʿAbbās answered «send whom you like to the post, I am leaving», gathered his maternal uncles of Hilāl — all of Qays rallied — and carried off the treasury as «our pay». The Basrans overtook him at al-Ṭaff; Qays swore the money would not be touched while one of them lived; Ṣabra ibn Shaymān persuaded most back («they are worth more to you than the money»), Banū Tamīm fought on until al-Aḥnaf's rebuke fell flat, and Ibn ʿAbbās reached Mecca {cite:kamil-ibn-al-athir p. 735-736}."
