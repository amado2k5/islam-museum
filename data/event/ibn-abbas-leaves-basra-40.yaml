summary:
  ar: "خرج عبد الله بن عباس من البصرة إلى مكة في قول أكثر أهل السير، وسببه أن أبا الأسود الدؤلي كتب إلى علي يذكر أن ابن عمه أكل ما تحت يديه، فكاتبه علي في ذلك فقال ابن عباس الذي بلغك باطل، فطالبه علي بحساب الجزية فقال ابعث إلى عملك من أحببت فإني ظاعن عنه، واستدعى أخواله من بني هلال بن عامر فاجتمعت معه قيس كلها وحمل مالًا قال هذه أرزاقنا، فتبعه أهل البصرة بالطف يريدون أخذه، فقالت قيس لا يوصل إليه وفينا عين تطرف، وقال صبرة بن شيمان الحداني لأهل البصرة هم لكم خير من المال فانصرف أكثرهم، وقاتلهم بنو تميم فاعتزلهم الأحنف لما لم يقبلوا نهيه، ومضى ابن عباس إلى مكة {cite:kamil-ibn-al-athir p. 735-736}."
  en: "Ibn ʿAbbās left Basra for Mecca — so most sīra men say, against the report that he stayed governor till ʿAli's death. Abū'l-Aswad al-Duʾalī had written to ʿAli that his cousin had consumed what was under his hand; ʿAli demanded the jizya accounts, Ibn ʿAbbās answered «send whom you like to the post, I am leaving», gathered his maternal uncles of Hilāl — all of Qays rallied — and carried off the treasury as «our pay». The Basrans overtook him at al-Ṭaff; Qays swore the money would not be touched while one of them lived; Ṣabra ibn Shaymān persuaded most back («they are worth more to you than the money»), Banū Tamīm fought on until al-Aḥnaf's rebuke fell flat, and Ibn ʿAbbās reached Mecca {cite:kamil-ibn-al-athir p. 735-736}."
  es: "Ibn ʿAbbās partió de Basora hacia La Meca —así lo afirman la mayoría de los hombres de la sira, en contra del relato de que permaneció como gobernador hasta la muerte de ʿAli. Abū'l-Aswad al-Duʾalī le había escrito a ʿAli que su primo había consumido lo que estaba bajo su control; ʿAli exigió las cuentas de la jizya, Ibn ʿAbbās respondió «envía a quien quieras al puesto, me voy», reunió a sus tíos maternos de Hilāl —todos los Qays se unieron— y se llevaron el tesoro como «nuestro pago». Los basranos lo alcanzaron en al-Ṭaff; Qays juró que el dinero no sería tocado mientras uno de ellos viviera; Ṣabra ibn Shaymān persuadió a la mayoría para que regresaran («valen más para vosotros que el dinero»), Banū Tamīm siguió luchando hasta que la reprimenda de al-Aḥnaf no surtió efecto, e Ibn ʿAbbās llegó a La Meca {cite:kamil-ibn-al-athir p. 735-736}."
  fr: "Ibn ʿAbbās quitta Bassora pour La Mecque – du moins, c'est ce qu'affirment la plupart des érudits de la Sīra, contrairement à la version selon laquelle il serait resté gouverneur jusqu'à la mort d'ʿAli. Abū'l-Aswad al-Duʾalī avait écrit à ʿAli pour l'informer que son cousin avait dilapidé les biens dont il disposait. ʿAli exigea les comptes de la jizya, et Ibn ʿAbbās répondit: « Envoyez qui vous voulez à ce poste, je m'en vais. » Il rassembla ses oncles maternels de Hilāl – tous les Qays se rallièrent à lui – et emporta le trésor comme « notre solde ». Les habitants de Bassora le rattrapèrent à al-Ṭaff; Qays jura que l'argent ne serait pas touché tant que l'un d'eux serait en vie. Ṣabra ibn Shaymān a persuadé la plupart de revenir («ils valent plus pour vous que l'argent»), Banū Tamīm a continué à se battre jusqu'à ce que la réprimande d'al-Aḥnaf tombe à plat, et Ibn ʿAbbās a atteint La Mecque {cite:kamil-ibn-al-athir p. 735-736}."
  ur: "ابن عباس بصرہ سے مکہ کے لیے روانہ ہوئے - چنانچہ اکثر سیرت والے کہتے ہیں کہ وہ علی کی وفات تک گورنر رہے۔ ابو الاسود الدولی نے علی کو لکھا تھا کہ اس کے چچا زاد بھائی نے جو کچھ اس کے ہاتھ کے نیچے تھا کھا لیا تھا۔ علی نے جزیہ کا حساب طلب کیا، ابن عباس نے جواب دیا \"جسے چاہو پوسٹ پر بھیج دو، میں جا رہا ہوں\"، ہلال کے اپنے ماموں کو جمع کیا - تمام قیس جمع ہوئے - اور \"ہماری تنخواہ\" کے طور پر خزانہ لے گئے۔ بصریوں نے اسے الطف کے مقام پر پکڑ لیا۔ قیس نے قسم کھائی کہ جب تک ان میں سے ایک زندہ رہے گا اس رقم کو ہاتھ نہیں لگایا جائے گا۔ ابرہ بن شمعان نے سب سے زیادہ قائل کیا ⁦(\"وہ آپ کے لیے پیسے سے زیادہ قیمتی ہیں\")⁩، بنو تمیم لڑتا رہا یہاں تک کہ احناف کی ڈانٹ ڈپٹ ہوگئی، اور ابن عباس مکہ پہنچ گئے۔ 735-736}۔"
