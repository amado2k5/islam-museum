label: { ar: "فراق عبد الله بن عباس البصرة", en: "Ibn ʿAbbās quits Basra for Mecca (40 AH)", es: "Ibn ʿAbbās abandona Basora para ir a La Meca (40 AH)", fr: "Ibn ʿAbbās quitte Bassora pour La Mecque (40 AH)", ur: "ابن عباس نے بصرہ چھوڑ کر مکہ جانا ⁦(40ھ)⁩" }
date:
