id: event/abu-al-qasims-verse-to-hamdan-and-the-hamstringing-of-ibn-al-dahhaks-mare-286
class: event
kind: other
label:
  ar: قصيدة أبي القاسم لهمدان وعقر فرس ابن الضحاك، 286هـ
  en: Abu al-Qasim's verse to Hamdan and the hamstringing of Ibn al-Dahhak's mare, 286 AH
  ur: ابو القاسم کا ہمدان کے نام قصیدہ اور ابن ضحاک کی گھوڑی کا عقر، 286ھ
summary:
  ar: يرسل أبو القاسم إلى همدان شعراً يذكّرهم فيه بفضل الله عليهم بنصر آل الرسول وتقدّمهم مع علي يوم صفين، ويدعوهم إلى ترك التضليل وطرد العبيد، فتجتمع بنو معمر وتتشاور وتعلم أن لا طاقة لها بالهادي فتأمر بعض سفهائها بعقر فرس ابن الضحاك فيعقرها بالليل.
  en: Abu al-Qasim sends Hamdan verse recalling God's favour in their helping the Messenger's family and their place with Ali at Siffin, and calling them from error and to drive out the slaves; Banu Ma'mar meet, take counsel, know they cannot face al-Hadi and tell one of their foolish men to hamstring Ibn al-Dahhak's mare, which he does by night.
  ur: ابو القاسم ہمدان کو اشعار بھیجتے ہیں جن میں آل رسول کی مدد پر ان پر اللہ کے فضل اور صفین میں علی کے ساتھ ان کے مقام کا ذکر ہے اور انہیں گمراہی چھوڑنے اور غلاموں کو نکالنے کی دعوت ہے؛ بنو معمر جمع ہو کر مشورہ کرتے ہیں، جان لیتے ہیں کہ ہادی کے سامنے ان کی طاقت نہیں اور اپنے ایک بیوقوف کو ابن ضحاک کی گھوڑی کا عقر کرنے کا کہتے ہیں اور وہ رات کو ایسا کر دیتا ہے۔
