summary:
  ar: "يخرج القاسم بن أحمد من وروَر ليلة الأربعاء لثلاث باقية من ربيع الآخر سنة 325هـ، فيصل إلى بلد بني ربيعة، ويعود بعد ذلك إلى وروَر."
  en: "Al-Qasim ibn Ahmad leaves Warwar on the night of Wednesday, three days before the end of Rabi II 325 AH, and reaches the land of Banu Rabi'a. He later returns to Warwar."
  ur: "قاسم بن احمد ربیع الآخر 325ھ کے آخر سے تین دن پہلے بدھ کی رات وروَر سے نکل کر بنی ربیعہ کے علاقے پہنچتا ہے، اور بعد میں وروَر واپس آتا ہے۔"
  es: "Al-Qasim ibn Ahmad abandona Warwar la noche del miércoles, tres días antes del final de Rabi II del año 325 de la Hégira, y llega a la tierra de Banu Rabi'a. Posteriormente regresa a Warwar."
