id: "event/al-qasim-ibn-ahmad-moves-to-banu-rabia-after-warwar-in-rabi-ii-325-ah"
class: event
kind: other
label:
  ar: "ينتقل القاسم بن أحمد من وروَر إلى بلد بني ربيعة في ربيع الآخر سنة 325هـ، ص409"
  en: "Al-Qasim ibn Ahmad moves from Warwar to the land of Banu Rabi'a in Rabi II 325 AH, p. 409"
  ur: "قاسم بن احمد ربیع الآخر 325ھ میں وروَر سے بنی ربیعہ کے علاقے کی طرف جاتا ہے، ص409"
  es: "Al-Qasim ibn Ahmad se traslada de Warwar a la tierra de Banu Rabi'a en Rabi II 325 AH, pág. 409."
  fr: "Al-Qasim ibn Ahmad quitte Warwar pour le pays des Banu Rabi'a en Rabi II 325 AH, p. 409"
  tr: "Al-Qasim ibn Ahmad, Hicri 325 yılının Rabi' al-Thani ayında Warwar'dan Beni Rabi'ah topraklarına göç etti (s. 409)."
  id: "Al-Qasim ibn Ahmad pindah dari Warwar ke tanah Bani Rabi'ah pada bulan Rabi' al-Thani tahun 325 H, hlm. 409"
summary:
  ar: "يخرج القاسم بن أحمد من وروَر ليلة الأربعاء لثلاث باقية من ربيع الآخر سنة 325هـ، فيصل إلى بلد بني ربيعة، ويعود بعد ذلك إلى وروَر."
  en: "Al-Qasim ibn Ahmad leaves Warwar on the night of Wednesday, three days before the end of Rabi II 325 AH, and reaches the land of Banu Rabi'a. He later returns to Warwar."
  ur: "قاسم بن احمد ربیع الآخر 325ھ کے آخر سے تین دن پہلے بدھ کی رات وروَر سے نکل کر بنی ربیعہ کے علاقے پہنچتا ہے، اور بعد میں وروَر واپس آتا ہے۔"
  es: "Al-Qasim ibn Ahmad abandona Warwar la noche del miércoles, tres días antes del final de Rabi II del año 325 de la Hégira, y llega a la tierra de Banu Rabi'a. Posteriormente regresa a Warwar."
  fr: "Al-Qasim ibn Ahmad quitte Warwar dans la nuit du mercredi, trois jours avant la fin du mois de Rabi II 325 AH, et atteint le pays des Banu Rabi'a. Il retourne ensuite à Warwar."
  tr: "El-Kasım bin Ahmed, Hicri 325 yılının Rebiü'l-Sani ayının bitimine üç gün kala Çarşamba gecesi Warwar'dan ayrılır ve Beni Rabi'ah topraklarına varır, ardından Warwar'a geri döner."
  id: "Al-Qasim bin Ahmad meninggalkan Warwar pada Rabu malam, tiga hari sebelum akhir Rabi’ al-Thani, 325 H, dan tiba di tanah Bani Rabi’ah, lalu kembali ke Warwar."
