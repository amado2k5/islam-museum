label: { ar: "خبر الخرّيت بن راشد وبني ناجية", en: "Al-Khirit ibn Rashid's revolt (38–39 AH)", es: "La revuelta de Al-Khirit ibn Rashid (38-39 d. H.)", fr: "La révolte d'Al-Khirit ibn Rashid (38-39 AH)", ur: "الخریت بن راشد کی بغاوت ⁦(38-39ھ)⁩", tr: "El-Kharit bin Rashid ve Bani Najiyah'ın hikayesi", id: "Kisah Al-Kharit bin Rasyid dan Bani Najiyah" }
summary:
  ar: "فارق الخرّيت بن راشد الناجي علياً بعد النهروان، فلما سئله زياد بن خصفة ما الذي نقمت على أمير المؤمنين قال: لم أرضَ صاحبكم إماماً ولا سيرتكم سيرة، فرأيت أن أعتزل وأكون مع من يدعو إلى الشورى؛ فاقتتلوا قتالاً شديداً تطاعنوا بالرماح حتى لم يبق رمح وتضاربوا بالسيوف حتى انحنت وعقرت عامة خيولهم، فجاء الليل فحجز بينهما وجُرح زياد وسار الخرّيت من الليل إلى الأهواز، فاجتمع عليه الناجية وعلوج من أهل الأهواز أرادوا كسر الخراج فصاروا نحو مائتين، فقال معقل بن قيس لعلي: كان ينبغي أن يكون مع من يطلب هؤلاء مكان كل واحد منهم عشرة، فندب علي معه ألفين وكتب إلى ابن عباس يبعث مثله، فلما استحكم القتال قال الخرّيت لمن معه: قاتلوا عن حريمكم وأولادكم {cite:kamil-ibn-al-athir p. 715-716}."
  en: "The Najid Khariji who walked out on Ali after Nahrawan — 'your man's imamate and your conduct alike displease me; I side with those who call for shura'. His night-battle with Ziyad ibn Khasafa bent swords and hamstrung horses; he drew the Banu Najiya and Ahwazi tax-resisters around him until Ma'qil ibn Qays's four-thousand-man expedition demanded 'ten for every one of them' {cite:kamil-ibn-al-athir p. 715-716}."
  es: "El Najid Khariji que abandonó a Ali después de Nahrawan: «Tanto el imamato de tu hombre como tu conducta me desagradan; me pongo del lado de quienes piden una shura». Su batalla nocturna con Ziyad ibn Khasafa dobló espadas y dejó a los caballos paralizados; atrajo a los Banu Najiya y a los Ahwazi que se negaban a pagar impuestos a su alrededor hasta que la expedición de cuatro mil hombres de Ma'qil ibn Qays exigió «diez por cada uno de ellos» {cite:kamil-ibn-al-athir p. 715-716}."
  fr: "Le Najid Khariji qui abandonna Ali après Nahrawan: « L’imamat de ton homme et ta conduite me déplaisent autant; je me range du côté de ceux qui appellent à la shura. » Son combat nocturne contre Ziyad ibn Khasafa brisa les épées et blessa les chevaux; il attira autour de lui les Banu Najiya et les réfractaires à l’impôt Ahwazi jusqu’à ce que l’expédition de quatre mille hommes de Ma’qil ibn Qays exige « dix pour chacun d’eux » {cite: kamil-ibn-al-athir p. 715-716}."
  ur: "نجد خارجی جو نہروان کے بعد علی پر نکلا تھا - 'تمہارے آدمی کی امامت اور تمہارا طرز عمل یکساں مجھے ناراض کرتا ہے۔ میں ان کا ساتھ دیتا ہوں جو شوری کا مطالبہ کرتے ہیں۔ زیاد بن خصافہ کے ساتھ اس کی رات کی لڑائی جھکی ہوئی تلواریں اور کٹے ہوئے گھوڑوں؛ اس نے بنو ناجیہ اور اہوازی ٹیکس کے خلاف مزاحمت کرنے والوں کو اپنے ارد گرد کھینچ لیا یہاں تک کہ معقل بن قیس کی چار ہزار افراد پر مشتمل مہم نے ان میں سے ہر ایک کے بدلے دس کا مطالبہ کیا۔ 715-716}۔"
  tr: "Nahravan'dan sonra El-Kharit ibn Raşid el-Neci, Ali'nin yanından ayrıldı. Ziyad ibn Hasef, ona Müminlerin Emiri'nde neyi onaylamadığını sorduğunda, şöyle dedi: \"İmam olarak önderinizi ve davranışlarınızı onaylamadım. Bu yüzden geri çekilip istişare edenlerin yanında olmam gerektiğine karar verdim.\" Şiddetli bir savaş verdiler, mızraklar bitene kadar mızraklarla saldırdılar, kılıçlar bükülene kadar çarpıştılar ve atlarının çoğu sakat kaldı. Sonra gece çöktü ve onları ayırdı, Ziyad yaralandı. El-Kharit geceleyin Ahvaz'a gitti ve vergiyi kırmak isteyen Neciyye ve Ahvaz halkı ona karşı toplandı; sayıları iki yüz kadardı. Ma'kal ibn Kays, Ali'ye şöyle dedi: \"Bunları kovalayanların her biri için onar adamı olsun.\" Bunun üzerine Ali yanına iki bin adam çağırdı ve İbn Abbas'a da aynı sayıda adam göndermesini yazdı. Çatışmalar şiddetlendiğinde, el-Harit yanındakilere şöyle dedi: \"Kadınlarınız ve çocuklarınız için savaşın.\" {cite:kamil-ibn-al-athir s. 715-716}"
  id: "Al-Kharit ibn Rashid al-Naji meninggalkan Ali setelah Nahrawan. Ketika Ziyad ibn Khasfa bertanya kepadanya apa yang tidak disetujuinya pada Amirul Mukminin, ia berkata: Aku tidak menyetujui pemimpinmu sebagai seorang imam, dan juga tidak menyetujui perilakumu. Maka aku memutuskan untuk mundur dan bergabung dengan mereka yang menyerukan musyawarah. Mereka bertempur sengit, saling menusukkan tombak hingga tak ada satu tombak pun yang tersisa, dan saling beradu pedang hingga pedang-pedang itu bengkok, dan sebagian besar kuda mereka lumpuh. Kemudian malam tiba dan memisahkan mereka, dan Ziyad terluka. Al-Kharit pergi pada malam hari ke Ahwaz, dan kaum Najiyya dan penduduk Ahwaz yang ingin menghindari pajak berkumpul melawannya, dan jumlah mereka sekitar dua ratus orang. Ma’qal ibn Qays berkata kepada Ali: Mereka yang mengejar orang-orang ini hendaknya memiliki sepuluh orang untuk masing-masing dari mereka. Maka Ali memanggil dua ribu orang bersamanya dan menulis surat kepada Ibnu Abbas untuk mengirimkan jumlah yang sama. Ketika pertempuran semakin sengit, al-Kharit berkata kepada orang-orang yang bersamanya: Berperanglah demi wanita dan anak-anak kalian. {cite:kamil-ibn-al-athir p.715-716}"
