summary:
  ar: "فارق الخرّيت بن راشد الناجي علياً بعد النهروان، فلما سئله زياد بن خصفة ما الذي نقمت على أمير المؤمنين قال: لم أرضَ صاحبكم إماماً ولا سيرتكم سيرة، فرأيت أن أعتزل وأكون مع من يدعو إلى الشورى؛ فاقتتلوا قتالاً شديداً تطاعنوا بالرماح حتى لم يبق رمح وتضاربوا بالسيوف حتى انحنت وعقرت عامة خيولهم، فجاء الليل فحجز بينهما وجُرح زياد وسار الخرّيت من الليل إلى الأهواز، فاجتمع عليه الناجية وعلوج من أهل الأهواز أرادوا كسر الخراج فصاروا نحو مائتين، فقال معقل بن قيس لعلي: كان ينبغي أن يكون مع من يطلب هؤلاء مكان كل واحد منهم عشرة، فندب علي معه ألفين وكتب إلى ابن عباس يبعث مثله، فلما استحكم القتال قال الخرّيت لمن معه: قاتلوا عن حريمكم وأولادكم {cite:kamil-ibn-al-athir p. 715-716}."
  en: "The Najid Khariji who walked out on Ali after Nahrawan — 'your man's imamate and your conduct alike displease me; I side with those who call for shura'. His night-battle with Ziyad ibn Khasafa bent swords and hamstrung horses; he drew the Banu Najiya and Ahwazi tax-resisters around him until Ma'qil ibn Qays's four-thousand-man expedition demanded 'ten for every one of them' {cite:kamil-ibn-al-athir p. 715-716}."
