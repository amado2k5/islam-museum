label:
  ar: "همايون يستعيد لاهور، ربيع الآخر ٩٦٢هـ/فبراير ١٥٥٥م"
  en: "Humayun reoccupies Lahore, Rabi' II 962/February 1555"
  ur: "ہمایوں کا لہور پر دوبارہ قبضہ، ربیع الثانی 962ھ/فروری 1555ء"
summary:
  ar: "بعد نحو خمس عشرة سنة من الحكم الأفغاني لشير شاه سوري وخلفائه، استعاد همايون لاهور في ربيع الآخر ٩٦٢هـ/فبراير ١٥٥٥م، فعادت المدينة إلى الحكم المغولي ودخلت أزهى عصورها {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  en: "After some fifteen years of Afghan rule under Shir Shah Suri and his successors, Humayun reoccupied Lahore in Rabi' II 962/February 1555, returning the city to Mughal rule and ushering in the era of its greatest prosperity {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  ur: "شیر شاہ سوری اور اس کے جانشینوں کی تقریباً پندرہ سالہ افغان حکمرانی کے بعد ہمایوں نے ربیع الثانی 962ھ/فروری 1555ء میں لہور پر دوبارہ قبضہ کیا، جس سے شہر دوبارہ مغل حکمرانی میں آیا اور اس کے عروج کا دور شروع ہوا {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
