label: { ar: "عصيان المهدية على الموحدين", en: "The Mahdiyya revolt (594–595 AH)", es: "La revuelta Mahdiyya (594-595 d. H.)", fr: "La révolte du Mahdiyya (594-595 AH)", ur: "مہدیہ بغاوت ⁦(594-595ھ)⁩", tr: "Mehdistlerin Elmohadlara karşı isyanı", id: "Pemberontakan Mahdist melawan Almohads" }
summary:
  ar: "كان أبو يوسف يعقوب المنصور لما عاد من إفريقية ولّى أبا سعيد عثمان تونس وأخاه أبا علي يونس بن عمر اينتي المهدية، وجعل قائد الجيش بالمهدية محمد بن عبد الكريم وهو شجاع مشهور عظمت نكايته في العرب؛ فلما أخذ لعرب من بني عوف فروا منه مالهم وعيالهم واستجار بنو عوف بأبي سعيد فأمره برد النعم فأغلظ له وأراد أن يبطش به، فعاد محمد إلى المهدية خائفاً فحالف أصحابه وقبض على الوالي أبي علي يونس وتغلب على المدينة، فأطلقه على اثني عشر ألف دينار وزعها في الجند، وحالف علي بن إسحاق الملثم ابن غانية فامتنع أبو سعيد من قصده؛ فلما مات يعقوب وولي ابنه محمد الناصر سيّر عسكراً في البحر وعسكراً في البر فهرب الملثم ومن معه إلى الصحراء، فلما وصل الأسطول المهدية قال محمد بن عبد الكريم: أنا على طاعة أمير المؤمنين محمد ولا أسلمها إلى أبي سعيد وإنما أسلمها إلى من يرسله أمير المؤمنين، فأرسل من تسلمها منه وعاد إلى الطاعة {cite:kamil-ibn-al-athir p. 259-260}."
  en: "The Almohad field-commander Muhammad ibn Abd al-Karim — terror of the Arabs of Ifriqiya — fell out with the vizier Abu Sa'id ibn Umar Inti over the Banu Awf captives, seized Mahdiyya, ransomed the governor for twelve thousand dinars, and allied with Ibn Ghaniya; when al-Mansur died, the new caliph Muhammad al-Nasir's sea and land armies came, Ibn Ghaniya fled to the desert, and Ibn Abd al-Karim answered the fleet: 'I obey the Commander of the Faithful Muhammad — I will only hand it to whom he sends' {cite:kamil-ibn-al-athir p. 259-260}."
  es: "El comandante de campo almohade Muhammad ibn Abd al-Karim —terror de los árabes de Ifriqiya— se enemistó con el visir Abu Sa'id ibn Umar Inti por los cautivos de Banu Awf, se apoderó de Mahdiyya, rescató al gobernador por doce mil dinares y se alió con Ibn Ghaniya; cuando al-Mansur murió, llegaron los ejércitos terrestres y marítimos del nuevo califa Muhammad al-Nasir, Ibn Ghaniya huyó al desierto e Ibn Abd al-Karim respondió a la flota: 'Obedezco al Comandante de los Creyentes Muhammad; solo se lo entregaré a quien él envíe' {cite:kamil-ibn-al-athir p. 259-260}."
  fr: "Le commandant almohade Muhammad ibn Abd al-Karim — terreur des Arabes d'Ifriqiya — se brouilla avec le vizir Abu Sa'id ibn Umar Inti au sujet des captifs Banu Awf, s'empara de Mahdiyya, racheta le gouverneur pour douze mille dinars et s'allia avec Ibn Ghaniya; lorsque al-Mansur mourut, les armées terrestres et maritimes du nouveau calife Muhammad al-Nasir arrivèrent, Ibn Ghaniya s'enfuit dans le désert et Ibn Abd al-Karim répondit à la flotte: « J'obéis au Commandeur des Croyants Muhammad — je ne la remettrai qu'à celui qu'il m'enverra » {cite: kamil-ibn-al-athir p. 259-260}."
  ur: "الموحد فیلڈ کمانڈر محمد بن عبد الکریم - عفریقیہ کے عربوں کی دہشت - بنو عوف کے اسیروں پر وزیر ابو سعید بن عمر انطی کے ساتھ گرا، مہدیہ پر قبضہ کر لیا، گورنر کو بارہ ہزار دینار کا تاوان دیا، اور ابن غانیہ کے ساتھ اتحاد کیا۔ جب المنصور کا انتقال ہوا تو نئے خلیفہ محمد الناصر کی سمندری اور زمینی فوجیں آئیں، ابن غنیہ صحرا کی طرف بھاگا، اور ابن عبد الکریم نے بیڑے کو جواب دیا: 'میں وفادار محمد کے سپہ سالار کی اطاعت کرتا ہوں - میں اسے صرف اس کے حوالے کروں گا جسے وہ بھیجے گا'۔ 259-260}۔"
  tr: "Ebu Yusuf Yakub el-Mansur İfrikiye'den döndüğünde, Ebu Said Osman'ı Tunus valiliğine, kardeşi Ebu Ali Yunus ibn Ömer'i ise Mehdi valiliğine atadı. Mehdi ordusunun komutanlığına Muhammed ibn Abdülkerim'i getirdi; o, Araplara karşı yaptığı saldırılarla ünlü, cesur bir adamdı. Beni Avf kabilesinden mallarını ele geçirdiğinde, kabile üyeleri malları ve aileleriyle birlikte ondan kaçtılar ve Ebu Said'e sığındılar. Ebu Said ona malları geri vermesini emretti, ancak Ebu Said ona sert davrandı ve ona saldırmak istedi. Bunun üzerine Muhammed korku içinde Mehdi'ye döndü, arkadaşlarıyla ittifak kurarak vali Ebu Ali Yunus'u yakaladı ve şehri ele geçirdi. Onu on iki bin dinar karşılığında serbest bıraktı ve bu parayı askerler arasında dağıttı. Ali ibn İshak el-Mulatham ibn Ganiye ile ittifak kurduğu için Ebu Said ona gitmekten vazgeçti. Yakub öldüğünde ve oğlu Muhammed el-Nasır yönetimi devraldığında, denizden ve karadan birer ordu gönderdi. El-Mulatham ve yanındakiler çöle kaçtılar. Filo Mehdi'ye ulaştığında, Muhammed ibn Abd el-Karim şöyle dedi: \"Ben Müminlerin Emiri Muhammed'e itaat ediyorum ve onu Ebu Said'e teslim etmeyeceğim, Müminlerin Emiri kimi gönderirse ona teslim edeceğim.\" Bunun üzerine birini gönderdi, o kişi orduyu ondan aldı ve tekrar itaat etti. {Kaynak: Kamil ibn el-Atir s. 259-260}"
  id: "Ketika Abu Yusuf Yaqub al-Mansur kembali dari Ifriqiya, ia mengangkat Abu Saeed Uthman sebagai gubernur Tunis dan saudaranya Abu Ali Yunus ibn Umar sebagai gubernur Mahdia. Ia menjadikan Muhammad ibn Abd al-Karim sebagai komandan pasukan di Mahdia, dan ia adalah seorang pemberani terkenal yang serangannya terhadap bangsa Arab sangat hebat. Ketika ia merebut harta benda bangsa Arab dari Bani Awf, mereka melarikan diri darinya bersama harta dan keluarga mereka, dan Bani Awf mencari perlindungan kepada Abu Saeed. Ia memerintahkannya untuk mengembalikan harta benda tersebut, tetapi Abu Saeed berbicara kasar kepadanya dan ingin menyerangnya. Maka Muhammad kembali ke Mahdia dalam ketakutan, lalu ia bersekutu dengan para sahabatnya dan menangkap gubernur Abu Ali Yunus serta menguasai kota tersebut. Ia membebaskannya dengan syarat dua belas ribu dinar, yang kemudian dibagikan kepada para prajurit. Ia bersekutu dengan Ali ibn Ishaq al-Mulatham ibn Ghaniya, sehingga Abu Saeed menahan diri untuk tidak pergi kepadanya. Ketika Yaqub wafat dan putranya Muhammad al-Nasir mengambil alih, ia mengirimkan pasukan melalui laut dan pasukan melalui darat. Al-Mulatham dan orang-orang yang bersamanya melarikan diri ke padang pasir. Ketika armada mencapai Mahdia, Muhammad ibn Abd al-Karim berkata: Aku taat kepada Amirul Mukminin, Muhammad, dan aku tidak akan menyerahkannya kepada Abu Saeed, tetapi aku akan menyerahkannya kepada siapa pun yang diutus oleh Amirul Mukminin. Maka ia mengutus seseorang yang mengambilnya darinya dan kembali taat. {cite:kamil-ibn-al-athir p. 259-260}."
