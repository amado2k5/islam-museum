summary:
  ar: "في سنة إحدى وعشرين وستمائة عادت التتار من بلاد القفجاق ووصلوا إلى الرى، وكان من سلم من أهلها قد تراجعوا إليها فما شعروا إلا بالتتار قد أحاطوا بهم فقتلوا وسبوا، ثم ساروا إلى قم وقاشان فنابذوهما، ثم عطفوا إلى همدان فقتلوا وفظعوا، ثم ساروا إلى تبريز فوقع بينهم وبين الخوارزمية مصاف {cite:shadharat-dhahab p. 95}."
  en: "In 621 the Tatars returned from the Qipchaq lands to Rayy; the survivors who had drifted back found the Tatars upon them — killing and enslaving — then Qum and Kashan were sacked, Hamadan massacred, and at Tabriz they fought a set battle with the Khwarazmians {cite:shadharat-dhahab p. 95}."
