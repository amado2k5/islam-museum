label: { ar: "عودة التتار إلى الرى وهمدان سنة 621", en: "The Tatars Return to Rayy and Hamadan in 621 AH", es: "Los tártaros regresan a Rayy y Hamadán en el año 621 d. C.", fr: "Les Tatars retournent à Rayy et Hamadan en 621 AH", ur: "تاتاری 621 ہجری میں رے اور ہمدان واپس آئے" }
summary:
  ar: "في سنة إحدى وعشرين وستمائة عادت التتار من بلاد القفجاق ووصلوا إلى الرى، وكان من سلم من أهلها قد تراجعوا إليها فما شعروا إلا بالتتار قد أحاطوا بهم فقتلوا وسبوا، ثم ساروا إلى قم وقاشان فنابذوهما، ثم عطفوا إلى همدان فقتلوا وفظعوا، ثم ساروا إلى تبريز فوقع بينهم وبين الخوارزمية مصاف {cite:shadharat-dhahab p. 95}."
  en: "In 621 the Tatars returned from the Qipchaq lands to Rayy; the survivors who had drifted back found the Tatars upon them — killing and enslaving — then Qum and Kashan were sacked, Hamadan massacred, and at Tabriz they fought a set battle with the Khwarazmians {cite:shadharat-dhahab p. 95}."
  es: "En 621, los tártaros regresaron de las tierras de Qipchaq a Rayy; los supervivientes que habían regresado encontraron a los tártaros sobre ellos, matándolos y esclavizándolos; luego, Qum y Kashan fueron saqueadas, Hamadán masacrada, y en Tabriz libraron una batalla campal con los khwarazmianos {cite:shadharat-dhahab p. 95}."
  fr: "En 621, les Tatars revinrent des terres Qipchaq à Rayy; les survivants qui étaient revenus par la dérive trouvèrent les Tatars sur eux — tuant et réduisant en esclavage — puis Qum et Kashan furent pillées, Hamadan massacrée, et à Tabriz, ils livrèrent une bataille rangée contre les Khwarezmiens {cite:shadharat-dhahab p. 95}."
  ur: "621 میں تاتاری کیپچاق سرزمین سے رے واپس آئے۔ زندہ بچ جانے والے جو پیچھے ہٹ گئے تھے انہوں نے تاتاریوں کو ان پر پایا - قتل اور غلامی - پھر قم اور کاشان کو برطرف کردیا گیا، ہمدان کا قتل عام کیا گیا، اور تبریز میں خوارزمیوں کے ساتھ ایک معرکہ آرائی کی گئی۔ 95}۔"
