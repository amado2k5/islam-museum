summary:
  ar: "وقعة وادي قرميسين سنة 377هـ؛ لما استقر مشرف الدولة بن ركن الدولة ببغداد كان قائده قراتكين الجهشاري مدلاً عليه متحكماً في دولته، فثقل ذلك على مشرف الدولة فجهزه في العساكر لقتال بدر بن حسنويه الكردي يروم إحدى الراحتين، فلقيه بوادي قرميسين وانهزم بدر حتى توارى فنزلوا في خيامه، ثم كر بدر فأعجلهم عن الركوب وفتك فيهم واحتوى على ما معهم، ونجا قراتكين في فل إلى جسر النهروان، واستولى بدر على أعمال الجبل واستفحل أمره."
  en: "The battle of Wadi Qarmasin, 377 AH; when Musharrif al-Dawla ibn Rukn al-Dawla settled in Baghdad his commander Qaratikin al-Juhshari grew overweening in the state, so he dispatched the army against Badr ibn Hasanwayh the Kurd hoping to be rid of one of them — Badr fled until they slackened in their tents, then wheeled back, cut them off from their mounts and slaughtered them, taking their baggage; Qaratikin escaped in flight to the Nahrawan bridge while Badr seized the Jibal's districts and his power swelled."
  fr: "La bataille du Wadi Qarmasin, 377 H ; quand Musharrif al-Dawla ibn Rukn al-Dawla s'établit à Bagdad, son commandant Qaratikin al-Juhshari prit trop d'ascendant dans l'État ; il envoya donc l'armée contre Badr ibn Hasanwayh le Kurde, espérant être débarrassé de l'un d'eux ; Badr s'enfuit jusqu'à ce qu'ils se relâchent dans leurs tentes, puis fit volte-face, les coupa de leurs montures et les massacra, s'emparant de leurs bagages ; Qaratikin s'échappa en fuyant jusqu'au pont de Nahrawan, tandis que Badr s'emparait des districts du Jibal et que sa puissance grandissait."
  es: "La batalla de Wadi Qarmasin, 377 AH; cuando Musharrif al-Dawla ibn Rukn al-Dawla se estableció en Bagdad, su comandante Qaratikin al-Juhshari se volvió arrogante en el estado, por lo que envió al ejército contra Badr ibn Hasanwayh el kurdo con la esperanza de deshacerse de uno de ellos. Badr huyó hasta que se relajaron en sus tiendas, luego regresó, los separó de sus monturas y los masacró, llevándose su equipaje; Qaratikin escapó huyendo hacia el puente de Nahrawan mientras Badr se apoderaba de los distritos de Jibal y su poder crecía."
  ur: "جنگ وادی قرمصین، 377ھ۔ جب مشرف الدولہ ابن رکن الدولہ بغداد میں مقیم ہوا تو اس کا کمانڈر قراتقین الجوشری ریاست میں بہت زیادہ بڑھتا گیا، چنانچہ اس نے بدر بن حسنویح کے خلاف کردوں کو اس امید پر روانہ کیا کہ وہ ان میں سے کسی ایک سے چھٹکارا پا لیں گے، بدر بھاگ گیا یہاں تک کہ وہ ان کی کمر سے کٹ گئے، پھر ان کی کمر کاٹ دی گئی۔ ان کو ذبح کیا، ان کا سامان لے کر۔ قراتکین بھاگتے ہوئے نہروان پل کی طرف بھاگا جبکہ بدر نے جبل کے اضلاع پر قبضہ کر لیا اور اس کی طاقت بڑھ گئی۔"
  tr: "Hicri 377 yılında Vadi Karmisin Muharebesi; Muşrif el-Davla bin Rukn el-Davla Bağdat'a yerleştiğinde, komutanı Karatakin el-Cahşari ona borçluydu ve devletini kontrol ediyordu. Bu durum Muşrif el-Davla'yı çok rahatsız etti, bu yüzden iki teselliden birini arayarak Bedir bin Hasnaveyh el-Kurdi ile savaşmak için askerlerini hazırladı. Böylece Vadi Karmisin'de Bedir ile karşılaştılar ve Bedir yenilgiye uğratılıp ortadan kayboldu. Bunun üzerine Bedir'in çadırlarında kamp kurdular. Bedir saldırdı, onları at binemez hale getirdi, öldürdü ve mallarını aldı. Karatakin bir grupla birlikte Nahravan köprüsüne kaçtı ve Bedir dağlık bölgelerin kontrolünü ele geçirerek gücünü artırdı."
  id: "Pertempuran Wadi Qarmisin pada tahun 377 H; ketika Mushrif al-Dawla bin Rukn al-Dawla menetap di Baghdad, komandannya Qaratakin al-Jahshari berhutang budi kepadanya dan mengendalikan negaranya, dan ini sangat membebani Mushrif al-Dawla, sehingga ia mempersiapkan pasukannya untuk melawan Badr bin Hasnawayh al-Kurdi, mencari salah satu dari dua keuntungan, maka ia bertemu dengannya di Wadi Qarmisin dan Badr dikalahkan hingga ia menghilang, lalu mereka berkemah di tenda-tendanya, kemudian Badr menyerang dan membuat mereka tidak dapat berkuda, dan ia membunuh mereka dan mengambil semua yang mereka miliki, dan Qaratakin melarikan diri bersama-sama ke jembatan Nahrawan, dan Badr menguasai wilayah pegunungan dan kekuasaannya semakin besar."
