label:
  ar: وقعة وادي قرميسين
  en: Battle of Wadi Qarmasin
summary:
  ar: "وقعة وادي قرميسين سنة 377هـ؛ لما استقر مشرف الدولة بن ركن الدولة ببغداد كان قائده قراتكين الجهشاري مدلاً عليه متحكماً في دولته، فثقل ذلك على مشرف الدولة فجهزه في العساكر لقتال بدر بن حسنويه الكردي يروم إحدى الراحتين، فلقيه بوادي قرميسين وانهزم بدر حتى توارى فنزلوا في خيامه، ثم كر بدر فأعجلهم عن الركوب وفتك فيهم واحتوى على ما معهم، ونجا قراتكين في فل إلى جسر النهروان، واستولى بدر على أعمال الجبل واستفحل أمره."
  en: "The battle of Wadi Qarmasin, 377 AH; when Musharrif al-Dawla ibn Rukn al-Dawla settled in Baghdad his commander Qaratikin al-Juhshari grew overweening in the state, so he dispatched the army against Badr ibn Hasanwayh the Kurd hoping to be rid of one of them — Badr fled until they slackened in their tents, then wheeled back, cut them off from their mounts and slaughtered them, taking their baggage; Qaratikin escaped in flight to the Nahrawan bridge while Badr seized the Jibal's districts and his power swelled."
