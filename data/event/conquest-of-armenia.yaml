summary:
  ar: "بطاقة أولية للفتح الإسلامي لأرمينية، حملات حبيب بن مسلمة وإياد بن غنم التي ضمت أرمنية إلى الدولة الراشدة والأموية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Arab conquest of Armenia, the campaigns of Habib ibn Maslama and Iyad ibn Ghanm that joined Arminiya to the Rashidun and Umayyad state; its sources are not yet checked on the page."
  es: "Boceto de ficha para la conquista árabe de Armenia, las campañas de Habib ibn Maslama e Iyad ibn Ghanm que unieron Arminiya al estado Rashidun y Omeya; sus fuentes aún no han sido verificadas en la página."
  fr: "Projet de fiche pour la conquête arabe de l'Arménie, les campagnes de Habib ibn Maslama et Iyad ibn Ghanm qui ont joint l'Arménie à l'État rashidun et omeyyade; ses sources ne sont pas encore vérifiées sur la page."
  ur: "آرمینیا پر عربوں کی فتح کے لیے ڈرافٹ کارڈ، حبیب ابن مسلمہ اور عیاد ابن غنم کی مہم جو آرمینیا کو راشدین اور اموی ریاست میں شامل کیا گیا؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "İslam'ın Ermenistan'ı fethine, Habib ibn Maslama ve İyad ibn Ghanm'ın seferlerine ve bu seferler sonucunda Ermenistan'ın Raşidun ve Emevi devletlerine ilhakına dair ön bir anlatım; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang penaklukan Armenia oleh Islam, kampanye Habib ibn Maslama dan Iyad ibn Ghanm, yang mencaplok Armenia ke negara Rasyidin dan Umayyah; sumber-sumber di halaman ini belum ditinjau."
