label: { en: "Expedition of al-Sawiq", ar: "غزوة السويق", es: "Expedición de al-Sawiq", fr: "Expédition d'al-Sawiq", ur: "الصاویق کی مہم", tr: "Suwayq Muharebesi", id: "Pertempuran Suwayq" }
summary:
  en: "An expedition in Dhu al-Hijjah 2 AH pursuing Abu Sufyan who raided the outskirts of Medina with 200 riders; the Meccans dumped bags of roasted barley flour (sawiq) to lighten their load during flight."
  ar: "غزوة خرج فيها النبي في مائتي راكب في ذي الحجة 2هـ لمطاردة أبي سفيان بعد إغارته على العريض وقتله رجلين وحرقه النخيل؛ ألقى المشركون أكياس السويق تخففاً في الهرب فغنمها المسلمون."
  es: "En Dhu al-Hijjah del año 2 de la Hégira, una expedición perseguía a Abu Sufyan, quien había asaltado las afueras de Medina con 200 jinetes; los mecanos arrojaron sacos de harina de cebada tostada (sawiq) para aligerar su carga durante la huida."
  fr: "Une expédition en Dhu al-Hijjah 2 AH à la poursuite d'Abu Sufyan qui avait attaqué les abords de Médine avec 200 cavaliers; les Mecquois se débarrassèrent de sacs de farine d'orge grillée (sawiq) pour alléger leur charge pendant la fuite."
  ur: "ذی الحجہ 2 ہجری میں ایک مہم جو ابو سفیان کا تعاقب کر رہی تھی جس نے 200 سواروں کے ساتھ مدینہ کے مضافات پر حملہ کیا تھا۔ مکہ والوں نے پرواز کے دوران اپنا بوجھ ہلکا کرنے کے لیے بھنے ہوئے جو کے آٹے کے تھیلے پھینکے۔"
  tr: "Hicri 2. yılın Zilhicce ayında, Peygamberimiz, Ebu Sufyan'ın Ârid'e baskın düzenleyip iki adamı öldürmesi ve hurma ağaçlarını yakmasının ardından onu takip etmek için iki yüz süvariyle yola çıktı. Müritler kaçışlarını kolaylaştırmak için arpa unu dolu çuvallar attılar ve Müslümanlar bunları savaş ganimeti olarak ele geçirdiler."
  id: "Pada bulan Dzul Hijjah 2 Hijriah, Nabi Muhammad SAW berangkat bersama dua ratus penunggang kuda untuk mengejar Abu Sufyan setelah ia menyerbu al-Arid, membunuh dua orang, dan membakar pohon-pohon kurma. Kaum musyrik melemparkan karung-karung tepung barley untuk meringankan pelarian mereka, dan kaum Muslimin mengambilnya sebagai rampasan perang."
