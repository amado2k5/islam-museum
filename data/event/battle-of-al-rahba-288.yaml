id: event/battle-of-al-rahba-288
class: event
kind: battle
label:
  ar: معركة الرحبة وعودة الهادي إلى صنعاء، رجب 288هـ
  en: The battle of al-Rahba and al-Hadi's return to Sana'a, Rajab 288 AH
  ur: معرکۂ رحبہ اور ہادی کی صنعاء میں واپسی، رجب 288ھ
summary:
  ar: لقي إبراهيم بن خلف بن طريف الهادي في الرحبة في عساكر كثيفة، فاقتتلوا فظفر بهم الهادي، ودخل صنعاء يوم الجمعة لأيام بقيت من رجب سنة 288هـ، وهاجت الحرب بينه وبين آل يعفر وآل طريف.
  en: Ibrahim ibn Khalaf ibn Tarif met al-Hadi at al-Rahba with dense forces; al-Hadi prevailed, entered Sana'a on a Friday with some days left of Rajab 288 AH, and war flared between him and Al Ya'fur and Al Tarif.
  ur: ابراہیم بن خلف بن طریف رحبہ میں گھنے لشکروں کے ساتھ ہادی سے ملا؛ ہادی غالب آئے، رجب 288ھ کے آخری دنوں میں جمعہ کے روز صنعاء میں داخل ہوئے، اور ان کے اور آل یعفر و آل طریف کے درمیان جنگ بھڑک اٹھی۔
