id: event/al-hadi-leaves-najran-for-saada-in-dhu-al-qada-292
class: event
kind: other
label:
  ar: "ارتحال الهادي من نجران إلى صعدة في ذي القعدة، ص295"
  en: "Al-Hadi leaves Najran for Sa'da in Dhu al-Qa'da, p. 295"
  ur: "ہادی کا ذی القعدہ میں نجران سے صعدہ کو روانہ ہونا، ص295"
  es: "Al-Hadi deja Najran hacia Sa'da en Dhu al-Qa'da, p. 295"
  fr: "Al-Hadi quitte Najran pour Sa'da dans Dhu al-Qa'da, p. 295"
summary:
  ar: "أقام الهادي بنجران وسكن الناس واستأمن إليه جميع يأم وبني الحارث، وفي ذي القعدة ارتحل منها إلى صعدة فأقام بها؛ والنص يؤرخ ذلك «سنة إحدى وتسعين ومائتين» وهو ما يخالف ترتيب الرواية."
  en: "Al-Hadi stayed at Najran, people calmed and mixed and all of Yam and Banu al-Harith asked his safety; in Dhu al-Qa'da he left for Sa'da and stayed there; the text dates this to \"the year two hundred and ninety-one\", which does not agree with the order of the narrative."
  ur: "ہادی نجران میں رہے، لوگ مطمئن ہو کر آپس میں ملنے لگے اور یام اور بنو حارث سب نے ان سے امان مانگی؛ ذی القعدہ میں وہ وہاں سے صعدہ کو روانہ ہوئے اور وہاں ٹھہرے؛ متن اسے «سنہ دو سو اکانوے» لکھتا ہے جو روایت کی ترتیب سے میل نہیں کھاتا۔"
  es: "Al-Hadi se quedó en Najran, la gente se calmó y se mezcló, y todos los Yam y Banu al-Harith preguntaron por su seguridad; en Dhu al-Qa'da partió hacia Sa'da y se quedó allí; el texto fecha esto en \"el año doscientos noventa y uno\", lo cual no concuerda con el orden de la narración."
  fr: "Al-Hadi séjourna à Najran, les gens se calmèrent et se mêlèrent, et tous les habitants de Yam et de Banu al-Harith s'enquirent de sa sécurité; à Dhu al-Qa'da, il partit pour Sa'da et y demeura; le texte date cela de « l'an deux cent quatre-vingt-onze », ce qui ne correspond pas à l'ordre du récit."
