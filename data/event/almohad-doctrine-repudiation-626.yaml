id: event/almohad-doctrine-repudiation-626
class: event
kind: declaration
label:
  ar: خلع المأمون دعوة الموحدين
  en: al-Ma'mun's repudiation of the Almohad creed
summary:
  ar: "سنة 626هـ دخل الخليفة المأمون بن المنصور مراكش فأحضر مشيخة الموحدين وعدّد عليهم فعلاتهم وقتل مائة من أعيانهم، وأصدر كتابه إلى البلدان بمحو اسم المهدي ابن تومرت من السكة والخطبة والنعي عليه في النداء للصلاة باللغة البربرية، وزيادة قول «أصبح والحمد لله» في نداء الفجر، وأذن للنصارى القادمين معه في بناء كنيسة بمراكش، وأخرج الموحدين من الأندلس فقتلتهم العامة في كل قطر، ولم يعد التكفير بالمثال ولا رسوم الدعوة إلا بعده على يد ابنه الرشيد بشرط مشيخة تينملل."
  en: "In 626 AH the caliph al-Ma'mun entered Marrakesh, arraigned the Almohad shaykhs and killed a hundred notables, then ordered Ibn Tumart's name struck from coinage and khutba and cursed in the Berber call to prayer, added «أصبح والحمد لله» to the dawn adhan, licensed a church in Marrakesh, and expelled the Muwahhidun from al-Andalus where the populace killed them — a repudiation reversed only when his son al-Rashid repurchased the shaykhs' allegiance by restoring the Mahdi's rites."
