id: event/almohad-doctrine-repudiation-626
class: event
kind: declaration
label:
  ar: خلع المأمون دعوة الموحدين
  en: al-Ma'mun's repudiation of the Almohad creed
  es: "El rechazo de al-Ma'mun al credo almohade"
  fr: "Le rejet par al-Ma'mun du credo almohade"
  ur: "المامون کا الموحد عقیدہ کا انکار"
  tr: "El-Ma'mun, Üniteryen hareketini reddetti."
  id: "Al-Ma'mun menolak gerakan Unitarian."
summary:
  ar: "سنة 626هـ دخل الخليفة المأمون بن المنصور مراكش فأحضر مشيخة الموحدين وعدّد عليهم فعلاتهم وقتل مائة من أعيانهم، وأصدر كتابه إلى البلدان بمحو اسم المهدي ابن تومرت من السكة والخطبة والنعي عليه في النداء للصلاة باللغة البربرية، وزيادة قول «أصبح والحمد لله» في نداء الفجر، وأذن للنصارى القادمين معه في بناء كنيسة بمراكش، وأخرج الموحدين من الأندلس فقتلتهم العامة في كل قطر، ولم يعد التكفير بالمثال ولا رسوم الدعوة إلا بعده على يد ابنه الرشيد بشرط مشيخة تينملل."
  en: "In 626 AH the caliph al-Ma'mun entered Marrakesh, arraigned the Almohad shaykhs and killed a hundred notables, then ordered Ibn Tumart's name struck from coinage and khutba and cursed in the Berber call to prayer, added «أصبح والحمد لله» to the dawn adhan, licensed a church in Marrakesh, and expelled the Muwahhidun from al-Andalus where the populace killed them — a repudiation reversed only when his son al-Rashid repurchased the shaykhs' allegiance by restoring the Mahdi's rites."
  es: "En el año 626 de la Hégira, el califa al-Ma'mun entró en Marrakech, procesó a los jeques almohades y mató a cien notables; luego ordenó que el nombre de Ibn Tumart fuera borrado de las monedas y de los sermones, y maldecido en la llamada a la oración bereber; añadió «أصبح والحمد لله» al adhan del amanecer; autorizó una iglesia en Marrakech; y expulsó a los Muwahhidun de al-Ándalus, donde la población los mató; un repudio que solo se revirtió cuando su hijo al-Rashid recuperó la lealtad de los jeques restaurando los ritos del Mahdi."
  fr: "En 626 AH, le calife al-Ma'mun entra à Marrakech, traduisit en justice les cheikhs almohades et fit exécuter une centaine de notables, puis ordonna que le nom d'Ibn Tumart soit rayé des pièces de monnaie et des sermons, et qu'il soit maudit dans l'appel à la prière berbère. Il ajouta «أصبح والحمد لله» à l'adhan de l'aube, autorisa la construction d'une église à Marrakech et expulsa les Muwahhidun d'al-Andalus où la population les tua – une répudiation qui ne fut annulée que lorsque son fils al-Rashid racheta l'allégeance des cheikhs en restaurant les rites du Mahdi."
  ur: "626 ہجری میں خلیفہ المامون نے مراکش میں داخل ہو کر الموحد شیوخ کو گرفتار کیا اور ایک سو معززین کو قتل کیا، پھر ابن تمرٹ کے نام کو سکہ اور خطبہ سے ٹکرانے کا حکم دیا اور بربر اذان میں لعنت بھیجی، فجر کی اذان میں \"أصبح والحمد لله\" کا اضافہ کیا الاندلس سے تعلق رکھنے والے محدثین جہاں عوام نے انہیں قتل کر دیا - انکار صرف اس وقت ہوا جب اس کے بیٹے الرشید نے مہدی کی رسومات کو بحال کر کے شیخوں کی بیعت کو دوبارہ خریدا۔"
  tr: "Hicri 626 yılında Halife Me'mun ibn Mansur Marakeş'e girdi, Muhadis şeyhlerini çağırdı, yaptıklarını sıraladı ve yüz ileri gelenini öldürdü. Ülkelere bir mektup göndererek, Mehdi İbn Tumart'ın adının sikkelerden ve hutbelerden kaldırılmasını, Berberi dilindeki ezanda onun için yapılan övgünün kaldırılmasını ve sabah ezanına \"Sabahı gördüm, Allah'a hamd olsun\" ifadesinin eklenmesini emretti. Kendisiyle gelen Hristiyanların Marakeş'te bir kilise inşa etmelerine izin verdi ve Muhadisleri Endülüs'ten kovdu, böylece halk onları her bölgede öldürdü. Birini örnekle kâfir ilan etme uygulaması ve ezan ritüelleri, ancak ondan sonra oğlu Raşid'in eliyle, Tinmel şeyhlerinin şartıyla geri döndü."
  id: "Pada tahun 626 H, Khalifah Al-Ma'mun ibn Al-Mansur memasuki Marrakesh, memanggil para syekh Al-Muhad, menghitung perbuatan mereka, dan membunuh seratus tokoh terkemuka mereka. Beliau mengeluarkan surat kepada negara-negara yang memerintahkan penghapusan nama Al-Mahdi Ibn Tumart dari mata uang dan khutbah, serta pujian untuknya dalam seruan azan dalam bahasa Berber, dan penambahan frasa \"Aku telah memasuki fajar, dan segala puji bagi Allah\" dalam seruan subuh. Beliau mengizinkan orang-orang Kristen yang datang bersamanya untuk membangun gereja di Marrakesh, dan beliau mengusir Al-Muhad dari Andalusia, sehingga rakyat jelata membunuh mereka di setiap wilayah. Praktik menyatakan seseorang sebagai kafir melalui contoh dan ritual seruan azan tidak kembali sampai setelahnya di tangan putranya Al-Rashid, dengan syarat para syekh Tinmel."
