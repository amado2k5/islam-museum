summary:
  ar: "ظهر في أيام الهادي الحسين بن علي بن الحسن بن الحسن بن علي بن أبي طالب وهو المقتول بفخ على ستة أميال من مكة يوم التروية، ونجا من القتلة إخوته موسى ويحيى ابنا عبد الله فسار يحيى إلى الديلم مستجيراً فباعه صاحب الديلم من عامل الرشيد بمائة ألف درهم فقتل، وروي أنه ألقي في بركة فيها سباع جوعت فأمسكت عن أكله فبني عليه ركن بالجص والحجر وهو حي {cite:muruj-al-dhahab p. 316-330}."
  en: "The Hasanid rising cut down at Fakhkh, six miles from Mecca on the day of Tarwiya — its survivors scattered to Daylam and worse {cite:muruj-al-dhahab p. 316-330}."
  fr: "Le soulèvement hassanide taillé en pièces à Fakhkh, à six milles de La Mecque, le jour de Tarwiya ; ses survivants se dispersèrent jusqu'au Daylam, et connurent pire encore {cite:muruj-al-dhahab p. 316-330}."
  es: "El levantamiento hasaní fue aniquilado en Fakhkh, a seis millas de La Meca, el día de Tarwiya; sus supervivientes se dispersaron a Daylam y lugares peores {cite:muruj-al-dhahab p. 316-330}."
  ur: "ترویہ کے دن مکہ سے چھ میل کے فاصلے پر فخ کے مقام پر حسنی عروج کا خاتمہ ہوا - اس کے بچ جانے والے دیلم تک بکھر گئے اور بدتر {حوالہ: مروج الذہب صفحہ 500 316-330}۔"
  tr: "O, Mekke'ye altı mil uzaklıktaki Fakh'ta Tarviye günü öldürülen Al-Hadi Al-Hüseyin bin Ali bin Al-Hasan bin Al-Hasan bin Ali bin Ebu Talib zamanında ortaya çıktı. Kardeşleri Musa ve Yahya, Abdullah'ın oğulları, katillerden kurtuldular. Yahya, sığınmak için Daylam'a gitti ve Daylam hükümdarı onu yüz bin dirheme Al-Raşid'in temsilcisine sattı, böylece öldürüldü. Rivayet edildiğine göre, aç hayvanların bulunduğu bir havuza atıldı, bu yüzden hayvanlar onu yemedi. Canlıyken üzerine sıva ve taşla bir köşe örüldü. {kaynak:muruj-al-dhahab s. 316-330}"
  id: "Ia muncul pada masa Al-Hadi Al-Husayn bin Ali bin Al-Hasan bin Al-Hasan bin Ali bin Abi Talib, yang terbunuh di Fakh, enam mil dari Mekah, pada hari Tarwiyah. Saudara-saudaranya, Musa dan Yahya, putra Abdullah, berhasil lolos dari para pembunuh. Yahya pergi ke Daylam untuk mencari perlindungan, dan penguasa Daylam menjualnya kepada agen Al-Rashid seharga seratus ribu dirham, sehingga ia terbunuh. Diriwayatkan bahwa ia dilemparkan ke dalam kolam yang berisi binatang buas yang lapar, sehingga mereka tidak memakannya. Sebuah sudut dibangun di atasnya dengan plester dan batu saat ia masih hidup. {cite:muruj-al-dhahab p. 316-330}."
