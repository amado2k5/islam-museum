id: event/ali-equal-distribution-of-fay
class: event
kind: other
label: { ar: "تسوية علي في قسمة المال بين الناس", en: "Ali's equal distribution of the fay and the treasury" }
summary:
  ar: "يذكر الصلابي أن علياً كان يقسم المال حين يرد إليه بالتسوية بين الناس، بعد أن يحتجز ما تحتاجه المرافق العامة، ولا يفضل شريفاً على مشروف ولا عربياً على أعجمي؛ فلما شكت امرأة عربية إليه أن الأعجمية تساويها قال: لا أجد لبني إسماعيل في هذا الفيء فضلاً على بني إسحاق {cite:sallabi-ali-vol1 p. 229}. ويروي الكتاب كذلك قصة مال من أصبهان قُسم سبعة أسباع، ووجد فيه رغيف فقُسم سبع كسر وأُقرع بين الناس {cite:sallabi-ali-vol1 p. 228}، وقصة عمرو بن سلمة مع أم كلثوم بنت علي في الزقاق من العسل والسمن {cite:sallabi-ali-vol1 p. 229}."
  en: "Ali distributed incoming money equally among the people after setting aside what public needs required, and gave Arab and non-Arab women the same portion, saying he finds no merit for the children of Ishmael over the children of Isaac in the fay. The book also records a sum from Isfahan split into seven shares and a loaf cut into seven pieces drawn by lot, and a dispute over two jars of honey and ghee taken by Ali's daughter Umm Kulthum."
