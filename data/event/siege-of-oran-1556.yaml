summary:
  ar: "الحملة التي كان صالح رايس يعد لها لفتح وهران والمرسى الكبير بعد أن كشفت المخابرات العثمانية المحادثات السعدية الأسبانية؛ أرسل السلطان سليمان أربعين سفينة فصار لصالح نحو سبعين سفينة وأربعين ألف جند، لكنه توفي بالطاعون في رجب ٩٦٣هـ/١٥٥٦م. فأكمل القائد يحيى خطته وأبحر نحو وهران، وفي الطريق وصلت الأوامر السلطانية بتعيين حسن قورصو بيلربكاً؛ وحوصرت وهران حصاراً شديداً لكنها لم تفتح بسبب النجدات المتواصلة التي كانت تبعثها أسبانيا {cite:dawlat-uthmaniyya-salabi p. 243-244}."
  en: "The campaign Salih Reis was preparing against Oran and Mers el-Kebir after Ottoman intelligence uncovered the Sa'di-Spanish talks; Süleyman sent forty ships, giving him about seventy ships and forty thousand men, but he died of plague in Rajab 963/1556. The commander Yahya carried on and sailed; en route the sultanic order arrived naming Hasan Corso beylerbey. Oran was closely besieged yet not taken, for Spain's continuous relief convoys {cite:dawlat-uthmaniyya-salabi p. 243-244}."
