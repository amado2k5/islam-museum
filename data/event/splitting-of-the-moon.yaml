id: event/splitting-of-the-moon
class: event
kind: other
label: { ar: "انشقاق القمر", en: "the splitting of the moon", es: "la división de la luna", fr: "la division de la lune", ur: "چاند کا ٹوٹنا", tr: "ay bölünmesi", id: "pemecahan bulan" }
summary:
  ar: "الآية التي سألها أهل مكة من النبي فأراهم القمر شقتين حتى رأوا حراء بينهما {cite:sahih-al-bukhari 3868}، وقالوا في رواية أخرى «سحرنا محمد». يروي ابن مسعود «انشق القمر ونحن مع النبي بمنى فقال: اشهدوا — وذهبت فرقة نحو الجبل»، وقال مرة: انشق بمكة {cite:sahih-al-bukhari 3869}، ويروي ابن عباس أن القمر انشق على زمان رسول الله {cite:sahih-al-bukhari 3870}. ويقرأ المسلمون عليه افتتاح سورة القمر [[passage/quran-54-1|«اقتربت الساعة وانشق القمر»]]."
  en: "The sign the people of Mecca asked of the Prophet: he showed them the moon in two halves until they saw Mount Hira between them {cite:sahih-al-bukhari 3868}; in another report they said 'Muhammad has bewitched us'. Ibn Mas'ud reports 'the moon split while we were with the Prophet at Mina; he said: bear witness — and one part went toward the mountain', and once said it split at Mecca {cite:sahih-al-bukhari 3869}; Ibn 'Abbas reports the moon split in the Prophet's lifetime {cite:sahih-al-bukhari 3870}. Muslims read the event in the opening of Surat al-Qamar [[passage/quran-54-1|'the Hour has drawn near and the moon has split']]."
  es: "La señal que la gente de La Meca le pidió al Profeta: les mostró la luna en dos mitades hasta que vieron el monte Hira entre ellos {cita:sahih-al-bukhari 3868}; en otro relato dijeron: «Mahoma nos ha embrujado». Ibn Mas'ud relata que «la luna se partió mientras estábamos con el Profeta en Mina; él dijo: “Sed testigos, y una parte fue hacia la montaña”», y una vez dijo que se partió en La Meca {cita:sahih-al-bukhari 3869}; Ibn 'Abbas relata que la luna se partió en vida del Profeta {cita:sahih-al-bukhari 3870}. Los musulmanes leen el evento al comienzo de la Sura al-Qamar [[passage/quran-54-1|“La Hora se ha acercado y la luna se ha partido”]]."
  fr: "Le signe que les habitants de La Mecque demandèrent au Prophète fut la division de la lune en deux, jusqu'à ce qu'ils aperçoivent le mont Hira entre les deux (Sahil Bukhari 3868). Selon un autre récit, ils dirent: « Muhammad nous a ensorcelés ». Ibn Mas'ud rapporte: « La lune se fendit alors que nous étions avec le Prophète à Mina; il dit: “Soyez témoins”, et une moitié se dirigea vers la montagne. » Il dit aussi qu'elle se fendit à La Mecque (Sahil Bukhari 3869). Ibn Abbas rapporte que la lune se fendit du vivant du Prophète (Sahil Bukhari 3870). Les musulmans lisent cet événement au début de la sourate Al-Qamar (54, 1): « L'Heure est proche et la lune s'est fendue »."
  ur: "اہل مکہ نے نبی سے جو نشانی مانگی تھی: آپ نے انہیں چاند دو حصوں میں دکھایا یہاں تک کہ انہوں نے اپنے درمیان کوہ حرا کو دیکھا {صحیح البخاری 3868} ایک اور رپورٹ میں انہوں نے کہا کہ 'محمد نے ہم پر جادو کر دیا ہے'۔ ابن مسعود بیان کرتے ہیں کہ چاند پھٹ گیا جب ہم منیٰ میں نبی کے ساتھ تھے۔ اس نے کہا: گواہ رہو - اور ایک حصہ پہاڑ کی طرف چلا گیا، اور ایک بار کہا کہ یہ مکہ میں پھٹ گیا {حوالہ: صحیح البخاری 3869}؛ ابن عباس نے نبی کی زندگی میں چاند کے پھٹنے کی خبر دی ہے۔ مسلمان سورۃ القمر کے آغاز میں واقعہ پڑھتے ہیں [[passage/quran-54-1|'قیامت قریب آ گئی ہے اور چاند پھٹ گیا ہے']]۔"
  tr: "Mekke halkının Peygamberden istediği alamet buydu; o da onlara ayın ikiye ayrıldığını gösterdi ve aralarında Hira Dağı'nı gördüler. {Sahih Buhari 3868} Başka bir rivayette ise, \"Muhammed bizi büyüledi\" dediler. İbn Mes'ud şöyle rivayet etmiştir: \"Biz Mina'da Peygamberle birlikteyken ay ikiye ayrıldı ve o, 'Şahit olun' dedi ve bir grup dağa doğru gitti.\" Başka bir rivayette de, \"Mekke'de ikiye ayrıldı\" demiştir. {Sahih Buhari 3869} İbn Abbas da, Allah Resulü zamanında ayın ikiye ayrıldığını rivayet etmiştir. {Sahih Buhari 3870} Müslümanlar ona Kamer Suresi'nin başlangıcını okurlar [[Kıyamet yaklaştı ve ay ikiye ayrıldı]]."
  id: "Tanda yang diminta oleh penduduk Mekah kepada Nabi, lalu beliau memperlihatkan kepada mereka bulan terbelah menjadi dua hingga mereka melihat Gunung Hira di antara keduanya {kutip:sahih-al-bukhari 3868}, dan dalam riwayat lain mereka berkata, “Muhammad telah menyihir kami.” Ibnu Mas’ud meriwayatkan, “Bulan terbelah ketika kami bersama Nabi di Mina, dan beliau berkata, ‘Bersaksilah’—lalu sekelompok orang pergi menuju gunung itu.” Ia juga berkata pada kesempatan lain, “Bulan terbelah di Mekah” {kutip:sahih-al-bukhari 3869}, dan Ibnu Abbas meriwayatkan bahwa bulan terbelah pada masa Rasulullah {kutip:sahih-al-bukhari 3870}. Dan kaum Muslimin membacakan kepadanya pembukaan Surah Al-Qamar [[ayat/quran-54-1|“Hari Kiamat telah dekat, dan bulan telah terbelah”]]."
