label: { ar: "انتقاض أهل أرمينية على الحسن بن قحطبة", en: "Armenia's Rising under al-Hasan ibn Qahtaba" }
summary:
  ar: "عند البلاذري: انتقض أهل أرمينية في ولاية الحسن بن قحطبة الطائي — بعد عزل ابن أسيد وبكّار بن مسلم العقيلي — وكان رئيسهم موشائيل الأرمني فبعث إليه المنصور الأمداد وعليهم عامر بن إسماعيل فواقع الحسن موشائيل فقُتل وفضّت جموعه واستقامت له الأمور، وهو الذي نُسب إليه نهر الحسن بالبيلقان والباغ الذي يعرف بباغ الحسن ببرذعة والضياع المعروفة بالحسنية."
  en: "In al-Baladhuri: Armenia's people rose in revolt in the governorship of al-Hasan ibn Qahtaba al-Ta'i — after the removal of Ibn Asid and Bakkar ibn Muslim al-Uqayli — their chief being Mushay'il the Armenian; al-Mansur sent him reinforcements under Amir ibn Isma'il, and al-Hasan met Mushay'il, who was killed, his hosts scattered, and matters settled for him — it is he after whom Nahr al-Hasan at al-Baylaqan, the garden called Bagh al-Hasan at Bardha'a, and the estates known as al-Hasaniyya were named."
