id: event/mushayil-revolt
class: event
kind: civil-war
label: { ar: "انتقاض أهل أرمينية على الحسن بن قحطبة", en: "Armenia's Rising under al-Hasan ibn Qahtaba", es: "El levantamiento de Armenia bajo al-Hasan ibn Qahtaba", fr: "Le soulèvement arménien sous al-Hasan ibn Qahtaba", ur: "حسن بن قحطبہ کی قیادت میں آرمینیا کا عروج" }
summary:
  ar: "عند البلاذري: انتقض أهل أرمينية في ولاية الحسن بن قحطبة الطائي — بعد عزل ابن أسيد وبكّار بن مسلم العقيلي — وكان رئيسهم موشائيل الأرمني فبعث إليه المنصور الأمداد وعليهم عامر بن إسماعيل فواقع الحسن موشائيل فقُتل وفضّت جموعه واستقامت له الأمور، وهو الذي نُسب إليه نهر الحسن بالبيلقان والباغ الذي يعرف بباغ الحسن ببرذعة والضياع المعروفة بالحسنية."
  en: "In al-Baladhuri: Armenia's people rose in revolt in the governorship of al-Hasan ibn Qahtaba al-Ta'i — after the removal of Ibn Asid and Bakkar ibn Muslim al-Uqayli — their chief being Mushay'il the Armenian; al-Mansur sent him reinforcements under Amir ibn Isma'il, and al-Hasan met Mushay'il, who was killed, his hosts scattered, and matters settled for him — it is he after whom Nahr al-Hasan at al-Baylaqan, the garden called Bagh al-Hasan at Bardha'a, and the estates known as al-Hasaniyya were named."
  es: "En al-Baladhuri: El pueblo de Armenia se alzó en rebelión durante el gobierno de al-Hasan ibn Qahtaba al-Ta'i, tras la destitución de Ibn Asid y Bakkar ibn Muslim al-Uqayli. Su líder era Mushay'il el armenio; al-Mansur le envió refuerzos bajo el mando de Amir ibn Isma'il, y al-Hasan se reunió con Mushay'il, quien fue asesinado, sus tropas se dispersaron y el asunto quedó resuelto a su favor. Es de él de quien recibieron su nombre Nahr al-Hasan en al-Baylaqan, el jardín llamado Bagh al-Hasan en Bardha'a y las propiedades conocidas como al-Hasaniyya."
  fr: "Dans al-Baladhuri: Le peuple arménien se souleva sous le gouvernement d'al-Hasan ibn Qahtaba al-Ta'i — après la destitution d'Ibn Asid et de Bakkar ibn Muslim al-Uqayli — leur chef étant Mushay'il l'Arménien; al-Mansur lui envoya des renforts sous le commandement d'Amir ibn Isma'il, et al-Hasan rencontra Mushay'il, qui fut tué, ses troupes dispersées, et l'affaire se régla en sa faveur — c'est de lui que furent nommés Nahr al-Hasan à al-Baylaqan, le jardin appelé Bagh al-Hasan à Bardha'a, et les domaines connus sous le nom d'al-Hasaniyya."
  ur: "البلادھوری میں: آرمینیا کے لوگوں نے الحسن بن قحطبہ الطائی کی گورنری میں بغاوت کر دی — ابن اسید اور بکر بن مسلم العقیلی کی برطرفی کے بعد — ان کا سربراہ مشائل آرمینیائی تھا۔ المنصور نے اسے امیر بن اسماعیل کے ماتحت کمک بھیجی، اور الحسن نے مشائل سے ملاقات کی، جو مارا گیا، اس کے لشکر منتشر ہو گئے، اور اس کے لیے معاملات طے پاگئے - یہ وہی ہے جس کے بعد البیلقان میں نہر الحسن، بردعہ میں باغ الحسن کہلانے والا باغ، اور الحسنیہ کے نام سے مشہور ہوئے۔"
