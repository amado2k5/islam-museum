id: event/khatib-death-463
class: event
kind: death
label:
  ar: "وفاة الخطيب البغدادي ودفنه عند بشر الحافي، ٧ ذو الحجة ٤٦٣هـ"
  en: "Al-Khatib al-Baghdadi dies and is buried beside Bishr al-Hafi, 7 Dhu al-Hijja 463/1071"
  ur: "خطیب بغدادی کی وفات اور بشر حافی کے پہلو میں تدفین، 7 ذوالحجہ 463ھ/1071ء"
  es: "Al-Khatib al-Baghdadi muere y es enterrado junto a Bishr al-Hafi, 7 Dhu al-Hijja 463/1071"
  fr: "Al-Khatib al-Baghdadi meurt et est enterré à côté de Bishr al-Hafi, 7 Dhu al-Hijja 463/1071"
  tr: "El-Hatib El-Bağdadi'nin ölümü ve Bişr El-Hafi yakınına defnedilmesi, Zilhicce'nin 7. yılı H. 463."
  id: "Wafatnya Al-Khatib Al-Baghdadi dan penguburannya di dekat Bishr Al-Hafi, 7 Dhu al-Hijjah 463 H"
summary:
  ar: "مرض الخطيب ببغداد في نصف رمضان حتى اشتد به الحال في غرة ذي الحجة، وأوصى إلى أبي الفضل بن خيرون ووقف كتبه على يده وفرّق جميع ماله في وجوه البر وعلى المحدثين، وتوفي رابع ساعة من يوم الاثنين سابع ذي الحجة سنة ثلاث وستين وأربعمائة؛ أُخرج بكرة الثلاثاء إلى الجانب الغربي وتقدّم الناسَ القاضي أبو الحسين بن المهتدي بالله فكبّر عليه أربعاً، ودُفن بباب حرب بجنب بشر الحافي في القبر الذي كان أبو بكر بن زهراء الصوفي قد أعدّه لنفسه فأذن فيه؛ وكان ممن حمل جنازته الإمام أبو إسحاق الشيرازي {cite:tarikh-islam-dhahabi pp. 107-108}."
  en: "Al-Khatib fell ill at Baghdad in mid-Ramadan and worsened at the opening of Dhu al-Hijja; he appointed Abu al-Fadl ibn Khayrun his executor, made his books a waqf in his hands and gave away all his money in charity and to the hadith folk, and died in the fourth hour of Monday 7 Dhu al-Hijja 463. He was carried out the next morning to the west side; the qadi Abu al-Husayn ibn al-Muhtadi bi-llah led the prayer with four takbirs, and he was buried at Bab Harb beside Bishr al-Hafi, in the grave that Abu Bakr ibn Zahra' the Sufi had prepared for himself and yielded; the imam Abu Ishaq al-Shirazi was among those who carried the bier {cite:tarikh-islam-dhahabi pp. 107-108}."
  ur: "خطیب بغداد میں وسط رمضان سے علیل ہوئے اور ذوالحجہ کی ابتدا میں حال بگڑ گیا؛ انہوں نے ابوالفضل بن خیرون کو وصی بنایا، اپنی کتابیں ان کے ہاتھوں وقف کیں اور ساری دولت خیرات اور محدثین میں بانٹ دی، اور پیر کو 7 ذوالحجہ 463ھ کو دن کے چوتھے پہر فوت ہوئے۔ اگلی صبح انہیں مغربی جانب لے جایا گیا؛ قاضی ابوالحسین بن المھتدی باللہ نے چار تکبیروں سے نماز جنازہ پڑھائی، اور باب حرب میں بشر حافی کے پہلو میں اس قبر میں دفن کیا گیا جو ابو بکر بن زہراء صوفی نے اپنے لیے تیار کی تھی پھر دے دی؛ جنازہ اٹھانے والوں میں امام ابو اسحاق شیرازی بھی تھے {cite:tarikh-islam-dhahabi pp. 107-108}۔"
  es: "Al-Khatib enfermó en Bagdad a mediados de Ramadán y empeoró al comienzo de Dhu al-Hijja; nombró a Abu al-Fadl ibn Khayrun como su albacea, convirtió sus libros en un waqf en sus manos y repartió todo su dinero en caridad y entre la gente del hadiz, y murió en la cuarta hora del lunes 7 de Dhu al-Hijja 463. Fue llevado a la mañana siguiente al lado oeste; el cadí Abu al-Husayn ibn al-Muhtadi bi-llah dirigió la oración con cuatro takbirs, y fue enterrado en Bab Harb junto a Bishr al-Hafi, en la tumba que Abu Bakr ibn Zahra' el Sufí había preparado para sí mismo y cedido; el imán Abu Ishaq al-Shirazi estuvo entre los que llevaron el féretro {cite:tarikh-islam-dhahabi pp. 107-108}."
  fr: "Al-Khatib tomba malade à Bagdad au milieu du Ramadan et son état s'aggrava au début de Dhu al-Hijja. Il désigna Abu al-Fadl ibn Khayrun comme exécuteur testamentaire, fit de ses livres un waqf entre ses mains et distribua tous ses biens en aumônes et aux spécialistes du hadith. Il mourut à la quatrième heure du lundi 7 Dhu al-Hijja 463. Le lendemain matin, sa dépouille fut transportée à l'ouest. Le cadi Abu al-Husayn ibn al-Muhtadi bi-llah dirigea la prière en prononçant quatre takbirs. Al-Khatib fut enterré à Bab Harb, près de Bishr al-Hafi, dans la tombe qu'Abu Bakr ibn Zahra' le soufi avait préparée pour lui-même et qu'il avait cédée. L'imam Abu Ishaq al-Shirazi figurait parmi ceux qui portèrent le cercueil."
  tr: "El-Hatib, Ramazan ayının ortasında Bağdat'ta hastalandı ve durumu Zilhicce ayının ilk gününde kötüleşti. Mal varlığını Ebu el-Fadl ibn Hayrun'a vasiyet etti ve kitaplarını ona bağışladı. Tüm parasını hayır işlerine ve hadis âlimlerine dağıttı. Hicri 463 yılında, Zilhicce ayının yedinci günü, Pazartesi günü saat 4'te vefat etti. Salı sabahı batı tarafına götürüldü ve kadı Ebu el-Hüseyn ibn el-Muhtadi Billa, halkın önünde dört defa tekbir getirdi. Ebu Bekir ibn Zehra el-Sufi'nin kendisi için hazırladığı ve izin verdiği mezara, Bişr el-Hafi'nin yanına, Bab Harb'da defnedildi. Cenazesini taşıyanlar arasında İmam Ebu İshak el-Şirazi de vardı."
  id: "Al-Khatib jatuh sakit di Baghdad pada pertengahan Ramadan hingga kondisinya memburuk pada tanggal 1 Dzul Hijjah. Ia mewariskan hartanya kepada Abu al-Fadl ibn Khayrun dan mengwakafkan buku-bukunya kepadanya. Ia membagikan seluruh hartanya untuk amal dan untuk para ulama hadits. Ia wafat pada pukul empat pagi hari Senin, tanggal 7 Dzul Hijjah, tahun 463 H. Jenazahnya dibawa ke sisi barat pada Selasa pagi, dan hakim Abu al-Husayn ibn al-Muhtadi Billah memimpin orang-orang untuk membaca takbir empat kali untuknya. Ia dimakamkan di Bab Harb di samping Bishr al-Hafi di kuburan yang telah disiapkan dan diizinkan oleh Abu Bakr ibn Zahra al-Sufi. Di antara mereka yang mengusung jenazahnya adalah Imam Abu Ishaq al-Shirazi."
