id: event/testament-of-al-zubayr-on-the-day-of-the-camel
class: event
kind: other
tags: [wasaya-browser, wasaya-companions, wasaya-wasiyya, wasaya-mirath, wasaya-marqad]
label: { ar: "وصية الزبير بن العوام لابنه عبد الله يوم الجمل في قضاء دينه ومورثه", en: "Al-Zubayr's testament to his son Abd Allah on the day of the Camel: his debts and estate", ur: "جنگِ جمل کے دن زبیر بن العوام کی بیٹے عبد اللہ کو قرض کے بارے میں وصیت اور ترکہ", es: "Testamento de Al-Zubayr a su hijo Abd Allah el día del Camello: sus deudas y patrimonio.", fr: "Testament d'Al-Zubayr à son fils Abd Allah le jour du Chameau: ses dettes et son héritage", tr: "Deve Muharebesi günü, el-Zübeyr ibn el-Evvem'in oğlu Abdullah'a borçlarının ödenmesi ve miras konusunda bıraktığı vasiyetname.", id: "Wasiat Al-Zubayr ibn Al-Awwam kepada putranya Abdullah pada hari Perang Unta mengenai pelunasan hutang dan warisannya." }
summary:
  ar: "لما وقف الزبير يوم الجمل دعا ابنه عبد الله فقال له إنه لا يُقتل اليوم إلا ظالم أو مظلوم وإنه يرى أنه سيُقتل مظلوماً، وإن من أكبر همه دَينَه، وأمره أن يبيع ماله ويقضي دينه، وأوصى بثلث ماله ثم بثلث الثلث لبني عبد الله {cite:fath-al-bari scan vol. 2 p. 262}. وكان الدين ألفي ألف ومئتي ألف، وقضاه عبد الله ببيع الغابة وغيرها، ثم نادى في الموسم أربع سنين، وقسم الميراث، فأصاب كل امرأة من النساء الأربع ألف ألف ومئة ألف {cite:siyar-alam-nubala scan vol. 2 p. 129} {cite:siyar-alam-nubala scan vol. 2 p. 130}. وقُتل الزبير بوادي السباع {cite:fath-al-bari scan vol. 2 p. 265}."
  en: "When al-Zubayr stood on the day of the Camel he called his son Abd Allah and told him that only a wrongdoer or a wronged man would be killed that day, that he thought he would be killed wronged, and that his debt was his greatest worry; he told him to sell his property and pay his debt, and bequeathed a third, and a third of that third to Abd Allah's sons {cite:fath-al-bari scan vol. 2 p. 262}. The debt came to two million two hundred thousand, which Abd Allah paid by selling al-Ghaba and other property, then proclaimed at the pilgrimage for four years before dividing the inheritance, each of the four wives receiving one million one hundred thousand {cite:siyar-alam-nubala scan vol. 2 p. 129} {cite:siyar-alam-nubala scan vol. 2 p. 130}. Al-Zubayr was killed at Wadi al-Siba' {cite:fath-al-bari scan vol. 2 p. 265}."
  ur: "جنگِ جمل کے دن جب زبیر کھڑے ہوئے تو بیٹے عبد اللہ کو بلا کر کہا کہ آج صرف ظالم یا مظلوم قتل ہوگا، اور ان کا خیال ہے کہ وہ مظلوم قتل ہوں گے، اور ان کی سب سے بڑی فکر ان کا قرض ہے؛ انھیں حکم دیا کہ ان کا مال بیچ کر قرض ادا کریں، اور ایک تہائی کی وصیت کی، اور اس تہائی کے ایک تہائی کی عبد اللہ کے بیٹوں کے لیے {cite:fath-al-bari scan vol. 2 p. 262}۔ قرض بائیس لاکھ تھا، جسے عبد اللہ نے غابہ اور دوسرا مال بیچ کر ادا کیا، پھر چار سال حج کے موسم میں اعلان کرتے رہے اور اس کے بعد میراث تقسیم کی، اور چار بیویوں میں سے ہر ایک کو گیارہ لاکھ ملے {cite:siyar-alam-nubala scan vol. 2 p. 129} {cite:siyar-alam-nubala scan vol. 2 p. 130}۔ زبیر وادیِ سباع میں قتل ہوئے {cite:fath-al-bari scan vol. 2 p. 265}۔"
  es: "Cuando al-Zubayr se paró el día del Camello, llamó a su hijo Abd Allah y le dijo que solo un malhechor o un hombre agraviado sería asesinado ese día, que pensaba que él sería asesinado por haber sido agraviado, y que su deuda era su mayor preocupación; le dijo que vendiera sus propiedades y pagara su deuda, y legó un tercio, y un tercio de ese tercio a los hijos de Abd Allah {cite:fath-al-bari scan vol. 2 p. 262}. La deuda ascendió a dos millones doscientos mil, que Abd Allah pagó vendiendo al-Ghaba y otras propiedades, luego proclamó en la peregrinación durante cuatro años antes de dividir la herencia, recibiendo cada una de las cuatro esposas un millón cien mil {cite:siyar-alam-nubala scan vol. 2 p. 129} {cite:siyar-alam-nubala scan vol. 2 p. 130}. Al-Zubayr fue asesinado en Wadi al-Siba' {cite:fath-al-bari scan vol. 2 p. 265}."
  fr: "Le jour du pèlerinage au Chameau, al-Zubayr appela son fils Abd Allah et lui dit que seul un injuste ou une victime d'injustice serait mis à mort ce jour-là. Il craignait d'être lui-même victime d'une injustice et confia que sa dette était sa plus grande préoccupation. Il lui conseilla de vendre ses biens pour rembourser sa dette et lui légua un tiers de ses biens, puis un tiers de ce tiers à chacun des fils d'Abd Allah (voir Fath al-Bari, vol. 2, p. 262). La dette s'élevait à deux millions deux cent mille yuans, qu'Abd Allah régla en vendant al-Ghaba et d'autres propriétés. Il proclama ensuite sa fortune lors du pèlerinage pendant quatre ans avant de partager l'héritage, chacune des quatre épouses recevant un million cent mille yuans (voir Siyar al-Alam nubala, vol. 2, p. 129; Siyar al-Alam nubala, vol. 2, p. 130). Al-Zubayr a été tué à Wadi al-Siba' {cite:fath-al-bari scan vol. 2 p. 265}."
  tr: "Zübeyr, Deve Muharebesi'nde dururken oğlu Abdullah'ı çağırdı ve ona o gün sadece zalimin veya mazlumun öldürüleceğini, kendisinin de haksız yere öldürüleceğine inandığını söyledi. En büyük endişesinin borcu olduğunu belirterek, mal varlığını satıp borcunu ödemesini emretti. Servetinin üçte birini, bu üçte birinin de üçte birini Abdullah'ın oğullarına miras bıraktı. Borç iki milyon iki yüz bin liraydı ve Abdullah ormanı ve diğer varlıklarını satarak borcunu ödedi. Daha sonra, hac mevsiminde, mirasın dört yıl içinde dağıtılacağını duyurdu ve dört karısının her birine bir milyon yüz bin lira verildi. Zübeyr, Vadi el-Siba'da öldürüldü."
  id: "Ketika Al-Zubayr berada di Pertempuran Unta, ia memanggil putranya Abdullah dan mengatakan kepadanya bahwa hanya penindas atau yang tertindas yang akan terbunuh hari itu, dan bahwa ia percaya dirinya akan terbunuh secara tidak adil. Ia mengatakan bahwa kekhawatiran terbesarnya adalah utangnya, dan ia memerintahkan Abdullah untuk menjual hartanya dan melunasinya. Ia mewariskan sepertiga dari kekayaannya, dan kemudian sepertiga dari sepertiga itu kepada putra-putra Abdullah. Utang tersebut berjumlah dua juta dua ratus ribu, dan Abdullah melunasinya dengan menjual hutan dan aset lainnya. Kemudian, selama musim haji, ia mengumumkan pembagian warisan selama empat tahun, dan masing-masing dari empat istrinya menerima satu juta seratus ribu. Al-Zubayr terbunuh di Wadi al-Siba'."
