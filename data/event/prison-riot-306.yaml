label: { ar: "شغب السجن الجديد وكسر حبوس مدينة المنصور", en: "The Riot at the New Prison and the Breaking of the Prisons of Madinat al-Mansur", es: "El motín en la nueva prisión y la fuga de las prisiones de Madinat al-Mansur.", fr: "L'émeute à la nouvelle prison et la prise d'otages dans les prisons de Madinat al-Mansur", ur: "نئی جیل میں فسادات اور مدینہ المنصور کی جیلوں کو توڑنا", tr: "Mansoura şehrinde yeni bir hapishane isyanı çıktı ve hapishane duvarları yıkıldı.", id: "Kerusuhan penjara baru dan perusakan tembok penjara di kota Mansoura." }
summary:
  ar: "في سنة ست وثلاثمائة شغب أهل السجن الجديد وصعدوا السور، فركب نزاد صاحب الشرطة وحاربهم وقتل منهم واحدًا ورمى برأسه إليهم فسكنوا؛ وفي سنة سبع وثلاثمائة كسرت العامة الحبوس بمدينة المنصور فأفلت من كان فيها، وكانت أبواب المدينة الحديد باقية فعلُّقت وتتبع أصحاب الشرط من أفلت فلم يفتهم أحد {cite:muntazam-ibn-al-jawzi p. 439, 446}."
  en: "In 306 the New Prison's inmates rioted and scaled the wall; the police chief Nazad fought them, killed one and threw his head back at them. In 307 the mob broke the prisons of al-Madina — the escapees were all rounded up, the iron gates left hanging {cite:muntazam-ibn-al-jawzi p. 439, 446}."
  es: "En el año 306, los reclusos de la Nueva Prisión se amotinaron y escalaron el muro; el jefe de policía Nazad luchó contra ellos, mató a uno y les arrojó la cabeza. En el año 307, la turba asaltó las prisiones de al-Madina; todos los fugados fueron capturados y las puertas de hierro quedaron abiertas {cite:muntazam-ibn-al-jawzi p. 439, 446}."
  fr: "En 306, les détenus de la Nouvelle Prison se révoltèrent et escaladèrent le mur; le chef de la police, Nazad, les affronta, en tua un et leur lança sa tête en arrière. En 307, la foule prit d'assaut les prisons d'al-Madina; les évadés furent tous rattrapés, les portes de fer laissées en suspens (Muntazam ibn al-Jawzi, p. 439, 446)."
  ur: "306 میں نیو جیل کے قیدیوں نے ہنگامہ آرائی کی اور دیوار کو توڑ دیا۔ پولیس چیف نزاد نے ان سے مقابلہ کیا، ایک کو مارا اور اپنا سر ان کی طرف واپس پھینک دیا۔ 307 میں ہجوم نے المدینہ کی جیلیں توڑ دیں - فرار ہونے والے تمام افراد کو گھیرے میں لے لیا گیا، لوہے کے دروازے لٹکائے ہوئے رہ گئے 439، 446}۔"
  tr: "306 yılında, yeni hapishanenin halkı isyan edip duvarı tırmandı. Bunun üzerine polis şefi Nizad atıyla çıktı ve onlarla savaştı, içlerinden birini öldürüp başını onlara fırlattı, böylece sakinleştiler. 307 yılında, halk Mansur şehrindeki hapishanelere girdi ve içeridekiler kaçtı. Şehrin demir kapıları hala yerindeydi, bu yüzden kapılar asıldı ve polis kaçanları kovaladı, ancak hiçbiri kaçamadı. {cite:muntazam-ibn-al-jawzi s. 439, 446}"
  id: "Pada tahun 306, penghuni penjara baru memberontak dan memanjat tembok, sehingga Nizad, kepala polisi, keluar dan melawan mereka, membunuh salah seorang dari mereka dan melemparkan kepalanya kepada mereka, sehingga mereka tenang. Pada tahun 307, rakyat jelata menerobos masuk ke penjara-penjara di kota Al-Mansur, sehingga mereka yang berada di dalamnya melarikan diri. Gerbang besi kota itu masih ada, sehingga mereka digantung, dan polisi mengejar mereka yang melarikan diri, dan tidak seorang pun dari mereka berhasil lolos. {cite:muntazam-ibn-al-jawzi p. 439, 446}."
