summary:
  ar: "في سنة ست وثلاثمائة شغب أهل السجن الجديد وصعدوا السور، فركب نزاد صاحب الشرطة وحاربهم وقتل منهم واحدًا ورمى برأسه إليهم فسكنوا؛ وفي سنة سبع وثلاثمائة كسرت العامة الحبوس بمدينة المنصور فأفلت من كان فيها، وكانت أبواب المدينة الحديد باقية فعلُّقت وتتبع أصحاب الشرط من أفلت فلم يفتهم أحد {cite:muntazam-ibn-al-jawzi p. 439, 446}."
  en: "In 306 the New Prison's inmates rioted and scaled the wall; the police chief Nazad fought them, killed one and threw his head back at them. In 307 the mob broke the prisons of al-Madina — the escapees were all rounded up, the iron gates left hanging {cite:muntazam-ibn-al-jawzi p. 439, 446}."
