  en: "In 463 came the great battle between Islam and Byzantium — the Muslims victorious under sultan Alp Arslan; the Roman king was captured, then released for a vast ransom and a fifty-year truce. Freed, he asked 'where is the caliph's quarter?' — it was pointed out, and he uncovered his head and gestured service in its direction {cite:tarikh-khulafa-minhaj-1434 p. 647}."
