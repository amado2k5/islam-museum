label: { ar: "وقعة ملاذكرد وأسر ملك الروم", en: "Battle of Manzikert and the Capture of the Roman King", fr: "La bataille de Manzikert et la capture du roi des Romains", es: "La batalla de Manzikert y la captura del rey romano.", ur: "منزیکرٹ کی جنگ اور رومن بادشاہ کی گرفتاری۔", tr: "Manzikert Muharebesi ve Bizans imparatorunun ele geçirilmesi", id: "Pertempuran Manzikert dan penangkapan kaisar Bizantium" }
summary:
  ar: "في سنة ثلاث وستين كانت وقعة عظيمة بين الإسلام والروم ونصر المسلمون ولله الحمد ومقدمهم السلطان ألب أرسلان وأسر ملك الروم ثم أطلقه بمال جزيل وهادنه خمسين سنة ولما أطلق قال للسلطان أين جهة الخليفة فأشار له فكشف رأسه وأومأ إلى الجهة بالخدمة {cite:tarikh-khulafa-minhaj-1434 p. 647}. ويورد ابن الجوزي تفصيل الوقعة: بقي السلطان في نحو أربعة آلاف غلام بعد انصراف العساكر إلى خراسان للغلاء، فآثر الغزاة والصبر وعهد إلى عسكره أن يسمعوا لولده ملكشاه ويطيعوه إن قتل، وكان ملك الروم قد جمع خمسة وثلاثين ألفاً من الإفرنج وغيرهم وخمسة عشر ألفاً من الغز وأربعمائة عجلة سلاح ومجانيق منها منجنيق يمدّه ألف رجل ومائتا رجل، ورفض الهدنة التي توسط فيها الخليفة وقال «لا هدنة إلا بالري ولا رجوع إلا بعد أن أفعل ببلاد الإسلام مثل ما فعل ببلاد الروم». وفي يوم الجمعة صلى السلطان بالعسكر ودعا وبكى وقال «من أحب أن يتبعني فليتبعني ومن أحب أن ينصرف فليمضِ مصاحباً عني فما ها هنا سلطان يأمر ولا عسكر يؤمر» ثم رمى القوس والنشاب وأخذ الدبوس وعقد ذنب فرسه بيده وزحف إلى الروم فقتلوهم يومهم وليلتهم القتل الذريع. وأسر ملك الروم وجيء به فضربه السلطان بيده ورفسه وقال «ألم آذن لرسل الخليفة في قصدك؟» فسأله «لو وقعتَ معي ماذا كنت تفعل بي؟» قال «القبيح» فقال «صدق والله ولو قال غير ذلك لكذب»، واستقر الفداء على ألف ألف وخمسمائة ألف دينار وثلاثمائة وستين ألف دينار في كل سنة وإطلاق أسارى الروم ورد أنطاكية والرها ومنبج، وخلع عليه وعقد له راية مكتوب عليها لا إله إلا الله محمد رسول الله وأنفذ معه مائة غلام إلى قسطنطينية، فلما بلغ الروم ما جرى حالوا بينه وبين ملكه {cite:muntazam-ibn-al-jawzi j.8 p.260-264}."
  en: "In 463 came the great battle between Islam and Byzantium — the Muslims victorious under sultan Alp Arslan; the Roman king was captured, then released for a vast ransom and a fifty-year truce. Freed, he asked 'where is the caliph's quarter?' — it was pointed out, and he uncovered his head and gestured service in its direction {cite:tarikh-khulafa-minhaj-1434 p. 647}."
  fr: "En 463 eut lieu la grande bataille entre l'islam et Byzance : les musulmans furent victorieux sous le sultan Alp Arslan ; le roi des Romains fut capturé, puis libéré contre une énorme rançon et une trêve de cinquante ans. Libéré, il demanda : « De quel côté se trouve le calife ? » ; on le lui indiqua, et il se découvrit la tête et fit un geste de service dans cette direction {cite:tarikh-khulafa-minhaj-1434 p. 647}."
  es: "En 463 tuvo lugar la gran batalla entre el Islam y Bizancio: los musulmanes resultaron victoriosos bajo el mando del sultán Alp Arslan; el rey romano fue capturado, pero luego liberado tras un cuantioso rescate y una tregua de cincuenta años. Una vez liberado, preguntó: \"¿Dónde está el cuartel del califa?\". Se lo señalaron, y él descubrió su cabeza e hizo un gesto de servicio en esa dirección {cite:tarikh-khulafa-minhaj-1434 p. 647}."
  ur: "463 میں اسلام اور بازنطیم کے درمیان عظیم جنگ ہوئی - سلطان الپ ارسلان کی قیادت میں مسلمانوں کی فتح؛ رومن بادشاہ کو گرفتار کر لیا گیا، پھر ایک وسیع تاوان اور پچاس سالہ جنگ بندی کے لیے رہا کر دیا گیا۔ آزاد ہو کر پوچھا خلیفہ کا کوارٹر کہاں ہے؟ اس کی طرف اشارہ کیا گیا اور اس نے اپنا سر ننگا کیا اور اس کی طرف اشارہ کیا 647}۔"
  tr: "Hicri 63 yılında Müslümanlar ile Bizanslılar arasında büyük bir savaş yaşandı ve Allah'a şükürler olsun ki Sultan Alp Arslan önderliğinde Müslümanlar galip geldi. Bizans imparatoru esir alındı, sonra büyük bir para karşılığında serbest bırakıldı ve kendisiyle elli yıllık bir ateşkes yapıldı. Serbest bırakıldığında Sultan'a, \"Halife nerede?\" diye sordu. Sultan işaret etti ve imparator başını açıp o yöne doğru işaret ederek hizmetini belirtti. {cite:tarikh-khulafa-minhaj-1434 s. 647}. İbn el-Cevzi, savaş hakkında ayrıntılı bir anlatım sunmaktadır: Ordu yüksek fiyatlar nedeniyle Horasan'a gittikten sonra Sultan yaklaşık dört bin hizmetkarıyla kaldı. Savaşmayı ve sabırlı olmayı tercih etti ve ordusuna oğlu Malik Şah'ı dinlemelerini ve öldürülürse ona itaat etmelerini emretti. Bizans imparatoru otuz beş bin Frank ve diğerleri, on beş bin Guzz, dört yüz savaş arabası dolusu silah ve mancınık toplamıştı; bunlardan biri bin iki yüz adam tarafından destekleniyordu. Halifenin arabuluculuğuyla yapılan ateşkesi reddetti ve şöyle dedi: \"Ray dışında ateşkes olmayacak ve İslam topraklarına onun Bizans topraklarına yaptığını yapana kadar geri çekilme olmayacak.\" Cuma günü Sultan ordusuna namaz kıldırdı, ağladı ve şöyle dedi: \"Kim benimle gelmek isterse gelsin; kim ayrılmak isterse benimle gitsin, çünkü burada komuta edecek bir sultan veya komuta edilecek bir ordu yok.\" Sonra yayını ve oklarını yere attı, gürzünü aldı, atının kuyruğunu kendi eliyle bağladı ve Romalılara karşı yürüdü, onları o gün ve gece acımasızca katletti. Roma imparatoru yakalandı ve Sultan'ın huzuruna getirildi. Sultan ona eliyle vurdu ve tekmeledi, \"Halife'nin elçilerinin seni almaya gelmesine izin vermedim mi?\" dedi. İmparator ona, \"Eğer benim elime düşseydin, bana ne yapardın?\" diye sordu. İmparator, \"Çirkin olanı,\" dedi. Sultan da, \"Allah'a yemin ederim ki haklı, aksini söyleseydi yalan söylemiş olurdu,\" dedi. Fidye bir milyon beş yüz bin dinar ve her yıl üç yüz altmış bin dinar olarak belirlendi ve Romalı esirlerin serbest bırakılması ve Antakya, Edessa ve Manbij'in iadesi şart koşuldu. Ona şeref elbisesi ve üzerinde \"Allah'tan başka ilah yoktur, Muhammed Allah'ın elçisidir\" yazılı bir sancak verildi. Yanında yüz köleyle birlikte Konstantinopolis'e gitti. Romalılar olanları öğrenince, onu krallığından men ettiler. {cite:muntazam-ibn-al-jawzi j.8 p.260-264}"
  id: "Pada tahun 63 Hijriah, terjadi pertempuran besar antara kaum Muslim dan Bizantium, dan kaum Muslim meraih kemenangan, alhamdulillah, dipimpin oleh Sultan Alp Arslan. Kaisar Bizantium ditangkap, kemudian dibebaskan dengan sejumlah besar uang, dan gencatan senjata disepakati dengannya selama lima puluh tahun. Ketika dibebaskan, ia bertanya kepada Sultan, \"Di mana Khalifah?\" Sultan menunjuk, dan kaisar membuka kepalanya dan memberi isyarat ke arah itu, menunjukkan pengabdiannya. {cite:tarikh-khulafa-minhaj-1434 p. 647}. Ibn al-Jawzi memberikan catatan rinci tentang pertempuran tersebut: Sultan tetap tinggal bersama sekitar empat ribu pelayan setelah pasukan berangkat ke Khorasan karena harga yang tinggi. Ia lebih memilih untuk bertempur dan bersabar, dan ia memerintahkan pasukannya untuk mendengarkan putranya, Malik Shah, dan menaatinya jika ia terbunuh. Kaisar Bizantium telah mengumpulkan tiga puluh lima ribu orang Frank dan lainnya, lima belas ribu Ghuzz, empat ratus kereta perang, dan ketapel, termasuk satu ketapel yang dipasok oleh seribu dua ratus orang. Dia menolak gencatan senjata yang ditengahi oleh Khalifah dan berkata, \"Tidak akan ada gencatan senjata kecuali di Rayy, dan tidak akan ada mundur sampai aku melakukan terhadap tanah Islam apa yang dia lakukan terhadap tanah Bizantium.\" Pada hari Jumat, Sultan memimpin pasukannya dalam doa, menangis, dan berkata, “Siapa pun yang ingin mengikutiku, biarlah dia mengikutiku; dan siapa pun yang ingin pergi, biarlah dia pergi bersamaku, karena tidak ada sultan di sini untuk memerintah, atau pasukan untuk diperintah.” Kemudian dia menembak busur dan anak panahnya, mengambil gada, mengikat ekor kudanya dengan tangannya sendiri, dan berbaris melawan Romawi, membantai mereka tanpa ampun siang dan malam itu. Kaisar Romawi ditangkap dan dibawa ke hadapan Sultan, yang memukulnya dengan tangannya dan menendangnya, sambil berkata, “Bukankah aku mengizinkan utusan Khalifah datang menjemputmu?” Kaisar bertanya kepadanya, “Jika kau jatuh ke tanganku, apa yang akan kau lakukan padaku?” Ia menjawab, “Yang jelek itu,” dan kaisar berkata, “Demi Allah, dia benar, dan jika dia mengatakan sebaliknya, dia akan berbohong.” Uang tebusan ditetapkan sebesar satu juta lima ratus ribu dinar dan tiga ratus enam puluh ribu dinar setiap tahun, serta pembebasan tawanan Romawi dan pengembalian Antiokhia, Edessa, dan Manbij. Ia diberi jubah kehormatan dan panji yang bertuliskan, “Tidak ada Tuhan selain Allah, Muhammad adalah Rasul Allah.” Ia mengirim seratus budak bersamanya ke Konstantinopel. Ketika orang Romawi mengetahui apa yang telah terjadi, mereka mencegahnya kembali ke kerajaannya. {cite:muntazam-ibn-al-jawzi j.8 p.260-264}"
