id: event/reports-of-al-hadis-seal-and-two-cures-told-at-khiwan-286
class: event
kind: other
label:
  ar: أخبار خاتم الهادي والشفاء به يرويها رجلان من السبيع وحجور في خيوان، شعبان 286هـ
  en: Reports of al-Hadi's seal and two cures, told by men of al-Subay' and Hajur at Khiwan, Sha'ban 286 AH
  ur: ہادی کی مہر اور شفا کی دو خبریں، جو سبیع اور حجور کے دو آدمی خیوان میں سناتے ہیں، شعبان 286ھ
  es: "Relatos del sello de al-Hadi y dos curaciones, contados por hombres de al-Subay' y Hajur en Khiwan, Sha'ban 286 AH."
  fr: "Récits concernant le sceau d'al-Hadi et deux guérisons, rapportés par des hommes d'al-Subay' et de Hajur à Khiwan, en Sha'ban 286 AH."
  tr: "Hidayet yüzüğü ve onun aracılığıyla gelen şifa haberi, Hicri 286 yılının Şaban ayında Hayvan'da, Subey ve Hacer adlı iki adam tarafından anlatılmıştır."
  id: "Kabar tentang cincin petunjuk dan penyembuhan melalui cincin itu diriwayatkan oleh dua orang dari Al-Subai’ dan Hajur di Khaywan, Sya’ban 286 H."
summary:
  ar: يروي أبو جعفر محمد بن سليمان أنه بقي في المسجد بعد الجمعة فسمع جماعة من بني ربيعة وحجور يتحدثون عمن يقاتل الهادي، وسمع رجلاً ينقل عن شعيب من أهل السبيع من أرحب، وكان ممن عاونوا ابن الدعام في حربه وشكّوا في الهادي، أنه مرض في حلقه حتى أشرف على الموت فأخذ خاتم كتاب الهادي وأكله داعياً فشُفي، ثم يضيف إبراهيم بن سليمان من حجور خبراً مشابهاً عن رجل يسيل بطنه.
  en: 'Muhammad ibn Sulayman tells how he stayed in the mosque after the Friday prayer and overheard men of Banu Rabi''a and Hajur talking about those who fight al-Hadi; one relates what Shu''ayb of al-Subay'' of Arhab, who had helped al-Da''am''s side and doubted al-Hadi, told him: gravely ill in the throat and near death, he took the seal from a letter of al-Hadi, prayed and ate it, and recovered; then Ibrahim ibn Sulayman of Hajur adds a similar report about a man whose bowels ran night and day.'
  ur: 'محمد بن سلیمان بتاتے ہیں کہ جمعے کے بعد وہ مسجد میں رکے رہے اور بنو ربیعہ اور حجور کے لوگوں کو ہادی سے لڑنے والوں کے بارے میں باتیں کرتے سنا؛ ایک شخص ارحب کے سبیع کے شعیب کی بات نقل کرتا ہے جو دعام کے ساتھیوں کی مدد کرتا اور ہادی کی بابت شک میں تھا: حلق کی شدید بیماری سے وہ موت کے قریب پہنچا، ہادی کے خط کی مہر لے کر دعا کر کے کھا گیا اور شفا پائی؛ پھر حجور کے ابراہیم بن سلیمان ایک ایسے آدمی کا ملتا جلتا واقعہ سناتے ہیں جس کا پیٹ دن رات چلتا تھا۔'
  es: "Muhammad ibn Sulayman cuenta cómo se quedó en la mezquita después de la oración del viernes y oyó a hombres de Banu Rabi'a y Hajur hablando de los que luchan contra al-Hadi; uno relata lo que Shu'ayb de al-Subay' de Arhab, que había ayudado al bando de al-Da'am y dudaba de al-Hadi, le dijo: gravemente enfermo de garganta y al borde de la muerte, tomó el sello de una carta de al-Hadi, rezó y se lo comió, y se recuperó; luego Ibrahim ibn Sulayman de Hajur añade un relato similar sobre un hombre cuyos intestinos corrían día y noche."
  fr: "Muhammad ibn Sulayman raconte comment, après la prière du vendredi, il resta à la mosquée et surprit une conversation entre des hommes des Banu Rabi'a et de Hajur au sujet de ceux qui combattaient al-Hadi. L'un d'eux rapporte ce que Shu'ayb d'al-Subay' d'Arhab, qui avait soutenu le camp d'al-Da'am et doutait d'al-Hadi, lui dit: gravement malade de la gorge et proche de la mort, il prit le sceau d'une lettre d'al-Hadi, pria, le mangea et guérit. Ibrahim ibn Sulayman de Hajur ajoute ensuite un récit similaire à propos d'un homme dont les intestins coulaient jour et nuit."
  tr: "Ebu Cafer Muhammed bin Süleyman, Cuma namazından sonra mescitte kaldığını ve Beni Rabi'ah ve Hajur'dan bir grup insanın Hadi'ye karşı kimin savaştığı hakkında konuştuğunu duyduğunu anlatır. İbn el-Da'am'ın savaşında ona yardım eden ve Hadi'den şüphelenenlerden biri olan Arhab'lı Subey' halkından Şuayb'dan bir adamın, boğazında bir hastalık olduğunu ve neredeyse ölüm döşeğinde olduğunu, bu yüzden Hadi'nin kitabının mührünü alıp namaz kılarken yediğini ve iyileştiğini anlattığını işitti. Daha sonra Hajur'dan İbrahim bin Süleyman, midesi sızdıran bir adam hakkında benzer bir hikaye ekler."
  id: "Abu Ja'far Muhammad bin Sulayman meriwayatkan bahwa ia tinggal di masjid setelah salat Jumat dan mendengar sekelompok orang dari Bani Rabi'ah dan Hajur berbicara tentang siapa yang memerangi al-Hadi. Ia mendengar seorang pria meriwayatkan dari Syu'aib dari kaum al-Subay' dari Arhab, yang termasuk di antara mereka yang membantu Ibn al-Da'am dalam perangnya dan meragukan al-Hadi, bahwa ia menderita penyakit di tenggorokannya hingga hampir meninggal, lalu ia mengambil segel kitab al-Hadi dan memakannya sambil salat, dan ia sembuh. Kemudian Ibrahim bin Sulayman dari Hajur menambahkan kisah serupa tentang seorang pria yang perutnya bocor."
