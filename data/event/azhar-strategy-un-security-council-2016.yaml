label: { ar: "كلمة الأزهر في مجلس الأمن عن استراتيجيته في مواجهة الفكر المتطرف" }
summary:
  ar: "ألقى محيي الدين عفيفي أحمد، ممثلًا للأزهر، كلمة في مجلس الأمن بنيويورك عن استراتيجية الأزهر الشريف في مواجهة الفكر المتطرف، وترأس الجلسة وزير الخارجية المصري في الوقت الذي كانت فيه مصر تترأس لجنة مكافحة الإرهاب بالمجلس {cite:nazarat-mawdu-iyya-azhar p. 95}. يرى الكاتب أن التطرف يبقى في دائرة الفكر، فإذا اقترن بالعنف المادي أو التكفير أو التهديد به صار إرهابًا {cite:nazarat-mawdu-iyya-azhar p. 99}. ويعدّد الكاتب ما يقوم به الأزهر: مناقشة الأفكار المتطرفة والرد عليها عبر الإنترنت، وبرامج تدريب للدعاة من عدة بلاد، ومع مجلس حكماء المسلمين قوافل سلام إلى خمس عشرة دولة {cite:nazarat-mawdu-iyya-azhar p. 101}، وأنشأ الأزهر مرصدًا إلكترونيًا يرد على ما تنشره داعش {cite:nazarat-mawdu-iyya-azhar p. 102}."
  en: "Muhyi al-Din Afifi Ahmad, speaking for al-Azhar, addressed the UN Security Council in New York on al-Azhar's strategy against extremist thought; the session was chaired by Egypt's foreign minister while Egypt chaired the council's counter-terrorism committee (p. 95). The author holds that extremism stays in the realm of thought, and becomes terrorism when it is tied to physical violence, takfir or the threat of violence (p. 99). He lists al-Azhar's work: online rebuttal of extremist ideas, training courses for preachers, an online observatory answering Daesh's posts, and joint initiatives with the Council of Muslim Elders (p. 100-102)."
