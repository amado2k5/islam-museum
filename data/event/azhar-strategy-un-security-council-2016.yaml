label: { ar: "كلمة الأزهر في مجلس الأمن عن استراتيجيته في مواجهة الفكر المتطرف", fr: "L'allocution d'al-Azhar au Conseil de sécurité sur sa stratégie face à la pensée extrémiste", tr: "El-Azhar'ın aşırılıkçı ideolojiyle mücadele stratejisine ilişkin Güvenlik Konseyi'ne yaptığı açıklama.", id: "Pernyataan Al-Azhar kepada Dewan Keamanan mengenai strateginya untuk menghadapi ideologi ekstremis" }
summary:
  ar: "ألقى محيي الدين عفيفي أحمد، ممثلًا للأزهر، كلمة في مجلس الأمن بنيويورك عن استراتيجية الأزهر الشريف في مواجهة الفكر المتطرف، وترأس الجلسة وزير الخارجية المصري في الوقت الذي كانت فيه مصر تترأس لجنة مكافحة الإرهاب بالمجلس {cite:nazarat-mawdu-iyya-azhar p. 95}. يرى الكاتب أن التطرف يبقى في دائرة الفكر، فإذا اقترن بالعنف المادي أو التكفير أو التهديد به صار إرهابًا {cite:nazarat-mawdu-iyya-azhar p. 99}. ويعدّد الكاتب ما يقوم به الأزهر: مناقشة الأفكار المتطرفة والرد عليها عبر الإنترنت، وبرامج تدريب للدعاة من عدة بلاد، ومع مجلس حكماء المسلمين قوافل سلام إلى خمس عشرة دولة {cite:nazarat-mawdu-iyya-azhar p. 101}، وأنشأ الأزهر مرصدًا إلكترونيًا يرد على ما تنشره داعش {cite:nazarat-mawdu-iyya-azhar p. 102}."
  en: "Muhyi al-Din Afifi Ahmad, speaking for al-Azhar, addressed the UN Security Council in New York on al-Azhar's strategy against extremist thought; the session was chaired by Egypt's foreign minister while Egypt chaired the council's counter-terrorism committee (p. 95). The author holds that extremism stays in the realm of thought, and becomes terrorism when it is tied to physical violence, takfir or the threat of violence (p. 99). He lists al-Azhar's work: online rebuttal of extremist ideas, training courses for preachers, an online observatory answering Daesh's posts, and joint initiatives with the Council of Muslim Elders (p. 100-102)."
  fr: "Muhyi al-Din Afifi Ahmad, s'exprimant au nom d'al-Azhar, présenta au Conseil de sécurité de l'ONU, à New York, la stratégie d'al-Azhar contre la pensée extrémiste ; la séance était présidée par le ministre égyptien des Affaires étrangères, alors que l'Égypte présidait le comité contre le terrorisme du Conseil (p. 95). L'auteur estime que l'extrémisme reste dans le domaine de la pensée et devient terrorisme lorsqu'il s'accompagne de violence physique, de takfir ou de menace de violence (p. 99). Il énumère les actions d'al-Azhar : réfutation en ligne des idées extrémistes, formations pour les prédicateurs, un observatoire en ligne répondant aux publications des groupes extrémistes, et des initiatives communes avec le Conseil des sages musulmans (p. 100-102)."
  es: "Muhyi al-Din Afifi Ahmad, en representación de Al-Azhar, se dirigió al Consejo de Seguridad de la ONU en Nueva York para exponer la estrategia de Al-Azhar contra el pensamiento extremista. La sesión fue presidida por el ministro de Asuntos Exteriores de Egipto, país que presidía el comité antiterrorista del Consejo (pág. 95). El autor sostiene que el extremismo se mantiene en el ámbito del pensamiento y se convierte en terrorismo cuando se vincula con la violencia física, el takfir o la amenaza de violencia (pág. 99). Enumera las actividades de Al-Azhar: refutación en línea de ideas extremistas, cursos de formación para predicadores, un observatorio en línea que responde a las publicaciones de Daesh e iniciativas conjuntas con el Consejo de Ancianos Musulmanes (págs. 100-102)."
  ur: "محی الدین عفیفی احمد نے الازہر کے لیے بات کرتے ہوئے، نیویارک میں اقوام متحدہ کی سلامتی کونسل سے انتہا پسندانہ سوچ کے خلاف الازہر کی حکمت عملی پر خطاب کیا۔ اجلاس کی صدارت مصر کے وزیر خارجہ نے کی جبکہ مصر نے کونسل کی انسداد دہشت گردی کمیٹی کی صدارت کی ⁦(ص 95)⁩۔ مصنف کا خیال ہے کہ انتہا پسندی فکر کے دائرے میں رہتی ہے، اور جب اسے جسمانی تشدد، تکفیر یا تشدد کے خطرے سے جوڑ دیا جائے تو دہشت گردی بن جاتی ہے ⁦(ص 99)⁩۔ وہ الازہر کے کام کی فہرست دیتا ہے: انتہا پسندانہ نظریات کی آن لائن تردید، مبلغین کے لیے تربیتی کورس، داعش کی پوسٹس کا جواب دینے والی ایک آن لائن آبزرویٹری، اور مسلم بزرگوں کی کونسل کے ساتھ مشترکہ اقدامات ⁦(ص 100-102)⁩۔"
  tr: "El-Azhar'ı temsilen Muhyiddin Afifi Ahmed, New York'taki BM Güvenlik Konseyi'nde El-Azhar'ın aşırılıkçı ideolojiyle mücadele stratejisi hakkında bir konuşma yaptı. Oturuma Mısır Dışişleri Bakanı başkanlık ediyordu ve o sırada Mısır, Konseyin Terörle Mücadele Komitesi'ne başkanlık ediyordu {kaynak:nazarat-mawdu-iyya-azhar s. 95}. Yazar, aşırılığın düşünce alanında kaldığını, ancak fiziksel şiddet, tekfir (birini mürted ilan etme) veya bunların tehdidiyle birleştiğinde terörizme dönüştüğünü savunuyor {kaynak:nazarat-mawdu-iyya-azhar s. 99}. Yazar, El-Azhar'ın çabalarını şöyle sıralıyor: aşırılıkçı fikirleri çevrimiçi olarak tartışmak ve çürütmek, çeşitli ülkelerden vaizler için eğitim programları ve Müslüman Yaşlılar Konseyi ile birlikte on beş ülkeye barış konvoyları düzenlemek {kaynak:nazarat-mawdu-iyya-azhar s. 101}. El-Ezher ayrıca IŞİD propagandasına karşı koymak için çevrimiçi bir gözlemevi kurdu {cite:nazarat-mawdu-iyya-azhar s. 102}."
  id: "Mewakili Al-Azhar, Muhyiddin Afifi Ahmed menyampaikan pidato di Dewan Keamanan PBB di New York tentang strategi Al-Azhar untuk menghadapi ideologi ekstremis. Sesi tersebut dipimpin oleh Menteri Luar Negeri Mesir, pada saat Mesir memimpin Komite Kontra-Terorisme Dewan {cite:nazarat-mawdu-iyya-azhar hlm. 95}. Penulis berpendapat bahwa ekstremisme tetap berada dalam ranah pemikiran, tetapi ketika digabungkan dengan kekerasan fisik, takfir (menyatakan seseorang sebagai murtad), atau ancaman terhadapnya, maka itu menjadi terorisme {cite:nazarat-mawdu-iyya-azhar hlm. 99}. Penulis mencantumkan upaya Al-Azhar: membahas dan membantah ide-ide ekstremis secara daring, program pelatihan untuk para pendakwah dari berbagai negara, dan, bersama dengan Dewan Tetua Muslim, konvoi perdamaian ke lima belas negara {cite:nazarat-mawdu-iyya-azhar hlm. 101}. Al-Azhar juga mendirikan observatorium online untuk melawan propaganda ISIS {cite:nazarat-mawdu-iyya-azhar p. 102}."
