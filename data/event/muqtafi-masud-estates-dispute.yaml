id: event/muqtafi-masud-estates-dispute
class: event
kind: other
label: { ar: "مصادرة مسعود أموال الخلافة وجواب المقتفي" }
summary:
  ar: "أخذ السلطان مسعود جميع ما في دار الخلافة من دواب وأثاث وذهب وستور وسرادق ولم يترك في اصطبل الخلافة سوى أربعة أفراس وثمانية أبغال برسم الماء فيقال إنهم بايعوا المقتفي على ألا يكون عنده خيل ولا آلة سفر، ثم في سنة إحدى وثلاثين أخذ جميع تعلق الخليفة وأرسل وزيره يطلب مئة ألف دينار فقال المقتفي ما رأينا أعجب من أمرك أنت تعلم أن المسترشد سار إليك بأمواله فجرى ما جرى وأن الراشد فعل ما فعل ورحل وأخذ ما تبقى ولم يبق إلا الأثاث فأخذته كله وتصرفت في دار الضرب وأخذت التركات والجوالي فمن أي وجه نقيم لك هذا المال وما بقي إلا أن نخرج من الدار ونسلمها فإني عاهدت الله ألا آخذ من المسلمين حبة ظلماً فترك السلطان الأخذ من الخليفة ثم في جمادى الأولى أعيدت بلاد الخليفة ومعاملاته والتركات إليه {cite:tarikh-khulafa-minhaj-1434 p. 671-672}."
  en: "Mas'ud stripped the caliphal palace — four mares and eight mules left in the stable — then in 531 seized all the caliph's estates and demanded a hundred thousand dinars. Al-Muqtafi's answer: 'What wonder — you know what befell al-Mustarshid's wealth at your hands, what al-Rashid took, and that you seized the furniture, the mint, the estates and the tolls. From what shall we raise it? Nothing remains but to hand you the palace itself — I have sworn to God not to take a grain wrongfully from the Muslims'. The sultan desisted, and in Jumada I the caliph's lands were restored {cite:tarikh-khulafa-minhaj-1434 p. 671-672}."
