label: { ar: "حفر نهر الأنبار", en: "The Digging of the Anbar Canal", es: "La excavación del canal de Anbar", fr: "Le creusement du canal d'Anbar", ur: "نہر الانبار کی کھدائی", tr: "Anbar Nehri'ni Kazmak", id: "Penggalian Sungai Anbar" }
summary:
  ar: "عند البلاذري: سأل دهاقين الأنبار سعد بن أبي وقاص أن يحفر لهم نهراً كانوا سألوا عظيم الفرس حفره لهم فكتب إلى سعد بن عمرو بن حرام يأمره بحفره لهم فجمع الرجال لذلك فحفروه حتى انتهوا إلى جبل لم يمكن شقه فتركوه فلما ولي الحجاج العراق جمع الفعلة من كل ناحية وقال لقوامه انظروا إلى قيمة ما يأكل رجل من الحفارين في اليوم فإن كان وزنه مثل وزن ما يقلع فلا تمتنعوا من الحفر فأنفقوا عليه حتى استتموه فنسب ذلك الجبل إلى الحجاج ونسب النهر إلى سعد بن عمرو بن حرام وأمرت الخيزران أم الخلفاء أن يحفر النهر المعروف بمحدود فسمته الريان وكان وكيلها جعله أقساماً وحدّ كل قسم ووكل بحفره قوماً فسمي محدوداً وأما النهر المعروف بشيلى فإن بني شيلى بن فروخزادان المروزي يدعون أن سابور حفره لجدهم حين رتبه بنغيا من طسوج الأنبار والذي يقول غيرهم إنه نسب إلى رجل يقال له شيلى كان متقبلاً لحفره وكانت له عليه مبقلة في أيام المنصور وأن هذا النهر كان قديماً مندفناً."
  en: "In al-Baladhuri: Anbar's dihqans asked Sa'd ibn Abi Waqqas to dig them a canal they had already asked Persia's lord to dig; he wrote to Sa'd ibn Amr ibn Haram ordering it dug — the men dug until reaching a mountain that could not be cut, and left it. When al-Hajjaj governed Iraq he gathered labourers from every quarter and told his overseers 'see what a digger eats in a day — if it weighs what he hews out, do not hold back from digging,' and they spent on it till finished; that mountain was named for al-Hajjaj and the river for Sa'd ibn Amr ibn Haram. Al-Khayzuran, mother of the caliphs, ordered the canal called Mahdud dug — she named it al-Rayyan — her agent dividing it into sections, each section bounded and a crew assigned to dig it, whence 'Mahdud'; as for the river called Shayla, the sons of Shayla ibn Farrukhzadhan al-Marwazi claim Sapur dug it for their grandfather when he installed him as nighya of Anbar's tassuj — while others say it was named for a man called Shayla who contracted its digging and held a mabqala over it in al-Mansur's days, the canal having been long buried."
  es: "En al-Baladhuri: los dihqans de Anbar pidieron a Sa'd ibn Abi Waqqas que cavara un canal que ya le habían pedido al señor de Persia que cavara; él escribió a Sa'd ibn Amr ibn Haram ordenándole que lo cavara; los hombres cavaron hasta llegar a una montaña que no se podía cortar y la dejaron. Cuando al-Hajjaj gobernaba Irak, reunió trabajadores de todos los rincones y les dijo a sus supervisores: \"Vean lo que come un cavador en un día; si pesa lo que extrae, no dejen de cavar\", y gastaron en ello hasta terminar; esa montaña recibió el nombre de al-Hajjaj y el río el de Sa'd ibn Amr ibn Haram. Al-Khayzuran, madre de los califas, ordenó que se cavara el canal llamado Mahdud; ella lo llamó al-Rayyan; su agente lo dividió en secciones, cada sección delimitada y un equipo asignado para cavarla, de donde proviene \"Mahdud\"; En cuanto al río llamado Shayla, los hijos de Shayla ibn Farrukhzadhan al-Marwazi afirman que Sapur lo excavó para su abuelo cuando lo nombró nighya del tassuj de Anbar, mientras que otros dicen que recibió su nombre de un hombre llamado Shayla que contrató su excavación y celebró un mabqala sobre él en tiempos de al-Mansur, ya que el canal había estado enterrado durante mucho tiempo."
  fr: "Dans al-Baladhuri: les dihqans d’Anbar demandèrent à Sa’d ibn Abi Waqqas de creuser un canal, comme ils l’avaient déjà demandé au seigneur de Perse. Ce dernier écrivit à Sa’d ibn Amr ibn Haram pour lui ordonner de le faire creuser. Les hommes creusèrent jusqu’à atteindre une montagne infranchissable et l’abandonnèrent. Lorsque al-Hajjaj gouverna l’Irak, il rassembla des ouvriers de toutes parts et dit à ses contremaîtres: « Voyez ce qu’un terrassier mange en une journée; si cela correspond au poids de ce qu’il extrait, ne vous interrompez pas. » Ils s’y consacrèrent pleinement jusqu’à la fin. Cette montagne fut nommée en l’honneur d’al-Hajjaj et le fleuve en l’honneur de Sa’d ibn Amr ibn Haram. Al-Khayzuran, mère des califes, ordonna le creusement du canal appelé Mahdud – qu'elle nomma al-Rayyan – son agent le divisant en sections, chaque section étant délimitée et une équipe affectée à son creusement, d'où le nom « Mahdud »; quant à la rivière appelée Shayla, les fils de Shayla ibn Farrukhzadhan al-Marwazi affirment que Sapur la creusa pour leur grand-père lorsqu'il l'installa comme nighya du tassuj d'Anbar – tandis que d'autres disent qu'elle fut nommée d'après un homme appelé Shayla qui en commanda le creusement et organisa une mabqala à son sujet à l'époque d'al-Mansur, le canal étant depuis longtemps enterré."
  ur: "البلادوری میں ہے: انبار کے دہقان نے سعد بن ابی وقاص سے کہا کہ وہ انہیں ایک نہر کھودیں جو انہوں نے فارس کے آقا سے پہلے ہی کھودنے کو کہا تھا۔ اس نے سعد بن عمرو بن حرام کو لکھا کہ اسے کھودنے کا حکم دیا - لوگوں نے کھدائی یہاں تک کہ ایک پہاڑ پر پہنچ گئے جسے کاٹا نہیں جاسکتا تھا اور اسے چھوڑ دیا۔ جب الحجاج نے عراق پر حکومت کی تو اس نے ہر چوتھائی سے مزدوروں کو اکٹھا کیا اور اپنے نگرانوں سے کہا کہ دیکھو کھودنے والا ایک دن میں کیا کھاتا ہے - اگر اس کا وزن ہو تو وہ کھودنے سے باز نہ آنا، اور انہوں نے اس پر خرچ کیا جب تک وہ ختم نہ ہو جائے۔ اس پہاڑ کا نام حجاج اور دریا کا نام سعد بن عمرو بن حرام رکھا گیا تھا۔ خلفاء کی والدہ الخیزوران نے مہدود نامی نہر کو کھودنے کا حکم دیا - اس نے اسے الریان کا نام دیا - اس کے ایجنٹ نے اسے حصوں میں تقسیم کیا، ہر ایک حصے کو بند کیا گیا تھا اور اسے کھودنے کے لیے ایک عملہ مقرر کیا گیا تھا، جہاں سے 'محدود'؛ جہاں تک شائلہ نامی دریا کا تعلق ہے، شیلہ بن فرخزادن المروازی کے بیٹوں کا دعویٰ ہے کہ ساپور نے اسے اپنے دادا کے لیے کھودا جب اس نے اسے عنبر کے تسج کے لیے رکھا تھا - جب کہ دوسرے کہتے ہیں کہ اس کا نام شائلہ نامی ایک شخص کے نام پر رکھا گیا تھا جس نے اس کی کھدائی کا ٹھیکہ لیا تھا اور اس پر مبقل رکھا تھا، المنصور میں طویل عرصہ گزرا تھا۔"
  tr: "El-Baladhuri'ye göre: Anbar toprak sahipleri, daha önce Pers hükümdarından istedikleri gibi, Sa'd ibn Abi Waqqas'tan da kendileri için bir kanal kazmasını istediler. Sa'd ibn Amr ibn Haram'a yazarak kanalı kazmasını emretti. Sa'd bu amaçla adamlar topladı ve geçilemeyecek bir dağa ulaşana kadar kazdılar, bu yüzden projeyi bıraktılar. El-Hajjaj Irak valisi olduğunda, her bölgeden işçi topladı ve denetçilerine, \"Her kazıcının günlük gelirini göz önünde bulundurun. Eğer kazdıkları ağırlığın ağırlığına eşitse, kazmayı bırakmayın\" dedi. Kazı tamamlanana kadar para harcadılar. Dağ daha sonra El-Hajjaj'a, kanal ise Sa'd ibn Amr ibn Haram'a atfedildi. Halifelerin annesi El-Khayzuran, Mahdud olarak bilinen kanalın kazılmasını emretti ve ona el-Rayyan adını verdi. Temsilcisi onu bölümlere ayırdı, her bölümü işaretledi ve kazmak için insanları görevlendirdi; bu nedenle adı Mahdud oldu. Şili olarak bilinen kanala gelince, Şili ibn Farrukhzadan el-Marwazi'nin torunları, Şapur'un Anbar bölgesinde bir kol kurduğunda ataları için kazdığını iddia ederler. Diğerleri ise, kanalın kazılmasından sorumlu olan ve üzerinde hak iddia eden Şili adlı bir adamın adını taşıdığını söyler. El-Mansur döneminde burası bir sebze bahçesiydi ve bu nehir eski zamanlarda gömülmüştü."
  id: "Menurut al-Baladhuri: Para pemilik tanah di Anbar meminta Sa'd ibn Abi Waqqas untuk menggali kanal bagi mereka, sebagaimana sebelumnya mereka telah meminta hal yang sama kepada penguasa Persia. Ia menulis surat kepada Sa'd ibn Amr ibn Haram, memerintahkannya untuk menggali kanal tersebut. Sa'd mengumpulkan orang-orang untuk tujuan ini, dan mereka menggali hingga mencapai sebuah gunung yang tidak dapat ditembus, sehingga mereka menghentikan proyek tersebut. Ketika al-Hajjaj menjadi gubernur Irak, ia mengumpulkan para pekerja dari setiap wilayah dan berkata kepada para pengawasnya, \"Pertimbangkan pendapatan harian setiap penggali. Jika pendapatan tersebut sama dengan berat benda yang mereka gali, maka jangan berhenti menggali.\" Mereka mengeluarkan uang untuk penggalian hingga selesai. Gunung tersebut kemudian dikaitkan dengan al-Hajjaj, dan kanal tersebut dengan Sa'd ibn Amr ibn Haram. Al-Khayzuran, ibu para khalifah, memerintahkan penggalian kanal yang dikenal sebagai Mahdud, dan ia menamainya al-Rayyan. Agennya membagi kanal tersebut menjadi beberapa bagian, menandai setiap bagian, dan menugaskan orang-orang untuk menggali, sehingga dinamakan Mahdud. Adapun kanal yang dikenal sebagai Shili, keturunan Shili ibn Farrukhzadan al-Marwazi mengklaim bahwa Shapur menggali kanal tersebut untuk leluhur mereka ketika ia mendirikan cabang di distrik Anbar. Yang lain mengatakan bahwa kanal tersebut dinamai menurut nama seorang pria bernama Shili yang bertanggung jawab atas penggaliannya dan memiliki hak atas kanal tersebut. Kanal ini dulunya merupakan kebun sayur pada masa Al-Mansur, dan sungai ini terkubur pada zaman kuno."
