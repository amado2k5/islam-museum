label: { ar: "قتل مرداويج بن زياد", en: "The killing of Mardawij ibn Ziyad", es: "El asesinato de Mardawij ibn Ziyad", fr: "Le meurtre de Mardawij ibn Ziyad", ur: "مردویج ابن زیاد کا قتل", tr: "Mardawij bin Ziyad öldürüldü.", id: "Mardawij bin Ziyad terbunuh" }
summary:
  ar: "في سنة ثلاث وعشرين وثلاثمائة قُتل مرداويج الديلمي صاحب بلاد الجبل، وكان سبب قتله أنه كثّر الأذى لأتراكه غلمانه وقال إن ريح سليمان بن داود قد حلّت فيه وإن الأتراك هم الشياطين والمردة فان فيّرهم وإلا أفسدوا، فثقلت وحطائه عليهم وتمنّوا هلاكه؛ وليلة الميلاد من هذه السنة أمر أن يجمع الحطب من الجبال والنواحي ويجعل على جانبي الوادي المعروف بزندرود كالمنابر والقباب العظيمة ومثل ذلك على جبل كارم كوه المشرف على أصبهان من أسفله إلى أعلاه حتى إذا اشتعلت صار الجبل كله ناراً، وجمع له المطربون وعمل من الشموع ما لا يُحصى وصيد له من الغربان والحداء زيادة على ألفي طائر ليجعل في أرجلها النفط فتطير بالنار في الهواء، وعمل سماطاً عظيماً فيه مائة فرس ومائتا بقر مشوية صِحاحاً وثلاثة آلاف رأس من الغنم وزيادة على عشرة آلاف من الدجاج وأنواع الطير، فلما ركب يطوف بالسماط استحقر الجميع لسعة الصحراء وغضب ولعن من صنعه، ثم نام في خركاه وكادت الفتنة تثور بين العسكر، وفي اليوم الرابع أسرجت الدواب عند بابه فاجتمع خلق كثير وكثر عليل الدواب ولعب الغلمان بها والصياح فاستيقظ فرأى ذلك فازداد غضباً وأمر أن تُنزع السروج عن الدواب وتجعل على ظهور أصحابها الأتراك ويُضرب بالمقارع من امتنع؛ فانتهز كبار الغلمان الأتراك الذين كانوا قد هربوا وحقدوا عليه الفرصة وقتلوه {cite:kamil-ibn-al-athir p. 223-226}."
  en: "In 323 the Daylamite ruler Mardawij ibn Ziyad was killed at Isfahan by his own Turkish ghilman. He had staged a Zoroastrian-style festival for the winter night — mountains ringed with bonfires, two thousand birds released with oil-soaked legs, a banquet of a hundred whole roasted horses — then humiliated his Turks, who seized the moment and killed him {cite:kamil-ibn-al-athir p. 223-226}."
  es: "En el año 323, el gobernante daylamita Mardawij ibn Ziyad fue asesinado en Isfahán por su propio ghilman turco. Había organizado un festival al estilo zoroástrico para la noche de invierno: montañas rodeadas de hogueras, dos mil pájaros liberados con las patas empapadas en aceite, un banquete de cien caballos enteros asados; luego humilló a sus turcos, quienes aprovecharon el momento y lo mataron {cite:kamil-ibn-al-athir p. 223-226}."
  fr: "En 323, le souverain daylamite Mardawij ibn Ziyad fut tué à Ispahan par ses propres ghilman turcs. Il avait organisé une fête de style zoroastrien pour la nuit d'hiver — des montagnes entourées de feux de joie, deux mille oiseaux lâchés avec les pattes enduites d'huile, un banquet de cent chevaux rôtis entiers — puis humilié ses Turcs, qui saisirent l'occasion et le tuèrent {cite:kamil-ibn-al-athir p. 223-226}."
  ur: "323 میں دیلامائٹ حکمران مردویج ابن زیاد کو اصفہان میں اس کے اپنے ترک غلمان نے قتل کر دیا۔ اس نے سردیوں کی رات کے لیے زرتشتی طرز کا میلہ منایا تھا - پہاڑوں پر الاؤ بج رہے تھے، تیل میں بھیگی ہوئی ٹانگوں سے دو ہزار پرندے چھوڑے گئے تھے، سو پورے بھنے ہوئے گھوڑوں کی ضیافت - پھر اس کے ترکوں کو ذلیل کیا، جنہوں نے اس لمحے کو پکڑ لیا اور اسے قتل کر دیا۔ 223-226}۔"
  tr: "Üç yüz yirmi üç yılında, dağlık bölgelerin hükümdarı Merdevic el-Daylami öldürüldü. Öldürülmesinin sebebi, Türk hizmetkarlarına verdiği zararı artırması ve Davud oğlu Süleyman'ın ruhunun kendisine yerleştiğini, Türklerin ise şeytan ve cinler olduğunu, bu yüzden onları kontrol ederse yozlaşacaklarını, aksi takdirde yozlaşacaklarını söylemesiydi. Bu yüzden öfkesi onlara ağır geldi ve onun yok edilmesini istediler. O yılın Noel arifesinde, dağlardan ve çevredeki bölgelerden odun toplanmasını ve Zandrud vadisinin iki tarafına büyük minberler ve kubbeler gibi yerleştirilmesini emretti. Ayrıca İsfahan'a bakan Karm Kuh Dağı'nın eteğinden zirvesine kadar aynı şeyin yapılmasını emretti, böylece yakıldığında tüm dağ alevler içinde kalacaktı. Kendisi için müzisyenler topladı, sayısız mum yaptı ve iki binden fazla karga ve çaylak avladı, bacaklarına yağ sürdü ki havada ateşle uçsunlar. Yüz at, iki yüz bütün kızarmış inek, üç bin koyun ve on binden fazla tavuk ve çeşitli diğer kuşlardan oluşan muhteşem bir ziyafet hazırladı. Ziyafeti sergilemek için dışarı çıktığında, çölün enginliğinden dolayı her şeyi önemsiz buldu, öfkelendi ve hazırlayanlara lanet etti. Sonra sarayında uyudu ve orduda neredeyse isyan çıktı. Dördüncü gün, hayvanlar kapısının önünde eyerlendi ve büyük bir kalabalık toplandı. Hayvanların çoğu hastaydı ve çocuklar onlarla oynayıp bağırıyorlardı. Uyandığında bunu gördü ve öfkesi daha da arttı. Hayvanların eyerlerinin çıkarılıp Türk sahiplerinin sırtına takılmasını ve dövülmelerini emretti. Reddedenler sopalarla dövüldü; böylece kaçan ve ona karşı kin besleyen büyük Türk çocuklar fırsatı değerlendirip onu öldürdüler. {Kaynak: Kamil İbn el-Atir s. 223-226}"
  id: "Pada tahun 323, Mardawij al-Daylami, penguasa wilayah pegunungan, dibunuh. Alasan pembunuhannya adalah karena ia telah meningkatkan penderitaan para pelayan Turki-nya dan mengatakan bahwa roh Sulaiman, putra Daud, telah bersemayam dalam dirinya dan bahwa orang Turki adalah setan dan iblis, sehingga jika ia mengendalikan mereka, mereka akan merusaknya, jika tidak, mereka akan dirusak. Maka kemarahannya menjadi sangat besar dan mereka menginginkan kehancurannya. Pada Malam Natal tahun itu, ia memerintahkan agar kayu bakar dikumpulkan dari pegunungan dan daerah sekitarnya dan ditempatkan di kedua sisi lembah yang dikenal sebagai Zandrod, seperti mimbar dan kubah besar. Ia juga memerintahkan hal yang sama dilakukan di Gunung Karm Kuh, yang menghadap Isfahan, dari kaki hingga puncaknya, sehingga ketika dinyalakan, seluruh gunung akan terbakar. Ia mengumpulkan para musisi untuknya, membuat lilin yang tak terhitung jumlahnya, dan memburu lebih dari dua ribu burung gagak dan layang-layang untuknya, mengolesi kaki mereka dengan minyak agar mereka dapat terbang dengan api di udara. Ia menyiapkan pesta yang megah, termasuk seratus kuda, dua ratus sapi panggang utuh, tiga ribu domba, dan lebih dari sepuluh ribu ayam dan berbagai burung lainnya. Ketika ia keluar untuk memamerkan pesta tersebut, ia menganggap semuanya tidak berarti karena luasnya padang pasir, menjadi marah, dan mengutuk orang-orang yang telah menyiapkannya. Kemudian ia tidur di istananya, dan pemberontakan hampir terjadi di antara pasukan. Pada hari keempat, hewan-hewan itu dipasangi pelana di gerbangnya, dan kerumunan besar berkumpul. Banyak hewan yang sakit, dan anak-anak laki-laki bermain-main dengan mereka dan berteriak-teriak. Ia terbangun dan melihat ini, yang semakin meningkatkan kemarahannya. Ia memerintahkan agar pelana dilepas dari hewan-hewan itu dan diletakkan di punggung pemiliknya yang orang Turki, dan agar mereka dipukuli. Mereka yang menolak dipukuli dengan tongkat; sehingga para pemuda Turki senior yang telah melarikan diri dan menyimpan dendam terhadapnya memanfaatkan kesempatan itu dan membunuhnya {cite:kamil-ibn-al-athir p. 223-226}."
