label: { ar: "فتح أدرنة", en: "Ottoman conquest of Edirne", ur: "ادرنہ کی عثمانی فتح", es: "Conquista otomana de Edirne", fr: "Conquête ottomane d'Edirne", tr: "Edirne'nin Fethi", id: "Penaklukan Edirne" }
summary:
  ar: "أنجز فتح أدرنة في عهد مراد الأول على يد لاله شاهين باشا الذي هزم تكفور المدينة في سازلي دره جنوب شرقيها، ففرّ التكفور سراً بقارب من قصره على ضفة التونجا، واستسلم أهل المدينة في رمضان ٧٦٣هـ/يوليو ١٣٦٢م على شرط أن يعيشوا فيها أحراراً {cite:encyclopaedia-of-islam-2 vol. 2 p. 710}. ويؤرخ الصلابي الاستيلاء على أدرنة سنة ٧٦٢هـ/١٣٦٠م ويصفها بأنها ثاني مدن الإمبراطورية البيزنطية بعد القسطنطينية {cite:dawlat-uthmaniyya-salabi p. 57}، بينما يؤرخه فريلي سنة ١٣٦٩م {cite:freely-ottoman-architecture-2011 p. 64}."
  en: "The conquest of Edirne was accomplished under Murad I by Lala Shahin Pasha, who defeated the city's tekfür at Sazlı-Dere, south-east of the city; the tekfür then fled secretly by boat from his palace on the Tunca, and in Ramadan 763/July 1362 the inhabitants surrendered on condition of living there freely {cite:encyclopaedia-of-islam-2 vol. 2 p. 710}. Al-Salabi dates the capture to 762/1360 and describes Edirne as the second city of the Byzantine Empire after Constantinople {cite:dawlat-uthmaniyya-salabi p. 57}, while Freely dates it to 1369 {cite:freely-ottoman-architecture-2011 p. 64}."
  ur: "ادرنہ کی فتح مراد اول کے عہد میں لالہ شاہین پاشا نے مکمل کی، جس نے شہر کے تکفور کو سازلی درہ پر شکست دی؛ تکفور خفیہ طور پر کشتی سے فرار ہوا اور رمضان 763ھ/جولائی 1362ء میں شہریوں نے آزادی کی شرط پر ہتھیار ڈال دیے {cite:encyclopaedia-of-islam-2 vol. 2 p. 710}۔ صلابی نے فتح کو 762ھ/1360ء لکھا اور ادرنہ کو قسطنطنیہ کے بعد بازنطینی سلطنت کا دوسرا بڑا شہر کہا {cite:dawlat-uthmaniyya-salabi p. 57}، جبکہ فریلی اسے 1369ء لکھتا ہے {cite:freely-ottoman-architecture-2011 p. 64}۔"
  es: "La conquista de Edirne fue consumada bajo el reinado de Murad I por Lala Shahin Pasha, quien derrotó al tekfür de la ciudad en Sazlı-Dere, al sureste de la ciudad; el tekfür huyó entonces en secreto en barco desde su palacio en el Tunca, y en Ramadán de 763/julio de 1362 los habitantes se rindieron con la condición de vivir allí libremente {cite:encyclopaedia-of-islam-2 vol. 2 p. 710}. Al-Salabi fecha la captura en 762/1360 y describe a Edirne como la segunda ciudad del Imperio bizantino después de Constantinopla {cite:dawlat-uthmaniyya-salabi p. 57}, mientras que Freely la fecha en 1369 {cite:freely-ottoman-architecture-2011 p. 64}."
  fr: "La conquête d'Edirne fut accomplie sous le règne de Murad Ier par Lala Shahin Pacha, qui vainquit le tekfür de la ville à Sazlı-Dere, au sud-est d'Edirne. Le tekfür s'enfuit alors secrètement par bateau depuis son palais sur la Tunca, et en Ramadan 763/juillet 1362, les habitants se rendirent à condition de pouvoir y vivre librement (encyclopaedia-of-islam-2 vol. 2 p. 710). Al-Salabi date la prise de la ville de 762/1360 et décrit Edirne comme la deuxième ville de l'Empire byzantin après Constantinople, tandis que Freely la date de 1369."
  tr: "Edirne'nin fethi, Murad I döneminde Lale Şahin Paşa tarafından gerçekleştirildi. Şahin Paşa, şehrin güneydoğusundaki Sazlıdere'de Tekfur'u mağlup etti. Tekfur, Tunca Nehri kıyısındaki sarayından gizlice tekneyle kaçtı ve şehir sakinleri, özgür insanlar olarak yaşayabilecekleri şartıyla Hicri 763 Ramazan'ında (Miladi 1362 Temmuz) teslim oldular. Al-Sallabi, Edirne'nin fethini Hicri 762/Miladi 1360 yılına tarihlendirir ve şehri Konstantinopolis'ten sonra Bizans İmparatorluğu'nun en önemli ikinci şehri olarak tanımlar. Freely ise bu tarihi 1369 olarak belirtir."
  id: "Penaklukan Edirne dilakukan pada masa pemerintahan Murad I oleh Lale Şahin Pasha, yang mengalahkan Tekfur kota itu di Sazlıdere, sebelah tenggara kota. Tekfur melarikan diri secara diam-diam dengan perahu dari istananya di tepi Sungai Tunca, dan penduduk kota menyerah pada bulan Ramadan 763 H/Juli 1362 M dengan syarat mereka dapat hidup di sana sebagai orang merdeka {cite:encyclopaedia-of-islam-2 vol. 2 p. 710}. Al-Sallabi mencatat penaklukan Edirne pada tahun 762 H/1360 M dan menggambarkannya sebagai kota terpenting kedua di Kekaisaran Bizantium setelah Konstantinopel {cite:dawlat-uthmaniyya-salabi p. 57}, sedangkan Freely mencatatnya pada tahun 1369 M {cite:freely-ottoman-architecture-2011 p. 64}."
