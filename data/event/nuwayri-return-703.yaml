id: event/nuwayri-return-703
class: event
kind: other
label:
  ar: "عودته إلى القاهرة مباشراً أملاك الخاص والأوقاف المنصورية، رمضان ٧٠٣هـ/١٣٠٤م"
  en: "Recall to Cairo as mubashir of the royal estates and Mansuri waqfs, Ramadan 703/1304"
  ur: "قاہرہ واپسی، املاک خاص اور منصوری اوقاف کا مباشر، رمضان 703ھ/1304ء"
summary:
  ar: "استُدعي النويري إلى القاهرة في رمضان ٧٠٣هـ فاستأنف أعماله الإدارية مباشراً أملاك الخاص الشريف يدير ديوان الخاص والبيمارستان المنصوري وجملة الأوقاف المنصورية، وكان الضبط الظاهر بيد قاضي القضاة ابن مخلوف؛ وعاد إلى السكن بالمدرسة فشهد بدايات الخلاف بين ابن تيمية وعلماء مصر الذي قام بها من ٧٠٥هـ إلى ٧٠٩هـ وفيها أُلزم بدور التوسط الصغير بين حاميه ابن مخلوف ونائب دمشق جمال الدين أقوش الأفرم المدافع عن الشيخ؛ ولما توفي الأمير التركماني كُلّف بحصر أمواله والتصرف فيها ثم بإنشاء تربة له بأوقاف ينفق عليها مما بقي، وسار السلطان الناصر بنفسه إلى القرافة يرسم خطتها على الأرض {cite:encyclopaedia-of-islam-2 vol. 8 pp. 157-158}."
  en: "Recalled to Cairo in Ramadan 703 (April 1304), al-Nuwayri resumed his administrative work as mubashir amlak al-khass al-sharif, administering the diwan al-khass, the bimaristan al-Mansuri and the whole range of Mansuri waqfs, apparently under the supervision of chief qadi Ibn Makhluf; back in residence at the madrasa he witnessed the opening of the Ibn Taymiyya affair (705-709) which began at the Nasiriyya itself, and was pressed into a minor mediating role between his patron Ibn Makhluf and Damascus's governor Jamal al-Din Aqqush al-Afram, the shaykh's ardent defender. When the amir al-Turkumani died he was charged with sequestering and liquidating his assets, then with erecting him a turba with a maintenance waqf — al-Nasir Muhammad himself walked to al-Qarafa to draw its plan on the ground {cite:encyclopaedia-of-islam-2 vol. 8 pp. 157-158}."
  ur: "رمضان 703ھ ⁦(اپریل 1304ء)⁩ میں نويری کو قاہرہ واپس بلایا گیا اور انہوں نے مباشر املاک خاص شریف کے طور پر دیوان خاص، بیمارستان منصوری اور تمام منصوری اوقاف کی انتظامیہ سنبھالی، بظاہر قاضی القضاة ابن مخلوف کی نگرانی میں؛ مدرسہ میں واپس ساکن ہو کر انہیں ابن تیمیہ کے معاملے ⁦(705-709ھ)⁩ کے آغاز کا مشاہدہ ہوا جو ناصریہ سے ہی شروع ہوا، اور وہ اپنے سرپرست ابن مخلوف اور دمشق کے نائب جمال الدین آقوش افرم کے درمیان چھوٹی ثالثی پر مامور ہوئے؛ امیر ترکمانی کی وفات پر انہیں اس کی املاک ضبط و تصفیہ کا اور پھر قرافہ میں اس کی تربہ اور وقف کی تعمیر کا حکم ملا — خود سلطان الناصر قرافہ جا کر اس کا نقشہ زمین پر بٹھایا {cite:encyclopaedia-of-islam-2 vol. 8 pp. 157-158}۔"
