id: event/nuwayri-return-703
class: event
kind: other
label:
  ar: "عودته إلى القاهرة مباشراً أملاك الخاص والأوقاف المنصورية، رمضان ٧٠٣هـ/١٣٠٤م"
  en: "Recall to Cairo as mubashir of the royal estates and Mansuri waqfs, Ramadan 703/1304"
  ur: "قاہرہ واپسی، املاک خاص اور منصوری اوقاف کا مباشر، رمضان 703ھ/1304ء"
  es: "Llamado a El Cairo como mubashir de las propiedades reales y waqfs de Mansuri, Ramadán 703/1304"
  fr: "Rappel au Caire en tant que mubashir des domaines royaux et des waqfs de Mansuri, Ramadan 703/1304"
  tr: "Hicri 703 Ramazan/Miladi 1304 yılında Kahire'ye, Mansuriye'nin özel mülklerine ve vakıflarına doğrudan döndü."
  id: "Kepulangannya ke Kairo langsung ke properti pribadi dan wakaf Mansouriya, Ramadan 703 H/1304 M"
summary:
  ar: "استُدعي النويري إلى القاهرة في رمضان ٧٠٣هـ فاستأنف أعماله الإدارية مباشراً أملاك الخاص الشريف يدير ديوان الخاص والبيمارستان المنصوري وجملة الأوقاف المنصورية، وكان الضبط الظاهر بيد قاضي القضاة ابن مخلوف؛ وعاد إلى السكن بالمدرسة فشهد بدايات الخلاف بين ابن تيمية وعلماء مصر الذي قام بها من ٧٠٥هـ إلى ٧٠٩هـ وفيها أُلزم بدور التوسط الصغير بين حاميه ابن مخلوف ونائب دمشق جمال الدين أقوش الأفرم المدافع عن الشيخ؛ ولما توفي الأمير التركماني كُلّف بحصر أمواله والتصرف فيها ثم بإنشاء تربة له بأوقاف ينفق عليها مما بقي، وسار السلطان الناصر بنفسه إلى القرافة يرسم خطتها على الأرض {cite:encyclopaedia-of-islam-2 vol. 8 pp. 157-158}."
  en: "Recalled to Cairo in Ramadan 703 (April 1304), al-Nuwayri resumed his administrative work as mubashir amlak al-khass al-sharif, administering the diwan al-khass, the bimaristan al-Mansuri and the whole range of Mansuri waqfs, apparently under the supervision of chief qadi Ibn Makhluf; back in residence at the madrasa he witnessed the opening of the Ibn Taymiyya affair (705-709) which began at the Nasiriyya itself, and was pressed into a minor mediating role between his patron Ibn Makhluf and Damascus's governor Jamal al-Din Aqqush al-Afram, the shaykh's ardent defender. When the amir al-Turkumani died he was charged with sequestering and liquidating his assets, then with erecting him a turba with a maintenance waqf — al-Nasir Muhammad himself walked to al-Qarafa to draw its plan on the ground {cite:encyclopaedia-of-islam-2 vol. 8 pp. 157-158}."
  ur: "رمضان 703ھ ⁦(اپریل 1304ء)⁩ میں نويری کو قاہرہ واپس بلایا گیا اور انہوں نے مباشر املاک خاص شریف کے طور پر دیوان خاص، بیمارستان منصوری اور تمام منصوری اوقاف کی انتظامیہ سنبھالی، بظاہر قاضی القضاة ابن مخلوف کی نگرانی میں؛ مدرسہ میں واپس ساکن ہو کر انہیں ابن تیمیہ کے معاملے ⁦(705-709ھ)⁩ کے آغاز کا مشاہدہ ہوا جو ناصریہ سے ہی شروع ہوا، اور وہ اپنے سرپرست ابن مخلوف اور دمشق کے نائب جمال الدین آقوش افرم کے درمیان چھوٹی ثالثی پر مامور ہوئے؛ امیر ترکمانی کی وفات پر انہیں اس کی املاک ضبط و تصفیہ کا اور پھر قرافہ میں اس کی تربہ اور وقف کی تعمیر کا حکم ملا — خود سلطان الناصر قرافہ جا کر اس کا نقشہ زمین پر بٹھایا {cite:encyclopaedia-of-islam-2 vol. 8 pp. 157-158}۔"
  es: "Llamado de regreso a El Cairo en Ramadán 703 (abril de 1304), al-Nuwayri reanudó su labor administrativa como mubashir amlak al-khass al-sharif, administrando el diwan al-khass, el bimaristan al-Mansuri y toda la gama de waqfs Mansuri, aparentemente bajo la supervisión del cadí principal Ibn Makhluf; de vuelta en su residencia en la madrasa, presenció el inicio del asunto de Ibn Taymiyya (705-709), que comenzó en la propia Nasiriyya, y se vio obligado a desempeñar un papel de mediador menor entre su protector Ibn Makhluf y el gobernador de Damasco, Jamal al-Din Aqqush al-Afram, el ferviente defensor del shaykh. Cuando murió el emir al-Turkumani, se le encargó confiscar y liquidar sus bienes, y luego erigirle un turba con un waqf de mantenimiento; el propio al-Nasir Muhammad caminó hasta al-Qarafa para dibujar su plano en el suelo {cite:encyclopaedia-of-islam-2 vol. 8 pp. 157-158}."
  fr: "Rappelé au Caire en Ramadan 703 (avril 1304), al-Nuwayri reprit son travail administratif en tant que mubashir amlak al-khass al-sharif, administrant le diwan al-khass, le bimaristan al-Mansuri et l'ensemble des waqfs Mansuri, apparemment sous la supervision du cadi en chef Ibn Makhluf; de retour à la madrasa, il assista à l'ouverture de l'affaire Ibn Taymiyya (705-709) qui commença à la Nasiriyya même, et fut contraint de jouer un rôle mineur de médiateur entre son protecteur Ibn Makhluf et le gouverneur de Damas Jamal al-Din Aqqush al-Afram, le fervent défenseur du cheikh. Lorsque l'émir al-Turkumani mourut, il fut chargé de mettre sous séquestre et de liquider ses biens, puis de lui ériger une turba avec un waqf d'entretien — al-Nasir Muhammad lui-même se rendit à al-Qarafa pour en dessiner le plan sur le terrain {cite:encyclopaedia-of-islam-2 vol. 8 pp. 157-158}."
  tr: "El-Nuveyri, Hicri 703 yılının Ramazan ayında Kahire'ye çağrıldı ve Şerif'in özel mülklerini yönetmek, Divan-ı Khas'ı, Mansur Hastanesi'ni ve tüm Mansur vakıflarını işletmek üzere doğrudan idari işlerine geri döndü. Görünürdeki kontrol, Baş Yargıç İbn Makhluf'un elindeydi. Okulda yaşamaya geri döndü ve İbn Taymiyye ile Mısır alimleri arasındaki anlaşmazlığın başlangıcına tanık oldu; bu anlaşmazlığı Hicri 705-709 yılları arasında sürdürdü. Bu süre zarfında, koruyucusu İbn Makhluf ile Şeyh'i savunan Şam vekili Cemal el-Din Akuş el-Afram arasında küçük bir arabuluculuk rolü üstlenmek zorunda kaldı. Türkmen prensi öldüğünde, parasını envanterlemek ve dağıtmak, ardından da kalanlardan harcanacak vakıflarla birlikte onun için bir türbe kurmakla görevlendirildi. Sultan el-Nasır bizzat el-Qarafa'ya giderek yerinde planlar çizdi."
  id: "Al-Nuwayri dipanggil ke Kairo pada bulan Ramadan tahun 703 H, dan ia langsung melanjutkan pekerjaan administrasinya, mengelola harta pribadi Syarif, menjalankan Diwan al-Khas, Rumah Sakit Mansuri, dan semua wakaf Mansuri. Kontrol tampak berada di tangan Ketua Hakim, Ibn Makhlouf. Ia kembali tinggal di sekolah dan menyaksikan awal perselisihan antara Ibn Taymiyyah dan para ulama Mesir, yang ia tangani dari tahun 705 H hingga 709 H. Selama waktu ini, ia wajib memainkan peran mediasi kecil antara pelindungnya, Ibn Makhlouf, dan wakil Damaskus, Jamal al-Din Aqoush al-Afram, yang membela Syekh. Ketika pangeran Turkmenistan meninggal, ia ditugaskan untuk mendata hartanya dan mengelolanya, dan kemudian mendirikan mausoleum untuknya dengan wakaf yang akan digunakan dari sisa harta yang ada. Sultan al-Nasir sendiri pergi ke al-Qarafa untuk menyusun rencana pembangunan di sana."
