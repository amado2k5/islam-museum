label: { ar: "ثورة الوليد بن طريف بالجزيرة", en: "The Revolt of al-Walid ibn Tarif in al-Jazira", es: "La revuelta de al-Walid ibn Tarif en al-Jazira", fr: "La révolte d'al-Walid ibn Tarif à al-Jazira", ur: "الجزیرہ میں الولید بن طریف کی بغاوت", tr: "Velid ibn Tarif'in Cezire'deki isyanı", id: "Pemberontakan Al-Walid ibn Tarif di Al-Jazira" }
summary:
  ar: "في سنة ١٧٨ ثار الوليد بن طريف الشاري بالجزيرة وعظم أمره، فأرسل إليه هارون الرشيد يزيد بن مزيد الشيباني، وقيل للرشيد إنما يتجافى يزيد عن الوليد لما بينهما من الرحم؛ وقال يزيد لأصحابه إنما هي الخوارج ولهم حملة فاثبتوا فإذا انقضت حملتهم فاحملوا عليهم فإنهم إذا انهزموا لم يرجعوا — فقُتل الوليد وانقضت ثورته، ورثته أخته الفارعة بقصائد منها قصيدتها المشهورة {cite:duha-islam p. 951-952, 957}."
  en: "The Jaziran revolt of al-Walid ibn Tarif, broken by Yazid ibn Mazyad's patient tactics, 178 AH {cite:duha-islam p. 951-952}."
  es: "La revuelta jazirana de al-Walid ibn Tarif, rota por las pacientes tácticas de Yazid ibn Mazyad, 178 d.H. {cita:duha-islam p. 951-952}."
  fr: "La révolte jazirienne d'al-Walid ibn Tarif, brisée par la tactique patiente de Yazid ibn Mazyad, 178 AH {cite:duha-islam p. 951-952}."
  ur: "الولید بن طارف کی جزیران بغاوت، یزید بن مازیاد کے صبر آزما حربوں سے ٹوٹی، 178 ہجری۔ 951-952}۔"
  tr: "178 yılında, El-Valid ibn Tarif El-Şari, Cezire'de isyan etti ve gücü arttı. Harun el-Raşid, Yazid ibn Mazid el-Şeybani'yi ona gönderdi. El-Raşid'e, Yazid'in El-Valid'den sadece aralarındaki akrabalık nedeniyle kaçındığı söylendi. Yazid, arkadaşlarına, \"Onlar sadece Haricilerdir ve saldırıya geçiyorlar, bu yüzden sağlam durun. Saldırıları bittiğinde onlara saldırın, çünkü yenilirlerse geri dönmeyeceklerdir\" dedi. El-Valid öldürüldü ve isyanı sona erdi. Kız kardeşi El-Feria, ünlü şiiri de dahil olmak üzere şiirlerle onun için yas tuttu. {Kaynak:duha-islam s. 951-952, 957}"
  id: "Pada tahun 178, Al-Walid ibn Tarif Al-Shari memberontak di Al-Jazira dan kekuasaannya semakin besar. Harun Al-Rashid mengutus Yazid ibn Mazid Al-Shaybani untuk menemuinya. Dikatakan kepada Al-Rashid bahwa Yazid hanya menghindari Al-Walid karena hubungan kekerabatan di antara mereka. Yazid berkata kepada para sahabatnya, “Mereka hanyalah kaum Kharijites dan mereka sedang menyerang, jadi tetaplah teguh. Setelah serangan mereka berakhir, seranglah mereka, karena jika mereka dikalahkan, mereka tidak akan kembali.” Al-Walid terbunuh dan pemberontakannya berakhir. Saudarinya, Al-Fari’a, meratapinya dengan puisi, termasuk puisinya yang terkenal {cite:duha-islam hlm. 951-952, 957}."
