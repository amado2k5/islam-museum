  ar: "في سنة ١٧٨ ثار الوليد بن طريف الشاري بالجزيرة وعظم أمره، فأرسل إليه هارون الرشيد يزيد بن مزيد الشيباني، وقيل للرشيد إنما يتجافى يزيد عن الوليد لما بينهما من الرحم؛ وقال يزيد لأصحابه إنما هي الخوارج ولهم حملة فاثبتوا فإذا انقضت حملتهم فاحملوا عليهم فإنهم إذا انهزموا لم يرجعوا — فقُتل الوليد وانقضت ثورته، ورثته أخته الفارعة بقصائد منها قصيدتها المشهورة {cite:duha-islam p. 951-952, 957}."
  en: "The Jaziran revolt of al-Walid ibn Tarif, broken by Yazid ibn Mazyad's patient tactics, 178 AH {cite:duha-islam p. 951-952}."
