label:
  ar: "الباقلاني يأخذ علم الكلام عن أبي عبد الله بن مجاهد الطائي صاحب الأشعري"
  en: "Al-Baqillani takes kalam from Abu Abd Allah ibn Mujahid al-Ta'i, companion of al-Ash'ari"
  ur: "باقلانی، اشعری کے صاحب ابو عبد اللہ بن مجاہد طائی سے علم کلام حاصل کرتے ہیں"
  fr: "Al-Baqillani apprend le kalam d'Abu Abd Allah ibn Mujahid al-Ta'i, compagnon d'al-Ash'ari"
  es: "Al-Baqillani recibe kalam de manos de Abu Abd Allah ibn Mujahid al-Ta'i, compañero de al-Ash'ari"
  tr: "El-Baqillani, teoloji bilgisini El-Eş'ari'nin sahabesi Ebu Abdullah ibn Mücahid el-Ta'i'den edinmiştir."
  id: "Al-Baqillani memperoleh pengetahuannya tentang teologi dari Abu Abdullah ibn Mujahid al-Ta'i, seorang sahabat al-Ash'ari."
summary:
  ar: "أخذ القاضي أبو بكر الباقلاني علم الكلام عن أبي عبد الله بن مجاهد الطائي الذي كان من أصحاب أبي الحسن الأشعري، وروى الحديث عن أبي بكر القطيعي، وكانت له حلقة عظيمة مشهودة {cite:shadharat-dhahab p. 169}؛ ويقول المكارثي إنه درس أصول الدين على أتباع الأشعري، وقد جُذب كثيرون إلى دروسه حتى صار مضرب المثل في المناظرة {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}."
  en: "The qadi Abu Bakr al-Baqillani learned kalam from Abu Abd Allah ibn Mujahid al-Ta'i, one of al-Ash'ari's own companions, and transmitted hadith from Abu Bakr al-Qati'i; he had a large, well-attended lecture circle {cite:shadharat-dhahab p. 169}. McCarthy says he studied usul al-din under disciples of al-Ash'ari and drew many to his lectures, becoming proverbial in disputation {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}."
  ur: "قاضی ابوبکر باقلانی نے علم کلام ابو عبد اللہ بن مجاہد طائی سے پڑھا جو خود ابی الحسن اشعری کے اصحاب میں سے تھے، اور حدیث ابوبکر قطیعی سے روایت کی؛ ان کی ایک بڑی مشہور مجلس درس تھی {cite:shadharat-dhahab p. 169}۔ مکارتھی کے مطابق انہوں نے اشعری کے شاگردوں سے اصول دین پڑھا اور بہت سے لوگ ان کے دروس کی طرف کھنچے، یہاں تک کہ وہ مناظرے میں مثال بن گئے {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}۔"
  fr: "Le cadi Abu Bakr al-Baqillani apprit le kalam d'Abu Abd Allah ibn Mujahid al-Ta'i, l'un des compagnons mêmes d'al-Ash'ari, et transmit le hadith d'Abu Bakr al-Qati'i ; il avait un cercle d'enseignement vaste et très fréquenté {cite:shadharat-dhahab p. 169}. McCarthy dit qu'il étudia les usul al-din auprès de disciples d'al-Ash'ari et attira beaucoup de monde à ses leçons, devenant proverbial dans la controverse {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}."
  es: "El cadí Abu Bakr al-Baqillani aprendió kalam de Abu Abd Allah ibn Mujahid al-Ta'i, uno de los compañeros de al-Ash'ari, y transmitió hadices de Abu Bakr al-Qati'i; tenía un gran círculo de conferencias concurrido {cite:shadharat-dhahab p. 169}. McCarthy dice que estudió usul al-din con discípulos de al-Ash'ari y atrajo a muchos a sus conferencias, convirtiéndose en un referente en las disputas {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}."
  tr: "Hakim Ebu Bekr el-Baqillani, Ebu el-Hasan el-Eş'ari'nin sahabelerinden biri olan Ebu Abdullah ibn Mücahid el-Ta'i'den teoloji öğrenmiş ve Ebu Bekr el-Kati'i'den hadis rivayet etmiştir. Geniş ve tanınmış bir çevresi vardı {kaynak:şadharat-dhahab s. 169}. McCarthy, onun el-Eş'ari'nin takipçileriyle dinin esaslarını çalıştığını ve birçok kişinin onun derslerine ilgi duyduğunu, hatta tartışmalarda örnek teşkil ettiğini söylüyor {kaynak:islam-ansiklopedisi-2 cilt 1 s. 1018}."
  id: "Hakim Abu Bakr al-Baqillani mempelajari teologi dari Abu Abdullah ibn Mujahid al-Ta’i, yang merupakan salah satu sahabat Abu al-Hasan al-Ash’ari, dan ia meriwayatkan hadits dari Abu Bakr al-Qati’i. Ia memiliki lingkaran pergaulan yang luas dan terkenal {cite:shadharat-dhahab hlm. 169}. McCarthy mengatakan bahwa ia mempelajari dasar-dasar agama bersama para pengikut al-Ash’ari, dan banyak yang tertarik pada pelajarannya hingga ia menjadi contoh dalam debat {cite:encyclopaedia-of-islam-2 vol. 1 hlm. 1018}."
