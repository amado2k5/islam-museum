id: event/lahore-british-annexation-1849
class: event
kind: other
label:
  ar: "ضم لاهور رسميًا إلى الإمبراطورية البريطانية، مارس ١٨٤٩م"
  en: "Lahore formally annexed to the British empire, March 1849"
  ur: "لہور کا برطانوی سلطنت میں باضابطہ الحاق، مارچ 1849ء"
summary:
  ar: "عقب الحرب الثانية مع البريطانيين وعزل المهراجا داليب سينغ، ضُمَّت لاهور رسميًا إلى الإمبراطورية البريطانية في مارس ١٨٤٩م؛ وكان قد سبق ذلك بموجب معاهدتي لاهور (مارس وديسمبر ١٨٤٦م) قبول حامية بريطانية مؤقتة ومقيم بريطاني دائم {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 39}."
  en: "As a result of the second war with the British and the deposition of Maharaja Dalip Singh, Lahore was formally incorporated into the British empire in March 1849; under the two treaties of Lahore (March and December 1846) it had already accepted a temporary British garrison and a permanent British Resident {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 39}."
  ur: "برطانویوں کے ساتھ دوسری جنگ اور مہاراجہ دلیپ سنگھ کی معزولی کے نتیجے میں مارچ 1849ء میں لہور باضابطہ برطانوی سلطنت میں شامل کر لیا گیا؛ اس سے پہلے لہور کے دو معاہدوں (مارچ اور دسمبر 1846ء) کے تحت پہلے ہی ایک عارضی برطانوی دستہ اور ایک مستقل برطانوی ریزیڈنٹ قبول کیا جا چکا تھا {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 39}."
