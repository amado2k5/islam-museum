id: event/night-of-adha-at-saada-ibn-abbads-plan-and-the-prisoners-freed-286
class: event
kind: other
label:
  ar: ليلة الأضحى في صعدة، خطة ابن عباد وتهريب المحبوسين من بني الحارث، 286هـ
  en: The night of Adha at Sa'da, Ibn Abbad's plan and the escape of the Banu al-Harith prisoners, 286 AH
  ur: صعدہ میں عید الاضحیٰ کی رات، ابن عباد کا منصوبہ اور بنو حارث کے قیدیوں کا فرار، 286ھ
  es: "La noche de Adha en Sa'da, el plan de Ibn Abbad y la fuga de los prisioneros Banu al-Harith, 286 AH"
  fr: "La nuit d'Aïd al-Adha à Sa'da, le plan d'Ibn Abbad et l'évasion des prisonniers des Banu al-Harith, 286 AH"
  tr: "Sa'de'de Kurban Bayramı gecesi, İbn Abbad'ın planı ve Beni el-Harith'ten tutsakların kaçışı, Hicri 286"
  id: "Malam Idul Adha di Sa'dah, rencana Ibnu Abbas dan pelarian para tahanan dari Bani al-Harith, 286 H"
summary:
  ar: يرسل الهادي من نجران إلى المهرا وخولان ويكتب إلى محمد بن عبيد الله بإخراجهم، فيدس ابن عباد مبرداً إلى المحبوسين من بني الحارث بصعدة فيخرجون، ويجمع أتباعه ليلة الأضحى ليهجم على محمد بن عبيد الله ثم على الغيل، فيستعد محمد ويستنفر بني سعد ويصلي العيد رغم الناصحين، فييأس ابن عباد ويخرج المحبوسين ومنهم أبو الوجيه ويحيى ويتخلف مرزوق.
  en: From Najran al-Hadi sends to al-Mahra and Khawlan and writes to Muhammad ibn Ubaydallah to bring them out; Ibn Abbad slips a file to the Banu al-Harith prisoners at Sa'da and they get out, and on the night of Adha he gathers followers to fall on Muhammad ibn Ubaydallah and then on al-Ghayl; Muhammad prepares, calls out Banu Sa'd and prays the Eid despite those who urged him not to, Ibn Abbad despairs and gets the prisoners out, among them Abu al-Wajih and Yahya, while Marzuq stays.
  ur: ہادی نجران سے مہرا اور خولان کی طرف پیغام بھیجتے اور محمد بن عبید اللہ کو انہیں نکالنے کا لکھتے ہیں؛ ابن عباد صعدہ میں بنو حارث کے قیدیوں تک ایک ریتی پہنچاتا ہے اور وہ نکل جاتے ہیں، اور عید الاضحیٰ کی رات اپنے ساتھیوں کو جمع کرتا ہے کہ محمد بن عبید اللہ اور پھر الغیل پر ٹوٹ پڑے؛ محمد تیاری کرتے ہیں، بنو سعد کو بلاتے ہیں اور ناصحوں کے باوجود عید کی نماز پڑھتے ہیں، ابن عباد مایوس ہو کر قیدیوں کو نکال لیتا ہے جن میں ابو الوجیہ اور یحییٰ ہیں اور مرزوق رک جاتا ہے۔
  es: "Desde Najran, al-Hadi envía mensajeros a al-Mahra y Khawlan y escribe a Muhammad ibn Ubaydallah para que los saque; Ibn Abbad desliza un archivo a los prisioneros de Banu al-Harith en Sa'da y estos salen, y en la noche de Adha reúne seguidores para atacar a Muhammad ibn Ubaydallah y luego a al-Ghayl; Muhammad se prepara, llama a Banu Sa'd y reza el Eid a pesar de quienes le instaban a no hacerlo, Ibn Abbad se desespera y saca a los prisioneros, entre ellos Abu al-Wajih y Yahya, mientras que Marzuq se queda."
  fr: "De Najran, al-Hadi envoie des messagers à al-Mahra et Khawlan et écrit à Muhammad ibn Ubaydallah pour qu'il les fasse libérer; Ibn Abbad glisse un message aux prisonniers Banu al-Harith à Sa'da et ils sont libérés, et la nuit de l'Aïd, il rassemble des partisans pour attaquer Muhammad ibn Ubaydallah puis al-Ghayl; Muhammad se prépare, appelle les Banu Sa'd et prie l'Aïd malgré ceux qui l'en ont dissuadé; Ibn Abbad, désespéré, fait libérer les prisonniers, parmi lesquels Abu al-Wajih et Yahya, tandis que Marzuq reste sur place."
  tr: "El-Hadi, Necran'dan El-Mahra ve Havlan'a haber gönderir ve Muhammed bin Ubeydullah'a onları serbest bırakması için mektup yazar. İbn Abbad, Mübarrad'ı Beni El-Harith'ten tutsaklara Saada'ya gönderir ve onlar serbest bırakılır. Kurban Bayramı gecesi, Muhammed bin Ubeydullah'a ve ardından El-Gayl'e saldırmak için takipçilerini toplar. Muhammed, danışmanlarına rağmen Beni Saad'ı hazırlar ve seferber eder ve bayram namazını kılar. İbn Abbad umutsuzluğa kapılır ve Ebu el-Vajih ve Yahya da dahil olmak üzere tutsakları serbest bırakır, Marzuk ise geride kalır."
  id: "Al-Hadi mengirim utusan dari Najran ke Al-Mahra dan Khawlan dan menulis surat kepada Muhammad bin Ubaid Allah untuk membebaskan mereka. Ibnu Abbas mengirim Mubarad kepada para tawanan dari Bani Al-Harith di Saada, dan mereka dibebaskan. Pada malam Idul Adha, ia mengumpulkan para pengikutnya untuk menyerang Muhammad bin Ubaid Allah dan kemudian Al-Ghayl. Muhammad mempersiapkan dan memobilisasi Bani Saad dan melaksanakan salat Id meskipun ditentang oleh para penasihat. Ibnu Abbas putus asa dan membebaskan para tawanan, termasuk Abu Al-Wajih dan Yahya, sementara Marzuq tetap tinggal."
