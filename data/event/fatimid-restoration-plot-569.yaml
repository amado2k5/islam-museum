label: { ar: "مؤامرة إعادة الدعوة العبيدية وصلب أصحابها" }
summary:
  ar: "في سنة تسع وستين أراد جماعة من شيعة العبيديين ومحبيهم إقامة الدعوة وردها إلى آل العاضد ووافقهم جماعة من أمراء صلاح الدين فاطلع صلاح الدين على ذلك فصلبهم بين القصرين {cite:tarikh-khulafa-minhaj-1434 p. 684}. ويفصّل ابن الأثير الخطة: منهم عمارة بن أبي الحسن اليمني الشاعر وعبد الصمد الكاتب والقاضي العويرس وداعي الدعاة ومن جند المصريين ورجالتهم السودان وحاشية القصر، واتفقوا على استدعاء الفرنج من صقلية وساحل الشام بمال وبلاد يبذلونها لهم، فإن خرج صلاح الدين إليهم ثاروا في القاهرة وأعادوا الدولة العلوية وارتد عنه من وافقهم من عسكره، وإن أقام وأرسل العساكر أخذوه هو؛ وقال عمارة: وأنا قد أبعدت أخاه إلى اليمن خوفاً أن يسد مسده. وكان كشفهم بأنهم أدخلوا معهم زين الدين علي بن نجا الواعظ، فلما علم حقيقة الأمر أعلم صلاح الدين فأمره بملازمتهم ومواطأتهم وإخباره بما يتجدد، حتى وصل رسول من ملك الفرنج بالساحل فكشف الخبر على حقيقته، فقبض على المقدمين وصلبهم ثاني رمضان؛ ويذكرون أن القاضي الفاضل أحسّ بفتور عبد الصمد عن خدمته فشك فيه فكلف ابن نجا بكشف الأمر {cite:kamil-ibn-al-athir p. 53-54}."
  en: "In 569 a group of the Ubaydids' shi'a and lovers plotted to restore the da'wa to al-Adid's house, joined by some of Salah al-Din's amirs; discovering it, he crucified them between the two palaces {cite:tarikh-khulafa-minhaj-1434 p. 684}."
