class: event
kind: other
label: { ar: "مؤامرة إعادة الدعوة العبيدية وصلب أصحابها", en: "The plot to restore the Ubaydid da'wa and the crucifixion of its partisans", es: "La conspiración para restaurar la da'wa de Ubaydid y la crucifixión de sus partidarios.", fr: "Le complot visant à restaurer la da'wa des Oubaydites et la crucifixion de ses partisans", ur: "عبید الدعوۃ کو بحال کرنے کی سازش اور اس کے حامیوں کی مصلوبیت", tr: "Kölelik hareketini yeniden canlandırma ve taraftarlarını çarmıha germe planı.", id: "Rencana untuk menghidupkan kembali gerakan perbudakan dan menyalib para pendukungnya." }
summary:
  ar: "في سنة تسع وستين أراد جماعة من شيعة العبيديين ومحبيهم إقامة الدعوة وردها إلى آل العاضد ووافقهم جماعة من أمراء صلاح الدين فاطلع صلاح الدين على ذلك فصلبهم بين القصرين {cite:tarikh-khulafa-minhaj-1434 p. 684}. ويفصّل ابن الأثير الخطة: منهم عمارة بن أبي الحسن اليمني الشاعر وعبد الصمد الكاتب والقاضي العويرس وداعي الدعاة ومن جند المصريين ورجالتهم السودان وحاشية القصر، واتفقوا على استدعاء الفرنج من صقلية وساحل الشام بمال وبلاد يبذلونها لهم، فإن خرج صلاح الدين إليهم ثاروا في القاهرة وأعادوا الدولة العلوية وارتد عنه من وافقهم من عسكره، وإن أقام وأرسل العساكر أخذوه هو؛ وقال عمارة: وأنا قد أبعدت أخاه إلى اليمن خوفاً أن يسد مسده. وكان كشفهم بأنهم أدخلوا معهم زين الدين علي بن نجا الواعظ، فلما علم حقيقة الأمر أعلم صلاح الدين فأمره بملازمتهم ومواطأتهم وإخباره بما يتجدد، حتى وصل رسول من ملك الفرنج بالساحل فكشف الخبر على حقيقته، فقبض على المقدمين وصلبهم ثاني رمضان؛ ويذكرون أن القاضي الفاضل أحسّ بفتور عبد الصمد عن خدمته فشك فيه فكلف ابن نجا بكشف الأمر {cite:kamil-ibn-al-athir p. 53-54}."
  en: "In 569 a group of the Ubaydids' shi'a and lovers plotted to restore the da'wa to al-Adid's house, joined by some of Salah al-Din's amirs; discovering it, he crucified them between the two palaces {cite:tarikh-khulafa-minhaj-1434 p. 684}."
  es: "En 569, un grupo de chiítas y amantes de los Ubaydids conspiraron para restaurar la da'wa en la casa de al-Adid, a quienes se unieron algunos de los emires de Salah al-Din; al descubrirlo, los crucificó entre los dos palacios {cite:tarikh-khulafa-minhaj-1434 p. 684}."
  fr: "En 569, un groupe de chiites et d'amants des Ubaydides complota pour restaurer la da'wa dans la maison d'al-Adid, rejoints par certains des émirs de Salah al-Din; le découvrant, il les crucifia entre les deux palais {cite:tarikh-khulafa-minhaj-1434 p. 684}."
  ur: "569 میں عبیدیوں کے شیعوں اور عاشقوں کے ایک گروہ نے العدید کے گھر دعوت کو بحال کرنے کی سازش کی، جس میں صلاح الدین کے کچھ امیر بھی شامل ہوئے۔ اسے دریافت کر کے اس نے انہیں دو محلوں کے درمیان مصلوب کر دیا۔ 684}۔"
  tr: "69 yılında, bir grup Fatımi Şii ve destekçileri Fatımi Halifeliğini yeniden canlandırmak ve onu el-Adid'in soyundan gelenlere geri vermek istediler. Selahaddin'in emirlerinden bir grup onlarla anlaştı, ancak Selahaddin bunu öğrendi ve onları iki saray arasında çarmıha gerdi {kaynak:tarikh-khulafa-minhaj-1434 s. 684}. İbn el-Athir planı şöyle detaylandırıyor: Aralarında şair Amara ibn Abi el-Hasan el-Yamani, kâtip Abd el-Samad, kadı el-Uveyris, baş misyoner, Mısırlı askerler ve Sudanlı adamları ile saray maiyeti vardı. Sicilya ve Levant kıyılarından Frankları para ve toprak teklif ederek çağırmayı kabul ettiler. Eğer Selahaddin onlara giderse, Kahire'de isyan çıkaracaklar ve Fatımi Halifeliğini yeniden kuracaklar ve ordusundan onlarla anlaşanlar ona karşı döneceklerdi. Eğer kalır ve asker gönderirse, onu yakalayacaklardı. Amara şöyle dedi: Kardeşini, onun yerini almasından korktuğum için Yemen'e gönderdim. Onların vahyedilen şey, yanlarında vaiz Zeynel Din Ali ibn Neca'yı getirdikleriydi. Olayı öğrenince Selahaddin'e haber verdi. Selahaddin ona onlarla kalmasını, onlarla işbirliği yapmasını ve kıyıdaki Frank kralından bir elçi gelip olayın gerçeğini açıklayana kadar olan biteni kendisine bildirmesini emretti. Bunun üzerine Selahaddin iki lideri tutuklayıp Ramazan'ın ikinci günü çarmıha gerdiler. Kadı Fadil'in Abdülsamed'in hizmetine karşı ilgisizliğini sezdiği, bu yüzden ondan şüphelendiği ve İbn Neca'yı olayı ortaya çıkarmakla görevlendirdiği belirtiliyor. {Kaynak: Kamil İbn el-Athir s. 53-54}"
  id: "Pada tahun 69, sekelompok Syiah Fatimiyah dan pendukung mereka ingin menghidupkan kembali Kekhalifahan Fatimiyah dan mengembalikannya kepada keturunan al-Adid. Sekelompok emir Saladin menyetujui mereka, tetapi Saladin mengetahui hal ini dan menyalib mereka di antara dua istana {cite:tarikh-khulafa-minhaj-1434 p. 684}. Ibn al-Athir merinci rencana tersebut: Di antara mereka adalah Amara ibn Abi al-Hasan al-Yamani, sang penyair, Abd al-Samad sang juru tulis, hakim al-Uwayris, kepala misionaris, tentara Mesir dan orang-orang Sudan mereka, dan rombongan istana. Mereka setuju untuk memanggil orang-orang Frank dari Sisilia dan pantai Levant dengan menawarkan uang dan tanah kepada mereka. Jika Saladin pergi menemui mereka, mereka akan memberontak di Kairo dan memulihkan Kekhalifahan Fatimiyah, dan mereka yang berada di pasukannya yang setuju dengan mereka akan berbalik melawannya. Jika dia tinggal dan mengirim pasukan, mereka akan menangkapnya. Amara berkata: Aku telah mengirim saudaranya ke Yaman karena takut dia akan menggantikannya. Wahyu mereka adalah bahwa mereka telah membawa serta Zain al-Din Ali ibn Najja sang pendakwah. Ketika dia mengetahui kebenaran masalah tersebut, dia memberi tahu Saladin, yang memerintahkannya untuk tinggal bersama mereka, bersekongkol dengan mereka, dan memberitahunya tentang apa yang terjadi, sampai seorang utusan tiba dari raja Frank di pantai dan mengungkapkan kebenaran masalah tersebut. Maka dia menangkap kedua pemimpin itu dan menyalib mereka pada tanggal dua Ramadan. Mereka menyebutkan bahwa al-Qadi al-Fadil merasakan ketidakpedulian Abd al-Samad terhadap pengabdiannya, sehingga dia mencurigainya dan menugaskan Ibn Najja untuk mengungkap masalah tersebut. {kutipan:kamil-ibn-al-athir hlm. 53-54}"
