id: event/testament-of-nuh-to-his-son
class: event
kind: death
label:
  ar: وصية نوح لابنه عند وفاته
  en: Testament of Nuh to his son
  ur: نوح کی اپنے بیٹے کو وصیت
  es: "Testamento de Noé a su hijo"
  fr: "Testament de Noé à son fils"
  tr: "Nuh'un ölümünden sonra oğluna bıraktığı vasiyetname."
  id: "Wasiat Nuh kepada putranya setelah kematiannya"
summary:
  ar: 'يروي ابن كثير حديثاً بإسناد يصفه بالصحيح أن نوحاً لما حضرته الوفاة قال لابنه: آمرك باثنتين وأنهاك عن اثنتين، فأمره بـ«لا إله إلا الله» و«سبحان الله وبحمده» ونهاه عن الشرك والكبر {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 120} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 123}؛ ويذكر الخلاف في عمره وأن قبره بالمسجد الحرام أقوى مما قيل إنه بكرك نوح في البقاع {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 121}.'
  en: 'Ibn Kathir gives a hadith whose chain he calls sound: when death came to Nuh he told his son ''I command you two things and forbid you two'', commanding ''there is no god but God'' and ''glory be to God and His praise'' and forbidding shirk and pride {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 120} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 123}. He discusses Nuh''s age and says the report that his grave is in the Sacred Mosque is stronger than the claim for Karak Nuh in the Bekaa {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 121}.'
  ur: 'ابن کثیر ایک حدیث لاتے ہیں جس کی سند کو وہ صحیح کہتے ہیں: وفات کے وقت نوح نے بیٹے سے کہا کہ میں دو باتوں کا حکم دیتا اور دو سے روکتا ہوں، «لا الہ الا اللہ» اور «سبحان اللہ وبحمدہ» کا حکم دیا اور شرک و تکبر سے روکا {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 120} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 123}؛ وہ عمر کا اختلاف بیان کرتے ہیں اور کہتے ہیں کہ قبر مسجدِ حرام میں ہونے کی روایت بقاع کے کرک نوح کے دعوے سے مضبوط ہے {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 121}۔'
  es: "Ibn Kathir presenta un hadiz cuya cadena considera sólida: cuando la muerte le llegó a Noé, le dijo a su hijo: «Te mando dos cosas y te prohíbo dos», ordenando «no hay más dios que Dios» y «¡Gloria a Dios y a Él sea la alabanza!», y prohibiendo el shirk y el orgullo {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 120} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 123}. Analiza la edad de Noé y afirma que el relato de que su tumba se encuentra en la Mezquita Sagrada es más sólido que la afirmación de que Karak Noé está en la Bekaa {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 121}."
  fr: "Ibn Kathir rapporte un hadith dont il juge la chaîne de transmission authentique: lorsque Noé mourut, il dit à son fils: « Je te commande deux choses et je t’en interdis deux », lui ordonnant de dire « Il n’y a de dieu que Dieu » et « Gloire à Dieu et louange à Lui », et lui interdisant le shirk et l’orgueil (Qisas al-Anbiya, Ibn Kathir, p. 120; Al-Bidaya wal-Nihaya, vol. 2, p. 123). Il aborde ensuite l’âge de Noé et affirme que le récit selon lequel sa tombe se trouve dans la Mosquée sacrée est plus crédible que celui qui la situe dans la Bekaa (Qisas al-Anbiya, Ibn Kathir, p. 121)."
  tr: "İbn Kathir, sahih olarak nitelendirdiği bir isnad zinciriyle bir hadis rivayet eder: Nuh ölüm döşeğindeyken oğluna şöyle demiştir: \"Sana iki şey emrediyorum, iki şey de yasaklıyorum.\" Bunun üzerine oğluna \"Allah'tan başka ilah yoktur\" ve \"Allah'a hamd olsun\" demesini emretmiş, Allah'a ortak koşmasını ve kibirlenmesini yasaklamıştır. {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 120} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 123}; ayrıca Nuh'un oğlu olduğuna dair söylenenlerden ziyade, Mescid-i Haram'daki kabrinin daha sağlam olduğuna dair ihtilaftan da bahseder. {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 121}."
  id: "Ibn Kathir meriwayatkan sebuah hadits dengan sanad yang menurutnya sahih, bahwa ketika Nabi Nuh berada di ranjang kematiannya, beliau berkata kepada putranya: \"Aku memerintahkanmu untuk melakukan dua hal dan aku melarangmu melakukan dua hal lainnya.\" Maka beliau memerintahkannya untuk mengucapkan \"Tidak ada Tuhan selain Allah\" dan \"Maha Suci Allah dan segala puji bagi-Nya\" dan beliau melarangnya menyekutukan Allah dan bersikap sombong. {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 120} {cite:al-bidaya-wal-nihaya scan vol. 2 p. 123}; dan beliau menyebutkan adanya perbedaan pendapat mengenai usianya dan bahwa kuburnya di Masjidil Haram lebih kokoh daripada apa yang dikatakan tentang dirinya sebagai putra Nabi Nuh di Beqaa. {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 121}."
