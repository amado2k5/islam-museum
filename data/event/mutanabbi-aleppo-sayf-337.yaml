label:
  ar: "المتنبي شاعر سيف الدولة بحلب، ٣٣٧هـ/٩٤٨م"
  en: "Al-Mutanabbi joins Sayf al-Dawla at Aleppo, 337/948"
  ur: "حلب میں سيف الدولہ کا شاعر، 337ھ/948ء"
  es: "Al-Mutanabbi se une a Sayf al-Dawla en Alepo, 337/948"
  fr: "Al-Mutanabbi rejoint Sayf al-Dawla à Alep, 337/948"
  tr: "El-Mutenabbi, Halep'teki Seyfü'd-Devle'nin şairi, H. 337/MS 948"
  id: "Al-Mutanabbi, penyair Sayf al-Dawla di Aleppo, 337 H/948 M."
summary:
  ar: "في مطلع سنة ٣٣٧هـ/٩٤٨م استقر المتنبي بدار السلطنة الحمدانية بحلب شاعراً رسمياً للأمير سيف الدولة، فأقام عنده تسع سنين رآه فيها رجل العرب المثالي شجاعاً هماماً سخياً، وبادله سيف الدولة التقدير فأغدق عليه العطايا ولم يعامله بتعالٍ قط؛ ورافقه الشاعر في غزواته فغنّى انتصاراته على الروم وعلى بدو البادية، وبلغت قصائد هذا العهد عند النقاد الشرقيين ذروة فنه {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  en: "At the beginning of 337/948 al-Mutanabbi established himself at the Hamdanid court in Aleppo as official poet of the amir Sayf al-Dawla, staying nine years. He was genuinely attached to this patron, in his eyes the ideal Arab chief — brave, magnanimous, generous — who in turn overwhelmed him with gifts and never treated him with arrogance. The poet accompanied his expeditions and sang his exploits against the Byzantines and the desert Bedouins; Eastern critics generally hold the poems of this period the summit of his art {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  ur: "337ھ/948ء کے آغاز میں متنبی حلب کی حمدانی دربار میں امیر سيف الدولہ کے رسمی شاعر بنے اور نو برس وہاں رہے۔ وہ اس سرپرست سے مخلص تھا جسے وہ مثالی عرب سردار سمجھتا تھا — بہادر، بلند ہمت اور سخی — اور سيف الدولہ نے بھی ان پر عطیوں کی کثرت کی اور کبھی تکبر نہیں کیا۔ شاعر مہمات میں ساتھ رہا اور رومیوں اور بادیہ کے بدویوں پر اس کی فتوحات گائیں؛ مشرقی نقاد اسی زمانے کی نظموں کو ان کے فن کی انتہا مانتے ہیں {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}۔"
  es: "A principios del año 337/948, al-Mutanabbi se estableció en la corte hamdaní de Alepo como poeta oficial del emir Sayf al-Dawla, donde permaneció nueve años. Sentía un profundo afecto por este mecenas, a quien consideraba el jefe árabe ideal: valiente, magnánimo y generoso, quien a su vez lo colmaba de regalos y jamás lo trató con arrogancia. El poeta acompañó sus expediciones y cantó sus hazañas contra los bizantinos y los beduinos del desierto; la crítica oriental generalmente considera que los poemas de este período representan la cúspide de su arte {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  fr: "Au début de l'année 337/948, al-Mutanabbi s'établit à la cour hamdanide d'Alep comme poète officiel de l'émir Sayf al-Dawla, où il séjourna neuf ans. Il était profondément attaché à ce protecteur, qu'il considérait comme le chef arabe idéal – courageux, magnanime et généreux – qui, en retour, le comblait de présents et ne le traitait jamais avec arrogance. Le poète accompagna ses expéditions et chanta ses exploits contre les Byzantins et les Bédouins du désert; les critiques orientaux considèrent généralement les poèmes de cette période comme le sommet de son art (voir: Encyclopaedia of Islam, vol. 7, p. 770)."
  tr: "Hicri 337/Miladi 948 yılının başlarında, El-Mutanabbi, Prens Sayf el-Dawla'nın resmi şairi olarak Halep'teki Hamdani Sultanlığı Sarayı'na yerleşti. Dokuz yıl boyunca onunla birlikte kaldı ve bu süre zarfında Prens onu ideal bir Arap erkeği, cesur, yürekli ve cömert biri olarak gördü. Sayf el-Dawla da bu takdiri, ona hediyeler yağdırarak ve asla kibirli davranmayarak karşılık verdi. Şair, onun seferlerine eşlik etti ve Romalılara ve çöl Bedevilerine karşı kazandığı zaferleri şiirleriyle anlattı. Doğu eleştirmenlerine göre, bu dönemin şiirleri sanatının zirvesine ulaştı. {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}"
  id: "Pada awal tahun 337 H/948 M, Al-Mutanabbi menetap di Istana Kesultanan Hamdanid di Aleppo sebagai penyair resmi Pangeran Sayf al-Dawla. Ia tinggal bersamanya selama sembilan tahun, di mana sang Pangeran menganggapnya sebagai sosok pria Arab ideal, pemberani, gagah, dan murah hati. Sayf al-Dawla membalas penghargaan itu dengan menghujaninya dengan hadiah dan tidak pernah memperlakukannya dengan arogan. Sang penyair menemaninya dalam kampanye-kampanyenya dan menyanyikan tentang kemenangannya atas bangsa Romawi dan suku Badui di padang pasir. Puisi-puisi dari era ini mencapai puncak keseniannya menurut para kritikus Timur. {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
