label:
  ar: "المتنبي شاعر سيف الدولة بحلب، ٣٣٧هـ/٩٤٨م"
  en: "Al-Mutanabbi joins Sayf al-Dawla at Aleppo, 337/948"
  ur: "حلب میں سيف الدولہ کا شاعر، 337ھ/948ء"
summary:
  ar: "في مطلع سنة ٣٣٧هـ/٩٤٨م استقر المتنبي بدار السلطنة الحمدانية بحلب شاعراً رسمياً للأمير سيف الدولة، فأقام عنده تسع سنين رآه فيها رجل العرب المثالي شجاعاً هماماً سخياً، وبادله سيف الدولة التقدير فأغدق عليه العطايا ولم يعامله بتعالٍ قط؛ ورافقه الشاعر في غزواته فغنّى انتصاراته على الروم وعلى بدو البادية، وبلغت قصائد هذا العهد عند النقاد الشرقيين ذروة فنه {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  en: "At the beginning of 337/948 al-Mutanabbi established himself at the Hamdanid court in Aleppo as official poet of the amir Sayf al-Dawla, staying nine years. He was genuinely attached to this patron, in his eyes the ideal Arab chief — brave, magnanimous, generous — who in turn overwhelmed him with gifts and never treated him with arrogance. The poet accompanied his expeditions and sang his exploits against the Byzantines and the desert Bedouins; Eastern critics generally hold the poems of this period the summit of his art {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  ur: "337ھ/948ء کے آغاز میں متنبی حلب کی حمدانی دربار میں امیر سيف الدولہ کے رسمی شاعر بنے اور نو برس وہاں رہے۔ وہ اس سرپرست سے مخلص تھا جسے وہ مثالی عرب سردار سمجھتا تھا — بہادر، بلند ہمت اور سخی — اور سيف الدولہ نے بھی ان پر عطیوں کی کثرت کی اور کبھی تکبر نہیں کیا۔ شاعر مہمات میں ساتھ رہا اور رومیوں اور بادیہ کے بدویوں پر اس کی فتوحات گائیں؛ مشرقی نقاد اسی زمانے کی نظموں کو ان کے فن کی انتہا مانتے ہیں {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}۔"
