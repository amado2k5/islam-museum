summary:
  ar: "سنة 1326م أتم ابن بطوطة الحج، بعد أن مرّ بمصر والشام والتحق بقافلة إلى مكة، ثم عبر الصحراء إلى العراق. {cite:britannica-ibn-battuta}"
  en: "In 1326 Ibn Battuta completed the pilgrimage, having come through Egypt and Syria with a caravan to Mecca; he then crossed the desert to Iraq."
  ur: "1326ء میں ابن بطوطہ نے مصر اور شام سے ہوتے ہوئے ایک قافلے کے ساتھ مکہ پہنچ کر حج مکمل کیا، پھر صحرا پار کر کے عراق گئے۔"
  es: "En 1326, Ibn Battuta completó la peregrinación, tras haber viajado a La Meca a través de Egipto y Siria con una caravana; luego cruzó el desierto hasta Irak."
  fr: "En 1326, Ibn Battuta acheva le pèlerinage, après avoir traversé l'Égypte et la Syrie avec une caravane jusqu'à La Mecque; il traversa ensuite le désert jusqu'en Irak."
  tr: "İbn Battuta, 1326 yılında Mısır ve Levant'tan geçerek, Mekke'ye giden bir kervana katılarak ve ardından çölü geçerek Irak'a ulaşarak Hac ibadetini tamamladı. {cite:britannica-ibn-battuta}"
  id: "Pada tahun 1326 M, Ibn Battuta menyelesaikan ibadah haji, setelah melewati Mesir dan Levant, bergabung dengan kafilah menuju Mekah, dan kemudian menyeberangi gurun ke Irak. {cite:britannica-ibn-battuta}"
