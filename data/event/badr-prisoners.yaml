label: { en: "The affair of the Badr prisoners", ar: "قضية أسارى بدر", fr: "L'affaire des prisonniers de Badr", es: "El caso de los prisioneros de Badr", ur: "بدر کے قیدیوں کا معاملہ", tr: "Bedir esirlerinin davası", id: "Kasus para tahanan Badr" }
summary:
  en: "The aftermath decision over the seventy Badr captives: the consultation in which Abu Bakr advised ransom and Umar advised execution, the ransom terms (1000–4000 dirhams, or teaching ten boys to write), the executions of al-Nadr and Uqba, and the exegetical comments in 8:67-68 and 47:4."
  ar: "ما أعقب بدر من نظر في شأن نحو سبعين أسيراً: مشورة أبي بكر بالفداء وعمر بالقتل، ثم قبول الفداء ⁦(من ألف إلى أربعة آلاف درهم أو تعليم عشرة غلمان الكتابة)⁩، وإعدام النضر بن الحارث وعقبة بن أبي معيط، وتعليق آيتَي الأنفال ٦٧-٦٨ ومحمد ٤ على القرار."
  fr: "La décision prise après la bataille au sujet des soixante-dix captifs de Badr : la consultation où Abu Bakr conseilla la rançon et Umar l'exécution, les conditions de rançon (1000 à 4000 dirhams, ou apprendre l'écriture à dix garçons), les exécutions d'al-Nadr et d'Uqba, et les commentaires exégétiques de 8:67-68 et 47:4."
  es: "La decisión posterior sobre los setenta cautivos de Badr: la consulta en la que Abu Bakr aconsejó el rescate y Umar la ejecución, las condiciones del rescate (1000-4000 dirhams, o enseñar a escribir a diez niños), las ejecuciones de al-Nadr y Uqba, y los comentarios exegéticos en 8:67-68 y 47:4."
  ur: "بدر کے ستر اسیروں کے بارے میں بعد کا فیصلہ: وہ مشاورت جس میں ابوبکر نے تاوان کا مشورہ دیا اور عمر نے پھانسی کا مشورہ دیا، فدیہ کی شرائط ⁦(1000-4000 درہم، یا دس لڑکوں کو لکھنا سکھانا)⁩، الندر اور عقبہ کی پھانسی، اور فضیلت کے تبصرے: 4:76 اور 74:68 میں۔"
  tr: "Bedir'den sonra yaklaşık yetmiş esirin durumu ele alındı: Ebu Bekir'in onları fidye karşılığında serbest bırakma önerisi ve Ömer'in onları öldürme önerisi; ardından fidyeyi kabul etme (bin ila dört bin dirhem veya on çocuğa yazı yazmayı öğretme) ve Nadr bin Harith ile Ukba bin Ebu Muayt'ı idam etme; ve Enfal Suresi 67-68 ve Muhammed Suresi 4. ayetleri bu karara bağlı olarak askıya alma."
  id: "Setelah Pertempuran Badr, terjadilah pertimbangan mengenai sekitar tujuh puluh tawanan: saran Abu Bakar untuk menebus mereka dan saran Umar untuk membunuh mereka, kemudian menerima tebusan (dari seribu hingga empat ribu dirham atau mengajari sepuluh anak laki-laki menulis), dan mengeksekusi Al-Nadr bin Al-Harith dan Uqba bin Abi Mu’ayt, serta menangguhkan dua ayat Al-Anfal 67-68 dan Muhammad 4 pada keputusan tersebut."
