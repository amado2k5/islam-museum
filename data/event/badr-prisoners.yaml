label: { en: "The affair of the Badr prisoners", ar: "قضية أسارى بدر" }
summary:
  en: "The aftermath decision over the seventy Badr captives: the consultation in which Abu Bakr advised ransom and Umar advised execution, the ransom terms (1000–4000 dirhams, or teaching ten boys to write), the executions of al-Nadr and Uqba, and the exegetical comments in 8:67-68 and 47:4."
  ar: "ما أعقب بدر من نظر في شأن نحو سبعين أسيراً: مشورة أبي بكر بالفداء وعمر بالقتل، ثم قبول الفداء (من ألف إلى أربعة آلاف درهم أو تعليم عشرة غلمان الكتابة)، وإعدام النضر بن الحارث وعقبة بن أبي معيط، وتعليق آيتَي الأنفال ٦٧-٦٨ ومحمد ٤ على القرار."
