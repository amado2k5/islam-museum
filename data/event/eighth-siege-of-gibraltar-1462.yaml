  tr: "1462 yılında gerçekleşen ve Kastilyalıların dağı Müslümanlardan kalıcı olarak geri aldığı Cebelitarık'ın sekizinci kuşatmasına ait ön hazırlık kartı; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Peta pendahuluan pengepungan Gibraltar kedelapan pada tahun 1462 M, di mana orang Kastilia merebut gunung itu dari kaum Muslim secara permanen; sumber-sumber di halaman ini belum ditinjau."
