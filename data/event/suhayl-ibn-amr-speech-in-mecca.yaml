label: { ar: "كلمة سهيل بن عمرو بمكة عند وفاة النبي", en: "Suhayl ibn Amr's speech in Mecca at the Prophet's death" }
summary:
  ar: "لما توفي النبي همّ أكثر أهل مكة بالرجوع عن الإسلام، فخاف عتاب بن أسيد والي مكة فتوارى؛ فقام سهيل بن عمرو فحمد الله وذكر وفاة النبي، وقال: إن ذلك لم يزد الإسلام إلا قوة، فمن رابنا ضربنا عنقه؛ فتراجع الناس، وظهر عتاب بن أسيد."
  en: "When the Prophet died most people of Mecca meant to renounce Islam; Attab ibn Usayd, its governor, hid; then Suhayl ibn Amr stood, praised God, named the Prophet's death and said it had only increased Islam in strength, and whoever doubted them they would strike his neck; the people drew back and Attab reappeared."
