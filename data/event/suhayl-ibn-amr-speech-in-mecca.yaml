id: event/suhayl-ibn-amr-speech-in-mecca
class: event
kind: other
label: { ar: "كلمة سهيل بن عمرو بمكة عند وفاة النبي", en: "Suhayl ibn Amr's speech in Mecca at the Prophet's death", es: "Discurso de Suhayl ibn Amr en La Meca tras la muerte del Profeta.", fr: "Discours de Suhayl ibn Amr à La Mecque lors du décès du Prophète", ur: "سہیل بن عمرو کی مکہ میں رسول اللہ کی وفات پر تقریر" }
summary:
  ar: "لما توفي النبي همّ أكثر أهل مكة بالرجوع عن الإسلام، فخاف عتاب بن أسيد والي مكة فتوارى؛ فقام سهيل بن عمرو فحمد الله وذكر وفاة النبي، وقال: إن ذلك لم يزد الإسلام إلا قوة، فمن رابنا ضربنا عنقه؛ فتراجع الناس، وظهر عتاب بن أسيد."
  en: "When the Prophet died most people of Mecca meant to renounce Islam; Attab ibn Usayd, its governor, hid; then Suhayl ibn Amr stood, praised God, named the Prophet's death and said it had only increased Islam in strength, and whoever doubted them they would strike his neck; the people drew back and Attab reappeared."
  es: "Cuando murió el Profeta, la mayoría de la gente de La Meca tenía la intención de renunciar al Islam; Attab ibn Usayd, su gobernador, se escondió; entonces Suhayl ibn Amr se puso de pie, alabó a Dios, mencionó la muerte del Profeta y dijo que solo había fortalecido al Islam, y que a quien dudara de ellos le cortarían el cuello; la gente retrocedió y Attab reapareció."
  fr: "À la mort du Prophète, la plupart des habitants de La Mecque eurent l'intention de renoncer à l'islam; Attab ibn Usayd, son gouverneur, se cacha; puis Suhayl ibn Amr se leva, loua Dieu, annonça la mort du Prophète et déclara qu'elle n'avait fait que renforcer l'islam, et que quiconque en doutait serait frappé à la nuque; le peuple recula et Attab réapparut."
  ur: "جب نبی کی وفات ہوئی تو مکہ کے زیادہ تر لوگوں کا مطلب اسلام کو ترک کرنا تھا۔ اس کے گورنر عتاب بن اسید چھپ گئے۔ پھر سہیل بن عمرو کھڑے ہوئے، اللہ کی حمد و ثنا بیان کی، رسول اللہ کی وفات کا نام لیا اور کہا کہ اس سے اسلام کی طاقت میں اضافہ ہوا ہے، اور جو ان میں شک کرے گا وہ اس کی گردن ماریں گے۔ لوگ پیچھے ہٹے اور عتاب دوبارہ نمودار ہوا۔"
