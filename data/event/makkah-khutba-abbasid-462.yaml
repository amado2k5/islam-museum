label: { ar: "خطبة مكة للخليفة العباسي والسلطان السلجوقي" }
summary:
  ar: "في سنة ٤٦٢هـ ورد رسول صاحب مكة محمد بن أبي هاشم إلى السلطان ألب أرسلان يخبره بإقامة الخطبة للخليفة العباسي القائم وله وإسقاط خطبة الخليفة الفاطمي صاحب مصر، وترك الأذان بـ«حي على خير العمل»، فأعطاه السلطان ثلاثين ألف دينار وقال له: إذا فعل أمير المدينة كذلك أعطيناه عشرين ألف دينار. وكان ذلك في سياق حملة ألب أرسلان لتوحيد العالم الإسلامي تحت راية الخلافة العباسية {cite:dawlat-uthmaniyya-salabi p. 30}."
  en: "In 1070 the Sharif of Mecca's envoy told Alp Arslan that the khutba there now named the Abbasid caliph and the Seljuk sultan, dropping the Fatimid name and the 'hayya ala khayr al-amal' formula — worth thirty thousand dinars, and twenty thousand more promised if Medina followed {cite:dawlat-uthmaniyya-salabi p. 30}."
