label: { ar: "خطبة مكة للخليفة العباسي والسلطان السلجوقي", en: "The Khutba at Mecca for the Abbasid Caliph and the Seljuk Sultan", es: "La jutba en La Meca para el califa abasí y el sultán selyúcida.", fr: "Le sermon (khutba) à La Mecque pour le calife abbasside et le sultan seldjoukide", ur: "عباسی خلیفہ اور سلجوق سلطان کے لیے مکہ میں خطبہ", tr: "Abbasî Halifesi ve Selçuklu Sultanı'nın Mekke Hutbesi", id: "Khutbah Mekah dari Khalifah Abbasiyah dan Sultan Seljuk" }
summary:
  ar: "في سنة ٤٦٢هـ ورد رسول صاحب مكة محمد بن أبي هاشم إلى السلطان ألب أرسلان يخبره بإقامة الخطبة للخليفة العباسي القائم وله وإسقاط خطبة الخليفة الفاطمي صاحب مصر، وترك الأذان بـ«حي على خير العمل»، فأعطاه السلطان ثلاثين ألف دينار وقال له: إذا فعل أمير المدينة كذلك أعطيناه عشرين ألف دينار. وكان ذلك في سياق حملة ألب أرسلان لتوحيد العالم الإسلامي تحت راية الخلافة العباسية {cite:dawlat-uthmaniyya-salabi p. 30}."
  en: "In 1070 the Sharif of Mecca's envoy told Alp Arslan that the khutba there now named the Abbasid caliph and the Seljuk sultan, dropping the Fatimid name and the 'hayya ala khayr al-amal' formula — worth thirty thousand dinars, and twenty thousand more promised if Medina followed {cite:dawlat-uthmaniyya-salabi p. 30}."
  es: "En 1070, el enviado del jerife de La Meca le dijo a Alp Arslan que la jutba de allí ahora nombraba al califa abasí y al sultán selyúcida, dejando de lado el nombre fatimí y la fórmula 'hayya ala khayr al-amal', que valía treinta mil dinares, y se prometían veinte mil más si Medina seguía {cite:dawlat-uthmaniyya-salabi p. 30}."
  fr: "En 1070, l'envoyé du chérif de La Mecque a dit à Alp Arslan que le khutba là-bas nommait désormais le calife abbasside et le sultan seldjoukide, abandonnant le nom fatimide et la formule « hayya ala khayr al-amal » — d'une valeur de trente mille dinars, et vingt mille autres promis si Médine suivait {cite:dawlat-uthmaniyya-salabi p. 30}."
  ur: "1070 میں مکہ کے ایلچی شریف نے الپ ارسلان کو بتایا کہ وہاں کے خطبہ نے اب عباسی خلیفہ اور سلجوق سلطان کا نام دیا، فاطمی نام اور حیا الا خیر الامال فارمولہ چھوڑ دیا - جس کی مالیت تیس ہزار دینار ہے، اور بیس ہزار مزید دینے کا وعدہ اگر مدینہ منورہ کی پیروی کی جائے۔ 30}۔"
  tr: "Hicri 462 yılında, Mekke hükümdarı Muhammed ibn Abi Haşim'den bir elçi Sultan Alp Arslan'a gelerek, Cuma hutbesinin Abbasi Halifesi el-Kaim ve kendi adına okunması, Mısır Fatımi Halifesi adına okunmaması ve ezandan \"En hayırlı amellere gelin\" ifadesinin çıkarılması gerektiğini bildirdi. Sultan ona otuz bin dinar verdi ve \"Eğer Medine hükümdarı da aynısını yaparsa, ona yirmi bin dinar vereceğiz\" dedi. Bu olay, Alp Arslan'ın İslam dünyasını Abbasi Halifeliği bayrağı altında birleştirme çabası bağlamında gerçekleşti."
  id: "Pada tahun 462 H, seorang utusan dari penguasa Mekah, Muhammad ibn Abi Hashim, tiba di hadapan Sultan Alp Arslan dan memberitahukannya bahwa khutbah Jumat hendaknya disampaikan atas nama Khalifah Abbasiyah al-Qaim dan dirinya sendiri, dan bahwa khutbah tersebut harus dihilangkan atas nama Khalifah Fatimiyah Mesir, serta frasa \"Marilah kepada amalan yang terbaik\" harus dihapus dari seruan azan. Sultan memberinya tiga puluh ribu dinar dan berkata, \"Jika penguasa Madinah melakukan hal yang sama, kami akan memberinya dua puluh ribu dinar.\" Hal ini terjadi dalam konteks kampanye Alp Arslan untuk menyatukan dunia Islam di bawah panji Kekhalifahan Abbasiyah."
