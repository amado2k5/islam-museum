summary:
  ar: "مات عبد المطلب بمكة ولحفيده محمد ثماني سنوات وشهران وعشرة أيام، بعد أن رقّ عليه رقة لم يرقّها على أحد من أولاده، ورأى قبل وفاته أن يعهد بكفالته إلى عمه أبي طالب شقيق أبيه، فنهض أبو طالب بحقه وظل فوق أربعين سنة يحميه."
  en: "Abd al-Muttalib died at Mecca when his grandson Muhammad was eight years, two months and ten days old, having shown him a tenderness he showed none of his sons; before dying he entrusted the boy to his uncle Abu Talib, full brother of his father, who took up the charge and protected him for over forty years."
