label: { ar: "وفاة عبد المطلب وكفالة أبي طالب", en: "Death of Abd al-Muttalib and Abu Talib's guardianship", es: "Muerte de Abd al-Muttalib y tutela de Abu Talib", fr: "Mort d'Abd al-Muttalib et tutelle d'Abu Talib", ur: "عبد المطلب کی وفات اور ابو طالب کی ولایت", tr: "Abdul Muttalib'in ölümü ve Ebu Talib'in vesayeti", id: "Kematian Abdul Muttalib dan perwalian Abu Talib" }
summary:
  ar: "مات عبد المطلب بمكة ولحفيده محمد ثماني سنوات وشهران وعشرة أيام، بعد أن رقّ عليه رقة لم يرقّها على أحد من أولاده، ورأى قبل وفاته أن يعهد بكفالته إلى عمه أبي طالب شقيق أبيه، فنهض أبو طالب بحقه وظل فوق أربعين سنة يحميه."
  en: "Abd al-Muttalib died at Mecca when his grandson Muhammad was eight years, two months and ten days old, having shown him a tenderness he showed none of his sons; before dying he entrusted the boy to his uncle Abu Talib, full brother of his father, who took up the charge and protected him for over forty years."
  es: "Abd al-Muttalib murió en La Meca cuando su nieto Muhammad tenía ocho años, dos meses y diez días, habiéndole demostrado una ternura que no mostró a ninguno de sus hijos; antes de morir, confió al niño a su tío Abu Talib, hermano de padre y madre, quien se hizo cargo de él y lo protegió durante más de cuarenta años."
  fr: "Abd al-Muttalib mourut à La Mecque lorsque son petit-fils Muhammad avait huit ans, deux mois et dix jours, après lui avoir témoigné une tendresse qu'il n'avait manifestée envers aucun de ses fils; avant de mourir, il confia le garçon à son oncle Abu Talib, frère germain de son père, qui prit en charge le garçon et le protégea pendant plus de quarante ans."
  ur: "عبدالمطلب کا مکہ میں انتقال ہوا جب ان کا پوتا محمد آٹھ سال، دو ماہ اور دس دن کا تھا، اس کے ساتھ نرمی کا مظاہرہ کرتے ہوئے اس نے اپنے بیٹوں میں سے کسی کو نہیں دکھایا۔ مرنے سے پہلے اس نے لڑکے کو اپنے چچا ابو طالب کے سپرد کر دیا، جو اس کے والد کے مکمل بھائی تھے، جنہوں نے اس کی ذمہ داری سنبھالی اور چالیس سال تک اس کی حفاظت کی۔"
  tr: "Abdul Muttalib, torunu Muhammed sekiz yaş, iki ay ve on günlükken Mekke'de vefat etti. Ona, diğer çocuklarına göstermediği bir şefkat göstermişti. Ölümünden önce, bakımını babasının kardeşi olan amcası Ebu Talib'e emanet etmeye karar verdi ve Ebu Talib görevini yerine getirerek onu kırk yıldan fazla bir süre korudu."
  id: "Abdul Muttalib meninggal di Mekah ketika cucunya, Muhammad, berusia delapan tahun, dua bulan, dan sepuluh hari, setelah menunjukkan kasih sayang yang belum pernah ia tunjukkan kepada anak-anaknya yang lain. Sebelum meninggal, ia memutuskan untuk mempercayakan perawatan Muhammad kepada pamannya, Abu Talib, saudara laki-laki ayahnya, dan Abu Talib memenuhi tugasnya dan terus melindunginya selama lebih dari empat puluh tahun."
