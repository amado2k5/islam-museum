label: { ar: "الغلاء العام سنة ٢٦٠", en: "The General Famine of 260 AH", es: "La hambruna general del año 260 d. C.", fr: "La famine générale de 260 AH", ur: "260 ہجری کا عام قحط", tr: "260 yılındaki genel enflasyon", id: "Inflasi umum pada tahun 260" }
summary:
  ar: "في سنة ستين ومائتين اشتد الغلاء في عامة بلاد الإسلام، فأُجلي عن مكة من كان مجاورًا بها من شدة الغلاء إلى المدينة وغيرها من البلدان ورحل عنها العامل الذي كان بها، وبلغ كُرّ الحنطة ببغداد خمسين ومائة دينار ودام ذلك شهورًا؛ وفيها قتل قائد الزنج علي بن زيد العلوي صاحب الكوفة {cite:muntazam-ibn-al-jawzi p. 110}."
  en: "In 260 famine gripped all the lands of Islam: Mecca's sojourners were evacuated to Medina and elsewhere and its governor withdrew; a kurr of wheat reached a hundred and fifty dinars in Baghdad for months. That year the Zanj leader killed 'Ali ibn Zayd, the Alid master of Kufa {cite:muntazam-ibn-al-jawzi p. 110}."
  es: "En el año 260, la hambruna asoló todas las tierras del Islam: los peregrinos de La Meca fueron evacuados a Medina y otros lugares, y su gobernador se retiró; un kurr de trigo alcanzó los ciento cincuenta dinares en Bagdad durante meses. Ese año, el líder zanj asesinó a Ali ibn Zayd, el señor alid de Kufa {cite:muntazam-ibn-al-jawzi p. 110}."
  fr: "En 260, la famine ravagea toutes les terres d'Islam: les étrangers de La Mecque furent évacués vers Médine et d'autres destinations, et son gouverneur se retira; une pénurie de blé atteignit le prix de cent cinquante dinars à Bagdad pendant des mois. Cette même année, le chef Zanj fit assassiner Ali ibn Zayd, le maître alide de Koufa (cf. Muntazam ibn al-Jawzi, p. 110)."
  ur: "260 میں قحط نے اسلام کی تمام سرزمین کو اپنی لپیٹ میں لے لیا: مکہ کے مسافروں کو مدینہ اور دیگر جگہوں پر نکالا گیا اور اس کے گورنر نے دستبرداری اختیار کر لی۔ بغداد میں مہینوں تک گندم کا ایک کُر ڈیڑھ سو دینار تک پہنچ گیا۔ اسی سال زنج کے سردار نے علی ابن زید کو قتل کر دیا، کوفہ کے علید آقا {حوالہ:منتظم ابن الجوزی ص۔ 110}۔"
  tr: "Hicri 260 yılında, İslam topraklarının çoğunda enflasyon şiddetlendi; bu nedenle Mekke'de yaşayanlar, enflasyonun şiddeti yüzünden Medine'ye ve diğer ülkelere göç ettirildi. Oradaki vali de şehri terk etti ve Bağdat'ta bir külr buğdayın fiyatı 150 dinara ulaştı ve bu durum aylarca sürdü. Bu olayda, Kûfe hükümdarı Zenc lideri Ali bin Zeyd el-Alevi öldürüldü. {cite:muntazam-ibn-al-jawzi s. 110}"
  id: "Pada tahun 260 Hijriah, inflasi meningkat di sebagian besar wilayah Islam, sehingga penduduk Mekah dievakuasi dari sana karena parahnya inflasi ke Madinah dan negara-negara lain. Gubernur yang berada di sana pun meninggalkan Mekah, dan harga satu kurr gandum di Baghdad mencapai 150 dinar, dan ini berlanjut selama berbulan-bulan; dan pada saat itu, pemimpin Zanj, Ali bin Zaid Al-Alawi, penguasa Kufa, terbunuh. {cite:muntazam-ibn-al-jawzi p. 110}."
