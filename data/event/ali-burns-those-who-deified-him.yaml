issue: { ar: "إحراق الغلاة: هل تُحرق الجماعة التي تدعي إلهية علي، وما حكم التحريق في الخلاف بين الصحابة؟", en: "Whether the group that claimed Ali's divinity may be burned, and the Companions' disagreement on burning" }
perspectives:
  - tradition: sunni
    id: sunni-book
    summary:
      ar: "يورد الصلابي رواية إحراق الغلاة عن علي كما نقلها البخاري عن عكرمة، ويعرض فيها اعتراض ابن عباس بحديث النهي عن تعذيب بعذاب الله وحديث قتل من بدّل دينه، ويعرض قول ابن حجر الذي يرى أن «ويح» قد تكون كلمة رحمة أو تعجب، وقول ابن تيمية بأن علياً حرق غالبية الرافضة الذين اعتقدوا فيه الإلهية، ثم يعرض أقوال السلف في التحريق عامة: كرهه عمر وابن عباس، وأجازه علي وخالد بن الوليد، وفعل أبي بكر في اللوطية وفي أهل الردة بحسب ما نقله ابن القيم {cite:sallabi-ali-vol1 p. 244-245}. والكتاب ينقل هذه الأقوال ولا يحكم بينها صراحة في هذا الموضع."
      en: "Al-Sallabi gives the report of Ali burning the extremists via al-Bukhari, Ibn Abbas's objection, Ibn Hajar's reading of the phrase 'woe to him', Ibn Taymiyya's statement that Ali burned most of those who believed in his divinity, and the earlier scholars' disagreement on burning: Umar and Ibn Abbas disliked it, while Ali and Khalid ibn al-Walid allowed it. The book reports these views without delivering a verdict in this passage {cite:sallabi-ali-vol1 p. 244-245}."
    sources: [source/sallabi-ali-vol1]
