  - tradition: other
    id: other-view
    summary:
      ar: "الكتاب ينقل عن جماعة من السلف أنهم كرهوا التحريق مطلقاً، وهذا رأي معتبر عندهم، ولم يقدم الكتاب في هذا الموضع مرجعاً غيره يصوغ رأياً مستقلاً عن الاعتراض ويقابل ما قرره الصلابي (needs_source)."
      en: "The book reports the earlier scholars who disliked burning in any case; no separate non-Sunni or alternative historical view is set out here, and one needs to be sourced (needs_source)."
    sources: [source/sallabi-ali-vol1]
