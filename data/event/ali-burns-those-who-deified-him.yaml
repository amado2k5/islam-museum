id: event/ali-burns-those-who-deified-him
class: event
kind: other
label: { ar: "إحراق علي من غلوا فيه وادعوا إلهيته بالكوفة", en: "Ali burns people in Kufa who claimed he was God", es: "Ali quema a personas en Kufa que afirmaban que él era Dios.", fr: "Ali brûle les personnes à Koufa qui prétendaient qu'il était Dieu.", ur: "علی کوفہ میں ان لوگوں کو جلاتا ہے جنہوں نے دعویٰ کیا تھا کہ وہ خدا ہے۔", tr: "Ali, Kufa'da kendi statüsünü abartan ve ilahlığını iddia edenleri yaktı.", id: "Ali membakar orang-orang yang melebih-lebihkan kedudukannya dan mengklaim keilahiannya di Kufa." }
summary:
  ar: "قيل لعلي إن قوماً على باب المسجد يدعون أنه ربهم، فدعاهم وقال: «إنما أنا عبد مثلكم»، فأبَوا، ثم أمهلهم ثلاثة أيام، فلما أصروا أوقد ناراً وأحرقهم. ينقل الصلابي هذا الخبر عن ابن شريك العامري وعن البخاري من حديث عكرمة، وفيه اعتراض ابن عباس بالنهي عن التعذيب بعذاب الله، ويذكر قول ابن تيمية بأن علياً حرق غالبية الرافضة الذين اعتقدوا فيه الإلهية {cite:sallabi-ali-vol1 p. 243-244}."
  en: "Ali was told that people at the mosque door called him their lord; he said he was only a servant like them, gave them three days, and when they persisted he lit a fire and burned them. Al-Sallabi cites the report via al-Bukhari, Ibn Abbas's objection that the Prophet forbade punishment by fire, and Ibn Taymiyya's statement that Ali burned most of those who believed in his divinity."
  es: "A Ali le dijeron que la gente a la puerta de la mezquita lo llamaba su señor; él respondió que solo era un siervo como ellos, les dio tres días y, ante su insistencia, prendió fuego y los quemó. Al-Sallabi cita el relato de Al-Bujari, la objeción de Ibn Abbas de que el Profeta prohibió el castigo con fuego, y la afirmación de Ibn Taymiyya de que Ali quemó a la mayoría de quienes creían en su divinidad."
  fr: "On rapporta à Ali que des gens, à la porte de la mosquée, l'appelaient leur seigneur; il répondit qu'il n'était qu'un serviteur comme eux, leur accorda trois jours, et comme ils persistaient, il alluma un feu et les brûla vifs. Al-Sallabi cite ce récit rapporté par al-Bukhari, l'objection d'Ibn Abbas selon laquelle le Prophète aurait interdit le châtiment par le feu, et l'affirmation d'Ibn Taymiyya selon laquelle Ali aurait brûlé vifs la plupart de ceux qui croyaient en sa divinité."
  ur: "علی کو بتایا گیا کہ مسجد کے دروازے پر لوگ اسے اپنا آقا کہتے ہیں۔ اس نے کہا کہ میں ان جیسا ایک بندہ تھا، انہیں تین دن کا وقت دیا اور جب وہ ڈٹے رہے تو اس نے آگ جلا کر جلا دی۔ السلبی نے البخاری کے ذریعے رپورٹ کا حوالہ دیا، ابن عباس کے اس اعتراض کا حوالہ دیا کہ پیغمبر نے آگ سے سزا دینے سے منع کیا ہے، اور ابن تیمیہ کا بیان ہے کہ علی نے اپنی الوہیت پر یقین رکھنے والوں میں سے اکثر کو جلایا تھا۔"
  tr: "Ali'ye, bazı kişilerin mescidin kapısında kendisinin efendileri olduğunu iddia ettikleri bildirildi. Onları çağırdı ve \"Ben de sizin gibi bir kulum\" dedi. Ona inanmayı reddettiler. Bunun üzerine onlara üç gün süre verdi. Israr edince, ateş yakıp onları yaktı. El-Sallabi bu rivayeti İbn Şerik el-Amiri'den ve İkrime'nin nazil ettiği Buhari'den aktarır. İbn Abbas'ın, Allah'ın cezasını ceza olarak kullanmayı yasaklayan itirazını da içerir. El-Sallabi ayrıca İbn Taymiyye'nin, Ali'nin ilahlığına inanan Rafizilerin çoğunu yaktığına dair ifadesini de zikreder. {cite:sallabi-ali-vol1 s. 243-244}"
  id: "Dilaporkan kepada Ali bahwa beberapa orang berada di pintu masjid dan mengaku bahwa dia adalah tuhan mereka. Dia memanggil mereka dan berkata, “Aku hanyalah seorang hamba seperti kalian.” Mereka menolak untuk mempercayainya. Kemudian dia memberi mereka waktu tiga hari. Ketika mereka bersikeras, dia menyalakan api dan membakar mereka. Al-Sallabi mengutip riwayat ini dari Ibn Sharik al-Amiri dan dari al-Bukhari, berdasarkan riwayat Ikrimah. Riwayat ini mencakup keberatan Ibn Abbas, yang melarang penggunaan hukuman Tuhan untuk menghukum. Al-Sallabi juga menyebutkan pernyataan Ibn Taymiyyah bahwa Ali membakar sebagian besar kaum Rafidiyah yang percaya pada ketuhanannya. {cite:sallabi-ali-vol1 p. 243-244}"
