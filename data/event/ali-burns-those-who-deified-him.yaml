id: event/ali-burns-those-who-deified-him
class: event
kind: other
label: { ar: "إحراق علي من غلوا فيه وادعوا إلهيته بالكوفة", en: "Ali burns people in Kufa who claimed he was God" }
summary:
  ar: "قيل لعلي إن قوماً على باب المسجد يدعون أنه ربهم، فدعاهم وقال: «إنما أنا عبد مثلكم»، فأبَوا، ثم أمهلهم ثلاثة أيام، فلما أصروا أوقد ناراً وأحرقهم. ينقل الصلابي هذا الخبر عن ابن شريك العامري وعن البخاري من حديث عكرمة، وفيه اعتراض ابن عباس بالنهي عن التعذيب بعذاب الله، ويذكر قول ابن تيمية بأن علياً حرق غالبية الرافضة الذين اعتقدوا فيه الإلهية {cite:sallabi-ali-vol1 p. 243-244}."
  en: "Ali was told that people at the mosque door called him their lord; he said he was only a servant like them, gave them three days, and when they persisted he lit a fire and burned them. Al-Sallabi cites the report via al-Bukhari, Ibn Abbas's objection that the Prophet forbade punishment by fire, and Ibn Taymiyya's statement that Ali burned most of those who believed in his divinity."
