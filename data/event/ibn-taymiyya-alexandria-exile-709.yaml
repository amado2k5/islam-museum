id: event/ibn-taymiyya-alexandria-exile-709
class: event
kind: persecution
label:
  ar: "منفى ابن تيمية في برج بإسكندرية، ٧٠٩هـ/١٣٠٩م"
  en: "Ibn Taymiyya's exile in a tower at Alexandria, 709/1309"
  ur: "ابن تیمیہ کا اسکندریہ کے برج میں جلاوطنی، 709ھ/1309ء"
summary:
  ar: "لما ولي بيبرس الجاشنكير السلطنة سنة ٧٠٨هـ عادت الاضطهادات: في ليلة ٢٩-٣٠ صفر ٧٠٩هـ/٧-٨ أغسطس ١٣٠٩م حُمل ابن تيمية في حراسة مشددة إلى الإسكندرية حيث أُقيم في إقامة جبرية ببرج من قصر السلطان، يستقبل الزوار ويكتب، فلقي هناك مارّين من المغاربة وصنّف في أشهر المنفى السبعة منها «الرد على المنطقيين» ورداً طويلاً — مفقود اليوم — على «المرشدة» لابن تومرت. ولما عاد الناصر محمد بن قلاوون إلى العرش في ١ شوال ٧٠٩هـ/٤ مارس ١٣١٠م أطلقه واستقبله بالقاهرة {cite:encyclopaedia-of-islam-2 vol. 3 p. 984}."
  en: "When Baybars al-Jashnikir took the sultanate in 708 the persecutions resumed: on the last night of Safar 709/7-8 August 1309 Ibn Taymiyya was taken under strong guard to Alexandria and confined in a tower of the sultan's palace, allowed to receive visitors and to write. During the seven months of exile he met Maghribis passing through and composed important works, among them the Radd 'ala al-Mantiqiyyin and a long refutation (now lost) of Ibn Tumart's Murshida. When al-Nasir Muhammad ibn Qalawun regained the throne on 1 Shawwal 709/4 March 1310 he released Ibn Taymiyya and received him in audience at Cairo {cite:encyclopaedia-of-islam-2 vol. 3 p. 984}."
  ur: "جب بیبرس جاشنکیر 708ھ میں سلطان بنا تو اذیتیں پھر شروع ہوئیں: صفر 709ھ/7-8 اگست 1309ء کی آخری رات ابن تیمیہ کو سخت نگہبانی میں اسکندریہ پہنچایا گیا جہاں انہیں سلطان کے محل کے ایک برج میں نظربند رکھا گیا، ملاقات اور تصنیف کی اجازت کے ساتھ۔ سات ماہ کی جلاوطنی میں انہوں نے گزرنے والے مغرب کے مسافروں سے ملاقاتیں کیں اور اہم تصانیف لکھیں جن میں «الرد علی المنطقیین» اور ابن تومرت کی «المرشدہ» کا طویل رد (آج مفقود) شامل ہیں۔ جب الناصر محمد بن قلاوون 1 شوال 709ھ/4 مارچ 1310ء کو دوبارہ تخت پر آیا تو انہیں رہا کر کے قاہرہ میں ملاقات دی {cite:encyclopaedia-of-islam-2 vol. 3 p. 984}۔"
