label: { ar: "البيعة لابن المعتز", en: "Bay'a to Ibn al-Mu'tazz", fr: "La bay'a d'Ibn al-Mu'tazz", es: "Bay'a a Ibn al-Mu'tazz", ur: "بیع سے ابن المعتز" }
summary:
  ar: "في سنة ست وتسعين ومائتين، بعد خلع المقتدر، بويع عبد الله بن المعتز بالخلافة في دار المكتفي بظهر المخرّم، وبايعه القضاة، ولُقّب المنتصف بالله، وهو لقب اختاره لنفسه {cite:tabari-tarikh-abu-al-fadl j.11 p.31}."
  en: "In 296 AH, after al-Muqtadir was deposed, Abd Allah ibn al-Mu'tazz was pledged to the caliphate in the house of al-Muktafi at Zahr al-Mukharram, and the judges pledged to him. He was given the laqab al-Muntasif billah, a title he chose for himself {cite:tabari-tarikh-abu-al-fadl j.11 p.31}."
  fr: "En 296 H, après la déposition d'al-Muqtadir, Abd Allah ibn al-Mu'tazz reçut l'allégeance au califat dans la maison d'al-Muktafi à Zahr al-Mukharram, et les juges lui prêtèrent allégeance. Il reçut le laqab d'al-Muntasif billah, un titre qu'il choisit lui-même {cite:tabari-tarikh-abu-al-fadl j.11 p.31}."
  es: "En el año 296 de la Hégira, tras la deposición de al-Muqtadir, Abd Allah ibn al-Mu'tazz fue jurado al califato en la casa de al-Muktafi en Zahr al-Mukharram, y los jueces le juraron lealtad. Se le otorgó el laqab al-Muntasif billah, título que él mismo eligió {cite:tabari-tarikh-abu-al-fadl j.11 p.31}."
  ur: "296 ہجری میں، المقتدیر کے معزول ہونے کے بعد، عبد اللہ ابن المعتز کو ظہر المکرم کے مقام پر المکتفی کے گھر میں خلافت کی بیعت کی گئی، اور قاضیوں نے اس سے عہد کیا۔ اسے لقب المنتصف باللہ دیا گیا، ایک لقب جو اس نے اپنے لیے منتخب کیا {حوالہ: طبری-تاریخ-ابو الفضل ج.11 صفحہ 31}۔"
