summary:
  ar: "في سنة ست وتسعين ومائتين، بعد خلع المقتدر، بويع عبد الله بن المعتز بالخلافة في دار المكتفي بظهر المخرّم، وبايعه القضاة، ولُقّب المنتصف بالله، وهو لقب اختاره لنفسه {cite:tabari-tarikh-abu-al-fadl j.11 p.31}."
  en: "In 296 AH, after al-Muqtadir was deposed, Abd Allah ibn al-Mu'tazz was pledged to the caliphate in the house of al-Muktafi at Zahr al-Mukharram, and the judges pledged to him. He was given the laqab al-Muntasif billah, a title he chose for himself {cite:tabari-tarikh-abu-al-fadl j.11 p.31}."
