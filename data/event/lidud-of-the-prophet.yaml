id: event/lidud-of-the-prophet
class: event
kind: other
label: { ar: "لدُّ النبي في مرضه", en: "The dosing of the Prophet during his illness", es: "La dosificación del Profeta durante su enfermedad", fr: "Le traitement médicamenteux du Prophète durant sa maladie", ur: "بیماری کے دوران نبی کی خوراک", tr: "Peygamber hastaydı.", id: "Nabi sedang sakit." }
summary:
  ar: "في مرض النبي اجتمع نساء من أزواجه ونساء من المسلمين، منهن أسماء بنت عميس، وعنده العباس، فأجمعوا أن يلدّوه؛ فقال العباس: لألدّنّه؛ فلدّوه، فلما أفاق قال: من صنع هذا بي؟ قالوا: عمك؛ قال: هذا دواء أتى به نساء جئن من نحو هذه الأرض، وأشار نحو الحبشة، فقال عمه: خشينا أن يكون بك ذات الجنب؛ فقال: إن ذلك لداء ما كان الله ليقذفني به، ولا يبقى في البيت أحد إلا لُدّ إلا عمي، فلُدّت ميمونة وهي صائمة، عقوبة لهم بما صنعوا به."
  en: "During the Prophet's illness, a group of his wives and some Muslim women, among them Asma' bint Umays, gathered with al-Abbas present and agreed to dose him; al-Abbas said 'I will dose him'; they did; when he came round he asked who had done it, was told it was his uncle, and said this was a medicine brought by women from the direction of Abyssinia; his uncle said they feared pleurisy; he said that was a disease God would not bring on him, and that everyone in the house should be dosed except his uncle, so Maymuna, who was fasting, was dosed as a punishment for what they had done."
  es: "Durante la enfermedad del Profeta, un grupo de sus esposas y algunas mujeres musulmanas, entre ellas Asma' bint Umays, se reunieron con al-Abbas presente y acordaron administrarle la medicina; al-Abbas dijo 'Yo se la administraré'; así lo hicieron; cuando recuperó el conocimiento preguntó quién se la había dado, le dijeron que había sido su tío, y dijo que era una medicina traída por mujeres de la dirección de Abisinia; su tío dijo que temían la pleuresía; él dijo que esa era una enfermedad que Dios no le enviaría, y que todos en la casa debían ser medicados excepto su tío, así que Maymuna, que estaba ayunando, fue medicada como castigo por lo que habían hecho."
  fr: "Durant la maladie du Prophète, un groupe de ses épouses et quelques femmes musulmanes, parmi lesquelles Asma' bint Umays, se réunirent en présence d'al-Abbas et convinrent de lui administrer un remède. Al-Abbas accepta: « Je vais lui administrer le remède. » Elles s'exécutèrent. À son réveil, il demanda qui l'avait fait. On lui répondit que c'était son oncle, qui expliqua que ce remède avait été apporté par des femmes d'Abyssinie. Son oncle répondit qu'elles craignaient une pleurésie. Le Prophète rétorqua que Dieu ne lui infligerait pas une telle maladie et que tous les membres de la maison devaient recevoir le remède, à l'exception de son oncle. Ainsi, Maymuna, qui jeûnait, reçut le remède en guise de punition pour leur geste."
  ur: "رسول اللہ کی بیماری کے دوران، آپ کی ازواج مطہرات کا ایک گروہ اور کچھ مسلمان خواتین، جن میں اسماء بنت عمیس بھی شامل تھیں، عباس کے پاس جمع ہوئیں اور آپ کو خوراک دینے پر رضامند ہوئیں۔ العباس نے کہا 'میں اسے خوراک دوں گا'؛ انہوں نے کیا جب وہ آیا تو اس نے پوچھا کہ یہ کس نے کیا ہے، بتایا گیا کہ یہ اس کا چچا ہے، اور کہا کہ یہ وہ دوا ہے جو حبشہ کی طرف سے عورتیں لائی تھی۔ اس کے چچا نے کہا کہ وہ pleurisy سے ڈرتے ہیں؛ اس نے کہا کہ یہ ایسی بیماری تھی جو خدا اس پر نہیں لائے گا، اور گھر کے ہر فرد کو اس کے چچا کے علاوہ خوراک دی جائے، اس لیے میمونہ، جو روزے سے تھیں، کو ان کے کیے کی سزا کے طور پر خوراک دی گئی۔"
  tr: "Peygamberimiz hastayken, eşlerinden bazıları ve aralarında Asma bint Umays'ın da bulunduğu bazı Müslüman kadınlar Abbas'ın yanına toplandılar. Ona ilaç vermeye karar verdiler. Abbas, \"Ona ilaç vereceğim\" dedi. Böylece ona ilaç verdiler. İyileştiğinde, \"Bunu bana kim yaptı?\" diye sordu. \"Amcan\" dediler. \"Bu, bu topraklardan gelen kadınların getirdiği bir ilaçtır\" dedi ve Habeşistan yönünü işaret etti. Amcası, \"Zalüvizis hastalığına yakalandığından korktuk\" dedi. Abbas, \"Bu, Allah'ın bana asla nasip etmeyeceği bir hastalıktır\" dedi. Evdeki hiç kimse, amcam hariç, ilaçsız kalmadı. Böylece Umays'a, ona yaptıkları yüzünden ceza olarak, oruçluyken ilaç verildi."
  id: "Selama Nabi sakit, beberapa istrinya dan beberapa wanita Muslim, termasuk Asma' binti 'Umays, berkumpul bersama Al-Abbas. Mereka sepakat untuk memberinya obat. Al-Abbas berkata: Aku akan memberinya obat. Maka mereka memberinya obat. Ketika beliau sembuh, beliau bertanya: Siapa yang melakukan ini padaku? Mereka menjawab: Pamanmu. Beliau berkata: Ini adalah obat yang dibawa oleh wanita-wanita yang datang dari arah negeri ini, dan beliau menunjuk ke arah Abyssinia. Pamannya berkata: Kami khawatir kamu menderita radang selaput dada. Beliau menjawab: Itu adalah penyakit yang tidak akan Allah timpakan padaku. Tidak seorang pun di rumah itu yang tidak diberi obat kecuali pamanku. Maka Maymuna diberi obat saat ia sedang berpuasa, sebagai hukuman atas apa yang telah mereka lakukan padanya."
