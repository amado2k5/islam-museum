id: event/lidud-of-the-prophet
class: event
kind: other
label: { ar: "لدُّ النبي في مرضه", en: "The dosing of the Prophet during his illness" }
summary:
  ar: "في مرض النبي اجتمع نساء من أزواجه ونساء من المسلمين، منهن أسماء بنت عميس، وعنده العباس، فأجمعوا أن يلدّوه؛ فقال العباس: لألدّنّه؛ فلدّوه، فلما أفاق قال: من صنع هذا بي؟ قالوا: عمك؛ قال: هذا دواء أتى به نساء جئن من نحو هذه الأرض، وأشار نحو الحبشة، فقال عمه: خشينا أن يكون بك ذات الجنب؛ فقال: إن ذلك لداء ما كان الله ليقذفني به، ولا يبقى في البيت أحد إلا لُدّ إلا عمي، فلُدّت ميمونة وهي صائمة، عقوبة لهم بما صنعوا به."
  en: "During the Prophet's illness, a group of his wives and some Muslim women, among them Asma' bint Umays, gathered with al-Abbas present and agreed to dose him; al-Abbas said 'I will dose him'; they did; when he came round he asked who had done it, was told it was his uncle, and said this was a medicine brought by women from the direction of Abyssinia; his uncle said they feared pleurisy; he said that was a disease God would not bring on him, and that everyone in the house should be dosed except his uncle, so Maymuna, who was fasting, was dosed as a punishment for what they had done."
