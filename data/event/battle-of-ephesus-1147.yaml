  tr: "1147 yılında gerçekleşen Efes Savaşı'nın, yani İkinci Haçlı Seferi'nin Rum Selçukluları tarafından yenilgiye uğratılmasının ön raporu; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Efesus pada tahun 1147 M, kekalahan Perang Salib Kedua oleh Seljuk dari Rum; sumber-sumber di halaman ini belum ditinjau."
