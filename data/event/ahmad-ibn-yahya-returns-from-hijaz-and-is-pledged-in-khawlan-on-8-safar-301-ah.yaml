id: "event/ahmad-ibn-yahya-returns-from-hijaz-and-is-pledged-in-khawlan-on-8-safar-301-ah"
class: event
kind: other
label:
  ar: "يقدم أحمد بن يحيى من الحجاز وتبايعه خولان في صفر سنة 301هـ، ص400"
  en: "Ahmad ibn Yahya returns from the Hijaz and is pledged by Khawlan in Safar 301 AH, p. 400"
  fr: "Ahmad ibn Yahya revient du Hedjaz et reçoit l’allégeance de Khawlan en safar 301 de l’hégire, p. 400"
  ur: "احمد بن یحییٰ حجاز سے آتے ہیں اور صفر 301ھ میں خولان ان کی بیعت کرتا ہے، ص400"
  es: "Ahmad ibn Yahya regresa del Hiyaz y es prometido por Khawlan en Safar 301 AH, pág. 400."
  tr: "Ahmed ibn Yahya Hicaz'dan gelmiş ve Havlan, Hicri 301 yılının Safer ayında ona biat etmiştir (s. 400)."
  id: "Ahmad ibn Yahya berasal dari Hijaz dan Khawlan menyatakan baiat kepadanya pada bulan Safar tahun 301 H, hlm. 400."
summary:
  ar: "يقدم أحمد بن يحيى من الحجاز في آخر ذي الحجة سنة 300هـ، ثم تجتمع وجوه خولان يوم الأحد لثمان ليال خلت من صفر سنة 301هـ، وتطلب منه القيام بأمرهم، فيجيب، وتبايعه همدان وأهل نجران."
  en: "Ahmad ibn Yahya returns from the Hijaz at the end of Dhu al-Hijja 300 AH. On Sunday, eight nights into Safar 301 AH, the notables of Khawlan gather around him, seek his help against his brother and ask him to take the command as their fathers did. He agrees, and men of Hamdan and Najran pledge allegiance to him."
  fr: "Ahmad ibn Yahya revient du Hedjaz à la fin de dhu al-hijja 300 de l’hégire. Le dimanche huit safar 301, les notables de Khawlan se rassemblent autour de lui, lui demandent son aide contre son frère et lui demandent de prendre le commandement comme l’avait fait son père. Il accepte, et des hommes de Hamdan et de Najran lui prêtent allégeance."
  ur: "احمد بن یحییٰ ذوالحجہ 300ھ کے آخر میں حجاز سے آتے ہیں۔ صفر 301ھ کی آٹھ راتیں گزرنے پر اتوار کے دن خولان کے سردار ان کے گرد جمع ہو کر اپنے بھائی کے مقابلے میں ان سے مدد مانگتے ہیں اور امر سنبھالنے کی درخواست کرتے ہیں۔ وہ مان جاتے ہیں اور ہمدان و نجران کے لوگ بیعت کرتے ہیں۔"
  es: "Ahmad ibn Yahya regresa del Hiyaz al final de Dhu al-Hijja del año 300 AH. El domingo, ocho noches después del inicio de Safar del año 301 AH, los notables de Khawlan se reúnen a su alrededor, le piden ayuda contra su hermano y le solicitan que asuma el mando, tal como lo hicieron sus padres. Él acepta, y los hombres de Hamdan y Najran le juran lealtad."
  tr: "Ahmed bin Yahya, Hicri 300 yılının Zilhicce ayının sonunda Hicaz'dan geldi. Ardından, Hicri 301 yılının Safer ayının bitimine sekiz gece kala, Pazar günü, Halilan'ın ileri gelenleri bir araya gelerek ondan işlerinin başına geçmesini istediler. O da kabul etti ve Hamdan ile Necran halkı ona biat ettiler."
  id: "Ahmed bin Yahya tiba dari Hijaz pada akhir bulan Dzul Hijjah tahun 300 Hijriah. Kemudian para tokoh terkemuka Khawlan berkumpul pada hari Minggu, delapan malam sebelum berakhirnya bulan Safar tahun 301 Hijriah, dan memintanya untuk mengurus urusan mereka. Beliau memenuhi permintaan tersebut, dan Hamdan serta penduduk Najran berbaiat kepadanya."
