id: "event/ahmad-ibn-yahya-returns-from-hijaz-and-is-pledged-in-khawlan-on-8-safar-301-ah"
class: event
kind: other
label:
  ar: "يقدم أحمد بن يحيى من الحجاز وتبايعه خولان في صفر سنة 301هـ، ص400"
  en: "Ahmad ibn Yahya returns from the Hijaz and is pledged by Khawlan in Safar 301 AH, p. 400"
  ur: "احمد بن یحییٰ حجاز سے آتے ہیں اور صفر 301ھ میں خولان ان کی بیعت کرتا ہے، ص400"
summary:
  ar: "يقدم أحمد بن يحيى من الحجاز في آخر ذي الحجة سنة 300هـ، ثم تجتمع وجوه خولان يوم الأحد لثمان ليال خلت من صفر سنة 301هـ، وتطلب منه القيام بأمرهم، فيجيب، وتبايعه همدان وأهل نجران."
  en: "Ahmad ibn Yahya returns from the Hijaz at the end of Dhu al-Hijja 300 AH. On Sunday, eight nights into Safar 301 AH, the notables of Khawlan gather around him, seek his help against his brother and ask him to take the command as their fathers did. He agrees, and men of Hamdan and Najran pledge allegiance to him."
  ur: "احمد بن یحییٰ ذوالحجہ 300ھ کے آخر میں حجاز سے آتے ہیں۔ صفر 301ھ کی آٹھ راتیں گزرنے پر اتوار کے دن خولان کے سردار ان کے گرد جمع ہو کر اپنے بھائی کے مقابلے میں ان سے مدد مانگتے ہیں اور امر سنبھالنے کی درخواست کرتے ہیں۔ وہ مان جاتے ہیں اور ہمدان و نجران کے لوگ بیعت کرتے ہیں۔"
