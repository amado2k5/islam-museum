label: { en: "Umar's last pilgrimage and Ali left as deputy in Medina", ar: "آخر حج لعمر واستخلاف علي على المدينة", es: "La última peregrinación de Umar y Ali partieron como lugarteniente en Medina.", fr: "Le dernier pèlerinage d'Umar et le départ d'Ali en tant que député à Médine" }
summary:
  en: "The last pilgrimage Umar led in 23 AH, taking the Prophet's wives with their guardians who did not cover from him; Ali ibn Abi Talib was left as deputy over Medina. The book also records Umar appointing Ali as his deputy in Medina during the campaign of Ajnadayn and Jabiya."
  ar: "آخر حجة حجها عمر بالناس سنة 23هـ، ومعه أمهات المؤمنين وأولياؤهن ممن لا يحتجبن منه، واستخلف علي بن أبي طالب على المدينة. ويذكر الكتاب أيضاً استخلاف عمر لعلي على المدينة حين نزل بالجابية بعد أجنادين."
  es: "La última peregrinación que dirigió Umar tuvo lugar en el año 23 de la Hégira, llevando consigo a las esposas del Profeta y a sus tutores, quienes no se protegieron de él; Ali ibn Abi Talib quedó como su lugarteniente en Medina. El libro también registra que Umar nombró a Ali como su lugarteniente en Medina durante la campaña de Ajnadayn y Jabiya."
  fr: "Le dernier pèlerinage qu'Umar dirigea eut lieu en 23 AH. Il emmena les épouses du Prophète accompagnées de leurs tuteurs, qui ne se cachèrent pas de lui. Ali ibn Abi Talib fut nommé vice-roi de Médine. Le livre rapporte également qu'Umar nomma Ali vice-roi à Médine durant la campagne d'Ajnadayn et de Jabiya."
