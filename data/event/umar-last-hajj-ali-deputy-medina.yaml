summary:
  en: "The last pilgrimage Umar led in 23 AH, taking the Prophet's wives with their guardians who did not cover from him; Ali ibn Abi Talib was left as deputy over Medina. The book also records Umar appointing Ali as his deputy in Medina during the campaign of Ajnadayn and Jabiya."
  ar: "آخر حجة حجها عمر بالناس سنة 23هـ، ومعه أمهات المؤمنين وأولياؤهن ممن لا يحتجبن منه، واستخلف علي بن أبي طالب على المدينة. ويذكر الكتاب أيضاً استخلاف عمر لعلي على المدينة حين نزل بالجابية بعد أجنادين."
