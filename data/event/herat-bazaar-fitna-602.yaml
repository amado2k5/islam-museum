summary:
  ar: "في المحرم سنة اثنتين وستمائة ثارت العامة بهراة وجرت فتنة عظيمة بين أهل السوقين — الحدادين والصفارين — قتل فيها جماعة ونهبت الأموال وخربت الديار، فخرج أمير البلد ليكفهم فضربه بعض العامة بحجر ناله منه ألم شديد واجتمع الغوغاء عليه فرفع إلى القصر الفيروزي واختفى أياماً إلى أن سكنت الفتنة ثم ظهر {cite:kamil-ibn-al-athir p. 300}."
  en: "Muharram 602: Herat's mob rose in a great fitna between the two market quarters — the blacksmiths and the coppersmiths — with killings, looting and ruined houses; the city's amir was struck by a stone, mobbed, and hidden in the Firuzi palace for days until the fitna subsided {cite:kamil-ibn-al-athir p. 300}."
