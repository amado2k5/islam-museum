label: { ar: "فتنة أهل السوقين بهراة", en: "The bazaar-quarters' fitna at Herat (602 AH)", es: "La fitna del barrio del bazar en Herat (602 AH)", fr: "La fitna du quartier du bazar à Hérat (602 AH)", ur: "ہرات میں بازار کا فتنہ ⁦(602ھ)⁩" }
summary:
  ar: "في المحرم سنة اثنتين وستمائة ثارت العامة بهراة وجرت فتنة عظيمة بين أهل السوقين — الحدادين والصفارين — قتل فيها جماعة ونهبت الأموال وخربت الديار، فخرج أمير البلد ليكفهم فضربه بعض العامة بحجر ناله منه ألم شديد واجتمع الغوغاء عليه فرفع إلى القصر الفيروزي واختفى أياماً إلى أن سكنت الفتنة ثم ظهر {cite:kamil-ibn-al-athir p. 300}."
  en: "Muharram 602: Herat's mob rose in a great fitna between the two market quarters — the blacksmiths and the coppersmiths — with killings, looting and ruined houses; the city's amir was struck by a stone, mobbed, and hidden in the Firuzi palace for days until the fitna subsided {cite:kamil-ibn-al-athir p. 300}."
  es: "Muharram 602: La turba de Herat se alzó en una gran fitna entre los dos barrios del mercado —los herreros y los caldereros— con asesinatos, saqueos y casas arruinadas; el emir de la ciudad fue golpeado por una piedra, linchado y escondido en el palacio Firuzi durante días hasta que la fitna amainó {cite:kamil-ibn-al-athir p. 300}."
  fr: "Muharram 602: La foule d'Hérat se souleva dans une grande fitna entre les deux quartiers du marché — les forgerons et les chaudronniers — avec des meurtres, des pillages et des maisons ruinées; l'émir de la ville fut frappé par une pierre, pris à partie par la foule et caché dans le palais Firuzi pendant des jours jusqu'à ce que la fitna se calme {cite:kamil-ibn-al-athir p. 300}."
  ur: "محرم 602: ہرات کا ہجوم قتل و غارت، لوٹ مار اور تباہ شدہ مکانات کے ساتھ دو بازاروں کے درمیان ایک زبردست فتنے میں کھڑا ہوا۔ شہر کے امیر کو پتھر سے مارا گیا، ہجوم نے مارا، اور فیروزی محل میں کئی دنوں تک چھپا دیا گیا یہاں تک کہ فتنہ ختم ہو گیا۔ 300}۔"
