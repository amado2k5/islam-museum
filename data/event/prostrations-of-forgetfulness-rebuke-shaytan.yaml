id: event/prostrations-of-forgetfulness-rebuke-shaytan
kind: other
label:
  ar: سجدتا النسيان ترغيم للشيطان
  en: The two prostrations of forgetfulness rebuke the shaytan
  ur: بھول کے دو سجدے شیطان کو ڈانٹ
summary:
  ar: من شك في صلاته فلم يدر كم صلى صلى ركعة ثم سجد سجدتين وهو جالس قبل التسليم؛ فإن كانت الركعة خامسة شفعها بالسجدتين، وإن كانت رابعة فالسجدتان ترغيم للشيطان {cite:muwatta-maruf-1997} [[passage/muwatta-1-252|الموطأ 252]].
  en: Whoever doubts his prayer and does not know how many he prayed prays one rak a then prostrates twice sitting before the salam; if the rak a was the fifth the two prostrations complete it, and if it was the fourth the two prostrations are a rebuke to the shaytan {cite:muwatta-maruf-1997} [[passage/muwatta-1-252|Muwatta 252]].
  ur: جو شخص نماز میں شبہ کرے اور نہ جانے کتنی پڑھی اس نے ایک رکعت پھر دو سجدے بیٹھ کر سلام سے پہلے کرے؛ اگر وہ رکعت پانچویں تھی تو دو سجدے اسے مکمل کرتے ہیں، اور اگر چوتھی تھی تو دو سجدے شیطان کو ڈانٹ ہیں {cite:muwatta-maruf-1997} [[passage/muwatta-1-252|موطأ 252]]۔
