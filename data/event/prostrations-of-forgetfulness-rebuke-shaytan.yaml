id: event/prostrations-of-forgetfulness-rebuke-shaytan
kind: other
label:
  ar: سجدتا النسيان ترغيم للشيطان
  en: The two prostrations of forgetfulness rebuke the shaytan
  ur: بھول کے دو سجدے شیطان کو ڈانٹ
  es: "Las dos postraciones del olvido reprenden al shaytán."
  fr: "Les deux prosternations de l'oubli réprimandent le shaytan"
  tr: "Unutkanlığın iki secde hali, şeytan için bir aşağılanmadır."
  id: "Dua sujud karena lupa adalah penghinaan terhadap Setan."
summary:
  ar: من شك في صلاته فلم يدر كم صلى صلى ركعة ثم سجد سجدتين وهو جالس قبل التسليم؛ فإن كانت الركعة خامسة شفعها بالسجدتين، وإن كانت رابعة فالسجدتان ترغيم للشيطان {cite:muwatta-maruf-1997} [[passage/muwatta-1-252|الموطأ 252]].
  en: Whoever doubts his prayer and does not know how many he prayed prays one rak a then prostrates twice sitting before the salam; if the rak a was the fifth the two prostrations complete it, and if it was the fourth the two prostrations are a rebuke to the shaytan {cite:muwatta-maruf-1997} [[passage/muwatta-1-252|Muwatta 252]].
  ur: جو شخص نماز میں شبہ کرے اور نہ جانے کتنی پڑھی اس نے ایک رکعت پھر دو سجدے بیٹھ کر سلام سے پہلے کرے؛ اگر وہ رکعت پانچویں تھی تو دو سجدے اسے مکمل کرتے ہیں، اور اگر چوتھی تھی تو دو سجدے شیطان کو ڈانٹ ہیں {cite:muwatta-maruf-1997} [[passage/muwatta-1-252|موطأ 252]]۔
  es: "Quien duda de su oración y no sabe cuántas rezó, reza un rak a y luego se postra dos veces sentado ante el salam; si el rak a fue el quinto, las dos postraciones lo completan, y si fue el cuarto, las dos postraciones son una reprensión al shaytan {cite:muwatta-maruf-1997} [[passage/muwatta-1-252|Muwatta 252]]."
  fr: "Quiconque doute de sa prière et ne sait pas combien il a prié prie un rak'a puis se prosterne deux fois assis devant le salam; si le rak'a était le cinquième, les deux prosternations le complètent, et si c'était le quatrième, les deux prosternations sont une réprimande au shaytan {cite:muwatta-maruf-1997} [[passage/muwatta-1-252|Muwatta 252]]."
  tr: "Kimse namazından şüphe eder ve kaç rekat kıldığını bilmiyorsa, bir rekat kılıp sonra selam vermeden önce oturarak iki secde yapmalıdır. Eğer rekat beşinci ise, iki secdeyle birlikte rekat sayısını tamamlamalıdır; eğer dördüncü ise, iki secde şeytanı kızdırmak içindir. {cite:muwatta-maruf-1997} [[passage/muwatta-1-252|الموطأ 252]]."
  id: "Jika seseorang ragu dengan salatnya dan tidak tahu berapa rakaat yang telah dikerjakannya, maka ia harus mengerjakan satu rakaat salat dan kemudian melakukan dua sujud sambil duduk di depan taslim. Jika rakaat tersebut adalah rakaat kelima, maka ia harus menyamakannya dengan dua sujud, dan jika itu adalah rakaat keempat, maka dua sujud tersebut dilakukan untuk menentang setan. {cite:muwatta-maruf-1997} [[passage/muwatta-1-252|الموطأ 252]]."
