  en: "Birth of Ibn Habib al-Halabi at Damascus, Sha'ban 710/early 1311"
  ur: "ابن حبیب حلبی کی پیدائش، دمشق، شعبان 710ھ/آغاز 1311ء"
summary:
  ar: "ولد الحسن بن عمر بن الحسن بن حبيب، بدر الدين الحلبي، بدمشق في شعبان سنة ٧١٠هـ {cite:durar-kamina-jil-1993 2/29} {cite:al-aalam 2/218-219}؛ ونُصب أبوه محتسباً بحلب فانتقل معه فنشأ فيها ونُسب إليها {cite:al-aalam 2/218-219}."
  en: "Al-Hasan ibn 'Umar ibn al-Hasan ibn Habib, Badr al-Din al-Halabi, was born at Damascus in Sha'ban 710 {cite:durar-kamina-jil-1993 2/29} {cite:al-aalam 2/218-219}; his father was appointed muhtasib of Aleppo, and the boy moved with him, grew up there and took his nisba from the city {cite:al-aalam 2/218-219}."
  ur: "حسن بن عمر بن الحسن بن حبیب، بدر الدین حلبی، شعبان 710ھ میں دمشق میں پیدا ہوا {cite:durar-kamina-jil-1993 2/29} {cite:al-aalam 2/218-219}؛ باپ حلب کا محتسب مقرر ہوا تو بچہ ساتھ گیا، وہیں پلا بڑھا اور شہر ہی سے نسبت پائی {cite:al-aalam 2/218-219}."
