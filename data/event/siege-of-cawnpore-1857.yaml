summary:
  ar: "بطاقة أولية لحصار كانبور سنة ١٨٥٧م، محاصرة نانا صاحب للحامية البريطانية ومذبحة ستيبويل في الثورة الهندية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Siege of Cawnpore in 1857, Nana Sahib's investment of the British garrison and the massacre of the rising; its sources are not yet checked on the page."
  es: "Borrador del asedio de Cawnpore en 1857, el asalto de Nana Sahib a la guarnición británica y la masacre de los sublevados; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de convocation pour le siège de Cawnpore en 1857, l'investissement de la garnison britannique par Nana Sahib et le massacre du soulèvement; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1857 میں کاون پور کے محاصرے کے لیے ڈرافٹ کارڈ، نانا صاحب کی انگریز گیریژن کی سرمایہ کاری اور بڑھتے ہوئے قتل عام؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1857 yılında gerçekleşen Kanpur Kuşatması'nın ön taslağı, Nana Sahib'in İngiliz garnizonunu kuşatması ve Hindistan İsyanı sırasında yaşanan Stepwell Katliamı; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Gambaran umum Pengepungan Kanpur tahun 1857 M, pengepungan garnisun Inggris oleh Nana Sahib, dan Pembantaian Stepwell dalam Pemberontakan India; sumber-sumber di halaman ini belum ditinjau."
