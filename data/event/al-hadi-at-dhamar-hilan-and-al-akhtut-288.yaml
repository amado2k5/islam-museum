id: event/al-hadi-at-dhamar-hilan-and-al-akhtut-288
class: event
label:
  ar: "الهادي بذمار وأهل حيلان والأخطوط، ربيع الأول 288هـ"
  en: "Al-Hadi at Dhamar, the people of Hilan and al-Akhtut, Rabi I 288 AH"
  ur: "ہادی ذمار، اہل حیلان اور الاخطوط میں، ربیع الاول 288ھ"
  es: "Al-Hadi en Dhamar, la gente de Hilan y al-Akhtut, Rabi I 288 AH"
  fr: "Al-Hadi à Dhamar, les habitants de Hilan et d'al-Akhtut, Rabi I 288 AH"
  tr: "Dhamar'daki El-Hadi ve Haylan ve El-Ahtout halkı, Rabi' al-Awwal 288 H."
  id: "Al-Hadi di Dhamar dan masyarakat Haylan dan Al-Akhtout, Rabi' al-Awwal 288 H"
summary:
  ar: "ينزل الهادي ذمار فيجمع أهل مخاليفها ويعظهم ويقيم أياماً حتى أصلح الله البلد بحسب الراوي، ويأتيه أهل حيلان فيوجه معهم محمداً البلخي من أصحابه، ثم يولي ذمار إبراهيم بن جعفر الفطيمي وينزل الأخطوط وكان فاسداً بإقامة إبراهيم بن خلف فيه، فيخرج منه كثيرون، ويقيم أياماً ثم يرحل إلى منكث."
  en: "Al-Hadi halts at Dhamar, gathers the people of its districts and preaches, and stays some days until, in the narrator's words, God set the town right; the people of Hilan come and he sends with them a companion, Muhammad al-Balkhi; he puts Ibrahim ibn Jafar al-Futayimi over Dhamar and goes to al-Akhtut, a place the narrator calls corrupt because Ibrahim ibn Khalaf had lived there, from which many leave on his arrival, and after some days goes on to Mankath."
  ur: "ہادی ذمار اترتے ہیں، اس کے اضلاع کے لوگوں کو جمع کر کے نصیحت کرتے ہیں اور راوی کے الفاظ میں اللہ کے شہر کو درست کرنے تک چند دن رہتے ہیں؛ اہل حیلان آتے ہیں تو ان کے ساتھ اپنے ساتھی محمد بلخی کو بھیجتے ہیں؛ پھر ابراہیم بن جعفر فطیمی کو ذمار کا والی بنا کر الاخطوط اترتے ہیں جسے راوی ابراہیم بن خلف کے وہاں رہنے کی وجہ سے فاسد کہتا ہے، ان کے آنے پر بہت سے لوگ وہاں سے نکل جاتے ہیں، اور چند دن رہ کر وہ منکث کی طرف روانہ ہوتے ہیں۔"
  es: "Al-Hadi se detiene en Dhamar, reúne a la gente de sus distritos y predica, y permanece allí algunos días hasta que, en palabras del narrador, Dios enderezó la ciudad; la gente de Hilan llega y él envía con ellos a un compañero, Muhammad al-Balkhi; pone a Ibrahim ibn Jafar al-Futayimi al frente de Dhamar y se dirige a al-Akhtut, un lugar que el narrador llama corrupto porque Ibrahim ibn Khalaf había vivido allí, de donde muchos se marchan a su llegada, y después de algunos días continúa su camino hacia Mankath."
  fr: "Al-Hadi s'arrête à Dhamar, rassemble les habitants de ses districts et prêche, et reste quelques jours jusqu'à ce que, selon les mots du narrateur, Dieu rétablisse la ville dans l'ordre; les habitants de Hilan arrivent et il envoie avec eux un compagnon, Muhammad al-Balkhi; il place Ibrahim ibn Jafar al-Futayimi à la tête de Dhamar et se rend à al-Akhtut, un lieu que le narrateur qualifie de corrompu parce qu'Ibrahim ibn Khalaf y avait vécu, d'où beaucoup partent à son arrivée, et après quelques jours, il poursuit sa route vers Mankath."
  tr: "Rivayet edene göre, El-Hadi, Damar'a iner, mahalle halkını toplar, onlara vaaz verir ve Allah şehri ıslah edene kadar günlerce orada kalır. Haylan halkı ona gelir ve o da yanlarında arkadaşlarından Muhammed el-Belkhi'yi gönderir. Sonra İbrahim bin Cafer el-Fatimi'yi Damar valisi olarak atar ve İbrahim bin Halef'in orada bulunmasıyla bozulmuş olan el-Akhtout'a iner. Birçok insan orayı terk eder ve o da günlerce orada kalır, sonra Mankath'a gider."
  id: "Al-Hadi turun ke Dhamar, mengumpulkan penduduk distrik-distriknya, berdakwah kepada mereka, dan tinggal selama beberapa hari hingga Allah memperbaiki kota itu, menurut perawi. Penduduk Haylan datang kepadanya, dan dia mengutus Muhammad al-Balkhi, salah seorang sahabatnya, bersama mereka. Kemudian dia mengangkat Ibrahim bin Jaafar al-Fatimi sebagai gubernur Dhamar dan turun ke al-Akhtout, yang telah rusak karena kehadiran Ibrahim bin Khalaf di sana. Banyak orang meninggalkannya, dan dia tinggal selama beberapa hari, kemudian pergi ke Mankath."
