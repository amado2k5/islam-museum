id: event/al-hadi-at-dhamar-hilan-and-al-akhtut-288
class: event
label:
  ar: "الهادي بذمار وأهل حيلان والأخطوط، ربيع الأول 288هـ"
  en: "Al-Hadi at Dhamar, the people of Hilan and al-Akhtut, Rabi I 288 AH"
  ur: "ہادی ذمار، اہل حیلان اور الاخطوط میں، ربیع الاول 288ھ"
summary:
  ar: "ينزل الهادي ذمار فيجمع أهل مخاليفها ويعظهم ويقيم أياماً حتى أصلح الله البلد بحسب الراوي، ويأتيه أهل حيلان فيوجه معهم محمداً البلخي من أصحابه، ثم يولي ذمار إبراهيم بن جعفر الفطيمي وينزل الأخطوط وكان فاسداً بإقامة إبراهيم بن خلف فيه، فيخرج منه كثيرون، ويقيم أياماً ثم يرحل إلى منكث."
  en: "Al-Hadi halts at Dhamar, gathers the people of its districts and preaches, and stays some days until, in the narrator's words, God set the town right; the people of Hilan come and he sends with them a companion, Muhammad al-Balkhi; he puts Ibrahim ibn Jafar al-Futayimi over Dhamar and goes to al-Akhtut, a place the narrator calls corrupt because Ibrahim ibn Khalaf had lived there, from which many leave on his arrival, and after some days goes on to Mankath."
  ur: "ہادی ذمار اترتے ہیں، اس کے اضلاع کے لوگوں کو جمع کر کے نصیحت کرتے ہیں اور راوی کے الفاظ میں اللہ کے شہر کو درست کرنے تک چند دن رہتے ہیں؛ اہل حیلان آتے ہیں تو ان کے ساتھ اپنے ساتھی محمد بلخی کو بھیجتے ہیں؛ پھر ابراہیم بن جعفر فطیمی کو ذمار کا والی بنا کر الاخطوط اترتے ہیں جسے راوی ابراہیم بن خلف کے وہاں رہنے کی وجہ سے فاسد کہتا ہے، ان کے آنے پر بہت سے لوگ وہاں سے نکل جاتے ہیں، اور چند دن رہ کر وہ منکث کی طرف روانہ ہوتے ہیں۔"
