label: { ar: "صلح حيان مع الأصبهبذ", en: "Hayyan's Treaty with the Ispahbadh", es: "Tratado de Hayyan con Ispahbadh", fr: "Traité de Hayyan avec les Ispahbadh", ur: "حیان کا اصفہ آباد کے ساتھ معاہدہ" }
summary:
  ar: "استعمل يزيد على دهستان والبياسان عبد الله بن معمر اليشكري في أربعة آلاف ووجه ابنه خالداً وأخاه أبا عيينة بن المهلب إلى الأصبهبذ فهزمهما حتى ألحقهما بعسكر يزيد وكتب الأصبهبذ إلى المرزبان إنا قد قتلنا أصحاب يزيد فاقتل من قبلك من العرب فقتل عبد الله بن معمر ومن معه وهم غارون فوجه يزيد حيان مولى مصقلة وهو من سبي الديلم فقال للأصبهبذ إني رجل منك وإليك وإن فرّق الدين بيننا ولا قوام لك مع جيوش خراسان وقد رأيت لك يزيد فوجدته سريعاً إلى الصلح فصالحه ولم يزل يخدعه حتى صالح يزيد على سبعمائة ألف درهم وأربعمائة قرن زعفراناً فقال الأصبهبذ العشرة وزن ستة فقال لا ولكن وزن سبعة فأبى فقال حيان أنا أتحمل فضل ما بين الوزنين فتحمله وكان حيان من نبل الموالي وسرواتهم ويكنى أبا معمر."
  en: "Yazid posted Abdallah ibn Ma'mar al-Yashkari over Dihistan and al-Biyasan with four thousand and sent his son Khalid and brother Abu Uyayna against the Ispahbadh, who routed them back to Yazid's camp and wrote the marzban to kill his Arabs — Abdallah and his men were slaughtered in their beds. Yazid sent Hayyan, Masmala's mawla of Daylami captivity, who told the Ispahbadh 'I am a man of yours to you, though religion parts us; you cannot stand Khurasan's armies, and I found Yazid quick to terms' — he worked him till Yazid treated for seven hundred thousand dirhams and four hundred qirats of saffron; the Ispahbadh demanded weight-six, Hayyan bore the difference — a noble and leading mawla, called Abu Ma'mar."
  es: "Yazid envió a Abdallah ibn Ma'mar al-Yashkari al frente de Dihistan y al-Biyasan con cuatro mil hombres y envió a su hijo Khalid y a su hermano Abu Uyayna contra los Ispahbadh, quienes los hicieron retroceder hasta el campamento de Yazid y escribieron al marzban para que matara a sus árabes; Abdallah y sus hombres fueron masacrados en sus camas. Yazid envió a Hayyan, el mawla de Masmala, prisionero de Daylami, quien le dijo a los Ispahbadh: \"Soy uno de los vuestros, aunque la religión nos separe; no podéis resistir a los ejércitos de Jorasán, y encontré a Yazid dispuesto a negociar\". Lo presionó hasta que Yazid pagó setecientos mil dirhams y cuatrocientos qirats de azafrán; los Ispahbadh exigieron seis libras, Hayyan pagó la diferencia; un mawla noble y destacado, llamado Abu Ma'mar."
  fr: "Yazid posta Abdallah ibn Ma'mar al-Yashkari à la tête de quatre mille hommes à Dihistan et al-Biyasan, et envoya son fils Khalid et son frère Abu Uyayna contre les Ispahbadh. Ces derniers les repoussèrent jusqu'au camp de Yazid et ordonnèrent au marzban de tuer ses Arabes. Abdallah et ses hommes furent massacrés dans leur sommeil. Yazid envoya ensuite Hayyan, le mawla de Masmala, captif à Daylami, qui déclara aux Ispahbadh: « Je suis un homme à vos yeux, malgré la religion qui nous sépare; vous ne pouvez résister aux armées du Khorasan, et j'ai constaté que Yazid était prompt à négocier. » Il le fit chanter jusqu'à ce que Yazid propose sept cent mille dirhams et quatre cents qirats de safran. Les Ispahbadh exigeaient six qirats, Hayyan paya la différence. Il s'agissait d'un mawla noble et influent, nommé Abu Ma'mar."
  ur: "یزید نے عبداللہ بن معمر یشکری کو چار ہزار کے ساتھ دہستان اور البیاسان پر تعینات کیا اور اس کے بیٹے خالد اور بھائی ابو عیینہ کو اسپہ آباد کے خلاف بھیجا، جنہوں نے انہیں یزید کے کیمپ میں واپس بھیج دیا اور اس کے عربوں کو قتل کرنے کے لیے مرزبان لکھا - عبداللہ اور اس کے آدمیوں کو ان کے بستروں میں ذبح کر دیا گیا۔ یزید نے دیلمی اسیر کے مسمالہ کے مولا حیان کو بھیجا، جس نے اسپہ باد سے کہا کہ میں تمہارا آدمی ہوں، حالانکہ مذہب ہمارا حصہ ہے۔ تم خراسان کی فوجوں کا مقابلہ نہیں کر سکتے، اور میں نے یزید کو جلد از جلد مل گیا\"- اس نے اس سے کام لیا یہاں تک کہ یزید نے سات لاکھ درہم اور چار سو قیراط زعفران کا علاج کیا۔ اصفہ باد نے وزن چھ کا مطالبہ کیا، حیان نے فرق اٹھایا - ایک بزرگ اور سرکردہ مولا، جسے ابو معمر کہتے ہیں۔"
