label: { ar: "حملة شارل الخامس على الجزائر ⁦(٩٤٨هـ/١٥٤١م)⁩", en: "Charles V's Algiers expedition (1541)", es: "La expedición de Carlos V a Argel (1541)", fr: "L'expédition de Charles Quint à Alger (1541)" }
summary:
  ar: "بعد هدنة نيس مع فرنسا سنة ٩٤٥هـ/١٥٣٨م أنزل شارل الخامس قواته أمام الجزائر في ٢٨ جمادى الآخرة ٩٤٨هـ/١٥ أكتوبر ١٥٤١م. تبادل هو وواليها حسن آغا الطوشي خطابين — التهديد وردّ «إذا جاء هذه البلاد العدو لا يعطى إلا الموت» — ثم هبت ريح عاصفة اقتلعت الخيام وارتطمت السفن بعضها ببعض فغرق كثير منها وقذفت الأمواج بعضها إلى الشاطئ فاستولى المدافعون على ذخائرها، وأفسد المطر البارود، وفشلت كل محاولات الهجوم فانسحب الإمبراطور بأسطوله إلى إيطاليا. شبه أهل الجزائر الهزيمة بهزيمة أصحاب الفيل في رسالة إلى السلطان سليمان، وفي رسالة ثانية طلبوا نجدات وإعادة خير الدين بكلربكاً عليهم، وكتب جان الثالث ملك البرتغال إلى شارل في ٢٢ رمضان ٩٤٨هـ يعلله الجلاء عن آسفي وأزمور بتزايد قوة السعديين بالعون العثماني {cite:dawlat-uthmaniyya-salabi p. 224-228}."
  en: "After the Truce of Nice (945/1538) Charles V landed before Algiers on 28 Jumada II 948/15 October 1541. Governor Hasan Agha al-Tushi answered his threat-letter — 'this land gives an invader only death' — then a storm tore up the siege camp, dashed the ships together and wrecked the powder; every assault failed and the emperor withdrew to Italy. Algiers' letter to Süleyman compared it to the rout of the People of the Elephant; a second letter asked for reinforcements and Khayr al-Din's restoration. João III's Ramadan 948 letter to Charles cited Ottoman-supplied Sa'di strength in evacuating Safi and Azemmour {cite:dawlat-uthmaniyya-salabi p. 224-228}."
  es: "Tras la Tregua de Niza (945/1538), Carlos V desembarcó ante Argel el 28 de Jumada II de 948/15 de octubre de 1541. El gobernador Hasan Agha al-Tushi respondió a su carta amenazante: «Esta tierra solo ofrece la muerte a un invasor». Acto seguido, una tormenta arrasó el campamento de asedio, destrozó los barcos y destruyó la pólvora; todos los asaltos fracasaron y el emperador se retiró a Italia. La carta de Argel a Solimán la comparó con la derrota del Pueblo del Elefante; una segunda carta solicitó refuerzos y la restauración de Khayr al-Din. La carta de Juan III a Carlos, fechada en Ramadán de 948, citaba la fuerza sa'dí, financiada por los otomanos, en la evacuación de Safi y Azemmour {cite:dawlat-uthmaniyya-salabi p. 224-228}."
  fr: "Après la trêve de Nice (945/1538), Charles Quint débarqua devant Alger le 28 Jumada II 948/15 octobre 1541. Le gouverneur Hasan Agha al-Tushi répondit à sa lettre de menace: « Cette terre n’offre que la mort à l’envahisseur ». Une tempête ravagea alors le camp de siège, brisa les navires les uns contre les autres et détruisit la poudre. Tous les assauts échouèrent et l’empereur se retira en Italie. Dans une lettre adressée à Soliman le Magnifique, Alger compara cet épisode à la déroute du Peuple de l’Éléphant. Une seconde lettre demanda des renforts et la restauration de Khayr al-Din. Dans une lettre de Ramadan 948 adressée à Charles Quint, Jean III mentionna le soutien des Ottomans aux forces saadiennes lors de l’évacuation de Safi et d’Azemmour (voir: Dawlat-Uthmaniyya-Salabi, p. 224-228)."
