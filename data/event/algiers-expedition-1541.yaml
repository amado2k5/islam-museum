label: { ar: "حملة شارل الخامس على الجزائر (٩٤٨هـ/١٥٤١م)", en: "Charles V's Algiers expedition (1541)" }
summary:
  ar: "بعد هدنة نيس مع فرنسا سنة ٩٤٥هـ/١٥٣٨م أنزل شارل الخامس قواته أمام الجزائر في ٢٨ جمادى الآخرة ٩٤٨هـ/١٥ أكتوبر ١٥٤١م. تبادل هو وواليها حسن آغا الطوشي خطابين — التهديد وردّ «إذا جاء هذه البلاد العدو لا يعطى إلا الموت» — ثم هبت ريح عاصفة اقتلعت الخيام وارتطمت السفن بعضها ببعض فغرق كثير منها وقذفت الأمواج بعضها إلى الشاطئ فاستولى المدافعون على ذخائرها، وأفسد المطر البارود، وفشلت كل محاولات الهجوم فانسحب الإمبراطور بأسطوله إلى إيطاليا. شبه أهل الجزائر الهزيمة بهزيمة أصحاب الفيل في رسالة إلى السلطان سليمان، وفي رسالة ثانية طلبوا نجدات وإعادة خير الدين بكلربكاً عليهم، وكتب جان الثالث ملك البرتغال إلى شارل في ٢٢ رمضان ٩٤٨هـ يعلله الجلاء عن آسفي وأزمور بتزايد قوة السعديين بالعون العثماني {cite:dawlat-uthmaniyya-salabi p. 224-228}."
  en: "After the Truce of Nice (945/1538) Charles V landed before Algiers on 28 Jumada II 948/15 October 1541. Governor Hasan Agha al-Tushi answered his threat-letter — 'this land gives an invader only death' — then a storm tore up the siege camp, dashed the ships together and wrecked the powder; every assault failed and the emperor withdrew to Italy. Algiers' letter to Süleyman compared it to the rout of the People of the Elephant; a second letter asked for reinforcements and Khayr al-Din's restoration. João III's Ramadan 948 letter to Charles cited Ottoman-supplied Sa'di strength in evacuating Safi and Azemmour {cite:dawlat-uthmaniyya-salabi p. 224-228}."
