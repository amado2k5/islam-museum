summary:
  ar: "عزله الخليفة أبو يوسف يعقوب عن مناصبه ونفاه إلى ليسانة سنة 1195م في موسم الجهاد، ثم رضي عنه بعد رجوعه إلى مراكش {cite:britannica-averroes}."
  en: "The caliph Abū Yūsuf dismissed Ibn Rushd from office and banished him to Lucena in 1195 during the jihad season; after the return to Marrakech he was recalled {cite:britannica-averroes}."
  ur: "خلیفہ ابو یوسف یعقوب نے جہاد کے موسم میں ابن رشد کو عہدوں سے ہٹا کر 1195ء میں لیسانہ جلاوطن کیا؛ مراکش واپسی پر اسے معاف کر کے بلالیا {cite:britannica-averroes}."
  es: "El califa Abū Yūsuf destituyó a Ibn Rushd de su cargo y lo desterró a Lucena en 1195 durante la temporada de la yihad; después de su regreso a Marrakech fue llamado de nuevo {cite:britannica-averroes}."
  fr: "Le calife Abū Yūsuf a démis Ibn Rushd de ses fonctions et l'a exilé à Lucena en 1195 pendant la saison du jihad; après son retour à Marrakech, il a été rappelé {cite:britannica-averroes}."
  tr: "Halife Ebu Yusuf Yakub, 1195 yılında cihat döneminde onu görevlerinden azletti ve Lisana'ya sürgün etti; daha sonra Marakeş'e döndüğünde ondan memnun kaldı."
  id: "Khalifah Abu Yusuf Yaqub memecatnya dari jabatannya dan mengasingkannya ke Lysana pada tahun 1195 M selama masa jihad, kemudian beliau merasa senang dengannya setelah ia kembali ke Marrakesh."
