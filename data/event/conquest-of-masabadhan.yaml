summary:
  ar: "في سنة ست عشرة كان فتح ماسبذان، وذكر الطبري أخبارها برواية سيف ومن معه {cite:tabari-tarikh-abu-al-fadl j.4 p.37}."
  en: "In the year 16 came the conquest of Masabadhan; Tabari gives its accounts on the authority of Sayf and those with him {cite:tabari-tarikh-abu-al-fadl j.4 p.37}."
  es: "En el año 16 se produjo la conquista de Masabadhan; Tabari da cuenta de ello basándose en la autoridad de Sayf y los que estaban con él {cite:tabari-tarikh-abu-al-fadl j.4 p.37}."
  fr: "En l'an 16 eut lieu la conquête de Masabadhan; Tabari en donne les récits d'après Sayf et ceux qui étaient avec lui {cite:tabari-tarikh-abu-al-fadl j.4 p.37}."
  ur: "16 میں مسابدھن کی فتح ہوئی۔ طبری نے سیف اور ان کے ساتھیوں کے حوالے سے اس کا احوال بیان کیا ہے {حوالہ: طبری تاریخ ابو الفضل ج4 ص37}۔"
  tr: "On altıncı yılda Masabzan fethedildi ve Taberi, bu haberi Sayf ve yanındakilerin rivayetiyle aktardı {cite:tabari-tarikh-abu-al-fadl j.4 p.37}."
  id: "Pada tahun keenam belas, Masabzan ditaklukkan, dan Al-Tabari menyebutkan beritanya melalui riwayat Sayf dan orang-orang yang bersamanya {cite:tabari-tarikh-abu-al-fadl j.4 p.37}."
