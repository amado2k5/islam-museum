id: event/al-hadi-orders-wadaa-home-and-narrator-blames-ibn-bistam-295
class: event
kind: other
label:
  ar: "الهادي يأمر وادعة بالانصراف، والكتاب يعزو الفتنة إلى ابن بسطام، سنة 295هـ، ص356"
  en: "Al-Hadi orders the Wada'a home, and the narrator attributes the strife to Ibn Bistam, 295 AH, p. 356"
  ur: "ہادی کا وادعہ کو واپس جانے کا حکم، اور کتاب کا فتنے کو ابن بسطام سے منسوب کرنا، 295ھ، ص356"
  es: "Al-Hadi ordena a los Wada'a que regresen a casa, y el narrador atribuye la contienda a Ibn Bistam, 295 AH, pág. 356."
  fr: "Al-Hadi ordonne aux Wada'a de rentrer chez eux, et le narrateur attribue la querelle à Ibn Bistam, 295 AH, p. 356"
  tr: "El-Hadi, Wad'ah'a oradan ayrılmasını emreder ve kitap, bu fitneyi İbn Bistam'a atfeder (Hicri 295, s. 356)."
  id: "Al-Hadi memerintahkan Wad'ah untuk pergi, dan buku tersebut menyebutkan Ibnu Bistam sebagai orang yang melakukan fitnah tersebut, tahun 295 H, hlm. 356."
summary:
  ar: "أخبر الأحلاف الهادي بما كان من وادعة، وأن يأماً خرجت للانتقام، فأرسل الهادي إلى وادعة الذين معه أن ينصرفوا إلى مواضعهم. ويرى الكتاب أن ذلك كان من عمل ابن بسطام، الذي بذل لوادعة مالاً جزيلاً ليثير فتنة همدان ويشغل الهادي عن حرب بني الحارث."
  en: "Men of Ahlaf told al-Hadi what Wada'a had done and that Yam had set out for revenge. Al-Hadi sent to the Wada'a who were with him, told them what had happened, and ordered them to return to their places. The narrator states that the affair was a move by Ibn Bistam, who paid Wada'a large sums to stir up strife among the Hamdan and keep al-Hadi busy away from the war with Banu al-Harith."
  ur: "احلاف کے لوگوں نے ہادی کو وادعہ کے کام کی خبر دی اور بتایا کہ یأم انتقام کے لیے نکل پڑے ہیں۔ ہادی نے ساتھ موجود وادعہ کے لوگوں کو بلا کر خبر دی اور انہیں اپنے ٹھکانوں کو لوٹنے کا حکم دیا۔ کتاب کے راوی کے مطابق یہ ابن بسطام کی چال تھی، جس نے وادعہ کو بھاری مال دیا تاکہ ہمدان میں فتنہ اٹھے اور ہادی بنو حارث کی جنگ سے ہٹ جائیں۔"
  es: "Los hombres de Ahlaf informaron a al-Hadi sobre las acciones de Wada'a y la partida de Yam en busca de venganza. Al-Hadi envió mensajeros a los Wada'a que lo acompañaban, les contó lo sucedido y les ordenó regresar a sus puestos. El narrador afirma que todo fue una maniobra de Ibn Bistam, quien pagó grandes sumas a Wada'a para sembrar la discordia entre los Hamdan y mantener a al-Hadi ocupado, lejos de la guerra contra Banu al-Harith."
  fr: "Les hommes d'Ahlaf rapportèrent à al-Hadi les agissements de Wada'a et le fait que Yam était parti se venger. Al-Hadi envoya des messagers aux Wada'a qui se trouvaient avec lui, les informa des événements et leur ordonna de regagner leurs positions. Le narrateur affirme que cette affaire était une manœuvre d'Ibn Bistam, qui versa d'importantes sommes d'argent à Wada'a afin de semer la discorde parmi les Hamdan et de détourner al-Hadi de la guerre contre les Banu al-Harith."
  tr: "Müttefikler, Wad'ah ile yaşananları ve Ya'am'ın intikam almak için yola çıktığını el-Hadi'ye bildirdiler. Bunun üzerine el-Hadi, Wad'ah ve adamlarına mevzilerine geri dönmeleri için haber gönderdi. Kitap, bunun İbn Bistam'ın işi olduğunu, İbn Bistam'ın Hamdan kabilesi arasında isyan çıkarmak ve el-Hadi'nin dikkatini Beni el-Harith'e karşı savaştan uzaklaştırmak için Wad'ah'a büyük miktarda para ödediğini öne sürüyor."
  id: "Para sekutu memberitahu al-Hadi tentang apa yang telah terjadi dengan Wad'ah, dan bahwa Ya'am telah pergi untuk membalas dendam. Al-Hadi kemudian mengirim pesan kepada Wad'ah dan anak buahnya untuk kembali ke posisi mereka. Buku ini menunjukkan bahwa ini adalah pekerjaan Ibnu Bistam, yang telah membayar Wad'ah sejumlah besar uang untuk menghasut pemberontakan di antara suku Hamdan dan mengalihkan perhatian al-Hadi dari perang melawan Bani Harit."
