id: event/khalid-march-to-syria
class: event
kind: campaign
label: { ar: "مسير خالد بن الوليد إلى الشام", en: "Khalid ibn al-Walid's March to Syria", es: "La marcha de Khalid ibn al-Walid a Siria", fr: "La marche de Khalid ibn al-Walid vers la Syrie", ur: "خالد بن ولید کا شام کی طرف مارچ", tr: "Halid ibn el-Valid'in Suriye'ye yürüyüşü", id: "Perjalanan Khalid ibn al-Walid ke Suriah" }
summary:
  ar: "عند البلاذري: لما أتاه كتاب أبي بكر وهو بالحيرة خلّف المثنى بن حارثة الشيباني على ناحية الكوفة وسار في شهر ربيع الآخر سنة 13 في ثمانمائة ويقال في خمسمائة، فأتى عين التمر ففتحها عنوة ⁦(وقيل وافاه الكتاب وهو بها وقد فتحها)⁩، ثم سار إلى صندوداء بها قوم من كندة وإياد والعجم فقاتله أهلها فظفر وخلّف بها سعد بن عمرو بن حرام الأنصاري، وبلغه أن جمعاً لبني تغلب بالمضيح والمصيد مرتدين عليهم ربيعة بن بجير فأتاهم فهزمهم وسبى وغنم وبعث بالسبي إلى أبي بكر وكانت منهم أم حبيب الصهباء بنت حبيب بن بجير أم عمر بن علي بن أبي طالب؛ ثم أغار على قراقر وهو ماء لكلب ثم فوز منه إلى سوى ماء لكلب أيضاً معهم فيه قوم من بهراء فقتل حرقوص بن النعمان البهراني من قضاعة واكتسح أموالهم، وكان لما ركب المفازة عمد إلى الرواحل فأرواها من الماء ثم قطع مشافرها وأجرها لئلا تجتر فتعطش واستكثر من الماء فنفد في طريقه فجعل ينحر الرواحل راحلة راحلة ويشرب وأصحابه الماء من أكراشها، ودليله رافع بن عميرة الطائي الذي مدحه الشاعر «لله در رافع أنّى اهتدى فوز من قراقر إلى سوى»؛ ثم خرج من سوى إلى الكوائل فأتى قرقيسيا فتركه صاحبها وانحاز إلى البر، وأتى أرك فحاصر أهلها ففتحها صلحاً على شيء أخذه منهم للمسلمين، وأتى دومة الجندل ففتحها، وأتى قصم فصالحه بنو مشجعة بن التيم من قضاعة وكتب لهم أماناً، وأتى تدمر فامتنع أهلها وتحصنوا ثم طلبوا الأمان فأمنهم على أن يكونوا ذمة وأن قروا المسلمين ورضخوا لهم، وأتى القريتين فقاتله أهلها فظفر وغنم، وأتى حوارين من سنير فقاتله أهلها مع مدد بعلبك وبصرى فظفر فسبى وقتل، وأتى مرج راهط فأغار على غسان في يوم فصحهم فسبى وقتل، ووجّه بشر بن أبي أرطاة العامري وحبيب بن مسلمة الفهري إلى غوطة دمشق فأغارا على قرى من قراها، ووقف على الثنية المعروفة بثنية العقاب بدمشق ناشراً رايته وهي راية كانت للنبي سوداء فسُميت ثنية العقاب يومئذ، ونزل بالباب الشرقي من دمشق ويقال بباب الجابية فأخرج إليه أسقف دمشق نزلاً وخدمة فوعده بحفظ عهده، ثم سار حتى انتهى إلى المسلمين وهم بقناة بصرى."
  en: "In al-Baladhuri: when Abu Bakr's letter reached him at al-Hira he left al-Muthanna ibn Haritha al-Shaybani over the Kufa side and marched in Rabi' al-Akhir of year 13 with eight hundred — some say five hundred — taking Ayn al-Tamr by force (others say the letter reached him there after its conquest), then Sandawda', held by Kinda, Iyad and Persians, whose people fought and were overcome — he left Sa'd ibn Amr ibn Haram al-Ansari over it, whose descendants dwell there today; hearing of an apostate gathering of Banu Taghlib at al-Mudayyih and al-Musayyid under Rabi'a ibn Bujayr he defeated them, took captives and spoil and sent them to Abu Bakr — among them Umm Habib al-Sahba' bint Habib ibn Bujayr, mother of Umar ibn Ali ibn Abi Talib; he raided Qaraqir, a Kalbi watering-place, then traversed the desert to Suwa, likewise Kalbi, where Bahra' were with them, killing Hurqus ibn al-Nu'man al-Bahrani of Quda'a and sweeping up their wealth; entering the waterless stretch he watered the camels, slit their lips and made them drool so they would not ruminate and thirst, carrying abundant water which ran out on the way — so he slaughtered the camels one by one, drinking with his men the water of their bellies, his guide Rafi' ibn Umayra al-Ta'i earning the poet's verse 'God bless Rafi' — how he guided, traversing from Qaraqir to Suwa'; from Suwa to al-Kawa'il, then Qarqisiya whose lord abandoned it for Byzantine lands, then Arak whose people he besieged until it fell by treaty for a payment to the Muslims, then Dumat al-Jandal which he took, then Qusam whose Banu Mashja'a ibn al-Taym of Quda'a made peace for a written aman, then Tadmur whose people resisted and fortified themselves then asked safety — granted on being dhimma, quartering the Muslims and submitting to them — then al-Qaryatayn whose people fought and were overcome with spoil, then Hawwarin of Sanir whose people fought with reinforcements from Ba'labakk and Busra and were overcome with captives and killing, then Marj Rahit where he raided the Ghassan on their Easter taking captives and killing; he sent Busr ibn Abi Artat al-Amiri of Quraysh and Habib ibn Maslama al-Fihri to the Ghouta of Damascus to raid its villages, stood at the pass known as Thaniyyat al-Uqab by Damascus unfurling his banner — a black banner that had been the Prophet's — whence its name that day, camped at the eastern gate of Damascus — some say Bab al-Jabiya — whose bishop brought him hospitality and service receiving a promise to keep the covenant, then marched to join the Muslims at the canal of Busra."
  es: "En al-Baladhuri: cuando la carta de Abu Bakr le llegó a al-Hira, dejó a al-Muthanna ibn Haritha al-Shaybani al otro lado de Kufa y marchó en Rabi' al-Akhir del año 13 con ochocientos —algunos dicen quinientos— tomando Ayn al-Tamr por la fuerza (otros dicen que la carta le llegó allí después de su conquista), luego Sandawda', ocupada por Kinda, Iyad y persas, cuyo pueblo luchó y fue vencido; dejó a Sa'd ibn Amr ibn Haram al-Ansari al frente, cuyos descendientes habitan allí hoy; Al enterarse de una reunión apóstata de Banu Taghlib en al-Mudayyih y al-Musayyid bajo el mando de Rabi'a ibn Bujayr, los derrotó, tomó cautivos y botín y los envió a Abu Bakr; entre ellos Umm Habib al-Sahba' bint Habib ibn Bujayr, madre de Umar ibn Ali ibn Abi Talib; asaltó Qaraqir, un abrevadero de Kalbi, luego atravesó el desierto hasta Suwa, también de Kalbi, donde Bahra' estaba con ellos, matando a Hurqus ibn al-Nu'man al-Bahrani de Quda'a y robando sus riquezas; Al entrar en el tramo sin agua, dio de beber a los camellos, les cortó los labios y los hizo babear para que no rumiaran ni tuvieran sed, llevando abundante agua que se agotó en el camino; así que sacrificó a los camellos uno por uno, bebiendo con sus hombres el agua de sus vientres, su guía Rafi' ibn Umayra al-Ta'i ganándose el verso del poeta 'Dios bendiga a Rafi', cómo guió, atravesando desde Qaraqir hasta Suwa'; desde Suwa hasta al-Kawa'il, luego Qarqisiya cuyo señor la abandonó por tierras bizantinas, luego Arak cuyo pueblo sitió hasta que cayó por tratado a cambio de un pago a los musulmanes, luego Dumat al-Jandal que tomó, luego Qusam cuyos Banu Mashja'a ibn al-Taym de Quda'a hicieron la paz por un aman escrito, luego Tadmur cuyo pueblo resistió y se fortificó y luego pidió seguridad, concedida al ser dhimma, acuartelar a los musulmanes y someterse a ellos, luego al-Qaryatayn cuyo pueblo luchó y fue vencido con botín, luego Hawwarin de Sanir cuyo pueblo luchó con refuerzos de Ba'labakk y Busra y fue vencido con cautivos y matanzas, luego Marj Rahit donde asaltó a los Ghassan en su Pascua tomando cautivos y matando; Envió a Busr ibn Abi Artat al-Amiri de Quraysh y a Habib ibn Maslama al-Fihri a la Ghouta de Damasco para saquear sus aldeas, se paró en el paso conocido como Thaniyyat al-Uqab cerca de Damasco desplegando su estandarte —un estandarte negro que había sido del Profeta— de ahí su nombre ese día, acampó en la puerta oriental de Damasco —algunos dicen Bab al-Jabiya— cuyo obispo le brindó hospitalidad y servicio recibiendo la promesa de cumplir el pacto, luego marchó para unirse a los musulmanes en el canal de Busra."
  fr: "Dans al-Baladhuri: lorsque la lettre d'Abu Bakr lui parvint à al-Hira, il laissa al-Muthanna ibn Haritha al-Shaybani du côté de Kufa et marcha en Rabi' al-Akhir de l'an 13 avec huit cents hommes — certains disent cinq cents — prenant Ayn al-Tamr par la force (d'autres disent que la lettre lui parvint là-bas après sa conquête), puis Sandawda', détenue par Kinda, Iyad et les Perses, dont les habitants combattirent et furent vaincus — il laissa Sa'd ibn Amr ibn Haram al-Ansari sur place, dont les descendants y habitent aujourd'hui; Ayant entendu parler d'un rassemblement apostat des Banu Taghlib à al-Mudayyih et al-Musayyid sous Rabi'a ibn Bujayr, il les vainquit, prit des captifs et du butin et les envoya à Abu Bakr — parmi eux Umm Habib al-Sahba' bint Habib ibn Bujayr, mère d'Umar ibn Ali ibn Abi Talib; il pilla Qaraqir, un point d'eau des Kalbi, puis traversa le désert jusqu'à Suwa, également Kalbi, où les Bahra' étaient avec eux, tuant Hurqus ibn al-Nu'man al-Bahrani de Quda'a et emportant leurs richesses; Entrant dans la zone aride, il abreuva les chameaux, leur fendit les lèvres et les fit baver pour qu'ils ne ruminent pas et n'aient pas soif, transportant une eau abondante qui s'épuisait en chemin — il abattit donc les chameaux un par un, buvant avec ses hommes l'eau de leur ventre, son guide Rafi' ibn Umayra al-Ta'i méritant le vers du poète « Dieu bénisse Rafi » — comment il guida, traversant de Qaraqir à Suwa'; de Suwa à al-Kawa'il, puis Qarqisiya dont le seigneur l'abandonna pour les terres byzantines, puis Arak dont il assiégea le peuple jusqu'à sa chute par traité contre un paiement aux musulmans, puis Dumat al-Jandal qu'il prit, puis Qusam dont les Banu Mashja'a ibn al-Taym de Quda'a firent la paix pour un aman écrit, puis Tadmur dont le peuple résista et se fortifia puis demanda la sécurité — accordée après avoir été dhimma, avoir logé les musulmans et s'être soumis à eux — puis al-Qaryatayn dont le peuple combattit et fut vaincu avec du butin, puis Hawwarin de Sanir dont le peuple combattit avec des renforts de Ba'labakk et Busra et fut vaincu avec des captifs et des morts, puis Marj Rahit où il attaqua les Ghassan à leur Pâques, prenant des captifs et tuant; Il envoya Busr ibn Abi Artat al-Amiri de Quraysh et Habib ibn Maslama al-Fihri à la Ghouta de Damas pour piller ses villages, se tint au col connu sous le nom de Thaniyyat al-Uqab par Damas, déployant sa bannière — une bannière noire qui avait été celle du Prophète — d'où son nom ce jour-là, campa à la porte orientale de Damas — certains disent Bab al-Jabiya — dont l'évêque lui offrit l'hospitalité et le service, recevant la promesse de respecter l'alliance, puis marcha pour rejoindre les musulmans au canal de Busra."
  ur: "بلادوری میں ہے: جب ابوبکر کا خط ان کے پاس الحیرہ پہنچا تو اس نے المثنیٰ بن حارثہ الشیبانی کو کوفہ کی طرف چھوڑ دیا اور 13 ربیع الآخر میں آٹھ سو کے ساتھ کوچ کیا جو کہ پانچ سو کہتے ہیں عین التمر کو زبردستی لے گئے ⁦(دوسروں کا کہنا ہے کہ)⁩ خط اس کے پاس پہنچا، پھر میں نے سندہ کو قبضے میں لے لیا، اس کے بعد میں نے اس پر قبضہ کیا۔ فارسی، جن کے لوگ لڑے اور مغلوب ہوئے - اس نے سعد بن عمرو بن حرام الانصاری کو اس پر چھوڑ دیا، جن کی اولادیں آج وہاں رہتی ہیں۔ بنو تغلب کے مرتد اجتماع کا سن کر المدیح اور المسیّد میں ربیعہ بن بُزیر کے ماتحت تھے، اس نے انہیں شکست دی، قیدی اور مال غنیمت لے کر ابوبکر کے پاس بھیج دیا، ان میں ام حبیب الصحابہ بنت حبیب ابن بُزیر، عمر بن علی بن علی بن ابی طالب کی والدہ تھیں۔ اس نے قراقیر پر چڑھائی کی، جو کلبی کے پانی کی جگہ ہے، پھر صحرا کا سفر کرتے ہوئے سوع تک پہنچا، اسی طرح کلبی، جہاں بحریہ ان کے ساتھ تھے، قدعہ کے حرقس بن نعمان البحرانی کو قتل کیا اور ان کی دولت کو جھاڑ دیا۔ اس نے اونٹوں کو پانی پلایا، ان کے ہونٹ کاٹ دیے اور ان کے ہونٹوں کو ترسایا تاکہ وہ بے ہوش نہ ہوں اور پیاس نہ لگے، راستے میں بہتا ہوا پانی لے کر چلا گیا- چنانچہ اس نے ایک ایک کر کے اونٹوں کو ذبح کیا، اپنے آدمیوں کے ساتھ ان کے پیٹ کا پانی پیا، اس کے رہنما رافع ابن عمیرہ نے کس طرح شاعری کی برکت حاصل کی۔ اس نے قراقر سے سواع تک راہنمائی کی۔ سوع سے الکویل تک، پھر قرقیسیہ جس کے آقا نے اسے بازنطینی سرزمینوں کے لیے چھوڑ دیا، پھر اراک جس کے لوگوں کا اس نے محاصرہ کیا یہاں تک کہ اس نے مسلمانوں کو معاوضہ دینے کے لیے معاہدہ کر لیا، پھر دمت الجندل جو اس نے لے لیا، پھر قسام جس کے بنو مشجعہ بن الطیم قدعہ نے، پھر ان لوگوں سے صلح کی جس کے بعد دوبارہ تقدیر کا مطالبہ کیا۔ تحفظ - ذمی ہونے، مسلمانوں کو چوتھائی کرنے اور ان کے تابع ہونے پر عطا کیا گیا - پھر القریطین جس کے لوگ لڑے اور مال غنیمت سے مغلوب ہوئے، پھر حورین آف صنیر جس کے لوگ بعلبک اور بصرہ سے کمک کے ساتھ لڑے اور اسیروں اور قتل و غارت سے مغلوب ہوئے، پھر مرج رہیت جہاں اس نے مشرقی غاصب پر قبضہ کیا اور ان کے قتل عام پر قبضہ کیا۔ اس نے قریش کے بسر بن ابی ارطاط العمیری اور حبیب بن مسلمہ الفہری کو دمشق کے غوطہ میں اس کے دیہاتوں پر چھاپہ مارنے کے لیے بھیجا، دمشق کی جانب سے ثنیات العقاب کے نام سے جانے والے درے پر کھڑے ہو کر اپنا جھنڈا لہرا رہے تھے - ایک سیاہ جھنڈا جو رسول اللہ کا دن تھا - جہاں سے اس کا نام دمس کے دروازے پر پڑا۔ باب الجبیہ - جس کے بشپ نے اس کی مہمان نوازی اور خدمت کا وعدہ پورا کرنے کا وعدہ لیا، پھر نہر بصرہ پر مسلمانوں کے ساتھ شامل ہونے کے لیے کوچ کیا۔"
  tr: "El-Baladhuri'ye göre: Ebu Bekir'in mektubu Hira'dayken kendisine ulaştığında, Kufa bölgesinin sorumluluğunu El-Muthanna bin Haritha el-Şeybani'ye bırakarak, 13. yılın Rebiü'l-Ahir ayında sekiz yüz, hatta beş yüz kişiyle yola çıktı. Ayn-ı Tamr'a geldi ve orayı zorla ele geçirdi (ve mektubun kendisine oradayken ve orayı ele geçirmişken ulaştığı söylenir). Sonra, Kinda, İyad ve Perslerden insanların bulunduğu Sanduda'ya gitti. Oradaki insanlar onunla savaştı ve o galip geldi. Sa'd bin Amr bin Haram el-Ensari'yi orada bıraktı. Banau Taghlib'den bir grubun El-Mudayh ve El-Mesid'de, Rabi'a bin Bujair'in de aralarında bulunduğu, onlara karşı ayaklanmış oldukları kendisine bildirildi. Bunun üzerine onlara gitti, onları yendi, esirler ve ganimetler aldı ve esirleri Ebu Bekir'e gönderdi. Bunların arasında Ömer bin Ali bin Ebu Talib'in annesi Ümmü Habib el-Sahba bint Habib bin Bujair de vardı. Sonra Kalb için bir su kaynağı olan Karakir'e ve oradan da Kalb için bir su kaynağı olan Suve'ye Favz'a baskın düzenledi. Onlarla birlikte Bahra'dan insanlar da vardı. Bunun üzerine Kuda'ah'tan Harkus bin el-Nu'man el-Bahrani'yi öldürdü ve mallarına el koydu. Çölde ilerlerken develeri aldı, onlara su verdi, sonra dudaklarını kesti ve susuz kalmamaları için yürüttü. Çok su aldı, ancak yolda su bitti. Bunun üzerine develeri teker teker kesmeye başladı ve kendisi ve arkadaşları midelerinden su içtiler. Rehberi ise şairin övdüğü Rafi' bin Amira el-Ta'i idi: \"Allah Rafi'yi mükafatlandırsın, Favz'ı Karakir'den Suve'ye nasıl da yönlendirdi.\" Sonra Suva'dan el-Kawail'e gitti ve Karkisiye'ye geldi, ancak hükümdarı onu terk edip çöle çekildi. Arak'a geldi ve halkını kuşattı, sonra Müslümanlar için onlardan aldığı bir şey karşılığında barışçıl bir şekilde fethetti. Dumat el-Cendal'e geldi ve orayı fethetti. Kasm'a geldi ve Kuda'a'lı Beni Muşca'a ibn el-Taym onunla barıştı ve onlara güvenlik garantisi verdi. Palmira'ya geldi, ancak halkı direndi ve kendilerini tahkim etti, sonra güvenlik aradılar, bu yüzden onlara koruma altında olmaları ve Müslümanları tanıyıp onlara boyun eğmeleri şartıyla güvenlik sağladı. El-Karyatayn'a geldi ve halkı onunla savaştı, ancak o galip geldi ve ganimet aldı. Sanir'deki Havrin'e geldi ve halkı Baalbek ve Busra'dan gelen takviyelerle ona karşı savaştı, ancak o galip geldi, esirler aldı ve öldürdü. Marj Rahit'e geldi ve Paskalya gününde Ghassan'a baskın düzenleyerek esirler aldı ve öldürdü. Bişr ibn Abi Artat el-Amiri ve Habib ibn Maslama el-Fihri'yi Şam'ın Guta bölgesine gönderdi ve onlar da bazı köylerine baskın düzenlediler. Şam'da Thaniyat el-Uqab olarak bilinen geçitte durdu ve sancağını açtı; bu sancak Peygamber'e ait siyah bir sancaktı, bu yüzden Thaniyat el-Uqab olarak adlandırıldı. Ceza o gündü ve Şam'ın doğu kapısına, ya da rivayete göre Jabiyah kapısına indi. Şam Piskoposu ona konaklama ve hizmet sağladı ve o da ahdini tutacağına söz verdi. Sonra Müslümanlara ulaşana kadar yürüdü ve onlar Busra kanalındaydılar."
  id: "Menurut Al-Baladhuri: Ketika surat Abu Bakr sampai kepadanya saat ia berada di Al-Hira, ia meninggalkan Al-Muthanna bin Haritha Al-Shaybani yang bertanggung jawab atas wilayah Kufa dan berangkat pada bulan Rabi’ Al-Akhir tahun 13 dengan delapan ratus orang, atau dikatakan dengan lima ratus orang. Ia sampai di Ain Al-Tamr dan menaklukkannya dengan kekerasan (dan dikatakan bahwa surat itu sampai kepadanya saat ia berada di sana dan telah menaklukkannya). Kemudian ia pergi ke Sanduda’, tempat tinggal orang-orang dari Kinda, Iyad, dan Persia. Penduduknya melawannya dan ia menang. Ia meninggalkan Sa’d bin Amr bin Haram Al-Ansari di sana. Ia diberitahu bahwa sekelompok Bani Taghlib berada di Al-Mudayh dan Al-Masid, yang telah berbalik melawan mereka, dengan Rabi’a bin Bujair di pihak mereka. Maka ia datang kepada mereka dan mengalahkan mereka, serta mengambil tawanan dan harta rampasan dan mengirim tawanan tersebut kepada Abu Bakr. Di antara mereka adalah Umm Habib Al-Sahba’ bint Habib bin Bujair, ibu dari Umar bin Ali bin Abi Talib. Kemudian ia menyerbu Qaraqir, yang merupakan tempat peristirahatan bagi Kalb, dan kemudian Fawz dari sana ke Suwa, yang juga merupakan tempat peristirahatan bagi Kalb, dan bersama mereka ada orang-orang dari Bahra’, maka ia membunuh Harqus bin Al-Nu’man Al-Bahrani dari Quda’ah dan merampas harta mereka. Ketika ia berkuda melintasi padang pasir, ia mengambil unta-unta dan memberi mereka minum, kemudian memotong bibir mereka dan membuat mereka berjalan agar mereka tidak mengunyah dan menjadi haus, dan ia mengambil banyak air, tetapi air itu habis di tengah jalan, maka ia mulai menyembelih unta satu per satu dan ia serta para sahabatnya meminum air dari perut mereka, dan pemandunya adalah Rafi’ bin ‘Amirah Al-Ta’i, yang dipuji oleh penyair: “Semoga Allah memberi pahala kepada Rafi’, atas bagaimana ia memandu Fawz dari Qaraqir ke Suwa.” Kemudian ia berangkat dari Suwa ke al-Kawail dan sampai ke Qarqisiya, tetapi penguasanya meninggalkannya dan mundur ke padang pasir. Ia datang ke Arak dan mengepung penduduknya, lalu menaklukkannya secara damai dengan imbalan sesuatu yang diambilnya dari mereka untuk kaum Muslimin. Ia datang ke Dumat al-Jandal dan menaklukkannya. Ia datang ke Qasm, dan Bani Mushja’a ibn al-Taym dari Quda’a berdamai dengannya dan menuliskan jaminan keselamatan bagi mereka. Ia datang ke Palmyra, tetapi penduduknya melawan dan membentengi diri, kemudian mereka mencari perlindungan, sehingga ia memberi mereka perlindungan dengan syarat mereka menjadi warga negara yang dilindungi dan mengakui kaum Muslimin serta tunduk kepada mereka. Ia datang ke al-Qaryatayn, dan penduduknya memeranginya, tetapi ia menang dan mengambil rampasan perang. Ia datang ke Hawarin di Sanir, dan penduduknya memeranginya dengan bala bantuan dari Baalbek dan Busra, tetapi ia menang, menawan banyak orang dan membunuh banyak orang. Dia datang ke Marj Rahit dan menyerbu Ghassan pada hari Paskah mereka, menawan orang dan membunuh. Dia mengirim Bishr ibn Abi Artat al-Amiri dan Habib ibn Maslama al-Fihri ke Ghouta Damaskus, dan mereka menyerbu beberapa desa di sana. Dia berdiri di celah yang dikenal sebagai Thaniyat al-Uqab di Damaskus, mengibarkan panjinya, yang merupakan panji hitam yang pernah menjadi milik Nabi, sehingga dinamakan Thaniyat al-Uqab. Hukuman dijatuhkan pada hari itu, dan dia turun ke gerbang timur Damaskus, atau konon, ke gerbang Jabiyah. Uskup Damaskus membawakan tempat tinggal dan pelayanan kepadanya, dan dia berjanji untuk menepati perjanjiannya. Kemudian dia berbaris sampai dia mencapai kaum Muslim, dan mereka berada di kanal Busra."
