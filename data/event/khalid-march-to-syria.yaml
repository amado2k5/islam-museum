label: { ar: "مسير خالد بن الوليد إلى الشام", en: "Khalid ibn al-Walid's March to Syria" }
summary:
  ar: "عند البلاذري: لما أتاه كتاب أبي بكر وهو بالحيرة خلّف المثنى بن حارثة الشيباني على ناحية الكوفة وسار في شهر ربيع الآخر سنة 13 في ثمانمائة ويقال في خمسمائة، فأتى عين التمر ففتحها عنوة (وقيل وافاه الكتاب وهو بها وقد فتحها)، ثم سار إلى صندوداء بها قوم من كندة وإياد والعجم فقاتله أهلها فظفر وخلّف بها سعد بن عمرو بن حرام الأنصاري، وبلغه أن جمعاً لبني تغلب بالمضيح والمصيد مرتدين عليهم ربيعة بن بجير فأتاهم فهزمهم وسبى وغنم وبعث بالسبي إلى أبي بكر وكانت منهم أم حبيب الصهباء بنت حبيب بن بجير أم عمر بن علي بن أبي طالب؛ ثم أغار على قراقر وهو ماء لكلب ثم فوز منه إلى سوى ماء لكلب أيضاً معهم فيه قوم من بهراء فقتل حرقوص بن النعمان البهراني من قضاعة واكتسح أموالهم، وكان لما ركب المفازة عمد إلى الرواحل فأرواها من الماء ثم قطع مشافرها وأجرها لئلا تجتر فتعطش واستكثر من الماء فنفد في طريقه فجعل ينحر الرواحل راحلة راحلة ويشرب وأصحابه الماء من أكراشها، ودليله رافع بن عميرة الطائي الذي مدحه الشاعر «لله در رافع أنّى اهتدى فوز من قراقر إلى سوى»؛ ثم خرج من سوى إلى الكوائل فأتى قرقيسيا فتركه صاحبها وانحاز إلى البر، وأتى أرك فحاصر أهلها ففتحها صلحاً على شيء أخذه منهم للمسلمين، وأتى دومة الجندل ففتحها، وأتى قصم فصالحه بنو مشجعة بن التيم من قضاعة وكتب لهم أماناً، وأتى تدمر فامتنع أهلها وتحصنوا ثم طلبوا الأمان فأمنهم على أن يكونوا ذمة وأن قروا المسلمين ورضخوا لهم، وأتى القريتين فقاتله أهلها فظفر وغنم، وأتى حوارين من سنير فقاتله أهلها مع مدد بعلبك وبصرى فظفر فسبى وقتل، وأتى مرج راهط فأغار على غسان في يوم فصحهم فسبى وقتل، ووجّه بشر بن أبي أرطاة العامري وحبيب بن مسلمة الفهري إلى غوطة دمشق فأغارا على قرى من قراها، ووقف على الثنية المعروفة بثنية العقاب بدمشق ناشراً رايته وهي راية كانت للنبي سوداء فسُميت ثنية العقاب يومئذ، ونزل بالباب الشرقي من دمشق ويقال بباب الجابية فأخرج إليه أسقف دمشق نزلاً وخدمة فوعده بحفظ عهده، ثم سار حتى انتهى إلى المسلمين وهم بقناة بصرى."
  en: "In al-Baladhuri: when Abu Bakr's letter reached him at al-Hira he left al-Muthanna ibn Haritha al-Shaybani over the Kufa side and marched in Rabi' al-Akhir of year 13 with eight hundred — some say five hundred — taking Ayn al-Tamr by force (others say the letter reached him there after its conquest), then Sandawda', held by Kinda, Iyad and Persians, whose people fought and were overcome — he left Sa'd ibn Amr ibn Haram al-Ansari over it, whose descendants dwell there today; hearing of an apostate gathering of Banu Taghlib at al-Mudayyih and al-Musayyid under Rabi'a ibn Bujayr he defeated them, took captives and spoil and sent them to Abu Bakr — among them Umm Habib al-Sahba' bint Habib ibn Bujayr, mother of Umar ibn Ali ibn Abi Talib; he raided Qaraqir, a Kalbi watering-place, then traversed the desert to Suwa, likewise Kalbi, where Bahra' were with them, killing Hurqus ibn al-Nu'man al-Bahrani of Quda'a and sweeping up their wealth; entering the waterless stretch he watered the camels, slit their lips and made them drool so they would not ruminate and thirst, carrying abundant water which ran out on the way — so he slaughtered the camels one by one, drinking with his men the water of their bellies, his guide Rafi' ibn Umayra al-Ta'i earning the poet's verse 'God bless Rafi' — how he guided, traversing from Qaraqir to Suwa'; from Suwa to al-Kawa'il, then Qarqisiya whose lord abandoned it for Byzantine lands, then Arak whose people he besieged until it fell by treaty for a payment to the Muslims, then Dumat al-Jandal which he took, then Qusam whose Banu Mashja'a ibn al-Taym of Quda'a made peace for a written aman, then Tadmur whose people resisted and fortified themselves then asked safety — granted on being dhimma, quartering the Muslims and submitting to them — then al-Qaryatayn whose people fought and were overcome with spoil, then Hawwarin of Sanir whose people fought with reinforcements from Ba'labakk and Busra and were overcome with captives and killing, then Marj Rahit where he raided the Ghassan on their Easter taking captives and killing; he sent Busr ibn Abi Artat al-Amiri of Quraysh and Habib ibn Maslama al-Fihri to the Ghouta of Damascus to raid its villages, stood at the pass known as Thaniyyat al-Uqab by Damascus unfurling his banner — a black banner that had been the Prophet's — whence its name that day, camped at the eastern gate of Damascus — some say Bab al-Jabiya — whose bishop brought him hospitality and service receiving a promise to keep the covenant, then marched to join the Muslims at the canal of Busra."
