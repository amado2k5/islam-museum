summary:
  ar: "في سنة أربع وثمانين ومائتين أُخذ نصراني شُهد عليه أنه شتم النبي فحُبس، فاجتمعت العوام وصاحوا بالقاسم بن عبيد الله يطالبونه بإقامة الحد، ومضوا إلى دار السلطان فوثبوا بأعوانه حتى هربوا، ودخلوا من الباب الأول والثاني إلى باب المعتضد، فأرسل إلى يوسف القاضي لينظر في الأمر، فكاد الزحام يقتل الرسول والقاضي حتى دخل القاضي بابًا وأُغلق دونهم {cite:muntazam-ibn-al-jawzi p. 171}."
  en: "In 284 a Christian testified to have insulted the Prophet was imprisoned; the Baghdad crowds massed demanding the hadd, stormed the vizier's door and the caliphal gates, and nearly killed the judge Yusuf and the caliph's messenger in the crush {cite:muntazam-ibn-al-jawzi p. 171}."
