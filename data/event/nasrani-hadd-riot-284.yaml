label: { ar: "فتنة النصراني المشتِم سنة ٢٨٤", en: "Unrest over the Christian accused of insulting the Prophet, 284", es: "Disturbios por el cristiano acusado de insultar al Profeta, 284", fr: "Troubles suite à l'accusation d'insulte portée contre un chrétien contre le Prophète, 284", ur: "توہین رسالت کے الزام میں مسیحی پر بدامنی، 284", tr: "Hristiyanların 284 yılındaki küfür tartışması", id: "Kontroversi penistaan agama Kristen pada tahun 284" }
summary:
  ar: "في سنة أربع وثمانين ومائتين أُخذ نصراني شُهد عليه أنه شتم النبي فحُبس، فاجتمعت العوام وصاحوا بالقاسم بن عبيد الله يطالبونه بإقامة الحد، ومضوا إلى دار السلطان فوثبوا بأعوانه حتى هربوا، ودخلوا من الباب الأول والثاني إلى باب المعتضد، فأرسل إلى يوسف القاضي لينظر في الأمر، فكاد الزحام يقتل الرسول والقاضي حتى دخل القاضي بابًا وأُغلق دونهم {cite:muntazam-ibn-al-jawzi p. 171}."
  en: "In 284 a Christian testified to have insulted the Prophet was imprisoned; the Baghdad crowds massed demanding the hadd, stormed the vizier's door and the caliphal gates, and nearly killed the judge Yusuf and the caliph's messenger in the crush {cite:muntazam-ibn-al-jawzi p. 171}."
  es: "En 284, un cristiano que testificó haber insultado al Profeta fue encarcelado; las multitudes de Bagdad se congregaron exigiendo el hadd, asaltaron la puerta del visir y las puertas del califa, y casi matan al juez Yusuf y al mensajero del califa en la estampida {cite:muntazam-ibn-al-jawzi p. 171}."
  fr: "En 284, un chrétien qui avait témoigné avoir insulté le Prophète fut emprisonné; les foules de Bagdad se rassemblèrent en réclamant le hadd, prirent d'assaut la porte du vizir et les portes du calife, et faillirent tuer le juge Yusuf et le messager du calife dans la bousculade {cite:muntazam-ibn-al-jawzi p. 171}."
  ur: "284 میں ایک عیسائی نے پیغمبر کی توہین کی گواہی دی جسے قید کر دیا گیا۔ بغداد کے ہجوم نے حد کا مطالبہ کرتے ہوئے وزیر کے دروازے اور خلیفہ کے دروازوں پر دھاوا بول دیا اور تقریباً قاضی یوسف اور خلیفہ کے قاصد کو کچل کر ہلاک کر دیا۔ 171}۔"
  tr: "Hicri 284 yılında, bir Hristiyanın Peygamber'e hakaret ettiğine şahit olunduktan sonra tutuklanıp hapsedildi. Halk toplandı ve Al-Qasim bin Ubaid Allah'a seslenerek cezayı uygulamasını istedi. Sultanın evine gidip yardımcılarına saldırdılar ve onlar kaçtılar. Birinci ve ikinci kapılardan Al-Mu'tadid kapısına girdiler. Sultan, olayı incelemesi için Yusuf adlı kadıyı gönderdi. Kalabalık, kadı bir kapıdan içeri girip kapı arkalarından kapanana kadar elçiyi ve kadıyı neredeyse öldürecekti. {Kaynak:muntazam-ibn-al-jawzi s. 171}"
  id: "Pada tahun 284 H, seorang Kristen ditangkap setelah terbukti menghina Nabi, sehingga ia dipenjara. Rakyat jelata berkumpul dan berteriak kepada Al-Qasim bin Ubaid Allah, menuntut agar ia melaksanakan hukuman tersebut. Mereka pergi ke rumah Sultan dan menyerang para pembantunya hingga mereka melarikan diri. Mereka masuk melalui gerbang pertama dan kedua menuju gerbang Al-Mu'tadid. Ia mengutus Yusuf sang hakim untuk menyelidiki masalah tersebut. Kerumunan itu hampir membunuh utusan dan hakim tersebut hingga hakim memasuki sebuah gerbang dan gerbang itu ditutup di belakang mereka. {cite:muntazam-ibn-al-jawzi p. 171}."
