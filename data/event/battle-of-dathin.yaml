label: { ar: "وقعة داثن", en: "The Battle of Dathin", fr: "La bataille de Dathin", es: "La batalla de Dathin" }
summary:
  ar: "عند البلاذري: أول وقعة كانت بين المسلمين وعدوهم بقرية من قرى غزة يقال لها داثن، كانت بينهم وبين بطريق غزة، فاقتتلوا فيها قتالاً شديداً ثم أظهر الله أولياءه وهزم أعداءه وفضّ جمعهم، وذلك قبل قدوم خالد بن الوليد الشام؛ وحدّث أبو حفص الشامي عن مشايخ من أهل الشام أن أول وقائع المسلمين كانت وقعة العربة لم يقاتلوا قبلها مذ فصلوا من الحجاز ولم يمروا بشيء من الأرض بين الحجاز وموضعها إلا غلبوا عليه بغير حرب."
  en: "In al-Baladhuri: the first engagement between the Muslims and their enemy at a village of Gaza's district called Dathin, against the patrician of Gaza; they fought hard, then God gave victory to His friends, defeated His enemies and scattered their gathering — this before Khalid ibn al-Walid's arrival in Syria; Abu Hafs al-Shami reports from the elders of Syria that the Muslims' first engagement was rather that of al-Araba, they having fought nothing since leaving the Hijaz and subdued every land between the Hijaz and its site without battle."
  fr: "Chez al-Baladhuri : le premier engagement entre les musulmans et leur ennemi eut lieu dans un village du district de Gaza appelé Dathin, contre le patrice de Gaza ; ils combattirent durement, puis Dieu donna la victoire à Ses amis, défit Ses ennemis et dispersa leur rassemblement, et cela avant l'arrivée de Khalid ibn al-Walid en Syrie ; Abu Hafs al-Shami rapporte des anciens de Syrie que le premier engagement des musulmans fut plutôt celui d'al-Araba, car ils n'avaient pas combattu depuis leur départ du Hijaz et avaient soumis sans bataille toutes les terres entre le Hijaz et ce lieu."
  es: "En al-Baladhuri: el primer enfrentamiento entre los musulmanes y su enemigo en una aldea del distrito de Gaza llamada Dathin, contra el patricio de Gaza; lucharon arduamente, luego Dios dio la victoria a Sus amigos, derrotó a Sus enemigos y dispersó su reunión; esto antes de la llegada de Khalid ibn al-Walid a Siria; Abu Hafs al-Shami informa de los ancianos de Siria que el primer enfrentamiento de los musulmanes fue más bien el de al-Araba, ya que no habían luchado desde que dejaron el Hiyaz y sometieron todas las tierras entre el Hiyaz y su sitio sin batalla."
