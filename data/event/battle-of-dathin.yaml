label: { ar: "وقعة داثن", en: "The Battle of Dathin" }
summary:
  ar: "عند البلاذري: أول وقعة كانت بين المسلمين وعدوهم بقرية من قرى غزة يقال لها داثن، كانت بينهم وبين بطريق غزة، فاقتتلوا فيها قتالاً شديداً ثم أظهر الله أولياءه وهزم أعداءه وفضّ جمعهم، وذلك قبل قدوم خالد بن الوليد الشام؛ وحدّث أبو حفص الشامي عن مشايخ من أهل الشام أن أول وقائع المسلمين كانت وقعة العربة لم يقاتلوا قبلها مذ فصلوا من الحجاز ولم يمروا بشيء من الأرض بين الحجاز وموضعها إلا غلبوا عليه بغير حرب."
  en: "In al-Baladhuri: the first engagement between the Muslims and their enemy at a village of Gaza's district called Dathin, against the patrician of Gaza; they fought hard, then God gave victory to His friends, defeated His enemies and scattered their gathering — this before Khalid ibn al-Walid's arrival in Syria; Abu Hafs al-Shami reports from the elders of Syria that the Muslims' first engagement was rather that of al-Araba, they having fought nothing since leaving the Hijaz and subdued every land between the Hijaz and its site without battle."
