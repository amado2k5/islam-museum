summary:
  ar: "بطاقة أولية لمعركة وفلة سنة ١٥٤٢م، هزيمة أحمد غران للحامية البرتغالية ومقتل كريستوفاو دا غاما في الحبشة؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Wofla in 1542, Ahmad Gran's defeat of the Portuguese force and killing of Cristóvão da Gama in Ethiopia; its sources are not yet checked on the page."
