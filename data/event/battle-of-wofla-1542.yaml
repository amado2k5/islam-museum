  ur: "1542 میں ووفلا کی جنگ کے لیے ڈرافٹ کارڈ، احمد گران کی پرتگالی فوج کی شکست اور ایتھوپیا میں کرسٹووا دا گاما کا قتل؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1542 yılında gerçekleşen Wafala Muharebesi'nin ön anlatımı; Portekiz garnizonunun Ahmed Gran tarafından yenilgiye uğratılması ve Habeşistan'da Cristóvão da Gama'nın öldürülmesi; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Wafala pada tahun 1542 M, kekalahan garnisun Portugis oleh Ahmad Gran dan pembunuhan Cristóvão da Gama di Abyssinia; sumber-sumber di halaman ini belum ditinjau."
