label: { ar: "فتح الدينور وماسبذان ومهرجانقذف", en: "The Conquest of al-Dinawar, Masabadhan and Mihrajanqadhaf", es: "La conquista de al-Dinawar, Masabadhan y Mihrajanqadhaf", fr: "La conquête d'al-Dinawar, Masabadhan et Mihrajanqadhaf" }
summary:
  ar: "عند البلاذري: انصرف أبو موسى الأشعري من نهاوند وقد كان سار بنفسه إليها على بعث أهل البصرة ممداً للنعمان بن مقرن فسار إلى الدينور فأقام عليها خمسة أيام قوتل منها يوماً واحداً ثم إن أهلها أقروا بالجزية والخراج وسألوا الأمان على أنفسهم وأموالهم وأولادهم فأجابهم إلى ذلك وخلف بها عامله في خيل ثم مضى إلى ماسبذان فلم يقاتله أهلها وصالحه أهل السيروان على مثل صلح الدينور وعلى أن يؤدوا الجزية والخراج وبث السرايا فيهم فغلب على أرضها وقوم يقولون إن أبا موسى فتح ماسبذان قبل وقعة نهاوند وبعث أبو موسى عبد الله بن قيس الأشعري السائب بن الأقرع الثقفي وهو صهره على ابنته وهي أم محمد بن السائب إلى الصيمرة مدينة مهرجانقذف ففتحها صلحاً على حقن الدماء وترك السباء والصفح عن الصفراء والبيضاء وعلى أداء الجزية وخراج الأرض وفتح جميع كور مهرجانقذف وأثبت الخبر أنه وجه السائب من الأهواز ففتحها."
  en: "In al-Baladhuri: Abu Musa al-Ash'ari returned from Nihawand — where he had marched personally on the Basra levy to reinforce al-Nu'man ibn Muqarrin — to al-Dinawar, staying upon it five days and fighting one; its people accepted jizya and kharaj and asked quarter for themselves, their wealth and children, and he granted it, leaving his agent with horse. Then to Masabadhan — its people did not fight him; the people of al-Sirwan made peace on al-Dinawar's terms, paying jizya and kharaj, and he loosed squadrons through them and mastered its land — some say Abu Musa took Masabadhan before Nihawand's battle. Abu Musa sent Abdallah ibn Qays al-Ash'ari — al-Sa'ib ibn al-Aqra' al-Thaqafi, his son-in-law through his daughter, mother of Muhammad ibn al-Sa'ib — to al-Saymara, city of Mihrajanqadhaf, which he took by treaty on sparing of blood, abandoning of captives and the pardoning of the safra' and bayda' treasures, on jizya and the land's kharaj; he conquered the whole kura of Mihrajanqadhaf, the stronger report being that al-Sa'ib was sent from al-Ahwaz."
  es: "En al-Baladhuri: Abu Musa al-Ash'ari regresó de Nihawand —donde había marchado personalmente en el contingente de Basora para reforzar a al-Nu'man ibn Muqarrin— a al-Dinawar, donde permaneció cinco días y luchó uno; sus habitantes aceptaron la jizya y el kharaj y pidieron clemencia para sí mismos, sus bienes y sus hijos, y él se la concedió, dejando a su agente con un caballo. Luego fue a Masabadhan —sus habitantes no lucharon contra él; la gente de al-Sirwan hizo las paces en los términos de al-Dinawar, pagando la jizya y el kharaj, y él lanzó escuadrones a través de ellos y dominó su territorio— algunos dicen que Abu Musa tomó Masabadhan antes de la batalla de Nihawand. Abu Musa envió a Abdallah ibn Qays al-Ash'ari — al-Sa'ib ibn al-Aqra' al-Thaqafi, su yerno a través de su hija, madre de Muhammad ibn al-Sa'ib — a al-Saymara, ciudad de Mihrajanqadhaf, que tomó por tratado sobre el perdón de la sangre, el abandono de los cautivos y el perdón de los tesoros safra' y bayda', a cambio de la jizya y el kharaj de la tierra; conquistó toda la kura de Mihrajanqadhaf, siendo el relato más sólido que al-Sa'ib fue enviado desde al-Ahwaz."
  fr: "Selon al-Baladhuri: Abu Musa al-Ash'ari revint de Nihawand, où il avait personnellement marché sur les troupes de Bassora pour renforcer al-Nu'man ibn Muqarrin, à al-Dinawar. Il y séjourna cinq jours et livra un seul combat. Les habitants acceptèrent la jizya et le kharaj et demandèrent grâce pour eux-mêmes, leurs biens et leurs enfants, ce qu'il leur accorda, laissant son agent avec un cheval. Puis il se rendit à Masabadhan. Ses habitants ne lui opposèrent aucune résistance. Les habitants d'al-Sirwan firent la paix aux conditions d'al-Dinawar, payant la jizya et le kharaj. Il lança alors des escadrons à travers eux et s'empara de leurs terres. Certains affirment qu'Abu Musa prit Masabadhan avant la bataille de Nihawand. Abou Moussa envoya Abdallah ibn Qays al-Ash'ari — al-Sa'ib ibn al-Aqra' al-Thaqafi, son gendre par sa fille, mère de Muhammad ibn al-Sa'ib — à al-Saymara, ville de Mihrajanqadhaf, qu'il prit par traité d'épargne de sang, d'abandon des captifs et de pardon des trésors safra' et bayda', sur la jizya et le kharaj de la terre; il conquit toute la kura de Mihrajanqadhaf, le rapport le plus solide étant qu'al-Sa'ib fut envoyé d'al-Ahwaz."
