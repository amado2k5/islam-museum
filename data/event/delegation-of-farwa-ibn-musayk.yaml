label: { ar: "قدوم فروة بن مسيك المرادي وإسلامه", en: "Farwa ibn Musayk al-Muradi comes to the Prophet and embraces Islam", es: "Farwa ibn Musayk al-Muradi acude al Profeta y abraza el Islam.", fr: "Farwa ibn Musayk al-Muradi se rend auprès du Prophète et embrasse l'islam." }
summary:
  ar: "قدم فروة بن مسيك المرادي على النبي مفارقاً لملوك كندة ومباعداً لهم، وقال في مسيره بيتين يؤم فيهما محمداً راجياً فواضله؛ فسأله النبي: هل ساءك ما أصاب قومك يوم الردم؟ وقال إن ذلك لم يزد قومه في الإسلام إلا خيراً، واستعمله على مراد وزبيد ومذحج كلها، وبعث معه خالد بن سعيد بن العاص على الصدقة، فكان معه في بلاده حتى توفي النبي."
  en: "Farwa ibn Musayk al-Muradi came to the Prophet, breaking with the kings of Kinda, reciting two verses on the way about seeking Muhammad's favours; the Prophet asked whether what befell his people on the Day of al-Radm grieved him and said it had only increased them in Islam's good. He set him over Murad, Zubayd and all Madhhij and sent Khalid ibn Sa'id ibn al-As with him over the sadaqa, who stayed in his land until the Prophet died."
  es: "Farwa ibn Musayk al-Muradi se presentó ante el Profeta, rompiendo con los reyes de Kinda, y recitó dos versículos en el camino pidiendo el favor de Muhammad. El Profeta le preguntó si lo que le había sucedido a su pueblo el Día de al-Radm le había afligido, y él respondió que solo había aumentado su bien en el Islam. Lo puso al frente de Murad, Zubayd y todos los Madhhij, y envió con él a Khalid ibn Sa'id ibn al-As para que se encargara de la caridad, quien permaneció en su tierra hasta la muerte del Profeta."
  fr: "Farwa ibn Musayk al-Muradi vint trouver le Prophète, rompant avec les rois de Kinda. En chemin, il récita deux versets, invoquant la recherche de la faveur de Muhammad. Le Prophète lui demanda si le sort de son peuple le jour d'al-Radm l'affligeait, et répondit que cela n'avait fait que les fortifier dans la foi en l'Islam. Il le chargea de Murad, Zubayd et de tout le Madhhij, et envoya avec lui Khalid ibn Sa'id ibn al-As pour accomplir la sadaqa. Ce dernier demeura sur ses terres jusqu'à la mort du Prophète."
