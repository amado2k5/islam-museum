label: { ar: "قدوم فروة بن مسيك المرادي وإسلامه", en: "Farwa ibn Musayk al-Muradi comes to the Prophet and embraces Islam" }
summary:
  ar: "قدم فروة بن مسيك المرادي على النبي مفارقاً لملوك كندة ومباعداً لهم، وقال في مسيره بيتين يؤم فيهما محمداً راجياً فواضله؛ فسأله النبي: هل ساءك ما أصاب قومك يوم الردم؟ وقال إن ذلك لم يزد قومه في الإسلام إلا خيراً، واستعمله على مراد وزبيد ومذحج كلها، وبعث معه خالد بن سعيد بن العاص على الصدقة، فكان معه في بلاده حتى توفي النبي."
  en: "Farwa ibn Musayk al-Muradi came to the Prophet, breaking with the kings of Kinda, reciting two verses on the way about seeking Muhammad's favours; the Prophet asked whether what befell his people on the Day of al-Radm grieved him and said it had only increased them in Islam's good. He set him over Murad, Zubayd and all Madhhij and sent Khalid ibn Sa'id ibn al-As with him over the sadaqa, who stayed in his land until the Prophet died."
