label: { ar: "مقتل حجر أبي امرئ القيس" }
summary:
  ar: "مقتل حجر بن الحارث الكندي أبي امرئ القيس الشاعر؛ ملكه أبوه على بني أسد وغطفان وكنانة وله عليهم جائزة وإتاوة، فلما طردت بنو أسد جباته وضربوهم سار إليهم بجند من ربيعة وقيس وكنانة فأخذ سرواتهم وجعل يقتلهم بالعصا وأباح الأموال وحبس أشرافهم فيهم عبيد بن الأبرص، فلما صاروا على يوم منه تكهن كاهنهم عوف بن ربيعة فقال «من الملك الصلهب الغلاب غير المغلب، في الإبل كأنها الربرب، هذا دمه يتثعب، وهو غداً أول من يستلب»، فهجموا عليه في قبته فطعنه علباء بن الحارث الكاهلي وكان حجر قتل أباه، وانتهبوا هجانته ونساءه وأسلابه؛ فأشعل قتله حرب ثأر امرئ القيس على بني أسد {cite:kamil-ibn-al-athir p. 383-384}."
  en: "The killing of Hujr, father of Imru' al-Qays: Asad's tributary king answered their expulsion of his tax-collectors by seizing and clubbing their chiefs, until their kahin Awf ibn Rabi'a prophesied him 'first to be stripped tomorrow' — the tribe stormed his tent and Ilba' ibn al-Harith speared him, kindling Imru' al-Qays's long war of vengeance on Asad {cite:kamil-ibn-al-athir p. 383-384}."
