label: { ar: "مقتل حجر أبي امرئ القيس", en: "Killing of Hujr, father of Imru' al-Qays", es: "Asesinato de Hujr, padre de Imru' al-Qays.", fr: "Meurtre de Hujr, père d'Imru' al-Qays", ur: "عمرو القیس کے والد حجر کا قتل", tr: "Hujr ibn Imru' al-Qays'ın öldürülmesi", id: "Pembunuhan Hujr ibn Imru' al-Qays" }
summary:
  ar: "مقتل حجر بن الحارث الكندي أبي امرئ القيس الشاعر؛ ملكه أبوه على بني أسد وغطفان وكنانة وله عليهم جائزة وإتاوة، فلما طردت بنو أسد جباته وضربوهم سار إليهم بجند من ربيعة وقيس وكنانة فأخذ سرواتهم وجعل يقتلهم بالعصا وأباح الأموال وحبس أشرافهم فيهم عبيد بن الأبرص، فلما صاروا على يوم منه تكهن كاهنهم عوف بن ربيعة فقال «من الملك الصلهب الغلاب غير المغلب، في الإبل كأنها الربرب، هذا دمه يتثعب، وهو غداً أول من يستلب»، فهجموا عليه في قبته فطعنه علباء بن الحارث الكاهلي وكان حجر قتل أباه، وانتهبوا هجانته ونساءه وأسلابه؛ فأشعل قتله حرب ثأر امرئ القيس على بني أسد {cite:kamil-ibn-al-athir p. 383-384}."
  en: "The killing of Hujr, father of Imru' al-Qays: Asad's tributary king answered their expulsion of his tax-collectors by seizing and clubbing their chiefs, until their kahin Awf ibn Rabi'a prophesied him 'first to be stripped tomorrow' — the tribe stormed his tent and Ilba' ibn al-Harith speared him, kindling Imru' al-Qays's long war of vengeance on Asad {cite:kamil-ibn-al-athir p. 383-384}."
  es: "El asesinato de Hujr, padre de Imru' al-Qays: el rey tributario de Asad respondió a la expulsión de sus recaudadores de impuestos apresando y golpeando a sus jefes, hasta que su kahin Awf ibn Rabi'a profetizó que sería \"el primero en ser despojado mañana\". La tribu asaltó su tienda e Ilba' ibn al-Harith lo atravesó con una lanza, encendiendo así la larga guerra de venganza de Imru' al-Qays contra Asad {cite:kamil-ibn-al-athir p. 383-384}."
  fr: "Le meurtre de Hujr, père d'Imru' al-Qays: le roi tributaire d'Asad répondit à l'expulsion de ses collecteurs d'impôts en s'emparant de leurs chefs et en les frappant à coups de bâton, jusqu'à ce que leur kahin Awf ibn Rabi'a prophétise qu'il serait « le premier à être dépouillé demain » — la tribu prit d'assaut sa tente et Ilba' ibn al-Harith le transperça d'une lance, déclenchant la longue guerre de vengeance d'Imru' al-Qays contre Asad {cite:kamil-ibn-al-athir p. 383-384}."
  ur: "عمرو القیس کے والد حجر کا قتل: اسد کے معاون بادشاہ نے اپنے ٹیکس وصول کرنے والوں کی بے دخلی کا جواب ان کے سرداروں کو پکڑ کر اور ان کو جمع کر کے دیا، یہاں تک کہ ان کے کاہین عوف بن ربیعہ نے اس کی پیشین گوئی کی کہ 'سب سے پہلے کل چھین لیا جائے گا' - قبیلہ نے اس کے خیمے پر حملہ کیا اور امام الباری کی قسم اس پر حملہ کر دی۔ القیس کی اسد پر انتقام کی طویل جنگ 383-384}۔"
  tr: "Şair İmru' el-Kays'ın babası Hucer ibn el-Harith el-Kindi'nin öldürülmesi; babası onu Beni Esad, Gatafan ve Kinanah kabilelerinin kralı yapmış ve onlardan ödül ve vergi almıştı. Beni Esad, vergi tahsildarlarını kovup dövdüğünde, Rabi'ah, Kays ve Kinanah'tan bir orduyla onlara karşı yürüdü, liderlerini yakaladı ve onları sopalarla öldürmeye başladı, mallarını yağmaladı ve aralarında Ubeyd ibn el-Abras'ın da bulunduğu soylularını hapse attı. Onlar ondan bir gün uzaktayken, kahinleri Avf ibn Rabi'ah bir kehanette bulundu ve şöyle dedi: \"Develer arasında, sanki ceylanlarmış gibi, kral, güçlü, galip, yenilmez olan kimdir? Akan kanı işte onun kanıdır ve yarın ilk yağmalanan o olacaktır.\" Böylece çadırında ona saldırdılar ve Alba' ibn al-Harith al-Kahili onu bıçakladı; Hujr ise babasını öldürmüştü ve develerini, kadınlarını ve ganimetlerini yağmaladılar. Bu ölüm, İmru' al-Qays'ın Beni Asad'a karşı intikam savaşı başlatmasına neden oldu. {cite:kamil-ibn-al-athir s. 383-384}"
  id: "Pembunuhan Hujr ibn al-Harith al-Kindi, ayah dari Imru' al-Qays sang penyair; ayahnya menjadikannya raja atas Banu Asad, Ghatafan, dan Kinanah, dan ia mendapat hadiah dan upeti dari mereka. Ketika Banu Asad mengusir para pemungut pajaknya dan memukuli mereka, ia menyerang mereka dengan pasukan dari Rabi'ah, Qays, dan Kinanah, dan menangkap para pemimpin mereka dan mulai membunuh mereka dengan tongkat, dan ia menjarah kekayaan mereka dan memenjarakan para bangsawan mereka, di antaranya Ubayd ibn al-Abras. Ketika mereka tinggal sehari lagi darinya, peramal mereka Awf ibn Rabi'ah membuat ramalan dan berkata, \"Siapakah raja, yang kuat, yang berjaya, yang tak terkalahkan, di antara unta-unta seolah-olah mereka adalah kijang? Inilah darahnya yang mengalir, dan besok dialah yang pertama kali akan dijarah.\" Maka mereka menyerangnya di tendanya, dan Alba' ibn al-Harith al-Kahili menikamnya, dan Hujr telah membunuh ayahnya, dan mereka menjarah unta-unta, wanita-wanita, dan harta rampasannya. Maka pembunuhannya memicu perang balas dendam Imru' al-Qays terhadap Banu Asad. {cite:kamil-ibn-al-athir p. 383-384}."
