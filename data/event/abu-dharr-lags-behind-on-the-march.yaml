label: { ar: "تخلف أبي ذر ولحاقه ماشياً", en: "Abu Dharr lags behind and follows on foot" }
summary:
  ar: "جعل يتخلف عن النبي الرجل بعد الرجل، فيقول دعوه، فإن يكن فيه خير فسيلحقه الله بكم؛ حتى قيل تخلف أبو ذر وأبطأ به بعيره، فأخذ متاعه على ظهره وخرج يتبع أثر النبي ماشياً، فلما رآه ناظر قال النبي: كن أبا ذر. فلما تأملوه كان هو، فدعا له النبي وقال إنه يمشي وحده ويموت وحده ويبعث وحده."
  en: "Man after man fell behind the Prophet on the march, and he would say: leave him; if there is good in him, God will bring him up to you. Then Abu Dharr was reported to have fallen behind, his camel slowing him, so he took his baggage on his back and set out on foot following the Prophet's tracks. When a watcher saw him the Prophet said: let it be Abu Dharr; and it was he. The Prophet prayed for him and said that he walks alone, dies alone and is raised alone."
