id: event/abu-dharr-lags-behind-on-the-march
class: event
kind: other
label: { ar: "تخلف أبي ذر ولحاقه ماشياً", en: "Abu Dharr lags behind and follows on foot", fr: "Abu Dharr reste en arrière puis suit à pied", es: "Abu Dharr se queda atrás y lo sigue a pie.", ur: "ابوذر پیچھے رہ گئے اور پیدل چل پڑے", tr: "Ebu Zer geride kaldı ve yürüyerek yetişti.", id: "Abu Dharr tertinggal di belakang dan menyusul dengan berjalan kaki." }
summary:
  ar: "جعل يتخلف عن النبي الرجل بعد الرجل، فيقول دعوه، فإن يكن فيه خير فسيلحقه الله بكم؛ حتى قيل تخلف أبو ذر وأبطأ به بعيره، فأخذ متاعه على ظهره وخرج يتبع أثر النبي ماشياً، فلما رآه ناظر قال النبي: كن أبا ذر. فلما تأملوه كان هو، فدعا له النبي وقال إنه يمشي وحده ويموت وحده ويبعث وحده."
  en: "Man after man fell behind the Prophet on the march, and he would say: leave him; if there is good in him, God will bring him up to you. Then Abu Dharr was reported to have fallen behind, his camel slowing him, so he took his baggage on his back and set out on foot following the Prophet's tracks. When a watcher saw him the Prophet said: let it be Abu Dharr; and it was he. The Prophet prayed for him and said that he walks alone, dies alone and is raised alone."
  fr: "Pendant la marche, des hommes restaient l’un après l’autre en arrière du Prophète, qui disait : laissez-le ; s’il y a du bien en lui, Dieu vous le ramènera. On signala ensuite qu’Abu Dharr était resté en arrière, ralenti par son chameau ; il prit ses bagages sur le dos et suivit à pied les traces du Prophète. Lorsqu’un guetteur l’aperçut, le Prophète dit : que ce soit Abu Dharr ; c’était bien lui. Le Prophète pria pour lui et dit qu’il marche seul, meurt seul et sera ressuscité seul."
  es: "Durante la marcha, muchos hombres se quedaban atrás del Profeta, y él les decía: «Déjenlo; si hay bondad en él, Dios lo traerá ante ustedes». Se cuenta que Abu Dharr se había quedado rezagado, pues su camello lo ralentizaba, así que cargó su equipaje a la espalda y continuó a pie siguiendo las huellas del Profeta. Cuando un vigilante lo vio, el Profeta dijo: «Que sea Abu Dharr»; y así fue. El Profeta oró por él y dijo que camina solo, muere solo y resucita solo."
  ur: "ایک آدمی کے بعد آدمی مارچ میں نبی کے پیچھے پڑا، اور آپ کہیں گے: اسے چھوڑ دو۔ اگر اس میں اچھائی ہے تو خدا اسے تمہارے پاس لے آئے گا۔ پھر ابوذر کے پیچھے گرنے کی خبر ملی، ان کے اونٹ نے انہیں سست کر دیا، تو وہ اپنا سامان اپنی پیٹھ پر لے کر نبی کے راستے پر چل پڑے۔ جب ایک نگہبان نے اسے دیکھا تو نبی نے فرمایا: ابوذر ہو جاؤ۔ اور وہ تھا. نبی نے اس کے لیے دعا فرمائی اور فرمایا کہ وہ اکیلا چلتا ہے، اکیلا ہی مرتا ہے اور اکیلا اٹھایا جاتا ہے۔"
  tr: "Peygamberin arkasından birer birer adamlar geride kalırdı ve o da, \"Onu bırakın. Eğer onda bir hayır varsa, Allah onu size getirecektir\" derdi. Rivayet olunur ki, Ebu Zer devesinin yavaş olması yüzünden geride kalmıştı; bu yüzden eşyalarını sırtına alıp Peygamberin izini yaya olarak takip etmeye başladı. Peygamber onu görünce, \"Bu Ebu Zer olmalı\" dedi. Yakından baktıklarında, gerçekten de Ebu Zer'di. Peygamber onun için dua etti ve şöyle buyurdu: \"Yalnız yürüyecek, yalnız ölecek ve yalnız dirilecek.\""
  id: "Satu demi satu orang tertinggal di belakang Nabi, dan beliau berkata, \"Biarkan saja dia. Jika ada kebaikan dalam dirinya, Allah akan mempertemukannya denganmu.\" Dikatakan bahwa Abu Dzar tertinggal karena untanya lambat, jadi dia membawa barang-barangnya di punggungnya dan berjalan kaki mengikuti jejak Nabi. Ketika Nabi melihatnya, beliau berkata, \"Pasti itu Abu Dzar.\" Ketika mereka melihat lebih dekat, ternyata memang dia. Nabi mendoakannya dan berkata, \"Dia akan berjalan sendirian, mati sendirian, dan dibangkitkan sendirian.\""
