label: { ar: "بعثة أسد الدين شيركوه الأولى إلى مصر" }
summary:
  ar: "في سنة اثنتين وستين جهز السلطان نور الدين الأمير أسد الدين شيركوه في ألفي فارس إلى مصر فنزل بالجيزة وحاصر مصر نحو شهرين فاستنجد صاحبها بالفرنج فدخلوا من دمياط لنجدته فرحل أسد الدين إلى الصعيد ثم وقعت بينه وبين المصريين حرب انتصر فيها على قلة عسكره وكثرة عدوه وقتل من الفرنج ألوفاً ثم جبى أسد الدين خراج الصعيد وقصد الفرنج الإسكندرية وقد أخذها صلاح الدين يوسف بن أيوب وهو ابن أخ أسد الدين فحاصروها أربعة شهر فتوجه أسد الدين إليهم فرحلوا عنها فرجع إلى الشام {cite:tarikh-khulafa-minhaj-1434 p. 679-680}."
  en: "In 562 Nur al-Din sent Asad al-Din Shirkuh with two thousand horse to Egypt; camped at Giza, besieging two months, till its lord called the Franks who came through Damietta. Shirkuh withdrew to the Sa'id, beat a larger army killing Frankish thousands, levied the Sa'id's kharaj — while the Franks besieged Alexandria, taken by his nephew Salah al-Din Yusuf ibn Ayyub, four months till Shirkuh came and they withdrew to Syria {cite:tarikh-khulafa-minhaj-1434 p. 679-680}."
