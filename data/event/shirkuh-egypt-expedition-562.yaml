label: { ar: "بعثة أسد الدين شيركوه الأولى إلى مصر", en: "Asad al-Din Shirkuh's first expedition to Egypt", es: "La primera expedición de Asad al-Din Shirkuh a Egipto.", fr: "La première expédition d'Asad al-Din Shirkuh en Égypte" }
summary:
  ar: "في سنة اثنتين وستين جهز السلطان نور الدين الأمير أسد الدين شيركوه في ألفي فارس إلى مصر فنزل بالجيزة وحاصر مصر نحو شهرين فاستنجد صاحبها بالفرنج فدخلوا من دمياط لنجدته فرحل أسد الدين إلى الصعيد ثم وقعت بينه وبين المصريين حرب انتصر فيها على قلة عسكره وكثرة عدوه وقتل من الفرنج ألوفاً ثم جبى أسد الدين خراج الصعيد وقصد الفرنج الإسكندرية وقد أخذها صلاح الدين يوسف بن أيوب وهو ابن أخ أسد الدين فحاصروها أربعة شهر فتوجه أسد الدين إليهم فرحلوا عنها فرجع إلى الشام {cite:tarikh-khulafa-minhaj-1434 p. 679-680}."
  en: "In 562 Nur al-Din sent Asad al-Din Shirkuh with two thousand horse to Egypt; camped at Giza, besieging two months, till its lord called the Franks who came through Damietta. Shirkuh withdrew to the Sa'id, beat a larger army killing Frankish thousands, levied the Sa'id's kharaj — while the Franks besieged Alexandria, taken by his nephew Salah al-Din Yusuf ibn Ayyub, four months till Shirkuh came and they withdrew to Syria {cite:tarikh-khulafa-minhaj-1434 p. 679-680}."
  es: "En 562, Nur al-Din envió a Asad al-Din Shirkuh con dos mil jinetes a Egipto; acamparon en Giza, sitiándola durante dos meses, hasta que su señor llamó a los francos que llegaron a través de Damietta. Shirkuh se retiró a Sa'id, derrotó a un ejército mayor matando a miles de francos, y recaudó el kharaj de Sa'id, mientras que los francos sitiaron Alejandría, tomada por su sobrino Salah al-Din Yusuf ibn Ayyub, durante cuatro meses hasta que Shirkuh regresó y se retiraron a Siria {cite:tarikh-khulafa-minhaj-1434 p. 679-680}."
  fr: "En 562, Nur al-Din envoya Asad al-Din Shirkuh avec deux mille cavaliers en Égypte. Ils campèrent à Gizeh et assiégèrent la ville pendant deux mois, jusqu'à ce que son seigneur appelle les Francs, qui arrivèrent par Damiette. Shirkuh se retira contre les Saïd, vainquit une armée franque plus importante et leva le kharaj des Saïd. Pendant ce temps, les Francs assiégeaient Alexandrie, prise par son neveu Salah al-Din Yusuf ibn Ayyub, pendant quatre mois, jusqu'à l'arrivée de Shirkuh. Ils se retirèrent alors en Syrie (voir: Tarikh-Khulafa-Minhaj-1434, p. 679-680)."
