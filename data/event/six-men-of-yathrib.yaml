id: event/six-men-of-yathrib
class: event
kind: other
label: { ar: "ستة نفر من أهل يثرب يسلمون في منى", en: "Six men of Yathrib embrace Islam at Mina", es: "Seis hombres de Yathrib se convierten al Islam en Mina", fr: "Six hommes de Yathrib se convertissent à l'islam à Mina", ur: "یثرب کے چھ آدمیوں نے منیٰ میں اسلام قبول کیا۔", tr: "Yathrib'den altı adam Mina'da İslamiyet'i kabul etti.", id: "Enam pria dari Yathrib memeluk Islam di Mina." }
summary:
  ar: "في موسم الحج من السنة الحادية عشرة من البعثة لقي النبي ستة نفر من شباب الخزرج عند عقبة منى، فشرح لهم الإسلام وتلا عليهم القرآن، فأسلموا وقالوا إنهم سيدعون قومهم، لعل الله يجمعهم به."
  en: "At the pilgrim season of the eleventh year of the mission the Prophet met six young men of the Khazraj at the Aqaba of Mina; he explained Islam and recited the Qur'an to them, they embraced it, and they promised to call their people, hoping God would unite them."
  es: "En la temporada de peregrinación del undécimo año de la misión, el Profeta se reunió con seis jóvenes de Khazraj en Aqaba, Mina; les explicó el Islam y les recitó el Corán, ellos lo aceptaron y prometieron llamar a su pueblo, con la esperanza de que Dios los uniera."
  fr: "Lors de la saison du pèlerinage de la onzième année de la mission, le Prophète rencontra six jeunes hommes des Khazraj à Aqaba de Mina; il leur expliqua l'islam et leur récita le Coran, ils l'embrassèrent et promirent d'appeler leur peuple, espérant que Dieu les réunirait."
  ur: "مشن کے گیارہویں سال کے حج کے موسم میں نبی نے منیٰ کے عقبہ میں خزرج کے چھ جوانوں سے ملاقات کی۔ اس نے اسلام کی وضاحت کی اور انہیں قرآن سنایا، انہوں نے اسے قبول کیا، اور انہوں نے اپنے لوگوں کو بلانے کا وعدہ کیا، اس امید پر کہ خدا انہیں متحد کرے گا۔"
  tr: "Peygamberimiz, tebliğ döneminin on birinci yılındaki Hac mevsiminde, Akabe Mina'da Hazrec kabilesinden altı gençle karşılaştı. Onlara İslam'ı anlattı ve Kur'an okudu. Bunun üzerine gençler İslam'ı kabul ettiler ve kendi kavimlerini de çağıracaklarını, böylece Allah'ın onları da kendisiyle bir araya getireceğini söylediler."
  id: "Pada musim haji tahun kesebelas dakwah, Nabi bertemu dengan enam pemuda dari suku Khazraj di Aqaba Mina. Beliau menjelaskan Islam kepada mereka dan membacakan Al-Qur'an kepada mereka, sehingga mereka memeluk Islam dan berkata bahwa mereka akan mengajak kaum mereka, agar Allah dapat mempersatukan mereka dengan beliau."
