id: event/al-hajjaj-dotting-project
class: event
kind: other
label:
  ar: مشروع الحجاج بأمر عبد الملك في إعجام المصحف
  en: Al-Hajjaj's project, ordered by Abd al-Malik, of dotting the codex
  ur: عبد الملک کے حکم سے حجاج کا مصحف کے اعجام کا منصوبہ
  es: "El proyecto de Al-Hajjaj, ordenado por Abd al-Malik, de puntear el códice"
  fr: "Le projet d'Al-Hajjaj, commandé par Abd al-Malik, de parsemer le codex"
  tr: "Hajjaj'ın Abdülmalik'in emriyle Kur'an'a noktalama işaretleri ekleme projesi."
  id: "Proyek Hajjaj, yang diperintahkan oleh Abd al-Malik, untuk menambahkan tanda diakritik pada Al-Qur'an."
summary:
  ar: "رأى عبد الملك بن مروان أن اللبس في قراءة المصاحف غير المعجمة يشق على الناس مع اختلاط العرب بالعجم، فأمر الحجاج أن يُعنى بالأمر، فندب نصر بن عاصم الليثي ويحيى بن يعمر العدواني، تلميذي أبي الأسود، فأعجما المصحف ونقطا الحروف المتشابهة بما لا يزيد على ثلاث نقاط في الحرف {cite:manahil-irfan-sabt p. 328} {cite:manahil-irfan-sabt p. 329}."
  en: "Abd al-Malik ibn Marwan saw that the confusion in reading undotted codices burdened people as Arabs mixed with non-Arabs, and ordered al-Hajjaj to take the matter in hand; he commissioned Nasr ibn Asim al-Laythi and Yahya ibn Ya'mar al-Adwani, students of Abu al-Aswad, who dotted the codex and marked the similar letters with no more than three dots on any letter {cite:manahil-irfan-sabt p. 328} {cite:manahil-irfan-sabt p. 329}."
  ur: "عبد الملک بن مروان نے دیکھا کہ بغیر نقطوں کے مصاحف کے پڑھنے میں اشتباہ، عرب و عجم کے اختلاط کے ساتھ، لوگوں پر شاق ہے؛ انھوں نے حجاج کو حکم دیا کہ اس کی فکر کرے، اس نے ابو الاسود کے شاگردوں نصر بن عاصم لیثی اور یحییٰ بن یعمر عدوانی کو مقرر کیا، جنھوں نے مصحف کا اعجام کیا اور مشابہ حروف پر کسی حرف میں تین سے زیادہ نقطے نہ لگائے {cite:manahil-irfan-sabt p. 328} {cite:manahil-irfan-sabt p. 329}۔"
  es: "Abd al-Malik ibn Marwan vio que la confusión en la lectura de los códices sin puntos dificultaba la lectura a la gente, ya que los árabes se mezclaban con los no árabes, y ordenó a al-Hajjaj que se hiciera cargo del asunto; encargó a Nasr ibn Asim al-Laythi y a Yahya ibn Ya'mar al-Adwani, estudiantes de Abu al-Aswad, que puntuaran el códice y marcaran las letras similares con no más de tres puntos en cada letra {cite:manahil-irfan-sabt p. 328} {cite:manahil-irfan-sabt p. 329}."
  fr: "Abd al-Malik ibn Marwan constata que la confusion dans la lecture des codex non pointés pesait sur les gens, car les Arabes se mêlaient aux non-Arabes, et ordonna à al-Hajjaj de prendre l'affaire en main; il chargea Nasr ibn Asim al-Laythi et Yahya ibn Ya'mar al-Adwani, élèves d'Abu al-Aswad, de pointer le codex et de marquer les lettres similaires avec au maximum trois points sur chaque lettre {cite:manahil-irfan-sabt p. 328} {cite:manahil-irfan-sabt p. 329}."
  tr: "Abdul Malik bin Mervan, noktalama işareti olmayan Kur'an'ların okunmasında Araplar ve Arap olmayanların karışması nedeniyle yaşanan karışıklığı görünce, bu meseleyle ilgilenmesi için El-Haccac'ı görevlendirdi. Bunun üzerine El-Haccac, Ebu el-Esved'in öğrencileri Nasr bin Asim el-Laythi ve Yahya bin Ya'mar el-Adwani'yi görevlendirdi ve onlar Kur'an'ı noktalayarak, harflerdeki benzer harfleri üçten fazla nokta olmadan işaretlediler. {cite:manahil-irfan-sabt s. 328} {cite:manahil-irfan-sabt s. 329}"
  id: "Abdul Malik bin Marwan melihat bahwa kebingungan dalam membaca Al-Qur'an yang tidak diberi tanda baca menyulitkan orang-orang karena adanya percampuran antara orang Arab dan non-Arab, sehingga ia memerintahkan Al-Hajjaj untuk menangani masalah tersebut. Maka ia menunjuk Nasr bin Asim Al-Laythi dan Yahya bin Ya’mar Al-Adwani, murid-murid Abu Al-Aswad, dan mereka memberi tanda baca pada Al-Qur'an dan memberi tanda baca pada huruf-huruf yang serupa dengan tidak lebih dari tiga titik dalam setiap hurufnya. {cite:manahil-irfan-sabt p. 328} {cite:manahil-irfan-sabt p. 329}."
