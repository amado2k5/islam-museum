label: { ar: "مقتل الحارث بن سريج بخراسان", en: "The killing of al-Harith ibn Surayj in Khurasan", es: "El asesinato de al-Harith ibn Surayj en Khurasan", fr: "Le meurtre d'al-Harith ibn Surayj au Khurasan", ur: "خراسان میں حارث بن سریج کا قتل", tr: "Horasan'da Hâris ibn Süreyc'in öldürülmesi", id: "Pembunuhan Al-Harith ibn Surayj di Khorasan" }
summary:
  ar: "في سنة ثمان وعشرين ومائة قُتل الحارث بن سريج بخراسان {cite:tabari-tarikh-abu-al-fadl j.7 p.330}، وذكر الطبري أن الكرماني هو الذي قتله {cite:tabari-tarikh-abu-al-fadl j.7 p.368}."
  en: "In the year 128 al-Harith ibn Surayj was killed in Khurasan {cite:tabari-tarikh-abu-al-fadl j.7 p.330}, and al-Tabari reports that al-Kirmani was the one who killed him {cite:tabari-tarikh-abu-al-fadl j.7 p.368}."
  es: "En el año 128, al-Harith ibn Surayj fue asesinado en Jorasán {cite:tabari-tarikh-abu-al-fadl j.7 p.330}, y al-Tabari informa que al-Kirmani fue quien lo mató {cite:tabari-tarikh-abu-al-fadl j.7 p.368}."
  fr: "En l'an 128, al-Harith ibn Surayj fut tué au Khorasan {cite:tabari-tarikh-abu-al-fadl j.7 p.330}, et al-Tabari rapporte qu'al-Kirmani fut celui qui le tua {cite:tabari-tarikh-abu-al-fadl j.7 p.368}."
  ur: "سنہ 128 میں حارث بن سریج خراسان میں مارا گیا {حوالہ: طبری-تاریخ-ابو الفضل ج.7 ص330}، اور الطبری نے بیان کیا ہے کہ الکرمانی نے اسے قتل کیا تھا۔"
  tr: "128 yılında Al-Harith bin Surayj Horasan'da öldürüldü {cite:tabari-tarikh-abu-al-fadl j.7 s.330} ve Al-Tabari, onu öldürenin Al-Kirmani olduğunu belirtti {cite:tabari-tarikh-abu-al-fadl j.7 s.368}."
  id: "Pada tahun seratus dua puluh delapan, Al-Harith bin Surayj terbunuh di Khorasan {cite:tabari-tarikh-abu-al-fadl j.7 p.330}, dan Al-Tabari menyebutkan bahwa Al-Kirmani adalah orang yang membunuhnya {cite:tabari-tarikh-abu-al-fadl j.7 p.368}."
