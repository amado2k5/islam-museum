summary:
  ar: "أدرك الكونت دي الكوديت حاكم وهران أن استرجاع العثمانيين لتلمسان يهدد الوجود الأسباني تهديداً خطيراً، فأعد اثني عشر ألف مقاتل وخرج على رأسها لمهاجمة مستغانم — قاعدة العثمانيين للهجوم على وهران — راجياً أن يجعلها قاعدة للهجوم على الجزائر؛ فباءت محاولته بالفشل وتكبدت القوات الأسبانية في ذي القعدة ٩٦٥هـ/أغسطس ١٥٥٨م خسائر فادحة وكان الكوديت من بين القتلى {cite:dawlat-uthmaniyya-salabi p. 246}."
  en: "Seeing the Ottoman recovery of Tlemcen as a mortal threat, the Count of Alcaudete led twelve thousand men against Mostaganem — the Ottoman base against Oran — hoping to make it his own base against Algiers; the attempt failed, the Spanish force suffered heavy losses in Dhu'l-Qa'da 965/August 1558, and the count himself was among the dead {cite:dawlat-uthmaniyya-salabi p. 246}."
