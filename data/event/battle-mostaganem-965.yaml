label: { ar: "معركة مستغانم ⁦(٩٦٥هـ/١٥٥٨م)⁩", en: "Battle of Mostaganem (965/1558)", fr: "La bataille de Mostaganem (965/1558)", es: "Batalla de Mostaganem (965/1558)", ur: "مستگنیم کی جنگ (965/1558)", tr: "Mostaganem Muharebesi (H.965/MS 1558)", id: "Pertempuran Mostaganem (965 H/1558 M)" }
summary:
  ar: "أدرك الكونت دي الكوديت حاكم وهران أن استرجاع العثمانيين لتلمسان يهدد الوجود الأسباني تهديداً خطيراً، فأعد اثني عشر ألف مقاتل وخرج على رأسها لمهاجمة مستغانم — قاعدة العثمانيين للهجوم على وهران — راجياً أن يجعلها قاعدة للهجوم على الجزائر؛ فباءت محاولته بالفشل وتكبدت القوات الأسبانية في ذي القعدة ٩٦٥هـ/أغسطس ١٥٥٨م خسائر فادحة وكان الكوديت من بين القتلى {cite:dawlat-uthmaniyya-salabi p. 246}."
  en: "Seeing the Ottoman recovery of Tlemcen as a mortal threat, the Count of Alcaudete led twelve thousand men against Mostaganem — the Ottoman base against Oran — hoping to make it his own base against Algiers; the attempt failed, the Spanish force suffered heavy losses in Dhu'l-Qa'da 965/August 1558, and the count himself was among the dead {cite:dawlat-uthmaniyya-salabi p. 246}."
  fr: "Voyant dans la reprise ottomane de Tlemcen une menace mortelle, le comte d'Alcaudete mena douze mille hommes contre Mostaganem, la base ottomane face à Oran, espérant en faire sa propre base contre Alger ; la tentative échoua, la force espagnole subit de lourdes pertes en Dhu'l-Qa'da 965/août 1558, et le comte lui-même fut parmi les morts {cite:dawlat-uthmaniyya-salabi p. 246}."
  es: "Al ver la recuperación otomana de Tlemcen como una amenaza mortal, el conde de Alcaudete dirigió a doce mil hombres contra Mostaganem —la base otomana contra Orán— con la esperanza de convertirla en su propia base contra Argel; el intento fracasó, las fuerzas españolas sufrieron grandes pérdidas en Dhu'l-Qa'da 965/agosto de 1558, y el propio conde estuvo entre los muertos {cite:dawlat-uthmaniyya-salabi p. 246}."
  ur: "Tlemcen کی عثمانی بازیابی کو ایک جان لیوا خطرے کے طور پر دیکھ کر، Alcaudete کے کاؤنٹ نے بارہ ہزار آدمیوں کو Mostaganem کے خلاف لے لیا - اوران کے خلاف عثمانی اڈہ - اس امید میں کہ وہ اسے الجزائر کے خلاف اپنا اڈہ بنائے۔ یہ کوشش ناکام ہوئی، ذوالقعدہ 965/اگست 1558 میں ہسپانوی فوج کو بھاری نقصان اٹھانا پڑا، اور خود بھی مرنے والوں میں شمار ہوتا تھا۔ 246}۔"
  tr: "Oran valisi Kont Alcudet, Osmanlıların Tlemcen'i geri almasının İspanyol varlığı için ciddi bir tehdit oluşturduğunu fark etti. On iki bin savaşçı hazırladı ve Oran'a saldırmak için Osmanlı üssü olan Mostaganem'e saldırmak üzere onların başında yola çıktı; amacı burayı Cezayir'e saldırmak için bir üs haline getirmekti. Girişimi başarısız oldu ve İspanyol kuvvetleri Hicri 965 Zilhicce'de/Miladi 1558 Ağustos'unda ağır kayıplar verdi. Alcudet de ölenler arasındaydı. {cite:dawlat-uthmaniyya-salabi s. 246}"
  id: "Count de Alcudet, gubernur Oran, menyadari bahwa perebutan kembali Tlemcen oleh Ottoman merupakan ancaman serius bagi kehadiran Spanyol. Ia mempersiapkan dua belas ribu pejuang dan memimpin mereka untuk menyerang Mostaganem—pangkalan Ottoman untuk menyerang Oran—dengan harapan menjadikannya pangkalan untuk menyerang Aljir. Upayanya gagal, dan pasukan Spanyol menderita kerugian besar pada Dzul Qi'dah 965 H/Agustus 1558 M. Alcudet termasuk di antara yang tewas. {cite:dawlat-uthmaniyya-salabi hlm. 246}"
