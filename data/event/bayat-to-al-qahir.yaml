label: { ar: "البيعة لمحمد القاهر بالله", en: "Bay'a to Muhammad al-Qahir billah" }
summary:
  ar: "في سنة عشرين وثلاثمائة بويع محمد القاهر بالله بالخلافة يوم الخميس لليلتين بقيتا من شوال، بعد نقله من دار عبد الله بن طاهر إلى دار الخلافة، ولُقّب بالقاهر بالله {cite:tabari-tarikh-abu-al-fadl j.11 p.154} {cite:tabari-tarikh-abu-al-fadl j.11 p.161}، وعند السيوطي لقب به أول مرة في سنة سبع عشرة لما بايعه مؤنس والأمراء بعد خلع المقتدر ليلة أربع عشر المحرم فجلس يوم الأحد ثم رد المقتدر ثالث يوم، وبويع ثانية لما قتل المقتدر سنة عشرين بعد أن أبى ابن المكتفي وقال عمي أحق به {cite:tarikh-khulafa-minhaj-1434 p. 591,597}."
  en: "In 320 AH Muhammad al-Qahir billah was pledged to the caliphate on Thursday, two nights before the end of Shawwal, after being moved from the house of Abd Allah ibn Tahir to the house of the caliphate, and he was given the laqab al-Qahir billah {cite:tabari-tarikh-abu-al-fadl j.11 p.154} {cite:tabari-tarikh-abu-al-fadl j.11 p.161}. According to al-Suyuti, he was first given that laqab in 317 AH, when Mu'nis and the commanders pledged to him after the deposition of al-Muqtadir, on the night of the fourteenth of Muharram; he sat on Sunday, but al-Muqtadir was restored on the third day. He was pledged a second time when al-Muqtadir was killed in 320, after the son of al-Muktafi refused, saying: my uncle has more right to it {cite:tarikh-khulafa-minhaj-1434 p. 591,597}."
