label: { ar: "البيعة لمحمد القاهر بالله", en: "Bay'a to Muhammad al-Qahir billah", fr: "La bay'a de Muhammad al-Qahir billah", es: "Bay'a a Muhammad al-Qahir billah", ur: "بیع محمد القاہر باللہ", tr: "Muhammed el-Kahir Billah'a biat", id: "Kesetiaan kepada Muhammad al-Qahir Billah" }
summary:
  ar: "في سنة عشرين وثلاثمائة بويع محمد القاهر بالله بالخلافة يوم الخميس لليلتين بقيتا من شوال، بعد نقله من دار عبد الله بن طاهر إلى دار الخلافة، ولُقّب بالقاهر بالله {cite:tabari-tarikh-abu-al-fadl j.11 p.154} {cite:tabari-tarikh-abu-al-fadl j.11 p.161}، وعند السيوطي لقب به أول مرة في سنة سبع عشرة لما بايعه مؤنس والأمراء بعد خلع المقتدر ليلة أربع عشر المحرم فجلس يوم الأحد ثم رد المقتدر ثالث يوم، وبويع ثانية لما قتل المقتدر سنة عشرين بعد أن أبى ابن المكتفي وقال عمي أحق به {cite:tarikh-khulafa-minhaj-1434 p. 591,597}."
  en: "In 320 AH Muhammad al-Qahir billah was pledged to the caliphate on Thursday, two nights before the end of Shawwal, after being moved from the house of Abd Allah ibn Tahir to the house of the caliphate, and he was given the laqab al-Qahir billah {cite:tabari-tarikh-abu-al-fadl j.11 p.154} {cite:tabari-tarikh-abu-al-fadl j.11 p.161}. According to al-Suyuti, he was first given that laqab in 317 AH, when Mu'nis and the commanders pledged to him after the deposition of al-Muqtadir, on the night of the fourteenth of Muharram; he sat on Sunday, but al-Muqtadir was restored on the third day. He was pledged a second time when al-Muqtadir was killed in 320, after the son of al-Muktafi refused, saying: my uncle has more right to it {cite:tarikh-khulafa-minhaj-1434 p. 591,597}."
  fr: "En 320 H, Muhammad al-Qahir billah reçut l'allégeance au califat le jeudi, deux nuits avant la fin de Shawwal, après avoir été transféré de la maison d'Abd Allah ibn Tahir à la maison du califat, et il reçut le laqab d'al-Qahir billah {cite:tabari-tarikh-abu-al-fadl j.11 p.154} {cite:tabari-tarikh-abu-al-fadl j.11 p.161}. Selon al-Suyuti, il reçut d'abord ce laqab en 317 H, quand Mu'nis et les commandants lui prêtèrent allégeance après la déposition d'al-Muqtadir, la nuit du quatorze Muharram ; il siégea le dimanche, mais al-Muqtadir fut rétabli le troisième jour. Il reçut l'allégeance une seconde fois quand al-Muqtadir fut tué en 320, après que le fils d'al-Muktafi eut refusé en disant : mon oncle y a plus de droit {cite:tarikh-khulafa-minhaj-1434 p. 591,597}."
  es: "En el año 320 AH, Muhammad al-Qahir billah fue jurado al califato un jueves, dos noches antes del final de Shawwal, después de ser trasladado de la casa de Abd Allah ibn Tahir a la casa del califato, y se le dio el laqab al-Qahir billah {cite:tabari-tarikh-abu-al-fadl j.11 p.154} {cite:tabari-tarikh-abu-al-fadl j.11 p.161}. Según al-Suyuti, se le dio ese laqab por primera vez en el año 317 AH, cuando los Mu'nis y los comandantes lo juraron después de la deposición de al-Muqtadir, en la noche del catorce de Muharram; se sentó el domingo, pero al-Muqtadir fue restituido al tercer día. Se le juró lealtad por segunda vez cuando al-Muqtadir fue asesinado en 320, después de que el hijo de al-Muktafi se negara, diciendo: mi tío tiene más derecho a ello {cite:tarikh-khulafa-minhaj-1434 p. 591,597}."
  ur: "320 ہجری میں محمد القاہر باللہ کو عبد اللہ ابن طاہر کے گھر سے خلیفہ کے گھر منتقل کرنے کے بعد شوال کے اختتام سے دو رات قبل جمعرات کو خلافت کی بیعت کی گئی اور انہیں لقب القاہر باللہ عطا کیا گیا۔ {حوالہ: طبری-تاریخ-ابو الفضل ج11 ص161}۔ سیوطی کے مطابق، انہیں یہ لقب سب سے پہلے 317 ہجری میں دیا گیا تھا، جب مقتدیر کی معزولی کے بعد، چودہویں محرم کی رات معنیس اور کمانڈروں نے اس سے بیعت کی تھی۔ وہ اتوار کو بیٹھا لیکن مقتدیر تیسرے دن بحال ہو گیا۔ اس نے دوسری بار بیعت کی جب المقتدیر 320 میں مارا گیا، جب المکتفی کے بیٹے نے انکار کر دیا اور کہا: میرے چچا کا اس پر زیادہ حق ہے۔ 591,597}۔"
  tr: "Hicri 320 yılında, Muhammed el-Kahir Billa, Şevval ayının bitimine iki gece kala, Perşembe günü, Abdullah ibn Tahir'in evinden Halifelik Sarayı'na alındıktan sonra halife olarak biat etti. Ona el-Kahir Billa unvanı verildi. {Kaynak: Tabari-tarikh-ebu-el-fadl c.11 s.154} {Kaynak: Tabari-tarikh-ebu-el-fadl c.11 s.161}. El-Suyuti'ye göre, bu unvanı ilk kez Hicri 317 yılında, Muharrem ayının on dördüncü gecesi el-Muktadir'in görevden alınmasının ardından Mu'nis ve prensler ona biat ettikten sonra aldı. Pazar günü oturdu, ardından el-Muktadir üçüncü gün geri döndü. İbn el-Muktafi'nin \"Amcam buna daha layıktır\" diyerek reddetmesi üzerine, el-Muktadir'in Hicri 320 yılında öldürülmesi üzerine kendisine ikinci kez biat yemini ettirilmiştir. {cite:tarikh-khulafa-minhaj-1434 s. 591,597}"
  id: "Pada tahun 320 H, Muhammad al-Qahir Billah disumpah setia sebagai Khalifah pada hari Kamis, dua malam sebelum akhir bulan Syawal, setelah ia dipindahkan dari rumah Abdullah ibn Tahir ke Istana Kekhalifahan. Ia diberi gelar al-Qahir Billah. {cite:tabari-tarikh-abu-al-fadl j.11 p.154} {cite:tabari-tarikh-abu-al-fadl j.11 p.161}. Menurut al-Suyuti, ia diberi gelar ini untuk pertama kalinya pada tahun 317 H ketika kaum Mu'ni dan para pangeran menyumpah setia kepadanya setelah pencopotan al-Muqtadir pada malam tanggal empat belas Muharram. Ia duduk pada hari Minggu, kemudian al-Muqtadir kembali pada hari ketiga. Ia menerima sumpah setia untuk kedua kalinya ketika al-Muqtadir terbunuh pada tahun 320 H setelah Ibnu al-Muktafi menolak dan berkata, “Pamanku lebih berhak menerimanya.” {cite:tarikh-khulafa-minhaj-1434 p. 591,597}."
