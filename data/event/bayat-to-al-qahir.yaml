label: { ar: "البيعة لمحمد القاهر بالله" }
summary:
  ar: "في سنة عشرين وثلاثمائة بويع محمد القاهر بالله بالخلافة يوم الخميس لليلتين بقيتا من شوال، بعد نقله من دار عبد الله بن طاهر إلى دار الخلافة، ولُقّب بالقاهر بالله {cite:tabari-tarikh-abu-al-fadl j.11 p.154} {cite:tabari-tarikh-abu-al-fadl j.11 p.161}، وعند السيوطي لقب به أول مرة في سنة سبع عشرة لما بايعه مؤنس والأمراء بعد خلع المقتدر ليلة أربع عشر المحرم فجلس يوم الأحد ثم رد المقتدر ثالث يوم، وبويع ثانية لما قتل المقتدر سنة عشرين بعد أن أبى ابن المكتفي وقال عمي أحق به {cite:tarikh-khulafa-minhaj-1434 p. 591,597}."
