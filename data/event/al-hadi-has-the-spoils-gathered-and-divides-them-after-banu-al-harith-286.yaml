label:
  ar: "الهادي يجمع الغنائم ويقسمها بعد قتل بني الحارث بيومين، 286هـ"
  en: "Al-Hadi has the spoils gathered and divides them two days after the killing of Banu al-Harith, 286 AH"
  ur: "بنو حارث کے قتل کے دو دن بعد ہادی کا غنیمت جمع کروا کر تقسیم کرنا، 286ھ"
summary:
  ar: "بعد يومين من قتل بني الحارث أمر الهادي بجمع الغنائم فجمعها الطبريون والمتدينون ولم يخرج الجند والأعراب شيئاً، فباع محمد بن سعيد ما جُمع وقُسم على الخمس وسهمين للفارس وسهم للراجل."
  en: "Two days after the killing of Banu al-Harith al-Hadi ordered the spoils gathered; the Tabaris and the devout among his men handed theirs in while the troops and bedouin did not, and what was gathered was sold by Muhammad ibn Sa'id and divided by fifths, two shares to a horseman and one to a footman."
  ur: "بنو حارث کے قتل کے دو دن بعد ہادی نے غنیمت جمع کرنے کا حکم دیا؛ طبری اور دیندار ساتھیوں نے جمع کرائی جبکہ فوج اور بدو نے کچھ نہ دیا، اور جو جمع ہوا اسے محمد بن سعید نے بیچا اور خمس کے حساب سے بانٹا، سوار کو دو حصے اور پیادے کو ایک۔"
