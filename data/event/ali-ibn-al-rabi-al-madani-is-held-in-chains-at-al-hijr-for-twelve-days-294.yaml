summary:
  ar: "أمر الهادي بحبس علي بن الربيع المداني في الحديد اثني عشر يوماً بالهجر، وفق ما يذكر الكتاب."
  en: "Al-Hadi ordered Ali ibn al-Rabi' al-Madani held in irons for twelve days at al-Hijr, as the book reports."
  ur: "ہادی نے علی بن الربیع المدانی کو الہجر میں بارہ دن زنجیروں میں رکھنے کا حکم دیا، جیسا کہ کتاب بیان کرتی ہے۔"
  es: "Según relata el libro, Al-Hadi ordenó que Ali ibn al-Rabi' al-Madani permaneciera encadenado durante doce días en al-Hijr."
  fr: "Al-Hadi ordonna qu'Ali ibn al-Rabi' al-Madani soit maintenu enchaîné pendant douze jours à al-Hijr, comme le rapporte le livre."
  tr: "Kitapta belirtilene göre, El-Hadi, Ali bin El-Rabi' El-Medani'nin El-Hacer'de on iki gün boyunca demir prangalara vurularak hapsedilmesini emretti."
  id: "Al-Hadi memerintahkan agar Ali bin Al-Rabi’ Al-Madani dipenjara dengan belenggu selama dua belas hari di Al-Hajr, sesuai dengan apa yang disebutkan dalam buku tersebut."
