label: { ar: "مجزرة همذان", en: "Massacre of Hamadan", es: "Masacre de Hamadán", fr: "Massacre d'Hamadan", ur: "ہمدان کا قتل عام", tr: "Hamadan Katliamı", id: "Pembantaian Hamadan" }
summary:
  ar: "لما قتل أهل همذان ابن أخت مرداويج بن زيار أبي الكراديس بن علي الطلحي قائد جيشه نحو أربعة آلاف من الديلم والجيل سار مرداويج من الري فنزل على الباب المعروف بباب الأسد، وكان أهل همذان يتوارثون أن الأسكندر بنى همذان وأن ذلك الأسد الحجري طلسما للمدينة وأن خرابها يكون عند كسره وقد قلبه عسكر ابن أخته قبل الوقعة فكسر، فقتل أهل همذان في اليوم الأول في قول المقلل نحو أربعين ألفاً وأقام السيف ثلاثة أيام والنار والسبي، ثم نادى برفع السيف وأمن الشيوخ والمستورين فلما خرجوا إلى المصلى أمر صاحب عذابه المسمى السقطي أن يطوف بهم الديلم بحرابهم وخناجرهم فأتى عليهم جميعاً {cite:muruj-al-dhahab p. 724-726}."
  en: "After his nephew's defeat Mardawij sacked Hamadan — the talismanic stone lion already broken — forty thousand slain and the lured elders butchered at the musalla {cite:muruj-al-dhahab p. 724-726}."
  es: "Después de la derrota de su sobrino, Mardawij saqueó Hamadán —el león de piedra talismánico ya estaba roto—, cuarenta mil fueron asesinados y los ancianos atraídos fueron masacrados en la musalla {cite:muruj-al-dhahab p. 724-726}."
  fr: "Après la défaite de son neveu, Mardawij a saccagé Hamadan — le lion de pierre talismanique déjà brisé — quarante mille personnes tuées et les anciens attirés massacrés au musalla {cite:muruj-al-dhahab p. 724-726}."
  ur: "اپنے بھتیجے کی شکست کے بعد مردویج نے ہمدان کو برطرف کر دیا — جو پہلے ہی ٹوٹا ہوا طویزی پتھر کا شیر تھا — چالیس ہزار مقتول اور لالچی بزرگوں کو مصلیٰ میں قتل کر دیا گیا۔ 724-726}۔"
  tr: "Hamadan halkı, Mardavij ibn Ziyar'ın yeğeni Ebu el-Karadis ibn Ali el-Talhi'yi, ordusunun komutanını, yaklaşık dört bin Daylamlı ve Gilanlıyı öldürdüğünde, Mardavij Ray'dan yola çıktı ve Aslan Kapısı olarak bilinen kapıda kamp kurdu. Hamadan halkı, Hamadan'ı İskender'in inşa ettiğini ve o taş aslanın şehir için bir tılsım olduğunu, yıkılmasının ise aslanın kırılmasıyla geleceğini söylerdi. Yeğeninin ordusu savaştan önce kapıyı devirmiş ve kırmıştı. El-Mukalil'e göre, ilk gün Hamadan halkından yaklaşık kırk bin kişi öldürüldü ve kılıç, ateş ve esirler üç gün boyunca tutuldu. Sonra kılıcı kınına koydurdu ve yaşlılara ve saklananlara af çıkardı. Onlar namaz kılınacak yere gittiklerinde, işkencesinden sorumlu olan el-Saqati'ye Delamîlere onları mızrak ve hançerleriyle teğmen teğmen geçirmelerini emretti ve hepsini öldürdü. {cite:muruj-al-dhahab s. 724-726}"
  id: "Ketika penduduk Hamadan membunuh keponakan Mardawij ibn Ziyar, Abu al-Karadis ibn Ali al-Talhi, komandan pasukannya, sekitar empat ribu orang Daylam dan Gilan, Mardawij berbaris dari Ray dan berkemah di gerbang yang dikenal sebagai Gerbang Singa. Penduduk Hamadan biasa mengatakan bahwa Alexander telah membangun Hamadan dan bahwa singa batu itu adalah jimat bagi kota itu dan bahwa kehancurannya akan datang ketika singa itu hancur. Pasukan keponakannya telah membalikkannya sebelum pertempuran dan singa itu hancur. Pada hari pertama, penduduk Hamadan terbunuh, menurut al-Muqalil, sekitar empat puluh ribu orang, dan pedang, api, dan tawanan ditahan selama tiga hari. Kemudian dia memerintahkan agar pedang disarungkan dan memberikan amnesti kepada para tetua dan orang-orang yang bersembunyi. Ketika mereka keluar ke tempat shalat, dia memerintahkan orang yang bertanggung jawab atas penyiksaannya, yang disebut al-Saqati, untuk menyuruh orang-orang Daylam mengarak mereka dengan tombak dan belati mereka, dan dia membunuh mereka semua. {mengutip:muruj-al-dhahab hal. 724-726}."
