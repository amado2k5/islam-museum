label: { ar: "مجزرة همذان", en: "Massacre of Hamadan" }
summary:
  ar: "لما قتل أهل همذان ابن أخت مرداويج بن زيار أبي الكراديس بن علي الطلحي قائد جيشه نحو أربعة آلاف من الديلم والجيل سار مرداويج من الري فنزل على الباب المعروف بباب الأسد، وكان أهل همذان يتوارثون أن الأسكندر بنى همذان وأن ذلك الأسد الحجري طلسما للمدينة وأن خرابها يكون عند كسره وقد قلبه عسكر ابن أخته قبل الوقعة فكسر، فقتل أهل همذان في اليوم الأول في قول المقلل نحو أربعين ألفاً وأقام السيف ثلاثة أيام والنار والسبي، ثم نادى برفع السيف وأمن الشيوخ والمستورين فلما خرجوا إلى المصلى أمر صاحب عذابه المسمى السقطي أن يطوف بهم الديلم بحرابهم وخناجرهم فأتى عليهم جميعاً {cite:muruj-al-dhahab p. 724-726}."
  en: "After his nephew's defeat Mardawij sacked Hamadan — the talismanic stone lion already broken — forty thousand slain and the lured elders butchered at the musalla {cite:muruj-al-dhahab p. 724-726}."
