id: event/al-qadiriyya-creed-409
class: event
kind: declaration
label: { ar: "قراءة الاعتقاد القادري في دار الخلافة", en: "The reading of the Qadiri Creed in the Dar al-Khilafa" }
summary:
  ar: "في يوم الخميس السابع عشر من المحرم سنة تسع وأربعمائة قُرئ في الموكب بدار الخلافة ببغداد كتابٌ بمذاهب أهل السنة، ونُص فيه على عقائد الإمام القادر بالله، وقيل فيه «من قال إن القرآن مخلوق فهو كافر حلال الدم»، وثبّت القادر مذهب أصحاب الحديث وألزم به الناس في مكاتباته ومحافله {cite:muntazam-ibn-al-jawzi j.7 p.289}. وفي سنة ٤٣٣ قُرئت العقيدة القادرية بتمامها في ديوان دار الملك بحضرة الوزير والمشايخ والقضاة، وفي حاشيتها خط العلامة أبي الحسن علي بن عمر القزويني يشهد فيه أنه سمعها كلها في ٤٣٣ ووافق بها إمام المسلمين القائم بأمر الله وأنه حجّة على من شاركه في الإيمان وأنه على ما فيها من الاعتقاد — وهي أسمى ما نشرته دولة القائم في باب العقيدة {cite:muntazam-ibn-al-jawzi j.8 p.452-455}."
  en: "On Thursday 17 Muharram 409 a book setting out the doctrines of Ahl al-Sunna was read in procession in the Dar al-Khilafa at Baghdad. It stated the creed of the Imam al-Qadir bi'llah, and it was said of it: 'whoever says the Qur'an is created is an unbeliever whose blood may be shed.' al-Qadir confirmed the doctrine of the people of hadith and required people to hold to it in his correspondence and assemblies {cite:muntazam-ibn-al-jawzi j.7 p.289}. In 433 the Qadiri Creed was read in full in the diwan of the Dar al-Mulk, in the presence of the vizier, the shaykhs and the judges. In its margin is the hand of the scholar Abu'l-Hasan Ali ibn Umar al-Qazwini, attesting that he heard all of it in 433, that he concurred in it with the Imam of the Muslims al-Qa'im bi-amr Allah, that it is binding proof against whoever shares his faith, and that he holds to the creed it contains. It is the loftiest thing the state of al-Qa'im published in matters of creed {cite:muntazam-ibn-al-jawzi j.8 p.452-455}."
