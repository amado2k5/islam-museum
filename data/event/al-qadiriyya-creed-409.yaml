label: { ar: "قراءة الاعتقاد القادري في دار الخلافة", en: "The reading of the Qadiri Creed in the Dar al-Khilafa", es: "La lectura del Credo Qadiri en el Dar al-Khilafa", fr: "La lecture du credo qadiri au Dar al-Khilafa", ur: "دار الخلافہ میں قادری عقیدہ کا پڑھنا", tr: "Halifelik Sarayı'nda Kadiri İnanç Bildirgesi'nin Okunması", id: "Membaca Akidah Qadiri di Rumah Kekhalifahan" }
summary:
  ar: "في يوم الخميس السابع عشر من المحرم سنة تسع وأربعمائة قُرئ في الموكب بدار الخلافة ببغداد كتابٌ بمذاهب أهل السنة، ونُص فيه على عقائد الإمام القادر بالله، وقيل فيه «من قال إن القرآن مخلوق فهو كافر حلال الدم»، وثبّت القادر مذهب أصحاب الحديث وألزم به الناس في مكاتباته ومحافله {cite:muntazam-ibn-al-jawzi j.7 p.289}. وفي سنة ٤٣٣ قُرئت العقيدة القادرية بتمامها في ديوان دار الملك بحضرة الوزير والمشايخ والقضاة، وفي حاشيتها خط العلامة أبي الحسن علي بن عمر القزويني يشهد فيه أنه سمعها كلها في ٤٣٣ ووافق بها إمام المسلمين القائم بأمر الله وأنه حجّة على من شاركه في الإيمان وأنه على ما فيها من الاعتقاد — وهي أسمى ما نشرته دولة القائم في باب العقيدة {cite:muntazam-ibn-al-jawzi j.8 p.452-455}."
  en: "On Thursday 17 Muharram 409 a book setting out the doctrines of Ahl al-Sunna was read in procession in the Dar al-Khilafa at Baghdad. It stated the creed of the Imam al-Qadir bi'llah, and it was said of it: 'whoever says the Qur'an is created is an unbeliever whose blood may be shed.' al-Qadir confirmed the doctrine of the people of hadith and required people to hold to it in his correspondence and assemblies {cite:muntazam-ibn-al-jawzi j.7 p.289}. In 433 the Qadiri Creed was read in full in the diwan of the Dar al-Mulk, in the presence of the vizier, the shaykhs and the judges. In its margin is the hand of the scholar Abu'l-Hasan Ali ibn Umar al-Qazwini, attesting that he heard all of it in 433, that he concurred in it with the Imam of the Muslims al-Qa'im bi-amr Allah, that it is binding proof against whoever shares his faith, and that he holds to the creed it contains. It is the loftiest thing the state of al-Qa'im published in matters of creed {cite:muntazam-ibn-al-jawzi j.8 p.452-455}."
  es: "El jueves 17 de Muharram de 409, se leyó en procesión en el Dar al-Khilafa de Bagdad un libro que exponía las doctrinas de Ahl al-Sunna. En él se afirmaba el credo del Imam al-Qadir bi'llah, y se decía de él: «Quien diga que el Corán es creado es un incrédulo cuya sangre puede ser derramada». Al-Qadir confirmó la doctrina de la gente del hadiz y exigió que la gente se adhiriera a ella en su correspondencia y asambleas {cite:muntazam-ibn-al-jawzi j.7 p.289}. En 433, el Credo Qadiri se leyó íntegramente en el diwan del Dar al-Mulk, en presencia del visir, los jeques y los jueces. En su margen figura la letra del erudito Abu'l-Hasan Ali ibn Umar al-Qazwini, quien atestigua haberlo escuchado todo en el año 433, haber coincidido con el Imam de los musulmanes al-Qa'im bi-amr Allah, que constituye prueba irrefutable contra quien comparta su fe y que se adhiera al credo que contiene. Es la obra más elevada que el estado de al-Qa'im publicó en materia de credo {cite:muntazam-ibn-al-jawzi, vol. 8, págs. 452-455}."
  fr: "Le jeudi 17 Muharram 409, un livre exposant les doctrines des Ahl al-Sunna fut lu en procession au Dar al-Khilafa de Bagdad. Il énonçait la profession de foi de l'imam al-Qadir bi'llah, et il fut dit à son sujet: « Quiconque affirme que le Coran est créé est un mécréant dont le sang mérite d'être versé. » Al-Qadir confirma la doctrine des gens du hadith et en recommanda à tous de s'y conformer dans sa correspondance et lors de ses assemblées (cf. Muntazam ibn al-Jawzi, vol. 7, p. 289). En 433, la profession de foi qadirite fut lue intégralement au diwan du Dar al-Mulk, en présence du vizir, des cheikhs et des juges. En marge, on trouve la signature du savant Abu'l-Hasan Ali ibn Umar al-Qazwini, attestant qu'il en a pris connaissance intégralement en 433, qu'il y souscrivait avec l'Imam des musulmans al-Qa'im bi-amr Allah, que ce texte constitue une preuve irréfutable contre quiconque partage sa foi et qu'il adhère à la doctrine qu'il contient. Il s'agit de l'ouvrage le plus important publié par l'état d'al-Qa'im en matière de croyance (voir: Muntazam ibn al-Jawzi, vol. 8, p. 452-455)."
  ur: "17 محرم 409 بروز جمعرات بغداد کے دار الخلافہ میں اہل السنہ کے عقائد کو بیان کرنے والی کتاب پڑھی گئی۔ اس میں امام القادر باللہ کا عقیدہ بیان کیا گیا اور اس کے بارے میں کہا گیا: 'جو کہتا ہے کہ قرآن تخلیق ہوا وہ کافر ہے جس کا خون بہایا جائے'۔ القادر نے اہل حدیث کے عقیدہ کی تصدیق کی اور لوگوں سے اپنی خط و کتابت اور مجلسوں میں اس پر عمل کرنے کا مطالبہ کیا۔ 433ء میں دار الملک کے دیوان میں وزیر، شیوخ اور قاضیوں کی موجودگی میں قادری عقیدہ مکمل پڑھا گیا۔ اس کے حاشیے میں عالم ابوالحسن علی ابن عمر القزوینی کا ہاتھ ہے، جس کی تصدیق انہوں نے یہ سب سن 433 میں کی ہے، کہ انہوں نے اس میں مسلمانوں کے امام القائم بن عمرو اللہ سے اتفاق کیا ہے، کہ جو بھی اپنے عقیدے کا حامل ہو اس کے خلاف یہ دلیل ہے، اور یہ کہ وہ عقیدہ پر قائم ہے۔ عقیدہ کے معاملات میں ریاست القائم نے جو سب سے اونچی چیز شائع کی ہے وہ ہے {حوالہ:منتظم ابن الجوزی ج8 ص 452۔"
  tr: "Hicri 409 yılının Muharrem ayının on yedinci Perşembe günü, Bağdat'taki Halife sarayında düzenlenen törende Sünnilerin dine dair bir kitap okundu. Kitapta İmam Kadir Billa'nın inançları belirtilmiş ve \"Kur'an'ın yaratıldığını söyleyen kâfirdir ve kanı dökülebilir\" denilmiştir. Kadir, Hadis Ehli'nin dinesini kurmuş ve yazışmalarında ve toplantılarında insanları buna mecbur kılmıştır. {cite:muntazam-ibn-al-jawzi j.7 p.289}. Hicri 433 yılında ise Kadiriyye âlimi, vezir, şeyhler ve kadıların huzurunda sarayda bütünüyle okunmuştur. Kenar boşluklarında, âlim Ebu el-Hasan Ali ibn Ömer el-Kazvini'nin el yazısı bulunmaktadır; bu yazıda, her şeyi Hicri 433 yılında işittiğini ve Müslümanların İmamı el-Kaim bi-Amr Allah ile hemfikir olduğunu, bunun onun inancını paylaşanlar için bir delil olduğunu ve içerdiği inançlara katıldığını ve el-Kaim'in mezhep alanında yayımladığı en yüce şey olduğunu belirtmektedir. {cite:muntazam-ibn-al-jawzi j.8 pp.452-455}"
  id: "Pada hari Kamis, tanggal tujuh belas Muharram, tahun 409 H, sebuah buku tentang doktrin Sunni dibacakan dalam prosesi di istana Khalifah di Baghdad. Buku itu menyatakan keyakinan Imam al-Qadir Billah, dan mengatakan, \"Siapa pun yang mengatakan bahwa Al-Qur'an diciptakan adalah kafir yang darahnya boleh ditumpahkan.\" Al-Qadir menetapkan doktrin Ahli Hadits dan mewajibkan orang-orang untuk mematuhinya dalam surat-menyurat dan pertemuan-pertemuan beliau. {cite:muntazam-ibn-al-jawzi j.7 p.289}. Pada tahun 433 H, Akidah Qadiriyyah dibacakan secara keseluruhan di istana kerajaan di hadapan wazir, syekh, dan hakim. Di pinggirannya terdapat tulisan tangan ulama Abu al-Hasan Ali ibn Umar al-Qazwini, yang bersaksi bahwa ia mendengar semuanya pada tahun 433 H dan setuju dengan Imam kaum Muslimin, al-Qa'im bi-Amr Allah, dan bahwa itu adalah bukti bagi mereka yang seiman dengannya dan bahwa ia setuju dengan isi keyakinan tersebut—dan itu adalah hal paling mulia yang diterbitkan oleh negara al-Qa'im di bidang akidah. {cite:muntazam-ibn-al-jawzi j.8 pp.452-455}."
