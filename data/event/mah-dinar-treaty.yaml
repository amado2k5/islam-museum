label: { ar: "صلح نهاوند وماه دينار", en: "Nihawand's Treaty and the Mah Dinar Name" }
summary:
  ar: "عند البلاذري: لما هزم جيش الأعاجم وظهر المسلمون وحذيفة يومئذ على الناس حاصر نهاوند فكان أهلها يخرجون فيقاتلون فهزمهم المسلمون ثم إن سماك بن عبيد العبسي أتبع رجلاً منهم ذات يوم ومعه ثمانية فرسان فجعل لا يبرز إليه رجل منهم إلا قتله حتى لم يبق غير الرجل وحده فاستسأم وألقى سلاحه فأخذه أسيراً فتكلم بالفارسية فدعا له سماك برجل يفهم كلامه فترجم له فإذا هو يقول اذهب إلى أميركم حتى أصالحه عن هذه الأرض وأؤدي الجزية وأعطيك على أسرك إياي ما شئت فإنك قد مننت علي إذ لم تقتلني فقال له وما اسمك قال دينار فانطلق به حذيفة فصالحه على الخراج والجزية وأمن أهل مدينته نهاوند على أموالهم وحيطانهم ومنازلهم فسميت نهاوند ماه دينار وكان دينار يأتي بعد ذلك سماكاً ويهدي ويبره وكانت نهاوند من فتوح أهل الكوفة والدينور من فتوح أهل البصرة فلما كثر المسلمون بالكوفة احتاجوا إلى أن يزادوا في النواحي التي كان خراجها مقسوماً فيهم فصيرت لهم الدينور وعوض أهل البصرة نهاوند لأنها من أصبهان فصار فضل ما بين خراج الدينور ونهاوند لأهل الكوفة فسميت ماه البصرة والدينور ماه الكوفة وذلك في خلافة معاوية."
  en: "In al-Baladhuri: when the Persian army was routed and Hudhayfa commanded, Nihawand was besieged — its people sallied and were beaten — until Simak ibn Ubayd al-Absi chased a man with eight riders, killing each as he turned, till the man alone sued for quarter, cast his weapon and was taken; speaking Persian he asked through a translator to be brought to the commander — 'I will make peace over this land, pay jizya, and give you what you wish for sparing me' — his name was Dinar. Hudhayfa made treaty with him on kharaj and jizya, securing the people of Nihawand in their wealth, orchards and homes — hence Nihawand was called Mah Dinar, and Dinar would visit Simak thereafter, giving gifts. Nihawand had been a Kufa conquest and al-Dinawar a Basra one; when Kufa's Muslims multiplied, al-Dinawar was made over to them and Nihawand compensated to Basra (being of Isbahan's kura), the kharaj differential going to Kufa — whence Nihawand 'Mah Basra' and al-Dinawar 'Mah Kufa' — under Mu'awiya's caliphate."
