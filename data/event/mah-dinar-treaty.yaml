summary:
  ar: "عند البلاذري: لما هزم جيش الأعاجم وظهر المسلمون وحذيفة يومئذ على الناس حاصر نهاوند فكان أهلها يخرجون فيقاتلون فهزمهم المسلمون ثم إن سماك بن عبيد العبسي أتبع رجلاً منهم ذات يوم ومعه ثمانية فرسان فجعل لا يبرز إليه رجل منهم إلا قتله حتى لم يبق غير الرجل وحده فاستسأم وألقى سلاحه فأخذه أسيراً فتكلم بالفارسية فدعا له سماك برجل يفهم كلامه فترجم له فإذا هو يقول اذهب إلى أميركم حتى أصالحه عن هذه الأرض وأؤدي الجزية وأعطيك على أسرك إياي ما شئت فإنك قد مننت علي إذ لم تقتلني فقال له وما اسمك قال دينار فانطلق به حذيفة فصالحه على الخراج والجزية وأمن أهل مدينته نهاوند على أموالهم وحيطانهم ومنازلهم فسميت نهاوند ماه دينار وكان دينار يأتي بعد ذلك سماكاً ويهدي ويبره وكانت نهاوند من فتوح أهل الكوفة والدينور من فتوح أهل البصرة فلما كثر المسلمون بالكوفة احتاجوا إلى أن يزادوا في النواحي التي كان خراجها مقسوماً فيهم فصيرت لهم الدينور وعوض أهل البصرة نهاوند لأنها من أصبهان فصار فضل ما بين خراج الدينور ونهاوند لأهل الكوفة فسميت ماه البصرة والدينور ماه الكوفة وذلك في خلافة معاوية."
  en: "In al-Baladhuri: when the Persian army was routed and Hudhayfa commanded, Nihawand was besieged — its people sallied and were beaten — until Simak ibn Ubayd al-Absi chased a man with eight riders, killing each as he turned, till the man alone sued for quarter, cast his weapon and was taken; speaking Persian he asked through a translator to be brought to the commander — 'I will make peace over this land, pay jizya, and give you what you wish for sparing me' — his name was Dinar. Hudhayfa made treaty with him on kharaj and jizya, securing the people of Nihawand in their wealth, orchards and homes — hence Nihawand was called Mah Dinar, and Dinar would visit Simak thereafter, giving gifts. Nihawand had been a Kufa conquest and al-Dinawar a Basra one; when Kufa's Muslims multiplied, al-Dinawar was made over to them and Nihawand compensated to Basra (being of Isbahan's kura), the kharaj differential going to Kufa — whence Nihawand 'Mah Basra' and al-Dinawar 'Mah Kufa' — under Mu'awiya's caliphate."
  es: "En al-Baladhuri: cuando el ejército persa fue derrotado y Hudhayfa comandaba, Nihawand fue sitiada; su gente salió y fue derrotada, hasta que Simak ibn Ubayd al-Absi persiguió a un hombre con ocho jinetes, matándolos a cada uno a su paso, hasta que el hombre solo pidió clemencia, arrojó su arma y fue capturado; hablando persa, pidió a través de un traductor que lo llevaran ante el comandante: «Haré las paces en esta tierra, pagaré la jizya y te daré lo que desees por perdonarme». Su nombre era Dinar. Hudhayfa hizo un tratado con él sobre kharaj y jizya, asegurando a la gente de Nihawand sus riquezas, huertos y hogares; por lo tanto, Nihawand fue llamada Mah Dinar, y Dinar visitaría a Simak a partir de entonces, entregándole regalos. Nihawand había sido una conquista de Kufa y al-Dinawar una de Basora; cuando los musulmanes de Kufa se multiplicaron, al-Dinawar pasó a ellos y Nihawand compensó a Basora (siendo parte de la kura de Isbahan), el diferencial de kharaj fue a Kufa -de donde Nihawand 'Mah Basra' y al-Dinawar 'Mah Kufa'- bajo el califato de Mu'awiya."
  fr: "Dans al-Baladhuri: lorsque l'armée perse fut mise en déroute et que Hudhayfa prit le commandement, Nihawand fut assiégée. Ses habitants organisèrent une sortie et furent battus. Simak ibn Ubayd al-Absi poursuivit un homme avec huit cavaliers, les tuant un à un sur leur passage, jusqu'à ce que l'homme seul implore grâce, jette son arme et soit capturé. S'exprimant en persan, il demanda par l'intermédiaire d'un interprète à être conduit auprès du commandant: « Je ferai la paix sur cette terre, je paierai la jizya et je vous donnerai ce que vous désirez pour m'avoir épargné. » Son nom était Dinar. Hudhayfa conclut un traité avec lui concernant le kharaj et la jizya, garantissant ainsi aux habitants de Nihawand leurs richesses, leurs vergers et leurs maisons. C'est ainsi que Nihawand fut appelée Mah Dinar, et Dinar rendit visite à Simak par la suite, lui offrant des présents. Nihawand avait été conquise par Kufa et al-Dinawar par Bassora. lorsque les musulmans de Kufa se sont multipliés, al-Dinawar leur a été cédé et Nihawand a compensé à Bassora (étant de la kura d'Isbahan), le différentiel de kharaj allant à Kufa — d'où Nihawand « Mah Basra » et al-Dinawar « Mah Kufa » — sous le califat de Mu'awiya."
  ur: "البلادوری میں ہے: جب فارس کی فوج کو شکست دی گئی اور حذیفہ نے حکم دیا، نہاوند کا محاصرہ کیا گیا - اس کے لوگوں کو مارا پیٹا گیا - یہاں تک کہ سماک بن عبید العبسی نے آٹھ سواروں کے ساتھ ایک آدمی کا پیچھا کیا، ہر ایک کو پلٹتے ہی مار ڈالا، یہاں تک کہ اکیلے آدمی نے چوتھائی تک مقدمہ کیا، اس کا ہتھیار پھینک دیا گیا؛ فارسی بولتے ہوئے اس نے ایک مترجم کے ذریعے کمانڈر کے پاس لانے کو کہا - 'میں اس سرزمین پر صلح کروں گا، جزیہ ادا کروں گا، اور جو کچھ تم مجھے بخشنا چاہتے ہو تمہیں دوں گا' - اس کا نام دینار تھا۔ حذیفہ نے اس کے ساتھ خرج اور جزیہ کا معاہدہ کیا، نہاوند کے لوگوں کو ان کے مال، باغات اور گھروں میں محفوظ کیا - اس لیے نہاوند کو مہ دینار کہا گیا، اور دینار اس کے بعد سماک کا دورہ کرتے ہوئے تحائف دیتے تھے۔ نہاوند کوفہ کی فتح اور الدنور بصرہ کی فتح تھی۔ جب کوفہ کے مسلمانوں کی تعداد بڑھ گئی تو الدنور ان کے حوالے کر دیا گیا اور نہاوند نے بصرہ کو معاوضہ دیا ⁦(اسبہان کا قرہ ہونے کی وجہ سے)⁩، خراج تفریق کوفہ کی طرف جا رہی تھی - جہاں سے نہاوند 'مہ بصرہ' اور الدنور 'مہ کوفہ' - معاویہ کی خلافت کے تحت۔"
  tr: "El-Baladhuri'ye göre: Pers ordusu yenilip Müslümanlar üstünlük sağladığında, Hudeyfe önderliğindeki halk Nahavand'ı kuşattı. Halkı dışarı çıkıp savaştı, ancak Müslümanlar onları yendi. Sonra bir gün Simak ibn Ubayd el-Absi, sekiz süvariyle onlardan birini takip etti. Karşısına çıkan her adamı öldürdü, ta ki sadece bir adam kalana kadar. Adam yorgun düştü ve silahlarını yere attı, bunun üzerine Simak onu esir aldı. Adam Farsça konuşuyordu, bu yüzden Simak onu anlayan birini tercüman için çağırdı. Adam, \"Komutanına git, bu toprak konusunda onunla barış yapayım. Cizye (vergi) ödeyeceğim ve beni esir aldığın için, beni öldürmeyerek bana iyilik gösterdiğin için, ne istersen vereceğim.\" dedi. Simak ona, \"Adın nedir?\" diye sordu. Adam, \"Dinar\" diye cevap verdi. Hudeyfe onu aldı ve haraç (toprak vergisi) ve cizye (vergi) konusunda onunla barıştı. Muaviye, şehri Nahavand halkına malları, surları ve evleri için güvence verdi. Nahavand o zamanlar Mah Dinar olarak adlandırılıyordu. Dinar daha sonra Simak'ı ziyaret ederek hediyeler getirdi ve ona iyilik gösterdi. Nahavand, Kufa halkı tarafından, Dinav ise Basra halkı tarafından fethedildi. Müslümanlar Kufa'da sayıca artınca, vergileri aralarında bölüşülen bölgelerde çoğaldılar, bu yüzden Dinav onların oldu ve Nahavand, İsfahan'dan olduğu için Basra halkına verildi. Böylece Dinav ve Nahavand'ın vergileri arasındaki fazlalık Kufa halkına gitti, bu yüzden buna Basra vergisi, Dinav'a ise Kufa vergisi denildi ve bu Muaviye'nin halifeliği döneminde oldu."
  id: "Menurut al-Baladhuri: Ketika tentara Persia dikalahkan dan kaum Muslim menang, dengan Hudhayfah memimpin rakyat, ia mengepung Nahavand. Penduduknya keluar dan melawan, tetapi kaum Muslim mengalahkan mereka. Kemudian, suatu hari, Simak ibn Ubayd al-Absi mengejar salah seorang dari mereka dengan delapan penunggang kuda. Ia membunuh setiap orang yang keluar untuk menghadapinya sampai hanya satu orang yang tersisa. Orang itu menjadi lelah dan melemparkan senjatanya, sehingga Simak menangkapnya. Ia berbicara dalam bahasa Persia, sehingga Simak memanggil seorang pria yang mengerti untuk menerjemahkan. Pria itu berkata, \"Pergilah kepada komandanmu agar aku dapat berdamai dengannya mengenai tanah ini. Aku akan membayar jizya (upeti), dan aku akan memberimu apa pun yang kau inginkan karena telah menangkapku, karena kau telah menunjukkan kebaikan kepadaku dengan tidak membunuhku.\" Simak bertanya kepadanya, \"Siapa namamu?\" Ia menjawab, \"Dinar.\" Hudhayfah membawanya dan berdamai dengannya mengenai kharaj (pajak tanah) dan jizya (upeti). Ia memberikan perlindungan kepada penduduk kotanya, Nahavand, atas harta benda, tembok, dan rumah mereka. Nahavand kemudian disebut Mah Dinar. Dinar kemudian mengunjungi Simak, membawa hadiah dan menunjukkan kebaikan kepadanya. Nahavand ditaklukkan oleh penduduk Kufa, dan Dinawar oleh penduduk Basra. Ketika jumlah Muslim di Kufa bertambah, mereka membutuhkan... Mereka menambah wilayah yang pajaknya dibagi di antara mereka, sehingga Dinawar menjadi milik mereka, dan Nahavand diberikan kepada penduduk Basra karena berasal dari Isfahan. Jadi, surplus antara pajak Dinawar dan Nahavand diberikan kepada penduduk Kufa, sehingga disebut pajak Basra dan Dinawar pajak Kufa, dan itu terjadi pada masa kekhalifahan Muawiyah."
