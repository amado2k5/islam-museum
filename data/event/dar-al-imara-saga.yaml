label: { ar: "أخبار دار الإمارة بالبصرة", en: "The Basra Dar al-Imara Saga", es: "La saga de Dar al-Imara en Basora", fr: "La saga de Bassora Dar al-Imara", ur: "بصرہ دار الامارہ ساگا" }
summary:
  ar: "بنى عتبة دار الإمارة دون المسجد بالرحبة التي تسمى الدهناء فيها السجن والديوان ثم بناها أبو موسى بلبن وطين وحولها زياد إلى قبلة المسجد ولما قدم الحجاج أراد أن يزيل اسم زياد عنها فهم ببنائها فقيل له إنما تريد اسمه فيها ثباتاً وتؤكداً فهدمها وتركها فبنيت عامة الدور حولها من طينها ولبنها وأبوابها فلم تكن بالبصرة دار إمارة حتى ولي سليمان بن عبد الملك فأمر صالح بن عبد الرحمن بإعادتها فأعادها بالآجر والجص على أساسها ورفع سمكها ولما ولي عدي بن أرطاة أراد أن يبني فوقها غرفاً فكتب إليه عمر بن عبد العزيز هبلتك أمك يا بن أم عدي أيعجز عنك منزل وسع زياداً وآل زياد فأمسك ثم بنى سليمان بن علي على ما رفعه من حيطان الغرف بناءً بطين وتحول إلى المربد فنزله ولما استخلف الرشيد أدخلت الدار في قبلة المسجد فليس اليوم للأمراء بالبصرة دار إمارة."
  en: "Utba built the dar al-imara below the mosque on al-Dahna' square holding prison and diwan; Abu Musa rebuilt it in mud-brick, Ziyad moved it to the qibla wall. Al-Hajjaj, meaning to erase Ziyad's name, resolved to raze and rebuild — told it was permanence he wanted, he demolished it and left it, its clay and doors going into the surrounding houses, and Basra had no governor's palace till Sulayman's kharaj-agent Salih ibn Abd al-Rahman rebuilt it on its foundations, raised and roofed it. Adi ibn Artat's upper rooms drew Umar ibn Abd al-Aziz's letter 'your mother lose you, son of Umm Adi — does a house that held Ziyad and Ziyad's folk fail you?'; Sulayman ibn Ali topped the walls in clay then moved to the Mirbad, and under al-Rashid the palace was swallowed into the mosque — Basra's governors have no dar al-imara today."
  es: "Utba construyó el dar al-imara debajo de la mezquita en la plaza al-Dahna', que albergaba prisión y diwan; Abu Musa lo reconstruyó con ladrillos de barro, Ziyad lo trasladó al muro de la qibla. Al-Hajjaj, con la intención de borrar el nombre de Ziyad, decidió arrasar y reconstruir; le dijeron que lo que buscaba era permanencia, así que lo demolió y lo dejó, sus barros y puertas entrando en las casas circundantes, y Basora no tuvo palacio del gobernador hasta que el agente kharaj de Sulayman, Salih ibn Abd al-Rahman, lo reconstruyó sobre sus cimientos, lo elevó y le puso techo. Las habitaciones superiores de Adi ibn Artat atrajeron la carta de Umar ibn Abd al-Aziz: «Tu madre te pierde, hijo de Umm Adi; ¿te falla una casa que albergó a Ziyad y a su gente?». Sulayman ibn Ali remató las murallas con arcilla y luego se trasladó al Mirbad, y bajo el mandato de al-Rashid el palacio fue absorbido por la mezquita; hoy en día, los gobernadores de Basora no tienen dar al-imara."
  fr: "Utba fit construire le dar al-imara sous la mosquée, sur la place al-Dahna', abritant la prison et le diwan. Abu Musa le reconstruisit en briques de terre crue, et Ziyad le déplaça contre le mur de la qibla. Al-Hajjaj, voulant effacer le nom de Ziyad, résolut de le raser et de le reconstruire. On lui dit qu'il recherchait la permanence; il le démolit donc et laissa les ruines, ses murs et ses portes se fondant dans les maisons environnantes. Bassora resta sans palais du gouverneur jusqu'à ce que Salih ibn Abd al-Rahman, agent du kharaj de Sulayman, le reconstruise sur ses fondations, le surélève et le couvre. Les appartements supérieurs d'Adi ibn Artat attirèrent la lettre d'Umar ibn Abd al-Aziz: « Ta mère te perd, fils d'Umm Adi ! Une maison qui abrita Ziyad et sa famille te trahirait-elle ? » Sulayman ibn Ali recouvrit les murs d'argile puis se déplaça vers le Mirbad, et sous al-Rashid, le palais fut absorbé par la mosquée — les gouverneurs de Bassora n'ont plus de dar al-imara aujourd'hui."
  ur: "عتبہ نے دار الامارہ مسجد کے نیچے الدہنہ چوک پر بنایا جس میں جیل اور دیوان تھے۔ ابو موسیٰ نے اسے مٹی کی اینٹوں سے دوبارہ تعمیر کیا، زیاد نے اسے قبلہ کی طرف منتقل کر دیا۔ الحجاج نے، جس کا مطلب زیاد کا نام مٹانا ہے، مٹانے اور دوبارہ تعمیر کرنے کا عزم کیا - کہا کہ اسے مستقل ہونا چاہیے تھا، اس نے اسے گرا دیا اور اسے چھوڑ دیا، اس کی مٹی اور دروازے آس پاس کے گھروں میں جا رہے تھے، اور بصرہ میں اس وقت تک کوئی گورنری کا محل نہیں تھا جب تک کہ سلیمان کے خرج کے ایجنٹ صالح بن عبدالرحمٰن نے اسے دوبارہ قائم نہ کر دیا اور اسے دوبارہ قائم نہ کیا۔ عدی بن ارتات کے بالائی کمروں میں عمر بن عبدالعزیز کا خط تھا 'تمہاری ماں تمہیں کھو دیتی ہے، ام عدی کے بیٹے - کیا وہ گھر جس میں زیاد اور زیاد کے لوگ رہتے ہیں تمہیں ناکام ہو جاتا ہے؟'; سلیمان ابن علی نے مٹی کی دیواروں کو اوپر کیا پھر میرباد چلے گئے، اور الرشید کے تحت محل کو مسجد میں نگل لیا گیا - بصرہ کے گورنروں کے پاس آج کوئی دار الامارہ نہیں ہے۔"
