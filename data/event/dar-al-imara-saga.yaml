label: { ar: "أخبار دار الإمارة بالبصرة", en: "The Basra Dar al-Imara Saga" }
summary:
  ar: "بنى عتبة دار الإمارة دون المسجد بالرحبة التي تسمى الدهناء فيها السجن والديوان ثم بناها أبو موسى بلبن وطين وحولها زياد إلى قبلة المسجد ولما قدم الحجاج أراد أن يزيل اسم زياد عنها فهم ببنائها فقيل له إنما تريد اسمه فيها ثباتاً وتؤكداً فهدمها وتركها فبنيت عامة الدور حولها من طينها ولبنها وأبوابها فلم تكن بالبصرة دار إمارة حتى ولي سليمان بن عبد الملك فأمر صالح بن عبد الرحمن بإعادتها فأعادها بالآجر والجص على أساسها ورفع سمكها ولما ولي عدي بن أرطاة أراد أن يبني فوقها غرفاً فكتب إليه عمر بن عبد العزيز هبلتك أمك يا بن أم عدي أيعجز عنك منزل وسع زياداً وآل زياد فأمسك ثم بنى سليمان بن علي على ما رفعه من حيطان الغرف بناءً بطين وتحول إلى المربد فنزله ولما استخلف الرشيد أدخلت الدار في قبلة المسجد فليس اليوم للأمراء بالبصرة دار إمارة."
  en: "Utba built the dar al-imara below the mosque on al-Dahna' square holding prison and diwan; Abu Musa rebuilt it in mud-brick, Ziyad moved it to the qibla wall. Al-Hajjaj, meaning to erase Ziyad's name, resolved to raze and rebuild — told it was permanence he wanted, he demolished it and left it, its clay and doors going into the surrounding houses, and Basra had no governor's palace till Sulayman's kharaj-agent Salih ibn Abd al-Rahman rebuilt it on its foundations, raised and roofed it. Adi ibn Artat's upper rooms drew Umar ibn Abd al-Aziz's letter 'your mother lose you, son of Umm Adi — does a house that held Ziyad and Ziyad's folk fail you?'; Sulayman ibn Ali topped the walls in clay then moved to the Mirbad, and under al-Rashid the palace was swallowed into the mosque — Basra's governors have no dar al-imara today."
