label: { ar: "مقتل المتنبي", en: "The killing of al-Mutanabbi (354 AH)", ur: "متنبی کا قتل (354ھ)" }
summary:
  ar: "خرج المتنبي من بغداد إلى فارس فمدح عضد الدولة وأقام عنده مديدة ثم رجع من شيراز يريد بغداد فقتل بالقرب من النعمانية في رمضان وقيل شعبان سنة أربع وخمسين وثلثمائة؛ وفي سبب قتله ثلاثة أقوال: أن العرب قتلته لمال كثير معه، وأن عضد الدولة دس عليه من قتله لقوله في عطائه «هذا أجزل إلا أنه عطاء متكلف وكان سيف الدولة يعطي طبعاً»، وذكر مظفر بن علي الكاتب أنه حضر قتله صبياً مع أبيه في ستين راكباً من بني ضبة فكمنا له في واد فلما رآنا قام ونادى: هلموا وجوه العرب، فقتل ولده وأخذ غلمانه وانهزم يسيراً فقال له غلام: أين قولك «الخيل والليل والبيداء تعرفني والسيف والرمح والقرطاس والقلم»؟ فقال: قتلتني قتلك الله، والله لا أهزم اليوم، ثم رجع كاراً فطعن زعيمهم في عنقه فقتله واختلفت عليه الرماح فقتل، واسم قاتله فاتك بن أبي الجهل الأسدي، وكان قتله بشط دجلة بموضع يعرف بالصافية {cite:muntazam-ibn-al-jawzi j.7 p.36-37}."
  en: "354: al-Mutanabbi, returning from Adud al-Dawla's court laden with gifts, was ambushed by Banu Dabba near al-Nu'maniyya on the Tigris. Three accounts of the motive — robbery, or the insult 'Sayf al-Dawla gave by nature; this was a strained gift'. An eyewitness: his son killed, he turned to flee until a servant quoted his own verse back at him — 'where is your line: the horses, the night and the desert know me?' — 'You have killed me', he said, 'by God I shall not be beaten today', wheeled back, slew their leader and died under the spears; his killer was Fatik ibn Abi al-Jahl al-Asadi {cite:muntazam-ibn-al-jawzi j.7 p.36-37}."
  ur: "354ھ: متنبی عضدالدولہ کے دربار سے تحائف لیے لوٹتے تھے کہ دریائے دجلہ کے کنارے نعمانیہ کے قریب بنو ضبہ نے گھات لگا کر حملہ کیا۔ قتل کے سبب میں تین اقوال ہیں — مال کی لالچ، یا «سيف الدولہ فطرت سے دیتا تھا؛ یہ بناوٹی عطا تھا» کے طعنے کی سزا۔ ایک شاہد کے مطابق: بیٹا مارا گیا اور وہ بھاگنے لگا، یہاں تک کہ ایک غلام نے ان کا اپنا مصرع یاد دلایا — «آپ کا یہ بیت کہاں گیا: گھوڑے، رات اور بایاباں مجھے جانتے ہیں؟» — «تم نے مجھے مار ڈالا»، انہوں نے کہا، «خدا کی قسم آج نہیں ہاروں گا»، پھر پلٹ کر ان کے سردار کو مارا اور خود نیزوں تلے شہید ہوئے؛ قاتل فاتک بن ابی جل اسدی تھا {cite:muntazam-ibn-al-jawzi j.7 p.36-37}۔"
