label: { ar: "إسلام تكودار سلطان التتار وتسميته أحمد سنة 681هـ", en: "Tekuder's accession as the Muslim sultan Ahmad, 681", es: "Ascenso de Tekuder como sultán musulmán Ahmad, 681", fr: "L'accession de Tekuder au trône en tant que sultan musulman Ahmad, 681", ur: "مسلم سلطان احمد کے طور پر ٹیکوڈر کا الحاق، 681", tr: "Tatar Sultanı İslam Tekudar ve Hicri 681 yılındaki yeniden adlandırılması", id: "Islam Tekudar, Sultan Tatar, dan penggantian namanya pada tahun 681 Hijriah" }
summary:
  ar: "في سنة إحدى وثمانين وصلت رسل أحمد بن هولاكو بأنه استقر في المملكة إلى بغداد عوض أخيه أبغا، وأمر ببناء المساجد والجوامع وإقامة الشرع الشريف على ما كان في زمن الخلفاء، ووصلت رسله إلى الشام وإلى مصر وكان منهم الشيخ قطب الدين الشيرازي {cite:shadharat-dhahab p. 640}."
  en: "681 — envoys of Ahmad b. Hulagu announced his settlement in the kingdom at Baghdad in his brother Abagha's place, ordering mosques built and the sacred law restored as in the caliphs' days; his embassy reached Syria and Egypt, Qutb al-Din al-Shirazi among them {cite:shadharat-dhahab p. 640}."
  es: "681 — enviados de Ahmad b. Hulagu anunciaron su establecimiento en el reino en Bagdad en el lugar de su hermano Abagha, ordenando la construcción de mezquitas y la restauración de la ley sagrada como en los días de los califas; su embajada llegó a Siria y Egipto, entre ellos Qutb al-Din al-Shirazi {cite:shadharat-dhahab p. 640}."
  fr: "681 — Les envoyés d'Ahmad b. Hulagu annoncèrent son installation dans le royaume à Bagdad à la place de son frère Abagha, ordonnant la construction de mosquées et le rétablissement de la loi sacrée comme au temps des califes; son ambassade atteignit la Syrie et l'Égypte, Qutb al-Din al-Shirazi parmi eux {cite: shadharat-dhahab p. 640}."
  ur: "681 - احمد بن کے ایلچی۔ ہلاگو نے اپنے بھائی اباغا کی جگہ بغداد میں سلطنت میں آباد ہونے کا اعلان کیا، مساجد کی تعمیر اور مقدس قانون کو بحال کرنے کا حکم دیا جیسا کہ خلیفہ کے دور میں تھا۔ ان کا سفارت خانہ شام اور مصر تک پہنچا، ان میں قطب الدین الشیرازی بھی شامل ہیں۔ 640}۔"
  tr: "81 yılında Ahmed ibn Hulagu'dan elçiler geldi; kendisi Bağdat'taki krallığa kardeşi Abaka'nın yerine yerleşmişti ve halifeler dönemindeki gibi camiler ve cemaat mescitleri inşa edilmesini ve yüce Şeriatın tesis edilmesini emretti. Elçileri Levant'a ve Mısır'a ulaştılar ve aralarında Şeyh Kutub el-Din el-Şirazi de vardı. {Kaynak: Shadharat-dhahab s. 640}"
  id: "Pada tahun 81, utusan tiba dari Ahmad ibn Hulagu yang memberitahukan bahwa ia telah menetap di kerajaan Baghdad menggantikan saudaranya Abaqa, dan ia memerintahkan pembangunan masjid dan masjid jami serta penegakan syariat yang mulia sebagaimana pada zaman para khalifah. Utusannya tiba di Levant dan Mesir, dan di antara mereka adalah Syekh Qutb al-Din al-Shirazi {cite:shadharat-dhahab p. 640}."
