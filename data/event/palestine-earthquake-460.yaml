label: { ar: "زلزلة فلسطين الكبرى سنة 460", en: "The Great Earthquake of Palestine in 460", es: "El Gran Terremoto de Palestina en 460", fr: "Le grand tremblement de terre de Palestine en 460" }
summary:
  ar: "في سنة ستين وأربعمائة كانت زلزلة بفلسطين وغيرها أهلكت من أهل الرملة خمسة عشر ألفاً، ووقعت شرافتان من مسجد رسول الله، وانشقت الأرض عن كنوز من المال، وانشقت صخرة بيت المقدس ثم عادت فالتأمت، وغار البحر من الساحل مسيرة يوم وساح في البرد خلَّ الناس إلى أرضه يلتقطون فرجع عليهم فأهلك خلقاً كثيراً منهم، وبلغت هذه الزلزلة إلى الرحبة والكوفة {cite:shadharat-dhahab p. 315}."
  en: "In 460 a great earthquake struck Palestine and beyond: it killed fifteen thousand of Ramla's people, toppled two pinnacles of the Prophet's mosque, split the earth over hoards of treasure, split the Rock of Jerusalem then closed again, and drove the sea a day's march from the shore — crowds went out gathering on the exposed seabed until it returned and destroyed many; the quake was felt as far as al-Rahba and Kufa {cite:shadharat-dhahab p. 315}."
  es: "En el año 460, un gran terremoto sacudió Palestina y sus alrededores: mató a quince mil habitantes de Ramla, derribó dos pináculos de la mezquita del Profeta, partió la tierra sobre tesoros, partió la Roca de Jerusalén y luego la cerró de nuevo, y alejó el mar el equivalente a un día de marcha de la costa. Multitudes salieron a congregarse en el lecho marino expuesto hasta que regresó y destruyó muchos; el terremoto se sintió hasta al-Rahba y Kufa {cita: shadharat-dhahab p. 315}."
  fr: "En 460, un grand tremblement de terre frappa la Palestine et au-delà: il tua quinze mille habitants de Ramla, fit s'écrouler deux pinacles de la mosquée du Prophète, fendit la terre sur des trésors, fendit le Rocher de Jérusalem puis le referma, et repoussa la mer à une journée de marche du rivage — des foules se rassemblèrent sur le fond marin exposé jusqu'à ce qu'elle revienne et détruise beaucoup; le tremblement de terre fut ressenti jusqu'à al-Rahba et Kufa {cite: shadharat-dhahab p. 315}."
