label: { ar: "زلزلة فلسطين الكبرى سنة 460" }
summary:
  ar: "في سنة ستين وأربعمائة كانت زلزلة بفلسطين وغيرها أهلكت من أهل الرملة خمسة عشر ألفاً، ووقعت شرافتان من مسجد رسول الله، وانشقت الأرض عن كنوز من المال، وانشقت صخرة بيت المقدس ثم عادت فالتأمت، وغار البحر من الساحل مسيرة يوم وساح في البرد خلَّ الناس إلى أرضه يلتقطون فرجع عليهم فأهلك خلقاً كثيراً منهم، وبلغت هذه الزلزلة إلى الرحبة والكوفة {cite:shadharat-dhahab p. 315}."
  en: "In 460 a great earthquake struck Palestine and beyond: it killed fifteen thousand of Ramla's people, toppled two pinnacles of the Prophet's mosque, split the earth over hoards of treasure, split the Rock of Jerusalem then closed again, and drove the sea a day's march from the shore — crowds went out gathering on the exposed seabed until it returned and destroyed many; the quake was felt as far as al-Rahba and Kufa {cite:shadharat-dhahab p. 315}."
