id: event/rabi-khurasan-transplant
class: event
kind: other
label: { ar: "نقل الربيع بن زياد خمسين ألفاً إلى خراسان", en: "al-Rabi' ibn Ziyad's Fifty-Thousand Transplant" }
summary:
  ar: "ولى زياد بن أبي سفيان الربيع بن زياد الحارثي سنة ٥١ خراسان وحول معه من أهل المصرين زهاء خمسين ألفاً بعيالاتهم وكان فيهم بريدة بن الحصيب الأسلمي أبو عبد الله وبمرو توفي في أيام يزيد بن معاوية وكان فيهم أيضاً أبو برزة الأسلمي عبد الله بن نضلة وبها مات وأسكنهم دون النهر والربيع أول من أمر الجند بالتناهد ولما بلغه مقتل حجر بن عدي الكندي غمه ذلك فدعا بالموت فسقط من يومه فمات وذلك سنة ٥٣ واستخلف عبد الله ابنه فقاتل أهل آمل وهي آموية وزم ثم صالحهم ورجع إلى مرو فمكث بها شهرين ثم مات."
  en: "In 51h Ziyad gave Khurasan to al-Rabi' ibn Ziyad al-Harithi, who moved near fifty thousand folk of the two misrs with their families — among them Burayda ibn al-Husayb al-Aslami, who died at Marw under Yazid ibn Mu'awiya, and Abu Barza al-Aslami, who died there too — settling them short of the river; he was the first to order the troops' garrison-settling. News of Hujr ibn Adi's killing grieved him; he prayed for death, fell that day, and died in 53h. His son Abdallah succeeded, fought Amul and Zamm into sulh, and died at Marw two months on."
