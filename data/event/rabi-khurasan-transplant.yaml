label: { ar: "نقل الربيع بن زياد خمسين ألفاً إلى خراسان", en: "al-Rabi' ibn Ziyad's Fifty-Thousand Transplant", es: "El trasplante de cincuenta mil de al-Rabi' ibn Ziyad", fr: "Les cinquante mille transplantations d'al-Rabi' ibn Ziyad", ur: "ربیع ابن زیاد کی پچاس ہزار پیوند کاری", tr: "Rabi' ibn Ziyad elli bin kişiyi Horasan'a nakletti", id: "Rabi' ibn Ziyad mentransfer lima puluh ribu ke Khorasan" }
summary:
  ar: "ولى زياد بن أبي سفيان الربيع بن زياد الحارثي سنة ٥١ خراسان وحول معه من أهل المصرين زهاء خمسين ألفاً بعيالاتهم وكان فيهم بريدة بن الحصيب الأسلمي أبو عبد الله وبمرو توفي في أيام يزيد بن معاوية وكان فيهم أيضاً أبو برزة الأسلمي عبد الله بن نضلة وبها مات وأسكنهم دون النهر والربيع أول من أمر الجند بالتناهد ولما بلغه مقتل حجر بن عدي الكندي غمه ذلك فدعا بالموت فسقط من يومه فمات وذلك سنة ٥٣ واستخلف عبد الله ابنه فقاتل أهل آمل وهي آموية وزم ثم صالحهم ورجع إلى مرو فمكث بها شهرين ثم مات."
  en: "In 51h Ziyad gave Khurasan to al-Rabi' ibn Ziyad al-Harithi, who moved near fifty thousand folk of the two misrs with their families — among them Burayda ibn al-Husayb al-Aslami, who died at Marw under Yazid ibn Mu'awiya, and Abu Barza al-Aslami, who died there too — settling them short of the river; he was the first to order the troops' garrison-settling. News of Hujr ibn Adi's killing grieved him; he prayed for death, fell that day, and died in 53h. His son Abdallah succeeded, fought Amul and Zamm into sulh, and died at Marw two months on."
  es: "En el año 51 de la Hégira, Ziyad entregó Jorasán a al-Rabi' ibn Ziyad al-Harithi, quien trasladó a cerca de cincuenta mil habitantes de los dos Misrs con sus familias —entre ellos Burayda ibn al-Husayb al-Aslami, quien murió en Marw bajo el mando de Yazid ibn Mu'awiya, y Abu Barza al-Aslami, quien también falleció allí—, asentándolos cerca del río. Fue el primero en ordenar el asentamiento de la guarnición de las tropas. La noticia del asesinato de Hujr ibn Adi lo afligió profundamente; oró por la muerte, cayó ese mismo día y murió en el año 53 de la Hégira. Su hijo Abdallah lo sucedió, combatió Amul y Zamm hasta convertirlas en Sulh, y murió en Marw dos meses después."
  fr: "En 51 H, Ziyad confia le Khorasan à al-Rabi' ibn Ziyad al-Harithi, qui y installa près de cinquante mille hommes des deux misrs avec leurs familles – parmi lesquels Burayda ibn al-Husayb al-Aslami, mort à Marw sous Yazid ibn Mu'awiya, et Abu Barza al-Aslami, également mort au même endroit – les plaçant en avant du fleuve. Il fut le premier à ordonner l'installation des garnisons. La nouvelle de la mort de Hujr ibn Adi le plongea dans le désespoir; il implora la mort, s'effondra ce jour-là et mourut en 53 H. Son fils Abdallah lui succéda, conquit Amul et Zamm et mourut à Marw deux mois plus tard."
  ur: "51ھ میں زیاد نے خراسان ربیع ابن زیاد الحارثی کو دے دیا، جو دونوں مسزوں کے پچاس ہزار کے قریب اپنے اہل و عیال کے ساتھ منتقل ہوئے، ان میں بریدہ بن الحسیب الاسلمی، جو مرو میں یزید بن معاویہ کے ماتحت فوت ہوئے، اور ابو برزہ الاسلمی بھی وہیں فوت ہوئے، جنہوں نے دریا کے کنارے آباد کیا۔ وہ پہلا شخص تھا جس نے فوجیوں کے گیریژن کو آباد کرنے کا حکم دیا۔ حجر بن عدی کے قتل کی خبر نے اسے غمزدہ کیا۔ اس نے موت کی دعا کی، اس دن گر پڑے اور 53ھ میں وفات پائی۔ اس کا بیٹا عبداللہ کامیاب ہوا، اس نے امول اور زم سے سلہ میں جنگ کی، اور دو مہینے بعد مرو میں وفات پائی۔"
  tr: "Ziyad ibn Ebu Sufyan, 51 yılında Rabi' ibn Ziyad el-Harithi'yi Horasan'a atadı ve iki şehirden yaklaşık elli bin kişiyi aileleriyle birlikte getirdi. Bunların arasında, Yezid ibn Muaviye döneminde Merv'de ölen Burayde ibn el-Hüseyb el-Aslami (Ebu Abdullah) ve orada ölen Ebu Berza el-Aslami (Abdullah ibn Nadhlah) da vardı. Onları nehrin aşağısına yerleştirdi. Rabi', askerlere savaş emri veren ilk kişiydi. Hucer ibn Adi el-Kindi'nin öldürüldüğünü duyunca çok üzüldü, bu yüzden ölüm için dua etti ve o gün yere düşüp öldü. Bu olay 53 yılında gerçekleşti. Abdullah, oğlunu halefi olarak atadı, böylece Emevi olan Amul ve Zem halkıyla savaştı, sonra onlarla barıştı ve Merv'e döndü. Orada iki ay kaldı ve sonra öldü."
  id: "Ziyad ibn Abi Sufyan menunjuk Rabi’ ibn Ziyad al-Harithi pada tahun 51 ke Khurasan dan membawa bersamanya sekitar lima puluh ribu orang dari dua kota beserta keluarga mereka. Di antara mereka adalah Buraydah ibn al-Husayb al-Aslami, Abu Abdullah, yang meninggal di Merv pada masa Yazid ibn Muawiyah. Di antara mereka juga terdapat Abu Barzah al-Aslami, Abdullah ibn Nadhlah, yang meninggal di sana. Ia menempatkan mereka di bawah sungai. Rabi’ adalah orang pertama yang memerintahkan para prajurit untuk berperang. Ketika ia mendengar tentang pembunuhan Hujr ibn Adi al-Kindi, ia merasa sedih, sehingga ia berdoa agar mati dan jatuh pingsan pada hari itu dan meninggal. Itu terjadi pada tahun 53. Abdullah menunjuk putranya sebagai penggantinya, sehingga ia memerangi penduduk Amul, yaitu Umayyah, dan Zam, kemudian ia berdamai dengan mereka dan kembali ke Merv. Ia tinggal di sana selama dua bulan dan kemudian meninggal."
