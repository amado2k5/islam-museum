label: { ar: "قدوم عضد الدولة إلى العراق" }
summary:
  ar: "في سنة 362هـ استنجد بختيار بعضد الدولة ليستعين به على سبكتكين فسار إليه في عساكر فارس واجتمع به أبو الفتح بن العميد وزير أبيه ركن الدولة في عساكر الري بالأهواز وساروا إلى واسط، فلما سمع سبكتكين بخبرهم وجه إلى بغداد وعزم أن يجعلها وراء ظهره ويعتصم على ديالى فحصل محصوراً من جميع جهاته بعد أن كتب بختيار إلى ضبة بن محمد الأسدي وهو من أهل عين التمر يخامر بالأثارة على أطراف بغداد وقطع الميرة عنها وكتب بمثل ذلك إلى بني شيبان وكان أبو تغلب بن حمدان من ناحية الموصل يمنع الميرة فغلا السعر وثار العيارون فنهبوا الناس ببغداد وامتنع الناس من المعاش لخوف الفتنة وعدم القوت، فسار عضد الدولة فلقيه سبكتكين والأتراك بين ديالى والمدائن فاقتتلوا قتالاً شديداً وانهزم الأتراك وقتل منهم خلق كثير وكانوا عبروا على جسور عملوها على ديالى فغرق منهم أكثر من السباحة وكذلك بختيار غرى من العيارين الذين أعانوه من بغداد واستباحوا عسكرهم وكانت الوقعة رابع عشر جمادى الأولى، وسار عضد الدولة فنزل بظاهر بغداد حتى علم وصول الأتراك إلى تكريت فدخل بغداد لثلاث خلون من رجب وأخرج الخليفة فلقيه في الماء وأمتلأت دجلة بالسميريات والزبازب حتى لم يبق ببغداد أحد ولو أراد إنسان أن يعبر دجلة على السماريات من واحدة إلى أخرى لأمكنه ذلك لكثرتها فأنزل الخليفة بدار الخلافة {cite:kamil-ibn-al-athir p. 475-477}."
  en: "In 362 Bakhtiyar called in Adud al-Dawla against Sabuktagin's Turks; by embargo and bribery Baghdad was starved till the mob looted, then Adud routed the Turks between Diyala and Mada'in on 14 Jumada I — more drowned than slew — and entered Baghdad on 3 Rajab over a Tigris so covered with craft a man could cross from boat to boat {cite:kamil-ibn-al-athir p. 475-477}."
