label: { ar: "قدوم عضد الدولة إلى العراق", en: "Adud al-Dawla's Arrival in Iraq", fr: "Arrivée d’Adud al-Dawla en Irak", es: "La llegada de Adud al-Dawla a Irak", ur: "عود الدولہ کی عراق آمد", tr: "Adud al-Dawla'nın Irak'a gelişi", id: "Kedatangan Adud al-Dawla di Irak" }
summary:
  ar: "في سنة 362هـ استنجد بختيار بعضد الدولة ليستعين به على سبكتكين فسار إليه في عساكر فارس واجتمع به أبو الفتح بن العميد وزير أبيه ركن الدولة في عساكر الري بالأهواز وساروا إلى واسط، فلما سمع سبكتكين بخبرهم وجه إلى بغداد وعزم أن يجعلها وراء ظهره ويعتصم على ديالى فحصل محصوراً من جميع جهاته بعد أن كتب بختيار إلى ضبة بن محمد الأسدي وهو من أهل عين التمر يخامر بالأثارة على أطراف بغداد وقطع الميرة عنها وكتب بمثل ذلك إلى بني شيبان وكان أبو تغلب بن حمدان من ناحية الموصل يمنع الميرة فغلا السعر وثار العيارون فنهبوا الناس ببغداد وامتنع الناس من المعاش لخوف الفتنة وعدم القوت، فسار عضد الدولة فلقيه سبكتكين والأتراك بين ديالى والمدائن فاقتتلوا قتالاً شديداً وانهزم الأتراك وقتل منهم خلق كثير وكانوا عبروا على جسور عملوها على ديالى فغرق منهم أكثر من السباحة وكذلك بختيار غرى من العيارين الذين أعانوه من بغداد واستباحوا عسكرهم وكانت الوقعة رابع عشر جمادى الأولى، وسار عضد الدولة فنزل بظاهر بغداد حتى علم وصول الأتراك إلى تكريت فدخل بغداد لثلاث خلون من رجب وأخرج الخليفة فلقيه في الماء وأمتلأت دجلة بالسميريات والزبازب حتى لم يبق ببغداد أحد ولو أراد إنسان أن يعبر دجلة على السماريات من واحدة إلى أخرى لأمكنه ذلك لكثرتها فأنزل الخليفة بدار الخلافة {cite:kamil-ibn-al-athir p. 475-477}."
  en: "In 362 Bakhtiyar called in Adud al-Dawla against Sabuktagin's Turks; by embargo and bribery Baghdad was starved till the mob looted, then Adud routed the Turks between Diyala and Mada'in on 14 Jumada I — more drowned than slew — and entered Baghdad on 3 Rajab over a Tigris so covered with craft a man could cross from boat to boat {cite:kamil-ibn-al-athir p. 475-477}."
  fr: "En 362, Bakhtiyar appela Adud al-Dawla contre les Turcs de Sabuktagin ; embargo et corruption affamèrent Bagdad jusqu’aux pillages de la foule, puis Adud vainquit les Turcs entre Diyala et Mada'in le 14 jumada I — les noyés furent plus nombreux que les tués — et entra à Bagdad le 3 rajab, sur un Tigre si couvert d’embarcations qu’un homme aurait pu passer de l’une à l’autre {cite:kamil-ibn-al-athir p. 475-477}."
  es: "En 362, Bakhtiyar llamó a Adud al-Dawla contra los turcos de Sabuktagin; mediante embargo y sobornos, Bagdad fue sometida a un bloqueo alimenticio hasta que la multitud saqueó, luego Adud derrotó a los turcos entre Diyala y Mada'in el 14 de Jumada I —más ahogados que muertos— y entró en Bagdad el 3 de Rajab sobre un Tigris tan cubierto de embarcaciones que un hombre podía cruzar de barco en barco {cite:kamil-ibn-al-athir p. 475-477}."
  ur: "362 میں بختیار نے سبوکتگین کے ترکوں کے خلاف عود الدولہ کو بلایا۔ پابندیوں اور رشوت خوری سے بغداد بھوکا رہا یہاں تک کہ ہجوم نے لوٹ مار کی، پھر عود نے 14 جمادی الثانی کو دیالہ اور مدین کے درمیان ترکوں کو شکست دی - اور 3 رجب کو دجلہ کے اوپر سے بغداد میں داخل ہوا تاکہ ایک آدمی کشتی سے ایک کشتی تک جا سکے۔ 475-477}۔"
  tr: "Hicri 362 yılında Bakhtiyar, Sabuktigin'e karşı Adud el-Dawla'dan yardım istedi. Adud el-Dawla, Pers ordusuyla ona doğru yürüdü ve babası Rukn el-Dawla'nın veziri Ebu el-Fath ibn el-Amid, Ahvaz'daki Rayy'den gelen birliklerle ona katıldı. Daha sonra Wasit'e doğru yürüdüler. Sabuktigin, onların yaklaştığını duyunca, Bağdat'ı atlayıp Diyala'da tahkimat kurmayı amaçlayarak Bağdat'a yöneldi. Ancak Bakhtiyar'ın Ain el-Tamr'dan Dabba ibn Muhammed el-Asadi'ye yazdığı ve Bağdat'ın dış mahallelerinde huzursuzluk çıkarmasını ve ikmal yollarını kesmesini emrettiği mektubundan sonra, kendisini her yönden kuşatılmış halde buldu. Benzer şekilde Beni Şeyban'a da yazdı. Musul bölgesinden Ebu Teğlib ibn Hamdan da Bağdat'a ulaşan ikmal yollarını engelliyor ve fiyatların fırlamasına neden oluyordu. Haydutlar ayaklanıp Bağdat halkını yağmaladılar ve insanlar daha fazla huzursuzluk ve yiyecek kıtlığı korkusuyla çalışmayı bıraktılar. Adud el-Dawla, Diyala ve el-Mada'in arasında Sabuktigin ve Türklere karşı yürüdü. Şiddetli bir savaş çıktı ve Türkler ağır kayıplar vererek yenildiler. Diyala'da inşa ettikleri köprülerden geçmeye çalışmışlardı, ancak birçoğu boğuldu. Bakhtiyar ise Bağdat'tan kendisine yardım eden haydutları kışkırttı ve onlarla birlikte geniş çaplı yağmalama yaptı. Orduları ve savaş, Cemadi el-Ula'nın on dördüncü gününde gerçekleşti. Adud el-Dawla, Türklerin Tikrit'e vardığını öğrenene kadar Bağdat dışında kamp kurdu. Recep ayının üçüncü gününde Bağdat'a girdi ve halifeyi getirdi. Onunla suda karşılaştı ve Dicle nehri, Bağdat'ta kimse kalmayana kadar sürülerle doldu. Bir kişi Dicle nehrini akarsular üzerinde bir yerden diğerine geçmek isteseydi, akarsuların bolluğu nedeniyle bunu yapabilirdi. Halife, Halifelik Sarayı'na indirildi. {cite:kamil-ibn-al-athir s. 475-477}"
  id: "Pada tahun 362 H, Bakhtiyar meminta bantuan Adud al-Dawla melawan Sabuktigin. Adud al-Dawla bergerak menuju Bakhtiyar dengan pasukan Persia-nya, dan Abu al-Fath ibn al-Amid, wazir ayahnya, Rukn al-Dawla, bergabung dengannya bersama pasukan dari Rayy di Ahwaz. Mereka kemudian bergerak ke Wasit. Ketika Sabuktigin mendengar kedatangan mereka, ia menuju Baghdad, berniat untuk melewatinya dan membentengi dirinya di Diyala. Namun, ia mendapati dirinya dikepung dari segala sisi setelah Bakhtiyar menulis surat kepada Dabba ibn Muhammad al-Asadi, dari Ain al-Tamr, memerintahkannya untuk menghasut kerusuhan di pinggiran Baghdad dan memutus pasokan ke kota itu. Ia juga menulis surat serupa kepada Bani Shayban. Abu Taghlib ibn Hamdan, dari wilayah Mosul, juga mencegah pasokan mencapai Baghdad, menyebabkan harga meroket. Para anggota Brigade memberontak dan menjarah penduduk Baghdad, dan orang-orang berhenti bekerja karena takut akan kerusuhan lebih lanjut dan kekurangan makanan. Adud al-Dawla bergerak melawan Sabuktigin dan Turki di antara Diyala dan al-Mada'in. Pertempuran sengit terjadi, dan Turki dikalahkan, menderita kerugian besar. Mereka telah mencoba menyeberangi jembatan yang mereka bangun di Diyala, tetapi banyak yang tenggelam. Bakhtiyar, pada gilirannya, menghasut para perampok dari Baghdad yang membantunya dan melibatkan mereka dalam penjarahan besar-besaran. Pasukan mereka, dan pertempuran terjadi pada tanggal empat belas Jumada al-Ula. Adud al-Dawla bergerak dan berkemah di luar Baghdad sampai dia mengetahui kedatangan Turki ke Tikrit. Dia memasuki Baghdad tiga hari setelah Rajab dan membawa Khalifah keluar. Dia menemuinya di air, dan Sungai Tigris dipenuhi oleh gerombolan orang hingga tidak ada seorang pun yang tersisa di Baghdad. Jika seseorang ingin menyeberangi Sungai Tigris dengan menggunakan kawanan burung dari satu tempat ke tempat lain, ia dapat melakukannya karena banyaknya burung yang tersedia. Khalifah dibawa ke Istana Kekhalifahan. {cite:kamil-ibn-al-athir p. 475-477}"
