id: event/birth-al-zamakhshari-467
class: event
kind: birth
label:
  ar: "ولادة الزمخشري بزمخشر، ٤٦٧هـ/١٠٧٥م"
  en: "Birth of al-Zamakhshari at Zamakhshar, 467/1075"
  ur: "زمخشر میں زمخشری کی پیدائش، 467ھ/1075ء"
  fr: "La naissance d'al-Zamakhshari à Zamakhshar, 467/1075"
  es: "Nacimiento de al-Zamakhshari en Zamakhshar, 467/1075"
  tr: "El-Zemahşeri, H. 467/MS 1075'te Zemahşer'de doğdu."
  id: "Al-Zamakhshari lahir di Zamakhshar, 467 H/1075 M."
summary:
  ar: "وُلد أبو القاسم محمود بن عمر بن محمد الزمخشري الخوارزمي يوم الأربعاء سابع عشري رجب سنة سبع وستين وأربعمائة بزمخشر في خوارزم {cite:shadharat-dhahab p. 601}؛ ويذكر غيره أنه وُلد في ٢٧ رجب ٤٦٧هـ الموافق ١٨ آذار ١٠٧٥م {cite:encyclopaedia-of-islam-2 vol. 11 p. 449-450}. كان أبوه إمام مسجد البلدة فعلّمه القرآن {cite:encyclopaedia-of-islam-2 vol. 12 p. 917}."
  en: "Abu al-Qasim Mahmud ibn Umar ibn Muhammad al-Zamakhshari al-Khwarazmi was born on Wednesday 17 Rajab 467 at Zamakhshar in Khwarazm {cite:shadharat-dhahab p. 601}; others give 27 Rajab 467, corresponding to 18 March 1075 {cite:encyclopaedia-of-islam-2 vol. 11 p. 449-450}. His father, imam of the local mosque, taught him the Qur'an {cite:encyclopaedia-of-islam-2 vol. 12 p. 917}."
  ur: "ابوالقاسم محمود بن عمر بن محمد زمخشری خوارزمی بدھ کے دن 17 رجب 467ھ کو خوارزم کے شہر زمخشر میں پیدا ہوئے {cite:shadharat-dhahab p. 601}؛ بعض کے نزدیک 27 رجب 467ھ بمطابق 18 مارچ 1075ء {cite:encyclopaedia-of-islam-2 vol. 11 p. 449-450}۔ ان کے والد شہر کی مسجد کے امام تھے اور انہی نے انہیں قرآن پڑھایا {cite:encyclopaedia-of-islam-2 vol. 12 p. 917}۔"
  fr: "Abu al-Qasim Mahmud ibn Umar ibn Muhammad al-Zamakhshari al-Khwarazmi naquit le mercredi 17 Rajab 467 à Zamakhshar, au Khwarezm {cite:shadharat-dhahab p. 601} ; d'autres donnent le 27 Rajab 467, soit le 18 mars 1075 {cite:encyclopaedia-of-islam-2 vol. 11 p. 449-450}. Son père, imam de la mosquée locale, lui enseigna le Coran {cite:encyclopaedia-of-islam-2 vol. 12 p. 917}."
  es: "Abu al-Qasim Mahmud ibn Umar ibn Muhammad al-Zamakhshari al-Khwarazmi nació el miércoles 17 de Rajab de 467 en Zamakhshar, en Khwarazm {cite:shadharat-dhahab p. 601}; otros indican el 27 de Rajab de 467, que corresponde al 18 de marzo de 1075 {cite:encyclopaedia-of-islam-2 vol. 11 p. 449-450}. Su padre, imán de la mezquita local, le enseñó el Corán {cite:encyclopaedia-of-islam-2 vol. 12 p. 917}."
  tr: "Ebu el-Kâsım Mahmud ibn Ömer ibn Muhammed el-Zemahşari el-Harezmi, Hicri 467 yılının Receb ayının 17. Çarşamba günü Harezm'in Zemahşar şehrinde doğmuştur {kaynak:şadharat-dhahab s. 601}; bazı kaynaklar ise Hicri 467 yılının Receb ayının 27. gününde, yani Miladi 18 Mart 1075'te doğduğunu belirtmektedir {kaynak:islam-ansiklopedisi-2 cilt 11 s. 449-450}. Babası şehrin camisinin imamıydı ve ona Kur'an öğretti {kaynak:islam-ansiklopedisi-2 cilt 12 s. 917}."
  id: "Abu al-Qasim Mahmud ibn Umar ibn Muhammad al-Zamakhshari al-Khwarizmi lahir pada hari Rabu, tanggal tujuh belas Rajab, 467 H, di Zamakhshar, Khwarazm {cite:shadharat-dhahab hlm. 601}; yang lain menyebutkan bahwa ia lahir pada tanggal 27 Rajab, 467 H, yang bertepatan dengan 18 Maret 1075 M {cite:encyclopaedia-of-islam-2 vol. 11 hlm. 449-450}. Ayahnya adalah imam masjid kota dan mengajarinya Al-Qur'an {cite:encyclopaedia-of-islam-2 vol. 12 hlm. 917}."
