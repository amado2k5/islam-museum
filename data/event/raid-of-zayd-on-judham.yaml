id: event/raid-of-zayd-on-judham
class: event
kind: raid
label: { ar: "غزوة زيد بن حارثة إلى جذام وردّ النبي ما أُخذ منهم", en: "Zayd ibn Haritha's raid on Judham and the Prophet's restitution" }
summary:
  ar: "لما رجع دحية بن خليفة الكلبي من عند قيصر أغار عليه الهنيد بن عوص وابنه من الضليع من جذام بوادي شنار فأخذا ما معه، فاستنقذه له قوم من الضبيب رهط رفاعة بن زيد الذين كانوا قد أسلموا؛ فلما شكا دحية إلى النبي واستسقاه دم الهنيد بعث زيد بن حارثة في جيش فأغار من ناحية الأولاج بالماقص فأخذ المال والناس وقتل الهنيد وابنه ورجلين من بني الأحنف ورجلاً من بني الخصيب، وفي الأسرى من أسلم. فركب نفر من الضبيب فيهم حسان بن ملة إلى زيد فقرأ عليه أم الكتاب فنادى بتحريم ثغرتهم، ثم ركبوا إلى رفاعة بن زيد وساروا معه ثلاث ليال إلى المدينة، فقرأ النبي كتابه لرفاعة وقال: كيف أصنع بالقتلى؟ وبعث علياً بسيفه إلى زيد فردّ على القوم كل ما أُخذ حتى ليبد المرأة. يرويه ابن إسحاق عمن لا يتهم عن رجال من جذام كانوا علماء بها."
  en: "When Dihya ibn Khalifa al-Kalbi returned from Caesar, al-Hunayd ibn Us and his son of the Dula' of Judham robbed him in the valley of Shinar; men of the Dubayb, Rifa'a ibn Zayd's clan who had converted, recovered his goods. When Dihya complained to the Prophet and asked for al-Hunayd's blood, the Prophet sent Zayd ibn Haritha with an army, which raided from al-Awlaj at al-Maqis, took property and people, killed al-Hunayd and his son and three others, and captured converts among them. A party of the Dubayb with Hassan ibn Milla rode to Zayd, who had Umm al-Kitab recited and proclaimed their quarter inviolable; they then rode to Rifa'a and three nights on to Medina, where the Prophet read his own letter to Rifa'a, asked three times what he should do about the dead, and sent Ali with his sword to Zayd, who restored everything down to a woman's cushion. Ibn Ishaq has it from men of Judham learned in it."
