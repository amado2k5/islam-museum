id: event/raid-of-zayd-on-judham
class: event
kind: raid
label: { ar: "غزوة زيد بن حارثة إلى جذام وردّ النبي ما أُخذ منهم", en: "Zayd ibn Haritha's raid on Judham and the Prophet's restitution", es: "La incursión de Zayd ibn Haritha en Judá y la restitución del Profeta", fr: "Le raid de Zayd ibn Haritha sur Judham et la restitution par le Prophète", ur: "زید بن حارثہ کا جدم پر حملہ اور رسول اللہ کا معاوضہ" }
summary:
  ar: "لما رجع دحية بن خليفة الكلبي من عند قيصر أغار عليه الهنيد بن عوص وابنه من الضليع من جذام بوادي شنار فأخذا ما معه، فاستنقذه له قوم من الضبيب رهط رفاعة بن زيد الذين كانوا قد أسلموا؛ فلما شكا دحية إلى النبي واستسقاه دم الهنيد بعث زيد بن حارثة في جيش فأغار من ناحية الأولاج بالماقص فأخذ المال والناس وقتل الهنيد وابنه ورجلين من بني الأحنف ورجلاً من بني الخصيب، وفي الأسرى من أسلم. فركب نفر من الضبيب فيهم حسان بن ملة إلى زيد فقرأ عليه أم الكتاب فنادى بتحريم ثغرتهم، ثم ركبوا إلى رفاعة بن زيد وساروا معه ثلاث ليال إلى المدينة، فقرأ النبي كتابه لرفاعة وقال: كيف أصنع بالقتلى؟ وبعث علياً بسيفه إلى زيد فردّ على القوم كل ما أُخذ حتى ليبد المرأة. يرويه ابن إسحاق عمن لا يتهم عن رجال من جذام كانوا علماء بها."
  en: "When Dihya ibn Khalifa al-Kalbi returned from Caesar, al-Hunayd ibn Us and his son of the Dula' of Judham robbed him in the valley of Shinar; men of the Dubayb, Rifa'a ibn Zayd's clan who had converted, recovered his goods. When Dihya complained to the Prophet and asked for al-Hunayd's blood, the Prophet sent Zayd ibn Haritha with an army, which raided from al-Awlaj at al-Maqis, took property and people, killed al-Hunayd and his son and three others, and captured converts among them. A party of the Dubayb with Hassan ibn Milla rode to Zayd, who had Umm al-Kitab recited and proclaimed their quarter inviolable; they then rode to Rifa'a and three nights on to Medina, where the Prophet read his own letter to Rifa'a, asked three times what he should do about the dead, and sent Ali with his sword to Zayd, who restored everything down to a woman's cushion. Ibn Ishaq has it from men of Judham learned in it."
  es: "Cuando Dihya ibn Khalifa al-Kalbi regresó de César, al-Hunayd ibn Us y su hijo del Dula' de Judham lo robaron en el valle de Shinar; hombres de los Dubayb, del clan de Rifa'a ibn Zayd que se habían convertido, recuperaron sus bienes. Cuando Dihya se quejó al Profeta y pidió la sangre de al-Hunayd, el Profeta envió a Zayd ibn Haritha con un ejército, que asaltó desde al-Awlaj en al-Maqis, tomó propiedades y personas, mató a al-Hunayd y a su hijo y a otros tres, y capturó a conversos entre ellos. Un grupo de los Dubayb con Hassan ibn Milla cabalgó hacia Zayd, quien hizo recitar Umm al-Kitab y proclamó su barrio inviolable; Luego cabalgaron hasta Rifa'a y, tras tres noches, llegaron a Medina, donde el Profeta leyó su propia carta a Rifa'a, le preguntó tres veces qué debía hacer con los muertos y envió a Ali con su espada a Zayd, quien restauró todo, incluso el cojín de una mujer. Ibn Ishaq lo recogió de hombres de Judá versados en el tema."
  fr: "À son retour de César, Dihya ibn Khalifa al-Kalbi fut dépouillé par al-Hunayd ibn Us et son fils, membres de la tribu Dula' de Judham, dans la vallée de Shinar. Des hommes du clan Dubayb, appartenant à Rifa'a ibn Zayd et convertis à l'islam, récupérèrent ses biens. Dihya se plaignit alors au Prophète et réclama la mort d'al-Hunayd. Le Prophète envoya Zayd ibn Haritha à la tête d'une armée qui, partie d'al-Awlaj à al-Maqis, pilla les biens et les personnes, tua al-Hunayd, son fils et trois autres hommes, et fit prisonniers des convertis parmi eux. Un groupe de Dubayb, mené par Hassan ibn Milla, se rendit auprès de Zayd, qui fit réciter le Coran par Umm al-Kitab et proclama leur quartier inviolable. Ils se rendirent ensuite à Rifa'a, puis, trois nuits plus tard, à Médine, où le Prophète lut sa propre lettre à Rifa'a, demanda à trois reprises ce qu'il devait faire des morts, et envoya Ali avec son épée à Zayd, qui rétablit tout, jusqu'au coussin d'une femme. Ibn Ishaq tient ce récit d'hommes de Judham versés en la matière."
  ur: "جب دحیہ بن خلیفہ الکلبی قیصر سے واپس آیا تو الحنید ابن ہم اور اس کے بیٹے جودھم کے دولا نے اسے وادی شنار میں لوٹ لیا۔ دبئی کے مرد، رفاعہ بن زید کے قبیلے نے جو مذہب تبدیل کر لیا تھا، اس کا سامان واپس لے لیا۔ جب دحیہ نے رسول اللہ سے شکایت کی اور الحنید کا خون مانگا تو نبی نے زید بن حارثہ کو ایک لشکر کے ساتھ بھیجا، جس نے العولج سے المقیس کے مقام پر چھاپہ مارا، املاک اور لوگوں کو چھین لیا، الحنید اور اس کے بیٹے اور تین دوسرے لوگوں کو قتل کر دیا، اور ان میں سے مسلمانوں کو گرفتار کر لیا۔ دبئی کی ایک جماعت حسن بن ملہ کے ساتھ زید کے پاس گئی، جس نے ام الکتاب کی تلاوت کی اور ان کے سہ ماہی کو ناقابل تسخیر قرار دیا۔ پھر وہ رفاعہ کی طرف سوار ہوئے اور تین راتیں مدینہ کی طرف روانہ ہوئے، جہاں نبی نے رفاعہ کو اپنا خط پڑھ کر سنایا، تین بار پوچھا کہ آپ کو مردہ کے بارے میں کیا کرنا چاہیے، اور علی کو اپنی تلوار کے ساتھ زید کے پاس بھیجا، جس نے سب کچھ ایک عورت کے گدھے پر بحال کر دیا۔ ابن اسحاق نے اسے جودھم کے لوگوں سے سیکھا ہے۔"
