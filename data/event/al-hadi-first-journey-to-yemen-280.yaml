id: event/al-hadi-first-journey-to-yemen-280
class: event
kind: other
label:
  ar: خروج الهادي الأول إلى اليمن سنة 280هـ
  en: Al-Hadi's first journey to Yemen, 280 AH
  ur: ہادی کا پہلا یمنی سفر، 280ھ
  es: "Primer viaje de Al-Hadi a Yemen, 280 AH"
  fr: "Premier voyage d'Al-Hadi au Yémen, 280 AH"
  tr: "I. Hadi'nin Hicri 280 yılında Yemen'e gidişi."
  id: "Kepergian Al-Hadi I ke Yaman pada tahun 280 Hijriah"
summary:
  ar: خرج الهادي إلى اليمن سنة 280هـ حتى بلغ الشرفة قرب صنعاء، فأطاعه الناس مدة يسيرة ثم خذلوه ولم يجد أعواناً، فانصرف إلى بلده بالحجاز، ثم نزل باليمن البلاء والفتن.
  en: Al-Hadi went to Yemen in 280 AH as far as al-Sharfa near Sana'a, where people obeyed him for a short while and then abandoned him; finding no supporters, he went back to his own country in the Hijaz, and tribulation and strife then befell Yemen.
  ur: ہادی 280ھ میں یمن گئے اور صنعاء کے قریب شرفہ تک پہنچے، جہاں لوگوں نے کچھ مدت ان کی اطاعت کی اور پھر چھوڑ دیا؛ کوئی مددگار نہ ملا تو وہ حجاز میں اپنے وطن لوٹ گئے، اور اس کے بعد یمن پر آزمائش اور فتنے آئے۔
  es: "Al-Hadi viajó a Yemen en el año 280 de la Hégira, hasta al-Sharfa, cerca de Sana'a, donde la gente le obedeció durante un breve período y luego lo abandonó; al no encontrar partidarios, regresó a su país natal en el Hiyaz, y entonces Yemen se vio sumido en la tribulación y la contienda."
  fr: "Al-Hadi se rendit au Yémen en 280 AH jusqu'à al-Sharfa, près de Sanaa, où les gens lui obéirent pendant un court laps de temps avant de l'abandonner; ne trouvant aucun partisan, il retourna dans son pays du Hedjaz, et le Yémen connut alors tribulations et conflits."
  tr: "El-Hadi, Hicri 280 yılında Yemen'e gitti ve Sana'a yakınlarındaki Şurfa'ya ulaştı. Halk kısa bir süre ona itaat etti, sonra onu terk etti ve o da hiçbir yardımcı bulamayınca Hicaz'daki ülkesine geri döndü. Ardından Yemen'de felaket ve karışıklık baş gösterdi."
  id: "Al-Hadi pergi ke Yaman pada tahun 280 Hijriah hingga sampai di Al-Shurfa dekat Sana'a. Orang-orang menaatinya untuk waktu yang singkat, kemudian mereka meninggalkannya dan dia tidak menemukan penolong, sehingga dia kembali ke negaranya di Hijaz. Kemudian malapetaka dan perselisihan menimpa Yaman."
