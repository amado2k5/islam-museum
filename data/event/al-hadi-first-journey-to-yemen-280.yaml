label:
  ar: خروج الهادي الأول إلى اليمن سنة 280هـ
  en: Al-Hadi's first journey to Yemen, 280 AH
  ur: ہادی کا پہلا یمنی سفر، 280ھ
summary:
  ar: خرج الهادي إلى اليمن سنة 280هـ حتى بلغ الشرفة قرب صنعاء، فأطاعه الناس مدة يسيرة ثم خذلوه ولم يجد أعواناً، فانصرف إلى بلده بالحجاز، ثم نزل باليمن البلاء والفتن.
  en: Al-Hadi went to Yemen in 280 AH as far as al-Sharfa near Sana'a, where people obeyed him for a short while and then abandoned him; finding no supporters, he went back to his own country in the Hijaz, and tribulation and strife then befell Yemen.
  ur: ہادی 280ھ میں یمن گئے اور صنعاء کے قریب شرفہ تک پہنچے، جہاں لوگوں نے کچھ مدت ان کی اطاعت کی اور پھر چھوڑ دیا؛ کوئی مددگار نہ ملا تو وہ حجاز میں اپنے وطن لوٹ گئے، اور اس کے بعد یمن پر آزمائش اور فتنے آئے۔
