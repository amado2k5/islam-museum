id: event/rashid-founds-khizanat-al-hikma
class: event
kind: founding
label: { ar: "الرشيد يضع نواة خزانة الحكمة", en: "Al-Rashid lays the nucleus of the House of Wisdom", es: "Al-Rashid sienta las bases de la Casa de la Sabiduría.", fr: "Al-Rashid pose les fondements de la Maison de la Sagesse", ur: "الرشید نے ایوانِ حکمت کا مرکزہ رکھا", tr: "El-Raşid, bilgelik hazinesinin temellerini atıyor.", id: "Al-Rashid meletakkan dasar bagi khazanah kebijaksanaan." }
summary:
  ar: "وضع هارون الرشيد نواة خزانة الحكمة ببغداد، وولّى يوحنا بن ماسويه ترجمة الكتب الطبية القديمة ورتّب له كتاباً حذاقاً، وكان فيها الفضل بن نوبخت ينقل من الفارسية وعلان الشعوبي ينسخ {cite:duha-islam p. 79-81}."
  en: "Harun al-Rashid laid the nucleus of the Khizānat al-Ḥikma at Baghdad: Yūḥannā ibn Māsawayh set over the translation of the ancient medical books with skilled scribes, al-Faḍl ibn Nawbakht rendering Persian into Arabic and ʿAllān al-Shuʿūbī copying {cite:duha-islam p. 79-81}."
  ur: "ہارون الرشید نے بغداد میں خزانۃ الحکمہ کی بنیاد رکھی: یوحنا ابن ماسویہ قدیم طبی کتب کے ترجمے پر مامور، فضل ابن نوبخت فارسی سے ترجمہ کرتا اور علان شعوبی نقل کرتا {cite:duha-islam p. 79-81}."
  es: "Harun al-Rashid sentó las bases del Khizānat al-Ḥikma en Bagdad: Yūḥannā ibn Māsawayh supervisó la traducción de los antiguos libros de medicina con escribas expertos, al-Faḍl ibn Nawbakht tradujo del persa al árabe y ʿAllān al-Shuʿūbī copió {cite:duha-islam p. 79-81}."
  fr: "Harun al-Rashid a posé le noyau du Khizānat al-Ḥikma à Bagdad: Yūḥannā ibn Māsawayh a supervisé la traduction des anciens livres médicaux avec des scribes compétents, al-Faḍl ibn Nawbakht traduisant le persan en arabe et ʿAllān al-Shuʿūbī copiant {cite:duha-islam p. 79-81}."
  tr: "Harun el-Raşid, Bağdat'ta Hikmet Kütüphanesi'nin temelini attı ve Yuhanna ibn Masaveyh'i eski tıp kitaplarını tercüme etmesi için görevlendirdi; ona yetenekli bir kitap temin etti; el-Fadl ibn Nevbakht Farsçadan tercüme yaparken, Allan el-Şu'ubi de kopyalama işini üstlendi. {cite:duha-islam s. 79-81}"
  id: "Harun al-Rashid meletakkan dasar bagi Perpustakaan Kebijaksanaan di Baghdad, dan menunjuk Yuhanna ibn Masawayh untuk menerjemahkan kitab-kitab kedokteran kuno dan menyediakan baginya seorang juru tulis yang terampil, dan al-Fadl ibn Nawbakht menerjemahkan dari bahasa Persia dan Allan al-Shu’ubi menyalinnya {cite:duha-islam hlm. 79-81}."
