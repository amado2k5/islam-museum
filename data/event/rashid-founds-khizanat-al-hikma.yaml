label: { ar: "الرشيد يضع نواة خزانة الحكمة", en: "Al-Rashid lays the nucleus of the House of Wisdom" }
summary:
  ar: "وضع هارون الرشيد نواة خزانة الحكمة ببغداد، وولّى يوحنا بن ماسويه ترجمة الكتب الطبية القديمة ورتّب له كتاباً حذاقاً، وكان فيها الفضل بن نوبخت ينقل من الفارسية وعلان الشعوبي ينسخ {cite:duha-islam p. 79-81}."
  en: "Harun al-Rashid laid the nucleus of the Khizānat al-Ḥikma at Baghdad: Yūḥannā ibn Māsawayh set over the translation of the ancient medical books with skilled scribes, al-Faḍl ibn Nawbakht rendering Persian into Arabic and ʿAllān al-Shuʿūbī copying {cite:duha-islam p. 79-81}."
  ur: "ہارون الرشید نے بغداد میں خزانۃ الحکمہ کی بنیاد رکھی: یوحنا ابن ماسویہ قدیم طبی کتب کے ترجمے پر مامور، فضل ابن نوبخت فارسی سے ترجمہ کرتا اور علان شعوبی نقل کرتا {cite:duha-islam p. 79-81}."
