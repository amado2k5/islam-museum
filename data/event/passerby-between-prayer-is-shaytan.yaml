id: event/passerby-between-prayer-is-shaytan
kind: other
label:
  ar: الماشي بين يدي المصلي شيطان
  en: The one who passes before the praying person is a shaytan
  ur: نمازی کے سامنے گزرنے والا شیطان ہے
summary:
  ar: أمر النبي المصلي ألا يدع أحداً يمر بين يديه وأن يدفعه ما استطاع فإن أبى فليقاتله فإنما هو شيطان {cite:muwatta-maruf-1997} [[passage/muwatta-1-421|الموطأ 421]].
  en: The Prophet ordered the praying person not to let anyone pass between his hands, to push him away as much as he can, and if he refuses let him fight him — for he is only a shaytan {cite:muwatta-maruf-1997} [[passage/muwatta-1-421|Muwatta 421]].
  ur: نبی نے نمازی کو حکم دیا کہ کسی کو اپنے سامنے گزرنے نہ دے اور جتنا ممکن ہو دور کرے، اور اگر وہ انکار کرے تو اس سے لڑے — کیونکہ وہ صرف شیطان ہے {cite:muwatta-maruf-1997} [[passage/muwatta-1-421|موطأ 421]]۔
