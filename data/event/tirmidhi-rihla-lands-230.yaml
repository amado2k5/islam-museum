label:
  ar: "رحلة الترمذي في طلب الحديث بأقاليم خراسان والعراق والحجاز، نحو ٢٣٠هـ"
  en: "Al-Tirmidhi's hadith journeys through the lands of Khurasan, Iraq and the Hijaz, c. 230/845"
  ur: "ترمذی کا طلبِ حدیث کا سفر خراسان، عراق اور حجاز، تقریباً 230ھ/845ء"
summary:
  ar: "طاف الترمذي في رحلته العلمية بأقاليم خراسان والعراق والحجاز وأكثر من السماع والجمع {cite:mawsuat-a3lam-ulama-adaba p. 450}؛ ورحل بعيداً في طلب الحديث عبر خراسان والعراق والحجاز، وكان في عداد تلاميذ البخاري ومسلم وأبي داود السجستاني {cite:encyclopaedia-of-islam-2 vol. 10 p. 579} {cite:mawsuat-a3lam-ulama-adaba p. 451}."
  en: "Al-Tirmidhi ranged on his scholarly journey through the lands of Khurasan, Iraq and the Hijaz, hearing and gathering copiously {cite:mawsuat-a3lam-ulama-adaba p. 450}; he travelled widely in search of traditions through Khurasan, Iraq and the Hijaz, counting among the pupils of al-Bukhari, Muslim and Abu Dawud al-Sijistani {cite:encyclopaedia-of-islam-2 vol. 10 p. 579} {cite:mawsuat-a3lam-ulama-adaba p. 451}."
  ur: "ترمذی نے اپنی علمی مسافرت میں خراسان، عراق اور حجاز کے علاقوں کا سفر کیا اور کثرت سے سماعت و جمع کیا {cite:mawsuat-a3lam-ulama-adaba p. 450}؛ وہ طلبِ حدیث میں خراسان، عراق اور حجاز وسیع سفر کرتے رہے اور بخاری، مسلم اور ابو داؤد سجستانی کے تلامذہ میں شمار ہوئے {cite:encyclopaedia-of-islam-2 vol. 10 p. 579} {cite:mawsuat-a3lam-ulama-adaba p. 451}۔"
