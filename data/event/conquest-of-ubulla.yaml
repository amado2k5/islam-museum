label: { ar: "فتح الأبلة والفرات", en: "Conquest of al-Ubulla and al-Furat", es: "Conquista de al-Ubulla y al-Furat", fr: "Conquête d'al-Ubulla et d'al-Furat", ur: "ابولہ اور الفرات کی فتح", tr: "El-Abla ve Fırat'ın Fethi", id: "Penaklukan Al-Abla dan Efrat" }
summary:
  ar: "غزا عتبة بن غزوان الأبلة ففتحها عنوة وكتب إلى عمر أن الأبلة فرضة البحرين وعمان والهند والصين وأنقذ الكتاب مع نافع بن الحارث الثقفي ثم عبروا الفرات فخرج إليهم أهلها بمساحيهم فظفروا بهم وفتحوا الفرات ووجه مجاشع بن مسعود السلمي على الفرات ففتحه عنوة وأتى المذار فخرج إليه مرزبانها فهزمه الله وغرق عامة من معه وأخذ سلماً فضرب عتبة عنقه وسار إلى دستميسان وقد جمع أهلها فرأى أن يعاجلهم بالغزو ليكون ذلك أفتاً من أعضادهم وأملاً لقلوبهم فهزمهم الله وقتل دهاقينهم وانصرف إلى أبر قباذ ففتحها الله عليه وكان ما بين الفهرج إلى الفرات صلحاً وسائر الأبلة عنوة وقال في الوقعة أردة بنت الحارث امرأة عتبة تحرض: إن يهزموكم تولجوا فينا الغلف وقسم الغنائم زياد وهو غلام ذو ذؤابة على درهمين في اليوم."
  en: "Utba ibn Ghazwan stormed al-Ubulla and wrote Umar — borne by Nafi' ibn al-Harith — that it was the port of Bahrain, Uman, India and China; crossing to al-Furat its folk came out with their spades and were beaten, Mujashi' ibn Mas'ud taking the town by force; at al-Madhar its marzban came out, was routed with most of his men drowned, taken alive and beheaded; at Dastumaysan Utba struck pre-emptively 'to weaken their sides and embolden hearts', killing their dehqans; then Abar Qubadh fell — the tract from al-Fahraj to al-Furat being treaty-land, the rest of Ubulla by force. Utba's wife Arda bint al-Harith goaded the men 'if they rout you, you'll enter us uncircumcised', and the forelocked boy Ziyad divided the spoils at two dirhams a day."
  es: "Utba ibn Ghazwan asaltó al-Ubulla y escribió a Umar —enviado por Nafi' ibn al-Harith— que era el puerto de Bahrain, Uman, India y China; al cruzar a al-Furat, su gente salió con sus palas y fue golpeada, Mujashi' ibn Mas'ud tomó la ciudad por la fuerza; en al-Madhar salió su marzban, fue derrotado y la mayoría de sus hombres se ahogaron, fueron capturados vivos y decapitados; en Dastumaysan, Utba atacó preventivamente 'para debilitar sus flancos y envalentonar sus corazones', matando a sus dehqans; luego cayó Abar Qubadh —el territorio desde al-Fahraj hasta al-Furat era territorio por tratado, el resto de Ubulla fue tomado por la fuerza. La esposa de Utba, Arda bint al-Harith, incitó a los hombres diciendo: \"Si os derrotan, entraréis sin circuncidar\", y el muchacho Ziyad, con el flequillo rapado, repartió el botín a razón de dos dirhams al día."
  fr: "Utba ibn Ghazwan prit d'assaut al-Ubulla et écrivit à Umar — porté par Nafi' ibn al-Harith — que c'était le port de Bahreïn, d'Uman, de l'Inde et de la Chine; traversant vers al-Furat, ses habitants sortirent avec leurs pelles et furent battus, Mujashi' ibn Mas'ud prenant la ville par la force; à al-Madhar, son marzban sortit, fut mis en déroute, la plupart de ses hommes se noyèrent, furent capturés vivants et décapités; à Dastumaysan, Utba frappa préventivement « pour affaiblir leurs flancs et enhardir leurs cœurs », tuant leurs dehqans; puis Abar Qubadh tomba — la région d'al-Fahraj à al-Furat étant une terre de traité, le reste d'Ubulla par la force. L'épouse d'Utba, Arda bint al-Harith, provoqua les hommes: « S'ils vous mettent en déroute, vous entrerez chez nous incirconcis », et le garçon à la mèche rebelle, Ziyad, partagea le butin à raison de deux dirhams par jour."
  ur: "عتبہ ابن غزوان نے العبولہ پر حملہ کیا اور عمر نے لکھا - جس کی پیدائش نافع بن الحارث نے کی تھی - کہ یہ بحرین، عمان، ہندوستان اور چین کی بندرگاہ تھی۔ الفرات کو عبور کرتے ہوئے اس کے لوگ اپنی کودالیں لے کر باہر نکلے اور انہیں مارا پیٹا گیا، مجاشی ابن مسعود نے زبردستی شہر پر قبضہ کر لیا۔ المدھار کے مقام پر اس کا مرزبان نکلا، اس کے بیشتر آدمیوں کو غرق کر کے مارا گیا، زندہ لیا گیا اور سر قلم کر دیا گیا۔ دستومیسن عتبہ میں 'ان کے پہلوؤں کو کمزور کرنے اور دلوں کو ہمت دینے کے لیے' پہلے سے حملہ کیا، جس سے ان کے دہقان مارے گئے۔ پھر ابر قباد گر گیا - الفراج سے الفرات تک کا علاقہ معاہدہ کی زمین تھا، باقی ابلہ طاقت کے ذریعے۔ عتبہ کی بیوی اردہ بنت الحارث نے مردوں کو گالی دی کہ 'اگر وہ تمہیں مار ڈالیں گے تو تم ہمارے پاس بغیر ختنہ کے داخل کرو گے'، اور پیشانی بند لڑکے زیاد نے مال غنیمت کو دو درہم ایک دن میں تقسیم کیا۔"
  tr: "Utbe ibn Gazvan, Ubla şehrine saldırdı ve zorla ele geçirdi. Ömer'e Ubla'nın Bahreyn, Umman, Hindistan ve Çin'in limanı olduğunu yazdı. Mektubu Nafi' ibn Al-Harith Al-Thaqafi ile gönderdi. Sonra Fırat Nehri'ni geçtiler ve halkı onlara karşı kazmalarıyla çıktı, bu yüzden onları yendiler ve Fırat'ı fethettiler. Mücaşi' ibn Mes'ud Al-Sulami'yi Fırat'a gönderdi ve o da zorla ele geçirdi. Al-Madhar'a geldi ve Marzban halkı ona karşı çıktı, bu yüzden Allah onu yendi ve yanındakilerin çoğu boğuldu. Selam'ı aldı, bu yüzden Utbe onun başını kesti ve Dastamisan'a gitti, oradaki halkı toplamıştı. Onların desteğini zayıflatmak ve kalplerine umut vermek için onlara saldırmak için acele etmesi gerektiğini gördü. Böylece Allah onları yendi ve toprak sahiplerini öldürdü ve Abar Kubadh'a yöneldi, Allah orayı da onun için fethetti. Fahraj ile Fırat arasındaki bölge barış yoluyla, Ubla'nın geri kalanı ise zorla ele geçirildi. Utbah'ın karısı Arda bint el-Harith savaşta kışkırtıcı bir şekilde şöyle dedi: \"Eğer sizi yenerlerse, sünnetsizleri de aramıza getirecekler.\" Alnında perçemi olan köle Ziyad ise ganimetleri günde iki dirhem olarak paylaştırdı."
  id: "Utbah bin Ghazwan menyerbu Al-Ubla dan menaklukkannya dengan kekerasan. Ia menulis kepada Umar bahwa Al-Ubla adalah pelabuhan Bahrain, Oman, India, dan Cina. Ia mengirim surat itu bersama Nafi' bin Al-Harith Al-Thaqafi. Kemudian mereka menyeberangi Sungai Eufrat, dan penduduknya keluar menemui mereka dengan cangkul mereka, sehingga mereka mengalahkan mereka dan menaklukkan Eufrat. Ia mengirim Mujashi' bin Mas'ud Al-Sulami ke Eufrat, dan ia menaklukkannya dengan kekerasan. Ia sampai di Al-Madhar, dan Marzbannya keluar menemuinya, sehingga Allah mengalahkannya, dan sebagian besar orang yang bersamanya tenggelam. Ia mengambil Salam, lalu Utbah memenggal kepalanya dan pergi ke Dastamisan, dan ia telah mengumpulkan penduduknya. Ia melihat bahwa ia harus segera menyerang mereka agar hal ini melemahkan dukungan mereka dan memberi harapan di hati mereka. Maka Allah mengalahkan mereka dan membunuh para pemilik tanah mereka, dan ia pergi ke Abar Qubadh, sehingga Allah menaklukkannya untuknya. Dan wilayah antara Al-Fahraj dan Eufrat ditaklukkan dengan damai, sedangkan wilayah Al-Ubla lainnya ditaklukkan dengan kekerasan. Dan Arda binti Al-Harith, istri Utbah, berkata dalam pertempuran, menghasut: Jika mereka mengalahkanmu, mereka akan membawa orang-orang yang tidak disunat di antara kita. Dan Ziyad, seorang budak yang memiliki sehelai rambut di dahi, membagi rampasan perang dengan dua dirham sehari."
