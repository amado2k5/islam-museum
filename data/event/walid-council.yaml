label: { en: "al-Walid's council on how to brand the Prophet", ar: "مجلس الوليد بن المغيرة" }
summary:
  en: "With the pilgrimage season approaching, Quraysh's leaders sat with al-Walid ibn al-Mughira to agree one word to say to the Arabs about Muhammad; he rejected 'soothsayer', 'madman', 'poet' and even 'sorcerer' as literal descriptions, then advised them to call his word sorcery that separates a man from his family — and they sat on the pilgrims' roads warning people of him."
  ar: "مع قرب موسم الحج اجتمع سادات قريش إلى الوليد بن المغيرة ليقولوا في محمد كلمة واحدة للعرب؛ فرد الوليد عليهم «كاهن» و«مجنون» و«شاعر» و«ساحر» على وجهها، ثم أشار بأن يقولوا: ساحر يفرق بين المرء وأهله — فجلسوا بسبل الناس يحذرونهم إياه، وأبو لهب يتبع النبي في المواسم يكذبه."
