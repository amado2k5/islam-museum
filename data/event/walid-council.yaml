label: { en: "al-Walid's council on how to brand the Prophet", ar: "مجلس الوليد بن المغيرة", es: "El consejo de al-Walid sobre cómo marcar al Profeta", fr: "Le conseil d'al-Walid sur la manière de marquer le Prophète", ur: "الولید کی کونسل اس بارے میں کہ نبی کو کیسے برانڈ کیا جائے۔" }
summary:
  en: "With the pilgrimage season approaching, Quraysh's leaders sat with al-Walid ibn al-Mughira to agree one word to say to the Arabs about Muhammad; he rejected 'soothsayer', 'madman', 'poet' and even 'sorcerer' as literal descriptions, then advised them to call his word sorcery that separates a man from his family — and they sat on the pilgrims' roads warning people of him."
  ar: "مع قرب موسم الحج اجتمع سادات قريش إلى الوليد بن المغيرة ليقولوا في محمد كلمة واحدة للعرب؛ فرد الوليد عليهم «كاهن» و«مجنون» و«شاعر» و«ساحر» على وجهها، ثم أشار بأن يقولوا: ساحر يفرق بين المرء وأهله — فجلسوا بسبل الناس يحذرونهم إياه، وأبو لهب يتبع النبي في المواسم يكذبه."
  es: "Ante la proximidad de la temporada de peregrinación, los líderes de Quraysh se reunieron con al-Walid ibn al-Mughira para acordar una sola palabra que usarían para referirse a Mahoma ante los árabes. Rechazó los términos \"adivino\", \"loco\", \"poeta\" e incluso \"hechicero\" como descripciones literales, y les aconsejó que llamaran a su palabra \"hechicería que separa a un hombre de su familia\". Así, se sentaron en los caminos de los peregrinos advirtiendo a la gente sobre él."
  fr: "À l'approche de la saison du pèlerinage, les chefs de Quraysh se réunirent avec al-Walid ibn al-Mughira pour convenir d'un seul mot à dire aux Arabes au sujet de Mahomet; il rejeta les termes « devin », « fou », « poète » et même « sorcier » comme descriptions littérales, puis leur conseilla de qualifier son mot de sorcellerie qui sépare un homme de sa famille — et ils s'assirent sur les routes des pèlerins pour mettre les gens en garde contre lui."
  ur: "حج کا موسم قریب آنے کے ساتھ، قریش کے رہنما ولید بن المغیرہ کے ساتھ بیٹھ گئے تاکہ محمد کے بارے میں عربوں سے ایک لفظ کہنے پر اتفاق کیا جا سکے۔ اس نے 'جادوگر'، 'دیوانہ'، 'شاعر' اور یہاں تک کہ 'جادوگر' کو لفظی وضاحت کے طور پر مسترد کر دیا، پھر انہیں مشورہ دیا کہ وہ اس کے لفظ کو جادو کہتے ہیں جو ایک آدمی کو اس کے خاندان سے الگ کر دیتا ہے - اور وہ حجاج کی سڑکوں پر بیٹھ کر لوگوں کو اس سے متنبہ کرتے رہے۔"
