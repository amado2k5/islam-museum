label: { ar: "وقعة داهر ومقتله", en: "The Battle and Death of Dahir", es: "La batalla y la muerte de Dahir", fr: "La bataille et la mort de Dahir", ur: "داہر کی جنگ اور موت" }
summary:
  ar: "احتال محمد لعبور مهوان حتى عبره مما يلي بلاد راسل ملك قشة من الهند على جسر عقده وداهر مستخف به لاه عنه ولقيه محمد والمسلمون وهو على فيل وحوله الفيلة ومعه الكاكرة فاقتتلوا قتالاً شديداً لم يسمع بمثله وترجل داهر وقاتل فقتل عند المساء وانهزم المشركون فقتلهم المسلمون كيف شاءوا وكان الذي قتله في رواية المدائني رجل من بني كلاب وقال الغيل تشهد يوم داهر والقنا يحمد القاسم بن محمد."
  en: "Muhammad stole across the Mihwan by a contrived bridge near Rasal's land of Qissa while Dahir scorned the threat; they met — Dahir on his elephant ringed by elephants and the Kakira — in a battle like none heard of, till dismounted he fought and fell at evening, the mushrikun routed and cut down at will. Al-Mada'ini names his killer a man of Banu Kilab: 'the spears bore witness on Dahir's day, and praised al-Qasim ibn Muhammad'."
  es: "Muhammad cruzó sigilosamente el Mihwan por un puente improvisado cerca de la tierra de Rasal, Qissa, mientras Dahir despreciaba la amenaza. Se enfrentaron —Dahir en su elefante, rodeado de elefantes y los Kakira— en una batalla sin precedentes, hasta que, desmontado, luchó y cayó al anochecer. Los politeístas fueron derrotados y abatidos a placer. Al-Mada'ini nombra a su asesino a un hombre de Banu Kilab: «Las lanzas dieron testimonio en el día de Dahir y alabaron a al-Qasim ibn Muhammad»."
  fr: "Muhammad traversa furtivement le Mihwan par un pont improvisé près de Qissa, terre de Rasal, tandis que Dahir ignorait la menace. Ils s'affrontèrent – Dahir sur son éléphant, encerclé par d'autres éléphants et les Kakira – dans un combat d'une violence inouïe. À pied, il continua le combat et tomba au crépuscule, les polythéistes mis en déroute et abattus à sa guise. Al-Mada'ini nomme son assassin un homme des Banu Kilab: « Les lances témoignèrent le jour de la mort de Dahir et louèrent al-Qasim ibn Muhammad. »"
  ur: "محمد نے قصہ کی رسل کی سرزمین کے قریب ایک تعمیر شدہ پل سے میہوان کے پار چوری کی جبکہ داہر نے اس دھمکی کو ٹھکرایا۔ ان کی ملاقات ہوئی — داہر اپنے ہاتھی پر ہاتھیوں اور کاکیرا سے گھنٹی ہوئی — ایک ایسی لڑائی میں جس کے بارے میں کسی نے نہیں سنا تھا، یہاں تک کہ وہ لڑتا رہا اور شام کو گر گیا، مشرکین نے اپنی مرضی سے شکست دی اور کاٹ دی۔ المدائنی نے اپنے قاتل کا نام بنو کلاب کے آدمی بتایا: 'دہر کے دن نیزوں نے گواہی دی اور القاسم بن محمد کی تعریف کی'۔"
