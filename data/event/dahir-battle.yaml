label: { ar: "وقعة داهر ومقتله", en: "The Battle and Death of Dahir" }
summary:
  ar: "احتال محمد لعبور مهوان حتى عبره مما يلي بلاد راسل ملك قشة من الهند على جسر عقده وداهر مستخف به لاه عنه ولقيه محمد والمسلمون وهو على فيل وحوله الفيلة ومعه الكاكرة فاقتتلوا قتالاً شديداً لم يسمع بمثله وترجل داهر وقاتل فقتل عند المساء وانهزم المشركون فقتلهم المسلمون كيف شاءوا وكان الذي قتله في رواية المدائني رجل من بني كلاب وقال الغيل تشهد يوم داهر والقنا يحمد القاسم بن محمد."
  en: "Muhammad stole across the Mihwan by a contrived bridge near Rasal's land of Qissa while Dahir scorned the threat; they met — Dahir on his elephant ringed by elephants and the Kakira — in a battle like none heard of, till dismounted he fought and fell at evening, the mushrikun routed and cut down at will. Al-Mada'ini names his killer a man of Banu Kilab: 'the spears bore witness on Dahir's day, and praised al-Qasim ibn Muhammad'."
