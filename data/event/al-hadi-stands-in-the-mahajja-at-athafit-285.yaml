id: event/al-hadi-stands-in-the-mahajja-at-athafit-285
class: event
kind: other
label:
  ar: ثبات الهادي في المحجة أمام الدعام وروايات حاضريه، الجمعة 14 شوال 285هـ
  en: Al-Hadi's stand in the main track before al-Da'am and the accounts of those present, Friday 14 Shawwal 285 AH
  ur: دعام کے سامنے بڑی راہ میں ہادی کا ڈٹے رہنا اور حاضرین کی روایات، جمعہ 14 شوال 285ھ
summary:
  ar: 'يروي الكتاب أن الهادي لم يكن معه عند خروج الدعام إلا سبعة فرسان منهم عبد الله بن الحسين الفطيمي، فتقدم ووقف في بطن المحجة، فحمل عليه الدعام بمئة فارس وألف راجل مراراً فلم يتزحزح، ويورد ثلاث روايات: راوٍ من أصحابه، ثم سعيد بن أبي سورة من فرسان الدعام يقول إن ثلاثين فارساً حملوا عليه فيبست أيديهم على رماحهم وألقي في قلوبهم الرعب، ثم قول الهادي نفسه لمحمد بن سليمان.'
  en: 'The book tells that when al-Da''am came out al-Hadi had only seven horsemen, among them Abdullah ibn al-Husayn al-Futayimi; he went forward and stood in the middle of the main track, and al-Da''am charged him many times with a hundred horse and a thousand foot, yet he did not budge; it gives three accounts: one of his companions, then Sa''id ibn Abi Sura, one of al-Da''am''s horsemen, who says thirty horsemen charged and their hands stiffened on their lances and fear was cast in their hearts, then al-Hadi''s own words to Muhammad ibn Sulayman.'
  ur: 'کتاب بتاتی ہے کہ جب دعام نکلا تو ہادی کے ساتھ صرف سات سوار تھے جن میں عبد اللہ بن الحسین الفطیمی تھے؛ وہ آگے بڑھ کر بڑی راہ کے بیچ کھڑے ہو گئے اور دعام نے سو سواروں اور ہزار پیادوں کے ساتھ بار بار حملہ کیا مگر وہ اپنی جگہ سے نہ ہلے؛ کتاب تین روایتیں دیتی ہے: ان کے ایک ساتھی کی، پھر دعام کے سواروں میں سے سعید بن ابی سورہ کی جو کہتا ہے کہ تیس سواروں نے حملہ کیا تو ان کے ہاتھ نیزوں پر اکڑ گئے اور دلوں میں رعب ڈال دیا گیا، پھر ہادی کا اپنا قول محمد بن سلیمان سے۔'
