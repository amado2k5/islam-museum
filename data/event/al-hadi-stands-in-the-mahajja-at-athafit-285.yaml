id: event/al-hadi-stands-in-the-mahajja-at-athafit-285
class: event
kind: other
label:
  ar: ثبات الهادي في المحجة أمام الدعام وروايات حاضريه، الجمعة 14 شوال 285هـ
  en: Al-Hadi's stand in the main track before al-Da'am and the accounts of those present, Friday 14 Shawwal 285 AH
  ur: دعام کے سامنے بڑی راہ میں ہادی کا ڈٹے رہنا اور حاضرین کی روایات، جمعہ 14 شوال 285ھ
  es: "La postura de Al-Hadi en la pista principal frente a Al-Da'am y los testimonios de los presentes, viernes 14 de Shawwal de 285 AH."
  fr: "La position d'Al-Hadi sur la voie principale devant al-Da'am et les témoignages des personnes présentes, vendredi 14 Shawwal 285 AH"
  tr: "Al-Hadi'nin Al-Da'am huzurunda doğru yolda gösterdiği sebat ve orada bulunanların rivayetleri, Cuma, Şevval 285 Hicri, 14 Şubat 2020"
  id: "Keteguhan hati Al-Hadi di jalan yang benar sebelum Al-Da’am dan riwayat-riwayat dari orang-orang yang hadir, Jumat, 14 Syawal 285 H"
summary:
  ar: 'يروي الكتاب أن الهادي لم يكن معه عند خروج الدعام إلا سبعة فرسان منهم عبد الله بن الحسين الفطيمي، فتقدم ووقف في بطن المحجة، فحمل عليه الدعام بمئة فارس وألف راجل مراراً فلم يتزحزح، ويورد ثلاث روايات: راوٍ من أصحابه، ثم سعيد بن أبي سورة من فرسان الدعام يقول إن ثلاثين فارساً حملوا عليه فيبست أيديهم على رماحهم وألقي في قلوبهم الرعب، ثم قول الهادي نفسه لمحمد بن سليمان.'
  en: 'The book tells that when al-Da''am came out al-Hadi had only seven horsemen, among them Abdullah ibn al-Husayn al-Futayimi; he went forward and stood in the middle of the main track, and al-Da''am charged him many times with a hundred horse and a thousand foot, yet he did not budge; it gives three accounts: one of his companions, then Sa''id ibn Abi Sura, one of al-Da''am''s horsemen, who says thirty horsemen charged and their hands stiffened on their lances and fear was cast in their hearts, then al-Hadi''s own words to Muhammad ibn Sulayman.'
  ur: 'کتاب بتاتی ہے کہ جب دعام نکلا تو ہادی کے ساتھ صرف سات سوار تھے جن میں عبد اللہ بن الحسین الفطیمی تھے؛ وہ آگے بڑھ کر بڑی راہ کے بیچ کھڑے ہو گئے اور دعام نے سو سواروں اور ہزار پیادوں کے ساتھ بار بار حملہ کیا مگر وہ اپنی جگہ سے نہ ہلے؛ کتاب تین روایتیں دیتی ہے: ان کے ایک ساتھی کی، پھر دعام کے سواروں میں سے سعید بن ابی سورہ کی جو کہتا ہے کہ تیس سواروں نے حملہ کیا تو ان کے ہاتھ نیزوں پر اکڑ گئے اور دلوں میں رعب ڈال دیا گیا، پھر ہادی کا اپنا قول محمد بن سلیمان سے۔'
  es: "El libro cuenta que cuando al-Da'am salió, al-Hadi solo tenía siete jinetes, entre ellos Abdullah ibn al-Husayn al-Futayimi; avanzó y se paró en medio del camino principal, y al-Da'am lo atacó muchas veces con cien caballos y mil infantes, pero no se movió; da tres relatos: uno de sus compañeros, luego Sa'id ibn Abi Sura, uno de los jinetes de al-Da'am, quien dice que treinta jinetes cargaron y sus manos se endurecieron sobre sus lanzas y el miedo se apoderó de sus corazones, luego las propias palabras de al-Hadi a Muhammad ibn Sulayman."
  fr: "Le livre raconte que lorsque al-Da'am se présenta, al-Hadi ne disposait que de sept cavaliers, parmi lesquels Abdullah ibn al-Husayn al-Futayimi; il s'avança et se tint au milieu de la voie principale, et al-Da'am le chargea à plusieurs reprises avec une centaine de cavaliers et un millier d'infanterie, mais il ne broncha pas; il rapporte trois témoignages: celui d'un de ses compagnons, puis celui de Sa'id ibn Abi Sura, un des cavaliers d'al-Da'am, qui raconte que trente cavaliers chargèrent, leurs mains se raidirent sur leurs lances et la peur s'empara de leurs cœurs, puis les propres paroles d'al-Hadi à Muhammad ibn Sulayman."
  tr: "Kitapta, el-Da'am yola çıktığında el-Hadi'nin yanında Abdullah bin el-Hüseyin el-Fatimi de dahil olmak üzere sadece yedi süvarisi olduğu anlatılıyor. El-Hadi ilerleyip yolun ortasında durdu ve el-Da'am ona yüz süvari ve bin piyadeyle defalarca saldırdı, ancak o yerinden kıpırdamadı. Kitapta üç farklı anlatım yer alıyor: önce arkadaşlarından bir rivayet, ardından el-Da'am'ın süvarilerinden Said bin Abi Surah'ın, otuz süvarinin ona saldırdığını, ancak ellerinin mızraklarında felç olduğunu ve kalplerine korkunun çöktüğünü söylediği; son olarak da el-Hadi'nin Muhammed bin Süleyman'a kendi sözleri."
  id: "Kitab tersebut menceritakan bahwa al-Hadi hanya memiliki tujuh penunggang kuda bersamanya ketika al-Da’am keluar, termasuk Abdullah bin al-Hussein al-Fatimi. Ia maju dan berdiri di tengah jalan, dan al-Da’am menyerangnya berulang kali dengan seratus penunggang kuda dan seribu tentara berjalan kaki, tetapi ia tidak bergeming. Kitab itu memuat tiga riwayat: seorang perawi dari para sahabatnya, kemudian Saeed bin Abi Surah dari pasukan berkuda al-Da’am, yang mengatakan bahwa tiga puluh penunggang kuda menyerangnya, tetapi tangan mereka lumpuh karena tombak mereka dan rasa takut menyelimuti hati mereka, kemudian kata-kata al-Hadi sendiri kepada Muhammad bin Sulaiman."
