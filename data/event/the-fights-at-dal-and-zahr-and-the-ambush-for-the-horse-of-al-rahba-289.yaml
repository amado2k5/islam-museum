id: event/the-fights-at-dal-and-zahr-and-the-ambush-for-the-horse-of-al-rahba-289
class: event
kind: other
label:
  ar: "مرض الهادي والقتال بضلع وظهر وكمين خيل الرحبة، سنة 289هـ"
  en: "Al-Hadi's illness, the fights at Dal' and Zahr and the ambush for the horse of al-Rahba, 289 AH"
  ur: "ہادی کی بیماری، ضلع اور ظہر کی لڑائیاں اور رحبہ کے سواروں کا کمین، سنہ 289ھ"
summary:
  ar: "بعد عودة الهادي إلى صنعاء مرض مرضاً اشتد حتى قال الناس إنه هلك، ثم أمر عسكراً بالخروج إلى عسكر القوم بضلع فقتلوا جماعة وأتوا برؤوسهم إلى صنعاء، وخرج عبد الله بن الحسين إلى عسكر ظهر في واد عسر فقتل نفراً وانصرف، ثم كمن عسكر لخيل تخرج إلى الرحبة لقطع الطريق فاقتتلوا وأصيب فرسان وأُخذت دواب."
  en: "After al-Hadi returned to Sana'a he fell ill, so gravely that people said he had died; later he sent an army against the men's camp at Dal', which killed many and brought their heads to Sana'a; Abdullah ibn al-Husayn went to the Zahr camp in a hard valley, killed some of their horse and foot and came back; and an ambush was laid for horse that went out to al-Rahba to cut the road, and a fight followed in which riders were struck down and mounts taken."
  ur: "صنعاء لوٹنے کے بعد ہادی بیمار ہوئے اور بیماری اتنی بڑھی کہ لوگ کہنے لگے کہ وہ وفات پا گئے؛ بعد میں انہوں نے ایک لشکر کو ضلع میں مخالفوں کے پڑاؤ پر بھیجا جس نے بہت سے مارے اور ان کے سر صنعاء لائے؛ عبداللہ بن الحسین ظہر کے پڑاؤ پر ایک دشوار وادی میں ٹوٹے، کچھ سوار اور پیادے مارے اور لوٹ آئے؛ اور رحبہ کی طرف راستہ کاٹنے کے لیے نکلنے والے سواروں کے لیے کمین لگایا گیا جس میں کئی سوار گرائے گئے اور گھوڑے چھین لیے گئے۔"
