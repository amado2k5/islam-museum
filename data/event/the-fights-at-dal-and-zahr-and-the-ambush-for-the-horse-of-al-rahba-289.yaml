id: event/the-fights-at-dal-and-zahr-and-the-ambush-for-the-horse-of-al-rahba-289
class: event
kind: other
label:
  ar: "مرض الهادي والقتال بضلع وظهر وكمين خيل الرحبة، سنة 289هـ"
  en: "Al-Hadi's illness, the fights at Dal' and Zahr and the ambush for the horse of al-Rahba, 289 AH"
  ur: "ہادی کی بیماری، ضلع اور ظہر کی لڑائیاں اور رحبہ کے سواروں کا کمین، سنہ 289ھ"
  es: "La enfermedad de Al-Hadi, las batallas de Dal' y Zahr y la emboscada al caballo de al-Rahba, 289 AH."
  fr: "La maladie d'Al-Hadi, les combats de Dal' et de Zahr et l'embuscade pour le cheval d'al-Rahba, 289 AH"
  tr: "Hicri 289 yılında El-Hadi'nin hastalığı, Dhal ve Dhahr'daki çatışmalar ve El-Rahba'nın atlarına yapılan pusu olayları."
  id: "Penyakit Al-Hadi, pertempuran di Dhal' dan Dhahr, dan penyergapan kuda-kuda Al-Rahba, pada tahun 289 Hijriah."
summary:
  ar: "بعد عودة الهادي إلى صنعاء مرض مرضاً اشتد حتى قال الناس إنه هلك، ثم أمر عسكراً بالخروج إلى عسكر القوم بضلع فقتلوا جماعة وأتوا برؤوسهم إلى صنعاء، وخرج عبد الله بن الحسين إلى عسكر ظهر في واد عسر فقتل نفراً وانصرف، ثم كمن عسكر لخيل تخرج إلى الرحبة لقطع الطريق فاقتتلوا وأصيب فرسان وأُخذت دواب."
  en: "After al-Hadi returned to Sana'a he fell ill, so gravely that people said he had died; later he sent an army against the men's camp at Dal', which killed many and brought their heads to Sana'a; Abdullah ibn al-Husayn went to the Zahr camp in a hard valley, killed some of their horse and foot and came back; and an ambush was laid for horse that went out to al-Rahba to cut the road, and a fight followed in which riders were struck down and mounts taken."
  ur: "صنعاء لوٹنے کے بعد ہادی بیمار ہوئے اور بیماری اتنی بڑھی کہ لوگ کہنے لگے کہ وہ وفات پا گئے؛ بعد میں انہوں نے ایک لشکر کو ضلع میں مخالفوں کے پڑاؤ پر بھیجا جس نے بہت سے مارے اور ان کے سر صنعاء لائے؛ عبداللہ بن الحسین ظہر کے پڑاؤ پر ایک دشوار وادی میں ٹوٹے، کچھ سوار اور پیادے مارے اور لوٹ آئے؛ اور رحبہ کی طرف راستہ کاٹنے کے لیے نکلنے والے سواروں کے لیے کمین لگایا گیا جس میں کئی سوار گرائے گئے اور گھوڑے چھین لیے گئے۔"
  es: "Tras el regreso de al-Hadi a Sana'a, enfermó gravemente, hasta el punto de que se decía que había muerto. Posteriormente, envió un ejército contra el campamento de hombres en Dal', donde mataron a muchos y llevaron sus cabezas a Sana'a. Abdullah ibn al-Husayn fue al campamento de Zahr, situado en un valle escarpado, mató a algunos de sus caballos y soldados de infantería y regresó. Se tendió una emboscada a los caballos que se dirigían a al-Rahba para cortar el camino, y se produjo una lucha en la que varios jinetes fueron abatidos y sus monturas capturadas."
  fr: "Après son retour à Sanaa, al-Hadi tomba malade, si gravement que l'on crut qu'il était mort; plus tard, il envoya une armée contre le camp des hommes à Dal', qui en tua beaucoup et ramena leurs têtes à Sanaa; Abdullah ibn al-Husayn se rendit au camp de Zahr dans une vallée difficile, tua quelques-uns de leurs cavaliers et fantassins et revint; et une embuscade fut tendue à la cavalerie qui se rendait à al-Rahba pour couper la route, et un combat s'ensuivit au cours duquel des cavaliers furent abattus et des montures capturées."
  tr: "El-Hadi Sana'a'ya döndükten sonra ağır bir hastalığa yakalandı ve insanlar onun öldüğünü söylediler. Bunun üzerine Dhal'a'daki halkın ordusuna bir ordu gönderdi ve bir grup insanı öldürüp başlarını Sana'a'ya getirdiler. Abdullah bin El-Hüseyin, zorlu bir vadideki Dhahr ordusuna gitti, bir grup insanı öldürdü ve oradan ayrıldı. Daha sonra, El-Rahba'ya giden atları pusuya düşüren bir ordu yola koyuldu ve çatışma çıktı; atlılar yaralandı ve hayvanlar ele geçirildi."
  id: "Setelah Al-Hadi kembali ke Sana'a, ia jatuh sakit parah sehingga orang-orang mengatakan ia telah meninggal. Kemudian ia memerintahkan pasukan untuk menyerang pasukan orang-orang di Dhal'a, dan mereka membunuh sekelompok orang dan membawa kepala mereka ke Sana'a. Abdullah bin Al-Hussein menyerang pasukan Dhahr di lembah yang sulit, membunuh sekelompok orang, dan pergi. Kemudian pasukan lain menunggu kuda-kuda yang menuju Al-Rahba untuk memutus jalan, dan mereka bertempur, dan beberapa penunggang kuda terluka, dan hewan-hewan ternak disita."
