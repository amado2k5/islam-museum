label:
  ar: "الكتاب إلى بني الحارث: تغيير النعمة وقرية الكفران، ص275-276"
  en: "Al-Hadi's letter to Banu al-Harith: the favour that will change and the ungrateful town, pp. 275-276"
  ur: "بنو حارث کے نام ہادی کا خط: نعمت کی تبدیلی اور ناشکری بستی، ص275-276"
summary:
  ar: "يتابع كتاب الهادي إلى بني الحارث في ص276: يقول إن الله أراد تغيير نعمتهم بعد أن ابتدأهم بالخير بلا استحقاق منهم، ويذكر بآيات من يطغى عند الغنى وبقرية كفرت بأنعم الله، ويقول إن المكر لا يحيق إلا بأهله."
  en: "The letter to Banu al-Harith goes on at p. 276: al-Hadi says God willed to change the favour He had begun with no merit of theirs, recalls the Qur'anic reproach of one who grows rebellious in plenty and of a town that denied God's favours, and says scheming returns only on the schemers."
  ur: "ص276 پر بنو حارث کے نام خط جاری رہتا ہے: ہادی کہتے ہیں کہ اللہ نے ان کی نعمت بدلنے کا ارادہ کیا جو بلا استحقاق شروع ہوئی تھی، دولت میں سرکشی اور ناشکری بستی کا قرآنی ذکر کرتے ہیں اور کہتے ہیں کہ مکر مکر کرنے والوں ہی پر لوٹتا ہے۔"
