class: event
kind: law-enacted
label: { ar: "استحداث صلاح الدين القضاء الشافعي بمصر", en: "Salah al-Din Establishes the Shafi'i Judiciary in Egypt", es: "Salah al-Din establece el sistema judicial shafi'í en Egipto.", fr: "Saladin établit le système judiciaire chaféite en Égypte", ur: "صلاح الدین نے مصر میں شافعی عدلیہ قائم کیا۔", tr: "Selahaddin, Mısır'da Şafiî yargı sistemini kurdu.", id: "Saladin mendirikan sistem peradilan Syafi'i di Mesir." }
summary:
  ar: "في سنة ست وستين وخمسمائة هدم صلاح الدين بمصر داراً للشحنة تسمى دار المعونة كان يُحبس فيها من يريد حبسه وبناها مدرسة للشافعية وأزال ما كان فيها من الظلم، وبنى دار العدل مدرسة للشافعية أيضاً، وعزل قضاة المصريين وكانوا شيعة وأقام قاضياً شافعياً في مصر استناب القضاة الشافعية في جميع البلاد في العشرين من جمادى الآخرة، واشترى تقي الدين عمر ابن أخي صلاح الدين منازل العز بمصر وبناها مدرسة للشافعية {cite:kamil-ibn-al-athir p. 32}."
  en: "In 566 Salah al-Din demolished a house of the shihna (the garrison prefect) in Egypt called Dar al-Ma'una, where people were held at will, and built it as a Shafi'i madrasa, removing the injustice practised there. He also built Dar al-Adl as a Shafi'i madrasa, dismissed the Egyptian judges, who were Shi'is, and appointed a Shafi'i chief judge over Egypt, who deputed Shafi'i judges in all the lands on the twentieth of Jumada II. Taqi al-Din Umar, Salah al-Din's nephew, bought the Manazil al-Izz in Egypt and built it as a Shafi'i madrasa. {cite:kamil-ibn-al-athir p. 32}"
  es: "En 566, Saladino demolió la casa del shihna (el prefecto de la guarnición) en Egipto, llamada Dar al-Ma'una, donde se retenía a la gente arbitrariamente, y la reconstruyó como una madrasa shafi'í, erradicando así la injusticia que allí se practicaba. También construyó Dar al-Adl como madrasa shafi'í, destituyó a los jueces egipcios, que eran chiíes, y nombró un juez supremo shafi'í para todo Egipto, quien designó jueces shafi'íes en todos los territorios el 20 de Jumada II. Taqi al-Din Umar, sobrino de Saladino, compró Manazil al-Izz en Egipto y la reconstruyó como madrasa shafi'í. {cite:kamil-ibn-al-athir p. 32}"
  fr: "En 566, Saladin fit démolir en Égypte la maison du préfet de la garnison (shihna), Dar al-Ma'una, où les gens étaient détenus arbitrairement, et la transforma en madrasa chaféite, mettant ainsi fin à l'injustice qui y régnait. Il fit également construire Dar al-Adl, une madrasa chaféite, destitua les juges égyptiens, qui étaient chiites, et nomma un juge en chef chaféite pour l'Égypte, lequel délégua des juges chaféites dans tous les territoires le 20 Jumada II. Taqi al-Din Umar, neveu de Saladin, acheta Manazil al-Izz en Égypte et la transforma en madrasa chaféite. {cite:kamil-ibn-al-athir p. 32}"
  ur: "566 میں صلاح الدین نے مصر میں دار المعونہ کہلانے والے شینہ کے ایک گھر کو گرا دیا، جہاں لوگوں کو اپنی مرضی سے رکھا جاتا تھا، اور وہاں کی ناانصافی کو دور کرتے ہوئے اسے ایک شافعی مدرسہ کے طور پر تعمیر کیا۔ اس نے دار العدل کو ایک شافعی مدرسہ کے طور پر بھی بنایا، مصری ججوں کو برطرف کیا، جو شیعہ تھے، اور مصر پر ایک شافعی چیف جج مقرر کیا، جس نے جمادی الثانی کی بیسویں تاریخ کو تمام ممالک میں شافعی ججوں کو تعینات کیا۔ تقی الدین عمر، صلاح الدین کے بھتیجے، نے مصر میں منازل العز خریدا اور اسے ایک شافعی مدرسہ کے طور پر بنایا۔ {حوالہ: کامل ابن الاثیر ص۔ 32}"
  tr: "Hicri 566 yılında Selahaddin, Mısır'da Şafiî mezhebine ait Dar al-Ma'una adlı evi yıktırdı ve dilediği herkesi hapsederek yerine Şafiî mezhebine ait bir okul inşa ettirdi ve oradaki adaletsizliği ortadan kaldırdı. Ayrıca Şafiî mezhebine ait Dar al-Adl adlı bir okul da inşa ettirdi ve Şiî olan Mısırlı kadıları görevden alarak yerine Şafiî bir kadı atadı. Cemadi ahiretin yirminci gününde tüm ülkelerde Şafiî kadıları görevlendirdi. Selahaddin'in yeğeni Takîddin Ömer, Mısır'daki İzz evlerini satın alarak onları da Şafiî mezhebine ait bir okul olarak inşa ettirdi. {Kaynak: Kamil İbn el-Atir s. 32}"
  id: "Pada tahun 566 H, Saladin menghancurkan sebuah rumah mazhab Syafi'i di Mesir yang disebut Dar al-Ma'una, tempat ia memenjarakan siapa pun yang ingin ia penjarakan, dan ia membangunnya sebagai sekolah untuk mazhab Syafi'i serta menghilangkan ketidakadilan yang ada di dalamnya. Ia juga membangun Dar al-Adl, yang merupakan sekolah untuk mazhab Syafi'i, dan ia memecat para hakim Mesir yang beragama Syiah, dan menunjuk seorang hakim Syafi'i di Mesir. Ia menunjuk hakim-hakim Syafi'i di semua negara pada tanggal 20 Jumada al-Akhirah. Taqi al-Din Umar, keponakan Saladin, membeli rumah-rumah al-‘Izz di Mesir dan membangunnya sebagai sekolah untuk mazhab Syafi'i. {cite:kamil-ibn-al-athir p. 32}"
