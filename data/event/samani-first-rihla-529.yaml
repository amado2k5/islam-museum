id: event/samani-first-rihla-529
class: event
kind: other
label:
  ar: "الرحلة الكبرى الأولى للسمعاني في طلب الحديث، ٥٢٩-٥٣٨هـ/١١٣٥-١١٤٣م"
  en: "Al-Sam'ani's first great hadith journey, 529-538/1135-1143"
  ur: "سمعانی کا طلبِ حدیث کا پہلا بڑا سفر، 529-538ھ/1135-1143ء"
summary:
  ar: "رحل السمعاني قبل الثلاثين وبعدها إلى خراسان وأصبهان والعراق والحجاز والشام وطبرستان وما وراء النهر {cite:tarikh-islam-dhahabi p. 120}؛ وفي رحلته الأولى الكبرى ٥٢٩-٥٣٨هـ زار أصبهان وهمدان وبغداد ونواحيها ومكة والمدينة ودمشق وبيت المقدس — وكانت حين زارها سنة ٥٣٦هـ في أيدي الصليبيين منذ اثنتين وأربعين سنة — وشمالاً وشرقاً خوارزم وسمرقند وبخارى وبلخ وهراة {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}."
  en: "Al-Sam'ani travelled before and after thirty to Khurasan, Isfahan, Iraq, the Hijaz, al-Sham, Tabaristan and Transoxiana {cite:tarikh-islam-dhahabi p. 120}. On this first great journey (529-538/1135-1143) he went via Isfahan and Hamadan to Baghdad and its environs, to Mecca and Medina, to Damascus and Jerusalem — which at his visit in 536/1141 had been in Crusader hands for forty-two years — and north and east to Khwarazm, Samarqand, Bukhara, Balkh and Herat {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}."
  ur: "سمعانی نے تیس برس سے پہلے اور بعد میں خراسان، اصفہان، عراق، حجاز، شام، طبرستان اور ماوراء النہر کا سفر کیا {cite:tarikh-islam-dhahabi p. 120}۔ پہلے بڑے سفر ⁦(529-538ھ/1135-1143ء)⁩ میں وہ اصفہان اور ہمدان سے بغداد اور اس کے نواح، مکہ اور مدینہ، دمشق اور بیت المقدس گئے — جس کی زیارت 536ھ/1141ء میں ہوئی جب وہ 42 برس سے صلیبیوں کے قبضے میں تھا — اور شمال و مشرق میں خوارزم، سمرقند، بخارا، بلخ اور ہرات گئے {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}۔"
