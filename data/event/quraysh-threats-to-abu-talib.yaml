id: event/quraysh-threats-to-abu-talib
class: event
kind: council
label: { ar: "تهديد قريش لأبي طالب ومقايضة عمارة", en: "Quraysh's threats to Abu Talib and the offer of Umara", es: "Las amenazas de Quraysh a Abu Talib y la oferta de Umara", fr: "Les menaces des Quraysh contre Abou Talib et l'offre d'Oumara", ur: "ابو طالب کو قریش کی دھمکیاں اور عمرہ کی پیشکش", tr: "Kureyş'in Ebu Talib'e yönelik tehdidi ve Amara'nın takası", id: "Ancaman Quraisy terhadap Abu Talib dan pertukaran Amara." }
summary:
  ar: "جاءت سادات قريش إلى أبي طالب تهدده بالمنازلة، ثم عرضوا عليه عمارة بن الوليد مقابل تسليم ابن أخيه للقتل؛ فأبى أبو طالب وأبلغ النبي فقال إنه لن يترك الأمر ولو وضعوا الشمس في يمينه والقمر في يساره."
  en: "Quraysh's notables threatened Abu Talib with open war, then offered him Umara ibn al-Walid in exchange for his nephew's death; Abu Talib refused, and the Prophet told him he would not give up the matter even if the sun were placed in his right hand and the moon in his left."
  es: "Los notables de Quraysh amenazaron a Abu Talib con la guerra abierta y luego le ofrecieron a Umara ibn al-Walid a cambio de la muerte de su sobrino; Abu Talib se negó, y el Profeta le dijo que no desistiría del asunto ni aunque le pusieran el sol en la mano derecha y la luna en la izquierda."
  fr: "Les notables de Quraysh menacèrent Abu Talib d'une guerre ouverte, puis lui offrirent Umara ibn al-Walid en échange de la mort de son neveu; Abu Talib refusa, et le Prophète lui dit qu'il n'abandonnerait pas cette affaire même si le soleil était placé dans sa main droite et la lune dans sa main gauche."
  ur: "قریش کے معززین نے ابو طالب کو کھلی جنگ کی دھمکی دی، پھر اسے اپنے بھتیجے کی موت کے بدلے عمارہ بن الولید کی پیشکش کی۔ ابو طالب نے انکار کر دیا، اور نبی نے ان سے کہا کہ اگر سورج ان کے داہنے ہاتھ میں اور چاند ان کے بائیں ہاتھ میں ہو تو وہ اس معاملے کو ترک نہیں کریں گے۔"
  tr: "Kureyş önderleri Ebu Talib'e gelip onu düello ile tehdit ettiler, sonra da yeğenini öldürülmek üzere teslim etmesi karşılığında Amarah ibn al-Walid'i teklif ettiler; fakat Ebu Talib bunu reddetti ve Peygamber'e durumu bildirdi. Peygamber ise, sağ eline güneşi, sol eline ayı koysalar bile bu meseleyi bırakmayacağını söyledi."
  id: "Para pemimpin Quraisy datang kepada Abu Talib dan mengancamnya dengan duel, kemudian mereka menawarkan Amarah ibn al-Walid sebagai imbalan untuk menyerahkan keponakannya untuk dibunuh; tetapi Abu Talib menolak dan memberitahu Nabi, yang berkata bahwa beliau tidak akan meninggalkan masalah ini meskipun mereka meletakkan matahari di tangan kanannya dan bulan di tangan kirinya."
