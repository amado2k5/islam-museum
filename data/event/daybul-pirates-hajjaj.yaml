label: { ar: "قراصنة الديبل وصرخة يا حجاج", en: "The Daybul Pirates and the Cry 'ya Hajjaj'", es: "Los piratas de Daybul y el grito 'ya Hajjaj'", fr: "Les pirates de Daybul et le cri 'ya Hajjaj'", ur: "دیبل بحری قزاق اور پکار 'یا حجاج'" }
summary:
  ar: "عرض للسفينة التي فيها النسوة اللاتي أهداهن ملك جزيرة الياقوت قوم من ميد الديبل في بوارج فأخذوا السفينة بما فيها فنادت امرأة منهن وكانت من بني يربوع يا حجاج وبلغ الحجاج ذلك فقال يا لبيك فأرسل إلى داهر يسأله تخلية النسوة فقال إنما أخذهن لصوص لا أقدر عليهم فأغزى الحجاج عبيد الله بن نبهان الديبل فقتل فكتب إلى بديل بن طهفة البجلي وهو بعمان يأمره أن يسير إلى الديبل فلما لقيهم نفر به فرسه فأطاف به العدو فقتلوه وقال بعضهم قتله زط البذة وإنما سميت هذه الجزيرة جزيرة الياقوت لحسن وجوه نسائها. ويذكر الكتاب أن قراصنة الهند استولوا على سفينة فيها نساء مسلمات أُهدين من ملك جزيرة الياقوت إلى الحجاج، وأن داهر قال إن اللصوص أخذوهن ولا يقدر عليهم، وأن عبيد الله بن نبهان قُتل بالديبل ثم قُتل بديل بن طهفة. {cite:salabi-umayyad-state-2020 p.102}"
  en: "Pirates of Daybul seized the ship bearing the gifted women; one, of Banu Yarbu', cried 'ya Hajjaj' — 'ya labbayk' he answered, and wrote Dahir demanding their release: 'pirates beyond my power' came the reply. Al-Hajjaj's man Ubaydallah ibn Nabhan fell to Daybul, and Budayl ibn Tahfa al-Bajali, sent from Uman, was ringed and killed when his horse shied — some say the Zutt of al-Budha killed him. The island is called Jazirat al-Yaqut for its women's beauty."
  es: "Los piratas de Daybul se apoderaron del barco que transportaba a las mujeres regaladas; uno de ellos, de Banu Yarbu', gritó «¡Ya Hajjaj!», a lo que él respondió «¡Ya labbayk!», y escribió a Dahir exigiendo su liberación: «¡Piratas fuera de mi alcance!», fue la respuesta. El hombre de Al-Hajjaj, Ubaydallah ibn Nabhan, cayó en manos de Daybul, y Budayl ibn Tahfa al-Bajali, enviado desde Uman, fue rodeado y asesinado cuando su caballo se asustó; algunos dicen que el Zutt de al-Budha lo mató. La isla se llama Jazirat al-Yaqut por la belleza de sus mujeres."
  fr: "Des pirates de Daybul s'emparèrent du navire transportant les femmes d'une grande beauté. L'un d'eux, un Banu Yarbu', s'écria: « Ya Hajjaj ! » — « Ya labbayk ! » répondit-il, et il écrivit à Dahir pour exiger leur libération: « Des pirates hors de ma portée ! » fut la réponse. Ubaydallah ibn Nabhan, un homme d'al-Hajjaj, tomba aux mains de Daybul, et Budayl ibn Tahfa al-Bajali, envoyé d'Ouman, fut encerclé et tué lorsque son cheval s'emballa — certains disent que c'est le Zutt d'al-Budha qui le tua. L'île est appelée Jazirat al-Yaqut pour la beauté de ses femmes."
  ur: "دیبل کے بحری قزاقوں نے تحفے میں دی گئی خواتین کو لے کر جہاز پر قبضہ کر لیا۔ بنو یربو میں سے ایک نے پکارا 'یا حجاج' - 'یا لبیک' اس نے جواب دیا، اور داہر نے ان کی رہائی کا مطالبہ کرتے ہوئے لکھا: 'میری طاقت سے باہر قزاق' جواب آیا۔ الحجاج کا آدمی عبیداللہ ابن نبھان دیبل میں گرا، اور عمان سے بھیجے گئے بدیل بن طہفہ البجلی کو اس کے گھوڑے کے جھلسنے پر انگوٹھی ماری گئی اور قتل کر دیا گیا- بعض کہتے ہیں کہ اسے البودہ کی زوت نے قتل کیا۔ اس جزیرے کو خواتین کی خوبصورتی کی وجہ سے جزیرۃ الیقوت کہا جاتا ہے۔"
