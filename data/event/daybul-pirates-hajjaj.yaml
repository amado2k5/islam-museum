label: { ar: "قراصنة الديبل وصرخة يا حجاج", en: "The Daybul Pirates and the Cry 'ya Hajjaj'" }
summary:
  ar: "عرض للسفينة التي فيها النسوة اللاتي أهداهن ملك جزيرة الياقوت قوم من ميد الديبل في بوارج فأخذوا السفينة بما فيها فنادت امرأة منهن وكانت من بني يربوع يا حجاج وبلغ الحجاج ذلك فقال يا لبيك فأرسل إلى داهر يسأله تخلية النسوة فقال إنما أخذهن لصوص لا أقدر عليهم فأغزى الحجاج عبيد الله بن نبهان الديبل فقتل فكتب إلى بديل بن طهفة البجلي وهو بعمان يأمره أن يسير إلى الديبل فلما لقيهم نفر به فرسه فأطاف به العدو فقتلوه وقال بعضهم قتله زط البذة وإنما سميت هذه الجزيرة جزيرة الياقوت لحسن وجوه نسائها. ويذكر الكتاب أن قراصنة الهند استولوا على سفينة فيها نساء مسلمات أُهدين من ملك جزيرة الياقوت إلى الحجاج، وأن داهر قال إن اللصوص أخذوهن ولا يقدر عليهم، وأن عبيد الله بن نبهان قُتل بالديبل ثم قُتل بديل بن طهفة. {cite:salabi-umayyad-state-2020 p.102}"
  en: "Pirates of Daybul seized the ship bearing the gifted women; one, of Banu Yarbu', cried 'ya Hajjaj' — 'ya labbayk' he answered, and wrote Dahir demanding their release: 'pirates beyond my power' came the reply. Al-Hajjaj's man Ubaydallah ibn Nabhan fell to Daybul, and Budayl ibn Tahfa al-Bajali, sent from Uman, was ringed and killed when his horse shied — some say the Zutt of al-Budha killed him. The island is called Jazirat al-Yaqut for its women's beauty."
