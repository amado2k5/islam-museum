label: { ar: "سيل سنجار العظيم سنة 511", en: "The great flood of Sinjar, 511", es: "La gran inundación de Sinjar, 511", fr: "Le grand déluge de Sinjar, 511", ur: "سنجار کا عظیم سیلاب، 511", tr: "511 yılında Sincar'da meydana gelen Büyük Tufan", id: "Banjir Besar Sinjar pada tahun 511" }
summary:
  ar: "في سنة إحدى عشرة وخمسمائة عرم سيل عظيم على سنجار هدم أسوارها وغرق خلق، وحمل باب البلد مسيرة نصف يوم وطمره السيل سنوات، وحمل السيل سريراً فيه طفل فعلق بزيتونة فعاش الطفل وكبر {cite:shadharat-dhahab p. 510}."
  en: "In 511 a great flood burst upon Sinjar, razing its walls and drowning many; it carried the town gate half a day's journey and buried it for years, and swept away a baby on his bed until the bed snagged on an olive tree — the child lived and grew {cite:shadharat-dhahab p. 510}."
  es: "En 511, una gran inundación azotó Sinjar, arrasando sus murallas y ahogando a muchos; se llevó la puerta de la ciudad a medio día de camino y la enterró durante años, y arrastró a un bebé en su cama hasta que la cama se enganchó en un olivo; el niño vivió y creció {cite:shadharat-dhahab p. 510}."
  fr: "En 511, une grande inondation s'abattit sur Sinjar, rasant ses murs et noyant de nombreuses personnes; elle emporta la porte de la ville à une demi-journée de marche et l'ensevelit pendant des années, et emporta un bébé sur son lit jusqu'à ce que le lit s'accroche à un olivier — l'enfant vécut et grandit {cite:shadharat-dhahab p. 510}."
  ur: "511 میں سنجار پر ایک زبردست سیلاب آیا، اس کی دیواریں گر گئیں اور بہت سے لوگ ڈوب گئے۔ اس نے قصبے کے دروازے کو آدھے دن کا سفر کیا اور اسے برسوں تک دفن کیا، اور ایک بچے کو اس کے بستر پر بہا لے گیا یہاں تک کہ بستر زیتون کے درخت پر پھنس گیا - بچہ زندہ رہا اور بڑا ہوا۔ 510}۔"
  tr: "Hicri 511 yılında Sincar'ı büyük bir sel vurdu, surları yıktı ve birçok insanı boğdu. Şehrin kapısı yarım günlük bir yolculuk boyunca sürüklendi ve yıllarca sel sularının altında kaldı. Sel, içinde bir çocuk bulunan bir yatağı da sürükledi ve yatak bir zeytin ağacına takıldı, böylece çocuk hayatta kaldı ve büyüdü. {kaynak:şadharat-dhahab s. 510}"
  id: "Pada tahun 511 Hijriah, banjir besar melanda Sinjar, menghancurkan tembok-temboknya dan menewaskan banyak orang. Gerbang kota terbawa sejauh setengah hari perjalanan dan terkubur oleh banjir selama bertahun-tahun. Banjir tersebut membawa sebuah tempat tidur dengan seorang anak di dalamnya, dan tempat tidur itu menempel pada pohon zaitun, sehingga anak itu hidup dan tumbuh besar. {cite:shadharat-dhahab p. 510}"
