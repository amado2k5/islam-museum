summary:
  ar: "بطاقة أولية لمعركة زانطة سنة ١٦٩٧م، هزيمة الجيش العثماني الكبرى أمام يوجين السافوي في الحرب التركية الكبرى؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Zenta in 1697, the crushing Ottoman defeat by Eugene of Savoy during the Great Turkish War; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Batalla de Zenta en 1697, la aplastante derrota otomana a manos de Eugenio de Saboya durante la Gran Guerra Turca; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour la bataille de Zenta en 1697, la défaite écrasante des Ottomans face à Eugène de Savoie pendant la Grande Guerre turque; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1697 میں زینٹا کی جنگ کے لیے ڈرافٹ کارڈ، ترکی کی عظیم جنگ کے دوران سیوائے کے یوجین کے ہاتھوں عثمانی شکست؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1697 yılında gerçekleşen Zante Muharebesi'nin ön raporu; bu muharebe, Büyük Türk Savaşı'nda Savoylu Eugene tarafından Osmanlı ordusunun büyük bir yenilgiye uğratılmasıyla sonuçlanmıştır. Sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Zante pada tahun 1697 M, kekalahan besar tentara Ottoman oleh Eugene dari Savoy dalam Perang Turki Raya; sumber-sumber di halaman ini belum ditinjau."
