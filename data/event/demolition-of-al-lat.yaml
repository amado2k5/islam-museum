label: { en: "The demolition of al-Lat", ar: "هدم اللات" }
summary:
  en: "Fulfilling the Thaqif treaty's clause, the Prophet sent Khalid ibn al-Walid who demolished al-Lat at al-Ta'if; al-Mughira ibn Shu'ba struck its gate with the pickaxe after feigning a collapse that terrified the onlookers, and its ornaments and covering were divided the same day."
  ar: "بعث النبي خالد بن الوليد فهدموا اللات بالطائف تنفيذاً لشرط الصلح، وضرب المغيرة بن شعبة بابها بالكُرزُن بعد أن سقط يمازحهم فأُرعب أهل الطائف، فسُويت بالأرض وأُخرج حليها وكسوتها فقُسم من يومه."
