id: event/demolition-of-al-lat
class: event
kind: other
label: { en: "The demolition of al-Lat", ar: "هدم اللات", es: "La demolición de al-Lat", fr: "La démolition d'al-Lat", ur: "لات کا انہدام", tr: "El-Lat'ın yıkımı", id: "Pembongkaran Al-Lat" }
summary:
  en: "Fulfilling the Thaqif treaty's clause, the Prophet sent Khalid ibn al-Walid who demolished al-Lat at al-Ta'if; al-Mughira ibn Shu'ba struck its gate with the pickaxe after feigning a collapse that terrified the onlookers, and its ornaments and covering were divided the same day."
  ar: "بعث النبي خالد بن الوليد فهدموا اللات بالطائف تنفيذاً لشرط الصلح، وضرب المغيرة بن شعبة بابها بالكُرزُن بعد أن سقط يمازحهم فأُرعب أهل الطائف، فسُويت بالأرض وأُخرج حليها وكسوتها فقُسم من يومه."
  es: "En cumplimiento de la cláusula del tratado de Thaqif, el Profeta envió a Khalid ibn al-Walid, quien demolió al-Lat en al-Ta'if; al-Mughira ibn Shu'ba golpeó su puerta con el pico tras simular un derrumbe que aterrorizó a los espectadores, y sus ornamentos y cubierta fueron repartidos el mismo día."
  fr: "Conformément à la clause du traité de Thaqif, le Prophète envoya Khalid ibn al-Walid qui démolit al-Lat à al-Ta'if; al-Mughira ibn Shu'ba frappa sa porte avec la pioche après avoir simulé un effondrement qui terrifia les spectateurs, et ses ornements et son revêtement furent partagés le même jour."
  ur: "ثقیف معاہدے کی شق کو پورا کرتے ہوئے، نبی نے خالد بن ولید کو بھیجا جس نے الطائف میں لات کو منہدم کر دیا۔ المغیرہ بن شعبہ نے اس کے دروازے کو گدڑی سے مارا اور اس کے گرنے کا دعویٰ کیا جس سے تماشائیوں پر خوف طاری ہو گیا اور اسی دن اس کے زیورات اور غلاف کو تقسیم کر دیا گیا۔"
  tr: "Peygamberimiz Halid bin El-Velid'i gönderdi ve onlar da barış anlaşmasının gereği olarak Taif'teki El-Lat'ı yıktılar. El-Muğira bin Şuba, yıkıldıktan sonra onlarla alay etmek amacıyla kapısına bir sopayla vurdu ve Taif halkı çok korktu. Bunun üzerine yapı yerle bir edildi ve süsleri ile örtüleri o gün çıkarılıp dağıtıldı."
  id: "Nabi mengutus Khalid bin Al-Walid, dan mereka menghancurkan Al-Lat di Taif sebagai pemenuhan perjanjian damai. Al-Mughira bin Shu’ba memukul pintunya dengan tongkat setelah bangunan itu roboh, sebagai lelucon, dan penduduk Taif ketakutan. Maka bangunan itu diratakan dengan tanah, dan ornamen serta penutupnya dikeluarkan dan dibagi-bagi pada hari itu juga."
