summary:
  ar: "عند البلاذري: بعث معاوية بن حديج — ويُقال ولّاه معاوية بن أبي سفيان المغرب — عقبة بن نافع الفهري فغزا إفريقية في عشرة آلاف من المسلمين فافتتحها واختطّ قيروانها وكان موضعها غيضة ذات طرقاء وشجر لا تُرام من السباع والحيات والمقارب القتالة وكان ابن نافع رجلاً صالحاً مستجاب الدعوة فدعا ربه فأذهب ذلك كله حتى إن كانت السباع لتحمل أولادها هاربة بها؛ وقال موسى بن علي: أول من بناها عقبة بن نافع اختطّها ثم بنى وبنى الناس معه الدور والمساكن وبنى المسجد الجامع بها؛ وحدّث جماعة من أهل إفريقية عن أشياخهم أن عقبة لما أراد تمصير القيروان فكّر في موضع المسجد منه فأُري في منامه كأن رجلاً أذّن في الموضع الذي جمل فيه مئذنته فلما أصبح بنى المنائر في موقف الرجل ثم بنى المسجد. وقال الواقدي: ولم يزل عبد الله بن سعد والياً حتى غلب محمد بن أبي حذيفة على مصر؛ ثم ولّى معاوية مسلمة بن مخلد الأنصاري مصر والمغرب فولّى المغرب أبا المهاجر مولاه فلما ولّى يزيد بن معاوية ردّ عقبة على عمله فغزا السوس الأدنى — وهو خلف طنجة — وجوّل فيما هناك لا يعرض له أحد ولا يقاتله فانصرف؛ وولّى أبو العباس محمد بن الأشعث الخزاعي إفريقية فرمّ مدينة القيروان ومسجدها ثم عزله المنصور وولّى عمر بن حفص هزارمرد مكانه."
  en: "In al-Baladhuri: Mu'awiya ibn Khudayj sent — or, some say, Mu'awiya ibn Abi Sufyan gave him the Maghreb — Uqba ibn Nafi' al-Fihri, who raided Ifriqiya with ten thousand Muslims, conquered it, and laid out its Qayrawan, whose site was a thicket of trees and thickets unapproachable for beasts, snakes and deadly vermin; Uqba being a righteous man whose prayer was answered, he prayed to his Lord and all that was removed — till the very beasts carried away their young in flight; and Musa ibn Ali said the first to build it was Uqba ibn Nafi', who laid it out then built — the people building houses and dwellings with him — and built its congregational mosque; and a body of Ifriqiya's people told from their shaykhs that when Uqba wished to make Qayrawan a misr he pondered where its mosque should be, and saw in a dream as though a man gave the call to prayer in the place where its minaret stood — so when morning came he built the minarets in the man's station, then built the mosque. Al-Waqidi said Abdallah ibn Sa'd stayed governor until Muhammad ibn Abi Hudhayfa seized Egypt; then Mu'awiya gave Maslama ibn Mukhallad al-Ansari Egypt and the Maghreb, and he gave the Maghreb to his mawla Abu al-Muhajir; when Yazid ibn Mu'awiya ruled he restored Uqba to his office — who raided Sus al-Adna beyond Tangier, roaming unchallenged till he returned; Abu al-Abbas gave Muhammad ibn al-Ash'ath al-Khuza'i Ifriqiya — he repaired Qayrawan's city and mosque — then al-Mansur dismissed him and gave his place to Umar ibn Hafs Hazarmard."
  es: "En al-Baladhuri: Mu'awiya ibn Khudayj envió —o, según algunos, Mu'awiya ibn Abi Sufyan le dio el Magreb— a Uqba ibn Nafi' al-Fihri, quien asaltó Ifriqiya con diez mil musulmanes, la conquistó y trazó su Qayrawan, cuyo sitio era una espesura de árboles y matorrales inaccesibles para bestias, serpientes y alimañas mortales; Uqba, siendo un hombre justo cuya oración fue respondida, oró a su Señor y todo eso fue eliminado, hasta que las mismas bestias se llevaron a sus crías en la huida; y Musa ibn Ali dijo que el primero en construirlo fue Uqba ibn Nafi', quien lo trazó y luego construyó —la gente construyó casas y viviendas con él— y construyó su mezquita congregacional; y un grupo de gente de Ifriqiya contó de sus shaykhs que cuando Uqba quiso hacer de Qayrawan un misr, reflexionó sobre dónde debería estar su mezquita, y vio en un sueño como si un hombre hiciera la llamada a la oración en el lugar donde se encontraba su minarete; así que cuando llegó la mañana construyó los minaretes en el lugar del hombre, y luego construyó la mezquita. Al-Waqidi dijo que Abdallah ibn Sa'd permaneció como gobernador hasta que Muhammad ibn Abi Hudhayfa se apoderó de Egipto; luego Mu'awiya le dio a Maslama ibn Mukhallad al-Ansari Egipto y el Magreb, y este le dio el Magreb a su mawla Abu al-Muhajir; cuando Yazid ibn Mu'awiya gobernó, restituyó a Uqba en su cargo, quien saqueó Sus al-Adna más allá de Tánger, vagando sin oposición hasta que regresó; Abu al-Abbas le dio a Muhammad ibn al-Ash'ath al-Khuza'i Ifriqiya —quien reparó la ciudad y la mezquita de Qayrawan—, luego al-Mansur lo destituyó y le dio su lugar a Umar ibn Hafs Hazarmard."
  fr: "Dans al-Baladhuri: Mu'awiya ibn Khudayj envoya — ou, selon certains, Mu'awiya ibn Abi Sufyan lui confia le Maghreb — Uqba ibn Nafi' al-Fihri, qui pilla Ifriqiya avec dix mille musulmans, la conquit et y établit son Qayrawan, dont le site était un fourré d'arbres et de broussailles inaccessible aux bêtes, aux serpents et aux vermines mortelles; Uqba étant un homme juste dont la prière fut exaucée, il pria son Seigneur et tout fut enlevé — jusqu'à ce que les bêtes elles-mêmes emportent leurs petits en fuyant; et Musa ibn Ali dit que le premier à le construire fut Uqba ibn Nafi', qui l'établit puis le construisit — les gens construisant des maisons et des habitations avec lui — et construisit sa mosquée du vendredi; Un groupe d'Ifriqiya rapporta, d'après leurs cheikhs, que lorsqu'Uqba voulut faire de Qayrawan une mosquée, il réfléchit à l'emplacement de celle-ci et vit en rêve un homme appeler à la prière à l'endroit même où se dressait le minaret. Aussi, au matin, il fit construire les minarets à l'endroit où cet homme avait appelé, puis la mosquée. Al-Waqidi raconta qu'Abdallah ibn Sa'd resta gouverneur jusqu'à ce que Muhammad ibn Abi Hudhayfa s'empare de l'Égypte; puis Mu'awiya confia l'Égypte et le Maghreb à Maslama ibn Mukhallad al-Ansari, qui donna le Maghreb à son mawla Abu al-Muhajir; lorsque Yazid ibn Mu'awiya gouverna, il rétablit Uqba dans ses fonctions – lequel mena un raid sur le Soue al-Adna, au-delà de Tanger, et erra sans rencontrer de résistance jusqu'à son retour. Abu al-Abbas a donné à Muhammad ibn al-Ash'ath al-Khuza'i Ifriqiya — il a réparé la ville et la mosquée de Qayrawan — puis al-Mansur l'a renvoyé et a donné sa place à Umar ibn Hafs Hazarmard."
  ur: "البلادوری میں ہے: معاویہ بن خدیج نے بھیجا یا بعض کہتے ہیں کہ معاویہ ابن ابی سفیان نے اسے مغرب دیا - عقبہ بن نافع الفہری جس نے دس ہزار مسلمانوں کے ساتھ عفریقیہ پر چڑھائی کی، اسے فتح کیا اور اس کا قیروان بچھا دیا، جس کی جگہ گھنے درختوں کے گھنے اور بے جان درختوں کے گھنے گھنے درختوں کے لیے تھے۔ کیڑے عقبہ ایک نیک آدمی تھا جس کی دعا قبول کی گئی تھی، اس نے اپنے رب سے دعا کی اور جو کچھ ہٹا دیا گیا تھا - یہاں تک کہ درندے ان کے بچوں کو بھاگتے ہوئے لے گئے۔ اور موسیٰ ابن علی نے کہا کہ اسے سب سے پہلے تعمیر کرنے والے عقبہ بن نافع تھے، جنہوں نے اسے بچھایا، پھر تعمیر کیا - لوگوں نے اس کے ساتھ مکانات اور رہائشیں بنائیں - اور اس کی اجتماعی مسجد بنائی۔ اور عفریقیہ کے ایک گروہ نے اپنے شیوخ سے بیان کیا کہ جب عقبہ نے قیروان کو مصر بنانا چاہا تو اس نے سوچا کہ اس کی مسجد کہاں ہونی چاہیے، اور خواب میں دیکھا کہ جیسے ایک آدمی نے اس جگہ اذان دی جہاں اس کا مینار کھڑا تھا، چنانچہ جب صبح ہوئی تو اس نے اس آدمی کے مقام پر مینار بنائے، پھر مسجد تعمیر کی۔ الواقدی نے کہا کہ عبداللہ بن سعد اس وقت تک گورنر رہے جب تک محمد بن ابی حذیفہ نے مصر پر قبضہ نہیں کیا۔ پھر معاویہ نے مسلمہ بن مخلد الانصاری کو مصر اور مغرب دیا اور مغرب اپنے مولا ابو المہاجر کو دیا۔ جب یزید بن معاویہ نے حکومت کی تو اس نے عقبہ کو اپنے دفتر میں بحال کر دیا - جس نے تانگیر سے آگے سوس العدنا پر چھاپہ مارا، جب تک وہ واپس نہیں آ گیا، بغیر کسی چیلنج کے گھومتا رہا۔ ابو العباس نے محمد بن اشعث الخزاعی کو عفریقیہ دیا - اس نے قیراوان کے شہر اور مسجد کی مرمت کی - پھر المنصور نے اسے برطرف کردیا اور اس کی جگہ عمر بن حفص حجرمرد کو دے دی۔"
