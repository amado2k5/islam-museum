summary:
  ar: "في سنة ثمان وست مئة قدم رسول جلال الدين حسن صاحب الألموت بدخول قومه في الإسلام وأنهم قد تبرأوا من الباطنية وبنوا المساجد والجوامع وصاموا رمضان ففرح الخليفة بذلك {cite:shadharat-dhahab p. 39-40}."
  en: "In 608 came the envoy of Jalal al-Din Hasan, lord of Alamut, announcing his people's entry into Islam — their abjuration of the Batiniyya, the building of mosques and the fasting of Ramadan — and the caliph rejoiced {cite:shadharat-dhahab p. 39-40}."
  es: "En 608 llegó el enviado de Jalal al-Din Hasan, señor de Alamut, anunciando la entrada de su pueblo al Islam: su abjuración de la Batiniyya, la construcción de mezquitas y el ayuno de Ramadán, y el califa se regocijó {cite:shadharat-dhahab p. 39-40}."
  fr: "En 608, l'envoyé de Jalal al-Din Hasan, seigneur d'Alamut, annonça l'entrée de son peuple dans l'Islam — leur abjuration de la Batiniyya, la construction de mosquées et le jeûne du Ramadan — et le calife se réjouit {cite:shadharat-dhahab p. 39-40}."
  ur: "608 میں الموت کے بادشاہ جلال الدین حسن کے ایلچی نے اپنے لوگوں کے اسلام میں داخل ہونے کا اعلان کیا - ان کی بطنیہ کی منسوخی، مساجد کی تعمیر اور رمضان کے روزے - اور خلیفہ نے خوشی کا اظہار کیا۔ 39-40}۔"
