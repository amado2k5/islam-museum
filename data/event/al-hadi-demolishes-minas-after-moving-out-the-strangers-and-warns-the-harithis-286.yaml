id: event/al-hadi-demolishes-minas-after-moving-out-the-strangers-and-warns-the-harithis-286
class: event
kind: other
label:
  ar: هدم الهادي ميناس بعد إخراج الغرباء ومتاعهم وتحذيره بني الحارث، 286هـ
  en: Al-Hadi pulls down Minas after the strangers and their goods are moved out and warns the Harithis, 286 AH
  ur: اجنبیوں اور ان کے سامان کو نکلوانے کے بعد ہادی کا میناس گرانا اور بنو حارث کو تنبیہ، 286ھ
summary:
  ar: في الغد يغدو الهادي في عسكره إلى ميناس فيأمر الغرباء والنصارى والضعفاء بنقل متاعهم إلى حيث شاءوا ومعهم بعض ثقاته لئلا يُؤخذ منه شيء، ثم يأمر بهدم ميناس كله ويعود إلى القرية، فيأتيه نفر من بني الحارث يسلمون عليه فيعظهم ويقول إنهم سيعودون وإنه سيقتلهم أعظم من هذه القتلة فيعدون ألا يعودوا.
  en: Next morning al-Hadi goes with his army to Minas and tells the strangers, the Christians and the weak to move their goods wherever they like, with some of his trusted men beside them so nothing is taken; he orders Minas pulled down entirely, returns to the village, and men of Banu al-Harith come to greet him; he warns them that they will return and that he will kill them in a greater killing than this one, and they promise never to rebel again.
  ur: اگلے دن ہادی اپنے لشکر کے ساتھ میناس جاتے ہیں اور اجنبیوں، نصاریٰ اور کمزوروں سے کہتے ہیں کہ سامان جہاں چاہیں لے جائیں، ان کے ساتھ اپنے کچھ معتمد لگا دیتے ہیں کہ کچھ لیا نہ جائے؛ پھر میناس پورا گرانے کا حکم دیتے ہیں اور بستی لوٹ آتے ہیں؛ بنو حارث کے کچھ لوگ سلام کو آتے ہیں تو وہ انہیں نصیحت کرتے اور کہتے ہیں کہ وہ لوٹیں گے اور وہ انہیں اس سے بڑی قتل میں ماریں گے، اور وہ وعدہ کرتے ہیں کہ پھر فتنے میں نہ لوٹیں گے۔
