id: event/al-hadi-demolishes-minas-after-moving-out-the-strangers-and-warns-the-harithis-286
class: event
kind: other
label:
  ar: هدم الهادي ميناس بعد إخراج الغرباء ومتاعهم وتحذيره بني الحارث، 286هـ
  en: Al-Hadi pulls down Minas after the strangers and their goods are moved out and warns the Harithis, 286 AH
  ur: اجنبیوں اور ان کے سامان کو نکلوانے کے بعد ہادی کا میناس گرانا اور بنو حارث کو تنبیہ، 286ھ
  es: "Al-Hadi derribó Minas después de expulsar a los extranjeros y sus pertenencias, y advirtió a los harithis, 286 AH."
  fr: "Al-Hadi fait raser Minas après l'évacuation des étrangers et de leurs biens et avertit les Harithis (286 AH)."
  tr: "El-Hadi, yabancıları ve eşyalarını kovduktan ve Beni el-Harith'i uyardıktan sonra Minas'ı yerle bir etti (Hicri 286)."
  id: "Al-Hadi menghancurkan Minas setelah mengusir orang asing dan harta benda mereka serta memperingatkan Bani al-Harith, 286 H."
summary:
  ar: في الغد يغدو الهادي في عسكره إلى ميناس فيأمر الغرباء والنصارى والضعفاء بنقل متاعهم إلى حيث شاءوا ومعهم بعض ثقاته لئلا يُؤخذ منه شيء، ثم يأمر بهدم ميناس كله ويعود إلى القرية، فيأتيه نفر من بني الحارث يسلمون عليه فيعظهم ويقول إنهم سيعودون وإنه سيقتلهم أعظم من هذه القتلة فيعدون ألا يعودوا.
  en: Next morning al-Hadi goes with his army to Minas and tells the strangers, the Christians and the weak to move their goods wherever they like, with some of his trusted men beside them so nothing is taken; he orders Minas pulled down entirely, returns to the village, and men of Banu al-Harith come to greet him; he warns them that they will return and that he will kill them in a greater killing than this one, and they promise never to rebel again.
  ur: اگلے دن ہادی اپنے لشکر کے ساتھ میناس جاتے ہیں اور اجنبیوں، نصاریٰ اور کمزوروں سے کہتے ہیں کہ سامان جہاں چاہیں لے جائیں، ان کے ساتھ اپنے کچھ معتمد لگا دیتے ہیں کہ کچھ لیا نہ جائے؛ پھر میناس پورا گرانے کا حکم دیتے ہیں اور بستی لوٹ آتے ہیں؛ بنو حارث کے کچھ لوگ سلام کو آتے ہیں تو وہ انہیں نصیحت کرتے اور کہتے ہیں کہ وہ لوٹیں گے اور وہ انہیں اس سے بڑی قتل میں ماریں گے، اور وہ وعدہ کرتے ہیں کہ پھر فتنے میں نہ لوٹیں گے۔
  es: "A la mañana siguiente, al-Hadi se dirige con su ejército a Minas y les dice a los forasteros, a los cristianos y a los débiles que trasladen sus pertenencias donde quieran, con algunos de sus hombres de confianza a su lado para que no se lleven nada; ordena que Minas sea arrasada por completo, regresa al pueblo y los hombres de Banu al-Harith salen a recibirlo; les advierte que volverán y que los matará en una matanza aún mayor que esta, y ellos prometen no volver a rebelarse jamás."
  fr: "Le lendemain matin, al-Hadi se rend avec son armée à Minas et ordonne aux étrangers, aux chrétiens et aux faibles de déplacer leurs biens où bon leur semble, accompagnés de quelques hommes de confiance pour que rien ne soit volé; il ordonne la destruction complète de Minas, retourne au village, et des hommes de Banu al-Harith viennent l’accueillir; il les avertit qu’ils reviendront et qu’il les tuera lors d’un massacre encore plus terrible, et ils promettent de ne plus jamais se rebeller."
  tr: "Ertesi gün, El-Hadi ordusuyla Minas'a gider ve yabancılara, Hristiyanlara ve güçsüzlere, eşyalarını istedikleri yere taşımalarını emreder; yanında da güvendiği adamlarından bazıları bulunur ki hiçbir şeyleri alınmasın. Ardından Minas'ın tamamen yıkılmasını emreder ve köye döner. Beni El-Harith kabilesinden bir grup onu karşılamaya gelir ve El-Hadi onlara, geri döneceklerini ve onları bu katliamdan daha büyük bir şekilde öldüreceğini söyleyerek onları azarlar; bunun üzerine onlar da geri dönmeyeceklerine söz verirler."
  id: "Keesokan harinya, Al-Hadi pergi bersama pasukannya ke Minas dan memerintahkan orang asing, orang Kristen, dan orang-orang lemah untuk memindahkan barang-barang mereka ke mana pun mereka mau, ditem ditemani oleh beberapa orang kepercayaannya agar tidak ada yang diambil dari mereka. Kemudian dia memerintahkan penghancuran total Minas dan kembali ke desa. Sekelompok Bani Al-Harith datang untuk menyambutnya, dan dia memperingatkan mereka, mengatakan bahwa mereka akan kembali dan bahwa dia akan membunuh mereka dengan cara yang lebih mengerikan daripada pembunuhan ini, sehingga mereka berjanji untuk tidak kembali."
