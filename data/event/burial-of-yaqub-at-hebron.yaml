id: event/burial-of-yaqub-at-hebron
class: event
kind: death
label:
  ar: وفاة يعقوب بمصر ودفنه بالخليل
  en: Death of Yaqub in Egypt and his burial at Hebron
  ur: یعقوب کی مصر میں وفات اور خلیل میں تدفین
summary:
  ar: يروي ابن كثير عن ابن إسحاق وأهل الكتاب أن يعقوب أقام بمصر عند يوسف سبع عشرة سنة ثم توفي بعد أن أوصى أن يُدفن عند أبويه إبراهيم وإسحاق، فحمله يوسف إلى حبرون ودفنه في المغارة {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 333}؛ ويذكر القرطبي أن عمره مئة وسبع وأربعون سنة وأنه مات بمصر {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 616}، ويصف ابن كثير تفاصيل التجهيز والحداد بأنها من أخبار أهل الكتاب {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224}.
  en: Ibn Kathir reports from Ibn Ishaq and the People of the Book that Ya'qub lived in Egypt with Yusuf for seventeen years and died after charging that he be buried with his fathers Ibrahim and Ishaq, and that Yusuf took him to Habrun and buried him in the cave {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 333}; al-Qurtubi says he lived one hundred and forty-seven years and died in Egypt {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 616}; the details of preparation and mourning come from the People of the Book as Ibn Kathir presents them {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224}.
  ur: ابن کثیر ابن اسحاق اور اہلِ کتاب سے بیان کرتے ہیں کہ یعقوب مصر میں یوسف کے پاس سترہ سال رہے اور اپنے آباء ابراہیم و اسحاق کے پاس دفن کی وصیت کر کے فوت ہوئے، اور یوسف انھیں حبرون لے جا کر غار میں دفن کر آئے {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 333}؛ قرطبی کے مطابق ان کی عمر ایک سو سینتالیس سال تھی اور وہ مصر میں فوت ہوئے {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 616}؛ تجہیز اور ماتم کی تفصیلات اہلِ کتاب کی خبریں ہیں جیسا کہ ابن کثیر پیش کرتے ہیں {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224}۔
