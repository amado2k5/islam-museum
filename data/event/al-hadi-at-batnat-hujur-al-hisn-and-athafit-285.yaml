id: event/al-hadi-at-batnat-hujur-al-hisn-and-athafit-285
class: event
kind: other
label:
  ar: الهادي في بطنة حجور والحصن وأثافت بعد خيوان، شعبان 285هـ
  en: Al-Hadi at Batnat Hujur, al-Hisn and Athafit after Khiwan, Sha'ban 285 AH
  ur: خیوان کے بعد بطنۃ حجور، الحصن اور اثافت میں ہادی، شعبان 285ھ
  es: "Al-Hadi en Batnat Hujur, al-Hisn y Athafit después de Khiwan, Sha'ban 285 AH"
  fr: "Al-Hadi à Batnat Hujur, al-Hisn et Athafit après Khiwan, Sha'ban 285 AH"
  tr: "Batnat Hacur'da El-Hadi ve Hayvan'dan sonra El-Hisn ve Athafat, Şa'ban 285 H."
  id: "Al-Hadi di Batnat Hajur dan Al-Hisn dan Athafat setelah Khaywan, Sya'ban 285 H"
summary:
  ar: خرج الهادي من خيوان إلى بطنة حجور بعد أن وصله أهلها وبايعوه، ونزل على بركة «الظهرية» ثم دخل البلد قبل الظهر يوم السبت ورفض عرض العلف، وخلّف فيها والياً من ولد عمر بن علي، ثم مضى إلى «الحصن» لبني ربيعة من همدان وطلب إليهم «المحدثين» الذين اعتدوا على أهل بطنة حجور، وسار إلى أثافت فصلى بها الجمعة وبايعه خلق كثير.
  en: Al-Hadi left Khiwan for Batnat Hujur, whose people had come and pledged to him; he camped by the pond called al-Zahriyya, entered the town before noon on Saturday and refused the offered fodder, left a governor of the line of Umar ibn Ali there, then went to al-Hisn of Banu Rabi'a of Hamdan and demanded the "offenders" who had raided people of Batnat Hujur, and went on to Athafit where he led the Friday prayer and many pledged.
  ur: ہادی خیوان سے بطنۃ حجور گئے جس کے لوگ آ کر بیعت کر چکے تھے؛ «الظہریہ» نامی حوض پر ٹھہرے، ہفتے کو ظہر سے پہلے شہر میں داخل ہوئے اور چارے کی پیشکش رد کی، عمر بن علی کی اولاد کا ایک والی وہاں چھوڑا، پھر ہمدان کے بنو ربیعہ کے «الحصن» گئے اور ان «مجرموں» کو طلب کیا جنہوں نے بطنۃ حجور والوں پر چھاپہ مارا تھا، اور اثافت گئے جہاں جمعہ پڑھایا اور بہت سے لوگوں نے بیعت کی۔
  es: "Al-Hadi partió de Khiwan hacia Batnat Hujur, cuya gente había acudido y le había jurado lealtad; acampó junto al estanque llamado al-Zahriyya, entró en la ciudad antes del mediodía del sábado y rechazó el forraje ofrecido, dejó allí a un gobernador de la línea de Umar ibn Ali, luego fue a al-Hisn de Banu Rabi'a de Hamdan y exigió a los \"infractores\" que habían asaltado a la gente de Batnat Hujur, y continuó hacia Athafit donde dirigió la oración del viernes y muchos juraron lealtad."
  fr: "Al-Hadi quitta Khiwan pour Batnat Hujur, dont les habitants étaient venus lui prêter allégeance; il campa près de l'étang appelé al-Zahriyya, entra dans la ville avant midi le samedi et refusa le fourrage offert, y laissa un gouverneur de la lignée d'Umar ibn Ali, puis se rendit à al-Hisn de Banu Rabi'a de Hamdan et réclama les « coupables » qui avaient pillé les habitants de Batnat Hujur, et poursuivit sa route vers Athafit où il dirigea la prière du vendredi et où de nombreux fidèles lui prêtèrent allégeance."
  tr: "Hayvan halkı kendisine ulaşıp biat ettikten sonra El-Hadi, Hayvan'dan Batna Hajur'a gitti. \"El-Dhahriyah\" havuzunda durdu ve cumartesi günü öğleden önce şehre girdi. Yem teklifini reddetti ve Ömer bin Ali'nin soyundan bir vali bıraktı. Daha sonra Hamdan'dan Beni Rabi'ah \"kalesine\" gitti ve Batna Hajur halkına saldıran \"biçimsizleri\" sordu. Athafit'e gitti ve orada cuma namazı kıldı; birçok kişi ona biat etti."
  id: "Al-Hadi meninggalkan Khaywan menuju Batna Hajur setelah penduduknya menemuinya dan menyatakan baiat kepadanya. Ia berhenti di kolam “al-Dhahriyah” dan kemudian memasuki kota sebelum tengah hari pada hari Sabtu. Ia menolak tawaran pakan ternak dan meninggalkan seorang gubernur di sana dari keturunan Umar bin Ali. Kemudian ia pergi ke “benteng” Bani Rabi’ah dari Hamdan dan menanyakan kepada mereka tentang para “inovator” yang telah menyerang penduduk Batna Hajur. Ia pergi ke Athafit dan melaksanakan salat Jumat di sana, dan banyak orang menyatakan baiat kepadanya."
