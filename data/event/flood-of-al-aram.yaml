label: { en: "The Flood of al-Arim (the Bursting of Maʾrib Dam)", ar: "سيل العرم", es: "La inundación de al-Arim (la rotura de la presa de Maʾrib)", fr: "Le déluge d'al-Arim (la rupture du barrage de Maʾrib)" }
summary:
  en: "The great breach of the Maʾrib dam around 450–451 CE which the Quran recalls as Sayl al-Arim; in the sira’s account it ruins Yemen’s settled life and sends the Qahtani tribes scattering across the peninsula."
  ar: "الثّلمة العظيمة في سد مأرب نحو سنة 450–451م التي يذكرها القرآن بسيل العرم؛ وفي عرض السيرة أدت إلى خراب العمران باليمن وتشتت بطون قحطان في البلاد."
  es: "La gran ruptura de la presa de Maʾrib, ocurrida alrededor del año 450-451 d. C., que el Corán recuerda como Sayl al-Arim; según el relato de la sira, arruinó la vida sedentaria de Yemen y provocó la dispersión de las tribus Qahtani por toda la península."
  fr: "La grande brèche du barrage de Maʾrib vers 450-451 de notre ère, que le Coran évoque sous le nom de Sayl al-Arim, ruine, selon le récit de la sira, la vie sédentaire du Yémen et disperse les tribus Qahtani à travers la péninsule."
