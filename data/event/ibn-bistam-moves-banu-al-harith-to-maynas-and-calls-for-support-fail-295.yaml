id: event/ibn-bistam-moves-banu-al-harith-to-maynas-and-calls-for-support-fail-295
class: event
kind: other
label:
  ar: "ابن بسطام ينقل بني الحارث إلى ميناس، ودعواته للنصرة لا تجد من يجيب، سنة 295هـ، ص357"
  en: "Ibn Bistam moves Banu al-Harith to Maynas and his calls for support go unanswered, 295 AH, p. 357"
  ur: "ابن بسطام کا بنو حارث کو میناس منتقل کرنا اور مدد کی پکار کا جواب نہ ملنا، 295ھ، ص357"
  es: "Ibn Bistam traslada a Banu al-Harith a Maynas y sus peticiones de apoyo quedan sin respuesta, 295 AH, p. 357."
summary:
  ar: "خاف ابن بسطام الهلاك على بني الحارث، فأرسلهم إلى ميناس، وأمر ابن حميد بالتغيّب فنزل في حصن بني الحارث المسمى النخل، وأرسل من يستنفر مذحج، فلم يجبه أحد من الناس."
  en: "Ibn Bistam feared for the lives of Banu al-Harith, sent them to Maynas, and told Ibn Humayd to keep out of sight; Ibn Humayd settled at a Banu al-Harith stronghold called al-Nakhl. Ibn Bistam sent men to rouse Madhhij, but no one answered."
  ur: "ابن بسطام کو بنو حارث کی ہلاکت کا خوف ہوا تو انہیں میناس بھیج دیا، ابن حمید کو چھپ جانے کا حکم دیا، اور ابن حمید بنو حارث کے ایک ٹھکانے النخل میں جا ٹھہرے۔ ابن بسطام نے مذحج کو ابھارنے کے لیے آدمی بھیجے، مگر کسی نے جواب نہ دیا۔"
  es: "Ibn Bistam temía por la vida de los Banu al-Harith, los envió a Maynas y le dijo a Ibn Humayd que se mantuviera oculto. Ibn Humayd se instaló en una fortaleza de los Banu al-Harith llamada al-Nakhl. Ibn Bistam envió hombres para despertar a Madhhij, pero nadie respondió."
