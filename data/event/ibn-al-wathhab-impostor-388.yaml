summary:
  ar: "هرب عبد الله بن جعفر المعروف بابن الوثاب من الاعتقال لما خلع الطائع، وتنقل في البلاد ثم نفذ القادر من أحضره مقبوضاً عليه فحبس ثم هرب فمضى إلى جيلان وادعى أنه هو الطائع لله وذكر لهم علامات عرفها بحكم أنسه بدار الخلافة فقبلوه وعظموه وزوجه ابن العباس أحد أمرائهم ابنته وأقام له الدعوة في بلده وأطاعه أهل نواحٍ أخر وأدوا إليه العشر، ثم ورد قوم منهم إلى بغداد فانكشف لهم حاله فانصرف عنهم {cite:muntazam-ibn-al-jawzi j.7 p.206-207}."
