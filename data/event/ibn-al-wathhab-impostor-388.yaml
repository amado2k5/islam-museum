label: { ar: "ادعاء ابن الوثاب أنه الطائع بجيلان", en: "Ibn al-Wathhab's claim in Gilan to be al-Ta'i'" }
summary:
  ar: "هرب عبد الله بن جعفر المعروف بابن الوثاب من الاعتقال لما خلع الطائع، وتنقل في البلاد ثم نفذ القادر من أحضره مقبوضاً عليه فحبس ثم هرب فمضى إلى جيلان وادعى أنه هو الطائع لله وذكر لهم علامات عرفها بحكم أنسه بدار الخلافة فقبلوه وعظموه وزوجه ابن العباس أحد أمرائهم ابنته وأقام له الدعوة في بلده وأطاعه أهل نواحٍ أخر وأدوا إليه العشر، ثم ورد قوم منهم إلى بغداد فانكشف لهم حاله فانصرف عنهم {cite:muntazam-ibn-al-jawzi j.7 p.206-207}."
  en: "Abd Allah ibn Ja'far, known as Ibn al-Wathhab, escaped detention when al-Ta'i' was deposed. He moved about the lands; then al-Qadir sent for him, and he was brought in under arrest and imprisoned, but he escaped again and went to Gilan, claiming to be al-Ta'i' li-llah. He cited signs he knew from his familiarity with the caliphal palace, and they accepted and honoured him. Ibn al-Abbas, one of their amirs, married him to his daughter and proclaimed him in his town, and people of other regions obeyed him and paid him the tithe. Then some of them came to Baghdad, his true situation became clear to them, and they withdrew from him {cite:muntazam-ibn-al-jawzi j.7 p.206-207}."
