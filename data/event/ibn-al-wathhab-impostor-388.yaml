id: event/ibn-al-wathhab-impostor-388
class: event
kind: other
label: { ar: "ادعاء ابن الوثاب أنه الطائع بجيلان", en: "Ibn al-Wathhab's claim in Gilan to be al-Ta'i'", es: "La afirmación de Ibn al-Wathhab en Gilan de ser al-Ta'i'.", fr: "La revendication d'Ibn al-Wathhab à Gilan d'être al-Ta'i'", ur: "ابن الوہاب کا گیلان میں الطائی ہونے کا دعویٰ" }
summary:
  ar: "هرب عبد الله بن جعفر المعروف بابن الوثاب من الاعتقال لما خلع الطائع، وتنقل في البلاد ثم نفذ القادر من أحضره مقبوضاً عليه فحبس ثم هرب فمضى إلى جيلان وادعى أنه هو الطائع لله وذكر لهم علامات عرفها بحكم أنسه بدار الخلافة فقبلوه وعظموه وزوجه ابن العباس أحد أمرائهم ابنته وأقام له الدعوة في بلده وأطاعه أهل نواحٍ أخر وأدوا إليه العشر، ثم ورد قوم منهم إلى بغداد فانكشف لهم حاله فانصرف عنهم {cite:muntazam-ibn-al-jawzi j.7 p.206-207}."
  en: "Abd Allah ibn Ja'far, known as Ibn al-Wathhab, escaped detention when al-Ta'i' was deposed. He moved about the lands; then al-Qadir sent for him, and he was brought in under arrest and imprisoned, but he escaped again and went to Gilan, claiming to be al-Ta'i' li-llah. He cited signs he knew from his familiarity with the caliphal palace, and they accepted and honoured him. Ibn al-Abbas, one of their amirs, married him to his daughter and proclaimed him in his town, and people of other regions obeyed him and paid him the tithe. Then some of them came to Baghdad, his true situation became clear to them, and they withdrew from him {cite:muntazam-ibn-al-jawzi j.7 p.206-207}."
  es: "Abd Allah ibn Ja'far, conocido como Ibn al-Wathhab, escapó de la detención cuando al-Ta'i' fue depuesto. Vagó por las tierras; entonces al-Qadir lo mandó llamar, fue arrestado y encarcelado, pero escapó de nuevo y fue a Gilan, afirmando ser al-Ta'i' li-llah. Citó señales que conocía por su familiaridad con el palacio califal, y lo aceptaron y honraron. Ibn al-Abbas, uno de sus emires, lo casó con su hija y lo proclamó en su ciudad, y la gente de otras regiones lo obedeció y le pagó el diezmo. Entonces algunos de ellos llegaron a Bagdad, su verdadera situación se hizo evidente para ellos, y se distanciaron de él {cite:muntazam-ibn-al-jawzi, vol. 7, págs. 206-207}."
  fr: "Abd Allah ibn Ja'far, connu sous le nom d'Ibn al-Wathhab, échappa à la déposition d'al-Ta'i'. Il erra à travers le pays; al-Qadir le fit venir, et il fut arrêté et emprisonné. Mais il s'évada de nouveau et se rendit à Gilan, se faisant passer pour al-Ta'i' li-llah. Il cita des signes qu'il connaissait de par sa familiarité avec le palais califal, et on l'accepta et on l'honora. Ibn al-Abbas, l'un de leurs émirs, le maria à sa fille et le proclama dans sa ville. Les habitants des régions voisines lui obéirent et lui versèrent la dîme. Puis certains d'entre eux vinrent à Bagdad, découvrirent sa véritable nature et se retirèrent de lui."
  ur: "عبد اللہ ابن جعفر، جسے ابن الثاب کے نام سے جانا جاتا ہے، جب الطائی کو معزول کر دیا گیا تو نظر بندی سے بچ گیا۔ وہ زمینوں کے ارد گرد منتقل ہو گیا؛ پھر القادر نے اسے بلوایا، اور اسے گرفتار کر کے قید کر دیا گیا، لیکن وہ دوبارہ فرار ہو گیا اور الطائی للہ ہونے کا دعویٰ کرتے ہوئے گیلان چلا گیا۔ اس نے ان نشانیوں کا حوالہ دیا جو وہ خلیفہ محل کے ساتھ اپنی واقفیت سے جانتے تھے، اور انہوں نے اسے قبول کیا اور عزت دی۔ ان کے ایک امیر ابن العباس نے ان کی شادی اپنی بیٹی سے کر دی اور اپنے شہر میں اس کا اعلان کر دیا اور دوسرے علاقوں کے لوگوں نے اس کی اطاعت کی اور اسے دسواں حصہ دیا۔ پھر ان میں سے کچھ بغداد آئے، ان پر اس کی حقیقت واضح ہوگئی اور وہ اس سے دستبردار ہوگئے۔"
