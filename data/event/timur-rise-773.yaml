label: { ar: "ابتداء خروج تمرلنك", en: "The Beginning of Timur's Rise" }
summary:
  ar: "في سنة ثلاث وسبعين وسبع مئة كان ابتداء خروج تمرلنك الذي أخرب البلاد وأباد العباد واستمر يعثو في الأرض بالفساد إلى أن هلك في ليلة الأربعاء سابع عشر شعبان سنة سبع وثمان مئة وفيه قيل فعل التتار ولو رأوا فعال تمرلنك إذاً كان أعظما وطائره في جلق كان أشأما، وكان أصله من أبناء الفلاحين ونشأ يسرق ويقطع الطريق ثم انضم إلى خدمة صاحب خيل السلطان ثم قرر مكانه بعد موته وما زال يترقى إلى أن وصل إلى ما وصل، وقيل لبعضهم في أي سنة كان ابتداء خروجه قال في سنة {cite:tarikh-khulafa-minhaj-1434 p. 758-759}."
  en: "In 773 began Timur's emergence — he ruined the lands and destroyed the people, ranging till he died on the night of Wednesday 17 Sha'ban 807, prompting the verse: 'what the Tatars did — had they seen Timur's deeds, that was the greater; his ill omen would have been the worse'. Of peasant stock, he began stealing and cutting the road, then joined the service of the sultan's horse-master and rose without end {cite:tarikh-khulafa-minhaj-1434 p. 758-759}."
