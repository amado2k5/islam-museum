label: { ar: "ابتداء خروج تمرلنك", en: "The Beginning of Timur's Rise", es: "El comienzo del ascenso de Timur", fr: "Le début de l'ascension de Timur", ur: "تیمور کے عروج کا آغاز", tr: "Timur'un ayrılışı başlıyor", id: "Kepergian Tamerlan dimulai" }
summary:
  ar: "في سنة ثلاث وسبعين وسبع مئة كان ابتداء خروج تمرلنك الذي أخرب البلاد وأباد العباد واستمر يعثو في الأرض بالفساد إلى أن هلك في ليلة الأربعاء سابع عشر شعبان سنة سبع وثمان مئة وفيه قيل فعل التتار ولو رأوا فعال تمرلنك إذاً كان أعظما وطائره في جلق كان أشأما، وكان أصله من أبناء الفلاحين ونشأ يسرق ويقطع الطريق ثم انضم إلى خدمة صاحب خيل السلطان ثم قرر مكانه بعد موته وما زال يترقى إلى أن وصل إلى ما وصل، وقيل لبعضهم في أي سنة كان ابتداء خروجه قال في سنة {cite:tarikh-khulafa-minhaj-1434 p. 758-759}."
  en: "In 773 began Timur's emergence — he ruined the lands and destroyed the people, ranging till he died on the night of Wednesday 17 Sha'ban 807, prompting the verse: 'what the Tatars did — had they seen Timur's deeds, that was the greater; his ill omen would have been the worse'. Of peasant stock, he began stealing and cutting the road, then joined the service of the sultan's horse-master and rose without end {cite:tarikh-khulafa-minhaj-1434 p. 758-759}."
  es: "En 773 comenzó el ascenso de Timur: arruinó las tierras y destruyó a los pueblos, campando a sus anchas hasta su muerte la noche del miércoles 17 de Sha'ban de 807, lo que inspiró el verso: «Lo que hicieron los tártaros, si hubieran visto las hazañas de Timur, habría sido aún mayor; su mal presagio habría sido peor». De origen campesino, comenzó robando y abriendo caminos, luego se unió al servicio del amo de caballos del sultán y ascendió sin cesar {cite:tarikh-khulafa-minhaj-1434 p. 758-759}."
  fr: "En 773 commença l'ascension de Timour; il ravagea les terres et extermina les populations, et ce jusqu'à sa mort dans la nuit du mercredi 17 Sha'ban 807, inspirant le verset: « Ce que firent les Tatars – s'ils avaient vu les actes de Timour, cela aurait été plus grand encore; son mauvais présage aurait été plus terrible. » Issu d'une famille paysanne, il commença par voler et tracer des routes, puis entra au service du maître des écuries du sultan et son ascension fut fulgurante (voir: Tarikh-Khulafa-Minhaj-1434, p. 758-759)."
  ur: "773 میں تیمور کا ظہور شروع ہوا - اس نے زمینوں کو برباد کیا اور لوگوں کو تباہ کیا، یہاں تک کہ وہ بدھ 17 شعبان 807 کی رات کو مر گیا، اس آیت کا اشارہ ہے: 'تاتاریوں نے کیا کیا - اگر انہوں نے تیمور کے اعمال کو دیکھا، تو یہ بہت بڑا تھا؛ اس کی بدشگونی بدتر ہوتی۔ کسانوں کے ذخیرے میں سے، اس نے چوری اور سڑک کاٹنا شروع کی، پھر سلطان کے گھوڑے کے مالک کی خدمت میں شامل ہو گیا اور بے انتہا اٹھ کھڑا ہوا۔ 758-759}۔"
  tr: "Yedi yüz yetmiş üç yılında, ülkeyi harap eden ve halkı yok eden Timur Lenk'in ortaya çıkışı başladı. Sekiz yüz yedi yılında, Şaban ayının on yedinci Çarşamba gecesi ölene kadar ülkede yolsuzluğu yaymaya devam etti. Onun hakkında şöyle denildi: \"Tatarlar bunu yaptı, Timur Lenk'in yaptıklarını görselerdi daha da büyük bir felaket olurdu ve Şam'daki kuşu daha da uğursuzdu.\" Aslen köylü bir ailenin çocuğu olup, hırsızlık ve yol soygunu yaparak büyüdü. Sonra Sultan'ın süvarilerinin hizmetine girdi ve ölümünden sonra onun yerine atandı. Ulaştığı noktaya kadar yükselmeye devam etti. Bazılarına onun ortaya çıkışının hangi yılda başladığı soruldu. Şöyle dedi: \"Yıl {cite:tarikh-khulafa-minhaj-1434 s. 758-759}.\""
  id: "Pada tahun 773, kemunculan Timur Lenk dimulai, yang menghancurkan negeri dan memusnahkan rakyat. Ia terus menyebarkan korupsi di negeri itu hingga ia binasa pada malam Rabu, tanggal 17 Sya'ban, tahun 807. Dikatakan tentangnya, “Orang Tatar melakukan ini, dan jika mereka melihat apa yang dilakukan Timur Lenk, itu akan lebih besar, dan burungnya di Damaskus lebih pertanda buruk.” Ia berasal dari keluarga petani dan tumbuh besar dengan mencuri dan merampok di jalan raya. Kemudian ia bergabung dengan pasukan berkuda Sultan, dan kemudian ia diangkat ke posisinya setelah kematian Sultan. Ia terus naik pangkat hingga mencapai apa yang telah dicapainya. Dikatakan kepada sebagian dari mereka pada tahun berapa kemunculannya dimulai. Ia berkata, “Pada tahun {cite:tarikh-khulafa-minhaj-1434 p. 758-759}.”"
