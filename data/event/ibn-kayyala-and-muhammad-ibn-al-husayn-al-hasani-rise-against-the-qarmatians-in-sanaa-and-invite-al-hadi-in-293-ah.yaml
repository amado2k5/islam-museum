id: "event/ibn-kayyala-and-muhammad-ibn-al-husayn-al-hasani-rise-against-the-qarmatians-in-sanaa-and-invite-al-hadi-in-293-ah"
class: event
kind: other
label:
  ar: "ابن كيالة ومحمد بن الحسين الحسني يثوران على القرامطة في صنعاء ويستدعيان الهادي، سنة 293هـ، ص391"
  en: "Ibn Kayyala and Muhammad ibn al-Husayn al-Hasani rise against the Qarmatians in Sanaa and invite al-Hadi, in 293 AH, p. 391"
  ur: "ابن کیالہ اور محمد بن الحسین الحسنی صنعاء میں قرامطہ کے خلاف اٹھتے ہیں اور ہادی کو بلاتے ہیں، 293ھ، ص391"
  es: "Ibn Kayyala y Muhammad ibn al-Husayn al-Hasani se levantan contra los Qarmatianos en Sanaa e invitan a al-Hadi, en 293 AH, p. 391"
summary:
  ar: "عاد ابن كيالة إلى صنعاء وصعد غمدان، وأرسل إلى محمد بن الحسين الحسني يطلب المظافرة على الوثوب بالقرامطة، على أن تكون الدعوة للهادي، فقاتلوا دعاتهم وقتلوا منهم، ثم كتبوا إلى الهادي يستدعونه."
  en: "Ibn Kayyala returned to Sanaa, climbed Ghumdan and asked Muhammad ibn al-Husayn al-Hasani to join him in rising against the Qarmatians, with the call made for al-Hadi. They fought the Qarmatian preachers, killed some of them, and then wrote to al-Hadi asking him to come."
  ur: "ابن کیالہ صنعاء لوٹ کر غمدان پر چڑھا اور محمد بن الحسین الحسنی سے قرامطہ کے خلاف مل کر اٹھنے کی درخواست کی، اس شرط پر کہ دعوت ہادی کی ہو۔ انہوں نے قرامطہ کے داعیوں سے جنگ کی، کچھ کو قتل کیا، پھر ہادی کو خط لکھ کر بلایا۔"
  es: "Ibn Kayyala regresó a Sanaa, subió a Ghumdan y le pidió a Muhammad ibn al-Husayn al-Hasani que se uniera a él en una sublevación contra los cármatas, haciendo un llamado a al-Hadi. Combatieron a los predicadores cármatas, mataron a algunos de ellos y luego escribieron a al-Hadi pidiéndole que acudiera."
