summary:
  ar: "وعظ ابن الجوزي يوم العاشر من المحرم سنة ٥٦٨هـ الموافق للأول من أيلول/سبتمبر ١١٧٢م — وهو يوم عاشوراء — موعظة عامة حضرها جمع غفير، وفي السنة نفسها أذن له الخليفة المستضيء أن يعظ بحضوره سلسلة مجالس عند باب بدر {cite:encyclopaedia-of-islam-2 vol. 3 p. 783}."
  en: "On 10 Muharram 568 / 1 September 1172 — the day of Ashura — Ibn al-Jawzi preached a popular exhortation before a very large crowd; in the same year the caliph al-Mustadi authorised him to preach a series of sermons in the caliph's presence at the Badr gate {cite:encyclopaedia-of-islam-2 vol. 3 p. 783}."
  ur: "10 محرم 568ھ بمطابق یکم ستمبر 1172ء — یومِ عاشورہ — ابن الجوزی نے ایک بہت بڑی بھیڑ کے سامنے وعظ کیا؛ اسی سال خلیفہ مستضیع نے انھیں بابِ بدر پر اپنی موجودگی میں مجالسِ وعظ کی اجازت دی {cite:encyclopaedia-of-islam-2 vol. 3 p. 783}۔"
