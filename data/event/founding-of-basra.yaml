label: { ar: "بناء البصرة", en: "The founding of Basra", es: "La fundación de Basora", fr: "La fondation de Bassorah", ur: "بصرہ کی بنیاد", tr: "Basra inşaatı", id: "Konstruksi Basra" }
summary:
  ar: "في سنة أربع عشرة وجّه عمر بن الخطاب عتبة بن غزوان إلى البصرة بقول المدائني، وذكر سيف أنها مُصّرت في ربيع سنة ست عشرة {cite:tabari-tarikh-abu-al-fadl j.3 p.590}. ويعرض الطبري فصل «ذكر بناء البصرة» في الصفحات 590 إلى 597 {cite:tabari-tarikh-abu-al-fadl j.3 p.630}. وعند البلاذري: كانت البصرة قد مُصّرت فيما بين يوم النخيلة ويوم القادسية مُصّرها عتبة بن غزوان ثم استأذن للحج وخلّف المغيرة بن شعبة فكتب إليه عمر بعهده فلم يلبث أن قُرف بما قُرف به فولّى أبا موسى البصرة وأشخص المغيرة إلى المدينة ثم ردّه ومن شهد عليه إلى البصرة فلما حضر يوم القادسية كتب عمر إلى أبي موسى يأمره بإمداد سعد فأمده بالمغيرة في ثمانمائة ويقال في أربعمائة فشهدها ثم شخص إلى المدينة وقيل إن الذي أمده بالمغيرة عتبة بن غزوان وأن المغيرة إنما ولي البصرة بعد قدومه من القادسية وأن عمر لم يخرجه من المدينة حين أشخصه إليها لما قُرف به."
  en: "In 14 Umar ibn al-Khattab sent Utba ibn Ghazwan to Basra, on the account of al-Mada'ini; Sayf reports that it was established as a garrison town in Rabi' 16 {cite:tabari-tarikh-abu-al-fadl j.3 p.590}. Al-Tabari presents the section 'The Account of the Founding of Basra' on pages 590 to 597 {cite:tabari-tarikh-abu-al-fadl j.3 p.630}. According to al-Baladhuri, Basra had been established as a garrison town between the day of al-Nukhayla and the day of al-Qadisiyya, by Utba ibn Ghazwan, who then sought leave for the pilgrimage and left al-Mughira ibn Shu'ba as his deputy. Umar wrote to al-Mughira confirming his commission, but before long he was accused of the same offence. Umar then put Abu Musa in charge of Basra and sent al-Mughira to Medina, later returning him, with those who had testified against him, to Basra. When he was present at al-Qadisiyya, Umar wrote to Abu Musa ordering him to reinforce Sa'd; Abu Musa sent al-Mughira with eight hundred men, or, it is said, four hundred, and al-Mughira took part and then went to Medina. It was also said that Utba ibn Ghazwan was the one who sent al-Mughira as reinforcement, that al-Mughira took up Basra only after his return from al-Qadisiyya, and that Umar did not expel him from Medina over the charge when he summoned him there."
  es: "En 14 Umar ibn al-Khattab envió a Utba ibn Ghazwan a Basora, por encargo de al-Mada'ini; Sayf informa que fue establecida como ciudad guarnición en Rabi' 16 {cite:tabari-tarikh-abu-al-fadl j.3 p.590}. Al-Tabari presenta la sección 'El relato de la fundación de Basora' en las páginas 590 a 597 {cite:tabari-tarikh-abu-al-fadl j.3 p.630}. Según al-Baladhuri, Basora había sido establecida como ciudad guarnición entre el día de al-Nukhayla y el día de al-Qadisiyya, por Utba ibn Ghazwan, quien luego pidió permiso para la peregrinación y dejó a al-Mughira ibn Shu'ba como su lugarteniente. Umar escribió a al-Mughira confirmando su nombramiento, pero poco después fue acusado del mismo delito. Entonces Umar puso a Abu Musa al mando de Basora y envió a al-Mughira a Medina, para luego devolverlo a Basora junto con quienes habían testificado en su contra. Cuando se encontraba en al-Qadisiyya, Umar escribió a Abu Musa ordenándole que reforzara Sa'd; Abu Musa envió a al-Mughira con ochocientos hombres, o, según se dice, cuatrocientos, y al-Mughira participó en la operación y luego se dirigió a Medina. También se dice que Utba ibn Ghazwan fue quien envió a al-Mughira como refuerzo, que al-Mughira tomó Basora solo después de su regreso de al-Qadisiyya, y que Umar no lo expulsó de Medina por la acusación cuando lo convocó allí."
  fr: "En 14, Umar ibn al-Khattab envoya Utba ibn Ghazwan à Bassora, sur ordre d'al-Mada'ini. Sayf rapporte que la ville fut établie comme ville de garnison en Rabi' 16 (cf. Tabari-tarikh-abu-al-fadl j.3 p.590). Al-Tabari présente la section « Récit de la fondation de Bassora » aux pages 590 à 597 (cf. Tabari-tarikh-abu-al-fadl j.3 p.630). Selon al-Baladhuri, Bassora fut établie comme ville de garnison entre le jour d'al-Nukhayla et celui d'al-Qadisiyya par Utba ibn Ghazwan, qui prit ensuite congé pour le pèlerinage et laissa al-Mughira ibn Shu'ba comme adjoint. Umar écrivit à al-Mughira pour confirmer sa nomination, mais peu après, il fut accusé du même délit. Umar confia alors Bassora à Abou Moussa et envoya al-Mughira à Médine, avant de le ramener à Bassora avec ceux qui avaient témoigné contre lui. Présent à al-Qadisiyya, Umar écrivit à Abou Moussa pour lui ordonner de renforcer Sa'd. Abou Moussa dépêcha al-Mughira avec huit cents hommes, ou, selon certaines sources, quatre cents. Al-Mughira participa à la bataille puis se rendit à Médine. On raconte également qu'Utba ibn Ghazwan fut celui qui envoya al-Mughira en renfort, qu'al-Mughira ne prit le contrôle de Bassora qu'après son retour d'al-Qadisiyya, et qu'Umar ne l'expulsa pas de Médine malgré cette accusation lorsqu'il le convoqua."
  ur: "14 میں عمر بن الخطاب نے عتبہ بن غزوان کو المدائنی کے حساب سے بصرہ بھیجا۔ سیف نے بیان کیا ہے کہ اسے ربیع 16 میں ایک گیریژن ٹاؤن کے طور پر قائم کیا گیا تھا۔ الطبری نے صفحہ 590 تا 597 پر صفحہ 590 تا 597 پر باب 'بصرہ کی بنیاد کا حساب' پیش کیا ہے۔ البلادھوری کے مطابق، بصرہ کو عتبہ بن غزوان نے یوم نخائلہ اور یوم القدسیہ کے درمیان ایک گیریژن شہر کے طور پر قائم کیا تھا، جس نے پھر حج کے لیے رخصت طلب کی اور المغیرہ بن شعبہ کو اپنا نائب بنا کر چھوڑ دیا۔ عمر نے اپنے کمیشن کی تصدیق کے لیے المغیرہ کو خط لکھا، لیکن اس سے پہلے ہی ان پر اسی جرم کا الزام لگا دیا گیا۔ اس کے بعد عمر نے ابو موسیٰ کو بصرہ کا انچارج بنایا اور المغیرہ کو مدینہ بھیجا، بعد میں انہیں ان لوگوں کے ساتھ جنہوں نے اس کے خلاف گواہی دی تھی، بصرہ واپس بھیج دیا۔ جب وہ القدسیہ میں موجود تھے تو عمر نے ابو موسیٰ کو خط لکھا کہ سعد کو تقویت پہنچانا۔ ابو موسیٰ نے مغیرہ کو آٹھ سو آدمیوں کے ساتھ بھیجا، یا کہا جاتا ہے کہ چار سو، اور مغیرہ نے حصہ لیا اور پھر مدینہ چلے گئے۔ یہ بھی کہا گیا کہ عتبہ بن غزوان ہی تھے جس نے مغیرہ کو کمک کے طور پر بھیجا تھا، کہ المغیرہ نے القدسیہ سے واپسی کے بعد ہی بصرہ پر قبضہ کیا تھا، اور یہ کہ عمر نے جب اسے وہاں بلوایا تھا تو اس الزام پر اسے مدینہ سے نہیں نکالا تھا۔"
  tr: "El-Medaini'ye göre, on dördüncü yılda Ömer ibn el-Hattab, Utbe ibn Gazvan'ı Basra'ya gönderdi ve Sayf, şehrin on altıncı yılın baharında kurulduğunu belirtti {kaynak: Tabari-tarikh-ebu-el-fadl cilt 3, s. 590}. El-Tabari, 590-597. sayfalarda \"Basra'nın Kuruluşundan Bahsedilmesi\" bölümünü sunmaktadır {kaynak: Tabari-tarikh-ebu-el-fadl cilt 3, s. 630}. El-Baladhuri'ye göre: Basra, Nukhaila günü ile Kadisiye günü arasında tahkim edildi. Tahkim, Utbe ibn Gazvan tarafından yapıldı. Sonra Hacca gitmek için izin istedi ve El-Mughira ibn Şube'yi sorumlu bıraktı. Ömer ona atamasını bildiren bir mektup yazdı. Çok geçmeden, suçlandığı şeyle suçlandı. Böylece Ebu Musa'yı Basra'ya atadı ve Muğira'yı Medine'ye çağırdı. Sonra onu ve aleyhine şahitlik edenleri Basra'ya geri gönderdi. Kadıyye Savaşı günü geldiğinde Ömer, Ebu Musa'ya Sa'd'ı takviye etmesini emreden bir mektup yazdı. Bunun üzerine Ebu Musa, sekiz yüz kişiyle (ve rivayete göre dört yüz kişiyle) Muğira'yı da yanına alarak Sa'd'ı takviye etti. Buna şahit olduktan sonra Medine'ye gitti. Rivayetlere göre, onu Muğira ile takviye eden kişi Utbe ibn Gazvan'dı ve Muğira, Kadıyye Savaşı'ndan döndükten sonra Basra'ya atanmıştı ve Ömer, onu Medine'ye çağırdığında, aleyhindeki suçlamalar nedeniyle Medine'den göndermemişti."
  id: "Pada tahun keempat belas, Umar ibn al-Khattab mengutus Utbah ibn Ghazwan ke Basra, menurut al-Madaini, dan Sayf menyebutkan bahwa kota itu didirikan pada musim semi tahun keenam belas {kutip:tabari-tarikh-abu-al-fadl vol.3 hlm.590}. Al-Tabari menyajikan bab “Penyebutan Pendirian Basra” pada halaman 590 hingga 597 {kutip:tabari-tarikh-abu-al-fadl vol.3 hlm.630}. Menurut Al-Baladhuri: Basra dibentengi antara hari Al-Nukhaila dan hari Al-Qadisiyah. Kota itu dibentengi oleh Utbah ibn Ghazwan. Kemudian ia meminta izin untuk pergi haji dan meninggalkan Al-Mughira ibn Shu’bah untuk mengurusnya. Umar menulis surat kepadanya tentang pengangkatannya. Tidak lama kemudian ia dituduh melakukan apa yang dituduhkan kepadanya. Maka ia menunjuk Abu Musa ke Basra dan memanggil Al-Mughira ke Madinah. Kemudian ia mengirim Al-Mughira dan orang-orang yang bersaksi melawannya kembali ke Basra. Ketika hari Al-Qadisiyah tiba, Umar menulis surat kepada Abu Musa memerintahkannya untuk memperkuat Sa’d. Maka ia memperkuat Sa’d dengan Al-Mughira sebanyak delapan ratus orang, dan ada juga yang mengatakan empat ratus orang. Ia menjadi saksi, lalu ia pergi ke Madinah. Dikatakan bahwa orang yang memperkuat Sa’d dengan Al-Mughira adalah Utbah bin Ghazwan, dan bahwa Al-Mughira baru ditunjuk ke Basra setelah kedatangannya dari Al-Qadisiyah, dan bahwa Umar tidak mengirimnya keluar dari Madinah ketika memanggilnya ke sana karena tuduhan yang dilayangkan kepadanya."
