label: { ar: "بناء البصرة", en: "The founding of Basra" }
summary:
  ar: "في سنة أربع عشرة وجّه عمر بن الخطاب عتبة بن غزوان إلى البصرة بقول المدائني، وذكر سيف أنها مُصّرت في ربيع سنة ست عشرة {cite:tabari-tarikh-abu-al-fadl j.3 p.590}. ويعرض الطبري فصل «ذكر بناء البصرة» في الصفحات 590 إلى 597 {cite:tabari-tarikh-abu-al-fadl j.3 p.630}. وعند البلاذري: كانت البصرة قد مُصّرت فيما بين يوم النخيلة ويوم القادسية مُصّرها عتبة بن غزوان ثم استأذن للحج وخلّف المغيرة بن شعبة فكتب إليه عمر بعهده فلم يلبث أن قُرف بما قُرف به فولّى أبا موسى البصرة وأشخص المغيرة إلى المدينة ثم ردّه ومن شهد عليه إلى البصرة فلما حضر يوم القادسية كتب عمر إلى أبي موسى يأمره بإمداد سعد فأمده بالمغيرة في ثمانمائة ويقال في أربعمائة فشهدها ثم شخص إلى المدينة وقيل إن الذي أمده بالمغيرة عتبة بن غزوان وأن المغيرة إنما ولي البصرة بعد قدومه من القادسية وأن عمر لم يخرجه من المدينة حين أشخصه إليها لما قُرف به."
  en: "In 14 Umar ibn al-Khattab sent Utba ibn Ghazwan to Basra, on the account of al-Mada'ini; Sayf reports that it was established as a garrison town in Rabi' 16 {cite:tabari-tarikh-abu-al-fadl j.3 p.590}. Al-Tabari presents the section 'The Account of the Founding of Basra' on pages 590 to 597 {cite:tabari-tarikh-abu-al-fadl j.3 p.630}. According to al-Baladhuri, Basra had been established as a garrison town between the day of al-Nukhayla and the day of al-Qadisiyya, by Utba ibn Ghazwan, who then sought leave for the pilgrimage and left al-Mughira ibn Shu'ba as his deputy. Umar wrote to al-Mughira confirming his commission, but before long he was accused of the same offence. Umar then put Abu Musa in charge of Basra and sent al-Mughira to Medina, later returning him, with those who had testified against him, to Basra. When he was present at al-Qadisiyya, Umar wrote to Abu Musa ordering him to reinforce Sa'd; Abu Musa sent al-Mughira with eight hundred men, or, it is said, four hundred, and al-Mughira took part and then went to Medina. It was also said that Utba ibn Ghazwan was the one who sent al-Mughira as reinforcement, that al-Mughira took up Basra only after his return from al-Qadisiyya, and that Umar did not expel him from Medina over the charge when he summoned him there."
