summary:
  ar: "في سنة أربع عشرة وجّه عمر بن الخطاب عتبة بن غزوان إلى البصرة بقول المدائني، وذكر سيف أنها مُصّرت في ربيع سنة ست عشرة {cite:tabari-tarikh-abu-al-fadl j.3 p.590}. ويعرض الطبري فصل «ذكر بناء البصرة» في الصفحات 590 إلى 597 {cite:tabari-tarikh-abu-al-fadl j.3 p.630}."
