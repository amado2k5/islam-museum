id: event/ibn-abd-al-barr-begins-hadith-385
class: event
kind: gathering
label:
  ar: "ابن عبد البر يطلب الحديث بقرطبة، نحو ٣٨٥هـ"
  en: "Ibn 'Abd al-Barr begins the hadith quest at Cordoba, about 385/995"
  ur: "ابن عبد البر قرطبہ میں طلب حدیث کا آغاز کرتے ہیں، تقریباً 385ھ/995ء"
summary:
  ar: "طلب ابن عبد البر الحديث سنة بضع وثمانين وثلاثمائة، قبل أن يولد الحافظ أبو بكر الخطيب بأعوام، فروى عن خلف بن القاسم وعبد الوارث بن سفيان وأبي الوليد بن الفرضي وأبي عمر الطلمنكي وجماعة لا يبلغون سبعين نفساً {cite:tarikh-islam-dhahabi p. 137}، وسمع سنن أبي داود عالياً من ابن عبد المؤمن وقرأ كتاب الزعفراني على ابن ضيفون {cite:tarikh-islam-dhahabi p. 141}."
  en: "Ibn 'Abd al-Barr took up the hadith quest in 'three hundred and eighty-something', years before the hafiz al-Khatib al-Baghdadi was born; he transmitted from Khalf ibn al-Qasim, 'Abd al-Warith ibn Sufyan, Abu al-Walid ibn al-Faradi and Abu 'Amr al-Talamanki — fewer than seventy shaykhs in all {cite:tarikh-islam-dhahabi p. 137} — heard the Sunan of Abu Dawud on a high isnad from Ibn 'Abd al-Mu'min and read al-Za'farani's book under Ibn Dayfun {cite:tarikh-islam-dhahabi p. 141}."
  ur: "ابن عبد البر نے تین سو اسی کے عشرے میں طلب حدیث شروع کی، حافظ ابو بکر خطیب بغدادی کی پیدائش سے برسوں پہلے؛ انھوں نے خلف بن قاسم، عبد الوارث بن سفیان، ابوالولید ابن فرضی اور ابو عمر طلمنکی سے روایت کی — مجموعی طور پر ستر سے کم شیوخ سے {cite:tarikh-islam-dhahabi p. 137} — اور ابن عبد المومن سے بلند سند سے سنن ابی داوود سنی اور ابن ضیفون پر زعفرانی کی کتاب پڑھی {cite:tarikh-islam-dhahabi p. 141}۔"
