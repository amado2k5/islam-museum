summary:
  ar: "نقل سعيد بن سلطان عاصمته من مسقط إلى زنجبار في ثلاثينيات القرن التاسع عشر، فصارت الجزيرة مقر سلطانه التجاري في غرب المحيط الهندي."
  en: "Said bin Sultan moved his capital from Muscat to Zanzibar in the 1830s, and the island became the seat of his commercial power in the western Indian Ocean."
  ur: "سعید بن سلطان نے 1830ء کی دہائی میں دارالحکومت مسقط سے زنجبار منتقل کیا، اور یہ جزیرہ مغربی بحر ہند میں ان کی تجارتی طاقت کا مرکز بن گیا۔"
  es: "Said bin Sultan trasladó su capital de Mascate a Zanzíbar en la década de 1830, y la isla se convirtió en la sede de su poder comercial en el oeste del Océano Índico."
  fr: "Dans les années 1830, Said bin Sultan transféra sa capitale de Mascate à Zanzibar, et l'île devint le siège de son pouvoir commercial dans l'ouest de l'océan Indien."
  tr: "Said bin Sultan, 1830'larda başkentini Maskat'tan Zanzibar'a taşıdı ve ada, Batı Hint Okyanusu'ndaki ticari gücünün merkezi haline geldi."
  id: "Said bin Sultan memindahkan ibu kotanya dari Muscat ke Zanzibar pada tahun 1830-an, dan pulau itu menjadi pusat kekuatan komersialnya di Samudra Hindia bagian barat."
