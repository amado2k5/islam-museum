label:
  ar: "نقل سعيد بن سلطان عاصمته إلى زنجبار"
  en: "Said bin Sultan moves his capital to Zanzibar"
  ur: "سعید بن سلطان کا دارالحکومت زنجبار منتقل کرنا"
  es: "Said bin Sultan traslada su capital a Zanzíbar."
  fr: "Saïd bin Sultan transfère sa capitale à Zanzibar"
