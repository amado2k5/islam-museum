summary:
  ar: "في غزوة الخندق اقتحمت خيل المشركين ثغرة فيه، فخرج علي في نفر من المسلمين حتى أخذوا الثغرة عليهم، ثم برز عمرو بن عبد ود فدعا إلى النزال، فبارزه علي فقتله، فانهزمت خيلهم هاربة من الخندق؛ ويذكر الكتاب من أشعار عمرو ما روي في ذلك."
  en: "At the Battle of the Trench, enemy horsemen forced a breach in the ditch. Ali went out with a few Muslims to close it, then Amr ibn Abd Wudd called for single combat; Ali fought him and killed him, and the enemy horsemen fled."
