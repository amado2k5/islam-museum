label: { ar: "مبارزة علي لعمرو بن عبد ود يوم الخندق", en: "Ali's duel with Amr ibn Abd Wudd at the Trench", es: "El duelo de Ali con Amr ibn Abd Wudd en la trinchera.", fr: "Le duel d'Ali contre Amr ibn Abd Wudd au tranchée" }
summary:
  ar: "في غزوة الخندق اقتحمت خيل المشركين ثغرة فيه، فخرج علي في نفر من المسلمين حتى أخذوا الثغرة عليهم، ثم برز عمرو بن عبد ود فدعا إلى النزال، فبارزه علي فقتله، فانهزمت خيلهم هاربة من الخندق؛ ويذكر الكتاب من أشعار عمرو ما روي في ذلك."
  en: "At the Battle of the Trench, enemy horsemen forced a breach in the ditch. Ali went out with a few Muslims to close it, then Amr ibn Abd Wudd called for single combat; Ali fought him and killed him, and the enemy horsemen fled."
  es: "En la Batalla de la Trinchera, la caballería enemiga abrió una brecha en la zanja. Ali salió con algunos musulmanes para cerrarla, entonces Amr ibn Abd Wudd retó a un duelo singular; Ali luchó contra él y lo mató, y la caballería enemiga huyó."
  fr: "Lors de la bataille du Fossé, des cavaliers ennemis percèrent une brèche dans le fossé. Ali sortit avec quelques musulmans pour la refermer, puis Amr ibn Abd Wudd le provoqua en duel; Ali l’affronta et le tua, et les cavaliers ennemis prirent la fuite."
