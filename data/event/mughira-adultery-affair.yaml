label: { ar: "قصة المغيرة بن شعبة وأم جميل", en: "The Mughira-Umm Jamil Affair", es: "El asunto Mughira-Umm Jamil", fr: "L'affaire Mughira-Umm Jamil", ur: "مغیرہ ام جمیل معاملہ", tr: "Muğire ibn Şu'ba ile Ümmü Cemil'in hikayesi", id: "Kisah Al-Mughira bin Syu'ba dan Ummu Jamil" }
summary:
  ar: "كان المغيرة بن شعبة يختلف إلى أم جميل بنت يحجن من بني هلال ولها زوج من ثقيف الحجاج بن عتيك فرصده أبو بكرة بن مسروح وشبل بن معبد البجلي ونافع بن الحارث بن كلدة وزياد بن عبيدة حتى دخل عليها فهجموا عليه فوجدوهما عريانين فشهدوا عند عمر فولى عمر أبا موسى الأشعري البصرة وقال إني أريد أن أبعثك إلى بلد قد عشش فيه الشيطان وبعث معه البراء بن مالك وعمران بن الحصين وعوف بن وهب فأشخص المغيرة فلما وقفوا بين يدي عمر شهد نافع وشبل وأبو بكرة صراحة ثم جاء زياد رابعاً فقال رأيت منظراً قبيحاً وسمعت نفساً عالياً وما أدري أخالطها أم لا فقال عمر إني أرى وجه رجل أرجو أن لا يرجم رجل من أصحاب رسول الله على يده ولا يخزى بشهادته فأمر بالثلاثة فجلدوا فقال شبل أتجلد شهود الحق وتبطل الحد ولما جلد أبو بكرة قال أشهد إن المغيرة لزان فقال عمر حدوه فقال علي إن جعلتها شهادة فارجم صاحبك وحلف أبو بكرة أن لا يكلم زياداً أبداً وكان أخاه لأمه سمية."
  en: "Al-Mughira ibn Shu'ba kept visiting Umm Jamil bint Yahjan of Hilal — wife of the Thaqafi al-Hajjaj ibn Utayk — till Abu Bakra ibn Masruh, Shibl ibn Ma'bad al-Bajali, Nafi' ibn al-Harith and Ziyad ibn Ubayda watched him enter and burst in on them naked; they testified before Umar, who told Abu Musa al-Ash'ari 'I am sending you to a town where Satan has nested' and made him governor with al-Bara' ibn Malik, Imran ibn al-Husayn and Awf ibn Wahb, recalling al-Mughira. Nafi', Shibl and Abu Bakra swore explicitly; Ziyad, fourth, said 'I saw an ugly sight and heard a high breathing — I know not whether he entered her'. Umar: 'I see the face of a man on whose word I hope no Companion is stoned' — he had the three flogged; Shibl cried 'you flog truth's witnesses?', Abu Bakra swore anew and was warned of the hadd — 'then it is a claim, your man is stoned' — and swore never to speak to Ziyad, his half-brother by Sumayya."
  es: "Al-Mughira ibn Shu'ba siguió visitando a Umm Jamil bint Yahjan de Hilal —esposa del Thaqafi al-Hajjaj ibn Utayk— hasta que Abu Bakra ibn Masruh, Shibl ibn Ma'bad al-Bajali, Nafi' ibn al-Harith y Ziyad ibn Ubayda lo vieron entrar y de repente desnudo; testificaron ante Umar, quien le dijo a Abu Musa al-Ash'ari: «Te envío a una ciudad donde Satanás ha anidado» y lo nombró gobernador junto con al-Bara' ibn Malik, Imran ibn al-Husayn y Awf ibn Wahb, recordando a al-Mughira. Nafi', Shibl y Abu Bakra juraron explícitamente; Ziyad, el cuarto, dijo: «Vi una visión horrible y oí una respiración agitada; no sé si la penetró». Umar: 'Veo el rostro de un hombre por cuya palabra espero que ningún Compañero sea apedreado'. Hizo azotar a los tres; Shibl gritó '¿azotas a los testigos de la verdad?', Abu Bakra juró de nuevo y fue advertido del hadd (castigo), 'entonces es una afirmación, tu hombre será apedreado', y juró no volver a hablar con Ziyad, su medio hermano por parte de Sumayya."
  fr: "Al-Mughira ibn Shu'ba rendait visite à Umm Jamil bint Yahjan de Hilal, épouse du Thaqafi al-Hajjaj ibn Utayk, jusqu'à ce qu'Abu Bakra ibn Masruh, Shibl ibn Ma'bad al-Bajali, Nafi' ibn al-Harith et Ziyad ibn Ubayda le voient entrer et les surprendre nu. Ils témoignèrent devant Umar, qui dit à Abu Musa al-Ash'ari: « Je t'envoie dans une ville où Satan a élu domicile », et le nomma gouverneur avec al-Bara' ibn Malik, Imran ibn al-Husayn et Awf ibn Wahb, rappelant al-Mughira. Nafi', Shibl et Abu Bakra prêtèrent un serment explicite; Ziyad, le quatrième, déclara: « J'ai vu une vision horrible et entendu une respiration haletante – je ne sais pas s'il est entré en elle. » Umar: « Je vois le visage d'un homme sur la parole duquel j'espère qu'aucun Compagnon ne sera lapidé » — il fit fouetter les trois; Shibl s'écria: « Vous fouettez les témoins de la vérité ? », Abu Bakra jura de nouveau et fut averti du hadd — « alors c'est une accusation, votre homme est lapidé » — et jura de ne jamais parler à Ziyad, son demi-frère par Sumayya."
  ur: "مغیرہ بن شعبہ ام جمیل بنت یحجان ہلال کے پاس جاتا رہا جو کہ ثقفی الحجاج ابن عتیق کی بیوی تھی، یہاں تک کہ ابوبکرہ بن مسروح، شبل بن معبد البجلی، نافع بن حارث اور زیاد بن عبیدہ ان کے اندر داخل ہوئے اور ان کو دیکھتے رہے۔ انہوں نے عمر کے سامنے گواہی دی، جس نے ابو موسیٰ اشعری سے کہا کہ میں تمہیں ایک ایسی بستی میں بھیج رہا ہوں جہاں شیطان نے بسیرا کر رکھا ہے اور اسے البرہ بن مالک، عمران بن الحسین اور عوف بن وہب کے ساتھ گورنر بنایا، المغیرہ کو یاد کیا۔ نافع، شبل اور ابوبکرہ نے صریح قسم کھائی۔ چوتھے نمبر کے زیاد نے کہا 'میں نے ایک بدصورت منظر دیکھا اور ایک اونچی سانس لی - مجھے نہیں معلوم کہ وہ اس میں داخل ہوا یا نہیں'۔ عمر: 'میں ایک ایسے شخص کا چہرہ دیکھ رہا ہوں جس کے کہنے پر مجھے امید ہے کہ کسی صحابی کو سنگسار نہیں کیا جائے گا' - اس نے تینوں کو کوڑے لگائے۔ شبل نے پکارا 'تم سچ کے گواہوں کو کوڑے مارو؟'، ابوبکرہ نے دوبارہ قسم کھائی اور اسے حد سے متنبہ کیا گیا - 'پھر یہ دعویٰ ہے، تمہارے آدمی کو سنگسار کیا جائے گا' - اور اس نے اپنے سوتیلے بھائی زیاد سے کبھی بات نہ کرنے کی قسم کھائی۔"
  tr: "El-Muğira ibn Şuba, Beni Hilal kabilesinden Ümmü Cemil bint Yahjin'i sık sık ziyaret ederdi. Ümmü Cemil'in kocası ise Sakif kabilesinden el-Haccac ibn Atik idi. Ebu Bekre ibn Masruh, Şibl ibn Ma'bad el-Bajali, Nafi' ibn el-Harith ibn Kalda ve Ziyad ibn Ubayda, El-Muğira'nın evine girmesini beklediler. Eve baskın yaparak onu ve karısını çıplak halde buldular. Ömer'in huzurunda şahitlik ettiler ve Ömer, \"Sizi şeytanın yuva kurduğu bir diyara göndermek istiyorum\" diyerek Ebu Musa el-Eş'ari'yi Basra valisi olarak atadı. Onunla birlikte el-Bara' ibn Malik, İmran ibn el-Hüseynin ve Avf ibn Vahb'ı gönderdi. El-Muğira çağrıldı ve Ömer'in huzurunda durduklarında Nafi', Şibl ve Ebu Bekre açıkça şahitlik ettiler. Sonra Ziyad dördüncü olarak öne çıktı ve \"Çirkin bir manzara gördüm ve ağır nefesler duydum, ama olaya karışıp karışmadığımı bilmiyorum\" dedi. Ömer, \"Şahidinin Allah Resulü'nün hiçbir Sahabesinin taşlanmasına yol açmayacağını ve onun da rezil olmayacağını umduğum bir adamın yüzünü görüyorum\" dedi. Bunun üzerine üçünün de kırbaçlanmasını emretti. Şibl, \"Hakikat şahitlerini kırbaçlayıp cezayı mı geçersiz kılıyorsunuz?\" dedi. Ebu Bekir kırbaçlandığında, \"Muğira'nın zina ettiğine şahitlik ederim\" dedi. Ömer, \"Onu kırbaçlayın\" dedi. Ali, \"Eğer bunu şahitlik sayıyorsanız, arkadaşınızı taşlayın\" dedi. Ebu Bekir, annesi Sümeyye'den olan kardeşi Ziyad ile hiç konuşmadığına yemin etti."
  id: "Al-Mughira ibn Shu'ba biasa sering mengunjungi Umm Jamil bint Yahjin dari Bani Hilal, yang memiliki suami dari Thaqif, al-Hajjaj ibn Atik. Abu Bakra ibn Masruh, Shibl ibn Ma'bad al-Bajali, Nafi' ibn al-Harith ibn Kalda, dan Ziyad ibn Ubayda mengawasinya sampai ia memasuki rumahnya. Mereka menyerbu masuk dan mendapati dia dan istrinya dalam keadaan telanjang. Mereka bersaksi di hadapan Umar, yang kemudian mengangkat Abu Musa al-Ash'ari sebagai gubernur Basra, dengan berkata, \"Aku ingin mengirimmu ke negeri tempat setan bersarang.\" Ia mengutus bersama al-Bara' ibn Malik, Imran ibn al-Husayn, dan Awf ibn Wahb. Al-Mughira dipanggil, dan ketika mereka berdiri di hadapan Umar, Nafi', Shibl, dan Abu Bakra bersaksi secara gamblang. Kemudian Ziyad maju sebagai orang keempat dan berkata, \"Aku melihat pemandangan yang mengerikan dan mendengar napas berat, tetapi aku tidak tahu apakah aku terlibat atau tidak.\" Umar berkata, \"Aku melihat wajah seorang pria yang kesaksiannya kuharap tidak akan menyebabkan rajam salah satu Sahabat Rasulullah, dan tidak pula akan mempermalukannya.\" Maka ia memerintahkan ketiga orang itu untuk dicambuk. Shibl berkata, \"Apakah kalian mencambuk saksi kebenaran dan membatalkan hukuman?\" Ketika Abu Bakra dicambuk, ia berkata, \"Aku bersaksi bahwa al-Mughira adalah seorang pezina.\" Umar berkata, \"Cambuk dia.\" Ali berkata, \"Jika kalian menganggapnya sebagai kesaksian, maka rajam temanmu.\" Abu Bakra bersumpah bahwa ia tidak pernah berbicara dengan Ziad, yang merupakan saudaranya dari ibunya, Sumayya."
