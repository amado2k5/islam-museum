summary:
  ar: "بنى مراد الثاني كُلّية المرادية في الأعوام 1424-1426م، آخر المجمعات السلطانية التي شُيّدت في بورصة؛ وضمت الجامع ومدرسة ومطبخاً وتربة المؤسس وأضرحة لاحقة {cite:freely-ottoman-architecture-2011 p. 49}."
  en: "Murad II built the Muradiye külliye in 1424-1426 CE, the last imperial mosque complex erected in Bursa; besides the mosque it included a medrese, an imaret, the founder's türbe and later tombs {cite:freely-ottoman-architecture-2011 p. 49}."
  ur: "مراد ثانی نے 1424-1426ء میں مرادیہ کلیہ بنوایا، بورصہ میں تعمیر شدہ آخری سلطانی مجمع؛ مسجد کے علاوہ اس میں مدرسہ، امارت، بانی کا تربہ اور بعد کے مقبرے شامل تھے {cite:freely-ottoman-architecture-2011 p. 49}۔"
