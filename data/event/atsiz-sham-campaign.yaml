summary:
  ar: "أرسل السلطان ألب أرسلان قائده التركي أتسز بن أوق الخوارزمي في حملة إلى جنوب الشام فانتزع الرملة وبيت المقدس من يد الفاطميين، لكنه لم يستطع الاستيلاء على عسقلان التي تعتبر بوابة الدخول إلى مصر، وبذلك أضحى السلاجقة على مقربة من قاعدة الخلافة العباسية والسلطان السلجوقي داخل بيت المقدس. وسبق ذلك أن حاصر ألب أرسلان الدولة المرداسية في حلب وأجبر أميرها محمود بن صالح بن مرداس على إقامة الدعوة للخليفة العباسي بدلاً من الفاطمي سنة ٤٦٢هـ/١٠٧٠م {cite:dawlat-uthmaniyya-salabi p. 30}."
  en: "Atsiz ibn Uwaq's Seljuk campaign into southern Syria — Ramla and Jerusalem taken from the Fatimids, Ascalon holding out — bringing the Abbasid sultanate to Jerusalem's gates {cite:dawlat-uthmaniyya-salabi p. 30}."
