summary:
  ar: "في سنة سبع وتسعين وخمس مئة كان الجوع المفرط والموت بالديار المصرية وجرت أمور تتجاوز الوصف ودام ذلك إلى نصف العام حتى قيل لو قال قائل مات ثلاثة أرباع أهل الإقليم لما أبعدوا بيعت لحوم الآدميين، وفي شعبان كانت الزلزلة العظمى التي عمت أكثر الدنيا، قال أبو شامة مات عشر خلق تحت الرم وهدمت نابلس وأحصى من هلك في هذه السنة فكان ألف ألف ومائة ألف {cite:shadharat-dhahab p. 809}."
  en: "The famine of 597 in Egypt when human flesh was sold, then in Sha'ban the great earthquake that struck most of the world — Abu Shama: a tenth of mankind died beneath the rubble, Nablus was razed, and the year's dead were counted at a million and a hundred thousand {cite:shadharat-dhahab p. 809}."
