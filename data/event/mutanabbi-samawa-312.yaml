id: event/mutanabbi-samawa-312
class: event
kind: migration
label:
  ar: "هجرة أهل المتنبي إلى السماوة، ٣١٢هـ/٩٢٤م"
  en: "The family's flight to the Samawa, 312/924"
  ur: "خاندان کا سماوہ کو ہجرت، 312ھ/924ء"
summary:
  ar: "في أواخر سنة ٣١٢هـ/٩٢٤م غادر أبو الطيب وأهله الكوفة، وربما تحت ضغط القرامطة الذين كانوا قد أخذوها ونهبوها، فأقاموا في السماوة بين بدو بني كلب سنتين كاملتين، وفي تلك السهوب الصحراوية نما عند الفتى علم عميق بلغة العرب فاخره بها طول عمره، ثم عادوا إلى الكوفة في مطلع سنة ٣١٥هـ {cite:encyclopaedia-of-islam-2 vol. 7 p. 769}."
  en: "Towards the end of 312/924, perhaps under pressure from the Karmatians who had just taken and sacked Kufa, Abu al-Tayyib and his family made a first stay of two years in the Samawa, the desert steppe between the Sawad of Kufa and the Palmyrene, among the nomadic Banu Kalb; there the boy gained the profound knowledge of Arabic of which he was later so proud, returning to Kufa at the beginning of 315/927 {cite:encyclopaedia-of-islam-2 vol. 7 p. 769}."
  ur: "312ھ/924ء کے آخر میں، شاید قرمطیوں کے دباؤ کے باعث جنھوں نے ابھی کوفہ لوٹا تھا، ابوالطیب اپنے خاندان سمیت بادیہ سماوہ میں آیا جہاں بنو کلب کے بدویوں کے درمیان دو برس رہے؛ انھی صحراؤں میں لڑکے کو عربی زبان کا وہ گہرا علم ملا جس پر وہ بعد میں فخر کرتا؛ 315ھ کے آغاز میں کوفہ لوٹ آئے {cite:encyclopaedia-of-islam-2 vol. 7 p. 769}۔"
