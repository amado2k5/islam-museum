id: event/conquest-of-al-andalus
education:
  did_you_know:
    ar: "في سنة ٩٢هـ عبر طارق بن زياد إلى الأندلس بعد استطلاع طريف بن مالك، ثم خرج موسى بن نصير ففتح قرمونة وإشبيلية وماردة ولقيه بطليطلة سنة ٩٤هـ."
    en: "In 92 AH Tariq ibn Ziyad crossed into al-Andalus after Tarif ibn Malik's scouting raid; Musa ibn Nusayr then campaigned through Carmona, Seville and Merida, meeting Tariq at Toledo in 94."
    ur: "92ھ میں طارق بن زیاد، طریف بن مالک کی جاسوسی مہم کے بعد، اندلس میں داخل ہوا؛ پھر موسی بن نصیر قرمونہ، اشبیلیہ اور ماردہ فتح کرتے ہوئے 94ھ میں طلیطلہ میں طارق سے ملا۔"
    sources: [source/salabi-umayyad-state-2020, source/futuh-buldan-maarif-1407]
class: event
kind: conquest
label: { ar: "فتح الأندلس", en: "Conquest of al-Andalus" }
summary:
  ar: "ذكر الطبري في أخبار سنة إحدى وتسعين أن موسى بن نصير غزا الأندلس ففُتح على يديه مدائن وحصون {cite:tabari-tarikh-abu-al-fadl j.6 p.454}. وعنوان «فتح الأندلس» في الفهرس في سنة اثنتين وتسعين {cite:tabari-tarikh-abu-al-fadl j.6 p.632}. وعند البلاذري عن الواقدي: غزا طارق بن زياد عامل موسى بن نصير الأندلس وهو أول من غزاها وذلك في سنة اثنتين وتسعين فلقيه أليان وهو والٍ على مجاز الأندلس فآمنه طارق على أن حمله وأصحابه إلى الأندلس في السفن فلما صار إليها حاربه أهلها ففتحها وذلك في سنة اثنتين وتسعين وكان ملكها فيما يزعمون من الأشبان وأصلهم من أصبهان. ويذكر الكتاب أن الفتح جاء بعد حملة استطلاعية بقيادة طريف بن مالك في رمضان سنة 91هـ (تموز 710م)، ثم عبور طارق بن زياد في رجب سنة 92هـ، وأن الكتاب يرد الروايات التي تجعل الغنائم سبب الفتح. {cite:salabi-umayyad-state-2020 p.66-70} ويذكر الكتاب أن موسى خرج من القيروان سنة 93هـ، ففتح قرمونة ثم إشبيلية وماردة، ولقي طارقاً بطليطلة أواخر سنة 94هـ، ثم بلغ جليقية والأشتوريس، وأن الوليد استدعاه إلى دمشق فوصلها في عام 96هـ قبل وفاة الوليد. {cite:salabi-umayyad-state-2020 p.75-79}"
  en: "Tabari reports under the year 91 that Musa ibn Nusayr raided al-Andalus and that towns and fortresses were opened at his hands {cite:tabari-tarikh-abu-al-fadl j.6 p.454}. The index heading 'Conquest of al-Andalus' falls under the year 92 {cite:tabari-tarikh-abu-al-fadl j.6 p.632}. According to al-Baladhuri, on the authority of al-Waqidi, Tariq ibn Ziyad, Musa's deputy, raided al-Andalus; he was the first to raid it, in the year 92. Alyan, governor of the strait to al-Andalus, met him, and Tariq granted him safe-conduct on condition that he carry Tariq and his companions to al-Andalus in ships. When they arrived, its people fought them and he conquered it, also in the year 92; its king, they claim, was of the al-Ashban, whose origin was Isfahan. The book notes that the conquest came after a reconnaissance raid led by Tarif ibn Malik in Ramadan 91 AH (July 710 CE), then Tariq ibn Ziyad's crossing in Rajab 92 AH, and that the book rejects the reports that make booty the cause of the conquest {cite:salabi-umayyad-state-2020 p.66-70}. The book says that Musa set out from al-Qayrawan in 93 AH and took Carmona, then Seville and Merida; he met Tariq at Toledo in late 94 AH, then reached Galicia and the Asturias; and that al-Walid summoned him to Damascus, where he arrived in 96 AH before al-Walid's death {cite:salabi-umayyad-state-2020 p.75-79}."
