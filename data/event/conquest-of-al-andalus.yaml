id: event/conquest-of-al-andalus
class: event
kind: conquest
label: { ar: "فتح الأندلس" }
summary:
  ar: "ذكر الطبري في أخبار سنة إحدى وتسعين أن موسى بن نصير غزا الأندلس ففُتح على يديه مدائن وحصون {cite:tabari-tarikh-abu-al-fadl j.6 p.454}. وعنوان «فتح الأندلس» في الفهرس في سنة اثنتين وتسعين {cite:tabari-tarikh-abu-al-fadl j.6 p.632}. وعند البلاذري عن الواقدي: غزا طارق بن زياد عامل موسى بن نصير الأندلس وهو أول من غزاها وذلك في سنة اثنتين وتسعين فلقيه أليان وهو والٍ على مجاز الأندلس فآمنه طارق على أن حمله وأصحابه إلى الأندلس في السفن فلما صار إليها حاربه أهلها ففتحها وذلك في سنة اثنتين وتسعين وكان ملكها فيما يزعمون من الأشبان وأصلهم من أصبهان."
