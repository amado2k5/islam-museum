label: { en: "The killing of Ibn al-Anwa' and the sermon on Mecca's sanctity", ar: "مقتل ابن الأنوع وخطبة النبي في حرمة مكة" }
summary:
  en: "After the general safety was proclaimed, Khirash ibn Umayya ambushed and killed Ibn al-Anwa' al-Hudhali to settle an old blood dispute; the Prophet strongly condemned the murder, paid the full wergild from his own funds, and the next day delivered a decisive sermon proclaiming the perpetual inviolability of Mecca's blood, trees, and game."
  ar: "بعد إعلان الأمان غدر خراش بن أمية الخزاعي برجل من هذيل (ابن الأنوع) فقتله بثأر قديم؛ فغضب النبي وأنكر فعله ودفع ديته كاملة من ماله، وخطب الغداة في حرمة مكة المؤبدة وتحريم سفك الدم أو قطع الشجر فيها."
