label: { en: "The killing of Ibn al-Anwa' and the sermon on Mecca's sanctity", ar: "مقتل ابن الأنوع وخطبة النبي في حرمة مكة", es: "El asesinato de Ibn al-Anwa' y el sermón sobre la santidad de La Meca.", fr: "Le meurtre d'Ibn al-Anwa' et le sermon sur la sainteté de La Mecque" }
summary:
  en: "After the general safety was proclaimed, Khirash ibn Umayya ambushed and killed Ibn al-Anwa' al-Hudhali to settle an old blood dispute; the Prophet strongly condemned the murder, paid the full wergild from his own funds, and the next day delivered a decisive sermon proclaiming the perpetual inviolability of Mecca's blood, trees, and game."
  ar: "بعد إعلان الأمان غدر خراش بن أمية الخزاعي برجل من هذيل ⁦(ابن الأنوع)⁩ فقتله بثأر قديم؛ فغضب النبي وأنكر فعله ودفع ديته كاملة من ماله، وخطب الغداة في حرمة مكة المؤبدة وتحريم سفك الدم أو قطع الشجر فيها."
  es: "Tras proclamarse la seguridad general, Khirash ibn Umayya emboscó y mató a Ibn al-Anwa' al-Hudhali para saldar una antigua disputa de sangre; el Profeta condenó enérgicamente el asesinato, pagó la indemnización completa con sus propios fondos y, al día siguiente, pronunció un sermón decisivo proclamando la inviolabilidad perpetua de la sangre, los árboles y la caza de La Meca."
  fr: "Après la proclamation de la sécurité générale, Khirash ibn Umayya tendit une embuscade à Ibn al-Anwa' al-Hudhali et le tua pour régler un vieux différend sanglant; le Prophète condamna fermement le meurtre, paya l'intégralité du wergeld de ses propres fonds et, le lendemain, prononça un sermon décisif proclamant l'inviolabilité perpétuelle du sang, des arbres et du gibier de La Mecque."
