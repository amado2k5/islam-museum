summary:
  ar: "أثناء المقاطعة تسوّر كعب جدار حائط ابن عمه أبي قتادة وسلّم عليه فلم يرد، وناشده ثلاثاً هل يعلم أنه يحب الله ورسوله، فقال أبو قتادة في الثالثة: الله ورسوله أعلم، ففاضت عينا كعب."
  en: "During the boycott Ka'b climbed the wall of his cousin Abu Qatada's garden and greeted him; he did not answer. Ka'b adjured him three times: did he know that Ka'b loved God and His Messenger? On the third Abu Qatada said: God and His Messenger know best — and Ka'b's eyes welled up."
