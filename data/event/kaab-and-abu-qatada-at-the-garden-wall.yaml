label: { ar: "كعب وأبو قتادة على جدار الحائط", en: "Ka'b and Abu Qatada at the garden wall", es: "Ka'b y Abu Qatada en el muro del jardín.", fr: "Ka'b et Abu Qatada près du mur du jardin" }
summary:
  ar: "أثناء المقاطعة تسوّر كعب جدار حائط ابن عمه أبي قتادة وسلّم عليه فلم يرد، وناشده ثلاثاً هل يعلم أنه يحب الله ورسوله، فقال أبو قتادة في الثالثة: الله ورسوله أعلم، ففاضت عينا كعب."
  en: "During the boycott Ka'b climbed the wall of his cousin Abu Qatada's garden and greeted him; he did not answer. Ka'b adjured him three times: did he know that Ka'b loved God and His Messenger? On the third Abu Qatada said: God and His Messenger know best — and Ka'b's eyes welled up."
  es: "Durante el boicot, Ka'b escaló el muro del jardín de su primo Abu Qatada y lo saludó; este no respondió. Ka'b le preguntó tres veces: ¿sabía que Ka'b amaba a Dios y a Su Mensajero? A la tercera, Abu Qatada dijo: Dios y Su Mensajero lo saben mejor, y a Ka'b se le llenaron los ojos de lágrimas."
  fr: "Durant le boycott, Ka'b escalada le mur du jardin de son cousin Abu Qatada et le salua; celui-ci ne répondit pas. Ka'b l'interpella trois fois: savait-il que Ka'b aimait Dieu et Son Messager ? À la troisième fois, Abu Qatada répondit: Dieu et Son Messager sont les plus savants – et les yeux de Ka'b s'emplirent de larmes."
