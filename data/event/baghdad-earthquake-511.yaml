summary:
  ar: "في سنة إحدى عشرة وخمسمائة زُلزلت بغداد يوم عرفة فكانت الحيطان تذهب وتجيء، وكان عقيبها موت الخليفة المستظهر بالله {cite:shadharat-dhahab p. 510}."
  en: "In 511 Baghdad was shaken on the Day of Arafa until its walls swayed back and forth; the caliph al-Mustazhir's death followed soon after {cite:shadharat-dhahab p. 510}."
  fr: "En 511, Bagdad fut secouée le jour d'Arafa au point que ses murs oscillaient d'avant en arrière ; la mort du calife al-Mustazhir suivit peu après {cite:shadharat-dhahab p. 510}."
  es: "En 511, Bagdad fue sacudida el Día de Arafa hasta que sus muros se balancearon de un lado a otro; la muerte del califa al-Mustazhir ocurrió poco después {cite:shadharat-dhahab p. 510}."
  ur: "511 میں یوم عرفہ پر بغداد ہل گیا یہاں تک کہ اس کی دیواریں آگے پیچھے ہل گئیں۔ خلیفہ المستظیر کی وفات اس کے فوراً بعد ہو گئی۔ 510}۔"
  tr: "Hicri 511 yılında, Arafat günü Bağdat sarsıldı ve surlar ileri geri hareket etti. Bunu Halife El-Mustazhir Billa'nın ölümü izledi. {kaynak: Şadharat-dahab s. 510}"
  id: "Pada tahun 511 Hijriah, Baghdad diguncang pada hari Arafah, dan tembok-temboknya bergeser maju mundur. Peristiwa itu diikuti dengan wafatnya Khalifah Al-Mustazhir Billah. {cite:shadharat-dhahab hlm. 510}"
