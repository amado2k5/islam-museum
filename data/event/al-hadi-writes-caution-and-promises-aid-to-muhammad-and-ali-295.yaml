label:
  ar: "كتاب الهادي إلى محمد وعلي بالحزم والوعد بالنصرة، سنة 295هـ، ص351"
  en: "Al-Hadi writes to Muhammad and Ali urging caution and promising aid, 295 AH, p. 351"
  ur: "ہادی کا محمد اور علی کو احتیاط اور مدد کے وعدے کا خط لکھنا، 295ھ، ص351"
  es: "Al-Hadi escribe a Muhammad y Ali instándolos a la prudencia y prometiéndoles ayuda, 295 AH, pág. 351"
summary:
  ar: "كتب الهادي إلى محمد بن عبيد الله وابنه علي يأمرهما بالحزم والاحتراس ومدافعة القوم، ويعدهما بالنصرة، ويأمرهما بالصبر عند الشدة، فاطمأنت نفوسهما."
  en: "Al-Hadi wrote to Muhammad ibn Ubaydallah and his son Ali ordering them to be vigilant, to hold off the rebels, to be patient in hardship, and promising them support. Their minds were eased."
  ur: "ہادی نے محمد بن عبیداللہ اور ان کے بیٹے علی کو لکھا کہ ہوشیار رہیں، باغیوں کو روکیں، سختی میں صبر کریں، اور مدد کا وعدہ کیا۔ ان دونوں کے دل مطمئن ہو گئے۔"
  es: "Al-Hadi escribió a Muhammad ibn Ubaydallah y a su hijo Ali ordenándoles que se mantuvieran vigilantes, que contuvieran a los rebeldes, que tuvieran paciencia en las dificultades y prometiéndoles apoyo. Sus ánimos se tranquilizaron."
