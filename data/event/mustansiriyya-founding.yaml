label: { ar: "بناء المدرسة المستنصرية ببغداد", en: "Building the Mustansiriyya madrasa in Baghdad", es: "Construcción de la madrasa Mustansiriyya en Bagdad", fr: "Construction de la madrasa Mustansiriyya à Bagdad", ur: "بغداد میں مستنصریہ مدرسہ کی تعمیر", tr: "Bağdat'taki Mustansiriya Okulu'nun İnşaatı", id: "Pembangunan Sekolah Mustansiriya di Baghdad" }
summary:
  ar: "أنشأ المستنصر بالله المدرسة المستنصرية على دجلة من الجانب الشرقي وقال ابن واصل ما بني على وجه الأرض أحسن منها ولا أكثر وقوفاً وهي بأربعة مدرسين على المذاهب الأربعة وعمل فيها بيمارستاناً ورتب فيها مطبخاً للفقهاء ومزملة للماء البارد ورتب لبيوت الفقهاء الحصر والبسط والزيت والورق والحبر وللفقيه بعد ذلك في الشهر دينار ورتب لهم حماماً وهو أمر لم يسبق إلى مثله، وقال الذهبي بلغ ارتفاع وقوفها في العام نيفاً وسبعين ألف مثقال وكان ابتداء عمارتها في سنة خمس وعشرين وتمت في سنة إحدى وثلاثين ونقل إليها الكتب وهي مئة وستون حملاً من الكتب النفيسة وعدة فقهائها مئتان وثمانية وأربعون فقيهاً من المذاهب الأربعة وأربعة مدرسون وشيخ حديث وشيخ نحو وشيخ طب وشيخ فرائض وجعل فيها ثلاثون يتيماً وفتحت يوم الخميس في رجب وحضر القضاة والمدرسون والأعيان {cite:tarikh-khulafa-minhaj-1434 p. 702-704}."
  en: "Al-Mustansir's madrasa on Tigris's east bank — 'none finer on earth', says Ibn Wasil — four chairs for the four madhhabs, a bimaristan, a fuqaha' kitchen, a cold-water chamber, stipends of mats, oil, paper, ink and a dinar a month, and a bath 'never done before'. Al-Dhahabi: its waqf yielded seventy thousand mithqals a year; built 625–631, stocked with a hundred and sixty camel-loads of choice books, two hundred and forty-eight jurists with masters of hadith, grammar, medicine and inheritance-law, thirty orphans; opened on a Thursday in Rajab before the judges and notables {cite:tarikh-khulafa-minhaj-1434 p. 702-704}."
  es: "La madrasa de Al-Mustansir en la orilla este del Tigris —«no hay otra mejor en la tierra», dice Ibn Wasil— cuatro sillas para las cuatro madhhabs, un bimaristan, una cocina fuqaha', una cámara de agua fría, estipendios de esteras, aceite, papel, tinta y un dinar al mes, y un baño «nunca antes visto». Al-Dhahabi: su waqf producía setenta mil mithqals al año; construida entre 625 y 631, abastecida con ciento sesenta cargas de camello de libros selectos, doscientos cuarenta y ocho juristas con maestros de hadiz, gramática, medicina y derecho sucesorio, treinta huérfanos; inaugurada un jueves de Rajab ante los jueces y notables {cite:tarikh-khulafa-minhaj-1434 p. 702-704}."
  fr: "La madrasa d'Al-Mustansir, sur la rive orientale du Tigre – « la plus belle au monde », selon Ibn Wasil – disposait de quatre chaises pour les quatre écoles juridiques (madhhabs), d'un bimaristan (résidence pour les étudiants), d'une cuisine pour les juristes (fuqaha'), d'une salle d'eau froide, et fournissait des allocations en nattes, huile, papier, encre et un dinar par mois, ainsi qu'un bain « inédit ». Al-Dhahabi: son waqf rapportait soixante-dix mille mithqals par an; construite entre 625 et 631, elle était approvisionnée en livres précieux (l'équivalent de cent soixante chameaux de livres), comptait deux cent quarante-huit juristes, maîtres en hadith, grammaire, médecine et droit successoral, et accueillait trente orphelins; elle fut inaugurée un jeudi du mois de Rajab devant les juges et les notables (voir: Tarikh-Khulafa-Minhaj-1434, p. 702-704)."
  ur: "دجلہ کے مشرقی کنارے پر المستنصر کا مدرسہ - 'زمین پر کوئی بھی بہتر نہیں'، ابن واصل کہتے ہیں - چاروں مذاہب کے لیے چار کرسیاں، ایک بیمارستان، ایک فقہا' باورچی خانہ، ایک ٹھنڈے پانی کی کوٹھری، چٹائیوں کا وظیفہ، تیل، کاغذ، سیاہی اور ایک دینار ایک مہینہ پہلے، اور کبھی نہیں کیا گیا'۔ الذہبی: اس کے وقف سے سالانہ ستر ہزار مثقال حاصل ہوتے تھے۔ 625-631 میں تعمیر کیا گیا، جس میں ایک سو ساٹھ اونٹوں سے بھری ہوئی انتخابی کتابیں، دو سو اڑتالیس فقہاء جن میں حدیث، گرامر، طب اور وراثت کے ماہر، تیس یتیم۔ رجب میں جمعرات کو ججوں اور معززین کے سامنے کھولا گیا {حوالہ:تاریخ-خلفاء منہاج-1434 ص۔ 702-704}۔"
  tr: "El-Mustansir Billah, Dicle'nin doğu yakasında Mustansiriyah Okulu'nu kurdu. İbn Wasil, \"Yeryüzünde bundan daha iyisi veya daha donanımlısı inşa edilmemiştir. Dört öğretmeni vardır ve her biri dört düşünce ekolünden birini temsil eder.\" dedi. Ayrıca orada bir hastane inşa etti, hukukçular için bir mutfak düzenledi ve soğuk su için bir su sebili sağladı. Hukukçuların evlerine de hasır, kilim, yağ, kağıt ve mürekkep temin etti. Her hukukçuya ayda bir dinar ödeniyordu. Ayrıca onlara, daha önce benzeri görülmemiş bir şey olan bir hamam da sağladı. El-Dhahabi şöyle dedi: “Vakıflarının toplam değeri bir yılda yetmiş bin mithkal'ı aştı. İnşaatına 25 yılında başlandı ve 31 yılında tamamlandı. Yüz altmış deve yükü kıymetli kitap oraya nakledildi. Dört mezhepten iki yüz kırk sekiz hukukçusu vardı ve dört öğretmeni, bir hadis alimi, bir dilbilgisi alimi, bir tıp alimi ve bir miras hukuku alimi bulunuyordu. Oraya otuz yetim yerleştirdi. Receb ayının bir Perşembe günü açıldı ve kadılar, öğretmenler ve ileri gelenler hazır bulundu.” {cite:tarikh-khulafa-minhaj-1434 s. 702-704}"
  id: "Al-Mustansir Billah mendirikan Sekolah Mustansiriyah di sisi timur Sungai Tigris. Ibn Wasil berkata, “Tidak ada yang lebih baik atau lebih lengkap yang pernah dibangun di muka bumi ini. Sekolah ini memiliki empat guru, masing-masing mewakili salah satu dari empat mazhab.” Ia juga membangun rumah sakit di sana, menyediakan dapur untuk para ahli hukum, dan menyediakan pendingin air untuk air dingin. Ia juga menyediakan rumah-rumah para ahli hukum dengan tikar, karpet, minyak, kertas, dan tinta. Setiap ahli hukum menerima satu dinar per bulan. Ia juga menyediakan pemandian umum untuk mereka, sesuatu yang belum pernah terjadi sebelumnya. Al-Dhahabi berkata, “Nilai total wakafnya mencapai lebih dari tujuh puluh ribu mithqal dalam setahun. Pembangunannya dimulai pada tahun 25 dan selesai pada tahun 31. Seratus enam puluh muatan unta berisi kitab-kitab berharga dipindahkan ke sana. Jumlah ahli hukumnya adalah dua ratus empat puluh delapan orang, mewakili empat mazhab, dan ada empat guru, seorang ahli hadits, seorang ahli tata bahasa, seorang ahli kedokteran, dan seorang ahli hukum warisan. Beliau menempatkan tiga puluh anak yatim di sana. Masjid itu diresmikan pada hari Kamis di bulan Rajab, dan para hakim, guru, dan tokoh penting hadir.” {cite:tarikh-khulafa-minhaj-1434 p. 702-704}"
