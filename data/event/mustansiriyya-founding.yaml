label: { ar: "بناء المدرسة المستنصرية ببغداد" }
summary:
  ar: "أنشأ المستنصر بالله المدرسة المستنصرية على دجلة من الجانب الشرقي وقال ابن واصل ما بني على وجه الأرض أحسن منها ولا أكثر وقوفاً وهي بأربعة مدرسين على المذاهب الأربعة وعمل فيها بيمارستاناً ورتب فيها مطبخاً للفقهاء ومزملة للماء البارد ورتب لبيوت الفقهاء الحصر والبسط والزيت والورق والحبر وللفقيه بعد ذلك في الشهر دينار ورتب لهم حماماً وهو أمر لم يسبق إلى مثله، وقال الذهبي بلغ ارتفاع وقوفها في العام نيفاً وسبعين ألف مثقال وكان ابتداء عمارتها في سنة خمس وعشرين وتمت في سنة إحدى وثلاثين ونقل إليها الكتب وهي مئة وستون حملاً من الكتب النفيسة وعدة فقهائها مئتان وثمانية وأربعون فقيهاً من المذاهب الأربعة وأربعة مدرسون وشيخ حديث وشيخ نحو وشيخ طب وشيخ فرائض وجعل فيها ثلاثون يتيماً وفتحت يوم الخميس في رجب وحضر القضاة والمدرسون والأعيان {cite:tarikh-khulafa-minhaj-1434 p. 702-704}."
  en: "Al-Mustansir's madrasa on Tigris's east bank — 'none finer on earth', says Ibn Wasil — four chairs for the four madhhabs, a bimaristan, a fuqaha' kitchen, a cold-water chamber, stipends of mats, oil, paper, ink and a dinar a month, and a bath 'never done before'. Al-Dhahabi: its waqf yielded seventy thousand mithqals a year; built 625–631, stocked with a hundred and sixty camel-loads of choice books, two hundred and forty-eight jurists with masters of hadith, grammar, medicine and inheritance-law, thirty orphans; opened on a Thursday in Rajab before the judges and notables {cite:tarikh-khulafa-minhaj-1434 p. 702-704}."
