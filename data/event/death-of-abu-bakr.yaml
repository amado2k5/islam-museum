label: { ar: "وفاة أبي بكر الصديق", en: "The Death of Abu Bakr al-Siddiq", es: "La muerte de Abu Bakr al-Siddiq", fr: "La mort d'Abu Bakr al-Siddiq", ur: "ابوبکر صدیق کی وفات" }
summary:
  ar: "قال ابن عمر كان سبب موت أبي بكر وفاة رسول الله كمد فما زال جسمه يخري حتى مات وأن أبا بكر والحارث بن كلدة كانا يأكلان خزيرة أهديت لأبي بكر فقال الحارث لأبي بكر ارفع يدك يا خليفة رسول الله والله إن فيها لسم سنة وأنا وأنت نموت في يوم واحد فرفع يده فلم يزالا عليلين حتى ماتا في يوم واحد عند انقضاء السنة وقال الشعبي ماذا نتوقع من هذه الدنيا الدنية وقد سم رسول الله وسم أبو بكر وقالت عائشة كان أول بدء مرض أبي بكر أنه اغتسل يوم الاثنين لسبع خلون من جمادى الآخرة وكان يوماً بارداً فحم خمسة عشر يوماً لا يخرج إلى صلاة وتوفي ليلة الثلاثاء لثمان بقين من جمادى الآخرة سنة ثلاث عشرة وله ثلاث وستون سنة وكان قد قال لعائشة عند احتضاره انظري اللقحة التي كنا نشرب من لبنها والجفنة التي كنا نصطبح فيها والقطيفة التي كنا نلبسها فإنا كنا ننتفع بذلك حين كنا نلي أمر المسلمين فإذا مت فاردديه إلى عمر فلما مات أرسلت به إلى عمر فقال رحمك الله يا أبا بكر لقد أتعبت من جاء بعدك."
  en: "Ibn Umar: the cause of Abu Bakr's death was the Prophet's death — grief wasted him till he died. And he had eaten with al-Harith ibn Kalada a gifted khazira — 'lift your hand: by God, a year's poison is in it, and you and I die in one day' — both sickened and died in one day at the year's end; al-Sha'bi: 'what do we expect of this low world — the Prophet was poisoned and Abu Bakr was poisoned'. Aisha: his illness began with a bath on a cold Monday, seven nights past of Jumada II; he fevered fifteen days without coming to prayer and died Tuesday night, eight nights remaining of Jumada II, year thirteen, aged sixty-three. At his death he told Aisha: 'look at the she-camel whose milk we drank, the bowl we breakfasted from, the wrap we wore — we used them while we held the Muslims' charge: when I die, return them to Umar' — 'may God mercy you, Abu Bakr: you have wearied who comes after you'."
  es: "Ibn Umar: la causa de la muerte de Abu Bakr fue la muerte del Profeta; el dolor lo consumió hasta su muerte. Y había comido con al-Harith ibn Kalada un khazira regalado: «Levanta la mano: por Dios, contiene veneno para un año, y tú y yo moriremos en un día». Ambos enfermaron y murieron en un día al final del año. Al-Sha'bi: «¿Qué podemos esperar de este mundo vil? El Profeta fue envenenado y Abu Bakr también». Aisha: su enfermedad comenzó con un baño un lunes frío, siete noches después del segundo día de Jumada; tuvo fiebre durante quince días sin ir a la oración y murió la noche del martes, ocho noches antes del segundo día de Jumada del año trece, a la edad de sesenta y tres años. Al morir, le dijo a Aisha: «Mira la camella cuya leche bebimos, el cuenco del que desayunamos, el manto que vestimos; los usamos mientras cubrimos la responsabilidad de los musulmanes: cuando muera, devuélvelos a Umar». «Que Dios te tenga misericordia, Abu Bakr: has cansado a quien venga después de ti»."
  fr: "Ibn Umar: La mort d'Abu Bakr fut causée par celle du Prophète – le chagrin le consuma jusqu'à son dernier souffle. Il avait partagé avec al-Harith ibn Kalada un khazira offert – « Lève la main: par Dieu, il contient le poison d'une année, et nous mourrons tous deux en un jour. » – Tous deux tombèrent malades et moururent le même jour, à la fin de l'année. Al-Sha'bi: « Que pouvons-nous attendre de ce monde ? Le Prophète fut empoisonné, et Abu Bakr aussi. » Aïcha: Sa maladie commença par un bain un lundi froid, sept nuits après le mois de Jumada II; il souffrit de fièvre pendant quinze jours sans se rendre à la prière et mourut dans la nuit du mardi, huit nuits avant la fin du mois de Jumada II de l'an treize, à l'âge de soixante-trois ans. À sa mort, il dit à Aïcha: « Regarde la chamelle dont nous avons bu le lait, le bol dans lequel nous avons pris notre petit-déjeuner, le pagne que nous portions — nous les avons utilisés pendant que nous étions chargés de la protection des musulmans: quand je mourrai, rends-les à Umar » — « Que Dieu te mette en pitié, Abou Bakr: tu as fatigué celui qui vient après toi »."
  ur: "ابن عمر: ابوبکر کی موت کا سبب رسول اللہ کی وفات تھی، غم نے انہیں مرتے دم تک برباد کر دیا۔ اور اس نے حارث بن کلدہ کے ساتھ تحفہ میں دیا ہوا خزیرہ کھایا تھا - 'اپنا ہاتھ اٹھاؤ: خدا کی قسم، اس میں ایک سال کا زہر ہے، اور میں اور تم ایک ہی دن میں مرجاؤ گے' - دونوں بیمار ہوئے اور سال کے آخر میں ایک ہی دن میں مر گئے۔ الشعبی: 'ہم اس پست دنیا سے کیا امید رکھیں - نبی کو زہر دیا گیا اور ابوبکر کو زہر دیا گیا'۔ عائشہ: ان کی بیماری کا آغاز ایک سرد پیر کے دن غسل سے ہوا، جمادی الثانی کی سات راتیں گزر گئیں۔ آپ کو پندرہ دن تک بغیر نماز کے بخار رہا اور منگل کی رات، جمعتہ دوئم کی آٹھ راتیں باقی تھیں، تیرہ سال کی عمر میں، تریسٹھ سال کی عمر میں انتقال کر گئے۔ اس کی موت کے وقت اس نے عائشہ سے کہا: اس اونٹنی کو دیکھو جس کا دودھ ہم نے پیا تھا، جس پیالے سے ہم نے ناشتہ کیا تھا، جس کی چادر ہم نے پہنی تھی، ہم نے ان کو مسلمانوں کی ذمہ داری کے دوران استعمال کیا تھا: جب میں مرجاؤں تو انہیں عمر کے پاس واپس کر دو۔\" - 'خدا تم پر رحم کرے، ابوبکر: تم تھک چکے ہو جو تمہارے بعد آئے گا'۔"
