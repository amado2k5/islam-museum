label:
  ar: "ترميم الرواق الشمالي للمسجد الأقصى"
  en: "Restoration of al-Aqsa's northern porch"
  ur: "مسجدِ اقصیٰ کے شمالی برآمدے کی مرمت"
summary:
  ar: "رُمم الرواق الشمالي للمسجد الأقصى سنة 1217م، وأُعيدت الأقبية الشرقية والغربية في المسجد سنتي 1345 و1350م، فبقي بناء الأقصى في جوهره بناء فاطمياً حمل تفاصيل صليبية وأيوبية ومملوكية {cite:encyclopaedia-of-islam-2 vol. 6 p. 735}."
  en: "The mosque's northern porch was restored in 1217, and the eastern and western vaults were redone in 1345 and 1350 — so the Aqsa remained in essence a Fatimid building carrying Crusader, Ayyubid and Mamluk details {cite:encyclopaedia-of-islam-2 vol. 6 p. 735}."
  ur: "مسجد کا شمالی برآمدہ 1217ء میں مرمت ہوا اور مشرقی و مغربی محرابی حصے 1345ء اور 1350ء میں دوبارہ بنائے گئے؛ اس طرح مسجدِ اقصیٰ بنیادی طور پر فاطمی عمارت رہی جس پر صلیبی، ایوبی اور مملوکی تفصیلات جمع ہوتی گئیں {cite:encyclopaedia-of-islam-2 vol. 6 p. 735}."
