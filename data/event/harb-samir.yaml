label: { ar: "حرب سمير", en: "The War of Samir", es: "La guerra de Samir", fr: "La guerre de Samir", ur: "سمیر کی جنگ", tr: "Samir'in Savaşı", id: "Perang Samir" }
summary:
  ar: "أول اختلاف وحرب وقعت بين الأنصار؛ نزل كعب بن العجلان الثعلبي على مالك بن العجلان السالمي فحالفه، فخرج إلى سوق بني قينقاع ورأى غطفانياً معه فرس يقول ليأخذه أعز أهل يثرب، فاختلفوا في ذلك وقال قائل أحيحة بن الجلاح الأوسي وقال غيره فلان اليهودي، فدفع الغطفاني الفرس إلى مالك ففخر به كعب، فغضب سمير رجل من الأوس من بني عمرو بن عوف وشتمه وافترقا، ثم قصده سمير في سوق لهم بقباء ولازمه حتى خلا السوق فقتله، فطلب مالك قاتله وأنكر بنو عمرو بن عوف ثم عرضوا الدية فأبى إلا دية كاملة — وكانت دية الحليف عندهم نصف دية النسيب — ولج الأمر إلى المحاربة فاقتتلوا قتالاً شديداً ودخلت فيها سائر بطون الأنصار، ثم حكّموا المنذر بن حرام النجاري الخزرجي جد حسان بن ثابت فحكم بأداء دية الصريح والعودة إلى سنتهم القديمة فرضوا بذلك، وقد شبت البغضاء في نفوسهم وتمكنت العداوة بينهم {cite:kamil-ibn-al-athir p. 488}."
  en: "The first dissension and war among the Ansar: over a Ghatafani's horse at the Banu Qaynuqa market, Samir of Banu Amr ibn Awf killed the client Ka'b ibn al-Ajlan; the quarrel over the client-half diyya became a war that drew in every clan of the Ansar, until al-Mundhir ibn Haram al-Najjari — grandfather of Hassan ibn Thabit — arbitrated full blood-money and a return to the old custom; the hatred had by then taken root {cite:kamil-ibn-al-athir p. 488}."
  es: "La primera disensión y guerra entre los Ansar: por el caballo de un Ghatafani en el mercado de Banu Qaynuqa, Samir de Banu Amr ibn Awf mató al cliente Ka'b ibn al-Ajlan; la disputa por la mitad de la diyya del cliente se convirtió en una guerra que involucró a todos los clanes de los Ansar, hasta que al-Mundhir ibn Haram al-Najjari —abuelo de Hassan ibn Thabit— arbitró el pago completo de la indemnización por derramamiento de sangre y el retorno a la antigua costumbre; para entonces el odio ya había echado raíces {cite:kamil-ibn-al-athir p. 488}."
  fr: "La première dissension et guerre parmi les Ansar: à propos du cheval d'un Ghatafani au marché de Banu Qaynuqa, Samir de Banu Amr ibn Awf tua le client Ka'b ibn al-Ajlan; la querelle au sujet de la diyya du client devint une guerre qui entraîna tous les clans des Ansar, jusqu'à ce qu'al-Mundhir ibn Haram al-Najjari — grand-père de Hassan ibn Thabit — arbitre le paiement intégral du prix du sang et le retour à l'ancienne coutume; la haine s'était alors enracinée {cite:kamil-ibn-al-athir p. 488}."
  ur: "انصار کے درمیان پہلا اختلاف اور جنگ: بنو قینقاع کے بازار میں غطفانی کے گھوڑے پر، بنو عمرو بن عوف کے سمیر نے کعب بن عجلان کو قتل کر دیا۔ کلائنٹ کی آدھی دیت کا جھگڑا ایک جنگ بن گیا جو انصار کے ہر قبیلہ میں پھیل گیا، یہاں تک کہ المنذر بن حرام النجاری - حسن بن ثابت کے دادا - نے پوری خونریزی اور پرانی رسم کی طرف واپسی کی۔ نفرت تب تک جڑ پکڑ چکی تھی۔ 488}۔"
  tr: "Ensar arasında çıkan ilk anlaşmazlık ve savaş; Ka'b ibn al-'Ajlan al-Tha'labi'nin Malik ibn al-'Ajlan al-Salimi ile birlikte kalması ve onunla ittifak kurmasıyla başladı. Beni Kaynuka'nın pazarına gitti ve bir Gatafanlı adamın atıyla birlikte, \"Yathrib halkının en şereflisi alsın bunu\" dediğini gördü. Atı kimin aldığı konusunda anlaşmazlık çıktı; biri Uhayha ibn al-Jallah al-Awsi'nin aldığını, diğeri ise belli bir Yahudi'nin aldığını söyledi. Gatafanlı adam atı Malik'e verdi ve Ka'b bununla övündü. Aws kabilesinden, özellikle Beni Amr ibn Awf'tan bir adam olan Samir öfkelendi ve Ka'b'a hakaret etti, böylece yolları ayrıldı. Sonra Samir, Kuba'daki pazarlarına gitti ve pazar boşalana kadar onu bekledi, sonra da öldürdü. Malik, katilini aradı, ancak Beni Amr ibn Avf bunu reddetti ve kan parası teklif etti. Malik, tam kan parasından daha azını kabul etmedi—bir müttefik için ödenecek kan parası, bir akraba için ödenecek kan parasının yarısıydı—ve mesele savaşa dönüştü. Şiddetli bir şekilde savaştılar ve Ensar'ın diğer kabileleri de katıldı. Sonra Hasan ibn Sabit'in dedesi olan el-Mundhir ibn Haram el-Neccari el-Hazarci'nin arabuluculuğuna başvurdular. O, özgür bir adam için ödenecek kan parasının ödenmesi ve eski geleneklerine dönmeleri gerektiğine hükmetti ve onlar da bunu kabul ettiler. Kalplerinde nefret kök salmıştı. Aralarındaki düşmanlık {kaynak: Kamil ibn el-Athir s. 488}."
  id: "Perselisihan dan perang pertama yang terjadi antara kaum Ansar adalah: Ka'b ibn al-'Ajlan al-Tha'labi tinggal bersama Malik ibn al-'Ajlan al-Salimi dan membentuk aliansi dengannya. Ia pergi ke pasar Banu Qaynuqa' dan melihat seorang pria Ghatafan dengan seekor kuda, lalu berkata, \"Biarlah orang yang paling terhormat dari penduduk Yathrib mengambilnya.\" Terjadi perselisihan tentang siapa yang mengambilnya; ada yang mengatakan itu adalah Uhayha ibn al-Jallah al-Awsi, dan yang lain mengatakan itu adalah seorang Yahudi tertentu. Pria Ghatafan itu memberikan kuda itu kepada Malik, dan Ka'b membanggakannya. Samir, seorang pria dari suku Aws, khususnya dari Banu 'Amr ibn 'Awf, menjadi marah dan menghina Ka'b, dan mereka berpisah. Kemudian Samir pergi ke pasar mereka di Quba' dan menunggunya sampai pasar kosong, lalu ia membunuhnya. Malik mencari pembunuhnya, tetapi Banu 'Amr ibn 'Awf menyangkalnya dan menawarkan uang darah. Malik menolak tawaran kurang dari uang darah penuh—uang darah untuk sekutu adalah setengah dari uang darah untuk kerabat—dan masalah tersebut meningkat menjadi perang. Mereka bertempur dengan sengit, dan klan-klan Ansar lainnya ikut bergabung. Kemudian mereka meminta arbitrase dari al-Mundhir ibn Haram al-Najjari al-Khazraji, kakek dari Hassan ibn Thabit. Dia memutuskan bahwa uang darah untuk orang merdeka harus dibayarkan dan mereka harus kembali ke kebiasaan lama mereka, dan mereka menerimanya. Kebencian telah berakar di hati mereka. Permusuhan di antara mereka {cite:kamil-ibn-al-athir p. 488}."
