summary:
  ar: "في سنة ثمان وستين وتسعمائة جاء جنكيز خان إلى سرت فأحرق دورها وخربها وأوسع أهلها واستأثر، وقتل صاحبها خداوند خان يوم الثلاثاء آخر ذي القعدة بجلنجان؛ وكان خداوند خان أميراً كبيراً جليلاً رفيع المنزلة حسن الأخلاق جميل الصورة طيب السيرة جواداً سخياً محبباً إلى الناس مجمعاً لأهل العلم عريق الرياسة، وكانت سرت في زمنه مأوى للفضلاء {cite:shadharat-dhahab p. 352}."
  en: "In 968 Jankiz Khan came to Sirt, burned its houses, ruined it, dealt out killing and took all; its lord Khudawandkhan — 'a great, honoured amir, generous, beloved, a gatherer of the learned, under whom Sirt was a refuge for the virtuous' — was killed Tuesday at the end of Dhu'l-Qa'da at Jilanjan {cite:shadharat-dhahab p. 352}."
