id: event/sirt-burned-968
class: event
kind: other
label: { ar: "جنكيز خان يحرق سرت ويقتل خداوند خان 968هـ", en: "Jankiz Khan burns Sirt and kills Khudawandkhan, 968", es: "Jankiz Khan quema a Sirt y mata a Khudawandkhan, 968", fr: "Jankiz Khan brûle Sirt et tue Khudawandkhan, 968", ur: "جانکیز خان نے سرت کو جلا کر 968 کو خداوند خان کو قتل کیا۔" }
summary:
  ar: "في سنة ثمان وستين وتسعمائة جاء جنكيز خان إلى سرت فأحرق دورها وخربها وأوسع أهلها واستأثر، وقتل صاحبها خداوند خان يوم الثلاثاء آخر ذي القعدة بجلنجان؛ وكان خداوند خان أميراً كبيراً جليلاً رفيع المنزلة حسن الأخلاق جميل الصورة طيب السيرة جواداً سخياً محبباً إلى الناس مجمعاً لأهل العلم عريق الرياسة، وكانت سرت في زمنه مأوى للفضلاء {cite:shadharat-dhahab p. 352}."
  en: "In 968 Jankiz Khan came to Sirt, burned its houses, ruined it, dealt out killing and took all; its lord Khudawandkhan — 'a great, honoured amir, generous, beloved, a gatherer of the learned, under whom Sirt was a refuge for the virtuous' — was killed Tuesday at the end of Dhu'l-Qa'da at Jilanjan {cite:shadharat-dhahab p. 352}."
  es: "En 968, Jankiz Khan llegó a Sirt, quemó sus casas, la arruinó, sembró la muerte y se llevó todo; su señor Khudawandkhan —'un gran y honrado emir, generoso, amado, un recolector de eruditos, bajo cuyo mandato Sirt fue un refugio para los virtuosos'— fue asesinado el martes al final de Dhu'l-Qa'da en Jilanjan {cite:shadharat-dhahab p. 352}."
  fr: "En 968, Jankiz Khan arriva à Sirt, incendia ses maisons, la ruina, sema la mort et prit tout; son seigneur Khudawandkhan — « un grand et honoré émir, généreux, aimé, un rassembleur des savants, sous le règne duquel Sirt était un refuge pour les vertueux » — fut tué mardi à la fin de Dhu'l-Qa'da à Jilanjan {cite:shadharat-dhahab p. 352}."
  ur: "968 میں جانکیز خان سرت آیا، اس کے گھر جلا دیے، برباد کر دیے، قتل و غارت گری کی اور سب کچھ لے لیا۔ اس کے آقا خداوند خان - 'ایک عظیم، معزز امیر، سخی، محبوب، علماء کا جمع کرنے والا، جس کے ماتحت سیرت نیک لوگوں کے لیے پناہ گاہ تھی' - منگل کو ذوالقعدہ کے آخر میں جیلانجان میں مارا گیا تھا۔ 352}۔"
