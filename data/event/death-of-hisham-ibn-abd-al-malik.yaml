label: { ar: "وفاة هشام بن عبد الملك", en: "Death of Hisham ibn Abd al-Malik", es: "Muerte de Hisham ibn Abd al-Malik", fr: "Décès de Hisham ibn Abd al-Malik", ur: "ہشام بن عبد الملک کی وفات", tr: "Hişam ibn Abdülmalik'in Ölümü", id: "Kematian Hisham ibn Abd al-Malik" }
summary:
  ar: "في سنة خمس وعشرين ومائة توفي هشام بن عبد الملك لست ليال خلون من ربيع الآخر، وذكر الطبري علته التي توفي بها وأقوالا مختلفة في عمره {cite:tabari-tarikh-abu-al-fadl j.7 p.200}، وعند السيوطي مات في ربيع الآخر وكان لا يدخل بيت ماله مالاً حتى يشهد أربعون قسامة أنه أخذ من حقه وأعطى لكل ذي حق حقه وقد بنى الرصافة بقنسرين {cite:tarikh-khulafa-minhaj-1434 p. 401-402}"
  en: "In 125 Hisham ibn Abd al-Malik died six nights into Rabi' II. Tabari records the illness that killed him and differing accounts of his age {cite:tabari-tarikh-abu-al-fadl j.7 p.200}. In al-Suyuti he died in Rabi' II; he would let no money enter his treasury until forty qasama witnesses testified that he had taken it from its rightful source and given each claimant his right. He had built al-Rusafa at Qinnasrin {cite:tarikh-khulafa-minhaj-1434 p. 401-402}."
  es: "En 125 Hisham ibn Abd al-Malik murió seis noches después del inicio de Rabi' II. Tabari registra la enfermedad que lo mató y diferentes versiones sobre su edad {cite:tabari-tarikh-abu-al-fadl j.7 p.200}. En al-Suyuti murió en Rabi' II; no permitió que entrara dinero en su tesoro hasta que cuarenta testigos qasama testificaran que lo había tomado de su fuente legítima y había dado a cada reclamante lo que le correspondía. Había construido al-Rusafa en Qinnasrin {cite:tarikh-khulafa-minhaj-1434 p. 401-402}."
  fr: "En 125, Hisham ibn Abd al-Malik mourut six nuits après le début du mois de Rabi' II. Tabari relate la maladie qui l'emporta et présente des versions divergentes quant à son âge (voir: Tabari, Tarikh Abu al-Fadl, vol. 7, p. 200). Selon al-Suyuti, il mourut au cours du même mois de Rabi' II; il refusa que quarante témoins qasama attestent que l'argent avait été prélevé à sa source légitime et que chaque ayant droit avait été remis à son propriétaire. Il avait fait construire al-Rusafa à Qinnasrin (voir: Tarikh Khulafa Minhaj, 1434, p. 401-402)."
  ur: "125 میں ہشام بن عبد الملک کا انتقال ربیع الثانی کی چھ راتوں میں ہوا۔ طبری نے اس بیماری کو درج کیا ہے جس نے اسے ہلاک کیا اور اس کی عمر کے مختلف بیانات درج کیے ہیں۔ السیوطی میں ربیع دوم میں وفات پائی۔ وہ اپنے خزانے میں کوئی رقم داخل نہیں ہونے دیتا تھا جب تک کہ چالیس قصمہ گواہ گواہی نہ دے دیں کہ اس نے اسے اس کے صحیح ذریعہ سے لیا ہے اور ہر دعویدار کو اس کا حق دیا ہے۔ اس نے کناصرین میں الروسافہ تعمیر کیا تھا {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 401-402}۔"
  tr: "Hicri 125 yılında, Hişam ibn Abdülmalik, Rebiü'l-Ahir ayının altıncı gecesinde vefat etti. Taberi, vefat ettiği hastalığı ve yaşıyla ilgili farklı rivayetleri zikretti (kaynak: tabari-tarikh-abu-al-fadl c.7 s.200). Suyuti'ye göre ise Rebiü'l-Ahir ayında vefat etti. Kırk şahidin, kendisine düşeni aldığını ve herkese hakkını verdiğini şahitlik etmesi şartıyla hazinesine para girmesine izin vermedi. Kınnasrin'de el-Rusafa'yı inşa ettirdi (kaynak: tarikh-khulafa-minhaj-1434 s. 401-402)."
  id: "Pada tahun 125 H, Hisham ibn Abd al-Malik wafat pada malam keenam bulan Rabi' al-Akhir. Al-Tabari menyebutkan penyakit yang dideritanya dan berbagai catatan tentang usianya {cite:tabari-tarikh-abu-al-fadl j.7 p.200}. Menurut al-Suyuti, ia wafat pada bulan Rabi' al-Akhir. Ia tidak mengizinkan uang masuk ke perbendaharaannya sampai empat puluh saksi bersaksi bahwa ia telah mengambil haknya dan memberikan hak kepada semua orang. Ia membangun al-Rusafa di Qinnasrin {cite:tarikh-khulafa-minhaj-1434 p. 401-402}."
