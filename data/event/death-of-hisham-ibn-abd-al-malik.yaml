id: event/death-of-hisham-ibn-abd-al-malik
class: event
kind: death
label: { ar: "وفاة هشام بن عبد الملك", en: "Death of Hisham ibn Abd al-Malik" }
summary:
  ar: "في سنة خمس وعشرين ومائة توفي هشام بن عبد الملك لست ليال خلون من ربيع الآخر، وذكر الطبري علته التي توفي بها وأقوالا مختلفة في عمره {cite:tabari-tarikh-abu-al-fadl j.7 p.200}، وعند السيوطي مات في ربيع الآخر وكان لا يدخل بيت ماله مالاً حتى يشهد أربعون قسامة أنه أخذ من حقه وأعطى لكل ذي حق حقه وقد بنى الرصافة بقنسرين {cite:tarikh-khulafa-minhaj-1434 p. 401-402}"
  en: "In 125 Hisham ibn Abd al-Malik died six nights into Rabi' II. Tabari records the illness that killed him and differing accounts of his age {cite:tabari-tarikh-abu-al-fadl j.7 p.200}. In al-Suyuti he died in Rabi' II; he would let no money enter his treasury until forty qasama witnesses testified that he had taken it from its rightful source and given each claimant his right. He had built al-Rusafa at Qinnasrin {cite:tarikh-khulafa-minhaj-1434 p. 401-402}."
