id: event/al-hadi-and-al-daam-confrontation-at-najd-al-dayr-285
class: event
kind: other
label:
  ar: مواجهة الهادي والدعام بن إبراهيم عند نجد الضير والصلح بينهما، رمضان 285هـ
  en: The confrontation of al-Hadi and al-Da'am ibn Ibrahim at Najd al-Dayr and the settlement between them, Ramadan 285 AH
  ur: نجد الضیر پر ہادی اور دعام بن ابراہیم کا آمنا سامنا اور ان کے درمیان صلح، رمضان 285ھ
  es: "El enfrentamiento entre al-Hadi y al-Da'am ibn Ibrahim en Najd al-Dayr y el acuerdo alcanzado entre ellos, Ramadán 285 AH."
  fr: "La confrontation d'al-Hadi et d'al-Da'am ibn Ibrahim à Najd al-Dayr et leur accord, Ramadan 285 AH"
  tr: "Necd-i Zer'de El-Hadi ile El-Da'am bin İbrahim arasındaki çatışma ve aralarındaki uzlaşma, Hicri 285 Ramazan ayı."
  id: "Konfrontasi antara Al-Hadi dan Al-Da’am bin Ibrahim di Najd Al-Dhair dan perdamaian di antara mereka, Ramadan 285 H."
summary:
  ar: بلغ الهادي في رمضان 285هـ أن الدعام خرج من بلده بعسكر عظيم يريد البون فظن أنه يريد أثافت فعاد من خيوان إليها، ثم سار إلى رأس النقيل فرآه، فنشر الرايات فرجع الدعام إلى حمدة، ثم التقيا عند نجد الضير فعبّأ الهادي عسكره، ونزل بين الصفين وصلى قصراً، وعرض على الدعام المبارزة لئلا تقتتل العرب، فكرهها، وجرت الرسل ووقع قتال محدود قُتل فيه رجلان، ثم كفّ الهادي ميمنته ووقع الصلح وحلف الدعام على السمع والطاعة.
  en: In Ramadan 285 AH word reached al-Hadi that al-Da'am had left his land with a great army for al-Bawn, and thinking he meant Athafit he went back to it from Khiwan; then he went up to the head of al-Naqil and saw him, unfurled his banners, and al-Da'am went back to Hamda; they met at Najd al-Dayr, al-Hadi drew up his army, dismounted between the lines and prayed short, offered al-Da'am single combat so the Arabs would not fight each other, which he disliked; messengers passed, a limited fight left two dead, then al-Hadi told his right wing to stop and peace was made with al-Da'am swearing to hear and obey.
  ur: رمضان 285ھ میں ہادی کو خبر ملی کہ دعام بڑے لشکر کے ساتھ اپنے علاقے سے البون کی طرف نکلا ہے، انہوں نے سمجھا وہ اثافت کا ارادہ رکھتا ہے تو خیوان سے اثافت لوٹے؛ پھر النقیل کی چوٹی پر گئے اور اسے دیکھا، جھنڈے لہرائے اور دعام حمدہ لوٹ گیا؛ پھر نجد الضیر پر ملاقات ہوئی، ہادی نے لشکر کی صف بندی کی، دونوں صفوں کے درمیان اتر کر مختصر نماز پڑھی، دعام کو انفرادی مقابلے کی پیشکش کی تاکہ عرب آپس میں نہ لڑیں، جو اسے ناپسند ہوا؛ قاصد چلتے رہے، محدود لڑائی میں دو آدمی مارے گئے، پھر ہادی نے اپنے دائیں بازو کو رکنے کو کہا اور صلح ہوئی جس میں دعام نے سننے اور ماننے کی قسم کھائی۔
  es: "En Ramadán 285 AH, llegó a oídos de al-Hadi la noticia de que al-Da'am había abandonado su tierra con un gran ejército para ir a al-Bawn, y pensando que se refería a Athafit, regresó desde Khiwan; luego subió a la cabecera de al-Naqil y lo vio, desplegó sus estandartes, y al-Da'am regresó a Hamda; se encontraron en Najd al-Dayr, al-Hadi formó su ejército, desmontó entre las líneas y oró brevemente, ofreció a al-Da'am un combate singular para que los árabes no lucharan entre sí, lo cual a él no le gustaba; pasaron mensajeros, una lucha limitada dejó dos muertos, luego al-Hadi ordenó a su flanco derecho que se detuviera y se hizo la paz con al-Da'am jurando escuchar y obedecer."
  fr: "Durant le Ramadan 285 AH, la nouvelle parvint à al-Hadi qu'al-Da'am avait quitté ses terres avec une grande armée pour al-Bawn. Croyant qu'il s'agissait d'Athafit, il retourna à cette ville depuis Khiwan. Il se rendit ensuite auprès d'al-Naqil, l'aperçut, déploya ses bannières, et al-Da'am retourna à Hamda. Ils se rencontrèrent à Najd al-Dayr. al-Hadi déploya son armée, descendit de cheval entre les lignes et fit une courte prière. Il proposa à al-Da'am un duel singulier afin que les Arabes ne s'affrontent pas entre eux, ce qu'il désapprouvait. Des messagers passèrent, un bref combat s'ensuivit, faisant deux morts. Al-Hadi ordonna alors à son aile droite de cesser le combat et la paix fut conclue, al-Da'am jurant d'écouter et d'obéir."
  tr: "El-Hadi, Hicri 285 yılının Ramazan ayında El-Da'am'ın büyük bir orduyla ülkesini terk ederek El-Bawn'a gitmeyi planladığını öğrendi. Bunun üzerine El-Da'am'ın Athaf'a gitmeyi amaçladığını düşündü ve Hayvan'dan Athaf'a döndü. Daha sonra El-Nakil'in başına gitti ve onu gördü. Bunun üzerine sancakları açtı. El-Da'am Hamda'ya döndü ve Necd-i Zer'de karşılaştılar. El-Hadi ordusunu hazırladı, iki hat arasına indi ve kısa bir namaz kıldı. Arapların birbirleriyle savaşmaması için El-Da'am'a düello teklif etti, ancak El-Da'am bunu istemedi. Elçiler gönderildi ve iki adamın öldüğü sınırlı bir çatışma yaşandı. Bunun üzerine El-Hadi sağ kanadını durdurdu ve barış sağlandı. El-Da'am da itaat edeceğine ve söz vereceğine yemin etti."
  id: "Pada bulan Ramadan tahun 285 H, Al-Hadi mengetahui bahwa Al-Da'am telah meninggalkan negerinya dengan pasukan besar dengan maksud pergi ke Al-Bawn. Ia mengira Al-Da'am bermaksud pergi ke Athafat, lalu ia kembali dari Khaywan ke sana. Kemudian ia pergi ke kepala Al-Naqil dan menemuinya, lalu ia mengibarkan panji-panji. Al-Da'am pun kembali ke Hamda, lalu mereka bertemu di Najd Al-Dhair. Al-Hadi mempersiapkan pasukannya, lalu turun di antara kedua barisan dan melaksanakan salat singkat. Ia juga menawarkan Al-Da'am tantangan duel agar orang-orang Arab tidak saling bertempur, tetapi Al-Da'am tidak menyukainya. Para utusan pun datang dan terjadi pertempuran kecil yang mengakibatkan dua orang tewas. Kemudian Al-Hadi menghentikan sayap kanan pasukan Al-Da'am dan perdamaian pun tercapai. Al-Da'am bersumpah untuk mendengarkan dan mematuhi perintah."
