class: event
kind: other
label:
  ar: قصيدة عبد الله بن الحسين في قتل الهادي لبني الحارث، 286هـ
  en: The poem of Abdullah ibn al-Husayn on al-Hadi's killing of Banu al-Harith, 286 AH
  fr: "Poème d’Abdullah ibn al-Husayn sur la tuerie des Banu al-Harith par al-Hadi, 286 de l’hégire"
  ur: بنو حارث کے قتل پر عبداللہ بن حسین کا قصیدہ، 286ھ
  es: "El poema de Abdullah ibn al-Husayn sobre el asesinato de Banu al-Harith por parte de al-Hadi, 286 AH"
  tr: "Abdullah ibn al-Husayn'ın, al-Hadi'nin Beni al-Harith kabilesini katletmesi hakkında yazdığı bir şiir, Hicri 286."
  id: "Sebuah puisi karya Abdullah ibn al-Husayn tentang pembunuhan Banu al-Harith oleh al-Hadi, 286 H."
summary:
  ar: يقول عبد الله بن الحسين، بحسب الكتاب، قصيدة يصف فيها طيب نومه بعد القتل وجيش الهادي بخيله ورماحه وإمام العدل في أوله بدرعه وسيفه اليماني، ثم يذكر أن الحق أباد عصبة من أعدائه فصاروا هاربين وأسرى وقتلى، وأن الله يولي حزبه.
  en: Abdullah ibn al-Husayn is said by the book to have spoken a poem in which he says his sleep came easy again after the killing, describes al-Hadi's army with its horses and spears and the imam of justice at its head in mail and a Yemeni sword, and says the right destroyed a band of his enemies who became fugitives, captives and dead, and that God gives victory to his party.
  fr: "Le livre attribue à Abdullah ibn al-Husayn un poème où il dit avoir retrouvé un sommeil paisible après la tuerie, décrit l’armée d’al-Hadi avec ses chevaux et ses lances, l’imam de justice à sa tête en cotte de mailles avec une épée yéménite, et affirme que le droit a détruit une troupe de ses ennemis, devenus fugitifs, captifs et morts, et que Dieu donne la victoire à son parti."
  ur: کتاب کے مطابق عبداللہ بن حسین نے ایک قصیدہ کہا جس میں وہ کہتے ہیں کہ قتل کے بعد ان کی نیند آسان ہو گئی، ہادی کے لشکر کو گھوڑوں اور نیزوں کے ساتھ بیان کرتے ہیں اور عدل کے امام کو اس کے آگے زرہ اور یمنی تلوار میں، اور کہتے ہیں کہ حق نے اس کے دشمنوں کی ایک ٹولی کو ہلاک کیا اور وہ بھگوڑے، قیدی اور مقتول ہو گئے، اور اللہ اپنے گروہ کو فتح دیتا ہے۔
  es: "Según el Libro Sagrado, Abdullah ibn al-Husayn recitó un poema en el que afirma que volvió a dormir plácidamente tras la matanza, describe al ejército de al-Hadi con sus caballos y lanzas, y al imán de la justicia a la cabeza, vestido con cota de malla y empuñando una espada yemení. Además, dice que la derecha destruyó a un grupo de sus enemigos, que se convirtieron en fugitivos, prisioneros y muertos, y que Dios concede la victoria a su bando."
  tr: "Kitaba göre, Abdullah bin Hüseyin, katliamdan sonraki uykusunun tatlılığını, atları ve mızraklarıyla Hadi'nin ordusunu ve başında kalkanı ve Yemen kılıcıyla Adalet İmamını anlatan bir şiir okur. Ardından, hakikatin düşmanlarından bir grubu yok ettiğini, böylece onların kaçak, esir ve ölü hale geldiklerini ve Allah'ın partisinin koruyucusu olduğunu belirtir."
  id: "Menurut buku tersebut, Abdullah bin Al-Hussein membacakan sebuah puisi yang menggambarkan manisnya tidurnya setelah pembunuhan, dan pasukan Al-Hadi dengan kuda dan tombaknya, serta Imam Keadilan pada awalnya dengan perisai dan pedang Yamannya. Kemudian ia menyebutkan bahwa kebenaran telah memusnahkan sekelompok musuhnya, sehingga mereka menjadi buronan, tawanan, dan orang mati, dan bahwa Tuhan adalah pelindung kelompoknya."
