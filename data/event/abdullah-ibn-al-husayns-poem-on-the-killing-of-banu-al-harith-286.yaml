id: event/abdullah-ibn-al-husayns-poem-on-the-killing-of-banu-al-harith-286
class: event
kind: other
label:
  ar: قصيدة عبد الله بن الحسين في قتل الهادي لبني الحارث، 286هـ
  en: The poem of Abdullah ibn al-Husayn on al-Hadi's killing of Banu al-Harith, 286 AH
  ur: بنو حارث کے قتل پر عبداللہ بن حسین کا قصیدہ، 286ھ
summary:
  ar: يقول عبد الله بن الحسين، بحسب الكتاب، قصيدة يصف فيها طيب نومه بعد القتل وجيش الهادي بخيله ورماحه وإمام العدل في أوله بدرعه وسيفه اليماني، ثم يذكر أن الحق أباد عصبة من أعدائه فصاروا هاربين وأسرى وقتلى، وأن الله يولي حزبه.
  en: Abdullah ibn al-Husayn is said by the book to have spoken a poem in which he says his sleep came easy again after the killing, describes al-Hadi's army with its horses and spears and the imam of justice at its head in mail and a Yemeni sword, and says the right destroyed a band of his enemies who became fugitives, captives and dead, and that God gives victory to his party.
  ur: کتاب کے مطابق عبداللہ بن حسین نے ایک قصیدہ کہا جس میں وہ کہتے ہیں کہ قتل کے بعد ان کی نیند آسان ہو گئی، ہادی کے لشکر کو گھوڑوں اور نیزوں کے ساتھ بیان کرتے ہیں اور عدل کے امام کو اس کے آگے زرہ اور یمنی تلوار میں، اور کہتے ہیں کہ حق نے اس کے دشمنوں کی ایک ٹولی کو ہلاک کیا اور وہ بھگوڑے، قیدی اور مقتول ہو گئے، اور اللہ اپنے گروہ کو فتح دیتا ہے۔
