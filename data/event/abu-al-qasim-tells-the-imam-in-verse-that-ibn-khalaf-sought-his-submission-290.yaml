label:
  ar: "إبلاغ أبي القاسم الإمام شعراً أن ابن خلف رجا خضوعه، ص257-258، 290هـ"
  en: "Abu al-Qasim tells the imam in verse that Ibn Khalaf sought his submission, pp. 257-258, 290 AH"
  ur: "ابو القاسم کا امام کو منظوم خبر کہ ابن خلف نے ان کی تابع داری چاہی، ص257-258، 290ھ"
summary:
  ar: "مقطوعة تبدأ «أبلغ أمير المؤمنين» يقول فيها أبو القاسم إنه لم ينحرف وإن ابن خلف رجا خضوعه وحاول تحويله بالشدة، ويسأل عن عذر خصومه عند النبي ويتنبأ بتفرقهم."
  en: "A piece that begins \"convey to the commander of the faithful\": Abu al-Qasim says he has not turned aside, that Ibn Khalaf hoped for his submission and tried to turn him by harshness, asks what excuse his opponents will have before the Prophet and foretells that they will be scattered."
  ur: "«امیر المؤمنین کو پہنچا دو» سے شروع ہونے والا ٹکڑا: ابو القاسم کہتے ہیں کہ وہ منحرف نہ ہوئے، ابن خلف نے ان کے جھکنے کی امید کی اور سختی بدل کر پھیرنا چاہا، پھر پوچھتے ہیں کہ نبی کے سامنے مخالفوں کا کیا عذر ہو گا اور ان کے بکھرنے کی پیش گوئی کرتے ہیں۔"
