id: event/abu-al-qasim-tells-the-imam-in-verse-that-ibn-khalaf-sought-his-submission-290
class: event
kind: other
label:
  ar: "إبلاغ أبي القاسم الإمام شعراً أن ابن خلف رجا خضوعه، ص257-258، 290هـ"
  en: "Abu al-Qasim tells the imam in verse that Ibn Khalaf sought his submission, pp. 257-258, 290 AH"
  fr: "Abu al-Qasim dit en vers à l’imam qu’Ibn Khalaf cherchait sa soumission, p. 257-258, 290 de l’hégire"
  ur: "ابو القاسم کا امام کو منظوم خبر کہ ابن خلف نے ان کی تابع داری چاہی، ص257-258، 290ھ"
  es: "Abu al-Qasim le dice al imán en verso que Ibn Khalaf buscó su sumisión, págs. 257-258, 290 AH"
  tr: "Ebu el-Kâsim el-İmam'a, İbn Halef'in onun teslimiyetini umduğu ayetlerle bildirilmişti (s. 257-258, 290 Hicri)."
  id: "Abu al-Qasim al-Imam diberitahu melalui syair bahwa Ibnu Khalaf berharap agar beliau tunduk, hlm. 257-258, 290 H."
summary:
  ar: "مقطوعة تبدأ «أبلغ أمير المؤمنين» يقول فيها أبو القاسم إنه لم ينحرف وإن ابن خلف رجا خضوعه وحاول تحويله بالشدة، ويسأل عن عذر خصومه عند النبي ويتنبأ بتفرقهم."
  en: "A piece that begins \"convey to the commander of the faithful\": Abu al-Qasim says he has not turned aside, that Ibn Khalaf hoped for his submission and tried to turn him by harshness, asks what excuse his opponents will have before the Prophet and foretells that they will be scattered."
  fr: "Pièce commençant par « transmettez au Commandeur des croyants » : Abu al-Qasim dit n’avoir pas dévié, qu’Ibn Khalaf espérait sa soumission et tentait de le faire changer par la dureté ; il demande quelle excuse ses adversaires auront devant le Prophète et prédit leur dispersion."
  ur: "«امیر المؤمنین کو پہنچا دو» سے شروع ہونے والا ٹکڑا: ابو القاسم کہتے ہیں کہ وہ منحرف نہ ہوئے، ابن خلف نے ان کے جھکنے کی امید کی اور سختی بدل کر پھیرنا چاہا، پھر پوچھتے ہیں کہ نبی کے سامنے مخالفوں کا کیا عذر ہو گا اور ان کے بکھرنے کی پیش گوئی کرتے ہیں۔"
  es: "Un fragmento que comienza con \"transmitir al comandante de los creyentes\": Abu al-Qasim dice que no se ha apartado, que Ibn Khalaf esperaba su sumisión y trató de hacer que se volviera con dureza, pregunta qué excusa tendrán sus oponentes ante el Profeta y predice que serán dispersados."
  tr: "“Müminlerin Emiri’ne bildiriyorum” diye başlayan bir şiirde Ebu el-Kâsım, kendisinin yoldan sapmadığını, İbn Halef’in kendisinin teslim olmasını umduğunu ve onu zorla İslam’a döndürmeye çalıştığını söyler; Peygamber’in huzurunda muhaliflerinin mazeretini sorar ve onların dağılacağını öngörür."
  id: "Sebuah puisi yang dimulai dengan \"Aku memberitahukan kepada Amirul Mukminin\" di mana Abu al-Qasim mengatakan bahwa dia tidak menyimpang dan bahwa Ibnu Khalaf berharap dia tunduk dan mencoba untuk memaksanya masuk Islam, dan dia bertanya tentang alasan lawan-lawannya di hadapan Nabi dan meramalkan pembubaran mereka."
