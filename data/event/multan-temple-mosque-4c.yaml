label: { ar: "هدم بدّ الملتان وإقامة جامع مكانه", en: "The temple of Multan destroyed and a mosque raised in its place" }
summary:
  ar: "في النصف الثاني من القرن الرابع الهجري (العاشر الميلادي) هدم شيبان، وهو من الدعاة الإسماعيليين الذين بلغت دعوتهم السند، هيكل الملتان المشهور — «بدّها» الذي كانت تُهدى إليه الأموال ويحجّ إليه أهل السند — وأقام جامعاً في موضعه. وتذكر دائرة المعارف أن المؤرخين اختلفوا في تعيين سنة الهدم، فلا يُجزم بسنة بعينها {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  en: "In the second half of the 4th/10th century the Ismaili da'i Shayban — one of the missionaries whose call had reached Sind — destroyed Multan's famous temple, the budd to which treasure was offered and to which the people of Sind made pilgrimage, and raised a congregational mosque on its site. The historians' suggested dates differ, so no single year is certain {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  ur: "چوتھی صدی ہجری (دسویں صدی عیسوی) کے دوسرے نصف میں اسماعیلی داعی شيبان نے — جن دعاۓوں کی دعوت سندھ تک پہنچ چکی تھی — ملتان کا مشہور مندر (اس کا «بد» جسے خزانے کی نذریں ملتیں اور جس کے سندھ کے لوگ طواف کیا کرتے تھے) ڈھا دیا اور اس کی جگہ جامع مسجد تعمیر کی۔ مؤرخین تخریب کی سال کے تعین میں اختلاف رکھتے ہیں، اس لیے کوئی ایک سال یقینی نہیں {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}۔"
