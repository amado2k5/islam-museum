id: event/balams-fall
class: event
kind: other
label:
  ar: "انسلاخ صاحب الآيات واتباع الشيطان"
  en: "The man of the revelations who sloughed them off"
  ur: "آیات بعدال کرنے والے کاinu کی پیروی"
summary:
  ar: "يأمر الله رسوله أن يتلو على قومه نبأ الذي آتيه آياته فانسلاخ منها، فأتبعه الشيطان فكان من الغاوين؛ حتى إن الله لو شاء لرفعه بها لكنه أخلد إلى الأرض واتبع هواه، فكان مثله كمثل الكلب إن تحمله يلهث وإن تتركه يلهث {cite:tanzil-quran}. وفي التفسير tradition هذا هو بلعام بن باعوراء الذي سحره إبليس {cite:tafsir-ibn-kathir} {cite:assabile-omar-abdelkafy}."
  en: "God commands His messenger to recite to his people the tale of the man to whom He gave His revelations, who sloughed them off so Satan overtook him and he became of those who lead astray; had God willed He could have raised him thereby, but he clung to the earth and followed his own desire, so his likeness is as the likeness of the dog that pants whether you burden him or leave him {cite:tanzil-quran}. In the tafsir tradition this is Bal'am ibn Ba'ura, whom Iblis bewitched {cite:tafsir-ibn-kathir} {cite:assabile-omar-abdelkafy}."
  ur: "اللہ اپنے رسول کو حکم دیتا ہے کہ اپنی قوم کو اس شخص کی کہانی سنائے جسے اس نے اپنی آیتیں دیں، تو اس نے انہیں اتار دیا، پھر شیطان اس کے پیچھے لگا اور وہ گمراہوں میں ہو گیا؛ اگر اللہ چاہتا تو اسے ان سے بلند کر دیتا مگر اس نے زمین سے لگاؤ رکھا اور اپنی خواہش کے پیچھے چلا، اس کی مثال اس کتے کی ہے جو لاد ہو یا نہ ہو، دونوں حال میں ہانپتا ہے {cite:tanzil-quran}۔ تفسیر کی روایت میں یہی بلعم بن باعوراء ہے جسے إبلیس نے جادو کیا {cite:tafsir-ibn-kathir} {cite:assabile-omar-abdelkafy}."
