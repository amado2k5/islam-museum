label: { ar: "بناء مدينة سيسر", en: "The Building of Sisar", es: "El edificio de Sisar", fr: "La construction de Sisar" }
summary:
  ar: "عند البلاذري: سميت سيسر لأنها في الخفاض من الأرض بين رؤوس أكام ثلاثين فقيل ثلاثون رأساً وكانت تدعى سيسر صدخانية أي ثلاثون رأساً ومائة عين وبها عيون كثيرة تكون مائة عين ولم تزل سيسر وما والاها مراعي لمواشي الأكراد وغيرهم وكانت بها مروج لدواب الهدي أمير المؤمنين وأغنامه وعليها مولى له يقال له سليمان بن قيراط صاحب صحراء قيراط بمدينة السلام وشريك معه يقال له سلام الطيفوري وكان طيفور مولى أبي جعفر المنصور وهبه للمهدي فلما كثر الصعاليك والذعار وانتشروا بالجبل في خلافة الهدي جعلوا هذه الناحية ملجأ لهم وحوزاً فكانوا يقطعون ويأوون إليها ولا يطلبون لأنها حد همذان والدينور وأذربيجان فكتب سليمان بن قيراط وشريكه إلى المهدي بخبرهم وشكيا عرضهم لما في أيديهم من الدواب والأغنام فوجه إليهم جيشاً عظيماً وكتب إليهما يأمرهما ببناء مدينة يأويان إليها وأعوانهما ورعاتهما ويحصنان فيها الدواب والأغنام فبنيا مدينة سيسر وحصناها وأسكناها الناس وضم إليها رستاق مانهارج من الدينور ورستاق الجوذمة من أذربيجان من كورة برزة ورستاف وخابنجر فكورت بهذه الرساتيق ووليها عامل مفرد وكان خراجها يؤدى إليه ثم إن الصعاليك كثروا في خلافة الرشيد وشقفوا سيسر فأمر بمرمتها وتحصينها ورتب فيها ألف رجل من أصحاب خاقان الخادم السفدي ففيها قوم من أولادهم ثم لما كان آخر أيام الرشيد وجه مرة بن علي الرديني العجلي على سيسر فحاول عثمان الأودي مغالبته عليها فلم يقدر وغلبه على ما كان في يده من أذربيجان أو أكثره ولم يزل مرة يؤدي الخراج عن سيسر في أيام محمد بن الرشيد على مقاطعة إلى أن وقعت الفتنة ثم أخذت من عاصم بن مرة فأخرجت من يده في خلافة المأمون فرجعت إلى ضياع الخلافة."
  en: "In al-Baladhuri: Sisar was named for lying in the lows between thirty hilltops — 'thirty heads' — called Sisar Sadkhaniye, 'thirty heads and a hundred springs,' its springs forming a hundred. It and its environs were ever pastures for the Kurds' cattle, holding meadows for the caliph al-Mahdi's herd-beasts and flocks under his mawla Sulayman ibn Qayrat — owner of Sahrat Qayrat at Madinat al-Salam — and his partner Salam al-Tayfuri, Tayfur having been Abu Ja'far al-Mansur's mawla gifted to al-Mahdi. When brigands and robbers multiplied in al-Hadi's caliphate they made the tract their refuge — being the border of Hamadhan, al-Dinawar and Adharbayjan — cutting the roads and sheltering there unmolested; Sulayman and Salam wrote al-Mahdi complaining of the exposure of the beasts and flocks in their charge, and he sent a great army and ordered them to build a city to shelter themselves, their helpers and herdsmen, and to fortify the beasts and flocks within — so they built Sisar, fortified and peopled it, annexing the rustaqs of Manharaj from al-Dinawar, al-Jawdhama from Adharbayjan's Barza kura, Rustaf and Khabanjir, making it a kura under its own amil who received its kharaj. When brigands again multiplied under al-Rashid and wrecked Sisar he ordered its repair and fortification, stationing a thousand men of al-Khaqan's followers under the mawla al-Sufdi — descendants remain. In al-Rashid's last days Murra ibn Ali al-Rudhayni al-Ijli was set over it; Uthman al-Awdi failed to wrest it from him while Murra took most of Adharbayjan from him; Murra kept paying Sisar's kharaj under Muhammad ibn al-Rashid on a muqata'a until the fitna, and it was taken from Asim ibn Murra under al-Ma'mun, returning to the caliphal estates."
  es: "En al-Baladhuri: Sisar fue nombrado por estar ubicado en las tierras bajas entre treinta cimas de colinas — 'treinta cabezas' — llamado Sisar Sadkhaniye, 'treinta cabezas y cien manantiales', sus manantiales formando cien. Tanto este lugar como sus alrededores fueron siempre pastos para el ganado de los kurdos, manteniendo prados para las bestias de rebaño y los rebaños del califa al-Mahdi bajo su mawla Sulayman ibn Qayrat — dueño de Sahrat Qayrat en Madinat al-Salam — y su socio Salam al-Tayfuri, habiendo Tayfur sido el mawla de Abu Ja'far al-Mansur obsequiado a al-Mahdi. Cuando los bandidos y ladrones se multiplicaron en el califato de al-Hadi, hicieron de la zona su refugio — al ser la frontera de Hamadhan, al-Dinawar y Adharbayjan — cortando los caminos y resguardándose allí sin ser molestados; Sulayman y Salam escribieron a al-Mahdi quejándose de la exposición de las bestias y los rebaños a su cargo, y él envió un gran ejército y les ordenó construir una ciudad para resguardarse a sí mismos, a sus ayudantes y pastores, y para fortificar las bestias y los rebaños en su interior; así construyeron Sisar, la fortificaron y la poblaron, anexionando los rustaqs de Manharaj de al-Dinawar, al-Jawdhama del Barza kura de Adharbayjan, Rustaf y Khabanjir, convirtiéndola en un kura bajo su propio amil que recibió su kharaj. Cuando los bandidos se multiplicaron nuevamente bajo al-Rashid y destruyeron Sisar, ordenó su reparación y fortificación, estacionando a mil hombres de los seguidores de al-Khaqan bajo el mawla al-Sufdi; sus descendientes aún permanecen. En los últimos días de al-Rashid, Murra ibn Ali al-Rudhayni al-Ijli fue puesto al mando; Uthman al-Awdi no logró arrebatárselo, mientras que Murra le quitó la mayor parte de Adharbayjan; Murra siguió pagando el kharaj de Sisar bajo Muhammad ibn al-Rashid en una muqata'a hasta la fitna, y fue tomado de Asim ibn Murra bajo al-Ma'mun, regresando a las propiedades del califa."
  fr: "Selon al-Baladhuri: Sisar tire son nom de sa situation dans les creux entre trente sommets de collines – « trente têtes » – appelée Sisar Sadkhaniye, « trente têtes et cent sources », ses sources formant une centaine. Ce lieu et ses environs ont toujours servi de pâturages au bétail kurde, offrant des prairies aux bêtes de somme et aux troupeaux du calife al-Mahdi sous l’autorité de son mawla Sulayman ibn Qayrat – propriétaire de Sahrat Qayrat à Madinat al-Salam – et de son associé Salam al-Tayfuri, Tayfur étant le mawla d’Abu Ja’far al-Mansur offert à al-Mahdi. Lorsque les brigands et les voleurs se multiplièrent dans le califat d’al-Hadi, ils firent de cette région leur refuge – à la frontière d’Hamadhan, d’al-Dinawar et d’Adharbayjan – coupant les routes et s’y abritant sans être inquiétés. Sulayman et Salam écrivirent à al-Mahdi pour se plaindre de l'exposition des bêtes et des troupeaux dont ils avaient la charge. Celui-ci envoya une grande armée et leur ordonna de construire une ville pour s'abriter, ainsi que leurs serviteurs et leurs bergers, et de fortifier les bêtes et les troupeaux à l'intérieur. Ils construisirent donc Sisar, la fortifièrent et la peuplèrent, annexant les rustaqs de Manharaj d'al-Dinawar, d'al-Jawdhama de la kura de Barza d'Adharbayjan, de Rustaf et de Khabanjir, en faisant une kura sous son propre amil qui reçut son kharaj. Lorsque les brigands se multiplièrent à nouveau sous al-Rashid et ravagèrent Sisar, il ordonna sa réparation et sa fortification, stationnant un millier d'hommes des partisans d'al-Khaqan sous le mawla al-Sufdi — des descendants y vivent encore. À la fin de la vie d'al-Rashid, Murra ibn Ali al-Rudhayni al-Ijli fut placé à son autorité. Uthman al-Awdi ne parvint pas à le lui arracher tandis que Murra lui prit la majeure partie d'Adharbayjan; Murra continua à payer le kharaj de Sisar sous Muhammad ibn al-Rashid sur une muqata'a jusqu'à la fitna, et il fut repris à Asim ibn Murra sous al-Ma'mun, retournant aux domaines califes."
