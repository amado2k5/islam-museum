label: { ar: "خروج المستنصر إلى العراق وفقدانه" }
summary:
  ar: "عزم المستنصر على التوجه إلى العراق فخرج معه السلطان يشيعه إلى أن دخلوا دمشق ثم جهز السلطان الخليفة وأولاد صاحب الموصل وغرم عليه وعليهم من الذهب ألف ألف دينار وستين ألف درهم فسار الخليفة ومعه ملوك الشرق صاحب الموصل وصاحب سنجار والجزيرة فاجتمع به الخليفة الحلبي الحاكم فدان له ودخل تحت طاعته ثم سار ففتح الحديثة ثم هيت فجاءه عسكر من التتار فتصافوا فقتل من المسلمين جماعة وعدم الخليفة المستنصر فقيل قتل وهو الظاهر وقيل سلم وهرب فأضمرته البلاد وذلك في الثالث من المحرم سنة ستين فكانت خلافته دون ستة أشهر، وكان صاحب حلب الأمير شمس الدين أقوش قد أقام بحلب خليفة ولقبه الحاكم بأمر الله وخطب له ونقش اسمه على الدراهم {cite:tarikh-khulafa-minhaj-1434 p. 724}. وفي شذرات الذهب سار المستنصر ليأخذ بغداد ويقيم بها وكان في آخر العام مصاف بينه وبين التتار الذين بالعراق فعدم المستنصر في الوقعة وانهزم الحاكم قبجا {cite:shadharat-dhahab p. 296}."
  en: "Al-Mustansir marched for Iraq, the sultan seeing him off to Damascus with a million dinars' outfit and the lords of Mosul, Sinjar and the Jazira in his train; Aleppo's rival caliph al-Hakim — set up by its amir Aqush with his own coin — joined and submitted. He took al-Haditha and Hit, met a Tatar host, and vanished at the battle of 3 Muharram 660: most say killed, some say fled and hidden — a caliphate under six months {cite:tarikh-khulafa-minhaj-1434 p. 724}."
