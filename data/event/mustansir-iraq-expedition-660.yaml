label: { ar: "خروج المستنصر إلى العراق وفقدانه", en: "Al-Mustansir's departure for Iraq and his disappearance", es: "La partida de Al-Mustansir a Irak y su desaparición.", fr: "Le départ d'Al-Mustansir pour l'Irak et sa disparition", ur: "المستنصر کا عراق کے لیے روانگی اور اس کی گمشدگی", tr: "El-Mustansir'in Irak'a gidişi ve kaybı", id: "Kepergian Al-Mustansir ke Irak dan kehilangannya" }
summary:
  ar: "عزم المستنصر على التوجه إلى العراق فخرج معه السلطان يشيعه إلى أن دخلوا دمشق ثم جهز السلطان الخليفة وأولاد صاحب الموصل وغرم عليه وعليهم من الذهب ألف ألف دينار وستين ألف درهم فسار الخليفة ومعه ملوك الشرق صاحب الموصل وصاحب سنجار والجزيرة فاجتمع به الخليفة الحلبي الحاكم فدان له ودخل تحت طاعته ثم سار ففتح الحديثة ثم هيت فجاءه عسكر من التتار فتصافوا فقتل من المسلمين جماعة وعدم الخليفة المستنصر فقيل قتل وهو الظاهر وقيل سلم وهرب فأضمرته البلاد وذلك في الثالث من المحرم سنة ستين فكانت خلافته دون ستة أشهر، وكان صاحب حلب الأمير شمس الدين أقوش قد أقام بحلب خليفة ولقبه الحاكم بأمر الله وخطب له ونقش اسمه على الدراهم {cite:tarikh-khulafa-minhaj-1434 p. 724}. وفي شذرات الذهب سار المستنصر ليأخذ بغداد ويقيم بها وكان في آخر العام مصاف بينه وبين التتار الذين بالعراق فعدم المستنصر في الوقعة وانهزم الحاكم قبجا {cite:shadharat-dhahab p. 296}."
  en: "Al-Mustansir marched for Iraq, the sultan seeing him off to Damascus with a million dinars' outfit and the lords of Mosul, Sinjar and the Jazira in his train; Aleppo's rival caliph al-Hakim — set up by its amir Aqush with his own coin — joined and submitted. He took al-Haditha and Hit, met a Tatar host, and vanished at the battle of 3 Muharram 660: most say killed, some say fled and hidden — a caliphate under six months {cite:tarikh-khulafa-minhaj-1434 p. 724}."
  es: "Al-Mustansir marchó hacia Irak, el sultán lo despidió en Damasco con un séquito de un millón de dinares y los señores de Mosul, Sinjar y Jazira en su séquito; el califa rival de Alepo, al-Hakim —instaurado por su emir Aqush con su propia moneda— se unió y se sometió. Tomó al-Haditha y Hit, se enfrentó a un ejército tártaro y desapareció en la batalla del 3 de Muharram de 660: la mayoría dice que murió, otros que huyó y se ocultó; un califato de menos de seis meses {cite:tarikh-khulafa-minhaj-1434 p. 724}."
  fr: "Al-Mustansir marcha sur l'Irak, accompagné du sultan qui le conduisit à Damas avec un équipement d'une valeur d'un million de dinars et les seigneurs de Mossoul, Sinjar et de la Jazira. Le calife rival d'Alep, al-Hakim, installé par son émir Aqush grâce à sa propre monnaie, se joignit à lui et se soumit. Il prit al-Haditha et Hit, rencontra une armée tatare et disparut lors de la bataille du 3 Muharram 660: la plupart disent qu'il fut tué, d'autres qu'il s'enfuit et se cacha – un califat de moins de six mois {cite:tarikh-khulafa-minhaj-1434 p. 724}."
  ur: "المستنصر نے عراق کی طرف کوچ کیا، سلطان نے اسے دس لاکھ دینار کے لباس اور موصل، سنجار اور جزیرہ کے سرداروں کے ساتھ اپنی ٹرین میں دمشق جاتے ہوئے دیکھا۔ حلب کے حریف خلیفہ الحکیم - جو اس کے امیر عقوش نے اپنے سکے کے ساتھ ترتیب دیا تھا - نے شمولیت اختیار کی اور جمع کرائی۔ اس نے الحدیثہ اور ہٹ لیا، ایک تاتاری میزبان سے ملاقات کی، اور 3 محرم 660 کی جنگ میں غائب ہو گیا: زیادہ تر کہتے ہیں مارے گئے، کچھ کہتے ہیں بھاگ گئے اور چھپ گئے - خلافت چھ ماہ کے اندر۔ 724}۔"
  tr: "El-Mustansir Irak'a gitmeye karar verdi, bu yüzden Sultan onu uğurlamak için onunla birlikte Şam'a kadar gitti. Sonra Sultan, halifeye ve Musul hükümdarının oğullarına bir milyon dinar ve altmış bin dirhem altın verdi. Böylece halife, doğu kralları, Musul hükümdarı, Sincar ve Cezire hükümdarı eşliğinde yola çıktı. Halep halifesi El-Hakim onunla görüştü, ona boyun eğdi ve onun emrine girdi. Sonra yola çıktı ve Haditha'yı ve ardından Hit'i fethetti. Sonra bir Tatar ordusu ona geldi ve çatıştılar, bir grup Müslüman öldürüldü. Halife El-Mustansir öldürülmedi. Öldürüldüğü söylendi, bu görünen rivayettir, kurtarıldığı ve kaçtığı, ülkenin onu barındırdığı da söylendi. Bu, altmış yılının Muharrem ayının üçüncü günüydü. Yani halifeliği altı aydan az sürdü. Halep hükümdarı Prens Şemseddin Akuş, Halep'te bir halife atamış ve ona El-Hakim bi-Amr Allah unvanını vermişti; hutbe onun adına okunmuş ve adı dirhemlerin üzerine yazılmıştı. {kaynak:tarikh-khulafa-minhaj-1434 s. 724}. Şadharat el-Dhahab'da, el-Mustansir'in Bağdat'ı ele geçirmek ve orada ikamet etmek için yola çıktığı belirtilir. Yılın sonunda, Irak'ta bulunan Tatarlarla arasında bir savaş olmuştur. El-Mustansir savaşta yenilmiş ve hükümdar Kabja da mağlup olmuştur. {kaynak:şadharat-dhahab s. 296}."
  id: "Al-Mustansir memutuskan untuk pergi ke Irak, jadi Sultan pergi bersamanya untuk mengantarnya sampai mereka memasuki Damaskus. Kemudian Sultan menyediakan Khalifah dan putra-putra penguasa Mosul dan membayar mereka satu juta dinar dan enam puluh ribu dirham emas. Maka Khalifah berangkat, ditem ditemani oleh raja-raja Timur, penguasa Mosul, penguasa Sinjar dan Al-Jazira. Khalifah Aleppo, Al-Hakim, menemuinya dan tunduk kepadanya serta berada di bawah ketaatannya. Kemudian ia berangkat dan menaklukkan Al-Haditha dan kemudian Hit. Kemudian pasukan Tatar datang kepadanya dan mereka bentrok, dan sekelompok Muslim terbunuh. Khalifah Al-Mustansir tidak terbunuh. Ada yang mengatakan bahwa ia terbunuh, dan ini adalah versi yang tampak, dan ada pula yang mengatakan bahwa ia diselamatkan dan melarikan diri, dan negara melindunginya. Ini terjadi pada tanggal 3 Muharram tahun enam puluh. Jadi kekhalifahannya kurang dari enam bulan. Penguasa Aleppo, Pangeran Shams al-Din Aqoush, telah menetapkan seorang Khalifah di Aleppo dan memberinya gelar Al-Hakim bi-Amr Allah, dan khutbah disampaikan atas namanya dan namanya diabadikan pada dirham. {cite:tarikh-khulafa-minhaj-1434 p. 724}. Dalam Shadharat al-Dhahab, disebutkan bahwa al-Mustansir berbaris untuk merebut Baghdad dan menetap di sana. Pada akhir tahun, terjadi pertempuran antara dia dan Tatar yang berada di Irak. Al-Mustansir dikalahkan dalam pertempuran tersebut, dan penguasa Qabja dikalahkan. {cite:shadharat-dhahab p. 296}."
