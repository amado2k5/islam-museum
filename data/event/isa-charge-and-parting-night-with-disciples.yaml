id: event/isa-charge-and-parting-night-with-disciples
class: event
kind: other
tags: [wasaya-browser, wasaya-prophets, wasaya-wasiyya, wasaya-ihtidar]
label:
  ar: "تكليف عيسى بالصلاة والزكاة، ووصيته لحواريّيه، ورفعه في كتب أهل السنة"
  en: "Isa's charge of prayer and almsgiving, his counsel to the disciples, and his being raised in the Sunni books"
  ur: "عیسیٰ کا نماز و زکاۃ کا حکم، حواریوں کو ان کی نصیحت، اور اہلِ سنت کی کتابوں میں ان کا اٹھایا جانا"
  es: "La exhortación de Isa a la oración y la limosna, su consejo a los discípulos y su crianza en los libros sunitas"
  fr: "Les instructions d'Isa concernant la prière et l'aumône, ses conseils aux disciples et son élévation dans les livres sunnites"
  tr: "Sünni kitaplarında İsa'nın dua etme ve sadaka verme emri, öğrencilerine verdiği talimatlar ve göğe yükselişi."
  id: "Perintah Yesus untuk berdoa dan memberi sedekah, instruksinya kepada para muridnya, dan kenaikannya ke surga dalam kitab-kitab Sunni."
summary:
  ar: "تذكر آيات مريم أن عيسى أخبر في المهد بأن الله كلّفه بالصلاة والزكاة ما دام حياً وبالبر بوالدته {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 703} {cite:tafsir-ibn-kathir scan vol. 1 p. 2942}. ويروي ابن جرير عن وهب بن منبه أنه جمع الحواريين في ليلة ووقف يخدمهم ويغسل أيديهم ويوصيهم بالتواضع وبالدعاء له أن يؤخّر أجله، ثم أنذرهم بالإنكار والتسليم {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 748} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 749}. ويروي ابن أبي حاتم عن ابن عباس بإسناد صحيح عند ابن كثير أن الله رفعه من بيت فيه اثنا عشر رجلاً بعد أن ألقى شبهه على شاب منهم {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 746} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 747}. وموقف أهل السنة كما يعرضه ابن كثير أنه رُفع حياً إلى السماء ولم يُقتل ولم يُصلب، وأنه سينزل في آخر الزمان {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 745} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 746}."
  en: "The verses of Maryam tell that Isa declared in the cradle that God had charged him with prayer and almsgiving as long as he lived and with kindness to his mother {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 703} {cite:tafsir-ibn-kathir scan vol. 1 p. 2942}. Ibn Jarir reports from Wahb ibn Munabbih that he gathered the disciples one night, served them and washed their hands, counselled humility and asked them to pray that his term be delayed, then warned them of denial and betrayal {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 748} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 749}. Ibn Abi Hatim reports from Ibn Abbas, by a chain Ibn Kathir calls sound, that God raised him from a house with twelve men after casting his likeness on a young man among them {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 746} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 747}. The Sunni position as Ibn Kathir sets it out is that he was raised alive to heaven and neither killed nor crucified, and will descend at the end of time {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 745} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 746}."
  ur: "سورۂ مریم کی آیات بتاتی ہیں کہ عیسیٰ نے گہوارے میں بتایا کہ اللہ نے انھیں جب تک زندہ رہیں نماز و زکاۃ اور والدہ سے حسنِ سلوک کا پابند کیا ہے {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 703} {cite:tafsir-ibn-kathir scan vol. 1 p. 2942}۔ ابن جریر وہب بن منبہ سے روایت کرتے ہیں کہ انھوں نے ایک رات حواریوں کو جمع کیا، ان کی خدمت کی اور ہاتھ دھوئے، عاجزی کی نصیحت کی اور کہا کہ ان کی مدت مؤخر ہونے کی دعا کریں، پھر انکار اور سپردگی سے خبردار کیا {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 748} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 749}۔ ابن ابی حاتم ابن عباس سے، ایسی سند سے جسے ابن کثیر صحیح کہتے ہیں، روایت کرتے ہیں کہ اللہ نے بارہ آدمیوں والے گھر سے انھیں اٹھایا، ان میں سے ایک نوجوان پر ان کی شبیہ ڈال کر {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 746} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 747}۔ ابن کثیر کے بیان کے مطابق اہلِ سنت کا موقف یہ ہے کہ وہ زندہ آسمان پر اٹھائے گئے، نہ قتل ہوئے نہ سولی چڑھے، اور آخری زمانے میں اتریں گے {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 745} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 746}۔"
  es: "Los versículos de Maryam dicen que Isa declaró en la cuna que Dios le había encomendado la oración y la limosna mientras viviera y la bondad hacia su madre {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 703} {cite:tafsir-ibn-kathir scan vol. 1 p. 2942}. Ibn Jarir informa de Wahb ibn Munabbih que reunió a los discípulos una noche, los sirvió y les lavó las manos, les aconsejó la humildad y les pidió que oraran para que su mandato se retrasara, luego les advirtió sobre la negación y la traición {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 748} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 749}. Ibn Abi Hatim informa de Ibn Abbas, mediante una cadena que Ibn Kathir considera sólida, que Dios lo elevó de una casa con doce hombres después de proyectar su imagen en un joven de entre ellos {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 746} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 747}. La posición sunita, tal como la expone Ibn Kathir, es que fue elevado vivo al cielo y no fue asesinado ni crucificado, y descenderá al final de los tiempos {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 745} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 746}."
  fr: "Les versets de Maryam rapportent qu'Isa déclara dans son berceau que Dieu l'avait chargé de la prière et de l'aumône tout au long de sa vie, ainsi que de la bienveillance envers sa mère {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 703} {cite:tafsir-ibn-kathir scan vol. 1 p. 2942}. Ibn Jarir rapporte de Wahb ibn Munabbih qu'il réunit les disciples une nuit, les servit et leur lava les mains, leur conseilla l'humilité et leur demanda de prier pour que sa mort soit retardée, puis les mit en garde contre le reniement et la trahison {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 748} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 749}. Ibn Abi Hatim rapporte d'après Ibn Abbas, selon une chaîne de transmission qu'Ibn Kathir juge authentique, que Dieu l'a ressuscité d'une maison où vivaient douze hommes, après avoir projeté son image sur un jeune homme parmi eux {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 746} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 747}. Selon la doctrine sunnite, telle qu'elle est présentée par Ibn Kathir, il a été élevé vivant au ciel, sans être tué ni crucifié, et redescendra à la fin des temps {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 745} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 746}."
  tr: "Meryem ile ilgili ayetlerde, İsa'ya beşikteyken Allah'ın ona yaşadığı sürece dua etmesini, zekât vermesini ve annesine itaat etmesini emrettiği söylendiği belirtilir. {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 703} {cite:tafsir-ibn-kathir scan vol. 1 p. 2942}. İbn Jarir, Vahb ibn Munabbih'den rivayetle, bir gece öğrencilerini topladığını, onlara hizmet ettiğini, ellerini yıkadığını ve onlara alçakgönüllü olmalarını ve ölümünün ertelenmesi için dua etmelerini öğütlediğini anlatır. Sonra onları inkâr ve teslimiyetten sakınmaları konusunda uyarır. {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 748} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 749}. İbn Abi Hatim, İbn Abbas'tan rivayetle ve İbn Kathir'de bulunan sağlam bir isnad zinciriyle, Allah'ın onu on iki adamın bulunduğu bir evden, içlerinden birine suretini yansıtarak yükselttiğini nakletmiştir. İbn Kathir'in sunduğu Ehl-i Sünnet'in görüşüne göre, o diri diri göğe yükseltilmiş, ne öldürülmüş ne de çarmıha gerilmiştir ve zamanın sonunda yeryüzüne inecektir."
  id: "Ayat-ayat tentang Maryam menyebutkan bahwa Yesus diberitahu sejak masih bayi bahwa Allah telah memerintahkannya untuk berdoa dan memberi sedekah selama hidupnya, dan untuk berbakti kepada ibunya. {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 703} {cite:tafsir-ibn-kathir scan vol. 1 p. 2942}. Ibn Jarir meriwayatkan dari Wahb ibn Munabbih bahwa suatu malam ia mengumpulkan para murid dan berdiri melayani mereka, mencuci tangan mereka, dan menasihati mereka untuk bersikap rendah hati dan berdoa agar kematiannya ditunda. Kemudian ia memperingatkan mereka agar tidak mengingkari dan tunduk. {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 748} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 749}. Ibn Abi Hatim meriwayatkan dari Ibn Abbas, dengan sanad yang sahih yang terdapat pada Ibn Kathir, bahwa Allah mengangkatnya dari sebuah rumah yang berisi dua belas orang setelah memberikan rupanya kepada salah seorang dari mereka. Pendapat Ahlus Sunnah, sebagaimana dikemukakan oleh Ibn Kathir, adalah bahwa ia diangkat hidup-hidup ke surga, tidak dibunuh atau disalib, dan bahwa ia akan turun pada akhir zaman."
