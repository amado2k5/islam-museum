summary:
  ar: "في سنة سبع من أيام هشام فتحت قيصرية الروم بالسيف، وفي سنة ثمان فتحت خنجرة على يد البطال الشجاع المشهور، وفي سنة اثنتي عشرة فتحت خرشنة في ناحية ملطية {cite:tarikh-khulafa-minhaj-1434 p. 402}."
  en: "In year seven of Hisham's reign Caesarea of the Romans was taken by the sword; in year eight Khanjara was conquered by the renowned champion al-Battal; in year twelve Kharshana in the district of Malatya was conquered {cite:tarikh-khulafa-minhaj-1434 p. 402}."
  es: "En el séptimo año del reinado de Hisham, Cesarea de los romanos fue tomada por la espada; en el octavo año, Khanjara fue conquistada por el renombrado campeón al-Battal; en el duodécimo año, Kharshana en el distrito de Malatya fue conquistada {cite:tarikh-khulafa-minhaj-1434 p. 402}."
  fr: "La septième année du règne d'Hisham, Césarée des Romains fut prise par l'épée; la huitième année, Khanjara fut conquise par le célèbre champion al-Battal; la douzième année, Kharshana dans le district de Malatya fut conquise {cite:tarikh-khulafa-minhaj-1434 p. 402}."
  ur: "ہشام کی حکومت کے سات سال میں رومیوں کے قیصریہ کو تلوار سے مارا گیا۔ سال آٹھ میں خنجارا کو مشہور چیمپیئن الباطل نے فتح کیا تھا۔ بارہ سال میں ضلع ملاتیا میں خرشنا فتح ہوا 402}۔"
  tr: "Hişam'ın hükümdarlığının yedinci yılında, Romalıların Caesarea şehri kılıçla fethedildi. Sekizinci yılında, ünlü cesur kahraman tarafından Hanjara fethedildi. On ikinci yılında ise Malatya bölgesindeki Harşana fethedildi. {cite:tarikh-khulafa-minhaj-1434 s. 402}"
  id: "Pada tahun ketujuh pemerintahan Hisham, Caesarea milik Romawi ditaklukkan dengan pedang. Pada tahun kedelapan, Khanjara ditaklukkan oleh pahlawan pemberani yang terkenal. Pada tahun kedua belas, Kharshana ditaklukkan di wilayah Malatya. {cite:tarikh-khulafa-minhaj-1434 p. 402}"
