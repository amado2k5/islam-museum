id: event/siege-of-constantinople-1394
class: event
kind: siege
label: { ar: "حصار القسطنطينية ⁦(١٣٩٤)⁩", en: "Siege of Constantinople", es: "Sitio de Constantinopla", fr: "Siège de Constantinople", ur: "قسطنطنیہ کا محاصرہ" }
summary:
  ar: "فرض السلطان بايزيد الأول على الإمبراطور البيزنطي قبل معركة نيكوبوليس تعيينَ قاضٍ للمسلمين في القسطنطينية وإنشاء مسجد وتخصيص سبعمئة منزل للجالية الإسلامية والتنازل عن نصف حي غلطة الذي وُضعت فيه حامية عثمانية، وزيادة الجزية على الدولة البيزنطية {cite:dawlat-uthmaniyya-salabi p. 67}. وبعد نصره في نيكوبوليس طلب من الإمبراطور مانويل تسليم المدينة، فلما امتنع ضرب عليها حصاراً محكماً من نحو سنة 796هـ/1393م حتى أشرفت على السقوط، ثم اضطر إلى فك الحصار لمواجهة خطر تيمورلنك الذي انتهى إلى معركة أنقرة سنة 1402م {cite:dawlat-uthmaniyya-salabi p. 68, 89-90}."
  en: "Before Nicopolis, Sultan Bayezid I imposed on the Byzantine emperor the appointment of a qadi for the Muslims of Constantinople, the building of a mosque, the allocation of seven hundred houses to the Muslim community, and the cession of half the Galata quarter, where an Ottoman garrison was stationed, together with an increased tribute {cite:dawlat-uthmaniyya-salabi p. 67}. After his victory at Nicopolis he demanded that Emperor Manuel surrender the city; on his refusal Bayezid drew a tight blockade around it from about 796/1393 until it was on the verge of falling, then had to lift the siege to face Timur's threat, which ended at the battle of Ankara in 1402 {cite:dawlat-uthmaniyya-salabi p. 68, 89-90}."
  es: "Antes de Nicópolis, el sultán Bayezid I impuso al emperador bizantino el nombramiento de un cadí para los musulmanes de Constantinopla, la construcción de una mezquita, la asignación de setecientas casas a la comunidad musulmana y la cesión de la mitad del barrio de Galata, donde estaba estacionada una guarnición otomana, junto con un tributo aumentado {cite:dawlat-uthmaniyya-salabi p. 67}. Después de su victoria en Nicópolis, exigió al emperador Manuel que entregara la ciudad; ante su negativa, Bayezid estableció un estricto bloqueo a su alrededor desde aproximadamente 796/1393 hasta que estuvo a punto de caer, luego tuvo que levantar el asedio para enfrentar la amenaza de Tamerlán, que terminó en la batalla de Ankara en 1402 {cite:dawlat-uthmaniyya-salabi p. 68, 89-90}."
  fr: "Avant Nicopolis, le sultan Bayezid Ier imposa à l'empereur byzantin la nomination d'un cadi pour les musulmans de Constantinople, la construction d'une mosquée, l'attribution de sept cents maisons à la communauté musulmane et la cession de la moitié du quartier de Galata, où était stationnée une garnison ottomane, ainsi qu'une augmentation du tribut (voir Dawlat-Uthmaniyya-Salabi, p. 67). Après sa victoire à Nicopolis, il exigea de l'empereur Manuel la reddition de la ville; face à son refus, Bayezid imposa un blocus strict autour de Nicopolis d'environ 796/1393 jusqu'à ce qu'elle soit au bord de la chute, puis dut lever le siège pour faire face à la menace de Timour, ce qui prit fin lors de la bataille d'Ankara en 1402 (voir Dawlat-Uthmaniyya-Salabi, p. 68, 89-90)."
  ur: "نیکوپولس سے پہلے، سلطان بایزید اول نے بازنطینی شہنشاہ پر قسطنطنیہ کے مسلمانوں کے لیے ایک قاضی کی تقرری، ایک مسجد کی تعمیر، مسلمانوں کے لیے سات سو مکانات مختص کرنے، اور آدھے گالاٹا کوارٹر کا خاتمہ، جہاں ایک عثمانی چھاؤنی تعینات کی گئی تھی، کو ایک ساتھ بڑھا دیا گیا تھا۔ {حوالہ:دولت عثمانیہ سلبی ص۔ 67}۔ نیکوپولس میں اپنی فتح کے بعد اس نے شہنشاہ مینوئل سے شہر کو ہتھیار ڈالنے کا مطالبہ کیا۔ اس کے انکار پر بایزید نے تقریباً 796/1393 سے اس کے گرد ایک سخت ناکہ بندی کی یہاں تک کہ یہ گرنے کے دہانے پر پہنچ گیا، پھر تیمور کے خطرے کا سامنا کرنے کے لیے محاصرہ اٹھانا پڑا، جو 1402 میں انقرہ کی جنگ پر ختم ہوا۔ 68، 89-90}۔"
