id: event/siege-of-constantinople-1394
class: event
kind: siege
label: { ar: "حصار القسطنطينية (١٣٩٤)", en: "Siege of Constantinople" }
summary:
  ar: "فرض السلطان بايزيد الأول على الإمبراطور البيزنطي قبل معركة نيكوبوليس تعيينَ قاضٍ للمسلمين في القسطنطينية وإنشاء مسجد وتخصيص سبعمئة منزل للجالية الإسلامية والتنازل عن نصف حي غلطة الذي وُضعت فيه حامية عثمانية، وزيادة الجزية على الدولة البيزنطية {cite:dawlat-uthmaniyya-salabi p. 67}. وبعد نصره في نيكوبوليس طلب من الإمبراطور مانويل تسليم المدينة، فلما امتنع ضرب عليها حصاراً محكماً من نحو سنة 796هـ/1393م حتى أشرفت على السقوط، ثم اضطر إلى فك الحصار لمواجهة خطر تيمورلنك الذي انتهى إلى معركة أنقرة سنة 1402م {cite:dawlat-uthmaniyya-salabi p. 68, 89-90}."
  en: "Before Nicopolis, Sultan Bayezid I imposed on the Byzantine emperor the appointment of a qadi for the Muslims of Constantinople, the building of a mosque, the allocation of seven hundred houses to the Muslim community, and the cession of half the Galata quarter, where an Ottoman garrison was stationed, together with an increased tribute {cite:dawlat-uthmaniyya-salabi p. 67}. After his victory at Nicopolis he demanded that Emperor Manuel surrender the city; on his refusal Bayezid drew a tight blockade around it from about 796/1393 until it was on the verge of falling, then had to lift the siege to face Timur's threat, which ended at the battle of Ankara in 1402 {cite:dawlat-uthmaniyya-salabi p. 68, 89-90}."
