summary:
  ar: "انتهى محمد إلى الرور وهي من مدائن السند وهي على جبل فحصرهم أشهراً ففتحها صلحاً على أن لا يقتلهم ولا يعرض لبدهم وقال ما البد إلا ككنائس النصارى واليهود وبيوت نيران المجوس ووضع عليهم الخراج بالرور وبنى مسجداً وسار محمد إلى السكة وهي مدينة دون بياس ففتحها والسكة اليوم خراب."
  en: "Months besieged on its hill, al-Rur yielded by sulh — no killing, no laying hands on their budd, 'for the budd is as the churches of Christians and Jews and the fire-houses of Magians' — kharaj laid and a mosque built; then al-Sikka before Bayas fell, a ruin today."
