id: event/al-rur-sulh
class: event
kind: treaty
label: { ar: "صلح الرور", en: "The Sulh of al-Rur", es: "El Sulh de al-Rur", fr: "Le Sulh d'al-Rur", ur: "الور کی سلح" }
summary:
  ar: "انتهى محمد إلى الرور وهي من مدائن السند وهي على جبل فحصرهم أشهراً ففتحها صلحاً على أن لا يقتلهم ولا يعرض لبدهم وقال ما البد إلا ككنائس النصارى واليهود وبيوت نيران المجوس ووضع عليهم الخراج بالرور وبنى مسجداً وسار محمد إلى السكة وهي مدينة دون بياس ففتحها والسكة اليوم خراب."
  en: "Months besieged on its hill, al-Rur yielded by sulh — no killing, no laying hands on their budd, 'for the budd is as the churches of Christians and Jews and the fire-houses of Magians' — kharaj laid and a mosque built; then al-Sikka before Bayas fell, a ruin today."
  es: "Meses de asedio en su colina, al-Rur cedió por sulh —sin matar, sin poner las manos sobre su budd, 'porque el budd es como las iglesias de los cristianos y los judíos y las casas de fuego de los magos'— se colocó kharaj y se construyó una mezquita; luego al-Sikka antes de Bayas cayó, una ruina hoy."
  fr: "Des mois assiégés sur sa colline, al-Rur céda par sulh — pas de meurtre, pas de mise de la main sur leur budd, « car le budd est comme les églises des chrétiens et des juifs et les maisons de feu des mages » — kharaj fut posé et une mosquée construite; puis al-Sikka avant que Bayas ne tombe, une ruine aujourd'hui."
  ur: "مہینوں تک اس کی پہاڑی پر محاصرہ کیا گیا، الرور کو سلح نے حاصل کیا - کوئی قتل نہیں، ان کے بڈ پر ہاتھ نہیں رکھنا، 'کیونکہ بڈ عیسائیوں اور یہودیوں کے گرجا گھروں اور مجوسیوں کے آتش گاہوں کی طرح ہے' - خراج بچھایا گیا اور ایک مسجد تعمیر کی گئی۔ پھر بیاس کے گرنے سے پہلے السیکا، آج ایک کھنڈر۔"
