kind: conquest
label: { ar: "سقوط ميورقة بيد الروم", en: "The fall of Majorca to the Rum", es: "La caída de Mallorca ante el ron", fr: "La chute de Majorque aux mains du rhum", ur: "مجورکا کا رم پر گرنا", tr: "Mayorka Romalıların eline geçti", id: "Majorca jatuh ke tangan Romawi." }
summary:
  ar: "أخذت ميورقة يوم الاثنين الرابع عشر من صفر سنة سبع وعشرين وستمائة عند ابن الأبار {cite:nafh-tib-maqqari p. 473}. وقال المخزومي في تاريخ ميورقة: إن سبب أخذها أن أميرها محمد بن علي بن موسى وليها سنة ست وستمائة فأنفذ طريدة بحرية وقطعة حربية احتياجاً للحشب فأخذها والي طرطوشة، فحدث نفسه بالغزو لبلاد الروم وكان ذلك رأياً مشؤوماً؛ وأخذ ولده مسطحاً من برشلونة فأخذ الروم على ملكهم العهد وجمعوا عشرين ألفاً من أهل البلاد وستة عشر ألفاً في البحر سنة ست وعشرين، وضرب الوالي أعناق أربعة من كبراء مصر فيهم ابنا خاله فاجتمعت الرعية إلى ابن سيري على طلب الثأر؛ ووقع المصاف يوم الاثنين الثامن عشر من شوال فانهزم المسلمون ونزل النصارى على الحريبة الحزينة من جهة باب الكحل، ولما كان يوم الأحد أخذ البلد وأخذ منه أربعة وعشرون ألفاً قتلوا على دم واحد وأخذ الوالي فعذب وعاش بعد ذلك خمسة وأربعين يوماً ومات تحت {cite:nafh-tib-maqqari p. 473-475}."
  en: "The conquest of Majorca (Safar 627/Dec 1229): when its governor raided the mainland for timber and seized a Barcelona flat-bottom, James I bound his barons by oath and gathered twenty thousand ashore and sixteen thousand by sea; the rout on Monday 18 Shawwal opened the walls, the city was stormed on Sunday, and twenty-four thousand were killed 'on one account' while the governor was taken and tortured to death after forty-five days {cite:nafh-tib-maqqari p. 473-475}."
  es: "La conquista de Mallorca (Safar 627/dic 1229): cuando su gobernador saqueó la península en busca de madera y se apoderó de un barco de fondo plano de Barcelona, Jaime I obligó a sus barones bajo juramento y reunió a veinte mil hombres en tierra y dieciséis mil por mar; la derrota del lunes 18 de Shawwal abrió las murallas, la ciudad fue asaltada el domingo y veinticuatro mil fueron asesinados \"por una sola causa\", mientras que el gobernador fue capturado y torturado hasta la muerte después de cuarenta y cinco días {cite:nafh-tib-maqqari p. 473-475}."
  fr: "La conquête de Majorque (Safar 627/décembre 1229): lorsque son gouverneur pilla le continent pour du bois et s'empara d'un bateau à fond plat de Barcelone, Jacques Ier lia ses barons par serment et rassembla vingt mille hommes à terre et seize mille par mer; la déroute du lundi 18 Shawwal ouvrit les murs, la ville fut prise d'assaut le dimanche et vingt-quatre mille furent tués « d'un seul coup » tandis que le gouverneur fut capturé et torturé à mort après quarante-cinq jours {cite: nafh-tib-maqqari p. 473-475}."
  ur: "میجرکا کی فتح ⁦(صفر 627/دسمبر 1229)⁩: جب اس کے گورنر نے لکڑی کے لیے سرزمین پر چھاپہ مارا اور بارسلونا کے ایک فلیٹ باٹم پر قبضہ کر لیا، تو جیمز اول نے اپنے بیرنز کو حلف کے ذریعے باندھا اور بیس ہزار ساحل پر اور سولہ ہزار سمندری راستے سے جمع کیے؛ سوموار 18 شوال کو راستے کی دیواریں کھل گئیں، اتوار کو شہر پر دھاوا بول دیا گیا، اور 24 ہزار 'ایک وجہ سے' مارے گئے جب کہ گورنر کو پینتالیس دن کے بعد لے جا کر تشدد کا نشانہ بنایا گیا۔ 473-475}۔"
  tr: "İbn el-Abbar'a göre Mayorka, 627 yılında Safar ayının on dördüncü Pazartesi günü ele geçirildi (kaynak: nafh-tib-maqqari, s. 473). El-Makhzumi, Mayorka tarihinde şöyle demiştir: Ele geçirilmesinin sebebi, emiri Muhammed ibn Ali ibn Musa'nın 606 yılında yönetimi ele geçirmesi ve kereste ihtiyacı olan bir savaş gemisiyle bir deniz seferi göndermesiydi. Bunun üzerine Tortosa valisi şehri ele geçirdi ve Roma topraklarına baskın yapmayı düşündü; bu da uğursuz bir düşünceydi. Oğlu da Barselona'dan Mistah'ı aldı. Bunun üzerine Romalılar krallarından rehin alarak 26 yılında ülke halkından 20.000, denizden ise 16.000 asker topladılar. Vali, aralarında iki kuzeninin de bulunduğu Mısır'ın dört ileri gelenini idam ettirdi. Bunun üzerine halk, intikam almak için İbn Siri'nin yanına toplandı. Savaş, Şevval ayının on sekizinci günü olan Pazartesi günü gerçekleşti ve Müslümanlar yenildi. Hristiyanlar, Bab el-Kuhl yönünden Hariba şehrine saldırdılar. Pazar günü şehir ele geçirildi ve yirmi dört bin kişi şehirden alındı; hepsi tek bir kanlı çatışmada öldürüldü. Vali yakalandı ve işkence gördü; bundan sonra kırk beş gün yaşadı ve öldü. {Kaynak: Nafh-tib-makqari, s. 473-475}"
  id: "Majorca direbut pada hari Senin, tanggal empat belas Safar, tahun enam ratus dua puluh tujuh, menurut Ibn al-Abbar {kutip:nafh-tib-maqqari hlm. 473}. Al-Makhzumi berkata dalam sejarah Majorca: Alasan penaklukannya adalah karena emirnya, Muhammad ibn Ali ibn Musa, mengambil alih kekuasaannya pada tahun enam ratus enam, dan ia mengirim ekspedisi angkatan laut dan kapal perang yang membutuhkan kayu, sehingga gubernur Tortosa merebutnya, dan ia mempertimbangkan untuk menyerang wilayah Romawi, dan itu adalah pendapat yang buruk; dan putranya merebut Mistah dari Barcelona, maka orang Romawi mengambil sumpah dari raja mereka dan mengumpulkan dua puluh ribu orang dari penduduk negeri dan enam belas ribu orang di laut pada tahun dua puluh enam, dan gubernur memenggal kepala empat tokoh terkemuka Mesir, di antaranya dua sepupunya, sehingga orang-orang berkumpul kepada Ibn Siri untuk membalas dendam; Pertempuran terjadi pada hari Senin, tanggal delapan belas bulan Syawal, dan kaum Muslim dikalahkan. Orang-orang Kristen menyerbu Sad al-Hariba dari arah Bab al-Kuhl. Pada hari Minggu, kota itu direbut, dan dua puluh empat ribu orang dibawa dari sana, semuanya dibunuh dalam satu pertumpahan darah. Gubernur ditangkap dan disiksa, dan dia hidup selama empat puluh lima hari setelah itu dan meninggal di bawah {cite:nafh-tib-maqqari hlm. 473-475}."
