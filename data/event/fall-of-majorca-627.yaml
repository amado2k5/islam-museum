label: { ar: "سقوط ميورقة بيد الروم" }
summary:
  ar: "أخذت ميورقة يوم الاثنين الرابع عشر من صفر سنة سبع وعشرين وستمائة عند ابن الأبار {cite:nafh-tib-maqqari p. 473}. وقال المخزومي في تاريخ ميورقة: إن سبب أخذها أن أميرها محمد بن علي بن موسى وليها سنة ست وستمائة فأنفذ طريدة بحرية وقطعة حربية احتياجاً للحشب فأخذها والي طرطوشة، فحدث نفسه بالغزو لبلاد الروم وكان ذلك رأياً مشؤوماً؛ وأخذ ولده مسطحاً من برشلونة فأخذ الروم على ملكهم العهد وجمعوا عشرين ألفاً من أهل البلاد وستة عشر ألفاً في البحر سنة ست وعشرين، وضرب الوالي أعناق أربعة من كبراء مصر فيهم ابنا خاله فاجتمعت الرعية إلى ابن سيري على طلب الثأر؛ ووقع المصاف يوم الاثنين الثامن عشر من شوال فانهزم المسلمون ونزل النصارى على الحريبة الحزينة من جهة باب الكحل، ولما كان يوم الأحد أخذ البلد وأخذ منه أربعة وعشرون ألفاً قتلوا على دم واحد وأخذ الوالي فعذب وعاش بعد ذلك خمسة وأربعين يوماً ومات تحت {cite:nafh-tib-maqqari p. 473-475}."
  en: "The conquest of Majorca (Safar 627/Dec 1229): when its governor raided the mainland for timber and seized a Barcelona flat-bottom, James I bound his barons by oath and gathered twenty thousand ashore and sixteen thousand by sea; the rout on Monday 18 Shawwal opened the walls, the city was stormed on Sunday, and twenty-four thousand were killed 'on one account' while the governor was taken and tortured to death after forty-five days {cite:nafh-tib-maqqari p. 473-475}."
