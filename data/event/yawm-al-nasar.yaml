id: event/yawm-al-nasar
class: event
kind: battle
label: { ar: "يوم النسار", en: "The Day of al-Nasar", es: "El día de al-Nasar", fr: "Le jour d'al-Nasar", ur: "یوم الناصر", tr: "Kartal Günü", id: "Hari Elang" }
summary:
  ar: "يوم النسار عند جبال متجاورة يقال لها النسار؛ سببه أن بني تميم كانوا يأكلون عمومتهم ضبة بن أد وبني عبد مناة فلما أصابت ضبة رهطاً من تميم طلبتهم تميم فانزاحت الرباب — تيم وعدي وثور وعكل وعبد مناة وضبة وإنما سموا الرباب لأنهم غمسوا أيديهم في الرب حين تحالفوا — فلحقت ببني أسد حلفاء بني ذبيان، فنادى صارخ بن ضبة «يا آل خندف» فأصرختهم بنو أسد وهو أول يوم تخندفت فيه ضبة واستمدوا حليفهم ظبياً وغطفان، وكان على الجماعة حصن بن حذيفة بن بدر، واستمدت تميم بني عامر بن صعصعة فالتقى الجمعان بالنسار فصبرت عامر واستحر بهم القتل وقتل شريح القشيري رأسها وعبيد بن معاوية الكلابي، وأخذت عدة من أشراف نساء بني عامر منهن سلمى بنت المخلف والعنقاء بنت همام، وفيه يقول زهير بن أبي سلمى «ومن مثل حصن في الحروب ومثله لإنداد ضيم أو لأمر يحاوله» {cite:kamil-ibn-al-athir p. 465}."
  en: "The day of al-Nasar: when Tamim pressed their 'paternal' claims on Dabba and Abd Manat, Dabba raised for the first time the cry 'ya Al Khindif' — the federation-name — and the Rabbab confederates (dipped in rubb-pitch at their pact) joined Asad and Ghatafan under Husayn ibn Hudhayfa; Tamim and Banu Amir broke, their chief Shurayh al-Qushayri fell, and noblewomen of Amir were taken, Salma bint al-Mukhallaf among them {cite:kamil-ibn-al-athir p. 465}."
  es: "El día de al-Nasar: cuando Tamim presionó sus reclamos \"paternales\" sobre Dabba y Abd Manat, Dabba lanzó por primera vez el grito \"ya Al Khindif\" —el nombre de la federación— y los confederados de Rabbab (sumergidos en brea de rubb en su pacto) se unieron a Asad y Ghatafan bajo Husayn ibn Hudhayfa; Tamim y Banu Amir se separaron, su jefe Shurayh al-Qushayri cayó, y mujeres nobles de Amir fueron tomadas, entre ellas Salma bint al-Mukhallaf {cite:kamil-ibn-al-athir p. 465}."
  fr: "Le jour d'al-Nasar: lorsque Tamim a insisté sur ses revendications « paternelles » sur Dabba et Abd Manat, Dabba a lancé pour la première fois le cri « ya Al Khindif » — le nom de la fédération — et les confédérés de Rabbab (trempés dans du goudron lors de leur pacte) ont rejoint Asad et Ghatafan sous Husayn ibn Hudhayfa; Tamim et Banu Amir se sont séparés, leur chef Shurayh al-Qushayri est tombé, et des femmes nobles d'Amir ont été capturées, Salma bint al-Mukhallaf parmi elles {cite:kamil-ibn-al-athir p. 465}."
  ur: "الناصر کا دن: جب تمیم نے دبہ اور عبد منات پر اپنے 'والدین' دعووں کو دبایا تو دبہ نے پہلی بار پکارا 'یا الخندف' - فیڈریشن کا نام - اور رباب کنفیڈریٹس ⁦(اپنے معاہدے پر رباب پچ میں ڈوبے ہوئے)⁩ حسینی کے ماتحت اسد اور غطفان میں شامل ہوئے۔ تمیم اور بنو عامر ٹوٹ گئے، ان کے سردار شریح القشیری گر گئے اور امیر کی بزرگ خواتین کو لے لیا گیا، ان میں سلمہ بنت المخلف بھی شامل ہیں۔ 465}۔"
  tr: "Nisar günü, Nisar adı verilen bitişik dağların yakınlarında; bunun sebebi, Beni Tamim kabilesinin amcaları Dabba ibn Ad ve Beni Abd Manat'ı yiyor olmalarıydı. Dabba, Tamim kabilesine saldırdığında, Tamim kabilesi onları aradı ve böylece Rabab kabilesi (Taym, Adi, Thawr, Ukl, Abd Manat ve Dabba) yerlerinden edildi. Onlara Rabab denmesinin sebebi, ittifak kurarken ellerini suya batırmalarıydı. Beni Dhubyan'ın müttefikleri olan Beni Asad kabilesine katıldılar. Sonra Dabba'dan bir tellal, \"Ey Khindif halkı!\" diye seslendi. Bunun üzerine Beni Asad kabilesi onlara seslendi ve bu, Dabba'nın Khindif kabilesiyle ittifak kurduğu ilk gündü. Müttefikleri Dhubyan ve Ghatafan'dan yardım istediler. Grubun lideri Hisn ibn Hudhayfa ibn Badr idi. Tamim kabilesi ise Beni Amir ibn Sa'sa'a'dan yardım istedi. İki ordu Nisar'da karşılaştı ve Amir direndi, aralarındaki çatışmalar şiddetlendi. Şurayh el-Kuşeyri, liderleri Ubeyd ibn Mu'aviye el-Kilabi'yi öldürdü. Beni Amir'in soylu kadınlarından Salma bint el-Muhlif ve el-Anka bint Hammam da dahil olmak üzere birçok kadın esir alındı. Zuhayr ibn Abi Salma bu konuda şöyle dedi: \"Savaşlarda Hisn gibisi, haksızlığa karşı çıkmada veya bir konuda girişimde bulunmada onun gibisi kimdir?\" {kaynak: Kamil ibn el-Athir s. 465}."
  id: "Pada hari Al-Nisar, di dekat pegunungan yang berdekatan yang disebut Al-Nisar; alasannya adalah karena Bani Tamim sedang memakan paman mereka, Dabba ibn Ad dan Bani Abd Manat. Ketika Dabba menyerang sekelompok Tamim, Tamim mencari mereka, sehingga Rabab—Taym, Adi, Thawr, Ukl, Abd Manat, dan Dabba—diusir. Mereka disebut Rabab karena mereka mencelupkan tangan mereka ke dalam air ketika mereka bersekutu. Mereka bergabung dengan Bani Asad, sekutu Bani Dhubyan. Kemudian seorang penyeru dari Dabba berseru, “Wahai penduduk Khindif!” Maka Bani Asad berseru kepada mereka, dan inilah hari pertama Dabba bersekutu dengan Khindif. Mereka meminta bantuan dari sekutu mereka, Dhubyan dan Ghatafan. Pemimpin kelompok itu adalah Hisn ibn Hudhayfa ibn Badr. Tamim meminta bantuan dari Banu Amir ibn Sa’sa’a. Kedua pasukan bertemu di Nisar, dan Amir bertahan, dan pembunuhan semakin intensif di antara mereka. Shurayh al-Qushayri membunuh pemimpinnya, Ubayd ibn Mu’awiya al-Kilabi. Beberapa wanita bangsawan dari Banu Amir ditawan, termasuk Salma bint al-Mukhlif dan al-Anqa’ bint Hammam. Zuhayr ibn Abi Salma berkata tentang hal ini, “Siapa yang seperti Hisn dalam peperangan, dan seperti dia dalam menentang ketidakadilan atau untuk suatu perkara yang dia perjuangkan?” {cite:kamil-ibn-al-athir p. 465}."
