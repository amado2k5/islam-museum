id: event/ibn-abbad-al-akili-comes-and-banu-kulayb-ask-safety-for-him-290
class: event
kind: other
label:
  ar: "قدوم ابن عباد الأكيلي من قبل آل طريف وطلب بني كليب الأمان له من الهادي، 290هـ"
  en: "Ibn Abbad al-Akili comes from Al Tarif's side and Banu Kulayb ask al-Hadi for safety for him, 290 AH"
  ur: "ابن عباد اکیلی کا آل طریف کی طرف سے آنا اور بنو کلیب کا ہادی سے اس کے لیے امان مانگنا، 290ھ"
  es: "Ibn Abbad al-Akili viene del lado de Al Tarif y los Banu Kulayb piden a al-Hadi que lo proteja, 290 AH"
  fr: "Ibn Abbad al-Akili arrive du côté d'Al-Tari et les Banu Kulayb demandent à al-Hadi de le protéger (290 AH)."
  tr: "İbn Abbad el-Akili'nin Al Tarif ailesi adına gelişi ve Beni Kulayb'ın onun için el-Hadi'den güvenli geçiş talebi, Hicri 290"
  id: "Kedatangan Ibnu Abbas al-Akili atas nama keluarga Al Tarif dan permintaan Bani Kulayb untuk perjalanan aman baginya dari al-Hadi, 290 H."
summary:
  ar: "قدم ابن عباد الأكيلي من قبل آل طريف حتى صار إلى المعروف، فأرسل الهادي إلى بني كليب يذكّرهم أنه آمنهم على ألا يدخل هذا الرجل بينهم، فقدمت إليه بنو كليب بأجمعها وطلبت الأمان لابن عباد فأجابهم، فقدموا به إليه، فصرف العسكر الذين كانوا معه وأمره بالعودة إلى الموضع الذي كان فيه."
  en: "Ibn Abbad al-Akili came from Al Tarif's side as far as al-Ma'ruf, and al-Hadi sent to Banu Kulayb reminding them that he had given them safety on condition that this man not enter among them; Banu Kulayb came to him in a body and asked safety for Ibn Abbad, he agreed, they brought him, and he sent away the army that was with him and told him to go back to the place where he had been."
  ur: "ابن عباد اکیلی آل طریف کی طرف سے آیا یہاں تک کہ المعروف پہنچا، تو ہادی نے بنو کلیب کو پیغام بھیجا کہ انہوں نے انہیں اس شرط پر امان دی تھی کہ یہ شخص ان کے بیچ نہ آئے؛ بنو کلیب سب مل کر ان کے پاس آئے اور ابن عباد کے لیے امان مانگی، انہوں نے مان لی، وہ اسے ان کے پاس لائے، تو ہادی نے اس کے ساتھ آئے لشکر کو رخصت کیا اور اسے حکم دیا کہ جہاں تھا وہاں لوٹ جائے۔"
  es: "Ibn Abbad al-Akili llegó desde el lado de Al Tarif hasta al-Ma'ruf, y al-Hadi envió un mensajero a Banu Kulayb recordándoles que les había dado seguridad con la condición de que este hombre no entrara entre ellos; Banu Kulayb acudió a él en grupo y pidió seguridad para Ibn Abbad, él accedió, lo trajeron, y él despidió al ejército que lo acompañaba y le dijo que volviera al lugar donde había estado."
  fr: "Ibn Abbad al-Akili vint du côté d'Al Tarif jusqu'à al-Ma'ruf, et al-Hadi envoya un messager aux Banu Kulayb leur rappelant qu'il leur avait accordé la sécurité à condition que cet homme n'entre pas parmi eux; les Banu Kulayb vinrent à lui en groupe et demandèrent la sécurité pour Ibn Abbad, il accepta, ils l'amenèrent, et il renvoya l'armée qui l'accompagnait et lui dit de retourner à l'endroit où il se trouvait."
  tr: "İbn Abbad el-Akili, tanınıncaya kadar Tarif ailesinden geliyordu. El-Hadi, Beni Kulayb'a, bu adamın aralarına girmemesi şartıyla kendilerine güvence verdiğini hatırlatan bir elçi gönderdi. Beni Kulayb'ın tamamı ona geldi ve İbn Abbad için güvence istedi, o da kabul etti. Onu yanına getirdiler, o da yanındaki orduyu dağıttı ve bulunduğu yere geri dönmesini emretti."
  id: "Ibn Abbad al-Akili berasal dari keluarga Al Tarif hingga ia dikenal luas. Al-Hadi mengirim utusan kepada Bani Kulayb untuk mengingatkan mereka bahwa ia telah memberi mereka perlindungan dengan syarat bahwa orang ini tidak akan memasuki wilayah mereka. Bani Kulayb datang kepadanya secara keseluruhan dan meminta perlindungan untuk Ibn Abbad, sehingga ia menyetujuinya. Mereka membawanya kepadanya, lalu ia membubarkan pasukan yang bersamanya dan memerintahkannya untuk kembali ke tempat asalnya."
