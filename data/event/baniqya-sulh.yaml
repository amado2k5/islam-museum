kind: treaty
label: { ar: "صلح بانقيا والطيلسان", en: "The Peace of Baniqya and the Taylasan" }
summary:
  ar: "عند البلاذري: بعث خالد بن الوليد بشير بن سعد الأنصاري إلى بانقيا فلقيته خيل الأعاجم عليها فرخبنذاذ فرشقوا من معه بالسهام وحمل عليهم فهزمهم وقتل فرخبنذاذ ثم انصرف وبه جراحة انتقضت به وهو بعين التمر فمات منها ويقال إن خالداً لقي فرخبنذاذ بنفسه وبشير معه ثم بعث خالد جرير بن عبد الله البجلي إلى أهل بانقيا فخرج إليه بصبهرى بن صلوبا فاعتذر من القتال وعرض الصلح فصالحه جرير على ألف درهم وطيلسان ويقال إن ابن صلوبا أتى خالداً فاعتذر وصالحه هذا الصلح فلما قتل مهران ومضى يوم التخيلة أنّاهم جرير فقبض منهم ومن أهل الحيرة صلحهم وكتب لهم كتاباً بقبض ذلك وقوم ينكرون أن يكون جرير قدم العراق إلا في خلافة عمر وكان أبو مخنف والواقدي يقولان قدمها مرتين وكتب خالد بصبهرى بن صلوبا كتاباً ووجّه إلى أبي بكر بالطيلسان مع مال الحيرة وبالألف درهم فوهب الطيلسان للحسين بن علي. وحدثه أبو نصر التمار عن شريك النخعي عن الحجاج بن أرطاة عن الحكم عن عبد الله بن مغفل المزني: ليس لأهل السواد عهد إلا الحيرة وألّيس وبانقيا."
  en: "In al-Baladhuri: Khalid ibn al-Walid sent Bashir ibn Sa'd al-Ansari to Baniqya; Persian cavalry under Farrukhbandadh met him, shot his men, he charged, routed them and killed Farrukhbandadh, returning wounded — the wound relapsed at Ayn al-Tamr and he died of it, though it is said Khalid himself met Farrukhbandadh with Bashir beside him. Then Khalid sent Jarir ibn Abdallah al-Bajali to Baniqya's people; Busbuhra ibn Saluba came out, excused himself from fighting and offered peace — Jarir made peace on a thousand dirhams and a taylasan, though it is said Ibn Saluba came to Khalid himself for this peace. When Mihran was killed and the day of al-Tukhayla passed, Jarir called them to account and collected their and al-Hira's peace-money, writing them a receipt — though some deny Jarir came to Iraq before Umar's caliphate, Abu Mikhnaf and al-Waqidi holding he came twice. Khalid wrote Busbuhra a document and sent the taylasan with Hira's money and the thousand dirhams to Abu Bakr — who gifted the taylasan to al-Husayn ibn Ali. And via Abu Nasr al-Tammar via Sharik al-Nakha'i via al-Hajjaj ibn Arta' via al-Hakam via Abdallah ibn Mughaffal al-Muzani: 'the Sawad's people have no covenant save al-Hira, Ulays and Baniqya.'"
