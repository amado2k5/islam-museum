label: { ar: "صلح بانقيا والطيلسان", en: "The Peace of Baniqya and the Taylasan", fr: "La paix de Baniqya et le taylasan", es: "La paz de Baniqya y el Taylasan", ur: "بنقیہ اور طیلسان کا امن", tr: "Banqia Barışı ve Sarık", id: "Kedamaian Banqia dan sorban" }
summary:
  ar: "عند البلاذري: بعث خالد بن الوليد بشير بن سعد الأنصاري إلى بانقيا فلقيته خيل الأعاجم عليها فرخبنذاذ فرشقوا من معه بالسهام وحمل عليهم فهزمهم وقتل فرخبنذاذ ثم انصرف وبه جراحة انتقضت به وهو بعين التمر فمات منها ويقال إن خالداً لقي فرخبنذاذ بنفسه وبشير معه ثم بعث خالد جرير بن عبد الله البجلي إلى أهل بانقيا فخرج إليه بصبهرى بن صلوبا فاعتذر من القتال وعرض الصلح فصالحه جرير على ألف درهم وطيلسان ويقال إن ابن صلوبا أتى خالداً فاعتذر وصالحه هذا الصلح فلما قتل مهران ومضى يوم التخيلة أنّاهم جرير فقبض منهم ومن أهل الحيرة صلحهم وكتب لهم كتاباً بقبض ذلك وقوم ينكرون أن يكون جرير قدم العراق إلا في خلافة عمر وكان أبو مخنف والواقدي يقولان قدمها مرتين وكتب خالد بصبهرى بن صلوبا كتاباً ووجّه إلى أبي بكر بالطيلسان مع مال الحيرة وبالألف درهم فوهب الطيلسان للحسين بن علي. وحدثه أبو نصر التمار عن شريك النخعي عن الحجاج بن أرطاة عن الحكم عن عبد الله بن مغفل المزني: ليس لأهل السواد عهد إلا الحيرة وألّيس وبانقيا."
  en: "In al-Baladhuri: Khalid ibn al-Walid sent Bashir ibn Sa'd al-Ansari to Baniqya; Persian cavalry under Farrukhbandadh met him, shot his men, he charged, routed them and killed Farrukhbandadh, returning wounded — the wound relapsed at Ayn al-Tamr and he died of it, though it is said Khalid himself met Farrukhbandadh with Bashir beside him. Then Khalid sent Jarir ibn Abdallah al-Bajali to Baniqya's people; Busbuhra ibn Saluba came out, excused himself from fighting and offered peace — Jarir made peace on a thousand dirhams and a taylasan, though it is said Ibn Saluba came to Khalid himself for this peace. When Mihran was killed and the day of al-Tukhayla passed, Jarir called them to account and collected their and al-Hira's peace-money, writing them a receipt — though some deny Jarir came to Iraq before Umar's caliphate, Abu Mikhnaf and al-Waqidi holding he came twice. Khalid wrote Busbuhra a document and sent the taylasan with Hira's money and the thousand dirhams to Abu Bakr — who gifted the taylasan to al-Husayn ibn Ali. And via Abu Nasr al-Tammar via Sharik al-Nakha'i via al-Hajjaj ibn Arta' via al-Hakam via Abdallah ibn Mughaffal al-Muzani: 'the Sawad's people have no covenant save al-Hira, Ulays and Baniqya.'"
  fr: "Chez al-Baladhuri : Khalid ibn al-Walid envoya Bashir ibn Sa'd al-Ansari à Baniqya ; une cavalerie perse sous Farrukhbandadh le rencontra et cribla ses hommes de flèches ; il chargea, les mit en déroute et tua Farrukhbandadh, revenant blessé ; la blessure se rouvrit à Ayn al-Tamr et il en mourut, bien que l'on dise que Khalid lui-même affronta Farrukhbandadh, Bashir à ses côtés. Puis Khalid envoya Jarir ibn Abdallah al-Bajali aux gens de Baniqya ; Busbuhra ibn Saluba sortit, s'excusa de ne pas combattre et proposa la paix ; Jarir fit la paix pour mille dirhams et un taylasan, bien que l'on dise qu'Ibn Saluba vint lui-même trouver Khalid pour cette paix. Quand Mihran fut tué et que passa la journée d'al-Tukhayla, Jarir leur demanda des comptes et perçut leur tribut de paix et celui d'al-Hira, leur en donnant quittance, bien que certains nient que Jarir soit venu en Irak avant le califat d'Umar, Abu Mikhnaf et al-Waqidi soutenant qu'il vint deux fois. Khalid écrivit à Busbuhra un document et envoya le taylasan, avec l'argent d'al-Hira et les mille dirhams, à Abu Bakr, qui offrit le taylasan à al-Husayn ibn Ali. Et par Abu Nasr al-Tammar, par Sharik al-Nakha'i, par al-Hajjaj ibn Arta', par al-Hakam, par Abdallah ibn Mughaffal al-Muzani : « les gens du Sawad n'ont pas de pacte, sauf al-Hira, Ulays et Baniqya. »"
  es: "En al-Baladhuri: Khalid ibn al-Walid envió a Bashir ibn Sa'd al-Ansari a Baniqya; la caballería persa al mando de Farrukhbandadh lo recibió, disparó contra sus hombres, cargó, los derrotó y mató a Farrukhbandadh, regresando herido; la herida reapareció en Ayn al-Tamr y murió a causa de ella, aunque se dice que el propio Khalid se enfrentó a Farrukhbandadh con Bashir a su lado. Entonces Khalid envió a Jarir ibn Abdallah al-Bajali a la gente de Baniqya; Busbuhra ibn Saluba salió, se excusó de luchar y ofreció la paz; Jarir hizo la paz por mil dirhams y un taylasan, aunque se dice que Ibn Saluba fue a ver a Khalid personalmente para esta paz. Cuando Mihran fue asesinado y pasó el día de al-Tukhayla, Jarir les pidió cuentas y cobró el dinero de la paz de ellos y de al-Hira, extendiéndoles un recibo; aunque algunos niegan que Jarir haya estado en Irak antes del califato de Umar, Abu Mikhnaf y al-Waqidi sostienen que estuvo dos veces. Khalid escribió un documento a Busbuhra y envió el taylasan con el dinero de Hira y los mil dirhams a Abu Bakr, quien regaló el taylasan a al-Husayn ibn Ali. Y a través de Abu Nasr al-Tammar, a través de Sharik al-Nakha'i, a través de al-Hajjaj ibn Arta', a través de al-Hakam, a través de Abdallah ibn Mughaffal al-Muzani: «La gente de Sawad no tiene otro pacto que al-Hira, Ulays y Baniqya»."
  ur: "البلادوری میں ہے: خالد بن الولید نے بشیر بن سعد الانصاری کو بنقیہ بھیجا؛ فرخ بندھ کے ماتحت فارسی گھڑسوار دستے نے اس سے ملاقات کی، اس کے آدمیوں کو گولی مار دی، اس نے الزام لگایا، ان کو بھگا دیا اور فرخ بندھ کو مار ڈالا، زخمی واپس لوٹا - عین التمر میں زخم دوبارہ لگا اور وہ اس کی وجہ سے مر گیا، حالانکہ کہا جاتا ہے کہ خالد خود فرخ بندھ سے بشیر کے ساتھ ملا تھا۔ پھر خالد نے جریر بن عبداللہ البجلی کو بنقیہ کے لوگوں کے پاس بھیجا۔ بسبہرہ بن سلوبہ باہر نکلا، لڑائی سے عذر کیا اور صلح کی پیشکش کی - جریر نے ایک ہزار درہم اور طیلسان پر صلح کی، حالانکہ کہا جاتا ہے کہ اس صلح کے لیے ابن سلوبہ خود خالد کے پاس آیا تھا۔ جب مہران کو قتل کیا گیا اور التخائلہ کا دن گزر گیا تو جریر نے ان سے حساب کتاب کیا اور ان کی اور الحیرہ کی امانت کی رقم جمع کی اور انہیں ایک رسید لکھی - حالانکہ بعض اس بات سے انکار کرتے ہیں کہ جریر عمر کی خلافت سے پہلے عراق آئے تھے، ابو مخنف اور الواقدی کے پاس وہ دو بار آئے تھے۔ خالد نے بسبہرہ کو ایک دستاویز لکھی اور حیرہ کی رقم اور ہزار درہم کے ساتھ طلسان ابوبکر کو بھیجا - جس نے یہ طلسان الحسین ابن علی کو تحفہ میں دیا۔ اور ابو نصر التمر کے ذریعے شرق النخعی کے ذریعے الحجاج ابن ارطہ کے ذریعے الحکم کے ذریعے عبد اللہ ابن مغفل المزانی کے ذریعے: 'سواد کے لوگوں کا کوئی عہد نہیں ہے سوائے حیرہ، اولیٰ اور بنقیہ کے۔'"
  tr: "El-Baladhuri'ye göre: Halid ibn el-Velid, Beşir ibn Sa'd el-Ensari'yi Bankiye'ye gönderdi. Orada Farrukhbandhadh liderliğindeki bir Pers süvari birliğiyle karşılaştı ve Farrukhbandhadh, adamlarına ok yağdırdı. Beşir onlara saldırdı, onları yendi ve Farrukhbandhadh'ı öldürdü. Daha sonra Ayn el-Tamr'da yeniden açılan bir yarayla geri döndü ve daha sonra bu yaradan öldü. Halid'in kendisinin de Beşir ile birlikte Farrukhbandhadh ile karşılaştığı söylenir. Halid daha sonra Cerir ibn Abdullah el-Bajali'yi Bankiye halkına gönderdi. Sabhari ibn Saluba onu karşılamaya geldi ve savaş için özür dileyerek barış teklif etti. Cerir, bin dirhem ve bir pelerin karşılığında onunla barıştı. İbn Saluba'nın da Halid'e gelip özür dilediği ve bu barış anlaşmasını yaptığı söylenir. Mihran öldürüldüğünde ve savaş günü geçtiğinde, Cerir onlara geri döndü ve onlardan ve Hira halkından barış tekliflerini topladı ve teslim aldığını teyit eden bir belge yazdı. Bazıları Cerir'in Ömer'in halifeliği dönemi dışında Irak'a hiç gelmediğini iddia eder. Ebu Mikhnaf ve el-Vakidi ise iki kez geldiğini söyler. Halid, Sabhari ibn Saluba'ya bir mektup yazdı ve Hira'dan gelen para ve bin dirhemle birlikte pelerini Ebu Bekir'e gönderdi. Ebu Bekir daha sonra pelerini Hüseyin ibn Ali'ye hediye etti. Ebu Nasr el-Tammar, Şarik el-Nakha'i'den, o da el-Haccac ibn Artat'tan, o da el-Hakam'dan, o da Abdullah ibn Muğaffal el-Muzani'den rivayetle şöyle dedi: Sawad halkının Hira, Ali ve Banqiya dışında hiçbir ahdi yoktur."
  id: "Menurut al-Baladhuri: Khalid ibn al-Walid mengutus Bashir ibn Sa'd al-Ansari ke Banqiya. Ia bertemu dengan pasukan kavaleri Persia yang dipimpin oleh Farrukhbandhadh, yang menghujani pasukannya dengan panah. Bashir menyerang mereka, mengalahkan mereka, dan membunuh Farrukhbandhadh. Kemudian ia kembali, menderita luka yang terbuka kembali saat berada di 'Ayn al-Tamr, yang kemudian menyebabkan kematiannya. Dikatakan bahwa Khalid sendiri bertemu dengan Farrukhbandhadh, dengan Bashir menyertainya. Khalid kemudian mengutus Jarir ibn 'Abd Allah al-Bajali kepada penduduk Banqiya. Sabhari ibn Saluba keluar untuk menemuinya dan meminta maaf atas pertempuran tersebut, menawarkan perdamaian. Jarir berdamai dengannya dengan imbalan seribu dirham dan sebuah jubah. Dikatakan juga bahwa Ibn Saluba datang kepada Khalid, meminta maaf, dan membuat perjanjian perdamaian ini. Ketika Mihran terbunuh dan hari pertempuran telah berlalu, Jarir kembali kepada mereka dan mengumpulkan persembahan perdamaian dari mereka dan penduduk Hira, menuliskan sebuah dokumen yang mengkonfirmasi penerimaan tersebut. Sebagian orang menyangkal bahwa Jarir pernah datang ke Irak kecuali pada masa kekhalifahan Umar. Abu Mikhnaf dan al-Waqidi mengatakan bahwa ia datang dua kali. Khalid menulis surat kepada Sabhari ibn Saluba dan mengirimkan jubah tersebut, bersama dengan uang dari Hira dan seribu dirham, kepada Abu Bakr. Abu Bakr kemudian menghadiahkan jubah tersebut kepada al-Husayn ibn Ali. Abu Nasr al-Tammar menceritakan kepadanya berdasarkan riwayat dari Sharik al-Nakha’i, al-Hajjaj ibn Artat, al-Hakam, dan Abdullah ibn Mughaffal al-Muzani: Penduduk Sawad tidak mempunyai perjanjian kecuali dengan al-Hira, Ali, dan Banqiya."
