id: event/ibn-qayyim-sadriyya-743
class: event
kind: other
label:
  ar: "افتتاح درس ابن قيم الجوزية بالمدرسة الصدرية، ٦ صفر ٧٤٣هـ/١١ يوليو ١٣٤٢م"
  en: "Ibn Qayyim's inaugural lecture at the Sadriyya madrasa, 6 Safar 743/11 July 1342"
  ur: "ابن قیم کا افتتاحی درس، صدریہ مدرسہ، 6 صفر 743ھ/11 جولائی 1342ء"
  es: "Conferencia inaugural de Ibn Qayyim en la madrasa Sadriyya, 6 de Safar de 743/11 de julio de 1342"
  fr: "Leçon inaugurale d'Ibn Qayyim à la madrasa Sadriyya, 6 Safar 743/11 juillet 1342"
  tr: "İbn Kayyim el-Cevziyye'nin el-Sadriyah Okulu'ndaki dersinin açılışı, 6 Safar 743 H. / 11 Temmuz 1342"
  id: "Pembukaan Pelajaran Ibnu Qayyim al-Jawziyya di Sekolah al-Sadriyah, 6 Safar 743 H / 11 Juli 1342 M"
summary:
  ar: "ألقى ابن قيم الجوزية درسه الافتتاحي بالمدرسة الصدرية في ٦ صفر ٧٤٣هـ/١١ يوليو ١٣٤٢م، وظلّ يدرّس فيها حتى وفاته {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}؛ وكان قد درّس بالصدرية وأمَّ بالجوزية، وقرأ الفقه على المجد الحرّاني وابن تيمية والأصول على الصفي الهندي وابن تيمية {cite:durar-kamina-jil-1993 3/401}."
  en: "On 6 Safar 743/11 July 1342 Ibn Qayyim gave his inaugural lecture at the Sadriyya madrasa, where he was to teach until his death {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}. He taught at the Sadriyya and led prayer at the Jawziyya; he had read fiqh under al-Majd al-Harrani and Ibn Taymiyya and usul under al-Safi al-Hindi and Ibn Taymiyya {cite:durar-kamina-jil-1993 3/401}."
  ur: "6 صفر 743ھ/11 جولائی 1342ء کو ابن قیم نے صدریہ مدرسہ میں اپنا افتتاحی درس دیا، جہاں وہ وفات تک پڑھاتے رہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}۔ انہوں نے صدریہ میں تدریس اور جوزیہ میں امامت کی؛ انہوں نے فقہ مجد حرانی اور ابن تیمیہ سے اور اصول صفی ہندی اور ابن تیمیہ سے پڑھا {cite:durar-kamina-jil-1993 3/401}۔"
  es: "El 6 de Safar de 743/11 de julio de 1342, Ibn Qayyim dio su conferencia inaugural en la madrasa Sadriyya, donde enseñaría hasta su muerte {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}. Enseñó en la Sadriyya y dirigió la oración en la Jawziyya; había estudiado fiqh con al-Majd al-Harrani e Ibn Taymiyya y usul con al-Safi al-Hindi e Ibn Taymiyya {cite:durar-kamina-jil-1993 3/401}."
  fr: "Le 6 Safar 743/11 juillet 1342, Ibn Qayyim donna sa leçon inaugurale à la madrasa Sadriyya, où il enseigna jusqu'à sa mort {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}. Il enseigna à la Sadriyya et dirigea la prière à la Jawziyya; il avait étudié le fiqh auprès d'al-Majd al-Harrani et d'Ibn Taymiyya, et l'usul auprès d'al-Safi al-Hindi et d'Ibn Taymiyya {cite:durar-kamina-jil-1993 3/401}."
  tr: "İbn Kayyim el-Cevziyye, 6 Safer 743 Hicri/11 Temmuz 1342 Miladi tarihinde el-Sadriya Okulu'nda ilk dersini verdi ve ölümüne kadar orada ders vermeye devam etti {kaynak:encyclopaedia-of-islam-2 cilt 3 s. 854}; el-Sadriya'da ders vermiş ve el-Cevziyye'de namaz kıldırmış, fıkıh ilmini el-Mecd el-Harrani ve İbn Taymiyye'den, fıkıh esaslarını ise el-Safi el-Hindi ve İbn Taymiyye'den öğrenmiştir {kaynak:durar-kamina-jil-1993 3/401}."
  id: "Ibn Qayyim al-Jawziyya menyampaikan pelajaran perdananya di Sekolah al-Sadriya pada tanggal 6 Safar 743 H/11 Juli 1342 M, dan terus mengajar di sana hingga wafatnya {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}; beliau pernah mengajar di al-Sadriya dan memimpin salat di al-Jawziyya, serta mempelajari fiqih dengan al-Majd al-Harrani dan Ibn Taymiyya, dan prinsip-prinsip fiqih dengan al-Safi al-Hindi dan Ibn Taymiyya {cite:durar-kamina-jil-1993 3/401}."
