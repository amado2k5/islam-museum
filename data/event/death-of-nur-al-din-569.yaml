summary:
  ar: "توفي نور الدين محمود بن زنكي صاحب الشام وديار الجزيرة ومصر يوم الأربعاء حادي عشر شوال سنة تسع وستين وخمسمائة بعلة الخوانيق، ودفن بقلعة دمشق ثم نقل إلى المدرسة التي أنشأها بدمشق عند سوق الخواصين؛ وحكى طبيب كان يخدمه أنه لما اشتد به المرض في بيته الصغير بالقلعة أشار الأطباء بالقصد فقال «ابن ستين لا يقتصد» وامتنع منه فلم ينجع الدواء؛ وكان قبل موته بأيام قد شرع يتجهز للدخول إلى مصر لأخذها من صلاح الدين إذ رأى منه فتوراً في غزو الفرنج، فأرسل إلى الموصل وديار الجزيرة وديار بكر يطلب العساكر للغزاة؛ وقال ابن الأثير: طالعت سير الملوك المتقدمين فلم أر فيها بعد الخلفاء الراشدين وعمر بن عبد العزيز أحسن من سيرته ولا أكثر تحرياً منه للعدل، وكان مولده سنة إحدى عشرة وخمسمائة {cite:kamil-ibn-al-athir p. 56}."
  en: "Death of Nur al-Din Mahmud ibn Zangi, lord of Syria, the Jazira and Egypt's overlord — Wednesday 11 Shawwal 569, of quinsy, in the small prayer-cell he kept in Damascus citadel; refusing cupping ('a man of sixty is not bled'), buried in the citadel then translated to his madrasa by Suq al-Khawwassin. He had been mustering armies from Mosul and the Jazira to take Egypt from Saladin when death overtook him. Ibn al-Athir's verdict: after the Rashidun and Umar ibn Abd al-Aziz he read of no king's conduct finer or more scrupulous in justice {cite:kamil-ibn-al-athir p. 56}."
  es: "Muerte de Nur al-Din Mahmud ibn Zangi, señor de Siria, la Jazira y soberano de Egipto — Miércoles 11 de Shawwal de 569, de amigdalitis, en la pequeña celda de oración que mantenía en la ciudadela de Damasco; se negó a la ventosaterapia («a un hombre de sesenta años no se le sangra»), fue enterrado en la ciudadela y luego trasladado a su madrasa por Suq al-Khawwassin. Estaba reuniendo ejércitos de Mosul y la Jazira para tomar Egipto de Saladino cuando la muerte lo sorprendió. El veredicto de Ibn al-Athir: después de los Rashidun y Umar ibn Abd al-Aziz, no leyó sobre ninguna conducta de rey más noble o escrupulosa en justicia {cite:kamil-ibn-al-athir p. 56}."
  fr: "Décès de Nur al-Din Mahmud ibn Zangi, seigneur de Syrie, de la Jazira et suzerain d'Égypte — mercredi 11 Shawwal 569, des suites d'une angine, dans la petite cellule de prière qu'il conservait dans la citadelle de Damas; refusant la saignée (« un homme de soixante ans ne se fait pas saigner »), il fut inhumé dans la citadelle puis transféré dans sa madrasa par Suq al-Khawwassin. Il avait rassemblé des armées à Mossoul et dans la Jazira pour conquérir l'Égypte face à Saladin lorsque la mort l'emporta. L'avis d'Ibn al-Athir: après les Rashidun et Umar ibn Abd al-Aziz, il n'a lu aucun roi dont la conduite ait été plus juste et plus scrupuleuse en matière de justice (voir: Kamil ibn al-Athir, p. 56)."
  ur: "نورالدین محمود ابن زنگی کی موت، شام کے آقا، جزیرہ اور مصر کے بادشاہ - بدھ 11 شوال 569، کوئنسی، اس نے دمشق کے قلعے میں رکھے ہوئے چھوٹے سے نماز خانے میں؛ سنگی لگانے سے انکار ⁦('ساٹھ کے آدمی کو خون نہیں لگایا جاتا')⁩، قلعہ میں دفن کیا گیا پھر سق الخواسین نے اس کے مدرسہ میں ترجمہ کیا۔ وہ موصل اور جزیرہ سے مصر کو صلاح الدین سے چھیننے کے لیے فوجیں جمع کر رہا تھا جب اس پر موت آ گئی۔ ابن اثیر کا فیصلہ: راشدین اور عمر بن عبدالعزیز کے بعد اس نے کسی بادشاہ کے طرز عمل کو انصاف میں بہتر یا اس سے زیادہ غیر اخلاقی نہیں پڑھا۔ 56}۔"
