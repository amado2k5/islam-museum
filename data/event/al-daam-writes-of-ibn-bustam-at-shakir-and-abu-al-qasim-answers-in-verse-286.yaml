id: event/al-daam-writes-of-ibn-bustam-at-shakir-and-abu-al-qasim-answers-in-verse-286
class: event
kind: other
label:
  ar: كتاب الدعام عن ابن بسطام في شاكر وجواب أبي القاسم شعراً، 286هـ
  en: Al-Da'am writes of Ibn Bustam at Shakir and Abu al-Qasim answers in verse, 286 AH
  fr: "Al-Da'am écrit au sujet d’Ibn Bustam à Shakir et Abu al-Qasim répond en vers, 286 de l’hégire"
  ur: دعام کا شاکر میں ابن بسطام کی بابت خط اور ابو القاسم کا منظوم جواب، 286ھ
  es: "Al-Da'am escribe sobre Ibn Bustam en Shakir y Abu al-Qasim responde en el versículo 286 AH."
  tr: "Şakir'de İbn Bastam üzerine Al-Da'am'ın kitabı ve Ebu el-Kâsım'ın şiirsel cevabı, Hicri 286"
  id: "Kitab Al-Da'am tentang Ibnu Bastam di Shakir dan tanggapan puitis Abu Al-Qasim, 286 H."
summary:
  ar: بحسب علي بن محمد عن محمد بن سليمان، لما صار ابن بسطام إلى شاكر وصرخ بها علم الدعام فكتب إلى أبي القاسم بخبره وبما أجمعت عليه بنو الحارث من إرادة الهادي وأنه هاله جمعهم، فكتب إليه أبو القاسم جواباً شعراً يهوّن فيه الأمر ويذكر أن المؤمنين مع الإمام على الهدى ولا يخافون العالمين.
  en: As told by Ali ibn Muhammad from Muhammad ibn Sulayman, when Ibn Bustam reached Shakir and called out there, al-Da'am learned of it and wrote to Abu al-Qasim of him and of what Banu al-Harith had agreed to against al-Hadi, saying he was alarmed at their gathering; Abu al-Qasim wrote back in verse making light of it and saying the believers are with the imam on guidance and fear no one.
  fr: "Selon Ali ibn Muhammad, d’après Muhammad ibn Sulayman, lorsqu’Ibn Bustam atteignit Shakir et y lança son appel, al-Da'am l’apprit et écrivit à Abu al-Qasim à son sujet et au sujet de l’accord des Banu al-Harith contre al-Hadi, disant s’alarmer de leur rassemblement. Abu al-Qasim répondit en vers en minimisant la menace et en disant que les croyants suivaient la guidance avec l’imam et ne craignaient personne."
  ur: علی بن محمد کی محمد بن سلیمان سے روایت کے مطابق جب ابن بسطام شاکر پہنچا اور وہاں پکارا تو دعام کو معلوم ہوا اور اس نے ابو القاسم کو اس کی اور بنو حارث کے ہادی کے خلاف اتفاق کی خبر لکھی اور کہا کہ ان کا اجتماع اسے ڈراتا ہے؛ ابو القاسم نے منظوم جواب لکھا جس میں معاملے کو ہلکا بتایا اور کہا کہ مومن امام کے ساتھ ہدایت پر ہیں اور کسی سے نہیں ڈرتے۔
  es: "Según lo relatado por Ali ibn Muhammad de Muhammad ibn Sulayman, cuando Ibn Bustam llegó a Shakir y llamó a la gente, al-Da'am se enteró y escribió a Abu al-Qasim sobre él y sobre lo que Banu al-Harith había acordado contra al-Hadi, diciendo que estaba alarmado por su reunión; Abu al-Qasim respondió en verso restándole importancia y diciendo que los creyentes están con el imán en la guía y no temen a nadie."
  tr: "Ali bin Muhammed'in, Muhammed bin Süleyman'dan rivayetine göre, İbn Bustam Şakir'e gidip bunu bağırarak anlattığında, El-Da'am bunu öğrendi ve haberini ve Beni el-Harith'in El-Hadi'nin niyeti hakkındaki görüş birliğini ve onların toplanmasından duyduğu dehşeti Ebu el-Kâsım'a yazdı. Bunun üzerine Ebu el-Kâsım ona, meseleyi önemsiz gösteren ve müminlerin İmam ile doğru yolda olduklarını ve dünyadan korkmadıklarını belirten bir manzum cevap yazdı."
  id: "Menurut Ali bin Muhammad, berdasarkan riwayat Muhammad bin Sulaiman, ketika Ibnu Bustam pergi ke Shakir dan meneriakkan hal itu, Al-Da'am mengetahuinya dan menulis surat kepada Abu al-Qasim dengan berita tersebut dan apa yang telah disepakati oleh Bani al-Harith mengenai niat al-Hadi dan bahwa ia merasa takut dengan perkumpulan mereka. Maka Abu al-Qasim membalas suratnya dalam bentuk syair di mana ia membuat masalah itu tampak sepele dan menyebutkan bahwa orang-orang beriman berada di jalan yang benar bersama Imam dan tidak takut kepada dunia."
