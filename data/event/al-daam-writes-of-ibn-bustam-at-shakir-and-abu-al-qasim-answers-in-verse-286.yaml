id: event/al-daam-writes-of-ibn-bustam-at-shakir-and-abu-al-qasim-answers-in-verse-286
class: event
kind: other
label:
  ar: كتاب الدعام عن ابن بسطام في شاكر وجواب أبي القاسم شعراً، 286هـ
  en: Al-Da'am writes of Ibn Bustam at Shakir and Abu al-Qasim answers in verse, 286 AH
  ur: دعام کا شاکر میں ابن بسطام کی بابت خط اور ابو القاسم کا منظوم جواب، 286ھ
summary:
  ar: بحسب علي بن محمد عن محمد بن سليمان، لما صار ابن بسطام إلى شاكر وصرخ بها علم الدعام فكتب إلى أبي القاسم بخبره وبما أجمعت عليه بنو الحارث من إرادة الهادي وأنه هاله جمعهم، فكتب إليه أبو القاسم جواباً شعراً يهوّن فيه الأمر ويذكر أن المؤمنين مع الإمام على الهدى ولا يخافون العالمين.
  en: As told by Ali ibn Muhammad from Muhammad ibn Sulayman, when Ibn Bustam reached Shakir and called out there, al-Da'am learned of it and wrote to Abu al-Qasim of him and of what Banu al-Harith had agreed to against al-Hadi, saying he was alarmed at their gathering; Abu al-Qasim wrote back in verse making light of it and saying the believers are with the imam on guidance and fear no one.
  ur: علی بن محمد کی محمد بن سلیمان سے روایت کے مطابق جب ابن بسطام شاکر پہنچا اور وہاں پکارا تو دعام کو معلوم ہوا اور اس نے ابو القاسم کو اس کی اور بنو حارث کے ہادی کے خلاف اتفاق کی خبر لکھی اور کہا کہ ان کا اجتماع اسے ڈراتا ہے؛ ابو القاسم نے منظوم جواب لکھا جس میں معاملے کو ہلکا بتایا اور کہا کہ مومن امام کے ساتھ ہدایت پر ہیں اور کسی سے نہیں ڈرتے۔
