id: event/banu-al-harith-choose-twenty-men-from-each-branch-for-an-ambush-by-the-village-295
class: event
kind: other
label:
  ar: "بنو الحارث يختارون عشرين رجلاً من كل بطن لكمين في جانب القرية، 295هـ"
  en: "Banu al-Harith choose twenty men from each branch for an ambush at one side of the village, night of Friday 23 Dhu al-Hijja 295 AH, p. 369"
  ur: "بنو حارث کا ہر شاخ سے بیس آدمی منتخب کر کے گاؤں کے ایک پہلو میں گھات لگانا، جمعہ کی رات، 23 ذوالحجہ 295ھ، ص369"
  fr: "Les Banu al-Harith choisissent vingt hommes de chaque branche pour une embuscade d'un côté du village, nuit du vendredi 23 Dhu al-Hijja 295 H, p. 369"
  es: "Banu al-Harith escogió a veinte hombres de cada rama para una emboscada en un lado de la aldea, la noche del viernes 23 de Dhu al-Hijja 295 AH, pág. 369."
  tr: "Banu al-Harith kabilesi, 295 Hicri yılında köye pusu kurmak için her kabileden yirmi adam seçti."
  id: "Banu al-Harith memilih dua puluh orang dari setiap klan untuk menyergap desa tersebut, 295 H."
summary:
  ar: "ليلة الجمعة اجتمعت بنو الحارث في معسكرها، وتشاوروا فاستقر رأيهم على أن يخرجوا من كل بطن منهم عشرين رجلاً، يكونون كميناً في جانب القرية، ففعلوا ذلك."
  en: "On the night of Friday Banu al-Harith gathered in their camp and took counsel. They agreed to send twenty men from each of their branches to form an ambush at one side of the village, and they did so."
  ur: "جمعہ کی رات بنو حارث اپنی چھاؤنی میں جمع ہوئے، مشورہ کیا اور طے پایا کہ ہر شاخ سے بیس آدمی نکال کر گاؤں کے ایک پہلو میں گھات میں بٹھائے جائیں، تو انہوں نے ایسا ہی کیا۔"
  fr: "La nuit du vendredi, les Banu al-Harith se réunirent dans leur camp et tinrent conseil. Ils convinrent d'envoyer vingt hommes de chacune de leurs branches pour former une embuscade d'un côté du village, et ils le firent."
  es: "La noche del viernes, los Banu al-Harith se reunieron en su campamento y deliberaron. Acordaron enviar veinte hombres de cada una de sus ramas para tender una emboscada en un extremo del pueblo, y así lo hicieron."
  tr: "Cuma gecesi, Beni el-Harith kabilesi kamplarında toplandı ve kendi aralarında istişarede bulundu. Her kabileden yirmi adam göndererek köyün yan tarafında pusu kurmaya karar verdiler ve öyle de yaptılar."
  id: "Pada Jumat malam, kaum Banu al-Harith berkumpul di perkemahan mereka dan bermusyawarah. Mereka memutuskan untuk mengirimkan dua puluh orang dari setiap klan untuk membentuk penyergapan di sisi desa, dan mereka melakukannya."
