label: { ar: "حرب القمي لبلاد البجة", en: "al-Qummi's War on the Buja Lands", es: "La guerra de al-Qummi contra las tierras de Buja", fr: "La guerre d'al-Qummi contre les terres de Buja", ur: "بوجا سرزمین پر القومی کی جنگ", tr: "Beja Topraklarındaki Qummi Savaşı", id: "Perang Qummi di Tanah Beja" }
summary:
  ar: "عند البلاذري: أمر المتوكل بتوجيه رجل يقال له محمد بن عبد الله يعرف بالقمي إلى المعدن بمصر والياً عليه وولاه القلزم وطريق الحجاز وبذلك حاج مصر فلما وافى المعدن حمل الميرة في المراكب من القلزم إلى بلاد البجة ووافى ساحلاً يعرف بعيذاب فوافته المراكب هناك فاستمد بتلك الميرة وتقوّى بها ومن معه حتى وصل إلى قلعة ملك البجة فناهضه وكان في عدة يسيرة فخرج إليه البجوي في الدهم على إبل محزمة فعمد القمي إلى الأجراس فقلدها الخيل فلما سمعت الإبل أصواتها تشمّت بالبجيين في الأودية والجبال وقتل صاحب البجة ثم قام من بعده ابن أخته — وفي الأصل أخيه — وكان أبوه أحد ملوك البجيين وطلب الهدنة فأبى المتوكل إلا أن يطأ بساطه فقدم سر من رأى فصولح في سنة إحدى وأربعين ومائتين على أداء الأتاوة والبقط ورُد مع القمي فأُهلّ البجة على الهدنة يؤدون ولا يمنعون المسلمين من العمل في معدن الذهب. وفي رواية للمقريزي أوردها محققا الكتاب: ولّاه المتوكل حرب البجة سنة ١٤١ وكتب إلى عنبسة بن إسحاق الضبي أمير مصر بإعانته وأرضهم مفاوز مسيرة شهر في قفر وجبال وعرة وكان ملكهم علي بابا فلما أقبلت مراكب الأقوات صدقهم القتال فنفرت إبلهم من الأجراس وتبعهم المسلمون يقتلون ويأسرون فطلب علي بابا الأمان فأمنه على أن يؤدي ما عليه فحمل إليه الخراج لأربع سنين منعها وسار عنهم وعاد إلى بغداد ومعه علي بابا فخلع المتوكل عليه الديباج وولّى سعد الخادم البجة وطريق ما بينها ومكة فولّى سعد محمد القمي ذلك فعاد إليها ومعه علي بابا وهو على دينه ومعه صنم من حجارة كهيئة الصبي يسجد له فنزل القمي أسوان وأقام بها مدة ومات."
  en: "In al-Baladhuri: al-Mutawakkil ordered sending a man called Muhammad ibn Abdallah — known as al-Qummi — to the mine of Egypt as its governor, giving him the Qulzum, the Hijaz road and with it Egypt's hajj command; reaching the mine he carried provisions by ships from the Qulzum to the Buja lands, met a coast called Aydhab where the ships joined him — strengthened by that supply he reached the Buja king's fortress and fought him in small number; the Buja king came out in the masses on armored camels, so al-Qummi took the bells and hung them on the horses — the camels heard their sounds and scattered the Buja through valleys and mountains, and the Buja master was killed. His sister's son succeeded — the original reads 'his brother' — his father one of the Buja kings, and sought truce; al-Mutawakkil refused unless he tread his carpet, so he came to Samarra and peace was made in year 241 on paying the tribute and baqt; he was returned with al-Qummi, the Buja entering truce, paying and not barring Muslims from working the gold mine — that being the condition on their master. In al-Maqrizi's version cited by the editors: al-Mutawakkil gave him the Buja war in 241 and wrote Anbasa ibn Ishaq al-Dabbi, Egypt's amir, to aid him; their land was a month's barren march of rugged mountains; their king was Ali Baba — when the provision ships arrived he fought in earnest, the camels panicked at the bells, the Muslims pursued killing and capturing; Ali Baba asked aman, granted on paying dues, he carried him four years' withheld kharaj; al-Qummi returned to Baghdad with Ali Baba — al-Mutawakkil robed him in brocade and gave Sa'd al-Khadim the Buja and the road to Mecca; Sa'd gave Muhammad al-Qummi that and he returned with Ali Baba still on his religion, carrying a stone idol like a boy he prostrated to; al-Qummi settled at Aswan and died there."
  es: "En al-Baladhuri: al-Mutawakkil ordenó enviar a un hombre llamado Muhammad ibn Abdallah — conocido como al-Qummi — a la mina de Egipto como su gobernador, dándole el Qulzum, el camino del Hiyaz y con él el mando del Hajj de Egipto; llegando a la mina llevó provisiones en barcos desde el Qulzum a las tierras de los Buja, encontró una costa llamada Aydhab donde los barcos se unieron a él — fortalecido por ese suministro llegó a la fortaleza del rey Buja y luchó contra él en pequeño número; el rey Buja salió en masa en camellos blindados, así que al-Qummi tomó las campanas y las colgó en los caballos — los camellos oyeron sus sonidos y dispersaron a los Buja por valles y montañas, y el señor Buja fue asesinado. El hijo de su hermana sucedió — el original dice 'su hermano' — su padre uno de los reyes Buja, y buscó una tregua; al-Mutawakkil se negó a menos que pisara su alfombra, así que fue a Samarra y se hizo la paz en el año 241 pagando el tributo y el baqt; regresó con al-Qummi, el Buja entró en tregua, pagando y no impidiendo que los musulmanes trabajaran la mina de oro, que era la condición de su señor. En la versión de al-Maqrizi citada por los editores: al-Mutawakkil le dio la guerra del Buja en 241 y escribió a Anbasa ibn Ishaq al-Dabbi, el emir de Egipto, para ayudarlo; su tierra era una marcha estéril de un mes de montañas escarpadas; su rey era Ali Baba: cuando llegaron los barcos de provisiones luchó en serio, los camellos entraron en pánico al oír las campanas, los musulmanes persiguieron matando y capturando; Ali Baba pidió aman, concedido al pagar los derechos, le llevó cuatro años de kharaj retenido; Al-Qummi regresó a Bagdad con Ali Baba; Al-Mutawakkil lo vistió con brocado y le dio a Sa'd al-Khadim la Buja y el camino a La Meca; Sa'd le dio eso a Muhammad al-Qummi y este regresó con Ali Baba, aún fiel a su religión, llevando un ídolo de piedra como un niño ante el cual se postraba; Al-Qummi se estableció en Asuán y murió allí."
  fr: "Dans al-Baladhuri: al-Mutawakkil ordonna d'envoyer un homme nommé Muhammad ibn Abdallah – connu sous le nom d'al-Qummi – à la mine d'Égypte en tant que gouverneur, lui confiant le Qulzum, la route du Hedjaz et, de ce fait, le commandement du pèlerinage égyptien. Arrivé à la mine, il transporta des provisions par bateau du Qulzum jusqu'aux terres de Buja, et atteignit une côte appelée Aydhab où les navires le rejoignirent. Fort de ces approvisionnements, il atteignit la forteresse du roi de Buja et l'affronta en petit nombre. Le roi de Buja sortit en masse sur des chameaux caparaçonnés, alors al-Qummi prit les cloches et les suspendit aux chevaux. Les chameaux entendirent leur son et dispersèrent les Buja à travers les vallées et les montagnes, et le chef de Buja fut tué. Le fils de sa sœur lui succéda – le texte original dit « son frère » – son père était l'un des rois de Buja, et chercha une trêve. Al-Mutawakkil refusa de coopérer tant qu'il n'aurait pas foulé son tapis. Il se rendit donc à Samarra et la paix fut conclue en 241 après le paiement du tribut et du baqt. Il retourna avec al-Qummi, les Buja concluant une trêve, payant le tribut et n'interdisant pas aux musulmans d'exploiter la mine d'or – condition imposée à leur maître. Selon la version d'al-Maqrizi citée par les éditeurs: al-Mutawakkil lui confia la guerre des Buja en 241 et écrivit à Anbasa ibn Ishaq al-Dabbi, l'émir d'Égypte, pour lui demander de l'aide. Leur territoire s'étendait sur un mois de marche aride à travers des montagnes escarpées. Leur roi était Ali Baba. À l'arrivée des navires de ravitaillement, il livra une bataille acharnée. Les chameaux, pris de panique au son des cloches, furent poursuivis par les musulmans qui tuaient et capturaient les ennemis. Ali Baba demanda l'aman, qui lui fut accordé après le paiement des taxes. Il reçut alors le kharaj, retenu depuis quatre ans. Al-Qummi retourna à Bagdad avec Ali Baba; al-Mutawakkil le revêtit d'un vêtement de brocart et donna à Sa'd al-Khadim le Buja et la route de La Mecque; Sa'd donna cela à Muhammad al-Qummi, qui retourna avec Ali Baba, toujours fidèle à sa religion, portant une idole de pierre ressemblant à un enfant devant lequel il se prosternait; al-Qummi s'installa à Assouan et y mourut."
  ur: "البلادھوری میں ہے: المتوکل نے محمد بن عبداللہ نامی ایک شخص کو مصر کی کان میں اس کے گورنر کے طور پر بھیجنے کا حکم دیا، اسے حجاز کی سڑک اور اس کے ساتھ مصر کا حج کا حکم دیا۔ کان تک پہنچ کر وہ بحری جہازوں کے ذریعے سامان لے کر قلزم سے بوجہ کی سرزمینوں تک پہنچا، ایذاب نامی ساحل سے ملا جہاں بحری جہاز اس کے ساتھ شامل ہو گئے — اس رسد سے مضبوط ہو کر وہ بوجا بادشاہ کے قلعے تک پہنچا اور بہت کم تعداد میں اس سے لڑا۔ بوجا بادشاہ بکتر بند اونٹوں پر عوام میں نکلا، تو القومی نے گھنٹیاں لے کر گھوڑوں پر لٹکا دیں - اونٹوں نے ان کی آواز سنی اور بوجہ کو وادیوں اور پہاڑوں میں بکھیر دیا، اور بوجا ماسٹر مارا گیا۔ اس کی بہن کا بیٹا کامیاب ہوا - اصل میں 'اس کا بھائی' پڑھا جاتا ہے - اس کے والد بوجا بادشاہوں میں سے ایک تھے، اور جنگ بندی کی کوشش کی۔ متوکل نے اس وقت تک انکار کر دیا جب تک کہ وہ قالین کو روندتا ہے، اس لیے وہ سامرہ آیا اور سال 241 میں خراج اور بکت ادا کرنے پر صلح کر لی گئی۔ اسے القومی کے ساتھ واپس کر دیا گیا، بوجا نے جنگ بندی کی، مسلمانوں کو سونے کی کان میں کام کرنے سے ادائیگی کی اور نہ روکا - جو کہ ان کے مالک پر شرط ہے۔ المکرزی کے نسخے میں جو مدیران نے نقل کیا ہے: المتوکل نے اسے 241 میں بوجہ جنگ دی اور مصر کے امیر عنباسہ ابن اسحاق الدبی کو اس کی مدد کے لیے لکھا۔ اُن کی سرزمین ایک مہینے کی بنجر پہاڑوں کی سیر تھی۔ ان کا بادشاہ علی بابا تھا - جب رزق کے جہاز پہنچے تو اس نے بھرپور جنگ کی، اونٹ گھنٹیاں بجانے پر گھبرا گئے، مسلمانوں نے قتل اور گرفتاری کا تعاقب کیا۔ علی بابا نے امان مانگی، واجبات ادا کرنے پر دی گئی، وہ اسے چار سال کا روکا ہوا خرج لے گیا۔ القومی علی بابا کے ساتھ بغداد واپس آیا - المتوکل نے اسے بروکیڈ پہنایا اور سعد الخادم کو بوجہ اور مکہ کا راستہ دیا۔ سعد نے محمد القومی کو وہ دیا اور وہ علی بابا کے ساتھ اپنے مذہب پر برقرار، ایک پتھر کا بت لے کر واپس آیا جیسا کہ اس نے سجدہ کیا تھا۔ القمی نے اسوان میں سکونت اختیار کی اور وہیں وفات پائی۔"
  tr: "El-Baladhuri'ye göre: El-Mutavakkil, El-Kummi olarak bilinen Muhammed bin Abdullah adında bir adamı Mısır'daki madene vali olarak gönderdi ve onu Kulzum'a ve Hicaz yoluna atadı; böylece Mısır'dan hacıları topladı. Madene vardığında, Qulzum'dan Beja ülkesine gemilerle erzak taşıdı ve Aydhab olarak bilinen bir kıyıya ulaştı; gemiler orada onu karşıladı, böylece onlardan erzak aldı ve Beja kralının kalesine ulaşana kadar kendisini ve yanındakileri güçlendirdi. Orada kralın yanında az sayıda adam vardı, bu yüzden Al-Bajawi karanlıkta eyerli develerle ona doğru geldi. Al-Qummi çanları alıp atlara taktı. Develer çanların sesini duyunca vadilerde ve dağlarda Beja'ya karşı zafer kazandılar ve Beja hükümdarını öldürdüler. Sonra yeğeni -aslında kardeşi- onun ardından ayağa kalktı -babası Beja krallarından biriydi- ve ateşkes istedi, ancak Al-Mutawakkil halısına ayak basmaktan başka bir şey kabul etmedi. Bunun üzerine Samarra'ya geldi ve 241 yılında haraç ve bakt ödeme şartıyla barış yaptı. Ve Al-Qummi ile birlikte geri döndü, böylece Bejalar ateşkesi kabul etmek zorunda kaldılar; ödeme yapacaklar ve Müslümanların altın madeninde çalışmasına engel olmayacaklardı. Kitabın editörleri tarafından alıntılanan Al-Maqrizi'nin bir rivayetine göre: Al-Mutawakkil, 141 yılında Bejalara karşı savaşı yönetmesi için onu görevlendirdi ve Mısır Emiri Anbasa bin İshak Al-Dabbi'ye kendisine yardım etmesi için yazdı. Toprakları çöl, bir aylık yolculuk mesafesinde çorak ve engebeli dağlardı. Kralları Ali Baba idi. Erzak taşıyan gemiler geldiğinde onlarla savaştılar ve develeri çanlardan ürktü. Müslümanlar onları kovaladı, öldürdü ve esir aldı. Ali Baba güvenlik istedi ve o da kendisine borçlu olduğu şeyi ödemesi şartıyla ona güvenlik verdi. Ona dört yıllık haraç getirdi, ancak o bunu ödemedi ve onları bırakıp Ali Baba ile birlikte Bağdat'a döndü. El-Mutavakkil ona ipek kumaşlar verdi ve Saad El-Hadim'i Beja kabilesinin ve Beja ile Mekke arasındaki yolun başına atadı. Saad, Muhammed El-Kummi'yi bu göreve atadı ve o da, kendi dinine mensup olan Ali Baba ile birlikte oraya döndü; yanında, önünde secde ettiği, taştan yapılmış bir çocuk heykeli vardı. El-Kummi, Aswan'a indi, orada bir süre kaldı ve öldü."
  id: "Menurut Al-Baladhuri: Al-Mutawakkil memerintahkan seorang pria bernama Muhammad bin Abdullah, yang dikenal sebagai Al-Qummi, untuk dikirim ke tambang di Mesir sebagai gubernurnya, dan dia menunjuknya ke Qulzum dan jalan menuju Hijaz, dan dengan itu dia membawa para peziarah Mesir. Ketika tiba di tambang, ia membawa perbekalan dengan kapal dari Qulzum ke negeri Beja dan tiba di pantai yang dikenal sebagai Aydhab. Kapal-kapal itu menemuinya di sana, sehingga ia memperoleh perbekalan dari kapal-kapal tersebut dan menguatkan dirinya serta orang-orang yang bersamanya hingga mencapai benteng raja Beja dan menghadapinya. Raja Beja hanya memiliki sedikit pasukan, sehingga Al-Bajawi keluar menemuinya dalam kegelapan dengan unta-unta yang dilengkapi pelana. Al-Qummi kemudian mengambil lonceng dan memasangnya di atas kuda-kuda unta. Ketika unta-unta mendengar suara lonceng tersebut, mereka bersorak gembira atas Beja di lembah dan pegunungan, lalu membunuh penguasa Beja. Kemudian keponakannya—yang sebenarnya adalah saudaranya—bangkit melawannya. Ayahnya adalah salah satu raja Beja, dan ia meminta gencatan senjata. Namun Al-Mutawakkil menolak, kecuali untuk menginjakkan kaki di karpetnya. Maka ia datang ke Samarra, dan berdamai pada tahun 241 dengan syarat membayar upeti dan baqt. Ia kembali dengan... Al-Qummi, sehingga kaum Beja dibujuk untuk menerima gencatan senjata, mereka akan membayar dan tidak menghalangi kaum Muslim untuk bekerja di tambang emas. Dalam sebuah riwayat oleh Al-Maqrizi, yang dikutip oleh editor buku ini: Al-Mutawakkil menunjuknya untuk memimpin perang melawan kaum Beja pada tahun 141 dan menulis surat kepada Anbasa bin Ishaq Al-Dabbi, Emir Mesir, untuk membantunya. Tanah mereka adalah gurun, perjalanan selama sebulan di daerah tandus dan pegunungan terjal. Raja mereka adalah Ali Baba. Ketika kapal-kapal yang membawa perbekalan tiba, mereka melawan mereka, dan unta-unta mereka terkejut oleh lonceng. Kaum Muslim mengejar mereka, membunuh dan menangkap mereka. Ali Baba meminta perlindungan, dan dia mengabulkannya dengan syarat dia membayar apa yang menjadi haknya. Dia membawa upeti untuk empat tahun, yang ditahannya, dan dia meninggalkan mereka dan kembali ke Baghdad bersama Ali Baba. Al-Mutawakkil menganugerahinya kain brokat dan menunjuk Saad Al-Khadim untuk memimpin kaum Beja dan jalan antara mereka dan Mekah. Saad menunjuk Muhammad Al-Qummi untuk tugas itu, dan ia kembali ke sana bersama Ali Baba, yang teguh dalam agamanya, dan bersamanya ada sebuah patung batu berbentuk anak laki-laki yang disembahnya. Al-Qummi pergi ke Aswan dan tinggal di sana untuk sementara waktu lalu meninggal dunia."
