label:
  ar: "قحط شديد باليمن يتجاوز فيه المكوك مائة درهم، سنة 292هـ، ص389"
  en: "A severe famine in Yemen, in which a mukuk of grain passes one hundred dirhams, in 292 AH, p. 389"
  ur: "یمن میں شدید قحط، جس میں ایک مکوک غلہ سو درہم سے بڑھ جاتا ہے، 292ھ، ص389"
  es: "Una grave hambruna en Yemen, en la que un mukuk de grano supera los cien dirhams, en 292 AH, pág. 389"
  fr: "Une grave famine au Yémen, où un mukuk de grain dépasse les cent dirhams, en 292 AH, p. 389"
  tr: "Yemen'de, tek bir madeni paranın yüz dirhemden fazla fiyata satıldığı şiddetli bir kuraklık yaşandı (Hicri 292 yılı, s. 389)."
  id: "Kekeringan parah di Yaman, di mana satu koin harganya lebih dari seratus dirham, pada tahun 292 Hijriah, hlm. 389"
summary:
  ar: "أصاب الناس باليمن قحط شديد، بلغ فيه المكوك مائة درهم وثمانية وأربعين درهماً، وخربت القرى، وأكل الناس بعضهم بعضاً."
  en: "A severe famine struck Yemen. A mukuk rose to one hundred and forty-eight dirhams, villages were ruined, and people ate one another."
  ur: "یمن میں شدید قحط پڑا، ایک مکوک ایک سو اڑتالیس درہم کا ہو گیا، گاؤں اجڑ گئے اور لوگ ایک دوسرے کو کھانے لگے۔"
  es: "Yemen sufrió una grave hambruna. El valor del mukuk subió a ciento cuarenta y ocho dirhams, las aldeas quedaron devastadas y la gente se canibalizaba entre sí."
  fr: "Une terrible famine frappa le Yémen. Le mukuk atteignit cent quarante-huit dirhams, des villages furent ravagés et les gens s'entre-dévorèrent."
  tr: "Yemen halkı şiddetli bir kuraklıkla boğuşuyordu; bir çuvalın fiyatı yüz kırk sekiz dirheme ulaşmış, köyler yıkılmış ve insanlar birbirlerini yemişlerdi."
  id: "Rakyat Yaman dilanda kekeringan hebat, di mana harga sekarung mencapai seratus empat puluh delapan dirham, desa-desa hancur, dan orang-orang saling memakan satu sama lain."
