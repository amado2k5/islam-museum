label: { ar: "إعدام سعيد بن أحمد الباهلي", en: "The execution of Sa'id ibn Ahmad al-Bahili", es: "La ejecución de Sa'id ibn Ahmad al-Bahili", fr: "L'exécution de Sa'id ibn Ahmad al-Bahili", ur: "سعید بن احمد الباہلی کی پھانسی" }
summary:
  ar: "في سنة ثمان وخمسين ومائتين قُبض على سعيد بن أحمد بن سعيد بن سلم الباهلي، وكان متقدم الباهليين وقد طمعوا في البطائح بعد خروج الزنج منها وأظهروا فيها الفساد، فبُعث به إلى بغداد فأمر به المعتمد على الله أن يُضرب سبعمائة سوط فضُرب وصُلب في ربيع الآخر من هذه السنة، فانضم باقي رؤسائهم إلى الزنج {cite:muntazam-ibn-al-jawzi p. 100}."
  en: "In 258 Sa'id ibn Ahmad al-Bahili, headman of the Bahila who had exploited the Batihah marshes after the Zanj left them, was sent to Baghdad; al-Mu'tamid ordered him given seven hundred lashes and he was crucified in Rabi' II, driving the remaining Bahili chiefs to join the Zanj {cite:muntazam-ibn-al-jawzi p. 100}."
  es: "En 258, Sa'id ibn Ahmad al-Bahili, jefe de los Bahila que había explotado los pantanos de Batihah después de que los Zanj los abandonaran, fue enviado a Bagdad; al-Mu'tamid ordenó que se le dieran setecientos latigazos y fue crucificado en Rabi' II, lo que llevó a los jefes Bahili restantes a unirse a los Zanj {cite:muntazam-ibn-al-jawzi p. 100}."
  fr: "En 258, Sa'id ibn Ahmad al-Bahili, chef des Bahila qui avait exploité les marais de Batihah après que les Zanj les aient quittés, fut envoyé à Bagdad; al-Mu'tamid ordonna qu'il reçoive sept cents coups de fouet et il fut crucifié en Rabi' II, poussant les chefs Bahili restants à rejoindre les Zanj {cite:muntazam-ibn-al-jawzi p. 100}."
  ur: "258 میں بحیلہ کے سربراہ سعید بن احمد الباہلی کو جس نے بطیحہ کی دلدل کو زنج کے چھوڑنے کے بعد ان کا استحصال کیا تھا، کو بغداد بھیجا گیا۔ معتمد نے اسے سات سو کوڑے مارنے کا حکم دیا اور اسے ربیع دوم میں مصلوب کر دیا گیا، باقی باہلی سرداروں کو زنج میں شامل کرنے کے لیے چلا گیا۔ 100}۔"
