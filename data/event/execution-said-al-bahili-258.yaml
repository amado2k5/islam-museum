label: { ar: "إعدام سعيد بن أحمد الباهلي", en: "The execution of Sa'id ibn Ahmad al-Bahili" }
summary:
  ar: "في سنة ثمان وخمسين ومائتين قُبض على سعيد بن أحمد بن سعيد بن سلم الباهلي، وكان متقدم الباهليين وقد طمعوا في البطائح بعد خروج الزنج منها وأظهروا فيها الفساد، فبُعث به إلى بغداد فأمر به المعتمد على الله أن يُضرب سبعمائة سوط فضُرب وصُلب في ربيع الآخر من هذه السنة، فانضم باقي رؤسائهم إلى الزنج {cite:muntazam-ibn-al-jawzi p. 100}."
  en: "In 258 Sa'id ibn Ahmad al-Bahili, headman of the Bahila who had exploited the Batihah marshes after the Zanj left them, was sent to Baghdad; al-Mu'tamid ordered him given seven hundred lashes and he was crucified in Rabi' II, driving the remaining Bahili chiefs to join the Zanj {cite:muntazam-ibn-al-jawzi p. 100}."
