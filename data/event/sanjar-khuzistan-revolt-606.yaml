label: { ar: "عصيان سنجر بخوزستان وتسليمه", en: "Sanjar's revolt in Khuzistan and his surrender (606–608 AH)", es: "La revuelta de Sanjar en Juzestán y su rendición (606-608 AH)", fr: "La révolte de Sanjar au Khuzistan et sa reddition (606–608 AH)", ur: "خوزستان میں سنجار کی بغاوت اور اس کا ہتھیار ڈالنا ⁦(606-608ھ)⁩", tr: "Sanjar'ın Huzistan'daki isyanı ve teslimiyeti", id: "Pemberontakan Sanjar di Khuzestan dan penyerahannya" }
summary:
  ar: "كان قطب الدين سنجر مملوك الخليفة الناصر ولاه خوزستان بعد طشتكين أمير الحاج، فلما كان سنة ست وستمائة بدا منه تغير عن الطاعة يبطن التغلب على البلاد، فسيّر الخليفة إليه مؤيد الدين نائب الوزارة وعز الدين بن نجاح الشرابي بعساكر، فلما تحقق قصدهم فارق البلاد ولحق بصاحب شيراز أتابك عز الدين سعد بن دكلا ملتجئاً، فأكرمه وقام دونه؛ فبادر عسكر الخليفة إلى أرجان وأقاموا شهوراً والرسل مترددة، فلما عزموا على قصد شيراز أرسل صاحبها يشفع فيه وطلب العهد فأجيب فسلمه وماله وأهله، ودخل سنجر بغداد في المحرم سنة ثمان وستمائة راكباً على بغل بأكلف وفي رجله سلسلتان، فجمع الأمراء والأعيان بدار نائب الوزارة فقرر بأمور منكرة نسبت إليه فأقر بها {cite:kamil-ibn-al-athir p. 352-353}."
  en: "Al-Nasir's mamluk-governor of Khuzistan, Qutb al-Din Sanjar, drifted into covert rebellion in 606; the caliphal army chased him into the protection of the Salghurid Atabeg Sa'd of Shiraz, wintered at Arrajan, and took his surrender under safe-conduct — Sanjar entered Baghdad on a pack-mule with two chains on his legs and confessed before the assembled amirs and notables {cite:kamil-ibn-al-athir p. 352-353}."
  es: "El gobernador mameluco de Khuzistán, Qutb al-Din Sanjar, perteneciente a Al-Nasir, se unió a una rebelión encubierta en 606; el ejército califal lo persiguió hasta la protección del Atabeg Sa'd de Shiraz, perteneciente a la dinastía Salghurid, pasó el invierno en Arrajan y aceptó su rendición bajo salvoconducto. Sanjar entró en Bagdad montado en una mula de carga con dos cadenas en las piernas y confesó ante los emires y notables allí reunidos {cite:kamil-ibn-al-athir p. 352-353}."
  fr: "Le gouverneur mamelouk du Khuzistan d'Al-Nasir, Qutb al-Din Sanjar, se lança dans une rébellion secrète en 606; l'armée califale le poursuivit jusqu'à la protection de l'Atabeg Salghuride Sa'd de Shiraz, hiverna à Arrajan et accepta sa reddition sous sauf-conduit — Sanjar entra à Bagdad sur une mule de bât avec deux chaînes aux jambes et confessa devant les émirs et les notables réunis {cite:kamil-ibn-al-athir p. 352-353}."
  ur: "الناصر کے مملوک-خوزستان کے گورنر، قطب الدین سنجار نے 606 میں خفیہ بغاوت کی۔ خلیفہ کی فوج نے اس کا تعاقب کرتے ہوئے شیراز کے سلغورید عتبیگ سعد کی حفاظت کے لیے کیا، جو ارجان میں موسم سرما میں تھا، اور اس نے محفوظ طریقے سے ہتھیار ڈال دیے - سنجر ایک خچر پر سوار ہو کر بغداد میں داخل ہوا اور اس نے جمع ہونے والے امیروں اور معززین کے سامنے اعتراف کیا۔ 352-353}۔"
  tr: "Kutb el-Din Sanjar, Halife el-Nasır'ın bir Memlük'üydü ve Hac Emiri Taştakin'den sonra Huzistan valisi olarak atanmıştı. Hicri 606 yılında, gizlice ülkeyi ele geçirmek için planlar yaparak itaate karşı isyan etmeye başladı. Bunun üzerine Halife, vezir yardımcısı Muayyad el-Din ve İzz el-Din ibn Najah el-Şerabi'yi askerleriyle birlikte ona karşı gönderdi. Niyetlerini anlayınca ülkeyi terk etti ve Şiraz hükümdarı Atabeg İzz el-Din Sa'd ibn Dakla'ya sığındı. Atabeg Sa'd ibn Dakla tarafından onurlandırıldı ve korundu. Halifenin ordusu Arjan'a koştu ve aylarca orada kaldı, elçiler gelip gitti. Şiraz'a gitmeye karar verdiklerinde, Şiraz hükümdarı onun için bir ricada bulundu ve biat istedi, bu da kabul edildi. Onu, mal varlığını ve ailesini teslim etti. Sanjar, Hicri 608 yılının Muharrem ayında, ayağında iki zincir bulunan bir katır üzerinde Bağdat'a girdi. Vezir yardımcısının evinde prensleri ve ileri gelenleri topladı ve ona isnat edilen kınanacak hususlar hakkında sorular sordu; vezir yardımcısı da bunları itiraf etti. {Kaynak: Kamil İbn el-Athir, s. 352-353}"
  id: "Qutb al-Din Sanjar adalah seorang Mamluk dari Khalifah al-Nasir, yang mengangkatnya sebagai gubernur Khuzestan setelah Tashtakin, Emir Haji. Pada tahun 606 H, ia mulai memberontak dan diam-diam merencanakan untuk merebut kendali negara. Maka Khalifah mengirim Mu'ayyad al-Din, wakil menteri, dan 'Izz al-Din ibn Najah al-Sharabi dengan pasukan untuk melawannya. Ketika ia menyadari niat mereka, ia meninggalkan negara dan mencari perlindungan kepada penguasa Shiraz, Atabeg 'Izz al-Din Sa'd ibn Dakla. Ia dihormati dan dilindungi oleh Atabeg Sa'd ibn Dakla. Pasukan Khalifah bergegas ke Arjan dan tinggal di sana selama berbulan-bulan, dengan utusan yang datang dan pergi. Ketika mereka memutuskan untuk pergi ke Shiraz, penguasanya mengirimkan permohonan untuknya dan meminta sumpah setia, yang kemudian dikabulkan. Ia menyerahkan dirinya, hartanya, dan keluarganya. Sanjar memasuki Baghdad pada bulan Muharram tahun 608 Hijriah, menunggangi seekor keledai dengan dua rantai di kakinya. Ia mengumpulkan para pangeran dan pejabat tinggi di rumah wakil menteri dan menanyainya tentang perkara-perkara tercela yang dituduhkan kepadanya, yang kemudian diakuinya. {cite:kamil-ibn-al-athir hlm. 352-353}"
