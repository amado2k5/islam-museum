summary:
  ar: "في سنة خمس ومائتين ولّى المأمون طاهر بن الحسين أقصى عمل المشرق، وكان قد ولّاه قبل ذلك الجزيرة والشرطة وجانبي بغداد {cite:tabari-tarikh-abu-al-fadl j.8 p.577}."
  en: "In 205 al-Ma'mun appointed Tahir ibn al-Husayn over the furthest province of the East; he had earlier entrusted him with al-Jazira, the police command (shurta) and the two sides of Baghdad {cite:tabari-tarikh-abu-al-fadl j.8 p.577}."
  es: "En 205, al-Ma'mun nombró a Tahir ibn al-Husayn al frente de la provincia más lejana del Este; anteriormente le había confiado al-Jazira, el mando policial (shurta) y los dos lados de Bagdad {cite:tabari-tarikh-abu-al-fadl j.8 p.577}."
  fr: "En 205, al-Ma'mun nomma Tahir ibn al-Husayn à la tête de la province la plus éloignée de l'Est; il lui avait auparavant confié al-Jazira, le commandement de la police (shurta) et les deux côtés de Bagdad {cite:tabari-tarikh-abu-al-fadl j.8 p.577}."
