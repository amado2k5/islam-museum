label: { ar: "فتح دمياط وتنيس في رواية «فتوح الشام» المنسوب إلى الواقدي", en: "The conquest of Damietta and Tinnis as told in the Futuh al-Sham ascribed to al-Waqidi", ur: "واقدی سے منسوب «فتوح الشام» کی روایت میں دمیاط اور تنیس کی فتح" }
summary:
  ar: "في «فتوح الشام» المنسوب إلى الواقدي أن عمرو بن العاص بعث المقداد بن الأسود في أربعين فارساً إلى دمياط وبها البامرك خال المقوقس في اثني عشر ألفاً، فدخلوها من نقب فتحه لهم ابن حكيم قتله البامرك، وأسلم شطا بن البامرك ثم أبوه، ثم دعا شطا صاحب تنيس أبا ثوب إلى الإسلام فأبى وجمع الجموع، فقُتل شطا في قتاله ليلة النصف من شعبان سنة 20هـ فيما يروي الكتاب، وأُسر أبو ثوب على يد يزيد بن عامر ثم أسلم، وجُعلت تلك الليلة موسماً يُزار فيه قبر شطا {cite:futuh-al-sham-ilmiyya-1997-v2 p. 78-88}."
  en: "In the Futuh al-Sham ascribed to al-Waqidi, Amr ibn al-As sends al-Miqdad ibn al-Aswad with forty horsemen to Damietta, held by al-Bamrak, uncle of the Muqawqis, with twelve thousand men; they enter through a breach opened by the son of a sage al-Bamrak had executed, and Shata son of al-Bamrak embraces Islam, then his father. Shata calls Abu Thawb, lord of Tinnis, to Islam; he refuses and gathers an army, and Shata is killed fighting him on the night of mid-Sha'ban 20 AH, as the book tells it; Abu Thawb is captured by Yazid ibn Amir and later accepts Islam, and that night becomes a yearly season of visiting Shata's grave {cite:futuh-al-sham-ilmiyya-1997-v2 p. 78-88}."
