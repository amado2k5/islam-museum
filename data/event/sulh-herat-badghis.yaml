label: { ar: "صلح هراة وبادغيس وبوشنج", en: "The Herat, Badghis and Bushanj Sulh", es: "Herat, Badghis y Bushanj Sulh", fr: "Herat, Badghis et Bushanj Sulh", ur: "ہرات، بادغیس اور بوشنج سلہ", tr: "Herat, Badghis ve Bushanj'ın Barışı", id: "Kedamaian Herat, Badghis dan Bushanj" }
summary:
  ar: "وجه ابن عامر جيشاً إلى هراة عليه أوس بن ثعلبة بن رقي ويقال خليد بن عبد الله الحنفي فبلغ عظيم هراة ذلك فشخص إلى ابن عامر وصالحه عن هراة وبادغيس وبوشنج غير طاغون وباغون فإنهما فتحا عنوة وكتب له ابن عامر هذا ما أمر به عبد الله بن عامر عظيم هراة وبوشنج وبادغيس أمره بتقوى الله ومناصحة المسلمين وإصلاح ما تحت يديه من الأرضين وصالحه عن هراة سهلها وجبلها على أن يؤدي من الجزية ما صالحه عليه وأن يقسم ذلك على الأرضين عدلاً بينهم فمن منع ما عليه فلا عهد له ولا ذمة وكتب ربيع بن نهشل وختم ابن عامر ويقال سار ابن عامر في الدهم إلى هراة فقاتل أهلها ثم صالحه مرزبان عن هراة وبوشنج وبادغيس على ألف ألف درهم."
  en: "An army under Aws ibn Tha'laba ibn Raqqi — or Khulayd ibn Abdallah al-Hanafi — went to Herat; its great came out to Ibn Amir and truced for Herat, Badghis and Bushanj, save Taghun and Baghun taken by force. Ibn Amir's writ, penned by Rabi' ibn Nahshal and sealed by himself, charged the great with piety, sincere counsel to the Muslims and righting his lands, compounded Herat's plain and mountain on the agreed jizya divided justly — 'whoever withholds what is on him has no covenant nor dhimma'. Another telling: Ibn Amir marched on Herat in strength, fought, and the marzban truced for a million."
  es: "Un ejército al mando de Aws ibn Tha'laba ibn Raqqi —o Khulayd ibn Abdallah al-Hanafi— fue a Herat; su gran jefe salió a ver a Ibn Amir y pactó una tregua por Herat, Badghis y Bushanj, excepto Taghun y Baghun, que fueron tomadas por la fuerza. El edicto de Ibn Amir, escrito por Rabi' ibn Nahshal y sellado por él mismo, le encomendó al gran jefe la piedad, el consejo sincero a los musulmanes y la reparación de sus tierras, y pactó la llanura y la montaña de Herat sobre la jizya acordada, dividida justamente: «quien retiene lo que le corresponde no tiene pacto ni dhimma». Otra versión: Ibn Amir marchó sobre Herat con fuerza, luchó y el marzban pactó una tregua por un millón."
  fr: "Une armée commandée par Aws ibn Tha'laba ibn Raqqi — ou Khulayd ibn Abdallah al-Hanafi — marcha sur Hérat. Ses notables se présentèrent devant Ibn Amir et conclurent une trêve pour Hérat, Badghis et Bushanj, à l'exception de Taghun et Baghun, prises par la force. L'ordonnance d'Ibn Amir, rédigée par Rabi' ibn Nahshal et scellée par lui-même, enjoignait aux notables la piété, des conseils sincères aux musulmans et la remise en état de ses terres. La plaine et la montagne de Hérat furent regroupées au titre de la jizya convenue, répartie équitablement: « Quiconque retient ce qui lui revient n'a ni pacte ni dhimma. » Selon une autre version, Ibn Amir marcha sur Hérat en force, livra bataille, et les marzbans conclurent une trêve pour un million d'hommes."
  ur: "اوس بن ثعلبہ ابن رقی - یا خلید ابن عبداللہ الحنفی - کی قیادت میں ایک لشکر ہرات کی طرف روانہ ہوا۔ اس کا عظیم ابن عامر کے پاس آیا اور ہرات، بادغیس اور بوشنج کے لیے جنگ بندی کی، طاغون اور باغون کو زبردستی چھین لیا۔ ابن عامر کی تحریر، ربیع بن نحل کی لکھی ہوئی اور خود پر مہر لگائی، عظیم پر تقویٰ، مسلمانوں کے لیے مخلصانہ مشورہ اور اپنی زمینوں کا حق ادا کرنے کا الزام لگایا، ہرات کے میدان اور پہاڑ کو منصفانہ طور پر منقسم جزیہ پر ملایا - 'جس نے اپنے اوپر جو کچھ ہے اسے روک دیا اس کا کوئی عہد نہیں'۔ ایک اور بیان ہے: ابن عامر نے طاقت کے ساتھ ہرات پر چڑھائی کی، لڑا اور مرزبان نے دس لاکھ تک جنگ کی۔"
  tr: "İbn Amir, Aws ibn Tha'labah ibn Raqi komutasında Herat'a bir ordu gönderdi ve bunun Halid ibn Abdullah el-Hanafi olduğu söylenir. Herat'ın ileri geleni bunu duyunca İbn Amir'e gitti ve Herat, Badghis ve Bushanj adına, Taghun ve Baghun hariç, onunla barış yaptı; çünkü bu iki bölge zorla ele geçirilmişti. İbn Amir ona şöyle yazdı: \"Abdullah ibn Amir, Herat, Bushanj ve Badghis'in ileri gelenine şunları emretti: Allah'tan korkmasını, Müslümanlara öğüt vermesini ve kontrolü altındaki toprakları ıslah etmesini emretti ve Herat, ovaları ve dağları adına, kabul ettiği cizyeyi ödemesi ve bunu topraklar arasında adil bir şekilde paylaştırması şartıyla onunla barış yaptı. Ödenmesi gerekeni ödemeyi reddedenin hiçbir ahit veya koruması yoktur.\" Rabi' ibn Nahshal bunu yazdı ve İbn Amir mühürledi. Rivayete göre İbn Amir orduyla birlikte Herat'a gitti ve halkıyla savaştı; ardından Marzban, Herat, Buşanj ve Badghis adına bir milyon dirhem karşılığında onunla barış yaptı."
  id: "Ibn Amir mengirimkan pasukan ke Herat di bawah komando Aws ibn Tha'labah ibn Raqi, dan konon pemimpinnya adalah Khalid ibn Abdullah al-Hanafi. Tokoh besar Herat mendengar kabar ini, lalu ia menemui Ibn Amir dan berdamai dengannya atas nama Herat, Badghis, dan Bushanj, kecuali Taghun dan Baghun, karena kedua wilayah itu telah ditaklukkan dengan kekerasan. Ibn Amir menulis kepadanya: Inilah perintah Abdullah ibn Amir kepada tokoh besar Herat, Bushanj, dan Badghis. Ia memerintahkannya untuk takut kepada Allah, menasihati kaum Muslimin, dan mereformasi wilayah-wilayah yang berada di bawah kekuasaannya, dan berdamai dengannya atas nama Herat, dataran dan pegunungannya, dengan syarat ia membayar jizya yang telah disepakati dan membaginya secara adil di antara wilayah-wilayah tersebut. Barangsiapa menolak membayar kewajibannya, maka ia tidak mendapat perjanjian atau perlindungan. Rabi' ibn Nahshal menulisnya dan Ibn Amir membubuhkan cap pada dokumen tersebut. Dikatakan bahwa Ibnu Amir memimpin pasukan ke Herat dan memerangi penduduknya, kemudian Marzban berdamai dengannya atas nama Herat, Bushanj, dan Badghis dengan imbalan satu juta dirham."
