id: event/sulh-herat-badghis
class: event
kind: treaty
label: { ar: "صلح هراة وبادغيس وبوشنج", en: "The Herat, Badghis and Bushanj Sulh" }
summary:
  ar: "وجه ابن عامر جيشاً إلى هراة عليه أوس بن ثعلبة بن رقي ويقال خليد بن عبد الله الحنفي فبلغ عظيم هراة ذلك فشخص إلى ابن عامر وصالحه عن هراة وبادغيس وبوشنج غير طاغون وباغون فإنهما فتحا عنوة وكتب له ابن عامر هذا ما أمر به عبد الله بن عامر عظيم هراة وبوشنج وبادغيس أمره بتقوى الله ومناصحة المسلمين وإصلاح ما تحت يديه من الأرضين وصالحه عن هراة سهلها وجبلها على أن يؤدي من الجزية ما صالحه عليه وأن يقسم ذلك على الأرضين عدلاً بينهم فمن منع ما عليه فلا عهد له ولا ذمة وكتب ربيع بن نهشل وختم ابن عامر ويقال سار ابن عامر في الدهم إلى هراة فقاتل أهلها ثم صالحه مرزبان عن هراة وبوشنج وبادغيس على ألف ألف درهم."
  en: "An army under Aws ibn Tha'laba ibn Raqqi — or Khulayd ibn Abdallah al-Hanafi — went to Herat; its great came out to Ibn Amir and truced for Herat, Badghis and Bushanj, save Taghun and Baghun taken by force. Ibn Amir's writ, penned by Rabi' ibn Nahshal and sealed by himself, charged the great with piety, sincere counsel to the Muslims and righting his lands, compounded Herat's plain and mountain on the agreed jizya divided justly — 'whoever withholds what is on him has no covenant nor dhimma'. Another telling: Ibn Amir marched on Herat in strength, fought, and the marzban truced for a million."
