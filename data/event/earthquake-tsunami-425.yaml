label: { ar: "زلزلة الرملة وارتداد البحر سنة 425", en: "Earthquake at Ramla and the sea's recession, 425" }
summary:
  ar: "في سنة خمس وعشرين وأربعمائة هبّت ريح سوداء بنصيبين فقلعت من بساتينها كثيراً ورمت قصراً مبنياً بآجر وحجارة وكلس، ووقع برد في أشكال الأكف والعواميد والأصابع، وزُلزلت الرملة فهُدم نحو نصفها وخُسف بقرى وسقط بعض حائط بيت المقدس وسقطت منارة جامع عسقلان، وجزر البحر نحو ثلاثة فراسخ فخرج الناس يتتبّعون السمك والصدف فعاد الماء فأخذ قوماً منهم {cite:shadharat-dhahab p. 228}. وعند ابن الجوزي زُلزلت الرملة ونابلس وبيت المقدس وعسقلان وغزة، وسقط في نابلس نحو ثلاثمائة قتيل وفي بيت المقدس محراب داود ومنارة عسقلان {cite:muntazam-ibn-al-jawzi j.8 p.419}."
  en: "In 425 a black wind tore through Nisibis uprooting orchards and throwing down a masonry palace, hail fell in shapes like hands, pillars and fingers, an earthquake ruined half of Ramla, villages were swallowed, part of the wall of Bayt al-Maqdis fell and Ascalon's congregational-mosque minaret collapsed, and the sea drew back some three farsakhs before returning to take people who had gone out gathering fish and shells {cite:shadharat-dhahab p. 228}."
