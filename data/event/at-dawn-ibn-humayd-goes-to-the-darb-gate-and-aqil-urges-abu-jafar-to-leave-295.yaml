id: "event/at-dawn-ibn-humayd-goes-to-the-darb-gate-and-aqil-urges-abu-jafar-to-leave-295"
class: event
kind: other
label:
  ar: "ابن حميد يخرج إلى باب الدرب عند الفجر، وعاقل وعبد الله بن عيسى يحثان أبا جعفر على الخروج، 295هـ"
  en: "At dawn Ibn Humayd goes to the Darb gate, and Aqil and Abdallah ibn Isa urge Abu Ja'far to leave, 295 AH, pp. 370"
  ur: "صبح ابن حمید درب دروازے کی طرف نکلتا ہے، اور عاقل اور عبداللہ بن عیسیٰ ابو جعفر کو نکلنے پر زور دیتے ہیں، 295ھ، ص370"
summary:
  ar: "عند صلاة الصبح بعد ليلة الجمعة خرج ابن حميد بمن تخلف معه من بني الحارث إلى باب الدرب. وأشار عاقل بن عبيد الله وعبد الله بن عيسى ومعهما جماعة من أهل نجران على أبي جعفر بالخروج من القرية، فكره ذلك ولم يقبله."
  en: "At the dawn prayer after the Friday night, Ibn Humayd went out to the Darb gate with the Banu al-Harith men who had stayed with him. Aqil ibn Ubaydallah and Abdallah ibn Isa, with a group of Najran men, urged Abu Ja'far to leave the village, and he disliked the advice and did not accept it."
  ur: "جمعہ کی رات کے بعد صبح کی نماز کے وقت ابن حمید اپنے ساتھ رہ جانے والے بنو حارث کے لوگوں کے ساتھ درب دروازے کی طرف نکلا۔ عاقل بن عبیداللہ اور عبداللہ بن عیسیٰ نے نجران کے کچھ لوگوں کے ساتھ ابو جعفر پر زور دیا کہ وہ بستی سے نکل جائے، مگر اس نے یہ بات ناپسند کی اور نہ مانی۔"
