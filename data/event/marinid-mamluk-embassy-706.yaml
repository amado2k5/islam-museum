id: event/marinid-mamluk-embassy-706
class: event
kind: other
label:
  ar: مهاداة السلطان أبي يعقوب والناصر محمد بن قلاوون
  en: The Abu Ya'qub–al-Nasir Muhammad embassy exchange
  es: "El intercambio entre la embajada de Abu Ya'qub y al-Nasir Muhammad"
  fr: "L'échange d'ambassades entre Abou Ya'qub et al-Nasir Muhammad"
  ur: "ابو یعقوب الناصر محمد سفارت خانہ کا تبادلہ"
summary:
  ar: "لما استوسق ملك السلطان أبي يعقوب المريني وصلحت السابلة أذن لأهل المغرب بركب الحاج في السفن إلى مكة سنة ثلاث وسبعمائة، وانتسخ مصحفاً رائق الصنعة كتبه أحمد بن حسن الكاتب المحسن واستكثر فيه من مغالق الذهب المنظم بخرزات الدر والياقوت ووقفه على الحرم الشريف، وسرح مع الحاج حامية زناتة تناهز خمسمائة وقلد القضاء عليهم محمد بن رغبوش، وأتحف صاحب الديار المصرية الناصر محمد بن قلاوون بهدية من طرف بلاد المغرب فيها الخيل العراب والمطايا الفارهة يقال إنها كانت أربعمائة، فلما وصلت هديته حسن موقعها لديه وجمع من طرف بلاده من الثياب والحيوان ما يستغرب جنسه من نوع الفيل والزرافة وأوفد بها الأمير التليلي ففصل من القاهرة أخريات سنة خمس وسبعمائة ووصل إلى سدة السلطان بالمنصورة من البلد الجديد في جمادى الآخرة سنة ست وسبعمائة، واهتز السلطان لقدومها واستركب."
  en: "When Abu Ya'qub's Marinid kingship ran steady and the roads mended, he licensed the Maghrebis' first sea-hajj in years for 703 — having a splendid mushaf transcribed by Ahmad ibn Hasan the master scribe, bound with gold clasps set in ordered pearls and rubies and endowed to the Sacred Mosque — sent with the pilgrims a Zanata guard near five hundred under qadi Muhammad ibn Raghbush, and a gift of Barb horses and four hundred rare mounts to al-Nasir Muhammad ibn Qalawun; the Egyptian sultan, pleased, gathered marvels of his lands — garments, an elephant and a giraffe — and sent them by Amir al-Tilili, leaving Cairo at the end of 705 and reaching the sultan's court at the Mansura of Fes Jdid in Jumada II 706, and the sultan rejoiced at their coming and mounted."
  es: "Cuando el reinado de Abu Ya'qub, de la dinastía Mariní, se consolidó y los caminos se repararon, autorizó la primera peregrinación marítima de los magrebíes en años para el año 703. Encargó un espléndido mushaf transcrito por el maestro escriba Ahmad ibn Hasan, encuadernado con broches de oro engastados en perlas y rubíes ordenados, y donado a la Mezquita Sagrada. Envió con los peregrinos una guardia Zanata de cerca de quinientos hombres bajo el mando del cadí Muhammad ibn Raghbush, y un regalo de caballos berberiscos y cuatrocientas monturas raras a al-Nasir Muhammad ibn Qalawun. El sultán egipcio, complacido, reunió maravillas de sus tierras (vestimentas, un elefante y una jirafa) y las envió por medio de Amir al-Tilili, partiendo de El Cairo a finales del año 705 y llegando a la corte del sultán en la Mansura de Fez Jdid en Jumada II del año 706. El sultán se regocijó con su llegada y montó a caballo."
  fr: "Lorsque le règne mérinide d'Abu Ya'qub se consolida et que les routes furent réparées, il autorisa le premier pèlerinage maritime des Maghrébins depuis des années pour l'année 703. Un magnifique mushaf, transcrit par le maître scribe Ahmad ibn Hasan et relié avec des fermoirs en or sertis de perles et de rubis, fut offert à la Mosquée sacrée. Il envoya avec les pèlerins une garde Zanata d'environ cinq cents hommes sous le commandement du cadi Muhammad ibn Raghbush, ainsi qu'un don de chevaux Barbes et de quatre cents montures rares à al-Nasir Muhammad ibn Qalawun. Le sultan égyptien, ravi, rassembla les merveilles de ses terres – vêtements, un éléphant et une girafe – et les envoya par l'émir al-Tilili, quittant le Caire à la fin de l'année 705 et atteignant la cour du sultan à Mansoura de Fès Jdid en Jumada II 706. Le sultan se réjouit de leur arrivée et monta à cheval."
  ur: "جب ابو یعقوب کی مرینی بادشاہت مستحکم ہوئی اور سڑکیں ٹھیک ہوگئیں، تو اس نے 703 سالوں میں مغرب کے پہلے سمندری حج کا لائسنس دیا - جس کا ایک شاندار مصحف احمد بن حسن نے لکھا ہے، جس میں موتیوں اور یاقوت سے جڑے ہوئے سونے کے ٹکڑوں سے بندھے ہوئے تھے - اور مقدس زاویدانوں کے ساتھ زاویدان بھیجا گیا تھا۔ قادی محمد بن راغبش کے ماتحت پانچ سو کے قریب، اور الناصر محمد بن قولون کو بارب گھوڑے اور چار سو نایاب پہاڑوں کا تحفہ؛ مصری سلطان نے خوش ہو کر اپنی زمینوں کے عجائبات - لباس، ایک ہاتھی اور ایک زرافہ اکٹھا کیا اور انہیں امیر الطلیلی کے ذریعے بھیجا، 705 کے آخر میں قاہرہ سے نکلا اور جمادی الثانی 706 میں منصورہ کے منصورہ میں سلطان کے دربار میں پہنچا اور 706ء میں ان کے بادشاہ کے پاس جایا۔"
