id: event/testament-of-fatima-bint-muhammad
class: event
kind: death
label:
  ar: وصية فاطمة بنت النبي في غسلها ونعشها ودفنها
  en: Testament of Fatima bint Muhammad about her washing, bier and burial
  ur: غسل، تابوت اور دفن کے بارے میں فاطمہ بنتِ محمد کی وصیت
  es: "Testamento de Fátima bint Muhammad sobre su lavado, féretro y entierro."
summary:
  ar: "تروي كتب السير أن فاطمة قالت لأسماء بنت عميس إنها تكره أن يُطرح على المرأة الثوب فيصفها، فأرتها نعشاً من جريد رطب رأته بالحبشة فأعجبها وأوصتها أن تغسلها هي وعلي وألا يدخل عليها أحد، حتى جاءت عائشة فمنعتها أسماء وأقرّها أبو بكر {cite:siyar-alam-nubala scan vol. 3 p. 98}. وتذكر الكتب أن علياً غسلها وأن أسماء ومعها سلمى أم رافع شاركتا، وقيل العباس، ودُفنت ليلاً، واختلفت الروايات فيمن صلى عليها بين علي والعباس وأبي بكر {cite:al-bidaya-wal-nihaya scan vol. 3 p. 717} {cite:isaba scan vol. 2 p. 1942}. وفي موضع قبرها خلاف: يقول الناس إنه بالبقيع، وينقل الواقدي أنه في زاوية من دار عقيل، بينه وبين الطريق سبعة أذرع {cite:isaba scan vol. 2 p. 1942}."
  en: "The biographical books report that Fatima told Asma bint Umays that she disliked the cloth being thrown over a woman so that it outlined her, whereupon Asma showed her a bier of fresh palm fronds she had seen in Abyssinia; Fatima liked it and asked Asma to wash her together with Ali and that no one else enter, until Aisha came and Asma refused her entry and Abu Bakr upheld Asma {cite:siyar-alam-nubala scan vol. 3 p. 98}. The books say Ali washed her, with Asma and Salma Umm Rafi taking part, and in one account al-Abbas, and that she was buried by night; the reports differ over who prayed over her, Ali, al-Abbas or Abu Bakr {cite:al-bidaya-wal-nihaya scan vol. 3 p. 717} {cite:isaba scan vol. 2 p. 1942}. The place of her grave is disputed: people say it is in al-Baqi, while al-Waqidi relays that it is in a corner of the house of Aqil, seven cubits from the road {cite:isaba scan vol. 2 p. 1942}."
  ur: "سیرت کی کتابیں بتاتی ہیں کہ فاطمہ نے اسماء بنت عمیس سے کہا کہ انھیں یہ ناپسند ہے کہ عورت پر کپڑا ڈال دیا جائے اور وہ اس کے جسم کا نقشہ ظاہر کرے، تو اسماء نے انھیں حبشہ میں دیکھا ہوا تازہ کھجور کی شاخوں کا تابوت دکھایا؛ فاطمہ کو پسند آیا اور انھوں نے وصیت کی کہ اسماء انھیں علی کے ساتھ مل کر غسل دیں اور کوئی اور اندر نہ آئے، یہاں تک کہ عائشہ آئیں تو اسماء نے انھیں روک دیا اور ابوبکر نے اسماء کی بات برقرار رکھی {cite:siyar-alam-nubala scan vol. 3 p. 98}. کتابوں کے مطابق علی نے انھیں غسل دیا، اسماء اور سلمیٰ ام رافع نے ساتھ دیا، ایک قول میں عباس بھی، اور وہ رات کو دفن ہوئیں؛ جنازے کی امامت میں علی، عباس اور ابوبکر کے اقوال مختلف ہیں {cite:al-bidaya-wal-nihaya scan vol. 3 p. 717} {cite:isaba scan vol. 2 p. 1942}. قبر کے مقام میں اختلاف ہے: لوگ کہتے ہیں بقیع میں ہے، جبکہ واقدی کے واسطے سے نقل ہے کہ وہ دارِ عقیل کے ایک کونے میں ہے، سڑک سے سات ہاتھ کے فاصلے پر {cite:isaba scan vol. 2 p. 1942}."
  es: "Los libros biográficos informan que Fátima le dijo a Asma bint Umays que no le gustaba que se echara una tela sobre una mujer de manera que la delineara, entonces Asma le mostró una litera de hojas frescas de palma que había visto en Abisinia; a Fátima le gustó y le pidió a Asma que la lavara junto con Ali y que nadie más entrara, hasta que llegó Aisha y Asma le negó la entrada y Abu Bakr apoyó a Asma {cite:siyar-alam-nubala scan vol. 3 p. 98}. Los libros dicen que Ali la lavó, con la participación de Asma y Salma Umm Rafi, y en un relato al-Abbas, y que fue enterrada de noche; los informes difieren sobre quién oró por ella, Ali, al-Abbas o Abu Bakr {cite:al-bidaya-wal-nihaya scan vol. 3 p. 717} {cite:isaba scan vol. 2 p. 1942}. El lugar de su tumba es objeto de controversia: algunos dicen que está en al-Baqi, mientras que al-Waqidi relata que se encuentra en un rincón de la casa de Aqil, a siete codos del camino {cite:isaba scan vol. 2 p. 1942}."
