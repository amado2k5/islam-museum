summary:
  en: "On the Friday of his entry into Medina, prayer time overtook the Prophet among Banu Salim ibn Awf, and he led a congregation of a hundred men in the mosque in the valley bottom — counted in the sira as the first Jumu'a."
  ar: "أدركت الجمعة النبي وهو في طريقه إلى المدينة في بني سالم بن عوف، فجمع بهم في المسجد الذي في بطن الوادي وكانوا مائة رجل؛ وتُعدّ في السيرة أول جمعة."
