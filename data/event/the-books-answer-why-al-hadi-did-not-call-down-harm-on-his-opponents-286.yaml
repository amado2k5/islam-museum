id: event/the-books-answer-why-al-hadi-did-not-call-down-harm-on-his-opponents-286
class: event
kind: other
label:
  ar: 'جواب صاحب الكتاب عن سؤال: لماذا لم يدعُ الهادي على أعدائه؟'
  en: 'The book''s answer to the question: why did al-Hadi not call down harm on his opponents?'
  ur: 'کتاب کا جواب اس سوال پر: ہادی نے اپنے مخالفوں پر بددعا کیوں نہ کی؟'
summary:
  ar: 'يورد الراوي اعتراضاً مفترضاً: إن كان الهادي مستجاب الدعوة فلِمَ يقاتله أعداء كثيرون ولم يدعُ عليهم؟ ويجيب بأن الله يعطي أولياءه ويمتحنهم ليضاعف لهم الثواب، ويذكر ابتلاء النبي من قومه وقتل الحسين وزيد بن علي، ويفسّر آية «وكذلك جعلنا لكل نبي عدواً» بأن الجعل هنا تسمية، ويعد بكتاب مفرد في علامات الإمامة.'
  en: 'The narrator poses an imagined objection: if al-Hadi''s prayer is answered, why do many enemies fight him and why does he not call down harm on them? He answers that God gives His friends and tries them to multiply their reward, points to the trials of the Prophet from his own people and the killing of al-Husayn and Zayd ibn Ali, reads "thus We made for every prophet an enemy" as naming rather than creating, and promises a separate book on the signs of the imamate.'
  ur: 'راوی ایک فرضی اعتراض اٹھاتا ہے: اگر ہادی کی دعا قبول ہوتی ہے تو بہت سے دشمن ان سے کیوں لڑتے ہیں اور وہ ان پر بددعا کیوں نہیں کرتے؟ وہ جواب دیتا ہے کہ اللہ اپنے دوستوں کو دیتا اور آزماتا ہے تاکہ ثواب بڑھائے، نبی کی اپنی قوم سے آزمائشوں اور حسین اور زید بن علی کے قتل کا ذکر کرتا ہے، «ہم نے ہر نبی کے لیے دشمن بنائے» کو بنانے کے بجائے نام رکھنا قرار دیتا ہے، اور امامت کی نشانیوں پر الگ کتاب کا وعدہ کرتا ہے۔'
