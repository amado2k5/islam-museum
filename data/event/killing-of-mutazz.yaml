label: { ar: "قتل المعتز بالله", en: "Killing of al-Mu'tazz", es: "Asesinato de al-Mu'tazz", fr: "Meurtre d'al-Mu'tazz", ur: "معتز کا قتل", tr: "Al-Mu'tazz Billah öldürüldü.", id: "Al-Mu'tazz Billah terbunuh" }
summary:
  ar: "صار الأتراك إلى المعتز بأجمعهم لأربع بقين من رجب سنة خمس وخمسين ومائتين لما رأوا إقدامه على قتل رؤسائهم واستعماله المغاربة والفراعنة دونهم، يقودهم صالح بن وصيف مع قوادهم، فطلبوا بالمهتدي من مدينة السلام فأتي به إلى سامرا في يوم وليلة، وأجاب المعتز إلى الخلع على الأمان، وأبى المهتدي أن يقبل البيعة حتى يراه فيعانقه، ثم رد المعتز إلى محبسه فقتل فيه بعد خلعه بستة أيام، وأكثرت الشعراء فيه رثاء {cite:muruj-al-dhahab p. 553-554}."
  en: "Rajab 255: Salih ibn Wasif leads the Turks to depose al-Mu'tazz; al-Muhtadi is fetched from Baghdad, embraces his deposed cousin, and al-Mu'tazz is killed in his cell six days later {cite:muruj-al-dhahab p. 553-554}."
  es: "Rajab 255: Salih ibn Wasif dirige a los turcos para deponer a al-Mu'tazz; al-Muhtadi es traído de Bagdad, abraza a su primo depuesto y al-Mu'tazz es asesinado en su celda seis días después {cite:muruj-al-dhahab p. 553-554}."
  fr: "Rajab 255: Salih ibn Wasif conduit les Turcs à déposer al-Mu'tazz; al-Muhtadi est ramené de Bagdad, embrasse son cousin déchu, et al-Mu'tazz est tué dans sa cellule six jours plus tard {cite: muruj-al-dhahab p. 553-554}."
  ur: "رجب 255: صالح بن واصف المعتز کو معزول کرنے کے لیے ترکوں کی قیادت کرتا ہے۔ المحتدی کو بغداد سے لایا جاتا ہے، اپنے معزول کزن کو گلے لگاتا ہے، اور المعتز کو چھ دن بعد اس کے حجرے میں قتل کر دیا جاتا ہے۔ 553-554}۔"
  tr: "Türkler, 255 yılının Receb ayının dördüncü gününde, liderlerini öldürüp yerlerine Salih bin Wasif önderliğindeki Mağribileri ve Firavunları görevlendirme cesaretini görünce, hep birlikte Mu'tazz'ın yanına gittiler. Bunun üzerine Barış Şehri'nden Muhtadi'yi istediler ve Muhtadi bir gecede Samarra'ya getirildi. Mu'tazz, güvenlik şartıyla tahttan indirilmeyi kabul etti, ancak Muhtadi onu görüp kucaklayana kadar biat etmeyi reddetti. Daha sonra Mu'tazz hapishanesine geri gönderildi ve tahttan indirilmesinden altı gün sonra orada öldürüldü. Şairler onun için birçok mersiye yazdılar."
  id: "Pada tanggal empat Rajab tahun dua ratus lima puluh lima, seluruh pasukan Turki mendatangi Al-Mu'tazz, ketika mereka melihat keberaniannya membunuh para pemimpin mereka dan menggantikan mereka dengan orang-orang Maghreb dan Firaun, yang dipimpin oleh Salih bin Wasif beserta para komandannya. Maka mereka meminta Al-Muhtadi dari Kota Perdamaian, dan ia dibawa ke Samarra dalam waktu sehari semalam. Al-Mu'tazz menyetujui penggulingannya dengan syarat keselamatan, dan Al-Muhtadi menolak untuk mengucapkan sumpah setia sampai ia melihat dan memeluknya. Kemudian Al-Mu'tazz dikembalikan ke penjara, di mana ia dibunuh enam hari setelah penggulingannya, dan para penyair menggubah banyak elegi untuknya."
