label: { ar: "قتل المعتز بالله", en: "Killing of al-Mu'tazz" }
summary:
  ar: "صار الأتراك إلى المعتز بأجمعهم لأربع بقين من رجب سنة خمس وخمسين ومائتين لما رأوا إقدامه على قتل رؤسائهم واستعماله المغاربة والفراعنة دونهم، يقودهم صالح بن وصيف مع قوادهم، فطلبوا بالمهتدي من مدينة السلام فأتي به إلى سامرا في يوم وليلة، وأجاب المعتز إلى الخلع على الأمان، وأبى المهتدي أن يقبل البيعة حتى يراه فيعانقه، ثم رد المعتز إلى محبسه فقتل فيه بعد خلعه بستة أيام، وأكثرت الشعراء فيه رثاء {cite:muruj-al-dhahab p. 553-554}."
  en: "Rajab 255: Salih ibn Wasif leads the Turks to depose al-Mu'tazz; al-Muhtadi is fetched from Baghdad, embraces his deposed cousin, and al-Mu'tazz is killed in his cell six days later {cite:muruj-al-dhahab p. 553-554}."
