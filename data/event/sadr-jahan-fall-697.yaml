label:
  ar: "سقوط صدر جهان ومحاكمته 697"
  en: "Fall and trial of Sadr Jahan, 697 AH"
  ur: "صدر جہاں کا زوال اور مقدمہ، 697ھ"
  fr: "Chute et procès de Sadr Jahan, 697 de l'Hégire"
  es: "Caída y juicio de Sadr Jahan, 697 de la Hégira"
summary:
  ar: "في جمادى من سنة 697 هـ قدّم صدر جهان اتهاماً رسمياً أمام غازان خان ضد رشيد الدين، فبيّن غازان له مبلغ جرمه، ثم ورد في النص قول يدعو إلى ألا يُرد على هذه المفتريات، وليس واضحاً في الصفحة من قائله، فاعترف صدر الدين ببراءة صديقه {cite:jami-al-tawarikh-khashshab-1960 p. 39}. ثم اتهمه قطب الدين ومعين الدين وأمراء آخرون بالاختلاس، فاعتقد أن الاتهام جاء بتحريض من رشيد الدين {cite:jami-al-tawarikh-khashshab-1960 p. 39}. وفي رجب من السنة نفسها وقعت خصومة بينه وبين الأمير كتلكشاه، انتهت بشكواه إلى السلطان، فحوكم صدر الدين أمام مجلس وحُكم عليه بالإعدام، وقُسّمت أعمال الوزارة بين رشيد الدين وسعد الدين {cite:jami-al-tawarikh-khashshab-1960 p. 40}{cite:jami-al-tawarikh-khashshab-1960 p. 41}. ويرى الخشاب أن عنوان السنة في النص الأصل يجب أن يكون 697 لا 699 لأن سياق الأحداث يقتضيه {cite:jami-al-tawarikh-khashshab-1960 p. 41}."
  en: "In Jumada of 697 AH Sadr Jahan made a formal accusation against Rashid al-Din before Ghazan Khan. Ghazan showed Sadr Jahan the gravity of his charge; the text then has words advising that the slanders not be answered, the speaker not being clear on the OCR page, and Sadr Jahan then acknowledged his old friend's innocence {cite:jami-al-tawarikh-khashshab-1960 p. 39}. Other officials then accused Sadr Jahan of embezzlement, and he believed Rashid had incited the charge {cite:jami-al-tawarikh-khashshab-1960 p. 39}. In Rajab of the same year a quarrel with the amir Kitlukshah reached the sultan; Sadr Jahan was tried before a council, sentenced to death, and the vizierate was divided between Rashid al-Din and Sa'd al-Din {cite:jami-al-tawarikh-khashshab-1960 p. 40}{cite:jami-al-tawarikh-khashshab-1960 p. 41}. The translator reads the year as 697, not 699, from the order of events {cite:jami-al-tawarikh-khashshab-1960 p. 41}. The source here is Rashid al-Din's own account as the introduction presents it; no other chronicle is read for this batch."
  es: "En yumada de 697 de la Hégira, Sadr Jahan presentó una acusación formal contra Rashid al-Din ante Ghazan Jan; Ghazan le mostró la gravedad de su cargo; el texto da luego palabras que aconsejan no responder a esas calumnias, sin que el hablante quede claro en la página, y Sadr Jahan reconoció entonces la inocencia de su antiguo amigo {cite:jami-al-tawarikh-khashshab-1960 p. 39}. Luego otros funcionarios lo acusaron de malversación, y él creyó que Rashid había instigado la acusación {cite:jami-al-tawarikh-khashshab-1960 p. 39}. En rayab del mismo año una disputa con el emir Kitlukshah llegó al sultán; Sadr Jahan fue juzgado ante un consejo, condenado a muerte, y el visirato se dividió entre Rashid al-Din y Sa'd al-Din {cite:jami-al-tawarikh-khashshab-1960 p. 40}{cite:jami-al-tawarikh-khashshab-1960 p. 41}. El traductor lee el año como 697 y no 699, por el orden de los hechos {cite:jami-al-tawarikh-khashshab-1960 p. 41}."
  fr: "En jumada 697 de l'Hégire, Sadr Jahan porta une accusation formelle contre Rashid al-Din devant Ghazan Khan ; Ghazan lui fit mesurer la gravité de son accusation ; le texte donne ensuite des paroles conseillant de ne pas répondre à ces calomnies, sans que le locuteur soit clair sur la page, et Sadr Jahan reconnut alors l'innocence de son ancien ami {cite:jami-al-tawarikh-khashshab-1960 p. 39}. D'autres dignitaires l'accusèrent ensuite de détournement, et il crut que Rashid avait incité à cette accusation {cite:jami-al-tawarikh-khashshab-1960 p. 39}. En rajab de la même année, une querelle avec l'émir Kitlukshah parvint au sultan ; Sadr Jahan fut jugé devant un conseil, condamné à mort, et le vizirat fut partagé entre Rashid al-Din et Sa'd al-Din {cite:jami-al-tawarikh-khashshab-1960 p. 40}{cite:jami-al-tawarikh-khashshab-1960 p. 41}. Le traducteur lit l'année 697 et non 699, d'après l'ordre des faits {cite:jami-al-tawarikh-khashshab-1960 p. 41}."
  ur: "جمادی میں 697ھ کو صدر جہان نے غازان خان کے سامنے رشید الدین کے خلاف باقاعدہ الزام لگایا؛ غازان نے صدر جہان کو ان کے الزام کی سنگینی بتائی، پھر متن میں ایسے الفاظ ہیں جو ان بہتانوں کا جواب نہ دینے کا مشورہ دیتے ہیں، اور بولنے والا صفحے پر واضح نہیں، تو صدر جہان نے اپنے پرانے دوست کی بے گناہی کا اعتراف کیا {cite:jami-al-tawarikh-khashshab-1960 p. 39}۔ پھر دوسرے امرا نے صدر جہان پر غبن کا الزام لگایا، اور انہوں نے سمجھا کہ یہ الزام رشید الدین کی اکساہٹ پر لگا {cite:jami-al-tawarikh-khashshab-1960 p. 39}۔ اسی سال رجب میں امیر کتلک شاہ سے ان کا جھگڑا سلطان تک پہنچا؛ صدر جہان کا ایک مجلس میں مقدمہ ہوا، انہیں موت کی سزا ہوئی، اور وزارت کا کام رشید الدین اور سعد الدین میں تقسیم ہوا {cite:jami-al-tawarikh-khashshab-1960 p. 40}{cite:jami-al-tawarikh-khashshab-1960 p. 41}۔ مترجم واقعات کی ترتیب سے سال کو 697 پڑھتے ہیں، 699 نہیں {cite:jami-al-tawarikh-khashshab-1960 p. 41}۔"
