id: event/the-raid-on-the-gate-of-sanaa-during-the-fitr-sermon-and-the-sortie-to-alab-288
class: event
kind: other
label:
  ar: "الإغارة على باب صنعاء أثناء خطبة الفطر وخروج الهادي إلى علب، شوال 288هـ"
  en: "The raid on the gate of Sana'a during the Fitr sermon and al-Hadi's sortie to Alab, Shawwal 288 AH"
  ur: "عید الفطر کے خطبے کے دوران صنعاء کے دروازے پر حملہ اور ہادی کی علب کی طرف مہم، شوال 288ھ"
  es: "El asalto a la puerta de Saná durante el sermón del Fitr y la salida de al-Hadi a Alab, Shawwal 288 AH."
  fr: "Le raid sur la porte de Sanaa pendant le sermon de l'Aïd el-Fitr et la sortie d'al-Hadi à Alab, Shawwal 288 AH"
  tr: "Bab Sana'a'ya Ramazan Bayramı hutbesi sırasında yapılan baskın ve Hadi'nin Şevval 288 Hicri yılında Alab'a gidişi"
  id: "Penyerbuan ke Bab Sana'a saat khutbah Idul Fitri dan keberangkatan al-Hadi ke Alab, Syawal 288 Hijriah"
summary:
  ar: "أقام الهادي بصنعاء شهر رمضان، فلما كان يوم الفطر خرج إلى المصلى وفيما هو يخطب أغار القوم بخيلهم على باب صنعاء، فأمر أبا العتاهية فخرج في الخيل وطردهم؛ وفي الجمعة الثانية للفطر خرج بعسكره وجعل جيشاً يطلع على من بنقم وسار بالخيل إلى علب لمقابلة أهل بيت بوس."
  en: "Al-Hadi stayed in Sana'a through Ramadan, and on the day of the Fitr he went out to the prayer place; while he was preaching the men raided the gate of Sana'a with their horse, and he ordered Abu al-Atahiya to ride out and he drove them off; on the second Friday after the Fitr he went out with his army, sent a force up against those at Nuqm and rode with the horse to Alab to face the people of Bayt Bus."
  ur: "ہادی نے رمضان صنعاء میں گزارا، عید الفطر کے دن وہ عیدگاہ گئے اور جب خطبہ دے رہے تھے تو مخالفوں نے اپنے سواروں کے ساتھ صنعاء کے دروازے پر حملہ کیا؛ انہوں نے ابو العتاہیہ کو حکم دیا تو وہ سواروں کے ساتھ نکلے اور انہیں بھگا دیا؛ فطر کے بعد دوسرے جمعے کو وہ اپنے لشکر کے ساتھ نکلے، ایک دستہ نقم پر چڑھایا اور سواروں کے ساتھ بیت بوس والوں کے مقابل علب گئے۔"
  es: "Al-Hadi permaneció en Sana'a durante el Ramadán, y el día del Fitr salió al lugar de oración; mientras predicaba, unos hombres asaltaron la puerta de Sana'a a caballo, y él ordenó a Abu al-Atahiya que saliera y los ahuyentó; el segundo viernes después del Fitr salió con su ejército, envió una fuerza contra los de Nuqm y cabalgó hasta Alab para enfrentarse a la gente de Bayt Bus."
  fr: "Al-Hadi resta à Sanaa pendant tout le Ramadan, et le jour de l'Aïd el-Fitr, il se rendit au lieu de prière; pendant qu'il prêchait, des hommes attaquèrent la porte de Sanaa à cheval, et il ordonna à Abu al-Atahiya de partir à cheval et il les repoussa; le deuxième vendredi après l'Aïd el-Fitr, il sortit avec son armée, envoya une force contre ceux de Nuqm et se rendit à cheval à Alab pour affronter les habitants de Bayt Bus."
  tr: "El-Hadi, Ramazan ayı boyunca Sana'a'da kaldı. Ramazan Bayramı günü namaz kılınacak yere çıktı ve vaaz verirken halk atlarıyla Sana'a kapısına saldırdı. Bunun üzerine Ebu el-Atahiye'ye atlarla birlikte çıkıp onları kovmasını emretti. Ramazan Bayramı'nın ikinci Cuma günü ordusuyla birlikte çıktı ve Naqam'dakileri gözetlemek için bir ordu görevlendirdi; kendisi de atlarıyla birlikte Alab'a giderek Beyt Bos halkıyla buluştu."
  id: "Al-Hadi tinggal di Sana'a selama bulan Ramadan. Pada hari Idul Fitri, beliau pergi ke tempat shalat, dan ketika sedang berkhutbah, orang-orang menyerang gerbang Sana'a dengan kuda-kuda mereka. Maka beliau memerintahkan Abu al-Atahiyah untuk keluar dengan kuda-kuda dan mengusir mereka. Pada hari Jumat kedua Idul Fitri, beliau keluar dengan pasukannya dan memerintahkan pasukan untuk mengawasi orang-orang di Naqam, dan beliau berbaris dengan kuda-kuda ke Alab untuk menemui penduduk Beit Bos."
