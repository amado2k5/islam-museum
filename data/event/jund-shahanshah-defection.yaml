id: event/jund-shahanshah-defection
class: event
kind: other
label: { ar: "إسلام جند شاهنشاه وهم حمراء ديلم", en: "The Jund Shahanshah's Conversion — the Hamra' Daylam", es: "La conversión del Jund Shahanshah: el Hamra' Daylam", fr: "La conversion du Jund Shahanshah - le Hamra' Daylam", ur: "جند شہنشاہ کی تبدیلی - حمرا دیلام", tr: "İslam Jund Shahanshah ve Hamra Daylam", id: "Islam Jund Shahanshah dan Hamra Daylam" }
summary:
  ar: "عند البلاذري عن مسمر بن كدام: كان مع رستم يوم القادسية أربعة آلاف يسمون جند شاهنشاه فاستأمنوا على أن ينزلوا حيث أحبوا ويحالفوا من أحبوا ويفرض لهم في العطاء فأعطوا الذي سألوه وحالفوا زهرة بن حوية السعدي من بني تميم وأنزلهم سعد بحيث اختاروا وفرض لهم في الألف ألف وكان لهم نقيب منهم يقال له ديل فقيل حمراء ديلم ثم إن زياداً سيّر بعضهم إلى بلاد الشام بأمر معاوية فهم يدعون الفرس وسيّر منهم قوماً إلى البصرة فدخلوا في الأساورة الذين بها والعرب تسمّي العجم حمراء ويقولون جُنت من حمراء ديلم كقولهم جُنت من جهينة وسمع أبو مسعود من يذكر أن هؤلاء الأساورة كانوا مقيمين بإزاء الديلم فلما غشيهم المسلمون بقزوين أسلموا على مثل ما أسلم عليه أساورة البصرة وأتوا الكوفة فأقاموا بها وقال المدائني كان أبرويز وجّه إلى الديلم فأتى بأربعة آلاف وكانوا خدمه وخاصته ثم كانوا على تلك المنزلة بعده وشهدوا القادسية مع دوستم فلما قتل وانهزم المجوس اعتزلوا وقالوا ما نحن كهؤلاء ولا لنا ملجأ وأثرنا عندهم غير جميل والرأي لنا أن ندخل معهم في دينهم فنعزّ بهم فقال سعد ما لهؤلاء فأتاهم المغيرة بن شعبة فسألهم عن أمرهم فأخبروه بخبرهم وقالوا ندخل في دينكم فرجع إلى سعد فأخبره فأمنهم فأسلموا وشهدوا فتح المدائن مع سعد."
  en: "In al-Baladhuri via Musammar ibn Kiddam: with Rustam at al-Qadisiyya were four thousand called the Shahanshah's troops; they were granted safe-conduct to settle where they wished, ally with whom they wished, and be allotted stipends — they allied with Zuhra ibn Hawiyya al-Sa'di of Banu Tamim, Sa'd settled them where they chose and fixed a thousand-thousand for them, their naqib being called Dayl — whence 'Hamra' Daylam'. Ziyad later moved some to Syria at Mu'awiya's order — called al-Furs — and some to Basra joining its asawira; the Arabs call the 'ajam hamra', saying 'clan of Hamra' Daylam' as 'clan of Juhayna'. Abu Mas'ud heard these asawira had lived opposite Daylam and converted when the Muslims came to Qazwin, on the same terms as Basra's asawira, then came and settled at Kufa. Al-Mada'ini: Khusraw had sent to Daylam and brought four thousand — his servants and elite, remaining so after him — who witnessed al-Qadisiyya with Dustam; when he fell and the Magians routed they withdrew, saying 'we are not like these, we have no refuge, our standing with them is ugly — our view is to enter their religion and be mighty through them'; Sa'd asked what ailed them, al-Mughira went to them, they told him 'we will enter your religion' — he informed Sa'd, who safe-conducted them; they converted and witnessed al-Mada'in's conquest with Sa'd."
  es: "En al-Baladhuri, a través de Musammar ibn Kiddam: con Rustam en al-Qadisiyya había cuatro mil llamados las tropas del Shahanshah; se les concedió salvoconducto para establecerse donde quisieran, aliarse con quien quisieran y recibir estipendios; se aliaron con Zuhra ibn Hawiyya al-Sa'di de Banu Tamim, Sa'd los estableció donde eligieron y les asignó mil mil, su naqib se llamaba Dayl, de donde proviene 'Hamra' Daylam'. Ziyad luego trasladó a algunos a Siria por orden de Mu'awiya, llamados al-Furs, y a otros a Basora uniéndose a su asawira; los árabes llaman al 'ajam hamra', diciendo 'clan de Hamra' Daylam' como 'clan de Juhayna'. Abu Mas'ud oyó que estos asawira habían vivido frente a Daylam y se convirtieron cuando los musulmanes llegaron a Qazwin, en los mismos términos que los asawira de Basora, y luego vinieron y se establecieron en Kufa. Al-Mada'ini: Khusraw había enviado a Daylam y trajo a cuatro mil —sus sirvientes y élite, que permanecieron así después de él— que presenciaron a al-Qadisiyya con Dustam; cuando cayó y los magos fueron derrotados, se retiraron diciendo: «No somos como ellos, no tenemos refugio, nuestra posición con ellos es fea; nuestro objetivo es entrar en su religión y ser poderosos a través de ellos»; Sa'd preguntó qué les afligía, al-Mughira fue a verlos, le dijeron: «Entraremos en tu religión» —él informó a Sa'd, quien los protegió; se convirtieron y presenciaron la conquista de al-Mada'ini con Sa'd."
  fr: "Dans al-Baladhuri, via Musammar ibn Kiddam: avec Rustam à al-Qadisiyya se trouvaient quatre mille hommes appelés les troupes du Shahanshah; ils reçurent un sauf-conduit leur permettant de s’installer où bon leur semblait, de s’allier avec qui ils voulaient et de recevoir une solde. Ils s’allièrent à Zuhra ibn Hawiyya al-Sa’di des Banu Tamim. Sa’d les installa où ils choisirent et leur accorda mille mille hommes. Leur naqib était appelé Dayl, d’où « Hamra’ Daylam’ ». Plus tard, Ziyad en envoya certains en Syrie sur ordre de Mu’awiya – ils furent appelés al-Furs – et d’autres à Bassora, rejoignant son asawira. Les Arabes les appellent « ajam hamra », et disent « clan de Hamra’ Daylam’ » comme « clan de Juhayna ». Abou Mas'ud apprit que ces asawira avaient vécu en face de Daylam et s'étaient convertis lorsque les musulmans arrivèrent à Qazwin, aux mêmes conditions que les asawira de Bassora, puis s'étaient installés à Koufa. Al-Mada'ini rapporta que Khosro avait envoyé des messagers à Daylam et ramené quatre mille hommes – ses serviteurs et son élite, qui le restèrent après lui – qui furent témoins de la victoire d'al-Qadisiyya avec Dustam. Après la chute de Daylam et la déroute des Mages, ils se retirèrent, disant: « Nous ne sommes pas comme eux, nous n'avons aucun refuge, notre relation avec eux est déplorable; notre but est d'embrasser leur religion et de devenir puissants grâce à eux. » Sa'd leur demanda ce qui les préoccupait, al-Mughira alla à leur rencontre, et ils lui dirent: « Nous allons embrasser votre religion. » Il en informa Sa'd, qui les sauva. Ils se convertirent et assistèrent à la conquête d'al-Mada'in avec Sa'd."
  ur: "البلادوری میں مسمر بن کدام کے ذریعے: قادسیہ میں رستم کے ساتھ چار ہزار تھے جن کو شہنشاہ کا لشکر کہا جاتا ہے۔ انہیں جہاں چاہیں آباد ہونے کی اجازت دی گئی، جس کے ساتھ چاہیں حلف اٹھائیں اور انہیں وظیفہ دیا گیا- انہوں نے بنو تمیم کی زہرہ بن حویہ السعدی کے ساتھ الحاق کیا، سعد نے انہیں وہیں آباد کیا جہاں انہوں نے منتخب کیا اور ان کے لیے ایک ہزار مقرر کیے، ان کے نقیب کو دیالرحمٰن کہا گیا۔ زیاد بعد میں کچھ معاویہ کے حکم پر شام چلا گیا – جسے الفورس کہا جاتا ہے – اور کچھ اس کے اساویرہ میں شامل ہو کر بصرہ چلے گئے۔ عرب 'عجم حمرہ' کو کہتے ہیں' قبیلہ حمرہ' دیلام' کو 'قبیلہ جہینہ' کہتے ہیں۔ ابو مسعود نے سنا کہ یہ اساویرہ دیلم کے مخالف رہتے تھے اور جب مسلمان قزوین میں آئے تو بصرہ کے اساویرہ کی طرح مذہب تبدیل کیا، پھر آکر کوفہ میں آباد ہوئے۔ المدائنی: خسرو نے دیلام کی طرف بھیجا اور چار ہزار کو لایا - اس کے نوکر اور اشرافیہ جو اس کے بعد باقی رہ گئے - جنہوں نے دستم کے ساتھ القدسیہ کو دیکھا۔ جب وہ گرا اور مجوسیوں نے شکست دی تو وہ پیچھے ہٹ گئے، یہ کہتے ہوئے کہ 'ہم ان جیسے نہیں ہیں، ہمارے پاس کوئی جائے پناہ نہیں، ان کے ساتھ ہمارا موقف بدصورت ہے - ہمارا نظریہ ان کے دین میں داخل ہونا اور ان کے ذریعے غالب ہونا ہے'؛ سعد نے پوچھا کہ انہیں کیا تکلیف ہے، المغیرہ ان کے پاس گیا، انہوں نے اس سے کہا کہ 'ہم تمہارے دین میں داخل ہوں گے' - اس نے سعد کو اطلاع دی، جس نے ان کی حفاظت کی۔ انہوں نے تبدیل کیا اور سعد کے ساتھ مدین کی فتح کا مشاہدہ کیا۔"
  tr: "El-Baladhuri, Musammar ibn Kadam'dan rivayetle şöyle demiştir: Kadısiye günü, Rüştam'ın yanında Şahanshah'ın askerleri diye adlandırılan dört bin adam vardı. Güvenli geçiş aradılar, istedikleri yere yerleşmeyi, istedikleriyle ittifak kurmayı ve maaş almayı kabul ettiler. İstekleri yerine getirildi ve Beni Tamim kabilesinden Zuhrah ibn Huwayyah al-Sa'di ile ittifak kurdular. Sa'd onları istedikleri yere yerleştirdi ve onlara bin dirhem verdi. Aralarında Dayl adında bir lider vardı, bu yüzden Hamra' Daylam adı verildi. Sonra Ziyad, Muaviye'nin emriyle onlardan bazılarını Levant'a gönderdi ve onlara Persler denir. Ayrıca onlardan bazılarını Basra'ya gönderdi ve orada Asavire'ye (bir Pers askeri birliği) katıldılar. Araplar Perslere \"Hamra'\" derler ve \"Ben Hamra' Daylam'danım\" derler, tıpkı \"Ben Cühayne'denim\" der gibi. Ebu Mes'ud, birinin bu Asavirelerin Daylam'ın karşısında konuşlandığını söylediğini duydu. Müslümanlar Kazvin'de onlara saldırdığında, Basra Asavireleri gibi İslam'ı kabul ettiler ve Kûfe'ye gidip oraya yerleştiler. El-Mada'ini, Parviz'in Daylam'a dört bin adam gönderdiğini, bunların onun hizmetkarları ve sırdaşları olduğunu söyledi. Sonra onlar da bu mevkide kaldılar ve Dostam ile Kadisiye Savaşı'na şahit oldular. Parviz öldürüldüğünde ve Mecusiler yenilgiye uğradığında geri çekilip, \"Biz bu insanlar gibi değiliz ve sığınacak yerimiz yok. Onlar üzerinde iyi bir etkimiz yok. Bizim görüşümüz, onların dinine girmek ve onlar tarafından onurlandırılmaktır.\" dediler. Saad, \"Bu insanlarda ne yanlış var?\" dedi. Sonra El-Muğire bin Şube onlara geldi ve durumlarını sordu. Ona hikayelerini anlattılar ve \"Sizin dininize gireceğiz.\" dediler. Böylece Saad'ın yanına döndü ve durumu ona bildirdi; Saad da onlara güvence verdi, böylece İslam'ı kabul ettiler ve Saad ile birlikte Medine'nin fethine şahit oldular."
  id: "Al-Baladhuri, berdasarkan riwayat Musammar ibn Kadam, berkata: Pada hari Qadisiyah, Rustam memiliki empat ribu orang bersamanya, yang disebut tentara Shahanshah. Mereka meminta jalan aman, setuju untuk menetap di mana pun mereka inginkan, bersekutu dengan siapa pun yang mereka pilih, dan menerima tunjangan. Mereka diberi apa yang mereka minta dan bersekutu dengan Zuhrah ibn Huwayyah al-Sa'di dari Bani Tamim. Sa'd menempatkan mereka di tempat yang mereka pilih dan memberi mereka seribu dirham. Mereka memiliki seorang pemimpin di antara mereka yang bernama Dayl, sehingga muncullah nama Hamra' Daylam. Kemudian, Ziyad mengirim sebagian dari mereka ke Levant atas perintah Mu'awiyah, dan mereka disebut orang Persia. Dia juga mengirim sebagian dari mereka ke Basra, di mana mereka bergabung dengan Asawirah (unit militer Persia). Orang Arab menyebut orang Persia \"Hamra'\" dan berkata, \"Saya dari Hamra' Daylam,\" sama seperti mereka berkata, \"Saya dari Juhaynah.\" Abu Mas'ud mendengar seseorang menyebutkan bahwa kaum Asawirah ini ditempatkan di seberang Daylam. Ketika kaum Muslim menyerang mereka di Qazvin, mereka masuk Islam, seperti yang dilakukan kaum Asawirah Basra, dan mereka pergi ke Kufa dan menetap di sana. Al-Mada'ini berkata bahwa Parviz mengirim empat ribu orang kepada Daylam, yang merupakan pelayan dan orang kepercayaannya. Kemudian mereka berada di posisi itu setelahnya dan menyaksikan Pertempuran Qadisiyah dengan Dostam. Ketika ia terbunuh dan kaum Majusi dikalahkan, mereka mundur dan berkata, “Kami tidak seperti orang-orang ini, dan kami tidak memiliki tempat berlindung. Pengaruh kami terhadap mereka tidak baik. Pendapat kami adalah bahwa kami harus masuk ke dalam agama mereka dan dihormati oleh mereka.” Saad berkata, “Apa yang salah dengan orang-orang ini?” Kemudian Al-Mughirah bin Shu’bah datang kepada mereka dan menanyakan tentang keadaan mereka. Mereka menceritakan kisah mereka dan berkata, “Kami akan masuk ke dalam agamamu.” Maka ia kembali kepada Saad dan memberitahukannya, dan Saad memberi mereka perlindungan, sehingga mereka masuk Islam dan menyaksikan penaklukan Madinah bersama Saad."
