label: { ar: "حملة سليمان الخادم على الهند", en: "Sulayman al-Khadim's expedition against India", es: "La expedición de Sulayman al-Khadim contra la India", fr: "L'expédition de Sulayman al-Khadim contre l'Inde", ur: "سلیمان الخادم کی ہندوستان کے خلاف مہم" }
summary:
  ar: "أدرك السلطان سليمان القانوني أن الدفاع عن الأماكن المقدسة مسؤولية الدولة العثمانية، فعقد اتفاقاً مع حاكمي قاليقوط وكامباى الهنديين المتضررين من الغزو البرتغالي على العمل المشترك ضد البرتغال، ثم أصدر مرسوماً إلى سليمان باشا الخادم والي مصر يأمره بتجهيز أسطول في السويس والخروج إلى الهند للجهاد حتى يقطع الطرق المؤدية إلى مكة عن البرتغاليين ويزيل رايتهم من البحر. نفذ سليمان الخادم الأمر فوصل جدة في سبعة أيام ثم كمران فسيطر على عدن ووضع فيها حامية ستمائة جندي، وواصل إلى الهند فحاصر ديو فلم يقتحمها وانسحب وقد فقد نحو أربعمائة من رجاله، لكنه عاد فاستولى على إحدى القلاع الأمامية وأسر ثمانين برتغالياً، ولولا الإمدادات البرتغالية الجديدة لاستسلمت القلاع كلها، وقد مكنت هذه الحملة العثمانيين من تأمين البحر الأحمر وإبعاد البرتغاليين عن الممالك الإسلامية {cite:dawlat-uthmaniyya-salabi p. 196-197}."
  en: "The 1538 Ottoman India expedition: after a pact with the rulers of Calicut and Cambay, a royal firman ordered Egypt's governor Sulayman al-Khadim to sail from Suez, drive Portugal's flag from the sea and keep the Mecca routes open — he garrisoned Aden, besieged Diu, took eighty prisoners and fell back on reinforcements' arrival {cite:dawlat-uthmaniyya-salabi p. 196-197}."
  es: "La expedición otomana a la India de 1538: tras un pacto con los gobernantes de Calicut y Cambay, un firman real ordenó al gobernador de Egipto, Sulayman al-Khadim, zarpar de Suez, expulsar la bandera de Portugal del mar y mantener abiertas las rutas a La Meca; guarneció Adén, sitió Diu, tomó ochenta prisioneros y se retiró a la llegada de refuerzos {cite:dawlat-uthmaniyya-salabi p. 196-197}."
  fr: "L'expédition ottomane en Inde de 1538: après un pacte avec les dirigeants de Calicut et de Cambay, un firman royal ordonna au gouverneur égyptien Sulayman al-Khadim de naviguer depuis Suez, de chasser le drapeau portugais de la mer et de maintenir ouvertes les routes de La Mecque — il garnit Aden, assiégea Diu, fit quatre-vingts prisonniers et se replia à l'arrivée des renforts {cite:dawlat-uthmaniyya-salabi p. 196-197}."
  ur: "1538 کی عثمانی ہندوستان کی مہم: کالی کٹ اور کیمبے کے حکمرانوں کے ساتھ ایک معاہدے کے بعد، ایک شاہی فرمان نے مصر کے گورنر سلیمان الخادم کو حکم دیا کہ وہ سویز سے بحری سفر کرے، سمندر سے پرتگال کا جھنڈا لہرائے اور مکہ کے راستے کھلے رکھے - اس نے عدن کو گھیرے میں لے لیا، دیو کا محاصرہ کیا اور آٹھ فوجیوں کو واپس لے لیا۔ {حوالہ:دولت عثمانیہ سلبی ص۔ 196-197}۔"
