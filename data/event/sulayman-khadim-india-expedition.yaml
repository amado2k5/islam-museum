class: event
kind: campaign
label: { ar: "حملة سليمان الخادم على الهند", en: "Sulayman al-Khadim's expedition against India", es: "La expedición de Sulayman al-Khadim contra la India", fr: "L'expédition de Sulayman al-Khadim contre l'Inde", ur: "سلیمان الخادم کی ہندوستان کے خلاف مہم", tr: "Hizmetkâr Süleyman'ın Hindistan'a Karşı Seferi", id: "Kampanye Sulaiman sang Hamba melawan India" }
summary:
  ar: "أدرك السلطان سليمان القانوني أن الدفاع عن الأماكن المقدسة مسؤولية الدولة العثمانية، فعقد اتفاقاً مع حاكمي قاليقوط وكامباى الهنديين المتضررين من الغزو البرتغالي على العمل المشترك ضد البرتغال، ثم أصدر مرسوماً إلى سليمان باشا الخادم والي مصر يأمره بتجهيز أسطول في السويس والخروج إلى الهند للجهاد حتى يقطع الطرق المؤدية إلى مكة عن البرتغاليين ويزيل رايتهم من البحر. نفذ سليمان الخادم الأمر فوصل جدة في سبعة أيام ثم كمران فسيطر على عدن ووضع فيها حامية ستمائة جندي، وواصل إلى الهند فحاصر ديو فلم يقتحمها وانسحب وقد فقد نحو أربعمائة من رجاله، لكنه عاد فاستولى على إحدى القلاع الأمامية وأسر ثمانين برتغالياً، ولولا الإمدادات البرتغالية الجديدة لاستسلمت القلاع كلها، وقد مكنت هذه الحملة العثمانيين من تأمين البحر الأحمر وإبعاد البرتغاليين عن الممالك الإسلامية {cite:dawlat-uthmaniyya-salabi p. 196-197}."
  en: "The 1538 Ottoman India expedition: after a pact with the rulers of Calicut and Cambay, a royal firman ordered Egypt's governor Sulayman al-Khadim to sail from Suez, drive Portugal's flag from the sea and keep the Mecca routes open — he garrisoned Aden, besieged Diu, took eighty prisoners and fell back on reinforcements' arrival {cite:dawlat-uthmaniyya-salabi p. 196-197}."
  es: "La expedición otomana a la India de 1538: tras un pacto con los gobernantes de Calicut y Cambay, un firman real ordenó al gobernador de Egipto, Sulayman al-Khadim, zarpar de Suez, expulsar la bandera de Portugal del mar y mantener abiertas las rutas a La Meca; guarneció Adén, sitió Diu, tomó ochenta prisioneros y se retiró a la llegada de refuerzos {cite:dawlat-uthmaniyya-salabi p. 196-197}."
  fr: "L'expédition ottomane en Inde de 1538: après un pacte avec les dirigeants de Calicut et de Cambay, un firman royal ordonna au gouverneur égyptien Sulayman al-Khadim de naviguer depuis Suez, de chasser le drapeau portugais de la mer et de maintenir ouvertes les routes de La Mecque — il garnit Aden, assiégea Diu, fit quatre-vingts prisonniers et se replia à l'arrivée des renforts {cite:dawlat-uthmaniyya-salabi p. 196-197}."
  ur: "1538 کی عثمانی ہندوستان کی مہم: کالی کٹ اور کیمبے کے حکمرانوں کے ساتھ ایک معاہدے کے بعد، ایک شاہی فرمان نے مصر کے گورنر سلیمان الخادم کو حکم دیا کہ وہ سویز سے بحری سفر کرے، سمندر سے پرتگال کا جھنڈا لہرائے اور مکہ کے راستے کھلے رکھے - اس نے عدن کو گھیرے میں لے لیا، دیو کا محاصرہ کیا اور آٹھ فوجیوں کو واپس لے لیا۔ {حوالہ:دولت عثمانیہ سلبی ص۔ 196-197}۔"
  tr: "Kanuni Sultan Süleyman, kutsal yerleri savunmanın Osmanlı devletinin sorumluluğu olduğunu fark etti. Portekiz istilası altında acı çeken Hindistan'daki Halikut ve Campay devletlerinin yöneticileriyle Portekiz'e karşı birlikte çalışmak üzere bir anlaşma yaptı. Ardından Mısır valisi Süleyman Paşa el-Hadim'e Süveyş'te bir filo hazırlayıp Hindistan'a giderek cihat yapmasını, Portekiz'in Mekke'ye giden yollarını kesmesini ve bayraklarını denizden indirmesini emreden bir ferman yayınladı. Süleyman El-Hadim emri yerine getirerek yedi gün içinde Cidde'ye, ardından Kamaran'a ulaştı ve burada Aden'i ele geçirerek altı yüz askerden oluşan bir garnizon kurdu. Hindistan'a devam ederek Diu'yu kuşattı, ancak ele geçiremedi ve yaklaşık dört yüz askerini kaybettikten sonra geri çekildi. Ancak geri dönerek ileri kalelerden birini ele geçirdi ve seksen Portekizliyi esir aldı. Yeni Portekiz takviyeleri olmasaydı, tüm kaleler teslim olurdu. Bu sefer, Osmanlıların Kızıldeniz'i güvence altına almasını ve Portekizlileri Müslüman topraklarından uzak tutmasını sağladı."
  id: "Sultan Suleiman Agung menyadari bahwa mempertahankan tempat-tempat suci adalah tanggung jawab negara Ottoman. Ia membuat kesepakatan dengan para penguasa negara bagian India, Calicut dan Campay, yang telah menderita akibat invasi Portugis, untuk bekerja sama melawan Portugal. Kemudian ia mengeluarkan dekrit kepada Suleiman Pasha al-Khadim, gubernur Mesir, memerintahkannya untuk mempersiapkan armada di Suez dan berlayar ke India untuk melakukan jihad, memutus jalur Portugis ke Mekah, dan menurunkan bendera mereka dari laut. Suleiman al-Khadim melaksanakan perintah tersebut, mencapai Jeddah dalam tujuh hari, kemudian Kamaran, di mana ia merebut Aden dan mendirikan garnisun yang terdiri dari enam ratus tentara. Ia melanjutkan perjalanan ke India dan mengepung Diu, tetapi tidak berhasil merebutnya dan mundur, setelah kehilangan sekitar empat ratus pasukannya. Namun, ia kembali dan merebut salah satu benteng terdepan, menangkap delapan puluh tawanan Portugis. Seandainya bukan karena bala bantuan Portugis yang baru, semua benteng akan menyerah. Kampanye ini memungkinkan Ottoman untuk mengamankan Laut Merah dan menjauhkan Portugis dari tanah Muslim."
