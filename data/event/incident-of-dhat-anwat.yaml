label: { en: "The Dhat Anwat incident", ar: "قصة ذات أنواط" }
summary:
  en: "On the march to Hunayn the army passed the sacred tree Dhat Anwat, where pagans hung their weapons and held rites; some of the newly converted soldiers asked the Prophet to 'appoint for us a Dhat Anwat as they have one', and he rebuked the request, likening it to the Israelites' demand that Moses make them a god."
  ar: "مرّ الجيش في طريقه إلى حنين بشجرة ذات أنواط كان المشركون يعلّقون عليها أسلحتهم ويعكفون عندها ويذبحون لها، فطلب بعض حديثي العهد بالإسلام: «اجعل لنا ذات أنواط كما لهم ذات أنواط»، فأنكر النبي عليهم قولهم وشبّهه بطلب قوم موسى صنماً يعكفون عليه، وأخبرهم أنها السنن وأنهم سيتبعون سنن من كان قبلهم."
