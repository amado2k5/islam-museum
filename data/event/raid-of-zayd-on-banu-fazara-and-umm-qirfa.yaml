id: event/raid-of-zayd-on-banu-fazara-and-umm-qirfa
class: event
kind: raid
label: { ar: "غزوة زيد بن حارثة بني فزارة ومقتل أم قرفة", en: "Zayd ibn Haritha's raid on Banu Fazara and the killing of Umm Qirfa", es: "La incursión de Zayd ibn Haritha en Banu Fazara y el asesinato de Umm Qirfa", fr: "Raid de Zayd ibn Haritha sur Banu Fazara et meurtre d'Umm Qirfa" }
summary:
  ar: "غزا زيد بن حارثة وادي القرى فلقي بني فزارة فأصيب ناس من أصحابه وحُمل زيد جريحاً من بين القتلى، وقُتل ورد بن عمرو بن مداش، فآلى زيد ألا يمس رأسه غسل من جنابة حتى يغزو فزارة؛ فلما برئ بعثه النبي إليهم في جيش فقتلهم بوادي القرى، وقتل قيس بن المسحّر اليعمري مسعدة بن حكمة بن مالك بن حذيفة بن بدر، وأُسرت أم قرفة فاطمة بنت ربيعة بن بدر، عجوز كبيرة عند مالك بن حذيفة، وبنت لها وعبد الله بن مسعدة، فأمر زيد قيساً أن يقتل أم قرفة «فقتلها قتلاً عنيفاً»، وقدموا بابنتها وابن مسعدة على النبي؛ وكانت بنت أم قرفة لسلمة بن الأكوع فسألها النبي فوهبها له فأهداها لخاله حزن بن أبي وهب. الواقعة من المواضع المتنازع فيها وتحمل وجهات نظر."
  en: "Zayd ibn Haritha raided Wadi al-Qura and met Banu Fazara; some of his men were hit, he was carried off wounded from among the dead, and Ward ibn Amr ibn Madash was killed, so Zayd swore no water would touch his head from major impurity until he raided Fazara. When he recovered the Prophet sent him with an army; he slaughtered them at Wadi al-Qura, Qays ibn al-Musahhar al-Ya'muri killed Mas'ada ibn Hakama ibn Malik ibn Hudhayfa ibn Badr, and Umm Qirfa, Fatima bint Rabi'a ibn Badr, an old woman married to Malik ibn Hudhayfa, was captured with a daughter and Abdullah ibn Mas'ada. Zayd ordered Qays to kill Umm Qirfa, 'and he killed her violently', and they brought her daughter and Ibn Mas'ada to the Prophet; the daughter fell to Salama ibn al-Akwa', the Prophet asked for her and gave her to his maternal uncle Hazn ibn Abi Wahb. The episode is contested and carries perspectives."
  es: "Zayd ibn Haritha asaltó Wadi al-Qura y se encontró con Banu Fazara; algunos de sus hombres fueron heridos, él fue sacado herido de entre los muertos, y Ward ibn Amr ibn Madash fue asesinado, por lo que Zayd juró que ninguna agua tocaría su cabeza por impureza mayor hasta que asaltara Fazara. Cuando se recuperó, el Profeta lo envió con un ejército; los masacró en Wadi al-Qura, Qays ibn al-Musahhar al-Ya'muri mató a Mas'ada ibn Hakama ibn Malik ibn Hudhayfa ibn Badr, y Umm Qirfa, Fatima bint Rabi'a ibn Badr, una anciana casada con Malik ibn Hudhayfa, fue capturada con una hija y Abdullah ibn Mas'ada. Zayd ordenó a Qays que matara a Umm Qirfa, 'y la mató violentamente', y llevaron a su hija e Ibn Mas'ada ante el Profeta; La hija cayó en manos de Salama ibn al-Akwa', el Profeta la pidió y se la entregó a su tío materno Hazn ibn Abi Wahb. Este episodio es objeto de controversia y presenta diversas interpretaciones."
  fr: "Zayd ibn Haritha mena un raid contre Wadi al-Qura et rencontra les Banu Fazara. Certains de ses hommes furent touchés, il fut évacué blessé parmi les morts, et Ward ibn Amr ibn Madash fut tué. Zayd jura alors de ne plus jamais se mouiller la tête, en signe d'impureté majeure, jusqu'à ce qu'il puisse attaquer Fazara. À son rétablissement, le Prophète l'envoya avec une armée. Il les massacra à Wadi al-Qura. Qays ibn al-Musahhar al-Ya'muri tua Mas'ada ibn Hakama ibn Malik ibn Hudhayfa ibn Badr, et Umm Qirfa, Fatima bint Rabi'a ibn Badr, une vieille femme mariée à Malik ibn Hudhayfa, fut capturée avec sa fille et Abdullah ibn Mas'ada. Zayd ordonna à Qays de tuer Umm Qirfa, ce qu'il fit avec violence. Ils amenèrent ensuite sa fille et Ibn Mas'ada au Prophète. La fille tomba sous la coupe de Salama ibn al-Akwa'. Le Prophète la réclama et la confia à son oncle maternel, Hazn ibn Abi Wahb. Cet épisode est controversé et fait l'objet de plusieurs versions."
