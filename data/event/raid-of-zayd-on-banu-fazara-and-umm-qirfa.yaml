label: { ar: "غزوة زيد بن حارثة بني فزارة ومقتل أم قرفة", en: "Zayd ibn Haritha's raid on Banu Fazara and the killing of Umm Qirfa" }
summary:
  ar: "غزا زيد بن حارثة وادي القرى فلقي بني فزارة فأصيب ناس من أصحابه وحُمل زيد جريحاً من بين القتلى، وقُتل ورد بن عمرو بن مداش، فآلى زيد ألا يمس رأسه غسل من جنابة حتى يغزو فزارة؛ فلما برئ بعثه النبي إليهم في جيش فقتلهم بوادي القرى، وقتل قيس بن المسحّر اليعمري مسعدة بن حكمة بن مالك بن حذيفة بن بدر، وأُسرت أم قرفة فاطمة بنت ربيعة بن بدر، عجوز كبيرة عند مالك بن حذيفة، وبنت لها وعبد الله بن مسعدة، فأمر زيد قيساً أن يقتل أم قرفة «فقتلها قتلاً عنيفاً»، وقدموا بابنتها وابن مسعدة على النبي؛ وكانت بنت أم قرفة لسلمة بن الأكوع فسألها النبي فوهبها له فأهداها لخاله حزن بن أبي وهب. الواقعة من المواضع المتنازع فيها وتحمل وجهات نظر."
  en: "Zayd ibn Haritha raided Wadi al-Qura and met Banu Fazara; some of his men were hit, he was carried off wounded from among the dead, and Ward ibn Amr ibn Madash was killed, so Zayd swore no water would touch his head from major impurity until he raided Fazara. When he recovered the Prophet sent him with an army; he slaughtered them at Wadi al-Qura, Qays ibn al-Musahhar al-Ya'muri killed Mas'ada ibn Hakama ibn Malik ibn Hudhayfa ibn Badr, and Umm Qirfa, Fatima bint Rabi'a ibn Badr, an old woman married to Malik ibn Hudhayfa, was captured with a daughter and Abdullah ibn Mas'ada. Zayd ordered Qays to kill Umm Qirfa, 'and he killed her violently', and they brought her daughter and Ibn Mas'ada to the Prophet; the daughter fell to Salama ibn al-Akwa', the Prophet asked for her and gave her to his maternal uncle Hazn ibn Abi Wahb. The episode is contested and carries perspectives."
