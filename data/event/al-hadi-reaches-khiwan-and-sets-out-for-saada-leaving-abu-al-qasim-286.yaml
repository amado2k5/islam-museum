id: event/al-hadi-reaches-khiwan-and-sets-out-for-saada-leaving-abu-al-qasim-286
class: event
kind: other
label:
  ar: وصول الهادي إلى خيوان ثم خروجه إلى صعدة وتخليف ابنه أبي القاسم فيها، ذو القعدة 286هـ
  en: Al-Hadi reaches Khiwan, then goes out to Sa'da leaving his son Abu al-Qasim at Khiwan, Dhu al-Qa'da 286 AH
  ur: ہادی کا خیوان پہنچنا، پھر صعدہ روانہ ہونا اور اپنے بیٹے ابو القاسم کو خیوان میں چھوڑنا، ذی القعدہ 286ھ
summary:
  ar: يصل الهادي إلى خيوان من بلد القسيب كما يطبع النص، فيأمر الناس بالتأهب للخروج إلى نجران في أيام ماضية من ذي القعدة، ثم يمضي إلى صعدة ويخلف ابنه أبا القاسم في خيوان ومعه عسكر لأبي المتاهية من خيل ورجال.
  en: Al-Hadi reaches Khiwan from the land of al-Qusayb as the text prints it, orders the people to prepare for the march to Najran in the past days of Dhu al-Qa'da, then goes on to Sa'da and leaves his son Abu al-Qasim at Khiwan with a force of Abu al-Mutahiya's horse and men.
  ur: ہادی متن کے مطابق ملک قسیب سے خیوان پہنچتے ہیں، ذی القعدہ کے گزرے ہوئے دنوں میں لوگوں کو نجران جانے کی تیاری کا حکم دیتے ہیں، پھر صعدہ جاتے ہیں اور اپنے بیٹے ابو القاسم کو ابو المتاہیہ کے سواروں اور پیادوں کے لشکر کے ساتھ خیوان میں چھوڑ جاتے ہیں۔
