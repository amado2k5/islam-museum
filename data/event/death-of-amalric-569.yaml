summary:
  ar: "اتفق أن مات مري ملك الفرنج أول هذه السنة وكان أعظم ملوكهم شجاعة وأجودهم رأيًا ومكرًا ومكيدة، فخلف ابنًا مجذومًا عاجزًا عن تدبير الملك فملكه الفرنج صورة لا معنى تحتها وتولى القمص ريموند صاحب طرابلس تدبير الملك وكان قد أطلقه سعد الدين من الحبس بمائة وخمسين ألف دينار صورية وألف أسير {cite:kamil-ibn-al-athir p. 68}."
  en: "King Amalric — «مري», the Franks' bravest and craftiest king in Ibn al-Athīr's verdict — died at the year's start, leaving a leper son king in name only. The real rule passed to Count Raymond of Tripoli, newly ransomed from Nūr al-Dīn's prisons for 150,000 Tyrian dinars and a thousand captives {cite:kamil-ibn-al-athir p. 68}."
  es: "El rey Amalrico —«مري», el rey más valiente y astuto de los francos según el veredicto de Ibn al-Athīr— murió al comienzo del año, dejando a un hijo leproso como rey solo de nombre. El verdadero poder pasó al conde Raimundo de Trípoli, recién rescatado de las prisiones de Nūr al-Dīn por 150 000 dinares tirios y mil cautivos {cite:kamil-ibn-al-athir p. 68}."
  fr: "Le roi Amaury, que Ibn al-Athīr qualifie de roi franc le plus brave et le plus rusé, mourut en début d'année, laissant un fils lépreux comme seul roi de nom. Le pouvoir réel passa au comte Raymond de Tripoli, récemment racheté des prisons de Nūr al-Dīn contre 150 000 dinars tyriens et mille captifs (voir: Kamil Ibn al-Athīr, p. 68)."
  ur: "شاہ املرک — «مری»، ابن الثیر کے فیصلے میں فرینکوں کا سب سے بہادر اور چالاک بادشاہ — سال کے آغاز میں ہی انتقال کر گیا، صرف ایک کوڑھی بیٹا بادشاہ رہ گیا۔ اصل حکمرانی طرابلس کے کاؤنٹ ریمنڈ کو منتقل ہوئی، جسے نورالدین کی جیلوں سے 150,000 ٹیریئن دینار اور ایک ہزار اسیروں کے بدلے فدیہ دیا گیا تھا۔ 68}۔"
  tr: "Frankların kralı Murray'ın bu yılın başında öldüğü konusunda anlaşmaya varıldı. O, cesaret bakımından en büyük, görüş, kurnazlık ve entrika bakımından da en iyisiydi. Geride krallığı yönetemeyecek cüzzamlı bir oğul bıraktı, bu yüzden Franklar onu hiçbir anlam ifade etmeyen, önemsiz bir figür haline getirdiler. Trablus'un sahibi rahip Raymond krallığın yönetimini devraldı ve Saad al-Din onu yüz elli bin hayali dinar ve bin mahkum karşılığında hapisten serbest bıraktı. {cite:kamil-ibn-al-athir s. 68}"
  id: "Disepakati bahwa Murray, raja Frank, meninggal pada awal tahun ini. Ia adalah raja terhebat mereka dalam keberanian dan yang terbaik dalam hal opini, kelicikan, dan intrik. Ia meninggalkan seorang putra yang menderita kusta dan tidak mampu mengelola kerajaan, sehingga orang-orang Frank menjadikannya sebagai simbol tanpa makna di baliknya. Pendeta Raymond, pemilik Tripoli, mengambil alih pengelolaan kerajaan, dan Saad al-Din telah membebaskannya dari penjara dengan imbalan seratus lima puluh ribu dinar fiktif dan seribu tawanan. {cite:kamil-ibn-al-athir p. 68}."
