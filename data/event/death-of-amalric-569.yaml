label: { ar: "وفاة مري ملك الفرنج وملك ابنه المجذوم", en: "death of King Amalric — Baldwin the leper succeeds, Raymond regent", es: "Muerte del rey Amalarico: Balduino el leproso le sucede, Raimundo se convierte en regente.", fr: "Mort du roi Amaury — Baudouin le lépreux lui succède, Raymond est régent", ur: "کنگ املرک کی موت - بالڈون کوڑھی کامیاب، ریمنڈ ریجنٹ", tr: "Frankların kralı Mary'nin ölümü ve cüzzamlı oğlunun hükümdarlığı", id: "Kematian Maria, Raja Frank, dan pemerintahan putranya yang menderita kusta" }
