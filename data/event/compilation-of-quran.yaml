label: { ar: "جمع القرآن في خلافة أبي بكر", en: "The Compilation of the Qur'an under Abu Bakr" }
summary:
  ar: "أرسل إلي أبو بكر مقتل أهل اليمامة وعنده عمر فقال إن عمر أتاني فقال إن القتل قد استحر يوم اليمامة بالناس وإني لأخشى أن يستحر القتل بالقراء في المواطن فيذهب كثير من القرآن إلا أن تجمعوه وإني لأرى أن تجمع القرآن قال أبو بكر فقلت لعمر كيف أفعل شيئاً لم يفعله رسول الله فقال عمر هو والله خير فلم يزل عمر يراجعني فيه حتى شرح الله لذلك صدري فرأيت الذي رأى عمر قال زيد وعمر عنده جالس لا يتكلم فقال أبو بكر إنك شاب عاقل ولا نتهمك وقد كنت تكتب الوحي لرسول الله فتتبع القرآن فاجمعه فوالله لو كلفني نقل جبل من الجبال ما كان أثقل علي مما أمرني به من جمع القرآن فقلت كيف تفعلان شيئاً لم يفعله النبي فقال أبو بكر هو والله خير فلم أزل أراجعه حتى شرح الله صدري للذي شرح له صدر أبي بكر وعمر فتتبعت القرآن أجمعه من الرقاع والأكتاف والعسب وصدور الرجال حتى وجدت من سورة التوبة آيتين مع خزيمة بن ثابت لم أجدهما مع غيره. والنص كاملاً عند البخاري في فضائل القرآن من رواية ابن شهاب عن عبيد بن السباق عن زيد بن ثابت {cite:sahih-al-bukhari 4986}. The full text is Bukhari's hadith 4986, narrated from Zayd ibn Thabit via Ibn Shihab {cite:sahih-al-bukhari 4986}."
  en: "Zayd ibn Thabit: Abu Bakr sent for me after the Yamama dead, Umar at his side — 'the killing ran through the people on Yamama's day; I fear it running through the reciters in the stations and much of the Qur'an going — you must compile it'. 'How do a thing the Prophet did not do?' — 'By God, it is good' — till God opened his breast. 'You are a young man of sense, unaccused, who wrote the revelation: follow the Qur'an and gather it' — 'were I tasked to carry a mountain it were no heavier'. So he gathered it from the riqa', the shoulder-bones, the palm-stems and the breasts of men, till he found Bara'a's two closing verses with Khuzayma ibn Thabit alone."
