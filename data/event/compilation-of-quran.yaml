label: {ar: "جمع القرآن في خلافة أبي بكر", en: "The Compilation of the Qur'an under Abu Bakr", es: "La compilación del Corán bajo Abu Bakr", fr: "La compilation du Coran sous Abou Bakr", ur: "حضرت ابوبکر کے دور میں قرآن کی تالیف", tr: "Kur'an, Ebu Bekir'in halifeliği döneminde derlenmiştir.", id: "Al-Quran disusun pada masa kekhalifahan Abu Bakar."}
summary:
  ar: "أرسل إلي أبو بكر مقتل أهل اليمامة وعنده عمر فقال إن عمر أتاني فقال إن القتل قد استحر يوم اليمامة بالناس وإني لأخشى أن يستحر القتل بالقراء في المواطن فيذهب كثير من القرآن إلا أن تجمعوه وإني لأرى أن تجمع القرآن قال أبو بكر فقلت لعمر كيف أفعل شيئاً لم يفعله رسول الله فقال عمر هو والله خير فلم يزل عمر يراجعني فيه حتى شرح الله لذلك صدري فرأيت الذي رأى عمر قال زيد وعمر عنده جالس لا يتكلم فقال أبو بكر إنك شاب عاقل ولا نتهمك وقد كنت تكتب الوحي لرسول الله فتتبع القرآن فاجمعه فوالله لو كلفني نقل جبل من الجبال ما كان أثقل علي مما أمرني به من جمع القرآن فقلت كيف تفعلان شيئاً لم يفعله النبي فقال أبو بكر هو والله خير فلم أزل أراجعه حتى شرح الله صدري للذي شرح له صدر أبي بكر وعمر فتتبعت القرآن أجمعه من الرقاع والأكتاف والعسب وصدور الرجال حتى وجدت من سورة التوبة آيتين مع خزيمة بن ثابت لم أجدهما مع غيره. والنص كاملاً عند البخاري في فضائل القرآن من رواية ابن شهاب عن عبيد بن السباق عن زيد بن ثابت {cite:sahih-al-bukhari 4986}. The full text is Bukhari's hadith 4986, narrated from Zayd ibn Thabit via Ibn Shihab {cite:sahih-al-bukhari 4986}."
  en: "Zayd ibn Thabit: Abu Bakr sent for me after the Yamama dead, Umar at his side — 'the killing ran through the people on Yamama's day; I fear it running through the reciters in the stations and much of the Qur'an going — you must compile it'. 'How do a thing the Prophet did not do?' — 'By God, it is good' — till God opened his breast. 'You are a young man of sense, unaccused, who wrote the revelation: follow the Qur'an and gather it' — 'were I tasked to carry a mountain it were no heavier'. So he gathered it from the riqa', the shoulder-bones, the palm-stems and the breasts of men, till he found Bara'a's two closing verses with Khuzayma ibn Thabit alone."
  es: "Zayd ibn Thabit: Abu Bakr me mandó llamar después de la muerte de Yamama, con Umar a su lado: «La matanza se extendió entre la gente el día de Yamama; temo que se extienda entre los recitadores en las estaciones y gran parte del Corán se esté perdiendo; debes compilarlo». «¿Cómo hacer algo que el Profeta no hizo?». «Por Dios, es bueno». Hasta que Dios le abrió el pecho. «Eres un joven sensato, inocente, que escribió la revelación: sigue el Corán y recógelo». «Si me encargaran cargar una montaña, no pesaría más». Así que lo recogió de la riqa', los omóplatos, los tallos de las palmas y los pechos de los hombres, hasta que encontró los dos últimos versículos de Bara'a con Khuzayma ibn Thabit solo."
  fr: "Zayd ibn Thabit: Abou Bakr m'a fait appeler après la mort de Yamama, accompagné d'Omar. « Le meurtre a sévi parmi le peuple le jour de Yamama; je crains qu'il ne se propage parmi les récitants dans les stations et qu'une grande partie du Coran ne soit perdue. Tu dois le compiler. » « Comment faire une chose que le Prophète n'a pas faite ? » « Par Dieu, c'est bien ! » – jusqu'à ce que Dieu lui ouvre la poitrine. « Tu es un jeune homme sensé, intègre, qui a écrit la révélation: suis le Coran et rassemble-le. » « Si l'on me demandait de porter une montagne, ce ne serait pas plus lourd. » Il le rassembla donc à partir des rites, des omoplates, des palmes et des poitrines des hommes, jusqu'à ce qu'il trouve les deux derniers versets de Bara'a, uniquement avec Khuzayma ibn Thabit."
  ur: "زید بن ثابت: ابوبکر نے یمامہ کے مرنے کے بعد مجھے بلوا بھیجا، عمر ان کی طرف - 'یمامہ کے دن لوگوں میں قتل عام ہوا۔ مجھے ڈر ہے کہ یہ اسٹیشنوں پر تلاوت کرنے والوں کے ذریعے چل رہا ہے اور قرآن کا زیادہ تر حصہ گزر رہا ہے - آپ کو اسے مرتب کرنا ہوگا۔ 'وہ کام کیسے کریں جو نبی نے نہیں کیا؟' - 'خدا کی قسم، یہ اچھا ہے' - یہاں تک کہ خدا نے اس کا سینہ کھول دیا۔ 'تم ایک باشعور نوجوان ہو، بے قصور، جس نے وحی لکھی ہے: قرآن کی پیروی کرو اور اسے جمع کرو' - 'اگر مجھے ایک پہاڑ کو اٹھانے کا کام سونپا گیا تھا تو وہ زیادہ بھاری نہیں تھا'۔ چنانچہ اس نے اسے رقعہ، کندھوں کی ہڈیوں، ہتھیلیوں کے تنوں اور مردوں کے سینوں سے اکٹھا کیا، یہاں تک کہ براء کی دو آخری آیات کو خزیمہ بن ثابت کے پاس اکیلا پایا۔"
  tr: "Ebu Bekir bana Yamame halkının katledildiği haberini gönderdi ve Ömer de onunla birlikteydi. Ebu Bekir şöyle dedi: “Ömer yanıma geldi ve dedi ki: ‘Yamame günü insanlar arasında katliam yaygınlaştı ve korkarım ki bu katliam, Kur'an okuyanlar arasında da yaygınlaşacak ve eğer sen Kur'an'ı toplamazsan, Kur'an'ın büyük bir kısmı kaybolacak. Bence sen Kur'an'ı toplamalısın.’” Ebu Bekir dedi ki: “Ben de Ömer'e dedim ki: ‘Allah'ın Resulü'nün yapmadığı bir şeyi nasıl yapabilirim?’ Ömer dedi ki: ‘Allah'a yemin ederim ki, bu iyidir.’ Ömer bu konuda benimle tartışmaya devam etti, ta ki Allah kalbimi ona açana ve ben de Ömer'in gördüğünü görene kadar.” Zeyd şöyle dedi: “Ömer onunla birlikte oturuyordu, konuşmuyordu. Ebu Bekir, ‘Sen akıllı bir gençsin ve senden şüphe etmiyoruz. Allah Resulü için vahiyleri yazardın, öyleyse Kur'an'ı takip et ve topla. Allah'a yemin ederim ki, bana bir dağı yerinden oynatma görevi verseydi, Kur'an'ı toplamaktan daha ağır olmazdı.’ Ben de, ‘Peygamberin yapmadığı bir şeyi nasıl yapabilirsin?’ dedim. Ebu Bekir, ‘Allah'a yemin ederim ki, bu iyidir.’ dedi. Ben de onunla tartışmaya devam ettim, ta ki Allah kalbimi Ebu Bekir ve Ömer'in kalplerini açtığı şeye açana kadar. Böylece Kur'an'ı takip ettim, parşömenlerden, kürek kemiklerinden, hurma yapraklarından ve insanların kalplerinden topladım, ta ki Huzeyme ibn Sabit'te Tevbe Suresi'nden iki ayet bulana kadar ki, başka kimsede bulamadım.” Metnin tamamı, İbn Şihab'ın Ubeyd ibn el-Sabbak'tan, o da Zeyd ibn Sabit'ten rivayet ettiği, Buhari'nin Kur'an'ın faziletleri hakkındaki kitabında bulunmaktadır {sahih-i buhari 4986}."
  id: "Abu Bakr menyampaikan kepadaku kabar tentang pembunuhan kaum Yamamah, dan Umar bersamanya. Beliau berkata, “Umar datang kepadaku dan berkata, ‘Pembunuhan telah meluas di kalangan masyarakat pada hari Yamamah, dan aku khawatir pembunuhan itu akan meluas di kalangan para pembaca Al-Qur'an di berbagai tempat, dan banyak Al-Qur'an akan hilang kecuali jika engkau mengumpulkannya. Aku pikir engkau harus mengumpulkan Al-Qur'an.’” Abu Bakr berkata, “Maka aku berkata kepada Umar, ‘Bagaimana aku dapat melakukan sesuatu yang tidak dilakukan oleh Rasulullah?’ Umar berkata, ‘Demi Allah, itu baik.’ Umar terus berdebat denganku tentang hal itu sampai Allah membuka hatiku untuk menerimanya, dan aku melihat apa yang dilihat Umar.” Zayd berkata, “Umar sedang duduk bersamanya, tidak berbicara. Abu Bakr berkata, ‘Engkau adalah pemuda yang bijaksana, dan kami tidak meragukanmu. Dahulu engkau menuliskan wahyu untuk Rasulullah, maka ikutilah Al-Qur'an dan kumpulkanlah. Demi Allah, jika beliau memerintahkanku untuk memindahkan gunung, itu tidak akan lebih berat bagiku daripada apa yang beliau perintahkan kepadaku untuk mengumpulkan Al-Qur'an.’ Maka aku berkata, ‘Bagaimana mungkin engkau melakukan sesuatu yang tidak dilakukan Nabi?’ Abu Bakr berkata, ‘Demi Allah, itu baik.’ Maka aku terus berdebat dengannya sampai Allah membuka hatiku kepada apa yang Dia bukakan di hati Abu Bakr dan Umar. Maka aku mengikuti Al-Qur'an, mengumpulkannya dari gulungan-gulungan, tulang belikat, daun palem, dan hati manusia, sampai aku menemukan dua ayat dari Surat At-Tawbah pada Khuzaymah ibn Thabit yang tidak kutemukan pada orang lain.” Teks lengkapnya terdapat dalam kitab Bukhari tentang keutamaan Al-Qur'an, yang diriwayatkan oleh Ibn Shihab dari Ubayd ibn al-Sabbaq dari Zayd ibn Thabit {cite:sahih-al-bukhari 4986}."
