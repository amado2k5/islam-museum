id: event/sun-and-the-shaytans-horn
class: event
kind: other
label:
  ar: "الشمس وقرن الشيطان في أوقات الصلاة"
  en: "The sun and the shaytan's horn in the prayer times"
  ur: "نماز کے اوقات میں سورج اور شیطان کی سینگ"
summary:
  ar: "أخبر النبي أن الشمس تطلع ومعها قرن الشيطان فإذا ارتفعت فارقها فإذا استوت قارنها فإذا زالت فارقها فإذا دنت للغروب قارنها فإذا غربت فارقها ونهى عن الصلاة في تلك الساعات {cite:muwatta-maruf-1997} [[passage/muwatta-1-584|الموطأ 584]]."
  en: "The Prophet reported that the sun rises with the shaytan's horn; when it climbs he parts from it, when it stands he joins it, when it declines he parts, when it nears sunset he joins it, and when it sets he parts — and he forbade prayer in those hours {cite:muwatta-maruf-1997} [[passage/muwatta-1-584|Muwatta 584]]."
  ur: "نبی نے خبر دی کہ سورج شیطان کی سینگ کے ساتھ طلوع ہوتا ہے؛ جب اوپر چڑھے تو وہ اس سے جدا ہو جاتا ہے، جب بیچ میں ہو تو اس کے ساتھ رہتا ہے، جب ڈھلنے لگے تو جدا ہو جاتا ہے، جب غروب کے قریب ہو تو اس کے ساتھ رہتا ہے، اور جب غروب ہو تو جدا ہو جاتا ہے — اور اس نے ان گھنٹوں میں نماز منع فرمائی {cite:muwatta-maruf-1997} [[passage/muwatta-1-584|موطأ 584]]۔"
