id: event/sun-and-the-shaytans-horn
class: event
kind: other
label:
  ar: "الشمس وقرن الشيطان في أوقات الصلاة"
  en: "The sun and the shaytan's horn in the prayer times"
  ur: "نماز کے اوقات میں سورج اور شیطان کی سینگ"
  es: "El sol y el cuerno de Satanás en los momentos de oración."
  fr: "Le soleil et la corne de Satan aux heures de prière"
  tr: "Namaz vakitlerinde güneş ve şeytanın boynuzu"
  id: "Matahari dan tanduk setan pada waktu berdoa"
summary:
  ar: "أخبر النبي أن الشمس تطلع ومعها قرن الشيطان فإذا ارتفعت فارقها فإذا استوت قارنها فإذا زالت فارقها فإذا دنت للغروب قارنها فإذا غربت فارقها ونهى عن الصلاة في تلك الساعات {cite:muwatta-maruf-1997} [[passage/muwatta-1-584|الموطأ 584]]."
  en: "The Prophet reported that the sun rises with the shaytan's horn; when it climbs he parts from it, when it stands he joins it, when it declines he parts, when it nears sunset he joins it, and when it sets he parts — and he forbade prayer in those hours {cite:muwatta-maruf-1997} [[passage/muwatta-1-584|Muwatta 584]]."
  ur: "نبی نے خبر دی کہ سورج شیطان کی سینگ کے ساتھ طلوع ہوتا ہے؛ جب اوپر چڑھے تو وہ اس سے جدا ہو جاتا ہے، جب بیچ میں ہو تو اس کے ساتھ رہتا ہے، جب ڈھلنے لگے تو جدا ہو جاتا ہے، جب غروب کے قریب ہو تو اس کے ساتھ رہتا ہے، اور جب غروب ہو تو جدا ہو جاتا ہے — اور اس نے ان گھنٹوں میں نماز منع فرمائی {cite:muwatta-maruf-1997} [[passage/muwatta-1-584|موطأ 584]]۔"
  es: "El Profeta informó que el sol sale con el cuerno de Shaytan; cuando asciende, se separa de él; cuando se detiene, se une a él; cuando desciende, se separa; cuando se acerca al atardecer, se une a él; y cuando se pone, se separa; y prohibió la oración en esas horas {cite:muwatta-maruf-1997} [[passage/muwatta-1-584|Muwatta 584]]."
  fr: "Le Prophète a rapporté que le soleil se lève avec la corne de shaytan; lorsqu'il monte, il s'en sépare, lorsqu'il se lève, il s'y joint, lorsqu'il descend, il s'en sépare, lorsqu'il approche du coucher du soleil, il s'y joint, et lorsqu'il se couche, il s'en sépare — et il a interdit la prière à ces heures {cite:muwatta-maruf-1997} [[passage/muwatta-1-584|Muwatta 584])."
  tr: "Peygamberimiz şöyle buyurmuştur: \"Güneş, şeytanın boynuzuyla doğar, doğduğunda onu terk eder, zirveye ulaştığında onunla birlikte olur, zirveyi geçtiğinde onu terk eder, batmaya yaklaştığında onunla birlikte olur, battığında onu terk eder.\" Ve bu saatlerde namazı haram kılmıştır. {cite:muwatta-maruf-1997} [[passage/muwatta-1-584|Al-Muwatta 584]]."
  id: "Nabi bersabda bahwa matahari terbit bersama tanduk setan, dan ketika terbit ia meninggalkannya, dan ketika berada di puncaknya ia bersama setan, dan ketika melewati puncaknya ia meninggalkannya, dan ketika mendekati matahari terbenam ia bersama setan, dan ketika terbenam ia meninggalkannya, dan beliau melarang salat pada jam-jam tersebut. {cite:muwatta-maruf-1997} [[passage/muwatta-1-584|Al-Muwatta 584]]."
