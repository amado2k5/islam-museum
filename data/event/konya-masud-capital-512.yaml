label: { ar: "السلطان مسعود يتخذ قونية عاصمة سلاجقة الروم", en: "Mas'ud I makes Konya the Rum Seljuk capital", ur: "سلطان مسعود اول نے قونیہ کو سلاجقہِ روم کا دارالحکومت بنایا" }
summary:
  ar: "يرجع نماء قونية الحقيقي إلى عهد السلطان مسعود الأول (٥١٢–٥٥٠هـ/١١١٨–١١٥٥م) الذي عزم على اتخاذها عاصمة وبنى فيها مسجدًا وآثارًا أتمّها خلفاؤه؛ فقد ساد الموقعُ البلَّال الطريقَ الجنوبي حين حال الدانشمنديون بين السلاجقة والطريق الشمالي إلى الدردنيل، ولبثت قونية في عهد السلاجقة ذروة تاريخها {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 287}."
  en: "Konya's real development dates from the reign of Sultan Mas'ud I (512-550/1118-1155), who resolved to make it his capital and built a mosque and other monuments that his successors completed. The well-irrigated site commanded the southern route at a time when the Danishmendids denied the Seljuks the northern route to the Dardanelles, and the Seljuk period marked the zenith of the city's history {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 287}."
  ur: "قونیہ کی اصل ترقی سلطان مسعود اول (512–550ھ/1118–1155ء) کے عہد سے شروع ہوتی ہے، جس نے اسے اپنا دارالحکومت بنانے کا فیصلہ کیا اور وہاں ایک مسجد اور دیگر عمارتیں بنوائیں جنہیں اس کے جانشینوں نے مکمل کیا۔ دانشمندیوں نے جب سلاجقہ کے لیے دردانیل کا شمالی راستہ بند کر دیا تو پانی سے مالا مال یہ مقام جنوبی راستے پر حاوی تھا، اور سلجوقی دور شہر کی تاریخ کا عروج تھا۔"
