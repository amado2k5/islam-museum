label: { ar: "السلطان مسعود يتخذ قونية عاصمة سلاجقة الروم", en: "Mas'ud I makes Konya the Rum Seljuk capital", ur: "سلطان مسعود اول نے قونیہ کو سلاجقہِ روم کا دارالحکومت بنایا", es: "Mas'ud I convierte a Konya en la capital del ron selyúcida", fr: "Mas'ud I fait de Konya la capitale du rhum seldjoukide", tr: "Sultan Mesud, Konya'yı Selçuklu Rum Sultanlığı'nın başkenti yaptı.", id: "Sultan Masoud menjadikan Konya sebagai ibu kota Kesultanan Seljuk Rum." }
summary:
  ar: "يرجع نماء قونية الحقيقي إلى عهد السلطان مسعود الأول ⁦(٥١٢–٥٥٠هـ/١١١٨–١١٥٥م)⁩ الذي عزم على اتخاذها عاصمة وبنى فيها مسجدًا وآثارًا أتمّها خلفاؤه؛ فقد ساد الموقعُ البلَّال الطريقَ الجنوبي حين حال الدانشمنديون بين السلاجقة والطريق الشمالي إلى الدردنيل، ولبثت قونية في عهد السلاجقة ذروة تاريخها {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 287}."
  en: "Konya's real development dates from the reign of Sultan Mas'ud I (512-550/1118-1155), who resolved to make it his capital and built a mosque and other monuments that his successors completed. The well-irrigated site commanded the southern route at a time when the Danishmendids denied the Seljuks the northern route to the Dardanelles, and the Seljuk period marked the zenith of the city's history {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 287}."
  ur: "قونیہ کی اصل ترقی سلطان مسعود اول ⁦(512–550ھ/1118–1155ء)⁩ کے عہد سے شروع ہوتی ہے، جس نے اسے اپنا دارالحکومت بنانے کا فیصلہ کیا اور وہاں ایک مسجد اور دیگر عمارتیں بنوائیں جنہیں اس کے جانشینوں نے مکمل کیا۔ دانشمندیوں نے جب سلاجقہ کے لیے دردانیل کا شمالی راستہ بند کر دیا تو پانی سے مالا مال یہ مقام جنوبی راستے پر حاوی تھا، اور سلجوقی دور شہر کی تاریخ کا عروج تھا۔"
  es: "El verdadero desarrollo de Konya data del reinado del sultán Mas'ud I (512-550/1118-1155), quien decidió convertirla en su capital y construyó una mezquita y otros monumentos que sus sucesores completaron. El emplazamiento, bien irrigado, dominaba la ruta sur en un momento en que los danésmendíes negaban a los selyúcidas la ruta norte hacia los Dardanelos, y el período selyúcida marcó el apogeo de la historia de la ciudad {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 287}."
  fr: "Le véritable essor de Konya remonte au règne du sultan Mas'ud Ier (512-550/1118-1155), qui décida d'en faire sa capitale et y fit construire une mosquée et d'autres monuments, achevés par ses successeurs. Ce site bien irrigué contrôlait la route du sud à une époque où les Danishmendides interdisaient aux Seldjoukides l'accès à la route du nord vers les Dardanelles. La période seldjoukide marqua l'apogée de l'histoire de la ville."
  tr: "Konya'nın gerçek gelişimi, burayı başkent yapmaya karar veren ve burada bir cami ve anıtlar inşa ettiren Sultan Mesud I'in (512-550 Hicri/1118-1155 Miladi) saltanatına kadar uzanır; bu yapılar halefleri tarafından tamamlanmıştır. Konya, Danişmendidler Selçukluların Çanakkale Boğazı'na giden kuzey yolunu kapattığı dönemde güney yolunda hakim bir konumdaydı ve Selçuklu dönemi boyunca tarihinin zirvesinde kaldı. {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 287}"
  id: "Perkembangan sejati Konya dimulai pada masa pemerintahan Sultan Masoud I (512–550 H/1118–1155 M), yang memutuskan untuk menjadikannya ibu kota dan membangun sebuah masjid serta monumen di sana, yang kemudian diselesaikan oleh para penerusnya. Lokasi ini sangat dominan di jalur selatan ketika Dinasti Danishmendid menghalangi Seljuk dari jalur utara menuju Dardanelles, dan Konya tetap berada di puncak kejayaannya selama era Seljuk. {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 287}"
