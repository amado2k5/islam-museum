label: { en: "Umar adopts the Hijra as the starting point of the calendar", ar: "اعتماد عمر الهجرة بداية للتأريخ", es: "Umar adopta la Hégira como punto de partida del calendario.", fr: "Umar adopte l'Hégire comme point de départ du calendrier" }
summary:
  en: "Umar gathered the Companions to fix a settled date for administering the young state. Ali said the calendar should begin from the year the Prophet emigrated and left the land of polytheism, and Umar adopted it."
  ar: "جمع عمر الصحابة ليضعوا تاريخاً ثابتاً لضبط أمور الدولة الفتية، فقال علي: من يوم هاجر رسول الله وترك أرض الشرك، ففعله عمر."
  es: "Umar reunió a los Compañeros para fijar una fecha definitiva para la administración del joven estado. Ali propuso que el calendario comenzara el año en que el Profeta emigró y abandonó la tierra del politeísmo, y Umar lo aceptó."
  fr: "Umar réunit les Compagnons afin de fixer une date pour l'instauration du gouvernement du jeune État. Ali proposa que le calendrier débute l'année de l'émigration du Prophète, qui quitta le pays du polythéisme, et Umar adopta cette proposition."
