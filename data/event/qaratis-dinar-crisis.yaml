label: { ar: "أمر القراطيس وضرب الدنانير", en: "The Papyrus Affair and the Striking of the Dinars", es: "El asunto del papiro y la acuñación de los dinares", fr: "L'affaire du papyrus et la frappe des dinars", ur: "پیپرس کا معاملہ اور دینار کی مار", tr: "Belgelerin düzenlenmesi ve dinar basımının yapılması.", id: "Pesan dokumen dan pencetakan dinar." }
summary:
  ar: "عند البلاذري: كانت القراطيس تدخل بلاد الروم من أرض مصر ويأتي العرب من قبل الروم الدنانير وكان عبد الملك بن مروان من أول من أحدث الكتاب الذي يكتب في رؤوس الطوامير — «قل هو الله أحد» وغيرها من ذكر الله — فكتب إليه ملك الروم إنكم أحدثتم في قراطيسكم كتاباً نكرهه فإن تركتموه والّا أناكم في الدنانير من ذكرنيّكم ما تكرهونه فكبُر ذلك في صدر عبد الملك فكره أن يدع سنة حسنة سنّها فأرسل إلى خالد بن يزيد بن معاوية — يا أبا هاشم إحدى بنات طبق — فقال: افرخ روعك يا أمير المؤمنين حرّم دنانيرهم فلا يتعامل بها واضرب للناس سككاً ولا تعفّ هؤلاء الكفرة مما كرهوا في الطوامير فقال عبد الملك فرجتها عني فرج الله عنك وضرب الدنانير. وقال عوانة بن الحكم: كانت الأقباط تذكر المسيح في رؤوس الطوامير وتنسبه إلى الربوبية وتجعل الصليب مكان بسم الله الرحمن الرحيم فلذلك قوّه ملك الروم ما كره واشتد عليه تغيير عبد الملك ما غيّره. وقال المدائني عن مسلمة بن محارب: أشار خالد بن يزيد على عبد الملك بتحريم دنانيرهم والمنع من التعامل بها وأن يدخل بلاد الروم شيء من القراطيس فمكث حيناً لا يحمل إليهم."
  en: "In al-Baladhuri: papyrus rolls entered Roman lands from Egypt and dinars came to the Arabs from the Romans; Abd al-Malik ibn Marwan was among the first to inscribe what was written at scroll-heads — 'Say He is God, One' and other mentions of God — so Rome's king wrote him: 'you have introduced an inscription on your papyri that we hate; if you leave it, we will put on the dinars of mention of you what you hate.' That weighed on Abd al-Malik — loath to abandon a good practice he had established — so he sent to Khalid ibn Yazid ibn Mu'awiya, who said: 'set your heart at ease, Commander of the Faithful: forbid their dinars that they not be traded, strike coinage for the people, and do not relieve these unbelievers of what they hated in the scrolls.' Abd al-Malik said 'you have relieved me, may God relieve you' and struck the dinars. Awana ibn al-Hakam said: the Copts used to mention Christ at scroll-heads attributing divinity to him, placing the cross where the basmala was — hence Rome's king was galled and Abd al-Malik's change weighed on him. Al-Mada'ini via Maslama ibn Muharib: Khalid ibn Yazid counselled Abd al-Malik to forbid their dinars, prevent trading in them, and stop papyrus entering Roman lands — so for a time none was carried to them."
  es: "En al-Baladhuri: los rollos de papiro llegaron a tierras romanas desde Egipto y los dinares llegaron a los árabes desde Roma; Abd al-Malik ibn Marwan fue uno de los primeros en inscribir lo que estaba escrito en los encabezados de los rollos —«Di que Él es Dios, Uno» y otras menciones de Dios—, por lo que el rey de Roma le escribió: «Has introducido en tus papiros una inscripción que odiamos; si la dejas, pondremos en los dinares menciones de ti lo que odias». Esto le pesaba a Abd al-Malik —reacio a abandonar una buena práctica que había establecido—, así que envió a Khalid ibn Yazid ibn Mu'awiya, quien dijo: «Tranquilízate, Comandante de los Creyentes: prohíbe que sus dinares no se comercialicen, acuña monedas para el pueblo y no liberes a estos incrédulos de lo que odiaban en los rollos». Abd al-Malik dijo: «Me has liberado, que Dios te libere» y acuñó los dinares. Awana ibn al-Hakam dijo: los coptos solían mencionar a Cristo en los encabezados de los rollos, atribuyéndole divinidad y colocando la cruz donde estaba la basmala; por eso el rey de Roma se enfureció y el cambio de Abd al-Malik le resultó difícil de aceptar. Al-Mada'ini, a través de Maslama ibn Muharib, dijo: Khalid ibn Yazid aconsejó a Abd al-Malik que prohibiera sus dinares, impidiera su comercio y detuviera la entrada de papiros en tierras romanas; por lo tanto, durante un tiempo no se les llevó ninguno."
  fr: "Dans al-Baladhuri: les rouleaux de papyrus arrivèrent en territoire romain depuis l’Égypte et les dinars parvinrent aux Arabes depuis les Romains. Abd al-Malik ibn Marwan fut parmi les premiers à inscrire ce qui figurait en tête des rouleaux – « Dis: Il est Dieu, l’Unique » et d’autres mentions de Dieu – si bien que le roi de Rome lui écrivit: « Tu as introduit sur tes papyrus une inscription que nous abhorrons; si tu la laisses, nous inscrirons sur les dinars à ton nom ce que tu abhorres. » Cette remarque pesa sur Abd al-Malik – réticent à abandonner une bonne pratique qu’il avait instaurée – et il envoya un message à Khalid ibn Yazid ibn Mu’awiya, qui lui dit: « Rassure-toi, Commandeur des Croyants: interdis leur commerce, frappe de la monnaie pour le peuple et ne prive pas ces mécréants de ce qu’ils ont abhorré dans les rouleaux. » Abd al-Malik dit: « Vous m'avez soulagé, que Dieu vous soulage ! » et frappa les dinars. Awana ibn al-Hakam rapporte que les Coptes avaient coutume de mentionner le Christ en tête de rouleaux, lui attribuant une divinité et plaçant la croix à l'emplacement de la basmala. C'est pourquoi le roi de Rome fut irrité et le changement opéré par Abd al-Malik le préoccupa. Al-Mada'ini, d'après Maslama ibn Muharib, rapporte que Khalid ibn Yazid conseilla à Abd al-Malik d'interdire leurs dinars, d'en empêcher le commerce et d'empêcher l'entrée de papyrus en territoire romain. Ainsi, pendant un certain temps, aucun papyrus ne leur parvint."
  ur: "البلادوری میں ہے: پیپرس رول مصر سے رومی سرزمین میں داخل ہوئے اور دینار رومیوں سے عربوں میں آئے۔ عبد الملک بن مروان سب سے پہلے ان لوگوں میں سے تھے جنہوں نے طومار کے سروں پر لکھا تھا - 'کہو وہ خدا ہے، ایک ہے' اور خدا کے دوسرے تذکرے - تو روم کے بادشاہ نے اسے لکھا: 'تم نے اپنی پاپری پر ایک نوشتہ متعارف کروایا ہے جس سے ہمیں نفرت ہے۔ اگر آپ نے اسے چھوڑ دیا تو ہم آپ کے ذکر کے دینار پہنیں گے جس سے آپ کو نفرت ہے۔' اس کا وزن عبد الملک پر تھا - اپنے قائم کردہ اچھے عمل کو ترک کرنے سے نفرت - لہذا اس نے خالد بن یزید ابن معاویہ کے پاس بھیجا، جس نے کہا: 'اپنے دل کو سکون دو، وفاداروں کے کمانڈر: ان کے دینار کو منع کریں کہ ان کی خرید و فروخت نہ کی جائے، لوگوں کے لئے سکہ چلائیں، اور ان چیزوں سے چھٹکارا نہ دیں جس میں وہ بے ڈھنگے ہیں'۔ عبد الملک نے کہا 'تم نے مجھے راحت دی ہے، خدا تمہیں راحت دے' اور دینار مارے۔ عوانہ بن الحکم نے کہا: قبطی طومار کے سروں پر مسیح کا تذکرہ کرتے تھے اور اس کی طرف الوہیت منسوب کرتے تھے، صلیب کو وہیں رکھتے تھے جہاں بسملہ تھا- اس وجہ سے روم کے بادشاہ کو غصہ آیا اور عبد الملک کی تبدیلی اس پر وزنی تھی۔ المدائنی بذریعہ مسلمہ ابن محرب: خالد بن یزید نے عبد الملک کو مشورہ دیا کہ وہ ان کے دینار سے منع کریں، ان کی تجارت کو روکیں، اور رومی سرزمینوں میں پاپائرس کو داخل ہونے سے روکیں - چنانچہ ایک وقت تک ان کے پاس کوئی نہیں پہنچایا گیا۔"
  tr: "El-Baladhuri'ye göre: Papirüsler Mısır topraklarından Roma topraklarına girerdi ve Araplar da Roma yönünden dinar getirirlerdi. Abdülmalik ibn Mervan, ruloların üst kısımlarına yazılan \"De ki: O, Allah'tır, birdir\" ve Allah'ı hatırlatan diğer yazıları ilk getirenlerden biriydi. Bunun üzerine Roma kralı ona şöyle yazdı: \"Papirüsünüze hoşumuza gitmeyen bir yazı eklediniz. Eğer onu bırakırsanız, aksi takdirde hoşunuza gitmeyen şeyi dinarlara yazacağım.\" Bu Abdülmalik için çok zordu, bu yüzden kurduğu iyi bir geleneği terk etmek istemedi. Bunun üzerine Halid ibn Yezid ibn Muaviye'ye — \"Ey Ebu Haşim, Tabak'ın kızlarından biri\" — şöyle bir elçi gönderdi: \"Ey Müminlerin Emiri, korkunu gider. Dinarlarını yasakla ki onlarla muamele edilmesin, halk için para bas ve bu kâfirleri, kutsal metinlerde hoşlanmadıkları şeylerden muaf tutma.\" Abdülmalik, \"Beni rahatlattın, Allah seni rahatlatsın\" dedi ve dinarları bastırdı. Avana ibn el-Hakam şöyle dedi: Kıptiler, kutsal metinlerinin en üstüne İsa'yı zikrediyor, ona ilahlık atfediyor ve \"Rahman ve Rahim olan Allah'ın adıyla\" ifadesinin yerine haç koyuyorlardı. Bu nedenle, Bizans imparatoru hoşlanmadığı şeyi güçlendirdi ve Abdülmalik'in onun değiştirdiği şeylerde yaptığı değişiklikler onun için çok zordu. El-Madaini, Maslama ibn Muharib'den rivayetle şöyle demiştir: Halid ibn Yazid, Abdülmalik'e dinarlarını yasaklamasını, ticarette kullanılmasını engellemesini ve Bizans topraklarına bir miktar kağıt paranın girmesine izin vermesini tavsiye etmiştir. Ancak bir süre onlara hiçbir kağıt para gönderilmemiştir."
  id: "Menurut Al-Baladhuri: Papirus dulunya masuk ke wilayah Romawi dari Mesir, dan orang Arab membawa dinar dari arah Romawi. Abd al-Malik ibn Marwan adalah salah satu orang pertama yang memperkenalkan tulisan yang ditulis di bagian atas gulungan—\"Katakanlah, Dialah Allah Yang Maha Esa\" dan zikir-zikir Allah lainnya—maka raja Romawi menulis kepadanya, \"Engkau telah memperkenalkan tulisan di papirusmu yang tidak kami sukai. Jika engkau meninggalkannya, maka aku akan memberimu dinar sesuai dengan apa yang engkau tidak sukai.\" Ini sangat sulit bagi Abd al-Malik, sehingga ia tidak ingin meninggalkan tradisi baik yang telah ia bangun. Maka ia mengirim utusan kepada Khalid ibn Yazid ibn Muawiyah — “Wahai Abu Hashim, salah seorang putri Tabaq” — dan ia berkata, “Hilangkanlah ketakutanmu, wahai Amirul Mukminin. Laranglah dinar mereka agar tidak diperdagangkan, dan cetaklah koin untuk rakyat, dan janganlah mengecualikan orang-orang kafir ini dari apa yang mereka benci dalam gulungan-gulungan itu.” Abd al-Malik berkata, “Engkau telah melegakanku, semoga Allah melegakanmu,” dan ia mencetak dinar-dinar tersebut. Awana ibn al-Hakam berkata: Orang-orang Koptik biasa menyebut Kristus di bagian atas gulungan mereka, mengaitkan keilahian kepadanya dan menempatkan salib di tempat \"Dengan nama Allah, Yang Maha Pengasih, Yang Maha Penyayang.\" Oleh karena itu, kaisar Bizantium memperkuat apa yang tidak disukainya, dan perubahan Abd al-Malik terhadap apa yang telah diubahnya sangat sulit baginya. Al-Madaini, berdasarkan riwayat Maslama ibn Muharib, berkata: Khalid ibn Yazid menasihati Abd al-Malik untuk melarang dinar mereka dan mencegah penggunaannya dalam transaksi, serta mengizinkan beberapa lembar kertas masuk ke wilayah Bizantium. Namun, untuk sementara waktu, tidak ada kertas yang dikirim kepada mereka."
