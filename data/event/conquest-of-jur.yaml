id: event/conquest-of-jur
class: event
kind: conquest
label: { ar: "فتح جور", en: "Conquest of Jur", es: "Conquista de Jur", fr: "Conquête de Jur", ur: "جور کی فتح" }
summary:
  ar: "جور مدينة أردشير خرة وكان هرم بن حيان مقيماً عليها وكان المسلمون يعانونها ثم ينصرفون عنها فيعانون أصطخر ويغزون نواحي كأنها تنتقض عليهم فلما نزل ابن عامر بها قاتلوه ثم تحصنوا ففتحها بالسيف عنوة سنة ٢٩ وروى أن جور غزيت عدة سنين فلم يقدر عليها حتى دخل المدينة من مدخل لها خفي فألزم المسلمون بذلك المدخل حتى دخلوا منه وفتحوها وفتح ابن عامر الكاريان وفشجان وهي الفيشجان من دارابجرد ولم تكونا دخلتا في صلح الهربذ وانتقضتا."
  en: "Jur, Ardashir-Khurra's city, where Harim ibn Hayyan stood — the Muslims besieged it and came away to besiege Istakhr, raiding the countryside as if broken. When Ibn Amir sat before it they fought then fortified, and he took it by the sword in 29h; another telling: raided for years until they entered by a hidden way they held to till the city fell. Ibn Amir also took al-Karyan and Fashjan of Darabjird — neither had joined the Hirbadh's sulh, and both had breached."
  es: "Jur, la ciudad de Ardashir-Khurra, donde se encontraba Harim ibn Hayyan, fue asediada por los musulmanes, quienes luego se dirigieron a sitiar Istakhr, saqueando la región como si estuviera derrotada. Cuando Ibn Amir se sentó frente a ella, lucharon contra ella y la fortificaron, y la tomó por la espada en el año 29 de la Hégira. Otra versión cuenta que la saquearon durante años hasta que entraron por un camino secreto y resistieron hasta que la ciudad cayó. Ibn Amir también tomó al-Karyan y Fashjan de Darabjird; ninguna de las dos se había unido al sulh de Hirbadh, y ambas habían sido conquistadas."
  fr: "Jur, ville d'Ardashir-Khurra où Harim ibn Hayyan se tenait, fut assiégée par les musulmans qui se dirigèrent ensuite vers Istakhr, pillant la campagne environnante comme si elle était dévastée. Lorsqu'Ibn Amir prit position devant la ville, ils la combattirent, puis la fortifièrent. Il s'en empara par l'épée en 29 H. Selon une autre version, les pillages durèrent des années, jusqu'à ce que les assaillants pénètrent par un passage secret et tiennent bon jusqu'à la chute de la ville. Ibn Amir prit également al-Karyan et Fashjan de Darabjird; aucune des deux n'avait rejoint le sulh d'Hirbadh, et toutes deux avaient percé les lignes ennemies."
  ur: "جور، اردشیر خرہ کا شہر، جہاں حریم بن حیان کھڑا تھا - مسلمانوں نے اس کا محاصرہ کر لیا اور استخار کا محاصرہ کرنے کے لیے دور نکل آئے، دیہی علاقوں پر اس طرح چھاپے مارے جیسے ٹوٹ گئے ہوں۔ جب ابن عامر اس کے سامنے بیٹھا تو وہ لڑے پھر قلعہ بندی کی، اور اس نے 29ھ میں اسے تلوار سے لے لیا۔ ایک اور بتانا: برسوں تک چھاپہ مارا یہاں تک کہ وہ ایک چھپے ہوئے راستے سے داخل ہوئے جب تک کہ شہر گر گیا۔ ابن عامر نے درابجرد کے الکریان اور فشجان کو بھی لیا - دونوں میں سے کوئی بھی حیرباد کی سلح میں شامل نہیں ہوا تھا اور دونوں نے خلاف ورزی کی تھی۔"
