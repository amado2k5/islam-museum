label: { ar: "فتح جور", en: "Conquest of Jur" }
summary:
  ar: "جور مدينة أردشير خرة وكان هرم بن حيان مقيماً عليها وكان المسلمون يعانونها ثم ينصرفون عنها فيعانون أصطخر ويغزون نواحي كأنها تنتقض عليهم فلما نزل ابن عامر بها قاتلوه ثم تحصنوا ففتحها بالسيف عنوة سنة ٢٩ وروى أن جور غزيت عدة سنين فلم يقدر عليها حتى دخل المدينة من مدخل لها خفي فألزم المسلمون بذلك المدخل حتى دخلوا منه وفتحوها وفتح ابن عامر الكاريان وفشجان وهي الفيشجان من دارابجرد ولم تكونا دخلتا في صلح الهربذ وانتقضتا."
  en: "Jur, Ardashir-Khurra's city, where Harim ibn Hayyan stood — the Muslims besieged it and came away to besiege Istakhr, raiding the countryside as if broken. When Ibn Amir sat before it they fought then fortified, and he took it by the sword in 29h; another telling: raided for years until they entered by a hidden way they held to till the city fell. Ibn Amir also took al-Karyan and Fashjan of Darabjird — neither had joined the Hirbadh's sulh, and both had breached."
