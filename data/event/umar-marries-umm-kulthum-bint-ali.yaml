id: event/umar-marries-umm-kulthum-bint-ali
class: event
kind: other
label: { en: "Umar's marriage to Umm Kulthum bint Ali", ar: "زواج عمر من أم كلثوم بنت علي", es: "El matrimonio de Umar con Umm Kulthum bint Ali", fr: "Le mariage d'Umar avec Umm Kulthum bint Ali", ur: "عمر کا نکاح ام کلثوم بنت علی سے ہوا۔" }
summary:
  en: "Umar asked Ali for his daughter Umm Kulthum, the child of Ali and Fatima. Ali agreed, and Umar went to the Muhajirun saying 'congratulate me', and gave as his reason words he heard from the Prophet about kinship. Sallabi notes the high regard Umar had for the household of the Prophet."
  ar: "خطب عمر أم كلثوم بنت علي وفاطمة، فقال علي: قد فعلت، فأقبل عمر إلى المهاجرين مسروراً يقول: رفئوني، وذكر أن سبب زواجه ما سمعه من النبي. ويرى الكتاب أن عمر كان يكن لأهل البيت محبة خاصة لقرابتهم من النبي."
  es: "Umar le pidió a Ali que le entregara a su hija Umm Kulthum, fruto de su relación con Fátima. Ali accedió, y Umar acudió a los Muhajirun diciéndoles: «Felicítenme», y justificó su petición citando palabras del Profeta sobre el parentesco. Sallabi destaca el gran respeto que Umar sentía por la familia del Profeta."
  fr: "Umar demanda à Ali la main de sa fille Umm Kulthum, née de son union avec Fatima. Ali accepta, et Umar se rendit auprès des Muhajirun pour les féliciter, invoquant des paroles du Prophète concernant les liens de parenté. Sallabi souligne la grande estime qu'Umar portait à la famille du Prophète."
  ur: "عمر نے علی سے اپنی بیٹی ام کلثوم جو کہ علی اور فاطمہ کی اولاد کا مطالبہ کیا۔ علی نے رضامندی ظاہر کی، اور عمر مہاجرین کے پاس گئے اور 'مجھے مبارکباد دیں'، اور ان کے دلائل کے طور پر وہ الفاظ بیان کیے جو انہوں نے رسول اللہ سے رشتہ داری کے بارے میں سنے تھے۔ سلبی نے عمر کو رسول اللہ کے گھر والوں کے لیے بہت زیادہ عزت دی ہے۔"
