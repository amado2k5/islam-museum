summary:
  en: "Umar asked Ali for his daughter Umm Kulthum, the child of Ali and Fatima. Ali agreed, and Umar went to the Muhajirun saying 'congratulate me', and gave as his reason words he heard from the Prophet about kinship. Sallabi notes the high regard Umar had for the household of the Prophet."
  ar: "خطب عمر أم كلثوم بنت علي وفاطمة، فقال علي: قد فعلت، فأقبل عمر إلى المهاجرين مسروراً يقول: رفئوني، وذكر أن سبب زواجه ما سمعه من النبي. ويرى الكتاب أن عمر كان يكن لأهل البيت محبة خاصة لقرابتهم من النبي."
