label: { ar: "قتل شجر الدر زوجها عز الدين أيبك", en: "Shajar al-Durr's killing of her husband Izz al-Din Aybak", fr: "Le meurtre d'Izz al-Din Aybak par son épouse Shajar al-Durr", es: "El asesinato del esposo de Shajar al-Durr, Izz al-Din Aybak.", ur: "شجر الدر کا اپنے شوہر عزالدین ایبک کا قتل", tr: "Shajar al-Durr, kocası İzzeddin Aybak'ı öldürdü.", id: "Shajar al-Durr membunuh suaminya, Izz al-Din Aybak." }
summary:
  ar: "وفي سنة خمس وخمسين وست مئة مات المعز أيبك سلطان مصر قتلته زوجته شجر الدر وسلطنوا بعده ولده الملك المنصور علياً {cite:tarikh-khulafa-minhaj-1434 p. 710}. وفي شذرات الذهب شاع الخبر أن الملك المعز يتزوج بابنة صاحب الموصل فعظم ذلك على زوجته شجرة الدر وعزمت على الفتك به واتفقت مع جماعة من الخدم ووعدتهم بأموال عظيمة فركب المعز للعب الكرة وجارى تعبان فدخل الحمام يغتسل فلما صار عرياناً رمته الخدام إلى الأرض وخنقوه ليلاً ولم يدر به أحد فأصبح الناس من الأمراء والكبراء على عادتهم للخدمة فإذا هو ميت فاختبطت المدينة ثم سلطنوا بعده ابنه الملك المنصور علياً وفيها وصلت التتار إلى الموصل وخربوا بلادها {cite:shadharat-dhahab p. 275}."
  en: "In 655 al-Mu'izz Aybak, sultan of Egypt, died — killed by his wife Shajar al-Durr; they raised his son al-Malik al-Mansur Ali after him {cite:tarikh-khulafa-minhaj-1434 p. 710}."
  fr: "En 655 mourut al-Mu'izz Aybak, sultan d'Égypte, tué par son épouse Shajar al-Durr ; on éleva après lui son fils al-Malik al-Mansur Ali {cite:tarikh-khulafa-minhaj-1434 p. 710}."
  es: "En 655 murió al-Mu'izz Aybak, sultán de Egipto, asesinado por su esposa Shajar al-Durr; criaron a su hijo al-Malik al-Mansur Ali después de él {cita:tarikh-khulafa-minhaj-1434 p. 710}."
  ur: "655 میں مصر کے سلطان المعز ایبک کا انتقال ہوا - اس کی بیوی شجر الدر کے ہاتھوں قتل؛ انہوں نے ان کے بعد ان کے بیٹے المنصور علی کی پرورش کی۔ 710}۔"
  tr: "Hicri 655 yılında Mısır Sultanı Muizz Aybak öldü. Karısı Şecar el-Durr tarafından öldürüldü ve oğlu Kral Mansur Ali onun yerine sultan oldu. {kaynak:tarikh-khulafa-minhaj-1434 s. 710}. Şadharat el-Dhahab'da, Kral Muizz'in Musul hükümdarının kızıyla evlendiği haberinin yayıldığı belirtilir. Bu durum karısı Şecar el-Durr'u çok kızdırdı ve onu öldürmeye karar verdi. Bir grup hizmetkarla komplo kurdu ve onlara büyük bir servet vaat etti. Muizz polo oynamaya çıktı ve bir yılanla koştu. Hamama girip yıkanmaya başladı ve çıplakken hizmetkarlar onu yere atıp geceleyin boğdular. Kimse fark etmedi. Ertesi sabah, prensler ve ileri gelenler de dahil olmak üzere halk, her zamanki ibadet yerlerine gittiler ve onu ölü buldular. Şehir karışıklığa sürüklendi. Ondan sonra oğlu Kral El-Mansur Ali sultan oldu. O yıl Tatarlar Musul'a ulaştılar ve topraklarını yerle bir ettiler. {cite:shadharat-dhahab s. 275}"
  id: "Pada tahun 655 H, Al-Mu'izz Aybak, Sultan Mesir, meninggal dunia. Ia dibunuh oleh istrinya, Shajar al-Durr, dan putranya, Raja Al-Mansur Ali, diangkat menjadi Sultan setelahnya. {cite:tarikh-khulafa-minhaj-1434 p. 710}. Dalam Shadharat al-Dhahab, disebutkan bahwa tersebar kabar bahwa Raja Al-Mu'izz akan menikahi putri penguasa Mosul. Hal ini sangat membuat marah istrinya, Shajar al-Durr, dan ia bertekad untuk membunuhnya. Ia bersekongkol dengan sekelompok pelayan dan menjanjikan mereka kekayaan yang besar. Al-Mu'izz pergi bermain polo dan bertemu dengan seekor ular. Ia memasuki pemandian untuk mandi, dan ketika ia telanjang, para pelayan melemparkannya ke tanah dan mencekiknya di malam hari. Tidak ada yang menyadarinya. Keesokan paginya, orang-orang, termasuk para pangeran dan pejabat tinggi, pergi ke tempat pelayanan mereka seperti biasa dan mendapati dia telah meninggal. Kota itu dilanda kekacauan. Setelahnya, putranya, Raja Al-Mansur Ali, diangkat menjadi Sultan. Pada tahun itu, bangsa Tatar mencapai Mosul dan menghancurkan wilayahnya. {cite:shadharat-dhahab p. 275}."
