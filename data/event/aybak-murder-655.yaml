label: { ar: "قتل شجر الدر زوجها عز الدين أيبك" }
summary:
  ar: "وفي سنة خمس وخمسين وست مئة مات المعز أيبك سلطان مصر قتلته زوجته شجر الدر وسلطنوا بعده ولده الملك المنصور علياً {cite:tarikh-khulafa-minhaj-1434 p. 710}. وفي شذرات الذهب شاع الخبر أن الملك المعز يتزوج بابنة صاحب الموصل فعظم ذلك على زوجته شجرة الدر وعزمت على الفتك به واتفقت مع جماعة من الخدم ووعدتهم بأموال عظيمة فركب المعز للعب الكرة وجارى تعبان فدخل الحمام يغتسل فلما صار عرياناً رمته الخدام إلى الأرض وخنقوه ليلاً ولم يدر به أحد فأصبح الناس من الأمراء والكبراء على عادتهم للخدمة فإذا هو ميت فاختبطت المدينة ثم سلطنوا بعده ابنه الملك المنصور علياً وفيها وصلت التتار إلى الموصل وخربوا بلادها {cite:shadharat-dhahab p. 275}."
  en: "In 655 al-Mu'izz Aybak, sultan of Egypt, died — killed by his wife Shajar al-Durr; they raised his son al-Malik al-Mansur Ali after him {cite:tarikh-khulafa-minhaj-1434 p. 710}."
