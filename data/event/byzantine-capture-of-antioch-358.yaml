label: { ar: "ملك الروم مدينة أنطاكية" }
summary:
  ar: "في سنة 358هـ حصر الروم حصناً قرب أنطاكية يقال له حصن لونا ووافقوا أهله — وهم نصارى — على أن يرتحلوا إلى أنطاكية ويظهروا أنهم انتقلوا خوفاً من الروم فيخدعون أهلها فيدلون الروم على الثغور، ففعلوا وانتقل أهل الحصن وسكنوا أنطاكية قرب الجبل، فلما مضى شهران وافى الروم مع أخي تقفور الملك وكانوا نحو أربعين ألف رجل فأحاطوا بسور أنطاكية وصعدوا الجبل إلى الناحية التي بها أهل الثغور فلما رآهم أهل البلد قد ملكوا تلك الناحية طرحوا أنفسهم من السور وملك الروم البلد ووضعوا فيها السيف ثم أخرجوا الشيوخ والعجائز والأطفال وأخذوا الشبان من الرجال والنساء والصبيان والحبلى فحملوهم سبياً إلى بلاد الروم وكانوا يزيدون على عشرين ألف إنسان، وكان ذلك في ذي الحجة {cite:kamil-ibn-al-athir p. 443-444}."
  en: "In 358 the Byzantines took Antioch by the Luna stratagem — its Christian garrison was sent in as 'refugees' to open the way from the height above the wall; a forty-thousand host with the emperor's brother stormed the panic-stricken city, and over twenty thousand Muslims were carried off as captives in Dhu'l-Hijja {cite:kamil-ibn-al-athir p. 443-444}."
