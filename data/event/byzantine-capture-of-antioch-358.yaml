id: event/byzantine-capture-of-antioch-358
class: event
kind: conquest
label: { ar: "ملك الروم مدينة أنطاكية", en: "Byzantine capture of Antioch", fr: "La prise d'Antioche par les Byzantins", es: "La conquista bizantina de Antioquía", ur: "انطاکیہ پر بازنطینی قبضہ", tr: "Antakya şehrinin Roma kralı", id: "Raja Romawi dari kota Antiokhia" }
summary:
  ar: "في سنة 358هـ حصر الروم حصناً قرب أنطاكية يقال له حصن لونا ووافقوا أهله — وهم نصارى — على أن يرتحلوا إلى أنطاكية ويظهروا أنهم انتقلوا خوفاً من الروم فيخدعون أهلها فيدلون الروم على الثغور، ففعلوا وانتقل أهل الحصن وسكنوا أنطاكية قرب الجبل، فلما مضى شهران وافى الروم مع أخي تقفور الملك وكانوا نحو أربعين ألف رجل فأحاطوا بسور أنطاكية وصعدوا الجبل إلى الناحية التي بها أهل الثغور فلما رآهم أهل البلد قد ملكوا تلك الناحية طرحوا أنفسهم من السور وملك الروم البلد ووضعوا فيها السيف ثم أخرجوا الشيوخ والعجائز والأطفال وأخذوا الشبان من الرجال والنساء والصبيان والحبلى فحملوهم سبياً إلى بلاد الروم وكانوا يزيدون على عشرين ألف إنسان، وكان ذلك في ذي الحجة {cite:kamil-ibn-al-athir p. 443-444}."
  en: "In 358 the Byzantines took Antioch by the Luna stratagem — its Christian garrison was sent in as 'refugees' to open the way from the height above the wall; a forty-thousand host with the emperor's brother stormed the panic-stricken city, and over twenty thousand Muslims were carried off as captives in Dhu'l-Hijja {cite:kamil-ibn-al-athir p. 443-444}."
  fr: "En 358, les Byzantins prirent Antioche grâce au stratagème de Luna : la garnison chrétienne de ce fort fut envoyée dans la ville comme « réfugiés » pour ouvrir le chemin depuis la hauteur dominant le mur ; une armée de quarante mille hommes avec le frère de l'empereur prit d'assaut la ville saisie de panique, et plus de vingt mille musulmans furent emmenés en captivité en Dhu'l-Hijja {cite:kamil-ibn-al-athir p. 443-444}."
  es: "En 358, los bizantinos tomaron Antioquía mediante la estratagema Luna: su guarnición cristiana fue enviada como \"refugiados\" para abrir el camino desde lo alto de la muralla; un ejército de cuarenta mil hombres, con el hermano del emperador, asaltó la ciudad presa del pánico, y más de veinte mil musulmanes fueron llevados cautivos en Dhu'l-Hijja {cite:kamil-ibn-al-athir p. 443-444}."
  ur: "358 میں بازنطینیوں نے لونا اسٹریٹیجم کے ذریعے انطاکیہ پر قبضہ کر لیا - اس کی عیسائی گیریژن کو 'مہاجرین' کے طور پر بھیجا گیا تاکہ دیوار کے اوپر کی بلندی سے راستہ کھولا جا سکے۔ شہنشاہ کے بھائی کے ساتھ چالیس ہزار کے لشکر نے خوف و ہراس زدہ شہر پر دھاوا بول دیا اور ذی الحجہ میں بیس ہزار سے زیادہ مسلمانوں کو اسیر بنا کر لے جایا گیا۔ 443-444}۔"
  tr: "Hicri 358 yılında Romalılar, Antakya yakınlarındaki Luna kalesi adı verilen bir kaleyi kuşattılar ve Hristiyan olan sakinleriyle Antakya'ya taşınmaları ve Romalılardan korktukları için taşınmış gibi davranmaları konusunda anlaştılar; böylece halkı kandırıp Romalıları sınır bölgelerine yönlendireceklerdi. Öyle de yaptılar ve kale halkı Antakya'ya, dağın yakınlarına taşındı ve yerleşti. İki ay geçtikten sonra, kralın kardeşi Tokor ile birlikte yaklaşık kırk bin kişi olan Romalılar geldi. Antakya surlarını kuşattılar ve dağın tepesine, sınır bölgelerindeki halkın bulunduğu tarafa çıktılar. Şehir halkı, Romalıların o tarafı ele geçirdiğini görünce surlardan atladılar ve Romalılar şehri ele geçirip kılıçlarını şehre sapladılar. Sonra yaşlıları, kadınları ve çocukları dışarı çıkardılar ve genç erkekleri, kadınları, oğlanları ve hamile kadınları esir alarak Roma topraklarına götürdüler. Onlar yirmi binden fazla insandı ve bu olay Zilhicce ayında gerçekleşti. {Kaynak: Kamil ibn el-Atir s. 443-444}"
  id: "Pada tahun 358 H, bangsa Romawi mengepung sebuah benteng di dekat Antiokhia yang disebut benteng Luna dan bersepakat dengan penduduknya—yang beragama Kristen—untuk pindah ke Antiokhia dan berpura-pura bahwa mereka pindah karena takut kepada bangsa Romawi, sehingga mereka dapat menipu penduduknya dan mengarahkan bangsa Romawi ke daerah perbatasan. Maka mereka melakukannya, dan penduduk benteng itu pindah dan menetap di Antiokhia dekat gunung. Setelah dua bulan berlalu, bangsa Romawi tiba bersama saudara raja, Tokor, dan mereka berjumlah sekitar empat puluh ribu orang. Mereka mengepung tembok Antiokhia dan naik ke gunung ke sisi tempat penduduk daerah perbatasan berada. Ketika penduduk kota melihat bahwa mereka telah menguasai sisi itu, mereka melompat dari tembok, dan bangsa Romawi menguasai kota dan menancapkan pedang di dalamnya. Kemudian mereka membawa keluar orang tua, wanita, dan anak-anak serta membawa pemuda, wanita, anak laki-laki, dan wanita hamil sebagai tawanan ke negeri Romawi. Mereka berjumlah lebih dari dua puluh ribu orang, dan itu terjadi pada bulan Dzul Hijjah. {mengutip: kamil-ibn-al-athir hal. 443-444}."
