summary:
  ar: "توفي في رمضان سلطان شاه صاحب مرو وما والاها من خراسان وملك أخوه ملكشاه، وكان سلطان شاه قد خاصم أخاه خوارزم شاه تكش دهرًا حتى أدخله على خوارزم القرا خطائيين {cite:kamil-ibn-al-athir p. 228}."
  en: "Sultan Shah, lord of Merv and its Khurasan, died in Ramadan and his brother Malikshah succeeded — the rival who had fought Khwarazmshah Tekish for years and brought the Qara Khitay down upon him {cite:kamil-ibn-al-athir p. 228}."
  es: "Sultan Shah, señor de Merv y su Jorasán, murió en Ramadán y le sucedió su hermano Malikshah, el rival que había luchado contra Khwarazmshah Tekish durante años y había hecho caer sobre él el Qara Khitay {cite:kamil-ibn-al-athir p. 228}."
  fr: "Sultan Shah, seigneur de Merv et de son Khorasan, mourut pendant le Ramadan et son frère Malikshah lui succéda — le rival qui avait combattu Khwarazmshah Tekish pendant des années et avait fait tomber le Qara Khitay sur lui {cite:kamil-ibn-al-athir p. 228}."
  ur: "مرو اور اس کے خراسان کے سردار سلطان شاہ کا انتقال رمضان میں ہوا اور اس کا بھائی ملک شاہ کامیاب ہوا - وہ حریف جس نے خوارزم شاہ تکش سے برسوں تک جنگ کی اور قرہ خیطے کو اس پر گرایا۔ 228}۔"
  tr: "Merv ve Horasan'ın çevresindeki bölgelerin hükümdarı Sultan Şah, Ramazan ayında vefat etti ve kardeşi Malik Şah kral oldu. Sultan Şah, kardeşi Harezm Şah Tekiş ile uzun süredir anlaşmazlık içindeydi ve sonunda onu Kara-Hattayın Harezm'in eline teslim etti. {kaynak: Kamil İbn el-Athir, s. 228}"
  id: "Sultan Shah, penguasa Merv dan daerah sekitarnya di Khorasan, meninggal pada bulan Ramadan, dan saudaranya Malik Shah menjadi raja. Sultan Shah telah lama berselisih dengan saudaranya Khwarazm Shah Tekish hingga akhirnya ia menyerahkannya ke tangan Kara-Khattayin Khwarazm. {cite:kamil-ibn-al-athir p. 228}."
