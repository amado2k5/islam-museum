id: event/the-fight-near-ghayman-and-the-rout-of-ibn-al-ruwayya-289
class: event
kind: other
label:
  ar: "قتال غيمان وهزيمة ابن الروية، جمادى الآخرة 289هـ"
  en: "The fight near Ghayman and the rout of Ibn al-Ruwayya, Jumada II 289 AH"
  ur: "غیمان کی لڑائی اور ابن الرویہ کی شکست، جمادی الآخرہ 289ھ"
summary:
  ar: "أقام عبد الله بن الحسين وأبو القاسم يومين مقابلين للقوم لقطع المادة عن أهل غيمان، ثم عشية الثلاثاء من جمادى الآخرة سنة 289هـ سار القوم للحرب وقد كمنوا كميناً، فحملوا على ميسرة الجعافر فهزموهم وقتلوا جماعة، ثم انعطف أبو محمد وأبو القاسم بالخيل فطردوا القوم؛ وفي يوم الأربعاء خرج القوم من بيت بوس يريدون ابن الروية فهزموه ومن كان معه."
  en: "Abdullah ibn al-Husayn and Abu al-Qasim stayed two days facing the men to cut the supply from the people of Ghayman; then on the evening of a Tuesday of Jumada II 289 AH the men marched to battle, having laid an ambush, and charged the left wing, where the Ja'fari were, and routed them, killing some; Abu Muhammad and Abu al-Qasim then turned with the horse and drove the men off; and on Wednesday the men came out of Bayt Bus against Ibn al-Ruwayya and routed him and those with him."
  ur: "عبداللہ بن الحسین اور ابو القاسم دو دن مخالفوں کے سامنے ٹھہرے رہے تاکہ غیمان والوں سے رسد کاٹ دیں؛ پھر جمادی الآخرہ 289ھ کے ایک منگل کی شام مخالف لڑائی کو نکلے اور ان کا کمین لگا ہوا تھا، انہوں نے بائیں بازو پر جہاں جعفری تھے حملہ کر کے انہیں ہرا دیا اور چند کو مارا؛ ابو محمد اور ابو القاسم نے سواروں کے ساتھ پلٹ کر مخالفوں کو بھگایا؛ اور بدھ کو مخالف بیت بوس سے ابن الرویہ پر نکلے اور اسے اور اس کے ساتھیوں کو ہرا دیا۔"
