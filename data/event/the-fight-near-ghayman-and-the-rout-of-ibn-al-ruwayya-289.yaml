id: event/the-fight-near-ghayman-and-the-rout-of-ibn-al-ruwayya-289
class: event
kind: other
label:
  ar: "قتال غيمان وهزيمة ابن الروية، جمادى الآخرة 289هـ"
  en: "The fight near Ghayman and the rout of Ibn al-Ruwayya, Jumada II 289 AH"
  ur: "غیمان کی لڑائی اور ابن الرویہ کی شکست، جمادی الآخرہ 289ھ"
  es: "La batalla cerca de Ghayman y la derrota de Ibn al-Ruwayya, Jumada II 289 AH"
  fr: "Combat près de Ghayman et déroute d'Ibn al-Ruwayya, Jumada II 289 AH"
  tr: "Gayman Savaşı ve İbnü'r-Raviye'nin Yenilgisi, Cemada el-Ahirah 289 H."
  id: "Pertempuran Ghayman dan Kekalahan Ibnu al-Rawiya, Jumada al-Akhirah 289 H"
summary:
  ar: "أقام عبد الله بن الحسين وأبو القاسم يومين مقابلين للقوم لقطع المادة عن أهل غيمان، ثم عشية الثلاثاء من جمادى الآخرة سنة 289هـ سار القوم للحرب وقد كمنوا كميناً، فحملوا على ميسرة الجعافر فهزموهم وقتلوا جماعة، ثم انعطف أبو محمد وأبو القاسم بالخيل فطردوا القوم؛ وفي يوم الأربعاء خرج القوم من بيت بوس يريدون ابن الروية فهزموه ومن كان معه."
  en: "Abdullah ibn al-Husayn and Abu al-Qasim stayed two days facing the men to cut the supply from the people of Ghayman; then on the evening of a Tuesday of Jumada II 289 AH the men marched to battle, having laid an ambush, and charged the left wing, where the Ja'fari were, and routed them, killing some; Abu Muhammad and Abu al-Qasim then turned with the horse and drove the men off; and on Wednesday the men came out of Bayt Bus against Ibn al-Ruwayya and routed him and those with him."
  ur: "عبداللہ بن الحسین اور ابو القاسم دو دن مخالفوں کے سامنے ٹھہرے رہے تاکہ غیمان والوں سے رسد کاٹ دیں؛ پھر جمادی الآخرہ 289ھ کے ایک منگل کی شام مخالف لڑائی کو نکلے اور ان کا کمین لگا ہوا تھا، انہوں نے بائیں بازو پر جہاں جعفری تھے حملہ کر کے انہیں ہرا دیا اور چند کو مارا؛ ابو محمد اور ابو القاسم نے سواروں کے ساتھ پلٹ کر مخالفوں کو بھگایا؛ اور بدھ کو مخالف بیت بوس سے ابن الرویہ پر نکلے اور اسے اور اس کے ساتھیوں کو ہرا دیا۔"
  es: "Abdullah ibn al-Husayn y Abu al-Qasim permanecieron dos días frente a los hombres para cortar el suministro de la gente de Ghayman; luego, en la tarde de un martes de Jumada II de 289 AH, los hombres marcharon a la batalla, después de haber tendido una emboscada, y cargaron contra el flanco izquierdo, donde estaban los Ja'fari, y los derrotaron, matando a algunos; Abu Muhammad y Abu al-Qasim luego dieron la vuelta con el caballo y ahuyentaron a los hombres; y el miércoles los hombres salieron de Bayt Bus contra Ibn al-Ruwayya y lo derrotaron a él y a los que estaban con él."
  fr: "Abdullah ibn al-Husayn et Abu al-Qasim restèrent deux jours face aux hommes pour couper les vivres aux habitants de Ghayman; puis, le mardi soir de Jumada II 289 AH, les hommes marchèrent au combat, après avoir tendu une embuscade, et chargèrent l'aile gauche, où se trouvaient les Ja'fari, et les mirent en déroute, tuant certains d'entre eux; Abu Muhammad et Abu al-Qasim firent alors volte-face à cheval et repoussèrent les hommes; et le mercredi, les hommes sortirent de Bayt Bus contre Ibn al-Ruwayya et le mirent en déroute, lui et ses compagnons."
  tr: "Abdullah bin Hüseyin ve Ebu el-Kasım, Gayman halkının ikmalini kesmek için iki gün boyunca halkın karşısında kaldılar. Sonra Hicri 289 yılının Cemadi ahiret ayının Salı akşamı, halk savaşa yürüdü ve pusu kurdu. Caferlerin sol kanadına saldırdılar, onları yendiler ve bir grubu öldürdüler. Sonra Ebu Muhammed ve Ebu el-Kasım atlarla geri döndüler ve halkı uzaklaştırdılar. Çarşamba günü, halk İbn el-Raviye'yi isteyen Beyt Bos'tan çıktı ve onu ve yanındakileri yendiler."
  id: "Abdullah bin Al-Hussein dan Abu Al-Qasim tinggal selama dua hari di seberang orang-orang untuk memutus pasokan ke penduduk Ghayman. Kemudian pada malam Selasa bulan Jumada Al-Akhirah tahun 289 H, orang-orang berbaris untuk berperang dan telah memasang jebakan. Mereka menyerang sayap kiri Ja’afir dan mengalahkan mereka serta membunuh sekelompok orang. Kemudian Abu Muhammad dan Abu Al-Qasim berbalik dengan kuda-kuda mereka dan mengusir orang-orang itu. Pada hari Rabu, orang-orang keluar dari Beit Bos, mencari Ibn Al-Rawiya, dan mereka mengalahkan dia dan orang-orang yang bersamanya."
