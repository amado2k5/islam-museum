label: { ar: "قتل أرسلان أرغون وتسلم بركياروق خراسان سنة 490", en: "The killing of Arslan Arghun and Berkyaruq's takeover of Khurasan in 490", fr: "Le meurtre d'Arslan Arghun et la prise du Khorasan par Barkiyaruq en 490", es: "El asesinato de Arslan Arghun y la toma de Jorasán por Berkyaruq en 490", ur: "ارسلان ارغون کا قتل اور 490 میں خراسان پر برکیاروق کا قبضہ" }
summary:
  ar: "في سنة تسعين وأربعمائة قتل أرسلان أرغون بن السلطان ألب أرسلان صاحب مرو وبلخ ونيسابور وترمذ — وكان جباراً عنيداً — قتله غلام له بالدامغان، وكان بركياروق قد جهز الجيش مع أخيه سنجر لقتال عمه فبلغهم قتله فتسلم بركياروق نيسابور وبلخ بلا قتال وخُطب له بسمرقند واستخلف سنجر على خراسان واستعمل على خوارزم محمد بن أنشتكين مولى الأمير ميكائيل السلجوقي فلقبه خوارزمشاه {cite:shadharat-dhahab p. 394-395}."
  en: "In 490 Arslan Arghun b. Alp Arslan — lord of Marw, Balkh, Nishapur and Tirmidh, an overbearing stubborn man — was killed by his own ghulam at Damghan; Berkyaruq, already marching with his brother Sanjar against their uncle, then took Nishapur and Balkh without battle, was proclaimed at Samarkand, installed Sanjar over Khurasan and set Muhammad b. Anushtegin over Khwarazm as Khwarazmshah {cite:shadharat-dhahab p. 394-395}."
  fr: "En 490, Arslan Arghun b. Alp Arslan, seigneur de Merv, Balkh, Nishapur et Termez, homme dominateur et obstiné, fut tué par son propre ghulam à Damghan ; Barkiyaruq, qui marchait déjà avec son frère Sanjar contre leur oncle, prit alors Nishapur et Balkh sans combat, fut proclamé à Samarcande, installa Sanjar à la tête du Khorasan et plaça Muhammad b. Anushtegin sur le Khwarezm avec le titre de Khwarazmshah {cite:shadharat-dhahab p. 394-395}."
  es: "En 490 Arslan Arghun b. Alp Arslan — señor de Marw, Balkh, Nishapur y Tirmidh, un hombre prepotente y obstinado — fue asesinado por su propio ghulam en Damghan; Berkyaruq, que ya marchaba con su hermano Sanjar contra su tío, tomó entonces Nishapur y Balkh sin batalla, fue proclamado en Samarcanda, instaló a Sanjar sobre Jorasán y puso a Muhammad b. Anushtegin sobre Corasmia como Khwarazmshah {cite:shadharat-dhahab p. 394-395}."
  ur: "490 میں ارسلان ارغون بی۔ الپ ارسلان - مرو، بلخ، نیشاپور اور ترمذ کا آقا، ایک دبنگ ضدی آدمی - کو اس کے اپنے غلام نے دمغان میں قتل کر دیا۔ برکیاروق، اپنے بھائی سنجار کے ساتھ اپنے چچا کے خلاف پہلے ہی کوچ کر رہا تھا، پھر بغیر جنگ کے نیشاپور اور بلخ پر قبضہ کر لیا، سمرقند میں اعلان کیا گیا، خراسان پر سنجر نصب کیا اور محمد بن کو مقرر کیا۔ خوارزم پر انشتگین بطور خوارزمشاہ 394-395}۔"
