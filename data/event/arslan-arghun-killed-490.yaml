label: { ar: "قتل أرسلان أرغون وتسلم بركياروق خراسان سنة 490" }
summary:
  ar: "في سنة تسعين وأربعمائة قتل أرسلان أرغون بن السلطان ألب أرسلان صاحب مرو وبلخ ونيسابور وترمذ — وكان جباراً عنيداً — قتله غلام له بالدامغان، وكان بركياروق قد جهز الجيش مع أخيه سنجر لقتال عمه فبلغهم قتله فتسلم بركياروق نيسابور وبلخ بلا قتال وخُطب له بسمرقند واستخلف سنجر على خراسان واستعمل على خوارزم محمد بن أنشتكين مولى الأمير ميكائيل السلجوقي فلقبه خوارزمشاه {cite:shadharat-dhahab p. 394-395}."
  en: "In 490 Arslan Arghun b. Alp Arslan — lord of Marw, Balkh, Nishapur and Tirmidh, an overbearing stubborn man — was killed by his own ghulam at Damghan; Berkyaruq, already marching with his brother Sanjar against their uncle, then took Nishapur and Balkh without battle, was proclaimed at Samarkand, installed Sanjar over Khurasan and set Muhammad b. Anushtegin over Khwarazm as Khwarazmshah {cite:shadharat-dhahab p. 394-395}."
