label: { ar: "غارة ابن قباث على الجزيرة وانتصار كميل وشبيب", en: "the Jazīra raid — Kumayl's counterattack and Shabīb's pursuit to Baʿlabakk (39 AH)", es: "La incursión de Jazīra: el contraataque de Kumayl y la persecución de Shabīb hasta Baʿlabakk (39 AH).", fr: "le raid de Jazīra — la contre-attaque de Kumayl et la poursuite de Shabīb jusqu'à Baʿlabakk (39 AH)", ur: "جزیرہ پر حملہ - کمیل کا جوابی حملہ اور شبیب کا بعلبک تک تعاقب ⁦(39 ہجری)⁩", tr: "İbn Kubat'ın adaya düzenlediği baskın ve Kamil ile Şabib'in zaferi", id: "Serangan Ibn Qubath ke pulau itu dan kemenangan Kamil dan Shabib." }
date:
  start: { edtf: "0659", hijri: "0039", calendar: julian, precision: year, status: tradition, derived: true, note: "سنة 39؛ التحويل مشتق {cite:kamil-ibn-al-athir p. 727-728}." }
summary:
  ar: "سيّر معاوية عبد الرحمن بن قباث بن أشيم إلى بلاد الجزيرة، فكتب شبيب بن عامر من نصيبين إلى كميل بن زياد يعلمه خبرهم، فسار كميل في ستمائة فارس فأدركهم وقاتلهم وهزمهم وأكثر القتل فيهم وأمر أن لا يتبع مدبر ولا يجهز على جريح، وقتل من أصحابه رجلان. واتبع شبيب الشاميين فعبر الفرات فأغار حتى بلغ بعلبك، فبعث معاوية حبيب بن مسلمة فلم يدركه، ورجع شبيب فأغار على نواحي الرقة فلم يدع للعثمانية ماشية إلا استاقها، فكتب إليه علي ينهاه عن أخذ أموال الناس إلا الخيل والسلاح، وقال رحم الله شبيبًا لقد أبعد الغارة وعجل الانتصار {cite:kamil-ibn-al-athir p. 727-728}."
  en: "Muʿāwiya sent ʿAbd al-Raḥmān ibn Qubāth raiding into the Jazīra; Shabīb ibn ʿĀmir warned Kumayl ibn Ziyād, who rode out with six hundred and routed them — ordering no fleeing man pursued and no wounded man finished. Shabīb chased the Syrians across the Euphrates as far as Baʿlabakk, then swept the Raqqa country bare of stock; ʿAli wrote forbidding any property but arms and mounts: «may God have mercy on Shabīb — he pushed the raid far and made the victory swift» {cite:kamil-ibn-al-athir p. 727-728}."
  es: "Muʿāwiya envió a ʿAbd al-Raḥmān ibn Qubāth a realizar incursiones en Jazīra; Shabīb ibn ʿĀmir advirtió a Kumayl ibn Ziyād, quien salió con seiscientos hombres y los derrotó, ordenando que no se persiguiera a ningún hombre que huyera ni se rematara a ningún herido. Shabīb persiguió a los sirios a través del Éufrates hasta Baʿlabakk, y luego arrasó la región de Raqqa, despojándola de ganado; ʿAli escribió prohibiendo cualquier propiedad excepto armas y monturas: «Que Dios tenga misericordia de Shabīb; extendió la incursión lejos y logró una victoria rápida» {cite:kamil-ibn-al-athir p. 727-728}."
  fr: "Muʿāwiya envoya ʿAbd al-Raḥmān ibn Qubāth mener un raid dans la Jazira; Shabīb ibn ʿĀmir avertit Kumayl ibn Ziyād, qui partit avec six cents hommes et les mit en déroute, ordonnant de ne poursuivre aucun fuyard ni d’achever aucun blessé. Shabīb poursuivit les Syriens au-delà de l’Euphrate jusqu’à Baʿlabakk, puis ravagea la région de Raqqa, la dépouillant de tout bétail; ʿAli écrivit interdisant toute propriété autre que les armes et les montures: « Que Dieu ait pitié de Shabīb ! Il mena le raid loin et remporta une victoire rapide » {cite: kamil-ibn-al-athir p. 727-728}."
  ur: "معاویہ نے عبدالرحمن بن قطب کو جزیرہ پر چھاپہ مارنے کے لیے بھیجا۔ شبیب بن عامر نے کمیل بن زیاد کو تنبیہ کی، جو چھ سو کے ساتھ نکلا اور ان کو بھگا دیا - حکم دیا کہ کسی بھاگنے والے کا تعاقب نہ کیا جائے اور کوئی زخمی آدمی ختم نہ ہو۔ شبیب نے فرات کے پار بعلبک تک شامیوں کا پیچھا کیا، پھر رقہ کے ملک کو خالی کر دیا۔ علی نے ہتھیاروں اور سواریوں کے علاوہ کسی بھی جائیداد سے منع کرتے ہوئے لکھا: \"خدا شبیب پر رحم کرے - اس نے چھاپے کو بہت آگے بڑھایا اور فتح کو تیز کردیا\"۔ 727-728}۔"
  tr: "Muaviye, Abdülrahman ibn Kubat ibn Aşim'i Cezire bölgesine gönderdi. Şabib ibn Amir, Nusaybin'den Kamil ibn Ziyad'a onların hareketlerini bildiren bir mektup yazdı. Kamil, altı yüz süvariyle ilerledi, onlara yetişti, onlarla savaştı, onları yendi ve ağır kayıplar verdirdi. Kaçan düşmanların takip edilmemesini ve yaralıların öldürülmemesini emretti. Kendi adamlarından ikisi öldürüldü. Şabib daha sonra Suriyelileri takip etti, Fırat'ı geçti ve Baalbek'e kadar baskınlar düzenledi. Muaviye, Habib ibn Maslama'yı gönderdi, ancak onu yakalayamadı. Şabib geri döndü ve Rakka'nın dış mahallelerine baskın düzenleyerek Osmanilere ait tüm hayvanları ele geçirdi. Ali ona, at ve silah dışında hiçbir şey almasını yasaklayan bir mektup yazdı ve şöyle dedi: \"Allah Şabib'e rahmet etsin; geniş çaplı bir baskın düzenledi ve hızlı bir zafer kazandı.\" {cite:kamil-ibn-al-athir s. 727-728}"
  id: "Mu'awiya mengutus Abd al-Rahman ibn Qubath ibn Ashim ke wilayah Jazira. Shabib ibn Amir menulis dari Nusaybin kepada Kamil ibn Ziyad untuk memberitahukan pergerakan mereka. Kamil bergerak dengan enam ratus penunggang kuda, menyusul mereka, melawan mereka, mengalahkan mereka, dan menimbulkan banyak korban. Ia memerintahkan agar musuh yang melarikan diri tidak dikejar, dan yang terluka tidak dihabisi. Dua anak buahnya sendiri tewas. Shabib kemudian mengejar orang-orang Suriah, menyeberangi Sungai Eufrat, dan menyerbu hingga Baalbek. Mu'awiya mengirim Habib ibn Maslama, tetapi ia tidak dapat menangkapnya. Shabib kembali dan menyerbu pinggiran Raqqa, merebut semua ternak milik Utsmani. Ali menulis kepadanya melarangnya mengambil apa pun kecuali kuda dan senjata, dan berkata, \"Semoga Allah merahmati Shabib; ia telah melakukan penyerbuan yang luas dan meraih kemenangan yang cepat.\" {cite:kamil-ibn-al-athir p. 727-728}"
