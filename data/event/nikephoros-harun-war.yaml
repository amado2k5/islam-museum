label: { ar: "كتاب نقفور وغزوة هرقلة", en: "Nikephoros's Letter and the Expedition to Heraclea", es: "La carta de Nicéforo y la expedición a Heraclea", fr: "Lettre de Nicéphore et expédition à Héraclée", ur: "نیکفوروس کا خط اور ہیراکلیہ کی مہم", tr: "Nicephorus Kitabı ve Heraklea'nın Seferi", id: "Kitab Nicephorus dan Kampanye Heraclea" }
summary:
  ar: "في سنة سبع وثمانين ومئة أتى الرشيد كتاب من ملك الروم نقفور ينقض الهدنة التي كانت عقدت بين المسلمين وبين الملكة ريني فكتب إليه من نقفور ملك الروم إلى هارون ملك العرب أما بعد فإن الملكة التي كانت قبلي أقامتك مقام الرخ وأقامت نفسها مقام البيذق فحملت إليك من أموالها أحمالاً وذلك لضعف النساء وحمقهن فإذا قرأت كتابي فاردد ما حصل قبلك من أموالها وإلا فالسيف بيننا وبينك، فاستشاط الرشيد غضباً وكتب على ظهر كتابه من هارون أمير المؤمنين إلى نقفور كلب الروم قد قرأت كتابك يا ابن الكافرة والجواب ما تراه لا ما تسمعه، ثم سار ليومه فلم يزل حتى نازل مدينة هرقل وكانت غزوة مشهودة وفتحاً مبيناً فطلب نقفور الموادعة والتزم بخراج يحمله كل سنة فأجيب، فلما رجع الرشيد إلى الرقة نقض العهد لإياسه من كرة الرشيد في البرد فكر راجعاً في مشقة شديدة حتى أناخ بفنائه وحاز جهاده {cite:tarikh-khulafa-minhaj-1434 p. 461-462}."
  en: "In year 187 a letter reached al-Rashid from Nikephoros, king of the Romans, repudiating the truce made with Empress Irene: 'she set you as the rook and herself as the pawn, carrying you loads of her wealth from women's weakness — restore what reached you or the sword is between us.' Al-Rashid raged and wrote on the letter's back: 'from Harun, Commander of the Faithful, to Nikephoros, dog of the Romans: I have read your letter, son of the infidel woman — the answer is what you will see, not what you will hear.' He marched that day to Heraclea — a witnessed conquest — and Nikephoros sued for peace at yearly tribute; but on the caliph's return to Raqqa he broke faith, trusting winter, and al-Rashid turned back in hardship until he camped before his city and took his prize {cite:tarikh-khulafa-minhaj-1434 p. 461-462}."
  es: "En el año 187 llegó a manos de al-Rashid una carta de Nicéforo, rey de los romanos, repudiando la tregua hecha con la emperatriz Irene: «Te puso como torre y a sí misma como peón, llevándote cargas de su riqueza a costa de la debilidad de las mujeres; devuelve lo que te llegó o la espada estará entre nosotros». Al-Rashid se enfureció y escribió en el reverso de la carta: «De Harún, Comandante de los Creyentes, a Nicéforo, perro de los romanos: He leído tu carta, hijo de la mujer infiel; la respuesta es lo que verás, no lo que oirás». Ese día marchó a Heraclea —una conquista presenciada— y Nicéforo pidió la paz a cambio de un tributo anual; pero al regresar el califa a Raqqa rompió su promesa, confiando en el invierno, y al-Rashid regresó en penurias hasta que acampó frente a su ciudad y tomó su botín {cite:tarikh-khulafa-minhaj-1434 p. 461-462}."
  fr: "En l'an 187, une lettre parvint à al-Rachid de la part de Nicéphore, roi des Romains, répudiant la trêve conclue avec l'impératrice Irène: « Elle t'a pris pour la tour et elle-même pour le pion, te soutirant de lourdes richesses grâce à la faiblesse des femmes; rends ce qui t'est parvenu, sinon l'épée nous séparera. » Al-Rachid, furieux, écrivit au verso de la lettre: « De Haroun, Commandeur des Croyants, à Nicéphore, chien des Romains: J'ai lu ta lettre, fils de l'infidèle; la réponse est ce que tu verras, non ce que tu entendras. » Il marcha ce jour-là sur Héraclée – une conquête qui fut vue et approuvée – et Nicéphore demanda la paix en échange d'un tribut annuel; mais au retour du calife à Raqqa, il manqua à sa parole, se fiant à l'hiver, et al-Rachid rebroussa chemin, accablé par les difficultés, jusqu'à ce qu'il campe devant sa ville et prenne sa prise. 461-462}."
  ur: "187 میں رومیوں کے بادشاہ نیکیفورس کی طرف سے الرشید کو ایک خط پہنچا، جس میں مہارانی آئرین کے ساتھ کی گئی جنگ بندی کو رد کیا گیا: 'اس نے آپ کو روکا اور اپنے آپ کو پیادہ کے طور پر مقرر کیا، عورتوں کی کمزوری سے آپ کو اس کی دولت کا بوجھ اٹھائے - جو کچھ آپ تک پہنچا یا تلوار ہمارے درمیان ہے۔' الرشید نے غصے میں آکر خط کی پشت پر لکھا: 'وفاداروں کے کمانڈر ہارون کی طرف سے، رومیوں کے کتے نیکفوروس کی طرف: میں نے تمہارا خط پڑھا ہے، کافر عورت کے بیٹے، جواب وہ ہے جو تم دیکھو گے، وہ نہیں جو تم سنو گے۔' اس دن اس نے ہیراکلیا کی طرف مارچ کیا - جس کی فتح کا مشاہدہ کیا گیا تھا - اور نیکیفوروس نے سالانہ خراج تحسین پیش کرتے ہوئے امن کے لیے مقدمہ دائر کیا۔ لیکن خلیفہ کی رقہ واپسی پر اس نے سردیوں پر بھروسہ کرتے ہوئے ایمان توڑ دیا، اور الرشید مشکل میں واپس پلٹا یہاں تک کہ اس نے اپنے شہر کے سامنے ڈیرہ ڈالا اور اپنا انعام لے لیا۔ 461-462}۔"
  tr: "Hicri 187 yılında Harun el-Raşid, Bizans İmparatoru İzofros'tan Müslümanlar ile İmparatoriçe İrene arasında varılan ateşkesi bozan bir mektup aldı. Bizans İmparatoru İzofros, Arapların Kralı Harun'a şöyle yazdı: \"Benden önceki kraliçe seni bir kale, kendini de bir piyon gibi gördü ve sana servetinin büyük bir kısmını gönderdi. Bu, kadınların zayıflığı ve aptallığından kaynaklanıyordu. Mektubumu okuduğunda, ondan aldıklarını geri ver, yoksa aramızda kılıç hüküm sürecek.\" El-Raşid öfkelendi ve mektubunun arkasına şunları yazdı: \"Müminlerin Komutanı Harun'dan, Bizanslıların köpeği İzofros'a: Mektubunu okudum, ey kâfir kadının oğlu, ve cevabı göreceksin, duyacağın değil.\" Ardından aynı gün Heraklea şehrini kuşatana kadar yürüdü. Bu, ünlü bir sefer ve kesin bir zaferdi. Nicephorus daha sonra barış istedi ve yıllık haraç ödemeyi kabul etti, bu da kabul edildi. El-Raşid Rakka'ya döndüğünde, soğukta geri dönmesinden umudunu keserek anlaşmayı bozdu. Ardından zorlu bir yolculuk yaparak kampına geri döndü ve amacına ulaştı. {cite:tarikh-khulafa-minhaj-1434 s. 461-462}"
  id: "Pada tahun 187 Hijriah, Harun al-Rashid menerima surat dari Kaisar Bizantium Nicephorus, yang melanggar gencatan senjata yang telah disepakati antara kaum Muslim dan Permaisuri Irene. Nicephorus, Kaisar Bizantium, menulis kepada Harun, Raja Arab: \"Ratu yang mendahuluiku memperlakukanmu seperti benteng dan dirinya sendiri seperti bidak, mengirimkan banyak kekayaannya kepadamu. Ini disebabkan oleh kelemahan dan kebodohan wanita. Ketika kau membaca suratku, kembalikan apa yang kau terima darinya, atau pedang akan menentukan di antara kita.\" Al-Rashid sangat marah dan menulis di balik suratnya: \"Dari Harun, Panglima Kaum Beriman, kepada Nicephorus, anjing Bizantium: Aku telah membaca suratmu, wahai putra seorang wanita kafir, dan jawabannya adalah apa yang akan kau lihat, bukan apa yang akan kau dengar.\" Kemudian pada hari itu juga ia berbaris hingga mengepung kota Heraclea. Itu adalah kampanye yang terkenal dan kemenangan yang jelas. Nicephorus kemudian mencari perdamaian dan setuju untuk membayar upeti tahunan, yang diterima. Ketika al-Rashid kembali ke Raqqa, ia melanggar perjanjian tersebut, karena putus asa dengan kepulangan al-Rashid dalam cuaca dingin. Ia kemudian melakukan perjalanan kembali yang sulit hingga mencapai perkemahannya dan mencapai tujuannya. {cite:tarikh-khulafa-minhaj-1434 p. 461-462}."
