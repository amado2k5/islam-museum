label: { ar: "كتاب نقفور وغزوة هرقلة" }
summary:
  ar: "في سنة سبع وثمانين ومئة أتى الرشيد كتاب من ملك الروم نقفور ينقض الهدنة التي كانت عقدت بين المسلمين وبين الملكة ريني فكتب إليه من نقفور ملك الروم إلى هارون ملك العرب أما بعد فإن الملكة التي كانت قبلي أقامتك مقام الرخ وأقامت نفسها مقام البيذق فحملت إليك من أموالها أحمالاً وذلك لضعف النساء وحمقهن فإذا قرأت كتابي فاردد ما حصل قبلك من أموالها وإلا فالسيف بيننا وبينك، فاستشاط الرشيد غضباً وكتب على ظهر كتابه من هارون أمير المؤمنين إلى نقفور كلب الروم قد قرأت كتابك يا ابن الكافرة والجواب ما تراه لا ما تسمعه، ثم سار ليومه فلم يزل حتى نازل مدينة هرقل وكانت غزوة مشهودة وفتحاً مبيناً فطلب نقفور الموادعة والتزم بخراج يحمله كل سنة فأجيب، فلما رجع الرشيد إلى الرقة نقض العهد لإياسه من كرة الرشيد في البرد فكر راجعاً في مشقة شديدة حتى أناخ بفنائه وحاز جهاده {cite:tarikh-khulafa-minhaj-1434 p. 461-462}."
  en: "In year 187 a letter reached al-Rashid from Nikephoros, king of the Romans, repudiating the truce made with Empress Irene: 'she set you as the rook and herself as the pawn, carrying you loads of her wealth from women's weakness — restore what reached you or the sword is between us.' Al-Rashid raged and wrote on the letter's back: 'from Harun, Commander of the Faithful, to Nikephoros, dog of the Romans: I have read your letter, son of the infidel woman — the answer is what you will see, not what you will hear.' He marched that day to Heraclea — a witnessed conquest — and Nikephoros sued for peace at yearly tribute; but on the caliph's return to Raqqa he broke faith, trusting winter, and al-Rashid turned back in hardship until he camped before his city and took his prize {cite:tarikh-khulafa-minhaj-1434 p. 461-462}."
