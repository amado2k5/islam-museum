id: event/khatib-tripoli-munazara-447
class: event
kind: conference
label:
  ar: "مناظرة الخطيب في الخطابة بطرابلس، نحو ٤٤٧هـ"
  en: "Al-Khatib's preaching disputation at Tripoli, c. 447/1055"
  ur: "طرابلس میں خطیب کی مناظرہ خطابت، تقریباً 447ھ/1055ء"
summary:
  ar: "دخل الخطيب طرابلس في طريق عودته من الحج بحدود سنة ست أو سبع وأربعمائة، وكانت له مناظرة في الخطابة مع القاضي الحسين بن بشر صاحب دار العلم بطرابلس، دوّنها الكراجكي المتوفى سنة ٤٤٩هـ في رحلته ونقلها عنه ابن أبي طيء ثم ابن حجر في لسان الميزان {cite:tarikh-islam-dhahabi p. 93}."
  en: "Al-Khatib entered Tripoli on his way back from the hajj, about 446–447, and held a disputation in the art of preaching with the qadi al-Husayn ibn Bishr, holder of Tripoli's Dar al-'Ilm; al-Karajaki (d. 449) recorded it in his rihla, from whom Ibn Abi Tayy transmitted it, then Ibn Hajar in Lisan al-Mizan {cite:tarikh-islam-dhahabi p. 93}."
  ur: "خطیب حج سے واپسی پر تقریباً 446–447ھ میں طرابلس آئے اور وہاں دار العلم کے صاحب قاضی حسین بن بشر سے خطابت میں مناظرہ ہوا؛ کراجکی ⁦(وفات 449ھ)⁩ نے اسے اپنی رحلہ میں قلمبند کیا، پھر ابن ابی طیع اور ابن حجر نے لسان المیزان میں نقل کیا {cite:tarikh-islam-dhahabi p. 93}۔"
