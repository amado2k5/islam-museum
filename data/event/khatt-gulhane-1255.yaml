label: { ar: "خط شريف كلخانة" }
summary:
  ar: "صدر خط شريف كلخانة سنة ١٨٣٩م على لسان مصطفى رشيد باشا باسم السلطان عبد المجيد الأول، فساوى بين الرعايا المسلمين وغير المسلمين في الحقوق، فلم يلق ترحيباً من الرأي العام العثماني المسلم وأعلن العلماء استنكارهم وتكفيرهم لرشيد باشا واعتبروا الخط منافياً للقرآن في مجمله وبخاصة في مساواته المسيحيين بالمسلمين. ويذكر الصلابي أن إصداره كان الثمن الذي نالته بريطانيا والدول الأوروبية مقابل تسوية النزاع بين السلطان ومحمد علي باشا أثناء الأزمة المعروفة (١٢٥٥–١٢٥٧هـ/١٨٣٩–١٨٤١م)، ويرى أنه نحّى جملة من أحكام الشريعة في شأن أهل الذمة، وتضمن مفهوم «الوطن» بدلاً من «الأمة» فكان أولى الخطوات نحو فصل الدين عن الدولة {cite:dawlat-uthmaniyya-salabi p. 375-377}."
  en: "The Gülhane decree (1839): Reshid Pasha's charter proclaiming equal rights for all Ottoman subjects regardless of faith — denounced by the ulema, and read by the source as the price paid to Britain for settling the Egyptian crisis {cite:dawlat-uthmaniyya-salabi p. 375-377}."
