label: { ar: "النهي عن لعب النيروز والمهرجان ثم الإذن فيه", en: "The ban on Nawruz and Mihrajan revelry, then its lifting", es: "La prohibición de las celebraciones de Nawruz y Mihrajan, y luego su levantamiento.", fr: "L'interdiction des festivités de Nawrouz et de Mihrajan, puis sa levée." }
summary:
  ar: "في جمادى الأولى سنة أربع وثمانين ومائتين نودي في الأرباع والأسواق ببغداد بالنهي عن وقود النار ليلة النيروز وعن صب الماء في يومه، ونودي بمثل ذلك في يوم المهرجان، ثم نودي عشية الخميس أن أمير المؤمنين قد أطلق الناس في وقود النيران وصب الماء، ففعلت العامة في ذلك ما جاوز الحد حتى صبّوا على أصحاب الشرطة، فكان ذلك من أعظم الفتن {cite:muntazam-ibn-al-jawzi p. 172}."
  en: "In Jumada I 284 Baghdad was forbidden the bonfires of Nayruz night and the water-throwing of its day, and the same for Mihrajan; when the ban was lifted at Thursday dusk the crowds overdid it so far they drenched the police themselves — 'one of the greatest tumults' {cite:muntazam-ibn-al-jawzi p. 172}."
  es: "En Jumada I 284, se prohibieron en Bagdad las hogueras de la noche de Nayruz y el lanzamiento de agua durante el día, y lo mismo en Mihrajan; cuando se levantó la prohibición al anochecer del jueves, las multitudes se excedieron tanto que empaparon a la propia policía, «uno de los mayores tumultos» {cite:muntazam-ibn-al-jawzi p. 172}."
  fr: "En Jumada I 284, il fut interdit à Bagdad les feux de joie de la nuit de Nayruz et les jets d'eau de la journée, et il en fut de même pour Mihrajan; lorsque l'interdiction fut levée au crépuscule du jeudi, les foules allèrent trop loin et trempèrent même la police — « l'un des plus grands tumultes » {cite: muntazam-ibn-al-jawzi p. 172}."
