label: { ar: "النهي عن لعب النيروز والمهرجان ثم الإذن فيه" }
summary:
  ar: "في جمادى الأولى سنة أربع وثمانين ومائتين نودي في الأرباع والأسواق ببغداد بالنهي عن وقود النار ليلة النيروز وعن صب الماء في يومه، ونودي بمثل ذلك في يوم المهرجان، ثم نودي عشية الخميس أن أمير المؤمنين قد أطلق الناس في وقود النيران وصب الماء، ففعلت العامة في ذلك ما جاوز الحد حتى صبّوا على أصحاب الشرطة، فكان ذلك من أعظم الفتن {cite:muntazam-ibn-al-jawzi p. 172}."
  en: "In Jumada I 284 Baghdad was forbidden the bonfires of Nayruz night and the water-throwing of its day, and the same for Mihrajan; when the ban was lifted at Thursday dusk the crowds overdid it so far they drenched the police themselves — 'one of the greatest tumults' {cite:muntazam-ibn-al-jawzi p. 172}."
