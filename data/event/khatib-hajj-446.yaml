id: event/khatib-hajj-446
class: event
kind: pilgrimage
label:
  ar: "حج الخطيب وسماعه بالشام ومكة، ٤٤٦هـ"
  en: "Al-Khatib's hajj, with hearings in al-Sham and Mecca, 446/1054"
  ur: "خطیب کا حج اور شام و مکہ میں سماعت، 446ھ/1054ء"
summary:
  ar: "رحل الخطيب إلى الشام حاجاً، فسمع بدمشق وصور ومكة، ولقي بمكة أبا عبد الله القضاعي، وقرأ «صحيح البخاري» في خمسة أيام على كريمة المروزية، ثم رجع إلى بغداد؛ وقد ورد في ترجمة الغزال البغدادي أنه لقي ابن برهان بصور وسمع منه عند رجوعه من الحج سنة ست وأربعين وأربعمائة {cite:tarikh-islam-dhahabi pp. 92-93}."
  en: "Al-Khatib journeyed to al-Sham as a pilgrim and heard at Damascus, Tyre and Mecca; at Mecca he met Abu 'Abd Allah al-Quda'i, and he read the whole of Sahih al-Bukhari in five days upon Karima al-Marwaziyya before returning to Baghdad. His own Tarikh records that he heard Ibn Burhan at Tyre on his way back from the hajj of 446 {cite:tarikh-islam-dhahabi pp. 92-93}."
  ur: "خطیب حاجی بن کر شام روانہ ہوئے اور دمشق، صور اور مکہ میں سماعت کی؛ مکہ میں ابو عبدالله قضاعی سے ملے اور کریمہ مروزیہ پر صحیح بخاری پانچ دن میں پڑھی، پھر بغداد لوٹے۔ ان کی اپنی تاریخ میں ہے کہ 446ھ کے حج سے واپسی پر صور میں ابن برہان سے سماعت کی {cite:tarikh-islam-dhahabi pp. 92-93}۔"
