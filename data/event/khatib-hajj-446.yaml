label:
  ar: "حج الخطيب وسماعه بالشام ومكة، ٤٤٦هـ"
  en: "Al-Khatib's hajj, with hearings in al-Sham and Mecca, 446/1054"
  ur: "خطیب کا حج اور شام و مکہ میں سماعت، 446ھ/1054ء"
  es: "La peregrinación de Al-Khatib, con audiencias en Al-Sham y La Meca, 446/1054"
  fr: "Le pèlerinage d'Al-Khatib, avec des audiences à al-Sham et à La Mecque, 446/1054"
  tr: "El-Hatib, Hicri 446 yılında Hac ibadetini yerine getirdi ve Suriye ile Mekke'de vaazlar dinledi."
  id: "Al-Khatib melaksanakan ibadah haji dan mendengarkan ceramah di Suriah dan Mekah pada tahun 446 Hijriah."
summary:
  ar: "رحل الخطيب إلى الشام حاجاً، فسمع بدمشق وصور ومكة، ولقي بمكة أبا عبد الله القضاعي، وقرأ «صحيح البخاري» في خمسة أيام على كريمة المروزية، ثم رجع إلى بغداد؛ وقد ورد في ترجمة الغزال البغدادي أنه لقي ابن برهان بصور وسمع منه عند رجوعه من الحج سنة ست وأربعين وأربعمائة {cite:tarikh-islam-dhahabi pp. 92-93}."
  en: "Al-Khatib journeyed to al-Sham as a pilgrim and heard at Damascus, Tyre and Mecca; at Mecca he met Abu 'Abd Allah al-Quda'i, and he read the whole of Sahih al-Bukhari in five days upon Karima al-Marwaziyya before returning to Baghdad. His own Tarikh records that he heard Ibn Burhan at Tyre on his way back from the hajj of 446 {cite:tarikh-islam-dhahabi pp. 92-93}."
  ur: "خطیب حاجی بن کر شام روانہ ہوئے اور دمشق، صور اور مکہ میں سماعت کی؛ مکہ میں ابو عبدالله قضاعی سے ملے اور کریمہ مروزیہ پر صحیح بخاری پانچ دن میں پڑھی، پھر بغداد لوٹے۔ ان کی اپنی تاریخ میں ہے کہ 446ھ کے حج سے واپسی پر صور میں ابن برہان سے سماعت کی {cite:tarikh-islam-dhahabi pp. 92-93}۔"
  es: "Al-Khatib viajó a Al-Sham como peregrino y escuchó en Damasco, Tiro y La Meca; en La Meca conoció a Abu Abd Allah al-Quda'i y leyó todo el Sahih al-Bukhari en cinco días sobre Karima al-Marwaziyya antes de regresar a Bagdad. Su propio Tarikh registra que escuchó a Ibn Burhan en Tiro a su regreso del Hajj del año 446 {cite:tarikh-islam-dhahabi pp. 92-93}."
  fr: "Al-Khatib se rendit au Levant en pèlerinage et reçut des enseignements à Damas, Tyr et La Mecque. À La Mecque, il rencontra Abu 'Abd Allah al-Quda'i et lut l'intégralité du Sahih al-Bukhari en cinq jours sur Karima al-Marwaziyya avant de retourner à Bagdad. Son propre Tarikh rapporte qu'il entendit Ibn Burhan à Tyr sur le chemin du retour du hajj de l'an 446 (voir: tarikh-islam-dhahabi, p. 92-93)."
  tr: "El-Hatib, hacı olarak Levant'a seyahat etti ve Şam, Sur ve Mekke'de hadis dinledi. Mekke'de Ebu Abdullah el-Kudî ile görüştü ve beş gün içinde Kerime el-Merveziyye'ye \"Sahih el-Buhari\"yi okudu. Sonra Bağdat'a döndü. El-Gazal el-Bağdadi'nin biyografisinde, 446 Hicri yılında Hac'dan döndüğünde Sur'da İbn Burhan ile görüştüğü ve ondan hadis dinlediği belirtilmektedir. {Kaynak:tarikh-islam-dhahabi, s. 92-93}"
  id: "Al-Khatib melakukan perjalanan ke Levant sebagai seorang peziarah, dan mendengar hadits di Damaskus, Tirus, dan Mekah. Di Mekah, ia bertemu Abu Abdullah al-Quda’i, dan membaca “Sahih al-Bukhari” dalam lima hari kepada Karima al-Marwaziyya. Kemudian ia kembali ke Baghdad. Disebutkan dalam biografi al-Ghazal al-Baghdadi bahwa ia bertemu Ibn Burhan di Tirus dan mendengar hadits darinya ketika ia kembali dari ibadah haji pada tahun 446 H {cite:tarikh-islam-dhahabi pp. 92-93}."
