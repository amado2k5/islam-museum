id: event/sajdat-al-najm
class: event
kind: other
label: { en: "The prostration at surat al-Najm", ar: "سجدة النجم" }
summary:
  en: "In Ramadan of the fifth year, before a great assembly of Quraysh's chiefs in the sanctuary, the Prophet recited surat al-Najm; when he reached its closing prostration and prostrated, none present held back and all fell prostrate — Muslims and polytheists alike, as Bukhari reports."
  ar: "في رمضان من السنة الخامسة تلا النبي سورة النجم على جمع كبير من سادات قريش في الحرم، فلما قرأ آخرها «فاسجدوا لله واعبدوا» ثم سجد لم يتمالك أحد نفسه حتى خرّ ساجداً — مسلمهم ومشركهم — كما روى البخاري؛ وقد وردت رواية تزعم أنهم كذبوا عليه بكلمة عطف فيها على أصنامهم، والكتاب يصفها بالإفك المبين."
