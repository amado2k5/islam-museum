id: event/sajdat-al-najm
class: event
kind: other
label: { en: "The prostration at surat al-Najm", ar: "سجدة النجم", es: "La postración en la sura al-Najm", fr: "La prosternation à la sourate al-Najm", ur: "سورہ نجم کا سجدہ", tr: "Yıldız secdesi", id: "Sujud bintang" }
summary:
  en: "In Ramadan of the fifth year, before a great assembly of Quraysh's chiefs in the sanctuary, the Prophet recited surat al-Najm; when he reached its closing prostration and prostrated, none present held back and all fell prostrate — Muslims and polytheists alike, as Bukhari reports."
  ar: "في رمضان من السنة الخامسة تلا النبي سورة النجم على جمع كبير من سادات قريش في الحرم، فلما قرأ آخرها «فاسجدوا لله واعبدوا» ثم سجد لم يتمالك أحد نفسه حتى خرّ ساجداً — مسلمهم ومشركهم — كما روى البخاري؛ وقد وردت رواية تزعم أنهم كذبوا عليه بكلمة عطف فيها على أصنامهم، والكتاب يصفها بالإفك المبين."
  es: "En el Ramadán del quinto año, ante una gran asamblea de los jefes de Quraysh en el santuario, el Profeta recitó la sura al-Najm; cuando llegó a su postración final y se postró, ninguno de los presentes se contuvo y todos cayeron postrados, tanto musulmanes como politeístas, como relata Bukhari."
  fr: "Au Ramadan de la cinquième année, devant une grande assemblée des chefs de Quraysh dans le sanctuaire, le Prophète récita la sourate al-Najm; lorsqu'il atteignit sa prosternation finale et se prosterna, aucun des présents ne se retint et tous tombèrent prosternés — musulmans et polythéistes confondus, comme le rapporte Bukhari."
  ur: "پانچویں سال کے رمضان میں، حرم میں قریش کے سرداروں کے ایک بڑے اجتماع کے سامنے، نبی نے سورۃ النجم کی تلاوت کی۔ جب وہ سجدے کے اختتام پر پہنچے اور سجدہ کیا تو وہاں موجود کسی نے بھی پیچھے نہ ہٹے اور سب سجدہ میں گر پڑے - جیسا کہ بخاری کی روایت ہے مسلمان اور مشرک۔"
  tr: "Beşinci yılın Ramazan ayında, Peygamberimiz kutsal mekânda Kureyş önderlerinin büyük bir topluluğuna Necm Suresi'ni okudu. Son bölümü olan \"Öyleyse Allah'a secde edin ve O'na ibadet edin\" ayetini okuyup secdeye vardığında, Buhari'nin rivayetine göre, hem Müslümanlar hem de müşrikler, O'nun da secdeye varmasını engelleyemediler. Bir rivayette, Peygamberimizin putlarına olan sevgisini gösteren bir sözle O'na yalan söyledikleri iddia edilmiş, ancak Kitap bunu açık bir yalan olarak nitelendirmiştir."
  id: "Pada bulan Ramadan tahun kelima, Nabi membacakan Surat An-Najm kepada sejumlah besar pemimpin Quraisy di tempat suci. Ketika beliau membaca bagian terakhir, “Maka sujudlah kepada Allah dan sembahlah Dia,” dan kemudian sujud, tidak seorang pun dapat menahan diri untuk tidak sujud—baik kaum Muslim maupun kaum musyrik—sebagaimana diriwayatkan oleh Al-Bukhari. Ada riwayat yang menyatakan bahwa mereka berbohong kepadanya dengan sebuah kata yang menunjukkan kecintaan beliau kepada berhala-berhala mereka, dan Kitab Suci menyebutkan hal itu sebagai kebohongan yang nyata."
