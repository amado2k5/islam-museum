id: event/execution-of-rashid-al-din-718
class: event
kind: death
label:
  ar: "إعدام رشيد الدين وابنه إبراهيم سنة 718"
  en: "Execution of Rashid al-Din and his son Ibrahim, 718 AH"
  ur: "رشید الدین اور ان کے بیٹے ابراہیم کا قتل، 718ھ"
  fr: "Exécution de Rashid al-Din et de son fils Ibrahim, 718 AH"
  es: "Ejecución de Rashid al-Din y de su hijo Ibrahim, 718 AH"
  tr: "718 yılında Reşid el-Din ve oğlu İbrahim'in idam edilmesi."
  id: "Eksekusi Rashid al-Din dan putranya Ibrahim pada tahun 718"
summary:
  ar: "حُكم على رشيد الدين بالإعدام بعد أن اتُّهم بتسميم السلطان ألجايتو، وأُعدم قبله ابنه إبراهيم. تروي الحوليات، كما ينقلها الخشاب، أن التهمة قدّمها أبو بكر آغا، وأن الأمير جوبان قضى بالحكم {cite:jami-al-tawarikh-khashshab-1960 p. 80}، وأن الطبيب جلال الدين بن حران شهد بأن الدواء الملين الذي أُعطي للسلطان بناءً على رأي رشيد الدين أدى إلى موته {cite:jami-al-tawarikh-khashshab-1960 p. 80}. وقُتل رشيد الدين في السادس عشر من جمادى الأولى سنة 718هـ في قرية جوسقدر قرب تبريز، وهو في الثالثة والسبعين من عمره {cite:jami-al-tawarikh-khashshab-1960 p. 81}. ونُهب الربع الرشيدي في تبريز ونُهبت أملاكه وأملاك أقاربه {cite:jami-al-tawarikh-khashshab-1960 p. 81}. ويعرض الخشاب ما يُقال من أن جسده قُطّع وأُرسلت أشلاؤه إلى المدن، ويرى أن هذا غير صحيح {cite:jami-al-tawarikh-khashshab-1960 p. 81}."
  en: "Rashid al-Din was sentenced to death after being accused of poisoning the Sultan Oljeitu, and his son Ibrahim was executed before him. The chronicles, as the introduction reports them, say the charge was brought by Abu Bakr Aqa and the verdict given by Amir Chupan {cite:jami-al-tawarikh-khashshab-1960 p. 80}; the physician Jalal al-Din ibn Harran is recorded as saying the laxative given on Rashid's advice caused the sultan's death {cite:jami-al-tawarikh-khashshab-1960 p. 80}. Rashid al-Din was killed on 16 Jumada I 718 AH at the village of Jusqadar near Tabriz, at the age of seventy-three {cite:jami-al-tawarikh-khashshab-1960 p. 81}. His property, his relatives' property and the Rab' Rashidi quarter in Tabriz were confiscated or looted {cite:jami-al-tawarikh-khashshab-1960 p. 81}. The introduction gives the report that his body was cut up and sent to cities and says this is not correct {cite:jami-al-tawarikh-khashshab-1960 p. 81}."
  ur: "رشید الدین کو سلطان اولجایتو کو زہر دینے کے الزام میں موت کی سزا سنائی گئی، اور ان سے پہلے ان کے بیٹے ابراہیم کو قتل کیا گیا {cite:jami-al-tawarikh-khashshab-1960 p. 79}۔ خشاب کے مطابق 16 جمادی الاولیٰ 718ھ کو تبریز کے قریب جوسقدر میں ان کا قتل ہوا، جب ان کی عمر تہتر سال تھی {cite:jami-al-tawarikh-khashshab-1960 p. 81}۔ ان کی املاک اور تبریز میں ربع رشیدی لوٹ لیا گیا {cite:jami-al-tawarikh-khashshab-1960 p. 81}۔ خشاب جسم کے ٹکڑے کرنے کی روایت کو درست نہیں مانتے {cite:jami-al-tawarikh-khashshab-1960 p. 81}۔"
  fr: "Rashid al-Din fut condamné à mort après avoir été accusé d'avoir empoisonné le sultan Oljeitu ; son fils Ibrahim fut exécuté avant lui. Selon les chroniques rapportées par l'introduction, l'accusation fut portée par Abu Bakr Aqa et le verdict rendu par l'émir Chupan {cite:jami-al-tawarikh-khashshab-1960 p. 80} ; le médecin Jalal al-Din ibn Harran aurait déclaré que le purgatif donné sur l'avis de Rashid avait causé la mort du sultan {cite:jami-al-tawarikh-khashshab-1960 p. 80}. Rashid al-Din fut tué le 16 jumada I 718 AH au village de Jusqadar, près de Tabriz, à l'âge de soixante-treize ans {cite:jami-al-tawarikh-khashshab-1960 p. 81}. Ses biens, ceux de ses proches et le quartier Rab' Rashidi de Tabriz furent confisqués ou pillés {cite:jami-al-tawarikh-khashshab-1960 p. 81}. L'introduction juge incorrecte la version selon laquelle son corps aurait été découpé et envoyé aux villes {cite:jami-al-tawarikh-khashshab-1960 p. 81}."
  es: "Rashid al-Din fue condenado a muerte tras ser acusado de haber envenenado al sultán Oljeitu; su hijo Ibrahim fue ejecutado antes que él. Según las crónicas que recoge la introducción, la acusación la presentó Abu Bakr Aqa y el veredicto lo dictó el emir Chupan {cite:jami-al-tawarikh-khashshab-1960 p. 80}; el médico Jalal al-Din ibn Harran habría declarado que el purgante dado por consejo de Rashid causó la muerte del sultán {cite:jami-al-tawarikh-khashshab-1960 p. 80}. Rashid al-Din fue muerto el 16 de yumada I de 718 AH en la aldea de Jusqadar, cerca de Tabriz, a los setenta y tres años {cite:jami-al-tawarikh-khashshab-1960 p. 81}. Sus bienes, los de sus parientes y el barrio Rab' Rashidi de Tabriz fueron confiscados o saqueados {cite:jami-al-tawarikh-khashshab-1960 p. 81}. La introducción considera incorrecta la versión según la cual su cuerpo fue troceado y enviado a las ciudades {cite:jami-al-tawarikh-khashshab-1960 p. 81}."
  tr: "Raşid Din, Sultan Aljaytu'yu zehirlemekle suçlandıktan sonra ölüm cezasına çarptırıldı ve oğlu İbrahim ondan önce idam edilmişti. El-Haşab'ın aktardığı kroniklere göre, suçlama Ebu Bekir Ağa tarafından yapılmış, hüküm Prens Çuban tarafından verilmiş (kaynak: Cami-i Tevarih-Haşab 1960, s. 80) ve hekim Celaleddin ibn Harran, Raşid Din'in tavsiyesi üzerine Sultan'a verilen müshilin ölümüne yol açtığına dair tanıklık etmiştir (kaynak: Cami-i Tevarih-Haşab 1960, s. 80). Raşid Din, Hicri 718 yılının Cemâde el-Ula ayının on altıncı gününde, Tebriz yakınlarındaki Cüskâdar köyünde, yetmiş üç yaşında öldürüldü (kaynak: Cami-i Tevarih-Haşab 1960, s. 80). 81}. Tebriz'deki Raşidi mahallesi yağmalandı ve onun ve akrabalarının malları da yağmalandı {cite:jami-al-tawarikh-khashshab-1960 s. 81}. El-Haşab, cesedinin parçalara ayrılıp kalıntılarının şehirlere gönderildiği yönündeki söylentileri aktarıyor ve bunun doğru olmadığına inanıyor {cite:jami-al-tawarikh-khashshab-1960 s. 81}."
  id: "Rashid al-Din dijatuhi hukuman mati setelah dituduh meracuni Sultan Aljaytu, dan putranya Ibrahim telah dieksekusi sebelum dia. Kronik, sebagaimana dilaporkan oleh al-Khashab, menyatakan bahwa tuduhan itu diajukan oleh Abu Bakr Agha, dan bahwa Pangeran Chuban mengeluarkan vonis {cite:jami-al-tawarikh-khashshab-1960 hlm. 80}, dan bahwa tabib Jalal al-Din ibn Harran bersaksi bahwa obat pencahar yang diberikan kepada Sultan atas saran Rashid al-Din menyebabkan kematiannya {cite:jami-al-tawarikh-khashshab-1960 hlm. 80}. Rashid al-Din terbunuh pada tanggal enam belas Jumada al-Ula, 718 H, di desa Jusqadar dekat Tabriz, pada usia tujuh puluh tiga tahun {cite:jami-al-tawarikh-khashshab-1960 hlm. 81}. Permukiman Rashidi di Tabriz dijarah, dan harta miliknya serta harta milik kerabatnya dijarah {cite:jami-al-tawarikh-khashshab-1960 p. 81}. Al-Khashab menyajikan apa yang dikatakan tentang tubuhnya yang dipotong-potong dan sisa-sisanya dikirim ke kota-kota, dan dia percaya bahwa ini tidak benar {cite:jami-al-tawarikh-khashshab-1960 p. 81}."
