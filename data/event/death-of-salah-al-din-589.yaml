label: { ar: "وفاة صلاح الدين بدمشق", en: "Death of Salah al-Din at Damascus", es: "Muerte de Saladino en Damasco", fr: "Mort de Saladin à Damas" }
summary:
  ar: "في صفر سنة تسع وثمانين وخمسمائة توفي صلاح الدين يوسف بن أيوب بن شاذي بدمشق، وكان سبب مرضه أنه خرج يلتقي الحاج فعاد فمرض من يومه مرضاً حاداً بقي به ثمانية أيام؛ وكان قبل مرضه أحضر ولده الأفضل علياً وأخاه الملك العادل أبا بكر فاستشارهما قال قد تفرغنا من الفرنج فأي جهة نقصد، فأشار العادل بقصد خلاط لأنه وُعد بها وأشار الأفضل ببلاد الروم التي بيد أولاد قلج أرسلان لأنها أكثر بلاداً وعسكراً وأسرع مأخذاً وهي طريق الفرنج إذا خرجوا على البر، فقال كلاكما مقصر ناقص الهمة بل أقصد بلاد الروم وتأخذ أنت بعض أولادي والعسكر إلى خلاط فإذا فرغت جئت إليكم فندخل أذربيجان ونتصل ببلاد العجم فما فيها من يمنع عنها، فأذن للعادل في المضي إلى الكرك فمرض صلاح الدين وتوفى قبل عوده؛ ويذكر ابن الأثير من حلمه أن مملوكاً رمى بعضهم بسرموز فوقعت قريباً منه فالتفت إلى الجهة الأخرى يكلم جليسه ليتغافل عنها، وطلب الماء في مجلس واحد خمس مرات فلم يحضر فقال يا أصحابنا والله قد قتلني العطش فأحضر فشرب ولم ينكر التواني {cite:kamil-ibn-al-athir p. 224-225}."
  en: "In Safar 589 Salah al-Din Yusuf ibn Ayyub ibn Shadhi died at Damascus. He had ridden out to meet the pilgrims, and on his return he fell ill the same day with a severe illness that lasted eight days. Before the illness he had summoned his son al-Afdal Ali and his brother al-Malik al-Adil Abu Bakr and asked their counsel: 'We are now free of the Franks; where shall we aim?' Al-Adil advised a campaign against Khilat, where he had been promised lands; al-Afdal advised the lands of Rum held by the sons of Qilij Arslan, which were larger, had more troops, were quicker to take, and lay on the Franks' route if they came overland. Salah al-Din said: 'You are both remiss and lacking in resolve. Rather, I shall march on the lands of Rum, and you, Adil, take some of my sons and the army to Khilat; when I have finished I will come to you, and we will enter Azerbaijan and join the lands of the 'Ajam, where none will bar us.' He then let al-Adil set off for al-Karak, and Salah al-Din fell ill and died before al-Adil returned. Ibn al-Athir mentions his forbearance: a mamluk threw a sarmuz at some men and it landed near him, and he turned to the other side and spoke to his companion so as to overlook it. He asked for water five times at one sitting and it was not brought, and he said: 'My companions, by God, thirst has killed me!' Water was brought and he drank, and he did not reproach the delay {cite:kamil-ibn-al-athir p. 224-225}."
  es: "En Safar 589, Salah al-Din Yusuf ibn Ayyub ibn Shadhi murió en Damasco. Había salido a caballo para recibir a los peregrinos, y a su regreso enfermó ese mismo día con una grave enfermedad que duró ocho días. Antes de la enfermedad, había llamado a su hijo al-Afdal Ali y a su hermano al-Malik al-Adil Abu Bakr y les pidió consejo: 'Ahora estamos libres de los francos; ¿adónde nos dirigiremos?' Al-Adil aconsejó una campaña contra Khilat, donde le habían prometido tierras; al-Afdal aconsejó las tierras de Rum en poder de los hijos de Qilij Arslan, que eran más grandes, tenían más tropas, eran más rápidas de tomar y se encontraban en la ruta de los francos si venían por tierra. Salah al-Din dijo: 'Ambos sois negligentes y carecéis de resolución. En cambio, marcharé sobre las tierras de Rum, y tú, Adil, lleva a algunos de mis hijos y al ejército a Khilat; Cuando termine, iré a verte, y entraremos en Azerbaiyán y nos uniremos a las tierras de los 'Ajam, donde nadie nos impedirá el paso. Luego dejó que al-Adil partiera hacia al-Karak, y Salah al-Din enfermó y murió antes de que al-Adil regresara. Ibn al-Athir menciona su paciencia: un mameluco arrojó un sarmuz a unos hombres y cayó cerca de él, y se volvió hacia otro lado y habló con su compañero para no darle importancia. Pidió agua cinco veces seguidas y no se la trajeron, y dijo: «¡Compañeros míos, por Dios, la sed me ha matado!». Le trajeron agua y bebió, y no reprochó la demora {cite:kamil-ibn-al-athir p. 224-225}."
  fr: "En Safar 589, Salah al-Din Yusuf ibn Ayyub ibn Shadhi mourut à Damas. Il était parti à la rencontre des pèlerins et, à son retour, il tomba gravement malade le jour même, souffrant d'une maladie qui dura huit jours. Avant d'être malade, il avait convoqué son fils al-Afdal Ali et son frère al-Malik al-Adil Abu Bakr et leur avait demandé conseil: « Nous sommes désormais libres des Francs; quelle est notre destination ? » Al-Adil conseilla une campagne contre le Califat, où des terres lui avaient été promises; al-Afdal suggéra les terres de Roum, tenues par les fils de Qilij Arslan, plus vastes, mieux armées, plus rapides à conquérir et situées sur la route des Francs s'ils venaient par voie terrestre. Salah al-Din dit: « Vous êtes tous deux négligents et manquez de détermination. Je marcherai plutôt sur les terres de Roum, et toi, Adil, prends quelques-uns de mes fils et l'armée pour le Califat; Quand j'aurai terminé, je viendrai vous rejoindre, et nous entrerons en Azerbaïdjan et rejoindrons les terres des Ajam, où nul ne nous en empêchera. Il laissa ensuite al-Adil partir pour al-Karak, et Salah al-Din tomba malade et mourut avant le retour d'al-Adil. Ibn al-Athir mentionne sa patience: un mamelouk lança un sarmouz sur des hommes, qui atterrit près de lui. Il se détourna et parla à son compagnon pour ne pas s'en apercevoir. Il demanda de l'eau à cinq reprises d'affilée, sans qu'on lui en apporte, et s'écria: « Mes compagnons, par Dieu, la soif me tue ! » On lui apporta de l'eau, il but et ne reprocha pas le retard (voir: Kamil Ibn al-Athir, p. 224-225)."
