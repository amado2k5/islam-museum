label: { ar: "وفاة صلاح الدين بدمشق", en: "Death of Salah al-Din at Damascus" }
summary:
  ar: "في صفر سنة تسع وثمانين وخمسمائة توفي صلاح الدين يوسف بن أيوب بن شاذي بدمشق، وكان سبب مرضه أنه خرج يلتقي الحاج فعاد فمرض من يومه مرضاً حاداً بقي به ثمانية أيام؛ وكان قبل مرضه أحضر ولده الأفضل علياً وأخاه الملك العادل أبا بكر فاستشارهما قال قد تفرغنا من الفرنج فأي جهة نقصد، فأشار العادل بقصد خلاط لأنه وُعد بها وأشار الأفضل ببلاد الروم التي بيد أولاد قلج أرسلان لأنها أكثر بلاداً وعسكراً وأسرع مأخذاً وهي طريق الفرنج إذا خرجوا على البر، فقال كلاكما مقصر ناقص الهمة بل أقصد بلاد الروم وتأخذ أنت بعض أولادي والعسكر إلى خلاط فإذا فرغت جئت إليكم فندخل أذربيجان ونتصل ببلاد العجم فما فيها من يمنع عنها، فأذن للعادل في المضي إلى الكرك فمرض صلاح الدين وتوفى قبل عوده؛ ويذكر ابن الأثير من حلمه أن مملوكاً رمى بعضهم بسرموز فوقعت قريباً منه فالتفت إلى الجهة الأخرى يكلم جليسه ليتغافل عنها، وطلب الماء في مجلس واحد خمس مرات فلم يحضر فقال يا أصحابنا والله قد قتلني العطش فأحضر فشرب ولم ينكر التواني {cite:kamil-ibn-al-athir p. 224-225}."
  en: "In Safar 589 Salah al-Din Yusuf ibn Ayyub ibn Shadhi died at Damascus. He had ridden out to meet the pilgrims, and on his return he fell ill the same day with a severe illness that lasted eight days. Before the illness he had summoned his son al-Afdal Ali and his brother al-Malik al-Adil Abu Bakr and asked their counsel: 'We are now free of the Franks; where shall we aim?' Al-Adil advised a campaign against Khilat, where he had been promised lands; al-Afdal advised the lands of Rum held by the sons of Qilij Arslan, which were larger, had more troops, were quicker to take, and lay on the Franks' route if they came overland. Salah al-Din said: 'You are both remiss and lacking in resolve. Rather, I shall march on the lands of Rum, and you, Adil, take some of my sons and the army to Khilat; when I have finished I will come to you, and we will enter Azerbaijan and join the lands of the 'Ajam, where none will bar us.' He then let al-Adil set off for al-Karak, and Salah al-Din fell ill and died before al-Adil returned. Ibn al-Athir mentions his forbearance: a mamluk threw a sarmuz at some men and it landed near him, and he turned to the other side and spoke to his companion so as to overlook it. He asked for water five times at one sitting and it was not brought, and he said: 'My companions, by God, thirst has killed me!' Water was brought and he drank, and he did not reproach the delay {cite:kamil-ibn-al-athir p. 224-225}."
