label: { ar: "وفاة صلاح الدين بدمشق" }
summary:
  ar: "في صفر سنة تسع وثمانين وخمسمائة توفي صلاح الدين يوسف بن أيوب بن شاذي بدمشق، وكان سبب مرضه أنه خرج يلتقي الحاج فعاد فمرض من يومه مرضاً حاداً بقي به ثمانية أيام؛ وكان قبل مرضه أحضر ولده الأفضل علياً وأخاه الملك العادل أبا بكر فاستشارهما قال قد تفرغنا من الفرنج فأي جهة نقصد، فأشار العادل بقصد خلاط لأنه وُعد بها وأشار الأفضل ببلاد الروم التي بيد أولاد قلج أرسلان لأنها أكثر بلاداً وعسكراً وأسرع مأخذاً وهي طريق الفرنج إذا خرجوا على البر، فقال كلاكما مقصر ناقص الهمة بل أقصد بلاد الروم وتأخذ أنت بعض أولادي والعسكر إلى خلاط فإذا فرغت جئت إليكم فندخل أذربيجان ونتصل ببلاد العجم فما فيها من يمنع عنها، فأذن للعادل في المضي إلى الكرك فمرض صلاح الدين وتوفى قبل عوده؛ ويذكر ابن الأثير من حلمه أن مملوكاً رمى بعضهم بسرموز فوقعت قريباً منه فالتفت إلى الجهة الأخرى يكلم جليسه ليتغافل عنها، وطلب الماء في مجلس واحد خمس مرات فلم يحضر فقال يا أصحابنا والله قد قتلني العطش فأحضر فشرب ولم ينكر التواني {cite:kamil-ibn-al-athir p. 224-225}."
