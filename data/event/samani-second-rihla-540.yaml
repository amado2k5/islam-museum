label:
  ar: "الرحلة الكبرى الثانية للسمعاني، ٥٤٠-٥٤٦هـ/١١٤٥-١١٥١م"
  en: "Al-Sam'ani's second great hadith journey, 540-546/1145-1151"
  ur: "سمعانی کا دوسرا بڑا علمی سفر، 540-546ھ/1145-1151ء"
summary:
  ar: "زار السمعاني من مدينة مرو مراكز العلم في عصره في ثلاث رحلات طويلة: ٥٢٩-٥٣٨هـ، ثم ٥٤٠-٥٤٦هـ، ثم مع ابنه عبد الرحيم ٥٤٩-٥٥٢هـ؛ وعدد من هذه البلدان ومدارسها زارها أكثر من مرة ولو اقتضى ذلك الانعطاف عن الطريق، يدفعه دائماً طلب العلم؛ وحج في مجموع رحلاته مرتين {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}."
  en: "From Marw, al-Sam'ani visited the centres of learning of his time on three long journeys: 529-538, then 540-546/1145-1151, and finally with his son 'Abd al-Rahim 549-552. A number of these places and their schools he visited more than once, even when it meant detours, driven always by his desire for talab al-'ilm; in all he went on pilgrimage twice {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}."
  ur: "سمعانی نے مرو سے اپنے عصر کے علمی مراکز کے تین طویل سفر کیے: 529-538ھ، پھر 540-546ھ/1145-1151ء، اور آخر میں بیٹے عبدالرحیم کے ساتھ 549-552ھ۔ ان میں سے کئی مقامات اور ان کے مدارس کی وہ ایک سے زائد بار زیارت کرتے، خواہ اس کے لیے راستے سے منحرف ہونا پڑتا، ہمیشہ طلبِ علم کی تحریک سے؛ مجموعی طور پر انہوں نے دو بار حج کیا {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}۔"
