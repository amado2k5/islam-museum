label: { ar: "رحلة النبي التجارية إلى الشام في مال خديجة", en: "The Prophet's trade journey to Syria with Khadija's goods", es: "El viaje comercial del Profeta a Siria con las mercancías de Jadiya", fr: "Le voyage commercial du Prophète en Syrie avec les marchandises de Khadija", ur: "حضرت خدیجہ کے سامان کے ساتھ شام کا تجارتی سفر" }
summary:
  ar: "في الخامسة والعشرين من عمره خرج النبي تاجراً إلى الشام في مال خديجة بنت خويلد، التي بلغها صدق حديثه وعظم أمانته وكرم أخلاقه فعرضت عليه أجراً أفضل مما تعطي غيره، ومعه غلامها ميسرة؛ ورأت خديجة في مالها من الأمانة والبركة ما لم تر قبله، فكان ذلك سبب زواجها منه."
  en: "At twenty-five the Prophet went to Syria as a trader with the goods of Khadija bint Khuwaylid, who had heard of his truthfulness, trustworthiness and noble character and offered him better terms than other merchants, sending her servant Maysara with him; she found in her goods a trustworthiness and blessing she had never seen, which led to their marriage."
  es: "A los veinticinco años, el Profeta viajó a Siria como comerciante con las mercancías de Jadiya bint Khuwaylid, quien había oído hablar de su veracidad, confiabilidad y nobleza de carácter, y le ofreció mejores condiciones que otros mercaderes, enviando con él a su sirvienta Maysara; ella encontró en sus mercancías una confiabilidad y una bendición que nunca antes había visto, lo que condujo a su matrimonio."
  fr: "À vingt-cinq ans, le Prophète se rendit en Syrie comme commerçant avec les marchandises de Khadija bint Khuwaylid, qui avait entendu parler de sa sincérité, de sa fiabilité et de son noble caractère et lui offrit de meilleures conditions que les autres marchands, envoyant avec lui sa servante Maysara; elle trouva dans ses marchandises une fiabilité et une bénédiction qu'elle n'avait jamais vues, ce qui mena à leur mariage."
  ur: "پچیس سال کی عمر میں نبی ایک تاجر کے طور پر خدیجہ بنت خویلد کا سامان لے کر شام گئے، جس نے ان کی سچائی، امانت داری اور اعلیٰ کردار کے بارے میں سنا تھا اور اسے دوسرے تاجروں سے بہتر شرائط پیش کیں، اپنی خادمہ میسرہ کو اپنے ساتھ بھیجا۔ اس نے اپنے سامان میں ایسی امانت اور برکت پائی جو اس نے کبھی نہیں دیکھی تھی جس کی وجہ سے ان کی شادی ہوگئی۔"
