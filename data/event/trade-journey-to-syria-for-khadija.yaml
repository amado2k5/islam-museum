summary:
  ar: "في الخامسة والعشرين من عمره خرج النبي تاجراً إلى الشام في مال خديجة بنت خويلد، التي بلغها صدق حديثه وعظم أمانته وكرم أخلاقه فعرضت عليه أجراً أفضل مما تعطي غيره، ومعه غلامها ميسرة؛ ورأت خديجة في مالها من الأمانة والبركة ما لم تر قبله، فكان ذلك سبب زواجها منه."
  en: "At twenty-five the Prophet went to Syria as a trader with the goods of Khadija bint Khuwaylid, who had heard of his truthfulness, trustworthiness and noble character and offered him better terms than other merchants, sending her servant Maysara with him; she found in her goods a trustworthiness and blessing she had never seen, which led to their marriage."
