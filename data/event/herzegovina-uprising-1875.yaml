summary:
  ar: "بطاقة أولية لانتفاضة الهرسك ضد الحكم العثماني من ١٨٧٥ إلى ١٨٧٧م، الشرارة التي أشعلت أزمة الشرق الكبرى؛ لم تُراجع مصادرها على الصفحة بعد."
  en: "Draft card for the Herzegovina Uprising against Ottoman rule from 1875 to 1877, the spark of the great Eastern Crisis; its sources are not yet checked on the page."
