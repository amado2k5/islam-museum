  ur: "1875 سے 1877 تک عثمانی حکومت کے خلاف ہرزیگووینا کی بغاوت کے لیے ڈرافٹ کارڈ، عظیم مشرقی بحران کی چنگاری؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1875-1877 yılları arasında Osmanlı yönetimine karşı gerçekleşen Hersek ayaklanmasının ve Büyük Doğu Krizi'ni başlatan kıvılcımın ön anlatımı; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Gambaran awal tentang pemberontakan Herzegovina melawan kekuasaan Ottoman dari tahun 1875 hingga 1877 M, pemicu yang menyulut Krisis Besar Timur; sumber-sumbernya belum ditinjau di halaman ini."
