label: { ar: "خروج أبي ركوة الأموي على الحاكم" }
summary:
  ar: "خرج أبو ركوة — وهو رجل أموي من ولد هشام بن عبد الملك اسمه الوليد، كني بأبي ركوة لركوة كانت معه في أسفاره على مذهب الصوفية — يدعو إلى القائم من ولد هشام بن عبد الملك ويأخذ البيعة، فنزل الحلة معلماً واجتمع عنده صبيان العرب ثم أعلمهم أنه الإمام ولقب نفسه الثائر بأمر الله المنتصر من أعداء الله، فدخل برقة فجمع له أهلها مائتي ألف دينار وأخذ من رجل يهودي اتهمه بودائع عنده مائة ألف دينار ونقش السكة باسمه وألقابه وركب يوم الجمعة وخطب ولعن الحاكم، فجمع له الحاكم ستة عشر ألفاً وبعث عليهم الفضل بن عبد الله وحمل إليه خمسمائة ألف دينار وخمسة آلاف قطعة ثياب، فتلقاه أبو ركوة فراوغه الفضل حتى طلب أصحابه تسليمه إلى بلاد النوبة لعهد وذمام بينه وبينهم، فأوصلوه إليها فبعث الفضل وراءه فتسلموه وحمل إلى الحاكم فأركبه جملاً وشهره ثم قتله، وأكرم الحاكم الفضل إكراماً عظيماً ثم قتله بعد أن برئ من علة عرضت له {cite:muntazam-ibn-al-jawzi j.7 p.234-235}."
