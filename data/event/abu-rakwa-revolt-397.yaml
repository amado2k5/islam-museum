label: { ar: "خروج أبي ركوة الأموي على الحاكم", en: "The Revolt of Abu Rakwa al-Umawi against al-Hakim", fr: "Révolte d’Abu Rakwa l’Omeyyade contre al-Hakim", es: "La revuelta de Abu Rakwa al-Umawi contra al-Hakim", ur: "الحاکم کے خلاف ابو رقعہ اموی کی بغاوت", tr: "Ebu Rakwa el-Umawi'nin hükümdara isyanı", id: "Pemberontakan Abu Rakwa al-Umawi melawan penguasa" }
summary:
  ar: "خرج أبو ركوة — وهو رجل أموي من ولد هشام بن عبد الملك اسمه الوليد، كني بأبي ركوة لركوة كانت معه في أسفاره على مذهب الصوفية — يدعو إلى القائم من ولد هشام بن عبد الملك ويأخذ البيعة، فنزل الحلة معلماً واجتمع عنده صبيان العرب ثم أعلمهم أنه الإمام ولقب نفسه الثائر بأمر الله المنتصر من أعداء الله، فدخل برقة فجمع له أهلها مائتي ألف دينار وأخذ من رجل يهودي اتهمه بودائع عنده مائة ألف دينار ونقش السكة باسمه وألقابه وركب يوم الجمعة وخطب ولعن الحاكم، فجمع له الحاكم ستة عشر ألفاً وبعث عليهم الفضل بن عبد الله وحمل إليه خمسمائة ألف دينار وخمسة آلاف قطعة ثياب، فتلقاه أبو ركوة فراوغه الفضل حتى طلب أصحابه تسليمه إلى بلاد النوبة لعهد وذمام بينه وبينهم، فأوصلوه إليها فبعث الفضل وراءه فتسلموه وحمل إلى الحاكم فأركبه جملاً وشهره ثم قتله، وأكرم الحاكم الفضل إكراماً عظيماً ثم قتله بعد أن برئ من علة عرضت له {cite:muntazam-ibn-al-jawzi j.7 p.234-235}."
  en: "Abu Rakwa, an Umayyad of the line of Hisham ibn Abd al-Malik named al-Walid, was given his kunya from a water-flask (rakwa) he carried on his travels in the manner of the Sufis. He called people to a claimant from Hisham's descendants and took oaths of allegiance. He settled at al-Hulla as a teacher, and Arab boys gathered around him; then he told them he was the imam, and styled himself al-Thair bi-amr Allah al-Muntasir min a'da' Allah. He entered Barqa, where its people collected 200,000 dinars for him, and he took 100,000 dinars from a Jewish man whom he accused of holding deposits for him. He struck coins with his name and titles, rode out on a Friday, gave the khutba and cursed al-Hakim. Al-Hakim assembled sixteen thousand men for him under al-Fadl ibn Abd Allah, and 500,000 dinars and 5,000 pieces of cloth were carried to al-Fadl. Abu Rakwa met al-Fadl, but al-Fadl outmanoeuvred him until his companions demanded that he be delivered to the land of Nubia, by a pledge and covenant between him and them. They took him there; al-Fadl sent after him, they handed him over, and he was brought to al-Hakim, who had him mounted on a camel, paraded him, and then killed him. Al-Hakim showed al-Fadl great honour, then killed him after he had recovered from an illness that had come upon him {cite:muntazam-ibn-al-jawzi j.7 p.234-235}."
  fr: "Abu Rakwa, un Omeyyade de la lignée de Hisham ibn Abd al-Malik nommé al-Walid, devait sa kunya à une gourde (rakwa) qu’il portait durant ses voyages à la manière des soufis. Il appelait à un prétendant descendant de Hisham et recueillait des serments d’allégeance. Installé à al-Hulla comme maître, il réunit des garçons arabes, puis leur dit être l’imam et se donna le titre d’al-Thair bi-amr Allah al-Muntasir min a'da' Allah. Il entra à Barqa, dont les habitants lui réunirent 200 000 dinars, et prit 100 000 dinars à un homme juif qu’il accusait de garder des dépôts pour lui. Il frappa monnaie à son nom et à ses titres, sortit un vendredi, prononça le sermon et maudit al-Hakim. Celui-ci réunit seize mille hommes sous al-Fadl ibn Abd Allah, à qui furent portés 500 000 dinars et 5 000 pièces de tissu. Abu Rakwa rencontra al-Fadl, qui le déjoua jusqu’à ce que ses compagnons demandent qu’il fût conduit en Nubie, en vertu d’un pacte entre lui et ses habitants. Ils l’y conduisirent ; al-Fadl le fit réclamer, ils le livrèrent et il fut amené à al-Hakim, qui le fit monter sur un chameau, l’exhiba puis le tua. Al-Hakim honora grandement al-Fadl, puis le fit tuer après sa guérison d’une maladie {cite:muntazam-ibn-al-jawzi j.7 p.234-235}."
  es: "Abu Rakwa, un omeya de la línea de Hisham ibn Abd al-Malik llamado al-Walid, recibió su kunya de una cantimplora (rakwa) que llevaba consigo en sus viajes a la manera de los sufíes. Convocó a la gente a un pretendiente de los descendientes de Hisham y tomó juramentos de lealtad. Se estableció en al-Hulla como maestro, y los muchachos árabes se reunieron a su alrededor; entonces les dijo que era el imán y se autodenominó al-Thair bi-amr Allah al-Muntasir min a'da' Allah. Entró en Barqa, donde sus habitantes recaudaron 200.000 dinares para él, y tomó 100.000 dinares de un hombre judío al que acusó de guardar depósitos para él. Acuñó monedas con su nombre y títulos, salió a caballo un viernes, dio el sermón y maldijo a al-Hakim. Al-Hakim reunió dieciséis mil hombres bajo el mando de al-Fadl ibn Abd Allah, y se le entregaron 500.000 dinares y 5.000 piezas de tela. Abu Rakwa se encontró con al-Fadl, pero este lo superó en astucia hasta que sus compañeros exigieron que lo entregaran a la tierra de Nubia, mediante un pacto entre él y ellos. Lo llevaron allí; al-Fadl mandó buscarlo, lo entregaron y lo llevaron ante al-Hakim, quien lo montó en un camello, lo exhibió y luego lo mató. Al-Hakim honró a al-Fadl con gran honor y luego lo mató después de que se recuperó de una enfermedad que lo aquejaba {cite:muntazam-ibn-al-jawzi j.7 p.234-235}."
  ur: "ابو رکوا، ہشام بن عبد الملک کے سلسلہ میں سے ایک اموی جس کا نام الولید تھا، کو اس کی کنیت پانی کے فلاسک ⁦(رکوا)⁩ سے دی گئی تھی جو وہ صوفیوں کے طرز پر سفر کرتا تھا۔ اس نے لوگوں کو ہشام کی اولاد میں سے ایک دعویدار کے پاس بلایا اور بیعت کی۔ وہ ایک استاد کے طور پر الحلہ میں مقیم ہوا، اور عرب لڑکے اس کے ارد گرد جمع ہو گئے۔ پھر اس نے ان سے کہا کہ وہ امام ہیں، اور اپنے آپ کو الثیر بِامر اللہ المنتصر من عدّا اللّٰہ کہا۔ وہ برقع میں داخل ہوا، جہاں کے لوگوں نے اس کے لیے 200,000 دینار جمع کیے اور اس نے ایک یہودی شخص سے 100,000 دینار لیے جس پر اس نے اپنے لیے امانتیں رکھنے کا الزام لگایا تھا۔ اس نے اپنے نام اور القاب کے ساتھ سکے مارے، جمعہ کے دن نکلے، خطبہ دیا اور الحاکم پر لعنت بھیجی۔ الحکیم نے اپنے لیے الفضل بن عبد اللہ کے ماتحت سولہ ہزار آدمی جمع کیے اور پانچ لاکھ دینار اور پانچ ہزار کپڑے کے ٹکڑے الفضل کی طرف لے گئے۔ ابو رقوا الفضل سے ملا، لیکن الفضل نے اس کو پیچھے چھوڑ دیا یہاں تک کہ اس کے ساتھیوں نے اسے نوبیا کی سرزمین پر پہنچانے کا مطالبہ کیا، اس کے اور ان کے درمیان ایک عہد اور عہد کے ذریعے۔ وہ اسے وہاں لے گئے۔ الفضل نے اس کے پیچھے بھیجا، انہوں نے اسے حوالے کیا، اور اسے حکیم کے پاس لایا گیا، جس نے اسے اونٹ پر سوار کرایا، اس کی پریڈ کی اور پھر اسے قتل کردیا۔ الحاکم نے الفضل کو بڑی عزت کا مظاہرہ کیا، پھر اس بیماری سے صحت یاب ہونے کے بعد اسے قتل کر دیا۔"
  tr: "Hişam ibn Abdülmalik'in soyundan gelen, Sufi yolunu izleyen ve seyahatlerinde yanında taşıdığı su tulumu nedeniyle \"Ebu Rakva\" lakabını alan Emevi bir adam olan Ebu Rakva ortaya çıktı. Hişam ibn Abdülmalik'in soyundan gelen ve beklenen İmam'ı çağırarak biat istedi. Hilla'ya öğretmen olarak yerleşti ve Arap çocukları etrafında toplandı. Ardından kendini İmam ilan etti ve kendisine \"Allah'ın Emriyle İsyan Eden, Allah'ın Düşmanlarına Karşı Muzaffer Olan\" unvanını verdi. Barka'ya girdi ve halkı onun için iki yüz bin dinar topladı. Ayrıca, mevduat tutmakla suçladığı bir Yahudi adamdan yüz bin dinar ele geçirdi. Adını ve unvanlarını taşıyan paralar bastırdı, Cuma günü yola çıktı, vaaz verdi ve yöneticiye lanet okudu. Hükümdar on altı bin adam topladı ve onlarla birlikte beş yüz bin dinar ve beş bin parça giysiyle birlikte el-Fadl ibn Abd Allah'ı gönderdi. Ebu Rakva, el-Fadl ile karşılaştı; el-Fadl onu kandırdı, ta ki arkadaşları aralarındaki bir antlaşma gereği Nubia'ya iadesini isteyene kadar. Onu oraya teslim ettiler, ancak el-Fadl peşinden adamlar gönderdi; onu yakalayıp hükümdara getirdiler. Hükümdar onu bir deveye bindirdi, teşhir etti ve sonra idam ettirdi. Hükümdar daha sonra el-Fadl'a büyük bir saygı gösterdi, ancak onu da öldürdü. Onu etkileyen bir hastalıktan kurtulmuştu. {Kaynak: Muntazam ibn el-Cevzi, 7. cilt, s. 234-235}"
  id: "Abu Rakwa—seorang pria Umayyah dari keturunan Hisham ibn Abd al-Malik, yang bernama al-Walid, dijuluki Abu Rakwa karena kantung air yang dibawanya dalam perjalanannya, mengikuti jalan Sufi—muncul, menyeru orang-orang kepada Imam yang dinantikan dari keturunan Hisham ibn Abd al-Malik dan menuntut kesetiaan. Ia menetap di Hilla sebagai seorang guru, dan anak-anak Arab berkumpul di sekelilingnya. Kemudian ia menyatakan dirinya sebagai Imam dan menobatkan dirinya sebagai \"Orang yang Memberontak atas Perintah Allah, Sang Pemenang Melawan Musuh-Musuh Allah.\" Ia memasuki Barqa, di mana penduduknya mengumpulkan dua ratus ribu dinar untuknya. Ia juga merampas seratus ribu dinar dari seorang pria Yahudi yang dituduhnya menyimpan simpanan. Ia mencetak koin yang bertuliskan nama dan gelarnya, berkuda pada hari Jumat, menyampaikan khutbah, dan mengutuk penguasa. Penguasa mengumpulkan enam belas ribu orang dan mengirim al-Fadl ibn Abd Allah bersama mereka, beserta lima ratus ribu dinar dan lima ribu potong pakaian. Abu Rakwa bertemu dengan al-Fadl, yang menipunya hingga para sahabatnya meminta ekstradisinya ke Nubia karena perjanjian dan kesepakatan di antara mereka. Mereka mengantarkannya ke sana, tetapi al-Fadl mengirim orang untuk mengejarnya, yang menangkapnya dan membawanya ke penguasa. Penguasa menyuruhnya menaiki unta, mengaraknya, lalu mengeksekusinya. Penguasa kemudian memperlakukan al-Fadl dengan sangat hormat sebelum membunuhnya juga. Ia sembuh dari penyakit yang dideritanya {cite:muntazam-ibn-al-jawzi j.7 p.234-235}."
