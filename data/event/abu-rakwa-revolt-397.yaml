label: { ar: "خروج أبي ركوة الأموي على الحاكم", en: "The Revolt of Abu Rakwa al-Umawi against al-Hakim" }
summary:
  ar: "خرج أبو ركوة — وهو رجل أموي من ولد هشام بن عبد الملك اسمه الوليد، كني بأبي ركوة لركوة كانت معه في أسفاره على مذهب الصوفية — يدعو إلى القائم من ولد هشام بن عبد الملك ويأخذ البيعة، فنزل الحلة معلماً واجتمع عنده صبيان العرب ثم أعلمهم أنه الإمام ولقب نفسه الثائر بأمر الله المنتصر من أعداء الله، فدخل برقة فجمع له أهلها مائتي ألف دينار وأخذ من رجل يهودي اتهمه بودائع عنده مائة ألف دينار ونقش السكة باسمه وألقابه وركب يوم الجمعة وخطب ولعن الحاكم، فجمع له الحاكم ستة عشر ألفاً وبعث عليهم الفضل بن عبد الله وحمل إليه خمسمائة ألف دينار وخمسة آلاف قطعة ثياب، فتلقاه أبو ركوة فراوغه الفضل حتى طلب أصحابه تسليمه إلى بلاد النوبة لعهد وذمام بينه وبينهم، فأوصلوه إليها فبعث الفضل وراءه فتسلموه وحمل إلى الحاكم فأركبه جملاً وشهره ثم قتله، وأكرم الحاكم الفضل إكراماً عظيماً ثم قتله بعد أن برئ من علة عرضت له {cite:muntazam-ibn-al-jawzi j.7 p.234-235}."
  en: "Abu Rakwa, an Umayyad of the line of Hisham ibn Abd al-Malik named al-Walid, was given his kunya from a water-flask (rakwa) he carried on his travels in the manner of the Sufis. He called people to a claimant from Hisham's descendants and took oaths of allegiance. He settled at al-Hulla as a teacher, and Arab boys gathered around him; then he told them he was the imam, and styled himself al-Thair bi-amr Allah al-Muntasir min a'da' Allah. He entered Barqa, where its people collected 200,000 dinars for him, and he took 100,000 dinars from a Jewish man whom he accused of holding deposits for him. He struck coins with his name and titles, rode out on a Friday, gave the khutba and cursed al-Hakim. Al-Hakim assembled sixteen thousand men for him under al-Fadl ibn Abd Allah, and 500,000 dinars and 5,000 pieces of cloth were carried to al-Fadl. Abu Rakwa met al-Fadl, but al-Fadl outmanoeuvred him until his companions demanded that he be delivered to the land of Nubia, by a pledge and covenant between him and them. They took him there; al-Fadl sent after him, they handed him over, and he was brought to al-Hakim, who had him mounted on a camel, paraded him, and then killed him. Al-Hakim showed al-Fadl great honour, then killed him after he had recovered from an illness that had come upon him {cite:muntazam-ibn-al-jawzi j.7 p.234-235}."
