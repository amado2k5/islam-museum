label:
  ar: "الشيطان يلبس على المصلي حتى لا يدري كم صلى"
  en: "The shaytan confounds the praying man about his count"
  ur: "شیطان نمازی کو اس کی گنتی بھلا دیتا ہے"
summary:
  ar: "أخبر النبي أن الشيطان يأتي المصلي فيلبس عليه حتى لا يدري كم صلى فمن وجد ذلك فليسجد سجدتين وهو جالس {cite:muwatta-maruf-1997} [[passage/muwatta-1-263|الموطأ 263]]."
  en: "The Prophet reported that the shaytan comes to the praying man and confounds him until he does not know how much he has prayed; whoever finds that should prostrate twice while sitting {cite:muwatta-maruf-1997} [[passage/muwatta-1-263|Muwatta 263]]."
  ur: "نبی نے خبر دی کہ شیطان نمازی کے پاس آتا ہے اور اسے اس طرح الجھاتا ہے کہ اسے اپنی گنتی کا علم نہ رہے؛ جسے یہ حالت ملے وہ بیٹھے دو سجدے کرے {cite:muwatta-maruf-1997} [[passage/muwatta-1-263|موطأ 263]]۔"
