label: { ar: "وقعة اليمامة", en: "The Battle of Yamama", fr: "La bataille d'al-Yamama", es: "La batalla de Yamama", ur: "یمامہ کی جنگ", tr: "Yamama Savaşı", id: "Pertempuran Yamama" }
summary:
  ar: "عند البلاذري — وقد وردته في القسم الأول من كتابه — بعث أبو بكر خالد بن الوليد إلى اليمامة وأمره بمحاربة مسيلمة الكذاب فلما شارفها ظفر بقوم من بني حنيفة؛ وكان أول من لقي المسلمين الرجال بن عنفوة فقُتل، واستُشهد وجوه الناس وقراء القرآن ثم فاء المسلمون وثابوا، وأنزل الله عليهم نصره؛ ورمى عبد الرحمن بن أبي بكر مُحكّم بن الطفيل — الذي يقال له يُحكم اليمامة — بسهم فقتله، وأُلجئ الكفرة إلى الحديقة فسُميت يومئذ حديقة الموت وكانت تسمى أُباض؛ وقُتل مسيلمة في الحديقة واختلفوا في قاتله: بنو عامر بن لوى يقولون قتله خداش بن بشير، وبعض الأنصار قتله عبد الله بن زيد بن ثعلبة الذي أُري الأذان، وبعضهم أبو دجانة سماك بن خرشة ثم استُشهد، وبعضهم عبد الله بن زيد بن عاصم أخو حبيب بن زيد الذي كان مسيلمة قطع يديه ورجليه، ووحشي بن حرب قاتل حمزة كان يدّعي قتله ويقول «قتلت خير الناس وشرّ الناس»، وقوم قالوا إن هؤلاء جميعاً شركوا في قتله، وكان معاوية وبنو أمية يدّعونه له حتى قال عبد الملك بن مروان لحنفي وصف له القاتل «قضيت والله لمعاوية بقتله»؛ وكان شعار المسلمين «يا أصحاب سورة البقرة»، وأنكر بعض الأنصار على خالد استفراده بالرأي حين عزم على مناطحة مسيلمة ثم تبعوه؛ ونصب السائب بن العوام للناس عند رحالهم فقال «ليس لامرء مفرّ بعد رحله»؛ فلما نهكت الحرب المسلمين قال مجاعة بن مرارة لخالد إن أكثر أهل اليمامة لم يخرجوا لقتالهم وإنه يصالحه عنهم على نصف السبي ونصف الصفراء والبيضاء والحلقة والكراع، فألبس المشايخ والصبيان والنساء السلاح وأقامهم على الحصون ثم رجع فزعم أن القوم رفضوا حتى رضّوه بربع السبي ونصف المال، فاستقر الصلح على ذلك فلما دخل خالد اليمامة ورأى من بقي بها قال «خدعتني يا مجاع»؛ وأسلم أهل اليمامة وأُخذت منهم الصدقة، وأتى خالداً كتاب أبو بكر بإنجاد العلاء بن الحضرمي فسار إلى البحرين واستخلف على اليمامة سمرة بن عمرو العنبري؛ وكان فتح اليمامة سنة 12، واختلفوا في عدد من استُشهد بها فأقل ما ذكروا سبعمائة وأكثره ألف وسبعمائة وقيل ألف ومائتان، ومن شهدائها زيد بن الخطاب أخو عمر — قيل قتله أبو مريم الحنفي وقيل لبيد بن برغث — وثابت بن قيس خطيب النبي وكان على الأنصار يومئذ، وأبو حذيفة بن عتبة وسالم مولاه، وأبو دجانة، وعباد بن بشر، وسالم؛ وأم حبيب وعبد الله ابني زيد بن عاصم نسيبة بنت كعب قاتلت يومئذ فانصرفت وبها جراحات — وكان مسيلمة قد قطع يدي ابنها حبيب ورجليه حين بعثه النبي إليه مع عبد الله بن وهب الأسلمي فلم يعرض لعبد الله. ويعدّ أنس بن مالك في الصحيح سبعين قتيلاً للأنصار يوم اليمامة كيومي أحد وبئر معونة {cite:sahih-al-bukhari 4078}. وقعة اليمامة من حروب الردة، قاد فيها خالد بن الوليد جيشاً بعثه أبو بكر لقتال مسيلمة زعيم بني حنيفة. وبحسب موسوعة الإسلام دارت المعركة عند العقرباء حول حديقة مسوّرة عُرفت بحديقة الموت، وانتصر المسلمون وفقدوا كثيراً من القراء. وفي الرواية التقليدية ارتد مسيلمة وادعى النبوة، أما مقالة موسوعة الإسلام الأكاديمية فترى في حركته مشروع إمارة ذات أساس ديني حقيقي بعد وفاة هوذة بن علي؛ ويختلف التاريخ بين سنة 12هـ عند البلاذري وسنة 11هـ عند مقالة اليمامة."
  en: "In al-Baladhuri — who reports it in the first part of his book — Abu Bakr sent Khalid ibn al-Walid to al-Yamama ordering him to fight Musaylima the Liar; the first to meet the Muslims, al-Rajjal ibn Unfuwa, was killed, the foremost Muslims and the Quran-reciters fell as martyrs, then the Muslims returned and stood firm and God sent down His aid; Abd al-Rahman ibn Abi Bakr shot Muhakkim ibn al-Tufayl — called 'the arbiter of al-Yamama' — with an arrow and killed him, and the unbelievers were driven into the Garden, that day named the Garden of Death, formerly called Ubad; Musaylima was killed in the Garden and they disputed his slayer: Banu Amir ibn Lu'ayy say Khidash ibn Bashir, some Ansar Abdullah ibn Zayd ibn Tha'laba who was shown the adhan, some Abu Dujana Simak ibn Kharasha who then fell, some Abdullah ibn Zayd ibn Asim brother of Habib ibn Zayd whose hands and feet Musaylima had cut off, Wahshi ibn Harb — Hamza's slayer — used to claim it saying 'I killed the best of men and the worst', some held they all shared in it, and Mu'awiya and the Umayyads claimed it for him until Abd al-Malik ibn Marwan told a Hanafi who described the killer 'by God I have judged it for Mu'awiya'; the Muslims' cry was 'O companions of Sura al-Baqara'; some Ansar reproached Khalid's lone resolve to butt Musaylima then followed him; al-Sa'ib ibn al-Awwam stood the men at their baggage: 'no man may flee beyond his saddle'; when the war wore the Muslims down Mujja'a ibn Murara told Khalid most of Yamama's people had not come out to fight and offered peace for half the captives and half the gold, silver, armour and mounts, then armed the old men, boys and women on the fortresses, returned claiming they refused, and beat the terms down to a quarter of the captives and half the wealth — settled thus, until Khalid entered, saw who remained and said 'you deceived me, Mujja'a'; the people of al-Yamama embraced Islam and the alms were taken from them, Abu Bakr's letter reached Khalid ordering him to aid al-Ala ibn al-Hadrami so he marched to Bahrain leaving Samura ibn Amr al-Anbari over al-Yamama; its conquest was in year 12; they disputed the martyrs' count — least said seven hundred, most seventeen hundred, some twelve hundred — among them Zayd ibn al-Khattab, Umar's brother (killed by Abu Maryam al-Hanafi or per Ibn al-Kalbi Labid ibn Burghuth), Thabit ibn Qays the Prophet's orator commanding the Ansar that day, Abu Hudhayfa ibn Utba and his mawla Salim, Abu Dujana, Abbad ibn Bishr and Salim; and Nusayba bint Ka'b — mother of Habib and Abdullah the sons of Zayd ibn Asim — fought that day and came away wounded, Musaylima having cut off her son Habib's hands and feet when the Prophet sent him with Abdullah ibn Wahb al-Aslami, whom he left unharmed. The battle of al-Yamama was a battle of the Ridda wars in which Khalid ibn al-Walid led the army Abu Bakr sent against Musaylima, leader of the Banu Hanifa. According to the Encyclopaedia of Islam it was fought at al-Akraba' around a walled garden called the garden of death, and the Muslims won but lost many Qur'an reciters. In the classical account Musaylima renounced Islam and claimed prophethood, while the encyclopaedia's academic reading sees a bid for a principality with a genuine religious basis after the death of Hawdha ibn Ali; the year is 12 AH in al-Baladhuri and 11 AH in the article on al-Yamama."
  ur: "جنگِ یمامہ ردّہ کی جنگوں کی ایک لڑائی تھی جس میں خالد بن الولید نے اس لشکر کی قیادت کی جو ابو بکر نے بنو حنیفہ کے سردار مسیلمہ کے خلاف بھیجا۔ دائرۃ المعارف اسلامیہ کے مطابق یہ عقرباء میں ایک چار دیواری والے باغ کے گرد لڑی گئی جسے موت کا باغ کہا گیا، مسلمان جیتے مگر بہت سے قاری کھو دیے۔ روایتی بیان میں مسیلمہ نے اسلام ترک کر کے نبوت کا دعویٰ کیا، جبکہ دائرۃ المعارف کی علمی تعبیر ہوذہ بن علی کی وفات کے بعد ایک حقیقی مذہبی بنیاد والی ریاست کی کوشش دیکھتی ہے؛ سال بلاذری کے ہاں 12ھ اور یمامہ کے مضمون میں 11ھ ہے۔"
  fr: "Chez al-Baladhuri, qui la rapporte dans la première partie de son livre : Abu Bakr envoya Khalid ibn al-Walid à al-Yamama en lui ordonnant de combattre Musaylima le Menteur ; le premier à rencontrer les musulmans, al-Rajjal ibn Unfuwa, fut tué, les premiers des musulmans et les récitateurs du Coran tombèrent en martyrs, puis les musulmans revinrent et tinrent ferme, et Dieu fit descendre Son aide ; Abd al-Rahman ibn Abi Bakr atteignit d'une flèche Muhakkim ibn al-Tufayl, appelé « l'arbitre d'al-Yamama », et le tua, et les mécréants furent refoulés dans le Jardin, nommé ce jour-là le Jardin de la Mort, appelé auparavant Ubad ; Musaylima fut tué dans le Jardin et l'on disputa de son meurtrier : les Banu Amir ibn Lu'ayy disent Khidash ibn Bashir, certains Ansar Abdullah ibn Zayd ibn Tha'laba, à qui l'adhan fut montré en songe, certains Abu Dujana Simak ibn Kharasha, qui tomba ensuite, certains Abdullah ibn Zayd ibn Asim, frère de Habib ibn Zayd à qui Musaylima avait fait couper les mains et les pieds ; Wahshi ibn Harb, le meurtrier de Hamza, le revendiquait en disant « j'ai tué le meilleur des hommes et le pire » ; certains tenaient qu'ils y avaient tous pris part, et Mu'awiya et les Omeyyades le revendiquèrent pour lui, jusqu'à ce qu'Abd al-Malik ibn Marwan dise à un Hanafite qui décrivait le meurtrier : « par Dieu, je l'ai attribué à Mu'awiya » ; le cri des musulmans était « Ô compagnons de la sourate al-Baqara » ; certains Ansar reprochèrent à Khalid sa résolution solitaire de foncer sur Musaylima, puis le suivirent ; al-Sa'ib ibn al-Awwam posta les hommes à leurs bagages : « que nul ne fuie au-delà de sa selle » ; quand la guerre eut épuisé les musulmans, Mujja'a ibn Murara dit à Khalid que la plupart des gens d'al-Yamama n'étaient pas sortis combattre et offrit la paix contre la moitié des captifs et la moitié de l'or, de l'argent, des armures et des montures, puis arma les vieillards, les garçons et les femmes sur les forteresses, revint en prétendant qu'ils refusaient, et fit baisser les conditions à un quart des captifs et la moitié des richesses ; on conclut ainsi, jusqu'à ce que Khalid entre, voie qui restait et dise « tu m'as trompé, Mujja'a » ; les gens d'al-Yamama embrassèrent l'islam et l'aumône fut perçue d'eux ; la lettre d'Abu Bakr parvint à Khalid, lui ordonnant d'aider al-Ala ibn al-Hadrami, et il marcha sur Bahreïn en laissant Samura ibn Amr al-Anbari sur al-Yamama ; sa conquête eut lieu en l'an 12 ; on disputa du nombre des martyrs, le moins disant sept cents, le plus dix-sept cents, certains douze cents, parmi lesquels Zayd ibn al-Khattab, frère d'Umar (tué par Abu Maryam al-Hanafi ou, selon Ibn al-Kalbi, par Labid ibn Burghuth), Thabit ibn Qays, l'orateur du Prophète, qui commandait les Ansar ce jour-là, Abu Hudhayfa ibn Utba et son mawla Salim, Abu Dujana, Abbad ibn Bishr et Salim ; et Nusayba bint Ka'b, mère de Habib et d'Abdullah, les fils de Zayd ibn Asim, combattit ce jour-là et en revint blessée, Musaylima ayant fait couper les mains et les pieds de son fils Habib quand le Prophète l'envoya avec Abdullah ibn Wahb al-Aslami, qu'il laissa indemne. La bataille d'al-Yamama fut une bataille des guerres de la Ridda dans laquelle Khalid ibn al-Walid mena l'armée qu'Abu Bakr envoya contre Musaylima, chef des Banu Hanifa. Selon l'Encyclopédie de l'Islam, elle fut livrée à al-Akraba' autour d'un jardin clos de murs appelé le jardin de la mort, et les musulmans l'emportèrent mais perdirent beaucoup de récitateurs du Coran. Dans le récit classique, Musaylima renia l'islam et revendiqua la prophétie, tandis que la lecture académique de l'encyclopédie y voit une tentative de fonder une principauté sur une véritable base religieuse après la mort de Hawdha ibn Ali ; l'année est 12 H chez al-Baladhuri et 11 H dans l'article al-Yamama."
  es: "En al-Baladhuri —quien lo relata en la primera parte de su libro— Abu Bakr envió a Khalid ibn al-Walid a al-Yamama ordenándole que luchara contra Musaylima el Mentiroso; el primero en encontrarse con los musulmanes, al-Rajjal ibn Unfuwa, fue asesinado, los principales musulmanes y los recitadores del Corán cayeron como mártires, luego los musulmanes regresaron y se mantuvieron firmes y Dios envió Su ayuda; Abd al-Rahman ibn Abi Bakr disparó a Muhakkim ibn al-Tufayl —llamado 'el árbitro de al-Yamama'— con una flecha y lo mató, y los incrédulos fueron expulsados al Jardín, ese día llamado Jardín de la Muerte, antiguamente llamado Ubad; Musaylima fue asesinado en el Jardín y se disputaron a su asesino: Banu Amir ibn Lu'ayy dicen Khidash ibn Bashir, algunos Ansar Abdullah ibn Zayd ibn Tha'laba a quien se le mostró el adhan, algunos Abu Dujana Simak ibn Kharasha que luego cayó, algunos Abdullah ibn Zayd ibn Asim hermano de Habib ibn Zayd a quien Musaylima le había cortado las manos y los pies, Wahshi ibn Harb —el asesino de Hamza— solía reclamarlo diciendo 'Yo maté al mejor de los hombres y al peor', algunos sostenían que todos compartían la culpa, y Mu'awiya y los Omeyas la reclamaron para él hasta que Abd al-Malik ibn Marwan le dijo a un Hanafi que describió al asesino 'por Dios, yo lo he juzgado para Mu'awiya'; el grito de los musulmanes fue '¡Oh compañeros de la Sura al-Baqara!'; Algunos Ansar reprocharon a Khalid su decisión solitaria de enfrentarse a Musaylima y luego lo siguieron; al-Sa'ib ibn al-Awwam detuvo a los hombres junto a su equipaje: \"Ningún hombre puede huir más allá de su silla de montar\"; cuando la guerra agotó a los musulmanes, Mujja'a ibn Murara le dijo a Khalid que la mayoría de la gente de Yamama no había salido a luchar y ofreció la paz a cambio de la mitad de los cautivos y la mitad del oro, la plata, las armaduras y las monturas, luego armó a los ancianos, niños y mujeres en las fortalezas, regresó alegando que se habían negado y redujo los términos a una cuarta parte de los cautivos y la mitad de la riqueza; así se resolvió, hasta que Khalid entró, vio quiénes quedaban y dijo: \"Me engañaste, Mujja'a\"; La gente de al-Yamama abrazó el Islam y se les quitaron las limosnas, la carta de Abu Bakr llegó a Khalid ordenándole que ayudara a al-Ala ibn al-Hadrami, por lo que marchó a Bahrain dejando a Samura ibn Amr al-Anbari sobre al-Yamama; su conquista fue en el año 12; disputaron el recuento de mártires —menos setecientos, más mil setecientos, algunos mil doscientos— entre ellos Zayd ibn al-Khattab, hermano de Umar (asesinado por Abu Maryam al-Hanafi o según Ibn al-Kalbi Labid ibn Burghuth), Thabit ibn Qays, el orador del Profeta que comandaba a los Ansar ese día, Abu Hudhayfa ibn Utba y su mawla Salim, Abu Dujana, Abbad ibn Bishr y Salim; y Nusayba bint Ka'b —madre de Habib y Abdullah, hijos de Zayd ibn Asim— luchó ese día y salió herida, ya que Musaylima le cortó las manos y los pies a su hijo Habib cuando el Profeta lo envió con Abdullah ibn Wahb al-Aslami, a quien dejó ileso. La batalla de al-Yamama fue una batalla de las guerras de Ridda en la que Khalid ibn al-Walid dirigió el ejército que Abu Bakr envió contra Musaylima, líder de los Banu Hanifa. Según la Enciclopedia del Islam, se libró en al-Akraba' alrededor de un jardín amurallado llamado el jardín de la muerte, y los musulmanes ganaron pero perdieron muchos recitadores del Corán. En el relato clásico, Musaylima renunció al Islam y se proclamó profeta, mientras que la lectura académica de la enciclopedia ve un intento de principado con una base religiosa genuina después de la muerte de Hawdha ibn Ali; El año es 12 AH en al-Baladhuri y 11 AH en el artículo sobre al-Yamama."
  tr: "El-Baladhuri'ye göre -kitabının ilk bölümünde de belirtildiği gibi- Ebu Bekir, Halid bin El-Velid'i El-Yamame'ye göndererek ona Yalancı Musaylime ile savaşmasını emretti. Oraya yaklaştığında, Beni Hanife'den bir grup üzerinde zafer kazandı. Müslümanlarla ilk karşılaşan El-Rijal bin Enfuve oldu ve öldürüldü. Kur'an'ın önde gelen isimleri ve okuyucuları şehit edildi. Sonra Müslümanlar geri döndüler ve ayaklandılar ve Allah onlara zaferini indirdi. Abdurrahman bin Ebu Bekir, Muhakkam bin El-Tufayl'ı -Yuhakkam El-Yamame olarak da anılır- bir okla vurarak öldürdü. Kâfirler cennete sürüldü ve o gün oraya Ölüm Bahçesi, daha sonra da Ubadh adı verildi. Musaylimah bahçede öldürüldü ve onu kimin öldürdüğü konusunda ihtilaf çıktı: Beni Emir ibn Lu'ay, Hızır ibn Beşir'in öldürdüğünü söyledi; Ensar'dan bazıları, ezan okunan Abdullah ibn Zeyd ibn Tha'labe'nin öldürdüğünü söyledi; bazıları da o sırada şehit olan Ebu Dujana Simak ibn Harşa'nın öldürdüğünü söyledi; bazıları da Musaylimah'ın ellerini ve ayaklarını kestiği Habib ibn Zeyd'in kardeşi Abdullah ibn Zeyd ibn Asim'in öldürdüğünü söyledi; Hamza'nın katili Vahşi ibn Harb ise onu öldürdüğünü iddia ederek, \"İnsanların en iyisini ve en kötüsünü öldürdüm\" dedi. Bazıları ise bu kişilerin hepsinin onun öldürülmesinde yer aldığını söyledi ve Muaviye ile Beni Ümeyye onu kendi adamları olarak kabul etti. Ta ki Abdülmalik ibn Mervan, katili kendisine tarif eden bir Hanefi'ye, \"Allah'a yemin ederim ki, Muaviye'nin öldürdüğüne karar verdim\" diyene kadar. Müslümanların sloganı ise \"Ey Bakara Suresi halkı!\" idi. Ensar'dan bazıları, Halid'in Musaylime ile yüzleşmeye karar verdiğinde yalnız hareket etmesini eleştirdi ve sonra onu takip ettiler. Sa'ib ibn el-Evvem, halk için atlarının yanına bir yer hazırladı ve \"Eyerinden sonra bir adamın kaçışı yoktur\" dedi. Savaş Müslümanları yıprattığında, Maja'ah ibn Murarah, Halid'e Yamame halkının çoğunun onlarla savaşmaya çıkmadığını ve esirlerin yarısı, altın ve gümüşün yarısı, yüzük ve atların yarısı karşılığında onlar adına barış yapacağını söyledi. Bunun üzerine yaşlıları, oğlanları ve kadınları silahlandırdı ve onları kalelere yerleştirdi. Sonra geri döndü ve halkın, esirlerin dörtte biri ve paranın yarısı ile onu tatmin edene kadar reddettiğini iddia etti. Böylece barış sağlandı. Halid Yamame'ye girdiğinde ve orada kalanları gördüğünde, \"Beni kandırdın, Maja'ah\" dedi. Yamame halkı İslamiyet'i kabul etti ve onlardan sadaka alındı. Ebu Bekir'in mektubu Halid'e, Al-Ala' ibn Al-Hadrami'ye yardım etmesi için ulaştı, bu yüzden Halid Bahreyn'e gitti ve Yamame'nin başına Samurah ibn Amr Al-Anbari'yi vekili olarak atadı. Yamame'nin fethi Hicri 12 yılında gerçekleşti. Orada şehit edilenlerin sayısı konusunda ihtilaf vardır; en düşük sayı yedi yüz, en yüksek sayı bin yedi yüz, bazıları ise bin iki yüz der. Şehitler arasında Ömer'in kardeşi Zeyd ibn el-Hattab (bazıları onun Ebu Meryem el-Hanafi tarafından öldürüldüğünü, bazıları ise Labid ibn Barghath tarafından öldürüldüğünü söyler), o gün Ensar'ın komutanı olan Peygamber'in hatibi Sıkıb ibn Kays, Ebu Hudeyfe ibn Utba, azatlı kölesi Salim, Ebu Dujana, Abbad ibn Bişr ve Salim vardı. Zeyd ibn Asim'in oğulları Ümmü Habib ve Abdullah ile Nusayba bint Ka'b, o gün savaşmış ve yaralı olarak geri dönmüşlerdir. Peygamberimiz, oğlu Habib'i Abdullah ibn Vahb el-Aslami ile birlikte gönderdiğinde, Musaylima oğlunun ellerini ve ayaklarını kesmişti, ancak Abdullah'a zarar vermemişti. Enes ibn Malik, Sahih'inde, Uhud ve Bir'r Ma'una günlerinde olduğu gibi, Yamama günü yetmiş Ensar'ın öldürüldüğünü sayar. Yamama Muharebesi, Halid ibn el-Valid'in, Ebu Bekir tarafından Beni Hanifa'nın lideri Musaylima ile savaşmak üzere gönderilen bir orduya liderlik ettiği İtaatsizlik Savaşlarından biridir. İslam Ansiklopedisi'ne göre, savaş, Ölüm Bahçesi olarak bilinen duvarla çevrili bir bahçenin bulunduğu el-Akrabe'de gerçekleşmiştir. Müslümanlar zafer kazanmış ancak ağır kayıplar vermişlerdir. Geleneksel anlatıma göre Musaylima dinden dönmüş ve peygamberlik iddiasında bulunmuştur; oysa İslam Ansiklopedisi'ndeki makale, hareketini Havda ibn Ali'nin ölümünden sonra ortaya çıkan, gerçekten dini temelli bir emirlik projesi olarak değerlendirmektedir. Savaşın tarihi, el-Baladhuri'ye göre 12 Hicri, Yamama makalesine göre ise 11 Hicri olarak verilmiştir."
  id: "Menurut Al-Baladhuri — dan disebutkan dalam bagian pertama bukunya — Abu Bakr mengutus Khalid bin Al-Walid ke Al-Yamamah dan memerintahkannya untuk memerangi Musaylimah si Pendusta. Ketika ia mendekatinya, ia menang atas sekelompok orang dari Banu Hanifah. Orang pertama yang bertemu dengan kaum Muslim adalah Al-Rijal bin Anfuwah, dan ia terbunuh. Tokoh-tokoh terkemuka dan para pembaca Al-Qur'an gugur sebagai syuhada. Kemudian kaum Muslim kembali dan bangkit, dan Allah menurunkan kemenangan-Nya kepada mereka. Abd Al-Rahman bin Abi Bakr menembak Muhakkam bin Al-Tufayl — yang disebut Yuhakkam Al-Yamamah — dengan panah dan membunuhnya. Orang-orang kafir dipaksa masuk ke taman, dan taman itu disebut Taman Kematian pada hari itu, dan disebut Ubadh. Musaylimah terbunuh di taman, dan terjadi perbedaan pendapat tentang siapa yang membunuhnya: Banu Amir ibn Lu'ay mengatakan bahwa Khidash ibn Bashir yang membunuhnya, dan sebagian dari kaum Ansar mengatakan bahwa Abdullah ibn Zayd ibn Tha'labah, yang diperlihatkan seruan azan, yang membunuhnya, dan sebagian dari mereka mengatakan bahwa Abu Dujana Simak ibn Kharsha, yang kemudian gugur sebagai syahid, dan sebagian dari mereka mengatakan bahwa Abdullah ibn Zayd ibn Asim, saudara Habib ibn Zayd, yang tangan dan kakinya dipotong oleh Musaylimah, dan Wahshi ibn Harb, pembunuh Hamza, mengaku telah membunuhnya dan berkata, \"Aku telah membunuh orang terbaik dan orang terburuk.\" Dan sebagian orang mengatakan bahwa semua orang ini ikut serta dalam membunuhnya, dan Mu'awiyah dan Bani Umayyah mengklaimnya sebagai milik mereka sampai Abd al-Malik ibn Marwan berkata kepada seorang Hanafi yang menggambarkan pembunuhnya kepadanya, \"Demi Allah, aku telah memutuskan bahwa Mu'awiyah yang membunuhnya.\" Dan semboyan kaum Muslim adalah, \"Wahai penduduk Surat al-Baqarah.\" Dan sebagian kaum Ansar mengkritik Khalid karena bertindak sendirian ketika ia memutuskan untuk menghadapi Musaylimah, dan kemudian mereka mengikutinya. Dan al-Sa'ib ibn al-Awwam mendirikan tempat bagi orang-orang di atas pelana mereka dan berkata, \"Tidak ada jalan keluar bagi seseorang setelah pelananya.\" Ketika perang melemahkan kaum Muslim, Maja’ah ibn Murarah berkata kepada Khalid bahwa sebagian besar penduduk Yamamah tidak keluar untuk melawan mereka, dan bahwa ia akan berdamai dengannya atas nama mereka dengan imbalan setengah dari tawanan dan setengah dari emas dan perak, cincin dan kuda. Maka ia mempersenjatai para tetua, anak laki-laki, dan perempuan, lalu menempatkan mereka di benteng-benteng. Kemudian ia kembali dan mengklaim bahwa orang-orang menolak sampai mereka memberinya seperempat tawanan dan setengah dari uang. Maka perdamaian pun tercapai. Ketika Khalid memasuki Yamamah dan melihat orang-orang yang masih tinggal di sana, ia berkata, “Kau telah menipuku, Maja’ah.” Penduduk Yamamah masuk Islam dan sedekah diambil dari mereka. Surat Abu Bakar sampai kepada Khalid untuk membantu Al-Ala’ ibn Al-Hadrami, maka ia pergi ke Bahrain dan menunjuk Samurah ibn Amr Al-Anbari sebagai wakilnya di Yamamah. Penaklukan Yamamah terjadi pada tahun 12 Hijriah. Terdapat perbedaan pendapat mengenai jumlah orang yang gugur sebagai syuhada di sana; jumlah terendah yang disebutkan adalah tujuh ratus, tertinggi adalah seribu tujuh ratus, dan sebagian mengatakan seribu dua ratus. Di antara para syuhada terdapat Zayd ibn al-Khattab, saudara Umar—konon ia dibunuh oleh Abu Maryam al-Hanafi, dan sebagian mengatakan oleh Labid ibn Barghath—Thabit ibn Qays, orator Nabi, yang memimpin kaum Ansar pada hari itu, Abu Hudhayfa ibn Utba, budak yang telah dibebaskannya, Salim, Abu Dujana, Abbad ibn Bishr, dan Salim; serta Umm Habib dan Abdullah, putra-putra Zayd ibn Asim, Nusayba bint Ka'b, yang berperang pada hari itu dan kembali terluka. Musaylima telah memotong tangan dan kaki putranya Habib ketika Nabi mengutusnya kepada Nabi bersama Abdullah ibn Wahb al-Aslami, tetapi ia tidak melukai Abdullah. Anas ibn Malik, dalam Sahihnya, menghitung tujuh puluh orang Ansar yang terbunuh pada hari Yamama, seperti pada hari Uhud dan Bi'r Ma'una. Perang Yamama adalah salah satu Perang Kemurtadan, di mana Khalid ibn al-Walid memimpin pasukan yang dikirim oleh Abu Bakr untuk melawan Musaylima, pemimpin Bani Hanifa. Menurut Ensiklopedia Islam, pertempuran terjadi di al-Aqrabah di sekitar taman bertembok yang dikenal sebagai Taman Kematian. Kaum Muslimin meraih kemenangan tetapi menderita kerugian besar. Dalam catatan tradisional, Musaylima murtad dan mengklaim kenabian, sementara artikel Ensiklopedia Islam memandang gerakannya sebagai proyek emirat yang benar-benar berbasis agama setelah kematian Hawdha ibn Ali. Tanggal pertempuran disebutkan sebagai 12 H oleh al-Baladhuri dan 11 H oleh artikel Yamama."
