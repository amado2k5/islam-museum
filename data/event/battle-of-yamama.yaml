id: event/battle-of-yamama
class: event
kind: battle
label: { ar: "وقعة اليمامة", en: "The Battle of Yamama" }
summary:
  ar: "عند البلاذري — وقد وردته في القسم الأول من كتابه — بعث أبو بكر خالد بن الوليد إلى اليمامة وأمره بمحاربة مسيلمة الكذاب فلما شارفها ظفر بقوم من بني حنيفة؛ وكان أول من لقي المسلمين الرجال بن عنفوة فقُتل، واستُشهد وجوه الناس وقراء القرآن ثم فاء المسلمون وثابوا، وأنزل الله عليهم نصره؛ ورمى عبد الرحمن بن أبي بكر مُحكّم بن الطفيل — الذي يقال له يُحكم اليمامة — بسهم فقتله، وأُلجئ الكفرة إلى الحديقة فسُميت يومئذ حديقة الموت وكانت تسمى أُباض؛ وقُتل مسيلمة في الحديقة واختلفوا في قاتله: بنو عامر بن لوى يقولون قتله خداش بن بشير، وبعض الأنصار قتله عبد الله بن زيد بن ثعلبة الذي أُري الأذان، وبعضهم أبو دجانة سماك بن خرشة ثم استُشهد، وبعضهم عبد الله بن زيد بن عاصم أخو حبيب بن زيد الذي كان مسيلمة قطع يديه ورجليه، ووحشي بن حرب قاتل حمزة كان يدّعي قتله ويقول «قتلت خير الناس وشرّ الناس»، وقوم قالوا إن هؤلاء جميعاً شركوا في قتله، وكان معاوية وبنو أمية يدّعونه له حتى قال عبد الملك بن مروان لحنفي وصف له القاتل «قضيت والله لمعاوية بقتله»؛ وكان شعار المسلمين «يا أصحاب سورة البقرة»، وأنكر بعض الأنصار على خالد استفراده بالرأي حين عزم على مناطحة مسيلمة ثم تبعوه؛ ونصب السائب بن العوام للناس عند رحالهم فقال «ليس لامرء مفرّ بعد رحله»؛ فلما نهكت الحرب المسلمين قال مجاعة بن مرارة لخالد إن أكثر أهل اليمامة لم يخرجوا لقتالهم وإنه يصالحه عنهم على نصف السبي ونصف الصفراء والبيضاء والحلقة والكراع، فألبس المشايخ والصبيان والنساء السلاح وأقامهم على الحصون ثم رجع فزعم أن القوم رفضوا حتى رضّوه بربع السبي ونصف المال، فاستقر الصلح على ذلك فلما دخل خالد اليمامة ورأى من بقي بها قال «خدعتني يا مجاع»؛ وأسلم أهل اليمامة وأُخذت منهم الصدقة، وأتى خالداً كتاب أبو بكر بإنجاد العلاء بن الحضرمي فسار إلى البحرين واستخلف على اليمامة سمرة بن عمرو العنبري؛ وكان فتح اليمامة سنة 12، واختلفوا في عدد من استُشهد بها فأقل ما ذكروا سبعمائة وأكثره ألف وسبعمائة وقيل ألف ومائتان، ومن شهدائها زيد بن الخطاب أخو عمر — قيل قتله أبو مريم الحنفي وقيل لبيد بن برغث — وثابت بن قيس خطيب النبي وكان على الأنصار يومئذ، وأبو حذيفة بن عتبة وسالم مولاه، وأبو دجانة، وعباد بن بشر، وسالم؛ وأم حبيب وعبد الله ابني زيد بن عاصم نسيبة بنت كعب قاتلت يومئذ فانصرفت وبها جراحات — وكان مسيلمة قد قطع يدي ابنها حبيب ورجليه حين بعثه النبي إليه مع عبد الله بن وهب الأسلمي فلم يعرض لعبد الله. ويعدّ أنس بن مالك في الصحيح سبعين قتيلاً للأنصار يوم اليمامة كيومي أحد وبئر معونة {cite:sahih-al-bukhari 4078}. وقعة اليمامة من حروب الردة، قاد فيها خالد بن الوليد جيشاً بعثه أبو بكر لقتال مسيلمة زعيم بني حنيفة. وبحسب موسوعة الإسلام دارت المعركة عند العقرباء حول حديقة مسوّرة عُرفت بحديقة الموت، وانتصر المسلمون وفقدوا كثيراً من القراء. وفي الرواية التقليدية ارتد مسيلمة وادعى النبوة، أما مقالة موسوعة الإسلام الأكاديمية فترى في حركته مشروع إمارة ذات أساس ديني حقيقي بعد وفاة هوذة بن علي؛ ويختلف التاريخ بين سنة 12هـ عند البلاذري وسنة 11هـ عند مقالة اليمامة."
  en: "In al-Baladhuri — who reports it in the first part of his book — Abu Bakr sent Khalid ibn al-Walid to al-Yamama ordering him to fight Musaylima the Liar; the first to meet the Muslims, al-Rajjal ibn Unfuwa, was killed, the foremost Muslims and the Quran-reciters fell as martyrs, then the Muslims returned and stood firm and God sent down His aid; Abd al-Rahman ibn Abi Bakr shot Muhakkim ibn al-Tufayl — called 'the arbiter of al-Yamama' — with an arrow and killed him, and the unbelievers were driven into the Garden, that day named the Garden of Death, formerly called Ubad; Musaylima was killed in the Garden and they disputed his slayer: Banu Amir ibn Lu'ayy say Khidash ibn Bashir, some Ansar Abdullah ibn Zayd ibn Tha'laba who was shown the adhan, some Abu Dujana Simak ibn Kharasha who then fell, some Abdullah ibn Zayd ibn Asim brother of Habib ibn Zayd whose hands and feet Musaylima had cut off, Wahshi ibn Harb — Hamza's slayer — used to claim it saying 'I killed the best of men and the worst', some held they all shared in it, and Mu'awiya and the Umayyads claimed it for him until Abd al-Malik ibn Marwan told a Hanafi who described the killer 'by God I have judged it for Mu'awiya'; the Muslims' cry was 'O companions of Sura al-Baqara'; some Ansar reproached Khalid's lone resolve to butt Musaylima then followed him; al-Sa'ib ibn al-Awwam stood the men at their baggage: 'no man may flee beyond his saddle'; when the war wore the Muslims down Mujja'a ibn Murara told Khalid most of Yamama's people had not come out to fight and offered peace for half the captives and half the gold, silver, armour and mounts, then armed the old men, boys and women on the fortresses, returned claiming they refused, and beat the terms down to a quarter of the captives and half the wealth — settled thus, until Khalid entered, saw who remained and said 'you deceived me, Mujja'a'; the people of al-Yamama embraced Islam and the alms were taken from them, Abu Bakr's letter reached Khalid ordering him to aid al-Ala ibn al-Hadrami so he marched to Bahrain leaving Samura ibn Amr al-Anbari over al-Yamama; its conquest was in year 12; they disputed the martyrs' count — least said seven hundred, most seventeen hundred, some twelve hundred — among them Zayd ibn al-Khattab, Umar's brother (killed by Abu Maryam al-Hanafi or per Ibn al-Kalbi Labid ibn Burghuth), Thabit ibn Qays the Prophet's orator commanding the Ansar that day, Abu Hudhayfa ibn Utba and his mawla Salim, Abu Dujana, Abbad ibn Bishr and Salim; and Nusayba bint Ka'b — mother of Habib and Abdullah the sons of Zayd ibn Asim — fought that day and came away wounded, Musaylima having cut off her son Habib's hands and feet when the Prophet sent him with Abdullah ibn Wahb al-Aslami, whom he left unharmed. The battle of al-Yamama was a battle of the Ridda wars in which Khalid ibn al-Walid led the army Abu Bakr sent against Musaylima, leader of the Banu Hanifa. According to the Encyclopaedia of Islam it was fought at al-Akraba' around a walled garden called the garden of death, and the Muslims won but lost many Qur'an reciters. In the classical account Musaylima renounced Islam and claimed prophethood, while the encyclopaedia's academic reading sees a bid for a principality with a genuine religious basis after the death of Hawdha ibn Ali; the year is 12 AH in al-Baladhuri and 11 AH in the article on al-Yamama."
  ur: "جنگِ یمامہ ردّہ کی جنگوں کی ایک لڑائی تھی جس میں خالد بن الولید نے اس لشکر کی قیادت کی جو ابو بکر نے بنو حنیفہ کے سردار مسیلمہ کے خلاف بھیجا۔ دائرۃ المعارف اسلامیہ کے مطابق یہ عقرباء میں ایک چار دیواری والے باغ کے گرد لڑی گئی جسے موت کا باغ کہا گیا، مسلمان جیتے مگر بہت سے قاری کھو دیے۔ روایتی بیان میں مسیلمہ نے اسلام ترک کر کے نبوت کا دعویٰ کیا، جبکہ دائرۃ المعارف کی علمی تعبیر ہوذہ بن علی کی وفات کے بعد ایک حقیقی مذہبی بنیاد والی ریاست کی کوشش دیکھتی ہے؛ سال بلاذری کے ہاں 12ھ اور یمامہ کے مضمون میں 11ھ ہے۔"
