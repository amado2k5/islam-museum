summary:
  ar: "بطاقة أولية لحصار وفتح القدس سنة ١٥هـ/٦٣٧م، حين سلّم البطريرك صفرونيوس المدينة للخليفة عمر بن الخطاب؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the siege and surrender of Jerusalem in 15/637, when Patriarch Sophronius delivered the city to the caliph Umar ibn al-Khattab; its sources are not yet checked on the page."
  es: "Borrador del asedio y la rendición de Jerusalén en 15/637, cuando el patriarca Sofronio entregó la ciudad al califa Umar ibn al-Khattab; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour le siège et la reddition de Jérusalem en 15/637, lorsque le patriarche Sophronius a livré la ville au calife Umar ibn al-Khattab; ses sources ne sont pas encore vérifiées sur la page."
  ur: "15/637 میں یروشلم کے محاصرے اور ہتھیار ڈالنے کے لیے ڈرافٹ کارڈ، جب پیٹریارک سوفرونیئس نے شہر کو خلیفہ عمر بن الخطاب کے حوالے کیا؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Bu metin, Patrik Sofronius'un şehri Halife Ömer İbn Al-Khattab'a teslim ettiği 15 Hicri/637 Miladi yılındaki Kudüs kuşatması ve fethine dair ön bir anlatımdır; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang pengepungan dan penaklukan Yerusalem pada tahun 15 H/637 M, ketika Patriark Sophronius menyerahkan kota itu kepada Khalifah Omar Ibn Al-Khattab; sumber-sumbernya belum ditinjau di halaman ini."
