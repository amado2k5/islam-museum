label: { ar: "كتاب قريش إلى عبد الله بن أبي بعد الهجرة", en: "Quraysh's letter to Abdullah ibn Ubayy after the Hijra", es: "Carta de Quraysh a Abdullah ibn Ubayy después de la Hégira.", fr: "Lettre de Quraysh à Abdullah ibn Ubayy après l'Hégire", ur: "ہجرت کے بعد عبداللہ بن ابی کو قریش کا خط", tr: "Hicretten sonra Kureyş'in Abdullah ibn Ubay'a yazdığı mektup", id: "Surat kaum Quraisy kepada Abdullah bin Ubay setelah Hijrah" }
summary:
  ar: "كتبت قريش إلى عبد الله بن أبي ومن معه من المشركين تهددهم بالقتال أو الإخراج للنبي؛ فتجمع ابن أبي ليقاتله، فخرج إليهم النبي فتفرقوا، فامتنع عن القتال."
  en: "Quraysh wrote to Abdullah ibn Ubayy and the pagans with him threatening war or the expulsion of the Prophet; Ibn Ubayy gathered to fight him, but when the Prophet came out to them they dispersed and he refrained from fighting."
  es: "Los Quraysh escribieron a Abdullah ibn Ubayy y a los paganos que lo acompañaban, amenazando con la guerra o la expulsión del Profeta; Ibn Ubayy se reunió para luchar contra él, pero cuando el Profeta salió a su encuentro, se dispersaron y él se abstuvo de combatir."
  fr: "Les Qurayshites écrivirent à Abdullah ibn Ubayy et aux païens qui l'accompagnaient, les menaçant de guerre ou d'expulsion du Prophète; Ibn Ubayy se rassembla pour le combattre, mais lorsque le Prophète sortit à leur rencontre, ils se dispersèrent et il s'abstint de combattre."
  ur: "قریش نے عبداللہ بن ابی اور اس کے ساتھ مشرکوں کو جنگ یا رسول اللہ کی بے دخلی کی دھمکیاں لکھیں۔ ابن ابی ان سے لڑنے کے لیے جمع ہوئے لیکن جب نبی ان کے پاس آئے تو وہ منتشر ہو گئے اور آپ لڑنے سے باز رہے۔"
  tr: "Kureyşliler, Abdullah ibn Ubay'a ve onunla birlikte olan müşriklere mektup yazarak, Peygamberle savaşmak veya onu kovmakla tehdit ettiler. Bunun üzerine İbn Ubay onunla savaşmak için toplandı, ancak Peygamber onların yanına gitti ve onlar dağıldılar, böylece Peygamber savaşmaktan vazgeçti."
  id: "Kaum Quraisy menulis surat kepada Abdullah ibn Ubay dan orang-orang yang bersamanya dari kalangan kaum musyrik, mengancam mereka dengan pertempuran atau pengusiran Nabi. Maka Ibn Ubay berkumpul untuk melawannya, tetapi Nabi keluar menemui mereka dan mereka bubar, sehingga beliau menahan diri untuk tidak berperang."
