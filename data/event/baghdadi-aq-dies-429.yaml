id: event/baghdadi-aq-dies-429
class: event
kind: death
label:
  ar: "وفاة أبي منصور البغدادي بإسفرايين ودفنه إلى جانب شيخه، ٤٢٩هـ"
  en: "Abu Mansur al-Baghdadi dies at Isfarayin and is buried beside his teacher, 429/1038"
  ur: "ابو منصور بغدادی کی اسفراین میں وفات اور استاد کے پہلو میں تدفین، 429ھ/1038ء"
summary:
  ar: "حين حلّ أبو منصور بإسفرايين ابتهج أهلها بمقدمه ابتهاجاً لا يوصف، فلم يبق بها إلا اليسير حتى مات سنة تسع وعشرين وأربعمائة، وأجمع أهل العلم على دفنه إلى جانب الأستاذ أبي إسحاق فصار قبراهما متجاورين {cite:tabaqat-shafiiyya-subki pp. 238-239} {cite:tarikh-islam-dhahabi p. 265}؛ ووقع في تاريخ ابن النجار أنه مات سنة ٤٢٧هـ وهو تصحيف عند السبكي {cite:tabaqat-shafiiyya-subki p. 239}، ونقل ابن شاكر سنة ٤٢٠هـ {cite:mawsuat-a3lam-ulama-adaba p. 635}."
  en: "When Abu Mansur reached Isfarayin its people rejoiced at his coming beyond description, but he stayed only a little while before dying in 429; the people of learning agreed to bury him beside the master Abu Ishaq, and their two graves stand side by side {cite:tabaqat-shafiiyya-subki pp. 238-239} {cite:tarikh-islam-dhahabi p. 265}; Ibn al-Najjar's history gives 427, which al-Subki calls a scribal error {cite:tabaqat-shafiiyya-subki p. 239}, and Ibn Shakir transmits 420 {cite:mawsuat-a3lam-ulama-adaba p. 635}."
  ur: "جب ابو منصور اسفراین پہنچے تو اہل شہر ان کی آمد پر بے حد خوش ہوئے، مگر وہ وہیں تھوڑے دن ٹھہرے اور 429ھ میں فوت ہوئے؛ اہل علم نے انھیں استاد ابو اسحاق کے پہلو میں دفن کرنے پر اتفاق کیا اور دونوں قبریں آمنے سامنے رہیں {cite:tabaqat-shafiiyya-subki pp. 238-239} {cite:tarikh-islam-dhahabi p. 265}؛ ابن نجار کی تاریخ میں 427ھ ہے جو سبکی کے نزدیک تصحیف ہے {cite:tabaqat-shafiiyya-subki p. 239}، اور ابن شاکر سے 420ھ منقول ہے {cite:mawsuat-a3lam-ulama-adaba p. 635}۔"
