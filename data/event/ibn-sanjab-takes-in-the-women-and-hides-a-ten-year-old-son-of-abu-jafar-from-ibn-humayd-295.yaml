id: "event/ibn-sanjab-takes-in-the-women-and-hides-a-ten-year-old-son-of-abu-jafar-from-ibn-humayd-295"
class: event
kind: other
label:
  ar: "ابن سنجاب يأوي حرم أبي جعفر ويخفي ابنه موسى عن ابن حميد، 295هـ، ص379"
  en: "Ibn Sanjab takes in the women of Abu Ja'far and hides his ten-year-old son from Ibn Humayd, 295 AH, p. 379"
  ur: "ابن سنجاب ابو جعفر کی خواتین کو پناہ دیتا ہے اور اس کے دس سالہ بیٹے کو ابن حمید سے چھپا لیتا ہے، 295ھ، ص379"
  es: "Ibn Sanjab acoge a las mujeres de Abu Ja'far y esconde a su hijo de diez años de Ibn Humayd, 295 AH, pág. 379."
  fr: "Ibn Sanjab accueille les femmes d'Abu Ja'far et cache son fils de dix ans à Ibn Humayd, 295 AH, p. 379"
  tr: "İbn Sinjab, Ebu Cafer'in kadınlarına sığınak sağlar ve oğlu Musa'yı İbn Hamid'den saklar, Hicri 295, s. 379"
  id: "Ibn Sinjab melindungi para wanita Abu Ja'far dan menyembunyikan putranya Musa dari Ibn Hamid, 295 H, hlm. 379"
summary:
  ar: "انتقلت حرم أبي جعفر إلى دار محمد بن سنجاب، فأحسن القيام بهن، وأخفى ابن سنجاب ابناً لأبي جعفر عمره عشر سنين كان ابن حميد يطلبه ليقتله، وحلف أنه لا يعلم مكانه."
  en: "The women of Abu Ja'far's household were taken to the house of Muhammad ibn Sanjab, who looked after them well. He hid a ten-year-old son of Abu Ja'far, Musa, from Ibn Humayd, who had sent for the boy to kill him, and swore that he did not know where the boy was."
  ur: "ابو جعفر کی خواتین محمد بن سنجاب کے گھر لے جائی گئیں جس نے ان کا خیال رکھا۔ اس نے ابو جعفر کے دس سالہ بیٹے موسیٰ کو ابن حمید سے چھپا لیا، جس نے اسے قتل کرنے کے لیے طلب کیا تھا، اور قسم کھائی کہ اسے نہیں معلوم کہ لڑکا کہاں ہے۔"
  es: "Las mujeres de la casa de Abu Ja'far fueron llevadas a la casa de Muhammad ibn Sanjab, quien las cuidó bien. Allí escondió a Musa, un hijo de diez años de Abu Ja'far, de Ibn Humayd, quien había mandado llamar al niño para matarlo, y juró que no sabía dónde estaba."
  fr: "Les femmes de la famille d'Abu Ja'far furent conduites chez Muhammad ibn Sanjab, qui prit grand soin d'elles. Il cacha Musa, un fils d'Abu Ja'far âgé de dix ans, à Ibn Humayd, qui l'avait fait venir pour le tuer, et jura ignorer où il se trouvait."
  tr: "Ebu Cafer'in ailesi Muhammed ibn Sinjab'ın evine taşındı ve o da onlara iyi baktı. İbn Sinjab, İbn Hamid'in öldürmek için aradığı Ebu Cafer'in on yaşındaki oğlunu sakladı ve nerede olduğunu bilmediğine yemin etti."
  id: "Keluarga Abu Jaafar pindah ke rumah Muhammad ibn Sinjab, dan beliau merawat mereka dengan baik. Ibn Sinjab menyembunyikan seorang anak laki-laki berusia sepuluh tahun milik Abu Jaafar yang sedang dicari oleh Ibn Hamid untuk dibunuh, dan beliau bersumpah bahwa beliau tidak mengetahui keberadaannya."
