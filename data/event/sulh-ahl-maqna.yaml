id: event/sulh-ahl-maqna
class: event
kind: treaty
label: { ar: "صلح أهل مقنى", en: "The Treaty with the People of Maqna", es: "El Tratado con el Pueblo de Maqna", fr: "Le traité avec le peuple de Maqna", ur: "اہل مکنہ کے ساتھ معاہدہ", tr: "Makna halkının barışı", id: "Kedamaian penduduk Maqna" }
summary:
  ar: "عند البلاذري: صالح رسول الله أهل مقنى — وكانوا يهوداً من بني حبيبة — في غزوة تبوك على ربع صيد العروك ⁦(وهو خشب يصطاد عليه)⁩، وربع غزل النساء، وربع الثمار؛ وكتب لهم كتاباً روي أن رجلاً رآه بأيدي يهود مصر في جلد أحمر دارس الخط فنسخه — نصه أمان وذمة الله وذمة رسوله وعفو عن كل دم، وأن لرسول الله البزة والرقيق والكراع والحلقة إلا ما عفا عنه، وأنه رفع عنهم كل جزية وسخرة، وأن ليس عليهم أمير إلا من أنفسهم أو من أهل بيت رسول الله، وكتبه علي في سنة 9 على ما في النسخة — وقد أنكر محققا الطبعة نسبة الكتاب إلى علي إذ لم يكن مع النبي في غزوة تبوك فرجحا افتعاله."
  en: "In al-Baladhuri: the Prophet made peace with the people of Maqna — Jews of Banu Habiba — during the Tabuk campaign for a quarter of the 'uruk catch (a wood used in fishing), a quarter of the women's spinning and a quarter of the fruits; he wrote them a letter a man reported seeing in the hands of the Jews of Egypt on red leather with a faded script — its text granting security, God's protection and His messenger's, pardon for every blood, reserving for the Prophet the buzza, the captives, the kira' and the armour except what he excused, lifting from them every jizya and corvée, with no commander over them but one of themselves or of the Prophet's household, written by Ali in year 9 per the copy — though the edition's editors reject its attribution to Ali, who was not with the Prophet at Tabuk, judging the document fabricated."
  es: "En al-Baladhuri: el Profeta hizo la paz con la gente de Maqna —judíos de Banu Habiba— durante la campaña de Tabuk a cambio de una cuarta parte de la pesca de 'uruk (una madera utilizada en la pesca), una cuarta parte del hilado de las mujeres y una cuarta parte de las frutas; les escribió una carta que un hombre dijo haber visto en manos de los judíos de Egipto en cuero rojo con una escritura descolorida —su texto otorgaba seguridad, la protección de Dios y de Su mensajero, perdón por toda sangre, reservando para el Profeta el buzza, los cautivos, el kira' y la armadura excepto lo que él excusara, quitándoles toda jizya y corvéa, sin ningún comandante sobre ellos excepto uno de ellos mismos o de la casa del Profeta, escrita por Ali en el año 9 según la copia— aunque los editores de la edición rechazan su atribución a Ali, quien no estaba con el Profeta en Tabuk, juzgando el documento como falsificado."
  fr: "Dans al-Baladhuri: le Prophète fit la paix avec les habitants de Maqna — les Juifs de Banu Habiba — durant la campagne de Tabuk, en échange d'un quart de la pêche à l'uruk (un bois utilisé pour la pêche), d'un quart du filage des femmes et d'un quart des fruits. Il leur écrivit une lettre, rapportée par un homme, entre les mains des Juifs d'Égypte, sur du cuir rouge à l'écriture effacée. Le texte garantissait la sécurité, la protection divine et celle de Son Messager, le pardon pour chaque effusion de sang, réservant au Prophète la buzza, les captifs, la kira' et l'armure, à l'exception de ce qu'il avait exonéré, et supprimait toute jizya et corvée. Ils n'auraient d'autre commandant que l'un d'entre eux ou un membre de la famille du Prophète. Selon une copie, cette lettre aurait été écrite par Ali en l'an 9. Cependant, les éditeurs de cette édition rejettent cette attribution, car Ali n'était pas présent auprès du Prophète à Tabuk, et considèrent le document comme un faux."
  ur: "البلادوری میں ہے: نبی نے تبوک کی مہم کے دوران مکنا کے لوگوں - بنو حبیبہ کے یہودیوں سے صلح کی تھی، ایک چوتھائی عرق کیچ ⁦(ماہی گیری میں استعمال ہونے والی لکڑی)⁩، چوتھائی عورتوں کی کتائی اور ایک چوتھائی پھل؛ اس نے انہیں ایک خط لکھا جس میں ایک شخص نے مصر کے یہودیوں کے ہاتھوں میں سرخ چمڑے پر ایک دھندلا خط لکھا ہوا دیکھا تھا - اس کا متن سلامتی، خدا کی حفاظت اور اس کے رسول کی حفاظت، ہر خون کی معافی، رسول اللہ کے لیے بزہ، قیدیوں، قیرع اور زرہ بکتر کو محفوظ کرنے کے علاوہ جو کچھ اس نے عذر کیا، ان پر سے کوئی حکم نہیں اٹھایا اور ان پر کوئی حکم نہیں دیا۔ یا پیغمبر کے گھرانے کا، جسے علی نے سال 9 میں لکھا تھا - حالانکہ ایڈیشن کے ایڈیٹرز نے اس کے انتساب کو علی کی طرف منسوب کیا ہے، جو تبوک میں پیغمبر کے ساتھ نہیں تھے، دستاویز کو من گھڑت قرار دیتے ہوئے"
  tr: "El-Baladhuri'ye göre: Allah'ın Resulü, Tebük Savaşı sırasında Beni Habibe kabilesinden Yahudiler olan Makna halkıyla, avda kullanılan bir tahta parçası olan 'aruk'un dörtte biri, kadınların ipliklerinin dörtte biri ve meyvelerin dörtte biri karşılığında barış sağlamıştır. Mısır Yahudilerinin elinde, kırmızı deri üzerine yazılmış ve yıpranmış bir yazıyla bir adam tarafından görüldüğü rivayet edilen bir belgeyi onlara yazdı; bu belgenin metni, Allah'ın ve Resulünün güvencesi ve koruması, dökülen her şeyin affı, Resulün affettikleri hariç, giysilerine, kölelerine, atlarına ve yüzüklerine sahip olduğu, onlardan tüm vergiyi ve zorunlu çalışmayı kaldırdığı ve aralarından veya Resulün ailesinden başka bir liderin olmadığı ve Ali'nin bunu kopyada belirtilene göre 9. yılda yazdığıdır. Baskının editörleri, Tebük Savaşı sırasında Peygamberle birlikte olmadığı için kitabın Ali'ye atfedilmesini reddettiler ve bunun uydurma olduğunu savundular."
  id: "Menurut Al-Baladhuri: Rasulullah SAW berdamai dengan penduduk Maqna — yang merupakan orang Yahudi dari Bani Habiba — selama Perang Tabuk, berdasarkan seperempat hasil buruan 'aruk (yaitu sepotong kayu yang digunakan untuk berburu), seperempat benang wanita, dan seperempat buah-buahan. Dia menuliskan sebuah dokumen untuk mereka yang dilaporkan telah dilihat oleh seorang pria di tangan orang-orang Yahudi Mesir di atas kulit merah dengan tulisan yang sudah usang, lalu dia menyalinnya — teksnya adalah jaminan dan perlindungan Allah dan Rasul-Nya serta pengampunan atas semua pertumpahan darah, dan bahwa Rasulullah memiliki pakaian, budak, kuda, dan cincin kecuali yang diampuninya, dan bahwa beliau telah menghapuskan dari mereka semua upeti dan kerja paksa, dan bahwa tidak ada pemimpin atas mereka kecuali dari kalangan mereka sendiri atau dari keluarga Rasulullah, dan Ali menulisnya pada tahun 9 menurut apa yang ada dalam salinan tersebut — dan para editor edisi tersebut menyangkal atribusi buku itu kepada Ali, karena dia tidak bersama Nabi selama Perang Tabuk, sehingga mereka lebih memilih bahwa itu adalah rekayasa."
