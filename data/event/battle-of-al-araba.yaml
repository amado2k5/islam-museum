label: { ar: "وقعة العربة", en: "The Battle of al-Araba" }
summary:
  ar: "عند البلاذري: توجه يزيد بن أبي سفيان في طلب بطريق غزة فبلغه أن بالعربة من أرض فلسطين جمعاً للروم فوجّه إليهم أبا أمامة الصديّ بن عجلان الباهلي فأوقع بهم وقتل عظيمهم ثم انصرف؛ وروى أبو مخنف في يوم العربة أن ستة قواد من قواد الروم نزلوا العربة في ثلاثة آلاف فسار إليهم أبو أمامة في كثف من المسلمين فهزمهم وقتل أحد القواد ثم اتبعهم فصاروا إلى الدابية فهزمهم وغنم المسلمون غنماً حسناً؛ وقال مشايخ من أهل الشام كانت أول وقائع المسلمين وقعة العربة."
  en: "In al-Baladhuri: Yazid ibn Abi Sufyan, pursuing the patrician of Gaza, learned of a Roman gathering at al-Araba in the land of Filastin and sent against them Abu Umama al-Sudayy ibn Ajlan al-Bahili, who fell upon them, killed their chief and withdrew; Abu Mikhnaf reports of the day of al-Araba that six Roman commanders descended on al-Araba with three thousand, whereupon Abu Umama marched on them with a band of Muslims, defeated them and killed one of the commanders, then pursued them to al-Dabiyya and defeated them there, the Muslims taking good spoil; the elders of Syria hold the day of al-Araba was the Muslims' first engagement."
