label: { ar: "وقعة العربة", en: "The Battle of al-Araba", fr: "La bataille d'al-Araba", es: "La batalla de al-Araba" }
summary:
  ar: "عند البلاذري: توجه يزيد بن أبي سفيان في طلب بطريق غزة فبلغه أن بالعربة من أرض فلسطين جمعاً للروم فوجّه إليهم أبا أمامة الصديّ بن عجلان الباهلي فأوقع بهم وقتل عظيمهم ثم انصرف؛ وروى أبو مخنف في يوم العربة أن ستة قواد من قواد الروم نزلوا العربة في ثلاثة آلاف فسار إليهم أبو أمامة في كثف من المسلمين فهزمهم وقتل أحد القواد ثم اتبعهم فصاروا إلى الدابية فهزمهم وغنم المسلمون غنماً حسناً؛ وقال مشايخ من أهل الشام كانت أول وقائع المسلمين وقعة العربة."
  en: "In al-Baladhuri: Yazid ibn Abi Sufyan, pursuing the patrician of Gaza, learned of a Roman gathering at al-Araba in the land of Filastin and sent against them Abu Umama al-Sudayy ibn Ajlan al-Bahili, who fell upon them, killed their chief and withdrew; Abu Mikhnaf reports of the day of al-Araba that six Roman commanders descended on al-Araba with three thousand, whereupon Abu Umama marched on them with a band of Muslims, defeated them and killed one of the commanders, then pursued them to al-Dabiyya and defeated them there, the Muslims taking good spoil; the elders of Syria hold the day of al-Araba was the Muslims' first engagement."
  fr: "Chez al-Baladhuri : Yazid ibn Abi Sufyan, poursuivant le patrice de Gaza, apprit qu'un rassemblement romain se trouvait à al-Araba, dans la terre de Filastin, et envoya contre eux Abu Umama al-Sudayy ibn Ajlan al-Bahili, qui tomba sur eux, tua leur chef et se retira ; Abu Mikhnaf rapporte, au sujet de la journée d'al-Araba, que six commandants romains descendirent sur al-Araba avec trois mille hommes, sur quoi Abu Umama marcha contre eux avec une troupe de musulmans, les vainquit et tua l'un des commandants, puis les poursuivit jusqu'à al-Dabiyya et les y vainquit, les musulmans prenant un bon butin ; les anciens de Syrie tiennent que la journée d'al-Araba fut le premier engagement des musulmans."
  es: "En al-Baladhuri: Yazid ibn Abi Sufyan, persiguiendo al patricio de Gaza, se enteró de una reunión romana en al-Araba en la tierra de Filastin y envió contra ellos a Abu Umama al-Sudayy ibn Ajlan al-Bahili, quien los atacó, mató a su jefe y se retiró; Abu Mikhnaf relata del día de al-Araba que seis comandantes romanos descendieron sobre al-Araba con tres mil hombres, entonces Abu Umama marchó contra ellos con un grupo de musulmanes, los derrotó y mató a uno de los comandantes, luego los persiguió hasta al-Dabiyya y los derrotó allí, los musulmanes tomaron un buen botín; los ancianos de Siria sostienen que el día de al-Araba fue el primer enfrentamiento de los musulmanes."
