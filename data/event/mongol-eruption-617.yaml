label: { ar: "خروج التتر إلى بلاد الإسلام", en: "The Mongols Erupt into the Lands of Islam", es: "Los mongoles irrumpen en las tierras del Islam.", fr: "Les Mongols envahissent les terres de l'Islam" }
summary:
  ar: "في سنة سبع عشرة وستمائة ظهر التتر إلى بلاد الإسلام وهم نوع كثير من الترك مساكنهم جبال طمغاج من نحو الصين؛ ويستهل ابن الأثير خبرها بقوله إنه بقي سنين معرضاً عن ذكرها استعظاماً لها: فمن الذي يسهل عليه أن يكتب نعي الإسلام والمسلمين، ويا ليت أمي لم تلدني ويا ليتني مت قبل هذا وكنت نسياً منسياً، ويعدها الحادثة العظمى التي عقت الأيام والليالي عن مثلها، فيقول لو قال قائل إن العالم منذ خلق الله آدم لم يبتلوا بمثلها لكان صادقاً، وما فعله بختنصر ببني إسرائيل من القتل وتخريب بيت المقدس لا يقاس إليه إذ كل مدينة مما خربوه أضعاف بيت المقدس؛ ويصفهم فقوم خرجوا من أطراف الصين فقصدوا بلاد تركستان كاشغر وبلاساغون ثم ما وراء النهر سمرقند وبخارى، ثم عبرت طائفة إلى خراسان فأفرغوها ملكاً وتخريباً ونهباً، ثم الري وهمذان وبلاد الجبل إلى حد العراق ثم أذربيجان وأران، ثم دربند شروان وبلاد اللان واللكز وقبجاق، كل ذلك في أقل من سنة بمقدار مسيرهم لا غير، فيقول إن الإسكندر الذي اتفق المؤرخون على أنه ملك الدنيا لم يملكها إلا في نحو عشر سنين وهؤلاء ملكوا أكثر المعمور في نحو سنة؛ ويصف عادتهم فلا يحتاجون إلى ميرة يتبعهم لأن معهم أغنامهم وبقرهم وخيلهم ودوابهم تحفر الأرض بحوافرها وتأكل عروق النبات لا تعرف الشعير، ويسجدون للشمس عند طلوعها ولا يحرمون من الدواب شيئاً؛ ويعلل تمكنهم بأن خوارزم شاه محمداً كان استولى على البلاد وقتل ملوكها وأفناهم فلما انهزم لم يبق في البلاد مانع ولا حامٍ {cite:kamil-ibn-al-athir p. 399-401}."
  en: "In 617 the Mongols erupted into the lands of Islam: a large people of Turks whose dwellings were the mountains of Tamghaj, on the side of China. Ibn al-Athir opens their story by saying that he had for years held back from recounting it, out of awe: who could bring himself to write the obituary of Islam and the Muslims, wishing he had died before it and been forgotten? He calls it a calamity such that the days and nights have been barren of its like, and says that had someone claimed no people since Adam had suffered its like, he would have spoken truly; what Nebuchadnezzar did to the Children of Israel, the killing and the wrecking of Jerusalem, is nothing beside it, since every city they ruined was many times Jerusalem. He describes how they came out from the edges of China and made for Turkistan, Kashghar and Balasaghun, then Transoxania, Samarkand and Bukhara; a detachment crossed into Khurasan and left it emptied of rule through ruin and plunder; then Rayy, Hamadan and the Jibal to the borders of Iraq, then Azerbaijan and Arran, then Darband of Shirvan, the lands of the Lan and the Lakz, and the Qipchaq, all in less than a year by the measure of their march alone. Alexander, whom the historians agree ruled the world, held it for about ten years; these took most of the inhabited world in about a year. He describes their way of life: they need no supply train, since their sheep, cattle, horses and mounts dig the earth with their hooves and eat plant roots; they know no barley; they prostrate to the sun at its rising, and they forbid none of the beasts. He explains their success: Khwarazm-shah Muhammad had seized those lands, killing and wiping out their kings, so that once he was beaten nothing stood to bar or defend them {cite:kamil-ibn-al-athir p. 399-401}."
  es: "En 617 los mongoles irrumpieron en las tierras del Islam: un gran pueblo de turcos cuyas moradas eran las montañas de Tamghaj, en la frontera con China. Ibn al-Athir comienza su relato diciendo que durante años se había abstenido de contarlo, por asombro: ¿quién podría atreverse a escribir el obituario del Islam y de los musulmanes, deseando haber muerto antes y haber sido olvidado? Lo llama una calamidad tal que los días y las noches han estado estériles de semejante, y dice que si alguien hubiera afirmado que ningún pueblo desde Adán había sufrido algo semejante, habría dicho la verdad; lo que Nabucodonosor hizo a los Hijos de Israel, la matanza y la destrucción de Jerusalén, no es nada comparado con esto, ya que cada ciudad que arruinaron era muchas veces Jerusalén. Describe cómo salieron de los confines de China y se dirigieron a Turkistán, Kashgar y Balasaghun, luego a Transoxiana, Samarcanda y Bujará; Un destacamento cruzó a Jorasán y lo dejó vacío de gobierno por la ruina y el saqueo; luego Rayy, Hamadán y Jibal hasta las fronteras de Irak, luego Azerbaiyán y Arran, luego Darband de Shirvan, las tierras de Lan y Lakz, y Qipchaq, todo en menos de un año según la medida de su marcha. Alejandro, de quien los historiadores coinciden en que gobernó el mundo, lo mantuvo durante unos diez años; estos tomaron la mayor parte del mundo habitado en aproximadamente un año. Describe su modo de vida: no necesitan tren de suministros, ya que sus ovejas, ganado, caballos y monturas cavan la tierra con sus pezuñas y comen raíces de plantas; no conocen la cebada; se postran ante el sol al amanecer y no prohíben nada a las bestias. Explica su éxito: el sha de Jorasán, Muhammad, se había apoderado de esas tierras, matando y aniquilando a sus reyes, de modo que una vez que fue derrotado, nada se interpuso para detenerlas o defenderlas {cite:kamil-ibn-al-athir p. 399-401}."
  fr: "En 617, les Mongols déferlèrent sur les terres d'Islam: un peuple nombreux de Turcs, installés dans les montagnes de Tamghaj, aux frontières de la Chine. Ibn al-Athir commence son récit en expliquant qu'il s'était longtemps abstenu de le relater, tant il était saisi d'effroi: qui aurait pu se résoudre à écrire la nécrologie de l'Islam et des musulmans, souhaitant mourir avant et être oublié ? Il qualifie cet événement de calamité telle que ni l'on n'en a jamais connu d'équivalent, et affirme que quiconque aurait prétendu qu'aucun peuple depuis Adam n'avait subi un tel sort aurait dit vrai; ce que Nabuchodonosor fit aux Enfants d'Israël, le massacre et la destruction de Jérusalem, n'est rien en comparaison, car chaque ville qu'ils ravagèrent fut plusieurs fois plus grande que Jérusalem. Il décrit comment ils sortirent des confins de la Chine et se dirigèrent vers le Turkestan, Kashgar et Balasaghun, puis la Transoxiane, Samarcande et Boukhara. Un détachement traversa le Khorasan et le laissa dévasté par le pillage et la ruine; puis Rayy, Hamadan et le Jibal jusqu'aux frontières de l'Irak, puis l'Azerbaïdjan et Arran, puis Darband de Shirvan, les terres des Lan et des Lakz, et les Qipchaq, le tout en moins d'un an, si l'on considère uniquement la durée de leur marche. Alexandre, que les historiens considèrent comme le plus grand conquérant du monde, le conserva pendant une dizaine d'années; ces derniers conquirent la majeure partie du monde habité en un an environ. Il décrit leur mode de vie: ils n'ont pas besoin de convois de ravitaillement, car leurs moutons, leurs bovins, leurs chevaux et leurs montures broutent la terre avec leurs sabots et se nourrissent de racines; ils ignorent l'orge; ils se prosternent devant le soleil levant et n'interdisent aucune bête. Il explique leur succès: le Khwarezm-shah Muhammad s'était emparé de ces terres, tuant et exterminant leurs rois, de sorte qu'une fois vaincu, plus rien ne pouvait les arrêter ni les défendre. (Voir: Kamil-ibn-al-athir, p. 100). 399-401}."
