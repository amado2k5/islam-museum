summary:
  ar: "في سنة سبع وثلاثين وثلاثمائة تفزع الناس بالليل وتحارسوا وخُيّل إليهم حيوان يظهر في سطوحهم فتارة يظنونه ذئبًا وتارة غيره فبقوا على ذلك أيامًا كثيرة ثم سكنوا، وكان ابتداؤه من سوق الثلاثاء ثم انتشر في الجانبين؛ وفي يوم الاثنين لليلتين خلتا من رمضان انتهت زيادة دجلة إلى إحدى وعشرين ذراعًا وثلث فغرقت الضياع والدور التي عليها وأشفى الجانب الشرقي على الغرق وهمّ الناس بالهرب منه {cite:muntazam-ibn-al-jawzi p. 649}."
  en: "In 337 Baghdadis panicked by night for days at an animal imagined on the rooftops — now a wolf, now something else — beginning in Suq al-Thalatha' and spreading to both sides; and on Monday two nights before Ramadan's end the Tigris crested at twenty-one and a third cubits, drowning estates and nearly the whole east bank {cite:muntazam-ibn-al-jawzi p. 649}."
