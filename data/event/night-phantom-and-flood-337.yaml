label: { ar: "وهم السطوح الليلي وفيضان دجلة سنة ٣٣٧", en: "The Night Phantom on the Rooftops and the Tigris Flood of 337", es: "El fantasma nocturno en los tejados y la inundación del Tigris del año 337", fr: "Le Fantôme de la Nuit sur les Toits et la Crue du Tigre de 337", ur: "چھتوں پر رات کا پریت اور 337 کا دجلہ سیلاب", tr: "Bunlar, 337 yılında meydana gelen gece çatıları ve Dicle Nehri'nin taşmasıdır.", id: "Itulah atap-atap rumah di malam hari dan banjir Sungai Tigris pada tahun 337." }
summary:
  ar: "في سنة سبع وثلاثين وثلاثمائة تفزع الناس بالليل وتحارسوا وخُيّل إليهم حيوان يظهر في سطوحهم فتارة يظنونه ذئبًا وتارة غيره فبقوا على ذلك أيامًا كثيرة ثم سكنوا، وكان ابتداؤه من سوق الثلاثاء ثم انتشر في الجانبين؛ وفي يوم الاثنين لليلتين خلتا من رمضان انتهت زيادة دجلة إلى إحدى وعشرين ذراعًا وثلث فغرقت الضياع والدور التي عليها وأشفى الجانب الشرقي على الغرق وهمّ الناس بالهرب منه {cite:muntazam-ibn-al-jawzi p. 649}."
  en: "In 337 Baghdadis panicked by night for days at an animal imagined on the rooftops — now a wolf, now something else — beginning in Suq al-Thalatha' and spreading to both sides; and on Monday two nights before Ramadan's end the Tigris crested at twenty-one and a third cubits, drowning estates and nearly the whole east bank {cite:muntazam-ibn-al-jawzi p. 649}."
  es: "En 337, los bagdadíes entraron en pánico durante días por la noche ante la aparición de un animal en los tejados —ahora un lobo, ahora otra cosa— que comenzó en Suq al-Thalatha' y se extendió a ambos lados; y el lunes, dos noches antes del final del Ramadán, el Tigris alcanzó una altura de veintiún codos y un tercio, inundando fincas y casi toda la orilla este {cite:muntazam-ibn-al-jawzi p. 649}."
  fr: "En 337, les Bagdadiens paniquèrent la nuit pendant des jours à cause d'un animal imaginé sur les toits — tantôt un loup, tantôt autre chose — commençant à Suq al-Thalatha' et se propageant des deux côtés; et le lundi deux nuits avant la fin du Ramadan, le Tigre atteignit vingt et un coudées et un tiers, inondant des propriétés et presque toute la rive est {cite:muntazam-ibn-al-jawzi p. 649}."
  ur: "337 میں بغدادی چھتوں پر تصور کیے جانے والے ایک جانور سے کئی دن تک رات کو گھبراتے رہے — اب ایک بھیڑیا، اب کچھ اور — سوق الثلاثہ سے شروع ہوا اور دونوں طرف پھیل گیا۔ اور سوموار کو رمضان المبارک کے اختتام سے دو راتیں پہلے دجلہ اکیس تیس ہاتھ پر چڑھا، ڈوبنے والی املاک اور تقریباً پورا مشرقی کنارہ {حوالہ: منتظر ابن الجوزی ص۔ 649}۔"
  tr: "Hicri 337 yılında insanlar geceleri korkuya kapılıp nöbet tuttular ve çatılarına bir hayvanın çıktığını hayal ettiler. Bazen kurt, bazen de başka bir şey olduğunu düşündüler. Bu durum günlerce sürdü, sonra sakinleştiler. Bu olay salı pazarında başladı ve sonra her iki tarafa da yayıldı. Ramazan'ın bitimine iki gece kala, Pazartesi günü Dicle nehri yirmi bir buçuk arşın yükseldi, böylece nehir üzerindeki tarlalar ve evler sular altında kaldı, doğu tarafı da sular altında kalmak üzereydi ve insanlar oradan kaçmak üzereydiler. {cite:muntazam-ibn-al-jawzi s. 649}"
  id: "Pada tahun 337 Hijriah, orang-orang ketakutan di malam hari dan berjaga-jaga, dan mereka membayangkan seekor binatang muncul di atap rumah mereka. Terkadang mereka mengira itu serigala dan terkadang sesuatu yang lain. Mereka tetap dalam keadaan itu selama beberapa hari, kemudian mereka tenang. Kejadian itu dimulai di pasar hari Selasa dan kemudian menyebar ke kedua sisi. Pada hari Senin, dua malam sebelum berakhirnya Ramadan, Sungai Tigris naik hingga dua puluh satu sepertiga hasta, sehingga ladang dan rumah-rumah di tepi sungai terendam banjir, dan sisi timur hampir terendam, dan orang-orang hampir mengungsi. {cite:muntazam-ibn-al-jawzi p. 649}"
