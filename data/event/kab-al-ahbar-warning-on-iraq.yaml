id: event/kab-al-ahbar-warning-on-iraq
class: event
kind: other
label:
  ar: "كعب الأحبار يحذر عمر من الخروج إلى العراق"
  en: "Ka'b al-Ahbar warns Umar against going out to Iraq"
  ur: "کعب الاحبار عمر کو عراق جانے سے خبردار کرتے ہیں"
summary:
  ar: "بلغ مالكا أن عمر بن الخطاب أراد الخروج إلى العراق فقال له كعب الأحبار لا تخرج إليها يا أمير المؤمنين فإن بها تسعة أعشار السحر وبها فسقة الجن وبها الداء العضال ويرى المحقق أن الأثر منقطع لا يصح {cite:muwatta-maruf-1997} [[passage/muwatta-31-2795|الموطأ 31:2795]]."
  en: "It reached Malik that Umar ibn al-Khattab intended to go out to Iraq, and Ka'b al-Ahbar said to him: do not go out to it, Commander of the Faithful, for nine-tenths of sorcery is in it, and in it are the wicked of the jinn and the incurable disease; the muhaqqiq holds the report is munqati' and does not stand {cite:muwatta-maruf-1997} [[passage/muwatta-31-2795|Muwatta 31:2795]]."
  ur: "مالک کو اطلاع ملی کہ عمر بن الخطاب عراق جانے کا ارادہ رکھتے ہیں تو کعب الاحبار نے ان سے کہا: وہاں مت جاؤ اے امیر المومنین، کیونکہ وہاں جادو کا نواں حصہ ہے، وہاں جن کے فاسق ہیں اور وہاں لاعلاج بیماری ہے؛ محقق کہتے ہیں یہ اثر منقطع ہے اور درست نہیں {cite:muwatta-maruf-1997} [[passage/muwatta-31-2795|موطأ 31:2795]]۔"
