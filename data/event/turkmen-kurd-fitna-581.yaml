summary:
  ar: "في سنة إحدى وثمانين وخمسمائة ابتدأت فتنة بين التركمان والأكراد بديار الجزيرة والموصل وديار بكر وخلاط والشام وشهرزور وأذربيجان قتل فيها من الخلق ما لا يحصى ودامت عدة سنين وتقطعت الطرق ونهبت الأموال وأريقت الدماء، وسببها أن امرأة تركمانية تزوجت فاجتازت العرس بقلعة من الزوزان الأكراد فطلب أهلها وليمة العرس فامتنعوا فقتل صاحب القلعة الزوج، فهاجت الفتنة وثار الفريقان بعضهم على بعض وتفاقم الشر، حتى جمع مجاهد الدين قايماز رؤساء الطائفتين وأصلح بينهم وأعطاهم الخلع والأموال فانقطعت {cite:kamil-ibn-al-athir p. 136}."
