label: { ar: "الفتنة بين التركمان والأكراد", en: "The Strife between the Turkmens and the Kurds", es: "El conflicto entre turcomanos y kurdos", fr: "Le conflit entre les Turkmènes et les Kurdes", ur: "ترکمانوں اور کردوں کے درمیان لڑائی", tr: "Türkmenler ve Kürtler arasındaki çatışma", id: "Konflik antara Turkmenistan dan Kurdi" }
summary:
  ar: "في سنة إحدى وثمانين وخمسمائة ابتدأت فتنة بين التركمان والأكراد بديار الجزيرة والموصل وديار بكر وخلاط والشام وشهرزور وأذربيجان قتل فيها من الخلق ما لا يحصى ودامت عدة سنين وتقطعت الطرق ونهبت الأموال وأريقت الدماء، وسببها أن امرأة تركمانية تزوجت فاجتازت العرس بقلعة من الزوزان الأكراد فطلب أهلها وليمة العرس فامتنعوا فقتل صاحب القلعة الزوج، فهاجت الفتنة وثار الفريقان بعضهم على بعض وتفاقم الشر، حتى جمع مجاهد الدين قايماز رؤساء الطائفتين وأصلح بينهم وأعطاهم الخلع والأموال فانقطعت {cite:kamil-ibn-al-athir p. 136}."
  en: "In 581 AH a strife broke out between the Turkmens and the Kurds in al-Jazira, Mosul, Diyar Bakr, Khilat, al-Sham, Shahrazur and Azerbaijan. Countless people were killed, it lasted several years, the roads were cut, property was plundered and blood was shed. Its cause: a Turkmen woman was married, and her wedding procession passed a fortress of the Kurdish Zawzan; her people asked for a wedding feast and were refused, and the lord of the fortress killed the groom. The strife then flared, the two sides turned on one another and the evil grew, until Mujahid al-Din Qaymaz gathered the leaders of both groups, reconciled them, and gave them robes and money, and it ended {cite:kamil-ibn-al-athir p. 136}."
  es: "En el año 581 de la Hégira, estalló una contienda entre turcomanos y kurdos en al-Jazira, Mosul, Diyarbakır, Khilat, al-Sham, Shahrazur y Azerbaiyán. Innumerables personas murieron, la contienda duró varios años, se cortaron caminos, se saquearon propiedades y se derramó sangre. La causa: una mujer turcomana se casó y su cortejo nupcial pasó por una fortaleza kurda de Zawzan; su familia solicitó un banquete nupcial, pero se le negó, y el señor de la fortaleza mató al novio. La contienda se intensificó, ambos bandos se enfrentaron y la violencia creció, hasta que Mujahid al-Din Qaymaz reunió a los líderes de ambos grupos, los reconcilió, les dio túnicas y dinero, y así terminó el conflicto {cita:kamil-ibn-al-athir, pág. 136}."
  fr: "En 581 AH, un conflit éclata entre Turkmènes et Kurdes en Jazira, à Mossoul, Diyar Bakr, au Califat, au Levant, à Shahrazur et en Azerbaïdjan. D'innombrables personnes furent tuées. Le conflit dura plusieurs années; les routes furent coupées, les biens pillés et le sang versé. La cause: une Turkmène se maria et son cortège nuptial passa devant une forteresse kurde, le Zawzan. Ses proches demandèrent un festin de noces, mais se virent refuser cette demande. Le seigneur de la forteresse fit alors assassiner le marié. Le conflit s'envenima, les deux camps s'affrontèrent et la violence s'aggrava, jusqu'à ce que Mujahid al-Din Qaymaz rassemble les chefs des deux groupes, les réconcilie et leur offre des vêtements et de l'argent. Le conflit prit alors fin (voir: Kamil ibn al-Athir, p. 136)."
  ur: "581 ہجری میں ترکمانوں اور کردوں کے درمیان الجزیرہ، موصل، دیار بکر، خلت، الشام، شہرازور اور آذربائیجان میں لڑائی چھڑ گئی۔ لاتعداد لوگ مارے گئے، یہ کئی سال تک جاری رہا، سڑکیں کاٹ دی گئیں، املاک لوٹی گئیں اور خون بہایا گیا۔ اس کی وجہ: ایک ترکمان خاتون شادی شدہ تھی، اور اس کی شادی کا جلوس کرد ذوزان کے قلعے سے گزرا۔ اس کے لوگوں نے شادی کی دعوت مانگی اور انکار کر دیا، اور قلعہ کے مالک نے دولہا کو مار ڈالا۔ پھر لڑائی بھڑک اٹھی، دونوں فریق ایک دوسرے پر ہو گئے اور فساد بڑھتا گیا، یہاں تک کہ مجاہد الدین قائم نے دونوں گروہوں کے قائدین کو اکٹھا کیا، ان میں صلح کرائی، اور انہیں کپڑے اور پیسے دیے، اور یہ ختم ہو گیا۔ 136}۔"
  tr: "Hicri 581 yılında, Cezire, Musul, Diyarbakır, Hilat, Şam, Şahrazur ve Azerbaycan topraklarında Türkmenler ve Kürtler arasında sayısız insanın öldürüldüğü bir çatışma başladı. Birkaç yıl süren bu çatışmada yollar kesildi, para yağmalandı ve kan döküldü. Bunun sebebi, bir Türkmen kadının evlenip Zozan Kürtlerinin kalesinden geçmesiydi. Ailesi düğün yemeği istedi, ancak Kürtler reddetti. Bunun üzerine kale sahibi kocayı öldürdü. Çatışma alevlendi ve iki taraf birbirine karşı ayaklandı. Kötülük daha da arttı. Sonunda Mücahid Din Kaymaz, iki grubun liderlerini bir araya getirip onları uzlaştırdı, onlara şeref elbiseleri ve para verdi ve çatışma sona erdi. {Kaynak: Kamil İbn el-Ashir, s. 136}"
  id: "Pada tahun 581 Hijriah, konflik dimulai antara Turkmenistan dan Kurdi di wilayah Al-Jazira, Mosul, Diyar Bakr, Khilat, Al-Sham, Shahrazur, dan Azerbaijan, yang mengakibatkan banyak korban jiwa. Konflik berlangsung selama beberapa tahun, jalan-jalan terputus, uang dijarah, dan darah tertumpah. Penyebabnya adalah seorang wanita Turkmenistan menikah dan melewati benteng Kurdi Zozan. Keluarganya meminta pesta pernikahan, tetapi mereka menolak, sehingga pemilik benteng membunuh suaminya. Konflik pun berkobar, dan kedua pihak saling menyerang, dan kejahatan semakin memburuk, hingga Mujahid al-Din Qaymaz mengumpulkan para pemimpin kedua kelompok dan mendamaikan mereka serta memberi mereka jubah kehormatan dan uang, dan konflik pun berakhir. {cite:kamil-ibn-al-athir hlm. 136}."
