label: { ar: "الفتنة بين التركمان والأكراد", en: "The Strife between the Turkmens and the Kurds" }
summary:
  ar: "في سنة إحدى وثمانين وخمسمائة ابتدأت فتنة بين التركمان والأكراد بديار الجزيرة والموصل وديار بكر وخلاط والشام وشهرزور وأذربيجان قتل فيها من الخلق ما لا يحصى ودامت عدة سنين وتقطعت الطرق ونهبت الأموال وأريقت الدماء، وسببها أن امرأة تركمانية تزوجت فاجتازت العرس بقلعة من الزوزان الأكراد فطلب أهلها وليمة العرس فامتنعوا فقتل صاحب القلعة الزوج، فهاجت الفتنة وثار الفريقان بعضهم على بعض وتفاقم الشر، حتى جمع مجاهد الدين قايماز رؤساء الطائفتين وأصلح بينهم وأعطاهم الخلع والأموال فانقطعت {cite:kamil-ibn-al-athir p. 136}."
  en: "In 581 AH a strife broke out between the Turkmens and the Kurds in al-Jazira, Mosul, Diyar Bakr, Khilat, al-Sham, Shahrazur and Azerbaijan. Countless people were killed, it lasted several years, the roads were cut, property was plundered and blood was shed. Its cause: a Turkmen woman was married, and her wedding procession passed a fortress of the Kurdish Zawzan; her people asked for a wedding feast and were refused, and the lord of the fortress killed the groom. The strife then flared, the two sides turned on one another and the evil grew, until Mujahid al-Din Qaymaz gathered the leaders of both groups, reconciled them, and gave them robes and money, and it ended {cite:kamil-ibn-al-athir p. 136}."
