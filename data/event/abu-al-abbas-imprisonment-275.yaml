label: { ar: "حبس أبي أحمد ابنه أبا العباس المعتضد", en: "Abu Ahmad Imprisons His Son Abu al-Abbas al-Mu'tadid" }
summary:
  ar: "في سنة خمس وسبعين ومائتين حبس أبو أحمد الموفق ابنه أبا العباس — وهو المعتضد بالله لاحقًا — فشغب أصحابه وحملوا السلاح وركب غلمانه واضطربت بغداد لذلك، فركب أبو أحمد حتى بلغ الرصافة وقال لأصحاب أبي العباس وغلمانه: «ما شأنكم؟ أترونكم أشفق على ابني مني؟ هو ولدي واحتجت إلى تقويمه»، فانصرفوا، وكان ذلك يوم الثلاثاء لست خلون من شوال {cite:muntazam-ibn-al-jawzi p. 98}."
  en: "In 275 al-Muwaffaq imprisoned his son Abu'l-Abbas — the future caliph al-Mu'tadid — and the prince's men and ghilman armed and riotous filled Baghdad until al-Muwaffaq rode out to al-Rusafa and told them: 'What is with you? Do you think you have more pity on my son than I? He is my son and I needed to discipline him' — and they dispersed, on Tuesday 6 Shawwal {cite:muntazam-ibn-al-jawzi p. 98}."
