id: event/al-hadi-at-al-haira-seizes-the-offenders-and-goes-by-khiwan-to-athafit-288
class: event
kind: other
label:
  ar: "الهادي بالحائرة يأتي بالمحدثين ثم يمر بخيوان إلى أثافت، محرم 288هـ"
  en: "Al-Hadi at al-Ha'ira seizes the offenders and goes by Khaywan to Athafit, Muharram 288 AH"
  ur: "ہادی الحائرہ میں مجرموں کو پکڑواتے ہیں اور خیوان سے ہو کر اثافت جاتے ہیں، محرم 288ھ"
  es: "Al-Hadi, en Al-Ha'ira, captura a los infractores y se dirige por Khaywan a Athafit, Muharram 288 AH."
  fr: "Al-Hadi, à al-Ha'ira, arrête les contrevenants et passe par Khaywan pour se rendre à Athafit, le 1er Muharram 288 AH."
  tr: "Al-Haira'daki Al-Hadi, hadis âlimlerini bir araya getiriyor, ardından Hayvan'dan geçerek Athafat'a ulaşıyor. Muharrem 288 Hicri."
  id: "Al-Hadi, di Al-Ha'ira, membawa para ulama hadits, kemudian melewati Khaywan ke Athafat, Muharram 288 H."
summary:
  ar: "ينزل الهادي بالحائرة من بلاد همدان ويطلب المحدثين الذين تعرضوا للحجاج، ويقيم يومين على غير ماء ولا علف، ثم يوثقهم بالحديد ويسير بهم إلى خيوان فيصلها يوم الأربعاء، ثم يخرج يوم الأحد لتسع خلون من المحرم إلى أثافت بعد أن سبقه ابنه أبو القاسم."
  en: "Al-Hadi halts at al-Ha'ira in Hamdan's land and has the offenders who had molested pilgrims brought, waits two days without water or fodder, then has them bound in iron and takes them to Khaywan, arriving on a Wednesday, and on the Sunday nine nights into Muharram goes on to Athafit, his son Abu al-Qasim having gone ahead."
  ur: "ہادی ہمدان کی سرزمین میں الحائرہ پر ٹھہرتے ہیں اور حاجیوں سے چھیڑ چھاڑ کرنے والے مجرموں کو بلواتے ہیں، دو دن بغیر پانی اور چارے کے انتظار کرتے ہیں، پھر انہیں لوہے میں جکڑ کر خیوان لے جاتے ہیں جہاں بدھ کو پہنچتے ہیں، اور محرم کی نو راتیں گزرنے پر اتوار کو اثافت جاتے ہیں جبکہ ان کے بیٹے ابو القاسم پہلے جا چکے تھے۔"
  es: "Al-Hadi se detiene en al-Ha'ira, en la tierra de Hamdan, y hace traer a los delincuentes que habían agredido a los peregrinos. Espera dos días sin agua ni forraje, luego los hace atar con hierros y los lleva a Khaywan, llegando un miércoles. El domingo, nueve noches después del comienzo de Muharram, continúa su viaje hacia Athafit, habiéndose adelantado su hijo Abu al-Qasim."
  fr: "Al-Hadi s'arrête à al-Ha'ira, sur les terres de Hamdan, et fait amener les agresseurs qui ont molesté les pèlerins. Il attend deux jours sans eau ni fourrage, puis les fait enchaîner avec du fer et les emmène à Khaywan, où il arrive un mercredi. Le dimanche des neuf nuits de Muharram, il se rend à Athafit, son fils Abu al-Qasim l'ayant précédé."
  tr: "El-Hadi, Hamdan bölgesinden El-Hairah'a iner ve hacılara saldıran hadis rivayetçilerini arar. İki gün susuz ve yemsiz kalır, sonra onları demirle bağlayıp Hayvan'a götürür ve çarşamba günü oraya ulaşır. Ardından, oğlu Ebu el-Kasım'ın kendisinden önce gittiği Athafit'e, Muharrem ayının dokuzuncu gününde, pazar günü gider."
  id: "Al-Hadi turun ke Al-Ha'irah dari tanah Hamdan dan mencari para perawi hadits yang menyerang para peziarah. Ia tinggal selama dua hari tanpa air atau makanan, kemudian ia mengikat mereka dengan besi dan membawa mereka ke Khaywan, tiba di sana pada hari Rabu. Kemudian ia berangkat pada hari Minggu, sembilan hari setelah Muharram, ke Athafit, setelah putranya Abu Al-Qasim mendahuluinya."
