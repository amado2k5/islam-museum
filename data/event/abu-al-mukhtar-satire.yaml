label: { ar: "قصيدة أبي المختار في عمال الأهواز", en: "Abu al-Mukhtar's Satire on the Ahwaz Officials", fr: "La satire d’Abu al-Mukhtar contre les administrateurs d’al-Ahwaz", es: "La sátira de Abu al-Mukhtar sobre los funcionarios de Ahwaz" }
summary:
  ar: "قال أبو المختار يزيد بن قبس بن يزيد الصعيق كلمة رفع فيها على عمال الأهواز إلى عمر بن الخطاب أبلغ أمير المؤمنين رسالة فأنت أمين الله في النهي والأمر فلا تدعن أهل الرساتيق والقرى يسفون مال الله في الأدم الوفر فأرسل إلى الحجاج فاعرف حسابه وأرسل إلى جزء وأرسل إلى بشر ولا تنسين النافعين كليهما ولا ابن غلاب من سراة بني نصر وأرسل إلى النعمان واعرف حسابه وصهر بني غزوان إني لذو خبر وشبلاً فسله المال وابن محرش فقاسم عمر هؤلاء الذين ذكرهم أبو المختار شطر أموالهم حتى أخذ نعلاً وترك نعلاً وكان فيهم أبو بكرة فقال إني لم أل لك شيئاً فقال له أخوك على بيت المال وعشور الأبلة وهو يعطيك المال تتجر به فأخذ منه عشرة آلاف ويقال قاسمه شطر ماله."
  en: "Abu al-Mukhtar Yazid ibn Qabs al-Sa'iq raised his poem against the Ahwaz officials to Umar: 'Tell the Commander of the Faithful, God's trustee in command and ban — leave not the rustaq-folk and villagers who gulp God's wealth; send to al-Hajjaj and learn his account, to Juzz and to Bishr, forget neither Nafi', nor Ibn Ghallab of Nasr's lords, nor al-Nu'man, nor the Banu-Ghazwan son-in-law, ask Shibl for the money and Ibn Muharrish.' Umar mulcted every named man of half his wealth — till he took a sandal and left a sandal — and when Abu Bakra objected 'I left you nothing' came 'your brother holds the treasury and Ubulla's tithes and lends you capital': ten thousand was taken, or half his estate."
  fr: "Abu al-Mukhtar Yazid ibn Qabs al-Sa'iq présenta à Umar son poème contre les administrateurs d’al-Ahwaz : « Dis au Commandeur des croyants, dépositaire de Dieu pour ordonner et interdire : ne laisse pas les gens des rustaqs et des villages engloutir les biens de Dieu ; mande al-Hajjaj et examine ses comptes, puis Juzz et Bishr ; n’oublie ni Nafi', ni Ibn Ghallab parmi les seigneurs de Nasr, ni al-Nu'man, ni le gendre des Banu Ghazwan ; réclame l’argent à Shibl et à Ibn Muharrish ». Umar confisqua à chaque homme nommé la moitié de sa fortune, jusqu’à prendre une sandale et laisser l’autre ; à Abu Bakra qui objectait « je n’ai rien administré pour toi », il fut répondu : « ton frère tient le trésor et les dîmes d’al-Ubulla et te prête des capitaux ». Dix mille lui furent pris, ou la moitié de ses biens."
  es: "Abu al-Mukhtar Yazid ibn Qabs al-Sa'iq elevó su poema contra los funcionarios de Ahwaz a Umar: 'Dile al Comandante de los Creyentes, el administrador de Dios en el mando y la prohibición, que no deje a los campesinos y aldeanos que se tragan la riqueza de Dios; envía a al-Hajjaj y averigua su cuenta, a Juzz y a Bishr, no olvides ni a Nafi', ni a Ibn Ghallab de los señores de Nasr, ni a al-Nu'man, ni al yerno de Banu-Ghazwan, pide dinero a Shibl y a Ibn Muharrish'. Umar multó a cada hombre nombrado de la mitad de su riqueza, hasta que tomó una sandalia y dejó una sandalia, y cuando Abu Bakra objetó 'No te dejé nada', llegó 'tu hermano posee el tesoro y los diezmos de Ubulla y te presta capital': se tomaron diez mil, o la mitad de su patrimonio."
