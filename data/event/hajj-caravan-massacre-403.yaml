kind: massacre
label: { ar: "مذبحة فليتة بن القرى لركب الحج", en: "The Massacre of the Hajj Caravan by Fulayta ibn al-Qarri", es: "La masacre de la caravana Hajj de Fulayta ibn al-Qarri", fr: "Le massacre de la caravane du Hajj par Fulayta ibn al-Qarri", ur: "قافلہ حج کا قتل عام از فلیطہ ابن القری", tr: "Falita bin el-Kura'nın Hac kervanına karşı gerçekleştirdiği katliam.", id: "Pembantaian Falita bin al-Qura terhadap kafilah haji" }
summary:
  ar: "في سنة ثلاث وأربعمائة سبق بدويّ اسمه فليتة بن القرى الحاجّ في ستمائة إنسان من بني خفاجة قبيلته ففجّر الآبار وطرح الحنظل في مصانع البرمكي والريان وغورهما، فلما جاء الركب إلى العقبة حبسهم ومنعهم العبور إلا بخمسين ألف دينار، فلما ضعفوا وعطشوا هجم عليهم فسلّموا أنفسهم فاحتوى على الجمال بالأحمال فاستاقها، وهلك الركب بالعطش فقيل إنه هلك خمسة عشر ألف إنسان؛ فأمّر فخر الدولة الوزيرَ عليَّ بن مزيد فأدركهم بناحية البصرة فظفر بهم وقتل طائفة كثيرة وأسر والد فليتة والمشتر وأربعة عشر رجلاً، فعُطّشوا الأسرى على جانب دجلة يرون الماء ولا يُسقون حتى هلكوا {cite:shadharat-dhahab p. 166}."
  en: "In 403 the Bedouin Fulayta b. al-Qarri' of Banu Khafaja spoiled the wells and blocked the Hajj caravan at the pass until they paid fifty thousand dinars; when they weakened with thirst he fell on them — some fifteen thousand pilgrims died. Fakhr al-Dawla's vizier Ali b. Mazid overtook the raiders near Basra, took Fulayta's father and fourteen men, and left them to die of thirst within sight of the Tigris {cite:shadharat-dhahab p. 166}."
  es: "En el año 403, el beduino Fulayta b. al-Qarri' de Banu Khafaja saqueó los pozos y bloqueó la caravana del Hajj en el paso hasta que pagaron cincuenta mil dinares; cuando los peregrinos, debilitados por la sed, los atacó, provocando la muerte de unos quince mil. El visir de Fakhr al-Dawla, Ali b. Mazid, alcanzó a los asaltantes cerca de Basora, capturó al padre de Fulayta y a catorce hombres, y los dejó morir de sed a la vista del Tigris {cita: shadharat-dhahab p. 166}."
  fr: "En 403, le Bédouin Fulayta b. al-Qarri', de la tribu de Banu Khafaja, corrompit les puits et bloqua la caravane du Hajj au col, exigeant le paiement de cinquante mille dinars. Affaiblis par la soif, les pèlerins furent attaqués, causant la mort de près de quinze mille dinars. Le vizir Ali b. Mazid, de Fakhr al-Dawla, rattrapa les pillards près de Bassora, captura le père de Fulayta et quatorze hommes, et les abandonna à leur sort, morts de soif, à la vue du Tigre (cf. shadharat-dhahab, p. 166)."
  ur: "403 میں اعرابی فلائیتا بی۔ بنو خفجہ کے القری نے کنوئیں خراب کر دیے اور قافلہ حج کا راستہ روک دیا یہاں تک کہ پچاس ہزار دینار ادا کر دیے۔ جب وہ پیاس سے کمزور ہو گئے تو وہ ان پر گر پڑا - تقریباً پندرہ ہزار حاجی مر گئے۔ فخر الدولہ کے وزیر علی بی۔ مازید نے بصرہ کے قریب حملہ آوروں کو پیچھے چھوڑ دیا، فلیطہ کے والد اور چودہ آدمیوں کو لے لیا، اور انہیں دجلہ کی نظروں میں پیاس سے مرنے کے لیے چھوڑ دیا۔ 166}۔"
  tr: "403 yılında, Falita bin el-Kura adında bir Bedevi, kabilesi Beni Hafaca'dan altı yüz kişiyle birlikte hacıların önünde yola çıktı. Kuyuları havaya uçurdu ve Barmaki ile Rayyan'daki fabrikalara ve ovalarına zehirli bir madde attı. Kervan Akabe'ye vardığında, onları alıkoydu ve elli bin dinar dışında geçmelerine izin vermedi. Zayıf ve susuz kaldıklarında onlara saldırdı ve teslim oldular. Develeri yükleriyle birlikte ele geçirdi ve onları götürdü; kervan susuzluktan öldü. Rivayetlere göre on beş bin kişi öldü. Fahr el-Davla, vezir Ali bin Mazid'e Basra civarında onları yakalamasını emretti; Ali bin Mazid onları yakaladı, büyük bir grubu öldürdü ve Falita'nın babası el-Muşter ile on dört adamı esir aldı. Esirler Dicle nehrinin kıyısında susuz bırakıldılar; suyu gördüler ama susuzluğa kapılana kadar içmelerine izin verilmedi. {alıntı: shadharat-dhahab s. 166}"
  id: "Pada tahun 403, seorang Badui bernama Falita bin al-Qura mendahului para peziarah dengan enam ratus orang dari sukunya, Bani Khafaja. Ia meledakkan sumur-sumur dan melemparkan batu kolokint ke pabrik-pabrik al-Barmaki dan al-Rayyan serta dataran rendah mereka. Ketika kafilah tiba di al-Aqaba, ia menahan mereka dan mencegah mereka menyeberang kecuali dengan membayar lima puluh ribu dinar. Ketika mereka menjadi lemah dan haus, ia menyerang mereka dan mereka menyerah. Ia merebut unta-unta beserta muatannya dan mengusir mereka, dan kafilah tersebut binasa karena kehausan. Dikatakan bahwa lima belas ribu orang binasa. Fakhr al-Dawla memerintahkan menteri Ali bin Mazid untuk mengejar mereka di sekitar Basra dan menangkap mereka serta membunuh sebagian besar dari mereka dan menangkap ayah Falita, al-Mushtar, dan empat belas orang. Para tawanan dibiarkan kehausan di tepi sungai Tigris, mereka melihat air tetapi tidak diberi minum sampai mereka binasa. {cite:shadharat-dhahab p. 166}"
