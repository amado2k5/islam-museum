label: { ar: "نهب المدينة المنورة على يد عجلان بن ثابت", en: "Ajlan ibn Thabit's Sack of Medina", fr: "Sac de Médine par Ajlan ibn Thabit", es: "El saqueo de Medina por Ajlan ibn Thabit", ur: "عجلان بن ثابت کی بستی مدینہ" }
summary:
  ar: "في شذرات الذهب سنة تسع وعشرين وثمان مئة نهب المدينة المنورة عاملها عجلان بن ثابت لما بلغه أنه عزل بابن عمه حسن بن جماز وهدم أكثر بيوتها وحرق وسلم منه بيوت الرافضة وأقام قاضياً رافضياً بها يقال له الصيقل ولم يسلم منه من أرباب الخدم إلا القاضي الشافعي لأنه استجار بقريب لعجلان يقال له مانع فأجاره {cite:shadharat-dhahab p. 195-196}."
  en: "829: Medina's own governor Ajlan ibn Thabit, told he was being replaced by his cousin Hasan ibn Jammaz, plundered the city, demolished most of its houses and burned them, sparing only the Rafidi quarter and installing a Rafidi qadi named al-Sayqal {cite:shadharat-dhahab p. 195-196}."
  fr: "829 : le gouverneur de Médine Ajlan ibn Thabit, apprenant son remplacement par son cousin Hasan ibn Jammaz, pilla la ville, en démolit et brûla la plupart des maisons, épargnant seulement le quartier qualifié de rafidite par la source et installant un cadi de cette tendance nommé al-Sayqal {cite:shadharat-dhahab p. 195-196}."
  es: "829: El propio gobernador de Medina, Ajlan ibn Thabit, al enterarse de que sería reemplazado por su primo Hasan ibn Jammaz, saqueó la ciudad, demolió la mayoría de sus casas y las quemó, perdonando solo el barrio Rafidi e instalando un cadí Rafidi llamado al-Sayqal {cite:shadharat-dhahab p. 195-196}."
  ur: "829: مدینہ کے اپنے گورنر عجلان بن ثابت نے بتایا کہ اس کی جگہ اس کے چچا زاد بھائی حسن بن جماز کو لے جایا جا رہا ہے، اس نے شہر کو لوٹ لیا، اس کے زیادہ تر مکانات کو مسمار کر دیا اور انہیں جلا دیا، صرف رافدی کوارٹر کو بچا کر ایک رافضی قادی کا نام السیقل الذہبۃ الذہبۃ قائم کیا۔ 195-196}۔"
