id: event/fight-at-nuqm-in-dhu-al-qada-and-the-hakamis-commander-is-killed-288
class: event
kind: other
label:
  ar: "القتال عند نقم في ذي القعدة ومقتل قائد الحكمي، سنة 288هـ"
  en: "The fight at Nuqm in Dhu al-Qa'da and the death of al-Hakami's commander, 288 AH"
  ur: "ذی القعدہ میں نقم کے پاس لڑائی اور الحکمی کے سالار کا مارا جانا، 288ھ"
  es: "La batalla de Nuqm en Dhu al-Qa'da y la muerte del comandante de al-Hakami, 288 AH."
  fr: "Combat de Nuqm à Dhu al-Qa'da et mort du commandant d'al-Hakami, 288 AH"
  tr: "Hicri 288 yılında Zilhicce'deki Nakâm'da yaşanan çatışmalar ve Hakami komutanının öldürülmesi."
  id: "Pertempuran di Naqam pada bulan Dzul Qidah dan pembunuhan komandan Hakami, pada tahun 288 Hijriah."
summary:
  ar: "زحف القوم بعساكرهم يوم الأربعاء لاثني عشر يوماً من ذي القعدة إلى نقم فدخلت منهم جماعة القرية، فأخرج الهادي جماعة من درب الجبانة وجماعة من درب ابن زامرد وخرج هو من درب القطيع فهزمهم من القرية، واشتد القتال في الميسرة إلى صلاة العشاء ثم انهزموا وقُتل منهم جماعة فيهم قائد الحكمي."
  en: "On Wednesday, twelve days of Dhu al-Qa'da, the men advanced with their armies to Nuqm and a body of them entered the village; al-Hadi sent a party out by the Darb al-Jabbana and another by the Darb Ibn Zamarid and went out himself by the Darb al-Qutay', routing them from the village; the fighting was hard on the left until the evening prayer, then they were routed and a number were killed, among them the commander of al-Hakami's men."
  ur: "ذی القعدہ کے بارہ دن کو بدھ کے دن مخالف اپنے لشکروں کے ساتھ نقم کی طرف بڑھے اور ان کی ایک جماعت بستی میں داخل ہو گئی؛ ہادی نے ایک دستہ درب الجبانہ سے اور ایک درب ابن زامرد سے نکالا اور خود درب القطیع سے نکلے اور انہیں بستی سے بھگا دیا؛ بائیں بازو میں عشاء کی نماز تک سخت لڑائی ہوئی، پھر وہ شکست کھا گئے اور ان کے کئی آدمی مارے گئے جن میں الحکمی کا سالار تھا۔"
  es: "El miércoles doce días después de Dhu al-Qa'da, los hombres avanzaron con sus ejércitos hacia Nuqm y un grupo de ellos entró en la aldea; al-Hadi envió un grupo por el Darb al-Jabbana y otro por el Darb Ibn Zamarid y salió él mismo por el Darb al-Qutay', expulsándolos de la aldea; la lucha fue dura en el flanco izquierdo hasta la oración vespertina, entonces fueron derrotados y murieron varios, entre ellos el comandante de los hombres de al-Hakami."
  fr: "Le mercredi 12 Dhu al-Qa'da, les hommes avancèrent avec leurs armées vers Nuqm et un groupe d'entre eux entra dans le village; al-Hadi envoya un groupe par le Darb al-Jabbana et un autre par le Darb Ibn Zamarid et sortit lui-même par le Darb al-Qutay', les chassant du village; les combats furent acharnés sur la gauche jusqu'à la prière du soir, puis ils furent mis en déroute et un certain nombre furent tués, parmi lesquels le commandant des hommes d'al-Hakami."
  tr: "Halk, Zilhicce ayının on ikinci günü olan Çarşamba günü askerleriyle birlikte Nakâm'a yürüdü. Bir grup asker köye girdi, bunun üzerine Hadi, mezarlık yolundan ve İbn Zamard yolundan birer grup asker çıkardı, kendisi de sürü yolundan gelerek onları köyden püskürttü. Akşam namazına kadar sol kanatta çatışmalar şiddetlendi, ardından yenilgiye uğradılar ve Hakami'nin lideri de dahil olmak üzere bir grup asker öldürüldü."
  id: "Pada hari Rabu, tanggal 12 Dzul Qi'dah, orang-orang berbaris bersama pasukan mereka menuju Naqam. Sekelompok dari mereka memasuki desa, lalu al-Hadi membawa keluar sekelompok dari jalan pemakaman dan sekelompok dari jalan Ibnu Zamard, dan dia keluar dari jalan ternak dan mengalahkan mereka dari desa. Pertempuran semakin intensif di sayap kiri hingga waktu salat Maghrib, kemudian mereka dikalahkan dan sebagian dari mereka terbunuh, termasuk pemimpin al-Hakami."
