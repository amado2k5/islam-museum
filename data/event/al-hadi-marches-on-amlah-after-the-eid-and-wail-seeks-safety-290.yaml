id: event/al-hadi-marches-on-amlah-after-the-eid-and-wail-seeks-safety-290
class: event
kind: other
label:
  ar: "مسير الهادي إلى أملح بعد عيد الأضحى بأربعة أيام وطلب وائلة الأمان، ذو الحجة 290هـ"
  en: "Al-Hadi marches on Amlah four days after the Eid al-Adha and Wa'ila seek safety, Dhu al-Hijja 290 AH"
  ur: "عید الاضحیٰ کے چار دن بعد ہادی کی املح پر چڑھائی اور وائلہ کا امان مانگنا، ذوالحجہ 290ھ"
summary:
  ar: "أقام الهادي بصعدة إلى عيد العرفة وكانت وائلة قد عبثت في الطريق بأموال الناس ونفوسهم بحسب الراوي، فجمع عساكر من خولان وخرج بعد عيد الأضحى بأربعة أيام وبات بالحجر ثم غدا يريد أملح، فقاتلت ساقة العسكر وائلة في المضيق حتى طلع الخولانيون من الجبال فطردوهم، ونزل العسكر قرية أملح ونهب وخرّب المنازل والآبار وقطع النخيل والأعناب حتى طلبت وائلة الأمان فآمنهم ورجع إلى صعدة."
  en: "Al-Hadi stayed at Sa'da until the Eid, and Wa'ila had, according to the narrator, made trouble on the road with people's property and lives; he gathered armies of Khawlan and set out four days after the Eid al-Adha, spent the night at al-Hajar and went on toward Amlah, where the rear of the army fought Wa'ila in a narrow place until the Khawlanis came down from the mountains and drove them off, and the army halted at the village of Amlah, plundered, wrecked houses and wells and cut palms and vines until Wa'ila asked for safety, which he gave, and he went back to Sa'da."
  ur: "ہادی عید تک صعدہ میں رہے، اور راوی کے مطابق وائلہ نے راستے میں لوگوں کے مال اور جانوں کے ساتھ فساد کیا تھا؛ انہوں نے خولان کے لشکر جمع کیے اور عید الاضحیٰ کے چار دن بعد نکلے، الحجر میں رات گزاری اور املح کی طرف بڑھے، جہاں تنگ جگہ میں لشکر کے پچھلے حصے نے وائلہ سے لڑائی کی یہاں تک کہ خولانی پہاڑوں سے اتر آئے اور انہیں ہٹا دیا، پھر لشکر املح بستی میں اترا، لوٹ مار کی، گھر اور کنویں ڈھائے اور کھجور اور انگور کاٹے یہاں تک کہ وائلہ نے امان مانگی اور انہوں نے امان دی اور صعدہ لوٹ گئے۔"
