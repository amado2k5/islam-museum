id: event/allafi-revolt-makran
class: event
kind: revolt
label: { ar: "غلب العلافيين على ثغر مكران ووقعة سعيد بن أسلم", en: "The Allafis' Coup on the Makran Frontier", es: "El golpe de Estado de los Allafis en la frontera de Makrán", fr: "Le coup d'État des Allafis à la frontière du Makran" }
summary:
  ar: "لما ولى الحجاج بن يوسف العراق ولى سعيد بن أسلم بن زرعة الكلابي مكران وذلك الثغر فخرج عليه معاوية ومحمد ابنا الحارث العلافيان فقتل وغلب العلافيان على الثغر واسم علاف هو ربان بن حلوان بن عمران بن الحاف بن قضاعة وهو أبو جرم فولى الحجاج مجاعة بن سعر التميمي ذلك الثغر فغزا فغنم وفتح طوائف من قندابيل ثم أتم فتحها محمد بن القاسم ومات مجاعة بعد سنة بمكران ثم استعمل الحجاج بعد مجاعة محمد بن هارون بن ذرع النمري فأهدى إلى الحجاج في ولايته ملك جزيرة الياقوت نسوة ولدن في بلاده مسلمات ومات آباؤهن وكانوا تجاراً فأراد التقرب بهن."
  en: "Under al-Hajjaj, Sa'id ibn Aslam al-Kilabi held Makran's frontier till the Allafi brothers Mu'awiya and Muhammad, sons of al-Harith, rose and killed him — Allaf being Rabban ibn Hulwan of Quda'a, Abu Jurm. Al-Hajjaj then gave the thaghr to Mujja'a ibn Si'r al-Tamimi, who raided, took plunder, and opened parts of Qandabil — finished later by Muhammad ibn al-Qasim — dying in Makran within the year. His successor Muhammad ibn Harun al-Namari received, for al-Hajjaj, the king of Jazirat al-Yaqut's gift of Muslim-born women orphaned of merchant fathers."
  es: "Bajo el mando de al-Hajjaj, Sa'id ibn Aslam al-Kilabi controló la frontera de Makrán hasta que los hermanos Allafi, Mu'awiya y Muhammad, hijos de al-Harith, se alzaron y lo mataron. Allaf era Rabban ibn Hulwan de Quda'a, Abu Jurm. Al-Hajjaj entonces entregó el thaghr a Mujja'a ibn Si'r al-Tamimi, quien saqueó, se apoderó del territorio y abrió partes de Qandabil —que posteriormente fue completada por Muhammad ibn al-Qasim—, muriendo en Makrán antes de que terminara el año. Su sucesor, Muhammad ibn Harun al-Namari, recibió, en nombre de al-Hajjaj, el regalo del rey de Jazirat al-Yaqut: mujeres musulmanas huérfanas de padres comerciantes."
  fr: "Sous le règne d'al-Hajjaj, Sa'id ibn Aslam al-Kilabi contrôla la frontière du Makran jusqu'à ce que les frères allafites Mu'awiya et Muhammad, fils d'al-Harith, se soulèvent et le tuent – Allaf étant Rabban ibn Hulwan de Quda'a, Abu Jurm. Al-Hajjaj confia alors le thaghr à Mujja'a ibn Si'r al-Tamimi, qui mena des raids, pilla et ouvrit une partie de Qandabil – entreprise achevée plus tard par Muhammad ibn al-Qasim – avant de mourir au Makran dans l'année. Son successeur, Muhammad ibn Harun al-Namari, reçut, pour al-Hajjaj, le don du roi de Jazirat al-Yaqut: des femmes musulmanes orphelines de pères marchands."
