id: event/allafi-revolt-makran
class: event
kind: revolt
label: { ar: "غلب العلافيين على ثغر مكران ووقعة سعيد بن أسلم", en: "The Allafis' Coup on the Makran Frontier" }
summary:
  ar: "لما ولى الحجاج بن يوسف العراق ولى سعيد بن أسلم بن زرعة الكلابي مكران وذلك الثغر فخرج عليه معاوية ومحمد ابنا الحارث العلافيان فقتل وغلب العلافيان على الثغر واسم علاف هو ربان بن حلوان بن عمران بن الحاف بن قضاعة وهو أبو جرم فولى الحجاج مجاعة بن سعر التميمي ذلك الثغر فغزا فغنم وفتح طوائف من قندابيل ثم أتم فتحها محمد بن القاسم ومات مجاعة بعد سنة بمكران ثم استعمل الحجاج بعد مجاعة محمد بن هارون بن ذرع النمري فأهدى إلى الحجاج في ولايته ملك جزيرة الياقوت نسوة ولدن في بلاده مسلمات ومات آباؤهن وكانوا تجاراً فأراد التقرب بهن."
  en: "Under al-Hajjaj, Sa'id ibn Aslam al-Kilabi held Makran's frontier till the Allafi brothers Mu'awiya and Muhammad, sons of al-Harith, rose and killed him — Allaf being Rabban ibn Hulwan of Quda'a, Abu Jurm. Al-Hajjaj then gave the thaghr to Mujja'a ibn Si'r al-Tamimi, who raided, took plunder, and opened parts of Qandabil — finished later by Muhammad ibn al-Qasim — dying in Makran within the year. His successor Muhammad ibn Harun al-Namari received, for al-Hajjaj, the king of Jazirat al-Yaqut's gift of Muslim-born women orphaned of merchant fathers."
