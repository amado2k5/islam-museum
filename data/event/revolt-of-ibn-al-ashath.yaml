label: { ar: "ثورة ابن الأشعث على الحجاج", en: "The revolt of Ibn al-Ash'ath against al-Hajjaj", es: "La revuelta de Ibn al-Ash'ath contra al-Hajjaj", fr: "La révolte d'Ibn al-Ash'ath contre al-Hajjaj" }
summary:
  ar: "في سنة إحدى وثمانين اجتمع الناس إلى عبد الرحمن بن محمد بن الأشعث في خلع الحجاج بن يوسف، فكان أول من أعلن ذلك، وقال أحدهم إنه إذا خلع الحجاج فقد خُلع عبد الملك بن مروان الذي ولّاه {cite:tabari-tarikh-abu-al-fadl j.6 p.338}. وعنوان الخبر في فهرس الجزء السادس «خلاف ابن الأشعث على الحجاج» {cite:tabari-tarikh-abu-al-fadl j.6 p.628}. وعند المسعودي استعمل الحجاج عبد الرحمن بن محمد بن الأشعث على سجستان وبست والرخج فحارب من هنالك أنواعاً من الترك يقال لهم العوز والخلج ومن يلي تلك البلاد من ملوك الهند مثل رتبيل، فخلع طاعة الحجاج فكتب إليه عبد الملك لعمري لقد خلع طاعة الله بيمينه وسلطانه بشماله وخرج من الدين عرياناً {cite:muruj-al-dhahab p. 122-123} ويذكر الكتاب أن جيش الطواويس أُعدّ سنة 80هـ بتوجيه من الحجاج، وبلغ نحو أربعين ألفاً، عشرون ألفاً من الكوفة ومثلهم من البصرة، وأن الإنفاق عليه بلغ مليوني درهم سوى الأعطيات، وأن عبد الرحمن بن الأشعث اختير قائداً له. {cite:salabi-umayyad-state-2020 p.88}"
  en: "In 81 people gathered to 'Abd al-Rahman ibn Muhammad ibn al-Ash'ath to depose al-Hajjaj ibn Yusuf, and he was the first to declare it. One of them said that if al-Hajjaj was deposed, then 'Abd al-Malik ibn Marwan, who had appointed him, was deposed too {cite:tabari-tarikh-abu-al-fadl j.6 p.338}. The title of the report in the index to volume six is 'The dispute of Ibn al-Ash'ath with al-Hajjaj' {cite:tabari-tarikh-abu-al-fadl j.6 p.628}. According to al-Mas'udi, al-Hajjaj appointed 'Abd al-Rahman ibn Muhammad ibn al-Ash'ath over Sijistan, Bust and al-Rukhkhaj. He fought there against kinds of Turks called the Uzz and the Khalj, and against the kings of India who ruled those lands, such as Ratbil. He then renounced obedience to al-Hajjaj, and 'Abd al-Malik wrote to him: 'By my life, he has broken obedience to God with his right hand and to his authority with his left, and has gone out of religion naked' {cite:muruj-al-dhahab p. 122-123}. The book also mentions that the army of the Tawawis was readied in 80 AH on al-Hajjaj's orders and reached some forty thousand men, twenty thousand from Kufa and as many from Basra; that the outlay on it reached two million dirhams apart from the stipends; and that 'Abd al-Rahman ibn al-Ash'ath was chosen as its commander. {cite:salabi-umayyad-state-2020 p.88}"
  es: "En 81 personas se reunieron con 'Abd al-Rahman ibn Muhammad ibn al-Ash'ath para deponer a al-Hajjaj ibn Yusuf, y él fue el primero en declararlo. Uno de ellos dijo que si al-Hajjaj era depuesto, entonces 'Abd al-Malik ibn Marwan, quien lo había nombrado, también sería depuesto {cite:tabari-tarikh-abu-al-fadl j.6 p.338}. El título del informe en el índice del volumen seis es 'La disputa de Ibn al-Ash'ath con al-Hajjaj' {cite:tabari-tarikh-abu-al-fadl j.6 p.628}. Según al-Mas'udi, al-Hajjaj nombró a 'Abd al-Rahman ibn Muhammad ibn al-Ash'ath sobre Sijistan, Bust y al-Rukhkhaj. Allí luchó contra tribus turcas llamadas Uzz y Khalj, y contra los reyes de la India que gobernaban esas tierras, como Ratbil. Luego renunció a la obediencia a al-Hajjaj, y 'Abd al-Malik le escribió: «Por mi vida, ha quebrantado la obediencia a Dios con su mano derecha y a su autoridad con su izquierda, y ha abandonado la religión desnudo» {cite:muruj-al-dhahab p. 122-123}. El libro también menciona que el ejército de los Tawawis fue preparado en el año 80 AH por orden de al-Hajjaj y llegó a tener unos cuarenta mil hombres, veinte mil de Kufa y otros tantos de Basora; que el gasto ascendió a dos millones de dirhams sin contar los estipendios; y que 'Abd al-Rahman ibn al-Ash'ath fue elegido como su comandante. {cite:salabi-umayyad-state-2020 p.88}"
  fr: "En 81 ans, 'Abd al-Rahman ibn Muhammad ibn al-Ash'ath se rassembla pour destituer al-Hajjaj ibn Yusuf, et il fut le premier à le déclarer. L'un d'eux affirma que si al-Hajjaj était destitué, alors 'Abd al-Malik ibn Marwan, qui l'avait nommé, le serait également (Tabari Tarikh Abu al-Fadl, vol. 6, p. 338). Le titre de ce récit dans l'index du volume 6 est « La dispute d'Ibn al-Ash'ath avec al-Hajjaj » (Tabari Tarikh Abu al-Fadl, vol. 6, p. 628). Selon al-Mas'udi, al-Hajjaj avait nommé 'Abd al-Rahman ibn Muhammad ibn al-Ash'ath à la tête des provinces de Sijistan, Bust et al-Rukhkhaj. Il y combattit des tribus turques appelées les Uzz et les Khalj, ainsi que les rois de l'Inde qui régnaient sur ces terres, comme Ratbil. Il renonça ensuite à l'obéissance à al-Hajjaj, et 'Abd al-Malik lui écrivit: « Par ma vie, il a désobéi à Dieu de la main droite et à son autorité de la gauche, et il s'est éloigné de la religion sans scrupules » (cit.: Muruj-al-Dhahab, p. 122-123). L'ouvrage mentionne également que l'armée des Tawawis fut rassemblée en 80 AH sur ordre d'al-Hajjaj et comptait environ quarante mille hommes, dont vingt mille de Koufa et autant de Bassora; que les dépenses engagées s'élevèrent à deux millions de dirhams, sans compter les soldes; et que 'Abd al-Rahman ibn al-Ash'ath fut choisi comme commandant. {cite:salabi-umayyad-state-2020 p.88}"
