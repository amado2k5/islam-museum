id: event/revolt-of-ibn-al-ashath
class: event
kind: revolt
label: { ar: "ثورة ابن الأشعث على الحجاج", en: "The revolt of Ibn al-Ash'ath against al-Hajjaj" }
summary:
  ar: "في سنة إحدى وثمانين اجتمع الناس إلى عبد الرحمن بن محمد بن الأشعث في خلع الحجاج بن يوسف، فكان أول من أعلن ذلك، وقال أحدهم إنه إذا خلع الحجاج فقد خُلع عبد الملك بن مروان الذي ولّاه {cite:tabari-tarikh-abu-al-fadl j.6 p.338}. وعنوان الخبر في فهرس الجزء السادس «خلاف ابن الأشعث على الحجاج» {cite:tabari-tarikh-abu-al-fadl j.6 p.628}. وعند المسعودي استعمل الحجاج عبد الرحمن بن محمد بن الأشعث على سجستان وبست والرخج فحارب من هنالك أنواعاً من الترك يقال لهم العوز والخلج ومن يلي تلك البلاد من ملوك الهند مثل رتبيل، فخلع طاعة الحجاج فكتب إليه عبد الملك لعمري لقد خلع طاعة الله بيمينه وسلطانه بشماله وخرج من الدين عرياناً {cite:muruj-al-dhahab p. 122-123} ويذكر الكتاب أن جيش الطواويس أُعدّ سنة 80هـ بتوجيه من الحجاج، وبلغ نحو أربعين ألفاً، عشرون ألفاً من الكوفة ومثلهم من البصرة، وأن الإنفاق عليه بلغ مليوني درهم سوى الأعطيات، وأن عبد الرحمن بن الأشعث اختير قائداً له. {cite:salabi-umayyad-state-2020 p.88}"
  en: "In 81 people gathered to 'Abd al-Rahman ibn Muhammad ibn al-Ash'ath to depose al-Hajjaj ibn Yusuf, and he was the first to declare it. One of them said that if al-Hajjaj was deposed, then 'Abd al-Malik ibn Marwan, who had appointed him, was deposed too {cite:tabari-tarikh-abu-al-fadl j.6 p.338}. The title of the report in the index to volume six is 'The dispute of Ibn al-Ash'ath with al-Hajjaj' {cite:tabari-tarikh-abu-al-fadl j.6 p.628}. According to al-Mas'udi, al-Hajjaj appointed 'Abd al-Rahman ibn Muhammad ibn al-Ash'ath over Sijistan, Bust and al-Rukhkhaj. He fought there against kinds of Turks called the Uzz and the Khalj, and against the kings of India who ruled those lands, such as Ratbil. He then renounced obedience to al-Hajjaj, and 'Abd al-Malik wrote to him: 'By my life, he has broken obedience to God with his right hand and to his authority with his left, and has gone out of religion naked' {cite:muruj-al-dhahab p. 122-123}. The book also mentions that the army of the Tawawis was readied in 80 AH on al-Hajjaj's orders and reached some forty thousand men, twenty thousand from Kufa and as many from Basra; that the outlay on it reached two million dirhams apart from the stipends; and that 'Abd al-Rahman ibn al-Ash'ath was chosen as its commander. {cite:salabi-umayyad-state-2020 p.88}"
