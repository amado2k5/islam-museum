label: { ar: "ثورة ابن الأشعث على الحجاج" }
summary:
  ar: "في سنة إحدى وثمانين اجتمع الناس إلى عبد الرحمن بن محمد بن الأشعث في خلع الحجاج بن يوسف، فكان أول من أعلن ذلك، وقال أحدهم إنه إذا خلع الحجاج فقد خُلع عبد الملك بن مروان الذي ولّاه {cite:tabari-tarikh-abu-al-fadl j.6 p.338}. وعنوان الخبر في فهرس الجزء السادس «خلاف ابن الأشعث على الحجاج» {cite:tabari-tarikh-abu-al-fadl j.6 p.628}."
