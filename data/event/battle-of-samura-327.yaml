summary:
  ar: "الواقعة بين عبد الرحمن الناصر صاحب الأندلس في مائة ألف أو يزيدون وبين رذمير ملك الجلالقة عند سمورة في شوال سنة سبع وعشرين وثلاثمائة بعد الكسوف الذي كان في الشهر بثلاثة أيام، وكانت للمسلمين عليهم ثم أنابوا بعد أن حوصروا وأولجوا إلى المدينة فقتل منهم بعد عبورهم الخندق نحو خمسين ألفاً، وقيل إن أمية بن إسحاق منع رذمير من طلب من نجا منهم وخوفه الكمين ورغبه فيما في المعسكر من الأموال، ثم جهز عبد الرحمن عساكره إلى الجلالقة فهلك فيها منهم ضعف ما قتل من المسلمين {cite:muruj-al-dhahab p. 359-360}."
  en: "al-Nasir's hundred-thousand-strong expedition against king Rudhmir of the Jalaliqa at Samura in Shawwal 327, three days after the month's eclipse — initially a Muslim victory, it turned when the besieged sortied and killed some fifty thousand after they had crossed the ditch; Umayya ibn Ishaq supposedly dissuaded Rudhmir from pursuing the survivors {cite:muruj-al-dhahab p. 359-360}."
