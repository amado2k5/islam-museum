class: event
kind: other
label: { ar: "الراضي يفضل لعب الصولي بالشطرنج على الزهر", en: "Al-Radi prefers al-Suli's chess to a garden's flowers", ur: "راضی کا صولی کی شطرنج کو پھول سے بہتر کہنا", es: "Al-Radi prefiere el ajedrez de al-Suli a las flores de un jardín.", fr: "Al-Radi préfère les échecs d'al-Suli aux fleurs d'un jardin." }
summary:
  ar: "رأى الراضي بستاناً مونقاً في بعض متنزهاته، فسأل ندماءه هل رأوا أحسن منه، فأثنوا عليه؛ فقال إن لعب الصولي بالشطرنج أحسن من هذا الزهر وكل ما وصفوا {cite:muruj-al-dhahab p. 677}."
  en: "Al-Radi, in one of his gardens, asked his companions whether they had seen anything finer; they praised the garden, and he said that al-Suli's chess-playing was finer than those flowers and all they described {cite:muruj-al-dhahab p. 677}."
  ur: "راضی نے اپنے ایک باغ میں اپنے ندیموں سے پوچھا کہ کیا اس سے بہتر کوئی منظر دیکھا ہے؛ انہوں نے باغ کی تعریف کی تو اس نے کہا کہ صولی کی شطرنج ان پھولوں اور ان کی بیان کردہ ہر چیز سے بہتر ہے {cite:muruj-al-dhahab p. 677}."
  es: "Al-Radi, en uno de sus jardines, preguntó a sus compañeros si habían visto algo más hermoso; ellos elogiaron el jardín, y él dijo que el juego de ajedrez de al-Suli era más hermoso que esas flores y todo lo que describían {cite:muruj-al-dhahab p. 677}."
  fr: "Al-Radi, dans l'un de ses jardins, demanda à ses compagnons s'ils avaient vu quelque chose de plus beau; ils louèrent le jardin, et il dit que le jeu d'échecs d'al-Suli était plus beau que ces fleurs et tout ce qu'ils décrivaient {cite:muruj-al-dhahab p. 677}."
