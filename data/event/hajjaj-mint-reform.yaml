summary:
  ar: "ضرب الحجاج الدراهم آخر سنة ٧٥ ثم أمر بضربها في جميع النواحي سنة ٧٦ وقال عوانة بن الحكم إن الحجاج سأل عما كانت الفرس تعمل به في ضرب الدراهم فاتخذ دار ضرب وجمع فيها الطباعين فكان يضرب المال للسلطان مما يجتمع له من التبر وخلاصة الزيوف والستوقة والبهرجة ثم أذن للتجار وغيرهم في أن تضرب لهم الأوراق واستغلها من فضول الأجرة وختم أيدي الطباعين وضرب دراهم علية كتب عليها بسم الله الحجاج ثم كتب عليها بعد سنة الله أحد الله الصمد فكرهها الفقهاء فسميت مكروهة ويقال إن الأعاجم كرهوا نقصانها وسميت السميرية بأول من ضربها واسمه سمير وكان مصعب قد ضرب الدراهم بأمر عبد الله بن الزبير سنة ٧٠ على ضرب الأكاسرة وعليها بركة وعافية فلما كان الحجاج غيرها وروي عن هشام بن الكلبي أن مصعباً ضرب مع الدراهم دنانير أيضاً وأن الحارث بن عبد الله بن أبي ربيعة المخزومي ضرب وزن سبعة أيام ابن الزبير وقال ابن أبي الزناد عن أبيه إن عبد الملك أول من ضرب الذهب عام الجماعة سنة ٧٤ وقال أبو الزبير الناقد ضرب عبد الملك شيئاً من الدنانير سنة ٧٢ ثم ضربها سنة ٧٥ فلما ولي عمر بن هبيرة العراق خلص الفضة أبلغ من تخليص من قبله وجود الدراهم واشتد في الغيار ثم ولي خالد بن عبد الله القسري فاشتد في النقود أكثر ثم ولي يوسف بن عمر فأفرط في الشدة على الطباعين وأصحاب الغيار وقطع الأيدي وضرب الأبشار فكانت الهبيرية والخالدية واليوسفية أجود نقود بني أمية ولم يكن المنصور يقبل في الخراج من نقود بني أمية غيرها فسمت الدراهم الأولى مكروهة."
  en: "Al-Hajjaj struck dirhams at the end of 75h and ordered them struck in all regions in 76h. 'Awana ibn al-Hakam: he asked how the Persians struck dirhams, took a mint-house, gathered the minters, struck the sultan's money from bullion and the purifications of zuyuf, sattuqa and bahraja, then licensed merchants' sheets for a fee and sealed the minters' hands. He struck 'ali dirhams marked 'bismillah, al-Hajjaj', then 'God is one, God the eternal' — the jurists disliked them and they were called makruha, or so the Ajam called them for their short weight; the Sumayriyya were named for their first striker. Mus'ab had struck dirhams by Ibn al-Zubayr's order in 70h on the Kisra-type marked 'baraka wa-'afiya' — al-Hajjaj altered them — and, per Ibn al-Kalbi, dinars too; al-Harith ibn Abdallah ibn Abi Rabi'a struck wazn-sab'a in Ibn al-Zubayr's days. Abd al-Malik first struck gold after the Year of Union, 74h (some dinars in 72, then 75). Then Umar ibn Hubayra refined the silver beyond his predecessors and bore hard on the changers; Khalid al-Qasri harder; Yusuf ibn Umar hardest — cut hands and flogged backs — so the Hubayriyya, Khalidiyya and Yusufiyya were the best Umayyad coin, the only Umayyad dirhams al-Mansur accepted for kharaj, whence the first dirhams were called makruha."
  es: "Al-Hajjaj acuñó dirhams al final del año 75 h y ordenó que se acuñaran en todas las regiones en el año 76 h. 'Awana ibn al-Hakam: preguntó cómo los persas acuñaban dirhams, tomó una casa de moneda, reunió a los acuñadores, acuñó el dinero del sultán a partir de lingotes y las purificaciones de zuyuf, sattuqa y bahraja, luego autorizó hojas de comerciantes por una tarifa y selló las manos de los acuñadores. Acuñó 'ali dirhams marcados 'bismillah, al-Hajjaj', luego 'Dios es uno, Dios el eterno'; a los juristas no les gustaban y los llamaban makruha, o así los llamaban los Ajam por su peso corto; los Sumayriyya recibieron su nombre de su primer acuñador. Mus'ab había acuñado dirhams por orden de Ibn al-Zubayr en el año 70 h en el tipo Kisra marcado 'baraka wa-'afiya' —al-Hajjaj los alteró— y, según Ibn al-Kalbi, también dinares; al-Harith ibn Abdallah ibn Abi Rabi'a acuñó wazn-sab'a en los días de Ibn al-Zubayr. Abd al-Malik acuñó oro por primera vez después del Año de la Unión, 74 h (algunos dinares en el 72, luego en el 75). Luego Umar ibn Hubayra refinó la plata más allá de sus predecesores y presionó duramente a los cambiadores; Khalid al-Qasri más duro; Yusuf ibn Umar era el más duro —les cortaba las manos y les azotaba la espalda— por lo que la Hubayriyya, la Khalidiyya y la Yusufiyya eran las mejores monedas omeyas, los únicos dirhams omeyas que al-Mansur aceptaba para kharaj, de donde los primeros dirhams fueron llamados makruha."
  fr: "Al-Hajjaj fit frapper des dirhams à la fin de l'an 75 et ordonna leur frappe dans toutes les régions en l'an 76. 'Awana ibn al-Hakam s'enquit de la méthode de frappe des dirhams persans, prit un atelier monétaire, réunit les frappeurs, frappa la monnaie du sultan à partir de lingots et procéda aux purifications de zuyuf, sattuqa et bahraja, puis délivra des licences aux marchands moyennant une redevance et scella les mains des frappeurs. Il frappa des dirhams 'ali portant la mention « Bismillah, al-Hajjaj », puis « Dieu est unique, Dieu l'Éternel »; les juristes les désapprouvèrent et les qualifièrent de makruha, ou du moins les Ajam les appelèrent ainsi en raison de leur faible poids; les Sumayriyya tirent leur nom de leur premier frappeur. Mus'ab avait frappé des dirhams sur ordre d'Ibn al-Zubayr en 70 H sur le type Kisra marqué « baraka wa-'afiya » — al-Hajjaj les modifia — et, selon Ibn al-Kalbi, des dinars également; al-Harith ibn Abdallah ibn Abi Rabi'a frappa des wazn-sab'a du temps d'Ibn al-Zubayr. Abd al-Malik frappa pour la première fois de l'or après l'An de l'Union, en 74 H (quelques dinars en 72, puis en 75). Ensuite, Umar ibn Hubayra affina l'argent mieux que ses prédécesseurs et exerça une forte pression sur les changeurs; Khalid al-Qasri encore plus. Yusuf ibn Umar était le plus dur — il coupait les mains et fouettait le dos — c'est pourquoi les Hubayriyya, Khalidiyya et Yusufiyya étaient les meilleures pièces de monnaie omeyyades, les seuls dirhams omeyyades qu'al-Mansur acceptait pour le kharaj, d'où les premiers dirhams furent appelés makruha."
  ur: "الحجاج نے 75ھ کے آخر میں درہم مارے اور 76ھ میں تمام علاقوں میں مارنے کا حکم دیا۔ عوانہ ابن الحکم: اس نے پوچھا کہ کس طرح فارسیوں نے درہم مارے، پودینہ کا گھر لیا، ٹکسال جمع کیے، سلطان کی رقم کو بلین سے مارا اور ضعیف، ستوقہ اور بہرجہ کی صفائی کی، پھر تاجروں کی چادروں کو فیس کے لیے لائسنس دیا اور ہاتھوں پر مہر لگا دی۔ اس نے علی درہم کو 'بسم اللہ، الحجاج' کے ساتھ مارا، پھر 'خدا ایک ہے، خدا ابدی ہے' - فقہاء نے انہیں ناپسند کیا اور انہیں مکروہ کہا، یا پھر عجم نے ان کے مختصر وزن کی وجہ سے انہیں کہا؛ سمیریا کو ان کے پہلے اسٹرائیکر کے لیے نامزد کیا گیا تھا۔ مصعب نے 70ھ میں ابن الزبیر کے حکم سے کسریٰ قسم کے 'برکا وافیہ' پر درہم مارے تھے - الحجاج نے ان میں تبدیلی کی - اور ابن الکلبی کے مطابق، دینار بھی۔ حارث بن عبداللہ ابن ابی ربیعہ نے ابن الزبیر کے زمانے میں وازن سبع کو مارا۔ عبد الملک نے سب سے پہلے 74ھ ⁦(72 میں کچھ دینار، پھر 75)⁩ کے بعد سونا مارا۔ پھر عمر بن ہبیرہ نے چاندی کو اپنے پیشرووں سے زیادہ بہتر کیا اور بدلنے والوں پر سختی کی۔ خالد القصری سخت; یوسف بن عمر نے سب سے مشکل ہاتھ کاٹے اور پیٹھ کوڑے مارے - چنانچہ حبیریہ، خالدیہ اور یوسفیہ بہترین اموی سکہ تھے، صرف اموی درہم المنصور نے خرج کے لیے قبول کیا، اسی لیے پہلے درہم کو مکروہ کہا گیا۔"
  tr: "Haccac, Hicri 75 yılının sonunda dirhem bastırdı ve Hicri 76 yılında tüm bölgelerde basılmasını emretti. Evane ibn el-Hakam, Haccac'ın Perslerin dirhem basma yöntemlerini araştırdığını, bunun üzerine bir darphane kurup darphanecileri oraya topladığını söyledi. Sultan için altından, en kaliteli sahte paralardan ve en kaliteli yaldızlı paralardan bastı. Daha sonra tüccarlara ve diğerlerine banknot bastırma izni verdi ve fazla ücretlerden kâr elde etti. Darphanecilerin ellerini mühürledi ve üzerine \"Allah'ın adıyla, Haccac\" ve daha sonra \"Allah'ın yılından sonra, bir olan, ebedi olan, mutlak olan\" yazılı yüksek kaliteli dirhemler bastı. Fıkıhçılar bunu beğenmediler, bu yüzden \"hoş görülmeyen\" olarak adlandırıldı. Rivayetlere göre, Arap olmayanlar bu paranın değer kaybından hoşlanmamış ve ilk basan kişi olan Samir'in adından dolayı \"el-Samiriye\" olarak adlandırılmıştır. Mus'ab, Hicri 70 yılında Abdullah ibn el-Zubayr'ın emriyle Sasani krallarının tarzını izleyerek dirhem basmış ve bu paralar bereket ve hayırlı şans getirmiştir. El-Haccac iktidara geldiğinde ise bu paraları değiştirmiştir. Hişam ibn el-Kalbi'den rivayet edildiğine göre, Mus'ab dirhemlerin yanı sıra dinar da basmış ve el-Harith ibn Abdullah ibn Abi Rabi'ah el-Makhzumi, İbn el-Zubayr'ın yedi günlük basımına denk gelen miktarda dinar basmıştır. İbn Abi el-Zinad şöyle dedi: Babasının rivayetine göre, Abdülmalik, ümmetin 74. yılında ilk altın basan kişiydi. Ebu el-Zübeyr el-Nakid, Abdülmalik'in 72. yılda bir miktar dinar bastığını, daha sonra 75. yılda da dinar bastığını söyledi. Ömer ibn Hubeyra Irak'ın yönetimini devraldığında, kendisinden öncekilerden daha fazla gümüşü saflaştırdı, dirhemleri daha bol hale getirdi ve döviz işlemlerinde çok katı davrandı. Sonra Halid ibn Abdullah el-Kasri yönetimi devraldı ve o da paralar konusunda herkesten daha katıydı. Sonra Yusuf ibn Ömer yönetimi devraldı ve darphaneciler ve döviz sahipleri üzerinde aşırı katı davrandı, ellerini kesti ve derilerini dövdü. Dolayısıyla Hubeyriyye, Halidiyye ve Yusufiyye, Beni Umayya'nın en iyi sikkeleriydi ve el-Mansur, vergide Beni Umayya'nın sikkelerinden başka hiçbir şeyi kabul etmiyordu; bu yüzden ilk dirhemler mekruh sayıldı."
  id: "Al-Hajjaj mencetak dirham pada akhir tahun 75 H, kemudian memerintahkan pencetakannya di seluruh wilayah pada tahun 76 H. 'Awanah ibn al-Hakam berkata bahwa al-Hajjaj menanyakan tentang metode orang Persia dalam mencetak dirham, lalu ia mendirikan sebuah tempat pencetakan dan mengumpulkan para pencetak di sana. Ia mencetak uang untuk sultan dari emas, koin palsu terbaik, dan emas murni terbaik. Kemudian ia mengizinkan para pedagang dan orang lain untuk mencetak uang kertas untuk mereka, dan mengambil keuntungan dari surplus upah. Ia menyegel tangan para pencetak dan mencetak dirham berkualitas tinggi yang bertuliskan \"Dengan nama Allah, al-Hajjaj,\" dan kemudian dengan \"Setelah tahun Allah, Yang Maha Esa, Yang Kekal, Yang Mutlak.\" Para ahli hukum tidak menyukai hal ini, sehingga disebut \"tidak disukai.\" Dikatakan bahwa orang-orang non-Arab tidak menyukai penurunan nilainya, dan mata uang itu disebut \"al-Samiriyyah\" sesuai nama orang pertama yang mencetaknya, yaitu Samir. Mus'ab mencetak dirham atas perintah Abdullah ibn al-Zubayr pada tahun 70 H, mengikuti gaya raja-raja Sasaniyah, dan uang tersebut membawa berkah dan keberuntungan. Ketika al-Hajjaj berkuasa, ia mengubahnya. Diriwayatkan dari Hisham ibn al-Kalbi bahwa Mus'ab juga mencetak dinar bersama dengan dirham, dan bahwa al-Harith ibn Abdullah ibn Abi Rabi'ah al-Makhzumi mencetak satuan berat yang setara dengan tujuh hari masa pemerintahan Ibn al-Zubayr. Ibn Abi al-Zinad berkata... Berdasarkan riwayat ayahnya, Abd al-Malik adalah orang pertama yang mencetak emas pada tahun 74 Masehi. Abu al-Zubayr al-Naqid berkata bahwa Abd al-Malik mencetak beberapa dinar pada tahun 72, kemudian mencetaknya lagi pada tahun 75. Ketika Umar ibn Hubayra mengambil alih Irak, ia memurnikan perak lebih dari para pendahulunya, dan ia membuat dirham lebih banyak dan ketat dalam pertukaran mata uang. Kemudian Khalid ibn Abdullah al-Qasri mengambil alih, dan ia lebih ketat dalam hal mata uang daripada siapa pun. Kemudian Yusuf ibn Umar mengambil alih, dan ia sangat ketat terhadap para pencetak dan pemilik pasar, bahkan sampai memotong tangan dan memukul kulit. Jadi, Hubayriyya, Khalidiyya, dan Yusufiyya adalah koin-koin terbaik dari Bani Umayyah, dan al-Mansur tidak menerima apa pun selain koin-koin Bani Umayyah dalam pajak, sehingga dirham-dirham pertama disebut sebagai dirham yang tidak disukai."
