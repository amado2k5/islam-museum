summary:
  ar: "لما فشلت دولة بني طولون وعاث القرامطة بنواحي الشام بعث المكتفي قائده محمد بن سليمان الكاتب فاستولى على الشام ثم قارب مصر، فكاتب القواد يستميلهم حتى جاءه بدر الحمامي رئيسهم، وبرز هارون بن خمارويه لقتالهم فأصابته حربة في فتنة وقعت بين جنده، واستأمن إليه أعيان دولته، فركب محمد إلى مصر واستولى عليها وقيد بني طولون — وكانوا سبعة عشر رجلاً — وأشخصهم إلى بغداد، وأمر المكتفي بإحراق القطائع التي بناها أحمد بن طولون شرقي مصر فكانت ميلاً في ميل ونُهبت الفسطاط. وعند ابن الجوزي خرج محمد بن سليمان إلى مصر فزحف هارون بن خمارويه لقتاله فدخل محمد الفسطاط وأخذ آل طولون وكانوا بضعة عشر رجلًا فقتلهم وحبسهم واحتوى على دورهم وجبى الخراج فكان آخر أمرهم {cite:muntazam-ibn-al-jawzi p. 342}."
  en: "As Tulunid power failed and the Qarmatians ravaged Syria, al-Muqtafi sent his commander Muhammad ibn Sulayman al-Katib, who took Syria then neared Egypt and won over the commanders until Badr al-Hammami their chief came over; Harun ibn Khumarawayh rode out to fight but was struck by a spear amid a mutiny of his own troops, his state's notables surrendered, and Muhammad rode into Egypt, chained the seventeen Banu Tulun and shipped them to Baghdad — then on al-Muqtafi's order burned Ibn Tulun's al-Qata'i' quarter east of Fustat mile upon mile while Fustat was plundered."
  es: "Cuando el poder tuluní se desvaneció y los cármatas asolaron Siria, al-Muqtafi envió a su comandante Muhammad ibn Sulayman al-Katib, quien tomó Siria y luego se acercó a Egipto y convenció a los comandantes hasta que Badr al-Hammami, su jefe, se unió a ellos; Harun ibn Khumarawayh salió a luchar, pero fue alcanzado por una lanza en medio de un motín de sus propias tropas, los notables de su estado se rindieron, y Muhammad entró en Egipto, encadenó a los diecisiete Banu Tulun y los envió a Bagdad; luego, por orden de al-Muqtafi, incendió el barrio de al-Qata'i' de Ibn Tulun al este de Fustat, milla tras milla, mientras Fustat era saqueada."
  fr: "Alors que le pouvoir toulounide s'effondrait et que les Qarmates ravageaient la Syrie, al-Muqtafi envoya son commandant Muhammad ibn Sulayman al-Katib, qui prit la Syrie puis se rapprocha de l'Égypte et gagna les commandants jusqu'à ce que Badr al-Hammami, leur chef, vienne à sa rencontre; Harun ibn Khumarawayh partit au combat mais fut frappé par une lance au milieu d'une mutinerie de ses propres troupes, les notables de son État se rendirent, et Muhammad entra en Égypte, enchaîna les dix-sept Banu Tulun et les envoya à Bagdad — puis, sur ordre d'al-Muqtafi, il incendia le quartier al-Qata'i' d'Ibn Tulun à l'est de Fustat, sur des kilomètres, tandis que Fustat était pillée."
  ur: "جیسا کہ طولونید کی طاقت ناکام ہوگئی اور قرامطیوں نے شام کو تباہ کر دیا، المقطفی نے اپنے کمانڈر محمد بن سلیمان الکاتب کو بھیجا، جس نے شام کو لے لیا، پھر مصر کے قریب پہنچا اور کمانڈروں پر فتح حاصل کی یہاں تک کہ ان کا سربراہ بدر الحمامی آیا؛ ہارون بن خمارویہ لڑنے کے لیے نکلا لیکن اس کی اپنی فوجوں کی بغاوت کے دوران اسے نیزے سے مارا گیا، اس کی ریاست کے معززین نے ہتھیار ڈال دیے، اور محمد مصر چلا گیا، سترہ بنو طولون کو جکڑ کر بغداد بھیج دیا - پھر المقطفی کے حکم پر ابن الطقوۃ کے حکم پر اس نے ابن الطقوۃ کو جلا دیا۔ میل پر میل جبکہ فوسٹاٹ کو لوٹ لیا گیا۔"
  tr: "Tulunid devleti çöktüğünde ve Karmatiler Suriye'nin bazı bölgelerinde büyük yıkıma yol açtığında, el-Muktafi komutanı Muhammed ibn Süleyman el-Katib'i gönderdi. Muhammed ibn Süleyman el-Katib Suriye'nin kontrolünü ele geçirdi ve ardından Mısır'a doğru ilerledi. Onları kendi tarafına çekmek için komutanlarla yazıştı ve sonunda liderleri Bedir el-Hamami ona geldi. Harun ibn Humarawayh onlarla savaşmak için yola çıktı, ancak askerleri arasında çıkan bir tartışmada mızrakla yaralandı. Devletin ileri gelenleri ona sığındı, bu yüzden Muhammed Mısır'a gitti, orayı ele geçirdi ve sayıları on yedi olan Tulunidlileri hapse atarak Bağdat'a gönderdi. El-Muktafi, Mısır'ın doğusunda Ahmed ibn Tulun tarafından inşa edilen ve bir mil x bir mil alanı kaplayan toprakların yakılmasını emretti ve Fustat yağmalandı. İbn el-Cevzi'ye göre, Muhammed ibn Süleyman Mısır'a gitti ve Harun ibn Humarawayh onunla savaşmak için yola çıktı. Muhammed Fustat'a girdi, sayıları on iki kadar olan Tulunidli erkekleri yakaladı, öldürdü, hapse attı, evlerine el koydu ve vergi topladı. Hikayelerinin sonu buydu. {cite:muntazam-ibn-al-jawzi s. 342}"
  id: "Ketika negara Tulunid runtuh dan kaum Qarmatian menimbulkan malapetaka di beberapa bagian Suriah, al-Muktafi mengutus komandannya, Muhammad ibn Sulayman al-Katib, yang merebut kendali Suriah dan kemudian maju menuju Mesir. Ia berkorespondensi dengan para komandan untuk membujuk mereka hingga Badr al-Hamami, pemimpin mereka, datang kepadanya. Harun ibn Khumarawayh maju untuk melawan mereka tetapi terluka oleh tombak dalam perselisihan yang terjadi di antara tentaranya. Para tokoh penting negaranya mencari perlindungan kepadanya, sehingga Muhammad pergi ke Mesir, merebutnya, dan memenjarakan orang-orang Tulunid—yang berjumlah tujuh belas orang—dan mengirim mereka ke Baghdad. Al-Muktafi memerintahkan pembakaran perkebunan yang dibangun oleh Ahmad ibn Tulun di sebelah timur Mesir, yang meliputi area seluas satu mil kali satu mil, dan Fustat dijarah. Menurut Ibn al-Jawzi, Muhammad ibn Sulayman pergi ke Mesir, dan Harun ibn Khumarawayh berbaris untuk melawannya. Muhammad memasuki Fustat, menangkap orang-orang Tulunid—yang berjumlah sekitar selusin—membunuh mereka, memenjarakan mereka, menyita rumah-rumah mereka, dan memungut pajak. Inilah akhir dari kisah mereka. {cite:muntazam-ibn-al-jawzi p. 342}"
