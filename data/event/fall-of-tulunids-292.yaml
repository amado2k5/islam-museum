label:
  ar: سقوط الدولة الطولونية وإحراق القطائع ⁦(292هـ)⁩
  en: Fall of the Tulunid state and burning of al-Qata'i' (292 AH)
  es: "Caída del estado tuluní e incendio de al-Qata'i' (292 AH)"
  fr: "Chute de l'État toulounide et incendie d'al-Qata'i' (292 AH)"
date:
  start: { edtf: "0905", hijri: "0292", calendar: julian, precision: year, status: tradition, derived: true, note: "استيلاء محمد بن سليمان على مصر سنة 292هـ؛ التحويل مشتق." }
summary:
  ar: "لما فشلت دولة بني طولون وعاث القرامطة بنواحي الشام بعث المكتفي قائده محمد بن سليمان الكاتب فاستولى على الشام ثم قارب مصر، فكاتب القواد يستميلهم حتى جاءه بدر الحمامي رئيسهم، وبرز هارون بن خمارويه لقتالهم فأصابته حربة في فتنة وقعت بين جنده، واستأمن إليه أعيان دولته، فركب محمد إلى مصر واستولى عليها وقيد بني طولون — وكانوا سبعة عشر رجلاً — وأشخصهم إلى بغداد، وأمر المكتفي بإحراق القطائع التي بناها أحمد بن طولون شرقي مصر فكانت ميلاً في ميل ونُهبت الفسطاط. وعند ابن الجوزي خرج محمد بن سليمان إلى مصر فزحف هارون بن خمارويه لقتاله فدخل محمد الفسطاط وأخذ آل طولون وكانوا بضعة عشر رجلًا فقتلهم وحبسهم واحتوى على دورهم وجبى الخراج فكان آخر أمرهم {cite:muntazam-ibn-al-jawzi p. 342}."
  en: "As Tulunid power failed and the Qarmatians ravaged Syria, al-Muqtafi sent his commander Muhammad ibn Sulayman al-Katib, who took Syria then neared Egypt and won over the commanders until Badr al-Hammami their chief came over; Harun ibn Khumarawayh rode out to fight but was struck by a spear amid a mutiny of his own troops, his state's notables surrendered, and Muhammad rode into Egypt, chained the seventeen Banu Tulun and shipped them to Baghdad — then on al-Muqtafi's order burned Ibn Tulun's al-Qata'i' quarter east of Fustat mile upon mile while Fustat was plundered."
  es: "Cuando el poder tuluní se desvaneció y los cármatas asolaron Siria, al-Muqtafi envió a su comandante Muhammad ibn Sulayman al-Katib, quien tomó Siria y luego se acercó a Egipto y convenció a los comandantes hasta que Badr al-Hammami, su jefe, se unió a ellos; Harun ibn Khumarawayh salió a luchar, pero fue alcanzado por una lanza en medio de un motín de sus propias tropas, los notables de su estado se rindieron, y Muhammad entró en Egipto, encadenó a los diecisiete Banu Tulun y los envió a Bagdad; luego, por orden de al-Muqtafi, incendió el barrio de al-Qata'i' de Ibn Tulun al este de Fustat, milla tras milla, mientras Fustat era saqueada."
  fr: "Alors que le pouvoir toulounide s'effondrait et que les Qarmates ravageaient la Syrie, al-Muqtafi envoya son commandant Muhammad ibn Sulayman al-Katib, qui prit la Syrie puis se rapprocha de l'Égypte et gagna les commandants jusqu'à ce que Badr al-Hammami, leur chef, vienne à sa rencontre; Harun ibn Khumarawayh partit au combat mais fut frappé par une lance au milieu d'une mutinerie de ses propres troupes, les notables de son État se rendirent, et Muhammad entra en Égypte, enchaîna les dix-sept Banu Tulun et les envoya à Bagdad — puis, sur ordre d'al-Muqtafi, il incendia le quartier al-Qata'i' d'Ibn Tulun à l'est de Fustat, sur des kilomètres, tandis que Fustat était pillée."
