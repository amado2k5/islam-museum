id: "event/ibn-dhi-al-tawq-and-isa-al-yafii-rout-jarrah-and-ibn-kayyala-at-mujayyib-in-294-ah"
class: event
kind: other
label:
  ar: "يهزم ابن ذي الطوق وعيسى اليافعي جراحا وابن كيالة عند مجيب ومسيب سنة 294هـ، ص393"
  en: "Ibn Dhi al-Tawq and Isa al-Yafi'i rout Jarrah and Ibn Kayyala at Mujayyib and Musayyib in 294 AH, p. 393"
  ur: "ابن ذی الطوق اور عیسیٰ الیافعی 294ھ میں مجیب اور مسیب میں جراح اور ابن کیالہ کو شکست دیتے ہیں، ص393"
  es: "Ibn Dhi al-Tawq e Isa al-Yafi'i derrotaron a Jarrah e Ibn Kayyala en Mujayyib y Musayyib en 294 AH, p. 393"
  fr: "Ibn Dhi al-Tawq et Isa al-Yafi'i mettent en déroute Jarrah et Ibn Kayyala à Mujayyib et Musayyib en 294 AH, p. 393"
  tr: "İbn Zî't-Tevk ve İsa el-Yafi'i, H. 294 yılında Cerrah ve İbn Kayyala'yı Mujib ve Müseyyab'ın elinde mağlup etti, s. 393"
  id: "Ibnu Dhi al-Tawq dan Isa al-Yafi’i berhasil mengalahkan Jarrah dan Ibnu Kayyala di tangan Mujib dan Musayyab pada tahun 294 H, hal. 393"
summary:
  ar: "يصير ابن ذي الطوق القرمطي وعيسى اليافعي إلى المغرب فيقيمان بمجيب ومسيب، فيخرج إليهما جراح وابن كيالة بأهل صنعاء، فيُهزمان ويُقتل من أهل صنعاء ومن غيرهم نحو أربعمائة."
  en: "Ibn Dhi al-Tawq and Isa al-Yafi'i go to al-Maghrib and camp at Mujayyib and Musayyib. Jarrah and Ibn Kayyala march out against them with the men of Sanaa and are routed, with about four hundred killed among the men of Sanaa and others."
  ur: "ابن ذی الطوق اور عیسیٰ الیافعی المغرب جاتے اور مجیب و مسیب میں پڑاؤ کرتے ہیں۔ جراح اور ابن کیالہ اہل صنعاء کے ساتھ ان کے مقابلے کو نکلتے ہیں اور شکست کھاتے ہیں، اور تقریباً چار سو افراد مارے جاتے ہیں۔"
  es: "Ibn Dhi al-Tawq e Isa al-Yafi'i se dirigen al Magreb y acampan en Mujayyib y Musayyib. Jarrah e Ibn Kayyala salen a su encuentro con los hombres de Sanaa y son derrotados, con unos cuatrocientos muertos entre los hombres de Sanaa y otros."
  fr: "Ibn Dhi al-Tawq et Isa al-Yafi'i se rendent à al-Maghrib et campent à Mujayyib et Musayyib. Jarrah et Ibn Kayyala marchent contre eux avec les hommes de Sanaa et sont mis en déroute; environ quatre cents hommes, parmi ceux de Sanaa et les autres, sont tués."
  tr: "İbn Zhi el-Tevk el-Karmati ve İsa el-Yafiî Mağrip'e gider ve Mücib ile Musayyab'ın yanında kalırlar. Cerrah ve İbn Kayala, Sana'a halkıyla birlikte onların yanına gelirler ve yenilgiye uğrarlar; Sana'a'dan ve diğerlerinden yaklaşık dört yüz kişi öldürülür."
  id: "Ibn Dhi al-Tawq al-Qarmati dan Isa al-Yafi’i pergi ke Maghreb dan tinggal bersama Mujib dan Musayyab. Jarrah dan Ibn Kayala datang menemui mereka bersama penduduk Sana’a, dan mereka dikalahkan serta sekitar empat ratus orang dari Sana’a dan lainnya terbunuh."
