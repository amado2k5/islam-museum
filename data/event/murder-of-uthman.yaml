issue: { ar: "ما الذي أدى إلى مقتل عثمان، ومن المسؤول عنه؟", en: "What led to the killing of Uthman, and who bears responsibility?" }
perspectives:
  - tradition: sunni
    id: sunni-saba-conspiracy
    summary: { ar: "يرى الصلابي أن الفتنة التي انتهت بمقتل عثمان دبّرها تنظيم سبئي بقيادة عبد الله بن سبأ، وأن الوفود من البصرة والكوفة ومصر نُظّمت في فرق، وأن المطالبة بعزل الولاة تطورت إلى خلع عثمان ثم قتله (ص163). ويعدّ الكتاب الكتاب المزوّر على لسان عثمان جزءاً من هذا التدبير (ص164-166).", en: "Al-Sallabi attributes the strife to an organised Saba'i network led by Abdullah ibn Saba, with groups from Basra, Kufa and Egypt; he treats the forged letter as part of the plot (pp. 163-166)." }
    sources: [source/sallabi-ali-vol1]
  - tradition: sunni
    id: sunni-unjust-killing
    summary: { ar: "يذكر الكتاب أن أهل السنة يعدّون عثمان مقتولاً ظلماً، ويستشهد بقول معاوية في مطالبته بالقصاص (ص188)، ويذكر أن علياً ومن معه دافعوا عنه وعرضوا حمايته (ص166-167).", en: "The book records that Sunni scholars regard Uthman as killed unjustly, citing Muawiya's demand for retribution, and that Ali and others offered to defend him (pp. 166-167, 188)." }
    sources: [source/sallabi-ali-vol1]
  - tradition: academic
    id: academic-note
    summary: { ar: "لم يرد في الصفحات المقروءة عرض لرأي أكاديمي حديث في أسباب المقتل؛ يحتاج ذلك إلى مرجع محدد (needs_source).", en: "No modern academic reading of the causes of the killing is given in these pages (needs_source)." }
    sources: [source/sallabi-ali-vol1]
  - tradition: other
    id: other-shia-narratives
    summary: { ar: "ينقل الكتاب روايات شيعية تنسب إلى الصحابة محاباة وتمثيلاً عشائرياً في الشورى، ويرفضها (ص157-160)، ويذكر روايات شيعية تتهم عمر بأفعال لم تثبت (ص151-152). هذه الروايات ليست تفسيراً أكاديمياً للمقتل، والكتاب يردّها (needs_source).", en: "The book reports Shi'i narratives that accuse Companions of favouritism in the shura, and rejects them (pp. 157-160); it also notes Shi'i accusations against Umar that it rejects (pp. 151-152). These are not an academic account of the killing (needs_source)." }
    sources: [source/sallabi-ali-vol1]
