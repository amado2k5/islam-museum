id: event/murder-of-uthman
class: event
kind: revolt
label: { ar: "مقتل عثمان بن عفان" }
summary:
  ar: "قُتل عثمان في سنة خمس وثلاثين، ويذكر الطبري عنوان «ذكر الخبر عن قتل عثمان» في فهرس الجزء الرابع {cite:tabari-tarikh-abu-al-fadl j.4 p.582}. وبعد مقتله أتى الناس عليًّا فامتنع أولاً، ثم بايعه العامة بعد أن أخذ الأشتر بيده {cite:tabari-tarikh-abu-al-fadl j.4 p.433}. وعند السيوطي في تفصيل الحصار: شكا أهل مصر عاملهم ابن أبي سرح فأشاروا على عثمان بمحمد بن أبي بكر فكتب عهده، ثم ظهر على الطريق غلام يقود بعيراً في إداوته كتاب بخاتم عثمان إلى عامل مصر يأمره أن يحتل في قتل محمد وأصحابه ويبطل كتابه ويحبس المتظلمين، فرجعوا وختم محمد الكتاب وفضّوه على طلحة والزبير وعلي وسعد، وحلف عثمان ما كتبه ولا أمر به ولا وجه الغلام، وعرفوا أن الخط خط مروان فطلبوه فأبى عثمان تسليمه خشية قتله، فحاصروه ومنعوه الماء حتى بعث علي بثلاث قرب وجرح في سببها موال لبني هاشم وبني أمية، ونصحه المغيرة بن شعبة بثلاث: القتال أو الخروج إلى مكة أو اللحاق بالشام، فأبى أن يكون أول من خلف رسول الله بسفك الدماء وأن يفارق دار هجرته {cite:tarikh-khulafa-minhaj-1434 p. 271-276}. وتسور محمد بن أبي بكر وصاحبان الدار فأخذ بلحية عثمان ثم تراخت يده لذكرى أبيه، ودخل الرجلان فتوجاه حتى قتلاه وهو يقرأ في مصحفه، وكان قتله في أوسط أيام التشريق سنة خمس وثلاثين، وقيل يوم الجمعة لثمان عشر خلت من ذي الحجة، ودفن ليلة السبت في حُشّ كوكب بالبقيع وهو أول من دفن به، وصلى عليه الزبير وكان له اثنتان وثمانون سنة في المشهور {cite:tarikh-khulafa-minhaj-1434 p. 274-277}. وفي رواية المسعودي سار مالك بن الحارث النخعي من الكوفة في مائتي رجل وحكيم بن جبلة العبدي في مائة من البصرة ومن مصر ستمائة عليهم عبد الرحمن بن عديس البلوي ممن بايع تحت الشجرة، فنزلوا ذي الخشب فأجابهم علي إلى ما أرادوا وانصرفوا فلما صاروا بحسمى أخذوا ورشاً غلام عثمان ومعه كتاب بخط مروان إلى ابن أبي سرح فيه أوامر بقطع أيد وقتل فرجعوا وحاصروه تسعة وأربعين يوماً ومنعوه الماء فبعث إليه علي بثلاث قرب، وحماه أبناء الصحابة على الباب فجرح الحسن وشج قنبر وجرح محمد بن طلحة، وأخذه محمد بن أبي بكر بلحيته فقال له عثمان والله لو رآك أبوك لساءه مكانك فتراخت يده وخرج، ودخل رجلان فقتلاه والمصحف بين يديه وقيل كنانة بن بشر وسعد بن حمران، ودفن بحش كوكب وصلى عليه جبير بن مطعم وحكيم بن حزام وأبو جهم بن حذيفة {cite:muruj-al-dhahab p. 637-639}"
