tags: [wasaya-browser, wasaya-caliphs, wasaya-ihtidar]
label: { ar: "مقتل عثمان بن عفان", en: "The murder of Uthman ibn Affan", es: "El asesinato de Uthman ibn Affan", fr: "Le meurtre d'Uthman ibn Affan", ur: "عثمان بن عفان کا قتل" }
summary:
  ar: "قُتل عثمان في سنة خمس وثلاثين، ويذكر الطبري عنوان «ذكر الخبر عن قتل عثمان» في فهرس الجزء الرابع {cite:tabari-tarikh-abu-al-fadl j.4 p.582}. وبعد مقتله أتى الناس عليًّا فامتنع أولاً، ثم بايعه العامة بعد أن أخذ الأشتر بيده {cite:tabari-tarikh-abu-al-fadl j.4 p.433}. وعند السيوطي في تفصيل الحصار: شكا أهل مصر عاملهم ابن أبي سرح فأشاروا على عثمان بمحمد بن أبي بكر فكتب عهده، ثم ظهر على الطريق غلام يقود بعيراً في إداوته كتاب بخاتم عثمان إلى عامل مصر يأمره أن يحتل في قتل محمد وأصحابه ويبطل كتابه ويحبس المتظلمين، فرجعوا وختم محمد الكتاب وفضّوه على طلحة والزبير وعلي وسعد، وحلف عثمان ما كتبه ولا أمر به ولا وجه الغلام، وعرفوا أن الخط خط مروان فطلبوه فأبى عثمان تسليمه خشية قتله، فحاصروه ومنعوه الماء حتى بعث علي بثلاث قرب وجرح في سببها موال لبني هاشم وبني أمية، ونصحه المغيرة بن شعبة بثلاث: القتال أو الخروج إلى مكة أو اللحاق بالشام، فأبى أن يكون أول من خلف رسول الله بسفك الدماء وأن يفارق دار هجرته {cite:tarikh-khulafa-minhaj-1434 p. 271-276}. وتسور محمد بن أبي بكر وصاحبان الدار فأخذ بلحية عثمان ثم تراخت يده لذكرى أبيه، ودخل الرجلان فتوجاه حتى قتلاه وهو يقرأ في مصحفه، وكان قتله في أوسط أيام التشريق سنة خمس وثلاثين، وقيل يوم الجمعة لثمان عشر خلت من ذي الحجة، ودفن ليلة السبت في حُشّ كوكب بالبقيع وهو أول من دفن به، وصلى عليه الزبير وكان له اثنتان وثمانون سنة في المشهور {cite:tarikh-khulafa-minhaj-1434 p. 274-277}. وفي رواية المسعودي سار مالك بن الحارث النخعي من الكوفة في مائتي رجل وحكيم بن جبلة العبدي في مائة من البصرة ومن مصر ستمائة عليهم عبد الرحمن بن عديس البلوي ممن بايع تحت الشجرة، فنزلوا ذي الخشب فأجابهم علي إلى ما أرادوا وانصرفوا فلما صاروا بحسمى أخذوا ورشاً غلام عثمان ومعه كتاب بخط مروان إلى ابن أبي سرح فيه أوامر بقطع أيد وقتل فرجعوا وحاصروه تسعة وأربعين يوماً ومنعوه الماء فبعث إليه علي بثلاث قرب، وحماه أبناء الصحابة على الباب فجرح الحسن وشج قنبر وجرح محمد بن طلحة، وأخذه محمد بن أبي بكر بلحيته فقال له عثمان والله لو رآك أبوك لساءه مكانك فتراخت يده وخرج، ودخل رجلان فقتلاه والمصحف بين يديه وقيل كنانة بن بشر وسعد بن حمران، ودفن بحش كوكب وصلى عليه جبير بن مطعم وحكيم بن حزام وأبو جهم بن حذيفة {cite:muruj-al-dhahab p. 637-639}"
  en: "Uthman was killed in 35 AH; al-Tabari's table of contents for the fourth volume lists the heading 'An account of the killing of Uthman' {cite:tabari-tarikh-abu-al-fadl j.4 p.582}. After his killing people came to Ali, who at first refused; then the common people gave him their allegiance after al-Ashtar took his hand {cite:tabari-tarikh-abu-al-fadl j.4 p.433}. In al-Suyuti's detailed account of the siege: the people of Egypt complained of their governor, Ibn Abi Sarh, and advised Uthman to appoint Muhammad ibn Abi Bakr, and he wrote his commission. Then on the road a boy leading a camel was seized; in his waterskin was a letter under Uthman's seal to the governor of Egypt, ordering him to plot the killing of Muhammad and his companions, to void his commission and to imprison the complainants. They returned; Muhammad sealed the letter and opened it before Talha, al-Zubayr, Ali and Sa'd. Uthman swore that he had neither written it nor ordered it, nor sent the boy; they recognised the hand as Marwan's and demanded him, but Uthman refused to hand him over, fearing he would be killed. They besieged him and cut off his water until Ali sent three waterskins; in bringing them, some clients of Banu Hashim and Banu Umayya were wounded. Al-Mughira ibn Shu'ba advised him on three courses: fight, leave for Mecca, or join Syria; but he refused to be the first successor of the Messenger of God to shed blood, or to leave the house of his emigration {cite:tarikh-khulafa-minhaj-1434 p. 271-276}. Muhammad ibn Abi Bakr and two men with him climbed over the wall; he seized Uthman by the beard, but his hand slackened out of memory of his father, and the two men went in and struck him down while he was reading his codex. He was killed in the middle of the days of tashriq in 35 AH; some say on Friday, the eighteenth of Dhu'l-Hijja. He was buried on the night of Saturday in Hush Kawkab in al-Baqi', the first to be buried there, and al-Zubayr led the funeral prayer; he was eighty-two years old by the well-known account {cite:tarikh-khulafa-minhaj-1434 p. 274-277}. In al-Mas'udi's account, Malik ibn al-Harith al-Nakha'i set out from Kufa with two hundred men, Hakim ibn Jabala al-Abdi with a hundred from Basra, and six hundred from Egypt under Abd al-Rahman ibn Udays al-Balawi, who had pledged under the tree. They halted at Dhu Khushub, where Ali agreed to their demands, and they withdrew. But when they reached Hasma they seized Warsh, Uthman's servant, carrying a letter in Marwan's hand to Ibn Abi Sarh with orders to cut off hands and to kill. They returned and besieged him for forty-nine days, cutting off his water; Ali sent him three waterskins. The sons of the Companions guarded the door: al-Hasan was wounded, Qanbar was wounded in the head, and Muhammad ibn Talha was wounded. Muhammad ibn Abi Bakr seized him by the beard, and Uthman said, 'By God, were your father to see where you stand, it would grieve him'; his hand slackened and he went out. Two men entered and killed him while the codex lay before him; some say they were Kinana ibn Bishr and Sa'd ibn Humran. He was buried at Hush Kawkab, and the funeral prayer was led by Jubayr ibn Mut'im, Hakim ibn Hizam and Abu Jahm ibn Hudhayfa {cite:muruj-al-dhahab p. 637-639}."
  es: "Uthman fue asesinado en el año 35 AH; el índice del cuarto volumen de al-Tabari incluye el título «Relato del asesinato de Uthman» {cite:tabari-tarikh-abu-al-fadl j.4 p.582}. Tras su muerte, la gente acudió a Ali, quien al principio se negó; luego, el pueblo le juró lealtad después de que al-Ashtar le tomara la mano {cite:tabari-tarikh-abu-al-fadl j.4 p.433}. En el relato detallado del asedio de al-Suyuti: el pueblo de Egipto se quejó de su gobernador, Ibn Abi Sarh, y aconsejó a Uthman que nombrara a Muhammad ibn Abi Bakr, y este redactó su nombramiento. Entonces, en el camino, un muchacho que guiaba un camello fue capturado; en su odre de agua se encontró una carta con el sello de Uthman dirigida al gobernador de Egipto, ordenándole que planeara el asesinato de Muhammad y sus compañeros, que anulara su nombramiento y que encarcelara a los denunciantes. Regresaron; Muhammad selló la carta y la abrió ante Talha, al-Zubayr, Ali y Sa'd. Uthman juró que no la había escrito ni ordenado, ni había enviado al muchacho; reconocieron la letra como la de Marwan y lo exigieron, pero Uthman se negó a entregarlo, temiendo que lo mataran. Lo sitiaron y le cortaron el agua hasta que Ali envió tres odres; al traerlos, algunos clientes de Banu Hashim y Banu Umayya resultaron heridos. Al-Mughira ibn Shu'ba le aconsejó tres opciones: luchar, partir hacia La Meca o unirse a Siria; pero él se negó a ser el primer sucesor del Mensajero de Dios en derramar sangre, o a abandonar la casa de su emigración {cite:tarikh-khulafa-minhaj-1434 p. 271-276}. Muhammad ibn Abi Bakr y dos hombres con él escalaron el muro; Agarró a Uthman por la barba, pero su mano se aflojó al recordar a su padre, y los dos hombres entraron y lo mataron mientras leía su códice. Murió a mediados de los días de Tashriq en el año 35 de la Hégira; algunos dicen que el viernes 18 de Dhul-Hijjah. Fue enterrado la noche del sábado en Hush Kawkab, en Al-Baqi', siendo el primero en ser enterrado allí, y Al-Zubayr dirigió la oración fúnebre; tenía ochenta y dos años según el relato conocido {cite:tarikh-khulafa-minhaj-1434 p. 274-277}. En el relato de al-Mas'udi, Malik ibn al-Harith al-Nakha'i partió de Kufa con doscientos hombres, Hakim ibn Jabala al-Abdi con cien de Basora, y seiscientos de Egipto bajo el mando de Abd al-Rahman ibn Udays al-Balawi, quien había jurado lealtad bajo el árbol. Se detuvieron en Dhu Khushub, donde Ali accedió a sus demandas, y se retiraron. Pero cuando llegaron a Hasma, capturaron a Warsh, sirviente de Uthman, que llevaba una carta en la mano de Marwan para Ibn Abi Sarh con órdenes de cortarle las manos y matarlo. Regresaron y lo sitiaron durante cuarenta y nueve días, cortándole el agua; Ali le envió tres odres. Los hijos de los Compañeros custodiaban la puerta: al-Hasan fue herido, Qanbar fue herido en la cabeza y Muhammad ibn Talha fue herido. Muhammad ibn Abi Bakr lo agarró por la barba, y Uthman dijo: «¡Por Dios! Si tu padre viera dónde estás, se entristecería». Su mano se aflojó y salió. Dos hombres entraron y lo mataron mientras el códice yacía ante él; algunos dicen que eran Kinana ibn Bishr y Sa'd ibn Humran. Fue enterrado en Hush Kawkab, y la oración fúnebre fue dirigida por Jubayr ibn Mut'im, Hakim ibn Hizam y Abu Jahm ibn Hudhayfa {cite:muruj-al-dhahab p. 637-639}."
  fr: "Uthman fut tué en 35 AH; la table des matières du quatrième volume d'al-Tabari mentionne le titre « Récit de la mort d'Uthman » (cite: Tabari Tarikh Abu al-Fadl, vol. 4, p. 582). Après sa mort, le peuple vint trouver Ali, qui refusa d'abord; puis, après qu'al-Ashtar lui eut pris la main, il lui prêta allégeance (cite: Tabari Tarikh Abu al-Fadl, vol. 4, p. 433). Dans le récit détaillé du siège par al-Suyuti: les Égyptiens se plaignirent de leur gouverneur, Ibn Abi Sarh, et conseillèrent à Uthman de nommer Muhammad ibn Abi Bakr, ce qu'il fit. Sur la route, un garçon menant un chameau fut arrêté; dans son outre se trouvait une lettre, scellée du sceau d'Uthman, adressée au gouverneur d'Égypte, lui ordonnant de comploter l'assassinat de Muhammad et de ses compagnons, d'annuler sa nomination et d'emprisonner les plaignants. Ils revinrent; Muhammad scella la lettre et l'ouvrit devant Talha, al-Zubayr, Ali et Sa'd. Uthman jura qu'il ne l'avait ni écrite, ni ordonnée, ni envoyé le garçon; ils reconnurent l'écriture de Marwan et le réclamèrent, mais Uthman refusa de le leur livrer, craignant pour sa vie. Ils l'assiégèrent et lui coupèrent l'eau jusqu'à ce qu'Ali envoie trois outres; lors de leur transport, des clients des Banu Hashim et des Banu Umayya furent blessés. Al-Mughira ibn Shu'ba lui conseilla trois options: combattre, partir pour La Mecque ou rejoindre la Syrie; mais il refusa d'être le premier successeur du Messager de Dieu à verser le sang, ou à quitter la maison de son émigration (voir: Tarikh-Khulafa-Minhaj-1434, p. 271-276). Muhammad ibn Abi Bakr et deux hommes avec lui franchirent le mur. Il saisit Uthman par la barbe, mais sa main se relâcha par souvenir de son père, et les deux hommes entrèrent et le frappèrent alors qu'il lisait son codex. Il fut tué au milieu des jours de tashriq de l'an 35 de l'Hégire; certains disent le vendredi 18 Dhu al-Hijja. Il fut enterré dans la nuit du samedi à Hush Kawkab, dans le district d'al-Baqi', le premier à y être inhumé, et al-Zubayr dirigea la prière funéraire; il avait quatre-vingt-deux ans, selon le récit bien connu {cite:tarikh-khulafa-minhaj-1434 p. 274-277}. Selon le récit d'al-Mas'udi, Malik ibn al-Harith al-Nakha'i partit de Koufa avec deux cents hommes, Hakim ibn Jabala al-Abdi avec une centaine d'hommes venus de Bassora, et six cents d'Égypte sous le commandement d'Abd al-Rahman ibn Udays al-Balawi, qui avait prêté serment sous l'arbre. Ils firent halte à Dhu Khushub, où Ali accéda à leurs demandes, et ils se retirèrent. Mais arrivés à Hasma, ils s'emparèrent de Warsh, serviteur d'Uthman, qui portait une lettre de la main de Marwan adressée à Ibn Abi Sarh, ordonnant de lui couper les mains et de le tuer. Ils revinrent et l'assiégèrent pendant quarante-neuf jours, le privant d'eau; Ali lui envoya trois outres. Les fils des Compagnons gardaient la porte: al-Hasan fut blessé, Qanbar reçut une blessure à la tête et Muhammad ibn Talha fut également blessé. Muhammad ibn Abi Bakr le saisit par la barbe, et Uthman dit: « Par Dieu, si ton père voyait où tu te trouves, il en serait affligé. » Sa main se relâcha et il sortit. Deux hommes entrèrent et le tuèrent alors que le codex gisait devant lui; certains disent qu'il s'agissait de Kinana ibn Bishr et de Sa'd ibn Humran. Il fut enterré à Hush Kawkab, et la prière funéraire fut dirigée par Jubayr ibn Mut'im, Hakim ibn Hizam et Abu Jahm ibn Hudhayfa (voir Muruj-al-Dhahab, p. 637-639)."
  ur: "عثمان 35 ہجری میں قتل ہوا۔ الطبری کے چوتھے جلد کے مندرجات کے جدول میں 'قتل عثمان کا بیان' کا عنوان درج ہے۔ اس کے قتل کے بعد لوگ علی کے پاس آئے جنہوں نے پہلے تو انکار کر دیا۔ اشتر کے ہاتھ پکڑنے کے بعد عام لوگوں نے ان کی بیعت کی۔ سیوطی نے محاصرے کے تفصیلی بیان میں کہا ہے: مصر کے لوگوں نے اپنے گورنر ابن ابی سرح سے شکایت کی اور عثمان کو مشورہ دیا کہ وہ محمد بن ابی بکر کو مقرر کریں اور اس نے اپنا کمیشن لکھ دیا۔ پھر راستے میں ایک لڑکا پکڑا گیا جو اونٹ لے رہا تھا۔ اس کی کھال میں عثمان کی مہر کے نیچے مصر کے گورنر کے نام ایک خط تھا، جس میں اسے محمد اور ان کے ساتھیوں کے قتل کی منصوبہ بندی کرنے، اس کے کمیشن کو کالعدم کرنے اور شکایت کرنے والوں کو قید کرنے کا حکم دیا گیا تھا۔ وہ واپس آئے۔ محمد نے خط پر مہر لگا دی اور اسے طلحہ، الزبیر، علی اور سعد کے سامنے کھول دیا۔ عثمان نے قسم کھائی کہ اس نے نہ اسے لکھا، نہ حکم دیا، نہ لڑکے کو بھیجا۔ انہوں نے اس ہاتھ کو مروان کا ہی سمجھا اور اس سے مطالبہ کیا، لیکن عثمان نے اس کے حوالے کرنے سے انکار کر دیا، اس ڈر سے کہ وہ قتل ہو جائے گا۔ انہوں نے اس کا محاصرہ کیا اور اس کا پانی کاٹ دیا یہاں تک کہ علی نے تین کھالیں بھیج دیں۔ ان کو لانے میں بنو ہاشم اور بنو امیہ کے کچھ مریدین زخمی ہوئے۔ المغیرہ بن شعبہ نے انہیں تین طریقوں کی نصیحت کی: لڑنا، مکہ جانا، یا شام میں شامل ہونا۔ لیکن اس نے خون بہانے، یا اپنی ہجرت کے گھر کو چھوڑنے والے رسول اللہ کے پہلے جانشین ہونے سے انکار کر دیا۔ 271-276}۔ محمد بن ابی بکر اور ان کے ساتھ دو آدمی دیوار پر چڑھ گئے۔ اس نے عثمان کو داڑھی سے پکڑ لیا، لیکن اس کا ہاتھ اپنے باپ کی یاد سے ڈھیلا پڑ گیا، اور وہ دونوں آدمی اندر گئے اور اس کو مارا جب وہ اپنا کوڈ پڑھ رہا تھا۔ 35 ہجری میں ایام تشریق کے وسط میں آپ کا قتل ہوا۔ بعض کہتے ہیں کہ اٹھارہویں ذی الحجہ جمعہ کو ہے۔ آپ کو سنیچر کی رات البقیع میں حش کوکب میں دفن کیا گیا، وہاں سب سے پہلے دفن کیا گیا، اور زبیر نے نماز جنازہ پڑھائی۔ ان کی عمر بیاسی سال تھی بذریعہ معروف کتاب {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 274-277}۔ المسعودی کے بیان میں، مالک بن حارث النخعی دو سو آدمیوں کے ساتھ کوفہ سے، حکیم بن جبلہ العبدی ایک سو بصرہ کے ساتھ اور چھ سو مصر سے عبدالرحمٰن بن عدیس البلاوی کے ساتھ، جس نے درخت کے نیچے بیعت کی تھی۔ وہ ذو خوشب میں رکے، جہاں علی نے ان کے مطالبات سے اتفاق کیا، اور وہ پیچھے ہٹ گئے۔ لیکن جب وہ حسمہ پہنچے تو انہوں نے عثمان کے نوکر وارش کو پکڑ لیا، مروان کے ہاتھ میں ایک خط ابن ابی سرح کے نام لے کر ہاتھ کاٹنے اور قتل کرنے کا حکم تھا۔ وہ واپس آئے اور اُنتالیس دن تک اُس کا محاصرہ کر کے اُس کا پانی بند کر دیا۔ علی نے اسے تین پانی کی کھالیں بھیجیں۔ صحابہ کے بیٹوں نے دروازے کی حفاظت کی: الحسن زخمی، قنبر کے سر میں زخم اور محمد بن طلحہ زخمی ہوئے۔ محمد بن ابی بکر نے اسے داڑھی سے پکڑ لیا، اور عثمان نے کہا، 'خدا کی قسم، اگر آپ کے والد یہ دیکھتے کہ آپ کہاں کھڑے ہیں، تو یہ ان کو غمگین کرے گا'؛ اس کا ہاتھ ڈھیلا ہوا اور وہ باہر چلا گیا۔ دو آدمی داخل ہوئے اور اسے قتل کر دیا جب کہ کوڈیکس اس کے سامنے پڑا تھا۔ بعض کہتے ہیں کہ وہ کنانہ بن بشر اور سعد بن حمران تھے۔ آپ کو حش کوکب میں دفن کیا گیا اور نماز جنازہ جبیر بن مطعم، حکیم بن حزام اور ابو جہم بن حذیفہ نے پڑھائی۔ 637-639}۔"
