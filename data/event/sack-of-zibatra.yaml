id: event/sack-of-zibatra
class: event
kind: raid
label: { ar: "خراب زبطرة وغزوة المعتصم", en: "The Sack of Zibatra and al-Mu'tasim's Retaliation", es: "El saqueo de Zibatra y la represalia de al-Mu'tasim", fr: "Le sac de Zibatra et les représailles d'al-Mu'tasim", ur: "زباطرہ کی بوری اور المعتصم کا بدلہ" }
summary:
  ar: "عند البلاذري: كانت زبطرة حصناً قديماً رومياً فُتح مع حصن الحدث القديم فتحه حبيب بن مسلمة الفهري وكان قائماً إلى أن أخربته الروم في أيام الوليد بن يزيد فبُني بناء غير محكم فأناخت الروم عليه في أيام فتنة مروان بن محمد فهدمته فبناه المنصور ثم خرجت إليه فشعثته فبناه الرشيد على يدي محمد بن إبراهيم وشحنه، فلما كانت خلافة المأمون طرقه الروم فشعثوه وأغاروا على سرح أهله فاستاقوا لهم مواشي فأمر المأمون بمرمّته وتحصينه، وقدم وفد طاغية الروم في سنة 210 يسأل الصلح فلم يجبه إليه وكتب إلى عمّال الثغور فساحوا في بلاد الروم فأكثروا فيها القتل ودوّخوها وظفروا ظفراً حسناً إلا أن يقظان بن عبد الأعلى بن أحمد بن يزيد بن أسيد السلمي أُصيب؛ ثم خرجت الروم إلى زبطرة في خلافة المعتصم بالله أبي إسحاق بن الرشيد فقتلوا الرجال وسبوا النساء وأخربوها فأحفظه ذلك وأغضبه فغزاهم حتى بلغ عمورية — وقد أخرب قبلها حصوناً فأناخ عليها — حتى فتحها فقتل المقاتلة وسبى النساء والذرية ثم أخربها وأمر ببناء زبطرة وحصّنها وشحنها فرامها الروم بعد ذلك فلم يقدروا عليها. وعند المسعودي خرج توفيل ملك الروم في عساكره ومعه ملوك برجان والبرغر والصقالبة حتى نزل عليها فافتتحها بالسيف وقتل الصغير والكبير وسبى وأغار على بلاد ملطية فضج الناس في الأمصار واستغاثوا في المساجد {cite:muruj-al-dhahab p. 449}"
  en: "In al-Baladhuri: Zibatra was an old Roman fortress taken with the old fortress of al-Hadath by Habib ibn Maslama al-Fihri, standing until the Romans wrecked it in al-Walid ibn Yazid's days; rebuilt unsoundly, the Romans camped on it in Marwan ibn Muhammad's civil war and demolished it; al-Mansur rebuilt it, they damaged it, and al-Rashid rebuilt and garrisoned it through Muhammad ibn Ibrahim; in al-Ma'mun's caliphate the Romans raided it and its people's pasturage, driving off livestock, and al-Ma'mun ordered its repair and fortification; when the Byzantine tyrant's embassy came in year 210 seeking peace he refused and wrote to the frontier governors, who ranged Byzantine lands killing and subduing with handsome success, only Yaqzan ibn Abd al-A'la ibn Ahmad ibn Yazid ibn Asid al-Sulami being hit; then in the caliphate of al-Mu'tasim — Abu Ishaq ibn al-Rashid — the Romans came to Zibatra, killed the men, captured the women and wrecked it, which grieved and angered him so that he raided them as far as Amorium — having destroyed forts before it — camped on it, took it, killed the fighters, captured the women and children, then demolished it and ordered Zibatra rebuilt, fortified and garrisoned, which the Romans afterwards attempted and failed to take."
  es: "En al-Baladhuri: Zibatra era una antigua fortaleza romana tomada junto con la antigua fortaleza de al-Hadath por Habib ibn Maslama al-Fihri, que permaneció en pie hasta que los romanos la destruyeron en tiempos de al-Walid ibn Yazid; reconstruida de forma deficiente, los romanos acamparon en ella durante la guerra civil de Marwan ibn Muhammad y la demolieron; al-Mansur la reconstruyó, la dañaron, y al-Rashid la reconstruyó y la guarneció a través de Muhammad ibn Ibrahim; en el califato de al-Ma'mun los romanos la saquearon y saquearon los pastos de su gente, llevándose el ganado, y al-Ma'mun ordenó su reparación y fortificación; Cuando la embajada del tirano bizantino llegó en el año 210 buscando la paz, él se negó y escribió a los gobernadores fronterizos, quienes recorrieron las tierras bizantinas matando y sometiendo con gran éxito, siendo solo Yaqzan ibn Abd al-A'la ibn Ahmad ibn Yazid ibn Asid al-Sulami quien resultó herido; luego, en el califato de al-Mu'tasim — Abu Ishaq ibn al-Rashid — los romanos llegaron a Zibatra, mataron a los hombres, capturaron a las mujeres y la devastaron, lo que lo enfureció y enfureció de tal manera que los saqueó hasta Amorium —después de haber destruido fortalezas en el camino— acampó allí, la tomó, mató a los combatientes, capturó a las mujeres y los niños, luego la demolió y ordenó que Zibatra fuera reconstruida, fortificada y guarnecida, lo cual los romanos posteriormente intentaron tomar sin éxito."
  fr: "Dans al-Baladhuri: Zibatra était une ancienne forteresse romaine prise avec l'ancienne forteresse d'al-Hadath par Habib ibn Maslama al-Fihri, qui resta debout jusqu'à ce que les Romains la détruisent à l'époque d'al-Walid ibn Yazid; mal reconstruite, les Romains y campèrent pendant la guerre civile de Marwan ibn Muhammad et la démolirent; al-Mansur la reconstruisit, ils l'endommagèrent, et al-Rashid la reconstruisit et la garnit jusqu'à Muhammad ibn Ibrahim; sous le califat d'al-Ma'mun, les Romains la pillèrent ainsi que les pâturages de ses habitants, emportant le bétail, et al-Ma'mun ordonna sa réparation et sa fortification; Lorsque l'ambassade du tyran byzantin arriva en 210 pour demander la paix, il refusa et écrivit aux gouverneurs des frontières, qui parcoururent les terres byzantines, tuant et soumettant avec un succès remarquable, seul Yaqzan ibn Abd al-A'la ibn Ahmad ibn Yazid ibn Asid al-Sulami étant touché; puis, sous le califat d'al-Mu'tasim — Abu Ishaq ibn al-Rashid —, les Romains arrivèrent à Zibatra, tuèrent les hommes, capturèrent les femmes et saccagèrent la ville, ce qui l'affligea et le mit en colère au point qu'il les pilla jusqu'à Amorium — après avoir détruit les forts précédents —, y campa, s'en empara, tua les combattants, captura les femmes et les enfants, puis la démolit et ordonna que Zibatra soit reconstruite, fortifiée et garnie de garnison, ce que les Romains tentèrent ensuite, sans succès, de prendre."
  ur: "البلادوری میں ہے: زیبطرہ ایک پرانا رومی قلعہ تھا جسے حبیب ابن مسلمہ الفہری نے الحدیث کے پرانے قلعے کے ساتھ لیا تھا، جب تک رومیوں نے ولید ابن یزید کے دور میں اسے تباہ نہیں کر دیا تھا۔ ناقص طور پر دوبارہ تعمیر کیا گیا، رومیوں نے مروان بن محمد کی خانہ جنگی میں اس پر پڑاؤ ڈالا اور اسے منہدم کر دیا۔ المنصور نے اسے دوبارہ تعمیر کیا، انہوں نے اسے نقصان پہنچایا، اور الرشید نے اسے محمد بن ابراہیم کے ذریعے دوبارہ تعمیر کیا اور اس کی حفاظت کی۔ مامون کی خلافت میں رومیوں نے اس پر اور اس کے لوگوں کی چراگاہوں پر چھاپہ مارا، مویشیوں کو بھگا دیا، اور مامون نے اس کی مرمت اور قلعہ بندی کا حکم دیا۔ جب بازنطینی ظالم کا سفارت خانہ 210 میں امن کی تلاش میں آیا تو اس نے انکار کر دیا اور سرحدی گورنروں کو لکھا، جنہوں نے بازنطینی سرزمینوں کو قتل و غارت گری میں شاندار کامیابی حاصل کی، صرف یقزان بن عبد العلا بن احمد بن یزید بن اسید السلمی کو نشانہ بنایا گیا۔ پھر معتصم کی خلافت میں - ابو اسحاق بن الرشید - رومی غیبترہ آئے، مردوں کو قتل کیا، عورتوں کو پکڑ لیا اور اسے برباد کر دیا، جس سے وہ غمگین اور غصے میں تھا کہ اس نے عموریم تک ان پر چھاپہ مارا - اس سے پہلے قلعوں کو تباہ کر کے اس پر ڈیرے ڈالے، اس پر قبضہ کیا، اس پر قبضہ کیا، عورتوں کو مار ڈالا، پھر عورتوں کو مار ڈالا، اور عورتوں کو مار ڈالا۔ دوبارہ تعمیر کیا گیا، قلعہ بند کیا گیا اور چھاپا گیا، جسے بعد میں رومیوں نے لینے کی کوشش کی اور ناکام رہے۔"
