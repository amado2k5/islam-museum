id: event/sack-of-zibatra
class: event
kind: raid
label: { ar: "خراب زبطرة وغزوة المعتصم", en: "The Sack of Zibatra and al-Mu'tasim's Retaliation" }
summary:
  ar: "عند البلاذري: كانت زبطرة حصناً قديماً رومياً فُتح مع حصن الحدث القديم فتحه حبيب بن مسلمة الفهري وكان قائماً إلى أن أخربته الروم في أيام الوليد بن يزيد فبُني بناء غير محكم فأناخت الروم عليه في أيام فتنة مروان بن محمد فهدمته فبناه المنصور ثم خرجت إليه فشعثته فبناه الرشيد على يدي محمد بن إبراهيم وشحنه، فلما كانت خلافة المأمون طرقه الروم فشعثوه وأغاروا على سرح أهله فاستاقوا لهم مواشي فأمر المأمون بمرمّته وتحصينه، وقدم وفد طاغية الروم في سنة 210 يسأل الصلح فلم يجبه إليه وكتب إلى عمّال الثغور فساحوا في بلاد الروم فأكثروا فيها القتل ودوّخوها وظفروا ظفراً حسناً إلا أن يقظان بن عبد الأعلى بن أحمد بن يزيد بن أسيد السلمي أُصيب؛ ثم خرجت الروم إلى زبطرة في خلافة المعتصم بالله أبي إسحاق بن الرشيد فقتلوا الرجال وسبوا النساء وأخربوها فأحفظه ذلك وأغضبه فغزاهم حتى بلغ عمورية — وقد أخرب قبلها حصوناً فأناخ عليها — حتى فتحها فقتل المقاتلة وسبى النساء والذرية ثم أخربها وأمر ببناء زبطرة وحصّنها وشحنها فرامها الروم بعد ذلك فلم يقدروا عليها."
  en: "In al-Baladhuri: Zibatra was an old Roman fortress taken with the old fortress of al-Hadath by Habib ibn Maslama al-Fihri, standing until the Romans wrecked it in al-Walid ibn Yazid's days; rebuilt unsoundly, the Romans camped on it in Marwan ibn Muhammad's civil war and demolished it; al-Mansur rebuilt it, they damaged it, and al-Rashid rebuilt and garrisoned it through Muhammad ibn Ibrahim; in al-Ma'mun's caliphate the Romans raided it and its people's pasturage, driving off livestock, and al-Ma'mun ordered its repair and fortification; when the Byzantine tyrant's embassy came in year 210 seeking peace he refused and wrote to the frontier governors, who ranged Byzantine lands killing and subduing with handsome success, only Yaqzan ibn Abd al-A'la ibn Ahmad ibn Yazid ibn Asid al-Sulami being hit; then in the caliphate of al-Mu'tasim — Abu Ishaq ibn al-Rashid — the Romans came to Zibatra, killed the men, captured the women and wrecked it, which grieved and angered him so that he raided them as far as Amorium — having destroyed forts before it — camped on it, took it, killed the fighters, captured the women and children, then demolished it and ordered Zibatra rebuilt, fortified and garrisoned, which the Romans afterwards attempted and failed to take."
