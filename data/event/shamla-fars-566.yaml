summary:
  ar: "ملك شملة — وهو من أمراء الخزرج الأتراك — بلاد فارس على أهلها، ثم اجتمعوا عليه فأخرجوه عنها واستردّوها، وكانت فارس يومئذ دولة للسلغريين من أتراك الخزرج يتداولونها بعد انقراض البويهيين {cite:kamil-ibn-al-athir p. 19}."
  en: "Shamla, an emir of the Khazarj Turks, took Fārs, then its people rose together and expelled him — Fārs then being the disputed prize of the Salghurid atabegs after the Buyids' extinction {cite:kamil-ibn-al-athir p. 19}."
  es: "Shamla, un emir de los turcos jázaros, tomó Fārs, entonces su pueblo se levantó en bloque y lo expulsó; Fārs era entonces el premio disputado de los atabegs salghuridas después de la extinción de los buyíes {cite:kamil-ibn-al-athir p. 19}."
  fr: "Shamla, un émir des Turcs Khazarj, prit Fārs, puis son peuple se souleva et l'expulsa — Fārs étant alors le prix contesté des atabegs Salghurides après l'extinction des Bouyides {cite:kamil-ibn-al-athir p. 19}."
  ur: "خزرج ترکوں کے ایک امیر شملہ نے فارس پر قبضہ کیا، پھر اس کے لوگ اکٹھے ہوئے اور اسے ملک بدر کر دیا - فارس پھر خریداروں کے معدوم ہونے کے بعد سلغوری اطابیوں کا متنازعہ انعام تھا۔ 19}۔"
