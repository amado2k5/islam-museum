label:
  ar: "أول رحلة أبي داود: بغداد والبصرة ومكة ٢٢٠هـ"
  en: "Abu Dawud's first journey: Baghdad, Basra and Mecca, 220/835"
  ur: "ابو داؤد کا پہلا سفر: بغداد، بصرہ اور مکہ، 220ھ/835ء"
summary:
  ar: "قال أبو عبيد الآجري عن أبي داود: صلّيت على عفّان ببغداد سنة عشرين، ودخلت البصرة وهم يقولون أمس مات عثمان بن الهيثم المؤذن — وقد مات في رجب سنة عشرين — وسمعت من أبي عمرو الضرير مجلساً واحداً، وتبعت عمر بن حفص بن غياث إلى منزله فلم أسمع منه؛ وسمع بمكة أيام الحج سنة عشرين من القعنبي وسليمان بن حرب وجماعة {cite:tarikh-islam-dhahabi p. 358}."
  en: "In his own words, reported by Abu Ubayd al-Ajurri: he prayed over 'Affan at Baghdad in 220; he entered Basra as they were saying Uthman ibn al-Haytham the mu'adhdhin had died the day before — he had died in Rajab 220 — hearing Abu 'Amr al-Darir in a single session and following 'Umar ibn Hafs ibn Ghiyath home without hearing him; and at Mecca, in the pilgrimage days of 220, he heard al-Qa'nabi, Sulayman ibn Harb and others {cite:tarikh-islam-dhahabi p. 358}."
  ur: "ابو عبید آجری کے واسطے سے ان کے اپنے الفاظ: میں نے 220ھ میں بغداد میں عفان کی نماز جنازہ پڑھی؛ اور بصرہ داخل ہوا جب لوگ کہہ رہے تھے کہ کل عثمان بن ہیثم مؤذن فوت ہو گیا — وہ رجب 220ھ میں فوت ہوئے — اور ابو عمرو ضریر سے ایک مجلس سنی، اور عمر بن حفص بن غیاث کے پیچھے ان کے گھر گیا مگر سماعت نہیں ہوئی؛ اور مکہ میں 220ھ کے ایام حج میں قعنبی، سلیمان بن حرب اور دیگر سے سماعت کی {cite:tarikh-islam-dhahabi p. 358}۔"
