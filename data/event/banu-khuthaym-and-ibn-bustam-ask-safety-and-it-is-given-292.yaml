id: event/banu-khuthaym-and-ibn-bustam-ask-safety-and-it-is-given-292
class: event
kind: other
label:
  ar: "طلب بني خثيمة وابن بسطام الأمان لبني الحارث وإعطاؤهم إياه، ص294"
  en: "Banu Khuthaym and Ibn Bustam ask safety for Banu al-Harith and it is given, p. 294"
  ur: "بنو خثیمہ اور ابن بسطام کا بنو حارث کے لیے امان مانگنا اور اس کا دیا جانا، ص294"
  fr: "Les Banu Khuthaym et Ibn Bustam demandent la sauvegarde pour les Banu al-Harith, et elle est accordée, p. 294"
  es: "Banu Khuthaym e Ibn Bustam piden protección para Banu al-Harith y se les concede, pág. 294."
  tr: "Beni Hatim ve İbn Bistam, Beni el-Harith'in güvenli geçişini talep etmiş ve bu talepleri kabul edilmiştir (s. 294)."
  id: "Bani Khathima dan Ibnu Bistam meminta dan mengabulkan permohonan Bani al-Harith agar dapat melewati jalan yang aman, hlm. 294"
summary:
  ar: "لما رأت بنو خثيمة قطع النخل قالوا لابن حميد إما أن يطلب لهم الأمان مجتمعين وإما أن يفترقوا، فرضي وسعى ابن بسطام لهم عند الهادي، فآمنهم ولقيهم محمد بن عبيد الله ودخل وجوه بني الحارث على الهادي فاستأمنوا وطلبوا مهلة يومين لإخراج حرمهم."
  en: "When Banu Khuthaym saw the palms cut they told Ibn Humayd either to seek safety for them together or let each seek it separately; he agreed and Ibn Bustam pleaded for them with al-Hadi, who gave them safety, Muhammad ibn Ubaydallah met them and the notables of Banu al-Harith went in to al-Hadi, took safety and asked two days to bring out their womenfolk."
  ur: "جب بنو خثیمہ نے کھجوریں کٹتی دیکھیں تو ابن حمید سے کہا کہ یا تو سب کے لیے مل کر امان مانگ، یا ہم الگ ہو کر ہر کوئی اپنی امان مانگے؛ وہ مان گیا اور ابن بسطام نے ہادی کے پاس ان کی سفارش کی، ہادی نے امان دی، محمد بن عبید اللہ ان سے ملے اور بنو حارث کے معززین ہادی کے پاس گئے، امان لی اور اپنی عورتوں کو نکالنے کے لیے دو دن کی مہلت مانگی۔"
  fr: "Quand les Banu Khuthaym virent les palmiers coupés, ils dirent à Ibn Humayd de demander la sauvegarde pour eux tous ensemble, ou de laisser chacun la demander séparément ; il accepta et Ibn Bustam plaida pour eux auprès d'al-Hadi, qui leur donna la sauvegarde ; Muhammad ibn Ubaydallah les rencontra et les notables des Banu al-Harith entrèrent chez al-Hadi, reçurent la sauvegarde et demandèrent deux jours pour faire sortir leurs femmes."
  es: "Cuando los Banu Khuthaym vieron que les cortaban las palmas, le dijeron a Ibn Humayd que buscara protección para ellos juntos o que cada uno la buscara por separado; él estuvo de acuerdo e Ibn Bustam intercedió por ellos ante al-Hadi, quien les concedió protección. Muhammad ibn Ubaydallah se reunió con ellos y los notables de Banu al-Harith fueron a ver a al-Hadi, obtuvieron protección y pidieron dos días para sacar a sus mujeres."
  tr: "Beni Hatim kabilesi hurma ağaçlarının kesildiğini görünce İbn Hamid'e ya hep birlikte kendileri için güvenlik istemesini ya da ayrılmalarını söylediler. İbn Hamid kabul etti ve İbn Bistam onların adına Hadid'e gitti, böylece Hadid onlara güvenlik sağladı. Muhammed ibn Ubeyd Allah onlarla görüştü ve Beni el-Harith kabilesinin liderleri Hadid'e giderek güvenlik istediler ve kadınlarını çıkarmak için iki günlük süre talep ettiler."
  id: "Ketika Bani Khathima melihat pohon-pohon kurma ditebang, mereka memberi tahu Ibnu Hamid bahwa ia harus meminta keselamatan bagi mereka semua secara bersama-sama atau mereka harus berpisah. Ia setuju, dan Ibnu Bistam pergi ke al-Hadi atas nama mereka, sehingga al-Hadi memberi mereka keselamatan. Muhammad ibn Ubayd Allah menemui mereka, dan para pemimpin Bani al-Harith pergi ke al-Hadi, lalu mereka meminta keselamatan dan memohon waktu tenggang dua hari untuk mengeluarkan para wanita mereka."
