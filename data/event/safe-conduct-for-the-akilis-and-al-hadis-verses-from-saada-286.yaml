id: event/safe-conduct-for-the-akilis-and-al-hadis-verses-from-saada-286
class: event
kind: other
label:
  ar: أمان الأكيليين وشعر الهادي من صعدة قبل المسير إلى نجران، 286هـ
  en: The safe-conduct for the Akilis and al-Hadi's verses from Sa'da before the march to Najran, 286 AH
  ur: اکیلیوں کو امان اور نجران کی روانگی سے پہلے صعدہ سے ہادی کے اشعار، 286ھ
  es: "El salvoconducto para los Akilis y los versículos de al-Hadi de Sa'da antes de la marcha a Najrán, 286 AH"
  fr: "Le sauf-conduit pour les Akilis et les vers d'al-Hadi de Sa'da avant la marche sur Najran, 286 AH"
  tr: "Aman al-Akiliyin ve Sa'de'den al-Hadi'nin şiirleri, Necran yolculuğundan önce, Hicri 286"
  id: "Aman al-Akiliyin dan puisi al-Hadi dari Sa'dah sebelum perjalanan ke Najran, 286 H"
summary:
  ar: في الغد يدخل الزبير الكليبي والوليد بن حيان الجماعي ونفر من اليرسميين على الهادي ويطلبون الأمان للأكيليين فيجيبهم، ويأتيه عباد الأكيلي ووجوه الربيعة، ويتخلف أحمد بن عباد ويخرج إلى علاف، ثم يأمر الهادي بالتأهب للخروج إلى نجران ويكتب إلى أبي محمد بوصوله صعدة وخبر الأكيلي ويرفق كتابه بشعر.
  en: Next day al-Zubayr al-Kulaybi, al-Walid ibn Hayyan al-Jama'i and some Yarsamis go in to al-Hadi and ask safe-conduct for the Akilis, which he grants; Abbad al-Akili and the notables of al-Rabi'a come to him while Ahmad ibn Abbad stays away and goes out to Allaf; al-Hadi then orders readiness for Najran and writes to Abu Muhammad of his arrival at Sa'da and of the Akili affair, with a poem.
  ur: اگلے دن زبیر کلیبی، ولید بن حیان جماعی اور یرسمیوں کے کچھ لوگ ہادی کے پاس آ کر اکیلیوں کے لیے امان مانگتے ہیں جو وہ دے دیتے ہیں؛ عباد اکیلی اور ربیعہ کے معززین آتے ہیں جبکہ احمد بن عباد نہیں آتا اور علاف کی طرف نکل جاتا ہے؛ پھر ہادی نجران کے لیے تیاری کا حکم دیتے ہیں اور ابو محمد کو صعدہ پہنچنے اور اکیلی کی خبر لکھتے ہیں، ساتھ ایک قصیدہ بھی۔
  es: "Al día siguiente, al-Zubayr al-Kulaybi, al-Walid ibn Hayyan al-Jama'i y algunos Yarsamis se presentan ante al-Hadi y solicitan salvoconducto para los Akilis, el cual él concede; Abbad al-Akili y los notables de al-Rabi'a acuden a él, mientras que Ahmad ibn Abbad se mantiene alejado y se dirige a Allaf; al-Hadi ordena entonces que se preparen para Najran y escribe a Abu Muhammad sobre su llegada a Sa'da y sobre el asunto de los Akilis, incluyendo un poema."
  fr: "Le lendemain, al-Zubayr al-Kulaybi, al-Walid ibn Hayyan al-Jama'i et quelques Yarsamis se rendent auprès d'al-Hadi et lui demandent un sauf-conduit pour les Akilis, qu'il leur accorde; Abbad al-Akili et les notables d'al-Rabi'a viennent à lui tandis qu'Ahmad ibn Abbad reste à l'écart et se rend à Allaf; al-Hadi ordonne alors de se préparer pour Najran et écrit à Abu Muhammad pour lui faire part de son arrivée à Sa'da et de l'affaire des Akilis, en y joignant un poème."
  tr: "Ertesi gün, El-Zübeyr El-Kulaibi, El-Velid bin Hayyan El-Cemaî ve bir grup Yarsamî, El-Hadi'nin yanına gelerek Akililer için güvenlik istediler ve o da onlara cevap verdi. Ardından Abbad El-Akili ve Rabi'ah'ın ileri gelenleri ona geldiler, Ahmed bin Abbad ise geride kalıp Allaf'a gitti. Daha sonra El-Hadi, Necran'a gitmek için hazırlıklar yapılmasını emretti ve Sa'de'ye varışını ve El-Akili'nin haberini Ebu Muhammed'e yazdı ve mektubuna şiir ekledi."
  id: "Keesokan harinya, Al-Zubayr Al-Kulaibi, Al-Walid bin Hayyan Al-Jama’i, dan sekelompok Yarsamis menemui Al-Hadi dan meminta keselamatan bagi kaum Akili, dan beliau mengabulkan permintaan mereka. Kemudian Abbad Al-Akili dan para tokoh terkemuka Rabi’ah datang menemuinya, dan Ahmad bin Abbad tinggal di belakang dan pergi ke Allaf. Kemudian Al-Hadi memerintahkan persiapan untuk pergi ke Najran dan menulis surat kepada Abu Muhammad tentang kedatangannya di Sa’dah dan kabar tentang Al-Akili, dan beliau melampirkan puisi pada suratnya."
