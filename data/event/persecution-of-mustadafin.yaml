id: event/persecution-of-mustadafin
class: event
kind: persecution
label: { en: "The persecution of the vulnerable Muslims", ar: "اضطهاد المستضعفين", es: "La persecución de los musulmanes vulnerables", fr: "La persécution des musulmans vulnérables", ur: "کمزور مسلمانوں پر ظلم و ستم", tr: "Savunmasızların ezilmesi", id: "Penindasan terhadap kelompok rentan" }
summary:
  en: "After mockery and bargaining failed, a twenty-five-man committee of Quraysh's chiefs headed by Abu Lahab resolved to fight Islam and torture its adherents; the clanless and enslaved Muslims bore the worst — Bilal under the midday rocks, the family of Yasir, Sumayya the first martyr speared by Abu Jahl, Abu Fakiha, Khabbab, and slave women whom Abu Bakr bought and freed."
  ar: "بعد إخفاق السخرية والمساومة كوّن المشركون لجنة من خمسة وعشرين من سادات قريش رئيسها أبو لهب تقرر محاربة الإسلام وإيذاء رسوله وتعذيب الداخلين فيه؛ فكان أشد البلاء على المستضعفين — بلال تحت صخور الهاجرة، وآل ياسر، وسمية أول شهيدة طعنها أبو جهل بحربة، وأبو فكيهة وخباب والإماء اللواتي ابتاعهن أبو بكر فأعتقهن."
  es: "Tras fracasar las burlas y las negociaciones, un comité de veinticinco jefes de Quraysh, encabezado por Abu Lahab, decidió combatir el Islam y torturar a sus seguidores; los musulmanes sin clan y esclavizados fueron los que peor lo pasaron: Bilal bajo las rocas del mediodía, la familia de Yasir, Sumayya, la primera mártir lanceada por Abu Jahl, Abu Fakiha, Khabbab y las mujeres esclavas que Abu Bakr compró y liberó."
  fr: "Après l'échec des moqueries et des négociations, un comité de vingt-cinq chefs de Quraysh dirigé par Abu Lahab décida de combattre l'islam et de torturer ses adeptes; les musulmans sans clan et réduits en esclavage subirent le pire — Bilal sous les rochers de midi, la famille de Yasir, Sumayya, le premier martyr transpercé par la lance d'Abu Jahl, Abu Fakiha, Khabbab et les femmes esclaves qu'Abu Bakr avait achetées et affranchies."
  ur: "تمسخر اور سودے بازی ناکام ہونے کے بعد، ابو لہب کی سربراہی میں قریش کے سرداروں کی ایک پچیس رکنی کمیٹی نے اسلام سے لڑنے اور اس کے ماننے والوں کو اذیت دینے کا عزم کیا۔ قبیلہ کے بغیر اور غلام مسلمانوں نے سب سے زیادہ نقصان اٹھایا - دوپہر کے پتھروں کے نیچے بلال، یاسر کا خاندان، سمیہ پہلی شہید جو ابو جہل کے ہاتھوں بچائی گئی، ابو فکیہ، خباب، اور لونڈی جن کو ابوبکر نے خرید کر آزاد کیا تھا۔"
  tr: "Alay ve pazarlık girişimlerinin başarısız olmasının ardından, müşrikler, Ebu Lahab önderliğinde Kureyş'in yirmi beş liderinden oluşan bir komite kurdular ve İslam'la savaşmaya, Peygamberine zarar vermeye ve İslam'a girenleri işkenceye maruz bırakmaya karar verdiler. En büyük azap ise zayıfların başına geldi: Öğlen sıcağında kayalıkların altında kalan Bilal, Yasir'in ailesi, Ebu Cehl'in mızrakla bıçakladığı ilk şehit Sumeyye, Ebu Fukayha, Habbab ve Ebu Bekir'in satın alıp sonra azat ettiği cariyeler."
  id: "Setelah upaya ejekan dan tawar-menawar gagal, kaum politeis membentuk komite yang terdiri dari dua puluh lima pemimpin Quraisy, dipimpin oleh Abu Lahab, yang memutuskan untuk memerangi Islam, mencelakai Rasulnya, dan menyiksa orang-orang yang memeluknya. Penderitaan yang paling berat ditimpakan kepada yang lemah - Bilal di bawah terik matahari siang, keluarga Yasir, Sumayya, syuhada pertama yang ditusuk Abu Jahl dengan tombak, Abu Fukayha, Khabbab, dan para budak perempuan yang dibeli Abu Bakr lalu dibebaskan."
