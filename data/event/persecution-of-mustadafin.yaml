id: event/persecution-of-mustadafin
class: event
kind: persecution
label: { en: "The persecution of the vulnerable Muslims", ar: "اضطهاد المستضعفين" }
summary:
  en: "After mockery and bargaining failed, a twenty-five-man committee of Quraysh's chiefs headed by Abu Lahab resolved to fight Islam and torture its adherents; the clanless and enslaved Muslims bore the worst — Bilal under the midday rocks, the family of Yasir, Sumayya the first martyr speared by Abu Jahl, Abu Fakiha, Khabbab, and slave women whom Abu Bakr bought and freed."
  ar: "بعد إخفاق السخرية والمساومة كوّن المشركون لجنة من خمسة وعشرين من سادات قريش رئيسها أبو لهب تقرر محاربة الإسلام وإيذاء رسوله وتعذيب الداخلين فيه؛ فكان أشد البلاء على المستضعفين — بلال تحت صخور الهاجرة، وآل ياسر، وسمية أول شهيدة طعنها أبو جهل بحربة، وأبو فكيهة وخباب والإماء اللواتي ابتاعهن أبو بكر فأعتقهن."
wings: [time]
periods: [period/prophetic-era]
regions: [arabia]
date:
  start: { edtf: "0613~", calendar: julian, precision: year, status: tradition, note: "بداية السنة الرابعة من النبوة وما بعدها (الرحيق ص85)." }
  end: { edtf: "0622~", calendar: julian, precision: year, status: tradition }
significance:
  ar: "مات ياسر في العذاب وطعن أبو جهل سمية في قبلها بحربة فكانت أول شهيدة في الإسلام؛ وابتاع أبو بكر بلالاً وعامر بن فهيرة والإماء المسلمات فأعتقهن (الرحيق ص90-91)."
