label:
  ar: "أول خطبة لابن قيم الجوزية في جامع نديم الدين بالغوطة، ٢ رجب ٧٣٦هـ/١٥ فبراير ١٣٣٦م"
  en: "Ibn Qayyim's first khutba at Nadim al-Din's mosque in the Ghuta, 2 Rajab 736/15 February 1336"
  ur: "ابن قیم کا پہلا خطبہ، ندیم الدین کی مسجد غوطہ میں، 2 رجب 736ھ/15 فروری 1336ء"
summary:
  ar: "ألقى ابن قيم الجوزية أول خطبة له في ٢ رجب ٧٣٦هـ/١٥ فبراير ١٣٣٦م في الجامع الذي كان نديم الدين بن خلخان قد أسّسه حديثاً في بساتين الغوطة خارج باب شرقي وباب تومى {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}."
  en: "On 2 Rajab 736/15 February 1336 Ibn Qayyim delivered his first khutba in the mosque that Nadim al-Din ibn Khalikhan had recently founded in the gardens of the Ghuta, outside Bab Sharqi and Bab Tuma {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}."
  ur: "2 رجب 736ھ/15 فروری 1336ء کو ابن قیم نے اپنا پہلا خطبہ اس مسجد میں دیا جو ندیم الدین بن خلخان نے ابتداءً غوطہ کے باغات میں باب شرقی اور باب توما سے باہر قائم کی تھی {cite:encyclopaedia-of-islam-2 vol. 3 p. 854}۔"
