label: { ar: "فتح طبرستان", en: "Conquest of Tabaristan" }
summary:
  ar: "ولّى عثمان سعيد بن العاص الكوفة سنة تسع وعشرين فكتب مرزبان طوس إليه وإلى عبد الله بن عامر وهو على البصرة يدعوهما إلى خراسان على أن يملكه عليها أيهما غلب وظفر فخرج ابن عامر يريدها وخرج سعيد فسبقه ابن عامر فغزا سعيد طبرستان ومعه في غزاته فيما يقال الحسن والحسين ابنا علي وقيل غزاها بغير كتاب أتاه من أحد ففتح طميسة ونامنة وهي قرية وصالح ملك جرجان على مائتي ألف درهم."
  en: "When Uthman made Sa'id ibn al-As governor of Kufa in 29 AH, the marzban of Tus wrote both him and Abdallah ibn Amir of Basra inviting them to Khurasan — whichever prevailed would hold it; Ibn Amir outstripped him, so Sa'id raided Tabaristan — with him, it is said, al-Hasan and al-Husayn the sons of Ali, though others say he raided on no writ at all — taking Tamisa and the village Namna and treating Jurjan's king for two hundred thousand dirhams."
