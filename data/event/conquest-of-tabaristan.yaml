label: { ar: "فتح طبرستان", en: "Conquest of Tabaristan", es: "Conquista de Tabaristán", fr: "Conquête du Tabaristan", ur: "طبرستان کی فتح", tr: "Tabaristan'ın Fethi", id: "Penaklukan Tabaristan" }
summary:
  ar: "ولّى عثمان سعيد بن العاص الكوفة سنة تسع وعشرين فكتب مرزبان طوس إليه وإلى عبد الله بن عامر وهو على البصرة يدعوهما إلى خراسان على أن يملكه عليها أيهما غلب وظفر فخرج ابن عامر يريدها وخرج سعيد فسبقه ابن عامر فغزا سعيد طبرستان ومعه في غزاته فيما يقال الحسن والحسين ابنا علي وقيل غزاها بغير كتاب أتاه من أحد ففتح طميسة ونامنة وهي قرية وصالح ملك جرجان على مائتي ألف درهم."
  en: "When Uthman made Sa'id ibn al-As governor of Kufa in 29 AH, the marzban of Tus wrote both him and Abdallah ibn Amir of Basra inviting them to Khurasan — whichever prevailed would hold it; Ibn Amir outstripped him, so Sa'id raided Tabaristan — with him, it is said, al-Hasan and al-Husayn the sons of Ali, though others say he raided on no writ at all — taking Tamisa and the village Namna and treating Jurjan's king for two hundred thousand dirhams."
  es: "Cuando Uthman nombró a Sa'id ibn al-As gobernador de Kufa en el año 29 de la Hégira, el marzban de Tus les escribió a él y a Abdallah ibn Amir de Basora invitándolos a Jorasán; quien prevaleciera se quedaría con la ciudad. Ibn Amir lo superó, por lo que Sa'id saqueó Tabaristán, con él, según se dice, al-Hasan y al-Husayn, hijos de Ali, aunque otros dicen que saqueó sin ninguna orden judicial, tomando Tamisa y la aldea de Namna y ofreciendo al rey de Jurjan doscientos mil dirhams."
  fr: "Lorsque Uthman nomma Sa'id ibn al-As gouverneur de Kufa en 29 AH, le marzban de Tus écrivit à la fois à lui et à Abdallah ibn Amir de Basra pour les inviter au Khorasan — celui qui l'emporterait le conserverait; Ibn Amir le devança, alors Sa'id pilla le Tabaristan — avec lui, dit-on, al-Hasan et al-Husayn, les fils d'Ali, bien que d'autres disent qu'il pilla sans aucun mandat — prenant Tamisa et le village de Namna et traitant le roi de Jurjan pour deux cent mille dirhams."
  ur: "جب عثمان نے 29 ہجری میں سعید بن العاص کو کوفہ کا گورنر بنایا تو طوس کے مرزبان نے انہیں اور بصرہ کے عبداللہ بن عامر دونوں کو خراسان میں مدعو کرتے ہوئے لکھا - جو بھی غالب آئے گا اسے برقرار رکھے گا۔ ابن عامر اس سے آگے نکل گیا، تو سعید نے طبرستان پر چڑھائی کی - اس کے ساتھ، کہا جاتا ہے کہ علی کے بیٹے الحسن اور الحسین تھے، حالانکہ دوسرے کہتے ہیں کہ اس نے بغیر کسی تحریر کے چھاپہ مارا تھا - تمیسہ اور گاؤں نمنہ کو لے لیا اور جرجان کے بادشاہ سے دو لاکھ درہم کا علاج کیا۔"
  tr: "Osman, 29. yılda Said bin el-As'ı Kufa valisi olarak atadı. Tuslu Marzban, Said bin el-As'a ve Basra'da bulunan Abdullah bin Âmer'e mektup yazarak, hangisi galip gelirse Horasan'ı kendisinin yöneteceğine dair bir şartla onları Horasan'a davet etti. İbn Âmer oraya gitmek niyetiyle yola çıktı, Said de yola çıktı, ancak İbn Âmer ondan önce gitti. Said, Tabaristan'a baskın düzenledi ve bu baskında yanında Ali'nin oğulları Hasan ve Hüseyin'in de olduğu söylenir. Kimseden mektup almadan bu baskını düzenlediği rivayet edilir. Tamisa ve Namna adlı bir köyü fethetti ve Jurcan kralıyla iki yüz bin dirhem karşılığında barış yaptı."
  id: "Utsman mengangkat Saeed bin Al-Aas sebagai gubernur Kufa pada tahun 29. Marzban dari Tus menulis surat kepadanya dan kepada Abdullah bin Amer, yang berada di Basra, mengundang mereka ke Khorasan dengan syarat bahwa ia akan memerintahnya, siapa pun di antara mereka yang menang dan berjaya. Ibn Amer berangkat dengan maksud untuk pergi ke sana, dan Saeed pun berangkat, tetapi Ibn Amer mendahuluinya. Saeed menyerbu Tabaristan, dan konon bersamanya dalam penyerbuan itu adalah Al-Hasan dan Al-Hussein, putra-putra Ali. Konon ia menyerbu tanpa menerima surat dari siapa pun. Ia menaklukkan Tamisa dan Namna, yang merupakan sebuah desa, dan berdamai dengan raja Jurjan dengan imbalan dua ratus ribu dirham."
