label: { ar: "ثورة القاهرة الأولى على الفرنسيس سنة 1213هـ ⁦(1798م)⁩", en: "The first Cairo revolt against the French, 1213 AH (1798)", ur: "1213ھ (1798ء) میں فرانسیسیوں کے خلاف قاہرہ کی پہلی بغاوت" }
summary:
  ar: "قيام عامة القاهرة على الفرنسيين يوم الأحد الحادي عشر من جمادى الأولى سنة 1213هـ، كما يرويه الجبرتي: بعد أن قرر الفرنسيون ضريبة على الأملاك والعقار اجتمع جمع من غير رئيس، وقتلوا الجنرال «دبوي»، وأقاموا المتاريس في الأحياء الداخلية، فضرب الفرنسيون المدينة والجامع الأزهر بالمدافع والقنابر من القلعة والتلال، ثم دخلوا الأزهر بخيولهم ليلاً، واشتد بعد ذلك تتبع المتهمين {cite:ajaib-al-athar-moreh-v3 p.59} {cite:ajaib-al-athar-moreh-v3 p.60} {cite:ajaib-al-athar-moreh-v3 p.61} {cite:ajaib-al-athar-moreh-v3 p.62}."
  en: "The rising of the common people of Cairo against the French on Sunday 11 Jumada I 1213 AH, as al-Jabarti tells it: after the French imposed a tax on houses and property, a crowd without a leader gathered, killed General Dupuy and barricaded the inner quarters; the French bombarded the city and al-Azhar with cannon and mortars from the Citadel and the hills, entered al-Azhar on horseback at night, and then hunted down those they suspected."
