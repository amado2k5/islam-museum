label: { ar: "ثورة القاهرة الأولى على الفرنسيس سنة 1213هـ ⁦(1798م)⁩", en: "The first Cairo revolt against the French, 1213 AH (1798)", ur: "1213ھ ⁦(1798ء)⁩ میں فرانسیسیوں کے خلاف قاہرہ کی پہلی بغاوت", es: "La primera revuelta de El Cairo contra los franceses, 1213 AH (1798).", fr: "La première révolte du Caire contre les Français, 1213 AH (1798)", tr: "Hicri 1213'te (Miladi 1798) Kahire'de Fransızlara karşı ilk isyan.", id: "Pemberontakan Kairo pertama melawan Prancis pada tahun 1213 H (1798 M)" }
summary:
  ar: "قيام عامة القاهرة على الفرنسيين يوم الأحد الحادي عشر من جمادى الأولى سنة 1213هـ، كما يرويه الجبرتي: بعد أن قرر الفرنسيون ضريبة على الأملاك والعقار اجتمع جمع من غير رئيس، وقتلوا الجنرال «دبوي»، وأقاموا المتاريس في الأحياء الداخلية، فضرب الفرنسيون المدينة والجامع الأزهر بالمدافع والقنابر من القلعة والتلال، ثم دخلوا الأزهر بخيولهم ليلاً، واشتد بعد ذلك تتبع المتهمين {cite:ajaib-al-athar-moreh-v3 p.59} {cite:ajaib-al-athar-moreh-v3 p.60} {cite:ajaib-al-athar-moreh-v3 p.61} {cite:ajaib-al-athar-moreh-v3 p.62}."
  en: "The rising of the common people of Cairo against the French on Sunday 11 Jumada I 1213 AH, as al-Jabarti tells it: after the French imposed a tax on houses and property, a crowd without a leader gathered, killed General Dupuy and barricaded the inner quarters; the French bombarded the city and al-Azhar with cannon and mortars from the Citadel and the hills, entered al-Azhar on horseback at night, and then hunted down those they suspected."
  es: "El levantamiento del pueblo llano de El Cairo contra los franceses el domingo 11 de Jumada I de 1213 AH, según relata al-Jabarti: después de que los franceses impusieran un impuesto sobre las casas y las propiedades, una multitud sin líder se reunió, mató al general Dupuy y barricó los barrios interiores; los franceses bombardearon la ciudad y al-Azhar con cañones y morteros desde la Ciudadela y las colinas, entraron en al-Azhar a caballo por la noche y luego persiguieron a los que sospechaban."
  fr: "Le soulèvement du peuple du Caire contre les Français le dimanche 11 Jumada I 1213 AH, tel que rapporté par al-Jabarti: après que les Français eurent imposé une taxe sur les maisons et les biens, une foule sans chef se rassembla, tua le général Dupuy et barricada les quartiers intérieurs; les Français bombardèrent la ville et al-Azhar avec des canons et des mortiers depuis la Citadelle et les collines, entrèrent dans al-Azhar à cheval pendant la nuit, puis traquèrent ceux qu'ils soupçonnaient."
  ur: "اتوار 11 جمادی الثانی 1213 ہجری کو فرانسیسیوں کے خلاف قاہرہ کے عام لوگوں کا اٹھنا، جیسا کہ الجبارتی نے بتایا ہے: جب فرانسیسیوں نے مکانات اور املاک پر ٹیکس عائد کیا تو، بغیر لیڈر کے ایک ہجوم نے اکٹھا کیا، جنرل دوپوئے کو قتل کر دیا اور اندرونی حلقوں میں رکاوٹیں کھڑی کر دیں۔ فرانسیسیوں نے قلعہ اور پہاڑیوں سے توپوں اور مارٹروں سے شہر اور الازہر پر بمباری کی، رات کے وقت گھوڑوں پر سوار الازہر میں داخل ہوئے، اور پھر ان لوگوں کا شکار کیا جن پر انہیں شبہ تھا۔"
  tr: "El-Cabarti'nin rivayetine göre, Kahire halkının Fransızlara karşı ayaklanması Hicri 1213 yılının Cemadi el-Ula ayının 11. Pazar günü gerçekleşti: Fransızlar mülklere ve gayrimenkullere vergi koyduktan sonra, öndersiz bir grup toplandı, General Dupuy'u öldürdü ve iç mahallelerde barikatlar kurdu. Bunun üzerine Fransızlar, kaleden ve tepelerden top ve bombalarla şehri ve El-Azhar Camii'ni bombaladı. Daha sonra geceleyin at sırtında El-Azhar'a girdiler ve ardından suçluların takibi yoğunlaştı."
  id: "Pemberontakan rakyat Kairo melawan Prancis pada hari Minggu, tanggal sebelas Jumada al-Ula, 1213 H, sebagaimana diriwayatkan oleh al-Jabarti: Setelah Prancis mengenakan pajak atas properti dan real estat, sekelompok orang berkumpul tanpa pemimpin, membunuh Jenderal Dupuy, dan mendirikan barikade di lingkungan dalam kota. Kemudian Prancis membombardir kota dan Masjid al-Azhar dengan meriam dan bom dari Benteng dan perbukitan. Mereka kemudian memasuki al-Azhar dengan menunggang kuda pada malam hari, dan setelah itu pengejaran terhadap para pelaku semakin intensif."
