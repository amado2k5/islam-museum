label: { ar: "فتح أصبهان", en: "The Conquest of Isbahan", es: "La conquista de Isbahan", fr: "La conquête d'Isbahan", ur: "اسبہان کی فتح", tr: "İsfahan'ın Fethi", id: "Penaklukan Isfahan" }
summary:
  ar: "عند البلاذري: وجه عمر بن الخطاب عبد الله بن بديل بن ورقاء الخزاعي إلى أصبهان سنة 23 ويقال بل كتب عمر إلى أبي موسى الأشعري يأمره بتوجيهه في جيش ففتح عبد الله بن بديل جي صلحاً بعد قتال على أن يؤدي أهلها الخراج والجزية وعلى أن يؤمنوا على أنفسهم وأموالهم خلا ما في أيديهم من السلاح ووجه عبد الله بن بديل الأحنف بن قيس وكان في جيشه إلى اليهودية فصالحه أهلها على مثل ذلك الصلح وغلب بن بديل على أرض أصبهان وطساسيجها وكان العامل عليها إلى أن مضت من خلافة عثمان سنة ثم ولاها عثمان السائب بن الأقرع وعن محمد بن إسحاق أن مرزبان أصبهان كان مسناً يسمى الفادوسفان فعاصره وكاتب أهل المدينة فخذلوه عنه فلما رأى الشيخ تبايت الناس عليه اختار ثلاثين رجلاً من الرماة يثق ببأسهم وطاعتهم ثم خرج من المدينة هارباً يريد كرمان ليتبع يزدجرد فانتهى خبره إلى عبد الله بن بديل فاتبعه في خيل كثيفة فالتفت الأعجمي إليه وقد علا شرفاً فقال قع على نفسك فليس يسقط لمن ترى سهم فإن حملت رميناك وإن أمنت أن تبارزنا بارزناك فبارز الأعجمي ففر به ضربة وقعت على قربوس سرجه فكسرته وقطعت اللبب ثم قال له يا هذا ما أحب قتلك فإني أراك عاقلاً شجاعاً فهل لك في أن أرجع معك فأصالحك على أداء الجزية عن أهل بلدي فمن أقام كان ذمي ومن هرب لم يعرض له وأدفع المدينة إليك فرجع ابن بديل معه ففتح جي ووفى بما أعطاه وقال يا أهل أصبهان رأيتكم لياماً متخاذلين فكنتم أهلاً لما فعلت بكم وسار ابن بديل في نواحي أصبهان سهلها وجبلها فغلب عليها وعاملهم في الخراج نحو ما عامل عليه أهل الأهواز وكان فتح أصبهان وأرضها في بعض سنة 23 و24 وروي أن عمر وجه عبد الله بن بديل في جيش فوافى أبا موسى وقد فتح قم وقاشان فغزوا جميعاً أصبهان وعلى مقدمة أبي موسى الأحنف بن قيس ففتحا اليهودية جميعاً ثم فتح ابن بديل جي وسارا جميعاً في أرض أصبهان فغلبا عليها وأصح الأخبار أن أبا موسى فتح قم وقاشان وأن عبد الله بن بديل فتح جي واليهودية وكانت للأشراف من أهل أصبهان معاقل بجفرباذ من رستاق الثيمرة الكبرى ببهجاورسان وبقلعة تعرف بماربين فلما فتحت جي دخلوا في الطاعة على أن يؤدوا الخراج وأنفوا من الجزية فأسلموا."
  en: "In al-Baladhuri: Umar sent Abdallah ibn Budayl ibn Warqa' al-Khuza'i to Isbahan in year 23 — or wrote Abu Musa ordering his dispatch — and Abdallah took Jayy by treaty after fighting: its people to pay kharaj and jizya, secured in their persons and wealth save the arms in their hands; al-Ahnaf ibn Qays of his army was sent to al-Yahudiyya, which treated on the same terms, and Ibn Budayl mastered Isbahan's land and tasasij, governing until a year of Uthman's caliphate passed, when Uthman made al-Sa'ib ibn al-Aqra' governor. Ibn Ishaq relates that Isbahan's marzban, an old man called al-Fadhusfan, was besieged and the cityfolk betrayed him; choosing thirty trusted archers he slipped out toward Kirman to join Yazdgard. Word reached Ibn Budayl who pursued with heavy horse; the Persian turned on a height: 'hold yourself — not one of you drops without an arrow; charge and we shoot; or grant us a champion and we will duel.' They duelled — a blow fell on his saddle-bow breaking it and cutting the girth-straps — then Ibn Budayl said: 'I would not love your death, for I see you wise and brave; what say you to returning with me that I treat with you for your townspeople's jizya — who stays is dhimmi, who flees is unmolested — and you surrender the city?' He returned, opened Jayy and kept his word, saying 'O people of Isbahan, I saw you slackening for days — you earned what I did to you.' Ibn Budayl traversed Isbahan's plain and mountain, mastering it, treating its kharaj as al-Ahwaz had been treated — the conquest falling in parts of years 23 and 24. Another version has Umar sending Ibn Budayl to join Abu Musa — Qumm and Qashan taken — and together raiding Isbahan, al-Ahnaf on Abu Musa's vanguard, both taking al-Yahudiyya then Jayy, mastering the land — the soundest report being Abu Musa took Qumm and Qashan and Ibn Budayl Jayy and al-Yahudiyya. Isbahan's nobles held strongholds at Jafrabadh in Greater al-Thaymara rustaq at Bahjawarsan and a fortress called Marbin; when Jayy fell they entered obedience paying kharaj, and scorning the jizya, they embraced Islam."
  es: "En al-Baladhuri: Umar envió a Abdallah ibn Budayl ibn Warqa' al-Khuza'i a Isbahan en el año 23 —o escribió a Abu Musa ordenando su envío— y Abdallah tomó Jayy por tratado después de luchar: su gente pagaría kharaj y jizya, con garantías sobre sus personas y bienes excepto las armas en sus manos; al-Ahnaf ibn Qays de su ejército fue enviado a al-Yahudiyya, que trató en los mismos términos, e Ibn Budayl dominó la tierra y los impuestos de Isbahan, gobernando hasta que pasó un año del califato de Uthman, cuando Uthman nombró gobernador a al-Sa'ib ibn al-Aqra'. Ibn Ishaq relata que el marzban de Isbahan, un anciano llamado al-Fadhusfan, fue asediado y los habitantes de la ciudad lo traicionaron; eligiendo treinta arqueros de confianza, se escabulló hacia Kirman para unirse a Yazdgard. La noticia llegó a oídos de Ibn Budayl, quien perseguía con su pesado caballo; el persa se giró hacia una colina: «¡Detente! ¡Ninguno de vosotros caerá sin una flecha! ¡Cargad y disparamos! ¡O dadnos un campeón y batiremos en duelo!». Se batieron en duelo; un golpe impactó en el arco de su silla, rompiéndolo y cortando las correas de la cincha. Entonces Ibn Budayl dijo: «No desearía vuestra muerte, pues os veo sabios y valientes. ¿Qué os parece regresar conmigo para que negocie con vosotros la yizia de vuestros conciudadanos? ¡Quien se quede es dhimmi, quien huya no será molestado! ¡Y vosotros entregáis la ciudad!». Regresó, abrió el Jayy y cumplió su palabra, diciendo: «¡Oh, gente de Isbahan! Os vi flaquear durante días; os habéis ganado lo que os he hecho». Ibn Budayl recorrió la llanura y la montaña de Isbahan, dominándolas y tratando su kharaj como se había tratado al-Ahwaz; la conquista se produjo en partes de los años 23 y 24. Otra versión cuenta que Umar envió a Ibn Budayl a unirse a Abu Musa —Qumm y Qashan fueron tomadas— y juntos saquearon Isbahan, al-Ahnaf contra la vanguardia de Abu Musa, tomando ambos al-Yahudiyya y luego Jayy, dominando la tierra; el relato más fiable es que Abu Musa tomó Qumm y Qashan e Ibn Budayl Jayy y al-Yahudiyya. Los nobles de Isbahan poseían fortalezas en Jafrabadh en el Gran al-Thaymara, en Bahjawarsan y una fortaleza llamada Marbin; cuando Jayy cayó, entraron en obediencia pagando kharaj y despreciando la jizya, abrazando el Islam."
  fr: "Selon al-Baladhuri: Umar envoya Abdallah ibn Budayl ibn Warqa' al-Khuza'i à Isbahan en l'an 23 — ou bien Abu Musa ordonna son envoi par écrit — et Abdallah prit Jayy par traité après les combats: ses habitants durent payer le kharaj et la jizya, leurs personnes et leurs biens étant garantis, à l'exception de leurs armes. Al-Ahnaf ibn Qays, de son armée, fut envoyé à al-Yahudiyya, qui traita aux mêmes conditions, et Ibn Budayl prit le contrôle des terres et des tasasij d'Isbahan, gouvernant jusqu'à la fin de la première année du califat d'Uthman, date à laquelle Uthman nomma al-Sa'ib ibn al-Aqra' gouverneur. Ibn Ishaq rapporte que le marzban d'Isbahan, un vieil homme nommé al-Fadhusfan, fut assiégé et trahi par les habitants; choisissant trente archers de confiance, il s'enfuit vers Kirman pour rejoindre Yazdgard. La nouvelle parvint à Ibn Budayl, qui se lança à la poursuite du cheval. Le Perse se retourna sur une hauteur: « Tenez bon ! Nul ne tombera sans une flèche ! Chargez et nous tirerons ! Ou bien, désignez-nous un champion et nous nous battrons en duel. » Le duel eut lieu; un coup frappa l’arçon de sa selle, le brisant et coupant les sangles. Ibn Budayl dit alors: « Je ne souhaite pas ta mort, car je te vois sage et courageux. Que dirais-tu de revenir avec moi ? Je négocierais avec toi la jizya de tes concitoyens: celui qui reste est dhimmi, celui qui fuit est libre. Et tu me rendrais la ville. » Il revint, ouvrit Jayy et tint parole, disant: « Ô habitants d’Isbahan, je vous ai vus hésiter pendant des jours; vous avez mérité ce que je vous ai fait. » Ibn Budayl traversa la plaine et les montagnes d'Isbahan, les contrôlant et traitant son kharaj comme l'avait été al-Ahwaz – la conquête s'étalant sur les années 23 et 24. Selon une autre version, Umar envoya Ibn Budayl rejoindre Abu Musa – Qumm et Qashan furent prises – et ensemble, ils pillèrent Isbahan, al-Ahnaf à l'avant-garde d'Abu Musa. Tous deux s'emparèrent d'al-Yahudiyya puis de Jayy, contrôlant ainsi la région. Le récit le plus plausible est qu'Abu Musa prit Qumm et Qashan, et Ibn Budayl Jayy et al-Yahudiyya. Les nobles d'Isbahan tenaient des places fortes à Jafrabadh, dans le Grand al-Thaymara, à Bahjawarsan et dans une forteresse appelée Marbin. Après la chute de Jayy, ils se soumirent à l'obéissance en payant le kharaj et, méprisant la jizya, se convertirent à l'islam."
  ur: "البلادوری میں ہے: عمر نے عبداللہ بن بدیل بن ورقع الخزائی کو 23 میں اسبہان بھیجا - یا ابو موسی کو اس کے بھیجنے کا حکم دیتے ہوئے لکھا - اور عبداللہ نے جنگ کے بعد معاہدہ کرکے جی کو لے لیا: اس کے لوگ اپنے افراد اور مال میں محفوظ تھے اور ان کے ہاتھوں میں محفوظ تھے؛ احنف بن قیس کو اپنی فوج میں سے یہودیہ کی طرف بھیجا گیا، جس نے انہی شرائط پر سلوک کیا، اور ابن بدیل نے اسبہان کی سرزمین اور تسجی پر قبضہ کر لیا، یہاں تک کہ عثمان کی خلافت کا ایک سال گزر گیا، جب عثمان نے السائب ابن الاقراء کو گورنر بنایا۔ ابن اسحاق بیان کرتے ہیں کہ اسبہان کے مرزبان نامی ایک بوڑھے آدمی کا محاصرہ کیا گیا اور شہر والوں نے اسے دھوکہ دیا۔ تیس قابل بھروسہ تیر اندازوں کا انتخاب کر کے وہ یزدگرد میں شامل ہونے کے لیے کرمان کی طرف نکل گیا۔ بات ابن بدیل تک پہنچی جس نے بھاری گھوڑے کا تعاقب کیا۔ فارسی نے اونچائی پر کر دیا: 'اپنے آپ کو پکڑو، تم میں سے کوئی بھی تیر کے بغیر نہ ٹپکے۔ چارج کریں اور ہم گولی مار دیں؛ یا ہمیں ایک چیمپئن عطا فرما اور ہم مقابلہ کریں گے۔' انہوں نے مقابلہ کیا - ایک دھچکا اس کی کاٹھی کے کمان پر گرا جس سے وہ ٹوٹ گیا اور گھیر کے پٹے کاٹ رہے تھے - پھر ابن بدیل نے کہا: 'میں آپ کی موت کو پسند نہیں کروں گا کیونکہ میں آپ کو عقلمند اور بہادر دیکھتا ہوں۔ آپ میرے ساتھ واپس آنے کے بارے میں کیا کہتے ہیں کہ میں آپ کے ساتھ آپ کے شہر والوں کے جزیہ کے لیے سلوک کرتا ہوں - جو رہے گا وہ ذمی ہے، جو بھاگے گا وہ بدتمیز ہے - اور آپ شہر کو ہتھیار ڈال دیں گے؟' اس نے واپس آکر جے کو کھولا اور اپنی بات برقرار رکھتے ہوئے کہا، 'اے اسبہان کے لوگو، میں نے تمہیں دنوں تک سست روی کا مظاہرہ کرتے ہوئے دیکھا - تم نے وہی کمایا جو میں نے تمہارے ساتھ کیا۔' ابن بدیل نے اسبہان کے میدان اور پہاڑ کو عبور کیا، اس پر عبور حاصل کیا، اس کے خراج کو الاہواز جیسا سلوک کیا گیا تھا - فتح 23 اور 24 سال کے حصوں میں ہوئی تھی۔ ایک اور ورژن میں عمر نے ابن بدیل کو ابو موسیٰ کے ساتھ شامل ہونے کے لیے بھیجا - قم اور کاشان لیا - اور ایک ساتھ مل کر اسبہان پر حملہ کیا، ابوسفان، الاحواز دونوں کے محافظوں کو لے کر۔ الیہودیہ پھر جے، زمین پر عبور حاصل کیا - سب سے اچھی رپورٹ ابو موسیٰ نے قم اور کاشان اور ابن بدیل جئی اور الیہودیہ کو لیا۔ اسبہان کے امرا نے بہجاورسن کے مقام پر گریٹر التیمارہ رستاق میں جعفرآباد میں مضبوط قلعے اور ماربن نامی قلعہ پر قبضہ کیا۔ جب جئے گرے تو خرج ادا کرتے ہوئے اطاعت میں داخل ہوئے اور جزیہ کا طعنہ دیتے ہوئے اسلام قبول کر لیا۔"
  tr: "El-Baladhuri'ye göre: Ömer ibn el-Hattab, Hicri 23 yılında Abdullah ibn Budayl ibn Varak el-Huzai'yi İsfahan'a gönderdi. Ayrıca Ömer'in Ebu Musa el-Eş'ari'ye bir mektup yazarak onu bir orduyla göndermesini emrettiği de söylenir. Abdullah ibn Budayl, Jayy'i savaşarak barışçıl bir şekilde fethetti; ancak bunun şartı, sakinlerinin haraç (toprak vergisi) ve cizye (baş vergisi) ödemeleri ve ellerindeki silahlar hariç kendileri ve malları için güvence verilmesiydi. Abdullah ibn Budayl daha sonra ordusunda bulunan el-Ahnaf ibn Kays'ı el-Yahudiyye'ye gönderdi ve sakinleri aynı şartlarla onunla barıştı. İbn Budayl, İsfahan topraklarının ve çevresinin kontrolünü ele geçirdi ve Osman'ın halifeliğinde bir yıl geçene kadar vali olarak görev yaptı; daha sonra Osman, el-Sa'ib ibn el-Akra'yı vali olarak atadı. Muhammed ibn İshak'tan rivayet edildiğine göre, İsfahan Marzbanı, o sırada tanıştığı Fadusfan adında yaşlı bir adamdı. Medine halkına mektup yazdı, ancak onlar onu terk ettiler. Yaşlı adam halkın bölünmüşlüğünü görünce, güçlerine ve itaatlerine güvenerek okçular arasından otuz adam seçti ve Yazdegerd'i takip etmek için Kerman'a gitmek üzere Medine'den kaçtı. Kaçış haberi Abdullah ibn Budayl'a ulaştı ve o da büyük bir süvari birliğiyle onu takip etti. Üstünlüğü ele geçiren Arap olmayan adam ona döndü. Şerefli bir şekilde, \"Kendini yere ser, çünkü senin gördüğün hiçbir oka ok isabet etmez. Eğer silah taşıyorsan, seni vururuz; eğer bizimle düellodan kendini güvende hissediyorsan, seninle düello yaparız\" dedi. Böylece Arap olmayan adam düello yaptı ve adamın eyerinin topuzuna isabet eden bir darbeyle kaçtı; topuz kırıldı ve zırhı koptu. Sonra ona şöyle dedi: \"Ey adam, seni öldürmek istemiyorum, çünkü seni bilge ve cesur görüyorum. Seninle birlikte geri dönüp, ülkemdeki insanlar adına cizye ödemesi karşılığında seninle barışmamı ister misin? Kim kalırsa zimmi olacak, kim kaçarsa zarar görmeyecek ve şehri sana teslim edeceğim.\" Böylece İbn Budayl onunla birlikte geri döndü, Jay'i fethetti ve verdiği sözü yerine getirdi. \"Ey İsfahan halkı, sizi günlerce korkak ve güçsüz gördüm, bu yüzden size yaptıklarımı hak ettiniz\" dedi. İbn Budayl, İsfahan bölgelerini, ovalarını ve dağlarını dolaştı ve fethetti. Onlara, Ahvaz halkına davrandığı gibi, toprak vergisi konusunda aynı muameleyi yaptı. İsfahan ve topraklarının fethi, MS 23 veya 24 yılının bir bölümünde gerçekleşti. Rivayetlere göre Ömer, Abdullah ibn Budayl'ı bir orduyla gönderdi ve o da Kum ve Kaşan'ı fethetmiş olan Ebu Musa ile karşılaştı. Böylece ikisi birlikte İsfahan'a baskın düzenlediler; Ebu Musa'nın öncü birliğinin başında el-Ahnaf ibn Kays vardı. İkisi birlikte el-Yahudiyye'yi fethettiler. Sonra İbn Budayl, Jay'i fethetti ve birlikte ilerlediler. İsfahan topraklarında da bu şehri fethettiler. En doğru rivayete göre Ebu Musa Kum ve Kaşan'ı, Abdullah bin Badil ise Jay ve el-Yahudiyye'yi fethetti. İsfahan'ın ileri gelenlerinin Bahjawarsan'daki El-Thaymarah el-Kubra bölgesinde Caferbadh'ta ve Marbin olarak bilinen bir kalede kaleleri vardı. Jay fethedildiğinde, haraç ödeme şartıyla teslim oldular ve cizye vermeyi reddettiler, böylece İslam'ı kabul ettiler."
  id: "Menurut al-Baladhuri: Umar ibn al-Khattab mengutus Abdullah ibn Budayl ibn Warqa' al-Khuza'i ke Isfahan pada tahun 23 Hijriah. Dikatakan juga bahwa Umar menulis surat kepada Abu Musa al-Ash'ari, memerintahkannya untuk mengirim Abdullah ibn Budayl dengan pasukan. Abdullah ibn Budayl menaklukkan Jayy secara damai setelah berperang, dengan syarat penduduknya membayar kharaj (pajak tanah) dan jizya (pajak kepala), dan mereka diberikan perlindungan untuk diri mereka sendiri dan harta benda mereka, kecuali senjata yang mereka miliki. Abdullah ibn Budayl kemudian mengutus al-Ahnaf ibn Qays, yang berada di pasukannya, ke al-Yahudiyya, dan penduduknya berdamai dengannya dengan syarat yang sama. Ibn Budayl menguasai wilayah Isfahan dan distrik-distriknya, dan ia menjadi gubernurnya hingga satu tahun berlalu pada masa kekhalifahan Utsman, setelah itu Utsman menunjuk al-Sa'ib ibn al-Aqra'. Diriwayatkan dari Muhammad ibn Ishaq bahwa Marzban Isfahan adalah seorang lelaki tua bernama al-Fadusfan, yang ia temui pada waktu itu. Ia menulis surat kepada penduduk Madinah, tetapi mereka meninggalkannya. Ketika lelaki tua itu melihat perpecahan di antara rakyat, ia memilih tiga puluh orang dari kalangan pemanah, mempercayai kekuatan dan ketaatan mereka, lalu melarikan diri dari Madinah, berniat pergi ke Kerman untuk mengejar Yazdegerd. Kabar pelariannya sampai kepada Abdullah ibn Budayl, yang mengejarnya dengan pasukan kavaleri yang besar. Orang-orang non-Arab itu berbalik melawannya, setelah mendapatkan keunggulan. Dengan hormat, ia berkata, \"Jatuhlah di atas dirimu sendiri, karena tidak ada anak panah yang mengenai orang yang kau lihat. Jika kau membawa senjata, kami akan menembakmu, dan jika kau merasa aman untuk berduel dengan kami, kami akan berduel denganmu.\" Maka orang non-Arab itu berduel, dan ia melarikan diri dengan pukulan yang mengenai gagang pelana kudanya, mematahkannya dan memutuskan pelindung dadanya. Kemudian ia berkata kepadanya, \"Wahai manusia, aku tidak ingin membunuhmu, karena aku melihatmu sebagai orang yang bijaksana dan berani. Apakah kau ingin aku kembali bersamamu dan berdamai denganmu dengan pembayaran jizya atas nama penduduk negeriku? Siapa pun yang tinggal akan menjadi dhimmi, dan siapa pun yang melarikan diri tidak akan dirugikan, dan aku akan menyerahkan kota itu kepadamu.\" Maka Ibnu Budayl kembali bersamanya dan menaklukkan Jayy dan memenuhi apa yang telah dijanjikannya. Ia berkata, \"Wahai penduduk Isfahan, aku melihat kalian selama berhari-hari sebagai orang yang pengecut dan lemah, maka kalian pantas menerima apa yang kulakukan kepada kalian.\" Ibn Budayl bergerak melalui wilayah Isfahan, dataran dan pegunungannya, dan menaklukkannya. Ia mengenakan pajak tanah kepada mereka dengan cara yang sama seperti ia memperlakukan penduduk Ahwaz. Penaklukan Isfahan dan wilayahnya terjadi pada sebagian tahun 23 atau 24. Diriwayatkan bahwa Umar mengutus Abdullah ibn Budayl dengan pasukan, dan ia bertemu dengan Abu Musa, yang telah menaklukkan Qum dan Kashan. Maka mereka berdua menyerbu Isfahan, dengan al-Ahnaf ibn Qays memimpin barisan depan Abu Musa. Mereka berdua menaklukkan al-Yahudiyya. Kemudian Ibn Budayl menaklukkan Jayy, dan mereka bergerak bersama. Di tanah Isfahan, mereka menaklukkannya. Kabar yang paling akurat adalah bahwa Abu Musa menaklukkan Qom dan Kashan, dan bahwa Abdullah bin Badil menaklukkan Jay dan Al-Yahudiyya. Para bangsawan Isfahan memiliki benteng di Jafarbadh di distrik Al-Thaymarah Al-Kubra di Bahjawarsan dan di sebuah benteng yang dikenal sebagai Marbin. Ketika Ja'ji ditaklukkan, mereka menyerah dengan syarat mereka akan membayar kharaj dan mereka menolak jizya, sehingga mereka masuk Islam."
