id: event/conquest-of-isbahan
class: event
kind: conquest
label: { ar: "فتح أصبهان", en: "The Conquest of Isbahan", es: "La conquista de Isbahan", fr: "La conquête d'Isbahan" }
summary:
  ar: "عند البلاذري: وجه عمر بن الخطاب عبد الله بن بديل بن ورقاء الخزاعي إلى أصبهان سنة 23 ويقال بل كتب عمر إلى أبي موسى الأشعري يأمره بتوجيهه في جيش ففتح عبد الله بن بديل جي صلحاً بعد قتال على أن يؤدي أهلها الخراج والجزية وعلى أن يؤمنوا على أنفسهم وأموالهم خلا ما في أيديهم من السلاح ووجه عبد الله بن بديل الأحنف بن قيس وكان في جيشه إلى اليهودية فصالحه أهلها على مثل ذلك الصلح وغلب بن بديل على أرض أصبهان وطساسيجها وكان العامل عليها إلى أن مضت من خلافة عثمان سنة ثم ولاها عثمان السائب بن الأقرع وعن محمد بن إسحاق أن مرزبان أصبهان كان مسناً يسمى الفادوسفان فعاصره وكاتب أهل المدينة فخذلوه عنه فلما رأى الشيخ تبايت الناس عليه اختار ثلاثين رجلاً من الرماة يثق ببأسهم وطاعتهم ثم خرج من المدينة هارباً يريد كرمان ليتبع يزدجرد فانتهى خبره إلى عبد الله بن بديل فاتبعه في خيل كثيفة فالتفت الأعجمي إليه وقد علا شرفاً فقال قع على نفسك فليس يسقط لمن ترى سهم فإن حملت رميناك وإن أمنت أن تبارزنا بارزناك فبارز الأعجمي ففر به ضربة وقعت على قربوس سرجه فكسرته وقطعت اللبب ثم قال له يا هذا ما أحب قتلك فإني أراك عاقلاً شجاعاً فهل لك في أن أرجع معك فأصالحك على أداء الجزية عن أهل بلدي فمن أقام كان ذمي ومن هرب لم يعرض له وأدفع المدينة إليك فرجع ابن بديل معه ففتح جي ووفى بما أعطاه وقال يا أهل أصبهان رأيتكم لياماً متخاذلين فكنتم أهلاً لما فعلت بكم وسار ابن بديل في نواحي أصبهان سهلها وجبلها فغلب عليها وعاملهم في الخراج نحو ما عامل عليه أهل الأهواز وكان فتح أصبهان وأرضها في بعض سنة 23 و24 وروي أن عمر وجه عبد الله بن بديل في جيش فوافى أبا موسى وقد فتح قم وقاشان فغزوا جميعاً أصبهان وعلى مقدمة أبي موسى الأحنف بن قيس ففتحا اليهودية جميعاً ثم فتح ابن بديل جي وسارا جميعاً في أرض أصبهان فغلبا عليها وأصح الأخبار أن أبا موسى فتح قم وقاشان وأن عبد الله بن بديل فتح جي واليهودية وكانت للأشراف من أهل أصبهان معاقل بجفرباذ من رستاق الثيمرة الكبرى ببهجاورسان وبقلعة تعرف بماربين فلما فتحت جي دخلوا في الطاعة على أن يؤدوا الخراج وأنفوا من الجزية فأسلموا."
  en: "In al-Baladhuri: Umar sent Abdallah ibn Budayl ibn Warqa' al-Khuza'i to Isbahan in year 23 — or wrote Abu Musa ordering his dispatch — and Abdallah took Jayy by treaty after fighting: its people to pay kharaj and jizya, secured in their persons and wealth save the arms in their hands; al-Ahnaf ibn Qays of his army was sent to al-Yahudiyya, which treated on the same terms, and Ibn Budayl mastered Isbahan's land and tasasij, governing until a year of Uthman's caliphate passed, when Uthman made al-Sa'ib ibn al-Aqra' governor. Ibn Ishaq relates that Isbahan's marzban, an old man called al-Fadhusfan, was besieged and the cityfolk betrayed him; choosing thirty trusted archers he slipped out toward Kirman to join Yazdgard. Word reached Ibn Budayl who pursued with heavy horse; the Persian turned on a height: 'hold yourself — not one of you drops without an arrow; charge and we shoot; or grant us a champion and we will duel.' They duelled — a blow fell on his saddle-bow breaking it and cutting the girth-straps — then Ibn Budayl said: 'I would not love your death, for I see you wise and brave; what say you to returning with me that I treat with you for your townspeople's jizya — who stays is dhimmi, who flees is unmolested — and you surrender the city?' He returned, opened Jayy and kept his word, saying 'O people of Isbahan, I saw you slackening for days — you earned what I did to you.' Ibn Budayl traversed Isbahan's plain and mountain, mastering it, treating its kharaj as al-Ahwaz had been treated — the conquest falling in parts of years 23 and 24. Another version has Umar sending Ibn Budayl to join Abu Musa — Qumm and Qashan taken — and together raiding Isbahan, al-Ahnaf on Abu Musa's vanguard, both taking al-Yahudiyya then Jayy, mastering the land — the soundest report being Abu Musa took Qumm and Qashan and Ibn Budayl Jayy and al-Yahudiyya. Isbahan's nobles held strongholds at Jafrabadh in Greater al-Thaymara rustaq at Bahjawarsan and a fortress called Marbin; when Jayy fell they entered obedience paying kharaj, and scorning the jizya, they embraced Islam."
  es: "En al-Baladhuri: Umar envió a Abdallah ibn Budayl ibn Warqa' al-Khuza'i a Isbahan en el año 23 —o escribió a Abu Musa ordenando su envío— y Abdallah tomó Jayy por tratado después de luchar: su gente pagaría kharaj y jizya, con garantías sobre sus personas y bienes excepto las armas en sus manos; al-Ahnaf ibn Qays de su ejército fue enviado a al-Yahudiyya, que trató en los mismos términos, e Ibn Budayl dominó la tierra y los impuestos de Isbahan, gobernando hasta que pasó un año del califato de Uthman, cuando Uthman nombró gobernador a al-Sa'ib ibn al-Aqra'. Ibn Ishaq relata que el marzban de Isbahan, un anciano llamado al-Fadhusfan, fue asediado y los habitantes de la ciudad lo traicionaron; eligiendo treinta arqueros de confianza, se escabulló hacia Kirman para unirse a Yazdgard. La noticia llegó a oídos de Ibn Budayl, quien perseguía con su pesado caballo; el persa se giró hacia una colina: «¡Detente! ¡Ninguno de vosotros caerá sin una flecha! ¡Cargad y disparamos! ¡O dadnos un campeón y batiremos en duelo!». Se batieron en duelo; un golpe impactó en el arco de su silla, rompiéndolo y cortando las correas de la cincha. Entonces Ibn Budayl dijo: «No desearía vuestra muerte, pues os veo sabios y valientes. ¿Qué os parece regresar conmigo para que negocie con vosotros la yizia de vuestros conciudadanos? ¡Quien se quede es dhimmi, quien huya no será molestado! ¡Y vosotros entregáis la ciudad!». Regresó, abrió el Jayy y cumplió su palabra, diciendo: «¡Oh, gente de Isbahan! Os vi flaquear durante días; os habéis ganado lo que os he hecho». Ibn Budayl recorrió la llanura y la montaña de Isbahan, dominándolas y tratando su kharaj como se había tratado al-Ahwaz; la conquista se produjo en partes de los años 23 y 24. Otra versión cuenta que Umar envió a Ibn Budayl a unirse a Abu Musa —Qumm y Qashan fueron tomadas— y juntos saquearon Isbahan, al-Ahnaf contra la vanguardia de Abu Musa, tomando ambos al-Yahudiyya y luego Jayy, dominando la tierra; el relato más fiable es que Abu Musa tomó Qumm y Qashan e Ibn Budayl Jayy y al-Yahudiyya. Los nobles de Isbahan poseían fortalezas en Jafrabadh en el Gran al-Thaymara, en Bahjawarsan y una fortaleza llamada Marbin; cuando Jayy cayó, entraron en obediencia pagando kharaj y despreciando la jizya, abrazando el Islam."
  fr: "Selon al-Baladhuri: Umar envoya Abdallah ibn Budayl ibn Warqa' al-Khuza'i à Isbahan en l'an 23 — ou bien Abu Musa ordonna son envoi par écrit — et Abdallah prit Jayy par traité après les combats: ses habitants durent payer le kharaj et la jizya, leurs personnes et leurs biens étant garantis, à l'exception de leurs armes. Al-Ahnaf ibn Qays, de son armée, fut envoyé à al-Yahudiyya, qui traita aux mêmes conditions, et Ibn Budayl prit le contrôle des terres et des tasasij d'Isbahan, gouvernant jusqu'à la fin de la première année du califat d'Uthman, date à laquelle Uthman nomma al-Sa'ib ibn al-Aqra' gouverneur. Ibn Ishaq rapporte que le marzban d'Isbahan, un vieil homme nommé al-Fadhusfan, fut assiégé et trahi par les habitants; choisissant trente archers de confiance, il s'enfuit vers Kirman pour rejoindre Yazdgard. La nouvelle parvint à Ibn Budayl, qui se lança à la poursuite du cheval. Le Perse se retourna sur une hauteur: « Tenez bon ! Nul ne tombera sans une flèche ! Chargez et nous tirerons ! Ou bien, désignez-nous un champion et nous nous battrons en duel. » Le duel eut lieu; un coup frappa l’arçon de sa selle, le brisant et coupant les sangles. Ibn Budayl dit alors: « Je ne souhaite pas ta mort, car je te vois sage et courageux. Que dirais-tu de revenir avec moi ? Je négocierais avec toi la jizya de tes concitoyens: celui qui reste est dhimmi, celui qui fuit est libre. Et tu me rendrais la ville. » Il revint, ouvrit Jayy et tint parole, disant: « Ô habitants d’Isbahan, je vous ai vus hésiter pendant des jours; vous avez mérité ce que je vous ai fait. » Ibn Budayl traversa la plaine et les montagnes d'Isbahan, les contrôlant et traitant son kharaj comme l'avait été al-Ahwaz – la conquête s'étalant sur les années 23 et 24. Selon une autre version, Umar envoya Ibn Budayl rejoindre Abu Musa – Qumm et Qashan furent prises – et ensemble, ils pillèrent Isbahan, al-Ahnaf à l'avant-garde d'Abu Musa. Tous deux s'emparèrent d'al-Yahudiyya puis de Jayy, contrôlant ainsi la région. Le récit le plus plausible est qu'Abu Musa prit Qumm et Qashan, et Ibn Budayl Jayy et al-Yahudiyya. Les nobles d'Isbahan tenaient des places fortes à Jafrabadh, dans le Grand al-Thaymara, à Bahjawarsan et dans une forteresse appelée Marbin. Après la chute de Jayy, ils se soumirent à l'obéissance en payant le kharaj et, méprisant la jizya, se convertirent à l'islam."
