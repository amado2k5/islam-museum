id: event/conquest-of-isbahan
class: event
kind: conquest
label: { ar: "فتح أصبهان", en: "The Conquest of Isbahan" }
summary:
  ar: "عند البلاذري: وجه عمر بن الخطاب عبد الله بن بديل بن ورقاء الخزاعي إلى أصبهان سنة 23 ويقال بل كتب عمر إلى أبي موسى الأشعري يأمره بتوجيهه في جيش ففتح عبد الله بن بديل جي صلحاً بعد قتال على أن يؤدي أهلها الخراج والجزية وعلى أن يؤمنوا على أنفسهم وأموالهم خلا ما في أيديهم من السلاح ووجه عبد الله بن بديل الأحنف بن قيس وكان في جيشه إلى اليهودية فصالحه أهلها على مثل ذلك الصلح وغلب بن بديل على أرض أصبهان وطساسيجها وكان العامل عليها إلى أن مضت من خلافة عثمان سنة ثم ولاها عثمان السائب بن الأقرع وعن محمد بن إسحاق أن مرزبان أصبهان كان مسناً يسمى الفادوسفان فعاصره وكاتب أهل المدينة فخذلوه عنه فلما رأى الشيخ تبايت الناس عليه اختار ثلاثين رجلاً من الرماة يثق ببأسهم وطاعتهم ثم خرج من المدينة هارباً يريد كرمان ليتبع يزدجرد فانتهى خبره إلى عبد الله بن بديل فاتبعه في خيل كثيفة فالتفت الأعجمي إليه وقد علا شرفاً فقال قع على نفسك فليس يسقط لمن ترى سهم فإن حملت رميناك وإن أمنت أن تبارزنا بارزناك فبارز الأعجمي ففر به ضربة وقعت على قربوس سرجه فكسرته وقطعت اللبب ثم قال له يا هذا ما أحب قتلك فإني أراك عاقلاً شجاعاً فهل لك في أن أرجع معك فأصالحك على أداء الجزية عن أهل بلدي فمن أقام كان ذمي ومن هرب لم يعرض له وأدفع المدينة إليك فرجع ابن بديل معه ففتح جي ووفى بما أعطاه وقال يا أهل أصبهان رأيتكم لياماً متخاذلين فكنتم أهلاً لما فعلت بكم وسار ابن بديل في نواحي أصبهان سهلها وجبلها فغلب عليها وعاملهم في الخراج نحو ما عامل عليه أهل الأهواز وكان فتح أصبهان وأرضها في بعض سنة 23 و24 وروي أن عمر وجه عبد الله بن بديل في جيش فوافى أبا موسى وقد فتح قم وقاشان فغزوا جميعاً أصبهان وعلى مقدمة أبي موسى الأحنف بن قيس ففتحا اليهودية جميعاً ثم فتح ابن بديل جي وسارا جميعاً في أرض أصبهان فغلبا عليها وأصح الأخبار أن أبا موسى فتح قم وقاشان وأن عبد الله بن بديل فتح جي واليهودية وكانت للأشراف من أهل أصبهان معاقل بجفرباذ من رستاق الثيمرة الكبرى ببهجاورسان وبقلعة تعرف بماربين فلما فتحت جي دخلوا في الطاعة على أن يؤدوا الخراج وأنفوا من الجزية فأسلموا."
  en: "In al-Baladhuri: Umar sent Abdallah ibn Budayl ibn Warqa' al-Khuza'i to Isbahan in year 23 — or wrote Abu Musa ordering his dispatch — and Abdallah took Jayy by treaty after fighting: its people to pay kharaj and jizya, secured in their persons and wealth save the arms in their hands; al-Ahnaf ibn Qays of his army was sent to al-Yahudiyya, which treated on the same terms, and Ibn Budayl mastered Isbahan's land and tasasij, governing until a year of Uthman's caliphate passed, when Uthman made al-Sa'ib ibn al-Aqra' governor. Ibn Ishaq relates that Isbahan's marzban, an old man called al-Fadhusfan, was besieged and the cityfolk betrayed him; choosing thirty trusted archers he slipped out toward Kirman to join Yazdgard. Word reached Ibn Budayl who pursued with heavy horse; the Persian turned on a height: 'hold yourself — not one of you drops without an arrow; charge and we shoot; or grant us a champion and we will duel.' They duelled — a blow fell on his saddle-bow breaking it and cutting the girth-straps — then Ibn Budayl said: 'I would not love your death, for I see you wise and brave; what say you to returning with me that I treat with you for your townspeople's jizya — who stays is dhimmi, who flees is unmolested — and you surrender the city?' He returned, opened Jayy and kept his word, saying 'O people of Isbahan, I saw you slackening for days — you earned what I did to you.' Ibn Budayl traversed Isbahan's plain and mountain, mastering it, treating its kharaj as al-Ahwaz had been treated — the conquest falling in parts of years 23 and 24. Another version has Umar sending Ibn Budayl to join Abu Musa — Qumm and Qashan taken — and together raiding Isbahan, al-Ahnaf on Abu Musa's vanguard, both taking al-Yahudiyya then Jayy, mastering the land — the soundest report being Abu Musa took Qumm and Qashan and Ibn Budayl Jayy and al-Yahudiyya. Isbahan's nobles held strongholds at Jafrabadh in Greater al-Thaymara rustaq at Bahjawarsan and a fortress called Marbin; when Jayy fell they entered obedience paying kharaj, and scorning the jizya, they embraced Islam."
