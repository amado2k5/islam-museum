label: { ar: "زلزلة شوال سنة خمسين", en: "The Shawwal Earthquake of 450" }
summary:
  ar: "في ثامن عشر شوال سنة خمسين وأربعمائة بين المغرب والعشاء كانت زلزلة عظيمة لبثت ساعة عظيمة، ولحق الناس منها خوف شديد وتهدمت دور كثيرة، ووردت الأخبار أنها اتصلت من بغداد إلى همذان وواسط وعانة وتكريت، وذُكر أن أرحاءً كانت تدور فوقفت؛ وبعد هذه الزلزلة بشهر أُخرج القائم من داره {cite:muntazam-ibn-al-jawzi j.8 p.532}. وفي هذه السنة وقع برد كبار يوم الثلاثاء سادس عشر المحرم فهلك كثير من الغلات ووُزنت منه واحدة بثلاثة وثلاثين درهمًا، وزادت دجلة خمسة عشر ذراعًا {cite:muntazam-ibn-al-jawzi j.8 p.531}."
  en: "On 18 Shawwal 450, between sunset and nightfall, a great earthquake held a long moment — houses fell, terror spread, and reports traced it in a band from Baghdad to Hamadan, Wasit, 'Ana and Tikrit, with millstones stopping mid-turn; a month later al-Qa'im was driven from his palace. The same year opened with giant hail, one stone weighed at thirty-three dirhams, and a fifteen-cubit Tigris rise {cite:muntazam-ibn-al-jawzi j.8 p.531-532}."
