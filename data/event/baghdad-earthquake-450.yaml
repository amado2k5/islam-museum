label: { ar: "زلزلة شوال سنة خمسين", en: "The Shawwal Earthquake of 450", fr: "Le tremblement de terre de Shawwal 450", es: "El terremoto de Shawwal de 450", ur: "شوال 450 کا زلزلہ", tr: "Elli yıldaki Şevval depremi", id: "Gempa bumi bulan Syawal tahun lima puluh" }
summary:
  ar: "في ثامن عشر شوال سنة خمسين وأربعمائة بين المغرب والعشاء كانت زلزلة عظيمة لبثت ساعة عظيمة، ولحق الناس منها خوف شديد وتهدمت دور كثيرة، ووردت الأخبار أنها اتصلت من بغداد إلى همذان وواسط وعانة وتكريت، وذُكر أن أرحاءً كانت تدور فوقفت؛ وبعد هذه الزلزلة بشهر أُخرج القائم من داره {cite:muntazam-ibn-al-jawzi j.8 p.532}. وفي هذه السنة وقع برد كبار يوم الثلاثاء سادس عشر المحرم فهلك كثير من الغلات ووُزنت منه واحدة بثلاثة وثلاثين درهمًا، وزادت دجلة خمسة عشر ذراعًا {cite:muntazam-ibn-al-jawzi j.8 p.531}."
  en: "On 18 Shawwal 450, between sunset and nightfall, a great earthquake held a long moment — houses fell, terror spread, and reports traced it in a band from Baghdad to Hamadan, Wasit, 'Ana and Tikrit, with millstones stopping mid-turn; a month later al-Qa'im was driven from his palace. The same year opened with giant hail, one stone weighed at thirty-three dirhams, and a fifteen-cubit Tigris rise {cite:muntazam-ibn-al-jawzi j.8 p.531-532}."
  fr: "Le 18 Shawwal 450, entre le coucher du soleil et la nuit, un grand tremblement de terre dura un long moment : des maisons s'écroulèrent, la terreur se répandit, et les récits le suivirent sur une bande allant de Bagdad à Hamadan, Wasit, 'Ana et Tikrit, des meules s'arrêtant en pleine rotation ; un mois plus tard, al-Qa'im fut chassé de son palais. La même année s'était ouverte par une grêle géante, un grêlon pesé à trente-trois dirhams, et une crue du Tigre de quinze coudées {cite:muntazam-ibn-al-jawzi j.8 p.531-532}."
  es: "El 18 de Shawwal de 450, entre la puesta del sol y el anochecer, un gran terremoto se prolongó durante un instante: las casas se derrumbaron, el terror se extendió y los informes lo rastrearon en una franja desde Bagdad hasta Hamadán, Wasit, Ana y Tikrit, con molinos que se detenían a mitad de su giro; un mes después, al-Qa'im fue expulsado de su palacio. Ese mismo año comenzó con una granizada gigante, una piedra que pesaba treinta y tres dirhams y una crecida del Tigris de quince codos {cite:muntazam-ibn-al-jawzi j.8 p.531-532}."
  ur: "18 شوال 450 کو، غروب آفتاب اور رات کے درمیان، ایک بڑا زلزلہ ایک طویل لمحہ رہا - مکانات گر گئے، دہشت پھیل گئی، اور اطلاعات کے مطابق بغداد سے ہمدان، وصیت، عناء اور تکریت تک ایک بینڈ میں اس کا پتہ لگایا گیا، چکی کے پتھر درمیانی موڑ پر رک گئے؛ ایک ماہ بعد القائم کو اس کے محل سے نکال دیا گیا۔ اسی سال بڑے اولوں کے ساتھ کھلا، ایک پتھر کا وزن تینتیس درہم تھا، اور ایک پندرہ ہاتھ دجلہ کا اضافہ ہوا"
  tr: "Hicri 450 yılının Şevval ayının on sekizinci günü, akşam ve yatsı namazları arasında, uzun bir süre devam eden büyük bir deprem oldu. İnsanlar çok korktu ve birçok ev yıkıldı. Raporlar, sarsıntıların Bağdat'tan Hamadan, Wasit, Ana ve Tikrit'e kadar uzandığını gösteriyordu. Ayrıca çalışan değirmenlerin durduğu da bildirildi. Bu depremden bir ay sonra, Halife el-Kaim evinden çıkarılmak zorunda kaldı. Yine aynı yıl, Muharrem ayının on altıncı günü, Salı günü, şiddetli bir dolu fırtınası meydana geldi ve ekinlerin büyük bir kısmını yok etti. Tek bir dolu tanesinin ağırlığı otuz üç dirhem olarak ölçüldü ve Dicle Nehri on beş arşın yükseldi."
  id: "Pada tanggal 18 Syawal tahun 450 Hijriah, antara salat Maghrib dan Isya, terjadi gempa bumi dahsyat yang berlangsung selama satu jam. Orang-orang ketakutan, dan banyak rumah runtuh. Laporan menunjukkan bahwa getaran gempa meluas dari Baghdad hingga Hamadan, Wasit, Ana, dan Tikrit. Dilaporkan juga bahwa pabrik-pabrik yang sedang beroperasi berhenti beroperasi. Sebulan setelah gempa bumi ini, Khalifah al-Qa'im terpaksa meninggalkan rumahnya. Juga pada tahun ini, pada hari Selasa, tanggal 16 Muharram, terjadi hujan es hebat yang menghancurkan sebagian besar tanaman. Satu butir es ditimbang seberat tiga puluh tiga dirham, dan Sungai Tigris meluap setinggi lima belas hasta."
