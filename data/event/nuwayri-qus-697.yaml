label:
  ar: "النويري في الصعيد: أنياب الفيلة بقوص، ٦٩٧هـ/١٢٩٨م"
  en: "Al-Nuwayri in Upper Egypt: elephant tusks at Qus, 697/1298"
  ur: "نويری صعید میں: قوص میں ہاتھی کے دانتے، 697ھ/1298ء"
summary:
  ar: "تشهد أطراف كتابه أن النويري أقام قبل سنة ٦٩٨هـ بعض وقته بالصعيد وعموم مصر: ففي فصول الزراعة يتحدث عن أقاليم زارها وممارسات لاحظها ملاحظة شخصية، وفي باب الحيوان يذكر أنياب الفيلة التي رآها بقوص سنة ٦٩٧هـ/١٢٩٨م {cite:encyclopaedia-of-islam-2 vol. 8 p. 156}."
  en: "Details scattered through his work show that before 698/1298 al-Nuwayri spent some time in Upper Egypt and in Egypt generally: in the chapters on agriculture he speaks from personal experience of districts visited and practices observed, and in the section on animals he mentions the elephant tusks he saw at Qus in 697/1298 {cite:encyclopaedia-of-islam-2 vol. 8 p. 156}."
  ur: "ان کی کتاب کے بال بچے اشارے ظاہر کرتے ہیں کہ 698ھ/1298ء سے پہلے نويری نے صعید اور عموماً مصر میں کچھ وقت گزارا: فصولِ زراعت میں وہ ان علاقوں اور رسومات کی بات ذاتی مشاہدے سے کرتے ہیں، اور بابِ حیوان میں وہ ہاتھی کے دانتے یاد کرتے ہیں جو انہوں نے قوص میں 697ھ/1298ء میں دیکھے تھے {cite:encyclopaedia-of-islam-2 vol. 8 p. 156}۔"
