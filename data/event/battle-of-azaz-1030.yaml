label: { ar: "معركة أعزاز ⁦(١٠٣٠)⁩", en: "Battle of Azaz", fr: "La bataille d'Azaz", es: "Batalla de Azaz", ur: "عزاز کی جنگ" }
summary:
  ar: "في سنة ٤٢١ سار ملك الروم إلى حلب في جمع يزعمون أنه ثلاثمائة ألف، فانهزم قرب أعزاز على يد أهل حلب ومسلمي الثغور، وفرّ الإمبراطور متنكرًا ليلًا حتى نجا بنفسه، وغُنمت معسكره وأمواله — وهي رواية ابن الجوزي بأعداد الفاتحين {cite:muntazam-ibn-al-jawzi j.8 p.392-393}."
  en: "In 421 the emperor of Rum marched on Aleppo with a host the account puts at three hundred thousand, and was routed near Azaz by the Aleppines and frontier Muslims; the emperor escaped by night in disguise while his camp was plundered — Ibn al-Jawzi's account with its victors' figures {cite:muntazam-ibn-al-jawzi j.8 p.392-393}."
  fr: "En 421, l'empereur des Rum marcha sur Alep avec une armée que le récit porte à trois cent mille hommes, et fut mis en déroute près d'Azaz par les Alépins et les musulmans des marches ; l'empereur s'échappa de nuit, déguisé, tandis que son camp était pillé : c'est le récit d'Ibn al-Jawzi, avec les chiffres des vainqueurs {cite:muntazam-ibn-al-jawzi j.8 p.392-393}."
  es: "En 421, el emperador de Rum marchó sobre Alepo con un ejército que, según los relatos, ascendía a trescientos mil hombres, y fue derrotado cerca de Azaz por los alepinos y los musulmanes de la frontera; el emperador escapó de noche disfrazado mientras su campamento era saqueado. — Relato de Ibn al-Jawzi con las cifras de sus vencedores {cite:muntazam-ibn-al-jawzi j.8 p.392-393}."
  ur: "421 میں روم کے شہنشاہ نے تین لاکھ کے حساب سے ایک میزبان کے ساتھ حلب پر کوچ کیا، اور اسے حلب اور سرحدی مسلمانوں نے عزاز کے قریب شکست دی۔ شہنشاہ رات کے وقت بھیس میں فرار ہو گیا جب کہ اس کا کیمپ لوٹ لیا گیا — ابن الجوزی کا اس کے فاتحین کے اعداد و شمار کے ساتھ بیان {حوالہ دیں:منتظم ابن الجوزی ج.8 صفحہ 392-393}۔"
