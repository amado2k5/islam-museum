  ar: "في سنة ٤٢١ سار ملك الروم إلى حلب في جمع يزعمون أنه ثلاثمائة ألف، فانهزم قرب أعزاز على يد أهل حلب ومسلمي الثغور، وفرّ الإمبراطور متنكرًا ليلًا حتى نجا بنفسه، وغُنمت معسكره وأمواله — وهي رواية ابن الجوزي بأعداد الفاتحين {cite:muntazam-ibn-al-jawzi j.8 p.392-393}."
  en: "In 421 the emperor of Rum marched on Aleppo with a host the account puts at three hundred thousand, and was routed near Azaz by the Aleppines and frontier Muslims; the emperor escaped by night in disguise while his camp was plundered — Ibn al-Jawzi's account with its victors' figures {cite:muntazam-ibn-al-jawzi j.8 p.392-393}."
