label: { ar: "وصايا عبد الرحمن بن عوف وتركته ودفنه بالبقيع", en: "The bequests, estate and burial of Abd al-Rahman ibn Awf", ur: "عبد الرحمن بن عوف کی وصیتیں، ترکہ اور بقیع میں تدفین", es: "Los legados, la herencia y el entierro de Abd al-Rahman ibn Awf", fr: "Les legs, la succession et les funérailles d'Abd al-Rahman ibn Awf", tr: "Abdülrahman ibn Awf'ın vasiyeti, mal varlığı ve el-Baki'deki defni.", id: "Wasiat Abd al-Rahman ibn Awf, harta miliknya, dan pemakamannya di al-Baqi'." }
summary:
  ar: "أوصى عبد الرحمن بن عوف بخمسين ألف دينار في سبيل الله، وللبدريين الباقين بأربع مئة دينار لكل منهم وكانوا مئة فأخذها عثمان فيمن أخذ، وبمبلغ كثير لكل أم من أمهات المؤمنين، وروي أنه أوصى بألف فرس في سبيل الله {cite:siyar-alam-nubala scan vol. 2 p. 146} {cite:al-bidaya-wal-nihaya scan vol. 4 p. 163}. وترك ذهباً قُطع بالفؤوس حتى مجلت أيدي الرجال، وألف بعير ومئة فرس وثلاثة آلاف شاة، وأربع نسوة {cite:al-bidaya-wal-nihaya scan vol. 4 p. 164}. وصلى عليه عثمان وحمل سعد بن أبي وقاص جنازته ودُفن بالبقيع، وأرّخ جماعة وفاته سنة اثنتين وثلاثين {cite:al-bidaya-wal-nihaya scan vol. 4 p. 164} {cite:siyar-alam-nubala scan vol. 2 p. 147}."
  en: "Abd al-Rahman ibn Awf bequeathed fifty thousand dinars in God's cause, four hundred dinars to each of the surviving veterans of Badr, who numbered a hundred, Uthman taking his share with the rest, a large sum to each of the Mothers of the Believers, and, in one report, a thousand horses in God's cause {cite:siyar-alam-nubala scan vol. 2 p. 146} {cite:al-bidaya-wal-nihaya scan vol. 4 p. 163}. He left gold cut with axes until the men's hands blistered, a thousand camels, a hundred horses, three thousand sheep, and four wives {cite:al-bidaya-wal-nihaya scan vol. 4 p. 164}. Uthman prayed over him, Sa'd ibn Abi Waqqas carried his bier and he was buried in al-Baqi'; several authorities date his death to 32 AH {cite:al-bidaya-wal-nihaya scan vol. 4 p. 164} {cite:siyar-alam-nubala scan vol. 2 p. 147}."
  ur: "عبد الرحمن بن عوف نے اللہ کی راہ میں پچاس ہزار دینار کی وصیت کی، باقی ماندہ اہلِ بدر کو، جو سو تھے، فی کس چار سو دینار کی، جسے عثمان نے بھی دوسروں کے ساتھ لیا، ہر ام المومنین کو بڑی رقم کی، اور ایک روایت میں اللہ کی راہ میں ایک ہزار گھوڑوں کی {cite:siyar-alam-nubala scan vol. 2 p. 146} {cite:al-bidaya-wal-nihaya scan vol. 4 p. 163}۔ انھوں نے سونا چھوڑا جو کلہاڑوں سے کاٹا گیا یہاں تک کہ لوگوں کے ہاتھوں میں چھالے پڑ گئے، ایک ہزار اونٹ، سو گھوڑے، تین ہزار بکریاں اور چار بیویاں {cite:al-bidaya-wal-nihaya scan vol. 4 p. 164}۔ عثمان نے نماز جنازہ پڑھائی، سعد بن ابی وقاص نے ان کا جنازہ اٹھایا اور وہ بقیع میں دفن ہوئے؛ کئی اہلِ علم ان کی وفات ۳۲ ہجری بتاتے ہیں {cite:al-bidaya-wal-nihaya scan vol. 4 p. 164} {cite:siyar-alam-nubala scan vol. 2 p. 147}۔"
  es: "Abd al-Rahman ibn Awf legó cincuenta mil dinares a la causa de Dios, cuatrocientos dinares a cada uno de los veteranos supervivientes de Badr, que sumaban cien, Uthman tomando su parte con el resto, una gran suma a cada una de las Madres de los Creyentes, y, en un informe, mil caballos a la causa de Dios {cite:siyar-alam-nubala scan vol. 2 p. 146} {cite:al-bidaya-wal-nihaya scan vol. 4 p. 163}. Dejó oro cortado con hachas hasta que las manos de los hombres se ampollaron, mil camellos, cien caballos, tres mil ovejas y cuatro esposas {cite:al-bidaya-wal-nihaya scan vol. 4 p. 164}. Uthman oró por él, Sa'd ibn Abi Waqqas llevó su féretro y fue enterrado en al-Baqi'; Varias autoridades fechan su muerte en el año 32 AH {cite:al-bidaya-wal-nihaya scan vol. 4 p. 164} {cite:siyar-alam-nubala scan vol. 2 p. 147}."
  fr: "Abd al-Rahman ibn Awf légua cinquante mille dinars à la cause de Dieu, quatre cents dinars à chacun des cent vétérans survivants de Badr, Uthman recevant sa part avec les autres, une somme importante à chacune des Mères des Croyants, et, selon un récit, mille chevaux à la cause de Dieu {cite:siyar-alam-nubala scan vol. 2 p. 146} {cite:al-bidaya-wal-nihaya scan vol. 4 p. 163}. Il laissa de l'or taillé à la hache jusqu'à ce que les mains des hommes soient couvertes d'ampoules, mille chameaux, cent chevaux, trois mille moutons et quatre épouses {cite:al-bidaya-wal-nihaya scan vol. 4 p. 164}. Uthman pria pour lui, Sa'd ibn Abi Waqqas porta son cercueil et il fut enterré à al-Baqi'; plusieurs autorités datent sa mort de l'an 32 de l'Hégire {cite:al-bidaya-wal-nihaya scan vol. 4 p. 164} {cite:siyar-alam-nubala scan vol. 2 p. 147}."
  tr: "Abdülrahman ibn Avf, Allah rızası için elli bin dinar, Bedir savaşının geri kalan yüz gazisine ise her birine dörder yüz dinar vasiyet etti. Osman bu parayı diğerleriyle birlikte aldı. Ayrıca Müminlerin Annelerinin her birine de büyük miktarda miras bıraktı. Rivayetlere göre Allah rızası için bin at vasiyet etti. Balta ile kesilerek elleri su toplamış altın, bin deve, yüz at, üç bin koyun ve dört eş bıraktı. Osman onun cenaze namazını kıldırdı ve Sa'd ibn Abi Vakkas cenaze tabutunu taşıdı. El-Baki'ye defnedildi. Bir grup âlim ölüm tarihini otuz iki yılı olarak belirlemiştir. 164} {cite:siyar-alam-nubala scan vol. 2p. 147}."
  id: "Abd al-Rahman ibn Awf mewariskan lima puluh ribu dinar untuk kepentingan Allah, dan masing-masing empat ratus dinar kepada para veteran Perang Badar yang tersisa, yang berjumlah seratus orang. Utsman mengambil dana ini bersama dengan yang lainnya. Ia juga mewariskan sejumlah besar uang kepada masing-masing Ibu Kaum Beriman. Diriwayatkan bahwa ia mewariskan seribu kuda untuk kepentingan Allah. Ia meninggalkan emas yang harus dipotong dengan kapak hingga tangan para pria melepuh, seribu unta, seratus kuda, tiga ribu domba, dan empat istri. Utsman memimpin salat jenazah untuknya, dan Sa'd ibn Abi Waqqas mengusung peti jenazahnya. Ia dimakamkan di al-Baqi'. Sekelompok ulama menetapkan tanggal kematiannya pada tahun tiga puluh dua. 164} {cite:siyar-alam-nubala scan vol. 2p. 147}."
