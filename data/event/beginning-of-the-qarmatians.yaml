id: event/beginning-of-the-qarmatians
class: event
kind: revolt
label: { ar: "ابتداء أمر القرامطة", en: "Beginning of the Qarmatian movement", fr: "Le début du mouvement qarmate", es: "Comienzo del movimiento cármata", ur: "قرمطین تحریک کا آغاز", tr: "Karmati olayının başlangıcı", id: "Awal mula peristiwa Qarmatian" }
summary:
  ar: "في سنة ثمان وسبعين ومائتين ذكر الطبري ابتداء أمر القرامطة، وكان أوله قدوم رجل من ناحية خوزستان إلى سواد الكوفة، أظهر الزهد وأقام بموضع يُقال له النهرين، ثم أعلم من يجلس إليه أنه يدعو إلى إمام من أهل البيت {cite:tabari-tarikh-abu-al-fadl j.10 p.23}. وعند المسعودي ظهر القرمطي بالشام سنة تسع وثمانين ومائتين وكانت له حروب مع طغج وعساكر المصريين، وخرج المكتفي إلى الرقة وأخذ القرامطة سنة إحدى وتسعين، ووقع ذكرويه بن مهرويه بالحاج سنة أربع وتسعين حتى قتل وأدخل إلى مدينة السلام {cite:muruj-al-dhahab p. 638}"
  en: "In 278 AH al-Tabari records the beginning of the affair of the Qarmatians. It began when a man came from the Khuzestan region to the Sawad of Kufa; he showed asceticism and settled at a place called al-Nahrayn, then he told those who sat with him that he was calling to an imam of the Family of the Prophet {cite:tabari-tarikh-abu-al-fadl j.10 p.23}. According to al-Mas'udi, a Qarmati appeared in Syria in 289 AH and fought wars with Tughj and the armies of the Egyptians; al-Muktafi went out to al-Raqqa, the Qarmatians were taken in 291, and Dhikrawayh ibn Mihrawayh fell upon the pilgrims in 294 until he was killed and brought into Madinat al-Salam {cite:muruj-al-dhahab p. 638}"
  fr: "En 278 H, al-Tabari consigne le début de l'affaire des Qarmates. Elle commença quand un homme vint de la région du Khuzistan au Sawad de Koufa ; il fit montre d'ascétisme et s'installa en un lieu appelé al-Nahrayn, puis dit à ceux qui le fréquentaient qu'il appelait à un imam de la Famille du Prophète {cite:tabari-tarikh-abu-al-fadl j.10 p.23}. Selon al-Mas'udi, un Qarmate apparut en Syrie en 289 H et mena des guerres contre Tughj et les armées des Égyptiens ; al-Muktafi sortit vers al-Raqqa, les Qarmates furent pris en 291, et Dhikrawayh ibn Mihrawayh fondit sur les pèlerins en 294, jusqu'à ce qu'il soit tué et amené dans Madinat al-Salam {cite:muruj-al-dhahab p. 638}"
  es: "En el año 278 de la Hégira, al-Tabari registra el comienzo del asunto de los cármatas. Comenzó cuando un hombre de la región de Juzestán llegó al Sawad de Kufa; practicó el ascetismo y se estableció en un lugar llamado al-Nahrayn, donde les dijo a quienes lo acompañaban que estaba llamando a un imán de la Familia del Profeta {cite:tabari-tarikh-abu-al-fadl, vol. 10, pág. 23}. Según al-Mas'udi, un cármata apareció en Siria en el año 289 de la Hégira y libró guerras contra los Tughj y los ejércitos egipcios; al-Muktafi partió hacia al-Raqqa, los cármatas fueron capturados en el año 291, y Dhikrawayh ibn Mihrawayh atacó a los peregrinos en el año 294 hasta que fue asesinado y llevado a Medina {cite:muruj-al-dhahab, pág. 638}."
  ur: "278ھ میں الطبری نے قرمطیوں کے معاملہ کی ابتداء درج کی ہے۔ یہ اس وقت شروع ہوا جب ایک شخص خوزستان کے علاقے سے کوفہ کے سواد میں آیا۔ اس نے پرہیزگاری ظاہر کی اور النہرین نامی جگہ پر سکونت اختیار کی، پھر اس نے اپنے ساتھ بیٹھنے والوں کو بتایا کہ وہ خاندانِ نبوی کے ایک امام کو بلا رہے ہیں۔ المسعودی کے مطابق، ایک قرمتی 289 ہجری میں شام میں نمودار ہوا اور اس نے تغز اور مصریوں کی فوجوں سے جنگیں لڑیں۔ المکتفی الرقہ کے لیے نکلا، قرمطیوں کو 291 میں لے جایا گیا، اور ذکراویہ بن مہرویح 294 میں حجاج پر برس پڑے یہاں تک کہ اسے قتل کر کے مدینہ الصلوٰۃ میں لایا گیا۔ 638}"
  tr: "Hicri 278 yılında Taberi, Karmati hareketinin başlangıcından bahseder. Bu hareket, Huzistan bölgesinden bir adamın Kufe'nin eteklerine gelmesiyle başladı. Bu adam, zühd sahibi gibi davranarak el-Nahrayn adlı bir yere yerleşti. Daha sonra yanında oturanlara, Ehl-i Beyt'ten (Peygamber ailesinden) bir imama biat çağrısında bulunduğunu söyledi. {Kaynak: Taberi-tarikh-abu-al-fadl cilt 10, s. 23}. Mesudi'ye göre, Karmatiler Hicri 289 yılında Suriye'de ortaya çıktılar ve Tuğç ve Mısır ordusuyla savaştılar. Muktafi, Hicri 291 yılında Rakka'ya yürüdü ve Karmatileri ele geçirdi. Zikirveyh ibn Mahruveyh, Hicri 294 yılında hacılara saldırdı, öldürüldü ve Bağdat'a götürüldü. {cite:muruj-al-dhahab s. 638}"
  id: "Pada tahun 278 H, al-Tabari menyebutkan awal mula gerakan Qarmatian. Gerakan ini dimulai dengan kedatangan seorang pria dari wilayah Khuzestan ke pinggiran Kufa. Ia berpura-pura hidup asketis dan menetap di tempat bernama al-Nahrayn. Kemudian ia memberi tahu orang-orang yang duduk bersamanya bahwa ia menyerukan baiat kepada seorang Imam dari Ahl al-Bayt (keluarga Nabi). {cite:tabari-tarikh-abu-al-fadl vol.10 p.23}. Menurut al-Mas'udi, kaum Qarmatian muncul di Suriah pada tahun 289 H dan berperang dengan Tughj dan tentara Mesir. Al-Muktafi berbaris ke Raqqa dan menangkap kaum Qarmatian pada tahun 291 H. Dhikruwayh ibn Mahruwayh menyerang para peziarah pada tahun 294 H dan terbunuh serta dibawa ke Baghdad. {cite:muruj-al-dhahab p. 638}"
