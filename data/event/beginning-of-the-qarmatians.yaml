label: { ar: "ابتداء أمر القرامطة", en: "Beginning of the Qarmatian movement" }
summary:
  ar: "في سنة ثمان وسبعين ومائتين ذكر الطبري ابتداء أمر القرامطة، وكان أوله قدوم رجل من ناحية خوزستان إلى سواد الكوفة، أظهر الزهد وأقام بموضع يُقال له النهرين، ثم أعلم من يجلس إليه أنه يدعو إلى إمام من أهل البيت {cite:tabari-tarikh-abu-al-fadl j.10 p.23}. وعند المسعودي ظهر القرمطي بالشام سنة تسع وثمانين ومائتين وكانت له حروب مع طغج وعساكر المصريين، وخرج المكتفي إلى الرقة وأخذ القرامطة سنة إحدى وتسعين، ووقع ذكرويه بن مهرويه بالحاج سنة أربع وتسعين حتى قتل وأدخل إلى مدينة السلام {cite:muruj-al-dhahab p. 638}"
  en: "In 278 AH al-Tabari records the beginning of the affair of the Qarmatians. It began when a man came from the Khuzestan region to the Sawad of Kufa; he showed asceticism and settled at a place called al-Nahrayn, then he told those who sat with him that he was calling to an imam of the Family of the Prophet {cite:tabari-tarikh-abu-al-fadl j.10 p.23}. According to al-Mas'udi, a Qarmati appeared in Syria in 289 AH and fought wars with Tughj and the armies of the Egyptians; al-Muktafi went out to al-Raqqa, the Qarmatians were taken in 291, and Dhikrawayh ibn Mihrawayh fell upon the pilgrims in 294 until he was killed and brought into Madinat al-Salam {cite:muruj-al-dhahab p. 638}"
