id: event/last-minbar-sermon
class: event
kind: other
tags: [wasaya-browser, wasaya-prophets, wasaya-wasiyya, wasaya-ihtidar]
label: { en: "The last sermon from the minbar", ar: "الخطبة الأخيرة على المنبر", es: "El último sermón desde el minbar", fr: "Le dernier sermon du minbar", ur: "منبر سے آخری خطبہ", tr: "Kürsüden verilen son vaaz", id: "Khotbah terakhir dari mimbar." }
summary:
  en: "Five days before his death the Prophet, head bandaged, sat on the minbar and warned against taking graves as places of worship, offered himself to retaliation for any wrong, counselled generosity toward the Ansar 'accept from their well-doer and overlook their wrongdoer', spoke of a servant who chose what is with God, and ordered every door into the mosque shut except Abu Bakr's."
  ar: "قبل وفاته بخمسة أيام جلس النبي معصوب الرأس على المنبر فنهى عن اتخاذ القبور مساجد، وعرض نفسه للقصاص لمن أصابه بسوء، وأوصى بالأنصار «فاقبلوا من محسنهم وتجاوزوا عن مسيئهم»، وحدث عن عبد خيّره الله فاختار ما عنده، وأمر أن لا يبقى في المسجد باب إلا سُد إلا باب أبي بكر."
  es: "Cinco días antes de su muerte, el Profeta, con la cabeza vendada, se sentó en el minbar y advirtió contra la profanación de tumbas como lugares de culto, se ofreció a sufrir represalias por cualquier agravio, aconsejó generosidad hacia los Ansar (\"aceptad de quienes obran bien y perdonad a quienes obran mal\"), habló de un siervo que eligió lo que está con Dios y ordenó que se cerraran todas las puertas de la mezquita, excepto la de Abu Bakr."
  fr: "Cinq jours avant sa mort, le Prophète, la tête bandée, s'assit sur le minbar et mit en garde contre le fait de considérer les tombes comme des lieux de culte, s'offrit en représailles pour tout tort, conseilla la générosité envers les Ansar « acceptez de leur bienfaiteur et pardonnez à leur malfaiteur », parla d'un serviteur qui avait choisi ce qui est auprès de Dieu et ordonna que toutes les portes de la mosquée soient fermées, sauf celle d'Abu Bakr."
  ur: "اپنی وفات سے پانچ دن پہلے نبی نے سر پر پٹی باندھی، منبر پر بیٹھ کر قبروں کو عبادت گاہ نہ بنانے کی تلقین کی، اپنے آپ کو کسی بھی غلط کا بدلہ لینے کے لیے پیش کیا، انصار کے لیے سخاوت کی تلقین کی، 'انصار کی خیر خواہی قبول کریں اور ان کے ظالم کو نظر انداز کریں'، ایک ایسے بندے کے بارے میں بات کی جس نے خدا کے پاس جو ہے اسے منتخب کیا، اور ابو بکر کے علاوہ ہر دروازے کو مسجد میں داخل کرنے کا حکم دیا۔"
  tr: "Peygamberimiz vefatından beş gün önce, başı bandajlı bir şekilde minbere çıktı ve mezarların ibadet yeri olarak kullanılmasını yasakladı. Kendisine zarar verenlerden intikam almak için kendini feda etti ve Ensar hakkında şu talimatı verdi: \"Onların iyilerinden kabul edin, kötülerinden ise uzak durun.\" Allah'ın kendisine seçim hakkı verdiği ve yanında olanı seçtiği bir kul hakkında bir hikaye anlattı. Mescitte Ebu Bekir'in kapısı dışında hiçbir kapının açık kalmamasını emretti."
  id: "Lima hari sebelum wafatnya, Nabi duduk dengan kepala dibalut perban di mimbar dan melarang menjadikan kuburan sebagai tempat ibadah. Beliau menyerahkan diri untuk menerima pembalasan bagi siapa pun yang menyakitinya, dan beliau memberikan instruksi mengenai kaum Ansar: “Terimalah amal kebaikan dari mereka dan abaikan amal keburukan mereka.” Beliau menceritakan kisah tentang seorang hamba yang diberi pilihan oleh Allah dan ia memilih apa yang ada padanya. Beliau memerintahkan agar tidak ada pintu di masjid yang boleh tetap terbuka kecuali pintu Abu Bakar."
