id: event/last-minbar-sermon
class: event
kind: other
label: { en: "The last sermon from the minbar", ar: "الخطبة الأخيرة على المنبر" }
summary:
  en: "Five days before his death the Prophet, head bandaged, sat on the minbar and warned against taking graves as places of worship, offered himself to retaliation for any wrong, counselled generosity toward the Ansar 'accept from their well-doer and overlook their wrongdoer', spoke of a servant who chose what is with God, and ordered every door into the mosque shut except Abu Bakr's."
  ar: "قبل وفاته بخمسة أيام جلس النبي معصوب الرأس على المنبر فنهى عن اتخاذ القبور مساجد، وعرض نفسه للقصاص لمن أصابه بسوء، وأوصى بالأنصار «فاقبلوا من محسنهم وتجاوزوا عن مسيئهم»، وحدث عن عبد خيّره الله فاختار ما عنده، وأمر أن لا يبقى في المسجد باب إلا سُد إلا باب أبي بكر."
