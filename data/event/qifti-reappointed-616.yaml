label:
  ar: "الملك العزيز يعيد القفطي إلى ديوان المال، ٦١٦هـ"
  en: "Al-Malik al-Aziz reappoints al-Qifti over the diwan of finances, 616/1219"
  ur: "ملک عزیز نے قفطی کو دیوان مال پر بحال کیا، 616ھ/1219ء"
summary:
  ar: "أعاد الملك العزيز محمد بن الظاهر القفطيَ إلى منصبه على ديوان المال بعد ثلاث سنين من استقالته، فشغله دون انقطاع حتى سنة ثمان وعشرين وستمائة {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  en: "Three years after his resignation, al-Malik al-Aziz Muhammad ibn al-Zahir appointed al-Qifti to the same post over the diwan of finances, which he then held without interruption until 628/1230 {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}."
  ur: "استعفے کے تین برس بعد ملک عزیز محمد بن ظاہر نے قفطی کو دیوان مال کے اسی منصب پر مقرر کیا جو وہ بلا انقطاع 628ھ/1230ء تک سنبھالتے رہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}۔"
