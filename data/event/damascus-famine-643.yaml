  id: "Pada tahun 643 Hijriah, terjadi inflasi ekstrem di Damaskus. Satu karung dijual seharga 1.600 dirham, dan orang-orang memakan bangkai, serta banyak tokoh terkemuka meninggal di sana. {cite:shadharat-dhahab hlm. 224}."
