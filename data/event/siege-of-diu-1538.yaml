  tr: "Hint Okyanusu'nun en büyük olaylarından biri olan, Portekizlilerin Kanuni Sultan Süleyman ve Gujaratis'in ordusunu püskürttüğü 1538 yılındaki Diu kuşatmasının ön anlatımı; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang pengepungan Diu pada tahun 1538 M, bagaimana Portugis berhasil memukul mundur pasukan Suleiman Agung dan Gujarat dalam peristiwa terbesar di Samudra Hindia; sumber-sumbernya belum ditinjau di halaman ini."
