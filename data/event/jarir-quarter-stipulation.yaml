label: { ar: "اشتراط جرير ربع ما غلب عليه", en: "Jarir's Stipulation of a Quarter of What He Conquered", es: "La estipulación de Jarir de recibir una cuarta parte de lo que conquistó.", fr: "La condition de Jarir: un quart de ce qu'il a conquis" }
summary:
  ar: "عند البلاذري: مكث عمر سنة لا يذكر العراق لمصاب أبي عبيد وسليط وكان المثنى مقيماً بناحية أليس يدعو العرب إلى الجهاد ثم ندب عمر الناس إلى العراق فجعلوا يتحامونه ويتشاقون عنه حتى هم أن يغزو بنفسه وقدم عليه خلق من الأزد يريدون غزو الشام فدعاهم إلى العراق ورغبهم في غنائم آل كسرى فردّوا الاختيار إليه فأمرهم بالشخوص وقدم جرير بن عبد الله من السراة في بجيلة فسأل أن يأتي العراق على أن يعطى وقومه ربع ما غلبوا عليه فأجابه عمر إلى ذلك فسار نحو العراق وقوم يزعمون أنه مر على طريق البصرة وواقع مرزبان المذار فهزمه وآخرون يزعمون أنه واقع المرزبان وهو مع خالد بن الوليد وقوم يقولون إنه سلك الطريق على فيد والتعلبية إلى المذيب."
  en: "In al-Baladhuri: Umar went a year not mentioning Iraq for the disaster of Abu Ubayd and Salit, al-Muthanna stationed near Ulays calling the Arabs to jihad; then Umar summoned the people to Iraq and they kept dodging and declining until he meant to raid himself — when a party of Azd came wanting to raid Syria, he called them to Iraq and made Khosrow's house's spoils desirable, so they left the choice to him and he ordered their departure. Jarir ibn Abdallah came from al-Sarat among Bajila asking to go to Iraq on condition he and his people be given a quarter of what they conquered — Umar agreed, and he marched toward Iraq; some allege he passed by Basra's road and fought the Madhar marzban, defeating him, others that he fought the marzban while with Khalid ibn al-Walid, and some say he took the road over Fayd and al-Ta'labiyya to al-Mudhayyib."
  es: "En al-Baladhuri: Umar pasó un año sin mencionar Irak debido al desastre de Abu Ubayd y Salit, al-Muthanna apostado cerca de Ulays llamando a los árabes a la yihad; luego Umar convocó al pueblo a Irak y ellos siguieron esquivando y negándose hasta que él decidió saquear él mismo; cuando un grupo de Azd llegó queriendo saquear Siria, los llamó a Irak y les hizo deseables los botines de la casa de Khosrow, así que le dejaron la decisión a él y ordenó su partida. Jarir ibn Abdallah vino de al-Sarat entre Bajila pidiendo ir a Irak con la condición de que él y su gente recibieran una cuarta parte de lo que conquistaran; Umar aceptó y marchó hacia Irak; algunos alegan que pasó por el camino de Basora y luchó contra el marzban Madhar, derrotándolo, otros que luchó contra el marzban mientras estaba con Khalid ibn al-Walid, y algunos dicen que tomó el camino a través de Fayd y al-Ta'labiyya hacia al-Mudhayyib."
  fr: "Dans al-Baladhuri: Umar passa une année sans mentionner l’Irak, en raison du désastre d’Abu Ubayd et de Salit. Al-Muthanna, stationné près d’Ulays, appelait les Arabes au djihad. Umar appela ensuite le peuple en Irak, mais celui-ci esquiva et refusa sans cesse, jusqu’à ce qu’il décide de mener lui-même un raid. Lorsqu’un groupe d’Azd vint piller la Syrie, il les appela en Irak et leur fit miroiter le butin de la maison de Khosrow. Ils s’en retinrent donc et il leur ordonna de partir. Jarir ibn Abdallah, venu d’al-Sarat, parmi les Bajila, demanda la permission d’aller en Irak à condition que lui et son peuple reçoivent un quart du butin conquis. Umar accepta et marcha vers l’Irak. Certains affirment qu’il passa par la route de Bassora et affronta le marzban de Madhar, le vainquant; d’autres disent qu’il le combattit aux côtés de Khalid ibn al-Walid; d’autres encore affirment qu’il emprunta la route de Fayd et d’al-Ta’labiyya pour atteindre al-Mudhayyib."
