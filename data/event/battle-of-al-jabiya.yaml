label: { ar: "الصدام الأول قرب الجابية ⁦(١٥هـ)⁩", en: "The clash near al-Jabiya (15 AH / 636)", ur: "الجابیہ کے قریب پہلی جھڑپ ⁦(١٥ھ)⁩", fr: "L'affrontement près d'al-Jabiya (15 H / 636)", es: "El enfrentamiento cerca de al-Jabiya (15 AH / 636)", tr: "El-Cabiye yakınlarındaki ilk çatışma (Hicri 15)", id: "Bentrokan pertama di dekat Al-Jabiyah (15 H)" }
summary:
  ar: "الصدام التمهيدي الذي سبق يوم اليرموك. تذكر دائرة المعارف الإسلامية أن المعركة تسمى أيضاً اليرموك أو الجابية، وأنها بدأت بمناورات قرب الجابية قاعدة الغساسنة، وأن المسلمين بقيادة أبي عبيدة بن الجراح فازوا في صدام أولي هناك يوم 13 جمادى الآخرة سنة 15هـ الموافق 23 تموز 636م، ثم حُسم الأمر بعد نحو شهر في اليرموك {cite:encyclopaedia-of-islam-2 vol. 11 p. 302} {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  en: "The preliminary engagement before the decisive day of the Yarmuk. The Encyclopaedia of Islam says the battle is also called that of the Yarmuk or Djabiya, that it began with manoeuvres near al-Jabiya, the Ghassanid base, and that the Muslims under Abu Ubayda ibn al-Jarrah won an initial clash there on 13 Jumada II 15/23 July 636; the decisive fighting came about a month later at the Yarmuk {cite:encyclopaedia-of-islam-2 vol. 11 p. 302} {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  ur: "یرموک کے فیصلہ کن دن سے پہلے کی ابتدائی جھڑپ۔ اسلامی دائرۃ المعارف کے مطابق اس جنگ کو یرموک یا جابیہ بھی کہا جاتا ہے، یہ غسانیوں کے اڈے الجابیہ کے قریب چالوں سے شروع ہوئی، اور ابو عبیدہ بن الجراح کی قیادت میں مسلمانوں نے 13 جمادی الآخرہ سنہ 15ھ بمطابق 23 جولائی 636ء کو وہاں پہلی جھڑپ جیتی؛ فیصلہ کن لڑائی تقریباً ایک ماہ بعد یرموک میں ہوئی {cite:encyclopaedia-of-islam-2 vol. 11 p. 302} {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}۔"
  fr: "L'engagement préliminaire avant la journée décisive du Yarmouk. L'Encyclopédie de l'Islam dit que la bataille est aussi appelée celle du Yarmouk ou de Djabiya, qu'elle commença par des manœuvres près d'al-Jabiya, la base ghassanide, et que les musulmans sous Abu Ubayda ibn al-Jarrah y remportèrent un premier affrontement le 13 Jumada II 15/23 juillet 636 ; les combats décisifs eurent lieu environ un mois plus tard au Yarmouk {cite:encyclopaedia-of-islam-2 vol. 11 p. 302} {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  es: "El enfrentamiento preliminar antes del día decisivo del Yarmuk. La Enciclopedia del Islam dice que la batalla también se llama la del Yarmuk o Djabiya, que comenzó con maniobras cerca de al-Jabiya, la base de los gasánidas, y que los musulmanes bajo el mando de Abu Ubayda ibn al-Jarrah ganaron un choque inicial allí el 13 de Jumada II 15/23 de julio de 636; la lucha decisiva tuvo lugar aproximadamente un mes después en el Yarmuk {cite:encyclopaedia-of-islam-2 vol. 11 p. 302} {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  tr: "Yermuk Muharebesi'nden önce gerçekleşen ön çatışma. İslam Ansiklopedisi, bu savaşın Yermuk veya Câbiye olarak da adlandırıldığını ve Gazanilerin üssü olan Câbiye yakınlarında yapılan manevralarla başladığını, Ebu Ubeyde ibn el-Cerrah önderliğindeki Müslümanların Hicri 15. yılın Cemadi el-Ahire ayının 13. gününde (Miladi 23 Temmuz 636) orada ilk çatışmayı kazandığını ve ardından yaklaşık bir ay sonra Yermuk'ta meselenin karara bağlandığını belirtmektedir. {cite:encyclopaedia-of-islam-2 vol. 11 p. 302} {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}"
  id: "Bentrokan awal yang mendahului Pertempuran Yarmouk. Ensiklopedia Islam menyebutkan bahwa pertempuran ini juga disebut Yarmouk atau Jabiyah, dan bahwa pertempuran dimulai dengan manuver di dekat Jabiyah, basis Dinasti Ghassanid, dan bahwa kaum Muslim, yang dipimpin oleh Abu Ubaidah ibn al-Jarrah, memenangkan bentrokan awal di sana pada tanggal 13 Jumada al-Akhirah, 15 H, yang bertepatan dengan 23 Juli 636 M, dan kemudian masalah tersebut diputuskan sekitar sebulan kemudian di Yarmouk {cite:encyclopaedia-of-islam-2 vol. 11 p. 302} {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
