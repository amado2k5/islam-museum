id: event/battle-of-al-jabiya
class: event
kind: skirmish
label: { ar: "الصدام الأول قرب الجابية ⁦(١٥هـ)⁩", en: "The clash near al-Jabiya (15 AH / 636)", ur: "الجابیہ کے قریب پہلی جھڑپ ⁦(١٥ھ)⁩" }
summary:
  ar: "الصدام التمهيدي الذي سبق يوم اليرموك. تذكر دائرة المعارف الإسلامية أن المعركة تسمى أيضاً اليرموك أو الجابية، وأنها بدأت بمناورات قرب الجابية قاعدة الغساسنة، وأن المسلمين بقيادة أبي عبيدة بن الجراح فازوا في صدام أولي هناك يوم 13 جمادى الآخرة سنة 15هـ الموافق 23 تموز 636م، ثم حُسم الأمر بعد نحو شهر في اليرموك {cite:encyclopaedia-of-islam-2 vol. 11 p. 302} {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  en: "The preliminary engagement before the decisive day of the Yarmuk. The Encyclopaedia of Islam says the battle is also called that of the Yarmuk or Djabiya, that it began with manoeuvres near al-Jabiya, the Ghassanid base, and that the Muslims under Abu Ubayda ibn al-Jarrah won an initial clash there on 13 Jumada II 15/23 July 636; the decisive fighting came about a month later at the Yarmuk {cite:encyclopaedia-of-islam-2 vol. 11 p. 302} {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  ur: "یرموک کے فیصلہ کن دن سے پہلے کی ابتدائی جھڑپ۔ اسلامی دائرۃ المعارف کے مطابق اس جنگ کو یرموک یا جابیہ بھی کہا جاتا ہے، یہ غسانیوں کے اڈے الجابیہ کے قریب چالوں سے شروع ہوئی، اور ابو عبیدہ بن الجراح کی قیادت میں مسلمانوں نے 13 جمادی الآخرہ سنہ 15ھ بمطابق 23 جولائی 636ء کو وہاں پہلی جھڑپ جیتی؛ فیصلہ کن لڑائی تقریباً ایک ماہ بعد یرموک میں ہوئی {cite:encyclopaedia-of-islam-2 vol. 11 p. 302} {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}۔"
