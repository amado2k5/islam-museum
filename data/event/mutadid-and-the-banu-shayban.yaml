label: { ar: "قصد المعتضد بني شيبان وصلحه معهم", en: "Al-Mu'tadid's advance on Banu Shayban and his peace with them", es: "El avance de Al-Mu'tadid sobre Banu Shayban y su paz con ellos.", fr: "L'avancée d'Al-Mu'tadid contre les Banu Shayban et sa paix avec eux", ur: "بنو شیبان پر معتد کی پیش قدمی اور ان کے ساتھ صلح" }
summary:
  ar: "في سنة ثمانين ومائتين ذكر الطبري قصد المعتضد بني شيبان في الجزيرة، فلما بلغهم قصده ضمّوا أموالهم وعيالهم، ثم رجع المعتضد إلى بغداد فلقيه بنو شيبان يسألونه الصفح ويبذلون الرهائن، فأخذ منهم خمسمائة رجل فيما قيل {cite:tabari-tarikh-abu-al-fadl j.10 p.32} {cite:tabari-tarikh-abu-al-fadl j.10 p.33}."
  en: "In 280 al-Tabari records al-Mu'tadid's advance on Banu Shayban in the Jazira; when word reached them they gathered up their property and their families. Al-Mu'tadid then returned to Baghdad, where the Banu Shayban met him asking for pardon and offering hostages; he took five hundred men from them, so it was said {cite:tabari-tarikh-abu-al-fadl j.10 p.32} {cite:tabari-tarikh-abu-al-fadl j.10 p.33}."
  es: "En el año 280, al-Tabari registra el avance de al-Mu'tadid sobre los Banu Shayban en Jazira; cuando la noticia llegó a ellos, reunieron sus propiedades y a sus familias. Al-Mu'tadid regresó entonces a Bagdad, donde los Banu Shayban lo recibieron pidiendo perdón y ofreciendo rehenes; tomó quinientos hombres de entre ellos, según se cuenta {cite:tabari-tarikh-abu-al-fadl j.10 p.32} {cite:tabari-tarikh-abu-al-fadl j.10 p.33}."
  fr: "En 280, al-Tabari relate l'avancée d'al-Mu'tadid contre les Banu Shayban dans la Jazira; lorsqu'ils apprirent la nouvelle, ils rassemblèrent leurs biens et leurs familles. Al-Mu'tadid retourna ensuite à Bagdad, où les Banu Shayban l'accueillirent, implorant son pardon et lui offrant des otages; il leur prit cinq cents hommes, selon la tradition."
  ur: "280 میں الطبری نے جزیرہ میں بنو شیبان پر المتدد کی پیش قدمی درج کی ہے۔ جب ان تک بات پہنچی تو انہوں نے اپنی جائیداد اور اپنے گھر والوں کو جمع کر لیا۔ المتدید پھر بغداد واپس آیا، جہاں بنو شیبان نے ان سے معافی مانگتے ہوئے اور یرغمالیوں کی پیشکش کی۔ اس نے ان سے پانچ سو آدمی لیے، چنانچہ کہا گیا {حوالہ: طبری-تاریخ-ابو الفضل ج10 ص32}"
