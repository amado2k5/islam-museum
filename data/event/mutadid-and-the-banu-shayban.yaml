label: { ar: "قصد المعتضد بني شيبان وصلحه معهم", en: "Al-Mu'tadid's advance on Banu Shayban and his peace with them" }
summary:
  ar: "في سنة ثمانين ومائتين ذكر الطبري قصد المعتضد بني شيبان في الجزيرة، فلما بلغهم قصده ضمّوا أموالهم وعيالهم، ثم رجع المعتضد إلى بغداد فلقيه بنو شيبان يسألونه الصفح ويبذلون الرهائن، فأخذ منهم خمسمائة رجل فيما قيل {cite:tabari-tarikh-abu-al-fadl j.10 p.32} {cite:tabari-tarikh-abu-al-fadl j.10 p.33}."
  en: "In 280 al-Tabari records al-Mu'tadid's advance on Banu Shayban in the Jazira; when word reached them they gathered up their property and their families. Al-Mu'tadid then returned to Baghdad, where the Banu Shayban met him asking for pardon and offering hostages; he took five hundred men from them, so it was said {cite:tabari-tarikh-abu-al-fadl j.10 p.32} {cite:tabari-tarikh-abu-al-fadl j.10 p.33}."
