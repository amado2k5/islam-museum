id: "event/banu-rabia-of-hamdan-send-a-letter-and-ask-ali-ibn-muhammad-to-march-with-them-and-he-declines-295"
class: event
kind: other
label:
  ar: "بنو ربيعة من همدان يطلبون من علي بن محمد المسير معهم فيأبى، 295هـ، ص381-382"
  en: "Banu Rabi'a of Hamdan ask Ali ibn Muhammad to march with them and he declines, 295 AH, pp. 381-382"
  ur: "همدان کی بنو ربیعہ علی بن محمد سے اپنے ساتھ چلنے کا مطالبہ کرتے ہیں اور وہ انکار کرتا ہے، 295ھ، ص381-382"
  fr: "Les Banu Rabi'a de Hamdan demandent à Ali ibn Muhammad de marcher avec eux, et il refuse, 295 H, p. 381-382"
  es: "Los Banu Rabi'a de Hamdan le piden a Ali ibn Muhammad que marche con ellos, pero él se niega. 295 AH, págs. 381-382."
  tr: "Hamdan'daki Beni Rabi'ah kabilesi, Ali ibn Muhammed'den kendileriyle birlikte yürüyüşe katılmasını istedi, ancak o reddetti. 295 Hicri, s. 381-382"
  id: "Bani Rabi'ah dari Hamdan meminta Ali bin Muhammad untuk ikut berbaris bersama mereka, tetapi dia menolak. 295 H, hlm. 381-382"
summary:
  ar: "أتاه يزيد بن علي الجعدي ومحمد بن أيوب في البقيرة بكتاب من بني ربيعة يدعونه إلى المسير معهما، فأبى حتى يرى القتال مع عدوه، ثم رجع إلى الحصن، وأغار من بقي من بني ربيعة في ميناس إلى القرية."
  en: "At al-Buqayra, Yazid ibn Ali and Muhammad ibn Ayyub gave Ali ibn Muhammad a letter from Banu Rabi'a of Hamdan asking him to march with them. He refused until he saw them fighting the enemy, and went back to the fort. The narrator says Banu Rabi'a meant treachery, and the Banu Rabi'a who stayed at Minas raided toward the village to join their companions."
  ur: "البقیرہ میں یزید بن علی الجعدی اور محمد بن ایوب علی بن محمد کے پاس بنو ربیعہ کا خط لے کر آئے جس میں اسے اپنے ساتھ چلنے کی دعوت تھی۔ اس نے انکار کیا جب تک وہ دشمن سے لڑتے ہوئے نہ دیکھے، پھر حصن کو واپس لوٹ گیا۔ راوی کے مطابق بنو ربیعہ نے دھوکا دینے کا ارادہ کیا تھا، اور جو بنو ربیعہ میناس میں رہ گئے تھے انہوں نے اپنے ساتھیوں سے ملنے کے لیے گاؤں پر حملہ کیا۔"
  fr: "À al-Buqayra, Yazid ibn Ali et Muhammad ibn Ayyub remirent à Ali ibn Muhammad une lettre des Banu Rabi'a de Hamdan lui demandant de marcher avec eux. Il refusa tant qu'il ne les verrait pas combattre l'ennemi, et retourna au fort. Le narrateur dit que les Banu Rabi'a voulaient la trahison, et les Banu Rabi'a restés à Minas lancèrent un raid vers le village pour rejoindre leurs compagnons."
  es: "En al-Buqayra, Yazid ibn Ali y Muhammad ibn Ayyub le entregaron a Ali ibn Muhammad una carta de los Banu Rabi'a de Hamdan pidiéndole que marchara con ellos. Él se negó hasta que los vio combatiendo al enemigo, y regresó a la fortaleza. El narrador afirma que Banu Rabi'a significaba traición, y los Banu Rabi'a que se quedaron en Minas se dirigieron hacia la aldea para unirse a sus compañeros."
  tr: "Yezid bin Ali el-Ca'di ve Muhammed bin Eyyub, Beni Rabi'ye'den gelen ve kendisiyle birlikte savaşa katılmaya davet eden bir mektupla Bakara'ya geldiler; ancak o, düşmanıyla olan savaşı görene kadar reddetti. Sonra kaleye geri döndü ve Beni Rabi'ye'den Minas'ta kalanlar köye baskın düzenlediler."
  id: "Yazid bin Ali al-Ja’di dan Muhammad bin Ayyub datang kepadanya di al-Baqirah dengan surat dari Bani Rabi’ah yang mengundangnya untuk ikut berbaris bersama mereka, tetapi dia menolak sampai dia melihat pertempuran dengan musuhnya. Kemudian dia kembali ke benteng, dan mereka yang tersisa dari Bani Rabi’ah di Minas menyerbu desa tersebut."
