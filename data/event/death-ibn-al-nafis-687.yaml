id: event/death-ibn-al-nafis-687
class: event
kind: death
label:
  ar: "وفاة ابن النفيس بالقاهرة ووقف أملاكه وكتبه على المارستان المنصوري، ٢١ ذو القعدة ٦٨٧هـ"
  en: "Death of Ibn al-Nafis at Cairo and his endowment of estate and books to the Mansuri maristan, 21 Dhu al-Qa'da 687/December 1288"
  ur: "ابن نفیس کی وفات قاہرہ میں اور املاک و کتب کا وقف برائے مارستانِ منصوری، 21 ذی قعدہ 687ھ/دسمبر 1288ء"
summary:
  ar: "توفي ابن النفيس بالقاهرة في الحادي والعشرين من ذي القعدة سنة سبع وثمانين وستمائة (ديسمبر 1288م) وقد قارب الثمانين — وفي هامش الشذرات «وله أربع وثمانون سنة» — ووقف داره وأملاكه وكتبه على المارستان المنصوري، ولم يُخلّف بعده مثله {cite:shadharat-dhahab p. 401-402} {cite:tarikh-islam-dhahabi s.a. 687 p. 312} {cite:encyclopaedia-of-islam-2 vol. 3 p. 897}؛ ويروي السويدان أنه امتنع عند احتضاره عن الخمر الذي كان يوصف له دواءً قائلاً إنه لا يلقى الله وفي جوفه شيء من الخمر، وتوفي فجر الجمعة {cite:assabile-tareq-al-suwaidan al-mubdioune/ep17 00:22:30}."
  en: "Ibn al-Nafis died at Cairo on 21 Dhu al-Qa'da 687 (December 1288) aged about eighty — the Shadharat margin notes 'he was eighty-four' — and endowed his house, fortune and books to the Mansuri maristan; none like him came after {cite:shadharat-dhahab p. 401-402} {cite:tarikh-islam-dhahabi s.a. 687 p. 312} {cite:encyclopaedia-of-islam-2 vol. 3 p. 897}. Al-Suwaydan relates that on his deathbed he refused the wine prescribed him as medicine, saying he would not meet God with wine in his body, and died at dawn on Friday {cite:assabile-tareq-al-suwaidan al-mubdioune/ep17 00:22:30}."
  ur: "ابن نفیس 21 ذی قعدہ 687ھ (دسمبر 1288ء) کو قاہرہ میں تقریباً اسی برس کی عمر میں فوت ہوئے — شذرات کے حاشیے میں «چوراسی برس» ہے — اور اپنے گھر، املاک اور کتب مارستانِ منصوری پر وقف کر دیے؛ ان کے بعد ان جیسا کوئی نہ آیا {cite:shadharat-dhahab p. 401-402} {cite:tarikh-islam-dhahabi s.a. 687 p. 312} {cite:encyclopaedia-of-islam-2 vol. 3 p. 897}۔ سویدان روایت کرتے ہیں کہ مرگ کے وقت انھوں نے بطورِ دوا دی گئی شراب سے انکار کیا کہ وہ خدا سے اس حالت میں نہیں ملیں گے، اور جمعہ کے وقتِ فجر فوت ہوئے {cite:assabile-tareq-al-suwaidan al-mubdioune/ep17 00:22:30}۔"
