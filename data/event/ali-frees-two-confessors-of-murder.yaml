id: event/ali-frees-two-confessors-of-murder
class: event
kind: court-ruling
label: { ar: "علي يفرج عن رجلين اعترفا بقتل واحد ويدفع الدية من بيت المال", en: "Ali frees two men who each confessed to one killing and pays the diya from the treasury" }
summary:
  ar: "أُتي علي برجل بيده سكين ملطخة بدم، وبين يديه قتيل، فاعترف بالقتل ثم ظهر رجل آخر فاعترف هو أيضاً، فسأل علي كلاً منهما، فروى كل واحد قصته، ثم قال الحسن الحكم فيهما: إن كان قد قتل نفساً فقد أحيا نفساً. فخلى علي سبيلهما، وأخرج دية القتيل من بيت المال، ويرى الصلابي أن علياً ربما فعل ذلك بعد أن أسقط أولياء القتيل حقهم بالقصاص {cite:sallabi-ali-vol1 p. 313}."
  en: "Two men each confessed to the same killing before Ali. Hasan's ruling was that the one who had killed had saved a life by confessing; Ali released both and paid the diya from the treasury. The book suggests the victim's heirs may have waived retaliation."
