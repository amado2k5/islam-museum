id: event/ali-frees-two-confessors-of-murder
class: event
kind: court-ruling
label: { ar: "علي يفرج عن رجلين اعترفا بقتل واحد ويدفع الدية من بيت المال", en: "Ali frees two men who each confessed to one killing and pays the diya from the treasury", es: "Ali libera a dos hombres que confesaron un asesinato cada uno y paga la diya del tesoro.", fr: "Ali libère deux hommes qui ont chacun avoué un meurtre et paie la diya avec le trésor.", ur: "علی دو آدمیوں کو رہا کرتا ہے جنہوں نے ہر ایک نے ایک قتل کا اعتراف کیا اور خزانے سے دیت ادا کی۔" }
summary:
  ar: "أُتي علي برجل بيده سكين ملطخة بدم، وبين يديه قتيل، فاعترف بالقتل ثم ظهر رجل آخر فاعترف هو أيضاً، فسأل علي كلاً منهما، فروى كل واحد قصته، ثم قال الحسن الحكم فيهما: إن كان قد قتل نفساً فقد أحيا نفساً. فخلى علي سبيلهما، وأخرج دية القتيل من بيت المال، ويرى الصلابي أن علياً ربما فعل ذلك بعد أن أسقط أولياء القتيل حقهم بالقصاص {cite:sallabi-ali-vol1 p. 313}."
  en: "Two men each confessed to the same killing before Ali. Hasan's ruling was that the one who had killed had saved a life by confessing; Ali released both and paid the diya from the treasury. The book suggests the victim's heirs may have waived retaliation."
  es: "Dos hombres confesaron el mismo asesinato ante Ali. El juez Hasan dictaminó que quien había matado había salvado una vida al confesar; Ali los liberó a ambos y pagó la lámpara de aceite con fondos del tesoro. El libro sugiere que los herederos de la víctima podrían haber renunciado a la venganza."
  fr: "Deux hommes avouèrent le même meurtre devant Ali. Le jugement d'Hasan stipula que le meurtrier avait sauvé une vie en avouant; Ali les libéra tous deux et paya la diya avec les fonds du trésor. Le livre laisse entendre que les héritiers de la victime renoncèrent peut-être à toute vengeance."
  ur: "علی کے سامنے دو دو آدمیوں نے اسی قتل کا اعتراف کیا۔ حسن کا حکم یہ تھا کہ جس نے قتل کیا اس نے اقرار کرکے جان بچائی۔ علی نے دونوں کو رہا کر دیا اور خزانے سے دیت ادا کر دی۔ کتاب سے پتہ چلتا ہے کہ مقتول کے ورثاء نے انتقامی کارروائی کو معاف کر دیا ہے۔"
