summary:
  ar: "وصل وفد ملك مالي منسا سليمان إلى فاس في صفر سنة 762هـ بهدية سلطانهم — الزرافة، الحيوان الغريب الشكل العظيم الهيكل — مكافأةً على هدية السلطان أبي الحسن؛ وكان يوم وفادتهم يوماً مشهوداً جلس السلطان فيه ببرج الذهب مجلس عرض، وازدحم الناس على الزرافة إعجاباً بخلقتها وأنشد الشعراء في عرض المدح، وحيا الوفد السلطان يحثون التراب على رؤوسهم ويصدقون الترجمان بالنزع في أوتار قسيهم، واعتذروا عن إبطاء الهدية بما كان من تواثب ملوك مالي على الملك بعد مهلك منسا سليمان."
  en: "In Safar 762 AH the embassy of Mali's king Mansa Sulayman reached Fez bearing their sultan's gift — a giraffe, that strange-formed, huge-bodied creature — in return for Sultan Abu al-Hasan's own embassy; it was a celebrated day, the sultan seated at the Tower of Gold in review while crowds climbed over one another to behold the giraffe and poets declaimed praise, the envoys greeting the sultan by tossing dust on their heads and confirming the interpreter's words by twanging their bowstrings, excusing the gift's delay by the struggle for Mali's throne after Mansa Sulayman's death."
  es: "En Safar 762 AH, la embajada del rey de Malí, Mansa Sulayman, llegó a Fez portando el regalo de su sultán: una jirafa, esa criatura de forma extraña y cuerpo enorme, en respuesta a la embajada del sultán Abu al-Hasan. Fue un día de celebración: el sultán, sentado en la Torre de Oro, pasó revista a la multitud que se agolpaba para contemplar la jirafa y los poetas declamaban alabanzas. Los enviados saludaban al sultán arrojándose polvo sobre la cabeza y confirmando las palabras del intérprete haciendo vibrar las cuerdas de sus arcos, excusando la demora del regalo por la lucha por el trono de Malí tras la muerte de Mansa Sulayman."
  fr: "En Safar 762 AH, l'ambassade du roi du Mali, Mansa Sulayman, arriva à Fès, apportant le cadeau du sultan: une girafe, cette créature à la forme étrange et au corps massif, en échange de l'ambassade du sultan Abu al-Hasan. Ce fut un jour de fête. Le sultan, assis au sommet de la Tour d'Or, passa en revue les troupes tandis que la foule se pressait pour admirer la girafe et que les poètes déclamaient ses louanges. Les envoyés saluèrent le sultan en se jetant de la poussière sur la tête et confirmèrent les paroles de l'interprète en faisant vibrer les cordes de leurs arcs, excusant le retard du cadeau par la lutte pour le trône du Mali après la mort de Mansa Sulayman."
  ur: "صفر 762 ہجری میں مالی کے بادشاہ منسا سلیمان کا سفارت خانہ اپنے سلطان کا تحفہ لے کر فیز پہنچا - ایک زرافہ، وہ عجیب شکل والا، بڑا جسم والا جانور - سلطان ابو الحسن کے اپنے سفارت خانے کے بدلے میں؛ یہ ایک منایا جانے والا دن تھا، سلطان ٹاور آف گولڈ پر بیٹھا جائزہ لے رہا تھا جب کہ ہجوم زرافے کو دیکھنے کے لیے ایک دوسرے کے اوپر چڑھ گیا اور شاعروں نے تعریف کی، ایلچی اپنے سروں پر مٹی ڈال کر اور مترجم کی باتوں کی تصدیق کرتے ہوئے اپنی کمانوں کو ہلا کر، معزرت کے بعد معزرت کے لیے معزرت کر رہے تھے۔ سلیمان کی وفات۔"
  tr: "Mali Kralı Mansa Süleyman'ın heyeti, Hicri 762 yılının Safer ayında, Sultan Ebu el-Hasan'ın hediyesinin karşılığı olarak, garip şekilli ve büyük yapılı bir hayvan olan zürafayı getirmek üzere Fez'e geldi. Geliş günleri olağanüstü bir gündü; sultan Altın Kule'de bir törenle meclise katıldı, halk hayranlıkla zürafanın etrafına toplandı, şairler övgü dolu şiirler okudu, heyet üyeleri başlarına toz serperek ve yaylarının tellerini çekerek tercümanı onaylayarak sultanı selamladı ve Mansa Süleyman'ın ölümünden sonra Mali krallarının tahta aceleyle geçmesi nedeniyle hediyenin gecikmesinden dolayı özür diledi."
  id: "Delegasi raja Mali, Mansa Suleiman, tiba di Fez pada bulan Safar tahun 762 Hijriah dengan membawa hadiah dari sultan mereka—jerapah, hewan yang berbentuk aneh dan berstruktur besar—sebagai balasan atas hadiah dari Sultan Abu al-Hasan. Hari kedatangan mereka adalah hari yang luar biasa, di mana sultan duduk di Menara Emas dalam sebuah dewan kehormatan, dan orang-orang berkerumun di sekitar jerapah untuk mengagumi ciptaannya, dan para penyair melantunkan pujian, dan delegasi menyambut sultan dengan menaburkan debu di kepala mereka dan mengukuhkan penerjemah dengan menarik tali busur mereka, dan mereka meminta maaf atas keterlambatan hadiah tersebut karena para raja Mali bergegas naik tahta setelah kematian Mansa Suleiman."
