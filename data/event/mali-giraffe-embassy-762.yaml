summary:
  ar: "وصل وفد ملك مالي منسا سليمان إلى فاس في صفر سنة 762هـ بهدية سلطانهم — الزرافة، الحيوان الغريب الشكل العظيم الهيكل — مكافأةً على هدية السلطان أبي الحسن؛ وكان يوم وفادتهم يوماً مشهوداً جلس السلطان فيه ببرج الذهب مجلس عرض، وازدحم الناس على الزرافة إعجاباً بخلقتها وأنشد الشعراء في عرض المدح، وحيا الوفد السلطان يحثون التراب على رؤوسهم ويصدقون الترجمان بالنزع في أوتار قسيهم، واعتذروا عن إبطاء الهدية بما كان من تواثب ملوك مالي على الملك بعد مهلك منسا سليمان."
  en: "In Safar 762 AH the embassy of Mali's king Mansa Sulayman reached Fez bearing their sultan's gift — a giraffe, that strange-formed, huge-bodied creature — in return for Sultan Abu al-Hasan's own embassy; it was a celebrated day, the sultan seated at the Tower of Gold in review while crowds climbed over one another to behold the giraffe and poets declaimed praise, the envoys greeting the sultan by tossing dust on their heads and confirming the interpreter's words by twanging their bowstrings, excusing the gift's delay by the struggle for Mali's throne after Mansa Sulayman's death."
