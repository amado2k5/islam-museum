label: { en: "The conversion of Abu Sufyan ibn Harb", ar: "إسلام أبي سفيان بن حرب بمر الظهران" }
summary:
  en: "At Marr al-Zahran on the eve of the Conquest, al-Abbas brought Abu Sufyan into the Muslim camp; after witnessing the ten thousand campfires and parading contingents, Abu Sufyan professed Islam, and the Prophet granted general sanctuary to whoever entered his house."
  ar: "في مر الظهران عشيّة الفتح، أتى العباس بن عبد المطلب بأبي سفيان بعدما رأى نيران المعسكر، وشهد استعراض كتائب القبائل بمضيق الوادي، فأسلم صبيحة تلك الليلة، وجعل النبي داره إحدى دور الأمان لأهل مكة."
