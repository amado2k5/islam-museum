label: { en: "The conversion of Abu Sufyan ibn Harb", fr: "Conversion d’Abu Sufyan ibn Harb", ar: "إسلام أبي سفيان بن حرب بمر الظهران", es: "La conversión de Abu Sufyan ibn Harb" }
summary:
  en: "At Marr al-Zahran on the eve of the Conquest, al-Abbas brought Abu Sufyan into the Muslim camp; after witnessing the ten thousand campfires and parading contingents, Abu Sufyan professed Islam, and the Prophet granted general sanctuary to whoever entered his house."
  fr: "À Marr al-Zahran, à la veille de la conquête, al-Abbas amena Abu Sufyan dans le camp musulman ; après avoir vu les dix mille feux et les contingents défiler, Abu Sufyan professa l’islam et le Prophète accorda la sécurité générale à quiconque entrerait dans sa maison."
  ar: "في مر الظهران عشيّة الفتح، أتى العباس بن عبد المطلب بأبي سفيان بعدما رأى نيران المعسكر، وشهد استعراض كتائب القبائل بمضيق الوادي، فأسلم صبيحة تلك الليلة، وجعل النبي داره إحدى دور الأمان لأهل مكة."
  es: "En Marr al-Zahran, en vísperas de la Conquista, al-Abbas llevó a Abu Sufyan al campamento musulmán; tras presenciar las diez mil hogueras y los contingentes que desfilaban, Abu Sufyan se convirtió al Islam, y el Profeta concedió asilo a todo aquel que entrara en su casa."
