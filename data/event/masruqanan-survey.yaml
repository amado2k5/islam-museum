summary:
  ar: "المسروقانان قطيعة لآل أبي بكرة أصلها مائة جريب فمسحها مساحو المنصور ألف جريب فأقروا في أيدي آل أبي بكرة منها مائة وقبضوا الباقي."
  en: "Al-Masruqanan, the Abu Bakra family's qati'a — originally a hundred jarib — was surveyed by al-Mansur's surveyors at a thousand; they confirmed a hundred in the family's hands and seized the rest."
  es: "Al-Masruqanan, la qati'a de la familia Abu Bakra —que originalmente constaba de cien jarib— fue inspeccionada por los agrimensores de al-Mansur y resultó tener mil; confirmaron que cien estaban en manos de la familia y se apoderaron del resto."
  fr: "Al-Masruqanan, le qati'a de la famille Abu Bakra — à l'origine une centaine de jarib — a été arpenté par les arpenteurs d'al-Mansur à mille; ils ont confirmé une centaine entre les mains de la famille et ont saisi le reste."
  ur: "المسروقنان، ابوبکرہ خاندان کی قتیہ - اصل میں ایک سو جریب - کا سروے المنصور کے سروے کرنے والوں نے ایک ہزار میں کیا تھا۔ انہوں نے خاندان کے ہاتھوں میں ایک سو کی تصدیق کی اور باقی کو پکڑ لیا۔"
