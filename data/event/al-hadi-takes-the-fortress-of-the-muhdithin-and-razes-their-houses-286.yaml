id: event/al-hadi-takes-the-fortress-of-the-muhdithin-and-razes-their-houses-286
class: event
kind: other
label:
  ar: تسليم القوم عند حصنهم وهدم منازل «المحدثين»، 286هـ
  en: The people yield at their fortress and the houses of the "troublemakers" are pulled down, 286 AH
  ur: قلعے پر قوم کا سپرد ہونا اور «فساد برپا کرنے والوں» کے گھروں کا گرایا جانا، 286ھ
summary:
  ar: يسير الهادي إلى حصن القوم فيصيحون بطلب الأمان، ويبيت في معسكره ثم يخرجون إليه بأجمعهم فيؤمّنهم ويهدم منازل «المحدثين»، ويشتد في أمرهم ويعلمهم أنه سيأخذهم بها إن عادوا، فيضمنون ذلك.
  en: Al-Hadi goes to the people's fortress and they cry out for safe-conduct; he spends a night in camp, they all come out next morning and he gives them safe-conduct, has the houses of the "troublemakers" pulled down, is firm with them over it and tells them he will hold them to account if they return; they undertake it.
  ur: ہادی قوم کے قلعے کی طرف جاتے ہیں اور وہ امان مانگتے ہوئے پکارتے ہیں؛ وہ رات لشکرگاہ میں گزارتے ہیں، اگلی صبح سب نکل آتے ہیں اور وہ انہیں امان دیتے ہیں، «فساد برپا کرنے والوں» کے گھر گرواتے ہیں، اس معاملے میں سختی کرتے ہیں اور بتاتے ہیں کہ لوٹ آئے تو مؤاخذہ کریں گے؛ وہ ذمہ لیتے ہیں۔
