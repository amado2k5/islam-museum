label: { ar: "ظهور مراكب المجوس في الأندلس", en: "Appearance of Majus ships in al-Andalus, 245", es: "Aparición de los barcos Majus en al-Andalus, 245", fr: "Apparition des navires Majus en al-Andalus, 245", ur: "الاندلس میں مجوس جہازوں کا ظہور، 245", tr: "Magi'nin gemilerinin Endülüs'te görünmesi", id: "Kemunculan kapal-kapal para Majus di Andalusia" }
summary:
  ar: "في سنة خمس وأربعين ومائتين ظهرت مراكب المجوس وعاثوا في الأندلس فلقيهم مراكب الأمير محمد بن عبد الرحمن فقاتلوهم وغنموا منهم مركبين واستُشهد جماعة من المسلمين، وهو أول نزول معروف لسفن المجوس — وهم قوم من بحريي الشمال — بسواحل الأندلس في خلافة بني أمية {cite:nafh-tib-maqqari p. 350-351}."
  en: "In 245 the Majus ships — the northern sea-raiders — appeared and ravaged in al-Andalus; the amir Muhammad's fleet met them, fought them, took two ships as prize, and a number of Muslims were martyred: the first recorded descent of the Vikings' ships on the Umayyad coast {cite:nafh-tib-maqqari p. 350-351}."
  es: "En el año 245, los barcos de Majus —los piratas del norte— aparecieron y asolaron al-Ándalus; la flota del emir Muhammad los encontró, luchó contra ellos, capturó dos barcos como botín de guerra y varios musulmanes fueron martirizados: el primer desembarco registrado de barcos vikingos en la costa omeya {cite:nafh-tib-maqqari p. 350-351}."
  fr: "En 245, les navires Majus — les pillards des mers du nord — apparurent et ravagèrent al-Andalus; la flotte de l'émir Muhammad les rencontra, les combattit, prit deux navires comme prise, et un certain nombre de musulmans furent martyrisés: la première descente enregistrée des navires vikings sur la côte omeyyade {cite:nafh-tib-maqqari p. 350-351}."
  ur: "245 میں مجوس کے بحری جہاز - شمالی سمندری حملہ آور - اندلس میں نمودار ہوئے اور تباہی مچائی۔ امیر محمد کے بحری بیڑے نے ان سے ملاقات کی، ان سے جنگ کی، دو جہاز انعام کے طور پر لیے، اور بہت سے مسلمان شہید ہوئے: اموی ساحل پر وائکنگز کے بحری جہازوں کا پہلا ریکارڈ شدہ نزول۔ 350-351}۔"
  tr: "Hicri 245 yılında, Mecusilerin gemileri ortaya çıktı ve Endülüs'te büyük bir yıkıma neden oldu. Prens Muhammed ibn Abdülrahman'ın gemileri onlarla karşılaştı, savaştı ve onlardan iki gemi ele geçirdi. Bir grup Müslüman şehit oldu. Bu, Emevi Halifeliği döneminde kuzey denizlerinden gelen bir kavim olan Mecusilerin gemilerinin Endülüs kıyılarına ilk bilinen inişiydi. {cite:nafh-tib-maqqari s. 350-351}"
  id: "Pada tahun 245 H, kapal-kapal kaum Majusi muncul dan menimbulkan malapetaka di Andalusia. Kapal-kapal Pangeran Muhammad ibn Abd al-Rahman bertemu dengan mereka, melawan mereka, dan merebut dua kapal dari mereka. Sekelompok Muslim gugur sebagai syuhada. Ini adalah pendaratan pertama yang diketahui dari kapal-kapal kaum Majusi—yang merupakan kaum dari laut utara—di pantai Andalusia selama Kekhalifahan Umayyah. {cite:nafh-tib-maqqari hlm. 350-351}."
