summary:
  ar: "بطاقة أولية لحصار عكا سنة ١٧٩٩م، صمود أحمد باشا الجزار أمام نابليون الذي فشل في أخذ المدينة؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Siege of Acre in 1799, Ahmad Pasha al-Jazzar's stand against Napoleon, who failed to take the city; its sources are not yet checked on the page."
