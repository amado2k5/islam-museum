  fr: "Carte de projet pour le siège d'Acre en 1799, la résistance d'Ahmad Pacha al-Jazzar contre Napoléon, qui ne parvint pas à prendre la ville; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1799 میں ایکڑ کے محاصرے کے لیے ڈرافٹ کارڈ، احمد پاشا الجزار کا نپولین کے خلاف موقف، جو شہر پر قبضہ کرنے میں ناکام رہا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Bu metin, 1799 yılında gerçekleşen Akka kuşatması ve Ahmed Paşa el-Cezzar'ın Napolyon'a karşı direnişine dair ön bir anlatımdır; Napolyon şehri ele geçirmeyi başaramamıştır. Kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Catatan awal tentang pengepungan Acre pada tahun 1799 M, perlawanan Ahmed Pasha al-Jazzar terhadap Napoleon yang gagal merebut kota tersebut; sumber-sumbernya belum ditinjau di halaman ini."
