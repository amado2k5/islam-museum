label: { ar: "وقعة باخمرى", en: "the battle of Bakhamra", fr: "La bataille de Bakhamra", es: "La batalla de Bakhamra", ur: "بخمرا کی جنگ", tr: "Bakhmeri Muharebesi", id: "Pertempuran Bakhmeri" }
summary:
  ar: "أجاب إبراهيم بن عبد الله أهل البصرة وفارس والأهواز وسار في عساكر من الزيدية وجماعة من البغداديين المعتزلة ومعه عيسى بن زيد بن علي، فسير إليه المنصور عيسى بن موسى وسعيد بن سلم فقاتل حتى قتل بالموضع المعروف بباخمرى على ستة عشر فرسخاً من الكوفة من أرض الطف، وقتل معه من الزيدية أربعمائة وقيل خمسمائة، وذكره دعبل الخزاعي في قصيدته مدارس آيات خلت من تلاوة {cite:muruj-al-dhahab p. 285-286}."
  en: "Ibrahim ibn 'Abd Allah's stand at Bakhamra in the taff-land sixteen farsakhs from Kufa — dead with four hundred of his Zaydi followers {cite:muruj-al-dhahab p. 285-286}."
  fr: "La résistance d'Ibrahim ibn 'Abd Allah à Bakhamra, dans le Taff, à seize parasanges de Koufa : il y mourut avec quatre cents de ses partisans zaydites {cite:muruj-al-dhahab p. 285-286}."
  es: "La posición de Ibrahim ibn 'Abd Allah en Bakhamra, en la tierra de Taff, a dieciséis farsakhs de Kufa, donde murió junto con cuatrocientos de sus seguidores zaidíes {cite:muruj-al-dhahab p. 285-286}."
  ur: "کوفہ سے سولہ فرسخ کے فاصلہ پر بخمرا کے مقام پر ابراہیم بن عبد اللہ کا کھڑا ہونا - اپنے چار سو زیدی پیروکاروں کے ساتھ مر گیا 285-286}۔"
  tr: "İbrahim bin Abdullah, Basra, Fars ve Ahvaz halkına cevap verdi ve Zeydi birlikleri ve bir grup Bağdadi Mu'tezili ile birlikte yürüdü; yanında İsa bin Zeyd bin Ali de vardı. El-Mansur, İsa bin Musa ve Said bin Selam'ı ona gönderdi ve İbrahim bin Abdullah, Kufa'dan on altı fersah uzaklıkta, El-Taff topraklarındaki Bakhmari denilen yerde öldürülene kadar savaştı. Onunla birlikte Zeydilerden dört yüz veya beş yüz kişi öldürüldü ve Dibal el-Huza'i'nin onu \"Okunamayan Şiir Okulları\" adlı şiirinde andığı söylenir (kaynak: Muruj-al-Dhahab, s. 285-286)."
  id: "Ibrahim bin Abdullah menanggapi seruan penduduk Basra, Fars, dan Ahwaz, lalu berbaris bersama pasukan Zaidi dan sekelompok Mu'tazilah Baghdadi, dan bersamanya ada Isa bin Zaid bin Ali. Al-Mansur mengutus Isa bin Musa dan Saeed bin Salam kepadanya, dan ia berperang hingga gugur di tempat yang dikenal sebagai Bakhmari, enam belas farsakh dari Kufa di tanah Al-Taff. Empat ratus atau lima ratus orang Zaidi tewas bersamanya, dan dikatakan bahwa Dibal Al-Khuza'i menyebutkannya dalam puisinya “Mazhab-mazhab yang Kosong dari Pembacaan” {cite:muruj-al-dhahab hlm. 285-286}."
