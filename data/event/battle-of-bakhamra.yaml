summary:
  ar: "أجاب إبراهيم بن عبد الله أهل البصرة وفارس والأهواز وسار في عساكر من الزيدية وجماعة من البغداديين المعتزلة ومعه عيسى بن زيد بن علي، فسير إليه المنصور عيسى بن موسى وسعيد بن سلم فقاتل حتى قتل بالموضع المعروف بباخمرى على ستة عشر فرسخاً من الكوفة من أرض الطف، وقتل معه من الزيدية أربعمائة وقيل خمسمائة، وذكره دعبل الخزاعي في قصيدته مدارس آيات خلت من تلاوة {cite:muruj-al-dhahab p. 285-286}."
  en: "Ibrahim ibn 'Abd Allah's stand at Bakhamra in the taff-land sixteen farsakhs from Kufa — dead with four hundred of his Zaydi followers {cite:muruj-al-dhahab p. 285-286}."
