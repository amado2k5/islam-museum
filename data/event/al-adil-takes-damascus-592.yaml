id: event/al-adil-takes-damascus-592
class: event
kind: conquest
label: { ar: "استيلاء العادل على دمشق", en: "al-Adil's seizure of Damascus", fr: "Prise de Damas par al-Adil", es: "La toma de Damasco por al-Adil", ur: "العدل کا دمشق پر قبضہ", tr: "Adil'in Şam'ı fethi", id: "Penaklukan Damaskus oleh Al-Adil" }
summary:
  ar: "في السابع والعشرين من رجب سنة اثنتين وتسعين وخمسمائة ملك الملك العادل أبو بكر بن أيوب مدينة دمشق من ابن أخيه الأفضل علي بن صلاح الدين؛ وكان سببها أن عساكر دمشق الأسدية والأكراد مالت إلى الأفضل ضد أخيه العزيز صاحب مصر لإعراضه عنهم وإقباله على المماليك الناصرية، فنازع العزيز وخرج منهزماً إلى مصر، واتفق على صلح بلبيس أن يكون للأفضل القدس وجميع فلسطين وطبرية والأردن ويبقى العادل مقيماً بمصر عند العزيز؛ ثم استمال العادل العزيز فسار معه إلى دمشق وحاصراها واستمالا أميراً من أمراء الأفضل يعرف بالعزيز بن أبي غالب الحمصي — وكان الأفضل كثير الإحسان إليه والوثوق به — ففتح لهما الباب الشرقي وقت العصر اليوم السابع والعشرين من رجب وأدخل العادل، وركب العزيز فوقف بالميدان الأخضر غربي دمشق، ونزل العادل بدار أسد الدين شيركوه، وأوهما الأفضل أنهما يبقيان على البلد له خيفة أن يثور بهما ومعه العامة، ثم أقرآه بمفارقة القلعة {cite:kamil-ibn-al-athir p. 240-244}."
  en: "al-Adil's seizure of Damascus, 27 Rajab 592 — after the Asadiyya and Kurds defected from al-Aziz of Egypt to his brother al-Afdal, the Bilbays settlement gave al-Afdal Palestine while al-Adil stayed in Egypt beside al-Aziz; then uncle and nephew marched on Damascus, suborned al-Afdal's favoured amir Ibn Abi Ghalib of Homs who opened the Bab al-Sharqi at 'asr, entered while al-Afdal knew nothing, and read him the order to vacate the citadel {cite:kamil-ibn-al-athir p. 240-244}."
  fr: "Prise de Damas par al-Adil, le 27 rajab 592 : après le ralliement des Asadiyya et des Kurdes à al-Afdal contre son frère al-Aziz d’Égypte, l’accord de Bilbays donna la Palestine à al-Afdal tandis qu’al-Adil restait en Égypte auprès d’al-Aziz. Puis l’oncle et le neveu marchèrent sur Damas, gagnèrent l’émir favori d’al-Afdal, Ibn Abi Ghalib de Homs, qui leur ouvrit Bab al-Sharqi à la prière de l’après-midi, entrèrent à l’insu d’al-Afdal et lui lurent l’ordre de quitter la citadelle {cite:kamil-ibn-al-athir p. 240-244}."
  es: "La toma de Damasco por al-Adil, 27 Rajab 592 — después de que los Asadiyya y los Kurdos desertaran de al-Aziz de Egipto a su hermano al-Afdal, el asentamiento de Bilbays le dio a al-Afdal Palestina mientras al-Adil permaneció en Egipto junto a al-Aziz; luego tío y sobrino marcharon sobre Damasco, sobornaron al amir favorito de al-Afdal, Ibn Abi Ghalib de Homs, quien abrió el Bab al-Sharqi en 'asr, entró sin que al-Afdal supiera nada, y le leyó la orden de desalojar la ciudadela {cite:kamil-ibn-al-athir p. 240-244}."
  ur: "العادل کا دمشق پر قبضہ، 27 رجب 592 - مصر کے العزیز سے اس کے بھائی الفدال کو اسدییہ اور کردوں کے منحرف ہونے کے بعد، بلبیس کی بستی نے الافدل فلسطین کو دے دیا جبکہ العدل العزیز کے ساتھ مصر میں رہا۔ پھر چچا اور بھتیجے نے دمشق کی طرف کوچ کیا، حمص کے الفضل کے پسندیدہ امیر ابن ابی غالب کو ماتحت کیا جنہوں نے عصر کے وقت باب الشرقی کو کھولا، اس وقت داخل ہوئے جب کہ الفضل کو کچھ معلوم نہیں تھا، اور اسے قلعہ خالی کرنے کا حکم پڑھ کر سنایا۔ 240-244}۔"
  tr: "592 yılının Recep ayının 27. gününde, Kral Ebu Bekir bin Eyyub, yeğeni Afdal Ali bin Salah Din'den Şam şehrini geri aldı. Bunun sebebi, Şam'daki Esadi ve Kürt birliklerinin, Afdal'ın Mısır hükümdarı olan kardeşi Aziz'e karşı taraf tutmasıydı; çünkü Afdal onlardan yüz çevirmiş ve Nasiri Memlüklerine yönelmişti. Bu yüzden Afdal, Aziz ile anlaşmazlığa düştü ve yenilgiye uğrayarak Mısır'a gitti. Bilbeis barış antlaşmasında, Afdal'ın Kudüs'ü, tüm Filistin'i, Taberiye'yi ve Ürdün'ü alacağı, Ebu Bekir'in ise Aziz ile birlikte Mısır'da kalacağı kararlaştırılmıştı. Bunun üzerine Ebu Bekir, Aziz'i yendi ve onunla birlikte Şam'a giderek şehri kuşattı. El-Afdal emirlerinden El-Aziz ibn Abi Ghalib el-Himsi adında birini kendi taraflarına çektiler -ki El-Afdal ona çok iyi davranmış ve güvenmişti- böylece Receb ayının yirmi yedinci günü öğleden sonra onlara doğu kapısını açtı ve El-Adil içeri girdi. El-Aziz atıyla yola çıktı ve Şam'ın batısındaki yeşil meydanda durdu. El-Adil ise Asad el-Din Şirkuh'un evinde kaldı. El-Afdal'ı, kendilerine ve halka karşı isyan edeceğinden korkarak şehri terk edecekleri düşüncesine sevk ettiler, sonra da ona kaleyi terk etmesini söylediler. {Kaynak: Kamil ibn el-Athir, s. 240-244}"
  id: "Pada tanggal 27 Rajab tahun 592, Raja Al-Adil Abu Bakr bin Ayyub merebut kota Damaskus dari keponakannya, Al-Afdal Ali bin Salah Al-Din. Alasannya adalah karena pasukan Asadi dan Kurdi di Damaskus telah memihak Al-Afdal melawan saudaranya, Al-Aziz, penguasa Mesir, karena Al-Aziz membelot dari mereka dan memihak Mamluk Nasiri. Maka ia berselisih dengan Al-Aziz dan kembali ke Mesir setelah kalah. Dalam perjanjian Bilbeis disepakati bahwa Al-Afdal akan mendapatkan Yerusalem, seluruh Palestina, Tiberias, dan Yordania, sedangkan Al-Adil akan tetap tinggal di Mesir bersama Al-Aziz. Kemudian Al-Adil mengalahkan Al-Aziz, lalu ia pergi bersamanya ke Damaskus dan mengepungnya. Mereka membujuk seorang emir dari kalangan emir al-Afdal yang dikenal sebagai al-Aziz ibn Abi Ghalib al-Himsi — dan al-Afdal sangat baik kepadanya dan mempercayainya — sehingga ia membuka gerbang timur untuk mereka pada sore hari tanggal 27 Rajab dan al-Adil masuk, dan al-Aziz menunggang kuda dan berhenti di lapangan hijau di sebelah barat Damaskus, dan al-Adil tinggal di rumah Asad al-Din Shirkuh, dan mereka membuat al-Afdal berpikir bahwa mereka akan meninggalkan kota untuknya karena takut ia akan memberontak melawan mereka dan rakyat jelata, kemudian mereka memberitahunya untuk meninggalkan benteng {cite:kamil-ibn-al-athir p. 240-244}."
