id: event/oljaitu-enthronement-council-703
class: event
kind: other
label:
  ar: "جلوس أولجايتو ومجلس الشورى الكبير سنة 703"
  en: "Enthronement of Oljeitu and the great council, 703 AH"
  ur: "اولجایتو کی تخت نشینی اور مجلسِ شوریٰ، 703ھ"
  fr: "Intronisation d'Oljeytu et grand conseil, 703 de l'Hégire"
  es: "Entronización de Oljeitu y gran consejo, 703 de la Hégira"
summary:
  ar: "بعد وفاة غازان، وصل أولجايتو من خراسان إلى معسكره في ذي الحجة سنة 703 هـ، وانضم إليه الأمراء والخواتين، وعُقد مجلس الشورى الكبير في منتصف ذي الحجة. ثم نظر السلطان في شؤون الممالك، وقرر أن تبقى الأمور على ما كانت عليه في عهد أخيه، وأن يحتفظ كل أمير بمنصبه {cite:jami-al-tawarikh-khashshab-1960 p. 213}{cite:jami-al-tawarikh-khashshab-1960 p. 214}{cite:jami-al-tawarikh-khashshab-1960 p. 215}{cite:jami-al-tawarikh-khashshab-1960 p. 219}. ويرى المؤلف أن هذا التدبير استقرت به الأمور. وكتب المؤلف هذه المواد في مقدمة كتابه، وهي رواية الكتاب نفسه، ولا تصحيح لها من مصدر آخر في هذه الصفحات."
  en: "After Ghazan's death Oljeitu came to his camp in Dhu al-Hijja 703 AH, from Khurasan, where his armies had gathered; the princes and ladies joined the court there. A great council was held in the middle of Dhu al-Hijja, and the sultan then looked into the affairs of the realm and decided that matters should stay as they had been under his brother, with each amir keeping his post {cite:jami-al-tawarikh-khashshab-1960 p. 213}{cite:jami-al-tawarikh-khashshab-1960 p. 214}{cite:jami-al-tawarikh-khashshab-1960 p. 215}{cite:jami-al-tawarikh-khashshab-1960 p. 219}. The author judges that this arrangement settled affairs. These pages are the author's own account, and no other source is read for them here."
  ur: "غازان کی وفات کے بعد اولجایتو خراسان سے ذوالحجہ 703ھ میں اپنے لشکر گاہ پہنچے، جہاں امرا اور خواتین دربار میں شامل ہوئے۔ ذوالحجہ کے وسط میں مجلسِ شوریٰ منعقد ہوئی، اور پھر سلطان نے سلطنت کے معاملات دیکھے اور یہ فیصلہ کیا کہ معاملات اسی طرح رہیں جیسے ان کے بھائی کے عہد میں تھے، اور ہر امیر اپنے منصب پر قائم رہے {cite:jami-al-tawarikh-khashshab-1960 p. 213}{cite:jami-al-tawarikh-khashshab-1960 p. 214}{cite:jami-al-tawarikh-khashshab-1960 p. 215}{cite:jami-al-tawarikh-khashshab-1960 p. 219}۔ مصنف کے نزدیک اس انتظام سے امور مستحکم ہوئے۔ یہ مصنف کا بیان ہے، اور ان صفحات کے لیے کوئی دوسرا ماخذ یہاں نہیں پڑھا گیا۔"
  fr: "Après la mort de Ghazan, Oljeytu rejoignit son camp en dhou al-hijja 703 AH, venant du Khorassan où ses armées s'étaient rassemblées ; les princes et les dames se joignirent à la cour. Un grand conseil se tint au milieu de dhou al-hijja, et le sultan examina les affaires du royaume, décidant que tout resterait comme sous son frère, chaque émir gardant son poste {cite:jami-al-tawarikh-khashshab-1960 p. 213}{cite:jami-al-tawarikh-khashshab-1960 p. 214}{cite:jami-al-tawarikh-khashshab-1960 p. 215}{cite:jami-al-tawarikh-khashshab-1960 p. 219}. L'auteur juge que cette disposition assura la stabilité. Ces pages sont le récit de l'auteur, sans autre source lue ici."
  es: "Tras la muerte de Ghazan, Oljeitu llegó a su campamento en dhu al-hiyya de 703 AH, procedente de Jorasán, donde se habían reunido sus ejércitos; príncipes y damas se unieron a la corte. Un gran consejo se celebró a mediados de dhu al-hiyya, y el sultán examinó los asuntos del reino y decidió que todo quedara como bajo su hermano, con cada emir en su puesto {cite:jami-al-tawarikh-khashshab-1960 p. 213}{cite:jami-al-tawarikh-khashshab-1960 p. 214}{cite:jami-al-tawarikh-khashshab-1960 p. 215}{cite:jami-al-tawarikh-khashshab-1960 p. 219}. El autor juzga que esta disposición asentó los asuntos. Estas páginas son el relato del autor, sin otra fuente leída aquí."
