id: event/caliphate-of-muntasir
class: event
kind: other
label: { ar: "خلافة المنتصر" }
summary:
  ar: "في سنة سبع وأربعين ومائتين بويع محمد بن جعفر المنتصر بالخلافة في شوال، ثم انتقل من الجعفرية إلى سامراء {cite:tabari-tarikh-abu-al-fadl j.9 p.234}، وذكر الطبري وفاته في سنة ثمان وأربعين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.251}، وعند السيوطي بويع له بعد قتل أبيه في شوال سنة سبع وأربعين فخلع أخويه المعتز والمؤيد من ولاية العهد وأظهر العدل وأزال عن آل أبي طالب الخوف والمحنة ورد على آل الحسين فدك، ولما ولي صار يسب الأتراك ويقول هؤلاء قتلة الخلفاء فعملوا عليه فعجزوا عنه لأنه كان مهيباً فطناً فتحيلوا حتى دسوا إلى طبيبه ابن طيفور ثلاثين ألف دينار ففصده بريشة مسمومة فمات في خامس ربيع الآخر سنة ثمان وأربعين وله ست وعشرون سنة أو دونها ولم يمتع بالخلافة إلا دون ستة أشهر، وقال عند احتضاره يا أماه ذهبت مني الدنيا والآخرة عاجلت أبي فعوجلت، وقال الثعالبي أعرق الخلفاء في الخلافة المنتصر فهو وآباؤه الخمسة خلفاء {cite:tarikh-khulafa-minhaj-1434 p. 553-554}."
