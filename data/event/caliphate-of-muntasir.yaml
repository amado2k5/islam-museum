label: { ar: "خلافة المنتصر", en: "Caliphate of al-Muntasir" }
summary:
  ar: "في سنة سبع وأربعين ومائتين بويع محمد بن جعفر المنتصر بالخلافة في شوال، ثم انتقل من الجعفرية إلى سامراء {cite:tabari-tarikh-abu-al-fadl j.9 p.234}، وذكر الطبري وفاته في سنة ثمان وأربعين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.251}، وعند السيوطي بويع له بعد قتل أبيه في شوال سنة سبع وأربعين فخلع أخويه المعتز والمؤيد من ولاية العهد وأظهر العدل وأزال عن آل أبي طالب الخوف والمحنة ورد على آل الحسين فدك، ولما ولي صار يسب الأتراك ويقول هؤلاء قتلة الخلفاء فعملوا عليه فعجزوا عنه لأنه كان مهيباً فطناً فتحيلوا حتى دسوا إلى طبيبه ابن طيفور ثلاثين ألف دينار ففصده بريشة مسمومة فمات في خامس ربيع الآخر سنة ثمان وأربعين وله ست وعشرون سنة أو دونها ولم يمتع بالخلافة إلا دون ستة أشهر، وقال عند احتضاره يا أماه ذهبت مني الدنيا والآخرة عاجلت أبي فعوجلت، وقال الثعالبي أعرق الخلفاء في الخلافة المنتصر فهو وآباؤه الخمسة خلفاء {cite:tarikh-khulafa-minhaj-1434 p. 553-554}."
  en: "In Shawwal 247 Muhammad ibn Ja'far, al-Muntasir, was given the caliphate, and he moved from al-Ja'fariyya to Samarra {cite:tabari-tarikh-abu-al-fadl j.9 p.234}. Al-Tabari gives his death in 248 {cite:tabari-tarikh-abu-al-fadl j.9 p.251}. In al-Suyuti: he was given the bay'a in Shawwal 247 after his father was killed, deposed his brothers al-Mu'tazz and al-Mu'ayyad from the succession, showed justice, lifted fear and trial from the Family of Abu Talib, and returned Fadak to the family of al-Husayn. When he came to power he began to revile the Turks, calling them the killers of caliphs; they plotted against him, but could not overpower him, for he was formidable and shrewd, so they secretly paid his physician Ibn Tayfur thirty thousand dinars, and Ibn Tayfur bled him with a poisoned lancet. He died on the fifth of Rabi' II 248, aged twenty-six or less, having enjoyed the caliphate for less than six months. On his deathbed he said: 'O mother, the world and the hereafter have gone from me: I hastened my father's end, and was hastened in turn.' Al-Tha'alibi said that al-Muntasir was the caliph with the deepest roots in the caliphate: he and his five forebears were all caliphs {cite:tarikh-khulafa-minhaj-1434 p. 553-554}."
