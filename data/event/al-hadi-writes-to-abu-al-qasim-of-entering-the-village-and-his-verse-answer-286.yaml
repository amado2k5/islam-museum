id: event/al-hadi-writes-to-abu-al-qasim-of-entering-the-village-and-his-verse-answer-286
class: event
kind: other
label:
  ar: كتاب الهادي إلى أبي القاسم بدخوله القرية وجواب أبي القاسم شعراً، 286هـ
  en: Al-Hadi's letter to Abu al-Qasim on entering the village and Abu al-Qasim's answer in verse, 286 AH
  ur: ہادی کا ابو القاسم کو بستی میں داخلے کا خط اور ابو القاسم کا منظوم جواب، 286ھ
  es: "Carta de Al-Hadi a Abu al-Qasim al entrar en la aldea y respuesta de Abu al-Qasim en el versículo 286 AH."
  fr: "Lettre d'Al-Hadi à Abu al-Qasim à son entrée au village et réponse d'Abu al-Qasim (verset 286 AH)"
  tr: "Hadi'nin Ebu el-Kâsım'a, köye girişine dair yazdığı mektup ve Ebu el-Kâsım'ın şiirsel cevabı, Hicri 286."
  id: "Kitab Al-Hadi kepada Abu Al-Qasim, mengenai kedatangannya ke desa, dan tanggapan puitis Abu Al-Qasim, 286 H."
summary:
  ar: يكتب الهادي إلى أبي القاسم يخبره بدخوله القرية وبقتله بني الحارث القتلة الأولى، فيُسرّ به أبو القاسم ويقرؤه على جميع أوليائه، ويكتب جواب الكتاب ومعه شعر يتمنى فيه أن يكون شهد الوقعة ويعد بالفداء بنحره وبأن يسفك دم الناكثين.
  en: Al-Hadi writes to Abu al-Qasim telling him of his entering the village and of his first killing of Banu al-Harith; Abu al-Qasim is glad and reads it to all his supporters and writes an answer with a poem in which he wishes he had been at the fight and offers his neck in defence and the shedding of the blood of those who broke their pledges.
  ur: ہادی ابو القاسم کو بستی میں اپنے داخلے اور بنو حارث کے پہلے قتل کی خبر لکھتے ہیں؛ ابو القاسم خوش ہوتے ہیں، اسے اپنے تمام ساتھیوں کو پڑھ کر سناتے ہیں اور خط کا جواب لکھتے ہیں جس کے ساتھ ایک قصیدہ ہے کہ وہ چاہتے تھے کہ لڑائی میں موجود ہوتے، اپنی گردن سے فدا ہونے اور عہد توڑنے والوں کے خون بہانے کا وعدہ کرتے ہیں۔
  es: "Al-Hadi escribe a Abu al-Qasim contándole que ha entrado en la aldea y que ha matado por primera vez a un miembro de los Banu al-Harith. Abu al-Qasim se alegra, se lo lee a todos sus seguidores y le responde con un poema en el que lamenta no haber estado presente en la batalla y ofrece su vida en defensa propia y por el derramamiento de la sangre de aquellos que rompieron sus promesas."
  fr: "Al-Hadi écrit à Abu al-Qasim pour lui annoncer son entrée dans le village et son premier meurtre de Banu al-Harith; Abu al-Qasim, ravi, lit la nouvelle à tous ses partisans et écrit une réponse accompagnée d'un poème dans lequel il regrette de ne pas avoir participé au combat et offre sa vie pour défendre et faire couler le sang de ceux qui ont rompu leurs promesses."
  tr: "El-Hadi, Ebu el-Kasım'a köye girişini ve Beni el-Harith kabilesinin ilk katliamını bildiren bir mektup yazar. Ebu el-Kasım bundan memnun olur ve mektubu tüm takipçilerine okur. Mektuba, savaşa şahit olmayı dilediği ve yeminini bozanların kanını dökmek için kendini feda edeceğine dair söz verdiği bir şiirle birlikte bir cevap yazar."
  id: "Al-Hadi menulis surat kepada Abu al-Qasim yang memberitahukan kedatangannya ke desa dan pembunuhan pertama Bani al-Harith. Abu al-Qasim senang dengan hal ini dan membacanya kepada semua pengikutnya. Ia menulis balasan atas surat itu, beserta puisi yang berisi harapannya bahwa ia telah menyaksikan pertempuran tersebut dan berjanji untuk mengorbankan dirinya serta menumpahkan darah para pelanggar sumpah."
