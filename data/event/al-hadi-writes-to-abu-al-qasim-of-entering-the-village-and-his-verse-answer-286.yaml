id: event/al-hadi-writes-to-abu-al-qasim-of-entering-the-village-and-his-verse-answer-286
class: event
kind: other
label:
  ar: كتاب الهادي إلى أبي القاسم بدخوله القرية وجواب أبي القاسم شعراً، 286هـ
  en: Al-Hadi's letter to Abu al-Qasim on entering the village and Abu al-Qasim's answer in verse, 286 AH
  ur: ہادی کا ابو القاسم کو بستی میں داخلے کا خط اور ابو القاسم کا منظوم جواب، 286ھ
summary:
  ar: يكتب الهادي إلى أبي القاسم يخبره بدخوله القرية وبقتله بني الحارث القتلة الأولى، فيُسرّ به أبو القاسم ويقرؤه على جميع أوليائه، ويكتب جواب الكتاب ومعه شعر يتمنى فيه أن يكون شهد الوقعة ويعد بالفداء بنحره وبأن يسفك دم الناكثين.
  en: Al-Hadi writes to Abu al-Qasim telling him of his entering the village and of his first killing of Banu al-Harith; Abu al-Qasim is glad and reads it to all his supporters and writes an answer with a poem in which he wishes he had been at the fight and offers his neck in defence and the shedding of the blood of those who broke their pledges.
  ur: ہادی ابو القاسم کو بستی میں اپنے داخلے اور بنو حارث کے پہلے قتل کی خبر لکھتے ہیں؛ ابو القاسم خوش ہوتے ہیں، اسے اپنے تمام ساتھیوں کو پڑھ کر سناتے ہیں اور خط کا جواب لکھتے ہیں جس کے ساتھ ایک قصیدہ ہے کہ وہ چاہتے تھے کہ لڑائی میں موجود ہوتے، اپنی گردن سے فدا ہونے اور عہد توڑنے والوں کے خون بہانے کا وعدہ کرتے ہیں۔
