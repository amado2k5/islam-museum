tags: [wasaya-browser, wasaya-successors, wasaya-wasiyya, wasaya-ihtidar, wasaya-mirath, wasaya-athar, wasaya-marqad]
label: { ar: "وصية أحمد بن حنبل وشعرات النبي وكفنه وتركته", en: "Testament, relic hairs, shroud and estate of Ahmad ibn Hanbal", ur: "احمد بن حنبل کی وصیت، موئے مبارک، کفن اور ترکہ", es: "Testamento, cabellos de reliquia, sudario y patrimonio de Ahmad ibn Hanbal", fr: "Testament, cheveux reliques, linceul et biens d'Ahmad ibn Hanbal" }
summary:
  ar: "روى صالح بن أحمد أن أباه أمره في مرضه أن يقرأ عليه الوصية فأقرّها، وهي: بسم الله الرحمن الرحيم، هذا ما وصى به أحمد بن محمد بن حنبل، يشهد أن لا إله إلا الله وأن محمداً عبده ورسوله، وأوصى من أطاعه من أهله وقرابته أن يعبدوا الله في العابدين ويحمدوه في الحامدين وينصحوا لجماعة المسلمين {cite:tarikh-dimashq-ibn-asakir-fikr-1995 vol. 5 p. 326}. وفي وصيته دين لفوران نحو خمسين ديناراً يُقضى من غلة الدار {cite:siyar-alam-nubala scan vol. 1 p. 950}. وروى حنبل أن بعض ولد الفضل بن الربيع أعطاه وهو في الحبس ثلاث شعرات قال إنها من شعر النبي، فأوصى عند موته أن تُجعل شعرة على كل عين وشعرة على لسانه، ففُعل ذلك {cite:siyar-alam-nubala scan vol. 1 p. 965}. وكُفّن في ثلاث لفائف، اثنتان من ثوب غزلته الجارية وثالثة أُخذت من فوران {cite:siyar-alam-nubala scan vol. 1 p. 965}."
  en: "Salih ibn Ahmad relates that his father, in his illness, told him to read the will to him and approved it as it stood: in the name of God, this is what Ahmad ibn Muhammad ibn Hanbal bequeathed; he testifies that there is no god but God and that Muhammad is His servant and Messenger, and he enjoined whoever of his family and kin obeyed him to worship God among the worshippers, praise Him among the praisers and give sincere counsel to the community of Muslims {cite:tarikh-dimashq-ibn-asakir-fikr-1995 vol. 5 p. 326}. The will includes a debt to Fuwaran of about fifty dinars to be paid from the income of the house {cite:siyar-alam-nubala scan vol. 1 p. 950}. Hanbal reports that a son of al-Fadl ibn al-Rabi' gave him in prison three hairs, saying they were of the Prophet's hair; at death he ordered that one hair be placed on each eye and one on his tongue, and this was done {cite:siyar-alam-nubala scan vol. 1 p. 965}. He was shrouded in three wrappers, two cut from cloth the maid had spun and a third taken from Fuwaran {cite:siyar-alam-nubala scan vol. 1 p. 965}."
  ur: "صالح بن احمد روایت کرتے ہیں کہ ان کے والد نے بیماری میں ان سے کہا کہ وصیت مجھے پڑھ کر سناؤ، اور اسے جوں کا توں برقرار رکھا: بسم اللہ الرحمن الرحیم، یہ وہ ہے جس کی وصیت احمد بن محمد بن حنبل نے کی؛ وہ گواہی دیتے ہیں کہ اللہ کے سوا کوئی معبود نہیں اور محمد اس کے بندے اور رسول ہیں، اور اپنے اہل و قرابت میں سے اپنی بات ماننے والوں کو وصیت کی کہ عبادت گزاروں میں اللہ کی عبادت کریں، حمد کرنے والوں میں اس کی حمد کریں اور مسلمانوں کی جماعت کے خیرخواہ رہیں {cite:tarikh-dimashq-ibn-asakir-fikr-1995 vol. 5 p. 326}۔ وصیت میں فوران کا تقریباً پچاس دینار کا قرض ہے جو گھر کی آمدنی سے ادا کیا جائے {cite:siyar-alam-nubala scan vol. 1 p. 950}۔ حنبل بتاتے ہیں کہ فضل بن ربیع کی اولاد میں سے کسی نے قید کی حالت میں انھیں تین بال دیے اور کہا کہ یہ نبی کے بالوں میں سے ہیں؛ تو انھوں نے موت کے وقت وصیت کی کہ ایک بال ہر آنکھ پر اور ایک ان کی زبان پر رکھا جائے، اور ایسا ہی کیا گیا {cite:siyar-alam-nubala scan vol. 1 p. 965}۔ انھیں تین چادروں میں کفنایا گیا، دو اس کپڑے سے جو خادمہ نے کاتا تھا اور تیسری فوران سے لی گئی {cite:siyar-alam-nubala scan vol. 1 p. 965}۔"
  es: "Salih ibn Ahmad relata que su padre, en su enfermedad, le dijo que le leyera el testamento y lo aprobó tal como estaba: en el nombre de Dios, esto es lo que Ahmad ibn Muhammad ibn Hanbal legó; testifica que no hay más dios que Dios y que Muhammad es Su siervo y Mensajero, y ordenó a quien de su familia y parientes le obedeciera que adorara a Dios entre los adoradores, lo alabara entre los alabadores y diera un consejo sincero a la comunidad de musulmanes {cite:tarikh-dimashq-ibn-asakir-fikr-1995 vol. 5 p. 326}. El testamento incluye una deuda a Fuwaran de unos cincuenta dinares que se pagará con los ingresos de la casa {cite:siyar-alam-nubala scan vol. 1 p. 950}. Hanbal informa que un hijo de al-Fadl ibn al-Rabi' le dio en prisión tres cabellos, diciendo que eran del cabello del Profeta; Al morir, ordenó que se colocara un cabello sobre cada ojo y uno sobre su lengua, y así se hizo {cite:siyar-alam-nubala scan vol. 1 p. 965}. Fue amortajado con tres telas, dos cortadas de tela que la criada había hilado y una tercera tomada de Fuwaran {cite:siyar-alam-nubala scan vol. 1 p. 965}."
  fr: "Salih ibn Ahmad rapporte que son père, malade, lui demanda de lui lire le testament et l'approuva tel quel: « Au nom de Dieu, voici ce qu'Ahmad ibn Muhammad ibn Hanbal a légué; il témoigne qu'il n'y a de dieu que Dieu et que Muhammad est Son serviteur et Messager, et il enjoint à tous les membres de sa famille et de ses proches qui lui obéissent d'adorer Dieu parmi les adorateurs, de Le louer parmi les louangeurs et de prodiguer des conseils sincères à la communauté musulmane » (cite: Tarikh Dimashq Ibn Asakir Fikr, 1995, vol. 5, p. 326). Le testament mentionne une dette d'environ cinquante dinars envers Fuwaran, à rembourser sur les revenus de la maison (cite: Siyar Alam Nubal, vol. 1, p. 950). Hanbal rapporte qu'un fils d'al-Fadl ibn al-Rabi' lui donna en prison trois cheveux, affirmant qu'il s'agissait de cheveux du Prophète. À sa mort, il ordonna qu'on place un cheveu sur chaque œil et un sur sa langue, ce qui fut fait {cite:siyar-alam-nubala scan vol. 1 p. 965}. Il fut enveloppé dans trois linceuls, deux coupés dans un tissu filé par la servante et un troisième pris à Fuwaran {cite:siyar-alam-nubala scan vol. 1 p. 965}."
