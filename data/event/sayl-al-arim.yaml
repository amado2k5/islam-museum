id: event/sayl-al-arim
class: event
kind: other
label: { ar: "سيل العرم", en: "The flood of the 'Arim" }
summary:
  ar: "أرسل الله على أهل سبأ سيل العرم وهو السد الذي كان فرسخاً في فرسخ بناه لقمان الأكبر العادي، وكانت المياه تظهر من مخراق من الحجر الصلد والحديد فيه ثلاثون نقباً مستديرة على أحسن هندسة تخرج إلى مجاريها حتى تروي الجنان، فلما بادت الأمم وعمل الماء في أصول المخراق وأضعفه ممر السنين غلب الماء السد والبنيان فقذف به في تياره واستولى على الديار والجنان حتى انقرض سكانها، والعرم المسناة التي أحكموها حاجزاً بين ضياعهم والسيل ففجرته فأرة ليكون أظهر في الأعجوبة {cite:muruj-al-dhahab p. 489-491}. وكان أهل مأرب يعبدون الشمس فبعث الله إليهم رسلاً فجحدوهم وقالوا إن كنتم رسلاً فادعوا الله أن يسلبنا ما أنعم به علينا ويذهب عنا ما أعطانا، فدعت عليهم الرسل فأرسل عليهم سيل العرم فهدم سدهم وأهلك شجرهم، ثم طلبوا رد النعمة فأخصبت بلادهم واتسعت عمائرهم إلى فلسطين والشام فلما جاءهم الموعد أبوا إلا طغياناً فمزقهم الله كل ممزق {cite:muruj-al-dhahab p. 499}"
  en: "The breach of Saba's dam — a farsakh-square work of Luqman al-Akbar whose stone-and-iron channel fed thirty engineered outlets — decayed by the centuries until the water seized it and emptied the gardens; its name the 'Arim, the musanah burst by a rat for the greater wonder {cite:muruj-al-dhahab p. 489-491}."
