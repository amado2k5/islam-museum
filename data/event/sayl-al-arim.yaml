label: { ar: "سيل العرم", en: "The flood of the 'Arim", es: "La inundación del 'Arim", fr: "Le déluge de l'Arim", ur: "ارم کا سیلاب", tr: "Aram Tufanı", id: "Banjir 'Aram" }
summary:
  ar: "أرسل الله على أهل سبأ سيل العرم وهو السد الذي كان فرسخاً في فرسخ بناه لقمان الأكبر العادي، وكانت المياه تظهر من مخراق من الحجر الصلد والحديد فيه ثلاثون نقباً مستديرة على أحسن هندسة تخرج إلى مجاريها حتى تروي الجنان، فلما بادت الأمم وعمل الماء في أصول المخراق وأضعفه ممر السنين غلب الماء السد والبنيان فقذف به في تياره واستولى على الديار والجنان حتى انقرض سكانها، والعرم المسناة التي أحكموها حاجزاً بين ضياعهم والسيل ففجرته فأرة ليكون أظهر في الأعجوبة {cite:muruj-al-dhahab p. 489-491}. وكان أهل مأرب يعبدون الشمس فبعث الله إليهم رسلاً فجحدوهم وقالوا إن كنتم رسلاً فادعوا الله أن يسلبنا ما أنعم به علينا ويذهب عنا ما أعطانا، فدعت عليهم الرسل فأرسل عليهم سيل العرم فهدم سدهم وأهلك شجرهم، ثم طلبوا رد النعمة فأخصبت بلادهم واتسعت عمائرهم إلى فلسطين والشام فلما جاءهم الموعد أبوا إلا طغياناً فمزقهم الله كل ممزق {cite:muruj-al-dhahab p. 499}"
  en: "The breach of Saba's dam — a farsakh-square work of Luqman al-Akbar whose stone-and-iron channel fed thirty engineered outlets — decayed by the centuries until the water seized it and emptied the gardens; its name the 'Arim, the musanah burst by a rat for the greater wonder {cite:muruj-al-dhahab p. 489-491}."
  es: "La brecha de la presa de Saba —una obra cuadrada de farsakh de Luqman al-Akbar cuyo canal de piedra y hierro alimentaba treinta salidas de ingeniería— se fue deteriorando con el paso de los siglos hasta que el agua la alcanzó y vació los jardines; su nombre es 'Arim, la musanah rota por una rata para mayor asombro {cite:muruj-al-dhahab p. 489-491}."
  fr: "La brèche du barrage de Saba — un ouvrage de Luqman al-Akbar de la taille d'un farsakh, dont le canal en pierre et en fer alimentait trente sorties aménagées — s'est dégradée au fil des siècles jusqu'à ce que l'eau s'en empare et vide les jardins; son nom est l'Arim, le musanah éclaté par un rat pour la plus grande merveille {cite:muruj-al-dhahab p. 489-491}."
  ur: "صبا کے ڈیم کی خلاف ورزی - لقمان الاکبر کا فرسخ مربع کام جس کے پتھر اور لوہے کے چینل نے تیس انجنیئر آؤٹ لیٹس کو کھلایا - صدیوں تک بوسیدہ ہوا یہاں تک کہ پانی نے اسے پکڑ لیا اور باغات کو خالی کر دیا۔ اس کا نام 'ارم' ہے، مسنہ چوہے کے ذریعے پھٹا ہے عظیم تر عجوبہ کے لیے {حوالہ: مروج الذہب ص۔ 489-491}۔"
  tr: "Allah, Saba halkının üzerine Arim tufanını gönderdi. Arim, Büyük Lokman tarafından inşa edilmiş, her biri bir metre uzunluğunda olan bir barajdır. Sular, sağlam taş ve demirden yapılmış, içinde otuz yuvarlak delik bulunan, en iyi mühendislik ürünü bir kuyudan çıkarak kanallarına akıp bahçeleri sulardı. Milletler helak olunca ve su kuyunun temellerini aşındırıp yıllar geçtikçe onu zayıflatınca, su barajı ve yapıyı aştı, akıntısına sürükledi ve evleri ve bahçeleri ele geçirerek sakinlerini yok etti. Arim, onların mülkleri ile tufan arasına bir bariyer olarak sağlamlaştırdıkları settir ve bir fare onu havaya uçurarak mucizede daha belirgin hale getirdi. {Kaynak: Muruj-al-Dhahab s. 489-491} Ma'rib halkı güneşe tapıyordu, bu yüzden Allah onlara elçiler gönderdi, fakat onlar elçileri reddedip, \"Eğer elçiyseniz, Allah'a dua edin ki, bize verdiği nimetleri bizden alsın ve bize verdiği şeyleri bizden kaldırsın\" dediler. Bunun üzerine elçiler onlara karşı dua ettiler ve Allah onlara Arim tufanını gönderdi; tufan onların barajlarını ve ağaçlarını yıktı. Sonra onlar nimetlerinin geri verilmesini istediler, böylece toprakları verimli oldu ve binaları Filistin ve Levant'a kadar genişledi. Fakat belirlenen zaman geldiğinde, yine de zulmetmekten başka bir şey yapmadılar, bu yüzden Allah onları tamamen yok etti. {cite:muruj-al-dhahab s. 499}"
  id: "Allah mengirimkan kepada penduduk Saba banjir al-`Arim, yaitu bendungan yang dibangun setengah farsakh demi setengah farsakh, yang dibangun oleh Luqman Agung, yang biasa saja. Air dulunya keluar dari sebuah lubang batu dan besi yang kokoh yang memiliki tiga puluh lubang bundar dengan teknik terbaik, mengalir ke saluran-salurannya hingga mengairi kebun-kebun. Ketika bangsa-bangsa binasa dan air mengikis dasar lubang dan berjalannya waktu melemahkannya, air meluapi bendungan dan bangunan itu dan melemparkannya ke arusnya serta mengambil alih rumah-rumah dan kebun-kebun hingga penduduknya musnah. Al-`Arim adalah tanggul yang mereka perkuat sebagai penghalang antara tanah mereka dan banjir, dan seekor tikus meniupnya untuk membuatnya lebih terlihat dalam mukjizat {kutip:muruj-al-dhahab hlm. 489-491}. Dahulu, penduduk Ma'rib menyembah matahari, lalu Allah mengutus para utusan kepada mereka. Namun mereka mengingkari para utusan itu dan berkata, \"Jika kalian memang utusan, maka berdoalah kepada Allah agar Dia mengambil dari kami apa yang telah Dia nikmatkan dan mengambil dari kami apa yang telah Dia berikan.\" Maka para utusan itu berdoa melawan mereka, dan Allah menurunkan banjir 'Arim kepada mereka, yang menghancurkan bendungan mereka dan melenyapkan pohon-pohon mereka. Kemudian mereka meminta agar nikmat itu dipulihkan, sehingga tanah mereka menjadi subur dan bangunan-bangunan mereka meluas hingga ke Palestina dan Levant. Tetapi ketika waktu yang telah ditentukan tiba bagi mereka, mereka menolak kecuali untuk berbuat dosa, maka Allah menghancurkan mereka sepenuhnya. {cite:muruj-al-dhahab p. 499}"
