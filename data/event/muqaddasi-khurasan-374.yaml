summary:
  ar: "زار المقدسي خراسان سنة ٣٧٤هـ/٩٨٤م في أقصى رحلاته شرقاً؛ وكانت أمه من بيار، بلدة صغيرة بخراسان، هاجر جدها أبو طيب الشوّاء إلى القدس {cite:encyclopaedia-of-islam-2 vol. 7 p. 544}."
  en: "Al-Muqaddasi visited Khurasan in 374/984, the furthest east of his recorded journeys; his mother's family came from Biyar, a small Khurasanian town, his grandfather Abu Tayyib al-Shawwa having emigrated to Jerusalem {cite:encyclopaedia-of-islam-2 vol. 7 p. 544}."
  ur: "مقدسی 374ھ/984ء میں خراسان گئے، ان کا سب سے مشرقی موثق سفر؛ ان کی والدہ کا تعلق خراسان کی چھوٹی بستی بیار سے تھا، جہاں سے ان کے نانا ابو طیب شواء قدس ہجرت کر کے آئے تھے {cite:encyclopaedia-of-islam-2 vol. 7 p. 544}۔"
