label:
  ar: "اجتماع بني الحارث بعد وصول الكتاب وهجومهم مع يأم على أبي جعفر، ص281"
  en: "Banu al-Harith meet after the letter reaches them and attack Abu Ja'far with Yam, p. 281"
  ur: "خط پہنچنے کے بعد بنو حارث کا اجتماع اور یام کے ساتھ ابو جعفر پر حملہ، ص281"
summary:
  ar: "لما وصل الكتاب إلى بني الحارث اجتمعوا وتشاوروا ومعهم ابن بسطام، وأرسل ابن حميد إلى يأم، وسارت بنو الحارث ويأم إلى أبي جعفر، فخرج بخدمه والمدانيين وقاتلهم ساعة ثم طردهم إلى ناحية الجبل."
  en: "When the letter reached Banu al-Harith they met and took counsel, with Ibn Bustam among them; Ibn Humayd sent to Yam, and Banu al-Harith and Yam marched on Abu Ja'far, who came out with his servants and the Madanis, fought them an hour and drove them to the side of the hill."
  ur: "خط بنو حارث کو پہنچا تو انہوں نے جمع ہو کر مشورہ کیا اور ابن بسطام ان کے ساتھ تھا، ابن حمید نے یام کو پیغام بھیجا، اور بنو حارث اور یام ابو جعفر کی طرف نکلے تو وہ اپنے خادموں اور مدانیوں کے ساتھ نکلے، ایک گھڑی لڑے اور انہیں پہاڑ کی طرف بھگا دیا۔"
