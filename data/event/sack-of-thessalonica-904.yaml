summary:
  ar: "بطاقة أولية لنهب ثيسالونيكا سنة ٩٠٤م، غارة ليون الطرابلسي البحرية التي أخذت ثاني مدن بيزنطة؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Sack of Thessalonica in 904, Leo of Tripoli's naval raid that took Byzantium's second city; its sources are not yet checked on the page."
  es: "Boceto de ficha para el Saqueo de Tesalónica en 904, la incursión naval de León de Trípoli que tomó la segunda ciudad de Bizancio; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour le sac de Thessalonique en 904, le raid naval de Léon de Tripoli qui s'empara de la deuxième ville de Byzance; ses sources ne sont pas encore vérifiées sur la page."
  ur: "904 میں تھیسالونیکا کی بوری کے لیے ڈرافٹ کارڈ، طرابلس کے بحری حملے کا لیو جس نے بازنطیم کے دوسرے شہر کو لے لیا؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "904 yılında gerçekleşen Selanik'in yağmalanmasına dair ön taslak kart; bu kart, Trabluslu Leo'nun Bizans'ın ikinci büyük şehrini ele geçiren deniz baskınını konu almaktadır; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Gambaran awal tentang penjarahan Thessaloniki pada tahun 904 M, serangan angkatan laut Leo dari Tripoli yang merebut kota terbesar kedua di Bizantium; sumber-sumber di halaman ini belum ditinjau."
