summary:
  ar: "بطاقة أولية للفتح العثماني لتونس سنة ١٥٧٤م، انتزاع سنان باشا وعلوجة علي للمدينة من الحفصيين والإسبان؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Ottoman conquest of Tunis in 1574, Sinan Pasha's seizure of the city from the Hafsids and Spain; its sources are not yet checked on the page."
  es: "Boceto para la conquista otomana de Túnez en 1574, la toma de la ciudad por Sinan Pasha a los Hafsidas y a España; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet relative à la conquête ottomane de Tunis en 1574, la prise de la ville par Sinan Pacha aux Hafsides et à l'Espagne; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1574 میں تیونس پر عثمانی فتح کے لیے کارڈ کا مسودہ، سنان پاشا کا حفصیوں اور اسپین سے شہر پر قبضہ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Bu metin, 1574 yılında Osmanlı İmparatorluğu'nun Tunus'u fethine, Sinan Paşa ve Aluca Ali'nin şehri Hafsidler ve İspanyollardan ele geçirmesine dair ön bir anlatımdır; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang penaklukan Tunisia oleh Ottoman pada tahun 1574 M, perebutan kota tersebut oleh Sinan Pasha dan Aluja Ali dari Hafsid dan Spanyol; sumber-sumbernya belum ditinjau di halaman ini."
