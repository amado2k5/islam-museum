summary:
  ar: "في ذي الحجة سنة ثمانين ومائتين ورد كتاب من دبيل أن القمر انكسف في شوال ثم تجلّى في آخر الليل، فأصبحوا والدنيا مظلمة، ثم هبّت ريح سوداء شديدة، ثم زُلزلوا فتذهبّت المدينة فلم ينجُ من منازلها إلا نحو مائة دار، ودُفن إلى حين كتابة الكتاب ثلاثون ألف نفس يُخرجون من تحت الهدم، وزُلزلوا بعد الهدم خمس مرات {cite:muntazam-ibn-al-jawzi p. 143}."
  en: "In Dhu'l-Hijja 280 a dispatch from Dabil (Dvin) reported a lunar eclipse in Shawwal followed by darkness at dawn, a violent black wind, and an earthquake that buried the city — only about a hundred houses survived, thirty thousand dead were pulled out and buried, and five aftershocks followed {cite:muntazam-ibn-al-jawzi p. 143}."
  es: "En Dhu'l-Hijja 280, un despacho de Dabil (Dvin) informó de un eclipse lunar en Shawwal, seguido de oscuridad al amanecer, un violento viento negro y un terremoto que sepultó la ciudad; solo sobrevivieron alrededor de cien casas, treinta mil muertos fueron rescatados y enterrados, y se produjeron cinco réplicas {cite:muntazam-ibn-al-jawzi p. 143}."
  fr: "En Dhu'l-Hijja 280, un message de Dabil (Dvin) rapporta une éclipse lunaire en Shawwal suivie d'obscurité à l'aube, d'un violent vent noir et d'un tremblement de terre qui ensevelit la ville — seule une centaine de maisons survécurent, trente mille morts furent extraits et enterrés, et cinq répliques suivirent {cite:muntazam-ibn-al-jawzi p. 143}."
  ur: "ذی الحجہ 280 میں دبیل ⁦(دیوین)⁩ سے ایک روانگی نے شوال میں چاند گرہن کی اطلاع دی جس کے بعد فجر کے وقت اندھیرے، ایک پرتشدد کالی آندھی، اور ایک زلزلہ جس نے شہر کو دفن کر دیا - صرف ایک سو کے قریب گھر بچ سکے، تیس ہزار افراد کو نکال کر دفن کیا گیا، اور اس کے بعد پانچ جھٹکے آئے۔ 143}۔"
