label: { ar: "وقعة الأقحوانة وقتل صالح بن مرداس" }
summary:
  ar: "في جمادى الأولى سنة عشرين وأربعمائة تلاقى صالح بن مرداس أميرُ حلب وأنوشكين الدزبري أميرُ جيوش الظاهر العبيدي على الأقحوانة — بلدة بالشام من أعمال فلسطين قرب طبريا — فتصافّا وجرت بينهما مقتلة انجلت عن قتل صالح المذكور، وهو أول ملوك بني مرداس المتملّكين بحلب {cite:shadharat-dhahab p. 215}. وعند ابن خلدون جهّز الظاهر العساكر لقتال صالح وحسان بن مفرج صاحب الرملة فلقيهم أنوشتكين على الأردن بطبرية فانهزموا وقُتل صالح وولده الأصغر ونجا ولده الأكبر نصر إلى حلب، ويؤرخه في سنة ٤٢٩ {cite:tarikh-ibn-khaldun-ibar p. 1075}؛ ويذكره ابن الجوزي في أحداث سنة ٤٢٠ قتل صالح وابنه على يد عساكر مصر {cite:muntazam-ibn-al-jawzi j.8 p.388}."
  en: "In Jumada I 420 Salih b. Mirdas, the new Mirdasid amir of Aleppo, met Anushtakin al-Dizbiri, al-Zahir's commander-in-chief, at al-Uqhuwana near Tiberias; the battle ended with Salih dead {cite:shadharat-dhahab p. 215}."
