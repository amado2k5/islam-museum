label: { ar: "وقعة الأقحوانة وقتل صالح بن مرداس", en: "The battle of al-Uqhuwana and the killing of Salih ibn Mirdas", fr: "La bataille d'al-Uqhuwana et la mort de Salih ibn Mirdas", es: "La batalla de al-Uqhuwana y el asesinato de Salih ibn Mirdas", ur: "اُخوانہ کی جنگ اور صالح بن مرداس کا قتل", tr: "El-Akhuvana Muharebesi ve Salih ibn Mirdas'ın öldürülmesi", id: "Perang Al-Aqhuwana dan pembunuhan Salih ibn Mirdas" }
summary:
  ar: "في جمادى الأولى سنة عشرين وأربعمائة تلاقى صالح بن مرداس أميرُ حلب وأنوشكين الدزبري أميرُ جيوش الظاهر العبيدي على الأقحوانة — بلدة بالشام من أعمال فلسطين قرب طبريا — فتصافّا وجرت بينهما مقتلة انجلت عن قتل صالح المذكور، وهو أول ملوك بني مرداس المتملّكين بحلب {cite:shadharat-dhahab p. 215}. وعند ابن خلدون جهّز الظاهر العساكر لقتال صالح وحسان بن مفرج صاحب الرملة فلقيهم أنوشتكين على الأردن بطبرية فانهزموا وقُتل صالح وولده الأصغر ونجا ولده الأكبر نصر إلى حلب، ويؤرخه في سنة ٤٢٩ {cite:tarikh-ibn-khaldun-ibar p. 1075}؛ ويذكره ابن الجوزي في أحداث سنة ٤٢٠ قتل صالح وابنه على يد عساكر مصر {cite:muntazam-ibn-al-jawzi j.8 p.388}."
  en: "In Jumada I 420 Salih b. Mirdas, the new Mirdasid amir of Aleppo, met Anushtakin al-Dizbiri, al-Zahir's commander-in-chief, at al-Uqhuwana near Tiberias; the battle ended with Salih dead {cite:shadharat-dhahab p. 215}."
  fr: "En Jumada I 420, Salih b. Mirdas, le nouvel émir mirdasside d'Alep, affronta Anushtakin al-Dizbiri, commandant en chef d'al-Zahir, à al-Uqhuwana près de Tibériade ; la bataille s'acheva par la mort de Salih {cite:shadharat-dhahab p. 215}."
  es: "En Jumada I 420 Salih b. Mirdas, el nuevo emir mirdasid de Alepo, se reunió con Anushtakin al-Dizbiri, comandante en jefe de al-Zahir, en al-Uqhuwana, cerca de Tiberíades; la batalla terminó con Salih muerto {cita: shadharat-dhahab p. 215}."
  ur: "جمادی الثانی 420 ص میں۔ حلب کے نئے میرداسید امیر میرداس نے الظاہر کے کمانڈر انچیف انوشتکین الدزبیری سے تبریاس کے قریب العقوانہ میں ملاقات کی۔ جنگ صالح کی موت کے ساتھ ختم ہوئی 215}۔"
  tr: "Hicri 420 yılının Cemâdeü'l-Ula ayında, Halep Emiri Salih ibn Mirdas ve el-Zahir el-Ubaydi'nin ordularının komutanı Anuşkin el-Dazbari, Filistin topraklarının bir parçası olan ve Taberiye yakınlarındaki Levant'taki el-Ukhuvana kasabasında karşılaştılar ve çatıştılar. Çıkan savaşta, Halep'i yöneten ilk Beni Mirdas hükümdarı olan Salih öldü. {Kaynak: Şadharat-Dhaba s. 215}. İbn Haldun'a göre, el-Zahir, Salih ve Ramla hükümdarı Hasan ibn Mufarrij ile savaşmak için birlikler hazırladı. Anuşkin, Taberiye yakınlarındaki Ürdün Nehri'nde onlarla karşılaştı ve yenilgiye uğradılar. Salih ve en küçük oğlu öldürüldü, en büyük oğlu Nasr ise Halep'e kaçtı. İbn Haldun bu olayı Hicri 429 yılına tarihlendirir {kaynak:tarikh-ibn-khaldun-ibar s. 1075}. İbn el-Cevzi ise Hicri 420 yılındaki olaylar arasında Salih ve oğlunun Mısır ordusu tarafından öldürüldüğünü belirtir {kaynak:muntazam-ibn-al-jawzi cilt 8 s. 388}."
  id: "Pada bulan Jumada al-Ula tahun 420 H, Salih ibn Mirdas, Emir Aleppo, dan Anushkin al-Dazbari, komandan pasukan al-Zahir al-Ubaydi, bertemu di al-Uqhuwana—sebuah kota di Levant, bagian dari wilayah Palestina dekat Tiberias—dan mereka bentrok. Pertempuran pun terjadi, mengakibatkan kematian Salih yang disebutkan di atas, yang merupakan penguasa Banu Mirdas pertama yang memerintah Aleppo {cite:shadharat-dhahab hlm. 215}. Menurut Ibn Khaldun, al-Zahir mempersiapkan pasukan untuk melawan Salih dan Hassan ibn Mufarrij, penguasa Ramla. Anushkin menemui mereka di Sungai Yordan dekat Tiberias, dan mereka dikalahkan. Salih dan putra bungsunya terbunuh, sementara putra sulungnya, Nasr, melarikan diri ke Aleppo. Ibn Khaldun mencatat peristiwa ini terjadi pada tahun 429 H {cite:tarikh-ibn-khaldun-ibar p. 1075}. Ibn al-Jawzi menyebutkannya dalam peristiwa tahun 420 H, dengan menyatakan bahwa Salih dan putranya dibunuh oleh tentara Mesir {cite:muntazam-ibn-al-jawzi vol. 8 p. 388}."
