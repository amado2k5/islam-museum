  ur: "1843 میں کربلا کے محاصرے کے لیے ڈرافٹ کارڈ، نجیب پاشا کا عثمانی حکومت کی بحالی کے لیے شہر پر حملہ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Bu metin, 1843 yılında gerçekleşen Kerbela kuşatması, Osmanlı Necib Paşa'nın şehre saldırması ve şehri ele geçirmesiyle ilgili ön bir anlatımdır; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang pengepungan Karbala pada tahun 1843 M, penyerbuan kota oleh Najib Pasha dari Ottoman dan penaklukannya; sumber-sumber yang tercantum di halaman ini belum ditinjau."
