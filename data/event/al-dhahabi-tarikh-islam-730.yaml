id: event/al-dhahabi-tarikh-islam-730
class: event
kind: other
label:
  ar: "الذهبي يصنّف «تاريخ الإسلام» ومجاميعه الكبرى، حوالي ٧٣٠هـ"
  en: "Al-Dhahabi composes Tarikh al-Islam and his great compilations, c. 730/1330"
  ur: "ذہبی کی تصنیفِ «تاریخ الاسلام» و بڑے مجموعے، تقریباً 730ھ/1330ء"
summary:
  ar: "ألّف الذهبي أعظم كتبه «تاريخ الإسلام» إلى سنة ٧٠٠هـ على نظام «المنتظم» لابن الجوزي، في سبعين طبقة من العقود، تجمع حوادث السنين ثم تراجم المتوفَّين فيها {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}، واختصر منه ستة مختصرات منها «سير أعلام النبلاء» و«تذكرة الحفاظ» و«العبر» و«دوال الإسلام»، وصنّف في الرجال «ميزان الاعتدال» و«المشتبه» وأخرج «معجمه» الكبير والصغير والمختص بمحدثيه {cite:encyclopaedia-of-islam-2 vol. 2 p. 216} {cite:durar-kamina-jil-1993 3/336-337}."
  en: "Al-Dhahabi composed his greatest work, Tarikh al-Islam, down to the year 700 on the model of Ibn al-Jawzi's al-Muntazam, in seventy decadal 'classes', pairing each year's events with the obituaries of its dead {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}. He abridged it six times — among them Siyar A'lam al-Nubala', Tadhkirat al-Huffaz, al-Ibar and Duwal al-Islam — and wrote on rijal Mizan al-I'tidal, al-Mushtabih, besides extracting his great, small and select Mu'jam of his hadith teachers {cite:encyclopaedia-of-islam-2 vol. 2 p. 216} {cite:durar-kamina-jil-1993 3/336-337}."
  ur: "ذہبی نے اپنی عظیم ترین تصنیف «تاریخ الاسلام» سال 700ھ تک، ابن الجوزی کے «المنتظم» کے اسلوب پر، ستر عشروں کی طبقات میں مرتب کی، جس میں ہر سال کے واقعات کے ساتھ اسی سال کے وفات یافتگان کی تراجم ہیں {cite:encyclopaedia-of-islam-2 vol. 2 p. 215}۔ اس کے چھ اختصارات کیے جن میں «سیر اعلام النبلاء»، «تذکرۃ الحفاظ»، «العبر» اور «دوال الاسلام» ہیں، اور رجال پر «میزان الاعتدال» اور «المشتبہ» لکھیے، نیز اپنے شیوخِ حدیث کا «معجم» الکبیر، الصغیر اور المختص برآمد کیا {cite:encyclopaedia-of-islam-2 vol. 2 p. 216} {cite:durar-kamina-jil-1993 3/336-337}۔"
