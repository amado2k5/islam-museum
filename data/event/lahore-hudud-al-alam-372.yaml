  en: "The earliest surviving mention of Lahore comes in the Hudud al-'alam, composed in 372/982, which describes a city populated exclusively by Hindus yet subject to the Qurayshite ruler of Multan {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 37}."
