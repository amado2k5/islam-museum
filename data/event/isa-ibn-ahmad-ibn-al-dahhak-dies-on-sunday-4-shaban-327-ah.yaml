id: "event/isa-ibn-ahmad-ibn-al-dahhak-dies-on-sunday-4-shaban-327-ah"
class: event
kind: other
label:
  ar: "يموت عيسى بن أحمد بن الضحاك في ريدة يوم الأحد لأربع من شعبان سنة 327هـ، ص414"
  en: "Isa ibn Ahmad ibn al-Dahhak dies at Rayda on Sunday, 4 Sha'ban 327 AH, p. 414"
  ur: "عیسیٰ بن احمد بن الضحاک 4 شعبان 327ھ کو اتوار کے دن ریدہ میں وفات پاتے ہیں، ص414"
  es: "Isa ibn Ahmad ibn al-Dahhak muere en Rayda el domingo 4 de Sha'ban 327 AH, p. 414"
  fr: "Isa ibn Ahmad ibn al-Dahhak meurt à Rayda le dimanche 4 Sha'ban 327 AH, p. 414"
  tr: "İsa ibn Ahmed ibn el-Dahhak, Şaban ayının dördüncü Pazar günü Rida'da öldü, H. 327, s. 414"
  id: "Isa ibn Ahmad ibn al-Dahhak wafat di Ridha pada hari Minggu tanggal empat Sya'ban tahun 327 H, hal. 414"
summary:
  ar: "يتوفى عيسى بن أحمد بن الضحاك يوم الأحد لأربع من شعبان سنة 327هـ في ريدة، وكان أبوه قد استخلفه فيها، فيدفن بها، وينصرف أبوه من صعدة يوم السبت لعشر من الشهر."
  en: "Isa ibn Ahmad ibn al-Dahhak dies at Rayda on Sunday, 4 Sha'ban 327 AH. His father had made him his deputy there, and he is buried there. The father leaves Saada on Saturday, 10 of the month, when the news reaches him."
  ur: "عیسیٰ بن احمد بن الضحاک 4 شعبان 327ھ کو اتوار کے دن ریدہ میں وفات پاتے ہیں۔ ان کے والد نے انہیں وہاں اپنا نائب بنایا تھا، اور انہیں وہیں دفن کیا جاتا ہے۔ خبر پہنچنے پر والد اسی مہینے کی دس تاریخ کو ہفتے کے دن صعدہ سے نکل جاتے ہیں۔"
  es: "Isa ibn Ahmad ibn al-Dahhak falleció en Rayda el domingo 4 de Sha'ban del año 327 de la Hégira. Su padre lo había nombrado su lugarteniente allí, y fue enterrado en ese lugar. El padre partió de Saada el sábado 10 del mes, al recibir la noticia."
  fr: "Isa ibn Ahmad ibn al-Dahhak décède à Rayda le dimanche 4 Sha'ban 327 AH. Son père l'avait nommé son représentant dans cette ville, et il y est enterré. Le père quitte Saada le samedi 10 du mois, dès qu'il apprend la nouvelle."
  tr: "İsa bin Ahmed bin el-Dahhak, babasının halefi olarak atadığı Rıza'da, Hicri 327 yılının Şaban ayının dördüncü günü Pazar günü vefat etti. Orada defnedildi ve babası ayın onuncu günü Cumartesi günü Sa'da'dan ayrıldı."
  id: "Isa bin Ahmed bin Al-Dahhak wafat pada hari Minggu, tanggal 4 Sya'ban 327 H, di Rida, tempat ayahnya menunjuknya sebagai penerus. Ia dimakamkan di sana, dan ayahnya meninggalkan Sa'da pada hari Sabtu, tanggal 10 bulan itu."
