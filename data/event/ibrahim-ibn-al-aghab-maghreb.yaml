id: event/ibrahim-ibn-al-aghab-maghreb
class: event
kind: other
label: { ar: "تولية هارون إبراهيم بن الأغلب بلاد المغرب", en: "Harun's Appointment of Ibrahim ibn al-Aghlab over the Maghreb", es: "El nombramiento de Ibrahim ibn al-Aghlab por Harún para dirigir el Magreb.", fr: "Nomination d'Ibrahim ibn al-Aghlab à la tête du Maghreb par Harun", ur: "ہارون کا ابراہیم بن اغلب کو مغرب پر مقرر کرنا" }
summary:
  ar: "عند البلاذري: كان إبراهيم بن الأغلب من وجوه جند مصر فوثب واثنا عشر رجلاً معه فأخذوا من بيت المال مقدار أرزاقهم لم يزدادوا على ذلك شيئاً وهربوا فلحقوا بموضع يقال له الزاب وهو من القيروان على مسيرة أكثر من عشرة أيام وعامل الثغر يومئذ من قبل الرشيد هرثمة بن أعين واعتقد إبراهيم بن الأغلب على من كان من تلك الناحية من الجند وغيرهم الرياسة وأقبل يهدي إلى هرثمة ويلاطفه ويكتب إليه يعلمه أنه لم يخرج يداً من طاعة ولا اشتمل على معصية وأنه إنما دعاه إلى ما كان منه الحوجة والضرورة فولّاه هرثمة ناحيته واستكفاه أمرها فلما صرف هرثمة من الثغر ولّى بعده ابن العكي فساء أثره فيه حتى انتقض عليه فاستشار الرشيد هرثمة في رجل يوليه إياه فأشار عليه باستصلاح إبراهيم واصطناعه وتوليته الثغر فكتب إليه الرشيد يعلمه أنه قد صفح له عن جرمه وأقاله هفوته ورأى توليته بلاد المغرب اصطناعاً له ليستقبل به الإحسان ويستقبل به النصيحة فولّي إبراهيم ذلك الثغر وقام به وضبطه."
  en: "In al-Baladhuri: Ibrahim ibn al-Aghlab was of Egypt's army notables; he rose with twelve men who took from the treasury only the measure of their rations and fled, reaching a place called al-Zab over ten days' march from Qayrawan, the frontier's agent then being Harun's Harthama ibn A'yan; Ibrahim claimed the leadership over that district's troops, sending gifts to Harthama, courting him and writing that he had not left obedience nor embraced sin — only need and necessity had driven him — so Harthama gave him his district and sufficed him for it; when Harthama left the frontier Ibn al-Akki ruled after him and his conduct soured until the province rose on him, so al-Rashid consulted Harthama on a man to appoint and he counselled reconciling Ibrahim, cultivating him and giving him the frontier; al-Rashid wrote that he had pardoned his offence and seen fit to give him the Maghreb as a benefaction — Ibrahim ruled that frontier, stood over it and held it firm."
  es: "En al-Baladhuri: Ibrahim ibn al-Aghlab era uno de los notables del ejército de Egipto; se levantó con doce hombres que tomaron del tesoro solo la medida de sus raciones y huyeron, llegando a un lugar llamado al-Zab a más de diez días de marcha desde Qayrawan, siendo el agente de la frontera entonces Harthama ibn A'yan de Harun; Ibrahim reclamó el liderazgo de las tropas de ese distrito, enviando regalos a Harthama, cortejándolo y escribiendo que no había abandonado la obediencia ni abrazado el pecado, solo la necesidad y la necesidad lo habían impulsado, así que Harthama le dio su distrito y le bastó con eso; cuando Harthama dejó la frontera, Ibn al-Akki gobernó después de él y su conducta se agrió hasta que la provincia se rebeló contra él, entonces al-Rashid consultó a Harthama sobre un hombre para nombrar y aconsejó reconciliar a Ibrahim, cultivarlo y darle la frontera; Al-Rashid escribió que había perdonado su delito y que había considerado oportuno otorgarle el Magreb como beneficio; Ibrahim gobernó esa frontera, se mantuvo firme sobre ella y la conservó con firmeza."
  fr: "Dans al-Baladhuri: Ibrahim ibn al-Aghlab était un notable de l'armée égyptienne; il se souleva avec douze hommes qui ne prirent du trésor que la mesure de leurs rations et s'enfuirent, atteignant un endroit appelé al-Zab, à plus de dix jours de marche de Qayrawan, l'agent de la frontière étant alors Harthama ibn A'yan, fils de Harun; Ibrahim revendiqua le commandement des troupes de ce district, envoyant des présents à Harthama, le courtisant et écrivant qu'il n'avait ni manqué d'obéissance ni embrassé le péché — seuls le besoin et la nécessité l'avaient poussé — alors Harthama lui confia son district et le lui fournit; lorsque Harthama quitta la frontière, Ibn al-Akki lui succéda et sa conduite se détériora jusqu'à ce que la province se soulève contre lui, alors al-Rashid consulta Harthama au sujet d'un homme à nommer et celui-ci conseilla de se réconcilier avec Ibrahim, de le courtiser et de lui confier la frontière; Al-Rashid écrivit qu'il avait pardonné son délit et jugé bon de lui accorder le Maghreb en guise de bienfait — Ibrahim régnait sur cette frontière, la contrôlait et la maintenait fermement."
  ur: "البلادوری میں ہے: ابراہیم بن الغلب مصر کی فوج کے معززین میں سے تھا۔ وہ بارہ آدمیوں کے ساتھ اٹھ کھڑا ہوا جنہوں نے خزانے سے صرف اپنے راشن کا پیمانہ لیا اور فرار ہو کر قیروان سے دس دن کی مسافت پر الزاب نامی مقام پر پہنچے، جو اس وقت ہارون کا حرثمہ بن عیان تھا، سرحدی ایجنٹ تھا۔ ابراہیم نے اس ضلع کے فوجیوں پر قیادت کا دعویٰ کیا، ہرتھما کو تحائف بھیجے، اس کی خدمت کی اور لکھا کہ اس نے نہ اطاعت چھوڑی ہے اور نہ ہی گناہ کو قبول کیا ہے - صرف ضرورت اور ضرورت نے اسے آگے بڑھایا ہے - لہذا ہرتھاما نے اسے اپنا ضلع دیا اور اسے اس کے لیے کافی کر دیا۔ جب حارثمہ نے سرحد چھوڑ دی تو ابن العکی نے اس کے بعد حکومت کی اور اس کا طرز عمل اس وقت تک خراب ہو گیا جب تک کہ صوبہ اس پر چڑھ نہ گیا، تو الرشید نے حرثمہ سے ایک آدمی مقرر کرنے کے لیے مشورہ کیا اور اس نے ابراہیم سے صلح کرنے، اس کی آبیاری کرنے اور اسے سرحد دینے کا مشورہ دیا۔ الرشید نے لکھا ہے کہ اس نے اپنا جرم معاف کر دیا تھا اور اسے مغرب دینے کے لیے مناسب سمجھا - ابراہیم نے اس سرحد پر حکومت کی، اس پر کھڑے ہو کر اسے مضبوطی سے تھام لیا۔"
