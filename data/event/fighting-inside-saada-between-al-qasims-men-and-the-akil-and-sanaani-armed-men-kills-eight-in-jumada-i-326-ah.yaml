id: "event/fighting-inside-saada-between-al-qasims-men-and-the-akil-and-sanaani-armed-men-kills-eight-in-jumada-i-326-ah"
class: event
kind: other
label:
  ar: "قتال داخل صعدة بين أصحاب القاسم وحملة السلاح من الأكيليين والصنعانيين، فيقتل ثمانية، في جمادى الأولى سنة 326هـ، ص410-411"
  en: "Fighting breaks out inside Saada between al-Qasim's men and the armed men of Akil and Sanaa, and eight are killed, in Jumada I 326 AH, pp. 410-411"
  ur: "صعدہ کے اندر قاسم کے ساتھیوں اور اکیل و صنعاء کے مسلح لوگوں کے درمیان لڑائی ہوتی ہے اور جمادی الاولی 326ھ میں آٹھ آدمی مارے جاتے ہیں، ص410-411"
  es: "En Jumada I 326 AH, pp. 410-411, estallan combates en Saada entre los hombres de al-Qasim y los hombres armados de Akil y Sanaa, y ocho personas mueren."
summary:
  ar: "يقتل أحد أصحاب القاسم داخل الحي، فتشتعل الحرب بينه وبين حملة السلاح من الأكيليين والصنعانيين يوم الخميس لست ليال خلت من جمادى الأولى، ويقتل بينهم ثمانية."
  en: "One of al-Qasim's men is killed inside the quarter, and war breaks out between him and the armed men of Akil and Sanaa on Thursday, six nights into Jumada I 326 AH. Eight are killed between them."
  ur: "قاسم کے ایک ساتھی کو محلے کے اندر قتل کیا جاتا ہے، اور جمادی الاولی 326ھ کی چھ راتیں گزرنے پر جمعرات کے دن اس کے اور اکیل و صنعاء کے مسلح لوگوں کے درمیان جنگ چھڑ جاتی ہے، جس میں آٹھ آدمی مارے جاتے ہیں۔"
  es: "Uno de los hombres de al-Qasim muere dentro del barrio, y el jueves, seis noches después del inicio de la Jumada I del año 326 de la Hégira, estalla la guerra entre él y los hombres armados de Akil y Sanaa. En total, mueren ocho personas."
