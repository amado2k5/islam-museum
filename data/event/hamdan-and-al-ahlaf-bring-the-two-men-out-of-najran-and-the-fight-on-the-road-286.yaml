id: event/hamdan-and-al-ahlaf-bring-the-two-men-out-of-najran-and-the-fight-on-the-road-286
class: event
kind: other
label:
  ar: خروج همدان والأحلاف وثقيف بالرجلين من نجران والقتال على الطريق، 286هـ
  en: Hamdan, al-Ahlaf and Thaqif bring the two men out of Najran and the fight on the road, 286 AH
  ur: ہمدان، احلاف اور ثقیف کا دونوں کو نجران سے نکالنا اور راستے کی لڑائی، 286ھ
  es: "Hamdan, al-Ahlaf y Thaqif sacan a los dos hombres de Najrán y la lucha continúa en el camino, 286 AH."
  fr: "Hamdan, al-Ahlaf et Thaqif font sortir les deux hommes de Najran et le combat s'engage sur la route, 286 AH"
  tr: "Hamdan'ın, müttefiklerinin ve Thaqif'in iki adamıyla birlikte Necran'dan ayrılışı ve yolda yaşanan çatışmalar, Hicri 286"
  id: "Keberangkatan Hamdan, sekutu-sekutunya, dan Thaqif bersama dua orang dari Najran dan pertempuran di jalan, 286 H."
summary:
  ar: يبلغ همدان خبر بني الحارث فيجتمع عسكر كثيف من همدان والأحلاف وثقيف ويرسلون إلى الرجلين أن ينهضا معهم لعدم ثقتهم ببني عبد المدان، فيخرجان، ويعارضهما بنو الحارث في الطريق فيحمل أبو محمد عليهم بمن معه من همدان بعد مرور الضعفاء فيهزمهم ويبلغ الحصن ويقيم يومين.
  en: News of Banu al-Harith reaches Hamdan; a large army of Hamdan, al-Ahlaf and Thaqif gathers and asks the two men to rise with them, not trusting Banu Abd al-Madan; they leave, Banu al-Harith intercept them on the road, and after the weak have passed Abu Muhammad charges with the Hamdan men and routs them, reaching the fort where he stays two days.
  ur: ہمدان کو بنو حارث کی خبر پہنچتی ہے؛ ہمدان، احلاف اور ثقیف کا بڑا لشکر جمع ہوتا ہے اور دونوں سے ساتھ چلنے کی درخواست کرتا ہے کیونکہ انہیں بنو عبد المدان پر اعتماد نہیں؛ وہ نکلتے ہیں، راستے میں بنو حارث انہیں روکتے ہیں اور کمزوروں کے گزرنے کے بعد ابو محمد ہمدان کے ساتھیوں کے ساتھ حملہ کر کے انہیں ہٹاتے ہیں اور قلعے تک پہنچ کر دو دن ٹھہرتے ہیں۔
  es: "La noticia de Banu al-Harith llega a Hamdan; un gran ejército de Hamdan, al-Ahlaf y Thaqif se reúne y pide a los dos hombres que se unan a ellos, desconfiando de Banu Abd al-Madan; se marchan, Banu al-Harith los intercepta en el camino, y después de que los débiles han pasado, Abu Muhammad carga con los hombres de Hamdan y los derrota, llegando al fuerte donde permanece dos días."
  fr: "La nouvelle de Banu al-Harith parvient à Hamdan; une grande armée de Hamdan, d'al-Ahlaf et de Thaqif se rassemble et demande aux deux hommes de se lever avec eux, ne faisant pas confiance à Banu Abd al-Madan; ils partent, Banu al-Harith les intercepte sur la route, et après que les faibles soient passés, Abu Muhammad charge avec les hommes de Hamdan et les met en déroute, atteignant le fort où il reste deux jours."
  tr: "Hamdan, Beni el-Harith'in haberini duyunca, Hamdan'dan, müttefiklerinden ve Sakif'ten büyük bir ordu toplandı ve Beni Abd el-Madan'a güvenmedikleri için iki adama da kendileriyle birlikte ayaklanmaları için haber gönderdiler. Böylece yola çıktılar ve yolda Beni el-Harith onlarla karşılaştı. Zayıflar geçtikten sonra, Ebu Muhammed, yanında bulunan Hamdanlılarla birlikte onlara saldırdı, onları yenerek kaleye ulaştı ve iki gün orada kaldı."
  id: "Hamdan mendengar kabar tentang Bani al-Harith, maka pasukan besar dari Hamdan, sekutu-sekutunya, dan Thaqif berkumpul dan mengirim pesan kepada kedua orang itu untuk bangkit bersama mereka karena mereka tidak mempercayai Bani Abd al-Madan. Maka mereka berangkat, dan Bani al-Harith menghadang mereka di jalan. Abu Muhammad menyerang mereka bersama orang-orang Hamdan yang bersamanya setelah pasukan lemah berlalu, sehingga ia mengalahkan mereka dan mencapai benteng dan tinggal selama dua hari."
