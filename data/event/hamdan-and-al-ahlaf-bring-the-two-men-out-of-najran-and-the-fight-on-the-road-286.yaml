id: event/hamdan-and-al-ahlaf-bring-the-two-men-out-of-najran-and-the-fight-on-the-road-286
class: event
kind: other
label:
  ar: خروج همدان والأحلاف وثقيف بالرجلين من نجران والقتال على الطريق، 286هـ
  en: Hamdan, al-Ahlaf and Thaqif bring the two men out of Najran and the fight on the road, 286 AH
  ur: ہمدان، احلاف اور ثقیف کا دونوں کو نجران سے نکالنا اور راستے کی لڑائی، 286ھ
summary:
  ar: يبلغ همدان خبر بني الحارث فيجتمع عسكر كثيف من همدان والأحلاف وثقيف ويرسلون إلى الرجلين أن ينهضا معهم لعدم ثقتهم ببني عبد المدان، فيخرجان، ويعارضهما بنو الحارث في الطريق فيحمل أبو محمد عليهم بمن معه من همدان بعد مرور الضعفاء فيهزمهم ويبلغ الحصن ويقيم يومين.
  en: News of Banu al-Harith reaches Hamdan; a large army of Hamdan, al-Ahlaf and Thaqif gathers and asks the two men to rise with them, not trusting Banu Abd al-Madan; they leave, Banu al-Harith intercept them on the road, and after the weak have passed Abu Muhammad charges with the Hamdan men and routs them, reaching the fort where he stays two days.
  ur: ہمدان کو بنو حارث کی خبر پہنچتی ہے؛ ہمدان، احلاف اور ثقیف کا بڑا لشکر جمع ہوتا ہے اور دونوں سے ساتھ چلنے کی درخواست کرتا ہے کیونکہ انہیں بنو عبد المدان پر اعتماد نہیں؛ وہ نکلتے ہیں، راستے میں بنو حارث انہیں روکتے ہیں اور کمزوروں کے گزرنے کے بعد ابو محمد ہمدان کے ساتھیوں کے ساتھ حملہ کر کے انہیں ہٹاتے ہیں اور قلعے تک پہنچ کر دو دن ٹھہرتے ہیں۔
