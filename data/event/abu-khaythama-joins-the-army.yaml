id: event/abu-khaythama-joins-the-army
class: event
kind: other
label: { ar: "لحاق أبي خيثمة بالنبي", en: "Abu Khaythama catches up with the Prophet", fr: "Abu Khaythama rejoint le Prophète", es: "Abu Khaythama alcanza al Profeta", ur: "ابو خیثمہ نے نبی سے ملاقات کی۔" }
summary:
  ar: "رجع أبو خيثمة بعد أن سار النبي أياماً إلى أهله في يوم حار، فوجد امرأتين له في عريشين هيأتاهما له بالماء البارد والطعام، فامتنع من دخولهما وقال إنه لا يرضى أن يكون في ظل بارد والنبي في الضح والريح والحر، وأخذ زاده وناضحه وخرج في طلب النبي حتى أدركه بتبوك."
  en: Days after the Prophet had marched, Abu Khaythama returned to his family on a hot day and found his two wives in two bowers they had prepared for him with cold water and food. He refused to enter, saying he would not sit in cool shade while the Prophet was out in the midday wind and heat; he took his provisions and his camel and went after the Prophet until he caught up with him at Tabuk.
  fr: "Quelques jours après le départ du Prophète, Abu Khaythama revint auprès des siens par une journée chaude et trouva ses deux épouses dans deux tonnelles qu’elles lui avaient préparées avec de l’eau fraîche et de la nourriture. Il refusa d’entrer, disant qu’il ne resterait pas à l’ombre fraîche tandis que le Prophète était dehors, dans le vent et la chaleur de midi ; il prit ses provisions et son chameau et partit à sa suite jusqu’à le rejoindre à Tabuk."
  es: "Días después de la marcha del Profeta, Abu Khaythama regresó con su familia en un día caluroso y encontró a sus dos esposas en dos cenadores que le habían preparado con agua fresca y comida. Se negó a entrar, diciendo que no se sentaría a la sombra mientras el Profeta estuviera expuesto al viento y al calor del mediodía; tomó sus provisiones y su camello y siguió al Profeta hasta que lo alcanzó en Tabuk."
  ur: "نبی کے کوچ کرنے کے چند دن بعد، ابو خیثمہ ایک گرم دن میں اپنے گھر والوں کے پاس واپس آئے اور انہوں نے اپنی دونوں بیویوں کو دو کنجوں میں پایا جنہوں نے اس کے لیے ٹھنڈا پانی اور کھانا تیار کیا تھا۔ اس نے داخل ہونے سے انکار کر دیا، اور کہا کہ وہ ٹھنڈی چھاؤں میں نہیں بیٹھیں گے جب کہ نبی دوپہر کی ہوا اور گرمی میں باہر ہوں گے۔ وہ اپنا سامان اور اونٹ لے کر نبی کے پیچھے چلا گیا یہاں تک کہ آپ نے تبوک میں آپ سے ملاقات کی۔"
