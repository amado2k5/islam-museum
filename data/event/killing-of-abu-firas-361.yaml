summary:
  ar: "في ربيع الآخر سنة 361هـ قتل أبو فراس الحمداني بصدد — قرية في طرف البادية عند حمص — بعد وحشة وقعت بينه وبين ابن أخته أبي المعالي بن سيف الدولة، فجمع هذا الأعراب من بني كلاب وأدركه قرغويه فاستأمن أصحاب أبي فراس واختلط بهم فأمر قرغويه غلاماً له بقتله فأخذ رأسه وتركت جثته حتى دفنها أعراب {cite:kamil-ibn-al-athir p. 433}."
  en: "In Rabi II 361 the poet Abu Firas al-Hamdani was run down at Sadda by his nephew Abu'l-Ma'ali's Bedouins; his men bought safety, he stayed among them disguised, and a ghulam of Qarghuya took his head on the prince's order {cite:kamil-ibn-al-athir p. 433}."
