label: { ar: "قتل أبو فراس الحمداني", en: "Killing of Abu Firas al-Hamdani", es: "Asesinato de Abu Firas al-Hamdani", fr: "Meurtre d'Abou Firas al-Hamdani", ur: "ابو فراس ہمدانی کا قتل" }
summary:
  ar: "في ربيع الآخر سنة 361هـ قتل أبو فراس الحمداني بصدد — قرية في طرف البادية عند حمص — بعد وحشة وقعت بينه وبين ابن أخته أبي المعالي بن سيف الدولة، فجمع هذا الأعراب من بني كلاب وأدركه قرغويه فاستأمن أصحاب أبي فراس واختلط بهم فأمر قرغويه غلاماً له بقتله فأخذ رأسه وتركت جثته حتى دفنها أعراب {cite:kamil-ibn-al-athir p. 433}."
  en: "In Rabi II 361 the poet Abu Firas al-Hamdani was run down at Sadda by his nephew Abu'l-Ma'ali's Bedouins; his men bought safety, he stayed among them disguised, and a ghulam of Qarghuya took his head on the prince's order {cite:kamil-ibn-al-athir p. 433}."
  es: "En Rabi II 361, el poeta Abu Firas al-Hamdani fue perseguido en Sadda por los beduinos de su sobrino Abu'l-Ma'ali; sus hombres compraron seguridad, él se quedó entre ellos disfrazado, y un ghulam de Qarghuya le cortó la cabeza por orden del príncipe {cite:kamil-ibn-al-athir p. 433}."
  fr: "En Rabi II 361, le poète Abu Firas al-Hamdani fut renversé à Sadda par les Bédouins de son neveu Abu'l-Ma'ali; ses hommes achetèrent la sécurité, il resta parmi eux déguisé, et un ghulam de Qarghuya prit sa tête sur l'ordre du prince {cite:kamil-ibn-al-athir p. 433}."
  ur: "ربیع دوم 361 میں شاعر ابو فراس الحمدانی کو اس کے بھتیجے ابو المعالی کے بدوؤں نے صدہ میں مار ڈالا۔ اس کے آدمیوں نے حفاظت خرید لی، وہ بھیس بدل کر ان کے درمیان رہا، اور قرغیہ کے ایک غلام نے شہزادے کے حکم پر اس کا سر پکڑ لیا۔ 433}۔"
