label: { en: "Ali's judgment on the men who fell into a lion pit in Yemen", ar: "قضاء علي في الأربعة الذين تدافعوا عند زبية الأسد" }
summary:
  en: "While Ali was in Yemen, four men fell one upon another into a pit dug for a lion; the lion killed them, and their kin took up arms. Ali ruled that the first gets a quarter of the blood-money, the second a third, the third a half and the fourth the full diyya, and sent the parties to the Prophet when they refused."
  ar: "بينما كان علي في اليمن، سقط أربعة رجال في زبية حفرها قوم للأسد فتعلق بعضهم ببعض، فجرحهم الأسد وماتوا، فأخرج أولياؤهم السلاح؛ فقضى علي بأن للأول ربع الدية، وللثاني ثلثها، وللثالث نصفها، وللرابع الدية كاملة، فأبوا أن يرضوا، فأُحيلت الخصومة إلى النبي."
