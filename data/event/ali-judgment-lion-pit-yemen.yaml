label: { en: "Ali's judgment on the men who fell into a lion pit in Yemen", ar: "قضاء علي في الأربعة الذين تدافعوا عند زبية الأسد", es: "El juicio de Ali sobre los hombres que cayeron en una fosa de leones en Yemen.", fr: "Le jugement d'Ali sur les hommes tombés dans une fosse aux lions au Yémen", ur: "یمن میں شیر کے گڑھے میں گرنے والے مردوں پر علی کا فیصلہ", tr: "Ali, aslan ininde birbirleriyle itişen dört kişiyi öldürdü.", id: "Ali membunuh keempat orang yang berdesakan di sarang singa." }
summary:
  en: "While Ali was in Yemen, four men fell one upon another into a pit dug for a lion; the lion killed them, and their kin took up arms. Ali ruled that the first gets a quarter of the blood-money, the second a third, the third a half and the fourth the full diyya, and sent the parties to the Prophet when they refused."
  ar: "بينما كان علي في اليمن، سقط أربعة رجال في زبية حفرها قوم للأسد فتعلق بعضهم ببعض، فجرحهم الأسد وماتوا، فأخرج أولياؤهم السلاح؛ فقضى علي بأن للأول ربع الدية، وللثاني ثلثها، وللثالث نصفها، وللرابع الدية كاملة، فأبوا أن يرضوا، فأُحيلت الخصومة إلى النبي."
  es: "Mientras Ali se encontraba en Yemen, cuatro hombres cayeron uno encima del otro en una fosa cavada para un león; el león los mató y sus parientes tomaron las armas. Ali dictaminó que el primero recibiría una cuarta parte de la indemnización por la muerte, el segundo un tercio, el tercero la mitad y el cuarto la diyya completa, y envió a los implicados ante el Profeta cuando se negaron."
  fr: "Alors qu'Ali se trouvait au Yémen, quatre hommes tombèrent les uns sur les autres dans une fosse creusée pour un lion; le lion les tua, et leurs proches prirent les armes. Ali décida que le premier recevrait un quart du prix du sang, le deuxième un tiers, le troisième la moitié et le quatrième la diyya entière, et il les envoya auprès du Prophète lorsqu'ils refusèrent."
  ur: "جب علی یمن میں تھے، چار آدمی شیر کے لیے کھودے گئے گڑھے میں ایک دوسرے پر گرے۔ شیر نے انہیں مار ڈالا، اور ان کے رشتہ داروں نے ہتھیار اٹھا لیے۔ علی نے حکم دیا کہ پہلے کو چوتھائی خون، دوسرے کو تہائی، تیسرے کو ڈیڑھ اور چوتھے کو پورا دیا جائے، اور فریقین کو نبی کے پاس بھیج دیا جب انہوں نے انکار کر دیا۔"
  tr: "Ali Yemen'deyken, bazı kişilerin aslan için kazdığı bir çukura dört adam düştü. Birbirlerine tutundular ve aslan onları yaralayarak öldürdü. Akrabaları silahlarını çıkardı ve Ali, birincisinin kan parasının dörtte birini, ikincisinin üçte birini, üçüncüsünün yarısını ve dördüncüsünün de tamamını alması gerektiğine hükmetti. Ancak onlar bu karardan memnun olmadılar, bu yüzden anlaşmazlık Peygamber'e havale edildi."
  id: "Ketika Ali berada di Yaman, empat orang jatuh ke dalam lubang yang digali beberapa orang untuk seekor singa. Mereka saling berpegangan, dan singa itu melukai mereka sehingga mereka meninggal. Kerabat mereka mengeluarkan senjata, dan Ali memutuskan bahwa yang pertama akan menerima seperempat dari uang darah, yang kedua sepertiga, yang ketiga setengah, dan yang keempat seluruh uang darah. Tetapi mereka menolak untuk puas, sehingga perselisihan itu dirujuk kepada Nabi."
