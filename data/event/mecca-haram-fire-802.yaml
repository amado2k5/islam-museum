summary:
  ar: "في آخر شوال سنة اثنتين وثمانمائة وقع بالحرم المكي حريق عظيم أتى على نحو ثلثه، واحترق من العمد الرخام مائة وثلاثون عموداً صارت كلساً، والذي احترق من باب العمرة إلى باب الحزورة {cite:shadharat-dhahab p. 21}."
  en: "Late Shawwal 802 — a great fire took a third of the Sacred Mosque; a hundred and thirty marble columns burned to lime {cite:shadharat-dhahab p. 21}."
  es: "A finales de Shawwal 802, un gran incendio arrasó un tercio de la Mezquita Sagrada; ciento treinta columnas de mármol quedaron reducidas a cal {cite:shadharat-dhahab p. 21}."
  fr: "Fin Shawwal 802 — un grand incendie ravagea un tiers de la Mosquée sacrée; cent trente colonnes de marbre furent réduites en cendres {cite: shadharat-dhahab p. 21}."
  ur: "شوال کے اواخر میں 802 - ایک زبردست آگ نے مسجد حرام کا ایک تہائی حصہ اپنی لپیٹ میں لے لیا۔ سنگ مرمر کے ایک سو تیس کالم چونے کے لیے جل گئے۔ 21}۔"
  tr: "802 yılının Şevval ayının sonunda Mekke Mescidi'nde büyük bir yangın çıktı ve mescidin yaklaşık üçte biri yandı. Yüz otuz mermer sütun yanarak kirece dönüştü. Yanan alan Umre Kapısı'ndan Hazura Kapısı'na kadar uzanıyordu. {cite:shadharat-dhahab s. 21}"
  id: "Pada akhir bulan Syawal tahun 802, kebakaran besar terjadi di Masjidil Haram Mekah, yang menghanguskan sekitar sepertiganya. Seratus tiga puluh pilar marmer terbakar dan berubah menjadi kapur. Area yang terbakar adalah dari Gerbang Umrah hingga Gerbang Hazura. {cite:shadharat-dhahab p. 21}"
