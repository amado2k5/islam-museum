id: event/ibrahim-visits-ismail-in-mecca
class: event
kind: other
label: { ar: "رحلات إبراهيم إلى مكة", en: "Ibrahim's journeys to Mecca", es: "Los viajes de Ibrahim a La Meca", fr: "Les voyages d'Ibrahim à La Mecque", ur: "ابراہیم کا مکہ کا سفر", tr: "İbrahim'in Mekke'ye yolculukları", id: "Perjalanan Ibrahim ke Mekah" }
summary:
  ar: "كان إبراهيم يرحل إلى مكة بين آونة وأخرى ليطالع تركته، ولا يُعلم عدد رحلاته، إلا أن المصادر حفظت أربعاً: رحلة الرؤيا وفداء إسماعيل، وثلاثاً يرويها البخاري عن ابن عباس: وجد في الأولى امرأة إسماعيل تشكو فأوصى بتغيير العتبة، وفي الثانية امرأته الثانية تثني فأوصى بتثبيتها، وفي الثالثة لقي إسماعيل فبنيا الكعبة وأذّن في الناس بالحج."
  en: "Ibrahim travelled to Mecca from time to time to see what he had left there; the number is unknown but the sources preserve four journeys: the dream and the ransom of Ismail, and three narrated by al-Bukhari from Ibn Abbas: finding Ismail's first wife complaining (change the threshold), his second wife grateful (keep the threshold), and finally meeting Ismail, when together they raised the Kaaba and Ibrahim proclaimed the pilgrimage."
  es: "Ibrahim viajaba a La Meca de vez en cuando para ver lo que había dejado allí; se desconoce el número, pero las fuentes conservan cuatro viajes: el sueño y el rescate de Ismail, y tres narrados por al-Bukhari de Ibn Abbas: encontrar a la primera esposa de Ismail quejándose (cambiar el umbral), a su segunda esposa agradecida (mantener el umbral), y finalmente encontrarse con Ismail, cuando juntos levantaron la Kaaba e Ibrahim proclamó la peregrinación."
  fr: "Ibrahim se rendait de temps à autre à La Mecque pour voir ce qu'il y avait laissé; le nombre de ses voyages est inconnu, mais les sources conservent quatre récits: le rêve et la rançon d'Ismaïl, et trois autres rapportés par al-Bukhari d'après Ibn Abbas: la découverte de la première femme d'Ismaïl se plaignant (modifier le seuil), sa seconde femme reconnaissante (maintenir le seuil), et enfin la rencontre avec Ismaïl, lors de laquelle ils érigèrent ensemble la Kaaba et Ibrahim proclama le pèlerinage."
  ur: "ابراہیم نے وقتاً فوقتاً مکہ کا سفر کیا تاکہ یہ دیکھ سکیں کہ اس نے وہاں کیا چھوڑا ہے۔ تعداد معلوم نہیں ہے لیکن ذرائع نے چار سفر محفوظ کیے ہیں: اسماعیل کا خواب اور فدیہ، اور تین کو بخاری نے ابن عباس سے روایت کیا ہے: اسماعیل کی پہلی بیوی کو شکایت کرتے ہوئے پانا ⁦(دہلی کو تبدیل کرنا)⁩، اس کی دوسری بیوی کا شکر گزار ہونا ⁦(دہلی کو برقرار رکھنا)⁩، اور آخر میں اسماعیل سے ملاقات، جب انہوں نے مل کر کعبہ اور ابراہیم کی زیارت کی۔"
  tr: "İbrahim, mirasını incelemek için zaman zaman Mekke'ye giderdi. Yolculuklarının sayısı bilinmemekle birlikte, kaynaklarda dört yolculuk kaydedilmiştir: İsmail'in vahyedilmesi ve kurtarılması yolculuğu ve İbn Abbas'tan rivayet edilen Buhari'nin anlattığı üç yolculuk: Birincisinde, İsmail'in karısının şikayet ettiğini görünce eşiğin değiştirilmesini emretti; ikincisinde, ikinci karısı onu övdüğü için eşiğin düzeltilmesini emretti; üçüncüsünde ise İsmail ile karşılaştı, birlikte Kâbe'yi inşa ettiler ve insanları Hacca çağırdı."
  id: "Ibrahim biasa melakukan perjalanan ke Mekah dari waktu ke waktu untuk meneliti warisannya. Jumlah perjalanannya tidak diketahui, tetapi beberapa sumber mencatat empat perjalanan: perjalanan penglihatan dan penyelamatan Ismail, dan tiga perjalanan yang diriwayatkan oleh Al-Bukhari dari Ibnu Abbas: pada perjalanan pertama, ia mendapati istri Ismail mengeluh, sehingga ia memerintahkan agar ambang pintu diubah; pada perjalanan kedua, istri keduanya memujinya, sehingga ia memerintahkan agar ambang pintu diperbaiki; dan pada perjalanan ketiga, ia bertemu Ismail, sehingga mereka membangun Ka'bah, dan ia menyeru orang-orang untuk menunaikan ibadah haji."
