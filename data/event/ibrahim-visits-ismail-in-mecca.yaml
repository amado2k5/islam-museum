label: { ar: "رحلات إبراهيم إلى مكة", en: "Ibrahim's journeys to Mecca" }
summary:
  ar: "كان إبراهيم يرحل إلى مكة بين آونة وأخرى ليطالع تركته، ولا يُعلم عدد رحلاته، إلا أن المصادر حفظت أربعاً: رحلة الرؤيا وفداء إسماعيل، وثلاثاً يرويها البخاري عن ابن عباس: وجد في الأولى امرأة إسماعيل تشكو فأوصى بتغيير العتبة، وفي الثانية امرأته الثانية تثني فأوصى بتثبيتها، وفي الثالثة لقي إسماعيل فبنيا الكعبة وأذّن في الناس بالحج."
  en: "Ibrahim travelled to Mecca from time to time to see what he had left there; the number is unknown but the sources preserve four journeys: the dream and the ransom of Ismail, and three narrated by al-Bukhari from Ibn Abbas: finding Ismail's first wife complaining (change the threshold), his second wife grateful (keep the threshold), and finally meeting Ismail, when together they raised the Kaaba and Ibrahim proclaimed the pilgrimage."
