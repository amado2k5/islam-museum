kids:
  ar: "كان إبراهيم يسافر بعيدًا ليزور ابنه إسماعيل في مكة. تحفظ الكتب أربع رحلات خاصة، وفي إحداها بنيا الكعبة معًا وندّها بالناس للحج."
  en: "Ibrahim used to travel far to visit his son Ismail in Mecca. The books tell of four special journeys — including the one where they built the Kaaba together and called people to Hajj."
  ur: "ابراہیم اپنے بیٹے اسماعیل سے ملنے کے لیے دور دراز سفر کرتے تھے۔ کتابوں میں چار خاص سفروں کا ذکر ہے — جن میں ایک میں انہوں نے مل کر کعبہ بنایا اور لوگوں کو حج کی دعوت دی۔"
