label: { en: "The delegation of Najran", ar: "وفد نجران", es: "La delegación de Najrán", fr: "La délégation de Najran", ur: "نجران کا وفد", tr: "Najran heyeti", id: "Delegasi Najran" }
summary:
  en: "Sixty riders of Christian Najran came to Medina in 9 AH led by the Aqib, the Sayyid and Bishop Abu Haritha; when they declined Islam the Prophet offered the mutual invocation of God's curse (mubahala) with Fatima, al-Hasan and al-Husayn, they asked instead for terms, and a treaty granted them God's protection in exchange for two thousand garments a year."
  ar: "قدم ستون راكباً من نصارى نجران المدينة سنة 9هـ يقودهم العاقب والسيد والأسقف أبو حارثة، فلما أبوا الإسلام دعاهم النبي إلى المباهلة وأقبل بفاطمة والحسن والحسين فطلبوا الصلح، فصالحهم على ألفي حلة في السنة وذمة الله ورسوله وحريتهم في دينهم. وعند البلاذري في بيان الشروط: ألف حلة في صفر وألف حلة في رجب ثمن كل حلة أوقية — والأوقية أربعون درهماً — ومن أدى أكثر من الأوقية حُسب له الفضل ومن أدى أقل أُخذ منه النقصان، ويُقبل ما أدوه من سلاح وخيل وركاب وعروض بقيمته قصاصاً من الحلل، ويضيفون رسل النبي شهراً فما دونه ولا يحبسونهم فوقه، وعليهم عارية ثلاثين درعاً وثلاثين فرساً وثلاثين بعيراً إن كان باليمن كيد — وما هلك منها فالرسل ضامنون له حتى يؤدوه — ولهم ذمة الله وعهد محمد النبي على أنفسهم وملتهم وأرضهم وأموالهم وغائبهم وشاهدهم، لا يُفتنون عن دينهم ومراتبهم فيه ولا يُحشرون ولا يُعشرون ولا يطأ أرضهم جيش، ومن أكل منهم رباً فذمة النبي منه بريئة، وشهد على الكتاب أبو سفيان بن حرب وغيلان بن عمرو ومالك بن عوف من بني نصر والأقرع بن حابس الحنظلي والمغيرة، وكتبه علي في رواية يحيى بن آدم الذي رأى نسخة بأيدي النجرانيين شبيهة بهذه ⁦(ص 85–88)⁩."
  es: "Sesenta jinetes cristianos de Najrán llegaron a Medina en el año 9 de la Hégira, liderados por el Aqib, el Sayyid y el obispo Abu Haritha; cuando rechazaron el Islam, el Profeta les ofreció la invocación mutua de la maldición de Dios (mubahala) con Fátima, al-Hasan y al-Husayn, pero ellos pidieron en cambio condiciones, y un tratado les otorgó la protección de Dios a cambio de dos mil prendas al año."
  fr: "Soixante cavaliers chrétiens de Najran arrivèrent à Médine en l'an 9 de l'Hégire, menés par Aqib, Sayyid et l'évêque Abu Haritha; lorsqu'ils refusèrent l'islam, le Prophète proposa l'invocation mutuelle de la malédiction de Dieu (mubahala) avec Fatima, al-Hasan et al-Husayn; ils demandèrent plutôt des conditions, et un traité leur accorda la protection de Dieu en échange de deux mille vêtements par an."
  ur: "عیسائی نجران کے ساٹھ سوار 9 ہجری میں عاقب، سید اور بشپ ابو حارثہ کی قیادت میں مدینہ آئے۔ جب انہوں نے اسلام سے انکار کیا تو رسول اللہ نے فاطمہ، حسن اور حسین م کے ساتھ مل کر خدا کی لعنت ⁦(مباہلہ)⁩ کی پیشکش کی، انہوں نے اس کے بجائے شرائط طلب کیں، اور ایک معاہدے کے تحت انہیں سالانہ دو ہزار کپڑوں کے بدلے خدا کی حفاظت فراہم کی گئی۔"
  tr: "Hicri 9. yılda, Nacranlı Hristiyanlardan altmış süvari, önderliğinde El-Akib, El-Seyyid ve Piskopos Ebu Haritha ile birlikte Medine'ye geldi. İslam'ı reddettiklerinde, Peygamber onları Mubahala'ya davet etti ve Fatıma, El-Hasan ve El-Hüseyin ile birlikte geldi. Barış istediler, bunun üzerine Peygamber, yılda iki bin elbise, Allah'ın ve Resulünün koruması ve dinlerinde özgürlük şartıyla onlarla barıştı. El-Baladhuri, şartları açıklarken şöyle der: Safer ayında bin elbise ve Receb ayında bin elbise; her elbisenin fiyatı bir ons (yaklaşık 40 dirhem) olup, bir ons'tan fazla veren fazlalığı alacak, daha az verenden ise eksik olanı alınacaktır. Silah, at, binek hayvanı ve mal olarak verdikleri şeyler, elbiselerin karşılığı olarak değerleri üzerinden kabul edilecektir. Peygamberin elçilerini bir ay veya daha kısa süreyle misafir edecekler ve daha uzun süre alıkoymayacaklardır. Yemen'de herhangi bir ihanet olması durumunda otuz zırh, otuz at ve otuz deve ödünç vermekle yükümlüdürler; kaybolan her şeyden elçiler, geri dönene kadar sorumludurlar. Allah'ın koruması ve Peygamber Muhammed'in ahdi kendileri, dinleri, toprakları, malları, mevcut olanlar ve olmayanlar üzerindedir. Dinleri veya din içindeki konumları nedeniyle zulüm görmeyecekler, askere alınmayacaklar, vergilendirilmeyecekler ve hiçbir ordu topraklarına ayak basmayacaktır. Onlardan kim faiz alırsa, Peygamberin ahdi ondan muaftır. Belgeye Ebu Sufyan ibn Harb, Gaylan ibn Amr, Beni Nasr'dan Malik ibn Awf, el-Aqra' ibn Habis el-Hanzali ve el-Muğire şahitlik etmiştir. Ali, Yahya bin Adam'ın rivayetinde, buna benzer bir nüshayı Necranlıların elinde gördüğünü belirterek bunu yazmıştır (s. 85-88)."
  id: "Enam puluh penunggang kuda dari kaum Kristen Najran datang ke Madinah pada tahun 9 Hijriah, dipimpin oleh Al-Aqib, Al-Sayyid, dan Uskup Abu Haritha. Ketika mereka menolak Islam, Nabi mengundang mereka ke Mubahala dan datang bersama Fatimah, Al-Hasan, dan Al-Hussein. Mereka meminta perdamaian, maka beliau berdamai dengan mereka dengan syarat dua ribu jubah per tahun, perlindungan Allah dan Rasul-Nya, dan kebebasan mereka dalam beragama. Al-Baladhuri, dalam menjelaskan syarat-syarat tersebut, menyatakan: Seribu jubah di bulan Safar dan seribu jubah di bulan Rajab, harga setiap jubah adalah satu ons—dan satu ons adalah empat puluh dirham—siapa pun yang memberi lebih dari satu ons akan diberikan kelebihannya, dan siapa pun yang memberi kurang akan diambil kekurangannya. Apa pun yang mereka berikan berupa senjata, kuda, tunggangan, dan barang-barang akan diterima sesuai nilainya sebagai kompensasi untuk jubah tersebut. Mereka akan menjamu para utusan Nabi selama satu bulan atau kurang dan tidak menahan mereka lebih lama. Mereka berkewajiban meminjamkan tiga puluh baju zirah, tiga puluh kuda, dan tiga puluh unta jika terjadi pengkhianatan di Yaman—dan apa pun yang hilang, para utusan bertanggung jawab atasnya sampai mereka dikembalikan. Mereka mendapat perlindungan Allah dan perjanjian Nabi Muhammad atas diri mereka sendiri, agama mereka, tanah mereka, harta mereka, orang-orang yang hadir dan yang tidak hadir. Mereka tidak akan dianiaya karena agama mereka atau kedudukan mereka di dalamnya, mereka tidak akan dipaksa ikut wajib militer, mereka tidak akan dikenai pajak, dan tidak ada tentara yang akan menginjak tanah mereka. Siapa pun di antara mereka yang memakan riba, perjanjian Nabi akan terbebas darinya. Dokumen ini disaksikan oleh Abu Sufyan ibn Harb, Ghaylan ibn Amr, Malik ibn Awf dari Banu Nasr, al-Aqra' ibn Habis al-Hanzali, dan al-Mughirah. Hal ini ditulis oleh Ali dalam Kisah Yahya bin Adam, yang melihat salinan di tangan kaum Najrani yang serupa dengan ini (hlm. 85–88)."
