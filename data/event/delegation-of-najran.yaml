label: { en: "The delegation of Najran", ar: "وفد نجران" }
summary:
  en: "Sixty riders of Christian Najran came to Medina in 9 AH led by the Aqib, the Sayyid and Bishop Abu Haritha; when they declined Islam the Prophet offered the mutual invocation of God's curse (mubahala) with Fatima, al-Hasan and al-Husayn, they asked instead for terms, and a treaty granted them God's protection in exchange for two thousand garments a year."
  ar: "قدم ستون راكباً من نصارى نجران المدينة سنة 9هـ يقودهم العاقب والسيد والأسقف أبو حارثة، فلما أبوا الإسلام دعاهم النبي إلى المباهلة وأقبل بفاطمة والحسن والحسين فطلبوا الصلح، فصالحهم على ألفي حلة في السنة وذمة الله ورسوله وحريتهم في دينهم. وعند البلاذري في بيان الشروط: ألف حلة في صفر وألف حلة في رجب ثمن كل حلة أوقية — والأوقية أربعون درهماً — ومن أدى أكثر من الأوقية حُسب له الفضل ومن أدى أقل أُخذ منه النقصان، ويُقبل ما أدوه من سلاح وخيل وركاب وعروض بقيمته قصاصاً من الحلل، ويضيفون رسل النبي شهراً فما دونه ولا يحبسونهم فوقه، وعليهم عارية ثلاثين درعاً وثلاثين فرساً وثلاثين بعيراً إن كان باليمن كيد — وما هلك منها فالرسل ضامنون له حتى يؤدوه — ولهم ذمة الله وعهد محمد النبي على أنفسهم وملتهم وأرضهم وأموالهم وغائبهم وشاهدهم، لا يُفتنون عن دينهم ومراتبهم فيه ولا يُحشرون ولا يُعشرون ولا يطأ أرضهم جيش، ومن أكل منهم رباً فذمة النبي منه بريئة، وشهد على الكتاب أبو سفيان بن حرب وغيلان بن عمرو ومالك بن عوف من بني نصر والأقرع بن حابس الحنظلي والمغيرة، وكتبه علي في رواية يحيى بن آدم الذي رأى نسخة بأيدي النجرانيين شبيهة بهذه (ص 85–88)."
