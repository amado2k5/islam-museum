id: event/woman-and-the-blood-at-the-kaaba-door
class: event
kind: other
label:
  ar: المرأة والدماء عند باب الكعبة
  en: The woman and the blood at the Kaaba door
  ur: عورت اور کعبہ کے دروازے پر خون کا واقعہ
summary:
  ar: 'امرأة استفتت ابن عمر: أقبلت أطوف بالبيت فهرقت الدماء عند باب المسجد ثلاث مرات؛ فقال ابن عمر: إنما ذلك ركضة من الشيطان، فاغتسلي ثم استثفري بثوب ثم طوفي {cite:muwatta-maruf-1997} [[passage/muwatta-6-1085|الموطأ
    1085]].'
  en: 'A woman consulted Ibn Umar: I came to circle the House but spilled blood at the mosque door three times; Ibn Umar said: that is only a strike from the shaytan — wash, seek refuge with a garment,
    then circle {cite:muwatta-maruf-1997} [[passage/muwatta-6-1085|Muwatta 1085]].'
  ur: 'ایک عورت نے ابن عمر سے استفتا کیا: میں بیت کے طواف کے لیے آئی تو مسجد کے دروازے پر تین بار خون بہہ گیا؛ ابن عمر نے کہا: یہ صرف شیطان کی ایک ضرب ہے — غسل کرو، کپڑے سے استعثار کرو، پھر طواف کرو {cite:muwatta-maruf-1997}
    [[passage/muwatta-6-1085|موطأ 1085]]۔'
