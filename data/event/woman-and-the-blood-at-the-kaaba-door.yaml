id: event/woman-and-the-blood-at-the-kaaba-door
class: event
kind: other
label:
  ar: المرأة والدماء عند باب الكعبة
  en: The woman and the blood at the Kaaba door
  ur: عورت اور کعبہ کے دروازے پر خون کا واقعہ
  es: "La mujer y la sangre en la puerta de la Kaaba"
  fr: "La femme et le sang à la porte de la Kaaba"
  tr: "Kabe'nin kapısındaki kadın ve kan."
  id: "Wanita dan darah di pintu Ka'bah"
summary:
  ar: 'امرأة استفتت ابن عمر: أقبلت أطوف بالبيت فهرقت الدماء عند باب المسجد ثلاث مرات؛ فقال ابن عمر: إنما ذلك ركضة من الشيطان، فاغتسلي ثم استثفري بثوب ثم طوفي {cite:muwatta-maruf-1997} [[passage/muwatta-6-1085|الموطأ
    1085]].'
  en: 'A woman consulted Ibn Umar: I came to circle the House but spilled blood at the mosque door three times; Ibn Umar said: that is only a strike from the shaytan — wash, seek refuge with a garment,
    then circle {cite:muwatta-maruf-1997} [[passage/muwatta-6-1085|Muwatta 1085]].'
  ur: 'ایک عورت نے ابن عمر سے استفتا کیا: میں بیت کے طواف کے لیے آئی تو مسجد کے دروازے پر تین بار خون بہہ گیا؛ ابن عمر نے کہا: یہ صرف شیطان کی ایک ضرب ہے — غسل کرو، کپڑے سے استعثار کرو، پھر طواف کرو {cite:muwatta-maruf-1997}
    [[passage/muwatta-6-1085|موطأ 1085]]۔'
  es: "Una mujer consultó a Ibn Umar: Vine a dar vueltas alrededor de la Casa, pero derramé sangre en la puerta de la mezquita tres veces; Ibn Umar dijo: eso es solo un ataque de shaytan; lávate, busca refugio con una prenda y luego da vueltas {cite:muwatta-maruf-1997} [[passage/muwatta-6-1085|Muwatta 1085]]."
  fr: "Une femme consulta Ibn Umar: Je suis venue faire le tour de la Maison mais j'ai répandu du sang à la porte de la mosquée à trois reprises; Ibn Umar dit: ce n'est qu'une frappe du shaytan — lave-toi, cherche refuge avec un vêtement, puis fais le tour {cite:muwatta-maruf-1997} [[passage/muwatta-6-1085|Muwatta 1085]]."
  tr: "Bir kadın İbn Ömer'den fetva istedi: Kâbe'yi tavaf etmeye geldim ve mescidin kapısında üç defa kan aktı. İbn Ömer şöyle dedi: Bu şeytanın tekmesiydi, önce yıkan, sonra bir bezle emdir, sonra tavaf et. {cite:muwatta-maruf-1997} [[passage/muwatta-6-1085|Al-Muwatta 1085]]."
  id: "Seorang wanita meminta fatwa kepada Ibnu Umar: Saya datang untuk melakukan tawaf di Ka'bah dan darah mengalir di pintu masjid tiga kali. Ibnu Umar berkata: Itu adalah tendangan dari Setan, maka mandilah, kemudian gunakan kain untuk menyerapnya, lalu lakukan tawaf. {cite:muwatta-maruf-1997} [[passage/muwatta-6-1085|Al-Muwatta 1085]]."
