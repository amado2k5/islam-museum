summary:
  ar: "بطاقة أولية لمعركة أسترآباد سنة ١٧٥٩م، نصر محمد حسن خان القاجري الذي مهد لقيام الدولة القاجارية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Astarabad in 1759, Muhammad Hasan Khan Qajar's victory that prepared the Qajar rise; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Batalla de Astarabad en 1759, la victoria de Muhammad Hasan Khan Qajar que preparó el ascenso de la dinastía Qajar; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de campagne pour la bataille d'Astarabad en 1759, la victoire de Muhammad Hasan Khan Qajar qui a préparé l'ascension des Qajar; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1759 میں استر آباد کی جنگ کا ڈرافٹ کارڈ، محمد حسن خان قاجار کی فتح جس نے قاجار کے عروج کو تیار کیا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1759 yılında gerçekleşen ve Muhammed Hasan Han Kaçar'ın zaferiyle sonuçlanan, Kaçar devletinin kurulmasına zemin hazırlayan Astarabad Muharebesi'ne dair ön bir anlatım; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Astarabad pada tahun 1759 M, kemenangan Muhammad Hassan Khan Qajar, yang membuka jalan bagi berdirinya negara Qajar; sumber-sumbernya belum ditinjau di halaman ini."
