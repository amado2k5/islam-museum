label: { ar: "يوم الكلاب الثاني — مسير بني الحرث بن كعب على تميم", en: "the second day of al-Kullāb — the eight thousand of Madhḥij broken by Tamīm", es: "el segundo día de al-Kullāb: los ocho mil de Madhḥij fueron quebrantados por Tamīm", fr: "le deuxième jour d'al-Kullāb — les huit mille Madhḥij brisés par Tamīm" }
date:
  start: { edtf: "0610~", calendar: julian, precision: century, status: tradition, derived: true, note: "جاهلي؛ التاريخ تقريبي عند أهل الأيام {cite:kamil-ibn-al-athir p. 468-471}." }
summary:
  ar: "بعد أن أُصفق على بني تميم باب المشقر حدّث رجل من بني قيس بن ثعلبة أخواله بني الحرث بن كعب بنجران أن المقاتلة قُتلت وبقيت الأموال والذراري بلا مانع، فاجتمعت بنو الحرث من مذحج مع أحلافها من نهد وجرم بن زبان في عسكر بلغ ثمانية آلاف — ولا يعلم في الجاهلية جيش أكثر منه إلا جيش كسرى بذي قار وجيش يوم جبلة — فحذرهم كاهنهم سلمة بن المغفل فعصوه. واجتمع ذوو الرأي من تميم إلى أكثم بن صيفي وله مائة وتسعون سنة، فأبى الرياسة وأشار أن ينزل حنظلة بن مالك الدهناء وينزل سعد بن زيد مناة والرباب الكلاب فأي الطريقين أخذ القوم كفى أحدهما صاحبه، ووصاهم ألا يحضروا النساء الصفوف وأن يقلوا الخلاف على أمرائهم وكثرة الصياح، فلقوا القوم بالكلاب فانهزمت مذحج وأسر عبد يغوث بن الحارث بن وقاص رئيسها فشدوا لسانه كي لا يهجوهم فقال شعره المشهور ثم قتل ولم يقبل له فدية {cite:kamil-ibn-al-athir p. 468-471}."
  en: "After the door was shut on Tamīm at al-Mushaqqar, a man of Qays ibn Thaʿlaba told his uncles Banū'l-Ḥārith ibn Kaʿb of Najrān that Tamīm's warriors lay dead and their wealth undefended. Banū'l-Ḥārith of Madhḥij mustered with their Nahd and Jarm allies — eight thousand, the largest host known in the Jāhiliyya save Khusraw's at Dhu Qār and the host of Jabala — and overrode their diviner Salama ibn al-Mughaffal's warning. Tamīm's elders put the choice to Aktham ibn Ṣayfī, then a hundred and ninety years old, who declined the chieftaincy but counseled splitting the defense at al-Dahnāʾ and al-Kullāb, keeping women from the ranks and voices low. The hosts met at al-Kullāb; Madhḥij broke, and their captive chief ʿAbd Yaghūth was killed after they bound his tongue — yet he still recited his famous verses. No ransom was taken {cite:kamil-ibn-al-athir p. 468-471}."
  es: "Tras el cierre de las puertas de Tamīm en al-Mushaqqar, un hombre de Qays ibn Thaʿlaba informó a sus tíos Banū'l-Ḥārith ibn Kaʿb de Najrān que los guerreros de Tamīm yacían muertos y sus riquezas desprotegidas. Banū'l-Ḥārith de Madhḥij reunió a sus aliados Nahd y Jarm —ocho mil hombres, el mayor ejército conocido en la época preislámica, salvo el de Khusraw en Dhu Qār y el de Jabala— e ignoró la advertencia de su adivino Salama ibn al-Mughaffal. Los ancianos de Tamīm sometieron la elección a Aktham ibn Ṣayfī, que entonces tenía ciento noventa años. Aktham rechazó el liderazgo, pero aconsejó dividir la defensa en al-Dahnāʾ y al-Kullāb, manteniendo a las mujeres alejadas de las filas y hablando en voz baja. Los ejércitos se reunieron en al-Kullāb; Madhḥij se rindió, y su jefe cautivo, ʿAbd Yaghūth, fue asesinado después de que le amordazaran la lengua; sin embargo, aún recitó sus famosos versos. No se pidió rescate {cite:kamil-ibn-al-athir p. 468-471}."
  fr: "Après la défaite de Tamīm à al-Mushaqqar, un homme de Qays ibn Thaʿlaba informa ses oncles, Banū'l-Ḥārith ibn Kaʿb de Najrān, que les guerriers de Tamīm gisaient morts et leurs richesses sans défense. Banū'l-Ḥārith de Madhḥij rassembla alors huit mille hommes avec ses alliés Nahd et Jarm, la plus grande armée connue de la Jāhiliyya après celle de Khusraw à Dhu Qār et celle de Jabala, passant outre l'avertissement de leur devin Salama ibn al-Mughaffal. Les anciens de Tamīm soumirent le choix à Aktham ibn Ṣayfī, alors âgé de cent quatre-vingt-dix ans, qui refusa la chefferie mais conseilla de diviser la défense à al-Dahnāʾ et al-Kullāb, en écartant les femmes des rangs et en chuchotant. Les troupes se rassemblèrent à al-Kullāb; Madhḥij céda et leur chef captif, ʿAbd Yaghūth, fut tué après qu'on lui eut bâillonné la langue; pourtant, il continua de réciter ses vers célèbres. Aucune rançon ne fut exigée (voir: Kamil ibn al-Athir, p. 468-471)."
