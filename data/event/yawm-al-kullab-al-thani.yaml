label: { ar: "يوم الكلاب الثاني — مسير بني الحرث بن كعب على تميم", en: "the second day of al-Kullāb — the eight thousand of Madhḥij broken by Tamīm", es: "el segundo día de al-Kullāb: los ocho mil de Madhḥij fueron quebrantados por Tamīm", fr: "le deuxième jour d'al-Kullāb — les huit mille Madhḥij brisés par Tamīm", ur: "الکلاب کا دوسرا دن - تمیم کے ذریعہ آٹھ ہزار مدحج کو توڑا گیا", tr: "Köpeklerin İkinci Günü — Beni el-Harith ibn Ka'b'ın Tamim'e Karşı Yürüyüşü", id: "Hari Kedua Anjing — Pawai Banu al-Harith ibn Ka'b melawan Tamim" }
date:
  start: { edtf: "0610~", calendar: julian, precision: century, status: tradition, derived: true, note: "جاهلي؛ التاريخ تقريبي عند أهل الأيام {cite:kamil-ibn-al-athir p. 468-471}." }
summary:
  ar: "بعد أن أُصفق على بني تميم باب المشقر حدّث رجل من بني قيس بن ثعلبة أخواله بني الحرث بن كعب بنجران أن المقاتلة قُتلت وبقيت الأموال والذراري بلا مانع، فاجتمعت بنو الحرث من مذحج مع أحلافها من نهد وجرم بن زبان في عسكر بلغ ثمانية آلاف — ولا يعلم في الجاهلية جيش أكثر منه إلا جيش كسرى بذي قار وجيش يوم جبلة — فحذرهم كاهنهم سلمة بن المغفل فعصوه. واجتمع ذوو الرأي من تميم إلى أكثم بن صيفي وله مائة وتسعون سنة، فأبى الرياسة وأشار أن ينزل حنظلة بن مالك الدهناء وينزل سعد بن زيد مناة والرباب الكلاب فأي الطريقين أخذ القوم كفى أحدهما صاحبه، ووصاهم ألا يحضروا النساء الصفوف وأن يقلوا الخلاف على أمرائهم وكثرة الصياح، فلقوا القوم بالكلاب فانهزمت مذحج وأسر عبد يغوث بن الحارث بن وقاص رئيسها فشدوا لسانه كي لا يهجوهم فقال شعره المشهور ثم قتل ولم يقبل له فدية {cite:kamil-ibn-al-athir p. 468-471}."
  en: "After the door was shut on Tamīm at al-Mushaqqar, a man of Qays ibn Thaʿlaba told his uncles Banū'l-Ḥārith ibn Kaʿb of Najrān that Tamīm's warriors lay dead and their wealth undefended. Banū'l-Ḥārith of Madhḥij mustered with their Nahd and Jarm allies — eight thousand, the largest host known in the Jāhiliyya save Khusraw's at Dhu Qār and the host of Jabala — and overrode their diviner Salama ibn al-Mughaffal's warning. Tamīm's elders put the choice to Aktham ibn Ṣayfī, then a hundred and ninety years old, who declined the chieftaincy but counseled splitting the defense at al-Dahnāʾ and al-Kullāb, keeping women from the ranks and voices low. The hosts met at al-Kullāb; Madhḥij broke, and their captive chief ʿAbd Yaghūth was killed after they bound his tongue — yet he still recited his famous verses. No ransom was taken {cite:kamil-ibn-al-athir p. 468-471}."
  es: "Tras el cierre de las puertas de Tamīm en al-Mushaqqar, un hombre de Qays ibn Thaʿlaba informó a sus tíos Banū'l-Ḥārith ibn Kaʿb de Najrān que los guerreros de Tamīm yacían muertos y sus riquezas desprotegidas. Banū'l-Ḥārith de Madhḥij reunió a sus aliados Nahd y Jarm —ocho mil hombres, el mayor ejército conocido en la época preislámica, salvo el de Khusraw en Dhu Qār y el de Jabala— e ignoró la advertencia de su adivino Salama ibn al-Mughaffal. Los ancianos de Tamīm sometieron la elección a Aktham ibn Ṣayfī, que entonces tenía ciento noventa años. Aktham rechazó el liderazgo, pero aconsejó dividir la defensa en al-Dahnāʾ y al-Kullāb, manteniendo a las mujeres alejadas de las filas y hablando en voz baja. Los ejércitos se reunieron en al-Kullāb; Madhḥij se rindió, y su jefe cautivo, ʿAbd Yaghūth, fue asesinado después de que le amordazaran la lengua; sin embargo, aún recitó sus famosos versos. No se pidió rescate {cite:kamil-ibn-al-athir p. 468-471}."
  fr: "Après la défaite de Tamīm à al-Mushaqqar, un homme de Qays ibn Thaʿlaba informa ses oncles, Banū'l-Ḥārith ibn Kaʿb de Najrān, que les guerriers de Tamīm gisaient morts et leurs richesses sans défense. Banū'l-Ḥārith de Madhḥij rassembla alors huit mille hommes avec ses alliés Nahd et Jarm, la plus grande armée connue de la Jāhiliyya après celle de Khusraw à Dhu Qār et celle de Jabala, passant outre l'avertissement de leur devin Salama ibn al-Mughaffal. Les anciens de Tamīm soumirent le choix à Aktham ibn Ṣayfī, alors âgé de cent quatre-vingt-dix ans, qui refusa la chefferie mais conseilla de diviser la défense à al-Dahnāʾ et al-Kullāb, en écartant les femmes des rangs et en chuchotant. Les troupes se rassemblèrent à al-Kullāb; Madhḥij céda et leur chef captif, ʿAbd Yaghūth, fut tué après qu'on lui eut bâillonné la langue; pourtant, il continua de réciter ses vers célèbres. Aucune rançon ne fut exigée (voir: Kamil ibn al-Athir, p. 468-471)."
  ur: "تمیم پر المشقر میں دروازہ بند ہونے کے بعد قیس بن ثعلبہ کے ایک شخص نے نجران کے اپنے چچا بنو الحارث بن کعب کو بتایا کہ تمیم کے جنگجو مر گئے اور ان کا مال محفوظ نہیں رہا۔ مدحج کے بنو الحرث نے اپنے نہد اور جرم کے اتحادیوں کے ساتھ جمع کیا - آٹھ ہزار، جو جاہلیت میں سب سے بڑے میزبان تھے جو ذوقار میں خسرو کے اور جبلہ کے میزبان کو چھوڑ کر جانا جاتا تھا - اور اپنے عالم سلمہ ابن المغفل کی تنبیہ کو مسترد کر دیا۔ تمیم کے بزرگوں نے ایک سو نوے سال کی عمر کے اکثم بن سیفی کے پاس انتخاب کا انتخاب کیا، جس نے سرداری سے انکار کر دیا لیکن الدحنا اور الکلاب میں دفاع کو تقسیم کرنے کا مشورہ دیا، عورتوں کو صفوں اور آوازوں کو پست رکھتے ہوئے میزبانوں کی ملاقات الکلاب میں ہوئی۔ مدحج ٹوٹ گیا، اور ان کے اسیر سردار عبد یغوث کو اس کی زبان باندھنے کے بعد قتل کر دیا گیا - پھر بھی وہ اپنی مشہور آیات کی تلاوت کرتا رہا۔ کوئی فدیہ نہیں لیا گیا {حوالہ: کامل ابن الاثیر صفحہ 468-471}۔"
  tr: "El-Muşakkar kapısı Beni Tamim'e kapandıktan sonra, Beni Kays bin Tha'labe'den bir adam, Najran'daki annesinin amcaları Beni El-Harith bin Ka'b'a savaşçıların öldürüldüğünü ve paranın ve çocukların korumasız kaldığını söyledi. Bunun üzerine Madhhij'den Beni El-Harith, Nahd ve Jurm bin Zaban'dan müttefikleriyle sekiz bin kişilik bir ordu topladı - İslam öncesi dönemde Kisra'nın Dhi Qar'daki ordusu ve Jabalah günü ordusu dışında bundan daha büyük bir ordu bilinmiyordu - bunun üzerine kahinleri Salamah bin Al-Mughaffal onları uyardı, ancak ona itaat etmediler. Tamim'in bilge adamları, yüz doksan yaşında olan Aktham bin Sayfi'nin yanına toplandılar. O, liderliği reddetti ve Hanzala bin Malik'in El-Dahna'ya, Saad bin Zaid Manat ve Al-Rabab'ın ise El-Kilab'a inmesini önerdi. Halkın seçtiği iki yoldan hangisi olursa olsun, biri diğerine yeterli olurdu. Onlara kadınları saflara almamalarını, liderleriyle olan anlaşmazlıklarını ve aşırı bağırmayı azaltmalarını tavsiye etti. Böylece El-Kilab'da halkla buluştular ve Madhhij yenildi, liderleri Abd Yaghuth bin Al-Harith bin Waqqas yakalandı. Onları alaya almaması için dilini bağladılar, o da meşhur şiirini okudu, sonra öldürüldü ve fidye kabul edilmedi. {Kaynak: Kamil İbn Al-Athir s. 468-471}"
  id: "Setelah gerbang Al-Mushaqqar ditutup bagi Bani Tamim, seorang pria dari Bani Qais bin Tha’labah memberi tahu paman-paman dari pihak ibunya, Bani Al-Harith bin Ka’b di Najran, bahwa para pejuang telah terbunuh dan harta benda serta anak-anak ditinggalkan tanpa perlindungan. Maka Bani Al-Harith dari Madhhij berkumpul dengan sekutu mereka dari Nahd dan Jurm bin Zaban dalam pasukan yang mencapai delapan ribu orang – dan tidak ada pasukan di era pra-Islam yang diketahui lebih besar dari itu kecuali pasukan Kisra di Dhi Qar dan pasukan pada zaman Jabalah – maka peramal mereka, Salamah bin Al-Mughaffal, memperingatkan mereka, tetapi mereka tidak menaatinya. Orang-orang bijak dari Tamim berkumpul kepada Aktham bin Sayfi, yang berusia seratus sembilan puluh tahun. Dia menolak kepemimpinan dan menyarankan agar Hanzala bin Malik turun ke Al-Dahna dan agar Saad bin Zaid Manat dan Al-Rabab turun ke Al-Kilab. Jalan mana pun yang dipilih orang-orang, salah satunya akan cukup untuk yang lain. Dia menasihati mereka untuk tidak membawa wanita ke barisan dan mengurangi perselisihan dengan pemimpin mereka serta teriakan yang berlebihan. Maka mereka bertemu dengan orang-orang di Al-Kilab, dan Madhhij dikalahkan, dan Abd Yaghuth bin Al-Harith bin Waqqas, pemimpin mereka, ditangkap. Mereka mengikat lidahnya agar dia tidak menyindir mereka, lalu dia membacakan puisinya yang terkenal, kemudian dia dibunuh dan tidak ada tebusan yang diterima untuknya. {cite:kamil-ibn-al-athir p. 468-471}."
