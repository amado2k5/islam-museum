label: { ar: "يوم الكلاب الثاني — مسير بني الحرث بن كعب على تميم", en: "the second day of al-Kullāb — the eight thousand of Madhḥij broken by Tamīm" }
date:
  start: { edtf: "0610~", calendar: julian, precision: century, status: tradition, derived: true, note: "جاهلي؛ التاريخ تقريبي عند أهل الأيام {cite:kamil-ibn-al-athir p. 468-471}." }
summary:
  ar: "بعد أن أُصفق على بني تميم باب المشقر حدّث رجل من بني قيس بن ثعلبة أخواله بني الحرث بن كعب بنجران أن المقاتلة قُتلت وبقيت الأموال والذراري بلا مانع، فاجتمعت بنو الحرث من مذحج مع أحلافها من نهد وجرم بن زبان في عسكر بلغ ثمانية آلاف — ولا يعلم في الجاهلية جيش أكثر منه إلا جيش كسرى بذي قار وجيش يوم جبلة — فحذرهم كاهنهم سلمة بن المغفل فعصوه. واجتمع ذوو الرأي من تميم إلى أكثم بن صيفي وله مائة وتسعون سنة، فأبى الرياسة وأشار أن ينزل حنظلة بن مالك الدهناء وينزل سعد بن زيد مناة والرباب الكلاب فأي الطريقين أخذ القوم كفى أحدهما صاحبه، ووصاهم ألا يحضروا النساء الصفوف وأن يقلوا الخلاف على أمرائهم وكثرة الصياح، فلقوا القوم بالكلاب فانهزمت مذحج وأسر عبد يغوث بن الحارث بن وقاص رئيسها فشدوا لسانه كي لا يهجوهم فقال شعره المشهور ثم قتل ولم يقبل له فدية {cite:kamil-ibn-al-athir p. 468-471}."
  en: "After the door was shut on Tamīm at al-Mushaqqar, a man of Qays ibn Thaʿlaba told his uncles Banū'l-Ḥārith ibn Kaʿb of Najrān that Tamīm's warriors lay dead and their wealth undefended. Banū'l-Ḥārith of Madhḥij mustered with their Nahd and Jarm allies — eight thousand, the largest host known in the Jāhiliyya save Khusraw's at Dhu Qār and the host of Jabala — and overrode their diviner Salama ibn al-Mughaffal's warning. Tamīm's elders put the choice to Aktham ibn Ṣayfī, then a hundred and ninety years old, who declined the chieftaincy but counseled splitting the defense at al-Dahnāʾ and al-Kullāb, keeping women from the ranks and voices low. The hosts met at al-Kullāb; Madhḥij broke, and their captive chief ʿAbd Yaghūth was killed after they bound his tongue — yet he still recited his famous verses. No ransom was taken {cite:kamil-ibn-al-athir p. 468-471}."
