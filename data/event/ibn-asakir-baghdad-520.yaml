label:
  ar: "ابن عساكر يرحل إلى بغداد مع أخيه ويقيم بها خمس سنين، ٥٢٠هـ/١١٢٦م"
  en: "Ibn 'Asakir travels to Baghdad with his brother and stays five years, 520/1126"
  ur: "ابن عساکر بھائی کے ہمراہ بغداد روانہ اور وہاں پانچ برس قیام، 520ھ/1126ء"
  es: "Ibn 'Asakir viaja a Bagdad con su hermano y permanece allí cinco años, 520/1126"
  fr: "Ibn 'Asakir se rend à Bagdad avec son frère et y séjourne cinq ans, 520/1126."
  tr: "İbn Asakir, kardeşiyle birlikte Bağdat'a seyahat etti ve orada beş yıl kaldı (Hicri 520/Miladi 1126)."
  id: "Ibn Asakir melakukan perjalanan ke Baghdad bersama saudaranya dan tinggal di sana selama lima tahun, 520 H/1126 M."
summary:
  ar: "دخل ابن عساكر بغداد سنة عشرين فأقام بها خمس سنين، وسمع من أبي القاسم بن الحصين وأبي الحسن الدينوري وأبي العز بن كادش وأبي غالب بن البنا وجماعة كثير، ولازم الدرس والتفقه بالنظامية {cite:tarikh-islam-dhahabi p. 71}؛ وذهب مع أخيه الصائن الذي واظب بالنظامية على دروس أسعد الميهني في الفقه وابن برهان تلميذ الغزالي، وسمع هو أيضاً الحنبلي سعد الخير الأنصاري وشيوخ البرمكي والتنوخي {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  en: "Ibn 'Asakir entered Baghdad in 520 and stayed five years, hearing Abu al-Qasim ibn al-Husayn, Abu al-Hasan al-Dinawari, Abu al-'Izz ibn Kadish, Abu Ghalib ibn al-Banna and many more, and keeping to the lectures and fiqh of the Nizamiyya {cite:tarikh-islam-dhahabi p. 71}. He went with his brother al-Sa'in, who attended Asad al-Mayhani's fiqh and Ibn Burhan's philosophy at the Nizamiyya, while 'Ali also heard the Hanbali Sa'd al-Khayr al-Ansari and the circles of al-Barmaki and al-Tanukhi {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  ur: "ابن عساکر 520ھ میں بغداد داخل ہوئے اور پانچ برس مقیم رہے؛ ابوالقاسم بن الحصین، ابوالحسن دینوری، ابوالعز بن کادش، ابوغالب بن بنا اور بہت سے محدثین سے سماعت کی اور نظامیہ کے دروس و فقہ سے لگے رہے {cite:tarikh-islam-dhahabi p. 71}؛ بھائی صائن نظامیہ میں اسد مہینی کے فقہ اور غزالی کے شاگرد ابن برہان کے دروس حاضر ہوتے، اور انہوں نے حنبلی سعد الخیر انصاری اور برمکی و تنوخی کے حلقوں سے بھی استفادہ کیا {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}۔"
  es: "Ibn 'Asakir entró en Bagdad en 520 y permaneció allí cinco años, escuchando a Abu al-Qasim ibn al-Husayn, Abu al-Hasan al-Dinawari, Abu al-'Izz ibn Kadish, Abu Ghalib ibn al-Banna y muchos más, y siguiendo las enseñanzas y el fiqh de la Nizamiyya {cite:tarikh-islam-dhahabi p. 71}. Fue con su hermano al-Sa'in, quien asistió al fiqh de Asad al-Mayhani y a la filosofía de Ibn Burhan en la Nizamiyya, mientras que 'Ali también escuchó al hanbalí Sa'd al-Khayr al-Ansari y a los círculos de al-Barmaki y al-Tanukhi {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  fr: "Ibn 'Asakir entra à Bagdad en 520 et y séjourna cinq ans, étudiant auprès d'Abu al-Qasim ibn al-Husayn, Abu al-Hasan al-Dinawari, Abu al-'Izz ibn Kadish, Abu Ghalib ibn al-Banna et de nombreux autres, et se conformant aux enseignements et au fiqh de la Nizamiyya (voir: Tarikh Islam Dhahabi, p. 71). Il accompagna son frère al-Sa'in, qui étudia le fiqh auprès d'Asad al-Mayhani et la philosophie auprès d'Ibn Burhan à la Nizamiyya, tandis qu'al-Ali suivit également les enseignements du maître hanbalite Sa'd al-Khayr al-Ansari et fréquenta les cercles d'al-Barmaki et d'al-Tanukhi (voir: Encyclopaedia of Islam, vol. 3, p. 746)."
  tr: "İbn Asakir, yirminci yılda Bağdat'a girdi ve beş yıl orada kaldı. Ebu el-Kâsım ibn el-Hüseyn, Ebu el-Hasan el-Dinawari, Ebu el-İzz ibn Kadiş, Ebu Ghalib ibn el-Benna ve daha birçok kişiden ilim öğrendi. Nizamiye Medresesi'nde derslere katıldı ve fıkıh eğitimi aldı. Nizamiye Medresesi'nde okuyan kardeşi el-Sa'in ile birlikte, fıkıh derslerinde As'ad el-Mihani'den ve Gazali'nin öğrencisi İbn Burhan'dan dersler aldı. Ayrıca Hanbeli âlim Sa'd el-Hayr el-Ensari'den ve el-Barmaki ile el-Tanukhi şeyhlerinden de ilim öğrendi."
  id: "Ibn Asakir memasuki Baghdad pada tahun 20 dan tinggal di sana selama lima tahun. Ia belajar dari Abu al-Qasim ibn al-Husayn, Abu al-Hasan al-Dinawari, Abu al-Izz ibn Kadish, Abu Ghalib ibn al-Banna, dan banyak lainnya. Ia mengikuti kelas dan mempelajari fiqih di Madrasah Nizamiyya {cite:tarikh-islam-dhahabi hlm. 71}. Ia pergi bersama saudaranya, al-Sa’in, yang juga bersekolah di Madrasah Nizamiyya, untuk mengikuti pelajaran fiqih dari As’ad al-Mihani dan Ibn Burhan, seorang murid al-Ghazali. Ia juga belajar dari ulama Hanbali Sa’d al-Khayr al-Ansari dan para syekh al-Barmaki dan al-Tanukhi {cite:encyclopaedia-of-islam-2 vol. 3 hlm. 746}."
