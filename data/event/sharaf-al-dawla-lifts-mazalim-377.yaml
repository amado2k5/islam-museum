label: { ar: "شرف الدولة يرفع المظالم عن العراق", en: "Sharaf al-Dawla lifts unjust levies from Iraq", es: "Sharaf al-Dawla levanta levantamientos injustos de Irak", fr: "Sharaf al-Dawla soulève des fonds injustes provenant d'Irak" }
summary:
  ar: "في سنة سبع وسبعين وثلاثمائة رفع شرف الدولة عن العراق مظالم كثيرة، فمن ذلك أنه ردّ على الشريف أبي الحسن محمد بن عمر جميع أملاكه وكان مغلّها في العام ألفي ألف وخمسمائة ألف درهم — وكان الغلاء ببغداد فوق الوصف {cite:shadharat-dhahab p. 88}."
  en: "In 377 Sharaf al-Dawla lifted many unjust levies from Iraq — among them returning all of al-Sharif Abu al-Hasan Muhammad b. Umar's estates yielding two and a half million dirhams a year — while Baghdad prices ran beyond description {cite:shadharat-dhahab p. 88}."
  es: "En 377, Sharaf al-Dawla rescató muchas vidas injustamente de Irak, entre ellas la devolución de todas las propiedades de al-Sharif Abu al-Hasan Muhammad b. Umar, que generaban dos millones y medio de dirhams al año, mientras que los precios en Bagdad eran indescriptibles {cite:shadharat-dhahab p. 88}."
  fr: "En 377, Sharaf al-Dawla a sauvé de nombreuses vies injustes d'Irak — parmi lesquelles il a restitué tous les domaines d'al-Sharif Abu al-Hasan Muhammad b. Umar rapportant deux millions et demi de dirhams par an — tandis que les prix à Bagdad étaient indescriptibles {cite:shadharat-dhahab p. 88}."
