  did_you_know:
    ar: "إثر هدنة الحديبية بعث النبي سفراء بكتاب مختوم بخاتم فضي «محمد رسول الله» إلى كسرى وقيصر والنجاشي والمقوقس وعمالقة العرب بالبحرين واليمامة وعُمان."
    en: "After the Hudaybiyya truce the Prophet sent envoys bearing a letter sealed 'Muhammad, Messenger of God' to Khosrow, Caesar, the Negus, the Muqawqis, and the Arab chiefs of Bahrayn, Yamama and Oman."
    ur: "حدیبیہ کی صلح کے بعد نبی نے «محمد رسول اللہ» مہر والے خطوط سفیروں کے ذریعے کسریٰ، قیصر، نجاشی، مقوقس اور بحرین، یمامہ اور عمان کے عرب سرداروں کو بھیجے۔"
