id: event/letters-to-rulers-and-kings
class: event
kind: other
label: { en: "The Letters to Rulers and Kings", ar: "مكاتبة الملوك والأمراء" }
summary:
  en: "In late 6 AH (early 628 CE) following the Hudaybiyya truce, the Prophet initiated an international diplomatic initiative, sending envoys with silver-sealed letters to the major emperors, kings, and regional chiefs of the surrounding world: the Negus of Abyssinia, the Muqawqis of Egypt, Chosroes of Persia, Heraclius of Byzantium, al-Mundhir ibn Sawa of Bahrain, Hawdha ibn Ali of al-Yamama, al-Harith al-Ghassani of Damascus, and the rulers of Oman."
  ar: "في أواخر السنة السادسة للهجرة إثر هدنة الحديبية، اصطفى النبي عدداً من أصحابه سفراء بكتاب مختوم بخاتم فضي نقشه «محمد رسول الله» إلى أباطرة وملوك وأمراء العالم المعاصر: كسرى ملك فارس، وهرقل قيصر الروم، والنجاشي ملك الحبشة، والمقوقس عظيم القبط بمصر، والمنذر بن ساوى في البحرين، وهوذة بن علي باليمامة، والحارث الغساني بدمشق، وجيفر وعبد ابني الجلندي في عُمان.، وعند البلاذري بعث حاطب بن أبي بلتعة إلى المقوقس وشجاع بن وهب الأسدي إلى الحارث بن أبي شمر ودحية بن خليفة الكلبي إلى قيصر وسليط بن عمرو العامري إلى هوذة بن علي الحنفي وعبد الله بن حذافة السهمي إلى كسرى وعمرو بن أمية الضمري إلى النجاشي، وذلك في سنة سبع وهو أثبت من قول من قال في سنة ست {cite:ansab-al-ashraf p. 531}"
