id: "event/ibrahim-al-jumahi-and-ibn-al-lahhaz-enter-the-darb-gate-on-a-pretext-of-peace-295"
class: event
kind: other
label:
  ar: "إبراهيم الجمدي وابن اللحاظ يدخلان باب الدرب بحجة الصلح ويطلبان خلوة، 295هـ"
  en: "Ibrahim al-Jumahi and Ibn al-Lahhaz enter the Darb gate on a pretext of peace and ask for a private talk, 295 AH, pp. 370-371"
  ur: "ابراہیم الجمدی اور ابن اللحاظ صلح کے بہانے درب دروازے سے داخل ہوتے ہیں اور خلوت مانگتے ہیں، 295ھ، ص370-371"
  es: "Ibrahim al-Jumahi e Ibn al-Lahhaz entran por la puerta de Darb con el pretexto de la paz y solicitan una conversación privada, 295 AH, pp. 370-371"
  fr: "Ibrahim al-Jumahi et Ibn al-Lahhaz entrent par la porte de Darb sous prétexte de paix et demandent un entretien privé, 295 AH, pp. 370-371"
  tr: "İbrahim el-Cemdi ve İbn el-Lahaz, uzlaşma bahanesiyle Bab el-Darb'a girer ve tecrit edilmeyi talep eder, Hicri 295"
  id: "Ibrahim al-Jamdi dan Ibn al-Lahaz memasuki Bab al-Darb dengan dalih rekonsiliasi dan meminta pengasingan, 295 H."
summary:
  ar: "دخل إبراهيم الجمدي ومحمد بن اللحاظ باب الدرب بحجة الصلح والعافية، وطلبا خلوة مع أبي جعفر، فأمر الناس بالانصراف، فبقيا عنده طويلاً ليفترق الناس من مواضعهم، ويدخل كمين بني الحارث والناس في غفلة. ثم خرج رجلان في عجلة ولم يسلم أحدهما على أبي جعفر."
  en: "Ibrahim al-Jumahi and Muhammad ibn al-Lahhaz entered the Darb gate on a pretext of peace and safety and asked Abu Ja'far for a private talk. He ordered the people to withdraw, and the two stayed with him a long time so that the crowd would leave its posts and the Banu al-Harith ambush could enter while the people were unaware. Then a Rabi'i rider came in at speed without greeting Abu Ja'far, and the two men rode off."
  ur: "ابراہیم الجمدی اور محمد بن اللحاظ صلح اور امن کا بہانہ کر کے درب دروازے سے داخل ہوئے اور ابو جعفر سے خلوت میں بات کرنے کی درخواست کی۔ اس نے لوگوں کو ہٹنے کا حکم دیا، اور یہ دونوں دیر تک اس کے پاس رہے تاکہ لوگ اپنی جگہوں سے ہٹ جائیں اور بنو حارث کی گھات غفلت میں اندر آ جائے۔ پھر بنو ربیعہ کا ایک سوار تیزی سے آیا، ابو جعفر کو سلام کیے بغیر گزرا، اور وہ دونوں گھوڑوں پر نکل گئے۔"
  es: "Ibrahim al-Jumahi y Muhammad ibn al-Lahhaz entraron por la puerta de Darb con el pretexto de paz y seguridad y solicitaron una conversación privada con Abu Ja'far. Este ordenó a la gente que se retirara, y los dos permanecieron con él durante un buen rato para que la multitud abandonara sus puestos y la emboscada de los Banu al-Harith pudiera llevarse a cabo sin que la gente se percatara. Entonces, un jinete rabi'í llegó a toda velocidad sin saludar a Abu Ja'far, y los dos hombres se marcharon."
  fr: "Ibrahim al-Jumahi et Muhammad ibn al-Lahhaz pénétrèrent par la porte de Darb sous prétexte de paix et de sécurité et demandèrent à Abu Ja'far un entretien privé. Ce dernier ordonna à la foule de se retirer, et les deux hommes restèrent longtemps auprès de lui afin que la foule quitte ses positions et que l'embuscade des Banu al-Harith puisse se produire à l'insu des habitants. Soudain, un cavalier rabi'i arriva à toute allure sans saluer Abu Ja'far, et les deux hommes s'enfuirent."
  tr: "İbrahim el-Cemdi ve Muhammed ibn el-Lahaz, barış ve uzlaşma bahanesiyle ara sokağın kapısından içeri girdiler ve Ebu Cafer ile özel bir görüşme talep ettiler. Ebu Cafer halka dağılmalarını emretti, bu yüzden uzun süre onunla kaldılar. Halk dağıldıktan sonra, halkın haberi olmadan Beni el-Harith kabilesinin pusu kurmasına olanak sağladılar. Ardından iki adam aceleyle ayrıldı ve ikisi de Ebu Cafer'e selam vermedi."
  id: "Ibrahim al-Jamdi dan Muhammad ibn al-Lahaz memasuki gerbang gang dengan dalih perdamaian dan rekonsiliasi, dan meminta pertemuan pribadi dengan Abu Ja'far. Dia memerintahkan orang-orang untuk pergi, sehingga mereka tetap bersamanya untuk waktu yang lama sampai orang-orang bubar dari tempat mereka, sehingga memungkinkan penyergapan Bani al-Harith terjadi saat orang-orang tidak menyadarinya. Kemudian dua orang pergi dengan tergesa-gesa, dan tidak satu pun dari mereka memberi salam kepada Abu Ja'far."
