summary:
  ar: "كان علي يدخل السوق بنفسه بالدرة في يده، ويأمر التجار بأخذ الحق وإعطائه، ويقول: «بيعوا ولا تحلفوا، فإن اليمين تنفق السلعة وتمحق البركة»، وينهى عن الغش وتنقيح اللحم وبيع السمك الطافي، ويقضي في النزاع بين الباعة والمشترين {cite:sallabi-ali-vol1 p. 265}. وأمر أن يُطعم المساكين وقال: «لا تردوا قليل الربح فتحرموا كثيره» {cite:sallabi-ali-vol1 p. 267}."
  en: "Ali walked the Kufan market himself, told the traders to sell without swearing oaths, forbade adulteration and the selling of floating fish, decided disputes between sellers and buyers, and urged them not to refuse small profit lest they lose the greater {cite:sallabi-ali-vol1 p. 265}."
