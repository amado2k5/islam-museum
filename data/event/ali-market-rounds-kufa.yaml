label: { ar: "جولات علي في سوق الكوفة", en: "Ali's rounds in the market of Kufa", es: "Las rondas de Ali en el mercado de Kufa", fr: "Les tournées d'Ali au marché de Kufa", ur: "کوفہ کے بازار میں علی کا چکر", tr: "Ali'nin Kufa pazarındaki turları", id: "Tur Ali di pasar Kufa" }
summary:
  ar: "كان علي يدخل السوق بنفسه بالدرة في يده، ويأمر التجار بأخذ الحق وإعطائه، ويقول: «بيعوا ولا تحلفوا، فإن اليمين تنفق السلعة وتمحق البركة»، وينهى عن الغش وتنقيح اللحم وبيع السمك الطافي، ويقضي في النزاع بين الباعة والمشترين {cite:sallabi-ali-vol1 p. 265}. وأمر أن يُطعم المساكين وقال: «لا تردوا قليل الربح فتحرموا كثيره» {cite:sallabi-ali-vol1 p. 267}."
  en: "Ali walked the Kufan market himself, told the traders to sell without swearing oaths, forbade adulteration and the selling of floating fish, decided disputes between sellers and buyers, and urged them not to refuse small profit lest they lose the greater {cite:sallabi-ali-vol1 p. 265}."
  es: "Ali recorrió personalmente el mercado de Kufan, les dijo a los comerciantes que vendieran sin jurar, prohibió la adulteración y la venta de pescado flotante, resolvió disputas entre vendedores y compradores, y los instó a no rechazar pequeñas ganancias para no perder las mayores {cite:sallabi-ali-vol1 p. 265}."
  fr: "Ali a parcouru lui-même le marché de Kufan, a dit aux commerçants de vendre sans prêter serment, a interdit la falsification et la vente de poisson flottant, a tranché les différends entre vendeurs et acheteurs et les a exhortés à ne pas refuser un petit profit de peur de perdre le plus grand {cite:sallabi-ali-vol1 p. 265}."
  ur: "علی نے خود کوفان کے بازار کا سفر کیا، تاجروں سے کہا کہ وہ قسم کھائے بغیر فروخت کریں، ملاوٹ اور تیرتی ہوئی مچھلی کی فروخت سے منع کیا، بیچنے والوں اور خریداروں کے درمیان تنازعات کا فیصلہ کیا، اور ان پر زور دیا کہ وہ چھوٹے منافع سے انکار نہ کریں ورنہ زیادہ سے زیادہ نقصان نہ اٹھانا پڑے۔ 265}۔"
  tr: "Ali, elinde bir kırbaçla bizzat çarşıya girer, tüccarlara alacaklarını almalarını ve vereceklerini vermelerini emreder ve şöyle derdi: “Yemin etmeden satış yapın, çünkü yemin malları satabilir ama bereketi yok eder.” Hilekarlığı, etin usulsüz işlenmesini ve yüzen balık satışını yasakladı ve satıcılar ile alıcılar arasındaki anlaşmazlıkları kendisi çözerdi. Fakirlerin doyurulmasını emretti ve şöyle dedi: “Küçük bir kazancı reddetmeyin, yoksa büyük bir kazançtan mahrum kalırsınız.”"
  id: "Ali sendiri akan memasuki pasar dengan cambuk di tangannya, memerintahkan para pedagang untuk mengambil apa yang menjadi hak mereka dan memberikan apa yang menjadi hak mereka, seraya berkata: “Juallah tanpa bersumpah, karena sumpah dapat menjual barang tetapi menghancurkan berkahnya.” Ia melarang kecurangan, penanganan daging yang tidak semestinya, dan penjualan ikan yang mengapung, dan ia akan mengadili perselisihan antara penjual dan pembeli. Ia memerintahkan agar orang miskin diberi makan dan berkata: “Jangan menolak keuntungan kecil, agar kalian tidak kehilangan keuntungan besar.”"
