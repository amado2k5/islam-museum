label: { ar: "فتنة تكفير الحنابلة ونهب سوق المدرسة النظامية", en: "The Strife over Declaring the Hanbalis Unbelievers and the Looting of the Nizamiyya Market", es: "La disputa por la declaración de infieles a los hanbalíes y el saqueo del mercado de Nizamiyya.", fr: "La querelle autour de la déclaration des Hanbalites comme mécréants et le pillage du marché de Nizamiyya" }
summary:
  ar: "في سنة سبعين وأربعمائة ورد كتاب من الوزير نظام الملك إلى أبي إسحاق الشيرازي في معنى الحنابلة، بعدما بلغه أن أبا نصر بن القشيري أُجيب من الأصول بخلاف مذهبهم: «ليس توجب سياسة السلطان وقضية العدل أن نميل في المذاهب إلى جهة دون جهة، ونحن بتأييد السنن أولى من تشييد الفتن، ولم نتقدّم ببناء هذه المدرسة إلا صيانة أهل العلم والمصلحة لا للاختلاف وتفريق الكلمة، وإن الغالب على بغداد ونواحيها مذهب الإمام أحمد بن حنبل». فتداول الحنابلة هذا الكلام وسرّوا به وقوّوا معه، فلما كان يوم الثلاثاء ثاني شوال خرج من المدرسة متفقه يُعرف بالإسكندراني ومعه بعض من يؤثر الفتنة إلى سوق الثلاثاء فتكلّم بتكفير الحنابلة فرُمي بآجرة، فدخل إلى سوق المدرسة واستغاث بأهلها فخرجوا معه إلى سوق الثلاثاء ونهبوا بعض ما كان فيه، فوقع الشر وغلب أهل سوق الثلاثاء بالعوام ودخلوا سوق المدرسة فنهبوا القطعة التي تليهم منه وقتلوا مريضًا وجدوه في غرفة، فأنفذ إليهم عميد الملك الديلم والحرسانية فدفعوا العوام وقتلوا بالنشاب بضعة عشر، وأُنفذ من الديوان خدم لإطفاء الثائرة وحُمل المقتولون إلى الديوان حتى شهدهم القضاة والشهود وكتبوا خطوطهم بذلك {cite:muntazam-ibn-al-jawzi j.8 p.654-655}."
  en: "In 470 Nizam al-Mulk's letter reached Abu Ishaq al-Shirazi rebuking the anti-Hanbali agitation in his own Nizamiyya: 'Sultan's policy and the rule of justice oblige us to lean to no madhhab over another; we did not build this school but to shelter the people of learning — not to split the community — and the madhhab that dominates Baghdad and its quarters is that of the imam Ahmad ibn Hanbal.' The Hanbalis circulated it and were strengthened. Then on Tuesday 2 Shawwal a madrasa student called al-Iskandarani went to Suq al-Thulatha pronouncing the Hanbalis unbelievers; pelted with a brick he fled back to the madrasa market, whose men sallied out and looted the other market — until the mob reversed it, burst into the madrasa market, plundered their quarter and killed a sick man in his room. The Daylamite guards shot dead some fifteen, and the bodies were carried to the diwan for the qadis and witnesses to attest {cite:muntazam-ibn-al-jawzi j.8 p.654-655}."
  es: "En 470, la carta de Nizam al-Mulk llegó a Abu Ishaq al-Shirazi, reprendiendo la agitación anti-Hanbalí en su propia Nizamiyya: «La política del Sultán y el imperio de la justicia nos obligan a no inclinarnos por ninguna madhhab sobre otra; no construimos esta escuela sino para dar cobijo a la gente de saber, no para dividir a la comunidad, y la madhhab que domina Bagdad y sus alrededores es la del imán Ahmad ibn Hanbal». Los Hanbalíes la difundieron y se fortalecieron. Entonces, el martes 2 de Shawwal, un estudiante de madrasa llamado al-Iskandarani fue a Suq al-Thulatha declarando a los Hanbalíes infieles; apedreado con un ladrillo, huyó de regreso al mercado de la madrasa, cuyos hombres salieron y saquearon el otro mercado, hasta que la turba revirtió la situación, irrumpió en el mercado de la madrasa, saqueó su barrio y mató a un hombre enfermo en su habitación. Los guardias daylamitas mataron a tiros a unos quince, y los cuerpos fueron llevados al diwan para que los cadíes y los testigos dieran fe {cite:muntazam-ibn-al-jawzi j.8 p.654-655}."
  fr: "En 470, la lettre de Nizam al-Mulk parvint à Abu Ishaq al-Shirazi, réprimandant l'agitation anti-hanbalite au sein de sa propre communauté, la Nizamiyya: « La politique du Sultan et l'ordre de la justice nous obligent à ne privilégier aucun madhhab plutôt qu'un autre; nous n'avons pas construit cette école pour abriter les savants, et non pour diviser la communauté. Or, le madhhab qui domine Bagdad et ses environs est celui de l'imam Ahmad ibn Hanbal. » Les Hanbalites diffusèrent la lettre et se renforcèrent. Puis, le mardi 2 Shawwal, un étudiant de la madrasa nommé al-Iskandarani se rendit au souk al-Thulatha, déclarant les Hanbalites mécréants. Lapidé d'une brique, il s'enfuit vers le marché de la madrasa, dont les hommes pillèrent l'autre marché. La foule se retourna alors contre eux, envahit le marché de la madrasa, pilla leur quartier et tua un malade dans sa chambre. Les gardes daylamites ont abattu une quinzaine de personnes, et les corps ont été transportés au diwan pour que les qadis et les témoins puissent attester {cite:muntazam-ibn-al-jawzi j.8 p.654-655}."
