label: { ar: "فتنة تكفير الحنابلة ونهب سوق المدرسة النظامية", en: "The Strife over Declaring the Hanbalis Unbelievers and the Looting of the Nizamiyya Market" }
summary:
  ar: "في سنة سبعين وأربعمائة ورد كتاب من الوزير نظام الملك إلى أبي إسحاق الشيرازي في معنى الحنابلة، بعدما بلغه أن أبا نصر بن القشيري أُجيب من الأصول بخلاف مذهبهم: «ليس توجب سياسة السلطان وقضية العدل أن نميل في المذاهب إلى جهة دون جهة، ونحن بتأييد السنن أولى من تشييد الفتن، ولم نتقدّم ببناء هذه المدرسة إلا صيانة أهل العلم والمصلحة لا للاختلاف وتفريق الكلمة، وإن الغالب على بغداد ونواحيها مذهب الإمام أحمد بن حنبل». فتداول الحنابلة هذا الكلام وسرّوا به وقوّوا معه، فلما كان يوم الثلاثاء ثاني شوال خرج من المدرسة متفقه يُعرف بالإسكندراني ومعه بعض من يؤثر الفتنة إلى سوق الثلاثاء فتكلّم بتكفير الحنابلة فرُمي بآجرة، فدخل إلى سوق المدرسة واستغاث بأهلها فخرجوا معه إلى سوق الثلاثاء ونهبوا بعض ما كان فيه، فوقع الشر وغلب أهل سوق الثلاثاء بالعوام ودخلوا سوق المدرسة فنهبوا القطعة التي تليهم منه وقتلوا مريضًا وجدوه في غرفة، فأنفذ إليهم عميد الملك الديلم والحرسانية فدفعوا العوام وقتلوا بالنشاب بضعة عشر، وأُنفذ من الديوان خدم لإطفاء الثائرة وحُمل المقتولون إلى الديوان حتى شهدهم القضاة والشهود وكتبوا خطوطهم بذلك {cite:muntazam-ibn-al-jawzi j.8 p.654-655}."
  en: "In 470 Nizam al-Mulk's letter reached Abu Ishaq al-Shirazi rebuking the anti-Hanbali agitation in his own Nizamiyya: 'Sultan's policy and the rule of justice oblige us to lean to no madhhab over another; we did not build this school but to shelter the people of learning — not to split the community — and the madhhab that dominates Baghdad and its quarters is that of the imam Ahmad ibn Hanbal.' The Hanbalis circulated it and were strengthened. Then on Tuesday 2 Shawwal a madrasa student called al-Iskandarani went to Suq al-Thulatha pronouncing the Hanbalis unbelievers; pelted with a brick he fled back to the madrasa market, whose men sallied out and looted the other market — until the mob reversed it, burst into the madrasa market, plundered their quarter and killed a sick man in his room. The Daylamite guards shot dead some fifteen, and the bodies were carried to the diwan for the qadis and witnesses to attest {cite:muntazam-ibn-al-jawzi j.8 p.654-655}."
