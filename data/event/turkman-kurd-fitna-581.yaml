summary:
  ar: "وقعت الفتنة بين التركمان والأكراد بديار الجزيرة والموصل حتى امتلأت البلاد من قتلاها ونهبها وكانت من أعظم فتن تلك الديار {cite:kamil-ibn-al-athir p. 136}."
  en: "A great fitna ran between the Turkmen and the Kurds through the Jazira and Mosul until the lands filled with dead and plunder — among the greatest disturbances of that country {cite:kamil-ibn-al-athir p. 136}."
  es: "Una gran fitna se extendió entre los turcomanos y los kurdos a través de Jazira y Mosul hasta que las tierras se llenaron de muertos y saqueos, entre los mayores disturbios de ese país {cite:kamil-ibn-al-athir p. 136}."
  fr: "Une grande fitna a éclaté entre les Turkmènes et les Kurdes à travers la Jazira et Mossoul jusqu'à ce que les terres soient remplies de morts et de butin — parmi les plus grands troubles de ce pays {cite:kamil-ibn-al-athir p. 136}."
  ur: "ترکمانوں اور کردوں کے درمیان جزیرہ اور موصل کے راستے ایک عظیم فتنہ دوڑتا رہا یہاں تک کہ زمینیں مرنے والوں اور لوٹ مار سے بھر گئیں جو اس ملک کے سب سے بڑے فتنوں میں سے ایک تھا۔ 136}۔"
  tr: "Cezire ve Musul topraklarında Türkmenler ile Kürtler arasındaki çatışma o kadar şiddetliydi ki, ülke ölülerle ve yağmalanmış mallarla dolup taşmıştı ve bu, o toprakların en büyük çatışmalarından biriydi. {Kaynak: Kamil ibn el-Sihir, s. 136}"
  id: "Konflik antara Turkmen dan Kurdi di wilayah Al-Jazira dan Mosul begitu hebat sehingga negara itu dipenuhi dengan mayat dan harta benda yang dijarah, dan itu merupakan salah satu konflik terbesar di wilayah tersebut {cite:kamil-ibn-al-athir p. 136}."
