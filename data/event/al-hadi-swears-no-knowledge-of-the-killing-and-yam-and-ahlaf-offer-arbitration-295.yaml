id: event/al-hadi-swears-no-knowledge-of-the-killing-and-yam-and-ahlaf-offer-arbitration-295
class: event
kind: other
label:
  ar: "الهادي يحلف أنه لم يعلم بقتل ابن بسطام، ويأم والأحلاف يطلبان التحكيم، سنة 295هـ، ص360"
  en: "Al-Hadi swears he had no knowledge of Ibn Bistam's killing, and Yam and Ahlaf ask for arbitration, 295 AH, p. 360"
  ur: "ہادی کا حلف کہ انہیں ابن بسطام کے قتل کا علم نہ تھا، اور یأم و احلاف کا ثالثی کا مطالبہ، 295ھ، ص360"
  es: "Al-Hadi jura que no tenía conocimiento del asesinato de Ibn Bistam, y Yam y Ahlaf piden arbitraje, 295 AH, pág. 360"
  fr: "Al-Hadi jure qu'il n'avait aucune connaissance du meurtre d'Ibn Bistam, et Yam et Ahlaf demandent un arbitrage, 295 AH, p. 360"
  tr: "El-Hadi, İbn Bistam'ın öldürülmesinden haberdar olmadığını yeminle belirtir ve İmam ile müttefikleri tahkim talep eder (Hicri 295, s. 360)."
  id: "Al-Hadi bersumpah bahwa dia tidak mengetahui tentang pembunuhan Ibnu Bistam, dan Imam serta para sekutu meminta arbitrase, tahun 295 H, hlm. 360"
summary:
  ar: "جمع الهادي الناس وحلف أنه لم يكن على علم بقتل ابن بسطام، وقال إنه لو أراد قتله لأمره أن يأتيه في مائة من بني الحارث فيضرب أعناقهم جميعاً. وعرض يأم والأحلاف أن يُحتكم بينهم أمام الإمام، وذكروا أن ابن بسطام قتل منهم ستة رجال. فاطمأنت بنو ربيعة إلى قوله."
  en: "Al-Hadi gathered the people and swore that he had no knowledge of Ibn Bistam's killing. He said that had he wanted him dead he would have ordered him to come to him with a hundred men of Banu al-Harith so that he could strike off all their necks. Yam and Ahlaf offered to be judged before the Imam, pointing out that Ibn Bistam had killed six of their men. Banu Rabi'a were reassured by his word."
  ur: "ہادی نے لوگوں کو جمع کیا اور حلف اٹھایا کہ انہیں ابن بسطام کے قتل کا علم نہ تھا۔ انہوں نے کہا کہ اگر وہ اسے قتل کرانا چاہتے تو اسے بنو حارث کے سو آدمیوں کے ساتھ اپنے پاس بلاتے اور سب کی گردنیں اڑا دیتے۔ یأم اور احلاف نے امام کے سامنے فیصلہ کرانے کی پیشکش کی اور کہا کہ ابن بسطام نے ان کے چھ آدمی قتل کیے تھے۔ بنو ربیعہ ہادی کی بات سے مطمئن ہو گئے۔"
  es: "Al-Hadi reunió a la gente y juró que desconocía el asesinato de Ibn Bistam. Dijo que, de haberlo querido muerto, le habría ordenado que se presentara ante él con cien hombres de Banu al-Harith para cortarles el cuello a todos. Yam y Ahlaf se ofrecieron a ser juzgados ante el Imam, señalando que Ibn Bistam había matado a seis de sus hombres. Los Banu Rabi'a se tranquilizaron con sus palabras."
  fr: "Al-Hadi rassembla les gens et jura n'avoir aucune connaissance du meurtre d'Ibn Bistam. Il déclara que s'il avait voulu sa mort, il lui aurait ordonné de venir à lui avec cent hommes des Banu al-Harith afin de les égorger. Yam et Ahlaf proposèrent d'être jugés par l'Imam, faisant remarquer qu'Ibn Bistam avait tué six des leurs. Les Banu Rabi'a furent rassurés par ses paroles."
  tr: "El-Hadi, halkı topladı ve İbn Bistam'ın öldürülmesinden haberi olmadığını yemin ederek söyledi. Eğer onu öldürmek isteseydi, onu Beni el-Harith'ten yüz adamla birlikte gelmesini ve hepsinin başını kesmesini emredeceğini belirtti. Ya'am ve müttefikleri, İbn Bistam'ın altı adamlarını öldürdüğünü belirterek, anlaşmazlıklarını İmam'ın huzurunda çözmeyi teklif ettiler. Bu açıklama Beni Rabi'ah'ı rahatlattı."
  id: "Al-Hadi mengumpulkan orang-orang dan bersumpah bahwa dia tidak mengetahui tentang pembunuhan Ibnu Bistam. Dia berkata bahwa jika dia ingin membunuhnya, dia akan memerintahkannya untuk datang dengan seratus orang dari Banu al-Harith dan memenggal kepala mereka semua. Ya'am dan sekutunya menawarkan untuk menyelesaikan perselisihan mereka di hadapan Imam, dengan menyatakan bahwa Ibnu Bistam telah membunuh enam orang dari mereka. Banu Rabi'ah merasa tenang dengan pernyataannya."
