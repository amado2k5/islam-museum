label: { ar: "دخول الزنج الأهواز", en: "The Zanj Enter Ahwaz", es: "Los Zanj entran en Ahwaz", fr: "Les Zanj entrent à Ahwaz", ur: "زنج اہواز میں داخل ہوا۔" }
summary:
  ar: "في سنة تسع وخمسين ومائتين رجع الموفق من حرب الزنج مسلولًا بالمرض فبعث المعتمد موسى بن بغا فشخّص من سامرا لحرب الزنج في ذي القعدة وشيّعه المعتمد وخلع عليه في الطريق، وكانت بينه وبينهم حروب يطول ذكرها في بضعة عشر شهرًا ثم صُرف موسى عن الحرب؛ ودخل الزنج الأهواز في هذه السنة فقتلوا زهاء خمسين ألفًا {cite:muntazam-ibn-al-jawzi p. 105}."
  en: "In 259 al-Muwaffaq returned from the Zanj war wasted by illness; al-Mu'tamid sent Musa ibn Bugha against the Zanj in Dhu'l-Qa'da, seeing him off with robes — their war dragged on some thirteen months before Musa was recalled. That year the Zanj entered Ahwaz and killed some fifty thousand {cite:muntazam-ibn-al-jawzi p. 105}."
  es: "En el año 259, al-Muwaffaq regresó de la guerra contra los Zanj debilitado por la enfermedad; al-Mu'tamid envió a Musa ibn Bugha contra los Zanj en Dhu'l-Qa'da, despidiéndolo con túnicas. La guerra se prolongó unos trece meses antes de que Musa fuera llamado de vuelta. Ese año, los Zanj entraron en Ahwaz y mataron a unos cincuenta mil hombres {cite:muntazam-ibn-al-jawzi p. 105}."
  fr: "En 259, al-Muwaffaq revint de la guerre contre les Zanj, affaibli par la maladie. Al-Mu'tamid envoya Musa ibn Bugha combattre les Zanj en Dhu'l-Qa'da, et le salua en lui remettant des robes. La guerre dura treize mois avant que Musa ne soit rappelé. Cette même année, les Zanj entrèrent dans Ahwaz et massacrèrent environ cinquante mille hommes (cf. Muntazam ibn al-Jawzi, p. 105)."
  ur: "259 الموفق میں جنگ زنج سے بیمار ہو کر واپس آیا۔ المتمید نے ذوالقعدہ میں موسیٰ بن بوغہ کو زنج کے خلاف بھیجا، اس کو لباس پہنا کر رخصت کیا - ان کی جنگ موسیٰ کے واپس بلائے جانے سے تقریباً تیرہ ماہ تک جاری رہی۔ اسی سال زنج اہواز میں داخل ہوا اور تقریباً پچاس ہزار کو قتل کر دیا۔ 105}۔"
