label: { ar: "دخول الزنج الأهواز" }
summary:
  ar: "في سنة تسع وخمسين ومائتين رجع الموفق من حرب الزنج مسلولًا بالمرض فبعث المعتمد موسى بن بغا فشخّص من سامرا لحرب الزنج في ذي القعدة وشيّعه المعتمد وخلع عليه في الطريق، وكانت بينه وبينهم حروب يطول ذكرها في بضعة عشر شهرًا ثم صُرف موسى عن الحرب؛ ودخل الزنج الأهواز في هذه السنة فقتلوا زهاء خمسين ألفًا {cite:muntazam-ibn-al-jawzi p. 105}."
  en: "In 259 al-Muwaffaq returned from the Zanj war wasted by illness; al-Mu'tamid sent Musa ibn Bugha against the Zanj in Dhu'l-Qa'da, seeing him off with robes — their war dragged on some thirteen months before Musa was recalled. That year the Zanj entered Ahwaz and killed some fifty thousand {cite:muntazam-ibn-al-jawzi p. 105}."
