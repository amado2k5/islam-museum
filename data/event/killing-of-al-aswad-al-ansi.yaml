id: event/killing-of-al-aswad-al-ansi
class: event
kind: battle
label: { ar: "قتل الأسود العنسي", en: "The Killing of al-Aswad al-Ansi", es: "El asesinato de al-Aswad al-Ansi", fr: "Le meurtre d'al-Aswad al-Ansi", ur: "اسود الانسی کا قتل", tr: "Siyah adam Ansi'yi öldürdü.", id: "Pria kulit hitam itu membunuh Ansi." }
summary:
  ar: "عند البلاذري: الأسود بن كعب بن عوف العنسي تكهن وادعى النبوة فاتبعه عَنْس وغيرهم وسما نفسه رحمان اليمن كما تسمى مسيلمة رحمان اليمامة، وكان له حمار معلم يأمره فيسجد ويبرك فسمي ذا المار وقيل ذو الخمار لاتخامه واعتمامه أبداً وقيل سمي الأسود لسواد وجهه واسمه عيهلة؛ وبعث إليه النبي جرير بن عبد الله البجلي سنة وفاته يدعوه إلى الإسلام فلم يجبه — وبعض الرواة ينكر بعثته — وأتى صنعاء فغلب عليها وأخرج عنها عامل النبي خالد بن سعيد بن العاص ⁦(وقال النعمان بن يزيد أحد الأبناء: أبان بن سعيد)⁩ وانحاز إلى ناحية زياد بن لبيد، واستذل الأبناء — أولاد الفرس الذين وجههم كسرى إلى اليمن مع ابن ذي يزن وعليهم وهرز — واستخدمهم وأضرّ بهم وتزوج المرزبانة امرأة باذام ملكهم؛ فوجّه النبي قيس بن هبيرة المكشوح المرادي — سمي لكيّ على كشحه من داء — وأمره باستمالة الأبناء وبعث معه فروة بن مسيك المرادي، فلما صارا إلى اليمن بلغهما وفاة النبي فأظهر قيس للأسود أنه على رأيه حتى خلى بينه وبين دخول صنعاء فدخلها في جماعة من مذحج وهمدان وغيرهم، ثم استمال فيروز بن الديلمي أحد الأبناء وكان قد أسلم، وأتيا باذام رأس الأبناء وقيل إن باذام كان مات وخلّفه داذويه فأسلم داذويه ولقي قيساً فاستماله وبثّ دعاته في الأبناء فأسلموا، فتطابقوا على قتل الأسود واغتياله ودسّوا إلى المرزبانة امرأته فأعلمتهم وكانت شانئة له فدلتهم على جدول يدخل إليه منه — وقيل نقبوا جدار بيته بالخلّ نقباً — فدخلوا عليه سحراً وهو سكران نائم فذبحه قيس فجعل يخور خوار الثور حتى أفزع حرسه فقالوا ما شأن رحمان اليمن فبادرت امرأته فقالت «إن الوحي ينزل عليه» فسكنوا، واحتز قيس رأسه وعلا سور المدينة حين أصبح فكبر وشهد وأنّ الأسود كذاب عدو الله، فاجتمع أصحابه فألقى إليهم رأسه فتفرقوا إلا قليلاً ووضعوا السيف في بقيتهم فلم ينجُ إلا من أسلم؛ وذكر بعض الرواة أن الذي قتله فيروز بن الديلمي وأن قيساً أجاز عليه واحتز رأسه، وأن قيساً وفيروزاً ادعيا قتله وهما بالمدينة فقال عمر «قتله هذا الأسد» يعني فيروز؛ وذكر بعض أهل العلم أن قتله كان قبل وفاة النبي بخمسة أيام فقال في مرضه «قد قتل الله الأسود العنسي قتله الرجل الصالح فيروز بن الديلمي»، وأن الخبر ورد على أبي بكر بعد استخلافه بعشر ليال؛ واتُّهم قيس بقتل داذويه وبلغ أبي بكر أنه على إجلاء الأبناء عن صنعاء فأغضبه ذلك فكتب إلى المهاجر عامله عليها يأمره بحمله إليه فأحلفه خمسين يميناً عند منبر النبي أنه ما قتل داذويه فخلى سبيله ووجهه إلى الشام."
  en: "In al-Baladhuri: al-Aswad ibn Ka'b ibn Awf al-Ansi soothsaid and claimed prophecy, Ans and others followed him, and he styled himself Rahman of Yemen as Musaylima styled himself Rahman of al-Yamama; he had a trained donkey which would kneel and prostrate at his command whence he was called Dhu al-Mar — others say Dhu al-Khimar for being ever veiled and turbaned, and some Yemenis told al-Baladhuri his face was black, hence al-Aswad, his name being Ayhala; the Prophet sent Jarir ibn Abdullah al-Bajali to him in the year of his death calling him to Islam — some transmitters deny the mission — and he came to San'a, took it and expelled the Prophet's agent Khalid ibn Sa'id ibn al-As (al-Nu'man ibn Yazid of the Abna' says Aban ibn Sa'id), who withdrew toward Ziyad ibn Labid; he humiliated the Abna' — the sons of the Persians whom Kisra had sent to Yemen with Ibn Dhi Yazan under Wahriz — used them as labour and wronged them, and married the Marzbana, Badham their king's widow; the Prophet sent Qays ibn Hubayra al-Makshuh al-Muradi — so called for a cautery on his waist from an ailment — ordering him to win over the Abna', and sent with him Farwa ibn Musayk al-Muradi; reaching Yemen as the Prophet's death was reported, Qays feigned accord with al-Aswad until he entered San'a with a company of Madhhij, Hamdan and others, then won over Fayruz ibn al-Daylami of the Abna', who had embraced Islam, and the two came to Badham, chief of the Abna' — some say Badham was already dead and a successor named Dadhawayh converted and met Qays and won him over, spreading his missionaries among the Abna' until they converted; so they all agreed to kill and assassinate al-Aswad, and secretly informed his wife the Marzbana who, hating him, showed them a water-channel into his house — some say they pierced a hole in the wall of his chamber of vinegar — and entered on him at dawn while he lay drunk asleep, and Qays slaughtered him, his bellowing like a bull's startling the guards who asked 'what ails the Rahman of Yemen?' — his wife answered 'revelation descends on him' and they calmed; Qays cut off his head, stood on the city wall at dawn, magnified God and testified that al-Aswad was a liar and God's enemy, and when his followers gathered he cast the head to them and they scattered save a few, the sword falling on the remnant until none escaped but those who embraced Islam; some transmitters say Fayruz ibn al-Daylami killed him with Qays only striking off the head, and when Qays and Fayruz both claimed the killing in Medina Umar said 'this lion killed him' meaning Fayruz; some scholars date the killing five days before the Prophet's death — the Prophet saying in his illness 'God has killed al-Aswad al-Ansi; the righteous man Fayruz ibn al-Daylami killed him' — with the report reaching Abu Bakr ten nights into his caliphate; Qays was then accused of killing Dadhawayh and it reached Abu Bakr that he meant to expel the Abna' from San'a, which angered him, so he wrote to al-Muhajir his agent there to bring him, made him swear fifty oaths at the Prophet's minbar that he had not killed Dadhawayh, then released him and sent him to Syria."
  es: "En al-Baladhuri: al-Aswad ibn Ka'b ibn Awf al-Ansi dijo y afirmó ser profeta, Ans y otros lo siguieron, y se autodenominó Rahman de Yemen como Musaylima se autodenominó Rahman de al-Yamama; tenía un burro adiestrado que se arrodillaba y se postraba a su orden, de donde fue llamado Dhu al-Mar; otros dicen Dhu al-Khimar por estar siempre velado y con turbante, y algunos yemeníes le dijeron a al-Baladhuri que su rostro era negro, de ahí al-Aswad, siendo su nombre Ayhala; El Profeta le envió a Jarir ibn Abdullah al-Bajali en el año de su muerte, llamándolo al Islam —algunos transmisores niegan la misión— y él llegó a Saná, la tomó y expulsó al agente del Profeta Khalid ibn Sa'id ibn al-As (al-Nu'man ibn Yazid de los Abna' dice Aban ibn Sa'id), quien se retiró hacia Ziyad ibn Labid; humilló a los Abna' —los hijos de los persas que Kisra había enviado a Yemen con Ibn Dhi Yazan bajo el mando de Wahriz— los usó como mano de obra y los maltrató, y se casó con Marzbana, Badham, la viuda de su rey; el Profeta envió a Qays ibn Hubayra al-Makshuh al-Muradi —llamado así por una cauterización en su cintura debido a una dolencia— ordenándole que ganara a los Abna', y envió con él a Farwa ibn Musayk al-Muradi; Al llegar a Yemen cuando se informó de la muerte del Profeta, Qays fingió estar de acuerdo con al-Aswad hasta que entró en Saná con un grupo de Madhhij, Hamdan y otros. Luego, convenció a Fayruz ibn al-Daylami de los Abna', que se había convertido al Islam, y los dos fueron a ver a Badham, jefe de los Abna'. Algunos dicen que Badham ya había muerto y que un sucesor llamado Dadhawayh se convirtió y conoció a Qays, convenciéndolo y extendiendo a sus misioneros entre los Abna' hasta que se convirtieron. Entonces, todos acordaron matar y asesinar a al-Aswad, e informaron en secreto a su esposa, la Marzbana, quien, odiándolo, les mostró un canal de agua que conducía a su casa. Algunos dicen que hicieron un agujero en la pared de su habitación llena de vinagre. Entraron en su casa al amanecer mientras dormía borracho, y Qays lo mató. Sus bramidos, como los de un toro, sobresaltaron a los guardias, que preguntaron: \"¿Qué le pasa al Rahman de Yemen?\". — su esposa respondió 'la revelación desciende sobre él' y se calmaron; Qays le cortó la cabeza, se paró en la muralla de la ciudad al amanecer, glorificó a Dios y testificó que al-Aswad era un mentiroso y enemigo de Dios, y cuando sus seguidores se reunieron, les arrojó la cabeza y se dispersaron salvo unos pocos, la espada cayendo sobre el remanente hasta que no escapó nadie excepto aquellos que abrazaron el Islam; algunos transmisores dicen que Fayruz ibn al-Daylami lo mató con Qays solo cortando la cabeza, y cuando Qays y Fayruz reclamaron el asesinato en Medina, Umar dijo 'este león lo mató' refiriéndose a Fayruz; algunos eruditos fechan el asesinato cinco días antes de la muerte del Profeta —el Profeta dijo en su enfermedad 'Dios ha matado a al-Aswad al-Ansi; el hombre justo Fayruz ibn al-Daylami lo mató'— con el informe llegando a Abu Bakr diez noches después de su califato; Qays fue acusado entonces de matar a Dadhawayh, y Abu Bakr se enteró de que pretendía expulsar a los Abna' de Saná, lo que lo enfureció. Por ello, escribió a al-Muhajir, su agente allí, para que lo trajera, le hizo jurar cincuenta veces ante el púlpito del Profeta que no había matado a Dadhawayh, y luego lo liberó y lo envió a Siria."
  fr: "Dans al-Baladhuri: al-Aswad ibn Ka'b ibn Awf al-Ansi a dit et revendiqué la prophétie, Ans et d'autres l'ont suivi, et il s'est appelé Rahman du Yémen comme Musaylima s'appelait Rahman d'al-Yamama; il avait un âne dressé qui s'agenouillait et se prosternait à son ordre, d'où il a été appelé Dhu al-Mar — d'autres disent Dhu al-Khimar parce qu'il était toujours voilé et turbanné, et certains Yéménites ont dit à al-Baladhuri que son visage était noir, d'où al-Aswad, son nom étant Ayhala; Le Prophète envoya Jarir ibn Abdullah al-Bajali auprès de lui l'année de sa mort, l'appelant à l'Islam — certains transmetteurs nient cette mission — et il vint à Sanaa, la prit et expulsa l'agent du Prophète, Khalid ibn Sa'id ibn al-As (al-Nu'man ibn Yazid des Abna' dit Aban ibn Sa'id), qui se retira vers Ziyad ibn Labid; il humilia les Abna' — les fils des Perses que Kisra avait envoyés au Yémen avec Ibn Dhi Yazan sous Wahriz — les utilisa comme main-d'œuvre et les maltraita, et épousa la Marzbana, Badham, la veuve de leur roi; le Prophète envoya Qays ibn Hubayra al-Makshuh al-Muradi — ainsi nommé en raison d'une cautérisation de la taille due à une maladie — lui ordonnant de gagner les Abna', et envoya avec lui Farwa ibn Musayk al-Muradi; Arrivé au Yémen au moment où la mort du Prophète était annoncée, Qays feignit de s'allier à al-Aswad jusqu'à son entrée à Sanaa avec Madhhij, Hamdan et d'autres. Il gagna alors à sa cause Fayruz ibn al-Daylami, un Abna' converti à l'islam, et tous deux se rendirent auprès de Badham, chef des Abna'. Certains affirment que Badham était déjà mort et qu'un successeur nommé Dadhawayh s'était converti, avait rencontré Qays et l'avait rallié à sa cause, semant ses missionnaires parmi les Abna' jusqu'à leur conversion. Ils convinrent alors de tuer et d'assassiner al-Aswad et en informèrent secrètement sa femme, la Marzbana, qui, le haïssant, leur montra un canal d'eau menant à sa maison. D'autres disent qu'ils percèrent un trou dans le mur de sa chambre à vinaigre. Ils s'introduisirent chez lui à l'aube, alors qu'il dormait, ivre, et Qays l'égorgea. Son mugissement, semblable à celui d'un taureau, effraya les gardes qui demandèrent: « Qu'arrive-t-il au Rahman du Yémen ? » — Son épouse répondit: « La révélation lui est tombée dessus », et ils se calmèrent. Qays lui trancha la tête, se tint sur les remparts de la ville à l'aube, glorifia Dieu et témoigna qu'al-Aswad était un menteur et un ennemi de Dieu. Lorsque ses partisans se rassemblèrent, il leur jeta la tête et ils se dispersèrent, à l'exception de quelques-uns. L'épée s'abattit sur les survivants jusqu'à ce qu'il ne reste plus que ceux qui embrassèrent l'islam. Certains transmetteurs rapportent que Fayruz ibn al-Daylami le tua, Qays se contentant de lui trancher la tête. Lorsque Qays et Fayruz revendiquèrent tous deux le meurtre à Médine, Umar déclara: « Ce lion l'a tué », désignant Fayruz. Certains savants datent le meurtre de cinq jours avant la mort du Prophète — le Prophète disant dans sa maladie: « Dieu a tué al-Aswad al-Ansi; le juste Fayruz ibn al-Daylami l'a tué » — la nouvelle parvenant à Abu Bakr dix nuits après le début de son califat. Qays fut alors accusé d'avoir tué Dadhawayh et Abu Bakr apprit qu'il avait l'intention d'expulser les Abna' de San'a, ce qui le mit en colère. Il écrivit donc à al-Muhajir, son agent sur place, pour qu'il le fasse venir, le fit prêter cinquante serments au minbar du Prophète qu'il n'avait pas tué Dadhawayh, puis le libéra et l'envoya en Syrie."
  ur: "البلادوری میں ہے: اسود بن کعب ابن عوف الانسی نے دعویٰ کیا اور نبوت کا دعویٰ کیا، انس اور دیگر نے اس کی پیروی کی، اور اس نے اپنے آپ کو یمن کا رحمن کہا جیسا کہ مسیلمہ نے اپنے آپ کو یمامہ کا رحمن کہا؛ اس کے پاس ایک تربیت یافتہ گدھا تھا جو اس کے حکم پر گھٹنے ٹیکتا تھا اور سجدہ کرتا تھا اسی لیے اسے ذو المار کہا جاتا تھا- دوسرے کہتے ہیں ذو الخمار ہمیشہ پردہ دار اور پگڑی والے رہنے کی وجہ سے، اور بعض یمنیوں نے البلادھوری کو بتایا کہ اس کا چہرہ کالا ہے، اس لیے اسود، اس کا نام عیالہ ہے۔ رسول اللہ نے جریر بن عبداللہ البجلی کو ان کی وفات کے سال ان کے پاس بھیجا اور انہیں اسلام کی دعوت دی - کچھ نقل کرنے والے اس مشن کا انکار کرتے ہیں - اور وہ صنعاء آئے اور اسے لے لیا اور رسول اللہ کے ایجنٹ خالد بن سعید بن العاص ⁦(ابنعید کے النعمان بن یزید ابن اعراب کہتے ہیں)⁩ کو نکال دیا۔ لیبڈ اس نے ابنا یعنی فارسیوں کے بیٹوں کو ذلیل کیا جنہیں کسریٰ نے ابن ذی یزان کے ساتھ وحریز کے ماتحت یمن بھیجا تھا، انہیں مزدوری کے طور پر استعمال کیا اور ان پر ظلم کیا، اور اپنے بادشاہ کی بیوہ مرزبانہ سے شادی کی۔ نبی نے قیس بن ہبیرہ المکشوۃ المرادی کو بھیجا - اس طرح اس کی کمر پر بیماری کی وجہ سے احتیاط طلب کی گئی - اسے ابنا پر فتح حاصل کرنے کا حکم دیا، اور اپنے ساتھ فروا بن مسیک المرادی کو بھیجا؛ یمن پہنچ کر جب رسول اللہ کی وفات کی خبر ملی تو قیس نے اسود کے ساتھ معاہدہ کیا یہاں تک کہ وہ مدح، ہمدان اور دیگر لوگوں کے ساتھ صنعاء میں داخل ہوا، پھر ابنا کے فیروز ابن الدیلمی پر فتح حاصل کی، جس نے اسلام قبول کیا تھا، اور دونوں ابنا کے سردار بدم کے پاس پہنچے، اور بعض کہتے ہیں کہ بدہام کامیاب ہو گیا تھا اور بدہام کا نام بدل دیا گیا تھا اور وہ کامیاب ہو گیا تھا۔ اس پر، اپنے مشنریوں کو ابنا کے درمیان پھیلاتے رہے یہاں تک کہ وہ تبدیل ہو گئے۔ چنانچہ وہ سب اسود کو قتل کرنے اور قتل کرنے پر راضی ہوگئے، اور خفیہ طور پر اس کی بیوی مرزبانہ کو اطلاع دی جس نے اس سے نفرت کرتے ہوئے انہیں اس کے گھر میں پانی کا ایک نالہ دکھایا - بعض کہتے ہیں کہ انہوں نے اس کے سرکہ کے حجرے کی دیوار میں سوراخ کیا - اور صبح کے وقت اس پر اس وقت داخل ہوئے جب وہ نشے میں سو رہا تھا، اور قیس نے اسے اپنے بیلوں کے محافظوں کی طرح بلانا شروع کیا۔ کس نے پوچھا کہ یمن کے رحمن کو کیا تکلیف ہے؟ - اس کی بیوی نے جواب دیا 'اس پر وحی نازل ہوتی ہے' اور وہ پرسکون ہو گئے۔ قیس نے اپنا سر کاٹ دیا، فجر کے وقت شہر کی فصیل پر کھڑا ہوا، خدا کی بڑائی کی اور گواہی دی کہ اسود جھوٹا اور خدا کا دشمن ہے، اور جب اس کے پیروکار جمع ہوئے تو اس نے سر ان کی طرف پھینک دیا اور وہ چند ایک کو چھوڑ کر بکھر گئے، تلوار باقیوں پر گر پڑی یہاں تک کہ اسلام قبول کرنے والوں کے سوا کوئی نہ بچ سکا۔ کچھ نقل کرنے والے کہتے ہیں کہ فیروز ابن الدیلمی نے اسے قیس کے سر سے مار کر قتل کیا، اور جب قیس اور فیروز دونوں نے مدینہ میں قتل کا دعویٰ کیا تو عمر نے کہا کہ 'اس شیر نے اسے مارا' یعنی فیروز؛ بعض علماء نے قتل کی تاریخ نبی کی وفات سے پانچ دن پہلے بتائی ہے۔ نیک آدمی فیروز ابن الدیلمی نے اسے قتل کر دیا' - یہ اطلاع ابوبکر کو ان کی خلافت میں دس راتوں تک پہنچی۔ اس کے بعد قیس پر دادویہ کے قتل کا الزام لگایا گیا اور ابوبکر تک یہ بات پہنچی کہ اس کا مطلب ابنا کو صنعاء سے نکالنا ہے، جس سے وہ ناراض ہو گئے، اس لیے اس نے وہاں موجود اپنے ایجنٹ المہاجر کو لکھا کہ اسے لے آئے، منبر پر اس سے پچاس قسمیں کھائیں کہ اس نے داداویہ کو قتل نہیں کیا، پھر اسے رہا کر کے شام بھیج دیا۔"
  tr: "El-Baladhuri'ye göre: El-Aswad bin Ka'b bin Awf El-Ansi peygamberlik etmiş ve peygamber olduğunu iddia etmiş, bu yüzden Ens ve diğerleri onu takip etmiştir. Kendisine Rahman El-Yaman adını vermiştir, tıpkı Musaylime'nin kendisine Rahman El-Yamame adını vermesi gibi. Eğittiği bir eşeği vardı ve ona secde ettirir, diz çöktürürdü; bu yüzden ona Zü'l-Mar denirdi ve sürekli şişmanlığı ve sarığı nedeniyle Zü'l-Himar denildiği söylenirdi. Yüzünün siyahlığından dolayı El-Aswad olarak anıldığı ve adının Ayhalah olduğu söylenir. Peygamber, ölümünden önceki yıl Cerir bin Abdullah El-Bajali'yi ona İslam'a davet etmek için gönderdi, ancak o ona cevap vermedi -ve bazı rivayetçiler onun misyonunu inkar eder- ve Sana'a'ya gelip şehri fethetti ve Peygamber'in temsilcisi Halid bin Said bin El-As'ı (ve El-Nu'man bin Yazid oğullarından birinin: Ebûn bin Said olduğunu söyledi) kovdu. Ziyad bin Labid'in tarafına çekildi ve Hüsrüd'ün İbn Zi Yazan ile Yemen'e gönderdiği ve onların otoritesi olan Pers oğullarını (Vahriz) boyunduruk altına aldı, onlara zulmetti ve onlara zarar verdi; ayrıca kralları Badham'ın karısı Marzbanah ile evlendi. Bunun üzerine Peygamber, yan tarafındaki bir rahatsızlıktan dolayı yakılmış bir yara nedeniyle bu adı alan Kays ibn Hubeyre el-Makşuh el-Muradi'yi gönderdi ve ona Peygamber'in oğullarını kazanmasını emretti. Ayrıca onunla birlikte Farve ibn Musayk el-Muradi'yi de gönderdi. Yemen'e vardıklarında Peygamber'in ölümünü öğrendiler. Kays, Sana'a'ya girmesine izin verilene kadar el-Esved'i destekliyormuş gibi yaptı. Madhij, Hamdan ve diğerlerinden oluşan bir grupla birlikte girdi. Daha sonra, zaten İslam'ı kabul etmiş olan oğullardan biri olan Fayruz ibn el-Daylami'yi kazandı. Peygamber'in oğullarının lideri Badham'ı da yanlarına getirdiler. Rivayete göre Badham ölmüş ve yerine Dadhawayh geçmiştir. Dadhawayh İslam'ı kabul etmiş ve Kays ile tanışarak onu kendi safına çekmiştir. Ardından Peygamberin oğulları arasına elçilerini göndermiş ve onlar da İslam'ı kabul etmişlerdir. El-Aswad'ı öldürmek ve suikast düzenlemek için komplo kurmuşlardır. Gizlice, ona düşman olan karısı Marzbanah'ı bilgilendirmişlerdir. Marzbanah onlara evine girebilecekleri bir dere göstermiş veya bazı kaynaklara göre evin duvarına sirke ile bir delik açmışlardır. Şafak vakti, sarhoş ve uyurken evine girmişlerdir. Kays onu öldürmüş ve el-Aswad bir boğa gibi böğürmeye başlamış, muhafızlarını korkutmuştur. Muhafızlar, \"Yemen'in Merhametlisi'ne ne oldu?\" diye haykırmışlardır. Karısı aceleyle, \"Vahiy ona iniyor\" demiş ve böylece sakinleşmişlerdir. Kays, sabah olunca başını kesip surlara tırmandı ve Allah'ın büyüklüğünü ilan ederek, el-Esved'in yalancı ve Allah düşmanı olduğunu tasdik etti. Arkadaşları toplandı ve başını onlara fırlattı; birkaç kişi hariç hepsi dağıldı ve geri kalanları kılıçtan geçirdiler; İslam'a girenler dışında kimse kurtulamadı. Bazı rivayetçiler, onu öldürenin Feyruz ibn el-Daylami olduğunu, Kays'ın onun üzerinden geçip başını kestiğini ve Kays ile Feyruz'un Medine'deyken onu öldürdüklerini iddia ettiklerini, bunun üzerine Ömer'in \"Bu aslan onu öldürdü\" dediğini, yani Feyruz'u kastettiğini belirtmişlerdir. Bazı âlimler, öldürülmesinin Peygamber'in ölümünden beş gün önce olduğunu, bu yüzden hastalığı sırasında \"Allah el-Esved el-Ensi'yi öldürdü. Salih insan Feyruz ibn el-Daylami onu öldürdü\" dediğini ve bu haberin Ebu Bekir'e halife olduktan on gece sonra ulaştığını belirtmişlerdir. Kays, Dadhawayh'i öldürmekle suçlandı ve Ebu Bekir'e oğullarını Sana'a'dan kovmayı planladığı bildirildi; bu da Ebu Bekir'i öfkelendirdi. Bunun üzerine oradaki valisi El-Muhacir'e mektup yazarak onu yanına getirmesini emretti. Peygamberin minberinde Dadhawayh'i öldürmediğine dair elli kez yemin ettirdi, böylece onu serbest bırakıp Suriye'ye gönderdi."
  id: "Menurut Al-Baladhuri: Al-Aswad bin Ka’b bin Awf Al-Ansi bernubuat dan mengaku sebagai nabi, sehingga Ans dan yang lainnya mengikutinya. Ia menyebut dirinya Rahman Al-Yaman, sebagaimana Musaylimah menyebut dirinya Rahman Al-Yamamah. Ia memiliki seekor keledai terlatih yang ia perintahkan untuk sujud dan berlutut, sehingga ia disebut Dhu Al-Mar, dan dikatakan juga Dhu Al-Khimar karena kegemukan dan sorbannya yang selalu ada. Dikatakan bahwa ia disebut Al-Aswad karena wajahnya yang hitam, dan namanya adalah Ayhalah. Nabi mengutus Jarir bin Abdullah Al-Bajali kepadanya pada tahun kematiannya, menyerunya untuk masuk Islam, tetapi ia tidak menanggapi seruannya—dan beberapa perawi menyangkal misinya—dan ia datang ke Sana’a dan menaklukkannya serta mengusir utusan Nabi, Khalid bin Saeed bin Al-As (dan Al-Nu’man bin Yazid mengatakan salah satu putranya: Aban bin Saeed). Ia memihak Ziyad bin Labid, dan ia menaklukkan putra-putra—putra-putra Persia yang telah dikirim Khosrow ke Yaman bersama Ibn Dhi Yazan dan di bawah kekuasaan mereka, Wahriz—dan ia memanfaatkan serta menyakiti mereka, dan ia menikahi Marzbanah, istri Badham, raja mereka. Kemudian Nabi mengutus Qays ibn Hubayrah al-Makshuh al-Muradi—yang diberi nama demikian karena luka bakar di sisi tubuhnya akibat penyakit—dan memerintahkannya untuk memenangkan hati putra-putra Nabi. Beliau juga mengutus Farwah ibn Musayk al-Muradi bersamanya. Ketika mereka tiba di Yaman, mereka mengetahui tentang wafatnya Nabi. Qays berpura-pura mendukung al-Aswad sampai ia diizinkan masuk ke Sana'a. Ia masuk bersama sekelompok orang dari Madhhij, Hamdan, dan lainnya. Kemudian, ia memenangkan hati Fayruz ibn al-Daylami, salah satu putra Nabi, yang telah memeluk Islam. Mereka membawa Badham, pemimpin putra-putra Nabi. Dikatakan bahwa Badham telah meninggal dan digantikan oleh Dadhawayh, yang kemudian masuk Islam dan bertemu Qays, lalu membujuknya. Kemudian ia mengirim utusannya di antara putra-putra Nabi, dan mereka pun masuk Islam. Mereka bersekongkol untuk membunuh al-Aswad dan membunuhnya. Mereka secara diam-diam memberi tahu istrinya, Marzbanah, yang memusuhinya. Marzbanah menunjukkan kepada mereka sebuah sungai yang dapat mereka lewati untuk memasuki rumahnya—atau, menurut sebagian orang, mereka membuat lubang di dinding rumahnya dengan cuka. Mereka memasuki rumahnya saat fajar ketika ia mabuk dan tertidur. Qays membunuhnya, dan ia mulai meraung seperti banteng, menakutkan para pengawalnya, yang berseru, \"Ada apa dengan Yang Maha Penyayang dari Yaman?\" Istrinya segera berkata, \"Wahyu sedang turun kepadanya,\" sehingga mereka tenang. Qays memenggal kepalanya dan memanjat tembok kota ketika pagi tiba, dan ia menyatakan kebesaran Allah dan bersaksi bahwa al-Aswad adalah pendusta dan musuh Allah. Para sahabatnya berkumpul, dan dia melemparkan kepalanya kepada mereka, dan mereka bubar kecuali beberapa orang, dan mereka menodongkan pedang kepada sisanya, dan tidak ada yang selamat kecuali mereka yang masuk Islam. Beberapa perawi menyebutkan bahwa orang yang membunuhnya adalah Fayruz ibn al-Daylami, dan bahwa Qais melewatinya dan memenggal kepalanya, dan bahwa Qais dan Fayruz mengaku telah membunuhnya ketika mereka berada di Madinah, sehingga Umar berkata, \"Singa ini yang membunuhnya,\" yang berarti Fayruz. Beberapa ulama menyebutkan bahwa pembunuhannya terjadi lima hari sebelum wafatnya Nabi, sehingga beliau berkata selama sakitnya, \"Allah telah membunuh al-Aswad al-Ansi. Orang saleh Fayruz ibn al-Daylami yang membunuhnya,\" dan bahwa berita itu sampai kepada Abu Bakar sepuluh malam setelah beliau menjadi Khalifah. Qais dituduh membunuh Dadhawayh, dan Abu Bakar diberitahu bahwa dia berencana untuk mengusir putra-putra dari Sana'a, yang membuatnya marah. Maka ia menulis surat kepada Al-Muhajir, gubernurnya di sana, memerintahkannya untuk membawa Dadhawayh kepadanya. Ia menyuruh Dadhawayh bersumpah lima puluh kali di mimbar Nabi bahwa ia tidak membunuh Dadhawayh, lalu Al-Muhajir membebaskannya dan mengirimnya ke Suriah."
