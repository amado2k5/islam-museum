label: { ar: "قتل الأسود العنسي", en: "The Killing of al-Aswad al-Ansi" }
summary:
  ar: "عند البلاذري: الأسود بن كعب بن عوف العنسي تكهن وادعى النبوة فاتبعه عَنْس وغيرهم وسما نفسه رحمان اليمن كما تسمى مسيلمة رحمان اليمامة، وكان له حمار معلم يأمره فيسجد ويبرك فسمي ذا المار وقيل ذو الخمار لاتخامه واعتمامه أبداً وقيل سمي الأسود لسواد وجهه واسمه عيهلة؛ وبعث إليه النبي جرير بن عبد الله البجلي سنة وفاته يدعوه إلى الإسلام فلم يجبه — وبعض الرواة ينكر بعثته — وأتى صنعاء فغلب عليها وأخرج عنها عامل النبي خالد بن سعيد بن العاص (وقال النعمان بن يزيد أحد الأبناء: أبان بن سعيد) وانحاز إلى ناحية زياد بن لبيد، واستذل الأبناء — أولاد الفرس الذين وجههم كسرى إلى اليمن مع ابن ذي يزن وعليهم وهرز — واستخدمهم وأضرّ بهم وتزوج المرزبانة امرأة باذام ملكهم؛ فوجّه النبي قيس بن هبيرة المكشوح المرادي — سمي لكيّ على كشحه من داء — وأمره باستمالة الأبناء وبعث معه فروة بن مسيك المرادي، فلما صارا إلى اليمن بلغهما وفاة النبي فأظهر قيس للأسود أنه على رأيه حتى خلى بينه وبين دخول صنعاء فدخلها في جماعة من مذحج وهمدان وغيرهم، ثم استمال فيروز بن الديلمي أحد الأبناء وكان قد أسلم، وأتيا باذام رأس الأبناء وقيل إن باذام كان مات وخلّفه داذويه فأسلم داذويه ولقي قيساً فاستماله وبثّ دعاته في الأبناء فأسلموا، فتطابقوا على قتل الأسود واغتياله ودسّوا إلى المرزبانة امرأته فأعلمتهم وكانت شانئة له فدلتهم على جدول يدخل إليه منه — وقيل نقبوا جدار بيته بالخلّ نقباً — فدخلوا عليه سحراً وهو سكران نائم فذبحه قيس فجعل يخور خوار الثور حتى أفزع حرسه فقالوا ما شأن رحمان اليمن فبادرت امرأته فقالت «إن الوحي ينزل عليه» فسكنوا، واحتز قيس رأسه وعلا سور المدينة حين أصبح فكبر وشهد وأنّ الأسود كذاب عدو الله، فاجتمع أصحابه فألقى إليهم رأسه فتفرقوا إلا قليلاً ووضعوا السيف في بقيتهم فلم ينجُ إلا من أسلم؛ وذكر بعض الرواة أن الذي قتله فيروز بن الديلمي وأن قيساً أجاز عليه واحتز رأسه، وأن قيساً وفيروزاً ادعيا قتله وهما بالمدينة فقال عمر «قتله هذا الأسد» يعني فيروز؛ وذكر بعض أهل العلم أن قتله كان قبل وفاة النبي بخمسة أيام فقال في مرضه «قد قتل الله الأسود العنسي قتله الرجل الصالح فيروز بن الديلمي»، وأن الخبر ورد على أبي بكر بعد استخلافه بعشر ليال؛ واتُّهم قيس بقتل داذويه وبلغ أبي بكر أنه على إجلاء الأبناء عن صنعاء فأغضبه ذلك فكتب إلى المهاجر عامله عليها يأمره بحمله إليه فأحلفه خمسين يميناً عند منبر النبي أنه ما قتل داذويه فخلى سبيله ووجهه إلى الشام."
  en: "In al-Baladhuri: al-Aswad ibn Ka'b ibn Awf al-Ansi soothsaid and claimed prophecy, Ans and others followed him, and he styled himself Rahman of Yemen as Musaylima styled himself Rahman of al-Yamama; he had a trained donkey which would kneel and prostrate at his command whence he was called Dhu al-Mar — others say Dhu al-Khimar for being ever veiled and turbaned, and some Yemenis told al-Baladhuri his face was black, hence al-Aswad, his name being Ayhala; the Prophet sent Jarir ibn Abdullah al-Bajali to him in the year of his death calling him to Islam — some transmitters deny the mission — and he came to San'a, took it and expelled the Prophet's agent Khalid ibn Sa'id ibn al-As (al-Nu'man ibn Yazid of the Abna' says Aban ibn Sa'id), who withdrew toward Ziyad ibn Labid; he humiliated the Abna' — the sons of the Persians whom Kisra had sent to Yemen with Ibn Dhi Yazan under Wahriz — used them as labour and wronged them, and married the Marzbana, Badham their king's widow; the Prophet sent Qays ibn Hubayra al-Makshuh al-Muradi — so called for a cautery on his waist from an ailment — ordering him to win over the Abna', and sent with him Farwa ibn Musayk al-Muradi; reaching Yemen as the Prophet's death was reported, Qays feigned accord with al-Aswad until he entered San'a with a company of Madhhij, Hamdan and others, then won over Fayruz ibn al-Daylami of the Abna', who had embraced Islam, and the two came to Badham, chief of the Abna' — some say Badham was already dead and a successor named Dadhawayh converted and met Qays and won him over, spreading his missionaries among the Abna' until they converted; so they all agreed to kill and assassinate al-Aswad, and secretly informed his wife the Marzbana who, hating him, showed them a water-channel into his house — some say they pierced a hole in the wall of his chamber of vinegar — and entered on him at dawn while he lay drunk asleep, and Qays slaughtered him, his bellowing like a bull's startling the guards who asked 'what ails the Rahman of Yemen?' — his wife answered 'revelation descends on him' and they calmed; Qays cut off his head, stood on the city wall at dawn, magnified God and testified that al-Aswad was a liar and God's enemy, and when his followers gathered he cast the head to them and they scattered save a few, the sword falling on the remnant until none escaped but those who embraced Islam; some transmitters say Fayruz ibn al-Daylami killed him with Qays only striking off the head, and when Qays and Fayruz both claimed the killing in Medina Umar said 'this lion killed him' meaning Fayruz; some scholars date the killing five days before the Prophet's death — the Prophet saying in his illness 'God has killed al-Aswad al-Ansi; the righteous man Fayruz ibn al-Daylami killed him' — with the report reaching Abu Bakr ten nights into his caliphate; Qays was then accused of killing Dadhawayh and it reached Abu Bakr that he meant to expel the Abna' from San'a, which angered him, so he wrote to al-Muhajir his agent there to bring him, made him swear fifty oaths at the Prophet's minbar that he had not killed Dadhawayh, then released him and sent him to Syria."
