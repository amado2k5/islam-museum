id: event/ibn-al-zubayr-rebuilds-kaba
class: event
kind: founding
label: { ar: "عمارة ابن الزبير للكعبة", en: "Ibn al-Zubayr's rebuilding of the Ka'ba", es: "La reconstrucción de la Kaaba por Ibn al-Zubayr", fr: "La reconstruction de la Kaaba par Ibn al-Zubayr", ur: "ابن الزبیر کا خانہ کعبہ کی تعمیر نو", tr: "İbn el-Zübeyr'in Kâbe'yi inşa etmesi", id: "Pembangunan Ka'bah oleh Ibn al-Zubayr" }
summary:
  ar: "جدد ابن الزبير عمارة الكعبة فجعل لها بابين على قواعد إبراهيم وأدخل فيها ستة أذرع من الحجر، لما حدثته خالته عائشة عن النبي أنه قال لولا أن قومك حديثو عهد بشرك لهدمت الكعبة فألزقتها بالأرض وجعلت لها بابين باباً شرقياً وباباً غربياً وزدت فيها ستة أذرع من الحجر فإن قريشاً اقتصرتها حيث بنت الكعبة {cite:tarikh-khulafa-minhaj-1434 p. 349}. وكان أول من كساها الديباج في رواية وكانت كسوتها المسوح والأنطاع {cite:tarikh-khulafa-minhaj-1434 p. 351}. وعند المسعودي حمل إليه من صنعاء فسيفساء كنيسة أبرهة الحبشي وثلاثة أساطين من رخام منقوش محشو بالسندورس حتى من رآه ظنه ذهباً، وشهد عنده سبعون شيخاً من قريش أن قريشاً عجزت نفقتهم فنقصوا سبعة أذرع من أساس إبراهيم فزادها وجعل له بابين دخولاً وخروجاً، فلما قتله الحجاج أمره عبد الملك بهدمه ورده إلى بناء قريش وباب واحد {cite:muruj-al-dhahab p. 79}"
  en: "Ibn al-Zubayr renewed the Ka'ba's fabric, giving it two doors upon Abraham's foundations and restoring six cubits of the Hijr into it — following what his aunt Aisha had related of the Prophet: 'were your people not fresh from unbelief I would have razed the Ka'ba to the ground, made it an eastern and a western door, and added six cubits of the Hijr, for Quraysh scanted it when they built it'. One account makes him also the first to clothe it in dibaj, its coverings before having been hides and striped cloth {cite:tarikh-khulafa-minhaj-1434 p. 349, 351}."
  es: "Ibn al-Zubayr renovó la estructura de la Kaaba, añadiéndole dos puertas sobre los cimientos de Abraham y restaurando seis codos del Hijr, siguiendo lo que su tía Aisha había relatado del Profeta: «Si tu pueblo no estuviera recién salido de la incredulidad, habría arrasado la Kaaba, le habría puesto una puerta oriental y otra occidental, y le habría añadido seis codos del Hijr, pues los Quraysh la escatimaron cuando la construyeron». Un relato también lo considera el primero en cubrirla con dibaj, ya que sus cubiertas anteriores habían sido de pieles y tela a rayas {cite:tarikh-khulafa-minhaj-1434 p. 349, 351}."
  fr: "Ibn al-Zubayr restaura la Kaaba, lui ajoutant deux portes sur les fondations d'Abraham et rétablissant six coudées du Hijar, suivant ainsi le récit de sa tante Aïcha concernant le Prophète: « Si ton peuple n'était pas encore revenu de l'incroyance, j'aurais rasé la Kaaba, créé une porte à l'est et une à l'ouest, et ajouté six coudées du Hijar, car les Qurayshites l'avaient sous-estimée lors de sa construction. » Selon un autre récit, il fut également le premier à la revêtir de dibaj, ses couvertures précédentes étant faites de peaux et d'étoffes rayées (voir: Tarikh-Khulafa-Minhaj-1434, p. 349, 351)."
  ur: "ابن الزبیر نے کعبہ کے کپڑے کی تجدید کی، اسے ابراہیم کی بنیادوں پر دو دروازے دیے اور اس میں حجر کے چھ ہاتھ کو بحال کیا - اس کے بعد جو ان کی خالہ عائشہ ا نے نبی سے بیان کیا تھا: \"اگر آپ کی قوم کفر سے تازہ نہ ہوتی تو میں کعبہ کو زمین پر گرا دیتا، اور اس کے دروازے کو چھ ہاتھ بنا دیتا۔ ہجر، کیونکہ قریش نے جب اسے بنایا تو اس میں کمی کردی۔ ایک بیان نے اسے سب سے پہلے دبج کا لباس پہنایا، اس کے اوڑھنے سے پہلے چھپے ہوئے اور دھاری دار کپڑے تھے۔ 349، 351}۔"
  tr: "İbnü'zübeyr, İbrahim'in attığı temeller üzerine iki kapı daha ekleyerek ve Hicr'in (yarım daire şeklindeki duvarın) altı arşınlık kısmını da dahil ederek Kâbe'yi yeniledi. Bu, teyzesi Ayşe'nin kendisine rivayet ettiği bir hadise dayanıyordu; Ayşe, Peygamber'in şöyle buyurduğunu aktarmıştı: \"Eğer sizin halkınız yeni müşriklerden dönmemiş olsaydı, Kâbe'yi yıkıp yerle bir eder, doğuya ve batıya iki kapı ekler ve Hicr'in altı arşınlık kısmını da eklerdim, çünkü Kureyş Kâbe'yi inşa ederken onu kısaltmıştı.\" {kaynak:tarikh-khulafa-minhaj-1434 s. 349}. Bir rivayete göre, Kâbe'yi ilk kez ipek kumaşla kaplayan da oydu; daha önce kaba kumaş ve deriyle kaplıydı. {kaynak:tarikh-khulafa-minhaj-1434 s. 351}. Mesudi'nin evinde, Sana'a'dan Habeşli İbrahim'in kilisesinin mozaiklerini ve sandal ağacıyla doldurulmuş üç oyma mermer sütunu getirdi; gören herkes altın sandı. Kureyş'ten yetmiş şeyh ona şahitlik ederek, Kureyş'in bunu karşılayamayacağını, bu yüzden İbrahim'in temelinden yedi arşın kısaltıldığını söylediler. Bunun üzerine İbrahim onu tekrar yükseltti ve biri giriş diğeri çıkış için olmak üzere iki kapı yaptırdı. Haccac onu öldürünce, Abdülmalik ona kiliseyi yıkmasını ve Kureyş'in yapısına uygun olarak tek kapılı olarak yeniden yapmasını emretti. {kaynak: Muruj-al-dhahab s. 79}"
  id: "Ibn al-Zubayr merenovasi Ka'bah, menambahkan dua pintu berdasarkan fondasi yang diletakkan oleh Ibrahim, dan memasukkan enam hasta Hijr (dinding setengah lingkaran) ke dalamnya. Hal ini berdasarkan hadits yang diriwayatkan kepadanya oleh bibinya, Aisyah, yang mengutip sabda Nabi, \"Seandainya kaummu bukan mualaf baru dari kemusyrikan, aku akan merobohkan Ka'bah, meratakannya, dan memberinya dua pintu—satu di timur dan satu di barat—dan menambahkan enam hasta Hijr padanya, karena kaum Quraisy telah memperpendeknya ketika mereka membangun Ka'bah.\" {cite:tarikh-khulafa-minhaj-1434 hlm. 349}. Menurut salah satu riwayat, dialah yang pertama kali melapisinya dengan kain brokat; sebelumnya, Ka'bah ditutupi dengan kain kasar dan kulit. {cite:tarikh-khulafa-minhaj-1434 hlm. 351}. Dan di tempat Al-Mas’udi, beliau membawakan dari Sana’a mozaik gereja Ibrahim dari Abyssinia dan tiga pilar marmer berukir yang diisi dengan kayu cendana, sehingga siapa pun yang melihatnya mengira itu emas. Dan tujuh puluh syekh dari Quraisy bersaksi kepadanya bahwa Quraisy tidak mampu membiayainya, sehingga mereka mengurangi ukurannya tujuh hasta dari pondasi Ibrahim, lalu beliau menambah ukurannya dan membuat dua pintu untuknya, satu untuk masuk dan satu untuk keluar. Ketika Al-Hajjaj membunuhnya, Abd Al-Malik memerintahkannya untuk merobohkannya dan mengembalikannya ke konstruksi Quraisy dan satu pintu. {cite:muruj-al-dhahab p. 79}"
