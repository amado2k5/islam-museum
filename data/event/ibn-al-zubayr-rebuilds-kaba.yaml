id: event/ibn-al-zubayr-rebuilds-kaba
class: event
kind: founding
label: { ar: "عمارة ابن الزبير للكعبة" }
summary:
  ar: "جدد ابن الزبير عمارة الكعبة فجعل لها بابين على قواعد إبراهيم وأدخل فيها ستة أذرع من الحجر، لما حدثته خالته عائشة عن النبي أنه قال لولا أن قومك حديثو عهد بشرك لهدمت الكعبة فألزقتها بالأرض وجعلت لها بابين باباً شرقياً وباباً غربياً وزدت فيها ستة أذرع من الحجر فإن قريشاً اقتصرتها حيث بنت الكعبة {cite:tarikh-khulafa-minhaj-1434 p. 349}. وكان أول من كساها الديباج في رواية وكانت كسوتها المسوح والأنطاع {cite:tarikh-khulafa-minhaj-1434 p. 351}. وعند المسعودي حمل إليه من صنعاء فسيفساء كنيسة أبرهة الحبشي وثلاثة أساطين من رخام منقوش محشو بالسندورس حتى من رآه ظنه ذهباً، وشهد عنده سبعون شيخاً من قريش أن قريشاً عجزت نفقتهم فنقصوا سبعة أذرع من أساس إبراهيم فزادها وجعل له بابين دخولاً وخروجاً، فلما قتله الحجاج أمره عبد الملك بهدمه ورده إلى بناء قريش وباب واحد {cite:muruj-al-dhahab p. 79}"
  en: "Ibn al-Zubayr renewed the Ka'ba's fabric, giving it two doors upon Abraham's foundations and restoring six cubits of the Hijr into it — following what his aunt Aisha had related of the Prophet: 'were your people not fresh from unbelief I would have razed the Ka'ba to the ground, made it an eastern and a western door, and added six cubits of the Hijr, for Quraysh scanted it when they built it'. One account makes him also the first to clothe it in dibaj, its coverings before having been hides and striped cloth {cite:tarikh-khulafa-minhaj-1434 p. 349, 351}."
