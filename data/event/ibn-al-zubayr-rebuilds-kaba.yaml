id: event/ibn-al-zubayr-rebuilds-kaba
class: event
kind: founding
label: { ar: "عمارة ابن الزبير للكعبة", en: "Ibn al-Zubayr's rebuilding of the Ka'ba", es: "La reconstrucción de la Kaaba por Ibn al-Zubayr", fr: "La reconstruction de la Kaaba par Ibn al-Zubayr" }
summary:
  ar: "جدد ابن الزبير عمارة الكعبة فجعل لها بابين على قواعد إبراهيم وأدخل فيها ستة أذرع من الحجر، لما حدثته خالته عائشة عن النبي أنه قال لولا أن قومك حديثو عهد بشرك لهدمت الكعبة فألزقتها بالأرض وجعلت لها بابين باباً شرقياً وباباً غربياً وزدت فيها ستة أذرع من الحجر فإن قريشاً اقتصرتها حيث بنت الكعبة {cite:tarikh-khulafa-minhaj-1434 p. 349}. وكان أول من كساها الديباج في رواية وكانت كسوتها المسوح والأنطاع {cite:tarikh-khulafa-minhaj-1434 p. 351}. وعند المسعودي حمل إليه من صنعاء فسيفساء كنيسة أبرهة الحبشي وثلاثة أساطين من رخام منقوش محشو بالسندورس حتى من رآه ظنه ذهباً، وشهد عنده سبعون شيخاً من قريش أن قريشاً عجزت نفقتهم فنقصوا سبعة أذرع من أساس إبراهيم فزادها وجعل له بابين دخولاً وخروجاً، فلما قتله الحجاج أمره عبد الملك بهدمه ورده إلى بناء قريش وباب واحد {cite:muruj-al-dhahab p. 79}"
  en: "Ibn al-Zubayr renewed the Ka'ba's fabric, giving it two doors upon Abraham's foundations and restoring six cubits of the Hijr into it — following what his aunt Aisha had related of the Prophet: 'were your people not fresh from unbelief I would have razed the Ka'ba to the ground, made it an eastern and a western door, and added six cubits of the Hijr, for Quraysh scanted it when they built it'. One account makes him also the first to clothe it in dibaj, its coverings before having been hides and striped cloth {cite:tarikh-khulafa-minhaj-1434 p. 349, 351}."
  es: "Ibn al-Zubayr renovó la estructura de la Kaaba, añadiéndole dos puertas sobre los cimientos de Abraham y restaurando seis codos del Hijr, siguiendo lo que su tía Aisha había relatado del Profeta: «Si tu pueblo no estuviera recién salido de la incredulidad, habría arrasado la Kaaba, le habría puesto una puerta oriental y otra occidental, y le habría añadido seis codos del Hijr, pues los Quraysh la escatimaron cuando la construyeron». Un relato también lo considera el primero en cubrirla con dibaj, ya que sus cubiertas anteriores habían sido de pieles y tela a rayas {cite:tarikh-khulafa-minhaj-1434 p. 349, 351}."
  fr: "Ibn al-Zubayr restaura la Kaaba, lui ajoutant deux portes sur les fondations d'Abraham et rétablissant six coudées du Hijar, suivant ainsi le récit de sa tante Aïcha concernant le Prophète: « Si ton peuple n'était pas encore revenu de l'incroyance, j'aurais rasé la Kaaba, créé une porte à l'est et une à l'ouest, et ajouté six coudées du Hijar, car les Qurayshites l'avaient sous-estimée lors de sa construction. » Selon un autre récit, il fut également le premier à la revêtir de dibaj, ses couvertures précédentes étant faites de peaux et d'étoffes rayées (voir: Tarikh-Khulafa-Minhaj-1434, p. 349, 351)."
