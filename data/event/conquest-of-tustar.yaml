summary:
  ar: "فتح تستر وأسر الهرمزان: كان سببها أن يزدجرد وهو بمرو ظل يثير أهل فارس أسفًا على ما خرج من ملكهم فتحركوا وتكاتبوا هم وأهل الأهواز وتعاقدوا على النصرة، فكتب عمر إلى سعد أن ابعث إلى الأهواز جندًا كثيفًا مع النعمان بن مقرّن وعجّل فلينزلوا بإزاء الهرمزان ويتحققوا أمره، وكتب إلى أبي موسى أن ابعث جندًا كثيفًا وأمّر عليهم سهل بن عدي وابعث معه البراء بن مالك ومجزأة بن ثور وعرفجة بن هرثمة، فكان فتح رامهرمز وتستر وأسر الهرمزان {cite:kamil-ibn-al-athir p. 367-368}."
  en: "Tustar: Yazdegerd, safe at Marw, kept stinging the Persians over their lost kingdom until they and the Ahwaz folk bound themselves to mutual aid. 'Umar ordered Sa'd to send a dense army with al-Nu'man ibn al-Muqarrin to pin al-Hurmuzan, and Abu Musa to send another under Sahl ibn 'Adi with al-Bara' ibn Malik, Majza'a ibn Thawr and 'Arfaja ibn Harthama — the campaign that ended with Ramhurmuz and Tustar taken and al-Hurmuzan a prisoner {cite:kamil-ibn-al-athir p. 367-368}."
