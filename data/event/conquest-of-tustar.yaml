summary:
  ar: "فتح تستر وأسر الهرمزان: كان سببها أن يزدجرد وهو بمرو ظل يثير أهل فارس أسفًا على ما خرج من ملكهم فتحركوا وتكاتبوا هم وأهل الأهواز وتعاقدوا على النصرة، فكتب عمر إلى سعد أن ابعث إلى الأهواز جندًا كثيفًا مع النعمان بن مقرّن وعجّل فلينزلوا بإزاء الهرمزان ويتحققوا أمره، وكتب إلى أبي موسى أن ابعث جندًا كثيفًا وأمّر عليهم سهل بن عدي وابعث معه البراء بن مالك ومجزأة بن ثور وعرفجة بن هرثمة، فكان فتح رامهرمز وتستر وأسر الهرمزان {cite:kamil-ibn-al-athir p. 367-368}."
  en: "Tustar: Yazdegerd, safe at Marw, kept stinging the Persians over their lost kingdom until they and the Ahwaz folk bound themselves to mutual aid. 'Umar ordered Sa'd to send a dense army with al-Nu'man ibn al-Muqarrin to pin al-Hurmuzan, and Abu Musa to send another under Sahl ibn 'Adi with al-Bara' ibn Malik, Majza'a ibn Thawr and 'Arfaja ibn Harthama — the campaign that ended with Ramhurmuz and Tustar taken and al-Hurmuzan a prisoner {cite:kamil-ibn-al-athir p. 367-368}."
  es: "Tustar: Yazdegerd, a salvo en Marw, siguió molestando a los persas por su reino perdido hasta que ellos y el pueblo de Ahwaz se unieron en ayuda mutua. 'Umar ordenó a Sa'd que enviara un numeroso ejército con al-Nu'man ibn al-Muqarrin para acorralar a al-Hurmuzan, y a Abu Musa que enviara otro bajo el mando de Sahl ibn 'Adi con al-Bara' ibn Malik, Majza'a ibn Thawr y 'Arfaja ibn Harthama; la campaña terminó con Ramhurmuz y Tustar capturados y al-Hurmuzan prisionero {cite:kamil-ibn-al-athir p. 367-368}."
  fr: "Tustar: Yazdegerd, en sécurité à Marw, continua de harceler les Perses au sujet de leur royaume perdu jusqu'à ce que ces derniers et les habitants d'Ahwaz s'engagent à s'entraider. 'Umar ordonna à Sa'd d'envoyer une armée importante sous le commandement d'al-Nu'man ibn al-Muqarrin pour fixer al-Hurmuzan, et à Abu Musa d'en envoyer une autre sous les ordres de Sahl ibn 'Adi avec al-Bara' ibn Malik, Majza'a ibn Thawr et 'Arfaja ibn Harthama — la campagne se termina par la prise de Ramhurmuz et de Tustar et la capture d'al-Hurmuzan {cite: kamil-ibn-al-athir p. 367-368}."
  ur: "تسطار: یزدگرد، مارو میں محفوظ، فارسیوں کو ان کی کھوئی ہوئی سلطنت پر ڈنک مارتا رہا یہاں تک کہ وہ اور اہواز کے لوگ باہمی مدد کے لیے پابند ہو گئے۔ عمر نے سعد کو حکم دیا کہ وہ نعمان بن المقررین کے ساتھ ہرمزان کو پکڑنے کے لیے ایک گھنی فوج بھیجے اور ابو موسیٰ کو سہل بن عدی کی قیادت میں ایک اور فوج بھیجنے کا حکم براء بن مالک، مازعہ ابن ثور اور عرفجہ ابن حارثمہ کے ساتھ ہو، جس نے رمضان المبارک اور توحور کے ساتھ مہم ختم کی۔ قیدی {حوالہ: کامل ابن الاثیر ص۔ 367-368}۔"
