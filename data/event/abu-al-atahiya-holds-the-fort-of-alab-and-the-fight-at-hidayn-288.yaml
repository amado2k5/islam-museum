id: event/abu-al-atahiya-holds-the-fort-of-alab-and-the-fight-at-hidayn-288
class: event
kind: other
label:
  ar: "أبو العتاهية في قلعة علب والقتال بحدين، شوال 288هـ"
  en: "Abu al-Atahiya at the fort of Alab and the fight at Hidayn, Shawwal 288 AH"
  fr: "Abu al-Atahiya au fort d’Alab et le combat de Hidayn, shawwal 288 de l’hégire"
  ur: "ابو العتاہیہ قلعۂ علب میں اور حدین کی لڑائی، شوال 288ھ"
  es: "Abu al-Atahiya en el fuerte de Alab y la batalla de Hidayn, Shawwal 288 AH"
  tr: "Ebu el-Atahiye, Alab kalesinde ve iki koldan yapılan savaşta, Şevval 288 Hicri."
  id: "Abu al-Atahiyah di benteng Alab dan pertempuran dua arah, Syawal 288 H"
summary:
  ar: "أمر الهادي في يوم الاثنين لخمسة أيام داخلة من شوال أبا العتاهية فخرج في عسكر إلى قلعة علب وبات بها، فلما كان صلاة الصبح أغارت عليه خيل القوم فنزل فطردهم، ثم خرج القوم بعسكرهم إلى موضع يقال له حدين، فخرج الهادي بجميع عسكره وعبأ أصحابه ميمنة وميسرة وقلباً، وحمل على الميسرة وقلبهم فهزمهم."
  en: "On Monday, five days gone into Shawwal, al-Hadi ordered Abu al-Atahiya to go out with an army to the fort of Alab, where he passed the night; at the morning prayer the men's horse raided him, he came down and drove them off, then the men came out with their army to a place called Hidayn; al-Hadi went out with all his army, drew up his men in right, left and centre, charged the left and the centre and routed them."
  fr: "Le lundi, cinq jours après le début de shawwal, al-Hadi ordonna à Abu al-Atahiya de sortir avec une armée vers le fort d’Alab, où il passa la nuit ; à la prière du matin, les cavaliers adverses l’attaquèrent, il descendit et les repoussa, puis les hommes sortirent avec leur armée à un lieu appelé Hidayn. Al-Hadi sortit avec toute son armée, disposa ses hommes en aile droite, aile gauche et centre, chargea l’aile gauche et le centre et les mit en déroute."
  ur: "پیر کے دن، شوال کے پانچ دن گزرنے پر، ہادی نے ابو العتاہیہ کو حکم دیا تو وہ لشکر کے ساتھ علب کے قلعے گئے اور وہیں رات گزاری؛ فجر کی نماز کے وقت مخالفوں کے سواروں نے ان پر حملہ کیا، وہ اترے اور انہیں بھگا دیا، پھر مخالف اپنے لشکر کے ساتھ حدین نامی جگہ گئے، اور ہادی اپنے تمام لشکر کے ساتھ نکلے، ساتھیوں کو دائیں، بائیں اور قلب میں ترتیب دیا اور بائیں بازو اور قلب پر حملہ کر کے انہیں شکست دی۔"
  es: "El lunes, cinco días después de iniciado Shawwal, al-Hadi ordenó a Abu al-Atahiya que saliera con un ejército hacia el fuerte de Alab, donde pasó la noche; durante la oración de la mañana, los caballos de los hombres lo atacaron, él bajó y los ahuyentó, luego los hombres salieron con su ejército a un lugar llamado Hidayn; al-Hadi salió con todo su ejército, formó a sus hombres a derecha, izquierda y centro, cargó contra la izquierda y el centro y los derrotó."
  tr: "Şevval ayının beşinci günü olan Pazartesi günü, Hadid, Ebu'l-Atahiye'ye bir orduyla Alab kalesine gidip geceyi orada geçirmesini emretti. Sabah namazı vakti geldiğinde, halkın süvarileri ona saldırdı; bunun üzerine atından indi ve onları püskürttü. Daha sonra halk ordularıyla Haddain denilen bir yere gitti. Hadid bütün ordusuyla birlikte oraya çıktı ve arkadaşlarını sağa, sola ve ortaya yerleştirdi; sol ve ortadaki birliklere saldırdı ve onları yenilgiye uğrattı."
  id: "Pada hari Senin, lima hari setelah bulan Syawal, Al-Hadi memerintahkan Abu Al-Atahiyah untuk pergi bersama pasukan ke benteng Alab dan bermalam di sana. Ketika waktu salat subuh tiba, pasukan kavaleri rakyat menyerangnya, sehingga ia turun dari kudanya dan mengusir mereka. Kemudian rakyat pergi bersama pasukan mereka ke suatu tempat bernama Haddain. Al-Hadi pergi bersama seluruh pasukannya dan mengatur para pengikutnya di sisi kanan, kiri, dan tengah, lalu ia menyerang sisi kiri dan tengah dan mengalahkan mereka."
