label:
  ar: "الشيرازي يصنف اللمع والتنبيه وطبقات الفقهاء، نحو ٤٥٠-٤٥٣هـ"
  en: "Al-Shirazi composes al-Luma', al-Tanbih and Tabaqat al-fuqaha, c. 450-453/1058-1061"
  ur: "شیرازی کی تصانیف: اللمع، التنبیہ اور طبقات الفقہاء، تقریباً 450-453ھ/1058-1061ء"
  es: "Al-Shirazi compone al-Luma', al-Tanbih y Tabaqat al-fuqaha, c. 450-453/1058-1061"
  fr: "Al-Shirazi compose al-Luma', al-Tanbih et Tabaqat al-fuqaha, c. 450-453/1058-1061"
  tr: "El-Şirazi, El-Luma', El-Tanbih ve Tabakat El-Fukaha'yı H. 450-453 civarında sınıflandırmıştır."
  id: "Al-Shirazi mengklasifikasikan Al-Luma' dan Al-Tanbih dan Tabaqat Al-Fuqaha', sekitar tahun 450-453 H."
summary:
  ar: "نحو سنة ٤٥٠هـ صنّف الشيرازي مختصره في أصول الفقه «اللمع في أصول الفقه»، ثم كتب بين ٤٥٢ و٤٥٣هـ متن «التنبيه في الفقه» الذي جاءت عليه أكثر من سبعين شرحاً، وفي نحو ٤٥٢هـ صنّف «طبقات الفقهاء»، من أقدم ما بقي من كتب التراجم الفقهية، يجمع فيه فقهاء المذاهب المجتهدين قبل أن تنحصر الطبقات في مذهب واحد {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}."
  en: "About 450/1058 al-Shirazi composed his manual of usul al-fiqh, al-Luma'; between 452/1060 and 453/1061 he wrote the fiqh epitome al-Tanbih, which drew more than seventy commentaries; and about 452/1060 he composed Tabaqat al-fuqaha, one of the oldest surviving works of its genre, recording the mujtahid jurists of all schools before tabaqat literature narrowed to a single madhhab {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}."
  ur: "تقریباً 450ھ/1058ء میں شیرازی نے اصولِ فقہ کا مختصر «اللمع» تصنیف کیا؛ 452-453ھ/1060-1061ء میں فقہ کا متن «التنبیہ» لکھا جس پر ستر سے زائد شروحات لکھی گئیں؛ اور تقریباً 452ھ/1060ء میں «طبقات الفقہاء» تصنیف کی جو اپنے نوع کی قدیم ترین باقی کتابوں میں ہے اور تمام مذاہب کے مجتہد فقہاء کو یکجا کرتی ہے {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}۔"
  es: "Hacia el año 450/1058, al-Shirazi compuso su manual de usul al-fiqh, al-Luma'; entre 452/1060 y 453/1061 escribió el epítome de fiqh al-Tanbih, que recibió más de setenta comentarios; y hacia el año 452/1060 compuso Tabaqat al-fuqaha, una de las obras más antiguas que se conservan de su género, que registra a los juristas mujtahid de todas las escuelas antes de que la literatura tabaqat se redujera a un solo madhhab {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}."
  fr: "Vers 450/1058, al-Shirazi composa son manuel d'usul al-fiqh, al-Luma'; entre 452/1060 et 453/1061, il écrivit l'abrégé de fiqh al-Tanbih, qui inspira plus de soixante-dix commentaires; et vers 452/1060, il composa Tabaqat al-fuqaha, l'une des plus anciennes œuvres survivantes de son genre, recensant les juristes mujtahid de toutes les écoles avant que la littérature tabaqat ne se réduise à un seul madhhab {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}."
  tr: "Hicri 450 yılı civarında Şirazi, fıkıh esasları üzerine özet eseri olan “El-Luma’ fi Usul el-Fıkh”ı derledi; ardından Hicri 452 ile 453 yılları arasında yetmişten fazla tefsir içeren “El-Tanbih fi el-Fıkh” metnini yazdı. Hicri 452 yılı civarında ise, fıkıh biyografilerinin en eski günümüze ulaşan kitaplarından biri olan “Tabakat el-Fıkha’yı” derledi. Bu eserde, sınıflar tek bir mezhebe hapsolmadan önce müçtehit olan farklı mezheplerin fıkıhçılarını bir araya getirmiştir. {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}"
  id: "Sekitar tahun 450 H, Al-Shirazi menyusun ringkasan prinsip-prinsip fiqih, “Al-Luma’ fi Usul al-Fiqh,” kemudian antara tahun 452 dan 453 H ia menulis teks “Al-Tanbih fi al-Fiqh,” yang memiliki lebih dari tujuh puluh komentar. Sekitar tahun 452 H ia menyusun “Tabaqat al-Fuqaha’,” salah satu buku biografi fiqih tertua yang masih ada, di mana ia mengumpulkan para ahli hukum dari berbagai mazhab yang merupakan mujtahid sebelum kelas-kelas dibatasi pada satu mazhab saja. {cite:encyclopaedia-of-islam-2 vol. 9 p. 495}."
