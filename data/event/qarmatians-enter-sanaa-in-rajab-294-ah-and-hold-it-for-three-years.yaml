id: "event/qarmatians-enter-sanaa-in-rajab-294-ah-and-hold-it-for-three-years"
class: event
kind: other
label:
  ar: "يدخل القرامطة صنعاء في رجب سنة 294هـ ويقيمون بها ثلاث سنين إلا أحد عشر يوما، ص394"
  en: "The Qarmatians enter Sanaa in Rajab 294 AH and hold it for three years less eleven days, p. 394"
  ur: "قرامطہ رجب 294ھ میں صنعاء میں داخل ہوتے ہیں اور تین سال گیارہ دن کم قیام کرتے ہیں، ص394"
  es: "Los cármatas entran en Saná en Rajab 294 AH y la controlan durante tres años menos once días, pág. 394."
summary:
  ar: "يدخل القرامطة صنعاء أول رجب سنة 294هـ يوم السبت، فيستبيحونها، ويقتلون من فيها في دور العلويين وغيرهم، ويقيمون بها ثلاث سنين إلا أحد عشر يوما."
  en: "On Saturday, the first of Rajab 294 AH, the Qarmatians enter Sanaa and sack it, killing those in the houses of the Alawis and others. They hold the city for three years less eleven days."
  ur: "رجب 294ھ کی پہلی تاریخ، ہفتے کے دن، قرامطہ صنعاء میں داخل ہو کر اسے تاراج کرتے ہیں اور علویوں کے گھروں سمیت شہر کے لوگوں کو قتل کرتے ہیں۔ وہ تین سال گیارہ دن کم شہر پر قابض رہتے ہیں۔"
  es: "El sábado primero de Rajab del año 294 de la Hégira, los cármatas entraron en Saná y la saquearon, matando a los habitantes de las casas de los alauitas y otros. Mantuvieron el control de la ciudad durante tres años menos once días."
