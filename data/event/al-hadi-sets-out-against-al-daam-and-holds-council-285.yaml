id: event/al-hadi-sets-out-against-al-daam-and-holds-council-285
class: event
kind: other
label:
  ar: الهادي يخرج إلى موضع لبني ربيعة ويستشير في حرب الدعام، 3 شوال 285هـ
  en: Al-Hadi sets out to a place of Banu Rabi'a and takes counsel on war with al-Da'am, 3 Shawwal 285 AH
  ur: ہادی بنو ربیعہ کے ایک مقام کی طرف نکلتے اور دعام سے جنگ پر مشورہ کرتے ہیں، 3 شوال 285ھ
summary:
  ar: لما بلغ الهادي دخول الدعام أثافت خرج من موضعه إلى موضع لبني ربيعة وبات ليلة السبت وهي ليلة الفطر، ثم أرسل الصراخ في الناس فاجتمعوا إليه يوم الاثنين لثلاث خلت من شوال سنة 285هـ، فتشاوروا وسد رأيهم جميعاً على الحرب.
  en: When al-Hadi heard that al-Da'am had entered Athafit he left his place for a place of Banu Rabi'a and spent the night of Saturday, the night of the Fitr; he then sent criers among the people and they gathered on Monday, three days into Shawwal 285 AH, took counsel together and agreed as one on war.
  ur: جب ہادی کو دعام کے اثافت میں داخل ہونے کی خبر ملی تو وہ اپنی جگہ سے بنو ربیعہ کے ایک مقام کی طرف نکلے اور ہفتے کی رات، جو عید الفطر کی رات تھی، وہیں گزاری؛ پھر لوگوں میں منادی بھیجی تو وہ پیر کے دن شوال 285ھ کی تین تاریخ کو جمع ہوئے، مشورہ کیا اور سب جنگ پر متفق ہوئے۔
