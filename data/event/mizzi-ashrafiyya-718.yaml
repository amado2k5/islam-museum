label:
  ar: "المزي يتولى مشيخة دار الحديث الأشرفية بدمشق، سنة ٧١٨هـ"
  en: "Al-Mizzi takes the shaykhhood of Dar al-Hadith al-Ashrafiyya, Damascus, 718/1318"
  ur: "مزی کا دمشق میں دار الحدیث اشرفیہ کی مشیخت سنبھالنا، 718ھ/1318ء"
  es: "Al-Mizzi asume el título de shaykh de Dar al-Hadith al-Ashrafiyya, Damasco, 718/1318"
  fr: "Al-Mizzi prend la cheikhité de Dar al-Hadith al-Ashrafiyya, Damas, 718/1318"
  tr: "El-Mizzi, H. 718 yılında Şam'da Dar el-Hadis el-Eşrefiyye Şeyhi görevini üstlendi."
  id: "Al-Mizzi menjabat sebagai Syekh Dar al-Hadits al-Ashrafiyya di Damaskus pada tahun 718 H."
summary:
  ar: "ولي المزي دار الحديث سنة ثمان عشرة وسبعمائة بعد ابن الشريشي {cite:tarikh-islam-dhahabi p. 491}، وكان ابن تيمية هو الذي سعى له في توليتها {cite:tarikh-islam-dhahabi p. 492}؛ ومن ٧١٨/١٣١٩م صار رئيساً لدار الحديث الأشرفية، أحد أعظم مدارس الحديث بدمشق، وهي وقف، واشترط واقفها أن يكون شيخها أشعري العقيدة فكتب بخطه أنه أشعري، ومع ذلك شكك كثيرون في صدقه لصحبته ابن تيمية {cite:encyclopaedia-of-islam-2 vol. 7 p. 240} {cite:tabaqat-shafiiyya-subki j.10 p. 398}."
  en: "Al-Mizzi took charge of the dar al-hadith in 718/1318 after Ibn al-Shirishi {cite:tarikh-islam-dhahabi p. 491}, and it was Ibn Taymiyya who had worked for his appointment {cite:tarikh-islam-dhahabi p. 492}. From 718/1319 he was head of the Dar al-Hadith al-Ashrafiyya, one of the great hadith academies of Damascus and a waqf; its founder had stipulated the shaykh be Ash'ari in creed, so al-Mizzi wrote in his own hand that he was an Ash'ari — yet many doubted his sincerity because of his companionship with Ibn Taymiyya {cite:encyclopaedia-of-islam-2 vol. 7 p. 240} {cite:tabaqat-shafiiyya-subki j.10 p. 398}."
  ur: "مزی 718ھ/1318ء میں ابن الشریشی کے بعد دار الحدیث کے شیخ مقرر ہوئے {cite:tarikh-islam-dhahabi p. 491} اور ان کی اس تقرری کے لیے ابن تیمیہ نے کوشش کی تھی {cite:tarikh-islam-dhahabi p. 492}؛ 718ھ/1319ء سے وہ دمشق کی عظیم درسگاہ دار الحدیث اشرفیہ کے سربراہ رہے جو ایک وقف تھا؛ واقف نے شرط رکھا تھا کہ شیخ اشعری عقیدہ ہو، اس لیے مزی نے اپنے ہاتھ سے لکھا کہ وہ اشعری ہیں، لیکن ابن تیمیہ کی صحبت کے سبب بہت سے لوگ ان کی صداقت پر شک کرتے رہے {cite:encyclopaedia-of-islam-2 vol. 7 p. 240} {cite:tabaqat-shafiiyya-subki j.10 p. 398}۔"
  es: "Al-Mizzi se hizo cargo del dar al-hadith en 718/1318 después de Ibn al-Shirishi {cite:tarikh-islam-dhahabi p. 491}, y fue Ibn Taymiyya quien trabajó para su nombramiento {cite:tarikh-islam-dhahabi p. 492}. Desde 718/1319 fue jefe del Dar al-Hadith al-Ashrafiyya, una de las grandes academias de hadices de Damasco y un waqf; su fundador había estipulado que el shaykh fuera Ash'ari en credo, por lo que al-Mizzi escribió de su puño y letra que era un Ash'ari; sin embargo, muchos dudaron de su sinceridad debido a su compañía con Ibn Taymiyya {cite:encyclopaedia-of-islam-2 vol. 7 p. 240} {cite:tabaqat-shafiiyya-subki j.10 p. 398}."
  fr: "Al-Mizzi prit la direction du Dar al-Hadith en 718/1318 après Ibn al-Shirishi (voir: Tarikh Islam Dhahabi, p. 491), et c’est Ibn Taymiyya qui avait œuvré pour sa nomination (voir: Tarikh Islam Dhahabi, p. 492). À partir de 718/1319, il dirigea le Dar al-Hadith al-Ashrafiyya, l’une des plus grandes académies de hadith de Damas et un waqf; son fondateur avait stipulé que le cheikh devait être ash’arite, aussi al-Mizzi écrivit-il de sa propre main qu’il était ash’arite; pourtant, beaucoup doutèrent de sa sincérité en raison de sa proximité avec Ibn Taymiyya (voir: Encyclopaedia of Islam, vol. 7, p. 240). 398}."
  tr: "Veli el-Mizzi, İbn el-Şarişi'den sonra Hicri 718 yılında Hadis mezhebinin başına getirildi {kaynak:tarikh-islam-dhahabi s. 491}. Onu bu göreve getirmek isteyen İbn Taymiyye idi {kaynak:tarikh-islam-dhahabi s. 492}. Hicri 718/Miladi 1319'dan itibaren Şam'ın en büyük hadis mezheplerinden biri olan Eşrafiyye Hadis Mezhebi'nin başına geçti. Bu bir vakıf mezhebinin kurucusu, başının inanç olarak Eş'ari olmasını şart koşmuştu. Kendi el yazısıyla Eş'ari olduğunu yazmış olsa da, İbn Taymiyye ile olan ilişkisi nedeniyle birçok kişi samimiyetinden şüphe duymuştu {kaynak:encyclopaedia-of-islam-2 cilt 7 s. 240} {kaynak:tabaqat-shafiiyya-subki cilt 10 s. 398}."
  id: "Wali al-Mizzi diangkat menjadi kepala mazhab Hadits pada tahun 718 H, setelah Ibn al-Sharishi {cite:tarikh-islam-dhahabi hlm. 491}. Ibn Taymiyyah-lah yang berusaha agar ia diangkat ke posisi tersebut {cite:tarikh-islam-dhahabi hlm. 492}. Sejak 718 H/1319 M, ia menjadi kepala Mazhab Hadits Ashrafiyyah, salah satu mazhab Hadits terbesar di Damaskus. Mazhab ini merupakan wakaf, dan pendirinya menetapkan bahwa kepala mazhab haruslah seorang Ash'ari. Ia sendiri menulis bahwa dirinya adalah seorang Ash'ari, namun banyak yang meragukan ketulusannya karena hubungannya dengan Ibn Taymiyyah {cite:encyclopaedia-of-islam-2 vol. 7 hlm. 240} {cite:tabaqat-shafiiyya-subki j.10 hlm. 398}."
