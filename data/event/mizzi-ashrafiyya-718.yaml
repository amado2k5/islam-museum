id: event/mizzi-ashrafiyya-718
class: event
kind: other
label:
  ar: "المزي يتولى مشيخة دار الحديث الأشرفية بدمشق، سنة ٧١٨هـ"
  en: "Al-Mizzi takes the shaykhhood of Dar al-Hadith al-Ashrafiyya, Damascus, 718/1318"
  ur: "مزی کا دمشق میں دار الحدیث اشرفیہ کی مشیخت سنبھالنا، 718ھ/1318ء"
summary:
  ar: "ولي المزي دار الحديث سنة ثمان عشرة وسبعمائة بعد ابن الشريشي {cite:tarikh-islam-dhahabi p. 491}، وكان ابن تيمية هو الذي سعى له في توليتها {cite:tarikh-islam-dhahabi p. 492}؛ ومن ٧١٨/١٣١٩م صار رئيساً لدار الحديث الأشرفية، أحد أعظم مدارس الحديث بدمشق، وهي وقف، واشترط واقفها أن يكون شيخها أشعري العقيدة فكتب بخطه أنه أشعري، ومع ذلك شكك كثيرون في صدقه لصحبته ابن تيمية {cite:encyclopaedia-of-islam-2 vol. 7 p. 240} {cite:tabaqat-shafiiyya-subki j.10 p. 398}."
  en: "Al-Mizzi took charge of the dar al-hadith in 718/1318 after Ibn al-Shirishi {cite:tarikh-islam-dhahabi p. 491}, and it was Ibn Taymiyya who had worked for his appointment {cite:tarikh-islam-dhahabi p. 492}. From 718/1319 he was head of the Dar al-Hadith al-Ashrafiyya, one of the great hadith academies of Damascus and a waqf; its founder had stipulated the shaykh be Ash'ari in creed, so al-Mizzi wrote in his own hand that he was an Ash'ari — yet many doubted his sincerity because of his companionship with Ibn Taymiyya {cite:encyclopaedia-of-islam-2 vol. 7 p. 240} {cite:tabaqat-shafiiyya-subki j.10 p. 398}."
  ur: "مزی 718ھ/1318ء میں ابن الشریشی کے بعد دار الحدیث کے شیخ مقرر ہوئے {cite:tarikh-islam-dhahabi p. 491} اور ان کی اس تقرری کے لیے ابن تیمیہ نے کوشش کی تھی {cite:tarikh-islam-dhahabi p. 492}؛ 718ھ/1319ء سے وہ دمشق کی عظیم درسگاہ دار الحدیث اشرفیہ کے سربراہ رہے جو ایک وقف تھا؛ واقف نے شرط رکھا تھا کہ شیخ اشعری عقیدہ ہو، اس لیے مزی نے اپنے ہاتھ سے لکھا کہ وہ اشعری ہیں، لیکن ابن تیمیہ کی صحبت کے سبب بہت سے لوگ ان کی صداقت پر شک کرتے رہے {cite:encyclopaedia-of-islam-2 vol. 7 p. 240} {cite:tabaqat-shafiiyya-subki j.10 p. 398}۔"
