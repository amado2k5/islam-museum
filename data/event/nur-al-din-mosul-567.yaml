summary:
  ar: "ملك نور الدين الموصل داخلاً إليها وأقرّ عليها سيف الدين غازي بن قطب الدين مودود، بعد أن جمع إليه أمراءه ونظّم مملكته، ولم يزل نور الدين يضم بلاد الشام والجزيرة مدينة مدينة حتى لم يبق لأحد من الملوك إلا الاسم {cite:kamil-ibn-al-athir p. 31}."
  en: "Nūr al-Dīn entered and took Mosul, then confirmed Sayf al-Dīn Ghāzī ibn Mawdūd as its lord — continuing the city-by-city gathering of Syria and the Jazira until his fellow kings kept only their names {cite:kamil-ibn-al-athir p. 31}."
  es: "Nūr al-Dīn entró y tomó Mosul, luego confirmó a Sayf al-Dīn Ghāzī ibn Mawdūd como su señor, continuando la reunión ciudad por ciudad de Siria y la Jazira hasta que sus compañeros reyes conservaron solo sus nombres {cite:kamil-ibn-al-athir p. 31}."
  fr: "Nūr al-Dīn entra et prit Mossoul, puis confirma Sayf al-Dīn Ghāzī ibn Mawdūd comme son seigneur — poursuivant le rassemblement ville par ville de la Syrie et de la Jazira jusqu'à ce que ses pairs rois ne conservent que leurs noms {cite:kamil-ibn-al-athir p. 31}."
  ur: "نورالدین داخل ہوا اور موصل پر قبضہ کیا، پھر سیف الدین غازی ابن مودود کو اس کا آقا ہونے کی تصدیق کی - شام اور جزیرہ کے شہر شہر اجتماع کو جاری رکھا یہاں تک کہ اس کے ساتھی بادشاہوں نے صرف اپنے نام ہی رکھے۔ 31}۔"
  tr: "Nur ed-Din, Musul'a girdi ve prenslerini yanına toplayıp krallığını düzenledikten sonra, Saif ed-Din Gazi ibn Kutb ed-Din Mevdud'u hükümdar olarak onayladı. Nur ed-Din, Levant ve Cezire'yi şehir şehir ilhak etmeye devam etti ve krallardan geriye sadece isimleri kaldı. {Kaynak: Kamil ibn el-Athir s. 31}"
  id: "Nur ad-Din memasuki Mosul dan mengukuhkan Saif ad-Din Ghazi ibn Qutb ad-Din Mawdud sebagai penguasanya, setelah ia mengumpulkan para pangerannya dan mengatur kerajaannya. Nur ad-Din terus mencaplok Levant dan Jazira kota demi kota hingga tidak ada lagi yang tersisa dari para raja kecuali nama mereka {cite:kamil-ibn-al-athir p. 31}."
