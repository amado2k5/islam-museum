label: { ar: "الخلع العباسية على ابن هود" }
summary:
  ar: "لما ثار ابن هود على الموحدين واستولى على الأندلس دعا إلى الخليفة العباسي الذي كان أكثر الملوك في ذلك الزمان يدينون بطاعته، فوصله الكتاب العباسي الكريم من بغداد بولاية الأندلس، فهنأه أبو المطرف قاضي شاطبة بكتاب فيه أن الخلع العباسية ثارت فيه في أعلى الصور وبرز منها للعيون ما يعثر البليغ عند وصفه، وأن يوم ذلك بالأندلس أشبه يوم خرجت الرايات السود من خراسان، وأن البردة التي باشرها باشرت البدن الذي طاب حياً وميتاً فهو علو في الإسناد لا نظير له في العوالي، وانتهى إلى أن الدولة العباسية خُطب لها ببلاد الأندلس {cite:nafh-tib-maqqari p. 319-321}."
  en: "Ibn Hud, having risen against the Almohads and taken al-Andalus, proclaimed the Abbasid caliph; the investiture document and black robes arrived from Baghdad, and the qadi Abu l-Mutarrif congratulated him that its day resembled the day the black banners came out of Khurasan — the Abbasid da'wa preached once more in al-Andalus {cite:nafh-tib-maqqari p. 319-321}."
