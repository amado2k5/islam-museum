id: event/abbasid-investiture-ibn-hud
class: event
kind: other
label: { ar: "الخلع العباسية على ابن هود", en: "Abbasid Investiture of Ibn Hud", fr: "Investiture abbasside d’Ibn Hud", es: "Investidura abasí de Ibn Hud", ur: "ابن ہود کی عباسی سرمایہ کاری", tr: "İbn Hud'a Abbasi şeref elbiseleri giydirildi.", id: "Jubah kehormatan Abbasiyah yang dikenakan oleh Ibnu Hud" }
summary:
  ar: "لما ثار ابن هود على الموحدين واستولى على الأندلس دعا إلى الخليفة العباسي الذي كان أكثر الملوك في ذلك الزمان يدينون بطاعته، فوصله الكتاب العباسي الكريم من بغداد بولاية الأندلس، فهنأه أبو المطرف قاضي شاطبة بكتاب فيه أن الخلع العباسية ثارت فيه في أعلى الصور وبرز منها للعيون ما يعثر البليغ عند وصفه، وأن يوم ذلك بالأندلس أشبه يوم خرجت الرايات السود من خراسان، وأن البردة التي باشرها باشرت البدن الذي طاب حياً وميتاً فهو علو في الإسناد لا نظير له في العوالي، وانتهى إلى أن الدولة العباسية خُطب لها ببلاد الأندلس {cite:nafh-tib-maqqari p. 319-321}."
  en: "Ibn Hud, having risen against the Almohads and taken al-Andalus, proclaimed the Abbasid caliph; the investiture document and black robes arrived from Baghdad, and the qadi Abu l-Mutarrif congratulated him that its day resembled the day the black banners came out of Khurasan — the Abbasid da'wa preached once more in al-Andalus {cite:nafh-tib-maqqari p. 319-321}."
  fr: "Ibn Hud, après s’être soulevé contre les Almohades et avoir pris al-Andalus, proclama le calife abbasside ; le document d’investiture et les robes noires arrivèrent de Bagdad, et le cadi Abu l-Mutarrif le félicita en comparant ce jour à celui où les bannières noires étaient sorties du Khurasan : la da'wa abbasside était de nouveau proclamée en al-Andalus {cite:nafh-tib-maqqari p. 319-321}."
  es: "Ibn Hud, tras alzarse contra los almohades y tomar al-Ándalus, proclamó califa abasí; el documento de investidura y las túnicas negras llegaron de Bagdad, y el cadí Abu l-Mutarrif lo felicitó diciendo que ese día se parecía al día en que las banderas negras salieron de Jorasán: la da'wa abasí predicó una vez más en al-Ándalus {cite:nafh-tib-maqqari p. 319-321}."
  ur: "ابن ہود نے المحدث کے خلاف اٹھ کر اندلس پر قبضہ کر کے عباسی خلیفہ کا اعلان کیا۔ سرمایہ کاری کی دستاویز اور سیاہ پوشاک بغداد سے پہنچے، اور قاضی ابو المطرف نے انہیں مبارکباد دی کہ اس کا دن اس دن سے مشابہ ہے جس دن خراسان سے سیاہ جھنڈے نکلے تھے - عباسی دعوت نے ایک بار پھر الاندلس میں تبلیغ کی۔ 319-321}۔"
  tr: "İbn Hud, El-Muhadlara isyan edip Endülüs'ün kontrolünü ele geçirdiğinde, o dönemdeki kralların çoğunun bağlılık gösterdiği Abbasi Halifesine biat etti. Bağdat'tan gelen cömert Abbasi mektubunda, İbn Hud Endülüs valisi olarak atandı. Ksativa kadısı Ebu el-Mutarrif, ona yazdığı bir mektupta, Abbasi cübbelerinin en yüksek seviyede yükseltildiğini ve gözlere görünenin, en güzel konuşan kişinin bile tarif etmekte zorlanacağı bir şey olduğunu söyleyerek tebrik etti. O günün Endülüs'te, Horasan'dan kara sancakların çıktığı güne benzediğini ve dokunduğu cübbenin, hayatta ve ölümde iyi olan bedene dokunduğunu söyledi. Bu, rivayet zincirinde eşi benzeri olmayan bir yüceliktir. Son olarak, Abbasi devletinin Endülüs topraklarında Cuma hutbesinde anıldığını belirtti. {Kaynak: Nafh-tib-makkari s. 319-321}."
  id: "Ketika Ibnu Hud memberontak melawan Almohad dan merebut kendali Andalusia, ia menyerukan kesetiaan kepada Khalifah Abbasiyah, yang kepadanya sebagian besar raja pada masa itu berbakti. Surat Abbasiyah yang murah hati tiba dari Baghdad yang mengangkatnya sebagai gubernur Andalusia. Abu al-Mutarrif, hakim Xativa, mengucapkan selamat kepadanya dengan sebuah surat yang isinya mengatakan bahwa jubah Abbasiyah telah diangkat ke bentuk tertinggi dan apa yang tampak di mata adalah sesuatu yang bahkan orang yang paling fasih pun akan kesulitan untuk menggambarkannya. Ia mengatakan bahwa hari itu di Andalusia seperti hari ketika panji-panji hitam keluar dari Khorasan, dan bahwa jubah yang disentuhnya menyentuh tubuh yang baik dalam hidup dan mati. Itu adalah ketinggian dalam rantai periwayatan yang tidak ada bandingannya. Ia menyimpulkan dengan mengatakan bahwa negara Abbasiyah disebutkan dalam khutbah Jumat di tanah Andalusia {cite:nafh-tib-maqqari hlm. 319-321}."
