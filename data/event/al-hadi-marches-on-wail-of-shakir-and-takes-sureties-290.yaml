id: event/al-hadi-marches-on-wail-of-shakir-and-takes-sureties-290
class: event
kind: other
label:
  ar: "مسير الهادي إلى بلد وائلة من شاكر وأخذه كفلاء منهم، صفر 290هـ"
  en: "Al-Hadi marches on the land of Wa'ila of Shakir and takes sureties from them, Safar 290 AH"
  ur: "ہادی کی شاکر کے وائلہ پر چڑھائی اور ان سے ضمانتیں لینا، صفر 290ھ"
  es: "Al-Hadi marcha sobre la tierra de Wa'ila de Shakir y toma fiadores de ellos, Safar 290 AH."
  fr: "Al-Hadi marche sur le pays de Wa'ila de Shakir et prend des cautions parmi eux, le 29 Safar de l'an 290 de l'Hégire."
  tr: "Hadi'nin Şakir'den Veila diyarına yaptığı yolculuk ve onlardan kefiller alması, Hicri 290 Safar."
  id: "Perjalanan Al-Hadi ke negeri Wa'ila dari Shakir dan pengambilan penjamin dari mereka, Safar 290 H."
summary:
  ar: "كان بطن من شاكر يقال له وائلة قد أحدثوا في طريق نجران أحداثاً والهادي غائب بصنعاء، فعزم الهادي ألا يفرّق العساكر حتى يطأ بها وائلة، فنهض إلى موضع واسط ليلة أهلّ صفر، ثم إلى كتاف والمطلاع من بلدهم فنهب العسكر وقطع الأعناب وخرّب، ثم أقبلت إليه وائلة بسمعها وطاعتها وطلبت الأمان فآمنها، وضمن بعضهم بعضاً وأخذ منهم جماعة من «الحدثين» ورجع إلى صعدة."
  en: "A clan of Shakir called Wa'ila had made trouble on the Najran road while al-Hadi was away at Sana'a; he resolved not to disperse the armies until he had gone through Wa'ila, went to a place called Wasit on the night Safar began, then to Kitaf and al-Mutla' in their land, where the army plundered, cut vines and laid waste; then Wa'ila came to him in hearing and obedience and asked safety, which he gave; they stood surety for one another, he took some of the \"disorderers\" and returned to Sa'da."
  ur: "شاکر کی ایک شاخ وائلہ نے نجران کے راستے میں فساد کیا جبکہ ہادی صنعاء میں تھے؛ انہوں نے عزم کیا کہ لشکروں کو اس وقت تک نہ بکھیریں گے جب تک وائلہ سے نہ گزر لیں؛ وہ صفر کا چاند دیکھنے کی رات واسط نامی جگہ پہنچے، پھر ان کی سرزمین کے کتاف اور مطلاع گئے جہاں لشکر نے لوٹ مار کی، انگور کاٹے اور تباہی کی؛ پھر وائلہ سمع و طاعت کے ساتھ آئے اور امان مانگی جو دی گئی، وہ ایک دوسرے کے ضامن بنے، ہادی نے ان میں سے چند «فساد کرنے والوں» کو لیا اور صعدہ لوٹے۔"
  es: "Un clan de Shakir llamado Wa'ila había causado problemas en el camino de Najran mientras al-Hadi estaba en Sana'a; él decidió no dispersar a los ejércitos hasta haber derrotado a Wa'ila, fue a un lugar llamado Wasit la noche en que comenzó el Safar, luego a Kitaf y al-Mutla' en su tierra, donde el ejército saqueó, cortó viñas y causó estragos; entonces Wa'ila vino a él en señal de obediencia y pidió protección, la cual él le concedió; se hicieron fiadores el uno del otro, él tomó a algunos de los \"alborotadores\" y regresó a Sa'da."
  fr: "Un clan de Shakir appelé Wa'ila avait semé le trouble sur la route de Najran pendant qu'al-Hadi était à Sanaa; il résolut de ne pas disperser les armées avant d'avoir traversé le territoire des Wa'ila, se rendit à un endroit appelé Wasit la nuit du début du Safar, puis à Kitaf et al-Mutla' sur leurs terres, où l'armée pilla, coupa les vignes et ravagea; alors les Wa'ila vinrent à lui, à son écoute et soumis, et lui demandèrent protection, qu'il leur accorda; ils se portèrent garants l'un pour l'autre, il prit quelques-uns des « fauteurs de troubles » et retourna à Sa'da."
  tr: "Şakir kabilesinden Wa'ila adında bir grup, el-Hadi Sana'a'da yokken Necran yolunda saldırganlık eylemleri gerçekleştirmişti. El-Hadi, Wa'ila'yı ezene kadar birliklerini dağıtmamaya karar verdi. Safer ayının yeni hilal gecesinde Wasit'e, ardından Kataf ve el-Mutla'ya gitti ve birliklerini yağmaladı, üzüm bağlarını kesti ve topraklarını tahrip etti. Bunun üzerine Wa'ila, onu dinleyerek ve itaat ederek yanına geldi ve güvenlik istedi. El-Hadi onlara güvenlik sağladı ve bazıları birbirlerine kefil oldu. El-Hadi, onlardan bir grup \"el-Hadatayn\"ı yanına alarak Sa'da'ya döndü."
  id: "Suatu klan Shakir bernama Wa’ila telah melakukan tindakan agresi di jalan menuju Najran ketika al-Hadi sedang tidak berada di Sana’a. Al-Hadi memutuskan untuk tidak membubarkan pasukan sampai ia mengalahkan Wa’ila. Ia berangkat ke tempat Wasit pada malam bulan sabit Safar, kemudian ke Kataf dan al-Mutla’ dari tanah mereka, dan ia menjarah pasukan, menebang tanaman anggur, dan menghancurkan tanah. Kemudian Wa’ila datang kepadanya dengan pendengaran dan ketaatan mereka dan meminta perlindungan, maka ia memberi mereka perlindungan, dan sebagian dari mereka saling menjamin, dan ia mengambil sekelompok “al-Hadathayn” dari mereka dan kembali ke Sa’da."
