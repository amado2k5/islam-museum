summary:
  ar: "في محرم سنة تسع وخمسين وست مئة اجتمع خلق من التتار الذين نجوا من يوم عين جالوت والذين كانوا بالجزيرة فأغاروا على حلب ثم ساقوا إلى حمص فصادفوا على حمص حسام الدين الجوكندار والمنصور صاحب حماة والأشرف صاحب حمص في ألف وأربع مئة والتتار في ستة آلاف فالتقوهم وحمل المسلمون حملة صادقة فكان النصر ووضعوا السيف فيهم قتلاً حتى أبادوا أكثرهم وهرب مقدمهم بندرا بأسوأ حال ولم يقتل من المسلمين سوى رجل واحد {cite:shadharat-dhahab p. 296}."
  en: "In Muharram 659 the Tatar remnants of Ayn Jalut and the Jazira raided Aleppo then bore down on Hims, where Husam al-Din the Jawkandar, al-Mansur of Hamah and al-Ashraf of Hims met them with 1,400 against 6,000; a single sincere charge put the sword among them until most were destroyed and their leader Bundar fled in the worst state — only one Muslim fell {cite:shadharat-dhahab p. 296}."
