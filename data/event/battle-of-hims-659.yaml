label: { ar: "وقعة حمص سنة 659هـ", en: "Battle of Homs in 659 AH", fr: "La bataille de Homs en 659 H", es: "Batalla de Homs en el año 659 d. C.", ur: "659ھ میں حمص کی جنگ", tr: "Hicri 659 yılında gerçekleşen Homs Muharebesi", id: "Pertempuran Homs pada tahun 659 Hijriah" }
summary:
  ar: "في محرم سنة تسع وخمسين وست مئة اجتمع خلق من التتار الذين نجوا من يوم عين جالوت والذين كانوا بالجزيرة فأغاروا على حلب ثم ساقوا إلى حمص فصادفوا على حمص حسام الدين الجوكندار والمنصور صاحب حماة والأشرف صاحب حمص في ألف وأربع مئة والتتار في ستة آلاف فالتقوهم وحمل المسلمون حملة صادقة فكان النصر ووضعوا السيف فيهم قتلاً حتى أبادوا أكثرهم وهرب مقدمهم بندرا بأسوأ حال ولم يقتل من المسلمين سوى رجل واحد {cite:shadharat-dhahab p. 296}."
  en: "In Muharram 659 the Tatar remnants of Ayn Jalut and the Jazira raided Aleppo then bore down on Hims, where Husam al-Din the Jawkandar, al-Mansur of Hamah and al-Ashraf of Hims met them with 1,400 against 6,000; a single sincere charge put the sword among them until most were destroyed and their leader Bundar fled in the worst state — only one Muslim fell {cite:shadharat-dhahab p. 296}."
  fr: "En Muharram 659, les restes tatars d'Ayn Jalut et de la Jazira attaquèrent Alep puis fondirent sur Homs, où Husam al-Din le Jawkandar, al-Mansur de Hama et al-Ashraf de Homs les affrontèrent avec 1 400 hommes contre 6 000 ; une seule charge résolue porta l'épée parmi eux jusqu'à en détruire la plupart, et leur chef Bundar s'enfuit dans le pire état ; un seul musulman tomba {cite:shadharat-dhahab p. 296}."
  es: "En Muharram 659, los restos tártaros de Ayn Jalut y los Jazira asaltaron Alepo y luego avanzaron hacia Hims, donde Husam al-Din el Jawkandar, al-Mansur de Hamah y al-Ashraf de Hims los enfrentaron con 1.400 contra 6.000; una sola carga sincera hizo que la espada se extendiera entre ellos hasta que la mayoría fueron destruidos y su líder Bundar huyó en el peor estado; solo un musulmán cayó {cite:shadharat-dhahab p. 296}."
  ur: "محرم 659 میں عین جالوت اور جزیرہ کی تاتاری باقیات نے حلب پر حملہ کیا اور پھر حمص پر حملہ کیا، جہاں حسام الدین جوکندر، حماہ کے المنصور اور حمص کے الاشرف نے 1400 کے مقابلے میں 6000 کے ساتھ ان سے ملاقات کی۔ ایک ہی مخلصانہ الزام نے ان کے درمیان تلوار ڈال دی یہاں تک کہ زیادہ تر تباہ ہو گئے اور ان کا لیڈر بندر بدترین حالت میں فرار ہو گیا - صرف ایک مسلمان گر گیا {حوالہ: شدارت ذہاب صفحہ 296}۔"
  tr: "Hicri 659 yılının Muharrem ayında, Ayn-Celut Muharebesi'nden sağ kurtulan ve Cezire'de bulunan bir grup Tatar, Halep'e baskın düzenledi. Ardından Homs'a doğru ilerleyerek, 1400 kişilik ordularıyla Hama hükümdarı Husam el-Din el-Cükandar, el-Mansur ve Homs hükümdarı el-Eşref ile 6000 kişilik ordularıyla karşılaştılar. Karşılarına çıkan Müslümanlar, samimi bir saldırı başlattılar ve zafer kazandılar. Tatarları kılıçtan geçirerek çoğunu yok ettiler ve liderleri Bandar en kötü durumda kaçtı. Sadece bir Müslüman öldü. {kaynak: Shadharat-dhahab s. 296}"
  id: "Pada bulan Muharram tahun 659 H, sekelompok Tatar yang selamat dari Pertempuran Ain Jalut dan berada di Jazira berkumpul dan menyerbu Aleppo. Kemudian mereka berbaris ke Homs dan bertemu dengan Husam al-Din al-Jukandar, al-Mansur, penguasa Hama, dan al-Ashraf, penguasa Homs, dengan 1.400 orang, dan Tatar dengan 6.000 orang. Mereka bertemu dengan mereka, dan kaum Muslim melancarkan serangan yang sungguh-sungguh, dan kemenangan menjadi milik mereka. Mereka membantai mereka, membunuh mereka hingga sebagian besar dari mereka musnah, dan pemimpin mereka, Bandar, melarikan diri dalam kondisi yang sangat buruk. Hanya satu orang Muslim yang terbunuh. {cite:shadharat-dhahab hlm. 296}"
