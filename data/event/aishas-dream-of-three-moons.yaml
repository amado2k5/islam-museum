id: event/aishas-dream-of-three-moons
class: event
kind: other
label:
  ar: "رؤيا عائشة: ثلاثة أقمار سقطن في حجرتها"
  en: "Aisha's dream: three moons fell into her chamber"
  fr: "Rêve d’Aisha : trois lunes tombent dans sa chambre"
  ur: "عائشہ کا خواب: اس کے کمرے میں تین چاند گرے"
  es: "El sueño de Aisha: tres lunas cayeron en su habitación."
  tr: "Ayşe'nin rüyası: Odasına üç ay düştü."
  id: "Penglihatan Aisha: Tiga bulan jatuh ke kamarnya"
summary:
  ar: "رأت عائشة ثلاثة أقمار سقطن في حجرتها فقصصت رؤياها على أبي بكر فلما توفي النبي ودفن في بيتها قال لها أبو بكر هذا أحد أقمارك وهو خيرها {cite:muwatta-maruf-1997} [[passage/muwatta-2-623|الموطأ 623]]."
  en: "Aisha saw three moons fall into her chamber and related her dream to Abu Bakr; when the Prophet died and was buried in her house, Abu Bakr said to her: this is one of your moons, and the best of them {cite:muwatta-maruf-1997} [[passage/muwatta-2-623|Muwatta 623]]."
  fr: "Aisha vit trois lunes tomber dans sa chambre et raconta son rêve à Abu Bakr. Lorsque le Prophète mourut et fut enterré chez elle, Abu Bakr lui dit : voici l’une de tes lunes, et la meilleure des trois {cite:muwatta-maruf-1997} [[passage/muwatta-2-623|Muwatta 623]]."
  ur: "عائشہ نے خواب دیکھا کہ اس کے کمرے میں تین چاند گرے تو اس نے اپنا خواب ابو بکر کو سنایا؛ جب نبی کی وفات ہوئی اور وہ اس کے گھر میں دفن ہوئے تو ابو بکر نے اس سے کہا: یہ تمہارا ایک چاند ہے اور تمہارے چاندوں میں سب سے بہتر {cite:muwatta-maruf-1997} [[passage/muwatta-2-623|موطأ 623]]۔"
  es: "Aisha vio caer tres lunas en su habitación y le contó su sueño a Abu Bakr; cuando el Profeta murió y fue enterrado en su casa, Abu Bakr le dijo: esta es una de tus lunas, y la mejor de ellas {cite:muwatta-maruf-1997} [[passage/muwatta-2-623|Muwatta 623]]."
  tr: "Ayşe, odasına üç ayın düştüğünü gördü ve rüyasını Ebu Bekir'e anlattı. Peygamber vefat edip onun evine defnedildiğinde, Ebu Bekir ona, \"Bu senin aylarından biri ve bunların en hayırlısıdır\" dedi. {cite:muwatta-maruf-1997} [[passage/muwatta-2-623|Al-Muwatta 623]]."
  id: "Aisyah melihat tiga bulan jatuh ke kamarnya, lalu ia menceritakan mimpinya kepada Abu Bakar. Ketika Nabi wafat dan dimakamkan di rumahnya, Abu Bakar berkata kepadanya, “Ini adalah salah satu bulanmu, dan ini adalah bulan yang terbaik di antara semuanya.” {cite:muwatta-maruf-1997} [[passage/muwatta-2-623|Al-Muwatta 623]]."
