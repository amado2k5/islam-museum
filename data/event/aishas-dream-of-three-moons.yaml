id: event/aishas-dream-of-three-moons
class: event
kind: other
label:
  ar: "رؤيا عائشة: ثلاثة أقمار سقطن في حجرتها"
  en: "Aisha's dream: three moons fell into her chamber"
  ur: "عائشہ کا خواب: اس کے کمرے میں تین چاند گرے"
summary:
  ar: "رأت عائشة ثلاثة أقمار سقطن في حجرتها فقصصت رؤياها على أبي بكر فلما توفي النبي ودفن في بيتها قال لها أبو بكر هذا أحد أقمارك وهو خيرها {cite:muwatta-maruf-1997} [[passage/muwatta-2-623|الموطأ 623]]."
  en: "Aisha saw three moons fall into her chamber and related her dream to Abu Bakr; when the Prophet died and was buried in her house, Abu Bakr said to her: this is one of your moons, and the best of them {cite:muwatta-maruf-1997} [[passage/muwatta-2-623|Muwatta 623]]."
  ur: "عائشہ نے خواب دیکھا کہ اس کے کمرے میں تین چاند گرے تو اس نے اپنا خواب ابو بکر کو سنایا؛ جب نبی کی وفات ہوئی اور وہ اس کے گھر میں دفن ہوئے تو ابو بکر نے اس سے کہا: یہ تمہارا ایک چاند ہے اور تمہارے چاندوں میں سب سے بہتر {cite:muwatta-maruf-1997} [[passage/muwatta-2-623|موطأ 623]]۔"
