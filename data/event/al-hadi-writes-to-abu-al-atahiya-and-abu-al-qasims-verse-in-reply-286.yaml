id: event/al-hadi-writes-to-abu-al-atahiya-and-abu-al-qasims-verse-in-reply-286
class: event
kind: other
label:
  ar: كتاب الهادي إلى أبي العتاهية وقصيدة أبي القاسم في الجواب، 286هـ
  en: Al-Hadi's letter to Abu al-Atahiya and Abu al-Qasim's verse in reply, 286 AH
  ur: ہادی کا ابو العتاہیہ کو خط اور ابو القاسم کا منظوم جواب، 286ھ
summary:
  ar: يكتب الهادي إلى أبي العتاهية بما كان منه في بني الحارث وما أعطاه الله من الظفر والنصر، ويكتب إلى أبي القاسم أن يوجّه بكتب أبي العتاهية، فيكتب إليه أبو القاسم كتاباً يذكر فيه خبر الوقعة ويقول شعراً عن أنهم لا يهابون عدوهم، ثم يوجّه جواب الهادي إلى نجران.
  en: Al-Hadi writes to Abu al-Atahiya of what he did to Banu al-Harith and the victory and help God gave him, and writes to Abu al-Qasim to send on Abu al-Atahiya's letters; Abu al-Qasim writes a letter giving the news of the fight and a poem saying they do not fear their enemy, then sends the answer to al-Hadi at Najran.
  ur: ہادی ابو العتاہیہ کو لکھتے ہیں کہ بنو حارث کے ساتھ ان کا کیا معاملہ ہوا اور اللہ نے انہیں کیسی فتح و نصرت دی، اور ابو القاسم کو لکھتے ہیں کہ ابو العتاہیہ کے خطوط بھیجیں؛ ابو القاسم ایک خط لکھتے ہیں جس میں لڑائی کی خبر ہے اور ایک قصیدہ کہ وہ اپنے دشمن سے نہیں ڈرتے، پھر ہادی کا جواب نجران کی طرف بھیجتے ہیں۔
