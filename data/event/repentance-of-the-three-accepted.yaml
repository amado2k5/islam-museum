label: { ar: "قبول توبة الثلاثة", en: "The acceptance of the repentance of the three", es: "La aceptación del arrepentimiento de los tres", fr: "L'acceptation du repentir des trois", ur: "تینوں کی توبہ کی قبولیت", tr: "Üçünün tövbesinin kabulü", id: "Penerimaan pertobatan ketiga orang tersebut" }
summary:
  ar: "في فجر الليلة الخمسين سمع كعب صارخاً على سلع يبشره، فخرّ ساجداً؛ وأعلن النبي بعد صلاة الفجر توبة الله عليهم، فبشرهم الناس، وقام إلى كعب طلحة بن عبيد الله فهنأه، وقال له النبي إن هذا خير يوم مرّ عليه منذ ولدته أمه."
  en: At dawn on the fiftieth night Ka'b heard a caller on Mount Sal' bringing him good news and fell prostrate. After the dawn prayer the Prophet announced God's acceptance of their repentance and people congratulated them; Talha ibn Ubaydullah rose to Ka'b and congratulated him, and the Prophet told him this was the best day that had come upon him since his mother bore him.
  es: "Al amanecer de la quincuagésima noche, Ka'b escuchó a un mensajero en el monte Sal' que le traía buenas noticias y cayó postrado. Tras la oración del amanecer, el Profeta anunció que Dios aceptaba su arrepentimiento y la gente los felicitó. Talha ibn Ubaydullah se acercó a Ka'b y lo felicitó, y el Profeta le dijo que aquel era el mejor día que había vivido desde que su madre lo dio a luz."
  fr: "À l'aube de la cinquantième nuit, Ka'b entendit un messager sur le mont Sal' lui apportant une bonne nouvelle et se prosterna. Après la prière de l'aube, le Prophète annonça que Dieu avait accepté leur repentir et les gens les félicitèrent. Talha ibn Ubaydullah se leva vers Ka'b et le félicita, et le Prophète lui dit que c'était le plus beau jour qui lui soit arrivé depuis sa naissance."
  ur: "پچاسویں رات کو فجر کے وقت کعب نے کوہ سل پر ایک پکارنے والے کو بشارت دیتے ہوئے سنا اور سجدہ کیا۔ فجر کی نماز کے بعد نبی نے اللہ کی طرف سے ان کی توبہ کی قبولیت کا اعلان کیا اور لوگوں نے انہیں مبارکباد دی۔ طلحہ بن عبیداللہ کعب کے پاس گئے اور انہیں مبارکباد دی، اور نبی نے انہیں بتایا کہ یہ ان پر بہترین دن تھا جب سے ان کی ماں نے انہیں جنا تھا۔"
  tr: "Elliinci gecenin şafağında Ka'b, namazda birinin kendisine müjde verdiğini duydu ve secdeye kapandı. Sabah namazından sonra Peygamber, Allah'ın tövbelerini kabul ettiğini açıkladı ve insanlar da onlara müjde verdi. Talha bin Ubaidullah, Ka'b'ın yanına giderek onu tebrik etti ve Peygamber ona bunun, annesinin onu doğurduğundan beri yaşadığı en güzel gün olduğunu söyledi."
  id: "Pada fajar malam kelima puluh, Ka'b mendengar seseorang berteriak salat, menyampaikan kabar gembira kepadanya, lalu ia bersujud. Setelah salat subuh, Nabi mengumumkan bahwa Allah menerima taubat mereka, sehingga orang-orang memberi kabar gembira kepada mereka. Talha bin Ubaidullah pergi menemui Ka'b dan mengucapkan selamat kepadanya, dan Nabi mengatakan kepadanya bahwa itu adalah hari terbaik yang pernah dialaminya sejak ibunya melahirkannya."
