label: { ar: "قبول توبة الثلاثة", en: "The acceptance of the repentance of the three" }
summary:
  ar: "في فجر الليلة الخمسين سمع كعب صارخاً على سلع يبشره، فخرّ ساجداً؛ وأعلن النبي بعد صلاة الفجر توبة الله عليهم، فبشرهم الناس، وقام إلى كعب طلحة بن عبيد الله فهنأه، وقال له النبي إن هذا خير يوم مرّ عليه منذ ولدته أمه."
  en: At dawn on the fiftieth night Ka'b heard a caller on Mount Sal' bringing him good news and fell prostrate. After the dawn prayer the Prophet announced God's acceptance of their repentance and people congratulated them; Talha ibn Ubaydullah rose to Ka'b and congratulated him, and the Prophet told him this was the best day that had come upon him since his mother bore him.
