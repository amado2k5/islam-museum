id: event/hadith-of-the-cloak
class: event
kind: other
label: { ar: "حديث الكساء وآية التطهير في أهل البيت", en: "The hadith of the cloak and the verse of purification of the household" }
summary:
  ar: "روت عائشة أن النبي جلّل علياً وفاطمة والحسن والحسين بكساء، ويستدل به الصلابي على أن آية التطهير تعني أهل البيت. ويرى أن الخطاب في الآية كله لأزواج النبي، لكن لما كان في التطهير منفعة تعمّ غيرهن جاء الضمير مذكراً، فصار علي وفاطمة والحسن والحسين أخص من غيرهم بالحكم (ص 90-91)."
  en: "Aisha's report of the cloak gathering Ali, Fatima, Hasan and Husayn is cited by al-Sallabi as the context of the purification verse; in his reading the address is to the Prophet's wives, but the masculine pronoun makes the four especially included (pp. 90-91)."
