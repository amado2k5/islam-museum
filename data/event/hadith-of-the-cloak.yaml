issue: { ar: "من المقصود بأهل البيت في آية التطهير؟", en: "Who is meant by the household in the verse of purification?" }
perspectives:
  - tradition: sunni
    id: sunni-author
    stance:
      ar: "الخطاب لأزواج النبي، ومعهن أهل البيت كلهم بالتذكير، وعلي وفاطمة والحسن والحسين أخص بذلك"
      en: "The address is to the Prophet's wives, with the household as a whole included by the masculine pronoun, and Ali, Fatima, Hasan and Husayn especially so"
    summary:
      ar: "يذكر الصلابي أن الخطاب كله لأزواج النبي، وأن التطهير لما فيه من المنفعة تعمّ أهل البيت، ويرى أن علياً وفاطمة والحسن والحسين خُصّوا بالدعاء، ويعرض حديث زيد بن أرقم في توسيع المفهوم إلى آل علي وآل جعفر وآل عقيل وآل العباس وآل الحارث (ص 91)."
    sources: [source/sallabi-ali-vol1]
  - tradition: other
    id: other-reading-deferred
    stance:
      ar: "قراءة أخرى للآية يناقشها الكتاب في موضع لاحق، ولم تُعرض هنا"
      en: "Another reading of the verse, which the book says it will discuss later, is not set out here"
    summary:
      ar: "يذكر الكتاب أنه سيعرض دلالة الآية وسيناقش الاستدلال الشيعي بها عند الكلام عن الشيعة في موضع لاحق؛ فلا تُنسب هنا إلى أحد قول محدد (needs_source)."
    sources: [source/sallabi-ali-vol1]
