id: event/abu-al-atahiya-hands-over-what-he-held-and-withdraws-to-an-ascetic-life-288
class: event
label:
  ar: "أبو العتاهية يسلم الهادي ما بيده ويعتزل في ضيعته زاهداً، محرم 288هـ"
  en: "Abu al-Atahiya hands over what he held and withdraws to an ascetic life, Muharram 288 AH"
  ur: "ابو العتاہیہ اپنے پاس کا سب کچھ ہادی کے حوالے کرتے ہیں اور زہد کی زندگی اختیار کر کے الگ ہو جاتے ہیں، محرم 288ھ"
summary:
  ar: "يسلم أبو العتاهية الهادي جميع ما معه من مال وإبل وخيل وسلاح وأثاث مما جمعه هو وغيره من مال الله بحسب كلامه، فيقبضه الهادي ويعرض عليه بعض أمره فيأبى ويقول إنه يريد أن يكون خادماً بين يديه، ثم يبني منزلاً في ضيعته ويعتزل لابساً الصوف، ويروي الراوي عنه قولين في تغيّر حاله وفي مأكله."
  en: "Abu al-Atahiya hands al-Hadi everything he held, cash, camels, horses, weapons and furnishings gathered by him and others from what he calls God's property; al-Hadi takes it and offers him a share in his affairs, which he declines, asking to be a servant before him; he builds a house on his estate and withdraws, wearing wool, and the narrator relays two sayings of his about his changed state and what he would eat."
  ur: "ابو العتاہیہ اپنے پاس جو کچھ تھا، نقد، اونٹ، گھوڑے، ہتھیار اور سامان، جو ان کے اپنے الفاظ میں انہوں نے اور دوسروں نے اللہ کے مال سے جمع کیا تھا، سب ہادی کے حوالے کر دیتے ہیں؛ ہادی اسے لے لیتے ہیں اور انہیں اپنے کام کا ایک حصہ دینا چاہتے ہیں جسے وہ نہیں مانتے اور کہتے ہیں کہ وہ ان کے سامنے خادم بن کر رہنا چاہتے ہیں؛ وہ اپنی زمین میں گھر بنا کر الگ ہو جاتے ہیں اور اون پہنتے ہیں، اور راوی ان کے بدلے ہوئے حال اور کھانے کے بارے میں ان کے دو اقوال نقل کرتا ہے۔"
