label: { ar: "كارثة عبيد الله بن أبي بكرة الثانية", en: "Ubaydallah ibn Abi Bakra's Second Disaster", es: "El segundo desastre de Ubaydallah ibn Abi Bakra", fr: "Le deuxième désastre d'Ubaydallah ibn Abi Bakra", ur: "عبیداللہ ابن ابی بکرہ کی دوسری آفت", tr: "Ubeydullah ibn Ebi Bekre'nin ikinci felaketi", id: "Musibah Kedua Ubayd Allah bin Abi Bakra" }
summary:
  ar: "لما ولي الحجاج بن يوسف العراق وجه عبيد الله بن أبي بكرة إلى سجستان فحار ووهن وأتى الرخج وكانت البلاد مجدبة فسار حتى نزل بالقرب من كابل وانتهى إلى شعب فأخذه عليه العدو ولحقهم رتبيل فصالحهم عبيد الله على أن يعطوه خمسمائة ألف درهم ويبعث إليه بثلاثة من ولده نهار والحجاج وأبي بكرة هناء ويكتب لهم كتاباً أن لا يغزوهم ما كان والياً فقال له شريح بن هانيء الحارثي اتق الله وقاتل هؤلاء القوم فإنك إن فعلت ما تريد أن تفعله وهنت الإسلام بهذا الثغر وكنت قد فررت من الموت الذي إليه مصيرك فاقتتلوا وحمل شريح فقتل وقاتل الناس فأفلتوا وهم مجهودون وسلكوا مفازة بست فهلك كثير من الناس عطشاً وجوعاً ومات عبيد الله بن أبي بكرة كمداً لما نال الناس وأصابهم ويقال إنه اشتكى أذنه فمات واستخلف على الناس ابنه أبا بردعة."
  en: "Under al-Hajjaj, Ubaydallah ibn Abi Bakra returned to Sijistan — bewildered, weakened, the land barren — marched near Kabul, where the enemy seized a defile on him and Rutbil closed in. He truced for five hundred thousand dirhams, three sons as hostages — Nahar, al-Hajjaj, and Abu Bakra — and a writ not to raid while he governed. Shurayh ibn Hani' al-Harithi counselled: 'fear God and fight, else you weaken Islam on this frontier and flee the death that is your lot' — they fought; Shurayh charged and fell; the army escaped spent through Bust's mafaza where many died of thirst and hunger; Ubaydallah died of grief for what befell the people — some say an ear illness — leaving his son Abu Bardha'a in command."
  es: "Bajo el mando de al-Hajjaj, Ubaydallah ibn Abi Bakra regresó a Sijistan —desconcertado, debilitado, con la tierra estéril— y marchó cerca de Kabul, donde el enemigo le tendió una emboscada y Rutbil lo acorraló. Negoció una tregua a cambio de quinientos mil dirhams, tres hijos como rehenes —Nahar, al-Hajjaj y Abu Bakra— y una orden judicial que le prohibía saquear mientras gobernara. Shurayh ibn Hani' al-Harithi le aconsejó: «Temed a Dios y luchad, de lo contrario debilitaréis el Islam en esta frontera y huiréis de la muerte que os espera». Lucharon; Shurayh cargó y cayó; el ejército escapó exhausto a través de la mafaza de Bust, donde muchos murieron de sed y hambre; Ubaydallah murió de pena por lo que le sucedió al pueblo —algunos dicen que de una enfermedad del oído— dejando a su hijo Abu Bardha'a al mando."
  fr: "Sous le commandement d'al-Hajjaj, Ubaydallah ibn Abi Bakra retourna au Sijistan, désemparé et affaibli, la région étant aride. Il marcha près de Kaboul, où l'ennemi le prit à partie dans un défilé et où Rutbil se rapprocha. Il conclut une trêve contre cinq cent mille dirhams, trois de ses fils en otages – Nahar, al-Hajjaj et Abu Bakra – et l'interdiction de piller tant qu'il gouvernerait. Shurayh ibn Hani' al-Harithi lui conseilla: « Craignez Dieu et combattez, sinon vous affaiblirez l'islam sur cette frontière et fuirez la mort qui vous attend. » Ils combattirent; Shurayh chargea et tomba; l'armée, épuisée, s'échappa par le mafaza de Bust où beaucoup moururent de soif et de faim. Ubaydallah mourut de chagrin pour le sort du peuple – certains disent d'une otite – laissant son fils Abu Bardha'a à la tête des troupes."
  ur: "الحجاج کے ماتحت، عبیداللہ ابن ابی بکرہ حیران، کمزور، زمین بنجر ہو کر سجستان واپس آیا، کابل کے قریب کوچ کیا، جہاں دشمن نے اس پر غلیظ قبضہ کر لیا اور رتبیل کو بند کر دیا، اس نے پانچ لاکھ درہم، تین بیٹے یرغمال کے طور پر جنگ بندی کی، جب کہ نہار، الحاج اور بقرہ، اور ابو بکرہ کو چھوڑ دیا۔ شریح بن ہانی الحارثی نے نصیحت کی: 'خدا سے ڈرو اور لڑو، ورنہ تم اس سرحد پر اسلام کو کمزور کر دو گے اور موت سے بھاگو گے جو تمہارا مقدر ہے' - وہ لڑے۔ شوریٰ نے الزام لگایا اور گر پڑا۔ فوج نے بسٹ کے مفازا میں گزارا جہاں بہت سے لوگ پیاس اور بھوک سے مر گئے۔ عبیداللہ لوگوں کے ساتھ جو کچھ ہوا اس کے غم میں مر گیا - کچھ کہتے ہیں کہ کان کی بیماری - اپنے بیٹے ابو بردہ کو کمانڈر چھوڑ کر۔"
  tr: "Haccac bin Yusuf Irak'ın yönetimini ele geçirdiğinde, Ubeydullah bin Ebu Bekre'yi Sijistan'a gönderdi. Ubeydullah kafası karışmış ve güçsüz düşmüştü ve Rukhj'a geldi. Toprak verimsizdi, bu yüzden Kabil yakınlarında kamp kurup bir vadiye ulaşana kadar yürüdü. Düşman onu yakaladı ve Ratbil onlara yetişti. Ubeydullah, beş yüz bin dirhem vermeleri ve üç oğlu Nahar, Haccac ve Ebu Bekre Hana'yı kendisine göndermeleri ve vali olduğu sürece onlara saldırmayacağına dair bir mektup yazmaları şartıyla onlarla barış yaptı. Şurayh bin Hani' el-Harithi ona, \"Allah'tan kork ve bu insanlarla savaş, çünkü istediğini yaparsan bu sınır bölgesinde İslam'ı zayıflatırsın ve kaderinde yazılı olan ölümden kaçmış olursun\" dedi. Böylece savaştılar, Şurayh saldırdı ve öldürüldü, halk savaştı ve bitkin bir halde kaçtı ve Bust çölünü ele geçirdi. Pek çok insan susuzluk ve açlıktan öldü ve Ubeydullah bin Ebu Bekre, halkın başına gelenler ve onlara yapılanlar yüzünden kederden öldü. Rivayetlere göre, kulağından şikayet ederek öldü ve oğlu Ebu Berda'yı halkın başına halefi olarak atadı."
  id: "Ketika Al-Hajjaj bin Yusuf mengambil alih Irak, ia mengirim Ubayd Allah bin Abi Bakra ke Sijistan. Ia menjadi bingung dan lemah, dan ia sampai di Al-Rukhj. Tanah itu tandus, jadi ia berjalan sampai berkemah di dekat Kabul dan mencapai sebuah lembah. Musuh menangkapnya, dan Ratbil menyusul mereka. Ubayd Allah berdamai dengan mereka dengan syarat mereka memberinya lima ratus ribu dirham dan mengirimkan tiga putranya, Nahar, Al-Hajjaj, dan Abi Bakra Hana’, serta menulis surat kepada mereka bahwa ia tidak akan menyerang mereka selama ia menjadi gubernur. Shurayh bin Hani’ Al-Harithi berkata kepadanya, “Takutlah kepada Allah dan perangilah orang-orang ini, karena jika engkau melakukan apa yang engkau inginkan, engkau akan melemahkan Islam di wilayah perbatasan ini, dan engkau akan lolos dari kematian yang telah ditakdirkan bagimu.” Maka mereka berperang, dan Shurayh menyerang dan terbunuh, dan orang-orang itu berperang dan melarikan diri, kelelahan, dan mereka merebut padang gurun Bust. Banyak orang meninggal karena haus dan kelaparan, dan Ubayd Allah bin Abi Bakra meninggal karena kesedihan atas apa yang terjadi pada orang-orang dan apa yang menimpa mereka. Dikatakan bahwa dia mengeluh tentang telinganya dan meninggal, dan dia mengangkat putranya, Abu Barda'a, sebagai penggantinya atas orang-orang."
