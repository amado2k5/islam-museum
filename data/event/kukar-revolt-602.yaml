label: { ar: "ثورة بني كوكر على الغوريين", en: "The Kukar (Khokhar) revolt against the Ghurids (602 AH)", es: "La revuelta de Kukar (Khokhar) contra los Ghurids (602 AH)", fr: "La révolte des Kukar (Khokhar) contre les Ghurids (602 AH)", ur: "کوکر ⁦(کھوکھر)⁩ نے غوریوں کے خلاف بغاوت ⁦(602ھ)⁩", tr: "Beni Koker isyanı Gurlulara karşı", id: "Pemberontakan Bani Koker melawan Ghurid" }
summary:
  ar: "لما انتشر خبر عدم شهاب الدين الغوري في معركة الخطا ثار المفسدون في أطراف البلاد، وارتد دانيال صاحب جبل الجودي عن الإسلام وتابع بني كوكر ومساكنهم في جبال بين لهاور والملتان حصينة، وكانوا قد أطاعوا شهاب الدين وحملوا له الخراج فثاروا وقطعوا الطريق من لهاور وغيرها إلى غزنة وأخذوا قافلة كبيرة، فأرسل شهاب الدين مملوكه أيبك مقدم عساكر الهند يراسلهم يدعوهم إلى الطاعة ويتهددهم، فقال ابن كوكر للرسول: لأي معنى لم يرسل السلطان إلينا رسولاً؟ فأجاب: وما قدركم أنتم حتى يرسل إليكم؟ فكان من أمرهم ما كان {cite:kamil-ibn-al-athir p. 300-301}."
  en: "On the false rumour of Shihab al-Din's death at the Qara Khitai rout, the Khokhar tribes of the Lahore–Multan hills — once his tributaries — rose, cut the road to Ghazna and seized a great caravan; Daniel of Jabal al-Judi apostatised and joined them. When the sultan's envoy — his own mamluk Aybak — demanded their submission, Ibn Kukar's answer was a challenge: 'why did the sultan not send to us himself?' {cite:kamil-ibn-al-athir p. 300-301}."
  es: "Ante el falso rumor de la muerte de Shihab al-Din en la derrota de Qara Khitai, las tribus Khokhar de las colinas de Lahore-Multán —antiguo tributarias suyas— se alzaron, cortaron el camino a Ghazna y se apoderaron de una gran caravana; Daniel de Jabal al-Judi apostató y se unió a ellos. Cuando el enviado del sultán —su propio mameluco Aybak— exigió su sumisión, la respuesta de Ibn Kukar fue un desafío: «¿Por qué el sultán no nos envió él mismo?» {cita:kamil-ibn-al-athir págs. 300-301}."
  fr: "Suite à la fausse rumeur de la mort de Shihab al-Din lors de la déroute de Qara Khitai, les tribus Khokhar des collines de Lahore-Multan — autrefois ses tributaires — se soulevèrent, coupèrent la route vers Ghazna et s'emparèrent d'une importante caravane; Daniel de Jabal al-Judi apostasia et se joignit à elles. Lorsque l'envoyé du sultan — son propre mamelouk Aybak — exigea leur soumission, Ibn Kukar répondit par un défi: « Pourquoi le sultan ne nous a-t-il pas envoyé lui-même ? » {cite: kamil-ibn-al-athir p. 300-301}."
  ur: "قرہ خطائی راستے پر شہاب الدین کی موت کی جھوٹی افواہ پر، لاہور-ملتان کی پہاڑیوں کے کھوکھر قبائل - ایک بار اس کی معاون ندیوں نے - اٹھے، غزنہ کی سڑک کاٹ دی اور ایک عظیم کارواں پر قبضہ کر لیا۔ جبل الجودی کا دانیال مرتد ہو کر ان میں شامل ہو گیا۔ جب سلطان کے ایلچی - اس کے اپنے مملوک ایبک - نے ان کے تابع ہونے کا مطالبہ کیا تو ابن کوکر کا جواب ایک چیلنج تھا: 'سلطان نے خود ہمارے پاس کیوں نہیں بھیجا؟' {حوالہ: کامل ابن الاثیر ص۔ 300-301}۔"
  tr: "Şihab el-Din el-Gavri'nin Hita Muharebesi'ndeki başarısızlığı haberi yayılınca, ülkenin dışındaki yozlaşmış insanlar isyan etti. Cudi Dağı'nın yöneticisi Daniel, İslam'dan döndü ve Lahavr ile Multan arasındaki dağlarda yaşayan Beni Kukar kabilesine katıldı. Onlar Şihab el-Din'e itaat etmiş ve ona haraç ödemişlerdi, ancak isyan edip Lahavr ve diğer yerlerden Gazne'ye giden yolu kestiler ve büyük bir kervanı ele geçirdiler. Şihab el-Din, Hint ordusunun komutanı olan Memlük Aybak'ı onlarla yazışması, onları itaate çağırması ve tehdit etmesi için gönderdi. İbn Kukar elçiye, \"Sultan neden bize bir elçi göndermedi?\" diye sordu. Elçi, \"Sizin ne değeriniz var ki size göndersin?\" diye cevap verdi. Ve böylece işleri böyle devam etti. {Kaynak: Kamil İbn el-Atir, s. 300-301}"
  id: "Ketika berita tentang kegagalan Shihab al-Din al-Ghawri dalam Pertempuran Khita menyebar, orang-orang korup di pinggiran negeri memberontak. Daniel, penguasa Gunung Judi, murtad dari Islam dan mengikuti Banu Kukar, yang tempat tinggalnya berada di pegunungan antara Lahawar dan Multan. Mereka telah menaati Shihab al-Din dan membayar upeti kepadanya, tetapi mereka memberontak dan memutus jalan dari Lahawar dan tempat-tempat lain ke Ghazna dan merebut kafilah besar. Shihab al-Din mengirim Mamluk Aybak, komandan tentara India, untuk berkomunikasi dengan mereka, menyerukan mereka untuk patuh dan mengancam mereka. Ibn Kukar berkata kepada utusan itu: Mengapa Sultan tidak mengirim utusan kepada kami? Utusan itu menjawab: Apa nilai kalian sehingga dia harus mengirim utusan kepada kalian? Dan begitulah keadaan mereka. {cite:kamil-ibn-al-athir p. 300-301}."
