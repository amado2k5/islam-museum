label: { ar: "ثورة بني كوكر على الغوريين", en: "The Kukar (Khokhar) revolt against the Ghurids (602 AH)" }
summary:
  ar: "لما انتشر خبر عدم شهاب الدين الغوري في معركة الخطا ثار المفسدون في أطراف البلاد، وارتد دانيال صاحب جبل الجودي عن الإسلام وتابع بني كوكر ومساكنهم في جبال بين لهاور والملتان حصينة، وكانوا قد أطاعوا شهاب الدين وحملوا له الخراج فثاروا وقطعوا الطريق من لهاور وغيرها إلى غزنة وأخذوا قافلة كبيرة، فأرسل شهاب الدين مملوكه أيبك مقدم عساكر الهند يراسلهم يدعوهم إلى الطاعة ويتهددهم، فقال ابن كوكر للرسول: لأي معنى لم يرسل السلطان إلينا رسولاً؟ فأجاب: وما قدركم أنتم حتى يرسل إليكم؟ فكان من أمرهم ما كان {cite:kamil-ibn-al-athir p. 300-301}."
  en: "On the false rumour of Shihab al-Din's death at the Qara Khitai rout, the Khokhar tribes of the Lahore–Multan hills — once his tributaries — rose, cut the road to Ghazna and seized a great caravan; Daniel of Jabal al-Judi apostatised and joined them. When the sultan's envoy — his own mamluk Aybak — demanded their submission, Ibn Kukar's answer was a challenge: 'why did the sultan not send to us himself?' {cite:kamil-ibn-al-athir p. 300-301}."
