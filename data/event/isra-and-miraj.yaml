label: { en: "The Isra and Mi'raj", ar: "الإسراء والمعراج" }
summary:
  en: "The miraculous nocturnal journey of Prophet Muhammad from al-Masjid al-Haram to al-Masjid al-Aqsa in Jerusalem, and his ascent through the seven heavens, where the five daily prayers were ordained. ونص رحلة المعراج كاملاً عند البخاري في حديث مالك بن صعصعة {cite:sahih-al-bukhari 3207}."
  ar: "إسراء النبي ليلاً بجسده على الصحيح بصحبة جبريل من المسجد الحرام إلى المسجد الأقصى على البراق وصلاته بالأنبياء إماماً، ثم عروجه إلى السماوات العلا وفرض الصلوات الخمس. وأطول نص له عند مسلم حديث مالك بن صعصعة في كتاب الإيمان {cite:sahih-muslim 162}."
