perspectives:
  - tradition: sunni
    id: sunni
    summary: { en: "Sunni scholars hold that the journey occurred in both body and soul while awake, citing explicit hadith reports in Bukhari and Muslim and the opening of Surat al-Isra." }
    sources: [source/zad-al-maad, source/sahih-al-bukhari, source/sahih-muslim, source/al-isra-wal-miraj-azhar]
  - tradition: sunni
    id: sunni-sharawi-divine-act
    stance: { en: "The ascent is God's act; the nearing is not spatial", ar: "المعراج فعل الله، والدنو ليس مكانياً" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      en: "Sha'rawi attributes the ascent to God, reads the nearing as God's act and not a spatial motion, and holds that the vision of 53:11-18 was real and not a dream, so the Qur'an's 'ru'ya' is taken as a sight that happened. He records the debate and gives no verdict on the Qur'anic wording {cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 17}{cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 62}."
      ar: "ينسب الشعراوي المعراج إلى الله، ويفهم الدنو فعلاً لله لا حركة مكانية، ويرى أن الرؤية في سورة النجم كانت يقظة لا منامًا، وينقل الجدل دون حكم {cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 17}{cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 62}."
    sources: [source/al-isra-wal-miraj-dar-al-jeel-2003]
  - tradition: sunni
    id: sunni-footnote-prophet-drew-near
    stance: { en: "The nearing is the Prophet's own approach to his Lord", ar: "الدنو من النبي نفسه في اقترابه من ربه" }
    holders: []
    summary:
      en: "An unnamed editorial footnote in the same Dar al-Jeel edition argues against Sha'rawi that 'dana' may describe the Prophet drawing near, as a person on tiptoe reaches for a sight {cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 66}. The footnote is the editor's, not Sha'rawi's, and is labelled as such."
      ar: "حاشية تحريرية غير منسوبة في طبعة دار الجيل نفسها تخالف الشعراوي وترى أن «دنا» قد تصف دنو النبي من ربه، كمن يرتفع على أطراف أصابعه ليرى {cite:al-isra-wal-miraj-dar-al-jeel-2003 p. 66}. والحاشية للمحرر لا للشعراوي."
    sources: [source/al-isra-wal-miraj-dar-al-jeel-2003]
  - tradition: academic
    id: academic
    summary: { en: "Historians analyse the varied early reports and traditions regarding the dating and nature of the night journey, contrasting the concise Qur'anic text with the developed details in classical hadith literature." }
