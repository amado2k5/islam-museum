label:
  ar: "وفاة المقريزي بالقاهرة، ٨٤٥هـ/١٤٤٢م"
  en: "Death of al-Maqrizi in Cairo, 845/1442"
  ur: "مقریزی کی وفات، قاہرہ، 845ھ/1442ء"
  es: "Muerte de al-Maqrizi en El Cairo, 845/1442"
  fr: "Mort d'al-Maqrizi au Caire, 845/1442"
  tr: "El-Makrizi, Kahire'de öldü, 845 H./1442 MS."
  id: "Al-Maqrizi meninggal di Kairo, 845 H/1442 M"
summary:
  ar: "توفي تقي الدين المقريزي بالقاهرة يوم الخميس سادس عشر شهر رمضان سنة ٨٤٥هـ الموافق ١٤ شباط ١٤٤٢م، ودفن بمقبرة الصوفية خارج باب النصر، وعمره نحو ثمانين سنة. خلف مئتي سفر من تصانيفه ونقولاته: المواعظ والاعتبار في الخطط والآثار، والسلوك في دول الملوك، ودرر العقود، والمقفى، والخبر عن البشر الذي لم يتمه؛ وقال عنه ابن تغري بردي إنه قرأ عليه كثيراً من مصنفاته وأجاز له جميع روايته {cite:shadharat-dhahab p. 254-255} {cite:encyclopaedia-of-islam-2 vol. 6 p. 213-214}."
  en: "Taqi al-Din al-Maqrizi died in Cairo on Thursday 16 Ramadan 845 (14 February 1442), aged about eighty, and was buried in the Sufi cemetery outside Bab al-Nasr. He left some two hundred volumes of his own writing and compilations — the Khitat (al-Mawa'iz wa-l-i'tibar), al-Suluk on the dynasties of kings, Durar al-uqud, al-Muqaffa, and the unfinished world history al-Khabar an al-bashar. Ibn Taghribirdi recalled reading many of his works with him and receiving his licence to transmit them all {cite:shadharat-dhahab p. 254-255} {cite:encyclopaedia-of-islam-2 vol. 6 p. 213-214}."
  ur: "تقی الدین مقریزی جمعرات 16 رمضان 845ھ ⁦(14 فروری 1442ء)⁩ کو قاہرہ میں وفات پا گئے، عمر تقریباً اسی برس، اور باب النصر سے باہر صوفیوں کے قبرستان میں دفن ہوئے۔ وہ اپنی تصانیف و نقولات کے تقریباً دو سو سفر چھوڑ گئے — خطط ⁦(المواعظ والاعتبار)⁩، السلوک، درر العقود، المقفیٰ، اور ادھوری عالمگیر تاریخ الخبر عن البشر۔ ابن تغری بردی کے بقول انہوں نے مقریزی کی بہت سی تصانیف ان ہی پر پڑھیں اور تمام روایت کی اجازت پائی {cite:shadharat-dhahab p. 254-255} {cite:encyclopaedia-of-islam-2 vol. 6 p. 213-214}۔"
  es: "Taqi al-Din al-Maqrizi murió en El Cairo el jueves 16 de Ramadán de 845 (14 de febrero de 1442), a la edad de unos ochenta años, y fue enterrado en el cementerio sufí a las afueras de Bab al-Nasr. Dejó unos doscientos volúmenes de sus propios escritos y compilaciones: el Khitat (al-Mawa'iz wa-li'tibar), al-Suluk sobre las dinastías de los reyes, Durar al-uqud, al-Muqaffa y la historia universal inconclusa al-Khabar an al-bashar. Ibn Taghribirdi recordó haber leído muchas de sus obras con él y haber recibido su autorización para transmitirlas todas {cite:shadharat-dhahab p. 254-255} {cite:encyclopaedia-of-islam-2 vol. 6 p. 213-214}."
  fr: "Taqi al-Din al-Maqrizi mourut au Caire le jeudi 16 Ramadan 845 (14 février 1442), à l'âge d'environ quatre-vingts ans, et fut inhumé au cimetière soufi situé à l'extérieur de Bab al-Nasr. Il laissa quelque deux cents volumes de ses écrits et compilations: la Khitat (al-Mawa'iz wa-li'tibar), al-Suluk sur les dynasties royales, Durar al-uqud, al-Muqaffa, et l'histoire du monde inachevée al-Khabar an al-bashar. Ibn Taghribirdi se souvint avoir lu plusieurs de ses œuvres avec lui et avoir reçu son autorisation de les transmettre intégralement."
  tr: "Taki el-Din el-Makrizi, Hicri 845 yılının Ramazan ayının 16. Perşembe günü (Miladi 14 Şubat 1442) Kahire'de vefat etti ve Bab el-Nasr dışındaki Sufi mezarlığına defnedildi. Seksen yaşlarındaydı. Geride kendi bestelerinden ve rivayetlerinden oluşan iki yüz kitap bıraktı: *El-Mevaiz ve el-İ'tibar fi el-Hatat ve el-Athar* (Planlar ve Anıtlar Üzerine Vaazlar ve Dersler), *El-Suluk fi Duwal el-Muluk* (Kralların Hanedanlıklarında Manevi Davranış), *Durar el-Ukud* (Sözleşmelerin İncileri), *El-Mukaffa* (Kafiyeli) ve tamamlayamadığı *El-Haber 'an el-Beşar* (İnsanlığın Hesabı). İbn Taghribirdi, onun birçok eserini kendisine okuduğunu ve rivayetlerinin tamamını aktarma izni verdiğini söylemiştir. {cite:shadharat-dhahab s. 254-255} {cite:encyclopaedia-of-islam-2 cilt 6 s. 213-214}."
  id: "Taqi al-Din al-Maqrizi wafat di Kairo pada hari Kamis, tanggal 16 Ramadan 845 H (14 Februari 1442 M), dan dimakamkan di pemakaman Sufi di luar Bab al-Nasr. Usianya sekitar delapan puluh tahun. Ia meninggalkan dua ratus buku hasil karyanya sendiri dan riwayat-riwayatnya: *Al-Mawa'iz wa al-I'tibar fi al-Khitat wa al-Athar* (Khotbah dan Pelajaran tentang Rencana dan Monumen), *Al-Suluk fi Duwal al-Muluk* (Tata Krama Spiritual pada Masa Dinasti Raja-raja), *Durar al-'Uqud* (Mutiara Perjanjian), *Al-Muqaffa* (Kitab Berima), dan *Al-Khabar 'an al-Bashar* (Kisah Manusia), yang tidak sempat ia selesaikan. Ibn Taghribirdi mengatakan bahwa ia membacakan banyak karyanya kepada Taqi dan bahwa Taqi memberinya izin untuk menyampaikan semua riwayatnya. {mengutip:shadharat-dhahab hal. 254-255} {kutip:ensiklopedia-Islam-2 vol. 6 hal. 213-214}."
