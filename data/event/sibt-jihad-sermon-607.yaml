label: { ar: "مجلس سبط ابن الجوزي بجامع دمشق وخروجه إلى نابلس سنة 607هـ", en: "Sibt ibn al-Jawzi's session in the Damascus mosque and march to Nablus, 607 AH", ur: "607ھ میں جامع دمشق میں سبط ابن الجوزی کی مجلس اور نابلس کی طرف کوچ", es: "Sesión de Sibt ibn al-Jawzi en la mezquita de Damasco y marcha a Nablus, 607 AH", fr: "Séance de Sibt ibn al-Jawzi à la mosquée de Damas et marche vers Naplouse, 607 AH" }
summary:
  ar: "يروي سبط ابن الجوزي أنه جلس بجامع دمشق يوم السبت خامس ربيع الأول سنة 607هـ، وحُزر الناس بثلاثين ألفاً، فحمل إليهم ثلاثمائة شكال لخيل المجاهدين صنعها من شعور اجتمعت عنده، فقطع الناس مثلها، ثم خرج بهم إلى نابلس للغزاة فلقيه الملك المعظم عيسى، وأغاروا على بلاد الفرنج {cite:mirat-al-zaman-risala-2013-v22 p.172} {cite:mirat-al-zaman-risala-2013-v22 p.173}. ويضع ابن العماد الخبر في سنة 606هـ {cite:shadharat-dhahab p. 26}."
  en: "Sibt ibn al-Jawzi relates that he held a session in the Damascus mosque on Saturday 5 Rabi' I 607 AH, with a crowd estimated at thirty thousand, and had three hundred hobbles for the fighters' horses, made from hair that had been given him, carried in, whereupon people cut off their own hair likewise; he then led them to Nablus for the campaign, where al-Malik al-Mu'azzam Isa met him, and they raided Frankish territory. Ibn al-Imad places the episode in 606 AH."
  es: "Sibt ibn al-Jawzi relata que celebró una reunión en la mezquita de Damasco el sábado 5 de Rabi' I del año 607 de la Hégira, con una multitud estimada en treinta mil personas. Hizo traer trescientos ojales para los caballos de los combatientes, hechos con cabello que le habían dado, tras lo cual la gente se cortó el cabello de la misma manera. Luego los condujo a Nablus para la campaña, donde se reunió con al-Malik al-Mu'azzam Isa, y juntos saquearon territorio franco. Ibn al-Imad sitúa este episodio en el año 606 de la Hégira."
  fr: "Sibt ibn al-Jawzi rapporte qu'il tint une réunion à la mosquée de Damas le samedi 5 Rabi' I 607 AH, devant une foule estimée à trente mille personnes. Il fit apporter trois cents entraves pour les chevaux des guerriers, confectionnées avec des cheveux qui lui avaient été offerts, et les fidèles se coupèrent les cheveux à leur tour. Il les mena ensuite à Naplouse pour la campagne, où il rencontra al-Malik al-Mu'azzam Isa, et ils pillèrent le territoire franc. Ibn al-Imad situe cet épisode en 606 AH."
