summary:
  ar: "دار ثقل المعركة حول لواء المشركين الذي كان بيد بني عبد الدار. قُتل أول حامل لاء لواء طلحة بن أبي طلحة على يد الزبير بن العوام. وتعاقب بنو عبد الدار على حمل اللواء فأُبيدوا عن آخرهم: عثمان وأبو سعد وأرطاة وشريح وأبو زيد بن عبد مناف وابن شرحبيل وغيرهم. حمله أخيراً غلام حبشي اسمه صواب فقاتل حتى قُطعت يداه فبرك عليه بصدره حتى قُتل. سقط اللواء على الأرض ولم يبق أحد يحمله {cite:mubarakpuri-raheeq p.259}."
