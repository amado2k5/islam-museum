label: { ar: "يوم الكلاب الأول", en: "The First Day of al-Kullab", es: "El primer día de al-Kullab", fr: "Le premier jour d'al-Kullab", ur: "الکلب کا پہلا دن", tr: "İlk Köpek Günü", id: "Hari Anjing Pertama" }
summary:
  ar: "يوم الكلاب الأول، الوقعة التي تقاتل فيها أبناء الحارث الكندي بعد هلاكه؛ لما مات الحارث بن عمرو تشتت أمر بنيه الملوك على قبائل معد حتى جمع كل واحد جموع من كان معه وزحفوا بعضهم على بعض، فنزل شرحبيل بمن معه من بكر بن وائل وحلفائهم الكلاب وهو ماء بين البصرة والكوفة وأقبل سلمة بمن معه من تغلب والصنائع وعليهم السفاح بن خالد، فاقتتلوا قتالاً شديداً ونادى كل منهما بمائة من الإبل لمن جاءه برأس صاحبه، وكانت الغلبة آخر النهار لتغلب وسلمة، وتبع ذو السنينة التغلبي شرحبيل فضربه شرحبيل على ركبته فأطن رجله فهلك، فحمل عليه أخوه أبو حنش فطعنه فألقاه عن فرسه وأخذ رأسه فبعث به إلى سلمة، فعرفت الندامة والجزع في وجه سلمة وقال لو كنت ألقيته أرفق من هذا {cite:kamil-ibn-al-athir p. 410-411}."
  en: "The first day of al-Kullab, when the dead al-Harith's Kindite sons fell on each other at the water of al-Kullab between Basra and Kufa: Shurahbil with Bakr against Salama with Taghlib and the sana'i', a hundred camels cried for each brother's head, and at day's end Taghlib prevailed — Abu Hanash avenging his brother Dhu al-Sunayna by taking Shurahbil's head to Salama, who only grieved {cite:kamil-ibn-al-athir p. 410-411}."
  es: "El primer día de al-Kullab, cuando los hijos Kinditas del difunto al-Harith se enfrentaron en las aguas de al-Kullab entre Basora y Kufa: Shurahbil con Bakr contra Salama con Taghlib y los sana'i', cien camellos clamaron por la cabeza de cada hermano, y al final del día Taghlib prevaleció: Abu Hanash vengó a su hermano Dhu al-Sunayna llevando la cabeza de Shurahbil a Salama, quien solo se lamentó {cite:kamil-ibn-al-athir p. 410-411}."
  fr: "Le premier jour d'al-Kullab, lorsque les fils Kindites morts d'al-Harith tombèrent les uns sur les autres au bord de l'eau d'al-Kullab entre Basra et Kufa: Shurahbil avec Bakr contre Salama avec Taghlib et les sana'i', cent chameaux réclamèrent la tête de chaque frère, et à la fin du jour, Taghlib l'emporta — Abu Hanash vengeant son frère Dhu al-Sunayna en apportant la tête de Shurahbil à Salama, qui ne fit que s'affliger {cite:kamil-ibn-al-athir p. 410-411}."
  ur: "القلب کے پہلے دن جب حارث کے مردہ بیٹے بصرہ اور کوفہ کے درمیان الکلب کے پانی پر ایک دوسرے پر گر پڑے: شورابیل بکر کے ساتھ سلامہ کے ساتھ تغلب اور صنعاء کے ساتھ، سو اونٹ ہر ایک بھائی کے سر کے لیے پکارے، اور دن کے اختتام پر ابو حنظلہ نے اپنے بھائی ابو حنظلہ کو فتح کر لیا۔ شورابیل کا سر سلامہ کی طرف، جو صرف غمگین تھا {حوالہ: کامل ابن الاثیر ص۔ 410-411}۔"
  tr: "Köpekler Savaşı'nın ilk günü, Al-Harith Al-Kindi'nin ölümünden sonra oğullarının savaştığı gündü; Al-Harith bin Amr öldüğünde, kraliyet oğullarının işleri Ma'ad kabileleri arasında dağıldı ve her biri yanındakilerin güçlerini toplayıp birbirlerine saldırdılar. Şerabil, Bakr bin Wa'il ve müttefikleriyle birlikte Basra ile Kufa arasında bir su kaynağı olan Al-Kalab'da kamp kurdu. Salama ise Taghlib ve Al-Sana'i'den gelenlerle birlikte geldi ve onlara Al-Saffah bin Halid önderlik ediyordu. Şiddetli bir savaş verdiler ve her biri rakibinin kellesini getirene yüz deve istedi. Günün sonunda zafer Taghlib ve Salama'nın oldu. Zü'l-Sunayna Al-Taghlibi Şerabil'i kovaladı, Şerabil de ona dizine vurdu, bacağını kopardı ve öldü. Sonra kardeşi Ebu Hanaş ona saldırdı ve onu bıçakladı. Bunun üzerine Ebu Hanaş onu atından indirdi, başını aldı ve Selama'ya gönderdi. Selama'nın yüzünde pişmanlık ve üzüntü gördüm ve şöyle dedi: \"Keşke onu daha nazikçe atmış olsaydım.\" {Kaynak: Kamil İbn el-Atir s. 410-411}"
  id: "Hari pertama Perang Anjing, pertempuran di mana putra-putra Al-Harith Al-Kindi bertempur setelah kematiannya; ketika Al-Harith bin Amr meninggal, urusan putra-putra rajanya tersebar di antara suku-suku Ma'ad sampai masing-masing mengumpulkan pasukan dari mereka yang bersamanya dan mereka maju saling menyerang. Sharhabil, bersama orang-orang yang bersamanya dari Bakr bin Wa'il dan sekutu mereka, berkemah di Al-Kalab, yang merupakan tempat minum di antara Basra dan Kufa, dan Salama datang bersama orang-orang yang bersamanya dari Taghlib dan Al-Sana'i, dan mereka dipimpin oleh Al-Saffah bin Khalid. Mereka bertempur dengan sengit, dan masing-masing dari mereka meminta seratus unta untuk siapa pun yang membawakan kepala lawannya. Kemenangan berada di pihak Taghlib dan Salama pada akhir hari. Dhu Al-Sunayna Al-Taghlibi mengejar Sharhabil, lalu Sharhabil memukul lututnya, sehingga kakinya putus dan ia meninggal. Kemudian saudaranya, Abu Hanash, menyerangnya dan menikamnya, lalu ia melemparkannya dari kudanya dan mengambil kepalanya lalu mengirimkannya kepada Salama. Aku melihat penyesalan dan kesedihan di wajah Salama, dan ia berkata, “Seandainya aku melemparkannya dengan lebih lembut dari ini.” {cite:kamil-ibn-al-athir p. 410-411}."
