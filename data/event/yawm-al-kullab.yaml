label: { ar: "يوم الكلاب الأول" }
summary:
  ar: "يوم الكلاب الأول، الوقعة التي تقاتل فيها أبناء الحارث الكندي بعد هلاكه؛ لما مات الحارث بن عمرو تشتت أمر بنيه الملوك على قبائل معد حتى جمع كل واحد جموع من كان معه وزحفوا بعضهم على بعض، فنزل شرحبيل بمن معه من بكر بن وائل وحلفائهم الكلاب وهو ماء بين البصرة والكوفة وأقبل سلمة بمن معه من تغلب والصنائع وعليهم السفاح بن خالد، فاقتتلوا قتالاً شديداً ونادى كل منهما بمائة من الإبل لمن جاءه برأس صاحبه، وكانت الغلبة آخر النهار لتغلب وسلمة، وتبع ذو السنينة التغلبي شرحبيل فضربه شرحبيل على ركبته فأطن رجله فهلك، فحمل عليه أخوه أبو حنش فطعنه فألقاه عن فرسه وأخذ رأسه فبعث به إلى سلمة، فعرفت الندامة والجزع في وجه سلمة وقال لو كنت ألقيته أرفق من هذا {cite:kamil-ibn-al-athir p. 410-411}."
  en: "The first day of al-Kullab, when the dead al-Harith's Kindite sons fell on each other at the water of al-Kullab between Basra and Kufa: Shurahbil with Bakr against Salama with Taghlib and the sana'i', a hundred camels cried for each brother's head, and at day's end Taghlib prevailed — Abu Hanash avenging his brother Dhu al-Sunayna by taking Shurahbil's head to Salama, who only grieved {cite:kamil-ibn-al-athir p. 410-411}."
