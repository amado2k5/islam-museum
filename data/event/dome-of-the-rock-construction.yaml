id: event/dome-of-the-rock-construction
class: event
kind: other
label: { ar: "بناء قبة الصخرة في عهد عبد الملك بن مروان", en: "Construction of the Dome of the Rock under Abd al-Malik", es: "Construcción de la Cúpula de la Roca bajo el mandato de Abd al-Malik.", fr: "Construction du Dôme du Rocher sous Abd al-Malik", ur: "عبد الملک کے ماتحت چٹان کے گنبد کی تعمیر", tr: "Kubbetü'l-Sahrâ, Abdülmalik ibn Mervan'ın hükümdarlığı döneminde inşa edilmiştir.", id: "Kubah Batu dibangun pada masa pemerintahan Abd al-Malik ibn Marwan." }
summary:
  ar: "بناء قبة الصخرة فوق الصخرة المقدسة في الحرم ببيت المقدس، أمر به عبد الملك بن مروان؛ شُرع فيه سنة 66هـ ⁦(685م)⁩ وفُرغ منه سنة 72هـ ⁦(691م)⁩، وينقل الكتاب أن نفقته أُخذت من خراج مصر سبع سنوات {cite:bayt-al-maqdis-fi-al-islam-azhar p. 17, 43}."
  en: "Building of the Dome of the Rock over the sacred rock in the Haram at Jerusalem, ordered by Abd al-Malik ibn Marwan; begun in 66 AH (685 CE) and finished in 72 AH (691 CE), the book says, with its cost drawn from seven years of Egypt's land revenue {cite:bayt-al-maqdis-fi-al-islam-azhar p. 17, 43}."
  es: "La construcción de la Cúpula de la Roca sobre la roca sagrada en el Haram de Jerusalén, ordenada por Abd al-Malik ibn Marwan, comenzó en el año 66 AH (685 d. C.) y terminó en el año 72 AH (691 d. C.), según el libro, y su costo provino de siete años de los ingresos territoriales de Egipto {cite:bayt-al-maqdis-fi-al-islam-azhar p. 17, 43}."
  fr: "La construction du Dôme du Rocher sur le rocher sacré du Haram à Jérusalem, ordonnée par Abd al-Malik ibn Marwan, a commencé en 66 AH (685 CE) et s'est terminée en 72 AH (691 CE), selon le livre, son coût étant tiré de sept années de revenus fonciers de l'Égypte {cite:bayt-al-maqdis-fi-al-islam-azhar p. 17, 43}."
  ur: "یروشلم میں حرم میں مقدس چٹان پر چٹان کے گنبد کی تعمیر، جس کا حکم عبد الملک ابن مروان نے دیا تھا۔ 66 ہجری ⁦(685 عیسوی)⁩ میں شروع ہوا اور 72 ہجری ⁦(691 عیسوی)⁩ میں ختم ہوا، کتاب کہتی ہے کہ اس کی لاگت مصر کی زمینی آمدنی کے سات سال سے لی گئی ہے۔ 17، 43}۔"
  tr: "Kudüs mabedindeki kutsal kaya üzerine Kubbetü'l-Sahrâ'nın inşası Abdülmalik ibn Mervan tarafından emredilmiştir; Hicri 66 yılında (685 yılında) başlanmış ve Hicri 72 yılında (691 yılında) tamamlanmıştır. Kitapta, masraflarının yedi yıl boyunca Mısır'ın vergi gelirlerinden karşılandığı bildirilmektedir. {cite:bayt-al-maqdis-fi-al-islam-azhar s. 17, 43}"
  id: "Pembangunan Kubah Batu di atas batu suci di tempat suci Yerusalem diperintahkan oleh Abd al-Malik ibn Marwan; pembangunannya dimulai pada tahun 66 H (685 M) dan selesai pada tahun 72 H (691 M). Kitab tersebut melaporkan bahwa biaya pembangunannya diambil dari pendapatan pajak Mesir selama tujuh tahun {cite:bayt-al-maqdis-fi-al-islam-azhar p. 17, 43}."
