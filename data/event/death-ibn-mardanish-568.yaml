label: { ar: "وفاة ابن مردنيش وملك يوسف بن عبد المؤمن بلاده", en: "death of Ibn Mardanīsh — Yūsuf ibn ʿAbd al-Muʾmin takes his lands", es: "Muerte de Ibn Mardanīsh: Yūsuf ibn ʿAbd al-Muʾmin toma posesión de sus tierras.", fr: "Mort d'Ibn Mardanīsh — Yūsuf ibn ʿAbd al-Muʾmin s'empare de ses terres", ur: "ابن مردانیش کی موت - یوسف بن عبد المومن نے اس کی زمینیں لے لی", tr: "İbn Mardaniş'in ölümü ve Yusuf ibn Abdülmümin'in onun toprakları üzerindeki yönetimi.", id: "Kematian Ibn Mardanish dan pemerintahan Yusuf ibn Abd al-Mu'min atas tanah miliknya." }
