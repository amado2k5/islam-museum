summary:
  ar: "توفي ابن مردنيش صاحب شرق الأندلس فملك يوسف بن عبد المؤمن الموحدي بلاده، فاستتب له شرق الأندلس وقفصة وأعمالها وانضافت إلى ما ملكه من المغرب {cite:kamil-ibn-al-athir p. 37}."
  en: "Ibn Mardanīsh, lord of the Spanish east, died and the Almohad Yūsuf ibn ʿAbd al-Muʾmin took his lands — the eastern provinces and Qafsa fell to him, joined to his Maghreb realm {cite:kamil-ibn-al-athir p. 37}."
  es: "Ibn Mardanīsh, señor del oriente español, murió y el almohade Yūsuf ibn ʿAbd al-Muʾmin tomó sus tierras: las provincias orientales y Qafsa cayeron en sus manos, unidas a su reino del Magreb {cite:kamil-ibn-al-athir p. 37}."
  fr: "Ibn Mardanīsh, seigneur de l'est espagnol, mourut et l'Almohade Yūsuf ibn ʿAbd al-Muʾmin prit ses terres — les provinces orientales et Qafsa lui tombèrent dessus, rattachées à son royaume du Maghreb {cite:kamil-ibn-al-athir p. 37}."
  ur: "ابن مردانیش، ہسپانوی مشرق کا آقا، وفات پا گیا اور المحدث یوسف بن عبدالمومن نے اس کی زمینیں لے لیں - مشرقی صوبے اور قفس اس کے قبضے میں آگئے، اس کے مغرب میں شامل ہوگئے۔ 37}۔"
  tr: "Doğu Endülüs hükümdarı İbn Mardaniş öldü ve Yusuf ibn Abdülmümin el-Muvahhid onun topraklarının kontrolünü ele aldı. Böylece, Doğu Endülüs, Kafsa ve toprakları onun yönetimi altında kuruldu ve Fas'taki mülklerine eklendi. {Kaynak: Kamil ibn el-Athir s. 37}"
  id: "Ibn Mardanish, penguasa Andalusia timur, meninggal dunia, dan Yusuf ibn Abd al-Mu’min al-Muwahhid mengambil alih wilayahnya. Dengan demikian, Andalusia timur, Qafsa, dan wilayah-wilayahnya berada di bawah kekuasaannya dan ditambahkan ke wilayah yang dimilikinya di Maroko {cite:kamil-ibn-al-athir p. 37}."
