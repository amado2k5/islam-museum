label: { ar: "فتح الشام", en: "The Conquest of Syria" }
summary:
  ar: "عند البلاذري: لما فرغ أبو بكر من أمر أهل الردة وجّه الجيوش إلى الشام فعقد ثلاثة ألوية لخالد بن سعيد (فعزله) وشرحبيل بن حسنة وعمرو بن العاص وأمر الأخيرين ويزيد بن أبي سفيان على طرق أيلة وتبوك وتتامّ جمعهم أربعة وعشرين ألفاً، فقاتلوا بداثن والعربة أول قتالهم، وولّى الواقديَّ روايةً عمرو بن العاص فلسطين وشرحبيلَ الأردنَ ويزيدَ دمشق؛ ثم سار خالد بن الوليد من العراق فجاءهم في ربيع الآخر سنة 13 فأميروه في كل حرب، فكانت وقعة أجنادين الكبرى يوم الاثنين لاثنتي عشرة ليلة بقيت من جمادى الأولى سنة 13 وفتحوا بصرى صلحاً وافتتح شرحبيل الأردن عنوة ما خلا طبريّة، ثم وقعة فحل بعد خلافة عمر بخمسة أشهر وأمير الناس أبو عبيدة بن الجراح بولاية من عمر، ثم يوم مرج الصفر لهلال المحرم سنة 14، ثم فتح دمشق وبيت المقدس."
  en: "In al-Baladhuri: when Abu Bakr finished with the apostates he dispatched the armies to Syria, binding three banners — for Khalid ibn Sa'id (whom he deposed), Shurahbil ibn Hasana and Amr ibn al-As — directing them and Yazid ibn Abi Sufyan by the Ayla and Tabuk roads until their number completed at twenty-four thousand; their first fighting came at Dathin and al-Araba, and al-Waqidi's account assigns Amr Filastin, Shurahbil al-Urdunn and Yazid Dimashq; Khalid ibn al-Walid then marched from Iraq reaching them in Rabi' al-Akhir year 13, and they made him commander in every battle; the great battle of Ajnadayn fell on Monday twelve nights remaining of Jumada I year 13, Busra fell by treaty, Shurahbil conquered al-Urdunn by force save Tabariyya, the battle of Fihl came five months into Umar's caliphate with Abu Ubayda ibn al-Jarrah commanding by Umar's investiture, the day of Marj al-Suffar at the new moon of al-Muharram year 14, and then the conquest of Damascus and Bayt al-Maqdis."
