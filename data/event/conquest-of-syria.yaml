label: { ar: "فتح الشام", en: "The Conquest of Syria", es: "La conquista de Siria", fr: "La conquête de la Syrie", ur: "شام کی فتح", tr: "Levant'ın Fethi", id: "Penaklukan Levant" }
summary:
  ar: "عند البلاذري: لما فرغ أبو بكر من أمر أهل الردة وجّه الجيوش إلى الشام فعقد ثلاثة ألوية لخالد بن سعيد ⁦(فعزله)⁩ وشرحبيل بن حسنة وعمرو بن العاص وأمر الأخيرين ويزيد بن أبي سفيان على طرق أيلة وتبوك وتتامّ جمعهم أربعة وعشرين ألفاً، فقاتلوا بداثن والعربة أول قتالهم، وولّى الواقديَّ روايةً عمرو بن العاص فلسطين وشرحبيلَ الأردنَ ويزيدَ دمشق؛ ثم سار خالد بن الوليد من العراق فجاءهم في ربيع الآخر سنة 13 فأميروه في كل حرب، فكانت وقعة أجنادين الكبرى يوم الاثنين لاثنتي عشرة ليلة بقيت من جمادى الأولى سنة 13 وفتحوا بصرى صلحاً وافتتح شرحبيل الأردن عنوة ما خلا طبريّة، ثم وقعة فحل بعد خلافة عمر بخمسة أشهر وأمير الناس أبو عبيدة بن الجراح بولاية من عمر، ثم يوم مرج الصفر لهلال المحرم سنة 14، ثم فتح دمشق وبيت المقدس."
  en: "In al-Baladhuri: when Abu Bakr finished with the apostates he dispatched the armies to Syria, binding three banners — for Khalid ibn Sa'id (whom he deposed), Shurahbil ibn Hasana and Amr ibn al-As — directing them and Yazid ibn Abi Sufyan by the Ayla and Tabuk roads until their number completed at twenty-four thousand; their first fighting came at Dathin and al-Araba, and al-Waqidi's account assigns Amr Filastin, Shurahbil al-Urdunn and Yazid Dimashq; Khalid ibn al-Walid then marched from Iraq reaching them in Rabi' al-Akhir year 13, and they made him commander in every battle; the great battle of Ajnadayn fell on Monday twelve nights remaining of Jumada I year 13, Busra fell by treaty, Shurahbil conquered al-Urdunn by force save Tabariyya, the battle of Fihl came five months into Umar's caliphate with Abu Ubayda ibn al-Jarrah commanding by Umar's investiture, the day of Marj al-Suffar at the new moon of al-Muharram year 14, and then the conquest of Damascus and Bayt al-Maqdis."
  es: "En al-Baladhuri: cuando Abu Bakr terminó con los apóstatas, envió ejércitos a Siria, atando tres estandartes —para Khalid ibn Sa'id (a quien depuso), Shurahbil ibn Hasana y Amr ibn al-As— dirigiéndolos a ellos y a Yazid ibn Abi Sufyan por los caminos de Ayla y Tabuk hasta que su número se completó en veinticuatro mil; su primer combate tuvo lugar en Dathin y al-Araba, y el relato de al-Waqidi asigna a Amr Filastin, Shurahbil al-Urdunn y Yazid Dimashq; Khalid ibn al-Walid marchó entonces desde Irak llegando a ellos en Rabi' al-Akhir año 13, y lo hicieron comandante en cada batalla; La gran batalla de Ajnadayn tuvo lugar el lunes, doce noches antes del final del Jumada I del año 13; Busra cayó por tratado; Shurahbil conquistó al-Urdunn por la fuerza, excepto Tabariyya; la batalla de Fihl tuvo lugar cinco meses después del inicio del califato de Umar, con Abu Ubayda ibn al-Jarrah al mando por investidura de Umar; el día de Marj al-Suffar, en la luna nueva de al-Muharram del año 14; y luego la conquista de Damasco y Bayt al-Maqdis."
  fr: "Dans al-Baladhuri: lorsqu'Abu Bakr eut vaincu les apostats, il envoya les armées en Syrie, nouant trois bannières — pour Khalid ibn Sa'id (qu'il avait déposé), Shurahbil ibn Hasana et Amr ibn al-As — les dirigeant, ainsi que Yazid ibn Abi Sufyan, par les routes d'Ayla et de Tabuk jusqu'à ce que leurs effectifs atteignent vingt-quatre mille hommes; leurs premiers combats eurent lieu à Dathin et al-Araba, et le récit d'al-Waqidi attribue Amr Filastin, Shurahbil al-Urdunn et Yazid Dimashq; Khalid ibn al-Walid marcha ensuite d'Irak et les rejoignit en Rabi' al-Akhir de l'an 13, et ils le nommèrent commandant dans chaque bataille; La grande bataille d'Ajnadayn eut lieu le lundi des douze dernières nuits de Jumada I an 13, Busra tomba par traité, Shurahbil conquit al-Urdunn par la force sauf Tabariyya, la bataille de Fihl eut lieu cinq mois après le début du califat d'Umar, avec Abu Ubayda ibn al-Jarrah commandant par l'investiture d'Umar, le jour de Marj al-Suffar à la nouvelle lune d'al-Muharram an 14, puis la conquête de Damas et de Bayt al-Maqdis."
  ur: "البلادوری میں ہے: جب ابوبکر نے مرتدوں کے ساتھ ختم کیا تو اس نے لشکروں کو شام کی طرف روانہ کیا، تین جھنڈے باندھے - خالد بن سعید ⁦(جن کو اس نے معزول کیا)⁩، شورابیل ابن حسنہ اور عمرو بن العاص - ان کو اور یزید ابن ابی سفیان کو ہدایت دیتے ہوئے کہ وہ طائفو اور طائفو کی سڑک پر اپنی تعداد پوری کر لیں۔ ہزار ان کی پہلی لڑائی داتھین اور العربہ میں ہوئی، اور الواقدی کا بیان عمرو فلاسطین، شورابیل اردون اور یزید دمشق کو تفویض کرتا ہے۔ اس کے بعد خالد بن الولید 13 ربیع الآخر میں عراق سے کوچ کر کے ان تک پہنچے اور انہوں نے انہیں ہر جنگ میں سپہ سالار بنایا۔ اجنادین کی عظیم جنگ سوموار کو ہوئی جو 13 جمادی الثانی کی بارہ راتیں باقی رہ گئی تھی، بصرہ معاہدہ کے ذریعے گرا، شورابیل نے طبریہ کو بچا کر الاردون کو طاقت سے فتح کیا، جنگ فہل کے پانچ ماہ بعد عمر کی خلافت میں ابو عبیدہ بن الجراح کی کمان ہوئی، جس میں عمر کے نئے دن مرعون کی حکومت تھی۔ 14 محرم الحرام، اور پھر دمشق اور بیت المقدس کی فتح۔"
  tr: "El-Baladhuri'ye göre: Ebu Bekir mürtedler meselesini bitirdikten sonra orduları Levant'a yönlendirdi ve Halid bin Said'e (sonra onu görevden aldı), Şurahbil bin Hasana'ya ve Amr bin el-Aas'a üç tugay atadı. Son ikisine ve Yezid bin Ebu Sufyan'a Ayla ve Tebük yollarında bulunmalarını emretti. Topladıkları ordu yirmi dört bin kişiden oluşuyordu ve ilk savaşları olan Dathan ve El-Araba'da savaştılar. Bir rivayete göre El-Vakidi, Amr bin el-Aas'ı Filistin'e, Şurahbil'i Ürdün'e ve Yezid'i Şam'a atadı. Sonra Halid bin el-Velid Irak'tan yürüyerek 13. yılın Rebiü'l-Ahir ayında onlara katıldı. Onu her savaşta komutan olarak atadılar. Büyük Ecnadayn Muharebesi, 13. yılın Cemâdî-i Ula ayının bitimine on iki gece kala, Pazartesi günü gerçekleşti. Busra'yı barışçıl bir şekilde fethettiler ve Şurahbil, Taberiye hariç, Ürdün'ü zorla ele geçirdi. Ardından, Ömer'in halifeliğinden beş ay sonra Fahl Muharebesi gerçekleşti ve halkın komutanı, Ömer tarafından atanan Ebu Ubeyde bin El-Cerre idi. Sonra, 14. yılın Muharrem ayının hilalinde Mercü'l-Saffar günü geldi. Ardından Şam ve Kudüs'ü fethetti."
  id: "Menurut Al-Baladhuri: Ketika Abu Bakr menyelesaikan masalah kaum murtad, ia mengarahkan pasukan ke Levant dan menunjuk tiga brigade kepada Khalid bin Saeed (kemudian memecatnya), Shurahbil bin Hasana, dan Amr bin Al-Aas. Ia memerintahkan dua orang terakhir dan Yazid bin Abi Sufyan untuk berada di jalan Ayla dan Tabuk. Pasukan mereka berjumlah dua puluh empat ribu orang, dan mereka berperang di Dathan dan Al-Araba, pertempuran pertama mereka. Al-Waqidi, menurut sebuah riwayat, menunjuk Amr bin Al-Aas ke Palestina, Shurahbil ke Yordania, dan Yazid ke Damaskus. Kemudian Khalid bin Al-Walid berbaris dari Irak dan datang kepada mereka pada bulan Rabi' Al-Akhir tahun 13. Mereka menunjuknya sebagai komandan mereka dalam setiap peperangan. Perang Ajnadayn yang agung terjadi pada hari Senin, dua belas malam tersisa di Jumada Al-Ula tahun 13. Mereka menaklukkan Busra secara damai, dan Shurahbil menaklukkan Yordania dengan kekerasan, kecuali Tiberias. Kemudian Perang Fahl terjadi lima bulan setelah kekhalifahan Umar, dan panglima rakyatnya adalah Abu Ubaidah bin Al-Jarrah, yang diangkat oleh Umar. Kemudian hari Marj Al-Saffar jatuh pada bulan sabit Muharram tahun 14. Kemudian ia menaklukkan Damaskus dan Yerusalem."
