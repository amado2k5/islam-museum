label:
  ar: "بِيعُ ياقوتَ الصغير في بغداد للتاجر عسكر الحموي، نحو ٥٨٠هـ/١١٨٤م"
  en: "The child Yaqut sold in Baghdad to the merchant Askar al-Hamawi, c. 580/1184"
  ur: "بچہ یاقوت بغداد میں تاجر عسکر حموی کو فروخت، تقریباً 580ھ/1184ء"
summary:
  ar: "أُخذ ياقوت أسيراً وهو صغير جداً من بلاد الروم، وحُمل إلى بغداد في الخامسة أو السادسة من عمره، فابتاعه رجل تاجر يكاد لا يقرأ هو عسكر بن النصر الحموي، وسمّاه ياقوتاً على عادة تسمية الموالي بأسماء الجواهر، وجعله في الكتاب وأدّبه لينفعه في تجارته {cite:encyclopaedia-of-islam-2 vol. 11 p. 264}؛ وممن علّمه لاحقاً أبو البقاء العكبري وابن يعيش {cite:encyclopaedia-of-islam-2 vol. 11 p. 264}."
  en: "Taken captive while still very young in Byzantine territory, Yaqut was carried to Baghdad at the age of five or six and bought by the barely literate merchant Askar ibn al-Nasr al-Hamawi, who named him Yaqut — the customary gemstone name for a mawla — and gave him a Qur'anic schooling so he could serve the business {cite:encyclopaedia-of-islam-2 vol. 11 p. 264}; among his later teachers were Abu al-Baqa' al-Ukbari and Ibn Ya'ish {cite:encyclopaedia-of-islam-2 vol. 11 p. 264}."
  ur: "یاقوت ابھی بہت چھوٹا تھا کہ بلاد روم سے قیدی بنا کر بغداد لایا گیا، پانچ چھ سال کی عمر میں؛ اسے بمشکل خواندہ تاجر عسکر بن نصر حموی نے خریدا، نام یاقوت رکھا — موالیوں کو جواہر کے نام دینے کی عادت کے مطابق — اور کتب خانے میں ڈالا تاکہ تجارت میں کام آئے {cite:encyclopaedia-of-islam-2 vol. 11 p. 264}؛ بعد کے اساتذہ میں ابو البقاء عکبری اور ابن یعش شامل تھے {cite:encyclopaedia-of-islam-2 vol. 11 p. 264}۔"
