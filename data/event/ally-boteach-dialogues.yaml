label: { ar: "حوارات شبير علي مع الحاخام بوتيش", en: "Shabir Ally–Shmuley Boteach dialogues", es: "Diálogos entre Shabir Ally y Shmuley Boteach", fr: "Dialogues entre Shabir Ally et Shmuley Boteach", ur: "شبیر ایلی – شمولی بوٹیچ کے مکالمے", tr: "Şabir Ali'nin Haham Botish ile diyalogları", id: "Dialog Shabir Ali dengan Rabbi Botish" }
summary:
  ar: "حوارات عامة مسجلة ومنضبطة شارك فيها العالِم السني [[person/shabir-ally|شبير علي]] مع شخصيات يهودية وعلى رأسها الحاخام [[person/shmuley-boteach|شموئيل بوتيش]]، تناقض خاتمية القرآن العالمية بالعهد الموسوي الدائم، وتقابل نظامي الحلال والشرع بالهالاخاه، ومقام نبوة محمد؛ وهي النمط الأكاديمي الذي انتقلت إليه المناظرة الإسلامية–اليهودية الحديثة {cite:youtube-sunni-jewish-debate}."
  en: "Recorded, moderated public dialogues in which the Sunni scholar [[person/shabir-ally|Shabir Ally]] engaged Jewish figures, foremost Rabbi [[person/shmuley-boteach|Shmuley Boteach]], contrasting the Qur'an's universal finality with the eternal Mosaic covenant, halal and sharia against halakha, and the standing of Muhammad's prophethood. They are the academic pattern into which the modern Muslim–Jewish debate has moved {cite:youtube-sunni-jewish-debate}."
  es: "Diálogos públicos grabados y moderados en los que el erudito sunita Shabir Ally dialogó con figuras judías, principalmente el rabino Shmuley Boteach, contrastando la finalidad universal del Corán con el pacto mosaico eterno, lo halal y la sharia con la halajá, y la posición de la profecía de Mahoma. Estos diálogos constituyen el modelo académico que ha marcado el debate moderno entre musulmanes y judíos."
  fr: "Des dialogues publics enregistrés et modérés, au cours desquels le théologien sunnite Shabir Ally a dialogué avec des personnalités juives, notamment le rabbin Shmuley Boteach, ont opposé le caractère définitif et universel du Coran à l'alliance mosaïque éternelle, le halal et la charia à la halakha, et la validité de la prophétie de Mahomet. Ces échanges constituent le modèle académique dans lequel s'est orienté le débat judéo-musulman moderne {cite:youtube-sunni-jewish-debate}."
  ur: "ریکارڈ شدہ، معتدل عوامی مکالمے جن میں سنی اسکالر [[شخص/شبیر-الائی|شبیر اتحادی]] نے یہودی شخصیات، صف اول کے ربی [[شخص/شمولے بوٹیچ|شمولی بوٹیچ]] سے بات چیت کی، جو قرآن کے آفاقی حتمیت کو ابدی، موزیک حلال اور حلال کے خلاف کھڑے ہونے کے ساتھ متصادم رکھتے ہیں۔ محمد کی نبوت۔ یہ وہ علمی نمونہ ہیں جس میں جدید مسلم-یہودی بحث {حوالہ: یوٹیوب-سنی-یہودی-بحث} منتقل ہوئی ہے۔"
  tr: "Sünni alim [[person/shabir-ally|Shabir Ali]]'nin, özellikle Haham [[person/shmuley-boteach|Shmuel Boteach]] başta olmak üzere Yahudi şahsiyetlerle katıldığı, Kur'an'ın evrensel sonluluğunu kalıcı Musa ahdi ile çeliştiren, Helal ve Şeriat sistemlerini Halakha ile karşılaştıran ve Muhammed'in peygamberliğinin statüsünü tartışan, kayıt altına alınmış ve disipline edilmiş kamuya açık diyaloglar; modern İslam-Yahudi tartışmasının yöneldiği akademik tarz budur."
  id: "Dialog publik yang direkam dan terstruktur di mana cendekiawan Sunni [[person/shabir-ally|Shabir Ali]] berpartisipasi dengan tokoh-tokoh Yahudi, terutama Rabbi [[person/shmuley-boteach|Shmuel Boteach]], yang mempertentangkan finalitas universal Al-Qur'an dengan perjanjian Musa yang kekal, membandingkan sistem Halal dan Syariah dengan Halakha, dan status kenabian Muhammad; inilah gaya akademis yang telah diadopsi oleh debat Islam-Yahudi modern {cite:youtube-sunni-jewish-debate}."
