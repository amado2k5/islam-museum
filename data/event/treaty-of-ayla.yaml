label: { ar: "صلح النبي مع يحنة بن رؤبة صاحب أيلة", en: "The treaty with Yuhanna ibn Ru'ba, lord of Ayla" }
summary:
  ar: "لما انتهى النبي إلى تبوك أتاه يحنة بن رؤبة صاحب أيلة فصالحه وأعطاه الجزية، وأتاه أهل جرباء وأذرح فأعطوه الجزية، وكتب لهم كتاباً هو عندهم؛ وكتب ليحنة وأهل أيلة كتاب أمان نصّه عند ابن إسحاق."
  en: When the Prophet reached Tabuk, Yuhanna ibn Ru'ba, the master of Ayla, came to him, made peace and paid the jizya; the people of Jarba and Adhruh also came and paid it, and he wrote them a document they still hold. For Yuhanna and the people of Ayla he wrote a letter of safe-conduct whose text Ibn Ishaq preserves.
