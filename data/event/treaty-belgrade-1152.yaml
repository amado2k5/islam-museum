label: { ar: "معاهدة بلغراد", en: "Treaty of Belgrade", es: "Tratado de Belgrado", fr: "Traité de Belgrade", ur: "بلغراد کا معاہدہ", tr: "Belgrad Antlaşması", id: "Perjanjian Beograd" }
summary:
  ar: "في عهد السلطان محمود الأول أعلنت روسيا والنمسا الحرب على بولندا واحتلتها روسيا، ثم بدأت روسيا القتال مع الدولة العثمانية، فتمكن العثمانيون من وقف تقدم الروس في إقليم البغدان وأوقفوا تقدم النمسا في البوسنة والصرب والأفلاق وانتصروا على الصرب وعلى جيوش النمسا التي انسحبت من الحرب وطلبت الصلح عن طريق فرنسا، فوقعت معاهدة الصلح في بلغراد عام ١١٥٢هـ/١٧٣٩م وتنازلت فيها النمسا عن مدينة بلغراد وعن بلاد الصرب والأفلاق، وتعهدت روسيا بعدم بناء سفن في البحر الأسود وهدم قلاع ميناء آزوف {cite:dawlat-uthmaniyya-salabi p. 313}."
  en: "Belgrade, 1739 — the last great Ottoman diplomatic victory: after checking the Russians in Moldavia and beating the Austrians in Serbia, Austria ceded back Belgrade, Serbia and Wallachia, and Russia undertook to build no ships on the Black Sea and to raze Azov {cite:dawlat-uthmaniyya-salabi p. 313}."
  es: "Belgrado, 1739: la última gran victoria diplomática otomana: después de frenar a los rusos en Moldavia y derrotar a los austríacos en Serbia, Austria cedió Belgrado, Serbia y Valaquia, y Rusia se comprometió a no construir barcos en el Mar Negro y a arrasar Azov {cite:dawlat-uthmaniyya-salabi p. 313}."
  fr: "Belgrade, 1739 — la dernière grande victoire diplomatique ottomane: après avoir contenu les Russes en Moldavie et battu les Autrichiens en Serbie, l'Autriche a cédé Belgrade, la Serbie et la Valachie, et la Russie s'est engagée à ne construire aucun navire sur la mer Noire et à raser Azov {cite:dawlat-uthmaniyya-salabi p. 313}."
  ur: "بلغراد، 1739 - آخری عظیم عثمانی سفارتی فتح: مولداویہ میں روسیوں کو چیک کرنے اور سربیا میں آسٹریا کو شکست دینے کے بعد، آسٹریا نے بلغراد، سربیا اور والاچیا کو پیچھے چھوڑ دیا، اور روس نے بحیرہ اسود پر کوئی بحری جہاز نہ بنانے اور ازوف کو گرانے کا بیڑا اٹھایا۔ 313}۔"
  tr: "Sultan I. Mahmud döneminde Rusya ve Avusturya, Rusya'nın işgal ettiği Polonya'ya savaş ilan etti. Ardından Rusya, Osmanlı İmparatorluğu ile savaşa girdi. Osmanlılar, Moldavya bölgesindeki Rus ilerlemesini durdurmayı ve Bosna, Sırbistan ve Eflak'taki Avusturya ilerlemesini engellemeyi başardı. Sırplara ve Avusturya ordularına karşı zafer kazandılar; Avusturya orduları savaştan çekilerek Fransa aracılığıyla barış aradı. Barış antlaşması Hicri 1152/Miladi 1739 yılında Belgrad'da imzalandı; bu antlaşmada Avusturya, Belgrad şehrini ve Sırbistan ile Eflak topraklarını Rusya'ya devretti. Rusya, Karadeniz'de gemi inşa etmeyeceğine ve Azov limanındaki kaleleri yıkacağına söz verdi. {cite:dawlat-uthmaniyya-salabi s. 313}"
  id: "Pada masa pemerintahan Sultan Mahmud I, Rusia dan Austria menyatakan perang terhadap Polandia, yang diduduki Rusia. Kemudian Rusia mulai berperang dengan Kekaisaran Ottoman. Ottoman berhasil menghentikan kemajuan Rusia di wilayah Moldavia dan menghentikan kemajuan Austria di Bosnia, Serbia, dan Wallachia. Mereka menang atas Serbia dan pasukan Austria, yang kemudian menarik diri dari perang dan mencari perdamaian melalui Prancis. Perjanjian damai ditandatangani di Beograd pada tahun 1152 H/1739 M, di mana Austria menyerahkan kota Beograd dan wilayah Serbia dan Wallachia. Rusia berjanji untuk tidak membangun kapal di Laut Hitam dan menghancurkan benteng-benteng pelabuhan Azov. {cite:dawlat-uthmaniyya-salabi p. 313}."
