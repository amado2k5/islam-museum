label: { ar: "معاهدة بلغراد" }
summary:
  ar: "في عهد السلطان محمود الأول أعلنت روسيا والنمسا الحرب على بولندا واحتلتها روسيا، ثم بدأت روسيا القتال مع الدولة العثمانية، فتمكن العثمانيون من وقف تقدم الروس في إقليم البغدان وأوقفوا تقدم النمسا في البوسنة والصرب والأفلاق وانتصروا على الصرب وعلى جيوش النمسا التي انسحبت من الحرب وطلبت الصلح عن طريق فرنسا، فوقعت معاهدة الصلح في بلغراد عام ١١٥٢هـ/١٧٣٩م وتنازلت فيها النمسا عن مدينة بلغراد وعن بلاد الصرب والأفلاق، وتعهدت روسيا بعدم بناء سفن في البحر الأسود وهدم قلاع ميناء آزوف {cite:dawlat-uthmaniyya-salabi p. 313}."
  en: "Belgrade, 1739 — the last great Ottoman diplomatic victory: after checking the Russians in Moldavia and beating the Austrians in Serbia, Austria ceded back Belgrade, Serbia and Wallachia, and Russia undertook to build no ships on the Black Sea and to raze Azov {cite:dawlat-uthmaniyya-salabi p. 313}."
