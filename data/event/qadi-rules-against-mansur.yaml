id: event/qadi-rules-against-mansur
class: event
kind: court-ruling
label: { ar: "قضاء القاضي على المنصور", en: "The qadi's ruling against al-Mansur", es: "El fallo del cadí contra al-Mansur", fr: "Le jugement du cadi contre al-Mansur", ur: "المنصور کے خلاف قاضی کا حکم", tr: "Hakimin El-Mansur aleyhindeki kararı", id: "Putusan hakim terhadap Al-Mansur" }
summary:
  ar: "قدم المنصور المدينة ومحمد بن عمران الطلحي على قضائها فاستعدى الجمالون على المنصور في شيء فكتب إليه كتاباً بحضوره وإنصافهم فحضر هو والربيع فلم يقم له القاضي بل حل رداءه واحتبى به ثم دعا بالخصوم فادعوا فقضى لهم على الخليفة فلما فرغ قال له المنصور جزاك الله عن دينك أحسن الجزاء قد أمرت لك بعشرة آلاف دينار، ومن أمثال ذلك كتاب المنصور إلى سوار بن عبد الله قاضي البصرة يأمره بدفع أرض متخاصم عليها إلى القائد فأبى سوار حتى أقام البينة وقال المنصور ملأتها والله عدلاً صار قضاتي تردني إلى الحق {cite:tarikh-khulafa-minhaj-1434 p. 431-432}."
  en: "Al-Mansur came to Medina while Muhammad ibn Imran al-Talhi held its judgeship; the camel-drivers sued the caliph over something and the qadi summoned him to court. Al-Mansur attended with al-Rabi'; the judge did not rise for him but let down his robe and sat cross-legged, then called the claimants and ruled for them against the caliph. When it ended al-Mansur said, 'May God reward you well for your religion — I have granted you ten thousand dinars.' In the same vein he wrote to Sawwar ibn Abdallah, qadi of Basra, ordering him to hand a disputed plot to a commander; Sawwar refused absent proof, and al-Mansur exclaimed, 'By God I have filled it with justice — my judges now return me to the right' {cite:tarikh-khulafa-minhaj-1434 p. 431-432}."
  es: "Al-Mansur llegó a Medina mientras Muhammad ibn Imran al-Talhi ejercía como juez; los camelleros demandaron al califa por algún asunto y el cadí lo citó a juicio. Al-Mansur acudió con al-Rabi'; el juez no se levantó para recibirlo, sino que se bajó la túnica y se sentó con las piernas cruzadas, luego llamó a los demandantes y falló a su favor contra el califa. Cuando terminó, al-Mansur dijo: «Que Dios os recompense abundantemente por vuestra religión; os he concedido diez mil dinares». En el mismo sentido, escribió a Sawwar ibn Abdallah, cadí de Basora, ordenándole que entregara una contienda electoral a un comandante; Sawwar se negó sin pruebas, y al-Mansur exclamó: «¡Por Dios, lo he llenado de justicia! Mis jueces ahora me devuelven al camino correcto» {cite:tarikh-khulafa-minhaj-1434 p. 431-432}."
  fr: "Al-Mansur arriva à Médine alors que Muhammad ibn Imran al-Talhi y exerçait la magistrature. Les chameliers portèrent plainte contre le calife et le cadi le convoqua au tribunal. Al-Mansur s'y présenta accompagné d'al-Rabi'. Le juge ne se leva pas, mais laissa tomber sa robe et s'assit en tailleur. Il appela ensuite les plaignants et trancha en leur faveur contre le calife. À la fin de l'audience, al-Mansur déclara: « Que Dieu vous récompense pour votre foi ! Je vous accorde dix mille dinars. » Dans le même esprit, il écrivit à Sawwar ibn Abdallah, cadi de Bassora, lui ordonnant de confier un terrain litigieux à un commandant. Sawwar refusa faute de preuves, et al-Mansur s'exclama: « Par Dieu, j'ai rendu justice ! Mes juges me rétablissent dans la vérité ! » {cite:tarikh-khulafa-minhaj-1434 p. 431-432}."
  ur: "المنصور مدینہ آیا جبکہ محمد بن عمران الطلحی نے اس کی منصفی کی ذمہ داری سنبھالی۔ اونٹ چلانے والوں نے کسی بات پر خلیفہ پر مقدمہ دائر کیا اور قاضی نے اسے عدالت میں طلب کیا۔ المنصور الربیع کے ساتھ حاضر ہوا؛ جج اس کے لیے نہیں اٹھے بلکہ اپنا لباس اتار کر آڑے ہاتھوں بیٹھا، پھر دعویداروں کو بلایا اور ان کے لیے خلیفہ کے خلاف فیصلہ دیا۔ جب یہ ختم ہوا تو المنصور نے کہا، 'خدا آپ کو آپ کے دین کا اچھا بدلہ دے - میں نے آپ کو دس ہزار دینار عطا کیے ہیں۔' اسی سلسلے میں اس نے بصرہ کے قادی سوار بن عبداللہ کو خط لکھا اور اسے حکم دیا کہ ایک متنازعہ پلاٹ ایک کمانڈر کے حوالے کر دے۔ سوار نے غیر حاضر ثبوت سے انکار کر دیا، اور المنصور نے کہا، 'خدا کی قسم میں نے اسے عدل سے بھر دیا ہے - اب میرے جج مجھے حق کی طرف لوٹائیں'۔ 431-432}۔"
  tr: "El-Mansur şehre geldiğinde, Muhammed ibn İmran el-Talihi şehrin yargı işlerinin başındaydı. Deve sürücüleri El-Mansur'a bir şeyden şikayet ettiler, bunun üzerine El-Mansur ona gelip onlara adalet sağlamasını emreden bir mektup yazdı. Böylece El-Mansur ve el-Rabi geldiler, ancak yargıç onun için ayağa kalkmadı, aksine cübbesini çıkarıp dizlerinin üzerine oturdu. Sonra davacıları çağırdı ve iddialarını dile getirdiler, o da halifeye karşı onların lehine hüküm verdi. İşini bitirdiğinde El-Mansur ona, \"Allah seni dinin için en güzel şekilde ödüllendirsin. Sana on bin dinar verilmesini emrettim.\" dedi. Benzerlikler arasında, El-Mansur'un Basra yargıcı Suwar ibn Abdullah'a, tartışmalı bir arazi parçasını komutana teslim etmesini emreden mektubu da yer almaktadır. Suwar, delil sunana kadar reddetti ve El-Mansur, \"Allah'a yemin ederim ki, onu adaletle doldurdum. Yargıçlarım beni hakikate döndürenler oldular.\" dedi. {cite:tarikh-khulafa-minhaj-1434 s. 431-432}."
  id: "Al-Mansur datang ke kota dan Muhammad ibn Imran al-Talhi bertanggung jawab atas peradilannya. Para pengemudi unta mengeluh kepada Al-Mansur tentang sesuatu, jadi dia menulis surat kepadanya dan memerintahkannya untuk datang dan memberikan keadilan kepada mereka. Maka dia dan al-Rabi’ datang, tetapi hakim itu tidak berdiri untuknya, melainkan melepas jubahnya dan duduk dengan jubah itu di pangkuannya. Kemudian dia memanggil para pihak yang bersengketa, dan mereka menyampaikan klaim mereka, lalu dia memutuskan untuk memihak mereka melawan Khalifah. Setelah selesai, Al-Mansur berkata kepadanya, “Semoga Allah membalasmu atas agamamu dengan pahala terbaik. Aku telah memerintahkan agar kamu diberi sepuluh ribu dinar.” Di antara kesamaannya adalah surat Al-Mansur kepada Suwar ibn Abdullah, hakim Basra, yang memerintahkannya untuk menyerahkan sebidang tanah yang disengketakan kepada komandan. Suwar menolak sampai dia memberikan bukti, dan Al-Mansur berkata, “Demi Allah, aku telah memenuhinya dengan keadilan. Hakim-hakimku telah menjadi orang-orang yang membawaku kembali kepada kebenaran.” {kutip:tarikh-khulafa-minhaj-1434 hal. 431-432}."
