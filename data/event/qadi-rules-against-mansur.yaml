id: event/qadi-rules-against-mansur
class: event
kind: court-ruling
label: { ar: "قضاء القاضي على المنصور" }
summary:
  ar: "قدم المنصور المدينة ومحمد بن عمران الطلحي على قضائها فاستعدى الجمالون على المنصور في شيء فكتب إليه كتاباً بحضوره وإنصافهم فحضر هو والربيع فلم يقم له القاضي بل حل رداءه واحتبى به ثم دعا بالخصوم فادعوا فقضى لهم على الخليفة فلما فرغ قال له المنصور جزاك الله عن دينك أحسن الجزاء قد أمرت لك بعشرة آلاف دينار، ومن أمثال ذلك كتاب المنصور إلى سوار بن عبد الله قاضي البصرة يأمره بدفع أرض متخاصم عليها إلى القائد فأبى سوار حتى أقام البينة وقال المنصور ملأتها والله عدلاً صار قضاتي تردني إلى الحق {cite:tarikh-khulafa-minhaj-1434 p. 431-432}."
  en: "Al-Mansur came to Medina while Muhammad ibn Imran al-Talhi held its judgeship; the camel-drivers sued the caliph over something and the qadi summoned him to court. Al-Mansur attended with al-Rabi'; the judge did not rise for him but let down his robe and sat cross-legged, then called the claimants and ruled for them against the caliph. When it ended al-Mansur said, 'May God reward you well for your religion — I have granted you ten thousand dinars.' In the same vein he wrote to Sawwar ibn Abdallah, qadi of Basra, ordering him to hand a disputed plot to a commander; Sawwar refused absent proof, and al-Mansur exclaimed, 'By God I have filled it with justice — my judges now return me to the right' {cite:tarikh-khulafa-minhaj-1434 p. 431-432}."
