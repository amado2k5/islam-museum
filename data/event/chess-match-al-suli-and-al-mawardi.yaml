label: { ar: "مباراة الصولي والماوردي اللاعب بحضرة المكتفي", en: "Chess match of al-Suli and al-Mawardi before al-Muktafi", ur: "مکتفی کے حضور الصولی اور الماوردی کی شطرنج", fr: "La partie d'échecs d'al-Suli et d'al-Mawardi devant al-Muktafi", es: "Partido de ajedrez de al-Suli y al-Mawardi ante al-Muktafi", tr: "Al-Suli ile Al-Mawardi arasındaki maç, Al-Muktafi'nin de hazır bulunduğu bir ortamda gerçekleşti.", id: "Pertandingan antara Al-Suli dan Al-Mawardi, pemain tersebut hadir bersama Al-Muktafi." }
summary:
  ar: "في بدء دخول الصولي في خدمة المكتفي لعب مع الماوردي اللاعب، وكان الماوردي مقدماً عند المكتفي معجباً بلعبه؛ فلما اتصل اللعب بينهما غلب الصولي خصمه غلبة واضحة، فتبين للمكتفي حسن لعبه، فعدل عن هواه، وقال للماوردي إن ماء وردك صار بولاً {cite:muruj-al-dhahab p. 677}."
  en: "At the start of al-Suli's service under al-Muktafi he played al-Mawardi, the chess player the caliph favoured, in the caliph's presence. Al-Suli beat him decisively; the caliph's favour shifted, and he remarked to al-Mawardi that his rosewater had turned to urine {cite:muruj-al-dhahab p. 677}."
  ur: "الصولی نے مکتفی کی خدمت میں آغاز کے وقت، خلیفہ کے منظورِ نظر شطرنج باز الماوردی کے ساتھ خلیفہ کے سامنے کھیلا۔ الصولی نے واضح طور پر اسے ہرا دیا، اور خلیفہ کی پسندیدگی بدل گئی، اور اس نے الماوردی سے کہا کہ اس کا گلاب کا پانی پیشاب بن گیا ہے {cite:muruj-al-dhahab p. 677}."
  fr: "Au début du service d'al-Suli auprès d'al-Muktafi, il joua contre al-Mawardi, le joueur d'échecs que le calife favorisait, en présence du calife. Al-Suli le battit nettement ; la faveur du calife se déplaça, et il fit remarquer à al-Mawardi que son eau de rose s'était changée en urine {cite:muruj-al-dhahab p. 677}."
  es: "Al comienzo de su servicio bajo al-Muktafi, al-Suli jugó una partida contra al-Mawardi, el ajedrecista favorito del califa, en presencia de este. Al-Suli lo derrotó contundentemente; el favor del califa cambió y le comentó a al-Mawardi que su agua de rosas se había convertido en orina {cite:muruj-al-dhahab p. 677}."
  tr: "El-Suli'nin El-Muktafi'nin hizmetine girmesinin başında, oyuncu El-Mawardi ile oynadı ve El-Muktafi, oyununa hayran kaldığı El-Mawardi'yi tercih etti. Aralarındaki oyun devam ederken, El-Suli rakibini açık ara yendi. Bunun üzerine El-Muktafi, El-Suli'nin oyununun iyiliğini fark etti ve fikrini değiştirerek El-Mawardi'ye, \"Senin gül suyun idrara dönüştü.\" dedi. {kaynak: Muruj-al-dhahab s. 677}"
  id: "Pada awal masa pengabdian Al-Suli kepada Al-Muktafi, ia bermain catur dengan Al-Mawardi, dan Al-Mawardi disukai oleh Al-Muktafi, yang mengagumi permainannya. Ketika permainan antara mereka berlanjut, Al-Suli jelas mengalahkan lawannya, sehingga Al-Muktafi menyadari kehebatan permainannya, lalu ia mengubah pikirannya dan berkata kepada Al-Mawardi, \"Air mawarmu telah berubah menjadi air kencing.\" {cite:muruj-al-dhahab p. 677}"
