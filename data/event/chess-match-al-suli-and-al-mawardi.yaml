summary:
  ar: "في بدء دخول الصولي في خدمة المكتفي لعب مع الماوردي اللاعب، وكان الماوردي مقدماً عند المكتفي معجباً بلعبه؛ فلما اتصل اللعب بينهما غلب الصولي خصمه غلبة واضحة، فتبين للمكتفي حسن لعبه، فعدل عن هواه، وقال للماوردي إن ماء وردك صار بولاً {cite:muruj-al-dhahab p. 677}."
  en: "At the start of al-Suli's service under al-Muktafi he played al-Mawardi, the chess player the caliph favoured, in the caliph's presence. Al-Suli beat him decisively; the caliph's favour shifted, and he remarked to al-Mawardi that his rosewater had turned to urine {cite:muruj-al-dhahab p. 677}."
  ur: "الصولی نے مکتفی کی خدمت میں آغاز کے وقت، خلیفہ کے منظورِ نظر شطرنج باز الماوردی کے ساتھ خلیفہ کے سامنے کھیلا۔ الصولی نے واضح طور پر اسے ہرا دیا، اور خلیفہ کی پسندیدگی بدل گئی، اور اس نے الماوردی سے کہا کہ اس کا گلاب کا پانی پیشاب بن گیا ہے {cite:muruj-al-dhahab p. 677}."
