summary:
  ar: "بعث مرداويج بن زيار قائده ابن علان القزويني الملقب خواجة إلى مدينة الدينور فدخلها بالسيف وقتل من أهلها في اليوم الأول سبعة عشر ألفاً في قول المقلل وخمسة وعشرين ألفاً في قول المكثر، وخرج إليه في مستوري أهلها وصوفيتها رجل يقال له ابن مشاد وبيده مصحف فقال أيها الشيخ اتق الله وارفع السيف عن هؤلاء المسلمين فأمر بأخذ المصحف من يده فضرب به وجهه ثم أمر به فذبح وسبى وأباح الأموال والدماء والفروج {cite:muruj-al-dhahab p. 726}."
  en: "Ibn Allan's sack of Dinawar — Ibn Mishad the ascetic struck in the face with his own mushaf and butchered {cite:muruj-al-dhahab p. 726}."
