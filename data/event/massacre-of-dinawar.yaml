label: { ar: "مجزرة الدينور", en: "Massacre of Dinawar", es: "Masacre de Dinawar", fr: "Massacre de Dinawar", ur: "دیناور کا قتل عام", tr: "Dinoor Katliamı", id: "Pembantaian Dinoor" }
summary:
  ar: "بعث مرداويج بن زيار قائده ابن علان القزويني الملقب خواجة إلى مدينة الدينور فدخلها بالسيف وقتل من أهلها في اليوم الأول سبعة عشر ألفاً في قول المقلل وخمسة وعشرين ألفاً في قول المكثر، وخرج إليه في مستوري أهلها وصوفيتها رجل يقال له ابن مشاد وبيده مصحف فقال أيها الشيخ اتق الله وارفع السيف عن هؤلاء المسلمين فأمر بأخذ المصحف من يده فضرب به وجهه ثم أمر به فذبح وسبى وأباح الأموال والدماء والفروج {cite:muruj-al-dhahab p. 726}."
  en: "Ibn Allan's sack of Dinawar — Ibn Mishad the ascetic struck in the face with his own mushaf and butchered {cite:muruj-al-dhahab p. 726}."
  es: "El saqueo de Dinawar por Ibn Allan: Ibn Mishad, el asceta, golpeó en la cara con su propio mushaf y masacró {cite:muruj-al-dhahab p. 726}."
  fr: "Le sac de Dinawar par Ibn Allan — Ibn Mishad l'ascète frappé au visage avec son propre mushaf et massacré {cite:muruj-al-dhahab p. 726}."
  ur: "ابن علان کا دیناور کی بوری - ابن مشہد نے اپنے ہی مصحف سے منہ پر مارا اور ذبح کر دیا۔ 726}۔"
  tr: "Mardawij bin Ziyar, komutanı İbn Allan al-Qazwini'yi (lakabı Khawaja) Dinaver şehrine gönderdi. İbn Allan al-Qazwini kılıcıyla şehre girdi ve ilk gün, sayıyı hafife alanlara göre on yedi bin, abartanlara göre ise yirmi beş bin kişiyi öldürdü. Şehrin gizli halkından ve Sufilerinden İbn Meşad adında bir adam elinde Kur'an ile yanına geldi ve \"Ey Şeyh, Allah'tan kork ve bu Müslümanların elinden kılıcı çek\" dedi. Bunun üzerine İbn Meşad Kur'an'ı elinden aldırıp yüzüne vurdu. Sonra onu öldürtüp esir aldırdı ve para, kan ve kadınların alınmasına izin verdi. {cite:muruj-al-dhahab s. 726}"
  id: "Mardawij bin Ziyar mengutus komandannya, Ibn Allan al-Qazwini, yang dijuluki Khawaja, ke kota Dinawar. Ia memasuki kota itu dengan pedang dan membunuh tujuh belas ribu penduduknya pada hari pertama, menurut orang yang meremehkan jumlahnya, dan dua puluh lima ribu menurut orang yang melebih-lebihkan jumlahnya. Seorang pria bernama Ibn Mashad, salah seorang penduduk tersembunyi dan Sufi di kota itu, keluar menemuinya dengan Al-Qur'an di tangannya dan berkata, \"Wahai Syekh, takutlah kepada Allah dan angkatlah pedang dari orang-orang Muslim ini.\" Maka ia memerintahkan agar Al-Qur'an itu diambil dari tangannya dan memukul wajahnya dengan Al-Qur'an tersebut. Kemudian ia memerintahkan agar Ibn Mashad disembelih dan ditawan, dan ia mengizinkan pengambilan uang, darah, dan wanita. {cite:muruj-al-dhahab p. 726}"
