label: { ar: "ثورة طرابلس على النصارى وإحراقهم", en: "The Tripoli Uprising against the Christians and Their Burning" }
summary:
  ar: "لما استولى رجار صاحب صقلية على طرابلس بإفريقية وأبقى المسلمين بها تحت مملكته واستعمل عليهم من شاء، مشى أبو يحيى بن مطروح من أعيان البلد في وجوه الناس وأعيانهم وداخلهم في الفتك بالنصارى فاجتمعوا لذلك وثاروا بهم وأحرقوهم بالنار، واستقر ابن مطروح والياً على طرابلس إلى أن وليها عبد المؤمن سنة 555هـ فأوفده إليها ورد أهلها إليها {cite:tarikh-ibn-khaldun-ibar p. 1638}."
  en: "When Roger of Sicily took Tripoli of Ifriqiya and kept its Muslims under his rule, Abu Yahya ibn Matruh, one of the town's notables, went among its leading men and drew them into striking the Normans — they rose, killed them and burned them, and Ibn Matruh governed Tripoli until Abd al-Mu'min's coming in 555 restored it {cite:tarikh-ibn-khaldun-ibar p. 1638}."
