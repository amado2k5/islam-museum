class: event
kind: revolt
label: { ar: "ثورة طرابلس على النصارى وإحراقهم", en: "The Tripoli Uprising against the Christians and Their Burning", es: "El levantamiento de Trípoli contra los cristianos y su quema", fr: "Le soulèvement de Tripoli contre les chrétiens et leur bûcher", ur: "طرابلس میں عیسائیوں کے خلاف بغاوت اور انہیں جلانا", tr: "Trablus'un Hristiyanlara karşı ayaklanması ve onların yakılması", id: "Pemberontakan Tripoli terhadap umat Kristen dan pembakaran rumah-rumah mereka." }
summary:
  ar: "لما استولى رجار صاحب صقلية على طرابلس بإفريقية وأبقى المسلمين بها تحت مملكته واستعمل عليهم من شاء، مشى أبو يحيى بن مطروح من أعيان البلد في وجوه الناس وأعيانهم وداخلهم في الفتك بالنصارى فاجتمعوا لذلك وثاروا بهم وأحرقوهم بالنار، واستقر ابن مطروح والياً على طرابلس إلى أن وليها عبد المؤمن سنة 555هـ فأوفده إليها ورد أهلها إليها {cite:tarikh-ibn-khaldun-ibar p. 1638}."
  en: "When Roger of Sicily took Tripoli of Ifriqiya and kept its Muslims under his rule, Abu Yahya ibn Matruh, one of the town's notables, went among its leading men and drew them into striking the Normans — they rose, killed them and burned them, and Ibn Matruh governed Tripoli until Abd al-Mu'min's coming in 555 restored it {cite:tarikh-ibn-khaldun-ibar p. 1638}."
  es: "Cuando Roger de Sicilia tomó Trípoli de Ifriqiya y mantuvo a sus musulmanes bajo su dominio, Abu Yahya ibn Matruh, uno de los notables de la ciudad, se reunió entre sus principales hombres y los incitó a atacar a los normandos; estos se sublevaron, los mataron y los quemaron, e Ibn Matruh gobernó Trípoli hasta que la llegada de Abd al-Mu'min en 555 la restauró {cite:tarikh-ibn-khaldun-ibar p. 1638}."
  fr: "Lorsque Roger de Sicile prit Tripoli d'Ifriqiya et garda ses musulmans sous son autorité, Abu Yahya ibn Matruh, l'un des notables de la ville, se rendit parmi ses hommes les plus importants et les incita à frapper les Normands — ils se soulevèrent, les tuèrent et les brûlèrent, et Ibn Matruh gouverna Tripoli jusqu'à ce que l'arrivée d'Abd al-Mu'min en 555 la restaure {cite:tarikh-ibn-khaldun-ibar p. 1638}."
  ur: "جب سسلی کے راجر نے افریقیہ کے طرابلس پر قبضہ کیا اور اس کے مسلمانوں کو اپنی حکمرانی میں رکھا تو ابو یحییٰ بن مطروح، جو اس قصبے کے معززین میں سے ایک تھا، اس کے سرکردہ آدمیوں کے درمیان گیا اور انہیں نارمنوں پر حملہ کرنے پر کھینچ لایا، وہ اٹھے، ان کو مار ڈالا اور جلا دیا، اور ابن مطروح نے طرابلس پر اس وقت تک حکومت کی جب تک کہ عبد المومن 555ء میں باقی نہ رہے۔ {حوالہ: تاریخ ابن خلدون ابر ص۔ 1638}۔"
  tr: "Sicilya hükümdarı Roger, Afrika'daki Trablus'u ele geçirip oradaki Müslümanları kendi krallığı altında tuttuğunda ve dilediği kişileri başlarına atadığında, şehrin ileri gelenlerinden Ebu Yahya İbn Matruh, halka ve ileri gelenlere giderek onları Hristiyanları öldürmeye ikna etti. Bunun üzerine halk toplandı, onlara karşı ayaklandı ve onları ateşe verdi. İbn Matruh, Hicri 555 yılında Abdülmümin şehri ele geçirene kadar Trablus valisi olarak kaldı. Abdülmümin onu Trablus'a gönderdi ve halkı geri getirdi. {Kaynak: Tarikat İbn Haldun İbar, s. 1638}"
  id: "Ketika Roger, penguasa Sisilia, merebut Tripoli di Afrika dan menjadikan kaum Muslim di sana sebagai bagian dari kerajaannya serta menunjuk siapa pun yang dia kehendaki untuk memerintah mereka, Abu Yahya Ibn Matrouh, salah satu tokoh terkemuka di kota itu, pergi kepada rakyat dan para tokoh terkemuka mereka dan membujuk mereka untuk membunuh orang-orang Kristen. Maka mereka berkumpul untuk itu dan bangkit melawan mereka dan membakar mereka dengan api. Ibn Matrouh tetap menjadi gubernur Tripoli hingga Abd al-Mu’min mengambil alihnya pada tahun 555 H, sehingga ia mengirimnya ke sana dan mengembalikan penduduknya ke sana {cite:tarikh-ibn-khaldun-ibar p. 1638}."
