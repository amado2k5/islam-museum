label: { ar: "كسر جلال الدين الخوارزمي سنة 627هـ" }
summary:
  ar: "في سنة سبع وعشرين وست مئة خاف أهل الشام وغيرها من الخوارزمية وعرفوا أنهم إن ملكوا ما أبقوا لأحد شيئاً فطلبوا الحرب واتفقوا على حرب جلال الدين وساروا فالتقوه في رمضان فكسروه واستباحوا عسكره وهرب جلال الدين بأسوأ حال ووصل إلى خلاط في سبعة أنفس وقد تمزق جيشه وقتلت أبطاله فأخذ حريمه وما خف حمله وهرب إلى أذربيجان ثم أرسل إلى الملك الأشرف في الصلح وذل وأمنت خلاط وشرعوا في إصلاحها قال الموفق عبد اللطيف هزم الله الخوارزمية بأيسر مؤونة بأمر ما كان في الحساب فسبحان من هدم ذاك الجبل الراسي في لمحة ناظر {cite:shadharat-dhahab p. 127}."
  en: "In 627 the Syrians and their allies combined against the Khwarazmians; meeting Jalal al-Din in Ramadan they broke him, plundered his army, and he fled to Khilat among seven men — his army shredded, his champions slain — thence to Azerbaijan, suing al-Ashraf for peace in abasement. Abd al-Latif al-Baghdadi: 'God routed the Khwarazmians at the lightest cost, by an event beyond all reckoning — praise to Him who demolished that firm mountain in the blink of an eye' {cite:shadharat-dhahab p. 127}."
