id: event/jalaluddin-defeat-627
class: event
kind: battle
label: { ar: "كسر جلال الدين الخوارزمي سنة 627هـ", en: "Defeat of Jalal al-Din al-Khwarazmi, 627 AH", es: "Derrota de Jalal al-Din al-Khwarazmi, 627 AH", fr: "Défaite de Jalal al-Din al-Khwarazmi, 627 AH", ur: "جلال الدین الخوارزمی کی شکست، 627ھ", tr: "Celaleddin el-Harizmi H. 627 yılında hilafeti kaldırdı.", id: "Jalal al-Din al-Khwarizmi memecahkan kekhalifahan pada tahun 627 H." }
summary:
  ar: "في سنة سبع وعشرين وست مئة خاف أهل الشام وغيرها من الخوارزمية وعرفوا أنهم إن ملكوا ما أبقوا لأحد شيئاً فطلبوا الحرب واتفقوا على حرب جلال الدين وساروا فالتقوه في رمضان فكسروه واستباحوا عسكره وهرب جلال الدين بأسوأ حال ووصل إلى خلاط في سبعة أنفس وقد تمزق جيشه وقتلت أبطاله فأخذ حريمه وما خف حمله وهرب إلى أذربيجان ثم أرسل إلى الملك الأشرف في الصلح وذل وأمنت خلاط وشرعوا في إصلاحها قال الموفق عبد اللطيف هزم الله الخوارزمية بأيسر مؤونة بأمر ما كان في الحساب فسبحان من هدم ذاك الجبل الراسي في لمحة ناظر {cite:shadharat-dhahab p. 127}."
  en: "In 627 the Syrians and their allies combined against the Khwarazmians; meeting Jalal al-Din in Ramadan they broke him, plundered his army, and he fled to Khilat among seven men — his army shredded, his champions slain — thence to Azerbaijan, suing al-Ashraf for peace in abasement. Abd al-Latif al-Baghdadi: 'God routed the Khwarazmians at the lightest cost, by an event beyond all reckoning — praise to Him who demolished that firm mountain in the blink of an eye' {cite:shadharat-dhahab p. 127}."
  es: "En 627, los sirios y sus aliados se unieron contra los jorezmitas; al encontrarse con Jalal al-Din en Ramadán, lo derrotaron, saquearon su ejército y él huyó a Khilat con siete hombres —su ejército diezmado, sus campeones muertos— y de allí a Azerbaiyán, pidiendo la paz a al-Ashraf en señal de humillación. Abd al-Latif al-Baghdadi: «Dios derrotó a los jorezmitas al menor costo, mediante un acontecimiento incalculable; alabado sea Aquel que derribó esa firme montaña en un abrir y cerrar de ojos» {cita: shadharat-dhahab p. 127}."
  fr: "En 627, les Syriens et leurs alliés s'unirent contre les Khwarezmiens. Rencontrant Jalal al-Din durant le Ramadan, ils le vainquirent, pillèrent son armée, et il s'enfuit à Calilat avec sept hommes seulement – son armée anéantie, ses champions massacrés – de là, en Azerbaïdjan, implorant la paix auprès d'al-Ashraf, humilié. Abd al-Latif al-Baghdadi: « Dieu a mis en déroute les Khwarezmiens à un prix dérisoire, par un événement inimaginable – louange à Celui qui a terrassé cette montagne inébranlable en un clin d'œil. » {cite: shadharat-dhahab p. 127}."
  ur: "627 میں شامی اور ان کے اتحادی خوارزمیوں کے خلاف متحد ہو گئے۔ رمضان المبارک میں جلال الدین سے ملاقات کی، انہوں نے اسے توڑ دیا، اس کی فوج کو لوٹ لیا، اور وہ سات آدمیوں کے درمیان خلت کی طرف بھاگا - اس کی فوج کے ٹکڑے ٹکڑے ہوئے، اس کے چیمپیئن مارے گئے - وہاں سے آذربائیجان چلے گئے، انہوں نے الاشرف پر ذلت میں امن کا مقدمہ دائر کیا۔ عبداللطیف البغدادی: 'خدا نے خوارزمیوں کو ہلکی قیمت پر ایک ایسے واقعہ سے شکست دی، جو ہر حساب سے باہر ہے - اس کی تعریف جس نے اس مضبوط پہاڑ کو پلک جھپکتے ہی گرا دیا'۔ 127}۔"
  tr: "Hicri 627 yılında Suriye ve diğer bölgelerin halkı Harezmîlerden korkuyordu ve onların iktidara gelmeleri halinde kimseye hiçbir şey bırakmayacaklarını biliyorlardı. Bu yüzden savaş aradılar ve Celaleddin ile savaşmayı kabul ettiler. Ramazan ayında onunla karşılaştılar, onu yendiler ve ordusunu yağmaladılar. Celaleddin en kötü şartlarda kaçtı ve yedi adamıyla Hilafet'e ulaştı. Ordusu dağılmış ve kahramanları öldürülmüştü. Kadınlarını ve taşıyabildiği her şeyi alıp Azerbaycan'a kaçtı. Sonra Kral Eşref'e barış teklifinde bulundu ve aşağılandı. Hilafet güvence altına alındı ve onarımına başlandı. El-Muveffak Abdül Latif şöyle dedi: Allah Harezmîleri en az çabayla, hesapta olmayan bir şekilde yendi. O sağlam dağı bir anda yerle bir eden Allah'a hamd olsun. {Kaynak: Şadharat-Dhaba s. 127}"
  id: "Pada tahun 627 H, penduduk Suriah dan wilayah lain takut kepada kaum Khwarazmians dan tahu bahwa jika mereka berkuasa, mereka tidak akan meninggalkan apa pun bagi siapa pun. Maka mereka mencari perang dan setuju untuk melawan Jalal al-Din. Mereka berbaris dan bertemu dengannya di bulan Ramadan, mengalahkannya, dan menjarah pasukannya. Jalal al-Din melarikan diri dalam keadaan yang sangat buruk dan mencapai Khilat dengan tujuh orang. Pasukannya hancur dan para pahlawannya terbunuh. Ia membawa para wanitanya dan apa pun yang bisa dibawanya lalu melarikan diri ke Azerbaijan. Kemudian ia mengirim utusan kepada Raja al-Ashraf untuk meminta perdamaian dan dipermalukan. Khilat diamankan dan mereka mulai memperbaikinya. Al-Muwaffaq Abd al-Latif berkata: Allah mengalahkan kaum Khwarazmians dengan usaha yang paling sedikit, dengan cara yang tidak ada dalam perhitungan. Maha Suci Dia yang meruntuhkan gunung yang kokoh itu dalam sekejap mata. {kutip:shadharat-dhahab hlm. 127}."
