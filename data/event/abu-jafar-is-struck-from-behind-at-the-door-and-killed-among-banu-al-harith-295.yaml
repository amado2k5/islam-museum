id: "event/abu-jafar-is-struck-from-behind-at-the-door-and-killed-among-banu-al-harith-295"
class: event
kind: other
label:
  ar: "الحارث بن الحارث يضرب أبا جعفر من خلفه عند الباب ويُقتل، 295هـ، ص377"
  en: "Al-Harith ibn al-Harith strikes Abu Ja'far from behind at the door and he is killed, 295 AH, p. 377"
  fr: "Al-Harith ibn al-Harith frappe Abu Ja'far par-derrière à la porte et celui-ci est tué, 295 de l’hégire, p. 377"
  ur: "حارث بن حارث دروازے پر ابو جعفر کو پیچھے سے وار کر کے گرا دیتا ہے اور وہ قتل ہو جاتا ہے، 295ھ، ص377"
  es: "Al-Harith ibn al-Harith ataca a Abu Ja'far por la espalda en la puerta y lo mata, 295 AH, pág. 377"
summary:
  ar: "ضربه الحارث بن الحارث من ورائه بعد أن اختبأ خلف الباب، فسقط أبو جعفر بين بني الحارث، فضربوه بالسيوف حتى قُتل، ونزعوا سلاحه وثيابه وتوزعوا ما عليه."
  en: "Al-Harith ibn al-Harith hid behind the door and struck Abu Ja'far from behind; he fell among Banu al-Harith, who struck him with swords until he died, and then stripped his arms, mount and goods."
  fr: "Al-Harith ibn al-Harith se cacha derrière la porte et frappa Abu Ja'far par-derrière ; il tomba parmi les Banu al-Harith, qui le frappèrent d’épée jusqu’à sa mort, puis le dépouillèrent de ses armes, de sa monture et de ses biens."
  ur: "حارث بن حارث دروازے کے پیچھے چھپا تھا، اس نے پیچھے سے ابو جعفر کی گردن پر وار کیا، وہ بنو حارث کے درمیان گر پڑا، انہوں نے تلواروں سے اسے قتل کیا اور اس کا ہتھیار اور سامان اتار لیا۔"
  es: "Al-Harith ibn al-Harith se escondió tras la puerta y atacó a Abu Ja'far por la espalda; cayó entre los Banu al-Harith, quienes lo golpearon con espadas hasta matarlo, y luego le robaron sus armas, su montura y sus bienes."
