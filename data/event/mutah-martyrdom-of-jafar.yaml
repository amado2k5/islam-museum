label: { ar: "استشهاد جعفر بن أبي طالب وعقره فرسه", en: "Martyrdom of Ja'far ibn Abi Talib and his hamstringing of his horse", es: "El martirio de Ja'far ibn Abi Talib y la lesión de su caballo.", fr: "Le martyre de Ja'far ibn Abi Talib et la blessure par les ischio-jambiers de son cheval", ur: "جعفر ابن ابی طالب کی شہادت اور ان کے گھوڑے کو کاٹنا" }
summary:
  ar: "بعد مقتل زيد أخذ جعفر بن أبي طالب الراية، واقتحم عن فرسه الشقراء فعقرها — وكان أول من عقر في الإسلام — ثم قاتل حتى قُتل. وأضاف ابن هشام ⁦(من أثق به)⁩ أنه أمسك اللواء بيمينه فقطعت ثم بشماله فقطعت فاحتضنه بعضديه حتى قُتل وهو ابن ثلاث وثلاثين سنة. وروى ابن هشام ⁦(ويقال)⁩ أن روميًا ضربه فقطعه بنصفين."
  en: "After Zayd's death Ja'far took the standard, dismounted and hamstrung his chestnut horse — the first such act in Islam — then fought until killed. Ibn Hisham adds (from a trusted source) that he gripped the banner with his right hand (cut off), then his left (cut off), then clasped it between his arms, dying at thirty-three. Ibn Hisham also records ⁦(ويقال)⁩ that a Roman cut him in two."
  es: "Tras la muerte de Zayd, Ja'far tomó el estandarte, desmontó y le cortó los tendones a su caballo castaño —el primer acto de este tipo en el Islam— y luchó hasta morir. Ibn Hisham añade (de una fuente fidedigna) que sujetó el estandarte con la mano derecha (que le fue amputada), luego con la izquierda (también amputada), y finalmente lo apretó entre sus brazos, muriendo a los treinta y tres años. Ibn Hisham también relata ⁦(ويقال)⁩ que un romano lo partió en dos."
  fr: "Après la mort de Zayd, Ja'far s'empara de l'étendard, descendit de cheval et blessa les jarrets de son alezan – un acte inédit en Islam – puis combattit jusqu'à la mort. Ibn Hisham ajoute (d'après une source fiable) qu'il saisit l'étendard de sa main droite (qui fut tranchée), puis de sa main gauche (qui fut également tranchée), avant de le serrer entre ses bras, mourant à trente-trois ans. Ibn Hisham rapporte également qu'un Romain le coupa en deux."
  ur: "زید کی موت کے بعد جعفر نے معیار کو سنبھالا، اپنے شاہ بلوط گھوڑے کو نیچے اتارا اور کٹوا دیا - اسلام میں ایسا پہلا عمل - پھر مارے جانے تک لڑا۔ ابن ہشام ⁦(ایک معتبر ذریعہ سے)⁩ مزید کہتے ہیں کہ اس نے جھنڈے کو اپنے دائیں ہاتھ سے پکڑا ⁦(کاٹا)⁩، پھر اپنے بائیں ⁦(کاٹا)⁩، پھر اسے اپنے بازوؤں کے درمیان لپیٹ لیا، تینتیس سال کی عمر میں فوت ہوئے۔ ابن ہشام نے یہ بھی لکھا ہے کہ ایک رومی نے اسے دو ٹکڑے کر دیا۔"
