id: event/al-hadi-fights-at-alab-and-al-jud-under-bayt-bus-288
class: event
kind: other
label:
  ar: "الهادي يقاتل بعلب وبالجود تحت بيت بوس، شعبان 288هـ"
  en: "Al-Hadi fights at Alab and at al-Jud below Bayt Bus, Sha'ban 288 AH"
  ur: "ہادی علب اور بیت بوس کے نیچے الجود میں لڑتے ہیں، شعبان 288ھ"
summary:
  ar: "خرج الهادي صباح السبت لست ماضية من شعبان حتى بلغ علب فلقي القوم بها ووقع القتال بغير تعبئة، فأعطاه الله الظفر بحسب الراوي، وتبعهم إلى بيت بوس وإلى موضع يقال له الجود تحتها، ثم عبأ عسكره راجعاً إلى صنعاء وعطف على من تبعه في الطريق."
  en: "Al-Hadi went out on Saturday, six days of Sha'ban gone, to Alab, met the men there and fought without having drawn up his army; the narrator says God gave him the victory, and he pursued them to Bayt Bus and to a place called al-Jud beneath it, then drew up his army for the return to Sana'a and turned on those who followed him on the road."
  ur: "ہادی ہفتے کے دن، شعبان کے چھ دن گزرنے پر، علب کی طرف نکلے، وہاں لوگوں سے ملے اور صف بندی کیے بغیر لڑائی ہوئی؛ راوی کے مطابق اللہ نے انہیں فتح دی، اور وہ ان کا پیچھا کر کے بیت بوس اور اس کے نیچے الجود نامی جگہ تک گئے، پھر لشکر کی صف بندی کر کے صنعاء کی طرف لوٹے اور راستے میں پیچھا کرنے والوں پر پلٹے۔"
