label:
  ar: "المتنبي في رعاية كافور بالفسطاط، نحو ٣٤٧هـ/٩٥٨م"
  en: "Under Kafur's patronage at Fustat, c. 347/958"
  ur: "فسطاط میں کافور کی سرپرستی میں، تقریباً 347ھ/958ء"
  es: "Bajo el patrocinio de Kafur en Fustat, c. 347/958"
  fr: "Sous le patronage de Kafur à Fustat, vers 347/958"
  tr: "Al-Mutanabbi, Fustat'ta Kafur'un himayesi altında, MS 347 / MS 958 civarında"
  id: "Al-Mutanabbi di bawah naungan Kafur di Fustat, sekitar tahun 347 H/958 M."
summary:
  ar: "من دمشق رحل المتنبي إلى مصر وإلى الفسطاط حيث ظفر برعاية الوصي الإخشيدي كافور، فاضطر إلى مدح رجل يحتقره في سره وبالكاد تخفي قصائده أسفه على فقدان حظوة سيف الدولة؛ ويقال إنه ما مدحه إلا لأنه وعده بإمارة صيدا، فلما رأى الوعود لا تتحقق طلب حظوة القائد أبي شجاع فاتك، ثم ساءت علاقته بكافور {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  en: "From Damascus al-Mutanabbi went to Egypt and to Fustat, where he obtained the patronage of the Ikhshidid regent Kafur, and was forced to sing the praises of a patron for whom in his heart he felt only contempt — his panegyrics barely conceal regret at losing Sayf al-Dawla's favour. He agreed to celebrate Kafur, it is said, only because he had been promised the governorship of Sidon; when the promises went unfulfilled he courted the Ikhshidid general Abu Shuja' Fatik, until relations with Kafur broke down {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  ur: "دمشق سے متنبی مصر کے فسطاط آئے جہاں اخشیدی وصی کافور کی سرپرستی ملی، اور انہیں اس شخص کے مداح بننا پڑا جسے وہ دل سے حقیر سمجھتے تھے — ان کے قصیدے سيف الدولہ کی عنایت کھو دینے کا افسوس مٹھی بھر چھپاتے ہیں۔ کہا جاتا ہے انہوں نے کافور کی مدح صرف اس لیے قبول کی کہ انھیں صیدا کے حکمرانی کا وعدہ ملا تھا؛ جب وعدے پورے نہ ہوئے تو وہ اخشیدی سردار ابو شجاع فاتک کی خاطر خواہ بنے، یہاں تک کہ کافور سے تعلقات بگڑ گئے {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}۔"
  es: "Desde Damasco, al-Mutanabbi viajó a Egipto y a Fustat, donde obtuvo el patrocinio del regente ikhshidí Kafur, y se vio obligado a alabar a un protector por quien en su corazón solo sentía desprecio; sus panegíricos apenas disimulan el pesar por haber perdido el favor de Sayf al-Dawla. Se dice que accedió a celebrar a Kafur solo porque le habían prometido el gobierno de Sidón; cuando las promesas no se cumplieron, buscó el favor del general ikhshidí Abu Shuja' Fatik, hasta que las relaciones con Kafur se rompieron {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  fr: "De Damas, al-Mutanabbi se rendit en Égypte, à Fustat, où il obtint la protection du régent ikhshidide Kafur. Il fut contraint de chanter les louanges d'un protecteur qu'il méprisait profondément; ses panégyriques dissimulaient à peine le regret d'avoir perdu la faveur de Sayf al-Dawla. Il n'accepta de célébrer Kafur, dit-on, que parce qu'on lui avait promis le gouvernement de Sidon; les promesses n'ayant pas été tenues, il courtisa le général ikhshidide Abu Shuja' Fatik, jusqu'à ce que ses relations avec Kafur se rompent."
  tr: "Şam'dan Mısır'a ve Fustat'a giden El-Mutanabbi, orada İhşidid koruyucusu Kafur'un himayesini kazandı. Gizlice hor gördüğü bir adamı övmek zorunda kaldı ve şiirlerinde Sayf el-Dawla'nın lütfunu kaybetmenin pişmanlığını zar zor gizledi. Söylendiğine göre, onu sadece Sidon emirliğini kendisine vaat ettiği için övmüştü. Vaatlerin yerine getirilmediğini görünce, komutan Ebu Şuca' Fatik'in lütfunu aradı ve ardından Kafur ile ilişkisi bozuldu. {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}"
  id: "Dari Damaskus, Al-Mutanabbi melakukan perjalanan ke Mesir dan ke Fustat, di mana ia mendapatkan perlindungan dari wali Ikhshidid, Kafur. Ia terpaksa memuji seorang pria yang diam-diam ia benci, dan puisi-puisinya hampir tidak menyembunyikan penyesalannya karena kehilangan dukungan Sayf al-Dawla. Dikatakan bahwa ia hanya memujinya karena Sayf al-Dawla menjanjikannya emirat Sidon. Ketika ia melihat bahwa janji-janji itu tidak dipenuhi, ia mencari dukungan dari komandan Abu Shuja’ Fatik, dan kemudian hubungannya dengan Kafur memburuk. {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}"
