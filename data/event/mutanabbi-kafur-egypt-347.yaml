label:
  ar: "المتنبي في رعاية كافور بالفسطاط، نحو ٣٤٧هـ/٩٥٨م"
  en: "Under Kafur's patronage at Fustat, c. 347/958"
  ur: "فسطاط میں کافور کی سرپرستی میں، تقریباً 347ھ/958ء"
summary:
  ar: "من دمشق رحل المتنبي إلى مصر وإلى الفسطاط حيث ظفر برعاية الوصي الإخشيدي كافور، فاضطر إلى مدح رجل يحتقره في سره وبالكاد تخفي قصائده أسفه على فقدان حظوة سيف الدولة؛ ويقال إنه ما مدحه إلا لأنه وعده بإمارة صيدا، فلما رأى الوعود لا تتحقق طلب حظوة القائد أبي شجاع فاتك، ثم ساءت علاقته بكافور {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  en: "From Damascus al-Mutanabbi went to Egypt and to Fustat, where he obtained the patronage of the Ikhshidid regent Kafur, and was forced to sing the praises of a patron for whom in his heart he felt only contempt — his panegyrics barely conceal regret at losing Sayf al-Dawla's favour. He agreed to celebrate Kafur, it is said, only because he had been promised the governorship of Sidon; when the promises went unfulfilled he courted the Ikhshidid general Abu Shuja' Fatik, until relations with Kafur broke down {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  ur: "دمشق سے متنبی مصر کے فسطاط آئے جہاں اخشیدی وصی کافور کی سرپرستی ملی، اور انہیں اس شخص کے مداح بننا پڑا جسے وہ دل سے حقیر سمجھتے تھے — ان کے قصیدے سيف الدولہ کی عنایت کھو دینے کا افسوس مٹھی بھر چھپاتے ہیں۔ کہا جاتا ہے انہوں نے کافور کی مدح صرف اس لیے قبول کی کہ انھیں صیدا کے حکمرانی کا وعدہ ملا تھا؛ جب وعدے پورے نہ ہوئے تو وہ اخشیدی سردار ابو شجاع فاتک کی خاطر خواہ بنے، یہاں تک کہ کافور سے تعلقات بگڑ گئے {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}۔"
