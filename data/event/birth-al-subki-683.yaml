label:
  ar: "مولد تقي الدين السبكي بمصر، صفر ٦٨٣هـ/أبريل ١٢٨٤م"
  en: "Birth of Taqi al-Din al-Subki in Egypt, Safar 683/April 1284"
  ur: "تقی الدین سبکی کی پیدائش، مصر، صفر 683ھ/اپریل 1284ء"
summary:
  ar: "وُلد علي بن عبد الكافي بن علي بن تمام، تقي الدين أبو الحسن السبكي الأنصاري الخزرجي الشافعي، في شهر صفر سنة ٦٨٣هـ/أبريل ١٢٨٤م بمصر؛ ويرجع أصل أسرته إلى بلدة سُبك بإقليم مَنْف في الغربية بدلتا النيل {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745}."
  en: "Ali ibn Abd al-Kafi ibn Ali ibn Tamam — Taqi al-Din Abu al-Hasan al-Subki al-Ansari al-Khazraji al-Shafi'i — was born in Safar 683/April 1284 in Egypt; his family traced its origin to the town of Subk in the Manf district of the western Nile Delta {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745}."
  ur: "علی بن عبد الکافی بن علی بن تمام، تقی الدین ابو الحسن سبکی انصاری خزرجی شافعی، صفر 683ھ/اپریل 1284ء کو مصر میں پیدا ہوئے؛ ان کے خاندان کی اصل نیل کی ڈیلٹا میں منف کے علاقے کی بستی سُبک سے تھی {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745}۔"
