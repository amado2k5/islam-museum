label:
  ar: "مولد تقي الدين السبكي بمصر، صفر ٦٨٣هـ/أبريل ١٢٨٤م"
  en: "Birth of Taqi al-Din al-Subki in Egypt, Safar 683/April 1284"
  ur: "تقی الدین سبکی کی پیدائش، مصر، صفر 683ھ/اپریل 1284ء"
  fr: "La naissance de Taqi al-Din al-Subki en Égypte, Safar 683/avril 1284"
  es: "Nacimiento de Taqi al-Din al-Subki en Egipto, Safar 683/abril de 1284"
  tr: "Takiyüddin el-Subki'nin Mısır'da doğuşu, Safar 683 H./Nisan 1284 AD"
  id: "Kelahiran Taqi al-Din al-Subki di Mesir, Safar 683 H/April 1284 M"
summary:
  ar: "وُلد علي بن عبد الكافي بن علي بن تمام، تقي الدين أبو الحسن السبكي الأنصاري الخزرجي الشافعي، في شهر صفر سنة ٦٨٣هـ/أبريل ١٢٨٤م بمصر؛ ويرجع أصل أسرته إلى بلدة سُبك بإقليم مَنْف في الغربية بدلتا النيل {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745}."
  en: "Ali ibn Abd al-Kafi ibn Ali ibn Tamam — Taqi al-Din Abu al-Hasan al-Subki al-Ansari al-Khazraji al-Shafi'i — was born in Safar 683/April 1284 in Egypt; his family traced its origin to the town of Subk in the Manf district of the western Nile Delta {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745}."
  ur: "علی بن عبد الکافی بن علی بن تمام، تقی الدین ابو الحسن سبکی انصاری خزرجی شافعی، صفر 683ھ/اپریل 1284ء کو مصر میں پیدا ہوئے؛ ان کے خاندان کی اصل نیل کی ڈیلٹا میں منف کے علاقے کی بستی سُبک سے تھی {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745}۔"
  fr: "Ali ibn Abd al-Kafi ibn Ali ibn Tamam, Taqi al-Din Abu al-Hasan al-Subki al-Ansari al-Khazraji al-Shafi'i, naquit en Safar 683/avril 1284 en Égypte ; sa famille faisait remonter son origine à la bourgade de Subk, dans le district de Manf, dans l'ouest du delta du Nil {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745}."
  es: "Ali ibn Abd al-Kafi ibn Ali ibn Tamam — Taqi al-Din Abu al-Hasan al-Subki al-Ansari al-Khazraji al-Shafi'i — nació en Safar 683/abril de 1284 en Egipto; su familia remontaba su origen a la ciudad de Subk en el distrito de Manf del delta occidental del Nilo {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745}."
  tr: "Ali ibn Abd al-Kafi ibn Ali ibn Tamam, Taqi al-Din Abu al-Hasan al-Subki al-Ansari al-Khazraji al-Shafi’i, Hicri 683/Miladi 1284 Nisan ayında Mısır'da Safer ayında doğmuştur; ailesi Nil Deltası'ndaki Garbia bölgesinde, Manf ilindeki Subk kasabasından gelmektedir. {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745}"
  id: "Ali ibn Abd al-Kafi ibn Ali ibn Tamam, Taqi al-Din Abu al-Hasan al-Subki al-Ansari al-Khazraji al-Shafi’i, lahir pada bulan Safar tahun 683 H/April 1284 M di Mesir; keluarganya berasal dari kota Subk di wilayah Manf di Gharbia di Delta Nil {cite:encyclopaedia-of-islam-2 vol. 9 pp. 744-745}."
