id: event/khatib-return-baghdad-462
class: event
kind: migration
label:
  ar: "عودة الخطيب إلى بغداد وسماع «التاريخ» بالنظامية، ذو الحجة ٤٦٢هـ"
  en: "Al-Khatib returns to Baghdad; the Tarikh is heard at the Nizamiyya, Dhu al-Hijja 462/1070"
  ur: "خطیب کی بغداد واپسی اور نظامیہ میں «تاریخ» کی سماعت، ذوالحجہ 462ھ/1070ء"
  es: "Al-Khatib regresa a Bagdad; el Tarikh se escucha en Nizamiyya, Dhu al-Hijja 462/1070"
  fr: "Al-Khatib retourne à Bagdad; le Tarikh est entendu à la Nizamiyya, Dhu al-Hijja 462/1070"
  tr: "Vaiz Bağdat'a döndü ve Hicri 462 yılının Zilhicce ayında Nizamiye'de \"Tarih\"i dinledi."
  id: "Pendakwah itu kembali ke Baghdad dan mendengarkan \"Sejarah\" di Nizamiyya, Dzul Hijjah 462 Hijriah."
summary:
  ar: "توجّه الخطيب سنة اثنتين وستين وأربعمائة إلى طرابلس ثم إلى حلب ثم إلى بغداد على الرحبة، وحدّث في طريقه بحلب وغيرها، ودخل بغداد في ذي الحجة {cite:tarikh-islam-dhahabi p. 93}؛ وكان يتمنى أمرين: أن يعود إلى بغداد فيُسمع منه تاريخه على كماله بها، وأن يموت فيها فيُدفن عند بشر، فسمع منه كتابه البغداديون في المدرسة النظامية {cite:tarikh-islam-dhahabi p. 107}."
  en: "In 462 al-Khatib made for Tripoli, then Aleppo, then Baghdad by way of al-Rahba, dictating hadith at Aleppo and elsewhere on the road, and entered Baghdad in Dhu al-Hijja. He had wished for two things — to return so that his Tarikh might be heard from him complete at Baghdad, and to die there and be buried beside Bishr — and the Baghdadis heard the book from him at the Nizamiyya madrasa {cite:tarikh-islam-dhahabi pp. 93, 107}."
  ur: "462ھ میں خطیب طرابلس، پھر حلب، پھر رحبہ کے راستے بغداد روانہ ہوئے، راستے میں حلب اور دوسرے مقامات پر حدیث بیان کی، اور ذوالحجہ میں بغداد داخل ہوئے۔ ان کی دو تمناں تھیں: بغداد لوٹ کر اپنی تاریخ وہاں کامل سناؤں اور وہیں فوت ہو کر بشر کے پہلو میں دفن ہوں — بغداد والوں نے مدرسہ نظامیہ میں ان سے کتاب سنی {cite:tarikh-islam-dhahabi pp. 93, 107}۔"
  es: "En 462, al-Khatib se dirigió a Trípoli, luego a Alepo y finalmente a Bagdad por la ruta de al-Rahba, dictando hadices en Alepo y otros lugares del camino, y entró en Bagdad en Dhu al-Hijja. Había deseado dos cosas: regresar para que su Tarikh pudiera ser escuchado completo en Bagdad, y morir allí y ser enterrado junto a Bishr. Los bagdadíes escucharon el libro de él en la madrasa Nizamiyya {cite:tarikh-islam-dhahabi pp. 93, 107}."
  fr: "En 462, al-Khatib se rendit à Tripoli, puis à Alep, puis à Bagdad en passant par al-Rahba, dictant des hadiths à Alep et ailleurs sur le chemin, et arriva à Bagdad en Dhu al-Hijja. Il avait formulé deux souhaits: revenir à Bagdad afin que son Tarikh puisse y être récité intégralement, et y mourir et être enterré auprès de Bishr. Les Bagdadiens entendirent son ouvrage à la madrasa Nizamiyya (voir: Tarikh-Islam-Dhahabi, p. 93, 107)."
  tr: "Hicri 462 yılında El-Hatib, Trablus'a, oradan Halep'e, daha sonra da El-Rahba üzerinden Bağdat'a gitti. Halep'te ve başka yerlerde yolculuğu sırasında hadis rivayet etti. Zilhicce ayında Bağdat'a girdi (kaynak:tarikh-islam-dhahabi s. 93). İki şey arzuluyordu: Bağdat'a dönmek ve orada tarihinin tamamının kendisinden duyulmasını sağlamak; ve orada ölmek ve Bişr yakınlarına gömülmek. Bağdatlılar onun kitabını Nizamiye Okulu'nda ondan dinlediler (kaynak:tarikh-islam-dhahabi s. 107)."
  id: "Pada tahun 462 H, Al-Khatib menuju Tripoli, kemudian ke Aleppo, lalu ke Baghdad melalui Al-Rahba. Ia meriwayatkan hadits dalam perjalanannya di Aleppo dan tempat lain. Ia memasuki Baghdad pada bulan Dzul Hijjah {cite:tarikh-islam-dhahabi hlm. 93}. Ia menginginkan dua hal: kembali ke Baghdad agar sejarahnya dapat didengar secara utuh darinya di sana, dan meninggal di sana serta dimakamkan di dekat Bishr. Penduduk Baghdad mendengar kitabnya darinya di Mazhab Nizamiyyah {cite:tarikh-islam-dhahabi hlm. 107}."
