label: { ar: "إجلاء نصارى نجران", en: "Umar's Expulsion of the Christians of Najran", es: "La expulsión de los cristianos de Najrán por parte de Umar", fr: "L'expulsion des chrétiens de Najran par Umar", ur: "عمر کا نجران کے عیسائیوں کو نکال باہر کرنا", tr: "Necran'daki Hristiyanların tahliyesi", id: "Evakuasi umat Kristen di Najran" }
summary:
  ar: "عند البلاذري: لما استخلف عمر أصاب أهل نجران الربا وكثروا فخافهم على الإسلام فأجلاهم إلى النجرانية بناحية الكوفة — وبها سُمّيت — واشترى عقاراتهم وأموالهم وكتب لهم أن ما وقعوا به من الشام والعراق فليُوسَعهم من حرث الأرض مكان أرضهم باليمن، ودخل يهود نجران مع النصارى في الصلح فكانوا كالأتباع لهم؛ وفي رواية سالم بن أبي الجعد أن أهل نجران بلغوا أربعين ألفاً فتحاسدوا فأتوا عمر فقالوا «أجلنا» فأجلاهم ثم ندموا وطلبوا الإقالة فأبى، فلما قام علي بن أبي طالب أتوه فقال «إن عمر كان رشيد الأمر وأنا أكره خلافه»؛ ثم توالت عليهم الأحكام: حطّ عنهم عثمان مائتي حلة بكتاب إلى عامله على الكوفة الوليد بن عقبة لما أنبأه عثمان بن حنيف أن إجلاءهم كان ضاراً بالدهاقين، وأكملهم معاوية أو يزيد أربعمائة حلة، وردّهم الحجاج بعد خروج ابن الأشعث إلى ألف وثمانمائة حلة متّهماً إياهم بموالاته، وألزمهم عمر بن عبد العزيز مائتي حلة قيمتها ثمانية آلاف درهم لما وجدهم على العشر من عدّتهم الأولى وقال «أرى هذا الصلح جزية على رؤوسهم وليس بصلح على أراضيهم وجزية الميت والمسلم ساقطة»، وردّهم يوسف بن عمر في أيام الوليد بن يزيد إلى أمرهم الأول عصبية للحجاج، وأقرّهم أبو العباس السفاح على مائتي حلة لما نثروا على موكبه الريحان بالكوفة وتوسط لهم عبد الله بن الربيع الحارثي وأيّدهم الحجاج بن أرطاة في نسبهم في بني الحارث بن كعب أخواله، وأكّدها هارون الرشيد بكتاب رآه الرواة وأمر أن يُعفوا من معاملة العمال ويؤدوا إلى بيت المال بالحضرة."
  en: "In al-Baladhuri: under Umar the people of Najran took usury and multiplied, so he feared them for Islam and exiled them to al-Najraniyya by Kufa — the settlement named after them — buying up their estates and writing for them that wherever they settled in Syria or Iraq they were to be granted arable land in place of their land in Yemen; the Jews of Najran had entered the treaty with the Christians as their followers; in Salim ibn Abi al-Ja'd's report the people of Najran reached forty thousand, quarrelled among themselves, asked Umar 'exile us' — which he did, already fearing them for the Muslims — then regretted it and sought reversal which he refused, and when Ali ibn Abi Talib took office they came to him and he said 'Umar was of sound judgement and I dislike opposing him'; the rulings then ran on: Uthman remitted two hundred hullas by letter to his Kufa governor al-Walid ibn Uqba after Uthman ibn Hunayf told him their exile had harmed the dihqans by driving them off their land; Mu'awiya or Yazid completed them to four hundred hullas; al-Hajjaj restored eighteen hundred after Ibn al-Ash'ath's revolt, accusing them of backing it; Umar ibn Abd al-Aziz set them at two hundred hullas worth eight thousand dirhams on finding them at a tithe of their former number — 'I see this treaty is a jizya on their heads, not a treaty on their lands, and the jizya of the dead and the Muslim lapses'; Yusuf ibn Umar restored them under al-Walid ibn Yazid out of solidarity with al-Hajjaj; Abu al-Abbas al-Saffah confirmed two hundred hullas after they scattered basil on his procession at Kufa and Abdullah ibn al-Rabi' al-Harithi interceded for their kinship claim through Banu al-Harith ibn Ka'b his maternal uncles, seconded by al-Hajjaj ibn Arta; and Harun al-Rashid confirmed it by a letter the transmitters saw, ordering them freed from dealing with the tax agents to pay directly to the treasury at the capital."
  es: "En al-Baladhuri: bajo el mandato de Umar, la gente de Najrán se dedicó a la usura y se multiplicó, por lo que él les temió por el Islam y los exilió a al-Najraniyya, cerca de Kufa —el asentamiento que lleva su nombre—, comprando sus propiedades y escribiéndoles que dondequiera que se establecieran en Siria o Irak, se les concedería tierra cultivable en lugar de su tierra en Yemen; los judíos de Najrán habían firmado el tratado con los cristianos como sus seguidores; en el informe de Salim ibn Abi al-Ja'd, la gente de Najrán llegó a cuarenta mil, se pelearon entre sí, le pidieron a Umar que los exiliara —lo cual hizo, ya temiéndoles por los musulmanes—, luego se arrepintió y pidió que se revirtiera, lo cual él rechazó, y cuando Ali ibn Abi Talib asumió el cargo, vinieron a él y él dijo: «Umar tenía buen juicio y no me gusta oponerme a él». Las decisiones continuaron: Uthman condonó doscientas hullas por carta a su gobernador de Kufa, al-Walid ibn Uqba, después de que Uthman ibn Hunayf le dijera que su exilio había perjudicado a los dihqans al expulsarlos de sus tierras; Mu'awiya o Yazid las completó a cuatrocientas hullas; al-Hajjaj restituyó mil ochocientas después de la revuelta de Ibn al-Ash'ath, acusándolos de apoyarla; Umar ibn Abd al-Aziz las fijó en doscientas hullas por valor de ocho mil dirhams al encontrarlas en un diezmo de su número anterior: 'Veo que este tratado es una jizya sobre sus cabezas, no un tratado sobre sus tierras, y la jizya de los muertos y los musulmanes caducan'; Yusuf ibn Umar las restituyó bajo al-Walid ibn Yazid por solidaridad con al-Hajjaj; Abu al-Abbas al-Saffah confirmó doscientas hullas después de que esparcieran albahaca en su procesión en Kufa y Abdullah ibn al-Rabi' al-Harithi intercedió por su reclamo de parentesco a través de Banu al-Harith ibn Ka'b, sus tíos maternos, secundado por al-Hajjaj ibn Arta; y Harun al-Rashid lo confirmó mediante una carta que vieron los transmisores, ordenándoles que quedaran exentos de tratar con los agentes tributarios para pagar directamente al tesoro en la capital."
  fr: "Selon al-Baladhuri: sous le règne d’Umar, les habitants de Najran pratiquèrent l’usure et se multiplièrent. Craignant leur influence musulmane, il les exila à al-Najraniyya, près de Kufa (la localité qui porte leur nom), rachetant leurs terres et stipulant que, où qu’ils s’installent en Syrie ou en Irak, des terres arables leur seraient concédées en remplacement de leurs terres au Yémen. Les Juifs de Najran avaient conclu un traité avec les chrétiens en tant que leurs alliés. D’après le récit de Salim ibn Abi al-Ja’d, les habitants de Najran atteignirent quarante mille personnes, se querellèrent et demandèrent à Umar de les exiler. Ce qu’il fit, les craignant déjà pour leur influence musulmane. Ils le regrettèrent ensuite et cherchèrent à revenir sur leur décision, ce qu’il refusa. Lorsque Ali ibn Abi Talib prit ses fonctions, ils vinrent le trouver et il déclara: « Umar était un homme de bon jugement et je n’aime pas m’opposer à lui. » Les décisions se succédèrent ensuite: Uthman remit deux cents hullas par lettre à son gouverneur de Kufa, al-Walid ibn Uqba, après qu’Uthman ibn Hunayf lui eut indiqué que leur exil avait nui aux dihqans en les chassant de leurs terres; Mu’awiya ou Yazid porta ce montant à quatre cents hullas; al-Hajjaj rétablit mille huit cents hullas après la révolte d’Ibn al-Ash’ath, les accusant de la soutenir; Umar ibn Abd al-Aziz fixa ce montant à deux cents hullas, soit huit mille dirhams, après avoir constaté qu’ils n’avaient perçu que la dîme de leur nombre antérieur: « Je vois que ce traité est une jizya sur leurs têtes, et non un traité sur leurs terres, et la jizya des morts et des musulmans est caduque »; Yusuf ibn Umar rétablit ce montant sous al-Walid ibn Yazid par solidarité avec al-Hajjaj; Abu al-Abbas al-Saffah confirma que deux cents hullas avaient été dispersés sur sa procession à Kufa, et Abdullah ibn al-Rabi' al-Harithi intercéda en leur faveur pour leur revendication de parenté par l'intermédiaire de ses oncles maternels, Banu al-Harith ibn Ka'b, appuyé par al-Hajjaj ibn Arta; et Harun al-Rashid le confirma par une lettre que les transmetteurs virent, leur ordonnant d'être dispensés de traiter avec les agents fiscaux et de payer directement au trésor de la capitale."
  ur: "البلادوری میں ہے: عمر کے دور میں نجران کے لوگوں نے سود لیا اور اس میں کئی گنا اضافہ ہوا، تو اس نے ان سے اسلام سے ڈر کر انہیں کوفہ کی طرف سے نجرانیہ میں جلاوطن کر دیا، جو ان کے نام پر بستی ہے، ان کی جاگیریں خرید کر ان کے لیے لکھ دیا کہ وہ شام یا عراق میں جہاں کہیں بھی آباد ہوں انہیں ان کی زمینوں کے بدلے قابل کاشت زمین دی جائے گی۔ نجران کے یہودیوں نے عیسائیوں کے ساتھ اپنے پیروکاروں کے طور پر معاہدہ کیا تھا۔ سالم بن ابی الجعد کی روایت میں ہے کہ نجران کے لوگ چالیس ہزار تک پہنچ گئے، آپس میں جھگڑے ہوئے، عمر سے کہا کہ ہمیں جلاوطن کر دو، جو اس نے کیا، پہلے ہی ان سے مسلمانوں کے خوف سے، پھر اس پر افسوس ہوا اور پلٹنے کی کوشش کی جس سے اس نے انکار کر دیا، اور جب علی ابن ابی طالب نے عہدہ سنبھالا تو وہ اس کے پاس آئے اور میں نے اس کی مخالفت کی اور کہا۔ اس کے بعد احکام جاری ہوئے: عثمان نے اپنے کوفہ کے گورنر الولید ابن عقبہ کو خط کے ذریعے دو سو حلے بھیجے جب عثمان بن حنیف نے اسے بتایا کہ ان کی جلاوطنی نے دقانوں کو ان کی سرزمین سے نکال کر نقصان پہنچایا ہے۔ معاویہ یا یزید نے ان کو چار سو حلوں تک پورا کیا۔ الحجاج نے ابن اشعث کی بغاوت کے بعد اٹھارہ سو کو بحال کیا اور ان پر اس کی پشت پناہی کا الزام لگایا۔ عمر بن عبدالعزیز نے انہیں ان کی سابقہ تعداد کے دسواں حصے پر ملنے پر آٹھ ہزار درہم کی قیمت کے دو سو حلے مقرر کیے - 'میں دیکھ رہا ہوں کہ یہ معاہدہ ان کے سروں پر جزیہ ہے، ان کی زمینوں کا معاہدہ نہیں، اور مرنے والوں کا جزیہ اور مسلمانوں کی غلطی'؛ یوسف ابن عمر نے الحجاج کے ساتھ یکجہتی کے لیے انہیں الولید بن یزید کے ماتحت بحال کیا۔ ابو العباس الصفح نے کوفہ میں اس کے جلوس پر تلسی بکھیرنے کے بعد دو سو ہلوں کی تصدیق کی اور عبداللہ بن الربیع الحارثی نے اپنے ماموں بنو الحارث بن کعب کے ذریعے اپنے رشتہ داری کے دعوے کی شفاعت کی، جس کی تائید الحجاج ابن ارطہ نے کی۔ اور ہارون الرشید نے اس کی تصدیق ایک خط کے ذریعے کی جو ٹرانسمیٹر نے دیکھی تھی، جس میں انہیں ٹیکس ایجنٹوں کے ساتھ ڈیل کرنے سے آزاد کرنے کا حکم دیا گیا تھا کہ وہ براہ راست دارالحکومت کے خزانے کو ادا کریں۔"
  tr: "El-Baladhuri'ye göre: Ömer halife olduğunda, Necran halkı tefeciliğe bulaşmış ve sayıları artmıştı. Bunun üzerine Ömer, İslamiyet yüzünden onlardan korktu ve onları Kufe bölgesindeki Necraniye'ye sürdü -ki burası adını buradan almıştır- ve mallarını ve paralarını satın aldı. Onlara, Suriye ve Irak'tan elde ettikleri her şeyin karşılığında Yemen'deki topraklarının yerine daha fazla toprak verilmesini emretti. Necran Yahudileri Hristiyanlarla barıştı ve onların takipçileri oldular. Salim bin Ebu el-Câd'ın rivayetine göre, Necran halkı kırk bin kişiydi, bu yüzden birbirlerine imrendiler ve Ömer'e gelip, \"Bize süre tanıyın\" dediler. Bunun üzerine Ömer onları sürgün etti. Sonra pişman oldular ve serbest bırakılmayı istediler, ancak Ömer reddetti. Ali bin Ebu Talib ayağa kalktığında, ona geldiler ve o, \"Ömer işlerinde haklıydı ve ona karşı gelmekten hoşlanmıyorum\" dedi. Daha sonra onlara karşı bir dizi hüküm verildi: Osman, Kufa valisi el-Valid ibn Ukba'ya yazdığı bir mektupta, sürgünlerinin toprak sahipleri için zararlı olduğunu bildirmesinin ardından vergilerini iki yüz elbise azalttı. Muaviye veya Yezid bunu dört yüz elbiseye çıkardı. İbn el-Eş'at'ın isyanından sonra el-Haccac, onları kendisine destek vermekle suçlayarak vergilerini bin sekiz yüz elbiseye geri getirdi. Ömer ibn Abdülaziz, vergilerinin asıl miktarlarının sadece onda biri olduğunu görünce, onlara sekiz bin dirhem değerinde iki yüz elbise vergi koydu ve şöyle dedi: \"Bu barışı topraklarına değil, başlarına bir haraç olarak görüyorum ve ölüler ile Müslümanlara olan haraç kaldırılmıştır.\" Yusuf ibn Ömer, el-Valid ibn Yezid'in hükümdarlığı döneminde, el-Haccac'a olan sadakatinden dolayı onları önceki durumlarına geri getirdi. Ebu el-Abbas el-Saffah, Kufa'daki alayında fesleğen serptikleri için onlara iki yüz elbiseyi saklamalarına izin verdi ve Abdullah ibn el-Rabi' el-Harithi onların adına aracı oldu. El-Haccac ibn Artat, onların annesinin amcaları olan Beni el-Harith ibn Ka'b'dan geldikleri iddiasını destekledi. Harun el-Raşid, rivayetçiler tarafından görülen bir mektupta bunu doğrulayarak, işçilerin muamelesinden muaf tutulmalarını ve hazineye huzur içinde ödeme yapmalarını emretti."
  id: "Menurut Al-Baladhuri: Ketika Umar menjadi Khalifah, penduduk Najran terlibat dalam praktik riba dan jumlah mereka bertambah, sehingga ia khawatir mereka akan memeluk Islam, lalu ia mengusir mereka ke Najraniyah di wilayah Kufa — dan wilayah itu dinamai demikian — dan ia membeli harta benda dan uang mereka serta menulis surat kepada mereka bahwa apa pun yang telah mereka peroleh dari Suriah dan Irak, mereka harus diberi lebih banyak tanah untuk digarap sebagai pengganti tanah mereka di Yaman. Orang-orang Yahudi Najran berdamai dengan orang-orang Kristen dan menjadi pengikut mereka. Dalam riwayat Salim bin Abi Al-Ja’d, penduduk Najran berjumlah empat puluh ribu orang, sehingga mereka saling iri dan datang kepada Umar dan berkata, “Berilah kami kesempatan,” lalu ia mengusir mereka. Kemudian mereka menyesalinya dan meminta pembebasan, tetapi ia menolak. Ketika Ali bin Abi Talib berdiri, mereka datang kepadanya dan ia berkata, “Umar benar dalam urusannya, dan aku tidak suka menentangnya.” Kemudian serangkaian keputusan dikeluarkan terhadap mereka: Utsman mengurangi pajak mereka sebesar dua ratus robe dalam suratnya kepada gubernur Kufa, al-Walid ibn Uqba, setelah Utsman ibn Hanif memberitahunya bahwa pengusiran mereka merugikan para pemilik tanah. Muawiya atau Yazid menaikkannya menjadi empat ratus robe. Al-Hajjaj, setelah pemberontakan Ibn al-Ash'ath, mengembalikan pajak mereka menjadi seribu delapan ratus robe, dengan menuduh mereka mendukungnya. Umar ibn Abd al-Aziz mengenakan pajak sebesar dua ratus robe, senilai delapan ribu dirham, kepada mereka ketika ia mendapati bahwa jumlah mereka hanya sepersepuluh dari jumlah semula, dengan mengatakan, \"Aku menganggap perdamaian ini sebagai upeti atas kepala mereka, bukan perdamaian atas tanah mereka, dan upeti atas orang mati dan Muslim ditiadakan.\" Yusuf ibn Umar, selama pemerintahan al-Walid ibn Yazid, mengembalikan mereka ke status semula karena kesetiaan kepada al-Hajjaj. Abu al-Abbas al-Saffah mengizinkan mereka menyimpan dua ratus jubah ketika mereka menaburkan daun kemangi pada arak-arakannya di Kufa, dan Abdullah ibn al-Rabi' al-Harithi menjadi perantara bagi mereka. Al-Hajjaj ibn Artat mendukung klaim mereka atas garis keturunan dari Banu al-Harith ibn Ka'b, paman-paman dari pihak ibunya. Harun al-Rashid mengkonfirmasi hal ini dalam sebuah surat yang dilihat oleh para perawi, memerintahkan agar mereka dibebaskan dari perlakuan terhadap pekerja dan pembayaran mereka ke kas negara di hadapan umum."
