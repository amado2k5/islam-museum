summary:
  ar: "انهزم عسكر الخليفة الناصر لدين الله من السلطان طغرل بن أرسلان، وكان الناصر قد سرّه وقوّاه على الأتابكية حتى ملك الري وهمذان وأصفهان وأذربيجان {cite:kamil-ibn-al-athir p. 178}."
  en: "The caliph al-Nasir army was routed by Sultan Tughril III — the caliph own fosterling, raised against the atabegs until he held Rayy, Hamadan, Isfahan and Azerbaijan {cite:kamil-ibn-al-athir p. 178}."
  fr: "L'armée du calife al-Nasir fut mise en déroute par le sultan Tughril III, le protégé du calife lui-même, élevé contre les atabegs jusqu'à tenir Rayy, Hamadan, Ispahan et l'Azerbaïdjan {cite:kamil-ibn-al-athir p. 178}."
  es: "El ejército del califa al-Nasir fue derrotado por el sultán Tughril III, el protegido del propio califa, quien se alzó contra los atabegs hasta que controló Rayy, Hamadán, Isfahán y Azerbaiyán {cite:kamil-ibn-al-athir p. 178}."
  ur: "خلیفہ النصیر کی فوج کو سلطان طغرل III نے شکست دی تھی - جو خلیفہ کا اپنا پالنے والا تھا، جسے اطابیوں کے خلاف اٹھایا گیا یہاں تک کہ اس نے رے، ہمدان، اصفہان اور آذربائیجان پر قبضہ کر لیا۔ 178}۔"
  tr: "Halife Al-Nasir li-Din Allah'ın ordusu, Al-Nasir'in memnun ettiği ve Atabegler üzerinde güçlendirdiği Sultan Tuğril ibn Arslan tarafından yenilgiye uğratıldı. Tuğril ibn Arslan, Rey, Hamadan, İsfahan ve Azerbaycan'ı yönetene kadar bu konumda kaldı. {Kaynak: Kamil ibn al-athir s. 178}"
  id: "Pasukan Khalifah Al-Nasir li-Din Allah dikalahkan oleh Sultan Tughril ibn Arslan, yang telah dipuja dan diperkuat oleh Al-Nasir atas Atabeg hingga ia memerintah Rayy, Hamadan, Isfahan dan Azerbaijan {cite:kamil-ibn-al-athir p. 178}."
