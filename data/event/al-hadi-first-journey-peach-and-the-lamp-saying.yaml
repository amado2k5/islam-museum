id: event/al-hadi-first-journey-peach-and-the-lamp-saying
class: event
kind: other
label:
  ar: الخوخ في سفر الهادي الأول سنة 280هـ وقوله إنه كالمصباح يحرق نفسه ويضيء لغيره
  en: The peach on al-Hadi's first journey in 280 AH, and his saying that he is like a lamp that burns itself to light others
  ur: 280ھ کے پہلے سفر میں آڑو اور ان کا قول کہ وہ چراغ کی طرح ہیں جو خود جلتا اور دوسروں کو روشن کرتا ہے
summary:
  ar: يروي محمد بن هشام عن الكوفي أنهم خرجوا مع الهادي في سفره الأول سنة 280هـ يريدون صنعاء، فأخذ بعض من في عسكره فرسكاً وهو الخوخ فأكله، فلما علم رجع من موضعه، وقال لما كلموه في البقاء في اليمن إنه لا يجد لنفسه إلا أن يكون كهذا المصباح؛ ويروي أنه رد من طلب نهب ما يقفون عليه.
  en: Muhammad ibn Hisham, through al-Kufi, says they went out with al-Hadi on his first journey in 280 AH toward Sanaa; one of his party took a peach and ate it, and when al-Hadi learned of it he turned back from where he was; asked to stay in Yemen he said he could find nothing for himself except to be like this lamp that burns itself and lights others; he also refused a man's request to plunder what they came upon.
  ur: محمد بن ہشام، کوفی کے واسطے سے، بتاتے ہیں کہ وہ 280ھ میں ہادی کے پہلے سفر میں صنعاء کے ارادے سے نکلے؛ ان کے لشکر کے ایک شخص نے آڑو لے کر کھا لیا، ہادی کو پتا چلا تو وہ اپنی جگہ سے واپس لوٹ گئے؛ یمن میں ٹھہرنے کو کہا گیا تو بولے کہ وہ اس چراغ کی طرح ہی ہو سکتے ہیں جو خود جلتا ہے اور دوسروں کو روشن کرتا ہے؛ اور ایک شخص کی لوٹ کی درخواست رد کی۔
