id: event/al-hadi-first-journey-peach-and-the-lamp-saying
class: event
kind: other
label:
  ar: الخوخ في سفر الهادي الأول سنة 280هـ وقوله إنه كالمصباح يحرق نفسه ويضيء لغيره
  en: The peach on al-Hadi's first journey in 280 AH, and his saying that he is like a lamp that burns itself to light others
  ur: 280ھ کے پہلے سفر میں آڑو اور ان کا قول کہ وہ چراغ کی طرح ہیں جو خود جلتا اور دوسروں کو روشن کرتا ہے
  es: "El melocotón en el primer viaje de al-Hadi en el año 280 de la Hégira, y su dicho de que es como una lámpara que se consume para iluminar a otros."
  fr: "La pêche lors du premier voyage d'al-Hadi en 280 AH, et sa déclaration selon laquelle il est comme une lampe qui se consume pour éclairer les autres"
  tr: "Hadi'nin Hicri 280 yılında yaptığı ilk seyahatte getirdiği şeftali ve onun, kendi kendini yakan ve başkalarına ışık veren bir lamba gibi olduğu sözü."
  id: "Buah persik dalam perjalanan pertama Al-Hadi pada tahun 280 Hijriah, dan perkataannya bahwa buah itu seperti lampu yang menyala sendiri dan memberi cahaya kepada orang lain."
summary:
  ar: يروي محمد بن هشام عن الكوفي أنهم خرجوا مع الهادي في سفره الأول سنة 280هـ يريدون صنعاء، فأخذ بعض من في عسكره فرسكاً وهو الخوخ فأكله، فلما علم رجع من موضعه، وقال لما كلموه في البقاء في اليمن إنه لا يجد لنفسه إلا أن يكون كهذا المصباح؛ ويروي أنه رد من طلب نهب ما يقفون عليه.
  en: Muhammad ibn Hisham, through al-Kufi, says they went out with al-Hadi on his first journey in 280 AH toward Sanaa; one of his party took a peach and ate it, and when al-Hadi learned of it he turned back from where he was; asked to stay in Yemen he said he could find nothing for himself except to be like this lamp that burns itself and lights others; he also refused a man's request to plunder what they came upon.
  ur: محمد بن ہشام، کوفی کے واسطے سے، بتاتے ہیں کہ وہ 280ھ میں ہادی کے پہلے سفر میں صنعاء کے ارادے سے نکلے؛ ان کے لشکر کے ایک شخص نے آڑو لے کر کھا لیا، ہادی کو پتا چلا تو وہ اپنی جگہ سے واپس لوٹ گئے؛ یمن میں ٹھہرنے کو کہا گیا تو بولے کہ وہ اس چراغ کی طرح ہی ہو سکتے ہیں جو خود جلتا ہے اور دوسروں کو روشن کرتا ہے؛ اور ایک شخص کی لوٹ کی درخواست رد کی۔
  es: "Muhammad ibn Hisham, a través de al-Kufi, dice que salieron con al-Hadi en su primer viaje en el año 280 de la Hégira hacia Sanaa; uno de los suyos tomó un melocotón y se lo comió, y cuando al-Hadi se enteró, regresó del lugar donde estaba; cuando le pidieron quedarse en Yemen, dijo que no podía encontrar nada para sí mismo excepto ser como esta lámpara que se consume a sí misma e ilumina a otros; también rechazó la petición de un hombre de saquear lo que encontraran."
  fr: "Muhammad ibn Hisham, par l'intermédiaire d'al-Kufi, raconte qu'ils accompagnèrent al-Hadi lors de son premier voyage en 280 AH vers Sanaa; un membre de son groupe prit une pêche et la mangea, et lorsqu'al-Hadi l'apprit, il rebroussa chemin; on lui demanda de rester au Yémen, mais il répondit qu'il ne pouvait rien y trouver d'autre que d'être comme cette lampe qui se consume et éclaire les autres; il refusa également la demande d'un homme de piller ce qu'ils trouvaient."
  tr: "Muhammed bin Hişam, Kufi'den rivayetle, Hicri 280 yılında Hadi ile birlikte Sana'a'ya gitmek üzere ilk seferine çıktıklarını anlatır. Ordusundakilerden bazıları bir şeftali alıp yediler. Bunu öğrenince bulunduğu yerden geri döndü. Yemen'de kalması konusunda kendisine teklifte bulunulduğunda, \"Ben ancak bu lamba gibi olabilirim\" dedi. Rivayetlere göre, bulduklarını yağmalamaya çalışanları geri çevirdi."
  id: "Muhammad bin Hisham meriwayatkan dari al-Kufi bahwa mereka pergi bersama al-Hadi dalam perjalanan pertamanya pada tahun 280 H, dengan tujuan ke Sana'a. Beberapa orang dalam pasukannya mengambil buah persik dan memakannya. Ketika ia mengetahuinya, ia kembali dari tempatnya. Ketika mereka berbicara kepadanya tentang tinggal di Yaman, ia berkata bahwa ia hanya bisa seperti lampu ini. Diriwayatkan bahwa ia mengusir orang-orang yang berusaha menjarah apa yang mereka temukan."
