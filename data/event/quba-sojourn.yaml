label: { en: "The sojourn at Quba", ar: "الإقامة بقباء" }
summary:
  en: "The Prophet's stay at Quba from Monday 8 Rabi' I 1 AH: hosted by Kulthum ibn al-Hidm, he founded the mosque of Quba — the first mosque 'upon taqwa' — before riding to Medina on Friday; the length of the stay is debated (four days per Ibn Ishaq, up to 24 nights in Bukhari)."
  ar: "إقامة النبي بقباء من يوم الإثنين 8 ربيع الأول 1هـ: نزل على كلثوم بن الهدم، وأسس مسجد قباء — أول مسجد أسس على التقوى بعد النبوة — ثم ركب إلى المدينة يوم الجمعة؛ ومدة الإقامة مختلف فيها: أربعة أيام عند ابن إسحاق وإلى أربع وعشرين ليلة عند البخاري. وعند المسعودي نزل قباء على سعد بن خيثمة وأقام بها الاثنين والثلاثاء والأربعاء والخميس ثم سار يوم الجمعة ارتفاع النهار {cite:muruj-al-dhahab p. 577}. وفي وفاء الوفا: كان مسلمو المدينة يخرجون كل يوم إلى الحرة أول النهار ينتظرونه، فلما رجعوا يوماً أوْفى رجل من اليهود على أطم فأبصر القوم مبيضين فنادى «يا بني قيلة هذا جدّكم» فثار المسلمون إلى السلاح وتلقوه بظهر الحرة {cite:samhudi-wafa-al-wafa p. 256-257}"
