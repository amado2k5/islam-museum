label: { en: "The sojourn at Quba", ar: "الإقامة بقباء", es: "La estancia en Quba", fr: "Le séjour à Quba", ur: "قبا میں قیام", tr: "Quba'da ikamet", id: "Tempat tinggal di Quba" }
summary:
  en: "The Prophet's stay at Quba from Monday 8 Rabi' I 1 AH: hosted by Kulthum ibn al-Hidm, he founded the mosque of Quba — the first mosque 'upon taqwa' — before riding to Medina on Friday; the length of the stay is debated (four days per Ibn Ishaq, up to 24 nights in Bukhari)."
  ar: "إقامة النبي بقباء من يوم الإثنين 8 ربيع الأول 1هـ: نزل على كلثوم بن الهدم، وأسس مسجد قباء — أول مسجد أسس على التقوى بعد النبوة — ثم ركب إلى المدينة يوم الجمعة؛ ومدة الإقامة مختلف فيها: أربعة أيام عند ابن إسحاق وإلى أربع وعشرين ليلة عند البخاري. وعند المسعودي نزل قباء على سعد بن خيثمة وأقام بها الاثنين والثلاثاء والأربعاء والخميس ثم سار يوم الجمعة ارتفاع النهار {cite:muruj-al-dhahab p. 577}. وفي وفاء الوفا: كان مسلمو المدينة يخرجون كل يوم إلى الحرة أول النهار ينتظرونه، فلما رجعوا يوماً أوْفى رجل من اليهود على أطم فأبصر القوم مبيضين فنادى «يا بني قيلة هذا جدّكم» فثار المسلمون إلى السلاح وتلقوه بظهر الحرة {cite:samhudi-wafa-al-wafa p. 256-257}"
  es: "La estancia del Profeta en Quba desde el lunes 8 de Rabi' I 1 AH: hospedado por Kulthum ibn al-Hidm, fundó la mezquita de Quba —la primera mezquita 'sobre la piedad'— antes de partir hacia Medina el viernes; la duración de la estancia es objeto de debate (cuatro días según Ibn Ishaq, hasta 24 noches en Bukhari)."
  fr: "Le séjour du Prophète à Quba à partir du lundi 8 Rabi' 1 AH: accueilli par Kulthum ibn al-Hidm, il fonda la mosquée de Quba — la première mosquée « sur la taqwa » — avant de se rendre à Médine le vendredi; la durée du séjour est sujette à débat (quatre jours selon Ibn Ishaq, jusqu'à 24 nuits selon Bukhari)."
  ur: "پیر 8 ربیع الاول 1 ہجری سے قبلہ میں پیغمبر کا قیام: کلثوم بن الہدم کی میزبانی میں، انہوں نے جمعہ کے دن مدینہ کی طرف سوار ہونے سے پہلے - مسجد قبا - پہلی مسجد 'تقویٰ' کی بنیاد رکھی۔ قیام کی طوالت پر بحث ہے ⁦(چار دن فی ابن اسحاق، بخاری میں 24 راتوں تک)⁩۔"
  tr: "Peygamberin Kuba'daki kalışı Hicri 1 yılının Rebiü'l-Evvel ayının 8. Pazartesi günü başladı. Kulsum ibn el-Hadm ile birlikte kaldı ve peygamberliğin gelişinden sonra takva üzerine kurulan ilk cami olan Kuba Camii'ni kurdu, ardından Cuma günü Medine'ye gitti. Kalış süresi tartışmalıdır: İbn İshak'a göre dört gün, Buhari'ye göre yirmi dört gece. Mes'udi'ye göre ise Sa'd ibn Haytama ile birlikte Kuba'da kaldı ve Pazartesi, Salı, Çarşamba ve Perşembe günleri orada kaldı, ardından Cuma günü öğle vakti ayrıldı. Vefa' el-Vafa'da, Medine Müslümanlarının her günün başında onu beklemek için lav alanına çıktıkları belirtilir. Bir gün dönerken, bir Yahudi adam yüksek bir yere çıktı ve beyaz giysiler içindeki grubu gördü. \"Ey Kayla oğulları, bu sizin dedenizdir!\" diye seslendi. Müslümanlar silahlarına sarılarak lav alanının arkasında onunla karşılaştılar."
  id: "Masa tinggal Nabi di Quba dimulai pada hari Senin, tanggal 8 Rabi' al-Awwal, 1 H. Beliau tinggal bersama Kulthum ibn al-Hadm dan mendirikan Masjid Quba—masjid pertama yang didirikan atas dasar ketakwaan setelah kedatangan kenabian—kemudian beliau berangkat ke Madinah pada hari Jumat. Lamanya masa tinggal beliau masih diperdebatkan: empat hari menurut Ibnu Ishaq, dan dua puluh empat malam menurut al-Bukhari. Menurut al-Mas'udi, beliau tinggal di Quba bersama Sa'd ibn Khaythama dan menetap di sana pada hari Senin, Selasa, Rabu, dan Kamis, kemudian berangkat pada hari Jumat tengah hari. Dalam Wafa' al-Wafa, disebutkan bahwa kaum Muslimin Madinah akan pergi ke ladang lava setiap hari di awal hari untuk menunggu beliau. Suatu hari, ketika mereka kembali, seorang pria Yahudi naik ke tempat yang tinggi dan melihat rombongan tersebut mengenakan pakaian putih. Ia berseru, \"Wahai putra-putra Qayla, inilah kakekmu!\" Umat Muslim bergegas mengambil senjata mereka dan menemuinya di belakang hamparan lava."
