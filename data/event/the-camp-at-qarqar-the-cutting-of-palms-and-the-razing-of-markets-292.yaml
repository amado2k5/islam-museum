id: event/the-camp-at-qarqar-the-cutting-of-palms-and-the-razing-of-markets-292
class: event
kind: other
label:
  ar: "المعسكر في قرقر وقطع النخيل وهدم أسواق بني الحارث وأمان ابن بسطام، ص292"
  en: "The camp at Qarqar, the cutting of palms, the razing of Banu al-Harith's markets and Ibn Bustam's safe-conduct, p. 292"
  ur: "قرقر کا پڑاؤ، کھجوروں کی کٹائی، بنو حارث کے بازاروں کی مسماری اور ابن بسطام کی امان، ص292"
  es: "El campamento de Qarqar, el corte de palmeras, la destrucción de los mercados de Banu al-Harith y el salvoconducto de Ibn Bustam, pág. 292"
  fr: "Le camp de Qarqar, la coupe des palmiers, la destruction des marchés de Banu al-Harith et le sauf-conduit d'Ibn Bustam, p. 292"
summary:
  ar: "بعد أيام أمر الهادي بتهيئة الأسواق وإعداد الحديد وخرج إلى القرية فلم يخرج أحد، فنزل بقرقر قريباً من الهجر، وقطع عسكره النخيل وهدم الحصون والأسواق وغنم ما فيها بإشراف علي بن محمد، حتى استأمن ابن بسطام في آخر رجب وتحول ابن حميد إلى الهجر."
  en: "After some days al-Hadi had the markets readied and iron prepared and went out toward the village, but no one came out, so he camped at Qarqar near al-Hajar; his troops cut palms, demolished fortresses and markets and took what was in them under Ali ibn Muhammad, until Ibn Bustam asked for safety at the end of Rajab and Ibn Humayd moved to al-Hajar."
  ur: "کچھ دن بعد ہادی نے بازار تیار کروائے اور لوہا مہیا کیا اور بستی کی طرف نکلے مگر کوئی نہ نکلا، تو وہ الہجر کے قریب قرقر میں اترے؛ ان کے لشکر نے علی بن محمد کی نگرانی میں کھجوریں کاٹیں، قلعے اور بازار گرائے اور ان کا مال لیا، یہاں تک کہ رجب کے آخر میں ابن بسطام نے امان مانگی اور ابن حمید الہجر کو چلا گیا۔"
  es: "Tras unos días, al-Hadi preparó los mercados y el hierro, y salió hacia el pueblo, pero nadie salió, así que acampó en Qarqar, cerca de al-Hajar; sus tropas cortaron palmeras, demolieron fortalezas y mercados y se apoderaron de lo que había en ellos bajo el mando de Ali ibn Muhammad, hasta que Ibn Bustam pidió protección a finales de Rajab e Ibn Humayd se trasladó a al-Hajar."
  fr: "Après quelques jours, al-Hadi avait préparé les marchés et le fer, puis il se dirigea vers le village, mais personne ne vint. Il campa donc à Qarqar, près d'al-Hajar; ses troupes coupèrent des palmiers, démolirent des forteresses et des marchés et prirent ce qu'ils contenaient sous le commandement d'Ali ibn Muhammad, jusqu'à ce qu'Ibn Bustam demande refuge à la fin du mois de Rajab et qu'Ibn Humayd se déplace vers al-Hajar."
