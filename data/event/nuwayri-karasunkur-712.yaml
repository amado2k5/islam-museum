label:
  ar: "فرار كراسنكر وأقوش إلى المغول وصمود النويري، ٧١٢هـ/١٣١٢م"
  en: "The Karasunkur-Aqqush defection to the Mongols and al-Nuwayri's stand, 712/1312"
  ur: "کراسنکر اور آقوش کی منگولوں سے الحاق اور نويری کی مزاحمت، 712ھ/1312ء"
  es: "La deserción de Karasunkur-Aqqush a los mongoles y la posición de al-Nuwayri, 712/1312"
  fr: "La défection de Karasunkur-Aqqush vers les Mongols et la position d'al-Nuwayri, 712/1312"
  tr: "Krasnaker ve Aqoush Moğollara kaçarken, Al-Nuwayri direnişini sürdürdü, Hicri 712/Miladi 1312"
  id: "Krasnaker dan Aqoush melarikan diri ke Mongol, dan Al-Nuwayri tetap teguh, 712 H/1312 M"
summary:
  ar: "لما شرع السلطان الناصر، وقد كُوي بتجربة الخلع مرتين، في التخلص من الأمراء الكبار المهددين لملكه، أدرك نائب حلب شمس الدين كراسنكر أن لا خلاص له إلا في الفرار فسعى لاستمالة أمراء منهم نائب طرابلس وربما لإثارة العصيان بالشام، فزعم النويري وصلات مودة بالوالي وحاول ثنيه عن اتباع كراسنكر ويروي حديثه معه والحجج التي احتج بها؛ ومع ذلك فرّ الأمير — وكان نائب دمشق جمال الدين أقوش الأفرم من السابقين على عودة الناصر — إلى المغول وحاول حمله على اللحاق به مع أمراء طرابلس، فيحدث النويري كيف أقنعهم ألا يتبعوه إلا واحداً منهم وكيف جدّد لهم البيعة للسلطان {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}."
  en: "When al-Nasir, stung by two depositions, set about eliminating the senior amirs who could threaten his rule, the governor of Aleppo, Shams al-Din Karasunkur, saw that his only hope of survival was flight and tried to win over amirs including the na'ib of Tripoli, perhaps to provoke an insurrection in Syria. Al-Nuwayri, claiming amicable relations with the governor, sought to dissuade him from following Karasunkur — he recounts the conversation and his arguments — but the amir nevertheless fled to the Mongols together with Damascus's governor Jamal al-Din Aqqush al-Afram and tried to induce al-Nuwayri and the amirs of Tripoli to join him; al-Nuwayri relates how he persuaded all but one to stay and induced them to renew their oath of allegiance to the sultan {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}."
  ur: "جب دو بار تخت سے ہٹے الناصر نے بڑے امراء سے چھٹکارا پانے کی ٹھانی تو حلب کے نائب شمس الدین کراسنکر کو اپنی بقا صرف فرار میں نظر آئی اور اس نے طرابلس کے نائب سمیت بعض امراء کو اپنا ساتھ دینے پر ابھارا، شاید شام میں بغاوت بھڑکانے کے لیے۔ نويری، گورنر سے دوستانہ تعلق دعوی کرتے ہوئے، اسے کراسنکر کی پیروی سے روکنے لگے — گفتگو اور دلائل خود بیان کرتے ہیں — مگر امیر دمشق کے نائب جمال الدین آقوش افرم سمیت منگولوں کو فرار ہو گیا اور نويری اور طرابلس کے امراء کو ساتھ لینا چاہا؛ نويری بتاتے ہیں کہ انہوں نے سب کو — سوائے ایک کے — روک لیا اور سلطان کی بیعت تجدید کرائی {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}۔"
  es: "Cuando al-Nasir, molesto por dos deposiciones, se dispuso a eliminar a los emires de mayor rango que podían amenazar su gobierno, el gobernador de Alepo, Shams al-Din Karasunkur, vio que su única esperanza de supervivencia era huir e intentó ganarse a los emires, incluido el na'ib de Trípoli, tal vez para provocar una insurrección en Siria. Al-Nuwayri, alegando tener relaciones amistosas con el gobernador, intentó disuadirlo de seguir a Karasunkur —relata la conversación y sus argumentos—, pero el emir, no obstante, huyó a los mongoles junto con el gobernador de Damasco, Jamal al-Din Aqqush al-Afram, e intentó persuadir a al-Nuwayri y a los emires de Trípoli para que se unieran a él; al-Nuwayri relata cómo persuadió a todos menos a uno para que se quedaran y los indujo a renovar su juramento de lealtad al sultán {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}."
  fr: "Lorsque al-Nasir, piqué au vif par deux destitutions, entreprit d'éliminer les émirs les plus influents susceptibles de menacer son pouvoir, le gouverneur d'Alep, Shams al-Din Karasunkur, comprit que la fuite était son seul espoir de survie et tenta de rallier à sa cause plusieurs émirs, dont le na'ib de Tripoli, peut-être dans l'espoir de provoquer une insurrection en Syrie. Al-Nuwayri, prétendant entretenir des relations amicales avec le gouverneur, chercha à le dissuader de suivre Karasunkur – il relate la conversation et ses arguments – mais l'émir s'enfuit néanmoins chez les Mongols avec le gouverneur de Damas, Jamal al-Din Aqqush al-Afram, et tenta de convaincre al-Nuwayri et les émirs de Tripoli de le rejoindre. Al-Nuwayri raconte comment il persuada tous, sauf un, de rester et les incita à renouveler leur serment d'allégeance au sultan (voir Encyclopaedia of Islam, vol. 8, p. 158)."
  tr: "İki kez tahttan indirilmenin acısını yaşamış olan Sultan el-Nasır, krallığını tehdit eden kıdemli prenslerden kurtulmaya başlayınca, Halep valisi Şems el-Din Krasnaker, kaçmaktan başka kurtuluş yolu olmadığını anladı. Bu yüzden, Trablus valisi de dahil olmak üzere prensleri kazanmaya ve belki de Levant'ta isyan çıkarmaya çalıştı. El-Nuwayri, valiyle dostane ilişkileri olduğunu iddia etti ve onu Krasnaker'ı takip etmekten vazgeçirmeye çalıştı. Onunla yaptığı konuşmayı ve kullandığı argümanları anlatıyor. Bununla birlikte, prens (ve Şam valisi Cemal el-Din Akuş el-Afram, El-Nasır'ın dönüşünden önce gelenler arasındaydı) Moğollara kaçtı ve onu Trablus prensleriyle birlikte kendisine katılmaya ikna etmeye çalıştı. El-Nuwayri, içlerinden biri hariç diğerlerini nasıl ikna ettiğini ve Sultan'a olan bağlılıklarını nasıl yenilediğini anlatıyor. {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}."
  id: "Ketika Sultan al-Nasir, yang telah terluka oleh pengalaman digulingkan dua kali, mulai menyingkirkan para pangeran senior yang mengancam kerajaannya, wakil Aleppo, Shams al-Din Krasnaker, menyadari bahwa tidak ada jalan keluar baginya kecuali melarikan diri. Maka ia berusaha untuk memenangkan hati para pangeran, termasuk wakil Tripoli, dan mungkin untuk menghasut pemberontakan di Levant. Al-Nuwayri mengaku memiliki hubungan baik dengan gubernur tersebut dan mencoba membujuknya agar tidak mengikuti Krasnaker. Ia menceritakan percakapannya dengan Krasnaker dan argumen yang digunakannya. Meskipun demikian, pangeran tersebut—dan wakil Damaskus, Jamal al-Din Aqoush al-Afram, termasuk di antara mereka yang mendahului kembalinya al-Nasir—melarikan diri ke Mongol dan mencoba membujuknya untuk bergabung dengannya bersama para pangeran Tripoli. Al-Nuwayri menceritakan bagaimana ia meyakinkan mereka untuk tidak mengikutinya kecuali satu orang dari mereka dan bagaimana ia memperbarui kesetiaan mereka kepada Sultan. {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}."
