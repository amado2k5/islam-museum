summary:
  ar: "قدم خالد بأكيدر على النبي، فحقن النبي دمه وصالحه على الجزية ثم خلّى سبيله، فرجع إلى قريته."
  en: Khalid brought Ukaydir to the Prophet, who spared his blood, made peace with him on payment of the jizya, and released him; he returned to his village.
  es: "Khalid llevó a Ukaydir ante el Profeta, quien le perdonó la vida, hizo las paces con él a cambio del pago de la jizya y lo liberó; Ukaydir regresó a su aldea."
  fr: "Khalid amena Ukaydir au Prophète, qui lui épargna son sang, fit la paix avec lui en échange du paiement de la jizya, et le libéra; il retourna dans son village."
  ur: "خالد عقیدیر کو نبی کے پاس لایا، جس نے اس کا خون بہایا، جزیہ کی ادائیگی پر اس سے صلح کی اور اسے رہا کر دیا۔ وہ اپنے گاؤں واپس آیا۔"
