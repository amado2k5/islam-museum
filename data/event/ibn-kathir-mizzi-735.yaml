id: event/ibn-kathir-mizzi-735
class: event
kind: gathering
label:
  ar: "لزوم ابن كثير الحافظ المزي ومصاهرته، نحو ٧٣٥هـ"
  en: "Ibn Kathir keeps close to the hafiz al-Mizzi and marries his daughter, about 735/1335"
  ur: "ابن کثیر کا حافظ مزی کے ہاں تلمذ اور ان کی بیٹی سے نکاح، تقریباً 735ھ/1335ء"
  es: "Ibn Kathir se mantuvo cercano al hafiz al-Mizzi y se casó con su hija, alrededor del año 735/1335."
  fr: "Ibn Kathir se lia d'amitié avec le hafiz al-Mizzi et épousa sa fille vers 735/1335."
  tr: "İbn Kathir'in El-Hafız El-Mizzi ile ilişkisi ve onunla evliliği, Hicri 735 civarında."
  id: "Hubungan Ibn Kathir dengan Al-Hafiz Al-Mizzi dan pernikahannya dengan beliau, sekitar tahun 735 Hijriah."
summary:
  ar: "لازم ابن كثير شيخَه حافظَ العصر جمال الدين أبا الحجاج المزي بدمشق وقرأ عليه «تهذيب الكمال» وصاهره على ابنته {cite:durar-kamina-jil-1993 1/374}، وكان صهره على ابنته زينب {cite:tabaqat-shafiiyya-subki p. 394}، واستمرت ملازمته إلى وفاة شيخه سنة ٧٤٢هـ."
  en: "Ibn Kathir stayed close to his shaykh, the hafiz of the age Jamal al-Din Abu l-Hajjaj al-Mizzi, at Damascus, read the Tahdhib al-Kamal to him and married his daughter {cite:durar-kamina-jil-1993 1/374} — his wife being al-Mizzi's daughter Zaynab {cite:tabaqat-shafiiyya-subki p. 394}; the companionship lasted until al-Mizzi's death in 742."
  ur: "ابن کثیر اپنے شیخ، عصر کے حافظ جمال الدین ابوالحجاج مزی کے ہاں دمشق میں تلمذ اختیار کیا، ان پر «تہذیب الکمال» پڑھی اور ان کی بیٹی سے نکاح کیا {cite:durar-kamina-jil-1993 1/374} — ان کی بیوی مزی کی بیٹی زینب تھیں {cite:tabaqat-shafiiyya-subki p. 394}؛ یہ رفاقت 742ھ میں مزی کی وفات تک رہی۔"
  es: "Ibn Kathir permaneció cerca de su shaykh, el hafiz de la época Jamal al-Din Abu l-Hajjaj al-Mizzi, en Damasco, le leyó el Tahdhib al-Kamal y se casó con su hija {cita:durar-kamina-jil-1993 1/374}, siendo su esposa la hija de al-Mizzi, Zaynab {cita:tabaqat-shafiiyya-subki p. 394}; la compañía duró hasta la muerte de al-Mizzi en 742."
  fr: "Ibn Kathir resta près de son shaykh, le hafiz de l'époque Jamal al-Din Abu l-Hajjaj al-Mizzi, à Damas, lui lut le Tahdhib al-Kamal et épousa sa fille {cite: durar-kamina-jil-1993 1/374} — sa femme étant la fille d'al-Mizzi, Zaynab {cite: tabaqat-shafiiyya-subki p. 394}; la compagnie dura jusqu'à la mort d'al-Mizzi en 742."
  tr: "İbn Kathir, dönemin hafızı Cemaleddin Ebu el-Haccac el-Mizzi şeyhinin yanında Şam'da kaldı ve ona \"Tahdhib el-Kamal\"ı okudu; kızını onunla evlendirdi {cite:durar-kamina-jil-1993 1/374} ve kızı Zeynep'i onunla evlendirdi {cite:tabaqat-shafiiyya-subki s. 394} ve şeyhinin 742 Hicri yılında vefatına kadar onunla birlikte kaldı."
  id: "Ibn Kathir tinggal bersama gurunya, Hafiz pada zamannya, Jamal al-Din Abu al-Hajjaj al-Mizzi, di Damaskus, dan membacakan “Tahdhib al-Kamal” kepadanya, dan ia menikahkan putrinya dengan gurunya {cite:durar-kamina-jil-1993 1/374}, dan ia menikahkan putrinya Zaynab {cite:tabaqat-shafiiyya-subki p. 394}, dan masa tinggalnya bersama gurunya berlanjut hingga wafatnya gurunya pada tahun 742 H."
