label: { ar: "فتح مصر والإسكندرية", en: "Conquest of Egypt and Alexandria", es: "Conquista de Egipto y Alejandría", fr: "Conquête de l'Égypte et d'Alexandrie", ur: "مصر اور اسکندریہ کی فتح" }
summary:
  ar: "ذكرها الطبري في أخبار سنة عشرين، مع خلاف في تاريخها. فابن إسحاق يذكر سنة عشرين، وسيف يذكر سنة ست عشرة {cite:tabari-tarikh-abu-al-fadl j.4 p.102} {cite:tabari-tarikh-abu-al-fadl j.4 p.104}. والمذكور في فهرس الجزء: «ذكر الخبر عن فتح مصر والإسكندرية» {cite:tabari-tarikh-abu-al-fadl j.4 p.578}. وعند البلاذري: حاصر عمرو بن العاص قيسارية فلما انصرف الناس من حرب اليرموك استخلف عليها ابنه ومضى إلى مصر من تلقاء نفسه في ثلاثة آلاف وخمسمائة — وقيل كتب إليه عمر بالشخوص — فنزل العريش ثم أتى الفرما فحارب مستمّديها وحوى عسكرهم ثم نزل جنان الريحان وقد خندق أهل الفسطاط، وكانت المدينة تسمى اليونة فسمّاها المسلمون فسطاطاً لقولهم هذا فسطاط القوم ومجمعهم — أو لفسطاط ضربه عمرو؛ وورد عليه الزبير بن العوّام في عشرة آلاف وقيل اثني عشر ألفاً فيهم خارجة بن حذافة العدوي وعمير بن وهب الجمحي فقاتل من وجه وعمرو من وجه ثم أتى الزبير بسُلَّم فصعد مجرداً سيفه وكبّر فكبّر المسلمون واتبعوه ففُتح الحصن عنوة فاستباح المسلمون ما فيه وأقرّ عمر أهله أهل ذمة ووضع الجزية في الرقاب والخراج في الأرض؛ واختطّ الزبير بمصر والإسكندرية خِطتين وبنى داره المعروفة وبقي سلّمه بمصر. وفي طريقة الفتح خلاف: قوم قالوا فُتحت عنوة وآخرون صلحاً — والأثلج عند عبد الله بن عمرو أن أباه قاتل أهل اليونة ففتحها قهراً ثم صالحه ملكها على حكم الشام — ديناران على الحالم إلا فقيراً، ودينار وثلاثة أرادب طعاماً على الجريب، وثلاثة أرادب حنطة وقسط زيت وقسط عسل وقسط خل لكل ذي أرض رزقاً للمسلمين يجمع في دار الرزق، وقبطيّ صوف وبرنس أو عمامة وسراويل وخفّين لكل مسلم في كل عام أو عدلها ثوباً قبطياً، وشرط لهم أن لا تباع نساؤهم وأبناؤهم ولا يُسبوا وتُقرّ أموالهم وكنوزهم في أيديهم — فصالح ملك اليونة عن جميع أهل مصر على مثله. وفي إسناد آخر «فتحنا مصر بغير عهد»، وخطب عمرو نفسه أن لا عهد لأحد من القبط عليه إلا أهل أنطابلس، وكتب عمر بن عبد العزيز إلى عامله حيان بن شريح أن مصر فُتحت عنوة بغير عهد ولا عقد، وقال عروة بن الزبير — أقام بها سبع سنين — إنما فتحها عمرو بصلح وعهد وشيء مفروض، وشهد عقبة بن عامر الجهني أن لأهل مصر عهداً وعقداً: آمنون على أموالهم ودمائهم ونسائهم وأولادهم لا يباع منهم أحد وخراج لا يزاد عليهم ويدفع عنهم خوف عدوهم."
  en: "Tabari records it under year 20 with dating dispute: Ibn Ishaq year 20, Sayf year 16 {cite:tabari-tarikh-abu-al-fadl j.4 p.102} {cite:tabari-tarikh-abu-al-fadl j.4 p.104}, heading 'the report of the conquest of Egypt and Alexandria' {cite:tabari-tarikh-abu-al-fadl j.4 p.578}. In al-Baladhuri: Amr ibn al-As was besieging Caesarea when the armies returned from Yarmuk; leaving his son over it he marched on Egypt on his own initiative with three thousand five hundred — or, some say, on Umar's written order — camping at al-Arish, then al-Farama where he fought its defenders and seized their camp, then pitched at Jinan al-Rayhan while Fustat's people ditched — the city being called al-Yuna, renamed al-Fustat by the Muslims as 'the people's encampment and gathering', or for the tent Amr pitched; al-Zubayr ibn al-Awwam joined him with ten thousand — or twelve, among them Kharija ibn Hudhafa al-Adawi and Umayr ibn Wahb al-Jumahi — fighting from one face while Amr fought from another, until Zubayr brought a ladder, mounted the fortress bare-sworded crying takbir, the Muslims echoing and following, and the fortress fell by force; Umar established its people as dhimma, jizya on their necks and kharaj on their land; Zubayr laid khittas at Misr and Alexandria, built his known house, and his ladder stayed in Egypt. On the manner of the conquest they differed: some said by force, others by treaty — the soundest in Abdallah ibn Amr's account being that his father fought al-Yuna's folk and took it by overpowering, then its king compounded with him on Syria's terms — two dinars on every free male save the poor, a dinar and three ardabbs of grain on the jarib, three ardabbs of wheat plus a qist each of oil, honey and vinegar per landholder as the Muslims' provision gathered in Dar al-Rizq, and for every Muslim yearly a wool jubba, a burnus or turban, drawers and boots or its worth in Coptic cloth — covenanting that their women and children be neither sold nor enslaved and their wealth and treasures remain theirs; al-Yuna's king then compounded for all Egypt on the same. Another chain has 'we opened Egypt without covenant', Amr himself preaching that no Copt held a pact with him save Antabulus's people; Umar ibn Abd al-Aziz wrote his governor Hayyan ibn Shurayh that Egypt was conquered by force without covenant or contract; Urwa ibn al-Zubayr — who dwelt there seven years — held Amr conquered it only by treaty, covenant and fixed levy; and Uqba ibn Amir al-Juhani testified that Egypt's people hold covenant and contract: secure in wealth, blood, women and children, none of them sold, a kharaj never to be increased, and protection from their enemy's fear."
  es: "Tabari lo registra bajo el año 20 con disputa de datación: Ibn Ishaq año 20, Sayf año 16 {cite:tabari-tarikh-abu-al-fadl j.4 p.102} {cite:tabari-tarikh-abu-al-fadl j.4 p.104}, encabezado 'el informe de la conquista de Egipto y Alejandría' {cite:tabari-tarikh-abu-al-fadl j.4 p.578}. En al-Baladhuri: Amr ibn al-As estaba sitiando Cesarea cuando los ejércitos regresaron de Yarmuk; Dejando a su hijo al mando, marchó sobre Egipto por iniciativa propia con tres mil quinientos hombres —o, según algunos, por orden escrita de Umar— acampando en al-Arish, luego en al-Farama, donde luchó contra sus defensores y se apoderó de su campamento, luego se instaló en Jinan al-Rayhan mientras la gente de Fustat huía —la ciudad se llamaba al-Yuna, rebautizada como al-Fustat por los musulmanes como 'el campamento y reunión del pueblo', o por la tienda que Amr instaló; al-Zubayr ibn al-Awwam se unió a él con diez mil —o doce, entre ellos Kharija ibn Hudhafa al-Adawi y Umayr ibn Wahb al-Jumahi— luchando por un lado mientras Amr luchaba por otro, hasta que Zubayr trajo una escalera, subió a la fortaleza desenvainado gritando takbir, los musulmanes repitieron y lo siguieron, y la fortaleza cayó por la fuerza; Umar estableció a su gente como dhimma, jizya sobre sus cuellos y kharaj sobre sus tierras; Zubayr estableció khittas en Misr y Alejandría, construyó su casa conocida y su escalera permaneció en Egipto. Sobre la manera de la conquista diferían: algunos decían por la fuerza, otros por tratado; el más sólido en el relato de Abdallah ibn Amr es que su padre luchó contra la gente de al-Yuna y la tomó por la fuerza, luego su rey llegó a un acuerdo con él en los términos de Siria: dos dinares por cada varón libre excepto el pobre, un dinar y tres ardabbs de grano por el jarib, tres ardabbs de trigo más un qist de cada uno de aceite, miel y vinagre por terrateniente como provisión de los musulmanes reunida en Dar al-Rizq, y para cada musulmán anualmente una jubba de lana, un burnus o turbante, calzones y botas o su valor en tela copta, comprometiéndose a que sus mujeres y niños no fueran vendidos ni esclavizados y que su riqueza y tesoros permanecieran suyos; El rey de al-Yuna entonces llegó a un acuerdo para todo Egipto sobre el mismo tema. Otra cadena de transmisión dice: \"Abrimos Egipto sin pacto\", el mismo Amr predicando que ningún copto tenía un pacto con él salvo el pueblo de Antabulus; Umar ibn Abd al-Aziz escribió a su gobernador Hayyan ibn Shurayh que Egipto fue conquistado por la fuerza sin pacto ni contrato; Urwa ibn al-Zubayr —quien vivió allí siete años— sostuvo que Amr lo conquistó solo mediante tratado, pacto y tributo fijo; y Uqba ibn Amir al-Juhani testificó que el pueblo de Egipto tiene pacto y contrato: seguro en riqueza, sangre, mujeres y niños, ninguno de ellos vendido, un kharaj que nunca aumentará y protección del temor de su enemigo."
  fr: "Tabari le mentionne sous l'an 20 avec une divergence de datation: Ibn Ishaq année 20, Sayf année 16 {cite:tabari-tarikh-abu-al-fadl j.4 p.102} {cite:tabari-tarikh-abu-al-fadl j.4 p.104}, sous le titre « le rapport de la conquête de l'Égypte et d'Alexandrie » {cite:tabari-tarikh-abu-al-fadl j.4 p.578}. Dans al-Baladhuri: Amr ibn al-As assiégeait Césarée lorsque les armées revinrent de Yarmouk; Laissant son fils aux commandes, il marcha sur l'Égypte de sa propre initiative avec trois mille cinq cents hommes — ou, selon certains, sur ordre écrit d'Umar — campant à al-Arish, puis à al-Farama où il combattit les défenseurs et s'empara de leur camp, puis s'installa à Jinan al-Rayhan tandis que les habitants de Fustat s'enfuyaient — la ville étant appelée al-Yuna, rebaptisée al-Fustat par les musulmans comme « le campement et le rassemblement du peuple », ou en référence à la tente dressée par Amr; al-Zubayr ibn al-Awwam le rejoignit avec dix mille hommes — ou douze, parmi lesquels Kharija ibn Hudhafa al-Adawi et Umayr ibn Wahb al-Jumahi — combattant d'un côté tandis qu'Amr combattait de l'autre, jusqu'à ce que Zubayr apporte une échelle, monte sur la forteresse à l'épée nue en criant takbir, les musulmans reprenant en chœur et suivant, et que la forteresse tombe par la force; Umar établit le peuple d'al-Yuna sous le régime de la dhimma, prévoyant la jizya et le kharaj sur leurs terres; Zubayr établit des khittas à Misr et à Alexandrie, y construisit sa maison et laissa son influence en Égypte. Les versions divergent quant à la manière dont la conquête eut lieu: certains par la force, d'autres par traité. Le récit le plus plausible, celui d'Abdallah ibn Amr, raconte que son père combattit les habitants d'al-Yuna et s'empara du territoire par la force, puis que son roi conclut un accord avec lui aux conditions de la Syrie: deux dinars par homme libre, à l'exception des pauvres; un dinar et trois ardabs de grain par propriétaire terrien; trois ardabs de blé, plus un qist d'huile, de miel et de vinaigre par propriétaire, constituant ainsi les provisions des musulmans rassemblées à Dar al-Rizq; et pour chaque musulman, chaque année, une djellaba de laine, un burnous ou un turban, des caleçons et des bottes, ou leur équivalent en tissu copte. Ils s'engageaient à ce que leurs femmes et leurs enfants ne soient ni vendus ni réduits en esclavage et que leurs richesses et leurs trésors leur restent acquis. Le roi d'al-Yuna étendit ensuite ce principe à toute l'Égypte. Une autre chaîne de transmission rapporte: « Nous avons conquis l'Égypte sans alliance », Amr lui-même affirmant qu'aucun Copte n'avait conclu de pacte avec lui, à l'exception du peuple d'Antabulus. Umar ibn Abd al-Aziz écrivit à son gouverneur Hayyan ibn Shurayh que l'Égypte avait été conquise par la force, sans alliance ni contrat. Urwa ibn al-Zubayr, qui y résida sept ans, soutint qu'Amr ne l'avait conquise que par traité, alliance et levée de fonds fixe. Enfin, Uqba ibn Amir al-Juhani témoigna que le peuple d'Égypte était lié par une alliance et un contrat: la sécurité de ses biens, de sa famille, de ses femmes et de ses enfants, aucun d'eux n'étant vendu, un kharaj jamais augmenté, et la protection contre la crainte de ses ennemis."
  ur: "طبری نے اسے تاریخ کے تنازعہ کے ساتھ سال 20 کے تحت درج کیا ہے: ابن اسحاق سال 20، سیف سال 16 {حوالہ: طبری-تاریخ-ابو الفضل ج.4 ص.102} {حوالہ: طبری-تاریخ-ابو الفضل ج.4 ص.104}، جس کا عنوان 'مصر کی فتح اور اسکندریہ کی رپورٹ' ہے۔ {حوالہ: طبری-تاریخ-ابو الفضل ج4 ص578}۔ البلادوری میں ہے: عمرو بن العاص قیصریہ کا محاصرہ کر رہے تھے جب لشکر یرموک سے واپس آئے۔ اپنے بیٹے کو اس پر چھوڑ کر اس نے اپنے طور پر تین ہزار پانچ سو کے ساتھ مصر کی طرف کوچ کیا - یا بعض کہتے ہیں کہ عمر کے تحریری حکم پر - العریش میں ڈیرہ ڈالا، پھر الفرامہ جہاں اس نے اس کے محافظوں سے لڑا اور ان کے کیمپ پر قبضہ کیا، پھر جنان الریحان میں ڈیرے ڈالے جب کہ فوستات کے لوگوں نے کھود لیا - اس شہر کو ال یونا کہا جاتا ہے، اور مسلمانوں نے اس شہر کو النساء کہا۔ اجتماع، یا عمرو کے خیمہ کے لیے۔ زبیر بن العوام دس ہزار یا بارہ لوگوں کے ساتھ اس کے ساتھ شامل ہوئے، ان میں سے خارجہ بن حذافہ العدوی اور عمیر بن وھب الجماحی ایک چہرے سے لڑتے رہے جبکہ عمرو دوسرے سے لڑتے رہے، یہاں تک کہ زبیر نے سیڑھی لا کر قلعہ پر چڑھا دیا، اور مسلمانوں کے پیچھے تلواریں چلاتے ہوئے ان کا پیچھا کیا۔ طاقت عمر نے اپنے لوگوں کو ذم، ان کی گردنوں پر جزیہ اور ان کی سرزمین پر خرج کے طور پر قائم کیا۔ زبیر نے مصر اور اسکندریہ میں کھٹّے لگائے، اپنا معروف گھر بنایا، اور اس کی سیڑھی مصر میں ٹھہری۔ فتح کے طریقے پر ان کا اختلاف تھا: بعض نے زبردستی اور بعض نے معاہدہ کے ذریعہ کہا - عبداللہ بن عمرو کے بیان میں سب سے زیادہ صحیح یہ ہے کہ اس کے والد نے یونا کی قوم سے جنگ کی اور اسے غلبہ حاصل کر کے لے لیا، پھر اس کے بادشاہ نے شام کی شرائط پر اس کے ساتھ اتحاد کیا - غریبوں کو چھوڑ کر ہر آزاد مرد پر دو دینار، ایک دینار اور تین جبر کے حساب سے۔ گندم کے علاوہ تیل، شہد اور سرکہ کی ایک ایک قِسٹ فی زمیندار جیسا کہ مسلمانوں کا رزق دار الرزق میں جمع ہوتا ہے، اور ہر مسلمان کے لیے سالانہ ایک اونی جبہ، ایک برنس یا پگڑی، دراز اور جوتے یا اس کی قیمت قبطی کپڑوں میں - یہ عہد کہ ان کی عورتوں اور بچوں کو نہ بیچا جائے گا اور نہ ہی ان کے مال کو غلام بنایا جائے گا۔ اس کے بعد الیونا کے بادشاہ نے تمام مصر کو اسی پر اکٹھا کیا۔ ایک اور سلسلہ یہ ہے کہ 'ہم نے مصر کو بغیر عہد کے کھول دیا'، عمرو نے خود تبلیغ کی کہ انتابلوس کے لوگوں کے علاوہ کسی قبطی نے اس کے ساتھ معاہدہ نہیں کیا۔ عمر بن عبد العزیز نے اپنے گورنر حیان ابن شریح کو لکھا کہ مصر کو بغیر کسی عہد یا معاہدے کے طاقت سے فتح کیا گیا تھا۔ عروہ بن الزبیر - جو وہاں سات سال مقیم رہے - عمرو نے اسے صرف معاہدہ، عہد اور مقررہ محصول کے ذریعے فتح کیا۔ اور عقبہ بن عامر الجہنی نے گواہی دی کہ مصر کے لوگ عہد و پیمان رکھتے ہیں: مال و دولت، خون، عورتوں اور بچوں میں محفوظ، ان میں سے کوئی بھی فروخت نہ کیا جائے، خزرج میں اضافہ نہ کیا جائے، اور اپنے دشمن کے خوف سے تحفظ۔"
