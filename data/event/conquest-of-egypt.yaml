label: { ar: "فتح مصر والإسكندرية", en: "Conquest of Egypt and Alexandria" }
summary:
  ar: "ذكرها الطبري في أخبار سنة عشرين، مع خلاف في تاريخها. فابن إسحاق يذكر سنة عشرين، وسيف يذكر سنة ست عشرة {cite:tabari-tarikh-abu-al-fadl j.4 p.102} {cite:tabari-tarikh-abu-al-fadl j.4 p.104}. والمذكور في فهرس الجزء: «ذكر الخبر عن فتح مصر والإسكندرية» {cite:tabari-tarikh-abu-al-fadl j.4 p.578}. وعند البلاذري: حاصر عمرو بن العاص قيسارية فلما انصرف الناس من حرب اليرموك استخلف عليها ابنه ومضى إلى مصر من تلقاء نفسه في ثلاثة آلاف وخمسمائة — وقيل كتب إليه عمر بالشخوص — فنزل العريش ثم أتى الفرما فحارب مستمّديها وحوى عسكرهم ثم نزل جنان الريحان وقد خندق أهل الفسطاط، وكانت المدينة تسمى اليونة فسمّاها المسلمون فسطاطاً لقولهم هذا فسطاط القوم ومجمعهم — أو لفسطاط ضربه عمرو؛ وورد عليه الزبير بن العوّام في عشرة آلاف وقيل اثني عشر ألفاً فيهم خارجة بن حذافة العدوي وعمير بن وهب الجمحي فقاتل من وجه وعمرو من وجه ثم أتى الزبير بسُلَّم فصعد مجرداً سيفه وكبّر فكبّر المسلمون واتبعوه ففُتح الحصن عنوة فاستباح المسلمون ما فيه وأقرّ عمر أهله أهل ذمة ووضع الجزية في الرقاب والخراج في الأرض؛ واختطّ الزبير بمصر والإسكندرية خِطتين وبنى داره المعروفة وبقي سلّمه بمصر. وفي طريقة الفتح خلاف: قوم قالوا فُتحت عنوة وآخرون صلحاً — والأثلج عند عبد الله بن عمرو أن أباه قاتل أهل اليونة ففتحها قهراً ثم صالحه ملكها على حكم الشام — ديناران على الحالم إلا فقيراً، ودينار وثلاثة أرادب طعاماً على الجريب، وثلاثة أرادب حنطة وقسط زيت وقسط عسل وقسط خل لكل ذي أرض رزقاً للمسلمين يجمع في دار الرزق، وقبطيّ صوف وبرنس أو عمامة وسراويل وخفّين لكل مسلم في كل عام أو عدلها ثوباً قبطياً، وشرط لهم أن لا تباع نساؤهم وأبناؤهم ولا يُسبوا وتُقرّ أموالهم وكنوزهم في أيديهم — فصالح ملك اليونة عن جميع أهل مصر على مثله. وفي إسناد آخر «فتحنا مصر بغير عهد»، وخطب عمرو نفسه أن لا عهد لأحد من القبط عليه إلا أهل أنطابلس، وكتب عمر بن عبد العزيز إلى عامله حيان بن شريح أن مصر فُتحت عنوة بغير عهد ولا عقد، وقال عروة بن الزبير — أقام بها سبع سنين — إنما فتحها عمرو بصلح وعهد وشيء مفروض، وشهد عقبة بن عامر الجهني أن لأهل مصر عهداً وعقداً: آمنون على أموالهم ودمائهم ونسائهم وأولادهم لا يباع منهم أحد وخراج لا يزاد عليهم ويدفع عنهم خوف عدوهم."
  en: "Tabari records it under year 20 with dating dispute: Ibn Ishaq year 20, Sayf year 16 {cite:tabari-tarikh-abu-al-fadl j.4 p.102} {cite:tabari-tarikh-abu-al-fadl j.4 p.104}, heading 'the report of the conquest of Egypt and Alexandria' {cite:tabari-tarikh-abu-al-fadl j.4 p.578}. In al-Baladhuri: Amr ibn al-As was besieging Caesarea when the armies returned from Yarmuk; leaving his son over it he marched on Egypt on his own initiative with three thousand five hundred — or, some say, on Umar's written order — camping at al-Arish, then al-Farama where he fought its defenders and seized their camp, then pitched at Jinan al-Rayhan while Fustat's people ditched — the city being called al-Yuna, renamed al-Fustat by the Muslims as 'the people's encampment and gathering', or for the tent Amr pitched; al-Zubayr ibn al-Awwam joined him with ten thousand — or twelve, among them Kharija ibn Hudhafa al-Adawi and Umayr ibn Wahb al-Jumahi — fighting from one face while Amr fought from another, until Zubayr brought a ladder, mounted the fortress bare-sworded crying takbir, the Muslims echoing and following, and the fortress fell by force; Umar established its people as dhimma, jizya on their necks and kharaj on their land; Zubayr laid khittas at Misr and Alexandria, built his known house, and his ladder stayed in Egypt. On the manner of the conquest they differed: some said by force, others by treaty — the soundest in Abdallah ibn Amr's account being that his father fought al-Yuna's folk and took it by overpowering, then its king compounded with him on Syria's terms — two dinars on every free male save the poor, a dinar and three ardabbs of grain on the jarib, three ardabbs of wheat plus a qist each of oil, honey and vinegar per landholder as the Muslims' provision gathered in Dar al-Rizq, and for every Muslim yearly a wool jubba, a burnus or turban, drawers and boots or its worth in Coptic cloth — covenanting that their women and children be neither sold nor enslaved and their wealth and treasures remain theirs; al-Yuna's king then compounded for all Egypt on the same. Another chain has 'we opened Egypt without covenant', Amr himself preaching that no Copt held a pact with him save Antabulus's people; Umar ibn Abd al-Aziz wrote his governor Hayyan ibn Shurayh that Egypt was conquered by force without covenant or contract; Urwa ibn al-Zubayr — who dwelt there seven years — held Amr conquered it only by treaty, covenant and fixed levy; and Uqba ibn Amir al-Juhani testified that Egypt's people hold covenant and contract: secure in wealth, blood, women and children, none of them sold, a kharaj never to be increased, and protection from their enemy's fear."
