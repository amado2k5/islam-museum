id: "event/the-akil-side-deceive-al-qasims-army-with-an-offer-of-twenty-hostages-in-326-ah"
class: event
kind: other
label:
  ar: "يخدع الأكيليون عسكر القاسم بعرض عشرين حبيسا، ويتفرق عسكره، سنة 326هـ، ص412"
  en: "The Akil side deceive al-Qasim's army with an offer of twenty captives, and his army scatters, in 326 AH, p. 412"
  ur: "اکیلی قاسم کے لشکر کو بیس قیدیوں کی پیشکش سے دھوکا دیتے ہیں اور اس کا لشکر بکھر جاتا ہے، 326ھ، ص412"
  es: "El bando de Akil engaña al ejército de al-Qasim con la oferta de veinte cautivos, y su ejército se dispersa, en el año 326 de la Hégira, pág. 412."
  fr: "Les partisans d'Akil trompent l'armée d'al-Qasim en lui offrant vingt captifs, et son armée se disperse (326 AH, p. 412)."
summary:
  ar: "يراسل الأكيليون القاسم بأنهم يسلمون إليه عشرين حبيسا، وينصرف المسلم عن البلد، ويطلبون من العشائر العون، فيجيبهم القاسم، فيتفرق من معه، ثم يصابحونه الحرب."
  en: "The Akil side write to al-Qasim that they will hand over twenty captives and that Muslim will leave the town, and they ask the tribes for help. He agrees, his companions scatter, and they then attack him at dawn."
  ur: "اکیلی قاسم کو لکھتے ہیں کہ وہ بیس قیدی حوالے کریں گے اور مسلم شہر چھوڑ دے گا، اور وہ قبیلوں سے مدد مانگتے ہیں۔ قاسم مان جاتا ہے، اس کے ساتھی بکھر جاتے ہیں، اور پھر صبح کے وقت ان پر حملہ کر دیا جاتا ہے۔"
  es: "Los Akil le escriben a al-Qasim prometiéndole que le entregarán veinte cautivos y que Muslim abandonará la ciudad, y le piden ayuda a las tribus. Él acepta, sus compañeros se dispersan y lo atacan al amanecer."
  fr: "Les Akils écrivent à al-Qasim pour lui annoncer qu'ils lui livreront vingt captifs et que Muslim quittera la ville. Ils demandent l'aide des tribus. Il accepte, ses compagnons se dispersent, et ils l'attaquent à l'aube."
