id: event/hafsid-independence-627
class: event
kind: founding
label:
  ar: خلع أبي زكريا الحفصي طاعة الموحدين
  en: Abu Zakariya al-Hafsi's break with the Almohads
  es: "La ruptura de Abu Zakariya al-Hafsi con los almohades"
  fr: "La rupture d'Abu Zakariya al-Hafsi avec les Almohades"
  ur: "ابو زکریا الحفصی کا المحدث کے ساتھ وقفہ"
summary:
  ar: سنة 627هـ استبد الأمير أبو زكريا بن أبي محمد ابن الشيخ أبي حفص بإفريقية وخلع طاعة الخليفة المأمون بعد أن محا الأخير اسم المهدي من السكة والخطبة، فقامت الدولة الحفصية بتونس على يد الحفصيين الهنتاتيين أحفاد كبير مشيخة الموحدين.
  en: In 627 AH the amir Abu Zakariya, grandson of the shaykh Abu Hafs, seized Ifriqiya and threw off the caliph al-Ma'mun's allegiance after the latter had erased the Mahdi's name from coinage and khutba — founding the Hafsid state at Tunis under the Hintati grandsons of the Almohads' greatest shaykh.
  es: "En el año 627 de la Hégira, el emir Abu Zakariya, nieto del jeque Abu Hafs, se apoderó de Ifriqiya y rompió la lealtad del califa al-Ma'mun después de que este último hubiera borrado el nombre del Mahdi de las monedas y los sermones, fundando así el estado hafsí en Túnez bajo el mando de los nietos hintatíes del jeque más importante de los almohades."
  fr: "En 627 AH, l'émir Abu Zakariya, petit-fils du cheikh Abu Hafs, s'empara d'Ifriqiya et rompit l'allégeance au calife al-Ma'mun après que ce dernier eut effacé le nom du Mahdi des pièces de monnaie et des sermons, fondant ainsi l'État hafside à Tunis sous les petits-fils Hintati du plus grand cheikh almohade."
  ur: "627 ہجری میں شیخ ابو حفص کے پوتے امیر ابو زکریا نے عفریقیہ پر قبضہ کر لیا اور خلیفہ المامون کی بیعت کو اس وقت ختم کر دیا جب بعد میں مہدی کا نام سکہ اور خطبہ سے مٹا دیا گیا تھا - جس نے حفصید ریاست کی بنیاد تیونس میں عظیم الشان حنطی الشہد المومنین کے تحت قائم کی۔"
