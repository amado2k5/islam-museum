label:
  ar: خلع أبي زكريا الحفصي طاعة الموحدين
  en: Abu Zakariya al-Hafsi's break with the Almohads
summary:
  ar: سنة 627هـ استبد الأمير أبو زكريا بن أبي محمد ابن الشيخ أبي حفص بإفريقية وخلع طاعة الخليفة المأمون بعد أن محا الأخير اسم المهدي من السكة والخطبة، فقامت الدولة الحفصية بتونس على يد الحفصيين الهنتاتيين أحفاد كبير مشيخة الموحدين.
  en: In 627 AH the amir Abu Zakariya, grandson of the shaykh Abu Hafs, seized Ifriqiya and threw off the caliph al-Ma'mun's allegiance after the latter had erased the Mahdi's name from coinage and khutba — founding the Hafsid state at Tunis under the Hintati grandsons of the Almohads' greatest shaykh.
