label:
  ar: "وفاة الشيخ المفيد ورياسة الشريف المرتضى، ٤١٣هـ"
  en: "Death of al-Shaykh al-Mufid and al-Sharif al-Murtada's succession, 413/1022"
  ur: "شیخ مفید کی وفات اور شریف مرتضیٰ کی قیادت، 413ھ/1022ء"
summary:
  ar: "توفي الشيخ المفيد سنة ٤١٣هـ/١٠٢٢م، فتولى بعده تلميذه الشريف المرتضى علم الهدى رئاسة الإمامية بالعاصمة، وصار الطوسي منذئذ أبرز تلاميذه {cite:encyclopaedia-of-islam-2 vol. 10 p. 744}."
  en: "On the death of al-Shaykh al-Mufid in 413/1022 his pupil al-Sharif al-Murtada, 'Alam al-Huda — who had also studied under the Mu'tazili Abd al-Jabbar — took over the leadership of the capital's Imamis, and al-Tusi subsequently became his principal disciple {cite:encyclopaedia-of-islam-2 vol. 10 p. 744}."
  ur: "413ھ/1022ء میں شیخ مفید کی وفات پر ان کے شاگرد شریف مرتضیٰ علم الہدیٰ — جو معتزلی عبدالجبار سے بھی پڑھ چکے تھے — دارالخلافہ کے امامیوں کے قائد بنے اور طوسی پھر ان کے مخصوص شاگرد بن گئے {cite:encyclopaedia-of-islam-2 vol. 10 p. 744}۔"
