id: event/al-nawawi-begins-writing-655
class: event
kind: other
label:
  ar: "النووي يشرع في التصنيف، نحو ٦٥٥هـ/١٢٥٧م"
  en: "Al-Nawawi begins writing, c. 655/1257"
  ur: "نووی کی تصنیف کا آغاز، تقریباً 655ھ/1257ء"
  es: "Al-Nawawi comienza a escribir, c. 655/1257"
  fr: "Al-Nawawi commence à écrire, vers 655/1257"
  tr: "El-Nawawi sınıflandırmasına yaklaşık 655 Hicri/1257 Miladi yılında başlar."
  id: "Al-Nawawi memulai klasifikasinya sekitar tahun 655 H/1257 M."
summary:
  ar: "شرع النووي في التصنيف نحو سنة ٦٥٥هـ/١٢٥٧م بعد أن لزم الاشتغال ليلاً ونهاراً قريب عشرين سنة حتى فاق الأقران؛ وذكر الذهبي أنه أخذ في التصنيف من حدود الستين وستمائة إلى أن مات، ومن أوائل مصنفاته تحرير ألفاظ التنبيه والعمدة في تصحيح التنبيه {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 355-356}."
  en: "Around 655/1257 al-Nawawi began composing books, after nearly twenty years of day-and-night study had carried him past all his peers; al-Dhahabi places the start of his writing 'about 660' and says he wrote until his death. Among his earliest works were al-Tahrir fi alfaz al-Tanbih and al-Umda fi tashih al-Tanbih {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 355-356}."
  ur: "تقریباً 655ھ/1257ء میں نووی نے تصنیف شروع کی، جب قریب بیس سال دن رات محنتِ علم کے بعد وہ اپنے ہم عصروں پر فائق ہو چکے تھے؛ ذہبی کے مطابق تصنیف کا آغاز تقریباً 660ھ سے ہوا اور وہ وفات تک لکھتے رہے۔ ان کی ابتدائی تصانیف میں تحریر الفاظ التنبیہ اور العمدہ فی تصحیح التنبیہ شامل ہیں {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 355-356}۔"
  es: "Hacia el año 655/1257, al-Nawawi comenzó a componer libros, después de casi veinte años de estudio ininterrumpido que lo llevaron a superar a todos sus compañeros; al-Dhahabi sitúa el inicio de su escritura \"alrededor del año 660\" y afirma que escribió hasta su muerte. Entre sus primeras obras se encuentran al-Tahrir fi alfaz al-Tanbih y al-Umda fi tashih al-Tanbih {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 355-356}."
  fr: "Vers 655/1257, al-Nawawi commença à composer des ouvrages, après près de vingt ans d'études assidues qui l'avaient hissé au-dessus de tous ses contemporains; al-Dhahabi situe le début de son œuvre « vers 660 » et affirme qu'il écrivit jusqu'à sa mort. Parmi ses premiers ouvrages figurent al-Tahrir fi alfaz al-Tanbih et al-Umda fi tashih al-Tanbih (voir Encyclopaedia of Islam, vol. 7, p. 1096; voir également Hadharat-Dhahab, p. 355-356)."
  tr: "El-Nawawi, yaklaşık yirmi yıl boyunca gece gündüz çalıştıktan ve akranlarını geride bıraktıktan sonra, Hicri 655/Miladi 1257 yılı civarında yazmaya başlamıştır. El-Dhahabi ise onun Hicri 660 yılı civarından ölümüne kadar yazmaya devam ettiğini belirtmiştir. İlk eserleri arasında El-Tanbih ve El-Umdah'ın şartlarının düzenlenmesi ve El-Tanbih'in düzeltilmesi yer almaktadır. {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 355-356}"
  id: "Al-Nawawi mulai menulis sekitar tahun 655 H/1257 M setelah bekerja siang dan malam selama hampir dua puluh tahun hingga melampaui rekan-rekannya. Al-Dhahabi menyebutkan bahwa ia mulai menulis sekitar tahun 660 H hingga wafatnya. Di antara karya-karya awalnya adalah penyuntingan istilah-istilah Al-Tanbih dan Al-Umdah dalam mengoreksi Al-Tanbih. {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 355-356}."
