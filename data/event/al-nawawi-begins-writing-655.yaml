id: event/al-nawawi-begins-writing-655
class: event
kind: other
label:
  ar: "النووي يشرع في التصنيف، نحو ٦٥٥هـ/١٢٥٧م"
  en: "Al-Nawawi begins writing, c. 655/1257"
  ur: "نووی کی تصنیف کا آغاز، تقریباً 655ھ/1257ء"
summary:
  ar: "شرع النووي في التصنيف نحو سنة ٦٥٥هـ/١٢٥٧م بعد أن لزم الاشتغال ليلاً ونهاراً قريب عشرين سنة حتى فاق الأقران؛ وذكر الذهبي أنه أخذ في التصنيف من حدود الستين وستمائة إلى أن مات، ومن أوائل مصنفاته تحرير ألفاظ التنبيه والعمدة في تصحيح التنبيه {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 355-356}."
  en: "Around 655/1257 al-Nawawi began composing books, after nearly twenty years of day-and-night study had carried him past all his peers; al-Dhahabi places the start of his writing 'about 660' and says he wrote until his death. Among his earliest works were al-Tahrir fi alfaz al-Tanbih and al-Umda fi tashih al-Tanbih {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 355-356}."
  ur: "تقریباً 655ھ/1257ء میں نووی نے تصنیف شروع کی، جب قریب بیس سال دن رات محنتِ علم کے بعد وہ اپنے ہم عصروں پر فائق ہو چکے تھے؛ ذہبی کے مطابق تصنیف کا آغاز تقریباً 660ھ سے ہوا اور وہ وفات تک لکھتے رہے۔ ان کی ابتدائی تصانیف میں تحریر الفاظ التنبیہ اور العمدہ فی تصحیح التنبیہ شامل ہیں {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 355-356}۔"
