label: { ar: "وقعة الجنيد بالشعب", en: "Battle of al-Junayd at al-Sha'b" }
summary:
  ar: "في سنة ثلاث عشرة ومائة خرج الجنيد بن عبد الرحمن غازياً يريد طخارستان فنزل على نهر بلخ ووجه عمارة بن حريم إلى طخارستان في ثمانية عشر ألفاً وإبراهيم بن بسام الليثي في عشرة آلاف في وجه آخر، وجاشت الترك فأتوا سمرقند وعليها سورة بن الحر فكتب إلى الجنيد فأمر الناس بالعبور فقام إليه المجشر بن مزاحم السلمي وابن بسطام الأزدي فقالوا إن الترك ليسوا كغيرهم لا يلقونك صفاً ولا زحفاً وقد فرقت جندك وإن صاحب خراسان لا يعبر النهر في أقل من خمسين ألفاً فاكتب إلى عمارة فليأتك وامهل ولا تعجل، فقال فكيف بسورة ومن معه من المسلمين وعبر ونزل كس، وقد عوّر الترك الآبار التي في طريقه فسأل أي الطريقين إلى سمرقند أمثل فقال المجشر خذ طريق العقبة فهو بيننا وبينهم سواء فأخذ الجنيد طريق العقبة فبات في أصلها ثم مضى بالناس حتى دخل الشعب وبينه وبين مدينة سمرقند أربع فراسخ فصبهم خاقان في جمع عظيم وزحف إليه أهل السغد والشاش وفرغانة وطائفة من الترك فحمل خاقان على المقدمة ففرقوا إلى العسكر والترك تتبعهم وجاؤوهم من كل وجه، فصبر الناس يقاتلون حتى أعيوا فكانت السيوف لا تحك ولا تقطع فقطعوا الخشب يقاتلون به حتى مل الفريقان فكانت المعانقة، وتداولت راية الأزد ثمانية عشر رجلاً فقتلوا وقتل يومئذ ثمانون رجلاً من الأزد، وكان محمد بن عبد الله بن حوذان على فرس أشقر عليه تجفاف فحمل سبع مرات يقتل في كل حملة رجلاً حتى هابه من كان في ناحيته فناداه ترجمان العدو إن الملك يقول لك لا تقاتل وتحول إلينا فنرفض صنمنا ونعبدك فقال إنما أقاتلكم لتتركوا عبادة الأصنام وتعبدوا الله وحده فقاتل حتى قتل، وكان يزيد بن المفضل حمل على مائة بعير سويقاً للمسلمين فجعل يسأل عن الناس فلا يُسأل عن أحد إلا قيل له قد قتل فاستقدم وهو يقول لا إله إلا الله حتى قتل {cite:tabari-khayyat-part2 p. 260-265}."
  en: "In 113 AH al-Junayd ibn Abd al-Rahman set out on a raid towards Tokharistan and halted at the river of Balkh. He sent Umara ibn Huraym towards Tokharistan with eighteen thousand men, and Ibrahim ibn Bassam al-Laythi with ten thousand in another direction. The Turks rose in force and came to Samarqand, which was held by Sura ibn al-Hurr; Sura wrote to al-Junayd, and he ordered the men to cross. Al-Mujashshir ibn Muzahim al-Sulami and Ibn Bistam al-Azdi stood before him and said: the Turks are not like others; they will not meet you in formed ranks or in a charge; you have divided your army; and the commander of Khurasan will not cross the river with fewer than fifty thousand. Write to Umara to come to you, and wait, and do not hurry. He said: then what of Sura and the Muslims with him? He crossed and camped at Kas. The Turks had filled in the wells on his route, so he asked which of the two roads to Samarqand was the better; al-Mujashshir said: take the road of the pass, which is equally distant between us and them. Al-Junayd took the pass road and spent the night at its foot, then went on with the men until he entered the defile (al-Sha'b), four farsakhs from Samarqand. Khaqan fell upon them with a great host, and the people of Sughd, Shash and Ferghana and a body of Turks advanced upon them. Khaqan charged the vanguard, and they broke back toward the army, with the Turks pursuing and coming at them from every side. The people held and fought until they were spent; swords would no longer cut, so they fought with cut wood, until both sides tired and they came to close grappling. The Azd banner passed through eighteen men, all of whom were killed, and eighty men of the Azd fell that day. Muhammad ibn Abd Allah ibn Hawdhan, on a chestnut horse wearing armour, charged seven times and killed a man on each charge, until those on his flank feared him. The enemy's interpreter called to him: the king says, do not fight; turn to us and we will abandon our idol and worship you. He answered: I fight you only so that you abandon the worship of idols and worship God alone; and he fought until he was killed. Yazid ibn al-Mufaddal had carried a hundred camel-loads of sawiq for the Muslims; he kept asking after the men, and whenever he asked after someone he was told that he had been killed. He advanced saying 'there is no god but God' until he was killed {cite:tabari-khayyat-part2 p. 260-265}."
