label: { ar: "وقعة الجنيد بالشعب" }
summary:
  ar: "في سنة ثلاث عشرة ومائة خرج الجنيد بن عبد الرحمن غازياً يريد طخارستان فنزل على نهر بلخ ووجه عمارة بن حريم إلى طخارستان في ثمانية عشر ألفاً وإبراهيم بن بسام الليثي في عشرة آلاف في وجه آخر، وجاشت الترك فأتوا سمرقند وعليها سورة بن الحر فكتب إلى الجنيد فأمر الناس بالعبور فقام إليه المجشر بن مزاحم السلمي وابن بسطام الأزدي فقالوا إن الترك ليسوا كغيرهم لا يلقونك صفاً ولا زحفاً وقد فرقت جندك وإن صاحب خراسان لا يعبر النهر في أقل من خمسين ألفاً فاكتب إلى عمارة فليأتك وامهل ولا تعجل، فقال فكيف بسورة ومن معه من المسلمين وعبر ونزل كس، وقد عوّر الترك الآبار التي في طريقه فسأل أي الطريقين إلى سمرقند أمثل فقال المجشر خذ طريق العقبة فهو بيننا وبينهم سواء فأخذ الجنيد طريق العقبة فبات في أصلها ثم مضى بالناس حتى دخل الشعب وبينه وبين مدينة سمرقند أربع فراسخ فصبهم خاقان في جمع عظيم وزحف إليه أهل السغد والشاش وفرغانة وطائفة من الترك فحمل خاقان على المقدمة ففرقوا إلى العسكر والترك تتبعهم وجاؤوهم من كل وجه، فصبر الناس يقاتلون حتى أعيوا فكانت السيوف لا تحك ولا تقطع فقطعوا الخشب يقاتلون به حتى مل الفريقان فكانت المعانقة، وتداولت راية الأزد ثمانية عشر رجلاً فقتلوا وقتل يومئذ ثمانون رجلاً من الأزد، وكان محمد بن عبد الله بن حوذان على فرس أشقر عليه تجفاف فحمل سبع مرات يقتل في كل حملة رجلاً حتى هابه من كان في ناحيته فناداه ترجمان العدو إن الملك يقول لك لا تقاتل وتحول إلينا فنرفض صنمنا ونعبدك فقال إنما أقاتلكم لتتركوا عبادة الأصنام وتعبدوا الله وحده فقاتل حتى قتل، وكان يزيد بن المفضل حمل على مائة بعير سويقاً للمسلمين فجعل يسأل عن الناس فلا يُسأل عن أحد إلا قيل له قد قتل فاستقدم وهو يقول لا إله إلا الله حتى قتل {cite:tabari-khayyat-part2 p. 260-265}."
