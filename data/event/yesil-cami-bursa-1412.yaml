label: { ar: "الجامع الأخضر والضريح الأخضر ببورصة", en: "The Green Mosque and Green Tomb of Bursa", ur: "بورصہ کی سبز مسجد اور سبز مقبرہ" }
summary:
  ar: "أمر محمد جلبي ببناء الجامع الأخضر (يشيل جامع) سنة 1412م قبل أن ينفرد بالحكم في السنة التالية سلطاناً باسم محمد الأول، وكان المعماري حاجي عوض باشا؛ ولم يكتمل الجامع عند وفاته سنة 1421م فاستمرت أعمال الزخرفة أربع سنين أخرى، وأُلحق به ضريحه المعروف بالضريح الأخضر {cite:freely-ottoman-architecture-2011 p. 45-47}."
  en: "Çelebi Mehmet commissioned the Green Mosque (Yeşil Cami) in 1412 CE, the year before he became sole ruler as Mehmed I; the architect was Hacı Ivaz Pasha. The mosque was unfinished at his death in 1421, with decorative work continuing four more years, and his mausoleum — the Yeşil Türbe — stands across from it {cite:freely-ottoman-architecture-2011 p. 45-47}."
  ur: "چلبی محمد نے 1412ء میں سبز مسجد (یشیل جامع) کی تعمیر کا حکم دیا، ایک برس قبل اس کے کہ وہ محمد اول کے نام سے واحد حکمران بنا؛ معمار حاجی عوض پاشا تھے۔ 1421ء میں ان کی وفات تک مسجد نامکمل رہی اور زخرفی کا کار چار مزید برس جاری رہا؛ ان کا مقبرہ — یشیل تربہ — سامنے کھڑا ہے {cite:freely-ottoman-architecture-2011 p. 45-47}۔"
