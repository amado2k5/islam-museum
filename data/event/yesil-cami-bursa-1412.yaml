label: { ar: "الجامع الأخضر والضريح الأخضر ببورصة", en: "The Green Mosque and Green Tomb of Bursa", ur: "بورصہ کی سبز مسجد اور سبز مقبرہ", es: "La Mezquita Verde y la Tumba Verde de Bursa", fr: "La Mosquée Verte et le Tombeau Vert de Bursa", tr: "Bursa'daki Yeşil Cami ve Yeşil Türbe", id: "Masjid Hijau dan Mausoleum Hijau di Bursa" }
summary:
  ar: "أمر محمد جلبي ببناء الجامع الأخضر ⁦(يشيل جامع)⁩ سنة 1412م قبل أن ينفرد بالحكم في السنة التالية سلطاناً باسم محمد الأول، وكان المعماري حاجي عوض باشا؛ ولم يكتمل الجامع عند وفاته سنة 1421م فاستمرت أعمال الزخرفة أربع سنين أخرى، وأُلحق به ضريحه المعروف بالضريح الأخضر {cite:freely-ottoman-architecture-2011 p. 45-47}."
  en: "Çelebi Mehmet commissioned the Green Mosque (Yeşil Cami) in 1412 CE, the year before he became sole ruler as Mehmed I; the architect was Hacı Ivaz Pasha. The mosque was unfinished at his death in 1421, with decorative work continuing four more years, and his mausoleum — the Yeşil Türbe — stands across from it {cite:freely-ottoman-architecture-2011 p. 45-47}."
  ur: "چلبی محمد نے 1412ء میں سبز مسجد ⁦(یشیل جامع)⁩ کی تعمیر کا حکم دیا، ایک برس قبل اس کے کہ وہ محمد اول کے نام سے واحد حکمران بنا؛ معمار حاجی عوض پاشا تھے۔ 1421ء میں ان کی وفات تک مسجد نامکمل رہی اور زخرفی کا کار چار مزید برس جاری رہا؛ ان کا مقبرہ — یشیل تربہ — سامنے کھڑا ہے {cite:freely-ottoman-architecture-2011 p. 45-47}۔"
  es: "Çelebi Mehmet encargó la Mezquita Verde (Yeşil Cami) en 1412 d. C., un año antes de convertirse en gobernante único como Mehmed I; el arquitecto fue Hacı Ivaz Pasha. La mezquita quedó inconclusa a su muerte en 1421, y los trabajos decorativos continuaron durante cuatro años más. Su mausoleo, el Yeşil Türbe, se encuentra frente a ella {cite:freely-ottoman-architecture-2011 p. 45-47}."
  fr: "Çelebi Mehmet commanda la Mosquée Verte (Yeşil Cami) en 1412, un an avant de devenir seul souverain sous le nom de Mehmed Ier; l’architecte était Hacı Ivaz Pacha. La mosquée était inachevée à sa mort en 1421, les travaux de décoration se poursuivant pendant quatre ans. Son mausolée, le Yeşil Türbe, se dresse en face d’elle {cite:freely-ottoman-architecture-2011 p. 45-47}."
  tr: "Muhammed Çelebi, 1412 yılında, ertesi yıl Muhammed I adıyla tek başına sultan olarak hüküm sürmeden önce Yeşil Cami'nin inşasını emretti. Mimarı Hacı Avaz Paşa idi. Cami, 1421 yılında vefat ettiğinde tamamlanmamıştı, bu nedenle dekorasyon çalışmaları dört yıl daha devam etti ve türbesi olan Yeşil Türbe camiye eklendi. {cite:freely-ottoman-architecture-2011 s. 45-47}."
  id: "Muhammad Çelebi memerintahkan pembangunan Masjid Hijau (Yeşil Cami) pada tahun 1412 M sebelum ia mengambil alih kekuasaan tunggal pada tahun berikutnya sebagai Sultan dengan nama Muhammad I. Arsiteknya adalah Haji Avaz Pasha. Masjid tersebut belum selesai ketika ia meninggal pada tahun 1421 M, sehingga pekerjaan dekorasi berlanjut selama empat tahun lagi, dan makamnya, yang dikenal sebagai Mausoleum Hijau, dibangun di dekatnya. {cite:freely-ottoman-architecture-2011 p. 45-47}."
