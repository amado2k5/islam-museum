id: event/mawardi-laqab-aqda-qudat-429
class: event
kind: other
label:
  ar: "تلقيب الماوردي بأقضى القضاة، ٤٢٩هـ"
  en: "Al-Mawardi awarded the laqab aqda'l-qudat, 429/1038"
  ur: "ماوردی کو «اقضی القضاة» کا لقب عطا ہونا، 429ھ/1038ء"
summary:
  ar: "في سنة تسع وعشرين وأربعمائة منح القضاء [[person/al-mawardi|الماوردي]] لقب «أقضى القضاة»، وذلك رغم آراء فقهاء كبار بينهم أبو الطيب الطبري أنكروا مشروعية هذا اللقب {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}. وقد ورد في تاريخ ابن الجوزي بذلك اللقب عند كلامه على فتنة لقب «شاهنشاه» في رمضان السنة نفسها: «حكى عن أقضى القضاة أبي الحسن الماوردي» {cite:muntazam-ibn-al-jawzi j.8 p.439}."
  en: "In 429/1038 the qadi [[person/al-mawardi|al-Mawardi]] was awarded the honorific laqab 'aqda'l-qudat' (supreme qadi), in spite of the opinions of eminent jurists — Abu al-Tayyib al-Tabari among them — who denied the legality of the title {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}. Ibn al-Jawzi already calls him by it in the same year's account of the 'Shahanshah' laqab fitna: 'it is related of aqda'l-qudat Abu al-Hasan al-Mawardi' {cite:muntazam-ibn-al-jawzi j.8 p.439}."
  ur: "429ھ/1038ء میں قاضی [[person/al-mawardi|ماوردی]] کو «اقضی القضاة» کا لقب دیا گیا، اس کے باوجود کہ کئی بڑے فقہاء — جن میں ابوالطیب طبری بھی تھے — اس لقب کی شرعی حیثیت کو تسلیم نہیں کرتے تھے {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}۔ ابن الجوزی اسی سال «شاہنشاہ» کے فتنے کے ذکر میں انھیں اسی لقب سے یاد کرتے ہیں: «اقضی القضاة ابی الحسن ماوردی سے روایت ہے» {cite:muntazam-ibn-al-jawzi j.8 p.439}۔"
