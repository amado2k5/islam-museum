label:
  ar: "تلقيب الماوردي بأقضى القضاة، ٤٢٩هـ"
  en: "Al-Mawardi awarded the laqab aqda'l-qudat, 429/1038"
  ur: "ماوردی کو «اقضی القضاة» کا لقب عطا ہونا، 429ھ/1038ء"
  es: "Al-Mawardi recibió el laqab aqda'l-qudat, 429/1038"
  fr: "Al-Mawardi a reçu le laqab aqda'l-qudat, 429/1038"
  tr: "El-Mawardi'ye 429 Hicri yılında en adil kadı unvanı verildi."
  id: "Al-Mawardi diberi gelar hakim yang paling adil, 429 H."
summary:
  ar: "في سنة تسع وعشرين وأربعمائة منح القضاء [[person/al-mawardi|الماوردي]] لقب «أقضى القضاة»، وذلك رغم آراء فقهاء كبار بينهم أبو الطيب الطبري أنكروا مشروعية هذا اللقب {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}. وقد ورد في تاريخ ابن الجوزي بذلك اللقب عند كلامه على فتنة لقب «شاهنشاه» في رمضان السنة نفسها: «حكى عن أقضى القضاة أبي الحسن الماوردي» {cite:muntazam-ibn-al-jawzi j.8 p.439}."
  en: "In 429/1038 the qadi [[person/al-mawardi|al-Mawardi]] was awarded the honorific laqab 'aqda'l-qudat' (supreme qadi), in spite of the opinions of eminent jurists — Abu al-Tayyib al-Tabari among them — who denied the legality of the title {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}. Ibn al-Jawzi already calls him by it in the same year's account of the 'Shahanshah' laqab fitna: 'it is related of aqda'l-qudat Abu al-Hasan al-Mawardi' {cite:muntazam-ibn-al-jawzi j.8 p.439}."
  ur: "429ھ/1038ء میں قاضی [[person/al-mawardi|ماوردی]] کو «اقضی القضاة» کا لقب دیا گیا، اس کے باوجود کہ کئی بڑے فقہاء — جن میں ابوالطیب طبری بھی تھے — اس لقب کی شرعی حیثیت کو تسلیم نہیں کرتے تھے {cite:encyclopaedia-of-islam-2 vol. 6 p. 896}۔ ابن الجوزی اسی سال «شاہنشاہ» کے فتنے کے ذکر میں انھیں اسی لقب سے یاد کرتے ہیں: «اقضی القضاة ابی الحسن ماوردی سے روایت ہے» {cite:muntazam-ibn-al-jawzi j.8 p.439}۔"
  es: "En 429/1038, el cadí [[persona/al-mawardi|al-Mawardi]] recibió el título honorífico 'aqda'l-qudat' (cadí supremo), a pesar de las opiniones de eminentes juristas, entre ellos Abu al-Tayyib al-Tabari, que negaron la legalidad del título {cite:encyclopaedia-of-islam-2 vol. 6p. 896}. Ibn al-Jawzi ya lo llama así en el relato del mismo año sobre la laqab fitna 'Shahanshah': 'Está relacionado con el aqda'l-qudat de Abu al-Hasan al-Mawardi'"
  fr: "En 429/1038, le cadi [[person/al-mawardi|al-Mawardi]] reçut le titre honorifique « aqda'l-qudat » (qadi suprême), malgré les opinions d'éminents juristes — parmi eux Abu al-Tayyib al-Tabari — qui niaient la légalité de ce titre {cite:encyclopaedia-of-islam-2 vol. 18h. 896}. Ibn al-Jawzi l'appelle déjà par ce terme dans le récit de la même année de la fitna laqab « Shahanshah »: « Elle est liée à l'aqda'l-qudat d'Abu al-Hasan al-Mawardi »."
  tr: "Hicri 429 yılında, Ebu el-Tayyib el-Taberi de dahil olmak üzere önde gelen hukukçuların bu unvanın meşruiyetini reddetmelerine rağmen, yargı, el-Mawardi'ye \"En Adil Hakim\" unvanını verdi. Bu unvan, İbn el-Cevzi'nin aynı yılın Ramazan ayında \"Şaheşah\" unvanı etrafındaki tartışmayı ele aldığı tarih eserinde de geçmektedir: \"En Adil Hakim Ebu el-Hasan el-Mawardi'den rivayet edilmiştir.\""
  id: "Pada tahun 429 H, lembaga peradilan menganugerahkan gelar \"Hakim yang Paling Adil\" kepada al-Mawardi, meskipun ada pendapat dari para ahli hukum terkemuka, termasuk Abu al-Tayyib al-Tabari, yang menolak keabsahan gelar ini. Gelar ini disebutkan dalam sejarah Ibn al-Jawzi ketika membahas kontroversi seputar gelar \"Shahanshah\" pada bulan Ramadan tahun yang sama: \"Diriwayatkan dari Hakim yang Paling Adil, Abu al-Hasan al-Mawardi.\""
