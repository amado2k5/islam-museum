id: event/ibn-kathir-birth-701
class: event
kind: birth
label:
  ar: "ميلاد ابن كثير بقرية من أعمال بصرى الشام، نحو ٧٠١هـ"
  en: "Ibn Kathir is born in a village of the Busra al-Sham district, about 701/1302"
  ur: "ابن کثیر کی پیدائش بصریٰ الشام کے ضلع کے ایک گاؤں میں، تقریباً 701ھ/1302ء"
summary:
  ar: "وُلد إسماعيل بن عمر بن كثير بن ضوء، عماد الدين أبو الفداء، في قرية من أعمال بصرى الشام، قال ابن حجر في الدرر: ولد سنة سبعمائة أو بعدها بيسير {cite:durar-kamina-jil-1993 1/374}، وضبطه محرر ذيل الدرر سنة ٧٠١هـ {cite:durar-kamina-jil-1993 dhayl p. 99}، وقال الزركلي في الأعلام: ولد في قرية من أعمال بصرى الشام {cite:al-aalam 1/112}."
  en: "Isma'il ibn 'Umar ibn Kathir ibn Daw', 'Imad al-Din Abu l-Fida', was born in a village of the district of Busra al-Sham; Ibn Hajar says 'born in the year 700 or shortly after' {cite:durar-kamina-jil-1993 1/374}, the editor of the Dhayl fixes it at 701 {cite:durar-kamina-jil-1993 dhayl p. 99}, and al-Zirikli gives 'a village of the Busra al-Sham district' {cite:al-aalam 1/112}."
  ur: "اسماعیل بن عمر بن کثیر بن ضوء، عماد الدین ابوالفدا، بصریٰ الشام کے ضلع کے ایک گاؤں میں پیدا ہوئے؛ ابن حجر کے مطابق «سنہ 700 یا اس کے کچھ بعد» {cite:durar-kamina-jil-1993 1/374}، ذیل کے محرر نے 701ھ مقرر کیا {cite:durar-kamina-jil-1993 dhayl p. 99}، اور زرکلی نے «بصریٰ الشام کے ضلع کا ایک گاؤں» لکھا {cite:al-aalam 1/112}۔"
