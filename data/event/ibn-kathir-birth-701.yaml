id: event/ibn-kathir-birth-701
class: event
kind: birth
label:
  ar: "ميلاد ابن كثير بقرية من أعمال بصرى الشام، نحو ٧٠١هـ"
  en: "Ibn Kathir is born in a village of the Busra al-Sham district, about 701/1302"
  ur: "ابن کثیر کی پیدائش بصریٰ الشام کے ضلع کے ایک گاؤں میں، تقریباً 701ھ/1302ء"
  es: "Ibn Kathir nació en una aldea del distrito de Busra al-Sham, alrededor del año 701/1302."
  fr: "Ibn Kathir est né dans un village du district de Busra al-Sham, vers 701/1302."
  tr: "İbn Kathir, Hicri 701 yılı civarında Suriye'nin Busra bölgesindeki bir köyde doğdu."
  id: "Ibn Kathir lahir di sebuah desa di wilayah Busra di Suriah, sekitar tahun 701 Hijriah."
summary:
  ar: "وُلد إسماعيل بن عمر بن كثير بن ضوء، عماد الدين أبو الفداء، في قرية من أعمال بصرى الشام، قال ابن حجر في الدرر: ولد سنة سبعمائة أو بعدها بيسير {cite:durar-kamina-jil-1993 1/374}، وضبطه محرر ذيل الدرر سنة ٧٠١هـ {cite:durar-kamina-jil-1993 dhayl p. 99}، وقال الزركلي في الأعلام: ولد في قرية من أعمال بصرى الشام {cite:al-aalam 1/112}."
  en: "Isma'il ibn 'Umar ibn Kathir ibn Daw', 'Imad al-Din Abu l-Fida', was born in a village of the district of Busra al-Sham; Ibn Hajar says 'born in the year 700 or shortly after' {cite:durar-kamina-jil-1993 1/374}, the editor of the Dhayl fixes it at 701 {cite:durar-kamina-jil-1993 dhayl p. 99}, and al-Zirikli gives 'a village of the Busra al-Sham district' {cite:al-aalam 1/112}."
  ur: "اسماعیل بن عمر بن کثیر بن ضوء، عماد الدین ابوالفدا، بصریٰ الشام کے ضلع کے ایک گاؤں میں پیدا ہوئے؛ ابن حجر کے مطابق «سنہ 700 یا اس کے کچھ بعد» {cite:durar-kamina-jil-1993 1/374}، ذیل کے محرر نے 701ھ مقرر کیا {cite:durar-kamina-jil-1993 dhayl p. 99}، اور زرکلی نے «بصریٰ الشام کے ضلع کا ایک گاؤں» لکھا {cite:al-aalam 1/112}۔"
  es: "Isma'il ibn 'Umar ibn Kathir ibn Daw', 'Imad al-Din Abu l-Fida', nació en una aldea del distrito de Busra al-Sham; Ibn Hajar dice 'nació en el año 700 o poco después' {cite:durar-kamina-jil-1993 1/374}, el editor del Dhayl lo sitúa en el 701 {cite:durar-kamina-jil-1993 dhayl p. 99}, y al-Zirikli da 'una aldea del distrito de Busra al-Sham' {cite:al-aalam 1/112}."
  fr: "Isma'il ibn 'Umar ibn Kathir ibn Daw', 'Imad al-Din Abu l-Fida', est né dans un village du district de Busra al-Sham; Ibn Hajar dit « né en l'an 700 ou peu après » {cite:durar-kamina-jil-1993 1/374}, l'éditeur du Dhayl le fixe à 701 {cite:durar-kamina-jil-1993 dhayl p. 99}, et al-Zirikli donne « un village du district de Busra al-Sham » {cite:al-aalam 1/112}."
  tr: "İsmail ibn Ömer ibn Kathir ibn Dav’, İmadeddin Ebu el-Fida, Busra el-Şam bölgesindeki bir köyde doğmuştur. İbn Hacer, el-Durar'da şöyle demiştir: Yedi yüz yılında veya biraz sonrasında doğmuştur. {cite:durar-kamina-jil-1993 1/374}. Zeyl el-Durar'ın editörü bunu Hicri 701 yılı olarak kaydetmiştir. {cite:durar-kamina-jil-1993 dhayl s. 99}. El-Zarkali, el-A'lam'da şöyle demiştir: Busra el-Şam bölgesindeki bir köyde doğmuştur. {cite:al-aalam 1/112}."
  id: "Ismail ibn Omar ibn Kathir ibn Daw’, Imad al-Din Abu al-Fida, lahir di sebuah desa di wilayah Busra al-Sham. Ibn Hajar berkata dalam al-Durar: Beliau lahir pada tahun tujuh ratus atau sedikit setelah itu {cite:durar-kamina-jil-1993 1/374}. Editor Dhayl al-Durar mencatatnya sebagai tahun 701 H {cite:durar-kamina-jil-1993 dhayl hal. 99}. Al-Zarkali berkata dalam al-A’lam: Beliau lahir di sebuah desa di wilayah Busra al-Sham {cite:al-aalam 1/112}."
