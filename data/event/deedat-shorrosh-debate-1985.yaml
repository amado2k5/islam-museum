label: { ar: "مناظرة أحمد ديدات وأنيس شوروش 1985", en: "Deedat–Shorrosh 'Is Jesus God?' (1985)", es: "Deedat–Shorrosh '¿Es Jesús Dios?' (1985)", fr: "Deedat–Shorrosh « Jésus est-il Dieu ? » (1985)", ur: "Deedat-Shorrosh 'کیا یسوع خدا ہے؟' (1985)", tr: "Ahmed Deedat ve Anis Shorrosh arasında 1985 yılında gerçekleşen tartışma.", id: "Debat antara Ahmed Deedat dan Anis Shorrosh, 1985" }
summary:
  ar: "أول المناظرتين الشهيرتين بين أحمد ديدات والقس الفلسطيني الأصل [[person/anis-shorrosh|أنيس شوروش]]: «هل عيسى إله؟» في [[place/london|قاعة رويال ألبرت]] بلندن سنة 1985، أمام جمهور غفير من المسلمين والنصارى. جادل ديدات بأن ألفاظ البشائر لا تنطق بعقيدة الألوهية الصريحة لعيسى وأن العقيدة لاحقة التكوين، وجادل شوروش بنصوص الوحي والتعظيم النبوي للمسيح. وطبعت المناظرة كراساً وفرّغت وترجمت فصارت من متون المناظرة الأكثر رواجاً {cite:answering-islam-debates-index}."
  en: "The first of the two famous debates between Ahmed Deedat and the Palestinian-born evangelist [[person/anis-shorrosh|Anis Shorrosh]]: 'Is Jesus God?' at the [[place/london|Royal Albert Hall]], London, in 1985, before a large audience of Muslims and Christians. Deedat argued that the Gospel language never pronounces an explicit deity for Jesus and that the doctrine is of later formation; Shorrosh argued from the scriptural texts and the New Testament's exaltation of Christ. The debate was printed as a booklet, transcribed and translated, becoming one of the most-read disputation texts {cite:answering-islam-debates-index}."
  es: "El primero de los dos famosos debates entre Ahmed Deedat y el evangelista palestino Anis Shorrosh: \"¿Es Jesús Dios?\", tuvo lugar en el Royal Albert Hall de Londres en 1985, ante un numeroso público de musulmanes y cristianos. Deedat argumentó que el lenguaje de los Evangelios nunca pronuncia explícitamente la divinidad de Jesús y que la doctrina es de formación posterior; Shorrosh argumentó a partir de los textos bíblicos y la exaltación de Cristo en el Nuevo Testamento. El debate se publicó como folleto, se transcribió y se tradujo, convirtiéndose en uno de los textos de disputa más leídos {cite:answering-islam-debates-index}."
  fr: "Le premier des deux célèbres débats entre Ahmed Deedat et l'évangéliste palestinien Anis Shorrosh, intitulé « Jésus est-il Dieu ? », s'est tenu au Royal Albert Hall de Londres en 1985, devant un large public composé de musulmans et de chrétiens. Deedat soutenait que les Évangiles ne proclament jamais explicitement la divinité de Jésus et que cette doctrine est d'origine postérieure; Shorrosh, quant à lui, s'appuyait sur les textes bibliques et l'exaltation du Christ dans le Nouveau Testament. Le débat a été publié sous forme de livret, transcrit et traduit, et est devenu l'un des textes de controverse les plus lus (voir Answering Islam Debates Index)."
  ur: "احمد دیدات اور فلسطینی نژاد مبشر [[person/anis-shorrosh|انیس شوروش]] کے درمیان دو مشہور مباحثوں میں سے پہلا: 'کیا عیسیٰ خدا ہے؟' [[جگہ/لندن|رائل البرٹ ہال]]، لندن میں، 1985 میں، مسلمانوں اور عیسائیوں کی ایک بڑی تعداد کے سامنے۔ دیدات نے دلیل دی کہ انجیل کی زبان کبھی بھی یسوع کے لیے کسی واضح دیوتا کا تلفظ نہیں کرتی اور یہ نظریہ بعد کی تشکیل کا ہے۔ شوروش نے صحیفوں کے متون اور نئے عہد نامہ میں مسیح کی سربلندی سے استدلال کیا۔ یہ مباحثہ ایک کتابچے کے طور پر چھاپا گیا، نقل کیا گیا اور ترجمہ کیا گیا، جو سب سے زیادہ پڑھے جانے والے تنازعات میں سے ایک بن گیا۔"
  tr: "Ahmed Deedat ile Filistin doğumlu rahip Anis Şorroş arasında gerçekleşen ve \"İsa Tanrı mıdır?\" başlığını taşıyan iki ünlü tartışmadan ilki, 1985 yılında Londra'daki Royal Albert Hall'da, çok sayıda Müslüman ve Hristiyanın katılımıyla yapıldı. Deedat, İncillerin İsa'nın ilahlığını açıkça ilan etmediğini ve bu doktrinin daha sonraki bir gelişme olduğunu savundu. Şorroş ise buna karşılık vahiy metinleri ve İsa'yı öven peygamberlik sözleri öne sürdü. Tartışma, kitapçık olarak yayınlandı, yazıya geçirildi ve tercüme edildi; böylece İslami tartışmaların en yaygın olarak dolaşan metinlerinden biri haline geldi."
  id: "Debat pertama dari dua debat terkenal antara Ahmed Deedat dan pendeta kelahiran Palestina, Anis Shorrosh, yang berjudul \"Apakah Yesus Tuhan?\", berlangsung di Royal Albert Hall di London pada tahun 1985 di hadapan banyak hadirin Muslim dan Kristen. Deedat berpendapat bahwa Injil tidak secara eksplisit menyatakan keilahian Yesus dan bahwa doktrin tersebut merupakan perkembangan kemudian. Shorrosh menanggapi dengan teks-teks wahyu dan pujian kenabian terhadap Yesus. Debat tersebut diterbitkan sebagai buklet, ditranskripsikan, dan diterjemahkan, menjadi salah satu teks debat Islam yang paling banyak beredar."
