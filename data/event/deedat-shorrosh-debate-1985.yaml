summary:
  ar: "أول المناظرتين الشهيرتين بين أحمد ديدات والقس الفلسطيني الأصل [[person/anis-shorrosh|أنيس شوروش]]: «هل عيسى إله؟» في [[place/london|قاعة رويال ألبرت]] بلندن سنة 1985، أمام جمهور غفير من المسلمين والنصارى. جادل ديدات بأن ألفاظ البشائر لا تنطق بعقيدة الألوهية الصريحة لعيسى وأن العقيدة لاحقة التكوين، وجادل شوروش بنصوص الوحي والتعظيم النبوي للمسيح. وطبعت المناظرة كراساً وفرّغت وترجمت فصارت من متون المناظرة الأكثر رواجاً {cite:answering-islam-debates-index}."
  en: "The first of the two famous debates between Ahmed Deedat and the Palestinian-born evangelist [[person/anis-shorrosh|Anis Shorrosh]]: 'Is Jesus God?' at the [[place/london|Royal Albert Hall]], London, in 1985, before a large audience of Muslims and Christians. Deedat argued that the Gospel language never pronounces an explicit deity for Jesus and that the doctrine is of later formation; Shorrosh argued from the scriptural texts and the New Testament's exaltation of Christ. The debate was printed as a booklet, transcribed and translated, becoming one of the most-read disputation texts {cite:answering-islam-debates-index}."
  es: "El primero de los dos famosos debates entre Ahmed Deedat y el evangelista palestino Anis Shorrosh: \"¿Es Jesús Dios?\", tuvo lugar en el Royal Albert Hall de Londres en 1985, ante un numeroso público de musulmanes y cristianos. Deedat argumentó que el lenguaje de los Evangelios nunca pronuncia explícitamente la divinidad de Jesús y que la doctrina es de formación posterior; Shorrosh argumentó a partir de los textos bíblicos y la exaltación de Cristo en el Nuevo Testamento. El debate se publicó como folleto, se transcribió y se tradujo, convirtiéndose en uno de los textos de disputa más leídos {cite:answering-islam-debates-index}."
