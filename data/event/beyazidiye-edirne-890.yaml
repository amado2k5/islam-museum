label: { ar: "بناء كوليه بايزيد الثاني بأدرنة", en: "The Bayezid II complex (Beyazidiye) is built at Edirne", ur: "ادرنہ میں بایزید ثانی کا مجموعہ (بیازی دیہ) تعمیر" }
summary:
  ar: "بُني كوليه بايزيد الثاني على الضفة الغربية لنهر التونجا في الأعوام ١٤٨٤-١٤٨٨م على يد المعمار خير الدين، وضمّ جامعاً ومستشفى (دار الشفاء) وبيمارستاناً ومدرسة طب ونزلاء وإمارة ومخبزاً؛ ويعطي تأريخ باب الجامع سنة ٨٩٣هـ/١٤٨٨م {cite:freely-ottoman-architecture-2011 p. 70} {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}."
  en: "The Beyazidiye külliye was built on the west bank of the Tunca in 1484-8 by the architect Hayrettin — a mosque, a hospital, an insane asylum, a medical school, a hospice, an imaret, a bakery and food depots; a chronogram on the mosque gate gives the date 893/1488 {cite:freely-ottoman-architecture-2011 p. 70} {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}."
  ur: "بیازی دیہ مجموعہ 1484-88ء میں دریائے تونجہ کے مغربی کنارے معمار خیر الدین نے بنایا — مسجد، شفاخانہ، پاگل خانہ، طبی مدرسہ، مسافر خانہ، امارت، نان خانہ اور انبار؛ مسجد کے دروازے کی تاریخی کتیبہ 893ھ/1488ء دیتا ہے {cite:freely-ottoman-architecture-2011 p. 70} {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}۔"
