id: event/possessed-woman-ruqya
class: event
kind: other
label:
  ar: "شفاء امرأة مسّها الجن بالرقية"
  en: "A woman touched by jinn healed by ruqya"
  ur: "جن کے اثر والے عورت کی رقیہ سے شفا"
summary:
  ar: "يذكر البخاري أن امرأة مسّها الجن (أصابها مسّ) جاؤوا بها إلى النبي أو إلى أصحابه، فقال النبي علّموا هذه المرأة من نفسها رقية، وكان التعوذ «باسمك ربي أوقي من كل شيء يؤذيك...» {cite:sahih-al-bukhari}. وفي كتب الطب والرقائق أبواب كثيرة في خروج الجن من المسّين بالرقية الشرعية {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  en: "Al-Bukhari relates that a woman touched by jinn was brought to the Prophet or his companions, who taught her ruqya over herself — the refuge-seeking 'in Your name, my Lord, I seek refuge from everything that harms You' — and the books of medicine and heart-softening carry many chapters on jinn leaving the afflicted through lawful ruqya {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  ur: "بخاری میں آیا ہے کہ جنوں کے مس سے متاثرہ ایک عورت کو نبی یا ان کے صحابہ کے پاس لایا گیا، تو انہوں نے اسے رقیہ سکھایا جس میں «باسمک ربی اقی من کل شیء یؤذیک» جیسا تعوذ تھا، اور طب اور رقیق کی کتابوں میں رقیہ سے جن کے نکلنے کے بہت سے ابواب ہیں {cite:sahih-al-bukhari} {cite:sahih-muslim}۔"
