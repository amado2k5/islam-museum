id: event/possessed-woman-ruqya
class: event
kind: other
label:
  ar: "شفاء امرأة مسّها الجن بالرقية"
  en: "A woman touched by jinn healed by ruqya"
  ur: "جن کے اثر والے عورت کی رقیہ سے شفا"
  es: "Una mujer tocada por un genio fue sanada por la ruqya."
  fr: "Une femme touchée par un djinn guérie par la ruqya"
  tr: "Cin tarafından ele geçirilmiş bir kadını büyü yoluyla iyileştirme"
  id: "Menyembuhkan seorang wanita yang dirasuki jin melalui mantra."
summary:
  ar: "يذكر البخاري أن امرأة مسّها الجن ⁦(أصابها مسّ)⁩ جاؤوا بها إلى النبي أو إلى أصحابه، فقال النبي علّموا هذه المرأة من نفسها رقية، وكان التعوذ «باسمك ربي أوقي من كل شيء يؤذيك...» {cite:sahih-al-bukhari}. وفي كتب الطب والرقائق أبواب كثيرة في خروج الجن من المسّين بالرقية الشرعية {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  en: "Al-Bukhari relates that a woman touched by jinn was brought to the Prophet or his companions, who taught her ruqya over herself — the refuge-seeking 'in Your name, my Lord, I seek refuge from everything that harms You' — and the books of medicine and heart-softening carry many chapters on jinn leaving the afflicted through lawful ruqya {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  ur: "بخاری میں آیا ہے کہ جنوں کے مس سے متاثرہ ایک عورت کو نبی یا ان کے صحابہ کے پاس لایا گیا، تو انہوں نے اسے رقیہ سکھایا جس میں «باسمک ربی اقی من کل شیء یؤذیک» جیسا تعوذ تھا، اور طب اور رقیق کی کتابوں میں رقیہ سے جن کے نکلنے کے بہت سے ابواب ہیں {cite:sahih-al-bukhari} {cite:sahih-muslim}۔"
  es: "Al-Bujari relata que una mujer tocada por un genio fue llevada ante el Profeta o sus compañeros, quienes le enseñaron ruqya sobre sí misma —la búsqueda de refugio 'en Tu nombre, mi Señor, me refugio de todo lo que te daña'— y los libros de medicina y ablandamiento del corazón contienen muchos capítulos sobre cómo los genios abandonan a los afligidos mediante la ruqya lícita {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  fr: "Al-Bukhari rapporte qu'une femme touchée par un djinn fut amenée au Prophète ou à ses compagnons, qui lui enseignèrent la ruqya sur elle-même — la recherche de refuge « en Ton nom, mon Seigneur, je cherche refuge contre tout ce qui Te nuit » — et les livres de médecine et d'adoucissement du cœur contiennent de nombreux chapitres sur les djinns quittant les affligés grâce à la ruqya licite {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  tr: "Buhari, cin tarafından ele geçirilmiş bir kadının Peygamberimize veya sahabelerine getirildiğini anlatır. Peygamberimiz, \"Bu kadına korunma duası öğretin\" diye buyurmuştur. Dua ise, \"Ey Rabbim, senin adınla sana zarar verebilecek her şeyden sana sığınırım...\" şeklindedir. {Sahih Buhari}. Tıp ve manevi şifa kitaplarında, meşru dualarla cinlerin ele geçirilmiş kişilerden kovulması hakkında birçok bölüm bulunmaktadır. {Sahih Buhari} {Sahih Müslim}."
  id: "Al-Bukhari menyebutkan bahwa seorang wanita yang dirasuki jin dibawa kepada Nabi atau para sahabatnya. Nabi bersabda, \"Ajarkan wanita ini sebuah doa untuk perlindungan, dan doanya adalah, 'Dengan nama-Mu, Tuhanku, aku berlindung dari segala sesuatu yang membahayakan-Mu...'\" {kutip:sahih-al-bukhari}. Terdapat banyak bab dalam kitab-kitab kedokteran dan penyembuhan spiritual tentang pengusiran jin dari orang yang dirasuki melalui doa-doa yang sah. {kutip:sahih-al-bukhari} {kutip:sahih-muslim}."
