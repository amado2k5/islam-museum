summary:
  ar: "بطاقة أولية لحادثة بندر ⁦(القلق أت)⁩ سنة ١٧١٣م، اشتباك العثمانيين مع كارل الثاني عشر في منفاه المولدافي؛ لم تُراجع مصادره على الصفحة بعد."
