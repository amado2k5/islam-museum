  ur: "1713 میں بینڈر ⁦(کالابلک)⁩ میں تصادم کے لیے ڈرافٹ کارڈ، مالداویہ میں جلاوطن چارلس XII کے ساتھ عثمانی جھڑپ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1713 yılında Osmanlıların Moldovya'daki sürgünü sırasında XII. Karl ile yaşadığı çatışmayı konu alan Bandar Olayı'nın (Al-Qalq At) ön taslağı; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Kartu pendahuluan tentang insiden Bandar (Al-Qalq At) pada tahun 1713 M, bentrokan antara Ottoman dengan Charles XII di pengasingannya di Moldavia; sumber-sumbernya belum ditinjau di halaman ini."
