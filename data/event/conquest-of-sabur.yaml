label: { ar: "فتح سابور", en: "Conquest of Sabur" }
summary:
  ar: "أتى عثمان بن أبي العاص مدينة سابور سنة ٢٣ ويقال سنة ٢٤ فوجد أهلها هائبين للمسلمين وكان أخو شهرك رأى في منامه كأن رجلاً من العرب دخل عليه فسلبه قميصه فنخب ذلك قلبه فامتنع قليلاً ثم طلب الأمان والصلح فصالحه عثمان على أن لا يقتل أحداً ولا يسبيه وأن تكون له ذمة ويعجل مالاً ثم إن أهل سابور نقضوا وغدروا ففتحت سنة ٢٦ عنوة فتحها أبو موسى وعلى مقدمته عثمان بن أبي العاص."
  en: "Uthman came to Sabur in 23 or 24h — its folk already dreading the Muslims and its marzban, Shahrak's brother, having dreamed an Arab stripped his shirt, which gripped his heart — after brief defiance he sought aman: no killing no captives, dhimma and prompt payment. The people later betrayed, and in 26h Abu Musa took it by force, Uthman ibn Abi al-As on his vanguard."
