summary:
  ar: "أتى عثمان بن أبي العاص مدينة سابور سنة ٢٣ ويقال سنة ٢٤ فوجد أهلها هائبين للمسلمين وكان أخو شهرك رأى في منامه كأن رجلاً من العرب دخل عليه فسلبه قميصه فنخب ذلك قلبه فامتنع قليلاً ثم طلب الأمان والصلح فصالحه عثمان على أن لا يقتل أحداً ولا يسبيه وأن تكون له ذمة ويعجل مالاً ثم إن أهل سابور نقضوا وغدروا ففتحت سنة ٢٦ عنوة فتحها أبو موسى وعلى مقدمته عثمان بن أبي العاص."
  en: "Uthman came to Sabur in 23 or 24h — its folk already dreading the Muslims and its marzban, Shahrak's brother, having dreamed an Arab stripped his shirt, which gripped his heart — after brief defiance he sought aman: no killing no captives, dhimma and prompt payment. The people later betrayed, and in 26h Abu Musa took it by force, Uthman ibn Abi al-As on his vanguard."
  es: "Uthman llegó a Sabur en el año 23 o 24 —sus habitantes ya temían a los musulmanes y su marzban, hermano de Shahrak, había soñado que un árabe le arrancaba la camisa, lo que le aterrorizó—, tras un breve acto de rebeldía, exigió aman: no matar ni tomar prisioneros, dhimma y pago inmediato. Posteriormente, el pueblo lo traicionó, y en el año 26 Abu Musa la tomó por la fuerza, con Uthman ibn Abi al-As a la vanguardia."
  fr: "Uthman arriva à Sabur en 23 ou 24 h. Ses habitants craignaient déjà les musulmans et son marzban, le frère de Shahrak, avait rêvé qu'un Arabe lui arrachait sa chemise, ce qui l'avait profondément marqué. Après une brève rébellion, il demanda l'aman: ni meurtre, ni captifs, la dhimma et un paiement immédiat. Le peuple le trahit plus tard, et en 26 h, Abou Moussa s'empara de la ville par la force, Uthman ibn Abi al-As à sa tête."
  ur: "عثمان 23 یا 24 ھ میں صبور کے پاس آیا - اس کے لوگ پہلے ہی مسلمانوں سے خوفزدہ تھے اور اس کے مرزبان، شہرک کے بھائی نے خواب میں دیکھا کہ ایک عرب نے اس کی قمیض اتار دی ہے، جس نے اس کے دل کو پکڑ لیا ہے - تھوڑی سی مخالفت کے بعد اس نے امان کی تلاش کی: نہ قتل نہ اسیر، ذم اور فوری ادائیگی۔ بعد میں لوگوں نے غداری کی، اور 26ھ میں ابو موسیٰ نے اسے زبردستی لے لیا، عثمان بن ابی العاص نے اس کے آگے بڑھے۔"
  tr: "Osman ibn Abi el-As, 23. yılda veya rivayete göre 24. yılda Sabur şehrine geldi ve halkının Müslümanlardan korktuğunu gördü. Şahrak'ın kardeşi rüyasında bir Arap'ın yanına gelip gömleğini aldığını gördü ve bu onu çok üzdü, bu yüzden bir süre sustu, sonra güvenlik ve barış istedi. Osman da ona kimseyi öldürmemesi, esir almaması, korunması ve para ödemesi şartıyla barış yaptı. Ancak Sabur halkı sözlerini tutmadı ve ihanet etti, bu yüzden şehir 26. yılda zorla fethedildi. Şehri Ebu Musa fethetti ve Osman ibn Abi el-As bu fethin başındaydı."
  id: "Utsman bin Abi al-As datang ke kota Sabur pada tahun 23, atau ada juga yang mengatakan tahun 24, dan ia mendapati penduduknya takut kepada kaum Muslimin. Saudara Shahrak melihat dalam mimpinya seorang pria Arab mendatanginya dan mengambil bajunya, dan itu menyedihkan hatinya, sehingga ia menahan diri untuk sementara waktu, kemudian ia meminta keselamatan dan kedamaian, lalu Utsman berdamai dengannya dengan syarat ia tidak akan membunuh siapa pun atau menawan siapa pun, dan bahwa ia akan mendapat perlindungan dan uang. Kemudian penduduk Sabur mengingkari janji mereka dan berkhianat, sehingga kota itu ditaklukkan pada tahun 26 dengan kekerasan. Abu Musa menaklukkannya, dan Utsman bin Abi al-As menjadi pemimpinnya."
