label: { ar: "لقاء ابن خلدون بالأمير تيمور تحت أسوار دمشق", en: "Ibn Khaldun's Audience with Timur beneath Damascus", es: "Audiencia de Ibn Khaldun con Tamerlán bajo Damasco", fr: "Audience d'Ibn Khaldun avec Timour au pied de Damas", ur: "دمشق کے نیچے تیمور کے ساتھ ابن خلدون کا سامعین", tr: "İbn Haldun'un Şam surları altında Prens Timur ile buluşması", id: "Pertemuan Ibnu Khaldun dengan Pangeran Timur di bawah tembok Damaskus" }
summary:
  ar: "يروي ابن خلدون في العبر بضمير المتكلم أنه لما وصل الخبر إلى مصر بأن الأمير تمر ملك بلاد الروم وخرب سيواس ورجع إلى الشام جمع السلطان الناصر فرج عساكره ونادى بالرحيل وكان ابن خلدون يومئذ معزولاً عن الوظيفة فأراده دواداره يشبك على السفر في ركاب السلطان فتجافى ثم أصاخ فسافر معهم منتصف شهر ربيع الأول سنة ثلاث وثمان مئة فوصلوا غزة ثم سبقوا الططر إلى دمشق وركب الناس ليلاً يعتقدون أن السلطان سار على الطريق الأعظم إلى مصر فساروا إلى شقحب وبقي ابن خلدون بالمدرسة العادلية مع القضاة والفقهاء وأخبره القاضي برهان الدين أن تيمور سأل عنه فلما بلغه خبر تشاجر في الجامع خشي البادرة على نفسه فبكر سحراً إلى جماعة القضاة عند الباب وطلب الخروج أو التدلي من السور فأبوا عليه أولاً ثم أصخوا له ودلوه من السور فوجد بطانة تيمور عند الباب ونائبه شاه ملك من بني جقطاي فحيّوه وقدموا له مركوباً وأوصلوه إلى تيمور فأدخل على خيمة جلوسه وهو متكئ على مرفقه وصحاف الطعام تمر بين يديه يشير بها إلى عصب المغل جلوساً أمام خيمته حلقاً حلقاً فسلم عليه وأومأ إيماءة الخضوع فرفع تيمور رأسه ومد يده إليه فقبلها وأشار بالجلوس ثم استدعى الفقيه عبد الجبار بن النعمان من فقهاء الحنفية بخوارزم فأقعده يترجم ما بينهما وسأله من أين جاء من المغرب ولم جاء فقال جئت من بلادي لقضاء الفرض ركبت إليها البحر ووافيت مرسى الإسكندرية يوم الفطر سنة أربع وثمانين من هذه المائة الثامنة ثم فاوضه في الملك بالعصبية وأن أكثر أمم البشر العرب والترك فرد عليه تيمور أن بختنصر كان قائداً من قواد الفرس كما أنا نائب من نواب صاحب التخت وأشار إلى القائمين وراءه وكتب ابن خلدون له وصف بلاد المغرب فأخذه من يده وأمر موقعه بترجمته إلى اللسان المغلي ونصب تيمور على القلعة ستين منجنيقاً إلى ما يشاكلها فطلبوا الأمان وخرج منها رجل من ذرية الحاكم العباسي الذي نصبه الظاهر بيبرس يسأل منصب الخلافة فاستدعى تيمور الفقهاء والقضاة واستدعى ابن خلدون فيهم فقال الرجل إن الحديث صح بأن الأمر لبني العباس ما بقيت الدنيا فقال برهان الدين بن مفلح الحديث ليس بصحيح وأجمعوا على ذلك ثم شرح ابن خلدون لتيمور أن الخوارج رأوا أن الإمامة لا تجب وأن الشيعة استندوا لحديث الوصية وأن أهل السنة أجمعوا على إنكار الوصية وأن مستند الوجوب هو الاجتهاد وأن أبا هاشم بن محمد بن الحنفية أوصى بها إلى محمد بن علي بن عبد الله بن عباس ثم طلب منه تيمور بغلة كان يركبها وسأله البيع فقال مثلي لا يبيع من مثلك إنما أنا أخدمك بها فحملت البغلة ولم يرها بعد ثم أوصى به ابنه المسافر إلى شقحب فسافر مع القاصد فاعترضتهم جماعة من العشير فنهبوا ما معهم ونجا إلى قرية ثم اتصلوا بالصبيبة وأجازوا إلى صفد فركب مركباً من مراكب ابن عثمان سلطان بلاد الروم فيه رسول كان سافر إليه عن سلطان مصر فركب معهم البحر إلى غزة ثم سافر إلى مصر فوصلها في شعبان سنة ثلاث وثمان مئة وكتب حينئذ كتاباً إلى صاحب المغرب يعرفه بما دار بينه وبين تيمور وكان لما لقيه أولاً أشار عليه بعض الصحاب ممن يخبر أحوالهم بما تقدمت له من المعرفة بهم أن يطرفه ببعض هدية وإن كانت نزرة فهي عندهم متأكدة في لقاء ملوكهم فانتقى من سوق الكتب مصحفاً رائعاً حسناً في جزء محذو وسجادة أنيقة ونسخة من قصيدة البردة المشهورة للبوصيري وأربع علب من حلاوة مصر الفاخرة ودخل عليه وهو بالقصر الأبلق جالس في إيوانه فلما رآه مقبلاً مثل قائماً وأشار إليه عن يمينه فجلس وأكابر الجقطية حفافيه فوضع الهدية فلما رأى المصحف وعرفه قام مبادراً فوضعه على رأسه ثم ناوله السجادة فتناولها وقبلها ثم ناوله البردة فسأله عنها وعن ناظمها فأخبره ووضع علب الحلوى بين يديه وتناول منها حرفاً على العادة في التأنيس ثم قسم ما فيها بين الحاضرين في مجلسه واقتضى منه ابن خلدون مكتوب أمان لأهل دمشق فكتب له وختمه شاه ملك بخاتم السلطان {cite:tarikh-ibn-khaldun-ibar p. 2123-2125}."
  en: "Ibn Khaldun's own account: summoned into Faraj's retinue mid-Rabi' I 803, racing the Tatars to Damascus, then — fearing a rumor and hearing Timur had asked after him — lowered from the city wall at dawn to Timur's deputy Shah Malik, and brought to the conqueror reclining among his dishes and seated Mughul circles, with the Khwarazmian faqih Abd al-Jabbar translating; Timur raised his head, extended his hand to be kissed, and asked how and why he had come from the Maghreb {cite:tarikh-ibn-khaldun-ibar p. 2118-2122}."
  es: "Relato del propio Ibn Khaldun: fue convocado al séquito de Faraj a mediados de Rabi' I de 803, mientras corría contra los tártaros hacia Damasco, y luego, temiendo un rumor y al oír que Timur había preguntado por él, fue bajado de la muralla de la ciudad al amanecer hasta el lugarteniente de Timur, Shah Malik, y llevado ante el conquistador, que se encontraba recostado entre sus platos y los círculos mogoles sentados, con la traducción del faqih de Khwarazmian, Abd al-Jabbar; Timur levantó la cabeza, extendió la mano para ser besada y preguntó cómo y por qué había venido del Magreb {cite:tarikh-ibn-khaldun-ibar p. 2118-2122}."
  fr: "D'après le récit d'Ibn Khaldun lui-même: appelé dans la suite de Faraj au milieu du mois de Rabi' I 803, il fit la course avec les Tatars jusqu'à Damas, puis – craignant une rumeur et ayant entendu dire que Timur s'était renseigné sur lui – il fut descendu des remparts de la ville à l'aube jusqu'au Shah Malik, adjoint de Timur, et amené au conquérant allongé parmi ses plats et les cercles moghols assis, avec le faqih khwarezmien Abd al-Jabbar comme interprète; Timur leva la tête, tendit la main pour être embrassée et demanda comment et pourquoi il était venu du Maghreb {cite:tarikh-ibn-khaldun-ibar p. 2118-2122}."
  ur: "ابن خلدون کا اپنا بیان: ربیع اول 803 کے وسط میں فراج کے دستے میں طلب کیا گیا، تاتاریوں کو دمشق کی طرف دوڑایا گیا، پھر - ایک افواہ کے خوف سے اور تیمور نے اس کے پیچھے پوچھا تھا - صبح کے وقت شہر کی فصیل سے تیمور کے نائب شاہ ملک کے پاس نیچے اترا، اور فاتح کے پاس لایا گیا، اور اس کی نشستوں کے ساتھ مل کر فاتح کے درمیان بیٹھا تھا۔ خوارزمیاں فقیہ عبد الجبار ترجمہ؛ تیمور نے اپنا سر اٹھایا، چومنے کے لیے ہاتھ بڑھایا، اور پوچھا کہ وہ مغرب سے کیسے اور کیوں آیا ہے۔ 2118-2122}۔"
  tr: "İbn Haldun, El-İbar adlı kitabında, Prens Timur'un Bizans İmparatorluğu'nu fethettiği, Sivas'ı yıktığı ve Suriye'ye döndüğü haberi Mısır'a ulaştığında, Sultan el-Nasır Faraj'ın ordusunu toplayıp yola çıkmalarını emrettiğini birinci ağızdan anlatır. O sırada İbn Haldun görevinden alınmış ve kâhyası Yashbak onu Sultan ile birlikte seyahat etmeye ikna etmiştir. Başlangıçta direnmiş, ancak daha sonra razı olmuş ve Hicri 803 yılının Rebiü'l-Evvel ayının ortalarında (Miladi 1403) onlarla birlikte yola çıkmıştır. Gazze'ye ulaşmışlar ve kervanın önünde Şam'a varmışlardır. İnsanlar geceleyin Sultan'ın Mısır'a giden ana yoldan gittiğine inanarak yola çıkmış ve Şakhab'a doğru ilerlemişlerdir. İbn Haldun, kadı ve alimlerle birlikte el-Adiliyye Medresesi'nde kalmıştır. Kadı Burhan el-Din, Timur'un kendisini sorduğunu bildirmiştir. Camide bir kavga çıktığı haberi kendisine ulaştığında, İbn Haldun güvenliğinden endişe etmiştir. Şafak vakti erkenden, kapıdaki yargıçlar grubuna giderek ayrılmak veya surdan aşağı indirilmek istediğini söyledi. Başlangıçta reddettiler, ancak sonra onu dinlediler ve aşağı indirdiler. Kapıda Timur'un maiyetini, aralarında Banu Jaqtai'den Şah Malik'in de bulunduğu kişileri buldu. Onu selamladılar, ona bir binek verdiler ve Timur'un yanına götürdüler. Timur da onu odasına aldı. Dirseğine yaslanmış, önünden geçen yemek tabaklarıyla, çadırının önünde daireler halinde oturan Moğollara işaret etti. Onlar onu selamladılar ve o da boyun eğerek başını salladı. Timur başını kaldırdı, elini uzattı, öptü ve oturmasını işaret etti. Sonra Harezm'in Hanefi hukukçularından Abdülceber ibn el-Nu'man'ı çağırdı ve aralarında tercümanlık yapması için onu oturttu. Ona Mağrip'te nereden geldiğini ve neden geldiğini sordu. \"Dini görevimi yerine getirmek için ülkemden geldim. Oraya yelken açtım ve bu sekizinci yüzyılın 84. yılında Ramazan Bayramı günü İskenderiye limanına vardım.\" diye cevap verdi. Sonra onunla kabile soyuna göre yönetimi ve insanlığın milletlerinin çoğunun Arap ve Türk olduğunu konuştu. Timur, Nebukadnezar'ın tıpkı taht hükümdarının vekili olduğu gibi Perslerin komutanı olduğunu söyledi ve arkasında duranlara işaret etti. İbn Haldun ona Mağrip'in bir tasvirini yazmıştı; Timur bunu elinden aldı ve Moğolca'ya çevirmesini emretti. Timur, kaleye karşı altmış mancınık ve benzeri kuşatma makineleri kurdu. Güvenli geçiş istediler ve Abbasi hükümdarının soyundan gelen, el-Zahir Baybars'ın görevlendirdiği bir adam çıktı ve halifelik makamını istedi. Timur, İbn Haldun da dahil olmak üzere hukukçuları ve yargıçları çağırdı. Adam, halifeliğin dünyanın var olduğu sürece Abbasilerde kalacağına dair hadisin sahih olduğunu söyledi. Burhan el-Din ibn Muflih ise hadisin sahih olmadığını söyledi ve hepsi bu konuda hemfikir oldu. Sonra İbn Haldun, Timur'a Haricilerin halifeliğin farz olmadığına inandığını, Şiilerin vasiyet hadisine dayandığını ve Sünnilerin oybirliğiyle vasiyet kavramını reddettiğini ve farz olmasının temelinin içtihat (bağımsız akıl yürütme) olduğunu açıkladı. Ayrıca Ebu Haşim ibn Muhammed ibn el-Hanefiyye'nin halifeliği Muhammed ibn Ali ibn Abdullah ibn Abbas'a miras bıraktığını ekledi. Bunun üzerine Timur, bindiği katırı istedi ve ona satmayı teklif etti. İbn Haldun, kendisi gibi birinin kendisi gibi birine satmayacağını, sadece ona hizmet etmesi için kullandığını söyledi. Böylece katır götürüldü ve Timur onu bir daha hiç görmedi. Timur daha sonra, Şakhab'a seyahat eden oğluna onun bakımını emanet etti. Elçiyle birlikte yolculuk etti, ancak bir grup kabile mensubu onlara saldırdı ve mallarını yağmaladı. Bir köye kaçtı, sonra Subeybe'ye ulaştı ve Safed'e geçti. Bizans İmparatorluğu Sultanı İbn Osman'a ait bir gemiye bindi; bu gemide Mısır Sultanı adına kendisine gelen bir elçi de vardı. Onlarla birlikte Gazze'ye yelken açtı, sonra Mısır'a gitti ve oraya vardı. Hicri 803 yılının Şaban ayında, Fas hükümdarına Timur ile arasında geçenleri anlatan bir mektup yazdı. Timur ile ilk karşılaştığında, işlerine aşina olan bazı arkadaşları, krallarıyla görüşmenin gerekli olduğunu düşündükleri için, ona ne kadar küçük olursa olsun bir hediye vermesini tavsiye etmişlerdi. Böylece kitap pazarından tek ciltlik, enfes bir Kur'an, zarif bir halı, Busiri'nin ünlü Burda şiirinin bir kopyası ve dört kutu enfes Mısır tatlısı seçti. Timur, Ablaq Sarayı'ndaki özel odasında otururken yanına girdi. Yaklaştığını gören Timur ayağa kalktı ve sağındaki kişiyi işaret etti; bunun üzerine İbn Haldun, Jaqtiyya kabilesinin önde gelen isimleriyle çevrili olarak oturdu. Hediyeyi önüne koydu. Timur Kur'an'ı görünce hemen ayağa kalktı ve başına koydu. Sonra ona halıyı uzattı, Timur halıyı kabul edip öptü. Ardından ona Burda şiirini sundu; Timur şiirin yazarı hakkında bilgi aldı. Daha sonra tatlı kutularını önüne koydu ve adet olduğu üzere birinden bir mektup aldı. Ardından içeriği mecliste bulunanlara dağıttı. İbn Haldun, Şam halkı için yazılı bir güvenlik garantisi istedi ve Timur bunu kabul etti. Şah Malik, belgeyi Sultanın mührüyle mühürledi {cite:tarikh-ibn-khaldun-ibar s. 2123-2125}."
  id: "Ibn Khaldun, dalam kitabnya Al-Ibar, menceritakan dalam sudut pandang orang pertama bahwa ketika berita sampai ke Mesir bahwa Pangeran Timur telah menaklukkan Kekaisaran Bizantium, menghancurkan Siwa, dan kembali ke Suriah, Sultan al-Nasir Faraj mengumpulkan pasukannya dan memerintahkan keberangkatan mereka. Pada saat itu, Ibn Khaldun diberhentikan dari jabatannya, dan pengawalnya, Yashbak, mendesaknya untuk ikut bersama Sultan. Awalnya ia menolak, tetapi kemudian mengalah dan ikut bersama mereka pada pertengahan Rabi' al-Awwal tahun 803 H (1403 M). Mereka sampai di Gaza dan kemudian, mendahului kafilah, sampai di Damaskus. Orang-orang keluar pada malam hari, percaya bahwa Sultan telah mengambil jalan utama ke Mesir, dan melanjutkan perjalanan ke Shaqhab. Ibn Khaldun tinggal di Madrasah al-Adiliyya bersama para hakim dan ulama. Hakim Burhan al-Din memberitahunya bahwa Timur telah menanyakan tentang dirinya. Ketika berita tentang pertengkaran di masjid sampai kepadanya, Ibn Khaldun khawatir akan keselamatannya. Pagi-pagi sekali, ia pergi ke sekelompok hakim di gerbang dan meminta untuk pergi atau diturunkan dari tembok. Awalnya mereka menolak, tetapi kemudian mendengarkan dan menurunkannya. Ia menemukan rombongan Timur di gerbang, termasuk wakilnya, Shah Malik dari Banu Jaqtai. Mereka menyambutnya, memberinya tunggangan, dan mengantarnya ke Timur, yang kemudian membawanya ke kamarnya. Sambil bersandar pada sikunya, dengan piring-piring makanan yang dihidangkan di depannya, ia memberi isyarat ke arah orang-orang Mongol, yang duduk melingkar di depan tendanya. Mereka menyambutnya dan ia mengangguk tanda tunduk. Timur mengangkat kepalanya dan mengulurkan tangannya, yang diciumnya, dan memberi isyarat agar ia duduk. Kemudian ia memanggil ahli hukum Abd al-Jabbar ibn al-Nu'man, salah satu ahli hukum Hanafi dari Khwarazm, dan mendudukkannya untuk menerjemahkan di antara mereka. Ia bertanya kepadanya dari mana ia berasal di Maghreb dan mengapa ia datang. Ia menjawab, \"Aku datang dari negeriku untuk memenuhi kewajiban agamaku. Aku berlayar ke sana dan tiba di pelabuhan Alexandria pada hari Idul Fitri tahun 84 abad kedelapan ini.\" Kemudian ia membahas tentang pemerintahan melalui garis keturunan suku, dan bahwa sebagian besar bangsa manusia adalah Arab dan Turki. Timur menjawab bahwa Nebukadnezar adalah seorang komandan Persia, sama seperti ia adalah wakil penguasa takhta, dan ia memberi isyarat kepada orang-orang yang berdiri di belakangnya. Ibn Khaldun telah menuliskan deskripsi tentang Maghreb untuknya, yang diambilnya dari tangannya dan memerintahkan penerjemahnya ke dalam bahasa Mongol. Timur memasang enam puluh ketapel dan mesin pengepungan serupa di benteng itu. Mereka meminta jalan aman, dan seorang pria dari keturunan penguasa Abbasiyah, yang telah diangkat oleh al-Zahir Baybars, keluar dari sana, meminta posisi Khalifah. Timur memanggil para ahli hukum dan hakim, termasuk Ibn Khaldun. Orang itu mengatakan bahwa hadits yang menyatakan bahwa kekhalifahan akan tetap berada di tangan Abbasiyah selama dunia masih ada adalah sahih. Burhan al-Din ibn Muflih mengatakan bahwa hadits itu tidak sahih, dan mereka semua sepakat tentang hal ini. Kemudian Ibn Khaldun menjelaskan kepada Timur bahwa kaum Kharijites percaya bahwa kekhalifahan tidak wajib, bahwa kaum Syiah bergantung pada hadits wasiat, dan bahwa kaum Sunni secara bulat menolak konsep wasiat, dan bahwa dasar kewajibannya adalah ijtihad (penalaran independen). Dia menambahkan bahwa Abu Hashim ibn Muhammad ibn al-Hanafiyya telah mewariskannya kepada Muhammad ibn Ali ibn Abdullah ibn Abbas. Kemudian Timur meminta keledai yang ditungganginya dan menawarkan untuk menjualnya kepadanya. Ibn Khaldun menjawab bahwa orang seperti dia tidak akan menjual kepada orang seperti dia, tetapi dia hanya menggunakannya untuk melayaninya. Maka keledai itu diambil, dan Timur tidak pernah melihatnya lagi. Kemudian Timur mempercayakan putranya, yang sedang dalam perjalanan ke Shaqhab, untuk mengurus dirinya. Ia melakukan perjalanan bersama utusan tersebut, tetapi sekelompok suku menyerang mereka dan menjarah harta benda mereka. Ia melarikan diri ke sebuah desa, kemudian sampai di al-Subayba dan menyeberang ke Safed. Ia menaiki kapal milik Ibn Uthman, Sultan Kekaisaran Bizantium, yang membawa seorang utusan yang telah melakukan perjalanan kepadanya atas nama Sultan Mesir. Ia berlayar bersama mereka ke Gaza, kemudian melakukan perjalanan ke Mesir dan tiba di sana. Pada bulan Sya'ban tahun 803 H, ia menulis surat kepada penguasa Maroko yang memberitahukan apa yang telah terjadi antara dirinya dan Timur. Ketika pertama kali bertemu Timur, beberapa sahabatnya, yang mengetahui urusan mereka, menyarankan agar ia memberikan hadiah, sekecil apa pun, karena mereka menganggap penting untuk bertemu raja mereka. Maka ia memilih dari pasar buku sebuah Al-Qur'an yang bagus dan indah dalam satu jilid, sebuah permadani yang elegan, salinan puisi Burda yang terkenal karya al-Busiri, dan empat kotak permen Mesir yang lezat. Ia menemui Timur ketika Timur sedang duduk di kamar pribadinya di Istana Ablaq. Melihatnya mendekat, Timur berdiri dan memberi isyarat agar ia duduk di sebelah kanannya, lalu ia duduk, dikelilingi oleh tokoh-tokoh terkemuka suku Jaqtiyya. Ia meletakkan hadiah di hadapannya. Ketika Timur melihat Al-Qur'an dan mengenalinya, ia segera berdiri dan meletakkannya di atas kepalanya. Kemudian ia menawarkan permadani, yang diterima dan dicium oleh Timur. Selanjutnya, ia menawarkan puisi Burda, yang ditanyakan Timur tentang pengarangnya, dan ia diberi tahu. Kemudian ia meletakkan kotak-kotak berisi manisan di hadapannya dan, seperti biasa, mengambil surat dari salah satunya. Kemudian ia membagikan isinya kepada orang-orang yang hadir dalam pertemuan tersebut. Ibn Khaldun meminta jaminan tertulis atas keselamatan penduduk Damaskus, yang diberikan Timur. Shah Malik menyegelnya dengan stempel Sultan {cite:tarikh-ibn-khaldun-ibar p. 2123-2125}."
