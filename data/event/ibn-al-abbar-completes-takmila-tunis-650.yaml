label:
  ar: "ابن الأبار يتم «التكملة لكتاب الصلة» بتونس، نحو ٦٥٠هـ"
  en: "Ibn al-Abbar finishes al-Takmila li-Kitab al-Sila at Tunis, ~650/1252"
  ur: "ابن ابار نے تونس میں «التکملة لکتاب الصلة» مکمل کی، ~650ھ/1252ء"
  es: "Ibn al-Abbar termina al-Takmila li-Kitab al-Sila en Túnez, ~650/1252"
  fr: "Ibn al-Abbar termine al-Takmila li-Kitab al-Sila à Tunis, ~650/1252"
  tr: "İbn el-Abbar, \"Bağlantı Kitabının Ek Bölümü\"nü Hicri 650 civarında Tunus'ta tamamladı."
  id: "Ibn al-Abbar menyelesaikan \"Tambahan untuk Kitab Hubungan\" di Tunis, sekitar tahun 650 H."
summary:
  ar: "أتم ابن الأبار بتونس «كتاب التكملة لكتاب الصلة»، تتمةً لـ«صلة» ابن بشكوال التي كان شيخه أبو الربيع بن سالم قد حمله على إتمامها، فصارت من أعظم معاجم تراجم أعلام الأندلس؛ وهو صاحب نحو خمسة عشر تصنيفًا في نحو خمسة وأربعين مجلدًا، منها «المعجم في أصحاب الصدفي» و«الحلة السيرة» و«تحفة القادم» و«إعتاب الكتاب» و«درر السمت» {cite:encyclopaedia-of-islam-2 vol. 3 p. 705-706}."
  en: "At Tunis Ibn al-Abbar finished the Kitab al-Takmila li-Kitab al-Sila, the continuation of Ibn Bashkuwal's Sila that his master Abu al-Rabi' ibn Salim had urged him to complete — it became one of the great biographical dictionaries of Andalusian notables. He authored some fifteen works in about forty-five volumes, among them the Mu'jam fi ashab al-Sadafi, al-Hulla al-siyara, Tuhfat al-kadim, I'tab al-kuttab and Durar al-simt {cite:encyclopaedia-of-islam-2 vol. 3 p. 705-706}."
  ur: "ابن ابار نے تونس میں «التکملة لکتاب الصلة» مکمل کی جو ابن بشکوال کی «صلة» کا تتمہ ہے اور جسے اس کے شیخ ابو الربیع بن سالم نے مکمل کرنے کا کہا تھا — یہ اندلس کے اعلام کے عظیم تراجم معجموں میں شمار ہوا۔ اس کی تقریباً پندرہ تصانیف نحو پینتالیس جلدوں میں ہیں، جن میں «معجم فی اصحاب الصدفی»، «الحلة السیرا»، «تحفة القادم»، «إعتاب الکتاب» اور «درر السمت» شامل ہیں {cite:encyclopaedia-of-islam-2 vol. 3 p. 705-706}."
  es: "En Túnez, Ibn al-Abbar terminó el Kitab al-Takmila li-Kitab al-Sila, continuación del Sila de Ibn Bashkuwal que su maestro Abu al-Rabi' ibn Salim le había instado a completar; se convirtió en uno de los grandes diccionarios biográficos de notables andalusíes. Fue autor de unas quince obras en unos cuarenta y cinco volúmenes, entre ellas el Mu'jam fi ashab al-Sadafi, al-Hulla al-siyara, Tuhfat al-kadim, I'tab al-kuttab y Durar al-simt {cite:encyclopaedia-of-islam-2 vol. 3 p. 705-706}."
  fr: "À Tunis, Ibn al-Abbar acheva le Kitab al-Takmila li-Kitab al-Sila, la suite du Sila d'Ibn Bashkuwal, que son maître Abu al-Rabi' ibn Salim l'avait incité à terminer; cet ouvrage devint l'un des plus importants dictionnaires biographiques des notables andalous. Il est l'auteur d'une quinzaine d'ouvrages en quarante-cinq volumes environ, parmi lesquels le Mu'jam fi ashab al-Sadafi, al-Hulla al-siyara, Tuhfat al-kadim, I'tab al-kuttab et Durar al-simt (encyclopédie de l'islam, vol. 3, p. 705-706)."
  tr: "İbn el-Abbar, şeyhi Ebu el-Rabi' ibn Salim'in tamamlaması için teşvik ettiği İbn Başkuwal'ın \"Bağlantı\" adlı eserinin devamı niteliğindeki \"Bağlantı Kitabının Tamamlanması\"nı Tunus'ta tamamladı. Bu eser, Endülüs'ün ileri gelenlerinin en büyük biyografik sözlüklerinden biri oldu. Yaklaşık kırk beş ciltte on beş civarında eserin yazarıdır; bunlar arasında \"Sadafi Sahabelerinin Sözlüğü\", \"Biyografinin Giysisi\", \"Yeni Gelenin Armağanı\", \"Kitabın Kınaması\" ve \"Yolun İncileri\" yer almaktadır. {cite:encyclopaedia-of-islam-2 vol. 3 p. 705-706}."
  id: "Ibn al-Abbar menyelesaikan di Tunis “Penyelesaian Kitab Hubungan,” sebuah kelanjutan dari “Hubungan” karya Ibn Bashkuwal, yang atas dorongan syekhnya, Abu al-Rabi’ ibn Salim. Karya ini menjadi salah satu kamus biografi terbesar para tokoh terkemuka Andalusia. Ia adalah penulis sekitar lima belas karya dalam sekitar empat puluh lima jilid, termasuk “Kamus Para Sahabat al-Sadafi,” “Pakaian Biografi,” “Karunia Pendatang Baru,” “Celaan Kitab,” dan “Mutiara Jalan.” {cite:encyclopaedia-of-islam-2 vol. 3 p. 705-706}."
