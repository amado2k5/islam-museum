label:
  ar: "يقتل ابن ذي الطوق عيسى اليافعي غدرا في منتصف صفر سنة 294هـ، ص393"
  en: "Ibn Dhi al-Tawq kills Isa al-Yafi'i by treachery in mid-Safar 294 AH, p. 393"
  ur: "ابن ذی الطوق صفر 294ھ کے وسط میں عیسیٰ الیافعی کو دھوکے سے قتل کرتا ہے، ص393"
  es: "Ibn Dhi al-Tawq mata a Isa al-Yafi'i por traición a mediados de Safar 294 AH, p. 393"
summary:
  ar: "في منتصف صفر سنة 294هـ يثب ابن ذي الطوق على عيسى اليافعي فيقتله مع جماعة من أصحابه غدرا، فيستأمن أصحاب اليافعي إلى صنعاء."
  en: "In mid-Safar 294 AH Ibn Dhi al-Tawq kills Isa al-Yafi'i and some of his companions by treachery. Al-Yafi'i's surviving followers seek safety in Sanaa."
  ur: "صفر 294ھ کے وسط میں ابن ذی الطوق عیسیٰ الیافعی اور ان کے کئی ساتھیوں کو دھوکے سے قتل کرتا ہے، اور الیافعی کے بچ جانے والے ساتھی صنعاء میں امان طلب کرتے ہیں۔"
  es: "A mediados del mes de Safar del año 294 de la Hégira, Ibn Dhi al-Tawq asesinó a Isa al-Yafi'i y a algunos de sus compañeros mediante una traición. Los seguidores supervivientes de Al-Yafi'i buscaron refugio en Sanaa."
