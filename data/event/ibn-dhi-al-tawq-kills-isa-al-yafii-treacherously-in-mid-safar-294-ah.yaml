id: "event/ibn-dhi-al-tawq-kills-isa-al-yafii-treacherously-in-mid-safar-294-ah"
class: event
kind: other
label:
  ar: "يقتل ابن ذي الطوق عيسى اليافعي غدرا في منتصف صفر سنة 294هـ، ص393"
  en: "Ibn Dhi al-Tawq kills Isa al-Yafi'i by treachery in mid-Safar 294 AH, p. 393"
  ur: "ابن ذی الطوق صفر 294ھ کے وسط میں عیسیٰ الیافعی کو دھوکے سے قتل کرتا ہے، ص393"
  es: "Ibn Dhi al-Tawq mata a Isa al-Yafi'i por traición a mediados de Safar 294 AH, p. 393"
  fr: "Ibn Dhi al-Tawq tue Isa al-Yafi'i par trahison au milieu du Safar 294 AH, p. 393"
  tr: "İbn Zı el-Tavk, Hicri 294 yılında Safer ayının ortasında haince İsa el-Yafiî'yi öldürdü (s. 393)."
  id: "Ibn Dhi al-Tawq dengan licik membunuh Isa al-Yafi’i di tengah bulan Safar pada tahun 294 H, hlm. 393"
summary:
  ar: "في منتصف صفر سنة 294هـ يثب ابن ذي الطوق على عيسى اليافعي فيقتله مع جماعة من أصحابه غدرا، فيستأمن أصحاب اليافعي إلى صنعاء."
  en: "In mid-Safar 294 AH Ibn Dhi al-Tawq kills Isa al-Yafi'i and some of his companions by treachery. Al-Yafi'i's surviving followers seek safety in Sanaa."
  ur: "صفر 294ھ کے وسط میں ابن ذی الطوق عیسیٰ الیافعی اور ان کے کئی ساتھیوں کو دھوکے سے قتل کرتا ہے، اور الیافعی کے بچ جانے والے ساتھی صنعاء میں امان طلب کرتے ہیں۔"
  es: "A mediados del mes de Safar del año 294 de la Hégira, Ibn Dhi al-Tawq asesinó a Isa al-Yafi'i y a algunos de sus compañeros mediante una traición. Los seguidores supervivientes de Al-Yafi'i buscaron refugio en Sanaa."
  fr: "À la mi-Safar 294 AH, Ibn Dhi al-Tawq assassine Isa al-Yafi'i et certains de ses compagnons par traîtrise. Les survivants d'al-Yafi'i se réfugient à Sanaa."
  tr: "Hicri 294 yılının Safer ayının ortalarında İbn Zı el-Tavk, İsa el-Yafiî'ye haince saldırdı ve onu ve bir grup arkadaşını öldürdü. Bunun üzerine El-Yafiî'nin arkadaşları Sana'a'ya sığındılar."
  id: "Pada pertengahan bulan Safar tahun 294 Hijriah, Ibnu Dhi al-Tawq menyerang Isa al-Yafi’i dan membunuhnya beserta sekelompok sahabatnya dengan cara yang licik. Para sahabat al-Yafi’i kemudian mencari perlindungan di Sana’a."
