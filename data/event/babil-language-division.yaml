label: { ar: "تفرق الألسنة ببابل", en: "The division of tongues at Babel" }
summary:
  ar: "في ملك النمروذ بن كوش بن حام هاجت الريح التي نسفت صرح النمروذ ببابل من أرض العراق فبات الناس ولسانهم سرياني وأصبحوا وقد تفرقت لغاتهم على اثنين وسبعين لساناً فسمي الموضع من ذلك الوقت بابل، فصار منها في ولد سام تسعة عشر لساناً وفي ولد حام ستة عشر لساناً وفي ولد يافث سبعة وثلاثون لساناً {cite:muruj-al-dhahab p. 448}."
  en: "In Nimrod's reign the wind that wrecked his tower left mankind's single Syriac tongue split into seventy-two languages overnight — nineteen to Shem's line, sixteen to Ham's, thirty-seven to Japheth's — whence the name Babel {cite:muruj-al-dhahab p. 448}."
