label: { ar: "تفرق الألسنة ببابل", en: "The division of tongues at Babel", fr: "La division des langues à Babel", es: "La división de lenguas en Babel", ur: "بابل میں زبانوں کی تقسیم", tr: "Babil dilleri bölünmüştü.", id: "Bahasa-bahasa di Babilonia terbagi-bagi" }
summary:
  ar: "في ملك النمروذ بن كوش بن حام هاجت الريح التي نسفت صرح النمروذ ببابل من أرض العراق فبات الناس ولسانهم سرياني وأصبحوا وقد تفرقت لغاتهم على اثنين وسبعين لساناً فسمي الموضع من ذلك الوقت بابل، فصار منها في ولد سام تسعة عشر لساناً وفي ولد حام ستة عشر لساناً وفي ولد يافث سبعة وثلاثون لساناً {cite:muruj-al-dhahab p. 448}."
  en: "In Nimrod's reign the wind that wrecked his tower left mankind's single Syriac tongue split into seventy-two languages overnight — nineteen to Shem's line, sixteen to Ham's, thirty-seven to Japheth's — whence the name Babel {cite:muruj-al-dhahab p. 448}."
  fr: "Sous le règne de Nemrod, le vent qui détruisit sa tour laissa la langue syriaque unique de l'humanité divisée en soixante-douze langues en une nuit : dix-neuf pour la lignée de Sem, seize pour celle de Cham, trente-sept pour celle de Japhet ; d'où le nom de Babel {cite:muruj-al-dhahab p. 448}."
  es: "En el reinado de Nimrod, el viento que destruyó su torre hizo que la única lengua siríaca de la humanidad se dividiera de la noche a la mañana en setenta y dos lenguas: diecinueve para el linaje de Sem, dieciséis para el de Cam y treinta y siete para el de Jafet; de ahí el nombre de Babel {cite:muruj-al-dhahab p. 448}."
  ur: "نمرود کے دور حکومت میں جس ہوا نے اس کے مینار کو تباہ کر دیا اس نے بنی نوع انسان کی واحد سریانی زبان کو راتوں رات اکہتر زبانوں میں تقسیم کر دیا - انیس کو شیم کی لائن، سولہ کو حمز کی، سینتیس کو یافث کی - اسی وجہ سے بابل کا نام {حوالہ: مروج الذہب ص. 448}۔"
  tr: "Ham'ın oğlu Kuş'un oğlu Nemrod'un hükümdarlığı döneminde, Babil'deki Nemrod sarayını uçuran rüzgar Irak topraklarından esti. Halk Süryanice diliyle uykuya daldı ve yetmiş iki dile bölünmüş dillerle uyandı. O zamandan beri o yere Babil adı verildi. Bundan sonra Şem'in soyundan gelenler arasında on dokuz dil, Ham'ın soyundan gelenler arasında on altı dil ve Yafet'in soyundan gelenler arasında otuz yedi dil kaldı. {cite:muruj-al-dhahab s. 448}"
  id: "Pada masa pemerintahan Nimrod, putra Kush, putra Ham, angin yang menerbangkan istana Nimrod di Babilonia berasal dari tanah Irak. Orang-orang tertidur dengan bahasa Siria mereka, dan bangun dengan bahasa mereka terbagi menjadi tujuh puluh dua bahasa. Sejak saat itu tempat itu disebut Babilonia. Dari sana terdapat sembilan belas bahasa di antara keturunan Sem, enam belas bahasa di antara keturunan Ham, dan tiga puluh tujuh bahasa di antara keturunan Yafet. {cite:muruj-al-dhahab p. 448}"
