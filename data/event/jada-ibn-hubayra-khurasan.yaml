label: { ar: "بعث جعدة بن هبيرة إلى خراسان وامتناع نيسابور", en: "Jaʿda ibn Hubayra's Khurāsān mission and Naysābūr's defiance (37 AH)", es: "La misión de Jaʿda ibn Hubayra en Khurāsān y el desafío de Naysābūr (37 AH)", fr: "La mission de Jaʿda ibn Hubayra au Khurāsān et la rébellion de Naysābūr (37 AH)", ur: "جعدہ بن ہبیرہ کا خراسان مشن اور نیصابور کی مخالفت ⁦(37ھ)⁩" }
date:
