summary:
  ar: "بعث عليّ جعدة بن هبيرة المخزومي إلى خراسان بعد عوده من صفين، فانتهى إلى نيسابور وقد كفر أهلها وامتنعوا، فرجع إلى علي، فبعث خُليد بن قرة اليربوعي فحاصر أهلها حتى صالحوه، وصالحه أهل مرو أيضًا {cite:kamil-ibn-al-athir p. 678}."
  en: "After Ṣiffīn ʿAli sent Jaʿda ibn Hubayra al-Makhzūmī to Khurāsān; Naysābūr had apostatized and shut its gates, and Jaʿda returned. ʿAli then sent Khulayd ibn Qurra al-Yarbūʿī, who besieged the town until it surrendered on terms — and Merv made peace with him likewise {cite:kamil-ibn-al-athir p. 678}."
  es: "Después de que Ṣiffīn ʿAli enviara a Jaʿda ibn Hubayra al-Makhzūmī a Khurāsān, Naysābūr había apostatado y cerrado sus puertas, y Jaʿda regresó. Entonces ʿAli envió a Khulayd ibn Qurra al-Yarbūʿī, quien sitió la ciudad hasta que se rindió bajo ciertas condiciones, y Merv también hizo la paz con él {cite:kamil-ibn-al-athir p. 678}."
  fr: "Après que Ṣiffīn ʿAli eut envoyé Jaʿda ibn Hubayra al-Makhzūmī à Khurāsān, Naysābūr ayant apostasié et fermé ses portes, Jaʿda retourna. ʿAli envoya alors Khulayd ibn Qurra al-Yarbūʿī, qui assiégea la ville jusqu'à sa reddition, et Merv fit également la paix avec lui (voir: kamil-ibn-al-athir p. 678)."
  ur: "صفین کے بعد علی نے جعدہ بن حبیرہ المخزومی کو خراسان بھیجا۔ نیصابور نے مرتد ہو کر اس کے دروازے بند کر دیے تھے اور جادہ واپس آ گیا۔ اس کے بعد علی نے خلید بن قرہ الیربوعی کو بھیجا جس نے اس قصبے کا محاصرہ کر لیا یہاں تک کہ اس نے شرائط پر ہتھیار ڈال دیے اور مرو نے اسی طرح اس سے صلح کر لی۔ 678}۔"
