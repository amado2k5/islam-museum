summary:
  ar: "بعث عليّ جعدة بن هبيرة المخزومي إلى خراسان بعد عوده من صفين، فانتهى إلى نيسابور وقد كفر أهلها وامتنعوا، فرجع إلى علي، فبعث خُليد بن قرة اليربوعي فحاصر أهلها حتى صالحوه، وصالحه أهل مرو أيضًا {cite:kamil-ibn-al-athir p. 678}."
  en: "After Ṣiffīn ʿAli sent Jaʿda ibn Hubayra al-Makhzūmī to Khurāsān; Naysābūr had apostatized and shut its gates, and Jaʿda returned. ʿAli then sent Khulayd ibn Qurra al-Yarbūʿī, who besieged the town until it surrendered on terms — and Merv made peace with him likewise {cite:kamil-ibn-al-athir p. 678}."
