label: { ar: "عطاء زينب بنت جحش ودعاؤها", en: "Zaynab bint Jahsh's Stipend and her Prayer", es: "El estipendio de Zaynab bint Jahsh y su oración", fr: "La bourse de Zaynab bint Jahsh et sa prière", ur: "زینب بنت جحش کا وظیفہ اور ان کی نماز", tr: "Zeyneb bint Cahş'ın hediyesi ve duası", id: "Hadiah dan doa dari Zainab bint Jahsh" }
summary:
  ar: "لما خرج العطاء أرسل عمر إلى زينب بنت جحش بالذي لها فلما أدخل إليها قالت غفر الله لعمر غيري من أخواتي كانت أقوى على قسم هذا مني قالوا هذا كله لك قالت سبحان الله واستترت منه بثوب ثم قالت صبوه واطرحوا عليه ثوباً ثم قالت لبرزة بنت رافع أدخلي يديك واقبضي منه قبضة فاذهبي بها إلى بني فلان وبني فلان من ذوي رحمها وأيتامها فقسمته حتى بقيت بقية تحت الثوب فقالت برزة غفر الله لك يا أم المؤمنين والله لقد كان لنا في هذا المال حق قل كم ما تحت الثوب فوجدوا تحته خمس مائة وثمانين درهماً ثم رفعت يدها إلى السماء فقالت اللهم لا يدركني عطاء لعمر بعد عامي هذا فماتت وفي رواية ابن شهاب فرض عمر لأزواج النبي اللاتي نكح نكاحاً اثني عشر ألف درهم وفرض لجويرية وصفية بنت حيي ستة آلاف ستة آلاف لأنهما كانتا مما أفاء الله على رسوله وفرض للمهاجرين الذين شهدوا بدراً خمسة آلاف وللأنصار الذين شهدوا بدراً أربعة آلاف وعم بفريضته كل صريح وحليف ومولى شهد بدراً وفي رواية مصعب بن سعد فرض لأهل بدر في ستة آلاف ولامهات المؤمنين في عشرة آلاف وفضل عائشة بألفين لحب رسول الله إياها وفرض لصفية وجويرية في ستة آلاف ولنساء من المهاجرات في ألف ألف منهن أم عبد وقال قيس بن أبي حازم فرض لأهل بدر عربهم ومواليهم في خمسة آلاف وقال لا فضلهم على من سواهم وكان فيهم خمسة من العجم منهم تميم الداري وبلال وسمع الشيخ عمر يقول لئن بقيت إلى قابل لألحقن سفلة المهاجرين في ألفين."
  en: "When the stipends issued Umar sent Zaynab bint Jahsh hers; 'God forgive Umar — my sisters were worthier of sharing this than I' — 'it is all yours' — she veiled it with cloth, had Barza bint Rafi' take fistfuls to her kinsfolk and orphans till five hundred and eighty remained beneath, and prayed: 'God, let no stipend of Umar's reach me past this year' — and she died. Ibn Shihab's register: twelve thousand to the consummated wives, six each to Juwayriya and Safiyya as fay'-born, five thousand to Muhajir Badris, four to Ansari Badris, sarih and halif and mawla equal; Mus'ab ibn Sa'd's: six thousand Badris, ten thousand the mothers, Aisha plus two thousand for the Prophet's love; and of their five Ajam, Tamim al-Dari and Bilal. 'If I live to next year I will set the humblest Muhajirun at two thousand'."
  es: "Cuando se emitieron los estipendios, Umar envió el suyo a Zaynab bint Jahsh; 'Dios perdone a Umar, mis hermanas eran más dignas de compartir esto que yo', 'es todo tuyo', ella lo cubrió con una tela, hizo que Barza bint Rafi' tomara puñados para sus parientes y huérfanos hasta que quedaron quinientos ochenta debajo, y oró: 'Dios, que ningún estipendio de Umar me llegue después de este año', y murió. El registro de Ibn Shihab: doce mil para las esposas consumadas, seis para Juwayriya y Safiyya como nacidas de fay', cinco mil para los Badris Muhajir, cuatro para los Badris Ansari, sarih, halif y mawla iguales; el de Mus'ab ibn Sa'd: seis mil Badris, diez mil las madres, Aisha más dos mil por el amor del Profeta; y de sus cinco Ajam, Tamim al-Dari y Bilal. 'Si llego al año que viene, fijaré el Muhajirun más humilde en dos mil'."
  fr: "Lorsque les allocations furent distribuées, Umar envoya la sienne à Zaynab bint Jahsh; « Que Dieu pardonne à Umar, mes sœurs étaient plus dignes de la recevoir que moi », dit-elle, « elle est entièrement à toi ». Elle la recouvrit d'un voile, chargea Barza bint Rafi' d'en distribuer des poignées à ses proches et aux orphelins jusqu'à ce qu'il en reste cinq cent quatre-vingts, et pria: « Ô Dieu, qu'aucune allocation d'Umar ne me parvienne après cette année », puis elle mourut. Registre d'Ibn Shihab: douze mille pour les épouses consommées, six chacune pour Juwayriya et Safiyya comme nées fay', cinq mille pour les Badris Muhajir, quatre pour les Badris Ansari, sarih, halif et mawla égaux; celui de Mus'ab ibn Sa'd: six mille Badris, dix mille pour les mères, Aisha plus deux mille pour l'amour du Prophète; et parmi leurs cinq Ajam, Tamim al-Dari et Bilal. « Si je vis jusqu'à l'année prochaine, j'établirai le nombre le plus modeste de Muhajirun à deux mille. »"
  ur: "جب وظیفہ جاری ہوا تو عمر نے زینب بنت جحش کو بھیجا۔ 'خدا عمر کو معاف کر دے - میری بہنیں مجھ سے زیادہ یہ شیئر کرنے کے لائق تھیں' - 'یہ سب تمہارا ہے' - اس نے اسے کپڑے سے ڈھانپ دیا، برزہ بنت رفیع اپنے رشتہ داروں اور یتیموں کو مٹھی بھر لے گئے یہاں تک کہ پانچ سو اسی نیچے رہ گئے، اور دعا کی: 'خدایا، عمر کا کوئی وظیفہ نہ پہنچے - اور وہ اس سال مر گئی'۔ ابن شہاب کا رجسٹر: ازواج مطہرات کے لیے بارہ ہزار، جویریہ اور صفیہ کو چھ چھ، فی ولادت، مہاجر بدری کو پانچ ہزار، انصاری بدری کے لیے چار، صریح اور حلف اور مولا برابر؛ مصعب بن سعد: چھ ہزار بدری، دس ہزار مائیں، عائشہ کے علاوہ دو ہزار محبت رسول کے لیے۔ اور ان کے پانچ عجم میں سے تمیم الداری اور بلال۔ 'اگر میں اگلے سال تک زندہ رہا تو سب سے عاجز مہاجرین کو دو ہزار مقرر کروں گا'۔"
  tr: "Ödenek dağıtıldığında Ömer, Zeynep bint Cahş'a payını gönderdi. Ona getirildiğinde, \"Allah Ömer'i affetsin! Kız kardeşlerimden bazıları bunu benden daha iyi dağıtabilirdi\" dedi. Onlar, \"Bunların hepsi senin\" dediler. Zeynep, \"Allah'a şükür!\" dedi ve kendini bir elbiseyle örttü. Sonra, \"Dökün ve başka bir elbiseyle örtün\" dedi. Sonra Berze bint Rafi'ye, \"Ellerini içine sok, bir avuç al ve filancanın oğullarına, filancanın oğullarına, akrabalarına ve yetimlerine götür\" dedi. Böylece elbisenin altında bir miktar kalana kadar dağıttı. Berze, \"Ey Müminlerin Annesi, Allah seni affetsin! Allah'a yemin ederim ki, bu paraya hakkımız vardı. Elbisenin altında ne kadar olduğunu söyle bana\" dedi. Elbisenin altında beş yüz seksen dirhem buldular. Sonra ellerini göğe kaldırdı ve \"Ey Allah'ım, bu yıldan sonra Ömer'den artık hiçbir maaş almayayım\" dedi. Sonra vefat etti. İbn Şihab'ın rivayetine göre, Ömer, evlendiği Peygamber eşlerine on iki bin dirhem, Cüveyriye ve Safiye bint Huyayy'ye ise altı biner dirhem ayırdı; çünkü onlar Allah'ın Resulüne bahşettiği ganimetler arasındaydılar. Bedir'e şahit olan Muhacirlere beş bin dirhem, Bedir'e şahit olan Ensar'a dört bin dirhem ayırdı ve bu payı herkese genel olarak verdi. Açıkça, müttefiklere ve Bedir'e şahit olan azatlı kölelere de verdi. Musab bin Saad'ın rivayetine göre, Bedir halkına altı bin dirhem, Müminlerin annelerine on bin dirhem ve Allah Resulü'nün ona olan sevgisinden dolayı Ayşe'ye iki bin dirhem ayırdı. Safiye ve Cüveyriye'ye altı bin dirhem ve Ümmü Abdül de dahil olmak üzere Muhacirlerden kadınlara bin dirhem ayırdı. Kays bin Ebu Hazim, Bedir halkına, Araplarına ve azatlı kölelerine beş bin kişi ayırdığını ve onlara diğerlerinden üstünlük tanımadığını söyledi. Aralarında Tamim el-Dari ve Bilal de bulunan beş gayrimüslim vardı. Şeyh, Ömer'in, \"Eğer gelecek yıla kadar yaşarsam, Muhacirlerin en alt kademesindekileri bile iki bine dahil edeceğim\" dediğini duydu."
  id: "Ketika uang saku dibagikan, Umar mengirimkan bagiannya kepada Zaynab binti Jahsh. Ketika uang itu sampai kepadanya, ia berkata, \"Semoga Allah mengampuni Umar! Saudari-saudariku yang lain lebih mampu membagikan ini daripada aku.\" Mereka berkata, \"Ini semua milikmu.\" Ia berkata, \"Maha Suci Allah!\" dan menutupi dirinya dengan sehelai kain. Kemudian ia berkata, \"Tuangkan dan tutupi dengan kain lain.\" Lalu ia berkata kepada Barzah binti Rafi', \"Masukkan tanganmu dan ambil segenggam, lalu bawalah kepada anak-anak si fulan dan anak-anak si fulan di antara kerabatnya dan anak-anak yatim.\" Maka ia membagikannya hingga sebagian tersisa di bawah kain. Barzah berkata, \"Semoga Allah mengampunimu, wahai Ibu Kaum Beriman! Demi Allah, kami berhak atas uang ini. Katakan padaku berapa banyak yang ada di bawah kain itu.\" Mereka menemukan lima ratus delapan puluh dirham di bawahnya. Kemudian dia mengangkat tangannya ke langit dan berkata, \"Ya Allah, semoga aku tidak lagi menerima tunjangan dari Umar setelah tahun ini.\" Lalu dia meninggal. Dalam riwayat Ibnu Shihab, Umar memberikan dua belas ribu dirham kepada istri-istri Nabi yang dinikahinya, dan masing-masing enam ribu kepada Juwayriyah dan Safiyyah binti Huyayy, karena mereka termasuk rampasan perang yang Allah berikan kepada Rasul-Nya. Dia memberikan lima ribu kepada kaum Muhajirin yang menyaksikan Perang Badar dan empat ribu kepada kaum Ansar yang menyaksikan Perang Badar, dan dia memberikan alokasinya secara umum kepada semua orang. Secara eksplisit, sekutu, dan budak yang dibebaskan yang menyaksikan Perang Badar. Dalam riwayat Musab bin Saad, dia memberikan enam ribu kepada orang-orang yang berperang di Badar, sepuluh ribu kepada para Ibu Kaum Mukmin, dan dua ribu kepada Aisyah karena kecintaan Rasulullah kepadanya. Dia memberikan enam ribu kepada Safiyyah dan Juwayriyah, dan seribu kepada wanita-wanita dari kaum Muhajirin, termasuk Umm Abd. Qais bin Abi Hazim berkata bahwa ia mengalokasikan lima ribu orang untuk penduduk Badr, orang-orang Arab mereka, dan budak-budak mereka yang telah dibebaskan, dan ia mengatakan bahwa ia tidak memberikan keistimewaan kepada mereka dibandingkan yang lain. Ada lima orang non-Arab di antara mereka, termasuk Tamim al-Dari dan Bilal. Syekh mendengar Umar berkata, “Jika aku hidup sampai tahun depan, aku akan memasukkan orang-orang Muhajirat yang paling rendah kedudukannya dalam kelompok dua ribu orang.”"
