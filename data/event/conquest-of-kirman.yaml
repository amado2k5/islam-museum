summary:
  ar: "قصد سهيل بن عدي إلى كرمان، فاقتتل مع أهلها في أدنى أرضهم فهزمهم الله، وقتل النسير بن عمرو مرزبانها، ودخل سهيل من طريق القرى إلى جيترفت {cite:tabari-tarikh-abu-al-fadl j.4 p.180}."
  en: "Suhayl ibn Adi marched on Kirman and fought its people in the lowest of their lands; God routed them, al-Nasir ibn Amr, its marzban, was killed, and Suhayl entered by way of the villages to Jaytarfat {cite:tabari-tarikh-abu-al-fadl j.4 p.180}."
