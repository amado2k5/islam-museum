id: event/al-hadi-seventeen-days-at-najran-and-the-prisoners-sent-to-al-ghayl-286
class: event
kind: other
label:
  ar: سبعة عشر يوماً للهادي في نجران وإخراج المحدثين وحبسهم في الغيل قرب صعدة، جمادى الآخرة–رجب 286هـ
  en: Al-Hadi's seventeen days at Najran, the expulsion of the troublemakers and their jailing at al-Ghayl near Sa'da, Jumada II to Rajab 286 AH
  ur: نجران میں ہادی کے سترہ دن، فساد برپا کرنے والوں کا اخراج اور صعدہ کے قریب الغیل میں ان کی قید، جمادی الآخرہ سے رجب 286ھ
  es: "Los diecisiete días de Al-Hadi en Najran, la expulsión de los alborotadores y su encarcelamiento en al-Ghayl cerca de Sa'da, Jumada II a Rajab 286 AH"
  fr: "Les dix-sept jours d'Al-Hadi à Najran, l'expulsion des fauteurs de troubles et leur emprisonnement à al-Ghayl près de Sa'da, Jumada II à Rajab 286 AH"
  tr: "El-Hadi'nin Necran'da on yedi gün sürmesi ve hadis alimlerinin sınır dışı edilmesi ve Sa'dah yakınındaki El-Ghayl'de hapsedilmesi, Cemâde-i Akhire – Recep 286 H."
  id: "Tujuh belas hari Al-Hadi di Najran, dan pengusiran para ulama hadis serta pemenjaraannya di Al-Ghayl dekat Sa’dah, Jumada Al-Akhirah – Rajab 286 H."
summary:
  ar: أقام الهادي في نجران سبعة عشر يوماً، وأخرج المحدثين الذين كان منهم الفساد، وسمّى الكتاب منهم من يأم ابن أبي الجراح وبشر بن بكار وأبا محجن وخباب بن المحتمل، ومن الخشيميين مرزوق بن محمد ونخيل بن مهاجر وأبا الوجيه بن موسى، فأوثقهم في القيود وحملهم في المحامل إلى صعدة وحبسهم في قرية الغيل القريبة منها لا في صعدة، لأن رجلاً من الدهميين فرّ من حبس صعدة بمعونة نفر من الأكيليين.
  en: Al-Hadi stayed seventeen days at Najran and put out the troublemakers; the book names, from Yam, Ibn Abi al-Jarrah, Bishr ibn Bakkar, Abu Mihjan and Khabbab ibn al-Muhtamil, and from the Khushaymis Marzuq ibn Muhammad, Nukhayl ibn Muhajir and Abu al-Wajih ibn Musa; he had them put in irons, carried in litters to Sa'da and jailed at the nearby village of al-Ghayl rather than in Sa'da, because a man of the Duhmis had escaped the Sa'da jail with the help of some of al-Akilis.
  ur: ہادی نجران میں سترہ دن رہے اور فساد برپا کرنے والوں کو نکال دیا؛ کتاب یام میں سے ابن ابی الجراح، بشر بن بکار، ابو محجن اور خباب بن المحتمل کے نام دیتی ہے اور خشیمیوں میں سے مرزوق بن محمد، نخیل بن مہاجر اور ابو الوجیہ بن موسیٰ؛ انہوں نے انہیں بیڑیوں میں جکڑوایا، ہودجوں میں صعدہ لے جایا گیا اور صعدہ کی جگہ اس کے قریب بستی الغیل میں قید کیا گیا، کیونکہ دہمیوں کا ایک آدمی اکیلیوں کے کچھ لوگوں کی مدد سے صعدہ کی قید سے نکل بھاگا تھا۔
  es: "Al-Hadi permaneció diecisiete días en Najran y expulsó a los alborotadores; los nombres de los libros, de Yam, Ibn Abi al-Jarrah, Bishr ibn Bakkar, Abu Mihjan y Khabbab ibn al-Muhtamil, y de los Khushaymis Marzuq ibn Muhammad, Nukhayl ibn Muhajir y Abu al-Wajih ibn Musa; los hizo encadenar, los llevó en literas a Sa'da y los encarceló en la cercana aldea de al-Ghayl en lugar de en Sa'da, porque un hombre de los Duhmis había escapado de la cárcel de Sa'da con la ayuda de algunos al-Akilis."
  fr: "Al-Hadi resta dix-sept jours à Najran et fit expulser les fauteurs de troubles; les noms du livre, de Yam, Ibn Abi al-Jarrah, Bishr ibn Bakkar, Abu Mihjan et Khabbab ibn al-Muhtamil, et des Khushaymis Marzuq ibn Muhammad, Nukhayl ibn Muhajir et Abu al-Wajih ibn Musa; il les fit mettre aux fers, transporter dans des litières à Sa'da et emprisonner dans le village voisin d'al-Ghayl plutôt qu'à Sa'da, parce qu'un homme des Duhmis s'était échappé de la prison de Sa'da avec l'aide de certains al-Akilis."
  tr: "El-Hadi, on yedi gün boyunca Necran'da kaldı ve yozlaşmış hadis âlimlerini ortaya çıkardı. Aralarında Ya'am İbn Abi el-Cerrah, Bişr İbn Bakkar, Ebu Mahcan ve Habbab İbn el-Muhtamal'ın da bulunduğu kâtiplerin isimlerini zikretti. Ayrıca Haşimiyyen'den Marzuk İbn Muhammed, Nakhil İbn Muhajir ve Ebu el-Vajih İbn Musa'yı da zikretti. Onları zincire vurup sedyelerle Sa'de'ye götürdü ve Sa'de'de değil, yakınındaki El-Ghayl köyünde hapsetti; çünkü Dahmiyyen'den bir adam, Akiliyyen'den bazılarının yardımıyla Sa'de hapishanesinden kaçmıştı."
  id: "Al-Hadi tinggal di Najran selama tujuh belas hari, dan dia membawa keluar para ulama hadits yang korup, dan dia menyebutkan nama-nama juru tulis di antara mereka, termasuk Ya’am Ibn Abi Al-Jarrah, Bishr Ibn Bakkar, Abu Mahjan, dan Khabbab Ibn Al-Muhtamal, dan dari Khashimiyyin, Marzuq Ibn Muhammad, Nakhil Ibn Muhajir, dan Abu Al-Wajih Ibn Musa. Dia membelenggu mereka dengan rantai dan membawa mereka dengan tandu ke Sa’dah dan memenjarakan mereka di desa Al-Ghayl, yang dekat dengan Sa’dah, bukan di Sa’dah, karena seorang pria dari Dahmiyyin melarikan diri dari penjara Sa’dah dengan bantuan beberapa orang dari Akiliyyin."
