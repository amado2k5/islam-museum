id: event/muhammad-ibn-abd-al-malik-al-wadii-answers-banu-al-harith-in-verse-292
class: event
kind: other
label:
  ar: "شعر محمد بن عبد الملك الوادعي في بني الحارث وفي كعب همدان، ص287-288"
  en: "The verses of Muhammad ibn Abd al-Malik al-Wadi'i on Banu al-Harith and on Ka'b of Hamdan, pp. 287-288"
  ur: "محمد بن عبدالملک وادعی کے اشعار بنو حارث اور کعب ہمدان کے بارے میں، ص287-288"
  es: "Los versículos de Muhammad ibn Abd al-Malik al-Wadi'i sobre Banu al-Harith y sobre Ka'b de Hamdan, págs. 287-288"
  fr: "Les versets de Muhammad ibn Abd al-Malik al-Wadi'i sur Banu al-Harith et sur Ka'b de Hamdan, pp. 287-288"
summary:
  ar: "يقول محمد بن عبد الملك الوادعي شعراً يبدأ بوصف دار عُفيت وفتاة، ثم يتعجب من بني الحارث وقد نصبوا الحرب ولم يشكروا نعمة الهادي وأزاحوا والياً هو صهر الهادي، ويصف نزول محمد بن عبيد الله في كعب ونصرة همدان."
  en: "Muhammad ibn Abd al-Malik al-Wadi'i speaks verses that open with a ruined abode and a young woman, then wonder at Banu al-Harith for making war and not thanking al-Hadi's favour and for removing a governor who was al-Hadi's kinsman by marriage, and describe Muhammad ibn Ubaydallah's lodging among Ka'b and the help of Hamdan."
  ur: "محمد بن عبدالملک وادعی ایسے اشعار کہتے ہیں جو مٹے ہوئے گھر اور ایک دوشیزہ سے شروع ہوتے ہیں، پھر بنو حارث پر تعجب کرتے ہیں کہ انہوں نے جنگ کھڑی کی، ہادی کی نعمت کا شکر نہ کیا اور ایک والی کو ہٹایا جو ہادی کا سسرالی رشتہ دار تھا، اور محمد بن عبید اللہ کے کعب میں ٹھہرنے اور ہمدان کی مدد کا ذکر کرتے ہیں۔"
  es: "Muhammad ibn Abd al-Malik al-Wadi'i recita versos que comienzan con una morada en ruinas y una joven, luego se asombra de que los Banu al-Harith hicieran la guerra y no agradecieran el favor de al-Hadi y destituyeran a un gobernador que era pariente de al-Hadi por matrimonio, y describe el alojamiento de Muhammad ibn Ubaydallah entre los Ka'b y la ayuda de Hamdan."
  fr: "Muhammad ibn Abd al-Malik al-Wadi'i récite des vers qui s'ouvrent sur une demeure en ruines et une jeune femme, puis s'étonne que les Banu al-Harith aient fait la guerre sans remercier al-Hadi pour sa faveur et pour avoir destitué un gouverneur qui était le parent d'al-Hadi par alliance, et décrit le logement de Muhammad ibn Ubaydallah parmi Ka'b et l'aide de Hamdan."
