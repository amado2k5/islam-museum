label: { ar: "البيعة ليزيد بولاية العهد", en: "The pledge to Yazid as heir apparent", fr: "L'allégeance à Yazid comme héritier présomptif", es: "La promesa a Yazid como heredero aparente", ur: "یزید کی بیعت ظاہری طور پر وارث", tr: "Veliaht Prens olarak Yezid'e bağlılık", id: "Kesetiaan kepada Yazid sebagai Putra Mahkota" }
summary:
  ar: "في سنة ست وخمسين دعا معاوية بن أبي سفيان إلى البيعة لابنه يزيد بولاية العهد، بإشارة من المغيرة بن شعبة؛ وكان زياد بن أبيه قد كره ذلك لما يعرفه من لعب يزيد وإقباله على الصيد، فأرسل إلى معاوية يثنيه عنه، ثم فُرغ منه بعد وفاة زياد {cite:bakr-umayyad-state-1134715 p. 146}. ثم استدعى معاوية في طريقه من مكة إلى الشام الخمسة الذين امتنعوا: عبد الرحمن بن أبي بكر وعبد الله بن عمر وعبد الله بن الزبير والحسين بن علي وابن عباس، فكان عبد الرحمن أشدهم ردا، وخطب بالمدينة وهم تحت منبره، فبايع الناس ليزيد دون أن يظهروا خلافا {cite:bakr-umayyad-state-1134715 p. 147}."
  en: "In 56 AH Mu'awiya ibn Abi Sufyan called for the pledge to his son Yazid as heir apparent, at the suggestion of al-Mughira ibn Shu'ba. Ziyad ibn Abihi had disliked this, because he knew Yazid's frivolity and his devotion to hunting; he sent to Mu'awiya to dissuade him, but the matter was completed after Ziyad's death {cite:bakr-umayyad-state-1134715 p. 146}. Then, on his way from Mecca to Syria, Mu'awiya summoned the five who had refused: Abd al-Rahman ibn Abi Bakr, Abd Allah ibn Umar, Abd Allah ibn al-Zubayr, al-Husayn ibn Ali and Ibn Abbas. Abd al-Rahman was the most vehement in refusing. Mu'awiya preached in Medina while they sat beneath his pulpit, and the people pledged to Yazid without showing dissent {cite:bakr-umayyad-state-1134715 p. 147}."
  fr: "En 56 H, Mu'awiya ibn Abi Sufyan appela à l'allégeance à son fils Yazid comme héritier présomptif, sur la suggestion d'al-Mughira ibn Shu'ba. Ziyad ibn Abihi avait désapprouvé cela, parce qu'il connaissait la légèreté de Yazid et sa passion pour la chasse ; il envoya dire à Mu'awiya d'y renoncer, mais l'affaire fut conclue après la mort de Ziyad {cite:bakr-umayyad-state-1134715 p. 146}. Puis, sur le chemin de La Mecque à la Syrie, Mu'awiya convoqua les cinq qui avaient refusé : Abd al-Rahman ibn Abi Bakr, Abd Allah ibn Umar, Abd Allah ibn al-Zubayr, al-Husayn ibn Ali et Ibn Abbas. Abd al-Rahman fut le plus véhément dans son refus. Mu'awiya prêcha à Médine tandis qu'ils étaient assis sous sa chaire, et les gens prêtèrent allégeance à Yazid sans manifester de désaccord {cite:bakr-umayyad-state-1134715 p. 147}."
  es: "En el año 56 de la Hégira, Mu'awiya ibn Abi Sufyan pidió que se le entregara a su hijo Yazid como heredero aparente, a sugerencia de al-Mughira ibn Shu'ba. Ziyad ibn Abihi no estaba de acuerdo, pues conocía la frivolidad de Yazid y su afición a la caza; envió a Mu'awiya para disuadirlo, pero el asunto se resolvió después de la muerte de Ziyad {cite:bakr-umayyad-state-1134715 p. 146}. Luego, en su camino de La Meca a Siria, Mu'awiya convocó a los cinco que se habían negado: Abd al-Rahman ibn Abi Bakr, Abd Allah ibn Umar, Abd Allah ibn al-Zubayr, al-Husayn ibn Ali e Ibn Abbas. Abd al-Rahman fue el más vehemente en su negativa. Mu'awiya predicó en Medina mientras ellos se sentaban bajo su púlpito, y el pueblo juró lealtad a Yazid sin mostrar disidencia {cite:bakr-umayyad-state-1134715 p. 147}."
  ur: "56 ہجری میں معاویہ ابن ابی سفیان نے مغیرہ بن شعبہ کی تجویز پر اپنے بیٹے یزید کو ظاہری وارث کے طور پر بیعت کرنے کے لیے بلایا۔ زیاد بن ابیحی نے اس کو ناپسند کیا تھا، کیونکہ وہ یزید کی غیرت مندی اور شکار سے اس کی لگن کو جانتا تھا۔ اس نے معاویہ کو منحرف کرنے کے لیے بھیجا، لیکن یہ معاملہ زیاد کی موت کے بعد مکمل ہو گیا۔ 146}۔ پھر مکہ سے شام جاتے ہوئے معاویہ نے ان پانچوں کو بلایا جنہوں نے انکار کر دیا تھا: عبدالرحمٰن بن ابی بکر، عبد اللہ ابن عمر، عبد اللہ ابن الزبیر، الحسین ابن علی اور ابن عباس۔ عبد الرحمن انکار کرنے میں سب سے زیادہ سخت تھے۔ معاویہ نے مدینہ میں اس وقت تبلیغ کی جب وہ اس کے منبر کے نیچے بیٹھے تھے، اور لوگوں نے اختلاف ظاہر کیے بغیر یزید سے بیعت کر لی۔ 147}۔"
  tr: "56. yılda, Muaviye ibn Ebu Sufyan, el-Muğire ibn Şube'nin önerisiyle oğlu Yezid'in veliaht olarak biat etmesini istedi. Ziyad ibn Abihi, Yezid'in eğlence düşkünlüğünü ve avcılığa olan düşkünlüğünü bildiği için bunu beğenmedi ve Muaviye'ye onu vazgeçirmesi için haber gönderdi. Bu, Ziyad'ın ölümünden sonra gerçekleşti. Daha sonra, Mekke'den Suriye'ye giderken Muaviye, biat etmeyi reddeden beş kişiyi çağırdı: Abdurrahman ibn Ebu Bekir, Abdullah ibn Ömer, Abdullah ibn Zübeyr, Hüseyin ibn Ali ve İbn Abbas. Abdurrahman, reddinde en şiddetli olanıydı ve Medine'deki halka minberinin altında hitap etti. Bunun üzerine halk, hiçbir muhalefet göstermeden Yezid'e biat etti."
  id: "Pada tahun 56, Mu'awiya ibn Abi Sufyan menyerukan agar orang-orang memberikan baiat kepada putranya, Yazid, sebagai pewaris takhta, atas saran al-Mughirah ibn Shu'bah. Ziyad ibn Abihi tidak menyukai hal ini karena ia mengetahui sifat Yazid yang sembrono dan kegemarannya berburu, sehingga ia mengirim pesan kepada Mu'awiya untuk membujuknya agar tidak melakukannya. Hal ini dilakukan setelah kematian Ziyad. Kemudian, dalam perjalanannya dari Mekah ke Suriah, Mu'awiya memanggil lima orang yang telah menolak: Abd al-Rahman ibn Abi Bakr, Abdullah ibn Umar, Abdullah ibn al-Zubayr, al-Husayn ibn Ali, dan Ibn Abbas. Abd al-Rahman adalah yang paling keras menolak, dan ia berpidato di hadapan orang-orang di Madinah saat mereka berada di bawah mimbarnya. Orang-orang kemudian memberikan baiat kepada Yazid tanpa menunjukkan penolakan apa pun."
