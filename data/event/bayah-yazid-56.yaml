id: event/bayah-yazid-56
class: event
kind: other
label: { ar: "البيعة ليزيد بولاية العهد" }
summary:
  ar: "في سنة ست وخمسين دعا معاوية بن أبي سفيان إلى البيعة لابنه يزيد بولاية العهد، بإشارة من المغيرة بن شعبة؛ وكان زياد بن أبيه قد كره ذلك لما يعرفه من لعب يزيد وإقباله على الصيد، فأرسل إلى معاوية يثنيه عنه، ثم فُرغ منه بعد وفاة زياد {cite:bakr-umayyad-state-1134715 p. 146}. ثم استدعى معاوية في طريقه من مكة إلى الشام الخمسة الذين امتنعوا: عبد الرحمن بن أبي بكر وعبد الله بن عمر وعبد الله بن الزبير والحسين بن علي وابن عباس، فكان عبد الرحمن أشدهم ردا، وخطب بالمدينة وهم تحت منبره، فبايع الناس ليزيد دون أن يظهروا خلافا {cite:bakr-umayyad-state-1134715 p. 147}."
