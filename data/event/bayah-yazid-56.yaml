id: event/bayah-yazid-56
class: event
kind: other
label: { ar: "البيعة ليزيد بولاية العهد", en: "The pledge to Yazid as heir apparent" }
summary:
  ar: "في سنة ست وخمسين دعا معاوية بن أبي سفيان إلى البيعة لابنه يزيد بولاية العهد، بإشارة من المغيرة بن شعبة؛ وكان زياد بن أبيه قد كره ذلك لما يعرفه من لعب يزيد وإقباله على الصيد، فأرسل إلى معاوية يثنيه عنه، ثم فُرغ منه بعد وفاة زياد {cite:bakr-umayyad-state-1134715 p. 146}. ثم استدعى معاوية في طريقه من مكة إلى الشام الخمسة الذين امتنعوا: عبد الرحمن بن أبي بكر وعبد الله بن عمر وعبد الله بن الزبير والحسين بن علي وابن عباس، فكان عبد الرحمن أشدهم ردا، وخطب بالمدينة وهم تحت منبره، فبايع الناس ليزيد دون أن يظهروا خلافا {cite:bakr-umayyad-state-1134715 p. 147}."
  en: "In 56 AH Mu'awiya ibn Abi Sufyan called for the pledge to his son Yazid as heir apparent, at the suggestion of al-Mughira ibn Shu'ba. Ziyad ibn Abihi had disliked this, because he knew Yazid's frivolity and his devotion to hunting; he sent to Mu'awiya to dissuade him, but the matter was completed after Ziyad's death {cite:bakr-umayyad-state-1134715 p. 146}. Then, on his way from Mecca to Syria, Mu'awiya summoned the five who had refused: Abd al-Rahman ibn Abi Bakr, Abd Allah ibn Umar, Abd Allah ibn al-Zubayr, al-Husayn ibn Ali and Ibn Abbas. Abd al-Rahman was the most vehement in refusing. Mu'awiya preached in Medina while they sat beneath his pulpit, and the people pledged to Yazid without showing dissent {cite:bakr-umayyad-state-1134715 p. 147}."
