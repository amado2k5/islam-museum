id: event/a-woman-claims-an-estate-from-abu-al-atahiya-and-al-hadi-gives-judgment-for-her-288
class: event
label:
  ar: "امرأة تطالب أبا العتاهية بضيعة ويحكم لها الهادي بسمح، ربيع الأول 288هـ"
  en: "A woman claims an estate from Abu al-Atahiya and al-Hadi gives judgment for her at Samh, Rabi I 288 AH"
  fr: "Une femme réclame un domaine à Abu al-Atahiya et al-Hadi lui donne gain de cause à Samh, rabi I 288 de l’hégire"
  ur: "ایک عورت ابو العتاہیہ سے جائیداد کا دعویٰ کرتی ہے اور ہادی سمح میں اس کے حق میں فیصلہ دیتے ہیں، ربیع الاول 288ھ"
  es: "Una mujer reclama una herencia a Abu al-Atahiya y al-Hadi dicta sentencia a su favor en Samh, Rabi I 288 AH."
  tr: "Bir kadın Ebu el-Atahiye'den bir mal talep eder ve el-Hadi onun lehine hüküm verir (Rebiü'l-Evvel 288 Hicri)."
  id: "Seorang wanita menuntut harta dari Abu al-Atahiyah, dan al-Hadi memutuskan untuk mengabulkannya, Rabi' al-Awwal 288 H."
summary:
  ar: "تصيح امرأة على باب الهادي بسمح أن ينصفها من أبي العتاهية، فيحضره الهادي ويسألها عن دعواها فتقول إن في يده ضيعة غصبها أبوه، فيطلب الشهود فتحضرهم فيشهدون لها، فيحكم لها الهادي بالضيعة ويأمرها بقبضها فتقبضها، ثم يرحل ويولي سمح زيد بن أبي العباس الفطيمي."
  en: "A woman cries at al-Hadi's door at Samh for justice against Abu al-Atahiya; al-Hadi sends for him and asks her claim, and she says he holds an estate his father seized; asked for witnesses she brings them and they testify for her, and al-Hadi gives judgment for the woman and has her take possession; he then leaves Samh and appoints Zayd ibn Abi al-Abbas al-Futayimi over it."
  fr: "Une femme crie à la porte d’al-Hadi à Samh pour obtenir justice contre Abu al-Atahiya ; al-Hadi le fait venir et lui demande ce qu’elle réclame. Elle dit qu’il détient un domaine saisi par son père ; invitée à produire des témoins, elle les amène et ils témoignent en sa faveur. Al-Hadi lui donne gain de cause et lui fait prendre possession du domaine ; il quitte ensuite Samh et y nomme Zayd ibn Abi al-Abbas al-Futayimi."
  ur: "ایک عورت سمح میں ہادی کے دروازے پر پکارتی ہے کہ ابو العتاہیہ کے خلاف اسے انصاف دیں؛ ہادی انہیں بلوا کر اس سے دعویٰ پوچھتے ہیں تو وہ کہتی ہے کہ ان کے ہاتھ میں ایک جائیداد ہے جو ان کے باپ نے ہتھیائی تھی؛ گواہ مانگے جاتے ہیں تو وہ انہیں لے آتی ہے اور وہ اس کے حق میں گواہی دیتے ہیں، ہادی عورت کے حق میں جائیداد کا فیصلہ کرتے ہیں اور اسے قبضہ لینے کا حکم دیتے ہیں؛ پھر وہ سمح سے روانہ ہوتے ہیں اور زید بن ابی العباس فطیمی کو اس کا والی بناتے ہیں۔"
  es: "Una mujer llama a la puerta de al-Hadi en Samh pidiendo justicia contra Abu al-Atahiya; al-Hadi lo manda llamar y le pregunta cuál es su reclamación, y ella dice que él posee una propiedad que su padre se apoderó de ella; ella pide testigos, los trae y ellos testifican a su favor, y al-Hadi dicta sentencia a favor de la mujer y le concede posesión; luego abandona Samh y nombra a Zayd ibn Abi al-Abbas al-Futayimi como administrador."
  tr: "Bir kadın, El-Hadi'nin kapısına bağırarak, Ebu el-Atahiye'ye karşı adalet sağlamasını ister. El-Hadi onu çağırır ve kadına iddiasını sorar. Kadın, babasının gasp ettiği bir mülkü olduğunu söyler. El-Hadi şahitler ister ve kadın şahitlerini getirir ve onlar da onun lehine tanıklık ederler. El-Hadi, mülk konusunda kadının lehine karar verir ve ona mülkü teslim almasını emreder, o da mülkü teslim alır. Ardından El-Hadi ayrılır ve Samh Zaid bin Abi el-Abbas el-Fatimi'yi görevlendirir."
  id: "Seorang wanita berteriak di depan pintu Al-Hadi, memohon agar ia dihakimi atas Abu Al-Atahiyah. Al-Hadi memanggilnya dan menanyakan tentang klaimnya. Wanita itu mengatakan bahwa ia memiliki harta yang dirampas ayahnya. Al-Hadi meminta saksi, dan wanita itu membawa mereka dan mereka bersaksi untuknya. Al-Hadi memutuskan untuk mengabulkan tuntutan wanita itu terkait harta tersebut dan memerintahkannya untuk mengambil alihnya, lalu wanita itu mengambil alihnya. Kemudian Al-Hadi pergi dan menunjuk Samh Zaid bin Abi Al-Abbas Al-Fatimi."
