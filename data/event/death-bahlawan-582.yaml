summary:
  ar: "توفي البهلوان محمد بن إيلدكز صاحب الجبل والري وأصفهان وأذربيجان وكان عادلًا حسن السيرة وكانت بلاده في أيامه آمنة الرعايا، فلما مات جرى بأصفهان بين الشافعية والحنفية من الحروب والقتل والإحراق والنهب ما يجل عن الوصف، وكانت بالري فتنة عظيمة بين السنية والشيعة تفرق أهلها وخربت المدينة، وملك أخوه قزل أرسلان، وخرج عن حكمه السلطان طغرل بن أرسلان الذي كانت الخطبة له بالسلطنة وليس له من الأمر شيء فلحق به جماعة من الأمراء والجند فاستولى على بعض البلاد وجرت بينهما حروب {cite:kamil-ibn-al-athir p. 140-141}."
  en: "Al-Bahlawan Muhammad Ildigiz — lord of Jibal, Rayy, Isfahan and Azerbaijan, a just ruler whose lands were safe — died, and with him order died: Isfahan burned in Shafii-Hanafi street war, Rayy emptied in a Sunni-Shia fitna. His brother Qizil Arslan took the realm, but Sultan Tughril — sultan in name alone till then — slipped his leash with a following of emirs, seized lands, and the war began {cite:kamil-ibn-al-athir p. 140-141}."
