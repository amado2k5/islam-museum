summary:
  ar: "توفي البهلوان محمد بن إيلدكز صاحب الجبل والري وأصفهان وأذربيجان وكان عادلًا حسن السيرة وكانت بلاده في أيامه آمنة الرعايا، فلما مات جرى بأصفهان بين الشافعية والحنفية من الحروب والقتل والإحراق والنهب ما يجل عن الوصف، وكانت بالري فتنة عظيمة بين السنية والشيعة تفرق أهلها وخربت المدينة، وملك أخوه قزل أرسلان، وخرج عن حكمه السلطان طغرل بن أرسلان الذي كانت الخطبة له بالسلطنة وليس له من الأمر شيء فلحق به جماعة من الأمراء والجند فاستولى على بعض البلاد وجرت بينهما حروب {cite:kamil-ibn-al-athir p. 140-141}."
  en: "Al-Bahlawan Muhammad Ildigiz — lord of Jibal, Rayy, Isfahan and Azerbaijan, a just ruler whose lands were safe — died, and with him order died: Isfahan burned in Shafii-Hanafi street war, Rayy emptied in a Sunni-Shia fitna. His brother Qizil Arslan took the realm, but Sultan Tughril — sultan in name alone till then — slipped his leash with a following of emirs, seized lands, and the war began {cite:kamil-ibn-al-athir p. 140-141}."
  es: "Al-Bahlawan Muhammad Ildigiz, señor de Jibal, Rayy, Isfahán y Azerbaiyán, un gobernante justo cuyas tierras eran seguras, murió, y con él murió el orden: Isfahán ardió en una guerra callejera entre shafiíes y hanafíes, Rayy quedó devastada por una fitna entre suníes y chiíes. Su hermano Qizil Arslan tomó el control del reino, pero el sultán Tughril, sultán solo de nombre hasta entonces, se liberó de su yugo con un séquito de emires, se apoderó de tierras y comenzó la guerra {cite:kamil-ibn-al-athir p. 140-141}."
  fr: "Al-Bahlawan Muhammad Ildigiz, seigneur de Jibal, Rayy, Ispahan et d'Azerbaïdjan, souverain juste dont les terres étaient sûres, mourut, et avec lui l'ordre disparut: Ispahan fut ravagée par les guerres de rue entre chaféites et hanafites, Rayy se vida de ses habitants lors d'une fitna sunnite-chiite. Son frère Qizil Arslan s'empara du royaume, mais le sultan Tughril, qui n'avait jusqu'alors que le titre de sultan, se rebella avec une suite d'émirs, s'empara de terres, et la guerre éclata (voir: Kamil ibn al-Athir, p. 140-141)."
