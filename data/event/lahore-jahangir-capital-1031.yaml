id: event/lahore-jahangir-capital-1031
class: event
kind: other
label:
  ar: "جهانكير يجعل لاهور عاصمته، ١٠٣١هـ/١٦٢٣م"
  en: "Jahangir makes Lahore his capital, 1031/1623"
  ur: "جہانگیر کا لہور کو دارالسلطنت بنانا، 1031ھ/1623ء"
summary:
  ar: "جعل جهانكير لاهور عاصمته ابتداءً من سنة ١٠٣١هـ/١٦٢٣م، وبقيت عاصمةً في معظم عهد ابنه شاه جهان الذي كان يوليها مكانة خاصة إذ هي مسقط رأسه، فأنشأ فيها مصنعًا للسجاد وجدَّد الدولة خانة {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  en: "Jahangir made Lahore his capital from 1031/1623, and it continued as such for most of the reign of Shah Jahan, who was particularly attached to it as his birthplace, establishing a carpet manufactory there and renovating the dawlat-khana {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  ur: "جہانگیر نے 1031ھ/1623ء سے لہور کو اپنا دارالسلطنت بنایا اور یہ اس کے بیٹے شاہ جہان کے بیشتر عہد میں بھی دارالسلطنت رہا؛ شاہ جہان کو اس سے خاص لگاؤ تھا کیونکہ یہ اس کی جائے پیدائش تھی، اس لیے اس نے وہاں قالین کا کارخانہ قائم کیا اور دولت خانہ کی مرمت کرائی {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
