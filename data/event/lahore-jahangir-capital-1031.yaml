id: event/lahore-jahangir-capital-1031
class: event
kind: other
label:
  ar: "جهانكير يجعل لاهور عاصمته، ١٠٣١هـ/١٦٢٣م"
  en: "Jahangir makes Lahore his capital, 1031/1623"
  ur: "جہانگیر کا لہور کو دارالسلطنت بنانا، 1031ھ/1623ء"
  es: "Jahangir convierte Lahore en su capital, 1031/1623"
  fr: "Jahangir fait de Lahore sa capitale, 1031/1623"
  tr: "Cihangir, Hicri 1031/Miladi 1623 yılında Lahor'u başkenti yaptı."
  id: "Jahangir menjadikan Lahore sebagai ibu kotanya pada tahun 1031 H/1623 M."
summary:
  ar: "جعل جهانكير لاهور عاصمته ابتداءً من سنة ١٠٣١هـ/١٦٢٣م، وبقيت عاصمةً في معظم عهد ابنه شاه جهان الذي كان يوليها مكانة خاصة إذ هي مسقط رأسه، فأنشأ فيها مصنعًا للسجاد وجدَّد الدولة خانة {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  en: "Jahangir made Lahore his capital from 1031/1623, and it continued as such for most of the reign of Shah Jahan, who was particularly attached to it as his birthplace, establishing a carpet manufactory there and renovating the dawlat-khana {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  ur: "جہانگیر نے 1031ھ/1623ء سے لہور کو اپنا دارالسلطنت بنایا اور یہ اس کے بیٹے شاہ جہان کے بیشتر عہد میں بھی دارالسلطنت رہا؛ شاہ جہان کو اس سے خاص لگاؤ تھا کیونکہ یہ اس کی جائے پیدائش تھی، اس لیے اس نے وہاں قالین کا کارخانہ قائم کیا اور دولت خانہ کی مرمت کرائی {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  es: "Jahangir convirtió Lahore en su capital desde 1031/1623, y continuó siéndolo durante la mayor parte del reinado de Shah Jahan, quien estaba particularmente apegado a ella por ser su lugar de nacimiento, estableciendo allí una fábrica de alfombras y renovando el dawlat-khana {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  fr: "Jahangir fit de Lahore sa capitale à partir de 1031/1623, et elle le resta pendant la majeure partie du règne de Shah Jahan, qui y était particulièrement attaché en tant que lieu de naissance, y établissant une manufacture de tapis et rénovant le dawlat-khana {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
  tr: "Cihangir, Hicri 1031/Miladi 1623 yılından itibaren Lahor'u başkenti yaptı ve burası, oğlu Şah Cihan'ın saltanatının büyük bir bölümünde başkent olarak kaldı. Şah Cihan, doğum yeri olması nedeniyle buraya özel bir statü verdi. Burada bir halı fabrikası kurdu ve Devlet Hanı'nı yeniledi."
  id: "Jahangir menjadikan Lahore sebagai ibu kotanya mulai tahun 1031 H/1623 M, dan kota ini tetap menjadi ibu kota selama sebagian besar pemerintahan putranya, Shah Jahan, yang memberinya status khusus karena merupakan tempat kelahirannya. Ia mendirikan pabrik karpet di sana dan merenovasi Istana Negara {cite:encyclopaedia-of-islam-2 vol. 5.2 p. 38}."
