label: { ar: "حرب ناصر الدولة ومعز الدولة على بغداد (334-335هـ)", en: "The war of Nasir al-Dawla and Mu'izz al-Dawla for Baghdad (334-335 AH / 946)", ur: "بغداد پر ناصر الدولہ اور معز الدولہ کی جنگ (334-335ھ / 946ء)" }
summary:
  ar: "الحرب التي دارت بين معز الدولة البويهي ومعه الخليفة المطيع من جهة، وناصر الدولة الحمداني ومعه الأتراك التوزونية وأبو جعفر بن شيرزاد من جهة، من أواخر شعبان سنة 334هـ بعكبرا وسامراء إلى أن عبر الديلم دجلة إلى الجانب الشرقي من بغداد سحر يوم السبت انسلاخ ذي الحجة 334هـ بحيلة المعابر، فانهزم ناصر الدولة ومُلك الجانبان، ثم طلب ناصر الدولة الصلح في آخر المحرم سنة 335هـ وهرب من الأتراك إلى الموصل {cite:tajarib-al-umam-surush-v6 p. 121-126}. وعند ابن الجوزي كانت الهزيمة في أول يوم من المحرم سنة 335هـ، ونهب الديلم باب الطاق وسوق يحيى، وهلك في طريق عكبرا خلق كثير من الحر والعطش {cite:muntazam-ibn-al-jawzi p. 646-647}."
  en: "The war between the Buyid Mu'izz al-Dawla, with the caliph al-Muti' in his camp, and the Hamdanid Nasir al-Dawla with Tuzun's Turks and Abu Ja'far ibn Shirzad, from late Sha'ban 334 around Ukbara and Samarra until the Daylamites crossed the Tigris to east Baghdad at dawn on Saturday, the last day of Dhu al-Hijja 334, by a ruse with pontoons; Nasir al-Dawla was routed, both banks were taken, and at the end of Muharram 335 he sued for peace and fled his own Turks for Mosul {cite:tajarib-al-umam-surush-v6 p. 121-126}. Ibn al-Jawzi puts the rout on 1 Muharram 335 and tells of the looting of Bab al-Taq and Suq Yahya and of the many who died of heat and thirst on the road to Ukbara {cite:muntazam-ibn-al-jawzi p. 646-647}."
