label: { ar: "مسير صاحب الزنج إلى البصرة" }
summary:
  ar: "في سنة خمس وخمسين ومائتين ظهر صاحب الزنج على فرات البصرة في شوال، وجمع إليه الزنج الذين كانوا يكسحون السباخ {cite:tabari-tarikh-abu-al-fadl j.9 p.410}، وذكر الطبري في موضع آخر أن قدومه البصرة كان في سنة أربع وخمسين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.411}، وعند السيوطي استمر القتال مع الزنج من حين تولى المعتمد سنة ست وخمسين إلى سنة سبعين فقتل فيها رأس الزنج {cite:tarikh-khulafa-minhaj-1434 p. 564}.، وعند المسعودي كان ظهوره ببئر نخل بمدينة الفتح وكرخ البصرة في ليلة الخميس لثلاث بقين من شهر رمضان سنة خمس وخمسين ومائتين في خلافة المهتدي {cite:muruj-al-dhahab p. 568}"
date:
  start: { hijri: "0255", precision: year, status: debated, note: "فهرس الجزء التاسع ص680؛ ظهور صاحب الزنج على فرات البصرة سنة 255 (ص410)، وقدومه البصرة سنة 254 (ص411)", sources: [source/tabari-tarikh-abu-al-fadl] }
