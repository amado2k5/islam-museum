label: { ar: "مسير صاحب الزنج إلى البصرة", en: "The Advance of the Zanj Leader on Basra", es: "El avance del líder Zanj sobre Basora", fr: "L'avancée du chef Zanj sur Bassorah" }
summary:
  ar: "في سنة خمس وخمسين ومائتين ظهر صاحب الزنج على فرات البصرة في شوال، وجمع إليه الزنج الذين كانوا يكسحون السباخ {cite:tabari-tarikh-abu-al-fadl j.9 p.410}، وذكر الطبري في موضع آخر أن قدومه البصرة كان في سنة أربع وخمسين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.411}، وعند السيوطي استمر القتال مع الزنج من حين تولى المعتمد سنة ست وخمسين إلى سنة سبعين فقتل فيها رأس الزنج {cite:tarikh-khulafa-minhaj-1434 p. 564}. وعند المسعودي كان ظهوره ببئر نخل بمدينة الفتح وكرخ البصرة في ليلة الخميس لثلاث بقين من شهر رمضان سنة خمس وخمسين ومائتين في خلافة المهتدي {cite:muruj-al-dhahab p. 568}"
  en: "In 255 the Zanj leader emerged on the Furat of Basra in Shawwal and gathered to him the Zanj who had been clearing the salt flats {cite:tabari-tarikh-abu-al-fadl j.9 p.410}. Elsewhere al-Tabari gives his arrival in Basra as 254 {cite:tabari-tarikh-abu-al-fadl j.9 p.411}; al-Suyuti has the fighting with the Zanj run from the accession of al-Mu'tamid in the year fifty-six until the year seventy, when the Zanj chief was killed {cite:tarikh-khulafa-minhaj-1434 p. 564}. According to al-Mas'udi his emergence was at Bi'r Nakhl in Madinat al-Fath and Karkh of Basra, on the night of Thursday three nights before the end of Ramadan, in the year 255, in the caliphate of al-Muhtadi {cite:muruj-al-dhahab p. 568}"
  es: "En 255, el líder Zanj apareció en el Furat de Basora en Shawwal y reunió a los Zanj que habían estado limpiando las salinas {cite:tabari-tarikh-abu-al-fadl j.9 p.410}. En otro lugar, al-Tabari indica su llegada a Basora en 254 {cite:tabari-tarikh-abu-al-fadl j.9 p.411}; al-Suyuti sitúa la lucha con los Zanj desde la ascensión de al-Mu'tamid en el año cincuenta y seis hasta el año setenta, cuando el jefe Zanj fue asesinado {cite:tarikh-khulafa-minhaj-1434 p. 564}. Según al-Mas'udi, su aparición tuvo lugar en Bi'r Nakhl, en Madinat al-Fath y Karkh de Basora, la noche del jueves tres noches antes del final del Ramadán, en el año 255, en el califato de al-Muhtadi {cite:muruj-al-dhahab p. 568}."
  fr: "En 255, le chef Zanj apparut sur le Furat de Bassora au mois de Shawwal et rassembla les Zanj qui défrichaient les marais salants (voir Tabari, Tarikh Abu al-Fadl, vol. 9, p. 410). Ailleurs, al-Tabari situe son arrivée à Bassora en 254 (voir Tabari, Tarikh Abu al-Fadl, vol. 9, p. 411). Al-Suyuti situe les combats contre les Zanj de l'accession au pouvoir d'al-Mu'tamid en 1456 jusqu'en 1470, année où le chef Zanj fut tué (voir Tarikh Khulafa Minhaj, 1434, p. 564). Selon al-Mas'udi, son apparition eut lieu à Bi'r Nakhl à Madinat al-Fath et à Karkh de Basra, dans la nuit du jeudi, trois nuits avant la fin du Ramadan, en l'an 255, sous le califat d'al-Muhtadi {cite:muruj-al-dhahab p. 568}"
