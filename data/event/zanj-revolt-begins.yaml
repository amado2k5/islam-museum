label: { ar: "مسير صاحب الزنج إلى البصرة", en: "The Advance of the Zanj Leader on Basra" }
summary:
  ar: "في سنة خمس وخمسين ومائتين ظهر صاحب الزنج على فرات البصرة في شوال، وجمع إليه الزنج الذين كانوا يكسحون السباخ {cite:tabari-tarikh-abu-al-fadl j.9 p.410}، وذكر الطبري في موضع آخر أن قدومه البصرة كان في سنة أربع وخمسين ومائتين {cite:tabari-tarikh-abu-al-fadl j.9 p.411}، وعند السيوطي استمر القتال مع الزنج من حين تولى المعتمد سنة ست وخمسين إلى سنة سبعين فقتل فيها رأس الزنج {cite:tarikh-khulafa-minhaj-1434 p. 564}. وعند المسعودي كان ظهوره ببئر نخل بمدينة الفتح وكرخ البصرة في ليلة الخميس لثلاث بقين من شهر رمضان سنة خمس وخمسين ومائتين في خلافة المهتدي {cite:muruj-al-dhahab p. 568}"
  en: "In 255 the Zanj leader emerged on the Furat of Basra in Shawwal and gathered to him the Zanj who had been clearing the salt flats {cite:tabari-tarikh-abu-al-fadl j.9 p.410}. Elsewhere al-Tabari gives his arrival in Basra as 254 {cite:tabari-tarikh-abu-al-fadl j.9 p.411}; al-Suyuti has the fighting with the Zanj run from the accession of al-Mu'tamid in the year fifty-six until the year seventy, when the Zanj chief was killed {cite:tarikh-khulafa-minhaj-1434 p. 564}. According to al-Mas'udi his emergence was at Bi'r Nakhl in Madinat al-Fath and Karkh of Basra, on the night of Thursday three nights before the end of Ramadan, in the year 255, in the caliphate of al-Muhtadi {cite:muruj-al-dhahab p. 568}"
