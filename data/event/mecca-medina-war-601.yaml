id: event/mecca-medina-war-601
class: event
kind: war
label: { ar: "الحرب بين أميري مكة والمدينة", en: "The war between the amirs of Mecca and Medina (601 AH)", es: "La guerra entre los emires de La Meca y Medina (601 AH)", fr: "La guerre entre les émirs de La Mecque et de Médine (601 AH)", ur: "مکہ اور مدینہ کے امیروں کے درمیان جنگ ⁦(601ھ)⁩", tr: "Mekke ve Medine prensleri arasındaki savaş", id: "Perang antara para pangeran Mekah dan Madinah" }
summary:
  ar: "في سنة واحدة وستمائة كانت الحرب بين الأمير قتادة الحسيني أمير مكة والأمير سالم بن قاسم الحسيني أمير المدينة ومع كل واحد منهما جمع كثير؛ قصد قتادة المدينة ليحصرها ويأخذها فلقيه سالم بذي الحليفة بعد أن قصد الحجرة على ساكنها فصلى عندها ودعا وسار فلقيه فانهزم قتادة وتبعه سالم إلى مكة فحصره بها، فأرسل قتادة إلى من مع سالم من الأمراء فأفسدهم عليه فمالوا إليه وحالفوه، فلما رأى سالم ذلك رحل عائداً إلى المدينة وعاد أمر قتادة قوياً {cite:kamil-ibn-al-athir p. 245}."
  en: "601: the Husaynid amirs of the two sanctuaries went to war — Qatada of Mecca marched to besiege Medina; Salim ibn Qasim prayed at the Prophet's tomb and supplicated, then met him at Dhu al-Hulayfa and routed him, chasing him into a siege inside Mecca itself — until Qatada corrupted Salim's amirs, and Salim withdrew {cite:kamil-ibn-al-athir p. 245}."
  es: "601: los emires husayníes de los dos santuarios fueron a la guerra: Qatada de La Meca marchó para sitiar Medina; Salim ibn Qasim oró en la tumba del Profeta y suplicó, luego lo encontró en Dhu al-Hulayfa y lo derrotó, persiguiéndolo hasta un asedio dentro de la propia La Meca, hasta que Qatada corrompió a los emires de Salim, y Salim se retiró {cite:kamil-ibn-al-athir p. 245}."
  fr: "601: les émirs husaynides des deux sanctuaires entrèrent en guerre — Qatada de La Mecque marcha pour assiéger Médine; Salim ibn Qasim pria au tombeau du Prophète et le supplia, puis le rencontra à Dhu al-Hulayfa et le mit en déroute, le poursuivant dans un siège à l'intérieur même de La Mecque — jusqu'à ce que Qatada corrompe les émirs de Salim, et que Salim se retire {cite: kamil-ibn-al-athir p. 245}."
  ur: "601: دونوں حرموں کے حسینی امیروں نے جنگ کی - مکہ کے قتادہ نے مدینہ کا محاصرہ کرنے کے لیے مارچ کیا۔ سالم بن قاسم نے رسول اللہ کی قبر پر نماز پڑھی اور دعا کی، پھر ذوالحلیفہ میں ان سے ملاقات کی اور انہیں مکہ کے اندر ہی محاصرے میں لے کر ان کا پیچھا کیا، یہاں تک کہ قتادہ نے سالم کے امیروں کو بگاڑ دیا، اور سالم نے واپس لے لیا {حوالہ: کامل ابن الاثیر ص۔ 245}۔"
  tr: "601 yılında, Mekke Emiri Prens Katada el-Hüseyni ile Medine Emiri Prens Salim bin Kasım el-Hüseyni arasında, her ikisinin de büyük orduları olduğu bir savaş çıktı. Katada, Medine'yi kuşatıp ele geçirmeyi amaçlıyordu, ancak Salim, Zül-Huleyfe'deki bir sakinin odasına gidip orada dua ettikten sonra onunla karşılaştı. Katada'yı yendi. Salim onu Mekke'ye kadar takip etti ve orada kuşattı. Katada, Salim'in yanındaki prensleri ona karşı kışkırttı ve böylece prensler ona yönelip onunla ittifak kurdular. Salim bunu görünce Medine'ye döndü ve Katada'nın işleri yeniden güçlendi. {Kaynak: Kamil İbn el-Atir s. 245}"
  id: "Pada tahun 601, terjadi perang antara Pangeran Qatada al-Husseini, Emir Mekah, dan Pangeran Salim bin Qasim al-Husseini, Emir Madinah, dan masing-masing memiliki pasukan yang besar. Qatada bermaksud mengepung Madinah dan merebutnya, tetapi Salim menemuinya di Dhu al-Hulayfah setelah ia pergi ke kamar penghuninya, berdoa di sana, memohon, dan melanjutkan perjalanan. Ia menemuinya, dan Qatada dikalahkan. Salim mengejarnya ke Mekah dan mengepungnya di sana. Qatada mengirim utusan kepada para pangeran yang bersama Salim dan mempengaruhi mereka untuk melawannya, sehingga mereka berbalik kepadanya dan bersekutu dengannya. Ketika Salim melihat itu, ia pergi dan kembali ke Madinah, dan pengaruh Qatada kembali menguat. {cite:kamil-ibn-al-athir p. 245}"
