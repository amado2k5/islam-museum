label: { ar: "الحرب بين أميري مكة والمدينة", en: "The war between the amirs of Mecca and Medina (601 AH)" }
summary:
  ar: "في سنة واحدة وستمائة كانت الحرب بين الأمير قتادة الحسيني أمير مكة والأمير سالم بن قاسم الحسيني أمير المدينة ومع كل واحد منهما جمع كثير؛ قصد قتادة المدينة ليحصرها ويأخذها فلقيه سالم بذي الحليفة بعد أن قصد الحجرة على ساكنها فصلى عندها ودعا وسار فلقيه فانهزم قتادة وتبعه سالم إلى مكة فحصره بها، فأرسل قتادة إلى من مع سالم من الأمراء فأفسدهم عليه فمالوا إليه وحالفوه، فلما رأى سالم ذلك رحل عائداً إلى المدينة وعاد أمر قتادة قوياً {cite:kamil-ibn-al-athir p. 245}."
  en: "601: the Husaynid amirs of the two sanctuaries went to war — Qatada of Mecca marched to besiege Medina; Salim ibn Qasim prayed at the Prophet's tomb and supplicated, then met him at Dhu al-Hulayfa and routed him, chasing him into a siege inside Mecca itself — until Qatada corrupted Salim's amirs, and Salim withdrew {cite:kamil-ibn-al-athir p. 245}."
