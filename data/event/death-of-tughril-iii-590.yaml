label: { ar: "قتل السلطان طغرل الثالث آخر سلاطين السلاجقة بالعراق", en: "Killing of Sultan Tughril III, last Seljuk sultan in Iraq", es: "Asesinato del sultán Tughril III, último sultán selyúcida de Irak.", fr: "Assassinat du sultan Tughril III, dernier sultan seldjoukide en Irak" }
summary:
  ar: "في سنة تسعين وخمسمائة قصد السلطان طغرل بن أرسلان بن طغرل السلجوقي بلد الري فأغار على من بها من أصحاب خوارزم شاه علاء الدين تكش، فسار خوارزم شاه من نيسابور إلى الري فتلقاه قتلغ اينانج بن البهلوان بالطاعة، فلما سمع طغرل بوصوله وعساكره متفرقة لم يقف ليجمعها فقيل له إن الذي تفعله ليس برأي والمصلحة أن تجمع العساكر فلم يقبل وكان فيه شجاعة، فالتقى العسكران قريباً من الري فحمل طغرل بنفسه في وسط عسكر خوارزم شاه فأحاطوا به وألقوه عن فرسه وقتلوه في الرابع والعشرين من ربيع الأول، وحمل رأسه إلى خوارزم شاه فسيره إلى بغداد فنصب بها بباب النوبي عدة أيام، وسار خوارزم شاه إلى همذان فملك تلك البلاد جميعها، وسير الخليفة الناصر لدين الله عسكراً لنجدته ومعه الخلع السلطانية مع وزيره مؤيد الدين بن القصاب فدس رسولاً يستدعيه إلى خيمته ليقبض عليه فاحترس خوارزم شاه ودخل إليه قصداً لأخذه فاندفع الوزير هارباً إلى بضع الجبال {cite:kamil-ibn-al-athir p. 232-233}."
  en: "In the year 590 Sultan Tughril ibn Arslan ibn Tughril al-Saljuqi marched on the city of Rayy and raided those there who belonged to Khwarazm-Shah Ala al-Din Tekish. Khwarazm-Shah set out from Nishapur for Rayy, and Qutlugh Inanj ibn al-Bahlawan met him in submission. When Tughril heard of his approach, with his troops scattered, he did not wait to gather them. He was told that what he was doing was not sound judgement and that the right course was to assemble the armies, but he would not accept this, for he had courage. The two armies met near Rayy, and Tughril charged in person into the middle of Khwarazm-Shah's army; they surrounded him, threw him from his horse, and killed him on the 24th of Rabi' I. His head was sent to Khwarazm-Shah, who had it forwarded to Baghdad, where it was displayed for several days at Bab al-Nawbi. Khwarazm-Shah marched on Hamadhan and took all those lands. The caliph al-Nasir li-Din Allah had sent an army to his aid, with the sultanic robes, under his vizier Muayyad al-Din ibn al-Qassab. The vizier sent a messenger to summon Khwarazm-Shah to his tent in order to seize him, but Khwarazm-Shah was wary and went to him intending to seize him instead, and the vizier fled into the mountain fastnesses {cite:kamil-ibn-al-athir p. 232-233}."
  es: "En el año 590, el sultán Tughril ibn Arslan ibn Tughril al-Saljuqi marchó sobre la ciudad de Rayy y saqueó a los que allí pertenecían a Khwarazm-Shah Ala al-Din Tekish. Khwarazm-Shah partió de Nishapur hacia Rayy, y Qutlugh Inanj ibn al-Bahlawan lo recibió en señal de sumisión. Cuando Tughril supo de su llegada, con sus tropas dispersas, no esperó a reunirlas. Se le dijo que lo que estaba haciendo no era sensato y que lo correcto era reunir a los ejércitos, pero él no lo aceptó, pues tenía valor. Los dos ejércitos se encontraron cerca de Rayy, y Tughril cargó personalmente en medio del ejército de Khwarazm-Shah; Lo rodearon, lo derribaron de su caballo y lo mataron el 24 de Rabi' I. Su cabeza fue enviada a Khwarazm-Shah, quien la mandó enviar a Bagdad, donde fue exhibida durante varios días en Bab al-Nawbi. Khwarazm-Shah marchó sobre Hamadhan y tomó todas esas tierras. El califa al-Nasir li-Din Allah había enviado un ejército en su ayuda, con túnicas sultánicas, bajo el mando de su visir Muayyad al-Din ibn al-Qassab. El visir envió un mensajero para convocar a Khwarazm-Shah a su tienda con el fin de apresarlo, pero Khwarazm-Shah desconfió y fue a él con la intención de apresarlo a él, y el visir huyó a las fortalezas de la montaña {cite:kamil-ibn-al-athir p. 232-233}."
  fr: "En 590, le sultan Tughril ibn Arslan ibn Tughril al-Saljuqi marcha sur la ville de Rayy et pilla les troupes de Khwarezm-Shah Ala al-Din Tekish. Khwarezm-Shah était parti de Nishapur pour Rayy, et Qutlugh Inanj ibn al-Bahlawan lui fit allégeance. Lorsque Tughril apprit son approche, ses troupes étant dispersées, il ne tarda pas à les rassembler. On lui fit remarquer que son comportement était une erreur et qu'il aurait dû réunir les armées, mais il refusa, car il était courageux. Les deux armées se rencontrèrent près de Rayy, et Tughril chargea en personne au cœur de l'armée de Khwarezm-Shah. Ils l'encerclèrent, le désarçonnèrent et le tuèrent le 24 Rabi' Ier. Sa tête fut envoyée à Khwarezm Shah, qui la fit transporter à Bagdad, où elle fut exposée pendant plusieurs jours à Bab al-Nawbi. Khwarezm Shah marcha ensuite sur Hamadhan et s'empara de tous ces territoires. Le calife Nasir al-Din Allah avait dépêché une armée à son secours, revêtue des habits sultaniques, sous le commandement de son vizir Muayyad al-Din ibn al-Qassab. Ce dernier envoya un messager convoquer Khwarezm Shah à sa tente afin de le capturer, mais Khwarezm Shah, méfiant, alla à sa rencontre avec l'intention de le capturer lui-même. Le vizir s'enfuit alors dans les forteresses de la montagne (voir Kamil Ibn al-Athir, p. 232-233)."
