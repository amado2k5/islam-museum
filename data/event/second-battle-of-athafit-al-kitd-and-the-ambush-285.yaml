id: event/second-battle-of-athafit-al-kitd-and-the-ambush-285
class: event
kind: other
label:
  ar: 'المعركة الثانية عند أثافت: الكتد وكمين الدعام، الجمعة 14 شوال 285هـ'
  en: 'The second battle at Athafit: al-Kitd and al-Da''am''s ambush, Friday 14 Shawwal 285 AH'
  ur: 'اثافت کی دوسری لڑائی: الکتد اور دعام کا گھات، جمعہ 14 شوال 285ھ'
  es: "La segunda batalla de Athafit: la emboscada de al-Kitd y al-Da'am, viernes 14 de Shawwal de 285 AH."
  fr: "Seconde bataille d'Athafit: embuscade d'al-Kitd et d'al-Da'am, vendredi 14 Shawwal 285 AH"
  tr: "Athaft'taki ikinci savaş: El-Katad ve El-Daam'ın pusuya düşürülmesi, Cuma, 14 Şevval 285 Hicri"
  id: "Pertempuran kedua di Athaft: Al-Katad dan penyergapan Al-Daam, Jumat, 14 Syawal 285 H"
summary:
  ar: يصلي الهادي الظهر أول وقتها قرب أثافت ويعبئ جيشه، ويستولي الدعام على موضع يقال له الكتد ويبني له درجة ينزل منها إلى أثافت، ثم يصعد خيله إليه، وهي نحو مئتين وثلاثين فارساً وألفا راجل مقابل ثلاثين فارساً وسبعمئة راجل مع الهادي؛ فيحمل أبو القاسم بأربعة فرسان ويطرد من أمامه حتى يقارب أثافت، وكان الدعام قد أكمن خيلاً ورجالاً، فيخرج بمئة فارس وألف راجل ليقطع من في الكتد.
  en: Al-Hadi prays the noon prayer early near Athafit and draws up his army; al-Da'am takes a place called al-Kitd and has a ramp built to come down to Athafit, then brings his horse up to it, some 230 horse and 2,000 foot against 30 horse and 700 foot with al-Hadi; Abu al-Qasim charges with four horsemen and drives back those before him until he nears Athafit, where al-Da'am had hidden horse and foot, and al-Da'am comes out with 100 horse and 1,000 foot to cut off those on al-Kitd.
  ur: ہادی اثافت کے قریب ظہر کی نماز اول وقت پڑھ کر لشکر کی صف بندی کرتے ہیں؛ دعام «الکتد» نامی مقام لے لیتا ہے، اثافت میں اترنے کے لیے وہاں سیڑھی بنواتا ہے اور اپنے سوار اوپر چڑھاتا ہے، کوئی 230 سوار اور دو ہزار پیادے، جبکہ ہادی کے ساتھ تیس سوار اور سات سو پیادے ہیں؛ ابو القاسم چار سواروں کے ساتھ حملہ کر کے سامنے والوں کو اثافت کے قریب تک ہٹا دیتے ہیں، دعام نے گھات میں سوار اور پیادے چھپا رکھے تھے، وہ سو سوار اور ہزار پیادوں کے ساتھ نکلتا ہے تاکہ الکتد والوں کو کاٹ دے۔
  es: "Al-Hadi reza la oración del mediodía temprano cerca de Athafit y reúne a su ejército; al-Da'am toma un lugar llamado al-Kitd y hace construir una rampa para bajar a Athafit, luego sube con su caballería, unos 230 caballos y 2000 infantes contra 30 caballos y 700 infantes con al-Hadi; Abu al-Qasim carga con cuatro jinetes y hace retroceder a los que tiene delante hasta que se acerca a Athafit, donde al-Da'am había escondido caballería e infantería, y al-Da'am sale con 100 caballos y 1000 infantes para cortar el paso a los que están en al-Kitd."
  fr: "Al-Hadi accomplit la prière de midi tôt près d'Athafit et rassemble son armée; al-Da'am prend un lieu appelé al-Kitd et fait construire une rampe pour descendre vers Athafit, puis y amène sa cavalerie, soit environ 230 cavaliers et 2 000 fantassins contre 30 cavaliers et 700 fantassins avec al-Hadi; Abu al-Qasim charge avec quatre cavaliers et repousse ceux qui lui font face jusqu'à ce qu'il approche d'Athafit, où al-Da'am avait caché des cavaliers et des fantassins, et al-Da'am sort avec 100 cavaliers et 1 000 fantassins pour couper ceux d'al-Kitd."
  tr: "El-Hadi, öğle namazını Athafit yakınlarında en erken vakitte kılar ve ordusunu hazırlar. El-Da'am, El-Katad denilen bir yeri ele geçirir ve Athafit'e inmek için bir merdiven inşa eder. Ardından, El-Hadi'nin otuz süvarisi ve yedi yüz piyadesine karşılık, yaklaşık iki yüz otuz süvarisi ve iki bin piyadesinden oluşan atlılarını oraya gönderir. Ebu el-Kâsım dört süvarisiyle hücuma geçer ve önündekileri Athafit'e yaklaşana kadar sürer. El-Da'am, süvarileri ve piyadeleri pusuya düşürdüğü için, El-Katad'dakileri kuşatmak üzere yüz süvari ve bin piyadeyle yola çıkar."
  id: "Al-Hadi melaksanakan salat Zuhur paling awal di dekat Athafit dan mempersiapkan pasukannya. Al-Da’am menguasai tempat bernama Al-Katad dan membangun tangga yang dari sana ia turun ke Athafit. Kemudian ia mengirimkan pasukan berkudanya ke sana, yang berjumlah sekitar dua ratus tiga puluh penunggang kuda dan dua ribu tentara berjalan kaki, berbeda dengan tiga puluh penunggang kuda dan tujuh ratus tentara berjalan kaki yang dimiliki Al-Hadi. Abu Al-Qasim menyerang dengan empat penunggang kuda dan mengusir pasukan di depannya hingga mendekati Athafit. Al-Da’am telah menyergap pasukan berkuda dan tentara, sehingga ia keluar dengan seratus penunggang kuda dan seribu tentara berjalan kaki untuk mencegat pasukan di Al-Katad."
