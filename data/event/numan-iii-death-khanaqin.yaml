date:
  start: { edtf: "0607", calendar: julian, precision: year, status: tradition, derived: true, note: "جاهلي؛ التاريخ تقريبي عند أهل الأيام {cite:kamil-ibn-al-athir p. 367-368}." }
summary:
  ar: "لما بلغ النعمان بن المنذر ما وسوس به زيد بن عدي عند كسرى أبرويز جاءه كتابه يستدعيه، فلحق بجبلي طيء يستجيرهم فأبوا خوفًا من كسرى، فنزل في بني شيبان بذي قار سرًا فأودع هانئ بن مسعود أهله وماله وفيه أربعمائة درع وقيل ثمانمائة، ولقيه زيد بن عدي على قنطرة ساباط فقال النعمان لئن انفلت لأفعلن بك ما فعلت بأبيك فقال زيد امض نعيم فقد وضعت لك عنده أخية لا يقطعها المهر الأرن، فقُيّد وبُعث به إلى خانقين فوقع الطاعون فمات فيه، والناس يظنون أنه مات بساباط على قول الأعشى محرزقًا، فاستعمل كسرى إياس بن قبيصة الطائي على الحيرة {cite:kamil-ibn-al-athir p. 367-368}."
  en: "Warned by Zayd ibn ʿAdī's whispering to Khusraw Parwīz, al-Nuʿmān III was summoned to court. Ṭayyiʾ refused him asylum; at Dhu Qār he secretly lodged his family, wealth and four hundred coats of mail (some say eight) with Hāniʾ ibn Masʿūd of Banū Shaybān. Meeting Zayd on the bridge of Sābāṭ he vowed revenge; Zayd answered «go, little Nuʿaym — I have set a hobble on you no fiery stallion will break». Fettered and sent to Khāniqīn, he died when the plague struck — though some hold he died crucified at Sābāṭ as al-Aʿshā sang. Khusraw then set Iyās ibn Qabīṣa al-Ṭāʾī over al-Ḥīra {cite:kamil-ibn-al-athir p. 367-368}."
  es: "Advertido por los susurros de Zayd ibn ʿAdī a Khusraw Parwīz, al-Nuʿmān III fue convocado a la corte. Ṭayyiʾ le negó asilo; en Dhu Qār, alojó secretamente a su familia, sus riquezas y cuatrocientas cotas de malla (algunos dicen ocho) con Hāniʾ ibn Masʿūd de Banū Shaybān. Al encontrarse con Zayd en el puente de Sābāṭ, juró venganza; Zayd respondió: «Vete, pequeño Nuʿaym; te he puesto una atadura que ningún semental fogoso podrá romper». Encadenado y enviado a Khāniqīn, murió cuando la peste azotó, aunque algunos sostienen que murió crucificado en Sābāṭ, como cantaba al-Aʿshā. Cosruo luego colocó a Iyās ibn Qabīṣa al-Ṭāʾī sobre al-Ḥīra {cita:kamil-ibn-al-athir p. 367-368}."
  fr: "Averti par les murmures de Zayd ibn ʿAdī à Khusraw Parwīz, al-Nuʿmān III fut convoqué à la cour. Ṭayyiʾ lui refusa l'asile; à Dhu Qār, il confia secrètement sa famille, ses biens et quatre cents cottes de mailles (certains disent huit) à Hāniʾ ibn Masʿūd de Banū Shaybān. Rencontrant Zayd sur le pont de Sābāṭ, il jura vengeance; Zayd lui répondit: « Va, petit Nuʿaym, je t'ai mis un carcan qu'aucun étalon fougueux ne pourra briser. » Enchaîné et envoyé à Khāniqīn, il mourut lors de l'épidémie de peste – bien que certains affirment qu'il mourut crucifié à Sābāṭ, comme le chantait al-Aʿshā. Khusraw a ensuite placé Iyās ibn Qabīṣa al-Ṭāʾī sur al-Ḥīra {cite:kamil-ibn-al-athir p. 367-368}."
  ur: "خسرو پرویز کو زید بن عدی کی سرگوشی سے متنبہ کیا گیا، النعمان سوم کو عدالت میں طلب کیا گیا۔ طائی نے اسے پناہ دینے سے انکار کر دیا۔ ذو قار میں اس نے اپنے اہل و عیال، مال و دولت اور چار سو زرہیں ⁦(بعض لوگ آٹھ کہتے ہیں)⁩ بنو شیبان کے ہانی بن مسعود کے پاس چپکے سے رکھ دیے۔ سبط کے پل پر زید سے ملاقات کرتے ہوئے اس نے بدلہ لینے کا عزم کیا۔ زید نے جواب دیا \"جاؤ، ننھے نعیم، میں نے تم پر ایک ہتھکڑی لگا دی ہے، کوئی آتشی گھوڑا نہیں ٹوٹے گا۔\" بیڑی لگا کر خانقین کے پاس بھیجا گیا، جب طاعون آیا تو اس کی موت ہو گئی - حالانکہ کچھ کا خیال ہے کہ وہ سبط میں مصلوب ہو کر مر گیا جیسا کہ العشا نے گایا تھا۔ پھر خسرو نے ایاس بن قبیصہ الطائفی کو الحیرہ پر مقرر کیا۔ 367-368}۔"
  tr: "El-Nu'man ibn El-Mundhir, Zeyd ibn Adi'nin Hüsrü Parviz'e fısıldadıklarını öğrenince, Zeyd ibn Adi'nin mektubu ona ulaştı ve onu çağırdı. Bunun üzerine El-Nu'man, Tayy dağlarına giderek onların korumasına sığındı, ancak Hüsrü'nden korktukları için onu geri çevirdiler. Bunun üzerine gizlice Zikar'daki Beni Şeyban kabilesinin arasına yerleşti ve ailesini ve servetini, ki bu servet dört yüz veya sekiz yüz zırhı da içeriyordu, Hani' ibn Mes'ud'a emanet etti. Zeyd ibn Adi, Sabat köprüsünde onunla karşılaştı ve El-Nu'man, \"Eğer kaçarsan, babana yaptığımı sana da yapacağım\" dedi. Zeyd, \"Git Nu'aym, çünkü ona hiçbir tayın koparamayacağı bir bağ bağladım\" dedi. Böylece Nu'aym bağlandı ve Hanıkin'e gönderildi, orada veba salgını çıktı ve Nu'aym öldü. İnsanlar, El-A'şa'nın \"O bir zalimdir\" sözüne göre, onun Sabat'ta öldüğünü sandılar. Hüsrev daha sonra İyas ibn Qabisah Al-Ta'i'yi Al-Hirah'ın valisi olarak atadı. {alıntı: kamil-ibn-el-esir s. 367-368}"
  id: "Ketika Al-Nu’man ibn Al-Mundhir mengetahui apa yang dibisikkan Zayd ibn Adi kepada Khosrow Parviz, suratnya datang kepadanya untuk memanggilnya. Maka ia pergi ke pegunungan Tayy untuk meminta perlindungan mereka, tetapi mereka menolaknya karena takut kepada Khosrow. Maka ia diam-diam menetap di antara Bani Shayban di Dhi Qar dan mempercayakan keluarganya dan hartanya, yang termasuk empat ratus atau delapan ratus set baju zirah, kepada Hani’ ibn Mas’ud. Zayd ibn Adi menemuinya di jembatan Sabat, dan Al-Nu’man berkata, “Jika kau melarikan diri, aku akan melakukan kepadamu apa yang kulakukan kepada ayahmu.” Zayd berkata, “Pergilah, Nu’aym, karena aku telah mengikatnya dengan ikatan yang tak dapat dipatahkan oleh anak kuda.” Maka ia diikat dan dikirim ke Khaniqin, tempat wabah penyakit merebak dan ia meninggal. Orang-orang mengira bahwa ia meninggal di Sabat, sesuai dengan perkataan Al-A’sha, “Ia adalah seorang tiran.” Khosrow kemudian mengangkat Iyas ibn Qabisah Al-Ta'i sebagai gubernur Al-Hirah. {mengutip: kamil-ibn-al-athir hal. 367-368}"
