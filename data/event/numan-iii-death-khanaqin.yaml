label: { ar: "استدعاء النعمان بن المنذر وموته بخانقين", en: "al-Nuʿmān III summoned by Khusraw — the deposit with Hāniʾ and death at Khāniqīn" }
date:
  start: { edtf: "0607", calendar: julian, precision: year, status: tradition, derived: true, note: "جاهلي؛ التاريخ تقريبي عند أهل الأيام {cite:kamil-ibn-al-athir p. 367-368}." }
summary:
  ar: "لما بلغ النعمان بن المنذر ما وسوس به زيد بن عدي عند كسرى أبرويز جاءه كتابه يستدعيه، فلحق بجبلي طيء يستجيرهم فأبوا خوفًا من كسرى، فنزل في بني شيبان بذي قار سرًا فأودع هانئ بن مسعود أهله وماله وفيه أربعمائة درع وقيل ثمانمائة، ولقيه زيد بن عدي على قنطرة ساباط فقال النعمان لئن انفلت لأفعلن بك ما فعلت بأبيك فقال زيد امض نعيم فقد وضعت لك عنده أخية لا يقطعها المهر الأرن، فقُيّد وبُعث به إلى خانقين فوقع الطاعون فمات فيه، والناس يظنون أنه مات بساباط على قول الأعشى محرزقًا، فاستعمل كسرى إياس بن قبيصة الطائي على الحيرة {cite:kamil-ibn-al-athir p. 367-368}."
  en: "Warned by Zayd ibn ʿAdī's whispering to Khusraw Parwīz, al-Nuʿmān III was summoned to court. Ṭayyiʾ refused him asylum; at Dhu Qār he secretly lodged his family, wealth and four hundred coats of mail (some say eight) with Hāniʾ ibn Masʿūd of Banū Shaybān. Meeting Zayd on the bridge of Sābāṭ he vowed revenge; Zayd answered «go, little Nuʿaym — I have set a hobble on you no fiery stallion will break». Fettered and sent to Khāniqīn, he died when the plague struck — though some hold he died crucified at Sābāṭ as al-Aʿshā sang. Khusraw then set Iyās ibn Qabīṣa al-Ṭāʾī over al-Ḥīra {cite:kamil-ibn-al-athir p. 367-368}."
