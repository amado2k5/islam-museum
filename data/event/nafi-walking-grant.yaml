summary:
  ar: "أمر زياد عبد الرحمن بن تبع الحميري وكان على قطائعه أن يقطع نافع بن الحارث الثقفي ما مشى فمشى فانقطع شسعه فجلس فقال حسبك فقال لو علمت لمشيت إلى الأبلة فقال دعني حتى أرمي بنعلي فرمى بها حتى بلغت الإجانة."
  en: "Ziyad told Abd al-Rahman ibn Tubba' al-Himyari, master of his land-grants, to grant Nafi' ibn al-Harith 'what he walks'; Nafi' walked till his sandal-strap broke and sat — 'enough' — 'had I known, I would have walked to Ubulla' — 'let me throw my sandal' — and he threw it as far as al-Ijana."
