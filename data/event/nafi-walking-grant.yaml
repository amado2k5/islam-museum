id: event/nafi-walking-grant
class: event
kind: other
label: { ar: "قطيعة نافع ما مشى", en: "Nafi' ibn al-Harith's Walking Grant", es: "Beca para caminar de Nafi' ibn al-Harith", fr: "Bourse de marche de Nafi' ibn al-Harith", ur: "نافع ابن حارث کی واکنگ گرانٹ", tr: "Nafi'nin bağlarını koparması gerçekleşmedi.", id: "Pemutusan hubungan oleh Nafi tidak terjadi." }
summary:
  ar: "أمر زياد عبد الرحمن بن تبع الحميري وكان على قطائعه أن يقطع نافع بن الحارث الثقفي ما مشى فمشى فانقطع شسعه فجلس فقال حسبك فقال لو علمت لمشيت إلى الأبلة فقال دعني حتى أرمي بنعلي فرمى بها حتى بلغت الإجانة."
  en: "Ziyad told Abd al-Rahman ibn Tubba' al-Himyari, master of his land-grants, to grant Nafi' ibn al-Harith 'what he walks'; Nafi' walked till his sandal-strap broke and sat — 'enough' — 'had I known, I would have walked to Ubulla' — 'let me throw my sandal' — and he threw it as far as al-Ijana."
  es: "Ziyad le dijo a Abd al-Rahman ibn Tubba' al-Himyari, el dueño de sus concesiones de tierras, que le diera a Nafi' ibn al-Harith 'lo que camina'; Nafi' caminó hasta que se le rompió la correa de la sandalia y se sentó — 'basta' — 'si lo hubiera sabido, habría caminado hasta Ubulla' — 'déjame tirar mi sandalia' — y la tiró tan lejos como al-Ijana."
  fr: "Ziyad dit à Abd al-Rahman ibn Tubba' al-Himyari, maître de ses concessions de terres, d'accorder à Nafi' ibn al-Harith « ce qu'il parcourt »; Nafi' marcha jusqu'à ce que la lanière de sa sandale se casse et s'assit — « assez » — « si j'avais su, j'aurais marché jusqu'à Ubulla » — « laissez-moi jeter ma sandale » — et il la jeta jusqu'à al-Ijana."
  ur: "زیاد نے عبدالرحمٰن بن توبہ الحمیری سے کہا، جو کہ اس کی زمینوں کے مالک ہیں، نافع ابن حارث کو 'جو وہ چلتا ہے' دے دے؛ نافی اس وقت تک چلتا رہا جب تک کہ اس کی سینڈل کا پٹا ٹوٹ گیا اور بیٹھ گیا — 'بس' — 'اگر مجھے معلوم ہوتا تو میں اوبولا تک چلا جاتا' — 'مجھے اپنی سینڈل پھینکنے دو' — اور اس نے اسے الجانہ تک پھینک دیا۔"
  tr: "Ziyad, mülklerinin sorumlusu olan Abdülrahman ibn Tubba el-Himyari'ye Nafi' ibn el-Harith el-Saqafi'nin ayağını kesmesini emretti. Bunun üzerine Nafi' ibn el-Harith el-Saqafi yürümeye başladı ve sandaletinin kayışı koptu, bu yüzden oturdu. \"Yeter artık,\" dedi. \"Bunu bilseydim, Ubla'ya kadar yürürdüm,\" dedi. \"Sandalımı atayım,\" dedi. Ve sandaletini havuza kadar attı."
  id: "Ziyad memerintahkan Abd al-Rahman ibn Tubba’ al-Himyari, yang bertanggung jawab atas tanah miliknya, untuk memotong kaki Nafi’ ibn al-Harith al-Thaqafi. Maka ia berjalan dan tali sandalnya putus, lalu ia duduk. Ia berkata, “Cukup sudah.” Ia berkata, “Seandainya aku tahu, aku pasti akan berjalan ke al-Ubla.” Ia berkata, “Biarkan aku melempar sandalku.” Maka ia melemparnya hingga mencapai baskom."
