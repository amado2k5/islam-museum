label: { en: "The Prophet's journey to al-Ta'if", ar: "خروج النبي إلى الطائف" }
summary:
  en: "The Prophet Muhammad's journey on foot with Zayd ibn Haritha to al-Ta'if in Shawwal of the tenth year of prophethood, seeking support from Thaqif, their rejection, the incident of Addas in the orchard, and the encounter with the Jinn at Nakhla on return."
  ar: "خروج النبي ماشياً على قدميه ومعه زيد بن حارثة إلى الطائف في شوال سنة 10 من النبوة يلتمس النصرة من ثقيف، وردّ رؤسائهم الثلاثة له، وإغراء الصبيان به، ودعاؤه في بستان ابني ربيعة وإسلام عداس، واستماع نفر من الجن للقرآن بوادي نخلة في طريق العودة."
