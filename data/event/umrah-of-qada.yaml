label: { en: "The Fulfilled Umrah (Umrat al-Qada)", ar: "عمرة القضاء" }
summary:
  en: "In Dhu al-Qa'da 7 AH (March 629 CE), fulfilling the treaty of Hudaybiyya, the Prophet and 2,000 Muslims entered Mecca unarmed to perform Umrah while Quraysh watched from the hills; the Prophet married Maymuna bint al-Harith and the demonstration of Muslim devotion profoundly shifted Meccan sentiment, leading to the conversions of Khalid ibn al-Walid, Amr ibn al-As, and Uthman ibn Talha."
  ar: "في ذي القعدة سنة 7هـ (مارس 629م)، دخل النبي في ألفين من أصحابه معتمرين قضاءً لعمرة الحديبية، وخلت قريش مكة ثلاثة أيام ونزلوا برؤوس الجبال ينظرون إليهم، وطاف النبي بالبيت وهو يرتجز وابن رواحة متوشحاً سيفه بين يديه؛ وتزوج النبي ميمونة بنت الحارث، فمهدت هذه العمرة لفتح مكة وإسلام دهاة قريش: خالد وعمرو وعثمان بن طلحة."
