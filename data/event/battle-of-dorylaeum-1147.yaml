summary:
  ar: "بطاقة أولية لمعركة ضورليم الثانية سنة ١١٤٧م، كمين السلاجقة لجيش كونراد الثالث في الحملة الثانية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Second Battle of Dorylaeum in 1147, the Seljuk ambush of Conrad III's army in the Second Crusade; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Segunda Batalla de Dorilea en 1147, la emboscada selyúcida al ejército de Conrado III en la Segunda Cruzada; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour la seconde bataille de Dorylée en 1147, l'embuscade seldjoukide contre l'armée de Conrad III lors de la deuxième croisade; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1147 میں ڈوریلیم کی دوسری جنگ کے لیے ڈرافٹ کارڈ، دوسری صلیبی جنگ میں کونراڈ III کی فوج کا سلجوک حملہ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1147 yılında gerçekleşen İkinci Dorylaeum Muharebesi'nin (Selçukluların İkinci Sefer sırasında III. Conrad'ın ordusuna düzenlediği pusu) ön raporu; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Dorylaeum Kedua pada tahun 1147 M, penyergapan Seljuk terhadap pasukan Conrad III dalam Kampanye Kedua; sumber-sumber di halaman ini belum ditinjau."
