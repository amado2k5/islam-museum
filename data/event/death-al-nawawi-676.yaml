label:
  ar: "وفاة الإمام النووي بنوى، ٦٧٦هـ/١٢٧٧م"
  en: "Death of Imam al-Nawawi at Nawa, 676/1277"
  ur: "نوى میں امام نووی کی وفات، 676ھ/1277ء"
  es: "Muerte del Imam al-Nawawi en Nawa, 676/1277"
  fr: "Mort de l'Imam al-Nawawi à Nawa, 676/1277"
  tr: "İmam Nevevi'nin Nawa'da ölümü, H. 676/MS 1277"
  id: "Wafatnya Imam al-Nawawi di Nawa, 676 H/1277 M"
summary:
  ar: "توفي النووي غير متزوج في بيت أبيه بنوى ليلة الأربعاء رابع عشري رجب سنة ٦٧٦هـ على ما في شذرات الذهب، وضبطه ابن كثير ودائرة المعارف بليلة أربع وعشرين رجب الموافقة ٢٢ كانون الأول ١٢٧٧م، ودُفن ببلده وما يزال قبره مكرَّماً فيها؛ وكان قبل وفاته قد سافر إلى بلده وزار القدس والخليل ثم عاد فمرض عند أبويه {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:al-bidaya-wal-nihaya p. 294} {cite:shadharat-dhahab p. 356}."
  en: "Al-Nawawi died unmarried in his father's house at Nawa. Shadharat al-Dhahab gives the night of Wednesday 14 Rajab 676, while Ibn Kathir and the Encyclopaedia of Islam fix it at 24 Rajab, 22 December 1277; he was buried in his home town, where his tomb is still honoured. Before his death he had travelled home and visited Jerusalem and Hebron, then returned and fell ill at his parents' house {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:al-bidaya-wal-nihaya p. 294} {cite:shadharat-dhahab p. 356}."
  ur: "نووی کبھی شادی نہیں کی اور اپنے والد کے گھر نوى میں فوت ہوئے۔ شذرات الذہب نے بدھ کی رات 14 رجب 676ھ دی ہے، جبکہ ابن کثیر اور دائرۃ المعارف نے 24 رجب، بمطابق 22 دسمبر 1277ء، ضبط کیا؛ وہ اپنے گاؤں میں دفن ہوئے اور ان کا مزار آج بھی وہاں معزز ہے۔ وفات سے پہلے وہ اپنے گاؤں گئے، بیت المقدس اور خلیل کی زیارت کی، پھر لوٹ کر والدین کے ہاں بیمار ہوئے {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:al-bidaya-wal-nihaya p. 294} {cite:shadharat-dhahab p. 356}۔"
  es: "Al-Nawawi murió soltero en la casa de su padre en Nawa. Shadharat al-Dhahab sitúa la noche del miércoles 14 de Rajab de 676, mientras que Ibn Kathir y la Enciclopedia del Islam la ubican el 24 de Rajab, 22 de diciembre de 1277; fue enterrado en su ciudad natal, donde su tumba aún se venera. Antes de su muerte, había viajado a su hogar y visitado Jerusalén y Hebrón, luego regresó y enfermó en la casa de sus padres {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:al-bidaya-wal-nihaya p. 294} {cite:shadharat-dhahab p. 356}."
  fr: "Al-Nawawi mourut célibataire dans la maison de son père à Nawa. Shadharat al-Dhahab indique la nuit du mercredi 14 Rajab 676, tandis qu'Ibn Kathir et l'Encyclopédie de l'Islam la fixent au 24 Rajab, soit le 22 décembre 1277; il fut enterré dans sa ville natale, où sa tombe est encore vénérée. Avant sa mort, il avait voyagé jusqu'à son domicile et visité Jérusalem et Hébron, puis était revenu et était tombé malade chez ses parents."
  tr: "El-Nawawi, Şedharat el-Dhahab'da belirtildiği üzere, Hicri 676 yılının Receb ayının on dördüncü Çarşamba gecesi, babasının evinde bekar olarak vefat etmiştir. İbn Kathir ve İslam Ansiklopedisi ise bu tarihi Receb ayının yirmi dördüncü gecesi, yani Miladi 22 Aralık 1277 olarak kaydetmiştir. Memleketinde defnedilmiş ve mezarı hala orada saygı görmektedir. Ölümünden önce memleketine gidip Kudüs ve Hebron'u ziyaret etmiş, sonra geri dönüp anne babasının evinde hastalanmıştır. {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:al-bidaya-wal-nihaya p. 294} {cite:shadharat-dhahab p. 356}"
  id: "Al-Nawawi wafat belum menikah di rumah ayahnya di Nawa pada malam Rabu, tanggal empat belas Rajab, 676 H, menurut catatan dalam Shadharat al-Dhahab. Ibn Kathir dan Ensiklopedia mencatatnya sebagai malam tanggal dua puluh empat Rajab, yang bertepatan dengan 22 Desember 1277 M. Ia dimakamkan di kampung halamannya, dan makamnya masih dihormati di sana. Sebelum wafat, ia telah melakukan perjalanan ke kampung halamannya dan mengunjungi Yerusalem dan Hebron, kemudian kembali dan jatuh sakit di rumah orang tuanya. {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:al-bidaya-wal-nihaya p. 294} {cite:shadharat-dhahab p. 356}."
