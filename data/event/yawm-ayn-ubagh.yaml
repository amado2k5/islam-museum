summary:
  ar: "يوم عين أباغ بين المنذر بن ماء السماء ملك الحيرة والحارث الأعرج بن أبي شمر ملك غسان: سار المنذر بمعد كلها حتى نزل عين أباغ بذات الخيار وخيّر الحارث بين الفدية والحرب، فاصطلحا على أن يتبارز أولادهما فمن فني أولاده خرج هو، فغدر المنذر فأخرج عبدًا من شجعانه في صورة ابنه فقتل ابني الحارث واحدًا بعد واحد، حتى أنكرهما الثاني وقال الحارث ما كان الشيخ ليغدر، فأخبره شمر بن عمرو الحنفي بالغدر فلحق بعسكر الحارث. فعبّأ الحارث أصحابه في أربعين ألفًا فاقتتلوا فقتل المنذر وهُزمت جيوشه، فحمل ابنيه على بعير بمنزلة العدلين وجعل المنذر فوقهما فردًا وقال يا لعلاوة دون العدلين فذهبت مثلًا، وسار إلى الحيرة فأنهبها وأحرقها ودفن ابنيه بها وبنى عليهما الغربين في قول {cite:kamil-ibn-al-athir p. 407-408}."
  en: "At ʿAyn Ubāgh in Dhāt al-Khiyār, al-Mundhir ibn Māʾ al-Samāʾ — who had taken al-Ḥīra with all of Maʿadd — offered the Ghassanid al-Ḥārith the Lame ransom or war. They agreed their sons should duel to decision, but al-Mundhir sent a champion disguised as his son; twice a Ghassanid prince cried «this is no son of al-Mundhir» and twice the old king answered «the shaykh would never betray» — until Shamir ibn ʿAmr crossed over and revealed the trick. With forty thousand the Ḥārith broke the Lakhmid host and killed al-Mundhir, laid him above the two dead princes on one camel — «a singleton beneath the pair», which became a proverb — sacked and burned al-Ḥīra, and raised the two Ghurāb towers over his sons' graves {cite:kamil-ibn-al-athir p. 407-408}."
  es: "En ʿAyn Ubāgh, en Dhāt al-Khiyār, al-Mundhir ibn Māʾ al-Samāʾ —quien había tomado al-Ḥīra con todo Maʿadd— ofreció al Ghassanid al-Ḥārith el rescate de Cojo o la guerra. Acordaron que sus hijos se batirían en duelo para decidir, pero al-Mundhir envió a un campeón disfrazado de su hijo; dos veces un príncipe Ghassanid gritó «este no es hijo de al-Mundhir» y dos veces el anciano rey respondió «el jeque jamás traicionaría» —hasta que Shamir ibn ʿAmr cruzó y reveló el engaño. Con cuarenta mil hombres, el Ḥārith rompió el ejército de Lakhmid y mató a al-Mundhir, lo colocó sobre los dos príncipes muertos en un camello —«un solo hombre debajo de la pareja», lo que se convirtió en un proverbio—, saqueó e incendió al-Ḥīra y levantó las dos torres de Ghurāb sobre las tumbas de sus hijos {cite:kamil-ibn-al-athir p. 407-408}."
  fr: "À ʿAyn Ubāgh, dans le Dhāt al-Khiyār, al-Mundhir ibn Māʾ al-Samāʾ, qui avait conquis al-Ḥīra avec tout le Maʿadd, proposa au Ghassanide al-Ḥārith le Boiteux la rançon ou la guerre. Ils convinrent que leurs fils s'affronteraient en duel, mais al-Mundhir envoya un champion déguisé en son fils; par deux fois, un prince ghassanide s'écria: « Ce n'est pas le fils d'al-Mundhir ! » et par deux fois, le vieux roi répondit: « Le cheikh ne trahirait jamais ! » – jusqu'à ce que Shamir ibn ʿAmr franchisse le seuil et révèle la supercherie. Avec quarante mille hommes, les Ḥārith brisèrent l'armée des Lakhmid et tuèrent al-Mundhir, le déposèrent au-dessus des deux princes morts sur un seul chameau — « un seul sous la paire », ce qui devint un proverbe — pillèrent et incendièrent al-Ḥīra, et élevèrent les deux tours Ghurāb au-dessus des tombes de ses fils {cite:kamil-ibn-al-athir p. 407-408}."
  ur: "ذات الخیار میں عین اباغ کے مقام پر، المنذر بن معاذ السماع - جس نے تمام معد کے ساتھ الحیرہ لیا تھا - نے غسانی الحارث کو لنگڑے تاوان یا جنگ کی پیشکش کی۔ انہوں نے اس بات پر اتفاق کیا کہ ان کے بیٹوں کو فیصلہ کرنا چاہئے، لیکن المنذر نے اپنے بیٹے کے بھیس میں ایک چیمپئن بھیجا۔ ایک غسانی شہزادے نے دو بار پکارا \"یہ المنذر کا بیٹا نہیں ہے\" اور دو بار بوڑھے بادشاہ نے جواب دیا \"شیخ کبھی غداری نہیں کرے گا\" - یہاں تک کہ شمر بن عمرو نے پار کر کے چال کا انکشاف کیا۔ حارث نے چالیس ہزار کے ساتھ لخمید کے لشکر کو توڑا اور المنذر کو قتل کر دیا، اسے دو مردہ شہزادوں کے اوپر ایک اونٹ پر بٹھایا - \"جوڑے کے نیچے ایک سنگلٹن\"، جو ایک محاورہ بن گیا - الحیرہ کو برطرف کیا اور جلا دیا، اور اپنے بیٹوں کی قبروں پر غوراب کے دو برج کھڑے کر دیے۔ 407-408}۔"
