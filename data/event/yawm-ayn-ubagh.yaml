summary:
  ar: "يوم عين أباغ بين المنذر بن ماء السماء ملك الحيرة والحارث الأعرج بن أبي شمر ملك غسان: سار المنذر بمعد كلها حتى نزل عين أباغ بذات الخيار وخيّر الحارث بين الفدية والحرب، فاصطلحا على أن يتبارز أولادهما فمن فني أولاده خرج هو، فغدر المنذر فأخرج عبدًا من شجعانه في صورة ابنه فقتل ابني الحارث واحدًا بعد واحد، حتى أنكرهما الثاني وقال الحارث ما كان الشيخ ليغدر، فأخبره شمر بن عمرو الحنفي بالغدر فلحق بعسكر الحارث. فعبّأ الحارث أصحابه في أربعين ألفًا فاقتتلوا فقتل المنذر وهُزمت جيوشه، فحمل ابنيه على بعير بمنزلة العدلين وجعل المنذر فوقهما فردًا وقال يا لعلاوة دون العدلين فذهبت مثلًا، وسار إلى الحيرة فأنهبها وأحرقها ودفن ابنيه بها وبنى عليهما الغربين في قول {cite:kamil-ibn-al-athir p. 407-408}."
  en: "At ʿAyn Ubāgh in Dhāt al-Khiyār, al-Mundhir ibn Māʾ al-Samāʾ — who had taken al-Ḥīra with all of Maʿadd — offered the Ghassanid al-Ḥārith the Lame ransom or war. They agreed their sons should duel to decision, but al-Mundhir sent a champion disguised as his son; twice a Ghassanid prince cried «this is no son of al-Mundhir» and twice the old king answered «the shaykh would never betray» — until Shamir ibn ʿAmr crossed over and revealed the trick. With forty thousand the Ḥārith broke the Lakhmid host and killed al-Mundhir, laid him above the two dead princes on one camel — «a singleton beneath the pair», which became a proverb — sacked and burned al-Ḥīra, and raised the two Ghurāb towers over his sons' graves {cite:kamil-ibn-al-athir p. 407-408}."
