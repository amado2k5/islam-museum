label: { ar: "يوم عين أباغ — مقتل المنذر بن ماء السماء", en: "the day of ʿAyn Ubāgh — al-Mundhir ibn Māʾ al-Samāʾ killed by the Ghassanid al-Ḥārith", es: "el día de ʿAyn Ubāgh - al-Mundhir ibn Māʾ al-Samāʾ asesinado por los Ghassanid al-Ḥārith" }
date:
