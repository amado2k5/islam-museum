summary:
  ar: "بطاقة أولية لمعركة كوفادونجا نحو سنة ٧٢٢م، الوقعة التي تُروى على أنها أول نصر مسيحي بعد الفتح الإسلامي للأندلس وبداية المقاومة الأستورية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Covadonga around 722, the engagement told as the first Christian victory after the conquest of al-Andalus and the seed of the Asturian resistance; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Batalla de Covadonga alrededor del año 722, enfrentamiento que se narra como la primera victoria cristiana tras la conquista de al-Ándalus y la semilla de la resistencia asturiana; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour la bataille de Covadonga vers 722, l'engagement présenté comme la première victoire chrétienne après la conquête d'al-Andalus et le germe de la résistance asturienne; ses sources ne sont pas encore vérifiées sur la page."
  ur: "722 کے آس پاس کوواڈونگا کی جنگ کے لیے ڈرافٹ کارڈ، اس منگنی کو الاندلس کی فتح کے بعد عیسائیوں کی پہلی فتح اور استوری مزاحمت کے بیج کے طور پر بتایا گیا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Yaklaşık 722 yılında gerçekleşen ve Endülüs'ün İslam tarafından fethinden sonraki ilk Hristiyan zaferi ve Asturya direnişinin başlangıcı olarak anlatılan Covadonga Muharebesi'nin ön açıklaması; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Catatan awal tentang Pertempuran Covadonga sekitar tahun 722 M, pertempuran yang diceritakan sebagai kemenangan Kristen pertama setelah penaklukan Andalusia oleh Islam dan awal perlawanan Asturias; sumber-sumbernya belum ditinjau di halaman ini."
