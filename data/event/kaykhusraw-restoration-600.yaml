label: { ar: "ملك كيخسرو بلاد الروم من ابن أخيه", en: "Kaykhusraw I's restoration to the Rum Sultanate (600 AH)", ur: "کیخسرو اول کی سلطنتِ روم پر بحالی ⁦(600ھ)⁩", es: "Restauración de Kaykhusraw I al Sultanato de Rum (600 AH)", fr: "Restauration du sultanat de Rum par Kaykhusraw Ier (600 AH)" }
summary:
  ar: "في رجب سنة ستمائة ملك غياث الدين كيخسرو بن قلج أرسلان بلاد الروم؛ كان قد هرب من أخيه ركن الدين سليمان الذي أخذ قونية، فقصد الملك الظاهر صاحب حلب فلم يجد عنده قبولاً، وتقلب في البلاد حتى وصل القسطنطينية فأحسن إليه ملك الروم وأقطعه وتزوج ابنة بطريق كبير، فلما ملك الفرنج القسطنطينية هرب إلى حميه بقلعته؛ فلما مات أخوه سنة ستمائة خالف الأتراك الأوج على ابن أخيه واستدعوا غياث الدين، فسار وقصد قونية فهزمه عسكر ابن أخيه، فبقي حيران لا يدري أين يتوجه حتى وثب أهل أقصرا على الوالي ونادوا بشعار غياث الدين، فلما سمع أهل قونية قالوا نحن أولى لأنه كان حسن السيرة فينا، فنادوا باسمه وأخرجوا من عندهم واستدعوه فملك المدينة وقبض ابن أخيه ومن معه، وجمع الله له البلاد جميعها في ساعة واحدة {cite:kamil-ibn-al-athir p. 237-238}."
  en: "Rajab 600: Ghiyath al-Din Kaykhusraw's astonishing restoration — the exile who had been snubbed at Aleppo, pensioned in Constantinople and married to a patrician's daughter before the Frankish sack, was called back by the Oghuz Turks on his brother's death, routed before Konya — until the people of Aksaray rose crying his name and Konya followed: 'in one hour God gathered the whole kingdom for him' {cite:kamil-ibn-al-athir p. 237-238}."
  es: "Rajab 600: La asombrosa restauración de Ghiyath al-Din Kaykhusraw —el exiliado que había sido despreciado en Alepo, pensionado en Constantinopla y casado con la hija de un patricio antes del saqueo franco, fue llamado de vuelta por los turcos oguz tras la muerte de su hermano, derrotado ante Konya— hasta que el pueblo de Aksaray se levantó clamando su nombre y Konya le siguió: «en una hora Dios reunió todo el reino para él» {cita:kamil-ibn-al-athir págs. 237-238}."
  fr: "Rajab 600: La restauration étonnante de Ghiyath al-Din Kaykhusraw — l'exilé qui avait été snobé à Alep, pensionné à Constantinople et marié à la fille d'un patricien avant le sac franc, fut rappelé par les Turcs Oghuz à la mort de son frère, mis en déroute devant Konya — jusqu'à ce que les habitants d'Aksaray se lèvent en criant son nom et que Konya suive: « en une heure, Dieu a rassemblé tout le royaume pour lui » {cite: kamil-ibn-al-athir p. 237-238}."
