label: { ar: "بناء أنوشروان سد الباب والأبواب", en: "Anushirwan's Building of the Bab wa-l-Abwab Wall", es: "La construcción del muro de Bab wa-l-Abwab por Anushirwan", fr: "La construction du mur de Bab wa-l-Abwab par Anushirwan", ur: "انوشیروان کی باب و الابواب وال کی عمارت" }
summary:
  ar: "عند البلاذري عن أهل العلم بأمور أرمينية: وطىء قائد قباذ بن فيروز الملك في اثني عشر ألفاً بلاد أران وفتح ما بين نهر الرس إلى شروان ثم لحق به قباذ فبنى بأران مدينة البيلقان ومدينة برذعة — وهي مدينة الثغر كله — ومدينة قبلة وبنى سد اللبن فيما بين أرض شروان وباب اللان وبنى على سد اللبن ثلاثمائة وستين مدينة خربت بعد بناء الباب والأبواب؛ ثم ملك بعد قباذ ابنه أنوشروان كسرى بن قباذ فبنى مدينة الشابران ومدينة مسقط ثم بنى مدينة الباب والأبواب وبنى الدروزوقية وبنى بأرض جرزان مدينة سغدبيل وأنزلها قوماً من الصغد وأبناء فارس وجعلها مسلحة وبنى مما يلي الروم باب فيروزقباذ وباب لاذقة وباب بارقة على بحر طرابزندة وباب اللان وباب سمسخي وقلمّتي الجردمان وشمشلدى وفتح جميع ما كان في أيدي الروم من أرمينية وعمّر دبيل وحصّنها وبنى النشوى مدينة كورة البسفرجان وبنى حصن ويص وقلاعاً بأرض السيسجان منها قلعة الكلاب وساهيونس وأسكن الحصون والقلاع ذوي البأس والنجدة من السياسجية؛ وكتب أنوشروان إلى ملك الترك يسأله الموادعة وخطب ابنته وبعث إليه بأمة تبنّتها امرأة من نسائه على أنها ابنته ثم قدم عليه فالتقيا بالبرشلية وتنادما أياماً، وأمر خاصته أن يبيتوا طرفاً من عسكر التركي ويحرقوه ففعلوا فأنكر واعتذر ثم أمر بإلقاء النار في ناحية من عسكره لم يكن بها إلا أكواخ من حشيش وعيدان فلما أصبح ضج إلى التركي «كاد أصحابك يذهبون بعسكري وقد كافأتني بالغة» فحلف أنه لم يعلم فقال أنوشروان «يا أخي جندنا وجندك كرهوا صلحنا لانقطاع ما كان لهم من النيل في الغارات والحروب بيننا ولا آمن أن يحدثوا أحداثاً يفسدون بها قلوبنا بعد تصافينا وتخالصنا حتى نعود إلى العداوة بعد الصهر والمودة، والرأي أن تأذن لي في بناء حائط بيني وبينك نجعل عليه باباً فلا يدخل إليك من عندنا ولا إلينا من عندك إلا من أردت وأردنا» فأجابه فانصرف إلى بلاده وأقام أنوشروان لبناء الحائط فبناه من قبل البحر بالصخر والرصاص وجعل عرضه ثلاثمائة ذراع وألحقه برؤوس الجبال وأمر أن تُحمل الحجارة في السفن فتُغرَق في البحر حتى إذا ظهرت على وجه الماء بنى عليها فقاد الحائط في البحر ثلاثة أميال فلما فرغ من بنائه علّق على المدخل منه أبواب حديد ووكّل به مائة فارس يحرسونه بعد أن كان موضعه يحتاج إلى خمسين ألفاً من الجند وجعل عليه دبّابة، فقيل لخاقان بعد ذلك إنه خدعك وزوّجك غير ابنته وتحصّن منك فلم يقدر على حيلة."
  en: "In al-Baladhuri from those versed in Armenia's affairs: a general of Qubadh ibn Fayruz the king trod Arran's land with twelve thousand and took what lay between the river called al-Rass and Shirwan; Qubadh followed and built in Arran the city of al-Baylaqan, Bardha'a — the frontier's city entire — and Qabala, built the wall of al-Lubn between Shirwan's land and Bab al-Lan, and built upon it three hundred and sixty cities, ruined after the later building of Bab wa-l-Abwab; then his son Anushirwan Kisra ibn Qubadh ruled, built al-Shabiran and Masqat, then the city of Bab wa-l-Abwab and the Durzuqiyya, built in Jurzan's land the city of Sughdabil settling Sughdians and sons of Persians as a muslaha, built toward the Romans Bab Fayruzqubadh, Bab Ladhiqa, Bab Bariqa on the sea of Trebizond, Bab al-Lan and Bab Samsakhi, and the fortresses of al-Jardaman and Shamshalda, conquered all Armenia in Roman hands, settled and fortified Dabil, built Nashwa the city of Busfurrajan's district, built Hisn Ways and castles in Sisajan — among them Qal'at al-Kilab and Sahiyunis — and garrisoned these forts with the warlike and bold of the Siyasijiyya; Anushirwan wrote to the Turk king asking peace and sought his daughter's hand, sending him a slave-girl adopted by one of his wives as his daughter, then came and they met at al-Barshaliyya feasting for days; he ordered his intimates to night-raid and burn part of the Turk's camp, then denied and apologised, then had fire thrown into a part of his own camp where only straw huts stood, and in the morning complained to the Turk: 'your men nearly destroyed my army, and you have requited me with treachery' — the Turk swearing ignorance — so Anushirwan said: 'brother, your soldiers and mine hate our peace for the plunder lost in the raids and wars between us, and I fear they will make mischief to corrupt our hearts after our sincerity and friendship, returning us to enmity after kinship and affection — my counsel is that you let me build a wall between us with a gate through which none comes to you from us nor to us from you save whom we will'; he agreed and went home, and Anushirwan set to building the wall of rock and lead at the sea's edge, three hundred cubits wide, joined to the mountain-tops — ordering stones carried in ships and sunk until they rose above water to be built upon, so the wall ran three miles into the sea — and when finished hung iron gates at its entry, posted a hundred riders to guard where fifty thousand soldiers had once been needed, and set an armoured redoubt upon it; afterwards the Khaqan was told 'he deceived you — married you to one who is not his daughter, and fortified himself against you' — and he could contrive nothing."
  es: "En al-Baladhuri de aquellos versados en los asuntos de Armenia: un general de Qubadh ibn Fayruz el rey pasó por la tierra de Arran con doce mil y tomó lo que había entre el río llamado al-Rass y Shirwan; Qubadh siguió y construyó en Arran la ciudad de al-Baylaqan, Bardha'a —la ciudad de toda la frontera— y Qabala; luego su hijo Anushirwan Kisra ibn Qubadh gobernó y construyó al-Shabiran y Masqat, luego la ciudad de Bab wa-l-Abwab y Durzuqiyya Se asentaron y fortificaron Dabil, construyeron Nashwa la ciudad del distrito de Busfurrajan, construyeron Hisn Ways y castillos en Sisajan —entre ellos Qal'at al-Kilab y Sahiyunis— y guarnecieron estos fuertes con los guerreros y valientes de Siyasijiyya; Anushirwan escribió al rey turco pidiendo la paz y solicitando la mano de su hija, enviándole una esclava adoptada por una de sus esposas como su hija, luego vino y se encontraron en al-Barshaliyya festejando durante días; ordenó a sus íntimos que asaltaran de noche y quemaran parte del campamento turco, luego lo negó y se disculpó, luego hizo que arrojaran fuego a una parte de su propio campamento donde solo había chozas de paja; 'hermano, tus soldados y los míos odian nuestra paz por el botín perdido en las incursiones y guerras entre nosotros, y temo que harán daño para corromper nuestros corazones después de nuestra sinceridad y amistad, devolviéndonos a la enemistad después del parentesco y el afecto'. Él estuvo de acuerdo y regresó a casa, y Anushirwan se dispuso a construir el muro de roca y plomo en la orilla del mar, trescientos codos de ancho, unido a las cimas de las montañas, ordenando que se transportaran piedras en barcos y se hundieran hasta que emergieran del agua para construir sobre él cincuenta mil soldados que una vez fueron necesarios, y colocó un reducto blindado sobre él; Después, le dijeron al Khaqan: \"Te engañó, te casó con alguien que no es su hija y se fortificó contra ti\", y él no pudo idear nada."
  fr: "Dans al-Baladhuri, d'après ceux qui connaissent bien les affaires arméniennes: un général du roi Qubadh ibn Fayruz traversa le pays d'Arran avec douze mille hommes et prit ce qui se trouvait entre la rivière appelée al-Rass et Shirwan; Qubadh poursuivit et construisit à Arran la ville d'al-Baylaqan, Bardha'a — la ville de toute la frontière — et Qabala; puis son fils Anushirwan Kisra ibn Qubadh régna et construisit al-Shabiran et Masqat, puis la ville de Bab wa-l-Abwab et Durzuqiyya. Ils s'établirent et fortifièrent Dabil, construisirent Nashwa, la ville du district de Busfurrajan, construisirent Hisn Ways et des châteaux à Sisajan — parmi lesquels Qal'at al-Kilab et Sahiyunis — et garnirent ces forts des guerriers et des hardis de Siyasijiyya; Anushirwan écrivit au roi turc pour lui demander la paix et solliciter la main de sa fille. Il lui envoya une esclave adoptée par l'une de ses épouses. Ils se rendirent ensuite à al-Barshaliyya et festoyèrent pendant plusieurs jours. Anushirwan ordonna à ses hommes de mener un raid nocturne et d'incendier une partie du camp turc. Il se rétracta, présenta ses excuses, puis fit incendier une partie de son propre camp où ne se dressaient plus que des huttes de paille. « Frère, tes soldats et les miens haïssent notre paix à cause du butin perdu lors des raids et des guerres qui nous ont opposés. Je crains qu'ils ne cherchent à corrompre nos cœurs après notre sincérité et notre amitié, et à nous ramener à l'inimitié après les liens du sang et de l'affection. » Le roi accepta et rentra chez lui. Anushirwan entreprit alors la construction d'un mur de pierres et de plomb au bord de la mer, large de trois cents coudées et relié aux sommets des montagnes. Il ordonna que des pierres soient transportées par bateau et immergées jusqu'à ce qu'elles émergent des eaux. Cinquante mille soldats avaient été nécessaires pour construire sur ce mur, qui abritait autrefois une redoute fortifiée. Par la suite, on dit au Khaqan: « Il t’a trompé — il t’a marié à une femme qui n’est pas sa fille, et s’est fortifié contre toi » — et il ne put rien inventer."
  ur: "البلادوری میں آرمینیا کے امور میں مہارت رکھنے والوں میں سے ہے: قبادہ بن فیروز کا ایک جرنیل بادشاہ بارہ ہزار کے ساتھ عران کی سرزمین سے گزرا اور اس علاقے کو لے لیا جو الراس اور شیروان نامی دریا کے درمیان ہے۔ قباد نے تعاقب کیا اور اراران میں البیلکان شہر، بردعا - پورا سرحدی شہر - اور قبلہ تعمیر کیا۔ پھر اس کے بیٹے انوشیروان کسریٰ ابن قبد نے حکومت کی، اور الشبیران اور مسقط تعمیر کیا، پھر باب و الابواب اور دورزوقیہ کا شہر بنایا، انہوں نے دبیل کو آباد کیا اور قلعہ بندی کی، بسفررجان کے ضلع کا شہر نسوا تعمیر کیا، حسن کے راستے بنائے اور ان کے درمیان قصابی اور قصابیجان میں قلعے بنائے۔ ان قلعوں کو سیاسیجیہ کے جنگجو اور دلیرانہ انداز سے محفوظ کیا۔ انوشیروان نے ترک بادشاہ کو خط لکھا اور اپنی بیٹی کا ہاتھ مانگا، اس کے پاس ایک لونڈی بھیجی جسے اس کی بیویوں میں سے ایک نے اپنی بیٹی کے طور پر گود لیا تھا، پھر آیا اور وہ کئی دنوں تک البرشالیہ کی دعوت میں ملے۔ اس نے اپنے قریبیوں کو رات کو چھاپہ مارنے اور ترک کیمپ کے ایک حصے کو جلانے کا حکم دیا، پھر انکار کیا اور معافی مانگی، پھر اپنے ہی کیمپ کے ایک حصے میں آگ پھینک دی جہاں صرف بھوسے کی جھونپڑیاں کھڑی تھیں۔ ’’بھائی، تمہارے اور میرے سپاہی ہمارے درمیان چھاپوں اور جنگوں میں لوٹی ہوئی لوٹ مار سے ہمارے امن سے نفرت کرتے ہیں، اور مجھے ڈر ہے کہ وہ ہمارے خلوص اور دوستی کے بعد ہمارے دلوں کو خراب کرنے کے لیے فساد برپا کریں گے اور ہمیں رشتہ داری اور پیار کے بعد دشمنی پر لوٹا دیں گے۔ وہ راضی ہو گیا اور گھر چلا گیا، اور انوشیروان نے سمندر کے کنارے تین سو ہاتھ چوڑی چٹان اور سیسہ کی دیوار بنانے کا ارادہ کیا، پہاڑ کی چوٹیوں سے جڑ گیا - پتھروں کو جہازوں میں لے جانے کا حکم دیا اور اس وقت تک ڈوب گیا جب تک کہ وہ پانی سے اوپر نہ جائیں اور پچاس ہزار سپاہیوں کی ضرورت پڑ گئی تھی، اور اس پر ایک بکتر بند دستہ مقرر کیا گیا تھا۔ اس کے بعد خاقان کو بتایا گیا کہ 'اس نے آپ کو دھوکہ دیا - آپ کی شادی ایک ایسے شخص سے کی جو اس کی بیٹی نہیں ہے، اور آپ کے خلاف اپنے آپ کو مضبوط کر لیا' - اور وہ کچھ بھی نہ کر سکا۔"
