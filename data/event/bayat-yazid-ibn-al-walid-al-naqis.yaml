summary:
  ar: "في سنة ست وعشرين ومائة ذكر الطبري اضطراب أمر بني مروان بعد قتل الوليد بن يزيد، وخلاف أهل حمص {cite:tabari-tarikh-abu-al-fadl j.7 p.262}، وذكر أن مروان بن محمد لقّب يزيد بن الوليد بالناقص {cite:tabari-tarikh-abu-al-fadl j.7 p.262}، وعنوان بيعته في الفهرس {cite:tabari-tarikh-abu-al-fadl j.7 p.663}."
  en: "In 126 AH al-Tabari records the disorder in the affairs of the Marwanids after al-Walid ibn Yazid was killed, and the dissent of the people of Homs {cite:tabari-tarikh-abu-al-fadl j.7 p.262}. He records that Marwan ibn Muhammad gave Yazid ibn al-Walid the laqab al-Naqis {cite:tabari-tarikh-abu-al-fadl j.7 p.262}, and the heading of his pledge is in the index {cite:tabari-tarikh-abu-al-fadl j.7 p.663}."
