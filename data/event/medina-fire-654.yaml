label: { ar: "النار العظيمة بالمدينة المنورة", en: "The Great Fire at Medina", es: "El gran incendio de Medina", fr: "Le grand incendie de Médine", ur: "مدینہ میں عظیم آگ", tr: "Medine'deki Büyük Yangın", id: "Kebakaran Besar di Madinah" }
summary:
  ar: "وفي سنة أربع وخمسين وست مئة ظهرت النار بالمدينة النبوية قال أبو شامة جاءنا كتب من المدينة فيها لما كانت ليلة الأربعاء ثالث جمادى الآخرة ظهر بالمدينة دوي عظيم ثم زلزلة عظيمة فكانت ساعة بعد ساعة إلى خامس الشهر فظهرت نار عظيمة في الحرة قريباً من قريظة نبصرها من دورنا من داخل المدينة كأنها عندنا وسالت أودية منها إلى وادي شظا مسيل الماء وإذا الجبال تسيل ناراً وطار منها شرر كالقصر إلى أن أبصر ضوءها من مكة ومن الفلاة واجتمع الناس كلهم إلى القبر الشريف مستغفرين تائبين واستمرت هكذا أكثر من شهر، وقال الذهبي أمر هذه النار متواتر وهي مما أخبر به المصطفى حيث قال لا تقوم الساعة حتى تخرج نار من أرض الحجاز تضيء لها أعناق الإبل ببصرى وقد حكى غير واحد ممن كان ببصرى في الليل ورأى أعناق الإبل في ضوئها {cite:tarikh-khulafa-minhaj-1434 p. 709-710}. وفي شذرات الذهب كانت النار مصداق قوله لا تقوم الساعة حتى تظهر نار بالحجاز تضيء أعناق الإبل ببصرى وبقيت أياماً قيل ثلاثة أشهر وكان نساء المدينة يغزلن على ضوئها وظن أهل المدينة أنها القيامة وظهرت من وادي أحيلين في الحرة الشرقية تدب دبيب النمل إلى جهة الشمال تأكل ما أتت عليه من أحجار وجبال ولا تأكل الشجر حتى أن صاحب المدينة منيف بن شبحة أرسل اثنين ليأتياه بخبرها فدنيا منها فلم يجدا لها حراً فأخذ أحدهما سهماً ومد به إليها فأكلت النصل دون العود ثم قلبه ومد بالطرف الآخر فأكلت الريش دون العود وكانت تذيب وتسبك ما مرت عليه من الجبال فسدت وادي شطاه بالحجر المسبوك بالنار سداً كسد ذي القرنين واحتبس الماء خلفه فصار بحراً مد البصر كأنه نيل مصر عند زيادته ثم خرقه الماء سنة تسعين وست مئة {cite:shadharat-dhahab p. 271-272}."
  en: "In 654 the fire appeared at Medina: Abu Shama's letter tells of the roaring, the quakes hour on hour, then the great fire in the Harra near Qurayza — the mountains flowing fire, sparks like palaces flying, its light seen from Mecca and the desert; the people gathered at the noble grave repenting over a month. Al-Dhahabi: it is mutawatir — the foretold 'fire from the land of Hijaz lighting the necks of camels at Busra', and men at Busra saw them {cite:tarikh-khulafa-minhaj-1434 p. 709-710}."
  es: "En 654 apareció el fuego en Medina: la carta de Abu Shama habla del rugido, de los temblores hora tras hora, y luego del gran fuego en Harra cerca de Qurayza: las montañas se llenaron de fuego, chispas como palacios volaban, su luz se veía desde La Meca y el desierto; la gente se reunió en la tumba noble arrepintiéndose durante más de un mes. Al-Dhahabi: es mutawatir: el profetizado 'fuego de la tierra de Hiyaz que encendió los cuellos de los camellos en Busra', y los hombres en Busra los vieron {cite:tarikh-khulafa-minhaj-1434 p. 709-710}."
  fr: "En 654, le feu apparut à Médine: la lettre d’Abu Shama relate les grondements, les secousses incessantes, puis le grand incendie de Harra, près de Qurayza – les montagnes embrasées, des étincelles telles des palais s’envolant, sa lumière visible depuis La Mecque et le désert; le peuple se rassembla au tombeau du noble et se repentit pendant plus d’un mois. Al-Dhahabi: il s’agit d’un événement prophétique – le « feu venu du Hedjaz embrasant le cou des chameaux à Busra », prédit et dont des hommes furent témoins à Busra (voir: Tarikh-Khulafa-Minhaj-1434, p. 709-710)."
  ur: "654 میں مدینہ میں آگ نمودار ہوئی: ابو شمع کا خط گرجنے کے بارے میں بتاتا ہے، گھنٹہ گھنٹہ زلزلے، پھر قریظہ کے قریب حرہ میں زبردست آگ - پہاڑوں میں آگ بھڑکتی ہے، محلات کی طرح اڑتی ہوئی چنگاریاں، مکہ اور صحرا سے اس کی روشنی نظر آتی ہے۔ لوگ ایک مہینے سے زیادہ توبہ کرتے ہوئے عظیم قبر پر جمع ہوئے۔ الذہبی: یہ متواتیر ہے - جس کی پیشین گوئی 'سرزمین حجاز سے آگ بصرہ میں اونٹوں کی گردنیں روشن کرتی ہے'، اور بصرہ کے مردوں نے انہیں دیکھا۔ 709-710}۔"
  tr: "Hicri 654 yılında Medine'de bir yangın çıktı. Ebu Şama şöyle dedi: Medine'den bize gelen mektuplarda, Cemadi ahiretin üçüncü günü Çarşamba gecesi Medine'de büyük bir gürültü duyulduğu, ardından büyük bir deprem olduğu belirtiliyordu. Bu durum, ayın beşinci gününe kadar saatlerce devam etti. Sonra Kurayza yakınlarındaki lav tarlasında büyük bir yangın çıktı. Medine'deki evlerimizden sanki yanı başımızdaymış gibi görebiliyorduk. Vadiler, su yolu olan Şata Vadisi'ne doğru akıyordu. Dağlar ateşle kaplıydı ve onlardan saraylar gibi kıvılcımlar saçılıyordu; ışığı Mekke'den ve çölden görülebiliyordu. Bütün insanlar mübarek kabirde toplandı, bağışlanma diledi ve tövbe etti. Bu durum bir aydan fazla sürdü. El-Dhahabi şöyle dedi: Bu ateş meselesi yaygın olarak rivayet edilmiştir ve Seçilmiş Olan'ın bize bildirdiği şeylerden biridir; şöyle buyurmuştur: \"Kıyamet, Hicaz topraklarından Busra'daki develerin boyunlarını aydınlatacak bir ateş çıkmadan kopmayacaktır.\" Ve Busra'da gece bulunan birden fazla kişi, develerin boyunlarını o ışığın içinde gördüğünü rivayet etmiştir. {kaynak:tarikh-khulafa-minhaj-1434 s. 709-710} Şadharat el-Dhahabi'de, ateş, onun şu sözünün teyidi olarak gösterilmiştir: \"Kıyamet, Hicaz'da Busra'daki develerin boyunlarını aydınlatacak bir ateş çıkmadan kopmayacaktır.\" Ateş günlerce, rivayete göre üç ay boyunca yanmış ve şehrin kadınları onun ışığında iplik eğirmişlerdir. Şehir halkı bunun Kıyamet Günü olduğunu düşünmüştür. Doğu lav alanındaki Ahilayn vadisinden, bir karınca gibi kuzeye doğru sürünerek, taş ve dağlardan karşısına çıkan her şeyi yiyip bitirerek ortaya çıktı; ağaçları yemiyordu. Öyle ki, şehrin yöneticisi Munif bin Şabha, ona haber getirmeleri için iki adam gönderdi. Yaklaştılar ama yandığını göremediler. Bunun üzerine adamlardan biri bir ok alıp ona doğru uzattı ve ok ucunu sapı olmadan yedi. Sonra oku ters çevirip diğer ucuyla uzattı ve ok tüylerini sapı olmadan yedi. Geçtiği dağların her şeyini eritti. Şatah vadisini ateşle eritilmiş taşlarla, Zülkarneyn barajı gibi bir barajla kapattı ve su arkasında tutuldu, böylece gözün görebildiği kadar bir deniz oldu, sanki Mısır'ın Nil nehri en yüksek seviyesindeymiş gibi. Sonra su, altı yüz doksan yılında barajı aştı. {cite:shadharat-dhahab s. 271-272}"
  id: "Pada tahun 654 H, api muncul di Madinah. Abu Shama berkata: Surat-surat datang kepada kami dari Madinah yang menyatakan bahwa pada malam Rabu, tanggal 3 Jumada al-Akhirah, terdengar suara gemuruh yang hebat di Madinah, diikuti oleh gempa bumi yang dahsyat. Ini berlanjut berjam-jam hingga tanggal 5 bulan itu. Kemudian api besar muncul di ladang lava dekat Qurayza. Kami dapat melihatnya dari rumah-rumah kami di dalam Madinah seolah-olah api itu berada tepat di samping kami. Lembah-lembah mengalir dari api itu ke Wadi Shatha, aliran air. Dan gunung-gunung dialiri api, dan percikan api beterbangan dari gunung-gunung itu seperti istana, hingga cahayanya terlihat dari Mekah dan padang pasir. Semua orang berkumpul di makam yang mulia itu, memohon ampunan dan bertaubat. Hal ini berlanjut selama lebih dari sebulan. Al-Dhahabi berkata: Kisah tentang api ini banyak diriwayatkan, dan termasuk dalam apa yang disampaikan oleh Sang Terpilih ketika beliau bersabda: “Hari Kiamat tidak akan datang sampai muncul api dari tanah Hijaz yang akan menerangi leher unta di Busra.” Dan lebih dari satu orang yang berada di Busra pada malam hari meriwayatkan bahwa ia melihat leher unta dalam cahayanya. {cite:tarikh-khulafa-minhaj-1434 p. 709-710} Dalam Shadharat al-Dhahab, api tersebut merupakan penegasan dari sabda beliau: “Hari Kiamat tidak akan datang sampai muncul api di Hijaz yang menerangi leher unta di Busra.” Api itu bertahan selama berhari-hari, dikatakan selama tiga bulan, dan para wanita di kota itu biasa memintal benang dengan cahayanya. Penduduk kota mengira itu adalah Hari Kebangkitan. Api itu muncul dari lembah Ahilayn di ladang lava timur, merayap seperti semut ke arah utara, memakan apa pun yang ditemuinya, baik batu maupun gunung, tetapi tidak memakan pohon. Begitu dahsyatnya api itu sehingga penguasa kota, Munif bin Shabha, mengirim dua orang untuk menyampaikan kabar tentangnya. Mereka mendekatinya tetapi tidak menemukannya terbakar. Maka salah seorang dari mereka mengambil anak panah dan mengarahkannya ke arahnya, dan api itu memakan mata panah tanpa batangnya. Kemudian ia membalikkannya dan mengarahkannya dengan ujung yang lain, dan api itu memakan bulu-bulu tanpa batangnya. Api itu melelehkan apa pun yang dilewatinya, baik gunung maupun sungai. Api itu menghalangi lembah Shatah dengan batu yang meleleh karena api, sebuah bendungan seperti bendungan Dhul-Qarnayn, dan air tertahan di belakangnya, sehingga menjadi lautan sejauh mata memandang, seolah-olah itu adalah Sungai Nil Mesir pada puncaknya. Kemudian air menerobos bendungan itu pada tahun enam ratus sembilan puluh. {cite:shadharat-dhahab p. 271-272}."
