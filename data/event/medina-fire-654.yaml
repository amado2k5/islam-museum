label: { ar: "النار العظيمة بالمدينة المنورة" }
summary:
  ar: "وفي سنة أربع وخمسين وست مئة ظهرت النار بالمدينة النبوية قال أبو شامة جاءنا كتب من المدينة فيها لما كانت ليلة الأربعاء ثالث جمادى الآخرة ظهر بالمدينة دوي عظيم ثم زلزلة عظيمة فكانت ساعة بعد ساعة إلى خامس الشهر فظهرت نار عظيمة في الحرة قريباً من قريظة نبصرها من دورنا من داخل المدينة كأنها عندنا وسالت أودية منها إلى وادي شظا مسيل الماء وإذا الجبال تسيل ناراً وطار منها شرر كالقصر إلى أن أبصر ضوءها من مكة ومن الفلاة واجتمع الناس كلهم إلى القبر الشريف مستغفرين تائبين واستمرت هكذا أكثر من شهر، وقال الذهبي أمر هذه النار متواتر وهي مما أخبر به المصطفى حيث قال لا تقوم الساعة حتى تخرج نار من أرض الحجاز تضيء لها أعناق الإبل ببصرى وقد حكى غير واحد ممن كان ببصرى في الليل ورأى أعناق الإبل في ضوئها {cite:tarikh-khulafa-minhaj-1434 p. 709-710}. وفي شذرات الذهب كانت النار مصداق قوله لا تقوم الساعة حتى تظهر نار بالحجاز تضيء أعناق الإبل ببصرى وبقيت أياماً قيل ثلاثة أشهر وكان نساء المدينة يغزلن على ضوئها وظن أهل المدينة أنها القيامة وظهرت من وادي أحيلين في الحرة الشرقية تدب دبيب النمل إلى جهة الشمال تأكل ما أتت عليه من أحجار وجبال ولا تأكل الشجر حتى أن صاحب المدينة منيف بن شبحة أرسل اثنين ليأتياه بخبرها فدنيا منها فلم يجدا لها حراً فأخذ أحدهما سهماً ومد به إليها فأكلت النصل دون العود ثم قلبه ومد بالطرف الآخر فأكلت الريش دون العود وكانت تذيب وتسبك ما مرت عليه من الجبال فسدت وادي شطاه بالحجر المسبوك بالنار سداً كسد ذي القرنين واحتبس الماء خلفه فصار بحراً مد البصر كأنه نيل مصر عند زيادته ثم خرقه الماء سنة تسعين وست مئة {cite:shadharat-dhahab p. 271-272}."
  en: "In 654 the fire appeared at Medina: Abu Shama's letter tells of the roaring, the quakes hour on hour, then the great fire in the Harra near Qurayza — the mountains flowing fire, sparks like palaces flying, its light seen from Mecca and the desert; the people gathered at the noble grave repenting over a month. Al-Dhahabi: it is mutawatir — the foretold 'fire from the land of Hijaz lighting the necks of camels at Busra', and men at Busra saw them {cite:tarikh-khulafa-minhaj-1434 p. 709-710}."
