label: { ar: "استيلاء الفرنج على بيت المقدس", en: "The Franks Seize Bayt al-Maqdis (Jerusalem)", es: "Los francos se apoderan de Bayt al-Maqdis (Jerusalén).", fr: "Les Francs s'emparent de Bayt al-Maqdis (Jérusalem)", ur: "فرینکوں نے بیت المقدس ⁦(یروشلم)⁩ پر قبضہ کر لیا", tr: "Frankların Kudüs'ü fethi", id: "Penaklukan Yerusalem oleh bangsa Frank" }
summary:
  ar: "في سنة اثنتين وتسعين جاءت الفرنج فأخذوا نيقية وهو أول بلد أخذوه ووصلوا إلى كفر طاب واستباحوا تلك النواحي فكان هذا أول مظهر الفرنج بالشام قدموا في بحر القسطنطينية في جمع عظيم وانزعجت الملوك والرعية وعظم الخطب فقيل إن صاحب مصر لما رأى قوة السلجوقية واستيلاءهم على الشام كاتب الفرنج يدعوهم إلى المجيء إلى الشام ليملكوه، وفي سنة اثنتين وتسعين أخذوا بيت المقدس بعد حصار شهر ونصف وقتلوا به أكثر من سبعين ألفاً منهم جماعة من العلماء والعباد والزهاد وهدموا المشاهد وجمعوا اليهود في الكنيسة وأحرقوها عليهم وورد المستنفرون إلى بغداد فأوردوا كلاماً أبكى العيون واختلفت السلاطين فتمكنت الفرنج من الشام {cite:tarikh-khulafa-minhaj-1434 p. 656-657}."
  en: "In 492 the Franks came — Nicaea first of their takings — pressing to Kafr Tab and ravaging the country, their first appearance in Syria, borne over Constantinople's sea in a great host; kings and people were shaken, and it is said Egypt's lord, watching Seljuk power swallow Syria, wrote the Franks inviting them. The same year they took Jerusalem after a siege of a month and a half, killing over seventy thousand including scholars, devotees and ascetics, razed the shrines, gathered the Jews in the synagogue and burnt it upon them. The refugees reached Baghdad with talk that made eyes weep; the sultans were divided, and the Franks took root in Syria {cite:tarikh-khulafa-minhaj-1434 p. 656-657}. Ibn al-Imad fixes it: Friday morning, seven days short of Sha'ban's end, after a month and a half; Ibn al-Jawzi's Shudhur lists the plunder — forty-four silver candelabra of 3,600 dirhams each, a forty-ratl silver oven, and twenty-odd golden candelabra taken from the Rock {cite:shadharat-dhahab p. 405}."
  es: "En 492 llegaron los francos —Nicea fue la primera de sus conquistas— presionando hacia Kafr Tab y asolando el país, su primera aparición en Siria, llevados por el mar de Constantinopla en un gran ejército; reyes y pueblo se estremecieron, y se dice que el señor de Egipto, viendo el poder selyúcida tragarse Siria, escribió a los francos invitándolos. Ese mismo año tomaron Jerusalén después de un asedio de un mes y medio, matando a más de setenta mil, incluyendo eruditos, devotos y ascetas, arrasaron los santuarios, reunieron a los judíos en la sinagoga y la quemaron sobre ellos. Los refugiados llegaron a Bagdad con historias que hacían llorar a los ojos; los sultanes se dividieron, y los francos se establecieron en Siria {cite:tarikh-khulafa-minhaj-1434 p. 656-657}. Ibn al-Imad lo fija: viernes por la mañana, siete días antes del final de Sha'ban, después de un mes y medio; El Shudhur de Ibn al-Jawzi enumera el botín: cuarenta y cuatro candelabros de plata de 3.600 dirhams cada uno, un horno de plata de cuarenta ratl y una veintena de candelabros de oro tomados de la Roca {cite:shadharat-dhahab p. 405}."
  fr: "En 492, les Francs arrivèrent – Nicée fut leur première prise – et, progressant jusqu'à Kafr Tab, ils ravagèrent le pays. C'était leur première apparition en Syrie, menés par une immense armée traversant la mer de Constantinople. Rois et peuples furent ébranlés, et l'on raconte que le seigneur d'Égypte, voyant la puissance seldjoukide s'emparer de la Syrie, écrivit aux Francs pour les inviter. La même année, ils prirent Jérusalem après un siège d'un mois et demi, massacrant plus de soixante-dix mille personnes, parmi lesquelles des érudits, des dévots et des ascètes. Ils rasèrent les sanctuaires, rassemblèrent les Juifs dans la synagogue et l'incendièrent. Les réfugiés atteignirent Bagdad, leurs récits déchirants. Les sultans étaient divisés, et les Francs s'implantèrent durablement en Syrie (voir: Tarikh-Khulafa-Minhaj-1434, p. 656-657). Ibn al-Imad situe l'événement: un vendredi matin, sept jours avant la fin de Sha'ban, après un mois et demi de siège. Le Shudhur d'Ibn al-Jawzi énumère le butin: quarante-quatre candélabres en argent de 3 600 dirhams chacun, un four en argent de quarante ratl et une vingtaine de candélabres en or pris au Rocher {cite: shadharat-dhahab p. 405}."
  ur: "492 میں فرانکس آئے - نیکیہ نے سب سے پہلے - کفر ٹیب پر دباؤ ڈالا اور ملک کو تباہ کر دیا، شام میں ان کا پہلا ظہور، ایک عظیم میزبان میں قسطنطنیہ کے سمندر پر پیدا ہوا؛ بادشاہوں اور لوگوں کو ہلا کر رکھ دیا گیا، اور کہا جاتا ہے کہ مصر کے آقا، سلجوق کی طاقت کو شام کو نگلتے ہوئے دیکھ کر، فرانکس نے انہیں دعوت دیتے ہوئے لکھا۔ اسی سال انہوں نے ڈیڑھ ماہ کے محاصرے کے بعد یروشلم پر قبضہ کر لیا، ستر ہزار سے زیادہ علماء، عقیدت مندوں اور سنیاسیوں کو قتل کر دیا، مزارات کو مسمار کر دیا، یہودیوں کو عبادت گاہ میں جمع کر کے ان پر جلا دیا۔ پناہ گزین بغداد میں ایسی باتیں کرتے ہوئے پہنچ گئے کہ آنکھیں نم ہو گئیں۔ سلطان تقسیم ہو گئے اور فرانکس نے شام میں جڑ پکڑ لی۔ 656-657}۔ ابن عماد نے اسے درست کیا: جمعہ کی صبح، شعبان کے اختتام سے سات دن کم، ڈیڑھ ماہ کے بعد؛ ابن الجوزی کی شودور میں لوٹ مار کی فہرست دی گئی ہے - 3,600 درہم کی 44 چاندی کی شمعیں، ایک چالیس رٹل چاندی کا تندور، اور 20 سونے کی شمعیں چٹان سے لی گئی ہیں۔ 405}"
  tr: "92 yılında Franklar geldi ve ilk ele geçirdikleri şehir olan İznik'i aldılar, ardından Kafr Tab'a kadar ulaştılar ve bu bölgeleri yağmaladılar. Bu, Frankların Levant'taki ilk görünüşüydü. Konstantinopolis'ten deniz yoluyla büyük bir orduyla geldiler ve krallar ile halk alarma geçti, durum ciddileşti. Mısır hükümdarının Selçukluların gücünü ve Levant üzerindeki hakimiyetini görünce, Franklara Levant'ı yönetmek için gelmelerini isteyen bir mektup yazdığı söylenir. 92 yılında, bir buçuk aylık bir kuşatmanın ardından Kudüs'ü ele geçirdiler ve aralarında bir grup alim, ibadet eden ve münzevinin de bulunduğu yetmiş binden fazla Yahudiyi öldürdüler. Türbeleri yıktılar, Yahudileri kiliseye topladılar ve kiliseyi onlarla birlikte yaktılar. Seferber olan halk Bağdat'a geldi ve gözleri yaşartan sözler söyledi. Sultanlar buna karşı çıktı ve Franklar Levant'ı kontrol altına almayı başardılar. {cite:tarikh-khulafa-minhaj-1434 s. 656-657}."
  id: "Pada tahun 92, bangsa Frank datang dan merebut Nicaea, kota pertama yang mereka rebut, dan mereka mencapai Kafr Tab dan menjarah daerah-daerah tersebut. Ini adalah kemunculan pertama bangsa Frank di Levant. Mereka datang melalui laut dari Konstantinopel dengan pasukan besar, dan raja-raja serta rakyat merasa khawatir, dan masalah ini menjadi serius. Dikatakan bahwa ketika penguasa Mesir melihat kekuatan Seljuk dan kendali mereka atas Levant, ia menulis surat kepada bangsa Frank mengundang mereka untuk datang ke Levant dan memerintahnya. Pada tahun 92, mereka merebut Yerusalem setelah pengepungan selama satu setengah bulan, dan mereka membunuh lebih dari tujuh puluh ribu orang, termasuk sekelompok cendekiawan, pemuja, dan pertapa. Mereka menghancurkan tempat-tempat suci, mengumpulkan orang-orang Yahudi di gereja, dan membakarnya bersama mereka. Orang-orang yang dimobilisasi datang ke Baghdad dan menyampaikan kata-kata yang menyayat hati. Para sultan tidak setuju, dan bangsa Frank mampu menguasai Levant. {kutip:tarikh-khulafa-minhaj-1434 hal. 656-657}."
