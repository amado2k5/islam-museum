id: event/franks-jerusalem-492
class: event
kind: conquest
label: { ar: "استيلاء الفرنج على بيت المقدس", en: "The Franks Seize Bayt al-Maqdis (Jerusalem)" }
summary:
  ar: "في سنة اثنتين وتسعين جاءت الفرنج فأخذوا نيقية وهو أول بلد أخذوه ووصلوا إلى كفر طاب واستباحوا تلك النواحي فكان هذا أول مظهر الفرنج بالشام قدموا في بحر القسطنطينية في جمع عظيم وانزعجت الملوك والرعية وعظم الخطب فقيل إن صاحب مصر لما رأى قوة السلجوقية واستيلاءهم على الشام كاتب الفرنج يدعوهم إلى المجيء إلى الشام ليملكوه، وفي سنة اثنتين وتسعين أخذوا بيت المقدس بعد حصار شهر ونصف وقتلوا به أكثر من سبعين ألفاً منهم جماعة من العلماء والعباد والزهاد وهدموا المشاهد وجمعوا اليهود في الكنيسة وأحرقوها عليهم وورد المستنفرون إلى بغداد فأوردوا كلاماً أبكى العيون واختلفت السلاطين فتمكنت الفرنج من الشام {cite:tarikh-khulafa-minhaj-1434 p. 656-657}."
  en: "In 492 the Franks came — Nicaea first of their takings — pressing to Kafr Tab and ravaging the country, their first appearance in Syria, borne over Constantinople's sea in a great host; kings and people were shaken, and it is said Egypt's lord, watching Seljuk power swallow Syria, wrote the Franks inviting them. The same year they took Jerusalem after a siege of a month and a half, killing over seventy thousand including scholars, devotees and ascetics, razed the shrines, gathered the Jews in the synagogue and burnt it upon them. The refugees reached Baghdad with talk that made eyes weep; the sultans were divided, and the Franks took root in Syria {cite:tarikh-khulafa-minhaj-1434 p. 656-657}. Ibn al-Imad fixes it: Friday morning, seven days short of Sha'ban's end, after a month and a half; Ibn al-Jawzi's Shudhur lists the plunder — forty-four silver candelabra of 3,600 dirhams each, a forty-ratl silver oven, and twenty-odd golden candelabra taken from the Rock {cite:shadharat-dhahab p. 405}."
