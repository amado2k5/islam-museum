id: event/mutadid-book-and-astrologer-ban
class: event
kind: law-enacted
label: { ar: "منع المعتضد دكاكين الفلاسفة وقعود القصاص والمنجمين", en: "Al-Mu'tadid bans philosophers' bookstalls and street storytellers and astrologers", es: "Al-Mu'tadid prohíbe los puestos de libros de filósofos, los cuentacuentos callejeros y los astrólogos.", fr: "Al-Mu'tadid interdit les étals de livres tenus par des philosophes, les conteurs de rue et les astrologues.", ur: "المتعدید نے فلسفیوں کی کتابوں کی دکانوں اور گلیوں میں کہانی سنانے والوں اور نجومیوں پر پابندی لگا دی" }
summary:
  ar: "في أول سنة استخلف فيها منع الوراقين من بيع كتب الفلاسفة وما شاكلها ومنع القصاص والمنجمين من القعود في الطريق، وقال الصولي أمر ألا يقعد في الطريق منجم ولا قصاص واستحلف الوراقين لا يبيعوا كتب الفلاسفة والجدل {cite:tarikh-khulafa-minhaj-1434 p. 569,573}. وعند ابن الجوزي في حوادث سنة تسع وسبعين ومائتين أمر السلطان أن يُنادى ببغداد ألا يقعد على الطريق ولا في مسجد الجامع ناصٌّ ولا صاحب النجوم ولا زاجر، وحُلف الوراقون أن لا يبيعوا كتب الكلام والجدل والفلسفة {cite:muntazam-ibn-al-jawzi p. 122-123}."
  en: "In his first year al-Mu'tadid barred the booksellers from selling philosophers' books and the like, banned storytellers and astrologers from sitting in the street, and swore the warraqin off books of philosophy and dialectic {cite:tarikh-khulafa-minhaj-1434 p. 569,573}."
  es: "En su primer año, al-Mu'tadid prohibió a los libreros vender libros de filósofos y similares, prohibió a los narradores y astrólogos sentarse en la calle, e hizo jurar a los warraqin que no leyeran libros de filosofía y dialéctica {cite:tarikh-khulafa-minhaj-1434 p. 569,573}."
  fr: "Dès sa première année, al-Mu'tadid interdit aux libraires de vendre des livres de philosophes et autres ouvrages similaires, interdit aux conteurs et aux astrologues de s'asseoir dans la rue et interdit aux warraqin de vendre des livres de philosophie et de dialectique {cite:tarikh-khulafa-minhaj-1434 p. 569,573}."
  ur: "المتعدید نے اپنے پہلے سال میں کتاب فروشوں کو فلسفیوں کی کتابیں فروخت کرنے سے روک دیا، قصہ گو اور نجومیوں کو گلیوں میں بیٹھنے سے روک دیا، اور فلسفہ اور جدلیات کی کتابوں سے جنگ کرنے والوں کو قسم کھائی۔ 569,573}۔"
