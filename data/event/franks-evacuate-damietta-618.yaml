label: { ar: "جلاء الفرنج عن دمياط سنة 618" }
summary:
  ar: "في سنة ثمان عشرة وستمائة سار الملك الأشرف ينجد أخاه الكامل وسار معه عسكر الشام، وخرجت الفرنج من دمياط بالفارس والراجل أيام زيادة النيل فنزلوا على ترعة فبثق المسلمون عليها النيل فلم يبلوهم وصولاً إلى دمياط وجاء الأسطول فأخذ مراكب الفرنج وأسروا نحو ثمانمائة فارس فيهم صاحب عكا وخلق من الرجالة، فلما عاينوا الخذلان طلبوا الصلح على أن يسلموا دمياط إلى الكامل فأجابهم، ثم جاءه أخواه المعظم والأشرف بالعساكر في رجب فعمل سماطاً عظيماً وأحضر ملوك الفرنج وأنعم عليهم وكان يوماً مشهوداً {cite:shadharat-dhahab p. 79}."
  en: "In 618 al-Ashraf set out to aid his brother al-Kamil, and the army of Syria marched with him. The Franks left Damietta on horse and on foot during the Nile's rise and camped beside a canal; the Muslims breached the Nile onto it, and the water kept them from reaching Damietta. The fleet came, seized the Frankish ships and captured some eight hundred horsemen, among them the lord of Acre, and a host of foot soldiers. When they saw their ruin, they asked for terms, to hand Damietta over to al-Kamil, and he agreed. Then his brothers al-Mu'azzam and al-Ashraf came to him with the troops in Rajab; he prepared a great banquet, brought in the kings of the Franks, bestowed favours upon them, and it was a day long remembered {cite:shadharat-dhahab p. 79}."
