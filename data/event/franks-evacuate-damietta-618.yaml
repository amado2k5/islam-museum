id: event/franks-evacuate-damietta-618
class: event
kind: truce
label: { ar: "جلاء الفرنج عن دمياط سنة 618", tr: "Franklar 618 yılında Damietta'yı terk ettiler.", id: "Suku Frank mengungsi dari Damietta pada tahun 618." }
summary:
  ar: "في سنة ثمان عشرة وستمائة سار الملك الأشرف ينجد أخاه الكامل وسار معه عسكر الشام، وخرجت الفرنج من دمياط بالفارس والراجل أيام زيادة النيل فنزلوا على ترعة فبثق المسلمون عليها النيل فلم يبلوهم وصولاً إلى دمياط وجاء الأسطول فأخذ مراكب الفرنج وأسروا نحو ثمانمائة فارس فيهم صاحب عكا وخلق من الرجالة، فلما عاينوا الخذلان طلبوا الصلح على أن يسلموا دمياط إلى الكامل فأجابهم، ثم جاءه أخواه المعظم والأشرف بالعساكر في رجب فعمل سماطاً عظيماً وأحضر ملوك الفرنج وأنعم عليهم وكان يوماً مشهوداً {cite:shadharat-dhahab p. 79}."
  en: "In 618 al-Ashraf set out to aid his brother al-Kamil, and the army of Syria marched with him. The Franks left Damietta on horse and on foot during the Nile's rise and camped beside a canal; the Muslims breached the Nile onto it, and the water kept them from reaching Damietta. The fleet came, seized the Frankish ships and captured some eight hundred horsemen, among them the lord of Acre, and a host of foot soldiers. When they saw their ruin, they asked for terms, to hand Damietta over to al-Kamil, and he agreed. Then his brothers al-Mu'azzam and al-Ashraf came to him with the troops in Rajab; he prepared a great banquet, brought in the kings of the Franks, bestowed favours upon them, and it was a day long remembered {cite:shadharat-dhahab p. 79}."
  es: "En 618, al-Ashraf partió para ayudar a su hermano al-Kamil, y el ejército de Siria marchó con él. Los francos abandonaron Damietta a caballo y a pie durante la crecida del Nilo y acamparon junto a un canal; los musulmanes abrieron un puente sobre el Nilo, impidiendo que llegaran a Damietta. La flota llegó, capturó los barcos francos y a unos ochocientos jinetes, entre ellos el señor de Acre, y un gran número de soldados de infantería. Al ver su ruina, pidieron condiciones para entregar Damietta a al-Kamil, y este accedió. Entonces, sus hermanos al-Mu'azzam y al-Ashraf acudieron a él con las tropas en Rajab; preparó un gran banquete, trajo a los reyes de los francos, les concedió favores, y fue un día que se recordó durante mucho tiempo {cite:shadharat-dhahab p. 79}."
  fr: "En 618, al-Ashraf partit en aide à son frère al-Kamil, accompagné de l'armée de Syrie. Les Francs quittèrent Damiette à cheval et à pied pendant la crue du Nil et campèrent près d'un canal. Les musulmans percèrent le Nil et l'eau les empêcha d'atteindre Damiette. La flotte arriva, s'empara des navires francs et captura environ huit cents cavaliers, parmi lesquels le seigneur d'Acre, ainsi qu'un grand nombre de fantassins. Voyant leur défaite, ils exigèrent d'al-Kamil qu'il leur livre Damiette, ce qu'il accepta. Ses frères al-Mu'azzam et al-Ashraf vinrent alors le trouver avec les troupes en Rajab. Il organisa un grand banquet, fit venir les rois des Francs, leur accorda des faveurs, et ce jour resta longtemps gravé dans les mémoires."
  ur: "618 میں الاشرف اپنے بھائی الکامل کی مدد کے لیے نکلا اور شام کی فوج اس کے ساتھ چل پڑی۔ فرانکس نے نیل کے عروج کے دوران ڈیمیٹا کو گھوڑے پر اور پیدل چھوڑ دیا اور ایک نہر کے کنارے ڈیرے ڈالے۔ مسلمانوں نے اس پر دریائے نیل کو توڑا، اور پانی نے انہیں دمیٹا تک پہنچنے سے روک دیا۔ بحری بیڑے نے آکر فرینک کے بحری جہازوں پر قبضہ کر لیا اور تقریباً آٹھ سو گھڑ سواروں کو پکڑ لیا، جن میں ایکر کا لارڈ اور پیدل سپاہیوں کا ایک گروپ تھا۔ جب انہوں نے اپنی بربادی دیکھی تو انہوں نے ڈیمیٹا کو الکامل کے حوالے کرنے کے لیے شرائط مانیں، اور وہ راضی ہوگیا۔ پھر اس کے بھائی المعظم اور اشرف رجب میں فوج کے ساتھ اس کے پاس آئے۔ اس نے ایک عظیم ضیافت تیار کی، فرینکوں کے بادشاہوں کو لایا، ان پر احسان کیا، اور یہ دن بھر یاد رہا۔ 79}۔"
  tr: "Hicri 618 yılında Kral Aşraf, kardeşi Kamil'e yardım etmek için yola çıktı ve Suriye ordusu da onunla birlikte yürüdü. Franklar, Nil'in yükselişi sırasında süvariler ve piyadelerle birlikte Dimyat'tan çıktılar ve bir kanalda kamp kurdular. Müslümanlar Nil'i onlara karşı yarıp geçtiler, böylece Dimyat'a ulaşamadılar. Filo geldi ve Frankların gemilerini ele geçirdi ve Akka hükümdarı da dahil olmak üzere yaklaşık sekiz yüz şövalye ve bir grup piyadeyi esir aldı. Yenilgiyi görünce, Dimyat'ı Kamil'e teslim etmeleri şartıyla barış istediler ve Kamil de kabul etti. Bunun üzerine iki kardeşi Muazzam ve Aşraf, Receb ayında ordularıyla birlikte ona geldiler. Bunun üzerine Kamil büyük bir ziyafet verdi, Frank krallarını davet etti ve onlara hediyeler verdi; bu unutulmaz bir gündü. {kaynak: Şadharat-dhahab s. 79}"
  id: "Pada tahun 618 Hijriah, Raja Al-Ashraf berangkat untuk membantu saudaranya, Al-Kamil, dan pasukan Suriah ikut bersamanya. Pasukan Frank keluar dari Damietta dengan pasukan berkuda dan infanteri saat Sungai Nil meluap, dan mereka berkemah di sebuah kanal. Pasukan Muslim menerobos Sungai Nil untuk melawan mereka, sehingga mereka tidak sampai ke Damietta. Armada datang dan merebut kapal-kapal pasukan Frank serta menangkap sekitar delapan ratus ksatria, termasuk penguasa Acre, dan sejumlah infanteri. Ketika mereka melihat kekalahan itu, mereka meminta perdamaian dengan syarat mereka akan menyerahkan Damietta kepada Al-Kamil, dan dia menyetujuinya. Kemudian kedua saudaranya, Al-Mu'azzam dan Al-Ashraf, datang kepadanya dengan pasukan pada bulan Rajab, sehingga dia mengadakan pesta besar dan mengundang raja-raja Frank serta memberi mereka hadiah, dan itu adalah hari yang tak terlupakan. {cite:shadharat-dhahab hlm. 79}"
