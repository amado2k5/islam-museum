id: event/abd-al-aziz-sijistan
class: event
kind: other
label: { ar: "ولاية عبد العزيز بن عبد الله بن عامر سجستان", en: "Abd al-Aziz ibn Abdallah ibn Amir's Sijistan", fr: "Le Sijistan d’Abd al-Aziz ibn Abdallah ibn Amir", es: "El Sijistán de Abd al-Aziz ibn Abdallah ibn Amir", ur: "عبد العزیز ابن عبداللہ ابن عامر کا سجستان" }
summary:
  ar: "قدم عبد العزيز بن عبد الله بن عامر والياً على سجستان من قبل القباع وهو الحارث بن عبد الله بن أبي ربيعة المخزومي في أيام ابن الزبير فأدخلوه زرنج وحاربوا رتبيل فقتله أبو عفراء عمير المازني وانهزم المشركون وأرسل عبد الله بن ناشرة التميمي إلى عبد العزيز أن خذ جميع ما في بيت المال وانصرف ففعل وأقبل ابن ناشرة حتى دخل زرنج ومضى وكيع بن أبي سود التميمي فرداً عند عبد العزيز وأدخله المدينة حين فتحت للخطابين وأخرج ابن ناشرة فجمع جمعاً فقاتله عبد العزيز ومعه وكيع فعثرت بابن ناشرة فرسه فقتل وقال أبو حزابة ويقال حنظلة بن عرادة ألا لا فتى بعد ابن ناشرة الفتى ولا شيء إلا قد تولى وأدبرا."
  en: "Abd al-Aziz ibn Abdallah ibn Amir came governing Sijistan for al-Quba' — al-Harith ibn Abdallah ibn Abi Rabi'a al-Makhzumi — in Ibn al-Zubayr's days; they brought him into Zaranj and warred on Rutbil, whom Abu Afra'a Umayr al-Mazini killed as the unbelievers routed. Abdullah ibn Nashira al-Tamimi counselled Abd al-Aziz to take all the treasury and leave — then came himself and entered Zaranj; Waki' ibn Abi Sud alone stood by Abd al-Aziz, got him back in when the gates opened to the Khatiban, and expelled Ibn Nashira, who gathered a host and fought — his horse stumbled and he was killed, mourned in Abu Huzaba's (or Hanzala ibn Arada's) elegy 'no youth after Ibn Nashira the youth'."
  fr: "Abd al-Aziz ibn Abdallah ibn Amir vint gouverner le Sijistan pour al-Quba' — al-Harith ibn Abdallah ibn Abi Rabi'a al-Makhzumi — à l’époque d’Ibn al-Zubayr ; on le fit entrer à Zaranj et l’on combattit Rutbil, qu’Abu Afra'a Umayr al-Mazini tua tandis que les infidèles étaient mis en déroute. Abdallah ibn Nashira al-Tamimi conseilla à Abd al-Aziz de prendre tout le trésor et de partir, puis vint lui-même à Zaranj ; seul Waki' ibn Abi Sud resta aux côtés d’Abd al-Aziz, le fit rentrer lorsque les portes s’ouvrirent aux Khatiban et chassa Ibn Nashira. Celui-ci rassembla une armée et livra bataille ; son cheval trébucha et il fut tué, pleuré dans l’élégie d’Abu Huzaba (ou de Hanzala ibn Arada) : « Plus de jeune héros après le jeune Ibn Nashira »."
  es: "Abd al-Aziz ibn Abdallah ibn Amir llegó a gobernar Sijistan para al-Quba' — al-Harith ibn Abdallah ibn Abi Rabi'a al-Makhzumi — en tiempos de Ibn al-Zubayr; lo llevaron a Zaranj y guerrearon contra Rutbil, a quien Abu Afra'a Umayr al-Mazini mató cuando los incrédulos fueron derrotados. Abdullah ibn Nashira al-Tamimi aconsejó a Abd al-Aziz que tomara todo el tesoro y se marchara; luego él mismo regresó y entró en Zaranj; Waki' ibn Abi Sud fue el único que apoyó a Abd al-Aziz, lo hizo regresar cuando las puertas se abrieron a los Khatiban y expulsó a Ibn Nashira, quien reunió un ejército y luchó; su caballo tropezó y murió, y fue llorado en la elegía de Abu Huzaba (o Hanzala ibn Arada) 'ningún joven después de Ibn Nashira el joven'."
  ur: "عبد العزیز ابن عبداللہ ابن عامر الکوبہ کے لیے سجستان پر حکومت کرنے آیا - الحارث ابن عبد اللہ ابن ابی ربیعہ المخزومی - ابن الزبیر کے دور میں؛ وہ اسے زرنج میں لے آئے اور رتبیل سے جنگ کی، جسے ابو عفراء عمیر المزنی نے کافروں کی شکست پر قتل کر دیا۔ عبداللہ بن ناصرہ التمیمی نے عبد العزیز کو مشورہ دیا کہ وہ سارا خزانہ لے کر چلے جائیں - پھر خود آیا اور زرنج میں داخل ہوا۔ وکیع ابن ابی سعود اکیلے عبد العزیز کے ساتھ کھڑا تھا، خطیب کے دروازے کھلنے پر اسے واپس اندر لایا، اور ابن نشیرہ کو باہر نکال دیا، جس نے ایک میزبان کو اکٹھا کیا اور لڑا - اس کا گھوڑا لڑکھڑا گیا اور وہ مارا گیا، ابو حزبہ ⁦(یا حنظلہ بن عرادہ کی جوانی کے بعد)⁩ جوانی میں سوگ منایا گیا۔"
