label: { ar: "البيعة لأبي العباس السفاح", en: "Bay'a to Abu al-Abbas al-Saffah", fr: "La bay'a d'Abu al-Abbas al-Saffah", es: "De Bay'a a Abu al-Abbas al-Saffah", ur: "بیع سے ابو العباس الصفح", tr: "Ebu'l-Abbas es-Saffah'a biat", id: "Kesetiaan kepada Abu al-Abbas al-Saffah" }
summary:
  ar: "ذكر الطبري أن البيعة لأبي العباس عبد الله بن محمد بن علي كانت ليلة الجمعة لثلاث عشرة مضت من ربيع الآخر سنة اثنتين وثلاثين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.420}، وذكر الواقدي أنها كانت في جمادى الأولى، وأن أبا معشر قال إنها في ربيع الأول {cite:tabari-tarikh-abu-al-fadl j.7 p.420}، وعند السيوطي بويع بالخلافة بالكوفة في ثالث ربيع الأول سنة اثنتين وثلاثين ومئة وصلى بالناس الجمعة وخطب فقال في آخرها يا أهل الكوفة أنتم محل محبتنا ومنزل مودتنا وقد زدت في أعطياتكم مئة مئة فاستعدوا فأنا السفاح المبيح والثائر المبير {cite:tarikh-khulafa-minhaj-1434 p. 418-419}"
  en: "Al-Tabari reports that the pledge to Abu al-Abbas Abd Allah ibn Muhammad ibn Ali was on the night of Friday, thirteen nights into Rabi' al-Akhir of 132 AH {cite:tabari-tarikh-abu-al-fadl j.7 p.420}. Al-Waqidi reported that it was in Jumada al-Ula, and Abu Ma'shar said it was in Rabi' al-Awwal {cite:tabari-tarikh-abu-al-fadl j.7 p.420}. According to al-Suyuti, he was given the caliphate in Kufa on the third of Rabi' al-Awwal 132 AH; he led the people in the Friday prayer and preached, and at its end he said: O people of Kufa, you are the place of our love and the home of our affection; I have increased your stipends by a hundred each, so get ready, for I am al-Saffah al-Mubih, the shedder, and the avenger who destroys {cite:tarikh-khulafa-minhaj-1434 p. 418-419}"
  fr: "Al-Tabari rapporte que l'allégeance à Abu al-Abbas Abd Allah ibn Muhammad ibn Ali eut lieu la nuit du vendredi, treize nuits après le début de Rabi' al-Akhir 132 H {cite:tabari-tarikh-abu-al-fadl j.7 p.420}. Al-Waqidi rapporta que ce fut en Jumada al-Ula, et Abu Ma'shar dit que ce fut en Rabi' al-Awwal {cite:tabari-tarikh-abu-al-fadl j.7 p.420}. Selon al-Suyuti, il reçut le califat à Koufa le trois Rabi' al-Awwal 132 H ; il dirigea les gens dans la prière du vendredi et prêcha, et à la fin il dit : Ô gens de Koufa, vous êtes le lieu de notre amour et la demeure de notre affection ; j'ai augmenté vos pensions de cent chacune, alors préparez-vous, car je suis al-Saffah al-Mubih, celui qui verse le sang, et le vengeur qui détruit {cite:tarikh-khulafa-minhaj-1434 p. 418-419}"
  es: "Al-Tabari informa que la promesa a Abu al-Abbas Abd Allah ibn Muhammad ibn Ali fue en la noche del viernes, trece noches en Rabi' al-Akhir de 132 AH {cite:tabari-tarikh-abu-al-fadl j.7 p.420}. Al-Waqidi informó que fue en Jumada al-Ula, y Abu Ma'shar dijo que fue en Rabi' al-Awwal {cite:tabari-tarikh-abu-al-fadl j.7 p.420}. Según al-Suyuti, se le dio el califato en Kufa el tercero de Rabi' al-Awwal 132 AH; dirigió a la gente en la oración del viernes y predicó, y al final dijo: Oh gente de Kufa, sois el lugar de nuestro amor y el hogar de nuestro afecto; He aumentado vuestros estipendios en cien cada uno, así que preparaos, porque yo soy al-Saffah al-Mubih, el que derrama y el vengador que destruye {cite:tarikh-khulafa-minhaj-1434 p. 418-419}"
  ur: "الطبری نے بیان کیا ہے کہ ابو العباس عبد اللہ بن محمد ابن علی سے بیعت جمعہ کی رات 132 ہجری کی ربیع الآخر کی تیرہ راتوں کو ہوئی تھی۔ الواقدی نے روایت کیا ہے کہ یہ جمادی الاول میں ہے اور ابو معشر نے کہا ہے کہ یہ ربیع الاول میں ہے {حوالہ: طبری تاریخ ابو الفضل ج7 ص420}۔ سیوطی کے مطابق انہیں کوفہ میں تیسری ربیع الاول 132 ہجری کو خلافت دی گئی۔ آپ نے لوگوں کو جمعہ کی نماز پڑھائی اور وعظ و نصیحت کی اور اس کے آخر میں فرمایا: اے اہل کوفہ تم ہماری محبت کی جگہ اور ہمارے پیار کا گھر ہو۔ میں نے تمہارے وظیفوں میں ایک ایک سو کا اضافہ کر دیا ہے، لہٰذا تیار ہو جاؤ، کیونکہ میں الصفح المبیح، بہانے والا، اور تباہ کرنے والا بدلہ لینے والا ہوں۔ 418-419}"
  tr: "Taberi, Ebu el-Abbas Abdullah ibn Muhammed ibn Ali'ye biat etmenin 13 Rebiü'l-Sani'nin 13. Cuma gecesi, 132 yılında gerçekleştiğini belirtmiştir (kaynak: tabari-tarikh-abu-al-fadl, c.7, s. 420). Vakidi ise bunun Cemâde el-Ula'da olduğunu, Ebu Ma'şer ise Rabiü'l-Evvel'de olduğunu söylemiştir (kaynak: tabari-tarikh-abu-al-fadl, c.7, s. 420). Suyuti'ye göre ise, 132 yılında Rabiü'l-Evvel'in 3. gününde Kufe'de halife olarak biat etmiş, cuma namazını kıldırmış ve hutbe okumuştur. Hutbesinin sonunda şöyle demiştir: \"Ey Kufe halkı, sizler bizim sevgimizin ve şefkatimizin yurdusunuz.\" Ve her birinizin maaşını yüz artırdım, bu yüzden hazırlıklı olun, çünkü ben izin veren ve yok eden kana susamış olanım. {cite:tarikh-khulafa-minhaj-1434 pp. 418-419}"
  id: "Al-Tabari menyebutkan bahwa baiat kepada Abu al-Abbas Abdullah ibn Muhammad ibn Ali dilakukan pada malam Jumat, tanggal 13 Rabi' al-Thani, tahun 132 {cite:tabari-tarikh-abu-al-fadl j.7 p.420}, dan al-Waqidi menyebutkan bahwa itu terjadi pada Jumada al-Ula, dan Abu Ma'shar mengatakan bahwa itu terjadi pada Rabi' al-Awwal {cite:tabari-tarikh-abu-al-fadl j.7 p.420}, dan menurut al-Suyuti, beliau menerima baiat sebagai Khalifah di Kufa pada tanggal 3 Rabi' al-Awwal tahun 132, dan beliau memimpin orang-orang dalam salat Jumat dan menyampaikan khutbah, yang diakhiri dengan berkata, \"Wahai penduduk Kufa, kalian adalah tempat cinta kami dan tempat kediaman kasih sayang kami, dan aku telah menambah keberkahan kalian tunjangan masing-masing seratus, jadi bersiaplah, karena akulah yang haus darah yang mengizinkan dan pembalas yang menghancurkan {cite:tarikh-khulafa-minhaj-1434 pp. 418-419}"
