label: { ar: "البيعة لأبي العباس السفاح، وعند السيوطي بويع بالخلافة بالكوفة في ثالث ربيع الأول سنة اثنتين وثلاثين ومئة وصلى بالناس الجمعة وخطب فقال في آخرها يا أهل الكوفة أنتم محل محبتنا ومنزل مودتنا وقد زدت في أعطياتكم مئة مئة فاستعدوا فأنا السفاح المبيح والثائر المبير {cite:tarikh-khulafa-minhaj-1434 p. 418-419}" }
summary:
