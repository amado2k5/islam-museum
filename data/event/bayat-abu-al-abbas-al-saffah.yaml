label: { ar: "البيعة لأبي العباس السفاح", en: "Bay'a to Abu al-Abbas al-Saffah" }
summary:
  ar: "ذكر الطبري أن البيعة لأبي العباس عبد الله بن محمد بن علي كانت ليلة الجمعة لثلاث عشرة مضت من ربيع الآخر سنة اثنتين وثلاثين ومائة {cite:tabari-tarikh-abu-al-fadl j.7 p.420}، وذكر الواقدي أنها كانت في جمادى الأولى، وأن أبا معشر قال إنها في ربيع الأول {cite:tabari-tarikh-abu-al-fadl j.7 p.420}، وعند السيوطي بويع بالخلافة بالكوفة في ثالث ربيع الأول سنة اثنتين وثلاثين ومئة وصلى بالناس الجمعة وخطب فقال في آخرها يا أهل الكوفة أنتم محل محبتنا ومنزل مودتنا وقد زدت في أعطياتكم مئة مئة فاستعدوا فأنا السفاح المبيح والثائر المبير {cite:tarikh-khulafa-minhaj-1434 p. 418-419}"
  en: "Al-Tabari reports that the pledge to Abu al-Abbas Abd Allah ibn Muhammad ibn Ali was on the night of Friday, thirteen nights into Rabi' al-Akhir of 132 AH {cite:tabari-tarikh-abu-al-fadl j.7 p.420}. Al-Waqidi reported that it was in Jumada al-Ula, and Abu Ma'shar said it was in Rabi' al-Awwal {cite:tabari-tarikh-abu-al-fadl j.7 p.420}. According to al-Suyuti, he was given the caliphate in Kufa on the third of Rabi' al-Awwal 132 AH; he led the people in the Friday prayer and preached, and at its end he said: O people of Kufa, you are the place of our love and the home of our affection; I have increased your stipends by a hundred each, so get ready, for I am al-Saffah al-Mubih, the shedder, and the avenger who destroys {cite:tarikh-khulafa-minhaj-1434 p. 418-419}"
