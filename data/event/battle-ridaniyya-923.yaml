label: { ar: "وقعة الريدانية وسقوط دولة المماليك", en: "Battle of Ridaniyya and the fall of the Mamluk state", fr: "La bataille d'al-Ridaniyya et la chute de l'État mamelouk", es: "La batalla de Ridaniyya y la caída del estado mameluco.", ur: "ردانیہ کی جنگ اور مملوک ریاست کا زوال", tr: "Ridaniya Muharebesi ve Memlük devletinin düşüşü", id: "Pertempuran Ridaniya dan jatuhnya negara Mamluk" }
summary:
  ar: "أرسل السلطان سليم إلى زعيم المماليك في مصر طومان باي أن يلتزم بالطاعة للدولة العثمانية، فكان رد المماليك السخرية برسول السلطان ثم قتله، فقرر سليم الحرب وتحرك نحو مصر وقطع صحراء فلسطين ونزلت الأمطار على أماكن سير الحملة مما يسّر على الجيش قطع الصحراء. وحقق العثمانيون انتصاراً ساحقاً على المماليك في معركة غزة ثم معركة الريدانية، ودخل سليم مصر فقال جرامرد الناصري لم نر في التواريخ ولا سمعنا أن مصر من حين صارت دار الإسلام أصيبت بمثل هذه المصيبة. وكان مما قاله سليم لطومان باي بعد هزيمته: أنا ما جئت عليكم إلا بفتوى علماء الأمصار، وأنا كنت متوجهاً إلى جهاد الرافضة ⁦(يعني الصفويين)⁩ والفجار ⁦(يعني بهم البرتغاليين وفرسان القديس يوحنا)⁩، فلما بغى أميركم الغوري وجاء بالعساكر إلى حلب واتفق مع الرافضة واختار أن يمشي إلى مملكتي التي هي موروث آبائي وأجدادي، فلما تحققت ذلك تركت الرافضة ومشيت إليه {cite:dawlat-uthmaniyya-salabi p. 186-187}."
  en: "Ridaniyya, 1517 — the Mamluks' execution of Selim's envoy brought the Ottoman army across Sinai; Gaza then Ridaniyya broke Tuman Bay and ended the Circassian sultanate. Selim's defence: 'I came only with the ulema's fatwa — I was bound for jihad against the Rafida and the fujjar until your Ghawri marched into my inherited kingdom' {cite:dawlat-uthmaniyya-salabi p. 186-187}."
  fr: "Al-Ridaniyya, 1517 : l'exécution par les Mamelouks de l'envoyé de Sélim fit passer l'armée ottomane à travers le Sinaï ; Gaza puis al-Ridaniyya brisèrent Tuman Bay et mirent fin au sultanat circassien. La défense de Sélim : « Je ne suis venu qu'avec la fatwa des oulémas ; j'allais au jihad contre les Rafida et les fujjar, jusqu'à ce que votre Ghawri marche sur le royaume dont j'ai hérité » {cite:dawlat-uthmaniyya-salabi p. 186-187}."
  es: "Ridaniyya, 1517: la ejecución del enviado de Selim por parte de los mamelucos permitió al ejército otomano cruzar el Sinaí; Gaza y luego Ridaniyya abrieron paso a la bahía de Tuman y pusieron fin al sultanato circasiano. La defensa de Selim: «Vine solo con la fatwa de los ulemas; estaba decidido a emprender la yihad contra los rafida y los fujjar hasta que vuestro Ghawri marchara hacia mi reino heredado» {cita:dawlat-uthmaniyya-salabi, págs. 186-187}."
  ur: "ردانیہ، 1517 - مملوکوں کی جانب سے سلیم کے ایلچی کو پھانسی دینے سے عثمانی فوج سینائی کے پار پہنچ گئی۔ غزہ پھر ردانیہ نے تومان خلیج کو توڑ دیا اور سرکاسی سلطنت کا خاتمہ کیا۔ سلیم کا دفاع: 'میں صرف علمائے کرام کے فتوے کے ساتھ آیا ہوں - میں رافضی اور فجر کے خلاف جہاد کے لیے پابند تھا یہاں تک کہ آپ کی ثوری میری وراثت میں ملی ہوئی سلطنت میں داخل ہو گئی'۔ 186-187}۔"
  tr: "Sultan Selim, Mısır'daki Memlük lideri Tuman Bey'e Osmanlı devletine bağlılık talep eden bir mesaj gönderdi. Memlükler, Sultan'ın elçisiyle alay ederek ve ardından onu öldürerek karşılık verdiler. Bunun üzerine Selim savaşa girmeye karar verdi ve Filistin çölünü geçerek Mısır'a doğru yürüdü. Sefer güzergahı boyunca yağan yağmur, ordunun geçişini kolaylaştırdı. Osmanlılar, Gazze Muharebesi'nde ve ardından Ridaniye Muharebesi'nde Memlükler üzerinde ezici bir zafer kazandılar. Selim Mısır'a girdiğinde, Gerard el-Nasiri şu yorumu yaptı: \"İslam dünyasının bir parçası olduktan sonra Mısır'ın böyle bir felakete uğradığını tarihte hiç görmedik veya duymadık.\" Selim'in Tuman Bey'e yenilgisinden sonra söylediklerinden biri şuydu: \"Size sadece şehirlerin alimlerinin fetvasıyla gelmiştim ve Rafidilerle (yani Safevilerle) ve kötülerle (yani Portekizliler ve Aziz Yuhanna Şövalyeleriyle) savaşmaya gidiyordum. Fakat prensiniz el-Ghuri isyan edip Halep'e asker getirip Rafidilerle ittifak kurunca ve atalarımın ve dedelerimin mirası olan krallığıma doğru yürümeyi seçince, bunu fark edince Rafidileri bırakıp ona doğru yürüdüm.\" {cite:dawlat-uthmaniyya-salabi s. 186-187}"
  id: "Sultan Selim mengirim pesan kepada Tuman Bay, pemimpin Mamluk di Mesir, menuntut kesetiaannya kepada negara Ottoman. Mamluk menanggapi dengan mengejek utusan Sultan dan kemudian membunuhnya. Selim kemudian memutuskan untuk berperang dan bergerak menuju Mesir, melintasi gurun Palestina. Hujan turun di sepanjang rute kampanye, mempermudah perjalanan pasukan. Ottoman meraih kemenangan gemilang atas Mamluk dalam Pertempuran Gaza dan kemudian dalam Pertempuran Ridaniya. Selim memasuki Mesir, yang mendorong Gerard al-Nasiri untuk berkomentar, \"Kita belum pernah melihat atau mendengar dalam sejarah Mesir, sejak menjadi bagian dari dunia Islam, menderita malapetaka seperti ini.\" Di antara hal-hal yang dikatakan Selim kepada Tuman Bay setelah kekalahannya adalah: Aku hanya datang kepadamu dengan fatwa para ulama kota, dan aku hendak berperang melawan Rafidiyah (maksudnya Safawi) dan orang-orang jahat (maksudnya Portugis dan Ksatria Santo Yohanes), tetapi ketika pangeranmu al-Ghuri memberontak dan membawa pasukan ke Aleppo dan membuat perjanjian dengan Rafidiyah dan memilih untuk menyerang kerajaanku, yang merupakan warisan ayah dan kakekku, ketika aku menyadari hal itu, aku meninggalkan Rafidiyah dan bergerak menuju dia. {cite:dawlat-uthmaniyya-salabi hlm. 186-187}."
