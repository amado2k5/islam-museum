label: { ar: "إرسال معاوية عبد الله بن الحضرمي إلى البصرة", en: "Muʿāwiya sends ʿAbdallāh ibn al-Ḥaḍramī to rally Basra (38 AH)", es: "Muʿāwiya envía a ʿAbdallāh ibn al-Ḥaḍramī para movilizar a Basora (38 AH)", fr: "Muʿāwiya envoie ʿAbdallāh ibn al-Ḥaḍramī rallier Bassora (38 AH)" }
date:
