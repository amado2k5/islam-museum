label: { ar: "إرسال معاوية عبد الله بن الحضرمي إلى البصرة", en: "Muʿāwiya sends ʿAbdallāh ibn al-Ḥaḍramī to rally Basra (38 AH)" }
date:
  start: { edtf: "0658", hijri: "0038", calendar: julian, precision: year, status: tradition, derived: true, note: "سنة 38؛ التحويل مشتق {cite:kamil-ibn-al-athir p. 711}." }
summary:
  ar: "سيّر معاوية عبد الله بن عمرو بن الحضرمي إلى البصرة بعد استيلاء عمرو بن العاص على مصر، وقال له إن جل أهلها يرون رأينا في عثمان فانزل في مضر وتودد الأزد واحذر ربيعة فإنهم ترابية. فنزل في بني تميم وخطب في العثمانية إن عثمان إمام الهدى قتل مظلومًا، وقرأ كتاب معاوية يذكرهم بآثار عثمان فيهم ويضمن عطاءين في السنة، فقام الضحاك بن قيس الهلالي صاحب شرطة ابن عباس فقال أتيتنا والله بمثل ما أتانا به طلحة والزبير أفتأمرنا أن ينتضي بعضنا على بعض ليكون معاوية أميرًا، وقال عبد الله بن خازم السلمي نحن أنصارك ويدك، وقال الأحنف لا ناقتي في هذا ولا جملي واعتزل القوم {cite:kamil-ibn-al-athir p. 711}."
  en: "After ʿAmr took Egypt, Muʿāwiya sent ʿAbdallāh ibn ʿAmr ibn al-Ḥaḍramī to Basra — «most of its people share our view of ʿUthmān; lodge with Muḍar, court the Azd, beware Rabīʿa, they are all Turābiyya«. Reading Muʿāwiya's letter among Banū Tamīm — two stipends a year promised — he split the town: al-Ḍaḥḥāk ibn Qays, Ibn ʿAbbās's police chief, cried «you bring us what Ṭalḥa and al-Zubayr brought — shall we draw swords on each other that Muʿāwiya may be amir?«; ʿAbdallāh ibn Khāzim pledged support; al-Aḥnaf withdrew with «no camel of mine is in this» {cite:kamil-ibn-al-athir p. 711}."
