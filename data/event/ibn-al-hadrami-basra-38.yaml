label: { ar: "إرسال معاوية عبد الله بن الحضرمي إلى البصرة", en: "Muʿāwiya sends ʿAbdallāh ibn al-Ḥaḍramī to rally Basra (38 AH)", es: "Muʿāwiya envía a ʿAbdallāh ibn al-Ḥaḍramī para movilizar a Basora (38 AH)", fr: "Muʿāwiya envoie ʿAbdallāh ibn al-Ḥaḍramī rallier Bassora (38 AH)", ur: "معاویہ نے عبداللہ بن حضرمی کو بصرہ پر جلسہ کرنے کے لیے بھیجا ⁦(38ھ)⁩", tr: "Muaviye, Abdullah ibn el-Hadrami'yi Basra'ya gönderdi", id: "Muawiyah mengutus Abdullah bin al-Hadrami ke Basra" }
date:
  start: { edtf: "0658", hijri: "0038", calendar: julian, precision: year, status: tradition, derived: true, note: "سنة 38؛ التحويل مشتق {cite:kamil-ibn-al-athir p. 711}." }
summary:
  ar: "سيّر معاوية عبد الله بن عمرو بن الحضرمي إلى البصرة بعد استيلاء عمرو بن العاص على مصر، وقال له إن جل أهلها يرون رأينا في عثمان فانزل في مضر وتودد الأزد واحذر ربيعة فإنهم ترابية. فنزل في بني تميم وخطب في العثمانية إن عثمان إمام الهدى قتل مظلومًا، وقرأ كتاب معاوية يذكرهم بآثار عثمان فيهم ويضمن عطاءين في السنة، فقام الضحاك بن قيس الهلالي صاحب شرطة ابن عباس فقال أتيتنا والله بمثل ما أتانا به طلحة والزبير أفتأمرنا أن ينتضي بعضنا على بعض ليكون معاوية أميرًا، وقال عبد الله بن خازم السلمي نحن أنصارك ويدك، وقال الأحنف لا ناقتي في هذا ولا جملي واعتزل القوم {cite:kamil-ibn-al-athir p. 711}."
  en: "After ʿAmr took Egypt, Muʿāwiya sent ʿAbdallāh ibn ʿAmr ibn al-Ḥaḍramī to Basra — «most of its people share our view of ʿUthmān; lodge with Muḍar, court the Azd, beware Rabīʿa, they are all Turābiyya«. Reading Muʿāwiya's letter among Banū Tamīm — two stipends a year promised — he split the town: al-Ḍaḥḥāk ibn Qays, Ibn ʿAbbās's police chief, cried «you bring us what Ṭalḥa and al-Zubayr brought — shall we draw swords on each other that Muʿāwiya may be amir?«; ʿAbdallāh ibn Khāzim pledged support; al-Aḥnaf withdrew with «no camel of mine is in this» {cite:kamil-ibn-al-athir p. 711}."
  es: "Después de que ʿAmr tomara Egipto, Muʿāwiya envió a ʿAbdallāh ibn ʿAmr ibn al-Ḥaḍramī a Basora: «la mayoría de su gente comparte nuestra opinión sobre ʿUthmān; alójense con Muḍar, cortejen a Azd, tengan cuidado con Rabīʿa, todos son Turābiyya». Al leer la carta de Muʿāwiya entre los Banū Tamīm —dos estipendios al año prometidos— dividió la ciudad: al-Ḍaḥḥāk ibn Qays, jefe de policía de Ibn ʿAbbās, gritó: «Nos traéis lo que trajeron Ṭalḥa y al-Zubayr; ¿acaso desenvainaremos nuestras espadas para que Muʿāwiya sea emir?». ʿAbdallāh ibn Khāzim prometió su apoyo; al-Aḥnaf se retiró diciendo «ningún camello mío está en esto» {cite:kamil-ibn-al-athir p. 711}."
  fr: "Après la prise d'Égypte par ʿAmr, Muʿāwiya envoya ʿAbdallāh ibn ʿAmr ibn al-Ḥaḍramī à Bassora: « La plupart de ses habitants partagent notre opinion sur ʿUthmān; logez chez Muḍar, courtisez les Azd, méfiez-vous de Rabīʿa, ils sont tous Turābiyya. » La lecture de la lettre de Muʿāwiya parmi les Banū Tamīm – promettant deux pensions annuelles – divisa la ville: al-Ḍaḥḥāk ibn Qays, chef de la police d'Ibn ʿAbbās, s'écria: « Vous nous apportez ce que Ṭalḥa et al-Zubayr nous ont apporté – allons-nous nous entretuer pour que Muʿāwiya devienne émir ? »; ʿAbdallāh ibn Khāzim promit son soutien. al-Aḥnaf se retira en disant « aucun de mes chameaux n'est dans ceci » {cite: kamil-ibn-al-athir p. 711}."
  ur: "عمرو کے مصر پر قبضے کے بعد، معاویہ نے عبداللہ بن عمرو بن الحرامی کو بصرہ بھیجا - \"اس کے زیادہ تر لوگ عثمان کے بارے میں ہمارے خیال میں شریک ہیں؛ معر کے پاس رہو، ازد کی عدالت کرو، ربیعہ سے بچو، یہ سب ترابیہ ہیں۔\" بنو تمیم کے درمیان معاویہ کا خط پڑھ کر - سال میں دو وظیفوں کا وعدہ کیا گیا تھا - اس نے شہر کو تقسیم کردیا: ضحاک ابن قیس، ابن عباس کے پولیس چیف، پکارا \"تم ہمیں وہ لاؤ جو معاویہ اور الزبیر کو ایک دوسرے پر لایا جائے گا - امیر؟\" عبداللہ بن خزیم نے حمایت کا وعدہ کیا۔ احناف اس کے ساتھ پیچھے ہٹ گیا: میرا کوئی اونٹ اس میں نہیں ہے۔ 711}۔"
  tr: "Muaviye, Amr ibn el-As'ın Mısır'ı ele geçirmesinden sonra Abdullah ibn Amr ibn el-Hadrami'yi Basra'ya gönderdi. Ona, Basra halkının çoğunun Osman hakkındaki görüşünü paylaştığını, bu yüzden Mudar kabilesiyle kalması, Azd kabilesiyle ilişkiler kurması ve Turab kabilesinden olan Rabi'ah kabilesinden sakınması gerektiğini söyledi. Abdullah, Beni Tamim kabilesiyle kaldı ve Osman halkına hitap ederek, Hidayete İmamı Osman'ın haksız yere öldürüldüğünü ilan etti. Muaviye'nin Osman'ın kendilerine yaptığı katkıları hatırlatan ve yılda iki maaş garantisi veren mektubunu okudu. Bu sırada, İbn Abbas'ın emrinde polis şefi olan el-Dahhak ibn Kays el-Hilali ayağa kalktı ve \"Allah'a yemin ederim ki, bize Talha ve el-Zübeyr'in getirdiği şeyin aynısını getirdiniz! Muaviye'nin liderimiz olabilmesi için birbirimize karşı dönmemizi mi emrediyorsunuz?\" dedi. Abdullah ibn Khazim al-Sulami, \"Biz sizin destekçileriniz ve müttefikleriniziz\" dedi. Al-Ahnaf ise, \"Benim bu işte bir payım yok\" diyerek gruptan ayrıldı. {cite:kamil-ibn-al-athir s. 711}"
  id: "Mu'awiyah mengutus Abdullah ibn Amr ibn al-Hadrami ke Basra setelah Amr ibn al-As menguasai Mesir. Ia mengatakan kepadanya bahwa sebagian besar penduduknya sependapat dengannya tentang Utsman, jadi ia harus tinggal bersama suku Mudar, menjalin hubungan dengan suku Azd, dan mewaspadai suku Rabi'ah, karena mereka berasal dari suku Turab. Abdullah tinggal bersama Bani Tamim dan berbicara kepada kaum Utsman, menyatakan bahwa Utsman, Imam Petunjuk, telah dibunuh secara tidak adil. Ia membacakan surat Mu'awiyah yang mengingatkan mereka tentang kontribusi Utsman kepada mereka dan menjamin dua kali tunjangan per tahun. Pada saat itu, al-Dahhak ibn Qays al-Hilali, kepala polisi di bawah Ibn Abbas, berdiri dan berkata, \"Demi Allah, engkau telah membawa hal yang sama kepada kami seperti yang dibawa Talhah dan al-Zubayr! Apakah engkau memerintahkan kami untuk saling bermusuhan agar Mu'awiyah dapat menjadi pemimpin kami?\" Abdullah ibn Khazim al-Sulami berkata, \"Kami adalah pendukung dan sekutu Anda.\" Al-Ahnaf berkata, \"Saya tidak ada hubungannya dengan ini,\" dan menarik diri dari kelompok tersebut. {cite:kamil-ibn-al-athir p. 711}"
