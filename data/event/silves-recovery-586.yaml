id: event/silves-recovery-586
class: event
kind: conquest
label: { ar: "استرجاع شلب من الإفرنج", en: "Recovery of Silves from the Franks", es: "Recuperación de Silves de los francos", fr: "Récupération de Silves auprès des Francs", ur: "فرانک سے سلوز کی بازیابی۔", tr: "Şalab'ın Franklardan Geri Alınması", id: "Pengambilan kembali Shalab dari suku Frank" }
summary:
  ar: "في سنة 586 بلغ يعقوب المنصور الموحدي أن الإفرنج ملكوا مدينة شلب وهي من غرب الأندلس فتوجه إليها بنفسه وحاصرها وأخذها، وأنفذ في الوقت جيشاً من الموحدين والعرب ففتح أربع مدن مما بأيدي الإفرنج من البلاد التي كانوا أخذوها من المسلمين قبل ذلك بأربعين سنة، وخافه صاحب طليطلة وسأله الهدنة والصلح فهادنه خمس سنين {cite:nafh-tib-maqqari p. 384}."
  en: "Al-Mansur's recovery of Silves (586): told the Franks had taken the western city, he marched himself, besieged and took it, and sent an army that won back four towns the Franks had held for forty years — whereupon the lord of Toledo sued for a five-year truce {cite:nafh-tib-maqqari p. 384}."
  es: "La recuperación de Silves por Al-Mansur (586): al enterarse de que los francos habían tomado la ciudad occidental, marchó él mismo, la sitió y la tomó, y envió un ejército que recuperó cuatro ciudades que los francos habían mantenido durante cuarenta años, tras lo cual el señor de Toledo pidió una tregua de cinco años {cite:nafh-tib-maqqari p. 384}."
  fr: "La reconquête de Silves par Al-Mansur (586): informé que les Francs avaient pris la ville occidentale, il marcha lui-même, l'assiégea et la prit, et envoya une armée qui reconquit quatre villes que les Francs avaient détenues pendant quarante ans — sur quoi le seigneur de Tolède demanda une trêve de cinq ans {cite: nafh-tib-maqqari p. 384}."
  ur: "المنصور کی سلوز کی بازیابی (586): اس نے بتایا کہ فرانکس نے مغربی شہر پر قبضہ کر لیا ہے، اس نے خود مارچ کیا، محاصرہ کیا اور اسے لے لیا، اور ایک فوج بھیجی جس نے چار قصبوں پر قبضہ کر لیا جو فرینکوں نے چالیس سال تک اپنے قبضے میں رکھے ہوئے تھے - جس پر ٹولیڈو کے مالک نے پانچ سالہ جنگ بندی کے لیے مقدمہ دائر کیا۔ 384}۔"
  tr: "586 yılında Yaqub al-Mansur al-Muwahidi, Frankların Batı Endülüs'te bulunan Silves şehrini ele geçirdiğini öğrendi. Bunun üzerine bizzat şehre gitti, kuşattı ve ele geçirdi. Aynı zamanda, bir Almohad ve Arap ordusu gönderdi ve bu ordu, Frankların elinde bulunan ve kırk yıl önce Müslümanlardan aldıkları topraklardaki dört şehri fethetti. Toledo hükümdarı ondan korktu ve ateşkes ve barış istedi; böylece onunla beş yıllık bir barış yaptı. {cite:nafh-tib-maqqari s. 384}"
  id: "Pada tahun 586, Yaqub al-Mansur al-Muwahidi mengetahui bahwa kaum Frank telah menguasai kota Silves, yang terletak di Andalusia barat. Maka ia sendiri pergi ke sana, mengepungnya, dan merebutnya. Pada saat yang sama, ia mengirimkan pasukan Almohad dan Arab, dan mereka menaklukkan empat kota yang berada di tangan kaum Frank, dari tanah yang telah mereka rebut dari kaum Muslim empat puluh tahun sebelumnya. Penguasa Toledo takut kepadanya dan meminta gencatan senjata dan perdamaian, maka ia berdamai dengannya selama lima tahun. {cite:nafh-tib-maqqari p. 384}."
