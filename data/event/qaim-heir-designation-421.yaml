summary:
  ar: "لما أرجف الناس بمرض الخليفة القادر عقد مجلسًا عامًّا يوم الأحد ثامن عشر جمادى الأولى سنة ٤٢١ فتكلم الناظر التركي أبو الغنائم مادحًا الاختيار للأمير أبي جعفر، فقال القادر «إذا كان الله قد أذن في ذلك فقد أذنا فيه» وجلس أبو جعفر على السرير؛ ويوم الجمعة لسبع بقين من الشهر خُطب له بلقب «القائم بأمر الله ولي عهد المسلمين» وثُبت على السكة والورق، وجاء كتاب جلال الدولة ثاني عشر جمادى الأولى يستأذن في إجراء ولاية العهد فقُرئ على الناس يوم الثلاثاء ببيت الموكب بمقدمة مفصلة ثم توقيع الخليفة {cite:muntazam-ibn-al-jawzi j.8 p.389-392}."
