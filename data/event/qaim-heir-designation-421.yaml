label: { ar: "إظهار ولاية عهد القائم بأمر الله ٤٢١", en: "The public declaration of al-Qa'im bi-Amr Allah as heir, 421", es: "La declaración pública de al-Qa'im bi-Amr Allah como heredero, 421", fr: "Déclaration publique d'al-Qa'im bi-Amr Allah comme héritier, 421", ur: "القائم بن عمرو اللہ کو وارث قرار دینا، 421", tr: "Al-Qa'im bi-Amr Allah'ın Veliaht Prensliğinin Gösterilmesi 421", id: "Menunjukkan Kedaulatan Putra Mahkota Al-Qa'im bi-Amr Allah 421" }
summary:
  ar: "لما أرجف الناس بمرض الخليفة القادر عقد مجلسًا عامًّا يوم الأحد ثامن عشر جمادى الأولى سنة ٤٢١ فتكلم الناظر التركي أبو الغنائم مادحًا الاختيار للأمير أبي جعفر، فقال القادر «إذا كان الله قد أذن في ذلك فقد أذنا فيه» وجلس أبو جعفر على السرير؛ ويوم الجمعة لسبع بقين من الشهر خُطب له بلقب «القائم بأمر الله ولي عهد المسلمين» وثُبت على السكة والورق، وجاء كتاب جلال الدولة ثاني عشر جمادى الأولى يستأذن في إجراء ولاية العهد فقُرئ على الناس يوم الثلاثاء ببيت الموكب بمقدمة مفصلة ثم توقيع الخليفة {cite:muntazam-ibn-al-jawzi j.8 p.389-392}."
  en: "When rumours spread about the illness of the caliph al-Qadir, he convened a general assembly on Sunday 18 Jumada I 421. The Turkish administrator Abu al-Ghana'im spoke in praise of the choice of Prince Abu Ja'far, and al-Qadir said, 'If God has permitted it, then we too permit it'; Abu Ja'far sat on the throne. On Friday, with seven days of the month left, he was proclaimed with the title 'al-Qa'im bi-Amr Allah, heir to the Muslims', and it was struck on the coinage. On the 12th of Jumada I a letter from Jalal al-Dawla arrived asking permission to carry out the designation of the heir; it was read out to the people on Tuesday in the Hall of Audience, with a detailed preamble, followed by the caliph's endorsement {cite:muntazam-ibn-al-jawzi j.8 p.389-392}."
  es: "Cuando se extendieron los rumores sobre la enfermedad del califa al-Qadir, este convocó una asamblea general el domingo 18 de Jumada I de 421. El administrador turco Abu al-Ghana'im habló en alabanza de la elección del príncipe Abu Ja'far, y al-Qadir dijo: «Si Dios lo ha permitido, nosotros también lo permitimos»; Abu Ja'far se sentó en el trono. El viernes, con siete días restantes del mes, fue proclamado con el título de «al-Qa'im bi-Amr Allah, heredero de los musulmanes», y este fue acuñado en las monedas. El 12 de Jumada I llegó una carta de Jalal al-Dawla solicitando permiso para llevar a cabo la designación del heredero; fue leída al pueblo el martes en la Sala de Audiencias, con un preámbulo detallado, seguido del respaldo del califa {cite:muntazam-ibn-al-jawzi j.8 p.389-392}."
  fr: "Lorsque des rumeurs se répandirent concernant la maladie du calife al-Qadir, celui-ci convoqua une assemblée générale le dimanche 18 Jumada I 421. L'administrateur turc Abu al-Ghana'im loua le choix du prince Abu Ja'far, et al-Qadir déclara: « Si Dieu l'a permis, nous l'autorisons également. » Abu Ja'far monta sur le trône. Le vendredi, à sept jours de la fin du mois, il fut proclamé « al-Qa'im bi-Amr Allah, héritier des musulmans », et ce titre fut frappé sur la monnaie. Le 12 Jumada I, une lettre de Jalal al-Dawla parvint, demandant l'autorisation de procéder à la désignation de l'héritier; elle fut lue au peuple le mardi dans la salle d'audience, précédée d'un préambule détaillé, suivi de l'approbation du calife (Muntazam ibn al-Jawzi, vol. 8, p. 389-392)."
  ur: "جب خلیفہ القادر کی بیماری کے بارے میں افواہیں پھیلیں تو انہوں نے اتوار 18 جمادی الثانی 421 کو ایک مجلس عاملہ بلائی۔ ترکی کے منتظم ابو الغنائم نے شہزادہ ابو جعفر کے انتخاب کی تعریف کی اور القادر نے کہا کہ اگر خدا نے اجازت دی ہے تو ہم بھی اس کی اجازت دیتے ہیں۔ ابو جعفر تخت پر بیٹھ گئے۔ جمعہ کے دن، جب مہینے کے سات دن باقی تھے، آپ کو القائم بِامر اللہ، مسلمانوں کے وارث\" کے لقب سے اعلان کیا گیا، اور یہ سکوں پر مارا گیا۔ 12 جمادی الاول کو جلال الدولہ کی طرف سے ایک خط آیا جس میں وارث کے عہدہ کو انجام دینے کی اجازت طلب کی گئی تھی۔ اسے منگل کے روز ہال آف آڈینس میں لوگوں کے سامنے ایک تفصیلی تمہید کے ساتھ پڑھ کر سنایا گیا، اس کے بعد خلیفہ کی توثیق کی گئی"
  tr: "Halife Kadir'in hastalığı hakkında söylentiler yayılınca, Hicri 421 yılının Cemadi el-Ula ayının 18. Pazar günü halka açık bir meclis topladı. Türk danışman Ebu el-Ganayim konuştu ve Prens Ebu Cafer'in seçilmesini övdü. Kadir, \"Eğer Allah buna izin verdiyse, biz de izin verdik\" dedi. Ebu Cafer yatağında oturuyordu. Ayın bitimine yedi gün kala, Cuma günü kendisine \"el-Kaim bi-Amr Allah ve-Veli el-Müslümin\" (Müslümanların Veliaht Prensi makamına yükselen) unvanı verildi ve bu, paralara ve kağıtlara kaydedildi. Celal el-Davla'nın mektubu Cemadi el-Ula ayının 12. gününde geldi ve Veliaht Prens'in atanması için izin istedi. Mektup, Salı günü Tören Evi'nde halka ayrıntılı bir girişle okundu ve ardından Halife'nin imzası atıldı."
  id: "Ketika orang-orang menyebarkan desas-desus tentang penyakit Khalifah al-Qadir, beliau mengadakan dewan publik pada hari Minggu, tanggal 18 Jumada al-Ula, 421 H. Penasihat Turki, Abu al-Ghanayim, berbicara, memuji pemilihan Pangeran Abu Ja'far. Al-Qadir berkata, “Jika Allah mengizinkan ini, maka kami pun mengizinkannya.” Abu Ja'far duduk di tempat tidur. Pada hari Jumat, tujuh hari sebelum akhir bulan, ia diberi gelar “al-Qa`im bi-Amr Allah wa-Wali al-Muslimin” (orang yang naik ke posisi Putra Mahkota Muslim), dan hal itu dicatat pada koin dan kertas. Surat Jalal al-Dawla tiba pada tanggal 12 Jumada al-Ula, meminta izin untuk melanjutkan pengangkatan Putra Mahkota. Surat itu dibacakan kepada masyarakat pada hari Selasa di Rumah Prosesi dengan pengantar yang rinci, diikuti dengan tanda tangan Khalifah."
