id: event/genoese-capture-tripoli-757
class: event
kind: conquest
label:
  ar: استيلاء الجنوبيين على طرابلس ورجوعها
  en: The Genoese capture and recovery of Tripoli
  es: "La captura y recuperación de Trípoli por los genoveses."
  fr: "La prise et la reconquête de Tripoli par les Génois"
  ur: "جنیوز کا طرابلس پر قبضہ اور بازیابی۔"
  tr: "Güney güçlerinin Trablus'u ele geçirmesi ve geri alması"
  id: "Perebutan Tripoli oleh pasukan Selatan dan pengembaliannya ke tangan mereka"
summary:
  ar: "كانت طرابلس ثغراً مقيماً رسم الدولة منقطعاً عن الحضرة في أعوام خمسين وسبعمائة، وتجار الجنوبيين يترددون إليها فاطلعوا على عوراتها، فهتف هاتفهم بالحرب وقد لبسوا السلاح فارتاع الناس وهبوا من مضاجعهم، فلما رأوهم بالأسوار لم يكن همّ أهلها إلا النجاة بأنفسهم، ونجا ثابت بن عمر مقدمهم إلى الحلة فلحق بأخيه بقاصية إفريقية، وملك النصارى البلد حتى ردّها المسلمون."
  en: "Tripoli stood as a frontier town holding the state's rite while cut off from the capital in the 750s, Genoese merchants frequenting it and spying out its weaknesses; their herald cried war with arms already donned, the people woke in panic, and seeing them on the walls thought only of saving themselves — Thabit ibn Umar their captain escaping to the Hulla to join his brother — while the Christians held the town until the Muslims won it back."
  es: "En la década de 750, Trípoli se erigía como una ciudad fronteriza que albergaba el rito estatal, aunque aislada de la capital. Los mercaderes genoveses la frecuentaban y espiaban sus puntos débiles; su heraldo gritó la guerra con las armas ya empuñadas, la gente despertó presa del pánico y, al verlos en las murallas, solo pensaba en salvarse a sí misma —Thabit ibn Umar, su capitán, escapó a Hulla para reunirse con su hermano— mientras los cristianos defendían la ciudad hasta que los musulmanes la reconquistaron."
  fr: "Dans les années 750, Tripoli, ville frontière, conservait le pouvoir de l'État tout en étant coupée de la capitale. Des marchands génois la fréquentaient et y cherchaient ses faiblesses; leur héraut cria à la guerre, les armes déjà enfilées. Le peuple se réveilla paniqué et, les voyant sur les remparts, ne pensa qu'à se sauver lui-même — Thabit ibn Umar, leur capitaine, s'enfuit à Hulla pour rejoindre son frère — tandis que les chrétiens tenaient la ville jusqu'à ce que les musulmans la reprennent."
  ur: "طرابلس 750 کی دہائی میں دارالحکومت سے منقطع ہونے کے دوران ریاست کی رسومات کو تھامے ہوئے ایک سرحدی شہر کے طور پر کھڑا تھا، جینو کے تاجر اس میں اکثر آتے تھے اور اس کی کمزوریوں کی جاسوسی کرتے تھے۔ ان کے ہیرالڈ نے پہلے سے ہتھیاروں کے ساتھ جنگ کی چیخ ماری، لوگ گھبراہٹ میں آگئے، اور انہیں دیواروں پر دیکھ کر صرف اپنے آپ کو بچانے کا سوچا - ثابت بن عمر ان کے کپتان اپنے بھائی کے ساتھ مل کر ہلہ کی طرف بھاگ رہے ہیں - جبکہ عیسائیوں نے اس شہر پر قبضہ کر لیا جب تک کہ مسلمانوں نے اسے واپس نہیں کر لیا۔"
  tr: "Trablus, Hicri 750 yılında başkentten izole edilmiş, devlet tarafından işletilen kalıcı bir liman kentiydi. Güneyden gelen tüccarlar burayı sık sık ziyaret ediyor ve zayıf noktalarının farkına varıyorlardı. Habercileri savaş çağrısında bulundu ve silahlandılar. Halk dehşete kapıldı ve yataklarından kalktı. Onları surlarda görünce, sakinlerinin tek endişesi kendilerini kurtarmaktı. Liderleri Sabit bin Ömer, Hilla'ya kaçarak Afrika'nın ücra bir köşesindeki kardeşine katıldı. Şehir, Müslümanlar tarafından geri alınana kadar Hristiyanlar tarafından yönetildi."
  id: "Tripoli adalah kota pelabuhan permanen, pelabuhan yang dikelola negara, terisolasi dari ibu kota pada tahun 750 Hijriah. Para pedagang dari selatan sering mengunjungi kota ini dan menyadari kerentanannya. Utusan mereka menyerukan perang, dan mereka pun mempersenjatai diri. Rakyat ketakutan dan bangkit dari tempat tidur mereka. Ketika mereka melihat pasukan di tembok kota, satu-satunya kekhawatiran penduduknya adalah menyelamatkan diri. Thabit bin Omar, pemimpin mereka, melarikan diri ke Hilla dan bergabung dengan saudaranya di daerah terpencil di Afrika. Umat Kristen menguasai kota itu hingga umat Muslim merebutnya kembali."
