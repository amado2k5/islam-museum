label: { ar: "ملك الملك الأشرف دمشق من ابن أخيه داود", en: "Al-Malik al-Ashraf takes Damascus from his nephew Dawud", fr: "Al-Malik al-Ashraf prend Damas à son neveu Dawud", es: "Al-Malik al-Ashraf toma Damasco de su sobrino Dawud.", ur: "المالک الاشرف نے اپنے بھتیجے داؤد سے دمشق چھین لیا۔", tr: "Şam Kralı El-Eşref, burayı yeğeni Davud'dan aldı.", id: "Raja Al-Ashraf dari Damaskus mengambil alih kepemilikannya dari keponakannya, David." }
summary:
  ar: "يوم الاثنين ثاني شعبان سنة ست وعشرين وستمائة ملك الملك الأشرف بن الملك العادل دمشق من ابن أخيه صلاح الدين داود بن المعظم؛ وكان داود قد استنجد عمه الأشرف على عمه الكامل فدخل الأشرف دمشق وحلف له على المساعدة ثم اصطلح الأشرف والكامل، وبينما داود والأشرف جالسان في خيمة دخل عز الدين أيبك مملوك المعظم وهو أكبر أمير مع ولده وقال لداود قم اخرج فالقبضة الساعة إذ قيل له إن الأشرف يريد القبض على صاحبه فأخرجه ولم يمكن الأشرف منعه لأن أيبك كان أركب عسكره كلهم فساروا إلى دمشق، فسار الأشرف فنازلها وحصرها حتى وصل الكامل فاشتد الحصار وكان من أشد الأمور على داود قلة المال لأن أمواله بالكرك ولوثوقه بعمه لم يحضر منها شيئاً فاحتاج إلى أن باع حلي نسائه وملبوسهم، فخرج إلى عمه الكامل وبذل له تسليم دمشق على أن يبقى عليه الكرك وقلعة الشوبك والغور ونابلس وتلك الأعمال ويبقى لأيبك قلعة صرخد وأعمالها، وسلم الكامل دمشق وجعل نائبه بالقلعة حتى سلم إليه أخوه الأشرف حران والرها والرقة وسروج ورأس العين من الجزيرة فلما تسلمها سلم قلعة دمشق إلى الأشرف {cite:kamil-ibn-al-athir p. 482}."
  en: "On Monday, 2 Sha'ban 626, al-Malik al-Ashraf ibn al-Malik al-Adil took Damascus from his nephew Salah al-Din Dawud ibn al-Mu'azzam. Dawud had sought the help of his uncle al-Ashraf against his uncle al-Kamil, and al-Ashraf entered Damascus and swore to assist him; then al-Ashraf and al-Kamil reconciled. While Dawud and al-Ashraf were sitting in a tent, Izz al-Din Aybak, a mamluk of al-Mu'azzam and the greatest of the amirs, came in together with his son and told Dawud: «Get up and leave, the seizure is now», since he had been told that al-Ashraf meant to seize his companion. So he took Dawud out, and al-Ashraf could not prevent it, because Aybak had mounted all his army and they marched on Damascus. Al-Ashraf went and besieged the city until al-Kamil arrived, and the siege grew tight. The greatest hardship for Dawud was lack of money, because his wealth was at al-Karak and, trusting his uncle, he had brought none of it; he was obliged to sell the jewellery and clothing of his women. He went out to his uncle al-Kamil and offered to surrender Damascus on condition that al-Karak, the citadel of Shawbak, al-Ghawr, Nablus and those districts remain his, and that Aybak keep the citadel of Salkhad and its districts. Al-Kamil handed over Damascus and set his deputy in the citadel until his brother al-Ashraf handed over to him Harran, al-Ruha, al-Raqqa, Sarudj and Ras al-Ayn of al-Jazira; when he received them, he handed the citadel of Damascus to al-Ashraf {cite:kamil-ibn-al-athir p. 482}."
  fr: "Le lundi 2 Sha'ban 626, al-Malik al-Ashraf ibn al-Malik al-Adil prit Damas à son neveu Salah al-Din Dawud ibn al-Mu'azzam. Dawud avait demandé l'aide de son oncle al-Ashraf contre son oncle al-Kamil, et al-Ashraf entra dans Damas et jura de le soutenir ; puis al-Ashraf et al-Kamil se réconcilièrent. Alors que Dawud et al-Ashraf étaient assis sous une tente, Izz al-Din Aybak, mamelouk d'al-Mu'azzam et le plus grand des émirs, entra avec son fils et dit à Dawud : « Lève-toi et pars, l'arrestation, c'est maintenant », car on lui avait dit qu'al-Ashraf voulait se saisir de son maître. Il fit donc sortir Dawud, et al-Ashraf ne put l'en empêcher, car Aybak avait fait monter toute son armée et ils marchèrent sur Damas. Al-Ashraf vint assiéger la ville jusqu'à l'arrivée d'al-Kamil, et le siège se resserra. La plus grande difficulté de Dawud fut le manque d'argent, car ses biens étaient à al-Karak et, confiant en son oncle, il n'en avait rien apporté ; il dut vendre les bijoux et les vêtements de ses femmes. Il sortit vers son oncle al-Kamil et proposa de livrer Damas à condition de conserver al-Karak, la citadelle de Shawbak, al-Ghawr, Naplouse et leurs districts, et qu'Aybak garde la citadelle de Salkhad et ses districts. Al-Kamil prit Damas et plaça son lieutenant dans la citadelle jusqu'à ce que son frère al-Ashraf lui eût remis Harran, al-Ruha, al-Raqqa, Sarudj et Ras al-Ayn de la Jazira ; quand il les eut reçues, il remit la citadelle de Damas à al-Ashraf {cite:kamil-ibn-al-athir p. 482}."
  es: "El lunes 2 de Sha'ban de 626, al-Malik al-Ashraf ibn al-Malik al-Adil tomó Damasco de su sobrino Salah al-Din Dawud ibn al-Mu'azzam. Dawud había buscado la ayuda de su tío al-Ashraf contra su tío al-Kamil, y al-Ashraf entró en Damasco y juró ayudarlo; entonces al-Ashraf y al-Kamil se reconciliaron. Mientras Dawud y al-Ashraf estaban sentados en una tienda, Izz al-Din Aybak, un mameluco de al-Mu'azzam y el más grande de los emires, entró junto con su hijo y le dijo a Dawud: «Levántate y vete, la toma es ahora», ya que le habían dicho que al-Ashraf tenía la intención de apresar a su compañero. Así que sacó a Dawud, y al-Ashraf no pudo impedirlo, pues Aybak había reunido a todo su ejército y marcharon sobre Damasco. Al-Ashraf fue y sitió la ciudad hasta que llegó al-Kamil, y el asedio se intensificó. La mayor dificultad para Dawud fue la falta de dinero, pues su fortuna estaba en al-Karak y, confiando en su tío, no había traído nada; se vio obligado a vender las joyas y la ropa de sus mujeres. Salió a ver a su tío al-Kamil y le ofreció rendir Damasco con la condición de que al-Karak, la ciudadela de Shawbak, al-Ghawr, Nablus y sus distritos permanecieran en su poder, y que Aybak conservara la ciudadela de Salkhad y sus distritos. Al-Kamil entregó Damasco y puso a su lugarteniente en la ciudadela hasta que su hermano al-Ashraf le entregó Harran, al-Ruha, al-Raqqa, Sarudj y Ras al-Ayn de al-Jazira; cuando los recibió, entregó la ciudadela de Damasco a al-Ashraf {cite:kamil-ibn-al-athir p. 482}."
  ur: "2 شعبان 626 بروز پیر المالک الاشرف بن الملک العادل نے اپنے بھتیجے صلاح الدین داؤد ابن المعظم سے دمشق لے لیا۔ داؤد نے اپنے چچا الکامل کے خلاف اپنے چچا الاشرف سے مدد مانگی تھی، اور الاشرف دمشق میں داخل ہوا اور اس کی مدد کی قسم کھائی۔ پھر الاشرف اور الکامل نے صلح کر لی۔ جب داؤد اور اشرف ایک خیمے میں بیٹھے ہوئے تھے، عزالدین ایبک، جو المعزم کا ایک مملوک اور امیروں میں سب سے بڑا تھا، اپنے بیٹے کے ساتھ آیا اور داؤد سے کہا: \"اٹھو اور چلے جاؤ، اب قبضہ ہو گیا ہے\" کیونکہ اسے بتایا گیا تھا کہ اشرف کا مطلب اپنے ساتھی کو پکڑنا ہے۔ چنانچہ وہ داؤد کو باہر لے گیا، اور اشرف اسے روک نہیں سکتا تھا، کیونکہ ایبک نے اپنی تمام فوج کو سوار کر لیا تھا اور وہ دمشق پر چڑھ دوڑے۔ الاشرف نے جا کر شہر کا محاصرہ کیا یہاں تک کہ الکامل پہنچ گیا اور محاصرہ سخت ہو گیا۔ داؤد کے لیے سب سے بڑی مشکل رقم کی کمی تھی، کیونکہ اس کی دولت الکرک میں تھی اور اپنے چچا پر بھروسہ کرتے ہوئے وہ اس میں سے کچھ نہیں لایا تھا۔ وہ اپنی عورتوں کے زیورات اور کپڑے بیچنے کا پابند تھا۔ وہ اپنے چچا الکامل کے پاس گیا اور اس شرط پر دمشق کو ہتھیار ڈالنے کی پیشکش کی کہ الکراک، شوبک کا قلعہ، الثور، نابلس اور وہ اضلاع اس کے باقی رہیں اور ایبک سلخد کا قلعہ اور اس کے اضلاع کو اپنے پاس رکھیں۔ الکامل نے دمشق کے حوالے کر دیا اور قلعہ میں اپنا نائب مقرر کیا یہاں تک کہ اس کے بھائی الاشرف نے اس کے حوالے کر دیے حران، الروح، الرقہ، سرود اور الجزیرہ کے راس العین؛ جب اس نے ان کا استقبال کیا تو اس نے دمشق کا قلعہ الاشرف کے حوالے کر دیا۔ 482}۔"
  tr: "Altı yüz yirmi altı yılının Şaban ayının ikinci Pazartesi günü, Kral Adil'in oğlu Kral Eşref, yeğeni Muazzam'ın oğlu Selahaddin Davud'dan Şam'ın kontrolünü ele geçirdi; Davud, diğer amcası Kamil'e karşı amcası Eşref'ten yardım istemişti. Eşref Şam'a girdi ve ona yardım edeceğine yemin etti. Ardından Eşref ve Kamil barıştılar. Davud ve Eşref bir çadırda otururken, Muazzam'ın Memlük'ü ve en kıdemli emiri İzzddin Aybak oğluyla birlikte içeri girdi ve Davud'a, \"Çık dışarı! Tutuklama yakında!\" dedi. Eşref'in arkadaşını tutuklamayı planladığı kendisine bildirilmişti. Bu yüzden onu dışarı çıkardı ve Eşref onu durduramadı çünkü Aybak zaten tüm ordusunu seferber etmişti ve Şam'a doğru yürüdüler. El-Eşref daha sonra şehre doğru ilerleyip şehri kuşattı, ta ki el-Kamil gelene kadar. Bu noktada kuşatma daha da şiddetlendi. Davud'un en büyük zorluklarından biri, servetinin Karak'ta olması ve amcasına olan güveni nedeniyle hiçbirini yanında getirmemiş olmasıydı. Bu yüzden eşlerinin mücevherlerini ve giysilerini satmak zorunda kaldı. Amcası el-Kamil'e giderek, Karak, Şevbek kalesi, Ürdün Vadisi, Nablus ve bu toprakları elinde tutması karşılığında Şam'ı teslim etmeyi teklif etti. Sarhad kalesi ve çevresindeki topraklar ise Aybak'a kalacaktı. El-Kamil Şam'ı teslim etti ve kardeşi el-Eşref Harran, Edessa, Rakka, Saruj ve Cezire bölgesindeki Ras el-Ayn'ı teslim edene kadar kaleye vekilini atadı. Bunları teslim aldığında Şam kalesini el-Eşref'e teslim etti. {kaynak: Kamil İbn el-Aşir s. 482}"
  id: "Pada hari Senin, tanggal 2 Sya'ban, tahun 626, Raja Al-Ashraf, putra Raja Al-Adil, mengambil alih Damaskus dari keponakannya, Salah Al-Din Dawud, putra Al-Mu'azzam; Dawud telah meminta bantuan pamannya, al-Ashraf, melawan pamannya yang lain, al-Kamil. Al-Ashraf memasuki Damaskus dan bersumpah untuk membantunya. Kemudian al-Ashraf dan al-Kamil berdamai. Ketika Dawud dan al-Ashraf sedang duduk di sebuah tenda, Izz al-Din Aybak, Mamluk al-Mu'azzam dan emir paling senior, masuk bersama putranya dan berkata kepada Dawud, \"Keluar! Penangkapan akan segera terjadi!\" Ia telah diberitahu bahwa al-Ashraf bermaksud untuk menangkap temannya. Maka ia membawanya keluar, dan al-Ashraf tidak dapat menghentikannya karena Aybak telah mengerahkan seluruh pasukannya, dan mereka berbaris ke Damaskus. Al-Ashraf kemudian bergerak maju dan mengepung kota hingga al-Kamil tiba, yang kemudian pengepungan semakin intensif. Salah satu kesulitan terbesar Dawud adalah kekurangan dana, karena kekayaannya berada di Karak, dan karena kepercayaannya kepada pamannya, ia tidak membawa sebagian pun dari kekayaannya. Ia terpaksa menjual perhiasan dan pakaian istrinya. Ia pergi menemui pamannya, al-Kamil, dan menawarkan untuk menyerahkan Damaskus dengan imbalan mempertahankan Karak, benteng Shawbak, Lembah Yordania, Nablus, dan wilayah-wilayah tersebut, sementara benteng Sarhad dan wilayah-wilayah yang bergantung padanya tetap dipertahankan untuk Aybak. Al-Kamil menyerahkan Damaskus dan menunjuk wakilnya di benteng tersebut hingga saudaranya, al-Ashraf, menyerahkan Harran, Edessa, Raqqa, Saruj, dan Ras al-Ayn di wilayah Jazira. Setelah menerima wilayah-wilayah tersebut, ia menyerahkan benteng Damaskus kepada al-Ashraf. {cite:kamil-ibn-al-athir p. 482}."
