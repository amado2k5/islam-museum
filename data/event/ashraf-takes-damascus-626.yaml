label: { ar: "ملك الملك الأشرف دمشق من ابن أخيه داود", en: "Al-Malik al-Ashraf takes Damascus from his nephew Dawud" }
summary:
  ar: "يوم الاثنين ثاني شعبان سنة ست وعشرين وستمائة ملك الملك الأشرف بن الملك العادل دمشق من ابن أخيه صلاح الدين داود بن المعظم؛ وكان داود قد استنجد عمه الأشرف على عمه الكامل فدخل الأشرف دمشق وحلف له على المساعدة ثم اصطلح الأشرف والكامل، وبينما داود والأشرف جالسان في خيمة دخل عز الدين أيبك مملوك المعظم وهو أكبر أمير مع ولده وقال لداود قم اخرج فالقبضة الساعة إذ قيل له إن الأشرف يريد القبض على صاحبه فأخرجه ولم يمكن الأشرف منعه لأن أيبك كان أركب عسكره كلهم فساروا إلى دمشق، فسار الأشرف فنازلها وحصرها حتى وصل الكامل فاشتد الحصار وكان من أشد الأمور على داود قلة المال لأن أمواله بالكرك ولوثوقه بعمه لم يحضر منها شيئاً فاحتاج إلى أن باع حلي نسائه وملبوسهم، فخرج إلى عمه الكامل وبذل له تسليم دمشق على أن يبقى عليه الكرك وقلعة الشوبك والغور ونابلس وتلك الأعمال ويبقى لأيبك قلعة صرخد وأعمالها، وسلم الكامل دمشق وجعل نائبه بالقلعة حتى سلم إليه أخوه الأشرف حران والرها والرقة وسروج ورأس العين من الجزيرة فلما تسلمها سلم قلعة دمشق إلى الأشرف {cite:kamil-ibn-al-athir p. 482}."
  en: "On Monday, 2 Sha'ban 626, al-Malik al-Ashraf ibn al-Malik al-Adil took Damascus from his nephew Salah al-Din Dawud ibn al-Mu'azzam. Dawud had sought the help of his uncle al-Ashraf against his uncle al-Kamil, and al-Ashraf entered Damascus and swore to assist him; then al-Ashraf and al-Kamil reconciled. While Dawud and al-Ashraf were sitting in a tent, Izz al-Din Aybak, a mamluk of al-Mu'azzam and the greatest of the amirs, came in together with his son and told Dawud: «Get up and leave, the seizure is now», since he had been told that al-Ashraf meant to seize his companion. So he took Dawud out, and al-Ashraf could not prevent it, because Aybak had mounted all his army and they marched on Damascus. Al-Ashraf went and besieged the city until al-Kamil arrived, and the siege grew tight. The greatest hardship for Dawud was lack of money, because his wealth was at al-Karak and, trusting his uncle, he had brought none of it; he was obliged to sell the jewellery and clothing of his women. He went out to his uncle al-Kamil and offered to surrender Damascus on condition that al-Karak, the citadel of Shawbak, al-Ghawr, Nablus and those districts remain his, and that Aybak keep the citadel of Salkhad and its districts. Al-Kamil handed over Damascus and set his deputy in the citadel until his brother al-Ashraf handed over to him Harran, al-Ruha, al-Raqqa, Sarudj and Ras al-Ayn of al-Jazira; when he received them, he handed the citadel of Damascus to al-Ashraf {cite:kamil-ibn-al-athir p. 482}."
