id: event/adud-al-dawla-investiture-369
class: event
kind: other
label: { ar: "تفويض الطائع الأمر إلى عضد الدولة" }
summary:
  ar: "في سنة تسع وستين ورد رسول العزيز صاحب مصر إلى بغداد وسأل عضد الدولة الطائع أن يزيد في ألقابه تاج الملة فأجابه وجلس الطائع على السرير وحوله مئة بالسيوف وبين يديه مصحف عثمان وعلى كتفه البردة وبيده القضيب وهو متقلد بسيف رسول الله وضربت ستارة بعثها عضد الدولة حتى لا يقع عليه عين أحد من الجند قبله ودخل الأتراك والديلم وليس مع أحد منهم حديد ووقف الأشراف من الجانبين ثم أذن لعضد الدولة فدخل ورفعت الستارة وقبل الأرض فارتاع زياد القائد وقال ما هذا أيها الملك أهذا هو الله فالتفت وقال هذا خليفة الله في الأرض وقبل الأرض سبع مرات فاستدناه الطائع فقبل رجله وأجلسه على كرسي بعد أن أقسم عليه وقال له قد رأيت أن أفوض إليك ما وكل الله إلي من أمور الرعية في شرق الأرض وغربها وتدبيرها في جميع جهاتها سوى خاصتي وأسبابي فتول ذلك وكان قبل قد خلع عليه خلع السلطنة وتوجه بتاج مجوهر وعقد له لواءين أحدهما مفضض على رسم الأمراء والآخر مذهب على رسم ولاة العهود ولم يعقد هذا اللواء لغيره قبله وأمر سنة ثمان وستين أن تضرب الدبادب على بابه وأن يخطب له على منابر الحضرة وقال ابن الجوزي هذان أمران لم يكونا من قبله ولا أطلقا لولاة العهود {cite:tarikh-khulafa-minhaj-1434 p. 628-630}."
  en: "In 369 al-Ta'i' sat on the throne ringed by a hundred swordsmen, Uthman's mushaf before him, the Burda on his shoulder, the qadib in his hand, the Prophet's sword at his side; the curtain Adud al-Dawla sent hung so no soldier's eye touched the caliph first. Adud entered and kissed the ground — his captain Ziyad recoiled: 'what is this, king? is this God?' — 'this is God's caliph on earth'. Seven times he kissed the ground, then the caliph's foot, and sat on a chair only under oath. Al-Ta'i' said: 'I have resolved to delegate to you what God entrusted to me of the subjects' affairs in earth's east and west, save my household and retinue'. Before this he had received the investiture robes, a jewelled crown, and two standards — silvered as amirs' and gilded as heirs-apparent's, the latter unprecedented — and in 368 the drums at his gate and the khutba from the court minbars, which Ibn al-Jawzi notes had never been granted even to heirs {cite:tarikh-khulafa-minhaj-1434 p. 628-630}."
