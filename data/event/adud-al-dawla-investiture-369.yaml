label: { ar: "تفويض الطائع الأمر إلى عضد الدولة", en: "Al-Ta'i' Delegates Authority to Adud al-Dawla", fr: "Al-Ta'i délègue son autorité à Adud al-Dawla", es: "Al-Ta'i' delega autoridad en Adud al-Dawla.", ur: "الطائی نے عدود الدولہ کو اختیار دیا ہے۔", tr: "İtaatkâr vekil, meseleyi Adud al-Dawla'ya iletir.", id: "Orang yang taat itu mendelegasikan masalah tersebut kepada Adud al-Dawla." }
summary:
  ar: "في سنة تسع وستين ورد رسول العزيز صاحب مصر إلى بغداد وسأل عضد الدولة الطائع أن يزيد في ألقابه تاج الملة فأجابه وجلس الطائع على السرير وحوله مئة بالسيوف وبين يديه مصحف عثمان وعلى كتفه البردة وبيده القضيب وهو متقلد بسيف رسول الله وضربت ستارة بعثها عضد الدولة حتى لا يقع عليه عين أحد من الجند قبله ودخل الأتراك والديلم وليس مع أحد منهم حديد ووقف الأشراف من الجانبين ثم أذن لعضد الدولة فدخل ورفعت الستارة وقبل الأرض فارتاع زياد القائد وقال ما هذا أيها الملك أهذا هو الله فالتفت وقال هذا خليفة الله في الأرض وقبل الأرض سبع مرات فاستدناه الطائع فقبل رجله وأجلسه على كرسي بعد أن أقسم عليه وقال له قد رأيت أن أفوض إليك ما وكل الله إلي من أمور الرعية في شرق الأرض وغربها وتدبيرها في جميع جهاتها سوى خاصتي وأسبابي فتول ذلك وكان قبل قد خلع عليه خلع السلطنة وتوجه بتاج مجوهر وعقد له لواءين أحدهما مفضض على رسم الأمراء والآخر مذهب على رسم ولاة العهود ولم يعقد هذا اللواء لغيره قبله وأمر سنة ثمان وستين أن تضرب الدبادب على بابه وأن يخطب له على منابر الحضرة وقال ابن الجوزي هذان أمران لم يكونا من قبله ولا أطلقا لولاة العهود {cite:tarikh-khulafa-minhaj-1434 p. 628-630}."
  en: "In 369 al-Ta'i' sat on the throne ringed by a hundred swordsmen, Uthman's mushaf before him, the Burda on his shoulder, the qadib in his hand, the Prophet's sword at his side; the curtain Adud al-Dawla sent hung so no soldier's eye touched the caliph first. Adud entered and kissed the ground — his captain Ziyad recoiled: 'what is this, king? is this God?' — 'this is God's caliph on earth'. Seven times he kissed the ground, then the caliph's foot, and sat on a chair only under oath. Al-Ta'i' said: 'I have resolved to delegate to you what God entrusted to me of the subjects' affairs in earth's east and west, save my household and retinue'. Before this he had received the investiture robes, a jewelled crown, and two standards — silvered as amirs' and gilded as heirs-apparent's, the latter unprecedented — and in 368 the drums at his gate and the khutba from the court minbars, which Ibn al-Jawzi notes had never been granted even to heirs {cite:tarikh-khulafa-minhaj-1434 p. 628-630}."
  fr: "En 369, al-Ta'i siégea sur le trône entouré de cent hommes armés d’épées, le mushaf d’Uthman devant lui, la Burda sur l’épaule, le bâton à la main et l’épée du Prophète au côté. Le rideau envoyé par Adud al-Dawla empêchait les soldats de voir le calife avant lui. Adud entra et baisa le sol ; son capitaine Ziyad s’effraya : « Qu’est-ce donc, ô roi ? Est-ce Dieu ? » Il répondit : « C’est le calife de Dieu sur terre. » Il baisa sept fois le sol, puis le pied du calife, et ne s’assit sur une chaise qu’après un serment. Al-Ta'i lui délégua les affaires des sujets que Dieu lui avait confiés à l’orient et à l’occident de la terre, sauf sa maisonnée et son entourage. Il avait auparavant reçu les robes d’investiture, une couronne sertie de joyaux et deux étendards, l’un argenté comme ceux des émirs, l’autre doré comme ceux des héritiers, ce dernier sans précédent. En 368, il avait reçu le droit aux tambours à sa porte et au sermon en son nom sur les minbars de la cour, privilèges qu’Ibn al-Jawzi dit n’avoir jamais été accordés, même aux héritiers {cite:tarikh-khulafa-minhaj-1434 p. 628-630}."
  es: "En el año 369, al-Ta'i' se sentó en el trono rodeado por cien espadachines, con el Corán de Uthman delante, la Burda sobre su hombro, el qadib en su mano y la espada del Profeta a su lado; la cortina que Adud al-Dawla había enviado colgaba de tal manera que ningún soldado podía ver primero al califa. Adud entró y besó el suelo; su capitán Ziyad retrocedió: «¿Qué es esto, rey? ¿Es Dios?». «Este es el califa de Dios en la tierra». Besó el suelo siete veces, luego el pie del califa, y solo se sentó en una silla bajo juramento. Al-Ta'i' dijo: «He decidido delegarte lo que Dios me ha confiado de los asuntos de los súbditos en el oriente y el occidente de la tierra, excepto mi casa y mi séquito». Antes de esto había recibido las vestiduras de investidura, una corona enjoyada y dos estandartes —plateados como los de los emires y dorados como los de los herederos aparentes, estos últimos sin precedentes— y en 368 los tambores de su puerta y la jutba de los minbares de la corte, que Ibn al-Jawzi señala que nunca se habían concedido ni siquiera a los herederos {cite:tarikh-khulafa-minhaj-1434 p. 628-630}."
  ur: "369 میں الطائی ایک سو تلوار والے تخت پر بیٹھے، اس کے سامنے عثمان کا مصحف، کندھے پر بردہ، ہاتھ میں قدیب، اس کے پہلو میں نبی کی تلوار؛ پردہ عود الدولہ نے لٹکا دیا تو خلیفہ کو پہلے کسی سپاہی کی آنکھ نہ لگی۔ عود داخل ہوا اور زمین کو بوسہ دیا - اس کے کپتان زیاد نے پیچھے ہٹ کر کہا: 'بادشاہ یہ کیا ہے؟ کیا یہ خدا ہے؟ - 'یہ زمین پر خدا کا خلیفہ ہے'۔ سات مرتبہ آپ نے زمین کو بوسہ دیا، پھر خلیفہ کے قدموں کو، اور صرف حلف کے تحت کرسی پر بیٹھ گئے۔ الطائی نے کہا: میں نے تہیہ کر لیا ہے کہ اللہ تعالیٰ نے زمین کے مشرق و مغرب کے معاملات میں سے جو کچھ میرے سپرد کیا ہے وہ آپ کے سپرد کروں گا، اپنے گھر والوں کو بچا کر رکھوں گا۔ اس سے پہلے اسے سرمایہ کاری کے لباس، زیورات سے مزین تاج، اور دو معیارات ملے تھے - امیروں کے طور پر چاندی اور سونا چڑھا ہوا تھا - ظاہری طور پر وارث کے طور پر - اور 368 میں اس کے دروازے پر ڈھول اور دربار کے منبروں سے خطبہ، جو ابن الجوزی نے نوٹ کیا تھا کہ اسے کبھی نہیں دیا گیا تھا۔ {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 628-630}۔"
  tr: "Hicri 69 yılında, Mısır hükümdarı Aziz'in elçisi Bağdat'a geldi ve Edü'd-Devla el-Tay'dan unvanlarına \"Ulusun Tacı\" unvanını eklemesini istedi. El-Tay kabul etti ve kılıçlı yüz adamla çevrili olarak tahta oturdu. Önünde Osmanî Kur'an, omzunda ise Peygamberin cübbesi vardı. Elinde asa, kuşağında ise Allah Resulü'nün kılıcı bulunuyordu. Edü'd-Devla'nın gönderdiği bir perde çekildi, böylece hiçbir asker onu önceden göremezdi. Türkler ve Delamlılar içeri girdiler, hiçbiri zırh giymemişti. Soylular iki yanında duruyordu. Sonra Edü'd-Devla'ya içeri girme izni verildi ve perde kaldırıldı. Yere öpücük kondurdu ve komutan Ziyad şaşırdı ve \"Bu nedir, ey Kral? Bu Allah mı?\" dedi. Döndü ve \"Bu, yeryüzündeki Allah'ın halifesidir\" dedi ve yedi defa toprağı öptü. Sonra El-Ta'i onu yanına çağırdı, ayaklarını öptü ve yemin ettirdikten sonra onu bir sandalyeye oturttu. Ona, \"Allah'ın bana emanet ettiği, yeryüzünün doğusundaki ve batısındaki halkların işleri ve bütün bölgelerindeki yönetimleri, kendi kişisel işlerim ve kendi halkımın işleri hariç, sana emanet etmeye karar verdim. Bunu üstlen.\" dedi. Daha önce ona sultanlık kıyafetlerini giymiş ve mücevherli bir taç hediye etmişti. Ona, prenslerin adetine göre gümüş kaplama ve valilerin adetine göre altın kaplama iki sancak verildi. Bu antlaşmalar ve bu birlik ondan önce kimse için toplanmamıştı ve 68. yılda kapısına davul çalınmasını ve saray minberlerinde vaazlar verilmesini emretti. İbn el-Cevzi şöyle demiştir: Bunlar, ondan önce yapılmamış ve ahit yöneticilerine de verilmemiş iki meseledir. {kaynak:tarikh-khulafa-minhaj-1434 s. 628-630}"
  id: "Pada tahun 69 Hijriah, utusan al-Aziz, penguasa Mesir, tiba di Baghdad dan meminta Adud al-Dawla al-Ta'i untuk menambahkan gelar \"Mahkota Bangsa\" pada gelar-gelarnya. Al-Ta'i setuju dan duduk di atas singgasana, dikelilingi oleh seratus orang bersenjata pedang. Di hadapannya terbentang Al-Qur'an Utsmani, dan di bahunya terdapat jubah Nabi. Di tangannya terdapat tongkat, dan ia mengenakan pedang Rasulullah. Sebuah tirai, yang dikirim oleh Adud al-Dawla, ditarik agar tidak ada prajurit yang dapat melihatnya sebelumnya. Orang-orang Turki dan Dalam masuk, tidak seorang pun dari mereka membawa baju zirah. Para bangsawan berdiri di kedua sisinya. Kemudian Adud al-Dawla diizinkan masuk, dan tirai diangkat. Ia mencium tanah, dan Ziyad, sang komandan, terkejut dan berkata, \"Apa ini, wahai Raja? Apakah ini Tuhan?\" Ia berbalik dan berkata, \"Ini adalah Khalifah Tuhan di Bumi,\" dan mencium tanah tujuh kali. Kemudian Al-Ta'i mendekatkan Al-Ta'i, mencium kakinya, dan mendudukkannya di kursi setelah menyuruhnya bersumpah. Ia berkata kepadanya, \"Aku telah memutuskan untuk mempercayakan kepadamu apa yang telah Allah percayakan kepadaku mengenai urusan rakyat di timur dan barat bumi, dan pemerintahan mereka di seluruh wilayahnya, kecuali urusan pribadiku dan urusan rakyatku. Ambil alihlah ini.\" Sebelumnya ia telah menganugerahi Al-Ta'i jubah kesultanan dan memberinya mahkota bertatahkan permata. Ia diberi dua panji, satu berlapis perak sesuai dengan kebiasaan para pangeran, dan yang lainnya berlapis emas sesuai dengan kebiasaan para gubernur. Perjanjian dan brigade ini tidak pernah diadakan untuk siapa pun sebelum dia, dan pada tahun enam puluh delapan ia memerintahkan agar genderang ditabuh di depan pintunya dan khotbah disampaikan untuknya di mimbar-mimbar istana. Ibn al-Jawzi berkata: Ini adalah dua hal yang tidak dilakukan sebelum dia, dan tidak pula diberikan kepada para gubernur perjanjian. {kutip:tarikh-khulafa-minhaj-1434 hal. 628-630}."
