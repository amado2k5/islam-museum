label: { ar: "مسير ناصر الدولة إلى بغداد وهزيمته" }
summary:
  ar: "في سنة خمس وثلاثين وثلاثمائة جاء ناصر الدولة بن حمدان إلى بغداد يخاصم عن الخليفة المطيع الذي حصره معز الدولة ووكّل به، فحارب معز الدولة فعبر إلى الجانب الشرقي ولكه في أول يوم من المحرم فانهزم ناصر الدولة، ونهب الديلم باب الطاق وسوق يحيى وقتل من العامة جماعة، وخرج نساء وصبيان من بغداد هاربين في طريق عكبرا وقد وقع للناس أن الديلم إذا ملكوا الشرقية وضعوا السيف تشفيًا من العوام الذين كانوا يشتمون معز الدولة، فاستعمل معز الدولة الحلم ومنع من القتل، وهلك في طريق عكبرا من الحر والعطش خلق كثير لأنهم خرجوا مشاة حفاة {cite:muntazam-ibn-al-jawzi p. 646-647}."
  en: "In 335 Nasir al-Dawla ibn Hamdan came to Baghdad championing the besieged al-Muti'; Mu'izz al-Dawla crossed east and struck him on the first of Muharram — the Daylamis looted Bab al-Taq and Suq Yahya, the mob fled barefoot toward Ukbara where many died of heat and thirst, while Mu'izz forbore and forbade the killing {cite:muntazam-ibn-al-jawzi p. 646-647}."
