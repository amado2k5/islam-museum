summary:
  ar: المقر الرئيسي والاجتماع السنوي لجماعة التبليغ قرب لاهور — مئات الآلاف يجتمعون لأيام في أكبر تجمع دعوي باكستاني.
  en: The Tablighi Jamaat's headquarters and annual gathering near Lahore — hundreds of thousands meet for days of preaching.
  es: "La sede central y la reunión anual de Tablighi Jamaat cerca de Lahore: cientos de miles de personas se reúnen durante días para escuchar sermones."
  fr: "Le siège de la Tablighi Jamaat et son rassemblement annuel se tiennent près de Lahore — des centaines de milliers de personnes s'y réunissent pendant plusieurs jours pour prêcher."
  ur: "تبلیغی جماعت کا ہیڈکوارٹر اور لاہور کے قریب سالانہ اجتماع — لاکھوں لوگ تبلیغ کے دنوں کے لیے جمع ہوتے ہیں۔"
  tr: "Lahore yakınlarındaki Tablighi Jamaat'ın genel merkezi ve yıllık toplantısı; Pakistan'ın en büyük misyonerlik buluşmasında yüz binlerce kişi günlerce bir araya geliyor."
  id: "Markas besar dan pertemuan tahunan Tablighi Jamaat di dekat Lahore — ratusan ribu orang berkumpul selama berhari-hari dalam pertemuan misionaris terbesar di Pakistan."
