tags: [wasaya-browser, wasaya-prophets, wasaya-marqad, wasaya-ihtidar]
label: { en: "The farewell prayer over the martyrs of Uhud", ar: "زيارة شهداء أحد الأخيرة", es: "La oración de despedida por los mártires de Uhud", fr: "La prière d'adieu pour les martyrs d'Uhud", ur: "احد کے شہداء پر الوداعی دعا", tr: "Geçtiğimiz günlerde Uhud şehitlerini ziyaret ettim.", id: "Mengunjungi para syuhada Uhud terakhir" }
summary:
  en: "In early Safar 11 AH the Prophet went out to Uhud and prayed over the martyrs 'as one bidding farewell to the living and the dead', then said from the minbar that he was their forerunner, that he could see his Basin, and that he feared not polytheism for them but rivalry over the world."
  ar: "خرج النبي في أوائل صفر سنة 11هـ إلى أحد فصلى على الشهداء كالمودّع للأحياء والأموات، ثم قال من المنبر: إني فرطكم وشهيد عليكم وإني لأنظر إلى حوضي الآن، وإني والله ما أخاف أن تشركوا بعدي ولكن أخاف عليكم أن تنافسوا فيها."
  es: "A principios del Safar del año 11 de la Hégira, el Profeta salió a Uhud y oró por los mártires \"como quien se despide de los vivos y de los muertos\", luego dijo desde el minbar que él era su precursor, que podía ver su Cuenca y que no temía el politeísmo para ellos, sino la rivalidad por el mundo."
  fr: "Au début du mois de Safar 11 AH, le Prophète se rendit à Uhud et pria pour les martyrs « comme on fait ses adieux aux vivants et aux morts », puis déclara du haut du minbar qu'il était leur précurseur, qu'il pouvait voir son Bassin et qu'il ne craignait pas pour eux le polythéisme, mais la rivalité pour le monde."
  ur: "صفر 11 ہجری کے اوائل میں نبی احد کے لیے نکلے اور شہداء کے لیے 'زندوں اور مردوں کو الوداع کرتے ہوئے' دعا فرمائی، پھر منبر سے فرمایا کہ وہ ان کا پیش خیمہ ہے، وہ اس کا حوض دیکھ سکتا ہے، اور یہ کہ وہ ان کے لیے شرک سے نہیں بلکہ دنیا کی دشمنی سے ڈرتا ہے۔"
  tr: "Peygamberimiz, Hicri 11. yılın Safer ayının başlarında Uhud'a gitti ve şehitler için, sanki yaşayanlara ve ölenlere veda eder gibi dua etti. Sonra minberden şöyle buyurdu: \"Ben sizin öncünüz ve şahidinizim ve şimdi leğenime bakıyorum. Allah'a yemin ederim ki, benden sonra Allah'a ortak koşmanızdan korkmuyorum, fakat onun için yarışmanızdan korkuyorum.\""
  id: "Nabi Muhammad SAW keluar pada awal bulan Safar tahun 11 Hijriah ke Uhud dan mendoakan para syuhada seolah-olah mengucapkan selamat tinggal kepada yang hidup dan yang mati. Kemudian beliau bersabda dari mimbar: \"Aku adalah pendahulu kalian dan saksi atas kalian, dan sekarang aku sedang melihat bejana milikku. Demi Allah, aku tidak takut kalian akan menyekutukan Allah setelahku, tetapi aku takut kalian akan berlomba-lomba memperebutkannya.\""
