label: { en: "The farewell prayer over the martyrs of Uhud", ar: "زيارة شهداء أحد الأخيرة" }
summary:
  en: "In early Safar 11 AH the Prophet went out to Uhud and prayed over the martyrs 'as one bidding farewell to the living and the dead', then said from the minbar that he was their forerunner, that he could see his Basin, and that he feared not polytheism for them but rivalry over the world."
  ar: "خرج النبي في أوائل صفر سنة 11هـ إلى أحد فصلى على الشهداء كالمودّع للأحياء والأموات، ثم قال من المنبر: إني فرطكم وشهيد عليكم وإني لأنظر إلى حوضي الآن، وإني والله ما أخاف أن تشركوا بعدي ولكن أخاف عليكم أن تنافسوا فيها."
