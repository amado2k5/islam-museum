  ur: "1601 میں Székesfehérvár کے محاصرے کے لیے ڈرافٹ کارڈ، طویل ترک جنگ میں ہیبسبرگ نے عثمانیوں سے شہر پر دوبارہ قبضہ کیا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1601 yılında gerçekleşen Seckshoferwar Kuşatması'nın ön hazırlık kartı; Avusturyalıların Uzun Savaş sırasında şehri Osmanlılardan geri alması; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Kartu pendahuluan Pengepungan Seckshoferwar pada tahun 1601 M, perebutan kembali kota tersebut oleh Austria dari Ottoman dalam Perang Panjang; sumber-sumber di halaman ini belum ditinjau."
