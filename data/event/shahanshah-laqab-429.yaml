id: event/shahanshah-laqab-429
class: event
kind: other
label:
  ar: "فتنة لقب شاهنشاه الأعظم ملك الملوك"
  en: "The Shahanshah laqab controversy"
  es: "La controversia de Shahanshah laqab"
  fr: "La controverse du Shahanshah laqab"
  ur: "شہنشاہ لقب تنازعہ"
  tr: "\"Büyük Şahanshah, Kralların Kralı\" unvanı etrafındaki tartışma"
  id: "Kontroversi seputar gelar Shahanshah Agung, Raja Diraja"
summary:
  ar: "في رمضان سنة تسع وعشرين وأربعمائة استُقرئ في إضافة «شاهنشاه الأعظم ملك الملوك» إلى ألقاب جلال الدولة، فأمر الخليفة بأن يُخطب له بها، فأنكر العامة ورموا الخطيب بالآجر ووقعت فتنة. وكتب الخليفة إلى الفقهاء، فأجاز أبو عبد الله الصيمري الحنفي إطلاقها لجواز تفاضل الملوك، وأجاز أبو الطيب الطبري على قياس «قاضي القضاة»، وكتب التميمي نحو ذلك، وامتنع قاضي القضاة الماوردي من الجواز فانقطع عن خدمة جلال الدولة، ثم استدعاه الملك بكرة يوم العيد على وجل فقال له: إني لأتحقق أنك لو حابيت أحدًا لحابيتني، وما حملك على مخالفتي إلا الدين وقد قرّبك ذلك مني وزاد محلك في قلبي {cite:muntazam-ibn-al-jawzi j.8 p.439-440}."
  en: "In Ramadan 429 the laqabs 'Greatest Shahanshah, King of Kings' were proposed for Jalal al-Dawla and the caliph ordered the khutba with them; the crowd pelted the khatib with bricks and a fitna broke out. The jurists wrote opinions — al-Saymari and Abu'l-Tayyib al-Tabari permitting, al-Mawardi refusing — whereupon Jalal cut him off, then received him warmly on the feast day, telling him that only religion had moved him and that it had raised his standing in the king's heart {cite:muntazam-ibn-al-jawzi j.8 p.439-440}."
  es: "En Ramadán 429, se propusieron los títulos de \"Gran Shahanshah, Rey de Reyes\" para Jalal al-Dawla, y el califa ordenó que se pronunciara el sermón con ellos; la multitud apedreó al khatib y estalló una fitna. Los juristas escribieron opiniones —al-Saymari y Abu'l-Tayyib al-Tabari lo permitieron, al-Mawardi lo rechazó—, tras lo cual Jalal lo interrumpió, pero luego lo recibió calurosamente en el día de la fiesta, diciéndole que solo la religión lo había conmovido y que había elevado su posición en el corazón del rey {cite:muntazam-ibn-al-jawzi j.8 p.439-440}."
  fr: "En Ramadan 429, les laqabs « Plus Grand Shahanshah, Roi des Rois » furent proposés à Jalal al-Dawla, et le calife ordonna que le sermon (khutba) soit prononcé avec ces titres. La foule lança des briques au khatib, provoquant une fitna. Les juristes émit des avis – al-Saymari et Abu'l-Tayyib al-Tabari y consentant, al-Mawardi s'y opposant – après quoi Jalal le fit taire, puis le reçut chaleureusement le jour de la fête, lui disant que seule la religion l'avait touché et qu'elle avait élevé sa place dans le cœur du roi (cit.: muntazam-ibn-al-jawzi j.8 p.439-440)."
  ur: "رمضان 429 میں جلال الدولہ کے لیے لقب 'سب سے بڑا شہنشاہ، بادشاہوں کا بادشاہ' تجویز کیا گیا اور خلیفہ نے ان کے ساتھ خطبہ کا حکم دیا۔ ہجوم نے خطیب پر اینٹ بجا دی اور فتنہ پھوٹ پڑا۔ فقہاء نے رائے لکھی - السامری اور ابو الطیب الطبری نے اجازت دی، الماوردی نے انکار کیا - جس پر جلال نے اسے منقطع کیا، پھر عید کے دن اس کا گرمجوشی سے استقبال کیا، اور بتایا کہ اسے صرف مذہب نے متاثر کیا ہے اور اس نے بادشاہ کے دل میں اس کا مقام بلند کیا ہے۔"
  tr: "Hicri 429 yılının Ramazan ayında, Celaleddin-Devla'nın unvanlarına \"Şahanshah el-A'zam, Kralların Kralı\" eklenmesi meselesi ortaya çıktı. Halife, cuma hutbesinde kullanılmasını emretti, ancak halk buna karşı çıktı ve vaize tuğla fırlatarak karışıklığa neden oldu. Halife, hukukçulara yazdı ve Ebu Abdullah el-Seymari el-Hanefi, kralların unvanları arasında ayrım yapmanın caiz olduğunu savunarak kullanımına izin verdi. Ebu el-Tayyib el-Taberi, \"Baş Yargıç\" örneğine dayanarak buna izin verdi. El-Tamimi de benzer bir şey yazdı. Baş Yargıç el-Mawardi ise buna izin vermeyi reddetti ve bunun üzerine Celaleddin-Devla'nın hizmetinden uzaklaştırıldı. Sonra, bayram sabahı kral onu endişeyle yanına çağırdı ve ona şöyle dedi: \"Eğer birine ayrıcalık gösterecek olsaydın, bu kesinlikle ben olurdum. Bana karşı çıkmana sebep olan tek şey dindir ve bu da seni bana daha da yaklaştırdı ve kalbimdeki yerini sağlamlaştırdı.\""
  id: "Pada bulan Ramadan tahun 429 H, muncul pertanyaan tentang penambahan gelar \"Shahanshah al-A'zam, Raja Diraja\" pada gelar-gelar Jalal al-Dawla. Khalifah memerintahkan agar gelar tersebut digunakan dalam khutbah Jumat, tetapi rakyat jelata keberatan dan melempari penceramah dengan batu bata, menyebabkan keributan. Khalifah menulis surat kepada para ahli hukum, dan Abu Abdullah al-Saymari al-Hanafi mengizinkan penggunaannya, dengan alasan bahwa diperbolehkan untuk membedakan antara gelar-gelar raja. Abu al-Tayyib al-Tabari mengizinkannya, berdasarkan analogi \"Ketua Mahkamah Agung.\" Al-Tamimi menulis sesuatu yang serupa. Ketua Mahkamah Agung, al-Mawardi, menolak untuk mengizinkannya dan kemudian diberhentikan dari pelayanan Jalal al-Dawla. Kemudian, pada pagi hari raya Idul Fitri, raja memanggilnya dengan perasaan cemas dan berkata kepadanya: \"Aku yakin bahwa jika engkau menunjukkan keberpihakan kepada siapa pun, itu pasti kepadaku. Tidak ada yang memaksa engkau untuk menentangku selain agama, dan ini telah mendekatkanmu kepadaku dan meningkatkan kedudukanmu di hatiku.\""
