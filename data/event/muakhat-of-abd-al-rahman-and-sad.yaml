label: { ar: "مؤاخاة عبد الرحمن بن عوف وسعد بن الربيع", en: "The brothering of Abd al-Rahman ibn Awf and Sa'd ibn al-Rabi'", es: "El parentesco entre Abd al-Rahman ibn Awf y Sa'd ibn al-Rabi'", fr: "Le frère d'Abd al-Rahman ibn Awf et de Sa'd ibn al-Rabi'", ur: "عبدالرحمٰن بن عوف اور سعد بن ربیع کا بھائی" }
summary:
  ar: "آخى النبي بين عبد الرحمن بن عوف المهاجري وسعد بن الربيع الأنصاري، فعرض سعد قسمة ماله وإحدى زوجتيه فأبى عبد الرحمن وقال «دلوني على السوق» — أشهر مثال على مؤاخاة المدينة."
  en: "The Prophet paired the emigrant Abd al-Rahman ibn Awf with the Ansari Sa'd ibn al-Rabi'; Sa'd offered half his wealth and one of his two wives, and Abd al-Rahman declined, saying 'show me the way to the market' — the best-known example of the Medinan brothering."
  es: "El Profeta emparejó al emigrante Abd al-Rahman ibn Awf con el ansar Sa'd ibn al-Rabi'; Sa'd ofreció la mitad de su riqueza y una de sus dos esposas, y Abd al-Rahman se negó, diciendo 'muéstrame el camino al mercado', el ejemplo más conocido de la hermandad medinense."
  fr: "Le Prophète a uni l'émigrant Abd al-Rahman ibn Awf à l'Ansari Sa'd ibn al-Rabi'; Sa'd lui a offert la moitié de sa richesse et l'une de ses deux épouses, mais Abd al-Rahman a refusé, disant « montrez-moi le chemin du marché » — l'exemple le plus connu de la fraternité médinoise."
  ur: "نبی نے ہجرت کرنے والے عبدالرحمٰن بن عوف کو انصاری سعد بن الربیع کے ساتھ جوڑا۔ سعد نے اپنی آدھی دولت اور اپنی دو بیویوں میں سے ایک کی پیشکش کی، اور عبدالرحمٰن نے یہ کہتے ہوئے انکار کر دیا کہ 'مجھے بازار کا راستہ دکھاؤ' - یہ مدینہ بھائی چارے کی سب سے مشہور مثال ہے۔"
