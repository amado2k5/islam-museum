id: event/abu-al-aswad-pointing-the-mushaf
class: event
kind: other
label:
  ar: نقط أبي الأسود للمصحف بطلب زياد في البصرة
  en: Abu al-Aswad's pointing of the codex at Ziyad's request in Basra
  fr: "Abu al-Aswad ajoute des points au codex à la demande de Ziyad à Bassora"
  ur: ابو الاسود کا زیاد کی درخواست پر بصرہ میں مصحف پر اعراب لگانا
summary:
  ar: "طلب زياد والي البصرة من أبي الأسود الدؤلي أن يضع للناس علامات يعرفون بها كتاب الله فتباطأ، حتى سمع قارئاً يلحن لحناً يقلب المعنى، فقال: عزّ وجه الله أن يبرأ من رسوله، وأخبر زياداً أنه أجابه إلى ما سأل؛ فجعل الفتحة نقطة فوق الحرف والكسرة نقطة تحته والضمة نقطة بين أجزائه والسكون نقطتين {cite:manahil-irfan-sabt p. 330}."
  en: "Ziyad, governor of Basra, asked Abu al-Aswad al-Du'ali to set marks by which people could know God's Book, and he delayed until he heard a reader make an error that reversed the sense; he said God's face is too exalted to disown His messenger and told Ziyad he had granted his request; he made the fatha a dot above the letter, the kasra a dot below, the damma a dot among its parts and the sukun two dots {cite:manahil-irfan-sabt p. 330}."
  fr: "Ziyad, gouverneur de Bassora, demanda à Abu al-Aswad al-Du'ali de créer des signes permettant de connaître le Livre de Dieu ; celui-ci tarda jusqu’à ce qu’il entendît un lecteur commettre une erreur qui inversait le sens. Il déclara que la face de Dieu était trop exaltée pour désavouer Son messager et dit à Ziyad qu’il accédait à sa demande ; il fit de la fatha un point au-dessus de la lettre, de la kasra un point en dessous, de la damma un point parmi ses éléments et du sukun deux points {cite:manahil-irfan-sabt p. 330}."
  ur: "بصرہ کے والی زیاد نے ابو الاسود دؤلی سے کہا کہ لوگوں کے لیے ایسی علامات بنائیں جن سے وہ اللہ کی کتاب پہچانیں، وہ سستی کرتے رہے یہاں تک کہ انھوں نے ایک قاری کو ایسا لحن کرتے سنا جو معنی الٹ دیتا تھا؛ کہا کہ اللہ کی ذات بلند ہے کہ اپنے رسول سے بری ہو، اور زیاد کو بتایا کہ جو مانگا تھا مان لیا؛ انھوں نے فتحہ حرف کے اوپر نقطہ، کسرہ نیچے نقطہ، ضمہ اجزا کے بیچ نقطہ اور سکون دو نقطے رکھا {cite:manahil-irfan-sabt p. 330}۔"
