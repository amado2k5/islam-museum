id: event/incident-of-the-poisoned-sheep
class: event
kind: other
label: { en: "The Incident of the Poisoned Sheep at Khaybar", ar: "حادثة الشاة المسمومة بخيبر", es: "El incidente de la oveja envenenada en Khaybar", fr: "L'incident du mouton empoisonné à Khaybar", ur: "خیبر میں زہریلی بھیڑ کا واقعہ", tr: "Hayber'deki zehirlenmiş koyun olayı", id: "Insiden peracunan domba di Khaybar" }
summary:
  en: "Following the conquest of Khaybar, Zaynab bint al-Harith (wife of Sallam ibn Mishkam) sent the Prophet a roasted sheep heavily laced with poison; upon chewing a morsel, the Prophet spat it out stating that the bone informed him it was poisoned, while Bishr ibn al-Bara' swallowed a bite and died."
  ar: "إثر تمام فتح خيبر، عمدت زينب بنت الحارث امرأة سلام بن مشكم إلى إهداء شاة مشوية محشوة بالسم للنبي وأكثرت في الذراع؛ فمضغ النبي منها مضغة ثم لفظها وأخبر أن الذراع تنبئه أنها مسمومة، وأكل منها بشر بن البراء فمات."
  es: "Tras la conquista de Khaybar, Zaynab bint al-Harith (esposa de Sallam ibn Mishkam) envió al Profeta un cordero asado con abundante veneno; al masticar un trozo, el Profeta lo escupió diciendo que el hueso le había indicado que estaba envenenado, mientras que Bishr ibn al-Bara' tragó un bocado y murió."
  fr: "Après la conquête de Khaybar, Zaynab bint al-Harith (épouse de Sallam ibn Mishkam) envoya au Prophète un mouton rôti fortement empoisonné; après avoir mâché un morceau, le Prophète le recracha en déclarant que l'os lui avait indiqué qu'il était empoisonné, tandis que Bishr ibn al-Bara' en avala une bouchée et mourut."
  ur: "خیبر کی فتح کے بعد، زینب بنت الحارث کی بیوی) نے نبی کو ایک بھنی ہوئی بکری بھیجی جس میں زہر بھرا ہوا تھا۔ رسول اللہ نے لقمہ چبانے پر تھوک دیا اور فرمایا کہ ہڈی نے بتایا کہ اس میں زہر ہے، بشر بن براء نے ایک لقمہ نگل لیا اور مر گئے۔"
  tr: "Hayber'in tamamen fethinden sonra, Selam bin Mişkam'ın karısı Zeynep bint el-Harith, Peygamberimize zehirle doldurulmuş kızarmış bir koyun sundu ve ön bacağına bolca zehir kattı. Peygamberimiz bir lokma çiğnedi, sonra tükürdü ve ön bacağın kendisine zehirli olduğunu söylediğini belirtti. Bişr bin el-Bara' da ondan biraz yedi ve öldü."
  id: "Setelah penaklukan Khaybar sepenuhnya, Zaynab bint al-Harith, istri Salam bin Mishkam, mempersembahkan kepada Nabi seekor domba panggang yang dijejali racun, dan ia menambahkan banyak racun pada kaki depannya. Nabi mengunyah sedikit, lalu meludahkannya dan berkata bahwa kaki depan itu memberitahunya bahwa ia telah diracuni. Bishr bin al-Bara’ memakan sebagian darinya dan meninggal."
