label: { en: "The Incident of the Poisoned Sheep at Khaybar", ar: "حادثة الشاة المسمومة بخيبر" }
summary:
  en: "Following the conquest of Khaybar, Zaynab bint al-Harith (wife of Sallam ibn Mishkam) sent the Prophet a roasted sheep heavily laced with poison; upon chewing a morsel, the Prophet spat it out stating that the bone informed him it was poisoned, while Bishr ibn al-Bara' swallowed a bite and died."
  ar: "إثر تمام فتح خيبر، عمدت زينب بنت الحارث امرأة سلام بن مشكم إلى إهداء شاة مشوية محشوة بالسم للنبي وأكثرت في الذراع؛ فمضغ النبي منها مضغة ثم لفظها وأخبر أن الذراع تنبئه أنها مسمومة، وأكل منها بشر بن البراء فمات."
