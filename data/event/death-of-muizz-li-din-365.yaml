label: { ar: "وفاة المعز لدين الله وولاية العزيز", en: "Death of al-Mu'izz li-Din Allah and accession of al-Aziz", es: "Muerte de al-Mu'izz li-Din Allah y ascenso de al-Aziz", fr: "Mort d'al-Mu'izz li-Din Allah et accession d'al-Aziz", ur: "المعز ل الدین اللہ کی وفات اور الحاق العزیز", tr: "Al-Mu'izz li-Din Allah'ın ölümü ve Al-Aziz'in tahta çıkışı", id: "Wafatnya Al-Mu'izz li-Din Allah dan naiknya Al-Aziz ke takhta" }
summary:
  ar: "في سنة 365هـ توفي المعز لدين الله أبو تميم معد بن المنصور بمصر سابع عشر ربيع الآخر وعمره خمس وأربعون سنة وستة أشهر تقريباً؛ وكان سبب موته أن ملك الروم بالقسطنطينية أرسل إليه رسولاً فقال له المعز اتذكر إذ أتيتني رسولاً وأنا بالمهدية فقلت لك لتدخلنّ عليّ وأنا بمصر مالكاً لها فقال نعم وقلت لك لتدخلنّ عليّ ببغداد وأنا خليفة، فقال الرسول إنك أمنتني على نفسي فقل لي ما عندك فقال بعثني إليك الملك ذلك العام فرأيت من عظمتك في ميني وكثرة أصحابك ما كدت أموت منه ورأيت على قصرك نوراً عظيماً غطى بحراً فظننتك خالقاً فلو قلت لي إنك تعرج إلى السماء لصدقتك، ثم جئت إليك الآن فما رأيت من ذلك شيئاً وظننت أن ذلك كان أمراً مقبلاً وأنه الآن بضد ما كان عليه، فاغتم المعز وأخذته الحمى لشدة ما وجد واتصل مرضه حتى مات، واستتر ابنه العزيز بموته حتى عيد النصر فصلى بالناس وخطهم ودعا لنفسه وعزى بأبيه، وكان المعز عليلاً فاضلاً جواداً شجاعاً جارياً على منهاج أبيه من حسن السيرة وإنصاف الرعية ويغري بالنجوم ويعمل بأقوال المنجمين وقد عمل سرداباً يحتمي فيه إلى أن يجوز وقت الموت فنزل فيه سنة ثم ظهر وفيّ مديداً ومرض وتوفي، وولي بعده ابنه نزار العزيز بالله وكان يدبر الأمور منذ مرض أبيه {cite:kamil-ibn-al-athir p. 487-488}."
  en: "In Rabi II 365 al-Mu'izz li-Din Allah died in Egypt aged about forty-five. Ibn al-Athir tells the famous cause: a Byzantine envoy recalled al-Mu'izz's prophecy that he would die ruling Egypt and be caliph in Baghdad, then said the majesty he had seen at Mahdiyya had now faded — grief took him, fever followed, and he died. His son Nizar concealed the death till the feast, led prayer as al-Aziz and mourned him publicly {cite:kamil-ibn-al-athir p. 487-488}."
  es: "En Rabi II 365, al-Mu'izz li-Din Allah murió en Egipto a la edad de unos cuarenta y cinco años. Ibn al-Athir relata la famosa causa: un enviado bizantino recordó la profecía de al-Mu'izz de que moriría gobernando Egipto y sería califa en Bagdad, y luego dijo que la majestad que había visto en Mahdiyya se había desvanecido. El dolor lo invadió, le sobrevino la fiebre y murió. Su hijo Nizar ocultó la muerte hasta la festividad, dirigió la oración como al-Aziz y lo lloró públicamente {cite:kamil-ibn-al-athir p. 487-488}."
  fr: "En Rabi II 365, al-Mu'izz li-Din Allah mourut en Égypte, à l'âge d'environ quarante-cinq ans. Ibn al-Athir relate la cause de sa mort: un envoyé byzantin rappela à al-Mu'izz la prophétie selon laquelle il mourrait en régnant sur l'Égypte et deviendrait calife à Bagdad, puis déclara que la majesté qu'il avait perçue lors de la Mahdiyya s'était désormais dissipée. Accablé de chagrin, il fut ensuite atteint de fièvre et mourut. Son fils Nizar dissimula le décès jusqu'à la fête, dirigea la prière sous le nom d'al-Aziz et le pleura publiquement (voir: Kamil Ibn al-Athir, p. 487-488)."
  ur: "ربیع دوم 365 المعز ل الدین اللہ مصر میں تقریباً پینتالیس سال کی عمر میں فوت ہوئے۔ ابن الثیر مشہور وجہ بتاتے ہیں: ایک بازنطینی ایلچی نے المعز کی پیشین گوئی کو یاد کیا کہ وہ مصر پر حکمرانی کرتے ہوئے مرے گا اور بغداد میں خلیفہ بنے گا، پھر کہا کہ اس نے مہدیہ میں جو عظمت دیکھی تھی وہ اب ختم ہو گئی ہے- غم نے اسے لے لیا، بخار آیا، اور وہ مر گیا۔ اس کے بیٹے نزار نے ضیافت تک موت کو چھپایا، العزیز کے طور پر نماز پڑھائی اور عوامی سطح پر اس کا ماتم کیا۔ 487-488}۔"
  tr: "Hicri 365 yılında, Al-Mu'izz li-Din Allah Abu Tamim Ma'ad ibn Al-Mansur, Rebiü'l-Ahir ayının on yedinci gününde, yaklaşık kırk beş yaş altı aylıkken Mısır'da vefat etti. Ölüm sebebi, Konstantinopolis'teki Bizans imparatorunun kendisine bir elçi göndermesiydi. Al-Mu'izz ona, \"Mehdiye'deyken bana elçi olarak geldiğin ve Mısır'da hüküm sürerken bana gireceğini söylediğim zamanı hatırlıyor musun?\" dedi. Elçi, \"Evet\" diye cevap verdi. Ben de ona, Bağdat'ta halife iken bana gireceğini söyledim. Elçi, \"Bana güven verdin, o halde söyleyeceklerini anlat\" dedi. \"O yıl imparator beni size gönderdi ve sarayınızda öyle bir ihtişam ve öyle bir kalabalık gördüm ki, neredeyse ölecektim. Sarayınızın üzerinde denizi kaplayan büyük bir ışık gördüm ve sizin bir yaratıcı olduğunuzu düşündüm. Bana göğe yükseldiğinizi söyleseydiniz, size inanırdım. Şimdi size geldim ve bunların hiçbirini görmedim. Bunun gelecekte olacak bir şey olduğunu düşünmüştüm, şimdi ise tam tersi oldu.\" diye cevap verdi. El-Muizz derinden üzüldü ve duygularının yoğunluğundan dolayı yüksek ateşle hastalandı. Hastalığı ölümüne kadar devam etti. Oğlu El-Aziz, zafer kutlamasına kadar ölümünü gizli tuttu. Daha sonra halkı namaza yönlendirdi, kendisi için bir dua yazdı ve babası için başsağlığı diledi. El-Muizz, babasının izinden giderek, tebaasına karşı iyi davranış ve adalet konusunda erdemli, cömert ve cesur bir adamdı. Astrolojiye meraklıydı ve peygamberlerin sözlerine göre hareket ederdi. Astrolog, ölüm vakti gelene kadar sığınmak için bir mahzen yaptırmıştı. Bir yıl boyunca oraya indi, sonra ortaya çıktı ve uzun süre orada kaldı. Hastalandı ve öldü, yerine oğlu Nizar el-Aziz Billa geçti. Babasının hastalığından beri işleri yönetiyordu. {Kaynak: Kamil İbn el-Atir s. 487-488}"
  id: "Pada tahun 365 H, Al-Mu'izz li-Din Allah Abu Tamim Ma'ad ibn Al-Mansur wafat di Mesir pada tanggal tujuh belas Rabi' al-Akhir, pada usia sekitar empat puluh lima tahun enam bulan. Penyebab kematiannya adalah karena kaisar Bizantium di Konstantinopel mengirim seorang utusan kepadanya. Al-Mu'izz berkata kepadanya, \"Apakah kamu ingat ketika kamu datang kepadaku sebagai utusan ketika aku berada di Mahdia, dan aku mengatakan kepadamu bahwa kamu akan menemuiku ketika aku berada di Mesir, memerintahnya?\" Dia menjawab, \"Ya.\" Dan aku mengatakan kepadanya bahwa dia akan menemuiku di Baghdad ketika aku menjadi Khalifah. Utusan itu berkata, \"Kamu telah memberiku keselamatan, jadi katakan padaku apa yang ingin kamu sampaikan.\" Ia menjawab, \"Kaisar mengutusku kepadamu tahun itu, dan aku melihat kemegahan istanamu dan begitu banyaknya pengikutmu sehingga aku hampir mati karenanya. Aku melihat cahaya besar di atas istanamu yang menutupi lautan, dan aku mengira engkau adalah seorang pencipta. Jika engkau mengatakan kepadaku bahwa engkau telah naik ke surga, aku akan mempercayaimu. Kemudian aku datang kepadamu sekarang, dan aku tidak melihat apa pun dari itu. Aku mengira itu adalah sesuatu yang akan datang, dan sekarang kebalikannya.\" Al-Mu'izz sangat sedih dan jatuh sakit demam karena intensitas perasaannya. Penyakitnya berlanjut hingga ia meninggal. Putranya, Al-'Aziz, merahasiakan kematiannya hingga perayaan kemenangan. Kemudian ia memimpin orang-orang dalam doa, menulis doa untuk dirinya sendiri, dan menyampaikan belasungkawa untuk ayahnya. Al-Mu'izz adalah seorang pria yang berbudi luhur, dermawan, dan pemberani, mengikuti jejak ayahnya dalam perilaku baik dan keadilan terhadap rakyatnya. Ia cenderung pada astrologi dan bertindak sesuai dengan sabda para nabi. Sang ahli astrologi telah membuat ruang bawah tanah untuk berlindung hingga ajal menjemput. Ia masuk ke dalamnya selama setahun, kemudian muncul dan tinggal di sana untuk waktu yang lama. Ia jatuh sakit dan meninggal, dan putranya, Nizar Al-Aziz Billah, menggantikannya. Ia telah mengelola urusan sejak ayahnya sakit. {cite:kamil-ibn-al-athir hlm. 487-488}"
