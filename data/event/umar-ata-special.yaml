summary:
  ar: "روى يزيد بن أبي حبيب أن عمر جعل عمرو بن العاص في مائتين لأنه أمير وعمير بن وهب الجمحي في مائتين لصبره على الضيق وبسر بن أبي أرطاة في مائتين لأنه صاحب فتح وقال رب فتح قد فتحه الله على يده وكتب إلى عمرو أن افرض لمن بايع تحت الشجرة في مائتين من العطاء وأبلغ ذلك لنفسك بأمرتك وافرض لخارجة بن حذافة في شرف العطاء لشجاعته وأعطى عامل له العرب وترك الموالي فكتب إليه عمر أما بعد فيحسب المرء من الشر أن يحقر أخاه المسلم وجعل عطاء عمار بن ياسر ستة آلاف درهم وعطاء سلمان أربعة آلاف وفرض للهرمزان في ألفين فلما وضع عمر الديوان قال أبو سفيان بن حرب أديوان مثل ديوان بني الأصفر إنك إن فرضت للناس اتكلوا على الديوان وتركوا التجارة فقال عمر لا بد من هذا فقد كثر في المسلمين وفرض عمر لدهقان نهر الملك ولابن النخيرتان ولخالد وجميل ابني بسبهر ولسطام بن تريسي دهقان بابل وخطيرنية وللرفيل دهقان العال وللهرمزان ولجيفينة العبادي في ألف ألف ويقال إنه فضل الهرمزان ففرض له ألفين وكتب إلى أمراء الأجناد ومن أعتقتم من الحمراء فأسلموا فألحقوهم بمواليهم لهم ما لهم وعليهم ما عليهم وإن أحبوا أن يكونوا قبيلة وحدهم فاجعلهم أسوة في العطاء وعن أبي عبيدة أن رجالاً من أهل البادية سألوه أن يرزقهم فقال والله لا أرزقكم حتى أرزق أهل الحاضرة وكتب عمر بن عبد العزيز إلى يزيد بن حصين أن مر للجند بالفريضة وعليك بأهل الحاضرة وكان عمر لا يعطي أهل مكة عطاء ولا يبعث بهم بعثاً وقال سعداً فرض لمن قرأ القرآن في ألفين فكتب إليه عمر لا تمط على القرآن أحداً."
  en: "Yazid ibn Abi Habib: Umar set Amr ibn al-As at two hundred as amir, Umayr ibn Wahb al-Jumahi at two hundred for his patience in want, Busr ibn Abi Artat at two hundred as a man of conquest — 'many a conquest God wrought by his hand' — and wrote Amr to set the Tree-pledgers at two hundred, take that himself as amir, and put Kharija ibn Hudhafa in sharaf al-ata' for his courage. A governor who paid Arabs and left mawali got his letter: 'it suffices a man for evil to scorn his Muslim brother'; Ammar ibn Yasir's stipend was six thousand, Salman's four, Hurmuzan's two. When the diwan was laid down Abu Sufyan ibn Harb said 'a diwan like Banu al-Asfar's — pay them and they will lean on it and leave trade'; Umar: 'it must be — the Muslims have grown'. Stipends went to the dahqans too — Nahr al-Malik's, Ibn al-Nukhayrajan, Khalid and Jamil sons of Busubuhri, Sistam ibn Tarisi of Babil and Khutarniya, al-Rufayl of al-Al, and Ju'ayfina al-Abadi at a thousand each — and his letter to the jund-commanders attached every freed Hamra' convert to his mawali 'theirs what is theirs, on them what is on them', or formed them into a tribe equal in stipend. Abu Ubayda refused the badia till the hadara were provided, Umar II wrote the same to Yazid ibn Husayn, and Umar gave Mecca's people no stipend and sent them on no expedition."
  es: "Yazid ibn Abi Habib: Umar fijó a Amr ibn al-As en doscientos como emir, a Umayr ibn Wahb al-Jumahi en doscientos por su paciencia en la necesidad, a Busr ibn Abi Artat en doscientos como hombre de conquista —'muchas conquistas Dios obró por su mano'— y escribió a Amr para fijar a los Juramentados de los Árboles en doscientos, tomarlo él mismo como emir, y poner a Kharija ibn Hudhafa en sharaf al-ata' por su valentía. Un gobernador que pagó a los árabes y dejó mawali recibió su carta: 'basta a un hombre para el mal despreciar a su hermano musulmán'; el estipendio de Ammar ibn Yasir fue de seis mil, el de Salman de cuatro, el de Hurmuzan de dos. Cuando se colocó el diwan Abu Sufyan ibn Harb dijo 'un diwan como el de Banu al-Asfar: páguenles y se apoyarán en él y dejarán el comercio'; Umar: 'Debe ser así: los musulmanes han crecido'. También se dieron estipendios a los dahqans: Nahr al-Malik, Ibn al-Nukhayrajan, Khalid y Jamil hijos de Busubuhri, Sistam ibn Tarisi de Babil y Khutarniya, al-Rufayl de al-Al y Ju'ayfina al-Abadi, a razón de mil cada uno; y su carta a los comandantes jund adjuntó a cada converso liberado de Hamra' a su mawali 'lo que es suyo, sobre ellos lo que les corresponde', o los formó en una tribu con estipendio igualitario. Abu Ubayda rechazó la badia hasta que se proporcionara la hadara, Umar II escribió lo mismo a Yazid ibn Husayn, y Umar no dio estipendio a la gente de La Meca ni los envió a ninguna expedición."
  fr: "Yazid ibn Abi Habib: Umar accorda à Amr ibn al-As la somme de deux cents shillings en tant qu'émir, à Umayr ibn Wahb al-Jumahi la même somme pour sa patience dans le besoin, et à Busr ibn Abi Artat la même somme en tant qu'homme de conquête – « nombreuses conquêtes que Dieu a accomplies par sa main » – et écrivit à Amr de fixer à deux cents shillings les revenus des marchands de l'Arbre, de prendre cette somme pour lui-même en tant qu'émir, et de placer Kharija ibn Hudhafa au sharaf al-ata' pour son courage. Un gouverneur qui payait les Arabes et laissait le mawali reçut sa lettre: « Il suffit à un homme, pour faire le mal, de mépriser son frère musulman »; le salaire d'Ammar ibn Yasir était de six mille shillings, celui de Salman de quatre et celui d'Hurmuzan de deux. Lorsque le diwan fut établi, Abu Sufyan ibn Harb déclara: « Un diwan comme celui des Banu al-Asfar… Payez-les et ils s’appuieront dessus et abandonneront le commerce. » Umar répondit: « Il le faut, les musulmans se sont développés. » Des rentes furent également versées aux dahqans: celles de Nahr al-Malik, d’Ibn al-Nukhayrajan, de Khalid et Jamil, fils de Busubuhri, de Sistam ibn Tarisi, fils de Babil et de Khutarniya, d’al-Rufayl, fils d’al-Al, et de Ju’ayfina al-Abadi, à raison de mille roupies chacune. Dans sa lettre aux commandants des jund, il rattacha chaque Hamra’ affranchi à son mawali (« à eux ce qui leur appartient, à eux ce qui leur appartient ») ou les forma en une tribu à rente égale. Abu Ubayda refusa les badia jusqu'à ce que les hadara soient fournis, Umar II écrivit la même chose à Yazid ibn Husayn, et Umar ne donna aucune allocation aux habitants de La Mecque et ne les envoya en expédition."
  ur: "یزید بن ابی حبیب: عمر نے عمرو بن العاص کو دو سو امیر مقرر کیا، عمیر بن وھب الجماحی کو دو سو پر اس کے صبر کی وجہ سے، بسر بن ابی ارتات کو دو سو پر ایک آدمی فتح کے طور پر - 'بہت سی فتحیں خدا نے اپنے ہاتھ سے کیں' - اور لکھا کہ دو سو پر امیر مقرر کیا، اور خود کو دو سو پر امیر مقرر کیا۔ اور خارجہ بن حذیفہ کو اس کی ہمت کے لیے شرف العطاء میں رکھا۔ ایک گورنر جس نے عربوں کو معاوضہ دیا اور موالی چھوڑ دیا اس کا خط ملا: 'برائی کے لیے یہ کافی ہے کہ وہ اپنے مسلمان بھائی کو طعنہ دے'۔ عمار بن یاسر کا وظیفہ چھ ہزار، سلمان کا چار، ہرمزان کا دو۔ جب دیوان بچھایا گیا تو ابو سفیان بن حرب نے کہا کہ بنو الاصفر جیسا دیوان انہیں ادا کر دو وہ اس پر ٹیک لگا کر تجارت چھوڑ دیں گے۔ عمر: 'یہ ہونا چاہیے - مسلمان بڑھے ہیں'۔ دہقانوں کو بھی وظیفہ دیا جاتا تھا - نہر الملک، ابن النخیرجان، خالد اور جمیل بن بسوبھری، بابل کے سستم بن طاریسی اور خترنیا، الرفیل کے الرفیل، اور جویفینہ العبادی کو ایک ہزار کے حساب سے - اور اس کے ہر ایک خط کو حمرا کے مفت میں تبدیل کر دیا گیا۔ موالی نے 'ان کا جو ان کا ہے، ان پر جو ان پر ہے'، یا انہیں وظیفہ میں برابر کا قبیلہ بنا دیا۔ ابو عبیدہ نے بدیع سے انکار کر دیا یہاں تک کہ حدرہ فراہم کر دیا گیا، عمر ثانی نے یزید ابن حسین کو بھی یہی لکھا اور عمر نے مکہ والوں کو کوئی وظیفہ نہیں دیا اور نہ ہی انہیں کسی مہم پر بھیجا۔"
  tr: "Yezid ibn Ebi Habib rivayet etti ki, Ömer, komutan olduğu için Amr ibn el-As'a iki yüz dirhem, zorluklara karşı sabrı nedeniyle Umeyr ibn Wahb el-Cumahi'ye iki yüz dirhem ve fatih olduğu için Busr ibn Ebi Artat'a iki yüz dirhem maaş verdi ve şöyle dedi: \"Allah onun aracılığıyla birçok fetih nasip etti.\" Amr'a şöyle yazdı: \"Ağaç altında biat edenlere iki yüz dirhem ayır ve bunu kendi emrinle kendine de ver.\" Ayrıca cesareti nedeniyle Harice ibn Hudefe'ye de bir maaş ayırdı ve Arap olan ancak azat edilmemiş valilerinden birine de verdi. Ömer ona şöyle cevap yazdı: \"Bir insanın Müslüman kardeşini hor görmesi kötü sayılır.\" Amr ibn Yasir'in maaşını altı bin dirhem, Salman'ınkini dört bin dirhem olarak belirledi ve el-Hurmuzan'a iki bin dirhem ayırdı. Ömer kayıt defterini kurduğunda, Ebu Sufyan ibn Harb, \"Bizanslılarınki gibi bir kayıt defteri mi? Eğer insanlara maaş dağıtırsanız, onlar kayıt defterine güvenip ticareti bırakırlar\" dedi. Ömer, \"Bu gereklidir, çünkü ticaret Müslümanlar arasında yaygınlaştı\" diye cevap verdi. Ömer ayrıca Nahr el-Malik'in reisine, İbn el-Nukhayratan'a, Basbahr'ın oğulları Halid ve Cemil'e, Babil ve Hatinye reisi Sitam ibn Tarisi'ye, el-Aal reisi el-Rafil'e ve el-Hurmuzan'a maaş dağıttı. Cafena el-Abadi için ise bin bin kişi vardı ve onun el-Hurmuzan'ı tercih ettiği söylenir, bu yüzden ona iki bin kişi ayırdı ve orduların komutanlarına, İslam'a dönen ve kızıllardan kurtardığınız kişilere, efendilerine teslim olmaları için, ellerindekilerle yetinmeleri için mektup yazdı. Eğer kendi başlarına bir kabile olmak istiyorlarsa, onlara verme konusunda örnek olun. Ebu Ubeyde'nin rivayetine göre, çöl halkından bazı kişiler ondan kendilerine rızık vermesini istediler. Bunun üzerine Ömer, \"Allah'a yemin ederim ki, şehir halkına rızık vermeden size rızık vermeyeceğim\" dedi. Ömer bin Abdül Aziz, Yezid bin Hüseyin'e şöyle yazdı: \"Askerlere rızık ödemelerini emret ve sen de şehir halkına rızık ver.\" Ömer, Mekke halkına rızık vermedi ve onları sefere göndermedi. Saad, \"Kur'an okuyan herkese iki bin kişi tahsis edilmiştir\" dedi. Bunun üzerine Ömer ona şöyle yazdı: \"Kur'an okuyan kimseye rızık verme.\""
  id: "Yazid ibn Abi Habib meriwayatkan bahwa Umar memberikan tunjangan sebesar dua ratus dirham kepada Amr ibn al-As karena ia seorang komandan, dan kepada Umayr ibn Wahb al-Jumahi sebesar dua ratus dirham karena kesabarannya dalam kesulitan, dan kepada Busr ibn Abi Artat sebesar dua ratus dirham karena ia seorang penakluk, seraya berkata, \"Banyak penaklukan yang telah Allah berikan melalui dia.\" Beliau menulis kepada Amr, \"Berikan dua ratus dirham kepada mereka yang telah berbaiat di bawah pohon itu, dan perluaslah ini kepada dirimu sendiri atas perintahmu.\" Beliau juga memberikan tunjangan kepada Kharijah ibn Hudhafah atas keberaniannya, dan memberikannya kepada salah satu gubernurnya yang merupakan orang Arab tetapi bukan budak yang telah dibebaskan. Umar membalas suratnya, \"Dianggap sebagai perbuatan jahat jika seseorang menghina saudara Muslimnya.\" Ia menetapkan tunjangan untuk Ammar ibn Yasir sebesar enam ribu dirham, untuk Salman sebesar empat ribu, dan mengalokasikan dua ribu untuk al-Hurmuzan. Ketika Umar membuat daftar tersebut, Abu Sufyan ibn Harb berkata, \"Daftar seperti yang dibuat oleh Bizantium? Jika Anda mengalokasikan tunjangan kepada orang-orang, mereka akan bergantung pada daftar tersebut dan meninggalkan perdagangan.\" Umar menjawab, \"Ini perlu, karena perdagangan telah meluas di kalangan umat Islam.\" Umar juga mengalokasikan tunjangan kepada kepala desa Nahr al-Malik, kepada Ibn al-Nukhayratan, kepada Khalid dan Jamil, putra-putra Basbahr, kepada Sitam ibn Tarisi, kepala desa Babil dan Khatirniyah, kepada al-Rafil, kepala desa al-Aal, dan kepada al-Hurmuzan. Dan untuk Jafina al-Abadi, ada seribu ribu, dan dikatakan bahwa dia lebih menyukai al-Hurmuzan, jadi dia mengalokasikan dua ribu untuknya dan menulis kepada para komandan pasukan, dan mereka yang telah kalian bebaskan dari orang-orang merah yang telah masuk Islam, maka serahkan mereka kepada tuan mereka, mereka memiliki apa yang mereka miliki dan mereka memiliki apa yang mereka miliki. Dan jika mereka ingin menjadi suku sendiri, maka jadikan mereka contoh dalam memberi. Dan berdasarkan riwayat Abu Ubaida, bahwa orang-orang dari penduduk gurun meminta kepadanya untuk menyediakan kebutuhan mereka, maka dia berkata, “Demi Allah, aku tidak akan menyediakan kebutuhan kalian sampai aku menyediakan kebutuhan penduduk kota.” Dan Umar bin Abdul Aziz menulis kepada Yazid bin Husayn, “Perintahkan para prajurit untuk membayar tunjangan dan engkau harus membayar penduduk kota.” Dan Umar tidak memberi tunjangan kepada penduduk Mekah dan tidak pula mengirim mereka dalam ekspedisi. Dan Saad berkata, “Alokasi dua ribu diberikan kepada siapa pun yang membaca Al-Qur'an.” Maka Umar menulis kepadanya, “Jangan berikan tunjangan kepada siapa pun yang membaca Al-Qur'an.”"
