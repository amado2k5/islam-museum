label: { ar: "القبض على ابن الفرات وابنه وقتلهما", en: "The arrest and killing of Ibn al-Furat and his son" }
summary:
  ar: "في سنة اثنتي عشرة وثلاثمائة قُبض على الوزير علي بن محمد بن الفرات، وطُلب ابنه، وذكر الطبري أن قادة الجند حرّضوا الغلمان على المطالبة بقتلهما، فأمر المقتدر بقتلهما، وأُلقي برأسيهما في دجلة {cite:tabari-tarikh-abu-al-fadl j.11 p.104} {cite:tabari-tarikh-abu-al-fadl j.11 p.105}. وعند ابن الأثير كان المحسن بن الوزير مختفياً عند عمته أخت الفضل بن جعفر بن الفرات في زي امرأة حتى دلّت عليه امرأة صالحة رأته جاريتها في الدار فأخبرت نصر الحاجب، فأمر المقتدر نازوكاً صاحب الشرطة بإحضاره فعُذّب ليُجيب إلى مصادرة فأبى وقال لا أجمع لكم بين نفسي ومالي، وقال الوزير أبو القاسم لمؤنس وهارون بن غريب ونصر الحاجب انقلوا ابن الفرات إلى دار الخلافة بدل أمواله فإنا لا نأمن على أنفسنا ما داما في الحياة، فقتلهما نازوك ذبحاً كما تذبح الغنم وكان ابن الفرات قد رأى أخاه العباس في النوم يقول له أنت وولدك عندنا يوم الاثنين فقُتل ابنه يوم الاثنين لثلاث عشرة خلت من ربيع الآخر وحُمل رأسه إلى أبيه فارتاع ثم عُرض على السيف فقال ليس إلا السيف راجعوا في أمري فإن عندي أموالاً جمة وجواهر كثيرة فقيل له جلّ الأمر من ذلك، وكان عمر ابن الفرات إحدى وسبعين سنة وعمر ولده ثلاثاً وثلاثين سنة فأمر المقتدر بتغريق رأسيهما، وكان ابن الفرات يقول إن المقتدر يقتلني مصح قوله لأنه كان لا يخاطبه في شيء إلا قال نعم {cite:kamil-ibn-al-athir p. 112-114}"
  en: "In the year 312 the vizier Ali ibn Muhammad ibn al-Furat was arrested and his son was sought. Al-Tabari reports that the army commanders incited the young men to demand that the two be killed, so al-Muqtadir ordered them killed, and their heads were thrown into the Tigris {cite:tabari-tarikh-abu-al-fadl j.11 p.104} {cite:tabari-tarikh-abu-al-fadl j.11 p.105}. According to Ibn al-Athir, al-Muhsin, the vizier's son, had been hiding with his aunt, the sister of al-Fadl ibn Ja'far ibn al-Furat, dressed as a woman, until a righteous woman whose maidservant had seen him in the house pointed him out to Nasr the chamberlain. Al-Muqtadir ordered Nazuk, the chief of police, to bring him; he was tortured to make him agree to a confiscation, but he refused, saying: «I will not let you combine myself and my wealth against me». The vizier Abu al-Qasim told Mu'nis, Harun ibn Gharib and Nasr the chamberlain to move Ibn al-Furat to the caliphal palace instead of having his wealth extracted, since they could not feel safe while the two of them lived. Nazuk slaughtered them both like sheep. Ibn al-Furat had seen his brother al-Abbas in a dream saying to him: «You and your son are with us on Monday». His son was killed on Monday, thirteen days into Rabi' al-Akhir, and his head was carried to his father, who was alarmed; he was then presented to the sword and said: «Nothing but the sword. Reconsider my case, for I have great wealth and many jewels»; he was told: «The matter is far beyond that». Ibn al-Furat was seventy-one years old and his son thirty-three; al-Muqtadir ordered their heads drowned. Ibn al-Furat used to say that al-Muqtadir would kill him, and his words came true, for the caliph used to answer him with «yes» whenever he spoke to him on any matter {cite:kamil-ibn-al-athir p. 112-114}"
