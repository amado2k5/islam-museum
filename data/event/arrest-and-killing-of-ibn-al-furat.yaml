id: event/arrest-and-killing-of-ibn-al-furat
class: event
kind: death
label: { ar: "القبض على ابن الفرات وابنه وقتلهما", en: "The arrest and killing of Ibn al-Furat and his son", es: "El arresto y asesinato de Ibn al-Furat y su hijo.", fr: "L'arrestation et le meurtre d'Ibn al-Furat et de son fils", ur: "ابن الفرات اور اس کے بیٹے کی گرفتاری اور قتل", tr: "İbn el-Furat ve oğlu tutuklanıp öldürüldüler.", id: "Ibn al-Furat dan putranya ditangkap dan dibunuh." }
summary:
  ar: "في سنة اثنتي عشرة وثلاثمائة قُبض على الوزير علي بن محمد بن الفرات، وطُلب ابنه، وذكر الطبري أن قادة الجند حرّضوا الغلمان على المطالبة بقتلهما، فأمر المقتدر بقتلهما، وأُلقي برأسيهما في دجلة {cite:tabari-tarikh-abu-al-fadl j.11 p.104} {cite:tabari-tarikh-abu-al-fadl j.11 p.105}. وعند ابن الأثير كان المحسن بن الوزير مختفياً عند عمته أخت الفضل بن جعفر بن الفرات في زي امرأة حتى دلّت عليه امرأة صالحة رأته جاريتها في الدار فأخبرت نصر الحاجب، فأمر المقتدر نازوكاً صاحب الشرطة بإحضاره فعُذّب ليُجيب إلى مصادرة فأبى وقال لا أجمع لكم بين نفسي ومالي، وقال الوزير أبو القاسم لمؤنس وهارون بن غريب ونصر الحاجب انقلوا ابن الفرات إلى دار الخلافة بدل أمواله فإنا لا نأمن على أنفسنا ما داما في الحياة، فقتلهما نازوك ذبحاً كما تذبح الغنم وكان ابن الفرات قد رأى أخاه العباس في النوم يقول له أنت وولدك عندنا يوم الاثنين فقُتل ابنه يوم الاثنين لثلاث عشرة خلت من ربيع الآخر وحُمل رأسه إلى أبيه فارتاع ثم عُرض على السيف فقال ليس إلا السيف راجعوا في أمري فإن عندي أموالاً جمة وجواهر كثيرة فقيل له جلّ الأمر من ذلك، وكان عمر ابن الفرات إحدى وسبعين سنة وعمر ولده ثلاثاً وثلاثين سنة فأمر المقتدر بتغريق رأسيهما، وكان ابن الفرات يقول إن المقتدر يقتلني مصح قوله لأنه كان لا يخاطبه في شيء إلا قال نعم {cite:kamil-ibn-al-athir p. 112-114}"
  en: "In the year 312 the vizier Ali ibn Muhammad ibn al-Furat was arrested and his son was sought. Al-Tabari reports that the army commanders incited the young men to demand that the two be killed, so al-Muqtadir ordered them killed, and their heads were thrown into the Tigris {cite:tabari-tarikh-abu-al-fadl j.11 p.104} {cite:tabari-tarikh-abu-al-fadl j.11 p.105}. According to Ibn al-Athir, al-Muhsin, the vizier's son, had been hiding with his aunt, the sister of al-Fadl ibn Ja'far ibn al-Furat, dressed as a woman, until a righteous woman whose maidservant had seen him in the house pointed him out to Nasr the chamberlain. Al-Muqtadir ordered Nazuk, the chief of police, to bring him; he was tortured to make him agree to a confiscation, but he refused, saying: «I will not let you combine myself and my wealth against me». The vizier Abu al-Qasim told Mu'nis, Harun ibn Gharib and Nasr the chamberlain to move Ibn al-Furat to the caliphal palace instead of having his wealth extracted, since they could not feel safe while the two of them lived. Nazuk slaughtered them both like sheep. Ibn al-Furat had seen his brother al-Abbas in a dream saying to him: «You and your son are with us on Monday». His son was killed on Monday, thirteen days into Rabi' al-Akhir, and his head was carried to his father, who was alarmed; he was then presented to the sword and said: «Nothing but the sword. Reconsider my case, for I have great wealth and many jewels»; he was told: «The matter is far beyond that». Ibn al-Furat was seventy-one years old and his son thirty-three; al-Muqtadir ordered their heads drowned. Ibn al-Furat used to say that al-Muqtadir would kill him, and his words came true, for the caliph used to answer him with «yes» whenever he spoke to him on any matter {cite:kamil-ibn-al-athir p. 112-114}"
  es: "En el año 312, el visir Ali ibn Muhammad ibn al-Furat fue arrestado y se buscó a su hijo. Al-Tabari informa que los comandantes del ejército incitaron a los jóvenes a exigir que los dos fueran asesinados, por lo que al-Muqtadir ordenó que los mataran y sus cabezas fueron arrojadas al Tigris {cite:tabari-tarikh-abu-al-fadl j.11 p.104} {cite:tabari-tarikh-abu-al-fadl j.11 p.105}. Según Ibn al-Athir, al-Muhsin, el hijo del visir, se había estado escondiendo con su tía, la hermana de al-Fadl ibn Ja'far ibn al-Furat, vestido de mujer, hasta que una mujer justa cuya criada lo había visto en la casa lo señaló a Nasr el chambelán. Al-Muqtadir ordenó a Nazuk, el jefe de policía, que lo trajera; Fue torturado para que aceptara una confiscación, pero se negó, diciendo: «No permitiré que me unan a mí y a mi riqueza en mi contra». El visir Abu al-Qasim les dijo a Mu'nis, Harun ibn Gharib y al chambelán Nasr que trasladaran a Ibn al-Furat al palacio del califa en lugar de extraerle su riqueza, ya que no se sentirían seguros mientras los dos vivieran. Nazuk los masacró a ambos como ovejas. Ibn al-Furat había visto a su hermano al-Abbas en un sueño diciéndole: «Tú y tu hijo estarán con nosotros el lunes». Su hijo fue asesinado el lunes, trece días después de Rabi' al-Akhir, y su cabeza fue llevada a su padre, quien se alarmó; luego fue presentado a la espada y dijo: «Nada más que la espada. Reconsideren mi caso, pues tengo gran riqueza y muchas joyas»; le dijeron: «El asunto es mucho más complejo». Ibn al-Furat tenía setenta y un años y su hijo treinta y tres; Al-Muqtadir ordenó que los ahogaran. Ibn al-Furat solía decir que Al-Muqtadir lo mataría, y sus palabras se cumplieron, pues el califa siempre le respondía «sí» cuando le hablaba de cualquier asunto. {cita:kamil-ibn-al-athir págs. 112-114}"
  fr: "En 312, le vizir Ali ibn Muhammad ibn al-Furat fut arrêté et son fils recherché. Al-Tabari rapporte que les commandants de l'armée incitèrent les jeunes gens à réclamer leur mort. Al-Muqtadir ordonna alors leur exécution et leurs têtes furent jetées dans le Tigre. Selon Ibn al-Athir, al-Muhsin, le fils du vizir, se cachait chez sa tante, sœur d'al-Fadl ibn Ja'far ibn al-Furat, déguisé en femme, jusqu'à ce qu'une femme vertueuse, dont la servante l'avait aperçu dans la maison, le désigne à Nasr, le chambellan. Al-Muqtadir ordonna alors à Nazuk, chef de la police, de le ramener. Il fut torturé pour le contraindre à accepter une confiscation, mais il refusa, déclarant: « Je ne vous laisserai pas unir mes biens contre moi. » Le vizir Abu al-Qasim ordonna à Mu'nis, Harun ibn Gharib et au chambellan Nasr de transférer Ibn al-Furat au palais califal plutôt que de voir ses biens confisqués, car ils ne se sentaient pas en sécurité tant qu'ils vivaient tous deux. Nazuk les fit massacrer comme des moutons. Ibn al-Furat avait vu son frère al-Abbas en rêve lui dire: « Toi et ton fils serez avec nous lundi. » Son fils fut tué le lundi, treizième jour de Rabi' al-Akhir, et sa tête fut portée à son père, qui fut alarmé; on le présenta alors à l'épée et il dit: « Rien que l'épée. Reconsidérez mon cas, car je possède de grandes richesses et de nombreux joyaux. » On lui répondit: « L'affaire est bien plus complexe. » Ibn al-Furat avait soixante et onze ans et son fils trente-trois. Al-Muqtadir ordonna qu'on les noie. Ibn al-Furat disait qu'al-Muqtadir le tuerait, et ses paroles se réalisèrent, car le calife lui répondait toujours par « oui » lorsqu'il s'adressait à lui, quel que soit le sujet abordé. {cite:kamil-ibn-al-athir p. 112-114}"
  ur: "312 میں وزیر علی ابن محمد بن الفرات کو گرفتار کر کے اس کے بیٹے کی تلاش کی گئی۔ الطبری نے بیان کیا ہے کہ فوجی کمانڈروں نے جوانوں کو ان دونوں کو قتل کرنے کا مطالبہ کرنے پر اکسایا، چنانچہ مقتدیر نے انہیں قتل کرنے کا حکم دیا، اور ان کے سر دجلہ میں پھینک دیے گئے۔ ابن اثیر کے مطابق، وزیر کا بیٹا المحسن، اپنی خالہ، الفضل بن جعفر بن الفرات کی بہن کے ساتھ، عورت کا لباس پہنے چھپا ہوا تھا، یہاں تک کہ ایک صالح عورت جس کی لونڈی نے اسے گھر میں دیکھا تھا، اسے نصر چیمبرلی کی طرف اشارہ کیا۔ المقتدر نے پولیس کے سربراہ نازوک کو حکم دیا کہ وہ اسے لے آئے۔ اسے ضبط کرنے پر راضی کرنے کے لیے اسے تشدد کا نشانہ بنایا گیا، لیکن اس نے یہ کہتے ہوئے انکار کر دیا: \"میں تمہیں اپنے اور اپنے مال کو اپنے خلاف جمع نہیں ہونے دوں گا۔\" وزیر ابو القاسم نے معنیس، ہارون بن غریب اور نصر چیمبرلین سے کہا کہ ابن الفرات کو اس کی دولت نکالنے کے بجائے خلیفہ کے محل میں لے جائیں، کیونکہ وہ دونوں زندہ رہتے ہوئے محفوظ محسوس نہیں کر سکتے تھے۔ نازوک نے ان دونوں کو بھیڑ بکریوں کی طرح ذبح کر دیا۔ ابن الفرات نے خواب میں اپنے بھائی العباس کو دیکھا کہ ان سے کہہ رہے ہیں: \"تم اور تمہارا بیٹا پیر کے دن ہمارے ساتھ ہو\"۔ اس کے بیٹے کو سوموار کو، تیرہ ربیع الآخر میں قتل کر دیا گیا، اور اس کا سر اس کے والد کے پاس لے جایا گیا، جو گھبرا گیا تھا۔ پھر اسے تلوار کے سامنے پیش کیا گیا اور کہا: تلوار کے سوا کچھ نہیں۔ میرے معاملے پر نظر ثانی کرو، کیونکہ میرے پاس بہت زیادہ دولت اور بہت سے جواہرات ہیں۔ اس سے کہا گیا: ’’معاملہ اس سے بہت آگے ہے‘‘۔ ابن الفرات اکہتر سال کے تھے اور ان کا بیٹا تینتیس سال کا تھا۔ مقتدیر نے ان کے سروں کو غرق کرنے کا حکم دیا۔ ابن الفرات کہتے تھے کہ مقتدیر اسے قتل کر دے گا، اور اس کی بات سچ ثابت ہوئی، کیونکہ خلیفہ جب بھی اس سے کسی معاملے میں بات کرتا تھا تو اسے \"ہاں\" میں جواب دیتا تھا۔ 112-114}"
  tr: "Hicri 312 yılında, vezir Ali bin Muhammed bin el-Furat tutuklandı ve oğlu aranmaya başlandı. Taberi, ordu komutanlarının oğlanları öldürülmelerini istemeye kışkırttığını, bunun üzerine Muktadir'in öldürülmelerini emrettiğini ve başlarının Dicle'ye atıldığını belirtmiştir. {cite:tabari-tarikh-abu-al-fadl j.11 p.104} {cite:tabari-tarikh-abu-al-fadl j.11 p.105}. İbn el-Athir'e göre, Muhsin ibn el-Vazir, el-Fadl ibn Cafer ibn el-Furat'ın kız kardeşi olan teyzesinin evinde kadın kılığına girerek saklanıyordu. Hizmetçisi onu evde gören dindar bir kadın onu ele verdi ve Nasr el-Hajib'e haber verdi. Muktadir, polis şefi Nazuk'a onu getirmesini emretti. Mallarına el konulmasına razı olması için işkence gördü, ancak \"Hem canımı hem de malımı size vermeyeceğim\" diyerek reddetti. Vezir Ebu el-Kâsım, Mu'nis, Harun ibn Garib ve Nasr el-Hacib'e, \"İbn el-Furat'ı malı karşılığında halifenin sarayına götürün, çünkü onlar hayatta olduğu sürece kendimizi güvende hissedemeyiz\" dedi. Bunun üzerine Nazuk ikisini de koyun gibi kesti. İbn el-Furat rüyasında kardeşi el-Abbas'ı görmüş ve ona, \"Sen ve oğlun Pazartesi günü bizimle olacaksınız\" demişti. Oğlu Pazartesi günü, Rebiü'l-Sani ayının on üçüncü günü öldürüldü ve başı babasına getirildi; babası çok korkmuştu. Sonra, kendisine kılıç gösterildiğinde, \"Kılıçtan başka bir şey yok. Durumumu yeniden değerlendirin, çünkü bolca servetim ve mücevherlerim var\" dedi. Ona, \"Mesele bundan daha ciddi\" denildi. İbn el-Furat yetmiş bir yaşındaydı ve oğlu otuz üç yaşındaydı. Bunun üzerine Muktadir, başlarını suya batırarak öldürmelerini emretti ve İbn el-Furat, Muktadir'in kendisini öldüreceğini söylerdi ve bu sözü doğruydu çünkü ona hiçbir konuda hitap etmezdi, sadece \"evet\" derdi. {kaynak: Kamil İbn el-Atir s. 112-114}"
  id: "Pada tahun 312 H, menteri Ali bin Muhammad bin Al-Furat ditangkap, dan putranya dicari. Al-Tabari menyebutkan bahwa para komandan tentara menghasut anak-anak itu untuk meminta pembunuhan mereka, sehingga Al-Muqtadir memerintahkan pembunuhan mereka, dan kepala mereka dilemparkan ke Sungai Tigris. {cite:tabari-tarikh-abu-al-fadl j.11 p.104} {cite:tabari-tarikh-abu-al-fadl j.11 p.105}. Menurut Ibn al-Athir, al-Muhsin ibn al-Wazir bersembunyi di rumah bibinya, saudara perempuan al-Fadl ibn Ja'far ibn al-Furat, dengan menyamar sebagai wanita. Seorang wanita saleh, yang pembantunya telah melihatnya di rumah, mengkhianatinya dan memberi tahu Nasr al-Hajib. Al-Muqtadir memerintahkan Nazuk, kepala polisi, untuk membawanya. Ia disiksa untuk memaksanya menyetujui penyitaan hartanya, tetapi ia menolak, dengan mengatakan, \"Aku tidak akan memberikan nyawaku dan hartaku kepada kalian.\" Wazir, Abu al-Qasim, berkata kepada Mu'nis, Harun ibn Gharib, dan Nasr al-Hajib, \"Pindahkan Ibn al-Furat ke istana Khalifah sebagai ganti hartanya, karena kita tidak dapat merasa aman selama mereka masih hidup.\" Nazuk kemudian menyembelih mereka berdua seperti domba. Ibn al-Furat telah melihat saudaranya al-'Abbas dalam mimpi, yang mengatakan kepadanya, \"Kau dan putramu akan bersama kami pada hari Senin.\" Putranya dibunuh pada hari Senin, tanggal tiga belas Rabi' al-Thani, dan kepalanya dibawa kepada ayahnya, yang ketakutan. Kemudian, ketika dihadapkan dengan pedang, ia berkata, \"Tidak ada apa pun selain pedang. Pertimbangkan kembali kasusku, karena aku memiliki banyak harta dan banyak permata.\" Ia diberitahu, \"Masalahnya lebih serius dari itu.\" Ibn al-Furat berumur tujuh puluh satu tahun, dan putranya berumur tiga puluh tiga tahun. Al-Muqtadir kemudian memerintahkan untuk menenggelamkan kepala mereka, dan Ibn al-Furat biasa mengatakan bahwa al-Muqtadir akan membunuhnya, dan pernyataannya benar karena ia tidak akan berbicara kepadanya tentang apa pun kecuali bahwa ia akan mengatakan ya. {cite:kamil-ibn-al-athir p. 112-114}"
