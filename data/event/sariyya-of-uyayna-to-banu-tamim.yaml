id: event/sariyya-of-uyayna-to-banu-tamim
class: event
kind: raid
label: { en: "Uyayna ibn Hisn's raid on Banu Tamim", ar: "سرية عيينة بن حصن الفزاري إلى بني تميم" }
summary:
  en: "In Muharram 9 AH the Prophet sent Uyayna ibn Hisn al-Fazari with fifty horsemen — none Muhajirun or Ansar — against Banu Tamim, who had been inciting tribes and withholding jizya; he surprised them in the desert and took eleven men, twenty-one women and thirty children to Medina, where ten of their chiefs came for the famous oratory and poetry contest; al-Aqra' ibn Habis declared the Muslims' orator and poet superior, they accepted Islam, and their families were returned."
  ar: "بعث النبي عيينة بن حصن الفزاري في المحرم سنة 9هـ في خمسين فارساً ليس فيهم مهاجري ولا أنصاري إلى بني تميم وقد أغروا القبائل ومنعوهم أداء الجزية؛ فهجم عليهم في الصحراء فأخذ أحد عشر رجلاً وإحدى وعشرين امرأة وثلاثين صبياً وأنزلهم دار رملة بنت الحارث؛ وقدم عشرة من رؤسائهم فتفاخر خطيبهم عطارد بن حاجب مع ثابت بن قيس خطيب الإسلام، وأنشد شاعرهم الزبرقان بن بدر فأجابه حسان بن ثابت على البديهة، فقال الأقرع بن حابس: خطيبه أخطب من خطيبنا وشاعره أشعر من شاعرنا، فأسلموا فأجازهم النبي ورد عليهم نساءهم وأبناءهم."
