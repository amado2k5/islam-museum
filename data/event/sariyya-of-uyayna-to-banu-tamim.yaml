id: event/sariyya-of-uyayna-to-banu-tamim
class: event
kind: raid
label: { en: "Uyayna ibn Hisn's raid on Banu Tamim", ar: "سرية عيينة بن حصن الفزاري إلى بني تميم", es: "La incursión de Uyayna ibn Hisn en Banu Tamim", fr: "Raid d'Uyayna ibn Hisn sur Banu Tamim", ur: "عیینہ بن حصین کا بنو تمیم پر حملہ" }
summary:
  en: "In Muharram 9 AH the Prophet sent Uyayna ibn Hisn al-Fazari with fifty horsemen — none Muhajirun or Ansar — against Banu Tamim, who had been inciting tribes and withholding jizya; he surprised them in the desert and took eleven men, twenty-one women and thirty children to Medina, where ten of their chiefs came for the famous oratory and poetry contest; al-Aqra' ibn Habis declared the Muslims' orator and poet superior, they accepted Islam, and their families were returned."
  ar: "بعث النبي عيينة بن حصن الفزاري في المحرم سنة 9هـ في خمسين فارساً ليس فيهم مهاجري ولا أنصاري إلى بني تميم وقد أغروا القبائل ومنعوهم أداء الجزية؛ فهجم عليهم في الصحراء فأخذ أحد عشر رجلاً وإحدى وعشرين امرأة وثلاثين صبياً وأنزلهم دار رملة بنت الحارث؛ وقدم عشرة من رؤسائهم فتفاخر خطيبهم عطارد بن حاجب مع ثابت بن قيس خطيب الإسلام، وأنشد شاعرهم الزبرقان بن بدر فأجابه حسان بن ثابت على البديهة، فقال الأقرع بن حابس: خطيبه أخطب من خطيبنا وشاعره أشعر من شاعرنا، فأسلموا فأجازهم النبي ورد عليهم نساءهم وأبناءهم."
  es: "En Muharram del año 9 de la Hégira, el Profeta envió a Uyayna ibn Hisn al-Fazari con cincuenta jinetes —ninguno de los Muhajirun ni de los Ansar— contra los Banu Tamim, que habían estado incitando a las tribus y reteniendo la jizya; los sorprendió en el desierto y se llevó once hombres, veintiuna mujeres y treinta niños a Medina, donde diez de sus jefes acudieron para el famoso concurso de oratoria y poesía; al-Aqra' ibn Habis declaró superior al orador y poeta de los musulmanes, estos aceptaron el Islam y sus familias regresaron."
  fr: "En Muharram de l'an 9 de l'Hégire, le Prophète envoya Uyayna ibn Hisn al-Fazari avec cinquante cavaliers — aucun Muhajirun ni Ansar — contre les Banu Tamim, qui incitaient les tribus à la révolte et refusaient de payer la jizya; il les surprit dans le désert et emmena onze hommes, vingt et une femmes et trente enfants à Médine, où dix de leurs chefs vinrent pour le célèbre concours d'éloquence et de poésie; al-Aqra' ibn Habis déclara l'orateur et le poète musulmans supérieurs, ils se convertirent à l'islam et leurs familles leur furent rendues."
  ur: "محرم 9 ہجری میں نبی نے عیینہ بن حسن الفزاری کو پچاس گھڑ سواروں کے ساتھ - مہاجرین یا انصار میں سے کوئی نہیں - بنو تمیم کے خلاف بھیجا جو قبائل کو بھڑکا رہے تھے اور جزیہ روک رہے تھے۔ اس نے انہیں صحرا میں حیران کر دیا اور گیارہ مردوں، اکیس عورتوں اور تیس بچوں کو لے کر مدینہ منورہ گیا، جہاں ان کے دس سردار مشہور تقریری اور شاعری کے مقابلے کے لیے آئے۔ اقرع بن حابس نے مسلمانوں کے خطیب اور شاعر کو برتر قرار دیا، انہوں نے اسلام قبول کر لیا، اور ان کے گھر والوں کو واپس کر دیا گیا۔"
