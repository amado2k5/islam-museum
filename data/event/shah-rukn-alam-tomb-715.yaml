label: { ar: "بناء الضريح الكبير للملتان نحو ٧١٥هـ", en: "The great Multan tomb raised about 715" }
summary:
  ar: "نحو سنة ٧١٥هـ/١٣١٥م بُني بالملتان ضريحٌ عظيم قيل إن غياث الدين تغلق أقامه لنفسه، ثم وُهب بعدئذ لضريح شاه ركن العالم على يد فيروز شاه؛ وطابقه السفلي مثمن الجدران — لا مربعاً — بعقود مدببة عند الزوايا، والطوب مزخرف بالنحت وأحزمة خشب الشيشم وألواح خزفية بالفيروزي فقط، وهو خلف مدرسة ملتانية في العمارة قائمة على ثلاث طبقات تحت قبة نصف كروية {cite:encyclopaedia-of-islam-2 vol. 7 p. 604}."
  en: "About 715/1315 the great tomb at Multan was raised, said to have been built by Ghiyath al-Din Tughluq for himself and later devoted to Shah Rukn-i Alam by Firuz Shah; its lower storey is octagonal rather than square, with tapered round buttresses at the angles, the brickwork relieved by carving, shisham-wood string courses and panels set with turquoise ceramics — the mature form of Multan's three-zone tomb under a hemispherical dome {cite:encyclopaedia-of-islam-2 vol. 7 p. 604}."
  ur: "تقریباً 715ھ/1315ء میں ملتان کا عظیم مقبرہ تعمیر ہوا، جس کا کہنا ہے کہ غیاث الدین تغلق نے اپنے لیے بنوایا اور بعد میں فیروز شاہ نے اسے شاہ رکنِ عالم کے لیے وقف کیا؛ اس کا نچلا حصہ مکمل مربع کے بجائے ہشت پہلو ہے، زاویوں پر مخروطی گول محرابیں، اینٹ کا کام تراشیدہ نقش و نگار، شیشم کی پٹیوں اور فیروزی ٹائلوں کی جھلک سے آراستہ — ملتان کے تین زون والے مقبروں کی پختہ صورت {cite:encyclopaedia-of-islam-2 vol. 7 p. 604}۔"
