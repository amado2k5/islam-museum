id: event/al-hadi-is-struck-down-in-the-narrow-pass-and-abu-al-qasim-defends-him-289
class: event
kind: other
label:
  ar: "سقوط الهادي في الموضع الضيق ودفاع ابنه أبي القاسم والطبريين عنه، صفر 289هـ"
  en: "Al-Hadi is struck down in the narrow pass and his son Abu al-Qasim and the Tabaris defend him, Safar 289 AH"
  ur: "تنگ راستے میں ہادی کا گرنا اور ان کے بیٹے ابو القاسم اور طبریوں کا دفاع، صفر 289ھ"
summary:
  ar: "انصرف الهادي بالعسكر من ظبوة فعطفت جماعة من الطبريين فالتحموا في موضع ضيق ورُموا بالنبل والحجارة، فرجع إليهم الهادي ثم أُصيب بحجر في رأسه وسقط مغشياً عليه وجُرح، ودافع عنه ابنه أبو القاسم ورجال من الطبريين، وردّه نفر من أصحابه إلى فرسه، وغسل أبو القاسم وجهه من الدم بعد ذلك."
  en: "Al-Hadi ordered the army back from Zabwa; a party from its rear turned back and fought, entering a narrow place where they were shot at with arrows and stones. Al-Hadi went back to them, was struck on the head by a stone and fell senseless, was wounded, and his son Abu al-Qasim and some of the Tabaris defended him; some companions put him back on his horse, and later his son washed the blood from his face."
  ur: "ہادی نے لشکر کو ظبوہ سے واپس جانے کا حکم دیا؛ پیچھے سے ایک جماعت پلٹ کر لڑنے لگی اور ایک تنگ جگہ میں داخل ہو گئی جہاں ان پر تیروں اور پتھروں کی بوچھاڑ ہوئی۔ ہادی ان کی طرف لوٹے، سر پر پتھر لگا، وہ بے ہوش ہو کر گر پڑے اور زخمی ہوئے؛ ان کے بیٹے ابو القاسم اور کچھ طبریوں نے ان کا دفاع کیا، چند ساتھیوں نے انہیں گھوڑے پر بٹھایا اور بعد میں بیٹے نے ان کے چہرے کا خون دھویا۔"
