summary:
  ar: "بطاقة أولية لحصار وفتح دمشق سنة ١٣هـ/٦٣٤–٦٣٥م، استسلام المدينة لجيوش خالد بن الوليد وأبي عبيدة؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the siege and conquest of Damascus in 13/634–635, the city's surrender to the armies of Khalid ibn al-Walid and Abu Ubayda; its sources are not yet checked on the page."
  es: "Boceto para el asedio y la conquista de Damasco en 13/634–635, la rendición de la ciudad ante los ejércitos de Khalid ibn al-Walid y Abu Ubayda; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour le siège et la conquête de Damas en 13/634–635, la reddition de la ville aux armées de Khalid ibn al-Walid et d'Abu Ubayda; ses sources ne sont pas encore vérifiées sur la page."
  ur: "13/634-635 میں دمشق کے محاصرے اور فتح کے لیے ڈرافٹ کارڈ، خالد بن الولید اور ابو عبیدہ کی فوجوں کے سامنے شہر کا ہتھیار ڈالنا؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Hicri 13/634-635 yıllarında Şam'ın kuşatılması ve fethine, şehrin Halid ibn el-Valid ve Ebu Ubeyde'nin ordularına teslim olmasına dair ön bir anlatım; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang pengepungan dan penaklukan Damaskus pada tahun 13 H/634–635 M, penyerahan kota tersebut kepada pasukan Khalid ibn al-Walid dan Abu Ubaidah; sumber-sumbernya belum ditinjau di halaman ini."
