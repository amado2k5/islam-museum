label: { ar: "حروب الجنيد بالسند", en: "al-Junayd's Sind Wars", es: "Las guerras de Sind de al-Junayd", fr: "Les guerres du Sind d'al-Junayd", ur: "الجنید کی سندھ کی جنگیں", tr: "El-Cüneyd'in Sindh'deki savaşları", id: "Perang Al-Junayd di Sindh" }
summary:
  ar: "ولى الجنيد بن عبد الرحمن ثغر السند من قبل عمر بن هبيرة ثم ولاه إياه هشام فأتى الجنيد لديبل ثم نزل شط مهران فمنعه جيشه العبور وأرسل إليه إني قد أسلمت وولاني الرجل الصالح بلادي ولست آمنك فأعطاه رهناً وأخذ منه رهناً بما على بلاده من الخراج ثم إنهما ترادا الرهن وكفر جيشه وحارب وقيل إنه لم يحارب ولكن الجنيد يجني عليه فأتى الهند فجمع جموعاً وأخذ السفن واستعد للحرب فسار إليه الجنيد في السفن فالتقوا في بطيحة الشرقي فأخذ جيشه أسيراً وقد جنحت سفينته فقتله وهرب صصه بن داهر وهو يريد أن يمضي إلى العراق فيشكو غدر الجنيد فلم يزل الجنيد يؤنسه حتى وضع يده في يده فقتله وغزا الجنيد الكيرج وكانوا قد نقضوا فاتخذ كباشاً نطاحة فصك بها حائط المدينة حتى ثلمها ودخلها عنوة فقتل وسبى وغنم ووجه العمال إلى مرمد والمندل ودهنج وبروص وكان الجنيد يقول القتل في الجزع أكبر منه في الصبر ووجه الجنيد جيشاً إلى أزين ووجه حبيب بن مرة في جيش إلى أرض المالبة فأغاروا على أزين وغزوا بهرمد فحرقوا ربضها وفتح الجنيد البيلمان والجرز وحصل في منزله سوى ما أعطى زواره أربعين ألف ألف وحمل مثلها قال جرير أصبح زوار الجنيد وصحبه يحيون صلت الوجه جماً مواهبه."
  en: "Al-Junayd came to Daybul and the eastern bank; Jaysha, refusing him, sent 'I have converted, the righteous man gave me my lands — I trust you not'. Hostages were exchanged for his country's kharaj, then returned as his people apostatized and fought — some say he never fought but al-Junayd wronged him. Gathering hosts and ships from Hind, he met al-Junayd's fleet at Batiha al-Sharqi, was taken captive, ship fleeing, and killed; Sasa ibn Dahir, fleeing to Iraq to charge al-Junayd's treachery, was cozened into a handclasp and slain. Breached al-Kiraj fell to his battering rams, walls cracked, stormed; agents went to Marmad, al-Mandal, Dahnaj and Barus. 'Killing in panic outweighs patience' he said; his armies raided Uzayn and burned Baharmad's rabad — and al-Baylaman and al-Jarz yielded forty million at home besides his zuwwar's share, as Jarir sang his open-handedness."
  es: "Al-Junayd llegó a Daybul y a la orilla oriental; Jaysha, rechazándolo, envió: «Me he convertido, el hombre justo me dio mis tierras; no confío en ti». Se intercambiaron rehenes por el kharaj de su país, luego se devolvieron cuando su pueblo apostó y luchó; algunos dicen que nunca luchó, pero al-Junayd lo perjudicó. Reuniendo ejércitos y barcos de Hind, se encontró con la flota de al-Junayd en Batiha al-Sharqi, fue hecho prisionero, el barco huyó y fue asesinado; Sasa ibn Dahir, huyendo a Irak para acusar a al-Junayd de traición, fue engañado para que le estrechara la mano y asesinado. Al-Kiraj, quebrantado, cayó ante sus arietes, las murallas se agrietaron, fue asaltado; los agentes fueron a Marmad, al-Mandal, Dahnaj y Barus. «Matar en pánico supera la paciencia», dijo; Sus ejércitos saquearon Uzayn y quemaron el rabad de Baharmad, y al-Baylaman y al-Jarz aportaron cuarenta millones en su tierra, además de la parte que les correspondía por el zuwwar, mientras Jarir cantaba sobre su generosidad."
  fr: "Al-Junayd arriva à Daybul et sur la rive orientale. Jaysha, le refusant, envoya: « Je me suis converti, l'homme juste m'a rendu mes terres – je ne te fais pas confiance. » Des otages furent échangés contre le kharaj de son pays, puis renvoyés tandis que son peuple apostasiait et combattait – certains disent qu'il ne combattit jamais, mais qu'al-Junayd l'avait trahi. Rassemblant des troupes et des navires de Hind, il rencontra la flotte d'al-Junayd à Batiha al-Sharqi, fut fait prisonnier, son navire prit la fuite, et tué. Sasa ibn Dahir, fuyant en Irak pour dénoncer la trahison d'al-Junayd, fut trompé et assassiné. Al-Kiraj, pris d'assaut, tomba sous ses béliers, les murs se fissurèrent, la ville fut prise d'assaut; des agents se rendirent à Marmad, al-Mandal, Dahnaj et Barus. « Tuer dans la panique l'emporte sur la patience », dit-il. Ses armées ont pillé Uzayn et incendié le rabad de Baharmad — et al-Baylaman et al-Jarz ont rapporté quarante millions à la maison en plus de la part de son zuwwar, tandis que Jarir chantait sa générosité."
  ur: "الجنید دیبل اور مشرقی کنارے پر آیا۔ جیشا نے اس سے انکار کرتے ہوئے بھیجا، 'میں تبدیل ہو گیا ہوں، نیک آدمی نے مجھے میری زمینیں دی ہیں - مجھے تم پر بھروسہ نہیں ہے'۔ اس کے ملک کے خاراج کے بدلے یرغمالیوں کا تبادلہ کیا گیا، پھر جب اس کے لوگ مرتد ہو گئے اور لڑے تو واپس آئے - کچھ کہتے ہیں کہ وہ کبھی نہیں لڑا لیکن الجنید نے اس پر ظلم کیا۔ ہند سے میزبانوں اور بحری جہازوں کو اکٹھا کرتے ہوئے، اس کی ملاقات الجنید کے بحری بیڑے سے بطیحہ الشرقی میں ہوئی، اسے اسیر کر لیا گیا، جہاز سے بھاگنا، اور قتل کر دیا گیا۔ ساسہ بن دہر، الجنید کی غداری کا الزام لگانے کے لیے عراق سے فرار ہو گیا، ہاتھ میں بند باندھ کر قتل کر دیا گیا۔ ٹوٹا ہوا الکراج اپنے بلے باز مینڈھوں پر گرا، دیواروں میں شگاف پڑ گیا، طوفان آ گیا۔ ایجنٹ مرمد، المندل، دہنج اور باروس گئے۔ 'گھبراہٹ میں مارنا صبر سے بڑھ جاتا ہے' اس نے کہا۔ اس کی فوجوں نے عزین پر چھاپہ مارا اور بہرمد کے رباد کو جلا دیا - اور البیلام اور الجرز نے اپنے زوار کے حصے کے علاوہ چالیس ملین گھر پر حاصل کیے، جیسا کہ جریر نے کھلے ہاتھ سے گایا۔"
  tr: "Ömer ibn Hubeyra tarafından Sindh sınırına vali olarak atanan Cüneyd ibn Abdülrahman, daha sonra Hişam tarafından tekrar vali olarak atandı. Cüneyd Debal'a gitti, ardından Fırat Nehri kıyılarında kamp kurdu, ancak ordusu onu karşıya geçmekten alıkoydu. Ona haber göndererek, \"İslam'ı kabul ettim ve dürüst bir adam beni ülkemin valisi olarak atadı. Sana güvenmiyorum.\" dedi. Bunun üzerine ona bir rehine verdi ve topraklarından ödenmesi gereken vergi için ondan bir rehine aldı. Sonra rehineleri değiştirdiler ve ordusu dinden döndü ve savaştı. Rivayetlere göre kendisi savaşmadı, aksine Cüneyd ona karşı çatışmayı kışkırttı. Hindistan'a gitti, güç topladı, gemileri ele geçirdi ve savaşa hazırlandı. Cüneyd gemilerle ona karşı yürüdü ve doğu bataklıklarında karşılaştılar. Ordusunu esir aldı ve gemisi karaya oturdu. Onu öldürdü ve Sasa ibn Dahir, el-Cüneyd'in ihanetinden şikayet etmek üzere Irak'a gitmek niyetiyle kaçtı. El-Cüneyd, elini tutana kadar ona eşlik etti, sonra onu öldürdü. Ardından el-Cüneyd, antlaşmalarını bozan Kırgızlara baskın düzenledi. Şehir surlarını yıkmak için koçbaşları kullandı ve surları zorla içeri girerek öldürdü, esir aldı ve ganimet topladı. Marmad, Mandal, Dahnaj ve Burus'a valiler gönderdi. El-Cüneyd, keder içinde ölümün sabır içinde ölümden daha büyük olduğunu söyler. El-Cüneyd, Azin'e bir ordu gönderdi ve Habib bin Murrah'ı bir orduyla El-Maliba topraklarına gönderdi. Azin'e baskın düzenlediler ve Bahramd'ı işgal ederek banliyölerini yaktılar. El-Cüneyd, El-Bilman ve El-Cerz'i fethetti. Evinde, ziyaretçilerine verdiği şeylerin yanı sıra kırk bin tane vardı ve aynı miktarda parayı da yanında taşıyordu. Jarir şöyle dedi: El-Cunaid'in ziyaretçileri ve arkadaşları onu temiz bir yüzle ve bol hediyelerle karşıladılar."
  id: "Al-Junayd ibn Abd al-Rahman diangkat menjadi gubernur perbatasan Sindh oleh Umar ibn Hubayra, dan kemudian Hisham mengangkatnya kembali sebagai gubernur. Al-Junayd pergi ke Debal, lalu berkemah di tepi Sungai Eufrat, tetapi pasukannya mencegahnya menyeberang. Ia mengirim pesan kepadanya, mengatakan, \"Aku telah masuk Islam, dan seorang yang saleh telah mengangkatku sebagai gubernur negeriku. Aku tidak mempercayaimu.\" Maka ia memberikan sandera dan mengambil sandera darinya sebagai ganti upeti yang harus dibayarkan atas tanahnya. Kemudian mereka bertukar sandera, dan pasukannya murtad dan berperang. Dikatakan bahwa ia tidak berperang, tetapi al-Junayd yang menghasut konflik melawannya. Ia pergi ke India, mengumpulkan pasukan, merebut kapal, dan bersiap untuk perang. Al-Junayd berbaris melawannya dengan kapal, dan mereka bertemu di rawa-rawa timur. Ia menawan pasukannya, dan kapalnya kandas. Dia membunuhnya, dan Sasa ibn Dahir melarikan diri, berniat pergi ke Irak untuk mengadu tentang pengkhianatan al-Junayd. Al-Junayd menemaninya sampai dia meletakkan tangannya di tangannya, lalu membunuhnya. Al-Junayd kemudian menyerang Kirgistan, yang telah melanggar perjanjian mereka. Dia menggunakan alat pendobrak untuk menghancurkan tembok kota sampai jebol, dan dia memasukinya dengan paksa, membunuh, menangkap, dan mengambil rampasan perang. Dia mengirim gubernur ke Marmad, Mandal, Dahnaj, dan Burus. Al-Junayd mengatakan bahwa kematian dalam kesedihan lebih besar daripada dalam kesabaran. Al-Junayd mengirim pasukan ke Azin dan mengirim Habib bin Murrah dengan pasukan ke tanah Al-Maliba. Mereka menyerang Azin dan menginvasi Bahramd, membakar pinggirannya. Al-Junayd menaklukkan Al-Bilman dan Al-Jarz. Di rumahnya, selain apa yang dia berikan kepada tamunya, ada empat puluh ribu ribu, dan dia membawa jumlah yang sama. Jarir berkata: Para tamu Al-Junaid dan para sahabatnya menyambutnya dengan wajah berseri-seri dan memberikan hadiah yang berlimpah."
