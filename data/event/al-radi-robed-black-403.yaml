id: event/al-radi-robed-black-403
class: event
kind: other
label: { ar: "خلع السواد على الشريف الرضي بنقابة النقباء", en: "The investiture of al-Sharif al-Radi in black with the headship of the nuqaba'", es: "La inversión de al-Sharif al-Radi en negro con la dirección de la nuqaba'", fr: "L'investissement d'al-Sharif al-Radi dans le noir avec la direction de la nuqaba'", ur: "حجاب کی سربراہی کے ساتھ سیاہ میں الشریف الرادی کی سرمایہ کاری", tr: "Siyah kıyafetler, en büyük suç örgütü tarafından Şerif el-Radi'ye bahşedildi.", id: "Pakaian hitam diberikan kepada Sharif al-Radi oleh Sindikat Sindikat." }
summary:
  ar: "في يوم الجمعة السادس عشر من المحرم سنة ثلاث وأربعمائة قُلد الشريف الرضي أبو الحسن الموسوي نقابة نقباء الطالبيين في سائر الممالك، وورد له عهد بذلك من حضرة بهاء الدولة، وقرئ في دار فخر الملك بحضرته بعد أن جُمع الأكابر من الأشراف والقضاة والعلماء والجند، وخُلعت عليه خلعة سوداء، وهو أول طالبي خُلع عليه السواد في تاريخ الدولة العباسية {cite:muntazam-ibn-al-jawzi j.7 p.260}."
  en: "On Friday 16 Muharram 403 al-Sharif Abu'l-Hasan al-Musawi, al-Radi, was entrusted with the headship of the nuqaba' of the Talibids in all the realms. A patent to that effect came to him from the court of Baha' al-Dawla. It was read in the house of Fakhr al-Mulk in his presence, after the notables among the sharifs, judges, scholars and soldiers had been assembled, and he was robed in a black robe of honour, the first Talibid in the history of the Abbasid state to be so robed {cite:muntazam-ibn-al-jawzi j.7 p.260}."
  es: "El viernes 16 de Muharram del año 403, al-Sharif Abu'l-Hasan al-Musawi, al-Radi, recibió la dirección de la nuqaba' de los talíbidas en todos los reinos. Una patente a tal efecto le llegó de la corte de Baha' al-Dawla. Fue leída en la casa de Fakhr al-Mulk en su presencia, después de que se hubieran reunido los notables entre los sharifs, jueces, eruditos y soldados, y fue revestido con una túnica negra de honor, siendo el primer talíbida en la historia del estado abasí en ser revestido de tal manera {cite:muntazam-ibn-al-jawzi j.7 p.260}."
  fr: "Le vendredi 16 Muharram 403, al-Sharif Abu'l-Hasan al-Musawi, dit al-Radi, fut chargé de la direction de la nuqaba des Talibids dans tous les royaumes. Un acte patent à cet effet lui fut remis par la cour de Baha' al-Dawla. Il fut lu dans la demeure de Fakhr al-Mulk, en sa présence, après que les notables parmi les chérifs, les juges, les érudits et les soldats eurent été réunis. Il fut alors revêtu d'une robe noire d'honneur, devenant ainsi le premier Talibid de l'histoire de l'État abbasside à recevoir cet honneur (cit.: Muntazam ibn al-Jawzi, vol. 7, p. 260)."
  ur: "16 محرم 403 بروز جمعہ الشریف ابوالحسن الموسوی الرادی کو تمام شعبوں میں طالبات کے نقاب کی سربراہی سونپی گئی۔ اس کا ایک پیٹنٹ بہاء الدولہ کے دربار سے اس کے پاس آیا۔ اسے فخر الملک کے گھر میں ان کی موجودگی میں پڑھا گیا، جب شریفوں، ججوں، علماء اور سپاہیوں میں سے معززین کو جمع کیا گیا تھا، اور اسے سیاہ لباس پہنایا گیا تھا، جو عباسی ریاست کی تاریخ کا پہلا طالب تھا جسے اس قدر لباس پہنایا گیا تھا۔"
  tr: "403 yılında, Muharrem ayının on altıncı Cuma günü, Şerif el-Radi Ebu el-Hasan el-Musavi, tüm krallıklardaki Alevilerin başı olarak atandı. Bu yönde bir kararname, Baha' el-Davla'nın huzurunda kendisine verildi ve Fahr el-Mulk'un evinde, soyluların, kadıların, alimlerin ve askerlerin büyüklerinin toplanmasının ardından onun huzurunda okundu. Kendisine siyah bir cübbe verildi ve Abbasi devleti tarihinde siyah cübbe verilen ilk Alevi oldu. {cite:muntazam-ibn-al-jawzi j.7 p.260}"
  id: "Pada hari Jumat, tanggal enam belas Muharram, tahun empat ratus tiga, Sharif al-Radi Abu al-Hasan al-Musawi diangkat menjadi kepala para pemimpin Alawiyah di seluruh kerajaan. Sebuah dekrit untuk itu dikeluarkan kepadanya dari hadapan Baha’ al-Dawla, dan dibacakan di rumah Fakhr al-Mulk di hadapannya setelah para tokoh besar dari kalangan bangsawan, hakim, ulama, dan tentara berkumpul. Sebuah jubah hitam diberikan kepadanya, dan dia adalah Alawiyah pertama yang menerima jubah hitam dalam sejarah negara Abbasiyah. {cite:muntazam-ibn-al-jawzi j.7 p.260}."
