label: { ar: "خلع السواد على الشريف الرضي بنقابة النقباء", en: "The investiture of al-Sharif al-Radi in black with the headship of the nuqaba'" }
summary:
  ar: "في يوم الجمعة السادس عشر من المحرم سنة ثلاث وأربعمائة قُلد الشريف الرضي أبو الحسن الموسوي نقابة نقباء الطالبيين في سائر الممالك، وورد له عهد بذلك من حضرة بهاء الدولة، وقرئ في دار فخر الملك بحضرته بعد أن جُمع الأكابر من الأشراف والقضاة والعلماء والجند، وخُلعت عليه خلعة سوداء، وهو أول طالبي خُلع عليه السواد في تاريخ الدولة العباسية {cite:muntazam-ibn-al-jawzi j.7 p.260}."
  en: "On Friday 16 Muharram 403 al-Sharif Abu'l-Hasan al-Musawi, al-Radi, was entrusted with the headship of the nuqaba' of the Talibids in all the realms. A patent to that effect came to him from the court of Baha' al-Dawla. It was read in the house of Fakhr al-Mulk in his presence, after the notables among the sharifs, judges, scholars and soldiers had been assembled, and he was robed in a black robe of honour, the first Talibid in the history of the Abbasid state to be so robed {cite:muntazam-ibn-al-jawzi j.7 p.260}."
