summary:
  ar: "عند البلاذري: استعمل عبد الله بن الحبحاب مولى بني سلول على إفريقية فأغزى عبد الرحمن بن حبيب بن أبي عبيدة بن عقبة بن نافع الفهري السوس وأرض السودان فظفر ظفراً لم ير أحد مثله قط وأصاب جاريتين من نساء ما هناك ليس للمرأة منهنّ أثداء واحد وهم يسمّون تراجان — وفي حاشية نسخة أنهما من جنس تسمّيه البرْبَرْواجان."
  en: "In al-Baladhuri: Abdallah ibn al-Habhab, mawla of Banu Salul, was employed over Ifriqiya, and he sent raiding Abd al-Rahman ibn Habib ibn Abi Ubayda ibn Uqba ibn Nafi' al-Fihri to Sus and the Sudan lands — he triumphed as none had ever seen, taking among their women two girls each with but a single breast, they being called Tarajan — a copy's margin noting them of a race called al-Barbarwajan."
