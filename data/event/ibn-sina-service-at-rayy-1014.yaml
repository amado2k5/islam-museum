  tr: "MS 1014 civarında İbn Sina, Büveyhi şehzadesi Mecd el-Devle ve annesi Şirin Hanım'a saray hekimi olarak hizmet etmek üzere Rey'e girdi. {cite:wikipedia-avicenna-en}"
  id: "Sekitar tahun 1014 M, Ibnu Sina memasuki Rayy untuk melayani pangeran Buyid Majd al-Dawla dan ibunya, Lady Shirin, sebagai tabib istana. {mengutip:wikipedia-avicenna-en}"
