label: { ar: "القبض على سليمان بن الحسن الوزير وتقليد الكلواذي", en: "The arrest of the vizier Sulayman ibn al-Hasan and the appointment of al-Kalwadhi", fr: "L'arrestation du vizir Sulayman ibn al-Hasan et la nomination d'al-Kalwadhi", es: "El arresto del visir Sulayman ibn al-Hasan y el nombramiento de al-Kalwadhi", ur: "وزیر سلیمان بن الحسن کی گرفتاری اور الکوادی کی تقرری", tr: "Süleyman ibn el-Hasan el-Vezir'in tutuklanması ve el-Kalvadi'nin atanması", id: "Penangkapan Sulayman ibn al-Hasan al-Wazir dan pengangkatan al-Kalwadhi" }
summary:
  ar: "في سنة تسع عشرة وثلاثمائة قُبض على الوزير سليمان بن الحسن، وذكر الطبري أن ضيق المال في أيامه واتصال شغب الجند كانا من أسباب ذلك، وأن الشعراء هجوه، ثم وُلّي أبو القاسم عبيد الله بن محمد الكلواذي الوزارة {cite:tabari-tarikh-abu-al-fadl j.11 p.138}."
  en: "In the year 319 the vizier Sulayman ibn al-Hasan was arrested. Al-Tabari reports that shortage of money in his time and the continuing disorder of the troops were among the causes, and that poets lampooned him. Then Abu al-Qasim Ubayd Allah ibn Muhammad al-Kalwadhi was appointed vizier {cite:tabari-tarikh-abu-al-fadl j.11 p.138}."
  fr: "En l'an 319, le vizir Sulayman ibn al-Hasan fut arrêté. Al-Tabari rapporte que le manque d'argent à son époque et le désordre persistant des troupes comptèrent parmi les causes, et que des poètes le satirisèrent. Abu al-Qasim Ubayd Allah ibn Muhammad al-Kalwadhi fut ensuite nommé vizir {cite:tabari-tarikh-abu-al-fadl j.11 p.138}."
  es: "En el año 319, el visir Sulayman ibn al-Hasan fue arrestado. Al-Tabari relata que la escasez de dinero de la época y el continuo desorden de las tropas fueron algunas de las causas, y que los poetas lo ridiculizaron. Posteriormente, Abu al-Qasim Ubayd Allah ibn Muhammad al-Kalwadhi fue nombrado visir {cite:tabari-tarikh-abu-al-fadl j.11 p.138}."
  ur: "319 میں وزیر سلیمان بن الحسن کو گرفتار کر لیا گیا۔ الطبری نے بیان کیا ہے کہ اس کے زمانے میں پیسوں کی کمی اور فوجوں کی مسلسل خرابی اس کے اسباب میں سے تھے اور شاعروں نے اس کو چراغاں کیا۔ پھر ابو القاسم عبید اللہ ابن محمد الکوادی کو وزیر مقرر کیا گیا۔"
  tr: "Hicri 319 yılında, vezir Süleyman ibn Hasan tutuklandı. Taberi, bunun sebepleri arasında o dönemdeki para kıtlığı ve askerlerin sürekli huzursuzluğunun olduğunu ve şairlerin onu hicvettiğini belirtmiştir. Daha sonra Ebu el-Kâsım Ubeydullah ibn Muhammed el-Kalvedi vezir olarak atandı. {cite:tabari-tarikh-abu-al-fadl j.11 p.138}"
  id: "Pada tahun 319 H, menteri Sulayman ibn al-Hasan ditangkap. Al-Tabari menyebutkan bahwa kelangkaan uang pada masanya dan keresahan terus-menerus di kalangan tentara merupakan beberapa penyebabnya, dan para penyair menyindirnya. Kemudian Abu al-Qasim Ubayd Allah ibn Muhammad al-Kalwadhi diangkat menjadi menteri. {cite:tabari-tarikh-abu-al-fadl j.11 p.138}."
