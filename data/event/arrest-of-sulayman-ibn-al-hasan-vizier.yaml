summary:
  ar: "في سنة تسع عشرة وثلاثمائة قُبض على الوزير سليمان بن الحسن، وذكر الطبري أن ضيق المال في أيامه واتصال شغب الجند كانا من أسباب ذلك، وأن الشعراء هجوه، ثم وُلّي أبو القاسم عبيد الله بن محمد الكلواذي الوزارة {cite:tabari-tarikh-abu-al-fadl j.11 p.138}."
  en: "In the year 319 the vizier Sulayman ibn al-Hasan was arrested. Al-Tabari reports that shortage of money in his time and the continuing disorder of the troops were among the causes, and that poets lampooned him. Then Abu al-Qasim Ubayd Allah ibn Muhammad al-Kalwadhi was appointed vizier {cite:tabari-tarikh-abu-al-fadl j.11 p.138}."
