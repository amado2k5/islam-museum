label: { ar: "كسر الأشرف ملك الروم كيكاووس قرب بزاعة سنة 615هـ", en: "Al-Ashraf defeats Kaykawus of Rum near Buza'a, 615 AH (1218)", ur: "615ھ (1218ء) میں بزاعہ کے قریب اشرف کے ہاتھوں سلطانِ روم کیکاؤس کی شکست" }
summary:
  ar: "في يوم الجمعة ثاني عشر ربيع الآخر سنة 615هـ كسر الملك الأشرف موسى بن العادل ملكَ الروم كيكاووس، بعد أن قصد كيكاووس حلب ومعه الأفضل صاحب سميساط فأخذا رعبان وتل باشر وتقدما إلى منبج، فعاد الأشرف من بلاد الفرنج إلى حلب ونزل باب بزاعة وقدّم العرب بين يديه، فالتقى اليزك باليزك على الساجور فانكسر الروم، واسترد الأشرف رعبان وتل باشر {cite:mirat-al-zaman-risala-2013-v22 p. 227-228}."
  en: "On Friday 12 Rabi' II 615 AH al-Malik al-Ashraf Musa ibn al-Adil defeated Kaykawus, sultan of Rum, who had marched on Aleppo with al-Afdal of Sumaysat, taken Ra'ban and Tell Bashir and advanced to Manbij. Al-Ashraf came back from Frankish territory to Aleppo, camped at Bab Buza'a with the Bedouin in his van, and when the vanguards met on the Sajur the Rum army broke; al-Ashraf recovered Ra'ban and Tell Bashir {cite:mirat-al-zaman-risala-2013-v22 p. 227-228}."
