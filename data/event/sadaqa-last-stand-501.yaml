summary:
  ar: "لما أجرى صدقة بن منصور المزيدي سرخاب بن كيخسرو وامتنع من تسليمه، سار السلطان محمد بن ملك شاه من بغداد آخر رجب سنة 501هـ فلقيه صدقة، وتخاذلت عنه عبادة وخفاجة ورغب الأكراد بالمواعد، فحمل على الترك وهو ينادي «أنا ملك العرب أنا صدقة» فأصابه سهم أثبته وتعلق به غلام تركي يدعى برغش فجذبه إلى الأرض وقتله وحمل رأسه إلى السلطان فأنفذه إلى بغداد، وقتل من أصحابه ثلاثة آلاف أو يزيدون وأسر ابنه دبيس."
  en: "When Sadaqa ibn Mansur sheltered Sarkhab ibn Kaykhusraw and refused to yield him, Sultan Muhammad ibn Malikshah marched from Baghdad at the end of Rajab 501 AH; Ubada and Khafaja deserted Sadaqa and the Kurds took bribes, so he charged the Turks crying 'I am the king of the Arabs, I am Sadaqa' — an arrow transfixed him and a Turkish ghulam named Barghash pulled him down and killed him, his head borne to Baghdad; three thousand or more of his men were killed and his son Dubays captured."
