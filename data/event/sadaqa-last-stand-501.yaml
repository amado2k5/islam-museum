summary:
  ar: "لما أجرى صدقة بن منصور المزيدي سرخاب بن كيخسرو وامتنع من تسليمه، سار السلطان محمد بن ملك شاه من بغداد آخر رجب سنة 501هـ فلقيه صدقة، وتخاذلت عنه عبادة وخفاجة ورغب الأكراد بالمواعد، فحمل على الترك وهو ينادي «أنا ملك العرب أنا صدقة» فأصابه سهم أثبته وتعلق به غلام تركي يدعى برغش فجذبه إلى الأرض وقتله وحمل رأسه إلى السلطان فأنفذه إلى بغداد، وقتل من أصحابه ثلاثة آلاف أو يزيدون وأسر ابنه دبيس."
  en: "When Sadaqa ibn Mansur sheltered Sarkhab ibn Kaykhusraw and refused to yield him, Sultan Muhammad ibn Malikshah marched from Baghdad at the end of Rajab 501 AH; Ubada and Khafaja deserted Sadaqa and the Kurds took bribes, so he charged the Turks crying 'I am the king of the Arabs, I am Sadaqa' — an arrow transfixed him and a Turkish ghulam named Barghash pulled him down and killed him, his head borne to Baghdad; three thousand or more of his men were killed and his son Dubays captured."
  es: "Cuando Sadaqa ibn Mansur dio refugio a Sarkhab ibn Kaykhusraw y se negó a entregarlo, el sultán Muhammad ibn Malikshah marchó desde Bagdad a finales de Rajab del año 501 de la Hégira; Ubada y Khafaja desertaron de Sadaqa y los kurdos aceptaron sobornos, por lo que este cargó contra los turcos gritando \"¡Soy el rey de los árabes, soy Sadaqa!\". Una flecha lo atravesó y un ghulam turco llamado Barghash lo derribó y lo mató; su cabeza fue llevada a Bagdad; tres mil o más de sus hombres murieron y su hijo Dubays fue capturado."
  fr: "Lorsque Sadaqa ibn Mansur a abrité Sarkhab ibn Kaykhusraw et a refusé de le livrer, le sultan Muhammad ibn Malikshah a marché depuis Bagdad à la fin du Rajab 501 AH; Ubada et Khafaja ont déserté Sadaqa et les Kurdes ont accepté des pots-de-vin, alors il a chargé les Turcs en criant « Je suis le roi des Arabes, je suis Sadaqa » — une flèche l'a transpercé et un ghulam turc nommé Barghash l'a abattu et tué, sa tête étant emportée à Bagdad; trois mille ou plus de ses hommes ont été tués et son fils Dubays a été capturé."
  ur: "جب صدقہ بن منصور نے سرخاب بن کیخسرو کو پناہ دی اور اسے دینے سے انکار کر دیا تو سلطان محمد بن مالک شاہ نے رجب 501 ہجری کے آخر میں بغداد سے کوچ کیا۔ عبادہ اور خفاجہ نے صدقہ کو چھوڑ دیا اور کردوں نے رشوت لی، تو اس نے ترکوں پر الزام لگایا کہ 'میں عربوں کا بادشاہ ہوں، میں صدقہ ہوں' - ایک تیر اس پر لگا اور برگاش نامی ترک غلام نے اسے نیچے کھینچ کر مار ڈالا، اس کا سر بغداد لے جایا گیا۔ اس کے تین ہزار یا اس سے زیادہ آدمی مارے گئے اور اس کے بیٹے دبئی کو پکڑ لیا گیا۔"
  tr: "Sadaka bin Mansur el-Mazidi, Sarkhab bin Kaykhusraw'a baskın düzenleyip onu teslim etmeyi reddettiğinde, Sultan Muhammed bin Malik Şah, Hicri 501 yılının Receb ayının sonunda Bağdat'tan yola çıktı. Sadaka onu karşıladı ve Ubadah ile Haface kabileleri onu terk etti, Kürtler ise vaatler bekliyordu. Sadaka, \"Ben Arapların kralıyım, ben Sadaka'yım!\" diye bağırarak Türklere saldırdı. Bir ok ona isabet etti ve onu yerinde sabitledi. Barghash adında bir Türk köle onu yakaladı, yere çekti, öldürdü ve başını Sultan'a götürdü; Sultan da başı Bağdat'a gönderdi. Üç binden fazla arkadaşı öldürüldü ve oğlu Dubays esir alındı."
  id: "Ketika Sadaqah bin Mansour Al-Mazidi melakukan penyerangan terhadap Sarkhab bin Kaykhusraw dan menolak untuk menyerahkannya, Sultan Muhammad bin Malik Shah berbaris dari Baghdad pada akhir bulan Rajab tahun 501 H. Sadaqah menemuinya, dan suku Ubadah dan Khafajah meninggalkannya, dan orang Kurdi sangat menginginkan janji. Ia menyerang orang Turki sambil berteriak, “Akulah raja orang Arab, akulah Sadaqah.” Sebuah panah mengenainya dan membuatnya terpaku di tempat, dan seorang budak Turki bernama Barghash menangkapnya, menariknya ke tanah, membunuhnya, dan membawa kepalanya kepada Sultan, yang kemudian mengirimkannya ke Baghdad. Tiga ribu atau lebih pengikutnya terbunuh, dan putranya Dubays ditangkap."
