  ar: مقتل صدقة المزيدي في حرب السلطان محمد ⁦(501هـ)⁩
  en: Death of Sadaqa al-Mazyadidi fighting Sultan Muhammad (501 AH)
  es: "Muerte de Sadaqa al-Mazyadidi luchando contra el sultán Muhammad (501 AH)"
  fr: "Mort de Sadaqa al-Mazyadidi combattant le sultan Mahomet (501 AH)"
