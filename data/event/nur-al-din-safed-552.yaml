summary:
  ar: "في سنة اثنتين وخمسين وخمسمائة هزم نور الدين الفرنج على صفد وكانت وقعة عظيمة، وأخذ نور الدين من الفرنج غزة وبانياس وملك شيزر من بني منقذ {cite:shadharat-dhahab p. 641}."
  en: "In 552 Nur al-Din routed the Franks at Safed — a great battle — and took Gaza and Banias from the Franks while Shayzar passed to him from the Banu Munqidh {cite:shadharat-dhahab p. 641}."
  es: "En 552, Nur al-Din derrotó a los francos en Safed —una gran batalla— y tomó Gaza y Banias de los francos, mientras que Shayzar pasó a él desde Banu Munqidh {cite:shadharat-dhahab p. 641}."
  fr: "En 552, Nur al-Din mit en déroute les Francs à Safed — une grande bataille — et prit Gaza et Banias aux Francs tandis que Shayzar lui passa des Banu Munqidh {cite:shadharat-dhahab p. 641}."
  ur: "552 میں نورالدین نے صفد کے مقام پر فرینکوں کو شکست دی - ایک عظیم جنگ - اور غزہ اور بنیاس کو فرینکوں سے چھین لیا جب کہ شیزر بنو منقض سے اس کے پاس پہنچا۔ 641}۔"
