label:
  ar: "أبيات للهادي في إكرام الضيف وحماية الجار وفضل الآباء، ختام الرجز، ص310"
  en: "Verses of al-Hadi on honouring the guest, protecting the neighbour and the merit of his forefathers, the end of the rajaz, p. 310"
  ur: "ہادی کے اشعار: مہمان کی تکریم، پڑوسی کی حفاظت اور اجداد کی فضیلت، رجز کا خاتمہ، ص310"
  es: "Versículos de al-Hadi sobre honrar al huésped, proteger al prójimo y el mérito de sus antepasados, el fin del rajaz, pág. 310"
summary:
  ar: "يكمل الرجز في ص310 بقول الشاعر إنه يوقد نار الحرب إن لم تُوقد وإنه يعطي طالب الخير، ثم يصف كرمه: يؤثر ضيفه بفراشه ويكرمه، ولا يبيت له جار عرياناً جائعاً، ويعرض عن عورات جاره، ويفخر بفضل آبائه ويحمد الله."
  en: "The rajaz continues on p. 310 with the poet saying he kindles the fire of war if it is not kindled and gives the seeker of good what he asks, then describing his generosity: he prefers his guest to his own bedding and honours him, no neighbour of his spends the night naked and hungry, he turns from his neighbour's faults, and he glories in his forefathers' merit and praises God."
  ur: "ص310 پر رجز میں شاعر کہتا ہے کہ وہ جنگ کی آگ بھڑکاتا ہے اگر نہ بھڑکائی جائے اور بھلائی کے طالب کو دیتا ہے، پھر اپنی سخاوت بیان کرتا ہے: مہمان کو اپنے بستر پر ترجیح دیتا اور عزت دیتا ہے، اس کا کوئی پڑوسی ننگا اور بھوکا رات نہیں گزارتا، وہ پڑوسی کی عیبوں سے منہ پھیر لیتا ہے، اپنے اجداد کی فضیلت پر فخر کرتا ہے اور اللہ کی حمد کرتا ہے۔"
  es: "El rajaz continúa en la página 310 con el poeta diciendo que enciende el fuego de la guerra si no está encendido y le da al buscador del bien lo que pide, luego describe su generosidad: prefiere a su huésped a su propia cama y lo honra, ningún vecino suyo pasa la noche desnudo y hambriento, se aparta de las faltas de su vecino y se gloría en el mérito de sus antepasados y alaba a Dios."
