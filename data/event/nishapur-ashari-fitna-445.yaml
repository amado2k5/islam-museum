id: event/nishapur-ashari-fitna-445
class: event
kind: persecution
label:
  ar: "فتنة اللعن على المنابر بنيسابور، افتتاح ٤٤٥هـ"
  en: "The pulpit-cursing ordeal opens at Nishapur, 445/1053"
  ur: "نیشاپور میں منبروں پر لعن کی فتنہ کا آغاز، 445ھ/1053ء"
  es: "La prueba de maldición desde el púlpito comienza en Nishapur, 445/1053."
  fr: "L'épreuve de la malédiction de la chaire commence à Nishapur, 445/1053"
  tr: "Hicri 445 yılında başlayan Nişapur'daki minberlerden okunan küfürler tartışması."
  id: "Kontroversi mengenai kutukan dari mimbar-mimbar di Nishapur, dimulai pada tahun 445 Hijriah."
summary:
  ar: "في مفتتح سنة خمس وأربعين وأربعمائة أمر وزير السلطان طغرل بك، عميد الملك أبو نصر منصور الكندري، بلعن المبتدعة على المنابر فاتخذها ذريعة لذكر الأشعرية وقصدهم بالإهانة والمنع من الوعظ والتدريس والعزل عن خطابة الجامع، فطار شرر الفتنة فملأ خراسان والشام والحجاز والعراق {cite:tabaqat-shafiiyya-subki pp. 269-276}."
  en: "At the opening of 445/1053 Sultan Tughril Beg's vizier Amid al-Mulk Abu Nasr Mansur al-Kunduri ordered the cursing of innovators from the pulpits and used it as a pretext to name the Ash'arites, subjecting them to insult, exclusion from preaching and teaching, and removal from the mosque pulpit; the ordeal's sparks spread through Khurasan, Syria, the Hijaz and Iraq {cite:tabaqat-shafiiyya-subki pp. 269-276}."
  ur: "445ھ/1053ء کے آغاز میں سلطان طغرل بیک کے وزیر عمید الملک ابو نصر منصور کندری نے منبروں پر بدعتیوں پر لعن کا حکم دیا اور اسے اشعریوں کے نام لینے کا بہانہ بنایا؛ انھیں اہانت، وعظ و تدریس سے روک اور جامع کے منبر سے عزل کیا گیا؛ فتنے کی چنگاریاں خراسان، شام، حجاز اور عراق تک پھیل گئیں {cite:tabaqat-shafiiyya-subki pp. 269-276}۔"
  es: "En la apertura del año 445/1053, el visir del sultán Tughril Beg, Amid al-Mulk Abu Nasr Mansur al-Kunduri, ordenó maldecir a los innovadores desde los púlpitos y lo usó como pretexto para nombrar a los ash'aritas, sometiéndolos a insultos, excluyéndolos de la predicación y la enseñanza, y desalojándolos del púlpito de la mezquita; las chispas de la prueba se extendieron por Jorasán, Siria, el Hiyaz e Irak {cite:tabaqat-shafiiyya-subki pp. 269-276}."
  fr: "Au début de l'année 445/1053, le vizir du sultan Tughril Beg, Amid al-Mulk Abu Nasr Mansur al-Kunduri, ordonna de maudire les innovateurs depuis les chaires et utilisa cela comme prétexte pour nommer les Ash'arites, les soumettant à l'insulte, à l'exclusion de la prédication et de l'enseignement, et à l'expulsion de la chaire de la mosquée; les étincelles de l'épreuve se propagèrent à travers le Khorasan, la Syrie, le Hedjaz et l'Irak {cite:tabaqat-shafiiyya-subki pp. 269-276}."
  tr: "Hicri 445 yılının başlarında, Sultan Tuğrul Bey'in veziri Amid el-Malik Ebu Nasr Mansur el-Kundari, minberlerde kafirlere lanet okunmasını emretti. Bunu, Eş'arilerden bahsetmek ve onlara hakaret etmek, vaaz ve öğretim vermelerini engellemek ve camide vaaz vermelerini yasaklamak için bir bahane olarak kullandı. Fitne kıvılcımları uçuşarak Horasan, Levant, Hicaz ve Irak'ı sardı. {cite:tabaqat-shafiiyya-subki ss. 269-276}"
  id: "Pada awal tahun 445 H, menteri Sultan Tughril Beg, Amid al-Malik Abu Nasr Mansur al-Kundari, memerintahkan pengutukan terhadap kaum bid'ah di mimbar-mimbar. Ia menggunakan ini sebagai dalih untuk menyebut-nyebut kaum Asy'ariyah dan menghina mereka, mencegah mereka berdakwah dan mengajar, serta mengusir mereka dari menyampaikan khutbah di masjid. Percikan hasutan pun berkobar dan memenuhi Khurasan, Levant, Hijaz, dan Irak. {cite:tabaqat-shafiiyya-subki pp. 269-276}."
