id: event/umar-doubles-hadd-for-wine
class: event
kind: other
label: { en: "Umar sets the penalty for wine at eighty on Ali's counsel", ar: "أخذ عمر بمشورة علي في جعل حد الخمر ثمانين" }
summary:
  en: "When wine-drinking spread in the newly conquered lands, Umar took Ali's counsel to flog the drinker eighty lashes, the lightest of the fixed penalties, arguing that a drunk man raves and one who raves slanders, and the slanderer gets eighty. Jurists differ on whether the fixed penalty is forty or eighty; Sallabi sets out the schools."
  ar: "لما انتشر شرب الخمر في البلاد المفتوحة حديثة العهد بالإسلام، أخذ عمر بمشورة علي بأن يُجلد شاربها ثمانين، وعلل علي ذلك بأن السكران يهذي، وإذا هذى افترى، وعلى المفتري ثمانون. ويعرض الكتاب خلاف الفقهاء بين ثمانين وأربعين."
