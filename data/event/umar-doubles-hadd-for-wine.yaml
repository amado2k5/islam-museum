    id: sunni-majority-eighty
    summary: { en: "Sallabi, citing al-Mughni: Malik, al-Thawri, Abu Hanifa and those who followed them set eighty as the penalty, on the consensus of the Companions; a report of Ali's reasoning supports it.", ar: "يعرض الكتاب عن المغني: مالك والثوري وأبو حنيفة ومن تبعهم جعلوا الحد ثمانين بإجماع الصحابة، وتؤيده رواية تعليل علي." }
    sources: [source/sallabi-ali-vol1]
  - tradition: sunni
    id: sunni-forty
    summary: { en: "Al-Shafi'i and a view of Ahmad, as the book reports, take forty as the fixed penalty and treat any addition as discretionary punishment for the ruler; the book also cites Ibn Taymiyya on the matter.", ar: "يذكر الكتاب أن الشافعي وقولاً لأحمد يجعلان الحد أربعين، وما زاد عليه تعزير للإمام؛ وينقل عن ابن تيمية في ذلك." }
