label: { ar: "تصنيف «تحقيق ما للهند»", en: "The book on India composed", es: "El libro sobre la India compuesto", fr: "Le livre sur l'Inde composé", ur: "ہندوستان پر کتاب لکھی۔", tr: "\"Hindistan'da Neler Olduğunu Araştırmak\" sınıflandırması", id: "Klasifikasi \"Menyelidiki Apa yang Ada di India\"" }
summary:
  ar: "ألّف البيروني بغزنة كتابه «تحقيق ما للهند من مقولة مقبولة في العقل أو مرذولة» جامعاً فيه ما عاينه في رحلاته مع حملات محمود إلى الهند من علومها ودينها وأدبها وعاداتها {cite:britannica-al-biruni}."
  en: "At Ghazna al-Bīrūnī composed Taḥqīq mā li-l-Hind — Verifying All That the Indians Recount — gathering what he had observed on Maḥmūd's Indian campaigns of its sciences, religion, literature and customs {cite:britannica-al-biruni}."
  ur: "غزنہ میں بیرونی نے تحقیق ما للہند تصنیف کیا جس میں محمود کی ہند مہمات پر مشاہدہ کردہ ہندوستان کے علوم، دین، ادب اور رواج جمع کیے {cite:britannica-al-biruni}."
  es: "En Ghazna al-Bīrūnī compuso Taḥqīq mā li-l-Hind — Verificando todo lo que cuentan los indios — recopilando lo que había observado en las campañas indias de Maḥmūd sobre sus ciencias, religión, literatura y costumbres {cite:britannica-al-biruni}."
  fr: "À Ghazna, al-Bīrūnī composa Taḥqīq mā li-l-Hind — Vérifiant tout ce que les Indiens racontent — rassemblant ce qu'il avait observé lors des campagnes indiennes de Maḥmūd sur ses sciences, sa religion, sa littérature et ses coutumes {cite:britannica-al-biruni}."
  tr: "El-Biruni, Mahmud'un Hindistan'a yaptığı seferler sırasında Hindistan'ın bilimleri, dini, edebiyatı ve gelenekleri hakkında gördüklerini derlediği \"Hindistan'ın Akla Uygun veya Kınanacak Şeylerini Araştırmak\" adlı kitabını yazmıştır. {cite:britannica-al-biruni}"
  id: "Al-Biruni menulis bukunya “Menyelidiki apa yang dikatakan India yang dapat diterima akal sehat atau yang tercela,” di mana ia mengumpulkan apa yang telah dilihatnya selama perjalanannya bersama kampanye Mahmud ke India mengenai ilmu pengetahuan, agama, sastra, dan adat istiadatnya. {cite:britannica-al-biruni}."
