id: event/first-raid-on-cyprus
class: event
kind: raid
label: { ar: "غزوة قبرس الأولى", en: "The First Raid on Cyprus", es: "El primer ataque a Chipre", fr: "Le premier raid sur Chypre", ur: "قبرص پر پہلا حملہ", tr: "Birinci Kıbrıs İşgali", id: "Invasi Siprus Pertama" }
summary:
  ar: "عند البلاذري عن الواقدي وغيره: غزا معاوية بن أبي سفيان في البحر غزوة قبرس الأولى ولم يركب المسلمون بحر الروم قبلها، وكان معاوية استأذن عمر في غزو البحر فلم يأذن له فلما ولّى عثمان كتب إليه يستأذنه في غزو قبرس ويعلمه قربها وسهولة الأمر فيها فكتب إليه أن قد شهدت ما ردّ عليك عمر حين استأمرته في غزو البحر، فلما دخلت سنة 27 كتب إليه يهوّن عليه ركوب البحر إلى قبرس فكتب إليه عثمان «فإن ركبت البحر ومعك امرأتك فاركبه مأذوناً لك وإلا فلا»، فركب البحر من عكّا ومعه مراكب كثيرة وحمل امرأته فاختة بنت قرظة القرشية وحمل عبادة بن الصامت امرأته أم حرام بنت ملحان الأنصارية وذلك في سنة 28؛ فلما نزلوا ساحلها — وهي جزيرة يقال ثمانون فرسخاً في مثلها — بعث إليهم أركونها يطلب الصلح وقد أذعن أهلها فصالحهم على سبعة آلاف ومائتي دينار يؤدونها كل عام، وصالحهم الروم على مثل ذلك فهم يؤدون خرجين، واشترطوا أن لا يمنعهم المسلمون أداء الصلح إلى الروم، واشترط عليهم المسلمون أن لا يقاتلوا عنهم من أرادهم من ورائهم وأن يؤذنوا المسلمين بسير عدوهم من الروم، فكان المسلمون إذا ركبوا البحر لم يعرضوا لهم ولم ينصرهم أهل قبرس ولم ينصروا عليهم؛ وغزا فيها مع معاوية أبو أيوب الأنصاري وأبو الدرداء وأبو ذر الغفاري وعبادة بن الصامت وفضالة بن عبيد الأنصاري وعمير بن سعد الأنصاري وواثلة بن الأسقع وعبد الله بن بشر المازني وشداد بن أوس بن ثابت — وهو ابن أخي حسان بن ثابت — والمقداد وكعب الأحبار وجبير بن نفير الحضرمي؛ وخرجت أم حرام من المركب فقدّمت إليها دابة فعثرت بها فقتلتها فقبرها بقبرس تدعى قبر المرأة الصالحة؛ وصالحهم معاوية بعد صلحاً دائماً على سبعة آلاف دينار وعلى النصيحة للمسلمين وإنذارهم عدوهم من الروم. وعند السيوطي أن عمر كتب إلى عمرو بن العاص أن صف لي البحر وراكبه فكتب إني رأيت خلقاً كبيراً يركبه خلق صغير إن ركد حرق القلوب وإن تحرك أراع العقول فكتب عمر إلى معاوية والله لا أحمل فيه مسلماً أبداً {cite:tarikh-khulafa-minhaj-1434 p. 269}."
  en: "In al-Baladhuri from al-Waqidi and others: Mu'awiya ibn Abi Sufyan led the first sea raid on Cyprus — the Muslims had never before sailed the Byzantine sea; he had asked Umar's leave to raid by sea and was refused, and when Uthman took office he wrote asking leave for Cyprus, noting its nearness and ease; Uthman wrote back 'you witnessed what Umar replied when you consulted him about the sea', and when year 27 opened Mu'awiya again made light of the crossing, so Uthman wrote 'if you sail, take your wife with you — else do not'; he sailed from Acre with many vessels, carrying his wife Fakhita bint Qaraza the Qurashite, and Ubada ibn al-Samit carried his wife Umm Haram bint Milhan the Ansari — in year 28; when they reached its shore — an island some eighty farsakhs square, it is said — its archon sent seeking terms, its people consenting, and he compounded with them for seven thousand two hundred dinars paid yearly, while the Byzantines compounded with them for the like — so they pay two tributes — stipulating that the Muslims not bar them paying the Byzantines, and the Muslims stipulating that they not be made to fight those who came from beyond them and that they warn the Muslims of Byzantine movements; so when the Muslims sailed they did not trouble them, and Cyprus's people neither aided them nor fought them; on this raid went Abu Ayyub al-Ansari, Abu al-Darda', Abu Dharr al-Ghifari, Ubada ibn al-Samit, Fadala ibn Ubayd al-Ansari, Umayr ibn Sa'd al-Ansari, Wathila ibn al-Asqa', Abdullah ibn Bishr al-Mazini, Shaddad ibn Aws ibn Thabit — nephew of Hassan ibn Thabit — al-Miqdad, Ka'b al-Ahbar and Jubayr ibn Nufayr al-Hadrami; Umm Haram left the ship and was brought a mount which stumbled and killed her — her grave in Cyprus is called the grave of the righteous woman; Mu'awiya afterwards compounded with them a lasting peace at seven thousand dinars, upon good counsel to the Muslims and warning them of their Byzantine enemy."
  es: "En al-Baladhuri de al-Waqidi y otros: Mu'awiya ibn Abi Sufyan dirigió la primera incursión marítima en Chipre; los musulmanes nunca antes habían navegado por el mar bizantino; había pedido permiso a Umar para atacar por mar y se le negó, y cuando Uthman asumió el cargo escribió pidiendo permiso para Chipre, señalando su cercanía y facilidad; Uthman escribió de vuelta 'usted presenció lo que Umar respondió cuando lo consultó sobre el mar', y cuando comenzó el año 27 Mu'awiya nuevamente restó importancia al cruce, por lo que Uthman escribió 'si navega, lleve a su esposa con usted; de lo contrario, no lo haga'; zarpó de Acre con muchos barcos, llevando a su esposa Fakhita bint Qaraza la Qurajita, y Ubada ibn al-Samit llevó a su esposa Umm Haram bint Milhan la Ansari, en el año 28; Cuando llegaron a su costa —una isla de unos ochenta farsakhs cuadrados, según se dice— su arconte envió a buscar condiciones, su pueblo consintió, y él llegó a un acuerdo con ellos por siete mil doscientos dinares pagados anualmente, mientras que los bizantinos llegaron a un acuerdo con ellos por lo mismo —así que pagaban dos tributos— estipulando que los musulmanes no les impidieran pagar a los bizantinos, y los musulmanes estipulando que no se les obligara a luchar contra los que venían de más allá de ellos y que advirtieran a los musulmanes de los movimientos bizantinos; así que cuando los musulmanes navegaron no los molestaron, y el pueblo de Chipre ni los ayudó ni luchó contra ellos; En esta incursión participaron Abu Ayyub al-Ansari, Abu al-Darda', Abu Dharr al-Ghifari, Ubada ibn al-Samit, Fadala ibn Ubayd al-Ansari, Umayr ibn Sa'd al-Ansari, Wathila ibn al-Asqa', Abdullah ibn Bishr al-Mazini, Shaddad ibn Aws ibn Thabit —sobrino de Hassan ibn Thabit— al-Miqdad, Ka'b al-Ahbar y Jubayr ibn Nufayr al-Hadrami; Umm Haram abandonó el barco y le trajeron una montura que tropezó y la mató; su tumba en Chipre se llama la tumba de la mujer justa; Mu'awiya posteriormente acordó con ellos una paz duradera por siete mil dinares, tras aconsejar a los musulmanes y advertirles de su enemigo bizantino."
  fr: "Dans al-Baladhuri, d'après al-Waqidi et d'autres: Mu'awiya ibn Abi Sufyan mena le premier raid maritime sur Chypre — les musulmans n'avaient jamais navigué auparavant sur la mer Byzantine; il avait demandé à Umar la permission de mener un raid par la mer et s'était vu refuser cette permission, et lorsque Uthman prit ses fonctions, il écrivit pour demander la permission de se rendre à Chypre, notant sa proximité et sa facilité d'accès; Uthman répondit: « Tu as été témoin de la réponse d'Umar lorsque tu l'as consulté au sujet de la mer », et lorsque l'année 27 commença, Mu'awiya minimisa à nouveau la traversée, si bien qu'Uthman écrivit: « Si tu navigues, emmène ta femme avec toi — sinon, ne le fais pas »; il partit d'Acre avec de nombreux navires, emmenant avec lui sa femme Fakhita bint Qaraza la Qurashite, et Ubada ibn al-Samit emmena sa femme Umm Haram bint Milhan l'Ansari — en l'an 28; Lorsqu'ils atteignirent ses rivages — une île d'environ quatre-vingts farsakhs carrés, dit-on —, son archonte envoya des négociations, auxquelles les habitants consentirent, et il conclut un accord avec eux pour sept mille deux cents dinars payables annuellement, tandis que les Byzantins conclurent un accord similaire — ils payaient donc deux tributs — stipulant que les musulmans ne les empêcheraient pas de payer les Byzantins, et les musulmans stipulant qu'ils ne seraient pas contraints de combattre ceux qui venaient d'au-delà et qu'ils avertiraient les musulmans des mouvements byzantins; ainsi, lorsque les musulmans firent voile, ils ne les trouvèrent pas en difficulté, et les habitants de Chypre ne les aidèrent ni ne les combattirent; Participèrent à ce raid Abu Ayyub al-Ansari, Abu al-Darda', Abu Dharr al-Ghifari, Ubada ibn al-Samit, Fadala ibn Ubayd al-Ansari, Umayr ibn Sa'd al-Ansari, Wathila ibn al-Asqa', Abdullah ibn Bishr al-Mazini, Shaddad ibn Aws ibn Thabit — neveu de Hassan ibn Thabit — al-Miqdad, Ka'b al-Ahbar et Jubayr ibn Nufayr al-Hadrami; Umm Haram quitta le navire et on lui apporta une monture qui trébucha et la tua — sa tombe à Chypre est appelée la tombe de la femme vertueuse; Mu'awiya conclut ensuite avec eux une paix durable pour sept mille dinars, après avoir prodigué de bons conseils aux musulmans et les avoir avertis de leur ennemi byzantin."
  ur: "البلادوری میں الواقدی اور دیگر سے: معاویہ ابن ابی سفیان نے قبرص پر پہلے سمندری حملے کی قیادت کی - مسلمانوں نے اس سے پہلے کبھی بازنطینی سمندر میں بحری سفر نہیں کیا تھا۔ اس نے عمر سے سمندر کے ذریعے چھاپہ مارنے کی اجازت مانگی تھی اور اس نے انکار کر دیا تھا، اور جب عثمان نے عہدہ سنبھالا تو اس نے قبرص کی قربت اور آسانی کو دیکھتے ہوئے لکھا۔ عثمان نے واپس لکھا 'آپ نے دیکھا کہ عمر نے کیا جواب دیا جب آپ نے سمندر کے بارے میں ان سے مشورہ کیا'، اور جب 27 سال کھولا تو معاویہ نے دوبارہ کراسنگ کو روشن کر دیا، تو عثمان نے لکھا 'اگر آپ کشتی پر جائیں تو اپنی بیوی کو ساتھ لے جائیں، ورنہ ایسا نہ کریں'؛ وہ اپنی بیوی فاختہ بنت قرازہ قراشی کو لے کر ایکر سے بہت سے جہازوں کے ساتھ روانہ ہوا، اور عبادہ بن الصامت اپنی بیوی ام حرام بنت ملحان انصاری کو لے کر گئے — سن 28 میں۔ جب وہ اس کے ساحل پر پہنچے - ایک جزیرہ جس میں کوئی اسّی فرسخ مربع ہے، کہا جاتا ہے کہ - اس کے محراب نے شرائط طلب کیں، اس کے لوگوں نے رضامندی ظاہر کی، اور اس نے ان کے ساتھ سات ہزار دو سو دینار سالانہ ادا کیے، جب کہ بازنطینیوں نے ان کے ساتھ اس طرح کی رقم جمع کی - تو وہ دو خراج پیش کرتے ہیں - یہ شرط لگاتے ہیں کہ مسلمان ان کو ادا کرنے سے روکیں گے، اور ان لوگوں کو جو جنگ کرنے والوں سے لڑیں گے، وہ ان کو ادا نہیں کریں گے۔ ان کے آگے سے آئے اور یہ کہ وہ مسلمانوں کو بازنطینی تحریکوں سے خبردار کرتے ہیں۔ چنانچہ جب مسلمانوں نے کشتی رانی کی تو انہوں نے انہیں تنگ نہیں کیا اور قبرص کے لوگوں نے نہ ان کی مدد کی اور نہ ان سے جنگ کی۔ اس چھاپے میں ابو ایوب الانصاری، ابو الدرداء، ابو ذر غفاری، عبادہ بن الصامت، فدالا بن عبید الانصاری، عمیر بن سعد الانصاری، وثیلہ بن الاسقع، عبد اللہ بن معزبن الثابت، ابن عباس م شامل تھے۔ حسن بن ثابت کے بھتیجے - المقداد، کعب الاحبار اور جبیر بن نفیر الحدرمی؛ ام حرام نے جہاز چھوڑ دیا اور ایک پہاڑ لایا گیا جس نے اسے ٹھوکر مار کر ہلاک کر دیا - قبرص میں اس کی قبر کو نیک عورت کی قبر کہا جاتا ہے۔ اس کے بعد معاویہ نے مسلمانوں کو اچھی نصیحت اور بازنطینی دشمن سے خبردار کرنے پر ان کے ساتھ سات ہزار دینار پر دیرپا صلح کر لی۔"
  tr: "El-Baladhuri, El-Vakidi ve diğerlerinin rivayetine dayanarak şöyle demiştir: Muaviye ibn Ebu Sufyan, Kıbrıs'a ilk deniz seferini yönetmiştir ve Müslümanlar daha önce Akdeniz'de sefer yapmamışlardı. Muaviye, Ömer'den deniz seferi düzenlemek için izin istemişti, ancak Ömer izin vermemişti. Osman göreve geldiğinde, Muaviye ona Kıbrıs'a deniz seferi düzenlemek için izin isteyen bir mektup yazmış, Kıbrıs'ın yakınlığını ve oradaki işin kolaylığını bildirmişti. Osman ona şöyle cevap yazmıştı: \"Ömer'in sana deniz seferi düzenlemek için izin istediğinde söylediklerine şahit oldum.\" 27. yılda, Muaviye ona Kıbrıs'a deniz seferi düzenlemesini kolaylaştıran bir mektup yazmıştı. Osman ona şöyle cevap yazmıştı: \"Eğer eşinle denize açılırsan, izninle aç, aksi takdirde açamazsın.\" Böylece Akka'dan birçok gemiyle denize açıldı ve karısı Fakhtah bint Kurza el-Kureşiye'yi yanına aldı; Ubadah ibn el-Samit de karısı Ümmü Haram bint Milhan el-Ensariyye'yi yanına aldı. Bu olay 28 yılında gerçekleşti. Kıyıya indiklerinde -ki bu ada seksen fersah uzunluğunda ve seksen fersah genişliğinde olduğu söylenir- adanın yöneticisi onlara barış teklifinde bulundu ve halkı teslim oldu. Bunun üzerine yönetici, her yıl yedi bin iki yüz dinar ödeme karşılığında onlarla barış yaptı. Romalılar da aynı miktarda vergi karşılığında onlarla barış yaptı ve Müslümanların Romalılara ödeme yapmalarını engellememeleri, Müslümanların ise arkalarından gelenlere karşı savaşmamaları ve Romalıların düşmanlarının hareketlerini Müslümanlara bildirmeleri konusunda anlaşmaya vardılar. Müslümanlar denize açıldıklarında onlarla karşılaşmadılar ve Kıbrıs halkı da onları desteklemedi, onlara karşı da savaşmadı. Ebu Eyyub el-Ensari, Ebu el-Darda, Ebu Zer el-Gifari, Ubede ibn el-Samit, Fadala ibn Ubeyd el-Ensari, Umeyr ibn Saad el-Ensari, Vathilah ibn el-Asqa, Abdullah ibn Bişr el-Mazini, Hasan ibn Sabit'in yeğeni Şaddad ibn Evs ibn Sabit, el-Mikdad, Kaab el-Ahbar ve Cübeyr ibn Nufeyr el-Hadrami, Muaviye ile birlikte savaştılar; Ümmü Haram gemiden indi ve bir hayvan ona yaklaştı, ancak tökezleyip onu öldürdü. Kıbrıs'taki mezarına Salih Kadının Mezarı denir. Muaviye daha sonra onlarla yedi bin dinar karşılığında, Müslümanlara nasihatte bulunmaları ve onları düşmanları Romalılara karşı uyarmaları şartıyla kalıcı bir barış yaptı. Suyuti'ye göre, Ömer, Amr ibn al-As'a denizi ve üzerindeki yolcuları tarif etmesini isteyen bir mektup yazmıştır. Amr şöyle cevap vermiştir: \"Küçük bir kalabalığın üzerinde büyük bir kalabalık gördüm. Durağan haldeyken kalpleri yakar, hareket halindeyken ise akılları korkutur.\" Bunun üzerine Ömer, Muaviye'ye şöyle yazmıştır: \"Allah'a yemin ederim ki, bir daha hiçbir Müslümanın bu gemiye binmesine izin vermeyeceğim.\" {cite:tarikh-khulafa-minhaj-1434 s. 269}"
  id: "Al-Baladhuri, berdasarkan riwayat Al-Waqidi dan lainnya, berkata: Muawiyah bin Abi Sufyan memimpin kampanye angkatan laut pertama ke Siprus, dan kaum Muslimin belum pernah berlayar di Laut Mediterania sebelum itu. Muawiyah meminta izin kepada Umar untuk melancarkan kampanye angkatan laut, tetapi Umar tidak memberikannya izin. Ketika Utsman berkuasa, ia menulis surat kepada Utsman meminta izin untuk melancarkan kampanye angkatan laut ke Siprus, memberitahukan tentang kedekatan dan kemudahan perjalanan ke sana. Utsman membalas suratnya, mengatakan, “Aku telah menyaksikan apa yang dikatakan Umar kepadamu ketika engkau meminta izin kepadanya untuk melancarkan kampanye angkatan laut.” Ketika tahun 27 tiba, ia menulis surat kepada Utsman untuk mempermudah perjalanannya ke Siprus. Utsman membalas suratnya, “Jika engkau berlayar bersama istrimu, maka berlayarlah dengan izinmu, jika tidak, jangan.” Maka ia berlayar dari Acre dengan banyak kapal dan membawa istrinya, Fakhtah bint Qurzah al-Qurashiyyah, dan Ubadah ibn al-Samit membawa istrinya, Umm Haram bint Milhan al-Ansariyyah, dan itu terjadi pada tahun 28. Ketika mereka mendarat di pantainya—dan itu adalah sebuah pulau yang konon berukuran delapan puluh liga kali delapan puluh liga—penguasa setempat mengirim utusan kepada mereka untuk meminta perdamaian, dan penduduknya tunduk, maka ia berdamai dengan mereka dengan pembayaran tujuh ribu dua ratus dinar setiap tahun, dan bangsa Romawi berdamai dengan mereka dengan jumlah yang sama, sehingga mereka membayar dua upeti, dan mereka menetapkan bahwa kaum Muslim tidak boleh menghalangi mereka untuk membayar perdamaian kepada bangsa Romawi, dan kaum Muslim menetapkan bahwa mereka tidak boleh berperang atas nama mereka melawan siapa pun yang menginginkan mereka dari belakang dan bahwa mereka harus memberi tahu kaum Muslim tentang pergerakan musuh mereka dari bangsa Romawi, sehingga ketika kaum Muslim berlayar di laut, mereka tidak menghadapi mereka, dan penduduk Siprus tidak mendukung mereka, juga tidak mendukung mereka melawan Mereka; dan Abu Ayyub al-Ansari, Abu al-Darda, Abu Dharr al-Ghifari, Ubadah ibn al-Samit, Fadalah ibn Ubayd al-Ansari, Umayr ibn Saad al-Ansari, Wathilah ibn al-Asqa, Abdullah ibn Bishr al-Mazini, Shaddad ibn Aws ibn Thabit — yang merupakan keponakan Hassan ibn Thabit — al-Miqdad, Kaab al-Ahbar, dan Jubayr ibn Nufayr al-Hadrami berperang di dalamnya bersama Muawiyah; Umm Haram turun dari kapal, dan seekor binatang mendekatinya, tetapi binatang itu tersandung dan membunuhnya. Makamnya di Siprus disebut Makam Wanita Saleh. Mu'awiyah kemudian membuat perdamaian abadi dengan mereka dengan imbalan tujuh ribu dinar, dengan syarat mereka akan memberi nasihat kepada kaum Muslim dan memperingatkan mereka terhadap musuh mereka, bangsa Romawi. Menurut al-Suyuti, Umar menulis surat kepada Amr ibn al-As meminta beliau untuk menggambarkan laut dan para penunggangnya. Amr menjawab, \"Aku melihat banyak sekali makhluk menunggangi sedikit makhluk. Jika diam, ia membakar hati, dan jika bergerak, ia menakutkan pikiran.\" Kemudian Umar menulis kepada Mu'awiya, \"Demi Allah, aku tidak akan pernah mengizinkan seorang Muslim berlayar di atasnya lagi.\" {cite:tarikh-khulafa-minhaj-1434 p. 269}"
