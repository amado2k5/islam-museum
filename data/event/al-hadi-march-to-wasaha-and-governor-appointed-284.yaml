id: event/al-hadi-march-to-wasaha-and-governor-appointed-284
class: event
kind: other
label:
  ar: مسير الهادي إلى وسحة وإقامته فيها ثمانية أيام وتوليته أبا محمد بن عبيد الله عليها، شوال 284هـ
  en: Al-Hadi's march to Wasaha, his eight-day stay and the appointment of Muhammad ibn Ubaydallah there, Shawwal 284 AH
  ur: ہادی کا وسحہ کی طرف جانا، آٹھ دن قیام اور محمد بن عبید اللہ کو وہاں مقرر کرنا، شوال 284ھ
  es: "La marcha de Al-Hadi a Wasaha, su estancia de ocho días y el nombramiento de Muhammad ibn Ubaydallah allí, Shawwal 284 AH."
  fr: "Marche d'Al-Hadi vers Wasaha, son séjour de huit jours et la nomination de Muhammad ibn Ubaydallah à cet endroit, Shawwal 284 AH"
  tr: "El-Hadi'nin Wasah'a yaptığı yolculuk, orada sekiz gün kalması ve Ebu Muhammed ibn Ubeydullah'ı vali olarak ataması, Şevval 284 Hicri."
  id: "Perjalanan Al-Hadi ke Wasah dan masa tinggalnya di sana selama delapan hari, serta pengangkatannya terhadap Abu Muhammad ibn Ubayd Allah sebagai gubernurnya, Syawal 284 H."
summary:
  ar: خرج الهادي يوم الثلاثاء ثامن شوال 284هـ إلى وسحة وسط جبال وعرة لم يسلكها من السلاطين إلا سلطان لآل يعفر هلك جنده على يد البحري، فدخلها بالهيبة وبايعه أهلها وأقام ثمانية أيام وأطاعه من حولها، ثم عاد إلى صعدة السبت وخلّف عليها أبا محمد بن عبيد الله العلوي.
  en: On Tuesday the eighth of Shawwal 284 AH al-Hadi marched to Wasaha in rough mountains which no ruler had entered but a sultan of Al Ya'fur, whose force was destroyed there by al-Bahri; he entered with awe, its people pledged to him, he stayed eight days and the neighbouring people obeyed, then returned to Sa'da on Saturday leaving Abu Muhammad ibn Ubaydallah al-Alawi in charge.
  ur: منگل 8 شوال 284ھ کو ہادی وسحہ کی طرف نکلے جو دشوار پہاڑوں میں ہے اور جس میں آل یعفر کے ایک سلطان کے سوا کوئی حکمران نہ گیا تھا اور اس کا لشکر وہاں بحری کے ہاتھوں تباہ ہوا؛ وہ رعب کے ساتھ داخل ہوئے، اہل وسحہ نے بیعت کی، آٹھ دن رہے اور آس پاس کے لوگ مطیع ہوئے، پھر ہفتے کو صعدہ لوٹے اور ابو محمد بن عبید اللہ علوی کو وہاں چھوڑا۔
  es: "El martes 8 de Shawwal del año 284 de la Hégira, al-Hadi marchó hacia Wasaha, en unas montañas escarpadas a las que ningún gobernante había entrado excepto un sultán de Al Ya'fur, cuyas fuerzas fueron destruidas allí por al-Bahri; entró con temor, su gente le juró lealtad, permaneció allí ocho días y los vecinos obedecieron, luego regresó a Sa'da el sábado, dejando a Abu Muhammad ibn Ubaydallah al-Alawi a cargo."
  fr: "Le mardi 8 Shawwal 284 AH, al-Hadi marcha vers Wasaha, dans des montagnes escarpées où aucun souverain n'était entré, sauf un sultan d'Al Ya'fur, dont les troupes avaient été anéanties par al-Bahri; il y entra avec crainte, les habitants lui prêtèrent allégeance, il y resta huit jours et les populations voisines lui obéirent, puis retourna à Sa'da le samedi, laissant Abu Muhammad ibn Ubaydallah al-Alawi aux commandes."
  tr: "Hicri 284 yılının Şevval ayının sekizinci Salı günü, Al-Hadi, Ya'fur ailesinden bir sultan dışında hiçbir sultanın geçmediği, engebeli dağların ortasındaki Wasah'a gitti. Wasah'a büyük bir saygıyla girdi ve halkı ona biat etti. Sekiz gün orada kaldı ve çevresindekiler ona itaat etti. Daha sonra Cumartesi günü Sa'de'ye döndü ve yönetimini Ebu Muhammed bin Ubeydullah el-Alevi'ye bıraktı."
  id: "Pada hari Selasa, tanggal 8 Syawal 284 H, Al-Hadi pergi ke Wasah, di tengah pegunungan terjal, yang belum pernah dilalui oleh sultan mana pun kecuali seorang sultan dari keluarga Ya'fur yang pasukannya binasa di tangan Al-Bahri. Beliau memasuki tempat itu dengan penuh kekaguman, dan penduduknya berjanji setia kepadanya. Beliau tinggal selama delapan hari, dan orang-orang di sekitarnya menaatinya. Kemudian beliau kembali ke Sa'dah pada hari Sabtu dan menyerahkan pengelolaan Sa'dah kepada Abu Muhammad bin Ubaid Allah Al-Alawi."
