id: event/al-hadi-march-to-wasaha-and-governor-appointed-284
class: event
kind: other
label:
  ar: مسير الهادي إلى وسحة وإقامته فيها ثمانية أيام وتوليته أبا محمد بن عبيد الله عليها، شوال 284هـ
  en: Al-Hadi's march to Wasaha, his eight-day stay and the appointment of Muhammad ibn Ubaydallah there, Shawwal 284 AH
  ur: ہادی کا وسحہ کی طرف جانا، آٹھ دن قیام اور محمد بن عبید اللہ کو وہاں مقرر کرنا، شوال 284ھ
summary:
  ar: خرج الهادي يوم الثلاثاء ثامن شوال 284هـ إلى وسحة وسط جبال وعرة لم يسلكها من السلاطين إلا سلطان لآل يعفر هلك جنده على يد البحري، فدخلها بالهيبة وبايعه أهلها وأقام ثمانية أيام وأطاعه من حولها، ثم عاد إلى صعدة السبت وخلّف عليها أبا محمد بن عبيد الله العلوي.
  en: On Tuesday the eighth of Shawwal 284 AH al-Hadi marched to Wasaha in rough mountains which no ruler had entered but a sultan of Al Ya'fur, whose force was destroyed there by al-Bahri; he entered with awe, its people pledged to him, he stayed eight days and the neighbouring people obeyed, then returned to Sa'da on Saturday leaving Abu Muhammad ibn Ubaydallah al-Alawi in charge.
  ur: منگل 8 شوال 284ھ کو ہادی وسحہ کی طرف نکلے جو دشوار پہاڑوں میں ہے اور جس میں آل یعفر کے ایک سلطان کے سوا کوئی حکمران نہ گیا تھا اور اس کا لشکر وہاں بحری کے ہاتھوں تباہ ہوا؛ وہ رعب کے ساتھ داخل ہوئے، اہل وسحہ نے بیعت کی، آٹھ دن رہے اور آس پاس کے لوگ مطیع ہوئے، پھر ہفتے کو صعدہ لوٹے اور ابو محمد بن عبید اللہ علوی کو وہاں چھوڑا۔
