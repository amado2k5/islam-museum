id: event/yawm-al-ghar-389
class: event
kind: other
label: { ar: "استحداث يوم الغار ببغداد مقابلاً ليوم الغدير", en: "The Establishment of the Day of the Cave in Baghdad as a Counterpart to the Day of Ghadir", es: "El establecimiento del Día de la Cueva en Bagdad como contraparte del Día de Ghadir.", fr: "L'instauration du Jour de la Caverne à Bagdad comme pendant au Jour de Ghadir", ur: "یوم غدیر کے ہم منصب کے طور پر بغداد میں یوم غار کا قیام" }
summary:
  ar: "كانت عادة الشيعة بالكرخ وباب الطاق نصب القباب وتعليق الثياب وإظهار الزينة يوم الغدير وإشعال النار ليلته ونحر جمل صبيحته، فأرادت الطائفة الأخرى أن تعمل في مقابله شيئاً فادعت أن اليوم الثامن منه كان اليوم الذي حصل فيه النبي وأبو بكر في الغار فعملت فيه مثل ما عملت الشيعة، وجعلت بازاء يوم عاشوراء يوماً بعده بثمانية أيام نسبته إلى مقتل مصعب بن الزبير فزاروا قبره بمسكن كما يزار قبر الحسين، وكان ابتداء يوم الغار يوم الجمعة لأربع بقين من ذي الحجة سنة تسع وثمانين {cite:muntazam-ibn-al-jawzi j.7 p.209-210}."
  en: "The custom of the Shi'a of al-Karkh and Bab al-Taq was to raise domes, hang cloths and display decorations on the day of Ghadir, kindle fire on its eve and slaughter a camel on its morning. The other group wanted to do something in response, so it claimed that the eighth day of that month was the day on which the Prophet and Abu Bakr were in the cave, and it did with that day what the Shi'a had done. Opposite the day of Ashura it set a day eight days later, attributing it to the killing of Mus'ab ibn al-Zubayr, and its people visited his grave at Maskin as the grave of al-Husayn is visited. The Day of the Cave began on Friday, four days before the end of Dhu al-Hijja in the year eighty-nine. {cite:muntazam-ibn-al-jawzi j.7 p.209-210}"
  es: "La costumbre de los chiítas de al-Karkh y Bab al-Taq era erigir cúpulas, colgar telas y exhibir decoraciones el día de Ghadir, encender fuego en su víspera y sacrificar un camello en su mañana. El otro grupo quiso responder, por lo que afirmó que el octavo día de ese mes era el día en que el Profeta y Abu Bakr estuvieron en la cueva, e hizo con ese día lo que los chiítas habían hecho. Frente al día de Ashura, estableció un día ocho días después, atribuyéndolo a la muerte de Mus'ab ibn al-Zubayr, y sus seguidores visitaban su tumba en Maskin como se visita la tumba de al-Husayn. El Día de la Cueva comenzó el viernes, cuatro días antes del final de Dhu al-Hijja del año ochenta y nueve. {cite:muntazam-ibn-al-jawzi j.7 p.209-210}"
  fr: "La coutume des chiites d'al-Karkh et de Bab al-Taq était d'ériger des dômes, de suspendre des étoffes et d'exposer des décorations le jour de Ghadir, d'allumer un feu la veille et d'immoler un chameau le matin. L'autre groupe, voulant réagir, affirma que le huitième jour de ce mois était celui où le Prophète et Abou Bakr se trouvaient dans la grotte, et ils firent de même ce jour-là. Face à Achoura, ils fixèrent un jour huit jours plus tard, l'attribuant au meurtre de Mus'ab ibn al-Zubayr, et ses fidèles se rendirent sur sa tombe à Maskin, comme on se rend sur celle d'al-Husayn. Le Jour de la Grotte commençait un vendredi, quatre jours avant la fin de Dhu al-Hijja de l'an 89. {cite:muntazam-ibn-al-jawzi j.7 p.209-210}"
  ur: "کرخ اور باب الطاق کے شیعوں کا معمول یہ تھا کہ غدیر کے دن گنبد بلند کرنا، کپڑے لٹکانا اور سجاوٹ کا مظاہرہ کرنا، اس کی شام کو آگ جلانا اور صبح کو اونٹ ذبح کرنا۔ دوسرے گروہ نے جواب میں کچھ کرنا چاہا تو اس نے دعویٰ کیا کہ اس مہینے کی آٹھویں تاریخ وہ دن ہے جس دن رسول اللہ اور ابوبکر غار میں تھے اور اس دن کے ساتھ وہی کچھ کیا جو شیعہ کرتے تھے۔ عاشورہ کے دن کے برعکس اس نے آٹھ دن بعد ایک دن مقرر کیا اور اسے مصعب بن الزبیر کے قتل سے منسوب کیا اور اس کے لوگوں نے مسکین میں ان کی قبر کی زیارت کی جیسا کہ الحسین کی قبر کی زیارت کی جاتی ہے۔ یومِ غار کا آغاز جمعے کو ہوا، جو اناسی ذی الحجہ کے اختتام سے چار دن پہلے تھا۔ {حوالہ:منتظم ابن الجوزی ج7 ص209-210}"
