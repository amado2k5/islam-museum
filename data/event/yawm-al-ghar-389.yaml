label: { ar: "استحداث يوم الغار ببغداد مقابلاً ليوم الغدير", en: "The Establishment of the Day of the Cave in Baghdad as a Counterpart to the Day of Ghadir" }
summary:
  ar: "كانت عادة الشيعة بالكرخ وباب الطاق نصب القباب وتعليق الثياب وإظهار الزينة يوم الغدير وإشعال النار ليلته ونحر جمل صبيحته، فأرادت الطائفة الأخرى أن تعمل في مقابله شيئاً فادعت أن اليوم الثامن منه كان اليوم الذي حصل فيه النبي وأبو بكر في الغار فعملت فيه مثل ما عملت الشيعة، وجعلت بازاء يوم عاشوراء يوماً بعده بثمانية أيام نسبته إلى مقتل مصعب بن الزبير فزاروا قبره بمسكن كما يزار قبر الحسين، وكان ابتداء يوم الغار يوم الجمعة لأربع بقين من ذي الحجة سنة تسع وثمانين {cite:muntazam-ibn-al-jawzi j.7 p.209-210}."
  en: "The custom of the Shi'a of al-Karkh and Bab al-Taq was to raise domes, hang cloths and display decorations on the day of Ghadir, kindle fire on its eve and slaughter a camel on its morning. The other group wanted to do something in response, so it claimed that the eighth day of that month was the day on which the Prophet and Abu Bakr were in the cave, and it did with that day what the Shi'a had done. Opposite the day of Ashura it set a day eight days later, attributing it to the killing of Mus'ab ibn al-Zubayr, and its people visited his grave at Maskin as the grave of al-Husayn is visited. The Day of the Cave began on Friday, four days before the end of Dhu al-Hijja in the year eighty-nine. {cite:muntazam-ibn-al-jawzi j.7 p.209-210}"
