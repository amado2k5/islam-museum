label: { ar: "وصية محمد بن سيرين وديونه ووفاته بالبصرة", en: "Testament, debts and death of Muhammad ibn Sirin", ur: "محمد بن سیرین کی وصیت، قرض اور بصرہ میں وفات", es: "Testamento, deudas y muerte de Muhammad ibn Sirin", fr: "Testament, dettes et décès de Muhammad ibn Sirin" }
summary:
  ar: "يروي ابن سعد أن وصية محمد بن سيرين لبنيه وأهله كانت أن يتقوا الله ويصلحوا ذات بينهم ويطيعوا الله ورسوله، وأوصاهم بما أوصى به إبراهيم بنيه ويعقوب، وألا يدعوا أن يكونوا إخوان الأنصار ومواليهم في الدين، وأوصى فيما ترك إن حدث به حدث قبل أن يغيّر وصيته {cite:tabaqat-ibn-sad-khanji-2001 vol. 9 p. 204}. وكان عليه دين ركبه حين اشترى طعاماً بأربعين ألف درهم فتركه أو تصدّق به وبقي المال عليه فحُبس، وقضى عنه ابنه عبد الله ثلاثين ألفاً {cite:tabaqat-ibn-sad-khanji-2001 vol. 9 p. 197} {cite:tabaqat-ibn-sad-khanji-2001 vol. 9 p. 204}. ومات يوم الجمعة وغسله أيوب وابن عون بعد الحسن بمئة يوم سنة عشر ومئة {cite:tabaqat-ibn-sad-khanji-2001 vol. 9 p. 205}."
  en: "Ibn Sa'd reports that Muhammad ibn Sirin's will to his sons and household was to fear God, mend what lay between them, and obey God and His Messenger; he enjoined on them what Abraham and Jacob enjoined on their sons, that they not cease to be brothers of the Ansar and their clients in religion, and he made a bequest of what he left in case something befell him before he changed his will {cite:tabaqat-ibn-sad-khanji-2001 vol. 9 p. 204}. He carried a debt from the time he bought food for forty thousand dirhams, then left it or gave it away as charity while the money stayed owed, and he was jailed; his son Abd Allah later paid thirty thousand for him {cite:tabaqat-ibn-sad-khanji-2001 vol. 9 p. 197} {cite:tabaqat-ibn-sad-khanji-2001 vol. 9 p. 204}. He died on a Friday, washed by Ayyub and Ibn Awn, a hundred days after al-Hasan, in 110 AH {cite:tabaqat-ibn-sad-khanji-2001 vol. 9 p. 205}."
  ur: "ابن سعد روایت کرتے ہیں کہ محمد بن سیرین کی اپنے بیٹوں اور گھر والوں کو وصیت یہ تھی کہ اللہ سے ڈریں، آپس کے معاملات درست رکھیں، اللہ اور اس کے رسول کی اطاعت کریں؛ انھوں نے وہی وصیت کی جو ابراہیم اور یعقوب نے اپنے بیٹوں کو کی تھی، یہ بھی کہ وہ دین میں انصار اور ان کے موالی کے بھائی بنے رہیں، اور جو کچھ چھوڑا اس کے بارے میں وصیت کی کہ اگر وصیت بدلنے سے پہلے انھیں کچھ پیش آ جائے {cite:tabaqat-ibn-sad-khanji-2001 vol. 9 p. 204}۔ ان پر قرض اس وقت چڑھا جب انھوں نے چالیس ہزار درہم کا غلہ خریدا، پھر اسے چھوڑ دیا یا صدقہ کر دیا اور رقم ان کے ذمے رہی تو قید ہوئے؛ بعد میں ان کے بیٹے عبد اللہ نے ان کی طرف سے تیس ہزار ادا کیے {cite:tabaqat-ibn-sad-khanji-2001 vol. 9 p. 197} {cite:tabaqat-ibn-sad-khanji-2001 vol. 9 p. 204}۔ وہ جمعہ کے دن فوت ہوئے، ایوب اور ابن عون نے غسل دیا، حسن کے سو دن بعد، 110ھ میں {cite:tabaqat-ibn-sad-khanji-2001 vol. 9 p. 205}۔"
  es: "Ibn Sa'd informa que la voluntad de Muhammad ibn Sirin para sus hijos y su familia fue que temieran a Dios, enmendaran lo que había entre ellos y obedecieran a Dios y a Su Mensajero; les ordenó lo que Abraham y Jacob ordenaron a sus hijos, que no dejaran de ser hermanos de los Ansar y sus clientes en la religión, e hizo un legado de lo que dejó en caso de que algo le sucediera antes de cambiar su testamento {cite:tabaqat-ibn-sad-khanji-2001 vol. 9 p. 204}. Tenía una deuda desde el momento en que compró comida por cuarenta mil dirhams, luego la dejó o la dio como caridad mientras el dinero seguía debiendo, y fue encarcelado; su hijo Abd Allah luego pagó treinta mil por él {cite:tabaqat-ibn-sad-khanji-2001 vol. 9 p. 197} {cite:tabaqat-ibn-sad-khanji-2001 vol. 9 p. 204}. Murió un viernes, lavado por Ayyub e Ibn Awn, cien días después de al-Hasan, en 110 AH {cite:tabaqat-ibn-sad-khanji-2001 vol. 9 p. 205}."
  fr: "Ibn Sa'd rapporte que Muhammad ibn Sirin a demandé à ses fils et à sa famille de craindre Dieu, de rétablir les liens qui les unissaient et d'obéir à Dieu et à Son Messager. Il leur a enjoint ce qu'Abraham et Jacob avaient enjoint à leurs fils: demeurer frères des Ansar et leurs fidèles en matière de religion. Il a également légué ses biens au cas où il lui arriverait malheur avant de modifier son testament (Tabaqat ibn Sa'd Khanji, 2001, vol. 9, p. 204). Il était endetté depuis qu'il avait acheté de la nourriture pour quarante mille dirhams, qu'il avait ensuite laissée ou donnée en aumône, la somme restant due. Il fut emprisonné; son fils Abd Allah paya plus tard trente mille dirhams pour le racheter (Tabaqat ibn Sa'd Khanji, 2001, vol. 9, p. 197). 204}. Il mourut un vendredi, lavé par Ayyub et Ibn Awn, cent jours après al-Hasan, en 110 AH {cite:tabaqat-ibn-sad-khanji-2001 vol. 9 p. 205}."
