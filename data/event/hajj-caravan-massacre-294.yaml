id: event/hajj-caravan-massacre-294
class: event
kind: massacre
label: { ar: "وقعتا قافلتي الحاج بالعقبة والطليح", en: "The Two Attacks on Pilgrim Caravans at al-'Aqaba and al-Talih", es: "Los dos ataques contra caravanas de peregrinos en al-'Aqaba y al-Talih", fr: "Les deux attaques contre les caravanes de pèlerins à al-'Aqaba et al-Talih" }
summary:
  ar: "في سنة أربع وتسعين ومائتين اعترض القرامطة قافلة الحاج في طريق مكة بالعقبة فقتلوهم وسبوا من النساء ما أرادوا واحتووا على ما في القافلة فأخذوا ما قيمته ألف ألف دينار، فأشخص السلطان أبا عبد الله الحسن بن داود الهاشمي الكاتب إلى الكوفة لتسريح الجيوش منها إلى القرمطي، ثم صار القرمطي إلى الشقوق فأقام بموضع يعرف بالطليح ينتظر القافلة الأخرى، فلما وافته حاربوه يومهم إلى الليل ثم عاودهم القتال حتى كان في اليوم الثالث عطش أهل القافلة وهم على غير ماء فتهافتوا ثم استسلموا فوُضع فيهم السيف فلم يقتل منهم إلا اليسير وأُخذ جميع ما في القافلة {cite:muntazam-ibn-al-jawzi p. 351-352}."
  en: "In 294 the Qarmatians fell on the pilgrim caravan at al-'Aqaba on the Mecca road — killed, enslaved women, took a million dinars' worth; the caliph sent al-Hasan ibn Dawud al-Hashimi to Kufa to dispatch armies. Then at al-Talih in the Shaquq they fought the next caravan for three days until the pilgrims, waterless, collapsed and surrendered; the sword was put to them and the whole caravan seized {cite:muntazam-ibn-al-jawzi p. 351-352}."
  es: "En el año 294, los cármatas atacaron la caravana de peregrinos en al-'Aqaba, en el camino a La Meca; mataron, esclavizaron a mujeres y se apoderaron de bienes por valor de un millón de dinares. El califa envió a al-Hasan ibn Dawud al-Hashimi a Kufa para que enviara ejércitos. Luego, en al-Talih, en Shaquq, lucharon contra la siguiente caravana durante tres días hasta que los peregrinos, sin agua, se desplomaron y se rindieron; les pusieron la espada encima y se apoderó de toda la caravana {cite:muntazam-ibn-al-jawzi p. 351-352}."
  fr: "En 294, les Qarmates attaquèrent la caravane de pèlerins à al-'Aqaba, sur la route de La Mecque. Ils massacrèrent des femmes, les réduisirent en esclavage et s'emparèrent d'un butin d'une valeur d'un million de dinars. Le calife envoya al-Hasan ibn Dawud al-Hashimi à Kufa pour y déployer des armées. Puis, à al-Talih, dans le Shaquq, ils combattirent la caravane suivante pendant trois jours, jusqu'à ce que les pèlerins, assoiffés, s'effondrent et se rendent. Ils furent passés au fil de l'épée et toute la caravane fut capturée (cf. Muntazam ibn al-Jawzi, p. 351-352)."
