label: { ar: "وقعتا قافلتي الحاج بالعقبة والطليح", en: "The Two Attacks on Pilgrim Caravans at al-'Aqaba and al-Talih" }
summary:
  ar: "في سنة أربع وتسعين ومائتين اعترض القرامطة قافلة الحاج في طريق مكة بالعقبة فقتلوهم وسبوا من النساء ما أرادوا واحتووا على ما في القافلة فأخذوا ما قيمته ألف ألف دينار، فأشخص السلطان أبا عبد الله الحسن بن داود الهاشمي الكاتب إلى الكوفة لتسريح الجيوش منها إلى القرمطي، ثم صار القرمطي إلى الشقوق فأقام بموضع يعرف بالطليح ينتظر القافلة الأخرى، فلما وافته حاربوه يومهم إلى الليل ثم عاودهم القتال حتى كان في اليوم الثالث عطش أهل القافلة وهم على غير ماء فتهافتوا ثم استسلموا فوُضع فيهم السيف فلم يقتل منهم إلا اليسير وأُخذ جميع ما في القافلة {cite:muntazam-ibn-al-jawzi p. 351-352}."
  en: "In 294 the Qarmatians fell on the pilgrim caravan at al-'Aqaba on the Mecca road — killed, enslaved women, took a million dinars' worth; the caliph sent al-Hasan ibn Dawud al-Hashimi to Kufa to dispatch armies. Then at al-Talih in the Shaquq they fought the next caravan for three days until the pilgrims, waterless, collapsed and surrendered; the sword was put to them and the whole caravan seized {cite:muntazam-ibn-al-jawzi p. 351-352}."
