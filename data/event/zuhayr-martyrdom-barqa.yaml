id: event/zuhayr-martyrdom-barqa
class: event
kind: battle
label: { ar: "استشهاد زهير بن قيس ببرقة", en: "The Martyrdom of Zuhayr ibn Qays at Barqa", es: "El martirio de Zuhayr ibn Qays en Barqa", fr: "Le martyre de Zuhayr ibn Qays à Barqa", ur: "برقہ میں زہیر بن قیس کی شہادت", tr: "Züheyr bin Kays'ın Berka'da şehadeti", id: "Kesyahidan Zuhair bin Qais di Barqa" }
summary:
  ar: "عند البلاذري: ولّى عبد العزيز بن مروان إفريقية زهير بن قيس البلوي ففتح توتس ثم انصرف إلى برقة فبلغه أن جماعة من الروم خرجوا من مراكب لهم فعاثوا فتوجه إليهم في جريدة خيل فلقيهم فاستشهد ومن معه فقُبر هناك وقبورهم تدعى قبور الشهداء."
  en: "In al-Baladhuri: Abd al-Aziz ibn Marwan gave Zuhayr ibn Qays al-Balawi Ifriqiya — he opened Tutus, then returned to Barqa, where word reached him that a body of Romans had come out of ships of theirs and were ravaging; he rode against them with a light cavalry band, met them, and was martyred with those with him — he was buried there, and their graves are called Qubur al-Shuhada."
  es: "En al-Baladhuri: Abd al-Aziz ibn Marwan le dio a Zuhayr ibn Qays al-Balawi Ifriqiya; abrió Tutus, luego regresó a Barqa, donde le llegó la noticia de que un grupo de romanos había salido de sus barcos y estaba saqueando; cabalgó contra ellos con una banda de caballería ligera, los encontró y fue martirizado con los que estaban con él; fue enterrado allí, y sus tumbas se llaman Qubur al-Shuhada."
  fr: "Dans al-Baladhuri: Abd al-Aziz ibn Marwan donna à Zuhayr ibn Qays al-Balawi Ifriqiya — il ouvrit Tutus, puis retourna à Barqa, où il apprit qu'un corps de Romains était sorti de leurs navires et ravageait; il chevaucha contre eux avec une bande de cavalerie légère, les rencontra et fut martyrisé avec ceux qui l'accompagnaient — il fut enterré là, et leurs tombes sont appelées Qubur al-Shuhada."
  ur: "البلادوری میں ہے: عبد العزیز ابن مروان نے زہیر بن قیس البلاوی کو افریقیہ دیا- اس نے طوس کو کھولا، پھر برقع واپس آیا، جہاں اسے یہ خبر پہنچی کہ رومیوں کا ایک جسم ان کے جہازوں سے نکل کر تباہ ہو رہا ہے۔ وہ ہلکے گھڑسواروں کے دستے کے ساتھ ان پر سوار ہوئے، ان سے ملے، اور اپنے ساتھ والوں کے ساتھ شہید ہوئے - وہ وہیں دفن ہوئے، اور ان کی قبروں کو قبور الشہداء کہا جاتا ہے۔"
  tr: "El-Baladhuri'ye göre: Abdül Aziz bin Mervan, Zuhair bin Kays el-Balawi'yi İfrikiye valisi olarak atadı. Tutsileri fethettikten sonra Barka'ya gitti. Bir grup Romalının gemilerinden çıkıp ortalığı karıştırdığı haberini aldı, bu yüzden bir süvari birliğiyle onlara doğru gitti ve onlarla karşılaştı. Kendisi ve yanındakiler şehit oldular ve orada defnedildiler; mezarlarına şehitler mezarı denir."
  id: "Menurut Al-Baladhuri: Abdul Aziz bin Marwan menunjuk Zuhair bin Qais Al-Balawi sebagai gubernur Ifriqiya. Ia menaklukkan Tutsi dan kemudian pergi ke Barqa. Ia diberitahu bahwa sekelompok orang Romawi telah keluar dari kapal mereka dan menimbulkan kekacauan, jadi ia pergi menemui mereka dengan detasemen kavaleri dan menemui mereka. Ia dan orang-orang yang bersamanya gugur sebagai syuhada dan dimakamkan di sana, dan makam mereka disebut makam para syuhada."
