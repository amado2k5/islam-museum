summary:
  ar: "عند البلاذري: ولّى عبد العزيز بن مروان إفريقية زهير بن قيس البلوي ففتح توتس ثم انصرف إلى برقة فبلغه أن جماعة من الروم خرجوا من مراكب لهم فعاثوا فتوجه إليهم في جريدة خيل فلقيهم فاستشهد ومن معه فقُبر هناك وقبورهم تدعى قبور الشهداء."
  en: "In al-Baladhuri: Abd al-Aziz ibn Marwan gave Zuhayr ibn Qays al-Balawi Ifriqiya — he opened Tutus, then returned to Barqa, where word reached him that a body of Romans had come out of ships of theirs and were ravaging; he rode against them with a light cavalry band, met them, and was martyred with those with him — he was buried there, and their graves are called Qubur al-Shuhada."
