label: {ar: "كتبة قريش وأهل بيت النبي", en: "The Scribes of Quraysh and the Prophet's House", es: "Los escribas de Quraysh y la casa del Profeta", fr: "Les scribes de Quraysh et la maison du Prophète", ur: "قریش کے فقیہ اور رسول کا گھر", tr: "Kureyş kâtipleri ve Peygamber ailesi", id: "Para ahli Taurat Quraisy dan keluarga Nabi"}
summary:
  ar: "قال أبو بكر بن عبد الله بن أبي جهم العدوي دخل الإسلام وفي قريش سبعة عشر رجلاً كلهم يكتب عمر بن الخطاب وعلي بن أبي طالب وعثمان بن عفان وأبو عبيدة بن الجراح وطلحة ويزيد بن أبي سفيان وأبو حذيفة بن عتبة بن ربيعة وحاطب بن عمرو وأبو سلمة بن عبد الأسد المخزومي وأبان بن سعيد بن العاص وأخوه خالد بن سعيد وعبد الله بن سعد بن أبي سرح العامري وحويطب بن عبد العزى العامري وأبو سفيان بن حرب ومعاوية بن أبي سفيان وجهم بن الصلت ومن حلفاء قريش العلاء بن الحضرمي وقال للشفاء بنت عبد الله العدوية وكانت كاتبة في الجاهلية ألا تعلمين حفصة رقية النملة كما علمتها الكتابة وكانت حفصة تكتب وأم كلثوم بنت عقبة تكتب وقالت عائشة بنت سعد علمني أبي الكتاب وكانت كريمة بنت المقداد تكتب وكانت عائشة تقرأ المصحف ولا تكتب وأم سلمة تقرأ ولا تكتب وكان أول من كتب لرسول الله مقدمه المدينة أبي بن كعب الأنصاري فإذا لم يحضر كتب زيد بن ثابت وكانا يكتبان الوحي بين يديه وكتبه إلى من يكاتب من الناس وأول من كتب له من قريش عبد الله بن سعد بن أبي سرح ثم ارتد ورجع إلى مكة وكان يغير ما يملى عليه فنزلت فيه آية الأنعام في شأن من ادعى أنه يأتي بمثل ما يوحى."
  en: "Abu Bakr ibn Abdallah ibn Abi Jahm al-'Adawi counted the literate of Quraysh when Islam came — seventeen men: Umar, Ali, Uthman, Abu Ubayda, Talha, Yazid ibn Abi Sufyan, Abu Hudhayfa ibn 'Utba, Hatib ibn 'Amr, Abu Salama ibn Abd al-Asad, Aban ibn Sa'id and his brother Khalid ibn Sa'id, Abdallah ibn Sa'd ibn Abi Sarh, Huwaytib ibn Abd al-'Uzza, Abu Sufyan ibn Harb, Mu'awiya, Juhm ibn al-Salt — and of Quraysh's allies al-A'la' ibn al-Hadrami. Al-Shifa' bint Abdallah, a Jahiliya scribe, was told 'teach Hafsa the ant-charm as you taught her writing'; Hafsa wrote, Umm Kulthum bint 'Uqba wrote, A'isha bint Sa'd said 'my father taught me', Karima bint al-Miqdad wrote — while A'isha and Umm Salama read the mushaf but did not write. First to write for the Prophet at Medina was Ubayy ibn Ka'b, and when absent Zayd ibn Thabit — both wrote revelation and correspondence before him; first Qurashi scribe was Abdallah ibn Sa'd ibn Abi Sarh, who then apostatized to Mecca having altered the dictation, and in his case al-An'am's verse came down on the one who claims to bring the like of the revelation."
  es: "Abu Bakr ibn Abdallah ibn Abi Jahm al-'Adawi contó los Quraysh alfabetizados cuando llegó el Islam: diecisiete hombres: Umar, Ali, Uthman, Abu Ubayda, Talha, Yazid ibn Abi Sufyan, Abu Hudhayfa ibn 'Utba, Hatib ibn 'Amr, Abu Salama ibn Abd al-Asad, Aban ibn Sa'id y sus hermano Khalid ibn Sa'id, Abdallah ibn Sa'd ibn Abi Sarh, Huwaytib ibn Abd al-'Uzza, Abu Sufyan ibn Harb, Mu'awiya, Juhm ibn al-Salt - y de los aliados de Quraysh al-A'la' ibn al-Hadrami. Al-Shifa' bint Abdallah, un escriba de la época Jahiliya, recibió la instrucción de \"enseñar a Hafsa el conjuro de la hormiga como le enseñaste a escribir\"; Hafsa escribió, Umm Kulthum bint 'Uqba escribió, A'isha bint Sa'd dijo \"mi padre me enseñó\", Karima bint al-Miqdad escribió, mientras que A'isha y Umm Salama leyeron el mushaf pero no escribieron. El primero en escribir para el Profeta en Medina fue Ubayy ibn Ka'b, y cuando estaba ausente Zayd ibn Thabit; ambos escribieron la revelación y la correspondencia antes que él. El primer escriba Qurashi fue Abdallah ibn Sa'd ibn Abi Sarh, quien luego apostó a La Meca tras alterar el dictado, y en su caso el versículo de al-An'am descendió sobre aquel que afirma traer semejante revelación."
  fr: "Abou Bakr ibn Abdallah ibn Abi Jahm al-'Adawi a dénombré dix-sept hommes sachant lire Quraysh à l'arrivée de l'Islam: Umar, Ali, Uthman, Abu Ubayda, Talha, Yazid ibn Abi Sufyan, Abu Hudhayfa ibn 'Utba, Hatib ibn 'Amr, Abu Salama ibn Abd al-Asad, Aban ibn Sa'id et son frère Khalid ibn. Sa'id, Abdallah ibn Sa'd ibn Abi Sarh, Huwaytib ibn Abd al-'Uzza, Abu Sufyan ibn Harb, Mu'awiya, Juhm ibn al-Salt — et des alliés de Quraysh al-A'la' ibn al-Hadrami. Al-Shifa' bint Abdallah, scribe de l'époque préislamique (Jahiliya), reçut l'ordre d'enseigner à Hafsa le sortilège de protection contre les fourmis, comme elle lui avait enseigné l'écriture. Hafsa écrivit, Umm Kulthum bint 'Uqba écrivit également, A'isha bint Sa'd déclara: « Mon père me l'a enseigné », et Karima bint al-Miqdad écrivit. A'isha et Umm Salama lurent le mushaf sans toutefois écrire. Le premier scribe du Prophète à Médine fut Ubayy ibn Ka'b, et en son absence, Zayd ibn Thabit. Tous deux écrivirent la révélation et la correspondance avant lui. Le premier scribe qurashi fut Abdallah ibn Sa'd ibn Abi Sarh, qui apostasia ensuite à La Mecque après avoir altéré la dictée. Dans son cas, le verset d'al-An'am s'abattit sur celui qui prétendait apporter une révélation semblable à la sienne."
  ur: "ابو بکر بن عبداللہ ابن ابی جہم العدوی نے قریش کے پڑھے لکھے لوگوں کو شمار کیا جب اسلام آیا - سترہ آدمی: عمر، علی، عثمان، ابو عبیدہ، طلحہ، یزید بن ابی سفیان، ابو حذیفہ بن عتبہ، حاطب بن عمرو، عبد بن سعد اور ان کے ابو سالاب۔ بھائی خالد بن سعید، عبداللہ بن سعد ابن ابی سرح، حویتب بن عبد العزی، ابو سفیان بن حرب، معاویہ، جہم بن الصلت اور قریش کے حلیف العلا بن الحضرمی۔ الشفاء بنت عبداللہ، جو ایک جاہلیہ کاتب ہیں، سے کہا گیا کہ 'حفصہ کو چیونٹی کی دلکشی سکھاؤ جیسا کہ تم نے اسے لکھنا سکھایا'۔ حفصہ نے لکھا، ام کلثوم بنت عقبہ نے لکھا، عائشہ بنت سعد نے کہا کہ میرے والد نے مجھے پڑھایا، کریمہ بنت المقداد نے لکھا - جب کہ عائشہ اور ام سلمہ نے مصحف پڑھا لیکن نہیں لکھا۔ مدینہ میں نبی کے لیے سب سے پہلے لکھنے والے ابی بن کعب تھے، اور جب زید بن ثابت غائب تھے - دونوں نے آپ کے سامنے وحی اور خط و کتابت کی۔ پہلا قریشی کاتب عبداللہ بن سعد ابن ابی سرح تھا، جس نے پھر حکم کو تبدیل کر کے مکہ سے مرتد ہو گیا، اور اس کے معاملے میں الانعام کی آیت اس شخص پر نازل ہوئی جو وحی کی طرح لانے کا دعویٰ کرتا ہے۔"
  tr: "Ebu Bekir ibn Abdullah ibn Ebi Cehm el-Adawi şöyle dedi: \"İslam, Kureyş'e on yedi kişi varken girdi ve bunların hepsi yazabiliyordu: Ömer ibn el-Hattab, Ali ibn Abi Talib, Osman ibn Affan, Ebu Ubeyde ibn el-Jarrah, Talha, Yezid ibn Abi Süfyan, Ebu Huzeyfe ibn Utba ibn Rabi'a, Hatib ibn Amr, Ebu Seleme ibn Abd el-Esad el-Makhzumi, Eban ibn Sa'id ibn el-As ve kardeşi Halid ibn Sa'id, Abdullah ibn Sa'd ibn Ebî Serh el-Amiri, Huveytib ibn Abd el-Uzza el-Amiri, Ebu Süfyan ibn Harb, Muaviye ibn Ebî Süfyan, Cehm ibn el-Salt ve Kureyş'in müttefikleri arasında Ala' ibn el-Hadrami de vardı. Kâtip olan Bint Abdullah el-Adeviyye İslam öncesi dönemde, “Hafsa’ya yazı yazmayı öğrettiğin gibi, karınca ısırığı için dua etmeyi de neden öğretmiyorsun?” diye sorulurdu. Hafsa yazabiliyordu, Ümmü Kulsum bint Ukba da öyle. Ayşe bint Sa’d, “Babam bana yazmayı öğretti” derdi. Kerime bint el-Mikdad da yazabiliyordu, Ayşe de öyle. Ayşe Kur’an’ı okuyabiliyordu ama yazamıyordu, Ümmü Seleme de okuyabiliyordu ama yazamıyordu. Allah Resulü’nün Medine’ye gelişinde onun için ilk yazan kişi Ubeyy ibn Ka’b el-Ensari idi. Eğer o yoksa, Zeyd ibn Sabit yazardı ve ikisi de yazabiliyordu. Vahiy onun elindeydi ve halktan kendisine mektup yazanlara mektuplar yazdı. Kureyş’ten ona mektup yazan ilk kişi Abdullah bin Saad bin Ebu Sarh idi. Sonra o dinden döndü ve Mekke’ye geri döndü ve kendisine dikte edilenleri değiştirirdi. Bu yüzden En'am suresinde, kendisine vahyedilene benzer bir şey üretebileceğini iddia eden kişi hakkında şu ayet indirilmiştir:"
  id: "Abu Bakar bin Abdullah bin Abi Jahm al-Adawi berkata: “Islam masuk ke suku Quraisy ketika berjumlah tujuh belas orang, semuanya bisa menulis: Umar bin al-Khattab, Ali bin Abi Thalib, Utsman bin Affan, Abu Ubayda bin al-Jarrah, Talha, Yazid bin Abi Sufyan, Abu Hudhayfa bin Utba bin Rabi’ah, Hatib ibn Amr, Abu Salama ibn Abd al-Asad al-Makhzumi, Aban ibn Sa’id ibn al-As dan saudaranya Khalid ibn Sa’id, Abdullah ibn Sa’d ibn Abi Sarh al-Amiri, Huwaytib ibn Abd al-Uzza al-Amiri, Abu Sufyan ibn Harb, Mu’awiya ibn Abi Sufyan, Jahm ibn al-Salt, dan di antara sekutu Salah seorang dari kaum Quraisy adalah Ala’ ibn al-Hadrami. Ia berkata kepada al-Shifa’ bint Abdullah al-Adawiyya, yang merupakan seorang juru tulis di era pra-Islam, ‘Mengapa kamu tidak mengajari Hafsa mantra untuk gigitan semut, seperti yang telah kamu ajarkan padanya menulis?’ Hafsa bisa menulis, begitu pula Umm Kulthum bint Uqba. Aisyah bint Sa’d berkata, ‘Ayahku mengajariku menulis.’ Karima bint al-Miqdad bisa menulis, begitu pula Aisyah. Ia bisa membaca Al-Qur'an tetapi tidak bisa menulis, dan Umm Salama bisa membaca tetapi tidak bisa menulis. Orang pertama yang menulis untuk Rasulullah ketika beliau tiba di Madinah adalah Ubayy ibn Ka’b al-Ansari. Jika ia tidak hadir, Zayd ibn Thabit akan menulis, dan keduanya bisa menulis.” Wahyu ada di tangannya, dan beliau menulis kepada orang-orang yang berkorespondensi dengannya dari kalangan masyarakat. Orang pertama dari suku Quraisy yang menulis surat kepadanya adalah Abdullah bin Saad bin Abi Sarh. Kemudian ia murtad dan kembali ke Mekah, dan ia biasa mengubah apa yang didiktekan kepadanya. Maka ayat Al-An'am diturunkan mengenai dirinya, mengenai orang yang mengaku dapat menghasilkan sesuatu yang serupa dengan apa yang telah diturunkan."
