id: event/siege-of-hadra
class: event
kind: siege
label: { ar: "نزول سابور الجنود على الحضر", en: "Shapur's siege of al-Hadra", es: "El asedio de al-Hadra por parte de Shapur", fr: "Le siège d'al-Hadra par Shapur", ur: "شاپور کا الحدرہ کا محاصرہ", tr: "Şapur'un askerleri şehre saldırdı.", id: "Para prajurit Shapur menyerbu kota itu." }
summary:
  ar: "نزل سابور الجنود على حصن الحضر ملك الضيزن التنوخي فأقام عليه شهراً لا يجد سبيلاً إلى فتحه، حتى أرسلت إليه النضيرة بنت الضيزن وقد هويته أن ينثر تبناً في نهر الثرثار الذي في أعلى الحصن فيتبعه فانظر أين يدخل فأدخل الرجال منه، ففعل فلم يشعر أهل الحصن إلا وأصحاب سابور معهم فيه، فقتل الضيزن ومن معه وأمر بهدم الحصن، وقد كان الضيزن كثير الجنود مهادناً للروم يغير رجاله على العراق والسواد {cite:muruj-al-dhahab p. 552-554}."
  en: "Shapur I's month-long investment of al-Dayzan's Hatra — broken only when the lovesick al-Nadira told him to track thrown straw up the Tharthar's hidden channel into the fortress; its king slain, Hadra razed, the tale became poetry {cite:muruj-al-dhahab p. 552-554}."
  es: "La inversión de un mes de Shapur I en Hatra, la fortaleza de al-Dayzan, se rompió solo cuando el enamorado al-Nadira le dijo que siguiera el rastro de la paja arrojada por el canal oculto de Tharthar hasta la fortaleza; su rey fue asesinado, Hatra arrasada, y la historia se convirtió en poesía {cite:muruj-al-dhahab p. 552-554}."
  fr: "L'investissement d'un mois de Shapur I dans le Hatra d'al-Dayzan — interrompu seulement lorsque al-Nadira, épris, lui dit de suivre la paille jetée dans le canal caché du Tharthar jusqu'à la forteresse; son roi tué, Hadra rasée, le récit devint poésie {cite:muruj-al-dhahab p. 552-554}."
  ur: "شاپور اول کی ال دیزان کی ہترا کی مہینہ بھر کی سرمایہ کاری - تب ہی ٹوٹ گئی جب نادیرہ نے اسے تھرتھر کے چھپے ہوئے نالے کو قلعے میں پھینکنے کے لیے کہا۔ اس کا بادشاہ مارا گیا، حدرہ کا خاتمہ ہوا، کہانی شاعری بن گئی 552-554}۔"
  tr: "Şapur'un askerleri, El-Deyzan El-Tanukhi kralı El-Hadhar'ın kalesine saldırdılar ve Şapur, kaleyi fethetmenin bir yolunu bulamadan bir ay boyunca orada kaldı. Ta ki El-Deyzan'ın kızı El-Nadhira, Şapur'a çok sevdiği bir mesaj gönderene kadar: Kalenin tepesindeki Terhar Nehri'ne saman serpmesini, nehri takip edip nereye girdiğini görmesini ve oradan adamlarını içeri almasını emretti. Şapur da öyle yaptı ve kale halkı, Şapur'un adamları içeri girene kadar durumu fark etmedi. Bunun üzerine Şapur, El-Deyzan'ı ve yanındakileri öldürdü ve kalenin yıkılmasını emretti. El-Deyzan'ın çok sayıda askeri vardı ve Romalılarla iyi ilişkileri bulunuyordu; adamları Irak ve Sawad'a baskınlar düzenlerdi. {cite:muruj-al-dhahab s. 552-554}"
  id: "Tentara Shapur menyerbu benteng Al-Hadhar, raja Al-Dayzan Al-Tanukhi, dan ia tinggal di sana selama sebulan tanpa menemukan cara untuk menaklukkannya, sampai Al-Nadhira, putri Al-Dayzan, mengirimkan pesan yang sangat disukainya, untuk menaburkan jerami di Sungai Tharthar, yang berada di puncak benteng, dan mengikutinya untuk melihat ke mana ia bermuara, lalu membiarkan pasukan masuk dari sana. Maka ia melakukannya, dan penduduk benteng tidak menyadarinya sampai pasukan Shapur berada di dalam benteng bersama mereka. Maka ia membunuh Al-Dayzan dan orang-orang yang bersamanya dan memerintahkan benteng itu dihancurkan. Al-Dayzan memiliki banyak tentara dan memiliki hubungan baik dengan Romawi, dan pasukannya akan menyerang Irak dan Sawad. {cite:muruj-al-dhahab hlm. 552-554}."
