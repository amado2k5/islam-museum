summary:
  ar: "نزل سابور الجنود على حصن الحضر ملك الضيزن التنوخي فأقام عليه شهراً لا يجد سبيلاً إلى فتحه، حتى أرسلت إليه النضيرة بنت الضيزن وقد هويته أن ينثر تبناً في نهر الثرثار الذي في أعلى الحصن فيتبعه فانظر أين يدخل فأدخل الرجال منه، ففعل فلم يشعر أهل الحصن إلا وأصحاب سابور معهم فيه، فقتل الضيزن ومن معه وأمر بهدم الحصن، وقد كان الضيزن كثير الجنود مهادناً للروم يغير رجاله على العراق والسواد {cite:muruj-al-dhahab p. 552-554}."
  en: "Shapur I's month-long investment of al-Dayzan's Hatra — broken only when the lovesick al-Nadira told him to track thrown straw up the Tharthar's hidden channel into the fortress; its king slain, Hadra razed, the tale became poetry {cite:muruj-al-dhahab p. 552-554}."
