label: { ar: "فتح فسا ودارابجرد", en: "Conquest of Fasa and Darabjird", es: "Conquista de Fasa y Darabjird", fr: "Conquête de Fasa et Darabjird", ur: "فصہ اور درابجرد کی فتح", tr: "Fatah Fasa ve Darabjerd", id: "Fatah Fasa dan Darabjerd" }
summary:
  ar: "قصد سارية بن زنيم فسا ودارابجرد، فحاصرهم، ثم استمدوا فتجمعت إليهم أكراد فارس، فوقعت معركة عظيمة، وقد رأى عمر المعركة في منامه ونادى الناس، فأمر سارية بالجبل فهزم الله العدو {cite:tabari-tarikh-abu-al-fadl j.4 p.178}."
  en: "Sariya ibn Zunaym marched on Fasa and Darabjird and besieged them. They asked for reinforcements, the Kurds of Fars gathered to them, and a great battle took place. Umar had seen the battle in a dream and called out to the people; he ordered Sariya to the mountain, and God routed the enemy {cite:tabari-tarikh-abu-al-fadl j.4 p.178}."
  es: "Sariya ibn Zunaym marchó sobre Fasa y Darabjird y las sitió. Pidieron refuerzos, los kurdos de Fars se unieron a ellos y se libró una gran batalla. Umar había visto la batalla en un sueño y llamó a la gente; ordenó a Sariya que se refugiara en la montaña, y Dios derrotó al enemigo {cite:tabari-tarikh-abu-al-fadl j.4 p.178}."
  fr: "Sariya ibn Zunaym marcha sur Fasa et Darabjird et les assiégea. Ils demandèrent des renforts, les Kurdes du Fars se rallièrent à eux et une grande bataille eut lieu. Umar avait vu la bataille en songe et appela le peuple; il ordonna à Sariya de se réfugier dans la montagne, et Dieu mit en déroute l'ennemi."
  ur: "ساریہ بن زنیم نے فصہ اور درابجرد پر چڑھائی کی اور ان کا محاصرہ کیا۔ انہوں نے کمک طلب کی، فارس کے کرد ان کے پاس جمع ہوئے، اور ایک زبردست جنگ ہوئی۔ عمر نے خواب میں جنگ دیکھی اور لوگوں کو پکارا۔ اس نے ساریہ کو پہاڑ پر جانے کا حکم دیا، اور خدا نے دشمن کو شکست دے دی۔"
  tr: "Sariya bin Zunaim, Fasa ve Darabcird'e doğru ilerleyerek onları kuşattı. Bunun üzerine takviye kuvvet aradılar ve İran Kürtleri onlara katıldı; büyük bir savaş çıktı. Ömer, savaşı rüyasında gördü ve halkı çağırdı; bunun üzerine Sariya'ya dağa çıkmasını emretti ve Allah düşmanı yenilgiye uğrattı. {cite:tabari-tarikh-abu-al-fadl j.4 p.178}"
  id: "Sariya bin Zunaim menuju ke Fasa dan Darabjird, dan mengepung mereka. Kemudian mereka meminta bala bantuan, dan orang-orang Kurdi Persia berkumpul bersama mereka, dan terjadilah pertempuran besar. Umar melihat pertempuran itu dalam mimpinya dan menyerukan kepada orang-orang, lalu ia memerintahkan Sariya ke gunung, dan Allah mengalahkan musuh. {cite:tabari-tarikh-abu-al-fadl j.4 p.178}."
