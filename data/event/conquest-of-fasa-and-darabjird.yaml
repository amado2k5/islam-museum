label: { ar: "فتح فسا ودارابجرد", en: "Conquest of Fasa and Darabjird" }
summary:
  ar: "قصد سارية بن زنيم فسا ودارابجرد، فحاصرهم، ثم استمدوا فتجمعت إليهم أكراد فارس، فوقعت معركة عظيمة، وقد رأى عمر المعركة في منامه ونادى الناس، فأمر سارية بالجبل فهزم الله العدو {cite:tabari-tarikh-abu-al-fadl j.4 p.178}."
  en: "Sariya ibn Zunaym marched on Fasa and Darabjird and besieged them. They asked for reinforcements, the Kurds of Fars gathered to them, and a great battle took place. Umar had seen the battle in a dream and called out to the people; he ordered Sariya to the mountain, and God routed the enemy {cite:tabari-tarikh-abu-al-fadl j.4 p.178}."
