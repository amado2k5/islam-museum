label: { ar: "وصية عبد الله بن مسعود ومرضه الأخير ومورثه", en: "The testament, last illness and estate of Abd Allah ibn Mas'ud", ur: "عبد اللہ بن مسعود کی وصیت، آخری مرض اور ترکہ", es: "El testamento, la última enfermedad y el patrimonio de Abd Allah ibn Mas'ud.", fr: "Testament, dernière maladie et succession d'Abd Allah ibn Mas'ud", tr: "Abdullah ibn Mesud'un vasiyeti, son hastalığı ve varisi", id: "Wasiat Abdullah ibn Masoud, penyakit terakhirnya, dan ahli warisnya." }
summary:
  ar: "كتب ابن مسعود وصيته: أن وصيته إلى الله وإلى الزبير بن العوام وإلى ابنه عبد الله بن الزبير، وأنهما في حل مما قضيا في تركته، وأن نساءه لا يُزوَّجن إلا بإذنهما {cite:siyar-alam-nubala scan vol. 2 p. 443}. ويروى أن عثمان عاده في مرضه فسأله عما يشتكي، فقال ذنوبي، وعما يشتهي، فقال رحمة ربي، وعرض عليه طبيباً وعطاءً فرفضهما {cite:siyar-alam-nubala scan vol. 2 p. 443}. ويذكر الذهبي أنه ترك تسعين ألف مثقال سوى رقيق ومتاع وماشية {cite:siyar-alam-nubala scan vol. 2 p. 442}. ومات بالمدينة ودُفن بالبقيع سنة اثنتين وثلاثين، وقيل ثلاث وثلاثين {cite:siyar-alam-nubala scan vol. 2 p. 444}."
  en: "Ibn Mas'ud wrote that his testament was to God and to al-Zubayr ibn al-Awwam and his son Abd Allah ibn al-Zubayr, that both were free of blame for what they decided in his estate, and that none of his women was to be married off without their leave {cite:siyar-alam-nubala scan vol. 2 p. 443}. In his illness Uthman visited him and asked what he complained of; he said his sins, and of what he desired, the mercy of his Lord, and he declined both a physician and a stipend {cite:siyar-alam-nubala scan vol. 2 p. 443}. Al-Dhahabi records that he left ninety thousand mithqals besides slaves, goods and livestock {cite:siyar-alam-nubala scan vol. 2 p. 442}. He died in Medina and was buried in al-Baqi' in 32 AH, or 33 by other reports {cite:siyar-alam-nubala scan vol. 2 p. 444}."
  ur: "ابن مسعود نے وصیت لکھی کہ ان کی وصیت اللہ کی طرف اور زبیر بن العوام اور ان کے بیٹے عبد اللہ بن زبیر کی طرف ہے، ان کے ترکے میں جو فیصلہ وہ دونوں کریں اس میں وہ ذمہ داری سے بری ہیں، اور ان کی عورتوں کا نکاح ان کی اجازت کے بغیر نہ کیا جائے {cite:siyar-alam-nubala scan vol. 2 p. 443}۔ مرض میں عثمان عیادت کو آئے اور پوچھا کہ کیا شکایت ہے، کہا اپنے گناہ، اور کیا چاہتے ہیں، کہا اپنے رب کی رحمت؛ طبیب اور وظیفے کی پیشکش انھوں نے رد کر دی {cite:siyar-alam-nubala scan vol. 2 p. 443}۔ ذہبی لکھتے ہیں کہ انھوں نے نوے ہزار مثقال چھوڑے، علاوہ غلاموں، سامان اور مویشی کے {cite:siyar-alam-nubala scan vol. 2 p. 442}۔ وہ مدینہ میں فوت ہوئے اور ۳۲ ہجری میں بقیع میں دفن ہوئے، اور دوسری روایات میں ۳۳ ہجری {cite:siyar-alam-nubala scan vol. 2 p. 444}۔"
  es: "Ibn Mas'ud escribió que su testamento fue para Dios y para al-Zubayr ibn al-Awwam y su hijo Abd Allah ibn al-Zubayr, que ambos estaban libres de culpa por lo que decidieron en su patrimonio, y que ninguna de sus mujeres debía ser casada sin su permiso {cite:siyar-alam-nubala scan vol. 2 p. 443}. En su enfermedad, Uthman lo visitó y le preguntó de qué se quejaba; él dijo que de sus pecados, y de lo que deseaba, la misericordia de su Señor, y rechazó tanto un médico como un estipendio {cite:siyar-alam-nubala scan vol. 2 p. 443}. Al-Dhahabi registra que dejó noventa mil mithqals además de esclavos, bienes y ganado {cite:siyar-alam-nubala scan vol. 2 p. 442}. Murió en Medina y fue enterrado en al-Baqi' en el año 32 de la Hégira, o en el 33 según otros informes {cite:siyar-alam-nubala scan vol. 2 p. 444}."
  fr: "Ibn Mas'ud écrivit que son testament était adressé à Dieu, à al-Zubayr ibn al-Awwam et à son fils Abd Allah ibn al-Zubayr, les dégageant de tout reproche quant à la gestion de ses biens, et stipulant qu'aucune de ses femmes ne devait être mariée sans leur consentement (Siyar-alam-nubala, vol. 2, p. 443). Durant sa maladie, Uthman lui rendit visite et lui demanda de quoi il se plaignait; il évoqua ses péchés et, quant à lui, implora la miséricorde de son Seigneur. Il refusa les services d'un médecin ainsi qu'une pension (Siyar-alam-nubala, vol. 2, p. 443). Al-Dhahabi rapporte qu'il laissa quatre-vingt-dix mille mithqals, outre des esclaves, des biens et du bétail (Siyar-alam-nubala, vol. 2, p. 442). Il mourut à Médine et fut enterré à al-Baqi' en 32 AH, ou 33 selon d'autres sources {cite:siyar-alam-nubala scan vol. 2 p. 444}."
  tr: "İbn Mes'ud vasiyetini şöyle yazdı: \"Vasiyetim Allah'a, el-Zübeyr ibn el-Evvem'e ve oğlu Abdullah ibn el-Zübeyr'e aittir. Mal varlığıyla ilgili yapacakları şeylerden sorumlu tutulamazlar ve eşleri ancak onların izniyle evlenebilir.\" Rivayet edilir ki, Osman hastalığı sırasında onu ziyaret etmiş ve ne çektiğini sormuştur. İbn Mes'ud, \"Günahlarımdan\" diye cevap vermiştir. Osman daha sonra ne istediğini sormuş, İbn Mes'ud ise \"Rabbimin rahmetini\" diye cevap vermiştir. Osman ona bir hekim ve bir hediye teklif etmiş, ancak İbn Mes'ud bunları reddetmiştir. El-Dhahabi, İbn Mes'ud'un doksan bin miskalın yanı sıra köleler, mallar ve hayvanlar bıraktığını belirtir. Medine'de vefat etmiş ve otuz iki veya otuz üç yılında el-Baki'ye defnedilmiştir."
  id: "Ibnu Mas'ud menulis wasiatnya: \"Wasiatku ditujukan kepada Allah, kepada al-Zubayr ibn al-'Awwam, dan kepada putranya 'Abdullah ibn al-Zubayr. Mereka dibebaskan dari segala tanggung jawab atas apa yang mereka lakukan dengan hartanya, dan istri-istrinya tidak boleh dinikahi kecuali dengan izin mereka.\" Diriwayatkan bahwa Utsman mengunjunginya saat sakit dan bertanya apa yang dideritanya. Ia menjawab, \"Dosa-dosaku.\" Utsman kemudian bertanya apa yang diinginkannya, dan ia menjawab, \"Rahmat Tuhanku.\" Utsman menawarkannya seorang tabib dan hadiah, tetapi ia menolaknya. Al-Dhahabi menyebutkan bahwa ia meninggalkan sembilan puluh ribu mithqal, selain budak, barang-barang, dan ternak. Ia meninggal di Madinah dan dimakamkan di al-Baqi' pada tahun tiga puluh dua, atau dikatakan juga, tiga puluh tiga."
