id: "event/amiri-of-banu-dhib-and-jafar-ibn-ahmad-al-hamdani-are-killed-in-the-fighting-at-the-house-295"
class: event
kind: other
label:
  ar: "مقتل محمد بن عبيد الله العامري من بني ذئب وجعفر بن أحمد الهمداني في القتال عند الدار، 295هـ"
  en: "The Amiri of Banu Dhib, Muhammad ibn Ubaydallah, and Jafar ibn Ahmad al-Hamdani are killed in the fighting at the house, 295 AH, p. 373"
  ur: "بنو ذئب کے عامری محمد بن عبیداللہ اور جعفر بن احمد الہمدانی کا گھر کے پاس لڑائی میں قتل، 295ھ، ص373"
  es: "El Amiri de Banu Dhib, Muhammad ibn Ubaydallah, y Jafar ibn Ahmad al-Hamdani mueren en la lucha en la casa, 295 AH, pág. 373."
  fr: "L'émir de Banu Dhib, Muhammad ibn Ubaydallah, et Jafar ibn Ahmad al-Hamdani sont tués lors des combats à la maison, 295 AH, p. 373"
summary:
  ar: "قاتل محمد بن عبيد الله العامري، أحد بني ذئب، وهو غير أبي جعفر، يقبل ويدبر حتى قتل. ثم حمل جعفر بن أحمد الهمداني على القوم، فأثخنوه بالنبل والحجارة، واقتطعوه دون أصحابه فقتل."
  en: "Muhammad ibn Ubaydallah al-Amiri, one of Banu Dhib, fought advancing and retreating until he was killed. He is a different man from Abu Ja'far, who has the same father's name. Then Jafar ibn Ahmad al-Hamdani charged the enemy, was pelted with arrows and stones, was cut off from his companions, and was killed."
  ur: "محمد بن عبیداللہ العامری، جو بنو ذئب میں سے تھے، آگے بڑھتے اور پیچھے ہٹتے لڑتے رہے یہاں تک کہ شہید ہوئے۔ یہ ابو جعفر نہیں ہیں بلکہ ایک الگ شخص ہیں جن کے والد کا نام بھی یہی ہے۔ پھر جعفر بن احمد الہمدانی دشمن پر ٹوٹ پڑے، ان پر تیر اور پتھر برسائے گئے، وہ اپنے ساتھیوں سے کٹ گئے اور شہید ہو گئے۔"
  es: "Muhammad ibn Ubaydallah al-Amiri, de Banu Dhib, luchó avanzando y retrocediendo hasta que murió. Es un hombre distinto de Abu Ja'far, que comparte el mismo nombre paterno. Luego, Jafar ibn Ahmad al-Hamdani cargó contra el enemigo, fue apedreado y herido, quedó separado de sus compañeros y murió."
  fr: "Muhammad ibn Ubaydallah al-Amiri, un des Banu Dhib, combattit en avançant et en reculant jusqu'à sa mort. Il ne faut pas le confondre avec Abu Ja'far, qui portait le même nom de père. Ensuite, Jafar ibn Ahmad al-Hamdani chargea l'ennemi, fut criblé de flèches et de pierres, séparé de ses compagnons et tué."
