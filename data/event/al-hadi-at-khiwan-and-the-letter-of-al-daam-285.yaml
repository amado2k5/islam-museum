id: event/al-hadi-at-khiwan-and-the-letter-of-al-daam-285
class: event
kind: other
label:
  ar: كتاب الدعام بن إبراهيم إلى الهادي ورده، ودخول الهادي خيوان وإصلاحه بين همدان، جمادى الأولى 285هـ
  en: The letter of al-Da'am ibn Ibrahim to al-Hadi and his reply, and al-Hadi's entry into Khiwan and settlement among Hamdan, Jumada I 285 AH
  ur: دعام بن ابراہیم کا ہادی کو خط اور ان کا جواب، اور ہادی کا خیوان میں داخلہ اور ہمدان میں صلح، جمادی الاولیٰ 285ھ
  es: "La carta de al-Da'am ibn Ibrahim a al-Hadi y su respuesta, y la entrada de al-Hadi en Khiwan y su asentamiento entre los Hamdan, Jumada I 285 AH."
  fr: "Lettre d'al-Da'am ibn Ibrahim à al-Hadi et sa réponse, entrée d'al-Hadi à Khiwan et installation chez Hamdan, Jumada I 285 AH"
  tr: "Da'am ibn İbrahim'in Hadi'ye yazdığı mektup ve Hadi'nin cevabı, Hadi'nin Hayvan'a girişi ve Hamdan ile barışması, Cemâdî Ula 285 Hicri"
  id: "Surat al-Da'am ibn Ibrahim kepada al-Hadi dan balasannya, serta masuknya al-Hadi ke Khaywan dan rekonsiliasinya dengan Hamdan, Jumada al-Ula 285 H."
summary:
  ar: كتب الدعام بن إبراهيم، من ملوك اليمن المتغلبة، إلى الهادي يسأله أن يوليه البلد الذي هو فيه، فأجابه الهادي أنه لا يوليه إلا على الحكم بكتاب الله وسنة رسوله واتباع ما هم عليه، وتبادلا كتباً كثيرة؛ ثم خرج الهادي بخلق كثير إلى خيوان فدخلها يوم الأربعاء ليومين باقيين من الشهر ولقيه أهلها وأصلح بينهم واستحلفهم على قطع الفتنة، وأقام بخيوان إلى ثلاث وعشرين من شعبان.
  en: Al-Da'am ibn Ibrahim, one of the Yemeni rulers who had taken power, wrote to al-Hadi asking to be appointed over the land he held; al-Hadi answered that he would appoint him only on ruling by the Book of God and the sunna of His Messenger and following what they follow, and many letters passed; then al-Hadi went out with a great crowd to Khiwan, entered it on Wednesday with two days left of the month, its people met him, he reconciled them and had them swear to end the feud, and he stayed at Khiwan until the twenty-third of Sha'ban.
  ur: یمن کے غالب آنے والے حکمرانوں میں سے دعام بن ابراہیم نے ہادی کو لکھا کہ جس علاقے میں وہ ہے وہاں کا والی بنا دیں؛ ہادی نے جواب دیا کہ وہ اسے صرف کتاب اللہ اور سنت رسول کے مطابق فیصلے اور ان کی راہ کی پیروی پر والی بنائیں گے، اور بہت سے خط بدلے گئے؛ پھر ہادی بڑی بھیڑ کے ساتھ خیوان گئے، مہینے کے دو دن باقی رہتے بدھ کو داخل ہوئے، اہل خیوان نے ان سے ملاقات کی، انہوں نے ان میں صلح کرائی اور فتنہ ختم کرنے کی قسم لی، اور وہ شعبان کی تئیس تک خیوان میں رہے۔
  es: "Al-Da'am ibn Ibrahim, uno de los gobernantes yemeníes que habían tomado el poder, escribió a al-Hadi pidiéndole que lo nombrara gobernador de las tierras que poseía; al-Hadi respondió que solo lo nombraría si gobernaba según el Libro de Dios y la sunna de Su Mensajero y seguía lo que ellos seguían, y se intercambiaron muchas cartas; luego al-Hadi salió con una gran multitud a Khiwan, entró allí un miércoles, con dos días restantes del mes, sus habitantes lo recibieron, los reconcilió y les hizo jurar que pondrían fin a la disputa, y permaneció en Khiwan hasta el veintitrés de Sha'ban."
  fr: "Al-Da'am ibn Ibrahim, l'un des souverains yéménites qui avait pris le pouvoir, écrivit à al-Hadi pour lui demander d'être nommé administrateur des terres qu'il détenait. al-Hadi répondit qu'il ne le nommerait que s'il gouvernait selon le Livre de Dieu et la sunna de Son Messager, et en suivant leurs préceptes. De nombreuses lettres furent échangées. Puis al-Hadi se rendit à Khiwan avec une grande foule, y entra un mercredi, deux jours avant la fin du mois, les habitants l'accueillirent, il les réconcilia et leur fit jurer de mettre fin à la querelle. Il resta à Khiwan jusqu'au vingt-troisième jour de Sha'ban."
  tr: "Yemen'in fetihçi krallarından biri olan Da'am bin İbrahim, Hadi'ye yazdığı mektupta kendisini bulunduğu şehre atamasını istedi. Hadi ise, ancak Allah'ın Kitabı ve Resulünün Sünnetiyle yönetmesi ve bunlara uyması şartıyla onu atamayacağını söyledi. İkisi birçok mektup alışverişinde bulundu. Ardından Hadi, büyük bir grupla Hayvan'a gitti ve ayın bitiminden iki gün önce, Çarşamba günü şehre girdi. Şehir halkı onu karşıladı ve aralarında barışı sağladı, fitneyi durduracaklarına dair yemin ettirdi. Hayvan'da Şaban ayının yirmi üçüncü gününe kadar kaldı."
  id: "Al-Da’am bin Ibrahim, salah satu raja penakluk Yaman, menulis surat kepada Al-Hadi meminta agar ia diangkat menjadi penguasa kota tempat ia berada. Al-Hadi menjawab bahwa ia tidak akan mengangkatnya kecuali dengan syarat ia memerintah berdasarkan Kitab Allah dan Sunnah Rasul-Nya serta mengikuti apa yang terkandung di dalamnya. Mereka saling bertukar banyak surat. Kemudian Al-Hadi pergi bersama rombongan besar ke Khaywan dan memasuki kota itu pada hari Rabu, dua hari sebelum akhir bulan. Penduduk kota menyambutnya dan ia mendamaikan mereka serta membuat mereka bersumpah untuk menghentikan pemberontakan. Ia tinggal di Khaywan hingga tanggal 23 Sya'ban."
