id: event/muhammad-ibn-ubaydallah-sends-his-sons-to-the-fort-and-refuses-to-leave-the-village-295
class: event
kind: other
label:
  ar: "محمد بن عبيد الله يوجه أبناءه إلى الحصن ويأبى الخروج من القرية، 295هـ"
  en: "Muhammad ibn Ubaydallah sends his sons to the fort and refuses to leave the village, 295 AH, pp. 363-364"
  ur: "محمد بن عبیداللہ کا بیٹوں کو قلعے بھیجنا اور گاؤں چھوڑنے سے انکار، 295ھ، ص363-364"
  es: "Muhammad ibn Ubaydallah envía a sus hijos al fuerte y se niega a abandonar la aldea, 295 AH, págs. 363-364"
  fr: "Muhammad ibn Ubaydallah envoie ses fils au fort et refuse de quitter le village, 295 AH, pp. 363-364"
  tr: "Muhammed ibn Ubeyd Allah, oğullarını kaleye gönderir ve köyü terk etmeyi reddeder, Hicri 295"
  id: "Muhammad bin Ubayd Allah mengarahkan putra-putranya ke benteng dan menolak meninggalkan desa, 295 H."
summary:
  ar: "اقترح بنو عبد المدان أن يوجه محمد أولاده إلى همدان، فأمر بنيه علياً والقاسم وجعفر بالمصير إلى الحصن. فكرهوا ذلك وسألوه أن يخرج معهم لأنهم لا يثقون ببني عبد المدان، فأبى وحلف ألا يبرح القرية، وخرج علي وإخوته إلى الحصن."
  en: "Banu Abd al-Madan proposed that Muhammad send his sons to Hamdan. He ordered Ali, al-Qasim and Ja'far to the fort instead. They disliked it and asked him to come out with them, since they did not trust Banu Abd al-Madan. He refused and swore not to leave the village, and Ali and his brothers went to the fort."
  ur: "بنو عبد المدان نے تجویز دی کہ محمد اپنے بیٹے ہمدان بھیج دے۔ اس نے علی، القاسم اور جعفر کو قلعے کی طرف جانے کا حکم دیا۔ انہیں یہ بات ناپسند ہوئی اور انہوں نے اس سے کہا کہ وہ بھی ان کے ساتھ نکلے، کیونکہ وہ بنو عبد المدان پر بھروسا نہیں کرتے تھے۔ اس نے انکار کیا اور گاؤں نہ چھوڑنے کی قسم کھائی، اور علی اور اس کے بھائی قلعے چلے گئے۔"
  es: "Banu Abd al-Madan propuso que Muhammad enviara a sus hijos a Hamdan. En cambio, ordenó a Ali, al-Qasim y Ja'far que fueran a la fortaleza. A ellos no les gustó la idea y le pidieron que saliera con ellos, ya que no confiaban en Banu Abd al-Madan. Él se negó y juró no abandonar la aldea, y Ali y sus hermanos fueron a la fortaleza."
  fr: "Banu Abd al-Madan proposa à Muhammad d'envoyer ses fils à Hamdan. Il ordonna plutôt à Ali, al-Qasim et Ja'far de se rendre au fort. Méfiants, ils lui demandèrent de les accompagner, car ils ne lui faisaient pas confiance. Il refusa et jura de ne pas quitter le village; Ali et ses frères se rendirent donc au fort."
  tr: "Beni Abdülmeden kabilesi, Muhammed'in oğullarını Hamadan'a göndermesini önerdi. Bunun üzerine Muhammed, oğulları Ali, Kasım ve Cafer'e kaleye gitmelerini emretti. Oğulları bu durumdan hoşlanmadılar ve Beni Abdülmeden kabilesine güvenmedikleri için onunla birlikte gitmesini istediler. Ancak Muhammed bunu reddetti ve köyü terk etmeyeceğine yemin etti. Bunun üzerine Ali ve kardeşleri kaleye gittiler."
  id: "Bani Abd al-Madan menyarankan agar Muhammad mengirim putra-putranya ke Hamadan, jadi beliau memerintahkan putra-putranya Ali, al-Qasim, dan Ja'far untuk pergi ke benteng. Mereka tidak menyukai hal ini dan meminta beliau untuk ikut bersama mereka karena mereka tidak mempercayai Bani Abd al-Madan, tetapi beliau menolak dan bersumpah bahwa beliau tidak akan meninggalkan desa. Ali dan saudara-saudaranya kemudian pergi ke benteng."
