summary:
  ar: "أصاب زلزال سنة 1855م آثار بورصة إصابة بالغة: لحق بجامع أورخان غازي ضرر جسيم أُصلح بعده {cite:freely-ottoman-architecture-2011 p. 38}، وفقد جامع يلدرم بايزيد إحدى منارتيه {cite:freely-ottoman-architecture-2011 p. 41}، وتضرر جامع أمير سلطان فأُعيد بناؤه {cite:freely-ottoman-architecture-2011 p. 49}."
  en: "The earthquake of 1855 CE struck Bursa's monuments hard: the Orhan Gazi Mosque suffered serious damage later repaired {cite:freely-ottoman-architecture-2011 p. 38}, the Yıldırım Bayezid Mosque lost one of its minarets {cite:freely-ottoman-architecture-2011 p. 41}, and the Emir Sultan Mosque was damaged and rebuilt {cite:freely-ottoman-architecture-2011 p. 49}."
  ur: "1855ء کے زلزلے نے بورصہ کی یادگاروں کو سخت نقصان پہنچایا: اورخان غازی مسجد کو شدید ضرر ہوا جو بعد میں مرمت ہوئی {cite:freely-ottoman-architecture-2011 p. 38}، یلدرم بایزید مسجد کا ایک مینار گر گیا {cite:freely-ottoman-architecture-2011 p. 41}، اور امیر سلطان مسجد متاثر ہو کر دوبارہ تعمیر ہوئی {cite:freely-ottoman-architecture-2011 p. 49}۔"
  fr: "Le séisme de 1855 apr. J.-C. frappa durement les monuments de Bursa : la mosquée d'Orhan Gazi subit de graves dégâts, réparés par la suite {cite:freely-ottoman-architecture-2011 p. 38}, la mosquée de Yıldırım Bayezid perdit l'un de ses minarets {cite:freely-ottoman-architecture-2011 p. 41}, et la mosquée d'Emir Sultan fut endommagée et reconstruite {cite:freely-ottoman-architecture-2011 p. 49}."
  es: "El terremoto de 1855 d. C. afectó gravemente a los monumentos de Bursa: la mezquita Orhan Gazi sufrió graves daños que fueron reparados posteriormente {cite:freely-ottoman-architecture-2011 p. 38}, la mezquita Yıldırım Bayezid perdió uno de sus minaretes {cite:freely-ottoman-architecture-2011 p. 41}, y la mezquita Emir Sultan resultó dañada y fue reconstruida {cite:freely-ottoman-architecture-2011 p. 49}."
  tr: "1855 yılındaki deprem Bursa'nın anıtlarına ciddi zararlar verdi: Orhan Gazi Camii ağır hasar gördü ve daha sonra onarıldı {cite:freely-ottoman-architecture-2011 s. 38}, Yıldırım Bayezid Camii minarelerinden birini kaybetti {cite:freely-ottoman-architecture-2011 s. 41} ve Emir Sultan Camii hasar gördü ve yeniden inşa edildi {cite:freely-ottoman-architecture-2011 s. 49}."
  id: "Gempa bumi tahun 1855 Masehi merusak monumen-monumen Bursa secara parah: Masjid Orhan Gazi mengalami kerusakan serius yang kemudian diperbaiki {cite:freely-ottoman-architecture-2011 p. 38}, Masjid Yildirim Bayezid kehilangan salah satu menaranya {cite:freely-ottoman-architecture-2011 p. 41}, dan Masjid Emir Sultan rusak dan dibangun kembali {cite:freely-ottoman-architecture-2011 p. 49}."
