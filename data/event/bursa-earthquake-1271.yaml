summary:
  ar: "أصاب زلزال سنة 1855م آثار بورصة إصابة بالغة: لحق بجامع أورخان غازي ضرر جسيم أُصلح بعده {cite:freely-ottoman-architecture-2011 p. 38}، وفقد جامع يلدرم بايزيد إحدى منارتيه {cite:freely-ottoman-architecture-2011 p. 41}، وتضرر جامع أمير سلطان فأُعيد بناؤه {cite:freely-ottoman-architecture-2011 p. 49}."
