label: { ar: "سرية أبي عبيدة بن الجراح إلى سيف البحر (غزوة الخبط)", en: "Abu Ubayda ibn al-Jarrah's detachment to the sea coast (the Khabat raid)" }
summary:
  ar: "سرية بعثها النبي إلى سيف البحر عليها أبو عبيدة بن الجراح وزوّدهم جراباً من تمر؛ يرويها عبادة بن الصامت: قوّتهم أبو عبيدة التمر حتى صار يعطي كل رجل تمرة في اليوم، فلما جهدهم الجوع أخرج الله لهم دابة من البحر فأكلوا من لحمها وودكها عشرين ليلة حتى سمنوا، ورفع أميرهم ضلعاً من أضلاعها فمرّ تحتها أجسم رجل على أجسم بعير؛ فلما سألوا النبي عن أكلهم قال: رزق رزقكموه الله."
  en: "A detachment the Prophet sent to the sea coast under Abu Ubayda ibn al-Jarrah, provisioned with a single bag of dates; Ubada ibn al-Samit tells it: Abu Ubayda rationed the dates until each man received one a day, and when hunger wore them down God brought out for them a sea creature on whose flesh and fat they lived twenty nights until they grew fat; the commander propped up one of its ribs and the tallest man on the biggest camel passed beneath it. When they asked the Prophet about having eaten it he said: a provision God provided you."
