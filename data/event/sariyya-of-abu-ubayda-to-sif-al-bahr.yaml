class: event
kind: raid
label: { ar: "سرية أبي عبيدة بن الجراح إلى سيف البحر ⁦(غزوة الخبط)⁩", en: "Abu Ubayda ibn al-Jarrah's detachment to the sea coast (the Khabat raid)", es: "El destacamento de Abu Ubayda ibn al-Jarrah hacia la costa (la incursión de Khabat)", fr: "Le détachement d'Abu Ubayda ibn al-Jarrah sur la côte maritime (le raid de Khabat)", ur: "ابو عبیدہ بن الجراح کی سمندری ساحل پر لاتعلقی ⁦(خباط چھاپہ)⁩", tr: "Ebu Ubeyde ibn el-Cerrah'ın kıyıya seferi (Khubt Muharebesi)", id: "Ekspedisi Abu Ubaidah ibn al-Jarrah ke pantai (Pertempuran Khubt)" }
summary:
  ar: "سرية بعثها النبي إلى سيف البحر عليها أبو عبيدة بن الجراح وزوّدهم جراباً من تمر؛ يرويها عبادة بن الصامت: قوّتهم أبو عبيدة التمر حتى صار يعطي كل رجل تمرة في اليوم، فلما جهدهم الجوع أخرج الله لهم دابة من البحر فأكلوا من لحمها وودكها عشرين ليلة حتى سمنوا، ورفع أميرهم ضلعاً من أضلاعها فمرّ تحتها أجسم رجل على أجسم بعير؛ فلما سألوا النبي عن أكلهم قال: رزق رزقكموه الله."
  en: "A detachment the Prophet sent to the sea coast under Abu Ubayda ibn al-Jarrah, provisioned with a single bag of dates; Ubada ibn al-Samit tells it: Abu Ubayda rationed the dates until each man received one a day, and when hunger wore them down God brought out for them a sea creature on whose flesh and fat they lived twenty nights until they grew fat; the commander propped up one of its ribs and the tallest man on the biggest camel passed beneath it. When they asked the Prophet about having eaten it he said: a provision God provided you."
  es: "Un destacamento que el Profeta envió a la costa al mando de Abu Ubayda ibn al-Jarrah, provisto con una sola bolsa de dátiles; Ubada ibn al-Samit relata: Abu Ubayda racionó los dátiles hasta que cada hombre recibió uno al día, y cuando el hambre los agotó, Dios les envió una criatura marina de cuya carne y grasa vivieron veinte noches hasta que engordaron; el comandante sostuvo una de sus costillas y el hombre más alto montado en el camello más grande pasó por debajo. Cuando le preguntaron al Profeta si lo habían comido, él dijo: una provisión que Dios les dio."
  fr: "Un détachement envoyé par le Prophète sur la côte, sous le commandement d'Abu Ubayda ibn al-Jarrah, ne disposait que d'un seul sac de dattes. Ubada ibn al-Samit raconte: Abu Ubayda rationna les dattes jusqu'à ce que chaque homme en reçoive une par jour. Lorsque la faim les accabla, Dieu fit surgir pour eux une créature marine dont ils se nourrissèrent vingt nuits, jusqu'à ce qu'ils soient bien nourris. Le commandant souleva une de ses côtes et l'homme le plus grand, monté sur le plus gros chameau, passa dessous. Interrogé par le Prophète sur ce qu'il en avait mangé, il répondit: « C'est une provision que Dieu vous a accordée. »"
  ur: "نبی نے ابو عبیدہ بن الجراح کی قیادت میں سمندری ساحل پر بھیجے گئے ایک دستے کو کھجور کے ایک تھیلے کے ساتھ فراہم کیا تھا۔ عبادہ بن الصامت کہتے ہیں: ابو عبیدہ نے کھجوروں کو اس وقت تک ترتیب دیا جب تک کہ ہر ایک کو ایک دن نہ ملے، پھر جب بھوک ختم ہو گئی تو اللہ تعالیٰ نے ان کے لیے ایک سمندری جانور نکالا جس کے گوشت اور چربی پر وہ بیس رات زندہ رہے یہاں تک کہ وہ موٹے ہو گئے۔ کمانڈر نے اس کی پسلیوں میں سے ایک کو آگے بڑھایا اور سب سے بڑے اونٹ پر سوار سب سے لمبا آدمی اس کے نیچے سے گزر گیا۔ جب انہوں نے نبی کریم سے اس کے کھانے کے بارے میں پوچھا تو آپ نے فرمایا: اللہ نے تمہیں رزق دیا ہے۔"
  tr: "Peygamberimiz tarafından deniz kıyısına gönderilen bir birliğe Ebu Ubeyde bin el-Cerre önderlik etmiş ve onlara bir kese hurma vermişti. Ubeyde bin el-Samit'ten rivayet edildiğine göre, Ebu Ubeyde onları hurma ile besleyerek her birine günde bir hurma vermişti. Açlıktan perişan olduklarında, Allah onlara denizden bir hayvan gönderdi ve yirmi gece boyunca etini ve yağını yiyerek semirdiler. Liderleri hayvanın kaburgalarından birini kaldırdı ve en iri adam, en büyük devenin üzerinde onun altından geçti. Peygamberimize yiyecekleri hakkında sorduklarında, o şöyle buyurdu: \"Bu, Allah'ın size verdiği rızıktır.\""
  id: "Suatu pasukan yang diutus Nabi ke pantai laut, dipimpin oleh Abu Ubaidah bin Al-Jarrah, dan beliau memberi mereka sekantong kurma. Diriwayatkan oleh Ubaidah bin Al-Samit: Abu Ubaidah menguatkan mereka dengan kurma hingga setiap orang mendapat satu kurma setiap hari. Ketika mereka dilanda kelaparan, Allah mengeluarkan seekor binatang dari laut untuk mereka, dan mereka memakan daging dan lemaknya selama dua puluh malam hingga mereka menjadi gemuk. Pemimpin mereka mengangkat salah satu tulang rusuknya, dan orang terbesar di atas unta terbesar melewatinya. Ketika mereka bertanya kepada Nabi tentang makanan mereka, beliau bersabda: Itu adalah rezeki yang telah Allah sediakan untuk kalian."
