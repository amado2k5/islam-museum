label:
  ar: "حجة السخاوي ٨٩٢هـ وجوار ثانٍ، ١٤٨٧م"
  en: "Al-Sakhawi's hajj of 892 and second long sojourn, 1487"
  ur: "سخاوی کا حج 892ھ اور دوسری طویل مجاورت، 1487ء"
summary:
  ar: "حج السخاوي في سنة اثنتين وتسعين ⁦(٨٩٢هـ/١٤٨٧م)⁩ ثم جاور بمكة سنة ثلاث وتسعين ثم سنة أربع وتسعين، وقد كان بينه وبين بعض أقرانه من أهل مصر ما بين الأقران — أشهرهم السيوطي — مما زاد إقباله على جوار الحرمين {cite:daw-lami-jil-1992 8/14} {cite:shadharat-dhahab p. 432} {cite:encyclopaedia-of-islam-2 vol. 8 p. 947}."
  en: "Al-Sakhawi performed the hajj in 892/1487 and then sojourned in Mecca through 893 and 894. His standing quarrel with his Egyptian peers — most famously al-Suyuti — made the sanctuary cities all the more welcoming {cite:daw-lami-jil-1992 8/14} {cite:shadharat-dhahab p. 432} {cite:encyclopaedia-of-islam-2 vol. 8 p. 947}."
  ur: "سخاوی نے 892ھ/1487ء میں حج کیا اور پھر 893ھ اور 894ھ میں مکہ میں مجاور رہا۔ مصر کے ہم عصروں — خاص طور پر سیوطی — سے اس کا معمولی جھگڑا حرمین کی مجاورت کو اور بھی راغب کرنے والا تھا {cite:daw-lami-jil-1992 8/14} {cite:shadharat-dhahab p. 432} {cite:encyclopaedia-of-islam-2 vol. 8 p. 947}۔"
