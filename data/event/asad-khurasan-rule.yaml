label: { ar: "ولاية أسد بن عبد الله خراسان", en: "Asad ibn Abdallah's Khurasan", fr: "Le Khorasan d'Asad ibn Abdallah", es: "El Jorasán de Asad ibn Abdallah", ur: "اسد بن عبداللہ کا خراسان" }
summary:
  ar: "قدم أسد سمرقند فاستعمل عليها الحسن بن أبي الممرطة فكانت الترك تطرف سمرقند وتغير وكان الحسن ينفر كلما أغاروا فلا يلحقهم فخطب ذات يوم فدعا على الترك في خطبته فقال اللهم اقطع آثارهم وعجل أقدارهم وأزل عليهم الصبر فشتمه أهل سمرقند وقالوا لا بل أنزل الله علينا الصبر وزلزل أقدامهم وغزا أسد جبال نمرود فصالحه غرود وأسلم وغزا الختل فلما قدم بلخاً أمر ببناء مدينتها ونقل الدواوين إليها وصار إلى ألختل فلم يقدر منها على شيء وأصاب الناس ضر وجوع وبلغه عن نصر بن سيار كلام فضربه وبعث به إلى خالد مع ثلاثة نفر اتهموا بالشعب ثم شخص أسد عن خراسان وخلف عليها الحكم بن عوانة الكلبي."
  en: "Asad made al-Hasan ibn Abi al-Mammarta over Samarqand, where Turkish raids he could never catch drove him to pray in khutba 'cut their tracks, hasten their fates, take patience from them' — the Samarqandis cursed him back: 'rather send patience on us and shake their feet'. Asad took Ghurud's sulh and conversion in the Nimrud mountains; at Balkh he ordered the city rebuilt and the diwans moved there, gained nothing at al-Khattl amid famine, beat Nasr ibn Sayyar for reported talk and sent him to Khalid with three charged with shu'ubiyya — then left al-Hakam ibn Awana al-Kalbi in his place."
  fr: "Asad plaça al-Hasan ibn Abi al-Mammarta à la tête de Samarcande, où des raids turcs qu'il ne parvenait jamais à rattraper le poussèrent à prier ainsi dans la khutba : « coupe leurs traces, hâte leurs destins, ôte-leur la patience » ; les Samarcandais le maudirent en retour : « envoie plutôt la patience sur nous et fais vaciller leurs pieds ». Asad obtint le sulh et la conversion de Ghurud dans les montagnes de Nimrud ; à Balkh, il ordonna de rebâtir la ville et d'y transférer les diwans, n'obtint rien à al-Khattl au milieu de la famine, frappa Nasr ibn Sayyar pour des propos rapportés et l'envoya à Khalid avec trois hommes accusés de shu'ubiyya, puis laissa al-Hakam ibn Awana al-Kalbi à sa place."
  es: "Asad nombró a al-Hasan ibn Abi al-Mammarta al frente de Samarcanda, donde las incursiones turcas que nunca pudo atrapar lo obligaron a rezar en jutba: \"Cortad sus huellas, apresurad su destino, quitadles la paciencia\". Los samarcandíes le maldijeron: \"Mejor envíanos paciencia a nosotros y sacudid sus pies\". Asad tomó el sulh de Ghurud y la conversión en las montañas de Nimrud; en Balkh ordenó reconstruir la ciudad y trasladar allí a los diwanes, no obtuvo nada en al-Khattl en medio de la hambruna, golpeó a Nasr ibn Sayyar por supuestos rumores y lo envió a Khalid con tres acusados de shu'ubiyya, y luego dejó a al-Hakam ibn Awana al-Kalbi en su lugar."
  ur: "اسد نے حسن بن ابی الممرتا کو سمرقند پر بنایا، جہاں ترکوں کے چھاپے وہ کبھی نہیں پکڑ سکے تھے، اس نے اسے خطبہ میں نماز پڑھنے کے لیے 'ان کی پٹڑیوں کو کاٹنا، ان کی تقدیر کو تیز کرنا، ان سے صبر کرنا' - سمرقندیوں نے اس پر لعنت بھیجی: 'بلکہ ہم پر صبر کرو اور ان کے پاؤں ہلاؤ'۔ اسد نے نمرود کے پہاڑوں میں غورد کی سلح اور تبدیلی لی۔ بلخ میں اس نے شہر کو دوبارہ تعمیر کرنے کا حکم دیا اور دیوان وہاں منتقل ہو گئے، قحط کے دوران الخطل میں کچھ حاصل نہ ہوسکا، نصر بن سیار کو مبینہ بات کرنے پر مارا پیٹا اور اسے خالد کے پاس تین شوبیہ کے ساتھ بھیج دیا - پھر الحکم ابن عوانہ الکلبی کو اس کی جگہ پر چھوڑ دیا۔"
