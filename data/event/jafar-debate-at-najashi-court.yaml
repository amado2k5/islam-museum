label: { ar: "مناظرة جعفر في مجلس النجاشي", en: "Ja'far's Debate at the Court of the Negus", es: "El debate de Ja'far en la corte del Negus", fr: "Le débat de Ja'far à la cour du Négus", ur: "نجاشی کے دربار میں جعفر کی بحث" }
summary:
  ar: "لما هاجر المسلمون إلى [[place/abyssinia|الحبشة]] بعثت قريش [[person/amr-ibn-al-as|عمر بن العاص]] وعبد الله بن أبي ربيعة بالهدايا إلى [[person/al-najashi|النجاشي]] يسألانه ردّهم، فجادلوه بأن المهاجرين فارقوا دين قومهم ولم يدخلوا في دينه ولا في دينهم وجاؤوا بدين مبتدع {cite:ibn-hisham-sira 1/337}. فبعث النجاشي إلى المسلمين يستمعهم، فقام [[person/jafar-ibn-abi-talib|جعفر بن أبي طالب]] خطيباً فقال: أيها الملك كنا قوماً أهل جاهلية نعبد الأصنام ونأكل الميتة ونأتي الفواحش ونقطع الأرحام ونجير الجوار، يأكل القوي منا الضعيف، فكنا على ذلك حتى بعث الله إلينا رسولاً منا نعرف نسبه وصدقه وأمانته وعفافه، فدعانا إلى الله لنعبده ونوحده ونخلع ما كنا نعبد نحن وآباؤنا من دونه من الحجارة والأوثان، وأمرنا بصدق الحديث وأداء الأمانة وصلة الرحم وحسن الجوار والكف عن المحارم والدماء، ونهانا عن الفواحش وقول الزور وأكل مال اليتيم وقذف المحصنات، وأمرنا أن نعبد الله لا نشرك به شيئاً، وأمرنا بالصلاة والزكاة والصيام. فصدقناه وآمنا به واتبعناه فحرّمنا ما حرم وأحللنا ما أحل، فعدا علينا قومنا فعذبونا وفتنونا عن ديننا ليردونا إلى عبادة الأوثان، فلما قهرونا وظلمونا خرجنا إلى بلدك واخترناك على من سواك ورغبنا في جوارك ورجونا أن لا نُظلم عندك {cite:ibn-hisham-sira 1/338-339}. ثم تلا عليه من صدر سورة مريم فرقّ النجاشي وقال: إن هذا والذي جاء به عيسى ليخرج من مشكاة واحدة، وردّ هدايا عمرو وأصحابه ورد عليهم {cite:ibn-hisham-sira 1/339}."
  en: "When the Muslims emigrated to [[place/abyssinia|Abyssinia]], Quraysh sent [[person/amr-ibn-al-as|Amr ibn al-As]] and Abdallah ibn Abi Rabi'a with gifts to [[person/al-najashi|the Negus]] to ask for their return, arguing that the emigrants had left the religion of their people without entering his or theirs and had brought an invented religion {cite:ibn-hisham-sira 1/337}. The Negus summoned the Muslims to hear them, and [[person/jafar-ibn-abi-talib|Ja'far ibn Abi Talib]] stood and addressed him: O king, we were a people of ignorance — we worshipped idols, ate carrion, committed outrages, severed kinship and wronged neighbours, the strong devouring the weak — until God sent us a messenger from among us whose lineage, truthfulness, trustworthiness and chastity we knew. He called us to God to worship and unify Him and to cast aside the stones and idols we and our fathers worshipped; he commanded us to speak truth, deliver trusts, keep kinship, be good neighbours, and refrain from forbidden things and bloodshed; he forbade us outrages, false speech, devouring the orphan's wealth and slandering chaste women; he commanded us to worship God associating nothing with Him, and ordered prayer, alms and fasting. We believed him and followed him, so we made unlawful what he made unlawful and lawful what he made lawful; our people attacked us, tortured us and tempted us from our religion to return us to the worship of idols. When they overcame and wronged us, we came to your country, chose you over all others, desired your protection and hoped not to be wronged in your presence {cite:ibn-hisham-sira 1/338-339}. Then he recited the opening of Surat Maryam, at which the Negus wept and said: this and what Jesus brought come from one lamp; he returned Amr's gifts and turned the envoys away {cite:ibn-hisham-sira 1/339}."
  es: "Cuando los musulmanes emigraron a [[place/abyssinia|Abisinia]], los Quraysh enviaron a [[person/amr-ibn-al-as|Amr ibn al-As]] y a Abdallah ibn Abi Rabi'a con regalos a [[person/al-najashi|el Negus]] para pedir su regreso, argumentando que los emigrantes habían abandonado la religión de su pueblo sin entrar en la suya y habían traído una religión inventada {cite:ibn-hisham-sira 1/337}. El Negus convocó a los musulmanes para que los escucharan, y [[person/jafar-ibn-abi-talib|Ja'far ibn Abi Talib]] se puso de pie y se dirigió a él: Oh rey, éramos un pueblo de ignorancia: adorábamos ídolos, comíamos carroña, cometíamos ultrajes, rompíamos lazos de parentesco y agraviábamos a nuestros vecinos, el fuerte devoraba al débil, hasta que Dios nos envió un mensajero de entre nosotros cuyo linaje, veracidad, confiabilidad y castidad conocíamos. Él nos llamó a Dios para adorarlo y unificarlo, y para desechar las piedras y los ídolos que nosotros y nuestros padres adorábamos; nos ordenó decir la verdad, cumplir con las obligaciones, mantener los lazos de parentesco, ser buenos vecinos y abstenernos de lo prohibido y del derramamiento de sangre; nos prohibió los ultrajes, el discurso falso, devorar la riqueza del huérfano y calumniar a las mujeres castas; nos ordenó adorar a Dios sin asociarle nada, y ordenó la oración, la limosna y el ayuno. Le creímos y le seguimos, así que hicimos ilegal lo que él hizo ilegal y lícito lo que él hizo lícito; nuestra gente nos atacó, nos torturó y nos tentó a abandonar nuestra religión para que volviéramos a la adoración de ídolos. Cuando nos vencieron y nos hicieron daño, vinimos a tu país, te elegimos por encima de todos los demás, deseamos tu protección y esperamos no ser agraviados en tu presencia {cite:ibn-hisham-sira 1/338-339}. Luego recitó el comienzo de la Sura Maryam, ante lo cual el Negus lloró y dijo: esto y lo que Jesús trajo provienen de una misma lámpara; devolvió los regalos de Amr y rechazó a los enviados {cite:ibn-hisham-sira 1/339}."
  fr: "Lorsque les musulmans émigrèrent en Abyssinie, les Quraysh envoyèrent Amr ibn al-As et Abdallah ibn Abi Rabi'a avec des cadeaux au Négus pour demander leur retour, arguant que les émigrants avaient quitté la religion de leur peuple sans entrer dans la leur et avaient apporté une religion inventée {cite:ibn-hisham-sira 1/337}. Le Négus convoqua les musulmans pour les écouter, et Ja'far ibn Abi Talib se leva et s'adressa à lui: « Ô roi, nous étions un peuple ignorant – nous adorions des idoles, mangions de la charogne, commettions des outrages, rompions les liens de parenté et lésions nos voisins, les forts dévorant les faibles – jusqu'à ce que Dieu nous envoie un messager issu de notre peuple, dont nous connaissions la lignée, la véracité, la fiabilité et la chasteté. Il nous appela à Dieu pour L'adorer et nous unir à Lui, et pour rejeter les pierres et les idoles que nous et nos pères adorions; il nous ordonna de dire la vérité, d'honorer les dépôts, de préserver les liens de parenté, d'être de bons voisins et de nous abstenir de ce qui est interdit et de verser le sang; il nous interdit les outrages, les mensonges, le vol des biens des orphelins et la calomnie des femmes chastes; il nous ordonna d'adorer Dieu sans rien Lui associer, et nous prescrivit la prière, l'aumône et le jeûne. » Nous avons cru en lui et l'avons suivi, rendant illicite ce qu'il interdisait et licite ce qu'il légitimait. Notre peuple nous a attaqués, torturés et tentés de nous détourner de notre religion pour nous ramener au culte des idoles. Vaincus et lésés, nous sommes venus dans votre pays, vous avons choisis parmi tous les autres, avons imploré votre protection et espéré ne pas être maltraités en votre présence. Puis il récita le début de la sourate Maryam, ce qui fit pleurer le Négus qui dit: « Ceci et ce que Jésus a apporté proviennent d'une même source. » Il rendit les présents d'Amr et renvoya les envoyés."
  ur: "جب مسلمانوں نے [[جگہ/حبشی|حبشہ]] کی طرف ہجرت کی تو قریش نے [[شخص/عمرو بن العاص|عمرو بن العاص]] اور عبداللہ ابن ابی ربیعہ کو [[شخص/النجاشی|ناجشی]] کو تحائف کے ساتھ بھیجا تاکہ ان کے مذہب میں داخل ہونے کی اجازت کے بغیر ان کے لوگوں سے واپسی کا مطالبہ کریں۔ ان کا اور ایک ایجاد شدہ مذہب لایا تھا {حوالہ: ابن ہشام سیرہ 1/337}۔ نجاشی نے مسلمانوں کو ان کی بات سننے کے لیے بلایا، اور [[شخص/جعفر ابن ابی طالب|جعفر ابن ابی طالب]] کھڑے ہو کر اس سے مخاطب ہوئے: اے بادشاہ، ہم جاہل قوم تھے - ہم بتوں کی پوجا کرتے تھے، مردار کھاتے تھے، غصہ کیا کرتے تھے، رشتہ داری منقطع کرتے تھے اور کمزور پڑوسی کو خدا نے ہم پر ظلم نہیں کیا تھا۔ ہم میں سے ایک رسول جس کے نسب، سچائی، امانت داری اور عفت کو ہم جانتے تھے۔ اس نے ہمیں خدا کی طرف بلایا تاکہ اس کی عبادت کریں اور اس کو متحد کریں اور ان پتھروں اور بتوں کو ایک طرف پھینک دیں جن کی ہم اور ہمارے باپ دادا پوجا کرتے تھے۔ اس نے ہمیں سچ بولنے، امانتیں ادا کرنے، قرابت داری رکھنے، اچھے پڑوسی بننے اور حرام چیزوں اور خونریزی سے پرہیز کرنے کا حکم دیا۔ اس نے ہمیں غصہ کرنے، جھوٹی بات کرنے، یتیموں کا مال کھانے اور پاک دامن عورتوں پر بہتان لگانے سے منع کیا ہے۔ اس نے ہمیں حکم دیا کہ خدا کی عبادت کریں اس کے ساتھ کسی کو شریک نہ کریں، اور نماز، زکوٰۃ اور روزے کا حکم دیا۔ ہم نے اس پر ایمان لایا اور اس کی پیروی کی تو ہم نے جس چیز کو حرام کیا اسے حرام اور جس چیز کو اس نے حلال کیا اسے حلال کر دیا۔ ہمارے لوگوں نے ہم پر حملہ کیا، ہم پر تشدد کیا اور ہمیں ہمارے مذہب سے نکال کر بتوں کی پوجا کی طرف لوٹایا۔ جب انہوں نے ہم پر غلبہ پایا اور ہم پر ظلم کیا تو ہم آپ کے ملک میں آئے، آپ کو تمام لوگوں پر منتخب کیا، آپ کی حفاظت کی خواہش کی اور آپ کی موجودگی میں ظلم نہ ہونے کی امید ظاہر کی۔ پھر آپ نے سورۃ مریم کی تلاوت کی، جس پر نجاشی رو پڑے اور فرمایا: یہ اور جو عیسیٰ لے کر آئے ہیں وہ ایک چراغ سے آئے ہیں۔ اس نے عمرو کے تحفے واپس کر دیے اور ایلچیوں کو پھیر دیا {حوالہ: ابن ہشام سیرہ 1/339}"
