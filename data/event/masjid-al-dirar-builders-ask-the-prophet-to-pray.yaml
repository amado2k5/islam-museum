id: event/masjid-al-dirar-builders-ask-the-prophet-to-pray
class: event
kind: other
label: { ar: "أصحاب المسجد يطلبون من النبي الصلاة فيه", en: "The builders of the mosque ask the Prophet to pray in it", es: "Los constructores de la mezquita le piden al Profeta que rece en ella.", fr: "Les bâtisseurs de la mosquée demandent au Prophète de venir y prier.", ur: "مسجد بنانے والے نبی سے اس میں نماز پڑھنے کو کہتے ہیں۔", tr: "Camideki cemaat, Peygamberden camide namaz kılmasını istedi.", id: "Para penghuni masjid meminta Nabi untuk shalat di dalamnya." }
summary:
  ar: "قبيل خروجه إلى تبوك أتى أصحاب المسجد الذي بنوه النبي وقالوا إنهم بنوه لذي العلة والحاجة والليلة المطيرة والشاتية، وسألوه أن يصلي لهم فيه، فأجّلهم إلى عودته."
  en: Shortly before marching to Tabuk, the people of the mosque they had built came to the Prophet saying they had built it for the sick and needy and for rainy and wintry nights, and asked him to pray in it for them; he put them off until his return.
  es: "Poco antes de marchar hacia Tabuk, la gente de la mezquita que habían construido se acercó al Profeta diciéndole que la habían construido para los enfermos y necesitados, y para las noches lluviosas e invernales, y le pidieron que rezara en ella por ellos; él los desestimó hasta su regreso."
  fr: "Peu avant de marcher sur Tabuk, les habitants de la mosquée qu'ils avaient construite vinrent trouver le Prophète, lui disant qu'ils l'avaient construite pour les malades et les nécessiteux, ainsi que pour les nuits pluvieuses et hivernales, et lui demandèrent d'y prier pour eux; il les fit patienter jusqu'à son retour."
  ur: "تبوک کی طرف کوچ کرنے سے کچھ دیر پہلے، مسجد کے لوگ جو انہوں نے بنوائی تھی، رسول اللہ کے پاس آئے اور کہا کہ انہوں نے اسے بیماروں اور ضرورت مندوں کے لیے اور بارش اور سردی کی راتوں کے لیے بنایا ہے، اور آپ سے کہا کہ آپ اس میں ان کے لیے دعا کریں۔ اس نے انہیں واپس آنے تک روک دیا۔"
  tr: "Tebük'e gitmeden önce, Peygamberin yaptırdığı caminin sahipleri yanına gelerek, camiyi hastalar, muhtaçlar ve yağmurlu, soğuk geceler için yaptırdıklarını söylediler ve ondan kendileri için orada namaz kılmasını istediler. Bunun üzerine Peygamber, namazı dönüşüne kadar erteledi."
  id: "Sebelum beliau berangkat ke Tabuk, pemilik masjid yang dibangun Nabi datang kepadanya dan mengatakan bahwa mereka membangun masjid itu untuk orang sakit, orang miskin, dan untuk malam-malam hujan dan dingin, dan mereka meminta beliau untuk berdoa bagi mereka di masjid itu, maka beliau menundanya hingga beliau kembali."
