id: event/al-hadi-enters-sanaa-a-second-time-after-leaving-shibam-288
class: event
kind: other
label:
  ar: "دخول الهادي صنعاء المرة الثانية بعد خروجه من شبام، سنة 288هـ"
  en: "Al-Hadi enters Sana'a a second time after leaving Shibam, 288 AH"
  ur: "ہادی کا شبام سے نکلنے کے بعد دوسری بار صنعاء میں داخلہ، 288ھ"
  es: "Al-Hadi entra en Saná por segunda vez tras abandonar Shibam, año 288 de la Hégira."
  fr: "Al-Hadi entre à Sanaa une seconde fois après avoir quitté Shibam, en 288 AH."
  tr: "Al-Hadi, Şibam'dan ayrıldıktan sonra ikinci kez Hicri 288 yılında Sana'a'ya girdi."
  id: "Al-Hadi memasuki Sana'a untuk kedua kalinya setelah meninggalkan Shibam, pada tahun 288 Hijriah."
summary:
  ar: "دخل الهادي صنعاء المرة الثانية بعد خروجه من شبام بأحسن حال، ولم يُقتل من أصحابه إلا رجل عقيلي طُعن طعنة في بطنه، وتتصل الجملة في ص226 بتعجب الناس من صبره مع قلة أصحابه."
  en: "Al-Hadi entered Sana'a a second time after leaving Shibam in the best of states, and none of his companions was killed but an Aqili man stabbed in the belly; the sentence runs on into p. 226 with the people's wonder at his steadfastness with so few men."
  ur: "ہادی شبام سے نکلنے کے بعد دوسری بار بہترین حال میں صنعاء میں داخل ہوئے، اور ان کے ساتھیوں میں صرف ایک عقیلی شخص مارا گیا جس کے پیٹ میں نیزہ لگا تھا؛ جملہ ص226 پر لوگوں کے اس تعجب تک جاری رہتا ہے کہ اتنے کم ساتھیوں کے باوجود وہ کتنے ثابت قدم رہے۔"
  es: "Al-Hadi entró en Sana'a por segunda vez después de dejar Shibam en las mejores condiciones, y ninguno de sus compañeros fue asesinado, salvo un hombre aqili que fue apuñalado en el vientre; la frase continúa en la página 226 con el asombro de la gente ante su firmeza con tan pocos hombres."
  fr: "Al-Hadi entra une seconde fois à Sanaa après avoir quitté Shibam dans le meilleur état, et aucun de ses compagnons ne fut tué, sauf un homme d'Aqili poignardé au ventre; la phrase se poursuit à la page 226 avec l'étonnement du peuple devant sa fermeté avec si peu d'hommes."
  tr: "El-Hadi, Şibam'dan ayrıldıktan sonra en iyi şartlarda Sana'a'ya ikinci kez girdi ve karnından bıçaklanan bir Akili dışında arkadaşlarından hiçbiri öldürülmedi. 226. sayfadaki cümle, az sayıda arkadaşıyla gösterdiği sabra insanların duyduğu hayretle ilgilidir."
  id: "Al-Hadi memasuki Sana'a untuk kedua kalinya setelah meninggalkan Shibam dalam keadaan yang sangat baik, dan tidak ada satu pun dari para sahabatnya yang terbunuh kecuali seorang pria Aqili yang ditusuk di perut. Kalimat di halaman 226 berkaitan dengan kekaguman orang-orang atas kesabarannya terhadap jumlah sahabatnya yang sedikit."
