label:
  ar: "دخول الهادي صنعاء المرة الثانية بعد خروجه من شبام، سنة 288هـ"
  en: "Al-Hadi enters Sana'a a second time after leaving Shibam, 288 AH"
  ur: "ہادی کا شبام سے نکلنے کے بعد دوسری بار صنعاء میں داخلہ، 288ھ"
summary:
  ar: "دخل الهادي صنعاء المرة الثانية بعد خروجه من شبام بأحسن حال، ولم يُقتل من أصحابه إلا رجل عقيلي طُعن طعنة في بطنه، وتتصل الجملة في ص226 بتعجب الناس من صبره مع قلة أصحابه."
  en: "Al-Hadi entered Sana'a a second time after leaving Shibam in the best of states, and none of his companions was killed but an Aqili man stabbed in the belly; the sentence runs on into p. 226 with the people's wonder at his steadfastness with so few men."
  ur: "ہادی شبام سے نکلنے کے بعد دوسری بار بہترین حال میں صنعاء میں داخل ہوئے، اور ان کے ساتھیوں میں صرف ایک عقیلی شخص مارا گیا جس کے پیٹ میں نیزہ لگا تھا؛ جملہ ص226 پر لوگوں کے اس تعجب تک جاری رہتا ہے کہ اتنے کم ساتھیوں کے باوجود وہ کتنے ثابت قدم رہے۔"
