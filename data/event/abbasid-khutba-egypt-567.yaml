label: { ar: "قطع الخطبة العبيدية وإقامة الخطبة العباسية بمصر", en: "Ending the Ubaydid Khutba and Restoring the Abbasid Khutba in Egypt" }
summary:
  ar: "قال العماد الكاتب استفتح السلطان صلاح الدين بن أيوب سنة سبع بجامع مصر كل طاعة وسمع وهو إقامة الخطبة في الجمعة الأولى منها بمصر لبني العباس وعفت البدعة وصفت الشرعة وأقيمت الخطبة العباسية في الجمعة الثانية بالقاهرة وأعقب ذلك موت العاضد في يوم عاشوراء وتسلم صلاح الدين القصر بما فيه من الذخائر والنفائس بحيث استمر البيع فيه عشر سنين غير ما اصطفاه صلاح الدين لنفسه وسير السلطان نور الدين بهذه البشارة شهاب الدين المطهر ابن أبي عصرون إلى بغداد وأمرني بإنشاء بشارة عامة تقرأ في سائر بلاد الإسلام، وقال ابن الأثير السبب في إقامة الخطبة العباسية بمصر أن صلاح الدين لما ثبت قدمه وضعف أمر العاضد كتب إليه نور الدين يأمره بذلك فاعتذر بالخوف من وثوب المصريين فلم يصغ إلى قوله وكان قد دخل مصر أعجمي يعرف بالأمير العالم فلما رأى ما هم فيه من الإحجام قال أنا أبتدىء بها فلما كان أول جمعة من المحرم صعد المنبر قبل الخطيب ودعا للمستضيء فلم ينكر ذلك أحد فلما كان الجمعة الثانية أمر صلاح الدين الخطباء بقطع خطبة العاضد ففعل ذلك ولم ينتطح فيها عنزان والعاضد شديد المرض فتوفي في يوم عاشوراء، وفي أيامه ضعف الرفض ببغداد وخطب له باليمن وبرقة وتوزر ومصر إلى أسوان، وصنف ابن الجوزي كتاباً سماه النصر على مصر {cite:tarikh-khulafa-minhaj-1434 p. 681-683}. وفي شذرات الذهب فمات العاضد عقيب ذلك قيل إنه مات غبناً وأظهر صلاح الدين الحزن عليه وجلس للعزاء ثم تسلم القصر وما حوى وحول أولاد العاضد وخاصته إلى مكان آخر ورتب لهم كفايتهم وكان يوماً مشهوداً {cite:shadharat-dhahab p. 702}."
  en: "Al-Imad al-Katib: Salah al-Din opened the year 567 with Egypt's greatest obedience — the Abbasid khutba, first Jumu'a at Fustat's mosque, the second at Cairo; al-Adid died that Ashura, and the palace's treasures sold for ten years. Shihab al-Din ibn Abi Asrun bore the news to Baghdad, and al-Imad wrote a general proclamation read across the lands of Islam — 'no minbar remains in those lands but the khutba for our lord al-Mustadi' is upon it'. Ibn al-Athir adds: Nur al-Din ordered it, Salah al-Din feared an Egyptian rising, and the Ajami called al-Amir al-Alim mounted the minbar before the khatib and prayed for al-Mustadi' — 'not two goats butted over it'. The khutba spread to Yemen, Barqa, Tawzar and Egypt to Aswan; Ibn al-Jawzi wrote his book al-Nasr ala Misr {cite:tarikh-khulafa-minhaj-1434 p. 681-683}."
  ur: "عماد کاتب کے مطابق صلاح الدین نے سن 567ھ کا آغاز مصر میں عباسی خطبے سے کیا: پہلی جمعہ فسطاط کے جامع میں، دوسری قاہرہ میں؛ اسی عاشورہ کو عاضد فوت ہوا۔ ابن الاثیر کے مطابق نور الدین نے اس کا حکم دیا تھا، اور عجمی المعروف امیر عالم خطیب سے پہلے منبر چڑھ کر مستضیع کے لیے دعا کی۔ خطبہ یمن، برقہ اور مصر تک پھیلا؛ اور ابن الجوزی نے اس موقع پر کتاب «النصر علی مصر» تصنیف کی {cite:tarikh-khulafa-minhaj-1434 p. 681-683}۔"
