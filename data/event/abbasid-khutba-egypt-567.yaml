label: { ar: "قطع الخطبة العبيدية وإقامة الخطبة العباسية بمصر", en: "Ending the Ubaydid Khutba and Restoring the Abbasid Khutba in Egypt", fr: "Fin de la khutba ubaydide et rétablissement de la khutba abbasside en Égypte", es: "El fin de la jutba ubaíd y la restauración de la jutba abasí en Egipto.", ur: "عبیدیت خطبہ کا خاتمہ اور مصر میں عباسی خطبہ کو بحال کرنا", tr: "Mısır'da Fatımi hutbesi kaldırıldı ve Abbasi hutbesi kuruldu.", id: "Ajaran Fatimiyah dihentikan dan ajaran Abbasiyah ditegakkan di Mesir." }
summary:
  ar: "قال العماد الكاتب استفتح السلطان صلاح الدين بن أيوب سنة سبع بجامع مصر كل طاعة وسمع وهو إقامة الخطبة في الجمعة الأولى منها بمصر لبني العباس وعفت البدعة وصفت الشرعة وأقيمت الخطبة العباسية في الجمعة الثانية بالقاهرة وأعقب ذلك موت العاضد في يوم عاشوراء وتسلم صلاح الدين القصر بما فيه من الذخائر والنفائس بحيث استمر البيع فيه عشر سنين غير ما اصطفاه صلاح الدين لنفسه وسير السلطان نور الدين بهذه البشارة شهاب الدين المطهر ابن أبي عصرون إلى بغداد وأمرني بإنشاء بشارة عامة تقرأ في سائر بلاد الإسلام، وقال ابن الأثير السبب في إقامة الخطبة العباسية بمصر أن صلاح الدين لما ثبت قدمه وضعف أمر العاضد كتب إليه نور الدين يأمره بذلك فاعتذر بالخوف من وثوب المصريين فلم يصغ إلى قوله وكان قد دخل مصر أعجمي يعرف بالأمير العالم فلما رأى ما هم فيه من الإحجام قال أنا أبتدىء بها فلما كان أول جمعة من المحرم صعد المنبر قبل الخطيب ودعا للمستضيء فلم ينكر ذلك أحد فلما كان الجمعة الثانية أمر صلاح الدين الخطباء بقطع خطبة العاضد ففعل ذلك ولم ينتطح فيها عنزان والعاضد شديد المرض فتوفي في يوم عاشوراء، وفي أيامه ضعف الرفض ببغداد وخطب له باليمن وبرقة وتوزر ومصر إلى أسوان، وصنف ابن الجوزي كتاباً سماه النصر على مصر {cite:tarikh-khulafa-minhaj-1434 p. 681-683}. وفي شذرات الذهب فمات العاضد عقيب ذلك قيل إنه مات غبناً وأظهر صلاح الدين الحزن عليه وجلس للعزاء ثم تسلم القصر وما حوى وحول أولاد العاضد وخاصته إلى مكان آخر ورتب لهم كفايتهم وكان يوماً مشهوداً {cite:shadharat-dhahab p. 702}."
  en: "Al-Imad al-Katib: Salah al-Din opened the year 567 with Egypt's greatest obedience — the Abbasid khutba, first Jumu'a at Fustat's mosque, the second at Cairo; al-Adid died that Ashura, and the palace's treasures sold for ten years. Shihab al-Din ibn Abi Asrun bore the news to Baghdad, and al-Imad wrote a general proclamation read across the lands of Islam — 'no minbar remains in those lands but the khutba for our lord al-Mustadi' is upon it'. Ibn al-Athir adds: Nur al-Din ordered it, Salah al-Din feared an Egyptian rising, and the Ajami called al-Amir al-Alim mounted the minbar before the khatib and prayed for al-Mustadi' — 'not two goats butted over it'. The khutba spread to Yemen, Barqa, Tawzar and Egypt to Aswan; Ibn al-Jawzi wrote his book al-Nasr ala Misr {cite:tarikh-khulafa-minhaj-1434 p. 681-683}."
  fr: "Al-Imad al-Katib : Saladin ouvrit l’année 567 par le plus grand acte d’obéissance de l’Égypte : la khutba abbasside, le premier vendredi à la mosquée de Fustat, le deuxième au Caire ; al-Adid mourut ce jour d’Achoura, et les trésors du palais furent vendus pendant dix ans. Shihab al-Din ibn Abi Asrun porta la nouvelle à Bagdad, et al-Imad écrivit une proclamation générale lue dans les terres de l’islam : « Il ne reste dans ces terres aucune chaire où ne soit prononcée la khutba pour notre seigneur al-Mustadi' ». Ibn al-Athir ajoute : Nur al-Din l’ordonna, Saladin craignit un soulèvement égyptien, et le non-Arabe appelé al-Amir al-Alim monta en chaire avant le prédicateur et pria pour al-Mustadi' : « pas même deux chèvres ne se heurtèrent à ce sujet ». La khutba s’étendit au Yémen, à Barqa, à Tawzar et en Égypte jusqu’à Assouan ; Ibn al-Jawzi écrivit son livre al-Nasr ala Misr {cite:tarikh-khulafa-minhaj-1434 p. 681-683}."
  ur: "عماد کاتب کے مطابق صلاح الدین نے سن 567ھ کا آغاز مصر میں عباسی خطبے سے کیا: پہلی جمعہ فسطاط کے جامع میں، دوسری قاہرہ میں؛ اسی عاشورہ کو عاضد فوت ہوا۔ ابن الاثیر کے مطابق نور الدین نے اس کا حکم دیا تھا، اور عجمی المعروف امیر عالم خطیب سے پہلے منبر چڑھ کر مستضیع کے لیے دعا کی۔ خطبہ یمن، برقہ اور مصر تک پھیلا؛ اور ابن الجوزی نے اس موقع پر کتاب «النصر علی مصر» تصنیف کی {cite:tarikh-khulafa-minhaj-1434 p. 681-683}۔"
  es: "Al-Imad al-Katib: Salah al-Din comenzó el año 567 con la mayor obediencia de Egipto: la jutba abasí, la primera del viernes en la mezquita de Fustat, la segunda en El Cairo; al-Adid murió ese Ashura, y los tesoros del palacio se vendieron durante diez años. Shihab al-Din ibn Abi Asrun llevó la noticia a Bagdad, y al-Imad escribió una proclama general que se leyó en todas las tierras del Islam: «No queda ningún púlpito en esas tierras sin que la jutba para nuestro señor al-Mustadi esté sobre él». Ibn al-Athir añade: Nur al-Din lo ordenó, Salah al-Din temía una sublevación egipcia, y el Ajami llamado al-Amir al-Alim subió al púlpito ante el khatib y oró por al-Mustadi: «Ni dos cabras se acercaron a él». La khutba se extendió a Yemen, Barqa, Tawzar y Egipto a Asuán; Ibn al-Jawzi escribió su libro al-Nasr ala Misr {cita:tarikh-khulafa-minhaj-1434 p. 681-683}."
  tr: "İmad-ı Katib şöyle dedi: Sultan Selahaddin İbn Eyyub, Hicri 77 (Miladi 1377) yılına Kahire Ulu Camii'nde, o yılın ilk Cuma hutbesinde Abbasi halifeliğini kurarak başladı. Bidîlik ortadan kaldırıldı ve Şeriat arındırıldı. Abbasi hutbesi daha sonra ikinci Cuma günü Kahire'de ilan edildi. Bunu Aşura günü el-Adid'in ölümü izledi. Selahaddin, sarayın tüm hazineleri ve değerli eşyalarıyla birlikte sarayı ele geçirdi; bunlar, Selahaddin'in kendisi için seçtiklerine ek olarak, on yıl boyunca satılmaya devam etti. Sultan Nur-Din, bu müjdeyle Şihab-Din el-Mutahhar ibn Abi Asrun'u Bağdat'a gönderdi ve bana İslam topraklarında okunacak genel bir duyuru yazmamı emretti. İbn el-Athir, Mısır'da Abbasi hutbesinin kurulmasının sebebinin, Selahaddin'in iktidarı kurulup el-Adid'in otoritesi zayıfladığında Nur el-Din'in ona böyle bir emir yazması olduğunu söylemiştir. Selahaddin, Mısırlıların ayaklanmasından korkarak mazeret bildirmiş, ancak sözleri dikkate alınmamıştır. Bilge Prens olarak bilinen Arap olmayan bir kişi Mısır'a girmiş ve onların tereddüdünü görünce, \"Ben başlayacağım\" demiştir. Muharrem ayının ilk Cuma günü, vaizden önce minbere çıkmış ve el-Mustadi için dua etmiş, kimse itiraz etmemiştir. İkinci Cuma günü Selahaddin, vaizlere hutbeyi kısaltmalarını emretmiştir. El-Adid hutbe vermiş ve bunu hiçbir direnişle karşılaşmadan yapmıştır. El-Adid ağır hasta olmuş ve Aşura günü vefat etmiştir. Saltanatı sırasında Bağdat'ta Şiilik zayıflamış ve Yemen, Barka, Tozeur ve Mısır'da Aswan'a kadar onun adına hutbeler verilmiştir. İbn el-Cevzi, \"Mısır'a Karşı Zafer\" adlı bir kitap yazmıştır (bkz:tarikh-khulafa-minhaj-1434, s. 681-683). Şadharat el-Dhahab'da, el-Adid'in kısa bir süre sonra öldüğü ve haksız yere öldürüldüğü belirtilir. Selahaddin, onun için üzüntüsünü dile getirmiş ve bir yas töreni düzenlemiştir. Ardından sarayı ve içindekileri ele geçirmiş, el-Adid'in oğullarını ve maiyetini başka bir yere taşımış ve ihtiyaçlarını karşılamıştır. Bu, çok önemli bir gündü (bkz:şadharat-dhahab, s. 702)."
  id: "Al-Imad al-Katib berkata: Sultan Saladin ibn Ayyub memulai tahun 77 H (1377 M) di Masjid Agung Kairo dengan pendirian kekhalifahan Abbasiyah dalam khutbah Jumat pertama tahun itu di Mesir. Inovasi diberantas, dan syariat dimurnikan. Khutbah Abbasiyah kemudian ditetapkan di Kairo pada Jumat kedua. Ini diikuti oleh wafatnya al-Adid pada hari Asyura. Saladin mengambil alih istana beserta semua harta dan barang berharganya, yang terus dijual selama sepuluh tahun, di samping apa yang telah dipilih Saladin untuk dirinya sendiri. Sultan Nur al-Din mengutus Shihab al-Din al-Mutahhar ibn Abi Asrun ke Baghdad dengan kabar baik ini dan memerintahkan saya untuk menyusun pengumuman umum untuk dibacakan di seluruh negeri Islam. Ibn al-Athir mengatakan bahwa alasan didirikannya khutbah Abbasiyah di Mesir adalah karena ketika kekuasaan Saladin telah mapan dan otoritas al-Adid melemah, Nur al-Din menulis surat kepadanya memerintahkannya untuk melakukan hal itu. Saladin berdalih, karena takut akan pemberontakan oleh orang Mesir, tetapi kata-katanya diabaikan. Seorang non-Arab yang dikenal sebagai Pangeran Bijak telah memasuki Mesir, dan ketika ia melihat keraguan mereka, ia berkata, \"Aku akan memulainya.\" Pada Jumat pertama bulan Muharram, ia naik ke mimbar sebelum penceramah dan berdoa untuk al-Mustadi', dan tidak ada yang keberatan. Pada Jumat kedua, Saladin memerintahkan para penceramah untuk mempersingkat khutbah. Al-Adid menyampaikan khutbah, dan ia melakukannya tanpa perlawanan apa pun. Al-Adid sakit parah dan meninggal pada hari Asyura. Selama pemerintahannya, Syiah melemah di Baghdad, dan khutbah disampaikan atas namanya di Yaman, Barqa, Tozeur, dan Mesir hingga Aswan. Ibn al-Jawzi menulis sebuah buku berjudul \"Kemenangan atas Mesir\" (lihat: Tarikh Khulafa Minhaj 1434 hlm. 681-683). Dalam Shadharat al-Dhahab, disebutkan bahwa al-Adid meninggal tak lama kemudian, dan dikatakan bahwa ia meninggal secara tidak adil. Saladin menunjukkan kesedihannya atas kematiannya dan mengadakan upacara berkabung. Kemudian ia mengambil alih istana dan isinya, memindahkan putra-putra al-Adid dan rombongannya ke tempat lain, dan memenuhi kebutuhan mereka. Itu adalah hari yang penting (lihat: Shadharat al-Dhahab hlm. 702)."
