id: event/ibn-kathir-ibn-taymiyya-727
class: event
kind: gathering
label:
  ar: "لزوم ابن كثير شيخ الإسلام ابن تيمية وامتحانه بسببه، نحو ٧٢٦-٧٢٨هـ"
  en: "Ibn Kathir attaches himself to Ibn Taymiyya and is tried on his account, about 726-728/1326-1328"
  ur: "ابن کثیر کا ابن تیمیہ سے لگاؤ اور ان کی وجہ سے آزمائش، تقریباً 726-728ھ/1326-1328ء"
  es: "Ibn Kathir se une a Ibn Taymiyya y es juzgado por su causa, alrededor de 726-728/1326-1328."
  fr: "Ibn Kathir se rallie à Ibn Taymiyya et est jugé pour sa faute, vers 726-728/1326-1328."
  tr: "İbn Kathir'in Şeyhülislam İbn Taymiyye ile olan ilişkisi ve onun yüzünden imtihan edilmesi, yaklaşık 726-728 Hicri yılları."
  id: "Hubungan Ibn Kathir dengan Syekh al-Islam Ibn Taymiyyah dan ujian yang dihadapinya karena beliau, sekitar tahun 726-728 H."
summary:
  ar: "أخذ ابن كثير عن شيخ الإسلام تقي الدين ابن تيمية فامتلأ بحبه وامتُحن بسببه {cite:durar-kamina-jil-1993 1/374}، وكانت محن ابن تيمية الأخيرة — محاكمات الطلاق والحشو ثم حبسه بالقلعة سنة ٧٢٦هـ — آخِذة على تلاميذه قبل وفاته بدمشق سنة ٧٢٨هـ."
  en: "Ibn Kathir took knowledge from Shaykh al-Islam Taqi al-Din Ibn Taymiyya, became filled with love for him and was tried on his account {cite:durar-kamina-jil-1993 1/374}; Ibn Taymiyya's last trials — the divorce and creed proceedings and his citadel imprisonment in 726 — bore on his students before his death at Damascus in 728."
  ur: "ابن کثیر نے شیخ الاسلام تقی الدین ابن تیمیہ سے علم حاصل کیا، ان کی محبت سے بھرپور ہوئے اور ان کی وجہ سے آزمائش اٹھائی {cite:durar-kamina-jil-1993 1/374}؛ ابن تیمیہ کی آخری آزمائشیں — طلاق اور عقیدہ کے مقدمات اور 726ھ میں قلعہ کی قید — 728ھ میں ان کی وفات سے پہلے ان کے شاگردوں پر بھی اثر ڈال رہی تھیں۔"
  es: "Ibn Kathir recibió conocimiento del Shaykh al-Islam Taqi al-Din Ibn Taymiyya, se llenó de amor por él y fue juzgado por su causa {cite:durar-kamina-jil-1993 1/374}; las últimas pruebas de Ibn Taymiyya —el divorcio y los procedimientos de credo y su encarcelamiento en la ciudadela en 726— afectaron a sus estudiantes antes de su muerte en Damasco en 728."
  fr: "Ibn Kathir a reçu des connaissances du cheikh al-Islam Taqi al-Din Ibn Taymiyya, s'est rempli d'amour pour lui et a été jugé à cause de lui {cite:durar-kamina-jil-1993 1/374}; les derniers procès d'Ibn Taymiyya — les procédures de divorce et de croyance et son emprisonnement dans la citadelle en 726 — ont pesé sur ses élèves avant sa mort à Damas en 728."
  tr: "İbn Kathir, Şeyhülislam Takîddin İbn Taymiyye'den ders aldı ve ona karşı büyük bir sevgi besledi; onun yüzünden de imtihan edildi. {cite:durar-kamina-jil-1993 1/374} İbn Taymiyye'nin son imtihanları -boşanma ve iftira davaları, ardından 726 Hicri yılında Şam'da vefat etmeden önce kalede hapsedilmesi- öğrencileri için bir imtihan oldu."
  id: "Ibn Kathir belajar dari Syekh al-Islam Taqi al-Din Ibn Taymiyyah, dan dipenuhi rasa cinta kepadanya serta diuji karena beliau {cite:durar-kamina-jil-1993 1/374}. Ujian terakhir Ibn Taymiyyah — ujian perceraian dan fitnah, kemudian pemenjaraannya di Benteng pada tahun 726 H — merupakan ujian bagi murid-muridnya sebelum kematiannya di Damaskus pada tahun 728 H."
