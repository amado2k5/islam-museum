id: event/al-hadi-enters-al-hajar-with-six-men-and-fights-in-the-lane-286
class: event
kind: other
label:
  ar: دخول الهادي الحجر بستة رجال وسبعة فرسان ومحاربته في الزقاق، ذو الحجة 286هـ
  en: Al-Hadi enters al-Hajar with six men and seven horsemen and fights in the lane, Dhu al-Hijja 286 AH
  ur: ہادی کا چھ آدمیوں اور سات سواروں کے ساتھ الحجر میں داخل ہونا اور گلی میں لڑنا، ذی الحجہ 286ھ
summary:
  ar: يدخل الهادي الحجر فيتفرق عنه الناس ولا يبقى معه إلا ستة رجال وسبعة فرسان، فيقف على باب داره ويواجهه جيش بني الحارث عند المسجد، ويرفض إشارة فرسانه بالانصراف، ثم يحمل عليهم ويطعن أولهم ويدخل خلفهم زقاقاً ضيقاً.
  en: Al-Hadi enters al-Hajar and the people fall away until only six men and seven horsemen are with him; he halts at the door of his house with the Harithi host facing him at the mosque, refuses his horsemen's advice to leave, then charges, spears the foremost man and follows them into a narrow lane.
  ur: ہادی الحجر میں داخل ہوتے ہیں اور لوگ ہٹ جاتے ہیں یہاں تک کہ ان کے ساتھ صرف چھ آدمی اور سات سوار رہ جاتے ہیں؛ وہ اپنے گھر کے دروازے پر رکتے ہیں، مسجد کے پاس بنو حارث کا لشکر سامنے ہوتا ہے، وہ سواروں کا لوٹنے کا مشورہ رد کرتے ہیں، پھر حملہ کر کے سب سے آگے والے کو نیزہ مارتے ہیں اور ان کے پیچھے ایک تنگ گلی میں جاتے ہیں۔
