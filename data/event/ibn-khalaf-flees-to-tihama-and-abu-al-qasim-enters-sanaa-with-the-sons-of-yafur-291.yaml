id: event/ibn-khalaf-flees-to-tihama-and-abu-al-qasim-enters-sanaa-with-the-sons-of-yafur-291
class: event
kind: other
label:
  ar: فرار ابن خلف إلى تهامة ودخول أبي القاسم صنعاء مع ابني يعفر وغلاء الأسعار فيها، صفر 291هـ
  en: Ibn Khalaf flees to Tihama, Abu al-Qasim enters Sana'a with the sons of Ya'fur and the dearth in the city, Safar 291 AH
  ur: ابن خلف کا تہامہ فرار، ابو القاسم کا یعفر کے بیٹوں کے ساتھ صنعاء میں داخلہ اور شہر میں مہنگائی، صفر 291ھ
summary:
  ar: في الغد يخرج ابنا يعفر ومعهما أبو القاسم، فتخرج خيل من صنعاء مستأمنة، ويتبين أن ابن خلف هرب إلى تهامة، فيدخلون صنعاء وينزلون دار أبي جعفر العلوي، ويدخل جفتم في جماعة، ثم يعرض ابنا يعفر على أبي القاسم أن يسير إلى شبام مع أحمد بن أبي الخير، وتُذكر شدة الغلاء والجوع.
  en: Next morning the two sons of Ya'fur set out with Abu al-Qasim; horse from Sana'a come out asking safe-conduct and it is found that Ibn Khalaf has fled to Tihama; they enter Sana'a and lodge at the house of Abu Ja'far al-Alawi, Jaftam comes in with a party, and the sons of Ya'fur then propose that Abu al-Qasim go to Shibam with Ahmad ibn Abi al-Khayr; the severity of the dearth and hunger is reported.
  ur: اگلی صبح یعفر کے دونوں بیٹے ابو القاسم کے ساتھ نکلتے ہیں؛ صنعاء سے امان مانگنے والے سوار نکلتے ہیں اور معلوم ہوتا ہے کہ ابن خلف تہامہ بھاگ گیا؛ وہ صنعاء میں داخل ہو کر ابو جعفر علوی کے گھر ٹھہرتے ہیں، جفتم ایک جماعت کے ساتھ آتا ہے، پھر یعفر کے بیٹے ابو القاسم کو احمد بن ابی الخیر کے ساتھ شبام جانے کی تجویز دیتے ہیں؛ قحط اور بھوک کی شدت بیان ہوتی ہے۔
