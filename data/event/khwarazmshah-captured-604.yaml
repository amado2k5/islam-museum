label: { ar: "أسر خوارزم شاه من الخطا وخلاصه", en: "The capture of Khwarazmshah by the Khita and his release" }
summary:
  ar: "في سنة أربع وستمائة اقتتل خوارزم شاه علاء الدين محمد مع الخطا فانهزم المسلمون هزيمة قبيحة وأسر كثير منهم وكان من جملة الأسرى خوارزم شاه مع أمير كبير بن شهاب الدين مسعود أسرهما رجل واحد، فلما أسر قال له ابن مسعود يجب أن تدع السلطنة في هذه الأيام وتصير خادماً لعلي أحتال في خلاصك، فشرع خوارزم شاه يخدمه ويقدم له الطعام ويخلعه ثيابه وخفه ويعظمه، فقال الآسر لابن مسعود أرى هذا الرجل يعظمك فمن أنت فقال أنا فلان وهذا غلامي فأكرمه وتركه أياماً، ثم قال ابن مسعود إني خائف أن يرجع المنهزمون فلا يدرون مكاني فيعملون العزاء ويقتسمون مالي فقرر عليه مالاً وقال لآسره إن أصحابكم لا يعرفون أهلنا ولكن غلامي هذا أثق به فأذن له فسيره وأرسل معه فرساناً يحمونه، فساروا حتى قاربوا خوارزم وعاد الفرسان عن خوارزم شاه فوصل إليها فاستبشر به الناس وضربت البشائر وزينت البلد، وكان أخوه علي شاه قد دعا لنفسه بطبرستان وقطع خطبته وأخذ كزلك خان نيسابور وأعاد حصار هراة مرتقباً فقد السلطان، فسار خوارزم شاه إلى خراسان فوصلها في اليوم السادس ومعه ستة فرسان فهرب كزلك خان بأمواله {cite:kamil-ibn-al-athir p. 335-336}."
  en: "In 604 Khwarazmshah Ala al-Din Muhammad fought the Khita; the Muslims were routed in a shameful defeat and many were taken prisoner, among them the Khwarazmshah and a great amir, Ibn Shihab al-Din Mas'ud, whom one man captured together. Once taken, Ibn Mas'ud told him: 'You must set aside the sultanate in these days and become a servant; I will contrive your release.' The Khwarazmshah began to serve him, bringing him food, taking off his clothes and shoes for him and honouring him. The captor said to Ibn Mas'ud: 'I see this man honouring you; who are you?' He replied: 'I am so-and-so, and this is my servant.' The captor treated him kindly and left him for some days. Then Ibn Mas'ud said: 'I fear the fugitives may return without knowing where I am, hold mourning rites, and divide my property.' He set a ransom on him and told his captor: 'Your companions do not know our people, but this servant of mine I trust.' The captor let him go, sending horsemen to protect him. They travelled until they neared Khwarazm, and the horsemen turned back; the Khwarazmshah reached the city, the people rejoiced, drums were beaten and the city was decorated. His brother Ali Shah had proclaimed himself in Tabaristan and cut the khutba for him; Kizlik Khan took Nishapur, and the siege of Herat was resumed, waiting for the sultan to be lost. The Khwarazmshah set out for Khurasan and reached it on the sixth day with six horsemen; Kizlik Khan fled with his wealth {cite:kamil-ibn-al-athir p. 335-336}."
