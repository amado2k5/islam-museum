label: { ar: "أسر خوارزم شاه من الخطا وخلاصه", en: "The capture of Khwarazmshah by the Khita and his release", es: "La captura de Khwarazmshah por los Khita y su liberación.", fr: "La capture de Khwarezmshah par les Khita et sa libération", ur: "خوارزمشاہ پر خیتا کا قبضہ اور اس کی رہائی" }
summary:
  ar: "في سنة أربع وستمائة اقتتل خوارزم شاه علاء الدين محمد مع الخطا فانهزم المسلمون هزيمة قبيحة وأسر كثير منهم وكان من جملة الأسرى خوارزم شاه مع أمير كبير بن شهاب الدين مسعود أسرهما رجل واحد، فلما أسر قال له ابن مسعود يجب أن تدع السلطنة في هذه الأيام وتصير خادماً لعلي أحتال في خلاصك، فشرع خوارزم شاه يخدمه ويقدم له الطعام ويخلعه ثيابه وخفه ويعظمه، فقال الآسر لابن مسعود أرى هذا الرجل يعظمك فمن أنت فقال أنا فلان وهذا غلامي فأكرمه وتركه أياماً، ثم قال ابن مسعود إني خائف أن يرجع المنهزمون فلا يدرون مكاني فيعملون العزاء ويقتسمون مالي فقرر عليه مالاً وقال لآسره إن أصحابكم لا يعرفون أهلنا ولكن غلامي هذا أثق به فأذن له فسيره وأرسل معه فرساناً يحمونه، فساروا حتى قاربوا خوارزم وعاد الفرسان عن خوارزم شاه فوصل إليها فاستبشر به الناس وضربت البشائر وزينت البلد، وكان أخوه علي شاه قد دعا لنفسه بطبرستان وقطع خطبته وأخذ كزلك خان نيسابور وأعاد حصار هراة مرتقباً فقد السلطان، فسار خوارزم شاه إلى خراسان فوصلها في اليوم السادس ومعه ستة فرسان فهرب كزلك خان بأمواله {cite:kamil-ibn-al-athir p. 335-336}."
  en: "In 604 Khwarazmshah Ala al-Din Muhammad fought the Khita; the Muslims were routed in a shameful defeat and many were taken prisoner, among them the Khwarazmshah and a great amir, Ibn Shihab al-Din Mas'ud, whom one man captured together. Once taken, Ibn Mas'ud told him: 'You must set aside the sultanate in these days and become a servant; I will contrive your release.' The Khwarazmshah began to serve him, bringing him food, taking off his clothes and shoes for him and honouring him. The captor said to Ibn Mas'ud: 'I see this man honouring you; who are you?' He replied: 'I am so-and-so, and this is my servant.' The captor treated him kindly and left him for some days. Then Ibn Mas'ud said: 'I fear the fugitives may return without knowing where I am, hold mourning rites, and divide my property.' He set a ransom on him and told his captor: 'Your companions do not know our people, but this servant of mine I trust.' The captor let him go, sending horsemen to protect him. They travelled until they neared Khwarazm, and the horsemen turned back; the Khwarazmshah reached the city, the people rejoiced, drums were beaten and the city was decorated. His brother Ali Shah had proclaimed himself in Tabaristan and cut the khutba for him; Kizlik Khan took Nishapur, and the siege of Herat was resumed, waiting for the sultan to be lost. The Khwarazmshah set out for Khurasan and reached it on the sixth day with six horsemen; Kizlik Khan fled with his wealth {cite:kamil-ibn-al-athir p. 335-336}."
  es: "En el año 604, el sha de Corasmia Ala al-Din Muhammad luchó contra los Khita; los musulmanes sufrieron una humillante derrota y muchos fueron hechos prisioneros, entre ellos el sha de Corasmia y un gran emir, Ibn Shihab al-Din Mas'ud, a quien un solo hombre capturó. Una vez capturado, Ibn Mas'ud le dijo: «Debes renunciar al sultanato en estos días y convertirte en un sirviente; yo me encargaré de tu liberación». El sha de Corasmia comenzó a servirle, trayéndole comida, quitándole la ropa y los zapatos y honrándolo. El captor le preguntó a Ibn Mas'ud: «Veo a este hombre honrándote; ¿quién eres?». Él respondió: «Soy fulano de tal, y este es mi sirviente». El captor lo trató con amabilidad y lo dejó en libertad durante algunos días. Entonces Ibn Mas'ud dijo: «Temo que los fugitivos regresen sin saber dónde estoy, celebren ritos de luto y se repartan mis bienes». Pidió un rescate por él y le dijo a su captor: «Tus compañeros no conocen a nuestra gente, pero en este siervo mío confío». El captor lo dejó ir y envió jinetes para protegerlo. Viajaron hasta acercarse a Corasmia, y los jinetes regresaron; el sha de Corasmia llegó a la ciudad, el pueblo se regocijó, se tocaron tambores y la ciudad fue engalanada. Su hermano Ali Shah se había proclamado en Tabaristán y había pronunciado el sermón en su honor; Kizlik Khan tomó Nishapur y se reanudó el asedio de Herat, esperando la desaparición del sultán. El sha de Corasmia partió hacia Jorasán y llegó allí al sexto día con seis jinetes; Kizlik Khan huyó con sus riquezas {cite:kamil-ibn-al-athir p. 335-336}."
  fr: "En 604, le Khwarezmshah Ala al-Din Muhammad affronta les Khita. Les musulmans furent mis en déroute et subirent une défaite humiliante. Nombre d'entre eux furent faits prisonniers, parmi lesquels le Khwarezmshah et un grand émir, Ibn Shihab al-Din Mas'ud, capturés ensemble par un seul homme. Une fois fait prisonnier, Ibn Mas'ud lui dit: « Tu dois renoncer au sultanat en ces temps difficiles et devenir un serviteur; je ferai en sorte que tu sois libéré. » Le Khwarezmshah se mit à le servir, lui apportant à manger, ôtant ses vêtements et ses chaussures et le couvrant d'honneurs. Le ravisseur demanda à Ibn Mas'ud: « Je vois cet homme te rendre hommage; qui es-tu ? » Il répondit: « Je suis untel, et ceci est mon serviteur. » Le ravisseur le traita avec bienveillance et le laissa en paix pendant quelques jours. Puis Ibn Mas'ud dit: « Je crains que les fugitifs ne reviennent sans savoir où je suis, qu'ils célèbrent des rites funéraires et se partagent mes biens. » Il exigea une rançon pour sa capture et dit à son ravisseur: « Tes compagnons ne connaissent pas notre peuple, mais j’ai confiance en mon serviteur. » Le ravisseur le laissa partir et envoya des cavaliers pour le protéger. Ils voyagèrent jusqu’aux abords de Khwarezm, puis les cavaliers rebroussèrent chemin. Le Khwarezmshah atteignit la ville, le peuple exulta, les tambours résonnèrent et la ville fut décorée. Son frère Ali Shah s’était proclamé au Tabaristan et avait prononcé le sermon (khutba) en son nom. Kizlik Khan prit Nishapur et le siège d’Hérat reprit, dans l’attente de la défaite du sultan. Le Khwarezmshah se mit en route pour le Khorasan et l’atteignit le sixième jour avec six cavaliers. Kizlik Khan s’enfuit avec ses richesses."
  ur: "604 میں خوارزمشاہ علاء الدین محمد نے خیتا سے جنگ کی۔ مسلمانوں کو شرمناک شکست ہوئی اور بہت سے لوگوں کو قید کر لیا گیا، ان میں خوارزمشاہ اور ایک عظیم امیر ابن شہاب الدین مسعود تھے، جنہیں ایک شخص نے مل کر پکڑ لیا۔ ایک بار لے جانے کے بعد ابن مسعود نے اس سے کہا: 'تم ان دنوں میں سلطنت کو الگ کر دو اور خادم بن جاؤ۔ میں تمہاری رہائی کے لیے کوشش کروں گا۔' خوارزم شاہ اس کی خدمت کرنے لگا، اس کے لیے کھانا لایا، اس کے لیے اس کے کپڑے اور جوتے اتارے اور اس کی تعظیم کی۔ قیدی نے ابن مسعود سے کہا: میں اس شخص کو آپ کی تعظیم کرتے ہوئے دیکھ رہا ہوں۔ تم کون ہو؟' اس نے جواب دیا: میں فلاں ہوں اور یہ میرا بندہ ہے۔ اغوا کار نے اس کے ساتھ حسن سلوک کیا اور اسے کچھ دنوں کے لیے چھوڑ دیا۔ پھر ابن مسعود نے کہا: 'مجھے ڈر ہے کہ بھاگنے والے یہ جانے بغیر واپس لوٹ جائیں گے کہ میں کہاں ہوں، سوگ منائیں اور میری جائیداد تقسیم کر دیں۔' اس نے اس پر فدیہ مقرر کیا اور اپنے قیدی سے کہا: 'تمہارے ساتھی ہمارے لوگوں کو نہیں جانتے لیکن میرے اس بندے پر مجھے بھروسہ ہے۔' اسیر نے اسے جانے دیا اور اس کی حفاظت کے لیے سوار بھیجے۔ انہوں نے سفر کیا یہاں تک کہ خوارزم کے قریب پہنچے اور سوار واپس لوٹ گئے۔ خوارزم شاہ شہر پہنچا، لوگوں نے خوشی کا اظہار کیا، ڈھول پیٹے گئے اور شہر کو سجایا گیا۔ اس کے بھائی علی شاہ نے خود کو طبرستان میں اعلان کیا تھا اور اس کے لیے خطبہ کاٹا تھا۔ کزلک خان نے نیشاپور لے لیا، اور ہرات کا محاصرہ دوبارہ شروع کر دیا گیا، سلطان کے کھو جانے کے انتظار میں۔ خوارزمشاہ خراسان کی طرف روانہ ہوا اور چھٹے دن چھ گھڑ سواروں کے ساتھ وہاں پہنچا۔ کزلک خان اپنی دولت لے کر بھاگ گیا۔ 335-336}۔"
