label: { ar: "أسر خوارزم شاه من الخطا وخلاصه" }
summary:
  ar: "في سنة أربع وستمائة اقتتل خوارزم شاه علاء الدين محمد مع الخطا فانهزم المسلمون هزيمة قبيحة وأسر كثير منهم وكان من جملة الأسرى خوارزم شاه مع أمير كبير بن شهاب الدين مسعود أسرهما رجل واحد، فلما أسر قال له ابن مسعود يجب أن تدع السلطنة في هذه الأيام وتصير خادماً لعلي أحتال في خلاصك، فشرع خوارزم شاه يخدمه ويقدم له الطعام ويخلعه ثيابه وخفه ويعظمه، فقال الآسر لابن مسعود أرى هذا الرجل يعظمك فمن أنت فقال أنا فلان وهذا غلامي فأكرمه وتركه أياماً، ثم قال ابن مسعود إني خائف أن يرجع المنهزمون فلا يدرون مكاني فيعملون العزاء ويقتسمون مالي فقرر عليه مالاً وقال لآسره إن أصحابكم لا يعرفون أهلنا ولكن غلامي هذا أثق به فأذن له فسيره وأرسل معه فرساناً يحمونه، فساروا حتى قاربوا خوارزم وعاد الفرسان عن خوارزم شاه فوصل إليها فاستبشر به الناس وضربت البشائر وزينت البلد، وكان أخوه علي شاه قد دعا لنفسه بطبرستان وقطع خطبته وأخذ كزلك خان نيسابور وأعاد حصار هراة مرتقباً فقد السلطان، فسار خوارزم شاه إلى خراسان فوصلها في اليوم السادس ومعه ستة فرسان فهرب كزلك خان بأمواله {cite:kamil-ibn-al-athir p. 335-336}."
