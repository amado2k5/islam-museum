label: { ar: "حصار النجير", en: "The Siege of al-Nujayr" }
summary:
  ar: "عند البلاذري: ردّة بني وليعة والأشعث بن قيس الكندي — أخذ زياد بن لبيد البياضي عامل النبي على حضرموت (وضمّت إليه كندة) من بعض كندة قلوصاً في الصدقة فوسمها بميسم الصدقة فسألوه ردّها وأخذ غيرها فأبى وقال «لست برادّ شيئاً وقع الميسم عليه» فانتقضت عليه كندة كلها إلا السكون الذين ثبتوا معه، وجمع له بنو عمرو بن معاوية فبيّتهم فيمن معه من المسلمين فقتل منهم بشراً فيهم مخوس ومشرح وجمد وأبضعة بنو معدي كرب الملقبون الملوك الأربعة وكانوا قد وفدوا على النبي ثم ارتدوا، وقُتلت أختهم المردة وقاتلها يحسبها رجلاً؛ ثم أقبل زياد بالسبي والأموال فحمي الأشعث أنفاً وخرج في جماعة من قومه فعرض لزياد فهزمهم زياد، فاجتمعت عظماء كندة إلى الأشعث فلما رأى زياد ذلك كتب إلى أبي بكر يستمده فكتب إلى المهاجر بن أبي أمية يأمره بإنجاده فلقيا الأشعث فيمن معه من المسلمين فقضا جمعه وأوقعا بأصحابه فقتلا منهم مقتلة عظيمة، ثم لجأوا إلى النجير وهو حصن لهم فحصرهم المسلمون حتى جُهدوا فطلب الأشعث الأمان لعدّة منهم وأخرج نفسه من العدّة — وكان الخفشيش الكندي معدان بن الأسود بن معدي كرب أخذ بحقوقه فقال «اجعلني من العدّة» — فنزل إلى زياد والمهاجر فبعثا به إلى أبي بكر فمنّ عليه وزوّجه أخته أم فروة بنت أبي قحافة (وقيل أخته قريبة) فولدت له محمداً وإسحاق وقريبة وحبابة وجعدة؛ وعمد الخليفة إلى غنيمة النجير فسأل المسلمين أن يشركوه فيها ففعلوا، وأمر بقطع أيدي نسوة بالنجير شمتن بوفاة النبي وأرجلهن منهن الثبجاء الحضرمية وهند بنت يامين اليهودية؛ وردّ سبايا النجير بالفداء على كل رأس أربعمائة درهم فاستسلف الأشعث من تجار المدينة فداءهم ثم ردّه لهم؛ وكان أبو بكر قد أمدّهما بعكرمة بن أبي جهل بعد انصرافه من عمان فقدم عليهما وقد فُتح النجير؛ وقال أبو بكر في ثلاث ندم عليهن: «وددت أني يوم أُتيت بالأشعث بن قيس ضربت عنقه، فإنه تخيل إليّ أنه لا يرى شراً إلا سعى فيه وأعان عليه»؛ وكانت خولان قد ارتدت فوجّه إليها أبو بكر يعلى بن منية فقاتلهم حتى أذعنوا وأقروا بالصدقة وقيل لم يلق حرباً فرجعوا إلى الإسلام، فكانت اليمن بين ثلاثة: المهاجر (صنعاء ومخاليفها)، وزياد (ما كان في يده)، ويعلى."
  en: "In al-Baladhuri: the apostasy of Banu Wali'a and al-Ash'ath ibn Qays al-Kindi — Ziyad ibn Labid al-Bayadi, the Prophet's agent over Hadramawt with Kinda joined to him, took a young she-camel from some Kindis for the alms and branded it with the alms-brand, and when they asked him to take another he refused, saying 'I will not return what the brand has fallen on', whereupon all Kinda rose against him save al-Sukun who stood firm with him; Banu Amr ibn Mu'awiya massed against him and he struck them by night, killing men including Mikhwas, Mishrah, Jamid and Abda'a sons of Ma'di Karib — called the four kings, who had come in delegation to the Prophet then apostatized — their sister al-Marada being killed by one who took her for a man; as Ziyad brought back the captives and goods al-Ash'ath's pride burned and he attacked with a company of his people, and Ziyad routed them, whereupon the chiefs of Kinda joined al-Ash'ath; seeing this Ziyad wrote to Abu Bakr for reinforcement and Abu Bakr ordered al-Muhajir ibn Abi Umayya to aid him, and they scattered his gathering and wrought a great slaughter, the remnant taking refuge in al-Nujayr, their fortress, which the Muslims besieged until they were exhausted; al-Ash'ath asked safety for a number of them, leaving himself out of the count — al-Khifshish al-Kindi, Ma'dan ibn al-Aswad, having held him to his claim saying 'include me in the count' — and came down to Ziyad and al-Muhajir, who sent him to Abu Bakr, who spared him and married him to his sister Umm Farwa bint Abi Quhafa (some say his sister Qurayba), who bore him Muhammad, Ishaq, Qurayba, Hubaba and Ja'da; the caliph asked the Muslims to let him share in al-Nujayr's booty and they did, and ordered the hands and feet cut of women of al-Nujayr who had gloated at the Prophet's death, among them al-Thabja' al-Hadramiyya and Hind bint Yamin the Jewess; al-Nujayr's captives were ransomed back at four hundred dirhams a head, al-Ash'ath borrowing from Medina's merchants to redeem them and then repaying it; Abu Bakr had reinforced them with Ikrama ibn Abi Jahl after his return from Oman, who arrived to find al-Nujayr already taken; among Abu Bakr's three regrets: 'I wish that the day al-Ash'ath ibn Qays was brought to me I had struck off his head, for it came to me that he sees no evil but he hastens to it and aids it'; Khawlan had also apostatized, and Abu Bakr sent Ya'la ibn Munya who fought them until they yielded and affirmed the alms — some say he met no fighting and they returned to Islam — leaving Yemen between three: al-Muhajir (San'a and its districts), Ziyad (what was in his hands) and Ya'la."
