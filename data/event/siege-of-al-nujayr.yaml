label: { ar: "حصار النجير", en: "The Siege of al-Nujayr", es: "El asedio de al-Nujayr", fr: "Le siège d'al-Nujayr", ur: "النجیر کا محاصرہ" }
summary:
  ar: "عند البلاذري: ردّة بني وليعة والأشعث بن قيس الكندي — أخذ زياد بن لبيد البياضي عامل النبي على حضرموت ⁦(وضمّت إليه كندة)⁩ من بعض كندة قلوصاً في الصدقة فوسمها بميسم الصدقة فسألوه ردّها وأخذ غيرها فأبى وقال «لست برادّ شيئاً وقع الميسم عليه» فانتقضت عليه كندة كلها إلا السكون الذين ثبتوا معه، وجمع له بنو عمرو بن معاوية فبيّتهم فيمن معه من المسلمين فقتل منهم بشراً فيهم مخوس ومشرح وجمد وأبضعة بنو معدي كرب الملقبون الملوك الأربعة وكانوا قد وفدوا على النبي ثم ارتدوا، وقُتلت أختهم المردة وقاتلها يحسبها رجلاً؛ ثم أقبل زياد بالسبي والأموال فحمي الأشعث أنفاً وخرج في جماعة من قومه فعرض لزياد فهزمهم زياد، فاجتمعت عظماء كندة إلى الأشعث فلما رأى زياد ذلك كتب إلى أبي بكر يستمده فكتب إلى المهاجر بن أبي أمية يأمره بإنجاده فلقيا الأشعث فيمن معه من المسلمين فقضا جمعه وأوقعا بأصحابه فقتلا منهم مقتلة عظيمة، ثم لجأوا إلى النجير وهو حصن لهم فحصرهم المسلمون حتى جُهدوا فطلب الأشعث الأمان لعدّة منهم وأخرج نفسه من العدّة — وكان الخفشيش الكندي معدان بن الأسود بن معدي كرب أخذ بحقوقه فقال «اجعلني من العدّة» — فنزل إلى زياد والمهاجر فبعثا به إلى أبي بكر فمنّ عليه وزوّجه أخته أم فروة بنت أبي قحافة ⁦(وقيل أخته قريبة)⁩ فولدت له محمداً وإسحاق وقريبة وحبابة وجعدة؛ وعمد الخليفة إلى غنيمة النجير فسأل المسلمين أن يشركوه فيها ففعلوا، وأمر بقطع أيدي نسوة بالنجير شمتن بوفاة النبي وأرجلهن منهن الثبجاء الحضرمية وهند بنت يامين اليهودية؛ وردّ سبايا النجير بالفداء على كل رأس أربعمائة درهم فاستسلف الأشعث من تجار المدينة فداءهم ثم ردّه لهم؛ وكان أبو بكر قد أمدّهما بعكرمة بن أبي جهل بعد انصرافه من عمان فقدم عليهما وقد فُتح النجير؛ وقال أبو بكر في ثلاث ندم عليهن: «وددت أني يوم أُتيت بالأشعث بن قيس ضربت عنقه، فإنه تخيل إليّ أنه لا يرى شراً إلا سعى فيه وأعان عليه»؛ وكانت خولان قد ارتدت فوجّه إليها أبو بكر يعلى بن منية فقاتلهم حتى أذعنوا وأقروا بالصدقة وقيل لم يلق حرباً فرجعوا إلى الإسلام، فكانت اليمن بين ثلاثة: المهاجر ⁦(صنعاء ومخاليفها)⁩، وزياد ⁦(ما كان في يده)⁩، ويعلى."
  en: "In al-Baladhuri: the apostasy of Banu Wali'a and al-Ash'ath ibn Qays al-Kindi — Ziyad ibn Labid al-Bayadi, the Prophet's agent over Hadramawt with Kinda joined to him, took a young she-camel from some Kindis for the alms and branded it with the alms-brand, and when they asked him to take another he refused, saying 'I will not return what the brand has fallen on', whereupon all Kinda rose against him save al-Sukun who stood firm with him; Banu Amr ibn Mu'awiya massed against him and he struck them by night, killing men including Mikhwas, Mishrah, Jamid and Abda'a sons of Ma'di Karib — called the four kings, who had come in delegation to the Prophet then apostatized — their sister al-Marada being killed by one who took her for a man; as Ziyad brought back the captives and goods al-Ash'ath's pride burned and he attacked with a company of his people, and Ziyad routed them, whereupon the chiefs of Kinda joined al-Ash'ath; seeing this Ziyad wrote to Abu Bakr for reinforcement and Abu Bakr ordered al-Muhajir ibn Abi Umayya to aid him, and they scattered his gathering and wrought a great slaughter, the remnant taking refuge in al-Nujayr, their fortress, which the Muslims besieged until they were exhausted; al-Ash'ath asked safety for a number of them, leaving himself out of the count — al-Khifshish al-Kindi, Ma'dan ibn al-Aswad, having held him to his claim saying 'include me in the count' — and came down to Ziyad and al-Muhajir, who sent him to Abu Bakr, who spared him and married him to his sister Umm Farwa bint Abi Quhafa (some say his sister Qurayba), who bore him Muhammad, Ishaq, Qurayba, Hubaba and Ja'da; the caliph asked the Muslims to let him share in al-Nujayr's booty and they did, and ordered the hands and feet cut of women of al-Nujayr who had gloated at the Prophet's death, among them al-Thabja' al-Hadramiyya and Hind bint Yamin the Jewess; al-Nujayr's captives were ransomed back at four hundred dirhams a head, al-Ash'ath borrowing from Medina's merchants to redeem them and then repaying it; Abu Bakr had reinforced them with Ikrama ibn Abi Jahl after his return from Oman, who arrived to find al-Nujayr already taken; among Abu Bakr's three regrets: 'I wish that the day al-Ash'ath ibn Qays was brought to me I had struck off his head, for it came to me that he sees no evil but he hastens to it and aids it'; Khawlan had also apostatized, and Abu Bakr sent Ya'la ibn Munya who fought them until they yielded and affirmed the alms — some say he met no fighting and they returned to Islam — leaving Yemen between three: al-Muhajir (San'a and its districts), Ziyad (what was in his hands) and Ya'la."
  es: "En al-Baladhuri: la apostasía de Banu Wali'a y al-Ash'ath ibn Qays al-Kindi: Ziyad ibn Labid al-Bayadi, el agente del Profeta sobre Hadramawt con Kinda unido a él, tomó una camella joven de algunos Kindis para la limosna y la marcó con el hierro candente, y cuando le pidieron que tomara otra, se negó, diciendo 'No devolveré lo que ha sido marcado', por lo que todos los Kinda se alzaron contra él excepto al-Sukun que se mantuvo firme con él; Banu Amr ibn Mu'awiya se reunió contra él y los atacó por la noche, matando a hombres, incluidos Mikhwas, Mishrah, Jamid y Abda'a hijos de Ma'di Karib, llamados los cuatro reyes, que habían venido en delegación al Profeta y luego apostataron; su hermana al-Marada fue asesinada por alguien que la tomó por un hombre; Cuando Ziyad recuperó a los cautivos y los bienes, el orgullo de al-Ash'ath se encendió y atacó con una compañía de su gente, pero Ziyad los derrotó, tras lo cual los jefes de Kinda se unieron a al-Ash'ath; al ver esto, Ziyad escribió a Abu Bakr pidiendo refuerzos y Abu Bakr ordenó a al-Muhajir ibn Abi Umayya que lo ayudara, y dispersaron a su grupo y causaron una gran matanza, el remanente se refugió en al-Nujayr, su fortaleza, que los musulmanes sitiaron hasta que se agotaron; al-Ash'ath pidió protección para varios de ellos, excluyéndose a sí mismo del recuento —al-Khifshish al-Kindi, Ma'dan ibn al-Aswad, habiéndole insistido en su pretensión diciendo 'inclúyanme en el recuento'— y fue a Ziyad y al-Muhajir, quienes lo enviaron a Abu Bakr, quien lo perdonó y lo casó con su hermana Umm Farwa bint Abi Quhafa (algunos dicen que su hermana Qurayba), quien le dio a luz a Muhammad, Ishaq, Qurayba, Hubaba y Ja'da; el califa pidió a los musulmanes que le permitieran participar del botín de al-Nujayr y ellos accedieron, y ordenó que se cortaran las manos y los pies de las mujeres de al-Nujayr que se habían regocijado con la muerte del Profeta, entre ellas al-Thabja' al-Hadramiyya y Hind bint Yamin la judía; Los cautivos de al-Nujayr fueron rescatados a cambio de cuatrocientos dirhams por cabeza, al-Ash'ath pidió prestado a los mercaderes de Medina para redimirlos y luego lo pagó; Abu Bakr los había reforzado con Ikrama ibn Abi Jahl después de su regreso de Omán, quien llegó para encontrar a al-Nujayr ya capturado; entre los tres arrepentimientos de Abu Bakr: 'Ojalá el día que me trajeron a al-Ash'ath ibn Qays le hubiera cortado la cabeza, porque se me ocurrió que no ve el mal sino que se apresura a él y lo ayuda'; Khawlan también había apostatado, y Abu Bakr envió a Ya'la ibn Munya, quien luchó contra ellos hasta que se rindieron y confirmaron la limosna —algunos dicen que no encontró resistencia y que volvieron al Islam— dejando Yemen dividido entre tres: al-Muhajir (San'a y sus distritos), Ziyad (lo que estaba en sus manos) y Ya'la."
  fr: "Dans al-Baladhuri: l'apostasie des Banu Wali'a et d'al-Ash'ath ibn Qays al-Kindi — Ziyad ibn Labid al-Bayadi, l'agent du Prophète sur le Hadramaout, auquel les Kinda s'étaient ralliés, prit une jeune chamelle à des Kinda pour l'aumône et la marqua du sceau de l'aumône. Lorsqu'ils lui demandèrent d'en prendre une autre, il refusa, disant: « Je ne rendrai pas ce qui a été marqué. » Sur ce, tous les Kinda se soulevèrent contre lui, à l'exception d'al-Sukun qui lui resta fidèle. Les Banu Amr ibn Mu'awiya se rassemblèrent contre lui et il les attaqua de nuit, tuant des hommes, dont Mikhwas, Mishrah, Jamid et Abda'a, fils de Ma'di Karib — appelés les quatre rois, qui étaient venus en délégation auprès du Prophète puis avaient apostasié — leur sœur al-Marada étant tuée par un homme qui l'avait prise pour un homme. Lorsque Ziyad ramena les captifs et les biens, l'orgueil d'al-Ash'ath s'enflamma et il attaqua avec une troupe de ses hommes, et Ziyad les mit en déroute, sur quoi les chefs de Kinda rejoignirent al-Ash'ath; voyant cela, Ziyad écrivit à Abu Bakr pour obtenir des renforts et Abu Bakr ordonna à al-Muhajir ibn Abi Umayya de l'aider, et ils dispersèrent son rassemblement et causèrent un grand massacre, le reste se réfugiant dans al-Nujayr, leur forteresse, que les musulmans assiégèrent jusqu'à épuisement; al-Ash'ath demanda la sécurité pour plusieurs d'entre eux, s'excluant lui-même du décompte — al-Khifshish al-Kindi, Ma'dan ibn al-Aswad, l'ayant contraint à maintenir sa revendication en disant « incluez-moi dans le décompte » — et descendit auprès de Ziyad et al-Muhajir, qui l'envoyèrent auprès d'Abu Bakr, qui l'épargna et le maria à sa sœur Umm Farwa bint Abi Quhafa (certains disent sa sœur Qurayba), qui lui donna Muhammad, Ishaq, Qurayba, Hubaba et Ja'da; le calife demanda aux musulmans de le laisser partager le butin d'al-Nujayr et ils le firent, et ordonna que les mains et les pieds soient coupés des femmes d'al-Nujayr qui s'étaient réjouies de la mort du Prophète, parmi lesquelles al-Thabja' al-Hadramiyya et Hind bint Yamin la Juive; Les captifs d'al-Nujayr furent rachetés à hauteur de quatre cents dirhams par personne. Al-Ash'ath emprunta auprès des marchands de Médine pour les racheter, puis remboursa la somme. Abou Bakr les avait renforcés avec Ikrama ibn Abi Jahl à son retour d'Oman, mais celui-ci trouva al-Nujayr déjà capturé. Parmi les trois regrets d'Abou Bakr: « Si seulement j'avais tranché la tête d'al-Ash'ath ibn Qays le jour où on me l'a amené, car il m'est apparu qu'il ne voit aucun mal sans s'y précipiter et l'aider. » Khawlan avait également apostasié, et Abou Bakr envoya Ya'la ibn Munya qui les combattit jusqu'à ce qu'ils se rendent et confirment l'aumône. Certains disent qu'il ne rencontra aucun combat et qu'ils retournèrent à l'islam. Le Yémen se retrouva alors divisé en trois camps: al-Muhajir (San'a et ses environs), Ziyad (la partie sous son contrôle) et Ya'la."
  ur: "البلادوری میں ہے: بنو ولیعہ اور اشعث بن قیس کندی کا ارتداد - زیاد بن لبید البیادی، حضرموت پر نبی کے نمائندے نے کندہ کے ساتھ اس کے ساتھ مل کر کچھ کندیوں سے ایک چھوٹی اونٹنی کو صدقہ کے لیے لیا اور جب انہوں نے اس سے انکار کیا تو انہوں نے یہ کہہ کر انکار کر دیا: 'میں اس چیز کو واپس نہیں کروں گا جس پر برانڈ گرا ہے'، اس کے بعد تمام قسم کے لوگ اس کے خلاف اٹھ کھڑے ہوئے سوائے السقون کے جو اس کے ساتھ کھڑا تھا۔ بنو عمرو بن معاویہ اس کے خلاف جمع ہوئے اور اس نے رات کو ان پر حملہ کیا، جن میں معدی کریب کے بیٹے میخواس، مشرہ، جمید اور عبداﷲ شامل تھے، کو قتل کر دیا- ان چاروں بادشاہوں کو بلایا گیا، جو رسول اللہ کے پاس وفد کے ساتھ آئے تھے، پھر مرتد ہو گئے، ان کی بہن المرادہ کو ایک شخص کے ہاتھوں قتل کر دیا گیا جس نے اسے مرد بنا لیا تھا۔ جب زیاد اسیروں اور سامان کو واپس لے کر آیا تو اشعث کا غرور جل گیا اور اس نے اپنی قوم کے ایک گروہ کے ساتھ حملہ کیا، اور زیاد نے ان کو شکست دی، جس کے بعد کندہ کے سردار اشعث میں شامل ہو گئے۔ یہ دیکھ کر زیاد نے ابوبکر کو کمک کے لیے خط لکھا اور ابوبکر نے مہاجر ابن ابی امیہ کو حکم دیا کہ وہ اس کی مدد کریں، اور انہوں نے اس کے اجتماع کو منتشر کر دیا اور ایک عظیم قتل عام کیا، بقیہ ان کے قلعہ النجیر میں پناہ لے رہے تھے، جس کا مسلمانوں نے محاصرہ کر لیا، یہاں تک کہ وہ ختم ہو گئے۔ اشعث نے ان میں سے بہت سے لوگوں کی حفاظت کی درخواست کی، خود کو گنتی سے باہر چھوڑ دیا - الخفش الکندی، معدن بن الاسود نے اسے اپنے دعوے پر قائم رکھا کہ 'مجھے گنتی میں شامل کرو' - اور زیاد اور المہاجر کے پاس آیا، جس نے اسے ابوبکر کے پاس بھیجا، جس نے اسے بچا لیا اور اس کی بہن فروثہ سے اس کی شادی کر دی۔ قریبہ) جس سے محمد، اسحاق، قریبہ، حبابہ اور جدہ پیدا ہوئے۔ خلیفہ نے مسلمانوں سے کہا کہ وہ اسے النجیر کے مال غنیمت میں شریک کرنے دیں اور انہوں نے ایسا کیا، اور النجیر کی ان عورتوں کے ہاتھ پاؤں کاٹنے کا حکم دیا جنہوں نے رسول اللہ کے وصال پر خوشی منائی تھی، ان میں الثبجہ الحدرمیہ اور ہند بنت یامین یہودی تھیں۔ النجیر کے اسیروں کو چار سو درہم فی سر کے حساب سے فدیہ دیا گیا، اشعث مدینہ کے تاجروں سے قرض لے کر ان کو چھڑانے کے لیے اور پھر اسے واپس کر دیا۔ ابوبکر نے عمان سے واپسی کے بعد عکرمہ بن ابی جہل کے ساتھ ان کو تقویت بخشی تھی، جو پہلے سے لے گئے النجیر کو تلاش کرنے پہنچے تھے۔ ابوبکر کے تین ندامتوں میں سے ایک: 'کاش جس دن اشعث بن قیس کو میرے پاس لایا جاتا میں اس کا سر قلم کر دیتا، کیونکہ مجھے یہ بات پہنچی کہ وہ کوئی برائی نہیں دیکھتا لیکن اس کی طرف جلدی کرتا ہے اور اس کی مدد کرتا ہے'۔ خولان بھی مرتد ہو گیا تھا، اور ابوبکر نے یعلی بن منیہ کو بھیجا جس نے ان سے لڑائی کی یہاں تک کہ انہوں نے صدقہ دیا اور کچھ کہتے ہیں کہ ان کی کوئی لڑائی نہیں ہوئی اور وہ اسلام واپس آگئے - یمن کو تین کے درمیان چھوڑ کر: المہاجر ⁦(صنعاء اور اس کے اضلاع)⁩، زیاد ⁦(جو اس کے ہاتھ میں تھا)⁩ اور یعلیٰ۔"
