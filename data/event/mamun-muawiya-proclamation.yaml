summary:
  ar: "في سنة إحدى عشرة ومئتين أمر المأمون بأن ينادى برئت الذمة ممن ذكر معاوية بخير وأن أفضل الخلق بعد رسول الله علي بن أبي طالب {cite:tarikh-khulafa-minhaj-1434 p. 488}."
  en: "In year 211 al-Ma'mun ordered it proclaimed: the dhimma is quit of whoever spoke well of Mu'awiya — and that the best of creation after the Messenger of God is Ali ibn Abi Talib {cite:tarikh-khulafa-minhaj-1434 p. 488}."
  es: "En el año 211, al-Ma'mun ordenó que se proclamara: la dhimma es renunciada para quien habló bien de Mu'awiya, y que el mejor de la creación después del Mensajero de Dios es Ali ibn Abi Talib {cite:tarikh-khulafa-minhaj-1434 p. 488}."
  fr: "En l'an 211, al-Ma'mun ordonna qu'il soit proclamé: la dhimma est levée pour quiconque a parlé en bien de Mu'awiya — et que la meilleure des créations après le Messager de Dieu est Ali ibn Abi Talib {cite: tarikh-khulafa-minhaj-1434 p. 488}."
