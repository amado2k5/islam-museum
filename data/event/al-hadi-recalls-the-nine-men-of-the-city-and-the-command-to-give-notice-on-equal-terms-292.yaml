label:
  ar: "الكتاب إلى بني الحارث: رهط المدينة والإيذان على سواء، ص276-277"
  en: "Al-Hadi's letter to Banu al-Harith: the nine men of the city and notice on equal terms, pp. 276-277"
  ur: "بنو حارث کے نام ہادی کا خط: شہر کے نو آدمی اور برابر اطلاعِ جنگ، ص276-277"
summary:
  ar: "يذكر الكتاب قصة تسعة رهط في المدينة ومكرهم وعاقبته، ثم يقول الهادي إنه أحق من تأدب بأدب الله، وإنه لا يستجيز الغدر ولا الخديعة، وإنه آذنهم بالحرب على سواء."
  en: "The letter recalls the nine men of the city and the end of their scheme, then al-Hadi says he is the readier to take God's discipline, that he allows no treachery or deceit, and that he has given them notice of war on equal terms."
  ur: "خط شہر کے نو آدمیوں اور ان کے مکر کے انجام کا ذکر کرتا ہے، پھر ہادی کہتے ہیں کہ وہ اللہ کے ادب سے ادب سیکھنے کے زیادہ حق دار ہیں، غدر اور فریب جائز نہیں سمجھتے اور برابری پر جنگ کی اطلاع دے چکے ہیں۔"
