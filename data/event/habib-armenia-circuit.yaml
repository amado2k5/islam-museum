label: { ar: "دورة حبيب بن مسلمة في أرمينية", en: "Habib ibn Maslama's Circuit of Armenia" }
summary:
  ar: "عند البلاذري: نزل حبيب خلاط فأتاه بطريقها بما عليه من المال وأهدى له هدية لم يقبلها منه، ثم سار إلى الصسانه فلقيه بها صاحب مكس — وهي ناحية من نواحي البسفرجان — فقاطعه على بلاده وكتب له كتاب صلح وأمان، ووجّه إلى قرى أرجيش وباجنيس من غلب عليها فجبى جزية رؤوس أهلها وأثنى وجوههم فقاطعهم على خراجها — فأما بحيرة الطريخ فلم يعرض لها ولم تزل مباحة حتى ولي محمد بن مروان الجزيرة وأرمينية فحوى صيدها وباعه فكان يستغلها ثم صارت لمروان بن محمد فقُبضت عنه؛ ثم أتى أزدساط وهي قرية القرمز وأجاز نهر الأكراد ونزل مرج دبيل فسرب الخيول إليها ثم زحف حتى نزل على بابها فتحصّن أهلها ورموه فوضع عليها منجنيقاً ورماهم حتى طلبوا الأمان والصلح فأعطاهم إياه وجالت خيوله فنزلت جُرني وبلغت أشوش وذات اللجُم والجبل ووادي الأحرار وغلبت على جميع قرى دبيل، ووجّه إلى سراج طير وبفروند فأتاه بطريقها فصالحه عنها على أتاوة يؤديها وعلى مناصحة المسلمين وقِراهم ومعاونتهم على أعدائهم؛ وكان كتاب صلح دبيل: «هذا كتاب من حبيب بن مسلمة لنصارى أهل دبين ومجوسها ويهودها شاهدهم وغائبهم إني أمنتكم على أنفسكم وأموالكم وكنائسكم وبيعكم وسور مدينتكم فأنتم آمنون وعلينا الوفاء لكم بالعهد ما وفيتم وأديتم الجزية والخراج شهد الله وكفى به شهيداً وختم حبيب بن مسلمة»؛ ثم أتى النشوى ففتحها على مثل صلح دبيل وقدم عليه بطريق البسفرجان فصالحه عن جميع بلاده على خراج يؤديه في كل سنة، ثم أتى السيسجان فعاورهم أهلها فهزمهم وغلب على ويص وصالح أهل القلاع بالسيسجان على خراج يؤدونه، ثم سار إلى جرزان؛ وحدثني مشايخ من أهل دبيل منهم برمك بن عبد الله قالوا: لما انتهوا إلى ذات اللجُم سرّحوا بعض دوابهم وجعلوا لجُمها فخرج عليهم قوم من العلوج فأعجلوهم عن الألجام فقاتلوهم فكشفهم العلوج وأخذوا تلك اللجُم وما قدروا عليه من الدواب ثم إنهم كرّوا عليهم فقتلوهم وارتجعوا ما أخذوا منهم فسمّي الموضع ذات اللجُم؛ وأتى حبيباً رسول بطريق جرزان وأهلها وهو يريدها فسأله كتاب صلح وأمان فكتب إليهم «أما بعد فإن نقلى رسولكم قدم عليّ وعلى الذين معي من المؤمنين فذكر عنكم أنكم أحببتم سلمنا وقد قوّمت حديثكم وحسبتها من جزيتكم وكتبت لكم أماناً واشترطت فيه شرطاً فإن قبلتموه ووفيتم به وإلا فأذنوا بحرب من الله ورسوله والسلام على من اتبع الهدى»."
  en: "In al-Baladhuri: Habib camped at Khilat, whose patrikios came with the tribute-money and a gift he would not accept, then marched to al-Sasana where the lord of Muks — a district of the Busfurrajan — met him and compounded for his lands, and Habib wrote him a peace and aman writ; he sent collectors to the villages of Arjish and Bajunays whose people he held, taxing the jizya on their heads and assessing their notables the kharaj — as for Lake al-Tarikh he did not touch it, and it stayed free until Muhammad ibn Marwan governed the Jazira and Armenia, annexed its fishery and sold it as revenue, whence it passed to Marwan ibn Muhammad and was seized; then he came to Azdisat, the village of al-Qirmiz, crossed the Kurds' river, camped at Marj Dabil grazing his horses, advanced to its gate where the people fortified themselves and shot at him, so he set a mangonel on it and battered them until they sought aman and peace — which he granted — while his cavalry ranged to Jurni, Ashush, Dhat al-Lujum, al-Jabal and Wadi al-Ahrar, taking all Dabil's villages; he sent to Siraj Tayr and Baghrawand whose patrikios compounded for a tribute and for loyalty to the Muslims, quartering them and aiding against their enemies; the writ of Dabil's peace ran: 'This is a writ from Habib ibn Maslama to the Christians of Dabil and its Magians and its Jews, present and absent: I have given you security on yourselves, your wealth, your churches, your houses of worship and the wall of your city — you are safe, and it is on us to keep the covenant while you keep it and pay the jizya and the kharaj; God witnesses, and God suffices as witness — sealed, Habib ibn Maslama'; then he took Nashwa on Dabil's terms, the Busfurrajan's patrikios compounded for all his lands on a yearly kharaj, and at Sisajan the people fought him — he routed them, took Ways and compounded with the castles' folk for kharaj, then marched for Jurzan; the shaykhs of Dabil, Barmak ibn Abdallah among them, told me: reaching Dhat al-Lujum they loosed some beasts' bridles, and a band of the Aluj came out, hurried them off the bridles and fought them — the Aluj prevailed and took the bridles and what beasts they could, then the Muslims wheeled on them, killed them and took back what was taken, whence the place is called 'of the bridles'; and the messenger of Jurzan's patrikios and people came to Habib as he marched on it, asking a writ of peace and aman, and Habib wrote: 'Your envoy's report reached me and the believers with me, saying of you that you desire our peace; I have assessed your matter and reckoned it of your jizya, and have written you an aman stipulating a condition — if you accept and fulfil it, well; else be warned of war from God and His messenger — and peace be on whoever follows guidance.'"
