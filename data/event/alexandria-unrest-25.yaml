summary:
  ar: "خلاف أهل الإسكندرية ونقضهم الصلح: كاتب الرومُ من كان فيها منهم ودعوهم إلى نقض الصلح فأجابوهم وسار إليهم من القسطنطينية جيش كثير عليهم منويل الخصي فأرسوا بها واتفق معهم من بها من الروم، ولم يوافقهم المقوقس بل ثبت على صلحه. فسار إليهم عمرو بن العاص والروم تسير إليه فالتقوا فاقتتلوا قتالًا شديدًا فانهزم الروم وأدخلهم المسلمون الإسكندرية وقتلوا منهم في البلد مقتلة عظيمة منهم منويل الخصي، وردّ عمرو لأهل القرى الذين لم يخالفوا أموالهم بعد إقامة البينة، وهدم سور الإسكندرية وتركها بغير سور {cite:kamil-ibn-al-athir p. 455}."
  en: "Alexandria broke its treaty: Constantinople shipped a large army under the eunuch Manuel, and the Romans inside the city joined them — though the Muqawqis kept his pact. 'Amr ibn al-'As marched, routed them, followed them into the streets and killed a great multitude including Manuel; he restored to the villagers who had not rebelled their confiscated property upon proof, and demolished Alexandria's walls, leaving her wall-less {cite:kamil-ibn-al-athir p. 455}."
