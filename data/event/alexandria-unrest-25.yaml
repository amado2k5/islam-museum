summary:
  ar: "خلاف أهل الإسكندرية ونقضهم الصلح: كاتب الرومُ من كان فيها منهم ودعوهم إلى نقض الصلح فأجابوهم وسار إليهم من القسطنطينية جيش كثير عليهم منويل الخصي فأرسوا بها واتفق معهم من بها من الروم، ولم يوافقهم المقوقس بل ثبت على صلحه. فسار إليهم عمرو بن العاص والروم تسير إليه فالتقوا فاقتتلوا قتالًا شديدًا فانهزم الروم وأدخلهم المسلمون الإسكندرية وقتلوا منهم في البلد مقتلة عظيمة منهم منويل الخصي، وردّ عمرو لأهل القرى الذين لم يخالفوا أموالهم بعد إقامة البينة، وهدم سور الإسكندرية وتركها بغير سور {cite:kamil-ibn-al-athir p. 455}."
  en: "Alexandria broke its treaty: Constantinople shipped a large army under the eunuch Manuel, and the Romans inside the city joined them — though the Muqawqis kept his pact. 'Amr ibn al-'As marched, routed them, followed them into the streets and killed a great multitude including Manuel; he restored to the villagers who had not rebelled their confiscated property upon proof, and demolished Alexandria's walls, leaving her wall-less {cite:kamil-ibn-al-athir p. 455}."
  es: "Alejandría rompió su tratado: Constantinopla envió un gran ejército al mando del eunuco Manuel, y los romanos dentro de la ciudad se unieron a ellos, aunque el Muqawqis mantuvo su pacto. Amr ibn al-As marchó, los derrotó, los persiguió por las calles y mató a una gran multitud, incluido Manuel; restituyó a los aldeanos que no se habían rebelado sus propiedades confiscadas tras presentar pruebas, y demolió las murallas de Alejandría, dejándola sin murallas {cite:kamil-ibn-al-athir p. 455}."
  fr: "Alexandrie rompit son traité: Constantinople envoya une importante armée sous le commandement de l’eunuque Manuel, et les Romains rejoignirent leurs rangs à l’intérieur de la ville – bien que le Muqawqis restât fidèle à son engagement. Amr ibn al-As marcha sur eux, les mit en déroute, les poursuivit dans les rues et massacra une foule immense, dont Manuel; il restitua aux villageois qui ne s’étaient pas rebellés leurs biens confisqués sur présentation de preuves, et fit démolir les murailles d’Alexandrie, la laissant sans remparts {cite: Kamil ibn al-Athir, p. 455}."
  ur: "اسکندریہ نے اپنا معاہدہ توڑ دیا: قسطنطنیہ نے خواجہ سرا مینوئل کے ماتحت ایک بڑی فوج بھیجی، اور شہر کے اندر رومی ان کے ساتھ شامل ہو گئے - حالانکہ مقوقس نے اپنا معاہدہ برقرار رکھا۔ عمرو بن العاص نے مارچ کیا، انہیں بھگا دیا، گلیوں میں ان کا پیچھا کیا اور مینوئل سمیت بہت سے لوگوں کو قتل کر دیا۔ اس نے ان دیہاتیوں کو بحال کر دیا جنہوں نے ثبوت پر اپنی ضبط کی گئی جائیداد سے بغاوت نہیں کی تھی، اور اسکندریہ کی دیواروں کو گرا دیا، اس کی دیوار کو چھوڑ دیا۔ 455}"
