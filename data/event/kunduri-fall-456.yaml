id: event/kunduri-fall-456
class: event
kind: other
label:
  ar: "وفاة طغرل بك وسقوط الكندري ورفع اللعن، ٤٥٦هـ"
  en: "Tughril Beg dies, al-Kunduri falls, and the cursing is rescinded, 456/1064"
  ur: "طغرل بیک کی وفات، کندری کا قتل اور لعن کا خاتمہ، 456ھ/1064ء"
  es: "Muere Tughril Beg, cae al-Kunduri y se levanta la maldición, 456/1064"
  fr: "Tughril Beg meurt, al-Kunduri tombe et la malédiction est levée, 456/1064"
  tr: "Tuğril Bey'in ölümü, el-Kundari'nin düşüşü ve lanetin kalkması, Hicri 456"
  id: "Kematian Tughril Beg, kejatuhan al-Kundari, dan pencabutan kutukan, 456 H"
summary:
  ar: "لم يمكث طغرل بك بعد إذنه باللعن وحبس القشيري إلا زماناً يسيراً حتى توفي سنة ٤٥٥هـ، وتسلطن بعده ولده ألب أرسلان، ولم يلبث الكندري إلا يسيراً حتى قتل شرّ قتلة سنة ٤٥٦هـ؛ ثم أسفر صباح الزمان عن طلعة الوزير نظام الملك فأمر بإسقاط ذكر اللعن وتأديب من فعله {cite:tabaqat-shafiiyya-subki p. 272}؛ وقتله ألب أرسلان بمرو الروذ في آخر سنة ست وخمسين وأربعمائة {cite:shadharat-dhahab p. 309}."
  en: "Tughril Beg survived his permission of the cursing and the imprisonment of al-Qushayri by only a short while, dying in 455/1063; his son Alp Arslan succeeded him, and al-Kunduri was killed at Marw al-Rudh at the end of 456/1064; then the age dawned with vizier Nizam al-Mulk, who ordered the mention of cursing dropped and its perpetrators disciplined {cite:tabaqat-shafiiyya-subki p. 272; cite:shadharat-dhahab p. 309}."
  ur: "طغرل بیک نے لعن کی اجازت اور قشیری کی قید کے بعد زیادہ عرصہ نہ پایا اور 455ھ/1063ء میں فوت ہوا؛ اس کے بعد اس کا بیٹا الب ارسلان سلطان بنا اور کندری کو 456ھ/1064ء کے آخر میں مروالروذ میں قتل کیا گیا؛ پھر وزیر نظام الملک کے دور نے طلوع پایا جس نے لعن کا ذکر ختم کرنے اور فتنہ پھیلانے والوں کی تنبیہ کا حکم دیا {cite:tabaqat-shafiiyya-subki p. 272; cite:shadharat-dhahab p. 309}۔"
  es: "Tughril Beg sobrevivió a su autorización para maldecir y al encarcelamiento de al-Qushayri por poco tiempo, muriendo en 455/1063; su hijo Alp Arslan lo sucedió, y al-Kunduri fue asesinado en Marw al-Rudh a finales de 456/1064; luego amaneció la era con el visir Nizam al-Mulk, quien ordenó que se dejara de mencionar la maldición y que se disciplinara a sus perpetradores {cite:tabaqat-shafiiyya-subki p. 272; cite:shadharat-dhahab p. 309}."
  fr: "Tughril Beg survécut de peu de temps à sa permission de maudire et à l'emprisonnement d'al-Qushayri, mourant en 455/1063; son fils Alp Arslan lui succéda, et al-Kunduri fut tué à Marw al-Rudh à la fin de 456/1064; puis l'ère commença avec le vizir Nizam al-Mulk, qui ordonna que toute mention de malédiction soit abandonnée et que ses auteurs soient disciplinés {cite:tabaqat-shafiiyya-subki p. 272; cite:shadharat-dhahab p. 309}."
  tr: "Tuğril Bey, lanete izin verdikten ve el-Kuşeyri'yi hapse attıktan sonra uzun süre tahtta kalmadı ve 455 Hicri yılında öldü. Oğlu Alp Arslan ondan sonra sultan oldu ve el-Kundari de 456 Hicri yılında en kötü şekilde öldürülmeden önce uzun süre tahtta kalmadı. Sonra sabahleyin vezir Nizam el-Mulk göründü ve lanetin anılmasının kaldırılmasını ve bunu yapanın cezalandırılmasını emretti {kaynak: Tabaqat-Shafiiyya-Subki s. 272}. Alp Arslan onu 456 Hicri yılının sonunda Merv el-Rudh'da öldürdü {kaynak: Shadharat-Dhaba s. 309}."
  id: "Tughril Beg tidak lama berkuasa setelah mengizinkan kutukan dan memenjarakan al-Qushayri hingga ia meninggal pada tahun 455 H. Putranya, Alp Arslan, menjadi Sultan setelahnya, dan al-Kundari tidak lama berkuasa sebelum ia dibunuh dengan cara yang paling kejam pada tahun 456 H. Kemudian pagi tiba dengan munculnya wazir Nizam al-Mulk, yang memerintahkan agar penyebutan kutukan dihentikan dan hukuman dijatuhkan kepada siapa pun yang melakukannya {cite:tabaqat-shafiiyya-subki hlm. 272}. Alp Arslan membunuhnya di Marw al-Rudh pada akhir tahun empat ratus lima puluh enam {cite:shadharat-dhahab hlm. 309}."
