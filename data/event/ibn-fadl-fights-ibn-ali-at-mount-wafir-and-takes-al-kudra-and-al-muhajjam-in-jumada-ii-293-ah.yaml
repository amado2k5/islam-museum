id: "event/ibn-fadl-fights-ibn-ali-at-mount-wafir-and-takes-al-kudra-and-al-muhajjam-in-jumada-ii-293-ah"
class: event
kind: other
label:
  ar: "ابن فضل يحارب ابن علي في جبل وافر، ثم يدخل الكدراء والمحجم ويستبيحهما، جمادى الآخرة سنة 293هـ، ص392"
  en: "Ibn al-Fadl fights Ibn Ali at Mount Wafir, then enters al-Kudra' and al-Muhajjam and plunders them, in Jumada II 293 AH, p. 392"
  ur: "ابن فضل جبل وافر میں ابن علی سے لڑتا، پھر الکدراء اور المحجم میں داخل ہو کر لوٹ مار کرتا ہے، جمادی الآخرہ 293ھ، ص392"
  es: "Ibn al-Fadl lucha contra Ibn Ali en el monte Wafir, luego entra en al-Kudra' y al-Muhajjam y los saquea, en Jumada II 293 AH, pág. 392."
summary:
  ar: "حارب ابن فضل إبراهيم بن محمد بن علي في جبل وافر نحو شهرين، ثم انهزم ابن علي، فدخل ابن فضل الكدراء والمحجم في جمادى الآخرة سنة 293، واستباحهما."
  en: "Ibn al-Fadl fought Ibrahim ibn Muhammad ibn Ali at Mount Wafir for about two months. Ibn Ali was routed, and in Jumada II 293 AH Ibn al-Fadl entered al-Kudra' and al-Muhajjam and plundered them."
  ur: "ابن فضل جبل وافر پر ابراہیم بن محمد بن علی سے تقریباً دو مہینے لڑا، ابن علی شکست کھا گیا، اور جمادی الآخرہ 293ھ میں ابن فضل الکدراء اور المحجم میں داخل ہو کر انہیں لوٹ گیا۔"
  es: "Ibn al-Fadl luchó contra Ibrahim ibn Muhammad ibn Ali en el monte Wafir durante aproximadamente dos meses. Ibn Ali fue derrotado, y en Jumada II del año 293 de la Hégira, Ibn al-Fadl entró en al-Kudra' y al-Muhajjam y las saqueó."
