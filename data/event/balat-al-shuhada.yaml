id: event/balat-al-shuhada
education:
  did_you_know:
    ar: "غزا عبد الرحمن الغافقي أرض الإفرنجة، وأصيب عسكره في رمضان سنة ١١٤هـ في موضع يُعرف ببلاط الشهداء، وبه عرفت الوقعة."
    en: "Abd al-Rahman al-Ghafiqi raided Frankish lands, and in Ramadan of 114 AH his army was cut down at a place known ever since as Balat al-Shuhada — the Martyrs' Causeway."
    ur: "عبدالرحمن غافقی نے افرنج کی سرزمین پر چھاپے مارے، اور 114ھ رمضان میں اس کا لشکر اس مقام پر مارا گیا جو آج بلاط الشہداء — شہیدوں کا راستہ — کہلاتا ہے۔"
    sources: [source/nafh-tib-maqqari, source/tarikh-ibn-khaldun-ibar]
