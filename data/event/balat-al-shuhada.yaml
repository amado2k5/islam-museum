label: { ar: "وقعة بلاط الشهداء", en: "Battle of Balat al-Shuhada" }
summary:
  ar: "غزا عبد الرحمن بن عبد الله الغافقي أمير الأندلس أرض الإفرنجة وكانت له فيهم وقائع، وأصيب عسكره في رمضان سنة أربع عشرة ومائة في موضع يعرف ببلاط الشهداء وبه عرفت الغزوة {cite:nafh-tib-maqqari p. 272}. ويذكر الكتاب أن معركة بلاط الشهداء جاءت حين حاول قائد أن يحيي مشروع موسى بن نصير بعد عشرين عاماً من ضياعه، وأن الكتاب يرى أن موسى كان يخطط لعبور جبال البرانس، وأن استدعاء الوليد له قطع المشروع. {cite:salabi-umayyad-state-2020 p.79-80}"
  en: "Abd al-Rahman al-Ghafiqi's great raid into Francia ended in Ramadan 114 at Balat al-Shuhada — 'the Martyrs' Causeway', the Poitiers of Frankish memory — where his army was destroyed {cite:nafh-tib-maqqari p. 272}."
