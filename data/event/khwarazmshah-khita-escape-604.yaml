id: event/khwarazmshah-khita-escape-604
class: event
kind: other
label: { ar: "هزيمة خوارزم شاه وأَسره عند الخطا وخلاصه سنة 604", en: "Defeat and capture of Khwarazmshah by the Khita, and his escape, 604", es: "Derrota y captura de Khwarazmshah por los Khita, y su huida, 604", fr: "Défaite et capture de Khwarezmshah par les Khita, et son évasion, 604", ur: "خیتا کے ذریعہ خوارزمشاہ کی شکست اور اس پر قبضہ، اور اس کا فرار، 604" }
summary:
  ar: "في سنة أربع وستمائة سار خوارزم شاه محمد بن تكش بجيوشه وقصد الخطا فحشدوا له والتقوه فانهزم المسلمون وأُسر جماعة منهم السلطان خوارزم شاه واختبطت البلاد، وأُسر معه أمير من أمرائه فأظهر خوارزم شاه أنه مملوك لذلك الأمير، فقال الأمير للخطائي أريد أن أبعث رجلاً بكتابي إلى أهلي ليستفدوني فبعث «مملوكه» — يعني خوارزم شاه — فخلص بهذه الحيلة ووصل؛ ثم قال الخطائي لذلك الأمير: سلطانكم قد عَدِم، قال: أو ما تعرفه؟ قال: لا، قال: هو الذي قلتُ لك إنه مملوكي، قال: ما عرفتني حتى كنت أخدمه وأسير به إلى مملكته فأُسعد به {cite:shadharat-dhahab p. 20}."
  en: "In 604 Khwarazmshah Muhammad b. Tekish marched with his armies against the Khita, who mustered and met him; the Muslims were routed and a group captured — among them the sultan himself, and the land fell into disorder. An amir was taken with him; the Khwarazmshah passed himself off as that amir's mamluk, and when the amir asked to send a man with a letter home for his ransom, he sent his 'mamluk' — the Khwarazmshah — who escaped by the ruse and reached safety. The Khitai then told the amir: 'your sultan is gone'; 'do you not know him?' — 'no' — 'he is the one I told you was my mamluk'; 'he knew me not, yet I was his servant and rode to his kingdom with him, happy in him' {cite:shadharat-dhahab p. 20}."
  es: "En 604, el sha de Corasmia Muhammad ibn Tekish marchó con sus ejércitos contra los Khita, quienes se reunieron y le hicieron frente. Los musulmanes fueron derrotados y un grupo fue capturado, entre ellos el propio sultán, y la tierra cayó en el desorden. Un emir fue llevado con él; el sha de Corasmia se hizo pasar por el mameluco de ese emir, y cuando el emir pidió enviar a alguien con una carta para pedir su rescate, envió a su \"mameluco\" —el sha de Corasmia— quien escapó con la artimaña y llegó a salvo. Los Khita le dijeron entonces al emir: \"Tu sultán se ha ido\"; \"¿No lo conoces?\" — \"No\" — \"Es el que te dije que era mi mameluco\"; \"Él no me conocía, sin embargo, yo era su sirviente y viajé con él a su reino, feliz a su lado\" {cita: shadharat-dhahab p. 20}."
  fr: "En 604, le Khwarezmshah Muhammad ibn Tekish marcha avec ses armées contre les Khita, qui se rassemblèrent et l'affrontèrent. Les musulmans furent mis en déroute et un groupe fut capturé, parmi lesquels le sultan lui-même. Le pays sombra dans le chaos. Un émir fut fait prisonnier. Le Khwarezmshah se fit passer pour le mamelouk de cet émir, et lorsque celui-ci demanda qu'un homme soit envoyé avec une lettre pour obtenir sa rançon, il envoya son « mamelouk » – le Khwarezmshah lui-même – qui s'échappa grâce à la ruse et parvint à se mettre en sécurité. Les Khita dirent alors à l'émir: « Votre sultan est parti. Ne le reconnaissez-vous pas ? » « Non. » « C'est celui que je vous ai présenté comme mon mamelouk. Il ne me reconnaissait pas, pourtant j'étais son serviteur et j'ai voyagé avec lui jusqu'à son royaume, heureux à ses côtés. » (Source: Hadharat-Dhahab, p. 20)."
  ur: "604 میں خوارزمشاہ محمد بن۔ تیکیش نے اپنی فوجوں کے ساتھ کھیتا کے خلاف مارچ کیا، جو جمع ہوئے اور اس سے ملے۔ مسلمانوں کو شکست دی گئی اور ایک گروہ پر قبضہ کر لیا گیا - ان میں خود سلطان بھی شامل تھا، اور زمین بدامنی میں پڑ گئی۔ ایک امیر کو اپنے ساتھ لے جایا گیا۔ خوارزمشاہ نے خود کو اس امیر کے مملوک کے طور پر چھوڑ دیا، اور جب امیر نے ایک شخص کو خط کے ساتھ اس کے تاوان کے لیے گھر بھیجنے کو کہا تو اس نے اپنا 'مملوک' یعنی خوارزم شاہ کو بھیجا جو اس دوڑ سے بچ کر محفوظ ہو گیا۔ خیطائی نے پھر امیر سے کہا: 'تمہارا سلطان چلا گیا'۔ 'کیا تم اسے نہیں جانتے؟' - 'نہیں' - 'وہ وہی ہے جسے میں نے کہا تھا کہ میرا مملوک ہے'؛ 'وہ مجھے نہیں جانتا تھا، پھر بھی میں اس کا خادم تھا اور اس کے ساتھ اس کی بادشاہی میں سوار ہوا، اس میں خوش تھا'۔ 20}۔"
