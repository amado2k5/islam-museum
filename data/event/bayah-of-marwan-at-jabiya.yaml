label: { ar: "بيعة مروان بن الحكم بالجابية", en: "Bay'a of Marwan ibn al-Hakam at al-Jabiya" }
summary:
  ar: "بعد موت معاوية الثاني اجتمع بنو أمية بالجابية وتشاوروا فيمن يلي أمر المسلمين، فاتفق رأيهم أخيراً على تولية مروان بن الحكم، فبايعوه لثلاث خلون من ذي القعدة سنة 64هـ {cite:khudari-umayyad-state p.293}. وكان الضحاك بن قيس قد خرج بمجموعة ونزل مرج راهط {cite:khudari-umayyad-state p.293}."
  en: "After the death of Mu'awiya II the Umayyads gathered at al-Jabiya and consulted about who should take charge of the Muslims' affairs. Their opinion finally agreed on Marwan ibn al-Hakam, and they gave him the bay'a three days into Dhu al-Qa'da of 64 AH {cite:khudari-umayyad-state p.293}. Al-Dahhak ibn Qays had gone out with a body of men and camped at Marj Rahit {cite:khudari-umayyad-state p.293}."
