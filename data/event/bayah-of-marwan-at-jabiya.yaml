id: event/bayah-of-marwan-at-jabiya
class: event
kind: other
label: { ar: "بيعة مروان بن الحكم بالجابية", en: "Bay'a of Marwan ibn al-Hakam at al-Jabiya", fr: "La bay'a de Marwan ibn al-Hakam à al-Jabiya", es: "Bay'a de Marwan ibn al-Hakam en al-Jabiya", ur: "مروان بن الحکم کی بیع الجبیہ میں", tr: "El-Cabiye'de Mervan ibn el-Hakam'a verilen biat yemini", id: "Ikrar Kesetiaan kepada Marwan ibn al-Hakam di al-Jabiyah" }
summary:
  ar: "بعد موت معاوية الثاني اجتمع بنو أمية بالجابية وتشاوروا فيمن يلي أمر المسلمين، فاتفق رأيهم أخيراً على تولية مروان بن الحكم، فبايعوه لثلاث خلون من ذي القعدة سنة 64هـ {cite:khudari-umayyad-state p.293}. وكان الضحاك بن قيس قد خرج بمجموعة ونزل مرج راهط {cite:khudari-umayyad-state p.293}."
  en: "After the death of Mu'awiya II the Umayyads gathered at al-Jabiya and consulted about who should take charge of the Muslims' affairs. Their opinion finally agreed on Marwan ibn al-Hakam, and they gave him the bay'a three days into Dhu al-Qa'da of 64 AH {cite:khudari-umayyad-state p.293}. Al-Dahhak ibn Qays had gone out with a body of men and camped at Marj Rahit {cite:khudari-umayyad-state p.293}."
  fr: "Après la mort de Mu'awiya II, les Omeyyades se réunirent à al-Jabiya et se consultèrent sur qui prendrait en charge les affaires des musulmans. Leur avis s'accorda finalement sur Marwan ibn al-Hakam, et ils lui prêtèrent la bay'a le trois Dhu al-Qa'da 64 H {cite:khudari-umayyad-state p.293}. Al-Dahhak ibn Qays était sorti avec une troupe et campait à Marj Rahit {cite:khudari-umayyad-state p.293}."
  es: "Tras la muerte de Mu'awiya II, los omeyas se reunieron en al-Jabiya y deliberaron sobre quién debía hacerse cargo de los asuntos de los musulmanes. Finalmente, coincidieron en que Marwan ibn al-Hakam era el elegido, y le prestaron juramento de lealtad tres días después del inicio de Dhu al-Qa'da del año 64 de la Hégira (cita: khudari-umayyad-state, pág. 293). Al-Dahhak ibn Qays había partido con un grupo de hombres y acampado en Marj Rahit (cita: khudari-umayyad-state, pág. 293)."
  ur: "معاویہ ثانی کی وفات کے بعد اموی الجبیہ میں جمع ہوئے اور مشورہ کیا کہ مسلمانوں کے معاملات کی ذمہ داری کس کو سونپی جائے۔ آخرکار ان کی رائے مروان بن الحکم پر متفق ہو گئی اور انہوں نے ذوالقعدہ 64 ہجری میں تین دن کی بیعت کر دی۔ الضحاک بن قیس مردوں کے ایک جسم کے ساتھ نکلا تھا اور مرج رہت میں پڑاؤ ڈالا تھا۔"
  tr: "Muaviye II'nin ölümünden sonra Emeviler, el-Cabiye'de toplanarak Müslümanlara kimin önderlik etmesi gerektiği konusunda istişarede bulundular. Sonunda Mervan ibn el-Hakam'ı önder olarak atamaya karar verdiler ve Hicri 64 yılının Zilhicce ayının üçüncü gününde ona biat ettiler. {kaynak:khudari-umayyad-state s.293}. El-Dahhak ibn Kays bir grupla birlikte dışarı çıkıp Merj Rahit'te kamp kurmuştu. {kaynak:khudari-umayyad-state s.293}"
  id: "Setelah kematian Muawiyah II, Dinasti Umayyah berkumpul di al-Jabiyah dan bermusyawarah tentang siapa yang seharusnya memimpin umat Islam. Mereka akhirnya sepakat untuk menunjuk Marwan ibn al-Hakam, dan mereka berbaiat kepadanya tiga hari setelah Dzul Qi'dah pada tahun 64 Hijriah {cite:khudari-umayyad-state hlm. 293}. Al-Dahhak ibn Qays telah pergi bersama sekelompok orang dan berkemah di Marj Rahit {cite:khudari-umayyad-state hlm. 293}."
