label: { ar: "بناء مدينة واسط", en: "Building of the city of Wasit" }
summary:
  ar: "ذكر الطبري أن الحجاج اختط مدينة واسط في سنة ثلاث وثمانين، بعد أن أخبره راهب بأن مسجدا سيُبنى في ذلك الموضع {cite:tabari-tarikh-abu-al-fadl j.6 p.384}. ذكر الكتاب أن الحجاج اختط واسط في أرض كسكر، وبدأ بناءها سنة 83هـ وفرغ منها سنة 86هـ بعد موافقة عبد الملك، وأُنفق عليها خراج العراق كله خمس سنين، وفيها المسجد الجامع ودار الإمارة والأسواق. {cite:salabi-umayyad-state-2020 p.20}"
  en: "Al-Tabari reports that al-Hajjaj laid out the city of Wasit in 83, after a monk had told him that a mosque would be built on that spot {cite:tabari-tarikh-abu-al-fadl j.6 p.384}. The cited work states that al-Hajjaj laid out Wasit in the land of Kaskar, began building it in 83 AH and finished in 86 AH with the approval of Abd al-Malik, and that the kharaj of all Iraq was spent on it for five years; it contained the congregational mosque, the governor's residence and the markets. {cite:salabi-umayyad-state-2020 p.20}"
