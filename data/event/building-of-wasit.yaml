label: { ar: "بناء مدينة واسط" }
summary:
  ar: "ذكر الطبري أن الحجاج اختط مدينة واسط في سنة ثلاث وثمانين، بعد أن أخبره راهب بأن مسجدا سيُبنى في ذلك الموضع {cite:tabari-tarikh-abu-al-fadl j.6 p.384}. ذكر الكتاب أن الحجاج اختط واسط في أرض كسكر، وبدأ بناءها سنة 83هـ وفرغ منها سنة 86هـ بعد موافقة عبد الملك، وأُنفق عليها خراج العراق كله خمس سنين، وفيها المسجد الجامع ودار الإمارة والأسواق. {cite:salabi-umayyad-state-2020 p.20}"
