label: { ar: "بناء مدينة واسط", en: "Building of the city of Wasit", fr: "La construction de la ville de Wasit", es: "Construcción de la ciudad de Wasit", ur: "واسط شہر کی عمارت", tr: "Wasit Şehrinin İnşaatı", id: "Pembangunan Kota Wasit" }
summary:
  ar: "ذكر الطبري أن الحجاج اختط مدينة واسط في سنة ثلاث وثمانين، بعد أن أخبره راهب بأن مسجدا سيُبنى في ذلك الموضع {cite:tabari-tarikh-abu-al-fadl j.6 p.384}. ذكر الكتاب أن الحجاج اختط واسط في أرض كسكر، وبدأ بناءها سنة 83هـ وفرغ منها سنة 86هـ بعد موافقة عبد الملك، وأُنفق عليها خراج العراق كله خمس سنين، وفيها المسجد الجامع ودار الإمارة والأسواق. {cite:salabi-umayyad-state-2020 p.20}"
  en: "Al-Tabari reports that al-Hajjaj laid out the city of Wasit in 83, after a monk had told him that a mosque would be built on that spot {cite:tabari-tarikh-abu-al-fadl j.6 p.384}. The cited work states that al-Hajjaj laid out Wasit in the land of Kaskar, began building it in 83 AH and finished in 86 AH with the approval of Abd al-Malik, and that the kharaj of all Iraq was spent on it for five years; it contained the congregational mosque, the governor's residence and the markets. {cite:salabi-umayyad-state-2020 p.20}"
  fr: "Al-Tabari rapporte qu'al-Hajjaj traça la ville de Wasit en 83, après qu'un moine lui eut dit qu'une mosquée serait bâtie à cet endroit {cite:tabari-tarikh-abu-al-fadl j.6 p.384}. L'ouvrage cité indique qu'al-Hajjaj traça Wasit dans la terre de Kaskar, commença à la bâtir en 83 H et l'acheva en 86 H avec l'approbation d'Abd al-Malik, et que le kharaj de tout l'Irak y fut dépensé pendant cinq ans ; elle comprenait la mosquée cathédrale, la résidence du gouverneur et les marchés. {cite:salabi-umayyad-state-2020 p.20}"
  es: "Al-Tabari relata que al-Hajjaj trazó la ciudad de Wasit en el año 83 de la Hégira, después de que un monje le dijera que se construiría una mezquita en ese lugar {cite:tabari-tarikh-abu-al-fadl j.6 p.384}. La obra citada afirma que al-Hajjaj trazó Wasit en la región de Kaskar, comenzó su construcción en el año 83 de la Hégira y la finalizó en el año 86 de la Hégira con la aprobación de Abd al-Malik, y que se invirtió en ella el presupuesto de todo Irak durante cinco años; la ciudad albergaba la mezquita principal, la residencia del gobernador y los mercados. {cite:salabi-umayyad-state-2020 p.20}"
  ur: "الطبری کا بیان ہے کہ الحجاج نے 83 میں وسط شہر کی بنیاد رکھی، جب ایک راہب نے اسے بتایا کہ اس جگہ پر ایک مسجد تعمیر کی جائے گی۔ مذکورہ کتاب میں کہا گیا ہے کہ الحجاج نے کسکر کی سرزمین میں وصیت کو بچھایا، اس کی تعمیر 83 ہجری میں شروع کی اور عبد الملک کی منظوری سے 86 ہجری میں مکمل ہوئی، اور تمام عراق کا خرج اس پر پانچ سال تک صرف ہوا۔ اس میں اجتماعی مسجد، گورنر کی رہائش گاہ اور بازار شامل تھے۔ {حوالہ: سلبی-امیاد-ریاست-2020 صفحہ 20}"
  tr: "Taberi, Haccac'ın, bir rahibin kendisine o bölgede bir cami inşa edileceğini bildirmesinin ardından Hicri 83 yılında Wasit şehrini kurduğunu belirtir. Kitapta, Haccac'ın Kaskar topraklarında Wasit'i kurduğu, inşaatına Hicri 83 yılında başladığı ve Abdülmalik'in onayıyla Hicri 86 yılında tamamladığı ifade edilir. Irak'ın tüm vergi gelirleri beş yıl boyunca bu inşaat için harcanmıştır. Şehirde cemaat camisi, vali konutu ve çarşılar bulunmaktaydı."
  id: "Al-Tabari menyebutkan bahwa al-Hajjaj mendirikan kota Wasit pada tahun 83 Hijriah, setelah seorang biarawan memberitahunya bahwa sebuah masjid akan dibangun di lokasi tersebut. Kitab tersebut menyatakan bahwa al-Hajjaj mendirikan Wasit di tanah Kaskar, memulai pembangunannya pada tahun 83 Hijriah dan menyelesaikannya pada tahun 86 Hijriah setelah mendapat persetujuan dari Abd al-Malik. Seluruh pendapatan pajak Irak dihabiskan untuk pembangunannya selama lima tahun. Kota ini meliputi masjid jami, kediaman gubernur, dan pasar."
