summary:
  ar: "خالف عبد الله بن علي على المنصور ودعا إلى نفسه من كان معه من أهل الشام زاعماً أن السفاح جعل الخلافة لمن انتدب لقتل مروان، فبعث إليه أبا مسلم فكانت لهما حروب كثيرة ببلاد نصيبين في الموضع المعروف بدير الأعور وصبر الفريقان شهوراً على حربها واحتفروا الخنادق، ثم انهزم عبد الله وسار في خواصه إلى البصرة وعليها أخوه سليمان بن علي {cite:muruj-al-dhahab p. 279}."
  en: "Abu Muslim's months of trench warfare at Dayr al-A'war by Nisibis broke 'Abd Allah ibn 'Ali's Syrian bid for the caliphate {cite:muruj-al-dhahab p. 279}."
