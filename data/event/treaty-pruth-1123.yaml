label: { ar: "معاهدة فلكزن (بروث) ومحاصرة قيصر روسيا" }
summary:
  ar: "في عهد السلطان أحمد الثالث واصلت الدولة جهادها ضد روسيا وأنزلت بها ضربة كادت تكون قاصمة، حين حاصر المجاهدون العثمانيون قيصر روسيا بطرس وخليلته ومعهما مئتا ألف كادوا يقعون في الأسر، لكن الخيانة دفعت الصدر الأعظم بلطه جي باشا إلى رفع الحصار وخيانة الدولة، ووقع معاهدة فلكزن في جمادى الآخرة عام ١١٢٣هـ ترتب عليها إخلاء مدينة آزاق للروس وتعهدٌ بعدم التدخل في شئون القوزاق، فعزل السلطان أحمد الثالث الصدر الأعظم بلطه جي باشا {cite:dawlat-uthmaniyya-salabi p. 310}."
  en: "Pruth, 1711 — Ottoman mujahidun encircled Tsar Peter and 200,000 Russians and nearly took them; the grand vizier lifted the siege and signed the Pruth treaty surrendering Azov, and the sultan deposed him for it {cite:dawlat-uthmaniyya-salabi p. 310}."
