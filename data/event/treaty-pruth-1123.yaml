label: { ar: "معاهدة فلكزن ⁦(بروث)⁩ ومحاصرة قيصر روسيا", en: "The Treaty of Pruth and the Siege of the Russian Tsar", es: "El Tratado de Prut y el asedio del zar ruso", fr: "Le traité de Pruth et le siège du tsar russe", ur: "پرتھ کا معاہدہ اور روسی زار کا محاصرہ" }
summary:
  ar: "في عهد السلطان أحمد الثالث واصلت الدولة جهادها ضد روسيا وأنزلت بها ضربة كادت تكون قاصمة، حين حاصر المجاهدون العثمانيون قيصر روسيا بطرس وخليلته ومعهما مئتا ألف كادوا يقعون في الأسر، لكن الخيانة دفعت الصدر الأعظم بلطه جي باشا إلى رفع الحصار وخيانة الدولة، ووقع معاهدة فلكزن في جمادى الآخرة عام ١١٢٣هـ ترتب عليها إخلاء مدينة آزاق للروس وتعهدٌ بعدم التدخل في شئون القوزاق، فعزل السلطان أحمد الثالث الصدر الأعظم بلطه جي باشا {cite:dawlat-uthmaniyya-salabi p. 310}."
  en: "Pruth, 1711 — Ottoman mujahidun encircled Tsar Peter and 200,000 Russians and nearly took them; the grand vizier lifted the siege and signed the Pruth treaty surrendering Azov, and the sultan deposed him for it {cite:dawlat-uthmaniyya-salabi p. 310}."
  es: "Pruth, 1711 — Los muyahidines otomanos cercaron al zar Pedro y a 200.000 rusos y estuvieron a punto de capturarlos; el gran visir levantó el asedio y firmó el tratado de Pruth, entregando Azov, y el sultán lo depuso por ello {cite:dawlat-uthmaniyya-salabi p. 310}."
  fr: "Pruth, 1711 — Les moudjahidines ottomans encerclent le tsar Pierre et 200 000 Russes et manquent de les capturer; le grand vizir lève le siège et signe le traité de Pruth en rendant Azov, et le sultan le dépose pour cela {cite:dawlat-uthmaniyya-salabi p. 310}."
  ur: "پرتھ، 1711 - عثمانی مجاہدین نے زار پیٹر اور 200,000 روسیوں کو گھیر لیا اور تقریباً انہیں لے لیا۔ وزیر اعظم نے محاصرہ ختم کر دیا اور ازوف کے حوالے سے پرتھ معاہدے پر دستخط کیے اور سلطان نے اس کے لیے اسے معزول کر دیا۔ 310}۔"
