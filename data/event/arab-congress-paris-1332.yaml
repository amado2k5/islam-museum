label: { ar: "المؤتمر العربي بباريس", en: "The Arab Congress in Paris", es: "El Congreso Árabe en París", fr: "Le Congrès arabe à Paris", ur: "پیرس میں عرب کانگریس", tr: "Paris'te Arap Konferansı", id: "Konferensi Arab di Paris" }
summary:
  ar: "لما بطش الاتحاديون بأعضاء الجمعيات العربية عقدت الجمعية العربية الفتاة مؤتمراً عربياً في باريس سنة ١٣٣٢هـ/١٩١٣م برئاسة عبد الحميد الزهراوي، وقرر المؤتمرون ضرورة تنفيذ الإصلاح بسرعة، وإشراك العرب في الإدارة المركزية، وجعل اللغة العربية لغة رسمية في الولايات العربية، وجعل الخدمة العسكرية محلية بالنسبة للعرب إلا حين الضرورة، والتعاطف مع مطالب الأرمن. وأكد الأعضاء أن حركتهم لا دينية، وتعادل عدد النصارى مع عدد المسلمين في المؤتمر، وعلقت فرنسا آمالاً كبيرة عليه ونشرت مقرراته. وكان في السياق نفسه تكوّن حزب اللامركزية والجمعية القحطانية برئاسة عبد الكريم الخليل وعزيز علي المصري والجمعية العربية الفتاة التي تشكلت في باريس عام ١٣٢٩هـ والجمعية الاصطلاحية في بيروت عام ١٣٣١هـ {cite:dawlat-uthmaniyya-salabi p. 465-466}."
  en: "The 1913 Arab Congress in Paris — al-Fatat's response to CUP repression, chaired by Abd al-Hamid al-Zahrawi, resolving on decentralisation, official Arabic in the Arab provinces and local military service {cite:dawlat-uthmaniyya-salabi p. 465-466}."
  es: "El Congreso Árabe de 1913 en París — la respuesta de al-Fatat a la represión del CUP, presidido por Abd al-Hamid al-Zahrawi, resolvió sobre la descentralización, el árabe oficial en las provincias árabes y el servicio militar local {cite:dawlat-uthmaniyya-salabi p. 465-466}."
  fr: "Le Congrès arabe de 1913 à Paris — la réponse d'al-Fatat à la répression du CUP, présidé par Abd al-Hamid al-Zahrawi, résolvant sur la décentralisation, l'arabe officiel dans les provinces arabes et le service militaire local {cite:dawlat-uthmaniyya-salabi p. 465-466}."
  ur: "پیرس میں 1913 کی عرب کانگریس - CUP کے جبر پر الفاط کا ردعمل، جس کی صدارت عبد الحامد الزہراوی نے کی، وکندریقرت پر حل، عرب صوبوں میں سرکاری عربی اور مقامی فوجی سروس {حوالہ: دولت عثمانیہ-صلابی ص 465-466}۔"
  tr: "Birlikçiler Arap topluluklarının üyelerine baskı uyguladığında, Genç Arap Cemiyeti, Hicri 1332/Miladi 1913 yılında Abdülhamid el-Zehravi başkanlığında Paris'te bir Arap konferansı düzenledi. Konferans katılımcıları, merkezi yönetimde Arapların katılımı, Arap vilayetlerinde Arapçanın resmi dil yapılması, zorunlu durumlar dışında askerlik hizmetinin yerel Araplarla sınırlandırılması ve Ermenilerin taleplerine sempati duyulması da dahil olmak üzere reformların hızla uygulanmasının gerekliliğine karar verdiler. Üyeler, hareketlerinin laik olduğunu ve konferanstaki Hristiyan ve Müslüman sayısının eşit olduğunu vurguladılar. Fransa, konferansa büyük umutlar bağladı ve kararlarını kamuoyuna duyurdu. Aynı doğrultuda, Hicri 1329 yılında Paris'te kurulan Genç Arap Cemiyeti ve Hicri 1331 yılında Beyrut'ta kurulan Reform Cemiyeti ile birlikte, Abdülkerim el-Halil ve Aziz Ali el-Mesri önderliğindeki Yerelleşme Partisi ve Kahtani Cemiyeti kuruldu. {cite:dawlat-uthmaniyya-salabi s. 465-466}."
  id: "Ketika kaum Unionis menindak anggota perkumpulan Arab, Masyarakat Arab Muda mengadakan konferensi Arab di Paris pada tahun 1332 H/1913 M, yang dipimpin oleh Abd al-Hamid al-Zahrawi. Para peserta konferensi memutuskan perlunya implementasi reformasi dengan cepat, termasuk partisipasi Arab dalam pemerintahan pusat, menjadikan bahasa Arab sebagai bahasa resmi di provinsi-provinsi Arab, membatasi wajib militer hanya untuk warga Arab setempat kecuali dalam keadaan darurat, dan menyatakan simpati terhadap tuntutan orang Armenia. Para anggota menekankan bahwa gerakan mereka bersifat sekuler, dan jumlah orang Kristen dan Muslim dalam konferensi tersebut sama. Prancis menaruh harapan besar pada konferensi tersebut dan mempublikasikan resolusinya. Sejalan dengan itu, Partai Desentralisasi dan Masyarakat Qahtani dibentuk, dipimpin oleh Abd al-Karim al-Khalil dan Aziz Ali al-Masri, bersama dengan Masyarakat Arab Muda, yang didirikan di Paris pada tahun 1329 H, dan Masyarakat Reformasi di Beirut pada tahun 1331 H. {cite:dawlat-utsmaniyya-salabi hal. 465-466}."
