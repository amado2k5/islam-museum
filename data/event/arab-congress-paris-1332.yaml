label: { ar: "المؤتمر العربي بباريس" }
summary:
  ar: "لما بطش الاتحاديون بأعضاء الجمعيات العربية عقدت الجمعية العربية الفتاة مؤتمراً عربياً في باريس سنة ١٣٣٢هـ/١٩١٣م برئاسة عبد الحميد الزهراوي، وقرر المؤتمرون ضرورة تنفيذ الإصلاح بسرعة، وإشراك العرب في الإدارة المركزية، وجعل اللغة العربية لغة رسمية في الولايات العربية، وجعل الخدمة العسكرية محلية بالنسبة للعرب إلا حين الضرورة، والتعاطف مع مطالب الأرمن. وأكد الأعضاء أن حركتهم لا دينية، وتعادل عدد النصارى مع عدد المسلمين في المؤتمر، وعلقت فرنسا آمالاً كبيرة عليه ونشرت مقرراته. وكان في السياق نفسه تكوّن حزب اللامركزية والجمعية القحطانية برئاسة عبد الكريم الخليل وعزيز علي المصري والجمعية العربية الفتاة التي تشكلت في باريس عام ١٣٢٩هـ والجمعية الاصطلاحية في بيروت عام ١٣٣١هـ {cite:dawlat-uthmaniyya-salabi p. 465-466}."
  en: "The 1913 Arab Congress in Paris — al-Fatat's response to CUP repression, chaired by Abd al-Hamid al-Zahrawi, resolving on decentralisation, official Arabic in the Arab provinces and local military service {cite:dawlat-uthmaniyya-salabi p. 465-466}."
