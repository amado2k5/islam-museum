id: event/cave-of-the-three-men
class: event
kind: other
label:
  ar: "الثلاثة في الغار"
  en: "The three men in the cave"
  ur: "غار میں تین مسافر"
summary:
  ar: "يحكي النبي أن ثلاثة من أمته سافروا فانسدّ عليهم غار بعد أن سدت صخرة مدخلهم، فدعا كل واحد بعمل صالح عمله: إطعام مسكين، وستر يتيم، وصلة أبويه؛ فتحركت الصخرة مع كل دعاء حتى انفتحت كلها، ثم نزل إليهم ملائكة الرحمة والعذاب فشهدوا أعمالهم {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  en: "The Prophet relates that three of his followers were travelling when a rock sealed the mouth of the cave they sheltered in. Each called upon God by a righteous deed he had done — feeding the poor, sheltering an orphan, honouring his parents — and the rock moved with each supplication until it opened fully; then angels of mercy and of punishment descended to witness their deeds {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  ur: "نبی نے بتایا کہ ان کی امت کے تین لوگ سفر میں تھے کہ غار کے منہ پر چٹان گر کر بند ہو گئی۔ ہر ایک نے اپنے نیک عمل پر اللہ سے دعا کی — مسکین کو کھانا کھلانا، یتیم کی پناہ، والدین کی خدمت — اور ہر دعا سے چٹان تھوڑی ہٹتی گئی یہاں تک کہ مکمل کھل گئی؛ پھر رحمت اور عذاب کے فرشتے ان کے اعمال دیکھنے اترے {cite:sahih-al-bukhari} {cite:sahih-muslim}۔"
