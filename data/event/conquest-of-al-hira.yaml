id: event/conquest-of-al-hira
class: event
kind: conquest
label: { ar: "صلح الحيرة", en: "The Peace of al-Hira", es: "La paz de al-Hira", fr: "La paix d'al-Hira", ur: "الحیرہ کا امن", tr: "Hira'nın Barışı", id: "Kedamaian Hira" }
summary:
  ar: "عند البلاذري: مرّ خالد بن الوليد بزندورد من كسكر فافتتحها وافتتح درنى وذواتها بأمان وأتى هرمزجرد فآمن أهلها وفتحها وأتى ألّيس فخرج إليه جابان عظيم الجمع فقدّم إليه المثنى بن حارثة فلقيه بنهر الدم وصالح خالد أهل ألّيس على أن يكونوا عيوناً للمسلمين على الفرس وأدلاء وأعواناً وأقبل إلى مجتمع الأنهار فلقيه أزاذبه صاحب مسالح كسرى فيما بينه وبين العرب فقاتله المسلمون وهزموه ثم نزل خفان ثم سار قاصداً إلى الحيرة فخرج إليه عبد المسيح بن عمرو بن قيس بن حيان بن بقيلة — واسم بقيلة الحارث وهو من الأزد — وهاني بن قبيصة بن مسعود الشيباني وإياس بن قبيصة الطائي — ويقال فروة بن إياس — فصالحوه على مائة ألف درهم ويقال على ثمانين ألف درهم في كل عام وعلى أن يكونوا عيوناً للمسلمين على أهل فارس وأن لا يهدم لهم بيعة ولا قصر. وروى أبو مخنف عن الوليد بن القطامي أن عبد المسيح استقبل خالداً وكان كبير السن فقال له من أين أقصى أثرك يا شيخ فقال من ظهر أبي فقال فمن أين خرجت قال من بطن أمي قال ويحك في أي شيء أنت قال في ثيابي قال ويحك على أي شيء أنت قال على الأرض قال أتعقل قال نعم وأقيّد قال ويحك إنما أكلمك بكلام الناس قال وأنا إنما أجيبك جواب الناس قال أسلم أنت أم حرب قال بل سلم قال فما هذه الحصون قال بنيناها للسفيه حتى يجيء الحليم ثم تذاكرا الصلح فاصطلحا على مائة ألف يؤدونها في كل سنة فكان الذي أخذ منهم أول مال حمل إلى المدينة من العراق واشترط عليهم أن لا يبغوا المسلمين غائلة وأن يكونوا عيوناً على أهل فارس وذلك في سنة اثنتي عشرة. وعن يحيى بن آدم: كان أهل الحيرة ستة آلاف رجل فألزم كل رجل أربعة عشر درهماً وزن خمسة فبلغ أربعة وثمانين ألفاً وزن خمسة تكون ستين ألفاً وزن سبعة. وعن يزيد بن نبيشة العامري: انتهينا إلى مسلحة المذيب ثم أتينا الحيرة وقد تحصّن أهلها في القصر الأبيض وقصر ابن بقيلة وقصر المديسيين فأجلنا الحيل في عرصاتهم ثم صالحونا. وأن خريم بن أوس بن حارثة بن لام الطائي قال للنبي إن فتح الله عليك الحيرة فأعطني ابنة بقيلة فلما أراد خالد صلح أهل الحيرة قال له خريم إن النبي جعل لي بنت بقيلة فلا تدخلها في صلحك وشهد له بشير بن سعد ومحمد بن مسلمة الأنصاريان فاستثناها في الصلح ودفعها إلى خريم فاشتراها منه أهلها بألف درهم وكانت عجوزاً قد حالت عن عهده فقيل له قد أرخصتها كان أهلها يدفعون إليك أضعاف ما سألت فقال ما كنت أظن أن عدداً يكون أكثر من عشر مائة وقد جاء في الحديث إن الذي سأل ابنة بقيلة رجل من ربيعة والأول أثبت. وعند ابن الأثير حمل خالد الرحال والأثقال في السفن فخرج مرزبان الحيرة وهو الأزاذبه فعسكر عند الغريّين وأرسل ابنه فقطع الماء عن السفن فبقيت على الأرض، فسار خالد في خيل نحو ابن الأزاذبه فلقيه على فرات بادقلى فضربه وقتله وأصحابه، وهرب الأزاذبه بغير قتال وقد بلغه موت أردشير، وتحصن أهل الحيرة في قصورهم فحاصر ضرار بن الأزور القصر الأبيض وفيه إياس بن قبيصة الطائي {cite:kamil-ibn-al-athir p. 238}."
  en: "In al-Baladhuri: Khalid ibn al-Walid passed Zandaward of Kaskar which he opened, opened Durna and her daughter-towns by aman, came to Hurmuzjird whose people he safe-conducted and opened, came to Ulays where a great-Jaban host met him — al-Muthanna ibn Haritha met it at Nahr al-Damm — and made peace with Ulays's people to be the Muslims' eyes on the Persians, guides and helpers; at the rivers' confluence Azadhbih, lord of Khosrow's frontier posts facing the Arabs, met him, fought and was routed; then Khaffan, then marching on al-Hira there came out Abd al-Masih ibn Amr ibn Qays ibn Hayyan ibn Buqayla — Buqayla's name being al-Harith, of Azd — Hani ibn Qabisa ibn Mas'ud al-Shaybani and Iyas ibn Qabisa al-Ta'i — or, it is said, Farwa ibn Iyas — who made peace on a hundred thousand dirhams a year, it is said eighty, on being the Muslims' eyes on Persia and no church or palace demolished. Via Abu Mikhnaf via al-Walid ibn al-Qatami: the aged Abd al-Masih met Khalid, who asked 'whence is your farthest origin, old man?' — 'from my father's back'; 'whence did you come out?' — 'from my mother's belly'; 'what are you in?' — 'my clothes'; 'what are you on?' — 'the earth'; 'are you sane?' — 'yes, and I wear anklets'; 'I only speak to you men's speech' — 'and I only answer you men's answers'; 'are you peace or war?' — 'peace'; 'then what are these fortresses?' — 'we built them for the fool until the wise man comes.' They agreed on a hundred thousand yearly — the first money carried to Medina from Iraq — on condition of no treachery and being eyes on Persia, in year 12. Via Yahya ibn Adam: Hira's people were six thousand men, each liable fourteen dirhams weight-five, making eighty-four thousand weight-five — sixty thousand weight-seven — a document he had read. Via Yazid ibn Nubaysha: we reached the Mudhayyib frontier post then came to Hira whose people fortified in the White Palace, the Palace of Ibn Buqayla and the Palace of the Madyasis — we exhausted stratagems in their courts, then they sued peace. Khuraym ibn Aws ibn Haritha ibn La'm al-Ta'i had told the Prophet 'if God opens Hira for you give me Buqayla's daughter'; at the peace he claimed her, Bashir ibn Sa'd and Muhammad ibn Maslama al-Ansari testified for him, she was excepted and delivered to him; her people bought her back for a thousand dirhams — she being old — and told him he sold cheap, they would have paid multiples; he said 'I did not think a number could exceed a thousand'; a hadith variant has the asker a man of Rabi'a — the first account is firmer."
  es: "En al-Baladhuri: Khalid ibn al-Walid pasó por Zandaward de Kaskar, que él mismo abrió, abrió Durna y sus ciudades hijas por medio de un aman, llegó a Hurmuzjird, cuya gente protegió y abrió, llegó a Ulays, donde un gran ejército de Jaban lo recibió —al-Muthanna ibn Haritha lo recibió en Nahr al-Damm— e hizo las paces con la gente de Ulays para que fueran los ojos de los musulmanes sobre los persas, guías y ayudantes; en la confluencia de los ríos, Azadhbih, señor de los puestos fronterizos de Khosrow frente a los árabes, lo encontró, luchó y fue derrotado; Luego Khaffan, luego marchando sobre al-Hira salió Abd al-Masih ibn Amr ibn Qays ibn Hayyan ibn Buqayla —el nombre de Buqayla era al-Harith, de Azd— Hani ibn Qabisa ibn Mas'ud al-Shaybani e Iyas ibn Qabisa al-Ta'i —o, se dice, Farwa ibn Iyas— quienes hicieron la paz por cien mil dirhams al año, se dice ochenta, siendo los ojos de los musulmanes en Persia y sin ninguna iglesia ni palacio demolido. A través de Abu Mikhnaf a través de al-Walid ibn al-Qatami: el anciano Abd al-Masih se encontró con Khalid, quien preguntó '¿de dónde es tu origen más lejano, anciano?' — 'de la espalda de mi padre'; '¿de dónde saliste?' — 'del vientre de mi madre'; '¿qué llevas puesto?' — 'mi ropa'; '¿En qué estás?' — 'en la tierra'; '¿estás cuerdo?' — 'sí, y llevo tobilleras'; 'solo hablo con vosotros, los hombres' — 'y solo respondo a vuestras respuestas'; '¿estáis en paz o en guerra?' — 'paz'; '¿entonces qué son estas fortalezas?' — 'las construimos para el tonto hasta que llegue el sabio'. Acordaron cien mil al año —el primer dinero traído a Medina desde Irak— con la condición de no traicionar y de vigilar Persia, en el año 12. Según Yahya ibn Adam: la gente de Hira eran seis mil hombres, cada uno responsable de catorce dirhams de cinco libras, lo que hacía ochenta y cuatro mil de cinco libras — sesenta mil de siete libras — un documento que había leído. Según Yazid ibn Nubaysha: llegamos al puesto fronterizo de Mudhayyib y luego a Hira, cuya gente se había fortificado en el Palacio Blanco, el Palacio de Ibn Buqayla y el Palacio de los Madyasis. Agotamos todas las estratagemas en sus cortes, y entonces pidieron la paz. Khuraym ibn Aws ibn Haritha ibn La'm al-Ta'i le había dicho al Profeta: \"Si Dios te abre Hira, dame a la hija de Buqayla\". En la paz la reclamó, Bashir ibn Sa'd y Muhammad ibn Maslama al-Ansari testificaron a su favor, ella fue aceptada y entregada a él. Su gente la compró de vuelta por mil dirhams —siendo anciana— y le dijeron que la había vendido barata, que habrían pagado mucho más. Él dijo: \"No pensé que un número pudiera exceder los mil\". Una variante del hadiz dice que el que preguntó era un hombre de Rabi'a; el primer relato es más fidedigno."
  fr: "Dans al-Baladhuri: Khalid ibn al-Walid passa Zandaward de Kaskar qu'il ouvrit, ouvrit Durna et ses villes filles par aman, arriva à Hurmuzjird dont il mit les habitants en sécurité et ouvrit, arriva à Ulays où une grande armée de Jaban le rencontra — al-Muthanna ibn Haritha la rencontra à Nahr al-Damm — et fit la paix avec le peuple d'Ulays pour être les yeux des musulmans sur les Perses, des guides et des aides; au confluent des rivières, Azadhbih, seigneur des postes frontières de Khosrow face aux Arabes, le rencontra, le combattit et fut mis en déroute; Puis Khaffan, marchant sur al-Hira, en sortit Abd al-Masih ibn Amr ibn Qays ibn Hayyan ibn Buqayla — Buqayla étant al-Harith, d'Azd — Hani ibn Qabisa ibn Mas'ud al-Shaybani et Iyas ibn Qabisa al-Ta'i — ou, dit-on, Farwa ibn Iyas — qui conclurent la paix moyennant cent mille dirhams par an, ou quatre-vingts, à condition qu'ils soient les yeux des musulmans sur la Perse et qu'aucune église ni aucun palais ne soit démoli. Par l'intermédiaire d'Abu Mikhnaf, par l'intermédiaire d'al-Walid ibn al-Qatami: le vieux Abd al-Masih rencontra Khalid, qui lui demanda: « D'où viens-tu, vieil homme ? » — « Du dos de mon père »; « D'où es-tu sorti ? » — « Du ventre de ma mère »; « Dans quoi es-tu ? » — « Mes vêtements »; « Sur quoi êtes-vous ? » — « Sur la terre »; « Êtes-vous sain d’esprit ? » — « Oui, et je porte des bracelets de cheville »; « Je ne vous parle qu’en langage d’hommes » — « Et je ne vous réponds qu’en langage d’hommes »; « Êtes-vous pour la paix ou la guerre ? » — « La paix »; « Alors, que sont ces forteresses ? » — « Nous les avons construites pour l’insensé, en attendant le sage. » Ils s’accordèrent sur une rente annuelle de cent mille dirhams — le premier argent transporté d’Irak à Médine — à condition de ne pas trahir et de surveiller la Perse, en l’an 12. D’après Yahya ibn Adam: le peuple de Hira comptait six mille hommes, chacun redevable de quatorze dirhams, soit quatre-vingt-quatre mille, soit soixante mille, soit sept dirhams — un document qu’il avait lu. Par l'intermédiaire de Yazid ibn Nubaysha: nous atteignîmes le poste frontière de Mudhayyib, puis arrivâmes à Hira, dont les habitants étaient retranchés dans le Palais Blanc, le Palais d'Ibn Buqayla et le Palais des Madyasis. Nous eûmes épuisé toutes les ruses dans leurs tribunaux, puis ils demandèrent la paix. Khuraym ibn Aws ibn Haritha ibn La'm al-Ta'i avait dit au Prophète: « Si Dieu t'ouvre Hira, donne-moi la fille de Buqayla. » Lors de la paix, il la réclama; Bashir ibn Sa'd et Muhammad ibn Maslama al-Ansari témoignèrent en sa faveur, elle fut acceptée et lui fut remise. Son peuple la racheta pour mille dirhams – elle était âgée – et lui dit qu'il l'avait vendue à bas prix, qu'ils auraient payé bien plus. Il répondit: « Je ne pensais pas qu'un montant puisse dépasser mille. » Une variante du hadith indique que celui qui a posé la question était un homme de Rabi'a; le premier récit est plus fiable."
  ur: "البلادوری میں ہے: خالد بن ولید نے کسکر کے غنڈوار سے گزرے جسے اس نے کھولا، دُرنا اور اس کی بیٹیوں کے قصبوں کو امان کے ذریعے کھولا، ہرمزجرد میں آیا جس کے لوگوں کو اس نے محفوظ رکھا اور کھولا، اولیس آیا جہاں جبان کے ایک عظیم میزبان نے اس سے ملاقات کی- المثنیٰ بن حارثہ المصطفٰی اور لوگوں سے صلح کی۔ فارسیوں پر مسلمانوں کی نگاہیں، رہنما اور مددگار ہونا؛ دریاؤں کے سنگم پر ازدبیح، خسرو کی سرحدی چوکیوں کا لارڈ جو عربوں کا سامنا تھا، اس سے ملا، لڑا اور شکست کھا گیا۔ پھر خفان، پھر حیرہ کی طرف کوچ کرتے ہوئے عبد المسیح ابن عمرو بن قیس بن حیان بن بکیلہ نکلے - بکیلہ کا نام حارث ہے، ازد کا - ہانی بن قبیصہ ابن مسعود الشیبانی اور ایاس بن قبیصہ نے کہا - یاس بن قبیصہ الطعویہ ہے جس نے سال میں ایک لاکھ درہم پر صلح کی، اس کو اسّی کہا جاتا ہے، مسلمانوں کی نظر فارس پر ہونے کی وجہ سے اور کوئی چرچ یا محل نہیں گرایا گیا۔ ابو مخنف کے ذریعے الولید بن القطامی کے ذریعے: بوڑھے عبد المسیح نے خالد سے ملاقات کی، جس نے پوچھا، 'بوڑھے آدمی، آپ کی اصل اصل کہاں ہے؟' - 'میرے والد کی پشت سے'؛ 'تم کہاں سے باہر آئے ہو؟' - 'میری ماں کے پیٹ سے'؛ 'تم کس چیز میں ہو؟' - 'میرے کپڑے'؛ 'تم کس چیز پر ہو؟' - 'زمین'؛ 'کیا تم سمجھدار ہو؟' - 'ہاں، اور میں پازیب پہنتا ہوں'؛ 'میں آپ سے صرف مردوں کی بات کرتا ہوں' - 'اور میں صرف آپ کو مردوں کے جوابات کا جواب دیتا ہوں'؛ 'آپ امن ہیں یا جنگ؟' - 'امن'؛ 'پھر یہ قلعے کیا ہیں؟' - 'ہم نے انہیں احمقوں کے لیے بنایا جب تک کہ عقلمند آدمی نہ آجائے۔' انہوں نے 12 میں خیانت نہ کرنے اور فارس پر نظر نہ رکھنے کی شرط پر ایک لاکھ سالانہ پر اتفاق کیا - پہلی رقم عراق سے مدینہ لے جائی گئی۔ یزید بن نبیشہ کے ذریعے: ہم محذیب سرحدی چوکی پر پہنچے پھر حیرہ پہنچے جس کے لوگوں نے سفید محل، محل ابن بقیلہ اور مدیاسیوں کے محل میں قلعہ بندی کر رکھی تھی۔ خریم بن اوس بن حارثہ بن لام طائی نے رسول اللہ سے کہا تھا کہ اگر اللہ آپ کے لیے حیرہ کھول دے تو مجھے بکیلہ کی بیٹی عطا کر دیں۔ اس نے جس صلح کا دعویٰ کیا، بشیر بن سعد اور محمد بن مسلمہ الانصاری نے اس کے حق میں گواہی دی، وہ اس سے مستثنیٰ ہو کر اس کے حوالے کر دی گئی۔ اس کے لوگوں نے اسے ایک ہزار درہم میں واپس خریدا — وہ بوڑھی ہو چکی ہے — اور اسے بتایا کہ وہ سستا بیچتا ہے، وہ کئی گنا ادا کر دیتے۔ اس نے کہا 'میں نہیں سوچتا تھا کہ تعداد ہزار سے زیادہ ہو سکتی ہے'۔ حدیث کی ایک قسم میں سوال کرنے والا ربیعہ کا آدمی ہے - پہلا حساب زیادہ مضبوط ہے۔"
  tr: "El-Baladhuri'ye göre: Halid ibn el-Velid, Kaskar'dan Zandaward'a geçti ve orayı fethetti, Darna ve çevresini güvenli bir şekilde ele geçirdi. Hurmuzcird'e geldi, halkının güvenliğini sağladı ve orayı da fethetti. El-Alis'e geldiğinde, Jaban büyük bir orduyla ona geldi. Ona El-Muthanna ibn Haritha'yı gönderdi ve o da Kan Nehri'nde onunla buluştu. Halid, El-Alis halkıyla, Müslümanlar için Perslere karşı casusluk yapmaları, rehberlik etmeleri ve yardımcı olmaları şartıyla barış yaptı. Nehirlerin birleşme noktasına doğru ilerledi ve orada, kendisiyle Araplar arasındaki Kisra sınır karakollarının komutanı Azadbeh ile karşılaştı. Müslümanlar onunla savaştı ve onu yendi. Sonra Khafan'a indi, ardından El-Hira'ya doğru yürüdü. Abdülmesih ibn Amr ibn Kays ibn Hayyan ibn Bakila (Bakila'nın adı El-Harith'tir ve Azd kabilesindendir), Hani ibn Kubeysa ibn Mesud el-Şeybani ve İyas ibn Kubeysa el-Ta'i (ve rivayete göre Farva ibn İyas) ona geldiler. Yüz bin dirhem (ve rivayete göre her yıl seksen bin dirhem) ve İran halkına karşı Müslümanlar için casusluk yapmaları ve onların hiçbir kilise veya sarayının yıkılmaması şartıyla onunla barıştılar. Ebu Mikhnaf, el-Velid ibn el-Katami'den rivayet ettiğine göre, Abdülmesih, oldukça yaşlı olan Halid ile karşılaştı ve ona, \"Ey yaşlı adam, soyun nereden geliyor?\" diye sordu. Halid, \"Babamın soyundan geliyorum\" diye cevap verdi. Abdülmesih, \"Sen nereden geldin?\" diye sordu. \"Annemin rahminden beri\" diye cevap verdi. \"Yazık sana! Ne giyiyorsun?\" dedi. \"Elbiselerimi giyiyorum\" diye cevap verdi. \"Yazık sana! Neyin üzerindesin?\" diye sordu. \"Yeryüzünün üzerindeyim\" diye cevap verdi. \"Aklın başında mı?\" diye sordu. \"Evet, ve bağlıyım\" diye cevap verdi. \"Yazık sana! Ben seninle sıradan insanların diliyle konuşuyorum\" dedi. \"Ben de sana sıradan insanların diliyle cevap veriyorum\" diye cevap verdi. \"Müslüman mısın yoksa savaşçı mı?\" diye sordu. \"Barış\" diye cevap verdi. \"Öyleyse bu kaleler ne işe yarıyor?\" diye sordu. \"Akıllılar gelinceye kadar onları ahmaklar için inşa ettik\" diye cevap verdi. Sonra barışı görüştüler ve yıllık yüz bin dirhem ödeme konusunda anlaştılar. Bu, Irak'tan Medine'ye getirilen ilk ödemeydi. Ayrıca Müslümanlara karşı komplo kurmamaları ve Perslere karşı casusluk yapmamaları da istendi. Bu olay on ikinci yılda gerçekleşti. Yahya ibn Adam şöyle rivayet etmiştir: Hira halkı altı bin kişiydi ve her birinin on dört dirhem ödeme yükümlülüğü vardı; bu da beş dirhem ağırlığındaydı. Bu, seksen dört bin dirhem ederdi; bu da beş dirhem ağırlığındaydı ve toplamda altmış bin dirhem ederdi; bu da yedi dirhem ağırlığındaydı. Yezid ibn Nebişa el-Amiri'nin rivayetine göre: Mudhib karakoluna vardık, sonra Hira'ya geldik ve halkı Beyaz Saray'da, İbn Bakila Sarayı'nda ve Mudaysiyyin Sarayı'nda kendilerini tahkim etmişlerdi. Biz de onların avlularında savunma hatlarımızı kurduk ve sonra bizimle barış yaptılar. Ve Huraym ibn Evs ibn Harita ibn Lam el-Ta'i Peygamber'e şöyle dedi: \"Eğer Allah sana Hira'ya karşı zafer nasip ederse, Bakila'nın kızını bana ver.\" Halid, Hira halkıyla barış yapmak istediğinde, Huraym ona, \"Peygamber bana Bakila'nın kızını verdi, bu yüzden onu barışa dahil etme\" dedi. Beşir ibn Sa'd ve Muhammed ibn Maslama el-Ensari buna şahitlik ettiler, bu yüzden onu barıştan çıkardı ve Huraym'a verdi. Ailesi onu bin dirheme satın aldı ve o, vefat etmiş yaşlı bir kadındı. Ona, \"Onu çok ucuza verdin. Ailesi istediğinden kat kat fazlasını verirdi\" denildi. O da, \"Sayının on yüzden fazla olacağını düşünmemiştim\" dedi. Ve hadiste Bakila'nın kızını isteyenin Rabi'a'lı bir adam olduğu rivayet edilmiştir ve ilk rivayet daha güvenilirdir. İbn el-Athir'e göre, Halid eyerleri ve bagajları gemilere yükledi. Bunun üzerine Hira Marzbanı olan el-Azadhba dışarı çıktı, el-Ghariyyin'de kamp kurdu ve oğlunu gemilere giden suyu kesmesi için gönderdi, böylece gemiler karada kaldı. Halid, bir süvari birliğiyle İbn el-Azadhba'ya doğru ilerledi ve onu Bedili Fırat Nehri'nde buldu. Bunun üzerine Halid, İbn el-Azadhba'ya saldırdı ve onu ve arkadaşlarını öldürdü. El-Azadhba savaşmadan kaçtı ve Ardaşir'in ölümünü duymuştu. Hira halkı saraylarında kendilerini tahkim ettiler. Bunun üzerine Dirar ibn el-Azwar, içinde İyas ibn Kubeysa el-Ta'i'nin bulunduğu Beyaz Saray'ı kuşattı. {Kaynak: Kamil ibn el-Athir, s. 238}"
  id: "Menurut Al-Baladhuri: Khalid ibn al-Walid melewati Zandaward dari Kaskar dan menaklukkannya, serta menaklukkan Darna dan sekitarnya dengan aman. Ia datang ke Hurmuzjird dan mengamankan keselamatan penduduknya serta menaklukkannya. Ia datang ke Al-Alis, dan Jaban keluar menemuinya dengan pasukan besar. Ia mengirim Al-Muthanna ibn Haritha kepadanya, dan mereka bertemu di Sungai Darah. Khalid berdamai dengan penduduk Al-Alis dengan syarat mereka akan menjadi mata-mata bagi kaum Muslimin melawan Persia, serta menjadi penuntun dan penolong. Ia melanjutkan perjalanan ke pertemuan sungai-sungai, dan Azadbeh, komandan pos perbatasan Kisra antara dirinya dan orang Arab, menemuinya. Kaum Muslimin memeranginya dan mengalahkannya. Kemudian ia turun ke Khafan, lalu ia berbaris menuju Al-Hira. Abd al-Masih ibn Amr ibn Qays ibn Hayyan ibn Baqila—dan nama Baqila adalah Al-Harith, dan dia berasal dari Azd—dan Hani ibn Qubaysa ibn Masoud Al-Shaybani dan Iyas ibn Qubaysa Al-Ta’i—dan dikatakan Farwa ibn Iyas—datang menemuinya. Mereka berdamai dengannya dengan syarat seratus ribu dirham, dan dikatakan dengan syarat delapan puluh ribu dirham setiap tahun, dan dengan syarat mereka akan menjadi mata-mata bagi kaum Muslimin melawan penduduk Persia dan bahwa tidak ada gereja atau istana mereka yang akan dihancurkan. Abu Mikhnaf meriwayatkan dari al-Walid ibn al-Qatami bahwa Abd al-Masih bertemu dengan Khalid, yang sudah cukup tua, dan bertanya kepadanya, \"Dari mana asal garis keturunanmu, wahai orang tua?\" Dia menjawab, \"Dari pinggang ayahku.\" Dia bertanya, \"Dan dari mana kamu berasal?\" Dia menjawab, \"Dari rahim ibuku.\" Dia berkata, \"Celakalah kamu! Apa yang kamu kenakan?\" Dia menjawab, \"Dengan pakaianku.\" Dia berkata, \"Celakalah kamu! Apa yang kamu pijak?\" Dia menjawab, \"Di atas bumi.\" Dia bertanya, \"Apakah kamu waras?\" Dia menjawab, \"Ya, dan aku terikat.\" Dia berkata, \"Celakalah kamu! Aku hanya berbicara kepadamu dalam bahasa orang awam.\" Dia menjawab, \"Dan aku hanya menjawabmu dalam bahasa orang awam.\" Dia bertanya, \"Apakah kamu seorang Muslim atau seorang pejuang?\" Dia menjawab, \"Damai.\" Dia bertanya, \"Lalu apa benteng-benteng ini?\" Dia menjawab, \"Kami membangunnya untuk orang-orang bodoh sampai orang-orang bijak datang.\" Kemudian mereka membahas perdamaian dan menyepakati pembayaran seratus ribu dirham setiap tahun. Ini adalah pembayaran pertama yang dibawa ke Madinah dari Irak. Mereka juga diharuskan untuk tidak bersekongkol melawan kaum Muslim dan bertindak sebagai mata-mata melawan Persia. Ini terjadi pada tahun kedua belas. Yahya ibn Adam meriwayatkan: Penduduk Hira berjumlah enam ribu orang, dan setiap orang wajib membayar empat belas dirham, dengan berat lima dirham. Jumlahnya menjadi delapan puluh empat ribu dirham, dengan berat lima dirham, sehingga totalnya enam puluh ribu dirham, dengan berat tujuh dirham. Dari Yazid ibn Nabisha al-Amiri: Kami tiba di pos terdepan al-Mudhib, kemudian kami sampai di al-Hira, dan penduduknya telah membentengi diri di Istana Putih, Istana Ibnu Baqila, dan Istana Mudaysiyyin. Kami mendirikan pertahanan kami di halaman mereka, dan kemudian mereka berdamai dengan kami. Dan Khuraym ibn Aws ibn Haritha ibn Lam al-Ta'i berkata kepada Nabi, \"Jika Allah memberimu kemenangan atas al-Hira, maka berikanlah kepadaku putri Baqila.\" Ketika Khalid ingin berdamai dengan penduduk al-Hira, Khuraym berkata kepadanya, \"Nabi telah memberikan kepadaku putri Baqila, jadi jangan sertakan dia dalam perdamaianmu.\" Bashir ibn Sa'd dan Muhammad ibn Maslama al-Ansari bersaksi tentang hal ini, sehingga ia mengecualikannya dari perdamaian dan memberikannya kepada Khuraym. Keluarganya membelinya darinya seharga seribu dirham, dan dia adalah seorang wanita tua yang telah meninggal dunia. Dikatakan kepadanya, \"Engkau memberikannya terlalu murah. Keluarganya pasti akan memberimu berkali-kali lipat dari yang kau minta.\" Dia berkata, \"Aku tidak menyangka jumlahnya akan lebih dari seribu ratus.\" Dan telah disebutkan dalam hadits bahwa orang yang meminta putri Baqila adalah seorang pria dari Rabi'a, dan hadits pertama lebih dapat dipercaya. Menurut Ibn al-Athir, Khalid memuat pelana dan barang bawaan ke kapal, sehingga Marzban Hira, yaitu al-Azadhba, pergi dan berkemah di al-Ghariyyin dan mengirim putranya, yang memutus aliran air ke kapal, sehingga kapal-kapal tersebut tetap berada di darat. Khalid berbaris dengan pasukan kavaleri menuju Ibn al-Azadhba dan bertemu dengannya di Sungai Efrat Badqli, lalu ia menyerang dan membunuh Ibn al-Azadhba dan para pengikutnya. Al-Azadhba melarikan diri tanpa perlawanan, dan ia telah mendengar tentang kematian Ardashir. Penduduk Hira membentengi diri di istana-istana mereka, sehingga Dirar ibn al-Azwar mengepung Istana Putih, tempat Iyas ibn Qubaysa al-Ta’i berada. {cite:kamil-ibn-al-athir p. 238}."
