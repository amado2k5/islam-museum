id: event/conquest-of-al-hira
class: event
kind: conquest
label: { ar: "صلح الحيرة", en: "The Peace of al-Hira" }
summary:
  ar: "عند البلاذري: مرّ خالد بن الوليد بزندورد من كسكر فافتتحها وافتتح درنى وذواتها بأمان وأتى هرمزجرد فآمن أهلها وفتحها وأتى ألّيس فخرج إليه جابان عظيم الجمع فقدّم إليه المثنى بن حارثة فلقيه بنهر الدم وصالح خالد أهل ألّيس على أن يكونوا عيوناً للمسلمين على الفرس وأدلاء وأعواناً وأقبل إلى مجتمع الأنهار فلقيه أزاذبه صاحب مسالح كسرى فيما بينه وبين العرب فقاتله المسلمون وهزموه ثم نزل خفان ثم سار قاصداً إلى الحيرة فخرج إليه عبد المسيح بن عمرو بن قيس بن حيان بن بقيلة — واسم بقيلة الحارث وهو من الأزد — وهاني بن قبيصة بن مسعود الشيباني وإياس بن قبيصة الطائي — ويقال فروة بن إياس — فصالحوه على مائة ألف درهم ويقال على ثمانين ألف درهم في كل عام وعلى أن يكونوا عيوناً للمسلمين على أهل فارس وأن لا يهدم لهم بيعة ولا قصر. وروى أبو مخنف عن الوليد بن القطامي أن عبد المسيح استقبل خالداً وكان كبير السن فقال له من أين أقصى أثرك يا شيخ فقال من ظهر أبي فقال فمن أين خرجت قال من بطن أمي قال ويحك في أي شيء أنت قال في ثيابي قال ويحك على أي شيء أنت قال على الأرض قال أتعقل قال نعم وأقيّد قال ويحك إنما أكلمك بكلام الناس قال وأنا إنما أجيبك جواب الناس قال أسلم أنت أم حرب قال بل سلم قال فما هذه الحصون قال بنيناها للسفيه حتى يجيء الحليم ثم تذاكرا الصلح فاصطلحا على مائة ألف يؤدونها في كل سنة فكان الذي أخذ منهم أول مال حمل إلى المدينة من العراق واشترط عليهم أن لا يبغوا المسلمين غائلة وأن يكونوا عيوناً على أهل فارس وذلك في سنة اثنتي عشرة. وعن يحيى بن آدم: كان أهل الحيرة ستة آلاف رجل فألزم كل رجل أربعة عشر درهماً وزن خمسة فبلغ أربعة وثمانين ألفاً وزن خمسة تكون ستين ألفاً وزن سبعة. وعن يزيد بن نبيشة العامري: انتهينا إلى مسلحة المذيب ثم أتينا الحيرة وقد تحصّن أهلها في القصر الأبيض وقصر ابن بقيلة وقصر المديسيين فأجلنا الحيل في عرصاتهم ثم صالحونا. وأن خريم بن أوس بن حارثة بن لام الطائي قال للنبي إن فتح الله عليك الحيرة فأعطني ابنة بقيلة فلما أراد خالد صلح أهل الحيرة قال له خريم إن النبي جعل لي بنت بقيلة فلا تدخلها في صلحك وشهد له بشير بن سعد ومحمد بن مسلمة الأنصاريان فاستثناها في الصلح ودفعها إلى خريم فاشتراها منه أهلها بألف درهم وكانت عجوزاً قد حالت عن عهده فقيل له قد أرخصتها كان أهلها يدفعون إليك أضعاف ما سألت فقال ما كنت أظن أن عدداً يكون أكثر من عشر مائة وقد جاء في الحديث إن الذي سأل ابنة بقيلة رجل من ربيعة والأول أثبت."
  en: "In al-Baladhuri: Khalid ibn al-Walid passed Zandaward of Kaskar which he opened, opened Durna and her daughter-towns by aman, came to Hurmuzjird whose people he safe-conducted and opened, came to Ulays where a great-Jaban host met him — al-Muthanna ibn Haritha met it at Nahr al-Damm — and made peace with Ulays's people to be the Muslims' eyes on the Persians, guides and helpers; at the rivers' confluence Azadhbih, lord of Khosrow's frontier posts facing the Arabs, met him, fought and was routed; then Khaffan, then marching on al-Hira there came out Abd al-Masih ibn Amr ibn Qays ibn Hayyan ibn Buqayla — Buqayla's name being al-Harith, of Azd — Hani ibn Qabisa ibn Mas'ud al-Shaybani and Iyas ibn Qabisa al-Ta'i — or, it is said, Farwa ibn Iyas — who made peace on a hundred thousand dirhams a year, it is said eighty, on being the Muslims' eyes on Persia and no church or palace demolished. Via Abu Mikhnaf via al-Walid ibn al-Qatami: the aged Abd al-Masih met Khalid, who asked 'whence is your farthest origin, old man?' — 'from my father's back'; 'whence did you come out?' — 'from my mother's belly'; 'what are you in?' — 'my clothes'; 'what are you on?' — 'the earth'; 'are you sane?' — 'yes, and I wear anklets'; 'I only speak to you men's speech' — 'and I only answer you men's answers'; 'are you peace or war?' — 'peace'; 'then what are these fortresses?' — 'we built them for the fool until the wise man comes.' They agreed on a hundred thousand yearly — the first money carried to Medina from Iraq — on condition of no treachery and being eyes on Persia, in year 12. Via Yahya ibn Adam: Hira's people were six thousand men, each liable fourteen dirhams weight-five, making eighty-four thousand weight-five — sixty thousand weight-seven — a document he had read. Via Yazid ibn Nubaysha: we reached the Mudhayyib frontier post then came to Hira whose people fortified in the White Palace, the Palace of Ibn Buqayla and the Palace of the Madyasis — we exhausted stratagems in their courts, then they sued peace. Khuraym ibn Aws ibn Haritha ibn La'm al-Ta'i had told the Prophet 'if God opens Hira for you give me Buqayla's daughter'; at the peace he claimed her, Bashir ibn Sa'd and Muhammad ibn Maslama al-Ansari testified for him, she was excepted and delivered to him; her people bought her back for a thousand dirhams — she being old — and told him he sold cheap, they would have paid multiples; he said 'I did not think a number could exceed a thousand'; a hadith variant has the asker a man of Rabi'a — the first account is firmer."
