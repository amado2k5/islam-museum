id: event/conquest-of-al-hira
class: event
kind: conquest
label: { ar: "صلح الحيرة", en: "The Peace of al-Hira", es: "La paz de al-Hira" }
summary:
  ar: "عند البلاذري: مرّ خالد بن الوليد بزندورد من كسكر فافتتحها وافتتح درنى وذواتها بأمان وأتى هرمزجرد فآمن أهلها وفتحها وأتى ألّيس فخرج إليه جابان عظيم الجمع فقدّم إليه المثنى بن حارثة فلقيه بنهر الدم وصالح خالد أهل ألّيس على أن يكونوا عيوناً للمسلمين على الفرس وأدلاء وأعواناً وأقبل إلى مجتمع الأنهار فلقيه أزاذبه صاحب مسالح كسرى فيما بينه وبين العرب فقاتله المسلمون وهزموه ثم نزل خفان ثم سار قاصداً إلى الحيرة فخرج إليه عبد المسيح بن عمرو بن قيس بن حيان بن بقيلة — واسم بقيلة الحارث وهو من الأزد — وهاني بن قبيصة بن مسعود الشيباني وإياس بن قبيصة الطائي — ويقال فروة بن إياس — فصالحوه على مائة ألف درهم ويقال على ثمانين ألف درهم في كل عام وعلى أن يكونوا عيوناً للمسلمين على أهل فارس وأن لا يهدم لهم بيعة ولا قصر. وروى أبو مخنف عن الوليد بن القطامي أن عبد المسيح استقبل خالداً وكان كبير السن فقال له من أين أقصى أثرك يا شيخ فقال من ظهر أبي فقال فمن أين خرجت قال من بطن أمي قال ويحك في أي شيء أنت قال في ثيابي قال ويحك على أي شيء أنت قال على الأرض قال أتعقل قال نعم وأقيّد قال ويحك إنما أكلمك بكلام الناس قال وأنا إنما أجيبك جواب الناس قال أسلم أنت أم حرب قال بل سلم قال فما هذه الحصون قال بنيناها للسفيه حتى يجيء الحليم ثم تذاكرا الصلح فاصطلحا على مائة ألف يؤدونها في كل سنة فكان الذي أخذ منهم أول مال حمل إلى المدينة من العراق واشترط عليهم أن لا يبغوا المسلمين غائلة وأن يكونوا عيوناً على أهل فارس وذلك في سنة اثنتي عشرة. وعن يحيى بن آدم: كان أهل الحيرة ستة آلاف رجل فألزم كل رجل أربعة عشر درهماً وزن خمسة فبلغ أربعة وثمانين ألفاً وزن خمسة تكون ستين ألفاً وزن سبعة. وعن يزيد بن نبيشة العامري: انتهينا إلى مسلحة المذيب ثم أتينا الحيرة وقد تحصّن أهلها في القصر الأبيض وقصر ابن بقيلة وقصر المديسيين فأجلنا الحيل في عرصاتهم ثم صالحونا. وأن خريم بن أوس بن حارثة بن لام الطائي قال للنبي إن فتح الله عليك الحيرة فأعطني ابنة بقيلة فلما أراد خالد صلح أهل الحيرة قال له خريم إن النبي جعل لي بنت بقيلة فلا تدخلها في صلحك وشهد له بشير بن سعد ومحمد بن مسلمة الأنصاريان فاستثناها في الصلح ودفعها إلى خريم فاشتراها منه أهلها بألف درهم وكانت عجوزاً قد حالت عن عهده فقيل له قد أرخصتها كان أهلها يدفعون إليك أضعاف ما سألت فقال ما كنت أظن أن عدداً يكون أكثر من عشر مائة وقد جاء في الحديث إن الذي سأل ابنة بقيلة رجل من ربيعة والأول أثبت. وعند ابن الأثير حمل خالد الرحال والأثقال في السفن فخرج مرزبان الحيرة وهو الأزاذبه فعسكر عند الغريّين وأرسل ابنه فقطع الماء عن السفن فبقيت على الأرض، فسار خالد في خيل نحو ابن الأزاذبه فلقيه على فرات بادقلى فضربه وقتله وأصحابه، وهرب الأزاذبه بغير قتال وقد بلغه موت أردشير، وتحصن أهل الحيرة في قصورهم فحاصر ضرار بن الأزور القصر الأبيض وفيه إياس بن قبيصة الطائي {cite:kamil-ibn-al-athir p. 238}."
  en: "In al-Baladhuri: Khalid ibn al-Walid passed Zandaward of Kaskar which he opened, opened Durna and her daughter-towns by aman, came to Hurmuzjird whose people he safe-conducted and opened, came to Ulays where a great-Jaban host met him — al-Muthanna ibn Haritha met it at Nahr al-Damm — and made peace with Ulays's people to be the Muslims' eyes on the Persians, guides and helpers; at the rivers' confluence Azadhbih, lord of Khosrow's frontier posts facing the Arabs, met him, fought and was routed; then Khaffan, then marching on al-Hira there came out Abd al-Masih ibn Amr ibn Qays ibn Hayyan ibn Buqayla — Buqayla's name being al-Harith, of Azd — Hani ibn Qabisa ibn Mas'ud al-Shaybani and Iyas ibn Qabisa al-Ta'i — or, it is said, Farwa ibn Iyas — who made peace on a hundred thousand dirhams a year, it is said eighty, on being the Muslims' eyes on Persia and no church or palace demolished. Via Abu Mikhnaf via al-Walid ibn al-Qatami: the aged Abd al-Masih met Khalid, who asked 'whence is your farthest origin, old man?' — 'from my father's back'; 'whence did you come out?' — 'from my mother's belly'; 'what are you in?' — 'my clothes'; 'what are you on?' — 'the earth'; 'are you sane?' — 'yes, and I wear anklets'; 'I only speak to you men's speech' — 'and I only answer you men's answers'; 'are you peace or war?' — 'peace'; 'then what are these fortresses?' — 'we built them for the fool until the wise man comes.' They agreed on a hundred thousand yearly — the first money carried to Medina from Iraq — on condition of no treachery and being eyes on Persia, in year 12. Via Yahya ibn Adam: Hira's people were six thousand men, each liable fourteen dirhams weight-five, making eighty-four thousand weight-five — sixty thousand weight-seven — a document he had read. Via Yazid ibn Nubaysha: we reached the Mudhayyib frontier post then came to Hira whose people fortified in the White Palace, the Palace of Ibn Buqayla and the Palace of the Madyasis — we exhausted stratagems in their courts, then they sued peace. Khuraym ibn Aws ibn Haritha ibn La'm al-Ta'i had told the Prophet 'if God opens Hira for you give me Buqayla's daughter'; at the peace he claimed her, Bashir ibn Sa'd and Muhammad ibn Maslama al-Ansari testified for him, she was excepted and delivered to him; her people bought her back for a thousand dirhams — she being old — and told him he sold cheap, they would have paid multiples; he said 'I did not think a number could exceed a thousand'; a hadith variant has the asker a man of Rabi'a — the first account is firmer."
  es: "En al-Baladhuri: Khalid ibn al-Walid pasó por Zandaward de Kaskar, que él mismo abrió, abrió Durna y sus ciudades hijas por medio de un aman, llegó a Hurmuzjird, cuya gente protegió y abrió, llegó a Ulays, donde un gran ejército de Jaban lo recibió —al-Muthanna ibn Haritha lo recibió en Nahr al-Damm— e hizo las paces con la gente de Ulays para que fueran los ojos de los musulmanes sobre los persas, guías y ayudantes; en la confluencia de los ríos, Azadhbih, señor de los puestos fronterizos de Khosrow frente a los árabes, lo encontró, luchó y fue derrotado; Luego Khaffan, luego marchando sobre al-Hira salió Abd al-Masih ibn Amr ibn Qays ibn Hayyan ibn Buqayla —el nombre de Buqayla era al-Harith, de Azd— Hani ibn Qabisa ibn Mas'ud al-Shaybani e Iyas ibn Qabisa al-Ta'i —o, se dice, Farwa ibn Iyas— quienes hicieron la paz por cien mil dirhams al año, se dice ochenta, siendo los ojos de los musulmanes en Persia y sin ninguna iglesia ni palacio demolido. A través de Abu Mikhnaf a través de al-Walid ibn al-Qatami: el anciano Abd al-Masih se encontró con Khalid, quien preguntó '¿de dónde es tu origen más lejano, anciano?' — 'de la espalda de mi padre'; '¿de dónde saliste?' — 'del vientre de mi madre'; '¿qué llevas puesto?' — 'mi ropa'; '¿En qué estás?' — 'en la tierra'; '¿estás cuerdo?' — 'sí, y llevo tobilleras'; 'solo hablo con vosotros, los hombres' — 'y solo respondo a vuestras respuestas'; '¿estáis en paz o en guerra?' — 'paz'; '¿entonces qué son estas fortalezas?' — 'las construimos para el tonto hasta que llegue el sabio'. Acordaron cien mil al año —el primer dinero traído a Medina desde Irak— con la condición de no traicionar y de vigilar Persia, en el año 12. Según Yahya ibn Adam: la gente de Hira eran seis mil hombres, cada uno responsable de catorce dirhams de cinco libras, lo que hacía ochenta y cuatro mil de cinco libras — sesenta mil de siete libras — un documento que había leído. Según Yazid ibn Nubaysha: llegamos al puesto fronterizo de Mudhayyib y luego a Hira, cuya gente se había fortificado en el Palacio Blanco, el Palacio de Ibn Buqayla y el Palacio de los Madyasis. Agotamos todas las estratagemas en sus cortes, y entonces pidieron la paz. Khuraym ibn Aws ibn Haritha ibn La'm al-Ta'i le había dicho al Profeta: \"Si Dios te abre Hira, dame a la hija de Buqayla\". En la paz la reclamó, Bashir ibn Sa'd y Muhammad ibn Maslama al-Ansari testificaron a su favor, ella fue aceptada y entregada a él. Su gente la compró de vuelta por mil dirhams —siendo anciana— y le dijeron que la había vendido barata, que habrían pagado mucho más. Él dijo: \"No pensé que un número pudiera exceder los mil\". Una variante del hadiz dice que el que preguntó era un hombre de Rabi'a; el primer relato es más fidedigno."
