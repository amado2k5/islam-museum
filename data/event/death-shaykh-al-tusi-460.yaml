id: event/death-shaykh-al-tusi-460
class: event
kind: death
label:
  ar: "وفاة الشيخ الطوسي بالنجف، المحرم ٤٦٠هـ"
  en: "Death of al-Shaykh al-Tusi at Najaf, Muharram 460/1067"
  ur: "شیخ طوسی کی وفات نجف میں، محرم 460ھ/1067ء"
summary:
  ar: "توفي أبو جعفر الطوسي شيخ الشيعة وعالمها بالمشهد المبارك — مشهد أمير المؤمنين علي بالنجف — في المحرم سنة ٤٦٠هـ/١٠٦٧م {cite:tarikh-islam-dhahabi p. 490} ⁦(الإنكليزية: ٤٥٩ أو ٤٦٠هـ {cite:encyclopaedia-of-islam-2 vol. 10 p. 745})⁩؛ ودُفن بها، ويضم مسجدُ الطوسي قرب الباب الشمالي لصحن العتبة العلوية — باب الطوسي — قبرَه {cite:musawat-atabat}."
  en: "Abu Ja'far al-Tusi, shaykh and scholar of the Shi'a, died at the blessed Mashhad of Ali in Najaf in Muharram 460/1067 {cite:tarikh-islam-dhahabi p. 490} (EI2 gives 459 or 460 {cite:encyclopaedia-of-islam-2 vol. 10 p. 745}); he was buried there, and the Shaykh al-Tusi mosque by the shrine's north gate — Bab al-Tusi — holds his tomb {cite:musawat-atabat}."
  ur: "ابو جعفر طوسی، شیعوں کے شیخ اور علم، محرم 460ھ/1067ء میں نجف کے مشہدِ امیر المومنین میں فوت ہوئے {cite:tarikh-islam-dhahabi p. 490} ⁦(EI2 کے مطابق 459 یا 460ھ)⁩؛ وہیں دفن ہوئے اور صحنِ عتبہ علویہ کے شمالی دروازے — بابِ طوسی — کے قریب مسجدِ طوسی میں ان کا مزار ہے {cite:musawat-atabat}۔"
