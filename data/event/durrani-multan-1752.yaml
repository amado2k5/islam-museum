label: { ar: "تنازل المغول لأحمد شاه الدراني عن صوبتي لهاور والملتان ١٧٥٢م", en: "The Mughals cede Lahore and Multan to Ahmad Shah Durrani, 1752" }
summary:
  ar: "في سنة ١٧٥٢م ألزم أحمد شاه الدراني الإمبراطور المغولي الضعيف بالتنازل له عن صوبتي لهاور والملتان، وكانت السمة الغالبة للعقود التالية حروباً مع السيخ انتهت بأخذ رانجيت سينغ المدينة سنة ١٨١٨م {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  en: "In 1752 Ahmad Shah Durrani forced the feeble Mughal emperor to cede to him the subas of Lahore and Multan; the following decades were dominated by warfare with the Sikhs that culminated in Ranjit Singh's conquest of the city in 1818 {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  ur: "1752ء میں احمد شاہ درانی نے کمزور مغل بادشاہ کو لاہور اور ملتان کی صوبے اپنے حوالے کرنے پر مجبور کیا؛ اگلی دہائیوں میں سیخوں سے جنگیں ہوئیں جن کا اختتام 1818ء میں رنجیت سنگھ کے شہر پر قبضے پر ہوا {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}۔"
