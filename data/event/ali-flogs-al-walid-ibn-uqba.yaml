id: event/ali-flogs-al-walid-ibn-uqba
class: event
kind: other
label: { ar: "علي يقيم حد الشرب على الوليد بن عقبة", en: "Ali carries out the drinking penalty on al-Walid ibn Uqba", es: "Ali ejecuta el castigo de beber sobre al-Walid ibn Uqba.", fr: "Ali exécute la peine d'ivresse sur al-Walid ibn Uqba", ur: "علی ولید بن عقبہ پر شراب نوشی کا جرمانہ عائد کرتا ہے۔", tr: "Ali, Walid ibn Uqba'ya içki içmenin cezasını uyguluyor.", id: "Ali melaksanakan hukuman atas perbuatan minum minuman keras terhadap Walid ibn Uqba." }
summary:
  ar: "شهد عند عثمان رجلان على الوليد بن عقبة: أحدهما بأنه شرب الخمر، والآخر بأنه لم يتقيأ؛ فقال عثمان إنه لم يتقيأ حتى شربها، وأمر علياً بإقامة الحد، فأمر الحسن بالجلد فلم يفعل، ثم أمر عبد الله بن جعفر فجلد وعلي يعد حتى بلغ أربعين، فقال: أمسك، جلد النبي أربعين وأبو بكر أربعين وعمر ثمانين، وكل سنة، وهذا أحب إليّ ⁦(ص161)⁩."
  tr: "Osman'ın huzurunda iki adam El-Velid bin Ukba aleyhine şahitlik etti: biri şarap içtiğini, diğeri kusmadığını söyledi. Osman, içene kadar kusmadığını söyledi ve Ali'ye cezayı uygulamasını emretti. Hasan'a onu kırbaçlamasını emretti, ancak Hasan bunu yapmadı. Sonra Abdullah bin Cafer'e onu kırbaçlamasını emretti ve Ali kırka kadar saydı. \"Dur!\" dedi. Peygamber kırk kişiyi, Ebu Bekir kırk kişiyi, Ömer seksen kişiyi kırbaçladı ve her yıl bunu yaptı; bu bana daha sevimli geliyor. (s. 161)"
  id: "Dua orang bersaksi di hadapan Utsman melawan Al-Walid bin Uqba: yang satu mengatakan bahwa ia minum anggur, dan yang lain mengatakan bahwa ia tidak muntah. Utsman berkata bahwa ia tidak muntah sampai ia meminumnya, dan ia memerintahkan Ali untuk melaksanakan hukuman tersebut. Ia memerintahkan Al-Hasan untuk mencambuknya, tetapi ia tidak melakukannya. Kemudian ia memerintahkan Abdullah bin Jaafar untuk mencambuknya, dan Ali menghitung sampai ia mencapai empat puluh. Ia berkata: Berhentilah. Nabi mencambuk empat puluh orang, Abu Bakar empat puluh orang, dan Umar delapan puluh orang, dan setiap tahun, dan ini lebih kucintai (hlm. 161)."
