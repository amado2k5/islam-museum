summary:
  ar: "شهد عند عثمان رجلان على الوليد بن عقبة: أحدهما بأنه شرب الخمر، والآخر بأنه لم يتقيأ؛ فقال عثمان إنه لم يتقيأ حتى شربها، وأمر علياً بإقامة الحد، فأمر الحسن بالجلد فلم يفعل، ثم أمر عبد الله بن جعفر فجلد وعلي يعد حتى بلغ أربعين، فقال: أمسك، جلد النبي أربعين وأبو بكر أربعين وعمر ثمانين، وكل سنة، وهذا أحب إليّ (ص161)."
