id: event/dismissal-of-ibn-muqla-from-vizierate
class: event
kind: other
label: { ar: "صرف ابن مقلة عن الوزارة وولاية ابن مخلد", en: "Dismissal of Ibn Muqla from the vizierate and appointment of Ibn Makhlad", es: "Destitución de Ibn Muqla del visirismo y nombramiento de Ibn Makhlad.", fr: "Destitution d'Ibn Muqla du vizirat et nomination d'Ibn Makhlad", ur: "ابن مقلہ کی وزارت سے برطرفی اور ابن مقلد کی تقرری" }
summary:
  ar: "في سنة ثماني عشرة وثلاثمائة صُرف محمد بن علي بن مقلة عن الوزارة ووُكّل به في الدار وحُبس فيها، وقلّد الخليفة أبا القاسم سليمان بن الحسن بن مخلّد الوزارة {cite:tabari-tarikh-abu-al-fadl j.11 p.130}."
  en: "In the year 318 Muhammad ibn Ali ibn Muqla was removed from the vizierate; he was put under guard in the palace and confined there, and the caliph appointed Abu al-Qasim Sulayman ibn al-Hasan ibn Makhlad to the vizierate {cite:tabari-tarikh-abu-al-fadl j.11 p.130}."
  es: "En el año 318, Muhammad ibn Ali ibn Muqla fue destituido del visirismo; fue puesto bajo custodia en el palacio y confinado allí, y el califa nombró a Abu al-Qasim Sulayman ibn al-Hasan ibn Makhlad como visirismo {cite:tabari-tarikh-abu-al-fadl j.11 p.130}."
  fr: "En l'an 318, Muhammad ibn Ali ibn Muqla fut démis de ses fonctions de vizirat; il fut placé sous garde au palais et y fut confiné, et le calife nomma Abu al-Qasim Sulayman ibn al-Hasan ibn Makhlad au vizirat {cite:tabari-tarikh-abu-al-fadl j.11 p.130}."
  ur: "318ء میں محمد بن علی ابن مقلہ کو وزارت سے ہٹا دیا گیا۔ اسے محل میں پہرے میں رکھا گیا اور وہیں قید کر دیا گیا، اور خلیفہ نے ابو القاسم سلیمان بن الحسن ابن مخلد کو وزیر مقرر کر دیا۔"
