  ar: "في سنة ثماني عشرة وثلاثمائة صُرف محمد بن علي بن مقلة عن الوزارة ووُكّل به في الدار وحُبس فيها، وقلّد الخليفة أبا القاسم سليمان بن الحسن بن مخلّد الوزارة {cite:tabari-tarikh-abu-al-fadl j.11 p.130}."
  en: "In the year 318 Muhammad ibn Ali ibn Muqla was removed from the vizierate; he was put under guard in the palace and confined there, and the caliph appointed Abu al-Qasim Sulayman ibn al-Hasan ibn Makhlad to the vizierate {cite:tabari-tarikh-abu-al-fadl j.11 p.130}."
