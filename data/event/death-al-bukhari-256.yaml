id: event/death-al-bukhari-256
class: event
kind: death
label:
  ar: "وفاة الإمام البخاري بخرتنك، ليلة الفطر ١ شوال ٢٥٦هـ"
  en: "Death of Imam al-Bukhari at Khartank, on the festival night of 1 Shawwal 256/31 August 870"
  ur: "امام بخاری کی وفات خرتنک میں، عید کی رات 1 شوال 256ھ/31 اگست 870ء"
summary:
  ar: "مات محمد بن إسماعيل البخاري بخرتنك ليلة الفطر أول ليلة من شوال سنة ٢٥٦هـ، وكان قد بلغ اثنتين وستين سنة غير ثلاث عشرة ليلة، وكان في بيت وحده فوجدوه لما أصبحوا ميتاً، وقُبر بخرتنك {cite:tabaqat-shafiiyya-subki j.2 p. 14}؛ وكان سمعته ليلة بعد صلاة الليل يقول في دعائه: اللهم إنه قد ضاقت عليّ الأرض بما وسعت فاقبضني إليك، فما تم الشهر حتى توفاه الله {cite:tabaqat-shafiiyya-subki j.2 p. 14}."
  en: "Muhammad ibn Isma'il al-Bukhari died at Khartank on the festival night, the first night of Shawwal 256, having reached sixty-two years less thirteen nights; he was in a house alone and they found him dead when morning came, and he was buried at Khartank {cite:tabaqat-shafiiyya-subki j.2 p. 14}. He had been heard at night, after finishing the night prayer, saying in his supplication: O God, the earth has grown narrow for me despite its breadth, so take me to You — and before the month was out God took him {cite:tabaqat-shafiiyya-subki j.2 p. 14}."
  ur: "محمد بن اسماعیل بخاری خرتنک میں 256ھ میں شوال کی پہلی رات عید کی رات فوت ہوئے؛ ان کی عمر باسٹھ برس منہا تیرہ راتیں تھی؛ وہ ایک گھر میں اکیلے تھے اور صبح کو مردہ پائے گئے، اور خرتنک ہی میں دفن ہوئے {cite:tabaqat-shafiiyya-subki j.2 p. 14}۔ ان سے سنا گیا کہ رات کی نماز سے فارغ ہو کر وہ دعا میں کہہ رہے تھے: اے اللہ! زمین اپنے وسعت کے باوجود مجھ پر تنگ ہو گئی ہے، مجھے اپنے پاس بلا لے — اور مہینہ پورا ہونے سے پہلے اللہ نے انہیں بلا لیا {cite:tabaqat-shafiiyya-subki j.2 p. 14}۔"
