label: { ar: "مقتل يحيى بن زيد", en: "Killing of Yahya ibn Zayd" }
summary:
  ar: "في سنة خمس وعشرين ومائة قُتل يحيى بن زيد بخراسان {cite:tabari-tarikh-abu-al-fadl j.7 p.228}. وذكر الطبري أن نصر بن سيار كتب إلى الحسن بن زيد التميمي، وكان على طوس، أن ينظر في يحيى بن زيد، فإن مر بهم فلا يدعه يقيم {cite:tabari-tarikh-abu-al-fadl j.7 p.229}."
  en: "In 125 Yahya ibn Zayd was killed in Khurasan {cite:tabari-tarikh-abu-al-fadl j.7 p.228}. Al-Tabari reports that Nasr ibn Sayyar wrote to al-Hasan ibn Zayd al-Tamimi, who was at Tus, to keep watch on Yahya ibn Zayd: if Yahya passed their way, he was not to let him stay {cite:tabari-tarikh-abu-al-fadl j.7 p.229}."
