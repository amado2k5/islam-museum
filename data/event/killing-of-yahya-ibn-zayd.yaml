label: { ar: "مقتل يحيى بن زيد", en: "Killing of Yahya ibn Zayd", es: "Asesinato de Yahya ibn Zayd", fr: "Meurtre de Yahya ibn Zayd", ur: "یحییٰ بن زید کا قتل", tr: "Yahya ibn Zayd'ın öldürülmesi", id: "Pembunuhan Yahya bin Zayd" }
summary:
  ar: "في سنة خمس وعشرين ومائة قُتل يحيى بن زيد بخراسان {cite:tabari-tarikh-abu-al-fadl j.7 p.228}. وذكر الطبري أن نصر بن سيار كتب إلى الحسن بن زيد التميمي، وكان على طوس، أن ينظر في يحيى بن زيد، فإن مر بهم فلا يدعه يقيم {cite:tabari-tarikh-abu-al-fadl j.7 p.229}."
  en: "In 125 Yahya ibn Zayd was killed in Khurasan {cite:tabari-tarikh-abu-al-fadl j.7 p.228}. Al-Tabari reports that Nasr ibn Sayyar wrote to al-Hasan ibn Zayd al-Tamimi, who was at Tus, to keep watch on Yahya ibn Zayd: if Yahya passed their way, he was not to let him stay {cite:tabari-tarikh-abu-al-fadl j.7 p.229}."
  es: "En 125 Yahya ibn Zayd fue asesinado en Jorasán {cite:tabari-tarikh-abu-al-fadl j.7 p.228}. Al-Tabari informa que Nasr ibn Sayyar escribió a al-Hasan ibn Zayd al-Tamimi, que estaba en Tus, para que vigilara a Yahya ibn Zayd: si Yahya pasaba por allí, no debía dejarlo quedarse {cite:tabari-tarikh-abu-al-fadl j.7 p.229}."
  fr: "En 125, Yahya ibn Zayd fut tué au Khorasan (cf. Tabari-Tarikh-Abu-al-Fadl, vol. 7, p. 228). Al-Tabari rapporte que Nasr ibn Sayyar écrivit à al-Hasan ibn Zayd al-Tamimi, qui se trouvait à Tus, de surveiller Yahya ibn Zayd: si ce dernier passait par là, il ne devait pas le laisser s’arrêter (cf. Tabari-Tarikh-Abu-al-Fadl, vol. 7, p. 229)."
  ur: "125 میں یحییٰ بن زید کو خراسان میں قتل کیا گیا {حوالہ: طبری تاریخ ابو الفضل ج 7 ص 228}۔ الطبری نے بیان کیا ہے کہ نصر بن سیار نے طوس میں موجود الحسن بن زید تمیمی کو یحییٰ بن زید پر نظر رکھنے کے لیے لکھا: اگر یحییٰ ان کے راستے سے گزر جائے تو وہ اسے نہ رہنے دیں۔"
  tr: "Hicri 125 yılında Yahya ibn Zayd Horasan'da öldürüldü {kaynak: Tabari-tarikh-abu-al-fadl c.7 s.228}. Taberi, Nasr ibn Sayyar'ın Tus'tan sorumlu olan Hasan ibn Zayd el-Tamimi'ye Yahya ibn Zayd'ı gözetmesi ve eğer yanlarından geçerse orada kalmasına izin vermemesi için bir mektup yazdığını belirtmiştir {kaynak: Tabari-tarikh-abu-al-fadl c.7 s.229}."
  id: "Pada tahun 125 H, Yahya ibn Zayd terbunuh di Khorasan {cite:tabari-tarikh-abu-al-fadl j.7 p.228}. Al-Tabari menyebutkan bahwa Nasr ibn Sayyar menulis surat kepada al-Hasan ibn Zayd al-Tamimi, yang bertanggung jawab atas Tus, untuk menyelidiki Yahya ibn Zayd, dan jika ia melewati mereka, jangan biarkan ia tinggal {cite:tabari-tarikh-abu-al-fadl j.7 p.229}."
