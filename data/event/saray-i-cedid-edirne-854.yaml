label: { ar: "بناء السراي الجديد العامرة بأدرنة", en: "Edirne's New Imperial Palace is built", ur: "ادرنہ میں سرائے جدید عامرہ کی تعمیر" }
summary:
  ar: "بنى مراد الثاني السراي الجديد العامرة سنة ٨٥٤هـ/١٤٥٠م على جزيرة في نهر التونجا والمروج المجاورة لها، مستعملاً رخاماً أُحضر من أطلال قرب سلانيك، وأكمل محمد الثاني بناءه في السنة التالية وغرس آلاف الأشجار في الجزيرة {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  en: "Murad II built the Saray-ı Cedid-i Amire, the New Imperial Palace, in 854/1450 on an island in the Tunca and the adjoining meadows, partly with marble brought from ruins near Salonica; Mehmed II continued its construction the following year and had thousands of trees planted on the island {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  ur: "مراد ثانی نے 854ھ/1450ء میں دریائے تونجہ کے جزیرے اور ملحقہ مرجوں پر سرائے جدید عامرہ بنوایا، جس میں سلانیک کے قریب کھنڈروں سے لایا گیا سنگِ مرمر استعمال ہوا؛ محمد ثانی نے اگلے سال تعمیر جاری رکھی اور جزیرے میں ہزاروں درخت لگوائے {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}۔"
