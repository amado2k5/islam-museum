id: event/saray-i-cedid-edirne-854
class: event
kind: founding
label: { ar: "بناء السراي الجديد العامرة بأدرنة", en: "Edirne's New Imperial Palace is built", ur: "ادرنہ میں سرائے جدید عامرہ کی تعمیر", es: "Se construye el nuevo Palacio Imperial de Edirne.", fr: "Le nouveau palais impérial d'Edirne est construit", tr: "Edirne'de yeni sarayın inşası", id: "Membangun istana baru di Edirne" }
summary:
  ar: "بنى مراد الثاني السراي الجديد العامرة سنة ٨٥٤هـ/١٤٥٠م على جزيرة في نهر التونجا والمروج المجاورة لها، مستعملاً رخاماً أُحضر من أطلال قرب سلانيك، وأكمل محمد الثاني بناءه في السنة التالية وغرس آلاف الأشجار في الجزيرة {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  en: "Murad II built the Saray-ı Cedid-i Amire, the New Imperial Palace, in 854/1450 on an island in the Tunca and the adjoining meadows, partly with marble brought from ruins near Salonica; Mehmed II continued its construction the following year and had thousands of trees planted on the island {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  ur: "مراد ثانی نے 854ھ/1450ء میں دریائے تونجہ کے جزیرے اور ملحقہ مرجوں پر سرائے جدید عامرہ بنوایا، جس میں سلانیک کے قریب کھنڈروں سے لایا گیا سنگِ مرمر استعمال ہوا؛ محمد ثانی نے اگلے سال تعمیر جاری رکھی اور جزیرے میں ہزاروں درخت لگوائے {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}۔"
  es: "Murad II construyó el Saray-ı Cedid-i Amire, el Nuevo Palacio Imperial, en 854/1450 en una isla en Tunca y los prados adyacentes, en parte con mármol traído de ruinas cerca de Salónica; Mehmed II continuó su construcción al año siguiente e hizo plantar miles de árboles en la isla {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  fr: "Murad II fit construire le Saray-ı Cedid-i Amire, le Nouveau Palais Impérial, en 854/1450 sur une île de la Tunca et les prairies adjacentes, en partie avec du marbre provenant de ruines près de Salonique; Mehmed II poursuivit sa construction l'année suivante et fit planter des milliers d'arbres sur l'île {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  tr: "Murad II, yeni sarayı Hicri 854/Miladi 1450 yılında Tunca Nehri üzerindeki bir adada ve ona bitişik çayırlarda, Selanik yakınlarındaki harabelerden getirilen mermeri kullanarak inşa ettirdi. Muhammed II, inşaatı ertesi yıl tamamladı ve adaya binlerce ağaç diktirdi. {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}"
  id: "Murad II membangun istana baru pada tahun 854 H/1450 M di sebuah pulau di Sungai Tunca dan padang rumput di sekitarnya, menggunakan marmer yang dibawa dari reruntuhan di dekat Salonika. Muhammad II menyelesaikan pembangunannya pada tahun berikutnya dan menanam ribuan pohon di pulau tersebut. {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
