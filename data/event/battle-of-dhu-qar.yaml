label: { en: "The Battle of Dhu Qar", ar: "يوم ذي قار" }
summary:
  en: "Khosrow’s marzabans and the governor Iyas ibn Qabisa marched to wrest al-Nuʾman’s deposited family and wealth from Hani ibn Masʾud; Banu Shayban met them at Dhu Qar and routed the Persians utterly — the first day the Arabs defeated the Persians, shortly after the Prophet’s birth."
  ar: "خرجت مرازبة كسرى وكتائبه في موكب إياس بن قبيصة ليأخذوا ما أودعه النعمان عند هانئ بن مسعود، فأبى هانئ تسليمه حمية؛ فكانت بين الفريقين موقعة هائلة عند ذي قار انتصر فيها بنو شيبان وانهزمت الفرس هزيمة منكرة — أول يوم انتصرت فيه العرب على العجم، بعد مولد النبي بقليل."
