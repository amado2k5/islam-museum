label: { en: "The Battle of Dhu Qar", ar: "يوم ذي قار", fr: "La bataille de Dhu Qar", es: "La batalla de Dhu Qar", ur: "ذو قار کی جنگ", tr: "Dhi Qar Günü", id: "Hari Dhi Qar" }
summary:
  en: "Khosrow’s marzabans and the governor Iyas ibn Qabisa marched to wrest al-Nuʾman’s deposited family and wealth from Hani ibn Masʾud; Banu Shayban met them at Dhu Qar and routed the Persians utterly — the first day the Arabs defeated the Persians, shortly after the Prophet’s birth."
  ar: "بعدما قُيد النعمان بن المنذر ومات بخانقين، أمر كسرى إياس بن قبيصة — وقد استعمله على الحيرة — أن يستخلص وديعة النعمان من أربعمائة درع ⁦(وقيل ثمانمائة)⁩ عند هانئ بن مسعود، فأبى هانئ تسليمها حمية، فأنذر كسرى بكرًا بخيرهم واحدة من ثلاث — التسليم أو الجلاء أو الحرب — فأشار عليهم حنظلة بن ثعلبة العجلي بالحرب، وقطع وضن الهوادج وضرب على نفسه قبة أقسم أن لا يفر حتى تفر، فسمي مقطع الوضن؛ فكانت بين الفريقين موقعة هائلة عند ذي قار انتصر فيها بنو شيبان وانهزمت الفرس هزيمة منكرة — أول يوم انتصرت فيه العرب على العجم، بعد مولد النبي بقليل. وقد فُوّض أمر بكر لحنظلة حين أرسل كسرى النعمان بن زرعة التغلبي بالتخيير {cite:kamil-ibn-al-athir p. 367-368}."
  fr: "Les marzbans de Khosrô et le gouverneur Iyas ibn Qabisa marchèrent pour arracher à Hani ibn Mas'ud la famille et les biens qu'al-Nu'man lui avait confiés ; les Banu Shayban les affrontèrent à Dhu Qar et mirent les Perses en complète déroute : ce fut le premier jour où les Arabes vainquirent les Perses, peu après la naissance du Prophète."
  es: "Los marzabanes de Khosrow y el gobernador Iyas ibn Qabisa marcharon para arrebatarle a Hani ibn Masʾud la familia y la riqueza que al-Nuʾman había depositado; los Banu Shayban los interceptaron en Dhu Qar y derrotaron por completo a los persas, el primer día en que los árabes vencieron a los persas, poco después del nacimiento del Profeta."
  ur: "خسرو کے مرزبان اور گورنر ایاس ابن قبیصہ نے ہانی ابن مسعود سے النعمان کے جمع شدہ خاندان اور دولت کو چھیننے کے لیے مارچ کیا۔ بنو شیبان نے ذو قار کے مقام پر ان سے ملاقات کی اور فارسیوں کو مکمل طور پر شکست دے دی - پہلے دن عربوں نے فارسیوں کو شکست دی تھی، پیغمبر کی پیدائش کے فوراً بعد۔"
  tr: "El-Nu'man ibn el-Mundhir hapsedilip Hanıkin'de öldükten sonra, Hüsrev, Hira valisi olarak atadığı İyas ibn Kubeysa'ya, Hani' ibn Mes'ud'un elinde bulunan dört yüz (bazı kaynaklara göre sekiz yüz) zırh takımını geri almasını emretti. Hani' gururundan dolayı bunları teslim etmeyi reddetti. Hüsrev daha sonra Bakr kabilesine bir ültimatom verdi: üç seçenekten birini seçin: teslim olun, sürgüne gidin veya savaşa gidin. Hanzalah ibn Tha'labah el-Ajli onlara savaşmalarını tavsiye etti. Sedyelerin eyer kayışlarını kesti ve etrafına bir çadır kurarak, onlar kaçana kadar kendisinin de kaçmayacağına yemin etti. \"Eyer kayışlarını kesen\" olarak tanındı. Zir'de iki taraf arasında şiddetli bir savaş yaşandı; bu savaşta Beni Şeyban galip geldi ve Persler ağır bir yenilgiye uğradı. Bu, Peygamberin doğumundan kısa bir süre sonra Arapların Perslere karşı kazandığı ilk zafer günüydü. Bekir kabilesinin liderliği, Hüsrev'in Numan ibn Zur'a el-Tağlibibi'yi görevlendirmesiyle Hanzalah'a emanet edildi."
  id: "Setelah al-Nu'man ibn al-Mundhir dipenjara dan meninggal di Khaniqin, Khosrow memerintahkan Iyas ibn Qubaysah—yang telah diangkatnya sebagai gubernur al-Hirah—untuk mengambil kembali simpanan al-Nu'man berupa empat ratus (atau ada yang mengatakan delapan ratus) set baju zirah yang disimpan oleh Hani' ibn Mas'ud. Hani' menolak untuk menyerahkannya karena kesombongan. Khosrow kemudian memberi suku Bakr ultimatum: pilih salah satu dari tiga pilihan—menyerah, pengasingan, atau perang. Hanzalah ibn Tha'labah al-'Ajli menyarankan mereka untuk berperang. Dia memotong tali pelana tandu dan mendirikan tenda di sekelilingnya, bersumpah untuk tidak melarikan diri sampai mereka melakukannya. Dia kemudian dikenal sebagai \"orang yang memotong tali pelana.\" Pertempuran sengit terjadi antara kedua pihak di Dhi Qar, di mana Bani Shayban meraih kemenangan dan Persia menderita kekalahan telak—hari pertama bangsa Arab meraih kemenangan atas Persia, tak lama setelah kelahiran Nabi. Kepemimpinan suku Bakr dipercayakan kepada Hanzalah ketika Khosrow mengutus al-Nu'man ibn Zur'ah al-Taghlibi dengan pilihan tersebut."
