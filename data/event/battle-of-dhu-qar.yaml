id: event/battle-of-dhu-qar
class: event
kind: battle
label: { en: "The Battle of Dhu Qar", ar: "يوم ذي قار" }
summary:
  en: "Khosrow’s marzabans and the governor Iyas ibn Qabisa marched to wrest al-Nuʾman’s deposited family and wealth from Hani ibn Masʾud; Banu Shayban met them at Dhu Qar and routed the Persians utterly — the first day the Arabs defeated the Persians, shortly after the Prophet’s birth."
  ar: "بعدما قُيد النعمان بن المنذر ومات بخانقين، أمر كسرى إياس بن قبيصة — وقد استعمله على الحيرة — أن يستخلص وديعة النعمان من أربعمائة درع (وقيل ثمانمائة) عند هانئ بن مسعود، فأبى هانئ تسليمها حمية، فأنذر كسرى بكرًا بخيرهم واحدة من ثلاث — التسليم أو الجلاء أو الحرب — فأشار عليهم حنظلة بن ثعلبة العجلي بالحرب، وقطع وضن الهوادج وضرب على نفسه قبة أقسم أن لا يفر حتى تفر، فسمي مقطع الوضن؛ فكانت بين الفريقين موقعة هائلة عند ذي قار انتصر فيها بنو شيبان وانهزمت الفرس هزيمة منكرة — أول يوم انتصرت فيه العرب على العجم، بعد مولد النبي بقليل. وقد فُوّض أمر بكر لحنظلة حين أرسل كسرى النعمان بن زرعة التغلبي بالتخيير {cite:kamil-ibn-al-athir p. 367-368}."
