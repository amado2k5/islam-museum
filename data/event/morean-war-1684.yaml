summary:
  ar: "بطاقة أولية لحرب المورة بين البندقية والعثمانيين من ١٦٨٤ إلى ١٦٩٩م، استولى فيها البنادقة على البيلوبونيز قبل استردادها لاحقاً؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Morean War between Venice and the Ottomans from 1684 to 1699, in which Venice seized the Peloponnese before its later recovery; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Guerra de Morea entre Venecia y los otomanos, de 1684 a 1699, en la que Venecia se apoderó del Peloponeso antes de su posterior recuperación; sus fuentes aún no han sido verificadas en la página."
  fr: "Fiche de projet pour la guerre de Morée entre Venise et les Ottomans de 1684 à 1699, au cours de laquelle Venise s'empara du Péloponnèse avant de le récupérer plus tard; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1684 سے 1699 تک وینس اور عثمانیوں کے درمیان مورین جنگ کے لیے ڈرافٹ کارڈ، جس میں وینس نے پیلوپونیوں کو اس کے بعد کی بحالی سے پہلے پکڑ لیا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Venedik ile Osmanlılar arasında 1684-1699 yılları arasında gerçekleşen Mora Savaşı'na dair ön bir anlatım; bu savaşta Venedikliler Mora Yarımadası'nı ele geçirmiş, daha sonra ise geri almışlardır; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Perang Morea antara Venesia dan Ottoman dari tahun 1684 hingga 1699 M, di mana Venesia merebut Peloponnese sebelum kemudian merebutnya kembali; sumber-sumber di halaman ini belum ditinjau."
