label: { ar: "كسر الحجر الأسود ٤١٣", en: "Breaking of the Black Stone in 413" }
summary:
  ar: "في أيام الحج سنة ٤١٣ ضرب رجل من حجاج مصر الحجر الأسود بدبوس فكسر منه شيئًا فقتله الناس في الحال، ووقعت فتنة على أهل مصر والمغاربة وقتل منهم عشرون ونهبهم أهل الحرم وكانوا بين مكة ومنى لأجل ذلك. وقال ابن الجوزي: قال أبو الغنائم رأيت رجلًا أحمر عظيمًا معه سيف ودبوس صعد إلى الحجر يوم النفر يوم الجمعة وضربه ثلاث ضربات متواليات وهو يقول إلى متى يعبد الحجر لا محمد ولا علي يمنعني، فخرج الناس عليه فقتلوه وقتلوا معه نحوًا من عشرين رجلًا صعدوا إليه بعده وحُرق منهم أربعة، وانكسر من الحجر كسرة وهو ثلاث حجيرات فنزع جلده من كل جهة حتى بقي شيء ظاهر وثلاث كسرات، فجمع بنو شيبة ما انكسر من الحجر وجمعوه بماء المسك واللك لطخوا به فهو على حاله اليوم {cite:muntazam-ibn-al-jawzi j.8 p.350-351}."
  en: "In the days of the Hajj of 413 a man among the pilgrims from Egypt struck the Black Stone with a mace and broke off a piece, and the people killed him on the spot. Strife broke out between the people of Egypt and the Maghribis; twenty of them were killed, and the people of the Haram plundered them, they being between Mecca and Mina for that reason. Ibn al-Jawzi says: Abu'l-Ghana'im said, 'I saw a large red man with a sword and a mace climb to the Stone on the day of nafr, a Friday, and strike it three times in succession, saying: How long will the stone be worshipped while neither Muhammad nor Ali prevents me?' The people rose against him and killed him, and killed about twenty men who climbed up to it after him; four were burned. A piece broke off the Stone, in three small parts; its outer skin was stripped on every side, leaving a visible portion and three fragments. The Banu Shayba gathered what had broken off, mixed it with musk-scented water and lac, and smeared it on the Stone, where it remains as it is today {cite:muntazam-ibn-al-jawzi j.8 p.350-351}."
