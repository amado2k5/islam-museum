label: { ar: "كسر الحجر الأسود ٤١٣", en: "Breaking of the Black Stone in 413", fr: "Le bris de la Pierre noire en 413", es: "La ruptura de la Piedra Negra en 413", ur: "413 میں حجر اسود کا ٹوٹنا", tr: "Kara Taşı Kırmak 413", id: "Menghancurkan Batu Hitam 413" }
summary:
  ar: "في أيام الحج سنة ٤١٣ ضرب رجل من حجاج مصر الحجر الأسود بدبوس فكسر منه شيئًا فقتله الناس في الحال، ووقعت فتنة على أهل مصر والمغاربة وقتل منهم عشرون ونهبهم أهل الحرم وكانوا بين مكة ومنى لأجل ذلك. وقال ابن الجوزي: قال أبو الغنائم رأيت رجلًا أحمر عظيمًا معه سيف ودبوس صعد إلى الحجر يوم النفر يوم الجمعة وضربه ثلاث ضربات متواليات وهو يقول إلى متى يعبد الحجر لا محمد ولا علي يمنعني، فخرج الناس عليه فقتلوه وقتلوا معه نحوًا من عشرين رجلًا صعدوا إليه بعده وحُرق منهم أربعة، وانكسر من الحجر كسرة وهو ثلاث حجيرات فنزع جلده من كل جهة حتى بقي شيء ظاهر وثلاث كسرات، فجمع بنو شيبة ما انكسر من الحجر وجمعوه بماء المسك واللك لطخوا به فهو على حاله اليوم {cite:muntazam-ibn-al-jawzi j.8 p.350-351}."
  en: "In the days of the Hajj of 413 a man among the pilgrims from Egypt struck the Black Stone with a mace and broke off a piece, and the people killed him on the spot. Strife broke out between the people of Egypt and the Maghribis; twenty of them were killed, and the people of the Haram plundered them, they being between Mecca and Mina for that reason. Ibn al-Jawzi says: Abu'l-Ghana'im said, 'I saw a large red man with a sword and a mace climb to the Stone on the day of nafr, a Friday, and strike it three times in succession, saying: How long will the stone be worshipped while neither Muhammad nor Ali prevents me?' The people rose against him and killed him, and killed about twenty men who climbed up to it after him; four were burned. A piece broke off the Stone, in three small parts; its outer skin was stripped on every side, leaving a visible portion and three fragments. The Banu Shayba gathered what had broken off, mixed it with musk-scented water and lac, and smeared it on the Stone, where it remains as it is today {cite:muntazam-ibn-al-jawzi j.8 p.350-351}."
  fr: "Pendant les jours du pèlerinage de 413, un homme parmi les pèlerins d'Égypte frappa la Pierre noire d'une masse et en détacha un morceau, et les gens le tuèrent sur-le-champ. Des troubles éclatèrent entre les gens d'Égypte et les Maghrébins ; vingt d'entre eux furent tués, et les gens du Haram les pillèrent, alors qu'ils étaient pour cette raison entre La Mecque et Mina. Ibn al-Jawzi dit : Abu'l-Ghana'im a dit : « J'ai vu un grand homme roux, avec une épée et une masse, monter jusqu'à la Pierre le jour du nafr, un vendredi, et la frapper trois fois de suite en disant : Jusqu'à quand la pierre sera-t-elle adorée, alors que ni Muhammad ni Ali ne m'en empêchent ? » Les gens se dressèrent contre lui et le tuèrent, et tuèrent une vingtaine d'hommes qui montèrent jusqu'à elle après lui ; quatre furent brûlés. Un morceau se détacha de la Pierre, en trois petites parties ; sa peau extérieure fut arrachée de tous côtés, laissant une partie visible et trois fragments. Les Banu Shayba rassemblèrent ce qui s'était détaché, le mêlèrent à de l'eau parfumée au musc et à de la laque, et l'appliquèrent sur la Pierre, où il reste tel qu'il est aujourd'hui {cite:muntazam-ibn-al-jawzi j.8 p.350-351}."
  es: "En los días del Hajj del año 413, un hombre entre los peregrinos de Egipto golpeó la Piedra Negra con una maza y arrancó un pedazo, y la gente lo mató en el acto. Estalló una contienda entre los egipcios y los magrebíes; veinte de ellos murieron, y la gente del Haram los saqueó, pues se encontraban entre La Meca y Mina por esa razón. Ibn al-Jawzi dice: Abu'l-Ghana'im dijo: «Vi a un hombre grande y rojo con una espada y una maza subir a la Piedra el día de Nafr, un viernes, y golpearla tres veces seguidas, diciendo: \"¿Hasta cuándo se adorará la piedra mientras ni Muhammad ni Ali me lo impiden?\". La gente se alzó contra él y lo mató, y mató a unos veinte hombres que subieron después; cuatro fueron quemados. Un pedazo se desprendió de la Piedra, en tres partes pequeñas; su corteza exterior se desprendió por todos lados, dejando una porción visible y tres fragmentos. Los Banu Shayba recogieron lo que se había desprendido, lo mezclaron con agua perfumada con almizcle y laca, y lo untaron en la Piedra, donde permanece como está hoy {cite:muntazam-ibn-al-jawzi j.8 p.350-351}."
  ur: "413ء کے حج کے دنوں میں مصر کے حاجیوں میں سے ایک شخص نے حجر اسود پر گدی مار کر ایک ٹکڑا توڑ دیا اور لوگوں نے اسے موقع پر ہی قتل کر دیا۔ اہل مصر اور مغرب کے درمیان لڑائی چھڑ گئی۔ ان میں سے بیس مارے گئے اور اہل حرم نے ان کو لوٹ لیا، وہ اس وجہ سے مکہ اور منیٰ کے درمیان تھے۔ ابن الجوزی کہتے ہیں: ابو الغنائم کہتے ہیں کہ میں نے جمعہ کے دن ایک سرخ آدمی کو تلوار اور گدی کے ساتھ حجر اسود پر چڑھتے ہوئے دیکھا اور اسے یکے بعد دیگرے تین بار مارتے ہوئے کہا: کب تک اس پتھر کی پرستش کی جائے گی جب کہ مجھے محمد اور علی نے منع نہیں کیا۔ لوگ اُس کے خلاف اُٹھے اور اُسے قتل کر دیا، اور اُس کے بعد اُس پر چڑھنے والے بیس آدمیوں کو مار ڈالا۔ چار جل گئے. ایک ٹکڑا پتھر سے ٹوٹ گیا، تین چھوٹے حصوں میں۔ اس کی بیرونی جلد ہر طرف سے چھن گئی تھی، جس سے ایک دکھائی دینے والا حصہ اور تین ٹکڑے رہ گئے تھے۔ بنو شیبہ نے جو ٹوٹا تھا اسے اکٹھا کیا، اس میں مشک کی خوشبو والے پانی اور لاکھ ملایا اور اس کو حجر اسود پر لگا دیا، جہاں یہ آج بھی موجود ہے۔"
  tr: "Hicri 413 yılının Hac mevsiminde, Mısır'dan bir hacı, Kara Taş'a bir iğneyle vurarak bir parçasını kırdı. Halk onu hemen öldürdü. Mısırlılar ve Kuzey Afrikalılar arasında bir isyan çıktı ve yirmi kişi öldü. Bu olay yüzünden kutsal mekânın sakinleri Mekke ve Mina halkı tarafından yağmalandı. İbn el-Cevzi şöyle dedi: Ebu el-Ganayim dedi ki: \"Kılıç ve iğne taşıyan iri, kırmızı giysili bir adam gördüm. Ayrılış günü (Cuma) Kara Taş'a tırmandı ve üç kez üst üste vurarak, 'Bu taşa ne zamana kadar tapılacak? Ne Muhammed ne de Ali beni durdurabilir!' dedi.\" Halk dışarı fırlayıp onu ve ondan sonra tırmanan yaklaşık yirmi adamı öldürdü. Dördü yakıldı. Üç küçük taştan oluşan taşın bir parçası koptu. Kabuğu her tarafından soyuldu ve geriye sadece küçük bir parça ve üç kırık kaldı. Beni Şeybe, taşın kırık parçalarını topladı ve misk ve vernikli suyla karıştırıp taşa sürdüler. Taş bugün de aynı şekilde duruyor.\" {cite:muntazam-ibn-al-jawzi j.8 pp.350-351}"
  id: "Pada musim haji tahun 413 Hijriah, seorang jamaah dari Mesir memukul Batu Hitam dengan peniti, hingga sebagiannya patah. Orang-orang langsung membunuhnya. Kerusuhan pecah di antara orang Mesir dan Afrika Utara, mengakibatkan kematian dua puluh orang. Penghuni tempat suci itu dirampok oleh penduduk Mekah dan Mina karena kejadian ini. Ibnu al-Jawzi berkata: Abu al-Ghanayim berkata, \"Aku melihat seorang pria besar berpakaian merah dengan pedang dan peniti. Dia memanjat Batu Hitam pada hari keberangkatan (Jumat) dan memukulnya tiga kali berturut-turut, sambil berkata, 'Sampai kapan batu ini akan disembah? Baik Muhammad maupun Ali tidak dapat menghentikanku!'\" Orang-orang bergegas keluar dan membunuhnya, bersama dengan sekitar dua puluh orang lain yang memanjatnya setelahnya. Empat di antara mereka dibakar. Sepotong batu, yang terdiri dari tiga batu kecil, terlepas. Kulitnya terkelupas dari semua sisi hingga hanya tersisa sebagian kecil dan tiga fragmen. Bani Shaybah mengumpulkan pecahan-pecahan batu itu dan mencampurnya dengan air kesturi dan pernis, yang mereka oleskan padanya. Batu itu tetap seperti itu hingga hari ini.\" {cite:muntazam-ibn-al-jawzi j.8 pp.350-351}"
