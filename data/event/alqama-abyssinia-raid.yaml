summary:
  ar: "بعث عمر علقمة بن مجزّز المدلجي إلى الحبشة وكانت تطرّقت بلاد الإسلام فأصيب المسلمون، فجعل عمر على نفسه أن لا يحمل في البحر أحدًا أبدًا يعني للغزو {cite:kamil-ibn-al-athir p. 387}."
  en: "'Umar sent Alqama ibn Mujazziz al-Mudliji by sea against Abyssinia after its raids on the coast; the Muslims were struck hard, and 'Umar bound himself never again to carry a raider by sea {cite:kamil-ibn-al-athir p. 387}."
  es: "'Umar envió a Alqama ibn Mujazziz al-Mudliji por mar contra Abisinia después de sus incursiones en la costa; los musulmanes fueron golpeados duramente, y 'Umar se prometió a sí mismo no volver a transportar jamás a un asaltante por mar {cite:kamil-ibn-al-athir p. 387}."
  fr: "'Umar envoya Alqama ibn Mujazziz al-Mudliji par mer contre l'Abyssinie après ses raids sur la côte; les musulmans furent durement touchés, et 'Umar se promit de ne plus jamais transporter un pillard par mer {cite:kamil-ibn-al-athir p. 387}."
  ur: "عمر نے علقمہ بن مجاز المدلجی کو ساحل پر چھاپہ مارنے کے بعد حبشہ کے خلاف سمندر کے ذریعے بھیجا؛ مسلمانوں کو سخت مارا گیا، اور عمر نے پھر کبھی اپنے آپ کو سمندر کے ذریعے حملہ آور لے جانے کا پابند نہیں کیا۔ 387}۔"
  tr: "Ömer, İslam topraklarını işgal eden ve Müslümanlara zarar veren Habeşistan'a Alkama bin Mücaziz el-Mudlaji'yi gönderdi. Ömer, bundan sonra asla kimseyi fetih için denize göndermeyeceğine dair kendi kendine yemin etti. {Kaynak: Kamil İbn el-Atir s. 387}"
  id: "Omar mengutus Alqama bin Mujazziz Al-Mudlaji ke Abyssinia, yang telah menginvasi wilayah Islam dan kaum Muslimin menderita kerugian. Omar bersumpah pada dirinya sendiri bahwa ia tidak akan pernah mengirim siapa pun ke laut untuk penaklukan. {cite:kamil-ibn-al-athir p. 387}."
