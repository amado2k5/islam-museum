id: event/franks-tripoli-503
class: event
kind: conquest
label: { ar: "أخذ الفرنج طرابلس الشام", en: "The Franks Take Tripoli of Syria", es: "Los francos toman Trípoli de Siria.", fr: "Les Francs prennent Tripoli en Syrie", ur: "فرانک شام کے طرابلس پر قبضہ کرتے ہیں۔", tr: "Franklar Levant'taki Trablus'u ele geçirdi.", id: "Bangsa Frank merebut Tripoli di Levant." }
summary:
  ar: "في سنة ثلاث وخمس مئة أخذت الفرنج طرابلس بعد حصار سنين، وفي سنة أربع عظم بلاء المسلمين بالفرنج وتيقنوا استيلاءهم على أكثر الشام وطلب المسلمون الهدنة فامتنعت الفرنج وصالحوهم بألوف دنانير كثيرة فهادنوا ثم غدروا {cite:tarikh-khulafa-minhaj-1434 p. 660}."
  en: "In 503 the Franks took Tripoli after a siege of years; the next year the Muslims' trial by them grew so great they knew most of Syria lost — they begged a truce, were refused, then bought one for countless thousands of dinars, and the Franks broke faith {cite:tarikh-khulafa-minhaj-1434 p. 660}."
  es: "En 503, los francos tomaron Trípoli después de un asedio de años; al año siguiente, el juicio de los musulmanes por parte de ellos se volvió tan grande que sabían que la mayor parte de Siria estaba perdida; rogaron una tregua, se les negó, luego compraron una por incontables miles de dinares, y los francos rompieron su promesa {cite:tarikh-khulafa-minhaj-1434 p. 660}."
  fr: "En 503, les Francs prirent Tripoli après un siège de plusieurs années; l'année suivante, l'épreuve que les musulmans subirent devint si grande qu'ils surent que la majeure partie de la Syrie était perdue — ils implorèrent une trêve, qui leur fut refusée, puis ils en achetèrent une pour d'innombrables milliers de dinars, et les Francs manquèrent à leur parole {cite:tarikh-khulafa-minhaj-1434 p. 660}."
  ur: "503 میں فرینکوں نے برسوں کے محاصرے کے بعد طرابلس پر قبضہ کر لیا۔ اگلے سال ان کے ذریعہ مسلمانوں کی آزمائش اس قدر بڑھ گئی کہ وہ جانتے تھے کہ شام کا بیشتر حصہ ہار گیا - انہوں نے جنگ بندی کی درخواست کی، انکار کر دیا گیا، پھر ان گنت ہزاروں دینار میں ایک خرید لیا گیا، اور فرینکوں نے ایمان توڑ دیا۔ 660}۔"
  tr: "503 yılında Franklar, birkaç yıl süren kuşatmanın ardından Trablus'u ele geçirdiler. 504 yılında Müslümanların Franklar karşısındaki ıstırapları arttı ve Franklar Levant'ın büyük bir bölümünü kontrol altına aldıklarından emin oldular. Müslümanlar ateşkes istediler, ancak Franklar bunu reddederek binlerce dinar karşılığında onlarla barış yaptılar. Önce barış yaptılar, sonra da ihanet ettiler. {cite:tarikh-khulafa-minhaj-1434 s. 660}"
  id: "Pada tahun 503, bangsa Frank merebut Tripoli setelah pengepungan selama beberapa tahun. Pada tahun 504, penderitaan umat Muslim di tangan bangsa Frank semakin hebat, dan mereka yakin akan menguasai sebagian besar Levant. Umat Muslim meminta gencatan senjata, tetapi bangsa Frank menolak dan berdamai dengan mereka dengan imbalan ribuan dinar. Mereka berdamai, lalu mengkhianati mereka. {cite:tarikh-khulafa-minhaj-1434 p. 660}."
