label: { ar: "استيلاء الفرنج على القسطنطينية", en: "The Franks Seize Constantinople", es: "Los francos se apoderan de Constantinopla.", fr: "Les Francs s'emparent de Constantinople", ur: "فرانک نے قسطنطنیہ پر قبضہ کیا۔", tr: "Frankların Konstantinopolis'i fethi", id: "Penaklukan Konstantinopel oleh bangsa Frank" }
summary:
  ar: "وفي سنة إحدى وست مئة تغلبت الفرنج على القسطنطينية وأخرجوا الروم منها وكانت بأيدي الروم من قبل الإسلام واستمرت بيد الفرنج إلى سنة ستين وست مئة فاستعادها منهم الروم {cite:tarikh-khulafa-minhaj-1434 p. 696}. وفي سنة إحدى وست مئة عند شذرات الذهب خرجت الكرج فعاثوا بلاد أذربيجان وقتلوا وسبوا ووصلت زعازعهم إلى عمل خلاط فانتدب لحربهم عسكر خلاط وعسكر أرزن الروم فالتقوا ونصر الله الإسلام وقتل في المصاف ملك الكرج وفيها جاءت الفرنج إلى حماة بغتة وأخذوا النساء الغسالات من باب البلد وخرج إليهم الملك المنصور وقاتل قتالاً حسناً وكسر الفرنج عسكره ووقف في الساقة من الرقيقة إلى باب حماة ولولا وقوفه ما أبقوا من المسلمين أحداً {cite:shadharat-dhahab p. 10}."
  en: "In 601 the Franks seized Constantinople and expelled the Romans — theirs since before Islam — and held it till 660, when the Romans took it back {cite:tarikh-khulafa-minhaj-1434 p. 696}."
  es: "En 601, los francos tomaron Constantinopla y expulsaron a los romanos —que la poseían desde antes del Islam— y la mantuvieron hasta 660, cuando los romanos la recuperaron {cite:tarikh-khulafa-minhaj-1434 p. 696}."
  fr: "En 601, les Francs s'emparèrent de Constantinople et expulsèrent les Romains — qui étaient les leurs depuis avant l'Islam — et la conservèrent jusqu'en 660, date à laquelle les Romains la reprirent {cite:tarikh-khulafa-minhaj-1434 p. 696}."
  ur: "601 میں فرانکس نے قسطنطنیہ پر قبضہ کیا اور رومیوں کو نکال دیا - جو اسلام سے پہلے کے تھے - اور اسے 660 تک برقرار رکھا، جب رومیوں نے اسے واپس لے لیا۔ 696}۔"
  tr: "Hicri 601 yılında Franklar Konstantinopolis'i fethetti ve Bizanslıları oradan kovdu. İslamiyet öncesinde Bizanslıların elinde olan şehir, Hicri 660 yılına kadar Frankların elinde kaldı ve Bizanslılar tarafından tekrar ele geçirildi. {cite:tarikh-khulafa-minhaj-1434 s. 696}. Hicri 601 yılında, Şadharat el-Dhahab'a göre, Gürcüler isyan ederek Azerbaycan topraklarını yağmaladı, insanları öldürdü ve esir aldı. Bu karışıklık Hilat bölgesine kadar ulaştı, bu yüzden Hilat ordusu ve Bizanslıların Arzan ordusu onlarla savaşmak için seferber oldu. Karşılaştılar ve Allah İslam'a zafer verdi ve Gürcistan kralı savaşta öldürüldü. O yıl, Franklar aniden Hama'ya geldi ve şehir kapısında çamaşır yıkayan kadınları yakaladı. Kral el-Mansur onlara karşı çıktı ve iyi bir savaş verdi ve Franklar ordusunu bozguna uğrattı. Rakika'dan Hama kapısına kadar mevzisini korudu ve eğer onun bu duruşu olmasaydı, Müslümanlardan hiçbiri hayatta kalmazdı. {Kaynak: Şadharat-Dhaba, s. 10}"
  id: "Pada tahun 601 H, bangsa Frank menaklukkan Konstantinopel dan mengusir Bizantium dari sana. Kota itu berada di tangan Bizantium sebelum Islam dan tetap berada di tangan bangsa Frank hingga tahun 660 H, ketika Bizantium merebutnya kembali dari mereka {cite:tarikh-khulafa-minhaj-1434 p. 696}. Pada tahun 601 H, menurut Shadharat al-Dhahab, bangsa Georgia memberontak dan menghancurkan wilayah Azerbaijan, membunuh dan menawan banyak orang. Kekacauan mereka mencapai wilayah Khilat, sehingga pasukan Khilat dan pasukan Arzan dari Bizantium dimobilisasi untuk melawan mereka. Mereka bertemu, dan Allah memberikan kemenangan kepada Islam, dan raja Georgia terbunuh dalam pertempuran tersebut. Pada tahun itu, bangsa Frank tiba-tiba datang ke Hama dan menangkap para wanita yang sedang mencuci pakaian di gerbang kota. Raja al-Mansur keluar untuk menghadapi mereka dan bertempur dengan baik, dan bangsa Frank menghancurkan pasukannya. Dia bertahan dari al-Raqiqah sampai gerbang Hama, dan seandainya bukan karena pendiriannya, mereka tidak akan membiarkan seorang pun dari kaum Muslimin hidup {cite:shadharat-dhahab p. 10}."
