label: { ar: "استيلاء الفرنج على القسطنطينية", en: "The Franks Seize Constantinople" }
summary:
  ar: "وفي سنة إحدى وست مئة تغلبت الفرنج على القسطنطينية وأخرجوا الروم منها وكانت بأيدي الروم من قبل الإسلام واستمرت بيد الفرنج إلى سنة ستين وست مئة فاستعادها منهم الروم {cite:tarikh-khulafa-minhaj-1434 p. 696}. وفي سنة إحدى وست مئة عند شذرات الذهب خرجت الكرج فعاثوا بلاد أذربيجان وقتلوا وسبوا ووصلت زعازعهم إلى عمل خلاط فانتدب لحربهم عسكر خلاط وعسكر أرزن الروم فالتقوا ونصر الله الإسلام وقتل في المصاف ملك الكرج وفيها جاءت الفرنج إلى حماة بغتة وأخذوا النساء الغسالات من باب البلد وخرج إليهم الملك المنصور وقاتل قتالاً حسناً وكسر الفرنج عسكره ووقف في الساقة من الرقيقة إلى باب حماة ولولا وقوفه ما أبقوا من المسلمين أحداً {cite:shadharat-dhahab p. 10}."
  en: "In 601 the Franks seized Constantinople and expelled the Romans — theirs since before Islam — and held it till 660, when the Romans took it back {cite:tarikh-khulafa-minhaj-1434 p. 696}."
