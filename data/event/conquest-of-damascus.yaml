label: { ar: "فتح دمشق", en: "The Conquest of Damascus", es: "La conquista de Damasco", fr: "La conquête de Damas", ur: "دمشق کی فتح", tr: "Şam'ın Fethi", id: "Penaklukan Damaskus" }
summary:
  ar: "عند البلاذري: لما فرغ المسلمون من قتال من اجتمع لهم بالمرج أقاموا خمس عشرة ليلة ثم رجعوا إلى دمشق لأربع عشرة ليلة بقيت من المحرم سنة 14 فأخذوا الفوطة وكنائسها عنوة وتحصن أهل المدينة وأغلقوا بابها؛ فنزل خالد على الباب الشرقي في زهاء خمسة آلاف ضمهم إليه أبو عبيدة ⁦(وقوم يقولون كان خالد أميراً وإنما أتاه عزله وهم محاصرون)⁩، وسمي الدير الذي نزل عنده دير خالد، ونزل عمرو بن العاص على باب توما وشرحبيل على باب الفراديس وأبو عبيدة على باب الجابية ويزيد بن أبي سفيان على الباب الصغير إلى باب كيسان وجعل أبو الدرداء عويمر بن عامر الخزرجي على مسلحة ببرزة؛ وكان الأسقف الذي أقام لخالد النزل يدعوه ويحدثه وقال ذات يوم «يا أبا سليمان إن أمركم مقبل ولي عليك عدة فصالحني عن هذه المدينة» فكتب له خالد كتابه المشهور: «بسم الله الرحمن الرحيم، هذا ما أعطى خالد بن الوليد أهل دمشق إذا دخلها: أعطاهم أماناً على أنفسهم وأموالهم وكنائسهم وسور مدينتهم لا يُهدم ولا يسكن شيء من دورهم؛ لهم بذلك عهد الله وذمة رسوله والخلفاء والمؤمنين لا يُعرض لهم إلا بخير إذا أعطوا الجزية»؛ ثم أعلمه بعض أصحاب الأسقف أنها ليلة عيد لأهل المدينة وأن الباب الشرقي قد ردم بالحجارة وأشار عليه بالسلم فأتاه قوم من أهل الدير بسلمين فرقي جماعة من المسلمين إلى أعلى السور ونزلوا إلى الباب وليس عليه إلا رجل أو رجلان فتعاونوا عليه وفتحوه عند طلوع الشمس، وكان أبو عبيدة قد عانى فتح باب الجابية وأصعد جماعة على حائطه فانصب مقاتلة الروم إليه فقاتلوهم حتى ولوا مدبرين ففتحه عنوة ودخل، فالتقى هو وخالد بالمقسلاط موضع النحاسين وهو البريص الذي قال فيه حسان بن ثابت «يسقون من ورد البريص عليهم بردى يصفق بالرحيق السلسل»؛ وزعم ميثم بن عدي أن أهل دمشق صولحوا على أنصاف منازلهم وكنائسهم وقال الواقدي قرأت كتاب خالد فلم أر فيه أنصاف المنازل والكنائس؛ ولما فتحت لحق بشر كثير من أهلها بهرقل بأنطاكية فكثرت فضول منازلها فنزلها المسلمون؛ وقال الواقدي كان الفتح في رجب سنة 14 وأرّخ كتاب خالد في ربيع الآخر سنة 15 لأنه كتبه بغير تاريخ فلما احتاجوا لتجديده عند اليرموك أرّخه بوقته؛ ورأى محرر الطبعة أن الصحيح دخول خالد من الباب الشرقي قسراً ودخول أبي عبيدة سلماً من باب الجابية، مستدلاً بأن جامع دمشق لم يكن بيد المسلمين منه قبل عمارته إلا الجانب الشرقي وبأن الكنيسة بقيت من غربه حتى هدمها الوليد بن عبد الملك؛ ثم اختار المسلمون من الكنائس ما لم يؤدّوا عنها الجزية وأمسكوا كنيسة يوحنا حتى أعطاهم النصارى جميع كنائس الفوطة فصفحوا عنها فكتب به معاوية إلى عمر فسرّه وأمضاه."
  en: "In al-Baladhuri: when the Muslims finished fighting those who had gathered at the Marj they stayed fifteen nights, then returned to Damascus fourteen nights remaining of al-Muharram year 14, taking the Futa and its churches by force while the townsfolk fortified themselves and shut their gate; Khalid camped at the eastern gate with some five thousand joined to him by Abu Ubayda (some say Khalid was commander and his deposition reached them while besieging), the monastery at his side being named Dayr Khalid; Amr ibn al-As camped at Bab Tuma, Shurahbil at Bab al-Faradis, Abu Ubayda at Bab al-Jabiya, and Yazid ibn Abi Sufyan at the small gate to Bab Kaysan, Abu al-Darda' posting Uwaymir ibn Amir al-Khazraji on a watch at Barza; the bishop who had hosted Khalid would call and converse with him, saying one day 'Abu Sulayman, your affair ascends — I hold a pledge over you, so make terms with me for this city', and Khalid wrote his famous charter: 'In God's name, this is what Khalid ibn al-Walid grants the people of Damascus when he enters it: safety for themselves, their wealth, their churches and their city wall — it shall not be demolished nor any of their houses dwelt in; they have for it God's covenant and the protection of His messenger, the caliphs and the believers, and nothing but good shall befall them if they pay the jizya'; one of the bishop's men then told him it was a feast-night for the town, the eastern gate being blocked with stones, and advised a ladder — men of the monastery brought two ladders and a company of Muslims climbed the wall, descended on the gate held by a man or two, overpowered it and opened it at sunrise; Abu Ubayda meanwhile had struggled at Bab al-Jabiya, raised men on its wall, the Roman fighters inclining to him until they broke — he forced it open and entered, and he and Khalid met at the Maqsilat, the coppersmiths' quarter, the Baris of Hassan ibn Thabit's verse 'they give to drink whoever comes to Baris — Barada clapping with sweet wine'; Maytham ibn Adi claimed Damascenes compounded for half their houses and churches, but al-Waqidi says he read Khalid's charter and found no halves in it; many Damascenes joined Heraclius at Antioch leaving surplus houses the Muslims occupied; al-Waqidi dates the conquest to Rajab year 14, Khalid's charter being dated Rabi' al-Akhir 15 because he wrote it undated and it was renewed at the Yarmuk; the volume's editor judges the sound account to be Khalid entering the eastern gate by force and Abu Ubayda entering peacefully by Bab al-Jabiya, reasoning that the Muslims held only the mosque's eastern side before its rebuilding and the church stood west of it until al-Walid demolished it; afterwards the Muslims chose churches for which no jizya was paid and kept the church of John until the Christians surrendered all the churches of the Futa, Mu'awiya writing to Umar who was pleased and ratified it."
  es: "En al-Baladhuri: cuando los musulmanes terminaron de luchar contra los que se habían reunido en el Marj, se quedaron quince noches, luego regresaron a Damasco catorce noches más del año 14 de al-Muharram, tomando Futa y sus iglesias por la fuerza mientras los habitantes de la ciudad se fortificaban y cerraban su puerta; Khalid acampó en la puerta oriental con unos cinco mil hombres a los que se unió Abu Ubayda (algunos dicen que Khalid era el comandante y su deposición les llegó mientras estaban sitiando), el monasterio a su lado se llamó Dayr Khalid; Amr ibn al-As acampó en Bab Tuma, Shurahbil en Bab al-Faradis, Abu Ubayda en Bab al-Jabiya, y Yazid ibn Abi Sufyan en la pequeña puerta de Bab Kaysan, Abu al-Darda' puso a Uwaymir ibn Amir al-Khazraji de guardia en Barza; El obispo que había alojado a Khalid lo llamaba y conversaba con él, diciéndole un día: «Abu Sulayman, tu asunto asciende; tengo una garantía sobre ti, así que llega a un acuerdo conmigo por esta ciudad», y Khalid escribió su famosa carta: «En nombre de Dios, esto es lo que Khalid ibn al-Walid concede a la gente de Damasco cuando entra en ella: seguridad para ellos, sus riquezas, sus iglesias y su muralla; no será demolida ni habitada ninguna de sus casas; tienen para ella el pacto de Dios y la protección de Su mensajero, los califas y los creyentes, y nada más que el bien les sobrevendrá si pagan la jizya»; uno de los hombres del obispo le dijo entonces que era noche de fiesta para la ciudad, la puerta oriental estaba bloqueada con piedras, y aconsejó una escalera; los hombres del monasterio trajeron dos escaleras y un grupo de musulmanes escaló la muralla, descendió a la puerta sostenida por uno o dos hombres, la dominó y la abrió al amanecer; Mientras tanto, Abu Ubayda había luchado en Bab al-Jabiya, levantando hombres en su muralla, los combatientes romanos se inclinaron hacia él hasta que cedieron; él forzó la puerta y entró, y él y Khalid se encontraron en la Maqsilat, el barrio de los herreros, el Baris del verso de Hassan ibn Thabit 'dan de beber a quien llega a Baris - Barada aplaudiendo con vino dulce'; Maytham ibn Adi afirmó que los damascenos cedieron la mitad de sus casas e iglesias, pero al-Waqidi dice que leyó la carta de Khalid y no encontró ninguna mitad en ella; muchos damascenos se unieron a Heraclio en Antioquía dejando casas sobrantes que los musulmanes ocuparon; al-Waqidi fecha la conquista en el año 14 de Rajab, la carta de Khalid está fechada en el año 15 de Rabi' al-Akhir porque la escribió sin fecha y fue renovada en el Yarmuk; El editor del volumen considera que el relato más fiable es que Khalid entró por la fuerza por la puerta oriental y Abu Ubayda entró pacíficamente por Bab al-Jabiya, argumentando que los musulmanes solo controlaban el lado oriental de la mezquita antes de su reconstrucción y que la iglesia se encontraba al oeste hasta que al-Walid la demolió; posteriormente, los musulmanes eligieron iglesias por las que no se pagaba ninguna jizya y conservaron la iglesia de Juan hasta que los cristianos entregaron todas las iglesias de Futa, y Mu'awiya escribió a Umar, quien se mostró complacido y lo ratificó."
  fr: "Dans al-Baladhuri: lorsque les musulmans eurent fini de combattre ceux qui s'étaient rassemblés au Marj, ils restèrent quinze nuits, puis retournèrent à Damas quatorze nuits restantes de l'an 14 d'al-Muharram, prenant la Fouta et ses églises par la force tandis que les habitants se fortifiaient et fermaient leur porte; Khalid campa à la porte orientale avec quelque cinq mille hommes rejoints par Abu Ubayda (certains disent que Khalid était commandant et que sa destitution leur parvint pendant le siège), le monastère à ses côtés étant nommé Dayr Khalid; Amr ibn al-As campa à Bab Tuma, Shurahbil à Bab al-Faradis, Abu Ubayda à Bab al-Jabiya, et Yazid ibn Abi Sufyan à la petite porte de Bab Kaysan, Abu al-Darda' postant Uwaymir ibn Amir al-Khazraji en faction à Barza; L'évêque qui avait accueilli Khalid l'appelait et conversait avec lui, disant un jour: « Abu Sulayman, votre affaire prend de l'ampleur — je tiens une promesse sur vous, alors négociez avec moi pour cette ville », et Khalid écrivit sa célèbre charte: « Au nom de Dieu, voici ce que Khalid ibn al-Walid accorde aux habitants de Damas lorsqu'il y entre: la sécurité pour eux-mêmes, leurs biens, leurs églises et leurs remparts — ils ne seront pas démolis et aucune de leurs maisons ne sera habitée; ils ont pour cela l'alliance de Dieu et la protection de Son messager, des califes et des croyants, et rien que du bien ne leur arrivera s'ils paient la jizya »; un des hommes de l'évêque lui dit alors que c'était une nuit de fête pour la ville, la porte orientale étant bloquée par des pierres, et conseilla une échelle — les hommes du monastère apportèrent deux échelles et un groupe de musulmans escalada le mur, descendit sur la porte tenue par un ou deux hommes, la maîtrisa et l'ouvrit au lever du soleil; Entre-temps, Abou Ubayda avait combattu à Bab al-Jabiya, dressé des hommes sur ses remparts, les combattants romains se penchant vers lui jusqu'à ce qu'ils cèdent – il força l'ouverture et entra, et lui et Khalid se rencontrèrent à Maqsilat, le quartier des chaudronniers, le Baris mentionné dans le verset de Hassan ibn Thabit: « Ils offrent à boire à quiconque vient à Baris – Barada applaudissant avec du vin doux »; Maytham ibn Adi prétendait que les Damascènes avaient payé la moitié de leurs maisons et églises, mais al-Waqidi dit avoir lu la charte de Khalid et n'y avoir trouvé aucune mention de moitié; de nombreux Damascènes rejoignirent Héraclius à Antioche, laissant derrière eux des maisons excédentaires occupées par les musulmans; al-Waqidi date la conquête de l'an Rajab 14, la charte de Khalid étant datée de Rabi' al-Akhir 15 car il l'écrivit sans date et elle fut renouvelée au Yarmouk; L'éditeur du volume considère que le récit le plus plausible est celui de Khalid entrant par la porte orientale de force et d'Abu Ubayda entrant pacifiquement par Bab al-Jabiya, expliquant que les musulmans ne contrôlaient que le côté oriental de la mosquée avant sa reconstruction et que l'église se trouvait à l'ouest jusqu'à ce qu'al-Walid la démolât; par la suite, les musulmans choisirent des églises pour lesquelles aucune jizya n'était payée et conservèrent l'église de Jean jusqu'à ce que les chrétiens rendent toutes les églises du Fouta, Mu'awiya écrivant à Umar qui fut satisfait et ratifia cela."
  ur: "البلادوری میں ہے: جب مسلمان مرج میں جمع ہونے والوں سے لڑنے سے فارغ ہوئے تو وہ پندرہ راتیں ٹھہرے، پھر 14 محرم الحرام کی چودہ راتیں باقی رہ کر دمشق واپس لوٹے، فوطا اور اس کے گرجا گھروں کو زبردستی قبضے میں لے لیا جبکہ شہر کے لوگوں نے اپنے آپ کو مضبوط کر لیا اور اپنے دروازے بند کر لیے۔ خالد نے مشرقی دروازے پر ڈیرے ڈالے تقریباً پانچ ہزار ابو عبیدہ ⁦(کچھ کہتے ہیں کہ خالد کمانڈر تھا اور محاصرہ کرتے ہوئے ان کی معزولی ان تک پہنچ گئی)⁩، ان کے پہلو میں واقع خانقاہ کا نام دیار خالد تھا۔ عمرو بن العاص نے باب تمہ میں، شورابیل نے باب الفرادیس میں، ابو عبیدہ نے باب الجبیہ میں، اور یزید ابن ابی سفیان نے باب کیسن کے چھوٹے دروازے پر، ابو الدرداء نے عویمیر بن عامر الخزازی کو بار میں چوکیداری پر تعینات کیا۔ بشپ جس نے خالد کی میزبانی کی تھی وہ ایک دن اسے فون کر کے بات کرے گا اور کہے گا کہ ابو سلیمان تمہارا معاملہ بڑھ رہا ہے - میں تم سے عہد کرتا ہوں، لہذا اس شہر کے لیے مجھ سے معاہدہ کرو، اور خالد نے اپنا مشہور چارٹر لکھا: 'خدا کے نام سے، یہ وہی ہے جو خالد بن الولید دمشق کے لوگوں کو ان کے مال و دولت اور ان کی حفاظت کے لیے دے گا جب وہ دمشق میں داخل ہوں گے۔ دیوار - اسے گرایا نہیں جائے گا اور نہ ہی ان کے گھروں میں سے کوئی آباد ہو گا۔ اس کے لیے ان کے لیے خدا کا عہد اور اس کے رسول، خلفائے راشدین اور مومنین کی حفاظت ہے، اور اگر وہ جزیہ ادا کریں تو ان کے لیے خیر کے سوا کچھ نہیں ہوگا۔ پھر بشپ کے آدمیوں میں سے ایک نے اسے بتایا کہ یہ قصبے کے لیے عید کی رات ہے، مشرقی دروازے کو پتھروں سے بند کر دیا گیا ہے، اور ایک سیڑھی کا مشورہ دیا - خانقاہ کے آدمی دو سیڑھیاں لائے اور مسلمانوں کا ایک گروہ دیوار پر چڑھ گیا، ایک یا دو آدمیوں کے ہاتھ سے پکڑے ہوئے دروازے پر اترا، اسے زیر کیا اور طلوع آفتاب کے وقت اسے کھول دیا۔ ابو عبیدہ نے اسی دوران باب الجبیہ میں جدوجہد کی، اس کی دیوار پر آدمیوں کو کھڑا کیا، رومی جنگجو اس کی طرف جھک گئے یہاں تک کہ وہ ٹوٹ گئے - اس نے زبردستی اسے کھولا اور داخل ہوا، اور اس کی اور خالد کی ملاقات مقسیلات میں ہوئی، تانبے کے کوارٹر، حسن بن ثابت کی باریس کی آیت؛ وہ باری کے ساتھ جو بھی پیتے ہیں، میٹھا پیتے ہیں۔ میثم بن عدی نے دعویٰ کیا کہ دمشقیوں نے اپنے آدھے مکانات اور گرجا گھروں کو گھیر لیا، لیکن الواقدی کا کہنا ہے کہ اس نے خالد کا چارٹر پڑھا اور اس میں کوئی حصہ نہیں ملا۔ بہت سے دمشقیوں نے انطاکیہ میں مسلمانوں کے زیر قبضہ اضافی مکانات چھوڑ کر ہیریکلیس میں شمولیت اختیار کی۔ الواقدی نے فتح کی تاریخ رجب 14 سال بتائی ہے، خالد کے چارٹر کی تاریخ ربیع الآخر 15 ہے کیونکہ اس نے اسے بغیر تاریخ کے لکھا تھا اور یرموک میں اس کی تجدید کی گئی تھی۔ والیم کے ایڈیٹر نے صوتی اکاؤنٹ کو خالد کے مشرقی دروازے سے زبردستی داخل ہونے اور ابو عبیدہ باب الجبیہ سے پرامن طریقے سے داخل ہونے کا فیصلہ کرتے ہوئے کہا ہے کہ مسلمانوں نے مسجد کی تعمیر نو سے پہلے صرف مشرقی جانب ہی قبضہ کیا تھا اور کلیسا اس کے مغرب میں کھڑا تھا جب تک کہ الولید اسے گرا نہیں دیتا۔ اس کے بعد مسلمانوں نے ایسے گرجا گھروں کا انتخاب کیا جن کے لیے کوئی جزیہ ادا نہیں کیا گیا اور یوحنا کے چرچ کو اس وقت تک اپنے پاس رکھا جب تک کہ عیسائیوں نے فوطا کے تمام گرجا گھروں کو تسلیم نہ کر دیا، معاویہ نے عمر کو لکھا جس نے خوش ہو کر اس کی توثیق کی۔"
  tr: "El-Baladhuri'ye göre: Müslümanlar, El-Marj'da kendilerine karşı toplananlarla savaşmayı bitirdikten sonra on beş gece orada kaldılar, ardından 14. yılın Muharrem ayının bitimine on dört gece kala Şam'a döndüler. El-Futa'yı ve kiliselerini zorla ele geçirdiler ve şehir halkı kendilerini tahkim ederek kapısını kapattı. Halid, Ebu Ubeyde'nin kendisine getirdiği yaklaşık beş bin adamla doğu kapısında kamp kurdu (bazıları Halid'in emir olduğunu söyler, ancak kuşatma altındayken görevden alındı). Kamp kurduğu manastıra Halid Manastırı adı verildi. Amr ibn el-Aas, Touma Kapısı'nda, Şerabil, Cennet Kapısı'nda, Ebu Ubeyde, Cebiye Kapısı'nda ve Yezid ibn Ebi Sufyan, Kisan Kapısı'na kadar olan küçük kapıda kamp kurdu. Ebu el-Darda, Uveymir ibn Emir el-Hazarci'yi Barzah'taki tahkim edilmiş bir karakolun komutanı olarak atadı. Halid için han kuran piskopos onu sık sık çağırır ve onunla konuşurdu. Bir gün şöyle dedi: “Ey Ebu Süleyman, meselen geliyor ve sana bir sözüm var, bu şehir konusunda benimle barış yap.” Bunun üzerine Halid ona meşhur mektubunu yazdı: “Rahman ve Rahim olan Allah’ın adıyla. Halid ibn el-Velid, Şam halkına şehre girdiğinde şunları verdi: Kendileri, paraları, kiliseleri ve şehir surları için güvence verdi; surlar yıkılmayacak, evlerinden hiçbiri işgal edilmeyecek. Bunun karşılığında Allah’ın ahdi, Resulünün, halifelerin ve müminlerin koruması vardır. Cizye ödedikleri takdirde, iyilikten başka bir zarar görmeyeceklerdir.” Sonra piskoposun bazı arkadaşları ona şehrin halkı için bir bayram gecesi olduğunu ve doğu kapısının taşlarla doldurulduğunu bildirdiler. Ona bir merdiven önerdiler, bunun üzerine manastırdan bazı kişiler ona iki merdiven getirdiler. Bir grup Müslüman surların tepesine tırmandı ve kapıya indi; kapıda sadece bir iki adam vardı. Onunla işbirliği yaptılar ve güneş doğarken kapıyı açtılar. Ebu Ubeyde, el-Cabiye kapısını açmak için mücadele etmişti ve bir grup surlara tırmanmıştı. Romalı savaşçılar onlara doğru ilerledi ve geri dönüp kaçana kadar onlarla savaştılar. O, kapıyı zorla açtı ve içeri girdi. O ve Halid, bakırcıların yeri olan el-Maqsalat'ta, yani el-Baris'te buluştular. Hasan bin Sabit, bu yer hakkında şöyle demiştir: \"Onlara el-Baris'in suyundan içirilir, üzerlerinde saf nektar akan bir dere vardır.\" Maytham bin Adi, Şam halkına evlerinin ve kiliselerinin yarısının verilmesi şartıyla barış verildiğini iddia etti. El-Vakidi, \"Halid'in mektubunu okudum ve içinde evlerin ve kiliselerin yarısını görmedim\" dedi. Şehir açıldığında, halkının çoğu Antakya'da Heraklius'a katıldı, böylece evlerinin fazlalığı arttı ve Müslümanlar bu evlere yerleşti. El-Vakidi, fethin 14. yılın Receb ayında gerçekleştiğini ve Halid'in kitabının 15. yılın Rebiü'l-Ahir ayında tarihlendiğini, çünkü tarihsiz yazdığını söyledi. Yermuk'ta yenilenmesi gerektiğinde, o döneme göre tarihlendirdi. Baskının editörü, doğru olanın Halid'in doğu kapısından zorla girdiğini ve Ebu Ubeyde'nin Bab el-Cabiye'den barışçıl bir şekilde girdiğini, Şam camisinin doğu tarafı hariç inşa edilmeden önce Müslümanların elinde olmadığını ve kilisenin batı tarafında, El-Valid ibn Abd el-Malik tarafından yıkılana kadar kaldığını savundu. Daha sonra Müslümanlar, cizye ödemedikleri kiliseleri seçtiler ve Yuhanna Kilisesi'ni ellerinde tuttular. Hristiyanlar onlara Futa'nın tüm kiliselerini verince, Müslümanlar onları affettiler. Muaviye bunu Ömer'e yazdı, Ömer de bundan memnun oldu ve onayladı."
  id: "Menurut Al-Baladhuri: Ketika kaum Muslimin selesai memerangi orang-orang yang berkumpul melawan mereka di Al-Marj, mereka tinggal selama lima belas malam, kemudian kembali ke Damaskus empat belas malam sebelum berakhirnya Muharram pada tahun 14. Mereka merebut Al-Futa dan gereja-gerejanya dengan paksa, dan penduduk kota membentengi diri dan menutup gerbangnya. Khalid berkemah di gerbang timur dengan sekitar lima ribu orang yang dibawa oleh Abu Ubaidah (dan beberapa orang mengatakan bahwa Khalid adalah seorang emir, tetapi pemecatannya terjadi saat mereka dikepung). Biara tempat ia berkemah disebut Biara Khalid. Amr ibn al-Aas berkemah di Gerbang Touma, Sharhabil di Gerbang Surga, Abu Ubaidah di Gerbang Jabiyah, dan Yazid ibn Abi Sufyan di gerbang kecil hingga Gerbang Kisan. Abu al-Darda’ menunjuk Uwaymir ibn Amir al-Khazraji sebagai komandan pos benteng di Barzah. Uskup yang telah mendirikan penginapan untuk Khalid biasa memanggilnya dan berbicara dengannya. Suatu hari ia berkata, “Wahai Abu Sulayman, urusanmu akan segera tiba dan aku mempunyai janji kepadamu, maka berdamailah denganku mengenai kota ini.” Maka Khalid menulis suratnya yang terkenal: “Dengan nama Allah, Yang Maha Pengasih, Yang Maha Penyayang. Inilah yang diberikan Khalid bin al-Walid kepada penduduk Damaskus ketika ia memasukinya: Ia memberi mereka keamanan untuk diri mereka sendiri, harta mereka, gereja-gereja mereka, dan tembok kota mereka, yang tidak akan dihancurkan, dan tidak ada rumah mereka yang akan dihuni. Untuk itu mereka memiliki perjanjian Allah, perlindungan Rasul-Nya, para Khalifah, dan orang-orang beriman. Mereka tidak akan dirugikan kecuali dengan kebaikan jika mereka membayar jizya.” Kemudian beberapa sahabat uskup memberitahunya bahwa malam itu adalah malam perayaan bagi penduduk kota dan bahwa gerbang timur telah dipenuhi dengan batu. Mereka menyarankan sebuah tangga kepadanya, maka beberapa orang dari biara membawakan dua tangga untuknya. Sekelompok Muslim memanjat tembok dan turun ke gerbang, dan hanya ada satu atau dua orang di sana. Mereka bekerja sama dengannya dan membukanya saat matahari terbit. Abu Ubaidah telah berjuang untuk membuka gerbang al-Jabiyah dan sekelompok orang memanjat temboknya. Para pejuang Romawi maju ke arahnya dan melawan mereka sampai mereka berbalik dan melarikan diri. Dia membukanya dengan paksa dan masuk. Dia dan Khalid bertemu di al-Maqsalat, tempat para pandai tembaga, yaitu al-Baris, tentang mana Hassan bin Thabit berkata, “Mereka diberi minum dari air al-Baris, di atas mereka ada aliran yang mengalirkan nektar murni.” Maytham bin Adi mengklaim bahwa penduduk Damaskus diberi perdamaian dengan syarat setengah dari rumah dan gereja mereka. Al-Waqidi berkata, “Saya membaca surat Khalid dan saya tidak melihat di dalamnya setengah dari rumah dan gereja.” Ketika dibuka, banyak penduduknya bergabung dengan Heraclius di Antiokhia, sehingga kelebihan rumah mereka meningkat, dan kaum Muslim menetap di sana. Al-Waqidi mengatakan bahwa penaklukan terjadi pada bulan Rajab tahun 14, dan kitab Khalid bertanggal Rabi' al-Akhir tahun 15, karena ia menulisnya tanpa tanggal. Ketika mereka perlu memperbaruinya di Yarmouk, ia memberi tanggal sesuai dengan zamannya. Editor edisi tersebut melihat bahwa hal yang benar adalah Khalid masuk secara paksa dari gerbang timur dan Abu Ubaidah masuk secara damai dari Bab al-Jabiyah, dengan alasan bahwa masjid Damaskus tidak berada di tangan kaum Muslim sebelum pembangunannya kecuali sisi timur, dan bahwa gereja tetap berada di sisi baratnya sampai al-Walid ibn Abd al-Malik menghancurkannya. Kemudian kaum Muslim memilih dari gereja-gereja yang belum mereka bayar jizya-nya dan mereka menguasai Gereja Yohanes sampai orang-orang Kristen memberi mereka semua gereja al-Futa, sehingga mereka mengampuni mereka. Muawiyah menulis tentang hal itu kepada Umar, sehingga ia senang dan menyetujuinya."
