label: { ar: "فتح دمشق", en: "The Conquest of Damascus" }
summary:
  ar: "عند البلاذري: لما فرغ المسلمون من قتال من اجتمع لهم بالمرج أقاموا خمس عشرة ليلة ثم رجعوا إلى دمشق لأربع عشرة ليلة بقيت من المحرم سنة 14 فأخذوا الفوطة وكنائسها عنوة وتحصن أهل المدينة وأغلقوا بابها؛ فنزل خالد على الباب الشرقي في زهاء خمسة آلاف ضمهم إليه أبو عبيدة (وقوم يقولون كان خالد أميراً وإنما أتاه عزله وهم محاصرون)، وسمي الدير الذي نزل عنده دير خالد، ونزل عمرو بن العاص على باب توما وشرحبيل على باب الفراديس وأبو عبيدة على باب الجابية ويزيد بن أبي سفيان على الباب الصغير إلى باب كيسان وجعل أبو الدرداء عويمر بن عامر الخزرجي على مسلحة ببرزة؛ وكان الأسقف الذي أقام لخالد النزل يدعوه ويحدثه وقال ذات يوم «يا أبا سليمان إن أمركم مقبل ولي عليك عدة فصالحني عن هذه المدينة» فكتب له خالد كتابه المشهور: «بسم الله الرحمن الرحيم، هذا ما أعطى خالد بن الوليد أهل دمشق إذا دخلها: أعطاهم أماناً على أنفسهم وأموالهم وكنائسهم وسور مدينتهم لا يُهدم ولا يسكن شيء من دورهم؛ لهم بذلك عهد الله وذمة رسوله والخلفاء والمؤمنين لا يُعرض لهم إلا بخير إذا أعطوا الجزية»؛ ثم أعلمه بعض أصحاب الأسقف أنها ليلة عيد لأهل المدينة وأن الباب الشرقي قد ردم بالحجارة وأشار عليه بالسلم فأتاه قوم من أهل الدير بسلمين فرقي جماعة من المسلمين إلى أعلى السور ونزلوا إلى الباب وليس عليه إلا رجل أو رجلان فتعاونوا عليه وفتحوه عند طلوع الشمس، وكان أبو عبيدة قد عانى فتح باب الجابية وأصعد جماعة على حائطه فانصب مقاتلة الروم إليه فقاتلوهم حتى ولوا مدبرين ففتحه عنوة ودخل، فالتقى هو وخالد بالمقسلاط موضع النحاسين وهو البريص الذي قال فيه حسان بن ثابت «يسقون من ورد البريص عليهم بردى يصفق بالرحيق السلسل»؛ وزعم ميثم بن عدي أن أهل دمشق صولحوا على أنصاف منازلهم وكنائسهم وقال الواقدي قرأت كتاب خالد فلم أر فيه أنصاف المنازل والكنائس؛ ولما فتحت لحق بشر كثير من أهلها بهرقل بأنطاكية فكثرت فضول منازلها فنزلها المسلمون؛ وقال الواقدي كان الفتح في رجب سنة 14 وأرّخ كتاب خالد في ربيع الآخر سنة 15 لأنه كتبه بغير تاريخ فلما احتاجوا لتجديده عند اليرموك أرّخه بوقته؛ ورأى محرر الطبعة أن الصحيح دخول خالد من الباب الشرقي قسراً ودخول أبي عبيدة سلماً من باب الجابية، مستدلاً بأن جامع دمشق لم يكن بيد المسلمين منه قبل عمارته إلا الجانب الشرقي وبأن الكنيسة بقيت من غربه حتى هدمها الوليد بن عبد الملك؛ ثم اختار المسلمون من الكنائس ما لم يؤدّوا عنها الجزية وأمسكوا كنيسة يوحنا حتى أعطاهم النصارى جميع كنائس الفوطة فصفحوا عنها فكتب به معاوية إلى عمر فسرّه وأمضاه."
  en: "In al-Baladhuri: when the Muslims finished fighting those who had gathered at the Marj they stayed fifteen nights, then returned to Damascus fourteen nights remaining of al-Muharram year 14, taking the Futa and its churches by force while the townsfolk fortified themselves and shut their gate; Khalid camped at the eastern gate with some five thousand joined to him by Abu Ubayda (some say Khalid was commander and his deposition reached them while besieging), the monastery at his side being named Dayr Khalid; Amr ibn al-As camped at Bab Tuma, Shurahbil at Bab al-Faradis, Abu Ubayda at Bab al-Jabiya, and Yazid ibn Abi Sufyan at the small gate to Bab Kaysan, Abu al-Darda' posting Uwaymir ibn Amir al-Khazraji on a watch at Barza; the bishop who had hosted Khalid would call and converse with him, saying one day 'Abu Sulayman, your affair ascends — I hold a pledge over you, so make terms with me for this city', and Khalid wrote his famous charter: 'In God's name, this is what Khalid ibn al-Walid grants the people of Damascus when he enters it: safety for themselves, their wealth, their churches and their city wall — it shall not be demolished nor any of their houses dwelt in; they have for it God's covenant and the protection of His messenger, the caliphs and the believers, and nothing but good shall befall them if they pay the jizya'; one of the bishop's men then told him it was a feast-night for the town, the eastern gate being blocked with stones, and advised a ladder — men of the monastery brought two ladders and a company of Muslims climbed the wall, descended on the gate held by a man or two, overpowered it and opened it at sunrise; Abu Ubayda meanwhile had struggled at Bab al-Jabiya, raised men on its wall, the Roman fighters inclining to him until they broke — he forced it open and entered, and he and Khalid met at the Maqsilat, the coppersmiths' quarter, the Baris of Hassan ibn Thabit's verse 'they give to drink whoever comes to Baris — Barada clapping with sweet wine'; Maytham ibn Adi claimed Damascenes compounded for half their houses and churches, but al-Waqidi says he read Khalid's charter and found no halves in it; many Damascenes joined Heraclius at Antioch leaving surplus houses the Muslims occupied; al-Waqidi dates the conquest to Rajab year 14, Khalid's charter being dated Rabi' al-Akhir 15 because he wrote it undated and it was renewed at the Yarmuk; the volume's editor judges the sound account to be Khalid entering the eastern gate by force and Abu Ubayda entering peacefully by Bab al-Jabiya, reasoning that the Muslims held only the mosque's eastern side before its rebuilding and the church stood west of it until al-Walid demolished it; afterwards the Muslims chose churches for which no jizya was paid and kept the church of John until the Christians surrendered all the churches of the Futa, Mu'awiya writing to Umar who was pleased and ratified it."
