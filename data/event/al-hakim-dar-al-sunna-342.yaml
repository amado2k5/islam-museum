id: event/al-hakim-dar-al-sunna-342
class: event
kind: other
label:
  ar: "الصبغي يوصي للحاكم بأمور دار السنة، ٣٤٢هـ"
  en: "Al-Sibghi entrusts Dar al-Sunna to al-Hakim, 342/953"
  ur: "صبغی نے حاکم کو دار السنہ کا امور سونپے، 342ھ/953ء"
summary:
  ar: "اختص الحاكم بصحبة إمام وقته أبي بكر أحمد بن إسحاق الصبغي، فكان الإمام يراجعه في السؤال والجرح والتعديل والعلل، وأوصى إليه في أمور مدرسته دار السنة وفوض إليه تولية أوقافها؛ وتوفي الصبغي في شعبان سنة اثنتين وأربعين {cite:tarikh-islam-dhahabi p. 128} {cite:tarikh-islam-dhahabi p. 256}."
  en: "Al-Hakim attached himself to the imam of his age, Abu Bakr Ahmad ibn Ishaq al-Sibghi, who consulted him on questions of rijal criticism and 'ilal and, at his death in Sha'ban 342/953, bequeathed to him the management of his school Dar al-Sunna and delegated to him the charge of its endowments {cite:tarikh-islam-dhahabi p. 128} {cite:tarikh-islam-dhahabi p. 256}."
  ur: "حاکم اپنے زمانے کے امام ابو بکر احمد بن اسحاق صبغی کی خاص صحبت میں رہے، جو انہیں جرح و تعدیل اور علل کے سوالات میں مشورہ دیتے تھے اور شعبان 342ھ/953ء میں وفات کے وقت اپنی مدرسہ دار السنہ کے امور اور اس کے اوقاف کی نگرانی ان کے سپرد کی {cite:tarikh-islam-dhahabi p. 128} {cite:tarikh-islam-dhahabi p. 256}۔"
