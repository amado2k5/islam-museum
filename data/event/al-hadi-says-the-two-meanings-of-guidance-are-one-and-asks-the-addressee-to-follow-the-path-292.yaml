id: event/al-hadi-says-the-two-meanings-of-guidance-are-one-and-asks-the-addressee-to-follow-the-path-292
class: event
kind: other
label:
  ar: "قصيدة للهادي من الكامل: المعنيان هديت شيء واحد فاطلب، ودعوة المخاطب إلى ترك الفاسد المنعاج، تبدأ في ص325"
  en: "A poem of al-Hadi in the kamil metre: the two meanings are one thing, so seek, and a call to the addressee to leave the crooked and corrupt path, beginning on p. 325"
  ur: "ہادی کی کامل بحر میں نظم: دونوں معنی ایک ہیں اس لیے طلب کرو، اور مخاطب کو ٹیڑھے بگڑے راستے کو چھوڑنے کی دعوت، جو ص325 پر شروع ہوتی ہے"
  es: "Un poema de al-Hadi en metro kamil: los dos significados son uno solo, así que busquen, y un llamado al destinatario a abandonar el camino torcido y corrupto, que comienza en la página 325."
summary:
  ar: "قصيدة من الكامل تحت عنوان «وله أيضاً» في ص325، يقول فيها الهادي لمخاطب لا اسم له إن المعنيين شيء واحد فليطلب الرشد، وإنه لا شيء يعدل وجه الحق، وليرفض إرادة الفجفاج، وأنه الولي أخو الولي فليترك طريق الفاسد المنعاج؛ وتتصل الأبيات بما بعدها في ص326."
  en: "A poem in the kamil metre under the heading \"and also of his\" on p. 325, in which al-Hadi tells an unnamed addressee that the two meanings are one thing so he should seek right guidance, that nothing equals the face of truth, that he should shun the desire of the braggart, and that he is the friend, brother of the friend, and should leave the path of the crooked and corrupt; the lines run on into p. 326."
  ur: "کامل بحر میں نظم، عنوان «اور اس کا یہ بھی» کے تحت ص325 پر، جس میں ہادی ایک بے نام مخاطب سے کہتا ہے کہ دونوں معنی ایک چیز ہیں اس لیے وہ رشد کی طلب کرے، کہ حق کے چہرے کے برابر کچھ نہیں، وہ بڑھ بولے کی خواہش ترک کرے، اور وہ دوست ہے، دوست کا بھائی، اس لیے ٹیڑھے بگڑے کا راستہ چھوڑ دے؛ اشعار ص326 پر جاری رہتے ہیں۔"
  es: "Un poema en metro kamil bajo el título \"y también suyo\" en la página 325, en el que al-Hadi le dice a un destinatario anónimo que los dos significados son una sola cosa, por lo que debe buscar la guía correcta, que nada iguala el rostro de la verdad, que debe evitar el deseo del fanfarrón, y que él es el amigo, hermano del amigo, y debe abandonar el camino de los torcidos y corruptos; los versos continúan hasta la página 326."
