id: event/night-supplication-at-al-baqia
class: event
kind: other
label: { en: "The night supplication at al-Baqi'", ar: "زيارة البقيع ليلاً والاستغفار لأهلها", es: "La súplica nocturna en al-Baqi'", fr: "La prière nocturne à al-Baqi'", ur: "بقیع میں رات کی دعا", tr: "Geceleyin El-Baki'yi ziyaret etmek ve halkı için bağışlanma dilemek.", id: "Mengunjungi Al-Baqi' di malam hari dan memohon ampunan bagi penduduknya." }
summary:
  en: "One night in the last days the Prophet went out at midnight to al-Baqi' cemetery, greeted its people, prayed forgiveness for them, foretold coming trials 'like the segments of dark night', and promised them 'we are following you'."
  ar: "خرج النبي ليلة في منتصفها إلى البقيع فسلم على أهل المقابر واستغفر لهم وأنبأهم بالفتن المقبلة كقطع الليل المظلم الآخرة شر من الأولى، وبشّرهم قائلاً: إنا بكم للاحقون."
  es: "Una noche de los últimos días, el Profeta salió a medianoche al cementerio de al-Baqi', saludó a su gente, oró por el perdón de los demás, predijo las pruebas venideras \"como fragmentos de la noche oscura\" y les prometió \"te seguimos\"."
  fr: "Une nuit, à la fin des temps, le Prophète se rendit à minuit au cimetière d'al-Baqi', salua ses habitants, pria pour eux, leur prédit des épreuves à venir « comme les segments de la nuit obscure » et leur promit: « Nous vous suivons »."
  ur: "آخری ایام میں ایک رات نبی کریم آدھی رات کو قبرستان بقیع کی طرف نکلے، وہاں کے لوگوں کو سلام کیا، ان کے لیے مغفرت کی دعا کی، آنے والی آزمائشوں کی 'اندھیری رات کے حصوں کی طرح' کی پیشین گوئی کی، اور ان سے وعدہ کیا کہ 'ہم آپ کی پیروی کر رہے ہیں'۔"
  tr: "Peygamberimiz bir gece yarısı Bakî'ye çıktı, mezardakilere selam verdi, onlar için bağışlanma diledi ve onlara karanlık gecenin parçaları gibi gelecek olan musibetleri bildirdi; bu musibetlerin ikincisi birincisinden daha kötü olacak ve onlara müjde vererek, \"Biz de size katılacağız\" dedi."
  id: "Suatu malam di tengah malam, Nabi pergi ke Al-Baqi' dan memberi salam kepada penghuni kuburan, memohon ampunan bagi mereka, dan memberitahukan kepada mereka tentang cobaan yang akan datang seperti potongan-potongan malam yang gelap, yang terakhir lebih buruk daripada yang pertama, dan beliau memberi mereka kabar gembira, seraya berkata: Kami akan bergabung dengan kalian."
