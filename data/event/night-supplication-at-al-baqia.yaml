label: { en: "The night supplication at al-Baqi'", ar: "زيارة البقيع ليلاً والاستغفار لأهلها" }
summary:
  en: "One night in the last days the Prophet went out at midnight to al-Baqi' cemetery, greeted its people, prayed forgiveness for them, foretold coming trials 'like the segments of dark night', and promised them 'we are following you'."
  ar: "خرج النبي ليلة في منتصفها إلى البقيع فسلم على أهل المقابر واستغفر لهم وأنبأهم بالفتن المقبلة كقطع الليل المظلم الآخرة شر من الأولى، وبشّرهم قائلاً: إنا بكم للاحقون."
