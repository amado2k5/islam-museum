id: "event/ali-ibn-muhammad-ibn-yahya-dies-in-rajab-327-ah-after-leaning-toward-the-akil"
class: event
kind: other
label:
  ar: "يموت علي بن محمد بن يحيى في رجب سنة 327هـ بعد ميله إلى الأكيليين، ص414"
  en: "Ali ibn Muhammad ibn Yahya dies in Rajab 327 AH after leaning toward the Akil, p. 414"
  ur: "علی بن محمد بن یحییٰ رجب 327ھ میں اکیلیوں کی طرف مائل ہونے کے بعد وفات پاتے ہیں، ص414"
  es: "Ali ibn Muhammad ibn Yahya muere en Rajab 327 AH después de inclinarse hacia el Akil, pág. 414"
  fr: "Ali ibn Muhammad ibn Yahya meurt en Rajab 327 AH après s'être penché vers l'Akil, p. 414"
  tr: "Ali ibn Muhammed ibn Yahya, Akiliyyin'e yönelmesinin ardından Hicri 327 yılının Receb ayında vefat etmiştir (s. 414)."
  id: "Ali bin Muhammad bin Yahya wafat pada bulan Rajab tahun 327 Hijriah setelah condong kepada Akiliyyin, hlm. 414"
summary:
  ar: "يموت علي بن محمد بن يحيى بن الحسين يوم الأربعاء لست ليال باقية من رجب سنة 327هـ بعلة أصابته، وكان قد مال إلى الأكيليين على ابن عمه."
  en: "Ali ibn Muhammad ibn Yahya ibn al-Husayn dies of an illness on Wednesday, six nights before the end of Rajab 327 AH. He had leaned toward the Akil against his cousin."
  ur: "علی بن محمد بن یحییٰ بن الحسین رجب 327ھ کی آخری چھ راتیں باقی ہونے پر بدھ کے دن ایک بیماری سے وفات پاتے ہیں۔ وہ اکیلیوں کی طرف اپنے چچازاد کے مقابلے میں مائل ہو گئے تھے۔"
  es: "Ali ibn Muhammad ibn Yahya ibn al-Husayn falleció el miércoles, seis noches antes del final de Rajab del año 327 de la Hégira, a causa de una enfermedad. Se había inclinado hacia el Akil junto a su primo."
  fr: "Ali ibn Muhammad ibn Yahya ibn al-Husayn meurt d'une maladie mercredi, six nuits avant la fin du mois de Rajab 327 AH. Il s'était rangé du côté d'Akil contre son cousin."
  tr: "Ali bin Muhammed bin Yahya bin Hüseyin, Hicri 327 yılının Receb ayının bitimine altı gece kala, çarşamba günü bir hastalıktan vefat etti. Kuzenine karşı Akiliyyin'e meyilliydi."
  id: "Ali bin Muhammad bin Yahya bin Al-Hussein wafat pada hari Rabu, enam malam sebelum berakhirnya bulan Rajab 327 H, karena sakit yang dideritanya. Ia cenderung memihak Akiliyyin melawan sepupunya."
