label: { ar: "تغلب ابن رائق ونشوء إمرة الأمراء" }
summary:
  ar: "في سنة أربع وعشرين تغلب محمد بن رائق أمير واسط ونواحيها وحكم على البلاد وبطل أمر الوزارة والدواوين وتولى هو الجميع وكتابه وصارت الأموال تحمل إليه وبطلت بيوت المال وبقي الراضي معه صورة وليس له من الخلافة إلا الاسم، وفي سنة خمس وعشرين صارت البلاد بين خارجي قد نغلب عليها أو عامل لا يحمل مالاً وصاروا مثل ملوك الطوائف ولم يبق بيد الراضي غير بغداد والسواد مع كون يد ابن رائق عليه {cite:tarikh-khulafa-minhaj-1434 p. 605}. وعند ابن الأثير كان ابن رائق بواسط وله البصرة أيضاً فكاتبته الأتراك بعد قتل مرداويج وطلبوا التوبة فلم يقبلوا ما أضاف لهم ابن مقلة من المال فاستدعاهم ابن رائق فساروا إليه وقدم عليهم بجكم {cite:kamil-ibn-al-athir p. 228}"
  en: "In 324 Muhammad ibn Ra'iq, amir of Wasit, prevailed: the vizierate and the diwans lapsed, he and his secretaries held all, the treasuries emptied into his hands, and al-Radi remained a figure — 'nothing of the caliphate but the name'. By 325 the provinces were held by rebels or revenue-less governors 'like the party-kings', and nothing was left to the caliph but Baghdad and the Sawad {cite:tarikh-khulafa-minhaj-1434 p. 605}."
