label: { ar: "تغلب ابن رائق ونشوء إمرة الأمراء", en: "Ibn Ra'iq's ascendancy and the rise of the amir al-umara", es: "El ascenso de Ibn Ra'iq y el surgimiento del emir al-umara", fr: "L'ascension d'Ibn Ra'iq et l'avènement de l'émir al-umara", ur: "ابن رقیق کا عروج اور امیر العمرہ کا عروج", tr: "İbn Ra'ık'ın zaferi ve Emirler Emirliği'nin yükselişi", id: "Kemenangan Ibn Ra'iq dan munculnya Emirat Para Emir" }
summary:
  ar: "في سنة أربع وعشرين تغلب محمد بن رائق أمير واسط ونواحيها وحكم على البلاد وبطل أمر الوزارة والدواوين وتولى هو الجميع وكتابه وصارت الأموال تحمل إليه وبطلت بيوت المال وبقي الراضي معه صورة وليس له من الخلافة إلا الاسم، وفي سنة خمس وعشرين صارت البلاد بين خارجي قد نغلب عليها أو عامل لا يحمل مالاً وصاروا مثل ملوك الطوائف ولم يبق بيد الراضي غير بغداد والسواد مع كون يد ابن رائق عليه {cite:tarikh-khulafa-minhaj-1434 p. 605}. وعند ابن الأثير كان ابن رائق بواسط وله البصرة أيضاً فكاتبته الأتراك بعد قتل مرداويج وطلبوا التوبة فلم يقبلوا ما أضاف لهم ابن مقلة من المال فاستدعاهم ابن رائق فساروا إليه وقدم عليهم بجكم {cite:kamil-ibn-al-athir p. 228}"
  en: "In 324 Muhammad ibn Ra'iq, amir of Wasit, prevailed: the vizierate and the diwans lapsed, he and his secretaries held all, the treasuries emptied into his hands, and al-Radi remained a figure — 'nothing of the caliphate but the name'. By 325 the provinces were held by rebels or revenue-less governors 'like the party-kings', and nothing was left to the caliph but Baghdad and the Sawad {cite:tarikh-khulafa-minhaj-1434 p. 605}."
  es: "En 324, Muhammad ibn Ra'iq, emir de Wasit, se impuso: el visirato y los diwanes quedaron disueltos, él y sus secretarios lo controlaron todo, los tesoros se vaciaron en sus manos y al-Radi se convirtió en una figura decorativa: «nada del califato salvo el nombre». Para 325, las provincias estaban en manos de rebeldes o gobernadores sin ingresos, «como los reyes partidistas», y al califa solo le quedaba Bagdad y el Sawad {cite:tarikh-khulafa-minhaj-1434 p. 605}."
  fr: "En 324, Muhammad ibn Ra'iq, émir de Wasit, s'imposa: le vizirat et les diwans furent abolis, lui et ses secrétaires contrôlèrent tout, les trésors furent vidés entre ses mains, et al-Radi ne conserva plus qu'une figure symbolique – « le califat n'en ayant plus que le nom ». Dès 325, les provinces étaient aux mains de rebelles ou de gouverneurs sans ressources, « à l'instar des rois partisans », et il ne restait plus au calife que Bagdad et le Sawad (voir: Tarikh-Khulafa-Minhaj-1434, p. 605)."
  ur: "324 میں وسط کا امیر محمد بن رقیق غالب آیا: وزیر اور دیوان ختم ہو گئے، اس نے اور اس کے سیکرٹریوں نے سب کچھ اپنے قبضے میں لے لیا، خزانے اس کے ہاتھ میں ہو گئے، اور الرعدی ایک شخصیت بن کر رہ گئے - 'خلافت کا کچھ نہیں سوائے نام کے'۔ 325 تک صوبے باغیوں یا کم آمدنی والے گورنروں کے پاس 'جماعتی بادشاہوں کی طرح' تھے، اور خلیفہ کے پاس سوائے بغداد اور سواد کے کچھ نہیں بچا تھا۔ 605}۔"
  tr: "1424 yılında, Wasit ve çevresinin emiri Muhammed ibn Ra'iq iktidarı ele geçirdi ve ülkeyi yönetmeye başladı. Bakanlık ve idari makamlar feshedildi ve her şeyi, katipleriyle birlikte, o devraldı. Ona fonlar gönderildi ve hazineler kaldırıldı. El-Radi, sadece halife unvanına sahip bir figür olarak görevine devam etti. 1425 yılında, topraklar kontrolü ele geçiren isyancılar ve gelir getirmeyen valiler arasında bölündü. Onlar küçük krallar gibi oldular ve El-Radi sadece Bağdat ve Sawad'ın kontrolünü elinde tuttu, ancak İbn Ra'iq buralarda da etkiliydi. {cite:tarikh-khulafa-minhaj-1434 s. 605}. İbn el-Athir'e göre, İbn Ra'iq Wasit'teydi ve ayrıca Basra'yı da elinde tutuyordu. Türkler, Mardavij'in öldürülmesinden sonra ona mektup yazarak tövbe etmesini istediler, ancak İbn Muqla'nın onlara teklif ettiği parayı reddetti. Bunun üzerine İbn Ra'ık onları çağırdı ve onlar da ona geldiler. İbn Ra'ık onlara Bajkam'ı sundu. {cite:kamil-ibn-al-athir s. 228}"
  id: "Pada tahun 1424, Muhammad ibn Ra'iq, emir Wasit dan daerah sekitarnya, merebut kekuasaan dan memerintah wilayah tersebut. Kementerian dan kantor administrasi dibubarkan, dan ia mengambil alih segalanya, bersama dengan para juru tulisnya. Dana dikirim kepadanya, dan perbendaharaan dihapuskan. Al-Radi tetap berada di posisinya sebagai simbol, hanya menyandang gelar Khalifah. Pada tahun 1425, wilayah tersebut dibagi antara pemberontak yang telah menguasai wilayah dan gubernur yang tidak membawa dana. Mereka menjadi seperti raja-raja kecil, dan al-Radi hanya mempertahankan kendali atas Baghdad dan Sawad, meskipun Ibn Ra'iq tetap berkuasa atas wilayah tersebut. {cite:tarikh-khulafa-minhaj-1434 p. 605}. Menurut Ibn al-Athir, Ibn Ra'iq berada di Wasit dan juga menguasai Basra. Orang-orang Turki menulis surat kepadanya setelah pembunuhan Mardavij dan meminta pertobatan, tetapi dia menolak uang yang ditawarkan Ibn Muqla kepada mereka. Maka Ibn Ra'iq memanggil mereka, dan mereka datang kepadanya. Dia mempersembahkan Bajkam kepada mereka. {cite:kamil-ibn-al-athir p. 228}"
