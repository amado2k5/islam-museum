  id: "Berdasarkan bukunya, tampaknya al-Maqdisi melakukan perjalanan ke Aleppo, kemungkinan besar antara tahun 354 dan 364 H / 965 dan 975 M {cite:encyclopaedia-of-islam-2 vol. 7 p. 544}."
