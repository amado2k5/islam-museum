id: event/ghurid-multan-571
class: event
kind: conquest
label: { ar: "استخلاص معز الدين الغوري الملتان من أيدي القرامطة", en: "Mu'izz al-Din wrests Multan from the Qarmatians" }
summary:
  ar: "في حملته الأولى إلى الهند قاد معز الدين محمد بن سام الغوري جيشه سنة ٥٧١هـ/١١٧٥م فأخرج الحكام الإسماعيليين من الملتان ووضع عليها والياً من أهل السنة وافتتح أوج {cite:encyclopaedia-of-islam-2 vol. 7 p. 461}. وتذكر المعارف في موضع آخر أنه فتح المدينة سنة ٥٧٠هـ/١١٧٤-١١٧٥م و«استخلص ملتان من أيدي الكرامطة» كما يقول الجوزجاني {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  en: "On his first Indian expedition, in 571/1175, Mu'izz al-Din Muhammad ibn Sam of Ghur drove out the Ismaili rulers of Multan, installed an orthodox governor over the province and captured Uch {cite:encyclopaedia-of-islam-2 vol. 7 p. 461}. Elsewhere the Encyclopaedia dates the conquest 570/1174-5 and quotes Juzjani: he 'extracted Multan from the hands of the Karmatis' {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  ur: "اپنی پہلی ہندوستانی مہم میں معز الدین محمد بن سام غوری نے 571ھ/1175ء میں ملتان کے اسماعیلی حکمرانوں کو بے دخل کیا، صوبے پر ایک سنی والی مقرر کیا اور اُچ فتح کی {cite:encyclopaedia-of-islam-2 vol. 7 p. 461}۔ جایی مضامین میں یہ فتح 570ھ/1174-75ء درج ہے اور جوزجانی کے لفظوں میں اس نے «ملتان کو کرامطہ کے ہاتھ سے نکالا» {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}۔"
