id: event/abu-al-qasim-lets-himself-down-from-shibam-and-is-brought-back-291
class: event
kind: other
label:
  ar: محاولة أبي القاسم الخروج من شبام بالتدلي بالعمامة وردّه إليها، 291هـ
  en: Abu al-Qasim's attempt to leave Shibam by being let down on a turban and his being turned back, 291 AH
  ur: ابو القاسم کی پگڑی کے ذریعے شبام سے نکلنے کی کوشش اور ان کی واپسی، 291ھ
summary:
  ar: يتحاذر أبو القاسم بعض الأمور فيرسل خولانيين ينظران الطريق، ويأمر أن يُخرج فرس ويوقف على الطريق، فيخرجون ليلاً من فوق السور متدلّين بعمامة، ولا يجدون صاحب الفرس، فيلقاهم قوم على الطريق فيردونهم إلى شبام حيث يلقون عبد القاهر بن أبي الخير.
  en: Abu al-Qasim, wary of certain matters, sends two Khawlanis to look at the road and orders a horse to be brought out and held on the road; at night they go out lowered by a turban, do not find the keeper of the horse, and men on the road turn them back to Shibam, where they meet Abd al-Qahir ibn Abi al-Khayr.
  ur: ابو القاسم بعض باتوں سے خبردار ہو کر دو خولانیوں کو راستہ دیکھنے بھیجتے ہیں اور حکم دیتے ہیں کہ ایک گھوڑا نکال کر راستے میں کھڑا کیا جائے؛ رات کو وہ پگڑی کے ذریعے لٹک کر نکلتے ہیں، گھوڑے والے کو نہیں پاتے، راستے پر کچھ لوگ انہیں شبام لوٹا دیتے ہیں جہاں انہیں عبد القاہر بن ابی الخیر ملتا ہے۔
