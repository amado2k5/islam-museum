label: { ar: "فتح طليطلة", en: "The Conquest of Toledo" }
summary:
  ar: "في سنة ثلاث وتسعين عزل موسى بن نصير طارق بن زياد عن الأندلس ووجهه إلى مدينة طليطلة {cite:tabari-tarikh-abu-al-fadl j.6 p.481}. وعند البلاذري: كتب موسى بن نصير إلى طارق بن زياد كتاباً غليظاً لتغريره بالمسلمين وافتتانه عليه بالرأي في غزوه وأمر أن لا يجاوز قرطبة وسار موسى إلى قرطبة من الأندلس فترضّاه طارق فرضي عنه فافتتح طارق مدينة طليطلة وهي مدينة مملكة الأندلس وهي مما يلي فرنجة وأصاب بها مائدة عظيمة أهداها موسى بن نصير إلى الوليد بن عبد الملك بدمشق حين قفل سنة ست وتسعين والوليد مريض. وذكر بعض كتب التاريخ أنه وجد في طليطلة حين فتحت من الذخائر ما لا يحصى فمن ذلك مائة وسبعون تاجاً من الذهب الأحمر مرصعة بالدر وأصناف الحجارة الثمينة وألف سيف ملوكي ومن الدر والياقوت أكيال ومائدة سليمان {cite:nafh-tib-maqqari p. 325}."
  en: "In the year 93 Musa dismissed Tariq and sent him against Toledo {cite:tabari-tarikh-abu-al-fadl j.6 p.481}. In al-Baladhuri: Musa ibn Nusayr wrote Tariq ibn Ziyad a harsh letter — for his hazarding the Muslims and presuming on his own judgment in the raid — ordering him not to pass Cordoba; Musa marched to Cordoba of al-Andalus, Tariq appeased him and he was pleased, and Tariq opened the city of Toledo — the kingdom-city of al-Andalus on the Franks' side — seizing there a great table which Musa ibn Nusayr presented to al-Walid ibn Abd al-Malik at Damascus when he returned in year 96, al-Walid being ill."
