  ur: "1511 میں ملاکا پر قبضے کے لیے ڈرافٹ کارڈ، البوکرک کا پرتگالیوں کا مسلم سلطنت کے دارالحکومت پر قبضہ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1511 yılında Portekizlilerin Afonso de Albuquerque önderliğinde Müslüman Sultanlığın başkentini ele geçirmesiyle ilgili ön bilgiler; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan awal tentang jatuhnya Malaga pada tahun 1511 M, ketika Portugis merebut ibu kota Kesultanan Muslim di bawah Afonso de Albuquerque; sumber-sumber yang tercantum di halaman ini belum ditinjau."
