summary:
  ar: "بطاقة أولية لسقوط ملقا سنة ١٥١١م، أخذ البرتغاليين لعاصمة السلطنة المسلمة تحت ألفونسو دي ألبوكيرك؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the capture of Malacca in 1511, Albuquerque's Portuguese seizure of the Muslim sultanate's capital; its sources are not yet checked on the page."
