label:
  ar: "النووي يكمل «تحرير ألفاظ التنبيه»، ٦٧١هـ/١٢٧٢-١٢٧٣م"
  en: "Al-Nawawi completes al-Tahrir fi alfaz al-Tanbih, 671/1272-73"
  ur: "نووی کی «تحریر الفاظ التنبیہ» کی تکمیل، 671ھ/1272-73ء"
  es: "Al-Nawawi completa al-Tahrir fi alfaz al-Tanbih, 671/1272-73"
  fr: "Al-Nawawi achève al-Tahrir fi alfaz al-Tanbih, 671/1272-73"
  tr: "El-Nawawi, “Nasihat Sözlerinin Derlenmesi” adlı eserini 671 Hicri/1272-1273 Miladi yılında tamamladı."
  id: "Al-Nawawi menyelesaikan “Penyuntingan Kata-kata Peringatan”, 671 H/1272-1273 M"
summary:
  ar: "أتم النووي سنة ٦٧١هـ/١٢٧٢-١٢٧٣م كتابه «التحرير في ألفاظ التنبيه»، وهو مع «العمدة في تصحيح التنبيه» من أوائل ما صنّف؛ ويدخل الكتاب في دراساته اللغوية التي أفضت أيضاً إلى «تهذيب الأسماء واللغات» {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 356}."
  en: "In 671/1272-73 al-Nawawi completed al-Tahrir fi alfaz al-Tanbih, counted with al-Umda fi tashih al-Tanbih among the earliest of his works; it belongs to the linguistic studies that also produced the Tahdhib al-asma' wal-lughat {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 356}."
  ur: "671ھ/1272-73ء میں نووی نے تحریر الفاظ التنبیہ مکمل کی جو العمدہ فی تصحیح التنبیہ کے ساتھ ان کی ابتدائی تصانیف میں شمار ہوتی ہے؛ یہ ان کے لغوی مطالعات کا حصہ ہے جن کا دوسرا ثمرہ تہذیب الاسماء واللغات ہے {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 356}۔"
  es: "En 671/1272-73 al-Nawawi completó al-Tahrir fi alfaz al-Tanbih, que se cuenta junto con al-Umda fi tashih al-Tanbih entre sus primeras obras; pertenece a los estudios lingüísticos que también produjeron el Tahdhib al-asma' wal-lughat {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 356}."
  fr: "En 671/1272-73, al-Nawawi acheva al-Tahrir fi alfaz al-Tanbih, qui compte avec al-Umda fi tashih al-Tanbih parmi ses premières œuvres; elle appartient aux études linguistiques qui ont également produit le Tahdhib al-asma' wal-lughat {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 356}."
  tr: "Hicri 671/Miladi 1272-1273 yılında El-Nawawi, “El-Tahrir fi Alfaz Al-Tanbih” adlı eserini tamamladı. Bu eser, “El-Umdah fi Tasheeh Al-Tanbih” ile birlikte, yazdığı en eski eserler arasındadır. Kitap, “Tahdheeb Al-Asma’ wa Al-Lughat” adlı eserine de yol açan dilbilim çalışmaları kapsamındadır. {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 356}"
  id: "Pada tahun 671 H/1272-1273 M, Al-Nawawi menyelesaikan bukunya “Al-Tahrir fi Alfaz Al-Tanbih”, yang bersama dengan “Al-Umdah fi Tasheeh Al-Tanbih”, termasuk di antara karya-karya awal yang ia tulis. Buku ini termasuk dalam studi linguistiknya, yang juga menghasilkan “Tahdheeb Al-Asma’ wa Al-Lughat” {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:shadharat-dhahab p. 356}."
