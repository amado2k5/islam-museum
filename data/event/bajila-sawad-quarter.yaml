label: { ar: "ربع بجيلة من السواد وردّه", en: "Bajila's Quarter of the Sawad and Its Return" }
summary:
  ar: "عند البلاذري عن قيس بن أبي حازم: كانت بجيلة ربع الناس يوم القادسية وكان عمر جعل لهم ربع السواد فلما وفد عليه جرير قال لولا أني قاسم مسؤول لكنت على ما جعلت لكم وإني أرى الناس قد كثروا فردوه عليهم ففعل وفعلوا فأجازه عمر بثمانين ديناراً وقيل أربع مائة دينار. قال فقالت امرأة من بجيلة يقال لها أم كرزان أبي هلك وسهمه ثابت في السواد وإني لن أسلم فقال لها يا أم كرزان قومك قد أجابوا فقالت ما أنا بمسلمة أو تحملني على ناقة ذلول عليها قطيفة حمراء وتملأ يديّ ذهباً ففعل ذلك. وعن جرير كان عمر أعطى بجيلة ربع السواد فأخذوه ثلاث سنين. وعن الواقدي عن جُزير بن يزيد بن جرير عن أبيه عن جده إن عمر جعل له ولقومه ربع ما غلبوا عليه من السواد فلما جمت غنائم جلولاء طلب ربعه فكتب سعد إلى عمر يعلمه ذلك فكتب عمر إن شاء جرير أن يكون إنما قاتل وقومه على جعل كجعل المؤلفة قلوبهم فأعطوهم جعلهم وإن كانوا إنما قاتلوا لله واحتسبوا ما عنده فهم من المسلمين لهم ما لهم وعليهم ما عليهم فقال جرير صدق أمير المؤمنين وبر لا حاجة لنا بالربع."
  en: "In al-Baladhuri via Qays ibn Abi Hazim: Bajila were a quarter of the people at al-Qadisiyya, and Umar had granted them a quarter of the Sawad; when Jarir came on delegation Umar said 'were I not an accountable divider I would have kept you on your grant, but the people have grown many — return it to them,' and they did, Umar awarding Jarir eighty dinars — or, it is said, four hundred. A Bajila woman called Umm Kurzan said 'my father died and his share is fixed in the Sawad — I will not submit'; Jarir told her 'your people have agreed,' and she answered 'I will not submit unless you mount me on a docile she-camel with a red saddle-cloth and fill my hands with gold' — which was done. Via Jarir: Umar gave Bajila the Sawad's quarter and they took it three years. Via al-Waqidi from Juzayr ibn Yazid ibn Jarir from his father from his grandfather: Umar had made for him and his people a quarter of what they conquered of the Sawad; when Jalula's spoils piled up Jarir claimed his quarter, Sa'd wrote informing Umar, and Umar wrote back: if Jarir and his people wish to have fought only for a wage like the mu'allafa qulubuhum, give them their wage — but if they fought for God and reckoned on what is with Him, then they are of the Muslims, for them what is for them and on them what is on them. Jarir said: 'the Commander of the Faithful spoke truth and kept faith — we have no need of the quarter.'"
