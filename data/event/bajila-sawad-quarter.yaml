label: { ar: "ربع بجيلة من السواد وردّه", en: "Bajila's Quarter of the Sawad and Its Return", fr: "Le quart du Sawad des Bajila et sa restitution", es: "El barrio de Bajila en Sawad y su regreso", ur: "بجیلہ کا سواد کا کوارٹر اور اس کی واپسی۔" }
summary:
  ar: "عند البلاذري عن قيس بن أبي حازم: كانت بجيلة ربع الناس يوم القادسية وكان عمر جعل لهم ربع السواد فلما وفد عليه جرير قال لولا أني قاسم مسؤول لكنت على ما جعلت لكم وإني أرى الناس قد كثروا فردوه عليهم ففعل وفعلوا فأجازه عمر بثمانين ديناراً وقيل أربع مائة دينار. قال فقالت امرأة من بجيلة يقال لها أم كرزان أبي هلك وسهمه ثابت في السواد وإني لن أسلم فقال لها يا أم كرزان قومك قد أجابوا فقالت ما أنا بمسلمة أو تحملني على ناقة ذلول عليها قطيفة حمراء وتملأ يديّ ذهباً ففعل ذلك. وعن جرير كان عمر أعطى بجيلة ربع السواد فأخذوه ثلاث سنين. وعن الواقدي عن جُزير بن يزيد بن جرير عن أبيه عن جده إن عمر جعل له ولقومه ربع ما غلبوا عليه من السواد فلما جمت غنائم جلولاء طلب ربعه فكتب سعد إلى عمر يعلمه ذلك فكتب عمر إن شاء جرير أن يكون إنما قاتل وقومه على جعل كجعل المؤلفة قلوبهم فأعطوهم جعلهم وإن كانوا إنما قاتلوا لله واحتسبوا ما عنده فهم من المسلمين لهم ما لهم وعليهم ما عليهم فقال جرير صدق أمير المؤمنين وبر لا حاجة لنا بالربع."
  en: "In al-Baladhuri via Qays ibn Abi Hazim: Bajila were a quarter of the people at al-Qadisiyya, and Umar had granted them a quarter of the Sawad; when Jarir came on delegation Umar said 'were I not an accountable divider I would have kept you on your grant, but the people have grown many — return it to them,' and they did, Umar awarding Jarir eighty dinars — or, it is said, four hundred. A Bajila woman called Umm Kurzan said 'my father died and his share is fixed in the Sawad — I will not submit'; Jarir told her 'your people have agreed,' and she answered 'I will not submit unless you mount me on a docile she-camel with a red saddle-cloth and fill my hands with gold' — which was done. Via Jarir: Umar gave Bajila the Sawad's quarter and they took it three years. Via al-Waqidi from Juzayr ibn Yazid ibn Jarir from his father from his grandfather: Umar had made for him and his people a quarter of what they conquered of the Sawad; when Jalula's spoils piled up Jarir claimed his quarter, Sa'd wrote informing Umar, and Umar wrote back: if Jarir and his people wish to have fought only for a wage like the mu'allafa qulubuhum, give them their wage — but if they fought for God and reckoned on what is with Him, then they are of the Muslims, for them what is for them and on them what is on them. Jarir said: 'the Commander of the Faithful spoke truth and kept faith — we have no need of the quarter.'"
  fr: "Chez al-Baladhuri, par Qays ibn Abi Hazim : les Bajila formaient le quart des gens à al-Qadisiyya, et Umar leur avait accordé le quart du Sawad ; quand Jarir vint en délégation, Umar dit « si je n'étais un répartiteur responsable, je vous aurais laissés à votre concession, mais les gens sont devenus nombreux : rendez-la-leur », et ils le firent, Umar accordant à Jarir quatre-vingts dinars, ou, dit-on, quatre cents. Une femme des Bajila appelée Umm Kurzan dit « mon père est mort et sa part est fixée dans le Sawad : je ne céderai pas » ; Jarir lui dit « ton peuple a accepté », et elle répondit « je ne céderai que si tu me fais monter sur une chamelle docile avec une housse rouge et que tu me remplis les mains d'or », ce qui fut fait. Par Jarir : Umar donna aux Bajila le quart du Sawad et ils le prirent trois ans. Par al-Waqidi, de Juzayr ibn Yazid ibn Jarir, de son père, de son grand-père : Umar avait fait pour lui et son peuple un quart de ce qu'ils conquerraient du Sawad ; quand le butin de Jalula s'accumula, Jarir réclama son quart, Sa'd écrivit pour en informer Umar, et Umar répondit : si Jarir et son peuple veulent n'avoir combattu que pour un salaire, comme les mu'allafa qulubuhum, donnez-leur leur salaire ; mais s'ils ont combattu pour Dieu en comptant sur ce qui est auprès de Lui, alors ils sont des musulmans, à eux ce qui leur revient et sur eux ce qui leur incombe. Jarir dit : « le Commandeur des croyants a dit vrai et a tenu parole : nous n'avons pas besoin du quart. »"
  es: "En al-Baladhuri, a través de Qays ibn Abi Hazim: Los bajilas eran una cuarta parte de la gente de al-Qadisiyya, y Umar les había concedido una cuarta parte del Sawad; cuando Jarir llegó en delegación, Umar dijo: «Si no fuera un repartidor responsable, os habría mantenido en vuestra concesión, pero la gente ha crecido mucho; devolvedla», y así lo hicieron, y Umar le concedió a Jarir ochenta dinares —o, según se dice, cuatrocientos. Una mujer bajila llamada Umm Kurzan dijo: «Mi padre murió y su parte está fijada en el Sawad; no me someteré»; Jarir le dijo: «Tu gente ha aceptado», y ella respondió: «No me someteré a menos que me montes en una camella dócil con una manta roja y me llenes las manos de oro», lo cual se hizo. Según Jarir: Umar dio a los bajilas la cuarta parte del Sawad y la tomaron durante tres años. Según al-Waqidi, de Juzayr ibn Yazid ibn Jarir, de su padre, de su abuelo: Umar les había asignado a él y a su gente una cuarta parte de lo conquistado de Sawad. Cuando el botín de Jalula se acumuló, Jarir reclamó su parte. Sa'd le escribió a Umar, quien respondió: «Si Jarir y su gente solo querían haber luchado por una recompensa como la mu'allafa qulubuhum, dales su recompensa; pero si lucharon por Dios y confiaron en lo que está con Él, entonces son musulmanes, para ellos lo que es para ellos y sobre ellos lo que es sobre ellos». Jarir dijo: «El Comandante de los Creyentes dijo la verdad y mantuvo la fe; no necesitamos la cuarta parte»."
  ur: "بلادوری میں بذریعہ قیس ابن ابی حازم ہے: بجیلہ القدسیہ میں ایک چوتھائی لوگ تھے، اور عمر نے انہیں سواد کا ایک چوتھائی عطا کیا تھا۔ جب جریر وفد میں آیا تو عمر نے کہا کہ اگر میں جوابدہ تقسیم کرنے والا نہ ہوتا تو میں آپ کو آپ کے عطیہ پر رکھتا، لیکن لوگ بہت بڑھ گئے ہیں، انہیں واپس کر دیں، اور انہوں نے ایسا ہی کیا، عمر نے جریر کو اسّی دینار یا کہا جاتا ہے کہ چار سو کا انعام دیا۔ ام کرزان نامی ایک بجیلہ عورت نے کہا کہ میرے والد کا انتقال ہو گیا ہے اور ان کا حصہ سواد میں مقرر ہے - میں عرض نہیں کروں گا۔ جریر نے اس سے کہا 'تمہاری قوم راضی ہو گئی ہے'، اور اس نے جواب دیا 'میں اس وقت تک تسلیم نہیں کروں گا جب تک کہ تم مجھے سرخ کاٹھی والی اونٹنی پر سوار نہ کرو اور میرے ہاتھوں کو سونے سے نہ بھرو' - جو کیا گیا۔ جریر کے ذریعے: عمر نے بجیلہ کو سواد کا چوتھائی حصہ دیا اور وہ اسے تین سال لے گئے۔ واقدی سے جوزیر بن یزید بن جریر اپنے والد سے اپنے دادا سے: عمر نے ان کے اور ان کی قوم کے لیے سواد کی فتح کا چوتھائی حصہ مقرر کیا تھا۔ جب جلولہ کا مال غنیمت جمع ہو گیا تو جریر نے اپنی چوتھائی کا دعویٰ کیا، سعد نے عمر کو اطلاع دیتے ہوئے لکھا، اور عمر نے جواب میں لکھا: اگر جریر اور ان کی قوم صرف مفعولہ قلوبہم جیسی اجرت کے لیے لڑنا چاہتے ہیں تو ان کو ان کی اجرت دے دیں- لیکن اگر وہ خدا کے لیے لڑیں اور اس بات کا حساب لیں کہ جو کچھ ان کے لیے ہے، وہ ان کے لیے ہے اور ان کے لیے کیا ہے؟ انہیں جریر نے کہا: 'وفاداروں کے کمانڈر نے سچ کہا اور ایمان رکھا - ہمیں اس سہ ماہی کی کوئی ضرورت نہیں ہے۔'"
