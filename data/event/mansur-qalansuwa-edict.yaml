id: event/mansur-qalansuwa-edict
class: event
kind: law-enacted
label: { ar: "إلزام المنصور بالقلانس الطوال", en: "al-Mansur Orders the Tall Qalansuwa Caps", es: "Al-Mansur encarga las gorras altas de Qalansuwa.", fr: "al-Mansur commande les grands chapeaux Qalansuwa", ur: "المنصور نے قد قلانسوا ٹوپیوں کا حکم دیا۔" }
summary:
  ar: "في سنة ثلاث وخمسين ومئة ألزم المنصور رعيته بلبس القلانس الطوال فكانوا يعملونها بالقصب والورق ويلبسونها السواد فقال أبو دلامة وكنا نرجي من إمام زيادة فزاد الإمام المصطفى في القلانس تراها على هام الرجال كأنها دنان يهود جللت بالبرانس {cite:tarikh-khulafa-minhaj-1434 p. 426}."
  en: "In year 153 al-Mansur obliged his subjects to wear the tall qalansuwa, which they fashioned from reeds and paper and wore in black; Abu Dulama quipped: 'We hoped our imam would add more — and the chosen imam added to the qalansuwas; you see them on men's heads like Jews' money-boxes cloaked in burnooses' {cite:tarikh-khulafa-minhaj-1434 p. 426}."
  es: "En el año 153, al-Mansur obligó a sus súbditos a usar el alto qalansuwa, que fabricaban con cañas y papel y vestían de negro; Abu Dulama bromeó: «Esperábamos que nuestro imán añadiera más, y el imán elegido añadió más qalansuwas; las veis en las cabezas de los hombres como huchas judías cubiertas de burnús» {cite:tarikh-khulafa-minhaj-1434 p. 426}."
  fr: "En l'an 153, al-Mansur obligea ses sujets à porter la haute qalansuwa, qu'ils confectionnaient à partir de roseaux et de papier et portaient en noir; Abu Dulama plaisanta: « Nous espérions que notre imam en ajouterait d'autres — et l'imam choisi a ajouté aux qalansuwas; vous les voyez sur la tête des hommes comme des tirelires juives recouvertes de burnous » {cite: tarikh-khulafa-minhaj-1434 p. 426}."
  ur: "سال 153 میں المنصور نے اپنی رعایا کو لمبا قلانسوا پہننے کا پابند کیا، جسے انہوں نے سرکنڈوں اور کاغذوں سے بنایا اور سیاہ لباس پہنا۔ ابو دلمہ نے طنز کیا: 'ہمیں امید تھی کہ ہمارا امام مزید اضافہ کرے گا - اور منتخب امام نے قلانسویوں میں اضافہ کیا۔ آپ انہیں مردوں کے سروں پر یہودیوں کے پیسوں کے ڈبوں کی طرح برنوز میں لپٹے ہوئے دیکھتے ہیں۔ 426}۔"
