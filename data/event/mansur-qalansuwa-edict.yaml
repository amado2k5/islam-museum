summary:
  ar: "في سنة ثلاث وخمسين ومئة ألزم المنصور رعيته بلبس القلانس الطوال فكانوا يعملونها بالقصب والورق ويلبسونها السواد فقال أبو دلامة وكنا نرجي من إمام زيادة فزاد الإمام المصطفى في القلانس تراها على هام الرجال كأنها دنان يهود جللت بالبرانس {cite:tarikh-khulafa-minhaj-1434 p. 426}."
  en: "In year 153 al-Mansur obliged his subjects to wear the tall qalansuwa, which they fashioned from reeds and paper and wore in black; Abu Dulama quipped: 'We hoped our imam would add more — and the chosen imam added to the qalansuwas; you see them on men's heads like Jews' money-boxes cloaked in burnooses' {cite:tarikh-khulafa-minhaj-1434 p. 426}."
