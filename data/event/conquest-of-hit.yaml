label: { ar: "فتح هيت وحصون الفرات", en: "The Conquest of Hit and the Euphrates Forts", es: "La conquista de Hit y las fortalezas del Éufrates", fr: "La conquête de Hit et des forts de l'Euphrate", ur: "ہٹ اور فرات کے قلعوں کی فتح", tr: "Hit ve Fırat kalelerinin fethi", id: "Penaklukan Hit dan benteng-benteng Efrat" }
summary:
  ar: "عند البلاذري عن أبي أيوب المؤدب الرقي عن علي بن عبد الله القرقساني عن أشياخه: عمير بن سعد لما فتح رأس العين سلك الخابور وما يليه حتى أتى قرقيسيا وقد نقض أهلها فصالحهم على مثل صلحهم الأول ثم أتى حصون الفرات حصناً حصناً ففتحها على ما فتحت عليه قرقيسيا ولم يلق في شيء منها كثير قتال وكان بعض أهلها ربما رموا بالحجارة، فلما فرغ من تلبس وعانات أتى النأوسة واللوسة وهيت فوجد عمار بن ياسر — وهو يومئذ عامل عمر على الكوفة — قد بعث جيشاً يستغزي ما فوق الأنبار عليه سعد بن عمرو بن حرام الأنصاري وقد أتاه أهل هذه الحصون فطلبوا الأمان فأمنهم واستثنى على أهل هيت نصف كنيستهم فانصرف عمير إلى الرقة؛ وقال بعض أهل العلم كان الذي توجه إلى هيت والحصون التي بعدها من الكوفة مذلاج بن عمرو السلمي حليف بني عبد شمس وله صحبة فتولى فتحها وهو بنا الحديثة التي على الفرات وولده بهيت وكان منهم رجل يكنى أبا هارون باقي الذكر هناك — ويقال إن مذلاجاً كان من قبل سعد بن عمرو بن حرام والله أعلم."
  en: "In al-Baladhuri through Abu Ayyub the Raqqa tutor from Ali ibn Abdullah al-Qarqisani from his shaykhs: Umayr ibn Sa'd, after taking Ra's al-Ayn, worked the Khabur and its reaches until he came to Qarqisiya — whose people had broken faith — re-compounding with them on their first treaty, then took the Euphrates forts one by one on Qarqisiya's terms with little fighting, some throwing stones; finishing with Talbus and Anat he reached al-Na'usa, al-Lusa and Hit, where he found that Ammar ibn Yasir — then Umar's governor of Kufa — had sent an army raiding above al-Anbar under Sa'd ibn Amr ibn Haram al-Ansari, and the people of these forts had come to him seeking aman, which he granted, reserving half of Hit's church — whereupon Umayr returned to al-Raqqa; some scholars say the one who went against Hit and the forts beyond from Kufa was Midlaj ibn Amr al-Sulami, a confederate of Banu Abd Shams and a man of companionship, who took it and built al-Haditha on the Euphrates, his descendants at Hit including a man known as Abu Harun still remembered there — or, it is said, Midlaj acted under Sa'd ibn Amr ibn Haram; God knows best."
  es: "En al-Baladhuri a través de Abu Ayyub el tutor de Raqqa de Ali ibn Abdullah al-Qarqisani de sus shaykhs: Umayr ibn Sa'd, después de tomar Ra's al-Ayn, trabajó el Khabur y sus alrededores hasta que llegó a Qarqisiya —cuyo pueblo había roto la fe— reconciliándose con ellos en su primer tratado, luego tomó las fortalezas del Éufrates una por una en los términos de Qarqisiya con poca lucha, algunos lanzando piedras; terminando con Talbus y Anat llegó a al-Na'usa, al-Lusa y Hit, donde encontró que Ammar ibn Yasir —entonces gobernador de Kufa por Umar— había enviado un ejército a saquear por encima de al-Anbar bajo el mando de Sa'd ibn Amr ibn Haram al-Ansari, y la gente de estas fortalezas había venido a él pidiendo aman, que él concedió, reservando la mitad de la iglesia de Hit, tras lo cual Umayr regresó a al-Raqqa; Algunos estudiosos afirman que quien atacó Hit y las fortalezas más allá de Kufa fue Midlaj ibn Amr al-Sulami, un aliado de Banu Abd Shams y hombre de compañía, que la conquistó y construyó al-Haditha en el Éufrates. Sus descendientes en Hit, entre ellos un hombre conocido como Abu Harun, aún son recordados allí. O bien, se dice que Midlaj actuó bajo las órdenes de Sa'd ibn Amr ibn Haram; Dios sabe mejor."
  fr: "Dans al-Baladhuri, par l'intermédiaire d'Abu Ayyub, le tuteur de Raqqa, d'après Ali ibn Abdullah al-Qarqisani, d'après ses cheikhs: Umayr ibn Sa'd, après avoir pris Ra's al-Ayn, travailla sur le Khabur et ses affluents jusqu'à ce qu'il arrive à Qarqisiya — dont les habitants avaient rompu leur foi — renouvelant avec eux leur premier traité, puis prit les forts de l'Euphrate un par un aux conditions de Qarqisiya avec peu de combats, certains jetant des pierres; terminant par Talbus et Anat, il atteignit al-Na'usa, al-Lusa et Hit, où il découvrit qu'Ammar ibn Yasir — alors gouverneur d'Umar à Kufa — avait envoyé une armée piller au-dessus d'al-Anbar sous le commandement de Sa'd ibn Amr ibn Haram al-Ansari, et que les habitants de ces forts étaient venus le trouver pour demander l'aman, qu'il leur accorda, réservant la moitié de l'église de Hit — après quoi Umayr retourna à al-Raqqa; Certains érudits affirment que celui qui s'est attaqué à Hit et aux forteresses situées au-delà de Kufa était Midlaj ibn Amr al-Sulami, un confédéré des Banu Abd Shams et un homme de la confrérie, qui s'en est emparé et a construit al-Haditha sur l'Euphrate, ses descendants à Hit, dont un homme connu sous le nom d'Abu Harun, étant encore commémoré là-bas — ou, dit-on, Midlaj a agi sous les ordres de Sa'd ibn Amr ibn Haram; Dieu est le plus savant."
  ur: "البلادوری میں ابو ایوب کے ذریعے رقہ کے استاد علی بن عبداللہ القرقیسانی سے اپنے شیوخ سے مروی ہے: عمیر بن سعد نے راس العین لینے کے بعد خبور اور اس کی رسائ کا کام کیا یہاں تک کہ وہ قرقیسہ پہنچے - جن کے لوگوں کا عقیدہ ٹوٹ چکا تھا - ان کے ساتھ دوبارہ سمجھوتہ کیا، پھر ایک معاہدہ ایہرہ پر ہوا۔ قرقیسیہ کی شرائط تھوڑی لڑائی، کچھ پتھر پھینکنے کے ساتھ؛ تلبس اور عنات سے فارغ ہو کر وہ النوعہ، لوصہ اور ہٹ پہنچا، جہاں اس نے دیکھا کہ عمار بن یاسر نے جو اس وقت عمر کے کوفہ کے گورنر تھے، نے سعد بن عمرو بن حرام الانصاری کی قیادت میں الانبار پر چڑھائی کرنے والی فوج بھیجی تھی، اور ان قلعوں کے لوگ اس کی تلاش میں آدھے قلعوں کی تلاش میں آ گئے تھے، ہٹز چرچ - جس کے بعد عمیر الرقہ واپس آیا۔ بعض علماء کہتے ہیں کہ جو کوفہ سے ہٹ اور قلعوں سے آگے نکلا وہ مدلج بن عمرو السلمی تھا جو بنو عبد شمس کا حلیف اور صحابی تھا، جس نے اسے لے کر فرات پر الحدیثہ تعمیر کیا، اس کی اولاد میں حط میں ابو ہارون کے نام سے جانا جاتا ایک شخص بھی شامل ہے جسے اب تک عامل کہا جاتا ہے، یا مرثیہ کے تحت اسے یاد کیا جاتا ہے۔ ابن حرام؛ خدا ہی بہتر جانتا ہے۔"
  tr: "El-Baladhuri, Ebu Eyyub el-Mu'addib el-Raqqi'den, o da Ali ibn Abdullah el-Karkasanî'den, o da şeyhlerinden rivayetle şöyle anlatmıştır: Ümeyr ibn Sa'd, Raşü'l-Ayn'ı fethettiğinde, Habur'u ve çevresindekileri takip ederek Karkisiye'ye kadar geldi. Karkisiye halkı antlaşmalarını bozmuştu, bu yüzden onlarla ilk barış antlaşmalarındaki şartlarla barıştı. Sonra Fırat'ın kalelerine, kale kale geldi ve onları da Karkisiye ile aynı şartlarla fethetti. Hiçbirinde fazla çatışmaya girmedi, ancak halklarından bazıları zaman zaman taş attı. Talbis ve Anah'ı bitirdikten sonra el-Nawsah, el-Lawsa ve Hit'e geldi ve o sırada Ömer'in Kufa valisi olan Ammar ibn Yasir'in, Sa'd ibn Amr ibn Haram el-Ensari komutasında Anbar'ın yukarısındaki bölgelere baskın düzenlemek üzere bir ordu gönderdiğini gördü. Bu kalelerin halkı ona gelip güvenlik istediler, o da onlara güvenlik sağladı ve Hit halkı için kiliselerinin yarısını koruma altına aldı. Sonra Ömer Rakka'ya döndü. Bazı âlimler, Kufa'dan Hit'e ve ondan sonraki kalelere gidenin, Beni Abd Şems'in müttefiki olan Madhlaj bin Amr el-Sulami olduğunu ve onlarla birlikte olduğunu söylerler. Oranın fethini üstlendi ve Fırat üzerindeki modern şehri inşa etti; oğlu da Hit'teydi. Aralarında, hatırası orada yaşayan Ebu Harun lakaplı bir adam da vardı. Madhlaj'ın Saad bin Amr bin Haram'dan önce geldiği söylenir, en doğrusunu Allah bilir."
  id: "Al-Baladhuri, berdasarkan riwayat Abu Ayyub al-Mu’addib al-Raqqi, berdasarkan riwayat Ali ibn Abdullah al-Qarqasani, berdasarkan riwayat para syekhnya: Umayr ibn Sa’d, ketika menaklukkan Ras al-Ayn, mengikuti Khabur dan daerah sekitarnya hingga sampai ke Qarqisiya, yang penduduknya telah melanggar perjanjian mereka, sehingga ia berdamai dengan mereka dengan syarat yang sama seperti perjanjian damai pertama mereka. Kemudian ia sampai ke benteng-benteng di Efrat, benteng demi benteng, dan menaklukkannya dengan syarat yang sama seperti di Qarqisiya, dan ia tidak banyak menghadapi pertempuran di benteng-benteng tersebut, meskipun sebagian penduduknya kadang-kadang melempari batu. Setelah menyelesaikan penaklukan Talbis dan Anah, ia datang ke al-Nawsah, al-Lawsa, dan Hit, dan ia mendapati Ammar ibn Yasir—yang saat itu menjabat sebagai gubernur Umar di Kufa—telah mengirimkan pasukan untuk menyerang daerah di atas Anbar, di bawah komando Sa’d ibn Amr ibn Haram al-Ansari. Penduduk benteng-benteng tersebut datang kepadanya dan meminta perlindungan, sehingga ia mengabulkan permintaan mereka dan memberikan pengecualian bagi penduduk Hit untuk setengah dari wilayah gereja mereka. Kemudian Umayr kembali ke Raqqa. Beberapa ulama mengatakan bahwa orang yang pergi ke Hit dan benteng-benteng setelahnya dari Kufa adalah Madhlaj bin Amr al-Sulami, sekutu Banu Abd Shams, dan ia bersekutu dengan mereka. Ia bertanggung jawab atas penaklukan tersebut, dan ia membangun benteng modern di tepi Sungai Eufrat, dan putranya berada di Hit. Di antara mereka ada seorang pria yang dijuluki Abu Harun, yang kenangannya masih tetap ada di sana. Dikatakan bahwa Madhlaj hidup sebelum Saad bin Amr bin Haram, dan Allah Maha Mengetahui."
