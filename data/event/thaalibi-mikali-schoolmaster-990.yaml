id: event/thaalibi-mikali-schoolmaster-990
class: event
kind: other
label:
  ar: "الثعالبي معلّماً ومولياً لآل ميكالة، نحو ٣٨٠هـ"
  en: "Al-Tha'alibi the schoolmaster and his Mikali patrons, c. 380/990"
  ur: "ثعالبی مدرس اور آل میکالہ کے سرپرست، تقریباً 380ھ/990ء"
  es: "Al-Tha'alibi, el maestro de escuela, y sus mecenas Mikali, c. 380/990"
  fr: "Al-Tha'alibi le maître d'école et ses mécènes Mikali, vers 380/990"
  tr: "Al-Tha'alibi, Al-Mikalah ailesinin bir öğretmeni ve hamisiydi, yaklaşık 380 Hicri yılında yaşamıştır."
  id: "Al-Tha'alibi, seorang guru dan pelindung keluarga Al-Mikalah, sekitar tahun 380 Hijriah."
summary:
  ar: "عمل الثعالبي مدة معلّماً للصبيان، ووصل مبكراً بآل ميكالة أشرف بيوت نيسابور، ولا سيما الأديب أبا الفضل عبيد الله بن أحمد الميكالي الذي بقي صديقه مدى حياته، كما وصل بأبي المظفر نصر بن سبكتكين والي خراسان {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}؛ ومن شعره قصيدة المدح إلى الأمير أبي الفضل الميكالي {cite:wafayat-ayan}."
  en: "Al-Tha'alibi worked for a time as a schoolmaster, and early in life forged ties with the Mikalis, Nishapur's foremost family — above all the littérateur Abu al-Fadl Ubayd Allah ibn Ahmad al-Mikali, who remained his lifelong friend — and with Abu al-Muzaffar Nasr ibn Sebuktegin, the governor of Khurasan {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}; his praise poems to the amir Abu al-Fadl al-Mikali survive {cite:wafayat-ayan}."
  ur: "ثعالبی نے کچھ عرصہ بطور مدرس کام کیا اور زندگی کے آغاز میں نیشاپور کے ممتاز گھرانے آل میکالہ سے تعلق قائم کیا — خصوصاً ادیب ابو الفضل عبید اللہ بن احمد میکالی سے جو عمر بھر ان کے دوست رہے — اور خراسان کے گورنر ابو المظفر نصر بن سبکتگین سے بھی {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}؛ امیر ابو الفضل میکالی کی مدح میں ان کی قصائد محفوظ ہیں {cite:wafayat-ayan}۔"
  es: "Al-Tha'alibi trabajó durante un tiempo como maestro de escuela y, desde joven, forjó lazos con los Mikali, la familia más importante de Nishapur —sobre todo con el literato Abu al-Fadl Ubayd Allah ibn Ahmad al-Mikali, quien siguió siendo su amigo de por vida— y con Abu al-Muzaffar Nasr ibn Sebuktegin, gobernador de Khurasan {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}; sus poemas de alabanza al emir Abu al-Fadl al-Mikali se conservan {cite:wafayat-ayan}."
  fr: "Al-Tha'alibi travailla un temps comme maître d'école et, dès son plus jeune âge, forgea des liens avec les Mikalis, la famille la plus importante de Nishapur — et surtout avec le lettré Abu al-Fadl Ubayd Allah ibn Ahmad al-Mikali, qui resta son ami de toujours — et avec Abu al-Muzaffar Nasr ibn Sebuktegin, le gouverneur du Khorasan {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}; ses poèmes de louange à l'émir Abu al-Fadl al-Mikali survivent {cite:wafayat-ayan}."
  tr: "Al-Tha'alibi bir süre erkek çocuklara öğretmenlik yaptı ve Nişapur'un en saygın ailelerinden olan Al-Mikali ailesiyle, özellikle de hayatı boyunca dostu olarak kalan yazar Ebu el-Fadl Ubeyd Allah ibn Ahmed el-Mikali ile erken yaşta bağlantı kurdu. Ayrıca Horasan valisi Ebu el-Muzaffar Nasr ibn Sabuktigin ile de bağlantı kurdu {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}; ve şiirleri arasında Prens Ebu el-Fadl el-Mikali'ye övgü şiiri de bulunmaktadır {cite:wafayat-ayan}."
  id: "Al-Tha’alibi pernah bekerja sebagai guru anak laki-laki, dan sejak awal ia menjalin hubungan dengan keluarga Al-Mikali, keluarga paling terhormat di Nishapur, terutama dengan penulis Abu al-Fadl Ubayd Allah ibn Ahmad al-Mikali, yang tetap menjadi sahabatnya sepanjang hidupnya. Ia juga menjalin hubungan dengan Abu al-Muzaffar Nasr ibn Sabuktigin, gubernur Khorasan {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}; dan di antara puisinya terdapat puisi pujian kepada Pangeran Abu al-Fadl al-Mikali {cite:wafayat-ayan}."
