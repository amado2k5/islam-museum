label:
  ar: "الثعالبي معلّماً ومولياً لآل ميكالة، نحو ٣٨٠هـ"
  en: "Al-Tha'alibi the schoolmaster and his Mikali patrons, c. 380/990"
  ur: "ثعالبی مدرس اور آل میکالہ کے سرپرست، تقریباً 380ھ/990ء"
summary:
  ar: "عمل الثعالبي مدة معلّماً للصبيان، ووصل مبكراً بآل ميكالة أشرف بيوت نيسابور، ولا سيما الأديب أبا الفضل عبيد الله بن أحمد الميكالي الذي بقي صديقه مدى حياته، كما وصل بأبي المظفر نصر بن سبكتكين والي خراسان {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}؛ ومن شعره قصيدة المدح إلى الأمير أبي الفضل الميكالي {cite:wafayat-ayan}."
  en: "Al-Tha'alibi worked for a time as a schoolmaster, and early in life forged ties with the Mikalis, Nishapur's foremost family — above all the littérateur Abu al-Fadl Ubayd Allah ibn Ahmad al-Mikali, who remained his lifelong friend — and with Abu al-Muzaffar Nasr ibn Sebuktegin, the governor of Khurasan {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}; his praise poems to the amir Abu al-Fadl al-Mikali survive {cite:wafayat-ayan}."
  ur: "ثعالبی نے کچھ عرصہ بطور مدرس کام کیا اور زندگی کے آغاز میں نیشاپور کے ممتاز گھرانے آل میکالہ سے تعلق قائم کیا — خصوصاً ادیب ابو الفضل عبید اللہ بن احمد میکالی سے جو عمر بھر ان کے دوست رہے — اور خراسان کے گورنر ابو المظفر نصر بن سبکتگین سے بھی {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}؛ امیر ابو الفضل میکالی کی مدح میں ان کی قصائد محفوظ ہیں {cite:wafayat-ayan}۔"
