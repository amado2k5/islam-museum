label:
  ar: "ابن عساكر يصنّف «فضل عسقلان» و«الأربعين في الاجتهاد في إقامة الجهاد» بعد سقوط عسقلان، ٥٤٨هـ/١١٥٣م"
  en: "Ibn 'Asakir writes Fadl 'Asqalan and the Arba'in on jihad after the fall of Ascalon, 548/1153"
  ur: "عسقلان کے سقوط کے بعد ابن عساکر کی تصانیف «فضل عسقلان» اور «الأربعین»، 548ھ/1153ء"
summary:
  ar: "بعد أن أخذ الفرنج عسقلان سنة ثمان وأربعين، صنّف ابن عساكر — وهو أشعري الاعتقاد يجاهر بالرد على من يمس السنة — «فضل عسقلان» يحرّض فيه المسلمين على استرداد المدينة، و«الأربعين في الاجتهاد في إقامة الجهاد» أربعين حديثاً في فضائل الجهاد تأييداً للسياسة الدينية لنور الدين {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  en: "After the Franks took Ascalon in 548/1153, Ibn 'Asakir — an Ash'ari who fought whatever cast a slur on the Sunna — wrote Fadl 'Asqalan exhorting the Muslims to recapture the town, and a collection of forty hadiths, al-Arba'in fi al-ijtihad fi iqamat al-jihad, exalting the virtues of jihad in support of Nur al-Din's religious policy {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  ur: "548ھ/1153ء میں صلیبیوں کے عسقلان لینے کے بعد ابن عساکر نے — جو اشعری مسلک کے حامل اور سنت پر انگلی اٹھانے والوں کے رد کرنے والے تھے — «فضل عسقلان» لکھا جس میں مسلمانوں کو شہر واپس لینے کی ترغیب دی، اور نور الدین کی دینی پالیسی کی تائید میں چالیس احادیث کا مجموعہ «الأربعین فی الاجتہاد فی اقامۃ الجہاد» تصنیف کیا {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}۔"
