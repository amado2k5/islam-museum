summary:
  ar: "تقع حرب بين أهل مسور والقدميين، فيعود القرامط إلى جبل مسور في ربيع الأول سنة 304هـ بعد أن يدفعهم أحمد بن يحيى."
  en: "Fighting breaks out between the people of Musur and the Qudmiyyin, and the Qarmatians return to Jabal Musur in Rabi I 304 AH after Ahmad ibn Yahya's commander pushes them back."
  ur: "مسور کے لوگوں اور قدمیین میں لڑائی ہوتی ہے، اور احمد بن یحییٰ کے قائد کے دباؤ کے بعد قرامطہ ربیع الاول 304ھ میں جبل مسور لوٹ جاتے ہیں۔"
  es: "Se desata una lucha entre la gente de Musur y los Qudmiyyin, y los cármatas regresan a Jabal Musur en Rabi I 304 AH después de que el comandante de Ahmad ibn Yahya los haga retroceder."
  fr: "Des combats éclatent entre les habitants de Musur et les Qudmiyyin, et les Qarmates retournent à Jabal Musur en Rabi I 304 AH après que le commandant d'Ahmad ibn Yahya les ait repoussés."
