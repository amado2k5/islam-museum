  en: "Fighting between the people of Musur and the Qudmiyyin ends with the Qarmatians back at Jabal Musur in Rabi I 304 AH, p. 404"
  ur: "مسور کے لوگوں اور قدمیین کے درمیان لڑائی ربیع الاول 304ھ میں قرامطہ کے جبل مسور لوٹنے پر ختم ہوتی ہے، ص404"
