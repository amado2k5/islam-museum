label: { ar: "عزم ملكشاه على إخراج الخليفة من بغداد فمات", en: "Malikshah Resolves to Expel the Caliph from Baghdad, and Dies", es: "Malikshah decide expulsar al califa de Bagdad y muere.", fr: "Malikshah décide d'expulser le calife de Bagdad et meurt.", ur: "ملکشاہ نے خلیفہ کو بغداد سے نکالنے کا عزم کیا، اور مر گیا۔", tr: "Malikşah halifeyi Bağdat'tan kovmaya karar verdi, ancak halife öldü.", id: "Malikshah bertekad untuk mengusir Khalifah dari Baghdad, tetapi ia meninggal dunia." }
summary:
  ar: "في سنة خمس وثمانين عاد ملكشاه إلى بغداد عازماً على الشر وأرسل إلى الخليفة يقول لا بد أن تترك لي بغداد وتذهب إلى أي بلد شئت فانزعج الخليفة وقال أمهلني ولو شهراً قال ولا ساعة واحدة فأرسل الخليفة إلى وزير السلطان يطلب المهلة عشرة أيام فاتفق مرض السلطان وموته وعد ذلك كرامة للخليفة وقيل إن الخليفة جعل يصوم فإذا أفطر جلس على الرماد ودعا على ملكشاه فاستجاب الله دعاءه وذهب إلى حيث ألقت وكتمت زوجته تركان موته واستحلفت الأمراء لولده محمود وهو ابن خمس سنين فلقبه الخليفة ناصر الدنيا والدين ثم خرج عليه أخوه بركياروق فقلده الخليفة ولقبه ركن الدين {cite:tarikh-khulafa-minhaj-1434 p. 653}."
  en: "In 485 Malikshah returned to Baghdad bent on harm, sending the caliph word: 'you must leave me Baghdad and go where you will'. 'Grant me a month' — 'not an hour'. The caliph asked the sultan's vizier for ten days — whereupon the sultan fell ill and died, counted a karama for the caliph; it is said he had sat fasting on ashes cursing Malikshah till answered. The sultan's wife Turkan hid the death, had the amirs swear to her five-year-old Mahmud — titled Nasir al-Dunya wa'l-Din — then his brother Barkyaruq rose and was invested as Rukn al-Din {cite:tarikh-khulafa-minhaj-1434 p. 653}."
  es: "En 485, Malikshah regresó a Bagdad con la intención de hacer daño, enviando al califa el siguiente mensaje: «Debes abandonar Bagdad y marcharte adonde quieras». «Concédeme un mes», «ni una hora». El califa pidió al visir del sultán diez días, tras lo cual el sultán enfermó y murió, lo que se consideró un karama para el califa; se dice que permaneció ayunando sobre cenizas maldiciendo a Malikshah hasta que recibió respuesta. La esposa del sultán, Turkan, ocultó la muerte, hizo que los emires juraran por su hijo Mahmud, de cinco años, titulado Nasir al-Dunya wa'l-Din; entonces su hermano Barkyaruq ascendió y fue investido como Rukn al-Din {cite:tarikh-khulafa-minhaj-1434 p. 653}."
  fr: "En 485, Malikshah revint à Bagdad avec de mauvaises intentions, et envoya au calife ce message: « Vous devez me laisser Bagdad et aller où bon vous semble. Accordez-moi un mois, pas une heure. » Le calife demanda dix jours au vizir du sultan, après quoi ce dernier tomba malade et mourut, ce qui, selon la légende, fut une punition pour le calife. On raconte qu'il jeûna sur des cendres en maudissant Malikshah jusqu'à ce qu'il obtienne une réponse. L'épouse du sultan, Turkan, dissimula le décès et fit jurer par les émirs son fils Mahmud, âgé de cinq ans, qui reçut le titre de Nasir al-Dunya wa'l-Din. Son frère Barkyaruq s'éleva alors et fut investi du titre de Rukn al-Din (voir Tarikh-Khulafa-Minhaj-1434, p. 653)."
  ur: "485 میں ملکشاہ بغداد واپس آیا اور خلیفہ کو یہ پیغام بھیجا کہ تم مجھے بغداد چھوڑ کر جہاں چاہو چلے جاؤ۔ 'مجھے ایک مہینہ دیں' - 'ایک گھنٹہ نہیں'۔ خلیفہ نے سلطان کے وزیر سے دس دن کی مہلت مانگی - جس کے بعد سلطان بیمار ہو کر مر گیا، خلیفہ کے لیے ایک کرم شمار کیا؛ کہا جاتا ہے کہ وہ ملک شاہ پر لعنت بھیجتے ہوئے راکھ پر بیٹھ گئے تھے جب تک جواب نہ دیا گیا۔ سلطان کی بیوی ترکان نے موت کو چھپایا، امیروں نے اپنے پانچ سالہ محمود کو ناصر الدنیا والالدین کے نام سے حلف دلایا، پھر اس کا بھائی برقیاروق اٹھا اور اسے رکن الدین کے نام سے سرمایہ لگایا گیا۔ 653}۔"
  tr: "85 yılında Malikşah, kötü niyetle Bağdat'a döndü ve halifeye, \"Bağdat'ı bana bırakıp dilediğin ülkeye gitmelisin\" diye bir mesaj gönderdi. Halife buna çok kızdı ve \"Bana zaman ver, bir ay bile olsa\" dedi. Malikşah, \"Bir saat bile değil\" diye karşılık verdi. Bunun üzerine halife, Sultan'ın vezirine on günlük bir süre uzatma talebinde bulundu. Ardından Sultan hastalandı ve öldü; bu durum halife için bir mucize olarak kabul edildi. Rivayete göre halife oruç tutmaya başladı ve orucunu bozduğunda küllerin üzerine oturup Malikşah'a karşı dua etti. Allah duasını kabul etti ve Malikşah'ın onu attığı yere gitti. Karısı Turkan, ölümünü gizledi ve prenslerden beş yaşında olan oğlu Mahmud'a biat etmelerini istedi. Halife daha sonra ona Nasir el-Dunya ve el-Din (Dünya ve Din Savunucusu) unvanını verdi. Bunun üzerine kardeşi Barkiyaruq ona isyan etti, bunun üzerine halife onu atadı ve ona Rukn al-Din (Dinin Direği) unvanını verdi. {cite:tarikh-khulafa-minhaj-1434 s. 653}."
  id: "Pada tahun 85, Malikshah kembali ke Baghdad dengan niat jahat dan mengirim pesan kepada Khalifah yang mengatakan, “Engkau harus meninggalkan Baghdad untukku dan pergi ke negara mana pun yang engkau inginkan.” Khalifah merasa kesal dan berkata, “Beri aku waktu, bahkan sebulan pun.” Ia menjawab, “Bahkan satu jam pun tidak.” Maka Khalifah mengirim utusan kepada menteri Sultan untuk meminta perpanjangan waktu sepuluh hari. Kemudian Sultan jatuh sakit dan meninggal, dan ini dianggap sebagai mukjizat bagi Khalifah. Dikatakan bahwa Khalifah mulai berpuasa, dan ketika berbuka puasa, ia akan duduk di atas abu dan berdoa melawan Malikshah. Allah mengabulkan doanya, dan ia pergi ke tempat Malikshah membuangnya. Istrinya, Turkan, menyembunyikan kematiannya dan membuat para pangeran bersumpah setia kepada putranya, Mahmud, yang berusia lima tahun. Khalifah kemudian memberinya gelar Nasir al-Dunya wa al-Din (Pembela Dunia dan Agama). Kemudian saudaranya, Barkiyaruq, memberontak terhadapnya, sehingga Khalifah mengangkatnya dan memberinya gelar Rukn al-Din (Pilar Agama). {cite:tarikh-khulafa-minhaj-1434 p. 653}."
