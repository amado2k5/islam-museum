label: { ar: "عزم ملكشاه على إخراج الخليفة من بغداد فمات" }
summary:
  ar: "في سنة خمس وثمانين عاد ملكشاه إلى بغداد عازماً على الشر وأرسل إلى الخليفة يقول لا بد أن تترك لي بغداد وتذهب إلى أي بلد شئت فانزعج الخليفة وقال أمهلني ولو شهراً قال ولا ساعة واحدة فأرسل الخليفة إلى وزير السلطان يطلب المهلة عشرة أيام فاتفق مرض السلطان وموته وعد ذلك كرامة للخليفة وقيل إن الخليفة جعل يصوم فإذا أفطر جلس على الرماد ودعا على ملكشاه فاستجاب الله دعاءه وذهب إلى حيث ألقت وكتمت زوجته تركان موته واستحلفت الأمراء لولده محمود وهو ابن خمس سنين فلقبه الخليفة ناصر الدنيا والدين ثم خرج عليه أخوه بركياروق فقلده الخليفة ولقبه ركن الدين {cite:tarikh-khulafa-minhaj-1434 p. 653}."
  en: "In 485 Malikshah returned to Baghdad bent on harm, sending the caliph word: 'you must leave me Baghdad and go where you will'. 'Grant me a month' — 'not an hour'. The caliph asked the sultan's vizier for ten days — whereupon the sultan fell ill and died, counted a karama for the caliph; it is said he had sat fasting on ashes cursing Malikshah till answered. The sultan's wife Turkan hid the death, had the amirs swear to her five-year-old Mahmud — titled Nasir al-Dunya wa'l-Din — then his brother Barkyaruq rose and was invested as Rukn al-Din {cite:tarikh-khulafa-minhaj-1434 p. 653}."
