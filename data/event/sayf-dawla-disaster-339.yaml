summary:
  ar: "ورد الخبر في يوم الاثنين لإحدى عشرة ليلة بقيت من جمادى الأولى سنة تسع وثلاثين وثلاثمائة بأن سيف الدولة غزا فأوغل في بلاد الروم وفتح حصونًا كثيرة وسبى خلقًا كثيرًا، فلما أراد الخروج من بلاد الروم أخذوا عليه الدرب الذي أراد الخروج منه فتلف كل من كان معه من المسلمين أسرًا وقتلًا، وارتجع الروم ما أخذه من السبي وأخذوا خزانته وكراعه وسلاحه، وأفلت في عدد يسير وكان معه ألف رجل {cite:muntazam-ibn-al-jawzi p. 661}."
  en: "In 339 news came that Sayf al-Dawla had raided deep into Byzantium taking forts and captives — but on his way out the pass was cut: nearly his whole thousand was killed or captured, the spoils, treasury, mounts and arms retaken, and he escaped with a mere remnant {cite:muntazam-ibn-al-jawzi p. 661}."
