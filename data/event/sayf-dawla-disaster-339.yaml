class: event
kind: battle
label: { ar: "كارثة سيف الدولة في بلاد الروم", en: "Sayf al-Dawla's disaster in Byzantine lands", es: "El desastre de Sayf al-Dawla en tierras bizantinas", fr: "Le désastre de Sayf al-Dawla en terres byzantines", ur: "بازنطینی سرزمینوں میں سیف الدولہ کی تباہی" }
summary:
  ar: "ورد الخبر في يوم الاثنين لإحدى عشرة ليلة بقيت من جمادى الأولى سنة تسع وثلاثين وثلاثمائة بأن سيف الدولة غزا فأوغل في بلاد الروم وفتح حصونًا كثيرة وسبى خلقًا كثيرًا، فلما أراد الخروج من بلاد الروم أخذوا عليه الدرب الذي أراد الخروج منه فتلف كل من كان معه من المسلمين أسرًا وقتلًا، وارتجع الروم ما أخذه من السبي وأخذوا خزانته وكراعه وسلاحه، وأفلت في عدد يسير وكان معه ألف رجل {cite:muntazam-ibn-al-jawzi p. 661}."
  en: "In 339 news came that Sayf al-Dawla had raided deep into Byzantium taking forts and captives — but on his way out the pass was cut: nearly his whole thousand was killed or captured, the spoils, treasury, mounts and arms retaken, and he escaped with a mere remnant {cite:muntazam-ibn-al-jawzi p. 661}."
  es: "En 339 llegó la noticia de que Sayf al-Dawla había asaltado profundamente Bizancio tomando fortalezas y prisioneros, pero en su camino de regreso el paso fue cortado: casi todos sus mil hombres murieron o fueron capturados, el botín, el tesoro, los caballos y las armas fueron recuperados, y él escapó con un mero remanente {cite:muntazam-ibn-al-jawzi p. 661}."
  fr: "En 339, la nouvelle parvint que Sayf al-Dawla avait mené un raid au cœur de Byzance, prenant des forts et des captifs — mais sur le chemin du retour, le passage fut coupé: près de ses mille hommes furent tués ou capturés, le butin, le trésor, les montures et les armes repris, et il s'échappa avec un simple reste {cite:muntazam-ibn-al-jawzi p. 661}."
  ur: "339 میں خبر آئی کہ سیف الدولہ نے قلعوں اور قیدیوں کو لے کر بازنطیم میں گہرائی میں چھاپہ مارا تھا - لیکن اس کے نکلتے ہی راستہ کاٹ دیا گیا تھا: تقریبا اس کے پورے ہزار مارے گئے یا اس پر قبضہ کر لیا گیا، مال غنیمت، خزانے، پہاڑ اور اسلحہ واپس لے لیا گیا، اور وہ صرف ایک بچا ہوا تھا. 661}۔"
