label: { ar: "هزيمة الداعي الحسن بن القاسم عند سارية", en: "Defeat of the Da'i al-Hasan ibn al-Qasim at Sariya", fr: "La défaite du Da'i al-Hasan ibn al-Qasim à Sariya", es: "Derrota de Da'i al-Hasan ibn al-Qasim en Sariya" }
summary:
  ar: "في سنة 316هـ التقى الداعي العلوي الحسن بن القاسم ومعه ماكان بن كاكي الديلمي بأسفار بن شيرويه ومرداويج عند سارية فاقتتلوا قتالاً شديداً فانهزم الحسن وماكان فلحق الحسن فقُتل، وكان أكثر الديلم أصحابه على تعتده منهم للهزيمة لأنه كان يأمرهم بالاستقامة ويمنعهم من ظلم الرعية وشرب الخمور وكانوا يبغضونه لذلك وقد اتفقوا على أن يستقدموا هروسندان أحد رؤساء الجيل ويسلموه إليه ويقبضوا على الحسن وينصبوا أبا الحسين بن الأطروش فوقف عليهم أحمد الطويل بذلك فكتب إلى الحسن فأخذ حذره {cite:kamil-ibn-al-athir p. 139-140}."
  en: "At Sariya in 316 the Alid Da'i al-Hasan ibn al-Qasim and Makan ibn Kaki met Asfar and Mardavij in hard fighting and broke; the Da'i was overtaken and killed — his own Daylamites, resenting his bans on wine and oppression of the peasants, had plotted to hand him to Harusandan {cite:kamil-ibn-al-athir p. 139-140}."
  fr: "À Sariya, en 316, le Da'i alide al-Hasan ibn al-Qasim et Makan ibn Kaki affrontèrent Asfar et Mardavij en un dur combat et cédèrent ; le Da'i fut rattrapé et tué : ses propres Daylamites, irrités par ses interdictions du vin et de l'oppression des paysans, avaient comploté de le livrer à Harusandan {cite:kamil-ibn-al-athir p. 139-140}."
  es: "En Sariya en 316, el Alid Da'i al-Hasan ibn al-Qasim y Makan ibn Kaki se enfrentaron a Asfar y Mardavij en una dura batalla y se rompieron; el Da'i fue alcanzado y asesinado; sus propios daylamitas, resentidos por sus prohibiciones del vino y la opresión de los campesinos, habían conspirado para entregarlo a Harusandan {cite:kamil-ibn-al-athir p. 139-140}."
