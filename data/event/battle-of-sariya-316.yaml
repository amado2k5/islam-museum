label: { ar: "هزيمة الداعي الحسن بن القاسم عند سارية", en: "Defeat of the Da'i al-Hasan ibn al-Qasim at Sariya", fr: "La défaite du Da'i al-Hasan ibn al-Qasim à Sariya", es: "Derrota de Da'i al-Hasan ibn al-Qasim en Sariya", ur: "ساریہ میں داعی الحسن بن القاسم کی شکست", tr: "Da'i al-Hasan ibn al-Qasim'in Sariya'daki yenilgisi", id: "Kekalahan Da'i al-Hasan ibn al-Qasim di Sariya" }
summary:
  ar: "في سنة 316هـ التقى الداعي العلوي الحسن بن القاسم ومعه ماكان بن كاكي الديلمي بأسفار بن شيرويه ومرداويج عند سارية فاقتتلوا قتالاً شديداً فانهزم الحسن وماكان فلحق الحسن فقُتل، وكان أكثر الديلم أصحابه على تعتده منهم للهزيمة لأنه كان يأمرهم بالاستقامة ويمنعهم من ظلم الرعية وشرب الخمور وكانوا يبغضونه لذلك وقد اتفقوا على أن يستقدموا هروسندان أحد رؤساء الجيل ويسلموه إليه ويقبضوا على الحسن وينصبوا أبا الحسين بن الأطروش فوقف عليهم أحمد الطويل بذلك فكتب إلى الحسن فأخذ حذره {cite:kamil-ibn-al-athir p. 139-140}."
  en: "At Sariya in 316 the Alid Da'i al-Hasan ibn al-Qasim and Makan ibn Kaki met Asfar and Mardavij in hard fighting and broke; the Da'i was overtaken and killed — his own Daylamites, resenting his bans on wine and oppression of the peasants, had plotted to hand him to Harusandan {cite:kamil-ibn-al-athir p. 139-140}."
  fr: "À Sariya, en 316, le Da'i alide al-Hasan ibn al-Qasim et Makan ibn Kaki affrontèrent Asfar et Mardavij en un dur combat et cédèrent ; le Da'i fut rattrapé et tué : ses propres Daylamites, irrités par ses interdictions du vin et de l'oppression des paysans, avaient comploté de le livrer à Harusandan {cite:kamil-ibn-al-athir p. 139-140}."
  es: "En Sariya en 316, el Alid Da'i al-Hasan ibn al-Qasim y Makan ibn Kaki se enfrentaron a Asfar y Mardavij en una dura batalla y se rompieron; el Da'i fue alcanzado y asesinado; sus propios daylamitas, resentidos por sus prohibiciones del vino y la opresión de los campesinos, habían conspirado para entregarlo a Harusandan {cite:kamil-ibn-al-athir p. 139-140}."
  ur: "316 میں ساریہ کے مقام پر علید داعی الحسن ابن القاسم اور مکان بن کاکی نے اسفار اور مرداویج سے سخت لڑائی میں ملاقات کی اور ٹوٹ گئے۔ داعی کو پکڑ لیا گیا اور قتل کر دیا گیا - اس کے اپنے دیلامائٹس نے شراب پر پابندی اور کسانوں پر ظلم و ستم سے ناراض ہو کر اسے ہاروسندن کے حوالے کرنے کی سازش کی تھی۔ 139-140}۔"
  tr: "Hicri 316 yılında, Alevi vaiz Hasan bin el-Kâsim ve yanında Makan bin Kaki el-Daylami, Sariye'de Asfar bin Şiraveyh ve Merdavij ile karşılaştılar. Şiddetli bir savaş yaptılar ve Hasan ile Makan yenildiler. Hasan takip edildi ve öldürüldü. Deylami arkadaşlarının çoğu, onlara dürüst olmalarını, insanlara zulmetmemelerini ve içki içmemelerini emrettiği için onu yenilgiye hazırlıyorlardı ve bu yüzden ondan nefret ediyorlardı. Neslin önderlerinden Harusandan'ı getirip ona teslim etmeye ve Hasan'ı tutuklayıp Ebu el-Hüseyin bin el-Atrash'ı onun yerine geçirmeye karar verdiler. Ahmed el-Tevil bunu öğrendi ve Hasan'a yazdı, böylece o da önlem aldı. {Kaynak: Kamil İbn el-Athir s. 139-140}"
  id: "Pada tahun 316 H, pendakwah Alawiyah Al-Hasan bin Al-Qasim dan bersamanya Makan bin Kaki Al-Daylami bertemu dengan Asfar bin Shirawayh dan Mardawij di Sariyah. Mereka bertempur sengit, dan Al-Hasan serta Makan dikalahkan. Al-Hasan dikejar dan dibunuh. Sebagian besar sahabatnya dari kaum Daylam mempersiapkannya untuk kekalahan karena ia biasa memerintahkan mereka untuk berbuat baik dan mencegah mereka dari menindas rakyat dan minum minuman keras, dan mereka membencinya karena hal itu. Mereka sepakat untuk membawa Harusandan, salah satu pemimpin generasi itu, dan menyerahkannya kepadanya, serta menangkap Al-Hasan dan mengangkat Abu Al-Hussein bin Al-Atrash. Ahmad Al-Tawil mengetahui hal ini dan menulis surat kepada Al-Hasan, sehingga ia mengambil tindakan pencegahan. {cite:kamil-ibn-al-athir p. 139-140}."
