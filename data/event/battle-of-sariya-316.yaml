label: { ar: "هزيمة الداعي الحسن بن القاسم عند سارية" }
summary:
  ar: "في سنة 316هـ التقى الداعي العلوي الحسن بن القاسم ومعه ماكان بن كاكي الديلمي بأسفار بن شيرويه ومرداويج عند سارية فاقتتلوا قتالاً شديداً فانهزم الحسن وماكان فلحق الحسن فقُتل، وكان أكثر الديلم أصحابه على تعتده منهم للهزيمة لأنه كان يأمرهم بالاستقامة ويمنعهم من ظلم الرعية وشرب الخمور وكانوا يبغضونه لذلك وقد اتفقوا على أن يستقدموا هروسندان أحد رؤساء الجيل ويسلموه إليه ويقبضوا على الحسن وينصبوا أبا الحسين بن الأطروش فوقف عليهم أحمد الطويل بذلك فكتب إلى الحسن فأخذ حذره {cite:kamil-ibn-al-athir p. 139-140}."
  en: "At Sariya in 316 the Alid Da'i al-Hasan ibn al-Qasim and Makan ibn Kaki met Asfar and Mardavij in hard fighting and broke; the Da'i was overtaken and killed — his own Daylamites, resenting his bans on wine and oppression of the peasants, had plotted to hand him to Harusandan {cite:kamil-ibn-al-athir p. 139-140}."
