id: "event/hasan-ibn-ahmad-and-ibn-munir-urge-abu-jafar-to-ride-and-he-refuses-295"
class: event
kind: other
label:
  ar: "الحسن بن أحمد وابن منير يحثان أبا جعفر على الركوب فيأبى، 295هـ"
  en: "Hasan ibn Ahmad and Ibn Munir urge Abu Ja'far to ride, and he refuses, 295 AH, pp. 371-372"
  ur: "حسن بن احمد اور ابن منیر ابو جعفر کو سواری پر نکلنے کا مشورہ دیتے ہیں اور وہ انکار کرتا ہے، 295ھ، ص371-372"
summary:
  ar: "لما رأى الحسن بن أحمد الهمداني وعبد الله بن منير المزوي القوم قد أقبلوا، قالا لأبي جعفر إن القوم قد غشوه ولا طاقة له بهم، واركب فرسك وقاتل عليها، فأبى أبو جعفر الركوب وقال إنه ليس وقت ركوب، بل يبرزون معه ويقاتلون القوم على الأرض."
  en: "When Hasan ibn Ahmad al-Hamdani and Abdallah ibn Munir al-Mazuwi saw the enemy approaching, they told Abu Ja'far that the enemy had surrounded him and that he had no strength against them, and that he should mount his horse and fight from it. Abu Ja'far refused to ride, saying it was not the time, and that they should come out and fight the enemy on foot with him until God judged between them."
  ur: "جب حسن بن احمد الہمدانی اور عبداللہ بن منیر المزوی نے دشمن کو آتے دیکھا تو انہوں نے ابو جعفر سے کہا کہ دشمن نے اسے گھیر لیا ہے اور اس میں ان کا مقابلہ کرنے کی طاقت نہیں، اس لیے وہ اپنے گھوڑے پر سوار ہو کر اسی پر سے لڑے۔ ابو جعفر نے سوار ہونے سے انکار کیا اور کہا کہ یہ سواری کا وقت نہیں، بلکہ وہ باہر آ کر ان کے ساتھ پیدل لڑیں گے یہاں تک کہ اللہ ان کے درمیان فیصلہ کرے۔"
