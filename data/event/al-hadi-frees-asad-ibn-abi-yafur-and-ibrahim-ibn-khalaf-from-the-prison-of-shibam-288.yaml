id: event/al-hadi-frees-asad-ibn-abi-yafur-and-ibrahim-ibn-khalaf-from-the-prison-of-shibam-288
class: event
kind: other
label:
  ar: "الهادي يطلق أسعد بن أبي يعفر وإبراهيم بن خلف من حبس شبام، جمادى الآخرة 288هـ"
  en: "Al-Hadi frees As'ad ibn Abi Ya'fur and Ibrahim ibn Khalaf from the prison of Shibam, Jumada II 288 AH"
  ur: "ہادی اسعد بن ابی یعفر اور ابراہیم بن خلف کو شبام کے قید خانے سے رہا کرتے ہیں، جمادی الآخرہ 288ھ"
  es: "Al-Hadi libera a As'ad ibn Abi Ya'fur e Ibrahim ibn Khalaf de la prisión de Shibam, Jumada II 288 AH"
  fr: "Al-Hadi libère As'ad ibn Abi Ya'fur et Ibrahim ibn Khalaf de la prison de Shibam, Joumada II 288 AH"
  tr: "El-Hadi, Es'ad ibn Abi Ya'fur ve İbrahim ibn Khalaf'ı Shibam hapishanesinden Jumada al-Akhirah 288 AH'den serbest bıraktı."
  id: "Al-Hadi membebaskan As'ad bin Abi Ya'fur dan Ibrahim bin Khalaf dari penjara Shibam, Jumada al-Akhirah 288 H."
summary:
  ar: "دعا الهادي من كان في حبس شبام من آل يعفر وآل طريف، مثل أسعد بن أبي يعفر وإبراهيم بن خلف، فذكّرهم بإساءتهم إليه وإحسانه إليهم وقال إنه وهب لهم نفوسهم وأوصاهم بتقوى الله، فمنّ عليهم وأطلقهم."
  en: "Al-Hadi called those of Al Ya'fur and Al Tarif who were jailed at Shibam, among them As'ad ibn Abi Ya'fur and Ibrahim ibn Khalaf, reminded them of their ill treatment of him and his good to them, told them he had given them their lives and urged them to fear God, then showed grace and freed them."
  ur: "ہادی نے شبام کے قید خانے میں موجود آل یعفر اور آل طریف کے لوگوں کو بلایا، جن میں اسعد بن ابی یعفر اور ابراہیم بن خلف تھے، انہیں ان کی بدسلوکی اور اپنے احسان کی یاد دلائی، کہا کہ میں نے تمہیں تمہاری جانیں بخش دیں اور اللہ کا تقویٰ رکھنے کی نصیحت کی، پھر احسان کر کے انہیں رہا کر دیا۔"
  es: "Al-Hadi llamó a los miembros de Al Ya'fur y Al Tarif que estaban encarcelados en Shibam, entre ellos As'ad ibn Abi Ya'fur e Ibrahim ibn Khalaf, les recordó el maltrato que le habían infligido y el bien que él les había hecho, les dijo que les había perdonado la vida y les exhortó a temer a Dios, y luego les mostró clemencia y los liberó."
  fr: "Al-Hadi appela ceux d'Al Ya'fur et d'Al Tarif qui étaient emprisonnés à Shibam, parmi lesquels As'ad ibn Abi Ya'fur et Ibrahim ibn Khalaf, leur rappela les mauvais traitements qu'ils lui avaient infligés et les bienfaits qu'il leur avait accordés, leur dit qu'il leur avait sauvé la vie et les exhorta à craindre Dieu, puis fit preuve de grâce et les libéra."
  tr: "El-Hadi, Şibam'da Ya'fer ve Tarif ailelerinden As'ad bin Abi Ya'fer ve İbrahim bin Halef gibi hapsedilmiş olanları çağırdı ve onlara kendisine yaptıkları kötü muameleyi ve kendisinin onlara gösterdiği iyiliği hatırlattı. Onlara canlarını verdiğini ve Allah'tan korkmalarını öğütlediğini, bu yüzden onlara merhamet göstererek serbest bıraktığını söyledi."
  id: "Al-Hadi memanggil orang-orang yang dipenjara di Shibam dari keluarga Ya'far dan Tarif, seperti As'ad bin Abi Ya'far dan Ibrahim bin Khalaf, dan mengingatkan mereka tentang perlakuan buruk mereka terhadapnya dan kebaikannya kepada mereka, serta mengatakan bahwa dia telah menyelamatkan hidup mereka dan menasihati mereka untuk takut kepada Allah, sehingga dia menunjukkan rahmat kepada mereka dan membebaskan mereka."
