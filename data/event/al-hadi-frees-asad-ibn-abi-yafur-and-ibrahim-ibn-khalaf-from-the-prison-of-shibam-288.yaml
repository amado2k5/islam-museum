id: event/al-hadi-frees-asad-ibn-abi-yafur-and-ibrahim-ibn-khalaf-from-the-prison-of-shibam-288
class: event
kind: other
label:
  ar: "الهادي يطلق أسعد بن أبي يعفر وإبراهيم بن خلف من حبس شبام، جمادى الآخرة 288هـ"
  en: "Al-Hadi frees As'ad ibn Abi Ya'fur and Ibrahim ibn Khalaf from the prison of Shibam, Jumada II 288 AH"
  ur: "ہادی اسعد بن ابی یعفر اور ابراہیم بن خلف کو شبام کے قید خانے سے رہا کرتے ہیں، جمادی الآخرہ 288ھ"
summary:
  ar: "دعا الهادي من كان في حبس شبام من آل يعفر وآل طريف، مثل أسعد بن أبي يعفر وإبراهيم بن خلف، فذكّرهم بإساءتهم إليه وإحسانه إليهم وقال إنه وهب لهم نفوسهم وأوصاهم بتقوى الله، فمنّ عليهم وأطلقهم."
  en: "Al-Hadi called those of Al Ya'fur and Al Tarif who were jailed at Shibam, among them As'ad ibn Abi Ya'fur and Ibrahim ibn Khalaf, reminded them of their ill treatment of him and his good to them, told them he had given them their lives and urged them to fear God, then showed grace and freed them."
  ur: "ہادی نے شبام کے قید خانے میں موجود آل یعفر اور آل طریف کے لوگوں کو بلایا، جن میں اسعد بن ابی یعفر اور ابراہیم بن خلف تھے، انہیں ان کی بدسلوکی اور اپنے احسان کی یاد دلائی، کہا کہ میں نے تمہیں تمہاری جانیں بخش دیں اور اللہ کا تقویٰ رکھنے کی نصیحت کی، پھر احسان کر کے انہیں رہا کر دیا۔"
