id: event/ibn-shanabudh-trial-323
class: event
kind: court-ruling
label: { ar: "واقعة ابن شنبوذ", en: "The affair of Ibn Shanabudh", es: "El asunto de Ibn Shanabudh", fr: "L'affaire d'Ibn Shanabudh", ur: "ابن شنابد کا معاملہ", tr: "İbn Şanbudh olayı", id: "Peristiwa Ibnu Shanbudh" }
summary:
  ar: "في سنة ثلاث وعشرين كانت واقعة ابن شنبوذ المشهورة واستتابته عن القراءة بالشاذ والمحضر الذي كتب عليه بحضرة الوزير أبي علي بن مقلة، وقد استجيب دعاؤه وكان قد دعا على الوزير بأن يقطع الله يده فقطعت يد الوزير وذاق الذل {cite:tarikh-khulafa-minhaj-1434 p. 604}."
  en: "In 323 came the famous affair of Ibn Shanabudh: made to repent of reading the shadh variants, the record written against him before the vizier Ibn Muqla. His prayer was answered — he had called down the severing of the vizier's hand, and Ibn Muqla's hand was indeed cut off {cite:tarikh-khulafa-minhaj-1434 p. 604}."
  es: "En el año 323 tuvo lugar el famoso caso de Ibn Shanabudh: se le obligó a arrepentirse de haber leído las variantes del shadh, y el registro escrito en su contra fue presentado ante el visir Ibn Muqla. Su plegaria fue escuchada: había invocado la amputación de la mano del visir, y, en efecto, la mano de Ibn Muqla fue cortada {cite:tarikh-khulafa-minhaj-1434 p. 604}."
  fr: "En 323 eut lieu la célèbre affaire d'Ibn Shanabudh: contraint de se repentir d'avoir lu les variantes du shadh, il fut condamné par le vizir Ibn Muqla. Sa prière fut exaucée: il avait demandé que la main du vizir soit tranchée, et la main d'Ibn Muqla fut effectivement coupée (voir: Tarikh-Khulafa-Minhaj-1434, p. 604)."
  ur: "323 میں ابن شنابدھ کا مشہور واقعہ آیا: شد کی مختلف قسموں کو پڑھنے سے توبہ کرنے کے لئے بنایا گیا، اس کے خلاف وزیر ابن مقلہ کے سامنے لکھا گیا۔ اس کی دعا قبول ہو گئی - اس نے وزیر کا ہاتھ کاٹنے کو کہا تھا اور ابن مقلہ کا ہاتھ کاٹ دیا گیا تھا۔ 604}۔"
  tr: "Yirmi üçüncü yılda, İbn Şanbudh'un meşhur olayı gerçekleşti. Şadhz'ı okuduğu ve vezir Ebu Ali İbn Muqlah'ın huzurunda hakkında yazılan kaydı okuduğu için tövbe etti. Duası kabul oldu ve vezire karşı Allah'tan elini kesmesini diledi; vezirin eli kesildi ve vezir aşağılanmayı tattı. {cite:tarikh-khulafa-minhaj-1434 s. 604}"
  id: "Pada tahun 23, terjadi peristiwa terkenal Ibn Shanbudh, di mana ia bertaubat karena membaca Shadhdh dan catatan yang ditulis tentang dirinya di hadapan menteri Abu Ali Ibn Muqlah. Doanya dikabulkan, dan ia telah berdoa agar Allah memotong tangan menteri tersebut, sehingga tangan menteri itu benar-benar terputus dan ia merasakan kehinaan. {cite:tarikh-khulafa-minhaj-1434 p. 604}."
