label: { ar: "وقعة عين الوردة", en: "the battle of 'Ayn al-Warda", fr: "la bataille de 'Ayn al-Warda", es: "la batalla de 'Ayn al-Warda", ur: "عین الوردہ کی جنگ", tr: "Ain al-Warda Muharebesi", id: "Pertempuran Ain al-Warda" }
summary:
  ar: "موقعة التوابين سنة خمس وستين، تحركت الشيعة ندماً على تخلفها عن الحسين ففزعت إلى خمسة رؤساء عسكروا بالنخيلة ثم ساروا فلقيهم عبيد الله بن زياد في ثلاثين ألفاً وعلى مقدمته خمسة أمراء، فاستشهد سليمان بن صرد رماه يزيد بن الحصين بن نمير بسهم، وأخذ الراية المسيب بن نجبة، وكان التقاء الأقوام بعين الوردة من شاطئ الفرات {cite:muruj-al-dhahab p. 87-89}."
  en: "The Penitents' battle of 65 AH — five leaders at Nukhayla marching against Ibn Ziyad's thirty thousand; Sulayman ibn Surad fell to an arrow, al-Musayyib took the banner at 'Ayn al-Warda on the Euphrates bank {cite:muruj-al-dhahab p. 87-89}."
  fr: "La bataille des Pénitents en 65 H : cinq chefs réunis à Nukhayla marchèrent contre les trente mille hommes d'Ibn Ziyad ; Sulayman ibn Surad tomba sous une flèche, et al-Musayyib prit l'étendard à 'Ayn al-Warda, sur la rive de l'Euphrate {cite:muruj-al-dhahab p. 87-89}."
  es: "La batalla de los Penitentes del año 65 AH: cinco líderes en Nukhayla marchando contra los treinta mil de Ibn Ziyad; Sulayman ibn Surad cayó por una flecha, al-Musayyib tomó el estandarte en 'Ayn al-Warda en la orilla del Éufrates {cite:muruj-al-dhahab p. 87-89}."
  ur: "65 ہجری کی معرکہ آرائی - نخائلہ میں پانچ رہنما ابن زیاد کے تیس ہزار کے خلاف مارچ کرتے ہوئے؛ سلیمان بن صرد تیر کی زد میں آ گیا، المصیب نے فرات کے کنارے عین الوردہ کے مقام پر جھنڈا لے لیا۔ 87-89}۔"
  tr: "65. yılda gerçekleşen Tövbekarlar Muharebesi'nde Şiiler, Hüseyin'i desteklemedikleri için pişmanlık duyarak Nukhaila'da kamp kuran beş liderin yanına sığındılar ve ardından yürüyüşe geçtiler. Ubeydullah bin Ziyad, otuz bin kişilik ordusu ve öncü birliklerinde beş komutanıyla onları karşıladı. Süleyman bin Surad, Yezid bin Hüseyin bin Numeyr tarafından okla vurularak şehit edildi ve Musayyab bin Necebe sancağı devraldı. İki taraf, Fırat Nehri kıyısındaki Eyver'de karşılaştı. {Kaynak: Muruj-al-Dhahab s. 87-89}"
  id: "Dalam Perang Para Pendosa pada tahun 65, kaum Syiah merasa menyesal atas kegagalan mereka mendukung Al-Hussein, sehingga mereka mencari perlindungan kepada lima pemimpin yang berkemah di Al-Nukhaila dan kemudian berbaris, dan mereka dihadang oleh Ubaid Allah bin Ziyad dengan tiga puluh ribu orang, dan di barisan depannya terdapat lima komandan. Suleiman bin Surad gugur sebagai syahid, ditembak oleh Yazid bin Al-Hussein bin Numayr dengan panah, dan Al-Musayyab bin Najaba mengambil panji, dan kedua pihak bertemu di Ain Al-Warda di tepi Sungai Eufrat {cite:muruj-al-dhahab hlm. 87-89}."
