label: { ar: "وقعة عين الوردة", en: "the battle of 'Ayn al-Warda" }
summary:
  ar: "موقعة التوابين سنة خمس وستين، تحركت الشيعة ندماً على تخلفها عن الحسين ففزعت إلى خمسة رؤساء عسكروا بالنخيلة ثم ساروا فلقيهم عبيد الله بن زياد في ثلاثين ألفاً وعلى مقدمته خمسة أمراء، فاستشهد سليمان بن صرد رماه يزيد بن الحصين بن نمير بسهم، وأخذ الراية المسيب بن نجبة، وكان التقاء الأقوام بعين الوردة من شاطئ الفرات {cite:muruj-al-dhahab p. 87-89}."
  en: "The Penitents' battle of 65 AH — five leaders at Nukhayla marching against Ibn Ziyad's thirty thousand; Sulayman ibn Surad fell to an arrow, al-Musayyib took the banner at 'Ayn al-Warda on the Euphrates bank {cite:muruj-al-dhahab p. 87-89}."
