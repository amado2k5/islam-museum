id: event/tabuk-departure-and-deputies
class: event
kind: other
label: { ar: "خروج النبي من المدينة والاستخلاف عليها", en: "The Prophet leaves Medina and appoints a deputy", es: "El Profeta abandona Medina y nombra a un representante.", fr: "Le Prophète quitte Médine et nomme un adjoint", ur: "پیغمبر مدینہ چھوڑ کر ایک نائب مقرر کرتے ہیں۔", tr: "Peygamberin Medine'den ayrılması ve oraya bir halefin atanması", id: "Kepergian Nabi dari Madinah dan pengangkatan penggantinya di sana." }
summary:
  ar: "ضرب النبي عسكره على ثنية الوداع؛ وقال ابن هشام إنه استعمل على المدينة محمد بن مسلمة الأنصاري، وذكر عن الدراوردي عن أبيه أنه استعمل سباع بن عرفطة."
  en: The Prophet pitched his camp at Thaniyyat al-Wada'. Ibn Hisham says he put Muhammad ibn Maslama al-Ansari in charge of Medina, and he reports from al-Darawardi from his father that he appointed Siba' ibn Urfuta.
  es: "El Profeta estableció su campamento en Thaniyyat al-Wada'. Ibn Hisham dice que puso a Muhammad ibn Maslama al-Ansari al frente de Medina, y relata, a través de al-Darawardi, que su padre le contó que nombró a Siba' ibn Urfuta."
  fr: "Le Prophète établit son camp à Thaniyyat al-Wada'. Ibn Hisham rapporte qu'il confia la gestion de Médine à Muhammad ibn Maslama al-Ansari, et il tient d'al-Darawardi, d'après son père, qu'il nomma Siba' ibn Urfuta."
  ur: "نبی نے اپنا پڑاؤ تھانیۃ الوداع میں لگایا۔ ابن ہشام کہتے ہیں کہ انہوں نے محمد بن مسلمہ الانصاری کو مدینہ کا انچارج بنایا، اور وہ الدراوردی سے اپنے والد سے روایت کرتے ہیں کہ انہوں نے سبع بن عرفتہ کو مقرر کیا۔"
  tr: "Peygamber ordusunu Thaniyat al-Wada’da konuşlandırdı; İbn Hişam, Muhammed ibn Maslamah al-Ansari'yi Medine valisi olarak atadığını ve babasından rivayet edilen al-Darawardi'nin naziliyeti üzerine Siba' ibn 'Arfatah'ı atadığını söyledi."
  id: "Nabi mendirikan perkemahan pasukannya di Thaniyat al-Wada’; Ibn Hisham berkata bahwa beliau menunjuk Muhammad ibn Maslamah al-Ansari sebagai gubernur Madinah, dan dia menyebutkan dari al-Darawardi atas otoritas ayahnya bahwa beliau menunjuk Siba’ ibn ‘Arfatah."
