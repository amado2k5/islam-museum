label: { ar: "موقف علي من حصار عثمان", en: "Ali's stance during the siege of Uthman", es: "La postura de Ali durante el asedio de Uthman", fr: "La position d'Ali durant le siège d'Uthman", ur: "عثمان کے محاصرہ کے دوران علی کا موقف", tr: "Ali'nin Osman kuşatmasına ilişkin tutumu", id: "Sikap Ali terhadap pengepungan Utsman" }
summary:
  ar: "اشتد الحصار على عثمان حتى منع من الصلاة في المسجد؛ وعرض علي أن يدفع عنه بخمسمائة دارع، فقال عثمان: ما أحب أن يُهراق دم في سببي ⁦(ص166)⁩. ولما منع الثوار الماء عن عثمان بعث إليه علي ثلاث قرب ماء فجُرح بسببها رجال من بني هاشم وبني أمية ⁦(ص166)⁩. وأرسل كبار الصحابة أبناءهم لحمايته، ومنهم الحسن وعبد الله بن الزبير، فجُرح الحسن ⁦(ص166)⁩."
  tr: "Osman'a yönelik kuşatma, camide namaz kılmasını engelleyecek kadar şiddetlendi. Ali, onu beş yüz zırhlı adamla savunmayı teklif etti, ancak Osman, \"Benim yüzümden kan dökülmesini istemiyorum\" dedi (s. 166). İsyancılar Osman'ın su kaynağını kestiğinde, Ali ona üç su tulumu gönderdi ve bunun sonucunda Beni Haşim ve Beni Emevi kabilelerinden adamlar yaralandı (s. 166). Sahabelerin önde gelenleri, aralarında Hasan ve Abdullah ibn el-Zübeyr'in de bulunduğu oğullarını onu korumak için gönderdiler ve Hasan yaralandı (s. 166)."
  id: "Pengepungan terhadap Utsman semakin intensif hingga ia terhalang untuk salat di masjid. Ali menawarkan untuk melindunginya dengan lima ratus orang bersenjata, tetapi Utsman berkata, \"Aku tidak ingin darah tertumpah karena aku\" (hlm. 166). Ketika para pemberontak memutus pasokan air Utsman, Ali mengirimkan tiga kantung air kepadanya, dan akibatnya, orang-orang dari Bani Hasyim dan Bani Umayyah terluka (hlm. 166). Para Sahabat senior mengirimkan putra-putra mereka untuk melindunginya, termasuk al-Hasan dan Abdullah ibn al-Zubayr, dan al-Hasan terluka (hlm. 166)."
