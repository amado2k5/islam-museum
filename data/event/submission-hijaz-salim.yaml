label: { ar: "خضوع الحجاز للعثمانيين", en: "Submission of the Hijaz to the Ottomans", es: "La sumisión del Hiyaz a los otomanos", fr: "Soumission du Hedjaz aux Ottomans", ur: "حجاز کو عثمانیوں کے حوالے کرنا" }
summary:
  ar: "كانت الحجاز تابعة للدولة المملوكية، فلما علم شريف مكة بركات بن محمد بمقتل السلطان قانصوه الغوري ونائبه طومان باي بادر إلى تقديم السمع والطاعة إلى السلطان سليم الأول وسلّمه مفاتيح الكعبة وبعض الآثار، فأقره سليم أميراً على مكة والحجاز ومنحه صلاحيات واسعة. وبذلك صار السلطان العثماني خادماً للحرمين الشريفين وأوقفت الدولة أوقافاً كثيرة على الأماكن المقدسة كانت إيراداتها تصب في خزانة مستقلة بالقصر السلطاني، وأدى ضم الحجاز إلى بسط السيادة العثمانية على البحر الأحمر فدُفع الخطر البرتغالي عن الحجاز وسواحله حتى نهاية القرن الثامن عشر {cite:dawlat-uthmaniyya-salabi p. 191}."
  en: "After the Mamluk collapse the Sharif of Mecca, Barakat ibn Muhammad, submitted to Selim I and handed him the keys of the Kaaba; Selim confirmed him as emir of Mecca and the Hijaz, became guardian of the two sanctuaries and extended Ottoman sovereignty over the Red Sea, repelling the Portuguese threat until the late eighteenth century {cite:dawlat-uthmaniyya-salabi p. 191}."
  es: "Tras el colapso de los mamelucos, el jerife de La Meca, Barakat ibn Muhammad, se sometió a Selim I y le entregó las llaves de la Kaaba; Selim lo confirmó como emir de La Meca y el Hiyaz, se convirtió en guardián de los dos santuarios y extendió la soberanía otomana sobre el Mar Rojo, repeliendo la amenaza portuguesa hasta finales del siglo XVIII {cite:dawlat-uthmaniyya-salabi p. 191}."
  fr: "Après l'effondrement des Mamelouks, le chérif de La Mecque, Barakat ibn Muhammad, se soumit à Selim Ier et lui remit les clés de la Kaaba; Selim le confirma comme émir de La Mecque et du Hedjaz, devint gardien des deux sanctuaires et étendit la souveraineté ottomane sur la mer Rouge, repoussant la menace portugaise jusqu'à la fin du XVIIIe siècle {cite:dawlat-uthmaniyya-salabi p. 191}."
  ur: "مملوک کے خاتمے کے بعد مکہ شریف کے برکات ابن محمد نے سلیم اول کے سامنے عرض کیا اور کعبہ کی چابیاں ان کے حوالے کیں۔ سیلم نے اسے مکہ اور حجاز کے امیر کے طور پر تصدیق کی، دو حرموں کے محافظ بن گئے اور بحیرہ احمر پر عثمانی خودمختاری کو بڑھایا، اٹھارویں صدی کے آخر تک پرتگالی خطرے کو پسپا کرتے رہے۔ 191}۔"
