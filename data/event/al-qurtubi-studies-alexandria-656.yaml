class: event
kind: other
label:
  ar: "القرطبي يسمع المفهم على مؤلفه بالإسكندرية، سنة ٦٥٦هـ"
  en: "Al-Qurtubi hears part of al-Mufhim from its author at Alexandria, 656/1258"
  ur: "قرطبی نے اسکندریہ میں مؤلف سے «المفھم» کا حصہ سنا، 656ھ/1258ء"
summary:
  ar: "سمع القرطبي من الشيخ أبي العباس أحمد بن عمر القرطبي، نزيل الإسكندرية وصاحب «المفهم في شرح مسلم»، بعض هذا الشرح {cite:nafh-tib-maqqari 2/211}؛ وحدث الشيخ بمصر ومات بالثغر في رابع عشر ذي القعدة سنة ست وخمسين وستمائة {cite:siyar-alam-nubala 17/98}. وسمع القرطبي أيضًا عن أبي الحسن علي بن محمد بن علي بن حفص اليحصبي، وعن الحافظ أبي علي الحسن بن محمد بن محمد البكري {cite:nafh-tib-maqqari 2/211}."
  en: "Al-Qurtubi heard part of al-Mufhim, the commentary on Sahih Muslim, from its author Abu al-Abbas Ahmad ibn Umar al-Qurtubi (Ibn al-Muzayyin), the famous hadith scholar resident at Alexandria {cite:nafh-tib-maqqari 2/211}; the master taught in Egypt and died at the thaghr on 14 Dhu al-Qa'da 656 {cite:siyar-alam-nubala 17/98}. Al-Qurtubi also heard from Abu al-Hasan Ali ibn Muhammad al-Yahsubi and the hafiz Abu Ali al-Hasan ibn Muhammad al-Bakri {cite:nafh-tib-maqqari 2/211}."
  ur: "قرطبی نے صحیح مسلم کی شرح «المفھم» کا ایک حصہ اس کے مؤلف ابو العباس احمد بن عمر قرطبی (ابن مزین) سے سنا جو اسکندریہ کے معروف محدث مقیم تھے {cite:nafh-tib-maqqari 2/211}؛ شیخ نے مصر میں حدیث پڑھائی اور 14 ذوالقعدہ 656ھ کو ثغر میں فوت ہوئے {cite:siyar-alam-nubala 17/98}۔ قرطبی نے ابو الحسن علی بن محمد یحصبی اور حافظ ابو علی حسن بن محمد بکری سے بھی سماعت کی {cite:nafh-tib-maqqari 2/211}۔"
