id: event/conquest-of-azerbaijan
class: event
kind: conquest
label: { ar: "فتح أذربيجان", en: "Conquest of Azerbaijan" }
summary:
  ar: "قدم المغيرة بن شعبة الكوفة والياً من قبل عمر ومعه كتاب إلى حذيفة بن اليمان بولاية أذربيجان فسار حتى أتى أردبيل وهي مدينة أذربيجان وبها مرزبانها وإليها جباية خراجها وكان المرزبان قد جمع إليه المقاتلة من أهل باجروان وميمذ والنرير وسراط والشيز والميانج وغيرهم فقاتلوا المسلمين قتالاً شديداً أياماً ثم صالح المرزبان حذيفة عن جميع أهل أذربيجان على ثمانمائة ألف درهم وزن ثمانية على أن لا يقتل منهم أحد ولا يسبى ولا يهدم بيت نار ولا يعرض لأكراد البلاسجان وسبلان وساترودان ولا يمنع أهل الشيز خاصة من الزفن في أعيادهم وإظهار ما كانوا يظهرونه ثم غزا موقان وجيلان فأوقع بهم وصالحهم على أتاوة وعزله عمر فولى عتبة بن فرقد فوجد أهل أردبيل على العهد وانتقضت عليه نواح فغزاها فظفر وغنم وروي عن الواقدي أن المغيرة فتحها عنوة سنة اثنتين وعشرين وعن ابن الكلبي عن أبي مخنف أن المغيرة فتحها سنة عشرين فكفروا ففتحها الأشعث بن قيس وصالحهم على صلح المغيرة ومضى صلح الأشعث وقال الزهري صالحوه على مائة ألف وكتب عمر إنكم بأرض يخالط طعام أهلها ولباسهم الميتة فلا تأكلوا إلا ذكياً ولا تلبسوا إلا زكياً ثم لما عزل الوليد عتبة نقضوا فغزاهم سنة خمس وعشرين فصالحهم على صلح حذيفة ثم انتقضت على الأشعث بن قيس فتتبعها حاناً حاناً والحان الحائر في كلامهم ففتحها على مثل الصلح وأسكنها عرباً من أهل العطاء والديوان وأمرهم بدعاء الناس إلى الإسلام ثم غزاها سعيد بن العاص فأوقع بموقان وجيلان وتجمع له بناحية أرم خلق من الأرمن وأهل أذربيجان فوجه إليهم جرير بن عبد الله البجلي فهزمهم وأخذ رئيسهم فصلبه على قلعة باجروان."
  en: "Al-Mughira came to Kufa as Umar's governor carrying a letter appointing Hudhayfa ibn al-Yaman to Azerbaijan; he marched to Ardabil — the province's city, seat of its marzban and its kharaj — where the marzban had gathered fighters from Bajirwan, Maymadh, al-Narir, Sarat, al-Shiz, al-Miyanij and beyond; they fought the Muslims hard for days, then the marzban treated for all Azerbaijan at eight hundred thousand dirhams weight-eight — no one killed, none captive, no fire-temple razed, and no exposure to the Kurds of Balasajan, Sabalan and Satrudan, nor barring the people of al-Shiz from their feast-music and wonted display; he then raided Muqan and Jilan to tribute. Umar dismissed him for Utba ibn Farqad, who found Ardabil on the covenant but its borderlands in breach — he campaigned, won and plundered. Variants: Waqidi has al-Mughira storm it in 22, Abu Mikhnaf in 20 then al-Ash'ath ibn Qays re-conquering on the same terms, and al-Zuhri gives a hundred-thousand treaty. Umar wrote them to eat only dhabiha and wear only pure fur in that carrion-mixed land. Al-Walid ibn Uqba's dismissal of Utba brought another breach, his 25 AH campaign restoring Hudhayfa's terms; when it rose against al-Ash'ath ibn Qays he hunted it 'meadow by meadow' — the han of their speech — resettled Arab stipendaries to preach Islam, and Sa'id ibn al-As's raids on Muqan and Jilan ended with Jarir al-Bajali crucifying the Armenian-Azerbaijani chief on Bajirwan's keep."
