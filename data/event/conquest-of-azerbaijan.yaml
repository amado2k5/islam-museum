id: event/conquest-of-azerbaijan
class: event
kind: conquest
label: { ar: "فتح أذربيجان", en: "Conquest of Azerbaijan", es: "Conquista de Azerbaiyán", fr: "Conquête de l'Azerbaïdjan", ur: "آذربائیجان کی فتح", tr: "Azerbaycan'ın Fethi", id: "Penaklukan Azerbaijan" }
summary:
  ar: "قدم المغيرة بن شعبة الكوفة والياً من قبل عمر ومعه كتاب إلى حذيفة بن اليمان بولاية أذربيجان فسار حتى أتى أردبيل وهي مدينة أذربيجان وبها مرزبانها وإليها جباية خراجها وكان المرزبان قد جمع إليه المقاتلة من أهل باجروان وميمذ والنرير وسراط والشيز والميانج وغيرهم فقاتلوا المسلمين قتالاً شديداً أياماً ثم صالح المرزبان حذيفة عن جميع أهل أذربيجان على ثمانمائة ألف درهم وزن ثمانية على أن لا يقتل منهم أحد ولا يسبى ولا يهدم بيت نار ولا يعرض لأكراد البلاسجان وسبلان وساترودان ولا يمنع أهل الشيز خاصة من الزفن في أعيادهم وإظهار ما كانوا يظهرونه ثم غزا موقان وجيلان فأوقع بهم وصالحهم على أتاوة وعزله عمر فولى عتبة بن فرقد فوجد أهل أردبيل على العهد وانتقضت عليه نواح فغزاها فظفر وغنم وروي عن الواقدي أن المغيرة فتحها عنوة سنة اثنتين وعشرين وعن ابن الكلبي عن أبي مخنف أن المغيرة فتحها سنة عشرين فكفروا ففتحها الأشعث بن قيس وصالحهم على صلح المغيرة ومضى صلح الأشعث وقال الزهري صالحوه على مائة ألف وكتب عمر إنكم بأرض يخالط طعام أهلها ولباسهم الميتة فلا تأكلوا إلا ذكياً ولا تلبسوا إلا زكياً ثم لما عزل الوليد عتبة نقضوا فغزاهم سنة خمس وعشرين فصالحهم على صلح حذيفة ثم انتقضت على الأشعث بن قيس فتتبعها حاناً حاناً والحان الحائر في كلامهم ففتحها على مثل الصلح وأسكنها عرباً من أهل العطاء والديوان وأمرهم بدعاء الناس إلى الإسلام ثم غزاها سعيد بن العاص فأوقع بموقان وجيلان وتجمع له بناحية أرم خلق من الأرمن وأهل أذربيجان فوجه إليهم جرير بن عبد الله البجلي فهزمهم وأخذ رئيسهم فصلبه على قلعة باجروان."
  en: "Al-Mughira came to Kufa as Umar's governor carrying a letter appointing Hudhayfa ibn al-Yaman to Azerbaijan; he marched to Ardabil — the province's city, seat of its marzban and its kharaj — where the marzban had gathered fighters from Bajirwan, Maymadh, al-Narir, Sarat, al-Shiz, al-Miyanij and beyond; they fought the Muslims hard for days, then the marzban treated for all Azerbaijan at eight hundred thousand dirhams weight-eight — no one killed, none captive, no fire-temple razed, and no exposure to the Kurds of Balasajan, Sabalan and Satrudan, nor barring the people of al-Shiz from their feast-music and wonted display; he then raided Muqan and Jilan to tribute. Umar dismissed him for Utba ibn Farqad, who found Ardabil on the covenant but its borderlands in breach — he campaigned, won and plundered. Variants: Waqidi has al-Mughira storm it in 22, Abu Mikhnaf in 20 then al-Ash'ath ibn Qays re-conquering on the same terms, and al-Zuhri gives a hundred-thousand treaty. Umar wrote them to eat only dhabiha and wear only pure fur in that carrion-mixed land. Al-Walid ibn Uqba's dismissal of Utba brought another breach, his 25 AH campaign restoring Hudhayfa's terms; when it rose against al-Ash'ath ibn Qays he hunted it 'meadow by meadow' — the han of their speech — resettled Arab stipendaries to preach Islam, and Sa'id ibn al-As's raids on Muqan and Jilan ended with Jarir al-Bajali crucifying the Armenian-Azerbaijani chief on Bajirwan's keep."
  es: "Al-Mughira llegó a Kufa como gobernador de Umar portando una carta que nombraba a Hudhayfa ibn al-Yaman como gobernador de Azerbaiyán; marchó a Ardabil —la ciudad de la provincia, sede de su marzban y su kharaj— donde el marzban había reunido combatientes de Bajirwan, Maymadh, al-Narir, Sarat, al-Shiz, al-Miyanij y más allá; lucharon encarnizadamente contra los musulmanes durante días, luego el marzban pagó por todo Azerbaiyán ochocientos mil dirhams de peso ocho; nadie murió, nadie fue hecho prisionero, ningún templo de fuego fue arrasado, no hubo exposición a los kurdos de Balasajan, Sabalan y Satrudan, ni se impidió a la gente de al-Shiz sus festines musicales y exhibiciones habituales; luego saqueó Muqan y Jilan para cobrar tributo. Umar lo destituyó y nombró a Utba ibn Farqad, quien encontró Ardabil en el pacto pero sus tierras fronterizas violadas; hizo campaña, venció y saqueó. Variantes: Waqidi dice que al-Mughira la asaltó en el 22, Abu Mikhnaf en el 20, luego al-Ash'ath ibn Qays la reconquistó en los mismos términos, y al-Zuhri da un tratado de cien mil. Umar les escribió que comieran solo dhabiha y vistieran solo pieles puras en esa tierra mezclada con carroña. El despido de Utba por parte de Al-Walid ibn Uqba provocó otra ruptura, su campaña del 25 AH restauró los términos de Hudhayfa; cuando se levantó contra al-Ash'ath ibn Qays, la persiguió 'prado por prado' —el han de su discurso— reasentó a estipendios árabes para predicar el Islam, y las incursiones de Sa'id ibn al-As en Muqan y Jilan terminaron con Jarir al-Bajali crucificando al jefe armenio-azerbaiyano en el castillo de Bajirwan."
  fr: "Al-Mughira arriva à Kufa en tant que gouverneur d'Umar, porteur d'une lettre nommant Hudhayfa ibn al-Yaman en Azerbaïdjan; il marcha sur Ardabil — la ville de la province, siège de son marzban et de son kharaj — où le marzban avait rassemblé des combattants de Bajirwan, Maymadh, al-Narir, Sarat, al-Shiz, al-Miyanij et d'ailleurs; ils combattirent durement les musulmans pendant des jours, puis le marzban traita tout l'Azerbaïdjan pour huit cent mille dirhams, sans qu'aucun ne soit tué, aucun prisonnier, aucun temple du feu rasé, et sans exposition aux Kurdes de Balasajan, Sabalan et Satrudan, ni interdiction pour les habitants d'al-Shiz de leurs festins, musiques et manifestations habituelles; il pilla ensuite Muqan et Jilan pour exiger un tribut. Umar le destitua au profit d'Utba ibn Farqad, qui trouva Ardabil sous contrat, mais ses frontières en violation. Il mena campagne, remporta la victoire et pilla. Variantes: Waqidi fait prendre d'assaut la ville par al-Mughira en 22, Abu Mikhnaf en 20, puis al-Ash'ath ibn Qays la reconquiert aux mêmes conditions, tandis qu'al-Zuhri mentionne un traité de cent mille nairas. Umar leur ordonna de ne manger que du dhabiha et de ne porter que de la fourrure pure dans cette région jonchée de charognes. Le renvoi d'Utba par al-Walid ibn Uqba entraîna une nouvelle violation du traité, sa campagne de 25 AH rétablissant les conditions d'Hudhayfa. Lorsque le pays se souleva contre al-Ash'ath ibn Qays, il le traqua « prairie par prairie » — le han de leur discours —, réinstalla des suppléants arabes pour prêcher l'islam, et les raids de Sa'id ibn al-As sur Muqan et Jilan se terminèrent par la crucifixion du chef arméno-azerbaïdjanais par Jarir al-Bajali sur le donjon de Bajirwan."
  ur: "المغیرہ عمر کے گورنر کے طور پر کوفہ آیا جس کے پاس ایک خط تھا جس میں حذیفہ بن ال یمان کو آذربائیجان میں مقرر کیا گیا تھا۔ اس نے اردبیل کی طرف مارچ کیا - صوبے کا شہر، اس کے مرزبان اور اس کے خراج کا مقام - جہاں مرزبان نے بجیروان، میمد، النیر، سرت، الشز، المیانیج اور اس سے آگے کے جنگجوؤں کو اکٹھا کیا تھا۔ انہوں نے مسلمانوں سے کئی دن تک جنگ کی، پھر مرزبان نے تمام آذربائیجان کے ساتھ آٹھ لاکھ درہم وزن میں سلوک کیا - نہ کوئی مارا گیا، نہ کوئی اسیر ہوا، نہ کوئی آتش گیر خانہ گرایا گیا، اور نہ ہی بالساجان، سبلان اور سترودان کے کردوں سے کوئی رابطہ ہوا، اور نہ ہی الشز کے لوگوں کو ان کی جیتی ہوئی دعوتوں سے روکا۔ اس کے بعد اس نے خراج تحسین پیش کرنے کے لیے مقان اور جیلان پر چھاپہ مارا۔ عمر نے اسے عتبہ بن فرقد کے لیے برطرف کر دیا، جس نے اردبیل کو عہد پر پایا لیکن اس کی سرحدوں کی خلاف ورزی کی - اس نے مہم چلائی، جیتی اور لوٹ مار کی۔ متغیرات: واقدی نے المغیرہ نے 22 میں، ابو مخنف نے 20 میں پھر اشعث بن قیس نے انہی شرائط پر دوبارہ فتح کیا، اور الزہری نے ایک لاکھ کا معاہدہ کیا۔ عمر نے انہیں لکھا کہ وہ صرف ذبیحہ کھائیں اور مردار والی زمین میں صرف خالص کھال پہنیں۔ الولید بن عقبہ کے عتبہ کی برطرفی نے ایک اور خلاف ورزی کی، اس کی 25 ہجری کی مہم نے حذیفہ کی شرائط کو بحال کیا۔ جب یہ اشعث ابن قیس کے خلاف اٹھ کھڑا ہوا تو اس نے اسے 'گھاس کا میدان' کا شکار کیا - ان کی تقریر کا ہان - اسلام کی تبلیغ کے لیے عربوں کے وظیفوں کو دوبارہ آباد کیا، اور سعید بن العاص کے مقان اور جیلان پر چھاپے جریر البجلی کے آرمینیائی سردار باجیروان کو مصلوب کرنے کے ساتھ ختم ہوئے۔"
  tr: "Ömer'in emriyle Kufa'ya vali olarak gelen El-Muğira ibn Şu'ba, Hudeyfa ibn el-Yaman'a Azerbaycan valisi olarak atanmasını bildiren bir mektup taşıdı. Azerbaycan'da valisinin ikamet ettiği ve vergilerinin toplandığı Erdebil şehrine ulaşana kadar yürüdü. Vali, Bârvan, Meymad, el-Narir, Sırat, el-Şiz, el-Miyanj ve diğer bölgelerden savaşçılar toplamıştı. Birkaç gün boyunca Müslümanlarla şiddetli bir şekilde savaştılar. Ardından vali, Azerbaycan halkının tamamı adına Hudeyfa ile 800.000 dirhem (sekiz ağırlığında) karşılığında, hiçbirinin öldürülmemesi veya esir alınmaması, hiçbir ateş tapınağının yıkılmaması, Belaşcan, Sablan ve Satrudan Kürtlerine zarar verilmemesi ve özellikle el-Şiz halkının bayramlarını kutlamalarının ve geleneklerini sergilemelerinin engellenmemesi şartıyla barış yaptı. Sonra Muğan ve Gilan'a baskın düzenledi, onları yenerek haraç karşılığında onlarla barış yaptı. Ömer onu görevden aldı ve Utba ibn Farqad'ı atadı. Utba, Erdebil halkının hâlâ antlaşmaya bağlı olduğunu, ancak bazı isyanların çıktığını gördü. Onlara baskın düzenledi, zafer kazandı ve ganimet elde etti. El-Vakidi'nin rivayetine göre, Muğira 22 Hicri yılında burayı zorla ele geçirdi ve İbn el-Kalbi de Ebu Mikhnaf'tan naklederek aynı şeyi rivayet etti. Yirmi kişiydiler, bu yüzden inkâr ettiler. Bunun üzerine Aş'at bin Kays orayı fethetti ve Muğira barışı esasına göre onlarla barış yaptı. Aş'at'ın barışı devam etti ve Zühri, \"Onunla yüz bin kişi esasına göre barış yapın\" dedi. Ömer ise, \"Siz öyle bir diyardasınız ki, halkının yiyecekleri ve giysileri leşle karışmış durumda. Bu yüzden, ritüel olarak temiz olandan başka bir şey yemeyin ve ritüel olarak temiz olandan başka bir şey giymeyin\" diye yazdı. Sonra Velid, Utbe'yi görevden aldığında, antlaşmayı bozdular. Bunun üzerine Velid, yirmi beşinci yılda onlara baskın düzenledi ve Hudeyfa barışı esasına göre onlarla barış yaptı. Sonra Aş'at bin Kays ile yaptıkları antlaşmayı bozdular, bu yüzden onları teker teker takip etti ve konuşmalarında \"el-han\" kelimesi karışıyordu, bu yüzden aynı barış anlaşması temelinde orayı fethetti ve oraya zümre ve Divan halkından Arapları yerleştirdi ve onlara halkı İslam'a davet etmelerini emretti. Sonra Said bin el-Aas orayı bastı ve Mukan ile Gilan'a saldırdı ve Aram bölgesinde bir grup Ermeni ve Azerbaycanlı onun için toplandı, bu yüzden Cerir bin Abdullah el-Bajali'yi onlara gönderdi ve onları yenerek liderlerini yakaladı ve Bajran kalesinde çarmıha gerdi."
  id: "Al-Mughira ibn Shu'ba tiba di Kufa sebagai gubernur atas perintah Umar, membawa surat kepada Hudhayfa ibn al-Yaman yang menunjuknya sebagai gubernur Azerbaijan. Ia berbaris hingga mencapai Ardabil, sebuah kota di Azerbaijan, tempat gubernurnya tinggal dan menerima pajak. Gubernur telah mengumpulkan pejuang dari penduduk Bajrawan, Maymadh, al-Narir, Sirat, al-Shiz, al-Miyanj, dan lainnya. Mereka bertempur sengit melawan kaum Muslim selama beberapa hari. Kemudian gubernur berdamai dengan Hudhayfa atas nama seluruh rakyat Azerbaijan dengan imbalan 800.000 dirham, seberat delapan, dengan syarat tidak seorang pun dari mereka akan dibunuh atau ditawan, tidak ada kuil api yang akan dihancurkan, bahwa orang Kurdi di Balasjan, Sablan, dan Satrudan akan dirugikan, dan bahwa penduduk al-Shiz khususnya tidak akan dicegah untuk merayakan festival mereka dan menampilkan adat istiadat mereka yang biasa. Kemudian ia menyerbu Mughan dan Gilan, mengalahkan mereka dan berdamai dengan mereka dengan imbalan upeti. Umar memecatnya dan mengangkat Utba bin Farqad. Utba mendapati penduduk Ardabil masih terikat oleh perjanjian tersebut, tetapi beberapa pemberontakan meletus. Ia menyerbu mereka, meraih kemenangan, dan memperoleh harta rampasan. Diriwayatkan oleh al-Waqidi bahwa al-Mughira menaklukkannya dengan kekerasan pada tahun 22 H, dan oleh Ibn al-Kalbi, berdasarkan riwayat Abu Mikhnaf, bahwa al-Mughira menaklukkannya pada tahun 22 H. Dua puluh, sehingga mereka mengingkari, lalu al-Ash’ath bin Qais menaklukkannya dan berdamai dengan mereka berdasarkan perdamaian al-Mughira, dan perdamaian al-Ash’ath berlanjut, dan al-Zuhri berkata, “Berdamailah dengannya berdasarkan seratus ribu,” dan Umar menulis, “Kalian berada di negeri di mana makanan dan pakaian penduduknya bercampur dengan bangkai, maka jangan makan kecuali yang suci secara ritual dan jangan memakai apa pun kecuali yang suci secara ritual.” Kemudian ketika al-Walid membubarkan Utbah, mereka melanggar perjanjian, maka ia menyerang mereka pada tahun ke dua puluh lima dan berdamai dengan mereka berdasarkan perdamaian Hudhayfa. Kemudian mereka melanggar perjanjian dengan al-Ash’ath bin Qais, sehingga ia mengejar mereka satu per satu, dan kata “al-han” menjadi kabur dalam ucapan mereka, sehingga ia menaklukkannya berdasarkan perjanjian damai yang sama dan menempatkan orang-orang Arab dari kalangan penerima tunjangan dan Diwan di sana dan memerintahkan mereka untuk menyeru penduduk kepada Islam. Kemudian Sa’id bin al-Aas menyerbu dan menyerang Muqan dan Gilan, dan sekelompok orang Armenia dan Azerbaijan berkumpul untuk melawannya di wilayah Aram, sehingga ia mengirim Jarir bin Abdullah al-Bajali kepada mereka, dan ia mengalahkan mereka dan menangkap pemimpin mereka dan menyalibnya di benteng Bajrawan."
