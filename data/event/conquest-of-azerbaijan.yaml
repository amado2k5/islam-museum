label: { ar: "فتح أذربيجان", en: "Conquest of Azerbaijan" }
summary:
  ar: "قدم المغيرة بن شعبة الكوفة والياً من قبل عمر ومعه كتاب إلى حذيفة بن اليمان بولاية أذربيجان فسار حتى أتى أردبيل وهي مدينة أذربيجان وبها مرزبانها وإليها جباية خراجها وكان المرزبان قد جمع إليه المقاتلة من أهل باجروان وميمذ والنرير وسراط والشيز والميانج وغيرهم فقاتلوا المسلمين قتالاً شديداً أياماً ثم صالح المرزبان حذيفة عن جميع أهل أذربيجان على ثمانمائة ألف درهم وزن ثمانية على أن لا يقتل منهم أحد ولا يسبى ولا يهدم بيت نار ولا يعرض لأكراد البلاسجان وسبلان وساترودان."
  en: "Al-Mughira came to Kufa as Umar's governor carrying a letter appointing Hudhayfa ibn al-Yaman to Azerbaijan; he marched to Ardabil — the province's city, seat of its marzban and its kharaj — where the marzban had gathered fighters from Bajirwan, Maymadh, al-Narir, Sarat, al-Shiz, al-Miyanij and beyond; they fought the Muslims hard for days, then the marzban treated for all Azerbaijan at eight hundred thousand dirhams weight-eight — no one killed, none captive, no fire-temple razed, and no exposure to the Kurds of Balasajan, Sabalan and Satrudan."
