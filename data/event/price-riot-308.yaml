label: { ar: "فتنة الأسعار على باب حامد بن العباس", en: "The Price Riot at the Gate of Hamid ibn al-Abbas", es: "El motín del precio en la puerta de Hamid ibn al-Abbas", fr: "L'émeute des prix à la porte d'Hamid ibn al-Abbas", ur: "حامد بن العباس کے دروازے پر قیمت کا ہنگامہ", tr: "Hamid ibn al-Abbas'ın kapısında fahiş fiyat uygulaması.", id: "Penetapan harga yang tidak wajar di depan pintu rumah Hamid ibn al-Abbas." }
summary:
  ar: "في آخر سنة ثمان وثلاثمائة تحركت الأسعار فاضطربت العامة لذلك وقصدوا باب حامد بن العباس، فخرج إليهم غلمانه فحاربوهم فقتل من العوام جماعة، ومنعوا يوم الجمعة الإمام من الصلاة وهدموا المنابر وحطبوا مجالس الشرط وأحرقوا الحبوس، وأمر السلطان بمحاربة العوام فأُخذوا وضُربوا وفُسخ ضمان حامد وبِيع الخبز بنقصان خمسة دنانير فسكنوا؛ وفي تموز هذه السنة برد الهواء حتى نزل الناس من السطوح وتدثروا باللحف {cite:muntazam-ibn-al-jawzi p. 446}."
  en: "At the end of 308 prices spiked and the mob surged on Hamid ibn al-Abbas's gate — his ghilman killed people, the Imam was barred from Friday prayer, minbars demolished, police platforms wrecked and prisons burned; the Sultan ordered them fought, Hamid's tax-farm was cancelled and bread sold five dinars lower; that July the air turned so cold people left the rooftops and wrapped themselves in quilts {cite:muntazam-ibn-al-jawzi p. 446}."
  es: "A finales del año 308, los precios se dispararon y la turba se abalanzó sobre la puerta de Hamid ibn al-Abbas; su ghilman mató gente, se le prohibió al imán la oración del viernes, se demolieron los minbares, se destrozaron las plataformas policiales y se incendiaron las prisiones; el sultán ordenó que se les combatiera, se canceló la recaudación de impuestos de Hamid y el pan se vendió cinco dinares más barato; ese julio el aire se volvió tan frío que la gente abandonó los tejados y se envolvió en mantas {cite:muntazam-ibn-al-jawzi p. 446}."
  fr: "À la fin de l'année 308, les prix s'envolèrent et la foule se déchaîna sur la porte d'Hamid ibn al-Abbas — ses ghilman tuèrent des gens, l'imam fut interdit de prière du vendredi, les minbars furent démolis, les plates-formes de police saccagées et les prisons incendiées; le sultan ordonna de les combattre, la ferme fiscale d'Hamid fut annulée et le pain se vendit cinq dinars de moins; en juillet de cette année-là, l'air devint si froid que les gens quittèrent les toits et s'enveloppèrent dans des couvertures {cite:muntazam-ibn-al-jawzi p. 446}."
  ur: "308 کے آخر میں قیمتوں میں اضافہ ہوا اور ہجوم حامد بن العباس کے دروازے پر چڑھ آیا - اس کے غلمان نے لوگوں کو مار ڈالا، امام کو جمعہ کی نماز سے روک دیا گیا، منبر گرائے گئے، پولیس کے پلیٹ فارم کو تباہ کر دیا گیا اور جیلیں جلا دی گئیں۔ سلطان نے انہیں لڑنے کا حکم دیا، حامد کا ٹیکس فارم منسوخ کر دیا گیا اور روٹی پانچ دینار کم فروخت کی گئی۔ کہ جولائی کی ہوا اتنی ٹھنڈی ہو گئی کہ لوگ چھتوں کو چھوڑ کر لحاف میں لپٹے ہوئے تھے۔ 446}۔"
  tr: "308 yılının son yılında fiyatlar dalgalanınca halk bundan rahatsız oldu ve Hamid bin Abbas'ın kapısına dayandı. Hizmetkarları onlara saldırdı ve onlarla kavga etti, böylece bir grup halk öldürüldü. Cuma günü imamın namaz kılmasını engellediler, minberleri yıktılar, polis karakollarını yıktılar ve hapishaneleri yaktılar. Sultan, halkın dövülmesini emretti, böylece yakalanıp dövüldüler ve Hamid'in kefaleti bozuldu, ekmek beş dinar zararına satıldı, böylece halk sakinleşti. Bu yılın Temmuz ayında hava o kadar soğuktu ki insanlar çatılardan inip battaniyelerle örtündüler."
  id: "Pada tahun terakhir tahun 308, harga-harga berfluktuasi, sehingga rakyat jelata merasa terganggu dan mendatangi rumah Hamid bin Al-Abbas. Para pelayannya keluar dan menyerang mereka, sehingga sekelompok rakyat jelata terbunuh. Pada hari Jumat, mereka mencegah imam untuk salat, dan mereka menghancurkan mimbar-mimbar, serta merobohkan ruang-ruang polisi dan membakar penjara-penjara. Sultan memerintahkan agar rakyat jelata diperangi, sehingga mereka ditangkap dan dipukuli, dan jaminan Hamid dilanggar, serta roti dijual dengan harga rugi lima dinar, sehingga mereka tenang. Pada bulan Juli tahun itu, udara sangat dingin sehingga orang-orang turun dari atap dan menutupi diri mereka dengan selimut."
