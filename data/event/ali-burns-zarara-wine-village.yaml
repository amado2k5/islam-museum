id: event/ali-burns-zarara-wine-village
class: event
kind: other
label: { ar: "إحراق علي قرية زرارة التي تباع فيها الخمر", en: "Ali burns the village of Zarara where wine was sold", es: "Ali incendia el pueblo de Zarara, donde se vendía vino.", fr: "Ali incendie le village de Zarara où l'on vendait du vin.", ur: "علی نے زرارا گاؤں کو جلایا جہاں شراب فروخت ہوتی تھی۔", tr: "Ali, alkol satılan Zarara köyünü yakıp yıktı.", id: "Ali membakar desa Zarara tempat penjualan alkohol berlangsung." }
summary:
  ar: "مرّ علي بقرية في الكوفة تُدعى زرارة يُلحم فيها ويُباع فيها الخمر، فقال: «علي بالنيران، أضرموها فيها، فإن الخبيث يأكل بعضه بعضًا» {cite:sallabi-ali-vol1 p. 269}، فاحترقت من غربيها حتى بلغت بستانًا. ينقل الصلابي الخبر عن أبي عبيد القاسم بن سلام في كتاب الأموال، ويشير إلى أن زرارة محلة في الكوفة سُميت باسم بانيها زرارة بن زيد {cite:sallabi-ali-vol1 p. 269}."
  en: "Ali passed a quarter of Kufa called Zarara where meat was sold and wine too, and ordered it set on fire, saying the wicked eat each other; the fire spread from its western side until it reached an orchard. Al-Sallabi takes the report from Abu Ubayd al-Qasim ibn Sallam's Kitab al-Amwal {cite:sallabi-ali-vol1 p. 269}."
  es: "Ali pasó por un barrio de Kufa llamado Zarara, donde se vendía carne y vino, y ordenó prenderle fuego, diciendo que los malvados se devoraban entre sí; el fuego se extendió desde su lado occidental hasta llegar a un huerto. Al-Sallabi recoge este relato del Kitab al-Amwal de Abu Ubayd al-Qasim ibn Sallam {cite:sallabi-ali-vol1 p. 269}."
  fr: "Ali traversa un quartier de Koufa appelé Zarara, où l'on vendait de la viande et du vin, et ordonna d'y mettre le feu, disant que les méchants se dévoraient entre eux; l'incendie se propagea depuis l'ouest jusqu'à un verger. Al-Sallabi rapporte ce récit d'après le Kitab al-Amwal d'Abu Ubayd al-Qasim ibn Sallam (cite: sallabi-ali-vol1 p. 269)."
  ur: "علی نے کوفہ کے ایک چوتھائی حصے سے گزرا جسے زرارہ کہتے ہیں جہاں گوشت بھی فروخت ہوتا تھا اور شراب بھی، اور اسے آگ لگانے کا حکم دیا، اور کہا کہ شریر ایک دوسرے کو کھاتے ہیں۔ آگ اس کی مغربی طرف سے پھیل گئی یہاں تک کہ ایک باغ تک پہنچ گئی۔ السلبی نے ابو عبید القاسم بن سلام کی کتاب الاموال سے رپورٹ لی ہے۔ 269}۔"
  tr: "Ali, Kufa'da kasapların çalıştığı ve şarap satıldığı Zurarah adlı bir köyün yanından geçti. \"Bana ateş getirin ve yakın, çünkü kötüler birbirlerini tüketirler\" dedi. {cite:sallabi-ali-vol1 s. 269} Ateş, batı tarafından yayılarak bir meyve bahçesine ulaştı. El-Sallabi, bu olayı El-Amwal adlı kitabında Ebu Ubeyd el-Kâsım ibn Sallam'dan nakletmiş ve Zurarah'ın, kurucusu Zurarah ibn Zeyd'in adını taşıyan Kufa'da bir mahalle olduğunu belirtmiştir. {cite:sallabi-ali-vol1 s. 269}"
  id: "Ali melewati sebuah desa di Kufa bernama Zurarah, tempat para tukang daging bekerja dan anggur dijual. Ia berkata, “Bawalah api dan nyalakanlah, karena orang-orang jahat saling menghancurkan satu sama lain.” {cite:sallabi-ali-vol1 p. 269} Api menyebar dari sisi baratnya hingga mencapai sebuah kebun. Al-Sallabi meriwayatkan kisah ini dari Abu Ubayd al-Qasim ibn Sallam dalam bukunya, Al-Amwal, dan menunjukkan bahwa Zurarah adalah sebuah lingkungan di Kufa yang dinamai menurut pendirinya, Zurarah ibn Zayd. {cite:sallabi-ali-vol1 p. 269}"
