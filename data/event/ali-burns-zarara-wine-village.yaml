  - tradition: sunni
    id: sunni-book
    summary:
      ar: "يعرض الصلابي الخبر بوصفه إنكارًا من علي على بيع الخمر، ويستشهد بأن علياً كان شديد الإنكار على من باع خمرًا {cite:sallabi-ali-vol1 p. 269}. ولم يرد في الكتاب تعليل لحكم إحراق القرية بغير هذا الإنكار {cite:sallabi-ali-vol1 p. 269}."
      en: "Al-Sallabi presents the act as Ali's strong rejection of selling wine, and gives no other justification for burning the village {cite:sallabi-ali-vol1 p. 269}."
    sources: [source/sallabi-ali-vol1]
  - tradition: academic
    id: academic
    summary:
      ar: "لم يعرض الكتاب تحليلاً أكاديمياً لمشروعية الإحراق أو حدود التعزير بالإحراق على بيع الخمر؛ الخبر في الكتاب مسند إلى كتاب الأموال ومراجع ابن تيمية في الحسبة، والحكم الفقهي يحتاج إلى مرجع محدد (needs_source)."
      en: "The book does not analyse whether burning property for selling wine is lawful; the report rests on Kitab al-Amwal and Ibn Taymiyya's Hisba, and the legal point needs a named source (needs_source)."
