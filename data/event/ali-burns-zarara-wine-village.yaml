id: event/ali-burns-zarara-wine-village
class: event
kind: other
label: { ar: "إحراق علي قرية زرارة التي تباع فيها الخمر", en: "Ali burns the village of Zarara where wine was sold" }
summary:
  ar: "مرّ علي بقرية في الكوفة تُدعى زرارة يُلحم فيها ويُباع فيها الخمر، فقال: «علي بالنيران، أضرموها فيها، فإن الخبيث يأكل بعضه بعضًا» {cite:sallabi-ali-vol1 p. 269}، فاحترقت من غربيها حتى بلغت بستانًا. ينقل الصلابي الخبر عن أبي عبيد القاسم بن سلام في كتاب الأموال، ويشير إلى أن زرارة محلة في الكوفة سُميت باسم بانيها زرارة بن زيد {cite:sallabi-ali-vol1 p. 269}."
  en: "Ali passed a quarter of Kufa called Zarara where meat was sold and wine too, and ordered it set on fire, saying the wicked eat each other; the fire spread from its western side until it reached an orchard. Al-Sallabi takes the report from Abu Ubayd al-Qasim ibn Sallam's Kitab al-Amwal {cite:sallabi-ali-vol1 p. 269}."
