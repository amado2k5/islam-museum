summary:
  ar: "رفض الصدر الأعظم أحمد كوبريللي الصلح مع النمسا والبندقية وسار على رأس جيش لقتال النمسا، فتمكن عام ١٠٧٤هـ أن يفتح أعظم قلعة في النمسا وهي قلعة نوهزل شرقي فيينا في ٢٥ صفر ١٠٧٤هـ/٢٨ سبتمبر ١٦٦٣م {cite:dawlat-uthmaniyya-salabi p. 308}."
  en: "The conquest of Neuhausl (Nové Zámky), Austria's greatest fortress east of Vienna, by Grand Vizier Fazıl Ahmed Köprülü — 25 Safar 1074/28 September 1663 {cite:dawlat-uthmaniyya-salabi p. 308}."
  es: "La conquista de Neuhausl (Nové Zámky), la fortaleza más grande de Austria al este de Viena, por el Gran Visir Fazıl Ahmed Köprülü — 25 Safar 1074/28 de septiembre de 1663 {cite:dawlat-uthmaniyya-salabi p. 308}."
  fr: "La conquête de Neuhausl (Nové Zámky), la plus grande forteresse d'Autriche à l'est de Vienne, par le Grand Vizir Fazıl Ahmed Köprülü — 25 Safar 1074/28 septembre 1663 {cite:dawlat-uthmaniyya-salabi p. 308}."
  ur: "نیوہاؤسل (Nové Zámky) کی فتح، ویانا کے مشرق میں آسٹریا کا سب سے بڑا قلعہ، بذریعہ گرینڈ وزیئر فضل احمد کوپرلو - 25 صفر 1074/28 ستمبر 1663 308}۔"
  tr: "Sadrazam Ahmed Köprülü, Avusturya ve Venedik ile barış yapmayı reddetti ve bir ordunun başında Avusturya'ya karşı savaşmak üzere yürüdü. Hicri 1074 yılında, Viyana'nın doğusundaki Neuhüssle Kalesi'ni, Avusturya'nın en büyük kalesi olarak 25 Safer 1074 Hicri/28 Eylül 1663 Miladi tarihinde fethetmeyi başardı. {cite:dawlat-uthmaniyya-salabi s. 308}"
  id: "Wazir Agung Ahmed Köprülü menolak untuk berdamai dengan Austria dan Venesia dan memimpin pasukan untuk melawan Austria. Pada tahun 1074 H, ia berhasil menaklukkan benteng terbesar di Austria, yaitu Benteng Neuhüssle, di sebelah timur Wina, pada tanggal 25 Safar 1074 H/28 September 1663 M {cite:dawlat-uthmaniyya-salabi p. 308}."
