id: event/the-sorties-of-17-dhu-al-hijja-and-the-night-fight-at-sanaa-288
class: event
kind: other
label:
  ar: "خروج الهادي في 17 من ذي الحجة والقتال الليلي، سنة 288هـ"
  en: "Al-Hadi's sortie of 17 Dhu al-Hijja and the night fight, 288 AH"
  ur: "ہادی کی 17 ذی الحجہ کی مہم اور رات کی لڑائی، 288ھ"
summary:
  ar: "في يوم السبت لسبع عشرة ماضية من ذي الحجة خرج الهادي إلى الميدان وبعث فرقة من خيله تعرضت للقوم فخرجوا إليهم من بيت بوس وحال الليل بينهم، ثم خرج في يوم الجمعة بعد الصلاة بجماعة من الخيل ومعها الرجالة إلى موضع سحدة فقتلوا نفراً من عسكر آل يعفر فيها، وأغارت عساكر القوم من بيت بوس وظهر وغيرها، فاشتد القتال حتى ذهب بعض الليل."
  en: "On Saturday, seventeen days of Dhu al-Hijja gone, al-Hadi went out to the parade ground and sent a party of his horse that challenged the men, who came out to them from Bayt Bus until night came between them; then on a Friday after the prayer he went out with a number of horse, followed by foot, to a place called Sahda and they killed some men of the Al Ya'fur camp there; the men's armies raided from Bayt Bus, Zahr and elsewhere and the fight was hard until part of the night had passed."
  ur: "ذی الحجہ کے سترہ دن گزرنے پر ہفتے کے دن ہادی میدان کی طرف نکلے اور اپنے سواروں کا ایک دستہ بھیجا جس نے مخالفوں کو للکارا تو وہ بیت بوس سے ان کی طرف نکلے یہاں تک کہ رات ان کے بیچ حائل ہو گئی؛ پھر جمعے کے دن نماز کے بعد وہ کچھ سواروں اور ان کے پیچھے پیادوں کے ساتھ سحدہ نامی جگہ نکلے اور وہاں آل یعفر کے پڑاؤ کے کچھ آدمی مارے، اور مخالفوں کے لشکر بیت بوس، ظہر اور دوسری جگہوں سے چڑھ آئے اور رات کا کچھ حصہ گزرنے تک لڑائی سخت رہی۔"
