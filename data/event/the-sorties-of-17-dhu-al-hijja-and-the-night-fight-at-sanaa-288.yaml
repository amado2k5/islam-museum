id: event/the-sorties-of-17-dhu-al-hijja-and-the-night-fight-at-sanaa-288
class: event
kind: other
label:
  ar: "خروج الهادي في 17 من ذي الحجة والقتال الليلي، سنة 288هـ"
  en: "Al-Hadi's sortie of 17 Dhu al-Hijja and the night fight, 288 AH"
  ur: "ہادی کی 17 ذی الحجہ کی مہم اور رات کی لڑائی، 288ھ"
  es: "La salida de Al-Hadi el 17 de Dhu al-Hijja y el combate nocturno, 288 AH."
  fr: "Sortie d'Al-Hadi le 17 Dhu al-Hijja et combat nocturne de l'an 288 AH"
  tr: "Hadi'nin Zilhicce ayının 17'sinde yola çıkışı ve Hicri 288 yılında gerçekleşen gece savaşı."
  id: "Kepergian Al-Hadi pada tanggal 17 Dzul Hijjah dan pertempuran malam hari, pada tahun 288 Hijriah."
summary:
  ar: "في يوم السبت لسبع عشرة ماضية من ذي الحجة خرج الهادي إلى الميدان وبعث فرقة من خيله تعرضت للقوم فخرجوا إليهم من بيت بوس وحال الليل بينهم، ثم خرج في يوم الجمعة بعد الصلاة بجماعة من الخيل ومعها الرجالة إلى موضع سحدة فقتلوا نفراً من عسكر آل يعفر فيها، وأغارت عساكر القوم من بيت بوس وظهر وغيرها، فاشتد القتال حتى ذهب بعض الليل."
  en: "On Saturday, seventeen days of Dhu al-Hijja gone, al-Hadi went out to the parade ground and sent a party of his horse that challenged the men, who came out to them from Bayt Bus until night came between them; then on a Friday after the prayer he went out with a number of horse, followed by foot, to a place called Sahda and they killed some men of the Al Ya'fur camp there; the men's armies raided from Bayt Bus, Zahr and elsewhere and the fight was hard until part of the night had passed."
  ur: "ذی الحجہ کے سترہ دن گزرنے پر ہفتے کے دن ہادی میدان کی طرف نکلے اور اپنے سواروں کا ایک دستہ بھیجا جس نے مخالفوں کو للکارا تو وہ بیت بوس سے ان کی طرف نکلے یہاں تک کہ رات ان کے بیچ حائل ہو گئی؛ پھر جمعے کے دن نماز کے بعد وہ کچھ سواروں اور ان کے پیچھے پیادوں کے ساتھ سحدہ نامی جگہ نکلے اور وہاں آل یعفر کے پڑاؤ کے کچھ آدمی مارے، اور مخالفوں کے لشکر بیت بوس، ظہر اور دوسری جگہوں سے چڑھ آئے اور رات کا کچھ حصہ گزرنے تک لڑائی سخت رہی۔"
  es: "El sábado, diecisiete días después de Dhu al-Hijja, al-Hadi salió al campo de desfiles y envió un grupo de su caballería que desafió a los hombres que salieron a su encuentro desde Bayt Bus hasta que la noche los separó; luego, un viernes después de la oración, salió con varios jinetes, seguidos a pie, a un lugar llamado Sahda y mataron a algunos hombres del campamento de Al Ya'fur; los ejércitos de hombres atacaron desde Bayt Bus, Zahr y otros lugares y la lucha fue dura hasta que pasó parte de la noche."
  fr: "Le samedi 17 Dhu al-Hijja, al-Hadi se rendit sur le terrain de parade et envoya une troupe de cavaliers défier les hommes venus de Bayt Bus jusqu'à la tombée de la nuit. Puis, le vendredi après la prière, il sortit avec une troupe de cavaliers, suivie à pied, vers un endroit appelé Sahda et ils tuèrent des hommes du camp d'Al Ya'fur. Les armées ennemies lancèrent des raids depuis Bayt Bus, Zahr et d'ailleurs, et le combat fut acharné jusqu'à une partie de la nuit."
  tr: "Zilhicce ayının on yedinci günü olan Cumartesi günü, Hadi, meydanlara çıktı ve süvarilerinden bir birliği halkla çatışmaya gönderdi. Halk, Beyt Bos'tan gelerek çatışmaya girdi ve gece çöktü. Cuma günü ise namazdan sonra, bir grup süvari ve piyadeyle birlikte Sahda bölgesine gitti ve orada El Ya'fer kabilesinin askerlerinden birçoğunu öldürdü. Halkın askerleri Beyt Bos, Dahr ve diğer yerlerden baskınlar düzenledi ve çatışmalar gece geç saatlere kadar şiddetlendi."
  id: "Pada hari Sabtu, tanggal tujuh belas Dzul Hijjah, al-Hadi pergi ke medan perang dan mengirimkan detasemen kavaleri untuk menghadapi rakyat. Mereka datang dari Beit Bos, dan malam pun tiba di antara mereka. Kemudian pada hari Jumat, setelah salat, ia pergi dengan sekelompok kavaleri dan tentara infanteri ke tempat Sahda, dan mereka membunuh sejumlah tentara suku Al Ya’far di sana. Tentara rakyat menyerbu dari Beit Bos, Dhahr, dan tempat-tempat lain, dan pertempuran semakin intensif hingga sebagian malam berlalu."
