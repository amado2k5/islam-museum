id: event/disheveled-hair-like-shaytan
kind: other
label:
  ar: الثائر الشعر واللحية كأنه شيطان
  en: Disheveled hair and beard like a shaytan
  ur: بکھرے بال اور داڑھی جیسے شیطان
summary:
  ar: 'دخل رجل ثائر الشعر واللحية المسجد فأمره النبي أن يخرج يصلح شعره ولحيته، فلما رجع قال: ألا يكون هذا خيراً من أن يأتي أحدكم ثائر الشعر واللحية كأنه شيطان {cite:muwatta-maruf-1997} [[passage/muwatta-31-2732|الموطأ 2732]].'
  en: 'A man with disheveled hair and beard entered the mosque; the Prophet ordered him out to fix his hair and beard, and when he returned he said: is this not better than one of you coming with disheveled hair and beard like a shaytan {cite:muwatta-maruf-1997} [[passage/muwatta-31-2732|Muwatta 2732]].'
  ur: 'بکھرے بالوں اور داڑھی والا ایک آدمی مسجد میں داخل ہوا تو نبی نے اسے باہر جانے اور بال اور داڑھی ٹھیک کرنے کا حکم دیا، اور جب وہ لوٹا تو کہا: کیا یہ بہتر نہیں کہ تم میں سے کوئی بکھرے بالوں اور داڑھی کے ساتھ آئے جیسے وہ شیطان ہو {cite:muwatta-maruf-1997} [[passage/muwatta-31-2732|موطأ 2732]]۔'
