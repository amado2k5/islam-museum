id: event/ibn-bistam-seizes-men-of-maynas-and-al-hadi-jails-the-qarmatian-prisoners-294
class: event
kind: other
label:
  ar: "ابن بسطام يأخذ نفراً من ميناس ويحبس الهادي القرامطة، سنة 294هـ، ص341"
  en: "Ibn Bistam seizes men of Maynas and al-Hadi jails the Qarmatians, 294 AH, p. 341"
  ur: "ابن بسطام کا میناس کے کچھ لوگوں کو پکڑنا اور ہادی کا قرامطہ کو قید کرنا، 294ھ، ص341"
  es: "Ibn Bistam captura a hombres de Maynas y al-Hadi encarcela a los cármatas, 294 AH, pág. 341"
  fr: "Ibn Bistam arrête des hommes de Maynas et al-Hadi emprisonne les Qarmates, 294 AH, p. 341"
summary:
  ar: "أُخذ ابن غبراء، أحد كبار القرامطة من أهل الهجر، ثم أخذ ابن بسطام نفراً من أهل ميناس من قرابته ومواليه وأوصلهم إلى الهادي فأمر بحبسهم."
  en: "A senior Qarmatian leader from al-Hijr, Ibn Ghabra, was among those taken. Ibn Bistam seized men of Maynas, his relatives and clients, and brought them to al-Hadi, who ordered them jailed."
  ur: "الہجر کے ایک بڑے قرامطہ رہنما ابن غبراء کو پکڑا گیا۔ ابن بسطام نے میناس کے کچھ لوگ، جو اس کے رشتہ دار اور موالی تھے، پکڑ کر ہادی کے پاس پہنچائے اور ہادی نے انہیں قید کرنے کا حکم دیا۔"
  es: "Entre los capturados se encontraba Ibn Ghabra, un alto dirigente cármata de al-Hijr. Ibn Bistam apresó a hombres de Maynas, sus parientes y clientes, y los llevó ante al-Hadi, quien ordenó su encarcelamiento."
  fr: "Parmi les personnes arrêtées figurait Ibn Ghabra, un haut dignitaire qarmate d'al-Hijr. Ibn Bistam fit arrêter des hommes de Maynas, ses proches et ses clients, et les amena à al-Hadi, qui ordonna leur emprisonnement."
