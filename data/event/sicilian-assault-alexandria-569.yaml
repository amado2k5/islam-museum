label: { ar: "أسطول صقلية على الإسكندرية", en: "The Sicilian assault on Alexandria (569 AH)", es: "El asalto siciliano a Alejandría (569 d. C.)", fr: "L'assaut sicilien sur Alexandrie (569 AH)", ur: "سکندریہ پر سسلی کا حملہ ⁦(569ھ)⁩", tr: "İskenderiye'deki Sicilya filosu", id: "Armada Sisilia di Alexandria" }
summary:
  ar: "استجابةً لمراسلات المتواطئين على إعادة الدولة العلوية جهز صاحب صقلية أسطولاً قوامه مائتا شيني تحمل الرجالة وست وثلاثون طريدة تحمل الخيل وست مراكب كبار لآلة الحرب وأربعون مركباً للأزواد، فيها خمسون ألف راجل وألف وخمسمائة فارس منها خمسمائة تركبلي، والمقدم عليهم ابن عم صاحب صقلية؛ وصلوا الإسكندرية في السادس والعشرين من ذي الحجة سنة تسع وستين وخمسمائة على حين غفلة من أهلها، فنزلوا ما يلي البحر والمنارة ونصبوا الدبابات والمنجنيقات، وصبر لهم أهل البلد وليس عندهم إلا قليل من العسكر؛ ودام القتال ثلاثة أيام وصل في ثانيها من كان في أقطاعه القريبة من العساكر الإسلامية، ففتح المسلمون باب البلد في اليوم الثالث وخرجوا عليهم من كل جانب وأحرقوا الدبابات، وسيّر صلاح الدين مملوكاً ينادي بقربه فعاود الناس القتال وهم يظنونه معهم، وسقط الفرنج في أيديهم فهاجم المسلمون خيامهم عند اختلاط الظلام وغنموها وكثر القتل فيهم، فهرب كثير إلى البحر فغرق بعضهم وغاص مسلمون فخرقوا شوانيهم، واحتمى ثلاثمائة من فرسانهم على رأس تل حتى أضحى النهار فصاروا بين قتيل وأسير {cite:kamil-ibn-al-athir p. 63-64}."
  en: "26 Dhu al-Hijja 569 (1174): answering the restoration plotters' letters, a Sicilian armada — two hundred troop-shinis, thirty-six horse-transports, six siege-train ships and forty supply vessels, fifty thousand foot and fifteen hundred horse under the Sicilian king's cousin — landed by the Pharos and set siege-towers against Alexandria's wall; the townsfolk and nearby iqta' troops held three days, burst out and burned the towers, and a rumour of Saladin's approach broke the Franks — the camp was stormed in the dark, the fleet fled under hull-piercing swimmers, and three hundred knights on a hill were finished by morning {cite:kamil-ibn-al-athir p. 63-64}."
  es: "26 Dhu al-Hijja 569 (1174): respondiendo a las cartas de los conspiradores de la restauración, una armada siciliana —doscientos shinis de tropas, treinta y seis transportes de caballos, seis barcos de asedio y cuarenta buques de suministro, cincuenta mil infantes y mil quinientos jinetes bajo el mando del primo del rey siciliano— desembarcó junto al Faro y colocó torres de asedio contra la muralla de Alejandría; los habitantes de la ciudad y las tropas iqta' cercanas resistieron durante tres días, irrumpieron y quemaron las torres, y un rumor de la llegada de Saladino quebró a los francos: el campamento fue asaltado en la oscuridad, la flota huyó bajo la protección de nadadores que perforaban los cascos, y trescientos caballeros en una colina fueron aniquilados por la mañana {cite:kamil-ibn-al-athir p. 63-64}."
  fr: "26 Dhu al-Hijja 569 (1174): en réponse aux lettres des conspirateurs de la restauration, une armada sicilienne — deux cents navires de transport de troupes, trente-six transports de chevaux, six navires de siège et quarante navires de ravitaillement, cinquante mille fantassins et quinze cents cavaliers sous le commandement du cousin du roi de Sicile — débarqua près du Phare et installa des tours de siège contre les murs d'Alexandrie; les habitants et les troupes iqta' voisines tinrent bon pendant trois jours, puis sortirent et incendièrent les tours, et une rumeur de l'approche de Saladin brisa les Francs — le camp fut pris d'assaut dans l'obscurité, la flotte s'enfuit sous la protection de nageurs perçant les coques, et trois cents chevaliers sur une colline furent anéantis au matin {cite: kamil-ibn-al-athir p. 63-64}."
  ur: "26 ذی الحجہ 569 (1174): بحالی کے منصوبہ سازوں کے خطوط کا جواب دیتے ہوئے، ایک سسلین آرماڈا - دو سو دستے، چھتیس گھوڑوں کی نقل و حمل، چھ محاصرہ کرنے والے ریل کے جہاز اور چالیس سپلائی جہاز، پچاس ہزار پیدل اور پندرہ سو گھوڑوں کے نیچے زمین پر سوار ہو کر سوار تھے۔ اسکندریہ کی دیوار کے خلاف محاصرے کے ٹاورز؛ شہر کے لوگوں اور آس پاس کے اقطا کی فوجوں نے تین دن تک قبضہ کیا، ٹاورز کو پھٹ کر جلا دیا، اور صلاح الدین کے نقطہ نظر کی افواہ نے فرینکس کو توڑ دیا - کیمپ پر اندھیرے میں دھاوا بول دیا گیا، بحری بیڑہ چھیدنے والے تیراکوں کے نیچے بھاگ گیا، اور ایک پہاڑی پر تین سو نائٹ صبح تک ختم ہو گئے۔ 63-64}۔"
  tr: "Alevi devletini yeniden kurmak için komplo kuranların yazışmalarına karşılık olarak, Sicilya hükümdarı, iki yüz şeni (adam taşıyan), otuz altı taridh (at taşıyan), altı büyük savaş gemisi ve kırk erzak gemisinden oluşan bir filo hazırladı. Bu filoda elli bin piyade ve bin beş yüz süvari bulunuyordu; bunların arasında beş yüz tarbaklı da vardı ve liderleri Sicilya hükümdarının kuzeniydi. 26 Zilhicce 569 yılında İskenderiye'ye geldiler ve halkı gafil avladılar. Denize ve deniz fenerine yakın bir yere indiler, kuşatma makineleri ve mancınıklar kurdular ve şehir halkı, sayıları az olmasına rağmen, onlara karşı direndi. Savaş üç gün sürdü. İkinci gün, Müslüman ordusunun yakınındaki beyliklerinde bulunanlar geldi. Üçüncü gün, Müslümanlar şehir kapısını açıp her taraftan onlara saldırdılar ve tankları yaktılar. Selahaddin, onu çağırması için bir Memlük gönderdi; bunun üzerine halk, onun kendileriyle birlikte olduğunu düşünerek savaşa devam etti. Franklar onların eline düştü, bu yüzden Müslümanlar karanlık çöktüğünde çadırlarına saldırdılar ve onları ganimet olarak aldılar; aralarından birçok kişi öldürüldü. Birçoğu denize kaçtı, bazıları boğuldu ve Müslümanlar gemilerine dalıp onları deldiler. Üç yüz şövalyeleri şafak sökene kadar bir tepenin üzerinde sığınak buldu ve ya öldürüldüler ya da esir alındılar. {cite:kamil-ibn-al-athir s. 63-64}"
  id: "Menanggapi surat-surat dari mereka yang berkonspirasi untuk memulihkan negara Alawite, penguasa Sisilia menyiapkan armada yang terdiri dari dua ratus sheni yang membawa pasukan, tiga puluh enam taridh yang membawa kuda, enam kapal besar untuk mesin perang, dan empat puluh kapal untuk perbekalan, dengan lima puluh ribu tentara infanteri dan seribu lima ratus penunggang kuda, termasuk lima ratus tarbakli, dan pemimpin mereka adalah sepupu penguasa Sisilia. Mereka tiba di Alexandria pada tanggal dua puluh enam Dzul Hijjah tahun lima ratus enam puluh sembilan, mengejutkan penduduknya. Mereka mendarat di dekat laut dan mercusuar dan memasang mesin pengepungan dan ketapel, dan penduduk kota bertahan menghadapi mereka, meskipun mereka hanya memiliki sedikit tentara. Pertempuran berlangsung selama tiga hari. Pada hari kedua, mereka yang berada di wilayah kekuasaannya di dekat pasukan Muslim tiba. Pada hari ketiga, kaum Muslim membuka gerbang kota dan menyerang mereka dari segala arah dan membakar tank-tank. Saladin mengirim seorang Mamluk untuk memanggilnya, sehingga orang-orang melanjutkan pertempuran, mengira dia bersama mereka. Bangsa Frank jatuh ke tangan mereka, sehingga kaum Muslim menyerang tenda-tenda mereka ketika malam tiba dan mengambilnya sebagai rampasan perang, dan banyak di antara mereka yang terbunuh. Banyak yang melarikan diri ke laut, beberapa di antaranya tenggelam, dan kaum Muslim menyelam dan menusuk kapal-kapal mereka. Tiga ratus ksatria mereka berlindung di puncak bukit hingga fajar, dan mereka terbunuh atau ditangkap. {cite:kamil-ibn-al-athir hlm. 63-64}"
