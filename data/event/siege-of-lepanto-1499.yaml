summary:
  ar: "ينقل الصلابي أن بايزيد الثاني أحرز نصراً بحرياً على البنادقة في خليج لبانتو ببلاد اليونان عام 905هـ/1499م، وفي العام التالي استولى على مدينة لبانتو، وباستيلاء العثمانيين على مواقع البنادقة في اليونان أقام البابا إسكندر السادس بناءً على طلب البنادقة حلفاً ضد العثمانيين ضم فرنسا وإسبانيا، وتعرض العثمانيون لهجوم الأساطيل الثلاثة الفرنسي والإسباني والبابوي حتى عقدوا صلحاً مع البنادقة {cite:dawlat-uthmaniyya-salabi p. 173}."
  en: "Al-Salabi records Bayezid II's naval victory over the Venetians in the Gulf of Lepanto in 905/1499, and the city's capture the following year; at Venice's plea Pope Alexander VI then raised a league of France and Spain against the Ottomans, who weathered the three fleets until a peace was made with Venice {cite:dawlat-uthmaniyya-salabi p. 173}."
