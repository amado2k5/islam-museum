perspectives:
  - tradition: sunni
    id: sunni
    summary: { en: "Sunni orthodoxy regards Aisha's complete exoneration as a matter of divine revelation in Surat al-Nur (24:11-26), holding that casting doubt on her purity constitutes apostasy and denial of the clear text of the Qur'an.", ar: "عقيدة أهل السنة والجماعة قاطعة في براءة أم المؤمنين عائشة الصديقة بنت الصديق بنص القرآن العظيم في سورة النور، ويجمع علماء السنة على كفر من طعن في عرضها بعد نزول براءتها تكذيباً لصريح الكتاب." }
    sources: [source/mubarakpuri-raheeq, source/sahih-al-bukhari, source/sahih-muslim]
  - tradition: academic
    id: academic
    summary: { en: "Historians examine the affair as a major factional crisis in Medina where tribal rivalries between the Aws and Khazraj were deliberately exploited by Abdullah ibn Ubayy to challenge the Prophet's leadership.", ar: "يدرس المؤرخون الحادثة بوصفها أزمة سياسية واجتماعية استغل فيها زعيم المعارضة عبد الله بن أبيّ الحساسيات القبلية بين الأوس والخزرج لإضعاف قيادة النبي وتماسك المجتمع المدني." }
    sources: [source/watt-1956-medina]
  - tradition: other
    id: other-critics-attributed
    summary: { ar: "ينقل الصلابي عن بعض الباحثين المعاصرين، ومنهم علي إبراهيم حسن وطه حسين في كتاب «علي وبنوه»، أن كلام علي عن عائشة أغضبها عليه؛ ويرى الكتاب أن هذه الروايات باطلة ساقطة الاعتبار، فلا يُعدّ هذا الرأي رأياً للمتحف، وإنما يُنسب إلى أصحابه ويُعرض مع رد الكتاب عليه.", en: "Al-Sallabi attributes to modern writers, among them Ali Ibrahim Hasan and Taha Husayn (in Ali wa-Banuh), a claim that Ali's words angered Aisha; he judges the narrations behind it baseless, and that view is attributed to its holders and set beside his reply." }
    sources: [source/sallabi-ali-vol1]
