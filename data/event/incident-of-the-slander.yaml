label: { en: "The Incident of the Slander (Hadith al-Ifk)", ar: "حادثة الإفك" }
summary:
  en: "On the return from the Expedition of al-Muraysi', Aisha was accidentally left behind when searching for a lost necklace and was escorted back to Medina by Safwan ibn al-Mu'attal; Abdullah ibn Ubayy orchestrated a malicious slander campaign that troubled the community for a month until verses of Surat al-Nur established her innocence."
  ar: "في قفول المسلمين من غزوة بني المصطلق، تأخرت عائشة تبحث عن عقد أضاعته فحمل هودجها ظناً أنها فيه، حتى مر بها صفوان بن المعطل فحملها على راحلته؛ فأشاع عبد الله بن أبيّ فرية الإفك، وبقي المجتمع في قلق واضطراب شهراً حتى أنزل الله براءتها في عشر آيات من سورة النور وحدّ المفترين. وفي صحيح مسلم تروي عائشة القصة كاملة من أولها حتى تلاوة آيات البراءة، ضمن حديث أم زرع في كتاب التوبة {cite:sahih-muslim 2770}."
