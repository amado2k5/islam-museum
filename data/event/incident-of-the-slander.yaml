    ar: "بعد واقعة الإفك التي اتهمت فيها عائشة زوراً، نزلت آيات تبرئتها في سورة النور وتجمع مصادر السيرة على حفظ الرواية مطولة."
    en: "After the Ifk episode falsely accused Aisha, verses of Surah al-Nur exonerated her; the sirah sources preserve the account at length."
