label: { ar: "غزوة المنصور لشنت ياقب", en: "al-Mansur's Raid on Shant Ya'qub (Santiago de Compostela)", es: "Incursión de al-Mansur en Shant Ya'qub (Santiago de Compostela)", fr: "Raid d'al-Mansur sur Shant Ya'qub (Saint-Jacques-de-Compostelle)", ur: "شانت یعقوب پر المنصور کا چھاپہ ⁦(سانتیاگو ڈی کمپوسٹیلا)⁩", tr: "Al-Mansur'un Shant Yaqb'a baskını", id: "Serangan Al-Mansur di Shant Yaqb" }
summary:
  ar: "خرج المنصور بن أبي عامر من قرطبة غازياً بالصائفة يوم السبت لست بقين من جمادى الآخرة سنة سبع وثمانين وثلاثمائة وهي غزوته الثامنة والأربعون، قاصداً مدينة شنت ياقب قاصية غليسية وأعظم مشاهد النصارى ببلاد الأندلس التي كانت كنيستها عندهم بمنزلة الكعبة يحجون إليها من أقصى بلاد رومة ويزعمون أن فيها قبر يعقوب الحواري، وتقدم في إنشاء أسطول كبير بقصر أبي دانس من ساحل غرب الأندلس فعقد به جسراً على نهر دويره ووصلت ميرته إلى الجند، وقطع العسكر الأرضين وأنهاراً وخلجاناً يمدها البحر الأخضر وفتح حصن شنت بلاية وسبى من لجأ إلى جزيرة من البحر المحيط، وانتهت مغيرتهم إلى دير قسطان وجبل مراسية فاستخرجوا من فيه، ثم انتهوا إلى شنت ياقب يوم الأربعاء لليلتين خلتا من شعبان فوجدوها خالية من أهلها فحازوا غنائمها وهدموا مصانعها وأسوارها وكنيستها وعفوا آثارها، ووكل المنصور بقبر يعقوب من يحفظه ويدفع الأذى عنه، ولم يجد بها إلا شيخاً من الرهبان جالساً على القبر فسأله عن مقامه فقال أونس يعقوب فأمر بالكف عنه، وانتهت الجيوش إلى جزيرة شنت مانكش وهي غاية لم يبلغها قبلهم مسلم ولا وطئها لغير أهلها قدم، وكتب بالفتح من بليقية وكان ما كسا في غزاته لملوك الروم والمسلمين ألفين ومائتين وخمساً وثمانين شقة من الخز الطرازي وإحدى وعشرين كساء من صوف البحر، ووافى العسكر قرطبة غانماً، وفيها قال المنصور لشعلة حين عاتبه على السهر: الملك لا ينام إذا نامت الرعية {cite:nafh-tib-maqqari p. 449-452}."
  en: "Al-Mansur's forty-eighth raid and his deepest: from Cordoba, 6 Jumada II 387, to Santiago de Compostela — the Christians' Kaaba — reached empty on Wednesday 2 Sha'ban; its church, walls and factories demolished, the apostle's tomb guarded and the lone monk 'Ones of James' spared, then the army pushed to Santi Mankish island, 'a limit no Muslim had reached before them', and he wrote his victory dispatch from Baliquiya {cite:nafh-tib-maqqari p. 449-452}."
  es: "La cuadragésima octava incursión de Al-Mansur, y la más profunda: desde Córdoba, 6 de Jumada II de 387, hasta Santiago de Compostela —la Kaaba de los cristianos— llegó vacía el miércoles 2 de Sha'ban; su iglesia, murallas y fábricas demolidas, la tumba del apóstol custodiada y el único monje 'Ones of James' perdonado, luego el ejército avanzó hasta la isla de Santi Mankish, 'un límite que ningún musulmán había alcanzado antes', y escribió su informe de victoria desde Baliquiya {cite:nafh-tib-maqqari p. 449-452}."
  fr: "Le quarante-huitième raid d'Al-Mansur et le plus profond: de Cordoue, le 6 Jumada II 387, à Saint-Jacques-de-Compostelle — la Kaaba des chrétiens — atteignit vide le mercredi 2 Sha'ban; son église, ses murs et ses usines furent démolis, le tombeau de l'apôtre gardé et le seul moine « des disciples de Jacques » épargné, puis l'armée fut poussée jusqu'à l'île de Santi Mankish, « une limite qu'aucun musulman n'avait atteinte avant eux », et il écrivit son rapport de victoire depuis Baliquiya {cite:nafh-tib-maqqari p. 449-452}."
  ur: "المنصور کا اڑتالیسواں حملہ اور اس کا سب سے گہرا حملہ: قرطبہ، 6 جمادی الثانی 387، سے سینٹیاگو ڈی کمپوسٹیلا - عیسائیوں کا خانہ کعبہ - بدھ 2 شعبان کو خالی پہنچا؛ اس کے گرجا گھر، دیواروں اور کارخانوں کو گرا دیا گیا، رسول کے مقبرے کی حفاظت کی گئی اور اکیلے راہب 'ونز آف جیمز' کو بچا لیا گیا، پھر فوج نے سینٹی مانکیش جزیرے کی طرف دھکیل دیا، 'اس حد تک کہ ان سے پہلے کوئی مسلمان نہیں پہنچا تھا'، اور اس نے بلقیہ سے اپنی فتح کی روانگی لکھی۔ 449-452}۔"
  tr: "El-Mansur ibn Abi Amir, 26 Cemadi el-Ahire 387 Hicri (997 Miladi) Cumartesi günü, kırk sekizinci seferi için Kurtuba'dan yola çıktı. Hedefi, Galiçya'nın ücra bir bölgesinde bulunan ve Endülüs'ün en önemli Hristiyan şehri olan Santiago de Compostela idi. Kilisesi, Hristiyanlar tarafından Kâbe gibi kabul ediliyor ve Roma'nın en uzak köşelerinden bile hac ziyaretleri yapılıyordu; çünkü kilisenin içinde Havari Yakup'un mezarının olduğuna inanılıyordu. El-Mansur, Endülüs'ün batı kıyısındaki Ebu Danis sarayında büyük bir filo inşa etmeye başlamış ve Douro Nehri üzerine bir köprü kurmuştu. Orduya erzak ulaştırıldı ve birlikler Akdeniz'den beslenen karaları, nehirleri ve koyları geçtiler. Santiago de Compostela kalesini ele geçirdiler ve Atlantik Okyanusu'ndaki bir adaya sığınanları esir aldılar. Baskınları Konstantinopolis Manastırı ve Marasa Dağı'na kadar ulaştı ve burada yaşayanları esir aldılar. Çarşamba günü, Şaban ayının 28'inde Santiago de Compostela'ya vardılar ve şehri ıssız buldular. Şehrin ganimetlerini ele geçirdiler, fabrikalarını, surlarını ve kilisesini yıktılar ve izlerini sildiler. El-Mansur, Yakub'un türbesini koruyacak ve zarardan uzak tutacak birini bulmak için oraya gitti. Türbenin üzerinde sadece bir şeyh buldu ve ona konumunu sordu. Şeyh, \"Yakub bir teselli edicidir\" dedi. Bunun üzerine El-Mansur, onu yalnız bırakmalarını emretti. Ordular, daha önce hiçbir Müslümanın ulaşmadığı ve halkından başka kimsenin ayak basmadığı bir yer olan Sant Mancish adasına ulaştılar. El-Mansur, Balikiyye'den zaferi yazdı. Seferinde Romalı ve Müslüman krallara verdiği şey, iki bin iki yüz seksen beş parça ince ipek ve yirmi bir deniz yünü pelerin idi. Ordu ganimetlerle birlikte Kurtuba'ya ulaştı. Orada, El-Mansur, Şa'la'yı geç saatlere kadar ayakta kaldığı için azarladığında ona şöyle dedi: \"Kral, tebaası uyurken uyumaz.\" {kaynak:nafh-tib-maqqari s. 449-452}."
  id: "Al-Mansur ibn Abi Amir berangkat dari Cordoba pada hari Sabtu, tanggal 26 Jumada al-Akhirah, 387 H (997 M), untuk kampanye ke-48-nya. Tujuannya adalah kota Santiago de Compostela, sebuah wilayah terpencil di Galicia dan kota Kristen terpenting di al-Andalus. Gerejanya dianggap oleh umat Kristen seperti Ka'bah, tempat mereka berziarah dari ujung terjauh Roma, karena percaya bahwa di dalamnya terdapat makam Rasul Yakobus. Ia telah mulai membangun armada besar di istana Abu Danis di pantai barat al-Andalus, membangun jembatan di atas Sungai Douro. Persediaan mencapai pasukan, dan pasukan melintasi daratan, sungai, dan teluk yang dialiri oleh Laut Mediterania. Mereka merebut benteng Santiago de Compostela dan menawan mereka yang telah berlindung di sebuah pulau di Samudra Atlantik. Serangan mereka mencapai Biara Konstantinopel dan Gunung Marasa, tempat mereka membawa penduduknya. Mereka tiba di Santiago de Compostela pada hari Rabu, tanggal 28 Sya'ban, dan mendapati kota itu kosong. Mereka merebut harta rampasan, menghancurkan pabrik, tembok, dan gereja, serta menghapus jejaknya. Al-Mansur pergi ke makam Yaqub untuk mencari seseorang yang dapat melindunginya dan menangkal bahaya. Ia hanya menemukan seorang syekh biarawan yang duduk di makam itu, jadi ia bertanya kepadanya tentang kedudukannya. Syekh itu berkata, “Yaqub adalah seorang penghibur.” Maka ia memerintahkan agar syekh itu dibiarkan saja. Pasukan mencapai pulau Sant Mancish, sebuah tujuan yang belum pernah dicapai oleh seorang Muslim pun sebelumnya, dan belum pernah diinjak oleh siapa pun selain penduduknya. Ia menulis tentang kemenangan dari Baliqiyya. Apa yang telah diberikannya dalam kampanyenya kepada raja-raja Romawi dan Muslim adalah dua ribu dua ratus delapan puluh lima potong sutra halus dan dua puluh satu jubah wol laut. Pasukan tiba di Cordoba dengan membawa rampasan perang. Di sana, Al-Mansur berkata kepada Sha’la ketika ia menegurnya karena begadang: “Raja tidak tidur ketika rakyat tidur.” {cite:nafh-tib-maqqari p. 449-452}."
