label: { ar: "غزوة المنصور لشنت ياقب" }
summary:
  ar: "خرج المنصور بن أبي عامر من قرطبة غازياً بالصائفة يوم السبت لست بقين من جمادى الآخرة سنة سبع وثمانين وثلاثمائة وهي غزوته الثامنة والأربعون، قاصداً مدينة شنت ياقب قاصية غليسية وأعظم مشاهد النصارى ببلاد الأندلس التي كانت كنيستها عندهم بمنزلة الكعبة يحجون إليها من أقصى بلاد رومة ويزعمون أن فيها قبر يعقوب الحواري، وتقدم في إنشاء أسطول كبير بقصر أبي دانس من ساحل غرب الأندلس فعقد به جسراً على نهر دويره ووصلت ميرته إلى الجند، وقطع العسكر الأرضين وأنهاراً وخلجاناً يمدها البحر الأخضر وفتح حصن شنت بلاية وسبى من لجأ إلى جزيرة من البحر المحيط، وانتهت مغيرتهم إلى دير قسطان وجبل مراسية فاستخرجوا من فيه، ثم انتهوا إلى شنت ياقب يوم الأربعاء لليلتين خلتا من شعبان فوجدوها خالية من أهلها فحازوا غنائمها وهدموا مصانعها وأسوارها وكنيستها وعفوا آثارها، ووكل المنصور بقبر يعقوب من يحفظه ويدفع الأذى عنه، ولم يجد بها إلا شيخاً من الرهبان جالساً على القبر فسأله عن مقامه فقال أونس يعقوب فأمر بالكف عنه، وانتهت الجيوش إلى جزيرة شنت مانكش وهي غاية لم يبلغها قبلهم مسلم ولا وطئها لغير أهلها قدم، وكتب بالفتح من بليقية وكان ما كسا في غزاته لملوك الروم والمسلمين ألفين ومائتين وخمساً وثمانين شقة من الخز الطرازي وإحدى وعشرين كساء من صوف البحر، ووافى العسكر قرطبة غانماً، وفيها قال المنصور لشعلة حين عاتبه على السهر: الملك لا ينام إذا نامت الرعية {cite:nafh-tib-maqqari p. 449-452}."
  en: "Al-Mansur's forty-eighth raid and his deepest: from Cordoba, 6 Jumada II 387, to Santiago de Compostela — the Christians' Kaaba — reached empty on Wednesday 2 Sha'ban; its church, walls and factories demolished, the apostle's tomb guarded and the lone monk 'Ones of James' spared, then the army pushed to Santi Mankish island, 'a limit no Muslim had reached before them', and he wrote his victory dispatch from Baliquiya {cite:nafh-tib-maqqari p. 449-452}."
