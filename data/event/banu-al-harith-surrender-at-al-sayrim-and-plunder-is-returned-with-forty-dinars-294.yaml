label:
  ar: "استسلام بني الحارث في الصيرم، وإعادة السلب والأربعين ديناراً، رمضان 294هـ، ص345"
  en: "Banu al-Harith surrender at al-Sayrim and the plunder and forty dinars are returned, Ramadan 294 AH, p. 345"
  ur: "بنی الحارث کا الصیرم میں ہتھیار ڈالنا اور سامان اور چالیس دینار کی واپسی، رمضان 294ھ، ص345"
summary:
  ar: "ظن بنو الحارث أنهم محاصرون فاستسلموا، فأمر علي بن محمد بإطلاقهم وردّ ما أُخذ منهم، وأُعيد أربعون ديناراً أخذها أحد أصحابه من رجل منهم."
  en: "Thinking themselves surrounded, the men of Banu al-Harith surrendered. Ali ibn Muhammad ordered them freed and their property returned, and forty dinars that one of his men had taken from a man of the clan were given back."
  ur: "بنی الحارث نے خود کو گھرا ہوا سمجھ کر ہتھیار ڈال دیے۔ علی بن محمد نے انہیں چھوڑنے اور ان کا مال واپس دینے کا حکم دیا، اور ان کے ایک آدمی سے ان کے ایک ساتھی کے لیے لیے گئے چالیس دینار بھی واپس کیے گئے۔"
