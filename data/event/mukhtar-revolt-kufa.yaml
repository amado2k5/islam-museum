id: event/mukhtar-revolt-kufa
class: event
kind: revolt
label: { ar: "ثورة المختار بن أبي عبيد بالكوفة" }
summary:
  ar: "في سنة خمس وستين تحركت الشيعة بالكوفة {cite:bakr-umayyad-state-1134715 p. 206}. كان المختار بن أبي عبيد الثقفي قد بعثه ابن الزبير إلى الكوفة، فنزل ناحية منها يظهر البكاء على الطالبيين ويحث على الثأر لهم، فمالت إليه الشيعة، وأخرج عبد الله بن مطيع من قصر الإمارة وغلب على الكوفة {cite:bakr-umayyad-state-1134715 p. 194}. وفي سنة ست وستين كان إبراهيم بن الأشتر على خيل العراق من قبل المختار، فالتقى بعبيد الله بن زياد بالخازر وقتله {cite:bakr-umayyad-state-1134715 p. 209}. وجيء برأس المختار بين يدي مصعب بن الزبير بحسب رواية يذكرها الكتاب {cite:bakr-umayyad-state-1134715 p. 220}."
