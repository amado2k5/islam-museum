id: event/mukhtar-revolt-kufa
class: event
kind: revolt
label: { ar: "ثورة المختار بن أبي عبيد بالكوفة", en: "The revolt of al-Mukhtar ibn Abi Ubayd in Kufa" }
summary:
  ar: "في سنة خمس وستين تحركت الشيعة بالكوفة {cite:bakr-umayyad-state-1134715 p. 206}. كان المختار بن أبي عبيد الثقفي قد بعثه ابن الزبير إلى الكوفة، فنزل ناحية منها يظهر البكاء على الطالبيين ويحث على الثأر لهم، فمالت إليه الشيعة، وأخرج عبد الله بن مطيع من قصر الإمارة وغلب على الكوفة {cite:bakr-umayyad-state-1134715 p. 194}. وفي سنة ست وستين كان إبراهيم بن الأشتر على خيل العراق من قبل المختار، فالتقى بعبيد الله بن زياد بالخازر وقتله {cite:bakr-umayyad-state-1134715 p. 209}. وجيء برأس المختار بين يدي مصعب بن الزبير بحسب رواية يذكرها الكتاب {cite:bakr-umayyad-state-1134715 p. 220}."
  en: "In 65 AH the Shi'a stirred in Kufa {cite:bakr-umayyad-state-1134715 p. 206}. Ibn al-Zubayr had sent al-Mukhtar ibn Abi Ubayd al-Thaqafi to Kufa; he settled in one of its quarters, showing weeping for the Talibids and urging vengeance for them, and the Shi'a inclined to him. He drove Abd Allah ibn Muti' out of the governor's palace and gained control of Kufa {cite:bakr-umayyad-state-1134715 p. 194}. In 66 AH Ibrahim ibn al-Ashtar commanded the cavalry of Iraq on al-Mukhtar's behalf; he met Ubayd Allah ibn Ziyad at al-Khazir and killed him {cite:bakr-umayyad-state-1134715 p. 209}. According to a report the book records, al-Mukhtar's head was brought before Mus'ab ibn al-Zubayr {cite:bakr-umayyad-state-1134715 p. 220}."
