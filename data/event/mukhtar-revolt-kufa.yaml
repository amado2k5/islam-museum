id: event/mukhtar-revolt-kufa
class: event
kind: revolt
label: { ar: "ثورة المختار بن أبي عبيد بالكوفة", en: "The revolt of al-Mukhtar ibn Abi Ubayd in Kufa", es: "La revuelta de al-Mukhtar ibn Abi Ubayd en Kufa", fr: "La révolte d'al-Mukhtar ibn Abi Ubayd à Kufa", ur: "کوفہ میں مختار بن ابی عبید کی بغاوت" }
summary:
  ar: "في سنة خمس وستين تحركت الشيعة بالكوفة {cite:bakr-umayyad-state-1134715 p. 206}. كان المختار بن أبي عبيد الثقفي قد بعثه ابن الزبير إلى الكوفة، فنزل ناحية منها يظهر البكاء على الطالبيين ويحث على الثأر لهم، فمالت إليه الشيعة، وأخرج عبد الله بن مطيع من قصر الإمارة وغلب على الكوفة {cite:bakr-umayyad-state-1134715 p. 194}. وفي سنة ست وستين كان إبراهيم بن الأشتر على خيل العراق من قبل المختار، فالتقى بعبيد الله بن زياد بالخازر وقتله {cite:bakr-umayyad-state-1134715 p. 209}. وجيء برأس المختار بين يدي مصعب بن الزبير بحسب رواية يذكرها الكتاب {cite:bakr-umayyad-state-1134715 p. 220}."
  en: "In 65 AH the Shi'a stirred in Kufa {cite:bakr-umayyad-state-1134715 p. 206}. Ibn al-Zubayr had sent al-Mukhtar ibn Abi Ubayd al-Thaqafi to Kufa; he settled in one of its quarters, showing weeping for the Talibids and urging vengeance for them, and the Shi'a inclined to him. He drove Abd Allah ibn Muti' out of the governor's palace and gained control of Kufa {cite:bakr-umayyad-state-1134715 p. 194}. In 66 AH Ibrahim ibn al-Ashtar commanded the cavalry of Iraq on al-Mukhtar's behalf; he met Ubayd Allah ibn Ziyad at al-Khazir and killed him {cite:bakr-umayyad-state-1134715 p. 209}. According to a report the book records, al-Mukhtar's head was brought before Mus'ab ibn al-Zubayr {cite:bakr-umayyad-state-1134715 p. 220}."
  es: "En el año 65 AH, los chiítas se agitaron en Kufa {cite:bakr-umayyad-state-1134715 p. 206}. Ibn al-Zubayr había enviado a al-Mukhtar ibn Abi Ubayd al-Thaqafi a Kufa; este se instaló en uno de sus barrios, mostrando llanto por los talíbidas e instando a la venganza por ellos, y los chiítas se inclinaron hacia él. Expulsó a Abd Allah ibn Muti' del palacio del gobernador y obtuvo el control de Kufa {cite:bakr-umayyad-state-1134715 p. 194}. En el año 66 AH, Ibrahim ibn al-Ashtar comandó la caballería de Irak en nombre de al-Mukhtar; Se encontró con Ubayd Allah ibn Ziyad en al-Khazir y lo mató {cite:bakr-umayyad-state-1134715 p. 209}. Según un informe que registra el libro, la cabeza de al-Mukhtar fue llevada ante Mus'ab ibn al-Zubayr {cite:bakr-umayyad-state-1134715 p. 220}."
  fr: "En 65 AH, les chiites s'agitèrent à Koufa. Ibn al-Zubayr avait envoyé al-Mukhtar ibn Abi Ubayd al-Thaqafi à Koufa; celui-ci s'installa dans un quartier de la ville, pleurant les talibides et appelant à leur vengeance, ce qui rallia les chiites à sa cause. Il chassa Abd Allah ibn Muti' du palais du gouverneur et prit le contrôle de Koufa. En 66 AH, Ibrahim ibn al-Ashtar commanda la cavalerie d'Irak pour le compte d'al-Mukhtar; il rencontra Ubayd Allah ibn Ziyad à al-Khazir et le tua. Selon un rapport consigné dans le livre, la tête d'al-Mukhtar a été présentée à Mus'ab ibn al-Zubayr {cite:bakr-umayyad-state-1134715 p. 220}."
  ur: "65 ہجری میں شیعہ کوفہ میں ہلچل مچ گئی۔ 206}۔ ابن الزبیر نے مختار بن ابی عبید ثقفی کو کوفہ بھیجا تھا۔ وہ اس کے ایک کوارٹر میں مقیم ہوا، جس میں طالبان کے لیے روتے ہوئے اور ان سے انتقام لینے کی ترغیب دی گئی، اور شیعہ اس کی طرف مائل ہوئے۔ اس نے عبداللہ بن مطیع کو گورنری کے محل سے باہر نکال دیا اور کوفہ کا کنٹرول حاصل کر لیا۔ 194}۔ 66 ہجری میں ابراہیم بن اشتر نے مختار کی طرف سے عراق کے گھڑ سواروں کی کمان کی۔ اس نے الخضیر میں عبید اللہ ابن زیاد سے ملاقات کی اور اسے قتل کر دیا۔ 209}۔ کتاب میں درج ایک رپورٹ کے مطابق المختار کا سر مصعب بن الزبیر کے سامنے لایا گیا تھا۔ 220}۔"
