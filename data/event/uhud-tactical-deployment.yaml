label:
  ar: التوزيع التكتيكي لجيش المسلمين في أحد
  en: Tactical Deployment of the Muslim Army at Uhud
  es: "Despliegue táctico del ejército musulmán en Uhud"
  fr: "Déploiement tactique de l'armée musulmane à Uhud"
  ur: "احد میں مسلم فوج کی حکمت عملی سے تعیناتی۔"
