summary:
  ar: توزيع القوات على الميمنة والميسرة، وتعيين خمسين رامياً على جبل الرماة لحماية ظهر الجيش.
  en: The distribution of forces on the right and left wings, and the appointment of fifty archers on the Archers' Hill to protect the army's rear.
  es: "La distribución de fuerzas en los flancos derecho e izquierdo, y el nombramiento de cincuenta arqueros en la Colina de los Arqueros para proteger la retaguardia del ejército."
  fr: "La répartition des forces sur les ailes droite et gauche, et la désignation de cinquante archers sur la colline des Archers pour protéger l'arrière de l'armée."
  ur: "دائیں اور بائیں بازو پر افواج کی تقسیم اور فوج کے عقب کی حفاظت کے لیے آرچرز ہل پر پچاس تیر اندازوں کی تقرری۔"
  tr: "Kuvvetleri sağ ve sol kanatlara dağıtın ve ordunun arkasını korumak için Okçular Dağı'na elli okçu görevlendirin."
  id: "Sebarkan pasukan di sayap kanan dan kiri, dan tugaskan lima puluh pemanah ke Pasukan Pemanah Berkuda untuk melindungi bagian belakang pasukan."
