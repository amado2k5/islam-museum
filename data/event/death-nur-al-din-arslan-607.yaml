summary:
  ar: "توفي نور الدين أرسلان شاه بن عز الدين مسعود صاحب الموصل، وكان من أشجع الملوك وأبخلهم حتى قيل فيه ما قيل، وملك بعده ولده عز الدين مسعود وهو صغير فانفرد بالأمر مماليكه {cite:kamil-ibn-al-athir p. 353}."
  en: "Nur al-Din Arslan Shah of Mosul died — Ibn al-Athir recalls his valor and notorious stinginess; his young son Izz al-Din Mas'ud II succeeded and the mamluks ruled {cite:kamil-ibn-al-athir p. 353}."
  es: "Nur al-Din Arslan Shah de Mosul murió; Ibn al-Athir recuerda su valor y su notoria tacañería; su joven hijo Izz al-Din Mas'ud II le sucedió y los mamelucos gobernaron {cite:kamil-ibn-al-athir p. 353}."
  fr: "Nur al-Din Arslan Shah de Mossoul mourut — Ibn al-Athir se souvient de sa bravoure et de sa notoriété avare; son jeune fils Izz al-Din Mas'ud II lui succéda et les mamelouks régnèrent {cite:kamil-ibn-al-athir p. 353}."
  ur: "موصل کے نورالدین ارسلان شاہ کا انتقال ہوگیا — ابن الثیر اپنی بہادری اور بدنام زمانہ بخل کو یاد کرتے ہیں۔ اس کا جوان بیٹا عزالدین مسعود ثانی کامیاب ہوا اور مملوکوں نے حکومت کی۔ 353}۔"
  tr: "Musul hükümdarı Nur ed-Din Arslan Şah ibn İzz ed-Din Mesud öldü. O, en cesur ve en cimri krallardan biriydi, öyle ki hakkında çok şey söylenmiştir. Ondan sonra, oğlu İzz ed-Din Mesud genç yaşta kral oldu ve Memlükler yönetimi tamamen ele geçirdi. {cite:kamil-ibn-al-athir s. 353}"
  id: "Nur ad-Din Arslan Shah ibn Izz ad-Din Masoud, penguasa Mosul, meninggal dunia. Ia adalah salah satu raja yang paling berani dan paling pelit, sehingga banyak hal yang dibicarakan tentangnya. Setelahnya, putranya Izz ad-Din Masoud menjadi raja di usia muda, dan Mamluknya mengambil kendali penuh atas pemerintahan. {cite:kamil-ibn-al-athir p. 353}"
