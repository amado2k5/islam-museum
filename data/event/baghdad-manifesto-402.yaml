label: { ar: "المحضر البغدادي في الطعن في نسب الفاطميين", en: "The Baghdad Attestation on Fatimid Lineage", fr: "L'attestation de Bagdad sur la généalogie des Fatimides", es: "La certificación de Bagdad sobre el linaje fatimí", ur: "فاطمی نسب پر بغداد کی تصدیق" }
summary:
  ar: "في ربيع الآخر سنة اثنتين وأربعمائة كُتب في ديوان الخلافة ببغداد محضر شهده وأمضى خطوطه الأشراف والقضاة والفقهاء والصالحون والمعدلون، يشهدون بالقدح في نسب خلفاء مصر الفاطميين وأصل دعوتهم، وأنهم منسوبون إلى ديصان بن سعيد وأن انتسابهم إلى ولد علي بن أبي طالب باطل وزور، وأن هذا الإنكار شائع بالحرمين ومستفيض بالغرب. وكتب خطه في المحضر جمع عظيم من العلويين في مقدمتهم الشريفان الرضي والمرتضى وابن الأزرق الموسوي، ومن القضاة ابن الأكفاني والخرزي والسوري، ومن الفقهاء أبو حامد الاسفراييني وأبو الحسين القدوري وأبو عبد الله الصيمري والبيضاوي، وقرئ بالبصرة وسائر الآفاق {cite:muntazam-ibn-al-jawzi j.7 p.255-256}."
  en: "In Rabi' II 402 a document was drawn up in the chancery of the caliphate at Baghdad, attested and signed by the sharifs, judges, jurists, the pious and the certifying witnesses. In it they testified to discrediting the lineage of the Fatimid caliphs of Egypt and the basis of their call, stating that they are ascribed to Daysan b. Sa'id, that their claim to descent from the sons of Ali b. Abi Talib is false and fabricated, and that this denial is widespread in the two holy cities and well known in the West. Among those who wrote their signatures were a large number of 'Alids, headed by the two sharifs al-Radi and al-Murtada and Ibn al-Azraq al-Musawi; among the judges Ibn al-Akfani, al-Kharzi and al-Suri; and among the jurists Abu Hamid al-Isfara'ini, Abu al-Husayn al-Qaduri, Abu 'Abd Allah al-Saymari and al-Bayda'i. It was read out in Basra and across the other regions {cite:muntazam-ibn-al-jawzi j.7 p.255-256}."
  fr: "En Rabi' II 402, un document fut rédigé à la chancellerie du califat à Bagdad, attesté et signé par les chérifs, les cadis, les juristes, les pieux et les témoins instrumentaires. Ils y témoignaient pour discréditer la généalogie des califes fatimides d'Égypte et le fondement de leur appel, déclarant qu'ils se rattachent à Daysan ibn Sa'id, que leur prétention à descendre des fils d'Ali ibn Abi Talib est fausse et forgée, et que ce démenti est répandu dans les deux sanctuaires et bien connu en Occident. Parmi ceux qui apposèrent leur signature figuraient un grand nombre d'Alides, avec à leur tête les deux chérifs al-Radi et al-Murtada et Ibn al-Azraq al-Musawi ; parmi les cadis, Ibn al-Akfani, al-Kharzi et al-Suri ; et parmi les juristes, Abu Hamid al-Isfara'ini, Abu al-Husayn al-Qaduri, Abu 'Abd Allah al-Saymari et al-Bayda'i. Il fut lu à Bassora et dans les autres régions {cite:muntazam-ibn-al-jawzi j.7 p.255-256}."
  es: "En Rabi' II 402 se redactó un documento en la cancillería del califato en Bagdad, atestiguado y firmado por los sharifs, jueces, juristas, los piadosos y los testigos certificados. En él testificaron desacreditar el linaje de los califas fatimíes de Egipto y el fundamento de su llamamiento, afirmando que se les atribuye a Daysan b. Sa'id, que su pretensión de descender de los hijos de Ali b. Abi Talib es falsa y fabricada, y que esta negación está muy extendida en las dos ciudades santas y es bien conocida en Occidente. Entre los que escribieron sus firmas había un gran número de 'Alids, encabezados por los dos sharifs al-Radi y al-Murtada e Ibn al-Azraq al-Musawi; entre los jueces Ibn al-Akfani, al-Kharzi y al-Suri; y entre los juristas Abu Hamid al-Isfara'ini, Abu al-Husayn al-Qaduri, Abu 'Abd Allah al-Saymari y al-Bayda'i. Fue leído en Basora y en otras regiones {cite:muntazam-ibn-al-jawzi j.7 p.255-256}."
  ur: "ربیع دوم 402 میں بغداد میں خلافت کے دربار میں ایک دستاویز تیار کی گئی جس پر شریفوں، قاضیوں، فقہاء، متقیوں اور گواہوں نے تصدیق کی اور اس پر دستخط کیے۔ اس میں انہوں نے مصر کے فاطمی خلفاء کے نسب اور ان کی دعوت کی بنیاد کو بدنام کرنے کی گواہی دی، یہ کہتے ہوئے کہ وہ دیسان ب سے منسوب ہیں۔ سعید، کہ ان کا دعویٰ ہے کہ وہ علی بن کے بیٹوں میں سے ہیں۔ ابی طالب جھوٹا اور من گھڑت ہے اور یہ کہ یہ انکار دو مقدس شہروں میں عام ہے اور مغرب میں مشہور ہے۔ ان لوگوں میں جنہوں نے اپنے دستخط لکھے ان میں الید کی ایک بڑی تعداد تھی جس کے سربراہ دو شریف الرادی اور المرتضیٰ اور ابن الزراق الموسوی تھے۔ ججوں میں ابن الکفانی، الخرزی اور السوری؛ اور فقہاء میں ابو حامد الاصفرینی، ابو الحسین القدوری، ابو عبد اللہ السمری اور البیداعی شامل ہیں۔ اسے بصرہ اور دیگر خطوں میں پڑھا گیا {حوالہ:منتظم ابن الجوزی ج7 ص255-256}۔"
