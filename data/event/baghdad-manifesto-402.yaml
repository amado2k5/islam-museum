label: { ar: "المحضر البغدادي في الطعن في نسب الفاطميين", en: "The Baghdad Attestation on Fatimid Lineage" }
summary:
  ar: "في ربيع الآخر سنة اثنتين وأربعمائة كُتب في ديوان الخلافة ببغداد محضر شهده وأمضى خطوطه الأشراف والقضاة والفقهاء والصالحون والمعدلون، يشهدون بالقدح في نسب خلفاء مصر الفاطميين وأصل دعوتهم، وأنهم منسوبون إلى ديصان بن سعيد وأن انتسابهم إلى ولد علي بن أبي طالب باطل وزور، وأن هذا الإنكار شائع بالحرمين ومستفيض بالغرب. وكتب خطه في المحضر جمع عظيم من العلويين في مقدمتهم الشريفان الرضي والمرتضى وابن الأزرق الموسوي، ومن القضاة ابن الأكفاني والخرزي والسوري، ومن الفقهاء أبو حامد الاسفراييني وأبو الحسين القدوري وأبو عبد الله الصيمري والبيضاوي، وقرئ بالبصرة وسائر الآفاق {cite:muntazam-ibn-al-jawzi j.7 p.255-256}."
  en: "In Rabi' II 402 a document was drawn up in the chancery of the caliphate at Baghdad, attested and signed by the sharifs, judges, jurists, the pious and the certifying witnesses. In it they testified to discrediting the lineage of the Fatimid caliphs of Egypt and the basis of their call, stating that they are ascribed to Daysan b. Sa'id, that their claim to descent from the sons of Ali b. Abi Talib is false and fabricated, and that this denial is widespread in the two holy cities and well known in the West. Among those who wrote their signatures were a large number of 'Alids, headed by the two sharifs al-Radi and al-Murtada and Ibn al-Azraq al-Musawi; among the judges Ibn al-Akfani, al-Kharzi and al-Suri; and among the jurists Abu Hamid al-Isfara'ini, Abu al-Husayn al-Qaduri, Abu 'Abd Allah al-Saymari and al-Bayda'i. It was read out in Basra and across the other regions {cite:muntazam-ibn-al-jawzi j.7 p.255-256}."
