label: { en: "The first migration to Abyssinia", ar: "الهجرة الأولى إلى الحبشة" }
summary:
  en: "In Rajab of the fifth year of prophethood, twelve men and four women — led by Uthman ibn Affan with the Prophet's daughter Ruqayya — slipped away by night to the port of Shu'ayba and sailed in two merchant ships to the kingdom of the Negus, 'a just king under whom no one is wronged'; most returned in Shawwal on the false report that Quraysh had converted."
  ar: "في رجب من السنة الخامسة للنبوة هاجر اثنا عشر رجلاً وأربع نسوة — رئيسهم عثمان بن عفان ومعه رقية بنت النبي — تسللاً في ظلمة الليل إلى ميناء شعيبة فأبحرت بهم سفينتان إلى ملك النجاشي «الذي لا يظلم عنده أحد»؛ ثم رجع أكثرهم في شوال حين بلغهم باطلاً أن قريشاً أسلمت."
