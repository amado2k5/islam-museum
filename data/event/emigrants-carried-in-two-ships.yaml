id: event/emigrants-carried-in-two-ships
class: event
kind: migration
label: { ar: "حمل النجاشي مهاجري الحبشة إلى النبي في سفينتين", en: "The Negus carries the emigrants to the Prophet in two ships", es: "El Negus transporta a los emigrantes al Profeta en dos barcos.", fr: "Le Négus transporte les émigrants auprès du Prophète sur deux navires." }
summary:
  ar: "قال ابن إسحاق: بقي من أصحاب النبي بأرض الحبشة من بقي حتى بعث النبي إلى النجاشي عمرو بن أمية الضمري، فحملهم في سفينتين وقدم بهم عليه وهو بخيبر بعد الحديبية. وبلغ مجموع من قدم في السفينتين ستة عشر رجلاً، وحُمل معهم نساء من نساء من هلك هناك من المسلمين."
  en: "Ibn Ishaq says: those of the Prophet's Companions who remained in Abyssinia stayed until the Prophet sent Amr ibn Umayya al-Damri to the Negus, who carried them in two ships and brought them to him at Khaybar after al-Hudaybiyya. The total who arrived in the two ships was sixteen men, and with them were carried wives of Muslims who had died there."
  es: "Ibn Ishaq relata que los Compañeros del Profeta que permanecieron en Abisinia se quedaron hasta que el Profeta envió a Amr ibn Umayya al-Damri al Negus, quien los transportó en dos barcos y los llevó ante él en Khaybar, después de al-Hudaybiyya. En total, llegaron dieciséis hombres en los dos barcos, y con ellos viajaban las esposas de musulmanes que habían fallecido allí."
  fr: "Ibn Ishaq rapporte: les Compagnons du Prophète restés en Abyssinie y demeurèrent jusqu’à ce que le Prophète envoie Amr ibn Umayya al-Damri auprès du Négus. Ce dernier les transporta sur deux navires et les amena à Khaybar après la bataille d’al-Hudaybiyya. Seize hommes arrivèrent au total sur les deux navires, accompagnés des épouses de musulmans décédés sur place."
