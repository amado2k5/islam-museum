id: event/al-hadi-settlement-with-the-dhimmis-of-najran-at-one-ninth-284
class: event
kind: other
label:
  ar: صلح الهادي مع أهل الذمة في نجران على التسع وبداية كتاب الصلح
  en: Al-Hadi's settlement with the dhimmi people of Najran at one-ninth, and the opening of its text
  ur: ہادی کی نجران کے اہل ذمہ سے نویں حصے پر صلح اور اس کے متن کا آغاز
  es: "El acuerdo de Al-Hadi con el pueblo dhimmi de Najran en el undécimo y el comienzo de su texto"
  fr: "L'accord d'Al-Hadi avec les dhimmis de Najran au neuvième degré, et l'ouverture de son texte"
  tr: "El-Hadi, dokuz [para birimi] ve barış antlaşmasının başlangıcı esasına dayanarak Necran'daki Ahd Ehli ile barış yaptı."
  id: "Al-Hadi berdamai dengan kaum Pakta Perjanjian di Najran berdasarkan sembilan [satuan mata uang] dan dimulainya perjanjian perdamaian."
summary:
  ar: نظر الهادي في أموال أهل الذمة في نجران مما اشتروه من المسلمين، وقال إن أُطلقوا في شراء أموال المسلمين بطلت الأعشار وضعف الإسلام، ثم أخرجهم فضجوا، فاستخار الله وعزم على صلح التُسع من غلات أموالهم، وعُرض عليهم بحضرة فقهاء وجماعة من المسلمين فرضوا، وكتب كتابه بيده وبدأ نصه بحمد الله.
  en: Al-Hadi considered the property of the dhimmi of Najran bought from Muslims, saying that if they were left free to buy Muslim property the tithes would lapse and Islam weaken; when he called for them to give it up they protested, so after seeking God's choice he settled on a settlement of one-ninth of the produce of their property, offered it before jurists and Muslims, they agreed, and he wrote the document himself, its text opening with praise of God.
  ur: ہادی نے نجران کے ذمیوں کے اس مال پر غور کیا جو انہوں نے مسلمانوں سے خریدا تھا، اور کہا کہ اگر انہیں مسلمانوں کے اموال خریدنے کی کھلی چھوٹ ملے تو عشر ختم اور اسلام کمزور ہوگا؛ جب انہیں چھوڑنے کو کہا تو وہ چیخ اٹھے، تو استخارہ کر کے ان کی پیداوار کے نویں حصے پر صلح کا فیصلہ کیا، فقہاء اور مسلمانوں کی موجودگی میں پیش کی، وہ راضی ہوئے اور انہوں نے اپنے ہاتھ سے دستاویز لکھی جس کا متن اللہ کی حمد سے شروع ہوتا ہے۔
  es: "Al-Hadi consideró las propiedades de los dhimmi de Najran, compradas a musulmanes, y afirmó que si se les permitía comprar propiedades musulmanas, los diezmos desaparecerían y el Islam se debilitaría. Cuando les pidió que las entregaran, protestaron, así que, tras consultar la voluntad de Dios, acordó un acuerdo equivalente a una novena parte de la producción de sus propiedades, lo presentó ante juristas y musulmanes, quienes estuvieron de acuerdo, y él mismo redactó el documento, cuyo texto comienza con alabanzas a Dios."
  fr: "Al-Hadi considérait les biens des dhimmis de Najran achetés aux musulmans, affirmant que s'ils étaient libres d'acheter des biens musulmans, la dîme disparaîtrait et l'islam s'affaiblirait; lorsqu'il leur demanda d'y renoncer, ils protestèrent, alors après avoir consulté Dieu, il opta pour un règlement d'un neuvième du produit de leurs biens, le présenta aux juristes et aux musulmans, qui l'approuvèrent, et il rédigea lui-même le document, dont le texte s'ouvrait sur des louanges à Dieu."
  tr: "El-Hadi, Necran'daki Ahd Ehli'nin Müslümanlardan satın aldıkları paraya baktı ve Müslümanların parasını satın almalarına izin verilirse, zekâtın geçersiz olacağını ve İslam'ın zayıflayacağını söyledi. Sonra onları kovdu ve onlar şikayet ettiler. Bunun üzerine Allah'tan hidayet diledi ve paralarının dokuzda birini onlara vererek barışmaya karar verdi. Bu, hukukçuların ve bir grup Müslümanın huzurunda onlara sunuldu ve onlar da kabul ettiler. Ardından kendi eliyle kitabını yazdı ve metnine Allah'a hamd ile başladı."
  id: "Al-Hadi memeriksa uang milik Kaum Perjanjian di Najran yang telah mereka beli dari kaum Muslimin, dan dia berkata bahwa jika mereka diizinkan untuk membeli uang kaum Muslimin, zakat akan batal dan Islam akan melemah. Kemudian dia mengusir mereka dan mereka mengeluh, sehingga dia meminta petunjuk dari Allah dan memutuskan untuk berdamai dengan sepersembilan hasil uang mereka, dan itu disajikan kepada mereka di hadapan para ahli hukum dan sekelompok Muslim dan mereka setuju, dan dia menulis bukunya dengan tangannya sendiri dan memulai teksnya dengan pujian kepada Allah."
