id: event/al-hadi-settlement-with-the-dhimmis-of-najran-at-one-ninth-284
class: event
kind: other
label:
  ar: صلح الهادي مع أهل الذمة في نجران على التسع وبداية كتاب الصلح
  en: Al-Hadi's settlement with the dhimmi people of Najran at one-ninth, and the opening of its text
  ur: ہادی کی نجران کے اہل ذمہ سے نویں حصے پر صلح اور اس کے متن کا آغاز
summary:
  ar: نظر الهادي في أموال أهل الذمة في نجران مما اشتروه من المسلمين، وقال إن أُطلقوا في شراء أموال المسلمين بطلت الأعشار وضعف الإسلام، ثم أخرجهم فضجوا، فاستخار الله وعزم على صلح التُسع من غلات أموالهم، وعُرض عليهم بحضرة فقهاء وجماعة من المسلمين فرضوا، وكتب كتابه بيده وبدأ نصه بحمد الله.
  en: Al-Hadi considered the property of the dhimmi of Najran bought from Muslims, saying that if they were left free to buy Muslim property the tithes would lapse and Islam weaken; when he called for them to give it up they protested, so after seeking God's choice he settled on a settlement of one-ninth of the produce of their property, offered it before jurists and Muslims, they agreed, and he wrote the document himself, its text opening with praise of God.
  ur: ہادی نے نجران کے ذمیوں کے اس مال پر غور کیا جو انہوں نے مسلمانوں سے خریدا تھا، اور کہا کہ اگر انہیں مسلمانوں کے اموال خریدنے کی کھلی چھوٹ ملے تو عشر ختم اور اسلام کمزور ہوگا؛ جب انہیں چھوڑنے کو کہا تو وہ چیخ اٹھے، تو استخارہ کر کے ان کی پیداوار کے نویں حصے پر صلح کا فیصلہ کیا، فقہاء اور مسلمانوں کی موجودگی میں پیش کی، وہ راضی ہوئے اور انہوں نے اپنے ہاتھ سے دستاویز لکھی جس کا متن اللہ کی حمد سے شروع ہوتا ہے۔
