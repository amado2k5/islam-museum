label: { ar: "وقعة الربض", en: "The battle of al-Rabad", es: "La batalla de al-Rabad", fr: "La bataille d'al-Rabad", ur: "الرابع کی جنگ" }
summary:
  ar: "في صدر ولاية الحكم بن هشام كان قد أنهمك في لذاته فاجتمع أهل العلم والورع بقرطبة مثل يحيى بن يحيى الليثي صاحب مالك وطالوت الفقيه فثاروا به وخلعوه وبايعوا بعض قرابته وكانوا بالربض الغربي من قرطبة محلة متصلة بقصره، فقاتلهم الحكم فغلبهم وافترقوا وهدم دورهم ومساجدهم ولحقوا بفاس من أرض العدوة وبالإسكندرية من أرض المشرق، ثم ثاروا بها فزحف إليهم عبد الله بن طاهر صاحب مصر للمأمون فغلبهم وأجازهم إلى جزيرة أقريطيش فلم يزالوا بها إلى أن ملكها الإفرنج من أيديهم {cite:nafh-tib-maqqari p. 375-376}."
  en: "The Rabad revolt: Cordoba's learned and pious rose against al-Hakam I in his dissolute early years; he crushed the western suburb, razed its houses and mosques and scattered its people to Fez and Alexandria — whence Abdallah b. Tahir expelled them to Crete, where they held the island until the Franks took it {cite:nafh-tib-maqqari p. 375-376}."
  es: "La revuelta de Rabad: los eruditos y piadosos de Córdoba se alzaron contra al-Hakam I en sus disolutos primeros años; aplastó el suburbio occidental, arrasó sus casas y mezquitas y dispersó a su gente a Fez y Alejandría, de donde Abdallah b. Tahir los expulsó a Creta, donde mantuvieron la isla hasta que los francos la tomaron {cite:nafh-tib-maqqari p. 375-376}."
  fr: "La révolte de Rabad: les érudits et les pieux de Cordoue se sont soulevés contre al-Hakam Ier dans ses premières années dissolues; il a écrasé la banlieue ouest, rasé ses maisons et ses mosquées et dispersé ses habitants à Fès et à Alexandrie — d'où Abdallah b. Tahir les a expulsés vers la Crète, où ils ont tenu l'île jusqu'à ce que les Francs la prennent {cite:nafh-tib-maqqari p. 375-376}."
  ur: "رباد بغاوت: قرطبہ کے متعلم اور متقی اپنے ابتدائی سالوں میں الحکم اول کے خلاف اٹھ کھڑے ہوئے۔ اس نے مغربی مضافاتی علاقے کو کچل دیا، اس کے مکانات اور مساجد کو مسمار کر دیا اور اس کے لوگوں کو فیز اور اسکندریہ میں منتشر کر دیا - جہاں سے عبداللہ بن۔ طاہر نے انہیں کریٹ میں نکال دیا، جہاں انہوں نے اس جزیرے کو اس وقت تک اپنے پاس رکھا جب تک کہ فرینکوں نے اسے حاصل نہ کر لیا۔ 375-376}۔"
