label: { ar: "وقعة الربض" }
summary:
  ar: "في صدر ولاية الحكم بن هشام كان قد أنهمك في لذاته فاجتمع أهل العلم والورع بقرطبة مثل يحيى بن يحيى الليثي صاحب مالك وطالوت الفقيه فثاروا به وخلعوه وبايعوا بعض قرابته وكانوا بالربض الغربي من قرطبة محلة متصلة بقصره، فقاتلهم الحكم فغلبهم وافترقوا وهدم دورهم ومساجدهم ولحقوا بفاس من أرض العدوة وبالإسكندرية من أرض المشرق، ثم ثاروا بها فزحف إليهم عبد الله بن طاهر صاحب مصر للمأمون فغلبهم وأجازهم إلى جزيرة أقريطيش فلم يزالوا بها إلى أن ملكها الإفرنج من أيديهم {cite:nafh-tib-maqqari p. 375-376}."
  en: "The Rabad revolt: Cordoba's learned and pious rose against al-Hakam I in his dissolute early years; he crushed the western suburb, razed its houses and mosques and scattered its people to Fez and Alexandria — whence Abdallah b. Tahir expelled them to Crete, where they held the island until the Franks took it {cite:nafh-tib-maqqari p. 375-376}."
