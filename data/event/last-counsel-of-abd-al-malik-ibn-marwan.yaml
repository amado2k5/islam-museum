id: event/last-counsel-of-abd-al-malik-ibn-marwan
class: event
kind: death
label:
  ar: وصية عبد الملك بن مروان للوليد ولأبنائه عند احتضاره
  en: Last counsel of Abd al-Malik ibn Marwan to al-Walid and his sons
  ur: عبدالملک بن مروان کی ولید اور بیٹوں کو آخری نصیحت
  es: "Último consejo de Abd al-Malik ibn Marwan a al-Walid y sus hijos."
  fr: "Dernier conseil d'Abd al-Malik ibn Marwan à al-Walid et à ses fils"
  tr: "Abdülmalik ibn Mervan'ın ölüm döşeğinde el-Valid ve oğullarına vasiyeti."
  id: "Wasiat Abd al-Malik ibn Marwan kepada al-Walid dan putra-putranya di ranjang kematiannya"
summary:
  ar: "لما احتضر عبد الملك بن مروان بدمشق سمع قصاراً بالوادي فتمنى لو كان مثله ولم يلِ الخلافة {cite:al-bidaya-wal-nihaya scan vol. 5 p. 79}. ولما بكى ابنه الوليد زجره وأوصاه أن يشمّر ويضرب عنق من أبدى ذات نفسه {cite:tarikh-islam-dhahabi scan vol. 9 p. 143}. وأوصى بنيه بتقوى الله وترك الفرقة والصدور عن رأي مسلمة، وأوصى الله بابنته فاطمة، وتزوجها عمر بن عبد العزيز {cite:tarikh-islam-dhahabi scan vol. 9 p. 143}. وتوفي في منتصف شوال سنة ست وثمانين وصلى عليه الوليد ودُفن عند باب الجابية الصغير {cite:al-bidaya-wal-nihaya scan vol. 5 p. 79}."
  en: "As he lay dying in Damascus Abd al-Malik ibn Marwan heard a launderer in the valley and wished he had been such a man and never held the caliphate {cite:al-bidaya-wal-nihaya scan vol. 5 p. 79}. When his son al-Walid wept he rebuked him and told him to gird himself and strike the neck of whoever showed what was in his mind {cite:tarikh-islam-dhahabi scan vol. 9 p. 143}. He charged his sons to fear God, avoid division and take their lead from Maslama, and he commended his daughter Fatima, whom Umar ibn Abd al-Aziz married, to God {cite:tarikh-islam-dhahabi scan vol. 9 p. 143}. He died in mid-Shawwal of the year 86; al-Walid prayed over him and he was buried at the small Bab al-Jabiya {cite:al-bidaya-wal-nihaya scan vol. 5 p. 79}."
  ur: "دمشق میں آخری وقت پر عبدالملک بن مروان نے وادی میں ایک دھوبی کو سنا اور تمنا کی کہ کاش وہ اس جیسا ہوتا اور خلافت نہ پاتا {cite:al-bidaya-wal-nihaya scan vol. 5 p. 79}۔ بیٹے ولید کے رونے پر اسے ٹوکا اور ہدایت کی کہ کمر کس لے اور جو اپنے دل کی بات ظاہر کرے اس کی گردن اڑا دے {cite:tarikh-islam-dhahabi scan vol. 9 p. 143}۔ بیٹوں کو اللہ سے ڈرنے، تفرقے سے بچنے اور مسلمہ کی رائے پر چلنے کی وصیت کی، اور بیٹی فاطمہ کو اللہ کے سپرد کیا، جن سے بعد میں عمر بن عبدالعزیز نے نکاح کیا {cite:tarikh-islam-dhahabi scan vol. 9 p. 143}۔ وہ سن 86 کے وسطِ شوال میں فوت ہوئے، ولید نے نماز پڑھائی اور باب الجابیہ الصغیر کے پاس دفن ہوئے {cite:al-bidaya-wal-nihaya scan vol. 5 p. 79}۔"
  es: "Mientras agonizaba en Damasco, Abd al-Malik ibn Marwan oyó a un lavandero en el valle y deseó haber sido él y no haber ostentado jamás el califato {cite:al-bidaya-wal-nihaya scan vol. 5 p. 79}. Cuando su hijo al-Walid lloró, lo reprendió y le dijo que se ciñera y golpeara el cuello de quien mostrara lo que pensaba {cite:tarikh-islam-dhahabi scan vol. 9 p. 143}. Les encargó a sus hijos que temieran a Dios, evitaran la división y siguieran el ejemplo de Maslama, y encomendó a Dios a su hija Fátima, con quien Umar ibn Abd al-Aziz se casó {cite:tarikh-islam-dhahabi scan vol. 9 p. 143}. Murió a mediados de Shawwal del año 86; Al-Walid oró por él y fue enterrado en el pequeño Bab al-Jabiya {cite:al-bidaya-wal-nihaya scan vol. 5 p. 79}."
  fr: "Alors qu'il agonisait à Damas, Abd al-Malik ibn Marwan entendit parler d'un blanchisseur d'argent dans la vallée et regretta de ne pas avoir été un tel homme et de n'avoir jamais régné sur le califat {cite:al-bidaya-wal-nihaya scan vol. 5 p. 79}. Lorsque son fils al-Walid pleura, il le réprimanda et lui dit de se préparer et de frapper à la nuque quiconque révélerait ses pensées {cite:tarikh-islam-dhahabi scan vol. 9 p. 143}. Il enjoignit à ses fils de craindre Dieu, d'éviter les divisions et de suivre l'exemple de Maslama, et il recommanda à Dieu sa fille Fatima, épouse d'Umar ibn Abd al-Aziz {cite:tarikh-islam-dhahabi scan vol. 9 p. 143}. Il mourut au milieu du mois de Shawwal de l'an 86. al-Walid a prié sur lui et il a été enterré au petit Bab al-Jabiya {cite:al-bidaya-wal-nihaya scan vol. 5 p. 79}."
  tr: "Abdülmalik ibn Mervan Şam'da ölüm döşeğindeyken, vadide bir hikaye anlatıcısını dinledi ve keşke onun gibi olsaydım ve halife olmasaydım diye düşündü. Oğlu el-Velid ağlayınca, onu azarladı ve kararlı olmasını, kendisine meydan okumaya cüret eden herkesin başını kesmesini emretti. Oğullarına Allah'tan korkmalarını, fitneden kaçınmalarını ve Müslüman bir kadının görüşüne uymalarını tavsiye etti. Kızı Fatıma'yı Allah'ın korumasına emanet etti ve Fatıma Ömer ibn Abdülaziz ile evlendi. Hicri 86 yılının Şevval ayının ortasında vefat etti. El-Velid cenaze namazını kıldırdı ve küçük Bab el-Cabiye kapısının yakınlarına defnedildi."
  id: "Ketika Abd al-Malik ibn Marwan sedang sekarat di Damaskus, ia mendengar seorang pendongeng di lembah dan berharap ia seperti pendongeng itu dan tidak menjadi Khalifah. Ketika putranya, al-Walid, menangis, ia menegurnya dan memerintahkannya untuk teguh dan memenggal kepala siapa pun yang berani menantangnya. Ia menasihati putra-putranya untuk takut kepada Allah, menghindari perselisihan, dan mengikuti pendapat seorang wanita Muslim. Ia mempercayakan putrinya, Fatimah, kepada pemeliharaan Allah, dan Fatimah menikah dengan Umar ibn Abd al-Aziz. Ia meninggal pada pertengahan bulan Syawal tahun 86 Hijriah. Al-Walid memimpin salat jenazah, dan ia dimakamkan di dekat gerbang kecil Bab al-Jabiyah."
