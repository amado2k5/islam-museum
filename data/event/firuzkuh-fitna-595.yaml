label: { ar: "فتنة فيروزكوه بين الرازي والكرامية", en: "The Firuzkuh fitna (595 AH)" }
summary:
  ar: "في سنة خمس وتسعين وخمسمائة قدم فخر الدين الرازي إلى السلطان غياث الدين الغوري مفارقاً لبهاء الدين سام صاحب باميان، فأكرمه السلطان وبنى له مدرسة بهراة بالقرب من الجامع فقصده الفقهاء؛ فعظم ذلك على الكرامية وهم كثيرون بهراة والغورية كلهم كرامية، وكان أشد الناس عليه الملك ضياء الدين ابن عم غياث الدين وزوج ابنته. حضر الفقهاء من الكرامية والحنفية والشافعية للمناظرة عند غياث الدين بفيروزكوه، فتكلم الرازي واعترض عليه ابن القدوة شيخ الكرامية وطال الكلام، فاستطال الفخر على السلطان القائم وسبّه، وابن القدوة لا يزيد على أن يقول «لا يفعل مولانا». وفي الغد صعد ابن القدوة المنبر وأعلن أنه لا يعلم علم أرسطاطاليس وكفريات ابن سينا وفلسفة الفارابي، فبكى وبكى الكرامية وثار الناس من كل جانب وامتلأ البلد فتنة وكادوا يقتتلون فيهلك خلق كثير، فأرسل السلطان من سكنهم ووعدهم بإخراج الرازي من عندهم وردّه إلى هراة {cite:kamil-ibn-al-athir p. 262}."
  en: "595 AH: Fakhr al-Din al-Razi, newly honoured at the Ghurid court with a madrasa beside the Herat jami', debated the Karrami shaykh Ibn al-Qadwa before Sultan Ghiyath al-Din at Firuzkuh; after al-Razi insulted the standing sultan, Ibn al-Qadwa preached the next day disavowing the philosophers, the crowd wept and the town filled for riot until the sultan quieted it by sending al-Razi back to Herat — a window on Karrami strength in the Ghurid realm {cite:kamil-ibn-al-athir p. 262}."
