label: { ar: "فتنة فيروزكوه بين الرازي والكرامية", en: "The Firuzkuh fitna (595 AH)", es: "La fitna de Firuzkuh (595 AH)", fr: "La fitna de Firuzkuh (595 AH)", ur: "فیروزکوہ فتنہ ⁦(595ھ)⁩", tr: "El-Razi ile Kerremitler arasındaki Firuzkuh anlaşmazlığı", id: "Kontroversi Firuzkuh antara al-Razi dan kaum Karram." }
summary:
  ar: "في سنة خمس وتسعين وخمسمائة قدم فخر الدين الرازي إلى السلطان غياث الدين الغوري مفارقاً لبهاء الدين سام صاحب باميان، فأكرمه السلطان وبنى له مدرسة بهراة بالقرب من الجامع فقصده الفقهاء؛ فعظم ذلك على الكرامية وهم كثيرون بهراة والغورية كلهم كرامية، وكان أشد الناس عليه الملك ضياء الدين ابن عم غياث الدين وزوج ابنته. حضر الفقهاء من الكرامية والحنفية والشافعية للمناظرة عند غياث الدين بفيروزكوه، فتكلم الرازي واعترض عليه ابن القدوة شيخ الكرامية وطال الكلام، فاستطال الفخر على السلطان القائم وسبّه، وابن القدوة لا يزيد على أن يقول «لا يفعل مولانا». وفي الغد صعد ابن القدوة المنبر وأعلن أنه لا يعلم علم أرسطاطاليس وكفريات ابن سينا وفلسفة الفارابي، فبكى وبكى الكرامية وثار الناس من كل جانب وامتلأ البلد فتنة وكادوا يقتتلون فيهلك خلق كثير، فأرسل السلطان من سكنهم ووعدهم بإخراج الرازي من عندهم وردّه إلى هراة {cite:kamil-ibn-al-athir p. 262}."
  en: "595 AH: Fakhr al-Din al-Razi, newly honoured at the Ghurid court with a madrasa beside the Herat jami', debated the Karrami shaykh Ibn al-Qadwa before Sultan Ghiyath al-Din at Firuzkuh; after al-Razi insulted the standing sultan, Ibn al-Qadwa preached the next day disavowing the philosophers, the crowd wept and the town filled for riot until the sultan quieted it by sending al-Razi back to Herat — a window on Karrami strength in the Ghurid realm {cite:kamil-ibn-al-athir p. 262}."
  es: "595 AH: Fakhr al-Din al-Razi, recientemente honrado en la corte Ghurid con una madrasa junto al jami' de Herat, debatió con el shaykh karrami Ibn al-Qadwa ante el sultán Ghiyath al-Din en Firuzkuh; después de que al-Razi insultara al sultán en funciones, Ibn al-Qadwa predicó al día siguiente desautorizando a los filósofos, la multitud lloró y la ciudad se llenó de disturbios hasta que el sultán la calmó enviando a al-Razi de regreso a Herat, una muestra de la fuerza karrami en el reino Ghurid {cite:kamil-ibn-al-athir p. 262}."
  fr: "595 AH: Fakhr al-Din al-Razi, récemment honoré à la cour des Ghurides avec une madrasa à côté du jami' d'Hérat, débattit avec le cheikh karrami Ibn al-Qadwa devant le sultan Ghiyath al-Din à Firuzkuh; après qu'al-Razi eut insulté le sultan en fonction, Ibn al-Qadwa prêcha le lendemain désavouant les philosophes, la foule pleura et la ville se remplit d'émeutes jusqu'à ce que le sultan les calme en renvoyant al-Razi à Hérat — une fenêtre sur la force karrami dans le royaume ghuride {cite:kamil-ibn-al-athir p. 262}."
  ur: "595 ہجری: فخرالدین الرازی، جو ہرات جامع کے پاس ایک مدرسہ کے ساتھ غورید کے دربار میں نئے اعزاز سے سرفراز ہوئے، نے فیروزکوہ میں سلطان غیاث الدین کے سامنے کرامی شیخ ابن القدوی سے بحث کی۔ الرازی کی طرف سے کھڑے سلطان کی توہین کرنے کے بعد، ابن القدوہ نے اگلے دن فلسفیوں کی مخالفت کرتے ہوئے تبلیغ کی، ہجوم رو پڑا اور قصبہ فسادات سے بھر گیا یہاں تک کہ سلطان نے الرازی کو واپس ہرات بھیج کر اسے خاموش کرادیا۔ 262}۔"
  tr: "Hicri 595 yılında (Miladi 1106), Fahreddin es-Razi, Bamiyan hükümdarı Baha'd-Din Sam'dan ayrıldıktan sonra Sultan Gıyaseddin es-Gavri'nin sarayına geldi. Sultan onu onurlandırdı ve Herat'ta, caminin yakınında onun için bir medrese inşa etti. Alimler buraya akın etti; bu durum, Herat'ta sayıları çok olan ve takipçilerinin tamamı Kerremiyye mezhebine mensup olan Kerremiyye mezhebini büyük ölçüde kızdırdı. Ona karşı en düşman kişi, Gıyaseddin'in kuzeni ve kızının kocası olan Kral Diya'd-Din idi. Kerremiyye, Hanefi ve Şafiî mezheplerinden alimler, Firuzkuh'taki Gıyaseddin'in sarayında bir tartışma için toplandılar. El-Razi konuştu ve Kerremiyye'nin başı İbn el-Kudve itiraz etti. Tartışma uzun sürdü ve Fahreddin Sultan'a saygısızlık ederek hakaret etti. İbnü'l-Kudve ise sadece \"Efendimiz bunu yapmazdı\" diye karşılık verdi. Ertesi gün İbnü'l-Kudve minbere çıktı ve Aristoteles'in ilmini, İbn Sina'nın sapkınlıklarını veya Farabi'nin felsefesini bilmediğini ilan etti. Ağladı, Kerremliler de ağladı ve halk her taraftan ayaklandı, ülke karışıklıkla doldu, neredeyse savaş çıktı ve birçok insan öldü. Bunun üzerine Sultan, onları yatıştırmak için birini gönderdi ve aralarından Razi'yi çıkarıp Herat'a geri getireceğine söz verdi. {kaynak: Kamil İbnü'l-Athir s. 262}"
  id: "Pada tahun 595 H (1106 M), Fakhr al-Din al-Razi tiba di istana Sultan Ghiyath al-Din al-Ghawri, setelah berpisah dengan Baha' al-Din Sam, penguasa Bamiyan. Sultan menghormatinya dan membangun madrasah untuknya di Herat, dekat masjid. Para ulama berbondong-bondong datang ke sana, yang sangat membuat marah kaum Karramiyya, yang jumlahnya banyak di Herat dan pengikutnya semuanya adalah kaum Karramiyya. Orang yang paling memusuhinya adalah Raja Diya' al-Din, sepupu Ghiyath al-Din dan suami dari putrinya. Para ulama dari mazhab Karramiyya, Hanafi, dan Syafi'i berkumpul untuk berdebat di istana Ghiyath al-Din di Firuzkuh. Al-Razi berbicara, dan Ibn al-Qudwa, kepala kaum Karramiyya, keberatan. Debat itu berlangsung lama, dan Fakhr al-Din menjadi tidak sopan kepada Sultan, menghinanya. Ibn al-Qudwa hanya menjawab, \"Tuan kami tidak akan melakukan itu.\" Keesokan harinya, Ibn al-Qudwa naik ke mimbar dan menyatakan bahwa dia tidak mengetahui ilmu Aristoteles, ajaran sesat Ibn Sina, atau filsafat al-Farabi. Dia menangis, dan orang-orang Karram pun menangis, dan orang-orang bangkit dari segala penjuru, dan negeri itu dipenuhi perselisihan, dan mereka hampir berperang, dan banyak orang binasa. Maka Sultan mengirim seseorang untuk menenangkan mereka dan berjanji untuk membawa al-Razi keluar dari antara mereka dan mengembalikannya ke Herat. {cite:kamil-ibn-al-athir p. 262}"
