label:
  ar: "حملة سليمان باشا الخادم إلى الهند (945هـ/1538م)"
  en: "Sulayman Pasha al-Khadim's Indian expedition (1538)"
summary:
  ar: "ينقل الصلابي أن سليمان القانوني عقد اتفاقاً مع حاكمي قاليقوط وكامباي للعمل المشترك ضد البرتغال، وأصدر مرسوماً إلى [[person/sulayman-pasha-khadim|سليمان باشا الخادم]] والي مصر يأمره بتجهيز أسطول بالسويس والخروج إلى الهند حتى يقطع الطريق على البرتغاليين عن مكة المكرمة؛ فوصل جدة في سبعة أيام ثم كمران وسيطر على عدن وعيّن عليها حامية ستمائة جندي، وحاصر ديو فلم يتمكن منها وانسحابه بعد فقدان نحو أربعمائة رجل، ثم استولى على قلعة أمامية وأسر ثمانين برتغالياً {cite:dawlat-uthmaniyya-salabi p. 196}. ويقع ذلك على الصلابي في عهد سليمان القانوني سنة 945هـ/1538م {cite:dawlat-uthmaniyya-salabi p. 191}."
  en: "Al-Salabi records Sulayman the Magnificent's compact with the rulers of Calicut and Cambay against Portugal, and his firman to [[person/sulayman-pasha-khadim|Sulayman Pasha al-Khadim]] of Egypt ordering a fleet fitted at Suez to sail for India and cut the Portuguese road to Mecca; reaching Jeddah in seven days, then Kamaran, he took Aden with a six-hundred-man garrison, besieged Diu without taking it — losing some four hundred men — and captured a forward castle with eighty prisoners before withdrawing {cite:dawlat-uthmaniyya-salabi p. 196}, in the campaign the book dates 945/1538 {cite:dawlat-uthmaniyya-salabi p. 191}."
