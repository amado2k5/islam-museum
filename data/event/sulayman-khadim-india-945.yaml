summary:
  ar: "ينقل الصلابي أن سليمان القانوني عقد اتفاقاً مع حاكمي قاليقوط وكامباي للعمل المشترك ضد البرتغال، وأصدر مرسوماً إلى [[person/sulayman-pasha-khadim|سليمان باشا الخادم]] والي مصر يأمره بتجهيز أسطول بالسويس والخروج إلى الهند حتى يقطع الطريق على البرتغاليين عن مكة المكرمة؛ فوصل جدة في سبعة أيام ثم كمران وسيطر على عدن وعيّن عليها حامية ستمائة جندي، وحاصر ديو فلم يتمكن منها وانسحابه بعد فقدان نحو أربعمائة رجل، ثم استولى على قلعة أمامية وأسر ثمانين برتغالياً {cite:dawlat-uthmaniyya-salabi p. 196}. ويقع ذلك على الصلابي في عهد سليمان القانوني سنة 945هـ/1538م {cite:dawlat-uthmaniyya-salabi p. 191}."
  en: "Al-Salabi records Sulayman the Magnificent's compact with the rulers of Calicut and Cambay against Portugal, and his firman to [[person/sulayman-pasha-khadim|Sulayman Pasha al-Khadim]] of Egypt ordering a fleet fitted at Suez to sail for India and cut the Portuguese road to Mecca; reaching Jeddah in seven days, then Kamaran, he took Aden with a six-hundred-man garrison, besieged Diu without taking it — losing some four hundred men — and captured a forward castle with eighty prisoners before withdrawing {cite:dawlat-uthmaniyya-salabi p. 196}, in the campaign the book dates 945/1538 {cite:dawlat-uthmaniyya-salabi p. 191}."
  es: "Al-Salabi registra el pacto de Sulayman el Magnífico con los gobernantes de Calicut y Cambay contra Portugal, y su firman a [[person/sulayman-pasha-khadim|Sulayman Pasha al-Khadim]] de Egipto ordenando que una flota equipada en Suez zarpara hacia la India y cortara el camino portugués a La Meca; llegando a Jeddah en siete días, luego a Kamaran, tomó Adén con una guarnición de seiscientos hombres, sitió Diu sin tomarla —perdiendo unos cuatrocientos hombres— y capturó un castillo avanzado con ochenta prisioneros antes de retirarse {cite:dawlat-uthmaniyya-salabi p. 196}, en la campaña que el libro fecha en 945/1538 {cite:dawlat-uthmaniyya-salabi p. 191}."
  fr: "Al-Salabi relate le pacte conclu par Sulayman le Magnifique avec les souverains de Calicut et de Cambay contre le Portugal, ainsi que son firman à Sulayman Pacha al-Khadim d'Égypte, ordonnant à une flotte préparée à Suez de faire voile vers l'Inde et de couper la route portugaise vers La Mecque; atteignant Djeddah en sept jours, puis Kamaran, il prit Aden avec une garnison de six cents hommes, assiégea Diu sans la prendre — perdant environ quatre cents hommes — et captura un château avancé avec quatre-vingts prisonniers avant de se retirer {cite:dawlat-uthmaniyya-salabi p. 196}, au cours de la campagne que le livre date de 945/1538 {cite:dawlat-uthmaniyya-salabi p. 191}."
  ur: "السلبی نے پرتگال کے خلاف کالی کٹ اور کیمبے کے حکمرانوں کے ساتھ سلیمان دی میگنیفیشنٹ کا معاہدہ ریکارڈ کیا، اور اس کا فرمان مصر کے [[شخص/سلیمان-پاشا-خادم|سلیمان پاشا الخادم]] کو سوئز میں نصب ایک بحری بیڑے کو ہندوستان جانے اور پرتگال جانے والی سڑک کاٹنے کا حکم دیتا ہے۔ سات دنوں میں جدہ پہنچا، پھر کامران، اس نے چھ سو آدمیوں پر مشتمل چھاؤنی کے ساتھ عدن پر قبضہ کیا، دیو کا محاصرہ کر لیا - تقریباً چار سو آدمیوں کو کھوئے - اور پیچھے ہٹنے سے پہلے اسّی قیدیوں کے ساتھ ایک آگے والے قلعے پر قبضہ کر لیا۔ 196}، مہم میں کتاب تاریخ 945/1538 {حوالہ:دولت عثمانیہ سلبی ص۔ 191}۔"
  tr: "El-Sallabi, Kanuni Sultan Süleyman'ın Portekizlilere karşı birlikte çalışmak üzere Kaliküt ve Kambay yöneticileriyle bir anlaşma yaptığını anlatır. Mısır valisi Süleyman Paşa el-Hadim'e Süveyş'te bir filo hazırlayıp Hindistan'a giderek Portekizlilerin Mekke'ye giden yolunu kesmesini emreden bir ferman yayınladı. Filo yedi gün içinde Cidde'ye, ardından Kamaran'a ulaştı ve Aden'i ele geçirerek burada altı yüz askerden oluşan bir garnizon kurdu. Diu'yu kuşattı ancak ele geçiremedi ve yaklaşık dört yüz adam kaybettikten sonra geri çekildi. Daha sonra daha önce ele geçirilmiş bir kaleyi ele geçirdi ve seksen Portekizliyi esir aldı. El-Sallabi'ye göre bu olaylar Kanuni Sultan Süleyman'ın hükümdarlığı döneminde, Hicri 945/Miladi 1538 yılında gerçekleşti."
  id: "Al-Sallabi menceritakan bahwa Suleiman Agung membuat kesepakatan dengan penguasa Calicut dan Cambay untuk bekerja sama melawan Portugis. Ia mengeluarkan dekrit kepada Sulayman Pasha al-Khadim, gubernur Mesir, memerintahkannya untuk mempersiapkan armada di Suez dan berlayar ke India untuk memutus jalur Portugis ke Mekah. Armada tersebut mencapai Jeddah dalam tujuh hari, kemudian Kamaran, dan merebut Aden, di mana ia mendirikan garnisun yang terdiri dari enam ratus tentara. Ia mengepung Diu tetapi tidak mampu merebutnya, mundur setelah kehilangan sekitar empat ratus orang. Kemudian ia merebut benteng sebelumnya dan menangkap delapan puluh tawanan Portugis. Menurut al-Sallabi, ini terjadi selama pemerintahan Suleiman Agung pada tahun 945 H/1538 M."
