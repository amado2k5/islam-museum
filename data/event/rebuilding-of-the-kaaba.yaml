significance:
  ar: "شهد النبي فضيلة التحكيم قبل النبوة؛ وبنيت الكعبة بمال طيب، وتركت قريش منها نحو ستة أذرع — الحجر والحطيم — لقصور النفقة (الرحيق ص62؛ بخاري 1/215)."
