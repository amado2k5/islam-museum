date:
  start: { edtf: "0605~", calendar: julian, precision: year, status: tradition, note: "لخمس وثلاثين سنة من مولده، قبل بعثته بخمس سنين تقريباً (الرحيق ص61؛ ابن هشام 1/192-197)." }
significance:
  ar: "شهد النبي فضيلة التحكيم قبل النبوة؛ وبنيت الكعبة بمال طيب، وتركت قريش منها نحو ستة أذرع — الحجر والحطيم — لقصور النفقة (الرحيق ص62؛ بخاري 1/215)."
