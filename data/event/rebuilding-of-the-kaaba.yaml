label: { en: "The rebuilding of the Kaaba", ar: "إعادة بناء الكعبة وقضية الحجر الأسود" }
summary:
  en: "Quraysh's rebuilding of the Kaaba when Muhammad was thirty-five — a flood-weakened structure rebuilt with 'lawful money only' — and the arbitration over the Black Stone that he settled with the cloak solution."
  ar: "إعادة قريش بناء الكعبة لما كان عمر النبي خمساً وثلاثين سنة — بناءً لجدران صدّعها السيل بمال طيب لا مهر بغي ولا ربا ولا مظلمة — وتحكيمه في شرف وضع الحجر الأسود بحلّ الرداء الذي ارتضوه."
