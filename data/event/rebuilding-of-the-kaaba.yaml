id: event/rebuilding-of-the-kaaba
education:
  did_you_know:
    ar: "لما كان عمر النبي خمساً وثلاثين أعادت قريش بناء الكعبة، وتحكّم هو في نزاع من يضع الحجر الأسود بحلّ الرداء."
    en: "When the Prophet was thirty-five, Quraysh rebuilt the Kaaba, and he arbitrated their dispute over placing the Black Stone with the cloak solution they accepted."
    ur: "جب نبی کی عمر پینتیس برس تھی تو قریش نے کعبہ تعمیر کیا اور سیاہ حجر رکھنے کے جھگڑے میں انھوں نے چادر کی ترتیب سے فیصلہ کیا جو سب نے مانا۔"
    sources: [source/ibn-ishaq-guillaume, source/watt-1953-mecca]
class: event
kind: founding
label: { en: "The rebuilding of the Kaaba", ar: "إعادة بناء الكعبة وقضية الحجر الأسود", es: "La reconstrucción de la Kaaba", fr: "La reconstruction de la Kaaba", ur: "خانہ کعبہ کی تعمیر نو", tr: "Kabe'nin Yeniden İnşası ve Kara Taş Mesele", id: "Pembangunan kembali Ka'bah dan masalah Batu Hitam" }
summary:
  en: "Quraysh's rebuilding of the Kaaba when Muhammad was thirty-five — a flood-weakened structure rebuilt with 'lawful money only' — and the arbitration over the Black Stone that he settled with the cloak solution."
  ar: "إعادة قريش بناء الكعبة لما كان عمر النبي خمساً وثلاثين سنة — بناءً لجدران صدّعها السيل بمال طيب لا مهر بغي ولا ربا ولا مظلمة — وتحكيمه في شرف وضع الحجر الأسود بحلّ الرداء الذي ارتضوه. وعند المسعودي هدم السيل الكعبة فسرق منها غزال من الذهب وحلي وجواهر فنقضتها قريش، واتخذوا في بنائها خشباً ابتاعوه من سفينة رماها البحر إلى ساحلهم كان ملك الروم بعث بها من القلزم إلى الحبشة لتبنى له كنيسة، وحكموه في الحجر فبسط رداءه ووضعه في وسطه وشاله أربعة من زعمائهم هم عتبة بن ربيعة والأسود بن عبد المطلب وأبو حذيفة بن المغيرة وقيس بن عدي السهمي فوضعه بيده، وتنوزع في القائل الذي تعجب من انقيادهم إلى أصغرهم سناً فمنهم من رآه إبليس ظهر في صورة رجل من قريش كان قد مات ومنهم من رآه حكيماً من حكمائهم، وكست الكعبة أردية الزعماء وهي الوصائل {cite:muruj-al-dhahab p. 570-571}"
  es: "La reconstrucción de la Kaaba por parte de los Quraysh cuando Mahoma tenía treinta y cinco años —una estructura debilitada por las inundaciones reconstruida solo con \"dinero lícito\"— y el arbitraje sobre la Piedra Negra que resolvió con la solución del manto."
  fr: "La reconstruction de la Kaaba par les Qurayshites lorsque Mahomet avait trente-cinq ans — une structure fragilisée par les inondations et reconstruite uniquement avec de l'argent licite — et l'arbitrage concernant la Pierre Noire qu'il a réglé par la solution du manteau."
  ur: "قریش کی جانب سے خانہ کعبہ کی تعمیر نو جب محمد پینتیس سال کے تھے - سیلاب سے کمزور ڈھانچہ 'صرف حلال رقم' سے دوبارہ تعمیر کیا گیا - اور حجر اسود پر ثالثی جسے اس نے چادر کے حل سے طے کیا۔"
  tr: "Kureyş, Peygamber otuz beş yaşındayken Kâbe'yi yeniden inşa etti; tufanla hasar görmüş duvarları, fuhuş, tefecilik veya haksız kazançla değil, gerçek parayla yeniden yaptılar ve Peygamberin, üzerinde anlaştıkları örtüyü çözerek Kara Taşı yerleştirme şerefine aracılık etmesi de bu yeniden inşanın bir parçasıydı. El-Mas'udi'ye göre, tufan Kâbe'yi yıktı ve içinden altın bir ceylan, mücevherler ve değerli taşlar çalındı. Bunun üzerine Kureyş onu yıktı ve denizin kıyılarına sürüklediği bir gemiden satın aldıkları keresteyi kullanarak yeniden inşa ettiler. Roma kralı, onun için bir kilise inşa etmek üzere bu keresteyi Kulzum'dan Habeşistan'a göndermişti. Onu Hicr'de kadı yaptılar, o da cübbesini serip ortasına koydu ve dört önderleri onu kaldırdı: Utbe bin Rabi'ah, Al-Aswad bin Abdul-Muttalib, Abu Hudhayfah bin Al-Mughirah ve Kays bin Adi Al-Sahmi, ki o da cübbeyi eliyle yerleştirdi. En küçüğünün, onların teslimiyetine şaşıran kişi olduğuna dair görüş ayrılığı vardır. Kimileri onu, ölmüş bir Kureyşli adam suretinde görünen İblis olarak görürken, kimileri de onların bilge adamlarından biri olarak görmüştür. Kâbe, önderlerin cübbeleriyle örtülmüştü ki bunlar Vesayiller'dir. {kaynak:muruj-al-dhahab s. 570-571}"
  id: "Kaum Quraisy membangun kembali Ka'bah ketika Nabi berusia tiga puluh lima tahun — membangun kembali dinding yang rusak akibat banjir dengan uang yang cukup, bukan mahar dari prostitusi, riba, atau ketidakadilan — dan beliau menjadi penengah dalam hal menempatkan Batu Hitam dengan melepaskan jubah yang telah mereka sepakati. Menurut Al-Mas'udi, banjir menghancurkan Ka'bah, dan seekor kijang emas, perhiasan, dan permata dicuri darinya. Maka kaum Quraisy merobohkannya, dan mereka menggunakan kayu dalam pembangunannya yang mereka beli dari sebuah kapal yang terdampar di pantai mereka. Raja Romawi telah mengirimkannya dari Qulzum ke Abyssinia untuk membangun sebuah gereja baginya. Mereka menjadikannya hakim pada masa Hijriah, lalu ia membentangkan jubahnya dan meletakkannya di tengah-tengahnya, dan empat pemimpin mereka mengangkatnya: Utbah bin Rabi'ah, Al-Aswad bin Abdul-Muttalib, Abu Hudhayfah bin Al-Mughirah, dan Qays bin Adi Al-Sahmi, yang meletakkannya dengan tangannya. Ada perbedaan pendapat tentang siapa yang mengatakan bahwa orang yang terkejut dengan kepatuhan mereka adalah yang termuda di antara mereka. Sebagian orang melihatnya sebagai Iblis yang muncul dalam wujud seorang pria dari Quraisy yang telah meninggal, dan sebagian lagi melihatnya sebagai salah satu orang bijak mereka. Ka'bah ditutupi oleh jubah para pemimpin, yang merupakan Wasail. {kutipan:muruj-al-dhahab hlm. 570-571}"
