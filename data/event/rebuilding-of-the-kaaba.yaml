id: event/rebuilding-of-the-kaaba
education:
  did_you_know:
    ar: "لما كان عمر النبي خمساً وثلاثين أعادت قريش بناء الكعبة، وتحكّم هو في نزاع من يضع الحجر الأسود بحلّ الرداء."
    en: "When the Prophet was thirty-five, Quraysh rebuilt the Kaaba, and he arbitrated their dispute over placing the Black Stone with the cloak solution they accepted."
    ur: "جب نبی کی عمر پینتیس برس تھی تو قریش نے کعبہ تعمیر کیا اور سیاہ حجر رکھنے کے جھگڑے میں انھوں نے چادر کی ترتیب سے فیصلہ کیا جو سب نے مانا۔"
    sources: [source/ibn-ishaq-guillaume, source/watt-1953-mecca]
class: event
kind: founding
label: { en: "The rebuilding of the Kaaba", ar: "إعادة بناء الكعبة وقضية الحجر الأسود" }
summary:
  en: "Quraysh's rebuilding of the Kaaba when Muhammad was thirty-five — a flood-weakened structure rebuilt with 'lawful money only' — and the arbitration over the Black Stone that he settled with the cloak solution."
  ar: "إعادة قريش بناء الكعبة لما كان عمر النبي خمساً وثلاثين سنة — بناءً لجدران صدّعها السيل بمال طيب لا مهر بغي ولا ربا ولا مظلمة — وتحكيمه في شرف وضع الحجر الأسود بحلّ الرداء الذي ارتضوه. وعند المسعودي هدم السيل الكعبة فسرق منها غزال من الذهب وحلي وجواهر فنقضتها قريش، واتخذوا في بنائها خشباً ابتاعوه من سفينة رماها البحر إلى ساحلهم كان ملك الروم بعث بها من القلزم إلى الحبشة لتبنى له كنيسة، وحكموه في الحجر فبسط رداءه ووضعه في وسطه وشاله أربعة من زعمائهم هم عتبة بن ربيعة والأسود بن عبد المطلب وأبو حذيفة بن المغيرة وقيس بن عدي السهمي فوضعه بيده، وتنوزع في القائل الذي تعجب من انقيادهم إلى أصغرهم سناً فمنهم من رآه إبليس ظهر في صورة رجل من قريش كان قد مات ومنهم من رآه حكيماً من حكمائهم، وكست الكعبة أردية الزعماء وهي الوصائل {cite:muruj-al-dhahab p. 570-571}"
