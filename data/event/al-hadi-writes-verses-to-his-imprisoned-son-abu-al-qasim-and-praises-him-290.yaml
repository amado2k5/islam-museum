id: event/al-hadi-writes-verses-to-his-imprisoned-son-abu-al-qasim-and-praises-him-290
class: event
kind: other
label:
  ar: "أبيات للهادي إلى ابنه أبي القاسم وهو في الحبس يثني فيها عليه، ص298"
  en: "Verses of al-Hadi to his son Abu al-Qasim in prison, praising him, p. 298"
  ur: "ہادی کے اپنے بیٹے ابو القاسم کو قید میں لکھے اشعار جن میں ان کی تعریف ہے، ص298"
  es: "Versículos de al-Hadi a su hijo Abu al-Qasim en prisión, alabándolo, pág. 298"
  fr: "Versets d'al-Hadi à son fils Abu al-Qasim en prison, le louant, p. 298"
  tr: "Hadi'nin hapisteyken oğlu Ebu el-Kâsım'a yazdığı ve onu övdüğü şiirler, s. 298"
  id: "Ayat-ayat Al-Hadi kepada putranya Abu Al-Qasim ketika ia berada di penjara, di mana ia memuji putranya, hlm. 298"
summary:
  ar: "تحت عنوان «للهادي إلى الحق إلى ولده أبي القاسم وهو مأسور في الحبس» تبدأ قصيدة يطلب فيها الشاعر من حاملين أن يبلّغا ابنه وإن بعد، ثم يعدّد صفاته في أبيات كثيرة: الدين والتقوى والفضل، والأمر بالمعروف والنهي عن الفحشاء، وصلة الرحم، ونصرة الإسلام، والبأس في الحرب، وينتهي بسلام وشكوى وحشة ودعاء بتعجيل خلاصه."
  en: "Under the heading \"of al-Hadi to his son Abu al-Qasim while he is a prisoner in the jail\" a poem begins in which the poet asks two bearers to carry word to his son though far away, then lists his qualities in many lines: religion, godfearing and bounty, commanding the right and forbidding indecency, keeping kin, support of Islam and courage in war; it ends with greetings, a complaint of loneliness and a prayer that God hasten his release."
  ur: "«ہادی کی طرف سے ان کے بیٹے ابو القاسم کے نام جب وہ قید میں تھے» کے عنوان تلے ایک نظم شروع ہوتی ہے جس میں شاعر دو قاصدوں سے کہتا ہے کہ بیٹے کو دور ہونے پر بھی پیغام پہنچائیں، پھر بہت سے اشعار میں اس کے اوصاف گنواتا ہے: دین، تقویٰ اور فضل، نیکی کا حکم اور بے حیائی سے روکنا، صلہ رحمی، اسلام کی مدد اور جنگ میں جرأت؛ نظم سلام، تنہائی کی شکایت اور اللہ سے جلد رہائی کی دعا پر ختم ہوتی ہے۔"
  es: "Bajo el título \"De al-Hadi a su hijo Abu al-Qasim mientras está prisionero en la cárcel\", comienza un poema en el que el poeta pide a dos portadores que lleven un mensaje a su hijo, aunque esté lejos, y luego enumera sus cualidades en muchos versos: religiosidad, temor a Dios y generosidad, dominio de la justicia y prohibición de la indecencia, protección de la familia, apoyo al Islam y valentía en la guerra; termina con saludos, una queja por la soledad y una oración para que Dios acelere su liberación."
  fr: "Sous le titre « D'al-Hadi à son fils Abu al-Qasim alors qu'il est prisonnier en prison », un poème commence où le poète demande à deux messagers de transmettre un message à son fils malgré la distance, puis énumère ses qualités en de nombreux vers: la religion, la crainte de Dieu et la générosité, le sens du droit et l'interdiction de l'indécence, le respect des liens familiaux, le soutien à l'islam et le courage à la guerre; il se termine par des salutations, une plainte de solitude et une prière pour que Dieu hâte sa libération."
  tr: "“Hakikate yol gösterene, hapsedilmiş oğlu Ebu el-Kasım’a” başlığı altında, şairin iki elçiden, uzakta olsa bile oğluna haber vermelerini istediği bir şiir başlıyor. Ardından, birçok dizede oğlunun niteliklerini sıralıyor: dindarlık, takva, erdem, iyiliği emretme ve kötülüğü yasaklama, akrabalık bağlarını koruma, İslam'ı destekleme ve savaşta cesaret. Şiiri, huzur, yalnızlık yakınması ve oğlunun bir an önce serbest bırakılması için dua ile bitiriyor."
  id: "Di bawah judul “Kepada orang yang membimbing kepada kebenaran, kepada putranya Abu al-Qasim, yang dipenjara,” sebuah puisi dimulai di mana penyair meminta dua utusan untuk memberi tahu putranya, meskipun ia berada jauh. Kemudian ia mendaftarkan sifat-sifat putranya dalam banyak bait: agama, ketakwaan, kebajikan, menyeru kepada kebaikan dan melarang kejahatan, menjaga hubungan kekerabatan, mendukung Islam, dan keberanian dalam perang. Ia mengakhiri dengan kedamaian, keluhan kesepian, dan doa untuk pembebasan putranya yang cepat."
