label:
  ar: "أبيات للهادي إلى ابنه أبي القاسم وهو في الحبس يثني فيها عليه، ص298"
  en: "Verses of al-Hadi to his son Abu al-Qasim in prison, praising him, p. 298"
  ur: "ہادی کے اپنے بیٹے ابو القاسم کو قید میں لکھے اشعار جن میں ان کی تعریف ہے، ص298"
summary:
  ar: "تحت عنوان «للهادي إلى الحق إلى ولده أبي القاسم وهو مأسور في الحبس» تبدأ قصيدة يطلب فيها الشاعر من حاملين أن يبلّغا ابنه وإن بعد، ثم يعدّد صفاته في أبيات كثيرة: الدين والتقوى والفضل، والأمر بالمعروف والنهي عن الفحشاء، وصلة الرحم، ونصرة الإسلام، والبأس في الحرب، وينتهي بسلام وشكوى وحشة ودعاء بتعجيل خلاصه."
  en: "Under the heading \"of al-Hadi to his son Abu al-Qasim while he is a prisoner in the jail\" a poem begins in which the poet asks two bearers to carry word to his son though far away, then lists his qualities in many lines: religion, godfearing and bounty, commanding the right and forbidding indecency, keeping kin, support of Islam and courage in war; it ends with greetings, a complaint of loneliness and a prayer that God hasten his release."
  ur: "«ہادی کی طرف سے ان کے بیٹے ابو القاسم کے نام جب وہ قید میں تھے» کے عنوان تلے ایک نظم شروع ہوتی ہے جس میں شاعر دو قاصدوں سے کہتا ہے کہ بیٹے کو دور ہونے پر بھی پیغام پہنچائیں، پھر بہت سے اشعار میں اس کے اوصاف گنواتا ہے: دین، تقویٰ اور فضل، نیکی کا حکم اور بے حیائی سے روکنا، صلہ رحمی، اسلام کی مدد اور جنگ میں جرأت؛ نظم سلام، تنہائی کی شکایت اور اللہ سے جلد رہائی کی دعا پر ختم ہوتی ہے۔"
