id: event/ali-moves-capital-to-kufa
class: event
kind: other
label: { ar: "انتقال علي بعاصمة الخلافة إلى الكوفة", en: "Ali moves the capital to Kufa", es: "Ali traslada la capital a Kufa.", fr: "Ali déplace la capitale à Kufa", ur: "علی نے دارالحکومت کوفہ منتقل کیا۔" }
summary:
  ar: "نقل علي عاصمة الخلافة من المدينة إلى الكوفة، لأن قريشاً لم تكن تنصره، وقد تفرقت أحزابها بين طلحة وعائشة ومعاوية، ولأن الكوفة كانت ملتقى الشعوب ومركزاً تجارياً وثقافياً {cite:abqariyyat-ali-aqqad p.75}. ويعدّ العقاد الكوفة أليق العواصم بإمامة عالمية في ذلك العصر، لأنها كانت ملتقى الأجناس، وكانت مدارس اللغة والقراءات والأنساب تزدهر فيها {cite:abqariyyat-ali-aqqad p.127}."
  en: "Ali moved the seat of government from Medina to Kufa, because Quraysh would not back him and its factions had scattered among Talha, Aisha and Muawiya; Kufa was a meeting point of peoples, a trade hub and a centre of learning {cite:abqariyyat-ali-aqqad p.75}. Al-Aqqad calls Kufa the fittest capital for a universal imamate of that age {cite:abqariyyat-ali-aqqad p.127}."
  es: "Ali trasladó la sede del gobierno de Medina a Kufa, porque los Quraysh no lo apoyaban y sus facciones se habían dispersado entre Talha, Aisha y Muawiya; Kufa era un punto de encuentro de pueblos, un centro comercial y un centro de aprendizaje {cite:abqariyyat-ali-aqqad p.75}. Al-Aqqad considera a Kufa la capital más adecuada para un imamato universal de aquella época {cite:abqariyyat-ali-aqqad p.127}."
  fr: "Ali transféra le siège du gouvernement de Médine à Koufa, car les Qurayshites refusaient de le soutenir et leurs factions s'étaient dispersées entre Talha, Aïcha et Mu'awiya. Koufa était un carrefour de peuples, un centre commercial et un foyer d'apprentissage (voir Abqariyyat-Ali-Aqqad, p. 75). Al-Aqqad qualifie Koufa de capitale la plus appropriée pour un imamat universel à cette époque (voir Abqariyyat-Ali-Aqqad, p. 127)."
  ur: "علی نے حکومت کی کرسی مدینہ سے کوفہ منتقل کر دی، کیونکہ قریش ان کی حمایت نہیں کریں گے اور اس کے دھڑے طلحہ، عائشہ اور معاویہ کے درمیان بکھر چکے تھے۔ کوفہ لوگوں کا میل جول، تجارتی مرکز اور علم کا مرکز تھا۔ العقد نے کوفہ کو اس زمانے کی عالمگیر امامت کے لیے موزوں ترین دارالخلافہ قرار دیا ہے"
