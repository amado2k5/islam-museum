label: { ar: "انتقال علي بعاصمة الخلافة إلى الكوفة", en: "Ali moves the capital to Kufa" }
summary:
  ar: "نقل علي عاصمة الخلافة من المدينة إلى الكوفة، لأن قريشاً لم تكن تنصره، وقد تفرقت أحزابها بين طلحة وعائشة ومعاوية، ولأن الكوفة كانت ملتقى الشعوب ومركزاً تجارياً وثقافياً {cite:abqariyyat-ali-aqqad p.75}. ويعدّ العقاد الكوفة أليق العواصم بإمامة عالمية في ذلك العصر، لأنها كانت ملتقى الأجناس، وكانت مدارس اللغة والقراءات والأنساب تزدهر فيها {cite:abqariyyat-ali-aqqad p.127}."
  en: "Ali moved the seat of government from Medina to Kufa, because Quraysh would not back him and its factions had scattered among Talha, Aisha and Muawiya; Kufa was a meeting point of peoples, a trade hub and a centre of learning {cite:abqariyyat-ali-aqqad p.75}. Al-Aqqad calls Kufa the fittest capital for a universal imamate of that age {cite:abqariyyat-ali-aqqad p.127}."
