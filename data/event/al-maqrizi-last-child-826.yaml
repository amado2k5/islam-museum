class: event
kind: other
label:
  ar: "وفاة آخر أولاد المقريزي، ٨٢٦هـ/١٤٢٣م"
  en: "Death of al-Maqrizi's last child, 826/1423"
  ur: "مقریزی کی آخری اولاد کی وفات، 826ھ/1423ء"
  es: "Muerte del último hijo de al-Maqrizi, 826/1423"
  fr: "Mort du dernier enfant d'al-Maqrizi, 826/1423"
  tr: "El-Makrizi'nin son oğlunun ölümü, Hicri 826/Miladi 1423."
  id: "Wafatnya putra terakhir al-Maqrizi, 826 H/1423 M"
summary:
  ar: "توفي آخر أولاد المقريزي سنة ٨٢٦هـ/١٤٢٣م كما في سلوكه، فلم يبقَ له ولد؛ ونجا بعده ابن أخيه ناصر الدين محمد بن محمد ⁦(٨٠١–٨٦٧هـ/١٣٩٩–١٤٦٢م)⁩ الذي ذكره السخاوي في الضوء اللامع {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}."
  en: "The last of al-Maqrizi's children died in 826/1423, as his own chronicle al-Suluk records; he was survived not by a child but by a nephew, Nasir al-Din Muhammad ibn Muhammad (801-67/1399-1462), noticed by al-Sakhawi in al-Daw' al-lami' {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}."
  ur: "مقریزی کی آخری اولاد 826ھ/1423ء میں فوت ہوئی، جیسا کہ ان کی اپنی تاریخ «السلوک» میں درج ہے؛ ان کی کوئی اولاد باقی نہ رہی، البتہ بھتیجے ناصر الدین محمد بن محمد ⁦(801-867ھ/1399-1462ء)⁩ زندہ رہے جن کا ذکر سخاوی نے «الضوء اللامع» میں کیا {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}۔"
  es: "El último de los hijos de al-Maqrizi murió en 826/1423, como registra su propia crónica al-Suluk; no le sobrevivió un hijo sino un sobrino, Nasir al-Din Muhammad ibn Muhammad (801-67/1399-1462), mencionado por al-Sakhawi en al-Daw' al-lami' {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}."
  fr: "Le dernier des enfants d'al-Maqrizi mourut en 826/1423, comme le rapporte sa propre chronique al-Suluk; il ne laissa pas d'enfant mais un neveu, Nasir al-Din Muhammad ibn Muhammad (801-67/1399-1462), mentionné par al-Sakhawi dans al-Daw' al-lami' {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}."
  tr: "El-Makrizi'nin son oğlu, kitabında da belirtildiği gibi, 826 Hicri/1423 Miladi yılında vefat etti, dolayısıyla hiç oğlu kalmadı. Ondan sonra, yeğeni Nasır el-Din Muhammed ibn Muhammed (801–867 Hicri/1399–1462 Miladi) hayatta kaldı; el-Sakhawi, el-Daw’ el-Lami’ adlı eserinde ondan bahsetmiştir {cite:encyclopaedia-of-islam-2 cilt 6 s. 213}."
  id: "Putra terakhir al-Maqrizi meninggal pada tahun 826 H/1423 M, sebagaimana disebutkan dalam bukunya, sehingga ia tidak memiliki putra lagi. Setelahnya, keponakannya, Nasir al-Din Muhammad ibn Muhammad (801–867 H/1399–1462 M), masih hidup, yang disebutkan oleh al-Sakhawi dalam al-Daw’ al-Lami’ {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}."
