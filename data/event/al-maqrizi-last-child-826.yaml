  en: "Death of al-Maqrizi's last child, 826/1423"
  ur: "مقریزی کی آخری اولاد کی وفات، 826ھ/1423ء"
summary:
  ar: "توفي آخر أولاد المقريزي سنة ٨٢٦هـ/١٤٢٣م كما في سلوكه، فلم يبقَ له ولد؛ ونجا بعده ابن أخيه ناصر الدين محمد بن محمد (٨٠١–٨٦٧هـ/١٣٩٩–١٤٦٢م) الذي ذكره السخاوي في الضوء اللامع {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}."
  en: "The last of al-Maqrizi's children died in 826/1423, as his own chronicle al-Suluk records; he was survived not by a child but by a nephew, Nasir al-Din Muhammad ibn Muhammad (801-67/1399-1462), noticed by al-Sakhawi in al-Daw' al-lami' {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}."
  ur: "مقریزی کی آخری اولاد 826ھ/1423ء میں فوت ہوئی، جیسا کہ ان کی اپنی تاریخ «السلوک» میں درج ہے؛ ان کی کوئی اولاد باقی نہ رہی، البتہ بھتیجے ناصر الدین محمد بن محمد (801-867ھ/1399-1462ء) زندہ رہے جن کا ذکر سخاوی نے «الضوء اللامع» میں کیا {cite:encyclopaedia-of-islam-2 vol. 6 p. 213}۔"
