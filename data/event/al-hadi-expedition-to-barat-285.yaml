id: event/al-hadi-expedition-to-barat-285
class: event
kind: other
label:
  ar: خروج الهادي إلى برط من بلاد شاكر ومعركتها وعفوه وعودته إلى صعدة، صفر 285هـ
  en: Al-Hadi's expedition to Barat in the land of Shakir, its fight, his clemency and return to Sa'da, Safar 285 AH
  ur: شاکر کے علاقے برط کی طرف ہادی کی مہم، اس کی لڑائی، معافی اور صعدہ واپسی، صفر 285ھ
summary:
  ar: بعد أن أبى أهل برط، وهم دهمة من شاكر من همدان، أن يدعوا عاملاً أرسله الهادي يصلي بهم الجمعة، خرج إليهم في الثاني والعشرين من صفر 285هـ، فصعد الجبل وسأل الماء فمنعوه ورموه بالنبل فأصابه سهم، فحمل عليهم ونصره الله، ثم أمّنهم وردّ إليهم السلب وأطلق الأسرى ومنع جيشه من الزرع والأعلاف، وأقام ثلاثة أيام وولى عليهم رجلاً من نجران ثم عاد إلى صعدة آخر صفر.
  en: After the people of Barat, the Dahma of Shakir of Hamdan, turned away a governor al-Hadi sent them and barred him from leading the Friday prayer, he marched on 22 Safar 285 AH, climbed the mountain, asked for water and was refused and shot at, an arrow hitting him; he charged, was given victory, then granted security, returned the spoils and freed the captives, kept his army from crops and fodder, stayed three days, appointed a Najran man over them and returned to Sa'da on the last day of Safar.
  ur: جب برط والوں، شاکر کے دہمہ، نے ہادی کے بھیجے عامل کو جمعہ پڑھانے سے روکا تو وہ 22 صفر 285ھ کو ان کی طرف نکلے، پہاڑ پر چڑھے، پانی مانگا تو انکار ہوا اور ان پر تیر چلے، ایک تیر انہیں لگا؛ انہوں نے حملہ کیا اور فتح پائی، پھر امان دی، مال لوٹایا، قیدی رہا کیے، لشکر کو کھیتوں اور چارے سے روکا، تین دن رہے، نجران کے ایک شخص کو عامل بنایا اور صفر کے آخری دن صعدہ لوٹے۔
