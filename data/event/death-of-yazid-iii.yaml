label: { ar: "وفاة يزيد الناقص", en: "Death of Yazid al-Naqis", es: "Muerte de Yazid al-Naqis", fr: "Mort de Yazid al-Naqis", ur: "یزید النقیس کی موت" }
summary:
  ar: "لم يمتع يزيد الناقص بالخلافة بل مات من عامه في سابع ذي الحجة سنة ست وعشرين ومئة فكانت خلافته ستة أشهر ناقصة وكان عمره خمساً وثلاثين سنة وقيل ستاً وأربعين، ويقال إنه مات بالطاعون، وقد لقب بالناقص لكونه نقص الجند من أعطياتهم {cite:tarikh-khulafa-minhaj-1434 p. 408-409}."
  en: "Yazid al-Naqis did not long enjoy the caliphate — he died the same year, on 7 Dhu'l-Hijja 126, his caliphate having lasted six months less a fraction, aged thirty-five or forty-six; some say he died of the plague. He was dubbed al-Naqis for cutting the troops' stipends {cite:tarikh-khulafa-minhaj-1434 p. 408-409}."
  es: "Yazid al-Naqis no disfrutó mucho tiempo del califato: murió ese mismo año, el 7 de Dhul-Hijjah de 126, tras haber reinado durante seis meses menos, a la edad de treinta y cinco o cuarenta y seis años; algunos dicen que murió de peste. Fue apodado al-Naqis por recortar los estipendios de las tropas {cite:tarikh-khulafa-minhaj-1434 p. 408-409}."
  fr: "Yazid al-Naqis ne jouit pas longtemps du califat: il mourut la même année, le 7 Dhu al-Hijja 126, son califat n’ayant duré que six mois environ. Il avait trente-cinq ou quarante-six ans; certains disent qu’il mourut de la peste. Il fut surnommé al-Naqis pour avoir réduit les soldes des troupes (voir: Tarikh Khulafa Minhaj, 1434, p. 408-409)."
  ur: "یزید النقیس نے زیادہ عرصہ خلافت کا مزہ نہیں لیا - وہ اسی سال 7 ذی الحجہ 126 کو انتقال کر گیا، اس کی خلافت چھ ماہ سے کم رہی، عمر پینتیس یا چھیالیس سال تھی۔ بعض کہتے ہیں کہ وہ طاعون سے مر گیا تھا۔ فوجیوں کے وظیفے میں کٹوتی کرنے پر اسے النقیس کہا جاتا تھا۔ 408-409}۔"
