summary:
  ar: "لم يمتع يزيد الناقص بالخلافة بل مات من عامه في سابع ذي الحجة سنة ست وعشرين ومئة فكانت خلافته ستة أشهر ناقصة وكان عمره خمساً وثلاثين سنة وقيل ستاً وأربعين، ويقال إنه مات بالطاعون، وقد لقب بالناقص لكونه نقص الجند من أعطياتهم {cite:tarikh-khulafa-minhaj-1434 p. 408-409}."
  en: "Yazid al-Naqis did not long enjoy the caliphate — he died the same year, on 7 Dhu'l-Hijja 126, his caliphate having lasted six months less a fraction, aged thirty-five or forty-six; some say he died of the plague. He was dubbed al-Naqis for cutting the troops' stipends {cite:tarikh-khulafa-minhaj-1434 p. 408-409}."
