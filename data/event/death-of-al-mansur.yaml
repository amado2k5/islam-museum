label: { ar: "وفاة المنصور", en: "Death of al-Mansur", es: "Muerte de al-Mansur", fr: "Mort d'al-Mansur" }
summary:
  ar: "في سنة ثمان وخمسين ومئة أمر المنصور نائب مكة بحبس سفيان الثوري وعباد بن كثير فحبسا وتخوف الناس أن يقتلهما إذا ورد الحج فلم يوصله الله مكة سالماً بل قدم مريضاً ومات بالبطن في ذي الحجة ودفن بين الحجون وبئر ميمون {cite:tarikh-khulafa-minhaj-1434 p. 426}."
  en: "In year 158 al-Mansur ordered his deputy at Mecca to imprison Sufyan al-Thawri and Abbad ibn Kathir, and fear spread that he would kill them on arrival for hajj; God did not bring him to Mecca in health — he arrived ill and died of his ailment in Dhu'l-Hijja and was buried between al-Hujun and Bi'r Maymun {cite:tarikh-khulafa-minhaj-1434 p. 426}."
  es: "En el año 158, al-Mansur ordenó a su lugarteniente en La Meca que encarcelara a Sufyan al-Thawri y a Abbad ibn Kathir, y se extendió el temor de que los matara a su llegada para el Hajj; Dios no lo trajo a La Meca con buena salud: llegó enfermo y murió de su dolencia en Dhu'l-Hijja y fue enterrado entre al-Hujun y Bi'r Maymun {cite:tarikh-khulafa-minhaj-1434 p. 426}."
  fr: "En l'an 158, al-Mansur ordonna à son adjoint à La Mecque d'emprisonner Sufyan al-Thawri et Abbad ibn Kathir, et la crainte se répandit qu'il les tue à leur arrivée pour le hajj; Dieu ne l'amena pas à La Mecque en bonne santé — il arriva malade et mourut de sa maladie en Dhu'l-Hijja et fut enterré entre al-Hujun et Bi'r Maymun {cite:tarikh-khulafa-minhaj-1434 p. 426}."
