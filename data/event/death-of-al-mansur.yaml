summary:
  ar: "في سنة ثمان وخمسين ومئة أمر المنصور نائب مكة بحبس سفيان الثوري وعباد بن كثير فحبسا وتخوف الناس أن يقتلهما إذا ورد الحج فلم يوصله الله مكة سالماً بل قدم مريضاً ومات بالبطن في ذي الحجة ودفن بين الحجون وبئر ميمون {cite:tarikh-khulafa-minhaj-1434 p. 426}."
  en: "In year 158 al-Mansur ordered his deputy at Mecca to imprison Sufyan al-Thawri and Abbad ibn Kathir, and fear spread that he would kill them on arrival for hajj; God did not bring him to Mecca in health — he arrived ill and died of his ailment in Dhu'l-Hijja and was buried between al-Hujun and Bi'r Maymun {cite:tarikh-khulafa-minhaj-1434 p. 426}."
