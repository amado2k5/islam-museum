label: { ar: "التعبئة قبل بدر: عير أبي سفيان ونفير مكة وخروج النبي", en: "The build-up to Badr: Abu Sufyan's caravan, Mecca's muster and the Prophet's march" }
summary:
  ar: "خرج النبي في السنة الثانية للهجرة طلباً لعير أبي سفيان العائدة من الشام، فاستنفرت قريش نفيرها ليحموا عيرهم، ومضى الجيشان نحو بدر؛ وانسحب أبو سفيان بالعير إلى الساحل، فرجع بنو زهرة بقيادة الأخنس بن شريق، وسار جيش مكة نحو بدر، فاستكشف النبي أمرهم بالغلامين وبالشيخ."
  en: "In Ramadan of the second year of the Hijra the Prophet set out to intercept Abu Sufyan's caravan returning from Syria; Quraysh mustered to defend it, and the two armies moved towards Badr; Abu Sufyan turned the caravan to the coast, Banu Zuhra withdrew under al-Akhnas ibn Shariq, and the Meccan army pressed on to Badr, where the Prophet learned their numbers from two water-carriers."
