label: { ar: "التعبئة قبل بدر: عير أبي سفيان ونفير مكة وخروج النبي", en: "The build-up to Badr: Abu Sufyan's caravan, Mecca's muster and the Prophet's march", fr: "Les préliminaires de Badr : la caravane d'Abu Sufyan, la levée de La Mecque et la marche du Prophète", es: "Los preparativos para Badr: la caravana de Abu Sufyan, la movilización de La Meca y la marcha del Profeta.", ur: "بدر کی تعمیر: ابو سفیان کا قافلہ، مکہ کا دستہ اور پیغمبر کا مارچ" }
summary:
  ar: "خرج النبي في السنة الثانية للهجرة طلباً لعير أبي سفيان العائدة من الشام، فاستنفرت قريش نفيرها ليحموا عيرهم، ومضى الجيشان نحو بدر؛ وانسحب أبو سفيان بالعير إلى الساحل، فرجع بنو زهرة بقيادة الأخنس بن شريق، وسار جيش مكة نحو بدر، فاستكشف النبي أمرهم بالغلامين وبالشيخ."
  en: "In Ramadan of the second year of the Hijra the Prophet set out to intercept Abu Sufyan's caravan returning from Syria; Quraysh mustered to defend it, and the two armies moved towards Badr; Abu Sufyan turned the caravan to the coast, Banu Zuhra withdrew under al-Akhnas ibn Shariq, and the Meccan army pressed on to Badr, where the Prophet learned their numbers from two water-carriers."
  fr: "En Ramadan de la deuxième année de l'hégire, le Prophète partit intercepter la caravane d'Abu Sufyan qui revenait de Syrie ; Quraysh se leva pour la défendre, et les deux armées avancèrent vers Badr ; Abu Sufyan détourna la caravane vers la côte, les Banu Zuhra se retirèrent sous al-Akhnas ibn Shariq, et l'armée mecquoise poursuivit jusqu'à Badr, où le Prophète apprit ses effectifs par deux porteurs d'eau."
  es: "En el Ramadán del segundo año de la Hégira, el Profeta partió para interceptar la caravana de Abu Sufyan que regresaba de Siria; los Quraysh se reunieron para defenderla, y los dos ejércitos avanzaron hacia Badr; Abu Sufyan desvió la caravana hacia la costa, los Banu Zuhra se retiraron bajo el mando de al-Akhnas ibn Shariq, y el ejército de La Meca siguió avanzando hacia Badr, donde el Profeta supo su número gracias a dos aguadores."
  ur: "ہجرت کے دوسرے سال کے رمضان میں رسول اللہ شام سے واپس آنے والے ابو سفیان کے قافلے کو روکنے کے لیے روانہ ہوئے۔ قریش اس کے دفاع کے لیے جمع ہوئے اور دونوں لشکر بدر کی طرف بڑھے۔ ابو سفیان نے قافلہ کو ساحل کی طرف موڑ دیا، بنو زہرہ نے اخناس بن شریک کے ماتحت دستبرداری اختیار کی اور مکہ کی فوج بدر کی طرف بڑھ گئی، جہاں نبی نے ان کی تعداد دو آبی جہازوں سے سیکھی۔"
