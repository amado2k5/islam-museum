summary:
  ar: "بطاقة أولية للحرب العثمانية البندقية من ١٥٣٧ إلى ١٥٤٠م، حرب سليمان على البندقية التي انتهت بتنازل البنادقة عن نفبليو ومونفاسيا؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Third Ottoman–Venetian War of 1537–1540, Suleiman's war that ended with Venice ceding Nauplia and Monemvasia; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Tercera Guerra Otomano-Veneciana de 1537-1540, la guerra de Solimán que terminó con la cesión de Nauplia y Monemvasia por parte de Venecia; sus fuentes aún no han sido verificadas en la página."
  fr: "Fiche de projet pour la troisième guerre ottomane-vénitienne de 1537-1540, la guerre de Soliman qui s'est terminée par la cession de Nauplie et de Monemvasia par Venise; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1537-1540 کی تیسری عثمانی-وینیشین جنگ کے لیے ڈرافٹ کارڈ، سلیمان کی جنگ جس کا اختتام وینس کے نوپلیا اور مونیمواسیا کے ساتھ ہوا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1537-1540 yılları arasında gerçekleşen Osmanlı-Venedik Savaşı'na dair ön bir anlatım; Süleyman'ın Venedik'e karşı yürüttüğü ve Venediklilerin Nefpollio ve Monvasia'yı teslim etmesiyle sonuçlanan savaş. Sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Perang Ottoman-Venesia tahun 1537-1540 M, perang Suleiman melawan Venesia yang berakhir dengan penyerahan Nefpollio dan Monvasia oleh Venesia; sumber-sumber di halaman ini belum ditinjau."
