id: event/hisham-taghlibi-sind
class: event
kind: campaign
label: { ar: "ولاية هشام بن عمرو التغلبي السند", en: "Hisham ibn Amr al-Taghlibi's Sind", es: "Sind de Hisham ibn Amr al-Taghlibi", fr: "Le Sind de Hisham ibn Amr al-Taghlibi", ur: "ہشام بن عمرو الطغلبی کی سندھ", tr: "Hişam ibn Amr el-Tağlibinin Sindh valiliği", id: "Masa pemerintahan Hisham ibn Amr al-Taghlibi di Sindh." }
summary:
  ar: "ولى أمير المؤمنين المنصور هشام بن عمرو التغلبي السند ففتح ما استغلق ووجه عمرو بن جمل في بوارج إلى نارند ووجه إلى ناحية الهند فافتتح قشيراً وأصاب سبايا ورقيقاً كثيراً وفتح الملتان وكان بقندابيل متغلبة من العرب فأجلاهم عنها وأتى القندهار في السفن ففتحها وهدم البد وبنى موضعه مسجداً فأخصبت البلاد في ولايته فتبروكوا به ودوخ الثغر وأحكم أموده ثم ولي ثغر السند عمر بن حفص بن عثمان هزار مرد ثم داود بن يزيد بن حاتم وكان معه أبو الصمة المتغلب اليوم وهو مولى لكندة."
  en: "Al-Mansur gave Sind to Hisham ibn Amr al-Taghlibi: he opened what resisted, sent Amr ibn Jamal's bawarij to Narand, took Qashayr with its crowds of captives, reopened Multan, expelled the Arab mutaghalliba from Qandabil, and came on Qandahar by ship — razed the budd and built a mosque on its site. The land flowered under him; then the thaghr passed to Umar ibn Hafs Hazarmard, then Dawud ibn Yazid ibn Hatim, whose mawla of Kinda Abu al-Summa is today's mutaghallib."
  es: "Al-Mansur entregó Sind a Hisham ibn Amr al-Taghlibi: abrió lo que se resistía, envió a los bawarij de Amr ibn Jamal a Narand, tomó Qashayr con sus multitudes de cautivos, reabrió Multan, expulsó a los mutaghallib árabes de Qandabil y llegó a Qandahar en barco; arrasó el budd y construyó una mezquita en su lugar. La tierra floreció bajo su mandato; luego el thaghr pasó a Umar ibn Hafs Hazarmard, luego a Dawud ibn Yazid ibn Hatim, cuyo mawla de Kinda Abu al-Summa es el mutaghallib de hoy."
  fr: "Al-Mansur confia le Sind à Hisham ibn Amr al-Taghlibi: celui-ci libéra les forces qui résistaient, envoya les bawarij d’Amr ibn Jamal à Narand, prit Qashayr et ses nombreux captifs, rouvrit Multan, expulsa les mutaghallibas arabes de Qandabil et arriva à Qandahar par bateau; il rasa le bouddh et y construisit une mosquée. La région prospéra sous son règne; puis le thaghr passa à Umar ibn Hafs Hazarmard, puis à Dawud ibn Yazid ibn Hatim, dont le mawla de Kinda Abu al-Summa est aujourd’hui le mutaghalli."
  ur: "المنصور نے سندھ کو ہشام بن عمرو الطغلبی کو دے دیا: اس نے مزاحمت کا راستہ کھول دیا، عمرو بن جمال کے باواریج کو نارند بھیجا، قشیر کو اس کے قیدیوں کے ہجوم کے ساتھ لے گیا، ملتان کو دوبارہ کھولا، عرب متغلیبہ کو قندبیل سے نکال باہر کیا، اور قندھار پر آیا - اس کی جگہ پر ایک بحری جہاز اور مسجد تعمیر کی گئی۔ زمین اس کے نیچے پھول گئی؛ پھر ثغر عمر بن حفص حضرمرد تک پہنچا، پھر داؤد بن یزید بن حاتم، جن کا مولا کندہ ابو الصمہ آج کا متغلب ہے۔"
  tr: "Müminlerin Komutanı El-Mansur, Hişam bin Amr el-Tağlibibi'yi Sind'e atadı. Böylece kapalı olan bölgeleri fethetti ve Amr bin Cemal'i gemilerle Narand'a gönderdi, oradan da Hindistan bölgesine sevk etti. Böylece Kuşair'i fethetti, birçok esir ve köle aldı ve Multan'ı ele geçirdi. Kandabil'de orayı fethetmiş Araplar vardı, onları oradan kovdu ve gemilerle Kandahar'a geldi, şehri yıktı ve yerine bir cami inşa etti. Böylece onun yönetimi altında topraklar verimli hale geldi, ondan bereket gördüler ve sınır bölgelerini kontrol altına alıp savunmasını güçlendirdi. Daha sonra Amr bin Hafs bin Osman Hazar Mard Sind sınırına atandı, ardından Davud bin Yazid bin Hatim ve onunla birlikte bugün fatih olan ve Kinda'nın himayesinde bulunan Ebu el-Sümme geldi."
  id: "Panglima Kaum Beriman, Al-Mansur, menunjuk Hisham bin Amr Al-Taghlibi ke Sindh, lalu ia menaklukkan wilayah yang tertutup dan mengirim Amr bin Jamal dengan kapal ke Narand dan mengirimnya ke wilayah India, lalu ia menaklukkan Qushair dan menangkap banyak tawanan dan budak serta menaklukkan Multan. Terdapat pula bangsa Arab di Qandabil yang telah menaklukkannya, lalu ia mengusir mereka dan datang ke Kandahar dengan kapal, menaklukkannya, menghancurkan kota tersebut, dan membangun sebuah masjid di tempatnya. Akibatnya, tanah menjadi subur di bawah pemerintahannya, sehingga mereka diberkati. Ia juga menaklukkan perbatasan dan memperkuat pertahanannya. Kemudian Amr bin Hafs bin Uthman Hazar Mard ditunjuk untuk menguasai perbatasan Sindh, lalu Dawud bin Yazid bin Hatim, dan bersamanya ada Abu Al-Summa, yang merupakan penakluk saat ini, dan ia adalah pengikut Kinda."
