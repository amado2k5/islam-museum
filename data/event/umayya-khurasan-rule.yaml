label: { ar: "ولاية أمية بن عبد الله خراسان وقتل بكير", en: "Umayya's Khurasan and Bukayr's Killing", es: "El asesinato de Jorasán y Bujari por parte de los Omeyas", fr: "Le Khorasan d'Umayya et le massacre de Bukayr", ur: "امیہ کا خراسان اور بکیر کا قتل", tr: "Horasan Valisi Emevi ibn Abdullah'ın yönetimi ve Bakir'in öldürülmesi", id: "Masa pemerintahan Umayyah bin Abdullah di Khorasan dan pembunuhan Bakir." }
summary:
  ar: "صارت طائفة مع بكير بن وشاح وطائفة مع بجير فكتب وجوه أهل خراسان وخيارهم إلى عبد الملك يعلمونه أنه لا تصلح خراسان بعد الفتنة إلا برجل من قريش فولى أمية بن عبد الله بن خالد بن أسيد بن أبي العيص خراسان فولى بكير بن وشاح طخارستان ثم ولاه غزو ما وراء النهر ثم عزم أمية على غزو بخارا ثم إتيان موسى بن عبد الله بن خازم بالترمذ فانصرف بكير إلى مرو وأخذ ابن أمية فحبسه ودعا الناس إلى خلع أمية فأجابوه وبلغ ذلك أمية فصالح أهل بخارا على فدية قليلة واتخذ السفن وقد كان بكير أحرقها ورجع وترك موسى بن عبد الله فقدم فقاتله بكير ثم صالحه على أن يوليه أي ناحية شاء ثم بلغ أمية أنه يسعى في خلعه فأمر إذا دخل داره أن يؤخذ فدخلها فأخذ وأمر بحبسه فوثب به بجير بن ورقاء فقتله وغزا أمية الختل وقد نقضوا بعد أن صالحهم سعيد بن عثمان فافتتحها."
  en: "Khurasan split between Bukayr's party and Bujayr's until its notables wrote Abd al-Malik that only a Qurashi could mend it — Umayya ibn Abdallah ibn Khalid was sent, gave Bukayr Tukharistan then the trans-river campaigns, and planned Bukhara then Musa at Tirmidh. Bukayr raced to Marw, seized Umayya's son, called the people to depose him; forewarned, Umayya truced Bukhara cheaply, took ships Bukayr had burned, returned and fought him, then truced him any district he chose — but hearing he still plotted, had him seized at his house and imprisoned, where Bujayr ibn Waraqa leapt on him and killed him. Umayya campaigned al-Khattl, broken since Sa'id ibn Uthman's sulh, and took it."
  es: "Jorasán se dividió entre el partido de Bukayr y el de Bujayr hasta que sus notables escribieron a Abd al-Malik que solo un Qurashi podría recomponerlo. Umayya ibn Abdallah ibn Khalid fue enviado, le dio a Bukayr Tukharistán y luego las campañas transfluviales, y planeó Bujará y luego Musa en Tirmidh. Bukayr corrió a Marw, apresó al hijo de Umayya y llamó al pueblo para deponerlo; advertido, Umayya pactó una tregua en Bujará a bajo precio, tomó los barcos que Bukayr había incendiado, regresó y luchó contra él, luego le pactó cualquier distrito que eligiera; pero al enterarse de que seguía conspirando, lo hizo apresar en su casa y encarcelar, donde Bujayr ibn Waraqa saltó sobre él y lo mató. Umayya hizo campaña en al-Khattl, quebrada desde el sulh de Sa'id ibn Uthman, y la tomó."
  fr: "Le Khorasan se divisa entre le parti de Bukayr et celui de Bujayr, jusqu'à ce que ses notables écrivent à Abd al-Malik que seul un Qurashi pouvait rétablir l'ordre. Umayya ibn Abdallah ibn Khalid fut envoyé, confia à Bukayr le Tukharistan, puis les campagnes transfluviales, et planifia la prise de Boukhara, puis de Musa à Tirmidh. Bukayr se précipita à Marw, captura le fils d'Umayya et appela le peuple à le destituer. Averti, Umayya conclut une trêve à Boukhara à un prix dérisoire, s'empara des navires incendiés par Bukayr, revint et le combattit, puis lui accorda une trêve dans le district de son choix. Mais apprenant qu'il complotait encore, il le fit arrêter à son domicile et emprisonner, où Bujayr ibn Waraqa se jeta sur lui et le tua. Umayya mena ensuite campagne contre al-Khattl, ville dévastée depuis le sulh de Sa'id ibn Uthman, et s'en empara."
  ur: "خراسان بکیر کی جماعت اور بوجیر کے درمیان تقسیم ہو گیا یہاں تک کہ اس کے معززین نے عبد الملک کو لکھا کہ صرف ایک قریشی اسے ٹھیک کر سکتا ہے - امیہ بن عبداللہ ابن خالد کو بھیجا گیا، بخارا کو ترکستان دیا پھر دریائے عبور کی مہمات، اور بخارا کا منصوبہ بنایا پھر موسیٰ کو ترمذ میں۔ بکر مرو کی طرف بھاگا، امیہ کے بیٹے کو پکڑ لیا، لوگوں کو بلایا کہ اسے معزول کر دیں۔ پیشگی اطلاع دی گئی، امیہ نے بخارا پر سستی کی، بقیر نے بحری جہاز جلائے، واپس لوٹے اور اس سے لڑے، پھر اس سے کسی بھی ضلع کا انتخاب کیا، لیکن یہ سن کر کہ اس نے پھر بھی سازش کی، اسے اس کے گھر پر قبضہ کر کے قید کر دیا، جہاں بوجیر بن ورقہ نے اس پر چھلانگ لگا کر اسے قتل کر دیا۔ امیہ نے الخطل کی مہم چلائی، جو سعید بن عثمان کی سلح کے بعد سے ٹوٹ گیا، اور اسے لے لیا۔"
  tr: "Bir grup Bukayr ibn Washah'ın, diğer bir grup ise Bujayr'ın tarafını tuttu. Horasan halkının ileri gelenleri ve en iyileri Abdülmalik'e yazdıkları mektupta, Horasan'ın bu çekişmeden sonra Kureyş'ten bir adam dışında ıslah edilemeyeceğini bildirdiler. Bunun üzerine Abdülmalik, Umeyye ibn Abd Allah ibn Halid ibn Asid ibn Abi al-Ais'i Horasan valisi, Bukayr ibn Washah'ı ise Tokharistan valisi olarak atadı. Ardından Bukayr'ı Transoksanya'yı fethetmekle görevlendirdi. Bunun üzerine Umeyye, Buhara'yı fethetmeye ve Musa ibn Abd Allah ibn Khazim'i Tirmizi'ye getirmeye karar verdi. Bukayr, Merv'e giderek İbn Umeyye'yi yakaladı ve hapse attı. Halkı Umeyye'yi devirmeye çağırdı ve halk da ona karşılık verdi. Bu durum Umeyye'ye ulaştı, bu yüzden Buhara halkıyla küçük bir fidye karşılığında barıştı ve Bukayr'ın yaktığı gemileri aldı. Geri döndü ve Musa ibn Abd Allah'ı orada bıraktı. Geldi ve Bukayr onunla savaştı, sonra da onu istediği herhangi bir bölgeye ataması şartıyla onunla barıştı. Bunun üzerine Emeviler, Bukayr'ın kendisini tahttan indirmeye çalıştığını öğrendiler ve evine girerse yakalanmasını emrettiler. Böylece Bukayr evine girdi ve yakalandı, ardından da hapse atılmasını emretti. Bukayr ibn Varak üzerine atlayıp onu öldürdü. Emeviler, Said ibn Osman'ın onlarla barışmasından sonra anlaşmalarını bozmuşlardı, bu yüzden Said ibn Osman orayı da fethetti."
  id: "Satu kelompok berpihak pada Bukayr ibn Washah dan kelompok lain pada Bujayr. Para tokoh dan orang-orang terbaik dari Khurasan menulis surat kepada Abd al-Malik yang memberitahukan bahwa Khurasan tidak akan direformasi setelah perselisihan kecuali oleh seorang pria dari Quraysh. Maka ia menunjuk Umayya ibn Abd Allah ibn Khalid ibn Asid ibn Abi al-Ais sebagai gubernur Khurasan, dan menunjuk Bukayr ibn Washah sebagai gubernur Tokharistan. Kemudian ia menugaskan Bukayr untuk menaklukkan Transoxiana. Kemudian Umayya memutuskan untuk menaklukkan Bukhara dan kemudian membawa Musa ibn Abd Allah ibn Khazim ke Tirmidz. Bukayr pergi ke Merv dan menangkap Ibn Umayya dan memenjarakannya. Ia menyeru rakyat untuk menggulingkan Umayya, dan mereka menanggapi seruannya. Hal ini sampai ke telinga Umayya, sehingga ia berdamai dengan penduduk Bukhara dengan tebusan kecil dan mengambil kapal-kapal yang telah dibakar Bukayr. Ia kembali dan meninggalkan Musa ibn Abd Allah. Dia datang, dan Bukayr melawannya, lalu berdamai dengannya dengan syarat dia akan menunjuknya ke wilayah mana pun yang diinginkannya. Kemudian kabar itu sampai ke Umayyah bahwa dia sedang berusaha menggulingkannya, jadi dia memerintahkan agar jika dia memasuki rumahnya, dia harus ditangkap. Maka dia memasuki rumahnya dan ditangkap, dan Umayyah memerintahkan agar dia dipenjara. Bukayr bin Warqa' menerkamnya dan membunuhnya. Umayyah menaklukkan al-Khatl, dan mereka telah melanggar perjanjian mereka setelah Saeed bin Uthman berdamai dengan mereka, jadi Umayyah menaklukkannya."
