label: { en: "The Pledges of Aqaba", ar: "بيعتا العقبة", es: "Los Juramentos de Aqaba", fr: "Les serments d'Aqaba", ur: "عقبہ کے عہد", tr: "Akaba Satışları", id: "Penjualan Aqaba" }
summary:
  en: "The First and Second Pledges of Aqaba at Mina in the 12th and 13th years of prophethood (621 and 622 CE), in which delegates from Yathrib pledged allegiance to the Prophet, preparing Medina as the haven of the Hijra."
  ar: "بيعتا العقبة الأولى ⁦(بيعة النساء: 12 رجلاً في سنة 12 نبوية)⁩ والثانية ⁦(بيعة الحرب: 73 رجلاً وامرأتان في سنة 13 نبوية)⁩ عند العقبة بمنى، اللتان مهدتا لهجرة المسلمين وتأسيس دار الإسلام بالمدينة."
  es: "Los dos primeros juramentos de Aqaba en Mina, en los años 12 y 13 de la profecía (621 y 622 d. C.), en los que delegados de Yathrib juraron lealtad al Profeta, preparando Medina como refugio de la Hégira."
  fr: "Les premier et deuxième serments d'Aqaba à Mina dans les 12e et 13e années de la prophétie (621 et 622 CE), au cours desquels des délégués de Yathrib ont prêté allégeance au Prophète, préparant Médine comme le havre de l'Hégire."
  ur: "نبوت کے 12ویں اور 13ویں سال ⁦(621 اور 622 عیسوی)⁩ میں منیٰ میں عقبہ کا پہلا اور دوسرا عہد، جس میں یثرب کے مندوبین نے نبی سے بیعت کی، مدینہ کو ہجرت کی پناہ گاہ کے طور پر تیار کیا۔"
  tr: "Akabe'de verilen iki biat yemini: Birincisi kadınların biatı (Peygamberin 12. yılında 12 erkek) ve ikincisi savaş biatı (Peygamberin 13. yılında 73 erkek ve iki kadın), Müslümanların hicretine ve Medine'de İslam Evi'nin kurulmasına zemin hazırladı."
  id: "Dua baiat di Aqaba: baiat pertama yang dilakukan oleh kaum wanita (12 pria pada tahun ke-12 Nabi) dan baiat kedua yang dilakukan oleh kaum pria dan dua wanita pada tahun ke-13 Nabi) di Aqaba, Mina, yang membuka jalan bagi hijrah kaum Muslimin dan berdirinya Baitullah di Madinah."
