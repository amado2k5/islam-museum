  id: "Catatan pendahuluan tentang Pertempuran Buller pada tahun 1913 M, bagaimana Ottoman memukul mundur pendaratan Bulgaria di Gallipoli dalam Perang Balkan; sumber-sumber yang tercantum di halaman ini belum ditinjau."
