id: event/al-suyuti-ijtihad-claim-888
class: event
kind: declaration
label:
  ar: "إعلان السيوطي بلوغه مرتبة الاجتهاد، نحو ٨٨٨هـ/١٤٨٣م"
  en: "Al-Suyuti declares himself a mujtahid, c. 888/1483"
  ur: "سیوطی کا اجتہاد کے رتبے کا اعلان، تقریباً 888ھ/1483ء"
summary:
  ar: "نحو سنة ٨٨٨هـ/١٤٨٣م أعلن السيوطي بلوغه مرتبة المجتهد المطلق المنتسب، أي أنه يجتهد على طريقة أحد الأئمة الأربعة وهو الشافعي، وأكد أن اجتهاده لا ينحصر في الشريعة بل يمتد إلى الحديث واللغة؛ فأثار إعلانه فتنة حقيقية بين معاصريه، وفي مقدمتهم محمد السخاوي الذي نابذه العداء {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  en: "Probably in 888/1483 al-Suyuti declared that he had reached the rank of mujtahid mutlaq muntasib, exercising ijtihad within the method of the Shafiʿi imam, and affirmed that his ijtihad extended beyond the revealed law to hadith and the Arabic language. The claim aroused a real fitna among his contemporaries, chief among them the traditionist Muhammad al-Sakhawi {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  ur: "غالباً 888ھ/1483ء میں سیوطی نے اعلان کیا کہ وہ مجتہد مطلق منتسب کے رتبے تک پہنچ گئے ہیں، یعنی وہ شافعی امام کے طریقے پر اجتہاد کرتے ہیں، اور اس کی تصدیق کی کہ ان کا اجتہاد شریعت سے آگے حدیث اور عربی زبان تک پھیلا ہے۔ اس اعلان نے معاصروں میں — خاص طور پر محدث محمد سخاوی میں — حقیقی فتنہ برپا کر دیا {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}۔"
