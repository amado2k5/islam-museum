id: event/the-prophets-dreams-of-umar
class: event
kind: other
label:
  ar: "رؤيا النبي في قصر عمر بالجنة ورؤيا اللبن والتأويل بالعلم"
  en: "The Prophet's dreams of Umar: the palace in Paradise and the milk"
  ur: "جنت میں عمر کے محل کا خواب اور دودھ کا خواب جس کی تعبیر علم ہوئی"
summary:
  ar: "رأى النبي في المنام أن امرأة تتوضأ إلى جانب قصر في الجنة فقيل له إنه لعمر، فذكر غيرته فولى مدبراً، فبكى عمر وقال أعليك أغار يا رسول الله؛ ورأى شرب اللبن حتى سال من أظفاره ثم ناوله عمر، فسئل عن تأويلها فقال العلم {cite:sahih-al-bukhari} [[passage/bukhari-3680|البخاري 3680]] [[passage/bukhari-3681|البخاري 3681]]."
  en: "The Prophet saw in a dream a woman performing wudu beside a palace in Paradise and was told it was Umar's; remembering Umar's jealousy he turned away, and Umar wept saying 'do you envy me, O Messenger of God?'; he also saw himself drink milk until it flowed from his fingernails then hand it to Umar, and when asked its meaning he said: knowledge {cite:sahih-al-bukhari} [[passage/bukhari-3680|Bukhari 3680]] [[passage/bukhari-3681|Bukhari 3681]]."
  ur: "نبی نے خواب دیکھا کہ جنت میں ایک عورت ایک محل کے پاس وضو کر رہی ہے تو بتایا گیا کہ وہ عمر کے لیے ہے؛ عمر کی غیرت یاد کر کے وہ مدبر ہو گئے، تو عمر رو پڑے اور کہنے لگے کیا تم مجھ پر غوری کرتے ہو اے رسول اللہ؟ اور انہوں نے خود دودھ پیا یہاں تک کہ اس کی ریزے اس کی انگلیوں کے پیروں سے بہہنے لگیں پھر عمر کو دیا، اور پوچھے جانے پر اس کی تعبیر بتائی: علم {cite:sahih-al-bukhari} [[passage/bukhari-3680|بخاری 3680]] [[passage/bukhari-3681|بخاری 3681]]۔"
