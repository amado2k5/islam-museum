id: event/the-prophets-dreams-of-umar
class: event
kind: other
label:
  ar: "رؤيا النبي في قصر عمر بالجنة ورؤيا اللبن والتأويل بالعلم"
  en: "The Prophet's dreams of Umar: the palace in Paradise and the milk"
  ur: "جنت میں عمر کے محل کا خواب اور دودھ کا خواب جس کی تعبیر علم ہوئی"
  es: "Los sueños del Profeta sobre Umar: el palacio en el Paraíso y la leche."
  fr: "Les rêves du Prophète concernant Umar: le palais du Paradis et le lait"
  tr: "Peygamberin, Ömer'in cennetteki sarayına dair gördüğü görüm, süt görümü ve bunun bilgi yoluyla yorumlanması."
  id: "Penglihatan Nabi tentang istana Umar di Surga, penglihatan tentang susu, dan penafsirannya melalui ilmu pengetahuan."
summary:
  ar: "رأى النبي في المنام أن امرأة تتوضأ إلى جانب قصر في الجنة فقيل له إنه لعمر، فذكر غيرته فولى مدبراً، فبكى عمر وقال أعليك أغار يا رسول الله؛ ورأى شرب اللبن حتى سال من أظفاره ثم ناوله عمر، فسئل عن تأويلها فقال العلم {cite:sahih-al-bukhari} [[passage/bukhari-3680|البخاري 3680]] [[passage/bukhari-3681|البخاري 3681]]."
  en: "The Prophet saw in a dream a woman performing wudu beside a palace in Paradise and was told it was Umar's; remembering Umar's jealousy he turned away, and Umar wept saying 'do you envy me, O Messenger of God?'; he also saw himself drink milk until it flowed from his fingernails then hand it to Umar, and when asked its meaning he said: knowledge {cite:sahih-al-bukhari} [[passage/bukhari-3680|Bukhari 3680]] [[passage/bukhari-3681|Bukhari 3681]]."
  ur: "نبی نے خواب دیکھا کہ جنت میں ایک عورت ایک محل کے پاس وضو کر رہی ہے تو بتایا گیا کہ وہ عمر کے لیے ہے؛ عمر کی غیرت یاد کر کے وہ مدبر ہو گئے، تو عمر رو پڑے اور کہنے لگے کیا تم مجھ پر غوری کرتے ہو اے رسول اللہ؟ اور انہوں نے خود دودھ پیا یہاں تک کہ اس کی ریزے اس کی انگلیوں کے پیروں سے بہہنے لگیں پھر عمر کو دیا، اور پوچھے جانے پر اس کی تعبیر بتائی: علم {cite:sahih-al-bukhari} [[passage/bukhari-3680|بخاری 3680]] [[passage/bukhari-3681|بخاری 3681]]۔"
  es: "El Profeta vio en un sueño a una mujer realizando la ablución junto a un palacio en el Paraíso y se le dijo que era de Umar; recordando los celos de Umar, se apartó, y Umar lloró diciendo '¿me envidias, oh Mensajero de Dios?'; también se vio a sí mismo bebiendo leche hasta que fluyó por sus uñas y luego dársela a Umar, y cuando se le preguntó su significado dijo: conocimiento {cite:sahih-al-bukhari} [[passage/bukhari-3680|Bukhari 3680]] [[passage/bukhari-3681|Bukhari 3681]]."
  fr: "Le Prophète vit en rêve une femme faisant ses ablutions près d'un palais du Paradis et on lui dit qu'il s'agissait de celles d'Umar; se souvenant de la jalousie d'Umar, il se détourna, et Umar pleura en disant: « M'envies-tu, ô Messager de Dieu ? »; il se vit aussi boire du lait jusqu'à ce qu'il coule de ses ongles, puis le tendre à Umar, et lorsqu'on lui demanda sa signification, il répondit: la connaissance {cite:sahih-al-bukhari} [[passage/bukhari-3680|Bukhari 3680]] [[passage/bukhari-3681|Bukhari 3681]]."
  tr: "Peygamberimiz rüyasında cennetteki bir sarayın yanında abdest alan bir kadın gördü ve ona bu sarayın Ömer'e ait olduğu söylendi. Kıskançlığını hatırladı ve yüzünü çevirdi. Ömer ağlayarak, \"Ey Allah'ın Resulü, kıskandığım kişi sen misin?\" dedi. Rüyasında tırnaklarından süt akana kadar süt içtiğini gördü, sonra da Ömer'e verdi. Sütün yorumu sorulduğunda, \"İlimdir\" dedi."
  id: "Nabi melihat dalam mimpi bahwa seorang wanita sedang berwudhu di samping sebuah istana di Surga, dan dikatakan kepadanya bahwa istana itu milik Umar. Beliau teringat akan rasa irinya dan berpaling. Umar menangis dan berkata, “Apakah engkau yang aku iri, wahai Rasulullah?” Beliau melihat dirinya meminum susu hingga menetes dari kuku jarinya, lalu memberikannya kepada Umar. Beliau ditanya tentang tafsirnya, dan beliau menjawab, “Ilmu.”"
