summary:
  ar: "أخبر عبد الله بن سعد والي مصر عثمان بأن المسلمين يغيرون على أطراف إفريقية، فاستشار عثمان الصحابة واحداً واحداً، ومنهم علي وطلحة والزبير والعباس، ثم استشار سعيد بن زيد فكره الغزو مستدلاً بقول عمر، فلم يختلف عليه أحد غيره، ثم ندب الناس فخرج الجيش (ص161). ويذكر الكتاب أن بعض الصحابة، ومنهم عبد الله بن الزبير وأبو ذر، خرجوا في هذا الغزو (ص161-162)."
