label: { ar: "استشارة عثمان الصحابة في غزو إفريقية", en: "Uthman consults the Companions on the campaign to Ifriqiya", es: "Uthman consulta a los Compañeros sobre la campaña a Ifriqiya.", fr: "Uthman consulte les Compagnons au sujet de la campagne d'Ifriqiya", ur: "عثمان عفریقیہ کی مہم پر صحابہ سے مشورہ کرتے ہیں۔", tr: "Osman, Afrika'nın fethi konusunda Sahabelerle istişarede bulundu.", id: "Utsman berkonsultasi dengan para Sahabat mengenai penaklukan Afrika." }
summary:
  ar: "أخبر عبد الله بن سعد والي مصر عثمان بأن المسلمين يغيرون على أطراف إفريقية، فاستشار عثمان الصحابة واحداً واحداً، ومنهم علي وطلحة والزبير والعباس، ثم استشار سعيد بن زيد فكره الغزو مستدلاً بقول عمر، فلم يختلف عليه أحد غيره، ثم ندب الناس فخرج الجيش ⁦(ص161)⁩. ويذكر الكتاب أن بعض الصحابة، ومنهم عبد الله بن الزبير وأبو ذر، خرجوا في هذا الغزو ⁦(ص161-162)⁩."
  tr: "Mısır valisi Abdullah ibn Saad, Osman'a Müslümanların Afrika sınırlarına baskın düzenlediğini bildirdi. Osman, Ali, Talha, Zubeyr ve Abbas da dahil olmak üzere Sahabelerle tek tek görüştü. Daha sonra Said ibn Zeyd'e danıştı; o da Ömer'in sözlerine atıfta bulunarak baskını onaylamadı. Başka kimse onunla aynı fikirde değildi. Osman daha sonra halkı silahlanmaya çağırdı ve ordu yola çıktı (s. 161). Kitap ayrıca, Abdullah ibn Zubeyr ve Ebu Zerr de dahil olmak üzere bazı Sahabelerin bu baskına katıldığını da belirtiyor (s. 161-162)."
  id: "Abdullah ibn Saad, gubernur Mesir, memberitahu Utsman bahwa kaum Muslimin sedang menyerang perbatasan Afrika. Utsman berkonsultasi dengan para Sahabat satu per satu, termasuk Ali, Talha, Zubayr, dan Abbas. Kemudian ia berkonsultasi dengan Saeed ibn Zayd, yang tidak menyetujui serangan itu, dengan mengutip pernyataan Umar. Tidak ada orang lain yang tidak setuju dengannya. Utsman kemudian menyerukan rakyat untuk angkat senjata, dan pasukan pun berangkat (hlm. 161). Kitab ini juga menyebutkan bahwa beberapa Sahabat, termasuk Abdullah ibn Zubayr dan Abu Dharr, ikut serta dalam serangan ini (hlm. 161-162)."
