summary:
  ar: "خرجت طائفة من قفجاق إلى أذربيجان فأوقعوا بالكرج إيقاعًا عظيمًا، وكانوا يثنون المسلمين على غيرهم من الكفار لكثرة ما أوقعوا بهم {cite:kamil-ibn-al-athir p. 430}."
  en: "A Qipchaq band burst into Azerbaijan and shattered the Georgians; Ibn al-Athir notes the Muslims' praise of them for the blows they dealt other unbelievers {cite:kamil-ibn-al-athir p. 430}."
  es: "Una banda de Qipchaq irrumpió en Azerbaiyán y destrozó a los georgianos; Ibn al-Athir señala los elogios de los musulmanes hacia ellos por los golpes que infligieron a otros infieles {cite:kamil-ibn-al-athir p. 430}."
  fr: "Une bande de Qipchaq a fait irruption en Azerbaïdjan et a anéanti les Géorgiens; Ibn al-Athir note les éloges des musulmans à leur égard pour les coups qu'ils ont portés aux autres infidèles {cite:kamil-ibn-al-athir p. 430}."
  ur: "ایک کیپچاک بینڈ آذربائیجان میں پھٹا اور جارجیائیوں کو ٹکڑے ٹکڑے کر دیا۔ ابن اثیر نے مسلمانوں کی ان کی تعریف کو نوٹ کیا ہے کہ انہوں نے دوسرے کافروں کو مارا تھا۔ 430}۔"
  tr: "Kıpçaklardan bir grup Azerbaycan'a giderek Gürcülere büyük bir yenilgi yaşattı. Müslümanları, diğer kâfirlerden üstün tutuyorlardı çünkü onlara çok sayıda yenilgi yaşatmışlardı. {Kaynak: Kamil ibn el-Atir s. 430}"
  id: "Sekelompok orang Kipchak pergi ke Azerbaijan dan memberikan kekalahan besar kepada orang Georgia. Mereka biasa memuji kaum Muslimin lebih dari kaum kafir lainnya karena banyaknya kekalahan yang mereka berikan kepada mereka. {cite:kamil-ibn-al-athir p. 430}."
