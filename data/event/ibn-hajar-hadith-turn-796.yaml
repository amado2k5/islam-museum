id: event/ibn-hajar-hadith-turn-796
class: event
kind: other
label:
  ar: "ابن حجر يفرغ نفسه لعلم الحديث، ٧٩٦هـ/١٣٩٣م"
  en: "Ibn Hajar devotes himself entirely to hadith, 796/1393"
  ur: "ابن حجر کا علمِ حدیث کے لیے مکمل وقف، 796ھ/1393ء"
summary:
  ar: "خطا ابن حجر خطواته الأولى في تحقيق الحديث وهو ابن عشرين سنة، ثم قرر التفرغ له كلية سنة ٧٩٦هـ/١٣٩٣-١٣٩٤م. وكان شمس الدين محمد بن علي ابن القطان، أحد أوصيائه وأساتذته الأوائل، قد فتح له باب التاريخ، وصار زين الدين العراقي (ت ٨٠٦هـ/١٤٠٤م) شيخه الأول في الحديث؛ وسمع بالقاهرة عن البلقيني وابن الملقن والهيثمي وغيرهم، وأفاد من صحبة ابن جماعة من ٧٩٠هـ إلى وفاته ٨١٩هـ {cite:encyclopaedia-of-islam-2 vol. 3 p. 809}. ويقول ابن العماد إنه «حُبِّب إليه طلب الحديث فأقبل عليه وسمع الكثير بمصر وغيرها» {cite:shadharat-dhahab p. 270}."
  en: "Ibn Hajar took his first steps in hadith scholarship at twenty, and in 796/1393-4 decided to devote himself entirely to it. His guardian-teacher Shams al-Din Muhammad ibn Ali Ibn al-Qattan had introduced him to historical literature; Zayn al-Din al-Iraqi (d. 806/1404) became his principal hadith teacher, and he also heard al-Bulqini, Ibn al-Mulaqqin and al-Haythami in Cairo, and profited from Ibn Jama'a's company from 790 until the latter's death in 819 {cite:encyclopaedia-of-islam-2 vol. 3 p. 809}. Ibn al-Imad says 'the pursuit of hadith was made dear to him, so he applied himself to it and heard much in Egypt and elsewhere' {cite:shadharat-dhahab p. 270}."
  ur: "ابن حجر نے بیس برس کی عمر میں علمِ حدیث کے پہلے قدم اٹھائے اور 796ھ/1393-94ء میں خود کو اس کے لیے مکمل وقف کرنے کا فیصلہ کیا۔ ان کے سرپرست-استاد شمس الدین محمد بن علی ابن القطان نے انھیں تاریخی ادب سے روشناس کرایا؛ زین الدین عراقی (وفات 806ھ/1404ء) ان کے اصل استادِ حدیث بنے، اور انھوں نے قاہرہ میں بلقینی، ابن الملقن اور ہیتمی سے سنا، اور 790ھ سے 819ھ میں ابن جماعت کی وفات تک ان کی صحبت سے فائدہ اٹھایا {cite:encyclopaedia-of-islam-2 vol. 3 p. 809}۔ ابن العماد کہتے ہیں انھیں «طلبِ حدیث محبوب بنا دیا گیا تو وہ اس میں جُٹ گئے اور مصر اور دیگر مقامات پر بہت کچھ سنا» {cite:shadharat-dhahab p. 270}۔"
