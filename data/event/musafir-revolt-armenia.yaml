label: { ar: "خروج مسافر القصّاب بأرمينية", en: "The Rising of Musafir al-Qassab in Armenia", es: "El levantamiento de Musafir al-Qassab en Armenia", fr: "Le soulèvement de Musafir al-Qassab en Arménie", ur: "آرمینیا میں مصفیر القصاب کا عروج", tr: "Bir yolcunun Ermenistan'dan ayrılışı", id: "Keberangkatan seorang pelancong dari Armenia" }
summary:
  ar: "عند البلاذري: خالف على مروان بن محمد ثابت بن نعيم الجذامي وأتى مسافر القصّاب — وهو ممن مكّنه بالباب الضحّاك الخارجي — فوافقه على رأيه وولّاه أرمينية وأذربيجان وأتى أردبيل مستخفياً فخرج معه قوم من الشراة منها باجرُوان فوجدوا بها قوماً يرون رأيهم فانضموا إليهم وأتوا ورتان فصحبهم أهلها بشر كثير كانوا على مثل رأيهم وعبروا إلى البيلقان فصحبتهم منهم جماعة كثيرة كانوا على مثل رأيهم ثم نزلوا يونان، وولّى مروان بن محمد إسحاق بن مسلم أرمينية فلم يزل يقاتل مسافراً وكان في قلعة الكلاب بالسيسجان؛ ثم لما جاءت الدولة المباركة وولّى أبو جعفر المنصور الجزيرة وأرمينية في خلافة السفّاح وجّه إلى مسافر وأصحابه قائداً من أهل خراسان فقاتلهم حتى ظفر بهم وقتل مسافراً، وكان أهل البيلقان متحصّنين في قلعة الكلاب ورئيسهم ودد بن أصفر البيلقاني فاستنزلوا بأمان."
  en: "In al-Baladhuri: Thabit ibn Nu'aym al-Judhami rose against Marwan ibn Muhammad, and Musafir al-Qassab — one whom al-Dahhak al-Khariji had empowered at al-Bab — came agreeing with his view; al-Dahhak gave him Armenia and Adharbayjan, and he came to Ardabil in disguise, whence a body of Sharat (Kharijites) went out with him — among them Bajirwan — finding at ... like-minded men who joined them, then Wartan whose folk accompanied them in numbers sharing their view, crossing to al-Baylaqan where a great crowd of like view attached itself, till they camped at Yunan; Marwan ibn Muhammad gave Armenia to Ishaq ibn Muslim, who fought Musafir ceaselessly, Musafir holding the fortress of al-Kilab in Sisajan; then when the blessed Dawla came and Abu Ja'far al-Mansur governed Jazira and Armenia under al-Saffah, he sent against Musafir and his fellows a commander of Khurasan's people who fought them till he overcame them and killed Musafir — the people of al-Baylaqan had fortified themselves in Qal'at al-Kilab under their chief Wadad ibn Asfar al-Baylaqani, and were brought down under aman."
  es: "En al-Baladhuri: Thabit ibn Nu'aym al-Judhami se levantó contra Marwan ibn Muhammad, y Musafir al-Qassab —uno a quien al-Dahhak al-Khariji había empoderado en al-Bab— vino estando de acuerdo con su punto de vista; al-Dahhak le dio Armenia y Adharbayjan, y llegó a Ardabil disfrazado, de donde salió con él un grupo de Sharat (Kharijitas) —entre ellos Bajirwan— encontrando en ... hombres de ideas afines que se unieron a ellos, luego Wartan cuya gente los acompañó en número compartiendo su punto de vista, cruzando a al-Baylaqan donde se unió una gran multitud de ideas afines, hasta que acamparon en Yunan; Marwan ibn Muhammad dio Armenia a Ishaq ibn Muslim, quien luchó contra Musafir sin cesar, Musafir controlando la fortaleza de al-Kilab en Sisajan; Luego, cuando llegó el bendito Dawla y Abu Ja'far al-Mansur gobernaba Jazira y Armenia bajo el mando de al-Saffah, envió contra Musafir y sus compañeros a un comandante del pueblo de Jorasán que luchó contra ellos hasta que los venció y mató a Musafir. El pueblo de al-Baylaqan se había fortificado en Qal'at al-Kilab bajo el mando de su jefe Wadad ibn Asfar al-Baylaqani, y fueron derrotados por aman."
  fr: "Dans al-Baladhuri: Thabit ibn Nu'aym al-Judhami se souleva contre Marwan ibn Muhammad, et Musafir al-Qassab — que al-Dahhak al-Khariji avait soutenu à al-Bab — vint se rallier à son point de vue; al-Dahhak lui donna l'Arménie et Adharbayjan, et il arriva à Ardabil déguisé, d'où un groupe de Sharat (Kharijites) partit avec lui — parmi lesquels Bajirwan — trouvant à... des hommes partageant les mêmes idées qui se joignirent à eux, puis Wartan, dont le peuple les accompagna en nombre partageant leur point de vue, traversant jusqu'à al-Baylaqan où une grande foule partageant les mêmes idées se rallia, jusqu'à ce qu'ils campent à Yunan; Marwan ibn Muhammad donna l'Arménie à Ishaq ibn Muslim, qui combattit Musafir sans relâche, Musafir tenant la forteresse d'al-Kilab à Sisajan; puis, lorsque le bienheureux Dawla est arrivé et qu'Abu Ja'far al-Mansur a gouverné la Jazira et l'Arménie sous al-Saffah, il a envoyé contre Musafir et ses compagnons un commandant du peuple du Khorasan qui les a combattus jusqu'à ce qu'il les vainque et tue Musafir — les habitants d'al-Baylaqan s'étaient fortifiés à Qal'at al-Kilab sous leur chef Wadad ibn Asfar al-Baylaqani, et ont été vaincus sous aman."
  ur: "البلادوری میں ہے: ثابت ابن نعیم الجوثمی مروان بن محمد کے خلاف اٹھ کھڑا ہوا، اور مسافر القصاب - جسے الضحاک الخارجی نے الباب میں اختیار دیا تھا - ان کے خیال سے متفق ہوئے؛ الضحاک نے اسے آرمینیا اور ادربائجان دیا، اور وہ بھیس میں اردبیل آیا، جہاں سے شرت ⁦(خارجی)⁩ کا ایک جسم اس کے ساتھ نکلا، جن میں بجیروان بھی تھے، ان کے ساتھ مل کر ہم خیال آدمیوں کو ملا، پھر وارتن جن کے لوگ ان کے ساتھ بڑی تعداد میں اپنے خیالات کا اظہار کرتے ہوئے، ان کے ساتھ مل کر ایک عظیم ہجوم کو پار کرتے ہوئے البیقیل کی طرف بڑھے، یہاں تک کہ وہ ایک بڑا ہجوم دیکھ رہے تھے۔ یونان؛ مروان بن محمد نے آرمینیا کو اسحاق بن مسلم کے حوالے کر دیا، جس نے مسافر سے مسلسل جنگ کی، مسافر نے سیساجان میں الکلاب کے قلعے پر قبضہ کر رکھا تھا۔ پھر جب دولہ مبارک آیا اور ابو جعفر المنصور نے الصفح کے تحت جزیرہ اور آرمینیا پر حکومت کی تو اس نے مسافر اور اس کے ساتھیوں کے خلاف خراسان کے لوگوں کے ایک کمانڈر کو بھیجا جس نے ان سے جنگ کی یہاں تک کہ اس نے ان پر غلبہ حاصل کیا اور مسافر کو قتل کر دیا - البیلقان کے لوگوں نے قلعہ دار الصفح کے تحت اپنے آپ کو مضبوط کر لیا تھا۔ البیلقانی، اور امان کے نیچے لایا گیا۔"
  tr: "El-Baladhuri'ye göre: Sabit ibn Na'im el-Cudami, Mervan ibn Muhammed'e karşı çıktı ve kapıda el-Dahhak el-Harji'nin yetkilendirdiği kişilerden biri olan Musafir el-Kasab'a gitti, onun görüşüne katıldı ve onu Ermenistan ve Azerbaycan valisi olarak atadı. Gizlice Erdebil'e gitti ve oradan bir grup Şarat onunla birlikte Bajruwan'a gitti. Orada kendi görüşlerini paylaşan insanlar buldular, onlara katıldılar ve Wartan'a gittiler. Görüşlerini paylaşan birçok kişi onlara eşlik etti ve Baylaqan'a geçtiler. Görüşlerini paylaşan büyük bir grup onlara eşlik etti. Sonra Yunnan'a yerleştiler. Mervan ibn Muhammed, İshak ibn Müslim'i Ermenistan valisi olarak atadı ve İshak, Musafir ile savaşmaya devam etti. Siscan'daki köpekler kalesindeydi. Sonra, mübarek devlet geldiğinde ve Ebu Cafer el-Mansur, Saffa halifeliği döneminde adayı ve Ermenistan'ı tayin ettiğinde, Horasan halkından bir komutanı Musafir ve arkadaşlarının yanına gönderdi. Onlarla savaştı ve zafer kazanarak Musafir'i öldürdü. Beylakan halkı köpekler kalesinde tahkim edilmişti ve liderleri Vadad ibn Asfar el-Beylqani idi, bu yüzden güvenlik garantisiyle teslim oldular."
  id: "Menurut Al-Baladhuri: Thabit ibn Na’im al-Judhami menentang Marwan ibn Muhammad dan pergi menemui Musafir al-Qassab — yang merupakan salah satu orang yang telah diberi wewenang oleh al-Dahhak al-Kharji di gerbang — dan menyetujui pendapatnya serta mengangkatnya sebagai gubernur Armenia dan Azerbaijan. Ia pergi ke Ardabil secara diam-diam, dan sekelompok orang Sharat dari sana ikut bersamanya ke Bajruwan. Mereka menemukan orang-orang di sana yang sependapat dengan mereka, sehingga mereka bergabung dengan mereka dan pergi ke Wartan. Banyak penduduk Wartan yang ikut serta, dan mereka menyeberang ke Baylaqan. Sekelompok besar orang yang ikut serta juga ikut bersama mereka. Kemudian mereka menetap di Yunan. Marwan ibn Muhammad mengangkat Ishaq ibn Muslim sebagai gubernur Armenia, dan ia terus memerangi Musafir. Ia berada di benteng anjing di Sisjan. Kemudian, ketika negara yang diberkahi itu datang dan Abu Ja’far al-Mansur mengangkat pulau dan Armenia pada masa kekhalifahan al-Saffah, ia mengirim seorang komandan dari kaum Khorasan kepada Musafir dan para sahabatnya. Ia memerangi mereka hingga menang dan membunuh Musafir. Kaum Baylaqan membentengi diri di benteng anjing, dan pemimpin mereka adalah Wadad ibn Asfar al-Baylqani, sehingga mereka menyerah dengan jaminan keselamatan."
