label: { ar: "معركة قونية (١٨٣٢)", en: "Battle of Konya (1832)", ur: "قونیہ کی جنگ (1832ء)" }
summary:
  ar: "في أواخر سنة ١٨٣٢م سُحق جيش الصدر الأعظم العثماني رشيد باشا تحت أسوار قونية على يد الجيش المصري بقيادة إبراهيم باشا بن محمد علي في الحرب المصرية العثمانية الأولى — وهزيمة تثبت أن المدينة ما برحت تؤدي دورًا عسكريًا {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 288}."
  en: "At the end of 1832 the Ottoman army of Grand Vizier Reshid Pasha was crushed under the walls of Konya by the Egyptian army of Ibrahim Pasha, son of Muhammad Ali, in the first Turko-Egyptian war — a defeat proving the city could still play a military role {cite:encyclopaedia-of-islam-2 vol. 5.1 p. 288}."
  ur: "1832ء کے آخر میں قونیہ کی فصیلوں کے نیچے صدرِ اعظم رشید پاشا کی عثمانی فوج کو محمد علی کے بیٹے ابراہیم پاشا کی مصری فوج نے پہلی مصری-عثمانی جنگ میں کچل دیا — یہ شکست ثابت کرتی ہے کہ شہر اب بھی فوجی کردار ادا کر سکتا تھا۔"
