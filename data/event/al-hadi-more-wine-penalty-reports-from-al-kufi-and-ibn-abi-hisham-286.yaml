id: event/al-hadi-more-wine-penalty-reports-from-al-kufi-and-ibn-abi-hisham-286
class: event
kind: other
label:
  ar: 'أخبار أخرى في حد الخمر: من روايتي الكوفي وابن أبي هشام'
  en: More reports on the wine penalty, from al-Kufi and Ibn Abi Hisham
  ur: شراب کی حد کی مزید روایات، کوفی اور ابن ابی ہشام سے
summary:
  ar: 'يروي علي بن محمد عن أبي جعفر محمد بن سليمان الكوفي وعن محمد بن أبي هشام وعن أبيه أخباراً أخرى في حد الخمر عند الهادي: رجل ضعيف جُمعت له ثلاثة أسواط، وامرأة سألت العفو بحق علي بن أبي طالب فأجابها الهادي بأن الحد لله، وقول له في أخذ الحق ولو من جده القاسم بن إبراهيم، ورجلان وُجد في منزلهما خمر فضُرب كل منهما ستين.'
  en: 'Ali ibn Muhammad relays further reports on the wine penalty from Abu Jafar Muhammad ibn Sulayman al-Kufi, from Muhammad ibn Abi Hisham and from his father: a frail man given three whips bound together, a woman who begged mercy for the sake of Ali ibn Abi Talib and was told the penalty belongs to God, a saying of al-Hadi about taking what is due even from his grandfather al-Qasim ibn Ibrahim, and two men in whose house wine was found, struck sixty each.'
  ur: 'علی بن محمد ابو جعفر محمد بن سلیمان الکوفی، محمد بن ابی ہشام اور اپنے والد سے ہادی کے ہاں شراب کی حد کی مزید روایات نقل کرتے ہیں: ایک کمزور آدمی کے لیے تین کوڑے ملا کر مارنا، ایک عورت جس نے علی بن ابی طالب کے حق کا واسطہ دے کر معافی مانگی اور جسے جواب ملا کہ حد اللہ کی ہے، حق لینے کے بارے میں ہادی کا ایک قول کہ حق اپنے دادا القاسم بن ابراہیم سے بھی لیا جاتا، اور دو آدمی جن کے گھر سے شراب ملی اور جنہیں ساٹھ ساٹھ کوڑے لگے۔'
