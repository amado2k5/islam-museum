id: event/tirmidhi-settles-jami-265
class: event
kind: other
label:
  ar: "استقرار الترمذي ببلدته وانكبابه على تأليف الجامع، نحو ٢٦٥هـ"
  en: "Al-Tirmidhi settles back at his town and devotes himself to composing the Jami', c. 265/879"
  ur: "ترمذی کا اپنے شہر میں استقرار اور جامع کی تصنیف میں انغماد، تقریباً 265ھ/879ء"
  es: "Al-Tirmidhi se instala de nuevo en su ciudad y se dedica a componer el Jami', c. 265/879."
  fr: "Al-Tirmidhi retourne dans sa ville et se consacre à la composition du Jami', vers 265/879."
  tr: "Tirmizi, memleketine yerleşti ve yaklaşık 265 Hicri yılında Cami'yi yazmaya kendini adadı."
  id: "Al-Tirmidhi menetap di kota kelahirannya dan mencurahkan dirinya untuk menulis kitab Jami', sekitar tahun 265 Hijriah."
summary:
  ar: "استقر الترمذي ببلدته بعد أن استكمل رحلته العلمية وعكف على التأليف والمراجعة {cite:mawsuat-a3lam-ulama-adaba p. 451}؛ وصنّف الجامع المعروف بسنن الترمذي — أحد الكتب الستة — في ٣٩٥٦ حديثاً على خمسين كتاباً، وألحق به كتاب العلل بياناً لمنهجه في تقسيم الحديث إلى صحيح وحسن وغريب، وجمع أيضاً كتاب الشمائل المحمدية في أوصاف النبي {cite:encyclopaedia-of-islam-2 vol. 10 p. 579} {cite:mawsuat-a3lam-ulama-adaba p. 451-452}."
  en: "Al-Tirmidhi settled back at his town after completing his scholarly journey and devoted himself to authorship and revision {cite:mawsuat-a3lam-ulama-adaba p. 451}; he composed the Jami' known as the Sunan of al-Tirmidhi — one of the Six Books — with 3,956 traditions over fifty chapters, appending the Kitab al-Ilal as a statement of his method in grading hadith sahih, hasan and gharib, and he also gathered the Kitab al-Shama'il al-Muhammadiyya on the Prophet's characteristics {cite:encyclopaedia-of-islam-2 vol. 10 p. 579} {cite:mawsuat-a3lam-ulama-adaba p. 451-452}."
  ur: "ترمذی علمی مسافرت مکمل کرنے کے بعد اپنے شہر میں مستقر ہو گئے اور تصنیف و نظرثانی میں جُٹ گئے {cite:mawsuat-a3lam-ulama-adaba p. 451}؛ انہوں نے جامع مرتب کی جو سننِ ترمذی کے نام سے معروف ہے — کتبِ ستہ میں سے — جس میں پچاس ابواب پر 3956 احادیث ہیں، اور آخر میں کتاب العلل شامل کی جو صحیح، حسن اور غریب کی تقسیم پر ان کے منہج کی وضاحت ہے؛ انہوں نے اوصافِ نبوی پر کتاب الشمائل المحمدیہ بھی جمع کی {cite:encyclopaedia-of-islam-2 vol. 10 p. 579} {cite:mawsuat-a3lam-ulama-adaba p. 451-452}۔"
  es: "Al-Tirmidhi se estableció de nuevo en su ciudad natal tras completar su viaje académico y se dedicó a la autoría y revisión {cite:mawsuat-a3lam-ulama-adaba p. 451}; compuso el Jami' conocido como el Sunan de al-Tirmidhi —uno de los Seis Libros— con 3.956 tradiciones en cincuenta capítulos, añadiendo el Kitab al-Ilal como una declaración de su método para clasificar los hadices sahih, hasan y gharib, y también recopiló el Kitab al-Shama'il al-Muhammadiyya sobre las características del Profeta {cite:encyclopaedia-of-islam-2 vol. 10 p. 579} {cite:mawsuat-a3lam-ulama-adaba p. 451-452}."
  fr: "Après avoir achevé son voyage d'études, Al-Tirmidhi s'installa dans sa ville natale et se consacra à la rédaction et à la révision d'ouvrages (voir: mawsuat-a3lam-ulama-adaba p. 451). Il composa le Jami' connu sous le nom de Sunan d'al-Tirmidhi — l'un des Six Livres — avec 3 956 traditions réparties en cinquante chapitres, auquel il ajouta le Kitab al-Ilal, exposé de sa méthode de classement des hadiths en sahih, hasan et gharib. Il rassembla également le Kitab al-Shama'il al-Muhammadiyya sur les caractéristiques du Prophète (voir: encyclopaedia-of-islam-2 vol. 10 p. 579) (voir: mawsuat-a3lam-ulama-adaba p. 451-452)."
  tr: "Tirmizi, ilim yolculuğunu tamamladıktan sonra memleketine yerleşti ve kendini yazmaya ve hadisleri gözden geçirmeye adadı (kaynak: mawsuat-a3lam-ulama-adaba, s. 451); ve elli ciltte 3956 hadis içeren, altı kitaptan biri olan Sunan-ı Tirmizi külliyatını derledi ve hadisleri sahih, iyi ve nadir olarak ayırma yöntemini açıklamak için buna Kusurlar Kitabı'nı ekledi; ayrıca Peygamberin özelliklerini anlatan Peygamberlik Kitabı'nı da derledi (kaynak: encyclopaedia-of-islam-2, cilt 10, s. 579) (kaynak: mawsuat-a3lam-ulama-adaba, s. 451-452)."
  id: "Al-Tirmidhi menetap di kota kelahirannya setelah menyelesaikan perjalanan keilmuannya dan mengabdikan dirinya untuk menulis dan mengulas {cite:mawsuat-a3lam-ulama-adaba hlm. 451}; dan beliau menyusun kumpulan yang dikenal sebagai Sunan al-Tirmidhi — salah satu dari enam kitab — yang berisi 3956 hadits dalam lima puluh buku, dan beliau menambahkan Kitab Kekurangan untuk menjelaskan metodenya dalam membagi hadits menjadi hadits sahih, baik, dan langka, dan beliau juga menyusun Kitab Karakteristik Kenabian dalam deskripsi Nabi {cite:encyclopaedia-of-islam-2 vol. 10 hlm. 579} {cite:mawsuat-a3lam-ulama-adaba hlm. 451-452}."
