label:
  ar: "مولد ابن قيم الجوزية بدمشق، ٧ صفر ٦٩١هـ/٢٩ يناير ١٢٩٢م"
  en: "Birth of Ibn Qayyim al-Jawziyya at Damascus, 7 Safar 691/29 January 1292"
  ur: "ابن قیم الجوزیہ کی پیدائش، دمشق، 7 صفر 691ھ/29 جنوری 1292ء"
summary:
  ar: "وُلد شمس الدين أبو بكر محمد بن أبي بكر بن أيوب بن سعد بن حريز الزرعي الدمشقي، المعروف بابن قيم الجوزية، بدمشق يوم ٧ صفر ٦٩١هـ/٢٩ يناير ١٢٩٢م، وكان أبوه قَيِّم مدرسة الجوزية التي كانت مجلس حكم لقاضي قضاة الحنابلة بدمشق {cite:encyclopaedia-of-islam-2 vol. 3 p. 853}؛ قال ابن حجر: ولد سنة ٦٩١ {cite:durar-kamina-jil-1993 3/400}."
  en: "Shams al-Din Abu Bakr Muhammad ibn Abi Bakr ibn Ayyub ibn Sa'd ibn Hurayz al-Zur'i al-Dimashqi, known as Ibn Qayyim al-Jawziyya, was born at Damascus on 7 Safar 691/29 January 1292; his father was the superintendent (qayyim) of the Jawziyya madrasa, which served as a court of law for the Hanbali qadi al-qudat of Damascus {cite:encyclopaedia-of-islam-2 vol. 3 p. 853}; Ibn Hajar gives his birth year as 691 {cite:durar-kamina-jil-1993 3/400}."
  ur: "شمس الدین ابو بکر محمد بن ابی بکر بن ایوب بن سعد بن حریز زرعی دمشقی، المعروف ابن قیم الجوزیہ، 7 صفر 691ھ/29 جنوری 1292ء کو دمشق میں پیدا ہوئے؛ ان کے والد جوزیہ مدرسہ کے قیم (نگہبان) تھے جو دمشق کے حنبلی قاضی القضاة کی عدالت کا مقام تھا {cite:encyclopaedia-of-islam-2 vol. 3 p. 853}؛ ابن حجر نے ان کی سالِ پیدائش 691ھ لکھی ہے {cite:durar-kamina-jil-1993 3/400}۔"
