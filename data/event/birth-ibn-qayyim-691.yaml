label:
  ar: "مولد ابن قيم الجوزية بدمشق، ٧ صفر ٦٩١هـ/٢٩ يناير ١٢٩٢م"
  en: "Birth of Ibn Qayyim al-Jawziyya at Damascus, 7 Safar 691/29 January 1292"
  ur: "ابن قیم الجوزیہ کی پیدائش، دمشق، 7 صفر 691ھ/29 جنوری 1292ء"
  fr: "La naissance d'Ibn Qayyim al-Jawziyya à Damas, 7 Safar 691/29 janvier 1292"
  es: "Nacimiento de Ibn Qayyim al-Jawziyya en Damasco, 7 Safar 691/29 de enero"
  tr: "İbn Kayyım el-Cevziyye, 7 Safar 691 H. / 29 Ocak 1292 M. tarihinde Şam'da doğdu."
  id: "Ibnu Qayyim al-Jawziyya lahir di Damaskus pada tanggal 7 Safar 691 H / 29 Januari 1292 M."
summary:
  ar: "وُلد شمس الدين أبو بكر محمد بن أبي بكر بن أيوب بن سعد بن حريز الزرعي الدمشقي، المعروف بابن قيم الجوزية، بدمشق يوم ٧ صفر ٦٩١هـ/٢٩ يناير ١٢٩٢م، وكان أبوه قَيِّم مدرسة الجوزية التي كانت مجلس حكم لقاضي قضاة الحنابلة بدمشق {cite:encyclopaedia-of-islam-2 vol. 3 p. 853}؛ قال ابن حجر: ولد سنة ٦٩١ {cite:durar-kamina-jil-1993 3/400}."
  en: "Shams al-Din Abu Bakr Muhammad ibn Abi Bakr ibn Ayyub ibn Sa'd ibn Hurayz al-Zur'i al-Dimashqi, known as Ibn Qayyim al-Jawziyya, was born at Damascus on 7 Safar 691/29 January 1292; his father was the superintendent (qayyim) of the Jawziyya madrasa, which served as a court of law for the Hanbali qadi al-qudat of Damascus {cite:encyclopaedia-of-islam-2 vol. 3 p. 853}; Ibn Hajar gives his birth year as 691 {cite:durar-kamina-jil-1993 3/400}."
  ur: "شمس الدین ابو بکر محمد بن ابی بکر بن ایوب بن سعد بن حریز زرعی دمشقی، المعروف ابن قیم الجوزیہ، 7 صفر 691ھ/29 جنوری 1292ء کو دمشق میں پیدا ہوئے؛ ان کے والد جوزیہ مدرسہ کے قیم ⁦(نگہبان)⁩ تھے جو دمشق کے حنبلی قاضی القضاة کی عدالت کا مقام تھا {cite:encyclopaedia-of-islam-2 vol. 3 p. 853}؛ ابن حجر نے ان کی سالِ پیدائش 691ھ لکھی ہے {cite:durar-kamina-jil-1993 3/400}۔"
  fr: "Shams al-Din Abu Bakr Muhammad ibn Abi Bakr ibn Ayyub ibn Sa'd ibn Hurayz al-Zur'i al-Dimashqi, connu sous le nom d'Ibn Qayyim al-Jawziyya, naquit à Damas le 7 Safar 691/29 janvier 1292 ; son père était l'intendant (qayyim) de la madrasa Jawziyya, qui servait de tribunal au grand cadi hanbalite de Damas {cite:encyclopaedia-of-islam-2 vol. 3 p. 853} ; Ibn Hajar donne 691 comme année de sa naissance {cite:durar-kamina-jil-1993 3/400}."
  es: "Shams al-Din Abu Bakr Muhammad ibn Abi Bakr ibn Ayyub ibn Sa'd ibn Hurayz al-Zur'i al-Dimashqi, conocido como Ibn Qayyim al-Jawziyya, nació en Damasco el 7 de Safar de 691/29 de enero de 1292; su padre era el superintendente (qayyim) de la madrasa Jawziyya, que servía como tribunal de justicia para el qadi al-qudat hanbali de Damasco {cita:encyclopaedia-of-islam-2 vol. 3 p. 853}; Ibn Hajar da su año de nacimiento como 691 {cita:durar-kamina-jil-1993 3/400}."
  tr: "Şemseddin Ebu Bekir Muhammed ibn Ebu Bekir ibn Eyyub ibn Saad ibn Hariz el-Zar'i el-Dimaşki, İbn Kayyim el-Cevziyye olarak bilinir, 7 Safer 691 Hicri/29 Ocak 1292 Miladi tarihinde Şam'da doğmuştur. Babası, Şam'daki Hanbeli Başyargıcının hukuk mahkemesi olan el-Cevziyye Okulu'nun sorumlusuydu {kaynak:encyclopaedia-of-islam-2 cilt 3 s. 853}; İbn Hacer şöyle demiştir: 691 yılında doğmuştur {kaynak:durar-kamina-jil-1993 3/400}."
  id: "Shams al-Din Abu Bakr Muhammad ibn Abi Bakr ibn Ayyub ibn Saad ibn Hariz al-Zar’i al-Dimashqi, yang dikenal sebagai Ibn Qayyim al-Jawziyya, lahir di Damaskus pada tanggal 7 Safar 691 H/29 Januari 1292 M. Ayahnya adalah penjaga Mazhab al-Jawziyya, yang merupakan pengadilan bagi Ketua Hakim mazhab Hanbali di Damaskus {cite:encyclopaedia-of-islam-2 vol. 3 p. 853}; Ibn Hajar berkata: Beliau lahir pada tahun 691 {cite:durar-kamina-jil-1993 3/400}."
