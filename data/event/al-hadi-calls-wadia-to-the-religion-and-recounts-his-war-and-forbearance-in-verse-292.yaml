id: event/al-hadi-calls-wadia-to-the-religion-and-recounts-his-war-and-forbearance-in-verse-292
class: event
kind: other
label:
  ar: "قصيدة للهادي: دعوة وادعة إلى الدين وذكر حربه وصفحه عن خصومه، ص327"
  en: "A poem of al-Hadi: a call to Wadi'a for the religion and an account of his war and his forbearance towards his opponents, p. 327"
  ur: "ہادی کی نظم: وادعہ کو دین کی دعوت اور اپنی جنگ اور مخالفین سے درگزر کا بیان، ص327"
  es: "Un poema de al-Hadi: un llamado a Wadi'a para la religión y un relato de su guerra y su tolerancia hacia sus oponentes, pág. 327"
  fr: "Poème d'al-Hadi: un appel à Wadi'a pour la religion et un récit de sa guerre et de sa patience envers ses adversaires, p. 327"
  tr: "El-Hadi'nin bir şiiri: Dine nazik bir çağrı ve savaşından ve rakiplerini affetmesinden bahsetme, s. 327"
  id: "Puisi karya Al-Hadi: Seruan lembut kepada agama dan penyebutan tentang perangnya serta pengampunannya terhadap lawan-lawannya, hlm. 327"
summary:
  ar: "تتمة القصيدة في ص327 يخاطب فيها حي وادعة ويدعوهم إلى التأهب للدين، ويذكر أمير المؤمنين وآباءهم معه، ويتوعد خصومه بالخيل والأبطال، ويقول إنه منعهم ودعاهم إلى صلاح الدين فرفضوا الحق فصفح عنهم أولاً ثم توعدهم بالنكال، ويختم بمثل ضربه شاعر قومه."
  en: "The continuation of the poem on p. 327, in which the poet addresses the clan of Wadi'a and calls them to make ready for the religion, speaks of the Commander of the Believers and of their forefathers with him, vows to come on his opponents with horses and heroes, and says he forbade them and called them to the soundness of the religion, that they cast the truth aside, that he forgave first and then threatened them with punishment; it ends with a saying of his people's poet."
  ur: "ص327 پر نظم کا تسلسل، جس میں شاعر قبیلۂ وادعہ سے مخاطب ہو کر انہیں دین کے لیے تیار ہونے کو کہتا ہے، امیر المومنین اور ان کے ساتھ ان کے آباء کا ذکر کرتا ہے، گھوڑوں اور بہادروں کے ساتھ مخالفین پر آنے کا عزم کرتا ہے، اور کہتا ہے کہ اس نے انہیں روکا اور دین کی درستی کی طرف بلایا، انہوں نے حق چھوڑ دیا، اس نے پہلے درگزر کیا پھر سزا کی دھمکی دی؛ اختتام اس کی قوم کے شاعر کی ایک مثال پر ہے۔"
  es: "La continuación del poema en la página 327, en la que el poeta se dirige al clan de Wadi'a y los llama a prepararse para la religión, habla del Comandante de los Creyentes y de sus antepasados con él, jura ir contra sus oponentes con caballos y héroes, y dice que les prohibió y los llamó a la rectitud de la religión, que desecharon la verdad, que primero los perdonó y luego los amenazó con el castigo; termina con un dicho del poeta de su pueblo."
  fr: "La suite du poème à la page 327, dans laquelle le poète s'adresse au clan de Wadi'a et les appelle à se préparer à la religion, parle du Commandeur des Croyants et de leurs ancêtres avec lui, jure de venir sur ses adversaires avec des chevaux et des héros, et dit qu'il les a interdits et les a appelés à la rectitude de la religion, qu'ils ont rejeté la vérité, qu'il a d'abord pardonné puis les a menacés de punition; elle se termine par un dicton du poète de son peuple."
  tr: "Şiirin geri kalanı 327. sayfada yer almaktadır; burada Wad’ah halkına seslenerek onları dine hazırlanmaya çağırır. Müminlerin Komutanını ve onunla birlikte olan babalarını anar ve rakiplerini atlar ve kahramanlarla tehdit eder. Onları engellediğini ve doğruluk yoluna çağırdığını, ancak gerçeği reddettiklerini, bu yüzden önce onları affettiğini, sonra da cezalandırmakla tehdit ettiğini söyler. Şiiri, şairin kendi halkı arasında kullandığı bir atasözüyle sonlandırır."
  id: "Bagian selanjutnya dari puisi itu ada di halaman 327, di mana ia menyapa penduduk Wad’ah dan mengajak mereka untuk mempersiapkan diri memeluk agama. Ia menyebutkan Amirul Mukminin dan para leluhur mereka bersamanya, dan mengancam lawan-lawannya dengan kuda dan para pahlawan. Ia mengatakan bahwa ia telah mencegah mereka dan mengajak mereka ke jalan kebenaran, tetapi mereka menolak kebenaran, sehingga ia mengampuni mereka terlebih dahulu, kemudian mengancam mereka dengan hukuman. Ia mengakhiri dengan sebuah peribahasa yang digunakan oleh penyair untuk kaumnya."
