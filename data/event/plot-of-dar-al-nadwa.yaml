summary:
  en: "The fateful meeting of Quraysh's parliament in Dar al-Nadwa on Thursday 26 Safar 14 AH (12 September 622 CE) where chiefs debated expelling, imprisoning, or assassinating Muhammad, resolving on Abu Jahl's proposal to strike him simultaneously with a young warrior from each clan."
  ar: "اجتماع برلمان قريش في دار الندوة صبيحة يوم الخميس 26 صفر سنة 14 من النبوة (12 سبتمبر 622م) بعد استكمال هجرة الصحابة؛ تشاوروا بين الحبس والنفي والقتل، فأجمعوا على رأي أبي جهل باغتياله بضربة رجل واحد من فتيان كل قبيلة ليتفرق دمه في القبائل."
