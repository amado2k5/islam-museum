id: event/plot-of-dar-al-nadwa
class: event
kind: council
label: { en: "The plot at Dar al-Nadwa", ar: "اجتماع دار الندوة وقرار اغتيال النبي", es: "La parcela en Dar al-Nadwa", fr: "Le complot à Dar al-Nadwa", ur: "دارالندوہ میں پلاٹ", tr: "Dar al-Nadwa'nın toplantısı ve Peygamber'e suikast kararı", id: "Pertemuan Dar al-Nadwa dan keputusan untuk membunuh Nabi." }
summary:
  en: "The fateful meeting of Quraysh's parliament in Dar al-Nadwa on Thursday 26 Safar 14 AH (12 September 622 CE) where chiefs debated expelling, imprisoning, or assassinating Muhammad, resolving on Abu Jahl's proposal to strike him simultaneously with a young warrior from each clan."
  ar: "اجتماع برلمان قريش في دار الندوة صبيحة يوم الخميس 26 صفر سنة 14 من النبوة ⁦(12 سبتمبر 622م)⁩ بعد استكمال هجرة الصحابة؛ تشاوروا بين الحبس والنفي والقتل، فأجمعوا على رأي أبي جهل باغتياله بضربة رجل واحد من فتيان كل قبيلة ليتفرق دمه في القبائل."
  es: "La fatídica reunión del parlamento de Quraysh en Dar al-Nadwa el jueves 26 de Safar del año 14 de la Hégira (12 de septiembre de 622 d. C.), donde los jefes debatieron sobre la expulsión, el encarcelamiento o el asesinato de Mahoma, decantándose por la propuesta de Abu Jahl de atacarlo simultáneamente con un joven guerrero de cada clan."
  fr: "La réunion fatidique du parlement de Quraysh à Dar al-Nadwa le jeudi 26 Safar 14 AH (12 septembre 622 CE) où les chefs ont débattu de l'expulsion, de l'emprisonnement ou de l'assassinat de Muhammad, se résolvant sur la proposition d'Abu Jahl de le frapper simultanément avec un jeune guerrier de chaque clan."
  ur: "جمعرات 26 صفر 14 ہجری ⁦(12 ستمبر 622 عیسوی)⁩ کو دارالندوہ میں قریش کی پارلیمنٹ کا شاندار اجلاس ہوا جہاں سرداروں نے محمد کو بے دخل کرنے، قید کرنے یا قتل کرنے پر بحث کی، ابو جہل کی تجویز پر فیصلہ کیا کہ وہ ہر قبیلے کے ایک نوجوان جنگجو کے ساتھ بیک وقت حملہ کرے۔"
  tr: "Kureyş meclisi, Sahabelerin hicretinin tamamlanmasının ardından, Peygamberliğin 14. yılı 26 Safer Perşembe sabahı (12 Eylül 622) Darü'l-Nadve'de toplandı. Hapis, sürgün ve öldürme arasında istişarede bulundular ve Ebu Cehl'in görüşüne katılarak, her kabileden bir gencin darbesiyle öldürülmesini ve kanının kabileler arasında dağılmasını kararlaştırdılar."
  id: "Parlemen Quraisy berkumpul di Dar al-Nadwa pada pagi hari Kamis, 26 Safar, tahun ke-14 kenabian (12 September 622 M), setelah selesainya hijrah para Sahabat. Mereka bermusyawarah antara pemenjaraan, pengasingan, dan pembunuhan, dan mereka sepakat dengan pendapat Abu Jahl untuk membunuhnya dengan satu pukulan dari pemuda setiap suku sehingga darahnya akan tersebar di antara suku-suku tersebut."
