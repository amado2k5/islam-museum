id: event/al-hadi-addresses-the-man-of-firm-mind-and-the-saying-of-what-will-be-292
class: event
kind: other
label:
  ar: "أبيات للهادي إلى «صاحب العقل الرصين أخي الهدى» وقوله فيما لا يكون وما سيكون، ص306"
  en: "Verses of al-Hadi to the \"man of firm mind, brother of guidance\", and his saying on what cannot be and what will be, p. 306"
  ur: "ہادی کے اشعار «پختہ عقل والے، ہدایت کے بھائی» کے نام، اور جو نہیں ہو سکتا اور جو ہو کر رہے گا اس کا قول، ص306"
summary:
  ar: "بعد عنوان «وله أيضاً» تأتي أبيات قصيرة يخاطب فيها الهادي صاحب العقل الرصين أخا الهدى بأن له الوفاء بعهده ودينه ومحبة النبي وآله، وبه فاز وخسر غيره، وتنتهي بمثل ما لا يكون فلا يكون بحيلة وما هو كائن سيكون."
  en: "After the heading \"and also of his\" come short lines in which al-Hadi addresses the man of firm mind, brother of guidance, saying he has fidelity to his covenant and his religion and love of the Prophet and his family, by which he succeeded while others lost, and ending on a proverb: what cannot be will not be by any contrivance, and what is to be will be."
  ur: "عنوان «اور اس کا یہ بھی» کے بعد مختصر اشعار آتے ہیں جن میں ہادی پختہ عقل والے، ہدایت کے بھائی کو مخاطب کرتا ہے کہ اس کے پاس اپنے عہد اور دین کی وفاداری اور نبی اور ان کی آل کی محبت ہے جس سے وہ کامیاب ہوا اور دوسرا گھاٹے میں رہا، اور خاتمہ ایک کہاوت پر ہوتا ہے: جو نہیں ہونا وہ کسی تدبیر سے نہیں ہو گا اور جو ہونا ہے وہ ہو کر رہے گا۔"
