id: event/al-hadi-addresses-the-man-of-firm-mind-and-the-saying-of-what-will-be-292
class: event
kind: other
label:
  ar: "أبيات للهادي إلى «صاحب العقل الرصين أخي الهدى» وقوله فيما لا يكون وما سيكون، ص306"
  en: "Verses of al-Hadi to the \"man of firm mind, brother of guidance\", and his saying on what cannot be and what will be, p. 306"
  ur: "ہادی کے اشعار «پختہ عقل والے، ہدایت کے بھائی» کے نام، اور جو نہیں ہو سکتا اور جو ہو کر رہے گا اس کا قول، ص306"
  es: "Versículos de al-Hadi al \"hombre de mente firme, hermano de la guía\", y su dicho sobre lo que no puede ser y lo que será, pág. 306"
  fr: "Versets d'al-Hadi à « l'homme à l'esprit ferme, frère de la guidance », et son discours sur ce qui ne peut être et ce qui sera, p. 306"
  tr: "Hadi'nin \"akıl sahibi, hidayet kardeşim\" diye hitap ettiği ayetler ve onun olmayan ve olacak hakkındaki sözleri, s. 306"
  id: "Ayat-ayat Al-Hadi yang ditujukan kepada \"pemilik akal sehat, saudaraku yang mendapat petunjuk,\" dan kata-katanya tentang apa yang tidak ada dan apa yang akan ada, hlm. 306"
summary:
  ar: "بعد عنوان «وله أيضاً» تأتي أبيات قصيرة يخاطب فيها الهادي صاحب العقل الرصين أخا الهدى بأن له الوفاء بعهده ودينه ومحبة النبي وآله، وبه فاز وخسر غيره، وتنتهي بمثل ما لا يكون فلا يكون بحيلة وما هو كائن سيكون."
  en: "After the heading \"and also of his\" come short lines in which al-Hadi addresses the man of firm mind, brother of guidance, saying he has fidelity to his covenant and his religion and love of the Prophet and his family, by which he succeeded while others lost, and ending on a proverb: what cannot be will not be by any contrivance, and what is to be will be."
  ur: "عنوان «اور اس کا یہ بھی» کے بعد مختصر اشعار آتے ہیں جن میں ہادی پختہ عقل والے، ہدایت کے بھائی کو مخاطب کرتا ہے کہ اس کے پاس اپنے عہد اور دین کی وفاداری اور نبی اور ان کی آل کی محبت ہے جس سے وہ کامیاب ہوا اور دوسرا گھاٹے میں رہا، اور خاتمہ ایک کہاوت پر ہوتا ہے: جو نہیں ہونا وہ کسی تدبیر سے نہیں ہو گا اور جو ہونا ہے وہ ہو کر رہے گا۔"
  es: "Tras el encabezado \"y también de él\" vienen unas líneas cortas en las que al-Hadi se dirige al hombre de mente firme, hermano de la guía, diciendo que tiene fidelidad a su pacto y a su religión, y amor por el Profeta y su familia, por lo cual triunfó mientras otros fracasaron, y termina con un proverbio: lo que no puede ser no será por ningún medio, y lo que ha de ser, será."
  fr: "Après le titre « et aussi de lui », viennent de courtes phrases dans lesquelles al-Hadi s'adresse à l'homme à l'esprit ferme, frère de la guidance, disant qu'il a la fidélité à son alliance et à sa religion et l'amour du Prophète et de sa famille, grâce auxquels il a réussi là où d'autres ont échoué, et terminant par un proverbe: ce qui ne peut être ne sera par aucun artifice, et ce qui doit être sera."
  tr: "\"Ve onun için de\" başlığından sonra, Hadidi'nin aklı başında olana, hidayet kardeşine hitap ettiği kısa ayetler gelir; bu ayetlerde onun, ahdine ve dinine bağlı kalma, Peygamberi ve ailesini sevme hakkına sahip olduğu, onun sayesinde kazandığı ve diğerlerinin kaybettiği belirtilir ve \"olmayan şey de aynı şekilde olacaktır, dolayısıyla hileyle olmayacak, olan da olacaktır\" sözleriyle sona erer."
  id: "Setelah judul “Dan untuknya juga” terdapat ayat-ayat pendek di mana Al-Hadi berbicara kepada orang yang berakal sehat, saudara yang mendapat petunjuk, bahwa ia berhak untuk memenuhi perjanjian dan agamanya serta mencintai Nabi dan keluarganya, dan melalui dia ia telah menang dan yang lain telah kalah, dan diakhiri dengan ungkapan “sesuatu yang tidak ada”, sehingga tidak akan terjadi dengan tipu daya, dan apa yang ada akan tetap ada."
