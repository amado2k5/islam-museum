id: "event/a-claimant-of-prophecy-is-taken-captive-at-radda-and-brought-to-asad-on-eid-al-fitr-324-ah"
class: event
kind: other
label:
  ar: "يؤخذ مدعي النبوة أسيرا في رداع ويؤتى به إلى أسعد يوم الفطر سنة 324هـ، ص409"
  en: "A claimant of prophecy is taken captive at Radda and brought to Asad on Eid al-Fitr 324 AH, p. 409"
  fr: "Un prétendant à la prophétie est capturé à Radda et amené à Asad le jour de l’Aïd al-Fitr 324 de l’hégire, p. 409"
  ur: "رداع میں نبوت کے دعویدار کو قید کر کے اسد کے پاس عید الفطر 324ھ میں لایا جاتا ہے، ص409"
  es: "Un supuesto profeta es hecho prisionero en Radda y llevado a Asad en Eid al-Fitr 324 AH, pág. 409"
  tr: "Sahte peygamber Rada'da esir alındı ve Hicri 324 yılında Ramazan Bayramı günü As'ad'a getirildi (s. 409)."
  id: "Nabi palsu itu ditawan di Rada' dan dibawa ke As'ad pada hari raya Idul Fitri tahun 324 H, hlm. 409"
summary:
  ar: "يبعث أسعد عساكره وقواده إلى رداع، فيأخذ الجند مدعي النبوة أسيرا من غير أمان، ويؤتى به إليه يوم الفطر سنة 324هـ فيحبسه."
  en: "Asad sends his commanders to Radda. They take the claimant of prophecy captive, without a pledge of safety, and bring him to Asad on Eid al-Fitr 324 AH, and Asad has him imprisoned."
  fr: "Asad envoie ses commandants à Radda. Ils capturent le prétendant à la prophétie, sans garantie de sécurité, et l’amènent à Asad le jour de l’Aïd al-Fitr 324 de l’hégire ; Asad le fait emprisonner."
  ur: "اسد اپنے لشکر اور سرداروں کو رداع بھیجتا ہے۔ وہ نبوت کے دعویدار کو بغیر امان کے قید کر لیتے ہیں اور عید الفطر 324ھ میں اسد کے پاس لاتے ہیں، جو اسے قید میں ڈال دیتا ہے۔"
  es: "Asad envía a sus comandantes a Radda. Capturan al que afirmaba tener la profecía, sin garantía de seguridad, y lo llevan ante Asad en Eid al-Fitr del año 324 AH, y Asad lo hace encarcelar."
  tr: "Esad, askerlerini ve komutanlarını Rada'ya gönderir ve askerler, peygamberlik iddiasında bulunan kişiyi hiçbir güvenlik garantisi olmaksızın esir alırlar ve onu Hicri 324 yılının Ramazan Bayramı günü Esad'ın yanına getirirler ve Esad onu hapse atar."
  id: "As’ad mengirimkan tentara dan komandannya ke Rada’a, dan para tentara menangkap orang yang mengaku sebagai nabi itu tanpa jaminan keselamatan, dan membawanya kepadanya pada hari raya Idul Fitri tahun 324 H, lalu memenjarakannya."
