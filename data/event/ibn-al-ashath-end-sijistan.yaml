id: event/ibn-al-ashath-end-sijistan
class: event
kind: revolt
label: { ar: "نهاية عبد الرحمن بن محمد بن الأشعث بسجستان", en: "Ibn al-Ash'ath's End at Sijistan" }
summary:
  ar: "خلع عبد الرحمن بن محمد بن الأشعث وخرج إلى سجستان مخالفاً لعبد الملك بن مروان والحجاج فهادن رتبيل وصار إليه ثم إن رتبيل أسلمه خوفاً من الحجاج وذلك أنه كتب إليه يتوعده فألقى نفسه من فوق جبل ويقال من فوق سطح وسقط معه الذي كان يحفظه وكان قد سلسل نفسه معه فمات فأتي الحجاج برأسه فصالح الحجاج رتبيل على أن لا يغزوه سبع سنين ويقال تسع سنين على أن يؤدي بعد ذلك في كل سنة تسعمائة ألف درهم عروضاً."
  en: "Abd al-Rahman ibn Muhammad ibn al-Ash'ath renounced obedience and fled to Sijistan against Abd al-Malik and al-Hajjaj, allying with Rutbil — who then surrendered him in fear of al-Hajjaj's threatening letter. He threw himself from a mountain-top, or a rooftop, chained to his keeper who fell with him, and died; his head went to al-Hajjaj, who truced Rutbil for seven — some say nine — years, thereafter nine hundred thousand dirhams yearly in 'urud."
