id: event/ibn-al-ashath-end-sijistan
class: event
kind: revolt
label: { ar: "نهاية عبد الرحمن بن محمد بن الأشعث بسجستان", en: "Ibn al-Ash'ath's End at Sijistan", es: "El final de Ibn al-Ash'ath en Sijistan", fr: "La fin d'Ibn al-Ash'ath à Sijistan", ur: "سجستان میں ابن اشعث کا خاتمہ", tr: "Abdülrahman ibn Muhammed ibn el-Eş'at'ın Sijistan'daki sonu.", id: "Akhir kisah Abd al-Rahman ibn Muhammad ibn al-Ash'ath di Sijistan" }
summary:
  ar: "خلع عبد الرحمن بن محمد بن الأشعث وخرج إلى سجستان مخالفاً لعبد الملك بن مروان والحجاج فهادن رتبيل وصار إليه ثم إن رتبيل أسلمه خوفاً من الحجاج وذلك أنه كتب إليه يتوعده فألقى نفسه من فوق جبل ويقال من فوق سطح وسقط معه الذي كان يحفظه وكان قد سلسل نفسه معه فمات فأتي الحجاج برأسه فصالح الحجاج رتبيل على أن لا يغزوه سبع سنين ويقال تسع سنين على أن يؤدي بعد ذلك في كل سنة تسعمائة ألف درهم عروضاً."
  en: "Abd al-Rahman ibn Muhammad ibn al-Ash'ath renounced obedience and fled to Sijistan against Abd al-Malik and al-Hajjaj, allying with Rutbil — who then surrendered him in fear of al-Hajjaj's threatening letter. He threw himself from a mountain-top, or a rooftop, chained to his keeper who fell with him, and died; his head went to al-Hajjaj, who truced Rutbil for seven — some say nine — years, thereafter nine hundred thousand dirhams yearly in 'urud."
  es: "Abd al-Rahman ibn Muhammad ibn al-Ash'ath renunció a la obediencia y huyó a Sijistan contra Abd al-Malik y al-Hajjaj, aliándose con Rutbil, quien lo entregó por temor a la carta amenazante de al-Hajjaj. Se arrojó desde la cima de una montaña o desde un tejado, encadenado a su guardián, quien cayó con él, y murió; su cabeza fue a parar a manos de al-Hajjaj, quien le concedió a Rutbil una tregua de siete años —algunos dicen nueve—, a cambio de novecientos mil dirhams anuales en 'urud."
  fr: "Abd al-Rahman ibn Muhammad ibn al-Ash'ath désobéit et s'enfuit au Sijistan contre Abd al-Malik et al-Hajjaj, s'alliant à Rutbil. Ce dernier, craignant la lettre de menaces d'al-Hajjaj, le livra. Il se jeta du haut d'une montagne ou d'un toit, enchaîné à son geôlier qui chuta avec lui, et mourut. Sa tête fut remise à al-Hajjaj, qui conclut une trêve avec Rutbil pour sept à neuf ans, puis lui versa par an neuf cent mille dirhams en 'urud."
  ur: "عبدالرحمٰن بن محمد بن الاشعث نے فرمانبرداری ترک کر دی اور عبد الملک اور الحجاج کے خلاف سجستان کی طرف بھاگا، رطبیل کے ساتھ اتحاد کیا - جس نے پھر الحجاج کے دھمکی آمیز خط کے خوف سے اسے ہتھیار ڈال دیا۔ اُس نے اپنے آپ کو پہاڑ کی چوٹی یا چھت سے زنجیروں میں جکڑ کر اپنے محافظ کے ساتھ پھینکا جو اُس کے ساتھ گرا، اور مر گیا۔ اس کا سر حجاج کے پاس گیا، جس نے رتبیل کو سات سال تک - بعض کہتے ہیں کہ نو - سال تک، اس کے بعد سالانہ نو لاکھ درہم 'ارد میں'۔"
  tr: "Abdülrahman ibn Muhammed ibn el-Eş'at görevden alındı ve Abdülmalik ibn Mervan ve Haccac'a karşı Sijistan'a gitti. Ratbil ile barıştı ve onun yanına gitti. Ancak Ratbil, Haccac'tan korkarak onu teslim etti, çünkü Haccac ona tehdit dolu bir mektup yazmıştı. Bunun üzerine Ratbil kendini bir dağın tepesinden, hatta bir çatının tepesinden attı ve onunla birlikte kendisini zincirlemiş olan muhafızı da düştü ve öldü. Bunun üzerine Haccac'a başı getirildi ve Haccac, Ratbil ile yedi yıl (ve hatta dokuz yıl) boyunca kendisine saldırmayacağı ve bundan sonra her yıl dokuz yüz bin dirhem değerinde mal ödeyeceği şartıyla barıştı."
  id: "Abd al-Rahman ibn Muhammad ibn al-Ash’ath digulingkan dan pergi ke Sijistan untuk melawan Abd al-Malik ibn Marwan dan al-Hajjaj. Ia berdamai dengan Ratbil dan pergi menemuinya. Kemudian Ratbil menyerahkannya karena takut kepada al-Hajjaj, karena ia telah menulis surat ancaman kepadanya. Maka ia melemparkan dirinya dari puncak gunung, dan ada juga yang mengatakan dari atas atap, dan bersamanya jatuh pula pengawalnya, yang telah dirantai bersamanya, dan ia meninggal. Maka al-Hajjaj menerima kepalanya, dan al-Hajjaj berdamai dengan Ratbil dengan syarat ia tidak akan menyerangnya selama tujuh tahun, dan ada juga yang mengatakan sembilan tahun, dengan syarat ia akan membayar setelah itu setiap tahun sebesar sembilan ratus ribu dirham dalam bentuk barang."
