summary:
  ar: "في طريق رجوع وفد بني عامر أصاب عامرَ بن الطفيل طاعون في عنقه فمات في بيت امرأة من بني سلول وهو يقول: أغدة كغدة البكر في بيت امرأة من بني سلول؛ يرويه ابن إسحاق بعد دعاء النبي: اللهم اكفني عامر بن الطفيل. وذكر ابن هشام رواية أخرى للفظه."
  en: "On the Banu Amir delegation's way home a plague-swelling struck Amir ibn al-Tufayl in the neck and he died in the house of a woman of Banu Salul, saying: a swelling like a young camel's, in the house of a Saluli woman. Ibn Ishaq places it after the Prophet's prayer 'O God, suffice me against Amir ibn al-Tufayl'; Ibn Hisham records another wording."
