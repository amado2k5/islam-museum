class: event
kind: declaration
label: { ar: "إلغاء الخلافة العثمانية", en: "Abolition of the Ottoman Caliphate", fr: "Abolition du califat ottoman", es: "Abolición del Califato Otomano", ur: "خلافت عثمانیہ کا خاتمہ", tr: "Osmanlı Halifeliğinin Kaldırılması", id: "Penghapusan Kekhalifahan Ottoman" }
summary:
  ar: "دعا مصطفى كمال الجمعية التأسيسية إلى اجتماع في ٣ آذار/مارس ١٩٢٤م وطرح عليها مشروع قرار بإلغاء الخلافة التي وصفها بأنها ورم من القرون الوسطى، فأجيز القرار الذي شمل نفي الخليفة عبد المجيد الثاني في اليوم التالي دون مناقشة، فانطفأت شعلة الخلافة التي كان المسلمون طيلة القرون يستمدون من بقائها رمز وحدتهم. ويذكر الصلابي أن معاهدة لوزان سنة ١٣٤٠هـ/١٩٢٣م قد فرضت على تركيا ما يعرف بشروط كرزون الأربع: قطع صلة تركيا بالإسلام، وإلغاء الخلافة إلغاءً تاماً، وإخراج الخليفة وأنصاره ومصادرة أمواله، واتخاذ دستور مدني. وعم الاستياء العالم الإسلامي فبكى أحمد شوقي الخلافة بعد أن كان قد مدح مصطفى كمال وقرنه بخالد بن الوليد {cite:dawlat-uthmaniyya-salabi p. 472-473}."
  en: "3 March 1924 — the Grand National Assembly abolished the caliphate without debate and exiled Abdülmecid II the next day, ending the institution Muslims had long read as the emblem of their unity {cite:dawlat-uthmaniyya-salabi p. 472-473}."
  fr: "3 mars 1924 : la Grande Assemblée nationale abolit le califat sans débat et exila Abdülmecid II le lendemain, mettant fin à l’institution que les musulmans avaient longtemps considérée comme l’emblème de leur unité {cite:dawlat-uthmaniyya-salabi p. 472-473}."
  es: "3 de marzo de 1924: la Gran Asamblea Nacional abolió el califato sin debate y exilió a Abdülmecid II al día siguiente, poniendo fin a la institución que los musulmanes habían considerado durante mucho tiempo como el emblema de su unidad {cite:dawlat-uthmaniyya-salabi p. 472-473}."
  ur: "3 مارچ 1924 - گرینڈ نیشنل اسمبلی نے بغیر کسی بحث کے خلافت کو ختم کر دیا اور اگلے ہی دن عبدالمصد دوم کو جلاوطن کر دیا، اس ادارے کو ختم کر دیا جسے مسلمانوں نے طویل عرصے سے اپنے اتحاد کے نشان کے طور پر پڑھا تھا۔ 472-473}۔"
  tr: "Mustafa Kemal, 3 Mart 1924'te Kurucu Meclis'i topladı ve ortaçağ tümörü olarak nitelendirdiği halifeliği ortadan kaldırmaya yönelik bir karar taslağı sundu. Halife II. Abdülmecid'in sürgününü de içeren karar, ertesi gün tartışılmadan kabul edildi. Böylece, Müslümanların yüzyıllardır birliklerinin sembolü olarak gördüğü halifeliğin ateşi söndürüldü. El-Sallabi, 1923 (1340 Hicri) Lozan Antlaşması'nın Türkiye'ye Curzon Dörtlüsü olarak bilinen şartları dayattığını belirtiyor: Türkiye'nin İslam ile bağlarını koparması, halifeliğin tamamen kaldırılması, halifenin ve destekçilerinin sınır dışı edilmesi ve mallarına el konulması ve laik bir anayasanın kabul edilmesi. Müslüman dünyasında hoşnutsuzluk yayıldı ve Ahmed Şevki, daha önce Mustafa Kemal'i övdükten ve onu Halid ibn el-Velid'e benzettikten sonra, halifeliğin kaybına ağıt yaktı. {cite:dawlat-uthmaniyya-salabi s. 472-473}"
  id: "Mustafa Kemal menyerukan pertemuan Majelis Konstituen pada tanggal 3 Maret 1924, dan mengajukan rancangan resolusi untuk menghapuskan Kekhalifahan, yang ia gambarkan sebagai tumor abad pertengahan. Resolusi tersebut, yang mencakup pengasingan Khalifah Abdulmejid II, disahkan pada hari berikutnya tanpa diskusi. Dengan demikian, api Kekhalifahan, yang kelangsungan hidupnya selama berabad-abad menjadi simbol persatuan umat Muslim, padam. Al-Sallabi mencatat bahwa Perjanjian Lausanne pada tahun 1923 (1340 H) memberlakukan kepada Turki apa yang kemudian dikenal sebagai Empat Syarat Curzon: memutuskan hubungan Turki dengan Islam, menghapuskan Kekhalifahan sepenuhnya, mengusir Khalifah dan para pendukungnya serta menyita asetnya, dan mengadopsi konstitusi sekuler. Ketidakpuasan menyebar ke seluruh dunia Muslim, dan Ahmed Shawqi menyesalkan hilangnya Kekhalifahan, setelah sebelumnya memuji Mustafa Kemal dan membandingkannya dengan Khalid ibn al-Walid. {cite:dawlat-utsmaniyya-salabi hal. 472-473}"
