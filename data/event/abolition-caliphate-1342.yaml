label: { ar: "إلغاء الخلافة العثمانية" }
summary:
  ar: "دعا مصطفى كمال الجمعية التأسيسية إلى اجتماع في ٣ آذار/مارس ١٩٢٤م وطرح عليها مشروع قرار بإلغاء الخلافة التي وصفها بأنها ورم من القرون الوسطى، فأجيز القرار الذي شمل نفي الخليفة عبد المجيد الثاني في اليوم التالي دون مناقشة، فانطفأت شعلة الخلافة التي كان المسلمون طيلة القرون يستمدون من بقائها رمز وحدتهم. ويذكر الصلابي أن معاهدة لوزان سنة ١٣٤٠هـ/١٩٢٣م قد فرضت على تركيا ما يعرف بشروط كرزون الأربع: قطع صلة تركيا بالإسلام، وإلغاء الخلافة إلغاءً تاماً، وإخراج الخليفة وأنصاره ومصادرة أمواله، واتخاذ دستور مدني. وعم الاستياء العالم الإسلامي فبكى أحمد شوقي الخلافة بعد أن كان قد مدح مصطفى كمال وقرنه بخالد بن الوليد {cite:dawlat-uthmaniyya-salabi p. 472-473}."
  en: "3 March 1924 — the Grand National Assembly abolished the caliphate without debate and exiled Abdülmecid II the next day, ending the institution Muslims had long read as the emblem of their unity {cite:dawlat-uthmaniyya-salabi p. 472-473}."
