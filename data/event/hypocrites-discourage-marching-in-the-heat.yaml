id: event/hypocrites-discourage-marching-in-the-heat
class: event
kind: other
label: { ar: "قول بعضهم: لا تنفروا في الحر", en: "Some say: do not march in the heat", es: "Algunos dicen: no marches con calor.", fr: "Certains disent: ne marchez pas par forte chaleur", ur: "بعض کہتے ہیں: گرمی میں مارچ نہ کرو" }
summary:
  ar: "قال قوم من «المنافقين» بحسب ابن إسحاق بعضهم لبعض: لا تنفروا في الحر؛ زهادة في الجهاد وشكاً في الحق وإرجافاً بالنبي، ويقول إن آيتين من سورة التوبة نزلتا فيهم."
  en: "Some of the 'hypocrites', in Ibn Ishaq's account, said to one another: do not march out in the heat — in disdain for the campaign, doubt of the truth and to demoralise the Prophet's side; he says two verses of Sura al-Tawba were revealed about them."
  es: "Según relata Ibn Ishaq, algunos de los \"hipócritas\" se decían unos a otros: \"No salgan a marchar con este calor\", mostrando desdén por la campaña, dudando de la verdad y para desmoralizar al bando del Profeta; dice que dos versículos de la Sura al-Tawba fueron revelados acerca de ellos."
  fr: "D'après le récit d'Ibn Ishaq, certains « hypocrites » se disaient entre eux: « Ne partez pas en campagne sous cette chaleur », par mépris pour la campagne, par doute de la vérité et pour démoraliser le camp du Prophète; il dit que deux versets de la sourate al-Tawba furent révélés à leur sujet."
  ur: "ابن اسحاق کے بیان میں بعض 'منافقوں' نے ایک دوسرے سے کہا: گرمی میں باہر نہ نکلو - مہم کی حقارت، سچائی پر شک اور پیغمبر کے حوصلے پست کرنے کے لیے۔ وہ کہتے ہیں کہ ان کے بارے میں سورہ توبہ کی دو آیات نازل ہوئیں۔"
