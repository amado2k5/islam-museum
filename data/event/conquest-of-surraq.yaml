label: { ar: "فتح سرق", en: "Conquest of Surraq", es: "Conquista de Surraq", fr: "Conquête de Surraq", ur: "سوراق کی فتح", tr: "Açtı ve çaldı", id: "Dibuka dan dicuri" }
summary:
  ar: "فتح أبو موسى سرق على مثل صلح رامهرمز ثم إنهم غدروا فوجه إليها حارثة بن بدر الغداني في جيش كثيف فلم يفتحها فلما قدم عبد الله بن عامر فتحها عنوة وقد كان حارثة ولي سرق بعد ذلك وفيه يقول أبو الأسود الدؤلي أحار بن بدر قد وليت إمارة فكن جرداً فيها تخون وتسرق فحظك من مال العراقين سرق فقال حارثة جزاك إله الناس خير جزائه فقد قلت معروفاً وأوصيت كافياً أمرت بجزم لو أمرت بغيره لألفيتني فيه لأمرك عاصياً."
  en: "Abu Musa took Surraq on Ramhurmuz's terms; they betrayed and Haritha ibn Badr's thick army failed to retake it — Abdallah ibn Amir took it by force, and Haritha governed it after. Abu al-Aswad satirized: 'Harith b. Badr, they gave you a charge — be a locust in it, betray and steal; your lot of the two Iraqs' wealth is Surraq' — and Haritha answered 'the God of folk repay you best — you spoke kindness and enjoined sufficiency; bid me decide and you would find me obedient — bid anything else, disobedient'."
  es: "Abu Musa tomó Surraq en los términos de Ramhurmuz; estos lo traicionaron y el numeroso ejército de Haritha ibn Badr no logró recuperarla. Abdallah ibn Amir la tomó por la fuerza, y Haritha la gobernó después. Abu al-Aswad satirizó: «Harith ibn Badr, te encomendaron una tarea: sé como una langosta, traiciona y roba; tu parte de la riqueza de los dos Irak es Surraq». Haritha respondió: «El Dios de la gente te recompensará mejor. Hablaste con bondad y ordenaste la suficiencia; pídeme que decida y me encontrarás obediente; cualquier otra cosa, desobediente»."
  fr: "Abou Moussa prit Surraq aux conditions de Ramhurmuz; ils trahirent et la puissante armée d'Haritha ibn Badr ne parvint pas à la reprendre. Abdallah ibn Amir s'en empara par la force, et Haritha la gouverna ensuite. Abou al-Aswad ironisa: « Haritha ibn Badr, on t'a donné un ordre: sois une sauterelle, trahis et vole; Surraq est ta part des richesses des deux Iraks. » Haritha répondit: « Que Dieu te récompense au mieux ! Tu as parlé avec bienveillance et enjoint la suffisance; donne-moi une décision et tu me trouveras obéissant; donne-moi une autre décision, et tu me trouveras désobéissant. »"
  ur: "ابو موسی نے رامہرمز کی شرائط پر سورق کو لیا؛ انہوں نے غداری کی اور حارثہ بن بدر کی موٹی فوج اسے واپس لینے میں ناکام رہی - عبداللہ ابن عامر نے اسے زبردستی لے لیا اور حارثہ نے اس کے بعد حکومت کی۔ ابو الاسود نے طنز کیا: حارث بن۔ بدر، انہوں نے آپ کو ایک الزام دیا تھا - اس میں ٹڈی بنو، خیانت کرو اور چوری کرو۔ آپ کی دو عراق کی دولت کا بہت حصہ سورق ہے - اور حارثہ نے جواب دیا 'لوک کا خدا آپ کو بہترین بدلہ دیتا ہے - آپ نے احسان کیا اور کفایت کا حکم دیا۔ مجھے فیصلہ کرنے کو کہو اور تم مجھے فرمانبردار پاؤ گے - اور کچھ بھی بولو، نافرمان''۔"
  tr: "Ebu Musa, Ramhormoz barış antlaşmasının şartlarına uygun olarak Sark'ı fethetti. Sonra ona ihanet ettiler, bu yüzden Haritha bin Badr el-Ghadani'yi büyük bir orduyla gönderdi, ancak o da şehri fethedemedi. Abdullah bin Amer geldiğinde ise şehri zorla fethetti. Bundan sonra Haritha Sark'ın valisi olarak atandı ve Ebu el-Esved el-Du'ali onun hakkında şöyle dedi: \"Ey Haritha bin Badr, vali olarak atandın, öyleyse acımasız ol, ihanet et ve çal, iki Irak'ın parasından payın çalındı.\" Haritha şöyle dedi: \"İnsanların Allah'ı seni en güzel şekilde ödüllendirsin, çünkü iyi bir şey söyledin ve yeterli tavsiye verdin. Bana kesin bir şey yapmamı emrettin, eğer başka bir şey emretmiş olsaydın, emrine itaatsiz olduğumu görürdün.\""
  id: "Abu Musa menaklukkan Sarq dengan syarat yang sama seperti perjanjian damai Ramhormoz. Kemudian mereka mengkhianatinya, sehingga ia mengirim Haritha bin Badr al-Ghadani dengan pasukan besar, tetapi ia tidak berhasil menaklukkannya. Ketika Abdullah bin Amer tiba, ia menaklukkannya dengan paksa. Haritha kemudian diangkat menjadi gubernur Sarq, dan Abu al-Aswad al-Du’ali berkata tentangnya: “Wahai Haritha bin Badr, engkau telah diangkat menjadi gubernur, maka bersikaplah tanpa ampun dalam menjalankan tugasmu, berkhianat dan mencuri, dan bagianmu dari uang kedua Irak telah dicuri.” Haritha berkata: “Semoga Tuhan manusia memberimu pahala yang terbaik, karena engkau telah mengatakan sesuatu yang baik dan memberikan nasihat yang cukup. Engkau memerintahkan aku untuk melakukan sesuatu yang menentukan, dan jika engkau memerintahkan aku untuk melakukan sesuatu yang lain, engkau akan mendapati aku tidak taat pada perintahmu.”"
