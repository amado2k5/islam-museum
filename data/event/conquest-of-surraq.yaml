id: event/conquest-of-surraq
class: event
kind: conquest
label: { ar: "فتح سرق", en: "Conquest of Surraq" }
summary:
  ar: "فتح أبو موسى سرق على مثل صلح رامهرمز ثم إنهم غدروا فوجه إليها حارثة بن بدر الغداني في جيش كثيف فلم يفتحها فلما قدم عبد الله بن عامر فتحها عنوة وقد كان حارثة ولي سرق بعد ذلك وفيه يقول أبو الأسود الدؤلي أحار بن بدر قد وليت إمارة فكن جرداً فيها تخون وتسرق فحظك من مال العراقين سرق فقال حارثة جزاك إله الناس خير جزائه فقد قلت معروفاً وأوصيت كافياً أمرت بجزم لو أمرت بغيره لألفيتني فيه لأمرك عاصياً."
  en: "Abu Musa took Surraq on Ramhurmuz's terms; they betrayed and Haritha ibn Badr's thick army failed to retake it — Abdallah ibn Amir took it by force, and Haritha governed it after. Abu al-Aswad satirized: 'Harith b. Badr, they gave you a charge — be a locust in it, betray and steal; your lot of the two Iraqs' wealth is Surraq' — and Haritha answered 'the God of folk repay you best — you spoke kindness and enjoined sufficiency; bid me decide and you would find me obedient — bid anything else, disobedient'."
