label:
  ar: "صعود علاف وسقوط النميص، رمضان 287هـ"
  en: "The ascent of Allaf and the fall of al-Numays, Ramadan 287 AH"
  ur: "علاف کی چڑھائی اور النمیص کا سقوط، رمضان 287ھ"
summary:
  ar: "أمر الهادي الهمدانيين أن يصعدوا الجبل فقُتل منهم رجل من خيوان، ثم صعد بالطبريين وأصحاب الرمي حتى استووا مع القوم برأس الجبل فطعن رجلاً وحملوا فهزموهم إلى النميص، فهُدمت القرية وأُحرقت، وأقبل أبو تراب بعسكره."
  en: "Al-Hadi ordered the Hamdanis up the mountain and a man of Khaywan was killed; he then climbed with the Tabaris and the archers until they were level with the enemy on the summit, thrust one man, and they charged and drove the enemy to al-Numays, whose village was pulled down and burned, and Abu Turab came up with his force."
  ur: "ہادی نے ہمدانیوں کو پہاڑ پر چڑھنے کا حکم دیا تو ان میں سے خیوان کا ایک آدمی مارا گیا؛ پھر وہ طبریوں اور تیر اندازوں کے ساتھ چڑھے یہاں تک کہ چوٹی پر دشمن کے برابر آ گئے، ایک آدمی کو برچھی ماری، اور سب نے حملہ کر کے انہیں النمیص تک بھگا دیا، بستی گرا کر جلا دی گئی، اور ابو تراب اپنے لشکر کے ساتھ آ پہنچے۔"
