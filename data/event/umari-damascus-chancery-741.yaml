id: event/umari-damascus-chancery-741
class: event
kind: other
label:
  ar: "ولاية ابن فضل الله كتابة السر بدمشق، محرم ٧٤١هـ/١٣٤٠م"
  en: "Al-Umari takes the Damascus chancery, Muharram 741/1340"
  ur: "عمری کا دمشق میں کاتبِ سر مقرر ہونا، محرم 741ھ/1340ء"
  es: "Al-Umari toma la cancillería de Damasco, Muharram 741/1340"
  fr: "Al-Umari prend la chancellerie de Damas, Muharram 741/1340"
  tr: "İbn Fadlallah'ın Şam'daki sekreterliğin sekreteri olarak valiliği, Hicri 741 Muharrem/Miladi 1340."
  id: "Masa pemerintahan Ibnu Fadlallah, sekretaris sekretariat di Damaskus, Muharram 741 H/1340 M"
summary:
  ar: "دخل شهاب الدين دمشق في المحرم سنة ٧٤١هـ فباشر كتابة السر بها عوضًا عن الشهاب يحيى بن القيسراني، وذلك بعد القبض على تنكز نائب الشام في ذي الحجة سنة ٧٤٠هـ {cite:durar-kamina-jil-1993 1/333} {cite:durar-kamina-jil-1993 1/520}."
  en: "Shihab al-Din entered Damascus in Muharram 741 (June-July 1340) and took charge of its chancery in place of Shihab Yahya ibn al-Qaysarani, in the reshuffle that followed the arrest of Tankiz, viceroy of Syria, in Dhu al-Hijja 740 {cite:durar-kamina-jil-1993 1/333} {cite:durar-kamina-jil-1993 1/520}."
  ur: "شہاب الدین محرم 741ھ ⁦(جون-جولائی 1340ء)⁩ میں دمشق داخل ہوا اور شہاب یحیی بن قیسارانی کی جگہ وہاں کاتبِ سر کا منصب سنبھالا؛ یہ شام کے نائب تنکز کی ذی الحجہ 740ھ میں گرفتاری کے بعد کے تبدیلیوں کا حصہ تھا {cite:durar-kamina-jil-1993 1/333} {cite:durar-kamina-jil-1993 1/520}۔"
  es: "Shihab al-Din entró en Damasco en Muharram 741 (junio-julio de 1340) y se hizo cargo de su cancillería en lugar de Shihab Yahya ibn al-Qaysarani, en la reorganización que siguió al arresto de Tankiz, virrey de Siria, en Dhu al-Hijja 740 {cite:durar-kamina-jil-1993 1/333} {cite:durar-kamina-jil-1993 1/520}."
  fr: "Shihab al-Din entra à Damas en Muharram 741 (juin-juillet 1340) et prit la charge de sa chancellerie à la place de Shihab Yahya ibn al-Qaysarani, lors du remaniement qui suivit l'arrestation de Tankiz, vice-roi de Syrie, en Dhu al-Hijja 740 {cite:durar-kamina-jil-1993 1/333} {cite:durar-kamina-jil-1993 1/520}."
  tr: "Şihab el-Din, Hicri 741 yılının Muharrem ayında Şam'a girdi ve Hicri 740 yılının Zilhicce ayında Suriye vekili Tankiz'in tutuklanmasının ardından Şihab Yahya ibn el-Kaysarani'nin yerine gizli metnin yazımını devraldı. {cite:durar-kamina-jil-1993 1/333} {cite:durar-kamina-jil-1993 1/520}"
  id: "Shihab al-Din memasuki Damaskus pada bulan Muharram tahun 741 H dan mengambil alih penulisan rahasia di sana menggantikan Shihab Yahya ibn al-Qaysarani, setelah penangkapan Tankiz, wakil Suriah, pada bulan Dzul Hijjah tahun 740 H."
