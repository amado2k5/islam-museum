id: event/testament-of-al-mansur-to-al-mahdi
class: event
kind: death
label:
  ar: وصية المنصور للمهدي قبل حجته الأخيرة ووفاته وقبره المخفي بمكة
  en: Testament of al-Mansur to al-Mahdi and his hidden grave at Mecca
  ur: منصور کی مہدی کو وصیت اور مکہ میں ان کی پوشیدہ قبر
  es: "Testamento de al-Mansur a al-Mahdi y su tumba oculta en La Meca."
summary:
  ar: "لما عزم المنصور على الحج سنة ثمان وخمسين ومئة أوصى ابنه المهدي بنفسه وأهل بيته والمسلمين، وحرّج عليه ألا يفتح خزائن المسلمين حتى يتحقق وفاته، وعهد إليه أن يقضي دينه وهو ثلاثمئة ألف دينار {cite:al-bidaya-wal-nihaya scan vol. 5 p. 511}. وقال إنه ولد في ذي الحجة ويظن أنه يموت فيه {cite:al-bidaya-wal-nihaya scan vol. 5 p. 512}. ومات بمكة في ذي الحجة وكتم الربيع الحاجب وفاته حتى أخذ البيعة للمهدي {cite:al-bidaya-wal-nihaya scan vol. 5 p. 506}، ودُفن عند باب المعلاة، وحفر الربيع مئة قبر ودفنه في غيرها فلا يُعرف قبره {cite:al-bidaya-wal-nihaya scan vol. 5 p. 513}."
  en: "When al-Mansur resolved on pilgrimage in the year 158 he charged his son al-Mahdi concerning himself, his family and the Muslims, forbade him to open the Muslims' treasuries until he was sure of his death, and told him to pay his debt of three hundred thousand dinars {cite:al-bidaya-wal-nihaya scan vol. 5 p. 511}. He said he had been born in Dhu al-Hijja and thought he would die in it {cite:al-bidaya-wal-nihaya scan vol. 5 p. 512}. He died at Mecca in Dhu al-Hijja and al-Rabi' the chamberlain concealed his death until he had taken the oath for al-Mahdi {cite:al-bidaya-wal-nihaya scan vol. 5 p. 506}; he was buried at Bab al-Mu'alla, and al-Rabi' dug a hundred graves and buried him in another, so his grave is not known {cite:al-bidaya-wal-nihaya scan vol. 5 p. 513}."
  ur: "جب منصور نے سن 158 ہجری میں حج کا ارادہ کیا تو بیٹے مہدی کو اپنی ذات، خاندان اور مسلمانوں کے بارے میں وصیت کی، منع کیا کہ ان کی موت کے یقین تک مسلمانوں کے خزانے کھولے، اور تین لاکھ دینار کا قرض ادا کرنے کی ہدایت کی {cite:al-bidaya-wal-nihaya scan vol. 5 p. 511}۔ کہا کہ وہ ذوالحجہ میں پیدا ہوئے اور انھیں لگتا ہے کہ اسی میں فوت ہوں گے {cite:al-bidaya-wal-nihaya scan vol. 5 p. 512}۔ وہ ذوالحجہ میں مکہ میں فوت ہوئے اور ربیع حاجب نے مہدی کی بیعت لینے تک موت چھپائے رکھی {cite:al-bidaya-wal-nihaya scan vol. 5 p. 506}؛ انھیں باب المعلاۃ پر دفن کیا گیا اور ربیع نے سو قبریں کھود کر انھیں کسی اور میں دفنایا، اس لیے ان کی قبر معلوم نہیں {cite:al-bidaya-wal-nihaya scan vol. 5 p. 513}۔"
  es: "Cuando al-Mansur decidió emprender la peregrinación en el año 158, encargó a su hijo al-Mahdi que se ocupara de sí mismo, de su familia y de los musulmanes, le prohibió abrir los tesoros de los musulmanes hasta que estuviera seguro de su muerte y le ordenó pagar su deuda de trescientos mil dinares {cite:al-bidaya-wal-nihaya scan vol. 5 p. 511}. Dijo que había nacido en Dhu al-Hijja y que pensaba que moriría allí {cite:al-bidaya-wal-nihaya scan vol. 5 p. 512}. Murió en La Meca en Dhu al-Hijja y al-Rabi', el chambelán, ocultó su muerte hasta que prestó juramento por al-Mahdi {cite:al-bidaya-wal-nihaya scan vol. 5 p. 506}; Fue enterrado en Bab al-Mu'alla, y al-Rabi' cavó cien tumbas y lo enterró en otra, por lo que no se conoce su tumba {cite:al-bidaya-wal-nihaya scan vol. 5 p. 513}."
