label:
  ar: "مسير بني عبد المدان ويأم والأحلاف إلى ميناس وقتال الدربين، ص282-283"
  en: "The march of Banu Abd al-Madan, Yam and al-Ahlaf on Minas and the fight at the two gates, pp. 282-283"
  ur: "بنو عبد المدان، یام اور احلاف کی میناس پر چڑھائی اور دو دروازوں کی لڑائی، ص282-283"
summary:
  ar: "بعد يومين تعلم بنو عبد المدان بصيرورة أبي جعفر إلى ابن بسطام فيسيرون إلى ميناس بقيادة ربيع بن أبي الركود وعلي بن ربيع ومعهم اليأميون والأحلاف، فيقف أبو جعفر على الدرب الشرقي وابن بسطام وبنو ربيعة على الدرب الغربي، ويشتد القتال حتى العشاء."
  en: "Two days later Banu Abd al-Madan learn that Abu Ja'far has gone to Ibn Bustam and march on Minas, led by Rabi' ibn Abi al-Rukud and Ali ibn Rabi' with the Yamis and al-Ahlaf; Abu Ja'far holds the east gate, Ibn Bustam and Banu Rabi'a the west, and the fight is hard until evening."
  ur: "دو دن بعد بنو عبد المدان کو معلوم ہوا کہ ابو جعفر ابن بسطام کے پاس چلے گئے تو وہ ربیع بن ابی الرکود اور علی بن ربیع کی قیادت میں یام اور احلاف کے ساتھ میناس پر چڑھے؛ ابو جعفر مشرقی دروازے پر اور ابن بسطام اور بنو ربیعہ مغربی پر رہے اور شام تک سخت لڑائی ہوئی۔"
