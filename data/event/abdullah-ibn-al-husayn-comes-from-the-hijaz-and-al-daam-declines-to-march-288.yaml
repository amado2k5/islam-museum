id: event/abdullah-ibn-al-husayn-comes-from-the-hijaz-and-al-daam-declines-to-march-288
class: event
kind: other
label:
  ar: "عبد الله بن الحسين يقدم من الحجاز والدعام يعتذر عن الخروج، سنة 288هـ"
  en: "Abdullah ibn al-Husayn comes from the Hijaz and al-Da'am excuses himself from marching, 288 AH"
  ur: "عبد اللہ بن حسین حجاز سے آتے ہیں اور دعام نکلنے سے معذرت کرتا ہے، 288ھ"
summary:
  ar: "جاء أبو العتاهية بعسكر من همدان فسار الهادي إلى مدر وأقام بها أياماً، ثم قدم عليه أخوه عبد الله بن الحسين في نحو ثمانين رجلاً من مضر ومعه نفر من العلويين من الحجاز، وصيّر حرمه بصعدة، فأمره الهادي أن يلقى الدعام ويسأله النصرة على بني طريف، فاعتل الدعام في خروجه وأخلف ما وعد."
  en: "Abu al-Atahiya came with an army of Hamdan and al-Hadi went on to Madar and stayed some days; his brother Abdullah ibn al-Husayn then came to him with about eighty men of Mudar and some Alids from the Hijaz, leaving his women at Sa'da, and al-Hadi told him to meet al-Da'am and ask his help against Banu Tarif, but al-Da'am excused himself from marching and went back on what he had promised."
  ur: "ابو العتاہیہ ہمدان کے ایک لشکر کے ساتھ آئے تو ہادی مدر گئے اور کئی دن ٹھہرے؛ پھر ان کے بھائی عبد اللہ بن حسین مضر کے قریباً اسّی آدمیوں اور حجاز کے کچھ علویوں کے ساتھ ان کے پاس آئے اور اپنی خواتین کو صعدہ میں رکھا، اور ہادی نے انہیں کہا کہ دعام سے مل کر بنو طریف کے خلاف مدد مانگیں، مگر دعام نے نکلنے سے معذرت کی اور وعدہ توڑ دیا۔"
