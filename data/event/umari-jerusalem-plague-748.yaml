  ur: "طاعون اور قدس کی طرف روانگی، تقریباً 748ھ/1348ء"
  es: "La peste y la huida a Jerusalén, c. 748/1348"
  fr: "La peste et la fuite vers Jérusalem, vers 748/1348"
  tr: "Veba ve Kudüs'e yolculuk, yaklaşık 748 Hicri/1348 Miladi."
  id: "Wabah penyakit dan perjalanan ke Yerusalem, sekitar tahun 748 H/1348 M"
summary:
  ar: "فلما وقع الطاعون عزم ابن فضل الله على الحج، ثم توجه بأهله إلى القدس، فماتت امرأته فدفنها ورجع {cite:durar-kamina-jil-1993 1/333}."
  en: "When the plague struck, Ibn Fadl Allah resolved on the hajj, then took his household to Jerusalem; his wife died there and he buried her and returned {cite:durar-kamina-jil-1993 1/333}."
  ur: "جب طاعون پھوٹا تو ابن فضل اللہ نے حج کا ارادہ کیا، پھر وہ اپنے گھر والوں کو لے کر قدس گیا؛ وہاں اس کی بیوی فوت ہوئی، اس نے اسے دفن کیا اور لوٹ آیا {cite:durar-kamina-jil-1993 1/333}۔"
  es: "Cuando la peste azotó, Ibn Fadl Allah decidió realizar el Hajj, luego llevó a su familia a Jerusalén; su esposa murió allí y él la enterró y regresó {cite:durar-kamina-jil-1993 1/333}."
  fr: "Lorsque la peste frappa, Ibn Fadl Allah résolut le hajj, puis emmena sa famille à Jérusalem; sa femme mourut là-bas et il l'enterra et retourna {cite:durar-kamina-jil-1993 1/333}."
  tr: "Veba salgını baş gösterince İbn Fadlallah Hac ibadetini yerine getirmeye karar verdi. Ardından ailesiyle birlikte Kudüs'e gitti, orada karısı vefat edince onu defnetti ve geri döndü. {cite:durar-kamina-jil-1993 1/333}"
  id: "Ketika wabah penyakit merebak, Ibnu Fadlallah bertekad untuk melaksanakan ibadah haji. Ia kemudian berangkat bersama keluarganya ke Yerusalem, di mana istrinya meninggal dunia, sehingga ia menguburkannya dan kembali. {cite:durar-kamina-jil-1993 1/333}"
