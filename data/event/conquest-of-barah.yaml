summary:
  ar: "عند البلاذري: بالمغرب أرض تعرف بالأرض الكبيرة بينها وبين برقة مسيرة خمسة عشر يوماً أو أقل من ذلك قليلاً أو أكثر قليلاً وبها مدينة على شاطئ البحر تدعى بارة وكان أهلها نصارى وليسوا بروم غزاها جبلة مولى الأغلب فلم يقدر عليها ثم غزاها خلفون البربري ويُقال إنه مولى لربيعة ففتحها في أول خلافة المتوكل على الله."
  en: "In al-Baladhuri: in the Maghreb lies a land known as the Great Land, fifteen days' march from Barqa — or a little less or more — with a sea-shore city called Barah whose people were Christians though not Romans; Jabala, al-Aghlab's mawla, raided it but could not take it, then Khalafun al-Barbari — said to be a mawla of Rabi'a — raided it and opened it at the start of al-Mutawakkil's caliphate."
