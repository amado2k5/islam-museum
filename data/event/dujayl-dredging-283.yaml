  en: "In Rajab 283 al-Mu'tadid ordered the Dujayl canal dredged and cleared of a rock blocking its mouth; four thousand dinars were levied from the iqta' holders and estate owners for the work {cite:muntazam-ibn-al-jawzi p. 163}."
  es: "En Rajab 283, al-Mu'tadid ordenó dragar el canal Dujayl y limpiarlo de una roca que bloqueaba su desembocadura; se cobraron cuatro mil dinares a los titulares de iqta' y propietarios de fincas por el trabajo {cite:muntazam-ibn-al-jawzi p. 163}."
  fr: "En Rajab 283, al-Mu'tadid ordonna que le canal de Dujayl soit dragué et dégagé d'un rocher bloquant son embouchure; quatre mille dinars furent prélevés auprès des détenteurs d'iqta' et des propriétaires fonciers pour les travaux {cite:muntazam-ibn-al-jawzi p. 163}."
