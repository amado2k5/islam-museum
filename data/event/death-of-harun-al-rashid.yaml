summary:
  ar: "مات الرشيد في الغزو بطوس من خراسان ودفن بها في ثالث جمادى الآخرة سنة ثلاث وتسعين ومئة وله خمس وأربعون سنة وصلى عليه ابنه صالح، وقيل إن الرشيد رأى مناماً أنه يموت بطوس فبكى وقال احفروا لي قبراً فحفر له ثم حمل في قبة على جمل وسيق به حتى نظر إلى القبر فقال يا بن آدم تصير إلى هذا وأمر قوماً فنزلوا فختموا فيه ختمة وهو في محفة على شفير القبر، وقيل غلط جبرئيل بن بختيشوع في علته فكان سبب منيته، وقال الصولي خلف الرشيد مئة ألف ألف دينار ومن الأثاث والجواهر والورق والدواب ما قيمته مئة ألف ألف دينار وخمسة وعشرون ألف دينار {cite:tarikh-khulafa-minhaj-1434 p. 471}."
  en: "Al-Rashid died on campaign at Tus in Khurasan and was buried there on 3 Jumada II 193, aged forty-five; his son Salih prayed over him. Some say he had dreamt he would die at Tus — he wept, ordered a grave dug, was borne to it in a camel-litter, looked at it saying 'son of Adam, to this you come', and had men go down and complete a recitation of the Qur'an within while he lay in his litter at its edge. Others say Jibril ibn Bakhtishu' erred in his treatment and caused his death. Per al-Suli he left a hundred million dinars, and furnishings, jewels, silver-work and mounts worth a hundred and twenty-five million more {cite:tarikh-khulafa-minhaj-1434 p. 471}."
  es: "Al-Rashid murió en campaña en Tus, en Jorasán, y fue enterrado allí el 3 de Jumada II de 193, a la edad de cuarenta y cinco años; su hijo Salih oró por él. Algunos dicen que soñó que moriría en Tus: lloró, mandó cavar una tumba, fue llevado a ella en una litera de camello, la miró diciendo «hijo de Adán, a esto vienes», e hizo que unos hombres bajaran y completaran una recitación del Corán en su interior mientras él yacía en su litera al borde de la tumba. Otros dicen que Jibril ibn Bakhtishu' se equivocó en su trato y causó su muerte. Según al-Suli, dejó cien millones de dinares, y muebles, joyas, orfebrería y monturas por valor de ciento veinticinco millones más {cite:tarikh-khulafa-minhaj-1434 p. 471}."
  fr: "Al-Rashid mourut en campagne à Tus, au Khorasan, et y fut enterré le 3 Jumada II 193, à l'âge de quarante-cinq ans; son fils Salih pria sur lui. Certains disent qu'il avait rêvé qu'il mourrait à Tus; il pleura, ordonna qu'on creuse une tombe, y fut transporté dans une litière tirée par un chameau, la contempla en disant: « Fils d'Adam, c'est ici que tu viens », et fit descendre des hommes pour achever la récitation du Coran à l'intérieur, tandis qu'il reposait dans sa litière au bord de la tombe. D'autres disent que Jibril ibn Bakhtishu' se trompa dans son traitement et causa sa mort. Selon al-Suli, il laissa cent millions de dinars, ainsi que des meubles, des bijoux, des objets en argent et des montures d'une valeur de cent vingt-cinq millions de dinars supplémentaires (cite: Tarikh-Khulafa-Minhaj-1434, p. 471)."
  ur: "الرشید کا انتقال طوس کے مقام پر خراسان میں ہوا اور وہیں 3 جمادی الثانی 193 کو پینتالیس سال کی عمر میں دفن ہوئے۔ ان کے بیٹے صالح نے ان پر نماز پڑھی۔ بعض کہتے ہیں کہ اس نے خواب میں دیکھا تھا کہ وہ طوس میں مرے گا - وہ رویا، ایک قبر کھودینے کا حکم دیا، اسے اونٹ کے کوڑے میں لایا گیا، اسے دیکھ کر کہا کہ ابن آدم، تم اس کے لیے آؤ، اور لوگوں کو نیچے جاکر قرآن کی تلاوت مکمل کروائی جب کہ وہ اس کے کنارے پر لیٹ گیا تھا۔ دوسرے کہتے ہیں کہ جبریل بن بختشو نے اپنے علاج میں غلطی کی اور اس کی موت کا سبب بنی۔ فی السولی اس نے ایک سو ملین دینار، اور سامان، زیورات، چاندی کا کام اور ایک سو پچیس ملین کی قیمتی سامان چھوڑا۔ 471}۔"
  tr: "Raşid, Horasan'daki Tus şehrinin fethi sırasında öldü ve Hicri 193 yılında Cemâde-i Ahiret'in üçüncü günü, kırk beş yaşında orada defnedildi. Oğlu Salih cenaze namazını kıldırdı. Rivayetlere göre Raşid, Tus'ta öleceğini rüyasında görmüş, ağlayarak, \"Bana bir mezar kazın\" demiş. Bunun üzerine ona bir mezar kazılmış ve bir devenin üzerinde bir sedyeyle taşınarak mezarı görene kadar götürülmüş. \"Ey Âdemoğlu, sen bu yerde son bulacaksın\" demiş. Mezarın kenarında bir sedyede yatarken bazı kişilere Kur'an okumalarını emretmiş. Rivayetlere göre Cebrail ibn Baktişu hastalığı konusunda yanılmış ve bu da ölümüne sebep olmuş. Suli, Raşid'in geride yüz milyon dinar, mobilya, mücevher, kağıt ve yüz milyon yirmi beş bin dinar değerinde hayvan bıraktığını söylemiştir. {cite:tarikh-khulafa-minhaj-1434 s. 471}"
  id: "Al-Rashid wafat saat penaklukan Tus di Khorasan dan dimakamkan di sana pada tanggal 3 Jumada al-Akhirah tahun 193 Hijriah, pada usia empat puluh lima tahun. Putranya, Salih, memimpin salat jenazah. Dikatakan bahwa al-Rashid bermimpi akan meninggal di Tus, sehingga ia menangis dan berkata, “Gali kuburan untukku.” Maka sebuah kuburan digali untuknya, dan ia diarak di atas unta dengan kanopi hingga ia melihat kuburan tersebut. Ia berkata, “Wahai anak Adam, engkau akan berakhir di tempat ini.” Ia memerintahkan beberapa orang untuk turun dan menyelesaikan pembacaan Al-Quran sementara ia berada di tandu di tepi kuburan. Dikatakan bahwa Jibril bin Bakhtishu keliru mengenai penyakitnya, dan inilah penyebab kematiannya. Al-Suli mengatakan bahwa al-Rashid meninggalkan seratus juta dinar, serta perabotan, perhiasan, kertas, dan hewan senilai seratus juta dua puluh lima ribu dinar. {kutip:tarikh-khulafa-minhaj-1434 hal. 471}"
