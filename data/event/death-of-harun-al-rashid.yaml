label: { ar: "وفاة هارون الرشيد بطوس", en: "Death of Harun al-Rashid at Tus" }
summary:
  ar: "مات الرشيد في الغزو بطوس من خراسان ودفن بها في ثالث جمادى الآخرة سنة ثلاث وتسعين ومئة وله خمس وأربعون سنة وصلى عليه ابنه صالح، وقيل إن الرشيد رأى مناماً أنه يموت بطوس فبكى وقال احفروا لي قبراً فحفر له ثم حمل في قبة على جمل وسيق به حتى نظر إلى القبر فقال يا بن آدم تصير إلى هذا وأمر قوماً فنزلوا فختموا فيه ختمة وهو في محفة على شفير القبر، وقيل غلط جبرئيل بن بختيشوع في علته فكان سبب منيته، وقال الصولي خلف الرشيد مئة ألف ألف دينار ومن الأثاث والجواهر والورق والدواب ما قيمته مئة ألف ألف دينار وخمسة وعشرون ألف دينار {cite:tarikh-khulafa-minhaj-1434 p. 471}."
  en: "Al-Rashid died on campaign at Tus in Khurasan and was buried there on 3 Jumada II 193, aged forty-five; his son Salih prayed over him. Some say he had dreamt he would die at Tus — he wept, ordered a grave dug, was borne to it in a camel-litter, looked at it saying 'son of Adam, to this you come', and had men go down and complete a recitation of the Qur'an within while he lay in his litter at its edge. Others say Jibril ibn Bakhtishu' erred in his treatment and caused his death. Per al-Suli he left a hundred million dinars, and furnishings, jewels, silver-work and mounts worth a hundred and twenty-five million more {cite:tarikh-khulafa-minhaj-1434 p. 471}."
