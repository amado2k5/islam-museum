label: { ar: "رؤيا النبي في السوارين من ذهب وتأويلهما بالكذابين", en: "The Prophet's dream of the two gold bracelets, interpreted as the two liars" }
summary:
  ar: "خطب النبي الناس على منبره فقال إنه رأى ليلة القدر ثم أُنسيها، ورأى في ذراعيه سوارين من ذهب فكرههما فنفخهما فطارا، فأوّلهما بالكذابين صاحب اليمن وصاحب اليمامة، أي الأسود العنسي ومسيلمة؛ يرويه ابن إسحاق عن يزيد بن عبد الله بن قسيط عن عطاء بن يسار أو أخيه سليمان عن أبي سعيد الخدري. ويروي عن أبي هريرة أن الساعة لا تقوم حتى يخرج ثلاثون دجالاً كلهم يدعي النبوة."
  en: "The Prophet addressed the people from his minbar saying he had seen the Night of Power and then been made to forget it, and had seen on his arms two gold bracelets which he disliked and blew away, interpreting them as the two liars, the man of Yemen and the man of al-Yamama, that is al-Aswad al-Ansi and Musaylima; Ibn Ishaq has it from Yazid ibn Abdullah ibn Qusayt from Ata' ibn Yasar or his brother Sulayman from Abu Sa'id al-Khudri. He also reports from Abu Hurayra that the Hour will not come until thirty impostors appear, each claiming prophethood."
