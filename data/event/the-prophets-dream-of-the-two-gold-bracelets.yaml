label: { ar: "رؤيا النبي في السوارين من ذهب وتأويلهما بالكذابين", en: "The Prophet's dream of the two gold bracelets, interpreted as the two liars", es: "El sueño del Profeta de los dos brazaletes de oro, interpretado como los dos mentirosos.", fr: "Le rêve du Prophète des deux bracelets en or, interprété comme les deux menteurs", ur: "سونے کے دو کنگن والے نبی کے خواب کی تعبیر دو جھوٹوں نے کی۔", tr: "Peygamberin iki altın bilezikle ilgili görümü ve bunların yalancı olarak yorumlanması", id: "Penglihatan Nabi tentang dua gelang emas dan penafsirannya sebagai kebohongan" }
summary:
  ar: "خطب النبي الناس على منبره فقال إنه رأى ليلة القدر ثم أُنسيها، ورأى في ذراعيه سوارين من ذهب فكرههما فنفخهما فطارا، فأوّلهما بالكذابين صاحب اليمن وصاحب اليمامة، أي الأسود العنسي ومسيلمة؛ يرويه ابن إسحاق عن يزيد بن عبد الله بن قسيط عن عطاء بن يسار أو أخيه سليمان عن أبي سعيد الخدري. ويروي عن أبي هريرة أن الساعة لا تقوم حتى يخرج ثلاثون دجالاً كلهم يدعي النبوة."
  en: "The Prophet addressed the people from his minbar saying he had seen the Night of Power and then been made to forget it, and had seen on his arms two gold bracelets which he disliked and blew away, interpreting them as the two liars, the man of Yemen and the man of al-Yamama, that is al-Aswad al-Ansi and Musaylima; Ibn Ishaq has it from Yazid ibn Abdullah ibn Qusayt from Ata' ibn Yasar or his brother Sulayman from Abu Sa'id al-Khudri. He also reports from Abu Hurayra that the Hour will not come until thirty impostors appear, each claiming prophethood."
  es: "El Profeta se dirigió a la gente desde su minbar diciendo que había visto la Noche del Destino y luego la había olvidado, y que había visto en sus brazos dos brazaletes de oro que le disgustaron y sopló, interpretándolos como los dos mentirosos, el hombre de Yemen y el hombre de al-Yamama, es decir, al-Aswad al-Ansi y Musaylima; Ibn Ishaq lo tiene de Yazid ibn Abdullah ibn Qusayt de Ata' ibn Yasar o su hermano Sulayman de Abu Sa'id al-Khudri. También relata de Abu Hurayra que la Hora no llegará hasta que aparezcan treinta impostores, cada uno afirmando ser profeta."
  fr: "Le Prophète s'adressa au peuple du haut de son minbar, disant avoir vu la Nuit du Destin, puis l'avoir oubliée. Il avait aperçu à ses bras deux bracelets d'or qui lui déplaisaient et qu'il avait soufflés au loin, les interprétant comme les deux menteurs, l'homme du Yémen et l'homme d'al-Yamama, c'est-à-dire al-Aswad al-Ansi et Musaylima. Ibn Ishaq tient ce récit de Yazid ibn Abdullah ibn Qusayt, qui le tient d'Ata' ibn Yasar ou de son frère Sulayman, qui le tient d'Abu Sa'id al-Khudri. Il rapporte également d'Abu Hurayra que l'Heure ne viendra pas avant l'apparition de trente imposteurs, chacun prétendant être prophète."
  ur: "نبی نے اپنے منبر سے لوگوں کو مخاطب کرتے ہوئے فرمایا کہ میں نے شب قدر دیکھی ہے اور پھر اسے بھلا دیا گیا ہے، اور اپنے بازوؤں پر سونے کے دو کنگن دیکھے ہیں جو آپ نے ناپسندیدہ تھے اور اڑا دیے، ان کو دو جھوٹے آدمی یمن اور آدمی یمامہ سے تعبیر کیا، یعنی اسود الانسی اور مسیلمہ۔ ابن اسحاق نے اسے یزید بن عبداللہ بن قصیت سے عطاء بن یسار سے یا ان کے بھائی سلیمان نے ابو سعید خدری سے۔ وہ ابو ہریرہ سے یہ بھی روایت کرتے ہیں کہ قیامت اس وقت تک نہیں آئے گی جب تک کہ تیس دغاباز ظاہر نہ ہوں جن میں سے ہر ایک نبوت کا دعویٰ کرتا ہے۔"
  tr: "Peygamberimiz minberden insanlara hitap ederek, Kadir Gecesi'ni gördüğünü, ancak sonra bunu unutturulduğunu söyledi. Ayrıca kollarında iki altın bilezik gördüğünü, bunlardan hoşlanmadığını, bu yüzden onlara üflediğini ve uçup gittiklerini belirtti. Bunları, Yemenli ve Yemenli iki yalancıya, yani el-Esved el-Ensi ve Musaylime'ye işaret olarak yorumladı. Bu hadis, İbn İshak tarafından Yezid ibn Abdullah ibn Kusayt'tan, o da Ata ibn Yasar veya kardeşi Süleyman'dan, o da Ebu Sa'id el-Hudri'den rivayet edilmiştir. Ayrıca Ebu Hurayra'dan, otuz sahte peygamber ortaya çıkmadan kıyametin kopmayacağı ve hepsinin peygamberlik iddiasında bulunacağı rivayet edilmiştir."
  id: "Nabi Muhammad SAW berpidato di mimbar, mengatakan bahwa beliau telah melihat Malam Lailatul Qadr tetapi kemudian dilupakan. Beliau juga melihat dua gelang emas di lengannya, yang tidak disukainya, lalu beliau meniupnya dan gelang itu terbang. Beliau menafsirkan hal ini sebagai merujuk kepada dua pendusta, yang satu dari Yaman dan yang satu dari Yamamah, yaitu al-Aswad al-Ansi dan Musaylimah. Hal ini diriwayatkan oleh Ibnu Ishaq dari Yazid ibn Abdullah ibn Qusayt, dari Ata ibn Yasar atau saudaranya Sulaiman, dari Abu Sa'id al-Khudri. Diriwayatkan juga dari Abu Hurayrah bahwa Hari Kiamat tidak akan datang sampai muncul tiga puluh nabi palsu, yang semuanya akan mengaku sebagai nabi."
