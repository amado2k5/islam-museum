label: { ar: "هلاك مصقلة بطبرستان", en: "Masmala's Destruction in Tabaristan" }
summary:
  ar: "ولّى معاوية مصقلة بن هبيرة بن شبل أحد بني ثعلبة بن شيبان طبرستان وجميع أهلها حرب وضم إليه عشرة آلاف ويقال عشرون ألفاً فكاده العدو وأراه الهيبة حتى توغل بمن معه في البلاد فلما جاوزوا المضايق أخذها العدو عليهم ودهدهوا الصخور من الجبال على رؤوسهم فهلك ذلك الجيش أجمع وهلك مصقلة فضرب الناس به المثل فقالوا حتى يرجع مصقلة من طبرستان."
  en: "Mu'awiya made Masmala ibn Hubayra ibn Shabal of Tha'laba ibn Shayban governor of Tabaristan — all its people war — reinforced with ten, some say twenty, thousand; the enemy tricked him, showing dread till he drove deep into the land, then seized the narrows and rolled the mountains' rocks onto their heads — the whole army perished and Masmala with it, and the people made him a proverb: 'till Masmala returns from Tabaristan'."
