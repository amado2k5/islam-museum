label: { ar: "هلاك مصقلة بطبرستان", en: "Masmala's Destruction in Tabaristan", es: "La destrucción de Masmala en Tabaristán", fr: "Destruction de Masmala au Tabaristan", ur: "طبرستان میں مسمالہ کی تباہی", tr: "Taberistan'da Masqala'nın yıkılması", id: "Penghancuran Masqala di Tabaristan" }
summary:
  ar: "ولّى معاوية مصقلة بن هبيرة بن شبل أحد بني ثعلبة بن شيبان طبرستان وجميع أهلها حرب وضم إليه عشرة آلاف ويقال عشرون ألفاً فكاده العدو وأراه الهيبة حتى توغل بمن معه في البلاد فلما جاوزوا المضايق أخذها العدو عليهم ودهدهوا الصخور من الجبال على رؤوسهم فهلك ذلك الجيش أجمع وهلك مصقلة فضرب الناس به المثل فقالوا حتى يرجع مصقلة من طبرستان."
  en: "Mu'awiya made Masmala ibn Hubayra ibn Shabal of Tha'laba ibn Shayban governor of Tabaristan — all its people war — reinforced with ten, some say twenty, thousand; the enemy tricked him, showing dread till he drove deep into the land, then seized the narrows and rolled the mountains' rocks onto their heads — the whole army perished and Masmala with it, and the people made him a proverb: 'till Masmala returns from Tabaristan'."
  es: "Mu'awiya nombró a Masmala ibn Hubayra ibn Shabal de Tha'laba ibn Shayban gobernador de Tabaristán —todo su pueblo en guerra— reforzado con diez, algunos dicen veinte, mil hombres; el enemigo lo engañó, mostrando temor hasta que se adentró profundamente en el territorio, luego tomó los desfiladeros y volcó las rocas de las montañas sobre sus cabezas —todo el ejército pereció y Masmala con él, y el pueblo le hizo un proverbio: 'hasta que Masmala regrese de Tabaristán'."
  fr: "Mu'awiya nomma Masmala ibn Hubayra ibn Shabal de Tha'laba ibn Shayban gouverneur du Tabaristan — tout son peuple était en guerre — renforcé par dix, voire vingt mille hommes; l'ennemi le trompa, feignant la terreur jusqu'à ce qu'il pénètre profondément dans le pays, puis s'empara du détroit et fit rouler les rochers des montagnes sur leurs têtes — toute l'armée périt, et Masmala avec elle, et le peuple fit de lui un proverbe: « jusqu'à ce que Masmala revienne du Tabaristan »."
  ur: "معاویہ نے ثعلبہ ابن شیبان کے مسمالہ بن ہبیرہ بن شبل کو طبرستان کا گورنر بنایا - اس کے تمام لوگ جنگجو تھے - دس کے ساتھ مضبوط ہوئے، کچھ کہتے ہیں کہ بیس، ہزار؛ دشمن نے اسے دھوکہ دیا، خوف ظاہر کیا یہاں تک کہ وہ زمین کی گہرائی میں چلا گیا، پھر تنگ جگہوں پر قبضہ کر لیا اور پہاڑوں کی چٹانیں اپنے سروں پر لڑھک گئیں - تمام لشکر ہلاک ہو گیا اور اس کے ساتھ مسملہ بھی، اور لوگوں نے اسے کہاوت بنا دیا: 'جب تک مسمالہ طبرستان سے واپس نہیں آ جاتا'۔"
  tr: "Muaviye, Beni Tha'laba bin Şeyban kabilesinden Muskala bin Hubayra bin Şibl'i Taberistan ve tüm halkının valisi olarak atadı. Ona on bin, hatta yirmi bin kişi katıldı. Düşman ona karşı komplo kurdu ve onu korkuttu, ta ki o ve yanındakiler ülkenin derinliklerine kadar ilerleyene kadar. Dar geçitlerden geçerken düşman onları yakaladı ve dağlardan başlarına taşlar yuvarladı, böylece tüm ordu ve Muskala da öldü. Halk onu ibretlik yaptı ve \"Muskala Taberistan'dan dönene kadar\" dedi."
  id: "Muawiyah mengangkat Musqala bin Hubayra bin Shibl, salah seorang dari Bani Tha’laba bin Shayban, sebagai gubernur Tabaristan dan seluruh penduduknya. Ia membawa serta sepuluh ribu, atau konon dua puluh ribu orang. Musuh bersekongkol melawannya dan menakut-nakutinya hingga ia berhasil menembus jauh ke pedalaman negeri itu bersama orang-orang yang bersamanya. Ketika mereka melewati jalan-jalan sempit, musuh menangkap mereka dan menggulingkan batu dari gunung ke kepala mereka, sehingga seluruh pasukan binasa, termasuk Musqala. Orang-orang menjadikan dia sebagai contoh dan berkata, “Sampai Musqala kembali dari Tabaristan.”"
