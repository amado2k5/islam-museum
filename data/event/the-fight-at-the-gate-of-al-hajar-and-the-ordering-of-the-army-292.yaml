id: event/the-fight-at-the-gate-of-al-hajar-and-the-ordering-of-the-army-292
class: event
kind: other
label:
  ar: "تعبئة الجيش والقتال عند باب الدرب في قرية الهجر، ص291-292"
  en: "The ordering of the army and the fight at the lane gate of al-Hajar, pp. 291-292"
  ur: "لشکر کی صف بندی اور قریہ الہجر کے دروازہ گلی پر لڑائی، ص291-292"
  es: "La organización del ejército y la lucha en la puerta de al-Hajar, págs. 291-292"
summary:
  ar: "يوم الأحد غدا الهادي إلى قرية الهجر من نجران وعبّأ عسكره وعزل الطبريين مع ابنه أبي القاسم ناحية، وقاتل حتى باب الدرب وكان عليه أربعة جدر ملوية، فاستشهد من أصحابه أربعة وقتل من بني الحارث سبعة أو ثمانية ثم انصرف ودفن قتلاه بالحصن."
  en: "On Sunday al-Hadi set out for the village of al-Hajar in Najran and ordered his army, setting the Tabaris apart with his son Abu al-Qasim; the fight came to the lane gate, which had four twisting walls, and four of his men fell and seven or eight of Banu al-Harith were killed; he withdrew and buried his dead at al-Hisn."
  ur: "اتوار کو ہادی نجران کی بستی الہجر کی طرف نکلے، لشکر کی صف بندی کی اور طبریوں کو اپنے بیٹے ابو القاسم کے ساتھ الگ رکھا؛ لڑائی دروازہ گلی تک پہنچی جس پر چار بل کھاتی دیواریں تھیں، ان کے چار ساتھی شہید ہوئے اور بنو حارث کے سات یا آٹھ مارے گئے؛ وہ لوٹ آئے اور اپنے مقتولوں کو الحصن میں دفن کیا۔"
  es: "El domingo, al-Hadi partió hacia la aldea de al-Hajar en Najran y ordenó a su ejército, separando a los Tabaris junto con su hijo Abu al-Qasim; la lucha llegó a la puerta del callejón, que tenía cuatro muros tortuosos, y cuatro de sus hombres cayeron y siete u ocho de Banu al-Harith murieron; se retiró y enterró a sus muertos en al-Hisn."
