label: { ar: "شأن كاوس ملك أشروسنة ووقعة القهرمان", en: "King Kawus's Affair and the Qahrman's Killing", es: "El romance del rey Kawus y el asesinato de Qahrman", fr: "L'affaire du roi Kawus et le meurtre de Qahrman", ur: "شاہ کاوش کا معاملہ اور قہرمان کا قتل" }
summary:
  ar: "كتب كاوس ملك أشروسنة إلى الفضل بن سهل ذي الرياستين وزير المأمون يسأله الصلح على مال يؤديه على أن لا يغزو المسلمون بلده فأجيب إلى ذلك فلما قدم المأمون إلى مدينة السلام امتنع كاوس من الوفاء بالصلح وكان له قهرمان أثير عنده قد زوج ابنته من الفضل بن كاوس فكان يفرط الفضل عنده ويقربه من قلبه ويدم حيدر بن كاوس المعروف بالأفشين ويشنعه فوثب حيدر على القهرمان فقتله على باب مدينتهم وهرب إلى هاشم بن محود الختلي وكان هاشم ببلده مملكاً عليه فسأله أن يكتب إلى أبيه في الرضى عليه فلما بلغ حيدر ما فعل كاوس أظهر الإسلام وشخص إلى مدينة السلام فوصف للمأمون سهولة الأمر في أشروسنة وهون عليه ما يهوله الناس من خبرها ووصف له طريقاً مختصرة إليها."
  en: "Kawus of Ushrusana bought peace from al-Fadl ibn Sahl, then broke it once al-Ma'mun reached Baghdad. His favored qahrman — married into al-Fadl ibn Kawus's line — exalted al-Fadl while demeaning Haydar ibn Kawus, al-Afshin-to-be, who leapt on him and killed him at the city gate, then fled to Hashim ibn Mahwayh al-Khuttali for intercession. Hearing worse from home, Haydar showed Islam, came to Baghdad, made Ushrusana's conquest sound easy to al-Ma'mun, and showed him a short road."
  es: "Kawus de Ushrusana compró la paz a al-Fadl ibn Sahl, pero la rompió cuando al-Ma'mun llegó a Bagdad. Su qahrman favorito —casado con una descendiente de al-Fadl ibn Kawus— ensalzó a al-Fadl mientras menospreciaba a Haydar ibn Kawus, futuro al-Afshin, quien se abalanzó sobre él y lo mató en la puerta de la ciudad, para luego huir a buscar a Hashim ibn Mahwayh al-Khuttali en busca de intercesión. Al oír noticias aún peores de su tierra, Haydar proselitista del Islam, fue a Bagdad, le hizo creer a al-Ma'mun que la conquista de Ushrusana sería fácil y le mostró un camino más corto."
  fr: "Kawus d'Ushrusana acheta la paix à al-Fadl ibn Sahl, puis la rompit lorsque al-Ma'mun atteignit Bagdad. Son calife favori – allié par mariage à la lignée d'al-Fadl ibn Kawus – fit l'éloge d'al-Fadl tout en dénigrant Haydar ibn Kawus, futur al-Afshin, qui se jeta sur lui et le tua aux portes de la ville, puis s'enfuit auprès de Hashim ibn Mahwayh al-Khuttali pour obtenir son intercession. Apprenant des nouvelles encore plus terribles de chez lui, Haydar se convertit à l'islam, vint à Bagdad, présenta la conquête d'Ushrusana comme une solution facile à mettre en œuvre pour al-Ma'mun et lui montra un chemin plus court."
  ur: "عشروسانہ کے کووس نے الفضل بن سہل سے امن خریدا، پھر جب المامون بغداد پہنچ گیا تو اسے توڑ دیا۔ اس کے پسندیدہ قاہرمان - جس کی شادی الفضل ابن کاوس کے سلسلے میں ہوئی تھی - نے حیدر ابن کاوس، الفشین ٹو بی کی توہین کرتے ہوئے الفضل کو سربلند کیا، جس نے اس پر چھلانگ لگا دی اور اسے شہر کے دروازے پر مار ڈالا، پھر ہاشم بن مہویح الخطلی کے پاس شفاعت کے لیے بھاگ گیا۔ گھر سے برا سن کر، حیدر نے اسلام دکھایا، بغداد آیا، عشروسانہ کی فتح کو المامون کے لیے آسان بنا دیا، اور اسے ایک مختصر راستہ دکھایا۔"
