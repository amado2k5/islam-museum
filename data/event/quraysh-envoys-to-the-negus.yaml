id: event/quraysh-envoys-to-the-negus
class: event
kind: council
label: { ar: "وفادة قريش إلى النجاشي", en: "The Quraysh embassy to the Negus", es: "La embajada de los Quraysh ante el Negus", fr: "L'ambassade des Quraysh auprès du Négus", ur: "قریش کا سفارت خانہ نجاشی کے لیے", tr: "Kureyş heyetinin Negus'a yaptığı ziyaret", id: "Delegasi suku Quraisy kepada Negus" }
summary:
  ar: "أرسلت قريش عمرو بن العاص وعبد الله بن أبي ربيعة بالهدايا إلى النجاشي يطلبان رد المهاجرين المسلمين، فسمع النجاشي من جعفر بن أبي طالب وتلا عليه صدر سورة مريم، فأبى تسليمهم وردّ الهدايا."
  en: "Quraysh sent Amr ibn al-As and Abdullah ibn Abi Rabi'a with gifts to the Negus to demand the return of the Muslim emigrants; he heard Ja'far ibn Abi Talib recite the opening of Maryam, refused to surrender them and returned the gifts."
  es: "Los Quraysh enviaron a Amr ibn al-As y a Abdullah ibn Abi Rabi'a con regalos al Negus para exigir el regreso de los emigrantes musulmanes; este escuchó a Ja'far ibn Abi Talib recitar la apertura de Maryam, se negó a entregarlos y devolvió los regalos."
  fr: "Les Qurayshites envoyèrent Amr ibn al-As et Abdullah ibn Abi Rabi'a avec des présents au Négus pour exiger le retour des émigrants musulmans; celui-ci entendit Ja'far ibn Abi Talib réciter l'ouverture de Maryam, refusa de les livrer et rendit les présents."
  ur: "قریش نے عمرو بن العاص اور عبداللہ ابن ابی ربیعہ کو نجاشی کے پاس تحفے کے ساتھ بھیجے تاکہ مسلمان مہاجرین کی واپسی کا مطالبہ کریں۔ اس نے جعفر بن ابی طالب کو مریم کا افتتاح کرتے ہوئے سنا، ان کے حوالے کرنے سے انکار کر دیا اور تحفہ واپس کر دیا۔"
  tr: "Kureyş, Amr ibn al-Aas ve Abdullah ibn Abi Rabi’ah’ı hediyelerle birlikte Negus’a göndererek Müslüman hicretçilerin geri dönmesini istedi. Negus, Cafer ibn Abi Talib’i dinledi ve ona Meryem Suresi’nin başlangıcını okudu, ancak hediyeleri vermeyi reddederek geri gönderdi."
  id: "Kaum Quraisy mengutus Amr ibn al-Aas dan Abdullah ibn Abi Rabi’ah dengan membawa hadiah kepada Negus, memohon agar para emigran Muslim kembali. Negus mendengarkan Ja’far ibn Abi Talib dan membacakan kepadanya permulaan Surah Maryam, tetapi ia menolak untuk menyerahkan mereka dan mengembalikan hadiah-hadiah tersebut."
