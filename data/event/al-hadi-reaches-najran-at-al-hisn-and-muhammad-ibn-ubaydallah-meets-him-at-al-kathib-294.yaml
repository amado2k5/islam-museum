id: event/al-hadi-reaches-najran-at-al-hisn-and-muhammad-ibn-ubaydallah-meets-him-at-al-kathib-294
class: event
kind: other
label:
  ar: "وصول الهادي إلى نجران ونزوله بالحصن، ولقاؤه محمد بن عبيد الله بالكثيب، 294هـ، ص335"
  en: "Al-Hadi reaches Najran, alights at al-Hisn, and Muhammad ibn Ubaydallah meets him at al-Kathib, 294 AH, p. 335"
  ur: "ہادی کا نجران پہنچنا، الحصن میں ٹھہرنا، اور الکثیب پر محمد بن عبید اللہ سے ملاقات، 294ھ، ص335"
  es: "Al-Hadi llega a Najran, se apea en al-Hisn y Muhammad ibn Ubaydallah se encuentra con él en al-Kathib, 294 AH, p. 335"
  fr: "Al-Hadi atteint Najran, descend à al-Hisn et Muhammad ibn Ubaydallah le rencontre à al-Kathib, 294 AH, p. 335"
  tr: "El-Hadi'nin Necran'a gelişi, kalede kalışı ve El-Kathib'de Muhammed ibn Ubeyd Allah ile buluşması, Hicri 294, s. 335"
  id: "Kedatangan Al-Hadi di Najran dan masa tinggalnya di benteng, serta pertemuannya dengan Muhammad ibn Ubayd Allah di Al-Kathib, 294 H, hlm. 335"
summary:
  ar: "وصل الهادي نجران فنزل بالحصن، ثم التقى محمد بن عبيد الله به في الكثيب، ولم يبق معه أحد من بني الحارث."
  en: "Al-Hadi reached Najran and alighted at al-Hisn; Muhammad ibn Ubaydallah met him at al-Kathib, and none of Banu al-Harith remained with him."
  ur: "ہادی نجران پہنچے اور الحصن میں ٹھہرے؛ محمد بن عبید اللہ الکثیب پر ان سے ملے، اور بنی الحارث میں سے ان کے ساتھ کوئی باقی نہ رہا۔"
  es: "Al-Hadi llegó a Najran y desembarcó en al-Hisn; Muhammad ibn Ubaydallah lo recibió en al-Kathib, y ninguno de los Banu al-Harith permaneció con él."
  fr: "Al-Hadi atteignit Najran et descendit à al-Hisn; Muhammad ibn Ubaydallah le rencontra à al-Kathib, et aucun des Banu al-Harith ne resta avec lui."
  tr: "El-Hadi Necran'a geldi ve kalede kaldı. Daha sonra Muhammed bin Ubeydullah onu kum tepesinde karşıladı ve Beni el-Harith kabilesinden kimse onunla kalmadı."
  id: "Al-Hadi tiba di Najran dan tinggal di benteng. Kemudian Muhammad bin Ubaid Allah menemuinya di bukit pasir, dan tidak seorang pun dari Bani al-Harith tinggal bersamanya."
