id: event/the-qudumis-enter-shibam-break-the-prison-and-ibn-abi-abbad-is-killed-288
class: event
kind: other
label:
  ar: "القدميون يدخلون شبام ويكسرون الحبس ومقتل ابن أبي عباد، جمادى الآخرة 288هـ"
  en: "The Qudumis enter Shibam, break the prison and Ibn Abi Abbad is killed, Jumada II 288 AH"
  ur: "قدمی شبام میں داخل ہوتے ہیں، قید خانہ توڑتے ہیں اور ابن ابی عباد مارا جاتا ہے، جمادی الآخرہ 288ھ"
  es: "Los Qudumis entran en Shibam, rompen la prisión e Ibn Abi Abbad muere, Jumada II 288 AH."
  fr: "Les Qudumis entrent à Shibam, prennent d'assaut la prison et Ibn Abi Abbad est tué (Jumada II 288 AH)."
  tr: "Qadamiyyun Şibam'a girer, hapishaneyi kırar ve İbn Ebi Abbad'ı öldürür, Cemada el-Ahirah 288 H."
  id: "Qadamiyyun memasuki Shibam, mendobrak penjara, dan membunuh Ibnu Abi Abbad, Jumada al-Akhirah 288 H."
summary:
  ar: "لما صعد الهادي وأبو العتاهية الجبل يوم السبت واستخلف محمد بن أبي عباد بشبام مع الصنعانيين، سار القدميون إلى قرية شبام ليلة الأحد فكسروا باب الدرب وكسروا الحبس وأخرجوا أبا زياد وجماعة من الجفاتم، فانهزم الصنعانيون وقاتلهم ابن أبي عباد ساعة حتى قُتل، بحسب الراوي."
  en: "When al-Hadi and Abu al-Atahiya climbed the mountain on the Saturday, leaving Muhammad ibn Abi Abbad at Shibam with the men of Sana'a, the Qudumis went to the village of Shibam on the night of Sunday, broke the gate of the passage and the prison and freed Abu Ziyad and a body of the Jafatim; the Sana'is fled and Ibn Abi Abbad fought them a while until he was killed, in the narrator's account."
  ur: "جب ہفتے کو ہادی اور ابو العتاہیہ پہاڑ پر چڑھے اور محمد بن ابی عباد کو صنعاء والوں کے ساتھ شبام میں چھوڑا تو قدمی اتوار کی رات شبام کی بستی کی طرف بڑھے، درب کا دروازہ اور قید خانہ توڑا اور ابو زیاد اور جفاتم کی ایک جماعت کو نکال لیا؛ صنعاء والے بھاگ گئے اور ابن ابی عباد ان سے کچھ دیر لڑا یہاں تک کہ مارا گیا، راوی کے بیان کے مطابق۔"
  es: "Cuando al-Hadi y Abu al-Atahiya subieron a la montaña el sábado, dejando a Muhammad ibn Abi Abbad en Shibam con los hombres de Sana'a, los Qudumis fueron al pueblo de Shibam la noche del domingo, rompieron la puerta del pasaje y la prisión y liberaron a Abu Ziyad y a un grupo de los Jafatim; los Sana'is huyeron e Ibn Abi Abbad luchó contra ellos durante un tiempo hasta que murió, según el relato del narrador."
  fr: "Lorsque al-Hadi et Abu al-Atahiya gravirent la montagne le samedi, laissant Muhammad ibn Abi Abbad à Shibam avec les hommes de Sanaa, les Qudumis se rendirent au village de Shibam dans la nuit du dimanche, brisèrent la porte du passage et de la prison et libérèrent Abu Ziyad et un groupe de Jafatim; les Sana'is s'enfuirent et Ibn Abi Abbad les combattit un moment jusqu'à ce qu'il soit tué, selon le récit du narrateur."
  tr: "Rivayet edenin aktardığına göre, Cumartesi günü El-Hadi ve Ebu El-Atahiye dağa çıktıklarında ve Muhammed İbn Abi Abbad Şibam'da San'anilerle birlikte görevlendirildiğinde, Kadamiler Pazar gecesi Şibam köyüne gidip sokağın kapısını ve hapishaneyi kırarak Ebu Ziyad'ı ve Cafetilerden bir grubu dışarı çıkardılar. Böylece San'aniler yenilgiye uğradı ve İbn Abi Abbad onlarla bir saat boyunca savaştıktan sonra öldürüldü."
  id: "Ketika Al-Hadi dan Abu Al-Atahiyah mendaki gunung pada hari Sabtu dan Muhammad Ibn Abi Abbad ditugaskan di Shibam bersama kaum San'ani, kaum Qadami pergi ke desa Shibam pada Minggu malam dan mendobrak pintu lorong serta menghancurkan penjara dan membawa keluar Abu Ziyad dan sekelompok kaum Jafatim, sehingga kaum San'ani dikalahkan dan Ibn Abi Abbad melawan mereka selama satu jam sampai ia terbunuh, menurut perawi."
