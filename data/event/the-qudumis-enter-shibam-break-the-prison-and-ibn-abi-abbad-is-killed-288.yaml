id: event/the-qudumis-enter-shibam-break-the-prison-and-ibn-abi-abbad-is-killed-288
class: event
kind: other
label:
  ar: "القدميون يدخلون شبام ويكسرون الحبس ومقتل ابن أبي عباد، جمادى الآخرة 288هـ"
  en: "The Qudumis enter Shibam, break the prison and Ibn Abi Abbad is killed, Jumada II 288 AH"
  ur: "قدمی شبام میں داخل ہوتے ہیں، قید خانہ توڑتے ہیں اور ابن ابی عباد مارا جاتا ہے، جمادی الآخرہ 288ھ"
summary:
  ar: "لما صعد الهادي وأبو العتاهية الجبل يوم السبت واستخلف محمد بن أبي عباد بشبام مع الصنعانيين، سار القدميون إلى قرية شبام ليلة الأحد فكسروا باب الدرب وكسروا الحبس وأخرجوا أبا زياد وجماعة من الجفاتم، فانهزم الصنعانيون وقاتلهم ابن أبي عباد ساعة حتى قُتل، بحسب الراوي."
  en: "When al-Hadi and Abu al-Atahiya climbed the mountain on the Saturday, leaving Muhammad ibn Abi Abbad at Shibam with the men of Sana'a, the Qudumis went to the village of Shibam on the night of Sunday, broke the gate of the passage and the prison and freed Abu Ziyad and a body of the Jafatim; the Sana'is fled and Ibn Abi Abbad fought them a while until he was killed, in the narrator's account."
  ur: "جب ہفتے کو ہادی اور ابو العتاہیہ پہاڑ پر چڑھے اور محمد بن ابی عباد کو صنعاء والوں کے ساتھ شبام میں چھوڑا تو قدمی اتوار کی رات شبام کی بستی کی طرف بڑھے، درب کا دروازہ اور قید خانہ توڑا اور ابو زیاد اور جفاتم کی ایک جماعت کو نکال لیا؛ صنعاء والے بھاگ گئے اور ابن ابی عباد ان سے کچھ دیر لڑا یہاں تک کہ مارا گیا، راوی کے بیان کے مطابق۔"
