id: event/tirmidhi-loses-sight-275
class: event
kind: other
label:
  ar: "ذهاب بصر الترمذي في آخر عمره، نحو ٢٧٥هـ"
  en: "Al-Tirmidhi loses his sight in old age, c. 275/888"
  ur: "ترمذی کی آخری عمر میں بینائی جانا، تقریباً 275ھ/888ء"
  es: "Al-Tirmidhi pierde la vista en la vejez, c. 275/888."
  fr: "Al-Tirmidhi perd la vue dans sa vieillesse, vers 275/888"
  tr: "Tirmizi, Hicri 275 yılı civarında, hayatının sonlarına doğru görme yetisini kaybetti."
  id: "Al-Tirmidhi kehilangan penglihatannya di akhir hayatnya, sekitar tahun 275 Hijriah."
summary:
  ar: "ضُرّ الترمذي في آخر عمره {cite:mawsuat-a3lam-ulama-adaba p. 450}؛ وذهب بصره فيما بعد من كثرة البكاء على ما يُروى {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
  en: "Al-Tirmidhi lost his sight in the last part of his life {cite:mawsuat-a3lam-ulama-adaba p. 450}; in later life he became blind, allegedly from excessive weeping {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
  ur: "ترمذی نے عمر کے آخری حصے میں بینائی کھو دی {cite:mawsuat-a3lam-ulama-adaba p. 450}؛ روایت ہے کہ کثرتِ رونے کی وجہ سے ان کا بصر چلا گیا {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}۔"
  es: "Al-Tirmidhi perdió la vista en la última parte de su vida {cite:mawsuat-a3lam-ulama-adaba p. 450}; en su vida posterior quedó ciego, supuestamente por llorar en exceso {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
  fr: "Al-Tirmidhi perdit la vue dans la dernière partie de sa vie {cite:mawsuat-a3lam-ulama-adaba p. 450}; plus tard dans sa vie, il devint aveugle, prétendument à cause de pleurs excessifs {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
  tr: "Tirmizi hayatının sonlarında zarar gördü {kaynak: mawsuat-a3lam-ulama-adaba s. 450}; ve anlatılanlar yüzünden çok ağlamaktan sonra görme yetisini kaybetti {kaynak: encyclopaedia-of-islam-2 cilt 10 s. 579}."
  id: "Al-Tirmidhi mengalami musibah di akhir hayatnya {cite:mawsuat-a3lam-ulama-adaba p. 450}; dan kemudian ia kehilangan penglihatannya karena terlalu banyak menangis atas apa yang diriwayatkan {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
