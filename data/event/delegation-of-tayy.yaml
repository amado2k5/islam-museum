label: { ar: "قدوم زيد الخيل في وفد طيء", en: "Zayd al-Khayl comes with the delegation of Tayy" }
summary:
  ar: "قدم وفد طيء وفيهم سيدهم زيد الخيل، فعرض عليهم النبي الإسلام فأسلموا وحسن إسلامهم؛ وقال النبي، فيما رواه ابن إسحاق عن رجال من طيء، إنه ما ذُكر له رجل من العرب بفضل ثم جاءه إلا رآه دون ما يُقال فيه إلا زيد الخيل، وسمّاه زيد الخير وقطع له فيداً وأرضين وكتب له بذلك. وفي رجوعه أصابته الحمى بماء يقال له فردة فمات، وحرّقت امرأته كتبه."
  en: "The delegation of Tayy came with their chief Zayd al-Khayl; the Prophet offered them Islam and they became good Muslims. The Prophet said, as Ibn Ishaq heard from men of Tayy, that every Arab praised to him fell short of the praise when he came, except Zayd al-Khayl, who exceeded it; he renamed him Zayd al-Khayr, granted him Fayd and other lands and wrote it for him. On the way home fever struck him at a water called Farda and he died, and his wife burned the Prophet's writs."
