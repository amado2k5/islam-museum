label: { ar: "قدوم زيد الخيل في وفد طيء", en: "Zayd al-Khayl comes with the delegation of Tayy", es: "Zayd al-Khayl viene con la delegación de Tayy", fr: "Zayd al-Khayl arrive avec la délégation de Tayy" }
summary:
  ar: "قدم وفد طيء وفيهم سيدهم زيد الخيل، فعرض عليهم النبي الإسلام فأسلموا وحسن إسلامهم؛ وقال النبي، فيما رواه ابن إسحاق عن رجال من طيء، إنه ما ذُكر له رجل من العرب بفضل ثم جاءه إلا رآه دون ما يُقال فيه إلا زيد الخيل، وسمّاه زيد الخير وقطع له فيداً وأرضين وكتب له بذلك. وفي رجوعه أصابته الحمى بماء يقال له فردة فمات، وحرّقت امرأته كتبه."
  en: "The delegation of Tayy came with their chief Zayd al-Khayl; the Prophet offered them Islam and they became good Muslims. The Prophet said, as Ibn Ishaq heard from men of Tayy, that every Arab praised to him fell short of the praise when he came, except Zayd al-Khayl, who exceeded it; he renamed him Zayd al-Khayr, granted him Fayd and other lands and wrote it for him. On the way home fever struck him at a water called Farda and he died, and his wife burned the Prophet's writs."
  es: "La delegación de Tayy llegó acompañada de su jefe, Zayd al-Khayl. El Profeta les ofreció el Islam y se convirtieron en buenos musulmanes. Según oyó Ibn Ishaq de los hombres de Tayy, el Profeta dijo que todos los árabes que lo elogiaron no alcanzaron el nivel de elogios que recibió, excepto Zayd al-Khayl, quien los superó. Le cambió el nombre a Zayd al-Khayr, le concedió Fayd y otras tierras, y le dejó constancia por escrito. De regreso a casa, la fiebre lo atacó en un manantial llamado Farda y murió. Su esposa quemó los documentos del Profeta."
  fr: "La délégation de Tayy arriva avec son chef, Zayd al-Khayl. Le Prophète leur offrit l'islam et ils devinrent de fervents musulmans. Le Prophète rapporta, comme Ibn Ishaq l'apprit des hommes de Tayy, que tous les Arabes qui le louèrent furent déçus par son admiration lors de sa venue, à l'exception de Zayd al-Khayl, qui la surpassa. Le Prophète le renomma Zayd al-Khayr, lui octroya Fayd et d'autres terres, et consigna par écrit les écrits du Prophète. Sur le chemin du retour, il fut terrassé par la fièvre près d'une source appelée Farda et mourut. Son épouse brûla alors les écrits du Prophète."
