id: event/delegation-of-tayy
class: event
kind: gathering
label: { ar: "قدوم زيد الخيل في وفد طيء", en: "Zayd al-Khayl comes with the delegation of Tayy", es: "Zayd al-Khayl viene con la delegación de Tayy", fr: "Zayd al-Khayl arrive avec la délégation de Tayy", ur: "زید الخیل طائی کے وفد کے ساتھ آئے", tr: "Zaid al-Khayl'ın Tayy heyetiyle birlikte gelişi", id: "Kedatangan Zaid al-Khayl dalam delegasi Tayy" }
summary:
  ar: "قدم وفد طيء وفيهم سيدهم زيد الخيل، فعرض عليهم النبي الإسلام فأسلموا وحسن إسلامهم؛ وقال النبي، فيما رواه ابن إسحاق عن رجال من طيء، إنه ما ذُكر له رجل من العرب بفضل ثم جاءه إلا رآه دون ما يُقال فيه إلا زيد الخيل، وسمّاه زيد الخير وقطع له فيداً وأرضين وكتب له بذلك. وفي رجوعه أصابته الحمى بماء يقال له فردة فمات، وحرّقت امرأته كتبه."
  en: "The delegation of Tayy came with their chief Zayd al-Khayl; the Prophet offered them Islam and they became good Muslims. The Prophet said, as Ibn Ishaq heard from men of Tayy, that every Arab praised to him fell short of the praise when he came, except Zayd al-Khayl, who exceeded it; he renamed him Zayd al-Khayr, granted him Fayd and other lands and wrote it for him. On the way home fever struck him at a water called Farda and he died, and his wife burned the Prophet's writs."
  es: "La delegación de Tayy llegó acompañada de su jefe, Zayd al-Khayl. El Profeta les ofreció el Islam y se convirtieron en buenos musulmanes. Según oyó Ibn Ishaq de los hombres de Tayy, el Profeta dijo que todos los árabes que lo elogiaron no alcanzaron el nivel de elogios que recibió, excepto Zayd al-Khayl, quien los superó. Le cambió el nombre a Zayd al-Khayr, le concedió Fayd y otras tierras, y le dejó constancia por escrito. De regreso a casa, la fiebre lo atacó en un manantial llamado Farda y murió. Su esposa quemó los documentos del Profeta."
  fr: "La délégation de Tayy arriva avec son chef, Zayd al-Khayl. Le Prophète leur offrit l'islam et ils devinrent de fervents musulmans. Le Prophète rapporta, comme Ibn Ishaq l'apprit des hommes de Tayy, que tous les Arabes qui le louèrent furent déçus par son admiration lors de sa venue, à l'exception de Zayd al-Khayl, qui la surpassa. Le Prophète le renomma Zayd al-Khayr, lui octroya Fayd et d'autres terres, et consigna par écrit les écrits du Prophète. Sur le chemin du retour, il fut terrassé par la fièvre près d'une source appelée Farda et mourut. Son épouse brûla alors les écrits du Prophète."
  ur: "طائی کا وفد اپنے سردار زید الخیل کے ساتھ آیا۔ نبی نے انہیں اسلام کی پیشکش کی اور وہ اچھے مسلمان ہو گئے۔ نبی نے فرمایا، جیسا کہ ابن اسحاق نے طائی کے آدمیوں سے سنا ہے کہ ہر عرب جس نے ان کی تعریف کی تھی، جب وہ آیا تو اس کی تعریف سے کم رہ گیا، سوائے زید الخیل کے، جس نے اس سے تجاوز کیا۔ اس نے اس کا نام زید الخیر رکھا، اسے فید اور دوسری زمینیں عطا کیں اور اس کے لیے لکھ دیں۔ گھر جاتے ہوئے فردہ نامی پانی پر بخار آیا اور وہ مر گیا، اور اس کی بیوی نے نبی کی تحریر کو جلا دیا۔"
  tr: "Tayy kabilesinden, liderleri Zeyd el-Hayl'ın da aralarında bulunduğu bir heyet geldi. Peygamberimiz onlara İslam'ı tanıttı ve onlar da İslam'ı gönülden benimsediler. İbn İshak'ın Tayy kabilesinden kişilerden rivayet ettiğine göre, Peygamberimiz, kendisine Arap erdemli bir adamdan bahsedildiğinde ve o kişi yanına gittiğinde, Zeyd el-Hayl hariç, onun hakkında söylenenlerden daha az erdemli olduğunu gördüğünü söyledi. Ona Zeyd el-Hayr (İyi Zeyd) adını verdi, ona bir beylik ve topraklar verdi ve bunu yazılı olarak bildirdi. Dönüş yolculuğunda Fardah denilen bir yerde ateşe yakalandı ve öldü. Karısı mektuplarını yaktı."
  id: "Sebuah delegasi dari suku Tayy, termasuk pemimpin mereka Zayd al-Khayl, tiba. Nabi memperkenalkan Islam kepada mereka, dan mereka menerimanya dengan sepenuh hati. Nabi, sebagaimana diriwayatkan oleh Ibnu Ishaq dari orang-orang Tayy, berkata bahwa setiap kali seorang pria Arab yang berbudi luhur disebutkan kepadanya dan kemudian ia datang kepadanya, beliau mendapati orang itu tidak sebaik yang dikatakan tentangnya, kecuali Zayd al-Khayl. Beliau mengganti namanya menjadi Zayd al-Khayr (Zayd yang Baik) dan memberinya wilayah kekuasaan dan tanah, serta menulis surat-surat untuk itu. Dalam perjalanan pulang, ia terserang demam di suatu tempat bernama Fardah dan meninggal dunia. Istrinya membakar surat-suratnya."
