label: { ar: "فتح تاج الدين أبي بكر كرمان ومكران والسند", en: "Taj al-Din Abu Bakr's conquest of Kirman, Makran and Sind for the Khwarazmshah (c. 611 AH)", es: "Conquista de Taj al-Din Abu Bakr de Kirman, Makran y Sind para Khwarazmshah (c. 611 AH)", fr: "Conquête de Kirman, Makran et Sind par Taj al-Din Abu Bakr pour le Khwarazmshah (vers 611 AH)", ur: "تاج الدین ابوبکر کا خوارزمشاہ کے لیے کرمان، مکران اور سندھ کی فتح ⁦(م 611ھ)⁩", tr: "Taceddin Ebu Bekir Kerman, Makran ve Sindh'i fethetti", id: "Taj al-Din Abu Bakar menaklukkan Kerman, Makran, dan Sindh" }
summary:
  ar: "تولى الأمير تاج الدين أبو بكر صاحب زوزن — وكان بدأ جمالاً يكري الجمال في الأسفار حتى صار من أعيان أمراء خوارزمشاه محمد بن تكش وأثقتهم — فتح كرمان من صاحبها حرب بن محمد بن أبي الفضل في أسرع وقت، وسار إلى نواحي مكران فملكها كلها إلى السند من حدود كابل، وأتى هرمز المدينة على ساحل بحر مكران فأطاعه صاحبها ملتك وحمل عنها مالاً، وخطب لخوارزمشاه بقلهات وبعض عمان لأن أصحابها كانوا يطيعون صاحب هرمز — المرسى العظيم مجمع التجار من أقاصي الهند والصين واليمن — يتقربون بالطاعة ليأمن أصحاب المراكب التي تسير إليهم؛ روى الحادثة لابن الأثير أحد أجناد الموصل الذي رافق الفتح وشك في سنتها فهي في هذه السنة أو قبلها بقليل أو بعدها {cite:kamil-ibn-al-athir p. 362-363}."
  en: "A camel-hirer turned Khwarazmshah's most trusted amir, Taj al-Din Abu Bakr of Zuzan took Kirman 'in the quickest time', swept Makran to Sind's borders by Kabul, and received Hormuz's tribute — the great entrepôt whose protection merchants from India, China and Yemen bought with obedience — raising the Khwarazmian khutba at Qalhat and parts of Oman; Ibn al-Athir heard the story from a Mosul soldier who marched in the conquest {cite:kamil-ibn-al-athir p. 362-363}."
  es: "Un arriero de camellos convertido en el emir de mayor confianza de Khwarazmshah, Taj al-Din Abu Bakr de Zuzan tomó Kirman \"en el tiempo más rápido\", barrió Makrán hasta las fronteras de Sind por Kabul y recibió el tributo de Hormuz, el gran centro comercial cuya protección los comerciantes de India, China y Yemen compraban con obediencia, levantando la jutba de Khwarazm en Qalhat y partes de Omán; Ibn al-Athir escuchó la historia de un soldado de Mosul que marchó en la conquista {cite:kamil-ibn-al-athir p. 362-363}."
  fr: "Taj al-Din Abu Bakr de Zuzan, un loueur de chameaux devenu l'émir le plus fidèle du Khwarezmshah, prit Kirman « en un temps record », conquit le Makran jusqu'aux frontières du Sind près de Kaboul et reçut le tribut d'Hormuz — le grand entrepôt dont les marchands d'Inde, de Chine et du Yémen achetaient la protection avec obéissance — et leva le khutba khwarezmien à Qalhat et dans certaines parties d'Oman; Ibn al-Athir entendit l'histoire d'un soldat de Mossoul qui avait participé à la conquête {cite:kamil-ibn-al-athir p. 362-363}."
  ur: "ایک اونٹ کا کرایہ دار خوارزم شاہ کا سب سے قابل اعتماد امیر بنا، زوزان کے تاج الدین ابوبکر نے کرمان کو 'تیز ترین وقت میں' لے لیا، مکران کو سندھ کی سرحدوں تک کابل تک پہنچایا، اور ہرمز کا خراج وصول کیا - وہ عظیم کاروباری جس کی حفاظت کے لیے ہندوستان، چین اور یمن کے تاجروں نے خرمستان کے ساتھ خرمستان خریدا۔ قلحت اور عمان کے کچھ حصے؛ ابن اثیر نے یہ کہانی موصل کے ایک سپاہی سے سنی جس نے فتح میں قدم رکھا۔ 362-363}۔"
  tr: "Zuzan'ın sahibi Prens Taj al-Din Abu Bakr, başlangıçta seyahat için deve kiralayan bir deve sürücüsü iken Harezmşah Muhammed ibn Tekiş'in en önde gelen ve güvenilir prenslerinden biri haline gelmişti. Kerman'ı hükümdarı Harb ibn Muhammed ibn Abi al-Fadl'dan en kısa sürede ele geçirdi ve Makran bölgelerine ilerleyerek Kabil sınırlarından Sindh'e kadar olan tüm toprakları ele geçirdi. Makran Denizi kıyısındaki Hormuz şehrine geldi ve hükümdarı Multak ona boyun eğdi ve oradan para aldı. Ayrıca, Hormuz halkının hükümdarına itaat etmesi nedeniyle Harezmşah'ın adını Kalhat ve Umman'ın bazı bölgelerinde duyurdu. Bu büyük liman, Hindistan, Çin ve Yemen'in uzak bölgelerinden gelen tüccarların toplanma yeriydi ve halk, gemi sahiplerinin güvende olması için itaat yoluyla yakınlık arıyordu. Olay, fetih sırasında Musul'a eşlik eden askerlerden biri tarafından İbn el-Athir'e anlatılmış ve İbn el-Athir olayın yılını sorgulamıştır; dolayısıyla olay bu yılda veya biraz öncesinde ya da sonrasında gerçekleşmiştir. {Kaynak: Kamil İbn el-Athir, s. 362-363}"
  id: "Pangeran Taj al-Din Abu Bakr, pemilik Zuzan—yang awalnya seorang pengemudi unta yang menyewakan unta untuk bepergian hingga menjadi salah satu pangeran terkemuka dan terpercaya dari Khwarazmshah Muhammad ibn Tekish—menaklukkan Kerman dari penguasanya, Harb ibn Muhammad ibn Abi al-Fadl, dalam waktu singkat, dan berbaris ke wilayah Makran dan menguasai seluruhnya hingga Sindh dari perbatasan Kabul, dan sampai ke Hormuz, kota di pantai Laut Makran, dan penguasanya, Multak, tunduk kepadanya dan mengambil uang darinya, dan ia menyebarkan nama Khwarazmshah di Qalhat dan sebagian Oman, karena penduduknya menaati penguasa Hormuz—pelabuhan besar, tempat berkumpulnya para pedagang dari pelosok India, Cina, dan Yaman—mencari kedekatan melalui ketaatan sehingga pemilik kapal yang berlayar ke sana akan aman; Peristiwa itu diceritakan kepada Ibnu al-Athir oleh salah seorang prajurit Mosul yang ikut dalam penaklukan, dan dia ragu akan tahun kejadiannya, jadi itu terjadi pada tahun ini atau sedikit sebelum atau sesudahnya {kutip:kamil-ibn-al-athir hlm. 362-363}."
