id: event/asawira-defection
class: event
kind: treaty
label: { ar: "إسلام الأساورة وشروطهم", en: "The Asawira's Conversion Compact", fr: "Le pacte de conversion des Asawira", es: "El Compacto de Conversión de Asawira", tr: "Asavira'nın İslam'ı ve onların şartları", id: "Islam yang dianut kaum Asawira dan kondisi mereka" }
summary:
  ar: "كان سياه الأسواري على مقدمة يزدجرد ثم بعث إلى الأهواز فنزل الكلبانية وأبو موسى الأشعري محاصر السوس فلما رأى ظهور الإسلام وعز أهله أرسل إلى أبي موسى أنا قد أحببنا الدخول معكم في دينكم على أن نقاتل عدوكم من العجم معكم وعلى أنه إن وقع بينكم اختلاف لم نقاتل بعضكم مع بعض وعلى أنه إن قاتلنا العرب منعتمونا منهم وأعنتمونا عليهم وعلى أن ننزل بحيث شئنا من البلدان ونكون فيمن شئنا منكم وعلى أن نلحق بشرف العطاء ويعقد لنا بذلك الأمير الذي بعثكم فقال أبو موسى بل لكم ما لنا وعليكم ما علينا فأبوا فكتب أبو موسى بذلك إلى عمر فكتب إليه عمر أن أعطهم جميع ما سألوا."
  en: "Siyah al-Uswari led Yazdgard's vanguard; sent to Ahwaz he camped at al-Kalbaniyya while Abu Musa besieged al-Sus — then seeing Islam's ascendancy he offered: we enter your religion, fight your enemies among the Persians, fight none of you in your internal disputes, you defend us if Arabs attack, we settle where we wish among you and rank in the highest stipend — compact sealed with the amir. Abu Musa countered 'you have what we have and owe what we owe'; they refused, so he wrote Umar, who wrote back: grant them all they asked."
  fr: "Siyah al-Uswari commandait l'avant-garde de Yazdgard ; envoyé à Ahwaz, il campa à al-Kalbaniyya pendant qu'Abu Musa assiégeait al-Sus ; puis, voyant l'ascendant de l'islam, il proposa : nous entrons dans votre religion, nous combattons vos ennemis parmi les Perses, nous ne combattons aucun d'entre vous dans vos querelles internes, vous nous défendez si des Arabes nous attaquent, nous nous établissons où nous voulons parmi vous et nous sommes rangés dans la pension la plus élevée ; le pacte fut scellé avec l'émir. Abu Musa répliqua : « vous avez ce que nous avons et devez ce que nous devons » ; ils refusèrent, il écrivit donc à Umar, qui répondit : accorde-leur tout ce qu'ils ont demandé."
  es: "Siyah al-Uswari lideró la vanguardia de Yazdgard; enviado a Ahwaz, acampó en al-Kalbaniyya mientras Abu Musa sitiaba al-Sus. Al ver el auge del Islam, ofreció: «Nos convertimos en vuestra religión, combatimos a vuestros enemigos entre los persas, no luchamos contra ninguno de vosotros en vuestras disputas internas, nos defendéis si los árabes atacan, nos asentamos donde queramos entre vosotros y ocupamos el puesto más alto». Pacto sellado con el emir. Abu Musa replicó: «Tenéis lo que nosotros tenemos y debéis lo que nosotros debemos». Se negaron, así que escribió a Umar, quien le respondió: «Concededles todo lo que piden»."
  ur: "سیاح العسویری نے یزدگرد کے ہراول دستے کی قیادت کی۔ اہواز کی طرف بھیجا اس نے الکلبانیہ میں ڈیرہ ڈالا جب کہ ابو موسیٰ نے السوس کا محاصرہ کیا - پھر اسلام کی عروج کو دیکھ کر اس نے پیش کش کی: ہم آپ کے دین میں داخل ہوں گے، آپ کے دشمنوں سے فارسیوں کے درمیان نہیں لڑیں گے، آپ کے اندرونی جھگڑوں میں آپ میں سے کسی سے نہیں لڑیں گے، اگر آپ عرب حملہ آور ہوں تو آپ ہمارا دفاع کریں گے، ہم آپ کے درمیان جہاں چاہیں آباد کریں گے اور سمندر میں اعلیٰ درجہ بندی کریں گے۔ ابو موسیٰ نے جواب دیا کہ 'جو کچھ ہمارے پاس ہے وہ تمہارے پاس ہے اور جو ہم پر واجب ہے وہ تمہارے پاس ہے'۔ انہوں نے انکار کر دیا، تو اس نے عمر کو لکھا، جس نے واپس لکھا: ان کو وہ سب عطا کر دو جو انہوں نے مانگے تھے۔"
  tr: "Siyah el-Eşveri, Yazdegerd'in ordusunun ön saflarındaydı, sonra Ahvaz'a adam gönderdi ve Kelbeniye'ye yerleşti. Bu sırada Ebu Musa el-Eş'ari, Susa'yı kuşatıyordu. İslam'ın yükselişini ve halkının gücünü görünce Ebu Musa'ya şöyle bir mesaj gönderdi: \"Sizinle dininize girmeyi, ancak şu şartla kabul ediyoruz: Sizinle birlikte Persler arasından düşmanlarınızla savaşacağız, aranızda bir anlaşmazlık çıkarsa birbirimizle savaşmayacağız, Araplarla savaşırsak siz bizi onlardan koruyacak ve onlara karşı bize yardım edeceksiniz, topraklarda dilediğimiz yere yerleşeceğiz ve aranızdan dilediğimiz kişilerle birlikte olacağız, bize maaş verilecek ve sizi gönderen prens bizi o göreve atayacak.\" Ebu Musa şöyle dedi: \"Daha ziyade, sizde ne varsa bizde de sizde olsun.\" Ancak onlar bunu reddettiler, bunun üzerine Ebu Musa bunu Ömer'e yazdı ve Ömer ona şöyle yazdı: \"İstedikleri her şeyi onlara ver.\""
  id: "Siyah al-Aswari berada di garis depan pasukan Yazdegerd, kemudian ia mengirim utusan ke Ahwaz dan menetap di Kalbaniyah, sementara Abu Musa al-Ash'ari mengepung Susa. Ketika ia melihat kebangkitan Islam dan kekuatan umatnya, ia mengirim utusan kepada Abu Musa: “Kami datang untuk mencintai agamamu dengan syarat kami memerangi musuhmu dari kalangan Persia bersamamu, dan jika terjadi perselisihan di antara kalian, kami tidak akan saling berperang, dan jika kami memerangi orang Arab, engkau akan mencegah kami dari mereka dan membantu kami melawan mereka, dan kami dapat menetap di mana pun kami inginkan di negeri-negeri dan bersama siapa pun yang kami inginkan di antara kalian, dan kami akan diberikan kehormatan berupa tunjangan, dan pangeran yang mengirimmu akan mengangkat kami ke posisi itu.” Abu Musa berkata: “Lebih baik kalian memiliki apa yang kami miliki dan kalian memiliki apa yang kami miliki.” Tetapi mereka menolak, maka Abu Musa menulis tentang hal itu kepada Umar, dan Umar menulis kepadanya: “Berikan kepada mereka semua yang mereka minta.”"
