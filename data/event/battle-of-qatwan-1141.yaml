summary:
  ar: "بطاقة أولية لمعركة قطوان سنة ١١٤١م، هزيمة سنجر السلجوقي أمام قرا ختاي التي هزّت سلطنته؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Qatwan in 1141, Sanjar Seljuk's defeat by the Qara Khitai that shook his sultanate; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Batalla de Qatwan en 1141, la derrota de Sanjar Seljuk a manos de los Qara Khitai que sacudió su sultanato; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour la bataille de Qatwan en 1141, la défaite de Sanjar Seldjoukide face aux Qara Khitaï qui ébranla son sultanat; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1141 میں قطوان کی جنگ کے لیے ڈرافٹ کارڈ، قارا خیطائی کے ہاتھوں سنجار سلجوک کی شکست جس نے اس کی سلطنت کو ہلا کر رکھ دیا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1141 yılında gerçekleşen ve Selçuklu Sancar'ın Kara Hitay tarafından yenilgiye uğratıldığı, sultanlığını sarsan Katvan Muharebesi'ne dair ön bir anlatım; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Qatwan pada tahun 1141 M, kekalahan Seljuk Sanjar oleh Qara Khitai, yang mengguncang kesultanannya; sumber-sumber yang tercantum di halaman ini belum ditinjau."
