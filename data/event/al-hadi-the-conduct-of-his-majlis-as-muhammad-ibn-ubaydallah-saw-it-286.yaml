id: event/al-hadi-the-conduct-of-his-majlis-as-muhammad-ibn-ubaydallah-saw-it-286
class: event
kind: other
label:
  ar: مجلس الهادي وآدابه كما رآها محمد بن عبيد الله
  en: Al-Hadi's gatherings and their manners, as Muhammad ibn Ubaydallah saw them
  ur: ہادی کی مجلس اور اس کے آداب، جیسے محمد بن عبید اللہ نے دیکھے
summary:
  ar: سأل علي بن محمد أباه محمد بن عبيد الله عن مجلس يحيى بن الحسين، فوصفه بأنه كان مجلس سكينة ووقار ومواعظ واستغفار ومناظرة في العلم، لا لغو فيه ولا كذب، يدني الضعيف والفقير والصبي، ويكرم كريم كل قوم، ويستمع حتى ينقضي كلام المتكلم، ويسوّي بين القريب والبعيد في الحق، ولا يقوم عن جلسائه حتى يقوموا. وهو وصف راوٍ يقرنه بآداب النبي.
  en: Ali ibn Muhammad asked his father Muhammad ibn Ubaydallah about Yahya ibn al-Husayn's gatherings, and the father described them as places of calm, dignity, admonition, asking forgiveness and debate on knowledge, with no idle talk or falsehood; he drew the weak, the poor and the child close, honoured the noble of each people, heard a speaker out, held the near and the far alike in what is right, and did not rise from his companions before they rose. It is a narrator's portrait, set beside the manners of the Prophet.
  ur: علی بن محمد نے اپنے والد محمد بن عبید اللہ سے یحییٰ بن الحسین کی مجلس کے بارے میں پوچھا تو انہوں نے اسے سکون، وقار، نصیحت، استغفار اور علم کے مناظرے کی مجلس بتایا جس میں نہ لغو بات تھی نہ جھوٹ؛ وہ کمزور، فقیر اور بچے کو قریب بٹھاتے، ہر قوم کے معزز کی تکریم کرتے، بولنے والے کی بات پوری سننے تک ٹوکتے نہیں تھے، حق میں قریب و بعید کو برابر رکھتے اور ہم نشینوں کے اٹھنے سے پہلے نہ اٹھتے۔ یہ ایک راوی کا خاکہ ہے جسے وہ نبی کے آداب سے ملاتا ہے۔
