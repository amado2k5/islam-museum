id: event/al-hadi-judgment-on-highway-killers-285
class: event
kind: other
label:
  ar: حكم الهادي على ثلاثة قتلوا رجلاً وأخذوا حمولته قرب ريدة، صفر 285هـ
  en: Al-Hadi's judgment on three men who killed a traveller near Raydah and took his loads, Safar 285 AH
  ur: ریدہ کے قریب ایک مسافر کو قتل کر کے اس کا مال لوٹنے والے تین آدمیوں پر ہادی کا فیصلہ، صفر 285ھ
summary:
  ar: أمسك عمال الهادي القادمين من نجران ثلاثة رجال معهم ثلاثة أحمال، فأقروا أنهم قتلوا رجلاً قرب ريدة بخنقه وذبحه وأخذوا حمله، فاستنطقهم الهادي أياماً وشاور ثقات أصحابه، ثم حكم يوم الجمعة بقطع يد من لم يقتل ورجله المخالفة وبقتل القاتلين وصلبهما، وقال إنه حكم الله بكتابه.
  en: Al-Hadi's agents coming from Najran stopped three men with three loads; they confessed to killing a man near Raydah by strangling and cutting his throat and taking his loads; al-Hadi questioned them over days and consulted his trusted companions, then on a Friday ruled that the one who had not killed lose his hand and opposite foot and the two killers be put to death and crucified, saying it was God's ruling by His Book.
  ur: نجران سے آنے والے ہادی کے کارندوں نے تین آدمیوں کو تین بوجھوں کے ساتھ روکا؛ انہوں نے اقرار کیا کہ ریدہ کے قریب ایک شخص کو گلا گھونٹ کر اور ذبح کر کے قتل کیا اور اس کا مال لیا؛ ہادی نے کئی دن ان سے پوچھ گچھ کی، معتمد ساتھیوں سے مشورہ کیا، پھر جمعہ کو حکم دیا کہ جس نے قتل نہیں کیا اس کا ہاتھ اور مخالف پاؤں کاٹا جائے اور دونوں قاتل قتل کر کے سولی پر لٹکائے جائیں، اور کہا کہ یہ اللہ کی کتاب کا حکم ہے۔
