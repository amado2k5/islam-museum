label: { ar: "سعيد بن عثمان وموقف بخارا", en: "Sa'id ibn Uthman and the Bukhara Host", es: "Sa'id ibn Uthman y la hueste de Bukhara", fr: "Sa'id ibn Uthman et l'armée de Boukhara" }
summary:
  ar: "ولى معاوية سعيد بن عثمان بن عفان خراسان فقطع النهر وكان أول من قطعه بجنده فكان معه رفيع أبو العالية الرياحي وهو مولى لامرأة من بني رياح فقال رفيع أبو العالية رفعة وعلو فلما بلغ خاتون عبوره النهر حملت إليه الصلح وأقبل أهل السغد والترك وأهل كش ونسف وهي نخشب إلى سعيد في مائة ألف وعشرين ألفاً فالتقوا ببخارا وقد ندمت خاتون على إدائها الأتاوة ونكثت العهد فحضر عبد لسعيد بعض أهل تلك الجموع فانصرف بمن معه فانكسر الباقون فلما رأت خاتون ذلك أعطته الرهن وأعادت الصلح ودخل سعيد مدينة بخارا."
  en: "Mu'awiya gave Khurasan to Sa'id ibn Uthman ibn Affan — the first to cross the river with his whole army, and with him Rufay' Abu al-Aliya al-Riyahi ('Rufay' Abu al-Aliya: elevation and height'). The Khatun, hearing of his crossing, sued for peace; yet the Sughd, Turks, Kish and Nasaf — that is Nakhshab — came against him at a hundred and twenty thousand, meeting at Bukhara as the Khatun regretted her tribute and broke covenant. A slave of Sa'id's detached part of the host, the rest broke, and the Khatun gave hostages and renewed the peace — and Sa'id entered Bukhara's city."
  es: "Mu'awiya le dio Jorasán a Sa'id ibn Uthman ibn Affan, quien fue el primero en cruzar el río con todo su ejército, y con él Rufay' Abu al-Aliya al-Riyahi ('Rufay' Abu al-Aliya: elevación y altura'). La Khatun, al enterarse de su cruce, pidió la paz; sin embargo, los Sughd, los turcos, los Kish y los Nasaf —es decir, los Nakhshab— se le acercaron con ciento veinte mil hombres, reuniéndose en Bujará cuando la Khatun se arrepintió de su tributo y rompió el pacto. Un esclavo de la parte separada del ejército de Sa'id, el resto se rindió, y la Khatun entregó rehenes y restableció la paz; entonces Sa'id entró en la ciudad de Bujará."
  fr: "Mu'awiya confia le Khorasan à Sa'id ibn Uthman ibn Affan, le premier à traverser le fleuve avec toute son armée, accompagné de Rufay' Abu al-Aliya al-Riyahi (« Rufay' Abu al-Aliya » signifiant « élévation »). Le Khatoun, apprenant la traversée, demanda la paix; mais les Sughd, les Turcs, les Kish et les Nasaf (c'est-à-dire Nakhshab) marchèrent contre lui à cent vingt mille hommes, se rassemblant à Boukhara. Le Khatoun, regrettant son tribut, rompit l'accord. Un esclave de Sa'id détacha une partie de l'armée, le reste céda, et le Khatoun donna des otages et renouvela la paix. Sa'id entra alors dans Boukhara."
