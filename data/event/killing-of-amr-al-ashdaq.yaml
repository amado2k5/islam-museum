id: event/killing-of-amr-al-ashdaq
class: event
kind: massacre
label: { ar: "قتل عمرو بن سعيد الأشدق", en: "The killing of Amr ibn Sa'id al-Ashdaq", es: "El asesinato de Amr ibn Sa'id al-Ashdaq", fr: "Le meurtre d'Amr ibn Sa'id al-Ashdaq", ur: "عمرو بن سعید اشدق کا قتل", tr: "Amr ibn Saeed al-Ashdaq öldürüldü.", id: "Amr ibn Saeed al-Ashdaq terbunuh" }
summary:
  ar: "كان مروان بن الحكم جعل ولي العهد عمرو بن سعيد بن العاص بعد ابنه فقتله عبد الملك، وكان قتله أول غدر في الإسلام عند ابن الكلبي، وفي ذلك قيل يا قوم لا تغلبوا عن رأيكم فلقد جربتم الغدر من أبناء مروان أمسوا وقد قتلوا عمراً وما رشدوا {cite:tarikh-khulafa-minhaj-1434 p. 359}."
  en: "Marwan ibn al-Hakam had made Amr ibn Sa'id ibn al-As heir after his son; Abd al-Malik killed him — in Ibn al-Kalbi's reckoning the first treachery (ghadr) in Islam — mourned in the verse 'they have slain Amr and not done right' {cite:tarikh-khulafa-minhaj-1434 p. 359}."
  es: "Marwan ibn al-Hakam había nombrado heredero a Amr ibn Sa'id ibn al-As después de su hijo; Abd al-Malik lo mató —según Ibn al-Kalbi, la primera traición (ghadr) en el Islam— lamentada en el versículo 'han matado a Amr y no han obrado correctamente' {cite:tarikh-khulafa-minhaj-1434 p. 359}."
  fr: "Marwan ibn al-Hakam avait fait d'Amr ibn Sa'id ibn al-As son héritier après son fils; Abd al-Malik le tua — selon Ibn al-Kalbi, la première trahison (ghadr) de l'Islam — déplorée dans le verset « ils ont tué Amr et n'ont pas fait le bien » {cite:tarikh-khulafa-minhaj-1434 p. 359}."
  ur: "مروان بن الحکم نے اپنے بیٹے کے بعد عمرو بن سعید بن العاص کو وارث بنایا تھا۔ عبد الملک نے اسے قتل کیا - ابن الکلبی کے حساب سے اسلام میں پہلی خیانت ⁦(غدر)⁩ - اس آیت میں ماتم کیا کہ 'انہوں نے عمرو کو قتل کیا اور صحیح نہیں کیا'۔ 359}۔"
  tr: "Mervan ibn el-Hakam, oğlundan sonra halefi olarak Amr ibn Said ibn el-Aas'ı tayin etmişti, ancak Abd el-Malik onu öldürdü. İbn el-Kalbi'ye göre, bu cinayet İslam'da ilk ihanet eylemiydi. Bununla ilgili olarak şöyle denilmiştir: Ey insanlar, kanaatinize kapılmayın, çünkü Mervan oğullarından ihanet gördünüz. Dün Amr'ı öldürdüler ve doğru davranmadılar. {Kaynak:tarikh-khulafa-minhaj-1434 s. 359}"
  id: "Marwan bin al-Hakam telah mengangkat Amr bin Saeed bin al-Aas sebagai penggantinya setelah putranya, tetapi Abd al-Malik membunuhnya. Pembunuhan ini merupakan tindakan pengkhianatan pertama dalam Islam menurut Ibn al-Kalbi. Mengenai hal ini, dikatakan: Wahai manusia, janganlah kalian terpengaruh oleh pendapat kalian, karena kalian telah mengalami pengkhianatan dari putra-putra Marwan. Kemarin mereka membunuh Amr dan tidak bertindak dengan benar. {cite:tarikh-khulafa-minhaj-1434 p. 359}."
