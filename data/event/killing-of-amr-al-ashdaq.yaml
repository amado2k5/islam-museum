summary:
  ar: "كان مروان بن الحكم جعل ولي العهد عمرو بن سعيد بن العاص بعد ابنه فقتله عبد الملك، وكان قتله أول غدر في الإسلام عند ابن الكلبي، وفي ذلك قيل يا قوم لا تغلبوا عن رأيكم فلقد جربتم الغدر من أبناء مروان أمسوا وقد قتلوا عمراً وما رشدوا {cite:tarikh-khulafa-minhaj-1434 p. 359}."
  en: "Marwan ibn al-Hakam had made Amr ibn Sa'id ibn al-As heir after his son; Abd al-Malik killed him — in Ibn al-Kalbi's reckoning the first treachery (ghadr) in Islam — mourned in the verse 'they have slain Amr and not done right' {cite:tarikh-khulafa-minhaj-1434 p. 359}."
