label: { ar: "بناء الرافقة", en: "The Building of al-Rafiqa", es: "El edificio de al-Rafiqa", fr: "Le bâtiment d'al-Rafiqa", ur: "رفیقہ کی عمارت", tr: "Rafiqah'ın İnşası", id: "Membangun Rafiqah" }
summary:
  ar: "عند البلاذري: لم يكن للرافقة أثر قديم إنما بناها أمير المؤمنين المنصور سنة 155 على بناء مدينته ببغداد ورتّب فيها جنداً من أهل خراسان وجرت على يدي المهدي وهو ولي عهد ثم إن الرشيد بنى قصورها فكان بين الرقة والرافقة فضاء مزارع فلما قدم علي بن سليمان بن علي والياً على الجزيرة نقل أسواق الرقة إلى تلك الأرض — وكان سوق الرقة الأعظم فيما مضى يعرف بسوق هشام العتيق — ثم لما قدم الرشيد الرقة استزاد في تلك الأسواق فلم تزل تجتبى مع الصوافي؛ وأما رصافة هشام بن عبد الملك فكان ينزل قبلها الزيتونة وحفر الهني والمري وأحدث فيها واسط الرقة ثم قبضت تلك الضيعة في أول الدولة فصارت لأم جعفر زبيدة بنت جعفر بن المنصور فابتنت فيها القطيعة التي تنسب إليها وزادت في عمارتها."
  en: "In al-Baladhuri: al-Rafiqa had no ancient trace — the commander of the faithful al-Mansur built it in year 155 on the model of his city at Baghdad and stationed a Khurasani army in it; works continued under al-Mahdi while heir apparent, then al-Rashid built its palaces, and between al-Raqqa and al-Rafiqa lay an open space of sown fields; when Ali ibn Sulayman ibn Ali came as governor of the Jazira he moved al-Raqqa's markets into that space — the city's great old market having been called Suq Hisham al-Atiq — and when al-Rashid later came to al-Raqqa he increased those markets, which have since been assessed with the crown lands; as for Rusafat Hisham, Hisham ibn Abd al-Malik founded it, having previously dwelt at al-Zaytuna, dug the al-Hani and al-Mari canals and laid out Wasit al-Raqqa in it; that estate was seized at the dynasty's opening and passed to Umm Ja'far Zubayda bint Ja'far ibn al-Mansur, who built in it the estate named for her and added to its splendour."
  es: "En al-Baladhuri: al-Rafiqa no tenía rastro antiguo: el comandante de los fieles al-Mansur la construyó en el año 155 a partir del modelo de su ciudad en Bagdad y estacionó en ella un ejército de Jorasán; las obras continuaron bajo al-Mahdi mientras era heredero aparente, luego al-Rashid construyó sus palacios, y entre al-Raqqa y al-Rafiqa había un espacio abierto de campos sembrados; cuando Ali ibn Sulayman ibn Ali llegó como gobernador de la Jazira trasladó los mercados de al-Raqqa a ese espacio —el gran mercado antiguo de la ciudad se llamaba Suq Hisham al-Atiq— y cuando al-Rashid llegó más tarde a al-Raqqa amplió esos mercados, que desde entonces han sido tasados con las tierras de la corona; En cuanto a Rusafat Hisham, Hisham ibn Abd al-Malik la fundó, habiendo residido previamente en al-Zaytuna, excavado los canales al-Hani y al-Mari y diseñado Wasit al-Raqqa en ella; esa propiedad fue confiscada al inicio de la dinastía y pasó a Umm Ja'far Zubayda bint Ja'far ibn al-Mansur, quien construyó en ella la finca que lleva su nombre y aumentó su esplendor."
  fr: "Dans al-Baladhuri: al-Rafiqa ne portait aucune trace ancienne — le commandant des fidèles al-Mansur la construisit en l'an 155 sur le modèle de sa ville de Bagdad et y stationna une armée du Khorasan; les travaux se poursuivirent sous al-Mahdi alors qu'il était héritier présomptif, puis al-Rashid construisit ses palais, et entre al-Raqqa et al-Rafiqa s'étendait un espace ouvert de champs semés; lorsqu'Ali ibn Sulayman ibn Ali arriva comme gouverneur de la Jazira, il déplaça les marchés d'al-Raqqa dans cet espace — le grand marché ancien de la ville s'appelait alors Suq Hisham al-Atiq — et lorsqu'al-Rashid arriva plus tard à al-Raqqa, il agrandit ces marchés, qui ont depuis été évalués avec les terres de la couronne; Quant à Rusafat Hisham, Hisham ibn Abd al-Malik la fonda, après avoir résidé à al-Zaytuna, creusa les canaux al-Hani et al-Mari et y aménagea Wasit al-Raqqa; ce domaine fut saisi à l'ouverture de la dynastie et passa à Umm Ja'far Zubayda bint Ja'far ibn al-Mansur, qui y construisit le domaine qui porte son nom et en augmenta la splendeur."
  ur: "البلادوری میں ہے: الرفیقہ کا کوئی قدیم نشان نہیں تھا - وفادار المنصور کے کمانڈر نے اسے بغداد میں اپنے شہر کے نمونے پر سنہ 155 میں تعمیر کیا اور اس میں خراسانی فوج کو تعینات کیا۔ المہدی کے تحت کام جاری رہا جب کہ وارث ظاہر تھا، پھر الرشید نے اس کے محلات بنائے، اور الرقہ اور الرفیقہ کے درمیان بوئے ہوئے کھیتوں کی کھلی جگہ رکھی۔ جب علی بن سلیمان ابن علی جزیرہ کے گورنر کے طور پر آئے تو انہوں نے الرقہ کے بازاروں کو اس جگہ پر منتقل کر دیا — شہر کا عظیم پرانا بازار جسے سق ہشام العتیق کہا جاتا ہے — اور جب الرشید بعد میں الرقہ آیا تو اس نے ان بازاروں کو بڑھا دیا، جن کا اندازہ اس وقت سے کراؤن کے ساتھ کیا جاتا ہے۔ جہاں تک رصف ہشام کا تعلق ہے، ہشام بن عبد الملک نے اس کی بنیاد رکھی، وہ پہلے الزیتونہ میں مقیم تھا، اس نے الحانی اور الماری نہریں کھودیں اور اس میں وصیت الرقہ کو بچھایا۔ یہ جائداد سلطنت کے آغاز پر قبضے میں لے لی گئی اور ام جعفر زبیدہ بنت جعفر بن المنصور کو دے دی گئی، جس نے اس میں ان کے نام کی جاگیر بنائی اور اس کی رونق میں اضافہ کیا۔"
  tr: "El-Baladhuri'ye göre: El-Rafik'in eski bir izi yoktu, ancak 155 yılında Müminlerin Komutanı El-Mansur tarafından Bağdat'taki şehrinin temeli üzerine inşa edildi ve Horasan halkından askerler yerleştirdi; şehir, veliaht prens El-Mehdi'nin yönetimi altındaydı. Daha sonra El-Raşid saraylarını inşa etti ve El-Rafik ile El-Rafik arasında açık bir tarım alanı vardı. Ali bin Süleyman bin Ali, El-Cezire valisi olarak geldiğinde, El-Rafik'in pazarlarını o araziye taşıdı - ve El-Rafik'in en büyük pazarı geçmişte Hişam'ın eski pazarı olarak biliniyordu - daha sonra El-Raşid El-Rafik'e geldiğinde bu pazarları genişletti ve buralarda temiz mallar toplanmaya devam etti. Ruzafe'ye gelince, Hişam bin Abdül-Malik, oradan önce Zeytuna'da ikamet ederdi ve Hani ile Meri'yi kazdırarak orada Wasit el-Rakka'yı kurdu. Daha sonra bu mülk devletin başlangıcında ele geçirildi ve Ümmü Cafer Zübeyde bint Cafer bin El-Mansur'a kaldı; o da orada kendisine atfedilen mülkü inşa etti ve yapısını genişletti."
  id: "Menurut Al-Baladhuri: Al-Rafiqa tidak memiliki jejak kuno, tetapi dibangun oleh Amirul Mukminin, Al-Mansur, pada tahun 155, di atas fondasi kotanya di Baghdad, dan ia menempatkan tentara dari penduduk Khorasan di dalamnya, dan berada di bawah kekuasaan Al-Mahdi, yang merupakan putra mahkota. Kemudian Al-Rashid membangun istana-istananya, dan di antara Al-Raqqa dan Al-Rafiqa terdapat lahan pertanian terbuka. Ketika Ali bin Suleiman bin Ali datang sebagai gubernur Al-Jazira, ia memindahkan pasar-pasar Al-Raqqa ke wilayah itu - dan pasar terbesar Al-Raqqa di masa lalu dikenal sebagai pasar Hisham lama - kemudian ketika Al-Rashid datang ke Al-Raqqa, ia memperluas pasar-pasar tersebut, dan pasar-pasar itu terus dipenuhi dengan barang-barang suci. Adapun Rusafa, Hisham bin Abdul-Malik dulunya tinggal di Al-Zaytuna, dan dia menggali Al-Hani dan Al-Mari, dan dia membangun Wasit Al-Raqqa di dalamnya. Kemudian tanah itu disita pada awal berdirinya negara, dan menjadi milik Umm Ja`far Zubayda bint Ja`far bin Al-Mansur, lalu dia membangun di atasnya tanah yang dikaitkan dengannya dan memperluas pembangunannya."
