id: event/killing-of-abu-taglib-369
class: event
kind: death
label: { ar: "قتل أبي تغلب بن حمدان", en: "The killing of Abu Taghlib ibn Hamdan", es: "El asesinato de Abu Taghlib ibn Hamdan", fr: "Le meurtre d'Abou Taghlib ibn Hamdan", ur: "ابو تغلب بن حمدان کا قتل", tr: "Ebu Tağlib bin Hamdan öldürüldü", id: "Abu Taghlib bin Hamdan terbunuh" }
summary:
  ar: "في سنة 369هـ قتل أبو تغلب فضل الله بن ناصر الدولة بن حمدان؛ فقد سار إلى الشام فحال قسّام بينه وبين دمشق ورحل إلى ناوى وجاءه كتاب العزيز من مصر يدعوه إلى الحضور عنده فامتنع وترددت الرسل، واجتمع بقائد العزيز عند طبريّة فأمده بكل ما أحب وأراد أخذ دمشق سلماً فلم يتح له ذلك، وكان بالرملة دغفل بن المقرج الجراحي قد استولى على تلك الناحية وأظهر طاعة العزيز وسار إلى أحياء عقيل ليخرجها من الشام فاجتمعت عقيل إلى أبي تغلب تسأل نصرتها فتوسط الحال، ثم سار أبو تغلب إلى الرملة فلم يشك ابن الجراح والفضل أنه يريد حربهما فجمعا العساكر وتصافّ الناس فلما رأت عقيل كثرة الجمع انهزمت ولم يبق مع أبي تغلب إلا نحو سبعمائة من غلمانه فانهزم ولحقه الطلب فوقف يحمي نفسه فضُرب على رأسه فسقط وأُخذ أسيراً وحُمل إلى دغفل فأسره وكتفه وأراد الفضل أخذه وحمله إلى العزيز فخاف دغفل أن يصطنعه العزيز كما فعل بسبكتكين فقتله على غفلة من الفضل وأرسل رأسه إلى مصر {cite:kamil-ibn-al-athir p. 512-514}."
  en: "In 369 Abu Taghlib, the last Hamdanid, was cornered near Ramla — shut out of Damascus by Qassam, courted then abandoned over Egypt's summons, deserted by Uqayl when Daghful's host massed; captured, he was killed by Daghful the Jarrahid lest al-Aziz adopt him, and his head went to Egypt {cite:kamil-ibn-al-athir p. 512-514}."
  es: "En 369, Abu Taghlib, el último hamdánida, fue acorralado cerca de Ramla; Qassam le impidió el acceso a Damasco, fue cortejado y luego abandonado por la llamada de Egipto, y Uqayl lo abandonó cuando se reunió el ejército de Daghful; capturado, fue asesinado por Daghful el Jarrahid para que al-Aziz no lo adoptara, y su cabeza fue a Egipto {cite:kamil-ibn-al-athir p. 512-514}."
  fr: "En 369, Abou Taghlib, le dernier Hamdanide, fut acculé près de Ramla — chassé de Damas par Qassam, courtisé puis abandonné à cause de l'appel de l'Égypte, déserté par Uqayl lorsque l'armée de Daghful se rassembla; capturé, il fut tué par Daghful le Jarrahid de peur qu'al-Aziz ne l'adopte, et sa tête alla en Égypte {cite:kamil-ibn-al-athir p. 512-514}."
  ur: "369 میں ابو تغلب، آخری ہمدانی، کو رملہ کے قریب گھیر لیا گیا تھا - جسے قاسم نے دمشق سے باہر کر دیا تھا، پھر مصر کے بلانے کے بعد ترک کر دیا گیا تھا، جب داغفل کے میزبانوں نے اجتماع کیا تھا تو عقیل نے اسے ویران کر دیا تھا۔ پکڑا گیا، اسے دغفل جراحد نے قتل کر دیا، ایسا نہ ہو کہ العزیز اسے اپنا لے، اور اس کا سر مصر چلا گیا۔ 512-514}۔"
  tr: "Hicri 369 yılında Ebu Teğlib Fadl Allah ibn Nasir el-Davla ibn Hamdan öldürüldü; Suriye'ye doğru ilerledi, ancak Kassam onun Şam'a ulaşmasını engelledi. Daha sonra Nawa'ya gitti ve orada Mısır'dan el-Aziz'den kendisini çağıran bir mektup aldı. Reddetti ve elçiler gidip gelmeye devam etti. Sonunda Taberiye yakınlarında el-Aziz'in komutanıyla görüştü ve istediği her şeyi aldı. Şam'ı barışçıl bir şekilde ele geçirmeyi amaçlıyordu, ancak bu gerçekleşmedi. Ramla'da, Dağfal ibn el-Mukarraj el-Cerahi o bölgenin kontrolünü ele geçirmiş ve açıkça el-Aziz'e bağlılık yemini etmişti. Akil kabilelerini Suriye'den çıkarmak için onlara doğru ilerledi. Akil kabileleri Ebu Teğlib'in etrafında toplanarak desteğini aradılar ve o da duruma arabuluculuk yaptı. Sonra Ebu Teğlib Ramla'ya doğru ilerledi ve İbn el-Cerrah ile el-Fadl onun kendileriyle savaşmayı amaçladığından hiç şüphe duymadılar. Ordularını topladılar ve iki taraf da saf tuttu. Akiller büyük kuvveti görünce kaçtılar ve Ebu Teğlib'i yaklaşık yedi yüz hizmetkarıyla baş başa bıraktılar. Yenilgiye uğradı ve takip edildi. Kendini savunmak için ayağa kalktı, ancak başına bir darbe aldı ve yere düştü. Esir alındı ve Dağfal'a getirildi; Dağfal onu hapse attı ve bağladı. El-Fadl onu el-Aziz'e götürmek istedi, ancak Dağfal, el-Aziz'in ona Sabuktigin'e davrandığı gibi davranacağından korktuğu için, el-Fadl'ın haberi olmadan onu öldürdü ve başını Mısır'a gönderdi. {Kaynak: Kamil İbn el-Athir, s. 512-514}"
  id: "Pada tahun 369 H, Abu Taghlib Fadl Allah ibn Nasir al-Dawla ibn Hamdan terbunuh; Ia bergerak menuju Suriah, tetapi Qassam mencegahnya mencapai Damaskus. Kemudian ia pergi ke Nawa, di mana sebuah surat dari al-Aziz tiba dari Mesir yang memanggilnya. Ia menolak, dan para utusan terus datang dan pergi. Akhirnya ia bertemu dengan komandan al-Aziz di dekat Tiberias, yang memberinya segala yang diinginkannya. Ia bermaksud merebut Damaskus secara damai, tetapi hal ini tidak terjadi. Di Ramla, Daghfal ibn al-Muqarraj al-Jarahi telah menguasai wilayah itu dan secara lahiriah menyatakan kesetiaan kepada al-Aziz. Ia bergerak menuju suku Aqil untuk mengusir mereka dari Suriah. Suku Aqil berkumpul di sekitar Abu Taghlib, mencari dukungannya, dan ia menengahi situasi tersebut. Kemudian Abu Taghlib bergerak menuju Ramla, dan Ibn al-Jarrah serta al-Fadl yakin bahwa ia bermaksud untuk melawan mereka. Mereka mengumpulkan pasukan mereka, dan kedua pihak bersiap. Ketika Aqil melihat pasukan yang besar, mereka melarikan diri, meninggalkan Abu Taghlib hanya dengan sekitar tujuh ratus pelayannya. Ia dikalahkan dan dikejar. Ia berdiri untuk membela diri tetapi dipukul di kepala dan jatuh. Ia ditawan dan dibawa ke Daghfal, yang memenjarakan dan mengikatnya. Al-Fadl ingin membawanya ke al-Aziz, tetapi Daghfal khawatir bahwa al-Aziz akan memperlakukannya seperti yang telah dilakukannya terhadap Sabuktigin, jadi ia membunuhnya saat al-Fadl tidak menyadarinya dan mengirimkan kepalanya ke Mesir {cite:kamil-ibn-al-athir p. 512-514}."
