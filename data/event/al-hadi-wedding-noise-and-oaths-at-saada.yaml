id: event/al-hadi-wedding-noise-and-oaths-at-saada
class: event
kind: other
label:
  ar: الهادي وصوت العرس في صعدة وأقسامه على إظهار الدين
  en: Al-Hadi and the noise of a wedding at Sa'da, and his oaths about the religion
  ur: صعدہ میں شادی کا شور اور دین کے بارے میں ہادی کے اقسام
summary:
  ar: 'تتمة حكاية الليلة: أرسل الهادي ثقة من أهل البلد ليكشف مصدر الصوت فتبين أنه عرس لا شراب فيه، ثم أقسم أن يُعبد الله حقاً إذا استوت له البلاد؛ ويروي الراوي إملاءه كتاباً وقوله إنه ما طلب هذا الأمر وإنما خرج اضطراراً لقيام الحجة.'
  en: 'The end of the night story: al-Hadi sent a trusted townsman to find the source of the sound, which proved to be a wedding with no drink; he swore that God would be truly worshipped once the land was settled. The narrator also reports a letter he dictated and his saying that he did not seek this task but went out under compulsion of the proof.'
  ur: 'رات کے قصے کا اختتام: ہادی نے شہر کے ایک معتمد کو آواز کا سبب معلوم کرنے بھیجا تو معلوم ہوا کہ شادی ہے جس میں شراب نہیں؛ پھر قسم کھائی کہ ملک جم جائے تو اللہ کی حقیقی عبادت ہوگی۔ راوی ایک خط کی املا اور اس قول کا بھی ذکر کرتا ہے کہ انہوں نے یہ کام طلب نہیں کیا بلکہ حجت قائم ہونے پر مجبوراً نکلے۔'
