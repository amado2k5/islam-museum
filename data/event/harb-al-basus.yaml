kind: war
label: { ar: "حرب البسوس", en: "The War of al-Basus", es: "La guerra de al-Basus", fr: "La guerre d'al-Basus", ur: "البسوس کی جنگ", tr: "Basus Savaşı", id: "Perang Basus" }
summary:
  ar: "حرب البسوس، أطول أيام العرب وأشهرها، بين بكر وتغلب ابني وائل؛ سببها أن كليب بن ربيعة التغلبي — وكان اللواء قد تحول إلى تغلب فوليه ولم تجتمع معد إلا على ثلاثة هو ثالثهم وكان قائد معد يوم خزاز — حمى أرضاً من العالية في أول الربيع لا يقربها إلا محارب، فدخلتها سراب ناقة سعد بن شميس الجرمي جار جساس بن مرة، فنذر كليب لئن عادت ليضعن سهمه في ضرعها ونذر جساس لئن فعل ليضعن سنان رمحه في لبته، فلما رمى كليب ضرع الناقة صاحت البسوس بنت منقذ خالة جساس «واذلاه»، ففطن جساس أنه ساق إلى صدره القتل، فلم يزل يطلب غرة كليب حتى طعنه فرماه عن فرسه فقضى نحبه، وثار أخوه مهلهل بن ربيعة يطلب بثأره فدارت الحرب بين الأخوين أربعين سنة حتى هدّت طريفة حربها وباتت البلية مقيمة {cite:kamil-ibn-al-athir p. 390-397}."
  en: "The Basus war, the longest and most storied of the Arabs' days: when the mare-camel Sarab strayed into Kulayb's forbidden spring pasture he shot her udder as threatened, and al-Basus's cry of shame — 'wa-dhalah!' — told her nephew Jasas ibn Murra that honour demanded blood; he speared Kulayb ibn Rabi'a, the Taghlibi lord under whom all Ma'add had united, and Kulayb's brother al-Muhalhil spent forty years exacting the feud between Bakr and Taghlib {cite:kamil-ibn-al-athir p. 390-397}."
  es: "La guerra de Basus, la más larga y legendaria de los días de los árabes: cuando la yegua-camello Sarab se extravió en el pasto primaveral prohibido de Kulayb, este le disparó en la ubre como había amenazado, y el grito de vergüenza de al-Basus — '¡wa-dhalah!' — le dijo a su sobrino Jasas ibn Murra que el honor exigía sangre; él lanceó a Kulayb ibn Rabi'a, el señor Taghlibi bajo cuyo mando se había unido todo Ma'add, y el hermano de Kulayb, al-Muhalhil, pasó cuarenta años exigiendo venganza entre Bakr y Taghlib {cite:kamil-ibn-al-athir p. 390-397}."
  fr: "La guerre des Basus, la plus longue et la plus légendaire de l'histoire des Arabes: lorsque la jument chamelle Sarab s'égara dans le pâturage printanier interdit de Kulayb, il lui tira une balle dans le pis comme une menace, et le cri de honte d'al-Basus — 'wa-dhalah !' — fit comprendre à son neveu Jasas ibn Murra que l'honneur exigeait le sang; il transperça de sa lance Kulayb ibn Rabi'a, le seigneur Taghlibi sous lequel tout Ma'add s'était uni, et le frère de Kulayb, al-Muhalhil, passa quarante ans à régler la querelle entre Bakr et Taghlib {cite:kamil-ibn-al-athir p. 390-397}."
  ur: "بسوس کی جنگ، عربوں کے دنوں کی سب سے طویل اور منزلہ جنگ: جب گھوڑی کی اونٹنی سراب کلیب کی ممنوعہ چشمہ چراگاہ میں بھٹک گئی تو اس نے دھمکی کے طور پر اس کے تھن کو گولی مار دی، اور الباسس کی شرمندگی کی فریاد - 'و الذلہ!' اپنے بھتیجے جصاص بن مرہ سے کہا کہ عزت خون کا تقاضا کرتی ہے۔ اس نے کلیب بن ربیعہ کو، جو تغلیبی سردار تھا، جس کے ماتحت تمام معد اکٹھے ہوئے تھے، اور کلیب کے بھائی المحلح نے چالیس سال تک بکر اور تغلب کے درمیان جھگڑے کو ختم کرنے میں گزارے۔ 390-397}۔"
  tr: "Arap savaşlarının en uzun ve en ünlüsü olan Basus Savaşı, Wael'in oğulları Bakr ve Taghlib arasında gerçekleşti. Bunun sebebi, Kulayb ibn Rabi'ah al-Taghlibi'nin (ve sancak Taghlib'e devredilmişti ve Ma'ad kabilesi sadece üç kişiyle toplanmıştı ve o, Hazaz günü Ma'ad kabilesinin lideriydi) ilkbaharın başında, sadece savaşçıların yaklaşabileceği yüksek bir araziyi korumasıydı. Sonra, Jassas ibn Murrah'ın komşusu Sa'd ibn Shamis al-Jarmi'nin dişi devesinin serabı oraya girdi. Kulayb, deve geri dönerse okunu memesine saplayacağına, Jassas ise dönerse mızrağının ucunu boğazına saplayacağına yemin etti. Kulayb dişi devenin memesini vurduğunda, Jassas'ın teyzesi el-Basus bint Munqidh, \"Ah, ne utanç!\" diye bağırdı. Jassas, kendi başına ölüm getirdiğini anladı ve Kulayb için fırsat kollamaya başladı, sonunda onu bıçaklayıp atından düşürdü ve öldü. Kardeşi Muhalhil ibn Rabi'ah intikam almak için ayağa kalktı ve iki kardeş arasındaki savaş kırk yıl sürdü, ta ki savaş yatışana ve felaket kalana kadar. {Kaynak: Kamil ibn el-Athir, s. 390-397}"
  id: "Perang Basus, perang Arab terpanjang dan paling terkenal, terjadi antara Bakr dan Taghlib, putra-putra Wael. Alasannya adalah karena Kulayb ibn Rabi’ah al-Taghlibi — dan panji telah dialihkan kepada Taghlib, dan Ma’ad hanya terdiri dari tiga orang, dan dia adalah pemimpin Ma’ad pada hari Khazaz — melindungi sebidang tanah di dataran tinggi pada awal musim semi, yang tidak akan didekati oleh siapa pun kecuali seorang prajurit. Kemudian fatamorgana unta betina milik Sa’d ibn Shamis al-Jarmi, tetangga Jassas ibn Murrah, memasuki tempat itu. Kulayb bersumpah bahwa jika unta itu kembali, dia akan menembakkan panahnya ke ambingnya, dan Jassas bersumpah bahwa jika ia kembali, ia akan menusukkan ujung tombaknya ke tenggorokannya. Ketika Kulayb menembak ambing unta betina itu, al-Basus bint Munqidh, bibi Jassas, berseru, “Oh, aib!” Jassas menyadari bahwa ia telah mendatangkan kematian pada dirinya sendiri, sehingga ia terus mencari kesempatan untuk menyerang Kulayb hingga akhirnya ia menikamnya dan menjatuhkannya dari kudanya, dan Kulayb pun tewas. Saudaranya, Muhalhil ibn Rabi’ah, bangkit untuk membalas dendam, dan perang antara kedua bersaudara itu berkecamuk selama empat puluh tahun hingga perang mereda dan malapetaka tetap ada. {cite:kamil-ibn-al-athir p. 390-397}."
