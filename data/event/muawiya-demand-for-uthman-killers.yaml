label: { ar: "مطالبة معاوية بتسليم قتلة عثمان", en: "Muawiya's demand that the killers of Uthman be surrendered" }
summary:
  ar: "لم يبايع معاوية عليّاً بعد بيعة المدينة، وطلب أن يُقتصّ من قتلة عثمان ثم يبايع من أهل الشام؛ وروى الكتاب أن أبا مسلم الخولاني وآخرين سألوه: أتنازع علياً أم أنت مثله؟ فقال: «لا والله إني لأعلم أنه أفضل مني وأحق بالأمر، ولكن ... أنا ابن عمه والطالب بدمه» (ص187-188). ويخلص الكتاب إلى أن معاوية لم ينازع علياً في الخلافة ذاتها، وأن الخلاف كان حول الدم (ص188)."
