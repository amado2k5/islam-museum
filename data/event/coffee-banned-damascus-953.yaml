label: { ar: "إبطال القهوة بدمشق بأمر سلطاني 953هـ", en: "Coffee abolished at Damascus by sultanic decree, 953", fr: "Le café aboli à Damas par décret sultanien, 953", es: "El café fue prohibido en Damasco por decreto sultánico en 953.", ur: "کافی کو دمشق میں سلطانی فرمان، 953 کے ذریعے ختم کر دیا گیا۔", tr: "Şam'da kahve, Hicri 953 yılında kraliyet fermanıyla yasaklandı.", id: "Kopi dilarang di Damaskus berdasarkan dekrit kerajaan pada tahun 953 Hijriah." }
summary:
  ar: "القاضي شمس الدين محمد بن عبد الأول الجعفري التبريزي قاضي دمشق وافق الشيخ قطب الدين بن سلطان والشيخ يونس العيثاوي في القول بتحريم القهوة فنادى بإبطالها ثم عرض بإبطالها إلى السلطان سليمان فورد أمره بإبطالها في شوال سنة ثلاث وخمسين وتسعمائة وأشهر النداء بذلك {cite:shadharat-dhahab p. 338}."
  en: "Damascus's qadi Shams al-Din Muhammad b. 'Abd al-Awwal joined mufti Qutb b. Sultan and Yunus al-'Uthawi in ruling coffee unlawful, proclaimed its abolition, then raised the matter to Sultan Sulayman; the sultanic order abolishing it came down in Shawwal 953 and the cry was published {cite:shadharat-dhahab p. 338}."
  fr: "Le cadi de Damas Shams al-Din Muhammad b. 'Abd al-Awwal se joignit au mufti Qutb b. Sultan et à Yunus al-'Uthawi pour déclarer le café illicite, proclama son abolition, puis porta l'affaire devant le sultan Soliman ; l'ordre sultanien l'abolissant arriva en Shawwal 953 et la proclamation fut publiée {cite:shadharat-dhahab p. 338}."
  es: "El cadí de Damasco, Shams al-Din Muhammad b. 'Abd al-Awwal, se unió al muftí Qutb b. Sultan y a Yunus al-'Uthawi para declarar ilegal el café, proclamó su abolición y luego elevó el asunto al sultán Sulayman; la orden sultánica que lo abolía descendió en Shawwal 953 y el clamor fue publicado {cite:shadharat-dhahab p. 338}."
  ur: "دمشق کے قاضی شمس الدین محمد بن۔ عبد الاول مفتی قطب بن میں شامل ہوئے۔ سلطان اور یونس العثوی نے کافی کو غیر قانونی قرار دیتے ہوئے اس کے خاتمے کا اعلان کیا، پھر معاملہ سلطان سلیمان کے سامنے اٹھایا؛ اس کو ختم کرنے کا سلطانی حکم شوال 953 میں نازل ہوا اور یہ فریاد شائع ہوئی۔ 338}۔"
  tr: "Şam kadısı Şemseddin Muhammed ibn Abdülevvel el-Caferi el-Tebrizi, Şeyh Kutbeddin ibn Sultan ve Şeyh Yunus el-Aithavi ile aynı fikirde olarak kahvenin haram olduğunu söylemiş ve bu nedenle kaldırılmasını istemiştir. Daha sonra bu konuyu Sultan Süleyman'a sunmuş ve Sultan Süleyman'ın kahvenin kaldırılması emrini 953 yılının Şevval ayında vermiş ve bu çağrı kamuoyuna duyurulmuştur. {Kaynak: Şadharat-dhahab s. 338}"
  id: "Hakim Shams al-Din Muhammad ibn Abd al-Awwal al-Jaafari al-Tabrizi, hakim Damaskus, setuju dengan Syekh Qutb al-Din ibn Sultan dan Syekh Yunus al-Aithawi yang mengatakan bahwa kopi haram, sehingga beliau menyerukan penghapusannya. Kemudian beliau menyampaikan usulan penghapusan tersebut kepada Sultan Suleiman, dan perintah beliau untuk menghapuskannya datang pada bulan Syawal tahun 953, dan seruan tersebut menjadi tersebar luas. {cite:shadharat-dhahab hlm. 338}."
