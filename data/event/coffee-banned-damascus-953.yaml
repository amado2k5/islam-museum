summary:
  ar: "القاضي شمس الدين محمد بن عبد الأول الجعفري التبريزي قاضي دمشق وافق الشيخ قطب الدين بن سلطان والشيخ يونس العيثاوي في القول بتحريم القهوة فنادى بإبطالها ثم عرض بإبطالها إلى السلطان سليمان فورد أمره بإبطالها في شوال سنة ثلاث وخمسين وتسعمائة وأشهر النداء بذلك {cite:shadharat-dhahab p. 338}."
  en: "Damascus's qadi Shams al-Din Muhammad b. 'Abd al-Awwal joined mufti Qutb b. Sultan and Yunus al-'Uthawi in ruling coffee unlawful, proclaimed its abolition, then raised the matter to Sultan Sulayman; the sultanic order abolishing it came down in Shawwal 953 and the cry was published {cite:shadharat-dhahab p. 338}."
