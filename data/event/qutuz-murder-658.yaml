summary:
  ar: "طمع البندقداري في أخذ حلب وكان وعده بها المظفر ثم رجع فتأثر وأضمن الشر، فلما رجع المظفر بعد شهر إلى مصر مضمراً له الشر وافق ركن الدين على مراده عدة أمراء، وكان الذي ضربه بالسيف فحل كتفه كتوت الجوكندار المغربي ثم رماه بهادر المغربي بسهم قضى عليه، وذلك يوم سادس عشر ذي القعدة بقرب قطية، وتسلطن ركن الدين البندقداري الملك الظاهر بيبرس {cite:shadharat-dhahab p. 299}."
  en: "Baybars had coveted Aleppo — promised it by al-Muzaffar, then refused — and nursed the grievance. On the march back to Egypt, a month after the victory, several amirs joined Rukn al-Din's intent: Kattut al-Jukandar al-Magharibi's sword split Qutuz's shoulder and Bahadur al-Mughrabi's arrow finished him, on 16 Dhu al-Qa'da near Qatya — and Rukn al-Din al-Bunduqdari took the throne as al-Zahir Baybars {cite:shadharat-dhahab p. 299}."
