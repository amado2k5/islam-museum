label: { ar: "مقتل المظفر قطز وتسلطنة بيبرس 658هـ", en: "The killing of al-Muzaffar Qutuz and Baybars's accession, 658 AH", es: "El asesinato de al-Muzaffar Qutuz y la ascensión de Baybars al trono, 658 AH.", fr: "L'assassinat d'al-Muzaffar Qutuz et l'accession au pouvoir de Baybars, 658 AH", ur: "المظفر قطوز کا قتل اور بیبرس کا الحاق، 658ھ", tr: "Hicri 658 yılında El-Muzaffar Kutuz'un ölümü ve Sultan Baybars'ın tahta çıkışı.", id: "Kematian Al-Muzaffar Qutuz dan naiknya Sultan Baybars pada tahun 658 Hijriah" }
summary:
  ar: "طمع ركن الدين بيبرس البندقداري في حلب وكان الملك المظفر قطز وعده بها ثم رجع، فأضمر كلٌّ منهما للآخر الشر، فقتل قطز قرب قطية يوم سادس عشر ذي القعدة سنة ثمان وخمسين وستمائة، وتسلطن بيبرس الملك الظاهر {cite:shadharat-dhahab p.299}."
  en: "Rukn al-Din Baybars al-Bunduqdari had been promised Aleppo by al-Muzaffar Qutuz, who then went back on it, and each harboured ill will for the other; Qutuz was killed near Qatiya on 16 Dhu al-Qa'da 658, and Baybars took the sultanate as al-Malik al-Zahir {cite:shadharat-dhahab p.299}."
  es: "Rukn al-Din Baybars al-Bunduqdari había recibido la promesa de Alepo por parte de al-Muzaffar Qutuz, quien luego se retractó, y ambos albergaron rencor el uno hacia el otro; Qutuz fue asesinado cerca de Qatiya el 16 de Dhu al-Qa'da de 658, y Baybars tomó el sultanato como al-Malik al-Zahir {cite:shadharat-dhahab p.299}."
  fr: "Rukn al-Din Baybars al-Bunduqdari s'était vu promettre Alep par al-Muzaffar Qutuz, qui revint ensuite sur sa promesse, et chacun nourrissait de la rancune envers l'autre; Qutuz fut tué près de Qatiya le 16 Dhu al-Qa'da 658, et Baybars prit le sultanat sous le nom d'al-Malik al-Zahir {cite:shadharat-dhahab p.299}."
  ur: "رکن الدین بیبرس البندوقداری سے المظفر قطوز نے حلب کا وعدہ کیا تھا، جو اس کے بعد واپس چلا گیا، اور ہر ایک نے دوسرے کے لیے بیمار وصیت کی۔ قطوز 16 ذی القعدہ 658 کو قطیہ کے قریب مارا گیا، اور بیبرس نے سلطنت کو الملک الظاہر کے طور پر لے لیا۔"
  tr: "Rukn al-Din Baybars al-Bunduqdari Halep'i arzuluyordu ve Kral al-Muzaffar Kutuz ona Halep'i vaat etmiş, sonra da geri dönmüştü. İkisi de birbirine kin besliyordu, bu yüzden Kutuz, 658. yılın Zilhicce ayının on altıncı gününde Katiya yakınlarında öldürüldü ve Kral al-Zahir olan Baybars sultan oldu. {cite:shadharat-dhahab s.299}"
  id: "Rukn al-Din Baybars al-Bunduqdari menginginkan Aleppo, dan Raja al-Muzaffar Qutuz telah menjanjikannya kepadanya lalu kembali. Masing-masing dari mereka menyimpan dendam terhadap yang lain, sehingga Qutuz dibunuh di dekat Qatiya pada tanggal enam belas Dzul Qa'dah tahun enam ratus lima puluh delapan, dan Baybars, raja al-Zahir, menjadi sultan. {cite:shadharat-dhahab p.299}"
