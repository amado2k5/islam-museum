label: { en: "The second migration to Abyssinia", ar: "الهجرة الثانية إلى الحبشة" }
summary:
  en: "When torture intensified after the first migrants' brief return, eighty-three men — Ammar's inclusion doubtful — and eighteen or nineteen women migrated again to Abyssinia; Quraysh sent Amr ibn al-As and Abdullah ibn Abi Rabi'a to win them back, but the Negus heard Ja'far ibn Abi Talib's account and sura Maryam, refused to surrender them, and returned the envoys' gifts."
  ar: "لما اشتد البلاء هاجر ثلاثة وثمانون رجلاً — يُشك في عدّ عمار فيهم — وثمان عشرة أو تسع عشرة امرأة إلى الحبشة ثانية؛ فأرسلت قريش عمرو بن العاص وعبد الله بن أبي ربيعة بالهدايا يستردونهم، فسمع النجاشي لجعفر بن أبي طالب ولسورة مريم، وأبى تسليمهم وردّ الهدايا."
