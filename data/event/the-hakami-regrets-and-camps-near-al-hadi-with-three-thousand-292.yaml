id: event/the-hakami-regrets-and-camps-near-al-hadi-with-three-thousand-292
class: event
kind: other
label:
  ar: "ندم الحكمي وجمعه العساكر ونزوله قرب الهادي بثلاثة آلاف رجل ومئتي فارس، ص296"
  en: "The Hakami regrets, gathers armies and camps near al-Hadi with three thousand men and two hundred horse, p. 296"
  ur: "حکمی کی پشیمانی، لشکر جمع کرنا اور تین ہزار پیادوں اور دو سو سواروں کے ساتھ ہادی کے قریب پڑاؤ، ص296"
  es: "El Hakami lamenta la pérdida, reúne ejércitos y acampa cerca de al-Hadi con tres mil hombres y doscientos caballos, pág. 296."
  fr: "Le Hakami regrette, rassemble des armées et campe près d'al-Hadi avec trois mille hommes et deux cents cavaliers, p. 296"
  tr: "El-Hakami, üç bin asker ve iki yüz süvariyle birliklerini toplayıp El-Hadi'ye saldırdığı için pişmanlık duydu (s. 296)."
  id: "Al-Hakami menyesal telah mengumpulkan pasukannya dan menyerang Al-Hadi dengan tiga ribu orang dan dua ratus penunggang kuda, hlm. 296"
summary:
  ar: "يندم الحكمي على ما كان منه فيجمع عساكر كثيرة ويخرج لحرب الهادي حتى ينزل قريباً منه في ثلاثة آلاف رجل وزيادة على مئتي فارس، والهادي في ثمانمئة راجل ومئة فارس، وفي حاشية الأصل أن الحكمي نكث وأخلف ما كان منه من العهود."
  en: "The Hakami regrets what he had done, gathers many armies and goes out to fight al-Hadi, camping near him with three thousand men and more than two hundred horse against al-Hadi's eight hundred foot and a hundred horse; a note in the margin of the original says that the Hakami broke and failed the pledges he had made."
  ur: "حکمی اپنے کیے پر پشیمان ہوتا ہے، بہت سے لشکر جمع کر کے ہادی سے لڑنے نکلتا ہے اور ان کے قریب تین ہزار پیادوں اور دو سو سے زیادہ سواروں کے ساتھ اترتا ہے، جب کہ ہادی کے ساتھ آٹھ سو پیادے اور سو سوار ہیں؛ اصل نسخے کے حاشیے میں لکھا ہے کہ حکمی نے عہد توڑے اور وعدے سے پھر گیا۔"
  es: "El Hakami se arrepiente de lo que había hecho, reúne muchos ejércitos y sale a luchar contra al-Hadi, acampando cerca de él con tres mil hombres y más de doscientos jinetes contra los ochocientos infantes y cien jinetes de al-Hadi; una nota al margen del original dice que el Hakami rompió y no cumplió las promesas que había hecho."
  fr: "Le Hakami regrette ses actes, rassemble de nombreuses armées et part combattre al-Hadi, campant près de lui avec trois mille hommes et plus de deux cents cavaliers contre les huit cents fantassins et les cent cavaliers d'al-Hadi; une note en marge de l'original indique que le Hakami a rompu et manqué aux promesses qu'il avait faites."
  tr: "El-Hakami yaptıklarından pişman olur, bu yüzden birçok asker toplar ve El-Hadi ile savaşmaya gider. Üç bin asker ve iki yüz süvariyle onun yanına yerleşir; El-Hadi'nin ise sekiz yüz piyadesi ve yüz süvarisi vardır. Orijinal metnin kenarında, El-Hakami'nin verdiği sözleri tutmadığı ve yaptığı anlaşmaları ihlal ettiği belirtilmiştir."
  id: "Al-Hakami menyesali perbuatannya, lalu ia mengumpulkan banyak tentara dan pergi berperang melawan Al-Hadi hingga akhirnya ia berada di dekatnya dengan tiga ribu orang dan tambahan dua ratus penunggang kuda, sementara Al-Hadi memiliki delapan ratus tentara infanteri dan seratus penunggang kuda. Di margin teks asli, dinyatakan bahwa Al-Hakami melanggar janjinya dan melanggar perjanjian yang telah dibuatnya."
