id: event/al-hadi-draws-up-his-ranks-at-hadaqan-and-two-men-ask-about-the-odds-288
class: event
kind: other
label:
  ar: "الهادي يعبئ عسكره بحدقان ويأتيه يزيد الشاكري وأبو رفاعة، محرم 288هـ"
  en: "Al-Hadi draws up his ranks at Hadaqan and two men come to him, Muharram 288 AH"
  ur: "ہادی حدقان میں اپنی صفیں آراستہ کرتے ہیں اور دو آدمی ان کے پاس آتے ہیں، محرم 288ھ"
  es: "Al-Hadi reúne a sus tropas en Hadaqan y dos hombres se acercan a él, Muharram 288 AH."
  fr: "Al-Hadi rassemble ses troupes à Hadaqan et deux hommes viennent à lui, Muharram 288 AH"
  tr: "El-Hadi, Hadkan ile birlikte ordusunu seferber eder ve Yazid el-Şakiri ile Ebu Rifa'a onun yanına gelirler. Muharrem 288 Hicri"
  id: "Al-Hadi mengerahkan pasukannya bersama Hadqan, dan Yazid al-Shakiri serta Abu Rifa’a datang kepadanya, Muharram 288 H."
summary:
  ar: "يعبئ الهادي عسكره ميمنة وميسرة وقلباً بحدقان، وأصحابه نحو مائة وخمسين فارساً وستمائة راجل بحسب الراوي، ويذكر المحقق عن غاية الأماني نحو سبعمائة وخمسين، فيأتيه يزيد بن علي بن جميل الشاكري ورجل خثعمي يقال له أبو رفاعة ويقولان له يا بن، وينقطع الخبر عند آخر الصفحة."
  en: "Al-Hadi draws up his army in right, left and centre at Hadaqan, about a hundred and fifty horse and six hundred foot by the narrator's count (the editor quotes Ghayat al-Amani for about seven hundred and fifty in all), and Yazid ibn Ali ibn Jamil al-Shakiri and a Khath'ami called Abu Rifa'a come to him and begin to speak, the account breaking off at the foot of the page."
  ur: "ہادی حدقان میں اپنے لشکر کو دائیں، بائیں اور قلب میں آراستہ کرتے ہیں، راوی کی گنتی میں تقریباً ڈیڑھ سو سوار اور چھ سو پیادے، اور مدیر غایۃ الامانی سے مجموعی طور پر قریب ساڑھے سات سو نقل کرتا ہے؛ یزید بن علی بن جمیل شاکری اور خثعم کا ایک آدمی ابو رفاعہ ان کے پاس آ کر بات شروع کرتے ہیں اور صفحے کے آخر میں بیان ٹوٹ جاتا ہے۔"
  es: "Al-Hadi despliega su ejército a derecha, izquierda y centro en Hadaqan, unos ciento cincuenta jinetes y seiscientos infantes según el recuento del narrador (el editor cita a Ghayat al-Amani, que menciona unos setecientos cincuenta en total), y Yazid ibn Ali ibn Jamil al-Shakiri y un Khath'ami llamado Abu Rifa'a se acercan a él y comienzan a hablar, interrumpiéndose el relato al pie de la página."
  fr: "Al-Hadi déploie son armée à droite, à gauche et au centre à Hadaqan, soit environ cent cinquante cavaliers et six cents fantassins selon le décompte du narrateur (l'éditeur cite Ghayat al-Amani pour environ sept cent cinquante au total), et Yazid ibn Ali ibn Jamil al-Shakiri et un Khath'ami appelé Abu Rifa'a viennent à lui et commencent à parler, le récit s'interrompant au bas de la page."
  tr: "Al-Hadi, ordusunu sağda, solda ve merkezde iki kol halinde seferber etti. Anlatıcıya göre, yoldaşlarının sayısı yaklaşık yüz elli süvari ve altı yüz piyadeydi. Araştırmacı, Ghayat al-Amani'de yedi yüz elli civarında bir sayıdan bahsediyor. Sonra Yezid bin Ali bin Cemil el-Şakiri ve Ebu Rifa'a adında bir Hatmili ona gelip, \"Ey oğlum,\" dediler ve haber sayfanın sonunda sona eriyor."
  id: "Al-Hadi mengerahkan pasukannya di kanan, kiri, dan tengah dengan dua lengan. Menurut perawi, para pengikutnya berjumlah sekitar seratus lima puluh penunggang kuda dan enam ratus prajurit infanteri. Peneliti menyebutkan sekitar tujuh ratus lima puluh dalam Ghayat al-Amani. Kemudian Yazid bin Ali bin Jamil al-Shakiri dan seorang pria Khatami bernama Abu Rifa’a datang kepadanya dan berkata kepadanya, “Wahai putraku,” dan berita berakhir di akhir halaman."
