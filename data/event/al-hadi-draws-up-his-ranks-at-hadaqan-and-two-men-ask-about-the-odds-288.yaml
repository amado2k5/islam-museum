label:
  ar: "الهادي يعبئ عسكره بحدقان ويأتيه يزيد الشاكري وأبو رفاعة، محرم 288هـ"
  en: "Al-Hadi draws up his ranks at Hadaqan and two men come to him, Muharram 288 AH"
  ur: "ہادی حدقان میں اپنی صفیں آراستہ کرتے ہیں اور دو آدمی ان کے پاس آتے ہیں، محرم 288ھ"
summary:
  ar: "يعبئ الهادي عسكره ميمنة وميسرة وقلباً بحدقان، وأصحابه نحو مائة وخمسين فارساً وستمائة راجل بحسب الراوي، ويذكر المحقق عن غاية الأماني نحو سبعمائة وخمسين، فيأتيه يزيد بن علي بن جميل الشاكري ورجل خثعمي يقال له أبو رفاعة ويقولان له يا بن، وينقطع الخبر عند آخر الصفحة."
  en: "Al-Hadi draws up his army in right, left and centre at Hadaqan, about a hundred and fifty horse and six hundred foot by the narrator's count (the editor quotes Ghayat al-Amani for about seven hundred and fifty in all), and Yazid ibn Ali ibn Jamil al-Shakiri and a Khath'ami called Abu Rifa'a come to him and begin to speak, the account breaking off at the foot of the page."
  ur: "ہادی حدقان میں اپنے لشکر کو دائیں، بائیں اور قلب میں آراستہ کرتے ہیں، راوی کی گنتی میں تقریباً ڈیڑھ سو سوار اور چھ سو پیادے، اور مدیر غایۃ الامانی سے مجموعی طور پر قریب ساڑھے سات سو نقل کرتا ہے؛ یزید بن علی بن جمیل شاکری اور خثعم کا ایک آدمی ابو رفاعہ ان کے پاس آ کر بات شروع کرتے ہیں اور صفحے کے آخر میں بیان ٹوٹ جاتا ہے۔"
