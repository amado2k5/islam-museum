label: { ar: "زلزلة الدينور العظيمة", en: "The great earthquake of Dinawar" }
summary:
  ar: "في ليلة الأحد سادس عشر شعبان سنة ثمان وتسعين حدثت زلزلة عظيمة بالدينور هدمت المنازل وهلك فيها أكثر من ستة عشر ألف إنسان غير من خسفت به الأرض وطمه الهدم، وخرج السالمون إلى الصحراء فأقاموا في أكواخ عملوها، وذهب من الأثاث والمتاع فيما تهدم ما لا يحصى {cite:muntazam-ibn-al-jawzi j.7 p.239}."
  en: "On the night of Sunday, the sixteenth of Sha'ban of the year ninety-eight, a great earthquake struck Dinawar and levelled the houses. More than sixteen thousand people died, not counting those the earth swallowed up and those the rubble buried. The survivors went out into the desert and stayed in huts they built, and an uncountable amount of furniture and goods was lost in the collapse {cite:muntazam-ibn-al-jawzi j.7 p.239}."
