id: event/dinawar-earthquake-398
class: event
kind: other
label: { ar: "زلزلة الدينور العظيمة", en: "The great earthquake of Dinawar", es: "El gran terremoto de Dinawar", fr: "Le grand tremblement de terre de Dinawar" }
summary:
  ar: "في ليلة الأحد سادس عشر شعبان سنة ثمان وتسعين حدثت زلزلة عظيمة بالدينور هدمت المنازل وهلك فيها أكثر من ستة عشر ألف إنسان غير من خسفت به الأرض وطمه الهدم، وخرج السالمون إلى الصحراء فأقاموا في أكواخ عملوها، وذهب من الأثاث والمتاع فيما تهدم ما لا يحصى {cite:muntazam-ibn-al-jawzi j.7 p.239}."
  en: "On the night of Sunday, the sixteenth of Sha'ban of the year ninety-eight, a great earthquake struck Dinawar and levelled the houses. More than sixteen thousand people died, not counting those the earth swallowed up and those the rubble buried. The survivors went out into the desert and stayed in huts they built, and an uncountable amount of furniture and goods was lost in the collapse {cite:muntazam-ibn-al-jawzi j.7 p.239}."
  es: "La noche del domingo dieciséis de Sha'ban del año noventa y ocho, un gran terremoto sacudió Dinawar y arrasó las casas. Murieron más de dieciséis mil personas, sin contar las que quedaron sepultadas bajo los escombros. Los supervivientes se refugiaron en el desierto, en chozas que construyeron, y se perdió una cantidad incalculable de muebles y bienes en el derrumbe {cite:muntazam-ibn-al-jawzi j.7 p.239}."
  fr: "Dans la nuit du dimanche 16 Sha'ban de l'an 98, un violent tremblement de terre frappa Dinawar et rasa les maisons. Plus de seize mille personnes périrent, sans compter celles englouties par la terre et ensevelies sous les décombres. Les survivants se réfugièrent dans le désert, dans des huttes qu'ils avaient construites. Une quantité incalculable de meubles et de biens fut perdue dans l'effondrement."
