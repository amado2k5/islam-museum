id: "event/mosque-at-thaat-burned-with-the-people-inside-in-dhu-al-hijja-293-ah"
class: event
kind: other
label:
  ar: "إحراق مسجد ثات بمن فيه لتسع ليال خلت من ذي الحجة سنة 293هـ، ص393"
  en: "The mosque at Tha'at is burned with the people inside nine nights into Dhu al-Hijja 293 AH, p. 393"
  ur: "ذوالحجہ 293ھ کی نو راتیں گزرنے پر ثات کی مسجد اندر موجود لوگوں سمیت جلا دی جاتی ہے، ص393"
  es: "La mezquita de Tha'at se incendia con la gente dentro nueve noches después del inicio de Dhu al-Hijja 293 AH, pág. 393."
  fr: "La mosquée de Tha'at est incendiée avec ses occupants pendant neuf nuits, au début du mois de Dhu al-Hijja 293 AH, p. 393"
  tr: "Hicri 293 yılının Zilhicce ayının dokuzuncu gecesinde Mescid-i Şerif'in içindekilerle birlikte yakılması, s. 393"
  id: "Peristiwa terbakarnya Masjid itu beserta penghuninya pada malam kesembilan Dzul Hijjah tahun 293 H, hlm. 393"
summary:
  ar: "تُحرق مسجد ثات بمن فيها من الرجال والنساء والأطفال لتسع ليال خلت من ذي الحجة سنة 293هـ، ويعزو الكتاب الفعل إلى القرمطي وأصحابه."
  en: "The book says the mosque at Tha'at was set on fire with the men, women and children inside, nine nights into Dhu al-Hijja 293 AH, and attributes the burning to the Qarmatian and his followers."
  ur: "کتاب کے مطابق ذوالحجہ 293ھ کی نو راتیں گزرنے پر ثات کی مسجد کو اس کے اندر موجود مردوں، عورتوں اور بچوں سمیت جلا دیا گیا، اور کتاب یہ فعل قرمطی اور اس کے ساتھیوں سے منسوب کرتی ہے۔"
  es: "El libro afirma que la mezquita de Tha'at fue incendiada con hombres, mujeres y niños dentro, nueve noches después del inicio de Dhu al-Hijja 293 AH, y atribuye el incendio al Qarmatian y sus seguidores."
  fr: "Le livre indique que la mosquée de Tha'at a été incendiée avec les hommes, les femmes et les enfants à l'intérieur, neuf nuits après le début du mois de Dhu al-Hijja 293 AH, et attribue l'incendie au Qarmate et à ses partisans."
  tr: "O Mescid, Hicri 293 yılının Zilhicce ayının son dokuz gecesinde, içinde erkekler, kadınlar ve çocuklar varken yakıldı ve kitap bu eylemi Karmatilere ve onların arkadaşlarına atfediyor."
  id: "Masjid itu dibakar habis bersama laki-laki, perempuan, dan anak-anak di dalamnya pada sembilan malam terakhir bulan Dzul Hijjah tahun 293 Hijriah, dan kitab tersebut menghubungkan perbuatan itu kepada kaum Qarmatian dan para pengikut mereka."
