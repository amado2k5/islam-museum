id: event/tirmidhi-bukhari-praise-245
class: event
kind: other
label:
  ar: "شهادة البخاري للترمذي: «ما انتفعتُ بك أكثرُ مما انتفعتَ بي»، نحو ٢٤٥هـ"
  en: "Al-Bukhari's testimony to al-Tirmidhi: 'I benefited from you more than you benefited from me', c. 245/860"
  ur: "بخاری کی ترمذی کے حق میں گواہی: «میں تم سے زیادہ فائدہ اٹھایا»، تقریباً 245ھ/860ء"
  es: "Testimonio de Al-Bujari a Al-Tirmidhi: «Yo me beneficié más de ti que tú de mí», c. 245/860"
  fr: "Témoignage d'Al-Bukhari à al-Tirmidhi: « J'ai bénéficié de toi plus que tu n'as bénéficié de moi », c. 245/860"
  tr: "Buhari'nin Tirmizi'ye verdiği şahitlik: \"Ben senden, senin benden fayda gördüğünden daha fazla fayda görmedim.\" (Hicri 245 civarı)"
  id: "Kesaksian Al-Bukhari kepada Al-Tirmidhi: \"Aku tidak mendapat manfaat darimu lebih banyak daripada manfaat yang kau dapatkan dariku,\" sekitar tahun 245 Hijriah."
summary:
  ar: "تلمذ الترمذي للبخاري فمرَّنه بين يديه وأخذ عنه أصول النقد وفقه الحديث حتى برز على الأقران، وشهد له البخاري نفسه بقوله: «ما انتفعتُ بك أكثرُ مما انتفعتَ بي»، وعُدّ خليفة البخاري في خراسان علماً وحفظاً وورعاً {cite:mawsuat-a3lam-ulama-adaba p. 451}، وهو في عداد تلاميذه {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
  en: "Al-Tirmidhi apprenticed himself to al-Bukhari, who trained him and from whom he took the principles of hadith criticism and fiqh until he stood out among his peers; al-Bukhari himself testified to him, saying 'I benefited from you more than you benefited from me', and he was counted al-Bukhari's successor in Khurasan for knowledge, memory and scrupulosity {cite:mawsuat-a3lam-ulama-adaba p. 451}, numbering among his pupils {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
  ur: "ترمذی بخاری کے تلمذ ہوئے جنہوں نے ان کی تربیت کی اور جن سے انہوں نے اصولِ تنقید اور فقہِ حدیث سیکھا یہاں تک کہ ہم عصروں میں ممتاز ہو گئے؛ خود بخاری نے ان کے حق میں گواہی دی: «میں تم سے زیادہ فائدہ اٹھایا»، اور وہ علم، حفظ اور ورع میں بخاری کے خراسان میں جانشین شمار ہوئے {cite:mawsuat-a3lam-ulama-adaba p. 451} اور ان کے تلامذہ میں شمار کیے گئے {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}۔"
  es: "Al-Tirmidhi fue aprendiz de al-Bukhari, quien lo instruyó y de quien tomó los principios de la crítica de hadices y fiqh hasta que se destacó entre sus pares; el propio al-Bukhari dio testimonio de él, diciendo 'Yo me beneficié de ti más de lo que tú te beneficiaste de mí', y fue considerado el sucesor de al-Bukhari en Jorasán por su conocimiento, memoria y escrupulosidad {cite:mawsuat-a3lam-ulama-adaba p. 451}, figurando entre sus discípulos {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
  fr: "Al-Tirmidhi se mit en apprentissage auprès d'al-Bukhari, qui le forma et dont il tira les principes de la critique des hadiths et du fiqh jusqu'à ce qu'il se distingue parmi ses pairs; al-Bukhari lui-même témoigna de lui, disant: « J'ai bénéficié de toi plus que tu n'as bénéficié de moi », et il fut considéré comme le successeur d'al-Bukhari au Khorasan pour ses connaissances, sa mémoire et sa scrupule {cite:mawsuat-a3lam-ulama-adaba p. 451}, comptant parmi ses élèves {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
  tr: "Tirmizi, Buhari'nin öğrencisi oldu; Buhari onu eğitti ve ondan eleştiri ilkelerini ve hadis fıkıhını öğrendi, öyle ki akranlarını geride bıraktı. Buhari'nin kendisi de bunu şöyle tasdik etti: \"Ben senden, senin benden aldığın faydadan daha fazla fayda görmedim.\" Tirmizi, Horasan'da ilim, ezber ve takva bakımından Buhari'nin halefi olarak kabul edildi (kaynak: mawsuat-a3lam-ulama-adaba, s. 451) ve onun öğrencileri arasında sayılır (kaynak: encyclopaedia-of-islam-2, cilt 10, s. 579)."
  id: "Al-Tirmidhi menjadi murid Al-Bukhari, yang melatihnya dan ia belajar darinya prinsip-prinsip kritik dan fiqih hadits hingga ia melampaui rekan-rekannya. Al-Bukhari sendiri bersaksi tentang hal ini dengan mengatakan: “Aku tidak mendapat manfaat darimu lebih banyak daripada manfaat yang kau dapatkan dariku.” Ia dianggap sebagai penerus Al-Bukhari di Khorasan dalam hal pengetahuan, hafalan, dan ketakwaan {cite:mawsuat-a3lam-ulama-adaba hlm. 451}, dan ia termasuk di antara murid-muridnya {cite:encyclopaedia-of-islam-2 vol. 10 hlm. 579}."
