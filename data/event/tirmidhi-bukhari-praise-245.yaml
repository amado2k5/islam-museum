id: event/tirmidhi-bukhari-praise-245
class: event
kind: other
label:
  ar: "شهادة البخاري للترمذي: «ما انتفعتُ بك أكثرُ مما انتفعتَ بي»، نحو ٢٤٥هـ"
  en: "Al-Bukhari's testimony to al-Tirmidhi: 'I benefited from you more than you benefited from me', c. 245/860"
  ur: "بخاری کی ترمذی کے حق میں گواہی: «میں تم سے زیادہ فائدہ اٹھایا»، تقریباً 245ھ/860ء"
summary:
  ar: "تلمذ الترمذي للبخاري فمرَّنه بين يديه وأخذ عنه أصول النقد وفقه الحديث حتى برز على الأقران، وشهد له البخاري نفسه بقوله: «ما انتفعتُ بك أكثرُ مما انتفعتَ بي»، وعُدّ خليفة البخاري في خراسان علماً وحفظاً وورعاً {cite:mawsuat-a3lam-ulama-adaba p. 451}، وهو في عداد تلاميذه {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
  en: "Al-Tirmidhi apprenticed himself to al-Bukhari, who trained him and from whom he took the principles of hadith criticism and fiqh until he stood out among his peers; al-Bukhari himself testified to him, saying 'I benefited from you more than you benefited from me', and he was counted al-Bukhari's successor in Khurasan for knowledge, memory and scrupulosity {cite:mawsuat-a3lam-ulama-adaba p. 451}, numbering among his pupils {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}."
  ur: "ترمذی بخاری کے تلمذ ہوئے جنہوں نے ان کی تربیت کی اور جن سے انہوں نے اصولِ تنقید اور فقہِ حدیث سیکھا یہاں تک کہ ہم عصروں میں ممتاز ہو گئے؛ خود بخاری نے ان کے حق میں گواہی دی: «میں تم سے زیادہ فائدہ اٹھایا»، اور وہ علم، حفظ اور ورع میں بخاری کے خراسان میں جانشین شمار ہوئے {cite:mawsuat-a3lam-ulama-adaba p. 451} اور ان کے تلامذہ میں شمار کیے گئے {cite:encyclopaedia-of-islam-2 vol. 10 p. 579}۔"
