label: { ar: "أخذ بيبرس صفد سنة 664هـ", en: "Baybars takes Safed, 664", fr: "Baybars prend Safed, 664", es: "Baybars toma Safed, 664", ur: "Baybars لیتا ہے Safed، 664", tr: "Baybars, Hicri 664 yılında Safed'i ele geçirdi.", id: "Baybars merebut Safed pada tahun 664 AH." }
summary:
  ar: "غزا الملك الظاهر سنة أربع وستين وبث جيوشه بالسواحل فأغاروا على بلاد عكا وصور وطرابلس وحصن الأكراد، ثم نزل على صفد في ثامن رمضان وأخذت في أربعين يوماً بخديعة ثم ضربت رقاب مائتين من فرسانهم، وقد استشهد عليها خلق كثير {cite:shadharat-dhahab p. 546}."
  en: "Baybars's coastal campaign of 664 — his columns raided Acre, Tyre, Tripoli and Hisn al-Akrad, then he sat down before Safed on 8 Ramadan; the great Templar fortress was tricked into surrender in forty days, two hundred of its knights were beheaded, and many of the besiegers fell martyred beneath it {cite:shadharat-dhahab p. 546}."
  fr: "La campagne côtière de Baybars en 664 : ses colonnes razzièrent Acre, Tyr, Tripoli et Hisn al-Akrad, puis il mit le siège devant Safed le 8 Ramadan ; la grande forteresse templière fut amenée par ruse à se rendre en quarante jours, deux cents de ses chevaliers furent décapités, et beaucoup des assiégeants tombèrent en martyrs à son pied {cite:shadharat-dhahab p. 546}."
  es: "La campaña costera de Baybars en 664 —sus columnas saquearon Acre, Tiro, Trípoli e Hisn al-Akrad, luego se sentó ante Safed el 8 de Ramadán; la gran fortaleza templaria fue engañada para que se rindiera en cuarenta días, doscientos de sus caballeros fueron decapitados y muchos de los sitiadores cayeron martirizados bajo ella {cite:shadharat-dhahab p. 546}."
  ur: "Baybars کی 664 کی ساحلی مہم - اس کے کالموں نے ایکر، ٹائر، طرابلس اور حسن الکراد پر چھاپہ مارا، پھر وہ 8 رمضان کو صفد سے پہلے بیٹھ گیا۔ عظیم ٹیمپلر قلعہ کو چالیس دنوں میں ہتھیار ڈالنے کے لیے دھوکہ دیا گیا، اس کے دو سو شورویروں کے سر قلم کیے گئے، اور بہت سے محاصرہ کرنے والے اس کے نیچے گر کر شہید ہو گئے۔ 546}۔"
  tr: "Kral Zahir, 64. yılda istilaya girişti ve ordularını kıyılara yayarak Akka, Sur, Trablus topraklarını ve Kürtlerin kalesini yağmaladı. Sonra Ramazan'ın sekizinci günü Safed'e indi ve kırk gün içinde hileyle şehri ele geçirdi. Ardından iki yüz şövalyesinin başını kesti ve bu yüzden birçok insan şehit oldu. {Kaynak: Şadharat-Dhaba, s. 546}"
  id: "Raja Al-Zahir menyerbu pada tahun enam puluh empat dan menyebarkan pasukannya di pesisir, sehingga mereka menjarah tanah Acre, Tyre, Tripoli dan benteng Kurdi. Kemudian ia turun ke Safed pada tanggal delapan Ramadan dan merebutnya dalam empat puluh hari dengan tipu daya. Kemudian ia memenggal kepala dua ratus ksatria mereka, dan banyak orang menjadi syuhada karenanya. {cite:shadharat-dhahab p. 546}."
