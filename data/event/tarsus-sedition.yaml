id: event/tarsus-sedition
class: event
kind: revolt
label: { ar: "الفتنة بطرسوس", en: "The Sedition at Tarsus", es: "La sedición en Tarso", fr: "La sédition de Tarse", ur: "ترسس میں بغاوت", tr: "Tarsus'taki çatışmalar", id: "Konflik di Tarsus" }
summary:
  ar: "في سنة تسع وسبعين ومائتين ذكر الطبري الفتنة بطرسوس، وكانت ملحمة بين محمد بن موسى الأعرج ومكنون غلام راغب، ثم أطلق خمارويه راغباً وولّى أحمد بن طغان الثغور {cite:tabari-tarikh-abu-al-fadl j.10 p.28} {cite:tabari-tarikh-abu-al-fadl j.10 p.29}."
  en: "In 279 al-Tabari records the sedition at Tarsus, a bloody encounter between Muhammad ibn Musa al-A'raj and Makhnun, the youth of Raghib; then Khumarawayh released Raghib and appointed Ahmad ibn Tughan over the frontier districts. {cite:tabari-tarikh-abu-al-fadl j.10 p.28} {cite:tabari-tarikh-abu-al-fadl j.10 p.29}"
  es: "En 279 al-Tabari registra la sedición de Tarso, un encuentro sangriento entre Muhammad ibn Musa al-A'raj y Makhnun, el joven de Raghib; luego Khumarawayh liberó a Raghib y nombró a Ahmad ibn Tughan al frente de los distritos fronterizos. {cita:tabari-tarikh-abu-al-fadl j.10 p.28} {cita:tabari-tarikh-abu-al-fadl j.10 p.29}"
  fr: "En 279, al-Tabari rapporte la sédition de Tarse, une rencontre sanglante entre Muhammad ibn Musa al-A'raj et Makhnun, le jeune de Raghib; puis Khumarawayh libéra Raghib et nomma Ahmad ibn Tughan sur les districts frontaliers. {cite:tabari-tarikh-abu-al-fadl j.10 p.28} {cite:tabari-tarikh-abu-al-fadl j.10 p.29}"
  ur: "279 میں الطبری نے ترسس میں فتنہ درج کیا ہے، جو محمد بن موسیٰ العراج اور راغب کے نوجوان مخنون کے درمیان خونی معرکہ آرائی ہے۔ پھر خماراویہ نے راغب کو رہا کر دیا اور احمد بن تغان کو سرحدی اضلاع پر مقرر کیا۔ {حوالہ:طبری-تاریخ-ابو الفضل ج.10 ص28} {حوالہ:طبری-تاریخ-ابو الفضل ج.10 ص29}"
  tr: "279 yılında Taberi, Tarsus'taki çatışmadan bahsetmiş ve Muhammed ibn Musa el-Araj ile Raghib'in kölesi Maknun arasında bir savaş çıktığını belirtmiştir. Bunun üzerine Humarawayh, Raghib'i serbest bırakmış ve Ahmed ibn Taghan'ı sınır bölgelerinin valisi olarak atamıştır. {cite:tabari-tarikh-abu-al-fadl j.10 p.28} {cite:tabari-tarikh-abu-al-fadl j.10 p.29}"
  id: "Pada tahun 279, al-Tabari menyebutkan perselisihan di Tarsus, dan terjadi pertempuran antara Muhammad ibn Musa al-Araj dan Maknun, budak Raghib. Kemudian Khumarawayh membebaskan Raghib dan mengangkat Ahmad ibn Taghan sebagai gubernur wilayah perbatasan. {cite:tabari-tarikh-abu-al-fadl j.10 p.28} {cite:tabari-tarikh-abu-al-fadl j.10 p.29}."
