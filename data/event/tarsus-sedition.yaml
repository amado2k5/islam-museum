  en: "In 279 al-Tabari records the sedition at Tarsus, a bloody encounter between Muhammad ibn Musa al-A'raj and Makhnun, the youth of Raghib; then Khumarawayh released Raghib and appointed Ahmad ibn Tughan over the frontier districts. {cite:tabari-tarikh-abu-al-fadl j.10 p.28} {cite:tabari-tarikh-abu-al-fadl j.10 p.29}"
