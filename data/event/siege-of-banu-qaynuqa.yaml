summary:
  en: "A fifteen-day siege of the Jewish tribe Banu Qaynuqa in Shawwal 2 AH after their breach of the covenant; ended in their unconditional surrender and expulsion from Medina."
  ar: "حصار فرضه النبي على بني قينقاع في شوال سنة 2هـ دام خمس عشرة ليلة بعد نقضهم العهد واعتدائهم في سوقهم؛ انتهى بنزولهم على حكمه وإجلائهم إلى أذرعات بالشام."
  es: "Un asedio de quince días a la tribu judía Banu Qaynuqa en Shawwal del año 2 de la Hégira, tras su incumplimiento del pacto; que culminó con su rendición incondicional y su expulsión de Medina."
  fr: "Un siège de quinze jours contre la tribu juive des Banu Qaynuqa en Shawwal 2 AH après leur rupture de l'alliance; se termina par leur reddition inconditionnelle et leur expulsion de Médine."
  ur: "عہد شکنی کے بعد شوال 2 ہجری میں یہودی قبیلہ بنو قینقاع کا پندرہ روزہ محاصرہ؛ ان کے غیر مشروط ہتھیار ڈالنے اور مدینہ سے بے دخلی پر ختم ہوا۔"
  tr: "Hicri 2. yılın Şevval ayında, Beni Kaynuka kabilesinin antlaşmayı bozup çarşılarına saldırmasının ardından Peygamber tarafından uygulanan kuşatma on beş gece sürmüş; kuşatma, kabilenin Peygamberin yönetimine boyun eğmesi ve Levant'taki Adhra'at'a sürülmesiyle sona ermiştir."
  id: "Pengepungan yang dilakukan Nabi terhadap Bani Qaynuqa’ pada bulan Syawal tahun 2 Hijriah berlangsung selama lima belas malam setelah mereka melanggar perjanjian dan menyerang pasar mereka; pengepungan itu berakhir dengan mereka tunduk pada pemerintahannya dan diusir ke Adhra’at di Levant."
