label: { ar: "زلازل الري وخسف الطالقان", en: "The earthquakes of Rayy and the sinking of Talaqan", es: "Los terremotos de Rayy y el hundimiento de Talaqan", fr: "Les tremblements de terre de Rayy et le naufrage de Talaqan" }
summary:
  ar: "في سنة ست وأربعين نقص البحر ثمانين ذراعاً وظهر فيه جبال وجزائر وأشياء لم تعهد وكان بالري ونواحيها زلازل عظيمة وخسف ببلد الطالقان ولم يفلت من أهلها إلا نحو ثلاثين رجلاً وخسف بمئة وخمسين قرية من قرى الري واتصل الأمر إلى حلوان فخسف بأكثرها وقذفت الأرض عظام الموتى وتفجرت منها المياه وتقطع بالري جبل وعلقت قرية بين السماء والأرض بمن فيها نصف النهار ثم خسف بها وانخرقت الأرض خروقاً عظيمة وخرج منها مياه منتنة ودخان عظيم هكذا نقل ابن الجوزي وفي سنة سبع عادت الزلازل بقم وحلوان والجبال فأتلفت خلقاً عظيماً {cite:tarikh-khulafa-minhaj-1434 p. 617-618}. وعند ابن الجوزي في ذي الحجة سنة ست وأربعين كانت بالري ونواحيها زلزلة عظيمة مات فيها خلق كثير {cite:muntazam-ibn-al-jawzi p. 670}."
  en: "In 346 the sea fell eighty cubits and isles and hills appeared in it; huge earthquakes struck Rayy — Talaqan was swallowed with all but some thirty men, a hundred and fifty of Rayy's villages sank, Hulwan mostly followed, the earth cast up the dead's bones and burst with water, a mountain was split, and, as Ibn al-Jawzi relays, a village hung suspended between heaven and earth half a day with its people before it sank, the ground gaping with stinking water and great smoke; the quakes returned to Qumm, Hulwan and the mountains in 347 {cite:tarikh-khulafa-minhaj-1434 p. 617-618}."
  es: "En 346 el mar bajó ochenta codos y aparecieron islas y colinas en él; enormes terremotos azotaron Rayy: Talaqan fue engullido con todos excepto unos treinta hombres, ciento cincuenta aldeas de Rayy se hundieron, Hulwan siguió en su mayoría, la tierra arrojó los huesos de los muertos y se abrió con agua, una montaña se partió y, como relata Ibn al-Jawzi, una aldea quedó suspendida entre el cielo y la tierra durante medio día con su gente antes de hundirse, el suelo abierto con agua fétida y gran humo; los terremotos regresaron a Qumm, Hulwan y las montañas en 347 {cite:tarikh-khulafa-minhaj-1434 p. 617-618}."
  fr: "En 346, la mer baissa de quatre-vingts coudées et des îles et des collines y apparurent; d'énormes tremblements de terre frappèrent Rayy — Talaqan fut engloutie avec tous ses habitants sauf une trentaine, cent cinquante villages de Rayy s'enfoncèrent, Hulwan suivit pour la plupart, la terre rejeta les ossements des morts et éclata d'eau, une montagne se fendit et, comme le relate Ibn al-Jawzi, un village resta suspendu entre ciel et terre pendant une demi-journée avec ses habitants avant de sombrer, le sol béant d'eau nauséabonde et d'une épaisse fumée; les tremblements de terre revinrent à Qumm, Hulwan et aux montagnes en 347 {cite:tarikh-khulafa-minhaj-1434 p. 617-618}."
