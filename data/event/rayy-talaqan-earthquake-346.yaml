label: { ar: "زلازل الري وخسف الطالقان" }
summary:
  ar: "في سنة ست وأربعين نقص البحر ثمانين ذراعاً وظهر فيه جبال وجزائر وأشياء لم تعهد وكان بالري ونواحيها زلازل عظيمة وخسف ببلد الطالقان ولم يفلت من أهلها إلا نحو ثلاثين رجلاً وخسف بمئة وخمسين قرية من قرى الري واتصل الأمر إلى حلوان فخسف بأكثرها وقذفت الأرض عظام الموتى وتفجرت منها المياه وتقطع بالري جبل وعلقت قرية بين السماء والأرض بمن فيها نصف النهار ثم خسف بها وانخرقت الأرض خروقاً عظيمة وخرج منها مياه منتنة ودخان عظيم هكذا نقل ابن الجوزي وفي سنة سبع عادت الزلازل بقم وحلوان والجبال فأتلفت خلقاً عظيماً {cite:tarikh-khulafa-minhaj-1434 p. 617-618}."
  en: "In 346 the sea fell eighty cubits and isles and hills appeared in it; huge earthquakes struck Rayy — Talaqan was swallowed with all but some thirty men, a hundred and fifty of Rayy's villages sank, Hulwan mostly followed, the earth cast up the dead's bones and burst with water, a mountain was split, and, as Ibn al-Jawzi relays, a village hung suspended between heaven and earth half a day with its people before it sank, the ground gaping with stinking water and great smoke; the quakes returned to Qumm, Hulwan and the mountains in 347 {cite:tarikh-khulafa-minhaj-1434 p. 617-618}."
