label: { ar: "بناء المدينة الهاشمية بالكوفة", en: "The Building of the Hashimite City at Kufa", fr: "La construction de la ville hachémite à Koufa", es: "La construcción de la ciudad hachemita en Kufa" }
summary:
  ar: "عند البلاذري: كان يزيد بن عمر بن هبيرة بنى مدينة بالكوفة على الفرات ونزلها ومنها شيء يسير لم يستتم فأتاه كتاب مروان يأمره باجتناب مجاورة أهل الكوفة فتركها وبنى القصر الذي يعرف بقصر ابن هبيرة بالقرب من جسر سورا فلما ظهر أمير المؤمنين أبو العباس نزل تلك المدينة واستتم مقاصيرها وأحدث فيها بناء وسماها الهاشمية فكان الناس ينسبونها إلى ابن هبيرة على العادة فقال ما أرى ذكر ابن هبيرة يسقط عنها فرذها وبنى بحيالها المدينة الهاشمية ونزلها ثم اختار نزول الأنبار فبنى بها مدينته المعروفة فلما توفي دفن بها واستخلف أبو جعفر المنصور فنزل المدينة الهاشمية بالكوفة واستتم شيئاً كان بقي منها وزاد فيها بناء وهيأها على ما أراد ثم تحول منها إلى بغداد فبنى مدينته ومصر بغداد وسماها مدينة السلام وأصلح سورها القديم الذي يبتدئ من دجلة وينتهي إلى الصراة وبالهاشمية حبس المنصور عبد الله بن حسن بن حسن بن علي بن أبي طالب بسبب ابنيه محمد وإبراهيم وبها قبره وبنى المنصور بالكوفة الرصافة وأمر أبا الخصيب مرزوقاً مولاه فبنى له القصر المعروف بأبي الخصيب على أساس قديم ويقال إن أبا الخصيب بناه لنفسه فكان المنصور يزوره فيه."
  en: "In al-Baladhuri: Yazid ibn Umar ibn Hubayra built a city at Kufa on the Euphrates and dwelt in it — save a little unfinished — when Marwan's letter came ordering him to shun the Kufans' neighborhood, so he left it and built the palace called Qasr Ibn Hubayra near Sura's bridge. When the Commander of the Faithful Abu al-Abbas rose he occupied that city, finished its pavilions, built in it and named it al-Hashimiyya; the people kept calling it Ibn Hubayra's out of habit, and he said 'I see Ibn Hubayra's name will not drop from it,' abandoned it, built the Hashimite City beside it and dwelt there, then chose al-Anbar where he built his famous city and was buried. Abu Ja'far al-Mansur, succeeding, dwelt in Kufa's Hashimiyya, finished what remained, added building and prepared it as he wished, then moved to Baghdad — founded it as Madinat al-Salam and repaired its old wall from the Tigris to al-Sarat. At al-Hashimiyya al-Mansur imprisoned Abdallah ibn al-Hasan ibn al-Hasan ibn Ali ibn Abi Talib over his sons Muhammad and Ibrahim — his grave is there — and built al-Rusafa at Kufa, ordering his mawla Abu al-Khasib Marzuq to build the palace called Abu al-Khasib's on an old foundation — it is also said Abu al-Khasib built it for himself and al-Mansur would visit him there."
  fr: "Chez al-Baladhuri : Yazid ibn Umar ibn Hubayra bâtit une ville à Koufa sur l'Euphrate et y habita, à l'exception d'une petite partie inachevée, quand vint la lettre de Marwan lui ordonnant d'éviter le voisinage des Koufiens ; il la quitta donc et bâtit le palais appelé Qasr Ibn Hubayra près du pont de Sura. Quand le Commandeur des croyants Abu al-Abbas prit le pouvoir, il occupa cette ville, en acheva les pavillons, y bâtit et la nomma al-Hashimiyya ; les gens continuaient de l'appeler ville d'Ibn Hubayra par habitude, et il dit : « Je vois que le nom d'Ibn Hubayra ne la quittera pas », l'abandonna, bâtit la ville hachémite à côté et y habita, puis choisit al-Anbar, où il bâtit sa célèbre ville et fut enterré. Abu Ja'far al-Mansur, lui succédant, habita la Hashimiyya de Koufa, acheva ce qui restait, y ajouta des constructions et l'aménagea à son gré, puis partit pour Bagdad, la fonda comme Madinat al-Salam et répara son vieux mur du Tigre jusqu'à al-Sarat. À al-Hashimiyya, al-Mansur emprisonna Abdallah ibn al-Hasan ibn al-Hasan ibn Ali ibn Abi Talib à cause de ses fils Muhammad et Ibrahim (sa tombe s'y trouve) et bâtit al-Rusafa à Koufa, ordonnant à son mawla Abu al-Khasib Marzuq de bâtir le palais appelé palais d'Abu al-Khasib sur une ancienne fondation ; on dit aussi qu'Abu al-Khasib le bâtit pour lui-même et qu'al-Mansur venait l'y visiter."
  es: "En al-Baladhuri: Yazid ibn Umar ibn Hubayra construyó una ciudad en Kufa, a orillas del Éufrates, y habitó en ella —salvo una pequeña parte sin terminar— cuando llegó la carta de Marwan ordenándole que evitara la región de Kufa. Entonces la abandonó y construyó el palacio llamado Qasr Ibn Hubayra cerca del puente de Sura. Cuando el Comandante de los Creyentes, Abu al-Abbas, ascendió al trono, ocupó esa ciudad, terminó sus pabellones, construyó en ella y la llamó al-Hashimiyya. La gente siguió llamándola Ibn Hubayra por costumbre, y él dijo: «Veo que el nombre de Ibn Hubayra no se borrará de ella». La abandonó, construyó la Ciudad Hachemita a su lado y habitó allí. Luego eligió al-Anbar, donde construyó su famosa ciudad y fue enterrado. Sucesor, Abu Ja'far al-Mansur residió en Hashimiyya, en Kufa, terminó lo que quedaba, añadió edificios y lo preparó a su gusto, para luego trasladarse a Bagdad, donde la fundó como Madinat al-Salam y reparó su antigua muralla desde el Tigris hasta al-Sarat. En al-Hashimiyya, al-Mansur encarceló a Abdallah ibn al-Hasan ibn al-Hasan ibn Ali ibn Abi Talib por sus hijos Muhammad e Ibrahim (su tumba se encuentra allí) y construyó al-Rusafa en Kufa, ordenando a su mawla Abu al-Khasib Marzuq que construyera el palacio llamado de Abu al-Khasib sobre unos cimientos antiguos. También se dice que Abu al-Khasib lo construyó para sí mismo y que al-Mansur lo visitaba allí."
