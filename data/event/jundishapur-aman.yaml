label: { ar: "أمان جنديسابور", en: "The Aman of Jundishapur" }
summary:
  ar: "سار أبو موسى إلى جنديسابور وأهلها منخوبون فطلبوا الأمان فصالحهم على أن لا يقتل منهم أحداً ولا يسبيه ولا يعرض لأموالهم سوى السلاح ثم إن طائفة من أهلها توجهوا إلى الكلبانية فأوجه إليهم الربيع بن زياد فقتلهم وفتح الكلبانية واستأمنت الأساورة فأمنهم أبو موسى فأسلموا."
  en: "Abu Musa marched on panic-struck Jundishapur; they asked aman and he truced: no killing, no captives, no hands on wealth but weapons. A band of its folk went off to al-Kalbaniyya — al-Rabi' ibn Ziyad killed them and took it; and the asawira sought aman, were granted it, and converted."
