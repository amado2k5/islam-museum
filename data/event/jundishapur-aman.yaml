id: event/jundishapur-aman
class: event
kind: treaty
label: { ar: "أمان جنديسابور", en: "The Aman of Jundishapur", es: "El Aman de Jundishapur", fr: "L'Aman de Jundishapur", ur: "جندیشا پور کی امان" }
summary:
  ar: "سار أبو موسى إلى جنديسابور وأهلها منخوبون فطلبوا الأمان فصالحهم على أن لا يقتل منهم أحداً ولا يسبيه ولا يعرض لأموالهم سوى السلاح ثم إن طائفة من أهلها توجهوا إلى الكلبانية فأوجه إليهم الربيع بن زياد فقتلهم وفتح الكلبانية واستأمنت الأساورة فأمنهم أبو موسى فأسلموا."
  en: "Abu Musa marched on panic-struck Jundishapur; they asked aman and he truced: no killing, no captives, no hands on wealth but weapons. A band of its folk went off to al-Kalbaniyya — al-Rabi' ibn Ziyad killed them and took it; and the asawira sought aman, were granted it, and converted."
  es: "Abu Musa marchó sobre Jundishapur, sumida en el pánico; le pidieron una tregua y él la concedió: nada de matar, nada de prisioneros, nada de riquezas, solo armas. Un grupo de sus habitantes partió hacia al-Kalbaniyya; al-Rabi' ibn Ziyad los mató y se apoderó de la ciudad; y los asawira pidieron una tregua, les fue concedida y se convirtieron."
  fr: "Abou Moussa marcha sur Jundishapur, ville paniquée. Les habitants demandèrent l'aman, et il conclut une trêve: pas de meurtre, pas de captifs, pas de possession des richesses, mais des armes. Un groupe d'habitants partit pour al-Kalbaniyya; al-Rabi' ibn Ziyad les tua et s'empara de la ville. Les asawira demandèrent alors l'aman, l'obtinrent et se convertirent."
  ur: "ابو موسیٰ نے گھبراہٹ میں جندیشا پور کی طرف کوچ کیا۔ انہوں نے امان سے پوچھا اور اس نے صلح کر لی: نہ قتل، نہ اسیر، نہ دولت پر ہاتھ بلکہ ہتھیار۔ اس کی قوم کا ایک گروہ الکلبانیہ کی طرف روانہ ہوا، ربیع ابن زیاد نے انہیں قتل کر کے لے لیا۔ اور اساویرا نے امان کی تلاش کی، اسے عطا کیا گیا، اور تبدیل کر دیا گیا۔"
