id: event/killing-of-jafar-and-the-barmakids
class: event
kind: death
label: { ar: "هلاك جعفر والبرامكة", en: "The downfall of Ja'far and the Barmakids", es: "La caída de Ja'far y los Barmakids", fr: "La chute de Ja'far et des Barmakids", ur: "جعفر اور برمکیوں کا زوال" }
summary:
  ar: "في سنة سبع وثمانين ومائة ذكر الطبري أن سبب هلاك جعفر والبرامكة أن الرشيد كان لا يصبر عن جعفر وعن أخته عباسة بنت المهدي {cite:tabari-tarikh-abu-al-fadl j.8 p.294}. وعند المسعودي بعث ياسراً خادمه فأخذ رأس جعفر ليلة السبت ثم قتله هو لأنه لا يقدر أن ينظر إلى قاتل جعفر، وكانت مدة دولتهم من استخلاف هارون إلى قتل جعفر سبع عشرة سنة وسبعة أشهر وخمسة عشر يوماً، وأصيب على باب قصر علي بن عيسى بن ماهان بخراسان صبيحة تلك الليلة مكتوب إن المساكين بنو برمك صبت عليهم غير الدهر إن لنا في أمرهم عبرة فليعتبر ساكن هذا القصر، ورثاهم أشجع السلمي وسلم الخاسر وصالح الأعرابي وأبو حزرة ومنصور النمري ودعبل الخزاعي، وكان الرشيد ينشد بعد نكبتهم إن استهانتها إذا وقعت لبقدر ما تعلو بها رتبه وإذا بدت للنمل أجنحة حتى يطير فقد دنا عطبه {cite:muruj-al-dhahab p. 364-369}"
  en: "In the year 187 al-Tabari reports that the reason for the downfall of Ja'far and the Barmakids was that al-Rashid could not endure being apart from Ja'far or from his sister Abbasa, daughter of al-Mahdi {cite:tabari-tarikh-abu-al-fadl j.8 p.294}. According to al-Mas'udi, he sent his servant Yasir, who took Ja'far's head on Saturday night and then killed him himself, since he could not bear to look at Ja'far's killer. The span of their rule, from Harun's accession to the killing of Ja'far, was seventeen years, seven months and fifteen days. On the morning after that night, a writing was found at the gate of the palace of Ali ibn Isa ibn Mahan in Khurasan: 'The poor Barmakids, on whom the vicissitudes of time have poured; for us there is a lesson in their affair, so let the resident of this palace take heed.' Ashja' al-Sulami, Salm al-Khasir, Salih al-A'rabi, Abu Hazra, Mansur al-Nimri and Di'bil al-Khuza'i composed elegies for them. After their disgrace, al-Rashid used to recite: 'Its humiliation when it falls is as great as the height of rank it reached, and when wings show on the ant until it flies, its ruin is near' {cite:muruj-al-dhahab p. 364-369}."
  es: "En el año 187, al-Tabari informa que la razón de la caída de Ja'far y los Barmakids fue que al-Rashid no pudo soportar estar separado de Ja'far ni de su hermana Abbasa, hija de al-Mahdi {cite:tabari-tarikh-abu-al-fadl j.8 p.294}. Según al-Mas'udi, envió a su sirviente Yasir, quien tomó la cabeza de Ja'far la noche del sábado y luego lo mató él mismo, ya que no pudo soportar mirar al asesino de Ja'far. El lapso de su gobierno, desde la ascensión de Harun hasta el asesinato de Ja'far, fue de diecisiete años, siete meses y quince días. En la mañana siguiente a esa noche, se encontró una inscripción en la puerta del palacio de Ali ibn Isa ibn Mahan en Jorasán: «Los pobres Barmakids, sobre quienes las vicisitudes del tiempo se han derramado; Para nosotros hay una lección en su asunto, así que que el residente de este palacio tome nota. Ashja' al-Sulami, Salm al-Khasir, Salih al-A'rabi, Abu Hazra, Mansur al-Nimri y Di'bil al-Khuza'i compusieron elegías para ellos. Después de su desgracia, al-Rashid solía recitar: «Su humillación al caer es tan grande como la altura que alcanzó, y cuando las alas se muestran en la hormiga hasta que vuela, su ruina está cerca» {cite:muruj-al-dhahab p. 364-369}."
  fr: "En l'an 187, al-Tabari rapporte que la chute de Ja'far et des Barmakides fut due à l'incapacité d'al-Rashid à supporter la séparation d'avec Ja'far et sa sœur Abbasa, fille d'al-Mahdi (cite: Tabari-Tarikh-Abu-al-Fadl, vol. 8, p. 294). Selon al-Mas'udi, il envoya son serviteur Yasir, qui prit la tête de Ja'far dans la nuit du samedi et l'acheva lui-même, ne pouvant supporter la vue de l'assassin. Leur règne, de l'accession au trône de Harun à la mort de Ja'far, dura dix-sept ans, sept mois et quinze jours. Le lendemain matin, une inscription fut découverte à la porte du palais d'Ali ibn Isa ibn Mahan, au Khorasan: « Pauvres Barmakides, accablés par les vicissitudes du temps… » Il y a pour nous une leçon à tirer de leur affaire; que le résident de ce palais y prête attention. Ashja' al-Sulami, Salm al-Khasir, Salih al-A'rabi, Abu Hazra, Mansur al-Nimri et Di'bil al-Khuza'i composèrent des élégies à leur mémoire. Après leur disgrâce, al-Rashid récitait: « L'humiliation de sa chute est à la mesure du rang qu'elle a atteint, et lorsque la fourmi déploie ses ailes jusqu'à ce qu'elle prenne son envol, sa ruine est proche. » (Voir: Muruj-al-Dhahab, p. 364-369)."
  ur: "الطبری نے سنہ 187 میں لکھا ہے کہ جعفر اور برمکیوں کے زوال کی وجہ یہ تھی کہ الرشید جعفر یا اپنی بہن عباسہ جو کہ المہدی کی بیٹی ہے، سے الگ رہنا برداشت نہیں کر سکتا تھا۔ المسعودی کے مطابق، اس نے اپنے نوکر یاسر کو بھیجا، جس نے ہفتے کی رات جعفر کا سر لیا اور پھر اسے خود قتل کر دیا، کیونکہ وہ جعفر کے قاتل کو دیکھنے کی برداشت نہیں کر سکتا تھا۔ ہارون کے الحاق سے لے کر جعفر کے قتل تک ان کی حکومت کا دورانیہ سترہ سال سات ماہ اور پندرہ دن تھا۔ اس رات کے بعد علی الصبح خراسان میں علی ابن عیسیٰ ابن ماہان کے محل کے دروازے پر ایک تحریر ملی: ''غریب برمکی جن پر وقت کے نشیب و فراز نے انڈیل دیا ہے۔ ہمارے لیے ان کے معاملہ میں عبرت ہے، لہٰذا اس محل کے رہنے والے نصیحت حاصل کریں۔ اشجع السلمی، سالم الخصیر، صالح العربی، ابو حضرہ، منصور النمری اور دیبل الخزاعی نے ان کے لیے تصانیف کیں۔ ان کی بے عزتی کے بعد الرشید یہ پڑھا کرتے تھے: 'جب گرتا ہے تو اس کی ذلت اتنی ہی زیادہ ہوتی ہے جتنی اس کے مرتبے کی بلندی تک پہنچ جاتی ہے اور جب چیونٹی پر پنکھ لگتے ہیں یہاں تک کہ وہ اڑ جائے تو اس کی بربادی قریب ہے'۔ 364-369}۔"
