label: { ar: "هلاك جعفر والبرامكة" }
summary:
  ar: "في سنة سبع وثمانين ومائة ذكر الطبري أن سبب هلاك جعفر والبرامكة أن الرشيد كان لا يصبر عن جعفر وعن أخته عباسة بنت المهدي {cite:tabari-tarikh-abu-al-fadl j.8 p.294}.، وعند المسعودي بعث ياسراً خادمه فأخذ رأس جعفر ليلة السبت ثم قتله هو لأنه لا يقدر أن ينظر إلى قاتل جعفر، وكانت مدة دولتهم من استخلاف هارون إلى قتل جعفر سبع عشرة سنة وسبعة أشهر وخمسة عشر يوماً، وأصيب على باب قصر علي بن عيسى بن ماهان بخراسان صبيحة تلك الليلة مكتوب إن المساكين بنو برمك صبت عليهم غير الدهر إن لنا في أمرهم عبرة فليعتبر ساكن هذا القصر، ورثاهم أشجع السلمي وسلم الخاسر وصالح الأعرابي وأبو حزرة ومنصور النمري ودعبل الخزاعي، وكان الرشيد ينشد بعد نكبتهم إن استهانتها إذا وقعت لبقدر ما تعلو بها رتبه وإذا بدت للنمل أجنحة حتى يطير فقد دنا عطبه {cite:muruj-al-dhahab p. 364-369}"
