summary:
  ar: "فتح قزوين: سيّر المغيرة البراء بن عازب في جيش فأتى أبهر فقاتلوه ثم طلبوا الأمان فصالحهم، ثم غزا قزوين فأرسل أهلها إلى الديلم يطلبون النصرة فوعدوهم، وخرج أهل قزوين لقتال المسلمين والديلم وقوف على الجبل لا يمدون يدًا، فلما رأى أهل قزوين ذلك طلبوا الصلح على صلح أبهر. وغزا البراء الديلم حتى أدوا الإتاوة وغزا جيلان والطيلسان وفتح زنجان عنوة. وقال رجل من المسلمين: قد علم الديلم إذ تحارب حين أتى في جيشه ابن عازب أن ظن المشركين كاذب {cite:kamil-ibn-al-athir p. 406}."
  en: "Al-Bara' ibn 'Azib took Abhar after its garrison sued for peace, then marched on Qazvin, whose people had sent to the Daylam for aid; the Daylam came and stood idle on the mountain — seeing them refuse to strike, Qazvin surrendered on Abhar's terms. Al-Bara' raided Daylam until it paid tribute, entered Gilan and the Tailsan, and took Zanjan by storm {cite:kamil-ibn-al-athir p. 406}."
