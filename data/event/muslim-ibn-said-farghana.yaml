label: { ar: "غزو مسلم بن سعيد فرغانة والهزيمة", en: "Muslim ibn Sa'id's Farghana Disaster" }
summary:
  ar: "عزل عمر بن هبيرة الجرشي واستعمل على خراسان مسلم بن سعيد فغزا أفشين فصالحه على ستة آلاف رأس ودفع إليه قلعته ثم انصرف إلى مرو وولى طخارستان نصر بن سيار فخالفه خلق من العرب فأوقع بهم ثم سفرت بينهم السفراء فاصطلحوا واستعمل هشام خالد بن عبد الله القسري على العراق فولى أسد بن عبد الله أخاه خراسان وبلغ ذلك مسلم بن سعيد فسار حتى أتى فرغانة فأناخ على مدينتها فقطع الشجر وأخرب العمارة وانحدر عليه خاقان الترك في عسكره فارتحل عن فرغانة وسار في يوم واحد ثلاث مراحل حتى قامت دوابه وتطرفت الترك عسكره وقد قال بعض الشعراء غزوت بنا من خشية العزل عاصياً فلم تنج من دنيا معن غرورها."
  en: "Umar ibn Hubayra gave Khurasan to Muslim ibn Sa'id, who took al-Afshin's sulh on six thousand heads plus his fortress. When word came that Asad ibn Abdallah had been given Khurasan, Muslim campaigned Farghana — cut the trees and ruined the buildings — till the Khaqan descended and he fled three marches in a day, beasts collapsing under Turkish raids: 'you marched us out to disobey for fear of dismissal — this flattering world did not save you'."
