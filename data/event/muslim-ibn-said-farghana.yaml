label: { ar: "غزو مسلم بن سعيد فرغانة والهزيمة", en: "Muslim ibn Sa'id's Farghana Disaster", es: "El desastre de Farghana de Muslim ibn Sa'id", fr: "Le désastre de Farghana de Muslim ibn Sa'id", ur: "مسلم بن سعید کی فرغانہ آفت", tr: "Müslim ibn Sa'id'in Fergana'yı işgali ve yenilgisi", id: "Invasi Muslim Ibnu Sa'id ke Fergana dan kekalahannya" }
summary:
  ar: "عزل عمر بن هبيرة الجرشي واستعمل على خراسان مسلم بن سعيد فغزا أفشين فصالحه على ستة آلاف رأس ودفع إليه قلعته ثم انصرف إلى مرو وولى طخارستان نصر بن سيار فخالفه خلق من العرب فأوقع بهم ثم سفرت بينهم السفراء فاصطلحوا واستعمل هشام خالد بن عبد الله القسري على العراق فولى أسد بن عبد الله أخاه خراسان وبلغ ذلك مسلم بن سعيد فسار حتى أتى فرغانة فأناخ على مدينتها فقطع الشجر وأخرب العمارة وانحدر عليه خاقان الترك في عسكره فارتحل عن فرغانة وسار في يوم واحد ثلاث مراحل حتى قامت دوابه وتطرفت الترك عسكره وقد قال بعض الشعراء غزوت بنا من خشية العزل عاصياً فلم تنج من دنيا معن غرورها."
  en: "Umar ibn Hubayra gave Khurasan to Muslim ibn Sa'id, who took al-Afshin's sulh on six thousand heads plus his fortress. When word came that Asad ibn Abdallah had been given Khurasan, Muslim campaigned Farghana — cut the trees and ruined the buildings — till the Khaqan descended and he fled three marches in a day, beasts collapsing under Turkish raids: 'you marched us out to disobey for fear of dismissal — this flattering world did not save you'."
  es: "Umar ibn Hubayra entregó Jorasán a Muslim ibn Sa'id, quien tomó el sulh de al-Afshin con seis mil cabezas, además de su fortaleza. Cuando llegó la noticia de que a Asad ibn Abdallah se le había entregado Jorasán, Muslim arrasó Farghana —taló los árboles y destruyó los edificios— hasta que descendió el Khaqan y huyó tres veces en un día, con las bestias desplomándose bajo los ataques turcos: «Nos hicisteis marchar para desobedecer por temor al despido; este mundo adulador no os salvó»."
  fr: "Umar ibn Hubayra confia le Khorasan à Muslim ibn Sa'id, qui s'empara du sulh d'al-Afshin avec six mille hommes et sa forteresse. Lorsque la nouvelle parvint qu'Asad ibn Abdallah avait reçu le Khorasan, Muslim mena campagne à Ferghana – abattant les arbres et détruisant les bâtiments – jusqu'à ce que le Khaqan descende et qu'il s'enfuie, parcourant trois marches en une journée, ses bêtes s'effondrant sous les raids turcs: « Vous nous avez forcés à désobéir par peur d'être renvoyés – ce monde flatteur ne vous a pas sauvés. »"
  ur: "عمر بن ہبیرہ نے خراسان مسلم بن سعید کو دے دیا جس نے افشین کی سلح کو چھ ہزار سروں کے علاوہ اس کا قلعہ بھی لیا۔ جب یہ خبر پہنچی کہ اسد بن عبداللہ کو خراسان دے دیا گیا ہے تو مسلمانوں نے فرغانہ کی مہم چلائی - درخت کاٹے اور عمارتیں تباہ کیں - یہاں تک کہ خاقان اترا اور وہ ایک دن میں تین مارچ کرکے بھاگ گیا، ترکی کے چھاپوں میں درندے ٹوٹ پڑے: 'تم نے ہمیں برخاستگی کے خوف سے نافرمانی کے لیے نکالا - یہ چاپلوسی تم نے نہیں کی'۔"
  tr: "Ömer bin Hubeyra el-Cerşi görevden alındı ve yerine Müslim bin Said Horasan'ın başına getirildi. Afşin'e baskın düzenledi ve altı bin kafa karşılığında onunla barış yaptı, kalesini teslim etti. Sonra Merv'e döndü ve Nasr bin Sayyar'ı Toharistan'ın başına atadı. Bir grup Arap ona karşı çıktı, bu yüzden onlara saldırdı. Ardından aralarına elçiler gönderildi ve barış sağlandı. Hişam, Halid bin Abdullah el-Kasri'yi Irak'ın başına ve Esad bin Abdullah'ı da kardeşi Horasan'ın başına atadı. Bu durum Müslim bin Said'e ulaştı, bu yüzden Fergana'ya kadar yürüdü ve şehrine kamp kurdu. Ağaçları kesti ve binaları yıktı. Türklerin Kağanı ordusuyla üzerine geldi, bu yüzden Fergana'dan ayrıldı ve bir günde üç etap yürüdü, ta ki hayvanları ayağa kalkıp Türkler ordusunu kuşatana kadar. Bazı şairler şöyle dedi: \"Görevden alınma korkusuyla, itaatsizlikten bize baskın düzenledin, ama insan dünyasından ve onun kibirinden kurtulamadın.\""
  id: "Omar bin Hubayra al-Jarshi dipecat dan Muslim bin Saeed diangkat sebagai penguasa Khorasan. Ia menyerbu Afshin dan berdamai dengannya dengan imbalan enam ribu kepala dan menyerahkan bentengnya. Kemudian ia kembali ke Merv dan mengangkat Nasr bin Sayyar sebagai penguasa Tokharistan. Sekelompok orang Arab menentangnya, sehingga ia menyerang mereka. Kemudian duta-duta dikirim di antara mereka dan mereka berdamai. Hisham mengangkat Khalid bin Abdullah al-Qasri sebagai penguasa Irak dan mengangkat Asad bin Abdullah sebagai penguasa Khorasan milik saudaranya. Hal ini sampai kepada Muslim bin Saeed, sehingga ia berbaris hingga sampai ke Fergana dan berkemah di kota itu. Ia menebang pohon-pohon dan menghancurkan bangunan-bangunan. Khagan Turki menyerangnya dengan pasukannya, sehingga ia meninggalkan Fergana dan berbaris tiga tahap dalam satu hari hingga hewan-hewannya berdiri dan pasukan Turki mengepung pasukannya. Beberapa penyair berkata: Engkau menyerbu kami karena takut dipecat, durhaka, tetapi engkau tidak lolos dari dunia Man dan kesombongannya."
