label: { ar: "رسائل أهل الكوفة إلى الحسين", en: "Letters from the people of Kufa to al-Husayn", es: "Cartas de los habitantes de Kufa a al-Husayn", fr: "Lettres des habitants de Koufa à al-Husayn" }
summary:
  ar: "في سنة ستين وجّه أهل الكوفة الرسل إلى الحسين بن علي وهو بمكة يدعونه إلى القدوم عليهم، فوجّه إليهم ابن عمه مسلم بن عقيل بن أبي طالب {cite:tabari-tarikh-abu-al-fadl j.5 p.347}."
  en: "In 60 the people of Kufa sent envoys to al-Husayn ibn Ali, who was in Mecca, calling him to come to them. He sent to them his cousin Muslim ibn Aqil ibn Abi Talib {cite:tabari-tarikh-abu-al-fadl j.5 p.347}."
  es: "En el año 60, la gente de Kufa envió emisarios a al-Husayn ibn Ali, que se encontraba en La Meca, para que acudiera a ellos. Él les envió a su primo Muslim ibn Aqil ibn Abi Talib {cite:tabari-tarikh-abu-al-fadl j.5 p.347}."
  fr: "En 60, les habitants de Kufa envoyèrent des émissaires à al-Husayn ibn Ali, qui se trouvait à La Mecque, l'invitant à venir les rejoindre. Il leur envoya son cousin Muslim ibn Aqil ibn Abi Talib {cite:tabari-tarikh-abu-al-fadl j.5 p.347}."
