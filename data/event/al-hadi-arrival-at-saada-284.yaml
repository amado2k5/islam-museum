id: event/al-hadi-arrival-at-saada-284
class: event
kind: other
label:
  ar: وصول الهادي إلى صعدة وإصلاحه بين سعد والربيعة، صفر 284هـ
  en: Al-Hadi's arrival at Sa'da and the settling of Sa'd and al-Rabi'a, Safar 284 AH
  ur: ہادی کا صعدہ پہنچنا اور سعد و ربیعہ میں صلح، صفر 284ھ
summary:
  ar: وصل الهادي صعدة لستة أيام خلون من صفر سنة 284هـ وبين خولان فتنة عظيمة، فخطب فيهم وأحلف الفريقين على ترك الفتنة ثم بايعوه، ودخلوا صعدة، وولى الولاة على جباية الطعام في المخاليف.
  en: Al-Hadi reached Sa'da on the sixth of Safar 284 AH, amid a great feud among Khawlan; he preached to them, had the two parties swear to give up the feud, and they pledged allegiance to him and entered Sa'da; he then appointed governors over the collection of food in the districts.
  ur: ہادی 6 صفر 284ھ کو صعدہ پہنچے جب خولان میں شدید فتنہ تھا؛ انہوں نے خطبہ دیا، دونوں فریقوں سے فتنہ چھوڑنے کا حلف لیا، انہوں نے ان کی بیعت کی اور صعدہ میں داخل ہوئے، اور پھر انہوں نے مخالیف میں غلے کی وصولی پر عمال مقرر کیے۔
