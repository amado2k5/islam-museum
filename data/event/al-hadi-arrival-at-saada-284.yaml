id: event/al-hadi-arrival-at-saada-284
class: event
kind: other
label:
  ar: وصول الهادي إلى صعدة وإصلاحه بين سعد والربيعة، صفر 284هـ
  en: Al-Hadi's arrival at Sa'da and the settling of Sa'd and al-Rabi'a, Safar 284 AH
  ur: ہادی کا صعدہ پہنچنا اور سعد و ربیعہ میں صلح، صفر 284ھ
  es: "Llegada de Al-Hadi a Sa'da y fundación de Sa'd y al-Rabi'a, Safar 284 AH."
  fr: "Arrivée d'Al-Hadi à Sa'da et installation de Sa'd et d'al-Rabi'a, Safar 284 AH"
  tr: "El-Hadi'nin Sa'de'ye gelişi ve Sa'd ile El-Rabia arasında uzlaşma sağlaması, Hicri 284 Safar ayı."
  id: "Kedatangan Al-Hadi di Sa'dah dan perdamaiannya antara Sa'd dan Al-Rabia, Safar 284 H."
summary:
  ar: وصل الهادي صعدة لستة أيام خلون من صفر سنة 284هـ وبين خولان فتنة عظيمة، فخطب فيهم وأحلف الفريقين على ترك الفتنة ثم بايعوه، ودخلوا صعدة، وولى الولاة على جباية الطعام في المخاليف.
  en: Al-Hadi reached Sa'da on the sixth of Safar 284 AH, amid a great feud among Khawlan; he preached to them, had the two parties swear to give up the feud, and they pledged allegiance to him and entered Sa'da; he then appointed governors over the collection of food in the districts.
  ur: ہادی 6 صفر 284ھ کو صعدہ پہنچے جب خولان میں شدید فتنہ تھا؛ انہوں نے خطبہ دیا، دونوں فریقوں سے فتنہ چھوڑنے کا حلف لیا، انہوں نے ان کی بیعت کی اور صعدہ میں داخل ہوئے، اور پھر انہوں نے مخالیف میں غلے کی وصولی پر عمال مقرر کیے۔
  es: "Al-Hadi llegó a Sa'da el sexto día de Safar del año 284 de la Hégira, en medio de una gran disputa entre los Khawlan; les predicó, hizo que ambas partes juraran abandonar la disputa, y ellos le juraron lealtad y entraron en Sa'da; luego nombró gobernadores para la recolección de alimentos en los distritos."
  fr: "Al-Hadi arriva à Sa'da le six Safar 284 AH, au milieu d'une grande querelle parmi les Khawlan; il leur prêcha, fit jurer aux deux parties d'abandonner la querelle, et elles lui prêtèrent allégeance et entrèrent à Sa'da; il nomma ensuite des gouverneurs chargés de la collecte de nourriture dans les districts."
  tr: "El-Hadi, Hicri 284 yılında Safer ayının bitimine altı gün kala Sa'de'ye geldi. Havlan kabilesi arasında büyük bir çekişme vardı; bunun üzerine onlara hitap etti ve her iki taraftan da çekişmeyi bırakacaklarına dair yemin ettirdi. Daha sonra ona biat ettiler ve Sa'de'ye girdiler; o da bölgelerde yiyecek toplamak için valiler atadı."
  id: "Al-Hadi tiba di Sa'dah enam hari sebelum berakhirnya bulan Safar pada tahun 284 Hijriah. Terjadi perselisihan besar di antara suku Khawlan, sehingga beliau berpidato di hadapan mereka dan meminta kedua belah pihak bersumpah untuk menghentikan perselisihan tersebut. Kemudian mereka berjanji setia kepadanya dan memasuki Sa'dah, dan beliau menunjuk gubernur untuk mengumpulkan makanan di distrik-distrik."
