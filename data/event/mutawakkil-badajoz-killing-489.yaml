label: { ar: "قتل يوسف بن تاشفين للمتوكل صاحب بطليوس", en: "Yusuf ibn Tashfin's killing of al-Mutawakkil, lord of Badajoz", es: "El asesinato de al-Mutawakkil, señor de Badajoz, por Yusuf ibn Tashfin", fr: "Meurtre d'al-Mutawakkil, seigneur de Badajoz, par Yusuf ibn Tashfin", ur: "یوسف بن تاشفین کا بادجوز کے سردار المتوکل کا قتل", tr: "Yusuf ibn Taşfin, Badajoz hükümdarı el-Mütevekkil'i öldürdü", id: "Yusuf ibn Tashfin membunuh al-Mutawakkil, penguasa Badajoz" }
summary:
  ar: "كان المتوكل أبو حفص عمر بن محمد المعروف بساجة سلطان بطليوس إلى أن قتله يوسف بن تاشفين أمير المرابطين سنة 489هـ وقتل معه أولاده، أغراه به ابن عباد فلما تمكنت الاسترابة وشعر به كاتب يوسف واستحثه لمعاجلته قبل أن يتصل بالطاغية {cite:tarikh-ibn-khaldun-ibar p. 1001}."
  en: "In 489 Yusuf b. Tashfin killed al-Mutawakkil Sahib Badajoz, known as Saja, together with his sons — instigated by Ibn Abbad, who had secretly urged Yusuf to strike before the taifa king joined the Castilian {cite:tarikh-ibn-khaldun-ibar p. 1001}."
  es: "En 489, Yusuf b. Tashfin mató a al-Mutawakkil Sahib Badajoz, conocido como Saja, junto con sus hijos, instigado por Ibn Abbad, quien había instado secretamente a Yusuf a atacar antes de que el rey de la taifa se uniera a los castellanos {cite:tarikh-ibn-khaldun-ibar p. 1001}."
  fr: "En 489, Yusuf b. Tashfin tua al-Mutawakkil Sahib Badajoz, connu sous le nom de Saja, ainsi que ses fils — incité par Ibn Abbad, qui avait secrètement exhorté Yusuf à frapper avant que le roi de la taïfa ne rejoigne les Castillans {cite:tarikh-ibn-khaldun-ibar p. 1001}."
  ur: "489 میں یوسف بن۔ تاشفین نے المتوکل صاحب بادجوز، جسے سجا کے نام سے جانا جاتا ہے، اپنے بیٹوں کے ساتھ مل کر قتل کر دیا - ابن عباد کی طرف سے اکسایا گیا، جس نے خفیہ طور پر یوسف کو طائفہ کے بادشاہ کے کاسٹیلین میں شامل ہونے سے پہلے حملہ کرنے کی تاکید کی تھی۔ 1001}۔"
  tr: "Saja olarak bilinen El-Mutavakkil Ebu Hafs Ömer bin Muhammed, Hicri 489 yılında Mürebbiye Emiri Yusuf bin Taşfin tarafından öldürülene kadar Bedecaz Sultanıydı ve oğulları da onunla birlikte öldürüldü. İbn Abbad onu kendisine karşı kışkırtmıştı ve şüpheler ortaya çıktığında ve Yusuf bundan haberdar olduğunda, ona yazarak zalim hükümdarla temasa geçmeden önce onunla hızlıca ilgilenmesini rica etti. {cite:tarikh-ibn-khaldun-ibar s. 1001}"
  id: "Al-Mutawakkil Abu Hafs Omar bin Muhammad, yang dikenal sebagai Saja, adalah Sultan Badajoz hingga ia dibunuh oleh Yusuf bin Tashfin, Amir Almoravid, pada tahun 489 H, dan putra-putranya terbunuh bersamanya. Ibnu Abbas telah menghasutnya untuk melawan Yusuf, dan ketika kecurigaan telah terbukti dan Yusuf mengetahuinya, ia menulis surat kepadanya dan mendesaknya untuk segera menindak Yusuf sebelum ia dapat menghubungi sang tiran. {cite:tarikh-ibn-khaldun-ibar p. 1001}."
