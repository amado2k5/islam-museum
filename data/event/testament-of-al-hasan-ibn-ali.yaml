id: event/testament-of-al-hasan-ibn-ali
class: event
kind: death
label:
  ar: وصية الحسن بن علي لأخيه الحسين وجنازته ودفنه في البقيع
  en: Testament and burial of al-Hasan ibn Ali
  ur: حسن بن علی کی وصیت، جنازہ اور بقیع میں تدفین
  es: "Testamento y sepultura de al-Hasan ibn Ali"
summary:
  ar: "لما احتضر الحسن بن علي بالمدينة بعد مرض طويل أوصى أخاه الحسين أن يطلب دفنه عند النبي في حجرة عائشة إن لم تُسفك في ذلك دماء، وإلا فبالبقيع، وحذّره من أن يستخفّه أهل الكوفة {cite:siyar-alam-nubala scan vol. 1 p. 1436}. فمنع مروان بن الحكم الدفن في الحجرة وتسلح الفريقان حتى ناشد أبو هريرة الحسين وصية أخيه {cite:siyar-alam-nubala scan vol. 1 p. 1435}. ودُفن الحسن في البقيع إلى جنب أمه، وصلى عليه سعيد بن العاص أمير المدينة بتقديم الحسين له {cite:tarikh-islam-dhahabi scan vol. 7 p. 40}. وبكاه الرجال والنساء سبعاً حتى ضاق البقيع بالناس {cite:al-bidaya-wal-nihaya scan vol. 4 p. 409}."
  en: "When al-Hasan ibn Ali lay dying in Medina after a long illness he charged his brother al-Husayn to ask that he be buried beside the Prophet in Aisha's room if no blood were shed, and otherwise at al-Baqi, and warned him not to be lured out by the people of Kufa {cite:siyar-alam-nubala scan vol. 1 p. 1436}. Marwan ibn al-Hakam barred the burial in the room and both sides took up arms until Abu Hurayra adjured al-Husayn by his brother's testament {cite:siyar-alam-nubala scan vol. 1 p. 1435}. Al-Hasan was buried at al-Baqi beside his mother, and Sa'id ibn al-As, the governor, led the prayer at al-Husayn's bidding {cite:tarikh-islam-dhahabi scan vol. 7 p. 40}. Men and women wept for him for seven days, and al-Baqi could not hold the crowd {cite:al-bidaya-wal-nihaya scan vol. 4 p. 409}."
  ur: "جب حسن بن علی طویل بیماری کے بعد مدینہ میں آخری وقت پر تھے تو انھوں نے بھائی حسین کو وصیت کی کہ اگر خونریزی نہ ہو تو انھیں عائشہ کے حجرے میں نبی کے پہلو میں دفن کرنے کی درخواست کی جائے، ورنہ بقیع میں، اور خبردار کیا کہ اہلِ کوفہ انھیں ورغلا نہ لیں {cite:siyar-alam-nubala scan vol. 1 p. 1436}۔ مروان بن الحکم نے حجرے میں تدفین سے روکا اور دونوں طرف ہتھیار اٹھے، یہاں تک کہ ابوہریرہ نے حسین کو بھائی کی وصیت کا واسطہ دیا {cite:siyar-alam-nubala scan vol. 1 p. 1435}۔ حسن کو بقیع میں ان کی والدہ کے پہلو میں دفن کیا گیا اور حسین کے کہنے پر مدینہ کے امیر سعید بن العاص نے نماز پڑھائی {cite:tarikh-islam-dhahabi scan vol. 7 p. 40}۔ مرد و عورت سات دن روئے اور بقیع ہجوم کو سمو نہ سکا {cite:al-bidaya-wal-nihaya scan vol. 4 p. 409}۔"
  es: "Cuando al-Hasan ibn Ali agonizaba en Medina tras una larga enfermedad, encargó a su hermano al-Husayn que solicitara ser enterrado junto al Profeta en la habitación de Aisha si no se derramaba sangre, y en caso contrario en al-Baqi, y le advirtió que no se dejara engañar por la gente de Kufa {cite:siyar-alam-nubala scan vol. 1 p. 1436}. Marwan ibn al-Hakam impidió el entierro en la habitación y ambos bandos tomaron las armas hasta que Abu Hurayra conjuró a al-Husayn por el testamento de su hermano {cite:siyar-alam-nubala scan vol. 1 p. 1435}. Al-Hasan fue enterrado en al-Baqi junto a su madre, y Sa'id ibn al-As, el gobernador, dirigió la oración a petición de al-Husayn {cite:tarikh-islam-dhahabi scan vol. 7 p. 40}. Hombres y mujeres lloraron por él durante siete días, y al-Baqi no pudo contener a la multitud {cite:al-bidaya-wal-nihaya scan vol. 4 p. 409}."
