label: { ar: "خلافة مروان بن الحكم" }
summary:
  ar: "خرج مروان بن الحكم بعد موت معاوية بن يزيد فغلب على الشام ثم مصر واستمر إلى أن مات سنة خمس وستين وقد عهد إلى ابنه عبد الملك، وقال الذهبي الأصح أن مروان لا يعد في أمراء المؤمنين بل هو باغ خارج على ابن الزبير ولا عهده إلى ابنه بصحيح وإنما صحت خلافة عبد الملك من حين قتل ابن الزبير {cite:tarikh-khulafa-minhaj-1434 p. 349}."
  en: "After Mu'awiya II's death Marwan ibn al-Hakam rose and mastered Syria then Egypt until he died in 65, having willed the succession to his son Abd al-Malik. Al-Dhahabi judges that Marwan is not reckoned among the commanders of the faithful — he was a rebel in revolt against Ibn al-Zubayr, whose testament to his son carried no validity; Abd al-Malik's caliphate became sound only from Ibn al-Zubayr's death {cite:tarikh-khulafa-minhaj-1434 p. 349}."
