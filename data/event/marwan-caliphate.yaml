label: { ar: "خلافة مروان بن الحكم", en: "The Caliphate of Marwan ibn al-Hakam", es: "El Califato de Marwan ibn al-Hakam", fr: "Le califat de Marwan ibn al-Hakam" }
summary:
  ar: "خرج مروان بن الحكم بعد موت معاوية بن يزيد فغلب على الشام ثم مصر واستمر إلى أن مات سنة خمس وستين وقد عهد إلى ابنه عبد الملك، وقال الذهبي الأصح أن مروان لا يعد في أمراء المؤمنين بل هو باغ خارج على ابن الزبير ولا عهده إلى ابنه بصحيح وإنما صحت خلافة عبد الملك من حين قتل ابن الزبير {cite:tarikh-khulafa-minhaj-1434 p. 349}."
  en: "After Mu'awiya II's death Marwan ibn al-Hakam rose and mastered Syria then Egypt until he died in 65, having willed the succession to his son Abd al-Malik. Al-Dhahabi judges that Marwan is not reckoned among the commanders of the faithful — he was a rebel in revolt against Ibn al-Zubayr, whose testament to his son carried no validity; Abd al-Malik's caliphate became sound only from Ibn al-Zubayr's death {cite:tarikh-khulafa-minhaj-1434 p. 349}."
  es: "Tras la muerte de Mu'awiya II, Marwan ibn al-Hakam ascendió al poder y gobernó Siria y luego Egipto hasta su muerte en el año 65, dejando la sucesión en manos de su hijo Abd al-Malik. Al-Dhahabi considera que Marwan no figura entre los comandantes de los fieles, pues fue un rebelde que se sublevó contra Ibn al-Zubayr, cuyo testamento a su hijo carecía de validez; el califato de Abd al-Malik solo se consolidó tras la muerte de Ibn al-Zubayr {cite:tarikh-khulafa-minhaj-1434 p. 349}."
  fr: "Après la mort de Mu'awiya II, Marwan ibn al-Hakam s'éleva au pouvoir et contrôla la Syrie puis l'Égypte jusqu'à sa mort en 65, après avoir légué le califat à son fils Abd al-Malik. Al-Dhahabi estime que Marwan ne compte pas parmi les commandants des croyants: il était un rebelle en révolte contre Ibn al-Zubayr, dont le testament en faveur de son fils était sans valeur; le califat d'Abd al-Malik ne devint légitime qu'après la mort d'Ibn al-Zubayr (voir: Tarikh-Khulafa-Minhaj-1434, p. 349)."
