summary:
  ar: "ملك ركن الدين سليمان شاه السلجوقي ملطية من أخيه وأرزن الروم، فجمع ما كان متفرقًا من بلاد الروم في يده وكان من أعظم سلاطين السلاجقة ملكًا {cite:kamil-ibn-al-athir p. 275}."
  en: "Rukn al-Din Sulayman Shah the Seljuk took Malatya from his brother and Erzurum, gathering the Rum lands fragmented among the princes into one hand — the greatest Seljuk kingship since the sultans {cite:kamil-ibn-al-athir p. 275}."
  es: "Rukn al-Din Sulayman Shah el Seljuk tomó Malatya de su hermano y Erzurum, reuniendo las tierras de Rum fragmentadas entre los príncipes en una sola mano: el mayor reinado seljuk desde los sultanes {cite:kamil-ibn-al-athir p. 275}."
  fr: "Rukn al-Din Sulayman Shah le Seldjoukide prit Malatya à son frère et Erzurum, rassemblant les terres de Rum fragmentées parmi les princes en une seule main — la plus grande royauté seldjoukide depuis les sultans {cite:kamil-ibn-al-athir p. 275}."
  ur: "رکن الدین سلیمان شاہ سلجوق نے مالتیا کو اپنے بھائی اور ارزورم سے چھین لیا، اور شہزادوں کے درمیان بکھری ہوئی روم کی زمینوں کو ایک ہاتھ میں اکٹھا کیا - سلجوقوں کی سب سے بڑی بادشاہت سلطانوں کے بعد سے۔ 275}۔"
