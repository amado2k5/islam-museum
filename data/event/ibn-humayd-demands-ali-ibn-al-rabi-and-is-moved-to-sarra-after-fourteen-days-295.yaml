id: event/ibn-humayd-demands-ali-ibn-al-rabi-and-is-moved-to-sarra-after-fourteen-days-295
class: event
kind: other
label:
  ar: "ابن حميد يطالب بعلي بن الربيع ويُنقل إلى سرّة بعد أربعة عشر يوماً، سنة 295هـ، ص352-353"
  en: "Ibn Humayd demands Ali ibn al-Rabi' and is moved to Sarra after fourteen days, 295 AH, pp. 352 to 353"
  ur: "ابن حمید کا علی بن الربیع کا مطالبہ اور چودہ دن بعد سرّہ منتقل ہونا، 295ھ، ص352 تا 353"
  es: "Ibn Humayd exige a Ali ibn al-Rabi' y es trasladado a Sarra después de catorce días, 295 AH, págs. 352 a 353."
  fr: "Ibn Humayd réclame Ali ibn al-Rabi' et est transféré à Sarra après quatorze jours, 295 AH, pp. 352 à 353"
  tr: "İbn Hamid, Ali ibn al-Rabi'yi talep eder ve on dört gün sonra, Hicri 295 yılında, Sarra'ya nakledilir (s. 352-353)."
  id: "Ibn Hamid meminta Ali ibn al-Rabi’ dan dia dipindahkan ke Sarra setelah empat belas hari, pada tahun 295 H, hlm. 352-353"
summary:
  ar: "بعد أن رفضت بنو الحارث الدفع وطردت الخدم، طالب ابن حميد محمد بن عبيد الله بإطلاق علي بن الربيع، فرد عليه محمد رداً غليظاً، وأقام ابن حميد في القرية أربعة عشر يوماً ثم نُقل إلى سرّة، وعاد إلى عشائره فنقض ما بينهم من العهد."
  en: "After Banu al-Harith refused to pay and drove off the servants, Ibn Humayd demanded that Muhammad ibn Ubaydallah free Ali ibn al-Rabi'. Muhammad answered him harshly. Ibn Humayd stayed in the village for fourteen days, then was moved to Sarra, and went back to his kin and broke the covenants between them."
  ur: "بنو الحارث کے ادائیگی سے انکار اور خادموں کو بھگانے کے بعد ابن حمید نے محمد بن عبیداللہ سے علی بن الربیع کو رہا کرنے کا مطالبہ کیا۔ محمد نے سخت جواب دیا۔ ابن حمید گاؤں میں چودہ دن ٹھہرا، پھر سرّہ منتقل کیا گیا، اور اپنے قبیلے میں لوٹ کر ان کے درمیان کے عہد توڑ دیے۔"
  es: "Tras la negativa de Banu al-Harith a pagar y la expulsión de los sirvientes, Ibn Humayd exigió a Muhammad ibn Ubaydallah que liberara a Ali ibn al-Rabi'. Muhammad le respondió con dureza. Ibn Humayd permaneció en la aldea catorce días, luego fue trasladado a Sarra, regresó con sus parientes y rompió los pactos que los unían."
  fr: "Après que les Banu al-Harith eurent refusé de payer et chassé les serviteurs, Ibn Humayd exigea que Muhammad ibn Ubaydallah libère Ali ibn al-Rabi'. Muhammad lui répondit durement. Ibn Humayd resta quatorze jours au village, puis fut transféré à Sarra, où il retourna auprès des siens et rompit les pactes qui les unissaient."
  tr: "Beni el-Harith ödeme yapmayı reddedip hizmetkarları kovduktan sonra, İbn Hamid, Muhammed ibn Ubeydullah'tan Ali ibn el-Rabi'yi serbest bırakmasını istedi. Muhammed ona sert bir şekilde karşılık verdi ve İbn Hamid on dört gün köyde kaldı, sonra Sarra'ya gönderildi ve kabilelerinin yanına dönerek aralarındaki ahdi bozdu."
  id: "Setelah Bani al-Harith menolak membayar dan mengusir para pelayan, Ibnu Hamid menuntut agar Muhammad ibn Ubayd Allah membebaskan Ali ibn al-Rabi’. Muhammad menanggapinya dengan keras, dan Ibnu Hamid tinggal di desa itu selama empat belas hari, kemudian ia dipindahkan ke Sarra, dan kembali ke sukunya serta melanggar perjanjian di antara mereka."
