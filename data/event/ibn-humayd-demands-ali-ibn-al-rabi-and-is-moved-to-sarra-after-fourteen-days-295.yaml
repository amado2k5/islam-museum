id: event/ibn-humayd-demands-ali-ibn-al-rabi-and-is-moved-to-sarra-after-fourteen-days-295
class: event
kind: other
label:
  ar: "ابن حميد يطالب بعلي بن الربيع ويُنقل إلى سرّة بعد أربعة عشر يوماً، سنة 295هـ، ص352-353"
  en: "Ibn Humayd demands Ali ibn al-Rabi' and is moved to Sarra after fourteen days, 295 AH, pp. 352 to 353"
  ur: "ابن حمید کا علی بن الربیع کا مطالبہ اور چودہ دن بعد سرّہ منتقل ہونا، 295ھ، ص352 تا 353"
summary:
  ar: "بعد أن رفضت بنو الحارث الدفع وطردت الخدم، طالب ابن حميد محمد بن عبيد الله بإطلاق علي بن الربيع، فرد عليه محمد رداً غليظاً، وأقام ابن حميد في القرية أربعة عشر يوماً ثم نُقل إلى سرّة، وعاد إلى عشائره فنقض ما بينهم من العهد."
  en: "After Banu al-Harith refused to pay and drove off the servants, Ibn Humayd demanded that Muhammad ibn Ubaydallah free Ali ibn al-Rabi'. Muhammad answered him harshly. Ibn Humayd stayed in the village for fourteen days, then was moved to Sarra, and went back to his kin and broke the covenants between them."
  ur: "بنو الحارث کے ادائیگی سے انکار اور خادموں کو بھگانے کے بعد ابن حمید نے محمد بن عبیداللہ سے علی بن الربیع کو رہا کرنے کا مطالبہ کیا۔ محمد نے سخت جواب دیا۔ ابن حمید گاؤں میں چودہ دن ٹھہرا، پھر سرّہ منتقل کیا گیا، اور اپنے قبیلے میں لوٹ کر ان کے درمیان کے عہد توڑ دیے۔"
