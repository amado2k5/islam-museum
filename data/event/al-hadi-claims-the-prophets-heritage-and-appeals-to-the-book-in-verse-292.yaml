label:
  ar: "قصيدة للهادي: دعواه وراثة الهدى والاحتكام إلى كتاب الله، ص328"
  en: "A poem of al-Hadi: his claim to inherit guidance and his appeal to the Book of God, p. 328"
  ur: "ہادی کی نظم: ہدایت کی وراثت کا دعویٰ اور کتاب اللہ سے فیصلہ، ص328"
summary:
  ar: "أبيات في ص328 تتم القصيدة السابقة، يقول فيها الشاعر إن أباه رسول الله أسس دعوته وإن هداه ورّثه الهدى، وإنه نصب نفسه ناصحاً لرعية، ويدعو القوم إلى سؤال كتاب الله بينهم، ويتساءل أهو أحق بأمرهم أم «عبدان آل حوال»، ويقول إن النبي سيقوم غداً بحجته، وإن رغبته في الخالق لا فيما في أيديهم، وبه عزّتهم."
  en: "Lines on p. 328 that complete the poem begun on p. 326, in which the poet says his father the Messenger of God founded his call and that his guidance bequeathed him guidance, that he set himself up as an adviser to a people, calls on them to ask the Book of God between them, asks whether he or \"the servants of Al Hawwal\" is more entitled to their affair, says the Prophet will stand tomorrow with his proof, and says his wish is for the Creator and not for what is in their hands, and that by Him they are mighty."
  ur: "ص328 پر وہ اشعار جو ص326 سے شروع ہونے والی نظم کو پورا کرتے ہیں، جن میں شاعر کہتا ہے کہ اس کے والد رسول اللہ نے اس کی دعوت کی بنیاد رکھی اور ان کی ہدایت نے اسے ہدایت کا وارث بنایا، اس نے اپنے آپ کو ایک رعایا کا ناصح بنا کر کھڑا کیا، وہ لوگوں کو کتاب اللہ سے اپنے درمیان پوچھنے کو کہتا ہے، پوچھتا ہے کہ وہ اس معاملے کا زیادہ حق دار ہے یا «آلِ حوال کے غلام»، کہتا ہے کہ نبی کل اس کی حجت کے ساتھ کھڑے ہوں گے، اور اس کی رغبت خالق میں ہے نہ کہ ان کے ہاتھوں کی چیز میں، اور اسی سے ان کی عزت ہے۔"
