label:
  ar: "قصيدة للهادي: دعواه وراثة الهدى والاحتكام إلى كتاب الله، ص328"
  en: "A poem of al-Hadi: his claim to inherit guidance and his appeal to the Book of God, p. 328"
  ur: "ہادی کی نظم: ہدایت کی وراثت کا دعویٰ اور کتاب اللہ سے فیصلہ، ص328"
  es: "Un poema de al-Hadi: su pretensión de heredar la guía y su apelación al Libro de Dios, pág. 328"
  fr: "Un poème d'al-Hadi: sa prétention à hériter de la guidance et son appel au Livre de Dieu, p. 328"
  tr: "El-Hadi'nin bir şiiri: Hidayete hak iddiası ve Allah'ın Kitabına başvurma hakkı, s. 328"
  id: "Puisi karya Al-Hadi: Klaimnya untuk mewarisi petunjuk dan merujuk pada Kitab Allah, hlm. 328"
summary:
  ar: "أبيات في ص328 تتم القصيدة السابقة، يقول فيها الشاعر إن أباه رسول الله أسس دعوته وإن هداه ورّثه الهدى، وإنه نصب نفسه ناصحاً لرعية، ويدعو القوم إلى سؤال كتاب الله بينهم، ويتساءل أهو أحق بأمرهم أم «عبدان آل حوال»، ويقول إن النبي سيقوم غداً بحجته، وإن رغبته في الخالق لا فيما في أيديهم، وبه عزّتهم."
  en: "Lines on p. 328 that complete the poem begun on p. 326, in which the poet says his father the Messenger of God founded his call and that his guidance bequeathed him guidance, that he set himself up as an adviser to a people, calls on them to ask the Book of God between them, asks whether he or \"the servants of Al Hawwal\" is more entitled to their affair, says the Prophet will stand tomorrow with his proof, and says his wish is for the Creator and not for what is in their hands, and that by Him they are mighty."
  ur: "ص328 پر وہ اشعار جو ص326 سے شروع ہونے والی نظم کو پورا کرتے ہیں، جن میں شاعر کہتا ہے کہ اس کے والد رسول اللہ نے اس کی دعوت کی بنیاد رکھی اور ان کی ہدایت نے اسے ہدایت کا وارث بنایا، اس نے اپنے آپ کو ایک رعایا کا ناصح بنا کر کھڑا کیا، وہ لوگوں کو کتاب اللہ سے اپنے درمیان پوچھنے کو کہتا ہے، پوچھتا ہے کہ وہ اس معاملے کا زیادہ حق دار ہے یا «آلِ حوال کے غلام»، کہتا ہے کہ نبی کل اس کی حجت کے ساتھ کھڑے ہوں گے، اور اس کی رغبت خالق میں ہے نہ کہ ان کے ہاتھوں کی چیز میں، اور اسی سے ان کی عزت ہے۔"
  es: "Versos en la página 328 que completan el poema comenzado en la página 326, en los que el poeta dice que su padre, el Mensajero de Dios, fundó su llamado y que su guía le legó guía, que se estableció como consejero de un pueblo, los llama a consultar el Libro de Dios entre ellos, pregunta si él o \"los siervos de Al Hawwal\" tienen más derecho a su asunto, dice que el Profeta se presentará mañana con su prueba, y dice que su deseo es para el Creador y no para lo que está en sus manos, y que por Él son poderosos."
  fr: "Les vers de la page 328 qui complètent le poème commencé à la page 326, dans lesquels le poète dit que son père, le Messager de Dieu, a fondé sa vocation et que sa guidance lui a légué une guidance, qu'il s'est établi comme conseiller d'un peuple, les appelle à interroger le Livre de Dieu entre eux, demande si lui ou « les serviteurs d'Al Hawwal » est plus en droit de gérer leurs affaires, dit que le Prophète se tiendra demain avec sa preuve, et dit que son souhait est pour le Créateur et non pour ce qui est entre leurs mains, et que par Lui ils sont puissants."
  tr: "328. sayfadaki dizeler, şairin babasının, Allah'ın Elçisi'nin, çağrısını kurduğunu ve onun rehberliğinin kendisine de rehberlik ettiğini, kendisini sürüye danışman olarak atadığını ve insanları kendi aralarında Allah'ın Kitabını sormaya çağırdığını, \"Haval ailesinin iki kölesinden\" daha fazla onların işlerine hakkı olup olmadığını sorduğunu ve Peygamberin yarın delilleriyle ortaya çıkacağını, arzusunun onların elinde olanlarda değil, Yaratıcı'da olduğunu ve onların şanının O'nda olduğunu söylediği önceki şiiri tamamlıyor."
  id: "Bait-bait di halaman 328 melengkapi puisi sebelumnya, di mana penyair mengatakan bahwa ayahnya, Rasulullah, mendirikan seruannya dan bahwa petunjuknya mewariskan petunjuk kepadanya, dan bahwa ia mengangkat dirinya sendiri sebagai penasihat bagi umat, dan menyeru orang-orang untuk meminta Kitab Allah di antara mereka, dan bertanya apakah ia lebih berhak atas urusan mereka daripada \"dua budak dari keluarga Hawal,\" dan ia mengatakan bahwa Nabi akan berdiri besok dengan argumennya, dan bahwa keinginannya adalah kepada Sang Pencipta, bukan kepada apa yang ada di tangan mereka, dan di dalam Dialah kemuliaan mereka."
