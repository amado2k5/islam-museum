label: { ar: "حملة الموفق على الزنج واستنقاذ الأسارى" }
summary:
  ar: "في سنة سبع وستين ومائتين دخل الزنج واسطًا، فندب أبو أحمد الموفق ولده أبا العباس لحربهم في عشرة آلاف، فاستنقذ من النساء اللواتي كنّ في أيدي الزنج خلقًا كثيرًا فردّهن إلى أهلهن، ثم وافاه أبوه أبو أحمد فحاربهم واستنقذ من المسلمات زهاء خمسة عشر ألف امرأة وأمر بحملهن إلى واسط ليدفعهن إلى أوليائهن، ثم ألجأهم إلى مدينة بنوها وحصّنوها وحفروا حولها الخنادق فأجلاهم عنها، وبعث إلى رئيس الزنج كتابًا يدعوه فيه إلى التوبة والدخول في جماعة المسلمين فلم يجب عنه، فعسكر أبو أحمد في المدينة التي سُمّيت الموفقية ومنها عبر إلى مدينة القوم في ذي الحجة فغلبوا على ركن من أركانها وأحرقوا ما كان على سورهم من منجنيق وعرادة وكشفوا الزنج {cite:muntazam-ibn-al-jawzi p. 58-60}."
  en: "In 267 the Zanj entered Wasit; Abu Ahmad al-Muwaffaq sent his son Abu'l-Abbas with ten thousand who freed a great number of captive women, then joined him and rescued some fifteen thousand Muslim women, penned the Zanj back into their fortified city, and — when his letter inviting their leader to repent went unanswered — founded the camp-city al-Muwaffaqiyya and crossed in Dhu'l-Hijja to burn the mangonels on their walls and rout them {cite:muntazam-ibn-al-jawzi p. 58-60}."
