id: event/muwaffaq-rescue-267
class: event
kind: campaign
label: { ar: "حملة الموفق على الزنج واستنقاذ الأسارى", en: "Al-Muwaffaq's campaign against the Zanj and rescue of captives", es: "La campaña de Al-Muwaffaq contra los Zanj y el rescate de los cautivos", fr: "Campagne d'Al-Muwaffaq contre les Zanj et sauvetage des captifs", ur: "زنج کے خلاف الموفق کی مہم اور اسیروں کی بازیابی۔" }
summary:
  ar: "في سنة سبع وستين ومائتين دخل الزنج واسطًا، فندب أبو أحمد الموفق ولده أبا العباس لحربهم في عشرة آلاف، فاستنقذ من النساء اللواتي كنّ في أيدي الزنج خلقًا كثيرًا فردّهن إلى أهلهن، ثم وافاه أبوه أبو أحمد فحاربهم واستنقذ من المسلمات زهاء خمسة عشر ألف امرأة وأمر بحملهن إلى واسط ليدفعهن إلى أوليائهن، ثم ألجأهم إلى مدينة بنوها وحصّنوها وحفروا حولها الخنادق فأجلاهم عنها، وبعث إلى رئيس الزنج كتابًا يدعوه فيه إلى التوبة والدخول في جماعة المسلمين فلم يجب عنه، فعسكر أبو أحمد في المدينة التي سُمّيت الموفقية ومنها عبر إلى مدينة القوم في ذي الحجة فغلبوا على ركن من أركانها وأحرقوا ما كان على سورهم من منجنيق وعرادة وكشفوا الزنج {cite:muntazam-ibn-al-jawzi p. 58-60}."
  en: "In 267 the Zanj entered Wasit; Abu Ahmad al-Muwaffaq sent his son Abu'l-Abbas with ten thousand who freed a great number of captive women, then joined him and rescued some fifteen thousand Muslim women, penned the Zanj back into their fortified city, and — when his letter inviting their leader to repent went unanswered — founded the camp-city al-Muwaffaqiyya and crossed in Dhu'l-Hijja to burn the mangonels on their walls and rout them {cite:muntazam-ibn-al-jawzi p. 58-60}."
  es: "En 267, los Zanj entraron en Wasit; Abu Ahmad al-Muwaffaq envió a su hijo Abu'l-Abbas con diez mil hombres que liberaron a un gran número de mujeres cautivas, luego se unieron a él y rescataron a unas quince mil mujeres musulmanas, contuvieron a los Zanj de vuelta a su ciudad fortificada y, cuando su carta invitando a su líder a arrepentirse quedó sin respuesta, fundaron la ciudad-campamento al-Muwaffaqiyya y cruzaron en Dhu'l-Hijja para quemar los mangoneles en sus murallas y derrotarlos {cite:muntazam-ibn-al-jawzi p. 58-60}."
  fr: "En 267, les Zanj entrèrent dans Wasit; Abu Ahmad al-Muwaffaq envoya son fils Abu'l-Abbas avec dix mille hommes qui libérèrent un grand nombre de femmes captives, puis le rejoignirent et sauvèrent quelque quinze mille femmes musulmanes, repoussèrent les Zanj dans leur ville fortifiée et — lorsque sa lettre invitant leur chef à se repentir resta sans réponse — fonda la ville-camp d'al-Muwaffaqiyya et traversa en Dhu'l-Hijja pour brûler les mangonneaux sur leurs murs et les mettre en déroute {cite:muntazam-ibn-al-jawzi p. 58-60}."
  ur: "267 میں زنج وصیت میں داخل ہوا۔ ابو احمد الموفق نے اپنے بیٹے ابو العباس کو دس ہزار کے ساتھ بھیجا جس نے بڑی تعداد میں اسیر عورتوں کو آزاد کیا، پھر اس کے ساتھ شامل ہو گئے اور تقریباً پندرہ ہزار مسلمان عورتوں کو چھڑایا، زنج کو واپس ان کے قلعہ بند شہر میں داخل کیا، اور جب ان کے قائد کو توبہ کی دعوت دینے والا خط بے جواب ہو گیا تو - المعوذہ میں کیمپ شہر کی بنیاد رکھی اور المعوج کو جلایا۔ ان کی دیواروں پر مینگونیل لگا کر ان کو روٹ دیں 58-60}۔"
