label: { ar: "خروج أستاذسيس" }
summary:
  ar: "في سنة خمسين ومئة خرجت الجيوش الخراسانية عن الطاعة مع الأمير أستاذسيس واستولى على أكثر خراسان وعظم الخطب وبلغ ضريبة الجيش الخراساني ثلاث مئة ألف مقاتل ما بين فارس وراجل فعمل معهم أجثم المروزي مصافاً فقتل أجثم واستبيح عسكره فتجهز لحربهم خازم بن خزيمة في جيش عرمرم يسد الفضاء فالتقى الجمعان وكانت موقعة مشهورة يقال قتل فيها سبعون ألفاً وانهزم أستاذسيس فالتجأ إلى جبل وأمر خازم في العام الآتي بالأسرى فضربت أعناقهم وكانوا أربعة عشر ألفاً ثم حاصروه مدة فسلم نفسه فقيدوه وأطلقوا أجناده وكانوا ثلاثين ألفاً {cite:tarikh-khulafa-minhaj-1434 p. 425-426}."
  en: "In year 150 the Khurasani troops renounced obedience under the amir Ustadhsis and he seized most of Khurasan; the Khurasani army's levy reached three hundred thousand horse and foot. Ajtham al-Marwazi fought them and was killed and his army plundered; Khazim ibn Khuzayma then took the field in a vast host, and the famous battle they fought is said to have killed seventy thousand. Ustadhsis fled to a mountain; the next year Khazim had the fourteen thousand captives beheaded, besieged him until he surrendered, bound him and released his thirty thousand followers {cite:tarikh-khulafa-minhaj-1434 p. 425-426}."
