  ar: "ولى زياد بن أبي سفيان البصرة سنة ٤٥ فولى أمير بن أحمر مرو وخليد بن عبد الله الحنفي أبرشهر وقيس بن الهيثم مرو الروذ والطالقان والفارياب ونافع بن خالد الطاحي من الأزد هراة وبادغيس وبوشنج وقاديس من الأنوران فكان أمير أول من أسكن العرب مرو."
  en: "Governor of Basra in 45h, Ziyad divided Khurasan's commands: Umair ibn al-Ahmar over Marw — the first to settle the Arabs there — Khulayd ibn Abdallah al-Hanafi over Abarshahr, Qays ibn al-Haytham over Marw al-Rudh, Talaqan and Faryab, Nafi' ibn Khalid al-Tahi of the Azd over Herat, Badghis and Bushanj, and Qadis of the Anwaran."
