id: event/ziyad-khurasan-settlement
class: event
kind: other
label: { ar: "تقسيم زياد أعمال خراسان سنة ٤٥", en: "Ziyad's Partition of Khurasan, 45h", es: "Partición de Khurasan por Ziyad, 45 h", fr: "La partition du Khurasan par Ziyad, 45h", ur: "زیاد کی خراسان کی تقسیم، 45ھ", tr: "Horasan'ın 45. yıldaki işlerinin paylaşımı", id: "Pembagian pekerjaan Khorasan pada tahun 45" }
summary:
  ar: "ولى زياد بن أبي سفيان البصرة سنة ٤٥ فولى أمير بن أحمر مرو وخليد بن عبد الله الحنفي أبرشهر وقيس بن الهيثم مرو الروذ والطالقان والفارياب ونافع بن خالد الطاحي من الأزد هراة وبادغيس وبوشنج وقاديس من الأنوران فكان أمير أول من أسكن العرب مرو."
  en: "Governor of Basra in 45h, Ziyad divided Khurasan's commands: Umair ibn al-Ahmar over Marw — the first to settle the Arabs there — Khulayd ibn Abdallah al-Hanafi over Abarshahr, Qays ibn al-Haytham over Marw al-Rudh, Talaqan and Faryab, Nafi' ibn Khalid al-Tahi of the Azd over Herat, Badghis and Bushanj, and Qadis of the Anwaran."
  es: "Gobernador de Basora en 45h, Ziyad dividió los mandos de Khurasan: Umair ibn al-Ahmar sobre Marw - el primero en asentar a los árabes allí - Khulayd ibn Abdallah al-Hanafi sobre Abarshahr, Qays ibn al-Haytham sobre Marw al-Rudh, Talaqan y Faryab, Nafi' ibn Khalid al-Tahi de Azd sobre Herat, Badghis y Bushanj, y Qadis de los Anwaran."
  fr: "Gouverneur de Bassorah en 45 heures, Ziyad partagea les commandements du Khurasan: Umair ibn al-Ahmar sur Marw — le premier à y installer les Arabes — Khulayd ibn Abdallah al-Hanafi sur Abarshahr, Qays ibn al-Haytham sur Marw al-Rudh, Talaqan et Faryab, Nafi' ibn Khalid al-Tahi de l'Azd sur Herat, Badghis et Bushanj et Qadis de l'Anwaran."
  ur: "45ھ میں بصرہ کے گورنر، زیاد نے خراسان کے احکام کو تقسیم کیا: عمیر بن الاحمر مرو پر - سب سے پہلے عربوں کو وہاں آباد کرنے والے - ابرشہر پر خلید بن عبداللہ الحنفی، قیس ابن الہیثم مرو الرض پر، اور الطالبان الطبقان، الطبقان۔ ہرات، بادغیس اور بوشنج اور انواران کے قادیس پر ازد۔"
  tr: "Ziyad ibn Abi Sufyan, 45 yılında Basra valiliğine atandı. Amir ibn Ahmar, Merv valiliğine; Halid ibn Abdullah el-Hanafi, Aberşahr valiliğine; Kays ibn el-Haytham, Merv el-Rudh, Talqan ve Faryab valiliğine; Azd kabilesinden Nafi' ibn Halid el-Tahi ise Herat, Badghis, Bushanj ve Enveran kabilesinden Kadıs valiliğine atandı. Merv'e Arapları yerleştiren ilk kişi Amir oldu."
  id: "Ziyad ibn Abi Sufyan diangkat menjadi gubernur Basra pada tahun 45. Amir ibn Ahmar diangkat menjadi gubernur Marw, Khalid ibn Abdullah al-Hanafi diangkat menjadi gubernur Abarshahr, Qais ibn al-Haytham diangkat menjadi gubernur Marw al-Rudh, Talqan dan Faryab, dan Nafi’ ibn Khalid al-Tahi dari Azd diangkat menjadi gubernur Herat, Badghis, Bushanj dan Qadis dari Anwaran. Amir adalah orang pertama yang menempatkan orang Arab di Marw."
