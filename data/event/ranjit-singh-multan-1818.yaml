label: { ar: "أخذ رانجيت سينغ الملتان ١٨١٨م", en: "Ranjit Singh's conquest of Multan, 1818" }
summary:
  ar: "بعد حروب طويلة مع السيخ أخذ رانجيت سينغ مدينة الملتان سنة ١٨١٨م، فاستقر حكم السيخ عليها حتى وفاته سنة ١٨٣٩م؛ ومدّد ديوان سيوان مال، الذي حكم الملتان بين ١٨٢١ و١٨٤٤م، نفوذه على نواحٍ مجاورة {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  en: "After long warfare with the Sikhs, Ranjit Singh took the city of Multan in 1818, and Sikh rule there stayed firm until his death in 1839; Diwan Sewan Mal, who governed Multan between 1821 and 1844, extended his influence over adjacent areas {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  ur: "سیخوں سے طویل جنگوں کے بعد رنجیت سنگھ نے 1818ء میں ملتان پر قبضہ کیا، اور سکھ حکومت اس کی وفات 1839ء تک مضبوط رہی؛ دیوان سیون مال نے، جو 1821ء تا 1844ء ملتان کا حاکم رہا، متصلہ علاقوں پر اپنا اثر وسیع کیا {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}۔"
