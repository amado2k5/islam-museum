label: { ar: "وفاة الملك الظاهر بيبرس سنة 676هـ", en: "Death of al-Zahir Baybars, 676" }
summary:
  ar: "في نصف المحرم سنة ست وسبعين مرض السلطان بيبرس بقصره الأبلق بمرجة دمشق، وتوفي بعد ثلاثة عشر يوماً — قال الذهبي يوم الخميس لثمانٍ وعشرين من المحرم — فأخفي موته وسار نائبه بيلبك بمحفة يوهم أن السلطان فيها مريض حتى دخل بالجيش مصر، فأظهر موته وعمل العزاء وحلفت الأمراء لولده الملك السعيد. ونقله ولده إلى تربة بنى عليها مدرسة الظاهرية. وكان قد فتح من بلاد الفرنج أربعين حصناً عنوة {cite:shadharat-dhahab p. 610-611}."
  en: "Mid-Muharram 676 — Baybars sickened at his Ablaq palace by Damascus's hippodrome and died thirteen days later (Dhahabi: Thursday 28 Muharram). His death concealed, the na'ib Bilbak marched the litter south feigning a sick sultan until the army was inside Egypt; then the mourning was declared and the amirs swore to his son al-Malik al-Sa'id. Forty Frankish fortresses had fallen to him by the sword {cite:shadharat-dhahab p. 610-611}."
