label: { ar: "وفاة الملك الظاهر بيبرس سنة 676هـ", en: "Death of al-Zahir Baybars, 676", fr: "La mort d'al-Zahir Baybars, 676", es: "Muerte de al-Zahir Baybars, 676", ur: "الظاہر بیبرس کی وفات، 676", tr: "Kral Zahir Beybers'in Hicri 676 yılında vefatı.", id: "Wafatnya Raja Al-Zahir Baybars pada tahun 676 Hijriah" }
summary:
  ar: "في نصف المحرم سنة ست وسبعين مرض السلطان بيبرس بقصره الأبلق بمرجة دمشق، وتوفي بعد ثلاثة عشر يوماً — قال الذهبي يوم الخميس لثمانٍ وعشرين من المحرم — فأخفي موته وسار نائبه بيلبك بمحفة يوهم أن السلطان فيها مريض حتى دخل بالجيش مصر، فأظهر موته وعمل العزاء وحلفت الأمراء لولده الملك السعيد. ونقله ولده إلى تربة بنى عليها مدرسة الظاهرية. وكان قد فتح من بلاد الفرنج أربعين حصناً عنوة {cite:shadharat-dhahab p. 610-611}."
  en: "Mid-Muharram 676 — Baybars sickened at his Ablaq palace by Damascus's hippodrome and died thirteen days later (Dhahabi: Thursday 28 Muharram). His death concealed, the na'ib Bilbak marched the litter south feigning a sick sultan until the army was inside Egypt; then the mourning was declared and the amirs swore to his son al-Malik al-Sa'id. Forty Frankish fortresses had fallen to him by the sword {cite:shadharat-dhahab p. 610-611}."
  fr: "Mi-Muharram 676 : Baybars tomba malade dans son palais Ablaq, près de l'hippodrome de Damas, et mourut treize jours plus tard (al-Dhahabi : jeudi 28 Muharram). Sa mort tenue secrète, le na'ib Bilbak fit descendre la litière vers le sud en feignant un sultan malade jusqu'à ce que l'armée soit en Égypte ; puis le deuil fut proclamé et les émirs prêtèrent serment à son fils al-Malik al-Sa'id. Quarante forteresses franques étaient tombées entre ses mains par l'épée {cite:shadharat-dhahab p. 610-611}."
  es: "A mediados de Muharram de 676, Baybars enfermó en su palacio de Ablaq, cerca del hipódromo de Damasco, y murió trece días después (Dhahabi: jueves 28 de Muharram). Su muerte fue ocultada; el na'ib Bilbak marchó en litera hacia el sur, fingiendo que el sultán estaba enfermo, hasta que el ejército entró en Egipto. Entonces se declaró el luto y los emires juraron lealtad a su hijo, al-Malik al-Sa'id. Cuarenta fortalezas francas habían caído en sus manos a espada {cita: shadharat-dhahab, págs. 610-611}."
  ur: "وسط محرم 676 - بے بار اپنے ابلاق محل میں دمشق کے ہپوڈروم سے بیمار ہو گئے اور تیرہ دن بعد انتقال کر گئے ⁦(ذہبی: جمعرات 28 محرم)⁩۔ اس کی موت کو پوشیدہ رکھا گیا، نائب بلبک نے ایک بیمار سلطان کا دعویٰ کرتے ہوئے کوڑے کو جنوب کی طرف بڑھایا یہاں تک کہ فوج مصر کے اندر تھی۔ پھر سوگ کا اعلان کیا گیا اور امیروں نے اپنے بیٹے المالک السعید سے قسم کھائی۔ چالیس فرینکش قلعے تلوار سے اس کے ہاتھ میں آ گئے تھے 610-611}۔"
  tr: "Hicri 76 yılının Muharrem ayının ortalarında Sultan Baybars, Şam'daki Marjeh'te bulunan Ablaq Sarayı'nda hastalandı ve on üç gün sonra öldü—el-Dhahabi'nin dediğine göre bu ölüm Muharrem ayının 28. Perşembe günü gerçekleşti—bu nedenle ölümü gizlendi. Vekili Bilbek, Sultan'ın hasta olduğu izlenimini vermek için bir sedyede Mısır'a orduyla birlikte girdi. Orada ölümünü ilan etti, bir yas töreni düzenledi ve emirler oğlu el-Malik el-Sa'id'e biat ettiler. Oğlu daha sonra onu bir türbeye taşıdı ve üzerine el-Zahiriye Medresesi'ni inşa ettirdi. Frank topraklarında kırk kaleyi zorla ele geçirmişti."
  id: "Pada pertengahan bulan Muharram tahun 76 Hijriah, Sultan Baybars jatuh sakit di Istana Ablaq di Marjeh, Damaskus, dan meninggal tiga belas hari kemudian—al-Dhahabi mengatakan pada hari Kamis, tanggal 28 Muharram—sehingga kematiannya disembunyikan. Wakilnya, Bilbek, menaiki tandu, memberikan kesan bahwa Sultan sedang sakit, sampai ia memasuki Mesir bersama pasukan. Di sana, ia mengumumkan kematiannya, mengadakan upacara berkabung, dan para emir bersumpah setia kepada putranya, al-Malik al-Sa'id. Putranya kemudian memindahkannya ke sebuah makam tempat ia membangun Madrasah al-Zahiriyah. Ia telah menaklukkan empat puluh benteng di tanah Frank dengan kekerasan."
