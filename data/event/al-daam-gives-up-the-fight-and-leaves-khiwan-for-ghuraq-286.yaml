id: event/al-daam-gives-up-the-fight-and-leaves-khiwan-for-ghuraq-286
class: event
kind: other
label:
  ar: الدعام يعزم على ترك قتال الهادي ويخرج من خيوان إلى غرق، صفر 286هـ
  en: Al-Da'am resolves not to fight al-Hadi and leaves Khiwan for Ghuraq, Safar 286 AH
  ur: دعام کا ہادی سے نہ لڑنے کا فیصلہ اور خیوان سے غرق روانگی، صفر 286ھ
summary:
  ar: لما اختلف رأي أهل خيوان بين قتال الهادي ومخادعته، قال الدعام إنه أول من استدعى هذا الرجل وأخرجه من بلده، وإنه عازم ألا يقاتله أبداً وأن يسمع له ويطيع، وإنه خارج من خيوان إلى بلده، وترك لهم أن يعملوا لأنفسهم. وأرسل جماعة من مشايخ خيوان ووجوهها إلى الهادي بهذا الكلام وخرج هو إلى غرق، فوصلوا إلى حوث وطلبوا الأمان لأهل خيوان فأعطاهم إياه.
  en: When the people of Khiwan differed between fighting al-Hadi and deceiving him, al-Da'am said that he was the first to bring this man and take him out of his own land, that he was resolved never to fight him and to hear and obey, and that he was leaving Khiwan for his own country, leaving them to act for themselves. He sent a party of Khiwan's elders and notables to al-Hadi with this message and went out to Ghuraq; they came to Hawth and asked safe-conduct for the people of Khiwan, which al-Hadi gave.
  ur: جب خیوان والوں کی رائے ہادی سے لڑنے اور انہیں دھوکہ دینے کے بارے میں بٹ گئی تو دعام نے کہا کہ وہی ہے جس نے اس شخص کو بلایا اور اس کے وطن سے نکالا، اور وہ طے کر چکا ہے کہ کبھی اس سے نہیں لڑے گا بلکہ سنے گا اور مانے گا، اور وہ خیوان سے اپنے ملک جا رہا ہے، لوگ اپنی فکر خود کریں۔ اس نے خیوان کے کچھ بزرگوں اور معززین کو یہ پیغام دے کر ہادی کے پاس بھیجا اور خود غرق چلا گیا؛ وہ حوث پہنچے اور اہل خیوان کے لیے امان مانگی جو انہوں نے دے دی۔
