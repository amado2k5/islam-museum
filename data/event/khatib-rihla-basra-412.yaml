summary:
  ar: "رحل الخطيب إلى البصرة وهو ابن عشرين سنة، فسمع بها أبا عمر القاسمي بن جعفر الهاشمي راوي السنن، وعلي بن القاسم الشاهد، والحسن بن علي السابوري، وجماعة {cite:tarikh-islam-dhahabi p. 87}."
  en: "Al-Khatib travelled to Basra at twenty years old and heard there Abu 'Umar al-Qasimi ibn Ja'far al-Hashimi, the transmitter of the Sunan, 'Ali ibn al-Qasim al-Shahid, al-Hasan ibn 'Ali al-Saburi and a circle of others {cite:tarikh-islam-dhahabi p. 87}."
  ur: "خطیب بیس برس کی عمر میں بصرہ گئے اور وہاں ابو عمر قاسمی بن جعفر ہاشمی — راوی سنن — علی بن قاسم شاھد، حسن بن علی سابوری اور دیگر مشائخ سے سماعت کی {cite:tarikh-islam-dhahabi p. 87}۔"
