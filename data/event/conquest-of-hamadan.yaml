summary:
  ar: "فتح همذان ووقعة واج روذ: كان نعيم بن مقرّن بهمذان في اثني عشر ألفًا فكاتب الديلم وأهل الريّ وأذربيجان وأقبل موثا في الديلم والزينبي أبو الفرخان في أهل الريّ وأسفنديار أخو رستم في أهل أذربيجان، فخرج إليهم نعيم فاقتتلوا بواج روذ قتالًا شديدًا وكانت وقعة عظيمة تعدل بنهاوند فانهزم الفرس هزيمة قبيحة وقتل منهم مقتلة لا يحصون. وقيل إن المغيرة أرسل جرير بن عبد الله فقاتله أهل همذان فأصيبت عينه بسهم فقال احتسبتها عند الله الذي زين بها وجهي ونور لي ما شاء ثم سلبنيها في سبيله، ثم فتحها على مثل صلح نهاوند {cite:kamil-ibn-al-athir p. 405-406}."
  en: "Nu'aym ibn al-Muqarrin held Hamadan with twelve thousand when the Daylam, Rayy and Azerbaijan armies converged — at Waj Rudh he fought a battle reckoned the equal of Nahavand and broke them utterly. In another telling Jarir ibn 'Abdallah took an arrow in the eye before the walls and said: «I count it with God, who adorned my face with it and gave me light as long as He willed, then took it back in His path«; Hamadan capitulated on the Nahavand terms {cite:kamil-ibn-al-athir p. 405-406}."
  es: "Nu'aym ibn al-Muqarrin defendió Hamadán con doce mil hombres cuando convergieron los ejércitos de Daylam, Rayy y Azerbaiyán; en Waj Rudh libró una batalla comparable a la de Nahavand y los derrotó por completo. En otro relato, Jarir ibn 'Abdallah recibió una flecha en el ojo frente a las murallas y dijo: «Lo atribuyo a Dios, quien adornó mi rostro con ella y me iluminó mientras quiso, y luego la retiró en su camino»; Hamadán capituló según los términos de Nahavand {cite:kamil-ibn-al-athir p. 405-406}."
  fr: "Nu'aym ibn al-Muqarrin tenait Hamadan avec douze mille hommes lorsque les armées de Daylam, de Rayy et d'Azerbaïdjan convergèrent. À Waj Rudh, il livra une bataille considérée comme l'égale de celle de Nahavand et les anéantit complètement. Selon un autre récit, Jarir ibn 'Abdallah reçut une flèche dans l'œil devant les remparts et dit: « Je l'attribue à Dieu, qui a orné mon visage de cette flèche et m'a donné la lumière aussi longtemps qu'Il l'a voulu, puis l'a reprise sur Son chemin. » Hamadan capitula aux conditions de Nahavand (voir Kamil ibn al-Athir, p. 405-406)."
  ur: "نعیم ابن المقرین نے ہمدان کو بارہ ہزار کے ساتھ تھام لیا جب دیلم، رے اور آذربائیجان کی فوجیں اکٹھی ہوئیں - وج رد کے مقام پر اس نے ایک جنگ لڑی جس میں نہاوند کے برابر شمار کیا گیا تھا اور انہیں مکمل طور پر توڑ دیا تھا۔ ایک اور بیان میں جریر بن عبداللہ نے دیواروں کے آگے آنکھ میں تیر لیا اور کہا: \"میں اسے خدا سے شمار کرتا ہوں جس نے اس سے میرے چہرے کو آراستہ کیا اور جب تک اس نے چاہا مجھے روشنی بخشی، پھر اسے اپنے راستے میں واپس لے لیا۔\" حمدان نے نہاوند کی شرائط کو تسلیم کیا 405-406}۔"
  tr: "Hamadan'ın Fethi ve Vaj Rudh Muharebesi: Nu'aym ibn Mukarrin, on iki bin adamıyla Hamadan'daydı. Delamlılar, Rayy halkı ve Azerbaycanlılarla yazışmalar yapıyordu. Mutha Delamlılarla, el-Zaynabi Ebu el-Farhan Rayy halkıyla ve Rüştam'ın kardeşi İsfandiyar Azerbaycan halkıyla geldi. Nu'aym onlarla buluşmak için yola çıktı ve Vaj Rudh'da şiddetli bir muharebe yaptılar. Bu, Nahavand muharebesine benzer büyük bir muharebeydi ve Persler sayısız kayıpla korkunç bir yenilgiye uğradılar. Rivayet olunur ki, el-Muğira, Hamadan halkıyla savaşan Cerir ibn Abdullah'ı gönderdi. Gözüne bir ok isabet etti ve şöyle dedi: \"Onu Allah'a emanet ediyorum, O da yüzümü onunla süsledi ve dilediği gibi aydınlattı. Sonra da kendi davası için onu benden aldı.\" Daha sonra Nahavand muharebesine benzer bir antlaşmayla şehri fethetti. {alıntı: kamil-ibn-el-esir s. 405-406}"
  id: "Penaklukan Hamadan dan Pertempuran Waj Rudh: Nu'aym ibn Muqarrin berada di Hamadan dengan dua belas ribu orang. Ia berkorespondensi dengan kaum Daylam, penduduk Rayy, dan Azerbaijan. Mutha datang bersama kaum Daylam, al-Zaynabi Abu al-Farkhan bersama penduduk Rayy, dan Isfandiyar, saudara Rustam, bersama penduduk Azerbaijan. Nu'aym bergerak maju untuk menemui mereka, dan mereka bertempur sengit di Waj Rudh. Itu adalah pertempuran besar, sebanding dengan Nahavand, dan Persia menderita kekalahan yang mengerikan, dengan korban jiwa yang tak terhitung jumlahnya. Dikatakan bahwa al-Mughira mengirim Jarir ibn Abdullah, yang diperangi oleh penduduk Hamadan. Ia terkena panah di mata dan berkata, \"Aku menyerahkannya kepada Allah, yang menghiasi wajahku dengannya dan meneranginya sesuai kehendak-Nya. Kemudian Dia mengambilnya dariku untuk kepentingan-Nya.\" Kemudian ia menaklukkannya dengan perjanjian yang mirip dengan perjanjian Nahavand. {mengutip: kamil-ibn-al-athir hal. 405-406}"
