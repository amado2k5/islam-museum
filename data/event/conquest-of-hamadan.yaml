summary:
  ar: "فتح همذان ووقعة واج روذ: كان نعيم بن مقرّن بهمذان في اثني عشر ألفًا فكاتب الديلم وأهل الريّ وأذربيجان وأقبل موثا في الديلم والزينبي أبو الفرخان في أهل الريّ وأسفنديار أخو رستم في أهل أذربيجان، فخرج إليهم نعيم فاقتتلوا بواج روذ قتالًا شديدًا وكانت وقعة عظيمة تعدل بنهاوند فانهزم الفرس هزيمة قبيحة وقتل منهم مقتلة لا يحصون. وقيل إن المغيرة أرسل جرير بن عبد الله فقاتله أهل همذان فأصيبت عينه بسهم فقال احتسبتها عند الله الذي زين بها وجهي ونور لي ما شاء ثم سلبنيها في سبيله، ثم فتحها على مثل صلح نهاوند {cite:kamil-ibn-al-athir p. 405-406}."
  en: "Nu'aym ibn al-Muqarrin held Hamadan with twelve thousand when the Daylam, Rayy and Azerbaijan armies converged — at Waj Rudh he fought a battle reckoned the equal of Nahavand and broke them utterly. In another telling Jarir ibn 'Abdallah took an arrow in the eye before the walls and said: «I count it with God, who adorned my face with it and gave me light as long as He willed, then took it back in His path«; Hamadan capitulated on the Nahavand terms {cite:kamil-ibn-al-athir p. 405-406}."
  es: "Nu'aym ibn al-Muqarrin defendió Hamadán con doce mil hombres cuando convergieron los ejércitos de Daylam, Rayy y Azerbaiyán; en Waj Rudh libró una batalla comparable a la de Nahavand y los derrotó por completo. En otro relato, Jarir ibn 'Abdallah recibió una flecha en el ojo frente a las murallas y dijo: «Lo atribuyo a Dios, quien adornó mi rostro con ella y me iluminó mientras quiso, y luego la retiró en su camino»; Hamadán capituló según los términos de Nahavand {cite:kamil-ibn-al-athir p. 405-406}."
  fr: "Nu'aym ibn al-Muqarrin tenait Hamadan avec douze mille hommes lorsque les armées de Daylam, de Rayy et d'Azerbaïdjan convergèrent. À Waj Rudh, il livra une bataille considérée comme l'égale de celle de Nahavand et les anéantit complètement. Selon un autre récit, Jarir ibn 'Abdallah reçut une flèche dans l'œil devant les remparts et dit: « Je l'attribue à Dieu, qui a orné mon visage de cette flèche et m'a donné la lumière aussi longtemps qu'Il l'a voulu, puis l'a reprise sur Son chemin. » Hamadan capitula aux conditions de Nahavand (voir Kamil ibn al-Athir, p. 405-406)."
