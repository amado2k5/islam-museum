summary:
  ar: "فتح همذان ووقعة واج روذ: كان نعيم بن مقرّن بهمذان في اثني عشر ألفًا فكاتب الديلم وأهل الريّ وأذربيجان وأقبل موثا في الديلم والزينبي أبو الفرخان في أهل الريّ وأسفنديار أخو رستم في أهل أذربيجان، فخرج إليهم نعيم فاقتتلوا بواج روذ قتالًا شديدًا وكانت وقعة عظيمة تعدل بنهاوند فانهزم الفرس هزيمة قبيحة وقتل منهم مقتلة لا يحصون. وقيل إن المغيرة أرسل جرير بن عبد الله فقاتله أهل همذان فأصيبت عينه بسهم فقال احتسبتها عند الله الذي زين بها وجهي ونور لي ما شاء ثم سلبنيها في سبيله، ثم فتحها على مثل صلح نهاوند {cite:kamil-ibn-al-athir p. 405-406}."
  en: "Nu'aym ibn al-Muqarrin held Hamadan with twelve thousand when the Daylam, Rayy and Azerbaijan armies converged — at Waj Rudh he fought a battle reckoned the equal of Nahavand and broke them utterly. In another telling Jarir ibn 'Abdallah took an arrow in the eye before the walls and said: «I count it with God, who adorned my face with it and gave me light as long as He willed, then took it back in His path«; Hamadan capitulated on the Nahavand terms {cite:kamil-ibn-al-athir p. 405-406}."
