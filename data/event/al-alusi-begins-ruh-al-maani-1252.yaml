label:
  ar: "الألوسي يشرع في «روح المعاني»، 1252هـ/1836م"
  en: "Al-Alusi begins Ruh al-Ma'ani, 1252/1836"
  ur: "آلوسی کا «روح المعانی» کا آغاز، 1252ھ/1836ء"
summary:
  ar: "بعد رؤيا رآها في ليلة جمعة من رجب 1252هـ، أن الله أمره بطيّ السماوات والأرض، وفهم منها أنها إشارة إلى تأليف تفسير، شرع محمود الألوسي في «روح المعاني» ليلة السادس عشر من شعبان من تلك السنة، وهي الرابعة والثلاثون من عمره {cite:ruh-al-maani-ilmiyya-1994-v1 p.5}."
  en: "After a dream on a Friday night in Rajab 1252 AH, in which God commanded him to fold the heavens and the earth, and which he took as a sign to write a commentary, Mahmud al-Alusi began Ruh al-Ma'ani on the night of 16 Sha'ban of that year, the thirty-fourth year of his life {cite:ruh-al-maani-ilmiyya-1994-v1 p.5}."
  ur: "رجب 1252ھ میں جمعے کی ایک رات کے خواب کے بعد، جس میں اللہ نے انہیں آسمانوں اور زمین کو لپیٹنے کا حکم دیا اور جسے انہوں نے تفسیر لکھنے کا اشارہ سمجھا، محمود آلوسی نے اسی سال 16 شعبان کی رات «روح المعانی» کا آغاز کیا، جو ان کی عمر کا چونتیسواں سال تھا {cite:ruh-al-maani-ilmiyya-1994-v1 p.5}۔"
