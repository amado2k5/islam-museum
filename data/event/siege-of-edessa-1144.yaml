label: { ar: "حصار الرها", en: "Siege of Edessa", es: "El asedio de Edesa", fr: "Siège d'Édesse", ur: "ایڈیسا کا محاصرہ", tr: "Edessa Kuşatması", id: "Pengepungan Edessa" }
summary:
  ar: "بطاقة أولية لسقوط الرها سنة ١١٤٤م، استردادها عماد الدين زنكي من أيدي الفرنج وهو الحدث الذي استدعى الحملة الثانية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the fall of Edessa in 1144, Imad al-Din Zengi's recovery of the city from the Franks — the event that summoned the Second Crusade; its sources are not yet checked on the page."
  es: "Boceto de ficha para la caída de Edesa en 1144, la recuperación de la ciudad por Imad al-Din Zengi de manos de los francos, el acontecimiento que desencadenó la Segunda Cruzada; sus fuentes aún no han sido verificadas en la página."
  fr: "Projet de fiche pour la chute d'Édesse en 1144, la reprise de la ville par Imad al-Din Zengi aux Francs — l'événement qui a déclenché la deuxième croisade; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1144 میں ایڈیسا کے زوال کے لیے ڈرافٹ کارڈ، عماد الدین زینگی کا فرینکوں سے شہر کی بازیابی - وہ واقعہ جس نے دوسری صلیبی جنگ کو طلب کیا؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1144 yılında Edessa'nın düşüşü ve İmaddin Zengi tarafından Franklardan geri alınmasıyla ilgili ön bilgiler; bu olay ikinci seferin başlatılmasına neden olmuştur; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang jatuhnya Edessa pada tahun 1144 M, perebutannya kembali oleh Imad al-Din Zengi dari bangsa Frank, yang merupakan peristiwa yang memicu kampanye kedua; sumber-sumbernya belum ditinjau di halaman ini."
