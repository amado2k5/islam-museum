label:
  ar: "السجن الأخير في قلعة دمشق حتى الوفاة، ٧٢٦-٧٢٨هـ/١٣٢٦-١٣٢٨م"
  en: "The last imprisonment in the Damascus citadel until death, 726-728/1326-1328"
  ur: "قلعہ دمشق میں آخری قید تا وفات، 726-728ھ/1326-1328ء"
  es: "El último encarcelamiento en la ciudadela de Damasco hasta la muerte, 726-728/1326-1328"
  fr: "Dernière incarcération dans la citadelle de Damas jusqu'à sa mort, 726-728/1326-1328"
  tr: "Son hapis hayatı, Hicri 726-728 / Miladi 1326-1328 yılları arasında ölümüne kadar Şam Kalesi'nde geçti."
  id: "Penahanan terakhirnya adalah di Benteng Damaskus hingga kematiannya, 726-728 H/1326-1328 M."
summary:
  ar: "في ١٦ شعبان ٧٢٦هـ/١٨ يوليو ١٣٢٦م أُلقي القبض على ابن تيمية بلا محاكمة أخرى ونُودي في الجامع الأموي بمرسوم يحرمه الإفتاء، على خلفية رسالته في «زيارة القبور» التي أنكر فيها أعمالاً تقام عند قبور الصالحين، وحُبس معه تلاميذ أُطلقوا بعد قليل إلا ابن قيم الجوزية. مكث في القلعة أكثر من سنتين يكتب ويفتي، ومن مؤلفات تلك الفترة «معارج الوصول» و«رفع الملام» وكتاب «الرد على الإخنائي»، وفي ٩ جمادى الآخرة ٧٢٨هـ/٢١ أبريل ١٣٢٨م أمر السلطان — على شكوى الإخنائي — أن يؤخذ منه الورق والحبر والأقلام. وبعد خمسة أشهر مات في القلعة في ٢٠ ذي القعدة ٧٢٨هـ/٢٦ سبتمبر ١٣٢٨م ودُفن بمقبرة الصوفية حيث ما يزال قبره معروفاً {cite:encyclopaedia-of-islam-2 vol. 3 p. 985}."
  en: "On 16 Sha'ban 726/18 July 1326 Ibn Taymiyya was arrested without further trial, and a sultanic decree depriving him of the right to issue fatwas was read out in the Umayyad Mosque, over his epistle on visits to tombs (ziyarat al-qubur) in which he condemned the cult of the saints. His disciples were arrested with him and soon released — all but Ibn Qayyim al-Jawziyya. He remained a prisoner in the citadel more than two years, writing and issuing fatwas; works of this period include Ma'arij al-wusul, Raf' al-malam, and the Radd 'ala al-Ikhna'i. On 9 Jumada II 728/21 April 1328, on a complaint by al-Ikhna'i, the sultan ordered his paper, ink and pens taken from him. Five months later he died in the citadel, on 20 Dhu al-Qa'da 728/26 September 1328, and was buried in the cemetery of the Sufiyya, where his tomb is still honoured {cite:encyclopaedia-of-islam-2 vol. 3 p. 985}."
  ur: "16 شعبان 726ھ/18 جولائی 1326ء کو ابن تیمیہ کو بغیر کسی نئے محاکمے کے گرفتار کیا گیا اور جامع اموی میں سلطان کا فرمان پڑھا گیا جس نے انہیں فتویٰ کے حق سے محروم کیا، وجہ قبروں کی زیارت پر ان کا رسالہ تھا جس میں انہوں نے صالحین کے قبروں پر کیے جانے والے اعمال کی مذمت کی۔ ان کے شاگرد بھی گرفتار ہوئے مگر جلد رہا ہوئے، سوائے ابن قیم الجوزیہ کے۔ وہ قلعہ میں دو سال سے زیادہ قید رہے، لکھتے اور فتویٰ دیتے رہے؛ اس دور کی تصانیف میں «معارج الوصول»، «رفع الملام» اور «الرد علی الإخنائي» ہیں۔ 9 جمادی الآخر 728ھ/21 اپریل 1328ء کو اخنائی کی شکایت پر سلطان نے ان کا کاغذ، سیاہی اور قلم چھین لینے کا حکم دیا۔ پانچ ماہ بعد وہ قلعہ میں 20 ذوالقعدہ 728ھ/26 ستمبر 1328ء کو فوت ہوئے اور مقبرہ صوفیہ میں دفن کیے گئے جہاں ان کا مزار آج بھی معروف ہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 985}۔"
  es: "El 16 de Sha'ban de 726/18 de julio de 1326, Ibn Taymiyya fue arrestado sin juicio previo, y en la Mezquita de los Omeyas se leyó un decreto sultánico que lo privaba del derecho a emitir fatuas, debido a su epístola sobre las visitas a las tumbas (ziyarat al-qubur), en la que condenaba el culto a los santos. Sus discípulos fueron arrestados con él y pronto liberados, todos excepto Ibn Qayyim al-Jawziyya. Permaneció prisionero en la ciudadela durante más de dos años, escribiendo y emitiendo fatuas; entre las obras de este período se encuentran Ma'arij al-wusul, Raf' al-malam y Radd 'ala al-Ikhna'i. El 9 de Jumada II de 728/21 de abril de 1328, tras una queja de al-Ikhna'i, el sultán ordenó que le confiscaran el papel, la tinta y las plumas. Cinco meses después murió en la ciudadela, el 20 de Dhu al-Qa'da de 728/26 de septiembre de 1328, y fue enterrado en el cementerio de los sufíes, donde su tumba aún es venerada {cite:encyclopaedia-of-islam-2 vol. 3 p. 985}."
  fr: "Le 16 Sha'ban 726 (18 juillet 1326), Ibn Taymiyya fut arrêté sans autre procès. Un décret sultan le privant du droit d'émettre des fatwas fut lu à la mosquée des Omeyyades, au-dessus de son épître sur les visites aux tombeaux (ziyarat al-qubur) dans laquelle il condamnait le culte des saints. Ses disciples furent arrêtés avec lui et rapidement relâchés, à l'exception d'Ibn Qayyim al-Jawziyya. Il demeura prisonnier dans la citadelle pendant plus de deux ans, rédigeant et émettant des fatwas. Parmi ses œuvres de cette période figurent Ma'arij al-wusul, Raf' al-malam et le Radd 'ala al-Ikhna'i. Le 9 Jumada II 728 (21 avril 1328), suite à une plainte d'al-Ikhna'i, le sultan ordonna qu'on lui retire son papier, son encre et ses plumes. Cinq mois plus tard, il mourut dans la citadelle, le 20 Dhu al-Qa'da 728/26 septembre 1328, et fut enterré dans le cimetière de la Soufie, où sa tombe est encore honorée {cite:encyclopaedia-of-islam-2 vol. 3 p. 985}."
  tr: "Hicri 726 yılının Şaban ayının 16'sında/Miladi 18 Temmuz 1326'da İbn Taymiyye, daha fazla yargılama yapılmadan tutuklandı ve Emevi Mescidi'nde fetva vermesini yasaklayan bir kararname ilan edildi. Bu, \"Kabir Ziyareti\" adlı eserinde, salih kişilerin kabirlerinde yapılan bazı uygulamaları kınamasından kaynaklanıyordu. Öğrencileri de onunla birlikte hapsedildi, ancak İbn Kayyim el-Cevziyye hariç kısa süre sonra serbest bırakıldılar. İbn Kayyim el-Cevziyye iki yıldan fazla bir süre kalede kaldı, fetvalar yazmaya ve yayınlamaya devam etti. Bu dönemdeki eserleri arasında \"Ma'arij el-Vusul\" (Mükafatlandırmaya Yükseliş), \"Raf' el-Malam\" (Kınama Kaldırma) ve \"El-Radd 'ala el-İhnai\" (İhnaî'nin Reddi) bulunmaktadır. Hicri 728 Cemâde el-Ahire'nin 9. gününde (Miladi 21 Nisan 1328), Sultan, el-İhnaî'nin şikayeti üzerine, kağıdının, mürekkebinin ve kalemlerinin müsadere edilmesini emretti. Beş ay sonra, Hicri 728 Zilhicce'nin 20. gününde (Miladi 26 Eylül 1328), Kalede vefat etti ve mezarı hala bilinen Sufi mezarlığına defnedildi. {cite:encyclopaedia-of-islam-2 vol. 3 p. 985}"
  id: "Pada tanggal 16 Sya'ban 726 H/18 Juli 1326 M, Ibnu Taymiyyah ditangkap tanpa pengadilan lebih lanjut, dan sebuah dekrit yang melarangnya mengeluarkan fatwa diumumkan di Masjid Umayyah. Hal ini disebabkan oleh risalahnya tentang \"Mengunjungi Kuburan,\" di mana ia mengecam praktik-praktik tertentu yang dilakukan di kuburan orang-orang saleh. Murid-muridnya dipenjara bersamanya, tetapi segera dibebaskan, kecuali Ibnu Qayyim al-Jawziyya. Ia tetap berada di Benteng selama lebih dari dua tahun, menulis dan mengeluarkan fatwa. Di antara karya-karyanya dari periode ini adalah \"Ma'arij al-Wusul\" (Naik Menuju Pencapaian), \"Raf' al-Malam\" (Menghapus Celaan), dan \"Al-Radd 'ala al-Ikhna'i\" (Penolakan terhadap al-Ikhna'i). Pada tanggal 9 Jumada al-Akhirah 728 H/21 April 1328 M, Sultan, atas pengaduan dari al-Ikhna'i, memerintahkan agar kertas, tinta, dan pena miliknya disita. Lima bulan kemudian, pada tanggal 20 Dzul Qi'dah 728 H/26 September 1328 M, beliau wafat di Benteng dan dimakamkan di pemakaman Sufi, di mana makamnya masih dikenal hingga sekarang. {cite:encyclopaedia-of-islam-2 vol. 3 p. 985}"
