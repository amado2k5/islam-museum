id: event/ibn-taymiyya-final-imprisonment-726
class: event
kind: persecution
label:
  ar: "السجن الأخير في قلعة دمشق حتى الوفاة، ٧٢٦-٧٢٨هـ/١٣٢٦-١٣٢٨م"
  en: "The last imprisonment in the Damascus citadel until death, 726-728/1326-1328"
  ur: "قلعہ دمشق میں آخری قید تا وفات، 726-728ھ/1326-1328ء"
summary:
  ar: "في ١٦ شعبان ٧٢٦هـ/١٨ يوليو ١٣٢٦م أُلقي القبض على ابن تيمية بلا محاكمة أخرى ونُودي في الجامع الأموي بمرسوم يحرمه الإفتاء، على خلفية رسالته في «زيارة القبور» التي أنكر فيها أعمالاً تقام عند قبور الصالحين، وحُبس معه تلاميذ أُطلقوا بعد قليل إلا ابن قيم الجوزية. مكث في القلعة أكثر من سنتين يكتب ويفتي، ومن مؤلفات تلك الفترة «معارج الوصول» و«رفع الملام» وكتاب «الرد على الإخنائي»، وفي ٩ جمادى الآخرة ٧٢٨هـ/٢١ أبريل ١٣٢٨م أمر السلطان — على شكوى الإخنائي — أن يؤخذ منه الورق والحبر والأقلام. وبعد خمسة أشهر مات في القلعة في ٢٠ ذي القعدة ٧٢٨هـ/٢٦ سبتمبر ١٣٢٨م ودُفن بمقبرة الصوفية حيث ما يزال قبره معروفاً {cite:encyclopaedia-of-islam-2 vol. 3 p. 985}."
  en: "On 16 Sha'ban 726/18 July 1326 Ibn Taymiyya was arrested without further trial, and a sultanic decree depriving him of the right to issue fatwas was read out in the Umayyad Mosque, over his epistle on visits to tombs (ziyarat al-qubur) in which he condemned the cult of the saints. His disciples were arrested with him and soon released — all but Ibn Qayyim al-Jawziyya. He remained a prisoner in the citadel more than two years, writing and issuing fatwas; works of this period include Ma'arij al-wusul, Raf' al-malam, and the Radd 'ala al-Ikhna'i. On 9 Jumada II 728/21 April 1328, on a complaint by al-Ikhna'i, the sultan ordered his paper, ink and pens taken from him. Five months later he died in the citadel, on 20 Dhu al-Qa'da 728/26 September 1328, and was buried in the cemetery of the Sufiyya, where his tomb is still honoured {cite:encyclopaedia-of-islam-2 vol. 3 p. 985}."
  ur: "16 شعبان 726ھ/18 جولائی 1326ء کو ابن تیمیہ کو بغیر کسی نئے محاکمے کے گرفتار کیا گیا اور جامع اموی میں سلطان کا فرمان پڑھا گیا جس نے انہیں فتویٰ کے حق سے محروم کیا، وجہ قبروں کی زیارت پر ان کا رسالہ تھا جس میں انہوں نے صالحین کے قبروں پر کیے جانے والے اعمال کی مذمت کی۔ ان کے شاگرد بھی گرفتار ہوئے مگر جلد رہا ہوئے، سوائے ابن قیم الجوزیہ کے۔ وہ قلعہ میں دو سال سے زیادہ قید رہے، لکھتے اور فتویٰ دیتے رہے؛ اس دور کی تصانیف میں «معارج الوصول»، «رفع الملام» اور «الرد علی الإخنائي» ہیں۔ 9 جمادی الآخر 728ھ/21 اپریل 1328ء کو اخنائی کی شکایت پر سلطان نے ان کا کاغذ، سیاہی اور قلم چھین لینے کا حکم دیا۔ پانچ ماہ بعد وہ قلعہ میں 20 ذوالقعدہ 728ھ/26 ستمبر 1328ء کو فوت ہوئے اور مقبرہ صوفیہ میں دفن کیے گئے جہاں ان کا مزار آج بھی معروف ہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 985}۔"
