  en: "Shaykh of Dar al-Hadith al-Zahiriyya, Cairo, Shawwal 723"
  ur: "دار الحدیث ظاہریہ قاہرہ کی شیخت، شوال 723ھ"
summary:
  ar: "في شوال ٧٢٣هـ باشر تقي الدين السبكي مشيخة دار الحديث الظاهرية بالقاهرة بعد زكي الدين عبد العظيم بن شرف الدين الدمياطي، ثم انتُزعت منه في ذي القعدة لفتح الدين ابن سيد الناس اليعمري {cite:al-bidaya-wal-nihaya s.a. 723 p. 109}."
  en: "In Shawwal 723 al-Subki took up the shaykhhood of the Zahiriyya hadith school in Cairo after Zaki al-Din Abd al-Azim ibn Sharaf al-Din al-Dimyati; the post was taken from him in Dhu al-Qa'da for Fath al-Din Ibn Sayyid al-Nas al-Ya'mari {cite:al-bidaya-wal-nihaya s.a. 723 p. 109}."
  ur: "شوال 723ھ میں سبکی نے قاہرہ کی دار الحدیث ظاہریہ کی شیخت زکی الدین عبد العظیم بن شرف الدین دمیاطی کے بعد سنبھالی؛ ذو القعدہ میں یہ منصب فتح الدین ابن سید الناس یعمری کو دے دیا گیا {cite:al-bidaya-wal-nihaya s.a. 723 p. 109}۔"
