label: { ar: "فتح أشروسنة على يد أحمد بن أبي خالد", en: "Ahmad ibn Abi Khalid's Conquest of Ushrusana", fr: "Conquête de l’Ushrusana par Ahmad ibn Abi Khalid", es: "La conquista de Ushrusana por Ahmad ibn Abi Khalid" }
summary:
  ar: "وجه المأمون أحمد بن أبي خالد الأحول الكاتب لغزو أشروسنة في جيش عظيم فلما بلغ كاوس إقباله نحوه بعث الفضل بن كاوس إلى الترك يستنجدهم فأنجده منهم الدهم وقدم أحمد بن أبي خالد بلد أشروسنة فأناخ على مدينتها قبل موافاة الفضل بالتراك فكان تقدير كاوس فيه أن يسلك الطريق البعيدة وأنه لا يعرف هذه الطريق المختصرة فسقط في يده ونخب قلبه فاستسلم وخرج في الطاعة وبلغ الفضل خبره فانحاز بالتراك إلى مفازة هناك ثم فارقهم وسار جاداً حتى أتى أباه فدخل في أمانه وهلك الترك عطشاً وورد كاوس مدينة السلام فأظهر الإسلام وملكه المأمون على بلاده ثم ملك حيدر ابنه وهو الأفشين بعده."
  en: "Al-Ma'mun sent the katib Ahmad ibn Abi Khalid al-Ahwal in a great host; Kawus summoned the Turks through al-Fadl ibn Kawus — but Ahmad camped on the city by Haydar's short road before the Turks came, and Kawus, who had reckoned him bound to the long route, despaired and yielded. Al-Fadl drew the Turks into a waterless waste, slipped away to his father's aman, and the Turks perished of thirst. Kawus showed Islam at Baghdad and was re-kingdomed, then his son Haydar — al-Afshin — after him."
  fr: "Al-Ma'mun envoya le secrétaire Ahmad ibn Abi Khalid al-Ahwal avec une grande armée ; Kawus appela les Turcs par l’intermédiaire d’al-Fadl ibn Kawus, mais Ahmad campa devant la ville avant leur arrivée grâce au chemin court indiqué par Haydar. Kawus, qui l’avait cru contraint au long trajet, désespéra et se soumit. Al-Fadl entraîna les Turcs dans un désert sans eau, s’échappa pour se placer sous la protection de son père, et les Turcs périrent de soif. Kawus professa l’islam à Bagdad et fut confirmé comme roi ; son fils Haydar, al-Afshin, lui succéda."
  es: "Al-Ma'mun envió al katib Ahmad ibn Abi Khalid al-Ahwal con un gran ejército; Kawus convocó a los turcos a través de al-Fadl ibn Kawus, pero Ahmad acampó en la ciudad junto al camino corto de Haydar antes de que llegaran los turcos, y Kawus, que lo había considerado obligado a tomar la ruta larga, se desesperó y cedió. Al-Fadl atrajo a los turcos a un páramo sin agua, se escabulló al aman de su padre, y los turcos perecieron de sed. Kawus proclamó el Islam en Bagdad y fue restaurado en el trono, y después su hijo Haydar, al-Afshin."
