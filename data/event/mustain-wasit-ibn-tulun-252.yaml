id: event/mustain-wasit-ibn-tulun-252
class: event
kind: other
label:
  ar: "إنزال المستعين إلى واسط في صحبة أحمد بن طولون، ٢٥٢هـ/٨٦٦م"
  en: "Al-Musta'in sent down to Wasit under Ahmad ibn Tulun's guard, 252/866"
  ur: "مستعین کو احمد بن طولون کی نگہبانی میں واسط بھیجنا، 252ھ/866ء"
  es: "Al-Musta'in fue enviado a Wasit bajo la custodia de Ahmad ibn Tulun, 252/866"
  fr: "Al-Musta'in fut envoyé à Wasit sous la garde d'Ahmad ibn Tulun, 252/866"
  tr: "El-Musta'in, Ahmed ibn Tulun ile birlikte Hicri 252/Miladi 866 yılında Wasit'e getirildi."
  id: "Al-Musta'in dibawa ke Wasit bersama Ahmad ibn Tulun, pada tahun 252 H/866 M."
summary:
  ar: "لما خلع المستعين نفسه في أول سنة اثنتين وخمسين ومائتين أُحدر إلى واسط محبوساً تسعة أشهر {cite:tarikh-khulafa-minhaj-1434 p. 555-556}، واختار أن يكون أحمد بن طولون في صحبته فأحسن صحبته؛ وكتب إليه غلمان المتوكل أن اقتله فإن قتلته ولّيناك واسطاً فأبى وقال والله لا أرى لله قتلت خليفة بايعته أبداً، فلما قُتل غسل جثته وكفّنها وواراها {cite:muntazam-ibn-al-jawzi j.5 p. 76} {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}."
  en: "When al-Musta'in deposed himself at the opening of 252/866 he was sent down to Wasit and held for nine months {cite:tarikh-khulafa-minhaj-1434 p. 555-556}. Asked whom he wanted in his company he chose Ahmad ibn Tulun, who served him well; al-Mutawakkil's ghilman wrote offering him Wasit itself if he would kill the ex-caliph, and he refused — 'by God, I will never let it be said of me that I killed a caliph I had sworn allegiance to' — and when al-Musta'in was murdered he washed, shrouded and buried the body {cite:muntazam-ibn-al-jawzi j.5 p. 76} {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}."
  ur: "جب مستعین نے 252ھ/866ء کے آغاز میں خود خلعت سے دستبردار ہوا تو اسے واسط بھیج دیا گیا جہاں وہ نو ماہ نظربند رہا {cite:tarikh-khulafa-minhaj-1434 p. 555-556}۔ اس نے احمد بن طولون کو اپنے ساتھ رکھنا چاہا، جس نے اس کی خوب خدمت کی؛ متوکل کے غلاموں نے لکھ بھجوایا کہ اگر وہ سابق خلیفہ کو قتل کر دے تو واسط اسے دے دی جائے گی، مگر اس نے انکار کر دیا — «اللہ کی قسم، میں کبھی اپنے بیعت کیے خلیفہ کا قاتل نہیں کہلاؤں گا» — اور جب مستعین قتل ہوا تو اس نے لاش کو غسل دیا، کفنایا اور دفنایا {cite:muntazam-ibn-al-jawzi j.5 p. 76} {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}۔"
  es: "Cuando al-Musta'in se autodepuso al comienzo de 252/866, fue enviado a Wasit y retenido durante nueve meses {cite:tarikh-khulafa-minhaj-1434 p. 555-556}. Al preguntársele a quién quería en su compañía, escogió a Ahmad ibn Tulun, quien le sirvió bien; el ghilman de al-Mutawakkil le escribió ofreciéndole la propia Wasit si mataba al ex califa, y él se negó: «¡Por Dios, jamás permitiré que se diga de mí que maté a un califa al que había jurado lealtad!». Y cuando al-Musta'in fue asesinado, lavó, amortajó y enterró el cuerpo {cite:muntazam-ibn-al-jawzi j.5 p. 76} {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}."
  fr: "Lorsque al-Musta'in déposa le pouvoir au début de l'année 252/866, il fut envoyé à Wasit et détenu pendant neuf mois. Interrogé sur la personne qu'il souhaitait avoir à ses côtés, il choisit Ahmad ibn Tulun, qui le servit fidèlement. Le ghilman d'al-Mutawakkil lui offrit Wasit même s'il acceptait de tuer l'ex-calife, ce qu'il refusa: « Par Dieu, jamais on ne dira de moi que j'ai tué un calife auquel j'avais prêté allégeance. » Après l'assassinat d'al-Musta'in, il lava, enveloppa et enterra le corps."
  tr: "El-Musta'in, Hicri 252 yılının ilk yılında tahttan feragat ettiğinde, Vasit'e götürüldü ve dokuz ay hapsedildi. Yanında Ahmed ibn Tulun'u bulundurmayı tercih etti ve ona iyi davrandı. El-Mutavakkil'in hizmetkarları ona, \"Onu öldür, eğer öldürürsen seni Vasit valisi olarak atayacağız\" diye yazdılar. O ise bunu reddetti ve \"Allah'a yemin ederim ki, biat ettiğim bir halifeyi asla öldürmem\" dedi. Öldürüldüğünde cesedini yıkadı, kefenledi ve gömdü."
  id: "Ketika al-Musta'in turun takhta pada tahun pertama 252 H, ia dibawa ke Wasit dan dipenjara selama sembilan bulan. Ia memilih untuk ditemani oleh Ahmad ibn Tulun, dan ia memperlakukannya dengan baik. Para pelayan al-Mutawakkil menulis surat kepadanya, \"Bunuh dia, dan jika kau membunuhnya, kami akan mengangkatmu sebagai gubernur Wasit.\" Ia menolak dan berkata, \"Demi Allah, aku tidak akan pernah membunuh seorang khalifah yang kepadanya aku telah berjanji setia.\" Ketika ia terbunuh, ia memandikan jenazahnya, mengkafaninya, dan menguburkannya."
