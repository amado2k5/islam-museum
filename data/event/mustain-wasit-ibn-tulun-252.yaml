id: event/mustain-wasit-ibn-tulun-252
class: event
kind: other
label:
  ar: "إنزال المستعين إلى واسط في صحبة أحمد بن طولون، ٢٥٢هـ/٨٦٦م"
  en: "Al-Musta'in sent down to Wasit under Ahmad ibn Tulun's guard, 252/866"
  ur: "مستعین کو احمد بن طولون کی نگہبانی میں واسط بھیجنا، 252ھ/866ء"
summary:
  ar: "لما خلع المستعين نفسه في أول سنة اثنتين وخمسين ومائتين أُحدر إلى واسط محبوساً تسعة أشهر {cite:tarikh-khulafa-minhaj-1434 p. 555-556}، واختار أن يكون أحمد بن طولون في صحبته فأحسن صحبته؛ وكتب إليه غلمان المتوكل أن اقتله فإن قتلته ولّيناك واسطاً فأبى وقال والله لا أرى لله قتلت خليفة بايعته أبداً، فلما قُتل غسل جثته وكفّنها وواراها {cite:muntazam-ibn-al-jawzi j.5 p. 76} {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}."
  en: "When al-Musta'in deposed himself at the opening of 252/866 he was sent down to Wasit and held for nine months {cite:tarikh-khulafa-minhaj-1434 p. 555-556}. Asked whom he wanted in his company he chose Ahmad ibn Tulun, who served him well; al-Mutawakkil's ghilman wrote offering him Wasit itself if he would kill the ex-caliph, and he refused — 'by God, I will never let it be said of me that I killed a caliph I had sworn allegiance to' — and when al-Musta'in was murdered he washed, shrouded and buried the body {cite:muntazam-ibn-al-jawzi j.5 p. 76} {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}."
  ur: "جب مستعین نے 252ھ/866ء کے آغاز میں خود خلعت سے دستبردار ہوا تو اسے واسط بھیج دیا گیا جہاں وہ نو ماہ نظربند رہا {cite:tarikh-khulafa-minhaj-1434 p. 555-556}۔ اس نے احمد بن طولون کو اپنے ساتھ رکھنا چاہا، جس نے اس کی خوب خدمت کی؛ متوکل کے غلاموں نے لکھ بھجوایا کہ اگر وہ سابق خلیفہ کو قتل کر دے تو واسط اسے دے دی جائے گی، مگر اس نے انکار کر دیا — «اللہ کی قسم، میں کبھی اپنے بیعت کیے خلیفہ کا قاتل نہیں کہلاؤں گا» — اور جب مستعین قتل ہوا تو اس نے لاش کو غسل دیا، کفنایا اور دفنایا {cite:muntazam-ibn-al-jawzi j.5 p. 76} {cite:encyclopaedia-of-islam-2 vol. 1 p. 300}۔"
