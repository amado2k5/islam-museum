label:
  ar: "المقدسي يعزم على تصنيف أحسن التقاسيم بشيراز سنة ٣٧٥هـ"
  en: "al-Muqaddasi resolves to compose Ahsan al-Taqasim at Shiraz, 375/985"
  ur: "شیراز میں مقدسی کا احسن التقاسیم لکھنے کا ارادہ، 375ھ/985ء"
  es: "al-Muqaddasi decide componer Ahsan al-Taqasim en Shiraz, 375/985"
  fr: "al-Muqaddasi décide de composer Ahsan al-Taqasim à Chiraz, 375/985"
  tr: "El-Makdisi, Hicri 375 yılında Şiraz'daki en iyi bölümleri derlemeyi amaçlamıştı."
  id: "Al-Maqdisi bermaksud untuk menyusun divisi-divisi terbaik di Shiraz pada tahun 375 Hijriah."
summary:
  ar: "اتخذ المقدسي بشيراز سنة ٣٧٥هـ/٩٨٥م قرار تصنيف أحسن التقاسيم، وقد جاز الأربعين — بكم؟ — من عمره على قوله {cite:encyclopaedia-of-islam-2 vol. 7 p. 544}."
  en: "At Shiraz in 375/985 al-Muqaddasi took the decision to compose Ahsan al-Taqasim, at a time when, by his own account, he had passed — by how much? — the age of forty {cite:encyclopaedia-of-islam-2 vol. 7 p. 544}."
  ur: "شیراز میں 375ھ/985ء میں مقدسی نے احسن التقاسیم لکھنے کا فیصلہ کیا، اس وقت جب ان کی اپنی روایت کے مطابق وہ چالیس برس سے کتنے ہی زیادہ عمر کے ہو چکے تھے {cite:encyclopaedia-of-islam-2 vol. 7 p. 544}۔"
  es: "En Shiraz, en 375/985, al-Muqaddasi tomó la decisión de componer Ahsan al-Taqasim, en un momento en que, según su propio relato, había superado —¿por cuánto tiempo?— la edad de cuarenta años {cite:encyclopaedia-of-islam-2 vol. 7 p. 544}."
  fr: "À Shiraz en 375/985, al-Muqaddasi prit la décision de composer Ahsan al-Taqasim, à un moment où, selon ses propres dires, il avait dépassé — de combien ? — l'âge de quarante ans {cite:encyclopaedia-of-islam-2 vol. 7 p. 544}."
  tr: "Al-Maqdisi, kendi ifadesine göre kırk yaşını geçmişken, Hicri 375/Miladi 985 yılında Şiraz'daki en iyi bölgeleri sınıflandırma kararı almıştır. {cite:encyclopaedia-of-islam-2 vol. 7 p. 544}"
  id: "Al-Maqdisi mengambil keputusan untuk mengklasifikasikan divisi-divisi terbaik di Shiraz pada tahun 375 H/985 M, dan beliau telah berusia empat puluh tahun, menurut pernyataannya {cite:encyclopaedia-of-islam-2 vol. 7 p. 544}."
