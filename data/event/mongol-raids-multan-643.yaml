label: { ar: "الغارات المغولية على نواحي الملتان", en: "The Mongol raids on the Multan marches", es: "Las incursiones mongolas en las marcas de Multán", fr: "Les raids mongols sur les marches de Multan", ur: "ملتان مارچ پر منگول حملہ آور", tr: "Moğolların Multan bölgesine düzenlediği baskınlar", id: "Serangan Mongol di wilayah Multan" }
summary:
  ar: "بينما نجت قلب الهند من موجة الغزو المغولي في القرن السابع الهجري ⁦(الثالث عشر الميلادي)⁩، تكبدت أطرافها الغربية منها مراراً: هوجمت نواحي الملتان سنة ٦٤٣هـ/١٢٤٥م ثم ثانية سنة ٦٨٣هـ/١٢٨٤-١٢٨٥م {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}. وفي سنة ٧٠٥هـ/١٣٠٥م دخل المغول تحت قيبق الهند وعبروا السند قرب الملتان، فهزمهم تغلق — غازي ملك — في مسيرة عودتهم؛ وتذكر نقشية رآها ابن بطوطة في جامع الملتان أن تغلق قاتل المغول تسعاً وعشرين مرة {cite:encyclopaedia-of-islam-2 vol. 4 p. 959-960}."
  en: "While the Indian heartland escaped the 7th/13th-century wave of Mongol invasions, its western fringes suffered repeatedly: the Multan area was attacked in 643/1245 and again in 683/1284-5 {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}. In 705/1305 the Mongols under Kabak entered India and crossed the Indus near Multan, but Tughluq — Ghazi Malik — defeated them on their return march; an inscription Ibn Battuta saw in Multan's congregational mosque records that Tughluq fought the Mongols twenty-nine times {cite:encyclopaedia-of-islam-2 vol. 4 p. 959-960}."
  ur: "جبکہ ہندوستان کا قلب ساتویں صدی ہجری کی مغول یلغار سے بچ نکلا، اس کے مغربی کنارے بار بار متاثر ہوئے: ملتان کا علاقہ 643ھ/1245ء اور پھر 683ھ/1284-85ء میں ہدف بنا {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}۔ 705ھ/1305ء میں قِبَک کی قیادت میں مغول ہندوستان میں داخلے اور ملتان کے قریب دریائے سندھ عبور کیا، مگر واپسی پر تغلق — غازی ملک — نے انہیں شکست دی؛ ملتان کی جامع مسجد میں ابن بطوطہ نے ایک کتبہ دیکھا جس میں لکھا ہے کہ تغلق نے مغلوں سے انتس مرتبہ جنگ کی {cite:encyclopaedia-of-islam-2 vol. 4 p. 959-960}۔"
  es: "Si bien el corazón de la India escapó a la ola de invasiones mongolas de los siglos VII y XIII, sus fronteras occidentales sufrieron repetidamente: la zona de Multan fue atacada en 643/1245 y de nuevo en 683/1284-5 {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}. En 705/1305, los mongoles bajo el mando de Kabak entraron en la India y cruzaron el Indo cerca de Multan, pero Tughluq — Ghazi Malik — los derrotó en su marcha de regreso; una inscripción que Ibn Battuta vio en los registros de la mezquita congregacional de Multan indica que Tughluq luchó contra los mongoles veintinueve veces {cite:encyclopaedia-of-islam-2 vol. 4 p. 959-960}."
  fr: "Alors que le cœur de l'Inde échappa à la vague d'invasions mongoles des VIIe et XIIIe siècles, ses franges occidentales subirent des attaques répétées: la région de Multan fut attaquée en 643/1245 et de nouveau en 683/1284-1285 (voir: Encyclopaedia of Islam, vol. 7, p. 603). En 705/1305, les Mongols, sous le commandement de Kabak, pénétrèrent en Inde et franchirent l'Indus près de Multan, mais Tughluq (Ghazi Malik) les vainquit sur le chemin du retour; une inscription qu'Ibn Battuta consulta dans les archives de la mosquée de Multan atteste que Tughluq combattit les Mongols à vingt-neuf reprises (voir: Encyclopaedia of Islam, vol. 4, p. 959-960)."
  tr: "Hicri 7. yüzyılda (miladi 13. yüzyıl) Hindistan'ın kalbi Moğol istila dalgasından kurtulmuş olsa da, batı sınırları defalarca zarar gördü: Multan bölgesi Hicri 643/1245 yılında ve tekrar Hicri 683/1284-1285 yıllarında saldırıya uğradı {kaynak:encyclopaedia-of-islam-2 cilt 7 s. 603}. Hicri 705/1305 yılında Moğollar Hindistan'ın kalbine girdiler ve Multan yakınlarında Sind'i geçtiler, ancak Tughluq Gazi Malik dönüş yolunda onları yenilgiye uğrattı. İbn Battuta'nın Multan camisinde gördüğü bir yazıtta Tughluq'un Moğollarla yirmi dokuz kez savaştığı belirtiliyor {kaynak:encyclopaedia-of-islam-2 cilt 4 s. 959-960}."
  id: "Meskipun jantung India terhindar dari gelombang invasi Mongol pada abad ke-7 Hijriah (abad ke-13 M), perbatasan baratnya berulang kali menderita: wilayah Multan diserang pada tahun 643 Hijriah/1245 M dan lagi pada tahun 683 Hijriah/1284-1285 M {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}. Pada tahun 705 Hijriah/1305 M, bangsa Mongol memasuki jantung India dan menyeberangi Sindh dekat Multan, tetapi Tughluq Ghazi Malik mengalahkan mereka dalam perjalanan kembali. Sebuah prasasti yang dilihat oleh Ibn Battuta di masjid Multan menyebutkan bahwa Tughluq berperang melawan bangsa Mongol sebanyak dua puluh sembilan kali {cite:encyclopaedia-of-islam-2 vol. 4 pp. 959-960}."
