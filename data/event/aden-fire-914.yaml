summary:
  ar: "في شذرات الذهب سنة أربع عشرة وتسع مئة كان حريق عظيم بمدينة عدن احترق به من الآدميين نحو ثلاثين نفساً وتلف من الأموال والبيوت ما لا يحصى {cite:shadharat-dhahab p. 478}."
  en: "914: a great fire in the city of Aden — about thirty souls burned, and untold wealth and houses destroyed {cite:shadharat-dhahab p. 478}."
  fr: "En 914, un grand incendie dans la ville d’Aden causa la mort d’environ trente personnes et détruisit d’innombrables biens et maisons {cite:shadharat-dhahab p. 478}."
  es: "914: un gran incendio en la ciudad de Adén — unas treinta personas murieron quemadas, y riquezas y casas incalculables fueron destruidas {cita:shadharat-dhahab p. 478}."
  ur: "914: عدن شہر میں ایک زبردست آگ - تقریباً تیس جانیں جل گئیں، اور بے شمار دولت اور مکانات تباہ ہو گئے۔ 478}۔"
  tr: "Hicri 914 yılında Şadharat el-Dhahab'da Aden şehrinde büyük bir yangın çıktı ve bu yangında yaklaşık otuz insan yandı, sayısız miktarda para ve ev yok oldu. {kaynak:şadharat-dhahab s. 478}"
  id: "Dalam Shadharat al-Dhahab, pada tahun 914 H, terjadi kebakaran besar di kota Aden yang mengakibatkan sekitar tiga puluh orang tewas terbakar dan sejumlah besar uang serta rumah hancur {cite:shadharat-dhahab p. 478}."
