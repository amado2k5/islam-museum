label: { ar: "كارثة واقصة وقطع خفاجة على الحاج", en: "The Waqisa Disaster and the Khafaja Interception of the Pilgrims" }
summary:
  ar: "في صفر سنة ثلاث وأربعمائة سبق أبو فليتة ابن القوي في ستمائة رجل من بني خفاجة الحاج إلى واقصة فنزح الماء في مصانع البرمكي والريان وغوّرها وطرح في الآبار الحنظل، فلما ورد الحاج العقبة اعتقلهم ومنعهم الاجتياز وطلب خمسين ألف دينار، فلما بلغ منهم العطش هجم عليهم فاحتوى على الأحمال والأموال وهلك من الناس نحو خمسة عشر ألف إنسان، وأفلت أميرهم أبو الحارث العلوي راجلاً. فكاتب فخر الملك علي بن مزيد الأسدي فأوقع بخفاجة في البرية قرب البصرة وقتل منهم وأسر أبا فليتة وأربعة عشر رجلاً واسترجع ما أمكن {cite:muntazam-ibn-al-jawzi j.7 p.260-261}."
  en: "In Safar of the year 403 Abu Fulayta ibn al-Qawi of the Banu Khafaja forestalled the pilgrims at Waqisa with six hundred men. They drained the water in the reservoirs of al-Barmaki and al-Rayyan, silted them up, and threw colocynth into the wells. When the pilgrims reached the Aqaba he held them back, barred their passage and demanded fifty thousand dinars. When thirst reached them he attacked, seized their loads and money, and about fifteen thousand people perished; the amir of the pilgrims, Abu al-Harith al-Alawi, escaped on foot. He then wrote to Fakhr al-Mulk Ali ibn Mazyad al-Asadi, who fell on the Khafaja in the desert near Basra, killed some of them, captured Abu Fulayta and fourteen men, and recovered what he could. {cite:muntazam-ibn-al-jawzi j.7 p.260-261}"
