id: event/waqisa-hajj-disaster-403
class: event
kind: raid
label: { ar: "كارثة واقصة وقطع خفاجة على الحاج", en: "The Waqisa Disaster and the Khafaja Interception of the Pilgrims", es: "El desastre de Waqisa y la interceptación de los peregrinos por parte de Khafaja", fr: "Le désastre de Waqisa et l'interception des pèlerins par Khafaja", ur: "وقیصہ آفت اور حجاج کی خفاظت", tr: "Bir felaket, kısa bir öykü ve bir hacının eşyalarının çalınması.", id: "Sebuah bencana, sebuah cerita pendek, dan terputusnya akses terhadap barang-barang milik seorang peziarah." }
summary:
  ar: "في صفر سنة ثلاث وأربعمائة سبق أبو فليتة ابن القوي في ستمائة رجل من بني خفاجة الحاج إلى واقصة فنزح الماء في مصانع البرمكي والريان وغوّرها وطرح في الآبار الحنظل، فلما ورد الحاج العقبة اعتقلهم ومنعهم الاجتياز وطلب خمسين ألف دينار، فلما بلغ منهم العطش هجم عليهم فاحتوى على الأحمال والأموال وهلك من الناس نحو خمسة عشر ألف إنسان، وأفلت أميرهم أبو الحارث العلوي راجلاً. فكاتب فخر الملك علي بن مزيد الأسدي فأوقع بخفاجة في البرية قرب البصرة وقتل منهم وأسر أبا فليتة وأربعة عشر رجلاً واسترجع ما أمكن {cite:muntazam-ibn-al-jawzi j.7 p.260-261}."
  en: "In Safar of the year 403 Abu Fulayta ibn al-Qawi of the Banu Khafaja forestalled the pilgrims at Waqisa with six hundred men. They drained the water in the reservoirs of al-Barmaki and al-Rayyan, silted them up, and threw colocynth into the wells. When the pilgrims reached the Aqaba he held them back, barred their passage and demanded fifty thousand dinars. When thirst reached them he attacked, seized their loads and money, and about fifteen thousand people perished; the amir of the pilgrims, Abu al-Harith al-Alawi, escaped on foot. He then wrote to Fakhr al-Mulk Ali ibn Mazyad al-Asadi, who fell on the Khafaja in the desert near Basra, killed some of them, captured Abu Fulayta and fourteen men, and recovered what he could. {cite:muntazam-ibn-al-jawzi j.7 p.260-261}"
  es: "En Safar del año 403, Abu Fulayta ibn al-Qawi, de los Banu Khafaja, interceptó a los peregrinos en Waqisa con seiscientos hombres. Vaciaron los embalses de al-Barmaki y al-Rayyan, los llenaron de sedimentos y arrojaron coloquíntida a los pozos. Cuando los peregrinos llegaron a Aqaba, los detuvo, les impidió el paso y les exigió cincuenta mil dinares. Cuando la sed los venció, los atacó, les confiscó sus pertenencias y dinero, y perecieron unas quince mil personas; el emir de los peregrinos, Abu al-Harith al-Alawi, escapó a pie. Luego escribió a Fakhr al-Mulk Ali ibn Mazyad al-Asadi, quien atacó a los Khafaja en el desierto cerca de Basora, mató a algunos de ellos, capturó a Abu Fulayta y a catorce hombres, y recuperó lo que pudo. {cite:muntazam-ibn-al-jawzi j.7 p.260-261}"
  fr: "Au mois de Safar de l'an 403, Abou Fulayta ibn al-Qawi, de la tribu des Banu Khafaja, bloqua les pèlerins à Waqisa avec six cents hommes. Ils vidèrent les réservoirs d'al-Barmaki et d'al-Rayyan, les envasèrent et jetèrent de la coloquinte dans les puits. Arrivés à Aqaba, les pèlerins furent retenus, le passage leur fut barré et ils exigèrent cinquante mille dinars. Lorsque la soif les gagna, il les attaqua, s'empara de leurs biens et de leur argent, et environ quinze mille personnes périrent. L'émir des pèlerins, Abou al-Harith al-Alawi, s'enfuit à pied. Il écrivit ensuite à Fakhr al-Mulk Ali ibn Mazyad al-Asadi, qui attaqua les Khafaja dans le désert près de Bassora, en tua plusieurs, captura Abou Fulayta et quatorze hommes, et récupéra ce qu'il put. {cite:muntazam-ibn-al-jawzi j.7 p.260-261}"
  ur: "سنہ 403 صفر میں بنو خفجہ کے ابو فلیطہ بن القوی نے حجاج کو چھ سو آدمیوں کے ساتھ وقیصہ میں روک دیا۔ انہوں نے البرمکی اور الریان کے ذخائر میں پانی نکالا، انہیں گاد بنا دیا، اور کالوسنتھ کو کنوؤں میں پھینک دیا۔ جب حجاج عقبہ پر پہنچے تو اس نے انہیں روک لیا، ان کا راستہ روکا اور پچاس ہزار دینار کا مطالبہ کیا۔ جب ان پر پیاس لگی تو اس نے حملہ کیا، ان کا بوجھ اور مال چھین لیا اور تقریباً پندرہ ہزار لوگ مارے گئے۔ حاجیوں کے امیر ابو الحارث العلوی پیدل فرار ہو گئے۔ اس کے بعد اس نے فخر الملک علی ابن مازیاد الاسدی کو لکھا، جو بصرہ کے قریب صحرا میں خفجہ پر گرا، ان میں سے کچھ کو قتل کر دیا، ابو فلیطہ اور چودہ آدمیوں کو گرفتار کر لیا، اور جو کچھ وہ کر سکتا تھا، واپس لے لیا۔ {حوالہ:منتظم ابن الجوزی ج7 ص 260-261}"
  tr: "Hicri 403 yılının Safer ayında, Beni Haface kabilesinden altı yüz adamıyla birlikte Ebu Fulayta ibn el-Kavi, hacıların önünden Vakısa'ya gitti. Barmaki ve Rayyan su depolarının suyunu boşalttı, onları gömdü ve kuyulara kolokint attı. Hacılar Akabe'ye vardıklarında, onları durdurdu, geçmelerini engelledi ve elli bin dinar istedi. Hacılar susuzluktan bitkin düştüklerinde, onlara saldırdı, bagajlarını ve paralarını ele geçirdi. Yaklaşık on beş bin kişi öldü ve liderleri Ebu el-Harith el-Alavi yaya olarak kaçtı. Daha sonra Fahr el-Mulk Ali ibn Mazid el-Asadi'ye mektup yazdı. Fahr el-Mulk Ali ibn Mazid el-Asadi, Basra yakınlarındaki çölde Haface kabilesine saldırdı, birçoğunu öldürdü ve Ebu Fulayta ile on dört adamını esir alarak kurtarabildiği her şeyi geri aldı."
  id: "Pada bulan Safar tahun 403 H, Abu Fulayta ibn al-Qawi, bersama enam ratus orang dari Bani Khafajah, mendahului para peziarah ke Waqisa. Ia mengeringkan air dari waduk Barmaki dan Rayyan, menguburnya, dan melemparkan batu kolokint ke dalam sumur. Ketika para peziarah sampai di Aqaba, ia menahan mereka, mencegah mereka menyeberang, dan menuntut lima puluh ribu dinar. Ketika para peziarah kehausan, ia menyerang mereka, merampas barang bawaan dan uang mereka. Sekitar lima belas ribu orang tewas, dan pemimpin mereka, Abu al-Harith al-Alawi, melarikan diri dengan berjalan kaki. Kemudian ia menulis surat kepada Fakhr al-Mulk Ali ibn Mazid al-Asadi, yang menyerang Khafajah di padang pasir dekat Basra, membunuh banyak dari mereka dan menangkap Abu Fulayta dan empat belas orang, serta mengambil kembali apa yang bisa ia selamatkan."
