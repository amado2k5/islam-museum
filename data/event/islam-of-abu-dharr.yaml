summary:
  ar: "قدم أبو ذر مكة يسأل عن النبي فلم يسأل أحداً خشية الرقابة، فأضافه علي ثلاث ليال دون أن يسأله، ثم دله على النبي فسمع قوله فأسلم، وأعلن شهادته في المسجد فضربه القوم حتى أنقذه العباس؛ ويرى الكتاب في ذلك دروساً في التأني والاحتياط والتغطية الأمنية للتحرك."
  en: "Abu Dharr came to Mecca looking for the Prophet and asked no one, out of caution. Ali hosted him for three nights without asking his business, then guided him to the Prophet, heard him, and accepted Islam. Abu Dharr declared his faith aloud in the mosque, was beaten, and was rescued by al-Abbas."
