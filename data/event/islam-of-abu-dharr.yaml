id: event/islam-of-abu-dharr
class: event
kind: other
label: { ar: "إسلام أبي ذر الغفاري في مكة على يد علي", en: "Abu Dharr al-Ghifari accepts Islam in Mecca through Ali", es: "Abu Dharr al-Ghifari acepta el Islam en La Meca a través de Ali", fr: "Abu Dharr al-Ghifari accepte l'Islam à La Mecque par l'intermédiaire d'Ali", ur: "ابوذر غفاری نے مکہ میں علی کے ذریعے اسلام قبول کیا۔", tr: "Ebu Zer el-Gifari Mekke'de Ali'nin eliyle Müslüman oldu", id: "Abu Dharr al-Ghifari masuk Islam di Mekkah di tangan Ali" }
summary:
  ar: "قدم أبو ذر مكة يسأل عن النبي فلم يسأل أحداً خشية الرقابة، فأضافه علي ثلاث ليال دون أن يسأله، ثم دله على النبي فسمع قوله فأسلم، وأعلن شهادته في المسجد فضربه القوم حتى أنقذه العباس؛ ويرى الكتاب في ذلك دروساً في التأني والاحتياط والتغطية الأمنية للتحرك."
  en: "Abu Dharr came to Mecca looking for the Prophet and asked no one, out of caution. Ali hosted him for three nights without asking his business, then guided him to the Prophet, heard him, and accepted Islam. Abu Dharr declared his faith aloud in the mosque, was beaten, and was rescued by al-Abbas."
  es: "Abu Dharr llegó a La Meca buscando al Profeta y, por precaución, no preguntó a nadie. Ali lo hospedó durante tres noches sin preguntarle a qué venía, luego lo condujo hasta el Profeta, lo escuchó y se convirtió al Islam. Abu Dharr proclamó su fe en voz alta en la mezquita, fue golpeado y fue rescatado por al-Abbas."
  fr: "Abou Dharr vint à La Mecque à la recherche du Prophète et, par prudence, ne demanda rien à personne. Ali l'accueillit trois nuits sans s'enquérir de la raison de son voyage, puis le conduisit auprès du Prophète, l'écouta et se convertit à l'islam. Abou Dharr proclama sa foi à haute voix dans la mosquée, fut battu, puis secouru par al-Abbas."
  ur: "ابوذر رسول اللہ کو ڈھونڈتے ہوئے مکہ آئے اور کسی نے احتیاط نہ کی۔ علی نے ان کا کاروبار پوچھے بغیر تین راتوں تک ان کی میزبانی کی، پھر اس کی رہنمائی نبی کی طرف کی، ان کی بات سنی اور اسلام قبول کیا۔ ابوذر نے مسجد میں بلند آواز سے اپنے ایمان کا اعلان کیا، انہیں مارا پیٹا گیا، اور انہیں عباس نے بچایا۔"
  tr: "Ebu Zer, Peygamber hakkında bilgi almak için Mekke'ye geldi, ancak gözetlenmekten korktuğu için kimseye sormadı. Ali onu üç gece misafir etti ve hiçbir şey sormadı, sonra onu Peygamber'e yönlendirdi. Ebu Zer onun sözlerini dinledi ve İslam'ı kabul etti. Mescitte imanını ilan etti ve insanlar onu dövdüler, ta ki Abbas onu kurtarana kadar. Kitap, bu olayda sabır, ihtiyat ve hareket halindeyken güvenlik önlemlerinin önemini vurguluyor."
  id: "Abu Dharr datang ke Mekah untuk menanyakan tentang Nabi, tetapi dia tidak bertanya kepada siapa pun karena takut diawasi. Ali menjamunya selama tiga malam tanpa menanyakan apa pun, kemudian dia mengarahkannya kepada Nabi, dan dia mendengar kata-kata beliau dan memeluk Islam. Dia menyatakan keimanannya di masjid, dan orang-orang memukulinya sampai Al-Abbas menyelamatkannya. Kitab ini melihat dalam hal ini pelajaran tentang kesabaran, kehati-hatian, dan pengamanan untuk pergerakan."
