label: { ar: "وقعة نهاوند", en: "Battle of Nahavand" }
summary:
  ar: "اجتمعت الأعاجم بنهاوند وعليهم ذو الحاجب، فكتب عمر إلى النعمان بن مقرن يأمره بالمسير إليها بعد أن رغب في الجهاد {cite:tabari-tarikh-abu-al-fadl j.4 p.114}. وذكر ابن إسحاق والواقدي وأبو معشر أنها كانت سنة إحدى وعشرين، وقال سيف إنها كانت سنة ثماني عشرة {cite:tabari-tarikh-abu-al-fadl j.4 p.114}. وفي رواية المسعودي قطع المغيرة بن شعبة إلى ملكهم ذي الجناحين فأقعده في بهجة الملك فوثب فقعد معه على سريره، وتسلل المسلمون إلى النهر كل خمسة وستة، وهز النعمان بن مقرن لواءه ثلاثاً أولها لقضاء الحاجة وثانيها لشد الشسع ولزوم السلاح وثالثها للحمل وقال إني داعٍ الله بدعوة اللهم ارزق النعمان اليوم شهادة في نصر وفتح عليهم فأمّن القوم وكان أول صريع، فوجده معقل بن يسار وبه رمق فسأل ما فعل الله بالناس فقيل فتح الله عليهم فقال الحمد لله اكتبوا بذلك إلى عمر وفاضت نفسه، وأخرج من سفطه كتاب الخلفاء بعده، وقبور قتلاهم إلى زمن المسعودي بينة على نحو فرسخ من نهاوند فيما بينها وبين الدينور {cite:muruj-al-dhahab p. 618-619}"
  en: "The Persians (a'ajim) gathered at Nahavand under Dhu al-Hajib, and Umar wrote to al-Nu'man ibn Muqarrin ordering him to march there, after he had shown eagerness for jihad {cite:tabari-tarikh-abu-al-fadl j.4 p.114}. Ibn Ishaq, al-Waqidi and Abu Ma'shar said it was in 21 AH, while Sayf said it was in 18 AH {cite:tabari-tarikh-abu-al-fadl j.4 p.114}. In al-Mas'udi's account, al-Mughira ibn Shu'ba crossed to their king, Dhu al-Janahayn, and seated him in the splendour of kingship; the king sprang up and sat with him on his throne. The Muslims slipped toward the river in groups of five and six. Al-Nu'man ibn Muqarrin raised his banner three times: the first to signal relieving oneself, the second to tighten sandals and secure weapons, and the third to charge. He said, 'O God, grant al-Nu'man martyrdom today, with victory and conquest for them'; the people said amen, and he was the first to fall. Ma'qil ibn Yasar found him still breathing and asked what God had done with the people. He was told that God had granted them victory, and said, 'Praise be to God; write about that to Umar', and his soul departed. He had brought out of his casket a writing concerning the caliphs after him. The graves of their dead were still visible in al-Mas'udi's time, about a farsakh from Nahavand, between it and al-Dinawar {cite:muruj-al-dhahab p. 618-619}."
