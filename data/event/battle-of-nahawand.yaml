summary:
  ar: "اجتمعت الأعاجم بنهاوند وعليهم ذو الحاجب، فكتب عمر إلى النعمان بن مقرن يأمره بالمسير إليها بعد أن رغب في الجهاد {cite:tabari-tarikh-abu-al-fadl j.4 p.114}. وذكر ابن إسحاق والواقدي وأبو معشر أنها كانت سنة إحدى وعشرين، وقال سيف إنها كانت سنة ثماني عشرة {cite:tabari-tarikh-abu-al-fadl j.4 p.114}."
