id: event/battle-of-nahawand
class: event
kind: battle
label: { ar: "وقعة نهاوند" }
summary:
  ar: "اجتمعت الأعاجم بنهاوند وعليهم ذو الحاجب، فكتب عمر إلى النعمان بن مقرن يأمره بالمسير إليها بعد أن رغب في الجهاد {cite:tabari-tarikh-abu-al-fadl j.4 p.114}. وذكر ابن إسحاق والواقدي وأبو معشر أنها كانت سنة إحدى وعشرين، وقال سيف إنها كانت سنة ثماني عشرة {cite:tabari-tarikh-abu-al-fadl j.4 p.114}.، وفي رواية المسعودي قطع المغيرة بن شعبة إلى ملكهم ذي الجناحين فأقعده في بهجة الملك فوثب فقعد معه على سريره، وتسلل المسلمون إلى النهر كل خمسة وستة، وهز النعمان بن مقرن لواءه ثلاثاً أولها لقضاء الحاجة وثانيها لشد الشسع ولزوم السلاح وثالثها للحمل وقال إني داعٍ الله بدعوة اللهم ارزق النعمان اليوم شهادة في نصر وفتح عليهم فأمّن القوم وكان أول صريع، فوجده معقل بن يسار وبه رمق فسأل ما فعل الله بالناس فقيل فتح الله عليهم فقال الحمد لله اكتبوا بذلك إلى عمر وفاضت نفسه، وأخرج من سفطه كتاب الخلفاء بعده، وقبور قتلاهم إلى زمن المسعودي بينة على نحو فرسخ من نهاوند فيما بينها وبين الدينور {cite:muruj-al-dhahab p. 618-619}"
