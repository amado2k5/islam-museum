label: { ar: "وقعة نهاوند", en: "Battle of Nahavand", fr: "La bataille de Nahavand", es: "Batalla de Nahavand", ur: "نہاوند کی جنگ", tr: "Nahavand Muharebesi", id: "Pertempuran Nahavand" }
summary:
  ar: "اجتمعت الأعاجم بنهاوند وعليهم ذو الحاجب، فكتب عمر إلى النعمان بن مقرن يأمره بالمسير إليها بعد أن رغب في الجهاد {cite:tabari-tarikh-abu-al-fadl j.4 p.114}. وذكر ابن إسحاق والواقدي وأبو معشر أنها كانت سنة إحدى وعشرين، وقال سيف إنها كانت سنة ثماني عشرة {cite:tabari-tarikh-abu-al-fadl j.4 p.114}. وفي رواية المسعودي قطع المغيرة بن شعبة إلى ملكهم ذي الجناحين فأقعده في بهجة الملك فوثب فقعد معه على سريره، وتسلل المسلمون إلى النهر كل خمسة وستة، وهز النعمان بن مقرن لواءه ثلاثاً أولها لقضاء الحاجة وثانيها لشد الشسع ولزوم السلاح وثالثها للحمل وقال إني داعٍ الله بدعوة اللهم ارزق النعمان اليوم شهادة في نصر وفتح عليهم فأمّن القوم وكان أول صريع، فوجده معقل بن يسار وبه رمق فسأل ما فعل الله بالناس فقيل فتح الله عليهم فقال الحمد لله اكتبوا بذلك إلى عمر وفاضت نفسه، وأخرج من سفطه كتاب الخلفاء بعده، وقبور قتلاهم إلى زمن المسعودي بينة على نحو فرسخ من نهاوند فيما بينها وبين الدينور {cite:muruj-al-dhahab p. 618-619}"
  en: "The Persians (a'ajim) gathered at Nahavand under Dhu al-Hajib, and Umar wrote to al-Nu'man ibn Muqarrin ordering him to march there, after he had shown eagerness for jihad {cite:tabari-tarikh-abu-al-fadl j.4 p.114}. Ibn Ishaq, al-Waqidi and Abu Ma'shar said it was in 21 AH, while Sayf said it was in 18 AH {cite:tabari-tarikh-abu-al-fadl j.4 p.114}. In al-Mas'udi's account, al-Mughira ibn Shu'ba crossed to their king, Dhu al-Janahayn, and seated him in the splendour of kingship; the king sprang up and sat with him on his throne. The Muslims slipped toward the river in groups of five and six. Al-Nu'man ibn Muqarrin raised his banner three times: the first to signal relieving oneself, the second to tighten sandals and secure weapons, and the third to charge. He said, 'O God, grant al-Nu'man martyrdom today, with victory and conquest for them'; the people said amen, and he was the first to fall. Ma'qil ibn Yasar found him still breathing and asked what God had done with the people. He was told that God had granted them victory, and said, 'Praise be to God; write about that to Umar', and his soul departed. He had brought out of his casket a writing concerning the caliphs after him. The graves of their dead were still visible in al-Mas'udi's time, about a farsakh from Nahavand, between it and al-Dinawar {cite:muruj-al-dhahab p. 618-619}."
  fr: "Les Persans (a'ajim) se rassemblèrent à Nahavand sous Dhu al-Hajib, et Umar écrivit à al-Nu'man ibn Muqarrin pour lui ordonner d'y marcher, après qu'il eut montré son ardeur pour le djihad {cite:tabari-tarikh-abu-al-fadl j.4 p.114}. Ibn Ishaq, al-Waqidi et Abu Ma'shar dirent que ce fut en 21 H, tandis que Sayf dit que ce fut en 18 H {cite:tabari-tarikh-abu-al-fadl j.4 p.114}. Dans le récit d'al-Mas'udi, al-Mughira ibn Shu'ba se rendit auprès de leur roi, Dhu al-Janahayn, qui le fit asseoir dans la splendeur de la royauté ; le roi bondit et s'assit avec lui sur son trône. Les musulmans se glissèrent vers le fleuve par groupes de cinq et six. Al-Nu'man ibn Muqarrin leva sa bannière trois fois : la première pour signaler de se soulager, la deuxième pour serrer les sandales et assurer les armes, et la troisième pour charger. Il dit : « Ô Dieu, accorde aujourd'hui le martyre à al-Nu'man, avec victoire et conquête pour eux » ; les gens dirent amen, et il fut le premier à tomber. Ma'qil ibn Yasar le trouva encore respirant et lui demanda ce que Dieu avait fait des gens. On lui dit que Dieu leur avait accordé la victoire, et il dit : « Louange à Dieu ; écrivez-le à Umar », et son âme s'en alla. Il avait sorti de son coffret un écrit concernant les califes après lui. Les tombes de leurs morts étaient encore visibles du temps d'al-Mas'udi, à environ une parasange de Nahavand, entre elle et al-Dinawar {cite:muruj-al-dhahab p. 618-619}."
  es: "Los persas (a'ajim) se reunieron en Nahavand bajo el mando de Dhu al-Hajib, y Umar escribió a al-Nu'man ibn Muqarrin ordenándole marchar allí, después de que este mostrara entusiasmo por la yihad {cite:tabari-tarikh-abu-al-fadl j.4 p.114}. Ibn Ishaq, al-Waqidi y Abu Ma'shar dijeron que fue en el año 21 AH, mientras que Sayf dijo que fue en el año 18 AH {cite:tabari-tarikh-abu-al-fadl j.4 p.114}. En el relato de al-Mas'udi, al-Mughira ibn Shu'ba cruzó hacia su rey, Dhu al-Janahayn, y lo sentó en el esplendor de la realeza; el rey saltó y se sentó con él en su trono. Los musulmanes se deslizaron hacia el río en grupos de cinco y seis. Al-Nu'man ibn Muqarrin alzó su estandarte tres veces: la primera para indicar que necesitaba ir al baño, la segunda para ajustarse las sandalias y asegurar las armas, y la tercera para cargar. Dijo: «¡Oh Dios, concede hoy a al-Nu'man el martirio, con la victoria y la conquista para ellos!». El pueblo dijo amén, y él fue el primero en caer. Ma'qil ibn Yasar lo encontró aún con vida y preguntó qué había hecho Dios con el pueblo. Le dijeron que Dios les había concedido la victoria, y dijo: «¡Alabado sea Dios! Escríbele esto a Umar», y su alma partió. Había sacado de su ataúd un escrito sobre los califas que le sucedieron. Las tumbas de sus muertos aún eran visibles en tiempos de al-Mas'udi, a un farsakh de Nahavand, entre este y al-Dinawar {cite:muruj-al-dhahab p. 618-619}."
  ur: "فارسی ⁦(عجم)⁩ ذوالحجیب کے تحت نہاوند میں جمع ہوئے، اور عمر نے نعمان بن مقرن کو خط لکھا کہ اس نے جہاد کے لیے بے تابی ظاہر کرنے کے بعد اسے وہاں کوچ کرنے کا حکم دیا۔ ابن اسحاق، الواقدی اور ابو معشر نے کہا ہے کہ یہ 21 ہجری میں ہے جبکہ سیف نے کہا ہے کہ یہ 18 ہجری میں ہے المسعودی کے بیان میں، المغیرہ بن شعبہ ان کے بادشاہ ذوالجناحین کے پاس گیا، اور اسے بادشاہی کی شان میں بٹھایا؛ بادشاہ اٹھ کھڑا ہوا اور اس کے ساتھ اپنے تخت پر بیٹھ گیا۔ مسلمان پانچ اور چھ کے گروہ میں دریا کی طرف کھسک گئے۔ النعمان ابن مقرن نے اپنا جھنڈا تین بار بلند کیا: پہلا اپنے آپ کو حاجت کا اشارہ کرنے کے لئے، دوسرا سینڈل اور محفوظ ہتھیاروں کو مضبوط کرنے کے لئے، اور تیسرا چارج کرنے کے لئے۔ اس نے کہا، 'اے اللہ، آج نعمان کو ان کے لیے فتح و نصرت کے ساتھ شہادت عطا فرما'؛ لوگوں نے آمین کہا، اور وہ سب سے پہلے گرنے والا تھا۔ معقل بن یسار نے اسے سانس لیتے ہوئے پایا اور پوچھا کہ خدا نے لوگوں کے ساتھ کیا کیا؟ اسے بتایا گیا کہ خدا نے انہیں فتح عطا کی ہے، اور کہا، 'الحمد للہ؛ اس کے بارے میں عمر کو لکھو تو ان کی روح نکل گئی۔ اس نے اپنے تابوت سے اپنے بعد کے خلفاء کے متعلق ایک تحریر نکالی تھی۔ ان کے مرنے والوں کی قبریں اب بھی المسعودی کے زمانے میں، نہاوند سے تقریباً ایک فرسخ کے فاصلے پر، اس کے اور الدنور کے درمیان نظر آتی تھیں۔ 618-619}۔"
  tr: "Arap olmayanlar, Zülhacib önderliğinde Nahavand'da toplandılar. Ömer, cihat etme arzusunu dile getirdikten sonra Numan ibn Mukrin'e oraya yürümesini emreden bir mektup yazdı. İbn İshak, Vakidi ve Ebu Ma'şar bunun 21. yılda olduğunu belirtirken, Sayf 18. yılda olduğunu söyledi. Mesudi'nin anlatımına göre, Muğira ibn Şuba, kralları Zülce Cenayn'ın yanına gitti ve onu kralın ihtişamına oturttu. Ayağa kalkıp tahtına oturdu. Müslümanlar beşer altışar kişilik gruplar halinde nehre doğru ilerlediler. Numan ibn Mukrin sancağını üç kez salladı: birincisi ihtiyaç gidermek için, ikincisi kayışı sıkılaştırmak ve silahları sabitlemek için, üçüncüsü ise onları taşımak için. \"Allah'a şöyle dua ediyorum: 'Ey Allah'ım, bugün Numan'a onlara karşı zafer ve fetih nasip et.'\" Halk \"Âmin\" dedi ve Numan ilk düşen oldu. Ma'kal ibn Yasar onu hayatta buldu ve Allah'ın insanlara ne yaptığını sordu. \"Allah onlara zafer verdi\" denildi. Ma'kal ibn Yasar, \"Allah'a hamd olsun. Bunu Ömer'e yaz\" dedi ve ruhu bedeninden ayrıldı. Sandığından kendisinden sonraki halifelerin kitabını çıkardı. Mesudi dönemine kadar öldürülenlerin mezarları, Nahavand'dan yaklaşık bir fersah uzaklıkta, Nahavand ile Dinaver arasında açıkça görülebiliyordu. {kaynak: Muruj-al-dhahab s. 618-619}"
  id: "Orang-orang non-Arab berkumpul di Nahavand, dipimpin oleh Dhu al-Hajib. Umar menulis surat kepada al-Nu'man ibn Muqrin, memerintahkannya untuk berbaris ke sana setelah ia menyatakan keinginan untuk ikut serta dalam jihad. Ibn Ishaq, al-Waqidi, dan Abu Ma'shar menyatakan bahwa itu terjadi pada tahun 21, sedangkan Sayf mengatakan itu terjadi pada tahun 18. Dalam catatan Al-Mas'udi, Al-Mughira ibn Shu'ba pergi kepada raja mereka, Dhu al-Janahayn, dan mendudukkannya di tempat duduk raja yang megah. Ia melompat dan duduk bersamanya di singgasananya. Kaum Muslimin merayap ke sungai dalam kelompok lima atau enam orang. Al-Nu'man ibn Muqrin mengibarkan panjinya tiga kali: pertama untuk buang air kecil, kedua untuk mengencangkan tali dan mengamankan senjata, dan ketiga untuk membawanya. Dia berkata, \"Aku berdoa kepada Allah dengan permohonan: 'Ya Allah, berikanlah Al-Nu'man kesyahidan hari ini sebagai kemenangan dan penaklukan atas mereka.'\" Orang-orang berkata \"Amin,\" dan dialah yang pertama gugur. Ma'qal ibn Yasar menemukannya masih bernapas dan bertanya apa yang telah Allah lakukan kepada orang-orang itu. Dikatakan, \"Allah telah memberikan mereka kemenangan.\" Dia berkata, \"Segala puji bagi Allah. Tuliskan ini untuk Umar,\" dan jiwanya pun pergi. Dia mengeluarkan dari dadanya kitab para khalifah setelahnya. Kuburan para korban mereka, hingga zaman Al-Mas'udi, terlihat jelas sekitar satu farsakh dari Nahavand, di antara Nahavand dan Dinawar. {cite:muruj-al-dhahab hlm. 618-619}"
