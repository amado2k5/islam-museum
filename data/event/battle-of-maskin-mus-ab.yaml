label: { ar: "وقعة مسكن ومقتل مصعب بن الزبير", en: "Battle of Maskin and the Killing of Musab ibn al-Zubayr" }
summary:
  ar: "لما أراد عبد الملك بن مروان العراق تجهز مصعب بن الزبير، فجعل على مقدمته إبراهيم بن الأشتر، والتقى الجيشان بمسكن. وكان كثير من أهل العراق قد كاتبوا عبد الملك، فلما حصلت الوقعة انهزم أهل العراق وبقي مصعب مع قليل من المخلصين له حتى قُتل، ودخل عبد الملك الكوفة {cite:khudari-umayyad-state p.301}."
  en: "When Abd al-Malik ibn Marwan moved against Iraq, Musab ibn al-Zubayr prepared; he placed Ibrahim ibn al-Ashtar at the head of his vanguard, and the two armies met at Maskin. Many people of Iraq had been in correspondence with Abd al-Malik, so when the battle came the people of Iraq were routed, and Musab remained with a few loyal men until he was killed; then Abd al-Malik entered Kufa {cite:khudari-umayyad-state p.301}."
