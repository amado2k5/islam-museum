id: event/al-hadi-halts-at-khiwan-and-meets-the-sons-of-yafur-at-al-ghayl-290
class: event
kind: other
label:
  ar: "إقامة الهادي بخيوان ولقاؤه ابني يعفر بالغيل وأخذ أيمانهما، جمادى الأولى 290هـ"
  en: "Al-Hadi halts at Khiwan and, through al-Da'am, takes the oaths of the two sons of Ya'fur at al-Ghayl, Jumada I 290 AH"
  ur: "ہادی کا خیوان میں قیام اور دعام کے ذریعے الغیل میں یعفر کے دو بیٹوں سے عہد لینا، جمادی الاولیٰ 290ھ"
summary:
  ar: "أقام الهادي بخيوان أياماً وكان ابن الضحاك مائلاً إلى آل طريف فهرب من البلد، فكلمه ناس في قطع ماله وهدم منزله فكره ذلك، ثم نزل بيت ذؤد وكتب الدعام إلى ابني يعفر أن يلقياه بـالبون، فالتقوا بـالغيل وأخذ محمد بن سعيد عليهما الأمان والعهود والمواثيق."
  en: "al-Hadi stayed some days at Khiwan, where Ibn al-Dahhak, who leaned toward Al Tarif, fled the town; people spoke to al-Hadi about cutting off his property and razing his house, which he disliked, and he went on to Bayt Dhu'd; al-Da'am wrote to the two sons of Ya'fur to meet him at al-Bawn, and they met at al-Ghayl, where Muhammad ibn Sa'id took safety, covenants and pledges from them."
  ur: "ہادی خیوان میں کچھ دن ٹھہرے جہاں ابن الضحاک، جو آل طریف کی طرف مائل تھا، شہر سے بھاگ گیا؛ کچھ لوگوں نے ہادی سے اس کا مال ضبط کرنے اور گھر ڈھانے کی بات کی جو انہوں نے ناپسند کی، پھر وہ بیت ذؤد گئے؛ دعام نے یعفر کے دو بیٹوں کو لکھا کہ البون میں ملیں اور وہ الغیل میں ملے جہاں محمد بن سعید نے ان سے امان، عہد اور پیمان لیے۔"
