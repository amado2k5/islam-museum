id: event/al-hadi-leaves-for-najran-and-meets-abu-jafar-and-the-ahlaf-at-al-hisn-292
class: event
kind: other
label:
  ar: "خروج الهادي إلى نجران ولقاؤه أبا جعفر والأحلاف في الحصن، ص290"
  en: "Al-Hadi leaves again for Najran and meets Abu Ja'far and al-Ahlaf at al-Hisn, p. 290"
  ur: "ہادی کا دوبارہ نجران جانا اور الحصن میں ابو جعفر اور الاحلاف سے ملنا، ص290"
  es: "Al-Hadi parte de nuevo hacia Najran y se encuentra con Abu Ja'far y al-Ahlaf en al-Hisn, pág. 290."
summary:
  ar: "بعد اجتماع وادعة إلى محمد بن عبيد الله حالف بينها وبين شاكر وثقيف في الحصن، وفي يوم الأحد لأربع ماضية من رجب خرج الهادي إلى نجران فلقيه محمد بن عبيد الله في وادعة، وبات في الحصن واعتذر إليه الأحلاف ومن يأم."
  en: "After Wadi'a gathered to Muhammad ibn Ubaydallah he joined them in alliance with Shakir and Thaqif at al-Hisn; on Sunday, four days past Rajab, al-Hadi set out for Najran, Muhammad ibn Ubaydallah met him with Wadi'a, he spent the night at al-Hisn, and al-Ahlaf and Yam of Najran came to excuse themselves."
  ur: "وادعہ کے محمد بن عبید اللہ کے گرد جمع ہونے کے بعد انہوں نے الحصن میں شاکر اور ثقیف سے وادعہ کا حلف باندھا؛ اتوار رجب کے چار دن گزرنے پر ہادی نجران کو نکلے، محمد بن عبید اللہ وادعہ کے ساتھ ملے، رات الحصن میں گزری اور الاحلاف اور نجران کے یام نے آ کر معذرت کی۔"
  es: "Después de que Wadi'a se reuniera con Muhammad ibn Ubaydallah, este se unió a ellos en alianza con Shakir y Thaqif en al-Hisn; el domingo, cuatro días después de Rajab, al-Hadi partió hacia Najran, Muhammad ibn Ubaydallah lo recibió con Wadi'a, pasó la noche en al-Hisn, y al-Ahlaf y Yam de Najran vinieron a excusarse."
