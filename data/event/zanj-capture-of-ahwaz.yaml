id: event/zanj-capture-of-ahwaz
class: event
kind: conquest
label: { ar: "دخول الزنج الأهواز", en: "The Zanj Enter Ahwaz", es: "Los Zanj entran en Ahwaz", fr: "Les Zanj entrent à Ahwaz", ur: "زنج اہواز میں داخل ہوا۔", tr: "Zanj'ın Ahvaz'a girişi", id: "Masuknya suku Zanj ke Ahwaz" }
summary:
  ar: "في سنة ست وخمسين ومائتين دخل أصحاب صاحب الزنج الأهواز، وأسروا إبراهيم بن المدبر {cite:tabari-tarikh-abu-al-fadl j.9 p.472}. وعند ابن الجوزي وفي سنة 259هـ دخل الزنج الأهواز فقتلوا زهاء خمسين ألفاً {cite:muntazam-ibn-al-jawzi p. 101}"
  en: "In 256 the Zanj leader's men entered Ahwaz and captured Ibrahim ibn al-Mudabbir {cite:tabari-tarikh-abu-al-fadl j.9 p.472}. According to Ibn al-Jawzi, in 259 AH the Zanj entered Ahwaz and killed some fifty thousand people {cite:muntazam-ibn-al-jawzi p. 101}"
  es: "En el año 256 d. C., los hombres del líder Zanj entraron en Ahwaz y capturaron a Ibrahim ibn al-Mudabbir {cita:tabari-tarikh-abu-al-fadl, vol. 9, pág. 472}. Según Ibn al-Jawzi, en el año 259 d. C., los Zanj entraron en Ahwaz y mataron a unas cincuenta mil personas {cita:muntazam-ibn-al-jawzi, pág. 101}."
  fr: "En 256 AH, les hommes du chef Zanj entrèrent dans Ahwaz et capturèrent Ibrahim ibn al-Mudabbir (cf. Tabari Tarikh Abu al-Fadl, vol. 9, p. 472). Selon Ibn al-Jawzi, en 259 AH, les Zanj entrèrent à nouveau dans Ahwaz et massacrèrent environ cinquante mille personnes (cf. Muntazam Ibn al-Jawzi, p. 101)."
  ur: "256 میں زنج کے سردار کے آدمی اہواز میں داخل ہوئے اور ابراہیم ابن المدبیر کو گرفتار کر لیا ابن الجوزی کے مطابق 259 ہجری میں زنج اہواز میں داخل ہوا اور تقریباً پچاس ہزار افراد کو قتل کر دیا۔ 101}"
  tr: "Hicri 256 yılında, Zenc liderinin takipçileri Ahvaz'a girerek İbrahim ibn el-Mudabbir'i esir aldılar. İbn el-Cevzi'ye göre, Hicri 259 yılında Zenc, Ahvaz'a girerek yaklaşık elli bin kişiyi öldürdü."
  id: "Pada tahun 256 H, pengikut pemimpin Zanj memasuki Ahwaz dan menangkap Ibrahim ibn al-Mudabbir. Menurut Ibn al-Jawzi, pada tahun 259 H, Zanj memasuki Ahwaz dan membunuh sekitar lima puluh ribu orang."
