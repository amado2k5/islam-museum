  en: "In 256 the Zanj leader's men entered Ahwaz and captured Ibrahim ibn al-Mudabbir {cite:tabari-tarikh-abu-al-fadl j.9 p.472}. According to Ibn al-Jawzi, in 259 AH the Zanj entered Ahwaz and killed some fifty thousand people {cite:muntazam-ibn-al-jawzi p. 101}"
