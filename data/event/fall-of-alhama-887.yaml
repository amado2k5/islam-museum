label: { ar: "أخذ الحامة غدراً والحصار المسلم المردود" }
summary:
  ar: "أخذ النصارى الحامة غدراً آخر أيام الصلح على يد صاحب قادس سنة سبع وثمانين وثمانمائة، وغدوا للقلعة وتحصنوا بها ثم شرعوا في أخذ البلد فملأوا الطرق خيلاً ورجالاً وبذلوا السيف فيمن ظهر من المسلمين والناس في غفلة نيام من غير استعداد {cite:nafh-tib-maqqari p. 516}. وخرج العامة والخاصة من أهل غرناطة عندما بلغهم العلم والنصارى عشرة آلاف بين ماش وفارس، فحاصروهم وشددوا وطمعوا في منع الماء عن العدو، ثم جاء النذير أن النصارى أقبلوا في جمع عظيم لإغاثة من بالحامة فأقلع الجند منها، ودخلتها النصارى الواردون وحصنوها؛ وعاد المسلمون لحصارها فدخل على النصارى جملة من المسلمين من جهة موضع كانوا في غفلة عنه فشعروا بهم وعادوا عليهم وتردى بعضهم من أعلى الجبل وقتل أكثرهم وكانوا من أهل بسطة ووادي آش، فانقطع أمل الناس من ردها {cite:nafh-tib-maqqari p. 517}."
  en: "The Marquis of Cadiz seized Alhama by stealth in the last days of the truce (887) — the blow that opened Granada's final war; Granada's folk besieged the garrison and nearly cut its water until relief armies forced them off, and a last escalade by men of Baza and Guadix was discovered and hurled from the heights {cite:nafh-tib-maqqari p. 516-517}."
