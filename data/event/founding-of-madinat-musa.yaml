id: event/founding-of-madinat-musa
class: event
kind: founding
label: { ar: "بناء مدينة موسى بقزوين", en: "Founding of Madinat Musa at Qazwin", es: "Fundación de Madinat Musa en Qazwin", fr: "Fondation de Madinat Musa à Qazwin", ur: "قزوین میں مدینۃ موسیٰ کا قیام", tr: "Kazvin'de Musa şehrinin inşaatı", id: "Pembangunan Kota Musa di Qazvin" }
summary:
  ar: "كان موسى الهادي لما صار إلى الري أتى قزوين فأسر ببناء مدينة بأرضها تعرف مدينة موسى وابتاع أرضاً تدعى رستمباذ فوقفها على مصالح المدينة وكان عمرو الرومي مولاه يتولاها ثم تولاها بعده محمد بن عمرو وكان المبارك التركي بنى حصناً يسمى مدينة المبارك وبها قوم من مواليه."
  en: "When Musa al-Hadi reached Rayy he came to Qazwin and ordered a city built in its ground known as Madinat Musa; he bought a tract called Rustamabadh and endowed it for the town's benefit, his mawla Amr al-Rumi administering it, then Muhammad ibn Amr; and al-Mubarak al-Turki built a fortress called Madinat al-Mubarak peopled by his own mawali."
  es: "Cuando Musa al-Hadi llegó a Rayy, fue a Qazwin y ordenó construir en sus terrenos una ciudad conocida como Madinat Musa; compró un terreno llamado Rustamabadh y lo dotó para beneficio de la ciudad, administrándolo primero su mawla Amr al-Rumi y luego Muhammad ibn Amr; y al-Mubarak al-Turki construyó una fortaleza llamada Madinat al-Mubarak, habitada por su propio mawali."
  fr: "Lorsque Musa al-Hadi atteignit Rayy, il vint à Qazwin et ordonna la construction d'une ville sur son territoire, connue sous le nom de Madinat Musa; il acheta un terrain appelé Rustamabadh et le dota au profit de la ville, son mawla Amr al-Rumi l'administrant, puis Muhammad ibn Amr; et al-Mubarak al-Turki fit construire une forteresse appelée Madinat al-Mubarak, peuplée par son propre mawali."
  ur: "جب موسیٰ الہادی رے پہنچے تو قزوین پہنچے اور اس کی زمین میں ایک شہر تعمیر کرنے کا حکم دیا جسے مدینۃ موسیٰ کہا جاتا ہے۔ اس نے رستم آباد نامی ایک ٹریکٹ خریدا اور اسے شہر کے فائدے کے لیے عطا کیا، اس کے مولا عمرو الرومی نے اس کا انتظام کیا، پھر محمد بن عمرو؛ اور المبارک الترکی نے ایک قلعہ تعمیر کیا جسے مدینۃ المبارک کہا جاتا ہے اپنے ہی موالی نے۔"
  tr: "Musa el-Hadi, Rayy'a gittiğinde Kazvin'e geldi ve orada Musa Şehri olarak bilinen bir şehir kurmaktan memnuniyet duydu. Rustambadh adında bir arazi satın aldı ve şehrin yararına bağışladı. Efendisi Amr el-Rumi şehrin yönetiminden sorumluydu, daha sonra Muhammed ibn Amr yönetimi devraldı. El-Mubarak el-Turki, El-Mubarak Şehri adında bir kale inşa etti ve içinde azat ettiği kölelerinden bazıları bulunuyordu."
  id: "Ketika Musa al-Hadi pergi ke Rayy, ia tiba di Qazvin dan dengan senang hati membangun sebuah kota di tanahnya yang dikenal sebagai Kota Musa. Ia membeli tanah yang disebut Rustambadh dan mewakafkannya untuk kepentingan kota tersebut. Tuannya, Amr al-Rumi, bertanggung jawab atas kota itu, kemudian Muhammad ibn Amr mengambil alih setelahnya. Al-Mubarak al-Turki membangun sebuah benteng yang disebut Kota al-Mubarak, dan di dalamnya terdapat beberapa budak yang telah dibebaskannya."
