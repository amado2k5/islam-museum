label: { ar: "فتح الري وقومس", en: "The Conquest of Rayy and Qumis" }
summary:
  ar: "عند البلاذري عن العباس بن هشام الكلبي عن أبيه عن أبي مخنف: كتب عمر بن الخطاب إلى عمار بن ياسر وهو عامله على الكوفة بمد شهرين من وقعة نهاوند يأمره أن يبعث عروة بن زيد الخيل الطائي إلى الري ودستبا في ثمانية آلاف ففعل وسار عروة إلى ما هناك فجمعت له الديلم وأمدهم أهل الري فقاتلوه فأظهره الله عليهم فقتلهم واجتاحهم ثم خلف حنظلة بن زيد أخاه وقدم على عمار فسأله أن يوجهه إلى عمر وذلك أنه كان القادم عليه بخبر الجسر فأحب أن يأتيه بما يسره فلما رآه عمر قال إنا لله وإنا إليه راجعون فقال عروة بل احمد الله فقد نصرنا وأظهرنا وحدثه بحديثه فقال هلا أقمت وأرسلت قال قد استخلفت أخي وأحببت أن آتيك بنفسي فسماه البشير وقال عروة برزت لأهل القادسية معلماً وما كل من يفشي الكريهة يعلم."
  en: "In al-Baladhuri via al-Kalbi from Abu Mikhnaf: two months after Nihawand's battle Umar wrote Ammar ibn Yasir, his Kufa agent, to send Urwa ibn Zayd al-Khayl al-Ta'i to Rayy and Dastaba with eight thousand; the Daylam gathered against him with Rayy's reinforcement, and God gave him victory — he killed and swept through them, left his brother Hanzala ibn Zayd, and came to Ammar asking to be sent to Umar — he having once borne the Bridge's ill news and wishing now to bring joy. Umar saw him and said 'we are God's and to Him we return'; Urwa answered 'rather praise God — we are victorious,' told his tale, and when asked why he did not send word answered 'I left my brother and wished to come myself' — so Umar named him al-Bashir. Urwa's verse: 'I stood forth a teacher to Qadisiyya's people — not every bearer of sorrow teaches.'"
