label: { ar: "فتح الري وقومس", en: "The Conquest of Rayy and Qumis", es: "La conquista de Rayy y Qumis", fr: "La conquête de Rayy et de Qumis" }
summary:
  ar: "عند البلاذري عن العباس بن هشام الكلبي عن أبيه عن أبي مخنف: كتب عمر بن الخطاب إلى عمار بن ياسر وهو عامله على الكوفة بمد شهرين من وقعة نهاوند يأمره أن يبعث عروة بن زيد الخيل الطائي إلى الري ودستبا في ثمانية آلاف ففعل وسار عروة إلى ما هناك فجمعت له الديلم وأمدهم أهل الري فقاتلوه فأظهره الله عليهم فقتلهم واجتاحهم ثم خلف حنظلة بن زيد أخاه وقدم على عمار فسأله أن يوجهه إلى عمر وذلك أنه كان القادم عليه بخبر الجسر فأحب أن يأتيه بما يسره فلما رآه عمر قال إنا لله وإنا إليه راجعون فقال عروة بل احمد الله فقد نصرنا وأظهرنا وحدثه بحديثه فقال هلا أقمت وأرسلت قال قد استخلفت أخي وأحببت أن آتيك بنفسي فسماه البشير وقال عروة برزت لأهل القادسية معلماً وما كل من يفشي الكريهة يعلم."
  en: "In al-Baladhuri via al-Kalbi from Abu Mikhnaf: two months after Nihawand's battle Umar wrote Ammar ibn Yasir, his Kufa agent, to send Urwa ibn Zayd al-Khayl al-Ta'i to Rayy and Dastaba with eight thousand; the Daylam gathered against him with Rayy's reinforcement, and God gave him victory — he killed and swept through them, left his brother Hanzala ibn Zayd, and came to Ammar asking to be sent to Umar — he having once borne the Bridge's ill news and wishing now to bring joy. Umar saw him and said 'we are God's and to Him we return'; Urwa answered 'rather praise God — we are victorious,' told his tale, and when asked why he did not send word answered 'I left my brother and wished to come myself' — so Umar named him al-Bashir. Urwa's verse: 'I stood forth a teacher to Qadisiyya's people — not every bearer of sorrow teaches.'"
  es: "En al-Baladhuri vía al-Kalbi de Abu Mikhnaf: dos meses después de la batalla de Nihawand, Umar escribió a Ammar ibn Yasir, su agente de Kufa, para que enviara a Urwa ibn Zayd al-Khayl al-Ta'i a Rayy y Dastaba con ocho mil hombres; los Daylam se reunieron contra él con los refuerzos de Rayy, y Dios le dio la victoria: los mató y los arrasó, dejó a su hermano Hanzala ibn Zayd y fue a ver a Ammar pidiéndole que lo enviara a Umar, pues una vez había traído las malas noticias del Puente y ahora deseaba traer alegría. Umar lo vio y dijo: «Somos de Dios y a Él regresamos»; Urwa respondió: «Más bien alaba a Dios, somos victoriosos», contó su historia, y cuando se le preguntó por qué no había enviado noticias, respondió: «Dejé a mi hermano y deseé ir yo mismo»; entonces Umar lo llamó al-Bashir. Verso de Urwa: «Me presenté como maestro para el pueblo de Qadisiyya; no todo portador de dolor enseña»."
  fr: "Dans al-Baladhuri, rapporté par al-Kalbi d'après Abu Mikhnaf: deux mois après la bataille de Nihawand, Umar écrivit à Ammar ibn Yasir, son agent de Koufa, pour qu'il envoie Urwa ibn Zayd al-Khayl al-Ta'i auprès de Rayy et Dastaba avec huit mille hommes. Les Daylam se rassemblèrent contre lui avec les renforts de Rayy, et Dieu lui accorda la victoire: il les massacra et les anéantit, laissa son frère Hanzala ibn Zayd et vint trouver Ammar pour lui demander d'être envoyé auprès d'Umar. Ayant jadis porté la mauvaise nouvelle du Pont, il souhaitait à présent apporter la joie. Umar le reçut et dit: « Nous appartenons à Dieu et c'est à Lui que nous retournerons. » Urwa répondit: « Loué soit Dieu ! Nous sommes victorieux ! » Il raconta son histoire et, lorsqu'on lui demanda pourquoi il n'avait pas envoyé de message, il répondit: « J'ai laissé mon frère et j'ai voulu venir moi-même. » Umar le nomma alors al-Bashir. Verset d'Urwa: « Je me suis dressée comme enseignante auprès du peuple de Qadisiyya — tous ceux qui portent la douleur n'enseignent pas. »"
