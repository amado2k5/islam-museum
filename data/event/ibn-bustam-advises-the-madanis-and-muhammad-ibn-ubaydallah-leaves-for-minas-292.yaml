id: event/ibn-bustam-advises-the-madanis-and-muhammad-ibn-ubaydallah-leaves-for-minas-292
class: event
kind: other
label:
  ar: "مشورة ابن بسطام لبني عبد المدان وانتقال أبي جعفر إلى ميناس، ص281-282"
  en: "Ibn Bustam's advice to the Madanis and Abu Ja'far's move to Minas, pp. 281-282"
  ur: "ابن بسطام کا بنو عبد المدان کو مشورہ اور ابو جعفر کی میناس کو روانگی، ص281-282"
summary:
  ar: "يأتي ابن بسطام فيسأل لقاء المدانيين ويعلمهم أن الأمر عظيم ويشير بإخراج أبي جعفر، فيسألونه أن يخرج من القرية، فيخرج ومعه ابن بسطام، ويقول له ابن بسطام إن ميناس أحصن من الحصن، فيسير إليها ويرسل صبيانه وحرمه."
  en: "Ibn Bustam comes and asks to meet the Madanis, tells them the matter is grave and advises that Abu Ja'far be put out; they ask him to leave the village, and he goes with Ibn Bustam, who says Minas is stronger than al-Hisn, so he goes there and sends for his children and womenfolk."
  ur: "ابن بسطام آ کر مدانیوں سے ملنا چاہتا ہے، انہیں بتاتا ہے کہ معاملہ سنگین ہے اور ابو جعفر کو نکالنے کا مشورہ دیتا ہے؛ وہ ان سے بستی چھوڑنے کی درخواست کرتے ہیں، وہ ابن بسطام کے ساتھ نکلتے ہیں جو کہتا ہے کہ میناس حصن سے زیادہ مضبوط ہے، چنانچہ وہ وہاں جا کر بچوں اور گھر والیوں کو بلوا لیتے ہیں۔"
