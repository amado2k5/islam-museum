label: { ar: "وقعة شهاب الدين بملك الهند وأخذ أجمير", en: "Shihab al-Din's victory over the king of Hind and the taking of Ajmer (588 AH)", fr: "La victoire de Shihab al-Din sur le roi de l'Inde et la prise d'Ajmer (588 H)", es: "La victoria de Shihab al-Din sobre el rey de Hind y la toma de Ajmer (588 AH)", ur: "شہاب الدین کی ہند کے بادشاہ پر فتح اور اجمیر پر قبضہ ⁦(588ھ)⁩", tr: "Şihab el-Din'in Hindistan Kralı ile yaptığı savaş ve Ajmer'in ele geçirilmesi", id: "Pertempuran Shihab al-Din melawan Raja India dan penaklukan Ajmer" }
summary:
  ar: "في سنة ثمان وثمانين وخمسمائة خرج شهاب الدين الغوري من غزنة بعساكره يطلب ملك الهند الذي هزمه سنة ثلاث وثمانين، وقال لشيخ من الغورية نصحه: أعلم أنني منذ هزمني هذا الكافر ما نمت مع زوجتي ولا غيرت ثياب البياض عني وأنا معتمد على الله لا على الغورية ولا على غيرهم؛ فسار حتى جاز موضع المصاف الأول وأخذ مواضع من بلاد العدو، ولما جمع له ملك الهند عساكره عاد شهاب الدين أربع منازل والعدو في أثره يطلبه حتى لحقه قريباً من مرندة، فجرّد من عسكره سبعين ألفاً يدورون ليلاً حتى يكونوا وراء عسكر العدو، فلما طلع الفجر — ومن عادة الهنود أنهم لا يبرحون مضاجعهم حتى تطلع الشمس — حمل المسلمون من كل جانب وضربت الكؤسات، فلم يلتفت ملك الهند حتى كثر القتل في أصحابه، فركب فرساً ليهرب فذكّره أعيان أصحابه بحلفه ألا يخليهم فنزل وركب الفيل ووقف موضعه حتى انتهى إليه المسلمون فأخذوه أسيراً، فجذبه بعض الحجاب بلحيته حتى أصاب جبينه الأرض بين يدي شهاب الدين، فقال له: لو استأسرتني ماذا كنت تفعل بي؟ فقال: قد استعملت لك قيداً من ذهب أقيدك به، فقال شهاب الدين: بل نحن لا نجعل لك من القدر ما نقيدك؛ وغنم المسلمون أموالاً عظيمة وأربعة عشر فيلاً، وسار به إلى أجمير فأخذه وجميع البلاد التي تقاربه وأقطعها لمملوكه قطب الدين أيبك وعاد إلى غزنة وقُتل ملك الهند {cite:kamil-ibn-al-athir p. 221-222}."
  en: "588 (1192): brooding since his 583 defeat — 'I have not slept with my wife nor changed my white clothes since that kafir beat me' — Shihab al-Din al-Ghuri marched for Hind, drew the pursuing king four stages deep, then loosed seventy thousand horse on a night encirclement; at dawn, while the Indians kept to their bedding custom, the host struck from every side; the king stood on his elephant till taken, was dragged by the beard before Shihab al-Din, exchanged the famous words — 'I had a golden fetter for you' / 'we give you no rank worth a fetter' — saw Ajmer iqta'd to the mamluk Qutb al-Din Aybak, and was killed {cite:kamil-ibn-al-athir p. 221-222}."
  fr: "588 (1192) : ruminant sa défaite de 583, « je n'ai ni dormi avec ma femme ni changé mes vêtements blancs depuis que ce kafir m'a battu », Shihab al-Din al-Ghuri marcha sur l'Inde, attira le roi qui le poursuivait à quatre étapes en profondeur, puis lança soixante-dix mille cavaliers dans un encerclement nocturne ; à l'aube, tandis que les Indiens restaient à leur coutume de literie, l'armée frappa de tous côtés ; le roi resta sur son éléphant jusqu'à être pris, fut traîné par la barbe devant Shihab al-Din, échangea les paroles fameuses, « j'avais pour toi une entrave d'or » / « nous ne te donnons aucun rang qui vaille une entrave », vit Ajmer donnée en iqta' au mamelouk Qutb al-Din Aybak, et fut tué {cite:kamil-ibn-al-athir p. 221-222}."
  es: "588 (1192): meditando desde su derrota en 583 — 'No he dormido con mi esposa ni me he cambiado la ropa blanca desde que ese kafir me derrotó' — Shihab al-Din al-Ghuri marchó hacia Hind, atrajo al rey perseguidor a cuatro etapas de profundidad, luego soltó setenta mil caballos en un cerco nocturno; al amanecer, mientras los indios mantenían su costumbre de dormir, el ejército atacó por todos lados; el rey permaneció sobre su elefante hasta que fue capturado, fue arrastrado por la barba ante Shihab al-Din, intercambiaron las famosas palabras — 'Tenía un grillete de oro para ti' / 'No te damos ningún rango que valga un grillete' — vio a Ajmer iqta'd al mameluco Qutb al-Din Aybak, y fue asesinado {cite:kamil-ibn-al-athir p. 221-222}."
  ur: "588 (1192): اس کی 583 کی شکست کے بعد سے سوچنا - 'جب سے اس کافر نے مجھے مارا ہے میں اپنی بیوی کے ساتھ نہیں سویا اور نہ ہی اپنے سفید کپڑے بدلے' - شہاب الدین الثوری نے ہند کی طرف کوچ کیا، تعاقب کرنے والے بادشاہ کو چار مراحل تک کھینچ لیا، پھر ایک رات میں ستر ہزار گھوڑے کو گھیرے میں لے لیا۔ فجر کے وقت، جب کہ ہندوستانی اپنے بستر کے رواج پر قائم تھے، میزبان نے ہر طرف سے حملہ کیا۔ بادشاہ ہاتھی پر اٹھائے کھڑا رہا، اسے شہاب الدین کے سامنے داڑھی سے گھسیٹا گیا، مشہور الفاظ کا تبادلہ کیا - 'میرے پاس آپ کے لیے سونے کی بیڑی تھی' / 'ہم آپ کو بیڑی کے برابر کوئی درجہ نہیں دیتے' - اجمیر نے مملوک قطب الدین ایبک کو اقتداء کرتے ہوئے دیکھا، اور اسے قتل کردیا گیا۔ 221-222}۔"
  tr: "588 yılında Şihab el-Din el-Gauri, 583 yılında kendisini mağlup eden Hindistan kralını aramak için askerleriyle birlikte Gazne'den ayrıldı. Kendisine öğüt veren Gurlulardan bir şeyhe şöyle dedi: \"Bil ki, bu kâfir beni mağlup ettiğinden beri karımla yatmadım, beyaz elbiselerimi çıkarmadım ve Gurlulara veya başkasına değil, Allah'a güveniyorum.\" Böylece ilk savaş hattını geçene ve düşman topraklarında mevzilenene kadar yürüdü. Hindistan kralı askerlerini ona karşı topladığında, Şihab el-Din dört aşama geri döndü ve düşman onu Maranda yakınlarında yakalayana kadar takip etti. Daha sonra ordusundan yetmiş bin adamı gece devriye gezmeleri için gönderdi ve düşman ordusunun arkasına geçtiler. Şafak söktüğünde -ve Hintlilerin güneş doğana kadar yataklarından kalkmamaları adeti gereğidir- Müslümanlar her taraftan saldırdılar ve kadehler vuruldu. Hindistan kralı, birçok arkadaşı öldürülene kadar arkasına dönmedi. Kaçmak için ata bindi, ancak yoldaşları arasındaki ileri gelenler ona onları terk etmeyeceğine dair yeminini hatırlattılar. Bunun üzerine attan indi, file bindi ve Müslümanlar ona ulaşıp onu esir alana kadar yerinde durdu. Muhafızlardan biri onu sakalından çekerek alnını Şihab el-Din'in önünde yere serdi. Ona, \"Beni yakalasaydınız bana ne yapardınız?\" dedi. Muhafız, \"Seni altın bir zincirle bağlardım\" dedi. Şihab el-Din, \"Aksine, seni bağlama gücünü sana vermeyeceğiz\" dedi. Müslümanlar büyük bir servet ve on dört fil ele geçirdiler ve o da bunlarla birlikte Ajmer'e yürüdü, şehri ve çevresindeki tüm toprakları ele geçirdi ve bunları Memlük Kutb el-Din Aybak'a tımar olarak verdi, Gazne'ye döndü ve Hindistan kralı öldürüldü. {Kaynak: Kamil İbn el-Atir s. 221-222}"
  id: "Pada tahun 588, Shihab al-Din al-Ghauri meninggalkan Ghazna bersama pasukannya untuk mencari raja India yang telah mengalahkannya pada tahun 583. Ia berkata kepada seorang syekh dari Dinasti Ghurid yang menasihatinya: “Ketahuilah bahwa sejak orang kafir ini mengalahkan saya, saya belum tidur dengan istri saya atau mengganti pakaian putih saya, dan saya berserah kepada Allah, bukan kepada Dinasti Ghurid atau siapa pun.” Maka ia berbaris hingga melewati garis pertempuran pertama dan mengambil posisi di tanah musuh. Ketika Raja India mengumpulkan pasukannya untuk melawannya, Shihab al-Din kembali empat tahap, dengan musuh mengejarnya hingga mereka berhasil menangkapnya di dekat Maranda. Kemudian ia mengirimkan tujuh puluh ribu orang dari pasukannya untuk berpatroli di malam hari hingga mereka berada di belakang pasukan musuh. Ketika fajar menyingsing—dan merupakan kebiasaan orang India bahwa mereka tidak meninggalkan tempat tidur mereka sampai matahari terbit—umat Muslim menyerang dari segala arah dan cawan-cawan dipukul. Raja India tidak berbalik sampai banyak pengikutnya terbunuh. Ia menaiki kuda untuk melarikan diri, tetapi para tokoh di antara para sahabatnya mengingatkannya akan sumpahnya untuk tidak meninggalkan mereka. Maka ia turun dari kuda dan menaiki gajah, lalu berdiri di tempatnya hingga kaum Muslimin mendatanginya dan menangkapnya. Salah seorang penjaga menarik janggutnya hingga dahinya membentur tanah di depan Shihab al-Din. Ia berkata kepadanya: Jika kau menangkapku, apa yang akan kau lakukan padaku? Ia menjawab: Aku akan menggunakan rantai emas untuk mengikatmu. Shihab al-Din berkata: Sebaliknya, kami tidak akan memberimu kekuatan untuk mengikatmu. Kaum Muslimin merampas kekayaan besar dan empat belas gajah, dan ia berbaris dengan itu ke Ajmer, merebutnya dan semua tanah yang berdekatan dengannya, dan memberikannya sebagai tanah feodal kepada Mamluknya, Qutb al-Din Aybak, lalu kembali ke Ghazna, dan raja India terbunuh {cite:kamil-ibn-al-athir p. 221-222}."
