id: event/baqillani-byzantine-embassy-369
class: event
kind: other
label:
  ar: "الباقلاني يحمل جواب عضد الدولة إلى بلاط الروم، ٣٦٩هـ/٩٨٠م"
  en: "Al-Baqillani carries Adud al-Dawla's reply to the Byzantine court, 369/980"
  ur: "باقلانی عضد الدولہ کا جواب لے کر دربار روم پہنچتے ہیں، 369ھ/980ء"
summary:
  ar: "في سنة ٣٦٩هـ/٩٨٠م وصل إلى بغداد سفير من القسطنطينية يطلب تسليم القائد المتمرد بردس سكيروس الذي كان قد لاذ بديار بكر، فأرسل عضد الدولة جوابه الرافض للطلبات البيزنطية بيد القاضي أبي بكر الباقلاني إلى بلاط الروم {cite:encyclopaedia-of-islam-2 vol. 1 p. 233}؛ وتذكر ترجمة الباقلاني نفسها زيارته لبلاط الروم {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}."
  en: "In 369/980 an embassy from Constantinople reached Baghdad seeking the surrender of the rebel commander Bardas Skleros, who had taken refuge in Diyar Bakr. Adud al-Dawla sent his reply — a refusal — to the Byzantine court 'by the hand of the qadi Abu Bakr al-Bakillani' {cite:encyclopaedia-of-islam-2 vol. 1 p. 233}; al-Baqillani's own biographical entry likewise records a visit to the Byzantine court {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}."
  ur: "369ھ/980ء میں قسطنطینیہ کا ایک سفیر بغداد پہنچا جو بغاوت کے بعد دیار بکر میں پناہ لینے والے بردس سکلیرس کی حوالگی چاہتا تھا۔ عضد الدولہ نے اپنا جواب — انکار — «قاضی ابوبکر باقلانی کے ہاتھ» دربار روم بھیجا {cite:encyclopaedia-of-islam-2 vol. 1 p. 233}؛ خود باقلانی کی ترجمہ بھی دربار روم کے سفر کا ذکر کرتی ہے {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}۔"
