label: { ar: "خلع أهل بغداد إبراهيم بن المهدي", en: "Baghdad's deposition of Ibrahim ibn al-Mahdi" }
summary:
  ar: "في سنة ثلاث ومائتين خلع أهل بغداد إبراهيم بن المهدي، ودعوا للمأمون بالخلافة بعد اتفاق مع حميد بن عبد الحميد {cite:tabari-tarikh-abu-al-fadl j.8 p.570}، ثم اختفى إبراهيم {cite:tabari-tarikh-abu-al-fadl j.8 p.571}، وعند السيوطي لقب بالمبارك وفي ذي الحجة سنة ثلاث ومئتين بلغه تسلل الناس من عهده فاختفى فكانت أيامه سنتين إلا أياماً وبقي في اختفائه مدة ثمان سنين {cite:tarikh-khulafa-minhaj-1434 p. 487}"
  en: "In the year 203 the people of Baghdad deposed Ibrahim ibn al-Mahdi and proclaimed al-Ma'mun caliph, after an agreement with Humayd ibn Abd al-Hamid {cite:tabari-tarikh-abu-al-fadl j.8 p.570}; then Ibrahim went into hiding {cite:tabari-tarikh-abu-al-fadl j.8 p.571}. In al-Suyuti he was given the title al-Mubarak; in Dhu'l-Hijja of the year 203 word reached him that people were slipping away from his allegiance, and he went into hiding. His reign lasted two years less a few days, and he remained in hiding for eight years {cite:tarikh-khulafa-minhaj-1434 p. 487}"
