id: event/deposition-of-ibrahim-ibn-al-mahdi
class: event
kind: other
label: { ar: "خلع أهل بغداد إبراهيم بن المهدي", en: "Baghdad's deposition of Ibrahim ibn al-Mahdi", es: "La deposición de Ibrahim ibn al-Mahdi por parte de Bagdad", fr: "La destitution d'Ibrahim ibn al-Mahdi par Bagdad", ur: "بغداد میں ابراہیم بن المہدی کی معزولی", tr: "Bağdat halkı İbrahim ibn el-Mehdi'yi tahttan indirdi.", id: "Rakyat Baghdad menggulingkan Ibrahim ibn al-Mahdi." }
summary:
  ar: "في سنة ثلاث ومائتين خلع أهل بغداد إبراهيم بن المهدي، ودعوا للمأمون بالخلافة بعد اتفاق مع حميد بن عبد الحميد {cite:tabari-tarikh-abu-al-fadl j.8 p.570}، ثم اختفى إبراهيم {cite:tabari-tarikh-abu-al-fadl j.8 p.571}، وعند السيوطي لقب بالمبارك وفي ذي الحجة سنة ثلاث ومئتين بلغه تسلل الناس من عهده فاختفى فكانت أيامه سنتين إلا أياماً وبقي في اختفائه مدة ثمان سنين {cite:tarikh-khulafa-minhaj-1434 p. 487}"
  en: "In the year 203 the people of Baghdad deposed Ibrahim ibn al-Mahdi and proclaimed al-Ma'mun caliph, after an agreement with Humayd ibn Abd al-Hamid {cite:tabari-tarikh-abu-al-fadl j.8 p.570}; then Ibrahim went into hiding {cite:tabari-tarikh-abu-al-fadl j.8 p.571}. In al-Suyuti he was given the title al-Mubarak; in Dhu'l-Hijja of the year 203 word reached him that people were slipping away from his allegiance, and he went into hiding. His reign lasted two years less a few days, and he remained in hiding for eight years {cite:tarikh-khulafa-minhaj-1434 p. 487}"
  es: "En el año 203, el pueblo de Bagdad depuso a Ibrahim ibn al-Mahdi y proclamó califa a al-Ma'mun, tras un acuerdo con Humayd ibn Abd al-Hamid {cite:tabari-tarikh-abu-al-fadl j.8 p.570}; entonces Ibrahim se ocultó {cite:tabari-tarikh-abu-al-fadl j.8 p.571}. En al-Suyuti se le otorgó el título de al-Mubarak; en Dhu'l-Hijja del año 203 le llegó la noticia de que el pueblo se estaba alejando de su lealtad, y se ocultó. Su reinado duró dos años menos unos días, y permaneció oculto durante ocho años {cite:tarikh-khulafa-minhaj-1434 p. 487}."
  fr: "En l'an 203, les habitants de Bagdad destituèrent Ibrahim ibn al-Mahdi et proclamèrent al-Ma'mun calife, suite à un accord avec Humayd ibn Abd al-Hamid (voir Tabari Tarikh Abu al-Fadl, vol. 8, p. 570). Ibrahim entra alors dans la clandestinité (voir Tabari Tarikh Abu al-Fadl, vol. 8, p. 571). Dans l'ouvrage d'al-Suyuti, il reçut le titre d'al-Mubarak. En Dhu al-Hijja de l'an 203, il apprit que certains se désolidarisaient de lui et il se cacha à nouveau. Son règne dura deux ans moins quelques jours, et il demeura caché pendant huit ans (voir Tarikh Khulafa Minhaj, vol. 1434, p. 487)."
  ur: "سنہ 203 میں بغداد کے لوگوں نے ابراہیم بن المہدی کو معزول کیا اور حمید بن عبد الحمید کے ساتھ ایک معاہدے کے بعد المامون کا خلیفہ قرار دیا۔ پھر ابراہیم چھپ گیا السیوطی میں انہیں المبارک کا لقب دیا گیا۔ سنہ 203 ذی الحجہ میں آپ کو یہ خبر پہنچی کہ لوگ آپ کی بیعت سے دور ہو رہے ہیں اور آپ روپوش ہو گئے۔ اس کا دور حکومت دو سال چند دن کم رہا اور وہ آٹھ سال تک روپوش رہا۔ 487}"
  tr: "Hicri 203 yılında Bağdat halkı İbrahim ibn el-Mehdi'yi tahttan indirdi ve Hamid ibn Abd el-Hamid ile anlaştıktan sonra el-Ma'mun'u halife ilan etti. {Kaynak: Tabari-tarikh-abu-el-fadl c.8 s. 570}. Bunun üzerine İbrahim ortadan kayboldu. {Kaynak: Tabari-tarikh-abu-el-fadl c.8 s. 571}. El-Suyuti'ye göre, ona el-Mubarak lakabı verilmişti. Hicri 203 yılının Zilhicce ayında, halkın kendisini terk ettiğini öğrenince ortadan kayboldu. Saltanatı birkaç gün eksik iki yıl sürdü ve sekiz yıl boyunca saklandı. {Kaynak: Tarikat-hulafa-minhaj-1434 s. 487}."
  id: "Pada tahun 203 H, penduduk Baghdad menggulingkan Ibrahim ibn al-Mahdi dan menyerukan agar al-Ma'mun menjadi khalifah setelah kesepakatan dengan Hamid ibn Abd al-Hamid {cite:tabari-tarikh-abu-al-fadl j.8 p.570}. Kemudian Ibrahim menghilang {cite:tabari-tarikh-abu-al-fadl j.8 p.571}. Menurut al-Suyuti, ia dijuluki al-Mubarak. Pada bulan Dzul Hijjah tahun 203 H, ia mengetahui bahwa orang-orang meninggalkannya, sehingga ia menghilang. Masa pemerintahannya berlangsung selama dua tahun dikurangi beberapa hari, dan ia bersembunyi selama delapan tahun {cite:tarikh-khulafa-minhaj-1434 p. 487}."
