class: event
kind: other
label:
  ar: "رحلة ابن رجب مع أبيه إلى الحجاز وبيت المقدس، نحو ٧٥٥هـ"
  en: "Ibn Rajab's journey with his father to the Hijaz and Jerusalem, c. 755"
  ur: "ابن رجب کا والد کے ساتھ حجاز اور بیت المقدس کا سفر، تقریباً 755ھ"
  es: "El viaje de Ibn Rajab con su padre al Hiyaz y Jerusalén, c. 755."
  fr: "Le voyage d'Ibn Rajab avec son père au Hedjaz et à Jérusalem, vers 755"
  tr: "İbn Receb'in babasıyla birlikte Hicaz ve Kudüs'e yaptığı yolculuk, yaklaşık 755 Hicri yılı."
  id: "Perjalanan Ibnu Rajab bersama ayahnya ke Hijaz dan Yerusalem, sekitar tahun 755 Hijriah."
summary:
  ar: "رحل أبو ابن رجب به في صغره إلى الحجاز وبيت المقدس لأجل سماع الحديث، كما سمع في مصر؛ ويذكر محقق «جامع العلوم والحكم» أنه رحل في طلب العلم إلى مصر ونابلس والحجاز والقدس ومكة والمدينة {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 9}."
  en: "Ibn Rajab's father travelled with him in his youth to the Hijaz and Jerusalem for the sake of hearing hadith, and he also heard hadith in Egypt; the editor lists Egypt, Nablus, the Hijaz, Jerusalem, Mecca and Medina among his journeys for knowledge {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 9}."
  ur: "ابن رجب کے والد انہیں کمسنی میں حدیث کی سماعت کے لیے حجاز اور بیت المقدس لے گئے، اور انہوں نے مصر میں بھی سماعت کی؛ محقق ان کے اسفار میں مصر، نابلس، حجاز، بیت المقدس، مکہ اور مدینہ گنواتے ہیں {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 9}۔"
  es: "El padre de Ibn Rajab viajó con él en su juventud al Hiyaz y a Jerusalén para escuchar hadices, y también escuchó hadices en Egipto; el editor enumera Egipto, Nablus, el Hiyaz, Jerusalén, La Meca y Medina entre sus viajes en busca de conocimiento {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 9}."
  fr: "Le père d'Ibn Rajab voyagea avec lui dans sa jeunesse au Hedjaz et à Jérusalem pour entendre des hadiths, et il en entendit également en Égypte; l'éditeur cite l'Égypte, Naplouse, le Hedjaz, Jérusalem, La Mecque et Médine parmi ses voyages pour la connaissance {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 9}."
  tr: "Ebu İbn Receb, gençliğinde onu Mısır'da duyduğu hadisleri dinlemesi için Hicaz ve Kudüs'e götürmüştür; ve \"Cami' el-Ulum ve el-Hikam\"ın editörü, onun ilim arayışı içinde Mısır, Nablus, Hicaz, Kudüs, Mekke ve Medine'ye seyahat ettiğini belirtmektedir. {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 9}"
  id: "Abu Ibn Rajab membawanya pada masa mudanya ke Hijaz dan Yerusalem untuk mendengarkan hadits, sebagaimana yang telah ia dengar di Mesir; dan editor “Jami’ al-‘Ulum wa al-Hikam” menyebutkan bahwa ia melakukan perjalanan untuk mencari ilmu ke Mesir, Nablus, Hijaz, Yerusalem, Mekah, dan Madinah {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 9}."
