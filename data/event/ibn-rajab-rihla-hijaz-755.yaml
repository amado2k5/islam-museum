label:
  ar: "رحلة ابن رجب مع أبيه إلى الحجاز وبيت المقدس، نحو ٧٥٥هـ"
  en: "Ibn Rajab's journey with his father to the Hijaz and Jerusalem, c. 755"
  ur: "ابن رجب کا والد کے ساتھ حجاز اور بیت المقدس کا سفر، تقریباً 755ھ"
summary:
  ar: "رحل أبو ابن رجب به في صغره إلى الحجاز وبيت المقدس لأجل سماع الحديث، كما سمع في مصر؛ ويذكر محقق «جامع العلوم والحكم» أنه رحل في طلب العلم إلى مصر ونابلس والحجاز والقدس ومكة والمدينة {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 9}."
  en: "Ibn Rajab's father travelled with him in his youth to the Hijaz and Jerusalem for the sake of hearing hadith, and he also heard hadith in Egypt; the editor lists Egypt, Nablus, the Hijaz, Jerusalem, Mecca and Medina among his journeys for knowledge {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 9}."
  ur: "ابن رجب کے والد انہیں کمسنی میں حدیث کی سماعت کے لیے حجاز اور بیت المقدس لے گئے، اور انہوں نے مصر میں بھی سماعت کی؛ محقق ان کے اسفار میں مصر، نابلس، حجاز، بیت المقدس، مکہ اور مدینہ گنواتے ہیں {cite:encyclopaedia-of-islam-2 vol. 3 p. 933} {cite:ibn-rajab-jami-ulum-hikam p. 9}۔"
