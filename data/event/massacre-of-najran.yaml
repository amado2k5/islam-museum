id: event/massacre-of-najran
class: event
kind: massacre
label: { en: "The Massacre of Najran (Ashab al-Ukhdud)", ar: "مذبحة نجران ⁦(أصحاب الأخدود)⁩", es: "La masacre de Najran (Ashab al-Ukhdud)", fr: "Le massacre de Najran (Ashab al-Ukhdud)", ur: "نجران کا قتل عام ⁦(اصحاب الخدود)⁩", tr: "Necran Katliamı (Hendek Halkı)", id: "Pembantaian Najran (Orang-orang di Parit)" }
summary:
  en: "In October 523 the Himyarite king Dhu Nuwas, a convert to Judaism, marched on the Christians of Najran demanding they renounce their faith; on their refusal he dug the great trench and burned them — men, women, children and elders, twenty to forty thousand by report — the Ashab al-Ukhdud of Surat al-Buruj, whose blood summoned the Abyssinian occupation."
  ar: "في أكتوبر سنة 523م قاد ذو نواس — وقد تهوّد — حملة على نصارى نجران ليصرفهم عن دينهم قسراً؛ فلما أبوا خدّ لهم الأخدود وأحرقهم بالنار رجالاً ونساءً وصغاراً وشيوخاً، وقيل ما بين عشرين ألفاً وأربعين ألفاً — وهم أصحاب الأخدود في سورة البروج، وكان من جراء ذلك الاحتلال الحبشي الثاني لليمن."
  es: "En octubre de 523, el rey himyarita Dhu Nuwas, convertido al judaísmo, marchó sobre los cristianos de Najrán exigiéndoles que renunciaran a su fe; ante su negativa, cavó una gran zanja y los quemó —hombres, mujeres, niños y ancianos, entre veinte y cuarenta mil según los informes—, los Ashab al-Ukhdud de Surat al-Buruj, cuya sangre provocó la ocupación abisinia."
  fr: "En octobre 523, le roi himyarite Dhu Nuwas, converti au judaïsme, marcha sur les chrétiens de Najran en exigeant qu'ils renoncent à leur foi; face à leur refus, il creusa le grand fossé et les brûla — hommes, femmes, enfants et vieillards, vingt à quarante mille selon les rapports — les Ashab al-Ukhdud de Surat al-Buruj, dont le sang provoqua l'occupation abyssinienne."
  ur: "اکتوبر 523 میں حمیری بادشاہ ذو نواس، جو یہودیت میں تبدیل ہو گیا تھا، نے نجران کے عیسائیوں پر مارچ کیا اور مطالبہ کیا کہ وہ اپنا عقیدہ چھوڑ دیں۔ ان کے انکار پر اس نے بڑی خندق کھود کر انہیں جلا دیا — مرد، عورتیں، بچے اور بزرگ، بیس سے چالیس ہزار رپورٹ کے مطابق — سورت البروج کے اصحاب الخدود، جن کے خون نے حبشی قبضے کو طلب کر لیا۔"
  tr: "Milattan sonra 523 yılının Ekim ayında, Yahudiliğe geçen Zü'n-uves, Necran'daki Hristiyanları zorla dinlerinden döndürmek için bir sefer düzenledi. Onlar reddedince, onlar için bir hendek kazdırdı ve erkekleri, kadınları, çocukları ve yaşlıları ateşe verdi. Yirmi bin ile kırk bin arasında insanın öldürüldüğü söylenir ve bunlar Buruc Suresi'ndeki hendek halkıdır. Bunun sonucunda Yemen'in ikinci Habeşistan işgali gerçekleşti."
  id: "Pada bulan Oktober 523 M, Dhu Nuwas – yang telah memeluk agama Yahudi – memimpin kampanye melawan orang-orang Kristen di Najran untuk memaksa mereka meninggalkan agama mereka. Ketika mereka menolak, ia menggali parit untuk mereka dan membakar mereka dengan api, laki-laki, perempuan, anak-anak, dan orang tua. Dikatakan bahwa antara dua puluh ribu hingga empat puluh ribu orang tewas – dan mereka adalah orang-orang yang berada di parit dalam Surat al-Buruj. Akibatnya, pendudukan Abyssinia kedua di Yaman terjadi."
