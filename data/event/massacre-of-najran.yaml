label: { en: "The Massacre of Najran (Ashab al-Ukhdud)", ar: "مذبحة نجران (أصحاب الأخدود)" }
summary:
  en: "In October 523 the Himyarite king Dhu Nuwas, a convert to Judaism, marched on the Christians of Najran demanding they renounce their faith; on their refusal he dug the great trench and burned them — men, women, children and elders, twenty to forty thousand by report — the Ashab al-Ukhdud of Surat al-Buruj, whose blood summoned the Abyssinian occupation."
  ar: "في أكتوبر سنة 523م قاد ذو نواس — وقد تهوّد — حملة على نصارى نجران ليصرفهم عن دينهم قسراً؛ فلما أبوا خدّ لهم الأخدود وأحرقهم بالنار رجالاً ونساءً وصغاراً وشيوخاً، وقيل ما بين عشرين ألفاً وأربعين ألفاً — وهم أصحاب الأخدود في سورة البروج، وكان من جراء ذلك الاحتلال الحبشي الثاني لليمن."
