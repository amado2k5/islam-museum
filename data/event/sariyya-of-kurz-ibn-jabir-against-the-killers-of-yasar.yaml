id: event/sariyya-of-kurz-ibn-jabir-against-the-killers-of-yasar
class: event
kind: raid
label: { ar: "سرية كرز بن جابر لقتل البجليين الذين قتلوا يساراً", en: "Kurz ibn Jabir's detachment against the men of Bajila who killed Yasar" }
summary:
  ar: "يرويه ابن هشام عن بعض أهل العلم عن محمد بن طلحة عن عثمان بن عبد الرحمن: أصاب النبي في غزوة محارب وبني ثعلبة عبداً يقال له يسار فجعله في لقاحه ترعى بناحية الجماء؛ فقدم نفر من قيس كبّة من بجيلة فاستوبؤوا وطحلوا، فأمرهم النبي أن يخرجوا إلى اللقاح فيشربوا من ألبانها وأبوالها، فلما صحّوا عدوا على يسار فذبحوه وغرزوا الشوك في عينيه واستاقوا اللقاح؛ فبعث النبي في آثارهم كرز بن جابر فلحقهم وأتى بهم النبي مرجعه من غزوة ذي قرد، فقطع أيديهم وأرجلهم وسمل أعينهم."
  en: "Ibn Hisham tells it from a scholar, from Muhammad ibn Talha, from Uthman ibn Abd al-Rahman: in the raid on Muharib and Banu Tha'laba the Prophet acquired a slave named Yasar and put him in charge of his milch-camels grazing near al-Jamma'; a party of Qays Kubba of Bajila came to Medina, fell sick and their spleens swelled, so the Prophet told them to go out to the camels and drink their milk and urine; when they recovered they attacked Yasar, slaughtered him, drove thorns into his eyes and drove off the camels. The Prophet sent Kurz ibn Jabir after them; he caught them and brought them to the Prophet on his return from the Dhu Qarad raid, and he cut off their hands and feet and put out their eyes."
