id: event/umar-ii-transoxania-dawa
class: event
kind: other
label: { ar: "دعوة عمر الثاني ملوك ما وراء النهر وغزو ابن معمر", en: "Umar II's Da'wa beyond the River and Ibn Ma'mar's Raid", es: "La prédica de Umar II más allá del río y la incursión de Ibn Ma'mar", fr: "La Da'wa d'Umar II au-delà du fleuve et le raid d'Ibn Ma'mar", ur: "عمر ثانی کی دعوت دریا کے پار اور ابن معمر کی چھاپ" }
summary:
  ar: "لما استخلف عمر بن عبد العزيز كتب إلى ملوك ما وراء النهر يدعوهم إلى الإسلام فأسلم بعضهم وكان عامل عمر على خراسان الجراح بن عبد الله الحكمي فأخذ مخلد بن يزيد وعمال يزيد فحبسهم ووجه الجراح عبد الله بن معمر اليشكري إلى ما وراء النهر فأوغل في بلاد العدو وهم بدخول الصين فأحاطت به الترك حتى افتدى منهم وتخلص وصار إلى الشاش ورفع عمر الخراج عمن أسلم بخراسان."
  en: "Umar ibn Abd al-Aziz wrote the kings beyond the river summoning them to Islam — some converted. His Khurasan governor al-Jarrah ibn Abdallah al-Hakami jailed Mukhallad ibn Yazid and Yazid's agents, and sent Abdallah ibn Ma'mar al-Yashkuri deep into enemy lands till he neared China; the Turks surrounded him till he ransomed free and reached al-Shash. Umar lifted kharaj from Khurasan's converts."
  es: "Umar ibn Abd al-Aziz escribió a los reyes del otro lado del río, invitándolos a convertirse al Islam; algunos se convirtieron. Su gobernador de Jorasán, al-Jarrah ibn Abdallah al-Hakami, encarceló a Mukhallad ibn Yazid y a sus agentes, y envió a Abdallah ibn Ma'mar al-Yashkuri a lo profundo de territorio enemigo hasta que se acercó a China; los turcos lo rodearon hasta que fue liberado tras pagar un rescate y llegó a al-Shash. Umar levantó el kharaj a los conversos de Jorasán."
  fr: "Umar ibn Abd al-Aziz écrivit aux rois d'au-delà du Nil pour les appeler à l'islam; certains se convertirent. Son gouverneur du Khorasan, al-Jarrah ibn Abdallah al-Hakami, fit emprisonner Mukhallad ibn Yazid et ses agents, et envoya Absallah ibn Ma'mar al-Yashkuri au cœur des territoires ennemis jusqu'aux abords de la Chine; les Turcs l'encerclèrent jusqu'à ce qu'il soit libéré contre rançon et atteigne al-Shash. Umar leva le kharaj imposé aux convertis du Khorasan."
  ur: "عمر بن عبدالعزیز نے دریا کے پار کے بادشاہوں کو اسلام کی طرف بلانے کے لیے لکھا - کچھ نے مذہب تبدیل کیا۔ اس کے خراسان کے گورنر الجراح ابن عبداللہ الحکمی نے مخلد بن یزید اور یزید کے کارندوں کو جیل میں ڈال دیا، اور عبداللہ بن معمر الیشکوری کو دشمن کی سرزمینوں میں گہرائی تک بھیج دیا یہاں تک کہ وہ چین کے قریب پہنچ گیا۔ ترکوں نے اسے گھیر لیا یہاں تک کہ وہ آزاد ہو کر الشش پہنچ گیا۔ عمر نے خراسان کے مذہب بدلنے والوں سے خرج اٹھا لیا۔"
