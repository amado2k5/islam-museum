id: event/testament-of-anas-ibn-malik
class: event
kind: death
label:
  ar: وصية أنس بن مالك بشعرة النبي وبمن يغسله بالبصرة
  en: Testament of Anas ibn Malik at Basra about the Prophet's hair and his washing
  ur: بصرہ میں انس بن مالک کی وصیت، نبی کے بال اور غسل کے بارے میں
  es: "Testamento de Anas ibn Malik en Basora sobre el cabello del Profeta y su lavado."
  fr: "Testament d'Anas ibn Malik à Bassora concernant les cheveux du Prophète et son lavage"
summary:
  ar: "تذكر الإصابة عن ابن السكن من طريق صفوان بن هبيرة عن أبيه عن ثابت البناني أن أنس بن مالك قال له: هذه شعرة من شعر رسول الله فضعها تحت لساني، فوضعتها تحت لسانه، فدُفن وهي تحت لسانه {cite:isaba scan vol. 1 p. 277}. وتروي حلية الأولياء وصفة الصفوة والبداية والنهاية عن هشام أنه أوصى أن يغسله محمد بن سيرين، وكان محبوساً، فقال إنه محبوس، فقيل له إنهم استأذنوا الأمير فأذن، فقال إن الأمير لم يحبسه وإنما حبسه صاحب الحق، فأذن له صاحب الحق فخرج فغسله {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 2 p. 267} {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 629} {cite:al-bidaya-wal-nihaya scan vol. 5 p. 293}. وتقول الاستيعاب إنه مات في قصره بالطف على فرسخين من البصرة سنة إحدى وتسعين ودُفن هناك، وصلى عليه قطن بن مدرك الكلابي {cite:isti-ab-ibn-abd-al-barr scan vol. 4 p. 491}. ولم أقف في الصفحات المقروءة على خبر العصا الصغيرة التي يُقال إنها دُفنت معه."
  en: "Al-Isaba relates from Ibn al-Sakan, through Safwan ibn Hubayra from his father, from Thabit al-Bunani, that Anas ibn Malik said to him: this is a hair of the Messenger of God, put it under my tongue; he put it under his tongue and Anas was buried with it there {cite:isaba scan vol. 1 p. 277}. Hilyat al-Awliya, Sifat al-Safwa and al-Bidaya wal-Nihaya relay from Hisham that he charged that Muhammad ibn Sirin wash him; Ibn Sirin was in prison and said he was imprisoned, and was told the governor had been asked and had allowed it; he said the governor had not imprisoned him, the man with the right had, and when the man with the right allowed it he came out and washed him {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 2 p. 267} {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 629} {cite:al-bidaya-wal-nihaya scan vol. 5 p. 293}. Al-Isti'ab says he died in his palace at al-Tuff, two farsakhs from Basra, in 91 and was buried there, with Qatan ibn Mudrik al-Kilabi praying over him {cite:isti-ab-ibn-abd-al-barr scan vol. 4 p. 491}. I did not find in the pages read the report of a small staff said to have been buried with him."
  ur: "الاصابہ ابن سکن سے، صفوان بن ہبیرہ کے واسطے سے ان کے والد سے، ثابت بنانی سے نقل کرتی ہے کہ انس بن مالک نے ان سے کہا: یہ رسول اللہ کے بالوں میں سے ایک بال ہے، اسے میری زبان کے نیچے رکھ دو؛ انھوں نے اسے ان کی زبان کے نیچے رکھ دیا اور وہ اسی حال میں دفن ہوئے {cite:isaba scan vol. 1 p. 277}. حلیۃ الاولیاء، صفۃ الصفوہ اور البدایہ والنہایہ ہشام سے نقل کرتی ہیں کہ انھوں نے وصیت کی کہ محمد بن سیرین انھیں غسل دیں؛ ابن سیرین قید میں تھے اور بولے کہ میں قیدی ہوں، انھیں بتایا گیا کہ امیر سے اجازت لے لی گئی ہے، تو کہا کہ امیر نے مجھے قید نہیں کیا بلکہ صاحبِ حق نے کیا ہے، اور جب صاحبِ حق نے اجازت دی تو وہ نکلے اور انھیں غسل دیا {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 2 p. 267} {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 629} {cite:al-bidaya-wal-nihaya scan vol. 5 p. 293}. الاستیعاب کہتی ہے کہ وہ بصرہ سے دو فرسخ پر طف میں اپنے محل میں ۹۱ھ میں فوت ہوئے اور وہیں دفن ہوئے، اور قطن بن مدرک کلابی نے نماز پڑھائی {cite:isti-ab-ibn-abd-al-barr scan vol. 4 p. 491}. جو صفحات میں نے پڑھے ان میں اس چھوٹی چھڑی کی خبر نہیں ملی جس کے ان کے ساتھ دفن ہونے کا ذکر کیا جاتا ہے۔"
  es: "Al-Isaba relata de Ibn al-Sakan, a través de Safwan ibn Hubayra de su padre, de Thabit al-Bunani, que Anas ibn Malik le dijo: este es un cabello del Mensajero de Dios, ponlo debajo de mi lengua; lo puso debajo de su lengua y Anas fue enterrado con él allí {cite:isaba scan vol. 1 p. 277}. Hilyat al-Awliya, Sifat al-Safwa y al-Bidaya wal-Nihaya transmiten de Hisham que le ordenó a Muhammad ibn Sirin que lo lavara; Ibn Sirin estaba en prisión y dijo que estaba encarcelado, y le dijeron que se le había preguntado al gobernador y que lo había permitido; dijo que el gobernador no lo había encarcelado, sino el hombre con derecho, y cuando el hombre con derecho lo permitió salió y lo lavó {cite:hilyat-al-awliya-dar-al-kutub-al-ilmiyya-1988 scan vol. 2 p. 267} {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 629} {cite:al-bidaya-wal-nihaya scan vol. 5 p. 293}. Al-Isti'ab dice que murió en su palacio en al-Tuff, a dos farsakhs de Basora, en el año 91 y fue enterrado allí, con Qatan ibn Mudrik al-Kilabi orando por él {cite:isti-ab-ibn-abd-al-barr scan vol. 4 p. 491}. No encontré en las páginas leídas el informe de un pequeño personal que supuestamente fue enterrado con él."
  fr: "Al-Isaba rapporte d'après Ibn al-Sakan, par l'intermédiaire de Safwan ibn Hubayra, qui tenait cela de son père, d'après Thabit al-Bunani, qu'Anas ibn Malik lui dit: « Ceci est un cheveu du Messager de Dieu, mets-le sous ma langue. » Il le mit sous sa langue et Anas fut enterré avec ce cheveu. (Isaba, vol. 1, p. 277). Hilyat al-Awliya, Sifat al-Safwa et al-Bidaya wal-Nihaya rapportent d'après Hisham qu'il demanda à Muhammad ibn Sirin de le laver. Ibn Sirin était en prison et affirma qu'il était incarcéré. On lui dit que le gouverneur avait été consulté et avait donné son accord. Il répondit que ce n'était pas le gouverneur qui l'avait emprisonné, mais l'homme habilité, et que lorsque ce dernier l'eut autorisé, il sortit et le lava. (Hilyat al-Awliya dar al-Kutub al-Ilmiyya, vol. 2, p. 1988). 267} {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 629} {cite:al-bidaya-wal-nihaya scan vol. 5 p. 293}. Al-Isti'ab rapporte qu'il mourut dans son palais d'al-Tuff, à deux farsakhs de Bassora, en 91 et qu'il y fut enterré, Qatan ibn Mudrik al-Kilabi priant sur lui {cite:isti-ab-ibn-abd-al-barr scan vol. 4 p. 491}. Je n'ai pas trouvé dans les pages consultées le récit d'un petit bâton qui aurait été enterré avec lui."
