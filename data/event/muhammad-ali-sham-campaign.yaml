label: { ar: "حملة محمد علي على الشام", en: "Muhammad Ali's campaign on Syria", es: "La campaña de Muhammad Ali sobre Siria", fr: "La campagne de Muhammad Ali en Syrie", ur: "محمد علی کی شام پر مہم", tr: "Muhammed Ali'nin Levant'taki seferi", id: "Kampanye Muhammad Ali di Levant" }
summary:
  ar: "تذرع محمد علي باشا بإيواء عبد الله باشا والي عكا ستة آلاف من المصريين الفارين من التجنيد خلال سنة ١٨٣١م ورفضه إعادتهم، فدفع جيوشه بقيادة ابنه إبراهيم باشا إلى الشام رغم جواب الصدر الأعظم بأن نزاع الباشوات المتجاورين لا يسوَّى بإشهار السيف بل بتدخل الباب العالي. ويذكر الصلابي أن الموارنة دعموا جيش محمد علي ووقفوا معه وأن الفرنسيين أمَدّوهم بالسلاح، وأن إبراهيم باشا ألغى القيود المفروضة على النصارى واليهود في البلاد التي سيطر عليها وفتح الباب للبعثات التبشيرية، فعاد اليسوعيون ونُقلت مطبعة الإرسالية الأمريكية من مالطة إلى بيروت عام ١٨٣٤م. هزم إبراهيم الجيش العثماني واستكمل السيطرة على الشام، وعقب هزيمة العثمانيين في الأناضول اضطرت الدولة للاستنجاد بروسيا فعقدت معاهدة أنكيار إسكله سي سنة ١٨٣٣م في أعقاب هدنة كوتاهية، وهو ما دفع بريطانيا وفرنسا للتصدي لمحمد علي ففُرضت عليه اتفاقية لندن سنة ١٨٤٠م التي حددت الوجود المصري في الشام بحياة محمد علي {cite:dawlat-uthmaniyya-salabi p. 367-370}."
  en: "Muhammad Ali's Syrian war (1831–1840): Ibrahim Pasha conquered Syria on the pretext of Acre harbouring Egyptian draft-dodgers, beat the Ottoman army deep into Anatolia, forced the Porte into the Russian alliance of Hünkâr İskelesi (1833) — until the 1840 London convention confined Egyptian rule to Muhammad Ali's lifetime {cite:dawlat-uthmaniyya-salabi p. 367-370}."
  es: "La guerra de Muhammad Ali en Siria (1831-1840): Ibrahim Pasha conquistó Siria con el pretexto de que Acre albergaba a desertores egipcios, derrotó al ejército otomano en lo profundo de Anatolia, obligó a la Sublime Puerta a unirse a la alianza rusa de Hünkâr İskelesi (1833), hasta que la convención de Londres de 1840 limitó el dominio egipcio a la vida de Muhammad Ali {cite:dawlat-uthmaniyya-salabi p. 367-370}."
  fr: "La guerre syrienne de Muhammad Ali (1831-1840): Ibrahim Pacha conquit la Syrie sous prétexte qu'Acre abritait des réfractaires égyptiens à la conscription, battit l'armée ottomane profondément en Anatolie, força la Porte à rejoindre l'alliance russe de Hünkâr İskelesi (1833) — jusqu'à ce que la convention de Londres de 1840 limite la domination égyptienne à la durée de vie de Muhammad Ali {cite:dawlat-uthmaniyya-salabi p. 367-370}."
  ur: "محمد علی کی شام کی جنگ (1831-1840): ابراہیم پاشا نے ایکر کے بہانے شام کو فتح کیا جس میں مصری ڈرافٹ ڈوجرز کو پناہ دی گئی، عثمانی فوج کو اناطولیہ تک شکست دی، پورٹے کو روسی اتحاد ہنکار اسکلیسی (1833) میں شامل کرنے پر مجبور کیا - جب تک کہ محمد علی نے 1840 میں لندن کے مصری حکمرانوں کی زندگی کو ختم کر دیا۔ {حوالہ:دولت عثمانیہ سلبی ص۔ 367-370}۔"
  tr: "Muhammed Ali Paşa, Akka Valisi Abdullah Paşa'nın 1831'de askerlikten kaçan altı bin Mısırlıyı barındırdığı ve onları geri vermeyi reddettiği bahanesini kullanarak, oğlu İbrahim Paşa önderliğindeki ordularını Suriye'ye gönderdi. Bu, Sadrazam'ın komşu paşalar arasındaki anlaşmazlıkların güçle değil, ancak Osmanlı Devleti'nin müdahalesiyle çözülebileceği yönündeki cevabına rağmen gerçekleşti. El-Sallabi, Maronitlerin Muhammed Ali'nin ordusunu desteklediğini ve onun yanında yer aldığını, Fransızların onlara silah sağladığını ve İbrahim Paşa'nın kontrol ettiği topraklardaki Hristiyanlar ve Yahudiler üzerindeki kısıtlamaları kaldırdığını ve misyonerlik çalışmalarına kapı açtığını belirtiyor. Sonuç olarak, Cizvitler geri döndü ve Amerikan Misyonu'nun matbaası 1834'te Malta'dan Beyrut'a taşındı. İbrahim, Osmanlı ordusunu yenerek Levant üzerindeki kontrolünü tamamladı. Osmanlıların Anadolu'da yenilgisinin ardından devlet Rusya'dan yardım istemek zorunda kaldı ve bu nedenle Kütahya Ateşkesi'nin ardından 1833 yılında Ankara İskelesi Antlaşması imzalandı. Bu durum İngiltere ve Fransa'yı Muhammed Ali'ye karşı kışkırttı ve bu nedenle 1840 yılında Londra Antlaşması imzalandı; bu antlaşma, Mısır'ın Levant'taki varlığını Muhammed Ali'nin ömrüyle sınırladı. {cite:dawlat-uthmaniyya-salabi s. 367-370}"
  id: "Muhammad Ali Pasha menggunakan dalih Abdullah Pasha, gubernur Acre, yang melindungi enam ribu orang Mesir yang melarikan diri dari wajib militer pada tahun 1831 dan menolak untuk mengembalikan mereka, untuk mengirim pasukannya, yang dipimpin oleh putranya Ibrahim Pasha, ke Suriah. Hal ini dilakukan meskipun ada tanggapan dari Wazir Agung bahwa perselisihan antara pasha-pasha tetangga tidak dapat diselesaikan dengan kekerasan tetapi hanya melalui intervensi Sublime Porte (Kerajaan Ottoman). Al-Sallabi mencatat bahwa kaum Maronit mendukung pasukan Muhammad Ali dan berpihak kepadanya, bahwa Prancis memasok mereka dengan senjata, dan bahwa Ibrahim Pasha mencabut pembatasan terhadap orang Kristen dan Yahudi di wilayah yang dikuasainya dan membuka pintu bagi pekerjaan misionaris. Akibatnya, para Yesuit kembali, dan mesin cetak Misi Amerika dipindahkan dari Malta ke Beirut pada tahun 1834. Ibrahim mengalahkan tentara Ottoman dan menyelesaikan penguasaan atas Levant. Setelah kekalahan Ottoman di Anatolia, negara tersebut terpaksa meminta bantuan dari Rusia, sehingga Perjanjian Ankara İskelesi disimpulkan pada tahun 1833 M, menyusul Gencatan Senjata Kütahya. Hal ini mendorong Inggris dan Prancis untuk menghadapi Muhammad Ali, sehingga Perjanjian London diberlakukan kepadanya pada tahun 1840 M, yang membatasi kehadiran Mesir di Levant hanya sampai nyawa Muhammad Ali. {cite:dawlat-uthmaniyya-salabi hlm. 367-370}."
