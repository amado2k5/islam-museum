label: { ar: "حملة محمد علي على الشام" }
summary:
  ar: "تذرع محمد علي باشا بإيواء عبد الله باشا والي عكا ستة آلاف من المصريين الفارين من التجنيد خلال سنة ١٨٣١م ورفضه إعادتهم، فدفع جيوشه بقيادة ابنه إبراهيم باشا إلى الشام رغم جواب الصدر الأعظم بأن نزاع الباشوات المتجاورين لا يسوَّى بإشهار السيف بل بتدخل الباب العالي. ويذكر الصلابي أن الموارنة دعموا جيش محمد علي ووقفوا معه وأن الفرنسيين أمَدّوهم بالسلاح، وأن إبراهيم باشا ألغى القيود المفروضة على النصارى واليهود في البلاد التي سيطر عليها وفتح الباب للبعثات التبشيرية، فعاد اليسوعيون ونُقلت مطبعة الإرسالية الأمريكية من مالطة إلى بيروت عام ١٨٣٤م. هزم إبراهيم الجيش العثماني واستكمل السيطرة على الشام، وعقب هزيمة العثمانيين في الأناضول اضطرت الدولة للاستنجاد بروسيا فعقدت معاهدة أنكيار إسكله سي سنة ١٨٣٣م في أعقاب هدنة كوتاهية، وهو ما دفع بريطانيا وفرنسا للتصدي لمحمد علي ففُرضت عليه اتفاقية لندن سنة ١٨٤٠م التي حددت الوجود المصري في الشام بحياة محمد علي {cite:dawlat-uthmaniyya-salabi p. 367-370}."
  en: "Muhammad Ali's Syrian war (1831–1840): Ibrahim Pasha conquered Syria on the pretext of Acre harbouring Egyptian draft-dodgers, beat the Ottoman army deep into Anatolia, forced the Porte into the Russian alliance of Hünkâr İskelesi (1833) — until the 1840 London convention confined Egyptian rule to Muhammad Ali's lifetime {cite:dawlat-uthmaniyya-salabi p. 367-370}."
