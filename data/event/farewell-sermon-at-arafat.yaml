label: { en: "The Farewell Sermon at Arafat", ar: "خطبة عرفة الجامعة" }
summary:
  en: "On the Day of Arafa, 9 Dhu al-Hijja 10 AH, the Prophet stood at the foot of the valley before more than a hundred thousand pilgrims and delivered the comprehensive sermon: sanctity of blood and property, abolition of pagan blood-feuds and usury beginning with his own house, counsel on women, the pledge of the Book of God, and the testimony 'have I conveyed?' ومنها عند البخاري قوله «إن الزمان قد استدار كهيئته يوم خلق الله السماوات والأرض، السنة اثنا عشر شهراً منها أربعة حرم: ثلاث متواليات ذو القعدة وذو الحجة والمحرم، ورجب مضر الذي بين جمادى وشعبان» {cite:sahih-al-bukhari 4662}."
  ar: "وقف النبي يوم عرفة 9 ذي الحجة سنة 10هـ بطن الوادي في أكثر من مائة ألف وخطب الخطبة الجامعة: تحريم الدماء والأموال، ووضع دماء الجاهلية ورباها بدءاً بأهل بيته، والوصية بالنساء، والعهد بكتاب الله، ثم أخذ شهادة الناس على التبليغ."
