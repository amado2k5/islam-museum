label: { en: "The Farewell Sermon at Arafat", ar: "خطبة عرفة الجامعة", es: "El sermón de despedida en Arafat", fr: "Le sermon d'adieu à Arafat", ur: "عرفات میں الوداعی خطبہ", tr: "Arafat'ın vaazı", id: "Khutbah Arafat" }
summary:
  en: "On the Day of Arafa, 9 Dhu al-Hijja 10 AH, the Prophet stood at the foot of the valley before more than a hundred thousand pilgrims and delivered the comprehensive sermon: sanctity of blood and property, abolition of pagan blood-feuds and usury beginning with his own house, counsel on women, the pledge of the Book of God, and the testimony 'have I conveyed?' ومنها عند البخاري قوله «إن الزمان قد استدار كهيئته يوم خلق الله السماوات والأرض، السنة اثنا عشر شهراً منها أربعة حرم: ثلاث متواليات ذو القعدة وذو الحجة والمحرم، ورجب مضر الذي بين جمادى وشعبان» {cite:sahih-al-bukhari 4662}."
  ar: "وقف النبي يوم عرفة 9 ذي الحجة سنة 10هـ بطن الوادي في أكثر من مائة ألف وخطب الخطبة الجامعة: تحريم الدماء والأموال، ووضع دماء الجاهلية ورباها بدءاً بأهل بيته، والوصية بالنساء، والعهد بكتاب الله، ثم أخذ شهادة الناس على التبليغ."
  es: "El día de Arafah, 9 de Dhu al-Hijjah del año 10 de la Hégira, el Profeta se paró al pie del valle ante más de cien mil peregrinos y pronunció un sermón exhaustivo: la santidad de la sangre y la propiedad, la abolición de las venganzas paganas y la usura, comenzando por su propia casa, consejos sobre las mujeres, la promesa del Libro de Dios y el testimonio \"¿He transmitido?\". Entre ellos se encuentra lo que Al-Bujari dijo: \"El tiempo ha completado un ciclo, como el día en que Dios creó los cielos y la tierra. El año tiene doce meses, de los cuales cuatro son sagrados: tres meses consecutivos, Dhu al-Qa'dah, Dhu al-Hijjah y Muharram, y Rajab de Mudar, que está entre Jumada y Sha'ban\". {cita:sahih-al-bukhari 4662}."
  fr: "Le jour d'Arafat, le 9 Dhu al-Hijjah de l'an 10 de l'Hégire, le Prophète se tint au pied de la vallée devant plus de cent mille pèlerins et prononça un sermon complet: le caractère sacré du sang et des biens, l'abolition des vendettas païennes et de l'usure, à commencer par sa propre famille, des conseils sur les femmes, le serment du Livre de Dieu et le témoignage: « Ai-je transmis ? » Parmi ces enseignements, Al-Bukhari rapporte: « Le temps a bouclé son cycle, comme au jour où Dieu créa les cieux et la terre. L'année compte douze mois, dont quatre sont sacrés: trois mois consécutifs, Dhu al-Qa'dah, Dhu al-Hijjah et Muharram, et Rajab de Mudar, qui se situe entre Jumada et Sha'ban. » (Source: Sahih al-Bukhari 4662)."
  ur: "یوم عرفہ، 9 ذی الحجہ 10 ہجری کو، نبی نے وادی کے دامن میں ایک لاکھ سے زائد عازمین کے سامنے کھڑے ہو کر جامع خطبہ دیا: خون اور مال کی حرمت، کافروں کے خون خرابے اور سود کا خاتمہ اپنے گھر سے، عورتوں کی نصیحت، خدا کی کتاب اور گواہی۔ پہنچایا؟' ان میں سے وہ ہے جو بخاری نے کہا ہے: \"وقت پورے دائرے میں آگیا ہے جس دن خدا نے آسمانوں اور زمین کو پیدا کیا تھا۔ سال بارہ مہینے ہے، جن میں سے چار حرمت والے ہیں: مسلسل تین مہینے، ذی القعدہ، ذوالحجہ اور محرم، اور رجب المرجب، جو جمادۃ اور شعبان کے درمیان ہے۔\" {حوالہ: صحیح البخاری 4662}"
  tr: "Hicri 10 yılının Zilhicce ayının 9. günü Arafat günü, Peygamberimiz vadide yüz binden fazla insanla birlikte durarak kapsamlı bir hutbe verdi: Kan ve parayı yasakladı, İslam öncesi dönemin kan davalarını ve faizini kendi ailesinden başlayarak ortadan kaldırdı, kadınlar hakkında talimatlar verdi ve Allah'ın Kitabına (Kutsal Kitaba) biat etti. Ardından insanlardan mesaj hakkında şahitlik aldı."
  id: "Pada hari Arafah, tanggal 9 Dzul-Hijjah, tahun 10 Hijriah, Nabi berdiri di lembah bersama lebih dari seratus ribu orang dan menyampaikan khutbah yang komprehensif: melarang pertumpahan darah dan uang, menghapuskan permusuhan berdarah di era pra-Islam dan praktik riba, dimulai dari keluarganya sendiri, memberikan petunjuk mengenai wanita, dan berbaiat kepada Kitab Allah. Kemudian beliau meminta kesaksian orang-orang atas pesan tersebut."
