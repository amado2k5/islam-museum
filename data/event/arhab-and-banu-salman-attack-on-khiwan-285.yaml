id: event/arhab-and-banu-salman-attack-on-khiwan-285
class: event
kind: other
label:
  ar: هجوم أرحب بن الدعام وبني سلمان على خيوان ودفاع أبي القاسم محمد بن الهادي، 285هـ
  en: The attack of Arhab ibn al-Da'am and Banu Salman on Khiwan and the defence by Abu al-Qasim Muhammad ibn al-Hadi, 285 AH
  ur: ارحب بن دعام اور بنو سلمان کا خیوان پر حملہ اور ابو القاسم محمد بن ہادی کا دفاع، 285ھ
summary:
  ar: يروي الكتاب أن أرحب بن الدعام وبني سلمان من همدان أرادوا خيوان وفيها أبو القاسم محمد بن الهادي ومعه أخوه أحمد، فخرج أبو القاسم بأهل خيوان إلى طرف القرية وأرسل إلى أرحب رجلين يدعوانه ويخوفانه ثم عرض عليه المبارزة فلم يفعل، وحمل بأربعة فرسان، فانصرف المهاجمون دون أن يدخلوا القرية.
  en: The book tells that Arhab ibn al-Da'am and Banu Salman of Hamdan made for Khiwan, where Abu al-Qasim Muhammad ibn al-Hadi was with his brother Ahmad; Abu al-Qasim took the people of Khiwan out to the edge of the village, sent two men to call and warn Arhab, then offered him single combat, which Arhab did not take up, and he charged with four horsemen; the attackers withdrew without entering the village.
  ur: کتاب بتاتی ہے کہ ارحب بن دعام اور ہمدان کے بنو سلمان خیوان کی طرف بڑھے جہاں ابو القاسم محمد بن ہادی اپنے بھائی احمد کے ساتھ تھے؛ ابو القاسم اہل خیوان کو گاؤں کے کنارے لے گئے، ارحب کے پاس دو آدمی بھیجے جو اسے دعوت دیں اور ڈرائیں، پھر اسے انفرادی مقابلے کی دعوت دی جو اس نے قبول نہ کی، اور وہ چار سواروں کے ساتھ ٹوٹ پڑے؛ حملہ آور گاؤں میں داخل ہوئے بغیر لوٹ گئے۔
