label: { ar: "حصار بغداد في حرب الأمين والمأمون", en: "Siege of Baghdad in the war of al-Amin and al-Ma'mun", es: "El asedio de Bagdad en la guerra de al-Amin y al-Ma'mun.", fr: "Siège de Bagdad pendant la guerre d'al-Amin et d'al-Ma'mun", ur: "الامین اور المامون کی جنگ میں بغداد کا محاصرہ", tr: "Emin ve Memun Savaşı Sırasında Bağdat Kuşatması", id: "Pengepungan Bagdad pada Perang al-Amin dan al-Ma'mun" }
summary:
  ar: "دام حصار بغداد خمسة عشر شهراً ولحق غالب العباسيين وأركان الدولة بجند المأمون ولم يبق مع الأمين يقاتل عنه إلا غوغاء بغداد والحرافشة، وفسد الحال على الأمين جداً وتلف أمر العسكر ونفدت خزائنه وساءت حال الناس وعظم الشر وكثر الخراب والهدم من القتال ورمي المجانيق والنفط حتى درست محاسن بغداد وعملت فيها المراثي، حتى استهلت سنة ثمان وتسعين فدخل طاهر بن الحسين بغداد بالسيف قسراً فخرج الأمين بأمه وأهله من القصر إلى مدينة المنصور {cite:tarikh-khulafa-minhaj-1434 p. 475-476}. وعند المسعودي بعث الأمين إلى إبراهيم بن المهدي وهو محاصر فوجده في طارمة من عود وصندل مع سليمان بن أبي جعفر وأمامه قدح بلور فيه خمسة أرطال شراب، ودعا بجارية تسمى ضعفاً فغنته كليب لعمري كان أكثر ناصراً فتطير ثم غنت كأن لم يكن بين الحجون إلى الصفا أنيس فعثرت بالقدح فكسرته، وسمعوا قائلاً يقول قضي الأمر الذي فيه تستفتيان ومنشداً ينشد لا تعجبن من العجب، فما قعدوا معه بعدها إلى أن قتل {cite:muruj-al-dhahab p. 377-378}، وكتب الأمين إلى طاهر أعطني الأمان على نفسي وولدي وأمي وجدتي فقال لا والذي نفسي بيده حتى يضع يده في يدي وينزل على حكمي، وفرق الأمين في قواده المحدثين خمسمائة ألف درهم وقارورة غالية دون قدمائه فشغبوا عليه يوم الأربعاء لست خلون من ذي الحجة سنة ست وتسعين وأنشدوا قل لأمين الناس في نفسه ما شتت الجند سوى الغالية، وقاتل الأخ أخاه والابن أباه هؤلاء محمدية وهؤلاء مأمونية حتى خربت الديار وعفت الآثار وغلت الأسعار ورثاها الأعمى علي بن أبي طالب {cite:muruj-al-dhahab p. 383-386}"
  en: "The siege of Baghdad lasted fifteen months; most Abbasids and the pillars of the state joined al-Ma'mun's army until none fought for al-Amin but Baghdad's rabble and harafish. His affairs rotted, the army collapsed, the treasuries ran dry, the people suffered, and ruin multiplied from the fighting and the mangonels and naphtha until Baghdad's beauties were effaced and laments composed over it. As year 198 opened Tahir ibn al-Husayn entered Baghdad by the sword, and al-Amin fled with his mother and household from the palace to Madinat al-Mansur {cite:tarikh-khulafa-minhaj-1434 p. 475-476}."
  es: "El asedio de Bagdad duró quince meses; la mayoría de los abasíes y los pilares del estado se unieron al ejército de al-Ma'mun hasta que nadie luchó por al-Amin salvo la chusma y los harafish de Bagdad. Sus asuntos se pudrieron, el ejército se derrumbó, las arcas se vaciaron, el pueblo sufrió y la ruina se multiplicó a causa de los combates, los mangoneles y la nafta, hasta que la belleza de Bagdad se desvaneció y se compusieron lamentos sobre ella. Al comenzar el año 198, Tahir ibn al-Husayn entró en Bagdad a espada, y al-Amin huyó con su madre y su familia del palacio a Madinat al-Mansur {cite:tarikh-khulafa-minhaj-1434 p. 475-476}."
  fr: "Le siège de Bagdad dura quinze mois; la plupart des Abbassides et les piliers de l’État rejoignirent l’armée d’al-Ma’mun, jusqu’à ce que seuls la populace et les harengs de Bagdad combattent pour al-Amin. Ses affaires périclitèrent, l’armée s’effondra, les trésors se vidèrent, le peuple souffrit et la ruine se multiplia sous le poids des combats, des mangonneaux et du naphte, jusqu’à ce que la splendeur de Bagdad disparaisse et que les lamentations s’élèvent sur elle. Au début de l’année 198, Tahir ibn al-Husayn entra dans Bagdad par l’épée, et al-Amin s’enfuit du palais avec sa mère et sa famille pour se réfugier à Madinat al-Mansur (voir: Tarikh-Khulafa-Minhaj-1434, p. 475-476)."
  ur: "بغداد کا محاصرہ پندرہ ماہ تک جاری رہا۔ زیادہ تر عباسی اور ریاست کے ستونوں نے المامون کی فوج میں شمولیت اختیار کی یہاں تک کہ کسی نے الامین کے لیے نہیں لڑا مگر بغداد کے ہڑبڑا اور حرافش سے۔ اس کے معاملات بگڑ گئے، فوج تباہ ہو گئی، خزانے خشک ہو گئے، لوگوں کو نقصان اٹھانا پڑا اور لڑائی اور مینگونیل اور نافتہ سے تباہی کئی گنا بڑھ گئی یہاں تک کہ بغداد کی رونقیں ختم ہو گئیں اور اس پر نوحہ خوانی کی گئی۔ سنہ 198 میں طاہر بن الحسین تلوار سے بغداد میں داخل ہوا اور الامین اپنی والدہ اور گھر والوں کے ساتھ محل سے مدینۃ المنصور کی طرف فرار ہو گیا۔ 475-476}۔"
  tr: "Bağdat kuşatması on beş ay sürdü ve Abbasilerin çoğu ile devletin önde gelenleri el-Ma'mun'un ordusuna katıldı. Sadece Bağdat'ın ayak takımı ve Harfaş, el-Amin için savaşmak üzere onunla kaldı. El-Amin için durum büyük ölçüde kötüleşti, ordunun işleri mahvoldu, hazineleri tükendi, halkın durumu kötüleşti, kötülük arttı ve savaş, mancınık atışı ve neft yağı yüzünden yıkım ve tahribat arttı, ta ki Bağdat'ın güzellikleri yok olana ve onun için ağıtlar bestelenene kadar. Sonra 98. yıl başladı ve Tahir ibn el-Hüseyin kılıçla zorla Bağdat'a girdi. El-Amin, annesi ve ailesiyle birlikte saraydan el-Mansur şehrine gitti. {cite:tarikh-khulafa-minhaj-1434 s. 475-476} Mesudi'de, el-Amin kuşatma altındayken İbrahim bin el-Mehdi'ye haber gönderdi ve onu tahta ve sandal ağacından yapılmış bir revakta, Süleyman bin Ebu Cafer ile birlikte buldu. Önünde beş kilo şarap içeren kristal bir kadeh vardı. İbrahim, Da'fah adında bir cariye çağırdı ve cariye ona, \"Kulayb, hayatım üzerine yemin ederim ki, daha destekleyiciydi, bu yüzden kuş oldu\" diye şarkı söyledi. Sonra da, \"Sanki Hac ve Safa arasında hiçbir arkadaş yokmuş gibi\" diye şarkı söyledi. Cariye kadehe takılıp düştü ve kadehi kırdı. Orada, \"İkinizin de hüküm aradığı mesele karara bağlandı\" diyen bir ses duyuldu ve bir okuyucu, \"Bu mucizeye şaşırmayın\" diye okudu. Bundan sonra, İbrahim öldürülene kadar onunla birlikte oturmadılar. (377-378) El-Amin, Tahir'e şöyle yazdı: \"Bana, oğluma, anneme ve büyükanneme güvenlik ver.\" O, “Hayır, canım elinde olan Allah’a yemin ederim ki, elini elime koyup benim yönetimime boyun eğene kadar” diye cevap verdi. El-Amin, kıdemli komutanları hariç, yeni atadığı komutanlarına beş yüz bin dirhem ve bir şişe kıymetli yağ dağıttı. Onlar, 96 yılının Zilhicce ayının altıncı Çarşamba günü ona karşı isyan ettiler ve şu duayı okudular: “İnsanların güvenilir olanına söyle, orduyu dağıtan kıymetli yağdan başka ne oldu? Kardeş kardeşle, oğul babayla savaştı. Bunlar Müslümanlar, bunlar da Ma’munanlar; evler yıkıldı, anıtlar yok edildi, fiyatlar fırladı. Kör Ali ibn Abi Talib bile buna ağıt yaktı.” {kaynak: Muruj-al-dhahab s. 383-386}"
  id: "Pengepungan Baghdad berlangsung selama lima belas bulan, dan sebagian besar Abbasiyah dan pilar-pilar negara bergabung dengan pasukan al-Ma'mun. Hanya rakyat jelata Baghdad dan kaum Harfash yang tetap bersama al-Amin untuk berperang demi dirinya. Situasi memburuk drastis bagi al-Amin, urusan pasukan hancur, perbendaharaan menipis, kondisi rakyat memburuk, kejahatan meningkat, dan kehancuran serta kerusakan meningkat akibat pertempuran, pelemparan ketapel, dan nafta, hingga keindahan Baghdad lenyap dan elegi digubah untuknya. Kemudian tahun sembilan puluh delapan dimulai, dan Tahir ibn al-Husayn memasuki Baghdad dengan paksa menggunakan pedang. Al-Amin meninggalkan istana bersama ibunya dan keluarganya ke kota al-Mansur. {cite:tarikh-khulafa-minhaj-1434 p. 475-476}. Dan di Al-Mas’udi, Al-Amin mengirim utusan kepada Ibrahim bin Al-Mahdi ketika ia sedang dikepung dan mendapatinya di serambi kayu dan cendana bersama Sulayman bin Abi Ja’far dan di hadapannya terdapat sebuah piala kristal berisi lima pon anggur, dan ia memanggil seorang budak perempuan bernama Da’fah dan ia bernyanyi kepadanya, “Kulayb, demi hidupku, lebih mendukung, sehingga ia menjadi burung,” lalu ia bernyanyi, “Seolah-olah tidak ada teman antara Al-Hajun dan As-Safa,” dan ia tersandung piala itu dan memecahkannya, dan mereka mendengar suara berkata, “Masalah yang kalian berdua mintakan keputusannya telah diputuskan,” dan seorang pembaca melantunkan, “Jangan heran dengan keajaiban itu,” dan mereka tidak duduk bersamanya setelah itu sampai ia terbunuh. 377-378}, dan Al-Amin menulis kepada Tahir, “Berikanlah keselamatan untuk diriku, anakku, ibuku, dan nenekku.” Ia menjawab, “Tidak, demi Dia yang jiwaku berada di tangan-Nya, sampai ia meletakkan tangannya di tanganku dan tunduk pada kekuasaanku.” Al-Amin membagikan lima ratus ribu dirham dan sebotol minyak wangi kepada para komandan yang baru diangkatnya, kecuali para komandan seniornya. Mereka memberontak terhadapnya pada hari Rabu, tanggal enam Dzul Hijjah tahun sembilan puluh enam, dan membacakan: “Katakanlah kepada orang yang dapat dipercaya di antara manusia, apa yang menyebabkan pasukan tercerai-berai selain minyak wangi? Saudara berperang melawan saudara, dan anak berperang melawan ayah. Ini adalah kaum Muslim, dan ini adalah kaum Mu'mun, sampai rumah-rumah hancur, monumen-monumen dilenyapkan, dan harga-harga melambung. Ali bin Abi Talib yang buta meratapinya.” {cite:muruj-al-dhahab hlm. 383-386}"
