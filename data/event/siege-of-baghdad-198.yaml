id: event/siege-of-baghdad-198
class: event
kind: siege
label: { ar: "حصار بغداد في حرب الأمين والمأمون" }
summary:
  ar: "دام حصار بغداد خمسة عشر شهراً ولحق غالب العباسيين وأركان الدولة بجند المأمون ولم يبق مع الأمين يقاتل عنه إلا غوغاء بغداد والحرافشة، وفسد الحال على الأمين جداً وتلف أمر العسكر ونفدت خزائنه وساءت حال الناس وعظم الشر وكثر الخراب والهدم من القتال ورمي المجانيق والنفط حتى درست محاسن بغداد وعملت فيها المراثي، حتى استهلت سنة ثمان وتسعين فدخل طاهر بن الحسين بغداد بالسيف قسراً فخرج الأمين بأمه وأهله من القصر إلى مدينة المنصور {cite:tarikh-khulafa-minhaj-1434 p. 475-476}.، وعند المسعودي بعث الأمين إلى إبراهيم بن المهدي وهو محاصر فوجده في طارمة من عود وصندل مع سليمان بن أبي جعفر وأمامه قدح بلور فيه خمسة أرطال شراب، ودعا بجارية تسمى ضعفاً فغنته كليب لعمري كان أكثر ناصراً فتطير ثم غنت كأن لم يكن بين الحجون إلى الصفا أنيس فعثرت بالقدح فكسرته، وسمعوا قائلاً يقول قضي الأمر الذي فيه تستفتيان ومنشداً ينشد لا تعجبن من العجب، فما قعدوا معه بعدها إلى أن قتل {cite:muruj-al-dhahab p. 377-378}، وكتب الأمين إلى طاهر أعطني الأمان على نفسي وولدي وأمي وجدتي فقال لا والذي نفسي بيده حتى يضع يده في يدي وينزل على حكمي، وفرق الأمين في قواده المحدثين خمسمائة ألف درهم وقارورة غالية دون قدمائه فشغبوا عليه يوم الأربعاء لست خلون من ذي الحجة سنة ست وتسعين وأنشدوا قل لأمين الناس في نفسه ما شتت الجند سوى الغالية، وقاتل الأخ أخاه والابن أباه هؤلاء محمدية وهؤلاء مأمونية حتى خربت الديار وعفت الآثار وغلت الأسعار ورثاها الأعمى علي بن أبي طالب {cite:muruj-al-dhahab p. 383-386}"
  en: "The siege of Baghdad lasted fifteen months; most Abbasids and the pillars of the state joined al-Ma'mun's army until none fought for al-Amin but Baghdad's rabble and harafish. His affairs rotted, the army collapsed, the treasuries ran dry, the people suffered, and ruin multiplied from the fighting and the mangonels and naphtha until Baghdad's beauties were effaced and laments composed over it. As year 198 opened Tahir ibn al-Husayn entered Baghdad by the sword, and al-Amin fled with his mother and household from the palace to Madinat al-Mansur {cite:tarikh-khulafa-minhaj-1434 p. 475-476}."
