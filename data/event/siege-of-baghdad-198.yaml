label: { ar: "حصار بغداد في حرب الأمين والمأمون" }
summary:
  ar: "دام حصار بغداد خمسة عشر شهراً ولحق غالب العباسيين وأركان الدولة بجند المأمون ولم يبق مع الأمين يقاتل عنه إلا غوغاء بغداد والحرافشة، وفسد الحال على الأمين جداً وتلف أمر العسكر ونفدت خزائنه وساءت حال الناس وعظم الشر وكثر الخراب والهدم من القتال ورمي المجانيق والنفط حتى درست محاسن بغداد وعملت فيها المراثي، حتى استهلت سنة ثمان وتسعين فدخل طاهر بن الحسين بغداد بالسيف قسراً فخرج الأمين بأمه وأهله من القصر إلى مدينة المنصور {cite:tarikh-khulafa-minhaj-1434 p. 475-476}."
  en: "The siege of Baghdad lasted fifteen months; most Abbasids and the pillars of the state joined al-Ma'mun's army until none fought for al-Amin but Baghdad's rabble and harafish. His affairs rotted, the army collapsed, the treasuries ran dry, the people suffered, and ruin multiplied from the fighting and the mangonels and naphtha until Baghdad's beauties were effaced and laments composed over it. As year 198 opened Tahir ibn al-Husayn entered Baghdad by the sword, and al-Amin fled with his mother and household from the palace to Madinat al-Mansur {cite:tarikh-khulafa-minhaj-1434 p. 475-476}."
