  ur: "1826-27 میں ایکروپولیس کے محاصرے کے لیے ڈرافٹ کارڈ، یونانی جنگ آزادی میں رشید پاشا کا ایتھنز پر قبضہ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1826-1827 yıllarında gerçekleşen Akropolis kuşatmasının ön haritası; Raşid Paşa, Yunan Bağımsızlık Savaşı sırasında Atina'yı ele geçirmiştir; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Peta pendahuluan pengepungan Akropolis pada tahun 1826–1827 M, Rashid Pasha merebut Athena dalam Perang Kemerdekaan Yunani; sumber-sumber di halaman ini belum ditinjau."
