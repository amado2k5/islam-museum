id: event/raghib-circle-ibn-abbad-385
class: event
kind: gathering
label:
  ar: "الراغب الأصفهاني في فضاء مجلس الصاحب بن عباد، نحو ٣٨٥هـ"
  en: "al-Raghib al-Isfahani in the orbit of al-Sahib Ibn Abbad's circle, about 385"
  ur: "راغب اصفہانی، صاحب بن عباد کے مجلس کے فضا میں، تقریباً 385ھ"
summary:
  ar: "يُلمّع الراغب الأصفهاني في منتخباته الأدبية إلى معاصرين يمكن التعرف عليهم من أصحاب مجلس الوزير البويهي الصاحب بن عباد (ت ٣٨٥هـ/٩٩٥م)، فيظهر أنه عاش في زمن ذلك المجلس الأدبي الشهير بلا دليل على أنه فارق وطنه أصفهان {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390}."
  en: "In his literary anthologies al-Raghib al-Isfahani alludes several times to contemporaries who can be identified as members of the circle of the Buyid vizier al-Sahib Ibn Abbad (d. 385/995), showing that he flourished in the age of that famous literary salon — with no sound evidence that he ever left his native Isfahan {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390}."
  ur: "راغب اصفہانی اپنے ادبی مجموعوں میں بار بار ہمعصر افراد کا ذکر کرتے ہیں جن کی شناخت بويہی وزیر صاحب بن عباد (وفات 385ھ/995ء) کے مجلس کے اہل کے طور پر ہوتی ہے، جس سے معلوم ہوتا ہے کہ وہ اس مشہور ادبی محفل کے زمانے میں جیتے تھے — اگرچہ کوئی مستند شہادت نہیں کہ وہ اپنے وطن اصفہان سے کبھی نکلے {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390}۔"
