summary:
  ar: "ورد الخبر سنة 345هـ أن الروم أوغلوا بأهل طرسوس في البحر وقتلوا منهم ألفاً وثمانمائة رجل وأحرقوا القرى التي حولها وسبوا أهلها {cite:muntazam-ibn-al-jawzi p. 672}."
  en: "In 345 the Romans struck Tarsus from the sea, killing eighteen hundred men, burning the surrounding villages and carrying off their people {cite:muntazam-ibn-al-jawzi p. 672}."
  es: "En 345 los romanos atacaron Tarso desde el mar, matando a mil ochocientos hombres, quemando las aldeas circundantes y llevándose a su gente {cite:muntazam-ibn-al-jawzi p. 672}."
  fr: "En 345, les Romains frappèrent Tarse depuis la mer, tuant mille huit cents hommes, brûlant les villages environnants et emmenant leurs habitants {cite:muntazam-ibn-al-jawzi p. 672}."
  ur: "345 میں رومیوں نے ترسس کو سمندر سے مارا، اٹھارہ سو آدمیوں کو قتل کر دیا، آس پاس کے دیہاتوں کو جلا دیا اور ان کے لوگوں کو لے گئے۔ 672}۔"
  tr: "Hicri 345 yılında Romalıların Tarsus halkını denizin derinliklerine götürdüğü, bin sekiz yüz adamını öldürdüğü, çevredeki köyleri yaktığı ve halkını esir aldığı haberi geldi. {cite:muntazam-ibn-al-jawzi s. 672}"
  id: "Kabar datang pada tahun 345 Hijriah bahwa bangsa Romawi telah membawa penduduk Tarsus jauh ke tengah laut dan membunuh seribu delapan ratus orang dari mereka, serta membakar desa-desa di sekitarnya dan menawan penduduknya {cite:muntazam-ibn-al-jawzi p. 672}."
