id: event/abu-al-atahiya-promises-horse-and-sends-his-brother-jarrah-285
class: event
kind: other
label:
  ar: أبو العتاهية والي صنعاء يعد الهادي بالخيل ثم يرسل أخاه جراحاً في خمسين فارساً، آخر ذي الحجة 285هـ إلى المحرم 286هـ
  en: Abu al-Atahiya, governor of Sanaa, promises al-Hadi horse and then sends his brother Jarrah with fifty horsemen, end of Dhu al-Hijja 285 to Muharram 286 AH
  fr: "Abu al-Atahiya, gouverneur de Sanaa, promet des chevaux à al-Hadi puis lui envoie son frère Jarrah avec cinquante cavaliers, fin de dhu al-hijja 285 à muharram 286 de l’hégire"
  ur: صنعاء کے والی ابو العتاہیہ کا ہادی کو گھوڑوں کا وعدہ اور پھر اپنے بھائی جراح کو پچاس سواروں سمیت بھیجنا، آخر ذوالحجہ 285ھ سے محرم 286ھ
  es: "Abu al-Atahiya, gobernador de Sanaa, promete un caballo a al-Hadi y luego envía a su hermano Jarrah con cincuenta jinetes, entre finales de Dhu al-Hijja 285 y Muharram 286 AH."
  tr: "Sana'a valisi Ebu el-Atahiye, el-Hadi için atları hazırladıktan sonra, kardeşi Cerrah'ı elli süvariyle birlikte Hicri 285 yılının Zilhicce ayının sonundan Hicri 286 yılının Muharrem ayına kadar gönderdi."
  id: "Abu al-Atahiyah, gubernur Sana'a, menyiapkan kuda-kuda untuk al-Hadi, kemudian mengirim saudaranya Jarrah dengan lima puluh penunggang kuda, dari akhir Dzul Hijjah 285 H hingga Muharram 286 H."
summary:
  ar: يعرّف الكتاب بأبي العتاهية عبد الله بن بشر والي صنعاء ومخاليفها ووزيره محمد بن أبي عباد التميمي، وكانا قد كاتبا الهادي ورغبا في عدله وقالا بإمامته، ووعد أبو العتاهية بإمداده بخيل ورجال. وتحول الهادي في آخر ذي الحجة إلى موضع لبني صريم، وأرسل محمد بن سليمان إلى صنعاء يستنجز الخيل، وخرج إسماعيل بن المسلم كذلك وعاد ببعضهم، فلما رأى أبو العتاهية كراهية الجند لقصد الهادي بعث أخاه جراحاً مع خمسين فارساً فوصلوا لأيام بقيت من المحرم.
  en: The book introduces Abu al-Atahiya, Abd Allah ibn Bishr, governor of Sanaa and its districts, and his vizier Muhammad ibn Abi Abbad of Tamim, who had written to al-Hadi, wished for his justice and affirmed his imamate, and Abu al-Atahiya promised to supply him with horse and men. In the last days of Dhu al-Hijja al-Hadi moved to a place of Banu Sarim and sent Muhammad ibn Sulayman to Sanaa to press for the horse; Ismail ibn al-Muslim also went and came back with some of the troops; seeing the soldiers' dislike of going to al-Hadi, Abu al-Atahiya sent his brother Jarrah with fifty horsemen, who arrived in the last days of Muharram.
  fr: "Le livre présente Abu al-Atahiya, Abd Allah ibn Bishr, gouverneur de Sanaa et de ses districts, et son vizir Muhammad ibn Abi Abbad des Tamim, qui avaient écrit à al-Hadi, souhaité sa justice et affirmé son imamat ; Abu al-Atahiya lui promit des chevaux et des hommes. Dans les derniers jours de dhu al-hijja, al-Hadi gagna un lieu des Banu Sarim et envoya Muhammad ibn Sulayman à Sanaa pour réclamer les chevaux ; Ismail ibn al-Muslim s’y rendit également et revint avec une partie des troupes. Voyant la répugnance des soldats à rejoindre al-Hadi, Abu al-Atahiya envoya son frère Jarrah avec cinquante cavaliers, qui arrivèrent dans les derniers jours de muharram."
  ur: کتاب صنعاء اور اس کے مضافات کے والی ابو العتاہیہ عبد اللہ بن بشر اور ان کے وزیر تمیم کے محمد بن ابی عباد کا تعارف کراتی ہے، جو ہادی سے خط و کتابت کر چکے تھے، ان کے عدل کے خواہاں تھے اور ان کی امامت کے قائل، اور ابو العتاہیہ نے ان کی گھوڑوں اور آدمیوں سے مدد کا وعدہ کیا تھا۔ ذوالحجہ کے آخر میں ہادی بنو صریم کے ایک مقام پر منتقل ہوئے اور محمد بن سلیمان کو صنعاء بھیجا کہ گھوڑے وصول کریں؛ اسماعیل بن المسلم بھی گئے اور کچھ سپاہیوں کو لے کر لوٹے؛ ابو العتاہیہ نے سپاہیوں کی ہادی کی طرف جانے سے ناپسندیدگی دیکھی تو اپنے بھائی جراح کو پچاس سواروں کے ساتھ بھیجا جو محرم کے آخری دنوں میں پہنچے۔
  es: "El libro presenta a Abu al-Atahiya, Abd Allah ibn Bishr, gobernador de Sanaa y sus distritos, y a su visir Muhammad ibn Abi Abbad de Tamim, quien había escrito a al-Hadi, deseando justicia para él y afirmando su imamato, y Abu al-Atahiya prometió proporcionarle caballos y hombres. En los últimos días de Dhu al-Hijja, al-Hadi se trasladó a un lugar de Banu Sarim y envió a Muhammad ibn Sulayman a Sanaa para presionar por los caballos; Ismail ibn al-Muslim también fue y regresó con algunas tropas; al ver que los soldados no querían ir a ver a al-Hadi, Abu al-Atahiya envió a su hermano Jarrah con cincuenta jinetes, que llegaron en los últimos días de Muharram."
  tr: "Kitap, Sana'a ve çevresinin valisi Abdullah ibn Bişr ve veziri Muhammed ibn Ebu Abbad el-Tamimi'yi, Ebu el-Atahiye'yi tanıtıyor. Onlar, Hadi ile yazışarak adaletine duydukları özlemi dile getirmiş ve onu İmamları ilan etmişlerdi. Ebu el-Atahiye, ona at ve asker temin edeceğine söz vermişti. Zilhicce ayının sonunda Hadi, Beni Sarim kabilesine ait bir yere taşındı. Muhammed ibn Süleyman'ı Sana'a'ya at istemesi için gönderdi ve İsmail ibn el-Müslim de gidip bazı atlarla geri döndü. Ebu el-Atahiye, askerlerin Hadi'ye gitmekte isteksiz olduklarını görünce, kardeşi Cerrah'ı elli süvariyle gönderdi ve onlar Muharrem ayının bitiminden birkaç gün önce oraya vardılar."
  id: "Buku ini memperkenalkan Abu al-Atahiyah, Abdullah ibn Bishr, gubernur Sana'a dan distrik-distriknya, serta menterinya, Muhammad ibn Abi Abbad al-Tamimi. Mereka telah berkorespondensi dengan al-Hadi, menyatakan keinginan mereka akan keadilannya dan menyatakan dia sebagai Imam mereka. Abu al-Atahiyah berjanji untuk menyediakan kuda dan pasukan untuknya. Pada akhir Dzul Hijjah, al-Hadi pindah ke suatu lokasi milik suku Banu Sarim. Dia mengirim Muhammad ibn Sulayman ke Sana'a untuk meminta kuda, dan Ismail ibn al-Muslim juga pergi dan kembali dengan beberapa kuda. Ketika Abu al-Atahiyah melihat keengganan para prajurit untuk pergi menemui al-Hadi, dia mengirim saudaranya, Jarrah, dengan lima puluh penunggang kuda, yang tiba beberapa hari sebelum akhir Muharram."
