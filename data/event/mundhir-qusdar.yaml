label: { ar: "فتح قصدار على يد المنذر بن الجارود", en: "al-Mundhir ibn al-Jarud's Conquest of Qusdar", es: "La conquista de Qusdar por al-Mundhir ibn al-Jarud", fr: "La conquête de Qusdar par al-Mundhir ibn al-Jarud" }
summary:
  ar: "ولى زياد المنذر بن الجارود العبدي ويكنى أبا الأشعث ثغر الهند فغزا البوقان والقيقان فظفر المسلمون وغنموا وبث السرايا في بلادهم وفتح قصدار وسبى بها وكان سنان قد فتحها إلا أن أهلها انتقضوا وبها مات وقال قوم إن عبيد الله بن زياد ولى سنان بن سلمة وكان حري على سراياه وأهل البوقان اليوم مسلمون وقد بنى عمران بن موسى بن يحيى بن خالد البرمكي بها مدينة سماها البيضاء وذلك في خلافة المعتصم."
  en: "Ziyad gave Abu al-Ash'ath al-Mundhir ibn al-Jarud the frontier; he campaigned Buqan and Qiqan, spread his squadrons, took Qusdar and made captives — Sinan had first opened it before its breach and died there. Some say Ubaydallah ibn Ziyad appointed Sinan with Ibn Harri over his saraya. Buqan's folk are Muslims today, and Imran ibn Musa al-Barmaki built its city al-Bayda under al-Mu'tasim."
  es: "Ziyad le confió la frontera a Abu al-Ash'ath al-Mundhir ibn al-Jarud; este hizo campaña en Buqan y Qiqan, desplegó sus escuadrones, tomó Qusdar y capturó prisioneros. Sinan había sido el primero en abrir la frontera antes de que se rompiera y murió allí. Algunos dicen que Ubaydallah ibn Ziyad designó a Sinan junto con Ibn Harri para dirigir su guarida. Los habitantes de Buqan son musulmanes hoy en día, e Imran ibn Musa al-Barmaki construyó su ciudad, al-Bayda, bajo el mandato de al-Mu'tasim."
  fr: "Ziyad confia la frontière à Abu al-Ash'ath al-Mundhir ibn al-Jarud. Ce dernier mena campagne contre Buqan et Qiqan, déploya ses escadrons, prit Qusdar et fit des prisonniers. Sinan avait été le premier à ouvrir la brèche et y mourut. Certains affirment qu'Ubaydallah ibn Ziyad nomma Sinan, avec Ibn Harri, à la tête de sa saraya. Les habitants de Buqan sont aujourd'hui musulmans, et Imran ibn Musa al-Barmaki fonda sa ville, al-Bayda, sous le règne d'al-Mu'tasim."
