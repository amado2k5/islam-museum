label:
  ar: "رحلة أبي داود الواسعة: مصر والجزيرة وحران وحلب"
  en: "Abu Dawud's wider journey: Egypt, the Jazira, Harran and Aleppo"
  ur: "ابو داؤد کی وسیع مسافرت: مصر، جزیرہ، حران اور حلب"
summary:
  ar: "سمع أبو داود من خلق بالحجاز ومصر والشام والثغر وخراسان، ومن أبي جعفر النفيلي وطائفة بالجزيرة، ومن أبي توبة الربيع بن نافع بحلب، ومن أحمد بن أبي شعيب بحران، وحيوة ويزيد بن عبد ربه بحمص {cite:tarikh-islam-dhahabi p. 359}؛ وقال في سننه: شبّرت قثاءة بمصر ثلاثة عشر شبراً ورأيت أترجة على بعير قُطعت قطعتين {cite:tarikh-islam-dhahabi p. 362}. وتقع هذه الجولة في الثلاثينات الهجرية بعد رحلته الأولى، قبل استقراره بالبصرة."
  en: "Abu Dawud heard a great many teachers in the Hijaz, Egypt, al-Sham, the frontier and Khurasan; Abu Ja'far al-Nufayli and a circle in the Jazira; Abu Tawba al-Rabi' ibn Nafi' at Aleppo; Ahmad ibn Abi Shu'ayb at Harran; and Haywa and Yazid ibn 'Abd Rabbih at Homs {cite:tarikh-islam-dhahabi p. 359}. In his Sunan he recalls measuring a cucumber thirteen spans at Egypt and seeing a citron carried on a camel cut into two halves {cite:tarikh-islam-dhahabi p. 362}. This wider circuit falls in the 230s of the hijra, after his first journey and before he settled at Basra."
  ur: "ابو داؤد نے حجاز، مصر، شام، تھغر اور خراسان میں بہت سے مشائخ سے سماعت کی؛ جزیرہ میں ابو جعفر نفیلی اور ایک جماعت سے؛ حلب میں ابو توبہ ربیع بن نافع سے؛ حران میں احمد بن ابی شعیب سے؛ اور حمص میں ہیوہ اور یزید بن عبد ربہ سے {cite:tarikh-islam-dhahabi p. 359}۔ اپنی سنن میں وہ مصر میں تیرہ بند کھیرا ناپنا اور اونٹ پر لدے ترنج کے دو ٹکڑے کٹے دیکھنا یاد کرتے ہیں {cite:tarikh-islam-dhahabi p. 362}۔ یہ وسیع سفر پہلی مسافرت کے بعد اور بصرہ میں قیام سے پہلے، ہجرت کے تیسویں عشرے میں واقع ہوتا ہے۔"
