id: event/birth-muslim-nishapur-206
class: event
kind: birth
label:
  ar: "مولد الإمام مسلم بن الحجاج بنيسابور، نحو ٢٠٦هـ"
  en: "Birth of Imam Muslim ibn al-Hajjaj at Nishapur, c. 206/821"
  ur: "امام مسلم بن حجاج کی پیدائش نیشاپور میں، تقریباً 206ھ/821ء"
  fr: "La naissance de l'imam Muslim ibn al-Hajjaj à Nishapur, vers 206/821"
  es: "Nacimiento del Imam Muslim ibn al-Hajjaj en Nishapur, c. 206/821"
  tr: "İmam Müslim ibn el-Haccac'ın Hicri 206 yılı civarında Nişapur'da doğması."
  id: "Kelahiran Imam Muslim ibn al-Hajjaj di Nishapur, sekitar tahun 206 Hijriah."
summary:
  ar: "وُلد أبو الحسين مسلم بن الحجاج بن مسلم القشيري النيسابوري بنيسابور بعد المائتين، وقيل سنة اثنتين ومائتين، وقال ابن الصلاح إن ظنه أنه قال سنة أربع ومائتين {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-691}؛ ويحسب ابن خلكان أن مولده سنة ست ومائتين، لأنه مات سنة ٢٦١هـ وعمره خمس وخمسون سنة قمرياً {cite:wafayat-ayan v p. 195}."
  en: "Abu al-Husayn Muslim ibn al-Hajjaj ibn Muslim al-Qushayri al-Naysaburi was born at Nishapur after the year 200 — one report says 202/817, while Ibn al-Salah is thought to have given 204 {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-691}; Ibn Khallikan reckons his birth in 206/821 since he died in 261/875 aged fifty-five lunar years {cite:wafayat-ayan v p. 195}."
  ur: "ابو الحسین مسلم بن حجاج بن مسلم قشیری نیشاپوری 200ھ کے بعد نیشاپور میں پیدا ہوئے — ایک روایت 202ھ/817ء دیتا ہے، جبکہ ابن صلاح سے 204ھ منقول ہے {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-691}؛ ابن خلكان ان کی پیدائش 206ھ/821ء شمار کرتے ہیں کیونکہ وہ 261ھ/875ء میں پچپن قمری برس کی عمر میں فوت ہوئے {cite:wafayat-ayan v p. 195}۔"
  fr: "Abu al-Husayn Muslim ibn al-Hajjaj ibn Muslim al-Qushayri al-Naysaburi naquit à Nishapur après l'an 200 : un récit dit 202/817, tandis qu'Ibn al-Salah aurait donné 204 {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-691} ; Ibn Khallikan situe sa naissance en 206/821, puisqu'il mourut en 261/875 à cinquante-cinq années lunaires {cite:wafayat-ayan v p. 195}."
  es: "Abu al-Husayn Muslim ibn al-Hajjaj ibn Muslim al-Qushayri al-Naysaburi nació en Nishapur después del año 200; un informe dice 202/817, mientras que se cree que Ibn al-Salah dio 204 {cite:encyclopaedia-of-islam-2 vol. 7 p. 690-691}; Ibn Khallikan calcula su nacimiento en 206/821 ya que murió en 261/875 a la edad de cincuenta y cinco años lunares {cite:wafayat-ayan v p. 195}."
  tr: "Ebu el-Hüseyn Müslim ibn el-Haccac ibn Müslim el-Kuşeyri el-Neysaburi, Hicri 200 yılından sonra Neysabur'da doğmuştur ve Hicri 202 yılında doğduğu söylenmiştir. İbn el-Salah, onun Hicri 204 yılında doğduğunu düşündüğünü söylemiştir (kaynak: İslam Ansiklopedisi 2, cilt 7, s. 690-691). İbn Hallikan ise, Hicri 261 yılında elli beş yaşında vefat ettiği için Hicri 206 yılında doğduğunu düşünmüştür (kaynak: Vefayyat-ı Ayan, cilt 195)."
  id: "Abu al-Husayn Muslim ibn al-Hajjaj ibn Muslim al-Qushayri al-Naysaburi lahir di Naysabur setelah tahun 200 H, dan dikatakan lahir pada tahun 202 H. Ibn al-Salah mengatakan bahwa menurut pendapatnya, beliau lahir pada tahun 204 H {kutip: ensiklopedia-islam-2 jilid 7 hlm. 690-691}. Ibn Khallikan berpendapat bahwa beliau lahir pada tahun 206 H, karena beliau wafat pada tahun 261 H pada usia lima puluh lima tahun menurut kalender lunar {kutip: wafayat-ayan jilid hlm. 195}."
