kind: conquest
label: { ar: "فتح البهنسا ⁦(في رواية فتوح الشام)⁩", en: "The conquest of al-Bahnasa (as told in Futuh al-Sham)", ur: "البہنسا کی فتح ⁦(فتوح الشام کی روایت میں)⁩", es: "La conquista de al-Bahnasa (según se narra en Futuh al-Sham)", fr: "La conquête d'al-Bahnasa (telle que racontée dans Futuh al-Sham)", tr: "Bahnasa'nın fethi (Suriye'nin fethi anlatısında)", id: "Penaklukan Bahnasa (dalam narasi penaklukan Suriah)" }
summary:
  ar: "خبر طويل يختم به «فتوح الشام» المنسوب إلى الواقدي: بعد فتح مصر وأسفلها يكتب عمر إلى عمرو بن العاص ألّا يقربوا الصعيد حتى يفتحوا أهناس والبهنسا، ويُؤمَّر خالد بن الوليد على عشرة آلاف فارس، فيحاصرون البطريق البطليوس صاحب البهنسا، ثم يدخلونها ليلاً بسُلّم تسلقه أربعون رجلاً ففتحوا الباب؛ ويؤرخ الكتاب اجتماع الأمراء بمصر لذلك بيوم الأربعاء عاشر ربيع الأول سنة 21هـ، وقيل 22هـ {cite:futuh-al-sham-ilmiyya-1997-v2 p.206} {cite:futuh-al-sham-ilmiyya-1997-v2 p.207} {cite:futuh-al-sham-ilmiyya-1997-v2 p.283}. ويجعل في جبانتها خمسة آلاف من الصحابة {cite:futuh-al-sham-ilmiyya-1997-v2 p.290}."
  en: "A long account that closes the Futuh al-Sham ascribed to al-Waqidi: after the conquest of Egypt and the Delta, Umar writes to Amr ibn al-As not to approach Upper Egypt until Ahnas and al-Bahnasa are taken; Khalid ibn al-Walid is given command of ten thousand horsemen; they besiege the patrician al-Batlius, lord of al-Bahnasa, and enter by night when forty men climb a ladder and open the gate. The book dates the gathering of the commanders at Misr for the campaign to Wednesday 10 Rabi' I 21 AH, 'and it is said 22', and places five thousand Companions in its cemetery."
  es: "Un extenso relato que cierra el Futuh al-Sham atribuido a al-Waqidi: tras la conquista de Egipto y el Delta, Umar escribe a Amr ibn al-As que no se acerque al Alto Egipto hasta que Ahnas y al-Bahnasa sean tomadas; Khalid ibn al-Walid recibe el mando de diez mil jinetes; asedian al patricio al-Batlius, señor de al-Bahnasa, y entran de noche cuando cuarenta hombres suben por una escalera y abren la puerta. El libro fecha la reunión de los comandantes en Misr para la campaña el miércoles 10 de Rabi' I del año 21 de la Hégira, 'y se dice que el 22', y sitúa a cinco mil Compañeros en su cementerio."
  fr: "Un long récit clôt le Futuh al-Sham attribué à al-Waqidi: après la conquête de l’Égypte et du Delta, Umar écrit à Amr ibn al-As de ne pas approcher la Haute-Égypte avant la prise d’Ahnas et d’al-Bahnasa; Khalid ibn al-Walid reçoit le commandement de dix mille cavaliers; ils assiègent le patricien al-Batlius, seigneur d’al-Bahnasa, et pénètrent dans la ville de nuit, quarante hommes escaladant une échelle et ouvrant la porte. Le livre date le rassemblement des commandants à Misr pour la campagne du mercredi 10 Rabi' I 21 AH (ou 22 selon certaines sources) et mentionne la présence de cinq mille Compagnons dans son cimetière."
  ur: "الواقدی کی طرف منسوب فتوح الشام کو بند کرنے والا ایک طویل بیان: مصر اور ڈیلٹا کی فتح کے بعد، عمر نے عمرو بن العاص کو لکھا کہ جب تک احناس اور البھناسہ کو نہیں لیا جاتا، بالائی مصر کے قریب نہ جانا؛ خالد بن ولید کو دس ہزار سواروں کی کمان دی گئی ہے۔ انہوں نے بطلیوس کا محاصرہ کر لیا، جو البھناسہ کے مالک ہیں، اور رات کو داخل ہوتے ہیں جب چالیس آدمی ایک سیڑھی پر چڑھ کر دروازہ کھولتے ہیں۔ اس کتاب میں بدھ 10 ربیع الثانی 21 ہجری کو مہم کے لیے کمانڈروں کے مصر میں جمع ہونے کی تاریخ بیان کی گئی ہے اور یہ 22 ہجری کو کہا گیا ہے اور اس کے قبرستان میں پانچ ہزار صحابہ کو رکھا گیا ہے۔"
  tr: "El-Vakidi'ye atfedilen \"Suriye'nin Fethi\" adlı eser, uzun bir anlatımla sona eriyor: Mısır ve aşağı bölgelerinin fethinden sonra Ömer, Amr ibn el-Aas'a, İhnas ve el-Bahnasa'yı fethedene kadar Yukarı Mısır'a yaklaşmamalarını yazdı. Halid ibn el-Valid, on bin süvarinin komutanı olarak atandı ve el-Bahnasa'nın hükümdarı el-Batlyus Patriği'ni kuşattılar. Sonra kırk adamın tırmandığı bir merdivenle geceleyin içeri girdiler ve kapıyı açtılar. Kitap, bu amaçla Mısır'da prenslerin buluşmasını Hicri 21 yılının Rebiü'l-Evvel ayının onuncu günü Çarşamba gününe, ya da Hicri 22 yılına tarihlendiriyor. {cite:futuh-al-sham-ilmiyya-1997-v2 s.206} {cite:futuh-al-sham-ilmiyya-1997-v2 s.207} {cite:futuh-al-sham-ilmiyya-1997-v2 s.283}. Beş bin sahabeyi bu mezarlığa yerleştirir {cite:futuh-al-sham-ilmiyya-1997-v2 s.290}."
  id: "Sebuah catatan panjang menyimpulkan “Penaklukan Suriah” yang dikaitkan dengan al-Waqidi: Setelah penaklukan Mesir dan wilayah hilirnya, Umar menulis kepada Amr ibn al-Aas agar tidak mendekati Mesir Hulu sampai mereka menaklukkan Ihnas dan al-Bahnasa. Khalid ibn al-Walid diangkat sebagai komandan sepuluh ribu pasukan berkuda, dan mereka mengepung Patriark al-Batlyus, penguasa al-Bahnasa. Kemudian mereka memasukinya pada malam hari dengan tangga yang dinaiki oleh empat puluh orang, dan mereka membuka gerbangnya. Kitab tersebut mencatat pertemuan para pangeran di Mesir untuk tujuan ini pada hari Rabu, tanggal sepuluh Rabi’ al-Awwal, tahun 21 H, atau dikatakan tahun 22 H. {cite:futuh-al-sham-ilmiyya-1997-v2 hal.206} {cite:futuh-al-sham-ilmiyya-1997-v2 hal.207} {cite:futuh-al-sham-ilmiyya-1997-v2 hal.283}. Dia menempatkan lima ribu Sahabat di kuburannya {cite:futuh-al-sham-ilmiyya-1997-v2 hal.290}."
