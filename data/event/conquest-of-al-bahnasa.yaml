id: event/conquest-of-al-bahnasa
class: event
kind: conquest
label: { ar: "فتح البهنسا ⁦(في رواية فتوح الشام)⁩", en: "The conquest of al-Bahnasa (as told in Futuh al-Sham)", ur: "البہنسا کی فتح ⁦(فتوح الشام کی روایت میں)⁩" }
summary:
  ar: "خبر طويل يختم به «فتوح الشام» المنسوب إلى الواقدي: بعد فتح مصر وأسفلها يكتب عمر إلى عمرو بن العاص ألّا يقربوا الصعيد حتى يفتحوا أهناس والبهنسا، ويُؤمَّر خالد بن الوليد على عشرة آلاف فارس، فيحاصرون البطريق البطليوس صاحب البهنسا، ثم يدخلونها ليلاً بسُلّم تسلقه أربعون رجلاً ففتحوا الباب؛ ويؤرخ الكتاب اجتماع الأمراء بمصر لذلك بيوم الأربعاء عاشر ربيع الأول سنة 21هـ، وقيل 22هـ {cite:futuh-al-sham-ilmiyya-1997-v2 p.206} {cite:futuh-al-sham-ilmiyya-1997-v2 p.207} {cite:futuh-al-sham-ilmiyya-1997-v2 p.283}. ويجعل في جبانتها خمسة آلاف من الصحابة {cite:futuh-al-sham-ilmiyya-1997-v2 p.290}."
  en: "A long account that closes the Futuh al-Sham ascribed to al-Waqidi: after the conquest of Egypt and the Delta, Umar writes to Amr ibn al-As not to approach Upper Egypt until Ahnas and al-Bahnasa are taken; Khalid ibn al-Walid is given command of ten thousand horsemen; they besiege the patrician al-Batlius, lord of al-Bahnasa, and enter by night when forty men climb a ladder and open the gate. The book dates the gathering of the commanders at Misr for the campaign to Wednesday 10 Rabi' I 21 AH, 'and it is said 22', and places five thousand Companions in its cemetery."
