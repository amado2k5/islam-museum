summary:
  en: "Umayr ibn Wahb and Safwan ibn Umayya plotted at the Kaaba to assassinate the Prophet in Medina; when Umayr arrived, the Prophet disclosed their secret pact, leading Umayr to embrace Islam."
  ar: "تآمر عمير بن وهب وصفوان بن أمية في الحجر على اغتيال النبي بالمدينة بعد بدر؛ فلما قدم على النبي أخبره بسرهما الذي لم يعلمه أحد، فأسلم عمير ورجع إلى مكة داعياً إلى الإسلام."
