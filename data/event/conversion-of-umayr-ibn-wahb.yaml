id: event/conversion-of-umayr-ibn-wahb
class: event
kind: other
label: { en: "Conversion of Umayr ibn Wahb", ar: "إسلام عمير بن وهب", es: "Conversión de Umayr ibn Wahb", fr: "Conversion d'Umayr ibn Wahb", ur: "عمیر بن وہب کی تبدیلی" }
summary:
  en: "Umayr ibn Wahb and Safwan ibn Umayya plotted at the Kaaba to assassinate the Prophet in Medina; when Umayr arrived, the Prophet disclosed their secret pact, leading Umayr to embrace Islam."
  ar: "تآمر عمير بن وهب وصفوان بن أمية في الحجر على اغتيال النبي بالمدينة بعد بدر؛ فلما قدم على النبي أخبره بسرهما الذي لم يعلمه أحد، فأسلم عمير ورجع إلى مكة داعياً إلى الإسلام."
  es: "Umayr ibn Wahb y Safwan ibn Umayya conspiraron en la Kaaba para asesinar al Profeta en Medina; cuando Umayr llegó, el Profeta reveló su pacto secreto, lo que llevó a Umayr a abrazar el Islam."
  fr: "Umayr ibn Wahb et Safwan ibn Umayya complotèrent à la Kaaba pour assassiner le Prophète à Médine; lorsque Umayr arriva, le Prophète révéla leur pacte secret, ce qui amena Umayr à embrasser l'islam."
  ur: "عمیر بن وھب اور صفوان بن امیہ نے کعبہ میں نبی کو مدینہ میں قتل کرنے کی سازش کی۔ جب عمیر پہنچے تو نبی نے ان کے خفیہ معاہدے کا انکشاف کیا، جس سے عمیر نے اسلام قبول کیا۔"
