label: { ar: "كتاب حاطب بن أبي بلتعة إلى قريش", en: "Hatib ibn Abi Balta'a's letter to Quraysh", es: "Carta de Hatib ibn Abi Balta'a a los Quraysh", fr: "Lettre de Hatib ibn Abi Balta'a à Quraysh", ur: "حاطب بن ابی بلتعہ کا قریش کے نام خط", tr: "Hatib ibn Abi Balta'ah'ın Kureyş'e mektubu", id: "Surat Hatib bin Abi Balta'ah kepada kaum Quraisy" }
summary:
  ar: "قبل فتح مكة كتب حاطب بن أبي بلتعة إلى بعض المشركين بمكة يخبرهم ببعض أمر النبي، فأرسل النبي علياً والزبير والمقداد إلى روضة خاخ فأخذوا الكتاب من الظعينة، فلما سُئل حاطب اعتذر بأنه لم يكفر ولم يرتد، فصدّقه النبي وقال عمر: دعني أضرب عنقه، فمنعه النبي لشهوده بدراً."
  tr: "Mekke'nin fethinden önce Hatib bin Abi Balta'ah, Mekke'deki bazı müşriklere Peygamber'in bazı işlerini anlatan bir mektup yazmıştı. Bunun üzerine Peygamber, Ali, Zübeyr ve Mikdad'ı Ravdat Hakh'a gönderdi ve onlar mektubu kadından aldılar. Hatib sorgulandığında, inkâr etmediğini veya dinden dönmediğini söyleyerek özür diledi. Peygamber ona inandı ve Ömer, \"Boynunu vurayım\" dedi, ancak Peygamber, Bedir Savaşı'na şahit olduğu için onu engelledi."
  id: "Sebelum penaklukan Mekah, Hatib bin Abi Balta’ah menulis surat kepada beberapa kaum musyrik di Mekah untuk memberitahukan beberapa urusan Nabi. Maka Nabi mengutus Ali, Al-Zubayr, dan Al-Miqdad ke Rawdat Khakh dan mereka mengambil surat itu dari wanita tersebut. Ketika Hatib ditanyai, ia meminta maaf, mengatakan bahwa ia tidak kafir atau murtad. Nabi mempercayainya, dan Umar berkata: Biarlah aku memenggal lehernya, tetapi Nabi mencegahnya karena ia telah menyaksikan Perang Badar."
