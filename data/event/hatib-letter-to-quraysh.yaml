label: { en: "Hatib's letter to Quraysh", ar: "كتاب حاطب بن أبي بلتعة إلى قريش" }
summary:
  en: "When the Prophet resolved on the march to Mecca, Hatib ibn Abi Balta'a wrote to Quraysh warning them. News came down from heaven; Ali and al-Zubayr caught the woman carrying the letter at al-Khaliqa and drew it from her braided hair. The tradition holds that the Prophet accepted Hatib's plea and that the opening of Sura al-Mumtahana came down concerning it."
  ar: "لما أجمع النبي المسير إلى مكة كتب حاطب بن أبي بلتعة إلى قريش يخبرهم؛ فجاء الخبر من السماء، وأدرك علي والزبير الناقلة بالخليفة فأخرجا الكتاب من قرون رأسها. وفي الرواية أن النبي قبل عذر حاطب وأنزل في شأنه مطلع سورة الممتحنة."
