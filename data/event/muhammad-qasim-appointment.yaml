label: { ar: "تجهيز محمد بن القاسم إلى السند", en: "The Fitting-out of Muhammad ibn al-Qasim", es: "El equipamiento de Muhammad ibn al-Qasim", fr: "L'équipement de Muhammad ibn al-Qasim", ur: "محمد بن القاسم کی ترتیب", tr: "Muhammed ibn al-Qasim'i Sindh için hazırlamak", id: "Mempersiapkan Muhammad ibn al-Qasim untuk Sindh" }
summary:
  ar: "ولى الحجاج محمد بن القاسم بن محمد بن الحكم بن أبي عقيل في أيام الوليد بن عبد الملك فغزا السند وكان بفارس وقد أمره أن يسير إلى الري وعلى مقدمته أبو الأسود جهم بن زهر الجمحي فرده إليه وعقد له على ثغر السند وضم إليه ستة آلاف من جند أهل الشام وخلقاً من غيرهم وجهزه بكل ما احتاج إليه حتى الخيوط والمسال وأمره أن يقيم بشيراز حتى يتتم إليه أصحابه ويوافيه ما عد له وعمد الحجاج إلى القطن المحلوج فنقع في الخل الخمر الحاذق ثم جفف في الظل فقال إذا صرتم إلى السند فإن الخل بها ضيق فانقعوا هذا القطن في الماء ثم اطبخوا به واصطبغوا ويقال إن محمداً لما صار إلى الثغر كتب يشكو ضيق الخل عليهم فبعث إليه بالقطن المنقوع في الخل فسار محمد بن القاسم إلى مكران فأقام بها أياماً ثم أتى قنربور ففتحها ثم أتى أرمائيل ففتحها وكان محمد بن هارون بن ذرع قد لقيه فانضم إليه وسار معه فتوفي بالقرب منها فدفن بقنبل."
  en: "Al-Hajjaj gave Muhammad ibn al-Qasim the Sind frontier — recalled from a Rayy posting — with six thousand Syrian troops and outfitting down to threads and needles, ordered to muster at Shiraz; he even steeped carded cotton in wine-vinegar, dried in the shade, against Sind's vinegar-scarcity — 'soak it, cook with it, dye with it'. Muhammad marched through Makran, took Qanirbur and Arma'il — Muhammad ibn Harun joining him and dying near it, buried at Qanbal."
  es: "Al-Hajjaj le entregó a Muhammad ibn al-Qasim la frontera de Sind —retirado de un puesto en Rayy— con seis mil soldados sirios y equipamiento completo, con la orden de reunirse en Shiraz; incluso remojó algodón cardado en vinagre de vino, secándolo a la sombra, para paliar la escasez de vinagre en Sind: «remójalo, cocínalo, tiñelo». Muhammad marchó a través de Makrán, tomó Qanirbur y Arma'il; Muhammad ibn Harun se unió a él y murió cerca de allí, siendo enterrado en Qanbal."
  fr: "Al-Hajjaj confia à Muhammad ibn al-Qasim la frontière du Sind – qu'il rappela de son poste à Rayy – avec six mille soldats syriens et tout l'équipement nécessaire, jusqu'aux fils et aux aiguilles. Il leur ordonna de se rassembler à Shiraz. Il fit même tremper du coton cardé dans du vinaigre, qu'il fit sécher à l'ombre, en raison de la pénurie de vinaigre au Sind: « Faites-le tremper, cuisinez avec, teignez avec. » Muhammad traversa le Makran, prit Qanirbur et Arma'il. Muhammad ibn Harun le rejoignit et mourut non loin de là; il fut enterré à Qanbal."
  ur: "الحجاج نے محمد بن القاسم کو سندھ کا سرحدی علاقہ دیا - جسے رے پوسٹنگ سے واپس بلایا گیا - چھ ہزار شامی فوجیوں کے ساتھ اور دھاگوں اور سوئیوں کے ساتھ مل کر شیراز میں جمع ہونے کا حکم دیا۔ یہاں تک کہ اس نے سندھ کے سرکہ کی کمی کے خلاف، سائے میں خشک، شراب کے سرکے میں دھکی ہوئی روئی بھی ڈالی - 'اسے بھگو، اس سے پکاؤ، اس سے رنگو'۔ محمد نے مکران کی طرف کوچ کیا، قنبر اور ارمائل کو لے لیا - محمد بن ہارون اس کے ساتھ شامل ہوئے اور اس کے قریب ہی مر گئے، قنبل میں دفن ہوئے۔"
  tr: "Haccac, El-Valid bin Abdülmalik döneminde Muhammed bin El-Kâsım bin Muhammed bin El-Hakam bin Ebu Akil'i görevlendirdi. Sind'e saldırdı ve Fars'taydı. Ona Rayy'a yürümesini emretti ve öncü birliğinin komutanı Ebu el-Esved Cehm bin Zuhr el-Cumahi oldu. Onu geri gönderdi ve Sind sınırına atadı. Ona Suriye halkından altı bin asker ve diğer yerlerden de çok sayıda asker ekledi ve ona iplik ve iğne de dahil olmak üzere ihtiyacı olan her şeyi sağladı. Arkadaşları tamamlanana ve kendisi için hazırlananlar gelene kadar Şiraz'da kalmasını emretti. Haccac, çırçırlanmış pamuğu güçlü şarap sirkesine batırdı, sonra gölgede kuruttu. \"Sind'e vardığınızda orada sirke az bulunur, bu yüzden bu pamuğu suya batırın, sonra onunla yemek pişirin ve boyayın\" dedi. Rivayet olunur ki, Muhammed sınıra vardığında, onlara sirke kıtlığından şikayet eden bir mektup yazmış, bunun üzerine ona sirkeye batırılmış pamuk göndermişlerdir. Muhammed bin el-Kâsım Makran'a doğru ilerlemiş ve orada birkaç gün kalmış, sonra Kanbur'a gelip orayı fethetmiştir. Daha sonra Ermael'e gelip orayı da fethetmiştir. Muhammed bin Harun bin Zür' onunla karşılaşmış, ona katılmış ve onunla birlikte yürümüştür; o da Kanbur yakınlarında ölmüş ve Kanbul'a gömülmüştür."
  id: "Al-Hajjaj menunjuk Muhammad bin Al-Qasim bin Muhammad bin Al-Hakam bin Abi Aqil pada masa pemerintahan Al-Walid bin Abdul-Malik. Ia menyerbu Sindh dan berada di Fars. Al-Hajjaj memerintahkannya untuk berbaris ke Rayy, dan Abu Al-Aswad Jahm bin Zuhr Al-Jumahi memimpin barisan depannya. Al-Hajjaj mengirimnya kembali dan menunjuknya ke perbatasan Sindh. Ia menambahkan enam ribu tentara dari penduduk Suriah dan banyak orang dari tempat lain kepadanya dan melengkapinya dengan segala yang dibutuhkannya, bahkan benang dan jarum. Al-Hajjaj memerintahkannya untuk tinggal di Shiraz sampai para pengikutnya lengkap dan apa yang telah disiapkan untuknya tiba. Al-Hajjaj mengambil kapas yang telah dipisahkan bijinya dan merendamnya dalam cuka anggur yang kuat, lalu mengeringkannya di tempat teduh. Ia berkata, “Ketika kamu sampai di Sindh, cuka di sana langka, jadi rendam kapas ini dalam air, lalu masak dan warnai dengan air itu.” Dikatakan bahwa ketika Muhammad tiba di perbatasan, ia menulis surat mengeluh tentang kelangkaan cuka bagi mereka, sehingga ia mengirimkan kapas yang direndam dalam cuka. Muhammad bin Al-Qasim berbaris ke Makran dan tinggal di sana selama beberapa hari, kemudian ia datang ke Qanbur dan menaklukkannya. Kemudian ia datang ke Armael dan menaklukkannya. Muhammad bin Harun bin Dhur’ bertemu dengannya dan bergabung dengannya serta berbaris bersamanya, dan ia meninggal di dekat tempat itu dan dimakamkan di Qanbul."
