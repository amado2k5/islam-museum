label:
  ar: "استئمان اليأميين على دية المصري بعد مقامه سبعة أيام، شعبان 294هـ، ص337"
  en: "The Ya'am seek safety on payment of the blood-money of al-Misri after seven days, Sha'ban 294 AH, p. 337"
  ur: "یامیین کا مصری کی دیت پر امان مانگنا، سات دن کے قیام کے بعد، شعبان 294ھ، ص337"
summary:
  ar: "بعد سبعة أيام من الإقامة استأمن اليأميون على أن يتحملوا دية المصري، وجعلها الهادي ألف دينار مثاقيل، فنزلوا على حكمه."
  en: "After seven days of al-Hadi's stay, the Ya'am sought safety on condition that they bear the blood-money of al-Misri, which he set at one thousand mithqal dinars; they surrendered to his judgement."
  ur: "ہادی کے سات دن قیام کے بعد یامیین نے امان مانگی، اس شرط پر کہ وہ مصری کی دیت ادا کریں گے، جسے ہادی نے ایک ہزار مثقال دینار مقرر کیا؛ وہ ان کے فیصلے پر اتر آئے۔"
