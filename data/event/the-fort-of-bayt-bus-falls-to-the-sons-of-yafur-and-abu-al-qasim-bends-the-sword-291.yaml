id: event/the-fort-of-bayt-bus-falls-to-the-sons-of-yafur-and-abu-al-qasim-bends-the-sword-291
class: event
kind: other
label:
  ar: سقوط قلعة بيت بوس بيد ابني يعفر وثني أبي القاسم للسيف، صفر 291هـ
  en: The fort of Bayt Bus falls to the sons of Ya'fur and Abu al-Qasim bends the sword, Safar 291 AH
  ur: بیت بوس کے قلعے کا یعفر کے بیٹوں کے ہاتھ آنا اور ابو القاسم کا تلوار موڑ دینا، صفر 291ھ
summary:
  ar: عند طلوع شمس الأحد يتقدم ابنا يعفر واليافعي بعسكرهم إلى القلعة، ويقع القتال بالحجارة والنبل، وينشر آل يعفر ثياباً فينزل إليهم ستة نفر من أهل القلعة، ثم يُفتح الباب بالمفتاح ويدخلون ويأسرون من فيها وينهبون، ويرفع أحدهم سيفاً على أبي القاسم فيقبض عليه ويحنيه كالحلقة، ثم يطلقونهم.
  en: At sunrise on Sunday the two sons of Ya'fur and al-Yafi'i advance with their troops on the fort and fighting breaks out with stones and arrows; Al Ya'fur spread out clothes, six men of the fort came down to them, the gate was opened with a key, they entered, took the people prisoner and plundered, and one raised a sword on Abu al-Qasim, who seized it and bent it like a ring, and they let them go.
  ur: اتوار کو طلوعِ آفتاب پر یعفر کے دونوں بیٹے اور یافعی اپنے لشکر کے ساتھ قلعے کی طرف بڑھتے ہیں، پتھروں اور تیروں سے لڑائی ہوتی ہے؛ آلِ یعفر کپڑے پھیلاتے ہیں تو قلعے کے چھ آدمی ان کے پاس اترتے ہیں، دروازہ چابی سے کھولا جاتا ہے، وہ داخل ہوتے ہیں، لوگوں کو قید کرتے اور لوٹتے ہیں، ایک شخص ابو القاسم پر تلوار اٹھاتا ہے تو وہ اسے پکڑ کر حلقے کی طرح موڑ دیتے ہیں، اور وہ انہیں چھوڑ دیتے ہیں۔
