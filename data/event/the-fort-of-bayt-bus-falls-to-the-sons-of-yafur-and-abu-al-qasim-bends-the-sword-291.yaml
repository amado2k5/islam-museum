id: event/the-fort-of-bayt-bus-falls-to-the-sons-of-yafur-and-abu-al-qasim-bends-the-sword-291
class: event
kind: other
label:
  ar: سقوط قلعة بيت بوس بيد ابني يعفر وثني أبي القاسم للسيف، صفر 291هـ
  en: The fort of Bayt Bus falls to the sons of Ya'fur and Abu al-Qasim bends the sword, Safar 291 AH
  ur: بیت بوس کے قلعے کا یعفر کے بیٹوں کے ہاتھ آنا اور ابو القاسم کا تلوار موڑ دینا، صفر 291ھ
  es: "La fortaleza de Bayt Bus cae en manos de los hijos de Ya'fur y Abu al-Qasim dobla la espada, Safar 291 AH."
  fr: "La forteresse de Bayt Bus tombe aux mains des fils de Ya'fur et Abu al-Qasim brise l'épée, Safar 291 AH"
  tr: "Ya'fer'in iki oğlu ve Ebu el-Kasım'ın kılıcıyla Beyt Bos kalesinin düşüşü, Safer 291 Hicri"
  id: "Jatuhnya benteng Beit Bos di tangan dua putra Ya'far dan pedang Abu al-Qasim, Safar 291 H."
summary:
  ar: عند طلوع شمس الأحد يتقدم ابنا يعفر واليافعي بعسكرهم إلى القلعة، ويقع القتال بالحجارة والنبل، وينشر آل يعفر ثياباً فينزل إليهم ستة نفر من أهل القلعة، ثم يُفتح الباب بالمفتاح ويدخلون ويأسرون من فيها وينهبون، ويرفع أحدهم سيفاً على أبي القاسم فيقبض عليه ويحنيه كالحلقة، ثم يطلقونهم.
  en: At sunrise on Sunday the two sons of Ya'fur and al-Yafi'i advance with their troops on the fort and fighting breaks out with stones and arrows; Al Ya'fur spread out clothes, six men of the fort came down to them, the gate was opened with a key, they entered, took the people prisoner and plundered, and one raised a sword on Abu al-Qasim, who seized it and bent it like a ring, and they let them go.
  ur: اتوار کو طلوعِ آفتاب پر یعفر کے دونوں بیٹے اور یافعی اپنے لشکر کے ساتھ قلعے کی طرف بڑھتے ہیں، پتھروں اور تیروں سے لڑائی ہوتی ہے؛ آلِ یعفر کپڑے پھیلاتے ہیں تو قلعے کے چھ آدمی ان کے پاس اترتے ہیں، دروازہ چابی سے کھولا جاتا ہے، وہ داخل ہوتے ہیں، لوگوں کو قید کرتے اور لوٹتے ہیں، ایک شخص ابو القاسم پر تلوار اٹھاتا ہے تو وہ اسے پکڑ کر حلقے کی طرح موڑ دیتے ہیں، اور وہ انہیں چھوڑ دیتے ہیں۔
  es: "Al amanecer del domingo, los dos hijos de Ya'fur y al-Yafi'i avanzaron con sus tropas hacia el fuerte y estalló la lucha con piedras y flechas; Al Ya'fur extendió ropas, seis hombres del fuerte bajaron hacia ellos, la puerta se abrió con una llave, entraron, tomaron prisioneros a la gente y saquearon, y uno alzó una espada contra Abu al-Qasim, quien la agarró y la dobló como un anillo, y los dejaron ir."
  fr: "Au lever du soleil, dimanche, les deux fils de Ya'fur et d'al-Yafi'i avancent avec leurs troupes vers le fort et un combat éclate à coups de pierres et de flèches; Al Ya'fur étend des vêtements, six hommes du fort descendent vers eux, la porte est ouverte avec une clé, ils entrent, font prisonniers les habitants et pillent, et l'un d'eux lève une épée contre Abu al-Qasim, qui la saisit et la plie comme un anneau, et ils les relâchent."
  tr: "Pazar günü güneş doğarken, Ya'fer ve Yafi'i'nin oğulları ordularıyla birlikte kaleye doğru ilerlerler. Taş ve oklarla bir çatışma çıkar. Ya'fer ailesi giysilerini serer ve kaleden altı adam onlara doğru iner. Sonra kapı bir anahtarla açılır ve içeri girerler, içeridekileri yakalarlar ve yağmalarlar. İçlerinden biri Ebu el-Kâsım'a kılıç çeker, bunun üzerine Ebu el-Kâsım onu yakalar ve bir halka gibi büker. Sonra onları serbest bırakırlar."
  id: "Saat matahari terbit pada hari Minggu, putra-putra Ya’far dan Al-Yafi’i maju bersama pasukan mereka ke benteng. Pertempuran pecah dengan lemparan batu dan panah. Keluarga Ya’far membentangkan pakaian, dan enam orang dari benteng turun menghampiri mereka. Kemudian pintu dibuka dengan kunci, dan mereka masuk, menangkap orang-orang di dalam, dan menjarah. Salah seorang dari mereka mengacungkan pedang ke arah Abu Al-Qasim, lalu ia menangkapnya dan membengkokkannya seperti cincin. Kemudian mereka melepaskannya."
