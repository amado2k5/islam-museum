id: event/al-hadi-detains-a-girl-and-asks-her-pardon
class: event
kind: other
label:
  ar: الهادي يحبس جارية احتياطاً ثم يطلب إليها أن تحلّله
  en: Al-Hadi has a girl held for a time, then asks her to release him from blame
  ur: ہادی ایک لڑکی کو احتیاطاً روکتے ہیں پھر اس سے معافی مانگتے ہیں
  es: "Al-Hadi retiene a una chica durante un tiempo y luego le pide que lo libere de la culpa."
  fr: "Al-Hadi retient une jeune fille en otage pendant un certain temps, puis lui demande de le disculper."
  tr: "El-Hadi, tedbir amaçlı olarak bir cariyeyi hapse atar, sonra da kendisini serbest bırakmasını ister."
  id: "Al-Hadi memenjarakan seorang budak perempuan sebagai tindakan pencegahan, kemudian memintanya untuk membebaskannya."
summary:
  ar: رأى الكوفي الهادي وعنده قوم يختصمون في جارية وبعض أهل الدعوى غائب، فأمر بحبسها حتى ينظر في أمرها، وبعد يومين أو ثلاثة بعث إلى قوم من أهل البلد وقال إن الحبس لم يكن واجباً عليها وإنما فعله رجاء انقطاع أمرها، وأمرهم أن يسألوها أن تجعله في حل وأن يطلقوها.
  en: Al-Kufi saw al-Hadi while a party disputed over a girl and one claimant was absent; he had her held until he could look into it, and after two or three days he sent to some townsmen saying that the detention was not owed by her and was done in hope the matter would end, and told them to ask her to hold him blameless and to free her.
  ur: کوفی نے ہادی کو دیکھا جب کچھ لوگ ایک لڑکی کے بارے میں جھگڑ رہے تھے اور ایک دعویدار غائب تھا؛ انہوں نے اسے معاملہ دیکھنے تک روکنے کا حکم دیا، اور دو تین دن بعد شہر کے کچھ لوگوں کو بلا کر کہا کہ اس پر قید واجب نہ تھی اور میں نے معاملہ ختم ہونے کی امید پر کیا، اور کہا اس سے کہو کہ مجھے معاف کر دے اور اسے چھوڑ دو۔
  es: "Al-Kufi vio a al-Hadi mientras una parte se disputaba a una muchacha y uno de los reclamantes estaba ausente; la hizo retener hasta que pudiera investigar el asunto, y después de dos o tres días envió a algunos lugareños diciendo que la detención no era culpa suya y que se había hecho con la esperanza de que el asunto terminara, y les dijo que le pidieran que lo eximiera de toda culpa y que la liberara."
  fr: "Al-Kufi vit al-Hadi alors qu'une dispute avait lieu au sujet d'une jeune fille et que l'un des prétendants était absent; il la fit retenir jusqu'à ce qu'il puisse examiner la situation, et après deux ou trois jours, il envoya dire à des habitants que la détention n'était pas due par elle et qu'elle avait été faite dans l'espoir que l'affaire se termine, et leur dit de lui demander de le tenir pour innocent et de la libérer."
  tr: "El-Kufi, El-Hadi'yi gördü ve orada bir cariye hakkında tartışan insanlar vardı; davacılardan bazıları ise orada değildi. Bunun üzerine El-Kufi, davasını inceleyene kadar cariyenin hapse atılmasını emretti. İki üç gün sonra, kasabadan bazı kişilere haber göndererek, hapse atılmasının zorunlu olmadığını, ancak davanın sonuçlanması umuduyla bunu yaptığını söyledi ve onlardan El-Kufi'den kendisini serbest bırakmasını ve cariyeyi bırakmasını istemelerini emretti."
  id: "Al-Kufi melihat Al-Hadi dan ada orang-orang yang berdebat tentang seorang budak perempuan, dan beberapa penggugat tidak hadir. Maka ia memerintahkan agar budak perempuan itu dipenjara sampai ia memeriksa kasusnya. Setelah dua atau tiga hari, ia mengirim utusan kepada beberapa orang dari kota dan mengatakan bahwa pemenjaraan itu tidak wajib baginya, tetapi ia melakukannya dengan harapan kasusnya akan selesai, dan ia memerintahkan mereka untuk meminta budak perempuan itu membebaskannya dan membiarkannya pergi."
