id: event/arabization-of-iraq-diwan
class: event
kind: other
label: { ar: "نقل ديوان خراج العراق إلى العربية", en: "The Arabization of Iraq's Kharaj Diwan" }
summary:
  ar: "عند البلاذري عن المدائني عن علي بن محمد بن أبي سيف عن أشياخه: لم يزل ديوان خراج السواد وسائر العراق بالفارسية فلما ولي الحجاج العراق استكتب زادان فروخ بن بيري وكان معه صالح بن عبد الرحمن مولى بني تميم يخط بين يديه بالعربية والفارسية وكان أبو صالح من سبي سجستان فوصل زادان فروخ صالحاً بالحجاج وخف على قلبه فقال له ذات يوم إنك قريب إلى الأمير وأراه قد استخفني ولا آمن أن يقدمني عليك وإن تسقط فقال لا تظن ذلك هو أحوج إلي منه إليك لأنه لا يجد من يكفيه حسابه غيري فقال والله لو شئت أن أحول الحساب إلى العربية لحولته قال فحول منه شطراً حتى أرى ففعل فقال له تمارض فتمارض فبعث إليه الحجاج طبيبه فلم ير به علة وبلغ زادان فروخ ذلك فأمره أن يظهر ثم إن زادان فروخ قتل أيام عبد الرحمن بن محمد بن الأشعث الكندي فاستكتب الحجاج صالحاً مكانه فأعلمه الذي كان جرى بينه وبين زادان فروخ في نقل الديوان فعزم الحجاج على أن يجعل الديوان بالعربية وقلد ذلك صالحاً فقال له مردانشاه بن زادان فروخ كيف تصنع بدهوية وششوية قال أكتب عشر ونصف عشر قال فكيف تصنع بويد قال أكتبه أيضاً والويد النيف والزيادة تزاد فقال قطع الله أصلك من الدنيا كما قطعت أصل الفارسية وبذلت له مائة ألف درهم على أن يظهر العجز عن نقل الديوان ويمسك عن ذلك فأبى ونقله فكان عبد الحميد بن يحيى كاتب مروان بن محمد يقول لله در صالح ما أعظم منته على الكتاب وقال سهل بن أبي الصلت أجل الحجاج صالح بن عبد الرحمن أجلاً حتى قلب الديوان."
  en: "In al-Baladhuri via al-Mada'ini from Ali ibn Muhammad ibn Abi Sayf's shaykhs: the diwan of the Sawad's kharaj and all Iraq remained in Persian until al-Hajjaj governed Iraq and took as scribe Zadhanfarrukh ibn Biri, who had with him Salih ibn Abd al-Rahman — mawla of Banu Tamim whose father was among Sijistan's captives — writing before him in Arabic and Persian. Zadhanfarrukh presented Salih to al-Hajjaj who took to him, then confided his fear of displacement — Salih answering that the amir needed him more since none could keep his accounts but himself, and offering: by God, if you wished I could turn the accounts to Arabic. He converted half for display, then feigned illness; al-Hajjaj's physician found nothing wrong and Zadhanfarrukh ordered him to appear. When Zadhanfarrukh was killed in Abd al-Rahman ibn Muhammad ibn al-Ash'ath's days, al-Hajjaj made Salih his scribe; told of the earlier exchange he resolved to make the diwan Arabic and charged Salih with it. Mardanshah ibn Zadhanfarrukh challenged: what will you do for dahwiya and shashwiya? — I write ushr and half-ushr; and wid? — likewise, the surplus being increased; whereupon: may God cut your root from this world as you have cut Persian's root. A hundred thousand dirhams were offered him to feign inability and desist — he refused and translated it. Abd al-Hamid ibn Yahya, Marwan ibn Muhammad's scribe, would say: God reward Salih — how great his favor to the scribes; and Sahl ibn Abi al-Salt said al-Hajjaj gave Salih a deadline until he turned the diwan over."
