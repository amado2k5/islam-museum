id: event/arabization-of-iraq-diwan
class: event
kind: other
label: { ar: "نقل ديوان خراج العراق إلى العربية", en: "The Arabization of Iraq's Kharaj Diwan", es: "La arabización del Kharaj Diwan de Irak", fr: "L’arabisation du Kharaj Diwan irakien", ur: "عراق کے خرج دیوان کی عرب کاری", tr: "Irak vergi dairesinin Arapçaya çevirisi", id: "Terjemahan kantor pajak Irak ke dalam bahasa Arab." }
summary:
  ar: "عند البلاذري عن المدائني عن علي بن محمد بن أبي سيف عن أشياخه: لم يزل ديوان خراج السواد وسائر العراق بالفارسية فلما ولي الحجاج العراق استكتب زادان فروخ بن بيري وكان معه صالح بن عبد الرحمن مولى بني تميم يخط بين يديه بالعربية والفارسية وكان أبو صالح من سبي سجستان فوصل زادان فروخ صالحاً بالحجاج وخف على قلبه فقال له ذات يوم إنك قريب إلى الأمير وأراه قد استخفني ولا آمن أن يقدمني عليك وإن تسقط فقال لا تظن ذلك هو أحوج إلي منه إليك لأنه لا يجد من يكفيه حسابه غيري فقال والله لو شئت أن أحول الحساب إلى العربية لحولته قال فحول منه شطراً حتى أرى ففعل فقال له تمارض فتمارض فبعث إليه الحجاج طبيبه فلم ير به علة وبلغ زادان فروخ ذلك فأمره أن يظهر ثم إن زادان فروخ قتل أيام عبد الرحمن بن محمد بن الأشعث الكندي فاستكتب الحجاج صالحاً مكانه فأعلمه الذي كان جرى بينه وبين زادان فروخ في نقل الديوان فعزم الحجاج على أن يجعل الديوان بالعربية وقلد ذلك صالحاً فقال له مردانشاه بن زادان فروخ كيف تصنع بدهوية وششوية قال أكتب عشر ونصف عشر قال فكيف تصنع بويد قال أكتبه أيضاً والويد النيف والزيادة تزاد فقال قطع الله أصلك من الدنيا كما قطعت أصل الفارسية وبذلت له مائة ألف درهم على أن يظهر العجز عن نقل الديوان ويمسك عن ذلك فأبى ونقله فكان عبد الحميد بن يحيى كاتب مروان بن محمد يقول لله در صالح ما أعظم منته على الكتاب وقال سهل بن أبي الصلت أجل الحجاج صالح بن عبد الرحمن أجلاً حتى قلب الديوان."
  en: "In al-Baladhuri via al-Mada'ini from Ali ibn Muhammad ibn Abi Sayf's shaykhs: the diwan of the Sawad's kharaj and all Iraq remained in Persian until al-Hajjaj governed Iraq and took as scribe Zadhanfarrukh ibn Biri, who had with him Salih ibn Abd al-Rahman — mawla of Banu Tamim whose father was among Sijistan's captives — writing before him in Arabic and Persian. Zadhanfarrukh presented Salih to al-Hajjaj who took to him, then confided his fear of displacement — Salih answering that the amir needed him more since none could keep his accounts but himself, and offering: by God, if you wished I could turn the accounts to Arabic. He converted half for display, then feigned illness; al-Hajjaj's physician found nothing wrong and Zadhanfarrukh ordered him to appear. When Zadhanfarrukh was killed in Abd al-Rahman ibn Muhammad ibn al-Ash'ath's days, al-Hajjaj made Salih his scribe; told of the earlier exchange he resolved to make the diwan Arabic and charged Salih with it. Mardanshah ibn Zadhanfarrukh challenged: what will you do for dahwiya and shashwiya? — I write ushr and half-ushr; and wid? — likewise, the surplus being increased; whereupon: may God cut your root from this world as you have cut Persian's root. A hundred thousand dirhams were offered him to feign inability and desist — he refused and translated it. Abd al-Hamid ibn Yahya, Marwan ibn Muhammad's scribe, would say: God reward Salih — how great his favor to the scribes; and Sahl ibn Abi al-Salt said al-Hajjaj gave Salih a deadline until he turned the diwan over."
  es: "En al-Baladhuri vía al-Mada'ini de los shaykhs de Ali ibn Muhammad ibn Abi Sayf: el diwan del kharaj de Sawad y todo Irak permanecieron en persa hasta que al-Hajjaj gobernó Irak y tomó como escriba a Zadhanfarrukh ibn Biri, quien tenía consigo a Salih ibn Abd al-Rahman —mawla de Banu Tamim cuyo padre estaba entre los cautivos de Sijistan— escribiendo ante él en árabe y persa. Zadhanfarrukh presentó a Salih a al-Hajjaj, quien lo tomó en consideración, y luego le confió su temor a ser desplazado. Salih respondió que el emir lo necesitaba más, ya que nadie más que él podía llevar sus cuentas, y ofreció: por Dios, si lo desea, podría convertir las cuentas al árabe. Convirtió la mitad para aparentar, luego fingió una enfermedad; el médico de al-Hajjaj no encontró nada malo y Zadhanfarrukh le ordenó presentarse. Cuando Zadhanfarrukh fue asesinado en tiempos de Abd al-Rahman ibn Muhammad ibn al-Ash'ath, al-Hajjaj nombró a Salih su escriba; al enterarse del intercambio anterior, decidió hacer el diwan árabe y le encargó a Salih que lo hiciera. Mardanshah ibn Zadhanfarrukh desafió: ¿qué harás por dahwiya y shashwiya? — Yo escribo ushr y medio-ushr; ¿y wid? — igualmente, siendo aumentado el excedente; entonces: que Dios corte tu raíz de este mundo como has cortado la raíz del persa. Se le ofrecieron cien mil dirhams para que fingiera incapacidad y desistiera; él se negó y lo tradujo. Abd al-Hamid ibn Yahya, escriba de Marwan ibn Muhammad, diría: Dios recompense a Salih — cuán grande es su favor a los escribas; Y Sahl ibn Abi al-Salt dijo que al-Hajjaj le dio a Salih un plazo hasta que entregara el diwan."
  fr: "D'après al-Baladhuri, transmis par al-Mada'ini et rapporté par les cheikhs d'Ali ibn Muhammad ibn Abi Sayf: le diwan du kharaj des Sawad et tout l'Irak restèrent sous administration persane jusqu'à ce qu'al-Hajjaj gouverne l'Irak et prenne pour scribe Zadhanfarrukh ibn Biri, accompagné de Salih ibn Abd al-Rahman – mawla des Banu Tamim, dont le père avait été parmi les captifs du Sijistan – qui écrivait avant lui en arabe et en persan. Zadhanfarrukh présenta Salih à al-Hajjaj, qui l'apprécia et lui confia sa crainte d'être déporté. Salih répondit que l'émir avait davantage besoin de lui, car nul autre que lui ne pouvait tenir ses comptes, et proposa: « Par Dieu, si vous le vouliez, je pourrais traduire les comptes en arabe. » Il en convertit la moitié pour faire bonne figure, puis simula la maladie; le médecin d'al-Hajjaj ne constata rien d'anormal et Zadhanfarrukh lui ordonna de se présenter. Lorsque Zadhanfarrukh fut tué du temps d'Abd al-Rahman ibn Muhammad ibn al-Ash'ath, al-Hajjaj fit de Salih son scribe. Informé de l'échange précédent, il décida de traduire le diwan en arabe et confia cette tâche à Salih. Mardanshah ibn Zadhanfarrukh le défia: « Que feras-tu pour la dahwiya et la shashwiya ? » « J'écris l'ushr et la demi-ushr; et le wid ? » « De même, le surplus étant augmenté. » Sur quoi: « Que Dieu te fasse disparaître de ce monde comme tu as fait disparaître le persan ! » On lui offrit cent mille dirhams pour qu'il feigne l'incapacité et renonce, mais il refusa et traduisit le texte. Abd al-Hamid ibn Yahya, scribe de Marwan ibn Muhammad, disait: « Que Dieu récompense Salih ! Quelle grande faveur il a accordée aux scribes ! » et Sahl ibn Abi al-Salt a dit qu'al-Hajjaj avait donné à Salih un délai pour lui remettre le diwan."
  ur: "البلادوری میں بذریعہ المدینی میں علی بن محمد ابن ابی سیف کے شیوخ سے: سواد کے خرج اور تمام عراق کا دیوان فارسی میں رہا یہاں تک کہ الحجاج نے عراق پر حکومت کی اور زادنفرخ ابن بری کو کاتب بنایا، جس کے ساتھ صالح بن عبد المومن کے والد صالح بن عبد المومن تھے۔ سجستان کے اسیر - اس کے سامنے عربی اور فارسی میں لکھتے تھے۔ غضنفرخ نے صالح کو الحجاج کے سامنے پیش کیا جو اس کے پاس لے گیا، پھر اپنے بے گھر ہونے کے خوف کا اظہار کیا - صالح نے جواب دیا کہ امیر کو اس کی زیادہ ضرورت ہے کیونکہ اس کا حساب اس کے سوا کوئی نہیں رکھ سکتا، اور پیشکش کی: خدا کی قسم، اگر آپ چاہیں تو میں حساب عربی میں بدل سکتا ہوں۔ اس نے نصف کو نمائش کے لیے تبدیل کیا، پھر بیماری کا بہانہ کیا۔ الحجاج کے طبیب کو کچھ غلط نہ لگا اور زدانفرخ نے اسے حاضر ہونے کا حکم دیا۔ عبدالرحمٰن بن محمد بن اشعث کے زمانے میں جب غضنفرخ مارا گیا تو الحجاج نے صالح کو اپنا کاتب بنایا۔ پہلے تبادلے کے بارے میں بتایا کہ اس نے دیوان کو عربی بنانے کا عزم کیا اور صالح کو اس کی ذمہ داری سونپی۔ مردانشاہ ابن غضنفرخ نے چیلنج کیا: تم دحیہ اور شاشویہ کے لیے کیا کرو گے؟ میں عشر اور نصف عشر لکھتا ہوں۔ اور چوڑائی؟ - اسی طرح، اضافی اضافہ کیا جا رہا ہے؛ اس پر: خدا تمہاری جڑ اس دنیا سے کاٹ دے جس طرح تم نے فارسی کی جڑ کاٹی ہے۔ اسے ایک لاکھ درہم کی پیشکش کی گئی تھی کہ وہ نااہلی کا دعویٰ کریں اور اس سے باز آ جائیں – اس نے انکار کر دیا اور اس کا ترجمہ کیا۔ عبد الحمید ابن یحییٰ، مروان بن محمد کا کاتب، کہے گا: خدا صالح کو جزا دے - کاتبوں پر اس کا کتنا بڑا احسان ہے۔ اور سہل بن ابی الصلت نے کہا کہ الحجاج نے صالح کو دیوان کو پلٹنے تک مہلت دی تھی۔"
  tr: "El-Baladhuri, El-Medaini'den, o da Ali ibn Muhammed ibn Abi Sayf'tan, o da hocalarından rivayetle şöyle der: Sawad ve Irak'ın geri kalanının vergi kayıtları Farsça kalmıştır. El-Haccac Irak valisi olduğunda, Zadan Farrukh ibn Biri'yi kâtip olarak atadı. Banu Tamim'in bir müşterisi olan Salih ibn Abd al-Rahman da onunla birlikteydi ve hem Arapça hem de Farsça yazıyordu. Ebu Salih, Sijistan'dan esir alınmıştı. Zadan Farrukh, Salih'i El-Haccac ile tanıştırdı ve Salih ona yakın hissetti. Bir gün ona, \"Valiye yakınsın ve görüyorum ki beni hafife alıyor. Korkarım ki, gözden düşsen bile beni senden üstün tutabilir.\" dedi. Salih, \"Böyle düşünme. Onun bana senden daha çok ihtiyacı var, çünkü hesaplarını tutacak başka kimsesi yok.\" diye cevap verdi. Zadan Farrukh, \"Allah'a yemin ederim ki, dileseydim hesapları Arapçaya çevirebilirdim.\" dedi. Salih, \"Bir kısmını çevir ki göreyim\" dedi. Salih de öyle yaptı. El-Haccac ona hasta numarası yapmasını söyledi, o da öyle yaptı. El-Haccac hekimini ona gönderdi, ancak hekim herhangi bir hastalık bulamadı. Bu durum Zadan Farrukh'a ulaştı ve o da Salih'e kendini ifşa etmesini emretti. Bunun üzerine Zadan Farrukh, Abdülrahman ibn Muhammed ibn el-Eş'at el-Kindi'nin hükümdarlığı döneminde öldürüldü. El-Haccac, Salih'i kâtibi olarak atadı ve Salih, vergi defterinin devri konusunda kendisi ve Zadan Farrukh arasında geçenleri ona bildirdi. El-Haccac karar verdi... Divanı Arapça yaptı ve onu taklit etti, bunun üzerine Salih ona, Mardanshah bin Zadan Farrukh'a, \"Dahviye ve Şaşviye'yi nasıl yapıyorsun?\" dedi. O da, \"On ve on buçuk yaz\" dedi. El-Haccac, \"Ve Wayd'i nasıl yapıyorsun?\" diye sordu. O da, \"Onu da yaz, Wayd farktır ve artış eklenir\" dedi. \"Allah senin soyunu dünyadan silsin, tıpkı senin Fars dilinin kökenini sildiğin gibi.\" dedi. Ve ona, divanı devretme yeteneğinin olmadığını göstermesi ve bundan vazgeçmesi şartıyla yüz bin dirhem teklif etti, ancak o reddetti ve divanı devretti. Bunun üzerine Mervan bin Muhammed'in kâtibi Abdülhamid bin Yahya, \"Allah Salih'i mükafatlandırsın, kâtibe ne büyük bir lütuf!\" derdi. Sahl bin Ebu el-Salt da, \"Haccac, Salih bin Abdülrahman'a divanı devrettiği zamana kadar uzun bir ömür verdi.\" dedi."
  id: "Al-Baladhuri, berdasarkan riwayat Al-Madaini, berdasarkan riwayat Ali ibn Muhammad ibn Abi Sayf, berdasarkan riwayat guru-gurunya: Daftar pajak Sawad dan seluruh Irak tetap dalam bahasa Persia. Ketika Al-Hajjaj menjadi gubernur Irak, ia menunjuk Zadan Farrukh ibn Biri sebagai juru tulisnya. Salih ibn Abd al-Rahman, seorang klien Banu Tamim, bersamanya, menulis dalam bahasa Arab dan Persia. Abu Salih adalah tawanan dari Sijistan. Zadan Farrukh memperkenalkan Salih kepada Al-Hajjaj, dan Salih merasa dekat dengannya. Suatu hari, ia berkata kepadanya, \"Kau dekat dengan gubernur, dan aku melihat bahwa ia telah menganggapku remeh. Aku khawatir ia mungkin akan menempatkanku di atasmu, bahkan jika kau kehilangan kedudukannya.\" Salih menjawab, \"Jangan berpikir begitu. Ia lebih membutuhkanku daripada kau, karena ia tidak punya orang lain untuk menangani pembukuannya.\" Zadan Farrukh berkata, \"Demi Allah, jika aku mau, aku bisa menerjemahkan catatan-catatan itu ke dalam bahasa Arab.\" Salih berkata, \"Ubahlah sebagian agar aku bisa melihatnya.\" Maka ia melakukannya. Al-Hajjaj menyuruhnya berpura-pura sakit, maka ia pun melakukannya. Al-Hajjaj mengirim tabibnya kepadanya, tetapi tabib itu tidak menemukan penyakit apa pun. Hal ini sampai ke telinga Zadan Farrukh, yang kemudian memerintahkannya untuk mengungkapkan jati dirinya. Kemudian Zadan Farrukh terbunuh pada masa pemerintahan Abd al-Rahman ibn Muhammad ibn al-Ash'ath al-Kindi. Al-Hajjaj mengangkat Salih sebagai juru tulisnya, dan Salih memberitahunya tentang apa yang telah terjadi antara dirinya dan Zadan Farrukh mengenai pengalihan buku catatan pajak. Al-Hajjaj memutuskan untuk... Ia membuat Diwan dalam bahasa Arab dan menirunya, lalu Salih berkata kepadanya, Mardanshah bin Zadan Farrukh, “Bagaimana dengan Dahwiya dan Shashwiya?” Ia menjawab, “Tulis sepuluh setengah sepuluh.” Dia berkata, “Dan bagaimana dengan Wayd?” Dia menjawab, “Tulis juga, dan Wayd adalah selisihnya dan penambahannya ditambahkan.” Dia berkata, “Semoga Allah memutus asalmu dari dunia sebagaimana engkau memutus asal bahasa Persia.” Dan dia menawarkannya seratus ribu dirham dengan syarat dia menunjukkan ketidakmampuan untuk memindahkan Diwan dan menahan diri dari itu, tetapi dia menolak dan memindahkannya. Maka Abd al-Hamid bin Yahya, juru tulis Marwan bin Muhammad, biasa berkata, “Semoga Allah memberi pahala kepada Salih, betapa besar karunia-Nya kepada juru tulis.” Dan Sahl bin Abi al-Salt berkata, “Al-Hajjaj memberi Salih bin Abd al-Rahman umur panjang sampai dia menyerahkan Diwan.”"
