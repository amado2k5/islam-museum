label: { ar: "نقل ديوان خراج العراق إلى العربية", en: "The Arabization of Iraq's Kharaj Diwan", es: "La arabización del Kharaj Diwan de Irak", fr: "L’arabisation du Kharaj Diwan irakien" }
summary:
  ar: "عند البلاذري عن المدائني عن علي بن محمد بن أبي سيف عن أشياخه: لم يزل ديوان خراج السواد وسائر العراق بالفارسية فلما ولي الحجاج العراق استكتب زادان فروخ بن بيري وكان معه صالح بن عبد الرحمن مولى بني تميم يخط بين يديه بالعربية والفارسية وكان أبو صالح من سبي سجستان فوصل زادان فروخ صالحاً بالحجاج وخف على قلبه فقال له ذات يوم إنك قريب إلى الأمير وأراه قد استخفني ولا آمن أن يقدمني عليك وإن تسقط فقال لا تظن ذلك هو أحوج إلي منه إليك لأنه لا يجد من يكفيه حسابه غيري فقال والله لو شئت أن أحول الحساب إلى العربية لحولته قال فحول منه شطراً حتى أرى ففعل فقال له تمارض فتمارض فبعث إليه الحجاج طبيبه فلم ير به علة وبلغ زادان فروخ ذلك فأمره أن يظهر ثم إن زادان فروخ قتل أيام عبد الرحمن بن محمد بن الأشعث الكندي فاستكتب الحجاج صالحاً مكانه فأعلمه الذي كان جرى بينه وبين زادان فروخ في نقل الديوان فعزم الحجاج على أن يجعل الديوان بالعربية وقلد ذلك صالحاً فقال له مردانشاه بن زادان فروخ كيف تصنع بدهوية وششوية قال أكتب عشر ونصف عشر قال فكيف تصنع بويد قال أكتبه أيضاً والويد النيف والزيادة تزاد فقال قطع الله أصلك من الدنيا كما قطعت أصل الفارسية وبذلت له مائة ألف درهم على أن يظهر العجز عن نقل الديوان ويمسك عن ذلك فأبى ونقله فكان عبد الحميد بن يحيى كاتب مروان بن محمد يقول لله در صالح ما أعظم منته على الكتاب وقال سهل بن أبي الصلت أجل الحجاج صالح بن عبد الرحمن أجلاً حتى قلب الديوان."
  en: "In al-Baladhuri via al-Mada'ini from Ali ibn Muhammad ibn Abi Sayf's shaykhs: the diwan of the Sawad's kharaj and all Iraq remained in Persian until al-Hajjaj governed Iraq and took as scribe Zadhanfarrukh ibn Biri, who had with him Salih ibn Abd al-Rahman — mawla of Banu Tamim whose father was among Sijistan's captives — writing before him in Arabic and Persian. Zadhanfarrukh presented Salih to al-Hajjaj who took to him, then confided his fear of displacement — Salih answering that the amir needed him more since none could keep his accounts but himself, and offering: by God, if you wished I could turn the accounts to Arabic. He converted half for display, then feigned illness; al-Hajjaj's physician found nothing wrong and Zadhanfarrukh ordered him to appear. When Zadhanfarrukh was killed in Abd al-Rahman ibn Muhammad ibn al-Ash'ath's days, al-Hajjaj made Salih his scribe; told of the earlier exchange he resolved to make the diwan Arabic and charged Salih with it. Mardanshah ibn Zadhanfarrukh challenged: what will you do for dahwiya and shashwiya? — I write ushr and half-ushr; and wid? — likewise, the surplus being increased; whereupon: may God cut your root from this world as you have cut Persian's root. A hundred thousand dirhams were offered him to feign inability and desist — he refused and translated it. Abd al-Hamid ibn Yahya, Marwan ibn Muhammad's scribe, would say: God reward Salih — how great his favor to the scribes; and Sahl ibn Abi al-Salt said al-Hajjaj gave Salih a deadline until he turned the diwan over."
  es: "En al-Baladhuri vía al-Mada'ini de los shaykhs de Ali ibn Muhammad ibn Abi Sayf: el diwan del kharaj de Sawad y todo Irak permanecieron en persa hasta que al-Hajjaj gobernó Irak y tomó como escriba a Zadhanfarrukh ibn Biri, quien tenía consigo a Salih ibn Abd al-Rahman —mawla de Banu Tamim cuyo padre estaba entre los cautivos de Sijistan— escribiendo ante él en árabe y persa. Zadhanfarrukh presentó a Salih a al-Hajjaj, quien lo tomó en consideración, y luego le confió su temor a ser desplazado. Salih respondió que el emir lo necesitaba más, ya que nadie más que él podía llevar sus cuentas, y ofreció: por Dios, si lo desea, podría convertir las cuentas al árabe. Convirtió la mitad para aparentar, luego fingió una enfermedad; el médico de al-Hajjaj no encontró nada malo y Zadhanfarrukh le ordenó presentarse. Cuando Zadhanfarrukh fue asesinado en tiempos de Abd al-Rahman ibn Muhammad ibn al-Ash'ath, al-Hajjaj nombró a Salih su escriba; al enterarse del intercambio anterior, decidió hacer el diwan árabe y le encargó a Salih que lo hiciera. Mardanshah ibn Zadhanfarrukh desafió: ¿qué harás por dahwiya y shashwiya? — Yo escribo ushr y medio-ushr; ¿y wid? — igualmente, siendo aumentado el excedente; entonces: que Dios corte tu raíz de este mundo como has cortado la raíz del persa. Se le ofrecieron cien mil dirhams para que fingiera incapacidad y desistiera; él se negó y lo tradujo. Abd al-Hamid ibn Yahya, escriba de Marwan ibn Muhammad, diría: Dios recompense a Salih — cuán grande es su favor a los escribas; Y Sahl ibn Abi al-Salt dijo que al-Hajjaj le dio a Salih un plazo hasta que entregara el diwan."
  fr: "D'après al-Baladhuri, transmis par al-Mada'ini et rapporté par les cheikhs d'Ali ibn Muhammad ibn Abi Sayf: le diwan du kharaj des Sawad et tout l'Irak restèrent sous administration persane jusqu'à ce qu'al-Hajjaj gouverne l'Irak et prenne pour scribe Zadhanfarrukh ibn Biri, accompagné de Salih ibn Abd al-Rahman – mawla des Banu Tamim, dont le père avait été parmi les captifs du Sijistan – qui écrivait avant lui en arabe et en persan. Zadhanfarrukh présenta Salih à al-Hajjaj, qui l'apprécia et lui confia sa crainte d'être déporté. Salih répondit que l'émir avait davantage besoin de lui, car nul autre que lui ne pouvait tenir ses comptes, et proposa: « Par Dieu, si vous le vouliez, je pourrais traduire les comptes en arabe. » Il en convertit la moitié pour faire bonne figure, puis simula la maladie; le médecin d'al-Hajjaj ne constata rien d'anormal et Zadhanfarrukh lui ordonna de se présenter. Lorsque Zadhanfarrukh fut tué du temps d'Abd al-Rahman ibn Muhammad ibn al-Ash'ath, al-Hajjaj fit de Salih son scribe. Informé de l'échange précédent, il décida de traduire le diwan en arabe et confia cette tâche à Salih. Mardanshah ibn Zadhanfarrukh le défia: « Que feras-tu pour la dahwiya et la shashwiya ? » « J'écris l'ushr et la demi-ushr; et le wid ? » « De même, le surplus étant augmenté. » Sur quoi: « Que Dieu te fasse disparaître de ce monde comme tu as fait disparaître le persan ! » On lui offrit cent mille dirhams pour qu'il feigne l'incapacité et renonce, mais il refusa et traduisit le texte. Abd al-Hamid ibn Yahya, scribe de Marwan ibn Muhammad, disait: « Que Dieu récompense Salih ! Quelle grande faveur il a accordée aux scribes ! » et Sahl ibn Abi al-Salt a dit qu'al-Hajjaj avait donné à Salih un délai pour lui remettre le diwan."
