id: event/al-hadi-adds-a-poem-to-banu-al-harith-on-the-lion-and-the-call-to-the-quran-292
class: event
kind: other
label:
  ar: "قصيدة «رميتم يا بني حار بن كعب» في دعوة الهادي إلى حكم القرآن، ص285"
  en: "The poem \"you were struck, sons of al-Harith ibn Ka'b\" on al-Hadi's call to the judgement of the Qur'an, p. 285"
  ur: "نظم «اے بنو حارث بن کعب تم پر ایک سردار نے وار کیا» ہادی کی قرآن کے حکم کی دعوت پر، ص285"
summary:
  ar: "يبدأ على ص285 أبيات أخرى للهادي إلى بني الحارث يقول فيها إنهم رُموا بسيد لا يعرف الغفلة ولا النوم، وإنه دعاهم إلى الهدى وإلى حكم القرآن وسار على نهج جديه، فجازوه بالغدر، وإنه أغمد سيفه كرماً وحلماً."
  en: "A second poem of al-Hadi to Banu al-Harith begins on p. 285: they were struck by a chief who is neither heedless nor sleepy, who called them to guidance and to the Qur'an's judgement on the path of his two grandfathers, and whom they repaid with betrayal, and who sheathed his sword out of generosity and forbearance."
  ur: "ص285 پر ہادی کی بنو حارث کے نام دوسری نظم شروع ہوتی ہے: ان پر ایسا سردار آیا جو غافل نہیں نہ سونے والا، جس نے انہیں ہدایت اور قرآن کے حکم کی طرف بلایا اور اپنے دونوں نانا دادا کی راہ پر چلا، جسے انہوں نے غدر کا بدلہ دیا، اور جس نے کرم اور حلم سے تلوار نیام میں کر لی۔"
