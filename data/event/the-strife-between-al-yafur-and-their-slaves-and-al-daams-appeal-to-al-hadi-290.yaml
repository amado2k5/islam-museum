id: event/the-strife-between-al-yafur-and-their-slaves-and-al-daams-appeal-to-al-hadi-290
class: event
kind: other
label:
  ar: "خلاف آل يعفر وعبيدهم وكتابهم إلى الدعام وتشجيعه الهادي على النهوض إلى اليمن، جمادى الأولى 290هـ"
  en: "The strife between Al Ya'fur and their slaves and al-Da'am's appeal to al-Hadi to go to Yemen, Jumada I 290 AH"
  ur: "آل یعفر اور ان کے غلاموں کا اختلاف اور دعام کی ہادی سے یمن چلنے کی درخواست، جمادی الاولیٰ 290ھ"
summary:
  ar: "وقع الخلاف بين آل يعفر وعبيدهم فكتب ابنا يعفر إلى الدعام بن إبراهيم يسألانه أن يكتب لهما إلى الهادي ويستنهضه على أن يسلّما له ما في أيديهما ويحاربا معه العبيد، فكتب الدعام إليه وهو يكره عليه النهوض ويعلمه بقلة وفاء الناس، ثم لما أكثرا عليه الكتب والرسل نهض بنفسه ولقي الهادي بأسيل على ميلين من صعدة، فنهضا يوم الأحد ليومين ماضيين من جمادى الأولى ونزلا خيوان."
  en: "Strife arose between Al Ya'fur and their slaves, and the two sons of Ya'fur wrote to al-Da'am ibn Ibrahim asking him to write to al-Hadi and urge him to march, on condition that they hand over what they held and fight the slaves with him; al-Da'am wrote, disliking the march and telling al-Hadi of the people's poor faith, and when they pressed him with letters and messengers he went himself and met al-Hadi at Asil, two miles from Sa'da; they set out together on Sunday, two days of Jumada I gone, and halted at Khiwan."
  ur: "آل یعفر اور ان کے غلاموں کے بیچ اختلاف ہوا تو یعفر کے دو بیٹوں نے دعام بن ابراہیم کو لکھا کہ ہادی کو لکھیں اور انہیں اٹھ کھڑے ہونے پر آمادہ کریں، اس شرط پر کہ وہ جو ان کے ہاتھ میں ہے ان کے سپرد کر دیں گے اور ان کے ساتھ غلاموں سے لڑیں گے؛ دعام نے لکھا مگر وہ چلنے کو ناپسند کرتے تھے اور لوگوں کی کم وفاداری سے آگاہ کرتے تھے، پھر جب انہوں نے بہت خط اور قاصد بھیجے تو وہ خود گئے اور صعدہ سے دو میل پر اسیل میں ہادی سے ملے؛ جمادی الاولیٰ کے دو دن گزرنے پر اتوار کو دونوں چلے اور خیوان اترے۔"
