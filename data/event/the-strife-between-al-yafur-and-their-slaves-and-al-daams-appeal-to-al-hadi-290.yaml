id: event/the-strife-between-al-yafur-and-their-slaves-and-al-daams-appeal-to-al-hadi-290
class: event
kind: other
label:
  ar: "خلاف آل يعفر وعبيدهم وكتابهم إلى الدعام وتشجيعه الهادي على النهوض إلى اليمن، جمادى الأولى 290هـ"
  en: "The strife between Al Ya'fur and their slaves and al-Da'am's appeal to al-Hadi to go to Yemen, Jumada I 290 AH"
  ur: "آل یعفر اور ان کے غلاموں کا اختلاف اور دعام کی ہادی سے یمن چلنے کی درخواست، جمادی الاولیٰ 290ھ"
  es: "El conflicto entre Al Ya'fur y sus esclavos y la petición de al-Da'am a al-Hadi para que fuera a Yemen, Jumada I 290 AH"
  fr: "Le conflit entre Al Ya'fur et leurs esclaves et l'appel d'al-Da'am à al-Hadi pour qu'il se rende au Yémen, Jumada I 290 AH"
  tr: "Ya'fur ailesi, köleleri ve kâtipleri arasında, el-Da'am'ın el-Hadi'yi Yemen'e yürümeye teşvik etmesiyle ilgili anlaşmazlık, Cemâde el-Ula 290 Hicri"
  id: "Perselisihan antara keluarga Ya'fur, para budak mereka, dan para juru tulis mereka mengenai al-Da'am dan dukungannya kepada al-Hadi untuk berbaris ke Yaman, Jumada al-Ula 290 H."
summary:
  ar: "وقع الخلاف بين آل يعفر وعبيدهم فكتب ابنا يعفر إلى الدعام بن إبراهيم يسألانه أن يكتب لهما إلى الهادي ويستنهضه على أن يسلّما له ما في أيديهما ويحاربا معه العبيد، فكتب الدعام إليه وهو يكره عليه النهوض ويعلمه بقلة وفاء الناس، ثم لما أكثرا عليه الكتب والرسل نهض بنفسه ولقي الهادي بأسيل على ميلين من صعدة، فنهضا يوم الأحد ليومين ماضيين من جمادى الأولى ونزلا خيوان."
  en: "Strife arose between Al Ya'fur and their slaves, and the two sons of Ya'fur wrote to al-Da'am ibn Ibrahim asking him to write to al-Hadi and urge him to march, on condition that they hand over what they held and fight the slaves with him; al-Da'am wrote, disliking the march and telling al-Hadi of the people's poor faith, and when they pressed him with letters and messengers he went himself and met al-Hadi at Asil, two miles from Sa'da; they set out together on Sunday, two days of Jumada I gone, and halted at Khiwan."
  ur: "آل یعفر اور ان کے غلاموں کے بیچ اختلاف ہوا تو یعفر کے دو بیٹوں نے دعام بن ابراہیم کو لکھا کہ ہادی کو لکھیں اور انہیں اٹھ کھڑے ہونے پر آمادہ کریں، اس شرط پر کہ وہ جو ان کے ہاتھ میں ہے ان کے سپرد کر دیں گے اور ان کے ساتھ غلاموں سے لڑیں گے؛ دعام نے لکھا مگر وہ چلنے کو ناپسند کرتے تھے اور لوگوں کی کم وفاداری سے آگاہ کرتے تھے، پھر جب انہوں نے بہت خط اور قاصد بھیجے تو وہ خود گئے اور صعدہ سے دو میل پر اسیل میں ہادی سے ملے؛ جمادی الاولیٰ کے دو دن گزرنے پر اتوار کو دونوں چلے اور خیوان اترے۔"
  es: "Surgió una disputa entre Al Ya'fur y sus esclavos, y los dos hijos de Ya'fur escribieron a al-Da'am ibn Ibrahim pidiéndole que escribiera a al-Hadi y lo instara a marchar, con la condición de que le entregaran lo que poseían y lucharan con él contra los esclavos. Al-Da'am escribió, desaprobando la marcha y hablando con al-Hadi sobre la poca fe del pueblo, y cuando lo presionaron con cartas y mensajeros, él mismo fue y se reunió con al-Hadi en Asil, a dos millas de Sa'da. Partieron juntos el domingo, dos días después del Jumada I, y se detuvieron en Khiwan."
  fr: "Des conflits éclatèrent entre Al Ya'fur et leurs esclaves, et les deux fils de Ya'fur écrivirent à al-Da'am ibn Ibrahim pour lui demander d'écrire à al-Hadi et de l'inciter à marcher, à condition qu'ils lui remettent ce qu'ils possédaient et combattent les esclaves à ses côtés; al-Da'am écrivit, réticent à la marche et faisant part à al-Hadi de la piètre foi du peuple, et lorsqu'ils le pressèrent de lettres et de messagers, il partit lui-même et rencontra al-Hadi à Asil, à deux milles de Sa'da; ils partirent ensemble le dimanche, deux jours après Jumada, et s'arrêtèrent à Khiwan."
  tr: "Yafur ailesi ile köleleri arasında bir anlaşmazlık çıktı. Yafur'un iki oğlu, Al-Da'am bin İbrahim'e mektup yazarak, kendileri adına Al-Hadi'ye yazmasını ve ellerindeki malları teslim etmesi ve kölelere karşı onunla birlikte savaşması için onu ikna etmesini istediler. Al-Da'am ona mektup yazdı, ancak ayaklanması konusunda isteksizdi ve halk arasında sadakat eksikliğinden bahsetti. Bunun üzerine, kendisine gönderilen mektup ve elçi sayısı artınca, kendisi ayaklandı ve Sa'de'den iki mil uzaklıktaki Asil'de Al-Hadi ile buluştu. Cemâdeü'l-Ula ayından iki gün sonra, Pazar günü ayaklandılar ve Hayvan'a indiler."
  id: "Perselisihan muncul antara keluarga Ya'fur dan para budak mereka. Kedua putra Ya'fur menulis surat kepada Al-Da'am bin Ibrahim, memintanya untuk menulis surat kepada Al-Hadi atas nama mereka dan mendesaknya untuk menyerahkan apa yang ada di tangan mereka dan berperang bersamanya melawan para budak. Al-Da'am membalas suratnya, meskipun ia enggan agar ia memberontak dan memberitahukannya tentang kurangnya kesetiaan di antara orang-orang. Kemudian, ketika mereka menambah jumlah surat dan utusan kepadanya, ia sendiri memberontak dan bertemu Al-Hadi di Asil, dua mil dari Sa'dah. Mereka memberontak pada hari Minggu, dua hari setelah bulan Jumada al-Ula, dan pergi ke Khaywan."
