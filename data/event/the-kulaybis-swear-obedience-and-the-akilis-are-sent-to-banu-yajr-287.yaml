id: event/the-kulaybis-swear-obedience-and-the-akilis-are-sent-to-banu-yajr-287
class: event
kind: other
label:
  ar: "الكليبيون يحلفون على السمع والطاعة ويُطرد الأكيليون إلى بني يجر، 287هـ"
  en: "The Kulaybis swear obedience and the Akilis are driven to Banu Yajr, 287 AH"
  ur: "کلیبی سمع و طاعت کا حلف اٹھاتے ہیں اور اکیلی بنو یجر کی طرف نکالے جاتے ہیں، 287ھ"
summary:
  ar: "يطلب الكليبيون أن يرسل إليهم الهادي جماعة من اليرسميين، ثم يعتذرون عنده بصعدة فيقبل منهم ويستحلفهم على السمع والطاعة، فيطردون الأكيليين إلى بلاد بني يجر ويبقى معهم سليمان بن حجر، ثم ينزل بقية الكليبيين فيعفو عنهم ويرسل العمال لجباية الصدقات."
  en: "The Kulaybis ask al-Hadi to send some Yarsamis to speak with them, then come to Sa'da to apologise; he accepts, has them swear hearing and obedience, and they drive the Akilis to the land of Banu Yajr, where Sulayman ibn Hajar stays with them; the rest of the Kulaybis come down, are pardoned, and collectors go with them to gather the alms."
  ur: "کلیبی ہادی سے کہتے ہیں کہ یرسمیوں کی ایک جماعت ان سے بات کرنے بھیجیں، پھر صعدہ آ کر معذرت کرتے ہیں؛ وہ قبول کرتے اور ان سے سمع و طاعت کا حلف لیتے ہیں، وہ اکیلیوں کو بنو یجر کی سرزمین کی طرف نکال دیتے ہیں جہاں سلیمان بن حجر ان کے ساتھ رہتا ہے؛ باقی کلیبی اتر آتے ہیں، معاف کیے جاتے ہیں اور صدقات وصول کرنے کے لیے عامل ان کے ساتھ بھیجے جاتے ہیں۔"
