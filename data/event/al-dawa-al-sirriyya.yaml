id: event/al-dawa-al-sirriyya
education:
  levels: [sprouts, explorers, scholars]
  flagged_for_kids: true
  did_you_know:
    ar: "دامت الدعوة سراً ثلاث سنين آمن فيها الرعيل الأول — خديجة وعلي وزيد وأبو بكر في اليوم الأول كما يروي الرحيق."
    en: "The call stayed private for three years, during which the first band believed — Khadija, Ali, Zayd and Abu Bakr on the very first day, as al-Rahiq relates."
    ur: "دعوت تین سال خفیہ رہی جس میں پہلا گروہ ایمان لایا — پہلے ہی دن خدیجہ، علی، زید اور ابوبکر، جیسا کہ الرحیق بیان کرتا ہے۔"
    sources: [source/mubarakpuri-raheeq, source/ibn-hisham-sira]
class: event
kind: other
label: { en: "The three years of the secret call", ar: "ثلاث سنوات من الدعوة السرية" }
summary:
  en: "The first stage of the call to Islam — individual and secret for three years — in which the first band believed: Khadija, Ali, Zayd and Abu Bakr on the first day, then those whom Abu Bakr called, then a company Ibn Hisham numbers at over forty from every clan of Quraysh; during it prayer was first prescribed."
  ar: "المرحلة الأولى من مراحل الدعوة: دعوة فردية سرية دامت ثلاث سنين آمن فيها الرعيل الأول — خديجة وعلي وزيد وأبو بكر في أول يوم، ثم من أسلم بدعوة أبي بكر، ثم جماعة عدّها ابن هشام أكثر من أربعين من جميع بطون قريش؛ وفيها فرضت الصلاة أولاً."
