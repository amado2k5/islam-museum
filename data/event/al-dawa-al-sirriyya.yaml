significance:
  ar: "فيها تكونت جماعة المؤمنين الأولى على الأخوة والتعاون وتبليغ الرسالة سراً؛ وكان المسلمون يصلون في الشعاب مستخفين من قومهم (الرحيق ص76-77؛ ابن هشام 1/247)."
