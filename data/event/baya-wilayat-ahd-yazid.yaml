id: event/baya-wilayat-ahd-yazid
class: event
kind: declaration
label: { ar: "البيعة ليزيد بولاية العهد" }
summary:
  ar: "دعا معاوية أهل الشام إلى البيعة بولاية العهد لابنه يزيد فبايعوه في سنة خمسين في رواية وقيل أخرى سنة ست وخمسين، وهو أول من عهد بالخلافة لابنه وأول من عهد بها في صحته، وكتب إلى مروان بالمدينة أن يأخذ البيعة فخطب فقال إن أمير المؤمنين رأى أن يستخلف عليكم ولده يزيد سنة أبي بكر وعمر، فقام عبد الرحمن بن أبي بكر فقال بل سنة كسرى وقيصر إن أبا بكر وعمر لم يجعلاها في أولادهما ولا في أحد من أهل بيتهما {cite:tarikh-khulafa-minhaj-1434 p. 326}. ثم حج معاوية سنة إحدى وخمسين وأخذ البيعة لابنه فوعظ ابن عمر فأجابه بأن الخلفاء قبله كانت لهم أبناء فلم يروا فيهم ما رأى في ابنه وأنه رجل من المسلمين فإذا اجتمعوا على أمر فهو منهم، وقطع على ابن أبي بكر كلامه فوثب قائلاً والله لتردن هذا الأمر شورى في المسلمين أو لنفرقنها عليك جذعة، وقال لابن الزبير إنما أنت ثعلب رواغ كلما خرج من جحر دخل آخر، فأجابه ابن الزبير إن كنت قد مللت الإمارة فاعتزلها وهلم ابنك فلنبايعه أرأيت إذا بايعت ابنك معك لأيكما نسمع ونطيع، ثم صعد معاوية المنبر فأعلن أنهم قد سمعوا وأطاعوا وبايعوا وأهل الشام يطلبونها على رؤوس الأشهاد، والناس يقولون بايعوا وهم يقولون لا والله ما بايعنا {cite:tarikh-khulafa-minhaj-1434 p. 326-327}."
  en: "Mu'awiya summoned the Syrians to pledge the succession to his son Yazid — the first to bequeath the caliphate to a son and the first to do so in his own lifetime — and wrote to Marwan at Medina to take the pledge. Marwan preached that the caliph wished to appoint Yazid 'after the manner of Abu Bakr and Umar'; Abd al-Rahman ibn Abi Bakr rose: 'rather after the manner of Chosroes and Caesar — neither of them gave it to a son or any of their house'. When Muawiya made the hajj in 51 he took the pledge in person: Ibn Umar answered that earlier caliphs had sons no worse than Yazid yet chose for the Muslims, while disclaiming any wish to break the community's staff; Ibn Abi Bakr leapt up vowing to return the matter to shura; Ibn al-Zubayr retorted 'if you are weary of rule, retire and bring your son — whom would we obey if we pledged you both?'. Muawiya then announced from the minbar that the three had 'heard, obeyed and pledged' — which the crowd affirmed and they denied {cite:tarikh-khulafa-minhaj-1434 p. 326-327}."
