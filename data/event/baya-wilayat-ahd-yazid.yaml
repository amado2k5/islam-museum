label: { ar: "البيعة ليزيد بولاية العهد", en: "The pledge to Yazid as heir apparent", fr: "L'allégeance à Yazid comme héritier présomptif", es: "La promesa a Yazid como heredero aparente" }
summary:
  ar: "دعا معاوية أهل الشام إلى البيعة بولاية العهد لابنه يزيد فبايعوه في سنة خمسين في رواية وقيل أخرى سنة ست وخمسين، وهو أول من عهد بالخلافة لابنه وأول من عهد بها في صحته، وكتب إلى مروان بالمدينة أن يأخذ البيعة فخطب فقال إن أمير المؤمنين رأى أن يستخلف عليكم ولده يزيد سنة أبي بكر وعمر، فقام عبد الرحمن بن أبي بكر فقال بل سنة كسرى وقيصر إن أبا بكر وعمر لم يجعلاها في أولادهما ولا في أحد من أهل بيتهما {cite:tarikh-khulafa-minhaj-1434 p. 326}. ثم حج معاوية سنة إحدى وخمسين وأخذ البيعة لابنه فوعظ ابن عمر فأجابه بأن الخلفاء قبله كانت لهم أبناء فلم يروا فيهم ما رأى في ابنه وأنه رجل من المسلمين فإذا اجتمعوا على أمر فهو منهم، وقطع على ابن أبي بكر كلامه فوثب قائلاً والله لتردن هذا الأمر شورى في المسلمين أو لنفرقنها عليك جذعة، وقال لابن الزبير إنما أنت ثعلب رواغ كلما خرج من جحر دخل آخر، فأجابه ابن الزبير إن كنت قد مللت الإمارة فاعتزلها وهلم ابنك فلنبايعه أرأيت إذا بايعت ابنك معك لأيكما نسمع ونطيع، ثم صعد معاوية المنبر فأعلن أنهم قد سمعوا وأطاعوا وبايعوا وأهل الشام يطلبونها على رؤوس الأشهاد، والناس يقولون بايعوا وهم يقولون لا والله ما بايعنا {cite:tarikh-khulafa-minhaj-1434 p. 326-327}."
  en: "Mu'awiya summoned the Syrians to pledge the succession to his son Yazid — the first to bequeath the caliphate to a son and the first to do so in his own lifetime — and wrote to Marwan at Medina to take the pledge. Marwan preached that the caliph wished to appoint Yazid 'after the manner of Abu Bakr and Umar'; Abd al-Rahman ibn Abi Bakr rose: 'rather after the manner of Chosroes and Caesar — neither of them gave it to a son or any of their house'. When Muawiya made the hajj in 51 he took the pledge in person: Ibn Umar answered that earlier caliphs had sons no worse than Yazid yet chose for the Muslims, while disclaiming any wish to break the community's staff; Ibn Abi Bakr leapt up vowing to return the matter to shura; Ibn al-Zubayr retorted 'if you are weary of rule, retire and bring your son — whom would we obey if we pledged you both?'. Muawiya then announced from the minbar that the three had 'heard, obeyed and pledged' — which the crowd affirmed and they denied {cite:tarikh-khulafa-minhaj-1434 p. 326-327}."
  fr: "Mu'awiya convoqua les Syriens pour prêter allégeance à la succession de son fils Yazid, le premier à léguer le califat à un fils et le premier à le faire de son vivant, et écrivit à Marwan à Médine de recueillir l'allégeance. Marwan prêcha que le calife voulait désigner Yazid « à la manière d'Abu Bakr et d'Umar » ; Abd al-Rahman ibn Abi Bakr se leva : « plutôt à la manière de Chosroès et de César ; aucun d'eux ne l'a donnée à un fils ni à quelqu'un de sa maison ». Quand Mu'awiya fit le pèlerinage en 51, il recueillit l'allégeance en personne : Ibn Umar répondit que les califes précédents avaient des fils qui ne valaient pas moins que Yazid et choisirent pourtant pour les musulmans, tout en se défendant de vouloir briser l'unité de la communauté ; Ibn Abi Bakr bondit en jurant de rendre l'affaire à la shura ; Ibn al-Zubayr répliqua : « si tu es las du pouvoir, retire-toi et amène ton fils ; à qui obéirions-nous si nous vous prêtions allégeance à tous deux ? ». Mu'awiya annonça alors du haut du minbar que les trois avaient « entendu, obéi et prêté allégeance », ce que la foule confirma et qu'ils nièrent {cite:tarikh-khulafa-minhaj-1434 p. 326-327}."
  es: "Mu'awiya convocó a los sirios para que juraran la sucesión a su hijo Yazid —el primero en legar el califato a un hijo y el primero en hacerlo en vida— y escribió a Marwan en Medina para que tomara el juramento. Marwan predicó que el califa deseaba nombrar a Yazid «a la manera de Abu Bakr y Umar»; Abd al-Rahman ibn Abi Bakr se levantó: «más bien a la manera de Cosroes y César — ninguno de ellos se lo dio a un hijo ni a nadie de su casa». Cuando Muawiya hizo el Hajj en el 51 tomó el juramento en persona: Ibn Umar respondió que los califas anteriores tuvieron hijos no peores que Yazid, pero eligieron para los musulmanes, mientras que negó cualquier deseo de romper el personal de la comunidad; Ibn Abi Bakr se levantó de un salto prometiendo devolver el asunto a la shura; Ibn al-Zubayr replicó: «Si estáis cansados de gobernar, retiraos y traed a vuestro hijo; ¿a quién obedeceríamos si os juráramos lealtad a ambos?». Entonces Muawiya anunció desde el púlpito que los tres habían «escuchado, obedecido y jurado lealtad», lo cual la multitud afirmó y ellos negaron {cite:tarikh-khulafa-minhaj-1434 p. 326-327}."
