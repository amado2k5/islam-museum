label: { ar: "حصار مالقة وأسر أهلها", en: "Siege of Malaga and the captivity of its people", es: "El asedio de Málaga y el cautiverio de su gente.", fr: "Le siège de Malaga et la captivité de sa population", ur: "ملاگا کا محاصرہ اور اس کے لوگوں کی اسیری", tr: "Malaga kuşatması ve halkının esir alınması", id: "Pengepungan Malaga dan penangkapan penduduknya" }
summary:
  ar: "في سنة اثنتين وتسعين وثمانمائة نازل النصارى مالقة براً وبحراً فقاتلهم أهلها قتالاً عظيماً بالمدافع والعدة والخيل والرجل، وطال الحصار حتى أداروا عليها من البر الحنادق والسور والأجفان من البحر ومنعوا الداخل إليها، ولم يدخلها غير جماعة من المرابطين حال الحصار، وضاقوا بالحصار حتى فني ما عندهم من الطعام فأكلوا المواشي والخيل والحمير، وبعثوا الكتب للعدوتين طامعين في الإغاثة فلم يأت إليهم أحد وأثر فيهم الجوع وفشا في أهل نجدتهم القتل ولم يظهروا مع ذلك ملعاً ولا ضعفاً، حتى إذا يئسوا من ناصر أو مغيث من البر والبحر تكلموا مع النصارى في الأمان فقيل لهم لا تحقق العدو التجاءهم، ووُعدوا تأمينهم من الموت إن أعطوا مفتاح القلعة والحصن فلما فعلوا وتمكن العدو منهم أخذهم أسرى، وذلك أواخر شعبان سنة اثنتين وتسعين وثمانمائة، ولم يبق في تلك النواحي موضع إلا وملكه النصارى {cite:nafh-tib-maqqari p. 520-521}."
  en: "In 892 the Christians besieged Malaga by land and sea; its people fought with cannon, horse and foot until the food ran out and they ate beasts, horses and donkeys, wrote to both shores for relief and got none — promised safety, they surrendered the citadel keys in late Sha'ban and were taken captive, a deception the chronicler calls the infidels' trickery {cite:nafh-tib-maqqari p. 520-521}."
  es: "En 892, los cristianos sitiaron Málaga por tierra y mar; su gente luchó con cañones, caballos e infantería hasta que se les acabó la comida y comieron animales, caballos y asnos, escribieron a ambas costas pidiendo ayuda y no la recibieron; les prometieron seguridad, entregaron las llaves de la ciudadela a finales de Sha'ban y fueron hechos prisioneros, un engaño que el cronista llama la astucia de los infieles {cite:nafh-tib-maqqari p. 520-521}."
  fr: "En 892, les chrétiens assiégèrent Malaga par terre et par mer; ses habitants combattirent avec des canons, des chevaux et des fantassins jusqu'à ce que les vivres soient épuisés et qu'ils mangent des bêtes, des chevaux et des ânes, écrivirent aux deux rives pour obtenir de l'aide et n'en obtinrent aucune — la sécurité leur ayant été promise, ils rendirent les clés de la citadelle à la fin du mois de Sha'ban et furent faits prisonniers, une tromperie que le chroniqueur appelle la ruse des infidèles {cite:nafh-tib-maqqari p. 520-521}."
  ur: "892 میں عیسائیوں نے ملاگا کا زمینی اور سمندری راستے سے محاصرہ کیا۔ اس کے لوگ توپوں، گھوڑوں اور پیروں سے لڑتے رہے یہاں تک کہ کھانا ختم ہو گیا اور انہوں نے درندے، گھوڑے اور گدھے کھا لیے، دونوں ساحلوں کو امداد کے لیے خط لکھے لیکن کوئی بھی حفاظت کا وعدہ نہیں کیا، انہوں نے شعبان کے اواخر میں قلعہ کی چابیاں حوالے کر دیں اور اسیر ہو گئے، ایک دھوکے کو مؤرخ کافروں کی چالبازی کہتا ہے۔ 520-521}۔"
  tr: "Hicri 892 yılında (Miladi 1492), Hristiyanlar Malaga'yı karadan ve denizden kuşattılar. Şehir sakinleri, toplar, zırhlar, atlar ve piyadelerle onlara karşı şiddetli bir şekilde savaştılar. Kuşatma, şehir karadan ve denizden hendekler, duvarlar ve toprak setlerle çevrilip kimsenin içeri girmesine izin verilmeyene kadar sürdü. Kuşatma sırasında sadece küçük bir savunmacı grubu içeri girmeyi başardı. Kuşatma dayanılmaz hale geldi ve yiyecekleri tükenince, hayvanları, atları ve eşekleri yemek zorunda kaldılar. Yardım umuduyla boğazın her iki tarafına da mektuplar gönderdiler, ancak kimse gelmedi. Açlık can aldı ve yardıma gelenler arasında ölüm yayıldı. Yine de, zayıflık veya umutsuzluk belirtisi göstermediler. Karadan veya denizden herhangi bir yardım veya kurtarıcıdan umutlarını kestiklerinde, güvenli geçiş için Hristiyanlara başvurdular. Düşmanın sığınaklarını tanımayacağı söylendi ve kalenin ve hisarın anahtarlarını teslim etmeleri halinde ölümden korunacaklarına dair söz verildi. Bunu yaptıklarında ve düşman kontrolü ele geçirdiğinde, esir alındılar. Bu olay Hicri 892 yılının Şaban ayının sonunda (Miladi 1492) gerçekleşti. O bölgelerde Hristiyanların kontrolü dışında hiçbir yer kalmamıştı. {kaynak:nafh-tib-maqqari s. 520-521}"
  id: "Pada tahun 892 H (1492 M), umat Kristen mengepung Malaga melalui darat dan laut. Penduduknya melawan mereka dengan sengit menggunakan meriam, baju besi, kuda, dan pasukan infanteri. Pengepungan berlangsung lama hingga kota itu dikelilingi oleh parit, tembok, dan tanggul di darat dan laut, mencegah siapa pun untuk masuk. Hanya sekelompok kecil pembela yang berhasil masuk selama pengepungan. Pengepungan menjadi tak tertahankan hingga makanan mereka habis, memaksa mereka untuk memakan ternak, kuda, dan keledai. Mereka mengirim surat ke kedua sisi Selat, berharap mendapat bantuan, tetapi tidak ada yang datang. Kelaparan merenggut banyak korban, dan kematian menyebar di antara mereka yang datang untuk membantu. Namun, mereka tidak menunjukkan tanda-tanda kelemahan atau keputusasaan. Ketika mereka putus asa karena tidak ada penolong atau penyelamat dari darat atau laut, mereka mendekati umat Kristen untuk meminta jalan aman. Mereka diberitahu bahwa musuh tidak akan mengenali tempat perlindungan mereka, dan mereka dijanjikan perlindungan dari kematian jika mereka menyerahkan kunci benteng dan kubu pertahanan. Ketika mereka melakukannya, dan musuh menguasai kota, mereka ditawan. Peristiwa ini terjadi pada akhir bulan Sya'ban tahun 892 Hijriah (1492 M). Tidak ada lagi tempat di wilayah tersebut yang tidak berada di bawah kendali Kristen. {cite:nafh-tib-maqqari hlm. 520-521}."
