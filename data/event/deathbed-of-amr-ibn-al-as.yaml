id: event/deathbed-of-amr-ibn-al-as
class: event
kind: death
label:
  ar: احتضار عمرو بن العاص بمصر ووصيته في دفنه
  en: Deathbed of Amr ibn al-As in Egypt and his instructions for his burial
  ur: مصر میں عمرو بن العاص کا آخری وقت اور تدفین کے بارے میں ان کی وصیت
  es: "El lecho de muerte de Amr ibn al-As en Egipto y sus instrucciones para su entierro."
summary:
  ar: "بكى عمرو بن العاص حين حضرته الوفاة، فقال له ابنه عبد الله ما يبكيك أجزعاً على الموت، فقال لا والله ولكن مما بعد الموت، وذكر أنه كان على ثلاثة أطباق: أشد الناس بغضاً للنبي، ثم أشد الناس حياءً منه بعد إسلامه، ثم تلبس بالسلطان وأشياء لا يدري أعليه هي أم له {cite:al-bidaya-wal-nihaya scan vol. 4 p. 390}. وأوصى ألا تصحبه نائحة ولا نار، وأن يُشدّ عليه إزاره، وأن يُسَنّ عليه التراب سناً، وألا يوضع في قبره خشبة ولا حجر، وأن يقيموا عند قبره قدر ما تُنحر جزور ويُقسم لحمها حتى يستأنس بهم {cite:al-bidaya-wal-nihaya scan vol. 4 p. 390}. وعند ابن سعد أنه أوصى بثلاث غسلات إحداها بكافور {cite:tabaqat-ibn-sad scan vol. 5 p. 41}. وتوفي بمصر ليلة عيد الفطر، فصلى عليه ابنه عبد الله ودُفن بالمقطم ثم صلى العيد {cite:usd-al-ghaba scan vol. 1 p. 943}."
  en: "As death came Amr ibn al-As wept; his son Abdallah asked whether it was dread of death, and he said no, by God, but what comes after death; he explained that he had passed through three states: the one who hated the Prophet most, then the one most ashamed before him after accepting Islam, then one who took on rule and other things without knowing whether they counted for or against him {cite:al-bidaya-wal-nihaya scan vol. 4 p. 390}. He instructed that no wailing woman or fire accompany him, that his waist-wrapper be tied tight, that earth be poured over him from all sides, that no wood or stone be put in his grave, and that they stay by it as long as it takes to slaughter a camel and divide its meat, so that he might take comfort in their company {cite:al-bidaya-wal-nihaya scan vol. 4 p. 390}. In Ibn Sa'd he also gave instructions for three washings, the last with camphor {cite:tabaqat-ibn-sad scan vol. 5 p. 41}. He died in Egypt on the night of the Eid al-Fitr; his son Abdallah prayed over him, he was buried at al-Muqattam, and Abdallah then led the festival prayer {cite:usd-al-ghaba scan vol. 1 p. 943}."
  ur: "موت کے وقت عمرو بن العاص نے گریہ کیا؛ ان کے بیٹے عبداللہ نے پوچھا کہ کیا موت کی گھبراہٹ سے رو رہے ہیں تو بولے نہیں بخدا، بلکہ موت کے بعد کے معاملے سے؛ انھوں نے بتایا کہ وہ تین حالتوں سے گزرے: پہلے وہ نبی سے سب سے زیادہ بغض رکھنے والے تھے، پھر اسلام لانے کے بعد ان سے سب سے زیادہ حیا کرنے والے، پھر حکومت اور دیگر چیزوں میں پڑ گئے جن کے بارے میں نہیں جانتے کہ وہ ان کے حق میں ہیں یا خلاف {cite:al-bidaya-wal-nihaya scan vol. 4 p. 390}. انھوں نے وصیت کی کہ ان کے ساتھ نہ نوحہ کرنے والی عورت ہو نہ آگ، ان کا ازار کس کر باندھا جائے، ان پر ہر طرف سے مٹی ڈالی جائے، قبر میں نہ لکڑی ڈالی جائے نہ پتھر، اور وہ قبر کے پاس اتنی دیر ٹھہریں جتنی دیر میں اونٹ ذبح کر کے اس کا گوشت بانٹا جاتا ہے تاکہ ان سے انس رہے {cite:al-bidaya-wal-nihaya scan vol. 4 p. 390}. ابن سعد کے ہاں انھوں نے تین غسلوں کی وصیت کی جن میں آخری کافور کے ساتھ ہو {cite:tabaqat-ibn-sad scan vol. 5 p. 41}. وہ مصر میں عیدالفطر کی رات فوت ہوئے، ان کے بیٹے عبداللہ نے نماز پڑھائی، مقطم میں دفن ہوئے اور پھر عبداللہ نے عید کی نماز پڑھائی {cite:usd-al-ghaba scan vol. 1 p. 943}."
  es: "Cuando se acercaba la muerte, Amr ibn al-As lloró; su hijo Abdallah le preguntó si era temor a la muerte, y él dijo que no, por Dios, sino por lo que viene después de la muerte; explicó que había pasado por tres estados: el que más odiaba al Profeta, luego el que más se avergonzaba ante él después de aceptar el Islam, y luego el que asumió el gobierno y otras cosas sin saber si contaban a su favor o en su contra {cite:al-bidaya-wal-nihaya scan vol. 4 p. 390}. Instruyó que ninguna mujer que lloraba ni fuego lo acompañaran, que su faja estuviera bien atada, que se le echara tierra por todos lados, que no se pusiera madera ni piedra en su tumba, y que permanecieran junto a ella el tiempo que se tarda en sacrificar un camello y repartir su carne, para que pudiera encontrar consuelo en su compañía {cite:al-bidaya-wal-nihaya scan vol. 4 p. 390}. En Ibn Sa'd también dio instrucciones para tres lavados, el último con alcanfor {cite:tabaqat-ibn-sad scan vol. 5 p. 41}. Murió en Egipto la noche del Eid al-Fitr; su hijo Abdallah oró por él, fue enterrado en al-Muqattam, y luego Abdallah dirigió la oración festiva {cite:usd-al-ghaba scan vol. 1 p. 943}."
