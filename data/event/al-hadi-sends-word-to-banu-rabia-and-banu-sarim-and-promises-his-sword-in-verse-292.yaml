id: event/al-hadi-sends-word-to-banu-rabia-and-banu-sarim-and-promises-his-sword-in-verse-292
class: event
kind: other
label:
  ar: "قصيدة للهادي من الكامل: رسالة إلى سراة بني ربيعة وبني صريم، ص326 إلى ص327"
  en: "A poem of al-Hadi in the kamil metre: word to the chiefs of Banu Rabi'a and Banu Sarim, pp. 326 to 327"
  ur: "ہادی کی کامل بحر میں نظم: بنو ربیعہ اور بنو صریم کے سرداروں کے نام پیغام، ص326 تا ص327"
summary:
  ar: "قصيدة من الكامل تحت عنوان «وله أيضاً» في ص326، يطلب فيها الهادي من راكب ناقة أن يبلغ سراة بني ربيعة وبني صريم أنهم نصره ورجاله، فيثني على نصرتهم لآل محمد ووفائهم بالبيعتين، ويقول إن صنائعهم لا تضيع عنده، وإن له في نصرتهم حظين، أحدهما في الدنيا والآخر عند القيامة في جوار محمد؛ وتتصل الأبيات بأول ص327."
  en: "A poem in the kamil metre under the heading \"and also of his\" on p. 326, in which al-Hadi asks a rider on a she-camel to carry word to the chiefs of Banu Rabi'a and Banu Sarim that they are his help and his men; he praises their aid to the family of Muhammad and their faithfulness to the two pledges, says their good deeds are not lost with him, and speaks of two portions in their aid, one in this world and one at the resurrection in the neighbourhood of Muhammad; the lines run on into the top of p. 327."
  ur: "کامل بحر میں نظم، عنوان «اور اس کا یہ بھی» کے تحت ص326 پر، جس میں ہادی ایک اونٹنی سوار سے کہتے ہیں کہ بنو ربیعہ اور بنو صریم کے سرداروں تک پیغام پہنچائے کہ وہ ان کے مددگار اور ان کے آدمی ہیں؛ وہ آلِ محمد کی نصرت اور دونوں بیعتوں کی پاسداری پر ان کی تعریف کرتے ہیں، کہتے ہیں کہ ان کے احسان ان کے ہاں ضائع نہیں ہوتے، اور ان کی مدد میں دو حصوں کا ذکر کرتے ہیں، ایک دنیا میں اور دوسرا قیامت کے دن محمد کے جوار میں؛ اشعار ص327 کے آغاز تک جاتے ہیں۔"
