label:
  ar: "قصيدة للهادي من الكامل: رسالة إلى سراة بني ربيعة وبني صريم، ص326 إلى ص327"
  en: "A poem of al-Hadi in the kamil metre: word to the chiefs of Banu Rabi'a and Banu Sarim, pp. 326 to 327"
  ur: "ہادی کی کامل بحر میں نظم: بنو ربیعہ اور بنو صریم کے سرداروں کے نام پیغام، ص326 تا ص327"
  es: "Un poema de al-Hadi en metro kamil: mensaje a los jefes de Banu Rabi'a y Banu Sarim, págs. 326 a 327."
  fr: "Poème d'al-Hadi en mètre kamil: message aux chefs des Banu Rabi'a et des Banu Sarim, pp. 326 à 327"
  tr: "El-Hadi'nin Kamil vezninde yazdığı bir şiir: Beni Rabi'ah ve Beni Sarim önderlerine mektup, s. 326-327"
  id: "Puisi karya Al-Hadi dalam meter Kamil: Surat kepada para pemimpin Bani Rabi'ah dan Bani Sarim, hlm. 326-327"
summary:
  ar: "قصيدة من الكامل تحت عنوان «وله أيضاً» في ص326، يطلب فيها الهادي من راكب ناقة أن يبلغ سراة بني ربيعة وبني صريم أنهم نصره ورجاله، فيثني على نصرتهم لآل محمد ووفائهم بالبيعتين، ويقول إن صنائعهم لا تضيع عنده، وإن له في نصرتهم حظين، أحدهما في الدنيا والآخر عند القيامة في جوار محمد؛ وتتصل الأبيات بأول ص327."
  en: "A poem in the kamil metre under the heading \"and also of his\" on p. 326, in which al-Hadi asks a rider on a she-camel to carry word to the chiefs of Banu Rabi'a and Banu Sarim that they are his help and his men; he praises their aid to the family of Muhammad and their faithfulness to the two pledges, says their good deeds are not lost with him, and speaks of two portions in their aid, one in this world and one at the resurrection in the neighbourhood of Muhammad; the lines run on into the top of p. 327."
  ur: "کامل بحر میں نظم، عنوان «اور اس کا یہ بھی» کے تحت ص326 پر، جس میں ہادی ایک اونٹنی سوار سے کہتے ہیں کہ بنو ربیعہ اور بنو صریم کے سرداروں تک پیغام پہنچائے کہ وہ ان کے مددگار اور ان کے آدمی ہیں؛ وہ آلِ محمد کی نصرت اور دونوں بیعتوں کی پاسداری پر ان کی تعریف کرتے ہیں، کہتے ہیں کہ ان کے احسان ان کے ہاں ضائع نہیں ہوتے، اور ان کی مدد میں دو حصوں کا ذکر کرتے ہیں، ایک دنیا میں اور دوسرا قیامت کے دن محمد کے جوار میں؛ اشعار ص327 کے آغاز تک جاتے ہیں۔"
  es: "Un poema en metro kamil bajo el título \"y también suyo\" en la página 326, en el que al-Hadi pide a un jinete en una camella que lleve un mensaje a los jefes de Banu Rabi'a y Banu Sarim diciéndoles que son su ayuda y sus hombres; alaba su ayuda a la familia de Muhammad y su fidelidad a las dos promesas, dice que sus buenas obras no se pierden con él y habla de dos partes en su ayuda, una en este mundo y otra en la resurrección en las cercanías de Muhammad; los versos continúan hasta la parte superior de la página 327."
  fr: "Un poème en mètre kamil, sous le titre « et aussi de lui » à la page 326, dans lequel al-Hadi demande à un cavalier sur une chamelle de porter un message aux chefs de Banu Rabi'a et de Banu Sarim qu'ils sont son aide et ses hommes; il loue leur aide à la famille de Muhammad et leur fidélité aux deux serments, dit que leurs bonnes actions ne sont pas perdues avec lui, et parle de deux parts dans leur aide, l'une dans ce monde et l'autre lors de la résurrection dans le voisinage de Muhammad; les vers se poursuivent en haut de la page 327."
  tr: "326. sayfada yer alan ve Kamil ölçüsüyle yazılmış “Ve onun için de” başlıklı şiirde, Al-Hadi bir deve binicisinden Beni Rabi’ah ve Beni Sarim liderlerine kendisinin destekçileri ve adamları olduklarını bildirmesini ister. Muhammed ailesine verdikleri desteği ve iki yemine olan bağlılıklarını över ve amellerinin kendisi için kaybolmadığını, desteklerinden iki payı olduğunu söyler: biri bu dünyada, diğeri ise kıyamette Muhammed’in yanında olacaktır; ve dizeler 327. sayfanın başına bağlanır."
  id: "Sebuah puisi dalam meter Kamil berjudul “Dan untuknya juga” di halaman 326, di mana Al-Hadi meminta seorang penunggang unta untuk memberitahu para pemimpin Bani Rabi’ah dan Bani Sarim bahwa mereka adalah pendukung dan pengikutnya. Dia memuji dukungan mereka untuk keluarga Muhammad dan kesetiaan mereka pada dua sumpah, dan mengatakan bahwa amal perbuatan mereka tidak akan hilang bersamanya, dan bahwa dia memiliki dua bagian dalam dukungan mereka, satu di dunia ini dan yang lainnya di Hari Kiamat di dekat Muhammad; dan bait-bait tersebut terhubung ke awal halaman 327."
