summary:
  ar: "بطاقة أولية لحصار بغداد سنة ١٨٢١م، تقدم جيش محمد علي ميرزا القاجاري نحو المدينة العثمانية في حرب ١٨٢١؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the advance on Baghdad in 1821, Muhammad Ali Mirza Qajar's move against the Ottoman city in the war of 1821–23; its sources are not yet checked on the page."
  es: "Borrador del plan para el avance sobre Bagdad en 1821, la ofensiva de Muhammad Ali Mirza Qajar contra la ciudad otomana en la guerra de 1821-23; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour l'avancée sur Bagdad en 1821, l'offensive de Muhammad Ali Mirza Qajar contre la ville ottomane pendant la guerre de 1821-1823; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1821 میں بغداد پر پیش قدمی کے لیے ڈرافٹ کارڈ، محمد علی مرزا قاجار کا 1821-23 کی جنگ میں عثمانی شہر کے خلاف اقدام؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1821 yılında Bağdat kuşatmasının ön haritası; Muhammed Ali Mirza Kaçar'ın ordusunun 1821 savaşında Osmanlı kentine doğru ilerleyişini göstermektedir; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Peta pendahuluan pengepungan Baghdad pada tahun 1821 M, pergerakan pasukan Muhammad Ali Mirza Qajar menuju kota Ottoman dalam perang tahun 1821; sumbernya belum ditinjau di halaman ini."
