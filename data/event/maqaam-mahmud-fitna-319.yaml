label: { ar: "فتنة المقام المحمود ببغداد", en: "The Maqam Mahmud Strife in Baghdad", es: "El conflicto de Maqam Mahmud en Bagdad", fr: "Les troubles du Maqam Mahmud à Bagdad", ur: "بغداد میں مقام محمود کی لڑائی" }
summary:
  ar: "في سنة تسع عشرة هاجت فتنة كبرى ببغداد بسبب قوله تعالى عسى أن يبعثك ربك مقاماً محموداً فقالت الحنابلة معناه يقعده الله على عرشه وقال غيرهم بل هي الشفاعة ودام الخصام واقتتلوا حتى قتل جماعة كثيرة {cite:tarikh-khulafa-minhaj-1434 p. 593}."
  en: "In 319 a great fitna raged in Baghdad over 'asaa an yab'athaka rabbuka maqaaman mahmuudan' — the Hanbalis held it meant God seating him upon His throne; others held it was the intercession. The quarrel ran to fighting till many were killed {cite:tarikh-khulafa-minhaj-1434 p. 593}."
  es: "En el año 319, una gran fitna (disputa) estalló en Bagdad por la expresión «asaa an yab'athaka rabbuka maqaman mahmudan». Los hanbalíes creían que significaba que Dios lo sentaría en su trono; otros, que se referían a la intercesión. La disputa derivó en una lucha encarnizada en la que murieron muchos {cite:tarikh-khulafa-minhaj-1434 p. 593}."
  fr: "En 319, une grande fitna éclata à Bagdad au sujet de l'expression « asaa an yab'athaka rabbuka maqaman mahmudan »: les hanbalites y voyaient la signification de l'installation de Dieu sur son trône; d'autres y voyaient l'intercession. La querelle dégénéra en affrontements qui firent de nombreuses victimes (voir: tarikh-khulafa-minhaj-1434, p. 593)."
  ur: "319 میں بغداد میں 'آساء عن یباتکہ ربوکا مقام محمودن' پر ایک بڑا فتنہ برپا ہوا - حنبلیوں کے نزدیک اس کا مطلب یہ تھا کہ خدا اسے اپنے تخت پر بٹھاتا ہے۔ دوسروں کا خیال تھا کہ یہ شفاعت تھی۔ جھگڑا لڑتا چلا گیا یہاں تک کہ بہت سے لوگ مارے گئے۔ 593}۔"
