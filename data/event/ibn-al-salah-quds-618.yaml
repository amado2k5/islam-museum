label:
  ar: "ابن الصلاح يدرّس بالمدرسة الصلاحية بالقدس في نوبته الثانية، نحو ٦١٨هـ"
  en: "Ibn al-Salah teaches at the Salahiyya madrasa in Jerusalem on his second tour, c. 618"
  ur: "ابن الصلاح اپنے دوسرے سفر میں قدس کی صلاحیہ مدرسہ میں تدریس کرتے ہیں، تقریباً 618ھ"
summary:
  ar: "في نوبته الثانية بالشام درّس ابن الصلاح بالقدس بالمدرسة الصلاحية المنسوبة إلى الملك الناصر صلاح الدين يوسف بن أيوب، وأقام بها مدة واشتغل الناس عليه وانتفعوا به {cite:tarikh-islam-dhahabi p. 186} {cite:shadharat-dhahab p. 229-230} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  en: "On his second tour of al-Sham, Ibn al-Salah taught in Jerusalem at the Salahiyya madrasa, the school named after al-Malik al-Nasir Salah al-Din Yusuf b. Ayyub; he stayed a while and the people studied under him and benefited {cite:tarikh-islam-dhahabi p. 186} {cite:shadharat-dhahab p. 229-230} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  ur: "اپنے دوسرے شام کے سفر میں ابن الصلاح نے قدس کی صلاحیہ مدرسہ میں تدریس کی، جو ملک الناصر صلاح الدین یوسف بن ایوب سے منسوب تھی؛ وہ کچھ عرصہ وہاں رہے اور لوگ ان سے پڑھتے اور فائدہ اٹھاتے رہے {cite:tarikh-islam-dhahabi p. 186} {cite:shadharat-dhahab p. 229-230} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}۔"
