id: event/if-only-opens-shaytans-door
kind: other
label:
  ar: قول لو تفتح عمل الشيطان
  en: Saying "if only" opens the shaytan s work
  ur: لو کہنا شیطان کے کام کا دروازہ کھولتا ہے
summary:
  ar: 'قال النبي: المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف وفي كل خير، واحرص على ما ينفعك واستعن بالله ولا تعجز، وإن أصابك شيء فلا تقل لو أني فعلت كذا وكذا ولكن قل قدر الله وما شاء فعل فإن لو تفتح عمل الشيطان {cite:sahih-muslim} [[passage/muslim-2664|مسلم 2664]].'
  en: 'The Prophet said: the strong faithful believer is better and dearer to God than the weak believer, and in all things good; be eager for what benefits you, seek Allah s help and do not be helpless; if something befalls you do not say "if only I had done such and such" but say "Allah decreed and did what He willed" — for "if only" opens the shaytan s work {cite:sahih-muslim} [[passage/muslim-2664|Muslim 2664]].'
  ur: 'نبی نے کہا: مضبوط مومن کمزور مومن سے بہتر اور اللہ کو زیادہ محبوب ہے، اور ہر چیز میں خیر ہے؛ جو تمہارے کام آئے اس میں کوشاں رہو اور اللہ کی مدد مانگو اور عاجز نہ ہو؛ اور اگر تمہیں کچھ ہو جائے تو یہ نہ کہو کہ کاش میں یہ کرتا تو یہ ہوتا، بلکہ کہو اللہ نے تقرر کیا اور جو چاہا کیا — کیونکہ لو کہنا شیطان کے کام کا دروازہ کھولتا ہے {cite:sahih-muslim} [[passage/muslim-2664|مسلم 2664]]۔'
