id: event/if-only-opens-shaytans-door
kind: other
label:
  ar: قول لو تفتح عمل الشيطان
  en: Saying "if only" opens the shaytan s work
  ur: لو کہنا شیطان کے کام کا دروازہ کھولتا ہے
  es: "Decir \"ojalá\" abre la puerta al trabajo de Satanás."
  fr: "Dire « si seulement » ouvre la porte à l'œuvre du diable"
  tr: "\"Şeytanın işini açarsanız...\" deyin."
  id: "Katakanlah, \"Jika kamu membuka pekerjaan setan...\""
summary:
  ar: 'قال النبي: المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف وفي كل خير، واحرص على ما ينفعك واستعن بالله ولا تعجز، وإن أصابك شيء فلا تقل لو أني فعلت كذا وكذا ولكن قل قدر الله وما شاء فعل فإن لو تفتح عمل الشيطان {cite:sahih-muslim} [[passage/muslim-2664|مسلم 2664]].'
  en: 'The Prophet said: the strong faithful believer is better and dearer to God than the weak believer, and in all things good; be eager for what benefits you, seek Allah s help and do not be helpless; if something befalls you do not say "if only I had done such and such" but say "Allah decreed and did what He willed" — for "if only" opens the shaytan s work {cite:sahih-muslim} [[passage/muslim-2664|Muslim 2664]].'
  ur: 'نبی نے کہا: مضبوط مومن کمزور مومن سے بہتر اور اللہ کو زیادہ محبوب ہے، اور ہر چیز میں خیر ہے؛ جو تمہارے کام آئے اس میں کوشاں رہو اور اللہ کی مدد مانگو اور عاجز نہ ہو؛ اور اگر تمہیں کچھ ہو جائے تو یہ نہ کہو کہ کاش میں یہ کرتا تو یہ ہوتا، بلکہ کہو اللہ نے تقرر کیا اور جو چاہا کیا — کیونکہ لو کہنا شیطان کے کام کا دروازہ کھولتا ہے {cite:sahih-muslim} [[passage/muslim-2664|مسلم 2664]]۔'
  es: "El Profeta dijo: el creyente fuerte y fiel es mejor y más querido por Dios que el creyente débil, y en todo lo bueno; ansíen lo que les beneficia, busquen la ayuda de Alá y no se sientan indefensos; si algo les sucede, no digan \"si tan solo hubiera hecho tal y cual\" sino digan \"Alá decretó e hizo lo que quiso\", pues \"si tan solo\" abre la obra de Satanás {cite:sahih-muslim} [[passage/muslim-2664|Muslim 2664]]."
  fr: "Le Prophète a dit: le croyant fort et fidèle est meilleur et plus cher à Dieu que le croyant faible, et en toutes choses bonnes; soyez avide de ce qui vous est bénéfique, recherchez l'aide d'Allah et ne soyez pas impuissant; si quelque chose vous arrive, ne dites pas « si seulement j'avais fait ceci ou cela », mais dites « Allah a décrété et a fait ce qu'Il a voulu » — car le « si seulement » ouvre l'œuvre de Satan {cite:sahih-muslim} [[passage/muslim-2664|Muslim 2664]]."
  tr: "Peygamberimiz şöyle buyurmuştur: \"Güçlü mümin, zayıf müminden daha hayırlı ve Allah katında daha sevgilidir; her ikisinde de hayır vardır. Size fayda sağlayacak şeylere hevesli olun, Allah'tan yardım isteyin ve çaresiz kalmayın. Başınıza bir şey gelirse, 'Keşke şunu şöyle yapsaydım' demeyin, aksine 'Allah takdir etmiştir, dilediğini yapar' deyin; çünkü 'keşke' şeytanın işine kapı açar.\""
  id: "Nabi Muhammad SAW bersabda: Orang beriman yang kuat lebih baik dan lebih dicintai Allah daripada orang beriman yang lemah, dan pada masing-masing terdapat kebaikan. Bersemangatlah untuk apa yang bermanfaat bagimu, carilah pertolongan Allah dan janganlah berdiam diri. Jika sesuatu terjadi padamu, janganlah berkata, “Seandainya aku melakukan ini dan itu,” tetapi katakanlah, “Allah telah menetapkan, dan apa yang Dia kehendaki, Dia lakukan,” karena “seandainya” membuka pintu bagi pekerjaan setan. {cite:sahih-muslim} [[passage/muslim-2664|Muslim 2664]]."
