label: { ar: "فتح جلال الدين مدينة تفليس من الكرج", en: "Jalal al-Din takes the city of Tiflis from the Georgians", es: "Jalal al-Din toma la ciudad de Tiflis de manos de los georgianos.", fr: "Jalal al-Din prend la ville de Tiflis aux Géorgiens", ur: "جلال الدین نے جارجی باشندوں سے طفلس شہر چھین لیا۔" }
summary:
  ar: "في ثامن ربيع الأول سنة ثلاث وعشرين وستمائة فتح جلال الدين بن خوارزم شاه مدينة تفليس من الكرج، فقد قصدهم وقد حشدوا من الأمم المجاورة اللان واللكز وقبجاق جمعاً لا يحصى فكمن لهم في مواضع والتقوا فولى الكرج منهزمين وأمر جلال الدين عسكره ألا يبقوا على أحد فتبعوهم حتى كادوا يفنونهم، وأشاروا عليه بقصد تفليس دار ملكهم فقال لا حاجة لنا أن نقتل رجالنا تحت الأسوار إنما إذا أفنيت الكرج أخذت البلاد صفواً، ثم قصدها في ثلاثة آلاف فارس فكمن أكثر عسكره فلما خرج إليه الكرج طمعاً في قلته تأخر عنهم حتى توسطوا الكمائن فانهزموا إلى المدينة وتبعهم المسلمون ونادى مسلموها بشعار الإسلام واسم جلال الدين فألقى الكرج بأيديهم فملك المسلمون البلد عنوة؛ ويذكر ابن الأثير أنها من أحصن البلاد على جانبي نهر الكر وأن الكرج ملكوها سنة خمس عشرة وخمسمائة والسلطان محمود بن محمد بن ملكشاه فلم يقدر عليها مع سعة مملكته ولا أخوه مسعود ولا الدكز والبهلوان بعدهما حتى جاء جلال الدين والبلاد قد أضعفها الكرج أولاً ثم استأصلتها التتر ففعل بهم هذه الأفاعيل {cite:kamil-ibn-al-athir p. 460-462}."
  en: "On 8 Rabi' I 623 Jalal al-Din b. Khwarazmshah took the city of Tiflis from the Georgians. He marched against them after they had mustered an uncounted host from neighbouring peoples, the Alans, the Lakz and the Qipchaq; he set ambushes in several places, and when the armies met the Georgians fled. He ordered his troops to spare no one, and they pursued until they nearly annihilated them. Some urged him to march on Tiflis, the seat of their kingdom, but he said: 'We have no need to kill our men beneath the walls; if the Georgians are wiped out, the land will be taken whole.' He set out against it with three thousand horsemen, most of his army hidden in ambush. When the Georgians came out, thinking him few, he drew back until they had passed into the ambushes; they fled into the city, the Muslims followed, its Muslim people called out the cry of Islam and Jalal al-Din's name, the Georgians laid down their arms, and the Muslims took the city by storm. Ibn al-Athir mentions that it was among the strongest cities on both banks of the Kur river, that the Georgians had seized it in 515 when Sultan Mahmud b. Muhammad b. Malikshah reigned, and that neither he nor his brother Mas'ud, nor al-Dukuz and al-Bahlawan after them, could take it, until Jalal al-Din came, when the land had first been weakened by the Georgians and then uprooted by the Tatars; and so he did these deeds to them {cite:kamil-ibn-al-athir p. 460-462}."
  es: "El 8 de Rabi' I de 623, Jalal al-Din b. Khwarazmshah tomó la ciudad de Tiflis de manos de los georgianos. Marchó contra ellos después de que estos hubieran reunido un ejército incontable de pueblos vecinos, los alanos, los lakz y los kipchaq; tendió emboscadas en varios lugares, y cuando los ejércitos se encontraron, los georgianos huyeron. Ordenó a sus tropas que no perdonaran a nadie, y los persiguieron hasta casi aniquilarlos. Algunos le instaron a marchar sobre Tiflis, la sede de su reino, pero él dijo: «No tenemos necesidad de matar a nuestros hombres bajo las murallas; si los georgianos son aniquilados, la tierra será tomada entera». Partió contra ella con tres mil jinetes, la mayor parte de su ejército oculto en emboscadas. Cuando los georgianos salieron, creyendo que era poco, se retiró hasta que pasaron a las emboscadas; Huyeron a la ciudad, los musulmanes los siguieron, su gente musulmana gritó el nombre del Islam y de Jalal al-Din, los georgianos depusieron las armas y los musulmanes tomaron la ciudad por asalto. Ibn al-Athir menciona que era una de las ciudades más fuertes en ambas orillas del río Kur, que los georgianos la habían tomado en 515 cuando reinaba el sultán Mahmud b. Muhammad b. Malikshah, y que ni él ni su hermano Mas'ud, ni al-Dukuz y al-Bahlawan después de ellos, pudieron tomarla, hasta que llegó Jalal al-Din, cuando la tierra primero había sido debilitada por los georgianos y luego arrasada por los tártaros; y así les hizo estas cosas {cite:kamil-ibn-al-athir p. 460-462}."
  fr: "Le 8 Rabi' I 623, Jalal al-Din ibn Khwarezmshah prit la ville de Tiflis aux Géorgiens. Il marcha contre eux après qu'ils eurent rassemblé une armée innombrable parmi les peuples voisins, les Alains, les Laks et les Qipchaq. Il tendit des embuscades en plusieurs endroits, et lorsque les armées se rencontrèrent, les Géorgiens prirent la fuite. Il ordonna à ses troupes de ne faire aucun cadeau, et elles les poursuivirent jusqu'à les anéantir presque complètement. Certains l'incitèrent à marcher sur Tiflis, siège de leur royaume, mais il répondit: « Nous n'avons pas besoin de tuer nos hommes sous les murs; si les Géorgiens sont exterminés, le pays sera conquis tout entier. » Il se lança à l'assaut avec trois mille cavaliers, la majeure partie de son armée dissimulée dans des embuscades. Lorsque les Géorgiens sortirent, le croyant peu nombreux, il se replia jusqu'à ce qu'ils aient pénétré dans les embuscades. Ils se réfugièrent dans la ville, suivis par les musulmans. Ces derniers proclamèrent l'islam et le nom de Jalal al-Din. Les Géorgiens déposèrent les armes et les musulmans prirent la ville d'assaut. Ibn al-Athir rapporte qu'elle figurait parmi les villes les plus puissantes des deux rives du Koura, que les Géorgiens s'en étaient emparés en 515 sous le règne du sultan Mahmud ben Muhammad ben Malikshah, et que ni lui, ni son frère Mas'ud, ni al-Dukuz et al-Bahlawan après eux, ne parvinrent à la reprendre, jusqu'à l'arrivée de Jalal al-Din. La région avait d'abord été affaiblie par les Géorgiens, puis ravagée par les Tatars. C'est ainsi qu'il accomplit ces actes à leur égard (voir: Kamil Ibn al-Athir, p. 460-462)."
  ur: "8 ربیع الثانی 623 جلال الدین خوارزمشاہ نے جارجیوں سے طفلس شہر چھین لیا۔ اس نے ان کے خلاف اس وقت مارچ کیا جب انہوں نے ہمسایہ لوگوں، الان، لکز اور کیپچاق سے ایک بے شمار لشکر اکٹھا کیا۔ اس نے کئی جگہوں پر گھات لگائے، اور جب فوجیں جارجیائیوں سے ملیں تو بھاگ گئے۔ اس نے اپنی فوجوں کو حکم دیا کہ کسی کو بھی نہ چھوڑیں، اور وہ اس وقت تک تعاقب کرتے رہے جب تک کہ وہ انہیں ختم نہ کر دیں۔ کچھ لوگوں نے اس پر زور دیا کہ وہ ان کی بادشاہی کے تخت ٹفلس پر مارچ کرے، لیکن اس نے کہا: 'ہمیں اپنے آدمیوں کو دیواروں کے نیچے مارنے کی ضرورت نہیں ہے۔ اگر جارجیائیوں کا صفایا کر دیا جائے تو زمین پوری ہو جائے گی۔' وہ تین ہزار سواروں کے ساتھ اس کے خلاف نکلا، اس کی زیادہ تر فوج گھات میں چھپی ہوئی تھی۔ جب جارجیائی باہر نکلے، اسے کم سمجھ کر، وہ پیچھے ہٹ گیا جب تک کہ وہ گھات میں نہیں چلے گئے۔ وہ بھاگ کر شہر میں آگئے، مسلمانوں نے ان کا پیچھا کیا، اس کے مسلمان لوگوں نے اسلام اور جلال الدین کے نام کی پکار پکاری، جارجیائیوں نے ہتھیار ڈال دیے، اور مسلمانوں نے شہر پر طوفان برپا کردیا۔ ابن الثیر نے ذکر کیا ہے کہ یہ دریائے کر کے دونوں کناروں پر واقع سب سے مضبوط شہروں میں سے ایک تھا کہ جارجیوں نے 515ء میں اس پر قبضہ کر لیا تھا جب سلطان محمود بن . محمد بی ملک شاہ نے حکومت کی، اور یہ کہ نہ تو وہ اور نہ ہی اس کے بھائی مسعود، اور نہ ہی ان کے بعد الدکوز اور البہلوان، اس پر قبضہ کر سکے، یہاں تک کہ جلال الدین آیا، جب زمین کو پہلے جارجیوں نے کمزور کیا اور پھر تاتاریوں نے اکھاڑ پھینکا۔ اور اس طرح اس نے یہ اعمال ان کے ساتھ کئے۔ 460-462}۔"
