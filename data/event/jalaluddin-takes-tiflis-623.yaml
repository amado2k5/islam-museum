id: event/jalaluddin-takes-tiflis-623
class: event
kind: conquest
label: { ar: "فتح جلال الدين مدينة تفليس من الكرج", en: "Jalal al-Din takes the city of Tiflis from the Georgians" }
summary:
  ar: "في ثامن ربيع الأول سنة ثلاث وعشرين وستمائة فتح جلال الدين بن خوارزم شاه مدينة تفليس من الكرج، فقد قصدهم وقد حشدوا من الأمم المجاورة اللان واللكز وقبجاق جمعاً لا يحصى فكمن لهم في مواضع والتقوا فولى الكرج منهزمين وأمر جلال الدين عسكره ألا يبقوا على أحد فتبعوهم حتى كادوا يفنونهم، وأشاروا عليه بقصد تفليس دار ملكهم فقال لا حاجة لنا أن نقتل رجالنا تحت الأسوار إنما إذا أفنيت الكرج أخذت البلاد صفواً، ثم قصدها في ثلاثة آلاف فارس فكمن أكثر عسكره فلما خرج إليه الكرج طمعاً في قلته تأخر عنهم حتى توسطوا الكمائن فانهزموا إلى المدينة وتبعهم المسلمون ونادى مسلموها بشعار الإسلام واسم جلال الدين فألقى الكرج بأيديهم فملك المسلمون البلد عنوة؛ ويذكر ابن الأثير أنها من أحصن البلاد على جانبي نهر الكر وأن الكرج ملكوها سنة خمس عشرة وخمسمائة والسلطان محمود بن محمد بن ملكشاه فلم يقدر عليها مع سعة مملكته ولا أخوه مسعود ولا الدكز والبهلوان بعدهما حتى جاء جلال الدين والبلاد قد أضعفها الكرج أولاً ثم استأصلتها التتر ففعل بهم هذه الأفاعيل {cite:kamil-ibn-al-athir p. 460-462}."
  en: "On 8 Rabi' I 623 Jalal al-Din b. Khwarazmshah took the city of Tiflis from the Georgians. He marched against them after they had mustered an uncounted host from neighbouring peoples, the Alans, the Lakz and the Qipchaq; he set ambushes in several places, and when the armies met the Georgians fled. He ordered his troops to spare no one, and they pursued until they nearly annihilated them. Some urged him to march on Tiflis, the seat of their kingdom, but he said: 'We have no need to kill our men beneath the walls; if the Georgians are wiped out, the land will be taken whole.' He set out against it with three thousand horsemen, most of his army hidden in ambush. When the Georgians came out, thinking him few, he drew back until they had passed into the ambushes; they fled into the city, the Muslims followed, its Muslim people called out the cry of Islam and Jalal al-Din's name, the Georgians laid down their arms, and the Muslims took the city by storm. Ibn al-Athir mentions that it was among the strongest cities on both banks of the Kur river, that the Georgians had seized it in 515 when Sultan Mahmud b. Muhammad b. Malikshah reigned, and that neither he nor his brother Mas'ud, nor al-Dukuz and al-Bahlawan after them, could take it, until Jalal al-Din came, when the land had first been weakened by the Georgians and then uprooted by the Tatars; and so he did these deeds to them {cite:kamil-ibn-al-athir p. 460-462}."
