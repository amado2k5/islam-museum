label: { ar: "فتح مرعش وعمارتها", en: "The Taking and Settling of Mar'ash", es: "La toma y el asentamiento de Mar'ash", fr: "La prise et le peuplement de Mar'ash", ur: "ماراش کو لینا اور آباد کرنا", tr: "Maraş'ın fethi ve mimarisi", id: "Penaklukan Marash dan arsitekturnya" }
summary:
  ar: "عند البلاذري: وجّه أبو عبيدة بن الجراح — وهو بمنبج — خالد بن الوليد إلى ناحية مرعش ففتح حصنها على أن جلا أهله ثم أخربه؛ وكان سفيان بن عوف الغامدي لما غزا الروم في سنة 30 رحل من قبل مرعش فساح في بلاد الروم، وكان معاوية بنى مدينة مرعش وأسكنها جنداً فلما كان موت يزيد بن معاوية كثرت غارات الروم عليهم فانتقلوا عنها وصالح عبد الملك الروم بعد موت أبيه مروان بن الحكم وطلبه للخلافة على شيء كان يؤديه إليهم، فلما كانت سنة 74 غزا محمد بن مروان الروم وانتقض الصلح، ولما كانت سنة 75 غزا الصائفة أيضاً محمد بن مروان وخرجت الروم في جمادى الأولى من قبل مرعش إلى الأعماق فزحف إليهم المسلمون وعليهم أبان بن الوليد بن عقبة بن أبي معيط ومعه دينار بن دينار مولى عبد الملك بن مروان وكان على قنسرين وكورها فالتقوا بعمق مرعش فاقتتلوا قتالاً شديداً فهُزمت الروم وأتبعهم المسلمون يقتلون ويأسرون — وكان دينار لقي في هذا العام جماعة من الروم بجسر يغرا وهو من شمشاط على نحو عشرة أميال فظفر بهم؛ ثم إن العباس بن الوليد بن عبد الملك صار إلى مرعش فعمّرها وحصّنها ونقل الناس إليها وبنى لها مسجداً جامعاً وكان يقطع في كل عام على أهل قنسرين بعثاً إليها، فلما كانت أيام مروان بن محمد وشُغل بمحاربة أهل حمص خرجت الروم وحصرت مدينة مرعش حتى صالحهم أهلها على الجلاء فخرجوا نحو الجزيرة وجند قنسرين بعيالاتهم ثم أخربوها — وكان عامل مروان عليها يومئذ الكوثر بن زفر بن الحرث الكلابي والطاغية يومئذ قسطنطين بن ليون — ثم لما فرغ مروان من أمر حمص وهدم سورها بعث جيشاً لبناء مرعش فبُنيت ومُدّنت فخرجت الروم في فتنته فأخربتها فبناها صالح بن علي في خلافة أبي جعفر المنصور وحصّنها وندب الناس إليها على زيادة العطاء واستخلف المهدي فزاد في شحنتها وقوّى أهلها."
  en: "In al-Baladhuri: Abu Ubayda ibn al-Jarrah — he being at Manbij — sent Khalid ibn al-Walid to the Mar'ash region, and he took its fortress on condition its people evacuate, then demolished it; when Sufyan ibn Awf al-Ghamidi raided the Byzantines in year 30 he set out from before Mar'ash and ranged their lands; Mu'awiya built the city of Mar'ash and garrisoned it, but at Yazid ibn Mu'awiya's death Byzantine raids multiplied and its people left, and Abd al-Malik — after his father Marwan ibn al-Hakam's death — compounded with the Byzantines for tribute while seeking the caliphate; in year 74 Muhammad ibn Marwan raided and the truce broke, and in year 75 he again led the summer expedition, the Romans coming out in Jumada I by way of Mar'ash into the depths, where the Muslims under Aban ibn al-Walid ibn Uqba ibn Abi Mu'ayt — with him Dinar ibn Dinar, mawla of Abd al-Malik and governor of Qinnasrin and its districts — met them at Amq Mar'ash in a hard battle, routed them and pursued killing and capturing — Dinar having that same year met a Roman body at Jisr Yaghra, some ten miles from Shimshat, and overcome them; then al-Abbas ibn al-Walid ibn Abd al-Malik went to Mar'ash, rebuilt and fortified it, transferred people to it, built its congregational mosque and levied an annual contingent on Qinnasrin; in Marwan ibn Muhammad's days — he busy fighting Hims — the Romans besieged Mar'ash until its people compounded to evacuate toward the Jazira with the Qinnasrin troops and their families, then demolished it — Marwan's governor being al-Kawthar ibn Zufar ibn al-Harith al-Kilabi, the tyrant being Constantine son of Leo; when Marwan had finished with Hims and razed its wall he sent an army to rebuild Mar'ash, and built it was and made a city — but in his civil war the Romans wrecked it again; Salih ibn Ali rebuilt and fortified it in al-Mansur's caliphate, calling people to it with increased pay, and al-Mahdi enlarged its garrison and strengthened its people."
  es: "En al-Baladhuri: Abu Ubayda ibn al-Jarrah —que se encontraba en Manbij— envió a Khalid ibn al-Walid a la región de Mar'ash, y tomó su fortaleza con la condición de que su gente evacuara, para luego demolerla; cuando Sufyan ibn Awf al-Ghamidi asaltó a los bizantinos en el año 30 partió de las afueras de Mar'ash y exploró sus tierras; Mu'awiya construyó la ciudad de Mar'ash y la guarneció, pero a la muerte de Yazid ibn Mu'awiya se multiplicaron las incursiones bizantinas y su gente se marchó, y Abd al-Malik —después de la muerte de su padre Marwan ibn al-Hakam— se unió a los bizantinos para pagar tributo mientras buscaba el califato; En el año 74, Muhammad ibn Marwan realizó una incursión y la tregua se rompió, y en el año 75 volvió a liderar la expedición de verano, los romanos salieron en Jumada I por vía Mar'ash hacia las profundidades, donde los musulmanes bajo el mando de Aban ibn al-Walid ibn Uqba ibn Abi Mu'ayt —con él Dinar ibn Dinar, mawla de Abd al-Malik y gobernador de Qinnasrin y sus distritos— los encontraron en Amq Mar'ash en una dura batalla, los derrotaron y los persiguieron matando y capturando —Dinar había encontrado ese mismo año a un cuerpo romano en Jisr Yaghra, a unas diez millas de Shimshat, y los venció; luego al-Abbas ibn al-Walid ibn Abd al-Malik fue a Mar'ash, lo reconstruyó y fortificó, trasladó gente allí, construyó su mezquita congregacional y reclutó un contingente anual en Qinnasrin; En tiempos de Marwan ibn Muhammad —él ocupado luchando contra Hims— los romanos sitiaron Mar'ash hasta que su gente se movilizó para evacuar hacia Jazira con las tropas de Qinnasrin y sus familias, y luego la demolieron. El gobernador de Marwan era al-Kawthar ibn Zufar ibn al-Harith al-Kilabi, y el tirano era Constantino, hijo de León. Cuando Marwan terminó con Hims y arrasó su muralla, envió un ejército para reconstruir Mar'ash, y la reconstruyó y la convirtió en una ciudad. Pero en su guerra civil, los romanos la volvieron a destruir. Salih ibn Ali la reconstruyó y fortificó durante el califato de al-Mansur, atrayendo gente con un salario mayor, y al-Mahdi amplió su guarnición y fortaleció a su gente."
  fr: "Dans al-Baladhuri: Abu Ubayda ibn al-Jarrah — se trouvant à Manbij — envoya Khalid ibn al-Walid dans la région de Mar'ash, et celui-ci s'empara de sa forteresse à condition que ses habitants l'évacuent, puis la démolit; lorsque Sufyan ibn Awf al-Ghamidi pilla les Byzantins en l'an 30, il partit des abords de Mar'ash et parcourut leurs terres; Mu'awiya construisit la ville de Mar'ash et la garnit de garnison, mais à la mort de Yazid ibn Mu'awiya, les raids byzantins se multiplièrent et ses habitants partirent, et Abd al-Malik — après la mort de son père Marwan ibn al-Hakam — s'allia avec les Byzantins pour obtenir un tribut tout en cherchant à obtenir le califat; En l'an 74, Muhammad ibn Marwan lança un raid et la trêve fut rompue. En l'an 75, il mena à nouveau l'expédition d'été, les Romains sortant en Jumada I par Mar'ash dans les profondeurs, où les musulmans sous Aban ibn al-Walid ibn Uqba ibn Abi Mu'ayt — avec lui Dinar ibn Dinar, mawla d'Abd al-Malik et gouverneur de Qinnasrin et de ses districts — les rencontrèrent à Amq Mar'ash dans une bataille acharnée, les mirent en déroute et poursuivirent leurs hommes, les tuant et les capturant. Dinar avait, la même année, rencontré un corps romain à Jisr Yaghra, à une dizaine de kilomètres de Shimshat, et l'avait vaincu. Ensuite, al-Abbas ibn al-Walid ibn Abd al-Malik se rendit à Mar'ash, la reconstruisit et la fortifia, y transféra des habitants, construisit sa mosquée et leva un contingent annuel pour Qinnasrin. Du temps de Marwan ibn Muhammad — alors occupé à combattre Hims —, les Romains assiégèrent Mar'ash jusqu'à ce que ses habitants, contraints de fuir vers la Jazira avec les troupes de Qinnasrin et leurs familles, la rasèrent. Le gouverneur de Marwan était al-Kawthar ibn Zufar ibn al-Harith al-Kilabi, et le tyran, Constantin, fils de Léon. Une fois la guerre contre Hims terminée et les remparts détruits, Marwan envoya une armée reconstruire Mar'ash, ce qu'il fit, la transformant en ville. Mais lors de sa guerre civile, les Romains la détruisirent à nouveau. Salih ibn Ali la reconstruisit et la fortifia sous le califat d'al-Mansur, attirant des habitants et augmentant les salaires. Al-Mahdi, quant à lui, agrandit sa garnison et renforça la population."
  ur: "البلادوری میں ہے: ابو عبیدہ بن الجراح - وہ منبج میں تھے - نے خالد بن ولید کو مرعش کے علاقے میں بھیجا، اور اس نے اس کے قلعے پر اس شرط پر قبضہ کر لیا کہ اس کے لوگ وہاں سے نکل جائیں، پھر اسے منہدم کر دیا۔ جب سفیان بن عوف الغامدی نے سن 30 میں بازنطینیوں پر حملہ کیا تو وہ مرش سے پہلے نکلا اور ان کی زمینوں پر قبضہ کیا۔ معاویہ نے مرعش شہر تعمیر کیا اور اسے گھیرے میں لے لیا، لیکن یزید بن معاویہ کی موت کے بعد بازنطینی چھاپے بڑھ گئے اور اس کے لوگ وہاں سے چلے گئے، اور عبد الملک - اپنے والد مروان بن الحکم کی موت کے بعد - خلافت کی تلاش میں خراج تحسین کے لیے بازنطینیوں کے ساتھ مل گئے۔ سن 74 میں محمد بن مروان نے حملہ کیا اور جنگ بندی ٹوٹ گئی، اور 75 میں اس نے دوبارہ موسم گرما کی مہم کی قیادت کی، رومی جمادی اول میں مرش کے راستے گہرائیوں میں نکل آئے، جہاں ابان بن الولید ابن عقبہ ابن ابی معیط کے ماتحت مسلمان - اس کے ساتھ دینار المنور کے عبد المنور اور عبدالمنان بن عبدالعزیز تھے۔ کناسرین اور اس کے اضلاع - ایک سخت جنگ میں امق مرعش میں ان سے ملے، انہیں شکست دی اور قتل و غارت کا پیچھا کیا - اسی سال دینار نے شمشات سے دس میل کے فاصلے پر جسر یثرہ کے مقام پر ایک رومی جسم سے ملاقات کی اور ان پر قابو پالیا؛ اس کے بعد عباس بن الولید بن عبد الملک مرش میں گئے، اس کی تعمیر نو کی اور قلعہ بندی کی، لوگوں کو اس میں منتقل کیا، اس کی جامع مسجد تعمیر کی اور قنصرین پر سالانہ دستہ لگایا؛ مروان بن محمد کے دنوں میں - وہ ہمس سے لڑنے میں مصروف تھا - رومیوں نے مرش کا محاصرہ کیا یہاں تک کہ اس کے لوگ کنسرین کی فوجوں اور ان کے خاندانوں کے ساتھ جزیرہ کی طرف نکلنے کے لیے اکٹھے ہو گئے، پھر اسے منہدم کر دیا - مروان کا گورنر الکوثر ابن زفر ابن الحارث بن حارث بن قنطین کا بیٹا تھا۔ جب مروان حمص کے ساتھ ختم ہوا اور اس کی دیوار کو گرا دیا تو اس نے مرش کو دوبارہ تعمیر کرنے کے لیے ایک فوج بھیجی، اور اسے تعمیر کیا اور ایک شہر بنایا - لیکن اپنی خانہ جنگی میں رومیوں نے اسے دوبارہ تباہ کر دیا۔ صالح بن علی نے المنصور کی خلافت میں اسے دوبارہ تعمیر کیا اور مضبوط کیا، لوگوں کو زیادہ تنخواہ کے ساتھ اس کی طرف بلایا، اور المہدی نے اس کی چوکی کو بڑھایا اور اس کے لوگوں کو مضبوط کیا۔"
  tr: "El-Baladhuri'ye göre: Manbij'de bulunan Ebu Ubeyde ibn el-Cerrah, Halid ibn el-Velid'i Maraş bölgesine yönlendirdi. Halid ibn el-Velid, halkının kovulması şartıyla kaleyi ele geçirdi ve ardından yıktı. Sufyan ibn Avf el-Ghamdi, 30 yılında Romalılara baskın düzenlediğinde Maraş yönünden gelerek Roma topraklarında dolaştı. Muaviye, Maraş şehrini kurmuş ve oraya asker yerleştirmişti. Yezid ibn Muaviye öldüğünde, Romalılar onlara yönelik baskınlarını artırdılar ve bu yüzden Romalılar oradan ayrıldılar. Abdülmalik, babası Mervan ibn el-Hakam'ın ölümünden sonra Romalılarla barış yaptı ve onlara bir şeyler karşılığında halifelik istedi. 74 yılı geldiğinde, Muhammed ibn Mervan Romalılara baskın düzenledi ve barış bozuldu. 75 yılı geldiğinde, Muhammed ibn Mervan da yaz aylarında baskın düzenledi ve Romalılar Cemâda el-Ula'da Maraş yönünden iç bölgelere doğru ilerlediler. Bunun üzerine Müslümanlar onlara doğru ilerlediler ve komutalarında Aban ibn el-Velid ibn Ukba ibn Abi Muayt vardı. Onunla birlikte, Kınnasrin ve çevresinden sorumlu olan Abd el-Malik ibn Mervan'ın azatlı kölesi Dinar ibn Dinar da bulunuyordu. Maraş'ın iç bölgelerinde karşılaştılar ve şiddetli bir savaş verdiler. Romalılar yenildi ve Müslümanlar onları takip ederek öldürdüler ve esir aldılar. — Ve Dinar bu yıl Samosata'dan yaklaşık on mil uzaklıktaki Yaghra köprüsünde bir grup Romalıyla karşılaştı ve onlara karşı zafer kazandı. Sonra el-Abbas ibn el-Velid ibn Abd el-Malik Maraş'a gitti, şehri yeniden inşa etti, güçlendirdi, insanları oraya taşıdı ve orada bir cami yaptırdı. Mervan ibn Muhammed, Kınnesrin halkına her yıl bir sefer düzenlemek için belirli bir miktar para ayırırdı. Mervan ibn Muhammed döneminde, Humus halkıyla savaşmakla meşgulken, Romalılar gelip Maraş şehrini kuşattılar ve halkı onlarla barışıp şehri terk etti. Bunun üzerine Romalılar Cezire'ye doğru ilerlediler ve Kınnesrin askerleri aileleriyle birlikte şehri yıktılar. O dönemde Mervan'ın valisi Kevser ibn Zufer ibn Haris el-Kilabi, tiran ise Konstantin ibn Leon idi. Mervan Humus işini bitirip surlarını yıktıktan sonra, Maraş'ı inşa etmek için bir ordu gönderdi ve şehir inşa edilip geliştirildi. Daha sonra Romalılar onun isyanı sırasında gelip şehri yıktılar. Ardından Salih ibn Ali, Ebu Cafer el-Mansur halifeliği döneminde şehri yeniden inşa etti, güçlendirdi ve maaşlarını artırarak halkı buraya çağırdı. El-Mehdi'yi halefi olarak atadı, böylece garnizonunu artırdı ve halkını güçlendirdi."
  id: "Menurut Al-Baladhuri: Abu Ubaidah ibn al-Jarrah – yang berada di Manbij – mengarahkan Khalid ibn al-Walid ke wilayah Marash, sehingga ia menaklukkan bentengnya dengan syarat penduduknya diusir, kemudian ia menghancurkannya. Sufyan ibn Awf al-Ghamdi, ketika ia menyerang Romawi pada tahun 30, melakukan perjalanan dari arah Marash dan berkeliaran di tanah Romawi. Muawiyah telah membangun kota Marash dan menempatkan tentara di sana. Ketika Yazid ibn Muawiyah meninggal, Romawi meningkatkan serangan mereka terhadap mereka, sehingga mereka pindah dari sana. Abd al-Malik berdamai dengan Romawi setelah kematian ayahnya Marwan ibn al-Hakam dan permintaannya untuk kekhalifahan dengan imbalan sesuatu yang dibayarkannya kepada mereka. Ketika tahun 74 tiba, Muhammad ibn Marwan menyerang Romawi dan perdamaian itu dilanggar. Ketika tahun 75 tiba, Muhammad ibn Marwan juga melakukan penyerangan di musim panas, dan bangsa Romawi keluar di Jumada al-Ula dari arah Marash menuju kedalaman, sehingga kaum Muslim maju ke arah mereka, dan dalam komando mereka ada Aban ibn al-Walid ibn Uqba ibn Abi Mu’ayt, dan bersamanya ada Dinar ibn Dinar, budak yang dibebaskan oleh Abd al-Malik ibn Marwan, yang bertanggung jawab atas Qinnasrin dan distrik-distriknya. Mereka bertemu di kedalaman Marash dan bertempur sengit, sehingga bangsa Romawi dikalahkan, dan kaum Muslim mengejar mereka, membunuh dan menangkap mereka. — Dan Dinar telah bertemu pada tahun ini dengan sekelompok orang Romawi di jembatan Yaghra, yang berjarak sekitar sepuluh mil dari Samosata, dan dia menang atas mereka. Kemudian al-Abbas ibn al-Walid ibn Abd al-Malik pergi ke Marash, membangun kembali kota itu, membentenginya, memindahkan penduduk ke sana, dan membangun masjid jami untuknya. Dahulu ia mengalokasikan sejumlah dana tahunan kepada penduduk Qinnasrin untuk mengirim ekspedisi ke sana. Ketika masa Marwan bin Muhammad tiba dan ia sibuk berperang melawan penduduk Homs, bangsa Romawi datang dan mengepung kota Marash hingga penduduknya berdamai dengan mereka dengan syarat evakuasi. Kemudian mereka pergi menuju al-Jazira dan tentara Qinnasrin beserta keluarga mereka, lalu mereka menghancurkannya. Gubernur Marwan pada waktu itu adalah al-Kawthar bin Zufar bin al-Harith al-Kilabi dan penguasa tirani pada waktu itu adalah Konstantinus bin Leon. Kemudian ketika Marwan menyelesaikan urusan Homs dan menghancurkan temboknya, ia mengirim pasukan untuk membangun Marash, sehingga kota itu dibangun dan dikembangkan. Kemudian bangsa Romawi datang selama pemberontakannya dan menghancurkannya. Kemudian Salih bin Ali membangunnya pada masa kekhalifahan Abu Ja'far al-Mansur dan membentenginya serta mengajak orang-orang untuk datang ke sana dengan peningkatan tunjangan. Dia menunjuk al-Mahdi sebagai penggantinya, sehingga dia menambah garnisun dan memperkuat pasukannya."
