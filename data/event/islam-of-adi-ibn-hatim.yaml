label: { ar: "هرب عدي بن حاتم إلى الشام ثم قدومه وإسلامه", en: "Adi ibn Hatim's flight to Syria, his coming to the Prophet and his conversion", es: "La huida de Adi ibn Hatim a Siria, su encuentro con el Profeta y su conversión.", fr: "La fuite d'Adi ibn Hatim en Syrie, sa rencontre avec le Prophète et sa conversion" }
summary:
  ar: "كان عدي بن حاتم سيد طيء، نصرانياً يأخذ المرباع، فكره النبي حين سمع به وأعدّ إبلاً فلما رأى غلامه رايات جيوش محمد احتمل بأهله إلى نصارى الشام وخلّف ابنة حاتم فسُبيت ثم أُطلقت ولحقت به فلامته وأشارت عليه باللحاق بالنبي. فقدم المدينة، فقام إليه النبي وانطلق به إلى بيته، فاستوقفته امرأة ضعيفة فوقف لها طويلاً، وألقى له وسادة وجلس على الأرض، فقال عدي في نفسه: ما هذا بأمر ملك؛ وسأله: ألم تك ركوسياً تسير في قومك بالمرباع؟ فإن ذلك لم يكن يحل لك في دينك؛ وذكر له ثلاثاً ستكون: فيض المال، وأمن الطريق من القادسية إلى البيت، وفتح قصور بابل؛ فأسلم، وكان يقول: مضت اثنتان وبقيت الثالثة."
  en: "Adi ibn Hatim, chief of Tayy, a Christian who took the quarter-share, hated the Prophet on hearing of him and kept camels ready; when his slave saw the banners of Muhammad's armies he carried his family to the Christians of Syria, leaving Hatim's daughter, who was captured, released and came to rebuke him and urge him to go to the Prophet. He came to Medina; the Prophet rose, took him home, stood long for a weak old woman who stopped him, threw Adi a cushion and sat on the ground, and Adi said to himself, this is not the way of a king. The Prophet asked whether he had not been a Rakusi taking the quarter-share, which his religion did not allow, and foretold three things: wealth overflowing, a woman travelling safely from al-Qadisiyya to the House, and the white palaces of Babylon opened; Adi embraced Islam and used to say two had come to pass and the third would."
  es: "Adi ibn Hatim, jefe de Tayy, un cristiano que había tomado la cuarta parte de la herencia, odió al Profeta al oír hablar de él y mantuvo camellos preparados. Cuando su esclavo vio los estandartes de los ejércitos de Mahoma, llevó a su familia a los cristianos de Siria, dejando a la hija de Hatim, quien fue capturada, liberada y fue a reprenderlo e instarlo a ir con el Profeta. Llegó a Medina; el Profeta se levantó, lo llevó a su casa, esperó pacientemente a una anciana débil que lo detuvo, le arrojó un cojín a Adi y se sentó en el suelo. Adi pensó: «Este no es el camino de un rey». El Profeta le preguntó si no había sido un Rakusi que había tomado la cuarta parte de la herencia, lo cual su religión no permitía, y predijo tres cosas: riquezas desbordantes, una mujer que viajaría sana y salva de al-Qadisiyya a la Casa, y los palacios blancos de Babilonia abiertos. Adi abrazó el Islam y solía decir que dos de ellas se habían cumplido y que la tercera estaba por venir."
  fr: "Adi ibn Hatim, chef de Tayy, un chrétien qui avait reçu le quart de l'héritage, prit le Prophète en grippe en entendant parler de lui et tint des chameaux à disposition. Lorsque son esclave aperçut les bannières des armées de Muhammad, il emmena sa famille chez les chrétiens de Syrie, laissant derrière lui la fille de Hatim, qui fut capturée, puis relâchée. Elle vint ensuite le réprimander et l'exhorter à se rendre auprès du Prophète. Il arriva à Médine; le Prophète se leva, le ramena chez lui, mais s'arrêta un instant, car une vieille femme faible l'interpella. Elle lui jeta un coussin et s'assit par terre. Adi se dit alors: « Ce n'est pas ainsi qu'un roi se comporte. » Le Prophète lui demanda s'il n'avait pas été un Rakusi, recevant le quart de l'héritage, ce que sa religion interdisait, et lui prédit trois choses: une richesse abondante, une femme voyageant saine et sauve d'al-Qadisiyya jusqu'à la Maison, et l'ouverture des palais blancs de Babylone. Adi se convertit à l'islam et disait que deux prophéties s'étaient déjà réalisées et que la troisième allait suivre."
