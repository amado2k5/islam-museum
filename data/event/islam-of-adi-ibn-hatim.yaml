id: event/islam-of-adi-ibn-hatim
class: event
kind: other
label: { ar: "هرب عدي بن حاتم إلى الشام ثم قدومه وإسلامه", en: "Adi ibn Hatim's flight to Syria, his coming to the Prophet and his conversion" }
summary:
  ar: "كان عدي بن حاتم سيد طيء، نصرانياً يأخذ المرباع، فكره النبي حين سمع به وأعدّ إبلاً فلما رأى غلامه رايات جيوش محمد احتمل بأهله إلى نصارى الشام وخلّف ابنة حاتم فسُبيت ثم أُطلقت ولحقت به فلامته وأشارت عليه باللحاق بالنبي. فقدم المدينة، فقام إليه النبي وانطلق به إلى بيته، فاستوقفته امرأة ضعيفة فوقف لها طويلاً، وألقى له وسادة وجلس على الأرض، فقال عدي في نفسه: ما هذا بأمر ملك؛ وسأله: ألم تك ركوسياً تسير في قومك بالمرباع؟ فإن ذلك لم يكن يحل لك في دينك؛ وذكر له ثلاثاً ستكون: فيض المال، وأمن الطريق من القادسية إلى البيت، وفتح قصور بابل؛ فأسلم، وكان يقول: مضت اثنتان وبقيت الثالثة."
  en: "Adi ibn Hatim, chief of Tayy, a Christian who took the quarter-share, hated the Prophet on hearing of him and kept camels ready; when his slave saw the banners of Muhammad's armies he carried his family to the Christians of Syria, leaving Hatim's daughter, who was captured, released and came to rebuke him and urge him to go to the Prophet. He came to Medina; the Prophet rose, took him home, stood long for a weak old woman who stopped him, threw Adi a cushion and sat on the ground, and Adi said to himself, this is not the way of a king. The Prophet asked whether he had not been a Rakusi taking the quarter-share, which his religion did not allow, and foretold three things: wealth overflowing, a woman travelling safely from al-Qadisiyya to the House, and the white palaces of Babylon opened; Adi embraced Islam and used to say two had come to pass and the third would."
