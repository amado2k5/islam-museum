id: event/al-hadi-refuses-allegiance-to-a-man-in-forelock-dress
class: event
kind: other
label:
  ar: الهادي يأمر رجلاً بحلق شعره قبل البيعة
  en: Al-Hadi asks a man to shave his forelock before pledging allegiance
  ur: ہادی ایک شخص کو بیعت سے پہلے بال مونڈنے کو کہتے ہیں
  es: "Al-Hadi le pide a un hombre que se afeite el flequillo antes de jurarle lealtad."
  fr: "Al-Hadi demande à un homme de se raser le front avant de prêter allégeance."
  tr: "El-Hadi, biat etmeden önce bir adamın saçını kazıtmasını emreder."
  id: "Al-Hadi memerintahkan seorang pria untuk mencukur kepalanya sebelum mengucapkan sumpah setia."
summary:
  ar: رأى الراوي يوماً الناس يبايعون الهادي فجاءه رجل له طرة وشعر وقال أريد أن أبايعك على رسول الله، فقال له اذهب فاحلق هذا الشعر ثم ارجع فإنا لا نبايع أهل هذا الزي، فحلق ثم بايعه.
  en: The narrator saw people pledging allegiance to al-Hadi one day; a man with a forelock and long hair said he wished to pledge, and al-Hadi told him to go and shave it and return, since "we do not take allegiance from people of this fashion"; he shaved and then pledged.
  ur: راوی نے ایک دن لوگوں کو ہادی کی بیعت کرتے دیکھا؛ ایک شخص جس کی پیشانی پر بال اور لمبے بال تھے بولا میں بیعت کرنا چاہتا ہوں، تو انہوں نے کہا جا کر اسے مونڈ آؤ پھر آؤ کیونکہ ہم اس وضع کے لوگوں سے بیعت نہیں لیتے؛ اس نے مونڈا اور پھر بیعت کی۔
  es: "El narrador vio un día a gente jurando lealtad a al-Hadi; un hombre con flequillo y pelo largo dijo que quería jurarle lealtad, y al-Hadi le dijo que fuera a afeitarse y volviera, ya que \"no aceptamos la lealtad de gente de este tipo\"; se afeitó y luego juró lealtad."
  fr: "Un jour, le narrateur vit des gens prêter allégeance à al-Hadi; un homme avec une mèche et des cheveux longs dit qu'il souhaitait prêter allégeance, et al-Hadi lui dit d'aller se raser et de revenir, car « nous ne prenons pas allégeance aux gens de cette façon »; il se rasa puis prêta allégeance."
  tr: "Anlatıcı bir gün insanların Hadidî'ye biat ettiklerini gördü. Saçları perçemli bir adam yanına gelip, \"Allah'ın Resulü adına sana biat etmek istiyorum\" dedi. Hadidî ona, \"Git bu saçlarını tıraş et, sonra geri gel; çünkü biz böyle görünüşlü insanlara biat etmeyiz\" dedi. Bunun üzerine adam saçlarını tıraş etti ve Hadidî'ye biat etti."
  id: "Suatu hari, sang narator melihat orang-orang berbaiat kepada Al-Hadi. Seorang pria berponi dan berambut panjang datang kepadanya dan berkata, “Saya ingin berbaiat kepada Anda atas nama Rasulullah.” Beliau berkata kepadanya, “Pergilah dan cukur rambut ini lalu kembalilah, karena kami tidak berbaiat kepada orang yang berpenampilan seperti ini.” Maka pria itu mencukur rambutnya dan kemudian berbaiat kepadanya."
