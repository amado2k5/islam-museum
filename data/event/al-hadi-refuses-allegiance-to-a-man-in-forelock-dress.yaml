id: event/al-hadi-refuses-allegiance-to-a-man-in-forelock-dress
class: event
kind: other
label:
  ar: الهادي يأمر رجلاً بحلق شعره قبل البيعة
  en: Al-Hadi asks a man to shave his forelock before pledging allegiance
  ur: ہادی ایک شخص کو بیعت سے پہلے بال مونڈنے کو کہتے ہیں
summary:
  ar: رأى الراوي يوماً الناس يبايعون الهادي فجاءه رجل له طرة وشعر وقال أريد أن أبايعك على رسول الله، فقال له اذهب فاحلق هذا الشعر ثم ارجع فإنا لا نبايع أهل هذا الزي، فحلق ثم بايعه.
  en: The narrator saw people pledging allegiance to al-Hadi one day; a man with a forelock and long hair said he wished to pledge, and al-Hadi told him to go and shave it and return, since "we do not take allegiance from people of this fashion"; he shaved and then pledged.
  ur: راوی نے ایک دن لوگوں کو ہادی کی بیعت کرتے دیکھا؛ ایک شخص جس کی پیشانی پر بال اور لمبے بال تھے بولا میں بیعت کرنا چاہتا ہوں، تو انہوں نے کہا جا کر اسے مونڈ آؤ پھر آؤ کیونکہ ہم اس وضع کے لوگوں سے بیعت نہیں لیتے؛ اس نے مونڈا اور پھر بیعت کی۔
