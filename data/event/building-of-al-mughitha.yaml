label: { ar: "اتخاذ المغيثة", en: "Building of al-Mughitha", fr: "La construction d'al-Mughitha", es: "Edificio de al-Mughitha", ur: "المغیثہ کی عمارت", tr: "Yardımcıyı almak", id: "Mengambil pembantu" }
summary:
  ar: "كان الماء الذي يأتي أهل البصرة نزراً قليلاً وكان عظم ماء البطيحة يذهب في نهر الدير فكان الناس يستعذبون من الأبلة حتى قدم سليمان بن علي البصرة واتخذ المغيثة وعمل مسنانياتها على البطيحة فحجز الماء عن نهر الدير وصرفه إلى نهر ابن عمر وأنفق على المغيثة ألف ألف درهم وشكا أهل البصرة إلى سليمان ملوحة الماء وكثرة ما يأتيهم من ماء البحر فسد القندل فعذب ماؤهم."
  en: "Basra's water came in a thin trickle, the batiha's mass draining to Nahr al-Dayr while folk drank from Ubulla — till Sulayman ibn Ali came, built al-Mughitha with its masnaniyyat on the batiha, dammed the water from Nahr al-Dayr into Nahr Ibn Umar and spent a million dirhams; and when the sea's intrusion brackened their water he dammed al-Qandal and it ran sweet."
  fr: "L'eau de Bassora n'arrivait qu'en mince filet, la masse de la batiha s'écoulant vers le Nahr al-Dayr tandis que les gens buvaient l'eau d'al-Ubulla, jusqu'à ce que Sulayman ibn Ali vienne, bâtisse al-Mughitha avec ses masnaniyyat sur la batiha, détourne l'eau du Nahr al-Dayr vers le Nahr Ibn Umar et dépense un million de dirhams ; et quand l'intrusion de la mer rendit leur eau saumâtre, il fit barrer al-Qandal et l'eau redevint douce."
  es: "El agua de Basora llegaba en un fino hilo, la masa de la batiha desembocaba en Nahr al-Dayr mientras la gente bebía de Ubulla, hasta que llegó Sulayman ibn Ali, construyó al-Mughitha con su masnaniyyat sobre la batiha, represó el agua de Nahr al-Dayr hacia Nahr Ibn Umar y gastó un millón de dirhams; y cuando la intrusión del mar interrumpió su suministro de agua, represó al-Qandal y el agua corrió dulce."
  ur: "بصرہ کا پانی ایک پتلی سی چال میں آیا، بطحاء کا بڑے پیمانے پر نہر الدیر تک پانی نکلا جب کہ لوگوں نے اُبولہ سے پیا - یہاں تک کہ سلیمان ابن علی آئے، المغیثہ کو بطح پر مسنینیت کے ساتھ تعمیر کیا، نہر الدیر کے پانی کو نہر ابن دیر اور ملین سپہ سالار میں باندھ دیا۔ اور جب سمندر کی مداخلت نے ان کے پانی کو توڑا تو اس نے القندل کو بند کر دیا اور وہ میٹھا ہو گیا۔"
  tr: "Basra halkına gelen su azdı ve bataklığın suyunun çoğu Deyr nehrine akıyordu. Bu yüzden insanlar Süleyman ibn Ali Basra'ya gelip su kaynağını ele geçirene ve bataklık üzerine sulama kanalları inşa edene kadar Ubla nehrinden su içiyorlardı. Böylece Deyr nehrinden gelen suyu kesip İbn Ömer nehrine yönlendirdi. Su kaynağına bir milyon dirhem harcadı. Basra halkı Süleyman'a suyun tuzluluğundan ve kendilerine gelen deniz suyunun çokluğundan şikayet etti. Bunun üzerine Süleyman kanalı kapattı ve suları tatlı hale geldi."
  id: "Air yang sampai ke penduduk Basra sangat langka dan sebagian besar air rawa mengalir ke sungai Al-Dayr. Jadi penduduk biasa minum dari Al-Ubla sampai Sulaiman bin Ali datang ke Basra dan mengambil alih tempat pengambilan air dan membangun saluran irigasi di rawa tersebut. Ia kemudian membendung air dari sungai Al-Dayr dan mengalihkannya ke sungai Ibnu Umar. Ia menghabiskan satu juta dirham untuk tempat pengambilan air tersebut. Penduduk Basra mengeluh kepada Sulaiman tentang rasa asin air dan banyaknya air laut yang sampai kepada mereka. Maka ia membendung saluran tersebut dan air mereka menjadi tawar."
