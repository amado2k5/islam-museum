    summary: { ar: "يرجّح الصلابي أن أول الرجال الأحرار إسلاماً أبو بكر، وأن علياً أول الصبيان إسلاماً؛ ويستند إلى رواية ابن إسحاق في أن النبي أخذه من عمه أبي طالب في أزمة قريش فضمّه إليه قبل البعثة فلم يزل معه (ص31-32).", en: "Al-Sallabi prefers the view that Abu Bakr was the first free man and Ali the first boy to believe, citing Ibn Ishaq's account that the Prophet took Ali into his own care during a famine before the mission (pp. 31-32)." }
