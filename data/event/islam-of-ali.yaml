label: { ar: "إسلام علي بن أبي طالب وهو صبي", en: "Ali ibn Abi Talib accepts Islam as a boy" }
summary:
  ar: "أخذ النبي عليّاً من عمه أبي طالب في أزمة قريش فنشأ في بيته، فلما بُعث النبي اتبعه علي وأقرّ به وصدّقه، وكان إسلامه وهو صبي؛ ويرى الصلابي أنه أول الصبيان إسلاماً، وأن أبا بكر أول الرجال الأحرار. وكان علي يكتم إسلامه عن أبي طالب خوفاً منه، ثم عُرف أمره بصلاته مع النبي في شعاب مكة."
  en: "Ali grew up in the Prophet's household after a famine led the Prophet and al-Abbas to take charge of his upbringing; he followed the Prophet from the start of the mission, and the Sunni author counts him the first boy to believe."
