id: event/al-suyuti-supreme-qadi-902
class: event
kind: other
label:
  ar: "تولية السيوطي «قاضي القضاة الأعظم» ثم رجوع عنها، ٩٠٢هـ/١٤٩٦م"
  en: "Al-Suyuti named 'supreme qadi' by the caliph, then the nomination is retracted, 902/1496"
  ur: "سیوطی کی «قاضی القضاۃ اعظم» تقرری اور اس کی واپسی، 902ھ/1496ء"
summary:
  ar: "سنة ٩٠٢هـ/١٤٩٦م نجح السيوطي في أن يولّيه الخليفة العباسي المتوكل «القاضي الأعظم»، غير أن المتوكل اضطر إلى الرجوع عن تعيينه أمام عداء العلماء؛ وكان السيوطي يرى في الخلفاء العباسيين تجسيد الشرعية وخير ضامن للشريعة والسنة {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  en: "In 902/1496 al-Suyuti succeeded in having himself nominated 'supreme qadi' by the Abbasid caliph al-Mutawakkil in Cairo, but the caliph had to retract when faced with the hostility of the ʿulamaʾ. For al-Suyuti, the Abbasid caliphs were the incarnation of legitimacy, the best guarantors of the revealed Law and the prophetic Sunna {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  ur: "902ھ/1496ء میں سیوطی نے قاہرہ کے عباسی خلیفہ متوکل سے خود کو «قاضی القضاۃ اعظم» مقرر کروایا، لیکن علما کی مخالفت کے سامنے خلیفہ کو پیچھے ہٹنا پڑا۔ سیوطی کی نظر میں عباسی خلفا شرعیت کی علامت اور شریعت و سنت کے بہترین ضامن تھے {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}۔"
