label: { ar: "حلف المطيبين والأحلاف", en: "Alliance of al-Mutayyibin and al-Ahlaf", es: "Alianza de al-Mutayyibin y al-Ahlaf", fr: "Alliance d'al-Mutayyibin et d'al-Ahlaf", ur: "المطیبین اور الاحلاف کا اتحاد", tr: "İyilik İttifakı ve İttifaklar", id: "Aliansi Kebaikan dan Aliansi-Aliansi" }
summary:
  ar: "انقسام قريش حزبين إذ رأى بنو عبد مناف — هاشم وعبد شمس والمطلب ونوفل — أنهم أحق بالحجابة والسقاية والرفادة والندوة واللواء من بني عبد الدار لشرفهم، فتفرقت قريش: اجتمع بنو أسد بن عبد العزى وبنو زهرة وبنو تيم وبنو الحارث بن فهر مع بني عبد مناف، واجتمع بنو مخزوم وسهم وجمح وعدي مع بني عبد الدار، وخرجت عامر بن لؤي ومحارب بن فهر فلم يكونوا مع فريق؛ فعقد كل فريق حلفاً ألا يتخاذلوا ولا يسلم بعضهم بعضاً ما بل بحر صوفة، فأخرجت بنو عبد مناف جفنة مملوءة طيباً فوضعوها في المسجد وغمسوا أيديهم فيها وتعاقدوا ومسحوا الكعبة توكيداً على أنفسهم فسموا المطيبين، وتعاقد بنو عبد الدار ومن معهم عند الكعبة فسموا الأحلاف، ثم تصافوا للقتال فتداعوا للصلح على أن يعطوا بني عبد مناف السقاية والرفادة وتكون الحجابة واللواء والندوة لبني عبد الدار فاصطلحوا، وثبت كل قوم مع من حالفوا حتى جاء الإسلام فقال رسول الله ما كان من حلف في الجاهلية فإن الإسلام لم يزده إلا شدة ولا حلف في الإسلام، وولي السقاية والرفادة هاشم بن عبد مناف لأن عبد شمس كان كثير الأسفار قليل المال {cite:kamil-ibn-al-athir p. 337-338}."
  en: "The pact of the Mutayyibin and the Ahlaf: Quraysh's split over the custodial offices of Qusayy — Banu Abd Manaf with Asad, Zuhra, Taym and Banu al-Harith ibn Fihr bound themselves by dipping their hands in a perfume-filled bowl and stroking the Ka'ba (hence 'the perfumed'), against the Confederates of Abd al-Dar with Makhzum, Sahm, Jumah and Adi; peace gave Banu Abd Manaf the siqaya and rifada while the hijaba, liwa and nadwa stayed with Abd al-Dar — the alliance holding into Islam {cite:kamil-ibn-al-athir p. 337-338}."
  es: "El pacto de los Mutayyibin y los Ahlaf: la división de los Quraysh sobre los cargos de custodia de Qusayy — Banu Abd Manaf con Asad, Zuhra, Taym y Banu al-Harith ibn Fihr se unieron sumergiendo sus manos en un cuenco lleno de perfume y acariciando la Kaaba (de ahí 'los perfumados'), contra los confederados de Abd al-Dar con Makhzum, Sahm, Jumah y Adi; la paz dio a Banu Abd Manaf la siqaya y la rifada mientras que la hijaba, la liwa y la nadwa permanecieron con Abd al-Dar — la alianza se mantuvo en el Islam {cite:kamil-ibn-al-athir p. 337-338}."
  fr: "Le pacte des Mutayyibin et des Ahlaf: la division des Qurayshites au sujet des fonctions de tutelle de Qusayy — Banu Abd Manaf, avec Asad, Zuhra, Taym et Banu al-Harith ibn Fihr, se sont liés en trempant leurs mains dans un bol rempli de parfum et en caressant la Ka'ba (d'où « les parfumés »), contre les confédérés d'Abd al-Dar avec Makhzum, Sahm, Jumah et Adi; la paix a donné à Banu Abd Manaf la siqaya et la rifada tandis que le hijaba, la liwa et la nadwa sont restés avec Abd al-Dar — l'alliance se maintenant dans l'Islam {cite:kamil-ibn-al-athir p. 337-338}."
  ur: "مطیعین اور احلاف کا معاہدہ: قصی کے نگہبانی کے دفاتر پر قریش کی تقسیم - بنو عبد مناف نے اسد، زہرہ، تیم اور بنو الحارث ابن فہر کے ساتھ خوشبو سے بھرے پیالے میں اپنے ہاتھ ڈبو کر اور کعبہ پر ہاتھ پھیر کر خود کو باندھ لیا۔ سہم، جمعہ اور عدی؛ امن نے بنو عبد مناف کو سقایہ اور رفدہ دیا جب کہ حجاب، لیوا اور ندوہ عبد الدار کے ساتھ رہے - جو اتحاد اسلام میں تھا (حوالہ: کامل ابن الاثیر ص۔ 337-338}۔"
  tr: "Kureyş ikiye bölündü; Beni Abd Manaf (Haşim, Abd Şems, El-Muttalib ve Nevfel) kabilesi, şerefleri nedeniyle Beni Abd Al-Dar kabilesinden daha fazla koruyuculuk, su temini, yiyecek temini, meclis ve sancak hakkına sahip olduklarını gördü. Böylece Kureyş ikiye ayrıldı: Beni Asad ibn Abd Al-Uzza, Beni Zuhrah, Beni Taym ve Beni Al-Harith ibn Fihr kabileleri Beni Abd Manaf kabilesine katıldı; Beni Makhzum, Sahm, Jumah ve Adi kabileleri ise Beni Abd Al-Dar kabilesine katıldı. Emir ibn Lu'ay ve Muharib ibn Fihr ise hiçbir gruba katılmadı. Her kabile, Sufah Denizi var olduğu sürece birbirini terk etmemeye ve birbirine ihanet etmemeye dair bir anlaşma yaptı. Beni Abd Manaf, bir kase dolusu parfümü camiye getirdi, ellerini içine batırdı, bir anlaşma yaptı ve bağlılıklarını teyit etmek için Kâbe'yi sildi. Onlara Parfümlüler denildi. Beni Abd el-Dar ve onlarla birlikte olanlar Kâbe'de bir anlaşma yaptılar ve onlara İttifaklar denildi. Sonra savaşa hazırlandılar, ancak Beni Abd Manaf'a su ve yiyecek temin edilmesi, muhafızlığın, sancağın ve meclisin Beni Abd el-Dar'a verilmesi şartıyla barış istediler. Böylece barış yaptılar ve her grup, İslam gelene kadar ittifak kurdukları gruplarla birlikte kaldı. Allah'ın Resulü şöyle buyurmuştur: \"İslam öncesi dönemde ne ittifak varsa, İslam onu sadece güçlendirdi ve İslam'da ittifak yoktur.\" Haşim ibn Abd Manaf'a su ve yiyecek temini sorumluluğu verildi çünkü Abd Şems çok seyahat ediyordu ve az parası vardı. {cite:kamil-ibn-al-athir s. 337-338}"
  id: "Kaum Quraisy terpecah menjadi dua kelompok, karena Bani Abd Manaf — Hashim, Abd Shams, Al-Muttalib, dan Nawfal — merasa bahwa mereka lebih berhak atas perwalian, penyediaan air, penyediaan makanan, dewan, dan panji daripada Bani Abd Al-Dar, karena kehormatan mereka. Maka kaum Quraisy terpecah: Bani Asad ibn Abd Al-Uzza, Bani Zuhrah, Bani Taym, dan Bani Al-Harith ibn Fihr bergabung dengan Bani Abd Manaf, dan Bani Makhzum, Sahm, Jumah, dan Adi bergabung dengan Bani Abd Al-Dar, dan Amir ibn Lu’ay dan Muharib ibn Fihr keluar dan tidak bergabung dengan kelompok mana pun. Setiap kelompok membuat perjanjian untuk tidak saling meninggalkan atau mengkhianati satu sama lain selama Laut Sufah masih ada. Bani Abd Manaf mengeluarkan semangkuk penuh parfum dan meletakkannya di masjid, mencelupkan tangan mereka ke dalamnya, membuat perjanjian, dan mengusap Ka'bah untuk menegaskan komitmen mereka. Mereka disebut Kaum Berparfum. Bani Abd al-Dar dan orang-orang yang bersama mereka membuat perjanjian di Ka'bah dan disebut Aliansi. Kemudian mereka bersiap untuk berperang, tetapi mereka menyerukan perdamaian dengan syarat bahwa Bani Abd Manaf akan diberi pasokan air dan makanan, dan bahwa penjagaan, panji, dan dewan akan menjadi milik Bani Abd al-Dar. Maka mereka berdamai, dan setiap kelompok tetap bersama mereka yang bersekutu sampai Islam datang. Rasulullah SAW bersabda, “Apa pun aliansi yang ada di era pra-Islam, Islam hanya memperkuatnya, dan tidak ada aliansi dalam Islam.” Hashim ibn Abd Manaf diberi tanggung jawab menyediakan air dan makanan karena Abd Shams sering bepergian dan memiliki sedikit uang. {cite:kamil-ibn-al-athir p. 337-338}"
