id: event/al-kufi-reaches-yemen-in-drought-before-al-hadi
class: event
kind: other
label:
  ar: وصول الكوفي ورفاقه إلى اليمن في قحط قبل الهادي وتوقف الفتنة انتظاراً له
  en: Al-Kufi's party reaches Yemen in drought before al-Hadi, and a feud pauses awaiting him
  ur: کوفی اور ان کے ساتھی ہادی سے پہلے قحط میں یمن پہنچتے ہیں اور ان کے انتظار میں ایک فتنہ رک جاتا ہے
summary:
  ar: يروي الكوفي أنهم وردوا اليمن قبل الهادي بنحو خمسين يوماً والزرع قد يبس والبهائم تتساقط هزالاً، وأتوا قوماً بينهم فتنة عظيمة فلما عرفوا أنهم من أصحابه قطعوها انتظاراً له؛ ثم يسوق الكتاب فقرة مدح للإمام ويذكر وفد نجران الذين كتبوا يدعونه.
  en: Al-Kufi says they reached Yemen some fifty days before al-Hadi, the crops dry and the animals dying of leanness, and came to a people in a great feud who, learning they were al-Hadi's men, put it aside awaiting him; the book then gives a passage of praise and names the Najran delegation that wrote inviting him.
  ur: کوفی بتاتے ہیں کہ وہ ہادی سے پچاس دن کے قریب پہلے یمن پہنچے، فصلیں خشک تھیں اور جانور لاغری سے گر رہے تھے، اور وہ ایک ایسی قوم کے پاس آئے جن میں بڑا فتنہ تھا اور جب انہیں معلوم ہوا کہ یہ ہادی کے ساتھی ہیں تو انہوں نے ان کے انتظار میں فتنہ روک دیا؛ پھر کتاب مدح کا ایک حصہ دیتی ہے اور نجران کے اس وفد کا ذکر کرتی ہے جس نے انہیں بلانے کو لکھا۔
