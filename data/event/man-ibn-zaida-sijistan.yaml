label: { ar: "حملة معن بن زائدة على رتبيل", en: "Ma'n ibn Za'ida's Campaign on Rutbil", es: "La campaña de Ma'n ibn Za'ida en Rutbil", fr: "Campagne de Ma'n ibn Za'ida sur Rutbil", ur: "معن بن زیدہ کی مہم رتبیل پر", tr: "Ma'n ibn Za'idah'ın Ratbil'e karşı kampanyası", id: "Kampanye Ma'n ibn Za'idah melawan Ratbil" }
summary:
  ar: "ولى المنصور معن بن زائدة الشيباني سجستان فكتب إلى رتبيل يأمره بحمل الأتاوة التي كان الحجاج صالح عليها فبعث بإبل وقباب تركية ورقيق وزاد في قيمة ذلك للواحد ضعفه فغضب معن وقصد الرخج وعلى مقدمته يزيد بن مزيد فوجد رتبيل قد خرج عنها ومضى إلى زابلستان ليصيف بها ففتحها وأصاب سبايا كثيرة وكان فيهم فرج الرخجي وهو صبي وأبوه زياد وكان فرج يحدث أن معناً رأى غباراً ساطعاً أثارته حوافر حمير وحشية فظن أن جيشاً قد أقبل نحوه ليحار به ويتخاص السبي والأسرى من يده فوضع السيف فيهم فقتل منهم عدة كثيرة ثم تبين أمر الغبار ورأى الحمير فأمسك وقال فرج لقد رأيت أبي حين أمر معن بوضع السيف فينا وقد حنى علي وهو يقول اقتلوني ولا تقتلوا ابني وكانت عدة من سبي معن وأسر زهاء ثلاثين ألفاً وطلب ماوند خليفة رتبيل الأمان على أن يحمله إلى أمير المؤمنين فآمنه وبعث به إلى بغداد مع خمسة آلاف من مقاتلتهم فأكرمه المنصور وفرض له وقوده."
  en: "Al-Mansur gave Sijistan to Ma'n ibn Za'ida al-Shaybani, who demanded of Rutbil the atawa al-Hajjaj had settled; Rutbil sent camels, Turkish tents and slaves, doubled in value — which enraged Ma'n. With Yazid ibn Mazyad on the van he marched on Rukhkhaj; Rutbil had left to summer in Zabulistan, which Ma'n took with mass captives, among them the boy Faraj al-Rukhkhaji — who told how a cloud of dust raised by wild asses' hooves looked to Ma'n like an army coming to wrest the captives, so he put them to the sword until he saw the donkeys and stopped; 'I saw my father bent over me saying: kill me, not my son'. The captives ran near thirty thousand. Mawand, Rutbil's deputy, sought aman to be borne to the Commander of the Faithful — sent to Baghdad with five thousand of their fighters, honored by al-Mansur, granted stipend and command."
  es: "Al-Mansur le dio Sijistan a Ma'n ibn Za'ida al-Shaybani, quien le exigió a Rutbil el atawa al-Hajjaj que había establecido; Rutbil envió camellos, tiendas turcas y esclavos, cuyo valor se duplicó, lo que enfureció a Ma'n. Con Yazid ibn Mazyad a la cabeza, marchó sobre Rukhkhaj; Rutbil se había ido a pasar el verano a Zabulistán, que Ma'n tomó con un gran número de cautivos, entre ellos el niño Faraj al-Rukhkhaji, quien contó cómo una nube de polvo levantada por las pezuñas de los asnos salvajes le pareció a Ma'n un ejército que venía a arrebatar a los cautivos, así que los pasó a cuchillo hasta que vio a los asnos y se detuvo; «Vi a mi padre inclinado sobre mí diciendo: mátame a mí, no a mi hijo». Los cautivos huyeron cerca de treinta mil. Mawand, el lugarteniente de Rutbil, solicitó que se presentara ante el Comandante de los Creyentes, quien lo enviaría a Bagdad con cinco mil de sus combatientes, donde sería honrado por al-Mansur y recibiría un estipendio y el mando."
  fr: "Al-Mansur confia le Sijistan à Ma'n ibn Za'ida al-Shaybani, qui réclama à Rutbil l'atawa qu'al-Hajjaj avait établie. Rutbil envoya des chameaux, des tentes turques et des esclaves, dont la valeur avait doublé, ce qui mit Ma'n en rage. Avec Yazid ibn Mazyad en tête, il marcha sur Rukhkhaj. Rutbil était parti passer l'été au Zabulistan, que Ma'n prit avec un grand nombre de captifs, parmi lesquels le jeune Faraj al-Rukhkhaji. Ce dernier raconta comment un nuage de poussière soulevé par les sabots d'ânes sauvages avait fait croire à Ma'n qu'une armée s'apprêtait à arracher les captifs. Il les passa donc au fil de l'épée jusqu'à ce qu'il aperçoive les ânes et s'arrête: « J'ai vu mon père penché sur moi, disant: Tuez-moi, pas mon fils ! » Le nombre de captifs avoisinait les trente mille. Mawand, l'adjoint de Rutbil, chercha un homme à amener au Commandeur des Croyants — envoyé à Bagdad avec cinq mille de leurs combattants, honoré par al-Mansur, qui lui accorda une allocation et le commandement."
  ur: "المنصور نے سجستان معن بن زیدہ الشیبانی کو دیا، جس نے رتبیل کا مطالبہ کیا تھا کہ عطیہ الحجاج نے طے کیا تھا۔ رتبل نے اونٹ، ترکی کے خیمے اور غلام بھیجے، جن کی قیمت دوگنی ہو گئی - جس نے مان کو غصہ دلایا۔ یزید بن مازیاد کے ساتھ وین پر سوار ہو کر رخخج پر روانہ ہوا۔ رتبیل موسم گرما کے لیے زابلستان میں روانہ ہوا تھا، جسے معن نے بڑے پیمانے پر قیدیوں کے ساتھ لے لیا، ان میں لڑکا فراج الرخاجی تھا - جس نے بتایا کہ جنگلی گدھوں کے کھروں سے اٹھی ہوئی دھول کا بادل معن کی طرف اس طرح نظر آتا ہے جیسے کوئی لشکر اسیروں کو چھیڑنے کے لیے آ رہا ہو، اس لیے اس نے انہیں تلوار سے باندھ دیا جب تک کہ اس نے گدھوں کو دیکھا اور رک گیا۔ 'میں نے دیکھا کہ میرے والد مجھ پر جھکے ہوئے کہہ رہے ہیں: مجھے مار ڈالو، میرے بیٹے کو نہیں'۔ قیدی تیس ہزار کے قریب بھاگ گئے۔ روتبل کے نائب، ماوند نے وفاداروں کے کمانڈر کے لیے امان کی خواہش کی - اپنے پانچ ہزار جنگجوؤں کے ساتھ بغداد بھیجا، المنصور نے اعزازی طور پر وظیفہ اور حکم دیا۔"
  tr: "El-Mansur, Ma'n ibn Za'idah el-Şeybani'yi Sijistan valiliğine atadı. Ratbil'e, el-Haccac'ın anlaştığı vergiyi toplaması için emir verdi. Ratbil, develer, Türk çadırları ve köleler gönderdi ve her birinin değerini ikiye katladı. Ma'n öfkelendi ve öncülüğünde Yazid ibn Mazid ile birlikte el-Rukhj'a yürüdü. Ratbil'in yaz tatilini geçirmek için Zabulistan'a gittiğini gördü. Orayı fethetti ve aralarında genç bir çocuk olan Faraj el-Rukhji ve babası Ziyad'ın da bulunduğu birçok esir aldı. Faraj, Ma'n'ın vahşi eşeklerin toynaklarının kaldırdığı parlak bir toz bulutu gördüğünü ve kendisine saldırmak ve esirleri almak için bir ordunun yaklaştığını sandığını anlattı. Kılıcını çekti ve birçoğunu öldürdü. Sonra toz bulutunun orada olduğunu ve eşekleri gördüğünü fark etti ve durdu. Faraj şöyle dedi: \"Ma'n bize karşı kılıç çekme emri verdiğinde babamı gördüm. Bana doğru eğildi ve 'Beni öldürün, ama oğlumu öldürmeyin' dedi.\" Ma'n yaklaşık otuz bin esir aldı. Ratbil'in yardımcısı Mawand, onu Müminlerin Komutanı'na teslim etmesi şartıyla güvenli geçiş istedi. Güvenli geçiş izni verildi ve beş bin adamla Bağdat'a gönderildi. Onlarla savaştı, bu yüzden El-Mansur onu onurlandırdı ve ona yakacak sağladı."
  id: "Al-Mansur menunjuk Ma'n ibn Za'idah al-Shaybani sebagai gubernur Sijistan. Ia menulis surat kepada Ratbil, memerintahkannya untuk mengumpulkan upeti yang telah disepakati al-Hajjaj. Ratbil mengirimkan unta, tenda Turki, dan budak, menggandakan nilai masing-masing. Ma'n menjadi marah dan berbaris menuju al-Rukhj, dengan Yazid ibn Mazid sebagai garda depannya. Ia mendapati bahwa Ratbil telah pergi ke Zabulistan untuk menghabiskan musim panas di sana. Ia menaklukkannya dan menangkap banyak tawanan, termasuk Faraj al-Rukhji, seorang anak laki-laki, dan ayahnya, Ziyad. Faraj menceritakan bahwa Ma'n melihat awan debu terang yang terangkat oleh kuku keledai liar dan mengira pasukan sedang mendekat untuk menyerangnya dan merebut tawanan. Ia menghunus pedangnya dan membunuh banyak dari mereka. Kemudian ia menyadari awan debu itu ada di sana dan melihat keledai-keledai itu, jadi ia berhenti. Faraj berkata, \"Aku melihat ayahku ketika Ma'n memerintahkan pedang dihunus melawan kami. Dia membungkuk ke arahku dan berkata, 'Bunuh aku, tetapi jangan bunuh anakku.'\" Ma'n menawan sekitar tiga puluh ribu orang. Mawand, wakil Ratbil, meminta jalan aman dengan syarat dia akan menyerahkannya kepada Panglima Kaum Beriman. Dia diberikan jalan aman dan dikirim ke Baghdad dengan lima ribu orang. Dia melawan mereka, sehingga Al-Mansur menghormatinya dan memberinya bahan bakar."
