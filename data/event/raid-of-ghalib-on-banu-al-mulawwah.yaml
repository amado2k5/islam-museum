id: event/raid-of-ghalib-on-banu-al-mulawwah
class: event
kind: raid
label: { ar: "غزوة غالب بن عبد الله الليثي بني الملوح بالكديد", en: "Ghalib ibn Abdullah al-Laythi's raid on Banu al-Mulawwah at al-Kudayd", es: "Incursión de Ghalib ibn Abdullah al-Laythi contra Banu al-Mulawwah en al-Kudayd", fr: "Raid de Ghalib ibn Abdullah al-Laythi sur Banu al-Mulawwah à al-Kudayd" }
summary:
  ar: "بعث النبي غالب بن عبد الله الليثي في سرية ليشنّ الغارة على بني الملوح بالكديد؛ يرويها جندب بن مكيث الجهني الذي كان فيها: أخذوا بقديد الحارث بن مالك ابن البرصاء الليثي الذي زعم أنه يريد الإسلام فأوثقوه، وكان جندب ربيئة القوم على تل فرماه رجل منهم بسهمين فثبت مكانه، ثم شنّوا الغارة في وجه السحر فقتلوا واستاقوا النعم، ولحقهم القوم فأرسل الله وادي قديد بالسيل من غير سحابة فحال بينهم؛ وكان شعار المسلمين تلك الليلة: أمت أمت."
  en: "The Prophet sent Ghalib ibn Abdullah al-Laythi with a detachment to raid Banu al-Mulawwah at al-Kudayd; Jundab ibn Makith al-Juhani, who was in it, tells it: at Qudayd they seized al-Harith ibn Malik ibn al-Barsa' al-Laythi, who claimed he was going to embrace Islam, and bound him; Jundab served as lookout on a hill and a man of the camp shot him with two arrows, but he kept still; before dawn they raided, killed and drove off the herds, and when the pursuers reached Wadi Qudayd God sent a flood without a cloud that cut them off. The Muslims' watchword that night was 'amit, amit'."
  es: "El Profeta envió a Ghalib ibn Abdullah al-Laythi con un destacamento para atacar a Banu al-Mulawwah en al-Kudayd; Jundab ibn Makith al-Juhani, que estaba en la expedición, lo relata: en Qudayd capturaron a al-Harith ibn Malik ibn al-Barsa' al-Laythi, quien afirmaba que iba a abrazar el Islam, y lo ataron; Jundab vigiló desde una colina y un hombre del campamento le disparó dos flechas, pero él se mantuvo inmóvil; antes del amanecer atacaron, mataron y dispersaron a los rebaños, y cuando los perseguidores llegaron a Wadi Qudayd, Dios envió una inundación sin nube que los aisló. La consigna de los musulmanes esa noche fue \"amit, amit\"."
  fr: "Le Prophète envoya Ghalib ibn Abdullah al-Laythi avec un détachement attaquer les Banu al-Mulawwah à al-Kudayd. Jundab ibn Makith al-Juhani, qui en faisait partie, raconte: à Qudayd, ils capturèrent al-Harith ibn Malik ibn al-Barsa' al-Laythi, qui prétendait vouloir se convertir à l'islam, et le ligotèrent. Jundab, posté en faction sur une colline, fut touché par deux flèches tirées par un homme du camp, mais il resta immobile. Avant l'aube, ils lancèrent l'attaque, massacrèrent les troupeaux et les emmenèrent. Lorsque les poursuivants atteignirent le Wadi Qudayd, Dieu envoya un torrent impétueux qui les interrompit. Le mot d'ordre des musulmans cette nuit-là fut: « Amit, amit ! »"
