label: { ar: "غزوة غالب بن عبد الله الليثي بني الملوح بالكديد", en: "Ghalib ibn Abdullah al-Laythi's raid on Banu al-Mulawwah at al-Kudayd" }
summary:
  ar: "بعث النبي غالب بن عبد الله الليثي في سرية ليشنّ الغارة على بني الملوح بالكديد؛ يرويها جندب بن مكيث الجهني الذي كان فيها: أخذوا بقديد الحارث بن مالك ابن البرصاء الليثي الذي زعم أنه يريد الإسلام فأوثقوه، وكان جندب ربيئة القوم على تل فرماه رجل منهم بسهمين فثبت مكانه، ثم شنّوا الغارة في وجه السحر فقتلوا واستاقوا النعم، ولحقهم القوم فأرسل الله وادي قديد بالسيل من غير سحابة فحال بينهم؛ وكان شعار المسلمين تلك الليلة: أمت أمت."
  en: "The Prophet sent Ghalib ibn Abdullah al-Laythi with a detachment to raid Banu al-Mulawwah at al-Kudayd; Jundab ibn Makith al-Juhani, who was in it, tells it: at Qudayd they seized al-Harith ibn Malik ibn al-Barsa' al-Laythi, who claimed he was going to embrace Islam, and bound him; Jundab served as lookout on a hill and a man of the camp shot him with two arrows, but he kept still; before dawn they raided, killed and drove off the herds, and when the pursuers reached Wadi Qudayd God sent a flood without a cloud that cut them off. The Muslims' watchword that night was 'amit, amit'."
