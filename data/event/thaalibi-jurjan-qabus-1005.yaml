label:
  ar: "إقامتا الثعالبي بجرجان وإهداؤه لقابوس، نحو ٣٩٥هـ"
  en: "Al-Tha'alibi's Jurjan sojourns and his dedications to Qabus, c. 395/1005"
  ur: "جرجان میں ثعالبی کے قیام اور قابوس کے نام اهدائیں، تقریباً 395ھ/1005ء"
summary:
  ar: "أقام الثعالبي بجرجان إقامتين على الأقل، نازلاً بأهل بيتها الأشراف، وأهدى إلى أميرها قابوس بن وشمكير جملة من مصنفاته منها «المبهج» في فصول النثر المسجوع، وقد كان قابوس نفسه من الكتّاب المصقوعين، ويرجّح أن الثعالبي لقيه في منفاه الطويل بنيسابور قبل استرداده الملك سنة ٣٨٨هـ {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}."
  en: "Al-Tha'alibi sojourned at least twice at Jurjan, staying with members of the city's leading family, and dedicated a series of works to its amir Qabus ibn Wushmgir — among them al-Mubhij, a collection of rhymed-prose sentences; Qabus was himself a noted stylist, and al-Tha'alibi had probably met him during the amir's long exile at Nishapur before he regained his throne in 388 {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}."
  ur: "ثعالبی نے کم از کم دو بار جرجان میں قیام کیا اور شہر کے معزز گھرانے کے افراد کے ہاں ٹھہرے، اور امیر قابوس بن وشمگیر کے نام متعدد تصانیف وقف کیں جن میں نثرِ مسجوع کے فصول کا مجموعہ «المبهج» بھی ہے؛ قابوس خود معروف خطاط و ادیب تھا اور غالباً ثعالبی اس سے اس کے طویل جلاوطنی کے دوران نیشاپور میں ملے، اس کے تخت کی واپسی 388ھ سے پہلے {cite:encyclopaedia-of-islam-2 vol. 10 p. 450-451}۔"
