label: { ar: "حصار الأذفونش قرطبة ودخولها في طاعة الموحدين" }
summary:
  ar: "في سنة خمس وأربعين وخمسمائة سار الأذفونش صاحب طليطلة وبلاد الجلالقة إلى قرطبة ومعه أربعون ألف فارس فحاصرها وكان أهلها في غلاء شديد، فبلغ الخبر عبد المؤمن فجهز إليهم جيشاً يحتوي على اثني عشر ألف فارس؛ فلما أشرفوا على الأذفونش رحل عنها، وكان فيها القائد أبو الغمر السائب فسلمها إلى صاحب جيش عبد المؤمن يحيى بن ميمون فبات فيها، فلما أصبح رأى الفرنج عادوا إلى مكانهم ونزلوا في المكان الذي كانوا فيه فرتب هنالك ناساً وعاد إلى عبد المؤمن ثم رحل الفرنج إلى ديارهم {cite:nafh-tib-maqqari p. 382}. وفي السنة بعدها دخل جيش عبد المؤمن إلى الأندلس في عشرين ألفاً عليهم المنتاتي فصار إليه صاحب غرناطة ميمون وابن همشك وغيرهما فدخلوا تحت طاعة الموحدين {cite:nafh-tib-maqqari p. 382}."
  en: "Alfonso VII's siege of Cordoba (545) with forty thousand horse while the city starved; Abd al-Mu'min sent twelve thousand under whom the Frank withdrew, and the commander Abu al-Ghamr al-Sa'ib surrendered it to Yahya ibn Maymun — then the Almohad army entered al-Andalus twenty thousand strong under al-Muntati, and Granada's Maymun and Ibn Hamushk submitted {cite:nafh-tib-maqqari p. 382}."
