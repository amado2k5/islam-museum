label:
  ar: "أبيات «هل لك» للهادي في الأكرومة ومقام بدر والجنة والتوبة، ص308-309"
  en: "Al-Hadi's \"have you a wish\" verses on nobility, the station of Badr, Paradise and repentance, pp. 308-309"
  ur: "ہادی کے «کیا تجھے رغبت ہے» کے اشعار: شرافت، مقامِ بدر، جنت اور توبہ، ص308-309"
  es: "Versículos de Al-Hadi sobre la nobleza, la estación de Badr, el Paraíso y el arrepentimiento, págs. 308-309."
  fr: "Les versets d'Al-Hadi intitulés « Avez-vous un souhait ? » sur la noblesse, la station de Badr, le Paradis et le repentir, pp. 308-309"
  tr: "Al-Hadi'nin Al-Akruma, Maqam Badr, Al-Jannah ve At-Tawbah adlı eserlerinde geçen \"Sahip misin?\" ayetleri, s. 308-309"
  id: "Ayat-ayat “Apakah kamu memiliki” karya Al-Hadi dalam Al-Akruma, Maqam Badr, Al-Jannah, dan At-Tawbah, hlm. 308-309"
summary:
  ar: "قصيدة من السريع بعنوان «وله أيضاً» تتكرر فيها عبارة «هل لك في» ثماني مرات: في الأكرومة التي لا تبلى، وفي مقام الذين حموا حمى الله ببدر، وفي عزمة ذي نية، وفي نهضة ذي صولة، وفي الجنة، وفي الرحمن، وفي التوبة قبل مجال النفس، وفي أمر يؤمّن هول البعث."
  en: "A poem in the sari' metre under the heading \"and also of his\" built on the repeated question \"have you a wish for\": for the unspoiled nobility that does not wear out, for the station of those who guarded God's sanctuary at Badr, for the resolve of one with intent, for the rising of a man of power, for Paradise, for the Merciful, for repentance before the soul's turning, and for a matter that gives safety from the terror of the resurrection."
  ur: "سریع بحر کی نظم عنوان «اور اس کا یہ بھی» کے تحت جس میں «کیا تجھے رغبت ہے» کا سوال بار بار آتا ہے: اس شرافت کی جو دہر میں پرانی نہیں ہوتی، ان کے مقام کی جنہوں نے بدر میں اللہ کے حرم کی حفاظت کی، نیت والے کے عزم کی، طاقت والے کے اٹھنے کی، جنت کی، رحمان کی، جان کے لوٹنے سے پہلے توبہ کی اور اس کام کی جو قیامت کے ہول سے امن دے۔"
  es: "Un poema en metro sari' bajo el título \"y también de él\" construido sobre la pregunta repetida \"¿tienes algún deseo por?\": por la nobleza inmaculada que no se desgasta, por la posición de aquellos que custodiaban el santuario de Dios en Badr, por la resolución de uno con intención, por el ascenso de un hombre de poder, por el Paraíso, por el Misericordioso, por el arrepentimiento antes de la conversión del alma, y por un asunto que da seguridad del terror de la resurrección."
  fr: "Un poème en mètre sari, sous le titre « et aussi de lui », construit sur la question répétée « avez-vous un souhait pour »: pour la noblesse intacte qui ne s'use pas, pour le rang de ceux qui gardaient le sanctuaire de Dieu à Badr, pour la résolution de celui qui a une intention, pour l'ascension d'un homme de pouvoir, pour le Paradis, pour le Miséricordieux, pour le repentir avant le retournement de l'âme, et pour une chose qui protège de la terreur de la résurrection."
  tr: "Al-Sari’ vezninde yazılmış, “Onun için de” başlıklı bir şiirde, “Benimle bir payın var mı?” ifadesi sekiz kez tekrarlanmaktadır: ebedi cömertlikte, Bedir'de Allah'ın kutsal mekanını koruyanların konumunda, niyetli olanın azminde, kudret sahibi olanın ayaklanmasında, Cennette, Merhametli olanda, nefs âlemi önünde tövbede ve kıyametin dehşetinden koruyan bir konuda."
  id: "Sebuah puisi dalam metrum Al-Sari' berjudul \"Dan untuknya juga\" di mana frasa \"Apakah kamu memiliki bagian dalam diriku?\" diulang delapan kali: dalam kemurahan hati yang abadi, dalam kedudukan orang-orang yang melindungi tempat suci Allah di Badr, dalam tekad seseorang yang memiliki niat, dalam kebangkitan seseorang yang berkuasa, di Surga, dalam Yang Maha Penyayang, dalam pertobatan di hadapan alam jiwa, dan dalam suatu perkara yang menyelamatkan dari kengerian kebangkitan."
