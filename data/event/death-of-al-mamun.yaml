label: { ar: "وفاة المأمون", en: "Death of al-Ma'mun" }
summary:
  ar: "توفي المأمون يوم الخميس لثلاث عشرة ليلة بقيت من رجب سنة ثماني عشرة ومائتين على عين البديدون المعروفة بالقشيرة بعد أن فتح خمسة عشر حصناً من حصون الروم، وهو أنه ألقى درهماً في الماء فقرأ كتابته لصفائه ثم لاحت سمكة نحو الذراع كأنها سبيكة فضة فقال لمن يخرجها سبق فلما أخرجت أفلتت فوقعت في الماء فنضح على صدره ونحره وترقوته فقال تقلي الساعة فأخذته رعدة وأصبح يصيح البرد البرد، ولم يقدر ابن ماسويه وبختيشوع أن يعرفا داءه وقالا إنه دال على انحلال الجسد، وسأل أسارى الروم عن تفسير القشيرة فقيل مد رجليك وقيل اسم الموضع بالعربية الرقة وكان يحيد عن المقام بالرقة فرقاً من الموت، فأشرف ليلاً على عسكره فقال يا من لا يزول ملكه ارحم من قد زال ملكه، وقضى وحمل إلى طرسوس فدفن بها {cite:muruj-al-dhahab p. 435-437}."
  en: "Al-Ma'mun's death by the Qushayra spring after the fish's splash — 'cook it at once' — the shaking ague the physicians could not name, the omen 'stretch your legs', and 'O One whose kingdom never passes, have mercy on him whose kingdom has passed' {cite:muruj-al-dhahab p. 435-437}."
