class: event
kind: other
label:
  ar: "رحلات النسائي في طلب الحديث بخراسان والعراق والشام ومصر والحجاز والجزيرة، بعد ٢٤٠هـ"
  en: "Al-Nasa'i's hadith journeys through Khurasan, Iraq, al-Sham, Egypt, the Hijaz and the Jazira, after 240/854"
  ur: "نسائی کے طلبِ حدیث کے سفر: خراسان، عراق، شام، مصر، حجاز اور جزیرہ، 240ھ/854ء کے بعد"
  es: "Los viajes de hadices de Al-Nasa'i a través de Jorasán, Irak, Siria, Egipto, el Hiyaz y la Jazira, después del año 240/854."
  fr: "Les hadiths d'Al-Nasa'i traversent le Khorasan, l'Irak, le Levant, l'Égypte, le Hedjaz et la Jazira, après 240/854."
  tr: "Hicri 240 yılından sonra El-Nasaî'nin Horasan, Irak, Suriye, Mısır, Hicaz ve Arap Yarımadası'nda hadis arayışıyla yaptığı seyahatler."
  id: "Perjalanan Al-Nasa'i dalam mencari Hadits di Khorasan, Irak, Suriah, Mesir, Hijaz, dan Semenanjung Arab, setelah tahun 240 Hijriah."
summary:
  ar: "سمع النسائي خلقاً من الشيوخ بعد الأربعين ومائتين بخراسان والعراق والشام ومصر والحجاز والجزيرة، ورحل إلى مرو ونيسابور وما وراءها، ومن أبرز شيوخه قتيبة بن سعيد وإسحاق بن راهويه وهشام بن عمار وعيسى بن حماد ومحمد بن النضر المروزي وأبو كريب وسويد بن نصر {cite:tarikh-islam-dhahabi p. 106} {cite:tazkirat-al-huffaz j.2 p. 617}؛ ويذكر المستشرقون أنه طاف أسفاراً واسعة في طلب الحديث قبل استقراره بمصر {cite:encyclopaedia-of-islam-2 vol. 7 p. 1023}."
  en: "After 240/854 al-Nasa'i heard from a host of shaykhs in Khurasan, Iraq, al-Sham, Egypt, the Hijaz and the Jazira, travelling to Marw, Nishapur and beyond; his best-known teachers were Qutayba ibn Sa'id, Ishaq ibn Rahwayh, Hisham ibn Ammar, Isa ibn Hammad, Muhammad ibn al-Nadr al-Marwazi, Abu Kurayb and Suwayd ibn Nasr {cite:tarikh-islam-dhahabi p. 106} {cite:tazkirat-al-huffaz j.2 p. 617}; modern scholars describe extensive travels in quest of hadith before he settled in Egypt {cite:encyclopaedia-of-islam-2 vol. 7 p. 1023}."
  ur: "240ھ/854ء کے بعد نسائی نے خراسان، عراق، شام، مصر، حجاز اور جزیرہ میں بے شمار مشائخ سے سماعت کی اور مرو اور نیشاپور تک سفر کیا؛ ان کے نامور مشائخ میں قتیبہ بن سعید، اسحاق بن راہویہ، ہشام بن عمار، عیسیٰ بن حماد، محمد بن نضر مروزی، ابو کریب اور سوید بن نصر ہیں {cite:tarikh-islam-dhahabi p. 106} {cite:tazkirat-al-huffaz j.2 p. 617}؛ محققین کے نزدیک انہوں نے مصر میں سکونت سے پہلے طلبِ حدیث میں وسیع سفر کیے {cite:encyclopaedia-of-islam-2 vol. 7 p. 1023}۔"
  es: "Después de 240/854, al-Nasa'i escuchó a una multitud de shaykhs en Jorasán, Irak, al-Sham, Egipto, el Hiyaz y el Jazira, viajando a Marw, Nishapur y más allá; sus maestros más conocidos fueron Qutayba ibn Sa'id, Ishaq ibn Rahwayh, Hisham ibn Ammar, Isa ibn Hammad, Muhammad ibn al-Nadr al-Marwazi, Abu Kurayb y Suwayd ibn Nasr {cite:tarikh-islam-dhahabi p. 106} {cite:tazkirat-al-huffaz j.2 p. 617}; los eruditos modernos describen extensos viajes en busca de hadices antes de que se estableciera en Egipto {cite:encyclopaedia-of-islam-2 vol. 7 p. 1023}."
  fr: "Après 240/854, al-Nasa'i reçut l'enseignement de nombreux cheikhs du Khorasan, d'Irak, du Levant, d'Égypte, du Hedjaz et de la Jazira, voyageant jusqu'à Marw, Nishapur et au-delà; ses maîtres les plus connus furent Qutayba ibn Sa'id, Ishaq ibn Rahwayh, Hisham ibn Ammar, Isa ibn Hammad, Muhammad ibn al-Nadr al-Marwazi, Abu Kurayb et Suwayd ibn Nasr {cite:tarikh-islam-dhahabi p. 106} {cite:tazkirat-al-huffaz j.2 p. 617}; les érudits modernes décrivent de longs voyages à la recherche de hadiths avant qu'il ne s'installe en Égypte {cite:encyclopaedia-of-islam-2 vol. 7 p. 1023}."
  tr: "El-Nasa’i, Hicri 240 yılından sonra Horasan, Irak, Suriye, Mısır, Hicaz ve Cezire’de çok sayıda şeyhten hadis dinledi. Merv, Nişapur ve daha uzak yerlere seyahat etti. En önde gelen şeyhleri arasında Kuteybe ibn Sa’id, İshak ibn Rahwayh, Hişam ibn Ammar, İsa ibn Hammad, Muhammed ibn el-Nadr el-Marwazi, Ebu Kurayb ve Suveyd ibn Nasr bulunmaktadır. {kaynak:tarikh-islam-dhahabi s. 106} {kaynak:tazkirat-al-huffaz cilt 2 s. 617}. Oryantalistler, Mısır’a yerleşmeden önce hadis arayışı içinde geniş çaplı seyahatler yaptığını belirtmektedir. {kaynak:encyclopaedia-of-islam-2 cilt 7 s. 1023}."
  id: "Al-Nasa’i mendengar hadits dari banyak ulama setelah tahun 240 H di Khurasan, Irak, Suriah, Mesir, Hijaz, dan Jazira. Ia melakukan perjalanan ke Merv, Nishapur, dan sekitarnya. Di antara ulama terkemuka yang ia dengar adalah Qutaybah ibn Sa’id, Ishaq ibn Rahwayh, Hisham ibn Ammar, Isa ibn Hammad, Muhammad ibn al-Nadr al-Marwazi, Abu Kurayb, dan Suwayd ibn Nasr. {cite:tarikh-islam-dhahabi p. 106} {cite:tazkirat-al-huffaz j.2 p. 617}. Para orientalis menyebutkan bahwa ia melakukan perjalanan secara luas untuk mencari hadits sebelum menetap di Mesir. {cite:encyclopaedia-of-islam-2 vol. 7 p. 1023}."
