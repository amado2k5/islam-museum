label: { ar: "أخذ التتار أربل بالسيف سنة 634", en: "The Tatars Take Arbil by the Sword in 634 AH", es: "Los tártaros toman Arbil por la espada en el año 634 AH.", fr: "Les Tatars prennent Arbil par l'épée en 634 AH", ur: "تاتاریوں نے 634 ہجری میں تلوار سے اربیل پر قبضہ کیا۔", tr: "Tatarlar 634 yılında Erbil'i kılıç zoruyla ele geçirdiler.", id: "Bangsa Tatar merebut Arbil dengan pedang pada tahun 634." }
summary:
  ar: "في سنة أربع وثلاثين وستمائة نزل التتار على أربل وحاصروها وأخذوها بالسيف حتى جافت المدينة بالقتلى وترحلوا بغنائم لا تحصى {cite:shadharat-dhahab p. 162}."
  en: "In 634 the Tatars descended on Arbil, besieged it and took it by the sword until the city was choked with corpses, departing with countless spoils — the Begteginid capital overrun {cite:shadharat-dhahab p. 162}."
  es: "En 634, los tártaros descendieron sobre Arbil, la sitiaron y la tomaron por la espada hasta que la ciudad quedó repleta de cadáveres, marchándose con innumerables botines: la capital begteginí fue invadida {cite:shadharat-dhahab p. 162}."
  fr: "En 634, les Tatars descendirent sur Erbil, l'assiégèrent et la prirent par l'épée jusqu'à ce que la ville soit étouffée par les cadavres, repartant avec d'innombrables butins — la capitale des Begteginides envahie {cite:shadharat-dhahab p. 162}."
  ur: "634 میں تاتاری اربیل پر اترے، اس کا محاصرہ کیا اور تلوار سے اس پر قبضہ کر لیا یہاں تک کہ شہر لاشوں سے لتھڑا ہوا، بے شمار غنیمت لے کر روانہ ہو گیا۔ 162}۔"
  tr: "Altı yüz otuz dördüncü yılda Tatarlar Erbil'e saldırdılar, şehri kuşattılar ve kılıçla ele geçirdiler; şehir ölülerle doldu ve sayısız ganimetle ayrıldılar. {cite:shadharat-dhahab s. 162}"
  id: "Pada tahun enam ratus tiga puluh empat, bangsa Tatar menyerbu Irbil, mengepungnya, dan merebutnya dengan pedang hingga kota itu dipenuhi mayat, dan mereka pergi dengan rampasan yang tak terhitung jumlahnya. {cite:shadharat-dhahab p. 162}."
