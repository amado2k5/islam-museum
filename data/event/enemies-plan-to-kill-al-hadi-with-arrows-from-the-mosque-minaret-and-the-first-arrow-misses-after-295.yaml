id: "event/enemies-plan-to-kill-al-hadi-with-arrows-from-the-mosque-minaret-and-the-first-arrow-misses-after-295"
class: event
kind: other
label:
  ar: "رماة يترصدون الهادي من صومعة المسجد، فيخطئه السهم الأول، بعد 295هـ، ص387"
  en: "Archers lie in wait for al-Hadi from the mosque minaret, and the first arrow misses him, after 295 AH, p. 387"
  ur: "تیرانداز مسجد کے مینار سے ہادی کی گھات میں ہیں اور پہلا تیر خطا جاتا ہے، 295ھ کے بعد، ص387"
  es: "Los arqueros esperan a al-Hadi desde el minarete de la mezquita, y la primera flecha falla, después del año 295 AH, pág. 387."
  fr: "Des archers guettent al-Hadi depuis le minaret de la mosquée, et la première flèche le manque, après 295 AH, p. 387"
  tr: "Okçular caminin minaresinden Hadi'yi bekliyorlardı, ancak ilk ok onu ıskaladı. (Hicri 295'ten sonra, s. 387)"
  id: "Para pemanah menunggu al-Hadi dari menara masjid, tetapi anak panah pertama meleset darinya. (Setelah 295 H, hlm. 387)"
summary:
  ar: "يتفق أهل الفسق والظلم على اغتيال الهادي في المسجد، فيرمونه بالنبل من صومعة المسجد، فيخطئه السهم الأول، ثم يصلي بالناس ويعلن أنه سيتحرز منهم حتى يحكم الله."
  en: "The people of wickedness and injustice plan to kill al-Hadi in the mosque and shoot at him from the minaret. The first arrow misses. He prays with the people and then says he will keep away from them until God judges between them."
  ur: "فسق اور ظلم کرنے والے مسجد میں ہادی کو قتل کرنے کا منصوبہ بناتے ہیں اور مینار سے اس پر تیر چلاتے ہیں۔ پہلا تیر خطا جاتا ہے۔ وہ لوگوں کو نماز پڑھاتا ہے اور کہتا ہے کہ وہ اللہ کے فیصلے تک ان سے بچ کر رہے گا۔"
  es: "La gente malvada e injusta planea asesinar a al-Hadi en la mezquita y dispararle desde el minarete. La primera flecha falla. Él reza con la gente y luego dice que se mantendrá alejado de ellos hasta que Dios juzgue entre ellos."
  fr: "Les méchants et les injustes projettent d'assassiner al-Hadi dans la mosquée et de lui tirer dessus du haut du minaret. La première flèche manque sa cible. Il prie avec les fidèles, puis déclare qu'il s'éloignera d'eux jusqu'à ce que Dieu tranche entre eux."
  tr: "Ahlaksızlık ve adaletsizlik ehli, Al-Hadi'yi camide öldürmeye karar verir. Caminin minaresinden ona ok atarlar, ancak ilk ok onu ıskalar. Bunun üzerine Al-Hadi, cemaate namaz kıldırır ve Allah hüküm verene kadar onlardan sakınacağını ilan eder."
  id: "Orang-orang yang berbuat durhaka dan tidak bermoral itu sepakat untuk membunuh Al-Hadi di masjid. Mereka menembakkan panah ke arahnya dari menara masjid, tetapi panah pertama meleset. Kemudian dia memimpin orang-orang dalam salat dan mengumumkan bahwa dia akan mewaspadai mereka sampai Allah menghakimi."
