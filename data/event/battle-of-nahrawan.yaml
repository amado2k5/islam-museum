id: event/battle-of-nahrawan
class: event
kind: battle
label: { ar: "وقعة النهروان", en: "Battle of Nahrawan" }
summary:
  ar: "قتال علي بن أبي طالب الخوارج الذين خرجوا عليه بعد التحكيم، وقد ذكر الطبري «خبر يوم النهر» في فهرس الجزء الخامس ضمن أخبار سنة سبع وثلاثين إلى ثمان وثلاثين {cite:tabari-tarikh-abu-al-fadl j.5 p.627}. وفيها أن الخوارج أصيبوا بالنهر {cite:tabari-tarikh-abu-al-fadl j.5 p.73}. وعند السيوطي خرجت الخوارج بعد التحكيم وقالوا لا حكم إلا لله وعسكروا بحروراء، فبعث علي إليهم ابن عباس فخاصمهم وحجهم فرجع منهم قوم كثير، وثبت قوم فساروا إلى النهروان فعرضوا للسبيل فسار إليهم علي فقتلهم وقتل منهم ذو الثديّة وذلك سنة ثمان وثلاثين {cite:tarikh-khulafa-minhaj-1434 p. 294}. وعند المسعودي اجتمعت الخوارج في أربعة آلاف بايعوا عبد الله بن وهب الراسبي بالمدائن وذبحوا عبد الله بن خباب وبقروا بطن امرأته، وسار إليهم علي في خمسة وثلاثين ألفاً ومعه عشرة آلاف بصري فيهم الأحنف سنة ثمان وثلاثين، وأخبره رجل من يهود السواد أنهم قطعوا نهر طبرستان فحلف أنهم لم يعبروه وأن مصارعهم بالرميلة دونه، وقال لا يفلت منهم إلا عشرة ولا يقتل منكم إلا عشرة فكان كذلك {cite:muruj-al-dhahab p. 695-696}"
  en: "Ali ibn Abi Talib's fighting against the Kharijites, who rebelled against him after the arbitration. Al-Tabari's index to volume five places “the account of the day of the river” among the events of the years 37 to 38 AH {cite:tabari-tarikh-abu-al-fadl j.5 p.627}, and there it is stated that the Kharijites were struck at the river {cite:tabari-tarikh-abu-al-fadl j.5 p.73}. In al-Suyuti's account, the Kharijites came out after the arbitration, saying 'judgement belongs to God alone', and encamped at Harura. Ali sent Ibn Abbas to them; he debated with them and persuaded many of them to return, while others held firm and marched to Nahrawan, where they blocked the road. Ali marched against them and killed them, including Dhu al-Thudayya; this was in 38 AH {cite:tarikh-khulafa-minhaj-1434 p. 294}. In al-Mas'udi's account, the Kharijites gathered four thousand men and pledged allegiance to Abd Allah ibn Wahb al-Rasibi at al-Mada'in; they slaughtered Abd Allah ibn Khabbab and ripped open the belly of his wife. Ali marched against them in 38 AH with thirty-five thousand men, including ten thousand from Basra, among them al-Ahnaf. A man from the Jews of al-Sawad told him that they had crossed the river of Tabaristan; Ali swore that they had not crossed it and that their dead lay at al-Rumayla, short of it, and said, 'Not one of them will escape except ten, and not one of you will be killed except ten'; so it was {cite:muruj-al-dhahab p. 695-696}."
