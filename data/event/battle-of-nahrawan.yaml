label: { ar: "وقعة النهروان", en: "Battle of Nahrawan", fr: "La bataille de Nahrawan", es: "Batalla de Nahrawan", ur: "نہروان کی جنگ" }
summary:
  ar: 'دائرة المعارف الإسلامية تؤرخ المعركة في 9 صفر 38هـ/17 يوليو 658م عند جسر النهروان شرق دجلة، بعد أن اجتمع الخارجون على علي في حروراء واختاروا عبد الله بن وهب الراسبي أميراً وعسكروا على قناة النهروان. وتذكر أن ابن وهب وأكثر أتباعه قُتلوا، وأن علياً عفا عن نحو أربعمئة جريح، وأن الحادثة أضعفت موقفه بينما استمرت الثورات المحلية. قتال علي بن أبي طالب الخوارج الذين خرجوا عليه بعد التحكيم، وقد ذكر الطبري «خبر يوم النهر» في فهرس الجزء الخامس ضمن أخبار سنة سبع وثلاثين إلى ثمان وثلاثين {cite:tabari-tarikh-abu-al-fadl j.5 p.627}. وفيها أن الخوارج أصيبوا بالنهر {cite:tabari-tarikh-abu-al-fadl j.5 p.73}. وعند السيوطي خرجت الخوارج بعد التحكيم وقالوا لا حكم إلا لله وعسكروا بحروراء، فبعث علي إليهم ابن عباس فخاصمهم وحجهم فرجع منهم قوم كثير، وثبت قوم فساروا إلى النهروان فعرضوا للسبيل فسار إليهم علي فقتلهم وقتل منهم ذو الثديّة وذلك سنة ثمان وثلاثين {cite:tarikh-khulafa-minhaj-1434 p. 294}. وعند المسعودي اجتمعت الخوارج في أربعة آلاف بايعوا عبد الله بن وهب الراسبي بالمدائن وذبحوا عبد الله بن خباب وبقروا بطن امرأته، وسار إليهم علي في خمسة وثلاثين ألفاً ومعه عشرة آلاف بصري فيهم الأحنف سنة ثمان وثلاثين، وأخبره رجل من يهود السواد أنهم قطعوا نهر طبرستان فحلف أنهم لم يعبروه وأن مصارعهم بالرميلة دونه، وقال لا يفلت منهم إلا عشرة ولا يقتل منكم إلا عشرة فكان كذلك {cite:muruj-al-dhahab p. 695-696}. ويورد الصلابي عن شاهد عيان كان من الخوارج ثم فارقهم أن منكراتهم استهوت بهم بعد التحكيم: قتل عبد الله بن خباب وذبحه كالشاة وبقر بطن امرأة حبلى، حتى استنكر بعضهم قائلين ويلكم ما على هذا فارقنا علياً؛ فسار علي في محرم سنة ثمان وثلاثين ولم يبادرهم بالقتال بل أرسل إليهم أن يسلموا القتلة، فلما أبوا عناداً وكبراً أمر أصحابه ألا يبدؤوا حتى يجتازوا النهر، ورفع أبا أيوب الأنصاري راية أمان فلحق بها نحو أربعة آلاف منصرفين فلم يبق إلا نحو ألف أو أقل مع عبد الله بن وهب الراسبي، ورتب على الميمنة حجر بن علي وعلى الميسرة شبث بن ربيعة ومعقل بن قيسي والرياحي وعلى الخيل أبا أيوب وعلى الرجالة أبا قتادة {cite:sallabi-ali-tawzi-2004 p. 637-640}'
  en: The Encyclopaedia of Islam dates the battle to 9 Safar 38/17 July 658 at Jisr al-Nahrawan, east of the Tigris, after the dissidents had gathered at Harura, chosen Abd Allah ibn Wahb al-Rasibi as commander and camped along the Nahrawan canal. It says Ibn Wahb and most of his followers were killed, that Ali pardoned about 400 wounded men, and that the episode weakened his position while local risings continued. Ali ibn Abi Talib's fighting against the Kharijites, who rebelled against him after the arbitration. Al-Tabari's index to volume five places “the account of the day of the river” among the events of the years 37 to 38 AH {cite:tabari-tarikh-abu-al-fadl j.5 p.627}, and there it is stated that the Kharijites were struck at the river {cite:tabari-tarikh-abu-al-fadl j.5 p.73}. In al-Suyuti's account, the Kharijites came out after the arbitration, saying 'judgement belongs to God alone', and encamped at Harura. Ali sent Ibn Abbas to them; he debated with them and persuaded many of them to return, while others held firm and marched to Nahrawan, where they blocked the road. Ali marched against them and killed them, including Dhu al-Thudayya; this was in 38 AH {cite:tarikh-khulafa-minhaj-1434 p. 294}. In al-Mas'udi's account, the Kharijites gathered four thousand men and pledged allegiance to Abd Allah ibn Wahb al-Rasibi at al-Mada'in; they slaughtered Abd Allah ibn Khabbab and ripped open the belly of his wife. Ali marched against them in 38 AH with thirty-five thousand men, including ten thousand from Basra, among them al-Ahnaf. A man from the Jews of al-Sawad told him that they had crossed the river of Tabaristan; Ali swore that they had not crossed it and that their dead lay at al-Rumayla, short of it, and said, 'Not one of them will escape except ten, and not one of you will be killed except ten'; so it was {cite:muruj-al-dhahab p. 695-696}. al-Sallabi cites an eyewitness who had been among the Kharijites and then left them that their enormities after the arbitration — slaughtering Abd Allah ibn Khabbab like a sheep and cutting open the belly of a pregnant woman — so appalled some of their own that they said 'woe to you, if this is it we left Ali for nothing'; Ali marched in Muharram 38 AH, first sending to demand the handing over of the killers, and when they defied him ordered his army not to attack until they had crossed the river; Abu Ayyub al-Ansari raised a banner of safe-conduct under which some four thousand withdrew, leaving about a thousand or fewer with Abd Allah ibn Wahb al-Rasibi, while Ali set Hujr ibn Ali on the right, Shabath ibn Rabi' and Ma'qil ibn Qays on the left, Abu Ayyub over the cavalry and Abu Qatada over the foot soldiers {cite:sallabi-ali-tawzi-2004 p. 637-640}.
  ur: 'انسائیکلوپیڈیا آف اسلام اس معرکے کو 9 صفر 38ھ/17 جولائی 658ء کا بتاتی ہے، دجلہ کے مشرق میں جسر النہروان پر، جب منحرفین حروراء میں جمع ہو کر عبد اللہ بن وہب راسبی کو امیر چن چکے تھے اور نہروان کی نہر کے ساتھ پڑاؤ ڈالے ہوئے تھے۔ وہ کہتی ہے کہ ابن وہب اور اس کے اکثر پیروکار مارے گئے، علی نے تقریباً چار سو زخمیوں کو معاف کیا، اور اس واقعے سے ان کی پوزیشن کمزور ہوئی جبکہ مقامی شورشیں جاری رہیں۔ '
  fr: "L'Encyclopédie de l'Islam date la bataille du 9 Safar 38/17 juillet 658 à Jisr al-Nahrawan, à l'est du Tigre, après que les dissidents se furent rassemblés à Harura, eurent choisi Abd Allah ibn Wahb al-Rasibi pour chef et campé le long du canal de Nahrawan. Elle dit qu'Ibn Wahb et la plupart de ses partisans furent tués, qu'Ali gracia environ 400 blessés, et que l'épisode affaiblit sa position tandis que des soulèvements locaux se poursuivaient. Le combat d'Ali ibn Abi Talib contre les kharijites, qui se révoltèrent contre lui après l'arbitrage. L'index d'al-Tabari pour le cinquième volume place « le récit de la journée du fleuve » parmi les événements des années 37 à 38 H {cite:tabari-tarikh-abu-al-fadl j.5 p.627}, et il y est dit que les kharijites furent frappés au fleuve {cite:tabari-tarikh-abu-al-fadl j.5 p.73}. Dans le récit d'al-Suyuti, les kharijites sortirent après l'arbitrage en disant « le jugement n'appartient qu'à Dieu », et campèrent à Harura. Ali leur envoya Ibn Abbas ; il débattit avec eux et en persuada beaucoup de revenir, tandis que d'autres tinrent bon et marchèrent sur Nahrawan, où ils coupèrent la route. Ali marcha contre eux et les tua, dont Dhu al-Thudayya ; c'était en 38 H {cite:tarikh-khulafa-minhaj-1434 p. 294}. Dans le récit d'al-Mas'udi, les kharijites rassemblèrent quatre mille hommes et prêtèrent allégeance à Abd Allah ibn Wahb al-Rasibi à al-Mada'in ; ils égorgèrent Abd Allah ibn Khabbab et éventrèrent sa femme. Ali marcha contre eux en 38 H avec trente-cinq mille hommes, dont dix mille de Bassora, parmi lesquels al-Ahnaf. Un homme des Juifs du Sawad lui dit qu'ils avaient traversé le fleuve du Tabaristan ; Ali jura qu'ils ne l'avaient pas traversé et que leurs morts gisaient à al-Rumayla, en deçà, et dit : « Pas un d'entre eux n'échappera, sauf dix, et pas un d'entre vous ne sera tué, sauf dix » ; et il en fut ainsi {cite:muruj-al-dhahab p. 695-696}. Al-Sallabi cite un témoin oculaire qui avait été parmi les kharijites puis les avait quittés : leurs atrocités après l'arbitrage, égorger Abd Allah ibn Khabbab comme un mouton et éventrer une femme enceinte, horrifièrent tant certains des leurs qu'ils dirent « malheur à vous, si c'est cela, nous avons quitté Ali pour rien » ; Ali se mit en marche en Muharram 38 H, envoyant d'abord demander qu'on lui livre les meurtriers, et, comme ils le défiaient, ordonna à son armée de ne pas attaquer avant qu'ils aient traversé le fleuve ; Abu Ayyub al-Ansari leva une bannière de sauf-conduit sous laquelle quelque quatre mille se retirèrent, n'en laissant qu'environ mille ou moins avec Abd Allah ibn Wahb al-Rasibi, tandis qu'Ali plaçait Hujr ibn Ali à droite, Shabath ibn Rabi' et Ma'qil ibn Qays à gauche, Abu Ayyub sur la cavalerie et Abu Qatada sur les fantassins {cite:sallabi-ali-tawzi-2004 p. 637-640}."
  es: "La Enciclopedia del Islam fecha la batalla el 9 de Safar del año 38/17 de julio de 658 en Jisr al-Nahrawan, al este del Tigris, después de que los disidentes se hubieran reunido en Harura, eligieran a Abd Allah ibn Wahb al-Rasibi como comandante y acamparan a lo largo del canal de Nahrawan. Dice que Ibn Wahb y la mayoría de sus seguidores murieron, que Ali perdonó a unos 400 hombres heridos y que el episodio debilitó su posición mientras continuaban los levantamientos locales. Ali ibn Abi Talib luchó contra los jariyíes, que se rebelaron contra él después del arbitraje. El índice del volumen cinco de Al-Tabari incluye «el relato del día del río» entre los acontecimientos de los años 37 a 38 AH {cite:tabari-tarikh-abu-al-fadl j.5 p.627}, y allí se afirma que los jariyíes fueron atacados en el río {cite:tabari-tarikh-abu-al-fadl j.5 p.73}. En el relato de al-Suyuti, los jariyíes salieron después del arbitraje, diciendo «el juicio pertenece solo a Dios», y acamparon en Harura. Ali envió a Ibn Abbas a su encuentro; este debatió con ellos y persuadió a muchos de ellos para que regresaran, mientras que otros se mantuvieron firmes y marcharon a Nahrawan, donde bloquearon el camino. Ali marchó contra ellos y los mató, incluyendo a Dhu al-Thudayya; esto ocurrió en el año 38 AH {cite:tarikh-khulafa-minhaj-1434 p. 294}. En el relato de al-Mas'udi, los jariyitas reunieron a cuatro mil hombres y juraron lealtad a Abd Allah ibn Wahb al-Rasibi en al-Mada'in; masacraron a Abd Allah ibn Khabbab y abrieron el vientre de su esposa. Ali marchó contra ellos en el año 38 de la Hégira con treinta y cinco mil hombres, incluyendo diez mil de Basora, entre ellos al-Ahnaf. Un hombre de los judíos de al-Sawad le dijo que habían cruzado el río Tabaristán; Ali juró que no lo habían cruzado y que sus muertos yacían en al-Rumayla, antes de llegar a él, y dijo: «No escapará ninguno de ellos excepto diez, y no morirá ninguno de vosotros excepto diez»; así fue {cite:muruj-al-dhahab p. 695-696}. Al-Sallabi cita a un testigo presencial que había estado entre los jariyitas y luego los abandonó, quien afirmó que sus atrocidades después del arbitraje —matar a Abd Allah ibn Khabbab como a una oveja y abrir el vientre de una mujer embarazada— horrorizaron tanto a algunos de los suyos que dijeron: \"¡Ay de vosotros, si esto es todo, hemos dejado a Ali para nada!\". Ali marchó en Muharram del año 38 de la Hégira, primero enviando a exigir la entrega de los asesinos, y cuando estos lo desafiaron, ordenó a su ejército que no atacara hasta que hubieran cruzado el río. Abu Ayyub al-Ansari izó un estandarte de salvoconducto bajo el cual se retiraron unos cuatro mil, dejando a unos mil o menos con Abd Allah ibn Wahb al-Rasibi, mientras que Ali colocó a Hujr ibn Ali a la derecha, a Shabath ibn Rabi' y Ma'qil ibn Qays a la izquierda, a Abu Ayyub sobre la caballería y a Abu Qatada sobre los soldados de infantería {cite:sallabi-ali-tawzi-2004 p. 637-640}."
