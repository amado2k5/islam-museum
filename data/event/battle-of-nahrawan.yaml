perspectives:
  - tradition: sunni
    id: sunni-sallabi
    summary:
      ar: "يرى الصلابي، من منظور أهل السنة، أن الخوارج كفّروا الصحابة وعلياً واستباحوا الدماء، وأن قتالهم كان بنص الحديث، وأن علياً عامل الأسرى والجرحى بالحق، وأن أقوالهم في الإمامة والحكم خلاف ما عليه الجمهور {cite:sallabi-ali-vol2 p. 181} {cite:sallabi-ali-vol2 p. 198}."
      en: "al-Sallabi, from a Sunni standpoint, holds that the Kharijites declared the Companions and Ali disbelievers and made killing Muslims lawful; that fighting them was foretold; and that Ali treated prisoners and wounded justly."
    sources: [source/sallabi-ali-vol2]
  - tradition: academic
    id: academic
    summary:
      ar: "الرأي الأكاديمي عن الخوارج لم يُعرض بعد من هذا المجلد؛ يُضاف عند توفر مصدر أكاديمي."
      en: "The academic view of the Kharijites is not yet set out from this volume; to be added from an academic source."
    sources: []
