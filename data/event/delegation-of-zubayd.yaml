label: { ar: "قدوم عمرو بن معدي كرب في أناس من بني زبيد", en: "Amr ibn Ma'dikarib comes with men of Banu Zubayd" }
summary:
  ar: "قدم عمرو بن معدي كرب على النبي في أناس من بني زبيد فأسلم وصدّقه وآمن به؛ وكان قد دعا قيس بن مكشوح المرادي سيد قومه أن يذهبا معاً ليعلما علم الرجل القرشي الذي يقول إنه نبي، فأبى قيس وسفّه رأيه، فركب عمرو وحده؛ ثم أوعده قيس فهجاه عمرو. وأقام عمرو في قومه وعليهم فروة بن مسيك، فلما توفي النبي ارتد."
  en: "Amr ibn Ma'dikarib came to the Prophet with men of Banu Zubayd and embraced Islam, believing in him. He had earlier urged Qays ibn Makshuh al-Muradi, chief of his people, to go together and find out about the Qurashi who claimed prophethood; Qays refused and belittled the idea, so Amr rode alone. Qays then threatened him and Amr lampooned him. Amr stayed among his people under Farwa ibn Musayk, and when the Prophet died he apostatised."
