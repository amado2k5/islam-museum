id: event/al-hadi-counsels-banu-hasan-to-rise-and-names-hamdan-khawlan-and-hashid-in-verse-292
class: event
kind: other
label:
  ar: "أبيات للهادي يحث بها بني حسن وبني علي على النهوض، ويذكر مسيره في همدان وخولان وحاشد والأحلاف وأنه يثني عليهم، ص318-319"
  en: "Verses of al-Hadi urging Banu Hasan and Banu Ali to rise, naming his march among Hamdan, Khawlan, Hashid and al-Ahlaf, and closing in praise of them, pp. 318-319"
  ur: "ہادی کے اشعار جن میں وہ بنو حسن اور بنو علی کو اٹھنے کی ترغیب دیتا ہے، ہمدان، خولان، حاشد اور الاحلاف میں اپنے سفر کا ذکر کرتا ہے اور ان کی مدح پر ختم کرتا ہے، ص318-319"
summary:
  ar: "يختم الهادي القصيدة ⁦(ص318-319)⁩ فيقول إنه يرضى برضاهم ويقيهم كل مكروه ويبذل نفسه دونهم، ويدعو بني حسن وبني علي إلى ألا يبدوا ضعفاً وأن يجمعوا أمرهم، ويستشهد ببيت لأبي تمام «السيف أصدق أنباء من الكتب»، ثم يقول إنه نصب نفسه لأمر الله وسار في همدان وخولان وحاشد والأحلاف، ويثني على بني حسن ويدعو لهم، وفي أحد الأبيات فراغ في الأصل ونسخة ص."
  en: "Al-Hadi closes the poem (pp. 318-319), saying he is pleased as they are pleased, guards them from every harm and gives his life before them, and calls Banu Hasan and Banu Ali not to show weakness but to gather their purpose, citing a line of Abu Tammam that the sword is truer in tidings than books; then he says he set himself for God's command and went among Hamdan, Khawlan, Hashid and al-Ahlaf, and he praises Banu Hasan and prays for them; one line has a blank in the original and in manuscript S."
  ur: "ہادی نظم ختم کرتا ہے ⁦(ص318-319)⁩ اور کہتا ہے کہ وہ ان کی رضا سے راضی ہے، انہیں ہر ناگوار سے بچاتا ہے اور ان کے آگے اپنی جان دیتا ہے، بنو حسن اور بنو علی کو پکارتا ہے کہ کمزوری نہ دکھائیں اور اپنا ارادہ یکجا کریں، ابو تمام کا مصرع «تلوار کتابوں سے زیادہ سچی خبر دینے والی ہے» پیش کرتا ہے؛ پھر کہتا ہے کہ اس نے اپنے آپ کو اللہ کے حکم کے لیے کھڑا کیا اور ہمدان، خولان، حاشد اور الاحلاف میں چلا، اور بنو حسن کی مدح کرتا اور ان کے لیے دعا کرتا ہے؛ ایک شعر میں اصل اور نسخہ ص میں خالی جگہ ہے۔"
