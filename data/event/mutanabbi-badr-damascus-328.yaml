label:
  ar: "المتنبي مدّاح بدر الخرشاني بدمشق، ٣٢٨هـ/٩٣٩م"
  en: "Court poet to Badr al-Kharshani at Damascus, 328/939"
  ur: "دمشق میں بدر خرشانی کا مداح، 328ھ/939ء"
summary:
  ar: "في مطلع سنة ٣٢٨هـ/٩٣٩م صار المتنبي شاعر بلاط الأمير بدر الخرشاني، وهو بدر بن عمّار عامل دمشق لابن رائق الذي كان قد استولى على الشام؛ ورآه المتنبي الميسين الذي طال انتظاره فجاءت قصائده فيه صادقة الإعجاب، لكن المودة لم تعمر أكثر من سنة ونصف إذ دسّس عليه الحساد حتى خاف على نفسه فلاذ ببادية الشام، ولم يفكه منها إلا رحيل بدر إلى العراق {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  en: "At the beginning of 328/939 al-Mutanabbi became court poet to the amir Badr al-Kharshani — the Badr ibn Ammar of the Diwan — governor of Damascus for Ibn Ra'iq, who had just taken possession of Syria. Of Arab stock, Badr seemed to the poet the long-awaited Maecenas, and the panegyrics addressed to him carry sincere admiration; but intrigues of jealous rivals ended the friendship in about a year and a half, and al-Mutanabbi, no longer feeling safe, hid in the Syrian desert until Badr's departure for Iraq freed him {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  ur: "328ھ/939ء کے آغاز میں متنبی امیر بدر خرشانی — دیوان کا بدر بن عمار — کے درباری شاعر بنے؛ وہ ابن رائق کی طرف سے دمشق کا عامل تھا۔ عرب نژاد بدر کو شاعر نے اپنا برسوں کا منتظر سرپرست سمجھا اور اس کے مدح میں مخلصانہ قصیدے کہے؛ مگر حسد کرنے والوں کی سازشوں نے ڈیڑھ برس میں یہ دوستی ختم کر دی اور متنبی اپنی جان کے خطرے سے شام کی بادیہ میں چھپ گئے، جب تک بدر کا عراق رخصت ہونا انھیں رہا نہ کیا {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}۔"
