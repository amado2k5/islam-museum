label: { ar: "كتبة الأوس والخزرج وأهل الكمال", en: "The Scribes of Aws and Khazraj and the Complete", es: "Los escribas de Aws y Khazraj y la obra completa", fr: "Les scribes d'Aws et de Khazraj et l'intégrale", ur: "اوس و خزرج کے صحیفے اور مکمل", tr: "Aws ve Khazraj'ın katipleri ve mükemmellik ehli", id: "Para juru tulis Aws dan Khazraj serta orang-orang yang sempurna." }
summary:
  ar: "قال الواقدي كان الكتاب بالعربية في الأوس والخزرج قليلاً وكان بعض اليهود قد علم كتاب العربية وكان تعلمه الصبيان في المدينة في الزمن الأول فجاء الإسلام وفي الأوس والخزرج عدة يكتبون وهم سعد بن عبادة بن دليم والمنذر بن عمرو وأبي بن كعب وزيد بن ثابت فكان يكتب العربية والعبرانية ورافع بن مالك وأسيد بن حضير ومعن بن عدي البلوي حليف الأنصار وبشير بن سعد وسعد بن الربيع وأوس بن خولي وعبد الله بن أبي وكان الكامل منهم والكامل من يجمع إلى الكتاب الرمي والعوم رافع بن مالك وسعد بن عبادة وأسيد بن حضير وعبد الله بن أبي وأوس بن خولي وكان من جمع هذه الأشياء في الجاهلية من أهل يثرب سويد بن الصامت وخدير الكتائب وقال زيد بن ثابت أمرني رسول الله أن أتعلم له كتاب يهود وقال لي إني لا آمن يهوداً على كتابي فلم ير بي نصف شهر حتى تعلمته فكنت أكتب له إلى يهود وإذا كتبوا إليه قرأت كتابهم."
  en: "Al-Waqidi: writing in Arabic was rare among Aws and Khazraj; some Jews had taught Arabic writing, and the boys learned it in early Medina. When Islam came, those who wrote were Sa'd ibn 'Ubada ibn Dulaym, al-Mundhir ibn 'Amr, Ubayy ibn Ka'b, Zayd ibn Thabit — who wrote Arabic and Hebrew — Rafi' ibn Malik, Usayd ibn Hudayr, Ma'n ibn 'Adi al-Balawi the Ansars' ally, Bashir ibn Sa'd, Sa'd ibn al-Rabi', Aws ibn Khawli and Abdallah ibn Ubayy. The kamil — who joined writing, archery and swimming — were Rafi' ibn Malik, Sa'd ibn 'Ubada, Usayd ibn Hudayr, Abdallah ibn Ubayy and Aws ibn Khawli; and of Jahiliya Yathrib, Suwayd ibn al-Samit and Hudayr al-Kata'ib. Zayd ibn Thabit: 'the Prophet ordered me to learn the Jews' script — I do not trust the Jews with my correspondence — and before half a month passed I had learned it: I wrote his letters to the Jews, and when they wrote to him I read their letters'."
  es: "Al-Waqidi: la escritura en árabe era poco común entre los Aws y los Khazraj; algunos judíos habían enseñado escritura árabe, y los muchachos la aprendieron en la Medina temprana. Cuando llegó el Islam, quienes escribieron fueron Sa'd ibn 'Ubada ibn Dulaym, al-Mundhir ibn 'Amr, Ubayy ibn Ka'b, Zayd ibn Thabit —quien escribió en árabe y hebreo—, Rafi' ibn Malik, Usayd ibn Hudayr, Ma'n ibn 'Adi al-Balawi, aliado de los Ansars, Bashir ibn Sa'd, Sa'd ibn al-Rabi', Aws ibn Khawli y Abdallah ibn Ubayy. Los kamil —que combinaban la escritura, el tiro con arco y la natación— fueron Rafi' ibn Malik, Sa'd ibn 'Ubada, Usayd ibn Hudayr, Abdallah ibn Ubayy y Aws ibn Khawli; y de la época preislámica Yathrib, Suwayd ibn al-Samit y Hudayr al-Kata'ib. Zayd ibn Thabit dijo: «El Profeta me ordenó aprender la escritura judía —no confío en los judíos para mi correspondencia— y antes de que pasara medio mes la había aprendido: escribía sus cartas a los judíos, y cuando ellos le escribían a él, yo leía las suyas»."
  fr: "Al-Waqidi: l’écriture arabe était rare chez les Aws et les Khazraj; certains Juifs enseignaient l’écriture arabe, et les garçons l’apprenaient dans la Médine primitive. À l’avènement de l’islam, ceux qui écrivaient étaient Sa’d ibn 'Ubada ibn Dulaym, al-Mundhir ibn 'Amr, Ubayy ibn Ka’b, Zayd ibn Thabit — qui écrivait en arabe et en hébreu —, Rafi’ ibn Malik, Usayd ibn Hudayr, Ma’n ibn 'Adi al-Balawi, allié des Ansars, Bashir ibn Sa’d, Sa’d ibn al-Rabi’, Aws ibn Khawli et Abdallah ibn Ubayy. Les kamils — qui pratiquaient l'écriture, le tir à l'arc et la natation — étaient Rafi' ibn Malik, Sa'd ibn 'Ubada, Usayd ibn Hudayr, Abdallah ibn Ubayy et Aws ibn Khawli; et de la Jahiliya Yathrib, Suwayd ibn al-Samit et Hudayr al-Kata'ib. Zayd ibn Thabit: « Le Prophète m'a ordonné d'apprendre l'écriture juive — je ne confie pas ma correspondance aux Juifs — et en moins de quinze jours, je la maîtrisais: j'écrivais ses lettres aux Juifs, et lorsqu'ils lui écrivaient, je lisais leurs lettres. »"
  ur: "الواقدی: اوس اور خزرج میں عربی میں لکھنا نایاب تھا۔ کچھ یہودیوں نے عربی لکھنا سکھایا تھا اور لڑکوں نے اسے ابتدائی مدینہ میں سیکھا۔ جب اسلام آیا تو لکھنے والوں میں سعد بن عبادہ بن دلیم، المنذر بن عمرو، ابی بن کعب، زید بن ثابت - جو عربی اور عبرانی لکھتے تھے - رافع بن مالک، اسید ابن حضیر، معن بن عدی الصغیر، ابن عدی الصغیر، ابن عدی البصیر البلاد۔ سعد بن ربیع، اوس بن خولی اور عبداللہ بن ابی۔ کامل - جنہوں نے لکھنے، تیر اندازی اور تیراکی میں شمولیت اختیار کی - رافع ابن مالک، سعد ابن عبادہ، اسید ابن حضیر، عبداللہ ابن ابی اور اوس بن خولی؛ اور جاہلیہ یثرب کے، سوید بن الصامت اور حدیر الکاتیب۔ زید بن ثابت کہتے ہیں کہ رسول اللہ نے مجھے یہودیوں کا رسم الخط سیکھنے کا حکم دیا، میں یہودیوں پر اپنی خط و کتابت پر بھروسہ نہیں کرتا، اور آدھا مہینہ گزرنے سے پہلے میں نے اسے جان لیا تھا: میں نے ان کے خطوط یہودیوں کو لکھے اور جب وہ انہیں لکھتے تو میں ان کے خطوط پڑھتا تھا۔"
  tr: "El-Vakidi şöyle dedi: Evs ve Hazrec arasında Arapça yazı azdı ve Yahudilerden bazıları Arapça yazmayı biliyordu. Medine'deki erkek çocuklar ilk zamanlarda bunu öğrenirlerdi. Sonra İslam geldi ve Evs ve Hazrec arasında yazı yazabilen birkaç kişi vardı; bunlar arasında Sa'd ibn Ubadah ibn Dulaym, El-Mundhir ibn Amr, Ubayy ibn Ka'b, Arapça ve İbranice yazan Zayd ibn Sabit, Rafi' ibn Malik, Usayd ibn Hudayr, Ensar'ın müttefiki Ma'n ibn Adi el-Balawi, Beşir ibn Sa'd, Sa'd ibn el-Rabi', Evs ibn Huvli ve Abdullah ibn Ubay vardı. Bunların arasında en yeteneklisi ve yazıyı okçuluk ve yüzmeyle birleştiren en yetenekli kişi Rafi' ibn Malik, Sa'd ibn Ubadah, Usayd ibn Hudayr, Abdullah ibn Ubay ve Evs ibn Huvli idi. İslam öncesi dönemde Yathrib halkından bu şeyleri birleştirenler arasında Suwayd ibn al-Samit ve Khadir al-Kata’ib vardı. Zayd ibn Thabit şöyle dedi: Allah Resulü bana Yahudilerin yazısını öğrenmemi emretti ve bana şöyle dedi: Yazımı Yahudilere emanet etmiyorum. Bunu öğrenmem yarım ayımı bile almadı, bu yüzden onun için Yahudilere yazıyordum ve onlar ona yazdıklarında, onların yazısını okuyordum."
  id: "Al-Waqidi berkata: Tulisan dalam bahasa Arab sangat langka di kalangan Aws dan Khazraj, dan beberapa orang Yahudi mengetahui cara menulis bahasa Arab. Anak-anak laki-laki di Madinah biasa mempelajarinya pada masa awal. Kemudian Islam datang, dan di antara Aws dan Khazraj ada beberapa yang bisa menulis, yaitu Sa’d ibn Ubadah ibn Dulaym, Al-Mundhir ibn Amr, Ubayy ibn Ka’b, Zayd ibn Thabit, yang biasa menulis bahasa Arab dan Ibrani, Rafi’ ibn Malik, Usayd ibn Hudayr, Ma’n ibn Adi al-Balawi, sekutu Ansar, Bashir ibn Sa’d, Sa’d ibn al-Rabi’, Aws ibn Khawli, dan Abdullah ibn Ubay. Yang paling mahir di antara mereka, dan yang paling mahir adalah dia yang menggabungkan menulis dengan memanah dan berenang, adalah Rafi’ ibn Malik, Sa’d ibn Ubadah, Usayd ibn Hudayr, Abdullah ibn Ubay, dan Aws ibn Khawli. Di antara mereka yang menggabungkan hal-hal ini di era pra-Islam dari kaum Yathrib adalah Suwayd ibn al-Samit dan Khadir al-Kata’ib. Zayd ibn Thabit berkata: Rasulullah memerintahkan saya untuk mempelajari tulisan orang Yahudi untuk beliau, dan beliau berkata kepada saya: Saya tidak mempercayakan tulisan saya kepada orang Yahudi. Tidak sampai setengah bulan saya mempelajarinya, jadi saya biasa menulis untuk beliau kepada orang Yahudi, dan ketika mereka menulis kepada beliau, saya akan membaca tulisan mereka."
