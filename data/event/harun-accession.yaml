label: { ar: "بيعة هارون الرشيد", en: "The Accession of Harun al-Rashid", es: "La ascensión de Harun al-Rashid", fr: "L'accession au trône de Haroun al-Rashid", ur: "ہارون الرشید کا الحاق", tr: "Harun el-Raşid'e Biat Yemini", id: "Ikrar Kesetiaan kepada Harun al-Rashid" }
summary:
  ar: "استخلف هارون الرشيد بعهد من أبيه عند موت أخيه الهادي ليلة السبت لأربع عشرة بقيت من ربيع الأول سنة سبعين ومئة، وفي هذه الليلة ولد له عبد الله المأمون، قال الصولي ولم يكن في سائر الزمان ليلة مات فيها خليفة وقام خليفة وولد خليفة إلا هذه الليلة {cite:tarikh-khulafa-minhaj-1434 p. 456}."
  en: "Harun al-Rashid acceded by his father's designation on his brother al-Hadi's death — Saturday night, 14 Rabi' I 170; that same night his son Abdallah al-Ma'mun was born. Per al-Suli, in all of time there was never a night in which a caliph died, a caliph rose and a caliph was born but this one {cite:tarikh-khulafa-minhaj-1434 p. 456}."
  es: "Harun al-Rashid ascendió al trono por designación paterna tras la muerte de su hermano al-Hadi, la noche del sábado 14 de Rabi' I de 170; esa misma noche nació su hijo Abdallah al-Ma'mun. Según al-Suli, en toda la historia no hubo otra noche en la que muriera un califa, ascendiera otro y naciera otro, salvo esta {cite:tarikh-khulafa-minhaj-1434 p. 456}."
  fr: "Harun al-Rashid accéda au trône par désignation paternelle à la mort de son frère al-Hadi, dans la nuit du samedi 14 Rabi' I 170; cette même nuit naquit son fils Abdallah al-Ma'mun. Selon al-Suli, jamais de mémoire d'homme il n'y eut de nuit où un calife mourut, un autre monta au pouvoir et un troisième naquit, hormis celle-ci (cite: Tarikh-Khulafa-Minhaj-1434, p. 456)."
  ur: "ہارون الرشید نے اپنے بھائی الہادی کی موت پر اپنے والد کے عہدہ سے اتفاق کیا — ہفتہ کی رات، 14 ربیع الاول 170؛ اسی رات ان کے بیٹے عبداللہ المامون کی ولادت ہوئی۔ فی السلی، ہر زمانے میں کوئی رات ایسی نہیں تھی جس میں کوئی خلیفہ فوت ہوا ہو، کوئی خلیفہ معرض وجود میں آیا ہو اور خلیفہ پیدا ہوا ہو، لیکن یہ ایک {حوالہ: تاریخ الخلفاء منہاج 1434 ص۔ 456}۔"
  tr: "Harun el-Raşid, babasının isteği üzerine, kardeşi el-Hadi'nin 170 yılında Rebiü'l-Evvel ayının bitimine on dört gün kala Cumartesi gecesi vefat etmesi üzerine tahta geçti. Bu gecede Abdullah el-Ma'mun dünyaya geldi. El-Suli şöyle demiştir: \"Tüm zamanlarda, bir halifenin öldüğü, bir halifenin iktidara çıktığı ve bir halifenin doğduğu hiçbir gece yoktur ki, bu gece hariç.\" {cite:tarikh-khulafa-minhaj-1434 s. 456}"
  id: "Harun al-Rashid naik tahta berdasarkan wasiat ayahnya ketika saudaranya, al-Hadi, meninggal pada Sabtu malam, empat belas hari sebelum akhir Rabi’ al-Awwal tahun seratus tujuh puluh. Pada malam itu, Abdullah al-Ma’mun lahir darinya. Al-Suli berkata: “Tidak ada malam sepanjang masa di mana seorang khalifah meninggal, seorang khalifah naik tahta, dan seorang khalifah lahir kecuali malam ini.” {cite:tarikh-khulafa-minhaj-1434 p. 456}"
