summary:
  ar: "استخلف هارون الرشيد بعهد من أبيه عند موت أخيه الهادي ليلة السبت لأربع عشرة بقيت من ربيع الأول سنة سبعين ومئة، وفي هذه الليلة ولد له عبد الله المأمون، قال الصولي ولم يكن في سائر الزمان ليلة مات فيها خليفة وقام خليفة وولد خليفة إلا هذه الليلة {cite:tarikh-khulafa-minhaj-1434 p. 456}."
  en: "Harun al-Rashid acceded by his father's designation on his brother al-Hadi's death — Saturday night, 14 Rabi' I 170; that same night his son Abdallah al-Ma'mun was born. Per al-Suli, in all of time there was never a night in which a caliph died, a caliph rose and a caliph was born but this one {cite:tarikh-khulafa-minhaj-1434 p. 456}."
