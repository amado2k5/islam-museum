label:
  ar: "هدنة سنتين في علاف تعزل القاسم والحسن ابني أحمد عن الأمر في ربيع الآخر سنة 327هـ، ص413"
  en: "A two-year truce at Alaf removes al-Qasim and al-Hasan, sons of Ahmad, from command in Rabi II 327 AH, p. 413"
  ur: "علاف میں دو سالہ صلح، قاسم اور حسن، احمد کے بیٹوں کو ربیع الآخر 327ھ میں امر سے ہٹا دیتی ہے، ص413"
summary:
  ar: "يصل ابن الضحاك إلى علاف يوم السبت لمنتصف ربيع الآخر سنة 327هـ، ويتفق بنو سعد وغيرهم على هدنة سنتين، على أن يعزلوا الحسن والقاسم عن الأمر، فيعود كل منهما إلى منزله."
  en: "Ibn al-Dahhak reaches Alaf on Saturday in mid Rabi II 327 AH. Banu Sa'd and others agree a two-year truce on condition that al-Hasan and al-Qasim are removed from command, and each returns to his home."
  ur: "ابن الضحاک ربیع الآخر 327ھ کے وسط میں ہفتے کے دن علاف پہنچتا ہے۔ بنو سعد اور دوسرے دو سال کی صلح پر راضی ہوتے ہیں، اس شرط پر کہ حسن اور قاسم کو امر سے ہٹا دیا جائے، اور دونوں اپنے گھروں کو لوٹ جاتے ہیں۔"
