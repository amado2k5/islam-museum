id: "event/two-year-truce-at-alaf-removes-al-qasim-and-al-hasan-from-command-in-rabi-ii-327-ah"
class: event
kind: other
label:
  ar: "هدنة سنتين في علاف تعزل القاسم والحسن ابني أحمد عن الأمر في ربيع الآخر سنة 327هـ، ص413"
  en: "A two-year truce at Alaf removes al-Qasim and al-Hasan, sons of Ahmad, from command in Rabi II 327 AH, p. 413"
  ur: "علاف میں دو سالہ صلح، قاسم اور حسن، احمد کے بیٹوں کو ربیع الآخر 327ھ میں امر سے ہٹا دیتی ہے، ص413"
  es: "Una tregua de dos años en Alaf aparta a al-Qasim y al-Hasan, hijos de Ahmad, del mando en Rabi II 327 AH, pág. 413."
  fr: "Une trêve de deux ans à Alaf destitue al-Qasim et al-Hasan, fils d'Ahmad, de leur commandement en Rabi II 327 AH, p. 413"
  tr: "Allaf'ta iki yıl süren bir ateşkes, Ahmed'in oğulları el-Kâsım ve el-Hasan'ı Hicri 327 yılının Rebiü'l-Sani ayında iktidardan uzaklaştırdı (s. 413)."
  id: "Gencatan senjata selama dua tahun di Allaf menggulingkan al-Qasim dan al-Hasan, putra-putra Ahmad, dari kekuasaan pada bulan Rabi' al-Thani tahun 327 H, hlm. 413"
summary:
  ar: "يصل ابن الضحاك إلى علاف يوم السبت لمنتصف ربيع الآخر سنة 327هـ، ويتفق بنو سعد وغيرهم على هدنة سنتين، على أن يعزلوا الحسن والقاسم عن الأمر، فيعود كل منهما إلى منزله."
  en: "Ibn al-Dahhak reaches Alaf on Saturday in mid Rabi II 327 AH. Banu Sa'd and others agree a two-year truce on condition that al-Hasan and al-Qasim are removed from command, and each returns to his home."
  ur: "ابن الضحاک ربیع الآخر 327ھ کے وسط میں ہفتے کے دن علاف پہنچتا ہے۔ بنو سعد اور دوسرے دو سال کی صلح پر راضی ہوتے ہیں، اس شرط پر کہ حسن اور قاسم کو امر سے ہٹا دیا جائے، اور دونوں اپنے گھروں کو لوٹ جاتے ہیں۔"
  es: "Ibn al-Dahhak llega a Alaf un sábado a mediados de Rabi II del año 327 AH. Banu Sa'd y otros acuerdan una tregua de dos años con la condición de que al-Hasan y al-Qasim sean destituidos del mando y cada uno regrese a su hogar."
  fr: "Ibn al-Dahhak arrive à Alaf le samedi de la mi-Rabi II 327 AH. Les Banu Sa'd et d'autres conviennent d'une trêve de deux ans à condition qu'al-Hasan et al-Qasim soient démis de leurs fonctions et que chacun retourne chez lui."
  tr: "İbn el-Dahhak, Hicri 327 yılının Rebiü'l-Sani ayının ortasında, Cumartesi günü Allaf'a varır. Beni Sa'd ve diğerleri, Hasan ve Kasım'ın bu işten uzaklaştırılması ve her birinin kendi evine dönmesi şartıyla iki yıllık bir ateşkes konusunda anlaşırlar."
  id: "Ibn al-Dahhak tiba di Allaf pada hari Sabtu, pertengahan Rabi' al-Thani, 327 H. Bani Sa'd dan yang lainnya menyepakati gencatan senjata selama dua tahun, dengan syarat mereka menyingkirkan al-Hasan dan al-Qasim dari masalah tersebut, sehingga masing-masing dari mereka kembali ke rumahnya."
