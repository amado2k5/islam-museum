id: event/stoning-of-al-ghamidiyya
class: event
kind: court-ruling
label: { en: "The stoning of the Ghamidi woman", ar: "رجم المرأة الغامدية" }
summary:
  en: "In 9 AH a woman of Ghamid came to the Prophet and confessed to fornication; he repeatedly turned her away hoping she would recant, then deferred her until she bore and weaned her child, whereupon she was stoned — an application of the prescribed penalty which the Prophet described as a repentance that would suffice seventy of Medina's people were it apportioned."
  ar: "رُجمت المرأة الغامدية سنة 9هـ بعد أن جاءت فاعترفت على نفسها بالفاحشة؛ ردّها النبي مرة بعد مرة حتى اعترفت تماماً ثم أخرّها حتى ولدت وفطمت ابنها فرُجمت، وقال في توبتها إنها توبة لو قُسمت بين سبعين من أهل المدينة لوسعتهم."
