id: event/stoning-of-al-ghamidiyya
class: event
kind: court-ruling
label: { en: "The stoning of the Ghamidi woman", ar: "رجم المرأة الغامدية", es: "La lapidación de la mujer Ghamidi", fr: "La lapidation de la femme Ghamidi", ur: "غامدی عورت کو سنگسار کرنا" }
summary:
  en: "In 9 AH a woman of Ghamid came to the Prophet and confessed to fornication; he repeatedly turned her away hoping she would recant, then deferred her until she bore and weaned her child, whereupon she was stoned — an application of the prescribed penalty which the Prophet described as a repentance that would suffice seventy of Medina's people were it apportioned."
  ar: "رُجمت المرأة الغامدية سنة 9هـ بعد أن جاءت فاعترفت على نفسها بالفاحشة؛ ردّها النبي مرة بعد مرة حتى اعترفت تماماً ثم أخرّها حتى ولدت وفطمت ابنها فرُجمت، وقال في توبتها إنها توبة لو قُسمت بين سبعين من أهل المدينة لوسعتهم."
  es: "En el año 9 de la Hégira, una mujer de Ghamid se acercó al Profeta y confesó haber cometido fornicación; él la rechazó repetidamente con la esperanza de que se retractara, y luego la aplacó hasta que dio a luz y destetó a su hijo, momento en el que fue apedreada, una aplicación del castigo prescrito que el Profeta describió como un arrepentimiento que bastaría para setenta personas de Medina si se repartiera."
  fr: "En l'an 9 de l'Hégire, une femme de Ghamid vint trouver le Prophète et lui avoua sa fornication; il la repoussa à plusieurs reprises en espérant qu'elle se rétracterait, puis attendit qu'elle accouche et sevre son enfant, après quoi elle fut lapidée — une application de la peine prescrite que le Prophète décrivit comme un repentir qui suffirait à soixante-dix des habitants de Médine s'il était réparti."
  ur: "9 ہجری میں غامد کی ایک عورت نبی کے پاس آئی اور زنا کا اقرار کیا۔ اس نے اسے بار بار اس امید پر پھیر دیا کہ وہ مکر جائے گی، پھر اسے اس وقت تک موخر کر دیا جب تک کہ اس نے اپنے بچے کو جنم نہ دے دیا اور اس کا دودھ چھڑایا، جس پر اسے سنگسار کر دیا گیا - ایک مقررہ سزا کا اطلاق جسے نبی نے توبہ کے طور پر بیان کیا جو مدینہ کے ستر لوگوں کے لیے کافی ہو گا۔"
