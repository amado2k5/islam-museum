label: { en: "Abu Talib gathers Banu Hashim and Banu al-Muttalib", ar: "أبو طالب يجمع بني هاشم وبني المطلب" }
summary:
  en: "Reading the escalating incidents — the deputations, the attempt to trade him for Amara ibn al-Walid, Abu Jahl's stone, Uqba's strangling attempt, Umar's unsheathed sword — Abu Talib sensed danger to his nephew and gathered Banu Hashim and Banu al-Muttalib to stand with him; all answered except Abu Lahab, who sided with the enemy."
  ar: "قرأ أبو طلب الحوادث المتصاعدة — الوفود إليه، ومحاولة مقايضته بعمارة بن الوليد، وحجر أبي جهل، وخنق عقبة بن أبي معيط، وسيف ابن الخطاب — فشمّ خطراً على ابن أخيه، فجمع بني هاشم وبني المطلب ليكونوا معه يداً واحدة، فأجابوه جميعاً إلا أبا لهب فإنه خالفهم إلى عدوهم."
