label: { en: "Abu Talib gathers Banu Hashim and Banu al-Muttalib", fr: "Abu Talib réunit les Banu Hashim et les Banu al-Muttalib", ar: "أبو طالب يجمع بني هاشم وبني المطلب", es: "Abu Talib reúne a Banu Hashim y Banu al-Muttalib", ur: "ابو طالب نے بنو ہاشم اور بنو المطلب کو جمع کیا۔", tr: "Ebu Talib, Banu Haşim ve Banu el-Muttalib'i birleştiriyor.", id: "Abu Thalib menyatukan Bani Hasyim dan Bani al-Muttalib." }
summary:
  en: "Reading the escalating incidents — the deputations, the attempt to trade him for Amara ibn al-Walid, Abu Jahl's stone, Uqba's strangling attempt, Umar's unsheathed sword — Abu Talib sensed danger to his nephew and gathered Banu Hashim and Banu al-Muttalib to stand with him; all answered except Abu Lahab, who sided with the enemy."
  fr: "Face à l’escalade — délégations, tentative d’échange contre Amara ibn al-Walid, pierre d’Abu Jahl, tentative d’étranglement d’Uqba, épée dégainée d’Omar —, Abu Talib pressentit le danger pour son neveu et réunit les Banu Hashim et les Banu al-Muttalib pour le soutenir ; tous répondirent sauf Abu Lahab, qui prit le parti adverse."
  ar: "قرأ أبو طالب الحوادث المتصاعدة — الوفود إليه، ومحاولة مقايضته بعمارة بن الوليد، وحجر أبي جهل، وخنق عقبة بن أبي معيط، وسيف ابن الخطاب — فشمّ خطراً على ابن أخيه، فجمع بني هاشم وبني المطلب ليكونوا معه يداً واحدة، فأجابوه جميعاً إلا أبا لهب فإنه خالفهم إلى عدوهم."
  es: "Al leer los incidentes cada vez más graves —las delegaciones, el intento de intercambiarlo por Amara ibn al-Walid, la piedra de Abu Jahl, el intento de estrangulamiento de Uqba, la espada desenvainada de Umar— Abu Talib presentía el peligro que corría su sobrino y reunió a Banu Hashim y Banu al-Muttalib para que lo apoyaran; todos respondieron excepto Abu Lahab, quien se puso del lado del enemigo."
  ur: "بڑھتے ہوئے واقعات کو پڑھتے ہوئے — وفود، عمارہ بن الولید کے لیے اس کی تجارت کی کوشش، ابو جہل کا پتھر، عقبہ کا گلا گھونٹنے کی کوشش، عمر کی غیر منقطع تلوار — ابو طالب نے اپنے بھتیجے کے لیے خطرہ محسوس کیا اور بنو ہاشم اور بنو المطلب کو اپنے ساتھ کھڑا کرنے کے لیے جمع کیا۔ سب نے جواب دیا سوائے ابو لہب کے، جس نے دشمن کا ساتھ دیا۔"
  tr: "Ebu Talib, giderek tırmanan olayları okudu; kendisine gelen heyetleri, Ammarah ibn al-Walid ile takas edilme girişimini, Ebu Cehl'in taşını, Ukbe ibn Abi Mu'ayt'ın boğulmasını ve İbn al-Khattab'ın kılıcını gördü ve yeğeninin tehlikede olduğunu sezdi. Bunun üzerine Beni Haşim ve Beni al-Muttalib kabilelerini tek el gibi yanına topladı ve hepsi ona itaat etti; sadece Ebu Lahab, onlara karşı çıkarak düşmanlarının safına geçti."
  id: "Abu Talib membaca tentang peristiwa-peristiwa yang semakin memanas—delegasi-delegasi yang datang kepadanya, upaya untuk menukarnya dengan Ammarah ibn al-Walid, batu Abu Jahl, pencekikan Uqbah ibn Abi Mu’ayt, dan pedang Ibn al-Khattab—dan dia merasakan bahaya bagi keponakannya, sehingga dia mengumpulkan Bani Hasyim dan Bani al-Muttalib untuk bersatu dengannya, dan mereka semua menanggapinya kecuali Abu Lahab, yang pergi melawan mereka ke pihak musuh."
