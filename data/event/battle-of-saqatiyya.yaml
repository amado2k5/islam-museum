summary:
  ar: "وقعة السقاطية أسفل كسكر: لحق المنهزمون بنرسي ابن خالة الملك ومعه أهل باروسما والزوابي وبندويه وتيرويه ابنا بسطام، فعاجلهم أبو عبيد من النمارق فانهزمت فارس وهرب نرسي وغلب المسلمون على عسكره وأرضه وأخذوا النرسيان — نوع من التمر لا يأكله إلا كسرى أو من أكرمه به ولا يغرسه غيرهم — فأطعموه الفلاحين وبعثوا بخمسه إلى عمر وكتبوا: إن الله أطعمنا مطاعم كانت الأكاسرة تحميها وأحببنا أن تروها لتشكروا إنعام الله وإفضاله. وقبلها كانت بوران قد نُصّبت بعد أن فقأ رستم عين آزرميدخت على أن تُملّك عشر سنين {cite:kamil-ibn-al-athir p. 275}."
  en: "At al-Saqatiyya below Kaskar, Abu 'Ubayd smashed Narsi — the shah's cousin — and his joined levies. In the captured camp was the narsiyyan, a date the Kaisars reserved for the royal table alone and none else might plant; the Muslims fed it to the farmers, sent its fifth to 'Umar with the letter: 'God fed us food the Kaisars hoarded — we wished you to see it, to thank God's grace.' Behind the battle stood Buran, crowned after Rustam put out Azarmidukht's eyes, on a ten-year pact to restore the House of Kisra {cite:kamil-ibn-al-athir p. 275}."
  fr: "À al-Saqatiyya, en aval de Kaskar, Abu 'Ubayd écrasa Narsi, cousin du chah, et ses levées réunies. Dans le camp pris se trouvait le narsiyyan, une datte que les Kaisars réservaient à la seule table royale et que nul autre ne pouvait planter ; les musulmans en nourrirent les paysans et en envoyèrent le cinquième à 'Umar avec cette lettre : « Dieu nous a nourris d'un aliment que les Kaisars thésaurisaient ; nous avons voulu que tu le voies, pour remercier la grâce de Dieu. » Derrière la bataille se tenait Buran, couronnée après que Rustam eut crevé les yeux d'Azarmidukht, en vertu d'un pacte de dix ans pour restaurer la maison de Kisra {cite:kamil-ibn-al-athir p. 275}."
  es: "En al-Saqatiyya, cerca de Kaskar, Abu 'Ubayd derrotó a Narsi —primo del sha— y a sus tropas. En el campamento capturado se encontraba el narsiyyan, un dátil que los emperadores reservaban exclusivamente para la mesa real y que nadie más podía plantar; los musulmanes se lo dieron a los campesinos y enviaron un quinto a 'Umar con la carta: «Dios nos ha dado alimento que los emperadores acaparaban; queríamos que lo vieras para agradecerle su gracia». Tras la batalla se encontraba Buran, coronado después de que Rustam cegara a Azarmidukht, con un pacto de diez años para restaurar la Casa de Kisra {cite:kamil-ibn-al-athir p. 275}."
  ur: "کاسکر کے نیچے السقطیہ میں، ابو عبید نے نرسی - شاہ کے کزن - اور اس کے ساتھ مل کر لیویز کو توڑ دیا۔ قبضے میں لیے گئے کیمپ میں نرسیاں تھی، ایک تاریخ جو قیصروں نے صرف شاہی میز کے لیے رکھی تھی اور کوئی اور نہیں لگا سکتا تھا۔ مسلمانوں نے اسے کسانوں کو کھلایا، اس کا پانچواں خط حضرت عمر کو بھیجا: 'خدا نے ہمیں قیصروں کا ذخیرہ کیا ہوا کھانا کھلایا - ہم چاہتے تھے کہ آپ اسے دیکھیں، خدا کے فضل کا شکر ادا کریں۔' جنگ کے پیچھے بران کھڑا تھا، جسے رستم نے ازرمدخت کی آنکھیں نکالنے کے بعد تاج پہنایا تھا، جس پر دس سالہ معاہدہ کیا گیا تھا کہ وہ کسریٰ کے گھر کو بحال کرے۔ 275}۔"
