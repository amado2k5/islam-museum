summary:
  ar: "وقعة السقاطية أسفل كسكر: لحق المنهزمون بنرسي ابن خالة الملك ومعه أهل باروسما والزوابي وبندويه وتيرويه ابنا بسطام، فعاجلهم أبو عبيد من النمارق فانهزمت فارس وهرب نرسي وغلب المسلمون على عسكره وأرضه وأخذوا النرسيان — نوع من التمر لا يأكله إلا كسرى أو من أكرمه به ولا يغرسه غيرهم — فأطعموه الفلاحين وبعثوا بخمسه إلى عمر وكتبوا: إن الله أطعمنا مطاعم كانت الأكاسرة تحميها وأحببنا أن تروها لتشكروا إنعام الله وإفضاله. وقبلها كانت بوران قد نُصّبت بعد أن فقأ رستم عين آزرميدخت على أن تُملّك عشر سنين {cite:kamil-ibn-al-athir p. 275}."
  en: "At al-Saqatiyya below Kaskar, Abu 'Ubayd smashed Narsi — the shah's cousin — and his joined levies. In the captured camp was the narsiyyan, a date the Kaisars reserved for the royal table alone and none else might plant; the Muslims fed it to the farmers, sent its fifth to 'Umar with the letter: 'God fed us food the Kaisars hoarded — we wished you to see it, to thank God's grace.' Behind the battle stood Buran, crowned after Rustam put out Azarmidukht's eyes, on a ten-year pact to restore the House of Kisra {cite:kamil-ibn-al-athir p. 275}."
