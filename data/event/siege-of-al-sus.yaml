label: { ar: "فتح السوس", en: "Conquest of al-Sus", es: "Conquista de al-Sus", fr: "Conquête d'al-Sus", ur: "السوس کی فتح", tr: "Solucanı açmak", id: "Membuka cacing" }
summary:
  ar: "سار أبو موسى إلى السوس فقاتل أهلها ثم حاصرهم حتى نفد ما عندهم من الطعام فضرعوا إلى الأمان وسأل مرزبانهم أن يؤمنوا ثمانين منهم على أن يفتح باب المدينة ويسلمها فسمى الثمانين وأخرج نفسه منهم فأمر به أبو موسى فضربت عنقه ولم يعرض للثمانين وقتل من سواهم من المقاتلة وأخذ الأموال وسبى الذرية ورأى أبو موسى في قلعتهم بيتاً عليه ستر فقيل إن فيه جثة دانيال النبي إنهم كانوا أقحطوا فسألوا أهل بابل دفنه إليهم ليستسقوا به وكان بختنصر سبى دانيال وأتى به بابل فقبض بها فكتب أبو موسى بذلك إلى عمر فكتب إليه عمر أن كفنه وادفنه فسد أبو موسى نهراً حتى إذا انقطع دفنه ثم أجرى الماء عليه وروى خالد بن زيد المزني وكانت عينه أصيبت بالسوس أن دهقانها صالح أبا موسى على أن يفتح المدينة ويؤمن له مائة فعزل المائة وبقي عدو الله فأمر به أن يقتل فنادى رويدك أعطيك مالاً كثيراً فأبى وضرب عنقه."
  en: "Abu Musa besieged al-Sus till its food failed; its marzban bought aman for eighty named men — excluding himself — to open the gate; Abu Musa beheaded him, spared the eighty, killed the other fighters and took the wealth and children. In the citadel stood a curtained house: the body of the prophet Daniel, whom a drought had moved them to ask Babylon's people to bury among them for rain — Bukhtanasar had carried him captive to Babylon and he died there. Abu Musa wrote Umar, who answered 'shroud and bury him' — he dammed the river, buried him and released the water. Khalid ibn Zayd, who lost an eye there, tells the dahqan's hundred-man aman and the spared 'enemy of God' who cried 'wait, I give great wealth' — refused and beheaded."
  es: "Abu Musa sitió al-Sus hasta que se quedaron sin provisiones; su marzban compró un aman para ochenta hombres nombrados —excluyéndose a sí mismo— para abrir la puerta; Abu Musa lo decapitó, perdonó a los ochenta, mató a los demás combatientes y se quedó con las riquezas y los niños. En la ciudadela se encontraba una casa con cortinas: el cuerpo del profeta Daniel, a quien una sequía los había impulsado a pedir al pueblo de Babilonia que lo enterrara entre ellos para que lloviera; Bukhtanasar lo había llevado cautivo a Babilonia y murió allí. Abu Musa escribió a Umar, quien respondió «turbante y entiérralo»; represó el río, lo enterró y liberó el agua. Khalid ibn Zayd, quien perdió un ojo allí, le cuenta al dahqan el aman de cien hombres y al «enemigo de Dios» perdonado que gritó «espera, te daré una gran riqueza»; se negó y fue decapitado."
  fr: "Abou Moussa assiégea al-Sus jusqu'à épuisement de ses vivres. Son marzban paya quatre-vingts hommes nommément désignés – lui excluant – pour ouvrir la porte. Abou Moussa le fit décapiter, épargna les quatre-vingts, tua les autres combattants et s'empara des richesses et des enfants. Dans la citadelle se trouvait une maison aux rideaux déployés: le corps du prophète Daniel, que la sécheresse avait poussé les Babyloniens à demander aux habitants de Babylone de l'enterrer parmi eux pour obtenir la pluie. Boukhtanasar l'avait emmené captif à Babylone, où il mourut. Abou Moussa écrivit à Omar, qui répondit: « Enveloppez-le d'un linceul et enterrez-le. » Omar fit construire un barrage sur le fleuve, l'enterra et relâcha les eaux. Khalid ibn Zayd, qui y perdit un œil, raconte comment le marzban paya cent hommes et comment « l'ennemi de Dieu » épargné, qui s'écria: « Attendez, je vous offre une grande richesse ! », refusa et fut décapité."
  ur: "ابو موسیٰ نے السوس کا محاصرہ کر لیا یہاں تک کہ اس کا کھانا ختم ہو گیا۔ اس کے مرزبان نے گیٹ کھولنے کے لیے اسّی نامی آدمیوں کے لیے امان خریدا — اپنے آپ کو چھوڑ کر — ابو موسیٰ نے اس کا سر قلم کر دیا، اسّی کو چھوڑ دیا، دوسرے جنگجوؤں کو مار ڈالا اور مال و اولاد لے لیا۔ قلعہ میں ایک پردہ دار گھر کھڑا تھا: دانیال نبی کی لاش، جسے خشک سالی نے انہیں بابل کے لوگوں سے بارش کے لیے اپنے درمیان دفن کرنے کے لیے کہا تھا - بختنصر اسے اسیر بنا کر بابل لے گیا تھا اور وہ وہیں مر گیا۔ ابو موسیٰ نے عمر کو لکھا، جس نے جواب دیا 'کفن ڈالو اور اسے دفن کرو' - اس نے دریا پر بند باندھا، اسے دفن کیا اور پانی چھوڑ دیا۔ خالد بن زید، جس کی وہیں ایک آنکھ ضائع ہو گئی، دہقان کے سو آدمی امان اور بچ جانے والے 'خدا کے دشمن' سے کہتا ہے جس نے 'انتظار کرو، میں بہت دولت دیتا ہوں' - انکار کر دیا اور سر قلم کر دیا۔"
  tr: "Ebu Musa, Susa'ya yürüdü ve halkıyla savaştı, sonra da yiyecekleri bitene kadar onları kuşattı. Halk güvenlik için yalvardı ve muhtarları, şehir kapısını açıp şehri teslim etmesi karşılığında seksen kişinin güvenliğinin sağlanmasını istedi. Muhtar seksen kişinin isimlerini verdi ve kendisini aralarından çıkardı, bu yüzden Ebu Musa onun başının kesilmesini emretti. Seksen kişiye zarar vermedi, ancak geri kalan savaşçıları öldürdü, parayı ele geçirdi ve kadınları ve çocukları esir aldı. Ebu Musa, kalelerinde perdesi olan bir ev gördü ve bunun Peygamber Daniel'in cesedini içerdiği söylendi. Kuraklık çekiyorlardı, bu yüzden Babil halkından onu kendileriyle birlikte gömmelerini istediler ki onun aracılığıyla yağmur alsınlar. Nebukadnezar Daniel'i esir almış ve Babil'e getirmişti, orada hapsedilmişti. Ebu Musa bunu Ömer'e yazdı ve Ömer de ona kefenleyip gömmesini söyledi. Ebu Musa bir nehri kapattı ve nehir kapanınca onu gömdü ve suyun üzerinden akmasına izin verdi. Susa'da gözü yaralanan Halid bin Zeyd el-Muzani, şehrin muhtarının Ebu Musa ile şehri açması ve yüz kişiye güvenlik sağlaması şartıyla barıştığını rivayet etti. Yüz kişiyi bir kenara bıraktı ve Allah'ın düşmanı kaldı, bu yüzden öldürülmesini emretti. \"Bekle, sana çok para vereceğim\" diye bağırdı, ama o reddetti ve başı kesildi."
  id: "Abu Musa bergerak ke Susa dan memerangi penduduknya, kemudian mengepung mereka hingga persediaan makanan mereka habis. Mereka memohon keselamatan, dan marzban mereka meminta agar mereka memberikan keselamatan kepada delapan puluh orang dari mereka sebagai imbalan atas pembukaan gerbang kota dan penyerahannya. Ia menyebutkan nama delapan puluh orang tersebut dan mengecualikan dirinya sendiri, sehingga Abu Musa memerintahkan agar ia dipenggal kepalanya. Ia tidak melukai delapan puluh orang tersebut, tetapi membunuh para pejuang lainnya, merampas uang, dan menawan para wanita dan anak-anak. Abu Musa melihat di benteng mereka sebuah rumah dengan tirai di atasnya, dan dikatakan bahwa di dalamnya terdapat jenazah Nabi Daniel. Mereka telah mengalami kekeringan, sehingga mereka meminta penduduk Babilonia untuk menguburnya bersama mereka agar mereka dapat menerima hujan melalui dirinya. Nebukadnezar telah menawan Daniel dan membawanya ke Babilonia, di mana ia dipenjara. Abu Musa menulis tentang hal ini kepada Umar, dan Umar membalas suratnya untuk mengkafani dan menguburkannya. Maka Abu Musa membendung sebuah sungai, dan ketika sungai itu terputus, ia menguburkannya dan kemudian membiarkan air mengalir di atasnya. Khalid bin Zaid al-Muzani, yang matanya terluka di Susa, meriwayatkan bahwa dehban (penguasa Susa) berdamai dengan Abu Musa dengan syarat ia akan membuka kota dan memberinya perlindungan kepada seratus orang. Ia mengesampingkan seratus orang tersebut dan musuh Allah tetap tinggal, sehingga ia memerintahkan agar musuh itu dibunuh. Ia berseru, “Tunggu, aku akan memberimu banyak uang,” tetapi musuh itu menolak, dan kepalanya dipenggal."
