id: event/al-hadi-insists-on-the-lawful-measure-of-the-tithe
class: event
kind: other
label:
  ar: الهادي يرفض الزيادة على المقدار الواجب ويقول لا أصلحكم بفساد نفسي
  en: 'Al-Hadi refuses to take more than the due measure: "I will not set you right by corrupting myself"'
  ur: 'ہادی واجب مقدار سے زیادہ لینے سے انکار کرتے ہیں: «میں اپنے بگاڑ سے تمہیں نہیں سنواروں گا»'
summary:
  ar: اشتكى إليه بعض أصحابه أن أخذ العشر من ثلاثة وثلاثين فرقاً وثلث لا يجمع شيئاً، فأجاب أنه لن يأخذ غير الحق ولو التقت السماء والأرض عليه؛ وسأله آخر أن يأخذوا ممن يعطي طيب النفس أكثر من الواجب فقال لا أصلحكم بفساد نفسي.
  en: Companions said that taking a tenth only from thirty-three and a third farq would never gather anything; he replied he would take nothing but the due even if heaven and earth closed on him; another asked whether to take more from those who gave it willingly, and he said he would not set them right by corrupting himself.
  ur: ساتھیوں نے کہا کہ تینتیس اور ایک تہائی فرق سے عشر لینے پر کچھ جمع نہ ہوگا تو انہوں نے کہا کہ وہ حق کے سوا کچھ نہیں لیں گے چاہے آسمان و زمین ان پر آ ملیں؛ ایک اور نے پوچھا کہ جو خوشی سے واجب سے زیادہ دیں ان سے لیں؟ تو بولے کہ میں اپنے بگاڑ سے تمہیں نہیں سنواروں گا۔
