id: event/al-hadi-insists-on-the-lawful-measure-of-the-tithe
class: event
kind: other
label:
  ar: الهادي يرفض الزيادة على المقدار الواجب ويقول لا أصلحكم بفساد نفسي
  en: 'Al-Hadi refuses to take more than the due measure: "I will not set you right by corrupting myself"'
  ur: 'ہادی واجب مقدار سے زیادہ لینے سے انکار کرتے ہیں: «میں اپنے بگاڑ سے تمہیں نہیں سنواروں گا»'
  es: "Al-Hadi se niega a tomar más de lo debido: \"No voy a enmendaros corrompiéndome a mí mismo\"."
  fr: "Al-Hadi refuse d'aller au-delà de ce qui est nécessaire: « Je ne vous corrigerai pas en me corrompant moi-même. »"
  tr: "El-Hadi, istenen miktarı artırmayı reddederek, \"Ben sizi kendi yolsuzluğumla ıslah etmeyeceğim\" diyor."
  id: "Al-Hadi menolak untuk menaikkan jumlah yang dibutuhkan dan berkata, \"Saya tidak akan mereformasi kalian dengan korupsi saya sendiri.\""
summary:
  ar: اشتكى إليه بعض أصحابه أن أخذ العشر من ثلاثة وثلاثين فرقاً وثلث لا يجمع شيئاً، فأجاب أنه لن يأخذ غير الحق ولو التقت السماء والأرض عليه؛ وسأله آخر أن يأخذوا ممن يعطي طيب النفس أكثر من الواجب فقال لا أصلحكم بفساد نفسي.
  en: Companions said that taking a tenth only from thirty-three and a third farq would never gather anything; he replied he would take nothing but the due even if heaven and earth closed on him; another asked whether to take more from those who gave it willingly, and he said he would not set them right by corrupting himself.
  ur: ساتھیوں نے کہا کہ تینتیس اور ایک تہائی فرق سے عشر لینے پر کچھ جمع نہ ہوگا تو انہوں نے کہا کہ وہ حق کے سوا کچھ نہیں لیں گے چاہے آسمان و زمین ان پر آ ملیں؛ ایک اور نے پوچھا کہ جو خوشی سے واجب سے زیادہ دیں ان سے لیں؟ تو بولے کہ میں اپنے بگاڑ سے تمہیں نہیں سنواروں گا۔
  es: "Sus compañeros dijeron que tomar solo la décima parte de treinta y tres y un tercio de farq nunca reuniría nada; él respondió que no tomaría nada más que lo debido, incluso si el cielo y la tierra se le cerraran; otro preguntó si debía tomar más de aquellos que lo daban voluntariamente, y él dijo que no los enmendaría corrompiéndose a sí mismo."
  fr: "Ses compagnons disaient que prendre seulement un dixième sur trente-trois et un tiers farq ne permettrait jamais de rassembler quoi que ce soit; il répondit qu'il ne prendrait que ce qui lui était dû, même si le ciel et la terre se refermaient sur lui; un autre lui demanda s'il devait prendre davantage à ceux qui le donnaient volontairement, et il répondit qu'il ne les corrigerait pas en se corrompant lui-même."
  tr: "Arkadaşlarından bazıları, otuz üç buçuk gruptan onda birini almanın hiçbir şey ifade etmediğinden yakındılar; o da, gök ve yer kendisine karşı gelse bile, hakkı olandan başka bir şey almayacağını söyledi. Bir başkası ise, gönüllü olarak verenlerden gerekenden fazlasını almasını istedi; o da, “Kendimi yozlaştırarak sizi ıslah etmeyeceğim” dedi."
  id: "Sebagian dari sahabatnya mengeluh kepadanya bahwa mengambil sepersepuluh dari tiga puluh tiga sepertiga kelompok tidaklah berarti apa-apa, maka ia menjawab bahwa ia tidak akan mengambil apa pun selain apa yang menjadi haknya, bahkan jika langit dan bumi bersatu melawannya; dan yang lain memintanya untuk mengambil dari mereka yang memberi dengan sukarela lebih dari yang dituntut, maka ia berkata, “Aku tidak akan mengubah kalian dengan merusak diriku sendiri.”"
