label: { ar: "بيعة الخليفة المستعين بالسلطنة" }
summary:
  ar: "لما خرج السلطان الناصر فرج لقتال شيخ فهزم وقتل بويع الخليفة المستعين بالسلطنة مضافة للخلافة وذلك في المحرم سنة خمس عشرة وثمان مئة ولم يفعل ذلك إلا بعد شدة وتصميم وتوثق من الأمراء بالأيمان وعاد إلى مصر والأمراء في خدمته وتصرف بالولاية والعزل وضربت السكة باسمه ولم يغير لقبه وعمل شيخ الإسلام ابن حجر فيه قصيدته المشهورة الملك أصبح ثابت الأساس بالمستعين العادل العباس، ثم سكن شيخ الإصطبل وفوض إليه تدبير المملكة ولقب نظام الملك حتى تقدم إليه بألا يمكن الخليفة من كتابة العلامة إلا بعد عرضها عليه فاستوحش الخليفة وضاق صدره فسأله شيخ أن يفوض إليه السلطنة على العادة فاشترط أن ينزل من القلعة إلى بيته فلم يوافقه وتغلب على السلطنة وتلقب المؤيد وصرح بخلع المستعين وبايع بالخلافة أخاه داود المعتضد، فبلغ ذلك نوروزاً نائب الشام فجمع القضاة والعلماء واستفتاهم فأفتوه بأن ذلك لا يجوز فأجمع على قتال المؤيد {cite:tarikh-khulafa-minhaj-1434 p. 765-768}. وفي شذرات الذهب في سنة خمس عشرة وثمان مئة تسلطن شيخ المحمودي ولقب بالمؤيد وكني بأبي نصر وذلك بعد خلع الناصر وسلطنة المستعين الخليفة وخلعه وقتل الناصر فرج {cite:shadharat-dhahab p. 108}."
  en: "When sultan Faraj marched on Shaykh, was routed and killed, the CALIPH al-Musta'in was hailed as sultan too — Muharram 815: coins in his name, officers appointed and dismissed, the amirs in his service, and Ibn Hajar's famous ode 'the kingship stands firm-based in al-Musta'in the just Abbas'. Then Shaykh, styled Nizam al-Mulk, ruled from the stables, barred the caliph's own unseen signature, usurped as al-Mu'ayyad in Sha'ban and deposed him; Syria's regent Nawruz assembled the qadis whose fatwa voided it {cite:tarikh-khulafa-minhaj-1434 p. 765-768}."
