label: { ar: "بيعة الخليفة المستعين بالسلطنة", en: "The acclamation of the caliph al-Musta'in as sultan", es: "La aclamación del califa al-Musta'in como sultán", fr: "L'acclamation du calife al-Musta'in comme sultan", ur: "خلیفہ المستعین کو سلطان قرار دینا", tr: "Halife Mustafan'ın Sultanlığa bağlılığı", id: "Kesetiaan Khalifah Al-Musta'in kepada Kesultanan" }
summary:
  ar: "لما خرج السلطان الناصر فرج لقتال شيخ فهزم وقتل بويع الخليفة المستعين بالسلطنة مضافة للخلافة وذلك في المحرم سنة خمس عشرة وثمان مئة ولم يفعل ذلك إلا بعد شدة وتصميم وتوثق من الأمراء بالأيمان وعاد إلى مصر والأمراء في خدمته وتصرف بالولاية والعزل وضربت السكة باسمه ولم يغير لقبه وعمل شيخ الإسلام ابن حجر فيه قصيدته المشهورة الملك أصبح ثابت الأساس بالمستعين العادل العباس، ثم سكن شيخ الإصطبل وفوض إليه تدبير المملكة ولقب نظام الملك حتى تقدم إليه بألا يمكن الخليفة من كتابة العلامة إلا بعد عرضها عليه فاستوحش الخليفة وضاق صدره فسأله شيخ أن يفوض إليه السلطنة على العادة فاشترط أن ينزل من القلعة إلى بيته فلم يوافقه وتغلب على السلطنة وتلقب المؤيد وصرح بخلع المستعين وبايع بالخلافة أخاه داود المعتضد، فبلغ ذلك نوروزاً نائب الشام فجمع القضاة والعلماء واستفتاهم فأفتوه بأن ذلك لا يجوز فأجمع على قتال المؤيد {cite:tarikh-khulafa-minhaj-1434 p. 765-768}. وفي شذرات الذهب في سنة خمس عشرة وثمان مئة تسلطن شيخ المحمودي ولقب بالمؤيد وكني بأبي نصر وذلك بعد خلع الناصر وسلطنة المستعين الخليفة وخلعه وقتل الناصر فرج {cite:shadharat-dhahab p. 108}."
  en: "When sultan Faraj marched on Shaykh, was routed and killed, the CALIPH al-Musta'in was hailed as sultan too — Muharram 815: coins in his name, officers appointed and dismissed, the amirs in his service, and Ibn Hajar's famous ode 'the kingship stands firm-based in al-Musta'in the just Abbas'. Then Shaykh, styled Nizam al-Mulk, ruled from the stables, barred the caliph's own unseen signature, usurped as al-Mu'ayyad in Sha'ban and deposed him; Syria's regent Nawruz assembled the qadis whose fatwa voided it {cite:tarikh-khulafa-minhaj-1434 p. 765-768}."
  es: "Cuando el sultán Faraj marchó sobre Shaykh, fue derrotado y asesinado, el califa al-Musta'in fue aclamado también como sultán (Muharram 815): se acuñaron monedas con su nombre, se nombraron y destituyeron oficiales, los emires estuvieron a su servicio, y la famosa oda de Ibn Hajar escribió: «La realeza se mantiene firme, basada en al-Musta'in, el justo Abbas». Entonces Shaykh, llamado Nizam al-Mulk, gobernó desde los establos, prohibió la firma oculta del califa, usurpó el poder como al-Mu'ayyad en Sha'ban y lo depuso; el regente de Siria, Nawruz, reunió a los cadíes cuya fatwa la anuló (cita: tarikh-khulafa-minhaj-1434, págs. 765-768)."
  fr: "Lorsque le sultan Faraj marcha sur le calife, fut mis en déroute et tué, le calife al-Musta'in fut acclamé comme sultan – Muharram 815: des pièces de monnaie furent frappées à son nom, des officiers nommés et destitués, les émirs à son service, et Ibn Hajar prononça la célèbre ode « la royauté est inébranlable, fondée sur al-Musta'in, le juste Abbas ». Puis le calife, sous le nom de Nizam al-Mulk, gouverna depuis les écuries, interdit la signature invisible du calife, usurpa le pouvoir sous le nom d'al-Mu'ayyad à Sha'ban et le déposa; le régent de Syrie, Nawruz, réunit les qadis dont la fatwa annula cette décision (voir: tarikh-khulafa-minhaj-1434 p. 765-768)."
  ur: "جب سلطان فراج نے شیخ پر چڑھائی کی، اسے شکست دے کر قتل کر دیا گیا، تو خلیفہ المستطین کو بھی سلطان کے طور پر سراہا گیا - محرم 815: اس کے نام کے سکے، افسر مقرر اور برطرف، اس کی خدمت میں امیر، اور ابن حجر کا مشہور قول 'بادشاہت صرف عباس کے ساتھ کھڑا ہے'۔ اس کے بعد شیخ نے نظام الملک کے طرز پر، اصطبل سے حکومت کی، خلیفہ کے اپنے غیب دستخط سے روک دیا، شعبان میں المعیاد کے طور پر غصب کیا اور اسے معزول کر دیا۔ شام کے ریجنٹ نوروز نے قادیان کو جمع کیا جن کے فتوے نے اسے کالعدم قرار دیا 765-768}۔"
  tr: "Sultan el-Nasır Faraj, Şeyh ile savaşmaya çıktığında yenildi ve öldürüldü. Bunun üzerine Halife el-Musta'in, halifeliğin yanı sıra sultan olarak da biat yemini etti. Bu olay, Hicri 815 yılının Muharrem ayında (Miladi 1416) gerçekleşti. Bunu ancak büyük zorluklar, azim ve emirlerden yemin aldıktan sonra yaptı. Emirleri hizmetine alarak Mısır'a döndü ve atama ve görevden alma yetkisini kullandı. Adına sikkeler basıldı ve unvanı değiştirilmedi. Şeyh el-İslam İbn Hacer onun hakkında ünlü şiirini yazdı: \"Krallık, adil Abbasi el-Musta'in ile sağlam bir şekilde kuruldu.\" Daha sonra Şeyh el-İstabli yerleşti ve krallığın yönetimini ona devrederek ona Nizam el-Mülk unvanını verdi. Ardından Halife'ye, kendisine sunmadan hiçbir kararname çıkarmaması talimatını verdi. Halife endişelendi ve üzüldü. Şeyh, gelenek gereği halifeden saltanatı kendisine devretmesini istedi, ancak halife, Şeyh'in kaleden evine inmesine izin verilmesini şart koştu. Şeyh bunu reddetti, saltanatı ele geçirdi ve el-Muayyad unvanını aldı. El-Musta'in'in tahttan indirildiğini ilan etti ve kardeşi Davud el-Mu'tadid'e halife olarak biat etti. Bu haber Suriye valisi Nevruz'a ulaştı; Nevruz, kadıları ve alimleri topladı ve onlara danıştı. Bunun caiz olmadığını söylediler, bu yüzden Nevruz el-Muayyad ile savaşmaya karar verdi. {cite:tarikh-khulafa-minhaj-1434 s. 765-768} Şadharat el-Dhahab'da, 815 yılında Şeyh el-Mahmudi Sultan oldu ve el-Muayyad unvanını aldı ve Ebu Nasr olarak bilindi. Bu olay, el-Nasir'in ve halife el-Musta'in'in tahttan indirilmesinden ve el-Nasir Faraj'ın öldürülmesinden sonra gerçekleşti. {kaynak:şadharat-dhahab s. 108}"
  id: "Ketika Sultan al-Nasir Faraj pergi berperang melawan Syekh, ia dikalahkan dan terbunuh. Khalifah al-Musta'in kemudian disumpah setia sebagai Sultan di samping kekhalifahan. Ini terjadi pada bulan Muharram tahun 815 H (1416 M). Ia tidak melakukan ini kecuali setelah melalui kesulitan besar, tekad, dan mendapatkan sumpah dari para emir. Ia kembali ke Mesir dengan para emir dalam pelayanannya, menjalankan kekuasaan pengangkatan dan pemberhentian. Koin dicetak atas namanya, dan gelarnya tidak berubah. Syekh al-Islam Ibn Hajar menggubah puisi terkenalnya tentangnya: \"Kerajaan telah kokoh berdiri di bawah al-Musta'in, Abbasiyah yang adil.\" Kemudian Syekh al-Istabl menetap dan mendelegasikan administrasi kerajaan kepadanya, menganugerahinya gelar Nizam al-Mulk. Ia kemudian menginstruksikan Khalifah untuk tidak mengizinkan Khalifah mengeluarkan dekrit apa pun tanpa terlebih dahulu menyampaikannya kepadanya. Khalifah menjadi khawatir dan cemas. Syekh meminta Khalifah untuk mendelegasikan Kesultanan kepadanya sesuai dengan adat, tetapi Khalifah menetapkan bahwa ia diizinkan untuk turun dari Benteng ke rumahnya. Syekh menolak, merebut Kesultanan, dan mengadopsi gelar al-Mu'ayyad. Ia menyatakan penggulingan al-Musta'in dan berjanji setia kepada saudaranya Dawud al-Mu'tadid sebagai Khalifah. Berita ini sampai kepada Nawruz, gubernur Suriah, yang mengumpulkan para hakim dan ulama dan berkonsultasi dengan mereka. Mereka menasihatinya bahwa hal ini tidak diperbolehkan, sehingga ia memutuskan untuk memerangi al-Mu'ayyad. {cite:tarikh-khulafa-minhaj-1434 p. 765-768}. Dan dalam Shadharat al-Dhahab, pada tahun 815, Syekh al-Mahmudi menjadi Sultan dan diberi gelar al-Mu'ayyad dan dikenal sebagai Abu Nasr, dan itu terjadi setelah penggulingan al-Nasir dan Kesultanan al-Musta'in Khalifah dan penggulingannya serta pembunuhan al-Nasir Faraj {cite:shadharat-dhahab hlm. 108}."
