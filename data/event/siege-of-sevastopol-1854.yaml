summary:
  ar: "بطاقة أولية لحصار سيفاستوبول من ١٨٥٤ إلى ١٨٥٥م، حصار حرب القرم التي قاتلت فيها الدولة العثمانية إلى جانب الحلفاء؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Siege of Sevastopol from 1854 to 1855, the Crimean War's great siege in which the Ottoman state fought alongside the allies; its sources are not yet checked on the page."
  es: "Boceto para el asedio de Sebastopol de 1854 a 1855, el gran asedio de la Guerra de Crimea en el que el estado otomano luchó junto a los aliados; sus fuentes aún no han sido verificadas en la página."
  fr: "Fiche de projet pour le siège de Sébastopol de 1854 à 1855, le grand siège de la guerre de Crimée au cours duquel l'État ottoman a combattu aux côtés des alliés; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1854 سے 1855 تک سیواستوپول کے محاصرے کے لیے ڈرافٹ کارڈ، کریمین جنگ کا عظیم محاصرہ جس میں عثمانی ریاست اتحادیوں کے ساتھ مل کر لڑی؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Bu metin, Osmanlı İmparatorluğu'nun Müttefikler yanında savaştığı Kırım Savaşı'nın bir parçası olan 1854-1855 yılları arasındaki Sivastopol Kuşatması'na dair ön bir anlatımdır; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Pengepungan Sevastopol dari tahun 1854 hingga 1855 M, sebuah pengepungan dalam Perang Krimea di mana Kekaisaran Ottoman bertempur bersama Sekutu; sumber-sumber di halaman ini belum ditinjau."
