label: { ar: "هزيمة ابن الأشعث في مسكن", en: "Defeat of Ibn al-Ash'ath at Maskin", fr: "La défaite d'Ibn al-Ash'ath à Maskin", es: "Derrota de Ibn al-Ash'ath en Maskin", ur: "مسکین کے ہاتھوں ابن اشعث کی شکست" }
summary:
  ar: "في سنة ثلاث وثمانين كانت الوقعة بمسكن بين الحجاج وابن الأشعث بعد انهزامه في دير الجماجم، وقُتل فيها زياد بن غنيم القيسي، وكان على المتسالحة من جند الحجاج {cite:tabari-tarikh-abu-al-fadl j.6 p.366}."
  en: "In 83 AH the battle at Maskin between al-Hajjaj and Ibn al-Ash'ath took place after Ibn al-Ash'ath's defeat at Dayr al-Jamajim. In it Ziyad ibn Ghunaym al-Qaysi was killed; he commanded the mutasallaha (armoured troops) of al-Hajjaj's army {cite:tabari-tarikh-abu-al-fadl j.6 p.366}."
  fr: "En 83 H, la bataille de Maskin entre al-Hajjaj et Ibn al-Ash'ath eut lieu après la défaite d'Ibn al-Ash'ath à Dayr al-Jamajim. Ziyad ibn Ghunaym al-Qaysi y fut tué ; il commandait les mutasallaha (troupes cuirassées) de l'armée d'al-Hajjaj {cite:tabari-tarikh-abu-al-fadl j.6 p.366}."
  es: "En el año 83 d. H., la batalla en Maskin entre al-Hajjaj e Ibn al-Ash'ath tuvo lugar después de la derrota de Ibn al-Ash'ath en Dayr al-Jamajim. En él fue asesinado Ziyad ibn Ghunaym al-Qaysi; él comandaba las mutasallaha (tropas blindadas) del ejército de al-Hajjaj {cita:tabari-tarikh-abu-al-fadl j.6 p.366}."
  ur: "83 ہجری میں حجاج اور ابن اشعث کے درمیان مسکین کے مقام پر جنگ دیرالجمجم میں ابن اشعث کی شکست کے بعد ہوئی۔ اس میں زیاد بن غنیم القیسی مارا گیا۔ اس نے الحجاج کی فوج کے متصلہ ⁦(بکتر بند دستوں)⁩ کی کمانڈ کی۔"
