  en: "In 83 AH the battle at Maskin between al-Hajjaj and Ibn al-Ash'ath took place after Ibn al-Ash'ath's defeat at Dayr al-Jamajim. In it Ziyad ibn Ghunaym al-Qaysi was killed; he commanded the mutasallaha (armoured troops) of al-Hajjaj's army {cite:tabari-tarikh-abu-al-fadl j.6 p.366}."
