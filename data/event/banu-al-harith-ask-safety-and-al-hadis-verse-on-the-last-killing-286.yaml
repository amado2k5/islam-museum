label:
  ar: "بنو الحارث يطلبون الأمان وشعر الهادي في القتلة الآخرة، 286هـ"
  en: "Banu al-Harith ask safety and al-Hadi's verse on the last killing, 286 AH"
  ur: "بنو حارث کا امان مانگنا اور آخری قتل پر ہادی کا شعر، 286ھ"
summary:
  ar: "أرسل بنو الحارث رجالاً من أولياء الهادي يطلبون لهم الأمان فآمنهم ودخلوا القرية وتسوقوا، وهرب ابن بسطام إلى بلد شاكر ورفض الهادي الأمان له حينئذ، وقال الهادي شعراً في القتلة الآخرة."
  en: "Banu al-Harith sent men from among al-Hadi's partisans to ask safety for them and he granted it, and they entered the village and traded; Ibn Bustam fled to Shakir's land, al-Hadi refusing him safety then, and al-Hadi composed verse on the last killing."
  ur: "بنو حارث نے ہادی کے حامیوں میں سے کچھ آدمی بھیجے کہ ان کے لیے امان مانگیں تو انہوں نے امان دی اور وہ بستی میں داخل ہو کر خرید و فروخت کرنے لگے؛ ابن بسطام بلد شاکر کو بھاگ گیا اور ہادی نے اس وقت اسے امان دینا ناپسند کیا، اور ہادی نے آخری قتل پر شعر کہا۔"
