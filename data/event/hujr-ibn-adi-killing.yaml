label: { ar: "مقتل حجر بن عدي وأصحابه", en: "Killing of Hujr ibn Adi and his companions", es: "Asesinato de Hujr ibn Adi y sus compañeros", fr: "Meurtre de Hujr ibn Adi et de ses compagnons", ur: "حجر ابن عدی اور ان کے ساتھیوں کا قتل", tr: "Hucer ibn Adi ve arkadaşlarının öldürülmesi", id: "Pembunuhan Hujr ibn Adi dan para sahabatnya" }
summary:
  ar: "في سنة إحدى وخمسين قُتل حجر بن عدي الكندي وأصحابه، وذكر الطبري أن معاوية لما ولّى المغيرة بن شعبة الكوفة في سنة إحدى وأربعين دعاه وأوصاه بأشياء، ثم جرى ما أدى إلى قتلهم {cite:tabari-tarikh-abu-al-fadl j.5 p.253}."
  en: "In the year 51, Hujr ibn Adi al-Kindi and his companions were killed. Al-Tabari mentions that when Mu'awiya appointed al-Mughira ibn Shu'ba over Kufa in the year 41, he summoned him and charged him with certain matters; then events unfolded that led to their killing {cite:tabari-tarikh-abu-al-fadl j.5 p.253}."
  es: "En el año 51, Hujr ibn Adi al-Kindi y sus compañeros fueron asesinados. Al-Tabari menciona que cuando Mu'awiya nombró a al-Mughira ibn Shu'ba al frente de Kufa en el año 41, lo convocó y le encomendó ciertos asuntos; luego se desarrollaron los acontecimientos que llevaron a su muerte {cite:tabari-tarikh-abu-al-fadl j.5 p.253}."
  fr: "En l'an 51, Hujr ibn Adi al-Kindi et ses compagnons furent tués. Al-Tabari rapporte que lorsque Mu'awiya nomma al-Mughira ibn Shu'ba à la tête de Kufa en l'an 41, il le convoqua et le chargea de certaines affaires; des événements se déroulèrent ensuite qui menèrent à leur assassinat {cite:tabari-tarikh-abu-al-fadl j.5 p.253}."
  ur: "سنہ 51 میں حجر ابن عدی الکندی اور ان کے ساتھیوں کو قتل کر دیا گیا۔ الطبری نے ذکر کیا ہے کہ جب معاویہ نے المغیرہ بن شعبہ کو سن 41 میں کوفہ پر مقرر کیا تو اس نے اسے بلوایا اور بعض امور کی ذمہ داری سونپی۔ پھر ایسے واقعات رونما ہوئے جو ان کے قتل کا باعث بنے۔"
  tr: "Elli birinci yılda Hucer ibn Adi el-Kindi ve arkadaşları öldürüldü. Taberi, Muaviye'nin kırk birinci yılda el-Muğra ibn Şu'ba'yı Kufe'ye atadığında onu çağırdığını ve talimatlar verdiğini, ardından da öldürülmelerine yol açan olayların yaşandığını belirtmiştir. {cite:tabari-tarikh-abu-al-fadl j.5 p.253}"
  id: "Pada tahun 51, Hujr ibn Adi al-Kindi dan para sahabatnya terbunuh. Al-Tabari menyebutkan bahwa ketika Muawiyah menunjuk al-Mughira ibn Shu’ba ke Kufa pada tahun 41, ia memanggilnya dan memberinya instruksi, dan kemudian apa yang terjadi menyebabkan mereka terbunuh. {cite:tabari-tarikh-abu-al-fadl j.5 p.253}."
