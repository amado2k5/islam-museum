  en: "In the year 51, Hujr ibn Adi al-Kindi and his companions were killed. Al-Tabari mentions that when Mu'awiya appointed al-Mughira ibn Shu'ba over Kufa in the year 41, he summoned him and charged him with certain matters; then events unfolded that led to their killing {cite:tabari-tarikh-abu-al-fadl j.5 p.253}."
