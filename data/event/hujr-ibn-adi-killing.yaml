label: { ar: "مقتل حجر بن عدي وأصحابه" }
summary:
  ar: "في سنة إحدى وخمسين قُتل حجر بن عدي الكندي وأصحابه، وذكر الطبري أن معاوية لما ولّى المغيرة بن شعبة الكوفة في سنة إحدى وأربعين دعاه وأوصاه بأشياء، ثم جرى ما أدى إلى قتلهم {cite:tabari-tarikh-abu-al-fadl j.5 p.253}. ويذكر الكتاب أن زياداً قيّد حجراً وبعث به مع شهود إلى معاوية في الشام، فقُتل هناك مع عدد من أصحابه {cite:bakr-umayyad-state-1134715 p. 139-142}."
