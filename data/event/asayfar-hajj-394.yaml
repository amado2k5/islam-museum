label: { ar: "اعتراض الأسيفر المنتفقي الحاج وهبته أموالهم", en: "Al-Asayfar al-Muntafiqi intercepts the pilgrims and gives away their wealth", fr: "Al-Asayfar al-Muntafiqi intercepte les pèlerins et fait don de leurs biens", es: "Al-Asayfar al-Muntafiqi intercepta a los peregrinos y reparte sus riquezas.", ur: "الاصفر المنتفقی حجاج کو روکتا ہے اور ان کے مال کو دیتا ہے۔" }
summary:
  ar: "اعترض الأسيفر المنتفقي الحاج في سنة أربع وتسعين بالباطنة وحاصرهم وعول على نهبهم فدخل إليه أبو الحسين بن الرفاء وأبو عبد الله بن الدجاجي القارئان فقرا بين يديه وسألهما عن عيشهما ببغداد فقالا تصلنا الخلع والصلات والهدايا، فلما أنكرا أن يكون قد وهب لهما أهل بغداد ألف ألف دينار قال قد وهبت لكما الحاج وأموالهم وذلك يزيد على ألف ألف دينار فوفى للحاج بذلك، وقال أهل مكة ومصر والشام ما سمعنا عن أهل بغداد تبذيراً مثل هذا {cite:muntazam-ibn-al-jawzi j.7 p.227-228}."
  en: "In the year ninety-four al-Asayfar al-Muntafiqi intercepted the pilgrims at al-Batina, besieged them and relied on plundering them. Abu al-Husayn ibn al-Raffa' and Abu Abdallah ibn al-Dajaji, the two reciters, entered his presence and recited before him. He asked them about their livelihood in Baghdad, and they said: «Robes of honour, stipends and gifts reach us». When they denied that the people of Baghdad had bestowed a million dinars on them, he said: «I have given you the pilgrims and their wealth, which exceeds a million dinars», and he fulfilled that for the pilgrims. The people of Mecca, Egypt and Syria said: «We have not heard of such extravagance from the people of Baghdad» {cite:muntazam-ibn-al-jawzi j.7 p.227-228}."
  fr: "En l'an quatre-vingt-quatorze, al-Asayfar al-Muntafiqi intercepta les pèlerins à al-Batina, les assiégea et compta sur leur pillage. Abu al-Husayn ibn al-Raffa' et Abu Abdallah ibn al-Dajaji, les deux récitateurs, entrèrent en sa présence et récitèrent devant lui. Il les interrogea sur leurs moyens de subsistance à Bagdad, et ils dirent : « Des robes d'honneur, des pensions et des présents nous parviennent ». Quand ils nièrent que les gens de Bagdad leur eussent accordé un million de dinars, il dit : « Je vous ai donné les pèlerins et leurs biens, qui dépassent un million de dinars », et il tint parole envers les pèlerins. Les gens de La Mecque, d'Égypte et de Syrie dirent : « Nous n'avons pas entendu parler d'une telle prodigalité de la part des gens de Bagdad » {cite:muntazam-ibn-al-jawzi j.7 p.227-228}."
  es: "En el año noventa y cuatro, al-Asayfar al-Muntafiqi interceptó a los peregrinos en al-Batina, los sitió y se dedicó a saquearlos. Abu al-Husayn ibn al-Raffa' y Abu Abdallah ibn al-Dajaji, los dos recitadores, se presentaron ante él y recitaron. Les preguntó sobre su sustento en Bagdad, y ellos respondieron: «Recibimos túnicas de honor, estipendios y regalos». Cuando negaron que la gente de Bagdad les hubiera otorgado un millón de dinares, él dijo: «Yo os he dado a los peregrinos y sus riquezas, que superan el millón de dinares», y cumplió con lo prometido. La gente de La Meca, Egipto y Siria dijo: «Nunca hemos oído hablar de tal extravagancia por parte de la gente de Bagdad». {cite:muntazam-ibn-al-jawzi j.7 p.227-228}."
  ur: "سن 94 میں الاسعفر المنتفقی نے البطینہ میں حجاج کو روکا، ان کا محاصرہ کیا اور انہیں لوٹنے پر انحصار کیا۔ ابو الحسین بن الرافع اور ابو عبد اللہ بن الدجاجی، جو دو قاری تھے، آپ کے پاس آئے اور آپ کے سامنے تلاوت کی۔ اس نے ان سے بغداد میں ان کی روزی روٹی کے بارے میں دریافت کیا تو انہوں نے کہا: عزت کے لباس، وظیفہ اور تحائف ہم تک پہنچتے ہیں۔ جب انہوں نے انکار کیا کہ بغداد والوں نے ان کو دس لاکھ دینار عطا کیے ہیں تو اس نے کہا: میں نے تمہیں حجاج اور ان کا مال دیا ہے جو کہ دس لاکھ دینار سے زیادہ ہے، اور اس نے اسے حاجیوں کے لیے پورا کیا۔ اہل مکہ، مصر اور شام نے کہا: \"ہم نے اہل بغداد سے اس طرح کے اسراف کے بارے میں نہیں سنا۔\""
