label: { ar: "غزوة راغب مولى الموفق البحرية", en: "The naval raid of Raghib, mawla of al-Muwaffaq", es: "La incursión naval de Raghib, la mawla de al-Muwaffaq", fr: "Le raid naval de Raghib, le mawla d'al-Muwaffaq", ur: "راغب کا بحری حملہ، مولا الموفق", tr: "Al-Muwaffaq'ın azatlı kölesi Raghib'in deniz baskını", id: "Serangan angkatan laut yang dilakukan oleh Raghib, seorang budak yang dibebaskan oleh Al-Muwaffaq." }
summary:
  ar: "ورد الخبر لثلاث خلون من شعبان سنة خمس وثمانين ومائتين أن راغبًا الخادم مولى الموفق غزا في البحر فأظفره الله بمراكب كثيرة وبجميع ما فيها من الروم، فضُربت أعناق ثلاثة آلاف منهم وأُحرقت المراكب وفُتح حصون كثيرة من حصون الروم {cite:muntazam-ibn-al-jawzi p. 295}."
  en: "In Sha'ban 285 news came that Raghib, a mawla of al-Muwaffaq, had raided by sea and won: many Byzantine ships taken with all aboard, three thousand beheaded, the ships burned and numerous fortresses captured {cite:muntazam-ibn-al-jawzi p. 295}."
  es: "En Sha'ban 285 llegaron noticias de que Raghib, un mawla de al-Muwaffaq, había sido atacado por mar y vencido: muchos barcos bizantinos fueron capturados con todos a bordo, tres mil decapitados; 295}."
  fr: "En Sha'ban 285, la nouvelle parvint que Raghib, un mawla d'al-Muwaffaq, avait été attaqué par la mer et conquis: de nombreux navires byzantins furent pris avec tout leur équipage, trois mille personnes décapitées; 295}."
  ur: "شعبان 285 میں خبر آئی کہ الموفق کے ایک مولا راغب نے سمندر کے راستے چھاپہ مارا اور فتح حاصل کی: بازنطینی بحری جہاز تمام سواروں کو لے کر گئے، تین ہزار کے سر قلم کیے گئے، جہاز جلا دیے گئے اور متعدد قلعوں پر قبضہ کر لیا گیا۔ 295}۔"
  tr: "285 yılının Şaban ayının üçüncü gününde, Muvaffak'ın azatlı kölesi Raghib'in denizde baskın düzenlediği ve Allah'ın ona birçok gemi ve içlerindeki tüm Romalılara karşı zafer bahşettiği haberi geldi. Üç bin Romalının başı kesildi, gemiler yakıldı ve birçok Roma kalesi fethedildi. {cite:muntazam-ibn-al-jawzi s. 295}"
  id: "Kabar itu datang tiga hari memasuki bulan Sya'ban tahun dua ratus delapan puluh lima bahwa Raghib, seorang hamba yang telah dibebaskan oleh Al-Muwaffaq, melakukan penyerangan di laut dan Allah menganugerahinya kemenangan atas banyak kapal dan semua orang Romawi di dalamnya. Tiga ribu dari mereka dipenggal kepalanya, kapal-kapal dibakar, dan banyak benteng Romawi ditaklukkan. {cite:muntazam-ibn-al-jawzi p. 295}."
