summary:
  ar: "في ربيع الأول سار أسد الدين شيركوه إلى ديار مصر فملكها بالعساكر النورية، وكان الفرنج قد ملكوا بلبيس قهرًا فقتلوا وأسروا ثم حاصروا القاهرة فأحرق شاور مدينة مصر فبقيت النار فيها أربعة وخمسين يومًا وأرسل العاضد إلى نور الدين يستغيث به بشعور نسائه، وصالح شاور الفرنج على ألف ألف دينار فرحلوا، فلما قدم شيركوه وقتل شاور — على المشهور أنه خرج يستقبله فطعنه صلاح الدين أو قتل بأمره — ولّي الوزارة مكانه وأُخرج له الخلع فلقي الناس بالعدل ولكنه مات بعدها بأيام وقيل بواحدة عظام أكلها فاختنقت به نفسه {cite:kamil-ibn-al-athir p. 11-15}."
  en: "In Rabīʿ I Shirkuh entered Egypt with the Nūrid armies and took it. The Franks had stormed Bilbays — killing and enslaving — then besieged Cairo while Shawar burned Fusṭāṭ (the fire ran fifty-four days) and bought their withdrawal for a promised million dinars; al-ʿĀḍid had sent his womenfolk's hair to Nūr al-Dīn begging rescue. When Shirkuh arrived Shawar was killed — as commonly told, Saladin's hand at his uncle's order — and Shirkuh took the vizierate, dealt justly with the people, then died days later, choked, it was said, on a feast of rich food {cite:kamil-ibn-al-athir p. 11-15}."
  es: "En Rabīʿ I, Shirkuh entró en Egipto con los ejércitos Nūridas y lo conquistó. Los francos habían asaltado Bilbays —matando y esclavizando— y luego sitiaron El Cairo, mientras Shawar incendiaba Fusṭāṭ (el fuego duró cincuenta y cuatro días) y compraba su retirada a cambio de un millón de dinares prometidos; al-ʿĀḍid había enviado el cabello de sus mujeres a Nūr al-Dīn implorando ayuda. Cuando Shirkuh llegó, Shawar fue asesinado —según se cuenta, por orden de su tío, a manos de Saladino— y Shirkuh asumió el visirato, trató con justicia al pueblo y murió días después, asfixiado, según se dice, por un festín de comida exquisita {cite:kamil-ibn-al-athir p. 11-15}."
  fr: "En Rabīʿ I, Shirkuh entra en Égypte avec les armées nurides et s'en empara. Les Francs avaient pris d'assaut Bilbays, massacrant et réduisant en esclavage la population, puis assiégé Le Caire tandis que Shawar incendiait Fusṭāṭ (l'incendie dura cinquante-quatre jours) et achetait leur retraite pour un million de dinars promis; al-ʿĀḍid avait envoyé les cheveux de ses femmes à Nūr al-Dīn pour implorer son secours. À l'arrivée de Shirkuh, Shawar fut tué – selon la tradition, par Saladin sur ordre de son oncle – et Shirkuh prit le vizirat, traita le peuple avec justice, puis mourut quelques jours plus tard, étouffé, disait-on, lors d'un festin copieux (voir: Kamil-ibn-al-athir, p. 11-15)."
  ur: "ربیع اول میں شرکوہ نوری فوجوں کے ساتھ مصر میں داخل ہوا اور اسے لے لیا۔ فرینکوں نے بلبیس پر دھاوا بول دیا - قتل اور غلامی - پھر قاہرہ کا محاصرہ کیا جبکہ شاور نے فوسط کو جلا دیا ⁦(آگ چوپن دن تک چلی)⁩ اور وعدہ شدہ ملین دینار کے عوض ان کی واپسی خرید لی۔ العدید نے اپنی عورتوں کے بال نورالدین کے پاس بھیجے تھے کہ وہ بچاؤ کی بھیک مانگیں۔ جب شرکوہ پہنچا تو شوار کو قتل کر دیا گیا — جیسا کہ عام طور پر کہا جاتا ہے کہ صلاح الدین کا ہاتھ اپنے چچا کے حکم پر تھا — اور شرقوہ نے وزیریٹ لے لیا، لوگوں کے ساتھ انصاف کیا، پھر کئی دن بعد دم گھٹ کر مر گیا، کہا جاتا ہے کہ ایک بھرپور کھانے کی دعوت پر۔ 11-15}۔"
