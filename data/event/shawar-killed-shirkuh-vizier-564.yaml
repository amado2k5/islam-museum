label: { ar: "دخول شيركوه مصر وقتل شاور وولايته الوزارة", en: "Shirkuh enters Egypt, Shawar is killed, and Shirkuh takes the vizierate", es: "Shirkuh entra en Egipto, Shawar muere y Shirkuh toma el visir.", fr: "Shirkuh entre en Égypte, Shawar est tué et Shirkuh s'empare du vizirat.", ur: "شرکوہ مصر میں داخل ہوتا ہے، شوار مارا جاتا ہے، اور شرکوہ نے وزیریٹ لی" }
date:
