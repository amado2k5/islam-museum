summary:
  ar: "في ربيع الأول سار أسد الدين شيركوه إلى ديار مصر فملكها بالعساكر النورية، وكان الفرنج قد ملكوا بلبيس قهرًا فقتلوا وأسروا ثم حاصروا القاهرة فأحرق شاور مدينة مصر فبقيت النار فيها أربعة وخمسين يومًا وأرسل العاضد إلى نور الدين يستغيث به بشعور نسائه، وصالح شاور الفرنج على ألف ألف دينار فرحلوا، فلما قدم شيركوه وقتل شاور — على المشهور أنه خرج يستقبله فطعنه صلاح الدين أو قتل بأمره — ولّي الوزارة مكانه وأُخرج له الخلع فلقي الناس بالعدل ولكنه مات بعدها بأيام وقيل بواحدة عظام أكلها فاختنقت به نفسه {cite:kamil-ibn-al-athir p. 11-15}."
  en: "In Rabīʿ I Shirkuh entered Egypt with the Nūrid armies and took it. The Franks had stormed Bilbays — killing and enslaving — then besieged Cairo while Shawar burned Fusṭāṭ (the fire ran fifty-four days) and bought their withdrawal for a promised million dinars; al-ʿĀḍid had sent his womenfolk's hair to Nūr al-Dīn begging rescue. When Shirkuh arrived Shawar was killed — as commonly told, Saladin's hand at his uncle's order — and Shirkuh took the vizierate, dealt justly with the people, then died days later, choked, it was said, on a feast of rich food {cite:kamil-ibn-al-athir p. 11-15}."
