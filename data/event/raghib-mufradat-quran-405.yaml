id: event/raghib-mufradat-quran-405
class: event
kind: publication
label:
  ar: "الراغب يضع «مفردات ألفاظ القرآن» ضمن مصنفاته القرآنية، نحو أوائل المئة الخامسة"
  en: "al-Raghib composes the Mufradat alfaz al-Qur'an among his Qur'anic monographs, early 5th/11th century"
  ur: "راغب کی «مفردات الفاظ قرآن» کی تصنیف، ان کی قرآنی رسائل کے سلسلے میں، پانچویں صدی ہجری کے اوائل"
summary:
  ar: "ألف الراغب الأصفهاني معجمه «مفردات ألفاظ القرآن» مرتباً على الحروف ضمن سلسلة من المصنفات القرآنية؛ ففي مقدمته يشير إلى رسالتين سابقتين له، «رسالة منبّهة على فوائد القرآن» و«رسالة في القوانين الدالة على تحقيق مناسبات الألفاظ»، وكلتاهما مفقودتان على الظاهر، ويَعِد بكتاب آخر في المتشابه عُرف بعد ذلك بـ«درة التأويل في متشابه التنزيل» {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390}."
  en: "al-Raghib composed his alphabetical lexicon of Qur'anic vocabulary, the Mufradat alfaz al-Qur'an, as one of a series of monographs on the Qur'an: in its introduction he refers to two earlier works of his — the Risala munabbiha 'ala fawa'id al-Qur'an and the Risala fi'l-qawanin al-dalla 'ala tahqiq munasabat al-alfaz, both apparently lost — and promises a further study of apparent synonyms, probably the Durrat al-ta'wil {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390}."
  ur: "راغب اصفہانی نے قرآنی الفاظ کا حروف تہجی پر مرتب معجم «مفردات الفاظ القرآن» اپنی قرآنی تصانیف کے سلسلے میں تحریر کیا؛ اس کے مقدمے میں وہ اپنے دو سابقہ رسائل — «رسالہ منبہہ علی فوائد القرآن» اور «رسالہ فی القوانین الدالہ علی تحقیق مناسبات الفاظ» — کا ذکر کرتے ہیں جو بظاہر گم گشتہ ہیں، اور متشابہ الفاظ پر مزید کتاب کا وعدہ کرتے ہیں جو غالباً «درۃ التاویل» ہے {cite:encyclopaedia-of-islam-2 vol. 8 pp. 389-390}۔"
