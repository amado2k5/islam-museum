label: { ar: "قتل يزيد بن أبي مسلم بمصلاه", en: "The Killing of Yazid ibn Abi Muslim in His Prayer-Place" }
summary:
  ar: "عند البلاذري: لما ولّى يزيد بن عبد الملك ولّى يزيد بن أبي مسلم مولى الحجاج بن يوسف إفريقية والمغرب فقدم إفريقية في سنة اثنتين ومائة وكان حرسه البربر فوسم كل امرئ منهم على يده «حرسي» فسوّد سيرته فدبّ بعضهم إلى بعض وتضافروا على قتله فخرج ذات عشية لصلاة المغرب فقتلوه في مصلاه؛ فولّى يزيد بشر بن صفوان الكلبي فضرب عنق عبد الله بن موسى بن نصير وذلك أنه اتّهم بقتله وتأليب الناس عليه."
  en: "In al-Baladhuri: when Yazid ibn Abd al-Malik ruled he gave Yazid ibn Abi Muslim — al-Hajjaj ibn Yusuf's mawla — Ifriqiya and the Maghreb; he came to Ifriqiya in year 102, his guard being Berbers, and he branded on each man's hand 'my guard' — so they blackened his path, whispered one to another, and conspired to kill him: he went out one evening for maghrib prayer and they killed him in his prayer-place. Yazid then gave it to Bishr ibn Safwan al-Kalbi, who struck off the neck of Abdallah ibn Musa ibn Nusayr — he being accused of the killing and of stirring the people against him."
