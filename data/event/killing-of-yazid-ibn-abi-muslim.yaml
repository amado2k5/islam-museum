label: { ar: "قتل يزيد بن أبي مسلم بمصلاه", en: "The Killing of Yazid ibn Abi Muslim in His Prayer-Place", es: "El asesinato de Yazid ibn Abi Muslim en su lugar de oración.", fr: "L'assassinat de Yazid ibn Abi Muslim dans son lieu de prière", ur: "یزید بن ابی مسلم کا اس کی نماز گاہ میں قتل", tr: "Yezid ibn Abi Müslim namaz kılarken öldürüldü.", id: "Yazid bin Abi Muslim terbunuh di tempat shalatnya." }
summary:
  ar: "عند البلاذري: لما ولّى يزيد بن عبد الملك ولّى يزيد بن أبي مسلم مولى الحجاج بن يوسف إفريقية والمغرب فقدم إفريقية في سنة اثنتين ومائة وكان حرسه البربر فوسم كل امرئ منهم على يده «حرسي» فسوّد سيرته فدبّ بعضهم إلى بعض وتضافروا على قتله فخرج ذات عشية لصلاة المغرب فقتلوه في مصلاه؛ فولّى يزيد بشر بن صفوان الكلبي فضرب عنق عبد الله بن موسى بن نصير وذلك أنه اتّهم بقتله وتأليب الناس عليه."
  en: "In al-Baladhuri: when Yazid ibn Abd al-Malik ruled he gave Yazid ibn Abi Muslim — al-Hajjaj ibn Yusuf's mawla — Ifriqiya and the Maghreb; he came to Ifriqiya in year 102, his guard being Berbers, and he branded on each man's hand 'my guard' — so they blackened his path, whispered one to another, and conspired to kill him: he went out one evening for maghrib prayer and they killed him in his prayer-place. Yazid then gave it to Bishr ibn Safwan al-Kalbi, who struck off the neck of Abdallah ibn Musa ibn Nusayr — he being accused of the killing and of stirring the people against him."
  es: "En al-Baladhuri: cuando Yazid ibn Abd al-Malik gobernaba, le dio a Yazid ibn Abi Muslim —al-Hajjaj ibn Yusuf— Ifriqiya y el Magreb; llegó a Ifriqiya en el año 102, con su guardia compuesta por bereberes, y marcó en la mano de cada uno de ellos \"mi guardia\" —así que le ennegrecieron el camino, susurraron entre ellos y conspiraron para matarlo: salió una tarde para la oración del Magreb y lo mataron en su lugar de oración. Entonces Yazid se lo dio a Bishr ibn Safwan al-Kalbi, quien degolló a Abdallah ibn Musa ibn Nusayr —acusándolo del asesinato y de incitar al pueblo contra él."
  fr: "Dans al-Baladhuri: lorsque Yazid ibn Abd al-Malik régnait, il confia l'Ifriqiya et le Maghreb à Yazid ibn Abi Muslim, le mawla d'al-Hajjaj ibn Yusuf. Ce dernier arriva en Ifriqiya en l'an 102, accompagné de Berbères qui marquèrent au fer rouge la main de chacun d'eux avec l'inscription « ma garde ». Ils lui mirent alors des bâtons dans les roues, murmurèrent entre eux et complotèrent pour l'assassiner. Un soir, alors qu'il se rendait à la prière du maghrib, ils le tuèrent sur son lieu de prière. Yazid confia ensuite le pouvoir à Bishr ibn Safwan al-Kalbi, qui fit égorger Abdallah ibn Musa ibn Nusayr. Ce dernier fut accusé du meurtre et d'incitation à la révolte."
  ur: "البلادوری میں ہے: جب یزید بن عبد الملک نے حکومت کی تو اس نے یزید ابن ابی مسلم کو الحجاج ابن یوسف کا مولا عفریقیہ اور مغرب دیا۔ وہ سنہ 102 میں عفریقیہ آیا، اس کا محافظ بربر تھا، اور اس نے ہر ایک کے ہاتھ پر 'میرا محافظ' کا نشان لگایا - چنانچہ انہوں نے اس کا راستہ سیاہ کر دیا، ایک دوسرے سے سرگوشی کی، اور اسے قتل کرنے کی سازش کی: وہ ایک شام مغرب کی نماز کے لیے نکلا اور اس کی جائے نماز میں اسے قتل کر دیا۔ یزید نے پھر اسے بشر بن صفوان الکلبی کو دے دیا، جس نے عبداللہ بن موسیٰ بن نصیر کی گردن مار دی تھی - اس پر قتل اور اس کے خلاف لوگوں کو اکسانے کا الزام تھا۔"
  tr: "El-Baladhuri'ye göre: Yezid ibn Abdülmalik, Haccac ibn Yusuf'un azatlı kölesi Yezid ibn Abi Müslim'i İfrikya ve Mağrip'e atadığında, Yezid 102 yılında İfrikya'ya vardı. Muhafızları Berberiydi, bu yüzden her birinin eline \"muhafız\" kelimesini damgalayarak itibarını zedeledi. Bazıları birbirlerine yaklaşarak onu öldürmek için komplo kurdular. Bir akşam Maghrib namazını kılmak için dışarı çıktı ve onu namaz kıldığı yerde öldürdüler. Yezid daha sonra, Abdullah ibn Musa ibn Nusayr'ı öldürmek ve insanları ona karşı kışkırtmakla suçlanan Bişr ibn Safvan el-Kalbi'yi görevlendirdi ve o da Abdullah ibn Musa ibn Nusayr'ın başını kesti."
  id: "Menurut Al-Baladhuri: Ketika Yazid ibn Abd al-Malik menunjuk Yazid ibn Abi Muslim, budak yang dibebaskan oleh Al-Hajjaj ibn Yusuf, ke Ifriqiya dan Maghreb, ia tiba di Ifriqiya pada tahun 102. Para pengawalnya adalah orang Berber, sehingga ia memberi cap pada tangan masing-masing pengawalnya dengan kata \"pengawal,\" sehingga menodai reputasinya. Beberapa dari mereka saling mendekati dan bersekongkol untuk membunuhnya. Suatu malam ia keluar untuk melaksanakan salat Maghrib, dan mereka membunuhnya di tempat salatnya. Yazid kemudian menunjuk Bishr ibn Safwan al-Kalbi, yang memenggal kepala Abdullah ibn Musa ibn Nusayr, karena ia dituduh membunuhnya dan menghasut orang-orang untuk melawannya."
