label: { ar: "تلقيب يوسف بن تاشفين بأمير المسلمين", en: "Yusuf ibn Tashfin Given the Title Amir al-Muslimin", es: "Yusuf ibn Tashfin recibió el título de Amir al-Muslimin.", fr: "Yusuf ibn Tashfin reçut le titre d'Amir al-Muslimin", ur: "یوسف بن تاشفین کو امیر المسلمین کا لقب دیا گیا۔" }
summary:
  ar: "في سنة تسع وسبعين أرسل يوسف بن تاشفين صاحب سبتة ومراكش إلى المقتدي يطلب أن يسلطنه وأن يقلده ما بيده من البلاد فبعث إليه الخلع والأعلام والتقليد ولقبه بأمير المسلمين ففرح بذلك وسر به فقهاء المغرب وهو الذي أنشأ مدينة مراكش {cite:tarikh-khulafa-minhaj-1434 p. 652}."
  en: "In 479 Yusuf ibn Tashfin, lord of Sabta and Marrakesh, asked al-Muqtadi to make him sultan and invest him with the lands he held; the robes, banners and deed were sent with the title amir al-muslimin — the Maghreb's jurists rejoiced. He is the founder of Marrakesh {cite:tarikh-khulafa-minhaj-1434 p. 652}."
  es: "En el año 479, Yusuf ibn Tashfin, señor de Sabta y Marrakech, pidió a al-Muqtadi que lo nombrara sultán y le otorgara las tierras que poseía; se le enviaron las vestiduras, los estandartes y el acta con el título de amir al-muslimin, lo que fue recibido con júbilo por los juristas del Magreb. Se le considera el fundador de Marrakech {cite:tarikh-khulafa-minhaj-1434 p. 652}."
  fr: "En 479, Yusuf ibn Tashfin, seigneur de Sabta et de Marrakech, demanda à al-Muqtadi de le nommer sultan et de lui conférer les terres qu'il possédait; les vêtements, les bannières et l'acte de donation lui furent envoyés avec le titre d'émir des musulmans – les juristes du Maghreb s'en réjouirent. Il est le fondateur de Marrakech (voir: Tarikh-Khulafa-Minhaj-1434, p. 652)."
  ur: "479 میں سبطہ اور مراکش کے مالک یوسف بن تاشفین نے مقتدی سے کہا کہ وہ اسے سلطان بنائے اور اس کی زمینوں میں سرمایہ کاری کرے۔ لباس، بینرز اور اعمال نامے امیر المسلیمین کے ساتھ بھیجے گئے - مغرب کے فقہاء نے خوشی کا اظہار کیا۔ وہ مراکش کے بانی ہیں۔ 652}۔"
