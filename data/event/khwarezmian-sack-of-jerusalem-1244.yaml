  id: "Catatan awal tentang jatuhnya Yerusalem pada tahun 1244 M, ketika Dinasti Khwarazmia, yang bersekutu dengan Dinasti Ayyubiyah, merebutnya kembali dari bangsa Frank; sumber-sumber yang tercantum di halaman ini belum ditinjau."
