label: { ar: "غزو المهلب ثغر الهند وتحذيف الخيل", en: "al-Muhallab's Frontier Raid and the First Horse-Trimming", es: "La incursión fronteriza de al-Muhallab y el primer recorte de caballos", fr: "Le raid frontalier d'al-Muhallab et le premier parage de chevaux", ur: "المحلب کی سرحدی چھاپہ اور پہلا گھوڑا تراشنا", tr: "El-Muhallab'ın Hindistan sınırını işgali ve at eğitimi", id: "Invasi Al-Muhallab ke perbatasan India dan pelatihan kuda" }
summary:
  ar: "غزا ثغر الهند المهلب بن أبي صفرة في أيام معاوية سنة ٤٤ فأتى بنه والأهوار وهما بين الملتان وكابل فلقيه العدو فقاتله ومن معه ولقي المهلب ببلاد القيقان ثمانية عشر فارساً من الترك على خيل محذوفة فقاتلوه فقتلوا جميعاً فقال المهلب ما جعل هؤلاء الأعاجم أولى بالتشمير منا فحذف الخيل فكان أول من حذفها من المسلمين."
  en: "In 44h al-Muhallab ibn Abi Sufra raided the Indian frontier to Banna and the marshes between Multan and Kabul; at al-Qiqan eighteen Turkish riders on docked horses fought him and died — 'why are these Ajam readier to cut short than us?' — and he trimmed his own mounts, the first Muslim to do so."
  es: "En el año 44h, al-Muhallab ibn Abi Sufra asaltó la frontera india hasta Banna y los pantanos entre Multan y Kabul; en al-Qiqan, dieciocho jinetes turcos en caballos con las patas cortadas lucharon contra él y murieron —«¿Por qué estos Ajam están más dispuestos a cortar las patas que nosotros?»— y él mismo cortó las patas de sus monturas, siendo el primer musulmán en hacerlo."
  fr: "En 44 heures, al-Muhallab ibn Abi Sufra a mené un raid sur la frontière indienne jusqu'à Banna et les marais entre Multan et Kaboul; à al-Qiqan, dix-huit cavaliers turcs sur des chevaux à la queue coupée l'ont combattu et sont morts — « pourquoi ces Ajam sont-ils plus prompts à couper court que nous ? » — et il a taillé ses propres montures, le premier musulman à le faire."
  ur: "44ھ میں المحلب ابن ابی صفرہ نے ہندوستانی سرحد پر بنہ اور ملتان اور کابل کے درمیان دلدل پر حملہ کیا۔ الققان میں 18 ترک سواروں نے ان کا مقابلہ کیا اور وہ مر گئے - 'یہ عجم ہم سے کم تر کیوں ہیں؟' - اور اس نے اپنے پہاڑوں کو تراش لیا، ایسا کرنے والا پہلا مسلمان۔"
  tr: "Muhammed ibn Ebu Sufra, M.S. 44 yılında Muaviye döneminde Hindistan sınırına saldırdı. Multan ile Kabil arasında bulunan Binah ve bataklıklara geldi. Düşman onu ve yanındakileri karşıladı ve onlarla savaştı. Muhammed ibn Ebu Sufra, Kaykan topraklarında hızlı atlara binmiş on sekiz Türk süvarisiyle karşılaştı. Onlarla savaştı ve hepsini öldürdü. Muhammed ibn Ebu Sufra, \"Bu yabancıları bizden daha hazırlıklı kılan neydi?\" dedi. Bunun üzerine atlarını hızlandırdı ve Müslümanlar arasında atlarını hızlandıran ilk kişi oldu."
  id: "Al-Muhallab ibn Abi Sufra menyerbu perbatasan India pada masa Muawiyah pada tahun 44. Ia sampai di Binah dan rawa-rawa yang terletak di antara Multan dan Kabul. Musuh menemuinya dan melawannya beserta orang-orang yang bersamanya. Al-Muhallab bertemu dengan delapan belas penunggang kuda Turki dengan kuda-kuda cepat di tanah Qayqan. Mereka melawannya dan membunuh mereka semua. Al-Muhallab berkata, “Apa yang membuat orang asing ini lebih layak untuk bersiap daripada kita?” Maka ia membuat kuda-kudanya cepat, dan ia adalah orang Muslim pertama yang membuat kuda-kuda itu cepat."
