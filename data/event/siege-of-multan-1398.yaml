kind: siege
label: { ar: "حصار بير محمد بن جهانكير الملتان ٨٠١هـ", en: "Pir Muhammad's six-month siege of Multan, 801/1398", es: "El asedio de seis meses de Pir Muhammad a Multan, 801/1398", fr: "Le siège de Multan par Pir Muhammad, qui dura six mois, en 801/1398", ur: "پیر محمد کا ملتان کا چھ ماہ کا محاصرہ، 801/1398", tr: "Multanlı Pir Muhammed ibn Cihangir'in kuşatması, Hicri 801", id: "Pengepungan Pir Muhammad ibn Jahangir dari Multan, 801 H" }
summary:
  ar: "لما اجتاح تيمور لنك بلاد الهند سنة ١٣٩٨-١٣٩٩م حاصر حفيده بير محمد بن جهانكير الملتان ستة أشهر حتى أخذها، وجاء في أعقاب الغزو أن صارت الملتان في قبضة خضر خان مؤسس دولة السيديين القصيرة بدلهي {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  en: "When Timur Lang swept into India in 1398-9 his grandson Pir Muhammad ibn Jahangir besieged Multan for six months until it fell; in the invasion's wake the city came under Khidr Khan, founder of the short-lived Sayyid dynasty of Delhi {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  ur: "جب 1398-99ء میں تیمور لنگ ہندوستان میں داخل ہوا تو اس کے پوتے پیر محمد بن جہانگیر نے ملتان کا چھ ماہ کا محاصرہ کیا یہاں تک کہ شہر گر گیا؛ اس حملے کے بعد شہر خضر خان کے زیر اثر آیا، جو دہلی کی عارضی سید سلطنت کا بانی بنا {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}۔"
  es: "Cuando Timur Lang irrumpió en la India en 1398-9, su nieto Pir Muhammad ibn Jahangir sitió Multan durante seis meses hasta que cayó; tras la invasión, la ciudad quedó bajo el dominio de Khidr Khan, fundador de la efímera dinastía Sayyid de Delhi {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  fr: "Lorsque Timur Lang a déferlé sur l'Inde en 1398-9, son petit-fils Pir Muhammad ibn Jahangir a assiégé Multan pendant six mois jusqu'à sa chute; à la suite de l'invasion, la ville est passée sous le contrôle de Khidr Khan, fondateur de la dynastie Sayyid éphémère de Delhi {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  tr: "Timur Lenk 1398-1399 yıllarında Hindistan'ı işgal ettiğinde, torunu Pir Muhammed bin Cihangir Multan'ı altı ay boyunca kuşattı ve sonunda ele geçirdi. İşgalin ardından Multan, Delhi'deki kısa ömürlü Seyyid hanedanlığının kurucusu Hızır Han'ın eline geçti. {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}"
  id: "Ketika Timur Lenk menginvasi India pada tahun 1398-1399 M, cucunya Pir Muhammad bin Jahangir mengepung Multan selama enam bulan hingga akhirnya merebutnya. Setelah invasi tersebut, Multan jatuh ke tangan Khidr Khan, pendiri dinasti Sayyid yang berumur pendek di Delhi. {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
