summary:
  ar: "لما اجتاح تيمور لنك بلاد الهند سنة ١٣٩٨-١٣٩٩م حاصر حفيده بير محمد بن جهانكير الملتان ستة أشهر حتى أخذها، وجاء في أعقاب الغزو أن صارت الملتان في قبضة خضر خان مؤسس دولة السيديين القصيرة بدلهي {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  en: "When Timur Lang swept into India in 1398-9 his grandson Pir Muhammad ibn Jahangir besieged Multan for six months until it fell; in the invasion's wake the city came under Khidr Khan, founder of the short-lived Sayyid dynasty of Delhi {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}."
  ur: "جب 1398-99ء میں تیمور لنگ ہندوستان میں داخل ہوا تو اس کے پوتے پیر محمد بن جہانگیر نے ملتان کا چھ ماہ کا محاصرہ کیا یہاں تک کہ شہر گر گیا؛ اس حملے کے بعد شہر خضر خان کے زیر اثر آیا، جو دہلی کی عارضی سید سلطنت کا بانی بنا {cite:encyclopaedia-of-islam-2 vol. 7 p. 603}۔"
