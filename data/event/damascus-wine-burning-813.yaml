summary:
  ar: "في ليلة الحادي والعشرين من محرم سنة ثلاث عشرة وثمان مئة اجتمع رجلان من العوام بدمشق فشربا الخمر فأصبحا محروقين ولم يوجد بينهما نار ولا أثر حريق في غير بدنهما وبعض ثيابهما وقد مات أحدهما وفي الآخر رمق فأقبل الناس أفواجاً إلى رؤيتهما والاعتبار بحالهما {cite:shadharat-dhahab p. 100}."
  en: "On the night of 21 Muharram 813 two commoners met in Damascus and drank wine; at dawn they were found burnt, no fire found between them nor trace of burning beyond their bodies and some of their clothes — one dead, the other with breath left — and the people came in throngs to see them and take warning {cite:shadharat-dhahab p. 100}."
