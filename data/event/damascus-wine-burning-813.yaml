label: { ar: "احتراق شاربي الخمر بدمشق سنة 813هـ", en: "The Burning of Wine-Drinkers in Damascus in 813 AH", es: "La quema de bebedores de vino en Damasco en el año 813 d. C.", fr: "Le bûcher des buveurs de vin à Damas en 813 AH", ur: "813 ہجری میں دمشق میں شراب پینے والوں کو جلانا", tr: "Hicri 813 yılında Şam'da şarap içenlerin yakılması", id: "Pembakaran para peminum anggur di Damaskus pada tahun 813 Hijriah" }
summary:
  ar: "في ليلة الحادي والعشرين من محرم سنة ثلاث عشرة وثمان مئة اجتمع رجلان من العوام بدمشق فشربا الخمر فأصبحا محروقين ولم يوجد بينهما نار ولا أثر حريق في غير بدنهما وبعض ثيابهما وقد مات أحدهما وفي الآخر رمق فأقبل الناس أفواجاً إلى رؤيتهما والاعتبار بحالهما {cite:shadharat-dhahab p. 100}."
  en: "On the night of 21 Muharram 813 two commoners met in Damascus and drank wine; at dawn they were found burnt, no fire found between them nor trace of burning beyond their bodies and some of their clothes — one dead, the other with breath left — and the people came in throngs to see them and take warning {cite:shadharat-dhahab p. 100}."
  es: "En la noche del 21 de Muharram de 813, dos plebeyos se reunieron en Damasco y bebieron vino; al amanecer los encontraron quemados, sin rastro de fuego entre ellos ni rastro de quemaduras más allá de sus cuerpos y algunas de sus ropas —uno muerto, el otro con vida— y la gente acudió en masa para verlos y tomar nota {cita: shadharat-dhahab p. 100}."
  fr: "Dans la nuit du 21 Muharram 813, deux gens du peuple se rencontrèrent à Damas et burent du vin; à l'aube, on les trouva brûlés, aucune trace de feu entre eux ni de brûlure au-delà de leurs corps et de certains de leurs vêtements — l'un mort, l'autre encore en vie — et les gens vinrent en foule pour les voir et prendre garde {cite:shadharat-dhahab p. 100}."
  ur: "21 محرم 813 کی رات دمشق میں دو عام آدمی ملے اور شراب پی۔ فجر کے وقت وہ جلے ہوئے پائے گئے، ان کے درمیان کوئی آگ نظر نہیں آئی اور نہ ہی ان کے جسموں اور ان کے کپڑوں سے پرے جلنے کا نشان تھا - ایک مردہ، دوسرا سانس کے ساتھ رہ گیا - اور لوگ ان کو دیکھنے اور تنبیہ کرنے کے لیے بڑی تعداد میں آئے۔ 100}۔"
  tr: "813 yılının Muharrem ayının yirmi birinci gecesi, Şam'dan iki sıradan adam buluşup şarap içtiler ve sabahleyin yanmış halde bulundular. Aralarında hiçbir ateş kalmamıştı ve bedenleri ile bazı giysileri dışında hiçbir yanık izi yoktu. Birisi ölmüş, diğeri ise hayattaydı. Bunun üzerine insanlar onları görmek ve durumlarını incelemek için akın akın geldiler. {Kaynak: Şadharat-dahab s. 100}"
  id: "Pada malam tanggal dua puluh satu Muharram tahun delapan ratus tiga belas, dua orang biasa dari Damaskus bertemu dan minum anggur, dan pada pagi harinya mereka terbakar, dan tidak ada api di antara mereka, atau jejak terbakar, kecuali pada tubuh mereka dan sebagian pakaian mereka. Salah seorang dari mereka telah meninggal, dan yang lainnya masih hidup. Maka orang-orang berdatangan untuk melihat mereka dan mempertimbangkan keadaan mereka. {cite:shadharat-dhahab p. 100}."
