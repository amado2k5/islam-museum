id: event/the-fight-at-the-lane-gate-and-the-cutting-of-the-palms-of-banu-khuthaym-292
class: event
kind: other
label:
  ar: "القتال عند باب الدرب وقطع نخيل بني خثيمة وطلب أمان نجران، ص293-294"
  en: "The fight at the lane gate, the cutting of the palms of Banu Khuthaym and the elders' plea for safety, pp. 293-294"
  ur: "دروازہ گلی پر لڑائی، بنو خثیمہ کی کھجوریں کاٹنا اور نجران کے بزرگوں کی امان کی درخواست، ص293-294"
  es: "La lucha en la puerta del callejón, el corte de las palmas de las manos de Banu Khuthaym y la súplica de los ancianos por seguridad, págs. 293-294"
  fr: "Le combat à la porte de la ruelle, la coupe des paumes de Banu Khuthaym et le plaidoyer des anciens pour la sécurité, pp. 293-294"
  tr: "Bab el-Darb'daki çatışmalar, Beni Huthayme'nin hurma ağaçlarının kesilmesi ve Necran'dan koruma talebi, s. 293-294"
  id: "Pertempuran di Bab al-Darb, penebangan pohon kurma Bani Khuthaymah, dan permohonan perlindungan dari Najran, hlm. 293-294"
summary:
  ar: "دنا الهادي من الدرب فاقتتلوا ساعة ومات من بني الحارث ثمانية وبلغ عدّ المصابين مئة وسبعين، ثم أغلقوا الباب، فوجّه عسكراً إلى بني خثيمة يقطع نخيلهم، فأرسلوا مشايخ من نجران فيهم عاقل بن عبد الله يطلبون الأمان فوعدهم موعداً جميلاً واستنظروه يومين."
  en: "Al-Hadi drew near the lane and they fought an hour; eight of Banu al-Harith died and a count of the stricken reached one hundred and seventy; they then shut the gate, so he sent troops to cut the palms of Banu Khuthaym, who sent elders of Najran, among them Aqil ibn Abdallah, to ask for safety, and he promised well and gave them two days."
  ur: "ہادی گلی کے قریب پہنچے اور ایک ساعت لڑائی ہوئی؛ بنو حارث کے آٹھ مرے اور زخمیوں کی گنتی ایک سو ستر تک پہنچی؛ پھر انہوں نے دروازہ بند کر لیا تو ہادی نے بنو خثیمہ کی کھجوریں کاٹنے کے لیے لشکر بھیجا، انہوں نے نجران کے بزرگ بھیجے جن میں عاقل بن عبداللہ تھے تاکہ امان مانگیں، ہادی نے اچھا وعدہ کیا اور انہیں دو دن کی مہلت دی۔"
  es: "Al-Hadi se acercó al camino y lucharon durante una hora; murieron ocho de Banu al-Harith y el número de heridos llegó a ciento setenta; luego cerraron la puerta, así que envió tropas para cortar las palmas de las manos de Banu Khuthaym, quienes enviaron ancianos de Najran, entre ellos Aqil ibn Abdallah, para pedir protección, y él les prometió buena suerte y les dio dos días."
  fr: "Al-Hadi s'approcha de la ruelle et ils se battirent pendant une heure; huit des Banu al-Harith moururent et le nombre de victimes atteignit cent soixante-dix; ils fermèrent alors la porte, alors il envoya des troupes couper les palmiers des Banu Khuthaym, qui envoyèrent des anciens de Najran, parmi lesquels Aqil ibn Abdallah, pour demander la sécurité, et il leur fit de bonnes promesses et leur accorda deux jours."
  tr: "El-Hadi yola yaklaştı ve bir saat boyunca savaştılar. Beni el-Harith'ten sekiz kişi öldü ve yaralıların sayısı yüz yetmişe ulaştı. Sonra kapıyı kapattılar, bu yüzden o da Beni Huthayme'ye hurma ağaçlarını kesmeleri için bir ordu gönderdi. Onlar da Najran'dan, aralarında Akil bin Abdullah'ın da bulunduğu şeyhler göndererek güvenlik istediler, o da onlara iyi bir randevu sözü verdi ve onlar da iki gün onu beklediler."
  id: "Al-Hadi mendekati jalan dan mereka bertempur selama satu jam. Delapan orang dari Bani al-Harith tewas, dan jumlah yang terluka mencapai seratus tujuh puluh orang. Kemudian mereka menutup pintu, lalu ia mengirim pasukan ke Bani Khuthaymah untuk menebang pohon kurma mereka. Mereka mengirim para syekh dari Najran, di antaranya Aqil bin Abdullah, untuk meminta perlindungan, lalu ia menjanjikan mereka pertemuan yang baik dan mereka menunggunya selama dua hari."
