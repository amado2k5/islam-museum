id: event/siege-of-babylon-fortress-640
class: event
kind: siege
label:
  ar: حصار حصن بابليون (٦٤٠)
  en: Siege of Babylon Fortress
  ur: قلعۂ بابلیون کا محاصرہ (640ء)
summary:
  ar: حصار عمرو بن العاص للحصن الذي يسمى بابليون، وهو القصر الذي صار في قلب الفسطاط. يذكر ابن عبد الحكم أن الفرس ابتدأوا بناءه وأتمه الروم، وأن عمراً أقام على بابه سبعة أشهر في رواية وشهراً في أخرى، حتى صعد الزبير بن العوام سلّماً وكبّر ففتح الباب، وخرج المقوقس وأعيان القبط إلى الجزيرة {cite:futuh-misr-amir-1999 p. 52} {cite:futuh-misr-amir-1999 p. 94} {cite:futuh-misr-amir-1999 p. 95} {cite:futuh-misr-amir-1999 p. 96}.
  en: Amr ibn al-As's siege of the fortress called Babylon, the Qasr that later stood at the heart of al-Fustat. Ibn Abd al-Hakam reports that the Persians began it and the Romans completed it, that Amr sat at its gate for seven months in one account and a month in another, until al-Zubayr ibn al-Awwam climbed a ladder, cried the takbir and opened the gate, while al-Muqawqis and the Coptic notables withdrew to the Island {cite:futuh-misr-amir-1999 p. 52} {cite:futuh-misr-amir-1999 p. 94} {cite:futuh-misr-amir-1999 p. 95} {cite:futuh-misr-amir-1999 p. 96}.
  ur: عمرو بن العاص کا اس قلعے کا محاصرہ جسے بابلیون کہا جاتا تھا، یعنی وہ قصر جو بعد میں فسطاط کے بیچ میں رہا۔ ابن عبد الحکم کے مطابق اس کی تعمیر فارسیوں نے شروع کی اور رومیوں نے مکمل کی؛ عمرو ایک روایت میں سات مہینے اور دوسری میں ایک مہینہ اس کے دروازے پر رہے، یہاں تک کہ زبیر بن العوام سیڑھی سے چڑھے، تکبیر کہی اور دروازہ کھول دیا، اور مقوقس اور قبطی سردار جزیرہ کی طرف نکل گئے {cite:futuh-misr-amir-1999 p. 52} {cite:futuh-misr-amir-1999 p. 94} {cite:futuh-misr-amir-1999 p. 95} {cite:futuh-misr-amir-1999 p. 96}۔
