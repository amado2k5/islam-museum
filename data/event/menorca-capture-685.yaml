label:
  ar: سقوط منورقة في يد طاغية برشلونة
  en: The fall of Minorca to the lord of Barcelona
summary:
  ar: "في سنة 685هـ وكب طاغية برشلونة إلى جزيرة منورقة في أساطيله في عشرين ألفاً من الرجال المقاتلة، ومروا بها كأنهم سفر من التجار وطلبوا النزول للاستسقاء فأذن لهم أبو عمر بن حكم رئيسها، فلما تساحلوا أعلنوا الحرب وتزاحم الجيش ثلاثاً يُثخن فيهم المسلمون في كلها بالآلاف والطاغية قاعد عن الزحف، فلما كان اليوم الثالث زحف في العسكر فانهزم المسلمون وانحصروا في كعاب القلعة، وعقدوا لابن حكم ذمة في أهله وحاشيته فخرجوا إلى سبتة ونزل الباقون على حكم العدو."
  en: "In 685 AH the lord of Barcelona swept onto the island of Minorca with twenty thousand fighting men in his fleet, approaching as if a merchant convoy and asking leave to water, which the ruler Abu Umar ibn Hakam granted; once ashore they declared war, and three times the Muslims repulsed them with losses in the thousands while the tyrant sat back — until the third day he joined the assault, the Muslims broke into the citadel's keep, contracted safe-conduct for Ibn Hakam's family and retinue who sailed to Ceuta, and the rest submitted to the enemy's rule."
