id: event/menorca-capture-685
class: event
kind: conquest
label:
  ar: سقوط منورقة في يد طاغية برشلونة
  en: The fall of Minorca to the lord of Barcelona
  es: "La caída de Menorca en manos del señor de Barcelona."
  fr: "La chute de Minorque aux mains du seigneur de Barcelone"
  ur: "بارسلونا کے مالک کو منورکا کا زوال"
  tr: "Menorca, Barselona'nın tiranının eline düştü."
  id: "Menorca jatuh ke tangan tiran Barcelona."
summary:
  ar: "في سنة 685هـ وكب طاغية برشلونة إلى جزيرة منورقة في أساطيله في عشرين ألفاً من الرجال المقاتلة، ومروا بها كأنهم سفر من التجار وطلبوا النزول للاستسقاء فأذن لهم أبو عمر بن حكم رئيسها، فلما تساحلوا أعلنوا الحرب وتزاحم الجيش ثلاثاً يُثخن فيهم المسلمون في كلها بالآلاف والطاغية قاعد عن الزحف، فلما كان اليوم الثالث زحف في العسكر فانهزم المسلمون وانحصروا في كعاب القلعة، وعقدوا لابن حكم ذمة في أهله وحاشيته فخرجوا إلى سبتة ونزل الباقون على حكم العدو."
  en: "In 685 AH the lord of Barcelona swept onto the island of Minorca with twenty thousand fighting men in his fleet, approaching as if a merchant convoy and asking leave to water, which the ruler Abu Umar ibn Hakam granted; once ashore they declared war, and three times the Muslims repulsed them with losses in the thousands while the tyrant sat back — until the third day he joined the assault, the Muslims broke into the citadel's keep, contracted safe-conduct for Ibn Hakam's family and retinue who sailed to Ceuta, and the rest submitted to the enemy's rule."
  es: "En el año 685 de la Hégira, el señor de Barcelona irrumpió en la isla de Menorca con una flota de veinte mil hombres de guerra, acercándose como si fuera un convoy mercante y pidiendo permiso para desembarcar, que el gobernante Abu Umar ibn Hakam concedió. Una vez en tierra, declararon la guerra, y en tres ocasiones los musulmanes los rechazaron con pérdidas de miles de hombres mientras el tirano permanecía impasible, hasta que al tercer día se unió al asalto. Los musulmanes irrumpieron en la fortaleza de la ciudadela, concedieron salvoconducto a la familia y el séquito de Ibn Hakam, que navegaron hasta Ceuta, y el resto se sometió al dominio del enemigo."
  fr: "En 685 AH, le seigneur de Barcelone débarqua sur l'île de Minorque avec une flotte de vingt mille hommes, s'approchant comme un convoi marchand et demandant la permission de débarquer, ce que le souverain Abu Umar ibn Hakam leur accorda. Une fois à terre, ils déclarèrent la guerre et, à trois reprises, les musulmans les repoussèrent avec des pertes de plusieurs milliers d'hommes, tandis que le tyran restait passif. Le troisième jour, il se joignit à l'assaut, les musulmans pénétrèrent dans le donjon de la citadelle, obtinrent un sauf-conduit pour la famille et la suite d'Ibn Hakam qui firent voile vers Ceuta, et le reste se soumit à l'autorité ennemie."
  ur: "685 ہجری میں بارسلونا کا بادشاہ اپنے بحری بیڑے میں بیس ہزار لڑاکا جوانوں کے ساتھ جزیرے منورکا پر چڑھا، گویا کوئی تجارتی قافلہ قریب آیا اور پانی کی رخصت مانگ رہا ہے، جسے حکمران ابو عمر بن حکم نے دے دیا۔ ایک بار ساحل پر انہوں نے جنگ کا اعلان کیا، اور تین بار مسلمانوں نے انہیں ہزاروں میں نقصان پہنچا کر پسپا کیا جب کہ ظالم پیچھے بیٹھا - تیسرے دن تک وہ حملہ میں شامل ہوا، مسلمانوں نے قلعہ کے قلعے میں گھس لیا، ابن حکم کے خاندان اور سیوٹا جانے والے سپاہیوں سے حفاظت کا معاہدہ کیا، اور باقی نے دشمن کی حکمرانی کے حوالے کردیا۔"
  tr: "Hicri 685 yılında, Barselona tiranı yirmi bin savaşçıdan oluşan filosuyla Menorka adasına geldi. Tüccar yolcuları gibi adanın yanından geçtiler ve yağmur için karaya çıkmak istediler. Liderleri Ebu Ömer İbn Hakam onlara izin verdi. Kıyıya ulaştıklarında savaş ilan ettiler ve ordu üç gün boyunca çatıştı; Müslümanlar her gün binlerce kayıp verdirdi, tiran ise yerinde oturup ilerlemedi. Üçüncü gün ordusuyla ilerledi ve Müslümanlar yenilgiye uğrayarak kalenin dış mahallelerine hapsedildi. İbn Hakam ile ailesi ve maiyeti hakkında bir anlaşma yaptılar, böylece Ceuta'ya gittiler ve geri kalanlar düşmanın yönetimine boyun eğdiler."
  id: "Pada tahun 685 H, penguasa Barcelona datang ke pulau Menorca dengan armadanya yang terdiri dari dua puluh ribu prajurit. Mereka melewati pulau itu seolah-olah mereka adalah para pedagang dan meminta izin untuk turun karena hujan. Abu Omar Ibn Hakam, pemimpin mereka, memberi mereka izin. Ketika mereka sampai di pantai, mereka menyatakan perang, dan pasukan bertempur selama tiga hari, dengan kaum Muslimin menimbulkan kerugian besar pada mereka di setiap pertempuran hingga ribuan jiwa, sementara penguasa tetap duduk dan tidak maju. Pada hari ketiga, ia maju dengan pasukannya, dan kaum Muslimin dikalahkan dan terkepung di pinggiran benteng. Mereka membuat perjanjian dengan Ibn Hakam mengenai keluarga dan rombongannya, sehingga mereka pergi ke Ceuta, dan sisanya tunduk pada kekuasaan musuh."
