id: event/ibn-al-mulaqqin-mihna-780
class: event
kind: persecution
label:
  ar: "محنة ابن الملقن في قضية بركة وبرقوق، ربيع الآخر ٧٨٠هـ"
  en: "Ibn al-Mulaqqin's ordeal in the Baraka–Barquq affair, Rabi' II 780/1378"
  ur: "برکہ اور برقوق کے معاملے میں ابن ملقن کی آزمائش، ربیع الآخر 780ھ/1378ء"
  es: "La terrible experiencia de Ibn al-Mulaqqin en el asunto Baraka-Barquq, Rabi' II 780/1378"
  fr: "L'épreuve d'Ibn al-Mulaqqin dans l'affaire Baraka-Barquq, Rabi' II 780/1378"
  tr: "İbn el-Mulakkin'in Baraka ve Barquq davasındaki çilesi, Rebiü'l-Sani, Hicri 780"
  id: "Kisah penderitaan Ibnu al-Mulaqqin dalam kasus Baraka dan Barquq, Rabi' al-Thani 780 H"
summary:
  ar: "جرت لابن الملقن محنة سنة ثمانين، وذلك أنه كان يصحب برقوق، فتكلم الناس في سيرة بدر الدين بن أبي البقاء فتحدث الأمراء بعزله وفيمن يصلح لذلك، فبلغه فقال له بعض نصحائه: إن برقوق لا يستنكر عليك ذلك ولكن توثّق من بركة، فسعى عنده وكتب له خطّه بمبلغ فقبل، فتحدث بركة مع برقوق في ولايته فأنكر وقال: هذا صاحبي ولو أراد ذلك لتحدث معي؛ فأخرج له خطّه فغضب وأرسم عليه في الإصطبل وألزمه بالمال المذكور، فسعى فيه الشيخ أكمل الدين البابرتي والشيخ سراج الدين البلقيني وغيرهما إلى أن أُطلق، ولم يدخل في النيابة بعدها {cite:durar-kamina-jil-1993 dhayl p. 123}."
  en: "In 780 came Ibn al-Mulaqqin's ordeal. He was a companion of Barquq, and when the amirs discussed removing Badr al-Din Ibn Abi l-Baqa' from office and who might replace him, word reached Ibn al-Mulaqqin. An adviser told him: Barquq will not hold it against you, but secure Amir Baraka first. So he sought him out and wrote his own hand promising a sum, which Baraka accepted. When Baraka raised his appointment with Barquq, the latter denied it — 'he is my companion; had he wanted it he would have spoken to me' — and produced the letter. Furious, Barquq had him confined in the stable and bound for the promised sum, until Shaykh Akmal al-Din al-Babarti, Shaykh Siraj al-Din al-Bulqini and others interceded for his release. He never entered the judicial deputyship again {cite:durar-kamina-jil-1993 dhayl p. 123}."
  ur: "780ھ میں ابن ملقن آزمائے گئے۔ وہ برقوق کے صاحبی تھے؛ جب امیروں نے بدرالدین ابن ابی البقاء کو عہدے سے ہٹانے اور متبادل پر گفتگو کی تو خبر ابن ملقن تک پہنچی۔ ایک خیرخواہ نے کہا: برقوق تمہیں برا نہیں مانے گا مگر پہلے امیر برکہ سے کام پختہ کرو۔ انہوں نے برکہ سے مل کر اپنے ہاتھ کا لکھا مبلغ کی پیشکش بھیجی جو قبول ہوئی؛ مگر جب برکہ نے برقوق سے ان کی تقرری کی بات کی تو برقوق نے انکار کیا — 'وہ میرا صاحبی ہے، چاہتا تو مجھ سے کہتا' — اور خط نکال دیا۔ برقوق غصے سے انہیں اصطبل میں نظربند کرا دیا اور مبلغ ادا کرنے پر مجبور کیا، جب تک شیخ اکمل الدین بابرتی اور شیخ سراج الدین بلقینی وغیرہ کی سفارش سے رہا ہوئے؛ اس کے بعد وہ کبھی نیابت میں داخل نہ ہوئے {cite:durar-kamina-jil-1993 dhayl p. 123}۔"
  es: "En el año 780, Ibn al-Mulaqqin sufrió una dura prueba. Era compañero de Barquq, y cuando los emires discutieron la destitución de Badr al-Din Ibn Abi l-Baqa' y quién podría reemplazarlo, la noticia llegó a oídos de Ibn al-Mulaqqin. Un consejero le dijo: «Barquq no te lo reprochará, pero primero asegúrate de que el emir Baraka esté con él». Así que lo buscó y le escribió de su puño y letra prometiéndole una suma, que Baraka aceptó. Cuando Baraka le planteó su nombramiento a Barquq, este lo negó —«es mi compañero; si lo hubiera querido, me lo habría dicho»— y le mostró la carta. Furioso, Barquq lo hizo encerrar en el establo y lo obligó a pagar la suma prometida, hasta que el jeque Akmal al-Din al-Babarti, el jeque Siraj al-Din al-Bulqini y otros intercedieron por su liberación. Nunca volvió a ocupar el cargo de diputado judicial {cite:durar-kamina-jil-1993 dhayl p. 123}."
  fr: "En 780 survint l'épreuve d'Ibn al-Mulaqqin. Compagnon de Barquq, il fut informé, lorsque les émirs discutèrent de la destitution de Badr al-Din Ibn Abi l-Baqa' et de son successeur, que la nouvelle lui parvenait. Un conseiller lui dit: « Barquq ne vous en tiendra pas rigueur, mais assurez-vous d'abord la faveur de l'émir Baraka. » Il alla donc à sa rencontre et lui promit de sa propre main une somme d'argent, que Baraka accepta. Lorsque Baraka évoqua sa nomination auprès de Barquq, ce dernier la nia – « C'est mon compagnon; s'il l'avait voulu, il m'en aurait parlé » – et lui présenta la lettre. Furieux, Barquq le fit enfermer dans l'écurie et le lia en échange de la somme promise, jusqu'à ce que le cheikh Akmal al-Din al-Babarti, le cheikh Siraj al-Din al-Bulqini et d'autres intercèdent pour sa libération. Il ne retrouva jamais la charge de délégué judiciaire. 123}."
  tr: "İbn el-Mulakkin, seksen yılında Barquk'a eşlik ederken bir sıkıntı yaşadı. İnsanlar Bedir el-Din ibn Abi el-Baqa'nın davranışlarından bahsediyor, prensler ise onun görevden alınmasını ve yerine kimin uygun olacağını tartışıyorlardı. Bu durum ona ulaştığında, danışmanlarından biri ona şöyle dedi: \"Barquk buna itiraz etmeyecektir, ancak Baraka'yı güvence altına al.\" Bunun üzerine Barquk'a yaklaştı ve ona bir miktar para karşılığında bir mektup yazdı ve Barquk kabul etti. Baraka, Barquk ile valilik hakkında konuştu, Barquk ise bunu reddetti ve şöyle dedi: \"Bu benim arkadaşım, eğer bunu isteseydi benimle konuşurdu.\" Bunun üzerine Barquk ona mektubunu gösterdi ve Barquk öfkelenerek onu ahıra kapatmasını ve bahsi geçen parayı ödemesini emretti. Daha sonra Şeyh Akmal el-Din el-Babarti, Şeyh Siraj el-Din el-Balqini ve diğerleri onun adına müdahale ederek serbest bırakılmasını sağladılar ve bundan sonra valilik görevine girmedi. {alıntı:durar-kamina-jil-1993 dhayl s. 123}."
  id: "Ibn al-Mulaqqin mengalami cobaan berat pada tahun 1800, ketika ia mendampingi Barquq. Orang-orang membicarakan perilaku Badr al-Din ibn Abi al-Baqa, dan para pangeran mendiskusikan pemecatannya dan siapa yang cocok untuk menggantikannya. Ketika hal ini sampai kepadanya, salah seorang penasihatnya berkata: Barquq tidak akan keberatan dengan itu, tetapi mintalah bantuan Baraka. Maka ia mendekatinya dan menulis surat untuk meminta sejumlah uang, dan Baraka menerimanya. Baraka berbicara dengan Barquq tentang jabatan gubernurnya, dan Barquq menolaknya dan berkata: Ini adalah sahabatku, dan jika dia menginginkannya, dia pasti sudah berbicara denganku. Maka ia menunjukkan suratnya kepada Barquq, dan Barquq menjadi marah dan memerintahkannya untuk dimasukkan ke kandang dan mewajibkannya untuk membayar uang yang telah disebutkan. Kemudian Syekh Akmal al-Din al-Babarti, Syekh Siraj al-Din al-Balqini, dan yang lainnya turun tangan untuk membantunya hingga ia dibebaskan, dan ia tidak lagi menduduki jabatan wakil setelah itu. {mengutip:durar-kamina-jil-1993 dhayl p. 123}."
