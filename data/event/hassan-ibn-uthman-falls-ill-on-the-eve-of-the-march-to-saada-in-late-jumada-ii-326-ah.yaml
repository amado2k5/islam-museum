id: "event/hassan-ibn-uthman-falls-ill-on-the-eve-of-the-march-to-saada-in-late-jumada-ii-326-ah"
class: event
kind: other
label:
  ar: "يمرض حسان بن عثمان قبيل المسير إلى صعدة في آخر جمادى الآخرة سنة 326هـ، ص411"
  en: "Hassan ibn Uthman falls ill on the eve of the march to Saada, at the end of Jumada II 326 AH, p. 411"
  ur: "حسان بن عثمان صعدہ کی طرف روانگی سے پہلے جمادی الآخرہ 326ھ کے آخر میں بیمار پڑ جاتا ہے، ص411"
  es: "Hassan ibn Uthman enferma en la víspera de la marcha a Saada, al final de Jumada II 326 AH, pág. 411."
  fr: "Hassan ibn Uthman tombe malade à la veille de la marche vers Saada, à la fin du mois de Jumada II 326 AH, p. 411"
  tr: "Hasan bin Osman, Hicri 326 yılının Cemâde-i Ahiret ayının sonunda Saada'ya yapılacak yürüyüşten kısa bir süre önce hastalandı (s. 411)."
  id: "Hassan bin Uthman jatuh sakit sesaat sebelum perjalanan ke Saada pada akhir Jumada al-Akhirah tahun 326 H, hlm. 411"
summary:
  ar: "يحاصر ابن الضحاك تجار صنعاء في صعدة، ويعد أصحابه بالمسير إليها في مستهل رجب، فيصيب حسان بن عثمان مرض في آخر يوم خميس من جمادى الآخرة، فيتأخر الهجوم."
  en: "Ibn al-Dahhak besieges the Sanaa merchants in Saada and plans to march in early Rajab. Hassan ibn Uthman falls ill on the last Thursday of Jumada II 326 AH, the day he had promised to advance, and the attack is delayed."
  ur: "ابن الضحاک صعدہ میں صنعاء کے تاجروں کا محاصرہ کرتا ہے اور رجب کے آغاز میں حملے کا منصوبہ بناتا ہے۔ جمادی الآخرہ 326ھ کے آخری جمعرات کو، جس دن حسان بن عثمان نے پیش قدمی کا وعدہ کیا تھا، وہ بیمار پڑ جاتا ہے اور حملہ مؤخر ہو جاتا ہے۔"
  es: "Ibn al-Dahhak asedia a los mercaderes de Sanaa en Saada y planea marchar a principios de Rajab. Hassan ibn Uthman enferma el último jueves de Jumada II del año 326 de la Hégira, el día en que había prometido avanzar, y el ataque se retrasa."
  fr: "Ibn al-Dahhak assiège les marchands de Sanaa à Saada et prévoit de marcher début Rajab. Hassan ibn Uthman tombe malade le dernier jeudi de Jumada II 326 AH, jour où il avait promis d'avancer, et l'attaque est retardée."
  tr: "İbn el-Dahhak, Sa'de'deki Sana'a tüccarlarını kuşattı ve arkadaşlarına Receb ayının başında oraya yürüyeceklerine söz verdi. Hasan bin Osman, Cemâdî ahiretin son Perşembe günü hastalanınca saldırı ertelendi."
  id: "Ibn al-Dahhak mengepung para pedagang Sana'a di Sa'dah, berjanji kepada para sahabatnya untuk bergerak ke sana pada awal bulan Rajab. Hassan bin Uthman jatuh sakit pada hari Kamis terakhir bulan Jumada al-Akhirah, sehingga serangan itu ditunda."
