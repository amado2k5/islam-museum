label: { ar: "حرب زهير بن جناب على حرم غطفان" }
summary:
  ar: "حرب زهير بن جناب الكلبي على غطفان؛ كان سببها أن بني بغيض بن ريث بن غطفان حين عزوا وأثروا بعد فتكهم بصداء قبيلة من مذحج قالوا لنتخذن حرماً مثل مكة لا يقتل صيده ولا يهاج عائذه فبنوا حرماً ووليه بنو مرة بن عوف، فلما بلغ ذلك زهير بن جناب — وكان يدعى الكاهن لصحة رأيه — قال والله لا يكون ذلك أبداً وأنا حي ولا أخلي غطفان تتخذ حرماً أبداً، فغزا بهم غطفان فقاتلهم أشد قتال فظفر بهم وأخذ فارساً منهم في حرمهم فقتله وعطّل ذلك الحرم، ثم منّ على غطفان ورد النساء وأخذ الأموال {cite:kamil-ibn-al-athir p. 378}."
  en: "Zuhayr ibn Janab's war on Ghatafan's rival sanctuary: when Banu Bughayd grew mighty they vowed to found a haram like Mecca's — its game unslain, its refuge unassailed — with Banu Murra ibn Awf as wardens; Zuhayr 'the kahin' swore Ghatafan would never have a haram while he lived, broke them in battle, killed a horseman inside the sanctuary and abolished it, then spared Ghatafan and returned their women {cite:kamil-ibn-al-athir p. 378}."
