label: { ar: "حرب زهير بن جناب على حرم غطفان", en: "Zuhayr ibn Janab's War on Ghatafan's Sanctuary", es: "La guerra de Zuhayr ibn Janab contra el santuario de Ghatafan", fr: "La guerre de Zuhayr ibn Janab contre le sanctuaire de Ghatafan", ur: "غطفان کے حرم پر زہیر بن جنب کی جنگ", tr: "Zuhair ibn Janab'ın Ghatafan kadınlarına karşı savaşı", id: "Perang Zuhair ibn Janab melawan para wanita Ghatafan" }
summary:
  ar: "حرب زهير بن جناب الكلبي على غطفان؛ كان سببها أن بني بغيض بن ريث بن غطفان حين عزوا وأثروا بعد فتكهم بصداء قبيلة من مذحج قالوا لنتخذن حرماً مثل مكة لا يقتل صيده ولا يهاج عائذه فبنوا حرماً ووليه بنو مرة بن عوف، فلما بلغ ذلك زهير بن جناب — وكان يدعى الكاهن لصحة رأيه — قال والله لا يكون ذلك أبداً وأنا حي ولا أخلي غطفان تتخذ حرماً أبداً، فغزا بهم غطفان فقاتلهم أشد قتال فظفر بهم وأخذ فارساً منهم في حرمهم فقتله وعطّل ذلك الحرم، ثم منّ على غطفان ورد النساء وأخذ الأموال {cite:kamil-ibn-al-athir p. 378}."
  en: "Zuhayr ibn Janab's war on Ghatafan's rival sanctuary: when Banu Bughayd grew mighty they vowed to found a haram like Mecca's — its game unslain, its refuge unassailed — with Banu Murra ibn Awf as wardens; Zuhayr 'the kahin' swore Ghatafan would never have a haram while he lived, broke them in battle, killed a horseman inside the sanctuary and abolished it, then spared Ghatafan and returned their women {cite:kamil-ibn-al-athir p. 378}."
  es: "La guerra de Zuhayr ibn Janab contra el santuario rival de Ghatafan: cuando Banu Bughayd se hizo poderoso, juraron fundar un haram como el de La Meca —su caza intacta, su refugio inexpugnable— con Banu Murra ibn Awf como guardianes; Zuhayr 'el kahin' juró que Ghatafan nunca tendría un haram mientras viviera, los derrotó en batalla, mató a un jinete dentro del santuario y lo abolió, luego perdonó a Ghatafan y devolvió a sus mujeres {cite:kamil-ibn-al-athir p. 378}."
  fr: "La guerre de Zuhayr ibn Janab contre le sanctuaire rival de Ghatafan: lorsque les Banu Bughayd devinrent puissants, ils jurèrent de fonder un haram comme celui de La Mecque — son gibier intact, son refuge inviolé — avec les Banu Murra ibn Awf comme gardiens; Zuhayr « le kahin » jura que Ghatafan n'aurait jamais de haram de son vivant, les brisa au combat, tua un cavalier à l'intérieur du sanctuaire et l'abolit, puis épargna Ghatafan et leur rendit leurs femmes {cite:kamil-ibn-al-athir p. 378}."
  ur: "غطفان کے حریف حرم کے خلاف زہیر بن جنب کی جنگ: جب بنو بغید نے طاقت پکڑی تو انہوں نے مکہ کی طرح ایک حرم تلاش کرنے کا عہد کیا - اس کا کھیل غیر مقلد، اس کی پناہ گاہ غیر محفوظ - بنو مرہ ابن عوف کے محافظوں کے ساتھ؛ زہیر 'کاہین' نے قسم کھائی کہ غطفان کے زندہ رہنے تک کبھی حرام نہیں ہوگا، جنگ میں ان کو توڑ دیا، حرم کے اندر ایک گھڑ سوار کو مارا اور اسے ختم کر دیا، پھر غطفان کو چھوڑ دیا اور ان کی عورتوں کو واپس کر دیا۔ 378}۔"
  tr: "Zuhair bin Janab el-Kalbi'nin Gatafan'a karşı savaşı, Bağhidh bin Rayth bin Gatafan'ın oğullarının, bir Medhij kabilesini öldürdükten sonra güçlenip zenginleşince, \"Mekke gibi bir kutsal yer kuralım, orada av hayvanları öldürülmez ve koruyucularına saldırılmaz\" demelerinden kaynaklanmıştır. Böylece bir kutsal yer inşa ettiler ve Murrah bin Awf'ın oğulları buranın sorumluluğunu üstlendiler. Bu durum, görüşlerinin doğruluğu nedeniyle kahin olarak anılan Zuhair bin Janab'a ulaştığında, \"Allah'a yemin ederim ki, ben hayatta olduğum sürece bu asla olmayacak ve Gatafan'ın bir kutsal yer kurmasına asla izin vermeyeceğim\" dedi. Bunun üzerine onlarla birlikte Gatafan'a baskın düzenledi ve onlarla en şiddetli savaşta savaştı, onlara karşı zafer kazandı ve kutsal yerlerinde bir şövalyeyi alıp öldürdü ve o kutsal yeri kutsallığından mahrum bıraktı. Sonra Gatafan'a merhamet gösterdi, kadınları geri verdi ve parayı aldı. {alıntı: kamil-ibn-el-esir s. 378}."
  id: "Perang Zuhair bin Janab al-Kalbi melawan Ghatafan disebabkan oleh kenyataan bahwa putra-putra Baghidh bin Rayth bin Ghatafan, ketika mereka menjadi kuat dan kaya setelah membunuh suku Madhhij, berkata, “Mari kita dirikan sebuah tempat suci seperti Mekah, di mana hewan buruannya tidak dibunuh dan para pelindungnya tidak diserang.” Maka mereka membangun sebuah tempat suci dan putra-putra Murrah bin Awf bertanggung jawab atasnya. Ketika hal ini sampai kepada Zuhair bin Janab—yang disebut peramal karena kebenaran pendapatnya—ia berkata, “Demi Allah, ini tidak akan pernah terjadi selama aku hidup, dan aku tidak akan pernah membiarkan Ghatafan membangun tempat suci.” Maka ia menyerang Ghatafan bersama mereka dan berperang melawan mereka dalam pertempuran yang paling sengit, dan ia menang atas mereka serta mengambil seorang ksatria dari tempat suci mereka dan membunuhnya serta merampas tempat suci itu. Kemudian ia menunjukkan belas kasihan kepada Ghatafan dan mengembalikan para wanita serta mengambil uangnya. {mengutip: kamil-ibn-al-athir hal. 378}."
