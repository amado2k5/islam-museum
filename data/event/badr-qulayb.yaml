label: { en: "The Qulayb at Badr", ar: "القليب — دفن قتلى المشركين ببدر" }
summary:
  en: "After the battle the Quraysh dead were cast into a pit (the qulayb) at Badr, where the Prophet addressed them by name; when Umar asked how he spoke to the dead he answered that they heard him no less than the living."
  ar: "أُلقي قتلى المشركين بعد الوقعة في بئر مطمورة يقال لها القليب، فوقف النبي عليها يناديهم بأسمائهم؛ ولما سأله عمر عن خطاب موتى لا يسمعون قال إنهم ليسوا بأسمع لما يقول منهم."
