label: { en: "The Qulayb at Badr", ar: "القليب — دفن قتلى المشركين ببدر", fr: "Le Qulayb de Badr", es: "El Qulayb en Badr", ur: "قلیب بدر میں", tr: "El-Kalib — Bedir'de öldürülen müşriklerin gömüldüğü yer.", id: "Al-Qalib — tempat pemakaman kaum musyrik yang terbunuh di Badr" }
summary:
  en: "After the battle the Quraysh dead were cast into a pit (the qulayb) at Badr, where the Prophet addressed them by name; when Umar asked how he spoke to the dead he answered that they heard him no less than the living."
  ar: "أُلقي قتلى المشركين بعد الوقعة في بئر مطمورة يقال لها القليب، فوقف النبي عليها يناديهم بأسمائهم؛ ولما سأله عمر عن خطاب موتى لا يسمعون قال إنهم ليسوا بأسمع لما يقول منهم."
  fr: "Après la bataille, les morts de Quraysh furent jetés dans une fosse (le qulayb) à Badr, où le Prophète s'adressa à eux par leur nom ; quand Umar demanda comment il parlait aux morts, il répondit qu'ils l'entendaient non moins que les vivants."
  es: "Tras la batalla, los muertos de los Quraysh fueron arrojados a una fosa (el qulayb) en Badr, donde el Profeta se dirigió a ellos por su nombre; cuando Umar le preguntó cómo hablaba con los muertos, respondió que ellos lo oían igual que los vivos."
  ur: "جنگ کے بعد مردہ قریش کو بدر کے مقام پر ایک گڑھے ⁦(قلیب)⁩ میں ڈال دیا گیا، جہاں نبی نے ان سے نام لے کر خطاب کیا۔ جب عمر نے پوچھا کہ تم مردوں سے کیسے بات کرتے ہو تو جواب دیا کہ انہوں نے اسے زندہ سے کم نہیں سنا۔"
  tr: "Savaştan sonra müşriklerin cesetleri el-Kulaib denilen gömülü bir kuyuya atıldı. Peygamber, onların isimleriyle seslenerek başucunda durdu. Ömer, ölülerin, duyamayacak durumda olanların, onun söylediklerini duymaya güçleri yetmediğini sorduğunda, Peygamber şöyle buyurdu: \"Onlar da benim söylediklerimi duymaya güç yetiremezler.\""
  id: "Setelah pertempuran, jenazah kaum musyrik dilemparkan ke dalam sumur terpendam bernama al-Qulaib. Nabi berdiri di atasnya memanggil nama-nama mereka. Ketika Umar bertanya kepadanya tentang cara menyapa orang mati yang tidak dapat mendengar, beliau menjawab bahwa mereka pun tidak dapat mendengar apa yang beliau katakan."
