id: event/ahwaz-sack-421
class: event
kind: massacre
label: { ar: "نهب الأهواز ٤٢١", en: "The sack of al-Ahwaz, 421", fr: "Le sac d’al-Ahwaz, 421", es: "El saqueo de al-Ahwaz, 421", ur: "الاحواز کی بوری، 421" }
summary:
  ar: "دخل جلال الدولة الأهواز فبسط جنوده فيها ستة عشر يومًا، وجاء كتابه إلى بغداد يوم الحادي عشر من ربيع الآخر سنة ٤٢١ يصف ما أُخذ: زعم الكتاب أن الغنائم زادت على خمسة آلاف ألف دينار وأسر ألفي جارية، مع ما في رواية الملك المنتصر عن نفسه وعددها {cite:muntazam-ibn-al-jawzi j.8 p.388-389}."
  en: "Jalal al-Dawla entered al-Ahwaz and let his troops loose in it for sixteen days. His letter reached Baghdad on 11 Rabi' II 421 describing what had been taken: the letter claimed that the booty exceeded five million dinars and that two thousand slave-girls were taken captive, along with what the victorious king's own account gives of himself and of their number {cite:muntazam-ibn-al-jawzi j.8 p.388-389}."
  fr: "Jalal al-Dawla entra à al-Ahwaz et y lâcha ses troupes pendant seize jours. Sa lettre parvint à Bagdad le 11 rabi II 421 et décrivait les prises : elle affirmait que le butin dépassait cinq millions de dinars et que deux mille esclaves femmes avaient été capturées, avec ce que le propre récit du roi victorieux disait de lui-même et de leur nombre {cite:muntazam-ibn-al-jawzi j.8 p.388-389}."
  es: "Jalal al-Dawla entró en al-Ahwaz y dejó a sus tropas sueltas durante dieciséis días. Su carta llegó a Bagdad el 11 de Rabi' II de 421 describiendo lo que se había tomado: la carta afirmaba que el botín superaba los cinco millones de dinares y que dos mil esclavas habían sido capturadas, además de lo que el propio rey victorioso relataba sobre sí mismo y sobre su número {cite:muntazam-ibn-al-jawzi j.8 p.388-389}."
  ur: "جلال الدولہ اہواز میں داخل ہوا اور اس میں سولہ دن تک اپنی فوجیں چھوڑ دیں۔ اس کا خط 11 ربیع الثانی 421 کو بغداد پہنچا جس میں یہ بیان کیا گیا کہ کیا لیا گیا تھا: اس خط میں دعویٰ کیا گیا کہ مال غنیمت پچاس لاکھ دینار سے زیادہ ہے اور دو ہزار لونڈیاں اسیر کر لی گئی ہیں، اس کے ساتھ فاتح بادشاہ کے اپنے اور ان کی تعداد کے بارے میں جو کچھ لکھا گیا ہے۔"
