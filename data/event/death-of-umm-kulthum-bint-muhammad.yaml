label: { en: "The death of Umm Kulthum bint Muhammad", ar: "وفاة أم كلثوم بنت النبي" }
summary:
  en: "In 9 AH Umm Kulthum, the Prophet's daughter and wife of Uthman ibn Affan, died; the Prophet grieved her deeply and told Uthman, 'Had I had a third daughter I would have given her to you in marriage' — whence Uthman was called Dhu al-Nurayn, the possessor of the two lights."
  ar: "في سنة 9هـ توفيت أم كلثوم بنت النبي زوج عثمان بن عفان؛ فحزن عليها النبي حزناً شديداً وقال لعثمان: «لو كانت عندي ثالثة لزوجتكها»، ولذلك لُقب عثمان بذي النورين لزواجه من ابنتين للنبي تباعاً."
