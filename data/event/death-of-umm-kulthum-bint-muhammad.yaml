label: { en: "The death of Umm Kulthum bint Muhammad", ar: "وفاة أم كلثوم بنت النبي", es: "La muerte de Umm Kulthum bint Muhammad", fr: "La mort d'Oum Kalthoum bint Muhammad", ur: "ام کلثوم بنت محمد کی وفات" }
summary:
  en: "In 9 AH Umm Kulthum, the Prophet's daughter and wife of Uthman ibn Affan, died; the Prophet grieved her deeply and told Uthman, 'Had I had a third daughter I would have given her to you in marriage' — whence Uthman was called Dhu al-Nurayn, the possessor of the two lights."
  ar: "في سنة 9هـ توفيت أم كلثوم بنت النبي زوج عثمان بن عفان؛ فحزن عليها النبي حزناً شديداً وقال لعثمان: «لو كانت عندي ثالثة لزوجتكها»، ولذلك لُقب عثمان بذي النورين لزواجه من ابنتين للنبي تباعاً."
  es: "En el año 9 de la Hégira, murió Umm Kulthum, hija del Profeta y esposa de Uthman ibn Affan; el Profeta la afligió profundamente y le dijo a Uthman: \"Si hubiera tenido una tercera hija, te la habría dado en matrimonio\", de donde Uthman fue llamado Dhu al-Nurayn, el poseedor de las dos luces."
  fr: "En l'an 9 de l'Hégire, Umm Kulthum, la fille du Prophète et épouse d'Uthman ibn Affan, mourut; le Prophète fut profondément affligé et dit à Uthman: « Si j'avais eu une troisième fille, je te l'aurais donnée en mariage » — d'où Uthman fut appelé Dhu al-Nurayn, le possesseur des deux lumières."
  ur: "9ھ میں ام کلثوم جو کہ رسول اللہ کی بیٹی اور عثمان بن عفان کی بیوی تھیں، فوت ہوئیں۔ رسول اللہ نے اس پر غم کا اظہار کیا اور عثمان سے کہا، 'اگر میری تیسری بیٹی ہوتی تو میں اسے آپ کے ساتھ بیاہ دیتا'، اس لیے عثمان کو ذوالنورین کہا جاتا ہے، جو دو نوروں کا مالک ہے۔"
