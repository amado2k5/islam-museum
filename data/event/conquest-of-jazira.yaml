label: { ar: "فتح الجزيرة", en: "The Conquest of the Jazira", es: "La conquista de Jazira", fr: "La conquête de la Jazira", ur: "جزیرہ کی فتح", tr: "Adanın fethi", id: "Penaklukan pulau" }
summary:
  ar: "عند البلاذري عن داود بن عبد الحميد قاضي الرقة عن أبيه عن جده عن ميمون بن مهران: «الجزيرة كلها فتوح إياد بن غنم بعد وفاة أبي عبيدة، ولاه إياها عمر بن الخطاب — وكان أبو عبيدة استخلفه على الشام فولى عمر يزيد بن أبي سفيان ثم معاوية من بعده الشام وأمر إياداً بغزو الجزيرة»؛ وقال سليمان بن عطاء: بعث أبو عبيدة إياداً إلى الجزيرة فمات أبو عبيدة وهو بها فولاه عمر إياها بعد؛ وعند الواقدي — وهو أثبت ما سمعوه في أمره — أن أبا عبيدة مات في طاعون عمواس سنة 18 واستخلف إياداً فورد عليه كتاب عمر بتوليته حمص وقنسرين والجزيرة فسار إلى الجزيرة يوم الخميس للنصف من شعبان سنة 18 في خمسة آلاف وعلى مقدمته ميسرة بن مسروق العبسي وعلى ميمنته سعيد بن عامر بن حذيم الجمحي وعلى ميسرته صفوان بن المعطل السلمي — وقيل كان خالد بن الوليد على ميسرته وقيل إن خالداً لم يسر تحت لواء أحد بعد أبي عبيدة ولزم حمص حتى توفي بها سنة 21 وقيل مات بالمدينة."
  en: "In al-Baladhuri through the Raqqa judge Dawud ibn Abd al-Hamid's family from Maymun ibn Mihran: 'the whole Jazira is Iyad ibn Ghanm's conquest, after Abu Ubayda's death — Umar appointed him to it, Abu Ubayda having left him over Syria; Umar gave Syria to Yazid ibn Abi Sufyan then Mu'awiya after him and ordered Iyad to raid the Jazira'; Sulayman ibn Ata says Abu Ubayda dispatched him to the Jazira and died while he was there, Umar then confirming him; al-Waqidi's report — the soundest they had on him — is that Abu Ubayda died in the Amwas plague of year 18 having appointed Iyad, and Umar's letter reached him giving him Hims, Qinnasrin and the Jazira, so he marched for the Jazira on Thursday the middle of Sha'ban year 18 in five thousand, Maysara ibn Masruq al-Absi on the vanguard, Sa'id ibn Amir ibn Hudhaym al-Jumahi on the right wing and Safwan ibn al-Mu'attal al-Sulami on the left — some say Khalid ibn al-Walid held his left wing, some that Khalid marched under no banner after Abu Ubayda, staying at Hims till his death in year 21, or dying at Medina."
  es: "En al-Baladhuri a través de la familia del juez de Raqqa Dawud ibn Abd al-Hamid de Maymun ibn Mihran: 'toda la Jazira es conquistada por Iyad ibn Ghanm, después de la muerte de Abu Ubayda; Umar lo designó para ella, habiéndole dejado a Abu Ubayda el control de Siria; Umar le dio Siria a Yazid ibn Abi Sufyan y luego a Mu'awiya después de él y ordenó a Iyad que saqueara la Jazira'; Sulayman ibn Ata dice que Abu Ubayda lo envió a la Jazira y murió mientras estaba allí, y luego Umar lo confirmó; El informe de al-Waqidi —el más fiable que tenían sobre él— es que Abu Ubayda murió en la peste de Amwas del año 18 tras haber nombrado a Iyad, y la carta de Umar le llegó dándole Hims, Qinnasrin y la Jazira, así que marchó hacia la Jazira el jueves de mediados de Sha'ban del año 18 en cinco mil hombres, Maysara ibn Masruq al-Absi en la vanguardia, Sa'id ibn Amir ibn Hudhaym al-Jumahi en el flanco derecho y Safwan ibn al-Mu'attal al-Sulami en el izquierdo; algunos dicen que Khalid ibn al-Walid mantuvo su flanco izquierdo, otros que Khalid marchó sin estandarte tras Abu Ubayda, permaneciendo en Hims hasta su muerte en el año 21, o muriendo en Medina."
  fr: "Dans al-Baladhuri, par l'intermédiaire de la famille du juge de Raqqa Dawud ibn Abd al-Hamid, d'après Maymun ibn Mihran: « toute la Jazira est une conquête d'Iyad ibn Ghanm, après la mort d'Abu Ubayda — Umar l'y a nommé, Abu Ubayda lui ayant laissé la Syrie; Umar a donné la Syrie à Yazid ibn Abi Sufyan puis à Mu'awiya après lui et a ordonné à Iyad de piller la Jazira »; Sulayman ibn Ata dit qu'Abu Ubayda l'a envoyé à la Jazira et est mort pendant qu'il était là, Umar le confirmant ensuite; Le récit d'al-Waqidi — le plus fiable qu'ils possédaient à son sujet — indique qu'Abu Ubayda mourut lors de l'épidémie d'Amwas de l'an 18 après avoir nommé Iyad, et que la lettre d'Umar lui parvint, lui attribuant Hims, Qinnasrin et la Jazira. Il marcha donc vers la Jazira le jeudi du milieu du mois de Sha'ban de l'an 18, à la tête d'une armée de cinq mille hommes, avec Maysara ibn Masruq al-Absi en première ligne, Sa'id ibn Amir ibn Hudhaym al-Jumahi sur l'aile droite et Safwan ibn al-Mu'attal al-Sulami sur l'aile gauche. Certains affirment que Khalid ibn al-Walid tenait son aile gauche, d'autres que Khalid marcha sans bannière après Abu Ubayda, restant à Hims jusqu'à sa mort en l'an 21, ou mourant à Médine."
  ur: "البلادوری میں رقہ کے جج داؤد بن عبد الحامد کے خاندان کے ذریعے میمون بن مہران سے: 'پورا جزیرہ عیاض بن غنم کی فتح ہے، ابو عبیدہ کی موت کے بعد - عمر نے اسے اس پر مقرر کیا، ابو عبیدہ نے اسے شام پر چھوڑ دیا؛ عمر نے شام یزید بن ابی سفیان کو دے دیا پھر معاویہ کو ان کے بعد اور عیاض کو جزیرہ پر حملہ کرنے کا حکم دیا۔ سلیمان بن عطا کہتے ہیں کہ ابو عبیدہ نے انہیں جزیرہ کی طرف روانہ کیا اور وہ وہاں موجود تھے، عمر نے اس کی تصدیق کی۔ الواقدی کی روایت - جو ان کے بارے میں سب سے زیادہ صحیح تھی - یہ ہے کہ ابو عبیدہ 18 ہجری کے طاعون امواس میں عیاد کو مقرر کرنے کے بعد فوت ہوئے اور عمر کا خط ان کے پاس پہنچا جس میں اسے ہمس، کنسرین اور جزیرہ دیا گیا، چنانچہ انہوں نے جمعرات 18 شعبان المعظم کی درمیانی شب پانچ ہزار المسعرہ میں جزیرے کی طرف کوچ کیا۔ سعید بن عامر بن ہذیم الجمعی دائیں بازو پر اور صفوان بن المطل السلمی بائیں طرف - کچھ کہتے ہیں کہ خالد بن الولید نے اپنا بایاں بازو پکڑا ہوا تھا، کچھ کہتے ہیں کہ خالد نے ابو عبیدہ کے بعد کسی جھنڈے کے نیچے مارچ نہیں کیا، وہ حمص میں رہے یہاں تک کہ ان کی وفات سن 21 میں یا مدینہ منورہ میں ہوئی۔"
  tr: "El-Baladhuri, Rakka kadısı Davud ibn Abdülhamid'den, onun babasından, onun dedesinden ve Maymun ibn Mihran'dan rivayetle şöyle aktarmıştır: “Ebu Ubeyde'nin ölümünden sonra adanın tamamı İyad ibn Ghanm tarafından fethedildi. Ömer ibn el-Hattab onu adaya atadı - ve Ebu Ubeyde de onu Levant'ın halefi olarak atamıştı. Ömer daha sonra Yezid ibn Ebi Sufyan'ı, ondan sonra da Muaviye'yi Levant'ın başına atadı ve İyad'a adayı fethetmesini emretti.” Süleyman ibn Ata şöyle dedi: Ebu Ubeyde, İyad'ı adaya gönderdi ve Ebu Ubeyde orada iken öldü ve Ömer daha sonra onu adaya atadı. Ve el-Vakidi'ye göre -ki bu onun hakkında duydukları en güvenilir rivayettir- Ebu Ubeyde, 18. yılda Amvas vebasında öldü ve İyad'ı halefi olarak atadı. Sonra Ömer'den, onu Homs, Kınnasrin ve Cezire valisi olarak atayan bir mektup geldi. Böylece, 18. yılın Şaban ayının ortasında, Perşembe günü, beş bin adamla Cezire'ye yürüdü. Önünde Maysarah ibn Masruq al-Absi, sağında Said ibn Amer ibn Hudhaim al-Jumahi ve solunda Safwan ibn al-Mu'attal al-Sulami vardı; ayrıca solunda Halid ibn al-Walid'in olduğu da söylenir. Halid'in, Ebu Ubaide'den sonra hiçbirinin sancağı altında yürümediği ve 21. yılda Homs'ta ölene kadar orada kaldığı da söylenir. Medine'de öldüğü de söylenir."
  id: "Al-Baladhuri meriwayatkan dari Dawud ibn Abd al-Hamid, hakim Raqqa, dari ayahnya, dari kakeknya, dari Maymun ibn Mihran: “Seluruh pulau itu ditaklukkan oleh Iyad ibn Ghanm setelah kematian Abu Ubaidah. Umar ibn al-Khattab menunjuknya untuk menguasai pulau itu — dan Abu Ubaidah telah menunjuknya sebagai penggantinya atas Levant. Umar kemudian menunjuk Yazid ibn Abi Sufyan, dan kemudian Muawiyah setelahnya, untuk menguasai Levant, dan memerintahkan Iyad untuk menaklukkan pulau itu.” Sulayman ibn Ata berkata: Abu Ubaidah mengirim Iyad ke pulau itu, dan Abu Ubaidah meninggal dunia saat berada di sana, dan Umar menunjuknya untuk menguasai pulau itu setelahnya. Dan menurut al-Waqidi — dan ini adalah riwayat yang paling dapat dipercaya yang mereka dengar tentangnya — Abu Ubaidah meninggal dunia dalam wabah Amwas pada tahun 18 dan menunjuk Iyad sebagai penggantinya. Kemudian sebuah surat dari Umar tiba yang menunjuknya sebagai gubernur Homs, Qinnasrin, dan al-Jazira. Maka ia berangkat ke al-Jazira pada hari Kamis, pertengahan bulan Sya'ban tahun 18, dengan lima ribu orang. Di depannya ada Maysarah ibn Masruq al-Absi, di sebelah kanannya ada Saeed ibn Amer ibn Hudhaim al-Jumahi, dan di sebelah kirinya ada Safwan ibn al-Mu'attal al-Sulami — dan dikatakan bahwa Khalid ibn al-Walid berada di sebelah kirinya, dan dikatakan bahwa Khalid tidak berbaris di bawah panji siapa pun setelah Abu Ubaidah dan tinggal di Homs sampai ia meninggal di sana pada tahun 21. Dikatakan juga bahwa ia meninggal di Madinah."
