summary:
  ar: "سلسلة مناظرات مضبوطة ومفرغة بين [[person/shabir-ally|شبير علي]] والدفاعي المعمداني [[person/james-white|جيمس وايت]] جرت في الولايات المتحدة وكندا وجنوب أفريقيا بين 2006 و2014، وشملت «هل آمن أتباع عيسى الأوائل بألوهيته؟» في جامعة بريتوريا 2013 وموضوعات في صحة نقل العهد الجديد وصلب المسيح. ويوثّق الطرفان المناظرات بالتسجيل والإعلان {cite:aomin-pretoria-debate-2013}."
  en: "A series of moderated, transcribed debates between [[person/shabir-ally|Shabir Ally]] and the Reformed Baptist apologist [[person/james-white|James White]] held in the United States, Canada and South Africa between 2006 and 2014, including 'Did the Earliest Followers of Jesus Believe in His Deity?' at the University of Pretoria in 2013 and topics on New Testament textual reliability and the crucifixion. Both parties document the debates with recordings and announcements {cite:aomin-pretoria-debate-2013}."
  es: "Una serie de debates moderados y transcritos entre Shabir Ally y el apologista bautista reformado James White, celebrados en Estados Unidos, Canadá y Sudáfrica entre 2006 y 2014, incluyendo \"¿Creían los primeros seguidores de Jesús en su divinidad?\" en la Universidad de Pretoria en 2013 y temas sobre la fiabilidad textual del Nuevo Testamento y la crucifixión. Ambas partes documentan los debates con grabaciones y anuncios {cite:aomin-pretoria-debate-2013}."
  fr: "Une série de débats modérés et retranscrits entre Shabir Ally et l'apologiste baptiste réformé James White ont eu lieu aux États-Unis, au Canada et en Afrique du Sud entre 2006 et 2014. Parmi ces débats figurait celui intitulé « Les premiers disciples de Jésus croyaient-ils en sa divinité ? » à l'Université de Pretoria en 2013, ainsi que des discussions sur la fiabilité des textes du Nouveau Testament et la crucifixion. Les deux parties ont documenté ces débats par des enregistrements et des annonces (voir: aomin-pretoria-debate-2013)."
  ur: "2006 اور 2014 کے درمیان ریاست ہائے متحدہ امریکہ، کینیڈا اور جنوبی افریقہ میں منعقدہ [[person/shabir-ally|Shabir Alli]] اور اصلاح شدہ بپٹسٹ معافی کے ماہر [[person/james-white|James White]] کے درمیان معتدل، نقل شدہ مباحثوں کا ایک سلسلہ، جس میں 'Did the Earliive Followers in De Jesus'? یونیورسٹی آف پریٹوریا میں 2013 میں اور نئے عہد نامہ کے متنی اعتبار اور مصلوبیت کے عنوانات۔ دونوں فریق مباحثوں کو ریکارڈنگ اور اعلانات کے ساتھ دستاویز کرتے ہیں {cite:aomin-pretoria-debate-2013}۔"
  tr: "[[person/shabir-ally|Shabir Ali]] ile Baptist savunucusu [[person/james-white|James White]] arasında 2006 ve 2014 yılları arasında Amerika Birleşik Devletleri, Kanada ve Güney Afrika'da yapılandırılmış ve yazıya dökülmüş bir dizi tartışma gerçekleşti. Bunlar arasında 2013 yılında Pretoria Üniversitesi'nde yapılan \"İsa'nın İlk Takipçileri Onun Tanrısallığına İnandı mı?\" başlıklı tartışma ve Yeni Ahit'in aktarımının gerçekliği ile Mesih'in çarmıha gerilmesi konuları yer almaktadır. Her iki taraf da tartışmaları kayıt altına alarak ve kamuoyuna duyurarak belgeledi {cite:aomin-pretoria-debate-2013}."
  id: "Serangkaian debat terstruktur dan terdokumentasi antara Shabir Ali dan James White, seorang apologetikus Baptis, berlangsung di Amerika Serikat, Kanada, dan Afrika Selatan antara tahun 2006 dan 2014, termasuk \"Apakah Pengikut Awal Yesus Percaya pada Keilahian-Nya?\" di Universitas Pretoria pada tahun 2013, dan topik-topik mengenai keaslian transmisi Perjanjian Baru dan penyaliban Kristus. Kedua belah pihak mendokumentasikan debat tersebut melalui rekaman dan publikasi {cite:aomin-pretoria-debate-2013}."
