id: event/qushayri-first-imla-437
class: event
kind: other
label:
  ar: "أول مجالس الإملاء للقشيري في الحديث، ٤٣٧هـ"
  en: "Al-Qushayri's first hadith dictation sessions, 437/1046"
  ur: "قشیری کی پہلی مجالسِ املائے حدیث، 437ھ/1046ء"
summary:
  ar: "حجّ القشيري في رفقة أبي محمد الجويني — والد إمام الحرمين — وجماعة من مشاهير الشافعية، فسمع الحديث ببغداد والحجاز في تلك الأسفار، ثم عقد بعد عودته إلى نيسابور أول مجالس الإملاء في الحديث سنة ٤٣٧هـ، وأسس فيها مدرسته {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:encyclopaedia-of-islam-2 vol. 5.3 p. 194}."
  en: "Al-Qushayri made the Pilgrimage in the company of Abu Muhammad al-Juwayni — father of Imam al-Haramayn — and other eminent Shafi'is, hearing hadith at Baghdad and in the Hijaz on that journey; probably after his return to Nishapur he held his first majalis al-imla', the hadith dictation sessions, in 437/1046, the year his own madrasa is recorded {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:encyclopaedia-of-islam-2 vol. 5.3 p. 194}."
  ur: "قشیری نے ابو محمد جوینی — امام الحرمین کے والد — اور دیگر نامور شافعی علماء کی رفاقت میں حج کیا اور اسی سفر میں بغداد و حجاز میں حدیث سنی؛ غالباً نیشاپور واپسی کے بعد انھوں نے 437ھ/1046ء میں پہلی مجلسِ املائے حدیث قائم کی، اسی سال ان کی مدرسہ کا ذکر ملتا ہے {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:encyclopaedia-of-islam-2 vol. 5.3 p. 194}۔"
