id: event/qushayri-first-imla-437
class: event
kind: other
label:
  ar: "أول مجالس الإملاء للقشيري في الحديث، ٤٣٧هـ"
  en: "Al-Qushayri's first hadith dictation sessions, 437/1046"
  ur: "قشیری کی پہلی مجالسِ املائے حدیث، 437ھ/1046ء"
  es: "Primeras sesiones de dictado de hadices de Al-Qushayri, 437/1046"
  fr: "Premières séances de dictée de hadiths d'Al-Qushayri, 437/1046"
  tr: "El-Kuşeyri'nin Hadis üzerine ilk dikte dersleri, Hicri 437"
  id: "Sesi dikte pertama al-Qushayri tentang Hadits, 437 H."
summary:
  ar: "حجّ القشيري في رفقة أبي محمد الجويني — والد إمام الحرمين — وجماعة من مشاهير الشافعية، فسمع الحديث ببغداد والحجاز في تلك الأسفار، ثم عقد بعد عودته إلى نيسابور أول مجالس الإملاء في الحديث سنة ٤٣٧هـ، وأسس فيها مدرسته {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:encyclopaedia-of-islam-2 vol. 5.3 p. 194}."
  en: "Al-Qushayri made the Pilgrimage in the company of Abu Muhammad al-Juwayni — father of Imam al-Haramayn — and other eminent Shafi'is, hearing hadith at Baghdad and in the Hijaz on that journey; probably after his return to Nishapur he held his first majalis al-imla', the hadith dictation sessions, in 437/1046, the year his own madrasa is recorded {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:encyclopaedia-of-islam-2 vol. 5.3 p. 194}."
  ur: "قشیری نے ابو محمد جوینی — امام الحرمین کے والد — اور دیگر نامور شافعی علماء کی رفاقت میں حج کیا اور اسی سفر میں بغداد و حجاز میں حدیث سنی؛ غالباً نیشاپور واپسی کے بعد انھوں نے 437ھ/1046ء میں پہلی مجلسِ املائے حدیث قائم کی، اسی سال ان کی مدرسہ کا ذکر ملتا ہے {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:encyclopaedia-of-islam-2 vol. 5.3 p. 194}۔"
  es: "Al-Qushayri realizó la peregrinación en compañía de Abu Muhammad al-Juwayni —padre del Imam al-Haramayn— y otros eminentes shafi'ís, escuchando hadices en Bagdad y en el Hiyaz durante ese viaje; probablemente después de su regreso a Nishapur celebró su primera majalis al-imla', las sesiones de dictado de hadices, en 437/1046, año en que se registra su propia madrasa {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:encyclopaedia-of-islam-2 vol. 5.3 p. 194}."
  fr: "Al-Qushayri fit le pèlerinage en compagnie d'Abu Muhammad al-Juwayni — père de l'imam al-Haramayn — et d'autres éminents chaféites, écoutant des hadiths à Bagdad et dans le Hedjaz au cours de ce voyage; probablement après son retour à Nishapur, il tint ses premières majalis al-imla', les sessions de dictée de hadiths, en 437/1046, l'année où sa propre madrasa est enregistrée {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:encyclopaedia-of-islam-2 vol. 5.3 p. 194}."
  tr: "El-Kuşeyri, İki Kutsal Mescid-i Haram İmamı'nın babası Ebu Muhammed el-Cüveyni ve bir grup ünlü Şafiî ile birlikte Hac ibadetini yerine getirdi. Bu yolculuklar sırasında Bağdat ve Hicaz'da hadis dinledi. Daha sonra Nişapur'a döndükten sonra, Hicri 437 yılında hadis üzerine ilk dikte derslerini verdi ve orada kendi okulunu kurdu. {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:encyclopaedia-of-islam-2 vol. 5.3 p. 194}"
  id: "Al-Qushayri melaksanakan ibadah haji bersama Abu Muhammad al-Juwayni — ayah dari Imam Dua Masjid Suci — dan sekelompok ulama Syafi'i terkenal. Beliau mendengar hadits di Baghdad dan Hijaz selama perjalanan tersebut. Kemudian, setelah kembali ke Nishapur, beliau mengadakan sesi dikte hadits pertama pada tahun 437 H, dan mendirikan sekolahnya di sana. {cite:encyclopaedia-of-islam-2 vol. 5 p. 564} {cite:encyclopaedia-of-islam-2 vol. 5.3 p. 194}."
