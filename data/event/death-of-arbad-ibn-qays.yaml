label: { ar: "موت أربد بن قيس بالصاعقة", en: "The death of Arbad ibn Qays by lightning" }
summary:
  ar: "لما رجع أصحاب أربد إلى أرض بني عامر وسألوه: ما وراءك؟ قال إن محمداً دعاهم إلى عبادة شيء يودّ لو كان عنده ليرميه بالنبل؛ فخرج بعد يوم أو يومين بجمل له فأرسل الله عليه وعلى جمله صاعقة فأحرقتهما. يروي ابن هشام عن زيد بن أسلم عن عطاء بن يسار عن ابن عباس أن آيات من سورة الرعد نزلت في عامر وأربد، ورثاه أخوه لأمه لبيد بقصائد."
  en: "When Arbad's companions reached Banu Amir's land and asked what news he brought, he said Muhammad had called them to worship something he wished he had at hand to shoot with arrows; a day or two later he went out with a camel and God sent a thunderbolt that burned him and the camel. Ibn Hisham reports from Zayd ibn Aslam, from Ata' ibn Yasar, from Ibn Abbas that verses of sura al-Ra'd were revealed about Amir and Arbad; his maternal brother Labid mourned him in several poems."
