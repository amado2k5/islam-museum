id: event/death-of-arbad-ibn-qays
class: event
kind: death
label: { ar: "موت أربد بن قيس بالصاعقة", en: "The death of Arbad ibn Qays by lightning", es: "La muerte de Arbad ibn Qays por un rayo", fr: "La mort d'Arbad ibn Qays par la foudre", ur: "بجلی گرنے سے اربد بن قیس کی موت", tr: "Arbad ibn Qays yıldırım çarpması sonucu öldü.", id: "Arbad ibn Qays meninggal karena tersambar petir." }
summary:
  ar: "لما رجع أصحاب أربد إلى أرض بني عامر وسألوه: ما وراءك؟ قال إن محمداً دعاهم إلى عبادة شيء يودّ لو كان عنده ليرميه بالنبل؛ فخرج بعد يوم أو يومين بجمل له فأرسل الله عليه وعلى جمله صاعقة فأحرقتهما. يروي ابن هشام عن زيد بن أسلم عن عطاء بن يسار عن ابن عباس أن آيات من سورة الرعد نزلت في عامر وأربد، ورثاه أخوه لأمه لبيد بقصائد."
  en: "When Arbad's companions reached Banu Amir's land and asked what news he brought, he said Muhammad had called them to worship something he wished he had at hand to shoot with arrows; a day or two later he went out with a camel and God sent a thunderbolt that burned him and the camel. Ibn Hisham reports from Zayd ibn Aslam, from Ata' ibn Yasar, from Ibn Abbas that verses of sura al-Ra'd were revealed about Amir and Arbad; his maternal brother Labid mourned him in several poems."
  es: "Cuando los compañeros de Arbad llegaron a la tierra de Banu Amir y le preguntaron qué noticias traía, él dijo que Mahoma los había llamado a adorar algo que deseaba tener a mano para dispararle con flechas; uno o dos días después salió con un camello y Dios envió un rayo que lo quemó a él y al animal. Ibn Hisham relata, a través de Zayd ibn Aslam, de Ata' ibn Yasar, de Ibn Abbas, que se revelaron versículos de la sura al-Ra'd sobre Amir y Arbad; su hermano materno Labid lo lamentó en varios poemas."
  fr: "Lorsque les compagnons d'Arbad arrivèrent au pays des Banu Amir et lui demandèrent des nouvelles, il leur répondit que Muhammad les avait appelés à adorer une divinité qu'il aurait souhaité avoir sous la main pour la transpercer de flèches. Un ou deux jours plus tard, il partit avec un chameau et Dieu envoya un éclair qui le consuma, lui et son animal. Ibn Hisham rapporte de Zayd ibn Aslam, d'Ata' ibn Yasar et d'Ibn Abbas que des versets de la sourate al-Ra'd furent révélés à propos d'Amir et d'Arbad; son frère maternel, Labid, le pleura dans plusieurs poèmes."
  ur: "جب اربد کے ساتھی بنو عامر کی سرزمین پر پہنچے اور پوچھا کہ وہ کیا خبر لے کر آئے ہیں تو اس نے کہا کہ محمد نے انہیں کسی ایسی چیز کی عبادت کرنے کے لیے بلایا تھا جس کی وہ خواہش کرتا تھا کہ وہ تیر چلاتے۔ ایک یا دو دن بعد وہ ایک اونٹ لے کر نکلا اور خدا نے ایک گرج بھیجی جس نے اسے اور اونٹ کو جلا دیا۔ ابن ہشام نے زید بن اسلم سے، وہ عطاء بن یسار سے، وہ ابن عباس سے روایت کرتے ہیں کہ سورہ رعد کی آیات امیر اور اربد کے بارے میں نازل ہوئیں۔ اس کے ماموں بھائی لبید نے کئی اشعار میں اس کا ماتم کیا۔"
  tr: "Arbad halkı Beni Amir topraklarına döndüğünde ona, \"Ne haber getirdin?\" diye sordular. O da, \"Muhammed, oklarla vurabilmek için sahip olmayı dilediği bir şeye tapınmaları için onları çağırdı\" diye cevap verdi. Bunun üzerine bir iki gün sonra devesiyle birlikte dışarı çıktı ve Allah ona ve devesine yıldırım göndererek ikisini de yaktı. İbn Hişam, Zeyd ibn Aslam'dan, Ata ibn Yasar'dan ve İbn Abbas'tan rivayetle, Amir ve Arbad hakkında Ra'd Suresi'nden ayetlerin indirildiğini ve anne tarafından üvey kardeşi Labid'in onun için mersiyeler yazdığını nakletmiştir."
  id: "Ketika kaum Arbad kembali ke negeri Banu Amir, mereka bertanya kepadanya, \"Berita apa yang kau bawa?\" Ia menjawab, \"Muhammad telah menyeru mereka untuk menyembah sesuatu yang sangat ia inginkan agar dapat ia tembak dengan panah.\" Maka, satu atau dua hari kemudian, ia pergi bersama untanya, dan Allah mengirimkan petir kepadanya dan untanya, membakar mereka berdua. Ibn Hisham meriwayatkan, dari Zayd ibn Aslam, dari Ata ibn Yasar, dari Ibn Abbas, bahwa ayat-ayat dari Surah Ar-Ra'd diturunkan mengenai Amir dan Arbad, dan saudara tirinya dari pihak ibu, Labid, menggubah elegi untuknya."
