id: event/sariyya-of-alqama-to-jeddah
class: event
kind: raid
label: { en: "Alqama ibn Mujazziz's expedition to the Jeddah coast", ar: "سرية علقمة بن مجزز المدلجي إلى سواحل جدة", es: "La expedición de Alqama ibn Mujazziz a la costa de Yeda.", fr: "L'expédition d'Alqama ibn Mujazziz sur la côte de Djeddah" }
summary:
  en: "In Rabi' al-Akhir 9 AH the Prophet sent Alqama ibn Mujazziz al-Mudliji with three hundred men against a band of Abyssinians gathered near the Jeddah coast for piracy against the people of Mecca; he crossed the sea to an island, and they fled when they heard of the Muslims' approach."
  ar: "بعث النبي علقمة بن مجزز المدلجي في ربيع الآخر سنة 9هـ في ثلاثمائة إلى رجال من الحبشة اجتمعوا قرب سواحل جدة للقيام بأعمال القرصنة ضد أهل مكة؛ فخاض علقمة البحر حتى انتهى إلى جزيرة، فلما سمع الحبشة بمسير المسلمين إليهم هربوا."
  es: "En Rabi' al-Akhir 9 AH, el Profeta envió a Alqama ibn Mujazziz al-Mudliji con trescientos hombres contra una banda de abisinios reunidos cerca de la costa de Jeddah para piratear a la gente de La Meca; cruzó el mar hasta una isla, y huyeron cuando oyeron que se acercaban los musulmanes."
  fr: "En Rabi' al-Akhir de l'an 9 de l'Hégire, le Prophète envoya Alqama ibn Mujazziz al-Mudliji avec trois cents hommes contre une bande d'Abyssins rassemblés près de la côte de Djeddah pour commettre des actes de piraterie contre les habitants de La Mecque; il traversa la mer jusqu'à une île, et ils s'enfuirent lorsqu'ils entendirent parler de l'approche des musulmans."
