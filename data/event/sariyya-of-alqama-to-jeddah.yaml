label: { en: "Alqama ibn Mujazziz's expedition to the Jeddah coast", ar: "سرية علقمة بن مجزز المدلجي إلى سواحل جدة" }
summary:
  en: "In Rabi' al-Akhir 9 AH the Prophet sent Alqama ibn Mujazziz al-Mudliji with three hundred men against a band of Abyssinians gathered near the Jeddah coast for piracy against the people of Mecca; he crossed the sea to an island, and they fled when they heard of the Muslims' approach."
  ar: "بعث النبي علقمة بن مجزز المدلجي في ربيع الآخر سنة 9هـ في ثلاثمائة إلى رجال من الحبشة اجتمعوا قرب سواحل جدة للقيام بأعمال القرصنة ضد أهل مكة؛ فخاض علقمة البحر حتى انتهى إلى جزيرة، فلما سمع الحبشة بمسير المسلمين إليهم هربوا."
