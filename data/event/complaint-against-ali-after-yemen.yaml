id: event/complaint-against-ali-after-yemen
class: event
kind: other
label: { ar: "شكوى جند علي بعد اليمن وخطبة النبي: لا تشكوا علياً", en: "The complaint of Ali's troops after Yemen and the Prophet's words: do not complain of Ali", es: "La queja de las tropas de Ali después de Yemen y las palabras del Profeta: no se quejen de Ali.", fr: "Les plaintes des troupes d'Ali après le Yémen et les paroles du Prophète: ne vous plaignez pas d'Ali", ur: "یمن کے بعد علی کے لشکر کی شکایت اور پیغمبر کا یہ فرمان: علی کی شکایت نہ کرو" }
summary:
  ar: "لما أقبل علي من اليمن ليلقى النبي بمكة في حجة الوداع تعجّل إليه واستخلف على جنده رجلاً من أصحابه، فكسا ذلك الرجل كل رجل حلة من البز الذي كان مع علي، فلما دنا الجيش خرج علي فرآهم في الحلل فأمره بنزعها قبل الوصول إلى النبي، فأظهر الجيش شكواه. فقام النبي خطيباً: أيها الناس لا تشكوا علياً، فوالله إنه لأخشن في ذات الله أو في سبيل الله من أن يُشكى. روايتان عند ابن إسحاق: عن يزيد بن طلحة بن ركانة، وعن أبي سعيد الخدري."
  en: "When Ali came up from Yemen to meet the Prophet at Mecca for the Farewell Pilgrimage he hurried ahead, leaving a companion over his troops who clothed every man in a robe from the Yemeni cloth Ali carried; when Ali met the army and saw the robes he ordered them stripped before reaching the Prophet, and the troops voiced their grievance. The Prophet stood and said: people, do not complain of Ali, for by God he is too rough in God's cause to be complained of. Ibn Ishaq gives two reports, from Yazid ibn Talha ibn Rukana and from Abu Sa'id al-Khudri."
  es: "Cuando Ali llegó desde Yemen para encontrarse con el Profeta en La Meca para la Peregrinación de Despedida, se adelantó, dejando a un compañero al mando de sus tropas, quien vistió a cada hombre con una túnica hecha de la tela yemení que Ali llevaba consigo. Cuando Ali se encontró con el ejército y vio las túnicas, ordenó que se las quitaran antes de llegar al Profeta, y las tropas expresaron su descontento. El Profeta se puso de pie y dijo: «Gente, no se quejen de Ali, pues, por Dios, es demasiado firme en la causa de Dios como para que se le pueda quejar». Ibn Ishaq ofrece dos relatos, uno de Yazid ibn Talha ibn Rukana y otro de Abu Sa'id al-Khudri."
  fr: "Lorsqu'Ali arriva du Yémen à La Mecque pour le pèlerinage d'adieu au Prophète, il se hâta, laissant un compagnon à la tête de ses troupes. Ce dernier revêtit chaque homme d'une robe confectionnée dans l'étoffe yéménite qu'Ali portait. À la vue des robes, Ali ordonna aux soldats de les enlever avant de rejoindre le Prophète, et les hommes exprimèrent leur mécontentement. Le Prophète se leva et dit: « Ô gens, ne vous plaignez pas d'Ali, car, par Dieu, il est trop zélé pour la cause divine pour qu'on puisse s'en plaindre. » Ibn Ishaq rapporte deux hadiths, l'un d'après Yazid ibn Talha ibn Rukana et l'autre d'Abu Sa'id al-Khudri."
  ur: "جب علی یمن سے الوداعی حج کے لیے مکہ میں نبی سے ملنے کے لیے آئے تو وہ جلدی سے آگے بڑھے، اپنے ایک ساتھی کو اپنے دستوں پر چھوڑ دیا جس نے ہر آدمی کو یمنی کپڑوں میں سے ایک لباس پہنایا تھا؛ جب علی نے فوج سے ملاقات کی اور لباس کو دیکھا تو نبی تک پہنچنے سے پہلے انہیں اتارنے کا حکم دیا، اور فوج نے اپنی شکایت کا اظہار کیا۔ رسول اللہ نے کھڑے ہو کر فرمایا: لوگو، علی کی شکایت نہ کرو، کیونکہ خدا کی قسم وہ خدا کے نزدیک اس قدر سخت ہیں کہ ان کی شکایت نہیں کی جا سکتی۔ ابن اسحاق نے یزید بن طلحہ بن رکانہ اور ابو سعید خدری سے دو روایتیں نقل کی ہیں۔"
