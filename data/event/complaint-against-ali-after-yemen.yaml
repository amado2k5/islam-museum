label: { ar: "شكوى جند علي بعد اليمن وخطبة النبي: لا تشكوا علياً", en: "The complaint of Ali's troops after Yemen and the Prophet's words: do not complain of Ali" }
summary:
  ar: "لما أقبل علي من اليمن ليلقى النبي بمكة في حجة الوداع تعجّل إليه واستخلف على جنده رجلاً من أصحابه، فكسا ذلك الرجل كل رجل حلة من البز الذي كان مع علي، فلما دنا الجيش خرج علي فرآهم في الحلل فأمره بنزعها قبل الوصول إلى النبي، فأظهر الجيش شكواه. فقام النبي خطيباً: أيها الناس لا تشكوا علياً، فوالله إنه لأخشن في ذات الله أو في سبيل الله من أن يُشكى. روايتان عند ابن إسحاق: عن يزيد بن طلحة بن ركانة، وعن أبي سعيد الخدري."
  en: "When Ali came up from Yemen to meet the Prophet at Mecca for the Farewell Pilgrimage he hurried ahead, leaving a companion over his troops who clothed every man in a robe from the Yemeni cloth Ali carried; when Ali met the army and saw the robes he ordered them stripped before reaching the Prophet, and the troops voiced their grievance. The Prophet stood and said: people, do not complain of Ali, for by God he is too rough in God's cause to be complained of. Ibn Ishaq gives two reports, from Yazid ibn Talha ibn Rukana and from Abu Sa'id al-Khudri."
