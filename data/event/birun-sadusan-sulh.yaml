id: event/birun-sadusan-sulh
class: event
kind: treaty
label: { ar: "صلح البيرون وسدوسان", en: "The Sulh of al-Birun and Sadusan", fr: "Le sulh d'al-Birun et de Sadusan", es: "El Sulh de al-Birun y Sadusan", ur: "البیرون اور سدوسن کی سلح" }
summary:
  ar: "أتى محمد بن القاسم البيرون وكان أهلها بعثوا سنتيين منهم إلى الحجاج فصالحوه فأقاموا لمحمد العلوفة وأدخلوه مدينتهم ووفوا بالصلح وجعل محمد لا يمر بمدينة إلا فتحها حتى عبر نهراً دون مهران فأتاه سمنية سربنديس فصالحوه عمن خلفهم ووظف عليهم الخراج وسار إلى سهبان ففتحها ثم سار إلى مهران فنزل في وسطه فبلغ ذلك داهر واستعد لحربه وبعث محمد بن القاسم محمد بن مصعب بن عبد الرحمن الثقفي إلى سدوسان في خيل وحمرات فطلب أهلها الأمان والصلح وسفر بينه وبينهم السمنية فأمنهم ووظف عليهم خراجاً وأخذ منهم رهناً وانصرف إلى محمد ومعه من الزط أربعة آلاف فصاروا مع محمد وولى سدوسان رجلاً."
  en: "Al-Birun's folk, having already sent envoys who truced with al-Hajjaj, brought fodder and opened their city — and Muhammad let no town pass unconquered. Beyond the river before Mihran, the samaniyya of Sarbindis truced for those behind them at a set kharaj; Sahban fell; at Mihran Dahir prepared. Muhammad ibn Mus'ab al-Thaqafi rode on Sadusan with horse and donkey-men; the samaniyya brokered its aman — kharaj, hostages, and four thousand Zutt who joined the army."
  fr: "Les gens d'al-Birun, qui avaient déjà envoyé des émissaires conclure une trêve avec al-Hajjaj, apportèrent du fourrage et ouvrirent leur ville, et Muhammad ne laissa aucune ville sans la conquérir. Au-delà du fleuve, avant le Mihran, les samaniyya de Sarbindis conclurent une trêve pour ceux qui étaient derrière eux contre un kharaj fixé ; Sahban tomba ; au Mihran, Dahir se prépara. Muhammad ibn Mus'ab al-Thaqafi chevaucha sur Sadusan avec cavaliers et hommes à dos d'âne ; les samaniyya négocièrent son aman : kharaj, otages, et quatre mille Zutt qui rejoignirent l'armée."
  es: "La gente de Al-Birun, que ya había enviado emisarios que hicieron una tregua con al-Hajjaj, trajo forraje y abrió su ciudad; y Muhammad no dejó que ninguna ciudad quedara sin conquistar. Más allá del río, antes de Mihran, la samaniyya de Sarbindis hizo una tregua con los que estaban detrás de ellos en un kharaj establecido; Sahban cayó; en Mihran, Dahir se preparó. Muhammad ibn Mus'ab al-Thaqafi cabalgó sobre Sadusan con hombres a caballo y en burro; la samaniyya negoció su aman: kharaj, rehenes y cuatro mil Zutt que se unieron al ejército."
  ur: "البیرون کے لوگوں نے پہلے ہی ایلچی بھیجے جنہوں نے الحجاج کے ساتھ جنگ کی، چارہ لایا اور اپنا شہر کھول دیا - اور محمد نے کسی بھی شہر کو ناقابل تسخیر گزرنے نہیں دیا۔ مہران سے پہلے دریا سے پرے، سربندیوں کے سامانیہ نے اپنے پیچھے والوں کے لیے ایک مقررہ خوارج پر تڑپ کی۔ سحبان گر گیا مہران داہر میں تیار کیا. محمد بن مصعب ثقفی گھوڑے اور گدھوں کے ساتھ سدوسان پر سوار ہوئے۔ سامانیہ نے اپنے امان کی دلالی کی - خوارج، یرغمالی اور چار ہزار زٹ جو فوج میں شامل ہوئے۔"
