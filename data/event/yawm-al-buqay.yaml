summary:
  ar: "التقت الأوس والخزرج ببقيع الغرقد فاقتتلوا قتالًا شديدًا فكان الظفر يومئذ للواغل الذي يدخل على القوم وهم يشربون {cite:kamil-ibn-al-athir p. 505}."
  en: "At Baqīʿ al-Gharqad the Aws and Khazraj fought hard, and the day went to «the intruder» — the side that fell on the other while they were drinking {cite:kamil-ibn-al-athir p. 505}."
  es: "En Baqīʿ al-Gharqad, los Aws y los Khazraj lucharon con fiereza, y el día fue para «el intruso», el bando que cayó sobre el otro mientras bebían {cite:kamil-ibn-al-athir p. 505}."
  fr: "À Baqīʿ al-Gharqad, les Aws et les Khazraj se sont battus avec acharnement, et la victoire est revenue à « l'intrus » — le camp qui est tombé sur l'autre pendant qu'ils buvaient {cite:kamil-ibn-al-athir p. 505}."
  ur: "بقیع الغرقد میں اوس اور خزرج کے درمیان سخت جنگ ہوئی، اور دن \"گھسنے والے\" کے پاس چلا گیا - جو پیتے ہوئے دوسری طرف گرا تھا۔ 505}۔"
  tr: "Aws ve Khazraj, Baqi' al-Gharqad'da karşılaştılar ve şiddetli bir savaş verdiler. O günkü zafer, halkın içki içtiği sırada aralarına giren işgalcinin oldu. {kaynak: Kamil İbn el-Athir, s. 505}"
  id: "Aws dan Khazraj bertemu di Baqi’ al-Gharqad dan bertempur sengit. Kemenangan hari itu diraih oleh penyusup yang memasuki wilayah penduduk ketika mereka sedang minum. {cite:kamil-ibn-al-athir p. 505}."
