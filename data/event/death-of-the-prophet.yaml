label: { en: "The death of the Prophet", ar: "وفاة النبي" }
summary:
  en: "The Prophet Muhammad died in Medina after a short illness, and was buried in the house of Aisha. وفي الصحيح: أنه قال في مرضه «مروا أبا بكر يصلي بالناس» فلما استمهلته عائشة وحفصة أبى وقال «إنكن لأنتن صواحب يوسف» {cite:sahih-al-bukhari 716}، وأنه كان يسأل «أين أنا غدا؟» حرصاً على بيت عائشة فمات عندها بين سحرها ونحرها بعدما استاك بسواك عبد الرحمن بن أبي بكر {cite:sahih-al-bukhari 4450}، وكان آخر كلامه «في الرفيق الأعلى» {cite:sahih-al-bukhari 4451}، وقال عائشة إنه قال «ما أزال أجد ألم الطعام الذي أكلت بخيبر، فهذا أوان وجدت انقطاع أبهري» {cite:sahih-al-bukhari 4428}."
  ar: "توفي النبي محمد بالمدينة بعد مرض قصير، ودُفن في بيت عائشة."
