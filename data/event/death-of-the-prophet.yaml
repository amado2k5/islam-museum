label: { en: "The death of the Prophet", ar: "وفاة النبي", es: "La muerte del Profeta", fr: "La mort du Prophète" }
summary:
  en: "The Prophet Muhammad died in Medina after a short illness, and was buried in the house of Aisha. وفي الصحيح: أنه قال في مرضه «مروا أبا بكر يصلي بالناس» فلما استمهلته عائشة وحفصة أبى وقال «إنكن لأنتن صواحب يوسف» {cite:sahih-al-bukhari 716}، وأنه كان يسأل «أين أنا غدا؟» حرصاً على بيت عائشة فمات عندها بين سحرها ونحرها بعدما استاك بسواك عبد الرحمن بن أبي بكر {cite:sahih-al-bukhari 4450}، وكان آخر كلامه «في الرفيق الأعلى» {cite:sahih-al-bukhari 4451}، وقال عائشة إنه قال «ما أزال أجد ألم الطعام الذي أكلت بخيبر، فهذا أوان وجدت انقطاع أبهري» {cite:sahih-al-bukhari 4428}."
  ar: "توفي النبي محمد بالمدينة بعد مرض قصير، ودُفن في بيت عائشة."
  es: "El profeta Mahoma murió en Medina tras una breve enfermedad y fue enterrado en casa de Aisha. En Sahih al-Bukhari se narra que, durante su enfermedad, dijo: «Díganle a Abu Bakr que dirija la oración». Cuando Aisha y Hafsa le pidieron que esperara, se negó y dijo: «Son como las mujeres que conspiraron contra José». No dejaba de preguntar: «¿Dónde estaré mañana?», anhelando estar en casa de Aisha. Murió en su presencia, entre su pecho y su cuello, tras usar el siwak (bastón para limpiar los dientes) de Abd al-Rahman ibn Abi Bakr. Sus últimas palabras fueron: «En la más alta compañía». Aisha contó que él dijo: «Todavía siento el dolor de la comida que ingerí en Khaybar, y ahora siento cómo se me secciona la aorta»."
  fr: "Le Prophète Muhammad mourut à Médine après une courte maladie et fut enterré dans la maison d'Aïcha. Dans le Sahih al-Bukhari, il est rapporté que durant sa maladie, il dit: « Dis à Abou Bakr de diriger la prière. » Lorsqu'Aïcha et Hafsa lui demandèrent d'attendre, il refusa et dit: « Vous êtes comme les femmes qui ont conspiré contre Joseph. » Il demandait sans cesse: « Où serai-je demain ? », impatient de se retrouver chez Aïcha. Il mourut en sa présence, entre sa poitrine et son cou, après avoir utilisé le siwak (bâtonnet de nettoyage de dents) d'Abd al-Rahman ibn Abi Bakr. Ses dernières paroles furent: « En compagnie des plus hautes. » Aïcha rapporta qu'il dit: « Je ressens encore la douleur de la nourriture que j'ai mangée à Khaybar, et maintenant j'ai l'impression que mon aorte se rompt. »"
