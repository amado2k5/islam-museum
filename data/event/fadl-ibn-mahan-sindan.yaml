id: event/fadl-ibn-mahan-sindan
class: event
kind: conquest
label: { ar: "آل الفضل بن ماهان بسندان", en: "The House of al-Fadl ibn Mahan at Sindan", es: "La casa de al-Fadl ibn Mahan en Sindan", fr: "La maison d'al-Fadl ibn Mahan à Sindan", ur: "سندان میں الفضل بن مہان کا گھر" }
summary:
  ar: "كان الفضل بن ماهان مولى بني سامة فتح سندان وغلب عليها وبعث إلى المأمون بفيل وكاتبه ودعا له في مسجد جامع اتخذه بها فلما مات قام محمد بن الفضل بن ماهان مقامه فسار في سبعين بارجة إلى ميد الهند فقتل منهم خلقاً وافتتح غالاً ورجع إلى سندان وقد غلب عليها أخ يقال له ماهان بن الفضل وكاتب أمير المؤمنين المعتصم بالله وأهدى إليه ساجاً لم ير مثله عظماً وطولاً وكانت الهند في أمر أخيه فمالوا عليه فقتلوه وصلبوه ثم إن الهند بعد غلبوا على سندان فتبروكوا مسجدها للمسلمين يجمعون فيه ويدعون للخليفة."
  en: "Al-Fadl ibn Mahan, mawla of Banu Sama, took Sindan and held it — sent al-Ma'mun an elephant, wrote him, and prayed for him in a jami' mosque he built there. His son Muhammad sailed seventy bawarij to Mayd al-Hind, slew many and returned — to find his brother Mahan had seized Sindan; Mahan wrote al-Mu'tasim and gifted a teak plank unmatched for size. The Hind faction in his brother's affair turned, killed and crucified him, then took Sindan and broke its mosque where Muslims had prayed for the caliph."
  es: "Al-Fadl ibn Mahan, mawla de Banu Sama, tomó Sindan y la mantuvo bajo su control; envió un elefante a al-Ma'mun, le escribió y oró por él en una mezquita que construyó allí. Su hijo Muhammad navegó con setenta bawarij a Mayd al-Hind, mató a muchos y regresó, solo para encontrar que su hermano Mahan se había apoderado de Sindan. Mahan escribió a al-Mu'tasim y le obsequió una tabla de teca de tamaño inigualable. La facción de Hind, en conflicto con su hermano, lo mató y crucificó, luego tomó Sindan y destruyó la mezquita donde los musulmanes habían orado por el califa."
  fr: "Al-Fadl ibn Mahan, mawla des Banu Sama, s'empara du Sindan et le conserva. Il envoya un éléphant à al-Ma'mun, lui écrivit et pria pour lui dans une mosquée jami' qu'il y avait fait construire. Son fils, Muhammad, mena soixante-dix bawarij à Mayd al-Hind, en massacra un grand nombre et revint, découvrant que son frère Mahan avait conquis le Sindan. Mahan écrivit à al-Mu'tasim et lui offrit une planche de teck d'une taille inégalée. La faction Hind impliquée dans l'affaire de son frère se retourna, le tua et le crucifia, puis prit le Sindan et détruisit la mosquée où les musulmans avaient prié pour le calife."
  ur: "بنو سماع کے مولا الفضل بن مہان نے سندان کو پکڑ لیا اور اس نے المامون کو ایک ہاتھی بھیجا، اسے لکھا، اور اس نے وہاں بنوائی ہوئی جامع مسجد میں اس کے لیے دعا کی۔ اس کے بیٹے محمد نے ستر باوارج کو مید الہند کی طرف روانہ کیا، بہت سے لوگوں کو قتل کیا اور واپس آیا - یہ معلوم کرنے کے لیے کہ اس کے بھائی مہان نے سندان پر قبضہ کر لیا ہے۔ ماہان نے المعتصم لکھا اور ساگون کا ایک تختہ تحفے میں دیا جس کا سائز کے لحاظ سے کوئی مقابلہ نہیں تھا۔ اس کے بھائی کے معاملے میں ہند دھڑے نے پلٹا، اسے قتل کیا اور سولی پر چڑھا دیا، پھر سندان پر قبضہ کر لیا اور اس کی مسجد کو توڑ دیا جہاں مسلمانوں نے خلیفہ کے لیے نماز ادا کی تھی۔"
