label: { ar: "ملك علي بن غانية بلاد إفريقية", en: "Ali ibn Ghaniya takes Ifriqiya", es: "Ali ibn Ghaniya toma Ifriqiya", fr: "Ali ibn Ghaniya prend l'Ifriqiya", ur: "علی ابن ثنیہ عفریقیہ لیتے ہیں۔", tr: "Afrika topraklarının Kralı Ali bin Ganalı", id: "Raja Ali bin Ghaniya dari tanah Afrika" }
summary:
  ar: "في سنة إحدى وثمانين وخمسمائة سار علي بن إسحاق الملثم بن غانية إلى إفريقية فاجتمع إليه سليم ورياح ومن هناك من العرب وانضاف إليهم الأتراك الذين دخلوا من مصر مع شرف الدين قراقوش، ولقبوه أمير المسلمين، فملكوا إفريقية جميعها شرقاً وغرباً إلا تونس والمهدية حيث أقام الموحدون على خوف وضيق، وخربوا البلاد والحصون والقرى وهتكوا الحرم وقطعوا الأشجار، وقصد جزيرة باشراوهي قرب تونس فأمّن أهلها ثم نهب العسكر أموالها حتى سلب الناس ثيابهم، وقصدوا تونس فكان الضعفاء يستعطون حتى أهلكهم برد الشتاء والوباء فأُحصي الموتى فكانوا اثني عشر ألفاً من وضع واحد، وقطع الملثم خطبة أولاد عبد المؤمن وخطب للخليفة العباسي الناصر لدين الله وأرسل إليه يطلب الخلع والأعلام السود {cite:kamil-ibn-al-athir p. 136-137}."
  en: "In the year 581, Ali ibn Ishaq al-Mulaththam ibn Ghaniya marched to Ifriqiya. Sulaym, Riyah and other Arab groups gathered to him there, and Turks who had entered from Egypt with Sharaf al-Din Qaraqush joined them. They gave him the title Amir al-Muslimin and together took all of Ifriqiya, east and west, except Tunis and Mahdiya, where the Muwahhidun remained in fear and hardship. They ravaged the lands, fortresses and villages, violated sanctities and cut down trees. They made for the island of Bashrawhi near Tunis, whose people were granted safety, but then the army plundered its wealth until people were stripped of their clothes. They then made for Tunis, where the poor went begging until the winter cold and disease destroyed them; the dead were counted at 12,000 from a single place. Al-Mulaththam ended the khutba for the sons of Abd al-Mu'min, proclaimed the Abbasid caliph al-Nasir li-Din Allah, and sent to him asking for robes of investiture and black banners {cite:kamil-ibn-al-athir p. 136-137}."
  es: "En el año 581, Ali ibn Ishaq al-Mulaththam ibn Ghaniya marchó hacia Ifriqiya. Allí se le unieron Sulaym, Riyah y otros grupos árabes, así como turcos que habían entrado desde Egipto con Sharaf al-Din Qaraqush. Le otorgaron el título de Amir al-Muslimin y juntos conquistaron toda Ifriqiya, tanto el este como el oeste, excepto Túnez y Mahdiya, donde los Muwahhidun permanecieron atemorizados y sufriendo penurias. Saquearon las tierras, fortalezas y aldeas, profanaron lugares sagrados y talaron árboles. Se dirigieron a la isla de Bashrawhi, cerca de Túnez, a cuyos habitantes se les concedió protección, pero luego el ejército saqueó sus riquezas hasta despojarlos de sus ropas. Después se dirigieron a Túnez, donde los pobres mendigaron hasta que el frío del invierno y las enfermedades acabaron con ellos; se contabilizaron 12.000 muertos en un solo lugar. Al-Mulaththam terminó la jutba para los hijos de Abd al-Mu'min, proclamó al califa abasí al-Nasir li-Din Allah, y le envió a pedirle túnicas de investidura y estandartes negros {cite:kamil-ibn-al-athir p. 136-137}."
  fr: "En 581, Ali ibn Ishaq al-Mulaththam ibn Ghaniya marcha sur l'Ifriqiya. Sulaym, Riyah et d'autres groupes arabes se rallièrent à lui, rejoints par des Turcs venus d'Égypte avec Sharaf al-Din Qaraqush. Ils lui conférèrent le titre d'Amir al-Muslimin et s'emparèrent de toute l'Ifriqiya, à l'est comme à l'ouest, à l'exception de Tunis et de Mahdiya, où les Muwahhidun vécurent dans la peur et la misère. Ils ravagèrent les terres, les forteresses et les villages, profanèrent les lieux saints et abattirent les arbres. Ils se dirigèrent vers l'île de Bashrawhi, près de Tunis, dont les habitants trouvèrent refuge, mais l'armée pilla ensuite ses richesses jusqu'à les dépouiller de leurs vêtements. Ils marchèrent ensuite sur Tunis, où les pauvres se mirent à mendier jusqu'à ce que le froid et les maladies hivernales les déciment; on dénombra 12 000 morts dans un seul lieu. Al-Mulaththam termina le khutba pour les fils d'Abd al-Mu'min, proclama le calife abbasside al-Nasir li-Din Allah et lui envoya demander des robes d'investiture et des bannières noires {cite:kamil-ibn-al-athir p. 136-137}."
  ur: "581ء میں علی ابن اسحاق الملثم ابن غنیہ نے عفریقیہ کی طرف کوچ کیا۔ سلیم، ریا اور دوسرے عرب گروہ وہاں اس کے پاس جمع ہوئے اور وہ ترک جو مصر سے شرف الدین قراقش کے ساتھ داخل ہوئے تھے ان کے ساتھ شامل ہوگئے۔ انہوں نے آپ کو امیر المسلمین کا لقب دیا اور تیونس اور مہدیہ کے علاوہ تمام افریقیہ، مشرق و مغرب پر قبضہ کر لیا، جہاں مجاہدین خوف اور پریشانی میں مبتلا رہے۔ انہوں نے زمینوں، قلعوں اور دیہاتوں کو تباہ کیا، مقدسات کو پامال کیا اور درختوں کو کاٹ دیا۔ انہوں نے تیونس کے قریب بشراوی جزیرے کے لیے بنایا، جس کے لوگوں کو تحفظ فراہم کیا گیا، لیکن پھر فوج نے اس کی دولت لوٹ لی یہاں تک کہ لوگوں کے کپڑے اتار لیے گئے۔ اس کے بعد انہوں نے تیونس کا رخ کیا، جہاں غریب لوگ بھیک مانگنے جاتے تھے یہاں تک کہ سردیوں کی سردی اور بیماری نے انہیں تباہ کر دیا۔ ایک ہی جگہ سے مرنے والوں کی تعداد 12,000 تھی۔ ملثثم نے عبد المومن کے بیٹوں کے لیے خطبہ ختم کیا، عباسی خلیفہ النصیر لدین اللہ کا اعلان کیا، اور اس کے پاس سرمایہ کاری کے لباس اور سیاہ بینرز مانگنے کے لیے بھیجے {حوالہ: کامل ابن الاثیر ص۔ 136-137}۔"
  tr: "Hicri 581 yılında Ali ibn İshak el-Mulatham ibn Ganiye, İfrikya'ya yürüdü. Oradan Salim, Riyye ve bazı Araplar ona katıldı ve Mısır'dan Şaraf el-Din Karakuş ile gelen Türkler de onlara katıldı. Ona Müslümanların Emiri dediler ve Tunus ve Mehdi hariç, İfrikya'nın doğu ve batısını yönettiler; Tunus ve Mehdi'de ise El-Muhadlar korku ve sıkıntı içinde kaldılar. Ülkeleri, kaleleri ve köyleri yıktılar, kutsal yerlerin kutsallığını ihlal ettiler ve ağaçları kestiler. Tunus yakınlarındaki Başrave adasına gittiler ve sakinlerine güvenli geçiş sağladılar, ardından orduları adanın zenginliklerini yağmaladı ve insanları elbiselerinden soydu. Tunus'a gittiler ve zayıflar dilenmeye mecbur kaldılar, ta ki kışın soğuğu ve veba yüzünden ölene kadar. Ölüler sayıldı ve bir yerden on iki bin kişi olduğu tespit edildi. El-Mulatham, Abdülmümin'in oğulları adına hutbeyi durdurdu ve hutbe Abbasi Halifesi el-Nasır li-Din Allah adına verildi; ayrıca ona şeref elbiseleri ve siyah sancaklar istemek üzere elçiler gönderdi. {Kaynak: Kamil ibn el-Athir, s. 136-137}"
  id: "Pada tahun 581 H, Ali ibn Ishaq al-Mulatham ibn Ghaniya bergerak ke Ifriqiya. Salim, Riyyah, dan beberapa orang Arab dari sana bergabung dengannya, dan orang-orang Turki yang datang dari Mesir bersama Sharaf al-Din Qaraqush ikut bergabung. Mereka menyebutnya sebagai Amir Muslim, dan mereka memerintah seluruh Ifriqiya, timur dan barat, kecuali Tunis dan Mahdia, tempat Almohad tetap hidup dalam ketakutan dan kesusahan. Mereka menghancurkan negara, benteng, dan desa, melanggar kesucian tempat-tempat suci, dan menebang pohon-pohon. Mereka pergi ke pulau Bashrawah, yang dekat dengan Tunis, dan memberi penduduknya jalan aman, kemudian pasukan menjarah kekayaan mereka hingga mereka menelanjangi orang-orang. Mereka pergi ke Tunis, dan orang-orang lemah terpaksa mengemis hingga mereka mati kedinginan dan terkena wabah penyakit. Mayat-mayat dihitung, dan jumlahnya mencapai dua belas ribu dari satu tempat. Al-Mulatham menghentikan khutbah atas nama putra-putra Abd al-Mu'min dan khutbah tersebut disampaikan atas nama Khalifah Abbasiyah al-Nasir li-Din Allah, dan dia mengirimkan utusan kepadanya untuk meminta jubah kehormatan dan panji-panji hitam. {kutip:kamil-ibn-al-athir hlm. 136-137}."
