id: event/ahmad-ibn-yahya-reaches-al-hisn-and-the-yaam-submit-to-him-on-7-shawwal-295
class: event
kind: other
label:
  ar: "أحمد بن يحيى يصل الحصن وتقبل يأم أمانه، 7 شوال سنة 295هـ، ص354"
  en: "Ahmad ibn Yahya reaches al-Hisn and the Ya'am submit to him, 7 Shawwal 295 AH, p. 354"
  ur: "احمد بن یحییٰ کا الحصن پہنچنا اور یأم کا اس کی امان قبول کرنا، 7 شوال 295ھ، ص354"
summary:
  ar: "في السابع من شوال سنة 295هـ أرسل الهادي ابنه أحمد بن يحيى في ثلاثمائة راجل وعشرين فارساً مقدمة، فنزل بالحصن، فأقبلت يأم بالطاعة إليه، فأمّنها وأصلح أمور همدان."
  en: "On 7 Shawwal 295 al-Hadi sent his son Ahmad ibn Yahya ahead with three hundred foot and twenty horse, and ordered him to take position at al-Hisn. The Ya'am came to him in submission and he granted them safety, settling the affairs of Hamdan before al-Hadi arrived."
  ur: "7 شوال 295ھ کو ہادی نے اپنے بیٹے احمد بن یحییٰ کو تین سو پیادہ اور بیس سوار کے ہراول کے ساتھ آگے بھیجا اور الحصن میں ٹھہرنے کا حکم دیا۔ یأم اطاعت کے ساتھ اس کے پاس آئے، اس نے انہیں امان دی اور ہادی کی آمد سے پہلے ہمدان کے معاملات درست کیے۔"
