label: { ar: "وقعة أنيجة ومقتل ابن الكلاعي", en: "The battle of Anija and the killing of Ibn al-Kila'i", fr: "La bataille d'Anija et la mort d'Ibn al-Kila'i", es: "La batalla de Anija y el asesinato de Ibn al-Kila'i.", ur: "عنیزہ کی جنگ اور ابن الکلعی کا قتل", tr: "Anijah Muharebesi ve İbn el-Kala'i'nin öldürülmesi", id: "Perang Anijah dan pembunuhan Ibn al-Kala'i" }
summary:
  ar: "وقعة أنيجة يوم الخميس لعشر بقين من ذي الحجة سنة 634هـ قتل بها الحافظ أبو الربيع الكلاعي ولم يزل متقدماً أمام الصفوف زحفاً إلى الكفار مقبلاً على العدو ينادي بالمنهزمين «أعن الجنة تفرون» حتى قتل صابراً محتسباً، وكان دائماً يقول إن منتهى عمره سبعون سنة لرؤيا رآها في صغره فكان كذلك، ورثاه تلميذه ابن الأبار بقصيدته الميمية الشهيرة {cite:nafh-tib-maqqari p. 477}."
  en: "The battle of Anija, Thursday end of Dhu'l-Hijja 634, where the hafiz Abu'l-Rabi al-Kila'i was killed still urging the routed 'are you fleeing Paradise?' — mourned by his pupil Ibn al-Abbar in the famous mimiya {cite:nafh-tib-maqqari p. 477}."
  fr: "La bataille d'Anija, un jeudi de la fin de Dhu'l-Hijja 634, où le hafiz Abu'l-Rabi al-Kila'i fut tué en exhortant encore les fuyards : « fuyez-vous le Paradis ? » ; son disciple Ibn al-Abbar le pleura dans la célèbre mimiyya {cite:nafh-tib-maqqari p. 477}."
  es: "La batalla de Anija, el jueves final de Dhu'l-Hijja 634, donde el hafiz Abu'l-Rabi al-Kila'i fue asesinado mientras aún instaba a los derrotados \"¿estáis huyendo del Paraíso?\", lamentado por su discípulo Ibn al-Abbar en la famosa mimiya {cite:nafh-tib-maqqari p. 477}."
  ur: "عنیزہ کا معرکہ، جمعرات کے آخر میں ذوالحجہ 634، جہاں حافظ ابو الربیٰ الکلائی مارا گیا تھا، وہ اب بھی رونے والوں سے کہہ رہا تھا کہ کیا تم جنت سے بھاگ رہے ہو؟ - اپنے شاگرد ابن العبر نے مشہور ممیّہ میں ماتم کیا۔ 477}۔"
  tr: "Anijah Muharebesi, Hicri 634 yılının Zilhicce ayının onuncu günü Perşembe günü gerçekleşti. Bu muharebede, ezberci Ebu el-Rabi' el-Kala'i öldürüldü. Öldürülene kadar, safların önünde ilerleyerek, kâfirlere doğru sürünerek, düşmana karşı durarak, yenilenlere \"Cennetten mi kaçıyorsunuz?\" diye seslenerek, sabırla ve umutla savaştı. Gençliğinde gördüğü bir rüyaya dayanarak, ömrünün yetmiş yıl süreceğini söylerdi ve öyle de oldu. Öğrencisi İbn el-Abber, onu Mim mektubunda ünlü şiiriyle yas tuttu. {Kaynak: Nafh-tib-makqari s. 477}"
  id: "Perang Anijah terjadi pada hari Kamis, tanggal sepuluh Dzul Hijjah tahun 634 H. Di dalamnya, penghafal Al-Qur'an Abu al-Rabi' al-Kala'i gugur. Ia masih maju di depan barisan, merangkak menuju orang-orang kafir, menghadapi musuh, menyerukan kepada yang kalah, \"Apakah kalian melarikan diri dari Surga?\" hingga ia gugur, dengan sabar dan penuh harapan. Ia selalu mengatakan bahwa akhir hidupnya adalah tujuh puluh tahun, berdasarkan penglihatan yang ia lihat di masa mudanya, dan memang demikianlah adanya. Muridnya, Ibn al-Abbar, meratapinya dengan puisi terkenalnya dalam surat mim. {cite:nafh-tib-maqqari p. 477}."
