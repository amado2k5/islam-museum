summary:
  ar: "عند البلاذري: ولّى الوليد بن عبد الملك أخاه سليمان بن عبد الملك جند فلسطين فنزل اللد ثم أحدث مدينة الرملة ومصّرها وكان أول ما بنى منها قصره والدار التي تعرف بدار الصباغين وجعل في الدار صهريجاً متوسطاً لها ثم اختط للمسجد خطته وبناه فولي الخلافة قبل استتامه ثم بنى فيه بعد في خلافته ثم أتمه عمر بن عبد العزيز ونقص من الخطة وقال أهل الرملة يكتفون بهذا المقدار الذي اقتصرت بهم عليه؛ ولما بنى سليمان لنفسه أذن للناس في البناء فبنوا واحتفر لأهل الرملة قناتهم التي تدعى بردة واحتفر آباراً وولي النفقة على بنائه بالرملة ومسجد الجماعة كاتباً له نصرانياً من أهل اللد يقال له البطريق بن النكا؛ ولم تكن مدينة الرملة قبل سليمان وكان موضعها رملة؛ وكان بنو أمية ينفقون على آبارها وقناتها بعد سليمان فلما استخلف بنو العباس أنفقوا عليها وكان الأمر في تلك النفقة يخرج كل سنة من خليفة بعد خليفة فلما استخلف المعتصم أسجل بتلك النفقة سجلاً فصارت جارية يُحتسب بها المتآل."
  en: "In al-Baladhuri: al-Walid ibn Abd al-Malik gave his brother Sulayman command of the Filastin jund, and he settled at Lydda then founded the city of al-Ramla and made it an amsar — the first thing he built being his palace and the house known as Dar al-Sabbaghin with a central cistern, then he laid out the mosque's plan and built it, taking the caliphate before completing it and finishing it in his reign, Umar ibn Abd al-Aziz completing it while reducing the plan, saying 'the people of al-Ramla are content with this measure'; when Sulayman built for himself he gave people leave to build and they did, digging the canal called Barada and wells for them, a Christian clerk of Lydda named al-Batriq ibn al-Nakka overseeing the expenditure on the works and the congregational mosque; the city of al-Ramla did not exist before Sulayman, its site being a sandy tract; the Umayyads spent on its wells and canal after him, then the Abbasids did likewise, the charge issuing yearly from caliph to caliph until al-Mu'tasim entered it in the register, whence it became a standing annuity reckoned to the claimants."
  es: "En al-Baladhuri: al-Walid ibn Abd al-Malik le dio a su hermano Sulayman el mando del Filastin jund, y este se estableció en Lydda, luego fundó la ciudad de al-Ramla y la convirtió en un amsar; lo primero que construyó fue su palacio y la casa conocida como Dar al-Sabbaghin con una cisterna central, luego trazó el plano de la mezquita y la construyó, tomando el califato antes de completarla y terminándola durante su reinado, Umar ibn Abd al-Aziz la completó mientras reducía el plano, diciendo 'la gente de al-Ramla está contenta con esta medida'; cuando Sulayman construyó para sí mismo, dio permiso a la gente para construir y lo hicieron, cavando el canal llamado Barada y pozos para ellos, un escribano cristiano de Lydda llamado al-Batriq ibn al-Nakka supervisando el gasto en las obras y la mezquita congregacional; la ciudad de al-Ramla no existía antes de Sulayman, su sitio era un terreno arenoso; Los omeyas invirtieron en sus pozos y canales después de él, luego los abasíes hicieron lo mismo, y el cargo se emitía anualmente de califa a califa hasta que al-Mu'tasim lo registró, momento a partir del cual se convirtió en una renta vitalicia que se contabilizaba para los reclamantes."
  fr: "Dans al-Baladhuri: al-Walid ibn Abd al-Malik confia à son frère Sulayman le commandement du Filastin jund, et celui-ci s'installa à Lydda, puis fonda la ville d'al-Ramla et en fit un amsar. La première chose qu'il construisit fut son palais et la maison connue sous le nom de Dar al-Sabbaghin, dotée d'une citerne centrale. Ensuite, il conçut les plans de la mosquée et la fit construire, s'emparant du califat avant de l'achever. Il la termina durant son règne, Umar ibn Abd al-Aziz la complétant tout en réduisant les plans, déclarant: « Les habitants d'al-Ramla sont satisfaits de cette mesure. » Lorsque Sulayman entreprit la construction pour lui-même, il autorisa les gens à construire, ce qu'ils firent, creusant pour eux le canal appelé Barada et des puits. Un clerc chrétien de Lydda nommé al-Batriq ibn al-Nakka supervisait les dépenses liées aux travaux et à la mosquée du vendredi. La ville d'al-Ramla n'existait pas avant Sulayman, son emplacement étant une étendue sablonneuse; les Omeyyades ont dépensé pour ses puits et son canal après lui, puis les Abbassides ont fait de même, la charge étant transmise annuellement de calife en calife jusqu'à ce qu'al-Mu'tasim l'inscrive dans le registre, d'où elle est devenue une rente permanente due aux demandeurs."
  ur: "البلادوری میں ہے: الولید بن عبد الملک نے اپنے بھائی سلیمان کو فلاسطین جند کی کمان دی، اور وہ لدہ میں آباد ہوا پھر الرملہ شہر کی بنیاد رکھی اور اسے ایک عمار بنایا - سب سے پہلے اس نے اپنا محل بنایا اور ایک مرکزی حوض کے ساتھ دار الصباغین کے نام سے مشہور گھر بنایا، پھر اس نے مسجد کی تعمیر کی اور اس سے پہلے مسجد کی تعمیر کی۔ عمر بن عبد العزیز نے اسے مکمل کیا اور اسے اپنے دور حکومت میں مکمل کیا اور اس منصوبے کو کم کرتے ہوئے کہا کہ 'الرملہ کے لوگ اس اقدام سے مطمئن ہیں'۔ جب سلیمان نے اپنے لیے تعمیر کروائی تو اس نے لوگوں کو تعمیر کرنے کی اجازت دی اور انہوں نے بردہ نامی نہر کی کھدائی اور ان کے لیے کنوئیں کھودنے کا کام کیا، لدہ کا ایک عیسائی عالم بطریق ابن النکہ نامی کاموں اور مسجد کی مسجد کے اخراجات کی نگرانی کرتا تھا۔ رملہ کا شہر سلیمان سے پہلے موجود نہیں تھا، اس کا مقام ریتلی راستہ تھا۔ امویوں نے ان کے بعد اس کے کنوئیں اور نہر پر خرچ کیا، پھر عباسیوں نے بھی ایسا ہی کیا، خلیفہ سے خلیفہ تک ہر سال چارج جاری کیا جاتا تھا یہاں تک کہ المعتصم نے اسے رجسٹر میں درج کیا، جس سے یہ دعویداروں کے لیے مستقل سالانہ بن گیا۔"
  tr: "El-Baladhuri'ye göre: El-Walid ibn Abdülmalik, kardeşi Süleyman ibn Abdülmalik'i Filistin ordusunun valisi olarak atadı. Lod'a yerleşti, sonra Ramla şehrini kurdu ve surlarla çevirdi. İlk olarak sarayını ve Boyacılar Evi olarak bilinen evi inşa etti. Evin ortasına bir su deposu yaptırdı. Sonra cami için bir plan çizdi ve inşa etti. Tamamlanmadan önce halifeliği üstlendi. Sonra halifeliğinden sonra camiye yapılar inşa etti. Ardından Ömer ibn Abdülaziz camiyi tamamladı ve planı küçülttü. Ramla halkı, Süleyman'ın kendilerine belirlediği bu miktarla yetineceklerini söylediler. Süleyman kendi için inşa ettiğinde, halka da inşa etme izni verdi ve onlar da inşa ettiler. Ramla halkı için Burda adı verilen kanalı ve kuyuları kazdı. Süleyman, Ramla'daki binasının ve cemaat camisinin masraflarını üstlendi ve Lod halkından El-Batrik ibn El-Naka adında bir Hristiyan kâtibi görevlendirdi. Süleyman'dan önce Ramla şehri yoktu ve yeri Ramla idi. Süleyman'dan sonra Emeviler, kuyularına ve su kanalına para harcarlardı. Onların yerine geçen Abbasiler de aynı harcamaları yapmaya devam ettiler. Bu harcamaların miktarı her yıl halifeler arasında kayıt altına alınırdı. El-Mu'tasim onun yerine geçtiğinde, bu harcamaları bir deftere kaydetti ve bu, halef tarafından hesap verilen kamuya açık bir işlem haline geldi."
  id: "Menurut Al-Baladhuri: Al-Walid ibn Abd al-Malik menunjuk saudaranya Sulayman ibn Abd al-Malik sebagai gubernur pasukan Palestina. Ia menetap di Lod, kemudian mendirikan kota Ramla dan membentenginya. Hal pertama yang dibangunnya adalah istananya dan rumah yang dikenal sebagai Rumah Para Pencelup. Ia menempatkan sebuah sumur di tengah rumah. Kemudian ia membuat rencana untuk masjid dan membangunnya. Ia mengambil alih kekhalifahan sebelum masjid itu selesai dibangun. Kemudian ia membangun di dalamnya setelah masa kekhalifahannya berakhir. Kemudian Umar ibn Abd al-Aziz menyelesaikannya dan mengurangi rencana tersebut. Penduduk Ramla mengatakan bahwa mereka akan puas dengan jumlah yang telah dibatasinya. Ketika Sulayman membangun untuk dirinya sendiri, ia memberi izin kepada orang-orang untuk membangun, sehingga mereka pun membangun. Ia menggali kanal untuk penduduk Ramla yang disebut Burda dan ia menggali sumur-sumur. Ia bertanggung jawab atas pengeluaran untuk bangunannya di Ramla dan masjid komunitas, menunjuk seorang juru tulis Kristen dari penduduk Lod bernama Al-Batriq ibn Al-Naka. Kota Ramla tidak ada sebelum Sulaiman, dan lokasinya adalah Ramla. Dinasti Umayyah biasa mengeluarkan biaya untuk sumur dan kanal setelah Sulaiman. Ketika Dinasti Abbasiyah menggantikan mereka, mereka juga mengeluarkan biaya untuk itu. Masalah pengeluaran itu dikeluarkan setiap tahun dari satu khalifah ke khalifah berikutnya. Ketika al-Mu'tasim menggantikannya, ia mencatat pengeluaran itu dalam sebuah register, dan itu menjadi proses publik yang dipertanggungjawabkan oleh penerusnya."
