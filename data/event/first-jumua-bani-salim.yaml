label: { ar: "أول جمعة ببني سالم", en: "The first Friday prayer at Banu Salim", es: "La primera oración del viernes en Banu Salim", fr: "La première prière du vendredi à Banu Salim", ur: "بنو سالم میں جمعہ کی پہلی نماز", tr: "Bani Salem'de İlk Cuma", id: "Jumat Pertama di Bani Salem" }
summary:
  ar: "أول جمعة صليت في الإسلام: سار النبي من قباء يوم الجمعة ارتفاع النهار والأنصار يتعلقون بزمام راحلته فيقول خلوا عنها فإنها مأمورة حتى أدركته الصلاة في بني سالم فصلى بهم، وكان ذلك في بطن الوادي المعروف بوادي رانوناء، وهذا موضع تنازع الفقهاء في العدد الذي تتم بهم صلاة الجمعة فذهب الشافعي في آخرين معه إلى أنها لا تجب إقامتها حتى يكونوا أربعين فصاعداً وخالفه غيره من فقهاء أهل الكوفة {cite:muruj-al-dhahab p. 577-578}."
  en: "The first Friday prayer in Islam — the camel 'commanded' forward through the Ansar's pleas until the hour caught him among Banu Salim in Wadi Ranuna' — and the jurists' standing dispute over the Friday quorum, al-Shafi'i holding to forty, the Kufans otherwise {cite:muruj-al-dhahab p. 577-578}."
  es: "La primera oración del viernes en el Islam —el camello 'ordenado' a avanzar a través de las súplicas de los Ansar hasta que la hora lo sorprendió entre los Banu Salim en Wadi Ranuna'— y la disputa permanente de los juristas sobre el quórum del viernes, al-Shafi'i sosteniendo cuarenta, los Kufanos en su lugar {cite:muruj-al-dhahab p. 577-578}."
  fr: "La première prière du vendredi en Islam — le chameau « commandé » en avant malgré les supplications des Ansar jusqu'à ce que l'heure le surprenne parmi les Banu Salim à Wadi Ranuna' — et la dispute permanente des juristes sur le quorum du vendredi, al-Shafi'i s'appuyant sur quarante, les Kufans autrement {cite:muruj-al-dhahab p. 577-578}."
  ur: "اسلام میں سب سے پہلے جمعہ کی نماز - انصار کی درخواستوں کے ذریعے اونٹ کو 'حکم' دیا گیا یہاں تک کہ گھڑی اسے بنو سلیم کے درمیان وادی رانونہ میں پکڑ لے - اور جمعہ کے کورم پر فقہاء کا اختلاف، شافعی نے چالیس کو پکڑا، کوفانی دوسری صورت میں {حوالہ: مروج الذہب صفحہ 577-578}۔"
  tr: "İslam'da kılınan ilk Cuma namazı: Peygamberimiz Cuma günü öğle vakti Kuba'dan yola çıktı. Ensar, binek hayvanının dizginlerini tutuyordu. Peygamberimiz, \"Bırakın, çünkü bu farzdır\" dedi. Beni Salim'de namaz vakti gelince onlarla birlikte namaz kıldı. Bu olay, Vadi Ranuna olarak bilinen vadide gerçekleşti ve burası, Cuma namazının kaç kişiyle kılınacağı konusunda hukukçuların ihtilafa düştüğü yerdir. Şafiî ve diğerleri, kırk veya daha fazla kişi olmadıkça kılınmasının farz olmadığını savundular; Kufa halkının diğer hukukçuları ise onunla aynı fikirde değildi. {kaynak: Muruj-al-dhahab s. 577-578}"
  id: "Salat Jumat pertama yang dilakukan dalam Islam: Nabi berangkat dari Quba pada hari Jumat, tengah hari, dan kaum Ansar memegang kendali kudanya, lalu beliau berkata, “Lepaskanlah, karena itu diperintahkan,” hingga waktu salat tiba di Bani Salim, dan beliau salat bersama mereka. Ini terjadi di lembah yang dikenal sebagai Wadi Ranuna, dan di sinilah para ahli fiqih memperdebatkan jumlah orang yang sah untuk salat Jumat. Al-Shafi’i dan yang lainnya berpendapat bahwa tidak wajib mendirikannya kecuali jika jumlah orangnya empat puluh atau lebih, dan ahli fiqih lainnya dari penduduk Kufa tidak setuju dengannya. {cite:muruj-al-dhahab hlm. 577-578}."
