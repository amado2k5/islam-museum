summary:
  ar: "أول جمعة صليت في الإسلام: سار النبي من قباء يوم الجمعة ارتفاع النهار والأنصار يتعلقون بزمام راحلته فيقول خلوا عنها فإنها مأمورة حتى أدركته الصلاة في بني سالم فصلى بهم، وكان ذلك في بطن الوادي المعروف بوادي رانوناء، وهذا موضع تنازع الفقهاء في العدد الذي تتم بهم صلاة الجمعة فذهب الشافعي في آخرين معه إلى أنها لا تجب إقامتها حتى يكونوا أربعين فصاعداً وخالفه غيره من فقهاء أهل الكوفة {cite:muruj-al-dhahab p. 577-578}."
  en: "The first Friday prayer in Islam — the camel 'commanded' forward through the Ansar's pleas until the hour caught him among Banu Salim in Wadi Ranuna' — and the jurists' standing dispute over the Friday quorum, al-Shafi'i holding to forty, the Kufans otherwise {cite:muruj-al-dhahab p. 577-578}."
