id: event/abu-al-qasim-ibn-al-hadi-verses-on-prison-and-kinship-with-al-husayn-290
class: event
kind: other
label:
  ar: "أبيات أبي القاسم في الحبس والتأسي بالحسين وحمزة، ص262-263، 290هـ"
  en: "Abu al-Qasim's verses on prison and the example of al-Husayn and Hamza, pp. 262-263, 290 AH"
  fr: "Vers d’Abu al-Qasim sur la prison et l’exemple d’al-Husayn et de Hamza, p. 262-263, 290 de l’hégire"
  ur: "قید اور حسین و حمزہ کی مثال پر ابو القاسم کے اشعار، ص262-263، 290ھ"
  es: "Versículos de Abu al-Qasim sobre la prisión y el ejemplo de al-Husayn y Hamza, págs. 262-263, 290 AH"
  tr: "Ebu el-Kâsım'ın hapis ve Hüseyin ile Hamza'dan teselli bulma üzerine yazdığı dizeler, s. 262-263, 290 Hicri"
  id: "Ayat-ayat Abu al-Qasim tentang penjara dan mencari penghiburan dalam kitab al-Husayn dan Hamza, hlm. 262-263, 290 H."
summary:
  ar: "مقطوعات يقول فيها أبو القاسم لخصومه اقتلوا أو أسروا فلنا في الجنة عوض، ثم يقول إنه في الحبس قرير العين، ويذكر الحسين وأحداً وحمزة وحنيناً، ويرد على من يظن أنه عجز عن الحرب بأنه لا يقول بالجبر."
  en: "Pieces in which Abu al-Qasim tells his opponents to kill or take captive since he has a compensation in the Garden, then says he is content of eye in prison, names al-Husayn, Uhud, Hamza and Hunayn, and answers whoever thinks he shrank from war that he does not hold to compulsion."
  fr: "Pièces où Abu al-Qasim dit à ses adversaires de tuer ou de faire prisonnier, puisqu’une compensation l’attend au Jardin, puis se dit serein en prison, nomme al-Husayn, Uhud, Hamza et Hunayn, et répond à quiconque le croit effrayé par la guerre qu’il n’adhère pas à la contrainte."
  ur: "ایسے ٹکڑے جن میں ابو القاسم مخالفوں سے کہتے ہیں کہ قتل کرو یا قید کرو، ان کے لیے جنت میں بدلہ ہے؛ پھر کہتے ہیں کہ وہ قید میں مطمئن ہیں، حسین، احد، حمزہ اور حنین کا ذکر کرتے ہیں، اور جو سمجھے کہ وہ جنگ سے عاجز ہوئے انہیں جواب دیتے ہیں کہ وہ جبر کے قائل نہیں۔"
  es: "Fragmentos en los que Abu al-Qasim les dice a sus oponentes que maten o tomen prisioneros, ya que tiene una recompensa en el Paraíso, luego dice que está contento de ver en prisión, nombra a al-Husayn, Uhud, Hamza y Hunayn, y responde a quien piense que se acobardó ante la guerra que no se somete a la coacción."
  tr: "Bu pasajlarda Ebu el-Kasım, rakiplerine onları öldürmelerini veya yakalamalarını söyler, çünkü cennette bir mükafatımız vardır. Sonra hapiste olmaktan memnun olduğunu söyler ve Hüseyin, Uhud, Hamza ve Huneyn'den bahseder; savaşa kadir olmadığını düşünenlere ise kaderciliğe inanmadığını söyleyerek cevap verir."
  id: "Dalam bagian-bagian ini, Abu al-Qasim mengatakan kepada lawan-lawannya untuk membunuh atau menangkap mereka, karena kita memiliki pahala di Surga. Kemudian dia mengatakan bahwa dia merasa puas di penjara, dan dia menyebutkan al-Husayn, Uhud, Hamza, dan Hunayn, dan dia menjawab orang-orang yang berpikir bahwa dia tidak mampu berperang dengan mengatakan bahwa dia tidak percaya pada takdir."
