label:
  ar: "أبيات أبي القاسم في الحبس والتأسي بالحسين وحمزة، ص262-263، 290هـ"
  en: "Abu al-Qasim's verses on prison and the example of al-Husayn and Hamza, pp. 262-263, 290 AH"
  ur: "قید اور حسین و حمزہ کی مثال پر ابو القاسم کے اشعار، ص262-263، 290ھ"
summary:
  ar: "مقطوعات يقول فيها أبو القاسم لخصومه اقتلوا أو أسروا فلنا في الجنة عوض، ثم يقول إنه في الحبس قرير العين، ويذكر الحسين وأحداً وحمزة وحنيناً، ويرد على من يظن أنه عجز عن الحرب بأنه لا يقول بالجبر."
  en: "Pieces in which Abu al-Qasim tells his opponents to kill or take captive since he has a compensation in the Garden, then says he is content of eye in prison, names al-Husayn, Uhud, Hamza and Hunayn, and answers whoever thinks he shrank from war that he does not hold to compulsion."
  ur: "ایسے ٹکڑے جن میں ابو القاسم مخالفوں سے کہتے ہیں کہ قتل کرو یا قید کرو، ان کے لیے جنت میں بدلہ ہے؛ پھر کہتے ہیں کہ وہ قید میں مطمئن ہیں، حسین، احد، حمزہ اور حنین کا ذکر کرتے ہیں، اور جو سمجھے کہ وہ جنگ سے عاجز ہوئے انہیں جواب دیتے ہیں کہ وہ جبر کے قائل نہیں۔"
