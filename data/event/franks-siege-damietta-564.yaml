id: event/franks-siege-damietta-564
class: event
kind: siege
label: { ar: "حصر الفرنج دمياط سنة ٥٦٤", en: "The Frankish siege of Damietta (564 AH)", es: "El asedio franco de Damietta (564 AH)", fr: "Le siège de Damiette par les Francs (564 AH)", ur: "ڈیمیٹا کا فرانک کا محاصرہ ⁦(564ھ)⁩" }
summary:
  ar: "في صفر سنة أربع وستين وخمسمائة نزل الفرنج على دمياط وحصروها، بعد أن كاتب فرنج الشام إخوانهم بصقلية والأندلس يستمدونهم خوفاً من ملك الأتراك مصر على البيت المقدس، فأمدوهم بالأموال والرجال والسلاح؛ فأمدهم صلاح الدين عبر النيل بالعساكر والأموال والذخائر، وشكا إلى نور الدين مخافته أن يخلفه المصريون بالشر إن سار، فسير نور الدين العساكر أرسالاً وسار بنفسه إلى بلاد الفرنج الشامية فنهبها واستباحها حتى بلغت الغارات ما لم تبلغه من قبل؛ فرجع الفرنج عن دمياط خائبين بعد مقام خمسين يوماً وقد وجدوا بلادهم خراباً، فضرب فيهم المثل «خرجت النعامة تطلب قرنين فرجعت بلا أذنين»؛ وحكى صلاح الدين أن العاضد أرسل إليه لمقام الفرنج على دمياط ألف ألف دينار مصرية سوى الثياب {cite:kamil-ibn-al-athir p. 21-22}."
  en: "Safar 564 (Oct–Dec 1169): Frankish Syria, reinforced by fleets answering appeals to Sicily and al-Andalus, besieged Damietta fifty days; Saladin fed it men and money down the Nile while Nur al-Din loosed his raiders deep into the emptied Frankish lands — the besiegers withdrew to find their own country wasted, in Ibn al-Athir's proverb the ostrich that went out seeking horns and came back without ears {cite:kamil-ibn-al-athir p. 21-22}."
  es: "Safar 564 (octubre-diciembre de 1169): La Siria franca, reforzada por flotas que respondían a las peticiones de Sicilia y al-Ándalus, sitió Damietta durante cincuenta días; Saladino la abasteció de hombres y dinero a lo largo del Nilo, mientras que Nur al-Din lanzó a sus asaltantes al interior de las tierras francas deshabitadas. Los sitiadores se retiraron para encontrar su propio país devastado, como dice el proverbio de Ibn al-Athir: el avestruz que salió en busca de cuernos y regresó sin orejas {cita:kamil-ibn-al-athir págs. 21-22}."
  fr: "Safar 564 (oct.-déc. 1169): la Syrie franque, renforcée par des flottes répondant aux appels de la Sicile et d'al-Andalus, assiégea Damiette pendant cinquante jours; Saladin la nourrit d'hommes et d'argent en descendant le Nil tandis que Nur al-Din lâchait ses pillards au cœur des terres franques vidées — les assiégeants se retirèrent pour trouver leur propre pays dévasté, dans le proverbe d'Ibn al-Athir, l'autruche qui est partie chercher des cornes et est revenue sans oreilles {cite:kamil-ibn-al-athir p. 21-22}."
  ur: "صفر 564 ⁦(اکتوبر-دسمبر 1169)⁩: فرینکش شام، سسلی اور الاندلس کی اپیلوں کا جواب دینے والے بحری بیڑوں کے ذریعے تقویت یافتہ، ڈیمیٹا کا پچاس دن تک محاصرہ کیا۔ صلاح الدین نے اسے نیل کے نیچے آدمی اور پیسہ کھلایا جب کہ نورالدین نے اپنے حملہ آوروں کو خالی فرینک کی زمینوں میں کھو دیا - محاصرہ کرنے والے اپنے ہی ملک کو ویران تلاش کرنے کے لیے پیچھے ہٹ گئے، ابن الاثیر کے محاورے میں شتر مرغ جو سینگوں کی تلاش میں نکلا اور بغیر کانوں کے واپس آیا۔ 21-22}۔"
