class: event
kind: raid
label: { ar: "وقعة ورقاء بالأعراب بالأجفر وقتل العامة الأسرى", en: "Warqa's Raid on the Bedouin at al-Ajfar and the Mob's Killing of the Captives", es: "El ataque de Warqa contra los beduinos en al-Ajfar y la masacre de los cautivos a manos de la turba.", fr: "Le raid de Warqa contre les Bédouins à al-Ajfar et le massacre des captifs par la foule", ur: "الاجفر میں بدویوں پر ورقہ کا حملہ اور ہجوم کا اسیروں کا قتل", tr: "Warqa'nın Al-Ajfar'da Bedevilerle yaptığı savaş ve esir alınan sıradan insanların öldürülmesi.", id: "Pertempuran Warqa' melawan suku Badui di Al-Ajfar dan pembunuhan rakyat jelata yang ditawan." }
summary:
  ar: "في سنة ثلاث وثلاثمائة أوقع ورقاء بن نوفل بالأعراب بناحية الأجفر فقتل جماعة وأسر جماعة وقدم بهم إلى بغداد، فوثبت العامة على الأسرى فقتلتهم، وضُرب رجل منهم بالسياط في باب العامة؛ وقيل إنه صاحب حصن الحاجر وإن الحاج استجاروا به {cite:muntazam-ibn-al-jawzi p. 418}."
  en: "In 303 Warqa' ibn Nawfal fell on the Arabs at al-Ajfar, killed and captured bands and brought them to Baghdad — where the mob fell on the prisoners and killed them, one man flogged at Bab al-'Amma, said to be the lord of Hisn al-Hajir whom pilgrims had sought protection with {cite:muntazam-ibn-al-jawzi p. 418}."
  es: "En el año 303, Warqa' ibn Nawfal atacó a los árabes en al-Ajfar, mató y capturó bandas y las llevó a Bagdad, donde la turba atacó a los prisioneros y los mató; un hombre fue azotado en Bab al-'Amma, quien se dice que era el señor de Hisn al-Hajir, con quien los peregrinos habían buscado protección {cite:muntazam-ibn-al-jawzi p. 418}."
  fr: "En 303, Warqa' ibn Nawfal s'abattit sur les Arabes à al-Ajfar, tua et captura des bandes et les amena à Bagdad — où la foule se jeta sur les prisonniers et les tua, un homme fut fouetté à Bab al-'Amma, qui serait le seigneur de Hisn al-Hajir auprès duquel les pèlerins avaient cherché protection {cite:muntazam-ibn-al-jawzi p. 418}."
  ur: "303 میں ورقع بن نوفل الجفر کے مقام پر عربوں پر گرا، مارا گیا اور گروہوں کو پکڑ کر بغداد لے آیا- جہاں ہجوم قیدیوں پر گرا اور انہیں قتل کر دیا، باب العماء کے مقام پر ایک شخص کو کوڑے مارے گئے، جسے حسان الحجر کا رب کہا جاتا ہے جس کی حفاظت حجاج کرام نے کی تھی۔ ص 418}۔"
  tr: "Hicri 303 yılında Vâkâ ibn Nevfel, El-Ajfer bölgesindeki Bedevilere saldırdı, bir grubu öldürdü, bir grubu da esir aldı ve onları Bağdat'a getirdi. Halk, esirlere saldırdı ve onları öldürdü; içlerinden biri halkın kapısında kırbaçlandı. Rivayetlere göre, o Hacir kalesinin sahibiydi ve hacılar ona sığınmıştı. {Kaynak: Muntazam ibn el-Cevzi, s. 418}"
  id: "Pada tahun 303 H, Warqa’ ibn Nawfal menyerang kaum Badui di daerah Al-Ajfar, membunuh sekelompok orang dan menangkap sekelompok lainnya, lalu membawa mereka ke Baghdad. Rakyat jelata menyerang para tawanan dan membunuh mereka, dan salah seorang dari mereka dicambuk di gerbang rakyat jelata. Dikatakan bahwa ia adalah pemilik benteng Al-Hajir dan para peziarah mencari perlindungan kepadanya. {cite:muntazam-ibn-al-jawzi p. 418}."
