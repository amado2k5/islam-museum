label: { ar: "نصر منجنيق البيرة على التتار سنة 674هـ", en: "The mangonel duel of al-Bira, 674", fr: "Le duel de mangonneaux d'al-Bira, 674", es: "El duelo de mangoneles de al-Bira, 674", ur: "البیرا کا مینگونیل ڈوئل، 674", tr: "Hicri 674 yılında Bira mancınığının Tatarlara karşı kazandığı zafer.", id: "Kemenangan ketapel bir atas bangsa Tatar pada tahun 674 Hijriah" }
summary:
  ar: "في سنة أربع وسبعين نزل التتار على إلبيرة ونصبوا المجانيق وكانوا ثلاثين ألف فارس ونصبوا على القلعة منجنيقاً وكان راميه مسلماً؛ فنصب أهل القلعة عليه منجنيقاً ورموا به على مجانيق التتار فجاء عالياً عليه، فقال رامي التتار لو قطع الله من يدك ذراعاً كان أهل البيرة يستريحون منك لقلة معرفتك، فقطن إشارته وقطع من رجل المنجنيق ذراعاً ورمى به فأصاب منجنيق التتار فكسره، وخرج أهل إلبيرة فقتلوا خلقاً ونهبوا وأحرقوا المجانيق {cite:shadharat-dhahab p. 595}."
  en: "Thirty thousand riders sat before al-Bira in 674 and set mangonels on its citadel — their gunner a Muslim. The garrison's reply came over his head; when he jeered that the town would rest easier missing his arm, the defenders cut the arm off their own engine's man and hurled it — it smashed the Tatar mangonel, and the sortie came out killing, looting and burning the machines {cite:shadharat-dhahab p. 595}."
  fr: "Trente mille cavaliers s'installèrent devant al-Bira en 674 et dressèrent des mangonneaux contre sa citadelle, leur artilleur étant un musulman. La riposte de la garnison passa au-dessus de lui ; quand il railla que la ville serait plus tranquille privée de son bras, les défenseurs coupèrent le bras de l'homme de leur propre engin et le lancèrent : il fracassa le mangonneau tatar, et la sortie vint tuer, piller et brûler les machines {cite:shadharat-dhahab p. 595}."
  es: "Treinta mil jinetes se apostaron frente a al-Bira en 674 y colocaron mangoneles en su ciudadela; su artillero era musulmán. La respuesta de la guarnición cayó por encima de su cabeza; cuando se burló diciendo que la ciudad estaría más tranquila sin su brazo, los defensores le cortaron el brazo al artillero de su propia máquina y lo arrojaron; destrozó el mangonel tártaro, y la incursión terminó matando, saqueando e incendiando las máquinas {cita: shadharat-dhahab p. 595}."
  ur: "تیس ہزار سوار 674 میں البیرا کے سامنے بیٹھے اور اس کے قلعے پر مینگونیل لگائے - ان کا بندوق بردار ایک مسلمان تھا۔ گیریژن کا جواب اس کے سر پر آگیا۔ جب اس نے طنز کیا کہ قصبہ اس کے بازو سے محروم ہونے میں آسانی سے آرام کرے گا، محافظوں نے اپنے ہی انجن والے کا بازو کاٹ کر اسے پھینک دیا - اس نے تاتاری مینگونیل کو توڑ دیا، اور چھلانگیں مارنے، لوٹ مار کرنے اور مشینوں کو جلانے کے لیے نکل آئیں۔ 595}۔"
  tr: "Yetmiş dördüncü yılda Tatarlar Elvira'ya saldırdılar ve mancınıklar kurdular. Otuz bin süvariden oluşan bir orduyla kaleye bir mancınık kurdular. Topçusu Müslümandı. Bunun üzerine kale halkı da bir mancınık kurup Tatar mancınıklarına doğru fırlattı ve mancınıklar çok yükseğe çıktı. Tatar topçusu, \"Allah senin elinin bir kolunu kesse bile, Elvira halkı senin bilgisizliğin yüzünden senden kurtulur\" dedi. Bunun üzerine işaretini kesti ve mancınık ayağının bir kolunu kesip fırlattı; bu kol Tatar mancınığına isabet edip onu kırdı. Elvira halkı dışarı çıktı, birçok insanı öldürdü, yağmaladı ve mancınıkları yaktı. {cite:shadharat-dhahab s. 595}"
  id: "Pada tahun tujuh puluh empat, bangsa Tatar menyerbu Elvira dan mendirikan ketapel. Mereka berjumlah tiga puluh ribu penunggang kuda, dan mereka mendirikan sebuah ketapel di benteng. Penembaknya adalah seorang Muslim. Maka penduduk benteng mendirikan sebuah ketapel di atasnya dan melemparkannya ke arah ketapel Tatar, dan ketapel itu melesat tinggi di atasnya. Penembak Tatar berkata, “Seandainya Tuhan memotong lengan tanganmu, penduduk Elvira akan terbebas darimu karena kurangnya pengetahuanmu.” Maka ia menghentikan isyaratnya dan memotong salah satu kaki ketapel lalu melemparkannya, dan ketapel itu mengenai ketapel Tatar dan mematahkannya. Penduduk Elvira keluar dan membunuh banyak orang, menjarah, dan membakar ketapel-ketapel itu. {cite:shadharat-dhahab p. 595}"
