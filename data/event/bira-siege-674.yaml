summary:
  ar: "في سنة أربع وسبعين نزل التتار على إلبيرة ونصبوا المجانيق وكانوا ثلاثين ألف فارس ونصبوا على القلعة منجنيقاً وكان راميه مسلماً؛ فنصب أهل القلعة عليه منجنيقاً ورموا به على مجانيق التتار فجاء عالياً عليه، فقال رامي التتار لو قطع الله من يدك ذراعاً كان أهل البيرة يستريحون منك لقلة معرفتك، فقطن إشارته وقطع من رجل المنجنيق ذراعاً ورمى به فأصاب منجنيق التتار فكسره، وخرج أهل إلبيرة فقتلوا خلقاً ونهبوا وأحرقوا المجانيق {cite:shadharat-dhahab p. 595}."
  en: "Thirty thousand riders sat before al-Bira in 674 and set mangonels on its citadel — their gunner a Muslim. The garrison's reply came over his head; when he jeered that the town would rest easier missing his arm, the defenders cut the arm off their own engine's man and hurled it — it smashed the Tatar mangonel, and the sortie came out killing, looting and burning the machines {cite:shadharat-dhahab p. 595}."
