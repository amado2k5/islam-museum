id: event/last-days-and-testament-of-umar-ibn-abd-al-aziz
class: event
kind: death
label:
  ar: آخر أيام عمر بن عبد العزيز ووصيته وقبره في دير سمعان
  en: Last days, testament and grave of Umar ibn Abd al-Aziz
  ur: عمر بن عبدالعزیز کے آخری دن، وصیت اور دیرِ سمعان میں قبر
  es: "Últimos días, testamento y tumba de Umar ibn Abd al-Aziz."
  fr: "Derniers jours, testament et tombe d'Umar ibn Abd al-Aziz"
  tr: "Ömer ibn Abdülaziz'in son günleri, vasiyeti ve Deyr Seman'daki mezarı."
  id: "Hari-hari terakhir Umar ibn Abd al-Aziz, wasiatnya, dan makamnya di Deir Semaan."
summary:
  ar: "مرض عمر بن عبد العزيز بدير سمعان من أرض حمص نحو عشرين يوماً وتوفي في رجب سنة إحدى ومئة {cite:tarikh-al-tabari scan vol. 3 p. 90}. ولما قيل له ألا يوصي لأبنائه الاثني عشر وهم فقراء أجاب بأن الله يتولى الصالحين وأنه لن يعطيهم حق أحد {cite:al-bidaya-wal-nihaya scan vol. 5 p. 226}. وأمر بشراء موضع قبره من أهل الدير فاشتُري من الراهب {cite:tarikh-al-tabari scan vol. 3 p. 98}، ورفض أن يُدفن في الحجرة مع النبي ورأى نفسه ليس أهلاً لها {cite:al-bidaya-wal-nihaya scan vol. 5 p. 227}. وكان قد ردّ المظالم حتى بقي من دخله أربعمئة دينار في السنة {cite:al-bidaya-wal-nihaya scan vol. 5 p. 225}."
  en: "Umar ibn Abd al-Aziz fell ill at Dayr Sim'an in the district of Homs for about twenty days and died in Rajab of the year 101 {cite:tarikh-al-tabari scan vol. 3 p. 90}. Told to leave something to his twelve poor sons, he answered that God guards the righteous and that he would not give them anyone's right {cite:al-bidaya-wal-nihaya scan vol. 5 p. 226}. He had the place of his grave bought from the monastery's people, from the monk {cite:tarikh-al-tabari scan vol. 3 p. 98}, and declined to be buried with the Prophet, thinking himself not fit for that place {cite:al-bidaya-wal-nihaya scan vol. 5 p. 227}. He had returned the wrongs of the state until his income fell to four hundred dinars a year {cite:al-bidaya-wal-nihaya scan vol. 5 p. 225}."
  ur: "عمر بن عبدالعزیز حمص کے علاقے کے دیرِ سمعان میں تقریباً بیس دن بیمار رہے اور سن 101 ہجری کے رجب میں فوت ہوئے {cite:tarikh-al-tabari scan vol. 3 p. 90}۔ جب ان سے کہا گیا کہ بارہ مفلس بیٹوں کے لیے کچھ وصیت کریں تو جواب دیا کہ اللہ نیکوں کا کارساز ہے اور وہ کسی کا حق انھیں نہیں دیں گے {cite:al-bidaya-wal-nihaya scan vol. 5 p. 226}۔ انھوں نے دیر والوں سے، یعنی راہب سے، اپنی قبر کی جگہ خریدوائی {cite:tarikh-al-tabari scan vol. 3 p. 98}، اور نبی کے پاس دفن ہونے کو یہ کہہ کر ٹھکرا دیا کہ وہ خود کو اس جگہ کا اہل نہیں سمجھتے {cite:al-bidaya-wal-nihaya scan vol. 5 p. 227}۔ وہ مظالم لوٹا چکے تھے یہاں تک کہ آمدنی چار سو دینار سالانہ رہ گئی {cite:al-bidaya-wal-nihaya scan vol. 5 p. 225}۔"
  es: "Umar ibn Abd al-Aziz enfermó en Dayr Sim'an en el distrito de Homs durante unos veinte días y murió en Rajab del año 101 {cite:tarikh-al-tabari scan vol. 3 p. 90}. Cuando se le dijo que dejara algo a sus doce hijos pobres, respondió que Dios protege a los justos y que no les daría el derecho de nadie {cite:al-bidaya-wal-nihaya scan vol. 5 p. 226}. Hizo comprar el lugar de su tumba a la gente del monasterio, al monje {cite:tarikh-al-tabari scan vol. 3 p. 98}, y se negó a ser enterrado con el Profeta, pensando que no era digno de ese lugar {cite:al-bidaya-wal-nihaya scan vol. 5 p. 227}. Había devuelto las injusticias del estado hasta que sus ingresos cayeron a cuatrocientos dinares al año {cite:al-bidaya-wal-nihaya scan vol. 5 pág. 225}."
  fr: "Umar ibn Abd al-Aziz tomba malade à Dayr Sim'an, dans le district de Homs, pendant une vingtaine de jours et mourut en Rajab de l'an 101 (cite:tarikh-al-tabari scan vol. 3 p. 90). Sommé de laisser un héritage à ses douze fils pauvres, il répondit que Dieu protège les justes et qu'il ne leur accorderait aucun droit (cite:al-bidaya-wal-nihaya scan vol. 5 p. 226). Il fit acquérir l'emplacement de sa tombe auprès des moines du monastère (cite:tarikh-al-tabari scan vol. 3 p. 98) et refusa d'être enterré auprès du Prophète, se jugeant indigne de cette sépulture (cite:al-bidaya-wal-nihaya scan vol. 5 p. 227). Il avait rendu des comptes à l'État jusqu'à ce que ses revenus chutent à quatre cents dinars par an (cite:al-bidaya-wal-nihaya scan vol. 5 p. 227). 5 p. 225}."
  tr: "Ömer ibn Abdülaziz, Humus bölgesindeki Şimeon Manastırı'nda yaklaşık yirmi gün hastalandı ve Hicri 101 yılının Receb ayında vefat etti. (Kaynak: Tarikat-ı Tebriz, cilt 3, s. 90) Fakir olan on iki oğluna vasiyet bırakmaması istendiğinde, Allah'ın salihlere sahip çıktığını ve onlara başkasının hakkını vermeyeceğini söyledi. (Kaynak: El-Bidaya ve Nihaya, cilt 5, s. 226) Mezarının yerinin manastır halkından satın alınmasını emretti ve keşişten satın alındı. (Kaynak: Tarikat-ı Tebriz, cilt 3, s. 98) Kendisini buna layık görmediği için Peygamber ile aynı odaya gömülmeyi reddetti. (Kaynak: El-Bidaya ve Nihaya, cilt 5, s. 227) Yıllık geliri dört yüz dinara ulaşana kadar tüm haksızlıkları gidermişti. {cite:al-bidaya-wal-nihaya scan vol. 5 p. 225}"
  id: "Umar bin Abd al-Aziz jatuh sakit di Biara Simeon di wilayah Homs selama kurang lebih dua puluh hari dan meninggal pada bulan Rajab tahun 101 H {cite:tarikh-al-tabari scan vol. 3 p. 90}. Ketika ia diminta untuk tidak meninggalkan wasiat bagi kedua belas putranya yang miskin, ia menjawab bahwa Allah menjaga orang-orang yang saleh dan bahwa ia tidak akan memberikan hak orang lain kepada mereka {cite:al-bidaya-wal-nihaya scan vol. 5 p. 226}. Ia memerintahkan agar tempat kuburnya dibeli dari penduduk biara, dan tempat itu dibeli dari seorang biarawan {cite:tarikh-al-tabari scan vol. 3 p. 98}. Ia menolak untuk dimakamkan di kamar bersama Nabi, karena menganggap dirinya tidak layak {cite:al-bidaya-wal-nihaya scan vol. 5 p. 227}. Dia telah memperbaiki semua ketidakadilan hingga penghasilannya mencapai empat ratus dinar setahun {cite:al-bidaya-wal-nihaya scan vol. 5 p. 225}."
