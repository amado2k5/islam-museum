label: { ar: "قتل الباطنية بواسط", en: "The massacre of the Batinis at Wasit (601 AH)", es: "La masacre de los Batinis en Wasit (601 AH)", fr: "Le massacre des Batinis à Wasit (601 AH)", ur: "وصیت میں بطینیوں کا قتل عام ⁦(601ھ)⁩", tr: "Batiniyya halkı öldürüldü", id: "Suku Batiniyya dibunuh oleh" }
summary:
  ar: "في رمضان سنة واحدة وستمائة قتل الباطنية بواسط؛ كان قد ورد إليها رجل يعرف بالركم محمد بن طالب بن عصية أصله من القاروب من قرى واسط وكان باطنياً فنزل مجاوراً لدور بني الهروي وغشيه الناس وكثر أتباعه، فاتفق أن رجلاً نجاراً كلّم أحدهم ويعرف بحسن الصابوني في مذهبهم فرد عليه رداً غليظاً فقام إليه النجار وقتله، فتسامع الناس ووثبوا وقتلوا من وجدوا ممن ينتسب إلى هذا المذهب وقصدوا دار ابن عصية فتحصن فيها أصحابه فصعدوا إليهم من الأسطح وكسروا الأبواب وقتلوا من وجدوا وأحرقوا وقتل ابن عصية، فانحدر فخر الدين أبو البدر بن أمسينا الواسطي من بغداد لإصلاح الحال وتسكين الفتنة {cite:kamil-ibn-al-athir p. 297}."
  en: "Ramadan 601: Wasit turned on its Batini cell — when a carpenter killed the soap-seller who answered him harshly over the creed, the crowd lynched every Batini they found, stormed the missionary Ibn Asiyya's fortified house from the rooftops, slew him and burned it; the notable Fakhr al-Din ibn Amsina came down from Baghdad to quiet the fitna {cite:kamil-ibn-al-athir p. 297}."
  es: "Ramadán 601: Wasit se rebeló contra su célula Batini: cuando un carpintero mató al vendedor de jabón que le respondió con dureza sobre el credo, la multitud linchó a todos los Batini que encontraron, asaltó la casa fortificada del misionero Ibn Asiyya desde los tejados, lo mató y la quemó; el notable Fakhr al-Din ibn Amsina bajó de Bagdad para calmar la fitna {cita:kamil-ibn-al-athir p. 297}."
  fr: "Ramadan 601: Wasit se retourna contre sa cellule Batini — lorsqu'un charpentier tua le vendeur de savon qui lui avait répondu durement au sujet de la croyance, la foule lyncha tous les Batini qu'elle trouva, prit d'assaut la maison fortifiée du missionnaire Ibn Asiyya depuis les toits, le tua et la brûla; le notable Fakhr al-Din ibn Amsina descendit de Bagdad pour calmer la fitna {cite:kamil-ibn-al-athir p. 297}."
  ur: "رمضان 601: وصیت نے اپنا بٹینی سیل آن کر دیا - جب ایک بڑھئی نے صابن بیچنے والے کو مار ڈالا جس نے اسے مسلک پر سختی سے جواب دیا، ہجوم نے ہر بطینی کو مار ڈالا، مشنری ابن آسیہ کے قلعہ بند مکان پر چھتوں سے دھاوا بول دیا، اسے قتل کر دیا اور جلا دیا۔ ممتاز فخر الدین ابن امسینہ فتنے کو خاموش کرنے کے لیے بغداد سے اترے تھے۔ 297}۔"
  tr: "Hicri 601 yılının Ramazan ayında, Wasit'te Batiniyyeler katledildi. Wasit'in köylerinden biri olan el-Karub'dan gelen, el-Rakm Muhammed ibn Talib ibn Asiya adında bir adam oraya gelmişti. Batiniyye mezhebine mensuptu ve Beni el-Haravi'nin evlerinin yakınlarına yerleşmişti. İnsanlar ona akın etti ve takipçileri çoğaldı. Bir marangoz, Hasan el-Sabuni adındaki birine onların öğretilerinden bahsetti ve o da sert bir şekilde karşılık verdi. Bunun üzerine marangoz kalkıp onu öldürdü. İnsanlar bunu duyunca ayağa kalkıp bu öğretiye mensup buldukları herkesi öldürmeye başladılar. İbn Asiya'nın evine gittiler ve takipçileri orada kendilerini tahkim ettiler. Çatılardan tırmanıp kapıları kırarak içeri girdiler, buldukları herkesi öldürdüler ve İbn Asiya'yı yakıp öldürdüler. Bunun üzerine Fahreddin Ebu el-Bedr ibn Amsina el-Vasiti, durumu düzeltmek ve fitneyi yatıştırmak için Bağdat'tan geldi. {kaynak: Kamil ibn el-Athir s. 297}"
  id: "Pada bulan Ramadan tahun 601 H, kaum Batiniyyah dibunuh di Wasit. Seorang pria bernama al-Rakm Muhammad ibn Talib ibn Asiya, yang berasal dari al-Qarub, salah satu desa di Wasit, datang ke sana. Ia adalah seorang Batiniyyah dan menetap di dekat rumah-rumah Bani al-Harawi. Orang-orang berbondong-bondong mendatanginya dan pengikutnya bertambah banyak. Suatu hari, seorang tukang kayu berbicara kepada salah seorang dari mereka, yang dikenal sebagai Hasan al-Sabuni, tentang ajaran mereka, dan ia menanggapinya dengan kasar. Maka tukang kayu itu bangkit dan membunuhnya. Orang-orang mendengar tentang hal itu dan langsung membunuh siapa pun yang mereka temukan yang menganut ajaran tersebut. Mereka pergi ke rumah Ibn Asiya, dan para pengikutnya membentengi diri di dalamnya. Maka mereka memanjat dari atap dan mendobrak pintu serta membunuh siapa pun yang mereka temukan dan membakar serta membunuh Ibn Asiya. Kemudian Fakhr al-Din Abu al-Badr ibn Amsina al-Wasiti datang dari Baghdad untuk memperbaiki situasi dan meredakan pemberontakan. {cite:kamil-ibn-al-athir p. 297}."
