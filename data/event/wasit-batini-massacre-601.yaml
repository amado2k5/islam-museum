label: { ar: "قتل الباطنية بواسط", en: "The massacre of the Batinis at Wasit (601 AH)" }
summary:
  ar: "في رمضان سنة واحدة وستمائة قتل الباطنية بواسط؛ كان قد ورد إليها رجل يعرف بالركم محمد بن طالب بن عصية أصله من القاروب من قرى واسط وكان باطنياً فنزل مجاوراً لدور بني الهروي وغشيه الناس وكثر أتباعه، فاتفق أن رجلاً نجاراً كلّم أحدهم ويعرف بحسن الصابوني في مذهبهم فرد عليه رداً غليظاً فقام إليه النجار وقتله، فتسامع الناس ووثبوا وقتلوا من وجدوا ممن ينتسب إلى هذا المذهب وقصدوا دار ابن عصية فتحصن فيها أصحابه فصعدوا إليهم من الأسطح وكسروا الأبواب وقتلوا من وجدوا وأحرقوا وقتل ابن عصية، فانحدر فخر الدين أبو البدر بن أمسينا الواسطي من بغداد لإصلاح الحال وتسكين الفتنة {cite:kamil-ibn-al-athir p. 297}."
  en: "Ramadan 601: Wasit turned on its Batini cell — when a carpenter killed the soap-seller who answered him harshly over the creed, the crowd lynched every Batini they found, stormed the missionary Ibn Asiyya's fortified house from the rooftops, slew him and burned it; the notable Fakhr al-Din ibn Amsina came down from Baghdad to quiet the fitna {cite:kamil-ibn-al-athir p. 297}."
