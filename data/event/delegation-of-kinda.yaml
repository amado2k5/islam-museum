label: { ar: "قدوم الأشعث بن قيس في وفد كندة", en: "Al-Ash'ath ibn Qays comes with the delegation of Kinda" }
summary:
  ar: "قدم الأشعث بن قيس في وفد كندة، ثمانين راكباً عند الزهري، فدخلوا المسجد وقد رجّلوا جممهم وتكحّلوا وعليهم جبب الحيرة مكفوفة بالحرير؛ فسألهم النبي: ألم تسلموا؟ فما بال هذا الحرير في أعناقكم؟ فشقّوه وألقوه. وقال الأشعث: نحن بنو آكل المرار وأنت ابن آكل المرار؛ فضحك النبي ونسب ذلك إلى العباس وربيعة بن الحارث اللذين كانا يتعززان به في التجارة، وقال: لا، بل نحن بنو النضر بن كنانة، لا نقفو أمنا ولا ننتفي من أبينا."
  en: "Al-Ash'ath ibn Qays came with Kinda's delegation, eighty riders according to al-Zuhri, who entered the mosque with combed locks and kohl, wearing Hira robes edged with silk; the Prophet asked whether they had not become Muslims, and what the silk on their necks was, and they tore it off. Al-Ash'ath said, we are Banu Akil al-Murar and you are Ibn Akil al-Murar; the Prophet laughed, attributed that lineage-claim to al-Abbas and Rabi'a ibn al-Harith who used it for prestige as merchants, and said: no, we are Banu al-Nadr ibn Kinana, we do not trace ourselves through our mother nor disown our father."
