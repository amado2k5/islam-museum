label: { ar: "قدوم الأشعث بن قيس في وفد كندة", en: "Al-Ash'ath ibn Qays comes with the delegation of Kinda", es: "Al-Ash'ath ibn Qays viene con la delegación de Kinda", fr: "Al-Ash'ath ibn Qays arrive avec la délégation de Kinda", ur: "اشعث بن قیس کندہ کے وفد کے ساتھ آئے" }
summary:
  ar: "قدم الأشعث بن قيس في وفد كندة، ثمانين راكباً عند الزهري، فدخلوا المسجد وقد رجّلوا جممهم وتكحّلوا وعليهم جبب الحيرة مكفوفة بالحرير؛ فسألهم النبي: ألم تسلموا؟ فما بال هذا الحرير في أعناقكم؟ فشقّوه وألقوه. وقال الأشعث: نحن بنو آكل المرار وأنت ابن آكل المرار؛ فضحك النبي ونسب ذلك إلى العباس وربيعة بن الحارث اللذين كانا يتعززان به في التجارة، وقال: لا، بل نحن بنو النضر بن كنانة، لا نقفو أمنا ولا ننتفي من أبينا."
  en: "Al-Ash'ath ibn Qays came with Kinda's delegation, eighty riders according to al-Zuhri, who entered the mosque with combed locks and kohl, wearing Hira robes edged with silk; the Prophet asked whether they had not become Muslims, and what the silk on their necks was, and they tore it off. Al-Ash'ath said, we are Banu Akil al-Murar and you are Ibn Akil al-Murar; the Prophet laughed, attributed that lineage-claim to al-Abbas and Rabi'a ibn al-Harith who used it for prestige as merchants, and said: no, we are Banu al-Nadr ibn Kinana, we do not trace ourselves through our mother nor disown our father."
  es: "Al-Ash'ath ibn Qays llegó con la delegación de Kinda, ochenta jinetes según al-Zuhri, que entraron en la mezquita con el cabello peinado y kohl, vestidos con túnicas Hira ribeteadas de seda; el Profeta les preguntó si no se habían convertido al Islam y qué era la seda que llevaban en el cuello, y se la arrancaron. Al-Ash'ath dijo: somos Banu Akil al-Murar y tú eres Ibn Akil al-Murar; el Profeta rió, atribuyó esa afirmación de linaje a al-Abbas y Rabi'a ibn al-Harith, que la usaban para ganar prestigio como comerciantes, y dijo: no, somos Banu al-Nadr ibn Kinana, no nos linamos por vía materna ni renegamos de nuestro padre."
  fr: "Al-Ash'ath ibn Qays arriva avec la délégation de Kinda, quatre-vingts cavaliers selon al-Zuhri. Ils entrèrent dans la mosquée, les cheveux peignés et le khôl appliqué, vêtus de robes Hira bordées de soie. Le Prophète leur demanda s'ils ne s'étaient pas convertis à l'islam et ce qu'était la soie qu'ils portaient au cou. Ils l'arrachèrent. Al-Ash'ath déclara: « Nous sommes les Banu Akil al-Murar et vous êtes Ibn Akil al-Murar. » Le Prophète rit, attribuant cette prétention à al-Abbas et Rabi'a ibn al-Harith qui l'utilisaient pour se faire un nom en tant que marchands, et dit: « Non, nous sommes les Banu al-Nadr ibn Kinana. Nous ne nous réclamons pas de notre ascendance maternelle et nous ne renions pas notre ascendance paternelle. »"
  ur: "اشعث بن قیس کندہ کے وفد کے ساتھ آیا، الزہری کے مطابق اسّی سوار، جو کنگھی والے تالے اور سرمہ کے ساتھ مسجد میں داخل ہوئے، ریشم کے حیرہ کے کپڑے پہنے ہوئے تھے۔ آپ نے دریافت کیا کہ کیا وہ مسلمان نہیں ہوئے اور ان کی گردنوں کا ریشم کیا ہے تو انہوں نے اسے پھاڑ دیا۔ اشعث نے کہا، ہم بنو عقیل المرار ہیں اور آپ ابن عقیل المرار ہیں۔ نبی نے ہنستے ہوئے اس نسب کا دعویٰ عباس اور ربیعہ بن حارث کی طرف منسوب کیا جنہوں نے اسے سوداگر کے طور پر وقار کے لیے استعمال کیا، اور فرمایا: نہیں، ہم بنو نضر بن کنانہ ہیں، ہم اپنی ماں سے اپنے آپ کو نہیں ڈھونڈتے اور نہ ہی اپنے باپ سے انکار کرتے ہیں۔"
