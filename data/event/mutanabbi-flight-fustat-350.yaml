id: event/mutanabbi-flight-fustat-350
class: event
kind: migration
label:
  ar: "هرب المتنبي من الفسطاط يوم النحر، ٣٥٠هـ/٩٦٢م"
  en: "Flight from Fustat on the day of sacrifice, 350/962"
  ur: "فسطاط سے فرار، یوم النحر 350ھ/962ء"
  es: "Huida de Fustat el día del sacrificio, 350/962"
  fr: "Fuite de Fustat le jour du sacrifice, 350/962"
  tr: "El-Mutanabbi, Hicri 350/Miladi 962 yılında kurban günü Fustat'tan kaçtı."
  id: "Al-Mutanabbi melarikan diri dari Fustat pada hari kurban, 350 H/962 M"
summary:
  ar: "يوم عيد الأضحى من سنة ٣٥٠هـ، الموافق ٢٠ كانون الثاني ٩٦٢م، هجا المتنبي كافوراً بهجاء لاذع ثم غادر الفسطاط سراً، وعبر الجزيرة العربية بعد شدائد عظيمة حتى بلغ العراق، فأقام بالكوفة مدة ثم استقر ببغداد {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  en: "On the feast of sacrifice of 350 — 20 January 962 — after writing a satire on Kafur, al-Mutanabbi left Fustat secretly and, crossing Arabia after great trials, reached Iraq, where he spent some time in Kufa before settling in Baghdad {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  ur: "350ھ کے یوم النحر — 20 جنوری 962ء — کافور پر طنز لکھنے کے بعد متنبی خفیہ طور پر فسطاط سے نکل گئے اور بڑی مشقتوں کے بعد جزیرہ عرب پار کر کے عراق پہنچے؛ کچھ عرصہ کوفہ میں رہے پھر بغداد میں مقیم ہوئے {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}۔"
  es: "En la fiesta del sacrificio del año 350 — 20 de enero de 962 — después de escribir una sátira sobre Kafur, al-Mutanabbi abandonó Fustat en secreto y, tras cruzar Arabia después de grandes pruebas, llegó a Irak, donde pasó algún tiempo en Kufa antes de establecerse en Bagdad {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  fr: "Le jour de la fête du sacrifice de 350 — 20 janvier 962 — après avoir écrit une satire sur Kafur, al-Mutanabbi quitta secrètement Fustat et, traversant l'Arabie après de grandes épreuves, atteignit l'Irak, où il passa quelque temps à Kufa avant de s'installer à Bagdad {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  tr: "Hicri 350 yılında, yani Miladi 962 yılının 20 Ocak'ında, Kurban Bayramı günü, El-Mutanabbi, Kafur'u sert bir hicivle eleştirdi, ardından gizlice Fustat'tan ayrıldı ve büyük zorluklarla Arap Yarımadası'nı geçerek Irak'a ulaştı. Bir süre Kufa'da kaldıktan sonra Bağdat'a yerleşti. {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}"
  id: "Pada hari raya Idul Adha tahun 350 H, yang bertepatan dengan tanggal 20 Januari 962 M, Al-Mutanabbi menyindir Kafur dengan sindiran yang pedas, kemudian diam-diam meninggalkan Fustat dan menyeberangi Semenanjung Arab setelah mengalami banyak kesulitan hingga sampai di Irak. Ia tinggal di Kufa untuk sementara waktu dan kemudian menetap di Baghdad. {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
