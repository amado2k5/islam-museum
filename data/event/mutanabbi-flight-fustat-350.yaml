  ar: "هرب المتنبي من الفسطاط يوم النحر، ٣٥٠هـ/٩٦٢م"
  en: "Flight from Fustat on the day of sacrifice, 350/962"
  ur: "فسطاط سے فرار، یوم النحر 350ھ/962ء"
summary:
  ar: "يوم عيد الأضحى من سنة ٣٥٠هـ، الموافق ٢٠ كانون الثاني ٩٦٢م، هجا المتنبي كافوراً بهجاء لاذع ثم غادر الفسطاط سراً، وعبر الجزيرة العربية بعد شدائد عظيمة حتى بلغ العراق، فأقام بالكوفة مدة ثم استقر ببغداد {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  en: "On the feast of sacrifice of 350 — 20 January 962 — after writing a satire on Kafur, al-Mutanabbi left Fustat secretly and, crossing Arabia after great trials, reached Iraq, where he spent some time in Kufa before settling in Baghdad {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}."
  ur: "350ھ کے یوم النحر — 20 جنوری 962ء — کافور پر طنز لکھنے کے بعد متنبی خفیہ طور پر فسطاط سے نکل گئے اور بڑی مشقتوں کے بعد جزیرہ عرب پار کر کے عراق پہنچے؛ کچھ عرصہ کوفہ میں رہے پھر بغداد میں مقیم ہوئے {cite:encyclopaedia-of-islam-2 vol. 7 p. 770}۔"
