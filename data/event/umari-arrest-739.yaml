label:
  ar: "اعتقال ابن فضل الله ومصادرته، شعبان ٧٣٩هـ/١٣٣٩م"
  en: "Al-Umari's arrest and confiscation, Sha'ban 739/1339"
  ur: "عمری کی گرفتاری و ضبطی، شعبان 739ھ/1339ء"
  es: "Detención y confiscación de Al-Umari, Sha'ban 739/1339"
  fr: "Arrestation et confiscation d'Al-Umari, Sha'ban 739/1339"
  tr: "İbn Fadlallah'ın tutuklanması ve mallarına el konulması, Hicri 739 Şaban/Miladi 1339"
  id: "Penangkapan dan penyitaan harta Ibnu Fadlallah, Sya'ban 739 H/1339 M"
summary:
  ar: "رفع شهاب الدين قصة يسأل فيها السفر إلى الشام، فرسم عليه السلطان وصادره واعتقله في شعبان سنة ٧٣٩هـ، وقد أمر الدويدار بطلبه {cite:durar-kamina-jil-1993 1/332}."
  en: "Shihab al-Din petitioned for leave to travel to al-Sham; the sultan instead had the dawadar summon him, issued a rescript against him, confiscated his property and imprisoned him in Sha'ban 739 (February-March 1339) {cite:durar-kamina-jil-1993 1/332}."
  ur: "شہاب الدین نے شام کے سفر کی اجازت کے لیے عرضی پیش کی؛ سلطان نے اس کے بجائے دوادار کو اسے طلب کرنے کا حکم دیا، اس کے خلاف فرمان جاری کیا، اس کا مال ضبط کیا اور شعبان 739ھ ⁦(فروری-مارچ 1339ء)⁩ میں اسے قید کر دیا {cite:durar-kamina-jil-1993 1/332}۔"
  es: "Shihab al-Din solicitó permiso para viajar a al-Sham; el sultán, en cambio, hizo que el dawadar lo citara, emitió un rescripto en su contra, confiscó sus propiedades y lo encarceló en Sha'ban 739 (febrero-marzo de 1339) {cite:durar-kamina-jil-1993 1/332}."
  fr: "Shihab al-Din a demandé la permission de se rendre au Levant; le sultan a plutôt fait convoquer le dawadar, a émis un rescrit contre lui, a confisqué ses biens et l'a emprisonné en Sha'ban 739 (février-mars 1339) {cite:durar-kamina-jil-1993 1/332}."
  tr: "Şihab el-Din, Suriye'ye seyahat izni istediği bir hikaye anlattı; bunun üzerine Sultan, aleyhine bir kararname çıkardı, mallarına el koydu ve onu Hicri 739 yılının Şaban ayında tutukladı. Davidar, onun mahkemeye çağrılmasını emretti. {cite:durar-kamina-jil-1993 1/332}"
  id: "Shihab al-Din menyampaikan sebuah kisah di mana ia meminta izin untuk melakukan perjalanan ke Suriah, sehingga Sultan mengeluarkan dekrit terhadapnya, menyita harta miliknya, dan menangkapnya pada bulan Sya'ban tahun 739 H. Dawidar memerintahkan agar ia dipanggil. {cite:durar-kamina-jil-1993 1/332}."
