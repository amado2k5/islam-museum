label: { ar: "إسقاط الجزية عمن أسلم في عهد عمر بن عبد العزيز", en: "Remitting the Jizya for Converts under Umar ibn Abd al-Aziz", es: "Condonación de la yizia para los conversos bajo el mandato de Umar ibn Abd al-Aziz", fr: "Remise de la jizya pour les convertis sous le règne d'Umar ibn Abd al-Aziz", ur: "عمر بن عبدالعزیز کے دور میں مذہب تبدیل کرنے والوں کے لیے جزیہ معاف کرنا", tr: "Ömer ibn Abdülaziz döneminde İslamiyet'e geçenlerden cizye vergisi kaldırılmıştı.", id: "Jizya dihapuskan bagi mereka yang masuk Islam selama pemerintahan Umar ibn Abd al-Aziz." }
summary:
  ar: "أسقط عمر بن عبد العزيز الجزية عمن أسلم من أهل الذمة، وكتب إلى عماله ألا يؤخذ منه الجزية بعد أن يشهد الشهادتين ويستقبل القبلة ويختتن، ويذكر الكتاب أن عاملاً شكا نقص الجزية بسبب كثرة من أسلم، فرد عليه عمر بأن النبي بُعث داعياً لا جابياً {cite:salabi-umayyad-state-2020 pp.354-355}. وكان الكتاب يعزو إلى هذا الإجراء أثراً مالياً وسياسياً، إذ زادت الثقة بين الحاكم والمحكومين، وأسلم كثير من أهل الذمة فصاروا يؤدون الزكاة بدل الجزية {cite:salabi-umayyad-state-2020 p.355}. وفرض عمر الجزية على ثلاث طبقات بحسب الغنى، ورفعها عن الفقراء الذين لا يستطيعون دفعها {cite:salabi-umayyad-state-2020 p.354}."
  en: "Umar ibn Abd al-Aziz remitted the jizya for dhimmis who had embraced Islam, and wrote to his governors not to levy it on a convert who had testified to the two shahadas, faced the qibla and been circumcised. The book reports that an official complained the jizya was falling short because so many had converted, and Umar replied that the Prophet had been sent as a summoner, not a tax-collector {cite:salabi-umayyad-state-2020 pp.354-355}. The book attributes to this measure both a financial and a political effect: trust grew between ruler and ruled, and many dhimmis converted and began paying zakat in place of the jizya {cite:salabi-umayyad-state-2020 p.355}. Umar also levied the jizya in three grades according to means, and lifted it from the poor who could not pay {cite:salabi-umayyad-state-2020 p.354}."
  es: "Umar ibn Abd al-Aziz condonó la jizya a los dhimmis que se habían convertido al Islam y escribió a sus gobernadores que no la cobraran a los conversos que hubieran pronunciado las dos shahadas, se hubieran orientado hacia la qibla y hubieran sido circuncidados. El libro relata que un funcionario se quejó de que la jizya era insuficiente debido a la gran cantidad de conversos, a lo que Umar respondió que el Profeta había sido enviado como un llamador, no como un recaudador de impuestos {cite:salabi-umayyad-state-2020 pp.354-355}. El libro atribuye a esta medida un efecto tanto financiero como político: creció la confianza entre gobernantes y gobernados, y muchos dhimmis se convirtieron y comenzaron a pagar el zakat en lugar de la jizya {cite:salabi-umayyad-state-2020 p.355}. Umar también impuso la jizya en tres grados según los recursos, y la eliminó de los pobres que no podían pagar {cite:salabi-umayyad-state-2020 p.354}."
  fr: "Umar ibn Abd al-Aziz abolit la jizya pour les dhimmis convertis à l'islam et ordonna à ses gouverneurs de ne pas la percevoir sur un converti ayant prononcé les deux shahadas, s'étant tourné vers la qibla et ayant été circoncis. L'ouvrage rapporte qu'un fonctionnaire se plaignit de l'insuffisance des recettes de la jizya en raison du grand nombre de conversions, et qu'Umar répondit que le Prophète avait été envoyé comme huissier, et non comme percepteur d'impôts (Salabi Umayyad, 2020, p. 354-355). L'ouvrage attribue à cette mesure un double impact, financier et politique: la confiance s'intensifia entre gouvernants et gouvernés, et de nombreux dhimmis se convertirent et commencèrent à s'acquitter de la zakat en lieu et place de la jizya (Salabi Umayyad, 2020, p. 355). Umar a également imposé la jizya en trois niveaux selon les ressources, et l'a retirée aux pauvres qui ne pouvaient pas payer {cite:salabi-umayyad-state-2020 p.354}."
  ur: "عمر بن عبد العزیز نے اسلام قبول کرنے والے ذمیوں کے لیے جزیہ معاف کر دیا، اور اپنے گورنروں کو لکھا کہ اسے کسی ایسے شخص پر عائد نہ کیا جائے جس نے دو شھدوں کی گواہی دی ہو، قبلہ کی طرف منہ کیا ہو اور ختنہ کروایا ہو۔ کتاب میں بتایا گیا ہے کہ ایک اہلکار نے شکایت کی کہ جزیہ کم ہو رہا ہے کیونکہ بہت سے لوگ مذہب تبدیل کر چکے ہیں، اور عمر نے جواب دیا کہ نبی کو بلانے والے کے طور پر بھیجا گیا تھا، ٹیکس جمع کرنے والے کے طور پر نہیں کتاب اس اقدام کو مالی اور سیاسی دونوں طرح کے اثر سے منسوب کرتی ہے: حاکم اور حکمران کے درمیان اعتماد بڑھتا گیا، اور بہت سے ذمیوں نے مذہب تبدیل کیا اور جزیہ کی جگہ زکوٰۃ ادا کرنا شروع کر دی۔ عمر نے اسباب کے مطابق جزیہ بھی تین درجوں میں لگایا اور ان غریبوں سے اٹھا لیا جو ادا نہیں کر سکتے تھے۔"
  tr: "Ömer ibn Abdülaziz, Kitap Ehli (zimmi) arasında İslam'a geçenlerden cizye (baş vergisi) almayı kaldırdı. Valilerine yazdığı mektupta, iki şahitlik sözü verdikten, kıbleye döndükten ve sünnet olduktan sonra onlardan cizye toplamamaları talimatını verdi. Mektupta, bir valinin çok sayıda Müslüman olanın sayısındaki azalma nedeniyle cizye gelirinde düşüşten şikayet ettiği, Ömer'in ise Peygamberin vergi tahsildarı olarak değil, İslam'a davetçi olarak gönderildiğini söylediği belirtiliyor. Mektupta bu önlemin hem mali hem de siyasi faydaları olduğu, yönetici ile yönetilenler arasındaki güveni artırdığı ve Kitap Ehli'nin birçoğunun İslam'a geçerek cizye yerine zekât vermeye başladığı ifade ediliyor. Ömer, cizyeyi zenginliklerine göre üç sınıfa ayırdı ve ödeyemeyen fakirleri muaf tuttu."
  id: "Umar ibn Abd al-Aziz menghapuskan jizya (pajak kepala) bagi mereka yang termasuk dalam Ahlul Kitab (dhimmis) yang masuk Islam. Ia menulis surat kepada para gubernurnya, memerintahkan mereka untuk tidak memungut jizya setelah mereka mengucapkan dua syahadat, menghadap kiblat (arah salat), dan disunat. Surat itu menyebutkan bahwa seorang gubernur mengeluh tentang penurunan pendapatan jizya karena banyaknya mualaf, yang kemudian dijawab oleh Umar bahwa Nabi diutus sebagai penyeru kepada Islam, bukan sebagai pemungut pajak. Surat itu mengaitkan tindakan ini dengan manfaat finansial dan politik, karena meningkatkan kepercayaan antara penguasa dan yang diperintah, dan banyak Ahlul Kitab yang masuk Islam dan mulai membayar zakat (sedekah) sebagai pengganti jizya. Umar memberlakukan jizya pada tiga golongan berdasarkan kekayaan, dengan mengecualikan kaum miskin yang tidak mampu membayarnya."
