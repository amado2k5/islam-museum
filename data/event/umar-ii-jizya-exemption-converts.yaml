label: { ar: "إسقاط الجزية عمن أسلم في عهد عمر بن عبد العزيز" }
summary:
  ar: "أسقط عمر بن عبد العزيز الجزية عمن أسلم من أهل الذمة، وكتب إلى عماله ألا يؤخذ منه الجزية بعد أن يشهد الشهادتين ويستقبل القبلة ويختتن، ويذكر الكتاب أن عاملاً شكا نقص الجزية بسبب كثرة من أسلم، فرد عليه عمر بأن النبي بُعث داعياً لا جابياً {cite:salabi-umayyad-state-2020 pp.354-355}. وكان الكتاب يعزو إلى هذا الإجراء أثراً مالياً وسياسياً، إذ زادت الثقة بين الحاكم والمحكومين، وأسلم كثير من أهل الذمة فصاروا يؤدون الزكاة بدل الجزية {cite:salabi-umayyad-state-2020 p.355}. وفرض عمر الجزية على ثلاث طبقات بحسب الغنى، ورفعها عن الفقراء الذين لا يستطيعون دفعها {cite:salabi-umayyad-state-2020 p.354}."
date:
  start: { hijri: "0099", precision: year, status: historical, note: "ضمن خلافة عمر بن عبد العزيز التي بدأت سنة 99هـ؛ لم يذكر الكتاب تاريخاً دقيقاً لهذا الأمر.", sources: [source/salabi-umayyad-state-2020] }
