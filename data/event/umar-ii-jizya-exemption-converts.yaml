id: event/umar-ii-jizya-exemption-converts
class: event
kind: other
label: { ar: "إسقاط الجزية عمن أسلم في عهد عمر بن عبد العزيز", en: "Remitting the Jizya for Converts under Umar ibn Abd al-Aziz" }
summary:
  ar: "أسقط عمر بن عبد العزيز الجزية عمن أسلم من أهل الذمة، وكتب إلى عماله ألا يؤخذ منه الجزية بعد أن يشهد الشهادتين ويستقبل القبلة ويختتن، ويذكر الكتاب أن عاملاً شكا نقص الجزية بسبب كثرة من أسلم، فرد عليه عمر بأن النبي بُعث داعياً لا جابياً {cite:salabi-umayyad-state-2020 pp.354-355}. وكان الكتاب يعزو إلى هذا الإجراء أثراً مالياً وسياسياً، إذ زادت الثقة بين الحاكم والمحكومين، وأسلم كثير من أهل الذمة فصاروا يؤدون الزكاة بدل الجزية {cite:salabi-umayyad-state-2020 p.355}. وفرض عمر الجزية على ثلاث طبقات بحسب الغنى، ورفعها عن الفقراء الذين لا يستطيعون دفعها {cite:salabi-umayyad-state-2020 p.354}."
  en: "Umar ibn Abd al-Aziz remitted the jizya for dhimmis who had embraced Islam, and wrote to his governors not to levy it on a convert who had testified to the two shahadas, faced the qibla and been circumcised. The book reports that an official complained the jizya was falling short because so many had converted, and Umar replied that the Prophet had been sent as a summoner, not a tax-collector {cite:salabi-umayyad-state-2020 pp.354-355}. The book attributes to this measure both a financial and a political effect: trust grew between ruler and ruled, and many dhimmis converted and began paying zakat in place of the jizya {cite:salabi-umayyad-state-2020 p.355}. Umar also levied the jizya in three grades according to means, and lifted it from the poor who could not pay {cite:salabi-umayyad-state-2020 p.354}."
