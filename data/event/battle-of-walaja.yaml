label: { ar: "وقعة الولجة", en: "Battle of al-Walaja", fr: "La bataille d'al-Walaja", es: "Batalla de al-Walaja" }
summary:
  ar: "في صفر سنة اثنتي عشرة وقعت الولجة قرب كسكر من البر، بعد أن أرسل أردشير الأندرزغر، وهو فارسي من مولدي السواد، وأرسل معه بهمن جاذويه في أثره {cite:tabari-tarikh-abu-al-fadl j.3 p.353}."
  en: "In Safar of 12 AH the battle of al-Walaja was fought near Kaskar, on the land side, after Ardashir had sent al-Andarzghar, a Persian born in the Sawad, and sent Bahman Jadhawayh with him in pursuit {cite:tabari-tarikh-abu-al-fadl j.3 p.353}."
  fr: "En Safar 12 H, la bataille d'al-Walaja fut livrée près de Kaskar, du côté de la terre ferme, après qu'Ardashir eut envoyé al-Andarzghar, un Persan né dans le Sawad, et envoyé avec lui Bahman Jadhawayh à sa poursuite {cite:tabari-tarikh-abu-al-fadl j.3 p.353}."
  es: "En Safar del año 12 AH se libró la batalla de al-Walaja cerca de Kaskar, en tierra firme, después de que Ardashir enviara a al-Andarzghar, un persa nacido en Sawad, y enviara con él a Bahman Jadhawayh en su persecución {cite:tabari-tarikh-abu-al-fadl j.3 p.353}."
