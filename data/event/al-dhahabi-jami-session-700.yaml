label:
  ar: "الذهبي يتصدّر لحلقة الإقراء بالجامع الأموي، المحرم ٧٠٠هـ"
  en: "Al-Dhahabi heads a reading session at the Umayyad Mosque, Muharram 700/1300"
  ur: "ذہبی جامع اموی میں قراءت کے حلقے کے سربراہ، محرم 700ھ/1300ء"
summary:
  ar: "أول ما ولي الذهبي تصدير حلقةٍ قرأ بجامع دمشق في أول رواق زكريا، عوضاً عن شمس الدين المرّاقي الضرير المقرئ، في المحرم سنة ٧٠٠هـ، وذلك بعد رجوعه من رحلته إلى مصر بقليل {cite:durar-kamina-jil-1993 3/338}."
  en: "The first session whose headship al-Dhahabi assumed was a reading circle in the Great Umayyad Mosque of Damascus, in the first gallery of Zakariyya, in place of the blind reciter Shams al-Din al-Marraqi, in Muharram 700, shortly after his return from his Egyptian journey {cite:durar-kamina-jil-1993 3/338}."
  ur: "ذہبی نے پہلی بار جو حلقے کی صدارت سنبھالی وہ جامع دمشق میں رواقِ زکریا کے پہلے حصے میں قراءت کا حلقہ تھا، نابینا مقری شمس الدین مرّاقی کی جگہ، محرم 700ھ میں، اپنے مصری سفر سے واپسی کے کچھ ہی عرصے بعد {cite:durar-kamina-jil-1993 3/338}۔"
