label:
  ar: "عتق ياقوت عن عسكر الحموي ونفيه عنه، ٥٩٦هـ/١١٩٩م"
  en: "Yaqut manumitted and dismissed by Askar al-Hamawi, 596/1199"
  ur: "یاقوت کی آزادی اور عسکر حموی کی طرف سے برطرفی، 596ھ/1199ء"
summary:
  ar: "جرت بين ياقوت ومولاه عسكر نَبْوةٌ أوجبت عتقه والبعد عنه سنة ٥٩٦هـ/١١٩٩–١٢٠٠م {cite:shadharat-dhahab p. 121} {cite:encyclopaedia-of-islam-2 vol. 11 p. 264}، فاشتغل بالنسخ بالأجرة وارتزق منه — نسخ بين ٥٩٦ و٦٠٣هـ ثلاثمائة مجلد — وحصلت له بالمطالعة فوائد {cite:shadharat-dhahab p. 121} {cite:encyclopaedia-of-islam-2 vol. 11 p. 264}، ثم إن مولاه بعد مدة ألوى عليه وجعله شريكاً له بالمضاربة {cite:shadharat-dhahab p. 121} {cite:mawsuat-a3lam-ulama-adaba p. 277}."
  en: "A quarrel obliged Askar to emancipate Yaqut and send him away in 596/1199-1200 {cite:shadharat-dhahab p. 121} {cite:encyclopaedia-of-islam-2 vol. 11 p. 264}. He became a copyist for hire — between 596 and 603 he copied three hundred mujallads — and reading brought him profit of another kind {cite:shadharat-dhahab p. 121} {cite:encyclopaedia-of-islam-2 vol. 11 p. 264}; his former master later relented and took him back as a mudaraba partner {cite:shadharat-dhahab p. 121} {cite:mawsuat-a3lam-ulama-adaba p. 277}."
  ur: "یاقوت اور مولیٰ عسکر کے مابین جھگڑا ہوا جس پر 596ھ/1199-1200ء میں مولیٰ نے اسے آزاد کر دیا اور الگ کر دیا {cite:shadharat-dhahab p. 121} {cite:encyclopaedia-of-islam-2 vol. 11 p. 264}. وہ اجرت پر نقل کرنے لگا — 596 اور 603ھ کے درمیان تین سو جلدیں نقل کیں — اور مطالعے سے فوائد حاصل ہوئے {cite:shadharat-dhahab p. 121} {cite:encyclopaedia-of-islam-2 vol. 11 p. 264}؛ کچھ مدت بعد مولیٰ نے اسے دوبارہ مضاربہ کا شریک بنایا {cite:shadharat-dhahab p. 121} {cite:mawsuat-a3lam-ulama-adaba p. 277}۔"
