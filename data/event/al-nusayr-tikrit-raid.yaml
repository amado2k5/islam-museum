label: { ar: "غارة النسير وحذيفة إلى تكريت", en: "al-Nusayr and Hudhayfa's Raid toward Tikrit", es: "La incursión de al-Nusayr y Hudhayfa hacia Tikrit", fr: "Le raid d'al-Nusayr et d'Hudhayfa vers Tikrit", ur: "النصیر اور حذیفہ کا تکریت کی طرف حملہ" }
summary:
  ar: "عند البلاذري: وجّه التسير بن ديسم بن ثور من عين التمر إلى ماء لبني تغلب فطرقهم ليلاً فقتل وأسر ودلّه أسير أطلقه على حيّ من ربيعة فبيّتهم فغنم وسبى ومضى إلى ناحية تكريت في البر فغنم المسلمون. وعن أبي مسعود الكوفي: أتى عكبراء فأمّن أهلها وأخرجوا لمن معه طعاماً وعلفاً ثم مرّ بالبردان فأقبل أهلها يعدون من بين أيدي المسلمين فقال لهم لا بأس فكان ذلك أماناً ثم أتى المخرّم — ولم يكن يدعى يومئذ مخرّماً إنما نزله بعض ولد مخرّم بن حزن بن زياد بن أنس الديان الحارثي فسمّي به فيما ذكر الكلبي — ثم عبروا جسراً كان معقوداً عند قصر سابور الذي يعرف اليوم بقصر عيسى بن علي فخرج إليه خرزاد بن ماهبنذاذ وكان موكلاً به فقاتلوه وهزموه ثم لجئوا فأتوا عين التمر. وقال الواقدي: وجّه المثنى بن حارثة النسير وحذيفة بن محصن بعد يوم الجسر وبعد انحيازه بالمسلمين إلى خفان في خلافة عمر في خيل فأوقعا بقوم من بني تغلب وعبرا إلى تكريت فأصابا نعماً وشاء وقال عتاب بن إبراهيم عن أبي مسعود إن التسير وحذيفة آمنوا أهل تكريت وكتبا لهم كتاباً أنفذه لهم عتبة بن فرقد السلمي حين فتح الطيرهان والموصل وذكر أيضاً أن النسير توجّه من قبل خالد بن الوليد فأغار على قرى بمسكن وقطربل فغنم منها غنيمة حسنة."
  en: "In al-Baladhuri: al-Tusayr ibn Daysam ibn Thawr was sent from Ayn al-Tamr against a water of Banu Taghlib — he surprised them by night, killed and captured; a captive freed for guiding him to a Rabi'a clan led him to night-strike them for booty and captives, then he went to Tikrit's landward side and the Muslims took booty. Via Abu Mas'ud al-Kufi: he came to Ukbara' — its people safe-conducted, bringing food and fodder for his men — then passed al-Baradan whose people ran before the Muslims; he told them 'no harm' and that was their safe-conduct; then to al-Mukharrim — not yet called Mukharrim, only named after some descendant of Mukarram ibn Hazn ibn Ziyad ibn Anas al-Dayyan al-Harithi settled it, per al-Kalbi — then they crossed a bridge bound at Qasr Sabur, known today as Qasr Isa ibn Ali; Khurzad ibn Mahibandadh its garrisoned warden fought them and was routed, and they withdrew to Ayn al-Tamr. Al-Waqidi said: al-Muthanna ibn Haritha sent al-Nusayr and Hudhayfa ibn Mihsan after the Day of the Bridge and his withdrawal with the Muslims to Khaffan, in Umar's caliphate, with horse — they fell on some of Banu Taghlib, crossed to Tikrit and took cattle and sheep. Attab ibn Ibrahim via Abu Mas'ud: al-Tusayr and Hudhayfa safe-conducted Tikrit's people and wrote them a document which Utba ibn Farqad al-Sulami enforced for them when opening al-Tirhan and Mosul; it is also said al-Nusayr was sent by Khalid ibn al-Walid raiding villages at Maskin and Qatarrabul for a fine booty."
  es: "En al-Baladhuri: al-Tusayr ibn Daysam ibn Thawr fue enviado desde Ayn al-Tamr contra un río de Banu Taghlib; los sorprendió de noche, los mató y capturó; un cautivo liberado por guiarlo a un clan Rabi'a lo condujo a atacarlos de noche para obtener botín y cautivos, luego fue al lado terrestre de Tikrit y los musulmanes tomaron botín. A través de Abu Mas'ud al-Kufi: llegó a Ukbara', su gente fue salvada, trayendo comida y forraje para sus hombres, luego pasó por al-Baradan cuya gente corrió delante de los musulmanes; les dijo 'no hay daño' y esa fue su salvada; Luego a al-Mukharrim — que aún no se llamaba Mukharrim, sino que recibió su nombre de algún descendiente de Mukarram ibn Hazn ibn Ziyad ibn Anas al-Dayyan al-Harithi, quien lo fundó, según al-Kalbi — luego cruzaron un puente en Qasr Sabur, conocido hoy como Qasr Isa ibn Ali; Khurzad ibn Mahibandadh, su guardián de guarnición, luchó contra ellos y fue derrotado, y se retiraron a Ayn al-Tamr. Al-Waqidi dijo: al-Muthanna ibn Haritha envió a al-Nusayr y Hudhayfa ibn Mihsan después del Día del Puente y su retirada con los musulmanes a Khaffan, en el califato de Umar, con caballos — atacaron a algunos de Banu Taghlib, cruzaron a Tikrit y tomaron ganado vacuno y ovino. Attab ibn Ibrahim, a través de Abu Mas'ud: al-Tusayr y Hudhayfa escoltaron a la gente de Tikrit y les escribieron un documento que Utba ibn Farqad al-Sulami hizo cumplir en su favor al abrir al-Tirhan y Mosul; también se dice que al-Nusayr fue enviado por Khalid ibn al-Walid para saquear aldeas en Maskin y Qatarrabul en busca de un buen botín."
  fr: "D'après al-Baladhuri: al-Tusayr ibn Daysam ibn Thawr fut envoyé d'Ayn al-Tamr contre un groupe de Banu Taghlib. Il les surprit de nuit, les tua et en captura un. Un captif libéré pour l'avoir guidé vers un clan Rabi'a le conduisit à les attaquer de nuit pour s'emparer du butin et faire des prisonniers. Il se rendit ensuite à Tikrit par voie terrestre, où les musulmans prirent le butin. Selon Abu Mas'ud al-Kufi: il arriva à Ukbara', dont les habitants furent mis à l'abri, apportant de la nourriture et du fourrage à ses hommes. Il passa ensuite al-Baradan, dont les habitants s'enfuirent devant les musulmans. Il leur dit « pas de mal », et ce fut leur sauf-conduit. Puis, selon al-Kalbi, ils se rendirent à al-Mukharrim — qui n'était pas encore appelée Mukharrim, mais seulement nommée d'après un descendant de Mukarram ibn Hazn ibn Ziyad ibn Anas al-Dayyan al-Harithi qui s'y était établi — et traversèrent un pont à Qasr Sabur, aujourd'hui connu sous le nom de Qasr Isa ibn Ali. Khurzad ibn Mahibandadh, le gardien de la garnison, les combattit et fut mis en déroute. Ils se retirèrent alors à Ayn al-Tamr. Al-Waqidi rapporte qu'après la bataille du pont et la retraite des musulmans avec les musulmans à Khaffan, dans le califat d'Omar, al-Muthanna ibn Haritha envoya à cheval des hommes qui attaquèrent des Banu Taghlib, traversèrent la Manche pour gagner Tikrit et s'emparèrent de bétail. Attab ibn Ibrahim, par l'intermédiaire d'Abu Mas'ud: al-Tusayr et Hudhayfa ont mis en sécurité les habitants de Tikrit et leur ont rédigé un document qu'Utba ibn Farqad al-Sulami a fait appliquer pour eux lors de l'ouverture d'al-Tirhan et de Mossoul; il est également dit qu'al-Nusayr a été envoyé par Khalid ibn al-Walid piller des villages à Maskin et Qatarrabul pour un beau butin."
  ur: "البلادوری میں ہے: الطوسیر ابن دیم ابن ثور کو عین الطمر سے بنو تغلب کے پانی پر بھیجا گیا تھا - اس نے رات کو ان کو حیران کر دیا، قتل کیا اور گرفتار کر لیا۔ قبیلہ ربیعہ کی طرف رہنمائی کرنے کے لیے ایک قیدی کو آزاد کیا گیا جس نے انھیں مال غنیمت اور اسیری کے لیے رات کو مارا پھر وہ تکریت کی زمینی طرف گیا اور مسلمانوں نے مال غنیمت لے لیا۔ ابو مسعود الکوفی کے ذریعے: وہ عقبرہ آیا - اس کے لوگ محفوظ تھے، اپنے آدمیوں کے لیے کھانا اور چارہ لا رہے تھے - پھر البردان سے گزرے جس کے لوگ مسلمانوں کے آگے بھاگے؛ اس نے انہیں 'کوئی نقصان نہیں' بتایا اور یہ ان کا محفوظ طرز عمل تھا۔ پھر المخرم کی طرف - جسے ابھی تک مخرم نہیں کہا جاتا ہے، صرف مکرم بن حزن بن زیاد ابن انس الدیان الحارثی کے کسی اولاد کے نام پر رکھا گیا ہے، فی الکلبی - پھر انہوں نے قصر صابور پر ایک پل عبور کیا جسے آج قصر عیسیٰ ابن علی کہا جاتا ہے۔ اس کے چوکیدار خرزاد بن مہبندھ نے ان سے مقابلہ کیا اور اسے شکست دی گئی اور وہ عین الطمر کی طرف واپس چلے گئے۔ الواقدی نے کہا: المثنا بن حارثہ نے برج البلاغ کے بعد النصیر اور حذیفہ بن محصان کو عمر کے دور خلافت میں گھوڑے کے ساتھ خفان کی طرف مسلمانوں کے ساتھ بھیجا - وہ بنو تغلب کے کچھ حصے پر گرے، تکریت کی طرف بڑھے اور مویشی اور بھیڑیں لے گئے۔ عتاب بن ابراہیم بذریعہ ابومسعود: الطصر اور حذیفہ نے تکریت کے لوگوں کو محفوظ رکھا اور انہیں ایک دستاویز لکھوائی جسے عتبہ بن فرقد السلمی نے الطرحان اور موصل کو کھولتے وقت ان پر نافذ کیا تھا۔ یہ بھی کہا جاتا ہے کہ النصیر کو خالد بن الولید نے مسکین اور قطررابول کے دیہاتوں پر چھاپہ مار کر مال غنیمت کے لیے بھیجا تھا۔"
