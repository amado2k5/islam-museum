  ur: "1221 میں پروان کی جنگ کے لیے ڈرافٹ کارڈ، جلال الدین خوارزمشاہ کی سندھ سے پہلے منگول موہرے پر فتح؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1221 yılında gerçekleşen Parwan Muharebesi'nin ön raporu; Celaleddin Harezmi'nin Sind önünde Moğol öncü birliklerine karşı kazandığı zaferi anlatmaktadır; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Parwan pada tahun 1221 M, kemenangan Jalal al-Din al-Khwarizmi atas barisan depan Mongol di depan Sindh; sumber-sumber di halaman ini belum ditinjau."
