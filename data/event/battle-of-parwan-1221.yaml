summary:
  ar: "بطاقة أولية لمعركة بروان سنة ١٢٢١م، نصر جلال الدين الخوارزمي على طليعة المغول قبل السند؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Parwan in 1221, Jalal al-Din Khwarazmshah's victory over the Mongol vanguard before the Indus; its sources are not yet checked on the page."
