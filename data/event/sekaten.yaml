summary:
  ar: الاحتفال الجاوي السنوي بالمولد النبوي في يوغياكارتا — أسبوع من الطبول والسوق الشعبي أمام المسجد الكبير.
  en: The Javanese week-long Mawlid celebration in Yogyakarta — gamelan drums and a folk fair before the Great Mosque.
  es: "La celebración javanesa del Mawlid, que dura una semana, en Yogyakarta: tambores gamelan y una feria folclórica frente a la Gran Mezquita."
  fr: "La célébration javanaise du Mawlid, qui dure une semaine à Yogyakarta, comprend des tambours gamelan et une foire folklorique devant la Grande Mosquée."
  ur: "یوگیکارتا میں جاوانی ہفتہ بھر تک جاری رہنے والا میلاد کا جشن — گیملان ڈرم اور عظیم مسجد سے پہلے ایک لوک میلہ۔"
  tr: "Cava halkının her yıl Yogyakarta'da Peygamberimizin doğum gününü kutlaması; bir hafta süren davul sesleri ve Büyük Cami önünde kurulan popüler bir pazar."
  id: "Perayaan tahunan Nabi Muhammad SAW di Yogyakarta — seminggu penuh dengan tabuhan gendang dan pasar tradisional yang ramai di depan Masjidil Haram."
