label: { ar: "تدبير قتيبة أمر خوارزم", en: "Qutayba's Settlement of Khwarizm", es: "El asentamiento de Khwarizm en Qutayba", fr: "Règlement de Khwarizm par Qutayba", ur: "قتیبہ کی خوارزم کی آباد کاری", tr: "Kuteybe'nin Harezm meselesindeki yönetimi", id: "Penanganan kasus Khwarazm oleh Qutaybah" }
summary:
  ar: "وجه قتيبة أخاه عبد الرحمن بن مسلم إلى خرزاد فقاتله فقتله وظفر بأربعة آلاف أسير فقتلهم وملك ملك خوارزم الأول على ما شرط له فقال له أهل مملكته إنه ضعيف ووثبوا عليه فقتلوه فولى قتيبة أخاه عبيد الله بن مسلم خوارزم."
  en: "Qutayba sent his brother Abd al-Rahman ibn Muslim against Khurrazad — killed, with four thousand prisoners slain — and restored the first king on the agreed terms; his own people, calling him weak, killed him, whereupon Qutayba gave Khwarizm to his brother Ubaydallah ibn Muslim."
  es: "Qutayba envió a su hermano Abd al-Rahman ibn Muslim contra Khurrazad —quien fue asesinado, junto con cuatro mil prisioneros— y restauró al primer rey en los términos acordados; su propio pueblo, considerándolo débil, lo mató, tras lo cual Qutayba entregó Khwarizm a su hermano Ubaydallah ibn Muslim."
  fr: "Qutayba envoya son frère Abd al-Rahman ibn Muslim contre Khurrazad — qui fut tué, avec quatre mille prisonniers massacrés — et rétablit le premier roi aux termes convenus; son propre peuple, le jugeant faible, le tua, après quoi Qutayba donna le Khwarezm à son frère Ubaydallah ibn Muslim."
  ur: "قتیبہ نے اپنے بھائی عبدالرحمٰن بن مسلم کو خرزاد کے خلاف بھیجا - مارا گیا، چار ہزار قیدی مارے گئے - اور پہلے بادشاہ کو متفقہ شرائط پر بحال کیا۔ اس کے اپنے لوگوں نے اسے کمزور کہہ کر قتل کر دیا، اس کے بعد قتیبہ نے خوارزم کو اپنے بھائی عبیداللہ ابن مسلم کو دے دیا۔"
  tr: "Kuteybe, kardeşi Abdurrahman ibn Müslim'i Harezd'e gönderdi. Abdurrahman onunla savaştı, onu öldürdü ve dört bin esir aldı. Onları da öldürdükten sonra, Kuteybe'nin kendisi için şart koştuğu gibi Harezm'in ilk kralı oldu. Ancak krallığının halkı onun zayıf olduğunu söyleyerek ona saldırdı ve onu öldürdü. Bunun üzerine Kuteybe, kardeşi Ubeydullah ibn Müslim'i Harezm valisi olarak atadı."
  id: "Qutaybah mengutus saudaranya, Abd al-Rahman ibn Muslim, kepada Khurazad, lalu ia memeranginya dan membunuhnya serta menangkap empat ribu tawanan. Setelah itu, ia menjadi raja pertama Khwarazm, sebagaimana yang telah ia tetapkan. Namun, rakyat kerajaannya mengatakan kepadanya bahwa ia lemah, lalu mereka menyerangnya dan membunuhnya. Maka Qutaybah mengangkat saudaranya, Ubayd Allah ibn Muslim, sebagai gubernur Khwarazm."
