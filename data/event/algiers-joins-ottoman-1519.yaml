label: { ar: "دخول الجزائر تحت السيادة العثمانية (٩٢٥هـ/١٥١٩م)", en: "Algiers enters Ottoman sovereignty (1519)" }
summary:
  ar: "بعث أهل مدينة الجزائر بأمر خير الدين بربروسة سفارة برئاسة الفقيه أبي العباس أحمد بن قاضي إلى السلطان سليم الأول، حاملة رسالة مؤرخة بأوائل ذي القعدة ٩٢٥هـ/أكتوبر-نوفمبر ١٥١٩م من القضاة والخطباء والفقهاء والتجار والأعيان وسكان المدينة لطلب ربط الجزائر بالدولة العثمانية — وهي الوثيقة المحفوظة في طوب قابي سيراي برقم ٤٦٥٦. فأجاب السلطان سليم بمنح خير الدين رتبة بكلربك وإرسال قوة من سلاح المدفعية وألفين من الإنكشارية، ودُعي له على المنابر وضُربت العملة باسمه، فدخلت الجزائر رسمياً تحت السيادة العثمانية سنة ١٥١٩م أولَ أقاليم شمال أفريقية، ويؤكد المؤلف أن دخول القوات جاء استجابة لاستغاثة الأهل لا غزواً ضد رغبتهم {cite:dawlat-uthmaniyya-salabi p. 211-213}."
  en: "In early Dhu'l-Qa'da 925/October–November 1519 the notables of Algiers, at Khayr al-Din's order, sent the jurist Ahmad b. Qadi to Sultan Selim I with a letter (Topkapı archive no. 4656) asking to bind the city to the Ottoman state. Selim answered with the rank of beylerbey, artillery and 2,000 Janissaries; his name entered the pulpits and the coinage, and Algiers became the first North African province under Ottoman sovereignty — an entry al-Salabi stresses was by the inhabitants' appeal, not against their will {cite:dawlat-uthmaniyya-salabi p. 211-213}."
