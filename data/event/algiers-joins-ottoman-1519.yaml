label: { ar: "دخول الجزائر تحت السيادة العثمانية ⁦(٩٢٥هـ/١٥١٩م)⁩", en: "Algiers enters Ottoman sovereignty (1519)", es: "Argel pasa a estar bajo soberanía otomana (1519)", fr: "Alger entre sous souveraineté ottomane (1519)" }
summary:
  ar: "بعث أهل مدينة الجزائر بأمر خير الدين بربروسة سفارة برئاسة الفقيه أبي العباس أحمد بن قاضي إلى السلطان سليم الأول، حاملة رسالة مؤرخة بأوائل ذي القعدة ٩٢٥هـ/أكتوبر-نوفمبر ١٥١٩م من القضاة والخطباء والفقهاء والتجار والأعيان وسكان المدينة لطلب ربط الجزائر بالدولة العثمانية — وهي الوثيقة المحفوظة في طوب قابي سيراي برقم ٤٦٥٦. فأجاب السلطان سليم بمنح خير الدين رتبة بكلربك وإرسال قوة من سلاح المدفعية وألفين من الإنكشارية، ودُعي له على المنابر وضُربت العملة باسمه، فدخلت الجزائر رسمياً تحت السيادة العثمانية سنة ١٥١٩م أولَ أقاليم شمال أفريقية، ويؤكد المؤلف أن دخول القوات جاء استجابة لاستغاثة الأهل لا غزواً ضد رغبتهم {cite:dawlat-uthmaniyya-salabi p. 211-213}."
  en: "In early Dhu'l-Qa'da 925/October–November 1519 the notables of Algiers, at Khayr al-Din's order, sent the jurist Ahmad b. Qadi to Sultan Selim I with a letter (Topkapı archive no. 4656) asking to bind the city to the Ottoman state. Selim answered with the rank of beylerbey, artillery and 2,000 Janissaries; his name entered the pulpits and the coinage, and Algiers became the first North African province under Ottoman sovereignty — an entry al-Salabi stresses was by the inhabitants' appeal, not against their will {cite:dawlat-uthmaniyya-salabi p. 211-213}."
  es: "A principios de Dhu'l-Qa'da 925/octubre-noviembre de 1519, los notables de Argel, por orden de Khayr al-Din, enviaron al jurista Ahmad b. Qadi al sultán Selim I con una carta (archivo Topkapı n.º 4656) solicitando la incorporación de la ciudad al estado otomano. Selim respondió con el rango de beylerbey, artillería y 2000 jenízaros; su nombre apareció en los púlpitos y en la acuñación de monedas, y Argel se convirtió en la primera provincia del norte de África bajo soberanía otomana, una incorporación que al-Salabi subraya que se produjo por petición de los habitantes, no en contra de su voluntad {cite:dawlat-uthmaniyya-salabi p. 211-213}."
  fr: "Au début du mois de Dhu al-Qa'da 925 (octobre-novembre 1519), les notables d'Alger, sur ordre de Khayr al-Din, envoyèrent le juriste Ahmad ibn Qadi auprès du sultan Selim Ier avec une lettre (archives de Topkapı, n° 4656) demandant de rattacher la ville à l'État ottoman. Selim répondit en accordant le titre de beylerbey, de l'artillerie et 2 000 janissaires; son nom fut inscrit sur les chaires et les pièces de monnaie, et Alger devint la première province d'Afrique du Nord sous souveraineté ottomane – une intégration que, comme le souligne al-Salabi, elle fut obtenue à la demande des habitants, et non contre leur gré (voir: Dawlat-Uthmaniyya-Salabi, p. 211-213)."
