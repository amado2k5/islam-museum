label: { ar: "فتح همذان", en: "The Conquest of Hamadhan" }
summary:
  ar: "عند البلاذري: وجه المغيرة بن شعبة وهو عامل عمر بن الخطاب على الكوفة بعد عزل عمار بن ياسر جرير بن عبد الله البجلي إلى همذان وذلك في سنة 23 فقاتله أهلها ودفع دونها فأصيبت عينه بسهم فقال احتسبتها عند الله الذي زين بها وجهي ونور لي ما شاء ثم سلبنيها في سبيله ثم إنه فتح همذان على مثل صلح نهاوند وكان ذلك في آخر سنة 23 فقاتله أهلها ودفع عنها وغلب على أرضها فأخذها قسراً وقال الواقدي فتح جرير همذان في سنة 24 بعد ستة أشهر من وفاة عمر بن الخطاب وقد روى بعضهم أن المغيرة بن شعبة سار إلى همذان وعلى مقدمته جرير فافتتحها وأن المغيرة ضم همذان إلى كثير بن شهاب الحارثي وأن سعد بن أبي وقاص لما ولي الكوفة لعثمان بن عفان ولى العلاء بن وهب بن عبد بن وهبان أحد بني عامر بن لؤي ماه وهمذان فغدر أهل همذان ونقضوا فقاتلهم ثم إنهم نزلوا على حكمه فصالحهم على أن يؤدوا خراج أرضهم وجزية الرؤوس ويعطوه مائة ألف درهم للمسلمين ثم لا يعرض لهم في مال ولا حرمة ولا ولد."
  en: "In al-Baladhuri: al-Mughira ibn Shu'ba — Umar's Kufa agent after Ammar ibn Yasir's dismissal — sent Jarir ibn Abdallah al-Bajali to Hamadhan in year 23; its people fought him and held him off, and his eye was struck by an arrow — 'I have counted it with God who beautified my face with it, lit what He willed for me, then took it from me in His cause.' He then took Hamadhan on Nihawand's treaty terms, late in year 23; its people fought and resisted again, and he mastered their land, taking it by force. Al-Waqidi dates Jarir's conquest of Hamadhan to year 24, six months after Umar's death; some relate that al-Mughira himself marched with Jarir on the vanguard, annexing Hamadhan to Kathir ibn Shihab al-Harithi. When Sa'd ibn Abi Waqqas governed Kufa for Uthman he made al-Ala ibn Wahb ibn Abd ibn Wahban, of Banu Amir ibn Lu'ayy, governor of Mah and Hamadhan — Hamadhan's people broke faith; he fought them until they submitted to his judgment, and he made peace on their paying the land's kharaj and the heads' jizya plus a hundred thousand dirhams for the Muslims, with no trespass on wealth, honor or children."
