label: { ar: "فتح همذان", en: "The Conquest of Hamadhan", es: "La conquista de Hamadán", fr: "La conquête d'Hamadhan", ur: "حماد کی فتح", tr: "Hamadan'ın Fethi", id: "Penaklukan Hamadan" }
summary:
  ar: "عند البلاذري: وجه المغيرة بن شعبة وهو عامل عمر بن الخطاب على الكوفة بعد عزل عمار بن ياسر جرير بن عبد الله البجلي إلى همذان وذلك في سنة 23 فقاتله أهلها ودفع دونها فأصيبت عينه بسهم فقال احتسبتها عند الله الذي زين بها وجهي ونور لي ما شاء ثم سلبنيها في سبيله ثم إنه فتح همذان على مثل صلح نهاوند وكان ذلك في آخر سنة 23 فقاتله أهلها ودفع عنها وغلب على أرضها فأخذها قسراً وقال الواقدي فتح جرير همذان في سنة 24 بعد ستة أشهر من وفاة عمر بن الخطاب وقد روى بعضهم أن المغيرة بن شعبة سار إلى همذان وعلى مقدمته جرير فافتتحها وأن المغيرة ضم همذان إلى كثير بن شهاب الحارثي وأن سعد بن أبي وقاص لما ولي الكوفة لعثمان بن عفان ولى العلاء بن وهب بن عبد بن وهبان أحد بني عامر بن لؤي ماه وهمذان فغدر أهل همذان ونقضوا فقاتلهم ثم إنهم نزلوا على حكمه فصالحهم على أن يؤدوا خراج أرضهم وجزية الرؤوس ويعطوه مائة ألف درهم للمسلمين ثم لا يعرض لهم في مال ولا حرمة ولا ولد."
  en: "In al-Baladhuri: al-Mughira ibn Shu'ba — Umar's Kufa agent after Ammar ibn Yasir's dismissal — sent Jarir ibn Abdallah al-Bajali to Hamadhan in year 23; its people fought him and held him off, and his eye was struck by an arrow — 'I have counted it with God who beautified my face with it, lit what He willed for me, then took it from me in His cause.' He then took Hamadhan on Nihawand's treaty terms, late in year 23; its people fought and resisted again, and he mastered their land, taking it by force. Al-Waqidi dates Jarir's conquest of Hamadhan to year 24, six months after Umar's death; some relate that al-Mughira himself marched with Jarir on the vanguard, annexing Hamadhan to Kathir ibn Shihab al-Harithi. When Sa'd ibn Abi Waqqas governed Kufa for Uthman he made al-Ala ibn Wahb ibn Abd ibn Wahban, of Banu Amir ibn Lu'ayy, governor of Mah and Hamadhan — Hamadhan's people broke faith; he fought them until they submitted to his judgment, and he made peace on their paying the land's kharaj and the heads' jizya plus a hundred thousand dirhams for the Muslims, with no trespass on wealth, honor or children."
  es: "En al-Baladhuri: al-Mughira ibn Shu'ba — agente de Umar en Kufa tras la destitución de Ammar ibn Yasir — envió a Jarir ibn Abdallah al-Bajali a Hamadhan en el año 23; sus habitantes lucharon contra él y lo contuvieron, y una flecha le alcanzó un ojo: «Lo he contado con Dios, quien embelleció mi rostro con él, iluminó lo que Él quiso para mí y luego me lo quitó en Su causa». Luego tomó Hamadhan según los términos del tratado de Nihawand, a finales del año 23; sus habitantes lucharon y resistieron de nuevo, y él dominó su territorio, tomándolo por la fuerza. Al-Waqidi fecha la conquista de Hamadhan por Jarir en el año 24, seis meses después de la muerte de Umar; algunos relatan que el propio al-Mughira marchó con Jarir en la vanguardia, anexionando Hamadhan a Kathir ibn Shihab al-Harithi. Cuando Sa'd ibn Abi Waqqas gobernó Kufa para Uthman, nombró a al-Ala ibn Wahb ibn Abd ibn Wahban, de Banu Amir ibn Lu'ayy, gobernador de Mah y Hamadhan. La gente de Hamadhan rompió su promesa; él luchó contra ellos hasta que se sometieron a su juicio, y firmó la paz a cambio del pago del kharaj de la tierra y la jizya de los jefes, más cien mil dirhams para los musulmanes, sin infringir la riqueza, el honor ni a los hijos."
  fr: "Selon al-Baladhuri: al-Mughira ibn Shu'ba, agent d'Umar à Koufa après la destitution d'Ammar ibn Yasir, envoya Jarir ibn Abdallah al-Bajali à Hamadhan en l'an 23. Les habitants le combattirent et le repoussèrent. Jarir fut blessé à l'œil par une flèche: « Je l'ai imputé à Dieu qui a orné mon visage de cette blessure, a allumé ce qu'Il a voulu pour moi, puis me l'a reprise pour Sa cause. » Il s'empara ensuite de Hamadhan aux termes du traité de Nihawand, à la fin de l'an 23. Les habitants combattirent et résistèrent de nouveau, et Jarir s'empara de leurs terres par la force. Al-Waqidi date la conquête de Hamadhan par Jarir de l'an 24, six mois après la mort d'Umar. Certains rapportent qu'al-Mughira lui-même marcha avec Jarir en première ligne, annexant Hamadhan à Kathir ibn Shihab al-Harithi. Lorsque Sa'd ibn Abi Waqqas gouvernait Kufa pour Uthman, il nomma al-Ala ibn Wahb ibn Abd ibn Wahban, de Banu Amir ibn Lu'ayy, gouverneur de Mah et Hamadhan. — Le peuple de Hamadhan a rompu la foi; il les a combattus jusqu'à ce qu'ils se soumettent à son jugement, et il a fait la paix à condition qu'ils paient le kharaj de la terre et la jizya des têtes plus cent mille dirhams pour les musulmans, sans atteinte à la richesse, à l'honneur ou aux enfants."
  ur: "البلادھوری میں ہے: المغیرہ ابن شعبہ - عمار بن یاسر کی برطرفی کے بعد عمر کے کوفہ کے ایجنٹ - نے جریر بن عبداللہ البجلی کو 23 میں حمادان بھیجا۔ اس کے لوگوں نے اس سے لڑا اور اسے روک لیا، اور اس کی آنکھ پر تیر لگ گیا - 'میں نے اسے خدا کے ساتھ شمار کیا ہے جس نے اس سے میرے چہرے کو سجایا، اس نے میرے لئے جو چاہا روشن کیا، پھر اس کی راہ میں مجھ سے چھین لیا۔' اس کے بعد اس نے 23 کے آخر میں، نہاوند کے معاہدے کی شرائط پر ہمادھان کو لے لیا۔ اس کے لوگ دوبارہ لڑے اور مزاحمت کی، اور اس نے ان کی سرزمین پر قبضہ کر لیا، اسے زبردستی چھین لیا۔ الواقدی نے جریر کی حمادان کی فتح کی تاریخ عمر کی وفات کے چھ ماہ بعد 24 سال بتائی ہے۔ بعض کہتے ہیں کہ المغیرہ خود جریر کے ساتھ صف اول پر روانہ ہوا اور حماد کو کثیر بن شہاب الحارثی سے ملایا۔ جب سعد بن ابی وقاص نے عثمان کے لیے کوفہ پر حکومت کی تو اس نے بنو عامر بن لوئی کے علاء بن وہب ابن عبد بن وہبان کو مہ اور حماد کا گورنر بنایا - حماد کے لوگوں نے ایمان توڑا۔ اس نے ان سے اس وقت تک جنگ کی جب تک کہ وہ اس کے فیصلے کے سامنے سرتسلیم خم نہ کر دیں، اور اس نے مسلمانوں کے لیے زمین کے خوارج اور سروں کے جزیہ کے علاوہ ایک لاکھ درہم کی ادائیگی پر صلح کرائی، جس میں مال، عزت اور اولاد پر کوئی ظلم نہیں تھا۔"
  tr: "El-Baladhuri'ye göre: Ömer ibn el-Hattab'ın Ammar ibn Yasir'in görevden alınmasından sonra Kufa valisi olan El-Muğira ibn Şuba, Hicri 23 yılında Cerir ibn Abdullah el-Bajali'yi Hamadan'a gönderdi. Şehir halkı ona karşı savaştı ve şehri savundu, ancak Cerir'in gözüne bir ok isabet etti. Cerir, \"Bunu Allah'a emanet ediyorum, O yüzümü bununla süsledi ve dilediği gibi aydınlattı, sonra da kendi davası uğruna benden aldı\" dedi. Ardından Cerir, Nahavand Antlaşması'na benzer şekilde Hamadan'ı fethetti. Bu olay Hicri 23 yılının sonunda gerçekleşti. Şehir halkı ona tekrar karşı savaştı, şehri savundu ve Cerir onları alt ederek şehri zorla ele geçirdi. El-Vakidi, Cerir'in Hamadan'ı Hicri 24 yılında, Ömer ibn el-Hattab'ın ölümünden altı ay sonra fethettiğini söyledi. Bazı rivayetlere göre, el-Muğira ibn Şuba, ordusunun başında Cerir ile Hamadan'a yürüdü ve şehri fethetti. El-Muğira daha sonra Hamadan'ı Kathir ibn Şihab el-Hariti'ye ilhak etti. Osman ibn Affan tarafından Kufa valiliğine atanan Sa'd ibn Abi Vakkas, Beni Emir ibn Luayy kabilesinden el-Ala' ibn Vahb ibn Abd ibn Vahban'ı Hamadan valiliğine atadı. Hamadan halkı ona ihanet edip antlaşmayı bozdu, bu yüzden onlarla savaştı. Daha sonra onun hükmüne boyun eğdiler ve haraç ödemeleri şartıyla onlarla barış yaptı. Toprak vergisi ve kafa vergisi ödediler, Müslümanlara yüz bin dirhem verdiler ve sonra paralarına, şereflerine veya çocuklarına dokunmayacaklardı."
  id: "Menurut al-Baladhuri: Al-Mughira ibn Shu'ba, gubernur Kufa di bawah Umar ibn al-Khattab setelah pemecatan Ammar ibn Yasir, mengirim Jarir ibn Abdullah al-Bajali ke Hamadan pada tahun 23 H. Penduduknya melawannya dan mempertahankan kota, tetapi Jarir terkena panah di mata. Dia berkata, \"Aku menyerahkan ini kepada Allah, yang menghiasi wajahku dengannya dan meneranginya sesuai kehendak-Nya, lalu mengambilnya dariku untuk membela kepentingan-Nya.\" Kemudian, Jarir menaklukkan Hamadan, mirip dengan Perjanjian Nahavand. Ini terjadi pada akhir tahun 23 H. Penduduknya kembali melawannya, mempertahankannya, dan dia mengalahkan mereka, merebut kota itu dengan paksa. Al-Waqidi mengatakan bahwa Jarir menaklukkan Hamadan pada tahun 24 H, enam bulan setelah kematian Umar ibn al-Khattab. Beberapa riwayat menyatakan bahwa al-Mughira ibn Shu'ba berbaris ke Hamadan dengan Jarir sebagai kepala pasukannya dan menaklukkannya. Al-Mughira kemudian mencaplok Hamadan ke Kathir ibn Shihab al-Harithi. Ketika Sa'd ibn Abi Waqqas diangkat menjadi gubernur Kufa oleh Uthman ibn Affan, ia menunjuk al-Ala' ibn Wahb ibn Abd ibn Wahban, salah satu dari Banu Amir ibn Lu'ayy, sebagai gubernur Hamadan. Penduduk Hamadan mengkhianatinya dan melanggar perjanjian mereka, sehingga ia memerangi mereka. Mereka kemudian menyerah kepada keputusannya, dan ia berdamai dengan mereka dengan syarat mereka membayar upeti. Mereka membayar pajak tanah dan pajak kepala, dan mereka memberikan seratus ribu dirham kepada kaum Muslim, dan kemudian mereka tidak ikut campur dengan uang, kehormatan, atau anak-anak mereka."
