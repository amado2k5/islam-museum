label:
  ar: "ابنا محمد بن عبيد الله علي والقاسم يطلبان النصرة من شاكر وثقيف ووادعة، ص283"
  en: "The two sons of Muhammad ibn Ubaydallah, Ali and al-Qasim, ask Shakir, Thaqif and Wadi'a for aid, p. 283"
  ur: "محمد بن عبید اللہ کے دو بیٹے علی اور القاسم شاکر، ثقیف اور وادعہ سے مدد مانگتے ہیں، ص283"
summary:
  ar: "يكون ابنا أبي جعفر علي والقاسم في الحصن مع شاكر، فيأتيان أباهما بعد الوقعة، فيأمرهما أن يطلبا النصرة من شاكر وثقيف ووادعة، فتجيب شاكر وثقيف بنصف رجالها، ويمضيان إلى وادعة التي تعد بالخروج بكرة."
  en: "Abu Ja'far's two sons Ali and al-Qasim are at al-Hisn with Shakir, come to their father after the fight, and are told to seek aid from Shakir, Thaqif and Wadi'a; Shakir and Thaqif give half their men, and the sons go on to Wadi'a, who promise to come out at dawn."
  ur: "ابو جعفر کے دونوں بیٹے علی اور القاسم حصن میں شاکر کے ساتھ ہیں، لڑائی کے بعد باپ کے پاس آتے ہیں اور انہیں شاکر، ثقیف اور وادعہ سے مدد مانگنے کا کہا جاتا ہے؛ شاکر اور ثقیف اپنے آدھے لوگ دیتے ہیں اور بیٹے وادعہ کے پاس جاتے ہیں جو صبح نکلنے کا وعدہ کرتے ہیں۔"
