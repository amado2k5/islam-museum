summary:
  ar: "فتح حلب: سار أبو عبيدة من قنسرين إلى حلب وقد صالح أهل قنسرين نقضوا فبعث السمط الكندي فحصرهم وفتحها وأصاب بقرًا وغنمًا، وصالح أعراب حاضر حلب على الجزية فأسلموا بعد ذلك. وأتى حلب وعلى مقدمته عياض بن غنم الفهري فتحصن أهلها فحصرهم المسلمون، فلم يلبثوا أن طلبوا الصلح والأمان على أنفسهم وأولادهم ومدينتهم وكنائسهم وحصنهم فأعطوا ذلك واستُني عليهم موضع المسجد، وصالحهم عياض فأجازه أبو عبيدة؛ وقيل صولحوا على أن يُقاسموا منازلهم وكنائسهم، وقيل إن أهلها كانوا انتقلوا إلى أنطاكية فراسلوا في الصلح فلما تم رجعوا {cite:kamil-ibn-al-athir p. 323}."
  en: "Aleppo: Abu 'Ubayda sent 'Iyad ibn Ghanim ahead; the Aleppans held their fortress briefly, then asked for peace and aman over themselves, their children, city, churches and citadel — granted, with a site for the mosque stipulated; one tradition has them sharing houses and churches, another that they had decamped to Antioch and negotiated their return by treaty {cite:kamil-ibn-al-athir p. 323}."
