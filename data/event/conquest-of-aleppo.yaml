summary:
  ar: "فتح حلب: سار أبو عبيدة من قنسرين إلى حلب وقد صالح أهل قنسرين نقضوا فبعث السمط الكندي فحصرهم وفتحها وأصاب بقرًا وغنمًا، وصالح أعراب حاضر حلب على الجزية فأسلموا بعد ذلك. وأتى حلب وعلى مقدمته عياض بن غنم الفهري فتحصن أهلها فحصرهم المسلمون، فلم يلبثوا أن طلبوا الصلح والأمان على أنفسهم وأولادهم ومدينتهم وكنائسهم وحصنهم فأعطوا ذلك واستُني عليهم موضع المسجد، وصالحهم عياض فأجازه أبو عبيدة؛ وقيل صولحوا على أن يُقاسموا منازلهم وكنائسهم، وقيل إن أهلها كانوا انتقلوا إلى أنطاكية فراسلوا في الصلح فلما تم رجعوا {cite:kamil-ibn-al-athir p. 323}."
  en: "Aleppo: Abu 'Ubayda sent 'Iyad ibn Ghanim ahead; the Aleppans held their fortress briefly, then asked for peace and aman over themselves, their children, city, churches and citadel — granted, with a site for the mosque stipulated; one tradition has them sharing houses and churches, another that they had decamped to Antioch and negotiated their return by treaty {cite:kamil-ibn-al-athir p. 323}."
  es: "Alepo: Abu 'Ubayda envió a 'Iyad ibn Ghanim por delante; los habitantes de Alepo mantuvieron su fortaleza brevemente, luego pidieron paz y amnistía sobre sí mismos, sus hijos, la ciudad, las iglesias y la ciudadela; se les concedió, estipulándose un sitio para la mezquita; una tradición dice que compartieron casas e iglesias, otra que se habían trasladado a Antioquía y negociaron su regreso mediante un tratado {cite:kamil-ibn-al-athir p. 323}."
  fr: "Alep: Abou 'Ubayda envoya 'Iyad ibn Ghanim en avant; les Aleppans tinrent brièvement leur forteresse, puis demandèrent la paix et l'aman sur eux-mêmes, leurs enfants, leur ville, leurs églises et leur citadelle — accordés, avec un emplacement pour la mosquée stipulé; une tradition dit qu'ils partagèrent des maisons et des églises, une autre qu'ils avaient campé à Antioche et négocié leur retour par traité {cite: kamil-ibn-al-athir p. 323}."
  ur: "حلب: ابو عبیدہ نے عیاض بن غنیم کو آگے بھیجا۔ حلب والوں نے اپنے قلعے کو مختصر طور پر تھام لیا، پھر اپنے، اپنے بچوں، شہر، گرجا گھروں اور قلعوں کے لیے امن و امان کی درخواست کی - مسجد کے لیے جگہ مقرر کر دی گئی۔ ایک روایت میں ہے کہ وہ گھروں اور گرجا گھروں میں شریک تھے، دوسری یہ کہ انہوں نے انطاکیہ میں ڈیرے ڈالے تھے اور معاہدہ کے ذریعے ان کی واپسی پر بات چیت کی تھی۔ 323}۔"
  tr: "Halep'in Fethi: Ebu Ubeyde, Kınnasrin'den Halep'e yürüdü. Kınnasrin halkı barış yapmıştı ama bunu bozdu, bu yüzden el-Simt el-Kindi'yi gönderdi. El-Simt el-Kindi şehri kuşattı ve ele geçirdi, büyükbaş ve küçükbaş hayvanları aldı. Ayrıca Halep'in dışındaki Bedevilerle cizye (haraç) karşılığında barış yaptı ve Bedeviler İslam'ı kabul etti. Daha sonra ordusunun başında İyad ibn Ghanm el-Fihri ile Halep'e vardı. Halk kendilerini tahkim etti ve Müslümanlar onları kuşattı. Kısa süre sonra kendileri, çocukları, şehirleri, kiliseleri ve kaleleri için barış ve güvenlik istediler. Bu istekleri kabul edildi ve cami yeri onlar için inşa edildi. İyad onlarla barış yaptı ve Ebu Ubeyde bunu kabul etti. Ayrıca evlerini ve kiliselerini paylaşmaları şartıyla barış yaptıkları da söylenir. Başka bir rivayete göre, halk Antakya'ya taşınmış ve barış için elçiler göndermiş, barış sağlandığında ise geri dönmüştür. {kaynak: Kamil İbn el-Athir, s. 323}"
  id: "Penaklukan Aleppo: Abu Ubaidah berbaris dari Qinnasrin ke Aleppo. Penduduk Qinnasrin telah berdamai tetapi kemudian melanggarnya, sehingga ia mengirim al-Simt al-Kindi, yang mengepung dan merebut kota itu, menyita ternak sapi dan domba. Ia juga berdamai dengan suku Badui di pinggiran Aleppo dengan imbalan jizya (upeti), setelah itu mereka masuk Islam. Kemudian ia tiba di Aleppo, dengan Iyad ibn Ghanm al-Fihri sebagai kepala pasukannya. Penduduk memperkuat diri mereka, dan kaum Muslim mengepung mereka. Mereka segera meminta perdamaian dan keamanan untuk diri mereka sendiri, anak-anak mereka, kota mereka, gereja-gereja mereka, dan benteng mereka. Hal ini dikabulkan, dan lokasi masjid dibangun untuk mereka. Iyad berdamai dengan mereka, dan Abu Ubaidah menerimanya. Dikatakan juga bahwa mereka berdamai dengan syarat mereka berbagi rumah dan gereja mereka. Riwayat lain menyatakan bahwa penduduk telah pindah ke Antiokhia dan mengirim utusan untuk perdamaian, dan ketika perdamaian tercapai, mereka kembali. {mengutip: kamil-ibn-al-athir hal. 323}"
