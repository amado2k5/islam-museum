label: { ar: "إلحاق دار القطان بجامع المنصور", en: "The Annexation of Dar al-Qattan to the Mosque of al-Mansur", es: "La anexión de Dar al-Qattan a la mezquita de al-Mansur.", fr: "L'annexion de Dar al-Qattan à la mosquée d'al-Mansur", ur: "دار القطان کا مسجد المنصور سے الحاق", tr: "Dar al-Qattan'ın Al-Mansur Camii'ne bağlanması", id: "Menghubungkan Dar al-Qattan dengan Masjid Al-Mansur" }
summary:
  ar: "في سنة ستين ومائتين أمر مفلح التركي أن تُزاد في جامع المنصور الدار المسماة بدار القطان، وكان قديمًا ديوانًا للنصور، فتقدم مفلح إلى صاحبه القطان ببنائها وجعلها في الجامع ليُصلى فيها فنُسبت إلى القطان {cite:muntazam-ibn-al-jawzi p. 110}."
  en: "In 260 the Turk Muflih ordered the annexation to al-Mansur's congregational mosque of the hall called Dar al-Qattan, formerly a falconry bureau; its keeper al-Qattan built it into the mosque for prayer, and it took his name {cite:muntazam-ibn-al-jawzi p. 110}."
  es: "En 260, el turco Muflih ordenó la anexión a la mezquita congregacional de al-Mansur de la sala llamada Dar al-Qattan, antiguamente una oficina de cetrería; su guardián, al-Qattan, la construyó dentro de la mezquita para la oración, y tomó su nombre {cite:muntazam-ibn-al-jawzi p. 110}."
  fr: "En 260, le Turc Muflih ordonna l'annexion à la mosquée congrégationaliste d'al-Mansur de la salle appelée Dar al-Qattan, anciennement un bureau de fauconnerie; son gardien al-Qattan la transforma en mosquée pour la prière, et elle prit son nom {cite:muntazam-ibn-al-jawzi p. 110}."
  ur: "260 میں ترک مفلح نے دارالقطان نامی ہال کی المنصور کی اجتماعی مسجد سے الحاق کرنے کا حکم دیا، جو پہلے فالکنری بیورو تھا۔ اس کے رکھوالے القطان نے اسے نماز کے لیے مسجد میں بنایا اور اس کا نام اس کا نام رکھا۔ 110}۔"
  tr: "Hicri 260 yılında Muflih el-Turki, Dar el-Kattan adlı evin el-Mansur Camii'ne eklenmesini emretti. Bu ev daha önce el-Nasur'un Divanı idi. Muflih, namaz kılınabilmesi için bu evi inşa edip camiye yerleştirmesi için arkadaşı el-Kattan'a başvurdu ve evin el-Kattan'a atfedildiği belirtildi. {cite:muntazam-ibn-al-jawzi s. 110}"
  id: "Pada tahun 260 H, Muflih al-Turki memerintahkan agar rumah yang disebut Dar al-Qattan ditambahkan ke Masjid al-Mansur. Sebelumnya, rumah itu adalah sebuah Diwan (ruang pertemuan) al-Nasur. Muflih meminta bantuan temannya, al-Qattan, untuk membangunnya dan menempatkannya di dalam masjid agar salat dapat dilakukan di dalamnya, dan pembangunan tersebut dinisbahkan kepada al-Qattan. {cite:muntazam-ibn-al-jawzi p. 110}"
