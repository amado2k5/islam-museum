id: event/mutah-khalid-command-withdrawal
class: event
kind: other
label: { ar: "قيادة خالد بن الوليد وانسحاب الجيش", en: "Khalid ibn al-Walid's command and the army's withdrawal", es: "El mando de Khalid ibn al-Walid y la retirada del ejército.", fr: "Le commandement de Khalid ibn al-Walid et le retrait de l'armée", ur: "خالد بن ولید کی کمان اور فوج کا انخلاء", tr: "Halid ibn el-Velid'in liderliği ve ordunun geri çekilmesi", id: "Kepemimpinan Khalid ibn al-Walid dan penarikan pasukan" }
summary:
  ar: "بعد استشهاد القادة الثلاثة رفع ثابت بن أقرم الراية ورفض تولي القيادة، فاجتمع المسلمون على خالد بن الوليد. دافع خالد عن الجيش ثم انسحب بهم سالمين. وروى ابن هشام عن الزهري رواية مغايرة أن الله فتح عليهم. ويخبر خالد نفسه عند البخاري: «لقد انقطعت في يدي يوم مؤتة تسعة أسياف، فما بقي في يدي إلا صفيحة يمانية» {cite:sahih-al-bukhari 4265}."
  en: "After the three commanders' deaths, Thabit ibn Aqram picked up the standard and declined command; the men chose Khalid ibn al-Walid. Khalid maneuvered defensively and withdrew the army intact. Ibn Hisham cites al-Zuhri with a divergent tradition that God granted victory under Khalid."
  es: "Tras la muerte de los tres comandantes, Thabit ibn Aqram tomó el mando y lo rechazó; los hombres eligieron a Khalid ibn al-Walid. Khalid maniobró a la defensiva y retiró al ejército intacto. Ibn Hisham cita a al-Zuhri con una tradición divergente según la cual Dios concedió la victoria bajo el mando de Khalid."
  fr: "Après la mort des trois commandants, Thabit ibn Aqram prit l'étendard et refusa le commandement; les hommes choisirent Khalid ibn al-Walid. Ce dernier mena une manœuvre défensive et retira l'armée intacte. Ibn Hisham rapporte, à travers une tradition différente, qu'al-Zuhri a accordé la victoire sous le commandement de Khalid."
  ur: "تینوں کمانڈروں کی موت کے بعد، ثابت بن اکرام نے معیار کو اٹھایا اور کمان سے انکار کر دیا۔ مردوں نے خالد بن الولید کو منتخب کیا۔ خالد نے دفاعی چال چلی اور فوج کو برقرار رکھا۔ ابن ہشام نے الزہری کو ایک متضاد روایت کے ساتھ نقل کیا ہے کہ خدا نے خالد کو فتح عطا فرمائی۔"
  tr: "Üç komutanın şehit edilmesinden sonra, Sabit ibn Akram sancağı kaldırdı ve komutayı üstlenmeyi reddetti; bunun üzerine Müslümanlar Halid ibn el-Velid'in etrafında toplandılar. Halid orduyu savundu ve ardından onlarla birlikte güvenli bir şekilde geri çekildi. İbn Hişam, el-Zuhri'den farklı bir rivayet aktararak, Allah'ın onlara zafer bahşettiğini belirtmiştir. Halid'in kendisi Sahih el-Buhari'de şöyle anlatır: \"Mu'te günü elimde dokuz kılıç kırıldı ve elimde Yemen kılıcından başka bir şey kalmadı.\""
  id: "Setelah gugurnya tiga komandan, Thabit ibn Aqram mengangkat panji dan menolak untuk mengambil alih komando, sehingga kaum Muslimin berkumpul di sekitar Khalid ibn al-Walid. Khalid membela pasukan dan kemudian mundur bersama mereka dengan selamat. Ibn Hisham meriwayatkan kisah yang berbeda dari al-Zuhri, yang menyatakan bahwa Allah menganugerahkan kemenangan kepada mereka. Khalid sendiri menceritakan dalam Sahih al-Bukhari: “Sembilan pedang patah di tanganku pada hari Mu'tah, dan tidak ada yang tersisa di tanganku kecuali sebilah pedang Yaman.”"
