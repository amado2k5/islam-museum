label: { ar: "قيادة خالد بن الوليد وانسحاب الجيش", en: "Khalid ibn al-Walid's command and the army's withdrawal" }
summary:
  ar: "بعد استشهاد القادة الثلاثة رفع ثابت بن أقرم الراية ورفض تولي القيادة، فاجتمع المسلمون على خالد بن الوليد. دافع خالد عن الجيش ثم انسحب بهم سالمين. وروى ابن هشام عن الزهري رواية مغايرة أن الله فتح عليهم. ويخبر خالد نفسه عند البخاري: «لقد انقطعت في يدي يوم مؤتة تسعة أسياف، فما بقي في يدي إلا صفيحة يمانية» {cite:sahih-al-bukhari 4265}."
  en: "After the three commanders' deaths, Thabit ibn Aqram picked up the standard and declined command; the men chose Khalid ibn al-Walid. Khalid maneuvered defensively and withdrew the army intact. Ibn Hisham cites al-Zuhri with a divergent tradition that God granted victory under Khalid."
