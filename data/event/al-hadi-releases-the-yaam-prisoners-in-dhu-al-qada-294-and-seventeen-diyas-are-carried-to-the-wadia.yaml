label:
  ar: "الهادي يطلق أسرى اليأميين في ذي القعدة 294هـ، وتُحمل سبع عشرة دية إلى الوادعيين، ص346"
  en: "Al-Hadi releases the Ya'am prisoners in Dhu al-Qa'da 294 AH and seventeen blood-money payments are carried to the Wada'a, p. 346"
  ur: "ہادی کا ذوالقعدہ 294ھ میں یامیین کے قیدی رہا کرنا اور وادعیین کو سترہ دیت پہنچانا، ص346"
summary:
  ar: "في ذي القعدة خرج محمد بن عبد الملك إلى الهادي فكلمه في أسرى اليأميين الذين حُبسوا لأجل الوادعيين، فأطلقهم، وحُملت سبع عشرة دية على عدد قتلى الوادعيين."
  en: "In Dhu al-Qa'da Muhammad ibn Abd al-Malik went to al-Hadi and spoke for the Ya'am prisoners held over the Wada'a. Al-Hadi released them, and seventeen blood-money payments, matching the number of the Wada'a dead, were carried."
  ur: "ذوالقعدہ میں محمد بن عبد الملک ہادی کے پاس گئے اور ان یامیین قیدیوں کے بارے میں بات کی جو وادعیین کے سبب قید تھے۔ ہادی نے انہیں رہا کیا، اور وادعیین کے مقتولوں کی تعداد کے مطابق سترہ دیت پہنچائی گئی۔"
