summary:
  ar: "زادت دجلة في سنة سبعين وثلثمائة زيادة مفرطة والفرات، وانفجر بثق وسقطت قناطر الصراة فوقعت الجديدة في نصف ذي القعدة ووقعت العتيقة بعدها وكان يوم الأربعاء، ثم وقع الشروع في عمل القنطرتين فأُنفق عليهما المال الكثير وبنيتا البناء الوثيق {cite:muntazam-ibn-al-jawzi j.7 p.110-111}."
  en: "In 370 the Tigris rose beyond measure together with the Euphrates; the Saraya bridges fell — the new one in mid-Dhu'l-Qa'da and the old one on a Wednesday after it — then both were rebuilt at great expense and solid construction {cite:muntazam-ibn-al-jawzi j.7 p.110-111}."
  es: "En el año 370, el Tigris creció desmesuradamente junto con el Éufrates; los puentes de Saraya cayeron —el nuevo a mediados de Dhu'l-Qa'da y el antiguo un miércoles después—, luego ambos fueron reconstruidos a un gran costo y con una sólida construcción {cite:muntazam-ibn-al-jawzi j.7 p.110-111}."
