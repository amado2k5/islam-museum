label: { ar: "ملك الروم عين زربة" }
summary:
  ar: "في سنة 347هـ نزل الروم مع الدمستق على عين زربة وهي في سفح جبل عظيم مشرف عليها في جمع عظيم فبعث بعض عسكره فصعدوا الجبل وملكوه فلما رأى أهل البلد ذلك طلبوا الأمان وفتحوا أبواب المدينة، فنادى في البلد أول الليل بأن يخرج جميع أهلها إلى الجامع ومن تخلف قُتل، فلما أصبح أرسل رجالته في المدينة وكانوا سبعين ألفاً وأمرهم بقتل من وجدوه في منزله فقتلوا خلقاً كثيراً من الرجال والنساء والصبيان وأمر بجمع السلاح، وأمر من في المسجد أن يخرجوا من البلد حيث شاءوا يومهم ومن أمسى قُتل فخرجوا مزدحمين فمات بالزحمة جماعة ولم يدرون أين يتوجهون فتاهوا في الفلوات، وقتل الروم من وجدوه بالمدينة آخر النهار وأخذوا كل ما خلف الناس من أموالهم وهدموا سور المدينة، وأقام الدمستق ببلد الإسلام أحد وعشرين يوماً وفتح حول عين زربة أربعة وخمسين حصناً للمسلمين بعضها بالسيف وبعضها بالأمان، وأمر أهل حصن من تلك الحصون بالخروج منه فلما خرجوا تعرض أحدهم الأرمني لبعض حرم المسلمين فألحق المسلمين غيرة فجردوا سيوفهم فاستقام الدمستق لذلك وأمر بقتل جميع المسلمين وكانوا أربعمائة رجل وقتل النساء والصبيان ولم يترك إلا من يصلح أن يسترق {cite:kamil-ibn-al-athir p. 398-399}."
  en: "In 347 the Domesticos stormed Ayn Zarba — seventy thousand picked men ordering every householder found at dawn to the sword, the mosque-crowd expelled through the crush into the wilderness, the walls razed; in twenty-one days he reduced fifty-four Muslim forts and massacred four hundred prisoners when one side-clash broke his safe-conduct {cite:kamil-ibn-al-athir p. 398-399}."
