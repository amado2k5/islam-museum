label: { ar: "ملك الروم عين زربة", en: "Byzantine Capture of Ayn Zarba", fr: "La prise byzantine de Ayn Zarba", es: "Captura bizantina de Ayn Zarba", ur: "عین زربا پر بازنطینی قبضہ", tr: "Romalıların Kralı, Ain Zarba", id: "Raja Romawi, Ain Zarba" }
summary:
  ar: "في سنة 347هـ نزل الروم مع الدمستق على عين زربة وهي في سفح جبل عظيم مشرف عليها في جمع عظيم فبعث بعض عسكره فصعدوا الجبل وملكوه فلما رأى أهل البلد ذلك طلبوا الأمان وفتحوا أبواب المدينة، فنادى في البلد أول الليل بأن يخرج جميع أهلها إلى الجامع ومن تخلف قُتل، فلما أصبح أرسل رجالته في المدينة وكانوا سبعين ألفاً وأمرهم بقتل من وجدوه في منزله فقتلوا خلقاً كثيراً من الرجال والنساء والصبيان وأمر بجمع السلاح، وأمر من في المسجد أن يخرجوا من البلد حيث شاءوا يومهم ومن أمسى قُتل فخرجوا مزدحمين فمات بالزحمة جماعة ولم يدرون أين يتوجهون فتاهوا في الفلوات، وقتل الروم من وجدوه بالمدينة آخر النهار وأخذوا كل ما خلف الناس من أموالهم وهدموا سور المدينة، وأقام الدمستق ببلد الإسلام أحد وعشرين يوماً وفتح حول عين زربة أربعة وخمسين حصناً للمسلمين بعضها بالسيف وبعضها بالأمان، وأمر أهل حصن من تلك الحصون بالخروج منه فلما خرجوا تعرض أحدهم الأرمني لبعض حرم المسلمين فألحق المسلمين غيرة فجردوا سيوفهم فاستقام الدمستق لذلك وأمر بقتل جميع المسلمين وكانوا أربعمائة رجل وقتل النساء والصبيان ولم يترك إلا من يصلح أن يسترق {cite:kamil-ibn-al-athir p. 398-399}."
  en: "In 347 the Domesticos stormed Ayn Zarba — seventy thousand picked men ordering every householder found at dawn to the sword, the mosque-crowd expelled through the crush into the wilderness, the walls razed; in twenty-one days he reduced fifty-four Muslim forts and massacred four hundred prisoners when one side-clash broke his safe-conduct {cite:kamil-ibn-al-athir p. 398-399}."
  fr: "En 347, le Domestique prit d'assaut Ayn Zarba : soixante-dix mille hommes d'élite, l'ordre de passer au fil de l'épée tout habitant trouvé chez lui à l'aube, la foule de la mosquée chassée dans la cohue vers le désert, les murailles rasées ; en vingt et un jours, il réduisit cinquante-quatre forts musulmans et massacra quatre cents prisonniers lorsqu'un accrochage rompit son sauf-conduit {cite:kamil-ibn-al-athir p. 398-399}."
  es: "En 347, el Domesticos asaltó Ayn Zarba: setenta mil hombres escogidos ordenaron a todo cabeza de familia encontrado al amanecer que fuera pasado a cuchillo, la multitud de la mezquita fue expulsada a través de la avalancha hacia el desierto, las murallas fueron arrasadas; en veintiún días redujo cincuenta y cuatro fortalezas musulmanas y masacró a cuatrocientos prisioneros cuando un enfrentamiento lateral rompió su salvoconducto {cite:kamil-ibn-al-athir p. 398-399}."
  ur: "347 میں ڈومیسٹیکوس نے عین زربا پر دھاوا بول دیا - ستر ہزار چنیدہ آدمی ہر گھر والے کو صبح سویرے تلوار مارنے کا حکم دیتے ہیں، مسجد کے ہجوم کو کچل کر بیابان میں نکال دیا گیا، دیواریں گرادی گئیں۔ اکیس دنوں میں اس نے مسلمانوں کے 54 قلعوں کو کم کیا اور چار سو قیدیوں کا قتل عام کیا جب ایک طرف کی جھڑپ نے اس کا محفوظ طرز عمل توڑ دیا۔ 398-399}۔"
  tr: "Hicri 347 yılında, Bizanslılar, Domestikos önderliğinde, büyük bir orduyla, şehri gören büyük bir dağın eteğinde bulunan Ain Zarba'ya saldırdılar. Domestikos, askerlerinden bazılarını dağa göndererek şehri ele geçirdi. Şehir halkı bunu görünce güvenli bir geçiş yolu aradılar ve şehir kapılarını açtılar. Gecenin başında şehirde bir duyuru yapıldı ve tüm halkın camiye gitmesi, geride kalanların öldürüleceği emredildi. Şafak vakti, yetmiş bin kişilik askerlerini şehre gönderdi ve evlerinde buldukları herkesi öldürmelerini emretti. Çok sayıda erkek, kadın ve çocuk öldürüldü. Silahların toplanmasını emretti ve camidekilere gün içinde istedikleri yere gitmelerini, geride kalanların öldürüleceğini söyledi. Kalabalık bir izdiham içinde şehri terk ettiler ve izdihamda birçok kişi öldü. Nereye gideceklerini bilmedikleri için ıssız bir yerde kayboldular. Bizanslılar günün sonunda şehirde buldukları herkesi öldürdüler, halkın tüm mallarına el koydular ve şehir surlarını yıktılar. Domestikos, Müslüman topraklarında yirmi bir gün kaldı ve Ayn Zarba çevresindeki elli dört Müslüman kalesini ele geçirdi; bazılarını zorla, bazılarını ise güvenli geçiş sağlayarak. Bu kalelerden birinin sakinlerine şehri terk etmelerini emretti ve onlar ayrıldığında, bir Ermeni adam bazı Müslüman kadınlara saldırdı. Bunun üzerine Müslümanlar kıskançlık duyarak kılıçlarını çektiler ve Domestikos da buna razı oldu ve dört yüz erkekten oluşan tüm Müslümanların, kadınların ve çocukların öldürülmesini emretti; köleleştirilmeye uygun kimseyi bırakmadı. {Kaynak: Kamil İbn el-Atir s. 398-399}"
  id: "Pada tahun 347 Hijriah, bangsa Bizantium, bersama dengan Domestikos, menyerbu Ain Zarba, yang terletak di kaki gunung besar yang menghadapinya, dengan pasukan besar. Ia mengirim beberapa pasukannya yang mendaki gunung dan merebutnya. Ketika penduduk kota melihat ini, mereka mencari jalan aman dan membuka gerbang kota. Pada awal malam, sebuah pengumuman dikeluarkan di kota yang memerintahkan semua penduduknya untuk pergi ke masjid, dan siapa pun yang tertinggal akan dibunuh. Saat fajar, ia mengirim pasukannya ke kota, berjumlah tujuh puluh ribu orang, dan memerintahkan mereka untuk membunuh siapa pun yang mereka temukan di rumah mereka. Mereka membunuh banyak pria, wanita, dan anak-anak. Ia memerintahkan pengumpulan senjata dan menginstruksikan mereka yang berada di masjid untuk meninggalkan kota ke mana pun mereka inginkan pada siang hari, dan siapa pun yang tertinggal akan dibunuh. Mereka pergi dengan berdesak-desakan, dan banyak yang tewas dalam desak-desakan itu. Karena tidak tahu ke mana harus pergi, mereka tersesat di padang gurun. Orang-orang Bizantium membunuh mereka yang mereka temukan di kota pada akhir hari, menyita semua harta benda penduduk, dan menghancurkan tembok kota. Domestikos tinggal di tanah Muslim selama dua puluh satu hari dan merebut lima puluh empat benteng Muslim di sekitar Ain Zarba, beberapa dengan kekerasan dan beberapa dengan memberikan jalan aman. Dia memerintahkan penduduk salah satu benteng ini untuk pergi, dan ketika mereka pergi, seorang pria Armenia menyerang beberapa wanita Muslim. Maka kaum Muslim menjadi cemburu dan menghunus pedang mereka, dan Domestikos menyetujui hal itu dan memerintahkan pembunuhan semua Muslim, yang berjumlah empat ratus orang, dan pembunuhan wanita dan anak-anak, dan dia tidak meninggalkan siapa pun yang layak untuk diperbudak. {cite:kamil-ibn-al-athir hlm. 398-399}."
