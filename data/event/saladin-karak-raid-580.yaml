summary:
  ar: "في ربيع الآخر سار صلاح الدين من دمشق فنازل الكرك ونصب المنجنيقات على ربضه فملك المسلمون الربض وبقي الحصن وبينهما خندق عمقه نحو ستين ذراعًا، فأمر بإلقاء الأحجار والتراب ليطمّه ولم يقدر أحد على الدنو لكثرة السهام والرجوم، فأمر ببناء سقائف من الأخشاب واللبن يمشي الرجال تحتها ويلقون في الخندق، ومنجنيقاته ترمي الحصن ليلًا ونهارًا، فاستعدى من فيه ملك الفرنج وفرسانه فاجتمعوا وساروا إلى نجدتهم، فرحل صلاح الدين إلى طريقهم ليصاففهم {cite:kamil-ibn-al-athir p. 127-128}."
  en: "In Rabi II Saladin marched on al-Karak: the mangonels took the outwork town, but between it and the keep ran a ditch sixty cubits deep. He had timber-and-brick galleries built so men could fill it under cover while his stones flew day and night; the garrison summoned every Frank, and Saladin lifted the siege to meet the relief host {cite:kamil-ibn-al-athir p. 127-128}."
