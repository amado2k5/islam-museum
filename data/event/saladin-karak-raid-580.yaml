label: { ar: "حصر صلاح الدين الكرك وملك الربض", en: "Saladin's Karak siege — the rabd taken, the sixty-cubit ditch", es: "El asedio de Karak por Saladino: el rabd tomado, la zanja de sesenta codos", fr: "Le siège de Karak par Saladin — la prise de la rabbin, le fossé de soixante coudées", ur: "صلاح الدین کا کرک کا محاصرہ - ربد لیا گیا، ساٹھ ہاتھ کی کھائی", tr: "Selahaddin, Karak'ı ve Banliyö Krallığı'nı kuşattı.", id: "Saladin mengepung Karak dan Kerajaan Pinggiran Kota." }
date:
  start: { edtf: "1184~", hijri: "0580", calendar: julian, precision: year, status: tradition, derived: true }
summary:
  ar: "في ربيع الآخر سار صلاح الدين من دمشق فنازل الكرك ونصب المنجنيقات على ربضه فملك المسلمون الربض وبقي الحصن وبينهما خندق عمقه نحو ستين ذراعًا، فأمر بإلقاء الأحجار والتراب ليطمّه ولم يقدر أحد على الدنو لكثرة السهام والرجوم، فأمر ببناء سقائف من الأخشاب واللبن يمشي الرجال تحتها ويلقون في الخندق، ومنجنيقاته ترمي الحصن ليلًا ونهارًا، فاستعدى من فيه ملك الفرنج وفرسانه فاجتمعوا وساروا إلى نجدتهم، فرحل صلاح الدين إلى طريقهم ليصاففهم {cite:kamil-ibn-al-athir p. 127-128}."
  en: "In Rabi II Saladin marched on al-Karak: the mangonels took the outwork town, but between it and the keep ran a ditch sixty cubits deep. He had timber-and-brick galleries built so men could fill it under cover while his stones flew day and night; the garrison summoned every Frank, and Saladin lifted the siege to meet the relief host {cite:kamil-ibn-al-athir p. 127-128}."
  es: "En Rabi II, Saladino marchó sobre al-Karak: los mangoneles tomaron la ciudad exterior, pero entre esta y la torre del homenaje corría una zanja de sesenta codos de profundidad. Mandó construir galerías de madera y ladrillo para que los hombres pudieran llenarla a cubierto mientras las piedras volaban día y noche; la guarnición convocó a todos los francos, y Saladino levantó el asedio para recibir al ejército de socorro {cite:kamil-ibn-al-athir p. 127-128}."
  fr: "En Rabi II, Saladin marcha sur al-Karak: les mangonneaux s’emparèrent de la ville fortifiée, mais entre celle-ci et le donjon s’étendait un fossé de soixante coudées de profondeur. Il fit construire des galeries de bois et de briques afin que les hommes puissent le combler à couvert pendant que ses pierres pleuvaient jour et nuit; la garnison mobilisa tous les Francs, et Saladin leva le siège pour accueillir les renforts {cite: kamil-ibn-al-athir p. 127-128}."
  ur: "ربیع دوم میں صلاح الدین نے الکرک پر کوچ کیا: منگونیلوں نے آؤٹ ورک ٹاؤن کو لے لیا، لیکن اس کے اور کیپ کے درمیان ساٹھ ہاتھ گہری کھائی چلی گئی۔ اس نے لکڑیوں اور اینٹوں کی گیلریاں بنائی تھیں تاکہ لوگ اسے ڈھانپ کر بھر سکیں جب کہ اس کے پتھر دن رات اڑتے رہتے تھے۔ گیریژن نے ہر فرینک کو طلب کیا، اور صلاح الدین نے امدادی میزبان سے ملنے کے لیے محاصرہ ختم کر دیا۔ 127-128}۔"
  tr: "İkinci yılın baharında Selahaddin Şam'dan yola çıktı ve Karak'ı kuşattı. Şehrin banliyölerine mancınıklar kurdu ve Müslümanlar banliyöleri ele geçirdi. Kale ayakta kaldı ve aralarında yaklaşık altmış arşın derinliğinde bir hendek vardı. Hendeği doldurmak için taş ve toprak atılmasını emretti, ancak çok sayıda ok ve taş nedeniyle kimse yaklaşamadı. Bu yüzden, insanların altında yürüyebilecekleri ve kendilerini hendeğe atabilecekleri tahta ve tuğladan sığınaklar inşa edilmesini emretti. Mancınıkları kaleyi gece gündüz bombaladı. İçeridekiler Frank kralına ve şövalyelerine seslendiler, böylece onlar da toplanıp yardıma geldiler. Selahaddin de onları karşılamak için yola çıktı. {cite:kamil-ibn-al-athir s. 127-128}"
  id: "Pada musim semi tahun kedua, Saladin berbaris dari Damaskus dan mengepung Karak. Ia memasang ketapel di pinggiran kota, dan kaum Muslim menguasai pinggiran kota tersebut. Benteng tetap berdiri, dan di antara keduanya terdapat parit sedalam sekitar enam puluh hasta. Ia memerintahkan agar batu dan tanah dilemparkan untuk mengisi parit tersebut, tetapi tidak ada yang bisa mendekat karena banyaknya anak panah dan batu. Maka ia memerintahkan agar dibangun tempat perlindungan dari kayu dan batu bata di bawahnya orang-orang dapat berjalan dan melemparkan diri ke dalam parit. Ketapelnya membombardir benteng siang dan malam. Mereka yang berada di dalam benteng meminta bantuan raja Frank dan para ksatria, sehingga mereka berkumpul dan berbaris untuk membantu. Saladin kemudian berangkat untuk menemui mereka. {cite:kamil-ibn-al-athir p. 127-128}"
