id: event/death-of-hajjaj-95
class: event
kind: death
label: { ar: "وفاة الحجاج بن يوسف", en: "Death of al-Hajjaj ibn Yusuf" }
summary:
  ar: "مات الحجاج بن يوسف سنة خمس وتسعين وهو ابن أربع وخمسين سنة بواسط العراق، وكانت إمارته على الناس عشرين سنة {cite:bakr-umayyad-state-1134715 p. 245}. وأحصى الكتاب من قتلهم صبراً مائة وعشرين ألفاً سوى من قتل في عساكره وحروبه، ومات وفي حبسه خمسون ألف رجل وثلاثون ألف امرأة {cite:bakr-umayyad-state-1134715 p. 245-246}. ويذكر الكتاب أنه لم يعش بعد قتل سعيد بن جبير إلا خمس عشرة ليلة {cite:bakr-umayyad-state-1134715 p. 243}. ويذكر الكتاب أن خبر وفاة الحجاج في شوال من سنة 95هـ بلغ قتيبة بعد أن أتم فتح الشاش وفرغانة، فاغتم لموته لما كان يلقاه منه من التأييد. {cite:salabi-umayyad-state-2020 p.94}"
  en: "Al-Hajjaj ibn Yusuf died in 95 at Wasit in Iraq, aged fifty-four, after twenty years in command over the people {cite:bakr-umayyad-state-1134715 p. 245}. The book counts 120,000 men put to death in cold blood, apart from those killed in his armies and wars, and says that 50,000 men and 30,000 women were in his prisons when he died {cite:bakr-umayyad-state-1134715 p. 245-246}. It notes that he lived only fifteen nights after the killing of Sa'id ibn Jubayr {cite:bakr-umayyad-state-1134715 p. 243}. It says that news of al-Hajjaj's death reached Qutayba in Shawwal 95 AH, after he had completed the conquest of al-Shash and Farghana, and that Qutayba grieved at his death because of the support he had received from him {cite:salabi-umayyad-state-2020 p.94}."
