label: { ar: "وفاة الحجاج بن يوسف", en: "Death of al-Hajjaj ibn Yusuf", es: "Muerte de al-Hajjaj ibn Yusuf", fr: "Mort d'al-Hajjaj ibn Yusuf", ur: "حجاج ابن یوسف کی وفات" }
summary:
  ar: "مات الحجاج بن يوسف سنة خمس وتسعين وهو ابن أربع وخمسين سنة بواسط العراق، وكانت إمارته على الناس عشرين سنة {cite:bakr-umayyad-state-1134715 p. 245}. وأحصى الكتاب من قتلهم صبراً مائة وعشرين ألفاً سوى من قتل في عساكره وحروبه، ومات وفي حبسه خمسون ألف رجل وثلاثون ألف امرأة {cite:bakr-umayyad-state-1134715 p. 245-246}. ويذكر الكتاب أنه لم يعش بعد قتل سعيد بن جبير إلا خمس عشرة ليلة {cite:bakr-umayyad-state-1134715 p. 243}. ويذكر الكتاب أن خبر وفاة الحجاج في شوال من سنة 95هـ بلغ قتيبة بعد أن أتم فتح الشاش وفرغانة، فاغتم لموته لما كان يلقاه منه من التأييد. {cite:salabi-umayyad-state-2020 p.94}"
  en: "Al-Hajjaj ibn Yusuf died in 95 at Wasit in Iraq, aged fifty-four, after twenty years in command over the people {cite:bakr-umayyad-state-1134715 p. 245}. The book counts 120,000 men put to death in cold blood, apart from those killed in his armies and wars, and says that 50,000 men and 30,000 women were in his prisons when he died {cite:bakr-umayyad-state-1134715 p. 245-246}. It notes that he lived only fifteen nights after the killing of Sa'id ibn Jubayr {cite:bakr-umayyad-state-1134715 p. 243}. It says that news of al-Hajjaj's death reached Qutayba in Shawwal 95 AH, after he had completed the conquest of al-Shash and Farghana, and that Qutayba grieved at his death because of the support he had received from him {cite:salabi-umayyad-state-2020 p.94}."
  es: "Al-Hajjaj ibn Yusuf murió en 95 en Wasit, Irak, a la edad de cincuenta y cuatro años, después de veinte años al mando del pueblo {cite:bakr-umayyad-state-1134715 p. 245}. El libro cuenta 120.000 hombres ejecutados a sangre fría, además de los muertos en sus ejércitos y guerras, y dice que 50.000 hombres y 30.000 mujeres estaban en sus prisiones cuando murió {cite:bakr-umayyad-state-1134715 p. 245-246}. Señala que vivió solo quince noches después del asesinato de Sa'id ibn Jubayr {cite:bakr-umayyad-state-1134715 p. 243}. Dice que la noticia de la muerte de al-Hajjaj llegó a Qutayba en Shawwal 95 AH, después de que hubiera completado la conquista de al-Shash y Farghana, y que Qutayba se lamentó de su muerte debido al apoyo que había recibido de él {cite:salabi-umayyad-state-2020 p.94}."
  fr: "Al-Hajjaj ibn Yusuf mourut en 95 à Wasit, en Irak, à l'âge de cinquante-quatre ans, après vingt ans de règne (source: Bakr-Umayyad-State, 1134715, p. 245). L'ouvrage recense 120 000 hommes exécutés de sang-froid, outre ceux tués dans ses armées et lors de ses guerres, et indique que 50 000 hommes et 30 000 femmes étaient détenus dans ses prisons à sa mort (source: Bakr-Umayyad-State, 1134715, p. 245-246). Il est à noter qu'il ne vécut que quinze nuits après l'assassinat de Sa'id ibn Jubayr (source: Bakr-Umayyad-State, 1134715, p. 243). Il est dit que la nouvelle de la mort d'al-Hajjaj parvint à Qutayba en Shawwal 95 AH, après qu'il eut achevé la conquête d'al-Shash et de Farghana, et que Qutayba fut affligé par sa mort en raison du soutien qu'il avait reçu de lui {cite:salabi-umayyad-state-2020 p.94}."
  ur: "الحجاج ابن یوسف 20 سال لوگوں پر حکمرانی کے بعد 95 میں عراق کے واسط میں 54 سال کی عمر میں وفات پا گئے۔ 245}۔ اس کتاب میں اس کی فوجوں اور جنگوں میں مارے جانے والوں کے علاوہ 120,000 مردوں کو سرد خون میں موت کے گھاٹ اتار دیا گیا ہے اور کہا گیا ہے کہ جب اس کی موت ہوئی تو اس کی جیلوں میں 50,000 مرد اور 30,000 عورتیں تھیں۔ 245-246}۔ اس میں لکھا ہے کہ وہ سعید بن جبیر کے قتل کے بعد صرف پندرہ راتیں زندہ رہا۔ 243}۔ اس میں کہا گیا ہے کہ الحجاج کی موت کی خبر قتیبہ کو شوال 95 ہجری میں قتیبہ تک پہنچی جب وہ الشاش اور فرغانہ کی فتح مکمل کر چکے تھے اور قتیبہ کو ان کی طرف سے ملنے والی حمایت کی وجہ سے غم ہوا تھا۔"
