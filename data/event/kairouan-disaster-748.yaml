label:
  ar: واقعة القيروان
  en: The Kairouan disaster
  es: "El desastre de Kairouan"
  fr: "La catastrophe de Kairouan"
  ur: "کیروان آفت"
  tr: "Kairouan Olayı"
  id: "Insiden Kairouan"
summary:
  ar: "أعظم وقائع دولة بني مرين: ثارت عرب إفريقية من أولاد مهلهل والكعوب وبني سليم على عساكر السلطان أبي الحسن المريني ونصبوا على رأسهم أحمد بن حمزة العائد من الإسكندرية، فزحف إليهم السلطان من تونس أيام الحج سنة 748هـ ولقيهم بالثنية دون القيروان فغلبهم، ثم تدامروا وانتقضوا عليه فأحاطوا به في القيروان واختل مصافه ودخلوها وانتهبوا معسكره، وخلص هو إلى سوسة وركب منها في أساطيله إلى تونس، وقد أجلب العرب وابن أبي دبوس معهم على الحضرة ونازلوها، حتى رحل السلطان عن إفريقية راجعاً إلى المغرب إذ وثب ابنه أبو عنان على الملك في غيبته."
  en: "The greatest battle of the Marinid era: the Arabs of Ifriqiya — sons of Mihhal, the Ka'ub and Banu Sulaym — rose against Abu al-Hasan's army and set over themselves Ahmad ibn Hamza back from Alexandria; the sultan marched in the hajj days of 748 and routed them at the defile below Kairouan, but they regathered, turned and hemmed him in the city, broke his ranks and plundered his camp, while he escaped to Susa and sailed for Tunis as the Arabs with Ibn Abi Dabbus laid siege to the capital — until he abandoned Ifriqiya for the Maghreb, his son Abu Inan having seized the throne in his absence."
  es: "La batalla más importante de la era mariní: los árabes de Ifriqiya —hijos de Mihhal, los Ka'ub y los Banu Sulaym— se alzaron contra el ejército de Abu al-Hasan y pusieron al mando a Ahmad ibn Hamza, que había regresado de Alejandría. El sultán marchó durante la peregrinación del Hajj de 748 y los derrotó en el desfiladero de Kairouan, pero se reagruparon, lo rodearon en la ciudad, rompieron sus filas y saquearon su campamento, mientras él escapaba a Susa y navegaba hacia Túnez, mientras los árabes, con Ibn Abi Dabbus al mando, sitiaban la capital. Finalmente, abandonó Ifriqiya para dirigirse al Magreb, ya que su hijo Abu Inan había usurpado el trono en su ausencia."
  fr: "La plus grande bataille de l'ère mérinide: les Arabes d'Ifriqiya — fils de Mihhal, du Ka'ub et des Banu Sulaym — se soulevèrent contre l'armée d'Abu al-Hasan et placèrent à leur tête Ahmad ibn Hamza de retour d'Alexandrie; le sultan marcha pendant les jours du hajj de 748 et les mit en déroute au défilé en contrebas de Kairouan, mais ils se regroupèrent, se retournèrent et l'encerclèrent dans la ville, brisèrent ses rangs et pillèrent son camp, tandis qu'il s'échappait à Suse et faisait voile vers Tunis alors que les Arabes, avec Ibn Abi Dabbus, assiégeaient la capitale — jusqu'à ce qu'il abandonne Ifriqiya pour le Maghreb, son fils Abu Inan ayant pris le trône en son absence."
  ur: "میرینیڈ دور کی سب سے بڑی جنگ: عفریقیہ کے عرب - میہل کے بیٹے کعب اور بنو سلیم - ابو الحسن کی فوج کے خلاف اٹھے اور احمد بن حمزہ کو اسکندریہ سے واپس لایا۔ سلطان نے 748 کے حج کے دنوں میں کوچ کیا اور انہیں کیروان کے نیچے ناپاک جگہوں سے بھگا دیا، لیکن وہ دوبارہ جمع ہوئے، مڑ گئے اور اسے شہر میں مار ڈالا، اس کی صفیں توڑ دیں اور اس کے کیمپ کو لوٹ لیا، جب کہ وہ سوسہ کی طرف بھاگا اور تیونس کی طرف روانہ ہوا جیسا کہ عربوں نے ابن ابی دبس کے ساتھ عربوں کے ساتھ اس وقت تک کہ اس نے دارالخلافہ کا قیام کیا۔ مغرب، اس کے بیٹے ابو عنان نے اس کی غیر موجودگی میں تخت پر قبضہ کر لیا۔"
  tr: "Marinid devletinin en önemli olayları: Muhalhil, Ka'ub ve Beni Salim soyundan gelen İfrikya Arapları, Sultan Ebu el-Hasan el-Marinid'in askerlerine karşı ayaklandılar ve İskenderiye'den dönen Ahmed bin Hamza'yı liderleri olarak atadılar. Sultan, Hicri 748 yılında Hac mevsiminde Tunus'tan onlara karşı yürüdü ve Kayrevan'da değil, el-Saniye'de onlarla karşılaştı ve onları yenilgiye uğrattı. Bunun üzerine isyan edip ona karşı ayaklandılar, Kayrevan'da onu kuşattılar, saflarını dağıttılar ve kampına girip yağmaladılar. Sultan Sousse'ye kaçtı ve oradan filolarıyla Tunus'a gitti. Arapları ve İbn Abi Dabbus'u başkente getirdi ve Sultan İfrikya'dan ayrılıp Mağrip'e dönene kadar şehri kuşattı; bu sırada oğlu Ebu Anan, yokluğunda tahtı ele geçirdi."
  id: "Peristiwa terbesar negara Marinid: Bangsa Arab Ifriqiya, keturunan Muhalhil, Ka’ub, dan Bani Salim, memberontak melawan tentara Sultan Abu al-Hasan al-Marinid dan mengangkat Ahmed bin Hamza, yang telah kembali dari Alexandria, sebagai pemimpin mereka. Sultan bergerak melawan mereka dari Tunis selama musim haji tahun 748 H dan bertemu mereka di al-Thaniya, bukan Kairouan, dan mengalahkan mereka. Kemudian mereka memberontak dan melawannya, sehingga mereka mengepungnya di Kairouan, dan barisannya hancur, lalu mereka memasuki dan menjarah perkemahannya. Ia melarikan diri ke Sousse dan berlayar dari sana dengan armadanya ke Tunis. Ia membawa bangsa Arab dan Ibn Abi Dabbus bersamanya ke ibu kota dan mengepungnya, hingga Sultan meninggalkan Ifriqiya dan kembali ke Maghreb, karena putranya Abu Anan merebut tahta selama ketidakhadirannya."
