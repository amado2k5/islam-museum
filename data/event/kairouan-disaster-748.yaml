id: event/kairouan-disaster-748
class: event
kind: battle
label:
  ar: واقعة القيروان
  en: The Kairouan disaster
summary:
  ar: "أعظم وقائع دولة بني مرين: ثارت عرب إفريقية من أولاد مهلهل والكعوب وبني سليم على عساكر السلطان أبي الحسن المريني ونصبوا على رأسهم أحمد بن حمزة العائد من الإسكندرية، فزحف إليهم السلطان من تونس أيام الحج سنة 748هـ ولقيهم بالثنية دون القيروان فغلبهم، ثم تدامروا وانتقضوا عليه فأحاطوا به في القيروان واختل مصافه ودخلوها وانتهبوا معسكره، وخلص هو إلى سوسة وركب منها في أساطيله إلى تونس، وقد أجلب العرب وابن أبي دبوس معهم على الحضرة ونازلوها، حتى رحل السلطان عن إفريقية راجعاً إلى المغرب إذ وثب ابنه أبو عنان على الملك في غيبته."
  en: "The greatest battle of the Marinid era: the Arabs of Ifriqiya — sons of Mihhal, the Ka'ub and Banu Sulaym — rose against Abu al-Hasan's army and set over themselves Ahmad ibn Hamza back from Alexandria; the sultan marched in the hajj days of 748 and routed them at the defile below Kairouan, but they regathered, turned and hemmed him in the city, broke his ranks and plundered his camp, while he escaped to Susa and sailed for Tunis as the Arabs with Ibn Abi Dabbus laid siege to the capital — until he abandoned Ifriqiya for the Maghreb, his son Abu Inan having seized the throne in his absence."
