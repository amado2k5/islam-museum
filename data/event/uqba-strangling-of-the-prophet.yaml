id: event/uqba-strangling-of-the-prophet
class: event
kind: other
label: { ar: "خنق عقبة بن أبي معيط للنبي في الحجر", en: "Uqba ibn Abi Mu'it chokes the Prophet at the Hijr", es: "Uqba ibn Abi Mu'it estrangula al Profeta en la Hégira.", fr: "Uqba ibn Abi Mu'it étrangle le Prophète lors de l'Hégire", ur: "عقبہ بن ابی معیط نے ہجرت میں نبی کا گلا گھونٹا۔" }
summary:
  ar: "وضع عقبة بن أبي معيط ثوبه في عنق النبي وهو يصلي عند الكعبة فخنقه خنقاً شديداً، فأخذ أبو بكر بمنكبيه ودفعه عنه وقال: أتقتلون رجلاً أن يقول ربي الله؟"
  en: "Uqba ibn Abi Mu'it put his garment around the Prophet's neck while he prayed by the Kaaba and choked him severely; Abu Bakr seized his shoulders, pushed him away and said: Will you kill a man for saying 'My Lord is God'?"
  es: "Uqba ibn Abi Mu'it le puso su manto alrededor del cuello al Profeta mientras este rezaba junto a la Kaaba y lo estranguló gravemente; Abu Bakr lo agarró por los hombros, lo apartó y dijo: ¿Mataréis a un hombre por decir 'Mi Señor es Dios'?"
  fr: "Uqba ibn Abi Mu'it mit son vêtement autour du cou du Prophète alors qu'il priait près de la Kaaba et l'étrangla violemment; Abu Bakr le saisit par les épaules, le repoussa et dit: « Tuerais-tu un homme pour avoir dit: \"Mon Seigneur est Dieu\" ? »"
  ur: "عقبہ بن ابی معیط نے کعبہ کے پاس نماز پڑھتے ہوئے اپنا لباس رسول اللہ کے گلے میں ڈالا اور آپ کا گلا دبا دیا۔ ابوبکر نے اس کے کندھے پکڑے، اسے دھکیل دیا اور کہا: کیا تم ایک آدمی کو یہ کہنے پر قتل کرو گے کہ میرا رب خدا ہے؟"
