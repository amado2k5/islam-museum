id: "event/al-qasim-enters-the-akil-quarter-of-saada-on-the-night-of-10-shawwal-326-ah"
class: event
kind: other
label:
  ar: "يدخل القاسم بن أحمد شق الأكيليين في صعدة ليلة الأربعاء لعشر من شوال سنة 326هـ، ص412"
  en: "Al-Qasim ibn Ahmad enters the Akil quarter of Saada on the night of Wednesday, 10 Shawwal 326 AH, p. 412"
  ur: "قاسم بن احمد 10 شوال 326ھ کی بدھ کی رات صعدہ میں اکیلیوں کے محلے میں داخل ہوتا ہے، ص412"
  es: "Al-Qasim ibn Ahmad entra en el barrio de Akil de Saada la noche del miércoles 10 de Shawwal del año 326 de la Hégira, pág. 412."
summary:
  ar: "يخرج الأكيليون من شقهم ليلا ولا يعلم بخروجهم إلا آخر الليل، فيدخل القاسم القرية، فيجد فيها من أموال الناس ما لا يوقف عليه، وتخرب منازلهم، وينتقل الأكيليون إلى علاف."
  en: "The Akil leave their quarter in the night, and their leaving is not known until the last part of the night. Al-Qasim enters the village and finds people's goods there in great quantity; their houses are wrecked, and the Akil go to Alaf."
  ur: "اکیلی رات کو اپنے محلے سے نکل جاتے ہیں اور ان کے نکلنے کا علم رات کے آخری حصے تک نہیں ہوتا۔ قاسم گاؤں میں داخل ہوتا ہے، وہاں لوگوں کا بے شمار مال پاتا ہے، ان کے گھر ویران کیے جاتے ہیں، اور اکیلی علاف چلے جاتے ہیں۔"
  es: "Los Akil abandonan su barrio durante la noche, y su partida no se descubre hasta bien entrada la noche. Al-Qasim entra en la aldea y encuentra allí gran cantidad de pertenencias; sus casas están destrozadas, y los Akil se dirigen a Alaf."
