label:
  ar: "يخرج القاسم بن أحمد من ريدة ليلا إلى وروَر في صفر سنة 325هـ، ص409"
  en: "Al-Qasim ibn Ahmad leaves Rayda by night for Warwar in Safar 325 AH, p. 409"
  ur: "قاسم بن احمد صفر 325ھ میں رات کو ریدہ سے وروَر کی طرف نکلتا ہے، ص409"
summary:
  ar: "يعلم القاسم بن أحمد بما يدبر له في ريدة، فيخرج منها ليلة السبت لثمانية أيام باقية من صفر سنة 325هـ إلى وروَر، وكان أخوه الحسن قد عامل ابن الضحاك عليه وأمده بالمال."
  en: "Al-Qasim ibn Ahmad learns of a plot against him in Rayda and leaves by night on Saturday, eight days before the end of Safar 325 AH, for Warwar. His brother al-Hasan had dealt with Ibn al-Dahhak against him and funded him."
  ur: "قاسم بن احمد کو ریدہ میں اپنے خلاف سازش کا علم ہوتا ہے، اور وہ صفر 325ھ کے آخر سے آٹھ دن پہلے ہفتے کی رات وروَر کی طرف نکل جاتا ہے۔ اس کا بھائی حسن ابن الضحاک کے ساتھ اس کے خلاف معاملہ کر چکا تھا اور اسے مال بھی دیتا رہا۔"
