label: { ar: "بعث موسى بن بغا إلى الديلم", en: "Musa ibn Bugha's Daylam Campaign", es: "Campaña Daylam de Musa ibn Bugha", fr: "Campagne Daylam de Musa ibn Bugha", ur: "موسیٰ ابن بگہ کی دیلام مہم", tr: "Musa ibn Bugha, Daylam'a gönderildi.", id: "Musa bin Bugha diutus ke Daylam" }
summary:
  ar: "في سنة ثلاث وخمسين ومائتين وجّه المعتز بالله موسى بن بغا الكبير مولاه إلى الطالبيين الذين ظهروا بالديلم وناحية طبرستان وكانت الديالمة قد اشتملت على رجل منهم يعرف بالكوكي فغزا الديلم وأوغل في بلادهم وحاربوه فأوقع بهم وثقلت وطأته عليهم واشتدت نكايته."
  en: "In 253 AH al-Mu'tazz sent his mawla Musa ibn Bugha al-Kabir against the Talibis risen in Daylam and the Tabaristan side, where the Daylamis had rallied to a man called al-Kawki; he raided Daylam deep into their land, fought them, struck them hard, and his burden and damage weighed heavy on them."
  es: "En el año 253 de la Hégira, al-Mu'tazz envió a su mawla Musa ibn Bugha al-Kabir contra los talibanes que se habían alzado en Daylam y en la región de Tabaristán, donde los daylamitas se habían reagrupado en torno a un hombre llamado al-Kawki; este asaltó Daylam profundamente en su territorio, luchó contra ellos, los golpeó duramente, y su carga y los daños que causó les pesaron mucho."
  fr: "En 253 AH, al-Mu'tazz envoya son mawla Musa ibn Bugha al-Kabir contre les Talibis soulevés à Daylam et du côté du Tabaristan, où les Daylamis s'étaient ralliés à un homme appelé al-Kawki; il pilla Daylam profondément dans leur pays, les combattit, les frappa durement, et son fardeau et ses dommages pesèrent lourdement sur eux."
  ur: "253 ہجری میں معتز نے اپنے مولا موسیٰ ابن بوغہ الکبیر کو دیلام اور طبرستان کی طرف اٹھنے والے طالبانیوں کے خلاف بھیجا جہاں دیلامیوں نے الکوکی نامی شخص کے پاس جمع کیا تھا۔ اس نے دیلام پر ان کی سرزمین کی گہرائی میں چھاپہ مارا، ان سے لڑا، انہیں سخت مارا، اور اس کا بوجھ اور نقصان ان پر بھاری پڑ گیا۔"
  tr: "253 yılında, Mu'tezz Billah, efendisi Musa bin Buga'yı, Daylam ve Tabaristan bölgesinde ortaya çıkan Talibiyye'ye gönderdi. Daylamlılar arasında El-Kuki adında bir adam vardı; bu yüzden El-Kuki Daylam'a saldırdı ve topraklarının derinliklerine kadar ilerledi. Onlarla savaştılar ve El-Kuki onlara ağır kayıplar verdirdi, saldırısı çok şiddetli oldu."
  id: "Pada tahun 253, Al-Mu’tazz Billah mengutus Musa bin Bugha Agung, tuannya, kepada Al-Talibiyyin yang muncul di Daylam dan wilayah Tabaristan. Di antara penduduk Daylam terdapat seorang pria bernama Al-Kuki, sehingga ia menyerang Daylam dan menembus jauh ke wilayah mereka. Mereka pun melawannya, sehingga ia menimbulkan kerugian besar bagi mereka dan serangannya sangat dahsyat."
