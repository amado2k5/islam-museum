label:
  ar: "وفاة الحافظ السمعاني بمرو، الاثنين غرة ربيع الأول ٥٦٢هـ/٢٦ ديسمبر ١١٦٦م"
  en: "Death of the hafiz al-Sam'ani at Marw, Monday 1 Rabi' I 562/26 December 1166"
  ur: "حافظ سمعانی کی مرو میں وفات، پیر غرۂ ربيع الاول 562ھ/26 دسمبر 1166ء"
summary:
  ar: "توفي السمعاني بمرو يوم الاثنين في غرة ربيع الأول سنة اثنتين وستين وخمسمائة، وله ست وخمسون سنة، وابنه أبو المظفر هو الذي ورّخه {cite:tarikh-islam-dhahabi p. 123} {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}؛ وأوردته وفيات ٥٦٣هـ في المنتظم {cite:tarikh-islam-dhahabi p. 118}."
  en: "Al-Sam'ani died at Marw on Monday 1 Rabi' I 562 (26 December 1166), aged fifty-six; it was his son Abu al-Muzaffar who recorded the date {cite:tarikh-islam-dhahabi p. 123} {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}. The Muntazam lists him among the deaths of 563 {cite:tarikh-islam-dhahabi p. 118}."
  ur: "سمعانی مرو میں پیر کے روز غرۂ ربيع الاول 562ھ ⁦(26 دسمبر 1166ء)⁩ کو چھپن سال کی عمر میں فوت ہوئے؛ تاریخ ان کے بیٹے ابوالمظفر نے لکھی {cite:tarikh-islam-dhahabi p. 123} {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}۔ منتظم نے انہیں 563ھ کی وفيات میں درج کیا ہے {cite:tarikh-islam-dhahabi p. 118}۔"
