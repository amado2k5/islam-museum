id: "event/asad-jarrah-ibn-bishr-and-ibn-kayyala-reunite-in-sanaa-in-294-ah"
class: event
kind: other
label:
  ar: "يجتمع أسعد بن أبي يعفر وجراح بن بشر وابن كيالة في صنعاء سنة 294هـ، ص393"
  en: "Asad ibn Abi Ya'fur, Jarrah ibn Bishr and Ibn Kayyala gather in Sanaa in 294 AH, p. 393"
  ur: "اسعد بن ابی یعفر، جراح بن بشر اور ابن کیالہ 294ھ میں صنعاء میں جمع ہوتے ہیں، ص393"
  fr: "Asad ibn Abi Ya'fur, Jarrah ibn Bishr et Ibn Kayyala se réunissent à Sanaa en 294 H, p. 393"
  es: "Asad ibn Abi Ya'fur, Jarrah ibn Bishr e Ibn Kayyala se reúnen en Saná en 294 AH, p. 393"
  tr: "Es'ad ibn Ebî Ya'fur, Cerrah ibn Bişr ve İbn Kayyala, H. 294 yılında Sana'a'da buluştu, s. 393"
  id: "As'ad bin Abi Ya'fur, Jarrah bin Bishr, dan Ibnu Kayyala bertemu di Sana'a pada tahun 294 H, hal. 393"
summary:
  ar: "يُخرج القرمطي الكوفي جراح بن بشر من شبام، فيكتب جراح وابن كيالة إلى أسعد بن أبي يعفر، فيقدم، ويقيمون جميعا في صنعاء ويُقرّون أحمد بن يوسف الحداقي على القضاء."
  en: "The Kufi Qarmatian drives Jarrah ibn Bishr out of Shiban. Jarrah and Ibn Kayyala write to Asad ibn Abi Ya'fur, who comes, and the three keep Ahmad ibn Yusuf al-Haddaqi as judge in Sanaa."
  ur: "کوفی قرمطی جراح بن بشر کو شبام سے نکال دیتا ہے۔ جراح اور ابن کیالہ اسعد بن ابی یعفر کو لکھتے ہیں، وہ آتے ہیں، اور تینوں صنعاء میں احمد بن یوسف الحداقی کو قاضی برقرار رکھتے ہیں۔"
  fr: "Le Qarmate kufi chasse Jarrah ibn Bishr de Shiban. Jarrah et Ibn Kayyala écrivent à Asad ibn Abi Ya'fur, qui vient, et tous trois maintiennent Ahmad ibn Yusuf al-Haddaqi comme cadi à Sanaa."
  es: "El Qarmatian de Kufi expulsa a Jarrah ibn Bishr de Shiban. Jarrah e Ibn Kayyala escriben a Asad ibn Abi Ya'fur, quien acude, y los tres mantienen a Ahmad ibn Yusuf al-Haddaqi como juez en Sanaa."
  tr: "Karmati el-Kufi, Cerrah ibn Bişr'i Şibam'dan kovar, bunun üzerine Cerrah ve İbn Kayala, As'ad ibn Abi Ya'far'a mektup yazarlar, o da gelir ve hepsi Sana'a'da kalıp Ahmed ibn Yusuf el-Hadaki'yi kadı olarak onaylarlar."
  id: "Qarmati al-Kufi mengusir Jarrah ibn Bishr dari Shibam, sehingga Jarrah dan Ibn Kayala menulis surat kepada As’ad ibn Abi Ya’far, lalu ia datang, dan mereka semua tinggal di Sana’a dan mengukuhkan Ahmad ibn Yusuf al-Hadaqi sebagai hakim."
