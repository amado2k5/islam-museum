id: event/al-hadi-warns-the-unjust-governors-in-verse-and-names-the-yemeni-regiments-292
class: event
kind: other
label:
  ar: "أبيات للهادي إلى ولاة الجور وذكره كتائب اليمن وفرسانها وسلاحها، ص304-305"
  en: "Verses of al-Hadi to the unjust governors, naming the regiments of Yemen, their horse and arms, pp. 304-305"
  ur: "ہادی کے ظالم حاکموں کے نام اشعار جن میں یمن کے دستوں، ان کے سواروں اور ہتھیاروں کا ذکر ہے، ص304-305"
  es: "Versos de al-Hadi a los gobernadores injustos, nombrando los regimientos de Yemen, sus caballos y armas, págs. 304-305."
summary:
  ar: "تحت عنوان «وقال فيما تضمن من الجهاد لأهل العراق وغيرهم من ولاة الجور» يخاطب الشاعر ولاة الجور بأنه إن سلم لهم قليلاً فسيرونه في كتائب من اليمن، عليهم الدروع السابغة، على خيل مسومة ومعهم سيوف ورماح، ويصف قتالاً يُستعر فيه الضرام ويثور النقع ولا يعرف فيه الأخ أخاه إلا بالشعار، وتسيل فيه الدماء."
  en: "Under the heading \"and he said, in what the jihad includes for the people of Iraq and other governors of tyranny\" the poet tells the unjust governors that if he is spared a little they will see him in regiments from Yemen wearing full coats of mail on marked horses with swords and lances; he describes a battle in which the fire is kindled, dust rises, a brother knows his brother only by the watchword and blood runs."
  ur: "«اور اس نے کہا اس کے بارے میں جو اہل عراق اور ظلم کے دوسرے حاکموں کے لیے جہاد میں شامل ہے» کے عنوان تلے شاعر ظالم حاکموں سے کہتا ہے کہ اگر اسے ذرا سی مہلت ملی تو وہ اسے یمن کے دستوں میں دیکھیں گے جنہوں نے لمبی زرہیں پہنی ہیں، نشان زدہ گھوڑوں پر، تلواریں اور نیزے لیے؛ وہ ایسی لڑائی کا حال بیان کرتا ہے جس میں آگ بھڑکتی ہے، گرد اٹھتی ہے، بھائی بھائی کو صرف نعرے سے پہچانتا ہے اور خون بہتا ہے۔"
  es: "Bajo el título \"y dijo, en lo que la yihad incluye para el pueblo de Irak y otros gobernantes de la tiranía\", el poeta les dice a los gobernadores injustos que si le perdonan un poco, lo verán en regimientos de Yemen vistiendo cotas de malla completas sobre caballos marcados con espadas y lanzas; describe una batalla en la que se enciende el fuego, se levanta el polvo, un hermano reconoce a su hermano solo por la palabra clave y corre la sangre."
