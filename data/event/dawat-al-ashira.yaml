id: event/dawat-al-ashira
class: event
kind: gathering
label: { en: "The call to the nearest kin", ar: "الدعوة في الأقربين", es: "La llamada a los parientes más cercanos", fr: "L'appel aux plus proches parents", ur: "قریبی رشتہ داروں کو پکارنا", tr: "akrabaları davet etmek", id: "Mengundang kerabat" }
summary:
  en: "After «وأنذر عشيرتك الأقربين» came down, the Prophet twice gathered Banu Hashim — about forty-five men with some of Banu al-Muttalib — declared himself God's messenger to them in particular and to people in general; Abu Lahab sabotaged the first gathering, and at the second Abu Talib pledged his protection while refusing to leave his fathers' religion."
  ar: "بعد نزول «وأنذر عشيرتك الأقربين» دعا النبي بني هاشم مرتين — نحو خمسة وأربعين رجلاً معهم نفر من بني المطلب — فأعلمهم أنه رسول الله إليهم خاصة وإلى الناس عامة؛ فخرب أبو لهب المجلس الأول، وفي الثاني تعهد أبو طالب بالحماية وأبى فراق دين عبد المطلب."
  es: "Después de que descendiera el «وأنذر عشيرتك الأقربين», el Profeta reunió dos veces a Banu Hashim —unos cuarenta y cinco hombres con algunos de Banu al-Muttalib— y se declaró mensajero de Dios para ellos en particular y para la gente en general; Abu Lahab saboteó la primera reunión, y en la segunda Abu Talib prometió su protección negándose a abandonar la religión de sus padres."
  fr: "Après la révélation de «وأنذر عشيرتك الأقربين», le Prophète a rassemblé à deux reprises les Banu Hashim — environ quarante-cinq hommes avec quelques Banu al-Muttalib — se déclarant messager de Dieu pour eux en particulier et pour les gens en général; Abu Lahab a saboté le premier rassemblement, et lors du second, Abu Talib a promis sa protection tout en refusant de quitter la religion de ses pères."
  ur: "«وأنذر عشيرتك الأقربين» اترنے کے بعد، رسول اللہ نے دو مرتبہ بنو ہاشم کو جمع کیا - جن کے ساتھ بنو المطلب کے کچھ افراد تھے - اپنے آپ کو ان کے لیے خاص طور پر اور عام لوگوں کے لیے خدا کا رسول قرار دیا۔ ابو لہب نے پہلی مجلس میں توڑ پھوڑ کی اور دوسرے اجتماع میں ابو طالب نے اپنے باپ دادا کا مذہب چھوڑنے سے انکار کرتے ہوئے اپنی حفاظت کا عہد کیا۔"
  tr: "“Ve en yakın akrabalarınızı uyarın” vahyinden sonra Peygamber, Beni Haşim kabilesini iki kez çağırdı – aralarında Beni el-Muttalib kabilesinden bazı kişiler de bulunan yaklaşık kırk beş kişi – ve onlara, özellikle onlara ve genel olarak insanlara Allah'ın elçisi olduğunu bildirdi. Ebu Lahab ilk toplantıyı bozdu ve ikincisinde Ebu Talib koruma sözü verdi ve Abd el-Muttalib'in dininden ayrılmayı reddetti."
  id: "Setelah turunnya wahyu “Dan peringatkanlah kerabat terdekatmu,” Nabi memanggil Bani Hasyim dua kali — sekitar empat puluh lima orang laki-laki bersama sebagian dari Bani al-Muttalib — dan memberitahu mereka bahwa beliau adalah Rasulullah khususnya bagi mereka dan bagi seluruh umat manusia. Abu Lahab mengganggu pertemuan pertama, dan pada pertemuan kedua, Abu Talib berjanji untuk melindungi dan menolak untuk meninggalkan agama Abd al-Muttalib."
