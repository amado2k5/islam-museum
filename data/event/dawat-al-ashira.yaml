id: event/dawat-al-ashira
class: event
kind: gathering
label: { en: "The call to the nearest kin", ar: "الدعوة في الأقربين", es: "La llamada a los parientes más cercanos", fr: "L'appel aux plus proches parents" }
summary:
  en: "After «وأنذر عشيرتك الأقربين» came down, the Prophet twice gathered Banu Hashim — about forty-five men with some of Banu al-Muttalib — declared himself God's messenger to them in particular and to people in general; Abu Lahab sabotaged the first gathering, and at the second Abu Talib pledged his protection while refusing to leave his fathers' religion."
  ar: "بعد نزول «وأنذر عشيرتك الأقربين» دعا النبي بني هاشم مرتين — نحو خمسة وأربعين رجلاً معهم نفر من بني المطلب — فأعلمهم أنه رسول الله إليهم خاصة وإلى الناس عامة؛ فخرب أبو لهب المجلس الأول، وفي الثاني تعهد أبو طالب بالحماية وأبى فراق دين عبد المطلب."
  es: "Después de que descendiera el «وأنذر عشيرتك الأقربين», el Profeta reunió dos veces a Banu Hashim —unos cuarenta y cinco hombres con algunos de Banu al-Muttalib— y se declaró mensajero de Dios para ellos en particular y para la gente en general; Abu Lahab saboteó la primera reunión, y en la segunda Abu Talib prometió su protección negándose a abandonar la religión de sus padres."
  fr: "Après la révélation de «وأنذر عشيرتك الأقربين», le Prophète a rassemblé à deux reprises les Banu Hashim — environ quarante-cinq hommes avec quelques Banu al-Muttalib — se déclarant messager de Dieu pour eux en particulier et pour les gens en général; Abu Lahab a saboté le premier rassemblement, et lors du second, Abu Talib a promis sa protection tout en refusant de quitter la religion de ses pères."
