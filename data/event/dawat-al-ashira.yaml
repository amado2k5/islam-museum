label: { en: "The call to the nearest kin", ar: "الدعوة في الأقربين" }
summary:
  en: "After «وأنذر عشيرتك الأقربين» came down, the Prophet twice gathered Banu Hashim — about forty-five men with some of Banu al-Muttalib — declared himself God's messenger to them in particular and to people in general; Abu Lahab sabotaged the first gathering, and at the second Abu Talib pledged his protection while refusing to leave his fathers' religion."
  ar: "بعد نزول «وأنذر عشيرتك الأقربين» دعا النبي بني هاشم مرتين — نحو خمسة وأربعين رجلاً معهم نفر من بني المطلب — فأعلمهم أنه رسول الله إليهم خاصة وإلى الناس عامة؛ فخرب أبو لهب المجلس الأول، وفي الثاني تعهد أبو طالب بالحماية وأبى فراق دين عبد المطلب."
