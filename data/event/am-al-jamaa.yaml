label: { ar: "عام الجماعة" }
summary:
  ar: "نزل الحسن لمعاوية عن الخلافة فاستقر فيها من ربيع الآخر أو جمادى الأولى سنة إحدى وأربعين، فسمي هذا العام عام الجماعة لاجتماع الأمة فيه على خليفة واحد، وولي معاوية فيه مروان بن الحكم المدينة {cite:tarikh-khulafa-minhaj-1434 p. 325}. ويذكر الكتاب أن مبايعة الحسن لمعاوية كانت سنة إحدى وأربعين، وهي السنة التي سميت عام الجماعة {cite:bakr-umayyad-state-1134715 p. 116}."
  en: "When al-Hasan ceded the caliphate to Mu'awiya — settled in Rabi' II or Jumada I of year 41 — this year was named the Year of the Community (am al-jama'a), for the community was united upon a single caliph; in it Mu'awiya appointed Marwan ibn al-Hakam over Medina {cite:tarikh-khulafa-minhaj-1434 p. 325}."
