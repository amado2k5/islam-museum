label: { ar: "عام الجماعة", en: "The Year of the Community (am al-jama'a)", es: "El Año de la Comunidad (am al-jama'a)", fr: "L'Année de la Communauté (am al-jama'a)", ur: "جماعت کا سال ⁦(ام الجامعہ)⁩" }
summary:
  ar: "نزل الحسن لمعاوية عن الخلافة فاستقر فيها من ربيع الآخر أو جمادى الأولى سنة إحدى وأربعين، فسمي هذا العام عام الجماعة لاجتماع الأمة فيه على خليفة واحد، وولي معاوية فيه مروان بن الحكم المدينة {cite:tarikh-khulafa-minhaj-1434 p. 325}."
  en: "When al-Hasan ceded the caliphate to Mu'awiya — settled in Rabi' II or Jumada I of year 41 — this year was named the Year of the Community (am al-jama'a), for the community was united upon a single caliph; in it Mu'awiya appointed Marwan ibn al-Hakam over Medina {cite:tarikh-khulafa-minhaj-1434 p. 325}."
  es: "Cuando al-Hasan cedió el califato a Mu'awiya —establecido en Rabi' II o Jumada I del año 41— este año fue llamado el Año de la Comunidad (am al-jama'a), porque la comunidad se unió en torno a un solo califa; en él, Mu'awiya nombró a Marwan ibn al-Hakam sobre Medina {cite:tarikh-khulafa-minhaj-1434 p. 325}."
  fr: "Lorsque al-Hasan céda le califat à Mu'awiya — établi en Rabi' II ou Jumada I de l'an 41 — cette année fut nommée l'Année de la Communauté (am al-jama'a), car la communauté était unie autour d'un seul calife; en cette année, Mu'awiya nomma Marwan ibn al-Hakam à la tête de Médine {cite:tarikh-khulafa-minhaj-1434 p. 325}."
  ur: "جب الحسن نے معاویہ کو خلافت سونپ دی — ربیع دوم یا سنہ 41 کے جمادی الاول میں آباد ہوئے — اس سال کو برادری کا سال ⁦(ام الجماع)⁩ کا نام دیا گیا، کیونکہ برادری ایک خلیفہ پر متحد تھی۔ اس میں معاویہ نے مروان بن الحکم کو مدینہ پر مقرر کیا۔ 325}۔"
