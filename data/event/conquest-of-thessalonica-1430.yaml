id: event/conquest-of-thessalonica-1430
class: event
kind: siege
label: { ar: "فتح سالونيك", en: "Conquest of Thessalonica", es: "Conquista de Tesalónica", fr: "Conquête de Thessalonique", ur: "تھیسالونیکا کی فتح", tr: "Selanik'in Açılışı", id: "Pembukaan Thessaloniki" }
summary:
  ar: "يذكر الصلابي أن السلطان مراد الثاني أسرع باحتلال سالونيك بعد قضائه على التمردات التي وقف الإمبراطور البيزنطي مانويل الثاني وراءها، فهاجمها ودخلها عنوة في مارس سنة ٨٣٣هـ/١٤٣١م وأصبحت جزءاً لا يتجزأ من الدولة العثمانية {cite:dawlat-uthmaniyya-salabi p. 79}."
  en: "Thessalonica — after crushing the pretenders Manuel II had backed, Murad II moved on the city and stormed it in March 833/1431, making it permanently Ottoman in al-Sallabi's account {cite:dawlat-uthmaniyya-salabi p. 79}."
  es: "Salónica — después de aplastar a los pretendientes que Manuel II había apoyado, Murad II avanzó hacia la ciudad y la asaltó en marzo de 833/1431, convirtiéndola permanentemente en otomana según el relato de al-Sallabi {cite:dawlat-uthmaniyya-salabi p. 79}."
  fr: "Thessalonique — après avoir écrasé les prétendants que Manuel II avait soutenus, Murad II marcha sur la ville et la prit d'assaut en mars 833/1431, la rendant définitivement ottomane selon le récit d'al-Sallabi {cite:dawlat-uthmaniyya-salabi p. 79}."
  ur: "تھیسالونیکا — مینوئل دوم کی پشت پناہی کرنے والے دکھاوا کرنے والوں کو کچلنے کے بعد، مراد دوم نے شہر پر چڑھائی کی اور مارچ 833/1431 میں اس پر دھاوا بول دیا، اسے السلبی کے اکاؤنٹ میں مستقل طور پر عثمانی بنا دیا {حوالہ: دولت-عثمانیہ-سلبی ص۔ 79}۔"
  tr: "El-Salabi, Sultan Murad II'nin, Bizans İmparatoru Manuel II'nin desteklediği isyanları bastırdıktan sonra Selanik'i işgal etmek için acele ettiğini belirtir. 833 Hicri/1431 Miladi yılının Mart ayında şehre saldırdı ve zorla ele geçirdi; böylece şehir Osmanlı devletinin ayrılmaz bir parçası oldu. {cite:dawlat-uthmaniyya-salabi s. 79}"
  id: "Al-Salabi menyebutkan bahwa Sultan Murad II bergegas menduduki Salonika setelah ia menumpas pemberontakan yang didukung oleh Kaisar Bizantium Manuel II. Ia menyerang dan memasuki kota itu dengan paksa pada bulan Maret 833 H/1431 M dan kota itu menjadi bagian integral dari negara Ottoman {cite:dawlat-uthmaniyya-salabi hlm. 79}."
