summary:
  ar: "في سنة إحدى وخمسين ومائتين ذكر الطبري أمر محمد بن عبد الله المظفر بن سيسل بالعسكر بالياسرية، ثم انتقاله إلى الكناسة إلى أن وافاه بالفردل بن إيزنكجيك الأشروسني {cite:tabari-tarikh-abu-al-fadl j.9 p.332}"
  en: "In the year 251 al-Tabari records the command of Muhammad ibn Abd Allah al-Muzaffar ibn Sisal concerning the army at al-Yasiriyya, then his move to al-Kunasa until he came upon him at al-Fardal ibn Izankjik al-Ushrusani {cite:tabari-tarikh-abu-al-fadl j.9 p.332}"
  fr: "Dans l'année 251, al-Tabari consigne l'ordre de Muhammad ibn Abd Allah al-Muzaffar ibn Sisal concernant l'armée à al-Yasiriyya, puis son déplacement vers al-Kunasa jusqu'à ce qu'il rencontre al-Fardal ibn Izankjik al-Ushrusani {cite:tabari-tarikh-abu-al-fadl j.9 p.332}"
  es: "En el año 251, al-Tabari registra la orden de Muhammad ibn Abd Allah al-Muzaffar ibn Sisal sobre el ejército en al-Yasiriyya, luego su traslado a al-Kunasa hasta que lo encontró en al-Fardal ibn Izankjik al-Ushrusani {cite:tabari-tarikh-abu-al-fadl j.9 p.332}"
  ur: "الطبری نے 251 میں محمد بن عبد اللہ المظفر بن سیسل کے لشکر کے بارے میں یسریٰ میں فوج کے بارے میں حکم درج کیا ہے، پھر ان کا کناسہ منتقل ہونا یہاں تک کہ وہ اس پر الفاردال بن ازانکجک العشروسیانی پر آیا۔"
  tr: "Taberi, 251 yılında Muhammed ibn Abdullah el-Muzaffar ibn Sisil'in orduyu Yasiriye'ye gönderdiğini, daha sonra Kunase'ye geçerek orada el-Fardal ibn İzancik el-Aşrusani ile görüştüğünü belirtmiştir. {cite:tabari-tarikh-abu-al-fadl j.9 p.332}"
  id: "Pada tahun 251, al-Tabari menyebutkan bahwa Muhammad ibn Abdullah al-Muzaffar ibn Sisil memerintahkan pasukan ke al-Yasiriyah, kemudian ia pindah ke al-Kunasah hingga bertemu dengan al-Fardal ibn Izankjik al-Ashrusani {cite:tabari-tarikh-abu-al-fadl j.9 p.332}"
