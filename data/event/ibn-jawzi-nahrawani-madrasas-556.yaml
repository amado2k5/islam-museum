label:
  ar: "ابن الجوزي يخلف أبا حكيم النهرواني في مدرستيه"
  en: "Ibn al-Jawzi succeeds Abu Hakim al-Nahrawani in his two madrasas"
  ur: "ابن الجوزی ابو حکیم نہروانی کی دونوں مدارس کے مدرس بنے"
summary:
  ar: "بدأ ابن الجوزي التدريس معاوناً لشيخه أبي حكيم النهرواني في مدرسته بباب الأزاد، وفي سنة وفاته في مدرسة أُنشئت له في المأمونية؛ فلما توفي النهرواني سنة ٥٥٦هـ/١١٦١م خلفه ابن الجوزي مدرّساً في المدرستين {cite:encyclopaedia-of-islam-2 vol. 3 p. 783}."
  en: "Ibn al-Jawzi began teaching as assistant to his shaykh Abu Hakim al-Nahrawani in the latter's madrasa at Bab al-Azad and, in the year of the shaykh's death, in a madrasa built for him at the Ma'muniyya; on al-Nahrawani's death in 556/1161 Ibn al-Jawzi succeeded him as master of both colleges {cite:encyclopaedia-of-islam-2 vol. 3 p. 783}."
  ur: "ابن الجوزی نے اپنے شیخ ابو حکیم نہروانی کے معاون کے طور پر باب الازاد کی مدرسہ میں تدریس شروع کی اور شیخ کی وفات کے سال مامونیہ میں ان کے لیے بنائے گئے مدرسہ میں؛ 556ھ/1161ء میں نہروانی کی وفات پر ابن الجوزی دونوں مدارس کے مدرس ہوئے {cite:encyclopaedia-of-islam-2 vol. 3 p. 783}۔"
