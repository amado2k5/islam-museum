label:
  ar: "عودته من طرابلس إلى القاهرة ونظر ديوان الدقهلية والمرتاحية، ٧١٢هـ/١٣١٢م"
  en: "Return from Tripoli to Cairo and the Delta inspectorate, 712/1312"
  ur: "طرابلس سے قاہرہ واپسی اور دقہلیہ و مرتاحیہ کا نظارہ، 712ھ/1312ء"
summary:
  ar: "غادر النويري طرابلس في جمادى الأولى ٧١٢هـ/سبتمبر ١٣١٢م ودخل القاهرة في ٢٠ رجب/٢٠ نوفمبر من السنة نفسها بعد وقفة قصيرة بدمشق في طريق العودة، وظروف مفارقته طرابلس مبهمة؛ وعند مؤرخيه أنه لدى عودته وُلّي نظر ديوان إقليمين من أقاليم دلتا النيل: الدقهلية والمرتاحية، فيُظن أنه حتى ٧١٦هـ كان يدير إيراداتهما مقيماً بالقاهرة حتى آخر عمره غالباً {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}."
  en: "Al-Nuwayri left Tripoli in Jumada I 712 (September 1312) and entered Cairo on 20 Rajab/20 November of the same year after a brief stay at Damascus on the way; the circumstances of his leaving Tripoli are obscure. According to his biographers, on his return he was appointed nazir al-diwan of two Nile Delta provinces, al-Dakhaliyya and al-Murtahiyya — so that until about 716/1316 he administered their revenues while residing at Cairo, probably for the rest of his life {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}."
  ur: "نويری جمادی الاولیٰ 712ھ ⁦(ستمبر 1312ء)⁩ میں طرابلس سے روانہ ہوئے اور اسی سال 20 رجب/20 نومبر کو قاہرہ داخل ہوئے، راستے میں دمشق میں مختصر قیام کے بعد؛ طرابلس سے روانگی کے حالات مبہم ہیں۔ مؤرخین کے مطابق واپسی پر انھیں دریائے نیل کے ڈیلٹا کے دو صوبوں — دقہلیہ اور مرتاحیہ — کا ناظر دیوان مقرر کیا گیا؛ گمان ہے کہ 716ھ/1316ء تک وہ ان کی آمدن کی انتظامیہ کرتے قاہرہ میں مقیم رہے، غالباً عمر بھر کے لیے {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}۔"
