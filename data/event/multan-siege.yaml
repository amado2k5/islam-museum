id: event/multan-siege
class: event
kind: siege
label: { ar: "فتح الملتان وبيت الذهب", en: "The Siege of Multan and the House of Gold", es: "El asedio de Multán y la Casa de Oro", fr: "Le siège de Multan et la Maison d'or", ur: "ملتان کا محاصرہ اور سونے کے گھر", tr: "Multan'ın Fethi ve Altın Evi", id: "Penaklukan Multan dan Rumah Emas" }
summary:
  ar: "قطع محمد بياس إلى الملتان فقاتله أهلها فأبلى زائدة بن عمير الطائي وانهزم المشركون فدخلوا المدينة وحصرهم محمد ونفدت أزواد المسلمين فأكلوا الحمر ثم أتاهم رجل مستأمن فدلهم على مدخل الماء الذي منه شربهم وهو ماء يجري من نهر بسمد فيصير في مجتمع له مثل البركة في المدينة وهم يسمونه البلاح فنوره فلما عطشوا نزلوا على الحكم فقتل محمد المقاتلة وسبى الذرية وسبى سدنة البد وهم ستة آلاف وأصابوا ذهباً كثيراً فجمعت تلك الأموال في بيت يكون عشرة أذرع في ثمان أذرع يلقى ما أودعه في كوة مفتوحة في سطحه فسميت الملتان فرج بيت الذهب والفرج الثغر وكان بد الملتان بدّاً تهدى إليه الأموال وينذر له النذور ويحج إليه السند فيطوفون به ويحلقون رؤوسهم ولحاهم عنده ويزعمون أن صنماً فيه هو أيوب النبي."
  en: "Across the Bayas, Multan's folk fought — Za'ida ibn Umayr al-Ta'i excelled — then shut themselves in. The Muslims ate their donkeys till a protected man showed the water-intake — the spring al-Balah fed from Basmad's river — and cut it, they yielded on terms: the fighters slain, six thousand temple sadins and offspring enslaved, and gold heaped in a ten-by-eight cubit house filled through a roof hole — whence 'Multan, Faraj Bayt al-Dhahab', the frontier of the House of Gold. Its budd drew offerings and vows; Sind's pilgrims shaved heads and beards there and claimed its idol was the prophet Ayyub."
  ur: "دریاۓ بیاس کے پار ملتان کے لوگوں نے مقابلہ کیا — زائدہ بن عمیر طائی نے بہادری دکھائی — پھر شہر میں محصور ہو گئے۔ مسلمانوں کی خوراک ختم ہوئی تو گدھے کھائے، یہاں تک کہ ایک امانتی شخص نے پانی کے سرچشمے — بہادر کے دریا سے آنے والی چشمہ بلاح — کا راستہ بتا دیا، اسے کاٹا گیا تو اہلِ شہر شرائط پر اتر آئے: لڑنے والے قتل، مندر کے چھ ہزار سدنے اور اولادیں اسیر، اور سونا دس بہ آٹھ ذراع کے گھر میں چھت کے سوراخ سے ڈالا گیا — اسی سے «ملتان، فرج بیت الذهب»، یعنی بیتِ الذهب کا سرحدی دروازہ۔ اس کے بد کو نظریں اور نذریں ملتیں؛ سندھ کے حاجی وہیں سر اور داڑھیاں مڑواتے اور اس کے بت کو نبی ایوب کہتے تھے {cite:futuh-buldan-maarif-1407}."
  es: "Al otro lado del Bayas, la gente de Multan luchó —Za'ida ibn Umayr al-Ta'i sobresalió— y luego se encerró. Los musulmanes se comieron a sus burros hasta que un hombre protegido les mostró la toma de agua —el manantial que alimentaba al-Balah del río Basmad— y la cortó; entonces cedieron bajo ciertas condiciones: los combatientes muertos, seis mil sadinés del templo y sus descendientes esclavizados, y oro amontonado en una casa de diez por ocho codos llena a través de un agujero en el techo —de donde proviene «Multan, Faraj Bayt al-Dhahab», la frontera de la Casa de Oro. Su brote atraía ofrendas y votos; los peregrinos de Sind se afeitaban la cabeza y la barba allí y afirmaban que su ídolo era el profeta Ayyub."
  fr: "De l'autre côté du Bayas, les habitants de Multan se battirent – Za'ida ibn Umayr al-Ta'i s'y distingua – puis se retranchèrent. Les musulmans mangèrent leurs ânes jusqu'à ce qu'un homme protégé leur montre la source d'eau – la source al-Balah alimentée par la rivière de Basmad – et la coupe. Ils se rendirent alors à certaines conditions: les combattants furent tués, six mille sadhins du temple et leurs enfants réduits en esclavage, et l'or entassé dans une maison de dix coudées sur huit, remplie par une ouverture dans le toit – d'où « Multan, Faraj Bayt al-Dhahab », la frontière de la Maison d'Or. Son bourgeon attirait les offrandes et les vœux; les pèlerins du Sind s'y rasaient la tête et la barbe et prétendaient que son idole était le prophète Ayyub."
  tr: "Muhammed, Bayas'ın Multan'a giden yolunu kesti ve halkı ona karşı savaştı. Zeyde bin Umir el-Ta'i cesurca savaştı ve müşrikler yenilgiye uğradı. Şehre girdiler ve Muhammed onları kuşattı. Müslümanların erzakları tükendi, bu yüzden eşek yediler. Sonra onlara güvenli geçiş izni verilmiş bir adam geldi ve onlara içtikleri suyun girişini gösterdi. Bu su, Besmed'deki bir nehirden akıp şehirde bir havuzda birikiyordu ve ona El-Ballah adını verdiler. Adam suyu aydınlattı ve susadıklarında yargıca teslim oldular. Muhammed savaşçıları öldürdü ve altı bin kişi olan çocukları ve putun koruyucularını esir aldı. Çok miktarda altın buldular ve bu para on arşın sekiz arşınlık bir evde toplandı. Toplanan para, çatısındaki açık bir nişe atıldı. Multan, Altın Evi'nin girişi olarak adlandırıldı ve giriş sınır oldu. Multan putu, para verilen, adaklar adanan ve Sind halkının hac ziyaretleri yaptığı bir yerdi. Etrafında tavaf ederler, saçlarını ve sakallarını tıraş ederlerdi ve içindeki putun Peygamber Eyüp olduğunu iddia ederlerdi."
  id: "Muhammad memutus jalur Bayas ke Multan, dan penduduknya memeranginya. Zaidah bin Umair Al-Ta’i berperang dengan gagah berani, dan kaum musyrik dikalahkan. Mereka memasuki kota, dan Muhammad mengepung mereka. Persediaan kaum Muslim habis, sehingga mereka memakan keledai. Kemudian seorang pria yang telah diberi jalan aman datang kepada mereka dan menunjukkan kepada mereka pintu masuk ke sumber air yang mereka minum. Itu adalah air yang mengalir dari sungai di Basmad dan menjadi sebuah kolam di kota, dan mereka menyebutnya Al-Ballah. Dia meneranginya, dan ketika mereka haus, mereka menyerah kepada hakim. Muhammad membunuh para pejuang dan menawan anak-anak dan para penjaga berhala, yang berjumlah enam ribu orang. Mereka menemukan banyak emas, dan uang itu dikumpulkan di sebuah rumah yang berukuran sepuluh hasta kali delapan hasta. Apa yang disimpan dilemparkan ke dalam ceruk terbuka di atapnya. Multan disebut sebagai pintu masuk Rumah Emas, dan pintu masuk itu adalah perbatasan. Berhala Multan adalah tempat di mana uang diberikan, nazar diucapkan kepadanya, dan orang-orang Sindh berziarah ke sana. Mereka akan mengelilinginya dan mencukur kepala dan janggut mereka di sana, dan mereka mengklaim bahwa berhala di dalamnya adalah Nabi Ayub."
