label: { en: "The Prophet's sermon at the Kaaba and general amnesty", ar: "خطبة النبي عند باب الكعبة والأمان العام" }
summary:
  en: "Standing at the threshold of the Kaaba, the Prophet addressed the assembled people of Mecca, abolishing pre-Islamic blood feuds, reciting Qur'an 49:13 on human equality, returning the hereditary custodianship of the key to Uthman ibn Talha, and declaring a comprehensive general amnesty with the renowned words: 'Go, for you are the free ones' (al-Tulaqa')."
  ar: "وقف النبي على باب الكعبة خطيبًا في أهل مكة، فأسقط مآثر الجاهلية ودماءها، وتلا 49:13 في المساواة، وأعاد مفتاح السدانة لعثمان بن طلحة، وأعلن العفو العام الشامل بكلمته الخالدة: «اذهبوا فأنتم الطلقاء»."
