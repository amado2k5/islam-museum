label: { en: "The Prophet's sermon at the Kaaba and general amnesty", ar: "خطبة النبي عند باب الكعبة والأمان العام", es: "El sermón del Profeta en la Kaaba y la amnistía general", fr: "Le sermon du Prophète à la Kaaba et l'amnistie générale", ur: "کعبہ میں رسول اللہ کا خطبہ اور عام معافی", tr: "Peygamberin Kâbe kapısındaki hutbesi ve genel güvenlik", id: "Khutbah Nabi di pintu Ka'bah dan keselamatan secara umum" }
summary:
  en: "Standing at the threshold of the Kaaba, the Prophet addressed the assembled people of Mecca, abolishing pre-Islamic blood feuds, reciting Qur'an 49:13 on human equality, returning the hereditary custodianship of the key to Uthman ibn Talha, and declaring a comprehensive general amnesty with the renowned words: 'Go, for you are the free ones' (al-Tulaqa')."
  ar: "وقف النبي على باب الكعبة خطيبًا في أهل مكة، فأسقط مآثر الجاهلية ودماءها، وتلا 49:13 في المساواة، وأعاد مفتاح السدانة لعثمان بن طلحة، وأعلن العفو العام الشامل بكلمته الخالدة: «اذهبوا فأنتم الطلقاء»."
  es: "De pie en el umbral de la Kaaba, el Profeta se dirigió a la gente reunida en La Meca, aboliendo las venganzas de sangre preislámicas, recitando el Corán 49:13 sobre la igualdad humana, devolviendo la custodia hereditaria de la llave a Uthman ibn Talha y declarando una amnistía general integral con las famosas palabras: 'Id, pues sois libres' (al-Tulaqa')."
  fr: "Debout au seuil de la Kaaba, le Prophète s'adressa aux habitants de La Mecque rassemblés, abolissant les querelles sanglantes préislamiques, récitant le Coran 49:13 sur l'égalité humaine, rendant la garde héréditaire de la clé à Uthman ibn Talha et déclarant une amnistie générale complète avec les paroles célèbres: « Allez, car vous êtes les libres » (al-Tulaqa')."
  ur: "کعبہ کی چوکھٹ پر کھڑے ہو کر، نبی نے مکہ کے جمع لوگوں سے خطاب کیا، قبل از اسلام کے خونی جھگڑوں کو ختم کیا، انسانی مساوات پر قرآن 49:13 کی تلاوت کی، عثمان بن طلحہ کی کلید کی موروثی تحویل واپس کر دی، اور ایک جامع اعلان کیا کہ آپ جنرل کے لیے آزاد ہیں۔ ones' ⁦(التلاقہ)⁩۔"
  tr: "Peygamberimiz Kâbe'nin kapısında durarak Mekke halkına seslendi ve İslam öncesi dönemin geleneklerini ve kan dökülmesini ortadan kaldırdı. Eşitlik üzerine 49:13 ayetini okudu, Kâbe'nin anahtarını Osman ibn Talha'ya iade etti ve ölümsüz sözleriyle genel bir af ilan etti: \"Gidin, özgürsünüz.\""
  id: "Nabi Muhammad SAW berdiri di depan pintu Ka'bah, berpidato di hadapan penduduk Mekah, dan beliau menghapuskan kebiasaan dan pertumpahan darah di era pra-Islam. Beliau membacakan ayat 49:13 tentang kesetaraan, mengembalikan kunci penjaga kepada Utsman bin Talha, dan menyatakan amnesti umum dengan kata-kata abadi beliau: “Pergilah, karena kalian bebas.”"
