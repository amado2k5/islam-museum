  ar: "مناظرات متلفزة ومفرغة للعالم الكويتي السني [[person/uthman-al-khamis|عثمان الخميس]] في العقدين الأولين من الألفية، في الإمامة والصحابة وتصحيح الحديث، اشتهر بها في العالم السني وطبع تفريغ عدد منها كراسات شائعة، ومنها ما قوبل بردود شيعية مناظِرة فصار ملفاً متبادلاً {cite:youtube-sunni-jewish-debate}."
  en: "Televised and transcribed debates by the Kuwaiti Sunni scholar [[person/uthman-al-khamis|Uthman al-Khamis]] across the first two decades of the millennium, on the Imamate, the Companions and hadith authentication. He became widely known in the Sunni world through them; transcripts of several were printed as popular booklets, and some were met by Shia counter-debates, becoming an exchanged dossier {cite:youtube-sunni-jewish-debate}."
  es: "Debates televisados y transcritos del erudito suní kuwaití Uthman al-Khamis durante las dos primeras décadas del milenio, sobre el Imamato, los Compañeros y la autenticación de los hadices. Se hizo ampliamente conocido en el mundo suní gracias a ellos; las transcripciones de varios se imprimieron como folletos populares, y algunos dieron lugar a contradebates chiíes, convirtiéndose en un dossier de intercambio {cite:youtube-sunni-jewish-debate}."
