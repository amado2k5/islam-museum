id: event/jahiz-zayyat-fall-233
class: event
kind: other
label:
  ar: "سقوط ابن الزيات وكارثة تكاد تنزل بالجاحظ"
  en: "Fall of Ibn al-Zayyat nearly proves fatal to al-Jahiz"
  ur: "ابن زیات کی گراوٹ جاحظ پر قریب الوقوع آفت بن گئی"
  es: "La caída de Ibn al-Zayyat casi resulta fatal para al-Jahiz."
  fr: "La chute d'Ibn al-Zayyat manque de peu d'être fatale à al-Jahiz."
  tr: "İbn el-Zeyyat'ın düşüşü ve el-Cahiz'in başına neredeyse gelen bir felaket."
  id: "Kejatuhan Ibn al-Zayyat dan bencana yang hampir menimpa al-Jahiz"
summary:
  ar: "اتصل الجاحظ في بغداد بالوزير محمد بن عبد الملك الزيات، فلما سقط ابن الزيات سنة ٢٣٣هـ/٨٤٧م كاد سقوطه يهوي بالرجلين جميعاً، ثم لزم الجاحظ بعد ذلك قاضي القضاة أحمد بن أبي دؤاد ⁦(ت ٢٤٠هـ/٨٥٤م)⁩ وابنه محمد ⁦(ت ٢٣٩هـ/٨٥٣م)⁩، ثم الفتح بن خاقان ⁦(ت ٢٤٧هـ/٨٦١م)⁩ {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  en: "In Baghdad al-Jahiz attached himself to the vizier Muhammad ibn Abd al-Malik al-Zayyat; when al-Zayyat fell from favour in 233/847 the fall almost proved fatal to both men. Al-Jahiz then attached himself successively to the chief qadi Ahmad ibn Abi Du'ad (d. 240/854) and his son Muhammad (d. 239/853), and finally to al-Fath ibn Khakan (d. 247/861) {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  ur: "بغداد میں جاحظ وزیر محمد بن عبدالملک زیات سے جُڑے؛ جب 233ھ/847ء میں ابن زیات کی گراوٹ ہوئی تو یہ دونوں کے لیے قریباً مہلک ثابت ہونے والی تھی۔ اس کے بعد جاحظ بالترتیب قاضی القضاة احمد بن ابی دؤاد ⁦(متوفی 240ھ/854ء)⁩ اور ان کے بیٹے محمد ⁦(متوفی 239ھ/853ء)⁩، اور آخر میں فتح بن خاقان ⁦(متوفی 247ھ/861ء)⁩ سے وابستہ ہوئے {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  es: "En Bagdad, al-Jahiz se unió al visir Muhammad ibn Abd al-Malik al-Zayyat; cuando al-Zayyat cayó en desgracia en 233/847, la caída casi resultó fatal para ambos. Al-Jahiz se unió entonces sucesivamente al cadí principal Ahmad ibn Abi Du'ad (m. 240/854) y a su hijo Muhammad (m. 239/853), y finalmente a al-Fath ibn Khakan (m. 247/861) {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  fr: "À Bagdad, al-Jahiz se rallia au vizir Muhammad ibn Abd al-Malik al-Zayyat; lorsque ce dernier tomba en disgrâce en 233/847, la chute faillit leur être fatale à tous deux. Al-Jahiz se rallia ensuite successivement au cadi en chef Ahmad ibn Abi Du'ad (mort en 240/854) et à son fils Muhammad (mort en 239/853), puis finalement à al-Fath ibn Khakan (mort en 247/861) {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  tr: "El-Cehiz, Bağdat'ta vezir Muhammed ibn Abdülmalik el-Zeyyet ile temasa geçti. İbn el-Zeyyet'in 233 Hicri/847 Miladi yılında vefat etmesi, neredeyse her iki adamın da vefatına yol açacaktı. Daha sonra El-Cehiz, Başkadı Ahmed ibn Abi Duad (ö. 240 Hicri/854 Miladi) ve oğlu Muhammed'e (ö. 239 Hicri/853 Miladi), ardından da el-Feth ibn Hakan'a (ö. 247 Hicri/861 Miladi) bağlandı. {cite:encyclopaedia-of-islam-2 cilt 2 s. 385}"
  id: "Al-Jahiz menghubungi menteri Muhammad ibn Abd al-Malik al-Zayyat di Baghdad. Ketika Ibn al-Zayyat jatuh pada tahun 233 H/847 M, kejatuhannya hampir menyebabkan kedua orang itu jatuh. Kemudian al-Jahiz menjalin hubungan dengan Ketua Mahkamah Agung Ahmad ibn Abi Du’ad (wafat 240 H/854 M) dan putranya Muhammad (wafat 239 H/853 M), kemudian al-Fath ibn Khaqan (wafat 247 H/861 M) {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
