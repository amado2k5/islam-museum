label: { ar: "فتنة مسجد براثا ٤٢٠", en: "The Baratha Mosque Affair in 420" }
summary:
  ar: "قبضت دار الخلافة على خطيب مسجد براثا لما في خطبته من غلو في علي بن أبي طالب، وخُطّب بدله يوم الجمعة تاسع عشر ذي القعدة أبو منصور بن تمام فأنقص ذكر علي وختم «اللهم اغفر للمسلمين ومن زعم أن عليًّا مولاه» فرماه العامة بالمدر فكُسر كتفه وأسنانه وسال دمه؛ وخرج خطاب الخليفة غاضبًا «مسجد يجمع الكفرة والزنادقة» ووصفه بأنه أشبه شيء بمسجد الضرار، وهوجم دار الخطيب بنحو ثلاثين رجلًا، وتعطلت الجمعة أسابيع حتى كان يوم عيد النهر فلبّس المؤذن التكبير ووقع الذعر، وتدخل مشايخ الكرخ والشريف المرتضى وأُعيد خطيب على خط مكتوب أول محرم، وأُعفي من ضرب المنبر بالسيف ومن ذكر «مولاه» {cite:muntazam-ibn-al-jawzi j.8 p.383-387}."
  en: "The caliphal court arrested the preacher of Baratha mosque for excessive praise of Ali ibn Abi Talib in his sermon. On Friday 19 Dhu al-Qa'da a substitute, Abu Mansur ibn Tamam, preached in his place, reducing the mention of Ali and closing with 'O God, forgive the Muslims and whoever claims that Ali is his master (mawla).' The common people pelted him with clods, breaking his shoulder and teeth and drawing blood. The caliph's decree came out angrily, calling it 'a mosque that gathers unbelievers and heretics' and likening it to the Mosque of Dirar; about thirty men attacked the preacher's house, and Friday prayer was suspended for weeks until the Feast of Sacrifice (Eid al-Nahr), when the muezzin garbled the takbir and panic broke out. Shaykhs of Karkh and al-Sharif al-Murtada intervened, and a preacher was reinstated by a written decree dated the first of Muharram, exempted from striking the pulpit with a sword and from mentioning 'his master' {cite:muntazam-ibn-al-jawzi j.8 p.383-387}."
