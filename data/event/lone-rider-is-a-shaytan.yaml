id: event/lone-rider-is-a-shaytan
kind: other
label:
  ar: الراكب وحده شيطان والراكبان شيطانان والثلاثة ركب
  en: The lone rider is a shaytan, two riders two shaytans, three a riding party
  ur: اکیلے سوار شیطان، دو سوار دو شیطان، تین سوار قافلہ
summary:
  ar: 'قال النبي: الراكب شيطان، والراكبان شيطانان، والثلاثة ركب {cite:muwatta-maruf-1997} [[passage/muwatta-31-2801|الموطأ 2801]].'
  en: 'The Prophet said: the lone rider is a shaytan, two riders are two shaytans, and three are a riding party {cite:muwatta-maruf-1997} [[passage/muwatta-31-2801|Muwatta 2801]].'
  ur: 'نبی نے کہا: اکیلا سوار شیطان ہے، دو سوار دو شیطان ہیں، اور تین سوار قافلہ ہیں {cite:muwatta-maruf-1997} [[passage/muwatta-31-2801|موطأ 2801]]۔'
