  ar: "في سنة عشرين وأربعمائة وقع بالنعمانية من العراق بردٌ عظام إلى الغاية كل واحدة رطل وأكثر حتى قيل إن بردةً وُجدت تزيد على قنطار، وقد نزلت في الأرض نحو نصف ذراع فكانت كالثور البارك، وفي تاريخ لم يُسمع بمثلها؛ قلعت الأصول العاتية من الزيتون والتفاح {cite:shadharat-dhahab p. 214}."
