id: event/baghdad-hailstorm-420
class: event
kind: other
label: { ar: "برد العراق العظيم", en: "The Great Hailstorm of Iraq", fr: "La grande tempête de grêle d'Irak", es: "La gran tormenta de granizo de Irak", ur: "عراق کا زبردست ژالہ باری", tr: "Irak'ın Büyük Soğuğu", id: "Dinginnya Irak yang Hebat" }
summary:
  ar: "في سنة عشرين وأربعمائة وقع بالنعمانية من العراق بردٌ عظام إلى الغاية كل واحدة رطل وأكثر حتى قيل إن بردةً وُجدت تزيد على قنطار، وقد نزلت في الأرض نحو نصف ذراع فكانت كالثور البارك، وفي تاريخ لم يُسمع بمثلها؛ قلعت الأصول العاتية من الزيتون والتفاح {cite:shadharat-dhahab p. 214}."
  en: "In 420 giant hailstones fell at al-Nu'maniyya in Iraq — each a pound or more, one said to exceed a qintar, punching half a cubit into the ground like a couched bull; a fall the annals had never heard the like of, uprooting great olive and apple trees {cite:shadharat-dhahab p. 214}."
  fr: "En 420, des grêlons géants tombèrent à al-Nu'maniyya, en Irak, chacun d'une livre ou plus, l'un dépassant, dit-on, un quintal, s'enfonçant d'une demi-coudée dans le sol comme un taureau couché ; une chute dont les annales n'avaient jamais entendu la pareille, qui déracina de grands oliviers et pommiers {cite:shadharat-dhahab p. 214}."
  es: "En 420 cayeron en al-Nu'maniyya, en Irak, grandes granizos de más de una libra cada uno, uno de los cuales se dice que superó un qintar, hundiéndose medio codo en el suelo como un toro arrinconado; una caída sin precedentes en los anales, que arrancó de raíz grandes olivos y manzanos {cite:shadharat-dhahab p. 214}."
  ur: "عراق میں النعمانیہ میں 420 بڑے اولے گرے - ہر ایک پاؤنڈ یا اس سے زیادہ، ایک نے کہا کہ ایک قنطار سے زیادہ ہے، آدھا ہاتھ زمین میں ایک پلنگے ہوئے بیل کی طرح ٹھونسنا؛ زیتون اور سیب کے عظیم درختوں کو جڑ سے اکھاڑ پھینکنے کی مثال کبھی نہیں سنی تھی۔ 214}۔"
  tr: "Dört yüz yirmi yılında, Irak'ın El-Nu'maniye kentinde her biri bir pound veya daha fazla ağırlığında olan büyük bir dolu fırtınası meydana geldi; öyle ki, bir dolu tanesinin bir knitarı (yaklaşık 400 gram) kadar ağırlığında olduğu söylendi. Yere yaklaşık yarım kol uzunluğunda düştü ve diz çökmüş bir boğa gibiydi. Tarihte eşi benzeri görülmemiş bir olayda, zeytin ve elma ağaçlarının güçlü kökleri kökünden söküldü. {cite:shadharat-dhahab s. 214}"
  id: "Pada tahun 420, terjadi hujan es besar di Al-Nu’maniyah di Irak, masing-masing butirannya seberat satu pon atau lebih, bahkan ada yang mengatakan bahwa ditemukan satu butiran es yang beratnya lebih dari satu kuntar. Butiran es itu jatuh ke tanah sekitar setengah panjang lengan, dan bentuknya seperti banteng yang berlutut. Dalam sejarah yang belum pernah terdengar, akar-akar kuat pohon zaitun dan apel tercabut. {cite:shadharat-dhahab p. 214}"
