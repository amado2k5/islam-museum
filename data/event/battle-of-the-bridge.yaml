id: event/battle-of-the-bridge
class: event
kind: battle
label: { ar: "يوم الجسر", en: "The Day of the Bridge" }
summary:
  ar: "عند البلاذري: وهو يوم قس الناطف؛ بعث الفرس إلى العرب ذا الحاجب مردانشاه — وكان أنوشروان لقّبه ببهمن لتبركه به وسُمّي ذا الحاجب لأنه كان يعضب حاجبيه ليرفعهما عن عينه كبراً ويقال إن اسمه رستم — فأمر أبو عبيد بالجسر فيُقد وأعانه على عقده أهل بانقيا ويقال إن ذلك الجسر كان قديماً لأهل الحيرة يعبرون عليه إلى ضياعهم فأصلحه أبو عبيد وذلك أنه كان معتلاً مقطوعاً ثم عبر أبو عبيد والمسلمون من المزوحة على الجسر فلقوا ذا الحاجب وهو في أربعة آلاف مدجج ومعه فيل ويقال عدة فيلة فاقتتلوا قتالاً شديداً وكثرت الجراحات وفشت في المسلمين فقال سليط بن قيس يا أبا عبيد قد كنت نهيتك عن قطع هذا الجسر إليهم وأشرت عليك بالانحياز إلى بعض النواحي والكتاب إلى أمير المؤمنين بالاستمداد فأبيت وقاتل سليط حتى قتل وسأل أبو عبيد أين مقتل هذه الدابة فقيل خرطومه فحمل فضرب خرطوم الفيل وحمل عليه أبو محجن بن حبيب الثقفي فضرب رجله فعلقها وحمل المشركون فقتل أبو عبيد ويقال إن الفيل برك عليه فمات تحته فأخذ اللواء أخوه الحكم فقتل فأخذه ابنه جبر فقتل ثم إن المثنى بن حارثة أخذه ساعة وانصرف بالناس وبعضهم على حامية بعض وقاتل عروة بن زيد الخيل يومئذ قتالاً شديداً عدل بقتال جماعة وقاتل أبو زبيد الطائي الشاعر حياً للمسلمين بالغربية وكان أتى الحيرة في بعض أموره وكان نصرانياً وأتى المثنى أليس فنزلها وكتب إلى عمر بالخبر مع عروة بن زيد وكان ممن قتل يوم الجسر فيما ذكر أبو مخنف أبو زيد الأنصاري أحد من جمع القرآن على عهد النبي وكانت وقعة الجسر يوم السبت في آخر شهر رمضان سنة ثلاث عشرة. وعند المسعودي عقد له بعض الدهاقين جسراً على الفرات فلما عبر أمر بقطعه فاعترض مسلمة بن أسلم وسليط بن قيس وقد أوصاه عمر أن يستشيرهما، فلما قاتل نظرت العرب إلى الفيلة عليها التجافيف فرأوا ما لم يروا مثله فانهزموا ومات في الفرات أكثر ممن قتل بالسيف {cite:muruj-al-dhahab p. 604}"
  en: "In al-Baladhuri: the Day of Quss al-Natif, being the Day of the Bridge; the Persians sent against the Arabs Dhu al-Hajib Mardanshah — Anushirwan had named him Bahman for blessing, called Dhu al-Hajib for tying his brows up over his eyes in pride, though his name is said to be Rustam. Abu Ubayd ordered the bridge tied — Baniqya's people helping its knotting; it is said the bridge was old for Hira's people crossing to their estates, Abu Ubayd repairing it for it was broken. He and the Muslims crossed from al-Muzawwaha over the bridge and met Dhu al-Hajib in four thousand mailed men with an elephant — or several; they fought fiercely, wounds spreading through the Muslims. Salit ibn Qays said 'Abu Ubayd, I had forbidden you cutting this bridge to them and counselled withdrawing to some quarter and writing the Commander of the Faithful for reinforcement — you refused'; Salit fought till killed. Abu Ubayd asked where this beast's kill-spot was — 'its trunk' — charged and struck the elephant's trunk while Abu Muhjan ibn Habib al-Thaqafi struck its leg and hamstrung it; the polytheists charged and killed Abu Ubayd — or the elephant knelt on him and he died under it. His brother al-Hakam took the banner — killed; his son Jabr — killed; then al-Muthanna ibn Haritha held it a while and withdrew the people, each guarding another. Urwa ibn Zayd al-Khayl fought that day a fight worth a company's; Abu Zubayd al-Ta'i the poet fought hayya for the Muslims with the westerners — a Christian come to Hira on some affair. Al-Muthanna reached Ulays and wrote Umar the news with Urwa ibn Zayd. Killed at the Bridge per Abu Mikhnaf: Abu Zayd al-Ansari, one of those who collected the Qur'an in the Prophet's time. The Bridge battle was on Saturday at Ramadan's end, year 13."
