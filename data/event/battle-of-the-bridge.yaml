id: event/battle-of-the-bridge
class: event
kind: battle
label: { ar: "يوم الجسر", en: "The Day of the Bridge", fr: "La journée du Pont", es: "El día del puente", ur: "پل کا دن", tr: "Köprü Günü", id: "Hari Jembatan" }
summary:
  ar: "عند البلاذري: وهو يوم قس الناطف؛ بعث الفرس إلى العرب ذا الحاجب مردانشاه — وكان أنوشروان لقّبه ببهمن لتبركه به وسُمّي ذا الحاجب لأنه كان يعضب حاجبيه ليرفعهما عن عينه كبراً ويقال إن اسمه رستم — فأمر أبو عبيد بالجسر فيُقد وأعانه على عقده أهل بانقيا ويقال إن ذلك الجسر كان قديماً لأهل الحيرة يعبرون عليه إلى ضياعهم فأصلحه أبو عبيد وذلك أنه كان معتلاً مقطوعاً ثم عبر أبو عبيد والمسلمون من المزوحة على الجسر فلقوا ذا الحاجب وهو في أربعة آلاف مدجج ومعه فيل ويقال عدة فيلة فاقتتلوا قتالاً شديداً وكثرت الجراحات وفشت في المسلمين فقال سليط بن قيس يا أبا عبيد قد كنت نهيتك عن قطع هذا الجسر إليهم وأشرت عليك بالانحياز إلى بعض النواحي والكتاب إلى أمير المؤمنين بالاستمداد فأبيت وقاتل سليط حتى قتل وسأل أبو عبيد أين مقتل هذه الدابة فقيل خرطومه فحمل فضرب خرطوم الفيل وحمل عليه أبو محجن بن حبيب الثقفي فضرب رجله فعلقها وحمل المشركون فقتل أبو عبيد ويقال إن الفيل برك عليه فمات تحته فأخذ اللواء أخوه الحكم فقتل فأخذه ابنه جبر فقتل ثم إن المثنى بن حارثة أخذه ساعة وانصرف بالناس وبعضهم على حامية بعض وقاتل عروة بن زيد الخيل يومئذ قتالاً شديداً عدل بقتال جماعة وقاتل أبو زبيد الطائي الشاعر حياً للمسلمين بالغربية وكان أتى الحيرة في بعض أموره وكان نصرانياً وأتى المثنى أليس فنزلها وكتب إلى عمر بالخبر مع عروة بن زيد وكان ممن قتل يوم الجسر فيما ذكر أبو مخنف أبو زيد الأنصاري أحد من جمع القرآن على عهد النبي وكانت وقعة الجسر يوم السبت في آخر شهر رمضان سنة ثلاث عشرة. وعند المسعودي عقد له بعض الدهاقين جسراً على الفرات فلما عبر أمر بقطعه فاعترض مسلمة بن أسلم وسليط بن قيس وقد أوصاه عمر أن يستشيرهما، فلما قاتل نظرت العرب إلى الفيلة عليها التجافيف فرأوا ما لم يروا مثله فانهزموا ومات في الفرات أكثر ممن قتل بالسيف {cite:muruj-al-dhahab p. 604}"
  en: "In al-Baladhuri: the Day of Quss al-Natif, being the Day of the Bridge; the Persians sent against the Arabs Dhu al-Hajib Mardanshah — Anushirwan had named him Bahman for blessing, called Dhu al-Hajib for tying his brows up over his eyes in pride, though his name is said to be Rustam. Abu Ubayd ordered the bridge tied — Baniqya's people helping its knotting; it is said the bridge was old for Hira's people crossing to their estates, Abu Ubayd repairing it for it was broken. He and the Muslims crossed from al-Muzawwaha over the bridge and met Dhu al-Hajib in four thousand mailed men with an elephant — or several; they fought fiercely, wounds spreading through the Muslims. Salit ibn Qays said 'Abu Ubayd, I had forbidden you cutting this bridge to them and counselled withdrawing to some quarter and writing the Commander of the Faithful for reinforcement — you refused'; Salit fought till killed. Abu Ubayd asked where this beast's kill-spot was — 'its trunk' — charged and struck the elephant's trunk while Abu Muhjan ibn Habib al-Thaqafi struck its leg and hamstrung it; the polytheists charged and killed Abu Ubayd — or the elephant knelt on him and he died under it. His brother al-Hakam took the banner — killed; his son Jabr — killed; then al-Muthanna ibn Haritha held it a while and withdrew the people, each guarding another. Urwa ibn Zayd al-Khayl fought that day a fight worth a company's; Abu Zubayd al-Ta'i the poet fought hayya for the Muslims with the westerners — a Christian come to Hira on some affair. Al-Muthanna reached Ulays and wrote Umar the news with Urwa ibn Zayd. Killed at the Bridge per Abu Mikhnaf: Abu Zayd al-Ansari, one of those who collected the Qur'an in the Prophet's time. The Bridge battle was on Saturday at Ramadan's end, year 13."
  fr: "Chez al-Baladhuri : la journée de Quss al-Natif, qui est la journée du Pont ; les Persans envoyèrent contre les Arabes Dhu al-Hajib Mardanshah ; Anushirwan l'avait nommé Bahman pour la bénédiction, et on l'appelait Dhu al-Hajib parce qu'il relevait par orgueil ses sourcils au-dessus de ses yeux, bien que l'on dise que son nom était Rustam. Abu Ubayd ordonna d'attacher le pont, les gens de Baniqya aidant à en nouer les liens ; on dit que le pont était ancien, servant aux gens de Hira pour passer à leurs domaines, et qu'Abu Ubayd le répara parce qu'il était rompu. Lui et les musulmans traversèrent d'al-Muzawwaha par le pont et rencontrèrent Dhu al-Hajib avec quatre mille hommes cuirassés et un éléphant, ou plusieurs ; ils combattirent avec acharnement, et les blessures se répandirent parmi les musulmans. Salit ibn Qays dit : « Abu Ubayd, je t'avais interdit de leur couper ce pont et je t'avais conseillé de te replier vers quelque endroit et d'écrire au Commandeur des croyants pour demander des renforts ; tu as refusé » ; Salit combattit jusqu'à être tué. Abu Ubayd demanda où était le point mortel de cette bête, « sa trompe », chargea et frappa la trompe de l'éléphant, tandis qu'Abu Muhjan ibn Habib al-Thaqafi frappait sa jambe et lui tranchait le jarret ; les polythéistes chargèrent et tuèrent Abu Ubayd, ou bien l'éléphant s'agenouilla sur lui et il mourut sous lui. Son frère al-Hakam prit la bannière et fut tué ; son fils Jabr, tué ; puis al-Muthanna ibn Haritha la tint un moment et retira les gens, chacun protégeant l'autre. Urwa ibn Zayd al-Khayl combattit ce jour-là d'un combat qui valait celui d'une troupe ; Abu Zubayd al-Ta'i, le poète, combattit pour les musulmans, par hayya, aux côtés des Occidentaux : un chrétien venu à Hira pour quelque affaire. Al-Muthanna atteignit Ulays et écrivit la nouvelle à Umar par Urwa ibn Zayd. Tué au Pont selon Abu Mikhnaf : Abu Zayd al-Ansari, l'un de ceux qui rassemblèrent le Coran du temps du Prophète. La bataille du Pont eut lieu un samedi à la fin de Ramadan, en l'an 13."
  es: "En al-Baladhuri: el Día de Quss al-Natif, siendo el Día del Puente; los persas enviaron contra los árabes a Dhu al-Hajib Mardanshah — Anushirwan lo había llamado Bahman por bendición, llamado Dhu al-Hajib por atarse las cejas sobre los ojos en orgullo, aunque se dice que su nombre era Rustam. Abu Ubayd ordenó atar el puente — la gente de Baniqya ayudó a anudarlo; se dice que el puente era viejo para la gente de Hira que cruzaba a sus propiedades, Abu Ubayd lo reparó porque estaba roto. Él y los musulmanes cruzaron desde al-Muzawwaha por el puente y se encontraron con Dhu al-Hajib en cuatro mil hombres con armadura y un elefante — o varios; lucharon ferozmente, las heridas se extendieron entre los musulmanes. Salit ibn Qays dijo: «Abu Ubayd, te prohibí cortar este puente hacia ellos y te aconsejé que te retiraras a algún lugar y escribieras al Comandante de los Creyentes para pedir refuerzos; te negaste». Salit luchó hasta la muerte. Abu Ubayd preguntó dónde estaba el punto débil de la bestia —«su trompa»—, cargó y golpeó la trompa del elefante mientras Abu Muhjan ibn Habib al-Thaqafi golpeaba su pata y la desgarraba; los politeístas cargaron y mataron a Abu Ubayd —o el elefante se arrodilló sobre él y murió bajo él—. Su hermano al-Hakam tomó el estandarte —murió—; su hijo Jabr —murió—; luego al-Muthanna ibn Haritha lo sostuvo un tiempo y retiró a la gente, cada uno protegiendo a otro. Urwa ibn Zayd al-Khayl libró ese día una batalla digna de una compañía; Abu Zubayd al-Ta'i, el poeta, luchó por los musulmanes contra los occidentales —un cristiano que había venido a Hira por algún asunto—. Al-Muthanna llegó a Ulays y le escribió a Umar la noticia junto con Urwa ibn Zayd. Murió en el puente, según Abu Mikhnaf: Abu Zayd al-Ansari, uno de los que recopilaron el Corán en tiempos del Profeta. La batalla del puente tuvo lugar el sábado al final del Ramadán del año 13."
  ur: "البلادوری میں ہے: یوم القس النطیف، پل کا دن ہونا؛ فارسیوں نے عربوں کے خلاف بھیجا ذو الحجیب مردانشاہ - انوشیروان نے اس کا نام بہمن رکھا تھا برکت کے لیے، ذو الحجیب نے غرور میں اپنی آنکھوں پر برانچہ باندھنے کے لیے کہا تھا، حالانکہ اس کا نام رستم بتایا جاتا ہے۔ ابو عبید نے پل باندھنے کا حکم دیا — بنقیہ کے لوگ اس کی گرہ لگانے میں مدد کر رہے ہیں۔ کہا جاتا ہے کہ یہ پل حیرہ کے لوگوں کے لیے پرانا تھا کہ وہ اپنی جاگیروں کی طرف جاتے تھے، ابو عبید نے اس کی مرمت کی کیونکہ یہ ٹوٹ گیا تھا۔ وہ اور مسلمان المزواح سے پل کے اوپر سے گزرے اور ذی الحجیب سے چار ہزار آدمیوں میں ملے جو ایک ہاتھی کے ساتھ بھیجے گئے تھے۔ انہوں نے زبردست جنگ کی، زخم مسلمانوں میں پھیل گئے۔ سلط بن قیس نے کہا کہ ابو عبید، میں نے آپ کو ان کے لیے یہ پل کاٹنے سے منع کیا تھا اور مشورہ دیا تھا کہ کسی چوتھائی تک پیچھے ہٹ جائیں اور کمک کے لیے امیر المومنین کو لکھیں، آپ نے انکار کر دیا۔ سالیت مارے جانے تک لڑا۔ ابو عبید نے پوچھا کہ اس درندے کے مارنے کی جگہ کہاں ہے - 'اس کی سونڈ' - نے ہاتھی کی سونڈ کو چارج کیا اور مارا جب کہ ابو محجن بن حبیب الثقفی نے اس کی ٹانگ پر مارا اور اسے کاٹ دیا۔ مشرکین نے ابو عبید پر الزام لگا کر قتل کر دیا - یا ہاتھی نے اس پر گھٹنے ٹیک دیے اور وہ اس کے نیچے مر گیا۔ اس کے بھائی الحکم نے بینر لے لیا — مارا گیا۔ اس کا بیٹا جبر مارا گیا۔ پھر مثنیٰ بن حارثہ نے اسے کچھ دیر روکے رکھا اور لوگوں کو پیچھے ہٹا لیا، ہر ایک دوسرے کی حفاظت کر رہا تھا۔ عروہ بن زید الخیل نے اس دن ایک ایسی لڑائی لڑی جو ایک کمپنی کے برابر تھی۔ ابو زبید الطائی شاعر نے مغربیوں کے ساتھ مسلمانوں کے لیے حیا کی لڑائی لڑی تھی - ایک عیسائی کسی کام سے حرا آیا۔ المثنیٰ الیس تک پہنچا اور عمر کو یہ خبر عروہ بن زید کے پاس لکھی۔ پل پر قتل فی ابو مخنف: ابو زید الانصاری، عہد نبوی میں قرآن جمع کرنے والوں میں سے تھے۔ برج جنگ ہفتہ کو رمضان المبارک کے آخر میں، سال 13 میں ہوئی تھی۔"
  tr: "El-Baladhuri'ye göre: Kas el-Natif günüydü; Persler, kaşlı Mardanşah'ı Araplara gönderdiler. Anuşirvan, bereketinden dolayı ona Bahman lakabını takmıştı ve kaşlarını gururundan dolayı yolup gözlerinin üzerine kaldırdığı için Zül-Hacib (kaşlı) olarak da anılırdı. Adının Rüştam olduğu da söylenir. Ebu Ubeyd köprünün kesilmesini emretti ve Bankiye halkı ona onarımında yardım etti. Bu köprünün Hira halkının köylerine geçmek için kullandığı eski bir köprü olduğu ve Ebu Ubeyd'in kırık ve hasarlı olduğu için onardığı söylenir. Sonra Ebu Ubeyd ve Mazuha'dan Müslümanlar köprüden geçtiler ve Zül-Hacib ile dört bin tam teçhizatlı adam ve bir fil, ya da bazı kaynaklara göre birkaç fil ile karşılaştılar. Şiddetli bir savaş yaşandı ve birçok Müslüman yaralandı. Sulayt ibn Qays, \"Ey Ebu Ubayd, sana bu köprüyü kesmemen konusunda uyarıda bulunmuş ve başka bir yöne çekilip Müminlerin Emiri'ne takviye istemek için mektup yazmanı tavsiye etmiştim, ama sen reddettin\" dedi. Sulayt, öldürülene kadar savaştı. Ebu Ubayd, hayvanın neresinden öldürüldüğünü sordu ve hortumundan öldürüldüğü söylendi. Bunun üzerine Ebu Ubayd, filin hortumuna vurdu ve Ebu Mihjan ibn Habib el-Saqafi ona saldırdı ve bacağına vurdu. Ebu Ubayd'ı astı ve müşrikler saldırdı ve Ebu Ubayd öldürüldü. Rivayetlere göre fil onun üzerine diz çöktü ve altında öldü. Kardeşi El-Hakam sancağı aldı ve öldürüldü. Oğlu Cebr sancağı aldı ve öldürüldü. Sonra El-Muthanna bin Haritha bir süre sancağı aldı ve halkla birlikte ayrıldı, bazıları birbirlerini koruyarak. Urva bin Zaid o gün atlarla şiddetli bir mücadele verdi, bu mücadele bir grup halinde savaşmaya eşdeğerdi. Şair Ebu Zübeyd el-Ta'i, batıda Müslümanlar için savaşmıştı. Bazı işleri için Hira'ya gelmişti ve Hristiyandı. El-Muthanna, Ays'a gelip orada kaldı ve Urva bin Zeyd ile birlikte Ömer'e haber yazdı. Ebu Mikhnaf'ın belirttiği gibi, köprü günü öldürülenler arasında, Peygamberimiz zamanında Kur'an'ı derleyenlerden biri olan Ebu Zeyd el-Ensari de vardı. Köprü Muharebesi, on üçüncü yılın Ramazan ayının sonundaki Cumartesi günü gerçekleşti. El-Mas'udi'ye göre, bazı toprak sahipleri onun için Fırat Nehri üzerine bir köprü inşa etmişti. Köprüyü geçtiğinde, köprünün kesilmesini emretti. Maslama bin Aslam ve Sulayt bin Kays itiraz etti ve Ömer ona onlarla görüşmesini emretti. O savaşırken, Araplar kalkanlı fillere baktılar ve daha önce hiç görmedikleri bir şey gördüler; bu yüzden yenildiler ve Fırat'ta kılıçla öldürülenlerden daha çok insan öldü. {cite:muruj-al-dhahab s. 604}"
  id: "Menurut Al-Baladhuri: Pada hari Qas al-Natif; orang Persia mengirim Mardanshah, yang memiliki alis, kepada orang Arab—Anushirvan memberinya julukan Bahman karena berkah yang diberikannya, dan ia disebut Dhu al-Hajib (yang memiliki alis) karena ia biasa mencabut alisnya untuk mengangkatnya di atas matanya karena kesombongan. Ada juga yang mengatakan bahwa namanya adalah Rustam. Abu Ubayd memerintahkan jembatan itu untuk diputus, dan penduduk Banqiya membantunya memperbaikinya. Dikatakan bahwa jembatan ini adalah jembatan tua yang digunakan oleh penduduk Hira untuk menyeberang ke desa mereka, dan Abu Ubayd memperbaikinya karena rusak dan hancur. Kemudian Abu Ubayd dan kaum Muslim dari al-Mazuha menyeberangi jembatan dan bertemu dengan Dhu al-Hajib dengan empat ribu orang bersenjata lengkap dan seekor gajah, atau ada yang mengatakan beberapa gajah. Mereka bertempur sengit, dan banyak Muslim yang terluka. Sulayt bin Qays berkata, \"Wahai Abu Ubayd, aku telah memperingatkanmu agar tidak memutus jembatan ini ke arah mereka dan menyarankanmu untuk mundur ke arah lain dan menulis surat kepada Amirul Mukminin untuk meminta bala bantuan, tetapi kau menolak.\" Sulayt bertempur hingga gugur. Abu Ubayd bertanya di mana hewan itu terbunuh, dan diberitahu bahwa itu terjadi di belalainya. Maka ia menyerang dan memukul belalai gajah itu, dan Abu Mihjan bin Habib al-Thaqafi menyerangnya dan memukul kakinya. Ia menggantungnya dan kaum musyrik menyerang, dan Abu Ubayd terbunuh. Dikatakan bahwa gajah itu berlutut di atasnya dan ia mati di bawahnya. Saudaranya, Al-Hakam, mengambil panji dan terbunuh. Putranya, Jabr, mengambilnya dan terbunuh. Kemudian Al-Muthanna bin Haritha mengambilnya untuk sementara waktu dan pergi bersama orang-orang, sebagian dari mereka saling menjaga. Urwa bin Zaid bertempur melawan kuda-kuda pada hari itu dengan pertempuran sengit, setara dengan pertempuran sekelompok orang. Abu Zubayd Al-Ta’i, seorang penyair, berjuang untuk kaum Muslim di barat. Ia datang ke Al-Hira untuk beberapa urusannya dan ia adalah seorang Kristen. Al-Muthanna datang ke Al-Ays dan tinggal di sana serta menulis surat kepada Umar dengan berita tersebut bersama Urwa bin Zaid. Di antara mereka yang terbunuh pada hari pertempuran jembatan, sebagaimana disebutkan oleh Abu Mikhnaf, adalah Abu Zaid Al-Ansari, salah satu orang yang menyusun Al-Qur'an pada masa Nabi. Pertempuran Jembatan terjadi pada hari Sabtu di akhir Ramadan tahun 13. Dan menurut Al-Mas’udi, beberapa pemilik tanah membangun jembatan untuknya di atas Sungai Eufrat. Ketika ia menyeberang, ia memerintahkan agar jembatan itu diputus. Maslama bin Aslam dan Sulayt bin Qays keberatan, dan Umar telah menginstruksikannya untuk berkonsultasi dengan mereka. Ketika ia berperang, orang-orang Arab melihat gajah-gajah dengan perisai di atasnya dan melihat sesuatu yang belum pernah mereka lihat sebelumnya, sehingga mereka dikalahkan, dan lebih banyak yang tewas di Sungai Eufrat daripada yang terbunuh oleh pedang. {mengutip:muruj-al-dhahab hal. 604}"
