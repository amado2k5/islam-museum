id: event/ibn-al-tiqtaqa-fakhri-mosul-701
class: event
kind: publication
label:
  ar: "ابن الطقطقي يؤلف «الفخري» بالموصل سنة ٧٠١هـ"
  en: "Ibn al-Tiqtaqa composes al-Fakhri at Mosul, 701/1302"
  ur: "موصل میں ابن طقطقی کی تصنیف «فخری»، 701ھ/1302ء"
summary:
  ar: "في المدة من جمادى الآخرة إلى شوال سنة ٧٠١هـ/فبراير إلى أوائل يونيو ١٣٠٢م، أثناء إقامة بالموصل في طريقه إلى تبريز، ألّف ابن الطقطقي تاريخه «الفخري» لفخر الدين عيسى بن إبراهيم صاحب الموصل؛ والكتاب مرشد موجز للملوك (فورستنشبيغل) ثم تراجم الخلفاء إلى المستعصم، يعقب كل منها تراجم وزراء ذلك الخليفة، وقد اختار مادته الحكائية بمهارة ونظر إلى التاريخ نظرة تأملية {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}."
  en: "Between Jumada II and Shawwal 701 (February to early June 1302), during a stay in Mosul on the way to Tabriz, Ibn al-Tiqtaqa wrote his history al-Fakhri for Fakhr al-Din Isa ibn Ibrahim of Mosul: a brief Furstenspiegel followed by biographies of the caliphs down to al-Musta'sim, each followed by the biographies of that caliph's viziers, its anecdotal material skilfully chosen and its approach reflective rather than factual {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}."
  ur: "701ھ میں جمادی الثانی سے شوال تک (فروری تا ابتدائی جون 1302ء) تبریز کے سفر میں موصل کی اقامت کے دوران ابن طقطقی نے موصل کے حاکم فخر الدین عیسیٰ بن ابراہیم کے لیے اپنی تاریخ «الفخری» لکھی: مختصر مرشد الملوک کے بعد مستعصم تک خلفاء کی تراجم، ہر ایک کے ساتھ اس خلیفہ کے وزراء کی تراجم؛ حکیانہ مواد کا ماہرانہ انتخاب اور تاریخ پر فکر انگیز نکتۂ نظر {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}۔"
