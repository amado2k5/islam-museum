id: event/arhab-takes-athafit-and-abu-umar-is-killed-285
class: event
kind: other
label:
  ar: أرحب وبنو سلمان يدخلون أثافت ومقتل أبي عمر عبد العزيز بن مروان، قبل شوال 285هـ
  en: Arhab and Banu Salman enter Athafit and Abu Umar Abd al-Aziz ibn Marwan is killed, before Shawwal 285 AH
  ur: ارحب اور بنو سلمان اثافت میں داخل اور ابو عمر عبد العزیز بن مروان کا قتل، شوال 285ھ سے پہلے
  es: "Arhab y Banu Salman entran en Athafit y Abu Umar Abd al-Aziz ibn Marwan es asesinado, antes de Shawwal 285 AH"
  fr: "Arhab et Banu Salman entrent à Athafit et Abu Umar Abd al-Aziz ibn Marwan est tué, avant Shawwal 285 AH"
  tr: "Hoş geldiniz ve Salman'ın oğulları Athaft'a girer ve Ebu Ömer Abdül Aziz bin Mervan'ın öldürülmesi, Hicri 285 yılının Şevval ayından önce gerçekleşir."
  id: "Selamat datang, dan putra-putra Salman memasuki Athaft, dan pembunuhan Abu Umar Abdul Aziz bin Marwan, sebelum Syawal 285 H."
summary:
  ar: يذكر الكتاب أن أرحب وبني سلمان وصلوا أثافت وكان فيها قوم مداهنون قد عاملوهم على دخول القرية، فصاح أبو عمر، والي أثافت من قبل الهادي، بالناس فخرجت إليه جماعة يسيرة وخذله الباقون، فقتل، ودخل أرحب وبنو سلمان أثافت وأقاموا بها، وجاء الدعام فدخلها ليلة الجمعة.
  en: The book says Arhab and Banu Salman reached Athafit where some people, temporisers, had dealt with them over entering the village; Abu Umar, al-Hadi's governor of Athafit, called the people out, a small group came and the rest let him down, and he was killed; Arhab and Banu Salman entered and stayed, and al-Da'am came in on the night of Friday.
  ur: کتاب کہتی ہے کہ ارحب اور بنو سلمان اثافت پہنچے جہاں کچھ مداہنت کرنے والے لوگ گاؤں میں داخلے پر ان سے معاملہ کر چکے تھے؛ ہادی کے والیِ اثافت ابو عمر نے لوگوں کو پکارا، ایک چھوٹی جماعت نکلی اور باقیوں نے ساتھ چھوڑ دیا، اور وہ قتل کر دیے گئے؛ ارحب اور بنو سلمان داخل ہو کر ٹھہر گئے اور دعام جمعہ کی رات وہاں آیا۔
  es: "El libro dice que Arhab y Banu Salman llegaron a Athafit, donde algunas personas, unos dilatorios, les habían impedido entrar en la aldea; Abu Umar, gobernador de Athafit por al-Hadi, llamó a la gente, un pequeño grupo acudió y el resto lo derribó, y lo mataron; Arhab y Banu Salman entraron y se quedaron, y al-Da'am llegó la noche del viernes."
  fr: "Le livre raconte qu'Arhab et les Banu Salman arrivèrent à Athafit où des personnes, des temporisateurs, les avaient empêchés d'entrer dans le village; Abu Umar, gouverneur d'Athafit sous l'autorité d'al-Hadi, appela les habitants, un petit groupe vint et les autres le laissèrent tomber, et il fut tué; Arhab et les Banu Salman entrèrent et restèrent, et al-Da'am arriva dans la nuit du vendredi."
  tr: "Kitapta, Arhab ve Beni Salman'ın Athaft'a ulaştığı ve orada onlarla anlaşarak köye girmelerini sağlayan münafık kişilerin bulunduğu belirtiliyor. Athaft valisi Ebu Ömer, Hadi adına halka seslendi ve küçük bir grup ona doğru geldi, geri kalanlar ise onu terk etti, bu yüzden öldürüldü. Arhab ve Beni Salman Athaft'a girdiler ve orada kaldılar, Cuma gecesi ise Da'am geldi ve köye girdi."
  id: "Kitab tersebut menyebutkan bahwa Arhab dan Bani Salman sampai di Athaft, dan di sana ada orang-orang munafik yang telah bersekongkol dengan mereka untuk memasuki desa. Abu Umar, gubernur Athaft atas nama Al-Hadi, menyeru penduduk, dan sekelompok kecil orang keluar menemuinya, sedangkan sisanya meninggalkannya, sehingga ia terbunuh. Arhab dan Bani Salman memasuki Athaft dan tinggal di sana, dan Al-Da'am datang dan memasukinya pada Jumat malam."
