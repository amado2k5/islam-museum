id: "event/banu-al-harith-breach-the-wall-at-the-house-of-ali-ibn-rabi-and-enter-the-village-295"
class: event
kind: other
label:
  ar: "بنو الحارث يفرضون السور عند دار علي بن ربيع ويدخلون القرية، 295هـ"
  en: "Banu al-Harith breach the wall at the house of Ali ibn Rabi' and enter the village, 295 AH, p. 371"
  ur: "بنو حارث علی بن ربیع کے گھر کے پاس دیوار توڑ کر بستی میں داخل ہوتے ہیں، 295ھ، ص371"
  fr: "Les Banu al-Harith percent le mur près de la maison d'Ali ibn Rabi' et entrent dans le village, 295 H, p. 371"
  es: "Los Banu al-Harith atraviesan el muro de la casa de Ali ibn Rabi' y entran en la aldea, 295 AH, pág. 371"
  tr: "Beni el-Harith, Ali ibn Rabi'nin evinin etrafına bir duvar ördü ve Hicri 295 yılında köye girdi."
  id: "Bani al-Harith membangun tembok di rumah Ali ibn Rabi’ dan memasuki desa, 295 H."
summary:
  ar: "أخبر أحد الحراس أبا جعفر بأن بني الحارث فرضوا السور من عند دار علي بن ربيع ودخلوا القرية، وأن من كان معه من بني عبد المدان وبني الحارث قد لقوهم وأدخلوهم. فأرسل أبو جعفر من يدعو بني عبد المدان ومواليهم إلى نصرته، فلم يأته منهم أحد."
  en: "A sentry reported to Abu Ja'far that Banu al-Harith had breached the wall near the house of Ali ibn Rabi' and entered the village, and that the Banu Abd al-Madan and Banu al-Harith men who had been with him had met them and let them in. Abu Ja'far sent a servant to call on Banu Abd al-Madan and their clients to come to his support, and not one of them came."
  ur: "ایک پہرے دار نے ابو جعفر کو خبر دی کہ بنو حارث نے علی بن ربیع کے گھر کے پاس سے دیوار توڑ دی ہے اور بستی میں داخل ہو گئے ہیں، اور جو بنو عبدالمدان اور بنو حارث کے لوگ اس کے ساتھ تھے وہ ان سے مل گئے اور انہیں اندر آنے دیا۔ ابو جعفر نے ایک خادم کو بنو عبدالمدان اور ان کے موالی کو مدد کے لیے بلانے بھیجا، مگر ان میں سے کوئی نہ آیا۔"
  fr: "Une sentinelle rapporta à Abu Ja'far que les Banu al-Harith avaient percé le mur près de la maison d'Ali ibn Rabi' et étaient entrés dans le village, et que les hommes des Banu Abd al-Madan et des Banu al-Harith qui avaient été avec lui les avaient rejoints et fait entrer. Abu Ja'far envoya un serviteur appeler les Banu Abd al-Madan et leurs clients à venir le soutenir, et pas un d'entre eux ne vint."
  es: "Un centinela informó a Abu Ja'far que los Banu al-Harith habían traspasado la muralla cerca de la casa de Ali ibn Rabi' y entrado en la aldea, y que los hombres de los Banu Abd al-Madan y los Banu al-Harith que lo acompañaban los habían recibido y les habían abierto el paso. Abu Ja'far envió a un sirviente a convocar a los Banu Abd al-Madan y a sus aliados para que acudieran en su ayuda, pero ninguno de ellos apareció."
  tr: "Muhafızlardan biri Ebu Cafer'e, Beni el-Harith kabilesinin Ali ibn Rabi'nin evinin yakınındaki surları aşıp köye girdiğini ve onunla birlikte olan Beni Abd el-Madan ve Beni el-Harith kabilelerinden olanların onları karşılayıp içeri getirdiğini bildirdi. Bunun üzerine Ebu Cafer, Beni Abd el-Madan ve müttefiklerinden yardım istemesi için birini gönderdi, ancak hiçbiri yanıt vermedi."
  id: "Salah seorang penjaga memberitahu Abu Ja'far bahwa Bani al-Harith telah menerobos tembok di dekat rumah Ali ibn Rabi' dan memasuki desa, dan bahwa orang-orang yang bersamanya dari Bani Abd al-Madan dan Bani al-Harith telah menemui mereka dan membawa mereka masuk. Maka Abu Ja'far mengirim seseorang untuk memanggil Bani Abd al-Madan dan sekutu mereka untuk datang membantunya, tetapi tidak seorang pun dari mereka yang menanggapi."
