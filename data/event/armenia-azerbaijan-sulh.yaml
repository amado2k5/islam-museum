summary:
  ar: "صلح أرمينية وأذربيجان: لما عزل عثمان عتبة بن فرقد عن أذربيجان نقض أهلها فغزاهم الوليد بن عقبة وعلى مقدمته عبد الله بن شَبيل الأحمسي فأغار على أهل موقان واليبر والطيلسان ففتح وغنم وسبى فطلب أهل كور أذربيجان الصلح فصالحهم على صلح حذيفة وهو ثمانمائة ألف درهم، وبعث سلمان بن ربيعة الباهلي إلى أرمينية في اثني عشر ألفًا فقتل وسبى وغنم، وبلغه بطريق أرمنياقس الموريان قد توجه في ثمانين ألفًا فأجمع حبيب بن مسلمة على تبييتهم، وقالت امرأته أم عبد الله بنت يزيد الكلبية: أين موعدك؟ فقال: سرادق الموريان، فبيّتهم وأتى السرادق فوجد امرأته قد سبقته إليه فكانت أول امرأة دخلت سرادق الموريان {cite:kamil-ibn-al-athir p. 457-458}."
  en: "When Azerbaijan repudiated the treaty on 'Utba ibn Farqad's dismissal, al-Walid campaigned there — 'Abdallah ibn Shubayl raiding Muqan and the Tailsan until its districts bought peace at 800,000 dirhams on Hudhayfa's old terms — while Salman ibn Rabi'a ranged Armenia with twelve thousand. When the patrician Mawriyan advanced with eighty thousand, Habib ibn Maslama resolved on a night attack; his wife Umm 'Abdallah bint Yazid asked «where is your tryst?« — «the pavilion of the Mawriyan« — and when he reached it she was already inside, the first woman into the Mawriyan's pavilion {cite:kamil-ibn-al-athir p. 457-458}."
  es: "Cuando Azerbaiyán repudió el tratado sobre la destitución de 'Utba ibn Farqad, al-Walid emprendió una campaña allí — 'Abdallah ibn Shubayl saqueó Muqan y Tailsan hasta que sus distritos compraron la paz por 800.000 dirhams en los antiguos términos de Hudhayfa — mientras que Salman ibn Rabi'a recorría Armenia con doce mil hombres. Cuando el patricio Mawriyan avanzó con ochenta mil, Habib ibn Maslama decidió realizar un ataque nocturno; su esposa Umm 'Abdallah bint Yazid preguntó «¿dónde está tu cita?» — «el pabellón del Mawriyan» — y cuando él llegó, ella ya estaba dentro, la primera mujer en entrar al pabellón del Mawriyan {cite:kamil-ibn-al-athir p. 457-458}."
  fr: "Lorsque l'Azerbaïdjan a répudié le traité suite à la destitution d'Utba ibn Farqad, al-Walid y mena campagne. Abdallah ibn Shubayl pilla le Muqan et le Tailsan jusqu'à ce que ses districts obtiennent la paix pour 800 000 dirhams, selon les anciennes conditions de Hudhayfa. Pendant ce temps, Salman ibn Rabi'a patrouillait en Arménie avec douze mille hommes. Lorsque le patricien Mawriyan avança avec quatre-vingt mille hommes, Habib ibn Maslama décida d'une attaque nocturne. Son épouse, Umm Abdallah bint Yazid, lui demanda: « Où est ton rendez-vous ? » – « au pavillon du Mawriyan » – et lorsqu'il y arriva, elle était déjà à l'intérieur, la première femme à pénétrer dans le pavillon du Mawriyan (voir: Kamil ibn al-Athir, p. 457-458)."
  ur: "جب آذربائیجان نے عتبہ بن فرقاد کی برطرفی کے معاہدے سے انکار کیا تو الولید نے وہاں مہم چلائی - 'عبداللہ ابن شبیل نے مقان اور طلسان پر چھاپہ مارا یہاں تک کہ اس کے اضلاع نے حذیفہ کی پرانی شرائط پر 800,000 درہم میں امن خرید لیا - جبکہ رابی سلیمان کے ساتھ ہزاروں درہم میں امن خرید لیا۔ جب سرپرست ماوریان اسی ہزار کے ساتھ آگے بڑھا تو حبیب ابن مسلمہ نے رات کے حملے کا عزم کیا۔ ان کی بیوی ام عبد اللہ بنت یزید نے پوچھا: \"تمہارا ٹرسٹ کہاں ہے؟\" - \"ماوریان کا برآمدہ\" - اور جب وہ وہاں پہنچے تو وہ پہلے سے ہی اندر تھی، ماوریان کے برآمدے میں پہلی عورت تھی۔ 457-458}۔"
  tr: "Ermenistan ve Azerbaycan arasındaki barış antlaşması: Osman, Utbe ibn Farqad'ı Azerbaycan'dan kovunca, Azerbaycan halkı isyan etti. Bunun üzerine el-Valid ibn Uqbah, öncü birliği Abdullah ibn Şabil el-Ahmasi önderliğinde onlara saldırdı. Muqan, el-Yabir ve el-Taylasan halkına baskın düzenleyerek onları fethetti, ganimet aldı ve esirler aldı. Azerbaycan'ın bu bölgelerinin halkı barış istedi ve o da Hudeyfe barış antlaşmasının şartlarına göre onlarla sekiz yüz bin dirhem karşılığında barış yaptı. Salman ibn Rabi'ah el-Bahili'yi on iki bin adamla Ermenistan'a gönderdi ve o da öldürdü, esir aldı ve ganimet aldı. Ermenistanlıların Morian reisi seksen bin adamla yola çıktığı haberi üzerine Habib ibn Maslamah geceleyin onlara saldırmaya karar verdi. Karısı Ümmü Abdullah bint Yazid el-Kalbiyye ona sordu: Buluşma yeriniz nerede? O da cevap verdi: Morian çadırı. Böylece geceleyin onlara saldırdı ve çadıra gitti; ancak karısının ondan önce gelmiş olduğunu gördü. Morian çadırına giren ilk kadın oydu. {cite:kamil-ibn-al-athir s. 457-458}"
  id: "Perjanjian damai antara Armenia dan Azerbaijan: Ketika Utsman mengusir Utbah ibn Farqad dari Azerbaijan, rakyatnya memberontak, sehingga al-Walid ibn Uqbah menyerang mereka, dengan Abdullah ibn Shabil al-Ahmasi sebagai pemimpin pasukannya. Ia menyerbu penduduk Muqan, al-Yabir, dan al-Taylasan, menaklukkan, mengambil rampasan perang, dan menangkap tawanan. Penduduk distrik Azerbaijan kemudian mencari perdamaian, dan ia berdamai dengan mereka berdasarkan syarat-syarat perjanjian damai Hudhayfah, yang berjumlah delapan ratus ribu dirham. Ia mengirim Salman ibn Rabi’ah al-Bahili ke Armenia dengan dua belas ribu orang, dan ia membunuh, menangkap, dan mengambil rampasan perang. Ia diberitahu bahwa kepala suku Morian dari Armeniaqs telah berangkat dengan delapan puluh ribu orang, sehingga Habib ibn Maslamah memutuskan untuk menyerang mereka di malam hari. Istrinya, Umm Abdullah bint Yazid al-Kalbiyyah, bertanya kepadanya: Di mana tempat pertemuanmu? Dia menjawab: Kemah Morian. Maka dia menyerang mereka di malam hari dan pergi ke kemah itu, hanya untuk mendapati bahwa istrinya telah tiba lebih dulu. Dialah wanita pertama yang memasuki kemah Morian. {cite:kamil-ibn-al-athir p. 457-458}"
