summary:
  ar: "صلح أرمينية وأذربيجان: لما عزل عثمان عتبة بن فرقد عن أذربيجان نقض أهلها فغزاهم الوليد بن عقبة وعلى مقدمته عبد الله بن شَبيل الأحمسي فأغار على أهل موقان واليبر والطيلسان ففتح وغنم وسبى فطلب أهل كور أذربيجان الصلح فصالحهم على صلح حذيفة وهو ثمانمائة ألف درهم، وبعث سلمان بن ربيعة الباهلي إلى أرمينية في اثني عشر ألفًا فقتل وسبى وغنم، وبلغه بطريق أرمنياقس الموريان قد توجه في ثمانين ألفًا فأجمع حبيب بن مسلمة على تبييتهم، وقالت امرأته أم عبد الله بنت يزيد الكلبية: أين موعدك؟ فقال: سرادق الموريان، فبيّتهم وأتى السرادق فوجد امرأته قد سبقته إليه فكانت أول امرأة دخلت سرادق الموريان {cite:kamil-ibn-al-athir p. 457-458}."
  en: "When Azerbaijan repudiated the treaty on 'Utba ibn Farqad's dismissal, al-Walid campaigned there — 'Abdallah ibn Shubayl raiding Muqan and the Tailsan until its districts bought peace at 800,000 dirhams on Hudhayfa's old terms — while Salman ibn Rabi'a ranged Armenia with twelve thousand. When the patrician Mawriyan advanced with eighty thousand, Habib ibn Maslama resolved on a night attack; his wife Umm 'Abdallah bint Yazid asked «where is your tryst?« — «the pavilion of the Mawriyan« — and when he reached it she was already inside, the first woman into the Mawriyan's pavilion {cite:kamil-ibn-al-athir p. 457-458}."
