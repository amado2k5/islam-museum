label: { en: "The Incident of al-Raji'", ar: "سرية الرجيع", es: "El incidente de al-Raji'", fr: "L'incident d'al-Raji'", ur: "الراجی کا واقعہ", tr: "Al-Rajee'nin Sırrı", id: "Rahasia Al-Rajee" }
summary:
  en: "In Safar 4 AH (July 625 CE), a party of ten Companions led by Asim ibn Thabit was sent as teachers following a deceptive request by the Adal and al-Qarah tribes; they were betrayed to Banu Lihyan at al-Raji', where seven were killed in combat and three taken captive."
  ar: "بعث النبي عشرة من الصحابة بقيادة عاصم بن ثابت في صفر 4هـ مع عضل والقارة ليفقهوهم، فغدروا بهم واستصرخوا بني لحيان عند ماء الرجيع؛ فقاتل عاصم وستة معه حتى استشهدوا وحمت الدبر جثمان عاصم، وأُسر خبيب بن عدي وزيد بن الدثنة فبيعوا بمكة لقريش وقُتلا بها."
  es: "En Safar 4 AH (julio de 625 d. C.), un grupo de diez Compañeros liderados por Asim ibn Thabit fue enviado como maestros tras una petición engañosa de las tribus Adal y al-Qarah; fueron traicionados y entregados a Banu Lihyan en al-Raji', donde siete murieron en combate y tres fueron hechos prisioneros."
  fr: "En Safar 4 AH (juillet 625 CE), un groupe de dix Compagnons dirigé par Asim ibn Thabit fut envoyé comme enseignants suite à une demande trompeuse des tribus Adal et al-Qarah; ils furent trahis aux Banu Lihyan à al-Raji', où sept furent tués au combat et trois faits prisonniers."
  ur: "صفر 4 ہجری ⁦(جولائی 625 عیسوی)⁩ میں، عاصم بن ثابت کی قیادت میں دس صحابہ کی ایک جماعت کو عدل اور قرہ قبائل کی ایک فریب آمیز درخواست پر اساتذہ کے طور پر بھیجا گیا۔ انہیں راجی کے مقام پر بنو لحیان کے حوالے کر دیا گیا، جہاں سات جنگ میں مارے گئے اور تین کو قید کر لیا گیا۔"
  tr: "Peygamberimiz, Hicri 4. Safer ayında, Asim bin Sabit önderliğindeki on sahabeyi, Adal ve Kara'yı da yanlarına alarak onlara öğretmeleri için gönderdi. Ancak onlar, Raci'nin suyunda Beni Lahyan'dan yardım isteyerek sahabelere ihanet ettiler. Asim ve altı kişi daha onunla savaştı ve şehit oldular. Asim'in bedeni boynuzlar tarafından korundu. Hubeyb bin Adi ve Zeyd bin Dasna ise yakalanarak Mekke'de Kureyş'e satıldılar ve orada öldürüldüler."
  id: "Nabi mengutus sepuluh sahabat, dipimpin oleh Asim bin Thabit, pada bulan Safar tahun 4 H, bersama Adal dan Al-Qara untuk mengajari mereka. Mereka mengkhianati mereka dan meminta bantuan dari Bani Lahyan di sungai Al-Raji’. Asim dan enam orang lainnya berperang bersamanya hingga mereka gugur sebagai syahid. Tanduk-tanduk itu melindungi jenazah Asim. Khubayb bin Adi dan Zayd bin Al-Dathna ditangkap dan dijual di Mekah kepada kaum Quraisy dan dibunuh di sana."
