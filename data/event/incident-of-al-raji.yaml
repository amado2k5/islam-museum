label: { en: "The Incident of al-Raji'", ar: "سرية الرجيع" }
summary:
  en: "In Safar 4 AH (July 625 CE), a party of ten Companions led by Asim ibn Thabit was sent as teachers following a deceptive request by the Adal and al-Qarah tribes; they were betrayed to Banu Lihyan at al-Raji', where seven were killed in combat and three taken captive."
  ar: "بعث النبي عشرة من الصحابة بقيادة عاصم بن ثابت في صفر 4هـ مع عضل والقارة ليفقهوهم، فغدروا بهم واستصرخوا بني لحيان عند ماء الرجيع؛ فقاتل عاصم وستة معه حتى استشهدوا وحمت الدبر جثمان عاصم، وأُسر خبيب بن عدي وزيد بن الدثنة فبيعوا بمكة لقريش وقُتلا بها."
