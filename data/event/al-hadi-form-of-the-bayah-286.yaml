label:
  ar: صيغة بيعة الهادي إلى الحق كما رواها محمد بن عبيد الله
  en: The form of al-Hadi's pledge of allegiance as Muhammad ibn Ubaydallah describes it
  ur: ہادی کی بیعت کی صورت جیسا محمد بن عبید اللہ نے بیان کیا
  es: "La forma del juramento de lealtad de al-Hadi tal como lo describe Muhammad ibn Ubaydallah."
  fr: "La forme du serment d'allégeance d'al-Hadi telle que Muhammad ibn Ubaydallah la décrit."
  tr: "Muhammed ibn Ubeyd Allah'ın rivayet ettiği üzere, hakikate yol gösterene biat etme formülü"
  id: "Rumus kesetiaan kepada penunjuk jalan kebenaran, sebagaimana diriwayatkan oleh Muhammad ibn Ubayd Allah"
summary:
  ar: سأل علي بن محمد أباه كيف كان الهادي يبايع الناس، فأجابه أنه كان يأخذ بيد الرجل فيستتيبه قبل أن يبايعه بدعاء توبة، ثم يأخذ عليه عهداً أن ينصره ويقوم بالحق معه ويأمر بالمعروف وينهى عن المنكر ويأخذ الحق ممن وجب عليه قريباً كان أو بعيداً، شريفاً أو دنياً، وأن يطيعه ما أطاع الله فإذا عصاه فلا طاعة له عليه، ثم يقول اللهم اشهد ويتلو آية بيعة الشجرة.
  en: Ali ibn Muhammad asked his father how al-Hadi took the pledge of the people, and he answered that al-Hadi took the man by the hand and first had him repent, with a prayer of repentance, then took his covenant that he would support him, stand for the right with him, command good and forbid wrong, take the right from whoever owed it, near or far, noble or humble, and obey him so long as he obeyed God, and that if he disobeyed God there would be no obedience owed to him; he then said "O God, bear witness" and recited a verse on those who pledge to the Prophet.
  ur: علی بن محمد نے اپنے والد سے پوچھا کہ ہادی لوگوں سے بیعت کیسے لیتے تھے، تو انہوں نے بتایا کہ ہادی آدمی کا ہاتھ پکڑ کر بیعت سے پہلے اسے توبہ کی دعا پڑھاتے، پھر اس سے عہد لیتے کہ وہ ان کی مدد کرے گا، حق کے ساتھ ان کے ساتھ کھڑا ہو گا، نیکی کا حکم دے گا اور برائی سے روکے گا، جس پر حق واجب ہو اس سے حق لے گا خواہ قریب ہو یا دور، شریف ہو یا ادنیٰ، اور ان کی اطاعت کرے گا جب تک وہ اللہ کی اطاعت کریں اور جب وہ اس کی نافرمانی کریں تو ان کی اطاعت اس پر نہیں؛ پھر وہ کہتے اے اللہ گواہ رہ اور بیعت کرنے والوں کے بارے میں آیت پڑھتے۔
  es: "Ali ibn Muhammad preguntó a su padre cómo al-Hadi tomó el juramento de la gente, y este respondió que al-Hadi tomó al hombre de la mano y primero lo hizo arrepentirse, con una oración de arrepentimiento, luego tomó su pacto de que lo apoyaría, defendería la justicia con él, ordenaría el bien y prohibiría el mal, tomaría el derecho de quien lo debiera, cercano o lejano, noble o humilde, y lo obedecería mientras obedeciera a Dios, y que si desobedecía a Dios no habría obediencia para él; luego dijo \"¡Oh Dios, sé testigo!\" y recitó un versículo sobre aquellos que hacen un juramento al Profeta."
  fr: "Ali ibn Muhammad demanda à son père comment al-Hadi avait reçu l'engagement des gens, et celui-ci répondit qu'al-Hadi avait pris l'homme par la main et l'avait d'abord amené à se repentir, par une prière de repentir, puis avait reçu son engagement de le soutenir, de défendre le droit avec lui, d'ordonner le bien et d'interdire le mal, de prendre le droit à quiconque le devait, proche ou lointain, noble ou humble, et de lui obéir tant qu'il obéirait à Dieu, et que s'il désobéissait à Dieu, il ne lui serait plus dû d'obéissance; il disait alors: « Ô Dieu, sois témoin » et récitait un verset sur ceux qui prêtent serment au Prophète."
  tr: "Ali bin Muhammed babasına, Hadi'nin insanlara nasıl biat ettiğini sordu. Babası şöyle cevap verdi: \"Hadi, bir adamın elini tutar, tövbe etmesini ister, sonra tövbe duasıyla ona biat ederdi. Ardından ondan, kendisine destek olacağına, onunla birlikte hakikati savunacağına, iyiliği emredip kötülüğü yasaklayacağına, yakın veya uzak, soylu veya sıradan olsun, kimden iyilik yapması gerekiyorsa ondan iyilik alacağına ve Allah'a itaat ettiği sürece ona itaat edeceğine, ama isyan ederse ona itaat etmeyeceğine dair söz alırdı. Sonra da 'Ey Allah'ım, şahit ol!' der ve Kâbe Nimetini okurdu.\""
  id: "Ali bin Muhammad bertanya kepada ayahnya bagaimana al-Hadi biasa berbaiat kepada orang-orang, dan ayahnya menjawab bahwa al-Hadi akan memegang tangan seseorang dan memintanya untuk bertaubat sebelum berbaiat kepadanya dengan doa taubat, kemudian al-Hadi akan meminta sumpah dari orang tersebut untuk mendukungnya, menegakkan kebenaran bersamanya, memerintahkan yang benar dan melarang yang salah, dan mengambil hak dari siapa pun yang berkewajiban untuk melakukannya, baik dekat maupun jauh, mulia maupun rendah, dan untuk menaatinya selama orang tersebut menaati Allah, tetapi jika orang tersebut tidak menaatinya, maka al-Hadi tidak berkewajiban untuk menaatinya. Kemudian al-Hadi akan berkata, “Ya Allah, saksikanlah,” dan membacakan ayat Baitullah."
