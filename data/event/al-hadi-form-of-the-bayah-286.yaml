label:
  ar: صيغة بيعة الهادي إلى الحق كما رواها محمد بن عبيد الله
  en: The form of al-Hadi's pledge of allegiance as Muhammad ibn Ubaydallah describes it
  ur: ہادی کی بیعت کی صورت جیسا محمد بن عبید اللہ نے بیان کیا
summary:
  ar: سأل علي بن محمد أباه كيف كان الهادي يبايع الناس، فأجابه أنه كان يأخذ بيد الرجل فيستتيبه قبل أن يبايعه بدعاء توبة، ثم يأخذ عليه عهداً أن ينصره ويقوم بالحق معه ويأمر بالمعروف وينهى عن المنكر ويأخذ الحق ممن وجب عليه قريباً كان أو بعيداً، شريفاً أو دنياً، وأن يطيعه ما أطاع الله فإذا عصاه فلا طاعة له عليه، ثم يقول اللهم اشهد ويتلو آية بيعة الشجرة.
  en: Ali ibn Muhammad asked his father how al-Hadi took the pledge of the people, and he answered that al-Hadi took the man by the hand and first had him repent, with a prayer of repentance, then took his covenant that he would support him, stand for the right with him, command good and forbid wrong, take the right from whoever owed it, near or far, noble or humble, and obey him so long as he obeyed God, and that if he disobeyed God there would be no obedience owed to him; he then said "O God, bear witness" and recited a verse on those who pledge to the Prophet.
  ur: علی بن محمد نے اپنے والد سے پوچھا کہ ہادی لوگوں سے بیعت کیسے لیتے تھے، تو انہوں نے بتایا کہ ہادی آدمی کا ہاتھ پکڑ کر بیعت سے پہلے اسے توبہ کی دعا پڑھاتے، پھر اس سے عہد لیتے کہ وہ ان کی مدد کرے گا، حق کے ساتھ ان کے ساتھ کھڑا ہو گا، نیکی کا حکم دے گا اور برائی سے روکے گا، جس پر حق واجب ہو اس سے حق لے گا خواہ قریب ہو یا دور، شریف ہو یا ادنیٰ، اور ان کی اطاعت کرے گا جب تک وہ اللہ کی اطاعت کریں اور جب وہ اس کی نافرمانی کریں تو ان کی اطاعت اس پر نہیں؛ پھر وہ کہتے اے اللہ گواہ رہ اور بیعت کرنے والوں کے بارے میں آیت پڑھتے۔
