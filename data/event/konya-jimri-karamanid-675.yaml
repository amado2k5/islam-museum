id: event/konya-jimri-karamanid-675
class: event
kind: conquest
label: { ar: "القرمانيون يحتلون قونية وينصّبون جمري، ٦٧٥هـ", en: "The Karamanids occupy Konya and install Jimri, 675/1277", ur: "کرمانیوں کا قونیہ پر قبضہ اور جمری کا تنصیب، 675ھ/1277ء", es: "Los karamánidas ocupan Konya e instalan a Jimri, 675/1277", fr: "Les Karamanides occupent Konya et installent Jimri, 675/1277", tr: "Karamanoğulları Konya'yı işgal edip Cemre'yi yerleştirirler, H. 675", id: "Karamanids menduduki Konya dan menginstal Cemre, 675 H" }
summary:
  ar: "في سنوات ٦٧٥–٦٧٧هـ/١٢٧٧–١٢٧٨م احتل القرمانيون قونية مؤقتًا قادمين من جبال طوروس الغربية، ونصّبوا فيها سلجوقيًا زائفًا عُرف بجمري؛ وكانت هذه أول حلقة في انتقال مراكز النشاط السياسي عن قونية مع قيام الحماية المغولية على الأناضول السلجوقي {cite:encyclopaedia-of-islam-2 vol. 5.1 pp. 287-288}."
  en: "In 675-677/1277-78 the Karamanids of the western Taurus temporarily occupied Konya and installed there a bogus Seljuk known as Jimri — the first episode in the shift of political centres away from Konya as the Mongol protectorate settled over Seljuk Anatolia {cite:encyclopaedia-of-islam-2 vol. 5.1 pp. 287-288}."
  ur: "675–677ھ/1277–78ء میں مغربی طوروس کے کرمانیوں نے قونیہ پر عارضی قبضہ کیا اور وہاں جمری نام کے جعلی سلجوقی کو براجمان کیا — منگولوں کے زیرِ سایہ سلجوقی اناطولیہ میں قونیہ سے سیاسی مراکز کے منتقل ہونے کا یہ پہلا واقعہ تھا۔"
  es: "En 675-677/1277-78, los karamánidas del Tauro occidental ocuparon temporalmente Konya e instalaron allí a un falso selyúcida conocido como Jimri, el primer episodio en el desplazamiento de los centros políticos desde Konya a medida que el protectorado mongol se establecía sobre la Anatolia selyúcida {cite:encyclopaedia-of-islam-2 vol. 5.1 pp. 287-288}."
  fr: "En 675-677/1277-78, les Karamanides du Taurus occidental occupèrent temporairement Konya et y installèrent un faux Seldjoukide connu sous le nom de Jimri — le premier épisode du déplacement des centres politiques de Konya alors que le protectorat mongol s'installait sur l'Anatolie seldjoukide {cite:encyclopaedia-of-islam-2 vol. 5.1 pp. 287-288}."
  tr: "Hicri 675-677/Miladi 1277-1278 yıllarında, Batı Toros Dağları'ndan gelen Karamanlılar geçici olarak Konya'yı işgal etmiş ve Cemri adında sahte bir Selçuklu kurmuşlardır. Bu, Moğol korumasının Selçuklu Anadolu'sunda kurulmasıyla birlikte siyasi faaliyet merkezlerinin Konya'dan uzaklaştırılmasının ilk halkası olmuştur. {cite:encyclopaedia-of-islam-2 vol. 5.1 pp. 287-288}"
  id: "Pada tahun 675–677 H/1277–1278 M, Dinasti Karamanid untuk sementara menduduki Konya, datang dari Pegunungan Taurus bagian barat, dan menempatkan seorang Seljuk palsu di sana yang dikenal sebagai Cemri. Ini adalah mata rantai pertama dalam perpindahan pusat-pusat aktivitas politik dari Konya seiring dengan berdirinya perlindungan Mongol atas Anatolia Seljuk {cite:encyclopaedia-of-islam-2 vol. 5.1 pp. 287-288}."
