label: { ar: "القرمانيون يحتلون قونية وينصّبون جمري، ٦٧٥هـ", en: "The Karamanids occupy Konya and install Jimri, 675/1277", ur: "کرمانیوں کا قونیہ پر قبضہ اور جمری کا تنصیب، 675ھ/1277ء" }
summary:
  ar: "في سنوات ٦٧٥–٦٧٧هـ/١٢٧٧–١٢٧٨م احتل القرمانيون قونية مؤقتًا قادمين من جبال طوروس الغربية، ونصّبوا فيها سلجوقيًا زائفًا عُرف بجمري؛ وكانت هذه أول حلقة في انتقال مراكز النشاط السياسي عن قونية مع قيام الحماية المغولية على الأناضول السلجوقي {cite:encyclopaedia-of-islam-2 vol. 5.1 pp. 287-288}."
  en: "In 675-677/1277-78 the Karamanids of the western Taurus temporarily occupied Konya and installed there a bogus Seljuk known as Jimri — the first episode in the shift of political centres away from Konya as the Mongol protectorate settled over Seljuk Anatolia {cite:encyclopaedia-of-islam-2 vol. 5.1 pp. 287-288}."
  ur: "675–677ھ/1277–78ء میں مغربی طوروس کے کرمانیوں نے قونیہ پر عارضی قبضہ کیا اور وہاں جمری نام کے جعلی سلجوقی کو براجمان کیا — منگولوں کے زیرِ سایہ سلجوقی اناطولیہ میں قونیہ سے سیاسی مراکز کے منتقل ہونے کا یہ پہلا واقعہ تھا۔"
