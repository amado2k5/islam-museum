label: { ar: "تقليد بهاء الدولة إمرة العراق 379هـ", en: "Baha' al-Dawla invested with the emirate, 379" }
summary:
  ar: "لما توفي شرف الدولة في جمادى الأولى سنة تسع وسبعين وثلثمائة عهد إلى ولده أبي نصر أحمد، فاجتمع العسكر وطالبوا برسم البيعة، وترددت المراسلات بين أبي نصر والطائع حتى حلف كل واحد منهما لصاحبه على صدق الطوية وصحة العقيدة، وركب الطائع لله الطيار إلى دار الملكة بالكرخ معزياً فقبّل أبو نصر الأرض ثلاثاً، ويوم السبت عاشر جمادى الآخرة ركب إلى حضرة الطائع فخلع عليه الخلع السلطانية وقلّده لواءين ولقّبه بهاء الدولة وضياء الملة، وسار العسكر كله بين يديه إلى باب الشماسية، وأقرّ الوزير أبا منصور ابن صالحان على الوزارة {cite:muntazam-ibn-al-jawzi j.7 p.148-149}."
  en: "On Sharaf al-Dawla's death in Jumada I 379 the army demanded the accession bounty from his son Abu Nasr Ahmad; after exchanges and mutual oaths of sincere intent, al-Ta'i' came by boat to Dar al-Mamlaka at the Karkh to condole, and on Saturday 10 Jumada II the young emir rode to the caliph's presence, received the sultanic robes and two standards and the laqabs Baha' al-Dawla wa-Diya' al-Milla, the whole army marching before him to Bab al-Shammasiyya, while Abu Mansur Ibn Salihan was confirmed as wazir {cite:muntazam-ibn-al-jawzi j.7 p.148-149}."
