summary:
  ar: "لما توفي شرف الدولة في جمادى الأولى سنة تسع وسبعين وثلثمائة عهد إلى ولده أبي نصر أحمد، فاجتمع العسكر وطالبوا برسم البيعة، وترددت المراسلات بين أبي نصر والطائع حتى حلف كل واحد منهما لصاحبه على صدق الطوية وصحة العقيدة، وركب الطائع لله الطيار إلى دار الملكة بالكرخ معزياً فقبّل أبو نصر الأرض ثلاثاً، ويوم السبت عاشر جمادى الآخرة ركب إلى حضرة الطائع فخلع عليه الخلع السلطانية وقلّده لواءين ولقّبه بهاء الدولة وضياء الملة، وسار العسكر كله بين يديه إلى باب الشماسية، وأقرّ الوزير أبا منصور ابن صالحان على الوزارة {cite:muntazam-ibn-al-jawzi j.7 p.148-149}."
  en: "On Sharaf al-Dawla's death in Jumada I 379 the army demanded the accession bounty from his son Abu Nasr Ahmad; after exchanges and mutual oaths of sincere intent, al-Ta'i' came by boat to Dar al-Mamlaka at the Karkh to condole, and on Saturday 10 Jumada II the young emir rode to the caliph's presence, received the sultanic robes and two standards and the laqabs Baha' al-Dawla wa-Diya' al-Milla, the whole army marching before him to Bab al-Shammasiyya, while Abu Mansur Ibn Salihan was confirmed as wazir {cite:muntazam-ibn-al-jawzi j.7 p.148-149}."
  fr: "À la mort de Sharaf al-Dawla en Jumada I 379, l'armée réclama la gratification d'avènement à son fils Abu Nasr Ahmad ; après des échanges et des serments mutuels de sincérité, al-Ta'i' vint en barque au Dar al-Mamlaka, à Karkh, présenter ses condoléances, et le samedi 10 Jumada II le jeune émir se rendit en présence du calife, reçut les robes sultaniennes, deux étendards et les titres Baha' al-Dawla wa-Diya' al-Milla, toute l'armée marchant devant lui jusqu'à Bab al-Shammasiyya, tandis qu'Abu Mansur Ibn Salihan était confirmé comme vizir {cite:muntazam-ibn-al-jawzi j.7 p.148-149}."
  es: "A la muerte de Sharaf al-Dawla en Jumada I 379, el ejército exigió la recompensa por la ascensión al trono a su hijo Abu Nasr Ahmad; después de intercambios y juramentos mutuos de sincera intención, al-Ta'i' llegó en barco a Dar al-Mamlaka en Karkh para dar el pésame, y el sábado 10 de Jumada II el joven emir cabalgó hasta la presencia del califa, recibió las túnicas sultánicas y dos estandartes y los laqabs Baha' al-Dawla wa-Diya' al-Milla, todo el ejército marchando delante de él hacia Bab al-Shammasiyya, mientras que Abu Mansur Ibn Salihan fue confirmado como visir {cite:muntazam-ibn-al-jawzi j.7 p.148-149}."
  ur: "جمادی الثانی 379 میں شرف الدولہ کی موت پر فوج نے ان کے بیٹے ابو نصر احمد سے الحاق کے فضل کا مطالبہ کیا۔ خلوص نیت کے تبادلے اور باہمی حلف کے بعد، الطائی کشتی کے ذریعے کرخ کے دار المملکہ میں تعزیت کے لیے آیا، اور ہفتہ 10 جمادی الثانی کو نوجوان امیر خلیفہ کی موجودگی میں سوار ہوا، اس نے سلطانی لباس اور دو معیارات وصول کیے اور لاقبس بہاء الدولہ، پوری فوج کے سامنے پیش کیا۔ باب الشمسیہ، جبکہ ابو منصور ابن صالحان کی تصدیق وزیر کے طور پر کی گئی ہے۔"
  tr: "Şaraf el-Davla, Hicri 379 yılının Cemâde el-Ula ayında vefat ettiğinde, halifeliği oğlu Ebu Nasr Ahmed'e emanet etti. Ordu toplandı ve resmi biat yemini istedi. Ebu Nasr ile el-Tai' arasında yazışmalar yapıldı ve her ikisi de birbirlerine niyetlerinin samimiyeti ve inançlarının doğruluğu konusunda yemin ettiler. El-Tai' taziyelerini sunmak için Kerkh'taki Kraliçe Sarayı'na gitti ve Ebu Nasr üç kez yere öpücük kondurdu. Cemâde el-Ahire'nin onuncu günü olan Cumartesi günü, El-Tai'nin huzuruna gitti; El-Tai ona kraliyet kıyafetlerini verdi, iki sancak bahşetti ve ona Baha' el-Davla ve Diya' el-Milla unvanlarını verdi. Tüm ordu onun önünde Bab el-Şamasiya'ya yürüdü ve Ebu Mansur İbn Salihan'ı vezir olarak onayladı."
  id: "Ketika Sharaf al-Dawla wafat pada bulan Jumada al-Ula tahun 379 H, beliau mempercayakan kekhalifahan kepada putranya, Abu Nasr Ahmad. Pasukan berkumpul dan meminta sumpah setia secara resmi. Surat-menyurat terjalin antara Abu Nasr dan al-Ta’i’ hingga masing-masing bersumpah kepada yang lain tentang ketulusan niat dan kebenaran keyakinan. Al-Ta’i’ pergi ke Istana Ratu di al-Karkh untuk menyampaikan belasungkawa, dan Abu Nasr mencium tanah tiga kali. Pada hari Sabtu, tanggal sepuluh Jumada al-Akhira, beliau menghadap al-Ta’i’, yang menganugerahinya jubah kerajaan, memberinya dua panji, dan memberinya gelar Baha’ al-Dawla dan Diya’ al-Milla. Seluruh pasukan berbaris di hadapannya ke Bab al-Shamasiya, dan beliau mengukuhkan wazir Abu Mansur Ibn Salihan sebagai wazir."
