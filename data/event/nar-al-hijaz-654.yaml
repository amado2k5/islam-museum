label: { ar: "نار الحجاز سنة 654هـ", en: "The Hijaz Fire of 654 AH", es: "El incendio del Hiyaz del año 654 d. C.", fr: "L'incendie du Hedjaz de 654 AH", ur: "654ھ کی آگ حجاز" }
summary:
  ar: "زلزلة عظيمة ثم نار خرجت بأرض المدينة في جمادى الآخرة سنة 654هـ تحقيقاً لإخبار النبي بنار تخرج من أرض الحجاز تضيء لها أعناق الإبل ببصرى؛ بدأت زلزلة في مستهل جمادى الآخرة واشتدت ليلة الأربعاء ثالث الشهر حتى وقع في يوم واحد ثمانية عشر حركة على حكاية القسطلاني، ثم ظهرت النار بقَرَيْظة بطرف الحرة تجري مثل النهر أحمرَ وأزرق له دوي كدوي الرعد تدكّ الجبال، وشوهد غليانها وقيل إنها رُئيت من مكة ومن جبال بصرى، ومع قربها من المدينة كان يأتيها نسيم بارد حتى صُرفت عنها ذات الشمال عند بلوغها حرمها؛ والسد الذي أحدثته يعرفه أهل المدينة بالحَبْس {cite:samhudi-wafa-al-wafa p. 154-156}."
  en: "A great earthquake followed by an eruption of fire in the land of Medina in Jumada II 654 AH, in fulfilment of the Prophet's report of a fire issuing from the Hijaz by whose light camels' necks would be lit at Busra; tremors began at the start of the month, intensified on the night of Wednesday the 3rd until eighteen shocks struck in a single day per al-Qastallani, then the fire appeared at Qarayza at the edge of the harra, flowing like a river red and blue with a thunderous roar that levelled hills, its boiling seen for days and reportedly sighted from Mecca and the mountains of Busra; yet a cool breeze still reached Medina until it was turned aside to the north on reaching the sanctuary boundary, and the dam it left is still called al-Habs by the people of Medina {cite:samhudi-wafa-al-wafa p. 154-156}."
  es: "Un gran terremoto seguido de una erupción de fuego en la tierra de Medina en Jumada II 654 AH, en cumplimiento del informe del Profeta sobre un fuego que saldría del Hiyaz con cuya luz se encenderían los cuellos de los camellos en Busra; los temblores comenzaron al inicio del mes, se intensificaron la noche del miércoles 3 hasta que dieciocho sacudidas golpearon en un solo día según al-Qastallani, luego el fuego apareció en Qarayza en el borde de la harra, fluyendo como un río rojo y azul con un rugido atronador que arrasó colinas, su ebullición fue vista durante días y, según se dice, avistada desde La Meca y las montañas de Busra; sin embargo, una brisa fresca aún llegó a Medina hasta que fue desviada hacia el norte al llegar al límite del santuario, y la represa que dejó todavía es llamada al-Habs por la gente de Medina {cite:samhudi-wafa-al-wafa p. 154-156}."
  fr: "Un violent tremblement de terre, suivi d'un incendie, frappa Médine en Jumada II 654 AH, accomplissant ainsi la prophétie du Prophète concernant un feu jaillissant du Hedjaz et dont la lumière illuminerait le cou des chameaux à Busra. Les secousses commencèrent au début du mois et s'intensifièrent dans la nuit du mercredi 3, jusqu'à ce que, selon al-Qastallani, dix-huit secousses se produisent en une seule journée. Puis, le feu apparut à Qarayza, à la lisière de la Harra, coulant comme un fleuve rouge et bleu dans un grondement tonitruant qui rasa les collines. Son ébullition fut visible pendant des jours et aurait même été aperçue depuis La Mecque et les montagnes de Busra. Pourtant, une brise fraîche atteignit Médine jusqu'à ce qu'elle soit déviée vers le nord en atteignant les limites du sanctuaire. Le barrage ainsi formé est encore appelé al-Habs par les habitants de Médine (voir Samhudi-Wafa-Al-Wafa, p. 154-156)."
  ur: "ایک عظیم زلزلہ جس کے بعد مدینہ کی سرزمین میں آگ کے بھڑکنے کے بعد جمادی الثانی 654 ہجری میں حجاز سے آگ کے جاری ہونے کی نبی کی اطلاع کی تکمیل میں جس کی روشنی سے بصرہ میں اونٹوں کی گردنیں روشن ہوں گی۔ مہینے کے شروع میں زلزلے کے جھٹکے شروع ہوئے، بدھ کی 3 تاریخ کی رات تک شدت اختیار کرتے گئے یہاں تک کہ ایک ہی دن میں 18 جھٹکے فی القسطلانی لگے، پھر قریظہ میں آگ حرا کے کنارے پر نمودار ہوئی، سرخ اور نیلے دریا کی طرح بہتی تھی جس کی گرج کے ساتھ پہاڑوں کو برابر کر دیا گیا تھا، اس کا ابلتا ہوا دیکھا گیا تھا اور کئی دنوں تک پہاڑوں کے جھٹکے محسوس کیے جاتے تھے پھر بھی ایک ٹھنڈی ہوا مدینہ تک پہنچی یہاں تک کہ وہ حرم کی حد تک پہنچنے پر شمال کی طرف مڑ گئی اور جس ڈیم سے یہ نکلا اسے اہل مدینہ آج بھی الحبس کہتے ہیں۔ 154-156}۔"
