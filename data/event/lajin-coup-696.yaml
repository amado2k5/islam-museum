label: { ar: "انقلاب لاجين على الملك العادل كتبغا سنة 696هـ", en: "Lajin's coup against al-Adil Kitbugha, 696", es: "Golpe de Lajin contra al-Adil Kitbugha, 696", fr: "Coup d'État de Lajin contre al-Adil Kitbugha, 696", ur: "العادل کتبغہ کے خلاف لاجن کی بغاوت، 696", tr: "Lajin'in Hicri 696 yılında Kral Adil Kitbugha'ya karşı gerçekleştirdiği darbe.", id: "Kudeta Lajin terhadap Raja Al-Adil Kitbugha pada tahun 696 Hijriah" }
summary:
  ar: "في سنة ست وتسعين توجه الملك العادل كتبغا إلى مصر، فلما كان باللجون وثب حسام الدين لاجين المنصوري على بيحاص وبكتوت الأزرق — جناحي أستاذهما العادل — فقتلهما، فخاف العادل وركب سراً في أربعة مماليك وساق إلى دمشق فدخل القلعة فلم ينفعه ذلك وزال ملكه، وخضع المصريون لحسام الدين ولم يختلف عليه اثنان ولُقّب بالملك المنصور، وأُخذ العادل تحت الحوطة فأسكن بقلعة صرخد وقنع بها {cite:shadharat-dhahab p. 758}."
  en: "In 696 al-Malik al-Adil Kitbugha set out for Egypt. When he reached al-Lajjun, Husam al-Din Lajin al-Mansuri fell upon Bayhas and Baktut al-Azraq, the two wings of their master al-Adil, and killed them. Al-Adil took fright and rode out secretly with four mamluks, making for Damascus, where he entered the citadel; it did him no good, and his rule came to an end. The Egyptians submitted to Husam al-Din, and no two of them disagreed over him; he was given the title al-Malik al-Mansur. Al-Adil was placed under restraint and lodged in the citadel of Salkhad, where he was content to remain {cite:shadharat-dhahab p. 758}."
  es: "En 696, al-Malik al-Adil Kitbugha partió hacia Egipto. Al llegar a al-Lajjun, Husam al-Din Lajin al-Mansuri atacó a Bayhas y Baktut al-Azraq, los dos flancos de su señor al-Adil, y los asesinó. Al-Adil, atemorizado, huyó clandestinamente con cuatro mamelucos hacia Damasco, donde entró en la ciudadela; sin embargo, no le sirvió de nada y su reinado llegó a su fin. Los egipcios se sometieron a Husam al-Din, y todos se mostraron de acuerdo con él; se le otorgó el título de al-Malik al-Mansur. Al-Adil fue puesto bajo arresto y alojado en la ciudadela de Salkhad, donde permaneció conforme {cite:shadharat-dhahab p. 758}."
  fr: "En 696, al-Malik al-Adil Kitbugha partit pour l'Égypte. Arrivé à al-Lajjun, il fut tué par Husam al-Din Lajin al-Mansuri qui s'attaqua à Bayhas et Baktut al-Azraq, les deux bras droits de leur maître al-Adil. Pris de panique, al-Adil s'enfuit secrètement avec quatre mamelouks et se dirigea vers Damas, où il pénétra dans la citadelle. Ce fut en vain, et son règne prit fin. Les Égyptiens se soumirent à Husam al-Din, et aucun ne contesta son autorité; il reçut le titre d'al-Malik al-Mansur. Al-Adil fut placé sous tutelle et incarcéré dans la citadelle de Salkhad, où il demeura paisiblement (voir: shadharat-dhahab, p. 758)."
  ur: "696 میں الملک العادل کتبغہ مصر کے لیے روانہ ہوا۔ جب وہ لاجون پہنچا تو حسام الدین لاجین المنصوری اپنے آقا العادل کے دو بازو بیہاس اور بکتوت الازرق پر گرا اور انہیں قتل کر دیا۔ العادل خوف زدہ ہوا اور چار مملوکوں کے ساتھ چپکے سے نکل کر دمشق کی طرف نکلا، جہاں وہ قلعہ میں داخل ہوا۔ اس سے اس کا کوئی فائدہ نہیں ہوا، اور اس کی حکومت ختم ہو گئی۔ مصریوں نے حسام الدین کے سامنے سر تسلیم خم کیا اور ان میں سے کسی نے بھی اس پر اختلاف نہیں کیا۔ انہیں المالک المنصور کا لقب دیا گیا۔ العادل کو قید میں رکھا گیا اور سلخد کے قلعہ میں رکھا گیا، جہاں وہ رہنے پر راضی تھا۔ 758}۔"
  tr: "Doksan altı yılında Kral Adil Kitbugha Mısır'a gitti. Lajun'dayken, Husam Din Lajin Mansur, efendileri Adil'in iki kanadı olan Bihas ve Baktut Azrak'a saldırdı ve onları öldürdü. Adil korktu ve gizlice dört Memlükle birlikte Şam'a gitti. Kaleye girdi, ancak bu ona yardımcı olmadı ve krallığı elinden gitti. Mısırlılar Husam Din'e boyun eğdiler ve hiç kimse onunla anlaşmazlığa düşmedi; ona Kral Mansur unvanı verildi. Adil kuşatıldı ve Sarhad kalesine yerleşti ve bundan memnun kaldı. {cite:shadharat-dhahab s. 758}"
  id: "Pada tahun sembilan puluh enam, Raja Al-Adil Kitbugha pergi ke Mesir. Ketika ia berada di Al-Lajun, Husam Al-Din Lajin Al-Mansuri menyerang Bihas dan Baktut Al-Azraq — dua sayap tuannya Al-Adil — dan membunuh mereka. Al-Adil ketakutan dan diam-diam berkuda bersama empat Mamluk dan pergi ke Damaskus. Ia memasuki benteng, tetapi itu tidak membantunya, dan kerajaannya jatuh. Orang Mesir tunduk kepada Husam Al-Din, dan tidak ada dua orang yang menentangnya, dan ia diberi gelar Raja Al-Mansur. Al-Adil dikepung dan menetap di benteng Sarhad, dan ia merasa puas dengan itu. {cite:shadharat-dhahab p. 758}"
