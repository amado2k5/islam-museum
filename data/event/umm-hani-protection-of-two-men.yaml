label: { ar: "أمان أم هانئ لرجلين من بني مخزوم يوم الفتح", en: "Umm Hani gives protection to two men on the day of the conquest", es: "Umm Hani brinda protección a dos hombres el día de la conquista.", fr: "Umm Hani offre sa protection à deux hommes le jour de la conquête", ur: "ام ہانی فتح کے دن دو آدمیوں کو تحفظ فراہم کرتی ہیں۔", tr: "Amān Umm Hanī’, fetih günü Banu Makhzūm kabilesinden iki kişiye koruma sağladı.", id: "Amān Umm Hanī’ memberikan perlindungan kepada dua orang dari Banu Makhzūm pada hari penaklukan." }
summary:
  ar: "يوم فتح مكة لجأ إلى بيت أم هانئ بنت أبي طالب رجلان من أقاربها من بني مخزوم، فدخل عليها علي يريد قتلهما، فأغلقت الباب عليهما وذهبت إلى النبي وهو بأعلى مكة يغتسل، فقال: قد أمّنّا من أمّنتِ، وأجاز أمانها."
  tr: "Mekke'nin fethi günü, Beni Makhzum kabilesinden iki akrabası Ümmü Hani bint Ebu Talib'in evine sığındı. Ali onları öldürmek niyetiyle içeri girdi, bu yüzden Ümmü Hani kapıyı kilitledi ve Mekke'nin yukarısında banyo yapmakta olan Peygamber'in yanına gitti. Peygamber, \"Kime koruma sağladıysan, biz de ona koruma sağladık\" dedi ve Ümmü Hani'nin koruma sağlamasını onayladı."
  id: "Pada hari penaklukan Mekah, dua orang dari kerabatnya dari klan Banu Makhzum mencari perlindungan di rumah Umm Hani bint Abi Talib. Ali masuk dengan maksud membunuh mereka, sehingga Umm Hani mengunci pintu dan pergi menemui Nabi yang sedang mandi di bagian atas Mekah. Nabi bersabda: \"Kami telah memberikan perlindungan kepada siapa pun yang kamu beri perlindungan,\" dan beliau menyetujui pemberian perlindungan yang diberikan Umm Hani."
