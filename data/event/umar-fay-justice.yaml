label: { ar: "أمانة عمر في الفيء", en: "Umar's Trust in the Fay'", es: "La confianza de Umar en las hadas", fr: "La confiance d'Umar dans les fées", ur: "عمر کا فے پر بھروسہ" }
summary:
  ar: "كتب عمر إلى حذيفة أن أعط الناس أرزاقهم فكتب إليه أنا قد فعلنا وبقي شيء كثير فكتب إليه إنه فيهم الذي أفاءه الله عليهم ليس هو لعمر ولا لآل عمر فاقسمه بينهم وقدم أبو هريرة من البحرين بخمس مائة ألف فلما ثبت عنده الرقم قال للناس إنه قدم علينا مال كثير فإن شئتم أن نعده لكم عدداً وإن شئتم أن نكيله لكم كيلاً فقال له رجل يا أمير المؤمنين إني قد رأيت هؤلاء الأعاجم يدونون ديواناً يعطون الناس عليه فدون الديوان وفرض للمهاجرين الأولين في خمسة آلاف وللأنصار في أربعة آلاف ولأزواج النبي في اثني عشر ألفاً وكان يقول إنما هو حقهم وأنا أسعد بأدائه إليهم لو كان من مال الخطاب ما أعطيتهموه ولكن قد علمت أن فيه فضلاً فلو أنه إذا خرج عطاء أحد هؤلاء ابتاع منه غنماً فجعلها بسوادهم فإذا خرج عطاؤه ثانية ابتاع الرأس والرأسين فجعلها فيها فإن بقي أحد من ولده كان لهم شيء قد اعتقدوه فإني لا أدري ما يكون بمدي وإني لأعم بنصيحتي من طوقني الله أمره فإن رسول الله قال من مات غاشاً لرعيته لم يرح ريح الجنة وألحق كل مولود ذكر أو أنثى في مائة وجريبين في كل شهر."
  en: "Umar wrote Hudhayfa to pay the people their rizq; 'done — and much remains' came the answer, and his: 'it is theirs — the fay' God gave them — not Umar's nor Al Umar's — divide it among them'. Abu Hurayra brought five hundred thousand from Bahrayn — 'much money has come: shall we count it or weigh it?' — and a man said 'I have seen these Ajam keep a diwan they pay the people by'; so Umar wrote the diwan: first Muhajirun five thousand, Ansar four thousand, the Prophet's wives twelve thousand. 'It is their right — had it been Khattab-money I'd not have given it, but I know there is surplus: let each stipend buy sheep for his sawad, then rams, till his children hold a substance' — and 'I counsel whom God charges: the Prophet said who dies cheating his flock will not smell paradise'. Every newborn, boy or girl, was registered for a hundred and two jaribs a month."
  es: "Umar escribió a Hudhayfa para que pagara al pueblo su rizq; la respuesta fue: «Hecho, y aún queda mucho», y la suya: «Es de ellos, el fay' que Dios les dio, no de Umar ni de Al Umar; repártelo entre ellos». Abu Hurayra trajo quinientos mil de Bahrayn: «Ha llegado mucho dinero: ¿lo contamos o lo pesamos?», y un hombre dijo: «He visto a estos Ajam mantener un diwan con el que pagan al pueblo»; entonces Umar escribió el diwan: primero los Muhajirun cinco mil, los Ansar cuatro mil, las esposas del Profeta doce mil. «Es su derecho; si hubiera sido dinero de Khattab no lo habría dado, pero sé que hay excedente: que cada estipendio compre ovejas para su sawad, luego carneros, hasta que sus hijos tengan sustento», y «Aconsejo a quien Dios manda: el Profeta dijo que quien muere engañando a su rebaño no olerá el paraíso». A cada recién nacido, niño o niña, se le registraba para ciento dos jaribs al mes."
  fr: "Umar écrivit à Hudhayfa pour que le peuple reçoive son rizq. « C’est fait, et il en reste beaucoup », fut la réponse. Et lui: « C’est à eux, le fay que Dieu leur a donné, pas à Umar ni à Al Umar. Répartissez-le entre eux. » Abu Hurayra apporta cinq cent mille de Bahrayn. « Il y a beaucoup d’argent: devons-nous le compter ou le peser ? » Un homme dit: « J’ai vu ces Ajam tenir un diwan pour payer le peuple. » Umar écrivit donc le diwan: d’abord cinq mille aux Muhajirun, quatre mille aux Ansar, douze mille aux épouses du Prophète. « C’est leur droit. S’il s’agissait d’argent du Khattab, je ne l’aurais pas donné, mais je sais qu’il y a un surplus. Que chaque allocation serve à acheter des moutons pour sa sawad, puis des béliers, jusqu’à ce que ses enfants possèdent des biens. » Et: « Je conseille à qui Dieu impose une charge: le Prophète a dit que celui qui meurt en ayant trompé son troupeau ne sentira pas le paradis. » Chaque nouveau-né, garçon ou fille, était enregistré pour cent deux jaribs par mois."
  ur: "عمر نے لوگوں کو ان کا رزق ادا کرنے کے لیے حذیفہ کو لکھا۔ 'ہو گیا - اور بہت کچھ باقی ہے' جواب آیا، اور اس کا: 'یہ ان کا ہے - فے' خدا نے انہیں دیا - نہ عمر کا اور نہ عمر کا - ان میں تقسیم کر دو۔ ابو ہریرہ بحرین سے پانچ لاکھ لے کر آئے - 'بہت رقم آ گئی ہے، ہم اسے گنیں یا تولیں؟' - اور ایک آدمی نے کہا کہ میں نے ان عجم کو دیوان رکھتے دیکھا ہے جس سے وہ لوگوں کو ادا کرتے ہیں۔ چنانچہ عمر نے دیوان لکھا: پہلے مہاجرین پانچ ہزار، انصار چار ہزار، ازواجِ رسول بارہ ہزار۔ 'یہ ان کا حق ہے - اگر یہ خطبہ کی رقم ہوتی تو میں اسے نہ دیتا، لیکن میں جانتا ہوں کہ اس میں اضافی ہے: ہر ایک وظیفہ اپنے صاد کے لیے بھیڑ خریدے، پھر مینڈھے، جب تک کہ اس کے بچوں کے پاس کوئی چیز نہ ہو' - اور 'میں اسے مشورہ دیتا ہوں جس پر خدا الزام لگاتا ہے: نبی نے فرمایا جو اپنے ریوڑ کو دھوکہ دے کر مر جائے وہ جنت کی خوشبو نہیں پائے گا'۔ ہر نوزائیدہ لڑکا ہو یا لڑکی ہر ماہ ایک سو دو جریب کے حساب سے رجسٹرڈ ہوتا تھا۔"
