label: { ar: "مقتل موسى بن عبد الله بن خازم", en: "The Killing of Musa ibn Abdallah ibn Khazim", es: "El asesinato de Musa ibn Abdallah ibn Khazim", fr: "Le meurtre de Musa ibn Abdallah ibn Khazim", ur: "موسیٰ بن عبداللہ ابن خزیم کا قتل", tr: "Musa ibn Abdullah ibn Hazim'in öldürülmesi", id: "Pembunuhan Musa bin Abdullah bin Khazim" }
summary:
  ar: "عزل يزيد بن المهلب وتولى المفضل بن المهلب خراسان فوجه عثمان بن مسعود فسار حتى نزل جزيرة بالترمذ تدعى اليوم جزيرة عثمان وهو في خمسة عشر ألفاً فضيق على موسى وكتب إلى طرخون فقدم عليه فلما رأى موسى الذي ورد عليه خرج من المدينة وقال لأصحابه الذين خلفهم فيها إن قتلت فادفعوا المدينة إلى مدرك بن المهلب ولا تدفعوها إلى ابن مسعود وحال الترك والسغد بين موسى والحصن وعثر به فرسه فسقط فارتدف خلف مولى له وجعل يقول الموت كريه فنظر إليه عثمان فقال وثبة موسى ورب الكعبة وقصد له حتى سقط ومولاه فانطووا عليه فقتلوه وقتل أصحابه فلم ينج منهم غير أرقية بن الحرفانة دفعه إلى خالد بن أبي برزة الأسلمي وكان الذي أجهز على موسى واصل بن طيسلة العنبري ودفعت المدينة إلى مدرك بن المهلب وكان قتله في آخر سنة ٨٥ وضرب رجل ساق موسى وهو قتيل فلما ولى قتيبة قتله."
  en: "Al-Mufaddal sent Uthman ibn Mas'ud with fifteen thousand, who camped on the island still called Jazirat Uthman, pressed Musa, and summoned Tarkhun. Seeing the forces arrive, Musa left the city charging his men: 'if I am killed, yield it to Mudrik ibn al-Muhallab, never to Ibn Mas'ud'. Turks and Sughd cut him off, his horse stumbled, he mounted behind a mawla crying 'death is bitter'; Uthman marked him — 'Musa's leap, by the Lord of the Ka'ba!' — drove him down, and they surrounded and slew him and his company save Irqiya ibn al-Harfana, spared to Khalid ibn Abi Barza. Wasil ibn Taysala al-Anbari struck the final blow; the city went to Mudrik — it was the end of 85h — and the man who struck dead Musa's leg was himself killed by Qutayba."
  es: "Al-Mufaddal envió a Uthman ibn Mas'ud con quince mil hombres, que acamparon en la isla aún llamada Jazirat Uthman, presionaron a Musa y llamaron a Tarkhun. Al ver llegar a las fuerzas, Musa salió de la ciudad ordenando a sus hombres: «Si me matan, entréguenla a Mudrik ibn al-Muhallab, nunca a Ibn Mas'ud». Los turcos y los Sughd le cortaron el paso, su caballo tropezó, montó detrás de un mawla gritando «la muerte es amarga»; Uthman lo marcó —«¡Salto de Musa, por el Señor de la Kaaba!»— lo derribó, y lo rodearon y lo mataron a él y a su compañía, excepto a Irqiya ibn al-Harfana, perdonado a Khalid ibn Abi Barza. Wasil ibn Taysala al-Anbari asestó el golpe final; La ciudad pasó a manos de Mudrik —era el final del año 85— y el hombre que mató a Musa de un golpe en la pierna fue asesinado a su vez por Qutayba."
  fr: "Al-Mufaddal envoya Uthman ibn Mas'ud avec quinze mille hommes, qui campèrent sur l'île encore appelée Jazirat Uthman, pressèrent Musa et appelèrent Tarkhun. Voyant arriver les troupes, Musa quitta la ville en chargeant ses hommes: « Si je suis tué, remettez-moi la vie entre les mains de Mudrik ibn al-Muhallab, jamais entre celles d'Ibn Mas'ud ! » Les Turcs et les Sughd le coupèrent, son cheval trébucha, il monta derrière un mawla en criant: « La mort est amère ! »; Uthman le repéra — « Le saut de Musa, par le Seigneur de la Kaaba ! » — le fit tomber, et ils l'encerclèrent et le tuèrent avec sa compagnie, à l'exception d'Irqiya ibn al-Harfana, épargné et remis à Khalid ibn Abi Barza. Wasil ibn Taysala al-Anbari porta le coup final. La ville est passée à Mudrik — c'était la fin de l'année 85 — et l'homme qui avait mortellement frappé la jambe de Musa a été lui-même tué par Qutayba."
  ur: "المفضل نے عثمان بن مسعود کو پندرہ ہزار کے ساتھ بھیجا، جنہوں نے جزیرے پر ڈیرے ڈالے جو اب بھی جزیرۃ عثمان کہلاتا ہے، موسیٰ کو دبایا اور ترخون کو بلایا۔ فوجوں کو آتے دیکھ کر موسیٰ نے اپنے آدمیوں کو یہ کہتے ہوئے شہر چھوڑ دیا کہ اگر میں مارا جاؤں تو اسے مدرک ابن المحلب کے حوالے کر دینا، ابن مسعود کے حوالے نہیں کرنا۔ ترک اور سغد نے اسے کاٹ دیا، اس کا گھوڑا لڑکھڑا گیا، وہ ایک مولا کے پیچھے سوار ہو کر پکار رہا تھا کہ موت کڑوی ہے۔ عثمان نے اسے نشان زد کیا - 'موسیٰ کی چھلانگ، رب کعبہ کی قسم!' - نے اسے نیچے اتار دیا، اور انہوں نے اسے اور اس کے ساتھی کو گھیر کر قتل کر دیا، سوائے ارقیہ بن الحرفانہ کے، خالد بن ابی برزہ کو چھوڑ دیا گیا۔ واصل ابن تیسلہ الانباری نے آخری ضرب لگائی۔ شہر مدرک چلا گیا - یہ 85ھ کے آخر میں تھا - اور جس شخص نے موسیٰ کی ٹانگ ماری تھی وہ خود قتیبہ کے ہاتھوں مارا گیا تھا۔"
  tr: "Yezid ibn el-Muhallab görevden alındı ve el-Mufaddal ibn el-Muhallab Horasan'ın yönetimini devraldı. Osman ibn Mesud'u gönderdi; Osman, on beş bin adamıyla Tirmizi'deki, bugün Osman Adası olarak bilinen bir adaya kadar yürüdü. Musa'ya baskı yaptı ve Tarhun'a mektup yazdı; Tarhun da ona geldi. Musa, başına gelenleri görünce şehri terk etti ve geride bıraktığı arkadaşlarına, \"Eğer öldürülürsem, şehri Mudrik ibn el-Muhallab'a verin, İbn Mesud'a vermeyin\" dedi. Türkler ve Soğdlar Musa ile kale arasında durdular ve atı tökezleyip düştü. Hizmetkarının arkasına bindi ve \"Ölüm nefret uyandırıcıdır\" demeye başladı. Osman ona baktı ve \"Musa'nın sıçrayışı, Kâbe'nin Rabbine yemin olsun!\" dedi. O ve hizmetkarı yere düşene kadar peşinden gittiler ve onu ve arkadaşlarını kuşatıp öldürdüler. Arkayye ibn el-Harfana dışında hiçbiri kurtulamadı; o da Musa'yı Halid ibn Abi Barza el-Aslami'ye teslim etti. Musa'yı öldüren ise Vasil ibn Taysala el-Anbari idi ve şehir Mudrik ibn el-Muhallab'a teslim edildi. Mudrik, 85 yılının sonunda öldürüldü. Bir adam, Musa ölü haldeyken bacağına vurdu ve Kuteybe yönetimi devralınca o adamı öldürdü."
  id: "Yazid ibn al-Muhallab dipecat, dan al-Mufaddal ibn al-Muhallab mengambil alih Khurasan. Ia mengutus Utsman ibn Masoud, yang berbaris hingga mencapai sebuah pulau di al-Tirmidz, yang sekarang disebut Pulau Utsman, dengan lima belas ribu orang. Ia menekan Musa dan menulis surat kepada Tarkhun, yang kemudian datang menemuinya. Ketika Musa melihat apa yang telah terjadi padanya, ia meninggalkan kota dan berkata kepada para sahabatnya yang ditinggalkannya di sana, “Jika aku terbunuh, serahkan kota ini kepada Mudrik ibn al-Muhallab dan jangan serahkan kepada Ibn Masoud.” Orang-orang Turki dan Sogdia berdiri di antara Musa dan benteng, dan kudanya tersandung dan ia jatuh. Ia menunggang kuda di belakang pelayannya dan mulai berkata, “Kematian itu menjijikkan.” Utsman memandanginya dan berkata, “Lompatan Musa, demi Tuhan Ka'bah!” Dia mengejar Musa hingga Musa dan pelayannya jatuh, lalu mereka mengepungnya dan membunuh Musa beserta para pengikutnya. Tak seorang pun dari mereka lolos kecuali Arqayyah ibn al-Harfana, yang menyerahkan Musa kepada Khalid ibn Abi Barza al-Aslami. Orang yang menghabisi Musa adalah Wasil ibn Taysala al-Anbari, dan kota itu diserahkan kepada Mudrik ibn al-Muhallab. Dia terbunuh pada akhir tahun 85. Seorang pria memukul kaki Musa saat dia sudah mati, dan ketika Qutaybah mengambil alih, dia membunuhnya."
