id: event/death-of-al-jarrah
class: event
kind: battle
label: { ar: "استشهاد الجرّاح بأردبيل", en: "The Death of al-Jarrah at Ardabil", es: "La muerte de al-Jarrah en Ardabil", fr: "La mort d'al-Jarrah à Ardabil", ur: "اردبیل میں الجراح کی موت" }
summary:
  ar: "عند البلاذري: صالح الجرّاح أهل حمزين على نقلهم إلى خيزان وجعل لهم قريتين منه واوقع بأهل غوميك وسبى منهم ثم قفل فنزل شكّى وشتّى جنده ببرذعة والبيلقان، وجاشت الخزر وعبرت الرسّ فعادبهم في صحراء ورثان ثم انحازوا إلى ناحية أردبيل فواقعهم على أربعة فراسخ مما يلي أرمينية فاقتتلوا ثلاثة أيام فاستشهد ومن معه فسُمّي ذلك النهر نهر الجرّاح ونُسب جسر عليه إلى الجرّاح أيضاً."
  en: "In al-Baladhuri: al-Jarrah compounded with the people of Hamzin to transfer them to Khizan, giving them two of its villages, fell upon the people of Ghumik taking captives, returned to Shakki and wintered his army at Bardha'a and al-Baylaqan; the Khazars then surged across the Rass, and he gave them battle in the Warthan desert, whence they fell back toward Ardabil — he engaged them four farsakhs from Armenia's edge, they fought three days, and he was martyred with those with him; that river was named Nahr al-Jarrah, and a bridge upon it was likewise ascribed to him."
  es: "En al-Baladhuri: al-Jarrah se alió con la gente de Hamzin para trasladarlos a Khizan, dándoles dos de sus aldeas, atacó a la gente de Ghumik tomando prisioneros, regresó a Shakki e invernó a su ejército en Bardha'a y al-Baylaqan; los jázaros cruzaron entonces el Rass, y él les presentó batalla en el desierto de Warthan, desde donde se replegaron hacia Ardabil; los enfrentó a cuatro farsakhs del borde de Armenia, lucharon durante tres días, y él fue martirizado junto con los que estaban con él; ese río fue llamado Nahr al-Jarrah, y un puente sobre él también se le atribuyó a él."
  fr: "Dans al-Baladhuri: al-Jarrah s’allia avec les habitants de Hamzin pour les transférer à Khizan, leur cédant deux de ses villages; il attaqua ensuite les habitants de Ghumik, faisant des prisonniers; puis il retourna à Shakki et hiverna son armée à Bardha’a et al-Baylaqan; les Khazars traversèrent alors le Rass, et il leur livra bataille dans le désert de Warthan, d’où ils se replièrent vers Ardabil — il les affronta à quatre farsakhs de la frontière arménienne, le combat dura trois jours, et il fut martyrisé avec ses compagnons; cette rivière fut nommée Nahr al-Jarrah, et un pont sur celle-ci lui fut également attribué."
  ur: "البلادوری میں ہے: الجراح نے ہمزین کے لوگوں کے ساتھ مل کر انہیں خزان منتقل کیا، انہیں اس کے دو گاؤں دیے، غمیک کے لوگوں پر اسیر ہو کر شکی واپس آیا اور بردعہ اور البیلقان میں اپنی فوج کو سردیوں میں گزارا۔ خزر اس کے بعد راس کے پار بڑھے، اور اس نے ان کو صحرائے وارتھن میں جنگ دی، جہاں سے وہ اردبیل کی طرف واپس گرے - اس نے آرمینیا کے کنارے سے ان کو چار فرسخ سے جوڑ دیا، وہ تین دن لڑے، اور وہ اپنے ساتھ والوں کے ساتھ شہید ہو گیا۔ اس دریا کا نام نہر الجراح تھا اور اس پر ایک پل بھی اسی سے منسوب تھا۔"
