label:
  ar: "انتقال بني فضل الله إلى كتابة السر بالقاهرة، ٧٢٩هـ/١٣٢٩م"
  en: "The Ibn Fadl Allah family moves to the Cairo chancery, 729/1329"
  ur: "بنو فضل اللہ کا قاہرہ دیوان میں منتقلی، 729ھ/1329ء"
summary:
  ar: "لما ولي محيي الدين يحيى بن فضل الله رئاسة ديوان الإنشاء وكتابة السر بالقاهرة سنة ٧٢٩هـ/١٣٢٩م بعد دمشق، بدأ ابنه شهاب الدين أحمد حياته الوظيفية معينًا لأبيه وهو يكبر في السن {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  en: "When Muhyi al-Din Yahya ibn Fadl Allah was made head of the chancery and katib al-sirr at Cairo in 729/1329 after Damascus, his son Shihab al-Din Ahmad began his public career as an assistant to his ageing father {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}."
  ur: "جب محی الدین یحیی بن فضل اللہ 729ھ/1329ء میں دمشق کے بعد قاہرہ میں دیوانِ انشا کا سربراہ اور کاتبِ سر مقرر ہوا تو اس کا بیٹا شہاب الدین احمد نے اپنے عمر رسیدہ والد کے معاون کے طور پر عہدہ دارانہ زندگی کا آغاز کیا {cite:encyclopaedia-of-islam-2 vol. 3 pp. 790-791}۔"
