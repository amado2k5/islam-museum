id: event/expedition-of-banu-al-nadir
education:
  did_you_know:
    ar: "في ربيع الأول ٤هـ تآمر بنو النضير على إلقاء رحى على النبي، فحاصرهم المسلمون ست ليالٍ حتى قذف الله في قلوبهم الرعب فنزلوا على الجلاء وحملوا ما أقلت الإبل إلا السلاح."
    en: "In Rabi' I of year 4, Banu al-Nadir plotted to drop a millstone on the Prophet; the Muslims besieged them six nights until fear entered their hearts — they accepted exile and carried off what camels bore, save arms."
    ur: "سن ۴ھ میں بنو نضیر نے نبی پر پتھر گرانے کی سازش کی؛ مسلمانوں نے چھ رات محاصرہ کیا تو انہوں نے جلاوطنی قبول کی اور ہتھیاروں کے سوا جو اونٹ اٹھا سکے لے گئے۔"
    sources: [source/mubarakpuri-raheeq, source/ibn-hisham-sira]
class: event
kind: siege
label: { en: "The Siege and Expulsion of Banu al-Nadir", ar: "غزوة بني النضير" }
summary:
  en: "In Rabi' I 4 AH (August 625 CE), following Banu al-Nadir's attempt to assassinate the Prophet by dropping a millstone and their conspiracy with the hypocrites, the Muslims besieged their fortresses for six nights until they surrendered and were exiled to Khaybar and Syria, leaving behind weapons and heavy armour. وعند البخاري يروي عمر أن أرض بني النضير كانت من صفايا النبي «حبساً لنوائبه» فأبقاها صدقة بعد موته، وفيها خصومة العباس وعلي عند عمر {cite:sahih-al-bukhari 4033}."
  ar: "في ربيع الأول 4هـ (أغسطس 625م)، تآمر بنو النضير على إلقاء رحى على النبي وهو جالس إلى جدارهم لطلب دية العامريين، فحاصرهم المسلمون ست ليالٍ بعد تحصنهم بوعود عبد الله بن أبيّ، حتى قذف الله في قلوبهم الرعب فنزلوا على الجلاء وحملوا ما أقلت الإبل إلا السلاح."
