id: event/expedition-of-banu-al-nadir
education:
  did_you_know:
    ar: "في ربيع الأول ٤هـ تآمر بنو النضير على إلقاء رحى على النبي، فحاصرهم المسلمون ست ليالٍ حتى قذف الله في قلوبهم الرعب فنزلوا على الجلاء وحملوا ما أقلت الإبل إلا السلاح."
    en: "In Rabi' I of year 4, Banu al-Nadir plotted to drop a millstone on the Prophet; the Muslims besieged them six nights until fear entered their hearts — they accepted exile and carried off what camels bore, save arms."
    ur: "سن ۴ھ میں بنو نضیر نے نبی پر پتھر گرانے کی سازش کی؛ مسلمانوں نے چھ رات محاصرہ کیا تو انہوں نے جلاوطنی قبول کی اور ہتھیاروں کے سوا جو اونٹ اٹھا سکے لے گئے۔"
    sources: [source/mubarakpuri-raheeq, source/ibn-hisham-sira]
class: event
kind: siege
label: { en: "The Siege and Expulsion of Banu al-Nadir", ar: "غزوة بني النضير", es: "El asedio y la expulsión de Banu al-Nadir", fr: "Le siège et l'expulsion des Banu al-Nadir", ur: "بنو النضیر کا محاصرہ اور بے دخلی" }
summary:
  en: "In Rabi' I 4 AH (August 625 CE), following Banu al-Nadir's attempt to assassinate the Prophet by dropping a millstone and their conspiracy with the hypocrites, the Muslims besieged their fortresses for six nights until they surrendered and were exiled to Khaybar and Syria, leaving behind weapons and heavy armour. وعند البخاري يروي عمر أن أرض بني النضير كانت من صفايا النبي «حبساً لنوائبه» فأبقاها صدقة بعد موته، وفيها خصومة العباس وعلي عند عمر {cite:sahih-al-bukhari 4033}."
  ar: "في ربيع الأول 4هـ ⁦(أغسطس 625م)⁩، تآمر بنو النضير على إلقاء رحى على النبي وهو جالس إلى جدارهم لطلب دية العامريين، فحاصرهم المسلمون ست ليالٍ بعد تحصنهم بوعود عبد الله بن أبيّ، حتى قذف الله في قلوبهم الرعب فنزلوا على الجلاء وحملوا ما أقلت الإبل إلا السلاح."
  es: "En Rabi' I del año 4 de la Hégira (agosto de 625 d. C.), tras el intento de asesinato del Profeta por parte de Banu al-Nadir arrojándole una piedra de molino y su conspiración con los hipócritas, los musulmanes sitiaron sus fortalezas durante seis noches hasta que se rindieron y fueron exiliados a Khaybar y Siria, dejando atrás armas y armaduras pesadas. Al-Bujari narra que Umar afirmó que la tierra de Banu al-Nadir era propiedad privada del Profeta, «reservada para sus necesidades», y que la conservó como caridad tras su muerte. Antes de Umar, hubo una disputa entre Al-Abbas y Ali respecto a esta tierra. {cite:sahih-al-bukhari 4033}"
  fr: "En Rabi' I 4 AH (août 625), suite à la tentative d'assassinat du Prophète par les Banu al-Nadir, qui avaient jeté une meule de moulin, et à leur conspiration avec les hypocrites, les musulmans assiégèrent leurs forteresses pendant six nuits jusqu'à leur reddition. Ils furent alors exilés à Khaybar et en Syrie, abandonnant armes et armures lourdes. Al-Bukhari rapporte qu'Umar déclara que les terres des Banu al-Nadir figuraient parmi les biens privés du Prophète, « détenues en fiducie pour ses besoins », et qu'il les conserva en aumône après sa mort. Un différend concernant ces terres opposa al-Abbas et Ali avant l'arrivée d'Umar. {cite:sahih-al-bukhari 4033}"
  ur: "ربیع الثانی 4 ہجری ⁦(اگست 625 عیسوی)⁩ میں بنو النضیر کی طرف سے چکی کا پتھر گرا کر نبی کو قتل کرنے کی کوشش اور منافقین کے ساتھ ان کی سازش کے بعد، مسلمانوں نے چھ راتوں تک ان کے قلعوں کا محاصرہ کیا یہاں تک کہ وہ ہتھیار ڈال کر خیبر اور شام کی طرف جلاوطن ہو گئے، اپنے پیچھے ہتھیار اور بھاری ہتھیار چھوڑ گئے۔ البخاری بیان کرتے ہیں کہ عمر نے کہا کہ بنو النضیر کی زمین رسول اللہ کی ذاتی ملکیت میں سے تھی، جو ان کی ضروریات کے لیے امانت میں رکھی گئی تھی، اور آپ نے اسے اپنی وفات کے بعد صدقہ کر دیا۔ حضرت عمر سے پہلے اس زمین کے بارے میں عباس اور علی کے درمیان جھگڑا تھا۔ {حوالہ: صحیح البخاری 4033}"
