summary:
  ar: "هزم طغرل بك وأخوه چغري بك جيش السلطان مسعود الغزنوي عند دندانقان قرب مرو سنة 1040م، ففتحت السلاجقة بهذا النصر خراسان وقامت دولتهم {cite:kamil-ibn-al-athir}."
  en: "Tughril Beg and his brother Chaghri Beg broke Sultan Masʿud of Ghazna's army at Dandanqan near Merv in 1040 — the victory that won the Seljuks Khurasan and founded their state {cite:kamil-ibn-al-athir}."
  ur: "طغرل بیگ اور اس کے بھائی چغری بیگ نے 1040ء میں مرو کے قریب دندانقان میں سلطان مسعود غزنوی کی فوج کو شکست دی — اس فتح سے سلجوقوں نے خراسان فتح کیا اور ان کی ریاست قائم ہوئی {cite:kamil-ibn-al-athir}."
  es: "Tughril Beg y su hermano Chaghri Beg derrotaron al ejército del sultán Masʿud de Ghazna en Dandanqan, cerca de Merv, en 1040; esta victoria les dio a los selyúcidas Jorasán y fundó su estado {cite:kamil-ibn-al-athir}."
  fr: "Tughril Beg et son frère Chaghri Beg ont brisé l'armée du sultan Mas'ud de Ghazna à Dandanqan près de Merv en 1040 — la victoire qui a permis aux Seldjoukides de gagner le Khorasan et de fonder leur État {cite:kamil-ibn-al-athir}."
