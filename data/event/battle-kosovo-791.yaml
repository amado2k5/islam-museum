label: { ar: "وقعة قوصوه الأولى واستشهاد مراد الأول", en: "The first battle of Kosovo and the martyrdom of Murad I", fr: "La première bataille de Kosovo et le martyre de Murad Ier", es: "La primera batalla de Kosovo y el martirio de Murad I", ur: "کوسوو کی پہلی جنگ اور مراد اول کی شہادت", tr: "Kosova'nın Birinci Savaşı ve I. Murad'ın Şehitliği", id: "Pertempuran Kosovo Pertama dan Kemartiran Murad I" }
summary:
  ar: "وصل السلطان مراد الأول بجيوشه إلى منطقة كوسوفو في البلقان، ونشب القتال بين الجمعين وحمي وطيسه وانجلت الحرب عن انتصار المسلمين انتصاراً باهراً حاسماً. وبعد الانتصار قام السلطان يتفقد ساحة المعركة يدور بنفسه بين صفوف القتلى من المسلمين يدعو لهم ويتفقد الجرحى، وفي أثناء ذلك قام جندي من الصرب كان قد تظاهر بالموت فأسرع نحو السلطان فتمكن الحرس من القبض عليه، لكنه تظاهر بأنه جاء يريد محادثة السلطان وأن يعلن إسلامه على يديه، فأشار السلطان للحرس بأن يطلقوه فتظاهر بأنه يريد تقبيل يد السلطان وأخرج في حركة سريعة خنجراً مسموماً طعن به السلطان فاستشهد في ١٥ شعبان سنة ٧٩١هـ بعد أن بلغ من العمر خمساً وستين عاماً. ومن كلماته الأخيرة: أطيعوا ابني يزيد ولا تعذبوا الأسرى ولا تؤذوهم ولا تسلبوهم، وأودعكم منذ هذه اللحظة وأودع جيشنا الظافر العظيم إلى رحمة الله {cite:dawlat-uthmaniyya-salabi p. 60-61}."
  en: "Kosovo 1389 — the Ottomans' decisive Balkan victory, after which a Serbian soldier feigning death then conversion stabbed Sultan Murad I with a poisoned dagger as he walked the battlefield among the Muslim dead (15 Sha'ban 791) {cite:dawlat-uthmaniyya-salabi p. 60-61}."
  fr: "Kosovo, 1389 : la victoire balkanique décisive des Ottomans, après laquelle un soldat serbe, feignant la mort puis la conversion, poignarda le sultan Murad Ier avec une dague empoisonnée alors qu'il parcourait le champ de bataille parmi les morts musulmans (15 Sha'ban 791) {cite:dawlat-uthmaniyya-salabi p. 60-61}."
  es: "Kosovo 1389: la decisiva victoria de los otomanos en los Balcanes, tras la cual un soldado serbio fingiendo su muerte y luego su conversión apuñaló al sultán Murad I con una daga envenenada mientras caminaba por el campo de batalla entre los muertos musulmanes (15 Sha'ban 791) {cite:dawlat-uthmaniyya-salabi p. 60-61}."
  ur: "کوسوو 1389 - عثمانیوں کی فیصلہ کن بلقان فتح، جس کے بعد موت کا دعویٰ کرنے والے ایک سربیائی سپاہی نے سلطان مراد اول کو زہر آلود خنجر سے وار کیا جب وہ مسلمانوں کے درمیان میدان جنگ میں چل رہے تھے ⁦(15 شعبان 791)⁩ {حوالہ: دولت عثمانیہ صلابی ص۔ 60-61}۔"
  tr: "Sultan Murad I, ordularıyla Balkanlar'daki Kosova bölgesine geldi. İki taraf arasında şiddetli bir savaş yaşandı ve bu savaş, Müslümanların ezici ve kesin zaferiyle sonuçlandı. Zaferden sonra Sultan, savaş alanını inceledi, ölen Müslümanların safları arasında bizzat yürüdü, onlar için dua etti ve yaralılara baktı. Bu sırada, ölü taklidi yapan bir Sırp askeri Sultan'a doğru koştu. Muhafızlar onu yakalamayı başardılar, ancak asker Sultan'la konuşmak ve onun eliyle İslam'ı kabul ettiğini ilan etmek istiyormuş gibi davrandı. Sultan muhafızlara onu serbest bırakmaları için işaret verdi. Bunun üzerine asker, Sultan'ın elini öpmek istiyormuş gibi davrandı ve hızlı bir hareketle zehirli bir hançer çekerek Sultan'ı bıçakladı. Sultan, 15 Şaban 791 Hicri yılında, altmış beş yaşında şehit oldu. Son sözleri arasında şunlar da vardı: \"Oğlum Yezid'e itaat et. Esirlere işkence etme, onlara zarar verme ve onları soyma. Bu andan itibaren, seni ve büyük muzaffer ordumuzu Allah'ın rahmetine bırakıyorum.\" {cite:dawlat-uthmaniyya-salabi s. 60-61}"
  id: "Sultan Murad I tiba bersama pasukannya di wilayah Kosovo di Balkan. Pertempuran sengit terjadi antara kedua pihak, yang berpuncak pada kemenangan telak dan menentukan bagi kaum Muslim. Setelah kemenangan tersebut, Sultan memeriksa medan perang, secara pribadi berjalan di antara barisan korban tewas Muslim, mendoakan mereka dan merawat yang terluka. Pada saat itu, seorang tentara Serbia, yang telah berpura-pura mati, bergegas menuju Sultan. Para pengawal berhasil menangkapnya, tetapi ia berpura-pura ingin berbicara dengan Sultan dan menyatakan bahwa ia telah memeluk Islam di tangan Sultan. Sultan memberi isyarat kepada para pengawal untuk melepaskannya. Tentara itu kemudian berpura-pura ingin mencium tangan Sultan, dan dengan gerakan cepat, ia mengeluarkan belati beracun dan menikam Sultan, yang gugur sebagai syahid pada tanggal 15 Sya'ban 791 H, pada usia enam puluh lima tahun. Di antara kata-kata terakhirnya adalah: \"Taatilah putraku Yazid. Jangan menyiksa para tawanan, jangan menyakiti mereka, dan jangan merampok mereka. Mulai saat ini, aku mengucapkan selamat tinggal kepadamu dan pasukan kita yang besar dan berjaya kepada rahmat Allah.\" {cite:dawlat-uthmaniyya-salabi p. 60-61}"
