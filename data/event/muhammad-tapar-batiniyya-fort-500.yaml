label: { ar: "أخذ السلطان محمد بن ملكشاه قلعة الباطنية بأصبهان وقتل ابن عطاش سنة 500", en: "Sultan Muhammad ibn Malikshah takes the Batiniyya fortress at Isfahan and kills Ibn Attash in 500", es: "El sultán Muhammad ibn Malikshah toma la fortaleza de Batiniyya en Isfahan y mata a Ibn Attash en 500.", fr: "Le sultan Muhammad ibn Malikshah prend la forteresse Batiniyya à Ispahan et tue Ibn Attash en 500.", ur: "سلطان محمد بن مالک شاہ نے اصفہان کے قلعہ بطینیہ پر قبضہ کیا اور 500 میں ابن عطاش کو قتل کر دیا۔" }
summary:
  ar: "في سنة خمسمائة غزا السلطان محمد بن ملكشاه الباطنية وأخذ قلعتهم بأصبهان وقتل صاحبها أحمد بن عبد الملك بن عطاش وكان قد تملكها اثنتي عشرة سنة، وهي من بناء ملكشاه بناها على رأس جبل وأنفق عليها مائتي ألف دينار {cite:shadharat-dhahab p. 410}."
  en: "In 500 Sultan Muhammad b. Malikshah campaigned against the Batiniyya, took their fortress at Isfahan, and killed its master Ahmad b. Abd al-Malik b. Attash, who had held it twelve years; the castle, built by Malikshah atop a mountain for two hundred thousand dinars {cite:shadharat-dhahab p. 410}."
  es: "En el año 500, el sultán Muhammad b. Malikshah emprendió una campaña contra los Batiniyya, tomó su fortaleza en Isfahán y mató a su señor Ahmad b. Abd al-Malik b. Attash, quien la había gobernado durante doce años; el castillo, construido por Malikshah en la cima de una montaña por doscientos mil dinares {cite:shadharat-dhahab p. 410}."
  fr: "En 500, le sultan Muhammad b. Malikshah fit campagne contre les Batiniyya, prit leur forteresse d'Ispahan et tua son maître Ahmad b. Abd al-Malik b. Attash, qui la détenait depuis douze ans; le château, construit par Malikshah au sommet d'une montagne pour deux cent mille dinars {cite:shadharat-dhahab p. 410}."
  ur: "500 میں سلطان محمد بن۔ ملک شاہ نے بطنیہ کے خلاف مہم چلائی، اصفہان پر ان کے قلعے پر قبضہ کر لیا اور اس کے آقا احمد بن کو قتل کر دیا۔ عبد الملک بی۔ عطاش، جس نے اسے بارہ سال تک رکھا تھا۔ وہ قلعہ جو ملک شاہ نے پہاڑ پر دو لاکھ دینار میں تعمیر کروایا تھا 410}۔"
