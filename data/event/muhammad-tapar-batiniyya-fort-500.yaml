summary:
  ar: "في سنة خمسمائة غزا السلطان محمد بن ملكشاه الباطنية وأخذ قلعتهم بأصبهان وقتل صاحبها أحمد بن عبد الملك بن عطاش وكان قد تملكها اثنتي عشرة سنة، وهي من بناء ملكشاه بناها على رأس جبل وأنفق عليها مائتي ألف دينار {cite:shadharat-dhahab p. 410}."
  en: "In 500 Sultan Muhammad b. Malikshah campaigned against the Batiniyya, took their fortress at Isfahan, and killed its master Ahmad b. Abd al-Malik b. Attash, who had held it twelve years; the castle, built by Malikshah atop a mountain for two hundred thousand dinars {cite:shadharat-dhahab p. 410}."
