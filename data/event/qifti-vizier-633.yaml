label:
  ar: "الملك العزيز يستوزر القفطي بحلب، ٦٣٣هـ"
  en: "Al-Malik al-Aziz appoints al-Qifti vizier of Aleppo, 633/1236"
  ur: "ملک عزیز نے قفطی کو حلب کا وزیر بنایا، 633ھ/1236ء"
  es: "Al-Malik al-Aziz nombra a al-Qifti visir de Alepo, 633/1236"
  fr: "Al-Malik al-Aziz nomme al-Qifti vizir d'Alep, 633/1236"
  tr: "Kral El-Aziz, El-Kifti'yi H. 633'te Halep'e vezir olarak atadı"
  id: "Raja Al-Aziz menunjuk Al-Qifti sebagai wazirnya di Aleppo, 633 H."
summary:
  ar: "استوزر الملك العزيز محمد القفطيَ سنة ثلاث وثلاثين وستمائة {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}؛ وتوفي العزيز في ربيع الأول ٦٣٤هـ وخلفه ابنه الطفل الناصر يوسف {cite:wafayat-ayan}."
  en: "Al-Malik al-Aziz Muhammad appointed al-Qifti vizier in 633/1236 {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}; al-Aziz died in Rabi' I 634, leaving his child al-Nasir Yusuf as heir {cite:wafayat-ayan}."
  ur: "ملک عزیز محمد نے 633ھ/1236ء میں قفطی کو وزیر مقرر کیا {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}؛ عزیز کا ربیع الاول 634ھ میں انتقال ہوا اور ان کے خوردسال بیٹے ناصر یوسف جانشیں ہوئے {cite:wafayat-ayan}۔"
  es: "Al-Malik al-Aziz Muhammad nombró visir a al-Qifti en 633/1236 {cita:encyclopaedia-of-islam-2 vol. 3 p. 872}; al-Aziz murió en Rabi' I 634, dejando a su hijo al-Nasir Yusuf como heredero {cita:wafayat-ayan}."
  fr: "Al-Malik al-Aziz Muhammad a nommé vizir d'al-Qifti en 633/1236 {cite:encyclopaedia-of-islam-2 vol. 15h. 872}; al-Aziz est mort en Rabi' I 634, laissant son enfant al-Nasir Yusuf comme héritier {cite: wafayat-ayan}."
  tr: "Kral Aziz, Hicri 633 yılında Muhammed Kıfti'yi veziri olarak atadı {kaynak:encyclopaedia-of-islam-2 cilt 3 s. 872}; ve Aziz, Hicri 634 yılının Rebiü'l-Evvel ayında vefat etti ve yerine çocuk oğlu Nasır Yusuf geçti {kaynak:wafayat-ayan}."
  id: "Raja Al-Aziz mengangkat Muhammad Al-Qifti sebagai menterinya pada tahun 633 H {cite:encyclopaedia-of-islam-2 vol. 3 p. 872}; dan Al-Aziz wafat pada bulan Rabi’ al-Awwal 634 H dan digantikan oleh putranya yang masih anak-anak, Al-Nasir Yusuf {cite:wafayat-ayan}."
