summary:
  ar: "يوم أممي يُحيا في 15 مارس من كل سنة، أقرّته الجمعية العامة للأمم المتحدة بتوافق الآراء في 15 مارس 2022 بقرار قدمته باكستان باسم منظمة التعاون الإسلامي؛ اختير التاريخ ذكرى لهجوم مسجدي كرايستشيرش سنة 2019."
  en: "A United Nations observance on 15 March every year, proclaimed by the General Assembly by consensus on 15 March 2022 in a resolution introduced by Pakistan on behalf of the Organisation of Islamic Cooperation; the date is the anniversary of the 2019 Christchurch mosque shootings."
  ur: "ہر سال 15 مارچ کو اقوامِ متحدہ کا دن، جسے جنرل اسمبلی نے 15 مارچ 2022 کو اتفاقِ رائے سے منظور کیا؛ قرارداد پاکستان نے او آئی سی کی جانب سے پیش کی اور تاریخ 2019 کے کرائسٹ چرچ مسجد حملوں کی یاد میں چنی گئی۔"
