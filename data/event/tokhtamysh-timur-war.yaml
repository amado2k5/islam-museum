summary:
  ar: "بطاقة أولية لحرب توقتمش وتيمور من ١٣٨٦ إلى ١٣٩٥م، الصراع على الجوق الذهبي الذي هزم فيه تيمور حليفه القديم؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Tokhtamysh–Timur war of 1386–1395, the contest for the Golden Horde in which Timur broke his old protégé; its sources are not yet checked on the page."
  es: "Boceto de ficha para la guerra entre Tokhtamysh y Timur de 1386-1395, la contienda por la Horda de Oro en la que Timur derrotó a su antiguo protegido; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour la guerre Tokhtamysh-Timur de 1386-1395, la lutte pour la Horde d'Or au cours de laquelle Timur a brisé son ancien protégé; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1386–1395 کی توختمیش – تیمور جنگ کے لیے ڈرافٹ کارڈ، گولڈن ہارڈ کا مقابلہ جس میں تیمور نے اپنے پرانے حامی کو توڑ دیا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1386-1395 yılları arasında Tokhtamysh ile Timur arasında Altın Orda üzerinde yaşanan ve Timur'un eski müttefikini mağlup ettiği savaşın ön anlatımı; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan awal tentang perang antara Tokhtamysh dan Timur dari tahun 1386 hingga 1395 M, konflik memperebutkan Gerombolan Emas di mana Timur mengalahkan sekutu lamanya; sumber-sumber yang tercantum di halaman ini belum ditinjau."
