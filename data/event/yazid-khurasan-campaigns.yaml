label: { ar: "مغازي يزيد بن المهلب وخلافة المفضل", en: "Yazid ibn al-Muhallab's Campaigns and al-Mufaddal's Succession" }
summary:
  ar: "استخلف المهلب ابنه يزيد بن المهلب فغزا مغازي كثيرة وفتح البتم على يد مخلد بن يزيد بن المهلب وصار عبد الرحمن بن العباس بن ربيعة بن الحارث بن عبد المطلب إلى هراة في فل ابن الأشعث وغيرهم وكان خرج مع ابن الأشعث فقتل الرقاد المتكي وجبى الخراج فسار إليه يزيد فاقتتلوا فهزمهم وأمر بالكف عن اتباعهم ولحق الهاشمي بالسند وغزا يزيد خوارزم وأصاب سبياً فلبس الجند ثياب السبي فماتوا من البرد ثم ولى الحجاج المفضل بن المهلب بن أبي صفرة ففتح بادغيس وقد انتقضت وشومان وآخرين وأصاب غنائم قسمها بين الناس."
  en: "The Muhallab's son Yazid succeeded, campaigning widely — al-Buttam opened by his own son Mukhallad. Abd al-Rahman ibn al-Abbas ibn Rabi'a of Abd al-Muttalib's house, fleeing with Ibn al-Ash'ath's remnant, reached Herat, killed al-Ruqad al-Mutakki and levied kharaj; Yazid beat him, forbade pursuit, and the Hashimi fled to Sind. On Yazid's Khwarizm raid the troops wore the captives' clothes and perished of cold. Then al-Hajjaj gave Khurasan to al-Mufaddal ibn al-Muhallab, who retook breached Badghis, Shuman and others, dividing the spoils."
