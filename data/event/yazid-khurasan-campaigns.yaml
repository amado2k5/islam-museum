label: { ar: "مغازي يزيد بن المهلب وخلافة المفضل", en: "Yazid ibn al-Muhallab's Campaigns and al-Mufaddal's Succession", es: "Las campañas de Yazid ibn al-Muhallab y la sucesión de al-Mufaddal.", fr: "Les campagnes de Yazid ibn al-Muhallab et la succession d'al-Mufaddal", ur: "یزید بن المحلب کی مہمات اور المفضل کی جانشینی", tr: "Yezid ibn el-Muhallab'ın seferleri ve el-Mufaddal'ın halifeliği", id: "Kampanye Yazid ibn al-Muhallab dan kekhalifahan al-Mufaddal" }
summary:
  ar: "استخلف المهلب ابنه يزيد بن المهلب فغزا مغازي كثيرة وفتح البتم على يد مخلد بن يزيد بن المهلب وصار عبد الرحمن بن العباس بن ربيعة بن الحارث بن عبد المطلب إلى هراة في فل ابن الأشعث وغيرهم وكان خرج مع ابن الأشعث فقتل الرقاد المتكي وجبى الخراج فسار إليه يزيد فاقتتلوا فهزمهم وأمر بالكف عن اتباعهم ولحق الهاشمي بالسند وغزا يزيد خوارزم وأصاب سبياً فلبس الجند ثياب السبي فماتوا من البرد ثم ولى الحجاج المفضل بن المهلب بن أبي صفرة ففتح بادغيس وقد انتقضت وشومان وآخرين وأصاب غنائم قسمها بين الناس."
  en: "The Muhallab's son Yazid succeeded, campaigning widely — al-Buttam opened by his own son Mukhallad. Abd al-Rahman ibn al-Abbas ibn Rabi'a of Abd al-Muttalib's house, fleeing with Ibn al-Ash'ath's remnant, reached Herat, killed al-Ruqad al-Mutakki and levied kharaj; Yazid beat him, forbade pursuit, and the Hashimi fled to Sind. On Yazid's Khwarizm raid the troops wore the captives' clothes and perished of cold. Then al-Hajjaj gave Khurasan to al-Mufaddal ibn al-Muhallab, who retook breached Badghis, Shuman and others, dividing the spoils."
  es: "El hijo de Muhallab, Yazid, tuvo éxito, realizando una extensa campaña; al-Buttam fue inaugurada por su propio hijo, Mukhallad. Abd al-Rahman ibn al-Abbas ibn Rabi'a, de la casa de Abd al-Muttalib, huyendo con los restos de Ibn al-Ash'ath, llegó a Herat, mató a al-Ruqad al-Mutakki y recaudó kharaj; Yazid lo derrotó, prohibió la persecución y el Hashimi huyó a Sind. En la incursión de Yazid en Khwarizm, las tropas vistieron las ropas de los cautivos y perecieron de frío. Entonces al-Hajjaj entregó Khurasan a al-Mufaddal ibn al-Muhallab, quien reconquistó Badghis, Shuman y otros territorios, repartiéndose el botín."
  fr: "Le fils de Muhallab, Yazid, réussit à mener une vaste campagne militaire; al-Buttam fut ouverte par son propre fils, Muhallad. Abd al-Rahman ibn al-Abbas ibn Rabi'a, de la maison d'Abd al-Muttalib, fuyant avec les survivants d'Ibn al-Ash'ath, atteignit Hérat, tua al-Ruqad al-Mutakki et leva le kharaj. Yazid le vainquit, interdit la poursuite, et les Hashimi s'enfuirent au Sind. Lors du raid de Yazid au Khwarezm, les troupes, vêtues des vêtements des captifs, périrent de froid. Al-Hajjaj confia alors le Khorasan à al-Mufaddal ibn al-Muhallab, qui reprit Badghis, Shuman et d'autres villes, et partagea le butin."
  ur: "محلب کا بیٹا یزید کامیاب ہوا، وسیع پیمانے پر مہم چلائی - البطم کو اس کے اپنے بیٹے مخلد نے کھولا۔ عبد المطلب کے گھر کا عبدالرحمٰن بن العباس ابن ربیعہ، ابن اشعث کے باقیات کے ساتھ بھاگتا ہوا، ہرات پہنچا، الرقد المتکی کو قتل کیا اور خرج لگا دیا۔ یزید نے اسے مارا، تعاقب سے منع کیا اور ہاشمی سندھ کی طرف بھاگ گئے۔ یزید کے خوارزم کے چھاپے پر فوجوں نے اسیروں کے کپڑے پہن لیے اور سردی سے ہلاک ہو گئے۔ پھر الحجاج نے خراسان المفضل ابن المحلب کو دے دیا، جس نے مال غنیمت تقسیم کرتے ہوئے بدغیس، شومان اور دیگر کو واپس لے لیا۔"
  tr: "El-Muhallab, oğlu Yazid ibn el-Muhallab'ı halefi olarak atadı ve o da birçok sefere önderlik ederek Mukhallad ibn Yazid ibn el-Muhallab'ın elinden el-Batim'i fethetti. Abd el-Rahman ibn el-Abbas ibn Rabi'ah ibn el-Harith ibn Abd el-Muttalib, İbn el-Aş'ath ve diğerlerinin ordusuyla Herat'a gitti. İbn el-Aş'ath ile birlikte yola çıkmış, el-Raqad el-Mutakki'yi öldürmüş ve haraç toplamıştı. Yazid ona karşı yürüdü ve savaştılar, bu yüzden Yazid onları yendi ve takip etmeyi bırakmalarını emretti. El-Haşimi Sindh'e katıldı ve Yazid Harezm'e baskın düzenleyerek esirler aldı. Askerler esirlerin kıyafetlerini giydiler ve soğuktan öldüler. Bunun üzerine el-Haccac, el-Mufaddal ibn el-Muhallab ibn Abi Sufra'yı görevlendirdi ve o da isyan eden Badghis'i, Şuman'ı ve diğerlerini fethetti ve elde ettiği ganimetleri halk arasında paylaştırdı."
  id: "Al-Muhallab mengangkat putranya, Yazid ibn al-Muhallab, sebagai penggantinya, dan ia memimpin banyak kampanye dan menaklukkan al-Batim di tangan Mukhallad ibn Yazid ibn al-Muhallab. Abd al-Rahman ibn al-Abbas ibn Rabi’ah ibn al-Harith ibn Abd al-Muttalib pergi ke Herat dengan pasukan Ibn al-Ash’ath dan lainnya. Ia telah pergi bersama Ibn al-Ash’ath dan membunuh al-Raqad al-Mutakki dan mengumpulkan upeti. Yazid bergerak melawan mereka dan mereka bertempur, sehingga ia mengalahkan mereka dan memerintahkan agar mereka berhenti mengejar mereka. Al-Hashimi bergabung dengan Sindh, dan Yazid menyerbu Khwarazm dan menangkap tawanan. Para prajurit mengenakan pakaian tawanan dan mati kedinginan. Kemudian al-Hajjaj menunjuk al-Mufaddal ibn al-Muhallab ibn Abi Sufra, dan dia menaklukkan Badghis yang telah memberontak, serta Shuman dan lainnya, dan dia memperoleh rampasan perang yang kemudian dibagikan kepada rakyat."
