label: { ar: "وثبة طيء على الركب العراقي" }
summary:
  ar: "في سنة سبع خرجت طيء على الركب العراقي ليأخذوه فقاتلهم أمير الركب أبو الأغر خليفة بن المبارك يوماً وليلة فنصره الله وقتل صالح أمير العرب وأسر من قومه خلق كثير ودخل الحجاج بالأسرى وبالرؤوس على الرماح، وفي سنة تسع وثبت طيء وأميرهم صالح بن مدرك فانتهبوا الركب العراقي فذهب للحجاج فيه ما قيمته ألف ألف مثقال {cite:tarikh-khulafa-minhaj-1434 p. 575-576}."
  en: "In 287 Tayyi' fell on the Iraqi pilgrim caravan; its commander Abu al-Agharr Khalifa ibn al-Mubarak fought a day and a night, God gave him victory, Salih the Arabs' amir was slain and many captured — the pilgrims entered with captives and heads on lances. In 289 Tayyi' under Salih ibn Madrak rose again and looted the caravan — a million mithqals lost to the pilgrims {cite:tarikh-khulafa-minhaj-1434 p. 575-576}."
