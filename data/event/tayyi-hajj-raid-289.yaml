id: event/tayyi-hajj-raid-289
class: event
kind: raid
label: { ar: "وثبة طيء على الركب العراقي", en: "Tayyi's Assault on the Iraqi Pilgrim Caravan", es: "El ataque de Tayyi contra la caravana de peregrinos iraquíes", fr: "L'attaque de Tayyi contre la caravane de pèlerins irakiens", ur: "عراقی حاجیوں کے قافلے پر طائی کا حملہ", tr: "Tayy'ın Iraklının dizine atlayışı", id: "Lompatan Tayy di atas lutut Irak" }
summary:
  ar: "في سنة سبع خرجت طيء على الركب العراقي ليأخذوه فقاتلهم أمير الركب أبو الأغر خليفة بن المبارك يوماً وليلة فنصره الله وقتل صالح أمير العرب وأسر من قومه خلق كثير ودخل الحجاج بالأسرى وبالرؤوس على الرماح، وفي سنة تسع وثبت طيء وأميرهم صالح بن مدرك فانتهبوا الركب العراقي فذهب للحجاج فيه ما قيمته ألف ألف مثقال {cite:tarikh-khulafa-minhaj-1434 p. 575-576}."
  en: "In 287 Tayyi' fell on the Iraqi pilgrim caravan; its commander Abu al-Agharr Khalifa ibn al-Mubarak fought a day and a night, God gave him victory, Salih the Arabs' amir was slain and many captured — the pilgrims entered with captives and heads on lances. In 289 Tayyi' under Salih ibn Madrak rose again and looted the caravan — a million mithqals lost to the pilgrims {cite:tarikh-khulafa-minhaj-1434 p. 575-576}."
  es: "En 287, Tayyi' atacó la caravana de peregrinos iraquíes; su comandante, Abu al-Agharr Khalifa ibn al-Mubarak, luchó día y noche, Dios le concedió la victoria, Salih, el emir de los árabes, fue asesinado y muchos fueron capturados; los peregrinos entraron con prisioneros y cabezas clavadas en lanzas. En 289, Tayyi', bajo el mando de Salih ibn Madrak, se alzó de nuevo y saqueó la caravana; los peregrinos perdieron un millón de mithqals {cite:tarikh-khulafa-minhaj-1434 p. 575-576}."
  fr: "En 287, Tayyi' attaqua la caravane de pèlerins irakiens. Son commandant, Abou al-Agharr Khalifa ibn al-Mubarak, lutta pendant un jour et une nuit. Dieu lui accorda la victoire; Salih, l'émir des Arabes, fut tué et de nombreux prisonniers capturés. Les pèlerins entrèrent avec des captifs et des têtes au bout de lances. En 289, Tayyi', sous le commandement de Salih ibn Madrak, se souleva de nouveau et pilla la caravane, perdant un million de mithqals au profit des pèlerins (voir: Tarikh-Khulafa-Minhaj-1434, p. 575-576)."
  ur: "287 میں طائی عراقی حاجیوں کے قافلے پر گرا۔ اس کے کمانڈر ابو الاثر خلیفہ بن المبارک نے دن رات جنگ کی، اللہ تعالیٰ نے اسے فتح دی، عرب کے امیر صالح کو قتل کر دیا گیا اور بہت سے لوگ پکڑے گئے - حجاج اسیروں اور سروں پر نیزے لیے داخل ہوئے۔ 289 میں صالح بن مدرک کے ماتحت طائی دوبارہ کھڑا ہوا اور قافلہ کو لوٹ لیا - ایک ملین معتکف حاجیوں کو کھوئے گئے 575-576}۔"
  tr: "Yedinci yılda Tayy, Irak kervanını ele geçirmek için ona saldırdı. Kervanın lideri Ebu el-Ağar Halife bin el-Mübarek, onlarla bir gün bir gece savaştı ve Allah ona zafer verdi. Arapların lideri Salih'i öldürdü ve birçok adamını esir aldı. El-Haccac, esirlerle ve mızrakların ucundaki başlarla içeri girdi. Dokuzuncu yılda Tayy direndi ve liderleri Salih bin Müdris, Irak kervanını yağmaladı. Böylece El-Haccac, bir milyon miskal değerindeki malını kaybetti. {cite:tarikh-khulafa-minhaj-1434 s. 575-576}"
  id: "Pada tahun ketujuh, Tayy keluar melawan kafilah Irak untuk merebutnya, sehingga pemimpin kafilah, Abu al-Aghar Khalifa bin al-Mubarak, melawan mereka selama sehari semalam, dan Allah menganugerahkan kemenangan kepadanya. Ia membunuh Salih, pemimpin orang-orang Arab, dan menangkap banyak pengikutnya. Al-Hajjaj masuk dengan para tawanan dan kepala-kepala yang ditancapkan di tombak. Pada tahun kesembilan, Tayy tetap teguh, dan pemimpin mereka, Salih bin Mudrik, menjarah kafilah Irak, sehingga al-Hajjaj kehilangan harta benda senilai satu juta mithqal. {cite:tarikh-khulafa-minhaj-1434 p. 575-576}."
