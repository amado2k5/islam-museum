id: event/muttaqi-blinding-333
class: event
kind: mutiny
label: { ar: "سمل المتقي على يد توزون" }
summary:
  ar: "كاتب المتقي ابن حمدان فقدم في جيش عظيم فسار المتقي بأهله إلى تكريت وانهزما من عكبرا إلى الموصل ثم إلى نصيبين فكاتب توزون في الصلح فحلف وبالغ في الأيمان وحضر الإخشيد صاحب مصر إلى المتقي بالرقة فقال وغدرهم فالله الله في نفسك سر معي إلى مصر فهي لك وتأمن على نفسك فلم يقبل فخرج من الرقة إلى بغداد في رابع محرم سنة ثلاث وثلاثين فخرج للقائه توزون فترجل وقبل الأرض ومشى بين يديه فلما نزل قبض عليه وكحل الخليفة وأدخل بغداد مسمول العينين وأخذ منه الخاتم والبردة والقضيب وأحضر عبد الله بن المكتفي فبايعه ولقبه المستكفي بالله فبايعه المتقي المسمول وأشهد على نفسه بالخلع وذلك لعشر بقين من المحرم، ولم يحل الحول على توزون حتى مات، وأخرج المتقي إلى جزيرة مقابل السندية فحبس بها خمساً وعشرين سنة حتى مات في شعبان سنة سبع وخمسين، ولما بلغ القاهر أنه سمل قال صرنا اثنين ونحتاج إلى ثالث فكان كذلك سمل المستكفي {cite:tarikh-khulafa-minhaj-1434 p. 610-612}. وعند ابن الجوزي وكذلك القاهر بالله خافه وزيره أبو علي بن مقلة فاستتر وأغرى الجند به فخلعوه وسملوا عينيه ثم خرج من دار السلطان في سنة ثلاث وثلاثين إلى دار ابن طاهر وتوفي في جمادى الأولى سنة 339هـ ودفن إلى جنب أبيه المعتضد في خلافة المطيع وكان عمره اثنتين وخمسين سنة {cite:muntazam-ibn-al-jawzi p. 660}"
  en: "Al-Muttaqi summoned Ibn Hamdan, lost with him at Ukbara, fled to Mosul and Nisibis, then distrusted the Hamdanids and wrote Tuzun for peace — he swore mighty oaths. The Ikhshid of Egypt came to Raqqa: 'beware their treachery — come with me to Egypt, it is yours' — he refused. On 4 Muharram 333 Tuzun met him, kissed the ground and walked before him, then seized him, blinded him, took the seal, the Burda and the staff, and hailed Abd Allah ibn al-Muktafi as al-Mustakfi — whom the blinded Muttaqi himself acclaimed. Muttaqi was jailed opposite al-Sindiyya twenty-five years till his death in 357. When the blinded al-Qahir heard, he said 'we are two now — we need a third': and so it was, al-Mustakfi was blinded too {cite:tarikh-khulafa-minhaj-1434 p. 610-612}."
