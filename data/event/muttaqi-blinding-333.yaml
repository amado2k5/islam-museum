id: event/muttaqi-blinding-333
class: event
kind: mutiny
label: { ar: "سمل المتقي على يد توزون", en: "Al-Muttaqi blinded by Tuzun", es: "Al-Muttaqi cegado por Tuzun", fr: "Al-Muttaqi aveuglé par Tuzun", ur: "المتقی کو تزون نے اندھا کر دیا۔" }
summary:
  ar: "كاتب المتقي ابن حمدان فقدم في جيش عظيم فسار المتقي بأهله إلى تكريت وانهزما من عكبرا إلى الموصل ثم إلى نصيبين فكاتب توزون في الصلح فحلف وبالغ في الأيمان وحضر الإخشيد صاحب مصر إلى المتقي بالرقة فقال وغدرهم فالله الله في نفسك سر معي إلى مصر فهي لك وتأمن على نفسك فلم يقبل فخرج من الرقة إلى بغداد في رابع محرم سنة ثلاث وثلاثين فخرج للقائه توزون فترجل وقبل الأرض ومشى بين يديه فلما نزل قبض عليه وكحل الخليفة وأدخل بغداد مسمول العينين وأخذ منه الخاتم والبردة والقضيب وأحضر عبد الله بن المكتفي فبايعه ولقبه المستكفي بالله فبايعه المتقي المسمول وأشهد على نفسه بالخلع وذلك لعشر بقين من المحرم، ولم يحل الحول على توزون حتى مات، وأخرج المتقي إلى جزيرة مقابل السندية فحبس بها خمساً وعشرين سنة حتى مات في شعبان سنة سبع وخمسين، ولما بلغ القاهر أنه سمل قال صرنا اثنين ونحتاج إلى ثالث فكان كذلك سمل المستكفي {cite:tarikh-khulafa-minhaj-1434 p. 610-612}. وعند ابن الجوزي وكذلك القاهر بالله خافه وزيره أبو علي بن مقلة فاستتر وأغرى الجند به فخلعوه وسملوا عينيه ثم خرج من دار السلطان في سنة ثلاث وثلاثين إلى دار ابن طاهر وتوفي في جمادى الأولى سنة 339هـ ودفن إلى جنب أبيه المعتضد في خلافة المطيع وكان عمره اثنتين وخمسين سنة {cite:muntazam-ibn-al-jawzi p. 660} وعند ابن الجوزي خرج المتقي إلى ناحية الموصل فأقام عند بني حمدان واستدعاهم لحرب توزون فلما أقبلوا على حربه خرج توزون فكسرهم، ثم كاتب المتقي يطلب الصلح فأرسل من يستحلفه خلف أيمان مؤكدة فخلف {cite:muntazam-ibn-al-jawzi p. 633}."
  en: "Al-Muttaqi summoned Ibn Hamdan, lost with him at Ukbara, fled to Mosul and Nisibis, then distrusted the Hamdanids and wrote Tuzun for peace — he swore mighty oaths. The Ikhshid of Egypt came to Raqqa: 'beware their treachery — come with me to Egypt, it is yours' — he refused. On 4 Muharram 333 Tuzun met him, kissed the ground and walked before him, then seized him, blinded him, took the seal, the Burda and the staff, and hailed Abd Allah ibn al-Muktafi as al-Mustakfi — whom the blinded Muttaqi himself acclaimed. Muttaqi was jailed opposite al-Sindiyya twenty-five years till his death in 357. When the blinded al-Qahir heard, he said 'we are two now — we need a third': and so it was, al-Mustakfi was blinded too {cite:tarikh-khulafa-minhaj-1434 p. 610-612}."
  es: "Al-Muttaqi convocó a Ibn Hamdan, quien se perdió con él en Ukbara, huyó a Mosul y Nisibis, luego desconfió de los Hamdaníes y escribió a Tuzun pidiendo la paz; hizo grandes juramentos. El Ikhshid de Egipto llegó a Raqqa: «¡Cuidado con su traición! Ven conmigo a Egipto, es tuyo». Él se negó. El 4 de Muharram de 333, Tuzun lo encontró, besó el suelo y caminó delante de él, luego lo apresó, lo cegó, tomó el sello, la Burda y el bastón, y aclamó a Abd Allah ibn al-Muktafi como al-Mustakfi, a quien el propio Muttaqi, ya cegado, aclamó. Muttaqi estuvo encarcelado frente a al-Sindiyya durante veinticinco años, hasta su muerte en 357. Cuando el ciego al-Qahir lo oyó, dijo: «Ahora somos dos, necesitamos un tercero». Y así fue, al-Mustakfi también quedó ciego {cite:tarikh-khulafa-minhaj-1434 p. 610-612}."
  fr: "Al-Muttaqi convoqua Ibn Hamdan, mais ils furent vaincus à Ukbara. Ils s'enfuirent à Mossoul et Nisibe, puis, se méfiant des Hamdanides, il écrivit à Tuzun pour négocier la paix et prêta de solennels serments. L'Ikhshid d'Égypte vint à Raqqa: « Prends garde à leur traîtrise ! Viens avec moi en Égypte, elle est à toi. » Il refusa. Le 4 Muharram 333, Tuzun le rencontra, baisa le sol et marcha devant lui, puis le saisit, l'aveugla, prit le sceau, la Burda et le bâton, et salua Abd Allah ibn al-Muktafi sous le nom d'al-Mustakfi – ce que Muttaqi, aveuglé, acclama lui-même. Muttaqi fut emprisonné en face d'al-Sindiyya pendant vingt-cinq ans jusqu'à sa mort en 357. Lorsque al-Qahir, devenu aveugle, l'apprit, il dit: « Nous sommes deux maintenant — il nous faut un troisième »: et c'est ainsi qu'al-Mustakfi fut également aveuglé {cite:tarikh-khulafa-minhaj-1434 p. 610-612}."
  ur: "المتقی نے ابن حمدان کو طلب کیا، وہ عبقرہ میں اس کے ساتھ کھو گیا، موصل اور نسیبس بھاگ گیا، پھر ہمدانیوں پر عدم اعتماد کیا اور امن کے لیے تزون لکھا - اس نے زبردست قسمیں کھائیں۔ مصر کا اخشد رقہ کے پاس آیا: 'ان کی غداری سے بچو- میرے ساتھ مصر چلو، یہ تمہارا ہے' - اس نے انکار کر دیا۔ 4 محرم 333 کو تزون نے اس سے ملاقات کی، زمین کو بوسہ دیا اور اس کے آگے چل دیا، پھر اسے پکڑ کر اندھا کر دیا، مہر، بردہ اور عصا لے لیا، اور عبداللہ بن المکتفی کو المستقفی کہا، جس کی تعریف خود نابینا متقی نے کی۔ متقی کو 357 میں اپنی موت تک 25 سال تک السندیہ کے خلاف جیل میں ڈال دیا گیا۔ جب نابینا القاہر نے سنا تو اس نے کہا کہ 'اب ہم دو ہیں - ہمیں تیسرے کی ضرورت ہے': اور ایسا ہی ہوا، المستقفی کو بھی اندھا کر دیا گیا۔ 610-612}۔"
