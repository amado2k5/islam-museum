tags: [wasaya-browser, wasaya-prophets, wasaya-wasiyya, wasaya-ihtidar, wasaya-mirath, wasaya-marqad]
label:
  ar: "دعاء زكريا بولي يرثه، ووصايا يحيى الخمس، وما روي في قتل يحيى وموت زكريا"
  en: "Zakariyya's prayer for an heir, Yahya's five commands, and the reports of the deaths of Yahya and Zakariyya"
  ur: "زکریا کی وارث کے لیے دعا، یحییٰ کے پانچ احکام، اور یحییٰ و زکریا کی وفات کی روایتیں"
  es: "La oración de Zacarías por un heredero, los cinco mandamientos de Yahya y los informes de las muertes de Yahya y Zacarías."
  fr: "La prière de Zacharie pour un héritier, les cinq commandements de Yahya et les récits des morts de Yahya et de Zacharie"
  tr: "Zekeriya'nın varisi için ettiği dua, Yahya'nın beş emri ve Yahya'nın öldürülmesi ve Zekeriya'nın ölümü hakkında anlatılanlar."
  id: "Doa Zakharia untuk ahli warisnya, lima perintah Yohanes, dan apa yang diceritakan tentang pembunuhan Yohanes dan kematian Zakharia."
summary:
  ar: "دعا زكريا ربه أن يهب له ولياً يرثه ويرث من آل يعقوب، وبُشّر بيحيى {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 663} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 664}. واختلف المفسرون في معنى الوراثة بين النبوة والعلم والمال، ويرجح ابن كثير الأول بحديث «لا نورث» {cite:tafsir-ibn-kathir scan vol. 1 p. 2926}، وينقل القرطبي عن النحاس ثلاثة أجوبة {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4333}. ويروي أحمد حديث الحارث الأشعري في الكلمات الخمس التي أمر الله بها يحيى: التوحيد والصلاة والصيام والصدقة وذكر الله {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 672} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 673}. وتذكر الكتب أسباباً متعددة لقتل يحيى وروايتين عن وهب بن منبه في موت زكريا، ويحكم ابن كثير على حديث الإسراء في ذلك بأنه غريب جداً ومنكر الرفع {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 675} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 676}."
  en: "Zakariyya asked his Lord for a successor who would inherit from him and from the house of Yaqub, and was given the news of Yahya {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 663} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 664}. The commentators differ on whether the inheritance is of prophethood, knowledge or wealth; Ibn Kathir prefers the first on the strength of the hadith 'we are not inherited from' {cite:tafsir-ibn-kathir scan vol. 1 p. 2926}, and al-Qurtubi quotes al-Nahhas for three answers {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4333}. Ahmad reports the hadith of al-Harith al-Ash'ari on the five commands God gave Yahya: worship of God alone, prayer, fasting, charity and remembrance {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 672} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 673}. The books give several reasons for the killing of Yahya and two reports from Wahb ibn Munabbih on the death of Zakariyya, and Ibn Kathir calls the Night Journey hadith on it very strange and its attribution to the Prophet rejected {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 675} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 676}."
  ur: "زکریا نے اپنے رب سے ایسا جانشین مانگا جو ان کا اور آلِ یعقوب کا وارث ہو، اور انھیں یحییٰ کی بشارت ملی {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 663} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 664}۔ مفسرین اس میں مختلف ہیں کہ وراثت نبوت کی ہے، علم کی یا مال کی؛ ابن کثیر حدیث «ہماری وراثت نہیں ہوتی» کی بنا پر پہلے کو ترجیح دیتے ہیں {cite:tafsir-ibn-kathir scan vol. 1 p. 2926}، اور قرطبی نحاس سے تین جوابات نقل کرتے ہیں {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4333}۔ احمد حارث اشعری کی حدیث روایت کرتے ہیں کہ اللہ نے یحییٰ کو پانچ باتوں کا حکم دیا: توحید، نماز، روزہ، صدقہ اور ذکر {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 672} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 673}۔ کتابیں یحییٰ کے قتل کے کئی اسباب اور زکریا کی موت کے بارے میں وہب بن منبہ کی دو روایتیں دیتی ہیں، اور ابن کثیر اس سلسلے کی شبِ اسرا والی حدیث کو بہت غریب اور مرفوع ہونے میں منکر کہتے ہیں {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 675} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 676}۔"
  es: "Zakariyya pidió a su Señor un sucesor que heredara de él y de la casa de Yaqub, y se le dio la noticia de Yahya {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 663} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 664}. Los comentaristas difieren en si la herencia es de profecía, conocimiento o riqueza; Ibn Kathir prefiere la primera basándose en el hadiz 'no heredamos de' {cite:tafsir-ibn-kathir scan vol. 1 p. 2926}, y al-Qurtubi cita a al-Nahhas para tres respuestas {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4333}. Ahmad informa el hadiz de al-Harith al-Ash'ari sobre los cinco mandamientos que Dios le dio a Yahya: adoración solo a Dios, oración, ayuno, caridad y recuerdo {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 672} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 673}. Los libros dan varias razones para el asesinato de Yahya y dos informes de Wahb ibn Munabbih sobre la muerte de Zakariyya, e Ibn Kathir llama al hadiz del Viaje Nocturno sobre esto muy extraño y rechaza su atribución al Profeta {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 675} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 676}."
  fr: "Zakariyya demanda à son Seigneur un successeur qui hériterait de lui et de la maison de Yaqub, et reçut la nouvelle de la naissance de Yahya (Qisas al-Anbiya, ibn Kathir, p. 663; Qisas al-Anbiya, ibn Kathir, p. 664). Les commentateurs divergent quant à la nature de cet héritage: prophétie, savoir ou richesse; Ibn Kathir privilégie la première option, se fondant sur le hadith « nous n’héritons pas de » (Tafsir, ibn Kathir, vol. 1, p. 2926), tandis qu’al-Qurtubi cite al-Nahhas pour trois réponses (Jami’ahkam Quran, vol. 3, p. 4333). Ahmad rapporte le hadith d'al-Harith al-Ash'ari concernant les cinq commandements donnés par Dieu à Yahya: l'adoration de Dieu seul, la prière, le jeûne, l'aumône et le souvenir (Qisas al-Anbiya ibn Kathir, p. 672; Qisas al-Anbiya ibn Kathir, p. 673). Les ouvrages avancent plusieurs raisons pour expliquer le meurtre de Yahya et rapportent deux hadiths de Wahb ibn Munabbih relatifs à la mort de Zakariyya. Ibn Kathir qualifie le hadith du Voyage nocturne à ce sujet d'étrange et rejette son attribution au Prophète (Qisas al-Anbiya ibn Kathir, p. 675; Qisas al-Anbiya ibn Kathir, p. 676)."
  tr: "Zekeriya, kendisinden ve Yakup ailesinden miras alacak bir halef vermesi için Rabbine dua etti ve ona Yahya'nın müjdesi verildi. {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 663} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 664} Tefsirciler, peygamberlikten bilgiye ve servete kadar değişen farklı yorumlarda bulundular. İbn Kathir, \"Biz miras bırakmayız\" hadisini örnek göstererek ilk yorumu savundu. {cite:tafsir-ibn-kathir scan vol. 1 p. 2926} El-Kurtubi, el-Nahhas'tan üç cevap aktardı. {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4333} Ahmed, Allah'ın Yahya'ya emrettiği beş kelimeyle ilgili olarak el-Harith el-Eş'ari'nin hadisini rivayet eder: tevhid, namaz, oruç, zekât ve Allah'ı anmak. {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 672} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 673}. Kitaplar, Yahya'nın ölümüne dair çeşitli sebeplerden ve Zekeriya'nın ölümüyle ilgili olarak Vahb ibn Munabbih'ten iki rivayetten bahseder. İbn Kathir, bu konudaki İsra hadisini çok garip ve sahihliği şüpheli bulmaktadır. {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 675} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 676}."
  id: "Zakharia berdoa kepada Tuhannya agar memberinya seorang penerus untuk mewarisi harta darinya dan dari keluarga Yakub, dan ia diberi kabar gembira tentang Yohanes (Yahya) {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 663} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 664}. Para penafsir berbeda pendapat mengenai warisan tersebut, mulai dari kenabian, ilmu pengetahuan, hingga kekayaan. Ibn Kathir lebih menyukai penafsiran pertama, dengan mengutip hadits \"Kami tidak meninggalkan warisan\" {cite:tafsir-ibn-kathir scan vol. 1 p. 2926}. Al-Qurtubi mengutip tiga jawaban dari al-Nahhas {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 4333}. Ahmad meriwayatkan hadits al-Harith al-Ash'ari mengenai lima kata yang diperintahkan Allah kepada Yohanes: tauhid, salat, puasa, sedekah, dan mengingat Allah. {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 672} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 673}. Kitab-kitab tersebut menyebutkan beberapa alasan kematian Yohanes dan dua riwayat dari Wahb ibn Munabbih mengenai kematian Zakharia. Ibn Kathir menilai hadits Isra' (Perjalanan Malam) dalam hal ini sangat aneh dan diragukan keasliannya. {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 675} {cite:qisas-al-anbiya-ibn-kathir-iqra-ebook scan p. 676}."
