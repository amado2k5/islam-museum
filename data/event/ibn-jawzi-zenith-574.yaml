label:
  ar: "ذروة مكانة ابن الجوزي في بغداد سنة ٥٧٤هـ"
  en: "The zenith of Ibn al-Jawzi's career at Baghdad, 574/1178–9"
  ur: "بغداد میں ابن الجوزی کے عروج کا سال، 574ھ/1178–9ء"
summary:
  ar: "بلغت مكانة ابن الجوزي في بغداد ذروتها سنة ٥٧٤هـ/١١٧٨–١١٧٩م: كان يدير خمس مدارس وقد صنّف أكثر من مئة وخمسين مصنفاً، وكانت له أحسن العلاقات بالخليفة المستضيء وبالوزير وصاحب المخزن وكبار العلماء، وكان الخليفة قد نصب له سنة ٥٧٠هـ دكّة في جامع القصر ودرّس في مدرستين جديدتين؛ وازدهرت بفضله مكانة الحنابلة الشعبية في بغداد {cite:encyclopaedia-of-islam-2 vol. 3 p. 783-784}."
  en: "The year 574/1178–9 marked the zenith of Ibn al-Jawzi's career at Baghdad: he was directing five madrasas and had already written more than a hundred and fifty works, enjoying excellent relations with the caliph al-Mustadi', the vizier, the ṣāḥib al-makhzin and the chief ʿulamāʾ; in 570 the caliph had a dais (dakka) erected for him in the Palace mosque and he taught in two new madrasas, and under his influence Hanbalism enjoyed great popular prestige in Baghdad {cite:encyclopaedia-of-islam-2 vol. 3 p. 783-784}."
  ur: "574ھ/1178–9ء بغداد میں ابن الجوزی کے عروج کا سال تھا: وہ پانچ مدارس چلا رہے تھے اور ڈیڑھ سو سے زیادہ تصانیف لکھ چکے تھے، خلیفہ مستضیع، وزیر اور صاحبِ مخزن اور بڑے علماء سے ممتاز تعلقات تھے؛ 570ھ میں خلیفہ نے ان کے لیے جامعِ قصر میں دکّہ بنوایا اور وہ دو نئے مدارس میں پڑھاتے، اور ان کے اثر سے بغداد میں حنابلہ کی عوامی مقبولیت بڑھی {cite:encyclopaedia-of-islam-2 vol. 3 p. 783-784}۔"
