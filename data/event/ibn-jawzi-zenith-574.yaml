label:
  ar: "ذروة مكانة ابن الجوزي في بغداد سنة ٥٧٤هـ"
  en: "The zenith of Ibn al-Jawzi's career at Baghdad, 574/1178–9"
  ur: "بغداد میں ابن الجوزی کے عروج کا سال، 574ھ/1178–9ء"
  es: "El apogeo de la carrera de Ibn al-Jawzi en Bagdad, 574/1178–9"
  fr: "L'apogée de la carrière d'Ibn al-Jawzi à Bagdad, 574/1178-1179"
  tr: "İbn el-Cevzi'nin Bağdat'taki nüfuzu Hicri 574 yılında zirveye ulaştı."
  id: "Ketenaran Ibn al-Jawzi mencapai puncaknya di Baghdad pada tahun 574 Hijriah."
summary:
  ar: "بلغت مكانة ابن الجوزي في بغداد ذروتها سنة ٥٧٤هـ/١١٧٨–١١٧٩م: كان يدير خمس مدارس وقد صنّف أكثر من مئة وخمسين مصنفاً، وكانت له أحسن العلاقات بالخليفة المستضيء وبالوزير وصاحب المخزن وكبار العلماء، وكان الخليفة قد نصب له سنة ٥٧٠هـ دكّة في جامع القصر ودرّس في مدرستين جديدتين؛ وازدهرت بفضله مكانة الحنابلة الشعبية في بغداد {cite:encyclopaedia-of-islam-2 vol. 3 p. 783-784}."
  en: "The year 574/1178–9 marked the zenith of Ibn al-Jawzi's career at Baghdad: he was directing five madrasas and had already written more than a hundred and fifty works, enjoying excellent relations with the caliph al-Mustadi', the vizier, the ṣāḥib al-makhzin and the chief ʿulamāʾ; in 570 the caliph had a dais (dakka) erected for him in the Palace mosque and he taught in two new madrasas, and under his influence Hanbalism enjoyed great popular prestige in Baghdad {cite:encyclopaedia-of-islam-2 vol. 3 p. 783-784}."
  ur: "574ھ/1178–9ء بغداد میں ابن الجوزی کے عروج کا سال تھا: وہ پانچ مدارس چلا رہے تھے اور ڈیڑھ سو سے زیادہ تصانیف لکھ چکے تھے، خلیفہ مستضیع، وزیر اور صاحبِ مخزن اور بڑے علماء سے ممتاز تعلقات تھے؛ 570ھ میں خلیفہ نے ان کے لیے جامعِ قصر میں دکّہ بنوایا اور وہ دو نئے مدارس میں پڑھاتے، اور ان کے اثر سے بغداد میں حنابلہ کی عوامی مقبولیت بڑھی {cite:encyclopaedia-of-islam-2 vol. 3 p. 783-784}۔"
  es: "El año 574/1178–9 marcó el cenit de la carrera de Ibn al-Jawzi en Bagdad: dirigía cinco madrasas y ya había escrito más de ciento cincuenta obras, manteniendo excelentes relaciones con el califa al-Mustadi', el visir, el ṣāḥib al-makhzin y el principal ʿulamāʾ; en 570 el califa mandó erigir un estrado (dakka) para él en la mezquita del palacio y enseñó en dos nuevas madrasas, y bajo su influencia el hanbalismo gozó de gran prestigio popular en Bagdad {cite:encyclopaedia-of-islam-2 vol. 3 p. 783-784}."
  fr: "L'année 574/1178-9 marqua l'apogée de la carrière d'Ibn al-Jawzi à Bagdad: il dirigeait cinq madrasas et avait déjà écrit plus de cent cinquante ouvrages, bénéficiant d'excellentes relations avec le calife al-Mustadi', le vizir, le ṣāḥib al-makhzin et le principal ʿulamāʾ; en 570, le calife fit ériger pour lui un dais (dakka) dans la mosquée du Palais et il enseigna dans deux nouvelles madrasas, et sous son influence, le hanbalisme jouit d'un grand prestige populaire à Bagdad {cite:encyclopaedia-of-islam-2 vol. 3 p. 783-784}."
  tr: "İbn el-Cevzi'nin Bağdat'taki konumu Hicri 574/Miladi 1178-1179 yıllarında zirveye ulaştı: beş okul yönetti ve yüz elliden fazla kitap yazdı. Halife el-Mustadî, vezir, hazine sorumlusu ve kıdemli alimlerle en iyi ilişkilere sahipti. Halife, Hicri 570 yılında Saray Camii'nde onun için bir kürsü kurmuş ve iki yeni okulda ders vermişti. Onun sayesinde Hanbelilerin Bağdat'taki popülerliği arttı. {cite:encyclopaedia-of-islam-2 vol. 3 p. 783-784}"
  id: "Kedudukan Ibn al-Jawzi di Baghdad mencapai puncaknya pada tahun 574 H/1178–1179 M: ia mengelola lima sekolah dan menulis lebih dari seratus lima puluh buku. Ia memiliki hubungan yang sangat baik dengan Khalifah al-Mustadi’, wazir, bendahara, dan para ulama senior. Khalifah telah menyiapkan mimbar untuknya di Masjid Istana pada tahun 570 H, dan ia mengajar di dua sekolah baru. Berkatnya, popularitas mazhab Hanbali berkembang pesat di Baghdad. {cite:encyclopaedia-of-islam-2 vol. 3 p. 783-784}"
