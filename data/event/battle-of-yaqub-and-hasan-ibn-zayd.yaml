label: { ar: "الوقعة بين يعقوب بن الليث والحسن بن زيد الطائي", en: "The battle between Ya'qub ibn al-Layth and al-Hasan ibn Zayd al-Ta'i", fr: "La bataille entre Ya'qub ibn al-Layth et al-Hasan ibn Zayd al-Ta'i", es: "La batalla entre Ya'qub ibn al-Layth y al-Hasan ibn Zayd al-Ta'i", ur: "یعقوب بن لیث اور حسن بن زید طائی کے درمیان جنگ", tr: "Yakub ibn el-Leys ile el-Hasan ibn Zeyd el-Ta'i arasındaki savaş", id: "Pertempuran antara Yaqub bin al-Layth dan al-Hasan bin Zayd al-Ta'i" }
summary:
  ar: "في سنة ستين ومائتين هزم يعقوب بن الليث الحسن بن زيد الطالبي ودخل طبرستان {cite:tabari-tarikh-abu-al-fadl j.9 p.508}، وذكر الطبري أن الأمطار أدركت يعقوب في جبال طبرستان أياماً، وأن جيشه فقد أكثر دوابه {cite:tabari-tarikh-abu-al-fadl j.9 p.509}."
  en: "In 260 AH Ya'qub ibn al-Layth defeated al-Hasan ibn Zayd al-Talibi and entered Tabaristan {cite:tabari-tarikh-abu-al-fadl j.9 p.508}. Al-Tabari reports that rain overtook Ya'qub for days in the mountains of Tabaristan, and that his army lost most of its animals {cite:tabari-tarikh-abu-al-fadl j.9 p.509}."
  fr: "En 260 H, Ya'qub ibn al-Layth vainquit al-Hasan ibn Zayd al-Talibi et entra au Tabaristan {cite:tabari-tarikh-abu-al-fadl j.9 p.508}. Al-Tabari rapporte que la pluie surprit Ya'qub pendant des jours dans les montagnes du Tabaristan, et que son armée perdit la plupart de ses bêtes {cite:tabari-tarikh-abu-al-fadl j.9 p.509}."
  es: "En el año 260 de la Hégira, Ya'qub ibn al-Layth derrotó a al-Hasan ibn Zayd al-Talibi y entró en Tabaristán {cite:tabari-tarikh-abu-al-fadl j.9 p.508}. Al-Tabari relata que la lluvia sorprendió a Ya'qub durante días en las montañas de Tabaristán, y que su ejército perdió la mayor parte de sus animales {cite:tabari-tarikh-abu-al-fadl j.9 p.509}."
  ur: "260 ہجری میں یعقوب بن لیث نے حسن بن زید الطالبی کو شکست دی اور طبرستان میں داخل ہوا۔ الطبری نے بیان کیا ہے کہ طبرستان کے پہاڑوں میں یعقوب پر کئی دنوں تک بارش ہوتی رہی اور اس کی فوج نے اپنے بیشتر جانور ضائع کر دیے۔"
  tr: "Hicri 260 yılında Yakub ibn el-Layth, el-Hasan ibn Zeyd el-Talibi'yi yenerek Taberistan'a girdi. {Kaynak: Tabari-tarikh-ebu-el-fadl, cilt 9, s. 508}. Taberi, Yakub'un Taberistan dağlarında birkaç gün boyunca yağmurlara yakalandığını ve ordusunun hayvanlarının çoğunu kaybettiğini belirtmiştir. {Kaynak: Tabari-tarikh-ebu-el-fadl, cilt 9, s. 509}."
  id: "Pada tahun 260 H, Yaqub ibn al-Layth mengalahkan al-Hasan ibn Zayd al-Talibi dan memasuki Tabaristan {cite:tabari-tarikh-abu-al-fadl j.9 p.508}. Al-Tabari menyebutkan bahwa hujan menyusul Yaqub di pegunungan Tabaristan selama beberapa hari, dan pasukannya kehilangan sebagian besar hewan ternaknya {cite:tabari-tarikh-abu-al-fadl j.9 p.509}."
