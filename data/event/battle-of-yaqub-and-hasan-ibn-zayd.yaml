summary:
  ar: "في سنة ستين ومائتين هزم يعقوب بن الليث الحسن بن زيد الطالبي ودخل طبرستان {cite:tabari-tarikh-abu-al-fadl j.9 p.508}، وذكر الطبري أن الأمطار أدركت يعقوب في جبال طبرستان أياماً، وأن جيشه فقد أكثر دوابه {cite:tabari-tarikh-abu-al-fadl j.9 p.509}."
  en: "In 260 AH Ya'qub ibn al-Layth defeated al-Hasan ibn Zayd al-Talibi and entered Tabaristan {cite:tabari-tarikh-abu-al-fadl j.9 p.508}. Al-Tabari reports that rain overtook Ya'qub for days in the mountains of Tabaristan, and that his army lost most of its animals {cite:tabari-tarikh-abu-al-fadl j.9 p.509}."
