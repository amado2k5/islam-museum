  ar: "لما استمدّ أهل طليطلة المخالفون من أهل بلاد الأمير محمد بن عبد الرحمن بملكي جليقية والبشكنس لقيهم الأمير محمد على وادي سليطة وقد أكمن لهم فأوقع بهم وبلغت عدة القتلى من أهل طليطلة والمشركين عشرين ألفاً {cite:nafh-tib-maqqari p. 386}. وكان أهل طليطلة قد ثاروا أول ما تولى الإمارة سنة ٢٣٨هـ واستمانوا بصاحب جليقية سنة ٢٤٠هـ {cite:nafh-tib-maqqari p. 386 n.3}."
  en: "The Wadi Salit (Guazalete) massacre: when rebel Toledo sought the kings of Galicia and the Basques against the emir Muhammad I, he ambushed their host on the river south of Toledo and left twenty thousand dead {cite:nafh-tib-maqqari p. 386}."
