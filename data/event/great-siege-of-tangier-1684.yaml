summary:
  ar: "بطاقة أولية للحصار الكبير لطنجة من ١٦٨٠ إلى ١٦٨٤م، حملة مولاي إسماعيل التي أنهت الاحتلال الإنجليزي للمدينة؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Great Siege of Tangier in 1680–84, Moulay Ismail's campaign that ended the English occupation of the city; its sources are not yet checked on the page."
  es: "Boceto de ficha para el Gran Sitio de Tánger en 1680-1684, la campaña de Moulay Ismail que puso fin a la ocupación inglesa de la ciudad; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour le Grand Siège de Tanger en 1680-1684, la campagne de Moulay Ismail qui mit fin à l'occupation anglaise de la ville; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1680-84 میں تانگیر کے عظیم محاصرے کے لیے ڈرافٹ کارڈ، مولائے اسماعیل کی مہم جس نے شہر پر انگریزوں کے قبضے کو ختم کیا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1680-1684 yılları arasında gerçekleşen ve İngilizlerin şehri işgaline son veren Moulay Ismail'in seferberliğiyle sonuçlanan büyük Tanca kuşatmasının ön anlatımı; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang pengepungan besar Tangier dari tahun 1680 hingga 1684 M, kampanye Moulay Ismail yang mengakhiri pendudukan Inggris di kota tersebut; sumber-sumbernya belum ditinjau di halaman ini."
