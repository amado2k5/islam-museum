id: event/battle-of-raydah-288
class: event
kind: battle
label:
  ar: معركة ريدة سنة 288هـ
  en: The battle of Raydah, 288 AH
  ur: معرکۂ ریدہ، 288ھ
  fr: "La bataille de Raydah, 288 H"
  es: "La batalla de Raydah, 288 d. C."
  tr: "Hicri 288 yılında gerçekleşen Rida Muharebesi"
  id: "Pertempuran Rida pada tahun 288 Hijriah"
summary:
  ar: أتى صعصعة بن جعفر الهادي ومعه أهل قدم وغيرهم فحاربوه بريدة، فهزمهم وقتل منهم خلقاً عظيماً، وخرّب قصر ريدة في آخر جمادى الآخرة سنة 288هـ.
  en: Sa'sa'a ibn Ja'far came to al-Hadi with the people of Qudum and others and fought him at Raydah; al-Hadi routed them, killed a great many, and razed the palace of Raydah at the end of Jumada II 288 AH.
  ur: صعصعہ بن جعفر قدم کے لوگوں اور دوسروں کے ساتھ ہادی کے پاس آیا اور ریدہ میں ان سے لڑا؛ ہادی نے انہیں شکست دی، بہت سے مارے، اور جمادی الآخرہ 288ھ کے آخر میں ریدہ کا قصر ڈھا دیا۔
  fr: "Sa'sa'a ibn Ja'far vint contre al-Hadi avec les gens de Qudum et d'autres et le combattit à Raydah ; al-Hadi les mit en déroute, en tua un très grand nombre et rasa le palais de Raydah à la fin de Jumada II 288 H."
  es: "Sa'sa'a ibn Ja'far llegó a al-Hadi con la gente de Qudum y otros y lucharon contra él en Raydah; al-Hadi los derrotó, mató a muchos y arrasó el palacio de Raydah al final de Jumada II 288 AH."
  tr: "Sa'sa'ah bin Cafer el-Hadi, Kadem halkı ve diğerleriyle birlikte geldi ve Burayde'de onunla savaştılar. Onları yendi ve büyük bir kısmını öldürdü; Hicri 288 yılında Cemâde-i Ahiret ayının sonunda Burayde sarayını yerle bir etti."
  id: "Sa’sa’ah bin Ja’far al-Hadi datang bersama kaum Qadam dan lainnya, dan mereka memeranginya di Buraydah. Dia mengalahkan mereka dan membunuh banyak dari mereka, dan dia menghancurkan istana Buraydah pada akhir Jumada al-Akhirah tahun 288 H."
