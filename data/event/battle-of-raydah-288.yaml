label:
  ar: معركة ريدة سنة 288هـ
  en: The battle of Raydah, 288 AH
  ur: معرکۂ ریدہ، 288ھ
summary:
  ar: أتى صعصعة بن جعفر الهادي ومعه أهل قدم وغيرهم فحاربوه بريدة، فهزمهم وقتل منهم خلقاً عظيماً، وخرّب قصر ريدة في آخر جمادى الآخرة سنة 288هـ.
  en: Sa'sa'a ibn Ja'far came to al-Hadi with the people of Qudum and others and fought him at Raydah; al-Hadi routed them, killed a great many, and razed the palace of Raydah at the end of Jumada II 288 AH.
  ur: صعصعہ بن جعفر قدم کے لوگوں اور دوسروں کے ساتھ ہادی کے پاس آیا اور ریدہ میں ان سے لڑا؛ ہادی نے انہیں شکست دی، بہت سے مارے، اور جمادی الآخرہ 288ھ کے آخر میں ریدہ کا قصر ڈھا دیا۔
