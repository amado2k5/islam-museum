id: event/pen-and-paper-incident
class: event
kind: other
label: { en: "The pen-and-paper incident", ar: "قصة الكتاب يوم الخميس" }
summary:
  en: "On the Thursday four days before his death the Prophet said 'bring me [something] to write for you a document after which you will never go astray'; Umar said pain had overcome him and the Qur'an sufficed, the people of the house disputed, and the Prophet sent them away — an episode the traditions read differently."
  ar: "يوم الخميس قبل الوفاة بأربعة أيام قال النبي: هلمّوا أكتب لكم كتاباً لن تضلوا بعده، فقال عمر: قد غلب عليه الوجع وعندكم القرآن حسبكم كتاب الله، فاختلف أهل البيت واختصموا فلما أكثروا اللغط قال: قوموا عني — وتقرأه التقاليد قراءات مختلفة."
