id: event/pen-and-paper-incident
class: event
kind: other
label: { en: "The pen-and-paper incident", ar: "قصة الكتاب يوم الخميس", es: "El incidente del lápiz y el papel", fr: "L'incident du stylo et du papier", ur: "قلم اور کاغذ کا واقعہ" }
summary:
  en: "On the Thursday four days before his death the Prophet said 'bring me [something] to write for you a document after which you will never go astray'; Umar said pain had overcome him and the Qur'an sufficed, the people of the house disputed, and the Prophet sent them away — an episode the traditions read differently."
  ar: "يوم الخميس قبل الوفاة بأربعة أيام قال النبي: هلمّوا أكتب لكم كتاباً لن تضلوا بعده، فقال عمر: قد غلب عليه الوجع وعندكم القرآن حسبكم كتاب الله، فاختلف أهل البيت واختصموا فلما أكثروا اللغط قال: قوموا عني — وتقرأه التقاليد قراءات مختلفة."
  es: "El jueves, cuatro días antes de su muerte, el Profeta dijo: \"Traedme [algo] para que os escriba un documento tras el cual nunca os extraviaréis\". Umar dijo que el dolor lo había vencido y que el Corán era suficiente. La gente de la casa discutió, y el Profeta los despidió; un episodio que las tradiciones interpretan de manera diferente."
  fr: "Le jeudi, quatre jours avant sa mort, le Prophète dit: « Apportez-moi [quelque chose] pour que je vous écrive un document après lequel vous ne vous égarerez jamais. » Umar dit qu'il était accablé par la douleur et que le Coran lui suffisait. Les gens de la maison se disputèrent et le Prophète les renvoya — un épisode que les traditions relatent différemment."
  ur: "اپنی وفات سے چار دن پہلے جمعرات کو نبی نے فرمایا کہ میرے پاس تمہارے لیے ایک دستاویز لکھ کر لاؤ جس کے بعد تم کبھی گمراہ نہ ہو گے۔ عمر نے کہا کہ درد نے اس پر قابو پالیا اور قرآن کافی ہے، گھر کے لوگوں نے جھگڑا کیا، اور نبی نے انہیں رخصت کر دیا - ایک ایسا واقعہ جو روایات کو مختلف طریقے سے پڑھا جاتا ہے۔"
