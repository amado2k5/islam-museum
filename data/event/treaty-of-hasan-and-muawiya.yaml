tags: [islamic-economy-browser, islamic-economy-sukuk]
label: { ar: "صلح الحسن مع معاوية", en: "The Truce of Hasan with Muawiya", es: "La tregua de Hasan con Muawiya", fr: "La trêve de Hassan avec Muawiya", ur: "معاویہ کے ساتھ حسن کی صلح", tr: "Hasan, Muaviye ile barıştı", id: "Al-Hasan berdamai dengan Muawiyah" }
summary:
  ar: "وقع الصلح بين الحسن ومعاوية بمسكن، ثم انصرف الحسن إلى المدينة، فبعث معاوية بسر بن أبي أرطاة إلى البصرة في رجب سنة إحدى وأربعين {cite:tabari-tarikh-abu-al-fadl j.5 p.165} {cite:tabari-tarikh-abu-al-fadl j.5 p.168}. وعند السيوطي ولي الحسن الخلافة بعد قتل أبيه بمبايعة أهل الكوفة فأقام فيها ستة أشهر وأياماً ثم سار إليه معاوية فأرسل إليه الحسن يبذل له تسليم الأمر إليه على أن تكون له الخلافة من بعده وعلى ألا يطلب أحداً من أهل المدينة والحجاز والعراق بشيء مما كان أيام أبيه وعلى أن يقضي عنه ديونه فأجابه معاوية إلى ما طلب، وكان نزوله عنها سنة إحدى وأربعين في شهر ربيع الأول في المشهور فكان أصحابه يقولون يا عار المؤمنين فيقول العار خير من النار وقال لمن عذله لست بمذل المؤمنين ولكني كرهت أن أقتلكم على الملك، وقال لجبير بن نفير قد كان جماجم العرب في يدي يحاربون من حاربت ويسالمون من سالمت تركتها ابتغاء وجه الله وحقن دماء أمة محمد {cite:tarikh-khulafa-minhaj-1434 p. 317-318}. وعند المسعودي أشار عمرو بن العاص على معاوية بالكوفة أن يأمر الحسن فيخطب ليظهر عيه فكره ذلك ثم أطاعه، فقام الحسن في بديهته فقال إن الله هداكم بأولنا وحقن دماءكم بآخرنا وإن لهذا الأمر مدة والدنيا دول، ثم قال يا أهل الكوفة لو لم تذهل نفسي عنكم لثلاث خصال لذهلت مقتلكم لأبي وسلبكم ثقلي وطعنكم في بطني، وقد كانت الكوفة انتهبت سرادقه وطعنت بالخنجر في جوفه فلما تيقن ما نزل به انقاد إلى الصلح {cite:muruj-al-dhahab p. 720-721}"
  en: "The truce between Hasan and Muawiya was concluded at Maskin. Hasan then withdrew to Medina, and Muawiya sent Busr ibn Abi Artat to Basra in Rajab 41 AH {cite:tabari-tarikh-abu-al-fadl j.5 p.165} {cite:tabari-tarikh-abu-al-fadl j.5 p.168}. According to al-Suyuti, the people of Kufa had acclaimed Hasan caliph after his father's killing, and he stayed there six months and some days; then Muawiya marched against him, and Hasan offered to hand him the command, on condition that the succession pass to Hasan after him, that Muawiya pursue no one of the people of Medina, the Hijaz or Iraq for anything done in their father's days, and that Muawiya settle his debts. Muawiya agreed to what he asked. Hasan's stepping down was in 41 AH, in Rabi' I according to the best-known account. His companions cried, 'O shame of the believers!', and he answered that shame is better than the Fire; to one who reproached him he said that he had not humiliated the believers but disliked having to kill you over kingship; and to Jubayr ibn Nufayr he said that the chiefs of the Arabs had been in his hand, fighting whom he fought and making peace with whom he made peace, and that he had left it all seeking God's face and sparing the blood of Muhammad's community {cite:tarikh-khulafa-minhaj-1434 p. 317-318}. According to al-Mas'udi, Amr ibn al-As advised Muawiya at Kufa to order Hasan to preach, to expose his supposed poor eloquence; Muawiya disliked this but obeyed. Hasan spoke extemporaneously: God guided you through our first and spared your blood through our last, this affair has its term, and the world turns in rounds. Then he said, 'O people of Kufa, were my soul not distracted from you by three things, it would be distracted by your killing my father, plundering my baggage and stabbing me in the belly.' The Kufans had looted his pavilion and stabbed him with a dagger; when he saw what had befallen him he yielded to the truce {cite:muruj-al-dhahab p. 720-721}."
  es: "La tregua entre Hasan y Muawiya se concluyó en Maskin. Hasan se retiró entonces a Medina, y Muawiya envió a Busr ibn Abi Artat a Basora en Rajab 41 AH {cite:tabari-tarikh-abu-al-fadl j.5 p.165} {cite:tabari-tarikh-abu-al-fadl j.5 p.168}. Según al-Suyuti, la gente de Kufa había aclamado a Hasan como califa tras el asesinato de su padre, y permaneció allí seis meses y algunos días; luego Muawiya marchó contra él, y Hasan ofreció entregarle el mando, con la condición de que la sucesión pasara a Hasan después de él, que Muawiya no persiguiera a nadie de la gente de Medina, el Hiyaz o Irak por nada hecho en tiempos de su padre, y que Muawiya saldara sus deudas. Muawiya aceptó lo que se le pedía. La renuncia de Hasan ocurrió en el año 41 de la Hégira, en Rabi' I según el relato más conocido. Sus compañeros gritaron: «¡Oh, vergüenza de los creyentes!», y él respondió que la vergüenza es mejor que el Fuego; a quien lo reprochó le dijo que no había humillado a los creyentes, sino que le disgustaba tener que matarlo por el trono; y a Jubayr ibn Nufayr le dijo que los jefes de los árabes habían estado en sus manos, luchando contra quien él luchaba y haciendo la paz con quien él hacía la paz, y que lo había dejado todo buscando el rostro de Dios y perdonando la sangre de la comunidad de Mahoma {cite:tarikh-khulafa-minhaj-1434 p. 317-318}. Según al-Mas'udi, Amr ibn al-As aconsejó a Muawiya en Kufa que ordenara a Hasan predicar, para exponer su supuesta falta de elocuencia; a Muawiya no le gustó esto, pero obedeció. Hasan habló espontáneamente: «Dios os guió en nuestro primer encuentro y os perdonó la vida en el último; este asunto tiene su fin, y el mundo sigue su curso». Luego dijo: «¡Oh, gente de Kufa! Si mi alma no estuviera ya distraída de vosotros por tres cosas, lo estaría por el asesinato de mi padre, el saqueo de mi equipaje y la puñalada que me habéis hecho en el vientre». Los kufanos habían saqueado su pabellón y lo habían apuñalado con una daga; al ver lo que le había sucedido, aceptó la tregua {cita:muruj-al-dhahab págs. 720-721}."
  fr: "La trêve entre Hassan et Muawiya fut conclue à Maskin. Hassan se retira ensuite à Médine, et Muawiya envoya Busr ibn Abi Artat à Bassora en Rajab 41 AH (voir Tabari Tarikh Abu al-Fadl, vol. 5, p. 165 et 168). Selon al-Suyuti, les habitants de Koufa avaient proclamé Hassan calife après l'assassinat de son père, et il y demeura six mois et quelques jours. Muawiya marcha alors contre lui, et Hassan lui proposa de lui céder le commandement, à condition que la succession lui revienne, que Muawiya ne poursuive personne à Médine, au Hedjaz ou en Irak pour des actes commis du vivant de leur père, et qu'il règle ses dettes. Muawiya accepta ces conditions. L'abdication de Hassan eut lieu en 41 AH, au mois de Rabi' I, selon le récit le plus répandu. Ses compagnons s'écrièrent: « Honte aux croyants ! », et il répondit que la honte valait mieux que le Feu. À celui qui le réprimandait, il dit qu'il n'avait pas humilié les croyants, mais qu'il répugnait à devoir le tuer pour une question de royauté. Quant à Jubayr ibn Nufayr, il expliqua que les chefs arabes avaient toujours été sous son contrôle, combattant qui il combattait et faisant la paix avec qui il faisait la paix, et qu'il avait tout abandonné pour se tourner vers Dieu et épargner le sang de la communauté de Muhammad (voir: Tarikh-Khulafa-Minhaj-1434, p. 317-318). Selon al-Mas'udi, Amr ibn al-As conseilla à Mu'awiya, à Koufa, d'ordonner à Hassan de prêcher afin de mettre en évidence sa prétendue faiblesse d'éloquence. Mu'awiya, bien que réticent, obéit. Hasan prit la parole spontanément: « Dieu vous a guidés lors de notre première rencontre et a épargné votre sang lors de la dernière. Cette affaire a sa fin, et le monde tourne. » Puis il ajouta: « Ô gens de Koufa, si trois choses ne m’avaient pas détourné de vous, je le serais si vous aviez tué mon père, pillé mes bagages et poignardé mon ventre. » Les Koufanais avaient pillé son pavillon et l’avaient poignardé; voyant son sort, il accepta la trêve (voir: Muruj-al-Dhahab, p. 720-721)."
  ur: "حسن اور معاویہ کے درمیان مسکین کے مقام پر صلح ہوئی۔ حسن اس کے بعد مدینہ واپس چلا گیا اور معاویہ نے رجب 41 ہجری میں بسر بن ابی ارت کو بصرہ بھیج دیا۔ السیوطی کے مطابق، کوفہ کے لوگوں نے حسن کو اس کے والد کے قتل کے بعد خلیفہ قرار دیا تھا، اور وہ وہاں چھ ماہ اور کچھ دن رہے؛ پھر معاویہ نے اس کے خلاف مارچ کیا، اور حسن نے اس شرط پر اسے کمان سونپنے کی پیش کش کی کہ جانشینی اس کے بعد حسن کے پاس جائے، کہ معاویہ مدینہ، حجاز یا عراق کے لوگوں میں سے کسی کا پیچھا نہ کرے اور اپنے باپ کے زمانے میں کیے گئے کسی کام کے لیے معاویہ اپنا قرض ادا کرے۔ معاویہ نے جو پوچھا وہ مان گیا۔ حسن کی سبکدوشی 41ھ میں ربیع اول میں مشہور روایت کے مطابق ہوئی۔ اس کے ساتھیوں نے پکارا اے مومنوں کی شرم کرو، اس نے جواب دیا کہ شرم آگ سے بہتر ہے۔ جس نے اسے ملامت کی اس سے اس نے کہا کہ میں نے اہل ایمان کو ذلیل نہیں کیا بلکہ بادشاہت پر تمہیں قتل کرنا پسند نہیں کیا۔ اور جبیر بن نفیر سے اس نے کہا کہ عربوں کے سردار اس کے ہاتھ میں تھے جن سے اس نے جنگ کی اور جس سے صلح کی اس سے صلح کی اور اس نے یہ سب کچھ خدا کی رضا اور امت محمدیہ کے خون کو بہانے کے لیے چھوڑ دیا۔ 317-318}۔ المسعودی کے مطابق، عمرو بن العاص نے کوفہ میں معاویہ کو مشورہ دیا کہ وہ حسن کو تبلیغ کا حکم دیں، اس کی ناقص فصاحت کو بے نقاب کریں۔ معاویہ نے اسے ناپسند کیا لیکن اطاعت کی۔ حسن نے بے تکلفی سے کہا: اللہ تعالیٰ نے آپ کو ہمارے پہلے کے ذریعے ہدایت دی اور ہمارے آخر میں آپ کے خون کو بخش دیا، یہ معاملہ اپنی مدت میں ہے، اور دنیا چکر لگاتی ہے۔ پھر فرمایا اے اہل کوفہ اگر میری روح تم سے تین باتوں سے نہ ہٹ جاتی تو تمہارے میرے باپ کو قتل کرنے، میرا سامان لوٹنے اور پیٹ میں چھرا گھونپنے سے مشغول ہو جاتا۔ کوفوں نے اس کا برآمدہ لوٹ لیا اور خنجر سے وار کیا۔ جب اس نے دیکھا کہ اس پر کیا گزری ہے تو اس نے جنگ بندی کو تسلیم کر لیا۔ 720-721}۔"
  tr: "Hasan ile Muaviye arasındaki barış antlaşması Maskan'da gerçekleşti, ardından Hasan Medine'ye döndü ve Muaviye, 41. yılın Receb ayında Busr ibn Abi Artat'ı Basra'ya gönderdi. {Kaynak: Tabari-tarikh-abu-al-fadl c.5 s.165} {Kaynak: Tabari-tarikh-abu-al-fadl c.5 s.168}. Suyuti'ye göre, Hasan babasının öldürülmesinin ardından Kufa halkının biatıyla halifeliği üstlendi. Orada altı ay birkaç gün kaldı, ardından Muaviye ona doğru ilerledi. Hasan, halifeliği kendisine devretmek, kendisinden sonra halifeliği devralmak, babasının zamanında yaşananlar için Medine, Hicaz ve Irak halkından hiçbir şey talep etmemek ve borçlarını ödemek şartıyla ona bir elçi gönderdi. Muaviye, onun isteklerini kabul etti ve bilinen rivayete göre, 41. yılın Rebiü'l-Evvel ayında tahttan feragat etti. Sahabeleri, \"Ey müminlerin rezilliği!\" derlerdi, o da, \"Rezillik cehennem ateşinden daha iyidir\" derdi. Kendisini eleştirenlere, \"Müminleri küçük düşürmüyorum, fakat krallık uğruna sizi öldürmeyi istemedim\" dedi. Cübeyr ibn Nufeyr'e, \"Arapların başları benim elimdeydi; kiminle savaşırsam onunla savaşacak, kiminle barışırsam onunla barışacaklardı. Onları Allah'ın rızasını aramak ve Muhammed ümmetinin kanının dökülmesini önlemek için bıraktım.\" dedi. {Kaynak:tarikh-khulafa-minhaj-1434 s. 317-318} El-Mas'udi'ye göre, Amr ibn el-As, Kûfe'de Muaviye'ye, Hasan'dan bir vaaz vermesini ve böylece ondan etkilenmesini sağlamasını önerdi; ancak Muaviye bunu beğenmedi ve sonra ona itaat etti. Bunun üzerine Hasan kendiliğinden ayağa kalktı ve şöyle dedi: \"Allah sizi ilkimiz aracılığıyla doğru yola iletti ve sonumuz aracılığıyla kanınızı bağışladı. Bu işin bir zaman sınırı vardır ve dünya bir döngüdür.\" Sonra şöyle dedi: \"Ey Kûfe halkı, eğer ruhum üç şey yüzünden sizden uzaklaşmasaydı, babamı öldürmeniz, mallarımı yağmalamanız ve beni karnımdan bıçaklamanız yüzünden uzaklaşacaktı.\" Kûfe halkı onun çadırını yağmalamış ve onu karnından hançerle bıçaklamıştı. Başına gelenlerden emin olunca, barışa teslim oldu. {kaynak: Muruj-al-Dhahab s. 720-721}"
  id: "Perjanjian damai antara Al-Hasan dan Muawiyah terjadi di Maskan, kemudian Al-Hasan kembali ke Madinah, dan Muawiyah mengirim Busr ibn Abi Artat ke Basra pada bulan Rajab tahun empat puluh satu. {cite:tabari-tarikh-abu-al-fadl j.5 p.165} {cite:tabari-tarikh-abu-al-fadl j.5 p.168}. Menurut Al-Suyuti, Al-Hasan mengambil alih kekhalifahan setelah ayahnya terbunuh dengan dukungan penduduk Kufa. Ia tinggal di sana selama enam bulan dan beberapa hari, kemudian Muawiyah bergerak menuju ke arahnya. Al-Hasan mengirim utusan kepadanya menawarkan untuk menyerahkan masalah tersebut kepadanya dengan syarat bahwa ia akan memiliki kekhalifahan setelahnya, dan bahwa ia tidak akan menuntut apa pun dari penduduk Madinah, Hijaz, dan Irak atas apa pun yang terjadi selama masa pemerintahan ayahnya, dan bahwa ia akan melunasi hutang-hutangnya. Muawiyah menyetujui permintaannya, dan pengunduran dirinya terjadi pada tahun 41 pada bulan Rabi' al-Awwal, menurut riwayat yang terkenal. Para sahabatnya biasa berkata, \"Wahai aib bagi orang-orang beriman!\" dan dia akan menjawab, \"Aib lebih baik daripada api neraka.\" Dia berkata kepada mereka yang mengkritiknya, \"Aku tidak menghina orang-orang beriman, tetapi aku tidak suka membunuh kalian demi kerajaan.\" Dia berkata kepada Jubayr ibn Nufayr, \"Kepala orang-orang Arab berada di tanganku; mereka akan memerangi siapa pun yang aku perangi dan berdamai dengan siapa pun yang aku ajak berdamai. Aku meninggalkan mereka untuk mencari keberkahan Allah dan untuk mencegah pertumpahan darah umat Muhammad.\" {cite:tarikh-khulafa-minhaj-1434 p. 317-318}. Dan menurut Al-Mas’udi, Amr ibn al-As menyarankan kepada Mu’awiya di Kufa agar ia memerintahkan al-Hasan untuk memberikan khutbah sehingga khutbah itu akan memengaruhinya, tetapi ia tidak menyukainya dan kemudian menurutinya. Maka al-Hasan berdiri secara spontan dan berkata: Allah membimbingmu melalui orang pertama di antara kami dan menyelamatkan darahmu melalui orang terakhir di antara kami, dan perkara ini memiliki batas waktu dan dunia adalah sebuah siklus. Kemudian ia berkata: Wahai penduduk Kufa, jika jiwaku tidak teralihkan dari kalian oleh tiga hal, jiwaku akan teralihkan oleh pembunuhan ayahku, penjarahan harta bendaku, dan penusukan perutku. Dan Kufa telah menjarah tendanya dan menusuk perutnya dengan belati. Ketika ia yakin akan apa yang telah menimpanya, ia menerima perdamaian. {kutip:muruj-al-dhahab hlm. 720-721}"
