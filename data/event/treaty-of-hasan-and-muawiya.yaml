label: { ar: "صلح الحسن مع معاوية" }
summary:
  ar: "وقع الصلح بين الحسن ومعاوية بمسكن، ثم انصرف الحسن إلى المدينة، فبعث معاوية بسر بن أبي أرطاة إلى البصرة في رجب سنة إحدى وأربعين {cite:tabari-tarikh-abu-al-fadl j.5 p.165} {cite:tabari-tarikh-abu-al-fadl j.5 p.168}. وعند السيوطي ولي الحسن الخلافة بعد قتل أبيه بمبايعة أهل الكوفة فأقام فيها ستة أشهر وأياماً ثم سار إليه معاوية فأرسل إليه الحسن يبذل له تسليم الأمر إليه على أن تكون له الخلافة من بعده وعلى ألا يطلب أحداً من أهل المدينة والحجاز والعراق بشيء مما كان أيام أبيه وعلى أن يقضي عنه ديونه فأجابه معاوية إلى ما طلب، وكان نزوله عنها سنة إحدى وأربعين في شهر ربيع الأول في المشهور فكان أصحابه يقولون يا عار المؤمنين فيقول العار خير من النار وقال لمن عذله لست بمذل المؤمنين ولكني كرهت أن أقتلكم على الملك، وقال لجبير بن نفير قد كان جماجم العرب في يدي يحاربون من حاربت ويسالمون من سالمت تركتها ابتغاء وجه الله وحقن دماء أمة محمد {cite:tarikh-khulafa-minhaj-1434 p. 317-318}.، وعند المسعودي أشار عمرو بن العاص على معاوية بالكوفة أن يأمر الحسن فيخطب ليظهر عيه فكره ذلك ثم أطاعه، فقام الحسن في بديهته فقال إن الله هداكم بأولنا وحقن دماءكم بآخرنا وإن لهذا الأمر مدة والدنيا دول، ثم قال يا أهل الكوفة لو لم تذهل نفسي عنكم لثلاث خصال لذهلت مقتلكم لأبي وسلبكم ثقلي وطعنكم في بطني، وقد كانت الكوفة انتهبت سرادقه وطعنت بالخنجر في جوفه فلما تيقن ما نزل به انقاد إلى الصلح {cite:muruj-al-dhahab p. 720-721} ويذكر الكتاب أن الحسن نزل عن الأمر لمعاوية بعد أن اشترط أن يأخذ من بيت مال الكوفة خمسة آلاف ألف درهم، وألا يُسب علي وهو يسمع، فاصطلحا على ذلك {cite:bakr-umayyad-state-1134715 p. 115-116}."
