id: event/treaty-of-hasan-and-muawiya
class: event
kind: treaty
label: { ar: "صلح الحسن مع معاوية", en: "The Truce of Hasan with Muawiya" }
summary:
  ar: "وقع الصلح بين الحسن ومعاوية بمسكن، ثم انصرف الحسن إلى المدينة، فبعث معاوية بسر بن أبي أرطاة إلى البصرة في رجب سنة إحدى وأربعين {cite:tabari-tarikh-abu-al-fadl j.5 p.165} {cite:tabari-tarikh-abu-al-fadl j.5 p.168}. وعند السيوطي ولي الحسن الخلافة بعد قتل أبيه بمبايعة أهل الكوفة فأقام فيها ستة أشهر وأياماً ثم سار إليه معاوية فأرسل إليه الحسن يبذل له تسليم الأمر إليه على أن تكون له الخلافة من بعده وعلى ألا يطلب أحداً من أهل المدينة والحجاز والعراق بشيء مما كان أيام أبيه وعلى أن يقضي عنه ديونه فأجابه معاوية إلى ما طلب، وكان نزوله عنها سنة إحدى وأربعين في شهر ربيع الأول في المشهور فكان أصحابه يقولون يا عار المؤمنين فيقول العار خير من النار وقال لمن عذله لست بمذل المؤمنين ولكني كرهت أن أقتلكم على الملك، وقال لجبير بن نفير قد كان جماجم العرب في يدي يحاربون من حاربت ويسالمون من سالمت تركتها ابتغاء وجه الله وحقن دماء أمة محمد {cite:tarikh-khulafa-minhaj-1434 p. 317-318}. وعند المسعودي أشار عمرو بن العاص على معاوية بالكوفة أن يأمر الحسن فيخطب ليظهر عيه فكره ذلك ثم أطاعه، فقام الحسن في بديهته فقال إن الله هداكم بأولنا وحقن دماءكم بآخرنا وإن لهذا الأمر مدة والدنيا دول، ثم قال يا أهل الكوفة لو لم تذهل نفسي عنكم لثلاث خصال لذهلت مقتلكم لأبي وسلبكم ثقلي وطعنكم في بطني، وقد كانت الكوفة انتهبت سرادقه وطعنت بالخنجر في جوفه فلما تيقن ما نزل به انقاد إلى الصلح {cite:muruj-al-dhahab p. 720-721}"
  en: "The truce between Hasan and Muawiya was concluded at Maskin. Hasan then withdrew to Medina, and Muawiya sent Busr ibn Abi Artat to Basra in Rajab 41 AH {cite:tabari-tarikh-abu-al-fadl j.5 p.165} {cite:tabari-tarikh-abu-al-fadl j.5 p.168}. According to al-Suyuti, the people of Kufa had acclaimed Hasan caliph after his father's killing, and he stayed there six months and some days; then Muawiya marched against him, and Hasan offered to hand him the command, on condition that the succession pass to Hasan after him, that Muawiya pursue no one of the people of Medina, the Hijaz or Iraq for anything done in their father's days, and that Muawiya settle his debts. Muawiya agreed to what he asked. Hasan's stepping down was in 41 AH, in Rabi' I according to the best-known account. His companions cried, 'O shame of the believers!', and he answered that shame is better than the Fire; to one who reproached him he said that he had not humiliated the believers but disliked having to kill you over kingship; and to Jubayr ibn Nufayr he said that the chiefs of the Arabs had been in his hand, fighting whom he fought and making peace with whom he made peace, and that he had left it all seeking God's face and sparing the blood of Muhammad's community {cite:tarikh-khulafa-minhaj-1434 p. 317-318}. According to al-Mas'udi, Amr ibn al-As advised Muawiya at Kufa to order Hasan to preach, to expose his supposed poor eloquence; Muawiya disliked this but obeyed. Hasan spoke extemporaneously: God guided you through our first and spared your blood through our last, this affair has its term, and the world turns in rounds. Then he said, 'O people of Kufa, were my soul not distracted from you by three things, it would be distracted by your killing my father, plundering my baggage and stabbing me in the belly.' The Kufans had looted his pavilion and stabbed him with a dagger; when he saw what had befallen him he yielded to the truce {cite:muruj-al-dhahab p. 720-721}."
