label: { ar: "خراسان في خلافة علي", en: "Khurasan under Ali's Caliphate", es: "Khurasan bajo el califato de Ali", fr: "Khurasan sous le califat d'Ali", ur: "خراسان علی کی خلافت کے تحت" }
summary:
  ar: "قدم ماهويه مرزبان مرو على علي بن أبي طالب في خلافته وهو بالكوفة فكتب له إلى الدهاقين والأساورة والدهشلارين أن يؤدوا إليه الجزية فانتقضت عليهم خراسان فبعث جعدة بن هبيرة المخزومي وأمه أم هانيء بنت أبي طالب فلم يفتحها ولم تر خراسان ملتاثة حتى قتل علي وقال أبو عبيدة أول عمال علي على خراسان عبد الرحمن بن أبرى مولى خزاعة ثم جعدة بن هبيرة بن أبي وهب بن عمرو بن عائذ بن عمران بن مخزوم."
  en: "Mahwiya, marzban of Marw, came to Ali in his caliphate at Kufa; Ali wrote the dahqans, asawira and dahshalarin to render him the jizya — whereupon Khurasan broke away. Ali sent Ja'da ibn Hubayra al-Makhzumi, his mother Umm Hani' bint Abi Talib, who could not recover it; Khurasan never wore cloth again till Ali's death. Abu Ubayda: Ali's first agent was Abd al-Rahman ibn Abra, Khuza'a's mawla, then Ja'da."
  es: "Mahwiya, el gobernador de Marw, visitó a Ali durante su califato en Kufa. Ali escribió a los dahqans, asawira y dahshalarin para exigirle la jizya (impuesto de capitación), tras lo cual Jorasán se separó. Ali envió a Ja'da ibn Hubayra al-Makhzumi, cuya madre era Umm Hani' bint Abi Talib, quien no pudo recuperarlo. Jorasán no volvió a vestir ropa hasta la muerte de Ali. Abu Ubayda: El primer agente de Ali fue Abd al-Rahman ibn Abra, mawla de Khuza'a, y luego Ja'da."
  fr: "Mahwiya, gouverneur de Marw, vint trouver Ali durant son califat à Koufa. Ali écrivit aux dahqans, asawira et dahshalarin pour exiger la jizya (impôt de capitation), ce qui provoqua la sécession du Khorasan. Ali envoya Ja'da ibn Hubayra al-Makhzumi, fils d'Umm Hani' bint Abi Talib, qui ne parvint pas à récupérer l'argent. Le Khorasan ne porta plus jamais de vêtements jusqu'à la mort d'Ali. Abu Ubayda: Le premier agent d'Ali fut Abd al-Rahman ibn Abra, le mawla de Khuza'a, puis Ja'da."
  ur: "کوفہ میں اپنی خلافت کے دوران مرو کا گورنر مہویہ علی کے پاس آیا۔ علی نے دہقان، عسویرہ اور دہشالرین کو لکھا کہ اس سے جزیہ ⁦(پول ٹیکس)⁩ کا مطالبہ کریں- جس کے بعد خراسان ٹوٹ گیا۔ علی نے جدہ بن ہبیرہ المخزومی کو بھیجا، جن کی والدہ ام ہانی بنت ابی طالب تھیں، وہ اسے بحال نہ کر سکیں۔ خراسان نے علی کی وفات تک دوبارہ کبھی لباس نہیں پہنا۔ ابو عبیدہ: علی کا پہلا ایجنٹ عبدالرحمٰن بن ابرہ تھا، خزاعہ کا مولا، پھر جعدہ۔"
