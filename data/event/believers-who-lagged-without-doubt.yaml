summary:
  ar: "ذكر ابن إسحاق أن نفراً من المسلمين أبطأت بهم النية عن النبي حتى تخلفوا عنه عن غير شك ولا ارتياب، وسمّى منهم كعب بن مالك ومرارة بن الربيع وهلال بن أمية وأبا خيثمة، ووصفهم بأنهم نفر صدق لا يُتّهمون في إسلامهم."
  en: Ibn Ishaq records that a number of Muslims whose resolve lagged stayed behind the Prophet without doubt or suspicion, naming among them Ka'b ibn Malik, Murara ibn al-Rabi', Hilal ibn Umayya and Abu Khaythama, and describing them as truthful men whose Islam was not to be questioned.
