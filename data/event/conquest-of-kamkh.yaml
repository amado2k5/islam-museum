id: event/conquest-of-kamkh
class: event
kind: conquest
label: { ar: "فتح حصن كَمْخ", en: "The Taking of Hisn Kamkh", es: "La toma de Hisn Kamkh", fr: "La prise de Hisn Kamkh", ur: "حسن کامخ کا لینا", tr: "Kamkh kalesinin fethi", id: "Penaklukan benteng Kamkh" }
summary:
  ar: "عند البلاذري: غزا حبيب بن مسلمة حصن كمخ بعد فتح شمشاط فلم يقدر عليه وغزاه صفوان فلم يمكنه فتحه، ثم غزاه صفوان في سنة 59 — وهي السنة التي مات فيها — ومعه عمير بن الحباب السلمي فعلا عمير سوره ولم يزل يجالد عليه وحده حتى كشف الروم وصعد المسلمون ففُتح لعمير بن الحباب وبذلك كان يفخر ويفاخر له؛ ثم إن الروم غلبوا عليه ففتحه مسلمة بن عبد الملك ولم يزل يفتح وتغلب عليه الروم حتى كانت سنة 149 شخص المنصور عن بغداد حتى نزل حديثة الموصل ثم أغزى منها الحسن بن قحطبة وبعده محمد بن الأشعث وجعل عليها العباس بن محمد وأمره أن يغزو بهم كمخ — فبات محمد بن الأشعث بآمد وسار العباس والحسن حتى صارا إلى ملطية فحملا منها الميرة ثم أناخا على كمخ وأمر العباس بنصب المجانيق عليه فجعلوا على حصنهم خشب العرعر لئلا يضر به حجارة المنجنيق ورموا المسلمين فقتلوا منهم بالحجارة مائتي رجل فاتخذ المسلمون الدبابات وقاتلوا قتالاً شديداً حتى فتحوه، وكان مع العباس مطر الوراق؛ ثم إن الروم أغلقوا كمخ فلما كانت سنة 177 غزا محمد بن عبد الله بن عبد الرحمن بن أبي عمرو الأنصاري — وهو عامل عبد الملك بن صالح على شمشاط — ففتحه ودخله لأربع عشرة ليلة خلت من ربيع الآخر، فلم يزل مفتوحاً حتى كان زمن محمد بن الرشيد فهرب أهله وغلبت عليه الروم — ويقال إن عبيد الله بن الأقطع دفعه إليهم — ثم إن عبد الله بن طاهر فتحه في خلافة المأمون فكان في أيدي المسلمين حتى لطف قوم من نصارى شمشاط ليقلّا وبقراط بن أشوط بطريق خلاط في دفعه إلى الروم والتقرب إليهم بذلك بسبب ضياع لهم في عمل شمشاط."
  en: "In al-Baladhuri: Habib ibn Maslama raided the fortress of Kamkh after taking Shimshat without success, as did Safwan; then in year 59 — the year he died — Safwan raided it with Umayr ibn al-Habab al-Sulami, who scaled the wall and fought alone until the Byzantines gave way and the Muslims climbed — it fell to Umayr ibn al-Habab, his lasting glory; the Byzantines retook it, Maslama ibn Abd al-Malik took it again, and it kept changing hands until year 149, when al-Mansur marched from Baghdad to Hadithat al-Mawsil, sent al-Hasan ibn Qahtaba then Muhammad ibn al-Ash'ath, and set al-Abbas ibn Muhammad over the expedition against Kamkh — Muhammad ibn al-Ash'ath remaining at Amid — al-Abbas and al-Hasan reached Malatya, took provisions, camped on Kamkh, and al-Abbas ordered mangonels set; the defenders hung juniper wood over their fort so the stones would not bite, and stoned the Muslims killing two hundred men, whereupon the Muslims employed armoured shelters and fought bitterly until they took it — Matar al-Warraq was with al-Abbas; the Byzantines re-seized it, and in year 177 Muhammad ibn Abdallah ibn Abd al-Rahman ibn Abi Amr al-Ansari — Abd al-Malik ibn Salih's governor of Shimshat — took it, entering on the fourteenth of Rabi' II; it stayed Muslim until Muhammad ibn al-Rashid's time when its people fled — or, it is said, Ubaydallah ibn al-Aqta' handed it over — then Abdallah ibn Tahir took it in al-Ma'mun's caliphate, and it remained in Muslim hands until a group of Shimshat's Christians conspired with Yiqala and Baqrat ibn Ashut by way of Khilat to deliver it to the Byzantines over estates in the Shimshat district."
  es: "En al-Baladhuri: Habib ibn Maslama asaltó la fortaleza de Kamkh después de tomar Shimshat sin éxito, al igual que Safwan; luego, en el año 59 —el año de su muerte— Safwan la asaltó con Umayr ibn al-Habab al-Sulami, quien escaló la muralla y luchó solo hasta que los bizantinos cedieron y los musulmanes escalaron; cayó en manos de Umayr ibn al-Habab, su gloria eterna; Los bizantinos la reconquistaron, Maslama ibn Abd al-Malik la tomó de nuevo, y siguió cambiando de manos hasta el año 149, cuando al-Mansur marchó desde Bagdad a Hadithat al-Mawsil, envió a al-Hasan ibn Qahtaba y luego a Muhammad ibn al-Ash'ath, y puso a al-Abbas ibn Muhammad al mando de la expedición contra Kamkh — Muhammad ibn al-Ash'ath permaneció en Amid — al-Abbas y al-Hasan llegaron a Malatya, tomaron provisiones, acamparon en Kamkh, y al-Abbas ordenó colocar mangoneles; los defensores colgaron madera de enebro sobre su fortaleza para que las piedras no mordieran, y apedrearon a los musulmanes matando a doscientos hombres, tras lo cual los musulmanes emplearon refugios blindados y lucharon encarnizadamente hasta que la tomaron — Matar al-Warraq estaba con al-Abbas; Los bizantinos la reconquistaron, y en el año 177 Muhammad ibn Abdallah ibn Abd al-Rahman ibn Abi Amr al-Ansari —gobernador de Shimshat por Abd al-Malik ibn Salih— la tomó, entrando el catorce de Rabi' II; permaneció musulmana hasta la época de Muhammad ibn al-Rashid, cuando su gente huyó —o, según se dice, Ubaydallah ibn al-Aqta' la entregó—, luego Abdallah ibn Tahir la tomó en el califato de al-Ma'mun, y permaneció en manos musulmanas hasta que un grupo de cristianos de Shimshat conspiró con Yiqala y Baqrat ibn Ashut por medio de Khilat para entregarla a los bizantinos a cambio de propiedades en el distrito de Shimshat."
  fr: "Dans al-Baladhuri: Habib ibn Maslama a attaqué la forteresse de Kamkh après avoir pris Shimshat sans succès, tout comme Safwan; puis en l'an 59 — l'année de sa mort — Safwan l'a attaquée avec Umayr ibn al-Habab al-Sulami, qui a escaladé le mur et combattu seul jusqu'à ce que les Byzantins cèdent et que les musulmans grimpent — elle est tombée aux mains d'Umayr ibn al-Habab, sa gloire durable; Les Byzantins la reprirent, Maslama ibn Abd al-Malik la reprit, et elle continua de changer de mains jusqu'en 149, lorsque al-Mansur marcha de Bagdad à Hadithat al-Mawsil, envoya al-Hasan ibn Qahtaba puis Muhammad ibn al-Ash'ath, et confia à al-Abbas ibn Muhammad l'expédition contre Kamkh — Muhammad ibn al-Ash'ath restant à Amid — al-Abbas et al-Hasan atteignirent Malatya, prirent des provisions, campèrent sur Kamkh, et al-Abbas ordonna la mise en place de mangonneaux; les défenseurs suspendirent du bois de genévrier au-dessus de leur fort pour que les pierres ne le blessent pas, et lapidèrent les musulmans, tuant deux cents hommes, après quoi les musulmans utilisèrent des abris blindés et combattirent âprement jusqu'à ce qu'ils s'en emparent — Matar al-Warraq était avec al-Abbas; Les Byzantins la reprirent, et en l'an 177, Muhammad ibn Abdallah ibn Abd al-Rahman ibn Abi Amr al-Ansari — gouverneur de Shimshat sous Abd al-Malik ibn Salih — s'en empara, y entrant le quatorzième jour de Rabi' II; elle resta musulmane jusqu'à l'époque de Muhammad ibn al-Rashid, lorsque ses habitants s'enfuirent — ou, dit-on, Ubaydallah ibn al-Aqta' la leur remit — puis Abdallah ibn Tahir la prit dans le califat d'al-Ma'mun, et elle resta aux mains des musulmans jusqu'à ce qu'un groupe de chrétiens de Shimshat conspire avec Yiqala et Baqrat ibn Ashut par l'intermédiaire de Khilat pour la livrer aux Byzantins en échange de terres dans le district de Shimshat."
  ur: "البلادوری میں ہے: حبیب ابن مسلمہ نے شمشات کو حاصل کرنے کے بعد کامخ کے قلعے پر چھاپہ مارا، جیسا کہ صفوان نے کیا۔ پھر سنہ 59 میں - جس سال اس کی موت ہوئی - صفوان نے عمیر بن الحباب السلمی کے ساتھ اس پر چڑھائی کی، جس نے دیوار کو ترازو کیا اور تنہا لڑا یہاں تک کہ بازنطینیوں نے راستہ دیا اور مسلمان چڑھ گئے - یہ عمیر بن الحباب کے پاس گرا، جو اس کی دیرپا شان ہے۔ بازنطینیوں نے اسے دوبارہ لے لیا، مسلمہ ابن عبد الملک نے اسے دوبارہ لے لیا، اور یہ سنہ 149 تک ہاتھ بدلتا رہا، جب المنصور نے بغداد سے حدیت الموسل کی طرف کوچ کیا، حسن بن قحطبہ کو پھر محمد ابن اشعث کو بھیجا، اور محمد ابن عباس کو محمد بن ابن عباس کے خلاف بغاوت کر دی۔ امید میں رہ کر - العباس اور الحسن ملاتیہ پہنچے، سامان لے لیا، کامخ پر ڈیرہ ڈالا، اور عباس نے منگونل سیٹ کرنے کا حکم دیا۔ محافظوں نے اپنے قلعے پر جونیپر کی لکڑی لٹکا دی تاکہ پتھر کاٹ نہ جائیں، اور مسلمانوں پر پتھراؤ کیا جس سے دو سو آدمی مارے گئے، اس کے بعد مسلمانوں نے بکتر بند پناہ گاہیں لگائیں اور اس پر قبضہ کرنے تک تلخ لڑائی ہوئی- مطر الوراق العباس کے ساتھ تھا۔ بازنطینیوں نے اس پر دوبارہ قبضہ کر لیا، اور 177 میں محمد بن عبداللہ ابن عبدالرحمٰن ابن ابی عمرو الانصاری - عبد الملک ابن صالح کے گورنر شمشات - نے اسے لے لیا، چودہ ربیع دوم کو داخل ہوئے۔ یہ اس وقت تک مسلم رہا جب تک کہ محمد بن الرشید کے دور میں جب اس کے لوگ بھاگ گئے یا کہا جاتا ہے کہ عبیداللہ ابن الاقطا نے اسے اس کے حوالے کر دیا - پھر عبداللہ بن طاہر نے اسے مامون کی خلافت میں لے لیا، اور یہ اس وقت تک مسلمانوں کے ہاتھ میں رہا جب تک کہ شمشت کے عیسائیوں کے ایک گروہ نے اسے بعثت الخلیل کے ساتھ سازش کرکے بعید اللہ ابن الاقطا کے حوالے کر دیا۔ بازنطینیوں نے شمشات ضلع میں جاگیروں پر قبضہ کیا۔"
  tr: "El-Baladhuri'ye göre: Habib bin Müslimah, Samşat'ın fethinden sonra Kamkh kalesine saldırdı, ancak onu fethedemedi. Safvan saldırdı, o da fethedemedi. Sonra Safvan, 59 yılında -ki bu onun öldüğü yıldır- Umair bin Al-Habab Al-Sulami ile birlikte tekrar saldırdı. Umair surlara tırmandı ve Romalıları açığa çıkarana kadar tek başına savaşmaya devam etti, Müslümanlar da yukarı çıktı. Böylece surlar Umair bin Al-Habab'ın eline geçti ve Umair bununla övünür, gurur duyardı. Sonra Romalılar surları ele geçirdi, Maslama ibn Abd al-Malik surları fethetti ve surlar 149 yılına kadar fethedilmeye ve Romalıların ele geçirmesine devam etti. Al-Mansur Bağdat'tan ayrılıp Musul'daki Haditha'ya yerleşti, oradan al-Hasan ibn Qahtaba'yı, ondan sonra da Muhammed ibn al-Ash'ath'ı gönderdi ve al-Abbas ibn Muhammed'i başına atadı ve onlarla birlikte Kamkh'a baskın yapmasını emretti. Muhammed ibn el-Eş'at geceyi Amid'de geçirdi ve el-Abbas ile el-Hasan Malatya'ya kadar yürüdüler, oradan erzak taşıdılar, sonra Kamkh'ta kamp kurdular ve el-Abbas, kaleye karşı mancınıkların kurulmasını emretti. Bunun üzerine, mancınık taşlarının kaleye zarar vermemesi için kalenin üzerine ardıç ağacı ördüler ve Müslümanlara taş attılar ve taşlarla iki yüz Müslüman askeri öldürdüler. Bunun üzerine Müslümanlar kuşatma makinelerini alıp şiddetli bir savaş verdiler ve kaleyi ele geçirdiler. Matar el-Varrak, el-Abbas'ın yanındaydı. Sonra Romalılar Kumah'ı kuşattılar. 177 yılı geldiğinde, Abdül Malik bin Salih'in Samosata'daki temsilcisi olan Muhammed bin Abdullah bin Abdül Rahman bin Abi Amr el-Ensari, kaleyi fethetti ve Rebiü'l-Ahir ayının sonundan on dört gece önce kaleye girdi. Muhammed bin el-Raşid zamanına kadar açık kaldı, sonra halkı kaçtı ve Romalılar kontrolü ele geçirdi - ve Ubeydullah bin el-Akta'nın burayı onlara teslim ettiği söylenir - daha sonra Abdullah bin Tahir, el-Ma'mun halifeliği sırasında burayı fethetti, böylece Samosata'daki bazı Hristiyanlar Likla ve Bukarat bin Aşvat'a (Hilafet Yolu) iyilik yapıp burayı Romalılara teslim edene ve böylece Samosata'daki kayıpları nedeniyle onlara yaklaşana kadar Müslümanların elinde kaldı."
  id: "Menurut Al-Baladhuri: Habib bin Muslimah menyerang benteng Kamkh setelah penaklukan Samshat, tetapi ia tidak mampu menaklukkannya. Safwan menyerangnya, tetapi ia juga tidak mampu menaklukkannya. Kemudian Safwan menyerangnya pada tahun 59 - yaitu tahun kematiannya - dan bersamanya ada Umair bin Al-Habab Al-Sulami. Umair memanjat temboknya dan terus bertempur sendirian hingga ia membongkar pertahanan Romawi dan kaum Muslim naik ke atas, sehingga kota itu ditaklukkan untuk Umair bin Al-Habab, dan itulah yang selalu ia banggakan dan banggakan. Kemudian Romawi menaklukkannya, sehingga Maslama ibn Abd al-Malik menaklukkannya, dan kota itu terus ditaklukkan dan dikuasai Romawi hingga tahun 149. Al-Mansur meninggalkan Baghdad hingga menetap di Haditha, Mosul, kemudian ia mengirim al-Hasan ibn Qahtaba dari sana, dan setelahnya Muhammad ibn al-Ash’ath, dan ia menunjuk al-Abbas ibn Muhammad untuk memimpinnya dan memerintahkannya untuk menyerang Kamkh bersama mereka. Maka Muhammad bin al-Ash’ath bermalam di Amid, dan al-Abbas serta al-Hasan berbaris hingga mencapai Malatya, lalu mereka membawa perbekalan dari sana, kemudian mereka berkemah di Kamkh, dan al-Abbas memerintahkan agar ketapel dipasang untuk menyerangnya, sehingga mereka meletakkan kayu juniper di benteng mereka agar batu-batu dari ketapel tidak membahayakannya, dan mereka melempari batu ke arah kaum Muslimin, dan mereka membunuh dua ratus orang dari mereka dengan batu. Maka kaum Muslimin mengambil mesin pengepungan dan bertempur dengan sengit hingga mereka menaklukkannya, dan Matar al-Warraq berada di pihak al-Abbas. Kemudian bangsa Romawi menutup Kumakh. Ketika tahun 177 tiba, Muhammad bin Abdullah bin Abdul Rahman bin Abi Amr al-Ansari - yang merupakan agen Abdul Malik bin Salih atas Samosata - menaklukkannya dan memasukinya empat belas malam sebelum berakhirnya Rabi’ al-Akhir. Benteng itu tetap terbuka hingga zaman Muhammad bin al-Rashid, sehingga penduduknya melarikan diri dan bangsa Romawi menguasainya - dan dikatakan bahwa Ubaid Allah bin al-Aqta' menyerahkannya kepada mereka - kemudian Abdullah bin Tahir menaklukkannya selama kekhalifahan al-Ma'mun, sehingga berada di tangan kaum Muslim hingga beberapa orang Kristen dari Samosata berbaik hati kepada Liqla dan Buqrat bin Ashwat, jalan Khilat, dengan menyerahkannya kepada bangsa Romawi dan mendekatkan diri kepada mereka karena kerugian mereka dalam penaklukan Samosata."
