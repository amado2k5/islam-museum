label: { ar: "هلاك شبيب الخارجي", en: "Death of Shabib the Kharijite", es: "Muerte de Shabib el jariyí", fr: "Mort de Shabib le Kharijite", ur: "شبیب خارجی کی موت", tr: "Şabib el-Harji'nin ölümü", id: "Kematian Shabib al-Kharji" }
summary:
  ar: "في سنة سبع وسبعين في قول هشام بن محمد ذكر الطبري هلاك شبيب، وفي قول غيره كان هلاكه سنة ثمان وسبعين {cite:tabari-tarikh-abu-al-fadl j.6 p.279}. وعند المسعودي نفر به فرسه على جسر دجيل وعليه درع ومغفر فألقاه في الماء ميتاً، فشق الحجاج بطنه واستخرج قلبه فإذا هو كالحجر، فشقه فإذا في داخله قلب صغير كالكرة، فشقه فإذا علقة دم في داخله {cite:muruj-al-dhahab p. 130}"
  en: "In the year 77, on the word of Hisham ibn Muhammad, al-Tabari mentions the death of Shabib; in another account his death was in 78 {cite:tabari-tarikh-abu-al-fadl j.6 p.279}. In al-Mas'udi his horse bolted with him and threw him onto the Dujayl bridge; he was wearing a coat of mail and a helmet, and he fell into the water dead. Al-Hajjaj slit open his belly and drew out his heart, which was like a stone; when he cut that, inside was a small heart like a ball; when he cut that, inside it was a clot of blood {cite:muruj-al-dhahab p. 130}."
  es: "En el año 77, según la palabra de Hisham ibn Muhammad, al-Tabari menciona la muerte de Shabib; en otro relato, su muerte fue en el año 78 {cite:tabari-tarikh-abu-al-fadl j.6 p.279}. En al-Mas'udi, su caballo se desbocó con él y lo arrojó sobre el puente Dujayl; llevaba una cota de malla y un casco, y cayó muerto al agua. Al-Hajjaj le abrió el vientre y le sacó el corazón, que era como una piedra; cuando lo cortó, dentro había un pequeño corazón como una bola; cuando cortó este, dentro había un coágulo de sangre {cite:muruj-al-dhahab p. 130}."
  fr: "En l'an 77, d'après Hisham ibn Muhammad, al-Tabari mentionne la mort de Shabib; selon un autre récit, sa mort aurait eu lieu en 78 (cf. Tabari-Tarikh-Abu-al-Fadl, vol. 6, p. 279). À al-Mas'udi, son cheval s'emballa et le projeta sur le pont de Dujayl; il portait une cotte de mailles et un casque, et tomba à l'eau, mort. Al-Hajjaj lui ouvrit le ventre et en retira le cœur, dur comme une pierre; à l'intérieur, il découvrit un petit cœur rond comme une sphère; à l'intérieur, il trouva un caillot de sang (cf. Muruj-al-Dhahab, p. 130)."
  ur: "سنہ 77 میں ہشام بن محمد کے کلام پر الطبری نے شبیب کی وفات کا ذکر کیا ہے۔ ایک اور روایت میں ان کی وفات 78 میں ہوئی۔ المسعودی میں اس کا گھوڑا اس کے ساتھ ٹکرایا اور اسے دجیل پل پر پھینک دیا۔ اس نے میل کا کوٹ اور ہیلمٹ پہن رکھا تھا، اور وہ پانی میں گر کر مر گیا۔ حجاج نے اپنا پیٹ چیر کر اپنا دل نکالا جو پتھر کی طرح تھا۔ جب اس نے اسے کاٹا تو اندر ایک گیند جیسا چھوٹا سا دل تھا۔ جب اس نے اسے کاٹا تو اس کے اندر خون کا لوتھڑا تھا۔ 130}۔"
  tr: "Hişam ibn Muhammed'e göre, Taberi yetmiş yedinci yılda Şabib'in ölümünden bahsetmişken, diğerlerine göre ölümü yetmiş sekizinci yılda olmuştur {kaynak: Taberi-tarikh-ebu-al-fadl cilt 6, s. 279}. Mesudi'ye göre, Dujayl köprüsünde zırh ve miğfer giymiş haldeyken atı şaha kalkmış ve onu suya düşürerek öldürmüştür. Haccac karnını yarıp kalbini çıkarmış, kalp taş gibi sertleşmiştir. Onu tekrar açtığında içinde top gibi küçük bir kalp bulmuştur. Onu da açtığında içinde bir kan pıhtısı olduğunu görmüştür {kaynak: Muruj-al-dhahab, s. 130}."
  id: "Pada tahun tujuh puluh tujuh, menurut Hisham ibn Muhammad, al-Tabari menyebutkan kematian Shabib, sedangkan menurut yang lain, kematiannya terjadi pada tahun tujuh puluh delapan {kutip:tabari-tarikh-abu-al-fadl vol.6 hlm.279}. Menurut al-Mas'udi, kudanya lari kencang bersamanya di jembatan Dujayl saat ia mengenakan baju zirah dan helm, dan melemparkannya ke air dalam keadaan mati. Al-Hajjaj membedah perutnya dan mengeluarkan jantungnya, dan jantung itu seperti batu. Ia membelahnya dan menemukan di dalamnya jantung kecil seperti bola. Ia membelahnya lagi dan menemukan gumpalan darah di dalamnya {kutip:muruj-al-dhahab hlm. 130}"
