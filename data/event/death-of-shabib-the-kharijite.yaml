label: { ar: "هلاك شبيب الخارجي", en: "Death of Shabib the Kharijite" }
summary:
  ar: "في سنة سبع وسبعين في قول هشام بن محمد ذكر الطبري هلاك شبيب، وفي قول غيره كان هلاكه سنة ثمان وسبعين {cite:tabari-tarikh-abu-al-fadl j.6 p.279}. وعند المسعودي نفر به فرسه على جسر دجيل وعليه درع ومغفر فألقاه في الماء ميتاً، فشق الحجاج بطنه واستخرج قلبه فإذا هو كالحجر، فشقه فإذا في داخله قلب صغير كالكرة، فشقه فإذا علقة دم في داخله {cite:muruj-al-dhahab p. 130}"
  en: "In the year 77, on the word of Hisham ibn Muhammad, al-Tabari mentions the death of Shabib; in another account his death was in 78 {cite:tabari-tarikh-abu-al-fadl j.6 p.279}. In al-Mas'udi his horse bolted with him and threw him onto the Dujayl bridge; he was wearing a coat of mail and a helmet, and he fell into the water dead. Al-Hajjaj slit open his belly and drew out his heart, which was like a stone; when he cut that, inside was a small heart like a ball; when he cut that, inside it was a clot of blood {cite:muruj-al-dhahab p. 130}."
