id: event/salih-ismail-takes-damascus-637
class: event
kind: conquest
label: { ar: "الصالح إسماعيل يأخذ دمشق والصالح أيوب يتملك مصر سنة 637", en: "Al-Salih Isma'il takes Damascus and al-Salih Ayyub takes Egypt in 637", es: "Al-Salih Isma'il toma Damasco y al-Salih Ayyub toma Egipto en 637", fr: "Al-Salih Isma'il prend Damas et al-Salih Ayyub prend l'Egypte en 637", ur: "الصالح اسماعیل نے دمشق اور الصالح ایوب نے 637 میں مصر پر قبضہ کیا", tr: "637 yılında İsmail-i Salih Şam'ı, Eyyub-i Salih ise Mısır'ı ele geçirdi.", id: "Al-Salih Ismail merebut Damaskus dan Al-Salih Ayyub menguasai Mesir pada tahun 637." }
summary:
  ar: "في صفر سنة سبع وثلاثين وستمائة هجم الملك الصالح إسماعيل بن العادل على دمشق فملكها وتسلم قلعتها، واعتُقل الملك الصالح أيوب بالكرك أشهراً؛ فطلبه أخوه العادل الثاني من الناصر داود وبذل فيه مائة ألف دينار، وطلبه الصالح إسماعيل فامتنع الناصر، ثم اتفق مع الصالح أيوب وسار به إلى الديار المصرية فمالت إليه الكاملية وقبضوا على العادل وتملك الصالح نجم الدين أيوب مصر ورجع الناصر داود بخفي حنين {cite:shadharat-dhahab p. 183}."
  en: "Safar 637: al-Salih Isma'il b. al-Adil storms Damascus and takes its citadel; al-Salih Ayyub, released from Karak by al-Nasir Dawud, reaches Egypt where the Kamiliyya arrest al-Adil II and make him sultan — al-Nasir returns empty-handed {cite:shadharat-dhahab p. 183}."
  es: "Safar 637: al-Salih Isma'il b. al-Adil asalta Damasco y toma su ciudadela; al-Salih Ayyub, liberado de Karak por al-Nasir Dawud, llega a Egipto donde la Kamiliyya arresta a al-Adil II y lo convierte en sultán; al-Nasir regresa con las manos vacías {cita: shadharat-dhahab p. 183}."
  fr: "Safar 637: al-Salih Isma'il b. al-Adil prend d'assaut Damas et s'empare de sa citadelle; al-Salih Ayyub, libéré de Karak par al-Nasir Dawud, atteint l'Égypte où la Kamiliyya arrête al-Adil II et le nomme sultan — al-Nasir revient les mains vides {cite: shadharat-dhahab p. 183}."
  ur: "صفر 637: الصالح اسماعیل بنت۔ العادل نے دمشق پر حملہ کیا اور اس کے قلعے پر قبضہ کر لیا۔ الصالح ایوب، جسے الناصر داؤد نے کرک سے رہا کیا، مصر پہنچ گیا جہاں کمیلیہ نے العدل دوم کو گرفتار کر کے اسے سلطان بنا دیا۔ الناصر خالی ہاتھ واپس آیا۔ 183}۔"
  tr: "Hicri 637 yılının Safer ayında, Kral Salih İsmail bin Adil, Şam'a saldırdı, şehri fethetti ve kalesini ele geçirdi. Kral Salih Eyyub aylarca Karak'ta hapsedildi. Kardeşi II. Adil, Nasır Davud'dan onu istedi ve ona yüz bin dinar teklif etti. Salih İsmail de onu istedi, ancak Nasır reddetti. Bunun üzerine Salih Eyyub ile bir anlaşma yaptı ve onu Mısır topraklarına götürdü. Kamiliya ona doğru yöneldi ve Adil'i ele geçirdi, Salih Necm Din Eyyub Mısır'ın kontrolünü ele geçirdi ve Nasır Davud eli boş döndü. {kaynak: Şadharat-dhahab s. 183}"
  id: "Pada bulan Safar tahun 637 H, Raja Al-Salih Ismail bin Al-Adil menyerang Damaskus, menaklukkannya, dan menguasai bentengnya. Raja Al-Salih Ayyub dipenjara di Karak selama berbulan-bulan. Saudaranya, Al-Adil II, meminta Al-Nasir Dawud untuk membebaskannya dan menawarkannya seratus ribu dinar. Al-Salih Ismail memintanya, tetapi Al-Nasir menolak. Kemudian ia membuat kesepakatan dengan Al-Salih Ayyub dan membawanya ke tanah Mesir. Kaum Kamilia berpihak kepadanya dan menangkap Al-Adil, dan Al-Salih Najm Al-Din Ayyub menguasai Mesir, dan Al-Nasir Dawud kembali dengan tangan kosong. {cite:shadharat-dhahab p. 183}"
