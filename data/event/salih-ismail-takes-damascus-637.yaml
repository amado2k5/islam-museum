label: { ar: "الصالح إسماعيل يأخذ دمشق والصالح أيوب يتملك مصر سنة 637" }
summary:
  ar: "في صفر سنة سبع وثلاثين وستمائة هجم الملك الصالح إسماعيل بن العادل على دمشق فملكها وتسلم قلعتها، واعتُقل الملك الصالح أيوب بالكرك أشهراً؛ فطلبه أخوه العادل الثاني من الناصر داود وبذل فيه مائة ألف دينار، وطلبه الصالح إسماعيل فامتنع الناصر، ثم اتفق مع الصالح أيوب وسار به إلى الديار المصرية فمالت إليه الكاملية وقبضوا على العادل وتملك الصالح نجم الدين أيوب مصر ورجع الناصر داود بخفي حنين {cite:shadharat-dhahab p. 183}."
  en: "Safar 637: al-Salih Isma'il b. al-Adil storms Damascus and takes its citadel; al-Salih Ayyub, released from Karak by al-Nasir Dawud, reaches Egypt where the Kamiliyya arrest al-Adil II and make him sultan — al-Nasir returns empty-handed {cite:shadharat-dhahab p. 183}."
