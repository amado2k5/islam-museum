summary:
  ar: "في ثاني يوم من شوال سنة سبعين وتسعمائة كان السيل العظيم الهائل بحضرموت الذي لم يُسمع بمثله، خرّب كثيراً من تلك الجهة وأتلف كثيراً من النخيل، وهم يذكرونه ويؤرخون به وهو المسمى عندهم سيل الإكليل؛ وضمن تاريخه الفقيه عبد الله بن أحمد بن فلاح الحضرمي فقال: «سيل بوادي حضرموت أذاه عم — في نوم إكليل النجوم لقد نم» {cite:shadharat-dhahab p. 357}."
  en: "On the second day of Shawwal 970 Hadhramaut saw 'the tremendous unheard-of flood' — Sayl al-Iklil — devastating the valley and its palms; they still date by it. 'A flood in Wadi Hadhramaut whose harm spread — while the stars' garland slept' {cite:shadharat-dhahab p. 357}."
