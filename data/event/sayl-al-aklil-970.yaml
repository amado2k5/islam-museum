label: { ar: "سيل الإكليل بحضرموت 970هـ", en: "The Great Flood of al-Iklil, Hadhramaut, 970", es: "El Gran Diluvio de al-Iklil, Hadramaut, 970", fr: "Le grand déluge d'al-Iklil, Hadramaout, 970", ur: "العقل کا عظیم سیلاب، حضرموت، 970", tr: "Hadhramaut'ta 970 Hicri yılında meydana gelen büyük tufan.", id: "Banjir Mahkota di Hadhramaut 970 H" }
summary:
  ar: "في ثاني يوم من شوال سنة سبعين وتسعمائة كان السيل العظيم الهائل بحضرموت الذي لم يُسمع بمثله، خرّب كثيراً من تلك الجهة وأتلف كثيراً من النخيل، وهم يذكرونه ويؤرخون به وهو المسمى عندهم سيل الإكليل؛ وضمن تاريخه الفقيه عبد الله بن أحمد بن فلاح الحضرمي فقال: «سيل بوادي حضرموت أذاه عم — في نوم إكليل النجوم لقد نم» {cite:shadharat-dhahab p. 357}."
  en: "On the second day of Shawwal 970 Hadhramaut saw 'the tremendous unheard-of flood' — Sayl al-Iklil — devastating the valley and its palms; they still date by it. 'A flood in Wadi Hadhramaut whose harm spread — while the stars' garland slept' {cite:shadharat-dhahab p. 357}."
  es: "El segundo día de Shawwal 970, Hadhramaut presenció una inundación tremenda e inaudita — Sayl al-Iklil — que devastó el valle y sus palmeras; aún hoy se citan para datar sus frutos. «Una inundación en Wadi Hadhramaut cuya devastación se extendió mientras la guirnalda de estrellas dormía» {cita: shadharat-dhahab p. 357}."
  fr: "Le deuxième jour de Shawwal 970, le Hadramaout fut frappé par une crue terrible et sans précédent – le Sayl al-Iklil – qui dévasta la vallée et ses palmiers; on s’en souvient encore aujourd’hui. « Une crue dans le Wadi Hadramaout dont les ravages se propagèrent – tandis que la guirlande des étoiles dormait » {cite: shadharat-dhahab p. 357}."
  ur: "شوال 970 کے دوسرے دن حضرموت نے 'زبردست غیر سنا ہوا سیلاب' دیکھا - سائل العقل - وادی اور اس کی ہتھیلیوں کو تباہ کر رہا تھا۔ وہ اب بھی اس کی طرف سے تاریخ. 'وادی حضرموت میں سیلاب جس کی تباہی پھیل گئی - جب کہ ستاروں کے مالا سو گئے'۔ 357}۔"
  tr: "Dokuz yüz yetmiş yılının Şevval ayının ikinci gününde Hadhramaut'ta daha önce hiç görülmemiş büyük ve muazzam bir sel oldu. Bölgenin büyük bir kısmını tahrip etti ve birçok hurma ağacını mahvetti. Onlar bunu hatırlıyor ve olayları buna göre tarihlendiriyorlar; buna \"Taç Tufanı\" diyorlar. Hukukçu Abdullah bin Ahmed bin Falah el-Hadrami bunu tarihine dahil ederek şöyle diyor: \"Hadhramaut vadisinde bir sel oldu, zararı yaygındı - yıldızların tacının uykusunda uyuyordu.\" {kaynak:şadharat-dhahab s. 357}"
  id: "Pada hari kedua bulan Syawal tahun 970, terjadi banjir besar dan dahsyat di Hadhramaut, yang belum pernah terjadi sebelumnya. Banjir itu menghancurkan sebagian besar wilayah tersebut dan merusak banyak pohon kurma. Mereka mengingatnya dan menentukan tanggal peristiwa berdasarkan banjir itu, dan mereka menyebutnya Banjir Mahkota. Ulama Abdullah bin Ahmed bin Falah al-Hadrami memasukkannya dalam sejarahnya, dengan mengatakan: “Banjir di lembah Hadhramaut, kerusakannya meluas — dalam tidur mahkota bintang, ia tertidur.” {cite:shadharat-dhahab hlm. 357}."
