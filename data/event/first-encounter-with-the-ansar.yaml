summary:
  en: "The historic meeting at al-Aqaba during the pilgrimage season of the 11th year of prophethood (July 620 CE) between the Prophet and six notables from the Khazraj clan of Yathrib, who embraced Islam and carried its call to Medina."
  ar: "لقاء النبي في موسم حج السنة 11 من النبوة ⁦(يوليو 620م)⁩ بستة من سادات الخزرج بيثرب عند العقبة بمنى، فأسلموا بعد سماع القرآن وكانوا نواة الأنصار ومقدمة بيعتي العقبة."
  es: "El encuentro histórico en al-Aqaba durante la temporada de peregrinación del undécimo año de la profecía (julio de 620 d. C.) entre el Profeta y seis notables del clan Khazraj de Yathrib, que abrazaron el Islam y llevaron su mensaje a Medina."
  fr: "La rencontre historique à al-Aqaba pendant la saison du pèlerinage de la 11e année de la prophétie (juillet 620 CE) entre le Prophète et six notables du clan Khazraj de Yathrib, qui ont embrassé l'islam et porté son appel à Médine."
  ur: "نبوت کے 11ویں سال ⁦(جولائی 620 عیسوی)⁩ کے موسمِ حج کے دوران عقبہ میں تاریخی ملاقات رسول اللہ اور یثرب کے خزرج قبیلہ کے چھ نامور لوگوں کے درمیان ہوئی، جنہوں نے اسلام قبول کیا اور مدینہ کی طرف دعوت دی۔"
