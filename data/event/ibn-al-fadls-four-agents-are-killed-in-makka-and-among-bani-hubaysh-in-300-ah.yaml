id: "event/ibn-al-fadls-four-agents-are-killed-in-makka-and-among-bani-hubaysh-in-300-ah"
class: event
kind: other
label:
  ar: "يُقتل أربعة من أعوان ابن الفضل في مكه وفي بلد بني حبيش سنة 300هـ، ص401"
  en: "Four agents of Ibn al-Fadl are killed, two at Makka and two among Bani Hubaysh, in 300 AH, p. 401"
  ur: "ابن الفضل کے چار کارندے 300ھ میں مارے جاتے ہیں، دو مکہ میں اور دو بنی حبیش کے علاقے میں، ص401"
  es: "Cuatro agentes de Ibn al-Fadl mueren, dos en La Meca y dos entre los Bani Hubaysh, en el año 300 de la Hégira (pág. 401)."
  fr: "Quatre agents d'Ibn al-Fadl sont tués, deux à La Mecque et deux parmi les Bani Hubaysh, en 300 AH, p. 401"
summary:
  ar: "يرسل ابن فضل رجلين إلى مكه ورجلين إلى بلد بني حبيش، فيُقتل الأربعة، ويضرب اثنان منهم بالسياط حتى يموتا ثم يصلبا، سنة 300هـ."
  en: "Ibn al-Fadl sends two men to Makka and two to the land of Bani Hubaysh. All four are killed; two of them are flogged to death and crucified at Makka, in 300 AH."
  ur: "ابن فضل دو آدمی مکہ اور دو بنی حبیش کے علاقے میں بھیجتا ہے۔ چاروں مارے جاتے ہیں، جن میں سے دو کو مکہ میں کوڑے مار کر ہلاک کیا جاتا ہے اور سولی دی جاتی ہے، 300ھ۔"
  es: "Ibn al-Fadl envía a dos hombres a La Meca y a otros dos a la tierra de Bani Hubaysh. Los cuatro mueren; dos de ellos son azotados hasta la muerte y crucificados en La Meca, en el año 300 de la Hégira."
  fr: "Ibn al-Fadl envoie deux hommes à La Mecque et deux autres au pays des Bani Hubaysh. Tous les quatre sont tués; deux d’entre eux sont fouettés à mort et crucifiés à La Mecque, en 300 AH."
