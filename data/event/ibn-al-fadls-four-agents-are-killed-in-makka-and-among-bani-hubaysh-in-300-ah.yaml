label:
  ar: "يُقتل أربعة من أعوان ابن الفضل في مكه وفي بلد بني حبيش سنة 300هـ، ص401"
  en: "Four agents of Ibn al-Fadl are killed, two at Makka and two among Bani Hubaysh, in 300 AH, p. 401"
  ur: "ابن الفضل کے چار کارندے 300ھ میں مارے جاتے ہیں، دو مکہ میں اور دو بنی حبیش کے علاقے میں، ص401"
summary:
  ar: "يرسل ابن فضل رجلين إلى مكه ورجلين إلى بلد بني حبيش، فيُقتل الأربعة، ويضرب اثنان منهم بالسياط حتى يموتا ثم يصلبا، سنة 300هـ."
  en: "Ibn al-Fadl sends two men to Makka and two to the land of Bani Hubaysh. All four are killed; two of them are flogged to death and crucified at Makka, in 300 AH."
  ur: "ابن فضل دو آدمی مکہ اور دو بنی حبیش کے علاقے میں بھیجتا ہے۔ چاروں مارے جاتے ہیں، جن میں سے دو کو مکہ میں کوڑے مار کر ہلاک کیا جاتا ہے اور سولی دی جاتی ہے، 300ھ۔"
