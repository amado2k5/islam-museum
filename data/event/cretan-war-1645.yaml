  fr: "Fiche de projet pour la guerre de Crète entre l'État ottoman et Venise de 1645 à 1669, se terminant par la chute de Candie; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1645 سے 1669 تک عثمانی ریاست اور وینس کے درمیان کریٹن جنگ کے لیے ڈرافٹ کارڈ، جو کینڈیا کے زوال کے ساتھ ختم ہوا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Osmanlı İmparatorluğu ile Venedik Cumhuriyeti arasında 1645-1669 yılları arasında gerçekleşen ve Kandiya'nın düşüşüyle sonuçlanan Girit Savaşı'na dair ön bir anlatım; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Perang Kreta antara Kekaisaran Ottoman dan Republik Venesia dari tahun 1645 hingga 1669 M, yang berakhir dengan jatuhnya Candia; sumber-sumber di halaman ini belum ditinjau."
