summary:
  ar: "بطاقة أولية لحرب كريت بين الدولة العثمانية وجمهورية البندقية من ١٦٤٥ إلى ١٦٦٩م، انتهت بسقوط قندية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Cretan War between the Ottoman state and Venice from 1645 to 1669, ending with the fall of Candia; its sources are not yet checked on the page."
