id: event/yaqut-flight-mosul-617
class: event
kind: other
label:
  ar: "انهزام ياقوت من خوارزم أمام التتر إلى الموصل ثم حلب، ٦١٧هـ/١٢٢٠م"
  en: "Yaqut flees Khwarazm before the Mongols to Mosul, then Aleppo, 617/1220"
  ur: "یاقوت منگولوں کے سامنے خوارزم سے بھاگ کر موصل اور پھر حلب آیا، 617ھ/1220ء"
  es: "Yaqut huye de Corasmia ante la llegada de los mongoles a Mosul y luego a Alepo, 617/1220."
  fr: "Yaqut fuit le Khwarezm devant les Mongols et se réfugie à Mossoul, puis à Alep, en 617/1220."
  tr: "Yaqut'un Harezm'den Tatarlara, ardından Musul'a ve daha sonra Halep'e yenilgisi, Hicri 617/Miladi 1220"
  id: "Kekalahan Yaqut dari Khwarazm ke Tatar, kemudian ke Mosul dan kemudian Aleppo, 617 H/1220 M"
summary:
  ar: "صادف ياقوت في خوارزم خروجَ التتر فانهزم بنفسه «كبعثة يوم الحشر من رمسه» وقاسى في طريقه من الضائقة والنَّعَب ما يكلّ اللسان عن شرحه، ووصل إلى الموصل وقد تقطعت به الأسباب {cite:shadharat-dhahab p. 121}. ومن الموصل كتب سنة ٦١٧هـ/١٢٢٠م — أو ٦١٨هـ — رسالةً إلى القفطي يصف فيها كربه من زحف المغول، ثم انتقل إلى سنجار فارتحل إلى حلب {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 278}."
  en: "At Khwarazm Yaqut met the Mongol outbreak and fled 'like one raised from his grave on the Day of Resurrection', suffering on the way hardships that tire the tongue to describe; he reached Mosul with his means exhausted {cite:shadharat-dhahab p. 121}. From Mosul in 617/1220 — or 618 — he wrote al-Qifti a letter describing his distress at the Mongol advance, then moved to Sinjar and on to Aleppo {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 278}."
  ur: "خوارزم میں یاقوت کو منگولوں کا ظہور ملا اور وہ «قیامت کے دن اپنے قبرستان سے اٹھے شخص کی مانند» بھاگا؛ راہ میں ایسی تنگی اور بھاگ دوڑ سہی کہ زبان بیان سے عاجز ہے، اور اسباب ختم ہو کر موصل پہنچا {cite:shadharat-dhahab p. 121}. موصل سے 617ھ/1220ء — یا 618ھ — میں قفطی کو خط لکھا جس میں منگول یلغار سے اپنی مشکل بیان کی، پھر سنجار اور پھر حلب گیا {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 278}۔"
  es: "En Khwarazm, Yaqut se enfrentó al ataque mongol y huyó «como quien resucita de su tumba el Día de la Resurrección», sufriendo en el camino penurias que cansan la lengua de describir; llegó a Mosul con sus medios agotados {cite:shadharat-dhahab p. 121}. Desde Mosul en 617/1220 — o 618 — escribió una carta a al-Qifti describiendo su angustia por el avance mongol, luego se trasladó a Sinjar y después a Alepo {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 278}."
  fr: "À Khwarezm, Yaqut fut confronté à l'invasion mongole et s'enfuit « tel un ressuscité », endurant en chemin des épreuves indescriptibles; il atteignit Mossoul, épuisé. De là, en 617/1220 – ou 618 –, il écrivit à al-Qifti une lettre décrivant sa détresse face à l'avancée mongole, puis se rendit à Sinjar et enfin à Alep."
  tr: "Yaqut, Harezm'de Moğol istilasıyla karşılaştı ve \"Kıyamet Günü'nde mezardan diriliş gibi\" perişan bir halde kaçtı. Yolculuğu boyunca tarif edilemez zorluklar ve acılar çekti ve Musul'a tamamen yoksul bir halde ulaştı. Hicri 617/1220 (ya da 618) yılında Musul'dan el-Kifti'ye Moğol ilerleyişi karşısındaki sıkıntısını anlatan bir mektup yazdı. Daha sonra Sincar'a geçti ve oradan Halep'e gitti."
  id: "Yaqut menghadapi invasi Mongol di Khwarazm dan melarikan diri dalam keadaan kacau, \"seperti kebangkitan dari kubur pada Hari Kiamat.\" Ia mengalami kesulitan dan penderitaan yang tak terlukiskan dalam perjalanannya, dan sampai di Mosul dalam keadaan benar-benar miskin. Dari Mosul, pada tahun 617 H/1220 M—atau 618 H—ia menulis surat kepada al-Qifti yang menggambarkan kesedihannya atas kemajuan Mongol. Kemudian ia pindah ke Sinjar dan melakukan perjalanan ke Aleppo."
