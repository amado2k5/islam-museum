summary:
  ar: "وقعة النمارق قرب الكوفة: استنفار المثنى بن حارثة أهل الردة ممن حسن إسلامه حتى قدم عليه أبو عبيد بن مسعود، وجاء جابان من كسكرا فنزل النمارق فالتقوا قتالًا شديدًا فهزم الله أهل فارس. أُسر جابان بخدعة — قال لمطر بن فضة التميمي آسره هل لك أن تؤمنني ففعل فخلّى عنه، فلما أتى به أبا عبيد وأخبروه أنه جابان وأشاروا بقتله قال: إني أخاف الله أن أقتله وقد أمّنه رجل مسلم، والمسلمون كالجسد الواحد ما لزم بعضهم فقد لزم كلهم. وأسر مردانشاه أكتل بن شماخ العكلي فقتله {cite:kamil-ibn-al-athir p. 274-275}."
  en: "At al-Namarq near Kufa, Abu 'Ubayd ibn Mas'ud — reinforced by the pardoned ridda converts of al-Muthanna — met Jaban's Persians and routed them. Jaban was taken by Matar ibn Fidda, then talked him into safe-conduct and was released; when the captors brought him before Abu 'Ubayd demanding execution he answered: 'I fear God — a Muslim gave him protection, and the Muslims are one body: what binds one of them binds them all.' Jaban went free; Mardanshah, seized by Aktal ibn Shammakh, was not so fortunate {cite:kamil-ibn-al-athir p. 274-275}."
