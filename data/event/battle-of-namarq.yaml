summary:
  ar: "وقعة النمارق قرب الكوفة: استنفار المثنى بن حارثة أهل الردة ممن حسن إسلامه حتى قدم عليه أبو عبيد بن مسعود، وجاء جابان من كسكرا فنزل النمارق فالتقوا قتالًا شديدًا فهزم الله أهل فارس. أُسر جابان بخدعة — قال لمطر بن فضة التميمي آسره هل لك أن تؤمنني ففعل فخلّى عنه، فلما أتى به أبا عبيد وأخبروه أنه جابان وأشاروا بقتله قال: إني أخاف الله أن أقتله وقد أمّنه رجل مسلم، والمسلمون كالجسد الواحد ما لزم بعضهم فقد لزم كلهم. وأسر مردانشاه أكتل بن شماخ العكلي فقتله {cite:kamil-ibn-al-athir p. 274-275}."
  en: "At al-Namarq near Kufa, Abu 'Ubayd ibn Mas'ud — reinforced by the pardoned ridda converts of al-Muthanna — met Jaban's Persians and routed them. Jaban was taken by Matar ibn Fidda, then talked him into safe-conduct and was released; when the captors brought him before Abu 'Ubayd demanding execution he answered: 'I fear God — a Muslim gave him protection, and the Muslims are one body: what binds one of them binds them all.' Jaban went free; Mardanshah, seized by Aktal ibn Shammakh, was not so fortunate {cite:kamil-ibn-al-athir p. 274-275}."
  fr: "À al-Namarq, près de Koufa, Abu 'Ubayd ibn Mas'ud, renforcé par les convertis graciés de la ridda d'al-Muthanna, rencontra les Persans de Jaban et les mit en déroute. Jaban fut pris par Matar ibn Fidda, puis le persuada de lui accorder un sauf-conduit et fut relâché ; quand ses capteurs l'amenèrent devant Abu 'Ubayd en réclamant son exécution, celui-ci répondit : « Je crains Dieu : un musulman lui a accordé sa protection, et les musulmans sont un seul corps : ce qui engage l'un d'eux les engage tous. » Jaban partit libre ; Mardanshah, saisi par Aktal ibn Shammakh, n'eut pas cette chance {cite:kamil-ibn-al-athir p. 274-275}."
  es: "En al-Namarq, cerca de Kufa, Abu 'Ubayd ibn Mas'ud, reforzado por los conversos ridda perdonados de al-Muthanna, se enfrentó a los persas de Jaban y los derrotó. Jaban fue capturado por Matar ibn Fidda, quien lo convenció de obtener un salvoconducto y fue liberado. Cuando los captores lo llevaron ante Abu 'Ubayd exigiendo su ejecución, respondió: «Temo a Dios; un musulmán le brindó protección, y los musulmanes son un solo cuerpo: lo que ata a uno de ellos los ata a todos». Jaban quedó libre; Mardanshah, capturado por Aktal ibn Shammakh, no tuvo tanta suerte {cite:kamil-ibn-al-athir p. 274-275}."
  ur: "کوفہ کے قریب النمرق میں، ابو عبید بن مسعود - المثنۃ کے معاف کیے ہوئے ردا سے تقویت پانے والے - جبان کے فارسیوں سے ملے اور انھیں شکست دی۔ جبان کو مطر بن فدا لے گیا، پھر اس سے حسن سلوک کی بات کی اور رہا کر دیا گیا۔ جب اغوا کرنے والے اسے ابو عبید کے سامنے پھانسی کا مطالبہ کرتے ہوئے لائے تو اس نے جواب دیا: 'میں خدا سے ڈرتا ہوں - ایک مسلمان نے اسے تحفظ دیا، اور مسلمان ایک جسم ہیں: جو ان میں سے ایک کو باندھتا ہے وہ سب کو باندھ دیتا ہے۔' جبان آزاد ہو گیا۔ مردان شاہ، جس پر اکتال ابن شمخ نے قبضہ کیا، اتنا خوش قسمت نہیں تھا {حوالہ: کامل ابن الثیر ص۔ 274-275}۔"
