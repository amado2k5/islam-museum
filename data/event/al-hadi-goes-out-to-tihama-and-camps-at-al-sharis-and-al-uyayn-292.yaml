id: event/al-hadi-goes-out-to-tihama-and-camps-at-al-sharis-and-al-uyayn-292
class: event
kind: other
label:
  ar: "خروج الهادي إلى تهامة والنزول بالشَّرس ثم العُيين، ص296"
  en: "Al-Hadi goes out to Tihama and camps at al-Sharis and al-Uyayn, p. 296"
  ur: "ہادی کا تہامہ کی طرف نکلنا اور الشرس و العیین میں پڑاؤ، ص296"
  es: "Al-Hadi sale hacia Tihama y acampa en al-Sharis y al-Uyayn, pág. 296."
  fr: "Al-Hadi se rend à Tihama et campe à al-Sharis et al-Uyayn, p. 296"
  tr: "El-Hadi'nin Tihama'ya gidişi ve El-Şars'ta, ardından da El-Uyayn'da kalışı, s. 296"
  id: "Keberangkatan Al-Hadi ke Tihama dan masa tinggalnya di Al-Shars dan kemudian Al-Uyayn, hlm. 296"
summary:
  ar: "تحت عنوان «خروج الهادي إلى الحق إلى تهامة» يسير الهادي في عسكر كثير من بني الحارث وخولان فينزل بموضع يقال له الشرس ويأتيه من حجور بشر كثير، ثم يتقدم إلى العيين فيقيم أياماً حتى يقدم عليه رسول من الحكمي بكتب يسأله المصير إلى طرطر."
  en: "Under the heading \"al-Hadi's going out to Tihama\" he marches with a large force of Banu al-Harith and Khawlan and halts at a place called al-Sharis, where many men of Hujur come to him; he then moves on to al-Uyayn and stays some days until a messenger comes from the Hakami with letters asking him to come to Tartar."
  ur: "«ہادی کا تہامہ کی طرف نکلنا» کے عنوان تلے وہ بنو حارث اور خولان کے ایک بڑے لشکر کے ساتھ چلتے ہیں اور الشرس نامی جگہ پر ٹھہرتے ہیں جہاں حجور کے بہت سے لوگ آتے ہیں؛ پھر العیین جا کر کچھ دن رہتے ہیں یہاں تک کہ حکمی کا قاصد خط لے کر آتا ہے جس میں انہیں طرطر آنے کو کہا گیا ہے۔"
  es: "Bajo el epígrafe \"La salida de al-Hadi hacia Tihama\", marcha con una gran fuerza de Banu al-Harith y Khawlan y se detiene en un lugar llamado al-Sharis, donde muchos hombres de Hujur acuden a él; luego se dirige a al-Uyayn y permanece allí algunos días hasta que llega un mensajero de Hakami con cartas pidiéndole que vaya a Tartar."
  fr: "Sous le titre « al-Hadi part pour Tihama », il marche avec une importante force de Banu al-Harith et de Khawlan et s'arrête à un endroit appelé al-Sharis, où de nombreux hommes de Hujur viennent à lui; il se dirige ensuite vers al-Uyayn et y reste quelques jours jusqu'à ce qu'un messager des Hakami arrive avec des lettres lui demandant de venir à Tartar."
  tr: "“El-Hadi’nin Tihama’ya Gidişi” başlığı altında, El-Hadi, Beni El-Harith ve Khawlan’dan büyük bir orduyla yürüyüşe geçer ve El-Şars denilen bir yerde durur. Hajur’dan birçok kişi ona gelir, ardından El-Ayyin’e ilerler ve orada günlerce kalır. Daha sonra El-Hakami’den bir elçi, kendisine Tatar’a gitmesini isteyen mektuplar getirir."
  id: "Dengan judul “Keberangkatan Al-Hadi ke Tihama,” Al-Hadi berbaris dengan pasukan besar dari Bani Al-Harith dan Khawlan, dan dia berhenti di tempat bernama Al-Shars. Banyak orang datang kepadanya dari Hajur, kemudian dia maju ke Al-Ayyin dan tinggal selama beberapa hari sampai seorang utusan dari Al-Hakami datang kepadanya dengan surat yang memintanya untuk pergi ke Tartar."
