id: event/ali-ibn-muhammad-recites-a-poem-in-praise-of-al-hadi-after-the-calm-294
class: event
kind: other
label:
  ar: "علي بن محمد ينشد قصيدة في مدح الهادي بعد استقرار نجران، سنة 294هـ، ص341-343"
  en: "Ali ibn Muhammad recites a poem in praise of al-Hadi after Najran is settled, 294 AH, pp. 341-343"
  ur: "علی بن محمد کا نجران کے پرسکون ہونے کے بعد ہادی کی مدح میں قصیدہ کہنا، 294ھ، ص341-343"
  es: "Ali ibn Muhammad recita un poema en alabanza de al-Hadi después de que se establece Najran, 294 AH, pp. 341-343"
summary:
  ar: "بعد أن اطمأنت نجران أنشد علي بن محمد العلوي قصيدة طويلة في مدح الهادي، يذكر فيها علمه وإقامته الحق ونسبه من علي وفاطمة ومآثر أنصاره."
  en: "Once Najran was settled, Ali ibn Muhammad al-Alawi recited a long poem in praise of al-Hadi, speaking of his knowledge, his restoring of the truth, his descent from Ali and Fatima as the poet frames it, and the deeds of his supporters."
  ur: "نجران کے پرسکون ہونے کے بعد علی بن محمد العلوی نے ہادی کی مدح میں ایک طویل قصیدہ پڑھا، جس میں ان کے علم، حق کے قیام، شاعر کے بیان کے مطابق علی اور فاطمہ سے ان کے نسب، اور ان کے حامیوں کے کارناموں کا ذکر ہے۔"
  es: "Una vez establecida la ciudad de Najrán, Ali ibn Muhammad al-Alawi recitó un largo poema en alabanza de al-Hadi, hablando de su conocimiento, su restauración de la verdad, su descendencia de Ali y Fátima, tal como lo presenta el poeta, y las hazañas de sus seguidores."
