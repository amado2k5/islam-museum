summary:
  ar: "عند البلاذري: أقبل خالد بن الوليد حتى أتى البصرة وبها سويد بن قطب ة الذهلي — وقال غير أبي مخنف كان بها قطب ة بن قتادة الذهلي — من بكر بن وائل ومعه جماعة من قومه وهو يريد أن يفعل بالبصرة مثل فعل المثنى بالكوفة ولم تكن الكوفة يومئذ إنما كانت الحيرة فقال سويد لخالد إن أهل الأبلة قد جمعوا لي ولا أحسبهم امتنعوا مني إلا لمكانك قال له خالد: الرأي أن أخرج من البصرة نهاراً ثم أعود ليلاً فأدخل عسكرك بأصحابي فإن صبّحوك حاربناهم ففعل خالد ذلك وتوجه نحو الحيرة فلما جنّ عليه الليل انكفأ راجعاً حتى صار إلى عسكر سويد فدخله وأصبح الأبليون وقد بلغهم انصراف خالد عن البصرة فأقبلوا نحو سويد فلما رأوا كثرة من في عسكره سقط في أيديهم وانكسروا فقال خالد احملوا عليهم فإني أرى هيئة قوم قد ألقى الله في قلوبهم الرعب فحملوا عليهم فهزموهم وقتل الله منهم بشراً وغرّق طائفة في دجلة البصرة."
  en: "In al-Baladhuri: Khalid ibn al-Walid came to Basra where Suwayd ibn Qutba al-Dhuhli — per other-than-Abu Mikhnaf, Qutba ibn Qatada al-Dhuhli — of Bakr ibn Wa'il had a band of his people, meaning to do to Basra what al-Muthanna did to Kufa — Kufa not yet existing, only al-Hira. Suwayd told Khalid: Ubulla's people have gathered against me and only desist for your presence. Khalid said: my judgment is I leave Basra by day then return by night into your camp with my men — if they attack at dawn we fight them. He did so, marching toward al-Hira, and when night fell wheeled back into Suwayd's camp; the Ubullans — told of Khalid's departure — approached Suwayd, saw the camp's numbers, and broke. Khalid said 'charge them — I see a people into whose hearts God has cast terror'; they charged, routed them, killed many, and drowned a party in Basra's Tigris."
  fr: "Chez al-Baladhuri : Khalid ibn al-Walid vint à Bassora, où Suwayd ibn Qutba al-Dhuhli, selon d'autres qu'Abu Mikhnaf Qutba ibn Qatada al-Dhuhli, des Bakr ibn Wa'il, se trouvait avec une troupe des siens, voulant faire à Bassora ce qu'al-Muthanna avait fait à Koufa ; Koufa n'existait pas encore, seulement al-Hira. Suwayd dit à Khalid : les gens d'al-Ubulla se sont rassemblés contre moi et ne se retiennent qu'en raison de ta présence. Khalid dit : mon avis est que je quitte Bassora de jour, puis que je revienne de nuit dans ton camp avec mes hommes ; s'ils attaquent à l'aube, nous les combattrons. Il fit ainsi, marchant vers al-Hira, et à la tombée de la nuit, il fit demi-tour dans le camp de Suwayd ; les gens d'al-Ubulla, informés du départ de Khalid, s'approchèrent de Suwayd, virent le nombre des hommes du camp, et cédèrent. Khalid dit : « Chargez-les ; je vois des gens dans le cœur desquels Dieu a jeté la terreur » ; ils chargèrent, les mirent en déroute, en tuèrent beaucoup et en noyèrent un groupe dans le Tigre de Bassora."
  es: "En al-Baladhuri: Khalid ibn al-Walid llegó a Basora, donde Suwayd ibn Qutba al-Dhuhli —según otro Abu Mikhnaf, Qutba ibn Qatada al-Dhuhli— de Bakr ibn Wa'il tenía un grupo de sus hombres, con la intención de hacer con Basora lo que al-Muthanna hizo con Kufa —Kufa aún no existía, solo al-Hira—. Suwayd le dijo a Khalid: «La gente de Ubulla se ha reunido contra mí y solo desiste por tu presencia». Khalid dijo: «Mi decisión es salir de Basora de día y regresar de noche a tu campamento con mis hombres; si atacan al amanecer, lucharemos contra ellos». Así lo hizo, marchando hacia al-Hira, y al caer la noche regresó al campamento de Suwayd; los ubulanos —al enterarse de la partida de Khalid— se acercaron a Suwayd, vieron el número de hombres en el campamento y se dispersaron. Khalid dijo: «¡Atacadlos! Veo a un pueblo en cuyos corazones Dios ha infundido terror». Atacaron, los derrotaron, mataron a muchos y ahogaron a un grupo en el Tigris de Basora."
  ur: "البلادوری میں ہے: خالد بن الولید بصرہ آیا جہاں سوید بن قطبہ الذھلی - فی ابو مخنف کے علاوہ قطبہ بن قتادہ الذھلی - بکر بن وائل کے پاس اپنی قوم کا ایک گروہ تھا، یعنی بصرہ کے ساتھ وہ کرنا تھا جو ابھی تک صرف المطحنۃ الکوفہ نے نہیں کیا تھا۔ سوید نے خالد سے کہا: اوبولا کے لوگ میرے خلاف جمع ہو گئے ہیں اور صرف آپ کی موجودگی کے لیے باز آ رہے ہیں۔ خالد نے کہا: میرا فیصلہ یہ ہے کہ میں دن کو بصرہ سے نکل جاؤں اور رات کو اپنے آدمیوں کے ساتھ اپنے کیمپ میں واپس آؤں، اگر وہ صبح کے وقت حملہ کریں تو ہم ان سے لڑیں گے۔ اس نے ایسا ہی کیا، الحیرہ کی طرف کوچ کیا، اور جب رات ہوئی تو وہیل واپس سوید کے کیمپ میں داخل ہوئے۔ اوبلان - نے خالد کے جانے کے بارے میں بتایا - سوید کے پاس پہنچے، کیمپ کے نمبر دیکھے، اور ٹوٹ گئے۔ خالد نے کہا 'ان پر الزام لگاؤ - میں ایسے لوگوں کو دیکھ رہا ہوں جن کے دلوں میں خدا نے دہشت ڈال دی ہے'۔ انہوں نے الزام لگایا، ان کو شکست دی، بہت سے لوگوں کو قتل کیا، اور بصرہ کے دجلہ میں ایک پارٹی کو غرق کر دیا۔"
  tr: "El-Baladhuri'ye göre: Halid ibn el-Valid, Basra'ya kadar ilerledi. Basra'da, Ebu Mikhnaf'ın yanı sıra başkaları da Kutube ibn Katada el-Dhuhli olduğunu söylese de, Bakr ibn Ve'il kabilesinden Suveyd ibn Kutube el-Dhuhli ve adamlarından oluşan bir grup bulunuyordu. Halid, Basra'ya, el-Muthanna'nın Kufa'ya yaptığını yapmayı amaçlıyordu; ancak Kufa o zamanlar henüz mevcut değildi, Hirah idi. Suveyd, Halid'e, \"Ubulla halkı bana karşı toplandı ve inanıyorum ki sadece senin varlığın yüzünden bana karşı koydular\" dedi. Halid, \"Tavsiyem, gündüz Basra'dan ayrılıp gece adamlarımla geri dönmen. Eğer şafakta sana saldırırlarsa, onlarla savaşırız\" diye cevap verdi. Halid öyle yaptı ve Hirah'a doğru yola koyuldu. Gece çöktüğünde, Suveyd'in kampına ulaşana kadar geri döndü ve oraya girdi. Ertesi sabah, Ubulla halkı Halid'in Basra'dan ayrıldığını öğrenince Suveyd'e doğru ilerledi. Askerlerinin çokluğunu görünce dehşete kapıldılar ve orduları dağıldı. Halid, \"Saldırın onlara! Allah'ın kalplerine korku saldığı bir kavim görüyorum!\" dedi. Bunun üzerine onlara saldırdılar ve onları bozguna uğrattılar; Allah da onlardan birçoğunu öldürdü. Basra'da Dicle Nehri'nde bir grubu boğdu."
  id: "Menurut al-Baladhuri: Khalid ibn al-Walid maju hingga mencapai Basra, tempat Suwayd ibn Qutbah al-Dhuhli tinggal—meskipun selain Abu Mikhnaf, yang lain mengatakan itu adalah Qutbah ibn Qatada al-Dhuhli—dari suku Bakr ibn Wa'il, ditemani oleh sekelompok pengikutnya. Ia bermaksud melakukan terhadap Basra apa yang telah dilakukan al-Muthanna terhadap Kufa, meskipun Kufa belum ada pada waktu itu; yang ada adalah al-Hirah. Suwayd berkata kepada Khalid, \"Penduduk al-Ubulla telah berkumpul melawan saya, dan saya yakin mereka melawan saya hanya karena kehadiranmu.\" Khalid menjawab, \"Saran saya adalah tinggalkan Basra pada siang hari dan kembali pada malam hari bersama pasukan saya. Jika mereka menyerangmu saat fajar, kita akan melawan mereka.\" Khalid melakukan hal itu dan menuju ke al-Hirah. Ketika malam tiba, ia berbalik hingga mencapai perkemahan Suwayd dan memasukinya. Keesokan paginya, penduduk al-Ubulla mengetahui kepergian Khalid dari Basra dan bergerak maju menuju Suwayd. Ketika mereka melihat banyaknya pasukan Khalid, mereka gentar dan pasukan mereka kocar-kocar. Khalid berkata, \"Serang mereka! Aku melihat suatu kaum yang hatinya telah ditanami rasa takut oleh Allah.\" Maka mereka menyerang dan mengalahkan mereka, dan Allah membunuh banyak dari mereka. Ia menenggelamkan sebagian dari mereka di Sungai Tigris di Basra."
