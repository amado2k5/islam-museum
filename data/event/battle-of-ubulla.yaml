label: { ar: "قتال الأبلة", en: "The Fight at Ubulla" }
summary:
  ar: "عند البلاذري: أقبل خالد بن الوليد حتى أتى البصرة وبها سويد بن قطب ة الذهلي — وقال غير أبي مخنف كان بها قطب ة بن قتادة الذهلي — من بكر بن وائل ومعه جماعة من قومه وهو يريد أن يفعل بالبصرة مثل فعل المثنى بالكوفة ولم تكن الكوفة يومئذ إنما كانت الحيرة فقال سويد لخالد إن أهل الأبلة قد جمعوا لي ولا أحسبهم امتنعوا مني إلا لمكانك قال له خالد: الرأي أن أخرج من البصرة نهاراً ثم أعود ليلاً فأدخل عسكرك بأصحابي فإن صبّحوك حاربناهم ففعل خالد ذلك وتوجه نحو الحيرة فلما جنّ عليه الليل انكفأ راجعاً حتى صار إلى عسكر سويد فدخله وأصبح الأبليون وقد بلغهم انصراف خالد عن البصرة فأقبلوا نحو سويد فلما رأوا كثرة من في عسكره سقط في أيديهم وانكسروا فقال خالد احملوا عليهم فإني أرى هيئة قوم قد ألقى الله في قلوبهم الرعب فحملوا عليهم فهزموهم وقتل الله منهم بشراً وغرّق طائفة في دجلة البصرة."
  en: "In al-Baladhuri: Khalid ibn al-Walid came to Basra where Suwayd ibn Qutba al-Dhuhli — per other-than-Abu Mikhnaf, Qutba ibn Qatada al-Dhuhli — of Bakr ibn Wa'il had a band of his people, meaning to do to Basra what al-Muthanna did to Kufa — Kufa not yet existing, only al-Hira. Suwayd told Khalid: Ubulla's people have gathered against me and only desist for your presence. Khalid said: my judgment is I leave Basra by day then return by night into your camp with my men — if they attack at dawn we fight them. He did so, marching toward al-Hira, and when night fell wheeled back into Suwayd's camp; the Ubullans — told of Khalid's departure — approached Suwayd, saw the camp's numbers, and broke. Khalid said 'charge them — I see a people into whose hearts God has cast terror'; they charged, routed them, killed many, and drowned a party in Basra's Tigris."
