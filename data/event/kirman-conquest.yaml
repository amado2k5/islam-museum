label: { ar: "فتح كرمان", en: "Conquest of Kirman", es: "Conquista de Kirman", fr: "Conquête de Kirman", ur: "کرمان کی فتح", tr: "Fatah Kerman", id: "Fatah Kerman" }
summary:
  ar: "لقي عثمان بن أبي العاص مرزبان كرمان في جزيرة أبر كاوان وهو في خف فقتله فوهن أمر أهل كرمان ونخبت قلوبهم فلما صار ابن عامر إلى فارس وجه مجاشع بن مسعود السلمي إلى كرمان في طلب يزدجرد فأتى بيمنذ فهلك جيشه بها ثم لما توجه ابن عامر يريد خراسان ولى مجاشعاً كرمان ففتح بيمنذ عنوة واستبقى أهلها وأعطاهم أماناً وبها قصر يعرف بقصر مجاشع وفتح بروخروة وأتى الشيرجان مدينة كرمان فأقام عليها أياماً يسيرة وأهلها متحصنون فخرجت لهم خيل فقاتلهم ففتحها عنوة وخلف بها رجلاً ثم إن كثيراً من أهلها جلوا عنها وقد كان أبو موسى وجه الربيع بن زياد ففتح ما حول الشيرجان وصالح أهل بم والأندغار فكفر أهلها ونكثوا فافتتحها مجاشع وفتح جيرفت عنوة وسار في كرمان فدوخها."
  en: "Uthman ibn Abi al-As met Kirman's marzban at Abr Kawan by night and killed him — Kirman weakened and hearts dismayed. Ibn Amir sent Mujashi' ibn Mas'ud after Yazdgard to Bimand, where his army perished; left in charge when Ibn Amir marched for Khurasan, Mujashi' took Bimand by force — sparing its folk on aman; his Qasr Mujashi' stands there — took Burukharwa, then al-Shirjan, Kirman's chief city: days of siege, a horse-sally, taken by storm, a man left behind and many of its people exiled. Abu Musa had earlier sent al-Rabi' ibn Ziyad round al-Shirjan, trucing Bamm and the Andaghar — betrayed, Mujashi' retook them, took Jirraft by force, and rode Kirman till it was tamed."
  es: "Uthman ibn Abi al-As se encontró con el marzban de Kirman en Abr Kawan por la noche y lo mató; Kirman se debilitó y los corazones se llenaron de consternación. Ibn Amir envió a Mujashi' ibn Mas'ud tras Yazdgard a Bimand, donde su ejército pereció; al mando cuando Ibn Amir marchó hacia Jorasán, Mujashi' tomó Bimand por la fuerza, perdonando a su gente por aman; su Qasr Mujashi' se encuentra allí; tomó Burukharwa, luego al-Shirjan, la ciudad principal de Kirman: días de asedio, una salida a caballo, tomada por asalto, un hombre abandonado y muchos de sus habitantes exiliados. Abu Musa había enviado anteriormente a al-Rabi' ibn Ziyad alrededor de al-Shirjan, estableciendo una tregua en Bamm y Andaghar; traicionado, Mujashi' los retomó, tomó Jirraft por la fuerza y cabalgó sobre Kirman hasta someterla."
  fr: "Uthman ibn Abi al-As rencontra de nuit le marzban de Kirman à Abr Kawan et le tua. Kirman, affaibli, était consterné. Ibn Amir envoya Mujashi' ibn Mas'ud après Yazdgard jusqu'à Bimand, où son armée périt. Laissé à la charge lorsque Ibn Amir marcha sur le Khorasan, Mujashi' prit Bimand par la force, épargnant ses habitants par aman. Son Qasr Mujashi' s'y dresse. Il prit ensuite Burukharwa, puis al-Shirjan, la principale ville de Kirman: après des jours de siège, une sortie à cheval, la ville fut prise d'assaut, un homme laissé pour compte et une grande partie de sa population exilée. Auparavant, Abu Musa avait envoyé al-Rabi' ibn Ziyad contourner al-Shirjan, concluant une trêve avec Bamm et l'Andaghar. Trahis, Mujashi' les reprit, prit Jirraft par la force et soumit Kirman."
  ur: "عثمان بن ابی العاص نے رات کو ابر کاوان میں کرمان کے مرزبان سے ملاقات کی اور اسے قتل کر دیا - کرمان کمزور ہو گیا اور دل مایوس ہو گئے۔ ابن عامر نے مجاشی ابن مسعود کو یزدگرد کے بعد بیمند کی طرف بھیجا جہاں اس کی فوج ہلاک ہو گئی۔ جب ابن عامر نے خراسان کی طرف کوچ کیا تو انچارج چھوڑ دیا، مجاشی نے بمند کو زبردستی لے لیا - اپنے لوگوں کو امان پر چھوڑ دیا۔ اس کا قصر مجاشی وہاں کھڑا ہے - برخروا، پھر الشرجان، کرمان کا مرکزی شہر لے گیا: محاصرے کے دن، ایک گھوڑے کی سیلی، طوفان کی زد میں، ایک آدمی پیچھے رہ گیا اور اس کے بہت سے لوگ جلاوطن ہوئے۔ ابو موسیٰ نے اس سے پہلے الربیع ابن زیاد کو الشرجان کے چکر میں بھیجا تھا، بام اور عندغر کو دھوکہ دیا، مجاشی نے انہیں واپس لے لیا، جراف کو زبردستی لے لیا، اور کرمان پر سوار ہو گئے یہاں تک کہ اسے قابو کر لیا گیا۔"
  tr: "Osman ibn Abi el-As, Abar Kawan adasında Kerman Marzbanı ile pelerinli haldeyken karşılaştı ve onu öldürdü. Kerman halkının işleri zayıfladı ve kalpleri kırıldı. İbn Amir Fars'a gittiğinde, Yazdegerd'i aramak için Kerman'a Majashi' ibn Mesud el-Sulami'yi gönderdi. Yemen'e geldi ve ordusu orada yok oldu. Sonra İbn Amir Horasan'a doğru yola çıktığında, Majashi'yi Kerman valisi olarak atadı. Yemen'i zorla fethetti, halkını bağışladı ve onlara güvenlik sağladı. Orada Majashi'nin Sarayı olarak bilinen bir saray vardır. Barukhruwa'yı fethetti ve Kerman şehri olan Şirjan'a geldi. Orada birkaç gün kaldı ve halkı tahkim edildi. Sonra süvariler onlara saldırdı, onlarla savaştı ve şehri zorla fethetti ve orada bir adam bıraktı. Sonra halkın çoğu oradan kaçtı. Ebu Musa, Rabi' ibn Ziyad'ı göndermişti; o da Şircan çevresini fethetti ve Bam ile Andaghar halkıyla barış yaptı. Ancak bu halk inkâr edip antlaşmayı bozdu, bu yüzden Meşaşi orayı fethetti, Jiroft'u zorla ele geçirdi ve Kerman'a ilerleyerek orayı da boyun eğdirdi."
  id: "Utsman bin Abi al-As bertemu dengan Marzban Kerman di pulau Abar Kawan ketika ia mengenakan jubah, lalu ia membunuhnya. Urusan rakyat Kerman melemah dan hati mereka hancur. Ketika Ibnu Amir pergi ke Fars, ia mengirim Majashi’ bin Masoud al-Sulami ke Kerman untuk mencari Yazdegerd. Ia sampai di Yamandh dan pasukannya binasa di sana. Kemudian ketika Ibnu Amir menuju Khorasan, ia mengangkat Majashi’ sebagai gubernur Kerman. Ia menaklukkan Yamandh dengan kekerasan dan mengampuni penduduknya serta memberi mereka keamanan. Di sana terdapat sebuah istana yang dikenal sebagai Istana Majashi’. Ia menaklukkan Barukhruwa dan sampai ke Shirjan, kota Kerman. Ia tinggal di sana selama beberapa hari, dan penduduknya memperkuat pertahanan. Kemudian pasukan berkuda keluar menyerang mereka, sehingga ia melawan mereka dan menaklukkannya dengan kekerasan dan meninggalkan seorang prajurit di sana. Kemudian banyak penduduknya melarikan diri dari sana. Abu Musa telah mengutus Rabi' ibn Ziyad, sehingga ia menaklukkan wilayah sekitar Shirjan dan berdamai dengan penduduk Bam dan Andaghar. Tetapi penduduknya mengingkari dan melanggar perjanjian mereka, sehingga Majashi' menaklukkannya dan menaklukkan Jiroft dengan kekerasan, lalu berbaris ke Kerman dan menaklukkannya."
