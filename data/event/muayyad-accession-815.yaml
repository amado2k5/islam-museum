label: { ar: "تسلطن المؤيد شيخ سنة 815هـ", en: "The accession of al-Mu'ayyad Shaykh to the sultanate in 815 AH", es: "La ascensión de al-Mu'ayyad Shaykh al sultanato en el año 815 de la Hégira.", fr: "L'accession d'al-Mu'ayyad Shaykh au sultanat en 815 AH", ur: "815 ہجری میں المیعاد شیخ کا سلطنت سے الحاق", tr: "Sultan El-Mu'ayyad Şeyh, 815 H. yılında Sultan oldu", id: "Sultan Al-Mu'ayyad Syekh menjadi Sultan pada tahun 815 H" }
summary:
  ar: "في سنة خمس عشرة وثمان مئة تسلطن شيخ المحمودي ولقب بالمؤيد وكني بأبي نصر وذلك بعد خلع الناصر فرج وسلطنة المستعين الخليفة وخلعه وقتل الناصر فرج {cite:shadharat-dhahab p. 108}."
  en: "In 815 Shaykh al-Mahmudi took the sultanate, titled al-Mu'ayyad and styled Abu Nasr — after al-Nasir Faraj's deposition, the caliph al-Musta'in's brief sultanate and deposition, and Faraj's killing {cite:shadharat-dhahab p. 108}."
  es: "En 815, Shaykh al-Mahmudi tomó el sultanato, titulado al-Mu'ayyad y llamado Abu Nasr, después de la deposición de al-Nasir Faraj, el breve sultanato y deposición del califa al-Musta'in, y el asesinato de Faraj {cite:shadharat-dhahab p. 108}."
  fr: "En 815, le cheikh al-Mahmudi prit le sultanat, sous le titre d'al-Mu'ayyad et sous le nom d'Abu Nasr — après la déposition d'al-Nasir Faraj, le bref sultanat et la déposition du calife al-Musta'in, et le meurtre de Faraj {cite:shadharat-dhahab p. 108}."
  ur: "815 میں شیخ المحمودی نے المیعاد کے عنوان سے سلطنت کی اور ابو نصر کو طرزِ حکومت بنایا - النصر فراج کی معزولی، خلیفہ المستعین کی مختصر سلطنت اور معزولی کے بعد، اور فراج کے قتل کے بعد۔ 108}۔"
  tr: "Hicri 815 yılında Şeyh el-Mahmudi sultan oldu ve el-Muayyad unvanını aldı ve Ebu Nasr olarak tanındı. Bu, el-Nasır Faraj'ın ve halife el-Musta'in'in saltanatının sona ermesinden ve el-Nasır Faraj'ın öldürülmesinden sonra gerçekleşti. {kaynak: Shadharat-dhahab s. 108}"
  id: "Pada tahun 815 H, Syekh Al-Mahmudi menjadi Sultan dan diberi gelar Al-Mu’ayyad serta dikenal sebagai Abu Nasr. Hal ini terjadi setelah pencopotan Al-Nasir Faraj dan kesultanan Khalifah Al-Musta’in, serta pencopotannya dan pembunuhan Al-Nasir Faraj {cite:shadharat-dhahab p. 108}."
