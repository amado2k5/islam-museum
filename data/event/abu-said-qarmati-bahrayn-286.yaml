id: event/abu-said-qarmati-bahrayn-286
class: event
kind: revolt
label: { ar: "ظهور أبي سعيد القرمطي بالبحرين", en: "The Rise of Abu Sa'id al-Qarmati in Bahrayn", fr: "Essor d’Abu Sa'id al-Qarmati au Bahrayn", es: "El ascenso de Abu Sa'id al-Qarmati en Bahréin", ur: "بحرین میں ابو سعید القرماتی کا عروج", tr: "Bahreyn'de Ebu Saeed el-Karmati'nin ortaya çıkışı", id: "Munculnya Abu Saeed al-Qarmati di Bahrain" }
summary:
  ar: "في سنة ست وثمانين ظهر بالبحرين أبو سعيد القرمطي وقويت شوكته وهو أبو أبي طاهر سليمان الذي يأتي أنه قلع الحجر الأسود ووقع القتال بينه وبين عسكر الخليفة وأغار على البصرة ونواحيها وهزم جيش الخليفة مرات {cite:tarikh-khulafa-minhaj-1434 p. 575}. وعند ابن الجوزي اجتمع إليه الأعراب في جمادى الآخرة فقوى أمره وصار إلى القطيف، فكتب أحمد بن محمد الواثقي — وكان يتقلد معادن البصرة وكور دجلة — إلى السلطان فكتب في عمل سور على البصرة قُدِّرت نفقته بأربعة عشر ألف دينار فبُني، وغلب أبو سعيد على هجر وأمن أهلها {cite:muntazam-ibn-al-jawzi p. 310}."
  en: "In 286 Abu Sa'id al-Qarmati rose in Bahrayn — father of Abu Tahir Sulayman who would wrench out the Black Stone — fought the caliph's armies, raided Basra and its neighbourhood, and routed the caliph's forces repeatedly {cite:tarikh-khulafa-minhaj-1434 p. 575}."
  fr: "En 286, Abu Sa'id al-Qarmati se souleva au Bahrayn — père d’Abu Tahir Sulayman qui arracherait la Pierre noire —, combattit les armées du calife, mena des raids à Bassora et dans ses environs et mit à plusieurs reprises les forces califales en déroute {cite:tarikh-khulafa-minhaj-1434 p. 575}."
  es: "En 286, Abu Sa'id al-Qarmati se alzó en Bahrayn —padre de Abu Tahir Sulayman, quien arrebataría la Piedra Negra—, luchó contra los ejércitos del califa, saqueó Basora y sus alrededores, y derrotó repetidamente a las fuerzas del califa {cite:tarikh-khulafa-minhaj-1434 p. 575}."
  ur: "286 میں ابو سعید القرماتی بحرین میں طلوع ہوا - ابو طاہر سلیمان کے والد جو حجر اسود کو ختم کریں گے - نے خلیفہ کی فوجوں سے مقابلہ کیا، بصرہ اور اس کے پڑوس پر حملہ کیا، اور خلیفہ کی فوجوں کو بار بار شکست دی۔ 575}۔"
  tr: "Hicri 86 yılında Ebu Said el-Karmati Bahreyn'de ortaya çıktı ve gücü arttı. Kara Taşı çıkardığı rivayet edilen Ebu Tahir Süleyman'ın babasıydı. Halifenin ordusuyla arasında çatışmalar yaşandı ve Basra ile çevresine baskınlar düzenleyerek Halifenin ordusunu birkaç kez mağlup etti. {cite:tarikh-khulafa-minhaj-1434 s. 575}. İbn el-Cevzi'ye göre, Cemâde el-Ahire'de Bedeviler onun etrafında toplandı, konumunu güçlendirdi ve Katif'e gitti. Basra madenlerinden ve Dicle bölgelerinden sorumlu olan Ahmed ibn Muhammed el-Vatiki, Sultan'a yazdı ve Sultan, Basra çevresine on dört bin dinar olarak tahmin edilen bir sur inşa edilmesini emretti. Sur inşa edildi ve Ebu Said Hacer'in kontrolünü ele geçirerek sakinlerine güvenlik sağladı. {alıntı:muntazam-ibn-el-cevzi s. 310}."
  id: "Pada tahun 86 H, Abu Sa'id al-Qarmati muncul di Bahrain dan kekuasaannya semakin besar. Ia adalah ayah dari Abu Tahir Sulayman, yang konon telah memindahkan Batu Hitam. Pertempuran terjadi antara dirinya dan pasukan Khalifah, dan ia menyerbu Basra dan sekitarnya, mengalahkan pasukan Khalifah beberapa kali. {cite:tarikh-khulafa-minhaj-1434 p. 575}. Menurut Ibn al-Jawzi, kaum Badui berkumpul di sekelilingnya di Jumada al-Akhirah, memperkuat posisinya, dan ia pergi ke Qatif. Ahmad ibn Muhammad al-Wathiqi—yang bertanggung jawab atas tambang Basra dan distrik-distrik di sekitar Sungai Tigris—menulis surat kepada Sultan, yang memerintahkan pembangunan tembok di sekitar Basra, yang biayanya diperkirakan mencapai empat belas ribu dinar. Tembok itu dibangun, dan Abu Sa'id menguasai Hajar dan memberikan keamanan kepada penduduknya. {kutip:muntazam-ibn-al-jawzi hal. 310}."
