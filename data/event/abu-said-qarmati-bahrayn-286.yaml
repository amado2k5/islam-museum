label: { ar: "ظهور أبي سعيد القرمطي بالبحرين", en: "The Rise of Abu Sa'id al-Qarmati in Bahrayn" }
summary:
  ar: "في سنة ست وثمانين ظهر بالبحرين أبو سعيد القرمطي وقويت شوكته وهو أبو أبي طاهر سليمان الذي يأتي أنه قلع الحجر الأسود ووقع القتال بينه وبين عسكر الخليفة وأغار على البصرة ونواحيها وهزم جيش الخليفة مرات {cite:tarikh-khulafa-minhaj-1434 p. 575}. وعند ابن الجوزي اجتمع إليه الأعراب في جمادى الآخرة فقوى أمره وصار إلى القطيف، فكتب أحمد بن محمد الواثقي — وكان يتقلد معادن البصرة وكور دجلة — إلى السلطان فكتب في عمل سور على البصرة قُدِّرت نفقته بأربعة عشر ألف دينار فبُني، وغلب أبو سعيد على هجر وأمن أهلها {cite:muntazam-ibn-al-jawzi p. 310}."
  en: "In 286 Abu Sa'id al-Qarmati rose in Bahrayn — father of Abu Tahir Sulayman who would wrench out the Black Stone — fought the caliph's armies, raided Basra and its neighbourhood, and routed the caliph's forces repeatedly {cite:tarikh-khulafa-minhaj-1434 p. 575}."
