id: event/al-qurtubi-departs-andalus
class: event
kind: migration
label:
  ar: "رحيل القرطبي من الأندلس إلى بلاد المشرق"
  en: "Al-Qurtubi leaves al-Andalus for the East"
  ur: "قرطبی کا اندلس سے ممالکِ مشرق کی طرف رحلت"
summary:
  ar: "أدرج المقري أبا عبد الله محمد بن أحمد القرطبي في باب «التعريف ببعض من رحل من الأندلسيين إلى بلاد المشرق»، فقد غادر قرطبة مهاجرًا إلى المشرق حيث استقر به المقام بمصر {cite:nafh-tib-maqqari 2/210-211}؛ وفي دائرة المعارف أنه «سافر إلى الشرق واستقر بمنية أبي الخصيب في الصعيد» {cite:encyclopaedia-of-islam-2 vol. 5 p. 550}."
  en: "Al-Maqqari places Abu Abdallah Muhammad ibn Ahmad al-Qurtubi in the chapter 'Andalusis who travelled to the lands of the East': he left Cordoba as an emigrant and settled in Egypt {cite:nafh-tib-maqqari 2/210-211}. The Encyclopaedia of Islam says he 'made his way to the Orient and settled at Munyat Abi l-Khusayb in Upper Egypt' {cite:encyclopaedia-of-islam-2 vol. 5 p. 550}."
  ur: "مقری نے ابو عبداللہ محمد بن احمد قرطبی کو اس باب میں درج کیا جو ان اندلسیوں کے مشرق کی طرف ہجرت کرنے پر ہے: انہوں نے قرطہ سے ہجرت کر کے مصر میں سکونت اختیار کی {cite:nafh-tib-maqqari 2/210-211}۔ انسائیکلوپیڈیا آف اسلام کے مطابق وہ مشرق کی طرف روانہ ہوا اور صعید مصر کی منیۃ ابی الخصیب میں مقیم ہوا {cite:encyclopaedia-of-islam-2 vol. 5 p. 550}۔"
