id: event/abu-al-qasim-verses-on-disgrace-and-the-hatred-of-wine-and-the-bed-290
class: event
kind: other
label:
  ar: أبيات أبي القاسم في الخسف والحتف وكراهة المدام والوطاء، ص269-270، 290هـ
  en: Abu al-Qasim's verses on ruin for the destroyers of the religion and his dislike of wine and the bed, pp. 269-270, 290 AH
  ur: دین کے برباد کرنے والوں پر تباہی اور شراب و بستر سے بیزاری پر ابو القاسم کے اشعار، ص269-270، 290ھ
summary:
  ar: 'مقطوعتان يختم بهما الكتاب شعر أبي القاسم في السجن: الأولى في أن همته خسف وحتف وشقاء لمن أودى بالدين، والثانية في كراهته المدام والوطاء ولزومه الحياء وفخره بنسبه وبأسه.'
  en: 'Two pieces that close the verses ascribed to Abu al-Qasim in prison: the first says his purpose is ruin, death and wretchedness for whoever destroyed the religion, the second that he dislikes wine and the soft bed, keeps modesty and boasts of his lineage and his courage.'
  ur: 'دو ٹکڑے جن پر قید میں ابو القاسم سے منسوب اشعار ختم ہوتے ہیں: پہلے میں ان کا ارادہ ان کے لیے تباہی، موت اور بدبختی بتایا گیا جنہوں نے دین برباد کیا، دوسرے میں شراب اور نرم بستر سے ناپسندیدگی، حیا کی پابندی اور نسب و بہادری پر فخر۔'
