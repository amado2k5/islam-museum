id: event/abu-al-qasim-verses-on-disgrace-and-the-hatred-of-wine-and-the-bed-290
class: event
kind: other
label:
  ar: أبيات أبي القاسم في الخسف والحتف وكراهة المدام والوطاء، ص269-270، 290هـ
  en: Abu al-Qasim's verses on ruin for the destroyers of the religion and his dislike of wine and the bed, pp. 269-270, 290 AH
  fr: "Vers d’Abu al-Qasim sur la ruine des destructeurs de la religion et son aversion pour le vin et le lit, p. 269-270, 290 de l’hégire"
  ur: دین کے برباد کرنے والوں پر تباہی اور شراب و بستر سے بیزاری پر ابو القاسم کے اشعار، ص269-270، 290ھ
  es: "Versículos de Abu al-Qasim sobre la ruina de los destructores de la religión y su aversión al vino y a la cama, págs. 269-270, 290 AH"
  tr: "Ebu el-Kasım'ın aşağılanma, ölüm ve şarap ile hasırlara karşı tiksinti üzerine dizeleri, s. 269-270, Hicri 290"
  id: "Syair-syair Abu al-Qasim tentang kehinaan, kematian, dan kebencian terhadap anggur dan tikar, hlm. 269-270, 290 H."
summary:
  ar: 'مقطوعتان يختم بهما الكتاب شعر أبي القاسم في السجن: الأولى في أن همته خسف وحتف وشقاء لمن أودى بالدين، والثانية في كراهته المدام والوطاء ولزومه الحياء وفخره بنسبه وبأسه.'
  en: 'Two pieces that close the verses ascribed to Abu al-Qasim in prison: the first says his purpose is ruin, death and wretchedness for whoever destroyed the religion, the second that he dislikes wine and the soft bed, keeps modesty and boasts of his lineage and his courage.'
  fr: "Deux pièces terminent les vers attribués à Abu al-Qasim en prison : la première dit qu’il veut la ruine, la mort et le malheur de quiconque a détruit la religion ; la seconde, qu’il déteste le vin et le lit moelleux, s’attache à la pudeur et se vante de son lignage et de son courage."
  ur: 'دو ٹکڑے جن پر قید میں ابو القاسم سے منسوب اشعار ختم ہوتے ہیں: پہلے میں ان کا ارادہ ان کے لیے تباہی، موت اور بدبختی بتایا گیا جنہوں نے دین برباد کیا، دوسرے میں شراب اور نرم بستر سے ناپسندیدگی، حیا کی پابندی اور نسب و بہادری پر فخر۔'
  es: "Dos fragmentos que cierran los versos atribuidos a Abu al-Qasim en prisión: el primero dice que su propósito es la ruina, la muerte y la miseria para quien destruya la religión; el segundo, que le disgustan el vino y la cama blanda, que mantiene la modestia y se jacta de su linaje y su valentía."
  tr: "Kitap, Ebu el-Kasım'ın hapishanede yazdığı iki şiirle sona eriyor: Birincisi, dini yok eden herkes için yıkım, ölüm ve sefalet arzusunu anlatırken, ikincisi şarap ve hasırlara duyduğu nefreti, tevazuya bağlılığını ve soyuna ve gücüne duyduğu gururu konu alıyor."
  id: "Buku ini diakhiri dengan dua puisi karya Abu al-Qasim di penjara: yang pertama tentang ambisinya yang berupa kehancuran, kematian, dan kesengsaraan bagi siapa pun yang menghancurkan agama, dan yang kedua tentang kebenciannya terhadap anggur dan tikar, ketaatannya pada kesopanan, serta kebanggaannya pada garis keturunan dan kekuatannya."
