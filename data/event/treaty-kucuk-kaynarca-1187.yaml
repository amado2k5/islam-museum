label: { ar: "معاهدة قينارجة (كوتشك قاينارجة)" }
summary:
  ar: "استطاعت روسيا أن تحقق نصراً على العثمانيين في مدينة فارنا ببلغاريا، فطلب الصدر الأعظم الصلح وتم التوقيع في مدينة قينارجة ببلغاريا عام ١١٨٧هـ/١٧٧٤م في عهد السلطان عبد الحميد الأول، ومن أهم بنودها: إزالة العداوة بين الدولة وروسيا، واعتراف الطرفين بحرية بلاد القرم واستقلالها وحرية انتخاب خان لهم دون تدخل ولا ضريبة — وباعتبارهم مسلمين تنظم أمورهم المذهبية من قبل السلطان بمقتضى الشريعة — وسحب القوات العثمانية من القرم وتسليم القلاع، وتعيين سفير روسي في الأستانة، وتعهد الدولة بصيانة الحقوق والكنائس النصرانية في أراضيها، وحرية زيارة رهبان روسيا للقدس دون جزية، وحرية الملاحة للروس في كافة الموانئ العثمانية في المتوسط والأسود وحرية التجارة والقناصل، وحق الروس بناء كنيسة على الطريق العام في محلة بك أوغلي بغلطة تحت صيانة السفير الروسي، وعلى الدولة أداء خمسة عشر ألف كيس لروسيا في ثلاث سنين. وبالتمعن في هذه الشروط تلاحظ نهاية السيطرة العثمانية على البحر الأسود وتهيئة الأسس الدبلوماسية للتدخل المقبل {cite:dawlat-uthmaniyya-salabi p. 317-318}."
  en: "Küçük Kaynarca, 1774 — the war's end in Bulgaria: an 'independent' Crimea (its Muslims' religious affairs still under the caliph), Russian warships in Ottoman waters, a Russian church under protection in Galata, and fifteen thousand purses of indemnity — the end of Ottoman mastery of the Black Sea {cite:dawlat-uthmaniyya-salabi p. 317-318}."
