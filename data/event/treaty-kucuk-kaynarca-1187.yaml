label: { ar: "معاهدة قينارجة ⁦(كوتشك قاينارجة)⁩", en: "Treaty of Küçük Kaynarca", es: "Tratado de Küçük Kaynarca", fr: "Traité de Küçük Kaynarca", ur: "Küçük Kaynarca کا معاہدہ", tr: "Kaynarca Antlaşması (Küçük Kaynarca)", id: "Perjanjian Kaynarca (Küçük Kaynarca)" }
summary:
  ar: "استطاعت روسيا أن تحقق نصراً على العثمانيين في مدينة فارنا ببلغاريا، فطلب الصدر الأعظم الصلح وتم التوقيع في مدينة قينارجة ببلغاريا عام ١١٨٧هـ/١٧٧٤م في عهد السلطان عبد الحميد الأول، ومن أهم بنودها: إزالة العداوة بين الدولة وروسيا، واعتراف الطرفين بحرية بلاد القرم واستقلالها وحرية انتخاب خان لهم دون تدخل ولا ضريبة — وباعتبارهم مسلمين تنظم أمورهم المذهبية من قبل السلطان بمقتضى الشريعة — وسحب القوات العثمانية من القرم وتسليم القلاع، وتعيين سفير روسي في الأستانة، وتعهد الدولة بصيانة الحقوق والكنائس النصرانية في أراضيها، وحرية زيارة رهبان روسيا للقدس دون جزية، وحرية الملاحة للروس في كافة الموانئ العثمانية في المتوسط والأسود وحرية التجارة والقناصل، وحق الروس بناء كنيسة على الطريق العام في محلة بك أوغلي بغلطة تحت صيانة السفير الروسي، وعلى الدولة أداء خمسة عشر ألف كيس لروسيا في ثلاث سنين. وبالتمعن في هذه الشروط تلاحظ نهاية السيطرة العثمانية على البحر الأسود وتهيئة الأسس الدبلوماسية للتدخل المقبل {cite:dawlat-uthmaniyya-salabi p. 317-318}."
  en: "Küçük Kaynarca, 1774 — the war's end in Bulgaria: an 'independent' Crimea (its Muslims' religious affairs still under the caliph), Russian warships in Ottoman waters, a Russian church under protection in Galata, and fifteen thousand purses of indemnity — the end of Ottoman mastery of the Black Sea {cite:dawlat-uthmaniyya-salabi p. 317-318}."
  es: "Küçük Kaynarca, 1774: el fin de la guerra en Bulgaria: una Crimea \"independiente\" (los asuntos religiosos de sus musulmanes aún bajo el califa), buques de guerra rusos en aguas otomanas, una iglesia rusa bajo protección en Galata y quince mil bolsas de indemnización: el fin del dominio otomano del Mar Negro {cite:dawlat-uthmaniyya-salabi p. 317-318}."
  fr: "Küçük Kaynarca, 1774 — la fin de la guerre en Bulgarie: une Crimée « indépendante » (les affaires religieuses de ses musulmans toujours sous l'autorité du calife), des navires de guerre russes dans les eaux ottomanes, une église russe sous protection à Galata et quinze mille bourses d'indemnités — la fin de la domination ottomane sur la mer Noire {cite:dawlat-uthmaniyya-salabi p. 317-318}."
  ur: "Küçük Kaynarca، 1774 — بلغاریہ میں جنگ کا خاتمہ: ایک 'آزاد' کریمیا ⁦(اس کے مسلمانوں کے مذہبی معاملات اب بھی خلیفہ کے ماتحت ہیں)⁩، عثمانی پانیوں میں روسی جنگی جہاز، گالٹا میں ایک روسی چرچ کی حفاظت، اور پندرہ ہزار معاوضے کے پرس — بحیرہ اوٹومین کا خاتمہ۔ {حوالہ:دولت عثمانیہ سلبی ص۔ 317-318}۔"
  tr: "Rusya, Bulgaristan'ın Varna şehrinde Osmanlılara karşı bir zafer elde edince, Sadrazam barış istedi ve bu barış, Sultan I. Abdülhamid döneminde, Hicri 1187/Miladi 1774 yılında Bulgaristan'ın Kaynarca şehrinde imzalandı. En önemli maddeleri arasında şunlar yer alıyordu: devlet ile Rusya arasındaki düşmanlığın sona erdirilmesi, her iki tarafın da Kırım'ın özgürlüğünü ve bağımsızlığını tanıması ve müdahale veya vergi olmaksızın kendi Hanlarını seçme özgürlüğü (Müslüman oldukları için dini işleri Şeriat'a göre Sultan tarafından düzenlenecekti), Osmanlı güçlerinin Kırım'dan çekilmesi ve kalelerin teslim edilmesi, İstanbul'a bir Rus büyükelçisinin atanması, devletin topraklarındaki Hristiyan haklarını ve kiliselerini koruma sözü, Rus rahiplerin haraç ödemeden Kudüs'ü ziyaret etme özgürlüğü, Rusların Akdeniz ve Karadeniz'deki tüm Osmanlı limanlarında seyrüsefer özgürlüğü, ticaret ve konsolosluk özgürlüğü, Rusların Galata'nın Beyoğlu mahallesinde Rus koruması altında bir kilise inşa etme hakkı. Büyükelçi ve devletin üç yılda Rusya'ya on beş bin lira ödemesi. Bu koşulları inceleyerek, Osmanlı'nın Karadeniz üzerindeki kontrolünün sona erdiğini ve yaklaşan müdahale için diplomatik temellerin hazırlandığını fark ediyoruz. {cite:dawlat-uthmaniyya-salabi s. 317-318}"
  id: "Rusia berhasil meraih kemenangan atas Ottoman di kota Varna di Bulgaria, sehingga Wazir Agung meminta perdamaian dan perjanjian tersebut ditandatangani di kota Kaynarca di Bulgaria pada tahun 1187 H/1774 M pada masa pemerintahan Sultan Abdul Hamid I. Di antara klausul-klausul terpentingnya adalah: penghapusan permusuhan antara negara dan Rusia, pengakuan oleh kedua belah pihak atas kebebasan dan kemerdekaan Krimea dan kebebasan untuk memilih Khan mereka tanpa campur tangan atau pajak — dan sebagai Muslim, urusan keagamaan mereka akan diatur oleh Sultan sesuai dengan Syariah — penarikan pasukan Ottoman dari Krimea dan penyerahan benteng-benteng, penunjukan duta besar Rusia di Istanbul, janji negara untuk melindungi hak-hak dan gereja-gereja Kristen di wilayahnya, kebebasan para biarawan Rusia untuk mengunjungi Yerusalem tanpa upeti, kebebasan navigasi bagi orang Rusia di semua pelabuhan Ottoman di Mediterania dan Laut Hitam, kebebasan perdagangan dan konsul, hak orang Rusia untuk membangun gereja di jalan umum di lingkungan Bey Oglu di Galata di bawah perlindungan duta besar Rusia, dan pembayaran negara sebesar lima belas ribu uang kepada Rusia dalam tiga tahun. Dengan meneliti kondisi ini, kita melihat berakhirnya kendali Ottoman atas Laut Hitam dan persiapan landasan diplomatik untuk intervensi yang akan datang {cite:dawlat-uthmaniyya-salabi p. 317-318}."
