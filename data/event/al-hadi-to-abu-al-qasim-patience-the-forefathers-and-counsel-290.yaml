label:
  ar: "أبيات للهادي إلى ابنه في الصبر والتوكل وأسوة الآباء والوصية، ص299-300"
  en: "Verses of al-Hadi to his son on patience, trust, the example of the forefathers and counsel, pp. 299-300"
  ur: "ہادی کے بیٹے کے نام اشعار: صبر، توکل، آباء کی مثال اور وصیت، ص299-300"
  es: "Versículos de al-Hadi a su hijo sobre la paciencia, la confianza, el ejemplo de los antepasados y el consejo, págs. 299-300"
  fr: "Versets d'al-Hadi à son fils sur la patience, la confiance, l'exemple des ancêtres et les conseils, pp. 299-300"
  tr: "Hadi'nin oğluna sabır, Allah'a tevekkül, babaların örneği ve nasihat üzerine yazdığı ayetler, s. 299-300"
  id: "Ayat-ayat Al-Hadi untuk putranya tentang kesabaran, berserah kepada Allah, teladan seorang ayah, dan nasihat, hlm. 299-300"
summary:
  ar: "يتابع الشاعر قصيدته إلى ابنه فيقول إن سروره قليل إذا اجتمع الإخوان ولم ير محمداً، وإنه صابر جلد مفوّض أمره إلى الله، ويتمنى لو كان قريباً فيدافع عنه، ويذكر آباءه الذين نالهم ما نالهم يوم الطف إقامةً للحق، ويصوّر في أبيات يوم المعاد ووعيد قاتلي أهل البيت، ثم يوصيه بالتقوى والدين والصبر ويختم بسلام."
  en: "The poet continues his poem to his son: his joy is small when the brothers gather and he does not see Muhammad, he is steady and patient and commits his affair to God, he wishes he were near to defend him, he recalls the forefathers who suffered at al-Taff for establishing the right, and in several lines he pictures the Day of the Return and the threat to the killers of the family of the Prophet; he then counsels his son to godfearing, religion and patience and ends with a greeting."
  ur: "شاعر بیٹے کے نام اپنی نظم جاری رکھتا ہے: جب بھائی جمع ہوتے ہیں اور وہ محمد کو نہیں دیکھتا تو اس کی خوشی کم رہ جاتی ہے، وہ ثابت قدم اور صابر ہے اور معاملہ اللہ کے سپرد کرتا ہے، چاہتا ہے کہ قریب ہوتا تو اس کا دفاع کرتا، اپنے ان آباء کو یاد کرتا ہے جنہیں حق کے قیام کے لیے طف میں جو پہنچا پہنچا، اور کئی اشعار میں یوم المعاد اور اہل بیت کے قاتلوں کے لیے وعید کی تصویر کھینچتا ہے؛ پھر بیٹے کو تقویٰ، دین اور صبر کی وصیت کر کے سلام پر ختم کرتا ہے۔"
  es: "El poeta continúa su poema a su hijo: su alegría es pequeña cuando los hermanos se reúnen y no ve a Mahoma, es firme y paciente y encomienda su asunto a Dios, desearía estar cerca para defenderlo, recuerda a los antepasados que sufrieron en al-Taff por establecer la justicia, y en varios versos describe el Día del Retorno y la amenaza a los asesinos de la familia del Profeta; luego aconseja a su hijo que tema a Dios, que sea religioso y paciente, y termina con un saludo."
  fr: "Le poète poursuit son poème à son fils: sa joie est faible lorsque les frères se réunissent et qu'il ne voit pas Muhammad; il est calme et patient et confie son sort à Dieu; il souhaite être près de lui pour le défendre; il se souvient des ancêtres qui ont souffert à al-Taff pour avoir établi le droit; et, en plusieurs vers, il décrit le Jour du Retour et la menace qui pèse sur les assassins de la famille du Prophète; il conseille ensuite à son fils la crainte de Dieu, la religion et la patience, et termine par une salutation."
  tr: "Şair, şiirine oğluna hitaben devam ederek, kardeşler bir araya geldiğinde Muhammed'i görmediği takdirde sevincinin az olduğunu, sabırlı, metanetli olduğunu ve işlerini Allah'a emanet ettiğini söyler. Keşke yanında olsaydı da onu savunabilseydi diye düşünür. Kerbela gününde hakikat uğruna çektiği acıları anar. Şiirinde Kıyamet Günü'nü ve Peygamber ailesinin katillerine yönelik tehdidi betimler. Ardından oğluna dindar, dini ve sabırlı olmasını öğütler ve barış dilekleriyle şiirini sonlandırır."
  id: "Penyair melanjutkan puisinya kepada putranya, mengatakan bahwa kegembiraannya sedikit jika saudara-saudaranya berkumpul dan dia tidak melihat Muhammad, dan bahwa dia sabar, teguh, dan menyerahkan urusannya kepada Tuhan. Dia berharap putranya berada di dekatnya agar bisa melindunginya. Dia menyebutkan para leluhurnya yang menderita apa yang mereka derita pada hari Karbala karena membela kebenaran. Dia menggambarkan dalam bait-bait puisinya Hari Kiamat dan ancaman bagi para pembunuh keluarga Nabi. Kemudian dia menasihati putranya untuk menjadi saleh, religius, dan sabar, dan mengakhiri dengan salam damai."
