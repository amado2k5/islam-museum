summary:
  ar: "بطاقة أولية لمعركة طبرقة سنة ٧٠٠م، اشتباك الفاتحين والبربر والبيزنطيين في الفتح المغربي؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Tabarka in 700, the conquerors' clash with Berbers and Byzantines in the Maghreb conquest; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Batalla de Tabarka en el año 700, el enfrentamiento de los conquistadores con los bereberes y bizantinos en la conquista del Magreb; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte provisoire pour la bataille de Tabarka en 700, l'affrontement des conquérants avec les Berbères et les Byzantins lors de la conquête du Maghreb; ses sources ne sont pas encore vérifiées sur la page."
  ur: "700 میں تبرکہ کی جنگ کے لیے ڈرافٹ کارڈ، مغرب کی فتح میں بربروں اور بازنطینیوں کے ساتھ فاتحین کی جھڑپ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "Bu, Fas'ın fethi sırasında fatihler olan Berberiler ile Bizanslılar arasında 700 yılında gerçekleşen Tabarka Muharebesi'ne dair ön bir anlatımdır; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Tabarka pada tahun 700 M, bentrokan antara para penakluk, suku Berber dan Bizantium dalam penaklukan Maroko; sumber-sumbernya belum ditinjau di halaman ini."
