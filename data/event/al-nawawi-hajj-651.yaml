class: event
kind: pilgrimage
label:
  ar: "حج النووي مع والده، ٦٥١هـ/١٢٥٣م"
  en: "Al-Nawawi makes the pilgrimage with his father, 651/1253"
  ur: "نووی کا والد کے ہمراہ حج، 651ھ/1253ء"
  es: "Al-Nawawi realiza la peregrinación con su padre, 651/1253"
  fr: "Al-Nawawi effectue le pèlerinage avec son père, 651/1253"
  tr: "El-Nawawi, 651 Hicri/1253 Miladi yılında babasıyla birlikte Hac ibadetini yerine getirmiştir."
  id: "Al-Nawawi melaksanakan ibadah haji bersama ayahnya pada tahun 651 H/1253 M."
summary:
  ar: "حج النووي مع والده سنة ٦٥١هـ/١٢٥٣م، وكانت وقفة يوم جمعة، وأقاما بالمدينة نحو شهر ونصف؛ ويذكر والده أن ابنه أصابته الحمى منذ خروجهما من نوى فلم تفارقه حتى يوم عرفة ولم يتأوه قط {cite:shadharat-dhahab p. 355} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:al-bidaya-wal-nihaya p. 294}."
  en: "In 651/1253 al-Nawawi made the hajj with his father; the standing at Arafa fell on a Friday, and the two stayed in Medina for about a month and a half. His father recalled that a fever seized the young man on the road from Nawa and did not leave him until the day of Arafa, yet he never once moaned {cite:shadharat-dhahab p. 355} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:al-bidaya-wal-nihaya p. 294}."
  ur: "651ھ/1253ء میں نووی نے اپنے والد کے ساتھ حج کیا؛ وقوف عرفہ جمعہ کے دن تھا اور دونوں مدینہ میں تقریباً ڈیڑھ ماہ رہے۔ ان کے والد بیان کرتے ہیں کہ نوى سے نکلتے وقت بیٹے کو بخار ہو گیا جو عرفہ کے دن تک نہ اترا مگر اس نے کبھی کراہ نہیں کی {cite:shadharat-dhahab p. 355} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:al-bidaya-wal-nihaya p. 294}۔"
  es: "En 651/1253, al-Nawawi realizó el Hajj con su padre; la parada en Arafa cayó en viernes, y ambos permanecieron en Medina durante aproximadamente un mes y medio. Su padre recordó que una fiebre se apoderó del joven en el camino desde Nawa y no lo abandonó hasta el día de Arafa, sin embargo, nunca se quejó {cite:shadharat-dhahab p. 355} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:al-bidaya-wal-nihaya p. 294}."
  fr: "En 651/1253, al-Nawawi accomplit le hajj avec son père; le pèlerinage à Arafa coïncidait avec un vendredi, et tous deux séjournèrent à Médine pendant environ un mois et demi. Son père se souvenait qu’une fièvre avait saisi le jeune homme sur la route de Nawa et ne l’avait pas quitté jusqu’au jour d’Arafa, sans qu’il ne se plaigne une seule fois {cite:shadharat-dhahab p. 355} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:al-bidaya-wal-nihaya p. 294}."
  tr: "El-Nawawi, babasıyla birlikte Hicri 651/Miladi 1253 yılında Hac ibadetini yerine getirmiştir. Arafat'ta durma günü Cuma idi ve Medine'de yaklaşık bir buçuk ay kaldılar. Babası, oğlunun Nevev'den ayrıldıkları günden itibaren ateşli bir hastalığa yakalandığını ve Arafat gününe kadar bu hastalığın geçmediğini, ancak hiç inlemediğini belirtmektedir. {kaynak:şadharat-dhahab s. 355} {kaynak:islam-ansiklopedisi-2 cilt 7 s. 1096} {kaynak:el-bidaya-wal-nihaya s. 294}."
  id: "Al-Nawawi melaksanakan ibadah haji bersama ayahnya pada tahun 651 H/1253 M. Mereka berdiri di Arafat pada hari Jumat, dan tinggal di Madinah selama sekitar satu setengah bulan. Ayahnya menyebutkan bahwa putranya menderita demam sejak mereka meninggalkan Nawa, dan demam itu tidak kunjung reda hingga hari Arafat, dan ia tidak pernah mengeluh. {cite:shadharat-dhahab p. 355} {cite:encyclopaedia-of-islam-2 vol. 7 p. 1096} {cite:al-bidaya-wal-nihaya p. 294}."
