id: event/assassination-attempt-of-amir-and-arbad
class: event
kind: other
label: { en: "The plot of Amir ibn al-Tufayl and Arbad ibn Qays", ar: "مؤامرة عامر بن الطفيل وأربد بن قيس" }
summary:
  en: "Within the Banu Amir delegation of 9 AH, Amir ibn al-Tufayl engaged the Prophet in talk while Arbad ibn Qays circled behind him and half-drew his sword; the tradition reports that God restrained his hand, and on their return Arbad was struck by lightning and Amir died of a throat swelling."
  ar: "تآمر عامر بن الطفيل وأربد بن قيس داخل وفد بني عامر سنة 9هـ: عند ابن إسحاق طلب عامر من النبي أن يخاليه ثلاثاً وهو ينتظر أن يضربه أربد بالسيف فلم يفعل، فتهدده عامر ودعا عليه النبي؛ وفي الرواية المتأخرة دار أربد خلفه واخترط سيفه شبراً فحبس الله يده. وفي رجوعهما مات عامر بغدة في عنقه في بيت امرأة سلولية وأصابت أربداً صاعقة فأحرقته، ونزلت فيهما آيات من سورة الرعد بحسب ابن هشام عن ابن عباس."
