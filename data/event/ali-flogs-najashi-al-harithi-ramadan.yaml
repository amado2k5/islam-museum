      ar: "يورد الكتاب الرواية عن عطاء عن أبيه، ويجعل الضربة الثانية تعزيراً على الجرأة على الله وإفطار رمضان، ولا يحكم في جواز الجمع بين الحد والتعزير ⁦(ص 306)⁩، بل يعرض الحادثة في باب الحد والتعزير {cite:sallabi-ali-vol1 p. 306}{cite:sallabi-ali-vol1 p. 316}."
