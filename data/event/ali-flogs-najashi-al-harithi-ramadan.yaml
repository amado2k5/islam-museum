label: { ar: "علي يجلد النجاشي الحارثي الشاعر لشربه الخمر في رمضان", en: "Ali flogs the poet al-Najashi al-Harithi for drinking wine in Ramadan" }
summary:
  ar: "شرب النجاشي الحارثي الشاعر الخمر في رمضان، فضربه علي ثمانين جلدة ثم حبسه، ثم أخرجه في الغد فضربه عشرين أخرى وقال له إنما جلدتك لجرأتك على الله وإفطارك في رمضان {cite:sallabi-ali-vol1 p. 306}. ويذكر الكتاب هذا مثالاً على تعزير علي بالحبس بعد الحد {cite:sallabi-ali-vol1 p. 316}."
  en: "Al-Najashi al-Harithi, a poet, drank wine in Ramadan; Ali flogged him eighty lashes and jailed him, then flogged him twenty more the next day, saying the lashes were for his defiance of God and breaking the fast. The book cites the case as an example of prison as ta'zir."
