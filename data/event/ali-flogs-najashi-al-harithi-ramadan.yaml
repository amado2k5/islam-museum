id: event/ali-flogs-najashi-al-harithi-ramadan
class: event
kind: court-ruling
label: { ar: "علي يجلد النجاشي الحارثي الشاعر لشربه الخمر في رمضان", en: "Ali flogs the poet al-Najashi al-Harithi for drinking wine in Ramadan", es: "Ali azota al poeta al-Najashi al-Harithi por beber vino en Ramadán", fr: "Ali fouette le poète al-Najashi al-Harithi pour avoir bu du vin pendant le Ramadan", ur: "علی نے شاعر النجاشی الحارثی کو رمضان میں شراب پینے پر کوڑے مارے۔", tr: "Ali, Ramazan ayında alkol içtiği için şair el-Najashi el-Harithi'yi kırbaçladı.", id: "Ali mencambuk penyair al-Najashi al-Harithi karena minum alkohol selama Ramadan." }
summary:
  ar: "شرب النجاشي الحارثي الشاعر الخمر في رمضان، فضربه علي ثمانين جلدة ثم حبسه، ثم أخرجه في الغد فضربه عشرين أخرى وقال له إنما جلدتك لجرأتك على الله وإفطارك في رمضان {cite:sallabi-ali-vol1 p. 306}. ويذكر الكتاب هذا مثالاً على تعزير علي بالحبس بعد الحد {cite:sallabi-ali-vol1 p. 316}."
  en: "Al-Najashi al-Harithi, a poet, drank wine in Ramadan; Ali flogged him eighty lashes and jailed him, then flogged him twenty more the next day, saying the lashes were for his defiance of God and breaking the fast. The book cites the case as an example of prison as ta'zir."
  es: "Al-Najashi al-Harithi, poeta, bebió vino durante el Ramadán; Ali lo azotó ochenta veces y lo encarceló, y al día siguiente le propinó veinte latigazos más, alegando que los castigos eran por desafiar a Dios y romper el ayuno. El libro cita este caso como ejemplo de la prisión como castigo divino (ta'zir)."
  fr: "Le poète Al-Najashi al-Harithi but du vin pendant le Ramadan; Ali le fit fouetter quatre-vingts coups de fouet et l’emprisonna, puis le fit fouetter vingt fois de plus le lendemain, prétextant que ces coups étaient pour son insubordination envers Dieu et la rupture du jeûne. L’ouvrage cite ce cas comme exemple de la peine d’emprisonnement (ta’zir)."
  ur: "النجاشی الحارثی، ایک شاعر، رمضان میں شراب پیتا تھا۔ علی نے اسے اسّی کوڑے مارے اور جیل بھیج دیا، پھر اگلے دن مزید بیس کوڑے مارے، یہ کہتے ہوئے کہ یہ کوڑے اس کے خدا کی نافرمانی اور روزہ توڑنے کے لیے تھے۔ کتاب تذیر کے طور پر جیل کی مثال کے طور پر مقدمہ پیش کرتی ہے۔"
  tr: "Şair el-Najashi el-Harithi Ramazan ayında şarap içtiği için Ali onu seksen kez kırbaçlattı ve hapse attırdı. Ertesi gün, \"Seni sadece Allah'a karşı küstahlığın ve Ramazan ayında orucunu bozduğun için kırbaçladım\" diyerek yirmi kez daha kırbaçlattı. {cite:sallabi-ali-vol1 s. 306}. Kitap bunu, Ali'nin emredilen cezadan sonra hapis cezası verme takdirine bağlı bir ceza örneği olarak zikrediyor. {cite:sallabi-ali-vol1 s. 316}."
  id: "Penyair al-Najashi al-Harithi minum anggur selama Ramadan, sehingga Ali menyuruhnya dicambuk delapan puluh kali dan dipenjarakan. Keesokan harinya, ia menyuruhnya dicambuk lagi dua puluh kali, seraya berkata, “Aku mencambukmu hanya karena keberanianmu melawan Tuhan dan karena melanggar puasa selama Ramadan.” {cite:sallabi-ali-vol1 p. 306}. Buku ini menyebutkan hal ini sebagai contoh hukuman penjara yang diberikan Ali secara diskresioner setelah hukuman yang telah ditentukan. {cite:sallabi-ali-vol1 p. 316}."
