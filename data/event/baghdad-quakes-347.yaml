label: { ar: "زلازل سنة ٣٤٧ وجراد العراق" }
summary:
  ar: "في سنة سبع وأربعين وثلاثمائة كانت زلزلة بغداد في نيسان وكانت زلازل عظيمة في حلوان وبادان الجبل وقم وكاشان فقتلت خلقًا كثيرًا وأخربت، وظهر في آخر نيسان وأيار جراد أتلف الغلات الصيفية والبقول ببغداد وأتلف من الغلات الشتوية بديار مضر شيئًا عظيمًا واجتاح الرطاب والبطيخ، وورد الخبر بأن الروم خرجوا إلى آمد وميافارقين وفتحوا حصونًا كثيرة وقتلوا من المسلمين ألفًا وخمسمائة رجل، وفي آخر هذه السنة فتح الروم سميساط وأخربوها {cite:muntazam-ibn-al-jawzi p. 683}."
  en: "In 347 earthquakes struck Baghdad, Hulwan, Badan al-Jabal, Qum and Kashan killing many; locusts devoured the summer crops and melons across Iraq and Diyar Mudar; the Byzantines took Amid and Mayyafariqin's forts killing 1,500, and ended the year by taking and ruining Samosata {cite:muntazam-ibn-al-jawzi p. 683}."
