label: { ar: "زلازل سنة ٣٤٧ وجراد العراق", en: "Earthquakes and Locusts in Iraq in 347", fr: "Tremblements de terre et sauterelles en Irak en 347", es: "Terremotos y plagas de langostas en Irak en 347", ur: "عراق میں 347 میں زلزلے اور ٹڈی دل", tr: "347 yılındaki depremler ve Irak'taki çekirge istilası", id: "Gempa bumi tahun 347 dan wabah belalang di Irak" }
summary:
  ar: "في سنة سبع وأربعين وثلاثمائة كانت زلزلة بغداد في نيسان وكانت زلازل عظيمة في حلوان وبادان الجبل وقم وكاشان فقتلت خلقًا كثيرًا وأخربت، وظهر في آخر نيسان وأيار جراد أتلف الغلات الصيفية والبقول ببغداد وأتلف من الغلات الشتوية بديار مضر شيئًا عظيمًا واجتاح الرطاب والبطيخ، وورد الخبر بأن الروم خرجوا إلى آمد وميافارقين وفتحوا حصونًا كثيرة وقتلوا من المسلمين ألفًا وخمسمائة رجل، وفي آخر هذه السنة فتح الروم سميساط وأخربوها {cite:muntazam-ibn-al-jawzi p. 683}."
  en: "In 347 earthquakes struck Baghdad, Hulwan, Badan al-Jabal, Qum and Kashan killing many; locusts devoured the summer crops and melons across Iraq and Diyar Mudar; the Byzantines took Amid and Mayyafariqin's forts killing 1,500, and ended the year by taking and ruining Samosata {cite:muntazam-ibn-al-jawzi p. 683}."
  fr: "En 347, des tremblements de terre frappèrent Bagdad, Hulwan, Badan al-Jabal, Qum et Kashan, faisant de nombreux morts ; les sauterelles dévorèrent les récoltes d'été et les melons à travers l'Irak et le Diyar Mudar ; les Byzantins prirent Amid et les forts de Mayyafariqin, tuant 1 500 personnes, et achevèrent l'année en prenant et ruinant Samosate {cite:muntazam-ibn-al-jawzi p. 683}."
  es: "En el año 347, terremotos azotaron Bagdad, Hulwan, Badan al-Jabal, Qum y Kashan, causando numerosas muertes; plagas de langostas devoraron los cultivos de verano y los melones en todo Irak y Diyar Mudar; los bizantinos tomaron las fortalezas de Amid y Mayyafariqin, matando a 1.500 personas, y terminaron el año tomando y destruyendo Samosata {cite:muntazam-ibn-al-jawzi p. 683}."
  ur: "347 میں بغداد، حلوان، بدان الجبل، قم اور کاشان میں زلزلے آئے جن میں بہت سے لوگ مارے گئے۔ ٹڈی دل نے عراق اور دیار مد میں موسم گرما کی فصلوں اور خربوزوں کو کھا لیا۔ بازنطینیوں نے امید اور مایافارقین کے قلعوں پر قبضہ کر لیا جس میں 1500 افراد ہلاک ہوئے، اور سموسات کو لے کر اور برباد کر کے سال کا اختتام ہوا۔ 683}۔"
  tr: "Hicri 347 yılında, Nisan ayında Bağdat'ta bir deprem oldu ve Hulvan, Bedan el-Cebel, Kum ve Kaşan'da da büyük depremler meydana geldi; bu depremlerde birçok insan öldü ve büyük yıkım oldu. Nisan sonu ve Mayıs başında çekirgeler ortaya çıktı ve Bağdat'taki yazlık ürünleri ve baklagilleri, Diyar Mudar'daki kışlık ürünlerin büyük bir kısmını ve hurma ile kavunları yok etti. Romalıların Amid ve Mayyafariqin'e gidip birçok kaleyi ele geçirdikleri ve 1500 Müslüman erkeği öldürdükleri haberi geldi. Bu yılın sonunda Romalılar Samosata'yı ele geçirip yerle bir ettiler. {cite:muntazam-ibn-al-jawzi s. 683}"
  id: "Pada tahun 347 H, terjadi gempa bumi di Baghdad pada bulan April, dan terjadi gempa bumi besar di Hulwan, Badan al-Jabal, Qum, dan Kashan, yang menewaskan banyak orang dan menyebabkan kerusakan. Pada akhir April dan Mei, belalang muncul dan menghancurkan tanaman musim panas dan kacang-kacangan di Baghdad serta menghancurkan sebagian besar tanaman musim dingin di Diyar Mudar, dan mereka menyapu bersih kurma dan melon. Berita datang bahwa bangsa Romawi pergi ke Amid dan Mayyafariqin dan menaklukkan banyak benteng serta membunuh 1.500 orang Muslim. Pada akhir tahun ini, bangsa Romawi menaklukkan Samosata dan menghancurkannya. {cite:muntazam-ibn-al-jawzi p. 683}."
