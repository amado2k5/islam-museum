id: event/killing-of-kulthum-ibn-iyad
class: event
kind: death
label: { ar: "قتل كلثوم بن عياض بإفريقية", en: "The Killing of Kulthum ibn Iyad in Ifriqiya", es: "El asesinato de Kulthum ibn Iyad en Ifriqiya", fr: "Le meurtre de Kulthum ibn Iyad en Ifriqiya", ur: "افریقیہ میں کلثوم بن عیاض کا قتل", tr: "Kulthum ibn Ayad Afrika'da öldürüldü.", id: "Kulthum ibn Ayad terbunuh di Afrika." }
summary:
  ar: "عند البلاذري عن ابن الكلبي: ولّى هشام بن عبد الملك كلثوم بن عياض بن وحوح القشيري إفريقية فانتقض أهلها عليه فقُتل بها."
  en: "In al-Baladhuri on Ibn al-Kalbi's report: Hisham ibn Abd al-Malik gave Kulthum ibn Iyad ibn Wahwah al-Qushayri Ifriqiya, whose people rose against him so that he was killed there."
  es: "En al-Baladhuri sobre el informe de Ibn al-Kalbi: Hisham ibn Abd al-Malik le dio a Kulthum ibn Iyad ibn Wahwah al-Qushayri Ifriqiya, cuya gente se levantó contra él y fue asesinado allí."
  fr: "Dans al-Baladhuri sur le rapport d'Ibn al-Kalbi: Hisham ibn Abd al-Malik a donné à Kulthum ibn Iyad ibn Wahwah al-Qushayri Ifriqiya, dont les gens se sont soulevés contre lui de sorte qu'il a été tué là-bas."
  ur: "البلدوری میں ابن الکلبی کی روایت پر ہے: ہشام بن عبد الملک نے کلثوم بن عیاض بن وہوا القشیری افریقیہ کو دیا جس کے لوگ اس کے خلاف اٹھ کھڑے ہوئے اور وہ وہیں مارا گیا۔"
  tr: "İbn el-Kalbi'nin rivayetine göre, El-Baladhuri şöyle der: Hişam ibn Abd el-Malik, Kulthum ibn Ayad ibn Wahwah el-Kuşeyri'yi İfrikiye valisi olarak atadı, ancak halkı ona karşı ayaklandı ve orada öldürüldü."
  id: "Al-Baladhuri, berdasarkan riwayat Ibn al-Kalbi: Hisham ibn Abd al-Malik menunjuk Kulthum ibn Ayad ibn Wahwah al-Qushayri sebagai gubernur Ifriqiya, tetapi penduduknya memberontak terhadapnya dan dia terbunuh di sana."
