id: event/al-hadi-names-the-wrongs-of-his-opponents-and-what-he-did-for-the-people-in-verse-292
class: event
kind: other
label:
  ar: "أبيات للهادي يذكر فيها ما ينسبه إلى خصومه من جور، وأنه لم يترك جهادهم زهداً بل لقلة الأعوان، وما صنعه في الرعية من دعوة وقسمة مال ورد مظالم، ص324-325"
  en: "Verses of al-Hadi on the wrongs he ascribes to his opponents, saying he did not leave jihad against them from asceticism but for want of helpers, and what he did for the subjects in calling, dividing wealth and restoring wrongs, pp. 324-325"
  ur: "ہادی کے اشعار جن میں وہ اپنے مخالفین سے منسوب ظلم کا ذکر کرتا ہے، کہتا ہے کہ اس نے ان کے خلاف جہاد زہد کی وجہ سے نہیں بلکہ مددگاروں کی کمی کی وجہ سے چھوڑا، اور رعایا کے لیے جو کیا، دعوت، مال کی تقسیم اور مظالم کی واپسی، ص324-325"
summary:
  ar: "يتابع الهادي قصيدة الكامل ⁦(ص324-325)⁩: يخاطب من يسميهم بلفظه «أمة الكفر»، وهو وصف الشاعر لا حكم المتحف، فينسب إليهم ترك الهدى والتعلق بالظلم وقتل الناس وإيتام الأطفال وسبي النساء ومخالفة آي القرآن وقتل الضعيف، ويصف المسلمين بأنهم باكون من الحزن والضر؛ ثم يقول إنه لم يترك جهادهم زهداً ولكن لقلة الأعوان، وإنه حرص على لقاء جمعهم فأبت عليه تقلبات الزمن، وإنه دعا الناس إلى إلههم ونصح وقسم أموال الرعية بينها ورد ظالمها فعاد مسلماً."
  en: "Al-Hadi continues the kamil poem (pp. 324-325): he addresses those he calls by his own word \"the community of unbelief\", which is the poet's description and not the museum's, and ascribes to them the leaving of guidance, clinging to wrong, killing people, orphaning children, taking women captive, setting themselves against the verses of the Qur'an and killing the weak, and describes the Muslims as weeping from grief and harm; then he says he did not leave jihad against them from asceticism but for want of helpers, that he longed to meet their host but the turns of the age refused him, that he called people to their God and advised, divided the subjects' wealth among them and turned back their wrongdoer so that he came back peaceable."
  ur: "ہادی کامل کی نظم جاری رکھتا ہے ⁦(ص324-325)⁩: وہ ان سے مخاطب ہوتا ہے جنہیں اپنے لفظ «امت کفر» سے پکارتا ہے، جو شاعر کا وصف ہے عجائب گھر کا حکم نہیں، اور ان سے ہدایت چھوڑنے، ظلم سے چمٹنے، لوگوں کو قتل کرنے، بچوں کو یتیم کرنے، عورتوں کو قید کرنے، قرآن کی آیات کی مخالفت کرنے اور کمزور کو قتل کرنے کی نسبت کرتا ہے، اور مسلمانوں کو غم اور تکلیف سے روتا بتاتا ہے؛ پھر کہتا ہے کہ اس نے ان کے خلاف جہاد زہد سے نہیں چھوڑا بلکہ مددگاروں کی کمی کی وجہ سے، کہ وہ ان کے لشکر سے ملنے کا مشتاق تھا مگر زمانے کے الٹ پھیر نے انکار کر دیا، کہ اس نے لوگوں کو ان کے رب کی طرف بلایا، نصیحت کی، رعایا کا مال ان میں بانٹ دیا اور اس کے ظالم کو لوٹا دیا تو وہ پرامن ہو کر لوٹا۔"
