id: event/al-hadi-names-the-wrongs-of-his-opponents-and-what-he-did-for-the-people-in-verse-292
class: event
kind: other
label:
  ar: "أبيات للهادي يذكر فيها ما ينسبه إلى خصومه من جور، وأنه لم يترك جهادهم زهداً بل لقلة الأعوان، وما صنعه في الرعية من دعوة وقسمة مال ورد مظالم، ص324-325"
  en: "Verses of al-Hadi on the wrongs he ascribes to his opponents, saying he did not leave jihad against them from asceticism but for want of helpers, and what he did for the subjects in calling, dividing wealth and restoring wrongs, pp. 324-325"
  ur: "ہادی کے اشعار جن میں وہ اپنے مخالفین سے منسوب ظلم کا ذکر کرتا ہے، کہتا ہے کہ اس نے ان کے خلاف جہاد زہد کی وجہ سے نہیں بلکہ مددگاروں کی کمی کی وجہ سے چھوڑا، اور رعایا کے لیے جو کیا، دعوت، مال کی تقسیم اور مظالم کی واپسی، ص324-325"
  es: "Versículos de al-Hadi sobre las injusticias que atribuye a sus oponentes, diciendo que no abandonó la yihad contra ellos por ascetismo sino por falta de ayudantes, y lo que hizo por sus súbditos al llamarlos, repartir la riqueza y reparar las injusticias, págs. 324-325."
  fr: "Versets d'al-Hadi sur les torts qu'il attribue à ses adversaires, affirmant qu'il n'a pas abandonné le jihad contre eux par ascétisme mais par manque d'alliés, et sur ce qu'il a fait pour ses sujets en les appelant à la prière, en partageant les richesses et en réparant les injustices, pp. 324-325"
  tr: "Hadi'nin, kendisine zulmeden muhaliflerine atfettiği suçlamaları ve onlarla mücadeleyi bırakmasının sebebinin zühd değil, destekçi eksikliği olduğunu, ayrıca tebliğ, mal dağıtımı ve haksızlıkları giderme gibi konularda halk için neler yaptığını anlattığı ayetler (s. 324-325)."
  id: "Ayat-ayat karya al-Hadi yang menyebutkan apa yang ia tuduhkan kepada para penentangnya yang berbuat zalim, dan bahwa ia tidak meninggalkan perjuangan melawan mereka karena asketisme tetapi karena kurangnya pendukung, dan apa yang ia lakukan untuk masyarakat dalam hal berdakwah, membagikan kekayaan, dan menyelesaikan keluhan, hlm. 324-325"
summary:
  ar: "يتابع الهادي قصيدة الكامل ⁦(ص324-325)⁩: يخاطب من يسميهم بلفظه «أمة الكفر»، وهو وصف الشاعر لا حكم المتحف، فينسب إليهم ترك الهدى والتعلق بالظلم وقتل الناس وإيتام الأطفال وسبي النساء ومخالفة آي القرآن وقتل الضعيف، ويصف المسلمين بأنهم باكون من الحزن والضر؛ ثم يقول إنه لم يترك جهادهم زهداً ولكن لقلة الأعوان، وإنه حرص على لقاء جمعهم فأبت عليه تقلبات الزمن، وإنه دعا الناس إلى إلههم ونصح وقسم أموال الرعية بينها ورد ظالمها فعاد مسلماً."
  en: "Al-Hadi continues the kamil poem (pp. 324-325): he addresses those he calls by his own word \"the community of unbelief\", which is the poet's description and not the museum's, and ascribes to them the leaving of guidance, clinging to wrong, killing people, orphaning children, taking women captive, setting themselves against the verses of the Qur'an and killing the weak, and describes the Muslims as weeping from grief and harm; then he says he did not leave jihad against them from asceticism but for want of helpers, that he longed to meet their host but the turns of the age refused him, that he called people to their God and advised, divided the subjects' wealth among them and turned back their wrongdoer so that he came back peaceable."
  ur: "ہادی کامل کی نظم جاری رکھتا ہے ⁦(ص324-325)⁩: وہ ان سے مخاطب ہوتا ہے جنہیں اپنے لفظ «امت کفر» سے پکارتا ہے، جو شاعر کا وصف ہے عجائب گھر کا حکم نہیں، اور ان سے ہدایت چھوڑنے، ظلم سے چمٹنے، لوگوں کو قتل کرنے، بچوں کو یتیم کرنے، عورتوں کو قید کرنے، قرآن کی آیات کی مخالفت کرنے اور کمزور کو قتل کرنے کی نسبت کرتا ہے، اور مسلمانوں کو غم اور تکلیف سے روتا بتاتا ہے؛ پھر کہتا ہے کہ اس نے ان کے خلاف جہاد زہد سے نہیں چھوڑا بلکہ مددگاروں کی کمی کی وجہ سے، کہ وہ ان کے لشکر سے ملنے کا مشتاق تھا مگر زمانے کے الٹ پھیر نے انکار کر دیا، کہ اس نے لوگوں کو ان کے رب کی طرف بلایا، نصیحت کی، رعایا کا مال ان میں بانٹ دیا اور اس کے ظالم کو لوٹا دیا تو وہ پرامن ہو کر لوٹا۔"
  es: "Al-Hadi continúa el poema kamil (págs. 324-325): se dirige a aquellos a quienes llama con sus propias palabras \"la comunidad de la incredulidad\", que es la descripción del poeta y no la del museo, y les atribuye el abandono de la guía, el aferramiento al mal, el asesinato de personas, el abandono de niños huérfanos, el secuestro de mujeres, el oponerse a los versículos del Corán y el asesinato de los débiles, y describe a los musulmanes llorando de dolor y sufrimiento; luego dice que no abandonó la yihad contra ellos por ascetismo sino por falta de ayudantes, que anhelaba encontrarse con su anfitrión pero los cambios de la época se lo negaron, que llamó a la gente a su Dios y les aconsejó, dividió la riqueza de los súbditos entre ellos y hizo volver a su malhechor para que regresara en paz."
  fr: "Al-Hadi poursuit le poème kamil (pp. 324-325): il s'adresse à ceux qu'il appelle de sa propre main « la communauté des mécréants », une expression propre au poète et non au musée, et leur attribue l'abandon du droit chemin, l'attachement au mal, les meurtres, les orphelinats, la captivité des femmes, l'opposition aux versets du Coran et le meurtre des faibles. Il décrit les musulmans comme pleurant de chagrin et de souffrance. Puis il explique qu'il n'a pas abandonné le jihad contre eux par ascétisme, mais par manque de soutien; qu'il aspirait à rencontrer leurs hôtes, mais que les circonstances l'en ont empêché; qu'il a appelé les gens à Dieu, les a conseillés, a partagé leurs richesses et a ramené les malfaiteurs à la paix."
  tr: "El-Hadi, El-Kamil'in şiirine devam eder (s. 324-325): Kendi sözleriyle \"küfür ümmeti\" diye adlandırdığı kişilere seslenir; bu, şairin tanımıdır, müzenin yargısı değil. Onları hidayeti terk etmekle, adaletsizliğe sarılmakla, insanları öldürmekle, çocukları yetim bırakmakla, kadınları esir almakla, Kur'an ayetlerini ihlal etmekle ve zayıfları öldürmekle suçlar. Müslümanları keder ve zarardan ağlayanlar olarak tanımlar. Sonra, cihatlarını zühd nedeniyle değil, yardımcı eksikliği nedeniyle terk ettiğini söyler. Onlarla görüşmeyi çok istemişti, ancak zamanın zorlukları buna engel oldu. İnsanları Allah'a çağırdı, onlara nasihat etti, tebaasının mallarını aralarında paylaştırdı ve zalimlerini püskürttü, böylece Müslüman olarak geri döndü."
  id: "Al-Hadi melanjutkan puisi Al-Kamil (hlm. 324-325): Ia menyapa orang-orang yang ia sebut dengan kata-katanya sendiri sebagai “umat kafir,” yang merupakan deskripsi penyair, bukan penilaian museum. Ia menuduh mereka meninggalkan petunjuk, berpegang teguh pada ketidakadilan, membunuh orang, membuat anak-anak menjadi yatim piatu, menawan wanita, melanggar ayat-ayat Al-Qur'an, dan membunuh orang-orang lemah. Ia menggambarkan kaum Muslimin menangis karena kesedihan dan penderitaan. Kemudian ia mengatakan bahwa ia tidak meninggalkan jihad mereka karena asketisme, tetapi karena kurangnya penolong. Ia sangat ingin bertemu dengan mereka, tetapi perubahan waktu mencegahnya. Ia menyeru orang-orang kepada Tuhan mereka, menasihati mereka, membagi kekayaan rakyat di antara mereka, dan mengusir penindas mereka, sehingga ia kembali sebagai seorang Muslim."
