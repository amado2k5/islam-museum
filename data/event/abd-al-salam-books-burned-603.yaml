id: event/abd-al-salam-books-burned-603
class: event
kind: persecution
label: { ar: "إحراق كتب عبد السلام بن عبد القادر الجيلي وتفسيقه سنة 603", en: "Burning of the Books of Abd al-Salam ibn Abd al-Qadir al-Jilani and His Condemnation as a Fasiq in 603", fr: "Destruction par le feu des livres d’Abd al-Salam ibn Abd al-Qadir al-Jilani et condamnation comme fasiq en 603", es: "La quema de los libros de Abd al-Salam ibn Abd al-Qadir al-Jilani y su condena como fasiq en 603.", ur: "عبد السلام ابن عبد القادر الجیلانی کی کتابوں کو جلانا اور 603 میں ان کی فصیح کے طور پر مذمت" }
summary:
  ar: "في سنة ثلاث وستمائة قبض الخليفة على الركني عبد السلام بن الشيخ عبد القادر الجيلي وأحرقت كتبه وحكم بفسقه — وهو الذي وشى على الشيخ أبي الفرج ابن الجوزي حتى نُكب {cite:shadharat-dhahab p. 16}. وفي ترجمته سنة إحدى عشرة أن الوزير ابن يونس لبَّث دارَه فأخرج منها لُتبّاً من كتب الفلاسفة ورسائل إخوان الصفا وكتب السحر والنارنجات وعبادة النجوم، وقُرئ فيها مخاطبة زحل «أيها الكوكب المضيء المنير أنت تدبر الأفلاك وتحيي وتميت وأنت إلهنا» فقال له ابن يونس هذا خطك قال نعم، فأُضرمت نار عظيمة تحت المسجد وقام أبو بكر بن المارستانية يقرأ الكتب كتاباً كتاباً ويلعن من كتبها ومن يعتقدها وعبد السلام حاضر، فتعدى اللعن إلى الشيخ عبد القادر بل إلى الإمام أحمد، ثم حكم القاضي بتفسيقه ورمى طيلسانه وأخرجت مدرسة جده من يده ومن يد أبيه عبد الوهاب وفُوضت إلى ابن الجوزي {cite:shadharat-dhahab p. 53-54}."
  en: "In 603 the caliph arrested al-Rukn Abd al-Salam, son of Shaykh Abd al-Qadir al-Jilani; his books were burned and he was ruled a fasiq — the same man who had informed on Ibn al-Jawzi until the latter was ruined {cite:shadharat-dhahab p. 16}. His obituary under 611 gives the mechanism: the wazir Ibn Yunus sealed his house and extracted volumes of the philosophers, the Rasa'il Ikhwan al-Safa, books of sorcery, narang and star-worship; read aloud was an address to Saturn — 'O luminous planet, you direct the spheres, give life and death, you are our god' — and when Abd al-Salam owned the hand, a great fire was lit beneath the mosque, Abu Bakr Ibn al-Maristaniyya read the volumes out one by one with curses on their writer and believers, and the crowd's cursing ran on to Abd al-Qadir and even Imam Ahmad; the qadi then ruled him fasiq, cast off his taylasan, and his grandfather's madrasa was taken from his father Abd al-Wahhab and entrusted to Ibn al-Jawzi {cite:shadharat-dhahab p. 53-54}."
  fr: "En 603, le calife fit arrêter al-Rukn Abd al-Salam, fils du cheikh Abd al-Qadir al-Jilani ; ses livres furent brûlés et il fut déclaré fasiq — le même homme avait dénoncé Ibn al-Jawzi, entraînant sa disgrâce {cite:shadharat-dhahab p. 16}. Sa notice nécrologique sous l’année 611 en précise le mécanisme : le vizir Ibn Yunus mit sa maison sous scellés et en retira des volumes de philosophes, les Rasa'il Ikhwan al-Safa et des livres de sorcellerie, de narang et de culte des astres. Une adresse à Saturne fut lue à haute voix : « Ô planète lumineuse, tu diriges les sphères, donnes la vie et la mort, tu es notre dieu ». Abd al-Salam ayant reconnu son écriture, un grand feu fut allumé sous la mosquée ; Abu Bakr Ibn al-Maristaniyya lut les volumes l’un après l’autre en maudissant leur auteur et ceux qui y croyaient, et les malédictions de la foule s’étendirent à Abd al-Qadir et même à l’imam Ahmad. Le cadi le déclara alors fasiq et lui retira son taylasan ; la madrasa de son grand-père fut retirée à son père Abd al-Wahhab et confiée à Ibn al-Jawzi {cite:shadharat-dhahab p. 53-54}."
  es: "En 603, el califa arrestó a al-Rukn Abd al-Salam, hijo de Shaykh Abd al-Qadir al-Jilani; sus libros fueron quemados y fue declarado fasiq, el mismo hombre que había delatado a Ibn al-Jawzi hasta que este último fue arruinado {cite:shadharat-dhahab p. 16}. Su obituario en 611 describe el mecanismo: el visir Ibn Yunus selló su casa y extrajo volúmenes de los filósofos, el Rasa'il Ikhwan al-Safa, libros de hechicería, narang y culto a las estrellas; Se leyó en voz alta una alocución a Saturno: «Oh, planeta luminoso, tú diriges las esferas, das la vida y la muerte, tú eres nuestro dios». Cuando Abd al-Salam recibió la mano, se encendió un gran fuego bajo la mezquita. Abu Bakr Ibn al-Maristaniyya leyó los volúmenes uno por uno con maldiciones sobre su autor y los creyentes, y las maldiciones de la multitud se extendieron a Abd al-Qadir e incluso al Imam Ahmad; el cadí lo declaró fasiq, le retiró su taylasan, y la madrasa de su abuelo fue tomada de su padre Abd al-Wahhab y confiada a Ibn al-Jawzi {cite:shadharat-dhahab p. 53-54}."
  ur: "603 میں خلیفہ نے شیخ عبد القادر الجیلانی کے بیٹے الرقن عبد السلام کو گرفتار کر لیا۔ اس کی کتابوں کو جلا دیا گیا اور اسے فاسق قرار دیا گیا - وہی شخص جس نے ابن الجوزی کو اس وقت تک خبر دی تھی جب تک کہ بعد الذکر برباد نہیں ہو گیا تھا۔ 16}۔ 611 کے تحت ان کی وفات کا طریقہ کار بتاتا ہے: وزیر ابن یونس نے اپنے گھر کو سیل کیا اور فلسفیوں کی جلدیں، رسائل اخوان الصفا، جادو، نارنگ اور ستاروں کی عبادت کی کتابیں نکالیں۔ بلند آواز سے پڑھنا زحل کو ایک خطاب تھا - 'اے روشن سیارے، تو کرہوں کو ہدایت دیتا ہے، زندگی اور موت دیتا ہے، تو ہی ہمارا معبود ہے' - اور جب عبد السلام کے ہاتھ میں تھے تو مسجد کے نیچے ایک عظیم آگ جلائی گئی، ابوبکر ابن المرستانیہ نے ایک ایک کرکے جلدوں کو پڑھا اور ان کے مصنف اور مومنین پر لعنت بھیجی اور عبد القرآن پر بھی لعنت بھیجی۔ احمد; اس کے بعد قاضی نے اسے فاسق قرار دیا، اس کے طیّلسان کو ختم کر دیا، اور اس کے دادا کا مدرسہ ان کے والد عبد الوہاب سے چھین کر ابن الجوزی کے سپرد کر دیا گیا۔ 53-54}۔"
