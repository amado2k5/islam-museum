summary:
  ar: "بطاقة أولية للحرب العثمانية البندقية من ١٥٧٠ إلى ١٥٧٣م، حرب قبرص التي انتصر فيها العثمانيون على البر وتكبدوا هزيمة ليبانتو البحرية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Ottoman–Venetian War of 1570–1573, the war for Cyprus in which the Ottomans prevailed on land despite the naval defeat at Lepanto; its sources are not yet checked on the page."
  es: "Boceto de ficha para la guerra otomano-veneciana de 1570-1573, la guerra por Chipre en la que los otomanos prevalecieron en tierra a pesar de la derrota naval en Lepanto; sus fuentes aún no han sido verificadas en la página."
  fr: "Projet de fiche pour la guerre ottomane-vénitienne de 1570-1573, la guerre pour Chypre au cours de laquelle les Ottomans l'ont emporté sur terre malgré la défaite navale de Lépante; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1570-1573 کی عثمانی-وینیشین جنگ کے لیے ڈرافٹ کارڈ، قبرص کے لیے جنگ جس میں لیپینٹو میں بحری شکست کے باوجود عثمانیوں نے زمین پر فتح حاصل کی۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1570-1573 Osmanlı-Venedik Savaşı'na (Kıbrıs Savaşı) dair ön bir anlatım; bu savaşta Osmanlılar karada zafer kazanmış, ancak Lepanto'da deniz savaşında yenilgiye uğramıştır. Sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Perang Ottoman-Venesia tahun 1570-1573, Perang Siprus di mana Ottoman meraih kemenangan di darat dan menderita kekalahan angkatan laut di Lepanto; sumber-sumber yang tercantum di halaman ini belum ditinjau."
