id: event/ibn-al-salah-khurasan-605
class: event
kind: other
label:
  ar: "ابن الصلاح يحصّل علم الحديث بخراسان: نيسابور ومرو، نحو ٦٠٥هـ"
  en: "Ibn al-Salah gathers the science of hadith in Khurasan: Nishapur and Marw, c. 605"
  ur: "ابن الصلاح خراسان میں علمِ حدیث حاصل کرتے ہیں: نیشاپور اور مرو، تقریباً 605ھ"
summary:
  ar: "سافر ابن الصلاح إلى خراسان وأقام بها زماناً وحصل علم الحديث هناك؛ فسمع بنيسابور من منصور الفراوي والمؤيد الطوسي والقاسم بن الصفار وزينب الشعرية وغيرهم، وبمرو من أبي المظفر عبد الرحيم بن السمعاني ومحمد بن إسماعيل المؤسَوي وأبي جعفر السنجي وجماعة {cite:shadharat-dhahab p. 229} {cite:tarikh-islam-dhahabi p. 185-186} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  en: "Ibn al-Salah travelled to Khurasan, stayed a while and acquired the science of hadith there: at Nishapur he heard from Mansur al-Furawi, al-Mu'ayyad al-Tusi, al-Qasim b. al-Saffar and Zaynab al-Shi'riyya among others, and at Marw from Abu al-Muzaffar 'Abd al-Rahim b. al-Sam'ani, Muhammad b. Isma'il al-Mu'sawi and Abu Ja'far al-Sanji among others {cite:shadharat-dhahab p. 229} {cite:tarikh-islam-dhahabi p. 185-186} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  ur: "ابن الصلاح خراسان گئے، وہاں کچھ عرصہ رہے اور علمِ حدیث حاصل کیا: نیشاپور میں منصور فراوی، مؤید طوسی، قاسم بن صفار اور زینب شعریہ سمیت دیگر سے، اور مرو میں ابو المظفر عبد الرحیم بن سمعانی، محمد بن اسماعیل مؤسوی اور ابو جعفر سنجی سمیت دیگر سے سماعت کی {cite:shadharat-dhahab p. 229} {cite:tarikh-islam-dhahabi p. 185-186} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}۔"
