class: event
kind: other
label:
  ar: "ابن الصلاح يحصّل علم الحديث بخراسان: نيسابور ومرو، نحو ٦٠٥هـ"
  en: "Ibn al-Salah gathers the science of hadith in Khurasan: Nishapur and Marw, c. 605"
  ur: "ابن الصلاح خراسان میں علمِ حدیث حاصل کرتے ہیں: نیشاپور اور مرو، تقریباً 605ھ"
  es: "Ibn al-Salah recopila la ciencia del hadiz en Jorasán: Nishapur y Marw, c. 605."
  fr: "Ibn al-Salah rassemble la science du hadith au Khorasan: Nishapur et Marw, vers 605."
  tr: "İbn al-Salah, hadis ilmini Hicri 605 civarında Horasan'da, Nişapur ve Merv'de edinmiştir."
  id: "Ibn al-Salah memperoleh pengetahuan tentang Hadits di Khorasan: Nishapur dan Merv, sekitar tahun 605 Hijriah."
summary:
  ar: "سافر ابن الصلاح إلى خراسان وأقام بها زماناً وحصل علم الحديث هناك؛ فسمع بنيسابور من منصور الفراوي والمؤيد الطوسي والقاسم بن الصفار وزينب الشعرية وغيرهم، وبمرو من أبي المظفر عبد الرحيم بن السمعاني ومحمد بن إسماعيل المؤسَوي وأبي جعفر السنجي وجماعة {cite:shadharat-dhahab p. 229} {cite:tarikh-islam-dhahabi p. 185-186} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  en: "Ibn al-Salah travelled to Khurasan, stayed a while and acquired the science of hadith there: at Nishapur he heard from Mansur al-Furawi, al-Mu'ayyad al-Tusi, al-Qasim b. al-Saffar and Zaynab al-Shi'riyya among others, and at Marw from Abu al-Muzaffar 'Abd al-Rahim b. al-Sam'ani, Muhammad b. Isma'il al-Mu'sawi and Abu Ja'far al-Sanji among others {cite:shadharat-dhahab p. 229} {cite:tarikh-islam-dhahabi p. 185-186} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  ur: "ابن الصلاح خراسان گئے، وہاں کچھ عرصہ رہے اور علمِ حدیث حاصل کیا: نیشاپور میں منصور فراوی، مؤید طوسی، قاسم بن صفار اور زینب شعریہ سمیت دیگر سے، اور مرو میں ابو المظفر عبد الرحیم بن سمعانی، محمد بن اسماعیل مؤسوی اور ابو جعفر سنجی سمیت دیگر سے سماعت کی {cite:shadharat-dhahab p. 229} {cite:tarikh-islam-dhahabi p. 185-186} {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}۔"
  es: "Ibn al-Salah viajó a Khurasan, permaneció un tiempo y adquirió allí la ciencia del hadiz: en Nishapur escuchó de Mansur al-Furawi, al-Mu'ayyad al-Tusi, al-Qasim b. al-Saffar y Zaynab al-Shi'riyya entre otros, y en Marw de Abu al-Muzaffar 'Abd al-Rahim b. al-Sam'ani, Muhammad b. Isma'il al-Mu'sawi y Abu Ja'far al-Sanji, entre otros {citar: shadharat-dhahab p. 229} {citar:tarikh-islam-dhahabi p. 185-186} {cita: enciclopedia-del-islam-2 vol. 3 p. 959}."
  fr: "Ibn al-Salah voyagea au Khurasan, y séjourna quelque temps et y acquit la science du hadith: à Nishapur il entendit Mansur al-Furawi, al-Mu'ayyad al-Tusi, al-Qasim b. al-Saffar et Zaynab al-Shi'riyya entre autres, et à Marw d'Abu al-Muzaffar 'Abd al-Rahim b. al-Sam'ani, Muhammad b. Isma'il al-Mu'sawi et Abu Ja'far al-Sanji, entre autres {cite: shadharat-dhahab p. 229} {cite:tarikh-islam-dhahabi p. 185-186} {cite:encyclopédie-de-l'islam-2 vol. 15h. 959}."
  tr: "İbnü's-Salah, Horasan'a giderek orada bir süre kaldı ve orada hadis ilimleri edindi. Nişabur'da Mansur el-Faravi, el-Mu'ayyad el-Tusi, el-Kasım ibn el-Saffar, Zeyneb el-Şa'riyye ve diğerlerinden ve Merv'de Ebu el-Muzaffar Abdurrahim ibn el-Sem'ani, Muhammed ibn İsmail el-Musavi, Ebu Cafer el-Sinji ve diğerlerinden haber aldı. {alıntı: shadharat-dhahab s. 229} {cite:tarikh-islam-dhahabi s. 185-186} {cite:ansiklopedi-of-islam-2 cilt. 3 s. 959}."
  id: "Ibn al-Salah melakukan perjalanan ke Khorasan dan tinggal di sana beberapa saat, memperoleh ilmu hadis di sana. Dia mendengar di Nishapur dari Mansur al-Farawi, al-Mu'ayyad al-Tusi, al-Qasim ibn al-Saffar, Zaynab al-Sha'riyya, dan lain-lain, dan di Merv dari Abu al-Muzaffar Abd al-Rahim ibn al-Sam'ani, Muhammad ibn Isma'il al-Musawi, Abu Ja'far al-Sinji, dan sekelompok lainnya. {mengutip:shadharat-dhahab hal. 229} {kutip:tarikh-islam-dhahabi hal. 185-186} {kutip:ensiklopedia-Islam-2 vol. 3 hal. 959}."
