label:
  ar: دخول الهادي إلى الحق صنعاء سنة 288هـ
  en: Al-Hadi's entry into Sana'a, 288 AH
  ur: ہادی الی الحق کا صنعاء میں داخلہ، 288ھ
summary:
  ar: دخل الهادي صنعاء ليلة الجمعة لإحدى وعشرين ليلة خلت من المحرم سنة 288هـ، فخطب له بالإمامة على المنابر، وكتب اسمه على النقد والطراز، وولى المخاليف والجباية والقضاء.
  en: Al-Hadi entered Sana'a on the night of Friday, 21 Muharram 288 AH; the address from the pulpits was given in his name as imam, his name was put on coinage and tiraz, and he appointed governors of the districts, tax collection and a judge.
  ur: ہادی 288ھ میں جمعہ کی رات، 21 محرم کو صنعاء میں داخل ہوئے؛ منبروں پر ان کے نام کا امامت کا خطبہ پڑھا گیا، سکے اور طراز پر ان کا نام لکھا گیا، اور انہوں نے مخالیف، وصولی اور قضا کے لیے تقرریاں کیں۔
