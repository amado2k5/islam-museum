label: { ar: "أخذ الكرج من ابن أبي دلف", en: "Capture of Karaj from Ibn Abi Dulaf", fr: "La prise d'al-Karaj à Ibn Abi Dulaf", es: "Captura de Karaj de manos de Ibn Abi Dulaf", ur: "ابن ابی دلف سے کرج کا قبضہ", tr: "Karac, İbn Ebi Dulaf'tan alınmıştır.", id: "Karaj mengambil dari Ibnu Abi Dulaf" }
summary:
  ar: "في سنة ثلاث وخمسين ومائتين، بعد الوقعة خارج همذان، عبّأ مفلح خيله نحو الكرج وجعل لهم كمينين {cite:tabari-tarikh-abu-al-fadl j.9 p.373}."
  en: "In the year 253, after the battle outside Hamadhan, Muflih drew up his horsemen toward Karaj and set two ambushes for them {cite:tabari-tarikh-abu-al-fadl j.9 p.373}."
  fr: "En l'an 253, après la bataille livrée devant Hamadhan, Muflih disposa ses cavaliers en direction d'al-Karaj et leur tendit deux embuscades {cite:tabari-tarikh-abu-al-fadl j.9 p.373}."
  es: "En el año 253, después de la batalla en las afueras de Hamadhan, Muflih reunió a sus jinetes hacia Karaj y les tendió dos emboscadas {cite:tabari-tarikh-abu-al-fadl j.9 p.373}."
  ur: "253 میں، حماد سے باہر لڑائی کے بعد، مفلح نے اپنے گھڑ سواروں کو کرج کی طرف متوجہ کیا اور ان کے لیے دو گھات لگائے۔"
  tr: "253 yılında, Hamadan dışındaki savaştan sonra Muflih, süvarilerini Karaj'a doğru sevk etti ve onlar için iki pusu kurdu. {cite:tabari-tarikh-abu-al-fadl j.9 p.373}"
  id: "Pada tahun dua ratus lima puluh tiga, setelah pertempuran di luar Hamadan, Muflih mengerahkan pasukannya menuju Karaj dan memasang dua jebakan untuk mereka {cite:tabari-tarikh-abu-al-fadl j.9 p.373}."
