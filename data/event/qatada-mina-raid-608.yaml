label: { ar: "وثبة قتادة على ركب العراق بمنى سنة 608هـ", en: "Qatada's assault on the Iraqi pilgrim caravan at Mina, 608", es: "El asalto de Qatada a la caravana de peregrinos iraquíes en Mina, 608.", fr: "L'attaque de Qatada contre la caravane de pèlerins irakiens à Mina, 608", ur: "منیٰ میں عراقی زائرین کے قافلے پر قتادہ کا حملہ، 608", tr: "Hicri 608 yılında Katade'nin Mina'da Irak kervanına yaptığı atılım.", id: "Lompatan Qatadah terhadap kafilah Irak di Mina pada tahun 608 Hijriah" }
summary:
  ar: "وفيها وثب قتادة الحسيني أمير مكة على الركب العراقي بمنى فهرب الناس وقتل جماعة فقيل راح للناس ما قيمته مئة ألف دينار ولم ينتقع فيها عنزان {cite:shadharat-dhahab p. 40}. ويذكر ابن الأثير سببها: وثب باطني على بعض أهل قتادة فقتله بمنى ظناً أنه قتادة، فجمع قتادة الأشراف والعرب والعبيد وأهل مكة ونزلوا على الحاج من الجبل يرمونهم بالحجارة والنبل، وكان أمير الحاج ولد الأمير ياقوت صبياً فخاف وتحير وتمكن أمير مكة من نهب من كان في الأطراف، فبات الحاج بأسوأ حال من شدة الخوف، ثم رحلوا فطمع فيهم العدو فلحق من سلم بحجاج الشام ومنعوا من دخول مكة ثم أذن لهم فتمموا حجتهم، وأرسل قتادة ولده وجماعة من أصحابه إلى بغداد فدخلوها والسيوف مسلولة والأكفان معهم فقبلوا العتبة واعتذروا عما جرى على الحجاج {cite:kamil-ibn-al-athir p. 356-357}."
  en: "In 608 Qatada the Husayni, amir of Mecca, fell upon the Iraqi pilgrimage caravan at Mina — 'and not a spear was dipped in it' {cite:shadharat-dhahab p. 40}. Ibn al-Athir gives the mechanism: a Batini killed one of Qatada's men at Mina mistaking him for the amir, whereupon Qatada mustered the ashraf, Arabs, slaves and Meccans, descended on the pilgrims from the mountain with stones and arrows — the boy pilgrim-amir panicking — and plundered the margins of the camp. The survivors joined the Syrian convoy and completed their hajj; Qatada sent his son to Baghdad with drawn swords and shrouds to kiss the threshold in apology {cite:kamil-ibn-al-athir p. 356-357}."
  es: "En 608, Qatada el Husayni, emir de La Meca, atacó la caravana de peregrinos iraquíes en Mina, «y ni una sola lanza fue mojada en ella» {cita: shadharat-dhahab p. 40}. Ibn al-Athir explica el mecanismo: un Batini mató a uno de los hombres de Qatada en Mina confundiéndolo con el emir, tras lo cual Qatada reunió a los ashraf, árabes, esclavos y mecanos, descendió de la montaña contra los peregrinos con piedras y flechas —el joven peregrino-emir entró en pánico— y saqueó los alrededores del campamento. Los supervivientes se unieron al convoy sirio y completaron su hajj; Qatada envió a su hijo a Bagdad con espadas desenvainadas y sudarios para besar el umbral en señal de disculpa {cita: kamil-ibn-al-athir pp. 356-357}."
  fr: "En 608, Qatada Husayni, émir de La Mecque, attaqua la caravane de pèlerins irakiens à Mina – « et pas une lance n'y fut trempée » (cf. shadharat-dhahab, p. 40). Ibn al-Athir relate les faits: un Batini tua un homme de Qatada à Mina, le prenant pour l'émir. Qatada rassembla alors les ashraf (Arabes, esclaves et Mecquois), descendit de la montagne sur les pèlerins, armé de pierres et de flèches – le jeune pèlerin-émir paniqué – et pilla les abords du camp. Les survivants rejoignirent le convoi syrien et achevèrent leur hajj. Qatada envoya son fils à Bagdad, l'épée à la main et enveloppé dans un linceul, pour embrasser le seuil en signe d'excuses (cf. kamil-ibn-al-athir, p. 356-357)."
  ur: "608 میں مکہ کا امیر قتادہ حسینی منیٰ میں عراقی قافلے پر چڑھا اور اس میں کوئی نیزہ نہیں ڈبویا گیا۔ 40}۔ ابن اثیر نے طریقہ کار دیا ہے: ایک بطینی نے منیٰ میں قتادہ کے ایک آدمی کو امیر سمجھ کر قتل کر دیا، اس کے بعد قتادہ نے اشرف، عرب، غلام اور مکہ والوں کو اکٹھا کیا، پتھروں اور تیروں کے ساتھ پہاڑ سے حجاج پر اترا، لڑکا حجاج اور عمیر کے کیمپ میں داخل ہوا۔ بچ جانے والے شامی قافلے میں شامل ہوئے اور اپنا حج مکمل کیا۔ قتادہ نے اپنے بیٹے کو تلواروں اور کفنوں کے ساتھ بغداد بھیجا تاکہ معافی کی چوکھٹ کو چومے۔ 356-357}۔"
  tr: "Olayda, Mekke Emiri Katada el-Hüseyni, Mina'da Irak kervanına saldırdı ve halk kaçtı, bir grup öldürüldü. Halkın yüz bin dinar değerinde bir şey kaybettiği ve iki keçinin bile kurtarılamadığı söylenir. {kaynak: Şadharat-Dhaba s. 40}. İbn el-Athir bunun sebebini şöyle anlatır: En Batini, Katada'nın adamlarından bazılarına saldırdı ve onu Mina'da Katada zannederek öldürdü. Bunun üzerine Katada, soyluları, Arapları, köleleri ve Mekke halkını topladı ve dağdan hacıların üzerine inerek onlara taş ve ok attılar. Hac kafilesinin lideri, çocuk yaşta olan Prens Yakut'un oğluydu, bu yüzden korkmuş ve şaşkındı. Mekke Emiri, çevredekileri yağmalayabildi, bu yüzden hacılar korkunun yoğunluğu nedeniyle geceyi en kötü koşullarda geçirdiler. Sonra onlar ayrıldılar ve düşman onları ele geçirmek istedi; kurtulanlar Suriyeli hacılara katıldılar ve Mekke'ye girmeleri engellendi. Sonra onlara izin verildi ve hac yolculuklarını tamamladılar. Katada, oğlunu ve arkadaşlarından bir grubu Bağdat'a gönderdi ve onlar kılıçlarını çekmiş, kefenlerini üzerlerinde taşıyarak şehre girdiler. Eşiği öptüler ve hacılara olanlar için özür dilediler. {Kaynak: Kamil İbn el-Atir s. 356-357}"
  id: "Dan di dalamnya, Qatada al-Husseini, Emir Mekah, menyerang kafilah Irak di Mina, sehingga orang-orang melarikan diri dan sebagian dari mereka terbunuh. Dikatakan bahwa orang-orang kehilangan sesuatu senilai seratus ribu dinar, dan tidak dua ekor kambing pun selamat dalam peristiwa itu. {kutip:shadharat-dhahab hlm. 40}. Ibn al-Athir menyebutkan alasannya: An Batini menyerang beberapa orang dari pihak Qatada dan membunuhnya di Mina, karena mengira dia adalah Qatada. Maka Qatada mengumpulkan para bangsawan, orang Arab, budak, dan penduduk Mekah, dan mereka menyerang para peziarah dari gunung, melempari mereka dengan batu dan panah. Pemimpin haji adalah putra Pangeran Yaqut, yang masih kecil, sehingga ia ketakutan dan bingung. Emir Mekah mampu menjarah orang-orang yang berada di pinggiran, sehingga para peziarah menghabiskan malam dalam kondisi terburuk karena ketakutan yang luar biasa. Kemudian mereka pergi, dan musuh menginginkan mereka, sehingga orang-orang yang selamat bergabung dengan para peziarah Suriah dan dicegah memasuki Mekah. Kemudian izin diberikan kepada mereka, sehingga mereka menyelesaikan ibadah haji mereka. Qatada mengirim putranya dan sekelompok sahabatnya ke Baghdad, dan mereka memasukinya dengan pedang terhunus dan kain kafan. Mereka mencium ambang pintu dan meminta maaf atas apa yang terjadi pada para peziarah. {cite:kamil-ibn-al-athir p. 356-357}."
