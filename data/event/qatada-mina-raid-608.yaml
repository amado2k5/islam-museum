label: { ar: "وثبة قتادة على ركب العراق بمنى سنة 608هـ" }
summary:
  ar: "وفيها وثب قتادة الحسيني أمير مكة على الركب العراقي بمنى فهرب الناس وقتل جماعة فقيل راح للناس ما قيمته مئة ألف دينار ولم ينتقع فيها عنزان {cite:shadharat-dhahab p. 40}. ويذكر ابن الأثير سببها: وثب باطني على بعض أهل قتادة فقتله بمنى ظناً أنه قتادة، فجمع قتادة الأشراف والعرب والعبيد وأهل مكة ونزلوا على الحاج من الجبل يرمونهم بالحجارة والنبل، وكان أمير الحاج ولد الأمير ياقوت صبياً فخاف وتحير وتمكن أمير مكة من نهب من كان في الأطراف، فبات الحاج بأسوأ حال من شدة الخوف، ثم رحلوا فطمع فيهم العدو فلحق من سلم بحجاج الشام ومنعوا من دخول مكة ثم أذن لهم فتمموا حجتهم، وأرسل قتادة ولده وجماعة من أصحابه إلى بغداد فدخلوها والسيوف مسلولة والأكفان معهم فقبلوا العتبة واعتذروا عما جرى على الحجاج {cite:kamil-ibn-al-athir p. 356-357}."
  en: "In 608 Qatada the Husayni, amir of Mecca, fell upon the Iraqi pilgrimage caravan at Mina — 'and not a spear was dipped in it' {cite:shadharat-dhahab p. 40}. Ibn al-Athir gives the mechanism: a Batini killed one of Qatada's men at Mina mistaking him for the amir, whereupon Qatada mustered the ashraf, Arabs, slaves and Meccans, descended on the pilgrims from the mountain with stones and arrows — the boy pilgrim-amir panicking — and plundered the margins of the camp. The survivors joined the Syrian convoy and completed their hajj; Qatada sent his son to Baghdad with drawn swords and shrouds to kiss the threshold in apology {cite:kamil-ibn-al-athir p. 356-357}."
