label: { ar: "وفاة الواثق", en: "Death of al-Wathiq", es: "Muerte de al-Wathiq", fr: "Mort d'al-Wathiq", ur: "الوثیق کی موت", tr: "El-Vathiq'in Ölümü", id: "Kematian Al-Wathiq" }
summary:
  ar: "مات الواثق بسر من رأى يوم الأربعاء لست بقين من ذي الحجة سنة اثنتين وثلاثين ومئتين، وحكي أنه لما مات ترك وحده واشتغل الناس بالبيعة للمتوكل فجاء جرذون فاستل عينه فأكلها {cite:tarikh-khulafa-minhaj-1434 p. 534}."
  en: "Al-Wathiq died at Sur man Ra'a on Wednesday, 6 Dhu'l-Hijja 232; when he died he was left alone while the people busied themselves with the bay'a to al-Mutawakkil, and a rat came and plucked out his eye and ate it {cite:tarikh-khulafa-minhaj-1434 p. 534}."
  es: "Al-Wathiq murió en Sur man Ra'a el miércoles 6 de Dhu'l-Hijja 232; cuando murió, lo dejaron solo mientras la gente se ocupaba de la bay'a a al-Mutawakkil, y una rata vino y le arrancó un ojo y se lo comió {cite:tarikh-khulafa-minhaj-1434 p. 534}."
  fr: "Al-Wathiq mourut à Sur man Ra'a le mercredi 6 Dhu'l-Hijja 232; lorsqu'il mourut, il fut laissé seul tandis que les gens s'occupaient de la bay'a à al-Mutawakkil, et un rat vint lui arracher l'œil et le mangea {cite:tarikh-khulafa-minhaj-1434 p. 534}."
  ur: "الوثیق کا انتقال بدھ 6 ذی الحجہ 232 کو سور من راع میں ہوا۔ جب آپ کی وفات ہوئی تو آپ اکیلے رہ گئے جب کہ لوگ بیعت متوکل میں مصروف تھے کہ ایک چوہا آیا اور اس کی آنکھ نکال کر کھا گئی۔ 534}۔"
  tr: "El-Vathiq, 232 yılının Zilhicce ayının altıncı günü Çarşamba günü Samarra'da vefat etti. Rivayet edildiğine göre, öldüğünde yalnız bırakılmıştı ve halk El-Mutavakkil'e biat etmekle meşguldü. Bunun üzerine bir fare gelip gözünü oydu ve yedi. {cite:tarikh-khulafa-minhaj-1434 s. 534}"
  id: "Al-Wathiq wafat di Samarra pada hari Rabu, tanggal enam Dzul Hijjah tahun dua ratus tiga puluh dua. Diriwayatkan bahwa ketika beliau wafat, beliau ditinggalkan sendirian dan orang-orang sibuk berbaiat kepada Al-Mutawakkil, lalu seekor tikus datang dan mencabut matanya lalu memakannya. {cite:tarikh-khulafa-minhaj-1434 p. 534}."
