label: { ar: "وفاة سليمان بن عبد الملك", en: "Death of Sulayman ibn Abd al-Malik" }
summary:
  ar: "ذكر الطبري في سنة تسع وتسعين وفاة سليمان بن عبد الملك بدابق يوم الجمعة لعشر ليال مضين من صفر {cite:tabari-tarikh-abu-al-fadl j.6 p.546}، وذكر بعض سيره {cite:tabari-tarikh-abu-al-fadl j.6 p.547}، وعند السيوطي مات غازياً بدابق ونظر في المرآة فأعجبه شبابه وجماله وقال كان محمد نبياً وأبو بكر صديقاً وعمر فاروقاً وعثمان حيياً ومعاوية حليماً ويزيد صبوراً وعبد الملك سائساً والوليد جباراً وأنا الملك الشاب فما دار عليه الشهر حتى مات، وقال ابن سيرين يرحم الله سليمان افتتح خلافته بإحيائه الصلاة لمواقيتها واختتمها باستخلافه عمر بن عبد العزيز {cite:tarikh-khulafa-minhaj-1434 p. 370-371} ويذكر الكتاب أن سليمان في مرض موته بدابق سأل رجاء بن حيوة عمّن يستخلف، فاقترح عمر بن عبد العزيز، وكُتب العهد لعمر ثم ليزيد بن عبد الملك من بعده، وأخذت البيعة من الناس على ما في الكتاب، فلما قُرئ الكتاب بعد الوفاة تغيّرت وجوه بني عبد الملك. وتوفي يوم الجمعة لعشر بقين من صفر سنة 99هـ، وصلى عليه عمر بن عبد العزيز. {cite:salabi-umayyad-state-2020 p.155-157} ويذكر الكتاب أن سليمان عرض عهده لعمر ثم ليزيد بن عبد الملك بعد أن رفض أن يعهد لابنه أيوب، وأن رجاء بن حيوة أخذ البيعة للكتاب بعد الوفاة، وأن هشاماً امتنع عن بيعة عمر. {cite:salabi-umayyad-state-2020 p.184-187}"
  en: "Al-Tabari records that Sulayman ibn Abd al-Malik died in the year 99 at Dabiq on a Friday, ten nights into Safar {cite:tabari-tarikh-abu-al-fadl j.6 p.546}, and he mentions some of his conduct {cite:tabari-tarikh-abu-al-fadl j.6 p.547}. In al-Suyuti he died on campaign at Dabiq. He looked into a mirror, was pleased with his youth and beauty, and said: 'Muhammad was a prophet, Abu Bakr was al-Siddiq, Umar was al-Faruq, Uthman was modest, Mu'awiya was forbearing, Yazid was patient, Abd al-Malik was an administrator, al-Walid was a tyrant, and I am the young king'; before the month was out he had died. Ibn Sirin said that Sulayman opened his caliphate by reviving the prayer at its appointed times and closed it by appointing Umar ibn Abd al-Aziz {cite:tarikh-khulafa-minhaj-1434 p. 370-371}. The book relates that when Sulayman was dying at Dabiq he asked Raja ibn Haywa whom he should name, and Raja proposed Umar ibn Abd al-Aziz; the document was written naming Umar and then Yazid ibn Abd al-Malik after him, and the oath was taken from the people according to what the document said. When the document was read after his death, the faces of the sons of Abd al-Malik changed. He died on a Friday, ten days before the end of Safar, in the year 99 AH, and Umar ibn Abd al-Aziz led the funeral prayer over him {cite:salabi-umayyad-state-2020 p.155-157}. The book also relates that Sulayman had offered the succession to Umar and then to Yazid ibn Abd al-Malik after refusing to name his son Ayyub; that Raja ibn Haywa took the oath for the document after his death; and that Hisham refused to swear allegiance to Umar {cite:salabi-umayyad-state-2020 p.184-187}."
