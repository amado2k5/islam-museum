label: { ar: "وفاة سليمان بن عبد الملك وعند السيوطي مات غازياً بدابق ونظر في المرآة فأعجبه شبابه وجماله وقال كان محمد نبياً وأبو بكر صديقاً وعمر فاروقاً وعثمان حيياً ومعاوية حليماً ويزيد صبوراً وعبد الملك سائساً والوليد جباراً وأنا الملك الشاب فما دار عليه الشهر حتى مات، وقال ابن سيرين يرحم الله سليمان افتتح خلافته بإحيائه الصلاة لمواقيتها واختتمها باستخلافه عمر بن عبد العزيز {cite:tarikh-khulafa-minhaj-1434 p. 370-371}" }
summary:
