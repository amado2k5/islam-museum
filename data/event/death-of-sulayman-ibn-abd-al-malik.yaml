label: { ar: "وفاة سليمان بن عبد الملك", en: "Death of Sulayman ibn Abd al-Malik", es: "Muerte de Sulayman ibn Abd al-Malik", fr: "Mort de Sulayman ibn Abd al-Malik", ur: "سلیمان بن عبد الملک کی وفات", tr: "Süleyman ibn Abdülmalik'in Ölümü", id: "Kematian Sulayman ibn Abd al-Malik" }
summary:
  ar: "ذكر الطبري في سنة تسع وتسعين وفاة سليمان بن عبد الملك بدابق يوم الجمعة لعشر ليال مضين من صفر {cite:tabari-tarikh-abu-al-fadl j.6 p.546}، وذكر بعض سيره {cite:tabari-tarikh-abu-al-fadl j.6 p.547}، وعند السيوطي مات غازياً بدابق ونظر في المرآة فأعجبه شبابه وجماله وقال كان محمد نبياً وأبو بكر صديقاً وعمر فاروقاً وعثمان حيياً ومعاوية حليماً ويزيد صبوراً وعبد الملك سائساً والوليد جباراً وأنا الملك الشاب فما دار عليه الشهر حتى مات، وقال ابن سيرين يرحم الله سليمان افتتح خلافته بإحيائه الصلاة لمواقيتها واختتمها باستخلافه عمر بن عبد العزيز {cite:tarikh-khulafa-minhaj-1434 p. 370-371} ويذكر الكتاب أن سليمان في مرض موته بدابق سأل رجاء بن حيوة عمّن يستخلف، فاقترح عمر بن عبد العزيز، وكُتب العهد لعمر ثم ليزيد بن عبد الملك من بعده، وأخذت البيعة من الناس على ما في الكتاب، فلما قُرئ الكتاب بعد الوفاة تغيّرت وجوه بني عبد الملك. وتوفي يوم الجمعة لعشر بقين من صفر سنة 99هـ، وصلى عليه عمر بن عبد العزيز. {cite:salabi-umayyad-state-2020 p.155-157} ويذكر الكتاب أن سليمان عرض عهده لعمر ثم ليزيد بن عبد الملك بعد أن رفض أن يعهد لابنه أيوب، وأن رجاء بن حيوة أخذ البيعة للكتاب بعد الوفاة، وأن هشاماً امتنع عن بيعة عمر. {cite:salabi-umayyad-state-2020 p.184-187}"
  en: "Al-Tabari records that Sulayman ibn Abd al-Malik died in the year 99 at Dabiq on a Friday, ten nights into Safar {cite:tabari-tarikh-abu-al-fadl j.6 p.546}, and he mentions some of his conduct {cite:tabari-tarikh-abu-al-fadl j.6 p.547}. In al-Suyuti he died on campaign at Dabiq. He looked into a mirror, was pleased with his youth and beauty, and said: 'Muhammad was a prophet, Abu Bakr was al-Siddiq, Umar was al-Faruq, Uthman was modest, Mu'awiya was forbearing, Yazid was patient, Abd al-Malik was an administrator, al-Walid was a tyrant, and I am the young king'; before the month was out he had died. Ibn Sirin said that Sulayman opened his caliphate by reviving the prayer at its appointed times and closed it by appointing Umar ibn Abd al-Aziz {cite:tarikh-khulafa-minhaj-1434 p. 370-371}. The book relates that when Sulayman was dying at Dabiq he asked Raja ibn Haywa whom he should name, and Raja proposed Umar ibn Abd al-Aziz; the document was written naming Umar and then Yazid ibn Abd al-Malik after him, and the oath was taken from the people according to what the document said. When the document was read after his death, the faces of the sons of Abd al-Malik changed. He died on a Friday, ten days before the end of Safar, in the year 99 AH, and Umar ibn Abd al-Aziz led the funeral prayer over him {cite:salabi-umayyad-state-2020 p.155-157}. The book also relates that Sulayman had offered the succession to Umar and then to Yazid ibn Abd al-Malik after refusing to name his son Ayyub; that Raja ibn Haywa took the oath for the document after his death; and that Hisham refused to swear allegiance to Umar {cite:salabi-umayyad-state-2020 p.184-187}."
  es: "Al-Tabari registra que Sulayman ibn Abd al-Malik murió en el año 99 en Dabiq un viernes, diez noches después del inicio de Safar {cite:tabari-tarikh-abu-al-fadl j.6 p.546}, y menciona parte de su conducta {cite:tabari-tarikh-abu-al-fadl j.6 p.547}. En al-Suyuti murió en campaña en Dabiq. Se miró en un espejo, se complació con su juventud y belleza, y dijo: 'Muhammad fue un profeta, Abu Bakr fue al-Siddiq, Umar fue al-Faruq, Uthman fue modesto, Mu'awiya fue tolerante, Yazid fue paciente, Abd al-Malik fue un administrador, al-Walid fue un tirano, y yo soy el joven rey'; antes de que terminara el mes había muerto. Ibn Sirin dijo que Sulayman abrió su califato reviviendo la oración en sus horas señaladas y lo cerró nombrando a Umar ibn Abd al-Aziz {cite:tarikh-khulafa-minhaj-1434 p. 370-371}. El libro relata que cuando Sulayman estaba muriendo en Dabiq, le preguntó a Raja ibn Haywa a quién debía nombrar, y Raja propuso a Umar ibn Abd al-Aziz; se redactó un documento nombrando a Umar y luego a Yazid ibn Abd al-Malik después de él, y se tomó juramento a la gente según lo que decía el documento. Cuando se leyó el documento después de su muerte, los rostros de los hijos de Abd al-Malik cambiaron. Murió un viernes, diez días antes del final de Safar, en el año 99 AH, y Umar ibn Abd al-Aziz dirigió la oración fúnebre por él {cite:salabi-umayyad-state-2020 p.155-157}. El libro también relata que Sulayman había ofrecido la sucesión a Umar y luego a Yazid ibn Abd al-Malik después de negarse a nombrar a su hijo Ayyub; que Raja ibn Haywa prestó juramento para el documento después de su muerte; y que Hisham se negó a jurar lealtad a Umar {cite:salabi-umayyad-state-2020 p.184-187}."
  fr: "Al-Tabari rapporte que Sulayman ibn Abd al-Malik mourut en l'an 99 à Dabiq, un vendredi, dix nuits après le début du mois de Safar (voir Tabari Tarikh Abu al-Fadl, vol. 6, p. 546), et évoque certains aspects de sa vie (voir Tabari Tarikh Abu al-Fadl, vol. 6, p. 547). Selon al-Suyuti, il mourut en campagne à Dabiq. Se regardant dans un miroir, satisfait de sa jeunesse et de sa beauté, il déclara: « Muhammad était un prophète, Abou Bakr était al-Siddiq, Omar était al-Faruq, Othman était modeste, Mu'awiya était indulgent, Yazid était patient, Abd al-Malik était un administrateur, al-Walid était un tyran, et moi, je suis le jeune roi. » Il mourut avant la fin du mois. Ibn Sirin rapporte que Sulayman inaugura son califat en rétablissant la prière aux heures prescrites et le clôtura en nommant Umar ibn Abd al-Aziz (voir: Tarikh Khulafa Minhaj, vol. 1434, p. 370-371). L’ouvrage relate que, sur son lit de mort à Dabiq, Sulayman demanda à Raja ibn Haywa qui nommer, et Raja proposa Umar ibn Abd al-Aziz. Un acte fut rédigé, nommant Umar, puis Yazid ibn Abd al-Malik après lui, et le peuple prêta serment conformément à cet acte. À la lecture de cet acte après sa mort, les fils d’Abd al-Malik virent leurs visages transformés. Il mourut un vendredi, dix jours avant la fin du mois de Safar, en l'an 99 de l'Hégire, et Umar ibn Abd al-Aziz dirigea la prière funéraire (voir: salabi-umayyad-state-2020, p. 155-157). L'ouvrage rapporte également que Sulayman avait proposé la succession à Umar, puis à Yazid ibn Abd al-Malik après avoir refusé de nommer son fils Ayyub; que Raja ibn Haywa prêta serment pour le document après sa mort; et que Hisham refusa de prêter allégeance à Umar (voir: salabi-umayyad-state-2020, p. 184-187)."
  ur: "الطبری نے درج کیا ہے کہ سلیمان بن عبد الملک کی وفات سنہ 99 میں دبیق میں جمعہ کے دن صفر کی دس راتیں ہوئی {حوالہ: طبری تاریخ ابو الفضل ج6 ص 546}، اور اس نے ان کے بعض طرز عمل کا ذکر کیا ہے۔ السیوطی میں ان کا انتقال دبیق میں مہم کے دوران ہوا۔ اس نے شیشے میں دیکھا، اپنی جوانی اور حسن و جمال پر خوش ہوا، اور کہا: محمد نبی تھے، ابوبکر صدیق تھے، عمر فاروق تھے، عثمان حلیم تھے، معاویہ بردبار تھے، یزید صابر تھا، عبد الملک منتظم تھا، ولید تھا، میں جوان تھا، اور میں جوان تھا۔ مہینہ ختم ہونے سے پہلے وہ مر گیا تھا۔ ابن سیرین نے کہا ہے کہ سلیمان نے اپنی خلافت کا آغاز نماز کو اس کے مقررہ اوقات میں زندہ کر کے کیا اور عمر بن عبدالعزیز کو مقرر کر کے اسے بند کر دیا۔ 370-371}۔ کتاب بیان کرتی ہے کہ جب سلیمان دبیق میں مر رہا تھا تو اس نے راجہ ابن حیوہ سے پوچھا کہ وہ کس کا نام رکھے، اور راجہ نے عمر بن عبدالعزیز کو تجویز کیا۔ اس دستاویز میں عمر اور پھر ان کے بعد یزید بن عبد الملک کا نام لکھا گیا اور لوگوں سے اس دستاویز کے مطابق حلف لیا گیا۔ ان کی وفات کے بعد جب دستاویز پڑھی گئی تو عبد الملک کے بیٹوں کے چہرے بدل گئے۔ آپ کا انتقال صفر کے اختتام سے دس دن پہلے سنہ 99 ہجری میں ہوا اور عمر بن عبدالعزیز نے ان پر نماز جنازہ پڑھائی۔ کتاب میں یہ بھی بتایا گیا ہے کہ سلیمان نے اپنے بیٹے کا نام ایوب رکھنے سے انکار کرنے کے بعد عمر اور پھر یزید بن عبد الملک کو جانشینی کی پیشکش کی تھی۔ کہ راجہ ابن حیوہ نے اپنی وفات کے بعد اس دستاویز کے لیے حلف اٹھایا۔ اور یہ کہ ہشام نے عمر کی بیعت کرنے سے انکار کر دیا {حوالہ: سلبی-امیاد-ریاست-2020 صفحہ 184-187}۔"
  tr: "Taberi, 99. yılda Süleyman ibn Abdülmalik'in Safer ayının onuncu gecesinde, Cuma günü Dabik'te öldüğünü zikretmiş (kaynak: tabari-tarikh-abu-al-fadl c.6 s. 546) ve biyografisinden bazı bölümler aktarmıştır (kaynak: tabari-tarikh-abu-al-fadl c.6 s. 547). Suyuti'ye göre, Dabik'te savaşırken ölmüş ve aynaya baktığında gençliğinden ve güzelliğinden etkilenerek şöyle demiştir: \"Muhammed bir peygamberdi, Ebu Bekir doğru sözlüydü, Ömer basiretliydi, Osman mütevazıydı, Muaviye sabırlıydı, Yezid sabırlıydı, Abdülmalik bir önderdi, el-Valid bir zalimdi ve ben genç kralım.\" Ay bitmeden ölmüştür. İbn Sirin şöyle demiştir: “Allah Süleyman’a rahmet etsin. Halifeliğine namazları vakitlerinde kıldırarak başladı ve halifeliğini Ömer ibn Abdülaziz’i halefi olarak tayin ederek sonlandırdı.” {kaynak:tarikh-khulafa-minhaj-1434 s. 370-371} Kitapta, Süleyman’ın Dabiq’taki son hastalığı sırasında Raca’ ibn Hayva’ya halefi olarak kimi tayin etmesi gerektiğini sorduğu belirtilmektedir. Raca’, Ömer ibn Abdülaziz’i önermiş ve Ömer için, ondan sonra da Yezid ibn Abdülmalik için bir ahd yazılmıştır. Halk, yazıldığı gibi ahde biat etmiştir. Ölümünden sonra ahit okunduğunda Beni Abdülmalik’in yüzleri değişmiştir. 99 Hicri yılının Safer ayının 20. Cuma günü vefat etmiş ve cenaze namazını Ömer ibn Abdülaziz kıldırmıştır. {cite:salabi-umayyad-state-2020 s.155-157} Kitap ayrıca, Süleyman'ın oğlu Eyyub'u atamayı reddettikten sonra, önce Ömer'e, sonra da Yezid ibn Abdülmalik'e biat teklif ettiğini belirtiyor. Raja' ibn Hayva, ölümünden sonra biat yeminini topladı ve Hişam, Ömer'e biat etmeyi reddetti. {cite:salabi-umayyad-state-2020 s.184-187}"
  id: "Al-Tabari menyebutkan pada tahun sembilan puluh sembilan wafatnya Sulayman bin Abd al-Malik di Dabiq pada hari Jumat, sepuluh malam memasuki bulan Safar {cite:tabari-tarikh-abu-al-fadl j.6 p.546}, dan menyebutkan beberapa biografinya {cite:tabari-tarikh-abu-al-fadl j.6 p.547}. Menurut al-Suyuti, ia meninggal saat berperang di Dabiq, dan ketika ia melihat ke cermin, ia terkesan oleh kemudaan dan kecantikannya dan berkata: “Muhammad adalah seorang nabi, Abu Bakr adalah seorang yang jujur, Umar adalah seorang yang bijaksana, Uthman adalah seorang yang rendah hati, Muawiyah adalah seorang yang sabar, Yazid adalah seorang yang tabah, Abd al-Malik adalah seorang pemimpin, al-Walid adalah seorang tiran, dan aku adalah raja muda.” Sebelum bulan itu berakhir, ia meninggal dunia. Ibn Sirin berkata: “Semoga Allah merahmati Sulaiman. Beliau memulai kekhalifahannya dengan menghidupkan kembali salat pada waktu-waktu yang telah ditentukan dan mengakhirinya dengan mengangkat Umar ibn Abd al-Aziz sebagai penggantinya.” {kutip:tarikh-khulafa-minhaj-1434 hlm. 370-371} Kitab tersebut menyatakan bahwa selama sakit terakhirnya di Dabiq, Sulaiman bertanya kepada Raja' ibn Haywa siapa yang harus diangkatnya sebagai penggantinya. Raja' menyarankan Umar ibn Abd al-Aziz, dan sebuah perjanjian ditulis untuk Umar, kemudian untuk Yazid ibn Abd al-Malik setelahnya. Orang-orang berjanji setia kepada perjanjian sebagaimana tertulis. Ketika perjanjian itu dibacakan setelah kematiannya, wajah-wajah Bani Abd al-Malik berubah. Beliau wafat pada hari Jumat, tanggal 20 Safar, 99 H, dan Umar ibn Abd al-Aziz memimpin salat jenazah. {cite:salabi-umayyad-state-2020 p.155-157} Kitab ini juga menyatakan bahwa Sulaiman menawarkan perjanjiannya kepada Umar, kemudian kepada Yazid ibn Abd al-Malik, setelah menolak mengangkat putranya, Ayyub. Raja' ibn Haywa mengumpulkan sumpah setia pada perjanjian tersebut setelah kematiannya, dan Hisham menolak untuk bersumpah setia kepada Umar. {cite:salabi-umayyad-state-2020 p.184-187}"
