label: { ar: "وفاة سليمان بن عبد الملك" }
summary:
  ar: "ذكر الطبري في سنة تسع وتسعين وفاة سليمان بن عبد الملك بدابق يوم الجمعة لعشر ليال مضين من صفر {cite:tabari-tarikh-abu-al-fadl j.6 p.546}، وذكر بعض سيره {cite:tabari-tarikh-abu-al-fadl j.6 p.547}، وعند السيوطي مات غازياً بدابق ونظر في المرآة فأعجبه شبابه وجماله وقال كان محمد نبياً وأبو بكر صديقاً وعمر فاروقاً وعثمان حيياً ومعاوية حليماً ويزيد صبوراً وعبد الملك سائساً والوليد جباراً وأنا الملك الشاب فما دار عليه الشهر حتى مات، وقال ابن سيرين يرحم الله سليمان افتتح خلافته بإحيائه الصلاة لمواقيتها واختتمها باستخلافه عمر بن عبد العزيز {cite:tarikh-khulafa-minhaj-1434 p. 370-371} ويذكر الكتاب أن سليمان في مرض موته بدابق سأل رجاء بن حيوة عمّن يستخلف، فاقترح عمر بن عبد العزيز، وكُتب العهد لعمر ثم ليزيد بن عبد الملك من بعده، وأخذت البيعة من الناس على ما في الكتاب، فلما قُرئ الكتاب بعد الوفاة تغيّرت وجوه بني عبد الملك. وتوفي يوم الجمعة لعشر بقين من صفر سنة 99هـ، وصلى عليه عمر بن عبد العزيز. {cite:salabi-umayyad-state-2020 p.155-157} ويذكر الكتاب أن سليمان عرض عهده لعمر ثم ليزيد بن عبد الملك بعد أن رفض أن يعهد لابنه أيوب، وأن رجاء بن حيوة أخذ البيعة للكتاب بعد الوفاة، وأن هشاماً امتنع عن بيعة عمر. {cite:salabi-umayyad-state-2020 p.184-187}"
