label: { ar: "فتح طنجة", en: "The Conquest of Tangier", es: "La conquista de Tánger", fr: "La conquête de Tanger" }
summary:
  ar: "عند البلاذري عن الواقدي: وجّه عبد العزيز بن مروان موسى بن نصير مولى بني أمية — وأصله من عين التمر ويُقال بل هو من عراشة من بليّ ويُقال هو من لخم — والياً على إفريقية ويُقال بل ولّاها في زمن الوليد بن عبد الملك سنة تسع وثمانين ففتح طنجة ونزلها وهو أول من نزلها واختطّ فيها للمسلمين وانتهت خيله إلى السوس الأدنى وبينه وبين السوس الأقصى نيف وعشرون يوماً فوطنهم وسبى منهم وأثّوا إليه."
  en: "In al-Baladhuri on al-Waqidi's report: Abd al-Aziz ibn Marwan sent Musa ibn Nusayr — a mawla of Banu Umayya whose origin was Ayn al-Tamr, or, some say, of Arasha of Bali, or of Lakhm — as governor over Ifriqiya; others say he held it in al-Walid ibn Abd al-Malik's day in year 89. He opened Tangier and settled it — the first to lodge there — laying out khittas for the Muslims, and his cavalry reached Sus al-Adna — between which and Sus al-Aqsa lie some twenty-odd days — where he settled them, took captives, and they submitted to him."
  es: "En al-Baladhuri sobre el informe de al-Waqidi: Abd al-Aziz ibn Marwan envió a Musa ibn Nusayr —un mawla de Banu Umayya cuyo origen era Ayn al-Tamr, o, algunos dicen, de Arasha de Bali, o de Lakhm— como gobernador de Ifriqiya; otros dicen que la gobernó en la época de al-Walid ibn Abd al-Malik en el año 89. Abrió Tánger y se estableció allí —el primero en alojarse allí— estableciendo khittas para los musulmanes, y su caballería llegó a Sus al-Adna —entre la cual y Sus al-Aqsa hay unos veinte días— donde los estableció, tomó cautivos y se sometieron a él."
  fr: "Dans al-Baladhuri, d'après le rapport d'al-Waqidi: Abd al-Aziz ibn Marwan envoya Musa ibn Nusayr — un mawla des Banu Umayya originaire d'Ayn al-Tamr, ou, selon certains, d'Arasha de Bali, ou encore de Lakhm — comme gouverneur d'Ifriqiya; d'autres affirment qu'il l'exerçait sous le règne d'al-Walid ibn Abd al-Malik, en l'an 89. Il conquit Tanger et s'y installa — il fut le premier à y établir un campement —, y établissant des khittas pour les musulmans, et sa cavalerie atteignit Sus al-Adna — située à une vingtaine de jours de marche de Sus al-Aqsa — où il les installa, fit des captifs, et ils se soumirent à lui."
