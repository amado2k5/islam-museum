id: event/baghdad-dragon-wind-378
class: event
kind: disaster-relief
label: { ar: "ريح التنين ببغداد 378هـ", en: "The dragon-wind over Baghdad, 378", fr: "Le vent-dragon sur Bagdad, 378", es: "El viento del dragón sobre Bagdad, 378", ur: "بغداد کے اوپر ڈریگن ونڈ، 378", tr: "Bağdat'ta Ejderha Rüzgarı, Hicri 378", id: "Angin Naga di Baghdad, 378 H" }
summary:
  ar: "في شعبان سنة ثمان وسبعين وثلثمائة كثرت الرياح العواصف، وجاءت وقت العصر من يوم الخميس لخمس بقين منه ريح شُبّهت بالتنين حتى سُحرت دجلة فبان قعرها وظهرت أرضها من ممر الريح، وهدمت قطعة من المسجد الجامع وأهلكت جماعة من الناس، وغرّقت كثيراً من السفن الكبيرة الملوءة بالأمتعة، واحتملت زورقاً منحدراً فيه دواب وعدة سفن وطرحت ذلك في أرض جوخى فشوهد بعد أيام {cite:muntazam-ibn-al-jawzi j.7 p.145}."
  en: "In Sha'ban 378 violent gales multiplied over Baghdad; on the Thursday afternoon with five days left in the month came a wind likened to a dragon — it swept the Tigris bare until its bed showed, demolished a part of the congregational mosque, killed people, sank great ships loaded with goods and carried a boat with its beasts inland to the land of Jukha where it was seen days later {cite:muntazam-ibn-al-jawzi j.7 p.145}."
  fr: "En Sha'ban 378, de violentes tempêtes se multiplièrent sur Bagdad ; le jeudi après-midi, cinq jours avant la fin du mois, vint un vent comparé à un dragon : il balaya le Tigre jusqu'à en découvrir le lit, démolit une partie de la grande mosquée, tua des gens, coula de grands navires chargés de marchandises et emporta une barque avec ses bêtes à l'intérieur des terres, au pays de Jukha, où on la vit des jours plus tard {cite:muntazam-ibn-al-jawzi j.7 p.145}."
  es: "En Sha'ban 378, violentos vendavales se multiplicaron sobre Bagdad; el jueves por la tarde, con cinco días restantes del mes, llegó un viento comparado con un dragón: barrió el Tigris hasta dejarlo desnudo, demolió parte de la mezquita congregacional, mató gente, hundió grandes barcos cargados de mercancías y arrastró un barco con sus bestias tierra adentro hasta la tierra de Jukha, donde fue visto días después {cite:muntazam-ibn-al-jawzi j.7 p.145}."
  ur: "شعبان میں 378 پرتشدد آندھیاں بغداد میں کئی گنا بڑھ گئیں۔ جمعرات کی دوپہر کو جب مہینے میں پانچ دن باقی تھے ایک ہوا چلی جس کو اژدہا سے تشبیہ دی گئی تھی - اس نے دجلہ کو برہنہ کر دیا یہاں تک کہ اس کا بستر ظاہر ہو گیا، مسجد کا ایک حصہ منہدم کر دیا، لوگوں کو ہلاک کر دیا، سامان سے لدے بڑے بڑے بحری جہازوں کو غرق کر دیا اور اپنے درندوں کے ساتھ ایک کشتی کو جوکھا کی سرزمین پر لے گئی جہاں کئی دنوں بعد اسے دیکھا گیا:۔ صفحہ 145}۔"
  tr: "378. Şaban ayında fırtınalı rüzgarlar arttı ve Şaban ayının bitimine beş gün kala, Perşembe öğleden sonra, ejderhaya benzeyen bir rüzgar esti; Dicle nehri büyülendi, dibi göründü, kıyı şeridi rüzgarın yolundan kayboldu ve Mescid-i Haram'ın bir bölümünü yıktı, bir grup insanı öldürdü, yük dolu birçok büyük gemiyi batırdı ve içinde hayvanlar ve birkaç gemi bulunan, yokuş aşağı giden bir tekneyi sürükleyip Cukha topraklarına attı; bu tekne birkaç gün sonra görüldü. {cite:muntazam-ibn-al-jawzi j.7 p.145}"
  id: "Pada bulan Sya'ban tahun tiga ratus tujuh puluh delapan, angin badai semakin kencang, dan pada siang hari Kamis, lima hari sebelum berakhirnya bulan itu, datanglah angin yang diibaratkan seperti naga, sehingga Sungai Tigris menjadi seperti disihir dan dasar sungainya terlihat, daratannya muncul dari jalur angin, dan angin itu menghancurkan sebagian Masjidil Haram dan menewaskan sekelompok orang, dan menenggelamkan banyak kapal besar yang penuh muatan, dan membawa sebuah perahu yang sedang menuruni bukit dengan hewan dan beberapa kapal di dalamnya lalu melemparkannya ke tanah Jukha, dan perahu itu terlihat beberapa hari kemudian. {cite:muntazam-ibn-al-jawzi j.7 p.145}."
