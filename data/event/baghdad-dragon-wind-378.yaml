summary:
  ar: "في شعبان سنة ثمان وسبعين وثلثمائة كثرت الرياح العواصف، وجاءت وقت العصر من يوم الخميس لخمس بقين منه ريح شُبّهت بالتنين حتى سُحرت دجلة فبان قعرها وظهرت أرضها من ممر الريح، وهدمت قطعة من المسجد الجامع وأهلكت جماعة من الناس، وغرّقت كثيراً من السفن الكبيرة الملوءة بالأمتعة، واحتملت زورقاً منحدراً فيه دواب وعدة سفن وطرحت ذلك في أرض جوخى فشوهد بعد أيام {cite:muntazam-ibn-al-jawzi j.7 p.145}."
  en: "In Sha'ban 378 violent gales multiplied over Baghdad; on the Thursday afternoon with five days left in the month came a wind likened to a dragon — it swept the Tigris bare until its bed showed, demolished a part of the congregational mosque, killed people, sank great ships loaded with goods and carried a boat with its beasts inland to the land of Jukha where it was seen days later {cite:muntazam-ibn-al-jawzi j.7 p.145}."
