label: { ar: "وقعة سرماري على الكرج", en: "The Sarmari ambush of the Georgians (620 AH)" }
summary:
  ar: "في شعبان سنة عشرين وستمائة أغار أمير قلعة سرماري من أعمال أرمينية — وهي في طاعة صاحب خلاط شهاب الدين غازي بن العادل — على بلاد الكرج فنهب عدة قرى، فجمع صاحب دوين شلوة من أكابر أمراء الكرج عسكره وحصر سرماري ونهب سوادها ثم رجع، فعاد صاحب سرماري وبلغه أن الكرج نزلوا بوادٍ ضيق بين دوين وسرماري، فسار بعسكره جريدة وجدّ السير فوصل الوادي وقت السحر وفرق عسكره فرقتين من أعلى الوادي وأسفله وحملوا عليهم وهم غافلون فوضعوا السيف فيهم وأسروا شلوة أمير دوين في جماعة كثيرة من مقدميهم، فأرسل ملك الكرج إلى الملك الأشرف صاحب ديار الجزيرة يقول: إن كنا على الصلح فنريد إطلاق أصحابنا من الأسر وإن كان الصلح قد انفسخ فتعرفنا {cite:kamil-ibn-al-athir p. 435-436}."
  en: "620: a dawn ambush in the narrow wadi between Dvin and Sarmari — the Akhlat marcher-lord fell on the Georgian army 'while they were heedless', capturing Shalwa, amir of Dvin and one of Georgia's greatest commanders, with many of his officers; the Georgian king wrote to al-Ashraf of the Jazira: release our men or the peace is broken {cite:kamil-ibn-al-athir p. 435-436}."
