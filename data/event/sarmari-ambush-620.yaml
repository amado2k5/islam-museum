label: { ar: "وقعة سرماري على الكرج", en: "The Sarmari ambush of the Georgians (620 AH)", es: "La emboscada de Sarmari a los georgianos (620 AH)", fr: "L'embuscade des Sarmari contre les Géorgiens (620 AH)", ur: "جارجیوں کا سرماری گھات لگانا ⁦(620ھ)⁩", tr: "Karaj'daki Sarmari Muharebesi", id: "Pertempuran Sarmari di Karaj" }
summary:
  ar: "في شعبان سنة عشرين وستمائة أغار أمير قلعة سرماري من أعمال أرمينية — وهي في طاعة صاحب خلاط شهاب الدين غازي بن العادل — على بلاد الكرج فنهب عدة قرى، فجمع صاحب دوين شلوة من أكابر أمراء الكرج عسكره وحصر سرماري ونهب سوادها ثم رجع، فعاد صاحب سرماري وبلغه أن الكرج نزلوا بوادٍ ضيق بين دوين وسرماري، فسار بعسكره جريدة وجدّ السير فوصل الوادي وقت السحر وفرق عسكره فرقتين من أعلى الوادي وأسفله وحملوا عليهم وهم غافلون فوضعوا السيف فيهم وأسروا شلوة أمير دوين في جماعة كثيرة من مقدميهم، فأرسل ملك الكرج إلى الملك الأشرف صاحب ديار الجزيرة يقول: إن كنا على الصلح فنريد إطلاق أصحابنا من الأسر وإن كان الصلح قد انفسخ فتعرفنا {cite:kamil-ibn-al-athir p. 435-436}."
  en: "620: a dawn ambush in the narrow wadi between Dvin and Sarmari — the Akhlat marcher-lord fell on the Georgian army 'while they were heedless', capturing Shalwa, amir of Dvin and one of Georgia's greatest commanders, with many of his officers; the Georgian king wrote to al-Ashraf of the Jazira: release our men or the peace is broken {cite:kamil-ibn-al-athir p. 435-436}."
  es: "620: una emboscada al amanecer en el estrecho wadi entre Dvin y Sarmari: el señor de la frontera de Akhlat cayó sobre el ejército georgiano \"mientras estaban desprevenidos\", capturando a Shalwa, emir de Dvin y uno de los mayores comandantes de Georgia, junto con muchos de sus oficiales; el rey georgiano escribió a al-Ashraf de Jazira: libera a nuestros hombres o la paz se romperá {cita:kamil-ibn-al-athir págs. 435-436}."
  fr: "620: une embuscade à l'aube dans l'étroit oued entre Dvin et Sarmari — le seigneur des marches d'Akhlat s'est jeté sur l'armée géorgienne « alors qu'elle était insouciante », capturant Shalwa, émir de Dvin et l'un des plus grands commandants de Géorgie, avec plusieurs de ses officiers; le roi géorgien a écrit à al-Ashraf de la Jazira: libérez nos hommes ou la paix est rompue {cite: kamil-ibn-al-athir p. 435-436}."
  ur: "620: ڈیوین اور سرماری کے درمیان تنگ وادی میں صبح کے وقت گھات لگا کر حملہ - اخلت مارچر لارڈ جارجیائی فوج پر 'جب کہ وہ غافل تھے' گرا، شلوا، ڈیوین کے امیر اور جارجیا کے سب سے بڑے کمانڈروں میں سے ایک، اپنے بہت سے افسروں کے ساتھ۔ جارجیا کے بادشاہ نے جزیرہ کے اشرف کو لکھا: ہمارے آدمیوں کو رہا کرو ورنہ امن ٹوٹ جائے گا۔ 435-436}۔"
  tr: "Hicri 620 yılının Şaban ayında, Ermenistan'ın bir parçası olan ve Hilafet hükümdarı Şihab el-Din Gazi ibn el-Adil'in yönetimi altındaki Sarmari kalesinin emiri, Gürcülerin topraklarına baskın düzenleyerek birkaç köyü yağmaladı. Bunun üzerine Dvin hükümdarı Şalva, en önde gelen Gürcü emirlerinden oluşan ordusunu toplayarak Sarmari'yi kuşattı ve kırsalını yağmaladıktan sonra geri döndü. Sarmari hükümdarı geri döndüğünde Gürcülerin Dvin ile Sarmari arasındaki dar bir vadide kamp kurduklarını öğrendi ve ordusuyla hızla ilerleyerek şafak vakti vadiye ulaştı. Ordusunu iki gruba ayırdı; biri vadinin üst kısmından, diğeri alt kısmından. Gürcüler hazırlıksız yakalanarak Dvin emiri Şalva'yı ve büyük bir grup liderini esir aldılar. Gürcistan kralı, Cezire bölgesinin hükümdarı Kral el-Eşref'e şu mesajı gönderdi: \"Eğer hâlâ barış içindeysek, arkadaşlarımızın esaretten kurtarılmasını istiyoruz. Eğer barış bozulmuşsa, bize bildirin.\" {Kaynak: Kamil İbn el-Athir, s. 435-436}"
  id: "Pada bulan Sya'ban tahun 620 Hijriah, Emir benteng Sarmari, yang merupakan bagian dari Armenia—dan berada di bawah kekuasaan penguasa Khilat, Shihab al-Din Ghazi ibn al-Adil—menyerbu wilayah Georgia dan menjarah beberapa desa. Maka penguasa Dwin, Shalwa, mengumpulkan pasukannya dari antara para emir Georgia yang paling terkemuka dan mengepung Sarmari serta menjarah pedesaannya, lalu ia kembali. Penguasa Sarmari kembali dan mengetahui bahwa orang-orang Georgia telah berkemah di lembah sempit antara Dwin dan Sarmari, sehingga ia bergerak cepat dengan pasukannya dan mempercepat perjalanannya hingga mencapai lembah tersebut saat fajar. Ia membagi pasukannya menjadi dua kelompok, satu dari lembah atas dan yang lainnya dari lembah bawah, dan mereka menyerang mereka saat mereka lengah. Mereka membantai mereka dan menangkap Shalwa, emir Dwin, bersama dengan sejumlah besar pemimpin mereka. Maka raja Georgia mengirim pesan kepada Raja al-Ashraf, penguasa wilayah Jazira, yang isinya: Jika kita masih dalam keadaan damai, kami ingin para sahabat kami dibebaskan dari penawanan. Jika perdamaian telah dilanggar, maka beritahukanlah kepada kami. {cite:kamil-ibn-al-athir hlm. 435-436}"
