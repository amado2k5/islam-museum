id: event/al-qasim-and-ali-seek-allies-for-a-raid-and-are-refused-by-yam-ahlaf-and-wadia-295
class: event
kind: other
label:
  ar: "القاسم وعلي يطلبان النصرة للإغارة فيُرفضان من يام والأحلاف ووادعة، 295هـ"
  en: "Al-Qasim and Ali ibn Muhammad seek allies for a raid and are refused by Yam, Ahlaf and Wadi'a, 21 Dhu al-Hijja 295 AH, pp. 367-368"
  ur: "القاسم اور علی کا اغارت کے لیے مدد مانگنا، یام، الأحلاف اور وادعہ کا انکار، 21 ذوالحجہ 295ھ، ص367-368"
  es: "Al-Qasim y Ali ibn Muhammad buscan aliados para una incursión y Yam, Ahlaf y Wadi'a se los niegan, 21 Dhu al-Hijja 295 AH, pp. 367-368."
  fr: "Al-Qasim et Ali ibn Muhammad cherchent des alliés pour un raid et sont refusés par Yam, Ahlaf et Wadi'a, 21 Dhu al-Hijja 295 AH, pp. 367-368"
summary:
  ar: "صباح الأربعاء خرج القاسم إلى يام والأحلاف يطلب منهم الإغارة على سوحان، فأبوا، واقترحوا بدلها الإغارة على بني ربيعة، فلم يقبل. ثم أرسل علي بن محمد إلى وادعة يطلب نصرتها، فلم تجبه، واعتلت بما بينها وبين يام من فتنة."
  en: "On Wednesday morning al-Qasim went out to Yam and Ahlaf and asked them to raid Sawhan. They refused and offered to raid Banu Rabi'a instead, which he declined. Ali ibn Muhammad then sent to Wadi'a asking for support. Wadi'a did not answer, citing the strife between itself and Yam."
  ur: "بدھ کی صبح القاسم یام اور الأحلاف کے پاس گیا اور ان سے سوحان پر حملے کو کہا۔ انہوں نے انکار کیا اور اس کے بدلے بنو ربیعہ پر حملہ کرنے کی پیشکش کی، جو اس نے قبول نہ کی۔ پھر علی بن محمد نے وادعہ کو مدد کے لیے پیغام بھیجا، مگر انہوں نے جواب نہ دیا اور یام کے ساتھ اپنے فتنے کا عذر کیا۔"
  es: "El miércoles por la mañana, al-Qasim se dirigió a Yam y Ahlaf y les pidió que atacaran Sawhan. Ellos se negaron y le ofrecieron atacar Banu Rabi'a, lo cual él rechazó. Entonces, Ali ibn Muhammad envió un mensajero a Wadi'a solicitando apoyo. Wadi'a no respondió, alegando la disputa interna con Yam."
  fr: "Mercredi matin, al-Qasim se rendit auprès de Yam et d'Ahlaf et leur demanda de mener un raid sur Sawhan. Ils refusèrent et proposèrent plutôt d'attaquer Banu Rabi'a, ce qu'il déclina. Ali ibn Muhammad envoya alors un message à Wadi'a pour lui demander de l'aide. Wadi'a ne répondit pas, invoquant le conflit qui l'opposait à Yam."
