  en: "The Ottoman Interregnum (Fetret Devri)"
summary:
  ar: "الحرب الأهلية العثمانية التي نشبت بين أبناء بايزيد الأول على العرش بعد هزيمة أنقرة واستمرت عشر سنوات (٨٠٦–٨١٦هـ/١٤٠٣–١٤١٣م حسب تسلسل الكتاب). يذكر الصلابي أن لبايزيد خمسة أبناء اشتركوا معه في القتال: مصطفى الذي ظُنّ مقتولاً في المعركة، وموسى الذي أُسر مع أبيه ثم أطلقه تيمورلنك ليؤجج الفتنة، وأكبرهم سليمان الذي ذهب إلى أدرنة وأعلن نفسه سلطاناً، وعيسى الذي أعلن نفسه خليفة أبيه في بروسة، وأصغرهم محمد الذي انسحب إلى أماسيا في شمال شرقي آسيا الصغرى. واسترجع تيمورلنك لأمراء آسيا الصغرى إماراتهم التي ضمها بايزيد وبذر بذور الشقاق بين الأبناء المتنازعين {cite:dawlat-uthmaniyya-salabi p. 70-71}. وانتهت الفترة بانفراد محمد الأول بالحكم سنة ١٤١٣م ولمّه شتات الأراضي التي فقدتها الدولة {cite:dawlat-uthmaniyya-salabi p. 72-73}."
  en: "The Ottoman civil war among Bayezid I's sons after Ankara — ten years (806–816/1403–1413 in the book's reckoning). Mustafa was presumed dead in the battle; Musa, captured with his father, was released by Timur to stoke the strife; the eldest Süleyman proclaimed himself sultan at Edirne, İsa at Bursa, and the youngest Mehmed held Amasya, while Timur restored the Anatolian beyliks Bayezid had annexed {cite:dawlat-uthmaniyya-salabi p. 70-71}. It ended when Mehmed stood alone in 1413 and gathered the lost lands {cite:dawlat-uthmaniyya-salabi p. 72-73}."
