label:
  ar: "فترة الفترة العثمانية ⁦(الحرب الأهلية بين أبناء بايزيد)⁩"
  en: "The Ottoman Interregnum (Fetret Devri)"
  es: "El interregno otomano (Fetret Devri)"
  fr: "L'interrègne ottoman (Fetret Devri)"
summary:
  ar: "الحرب الأهلية العثمانية التي نشبت بين أبناء بايزيد الأول على العرش بعد هزيمة أنقرة واستمرت عشر سنوات ⁦(٨٠٦–٨١٦هـ/١٤٠٣–١٤١٣م حسب تسلسل الكتاب)⁩. يذكر الصلابي أن لبايزيد خمسة أبناء اشتركوا معه في القتال: مصطفى الذي ظُنّ مقتولاً في المعركة، وموسى الذي أُسر مع أبيه ثم أطلقه تيمورلنك ليؤجج الفتنة، وأكبرهم سليمان الذي ذهب إلى أدرنة وأعلن نفسه سلطاناً، وعيسى الذي أعلن نفسه خليفة أبيه في بروسة، وأصغرهم محمد الذي انسحب إلى أماسيا في شمال شرقي آسيا الصغرى. واسترجع تيمورلنك لأمراء آسيا الصغرى إماراتهم التي ضمها بايزيد وبذر بذور الشقاق بين الأبناء المتنازعين {cite:dawlat-uthmaniyya-salabi p. 70-71}. وانتهت الفترة بانفراد محمد الأول بالحكم سنة ١٤١٣م ولمّه شتات الأراضي التي فقدتها الدولة {cite:dawlat-uthmaniyya-salabi p. 72-73}."
  en: "The Ottoman civil war among Bayezid I's sons after Ankara — ten years (806–816/1403–1413 in the book's reckoning). Mustafa was presumed dead in the battle; Musa, captured with his father, was released by Timur to stoke the strife; the eldest Süleyman proclaimed himself sultan at Edirne, İsa at Bursa, and the youngest Mehmed held Amasya, while Timur restored the Anatolian beyliks Bayezid had annexed {cite:dawlat-uthmaniyya-salabi p. 70-71}. It ended when Mehmed stood alone in 1413 and gathered the lost lands {cite:dawlat-uthmaniyya-salabi p. 72-73}."
  es: "La guerra civil otomana entre los hijos de Bayezid I tras la batalla de Ankara duró diez años (806-816/1403-1413 según el calendario del libro). Se presumió que Mustafa había muerto en la batalla; Musa, capturado junto a su padre, fue liberado por Timur para avivar la contienda; el mayor, Süleyman, se proclamó sultán en Edirne, İsa en Bursa, y el menor, Mehmed, conservó Amasya, mientras que Timur restauró los beyliks de Anatolia que Bayezid había anexionado {cite:dawlat-uthmaniyya-salabi p. 70-71}. Terminó cuando Mehmed se quedó solo en 1413 y recuperó los territorios perdidos {cite:dawlat-uthmaniyya-salabi p. 72-73}."
  fr: "La guerre civile ottomane entre les fils de Bayezid Ier après Ankara dura dix ans (806-816 / 1403-1413 selon la chronologie de l'ouvrage). Mustafa fut présumé mort au combat; Musa, capturé avec son père, fut libéré par Timour pour attiser les dissensions; l'aîné, Soliman, se proclama sultan à Edirne, Isa à Bursa, et le cadet, Mehmed, conserva Amasya, tandis que Timour restituait les beyliks anatoliens annexés par Bayezid (voir: Dawlat-Uthmaniyya-Salabi, p. 70-71). Elle prit fin en 1413 lorsque Mehmed, seul au pouvoir, reconquit les territoires perdus (voir: Dawlat-Uthmaniyya-Salabi, p. 72-73)."
