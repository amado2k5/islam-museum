label: { ar: "مقتل محمد بن زيد العلوي", en: "The killing of Muhammad ibn Zayd al-Alawi" }
summary:
  ar: "في سنة سبع وثمانين ومائتين، في شوال، ورد الخبر بمقتل محمد بن زيد العلوي، وكان قد خرج نحو خراسان طامعاً فيها بعد أسر إسماعيل بن أحمد لعمرو بن الليث، فلما التقى بجيش محمد بن هارون على باب جرجان انهزم جيشه {cite:tabari-tarikh-abu-al-fadl j.10 p.81}."
  en: "In Shawwal of the year 287 news came of the killing of Muhammad ibn Zayd al-Alawi, who had set out toward Khurasan, hoping to take it after Isma'il ibn Ahmad captured Amr ibn al-Layth. When he met the army of Muhammad ibn Harun at the gate of Jurjan, his army was routed {cite:tabari-tarikh-abu-al-fadl j.10 p.81}."
