label: { ar: "مقتل محمد بن زيد العلوي", en: "The killing of Muhammad ibn Zayd al-Alawi", es: "El asesinato de Muhammad ibn Zayd al-Alawi", fr: "L'assassinat de Muhammad ibn Zayd al-Alawi" }
summary:
  ar: "في سنة سبع وثمانين ومائتين، في شوال، ورد الخبر بمقتل محمد بن زيد العلوي، وكان قد خرج نحو خراسان طامعاً فيها بعد أسر إسماعيل بن أحمد لعمرو بن الليث، فلما التقى بجيش محمد بن هارون على باب جرجان انهزم جيشه {cite:tabari-tarikh-abu-al-fadl j.10 p.81}."
  en: "In Shawwal of the year 287 news came of the killing of Muhammad ibn Zayd al-Alawi, who had set out toward Khurasan, hoping to take it after Isma'il ibn Ahmad captured Amr ibn al-Layth. When he met the army of Muhammad ibn Harun at the gate of Jurjan, his army was routed {cite:tabari-tarikh-abu-al-fadl j.10 p.81}."
  es: "En Shawwal del año 287 llegó la noticia del asesinato de Muhammad ibn Zayd al-Alawi, quien se había dirigido hacia Jorasán con la esperanza de tomarlo después de que Isma'il ibn Ahmad capturara a Amr ibn al-Layth. Cuando se encontró con el ejército de Muhammad ibn Harun en la puerta de Jurjan, su ejército fue derrotado {cite:tabari-tarikh-abu-al-fadl j.10 p.81}."
  fr: "Au mois de Shawwal 287, la nouvelle parvint de la mort de Muhammad ibn Zayd al-Alawi, qui s'était mis en route vers le Khorasan, espérant s'en emparer après la capture d'Amr ibn al-Layth par Isma'il ibn Ahmad. Lorsqu'il rencontra l'armée de Muhammad ibn Harun aux portes de Jurjan, son armée fut mise en déroute (voir Tabari Tarikh Abu al-Fadl, vol. 10, p. 81)."
