label: { ar: "حصار مالطة الكبير ⁦(٩٧٣هـ/١٥٦٥م)⁩", en: "Great Siege of Malta (973/1565)", es: "Gran asedio de Malta (973/1565)", fr: "Grand siège de Malte (973/1565)", ur: "مالٹا کا عظیم محاصرہ (973/1565)", tr: "Malta'nın Büyük Kuşatması (973 Hicri/1565 Miladi)", id: "Pengepungan Besar Malta (973 H/1565 M)" }
summary:
  ar: "عزم السلطان سليمان القانوني على فتح مالطة أكبر معاقل المسيحيين وسط المتوسط ومقر فرسان القديس يوحنا، فأرسل أسطوله بقيادة بيالي باشا وأمر درغوث رايس حاكم طرابلس وحسن بن خير الدين بالمشاركة؛ سار حسن بخمس وعشرين سفينة وثلاثة آلاف رجل. وصل الأسطول الإسلامي أمام مالطة في ١٨ مايو وضرب حصاراً شديداً حتى وصل المدد المسيحي بقيادة نائب الملك في صقلية مع ثمان وعشرين سفينة حربية، فانسحب الأسطول الإسلامي في ١٨ ربيع الأول ٩٧٣هـ/٨ ديسمبر ١٥٦٥م {cite:dawlat-uthmaniyya-salabi p. 252}."
  en: "Süleyman resolved to take Malta, the greatest Christian stronghold in the central Mediterranean and seat of the Knights of St John; he sent Piyale Pasha with the fleet and ordered Dragut of Tripoli and Hasan b. Khayr al-Din to join — Hasan with twenty-five ships and three thousand men. The fleet stood off Malta on 18 May and pressed a tight siege until Christian relief under the Sicilian viceroy arrived with twenty-eight warships; the Ottoman fleet withdrew on 18 Rabi' I 973/8 December 1565 {cite:dawlat-uthmaniyya-salabi p. 252}."
  es: "Süleyman decidió tomar Malta, el mayor bastión cristiano del Mediterráneo central y sede de los Caballeros de San Juan; envió a Piyale Pasha con la flota y ordenó a Dragut de Trípoli y a Hasan b. Khayr al-Din que se unieran a él, Hasan con veinticinco barcos y tres mil hombres. La flota se mantuvo frente a Malta el 18 de mayo y ejerció un asedio férreo hasta que llegó el refuerzo cristiano al mando del virrey siciliano con veintiocho buques de guerra; la flota otomana se retiró el 18 de Rabi' I de 973/8 de diciembre de 1565 {cite:dawlat-uthmaniyya-salabi p. 252}."
  fr: "Soliman résolut de s'emparer de Malte, principal bastion chrétien de la Méditerranée centrale et siège de l'Ordre de Saint-Jean. Il envoya Piyale Pacha avec la flotte et ordonna à Dragut de Tripoli et à Hasan ben Khayr al-Din de les rejoindre – Hasan disposant de vingt-cinq navires et de trois mille hommes. La flotte se positionna au large de Malte le 18 mai et imposa un siège rigoureux jusqu'à l'arrivée des renforts chrétiens, commandés par le vice-roi de Sicile, avec vingt-huit navires de guerre. La flotte ottomane se retira le 18 Rabi' I 973/8 décembre 1565 (voir: Dawlat-Uthmaniyya-Salabi, p. 252)."
  ur: "سلیمان نے مالٹا، وسطی بحیرہ روم میں عیسائیوں کا سب سے بڑا گڑھ اور سینٹ جان کے شورویروں کی نشست پر قبضہ کرنے کا عزم کیا۔ اس نے پیالی پاشا کو بحری بیڑے کے ساتھ بھیجا اور طرابلس کے ڈریگٹ اور حسن بن کو حکم دیا۔ خیرالدین میں شامل ہونا - حسن پچیس جہازوں اور تین ہزار آدمیوں کے ساتھ۔ بحری بیڑا 18 مئی کو مالٹا سے دور کھڑا ہوا اور اس وقت تک سخت محاصرہ جاری رکھا جب تک کہ سسلین وائسرائے کے ماتحت عیسائی امداد اٹھائیس جنگی جہازوں کے ساتھ نہ پہنچے۔ عثمانی بحری بیڑہ 18 ربیع الثانی 973/8 دسمبر 1565 کو واپس چلا گیا۔ 252}۔"
  tr: "Kanuni Sultan Süleyman, Orta Akdeniz'deki en büyük Hristiyan kalesi ve Aziz Yuhanna Şövalyeleri'nin karargâhı olan Malta'yı fethetmeye karar verdi. Piyale Paşa komutasındaki filosunu gönderdi ve Trablus valisi Dragut Reis ile Hasan ibn Hayr ed-Din'e de katılmalarını emretti. Hasan, yirmi beş gemi ve üç bin adamla yola çıktı. Müslüman filosu 18 Mayıs'ta Malta açıklarına ulaştı ve Sicilya valisinin komutasındaki yirmi sekiz savaş gemisiyle gelen Hristiyan takviye kuvvetleri gelene kadar sıkı bir kuşatma uyguladı. Müslüman filosu daha sonra Hicri 18 Rebiü'l-Evvel 973 / Miladi 8 Aralık 1565'te geri çekildi."
  id: "Sultan Suleiman Agung bertekad untuk menaklukkan Malta, benteng Kristen terbesar di Mediterania tengah dan markas besar Ksatria Santo Yohanes. Ia mengirimkan armadanya di bawah komando Piyale Pasha dan memerintahkan Dragut Reis, gubernur Tripoli, dan Hassan ibn Khayr ad-Din untuk ikut serta. Hassan berlayar dengan dua puluh lima kapal dan tiga ribu orang. Armada Muslim tiba di lepas pantai Malta pada tanggal 18 Mei dan melakukan pengepungan ketat hingga bala bantuan Kristen tiba di bawah komando wakil raja Sisilia dengan dua puluh delapan kapal perang. Armada Muslim kemudian mundur pada tanggal 18 Rabi' al-Awwal 973 H / 8 Desember 1565 M."
