summary:
  ar: "عزم السلطان سليمان القانوني على فتح مالطة أكبر معاقل المسيحيين وسط المتوسط ومقر فرسان القديس يوحنا، فأرسل أسطوله بقيادة بيالي باشا وأمر درغوث رايس حاكم طرابلس وحسن بن خير الدين بالمشاركة؛ سار حسن بخمس وعشرين سفينة وثلاثة آلاف رجل. وصل الأسطول الإسلامي أمام مالطة في ١٨ مايو وضرب حصاراً شديداً حتى وصل المدد المسيحي بقيادة نائب الملك في صقلية مع ثمان وعشرين سفينة حربية، فانسحب الأسطول الإسلامي في ١٨ ربيع الأول ٩٧٣هـ/٨ ديسمبر ١٥٦٥م {cite:dawlat-uthmaniyya-salabi p. 252}."
  en: "Süleyman resolved to take Malta, the greatest Christian stronghold in the central Mediterranean and seat of the Knights of St John; he sent Piyale Pasha with the fleet and ordered Dragut of Tripoli and Hasan b. Khayr al-Din to join — Hasan with twenty-five ships and three thousand men. The fleet stood off Malta on 18 May and pressed a tight siege until Christian relief under the Sicilian viceroy arrived with twenty-eight warships; the Ottoman fleet withdrew on 18 Rabi' I 973/8 December 1565 {cite:dawlat-uthmaniyya-salabi p. 252}."
