label: { ar: "مؤامرة بادربودن وحملة شارلمان على الأندلس" }
summary:
  ar: "في سنة ١٦٠هـ/٧٧٧م اتصل سليمان بن يقظان الأعرابي والي برشلونة وجيرندة بشارلمان الكارولنجي في بادربودن، بالتفاهم مع حسين بن يحيى الأنصاري والي سرقسطة وعبد الرحمن بن حبيب الصقلبي، وبتشجيع من الخليفة المهدي؛ وكانت الخطة أن يعبر شارلمان جبال البرينييه إلى سرقسطة فيسلمها له الأعرابي، بينما يزحف الفهري من المغرب وينزل بجيوشه مرسية، فيُضرب الطوق على عبد الرحمن الداخل وتُعلن خضوع البلاد للحكم العباسي؛ لكن عبد الرحمن باغت الفهري فقضى عليه، وأغلق الأنصاري أبواب سرقسطة في وجه الكارولنجيين، وبلغ شارلمان قيام السكسون بثورة في ألمانيا فعاد سنة ١٦٢هـ/٧٧٩م، وفشل الغزو كما فشل العباسيون في استعادة الأندلس {cite:tarikh-dawla-abbasiyya-taqqush p. 80-82}."
  en: "The Paderborn pact, 160 AH/777 CE — the Andalusi governors' compact with Charlemagne to deliver Saragossa, collapsing when al-Ansari shut the gates and the Saxon revolt recalled the Frank {cite:tarikh-dawla-abbasiyya-taqqush p. 80-82}."
