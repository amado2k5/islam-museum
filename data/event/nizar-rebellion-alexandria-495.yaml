label: { ar: "خروج نزار بن المستنصر بالإسكندرية وقمعه سنة 495" }
summary:
  ar: "في أيام المستعلي بالله هرب أخوه نزار — الذي تنسب إليه الدعوة النزارية بقلعة آلموت — فدخل الإسكندرية فبايعه أمنها وساعده قاضيها ابن عمار ومتوليها أفتكين، فنازلهم الأفضل بن بدر الجمالي فبرز لحربه أفتكين فهزمه الأفضل ثم نازلهم ثانية فظفر بهم ورجع إلى القاهرة بأفتكين ونزار فذبح أفتكين وبنى على نزار حائطاً فهلك {cite:shadharat-dhahab p. 402}."
  en: "In al-Musta'li's days his brother Nizar — namesake of the Nizari da'wa of Alamut — fled to Alexandria, whose people swore to him with the backing of its qadi Ibn Ammar and its governor Iftakin; al-Afdal b. Badr al-Jamali besieged them, beat Iftakin's sortie, then prevailed and carried both men back to Cairo, where Iftakin was slaughtered and Nizar was walled up and perished {cite:shadharat-dhahab p. 402}."
