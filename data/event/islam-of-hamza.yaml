label: { en: "Hamza accepts Islam", ar: "إسلام حمزة بن عبد المطلب", es: "Hamza acepta el Islam", fr: "Hamza se convertit à l'islam." }
summary:
  en: "In late year six, Abu Jahl passed the Prophet at al-Safa and abused him while he stayed silent; a freedwoman of Abdullah ibn Jud'an told Hamza, returning from the hunt, who struck Abu Jahl with his bow and declared 'I abuse him while I follow his religion — take that if you can' — anger first, then faith settled in his heart."
  ar: "في أواخر السنة السادسة مرّ أبو جهل بالنبي عند الصفا فآذاه ونال منه والنبي ساكت؛ فأخبرت مولاة لعبد الله بن جدعان حمزةَ العائد من القنص، فخرج فضرب أبا جهل بالقوس وقال: تشتم ابن أخي وأنا على دينه؟ — وكان إسلامه أول الأمر أنفة ثم شرح الله صدره فاعتز به المسلمون."
  es: "A finales del sexto año, Abu Jahl pasó junto al Profeta en al-Safa y lo insultó mientras él permanecía en silencio; una mujer liberada de Abdullah ibn Jud'an se lo contó a Hamza, que regresaba de la caza, quien golpeó a Abu Jahl con su arco y declaró: \"Lo insulto mientras sigo su religión; toma eso si puedes\". Primero la ira, luego la fe se asentó en su corazón."
  fr: "À la fin de la sixième année, Abou Jahl croisa le Prophète à al-Safa et l'insulta tandis qu'il restait silencieux; une affranchie d'Abdullah ibn Jud'an le rapporta à Hamza, qui, de retour de la chasse, frappa Abou Jahl de son arc et déclara: « Je l'insulte tout en suivant sa religion — prends cela si tu peux » — la colère d'abord, puis la foi s'installa dans son cœur."
