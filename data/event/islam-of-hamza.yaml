label: { en: "Hamza accepts Islam", ar: "إسلام حمزة بن عبد المطلب" }
summary:
  en: "In late year six, Abu Jahl passed the Prophet at al-Safa and abused him while he stayed silent; a freedwoman of Abdullah ibn Jud'an told Hamza, returning from the hunt, who struck Abu Jahl with his bow and declared 'I abuse him while I follow his religion — take that if you can' — anger first, then faith settled in his heart."
  ar: "في أواخر السنة السادسة مرّ أبو جهل بالنبي عند الصفا فآذاه ونال منه والنبي ساكت؛ فأخبرت مولاة لعبد الله بن جدعان حمزةَ العائد من القنص، فخرج فضرب أبا جهل بالقوس وقال: تشتم ابن أخي وأنا على دينه؟ — وكان إسلامه أول الأمر أنفة ثم شرح الله صدره فاعتز به المسلمون."
