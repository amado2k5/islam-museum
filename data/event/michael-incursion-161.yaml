label: { ar: "غارة ميخائيل على عمق مرعش سنة 161", en: "Michael's Incursion on the Mar'ash Depths, 161", es: "La incursión de Michael en las profundidades de Mar'ash, 161", fr: "L'incursion de Michel dans les profondeurs de Mar'ash, 161" }
summary:
  ar: "عند البلاذري حدثني محمد بن سعد عن الواقدي: خرج ميخائيل من درب الحدث في ثمانين ألفاً فأتى عمق مرعش فقتل وأحرق وسبى من المسلمين خلقاً وصار إلى باب مدينة مرعش وبها عيسى بن علي — وكان قد غزا في تلك السنة — فخرج إليه موالي عيسى وأهل المدينة ومقاتلتهم فرشقوه بالنبل والسهام فاستطرد لهم حتى إذا نحاهم عن المدينة كوّى عليهم فقتل من موالي عيسى ثمانية أنفس واعتصم الباقون بالمدينة فأغلقوها فحاصرهم بها ثم انصرف حتى نزل جيحان، وبلغ الخبر ثمامة بن الوليد العبسي وهو بدايق — وكان قد ولي الصائفة سنة 161 — فوجّه إليه خيلاً كثيفة فأُصيبوا إلا من نجا منهم، فأحفظ ذلك المهدي واحتفل لإغزاء الحسن بن قحطبة في العام المقبل وهو سنة 162."
  en: "In al-Baladhuri — Muhammad ibn Sa'd told me from al-Waqidi: Michael came out of the Darb al-Hadath with eighty thousand, reached Amq Mar'ash killing, burning and taking captives of the Muslims, and came to the gate of Mar'ash, where Isa ibn Ali was — he having raided that year — so Isa's mawalis, the city folk and their fighters went out and shot him with arrows and darts; he feigned flight until he had drawn them from the city, then turned on them and killed eight of Isa's mawalis, the rest holding fast in the city which they shut, whereupon he besieged them then withdrew to Jayhan; word reached Thumama ibn al-Walid al-Absi at Dayq — he having been placed over that year's summer expedition, year 161 — who sent dense cavalry against him that were destroyed save those who escaped, which so grieved al-Mahdi that he made ready to send al-Hasan ibn Qahtaba raiding the next year, year 162."
  es: "En al-Baladhuri — Muhammad ibn Sa'd me contó de al-Waqidi: Miguel salió del Darb al-Hadath con ochenta mil, llegó a Amq Mar'ash matando, quemando y tomando cautivos a los musulmanes, y llegó a la puerta de Mar'ash, donde estaba Isa ibn Ali —habiendo saqueado ese año— entonces los mawalis de Isa, la gente de la ciudad y sus guerreros salieron y le dispararon con flechas y dardos; fingió huir hasta que los hubo atraído fuera de la ciudad, luego se volvió contra ellos y mató a ocho de los mawalis de Isa, el resto se mantuvo firme en la ciudad que cerraron, tras lo cual los sitió y luego se retiró a Jayhan; La noticia llegó a oídos de Thumama ibn al-Walid al-Absi en Dayq —quien había sido puesto al mando de la expedición de verano de ese año, el año 161—, quien envió una numerosa caballería contra él que fue aniquilada salvo aquellos que escaparon, lo cual afligió tanto a al-Mahdi que se preparó para enviar a al-Hasan ibn Qahtaba a realizar incursiones al año siguiente, el año 162."
  fr: "Dans al-Baladhuri — Muhammad ibn Sa'd m'a dit d'après al-Waqidi: Michel sortit du Darb al-Hadath avec quatre-vingt mille hommes, atteignit Amq Mar'ash en tuant, brûlant et faisant des prisonniers parmi les musulmans, et arriva à la porte de Mar'ash, où se trouvait Isa ibn Ali — après avoir mené un raid cette année-là — alors les mawalis d'Isa, les habitants de la ville et leurs combattants sortirent et lui tirèrent dessus avec des flèches et des fléchettes; il feignit de fuir jusqu'à ce qu'il les ait attirés hors de la ville, puis se retourna contre eux et tua huit des mawalis d'Isa, les autres se retranchant dans la ville qu'ils avaient fermée, après quoi il les assiégea puis se retira à Jayhan; La nouvelle parvint à Thumama ibn al-Walid al-Absi à Dayq — ayant été placé à la tête de l'expédition d'été de cette année, l'an 161 — qui envoya une cavalerie dense contre lui qui fut détruite à l'exception de ceux qui s'échappèrent, ce qui affligea tellement al-Mahdi qu'il se prépara à envoyer al-Hasan ibn Qahtaba en raid l'année suivante, l'an 162."
