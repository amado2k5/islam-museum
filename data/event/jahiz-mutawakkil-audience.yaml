id: event/jahiz-mutawakkil-audience
class: event
kind: gathering
label:
  ar: "الجاحظ يُعرض على المتوكل مؤدباً فيصرفه"
  en: "al-Jahiz presented to al-Mutawakkil as tutor, then dismissed"
  ur: "جاحظ متوکل کے سامنے مؤدب کے طور پر پیش کیے گئے پھر واپس کر دیے گئے"
summary:
  ar: "في خلافة المتوكل (٢٣٢–٢٤٧هـ/٨٤٧–٨٦١م) ذُكر الجاحظ للخليفة ليؤدب بعض ولده، فلما رآه استبشع منظره، فأمر له بعشرة آلاف درهم وصرفه {cite:muruj-al-dhahab p. 486-487} {cite:wafayat-ayan p. 404}؛ ويروي الجاحظ نفسه مقابلة يزعم أنه أجراها مع المتوكل، الذي كان يريد أن يعهد إليه بتعليم أولاده ثم صرفه لقبح منظره {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  en: "In al-Mutawakkil's caliphate (232-247/847-861) al-Jahiz was mentioned to the caliph as a tutor for one of his sons; when the caliph saw him he was repelled by his looks, granted him ten thousand dirhams and dismissed him {cite:muruj-al-dhahab p. 486-487} {cite:wafayat-ayan p. 404}. Al-Jahiz himself records an interview he claims to have had with al-Mutawakkil, who was anxious to entrust him with the education of his children but finally dismissed him because of his ugliness {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  ur: "متوکل کے دور خلافت (232-247ھ/847-861ء) میں جاحظ کا نام خلیفہ کے سامنے ان کے ایک بیٹے کے مؤدب کے طور پر آیا؛ جب خلیفہ نے انہیں دیکھا تو ان کے منظر سے نفرت کی، دس ہزار درہم عنایت کر کے واپس کر دیا {cite:muruj-al-dhahab p. 486-487} {cite:wafayat-ayan p. 404}۔ جاحظ نے خود ایک ملاقات بیان کی ہے جس میں متوکل ان سے بچوں کی تعلیم سپرد کرنا چاہتا تھا مگر آخر میں بدصورتی کے سبب انہیں واپس کر دیا {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
