id: event/jahiz-mutawakkil-audience
class: event
kind: gathering
label:
  ar: "الجاحظ يُعرض على المتوكل مؤدباً فيصرفه"
  en: "al-Jahiz presented to al-Mutawakkil as tutor, then dismissed"
  ur: "جاحظ متوکل کے سامنے مؤدب کے طور پر پیش کیے گئے پھر واپس کر دیے گئے"
  es: "Al-Jahiz se presentó ante al-Mutawakkil como tutor, y luego fue destituido."
  fr: "al-Jahiz fut présenté à al-Mutawakkil comme tuteur, puis renvoyé."
  tr: "El-Cahiz, El-Mutavakkil'e öğretmen olarak tanıtıldı, ancak El-Mutavakkil onu reddetti."
  id: "Al-Jahiz diperkenalkan kepada Al-Mutawakkil sebagai guru, tetapi beliau memecatnya."
summary:
  ar: "في خلافة المتوكل ⁦(٢٣٢–٢٤٧هـ/٨٤٧–٨٦١م)⁩ ذُكر الجاحظ للخليفة ليؤدب بعض ولده، فلما رآه استبشع منظره، فأمر له بعشرة آلاف درهم وصرفه {cite:muruj-al-dhahab p. 486-487} {cite:wafayat-ayan p. 404}؛ ويروي الجاحظ نفسه مقابلة يزعم أنه أجراها مع المتوكل، الذي كان يريد أن يعهد إليه بتعليم أولاده ثم صرفه لقبح منظره {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  en: "In al-Mutawakkil's caliphate (232-247/847-861) al-Jahiz was mentioned to the caliph as a tutor for one of his sons; when the caliph saw him he was repelled by his looks, granted him ten thousand dirhams and dismissed him {cite:muruj-al-dhahab p. 486-487} {cite:wafayat-ayan p. 404}. Al-Jahiz himself records an interview he claims to have had with al-Mutawakkil, who was anxious to entrust him with the education of his children but finally dismissed him because of his ugliness {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  ur: "متوکل کے دور خلافت ⁦(232-247ھ/847-861ء)⁩ میں جاحظ کا نام خلیفہ کے سامنے ان کے ایک بیٹے کے مؤدب کے طور پر آیا؛ جب خلیفہ نے انہیں دیکھا تو ان کے منظر سے نفرت کی، دس ہزار درہم عنایت کر کے واپس کر دیا {cite:muruj-al-dhahab p. 486-487} {cite:wafayat-ayan p. 404}۔ جاحظ نے خود ایک ملاقات بیان کی ہے جس میں متوکل ان سے بچوں کی تعلیم سپرد کرنا چاہتا تھا مگر آخر میں بدصورتی کے سبب انہیں واپس کر دیا {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  es: "Durante el califato de al-Mutawakkil (232-247/847-861), se mencionó a al-Jahiz ante el califa como tutor de uno de sus hijos; al verlo, el califa se sintió repelido por su aspecto, le otorgó diez mil dirhams y lo despidió {cite:muruj-al-dhahab p. 486-487} {cite:wafayat-ayan p. 404}. El propio Al-Jahiz registra una entrevista que afirma haber tenido con al-Mutawakkil, quien estaba ansioso por confiarle la educación de sus hijos, pero finalmente lo despidió debido a su fealdad {cite:encyclopaedia-of-islam-2 vol. 2 p. 385}."
  fr: "Sous le califat d'al-Mutawakkil (232-247/847-861), al-Jahiz fut mentionné au calife comme précepteur pour l'un de ses fils. À sa vue, le calife fut rebuté par son apparence, lui accorda dix mille dirhams et le congédia (voir Muruj-al-Dhahab, p. 486-487; Wafayat-Ayan, p. 404). Al-Jahiz lui-même relate une entrevue qu'il affirme avoir eue avec al-Mutawakkil, qui souhaitait lui confier l'éducation de ses enfants mais le congédia finalement en raison de sa laideur (Encyclopaedia of Islam, vol. 2, p. 385)."
  tr: "Al-Mutawakkil'in halifeliği döneminde (232–247 Hicri/847–861 Miladi), Al-Jahiz, halifenin oğullarından bazılarına öğretmenlik yapması için kendisine önerilmişti. Onu görünce görünüşünden tiksindi ve ona on bin dirhem verilmesini emrederek onu görevden aldı. {kaynak: Muruj-al-dhahab s. 486-487} {kaynak: Wafayat-ayan s. 404}. Al-Jahiz'in kendisi de Al-Mutawakkil ile yaptığı iddia edilen bir görüşmeyi anlatır; Al-Mutawakkil ona oğullarına öğretmenlik yapmasını emanet etmek istemiş, ancak çirkin görünüşü nedeniyle onu görevden almıştır. {kaynak: Encyclopaedia-of-islam-2 cilt 2 s. 385}"
  id: "Pada masa kekhalifahan Al-Mutawakkil (232–247 H/847–861 M), Al-Jahiz disebutkan kepada khalifah untuk mengajar beberapa putranya. Ketika khalifah melihatnya, beliau merasa jijik dengan penampilannya, sehingga beliau memerintahkan agar Al-Jahiz diberi sepuluh ribu dirham dan memecatnya {cite:muruj-al-dhahab hlm. 486-487} {cite:wafayat-ayan hlm. 404}. Al-Jahiz sendiri menceritakan sebuah wawancara yang menurutnya telah dilakukannya dengan Al-Mutawakkil, yang ingin mempercayakan Al-Jahiz untuk mengajar putra-putranya, kemudian memecatnya karena penampilannya yang buruk {cite:encyclopaedia-of-islam-2 vol. 2 hlm. 385}."
