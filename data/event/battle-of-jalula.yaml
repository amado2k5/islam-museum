id: event/battle-of-jalula
class: event
kind: battle
label: { ar: "فتح جلولاء" }
summary:
  ar: "بعد نزول سعد بن أبي وقاص المدائن أتمّ المسلمون فتح جلولاء وتكريت والمتوصّل، ثم تحول الناس إلى الكوفة {cite:tabari-tarikh-abu-al-fadl j.4 p.21}. وذكر أبو معشر والواقدي أن فتح جلولاء كان سنة تسع عشرة على يد سعد {cite:tabari-tarikh-abu-al-fadl j.4 p.102}. وعند البلاذري: مكث المسلمون بالمدائن أياماً ثم بلغهم أن يزدجرد قد جمع جمعاً عظيماً ووجّهه إليهم وأن الجمع بجلولاء فسرّح سعد بن أبي وقاص هاشم بن عتبة بن أبي وقاص إليهم في اثني عشر ألفاً فوجدوا الأعاجم قد تحصنوا وخندقوا وجعلوا عيالهم وأثقالهم بخانقين وتعاهدوا أن لا يفروا وجعلت الإمداد تقدم عليهم من حلوان والجبال فقال المسلمون ينبغي أن نعاجلهم قبل أن تكثر إمدادهم فلقوهم وحجر بن عدي الكندي على الميمنة وعمرو بن معدي كرب على الخيل وطليحة بن خويلد على الرجال وعلى الأعاجم يومئذ خرزاد أخو رستم فاقتتلوا قتالاً شديداً لم يقتتلوا مثله رمياً بالنبل وطعناً بالرماح حتى تقصف وتجالدوا بالسيوف حتى انثنت ثم إن المسلمين حملوا حملة واحدة قلعوا بها الأعاجم عن موقفهم وهزموهم فولّوا هاربين وركب المسلمون أكتافهم يقتلونهم قتلاً ذريعاً حتى حال الظلام بينهم ثم انصرفوا إلى معسكرهم وجعل هاشم بن عتبة جرير بن عبد الله بجلولاء في خيل كثيفة ليكون بين المسلمين وبين عدوهم فارتحل يزدجرد من حلوان وأقبل المسلمون يغيرون في نواحي السواد من جانب دجلة الشرقي فأتوا مهروذ فصالح دهقانها هاشماً على جريب من دراهم على أن لا يقتل أحداً منهم وقتل دهقان الدسكرة وذلك أنه اتهمه بغش للمسلمين وأتى البندنيجين فطلب أهله الأمان على أداء الجزية والخراج فأمنهم وأتى جرير بن عبد الله خانقين وبها بقية من الأعاجم فقتلهم ولم يبق من سواد دجلة ناحية إلا غلب عليها المسلمون وصارت في أيديهم وقال هشام بن الكلبي كان على الناس يوم جلولاء من قبل سعد عمرو بن عتبة بن نوفل بن أهيب بن عبد مناف بن زهرة وأمه عاتكة بنت أبي وقاص وانصرف سعد بعد جلولاء إلى المدائن فصيّر بها جمعاً ثم مضى إلى ناحية أخرى وكانت وقعة جلولاء في آخر سنة ست عشرة."
