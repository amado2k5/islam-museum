id: event/battle-of-jalula
class: event
kind: battle
label: { ar: "فتح جلولاء", en: "Conquest of Jalula", fr: "La conquête de Jalula", es: "Conquista de Jalula", ur: "جلولا کی فتح", tr: "Jalula'nın Fethi", id: "Penaklukan Jalula" }
summary:
  ar: "بعد نزول سعد بن أبي وقاص المدائن أتمّ المسلمون فتح جلولاء وتكريت والمتوصّل، ثم تحول الناس إلى الكوفة {cite:tabari-tarikh-abu-al-fadl j.4 p.21}. وذكر أبو معشر والواقدي أن فتح جلولاء كان سنة تسع عشرة على يد سعد {cite:tabari-tarikh-abu-al-fadl j.4 p.102}. وعند البلاذري: مكث المسلمون بالمدائن أياماً ثم بلغهم أن يزدجرد قد جمع جمعاً عظيماً ووجّهه إليهم وأن الجمع بجلولاء فسرّح سعد بن أبي وقاص هاشم بن عتبة بن أبي وقاص إليهم في اثني عشر ألفاً فوجدوا الأعاجم قد تحصنوا وخندقوا وجعلوا عيالهم وأثقالهم بخانقين وتعاهدوا أن لا يفروا وجعلت الإمداد تقدم عليهم من حلوان والجبال فقال المسلمون ينبغي أن نعاجلهم قبل أن تكثر إمدادهم فلقوهم وحجر بن عدي الكندي على الميمنة وعمرو بن معدي كرب على الخيل وطليحة بن خويلد على الرجال وعلى الأعاجم يومئذ خرزاد أخو رستم فاقتتلوا قتالاً شديداً لم يقتتلوا مثله رمياً بالنبل وطعناً بالرماح حتى تقصف وتجالدوا بالسيوف حتى انثنت ثم إن المسلمين حملوا حملة واحدة قلعوا بها الأعاجم عن موقفهم وهزموهم فولّوا هاربين وركب المسلمون أكتافهم يقتلونهم قتلاً ذريعاً حتى حال الظلام بينهم ثم انصرفوا إلى معسكرهم وجعل هاشم بن عتبة جرير بن عبد الله بجلولاء في خيل كثيفة ليكون بين المسلمين وبين عدوهم فارتحل يزدجرد من حلوان وأقبل المسلمون يغيرون في نواحي السواد من جانب دجلة الشرقي فأتوا مهروذ فصالح دهقانها هاشماً على جريب من دراهم على أن لا يقتل أحداً منهم وقتل دهقان الدسكرة وذلك أنه اتهمه بغش للمسلمين وأتى البندنيجين فطلب أهله الأمان على أداء الجزية والخراج فأمنهم وأتى جرير بن عبد الله خانقين وبها بقية من الأعاجم فقتلهم ولم يبق من سواد دجلة ناحية إلا غلب عليها المسلمون وصارت في أيديهم وقال هشام بن الكلبي كان على الناس يوم جلولاء من قبل سعد عمرو بن عتبة بن نوفل بن أهيب بن عبد مناف بن زهرة وأمه عاتكة بنت أبي وقاص وانصرف سعد بعد جلولاء إلى المدائن فصيّر بها جمعاً ثم مضى إلى ناحية أخرى وكانت وقعة جلولاء في آخر سنة ست عشرة."
  en: "After Sa'd ibn Abi Waqqas settled at al-Mada'in, the Muslims completed the conquest of Jalula, Tikrit and al-Mutawassil, and then the people moved to Kufa {cite:tabari-tarikh-abu-al-fadl j.4 p.21}. Abu Ma'shar and al-Waqidi say that the conquest of Jalula took place in 19 AH at the hands of Sa'd {cite:tabari-tarikh-abu-al-fadl j.4 p.102}. In al-Baladhuri's account, the Muslims stayed at al-Mada'in for some days; then news reached them that Yazdgird had gathered a great host and sent it against them, and that the host was at Jalula. Sa'd sent Hashim ibn Utba ibn Abi Waqqas against them with twelve thousand men. They found the non-Arabs (a'ajim) entrenched and had dug a trench; they had left their families and baggage at Khanaqin and had sworn not to flee, and reinforcements kept coming to them from Hulwan and the mountains. The Muslims said they should attack before their reinforcements grew, and they met them: Hujr ibn Adi al-Kindi commanded the right wing, Amr ibn Ma'di Karib the cavalry, and Tulayha ibn Khuwaylid the infantry, while the non-Arab commander that day was Kharzad, brother of Rustam. They fought a fierce battle of arrows and spears, until the spears were splintered and the swords were bent. Then the Muslims charged in one charge that dislodged the non-Arabs from their position and routed them; they fled, and the Muslims pursued them, killing them mercilessly until darkness came between them, and then they returned to their camp. Hashim ibn Utba sent Jarir ibn Abd Allah to Jalula with a dense force of cavalry to stand between the Muslims and their enemy. Yazdgird departed from Hulwan, and the Muslims began raiding the districts of al-Sawad on the eastern bank of the Tigris. They came to Mihrudh, whose headman made peace with Hashim for a payment in dirhams per jarib, on condition that no one would be killed; the headman of al-Daskara was killed, because he had been accused of deceiving the Muslims. They came to Bandanijin, where the people asked for safe conduct in return for paying the poll tax and land tax, and he granted it. Jarir ibn Abd Allah came to Khanaqin, where a remnant of the non-Arabs was, and killed them. No district of al-Sawad on the Tigris remained that the Muslims did not overcome and take. Hisham ibn al-Kalbi said that on the day of Jalula, the commander of the people on behalf of Sa'd was Amr ibn Utba ibn Nawfal ibn Uhayb ibn Abd Manaf ibn Zuhra, whose mother was Atika, daughter of Abi Waqqas. After Jalula, Sa'd returned to al-Mada'in, left a force there, then went on to another region. The battle of Jalula took place at the end of 16 AH."
  fr: "Après que Sa'd ibn Abi Waqqas se fut établi à al-Mada'in, les musulmans achevèrent la conquête de Jalula, de Tikrit et d'al-Mutawassil, puis les gens se transportèrent à Koufa {cite:tabari-tarikh-abu-al-fadl j.4 p.21}. Abu Ma'shar et al-Waqidi disent que la conquête de Jalula eut lieu en 19 H, des mains de Sa'd {cite:tabari-tarikh-abu-al-fadl j.4 p.102}. Dans le récit d'al-Baladhuri, les musulmans restèrent quelques jours à al-Mada'in ; puis leur parvint la nouvelle que Yazdgird avait rassemblé une grande armée et l'avait envoyée contre eux, et que cette armée se trouvait à Jalula. Sa'd envoya contre eux Hashim ibn Utba ibn Abi Waqqas avec douze mille hommes. Ils trouvèrent les non-Arabes (a'ajim) retranchés derrière un fossé qu'ils avaient creusé ; ils avaient laissé leurs familles et leurs bagages à Khanaqin et avaient juré de ne pas fuir, et des renforts leur arrivaient sans cesse de Hulwan et des montagnes. Les musulmans dirent qu'il fallait attaquer avant que leurs renforts ne grossissent, et ils les affrontèrent : Hujr ibn Adi al-Kindi commandait l'aile droite, Amr ibn Ma'di Karib la cavalerie et Tulayha ibn Khuwaylid l'infanterie, tandis que le commandant des non-Arabes ce jour-là était Kharzad, frère de Rustam. Ils livrèrent un combat acharné de flèches et de lances, jusqu'à ce que les lances fussent brisées et les épées tordues. Puis les musulmans chargèrent d'un seul élan, délogèrent les non-Arabes de leur position et les mirent en déroute ; ceux-ci s'enfuirent, et les musulmans les poursuivirent, les tuant sans merci jusqu'à ce que l'obscurité les sépare, puis revinrent à leur camp. Hashim ibn Utba envoya Jarir ibn Abd Allah à Jalula avec une épaisse troupe de cavaliers pour se tenir entre les musulmans et leur ennemi. Yazdgird quitta Hulwan, et les musulmans commencèrent à razzier les districts du Sawad sur la rive orientale du Tigre. Ils vinrent à Mihrudh, dont le chef fit la paix avec Hashim moyennant un paiement en dirhams par jarib, à condition que personne ne fût tué ; le chef d'al-Daskara fut tué, parce qu'on l'accusait d'avoir trompé les musulmans. Ils vinrent à Bandanijin, dont les habitants demandèrent la sauvegarde en échange du paiement de la capitation et de l'impôt foncier, et il la leur accorda. Jarir ibn Abd Allah vint à Khanaqin, où se trouvait un reste des non-Arabes, et les tua. Il ne resta aucun district du Sawad sur le Tigre que les musulmans n'eussent soumis et pris. Hisham ibn al-Kalbi dit que, le jour de Jalula, le commandant des gens au nom de Sa'd était Amr ibn Utba ibn Nawfal ibn Uhayb ibn Abd Manaf ibn Zuhra, dont la mère était Atika, fille d'Abi Waqqas. Après Jalula, Sa'd revint à al-Mada'in, y laissa une troupe, puis partit vers une autre région. La bataille de Jalula eut lieu à la fin de l'an 16 H."
  es: "Después de que Sa'd ibn Abi Waqqas se estableciera en al-Mada'in, los musulmanes completaron la conquista de Jalula, Tikrit y al-Mutawassil, y luego la gente se trasladó a Kufa {cite:tabari-tarikh-abu-al-fadl j.4 p.21}. Abu Ma'shar y al-Waqidi dicen que la conquista de Jalula tuvo lugar en el año 19 AH a manos de Sa'd {cite:tabari-tarikh-abu-al-fadl j.4 p.102}. En el relato de al-Baladhuri, los musulmanes permanecieron en al-Mada'in durante algunos días; luego les llegó la noticia de que Yazdgird había reunido un gran ejército y lo había enviado contra ellos, y que el ejército estaba en Jalula. Sa'd envió a Hashim ibn Utba ibn Abi Waqqas contra ellos con doce mil hombres. Encontraron a los no árabes (a'ajim) atrincherados y habían cavado una trinchera; habían dejado a sus familias y equipaje en Khanaqin y habían jurado no huir, y seguían llegando refuerzos desde Hulwan y las montañas. Los musulmanes dijeron que debían atacar antes de que llegaran los refuerzos, y los enfrentaron: Hujr ibn Adi al-Kindi comandaba el flanco derecho, Amr ibn Ma'di Karib la caballería y Tulayha ibn Khuwaylid la infantería, mientras que el comandante no árabe ese día era Kharzad, hermano de Rustam. Libraron una feroz batalla de flechas y lanzas, hasta que las lanzas se astillaron y las espadas se doblaron. Entonces los musulmanes cargaron en una sola embestida que desalojó a los no árabes de su posición y los puso en fuga; huyeron, y los musulmanes los persiguieron, matándolos sin piedad hasta que la oscuridad los separó, y entonces regresaron a su campamento. Hashim ibn Utba envió a Jarir ibn Abd Allah a Jalula con una numerosa caballería para interponerse entre los musulmanes y su enemigo. Yazdgird partió de Hulwan, y los musulmanes comenzaron a saquear los distritos de al-Sawad en la orilla oriental del Tigris. Llegaron a Mihrudh, cuyo jefe hizo las paces con Hashim a cambio de un pago en dirhams por jarib, con la condición de que nadie muriera; el jefe de al-Daskara fue asesinado, ya que había sido acusado de engañar a los musulmanes. Llegaron a Bandanijin, donde la gente pidió salvoconducto a cambio del pago del impuesto per cápita y el impuesto sobre la tierra, y él se lo concedió. Jarir ibn Abd Allah llegó a Khanaqin, donde se encontraba un remanente de no árabes, y los masacró. No quedó ningún distrito de al-Sawad en el Tigris que los musulmanes no conquistaran. Hisham ibn al-Kalbi relató que el día de Jalula, el comandante de las tropas de Sa'd era Amr ibn Utba ibn Nawfal ibn Uhayb ibn Abd Manaf ibn Zuhra, cuya madre era Atika, hija de Abi Waqqas. Tras Jalula, Sa'd regresó a al-Mada'in, dejó allí un contingente militar y luego se dirigió a otra región. La batalla de Jalula tuvo lugar a finales del año 16 de la Hégira."
  ur: "سعد ابن ابی وقاص کے مدین میں آباد ہونے کے بعد، مسلمانوں نے جلولا، تکریت اور المتوسل کی فتح مکمل کی، اور پھر لوگ کوفہ چلے گئے۔ ابو معشر اور الواقدی کہتے ہیں کہ جلولہ کی فتح سعد کے ہاتھوں 19 ہجری میں ہوئی تھی۔ البلادھوری کے بیان میں، مسلمان کچھ دن المدائن میں رہے؛ پھر ان کو خبر پہنچی کہ یزدگرد نے ایک بڑا لشکر جمع کر کے ان کے خلاف بھیج دیا ہے اور یہ میزبان جلولا میں ہے۔ سعد نے ہاشم بن عتبہ بن ابی وقاص کو بارہ ہزار آدمیوں کے ساتھ ان کے خلاف بھیجا۔ انہوں نے غیر عرب ⁦(عجم)⁩ کو خندق کھود کر پایا۔ وہ خانقین میں اپنے اہل و عیال اور سامان چھوڑ آئے تھے اور نہ بھاگنے کی قسم کھائی تھی اور ہلوان اور پہاڑوں سے ان کے پاس کمک آتی رہی۔ مسلمانوں نے کہا کہ وہ اپنی کمک بڑھنے سے پہلے حملہ کریں، اور وہ ان سے ملے: حجر بن عدی الکندی نے دائیں بازو کی کمان کی، عمرو بن معدی کریب نے گھڑسوار فوج کی، اور طلیحہ بن خویلد نے پیادہ فوج کی، جب کہ اس دن غیر عرب کمانڈر رستم کا بھائی خرزاد تھا۔ انہوں نے تیروں اور نیزوں کی زبردست لڑائی لڑی، یہاں تک کہ نیزے بکھر گئے اور تلواریں جھک گئیں۔ پھر مسلمانوں نے ایک الزام لگایا جس نے غیر عربوں کو ان کے مقام سے ہٹا دیا اور انہیں شکست دی۔ وہ بھاگ گئے، اور مسلمانوں نے ان کا تعاقب کیا، انہیں بے دردی سے قتل کیا یہاں تک کہ ان کے درمیان اندھیرا چھا گیا، اور پھر وہ اپنے کیمپ میں واپس آگئے۔ ہاشم بن عتبہ نے جریر بن عبد اللہ کو گھڑ سوار فوج کے ساتھ جلولا کی طرف بھیجا تاکہ مسلمانوں اور ان کے دشمنوں کے درمیان کھڑا ہو جائے۔ یزدگرد حلوان سے روانہ ہوا اور مسلمانوں نے دجلہ کے مشرقی کنارے پر واقع السواد کے اضلاع پر چھاپہ مارنا شروع کردیا۔ وہ مہرود کے پاس آئے، جس کے سربراہ نے ہاشم سے درہم فی جریب کے حساب سے صلح کی، اس شرط پر کہ کسی کو قتل نہیں کیا جائے گا۔ الدسکارا کا سربراہ مارا گیا، کیونکہ اس پر مسلمانوں کو دھوکہ دینے کا الزام تھا۔ وہ بندانیجن آئے، جہاں لوگوں نے پول ٹیکس اور لینڈ ٹیکس کی ادائیگی کے بدلے محفوظ طرز عمل کا مطالبہ کیا، اور اس نے اسے منظور کر لیا۔ جریر بن عبد اللہ خانقین پہنچے، جہاں غیر عربوں کا ایک بچا ہوا تھا، اور انہیں قتل کر دیا۔ دجلہ پر السواد کا کوئی ضلع ایسا نہیں رہا جس پر مسلمانوں نے غلبہ حاصل نہ کیا ہو۔ ہشام بن کلبی کہتے ہیں کہ جلیلہ کے دن سعد کی طرف سے لوگوں کے سردار عمرو بن عتبہ بن نوفل بن اہیب بن عبد مناف بن زہرہ تھے جن کی والدہ عتیقہ تھیں جو ابی وقاص کی بیٹی تھیں۔ جلولا کے بعد سعد مدین کی طرف لوٹے، وہاں ایک فوج چھوڑ دی، پھر دوسرے علاقے میں چلے گئے۔ غزوہ جلوہ 16 ہجری کے آخر میں ہوا۔"
  tr: "Sa'd ibn Abi Waqqas'ın Medain'e varmasının ardından Müslümanlar Celula, Tikrit ve Mutevassil'in fethini tamamladılar ve ardından halk Kufa'ya taşındı. {Kaynak: Tabari-tarikh-abu-al-fadl, cilt 4, s. 21}. Ebu Ma'şar ve el-Vakidi, Celula'nın fethinin on dokuzuncu yılda Sa'd'ın eliyle gerçekleştiğini belirtmişlerdir. {Kaynak: Tabari-tarikh-abu-al-fadl, cilt 4, s. 102}. El-Baladhuri'ye göre: Müslümanlar birkaç gün Medain'de kaldılar, ardından Yazdegerd'in büyük bir ordu topladığı ve onlara karşı gönderdiği, ordunun Celula'da olduğu haberi onlara ulaştı. Bunun üzerine Sa'd ibn Abi Waqqas, Haşim ibn Utbah ibn Abi Waqqas'ı on iki bin adamla gönderdi. Perslerin kendilerini tahkim ettiklerini, siperler kazdıklarını ve ailelerini ve eşyalarını Hanıkin'e yerleştirdiklerini gördüler. Kaçmayacaklarına yemin ettiler ve Hulvan'dan ve dağlardan takviye birlikleri gelmeye başladı. Müslümanlar, \"Takviye birlikleri artmadan önce onlara saldırmalıyız\" dediler. Böylece, sağ kanatta Hucer ibn Adi el-Kindi, süvarilerin başında Amr ibn Ma'di Kerb ve piyadelerin başında Tulayha ibn Huveylid ile karşılaştılar. O gün Perslerin başında Rüştam'ın kardeşi Hurzad vardı. Okların ve mızrakların kırılana kadar uçuştuğu, kılıçların bükülene kadar çarpıştığı, daha önce hiç görmedikleri kadar şiddetli bir savaş verdiler. Sonra Müslümanlar tek bir saldırı başlattılar, Persleri mevzilerinden söküp bozguna uğrattılar. Persler dönüp kaçtılar ve Müslümanlar onları acımasızca kovalayarak aralarına karanlık çökene kadar öldürdüler, sonra kamplarına geri döndüler. Haşim bin Utbe, Müslümanlar ile düşmanları arasına girmek üzere Cerir bin Abdullah'ı büyük bir süvari birliğiyle Celula'ya yerleştirdi. Yazdegerd, Hulvan'dan ayrıldı ve Müslümanlar Dicle'nin doğu yakasındaki Sawad bölgelerine baskınlar düzenlemeye başladılar. Mahrudh'a geldiler ve oradaki dehaqan, Haşim ile bir jarib dirhem karşılığında, onlardan hiçbirini öldürmeyeceği şartıyla barış yaptı. Ancak, Müslümanları aldatmakla suçladığı Daskara dehaqanını öldürdü. Bandanijin'e geldi ve halkı cizye ve haraç ödemeleri karşılığında güvenlik istedi, bu yüzden onlara güvenlik sağladı. Cerir bin Abdullah, bazı gayri Arapların bulunduğu Hanıkin'e geldi ve onları öldürdü. Dicle Sawad'ının Müslümanların fethetmediği ve ellerinde kalmadığı hiçbir bölgesi yoktu. Hişam bin el-Kalbi şöyle dedi: Celula günü, Saad adına halkın başında Amr bin Utbe bin Nevfel bin Uhayb bin Abd Manaf bin Zuhra vardı ve annesi Atika bint Ebu Vakkas idi. Saad, Celula'dan sonra Medine'ye döndü, orada bir birlik konuşlandırdı, sonra başka bir bölgeye gitti. Celula Muharebesi on altıncı yılın sonunda gerçekleşti."
  id: "Setelah Sa'd ibn Abi Waqqas tiba di Madain, kaum Muslim menyelesaikan penaklukan Jalula, Tikrit, dan al-Mutawassil, kemudian penduduk pindah ke Kufa. {cite:tabari-tarikh-abu-al-fadl j.4 p.21}. Abu Ma'shar dan al-Waqidi menyebutkan bahwa penaklukan Jalula terjadi pada tahun kesembilan belas di tangan Sa'd. {cite:tabari-tarikh-abu-al-fadl j.4 p.102}. Menurut al-Baladhuri: Kaum Muslim tinggal di al-Mada'in selama beberapa hari, kemudian sampai kepada mereka kabar bahwa Yazdegerd telah mengumpulkan pasukan besar dan mengirimkannya melawan mereka, dan bahwa pasukan tersebut berada di Jalula. Maka Sa'd ibn Abi Waqqas mengirimkan Hashim ibn Utbah ibn Abi Waqqas dengan dua belas ribu orang. Mereka mendapati bahwa pasukan Persia telah membentengi diri dan menggali parit, serta menempatkan keluarga dan barang bawaan mereka di Khaniqin. Mereka bersumpah untuk tidak melarikan diri, dan bala bantuan mulai berdatangan dari Hulwan dan pegunungan. Kaum Muslim berkata, \"Kita harus menyerang mereka sebelum bala bantuan mereka bertambah.\" Maka mereka menghadapi mereka, dengan Hujr ibn Adi al-Kindi di sayap kanan, Amr ibn Ma'di Karb memimpin kavaleri, dan Tulayha ibn Khuwaylid memimpin infanteri. Khurzad, saudara Rustam, memimpin pasukan Persia hari itu. Mereka bertempur dengan sengit, pertempuran yang belum pernah mereka lihat sebelumnya, dengan panah dan tombak berterbangan hingga patah, dan pedang berbenturan hingga bengkok. Kemudian kaum Muslim melancarkan serangan tunggal, mencabut pasukan Persia dari posisi mereka dan mengalahkan mereka. Mereka berbalik dan melarikan diri, dan kaum Muslim mengejar mereka, membunuh mereka tanpa ampun hingga kegelapan menyelimuti mereka, lalu mereka kembali ke perkemahan mereka. Hashim bin Utbah menempatkan Jarir bin Abdullah di Jalula dengan pasukan kavaleri yang besar untuk berada di antara kaum Muslim dan musuh mereka. Yazdegerd berangkat dari Hulwan, dan kaum Muslim mulai menyerang daerah-daerah Sawad di sisi timur Sungai Tigris. Mereka sampai di Mahrudh, dan dehaqan di sana berdamai dengan Hashim dengan imbalan satu jarib dirham dengan syarat dia tidak akan membunuh siapa pun dari mereka. Dia membunuh dehaqan Daskara karena menuduhnya menipu kaum Muslim. Dia sampai di Bandanijin, dan rakyatnya meminta perlindungan dengan imbalan membayar jizya dan kharaj, sehingga dia mengabulkan permintaan mereka. Jarir bin Abdullah sampai di Khaniqin, tempat beberapa orang non-Arab tinggal, dan dia membunuh mereka. Tidak ada daerah di Sawad Sungai Tigris yang tidak ditaklukkan dan tidak berada di tangan kaum Muslim. Hisham bin Al-Kalbi berkata: Pada hari Jalula, orang yang bertanggung jawab atas orang-orang atas nama Saad adalah Amr bin Utbah bin Nawfal bin Uhayb bin Abd Manaf bin Zuhra, dan ibunya adalah Atika bint Abi Waqqas. Saad kembali setelah Jalula ke Al-Madain, di mana ia menempatkan sekelompok pasukan, kemudian ia pergi ke daerah lain. Perang Jalula terjadi pada akhir tahun keenam belas."
