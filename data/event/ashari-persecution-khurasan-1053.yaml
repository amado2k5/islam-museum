id: event/ashari-persecution-khurasan-1053
class: event
kind: persecution
label: { ar: "إلزام لعن الرافضة والأشعرية على منابر خراسان", en: "Enforced cursing of the Rafida and the Ash'aris from the pulpits of Khurasan", fr: "La malédiction imposée des Rafida et des ash'arites depuis les chaires du Khorasan", es: "Maldición forzada de los Rafida y los Ash'aris desde los púlpitos de Jorasán.", ur: "خراسان کے منبروں سے رافضی اور اشعری کی لعنت", tr: "Horasan minberlerinden Rafidileri ve Eş'arileri lanetleme yükümlülüğü", id: "Kewajiban untuk mengutuk kaum Rafidiyah dan Asy'ariyah dari mimbar-mimbar Khorasan." }
summary:
  ar: "خاطب الوزير عميد الملك الكندري السلطان ألب أرسلان في لعن الرافضة على منابر خراسان فأذن له فأمر بلعنهم وأضاف إليهم الأشعرية، فأنف من ذلك أئمة خراسان منهم أبو القاسم القشيري وإمام الحرمين الجويني وغيرهما ففارقوا خراسان وأقام الجويني بمكة أربع سنين فقيل له إمام الحرمين، فلما جاءت الدولة النظامية أحضر نظام الملك من انتزح منهم وأكرمهم {cite:shadharat-dhahab p. 310}. ويوثق ابن الجوزي إعلان اللعن بنيسابور سنة 445هـ فيلقيه على عهد طغرلبك، ويذكر أن أبا القاسم القشيري نفض من ذلك وعمل رسالة سماها «شكاية أهل السنة وما نالهم من المحنة» قال فيها «أيُلعن إمام الدين ومحيي السنة؟»، وأنه رُفع إلى السلطان من مقالات الأشعري شيء فقال أصحاب الأشعري هذا محال وليس بمذهبه، فقال السلطان «إنما يُلعن الأشعري الذي قال هذه المقالات فإن لم يدينوا بها ولم يقل الأشعري شيئاً منها فلا عليكم ما يقول» {cite:muntazam-ibn-al-jawzi j.8 p.107-108}."
  en: "Al-Kunduri's minbar licence from Alp Arslan to curse the Rafida — extended to the Ash'aris — exiled Khurasan's imams; al-Juwayni's four Meccan years earned him 'Imam al-Haramayn', and Nizam al-Mulk's accession restored the exiles in honour {cite:shadharat-dhahab p. 310}."
  fr: "L'autorisation de chaire qu'al-Kunduri obtint d'Alp Arslan pour maudire les Rafida, étendue aux ash'arites, exila les imams du Khorasan ; les quatre années mecquoises d'al-Juwayni lui valurent le nom d'« Imam al-Haramayn », et l'avènement de Nizam al-Mulk rétablit les exilés avec honneur {cite:shadharat-dhahab p. 310}."
  es: "La licencia de minbar de Al-Kunduri otorgada por Alp Arslan para maldecir a Rafida (extendida a los Ash'aris) exilió a los imanes de Khurasan; Los cuatro años de al-Juwayni en La Meca le valieron el nombre de 'Imam al-Haramayn', y el ascenso de Nizam al-Mulk restauró el honor de los exiliados {cita: shadharat-dhahab p. 310}."
  ur: "الپ ارسلان کی طرف سے الکندوری کا منبر لائسنس رافدہ پر لعنت بھیجنے کے لیے — اشعریوں تک پھیلا ہوا — خراسان کے اماموں کو جلاوطن کر دیا گیا۔ الجوینی کے چار مکی سالوں نے انہیں 'امام الحرمین' سے نوازا، اور نظام الملک کے الحاق نے جلاوطنوں کو عزت کے ساتھ بحال کیا۔ 310}۔"
  tr: "Kralın baş veziri El-Kundari, Sultan Alp Arslan'a Horasan minberlerinde Rafidileri lanetleme konusunda başvurdu; Sultan da ona izin verdi ve Rafidileri lanetlemeyi emretti, hatta Eş'arileri de onlara ekledi. Bu durum, Ebu el-Kâsim el-Kuşeyri, İmam el-Haramayn el-Cüveyni ve diğerleri de dahil olmak üzere Horasan imamlarını gücendirdi ve Horasan'ı terk ettiler. El-Cüveyni dört yıl Mekke'de kaldı ve bu yüzden İmam el-Haramayn olarak anıldı. Nizamiye devleti geldiğinde, Nizam el-Mulk onları terk edenleri geri getirdi ve onlara saygı gösterdi. {kaynak: Şadharat-dhahab s. 310} İbn el-Cevzi, Hicri 445 yılında Nişapur'da, Tuğrul Bey döneminde okuduğu lanetin ilanını belgeliyor. Ebu el-Kâsim el-Kuşeyri'nin bundan sarsıldığını ve \"Sünnet Ehlinin Şikayeti ve Sıkıntıdan Başlarına Gelenler\" adlı bir mektup yazdığını, bu mektupta \"Dinin İmamı ve Sünnetin dirilticisi lanetlenmiş midir?\" diye sorduğunu belirtiyor. Ayrıca, Sultan'a el-Eş'ari'nin sözlerinden bir şey getirildiğini ve el-Eş'ari'nin takipçilerinin \"Bu imkansızdır ve onun öğretisi değildir\" dediklerini de aktarıyor. Bunun üzerine Sultan, \"Sadece bu sözleri söyleyen el-Eş'ari lanetlenmiştir. Eğer onlar bunlara inanmıyorlarsa ve el-Eş'ari bunlardan hiçbir şey söylemediyse, o zaman onun söylediklerinden siz sorumlu değilsiniz\" dedi. {alıntı:muntazam-ibn-al-jawzi c.8 s.107-108}."
  id: "Menteri, kepala raja, Al-Kundari, berbicara kepada Sultan Alp Arslan tentang mengutuk kaum Rafidiyah di mimbar-mimbar Khorasan, sehingga Sultan memberinya izin dan memerintahkan agar mereka dikutuk dan menambahkan kaum Asy'ariyah ke dalam daftar tersebut. Para imam Khorasan merasa tersinggung dengan hal ini, termasuk Abu al-Qasim al-Qushayri, Imam al-Haramayn al-Juwayni, dan lainnya, sehingga mereka meninggalkan Khorasan. Al-Juwayni tinggal di Mekah selama empat tahun, sehingga ia disebut Imam al-Haramayn. Ketika negara Nizamiyyah berkuasa, Nizam al-Mulk membawa kembali mereka yang telah meninggalkan negara tersebut dan menghormati mereka. {cite:shadharat-dhahab hlm. 310} Ibn al-Jawzi mendokumentasikan pengumuman kutukan di Nishapur pada tahun 445 H, yang dibacakan pada masa pemerintahan Tughril Beg. Ia menyebutkan bahwa Abu al-Qasim al-Qushayri terguncang oleh hal itu dan menulis surat berjudul “Keluhan Kaum Sunnah dan Apa yang Menimpa Mereka dari Cobaan,” di mana ia berkata, “Apakah Imam agama dan pembaharu Sunnah terkutuk?” Ia juga menyebutkan bahwa sesuatu disampaikan kepada Sultan dari pernyataan al-Ash’ari, dan para pengikut al-Ash’ari berkata, “Ini tidak mungkin dan bukan ajarannya.” Maka Sultan berkata, “Hanya al-Ash’ari yang mengatakan pernyataan-pernyataan ini yang terkutuk. Jika mereka tidak mempercayainya dan al-Ash’ari tidak mengatakan apa pun tentang hal itu, maka kalian tidak bertanggung jawab atas apa yang dikatakannya.” {cite:muntazam-ibn-al-jawzi j.8 p.107-108}."
