summary:
  ar: "خاطب الوزير عميد الملك الكندري السلطان ألب أرسلان في لعن الرافضة على منابر خراسان فأذن له فأمر بلعنهم وأضاف إليهم الأشعرية، فأنف من ذلك أئمة خراسان منهم أبو القاسم القشيري وإمام الحرمين الجويني وغيرهما ففارقوا خراسان وأقام الجويني بمكة أربع سنين فقيل له إمام الحرمين، فلما جاءت الدولة النظامية أحضر نظام الملك من انتزح منهم وأكرمهم {cite:shadharat-dhahab p. 310}."
  en: "Al-Kunduri's minbar licence from Alp Arslan to curse the Rafida — extended to the Ash'aris — exiled Khurasan's imams; al-Juwayni's four Meccan years earned him 'Imam al-Haramayn', and Nizam al-Mulk's accession restored the exiles in honour {cite:shadharat-dhahab p. 310}."
