id: event/fighting-at-the-darb-gate-begins-on-tuesday-20-dhu-al-hijja-295
class: event
kind: battle
label:
  ar: "القتال عند باب الدرب يوم الثلاثاء العشرين من ذي الحجة 295هـ"
  en: "Fighting at the Darb gate on Tuesday, 20 Dhu al-Hijja 295 AH, p. 367"
  ur: "بروز دروازہ درب پر منگل، 20 ذوالحجہ 295ھ، ص367"
  es: "Combates en la puerta de Darb el martes 20 de Dhu al-Hijjah de 295 AH, pág. 367"
summary:
  ar: "في يوم الثلاثاء كتب محمد إلى ابنيه يعلمهما بالخبر، ويأمرهما أن يستعجلا الهادي بالمدد، ويأمر أحدهما بالإغارة مع يام والأحلاف على سوحان، قرية قوم يُحجب اسمهم في هذا السجل. ثم أقبلت بنو الحارث على ابن حميد من آخر ساحتها، ودار القتال عند باب الدرب حتى غابت الشمس، فأمر ابن حميد بسرية تدور بالقرية."
  en: "On Tuesday Muhammad wrote to his two sons, telling them of events and ordering them to press al-Hadi for reinforcements, and to raid, with Yam and Ahlaf, at Sawhan, the village of a clan whose name is withheld in this record. Banu al-Harith then came to Ibn Humayd from the far end of their land, and the fighting at the Darb gate lasted until sunset. Ibn Humayd withdrew to his camp and ordered a patrol around the village that no one might enter or leave."
  ur: "منگل کے روز محمد نے اپنے دونوں بیٹوں کو خط لکھ کر واقعات سے آگاہ کیا، ہادی سے جلد کمک مانگنے کو کہا، اور ان میں سے ایک کو یام اور الأحلاف کے ساتھ سوحان پر حملے کا حکم دیا، جو اس قوم کا گاؤں ہے جس کا نام اس ریکارڈ میں روکا گیا ہے۔ پھر بنو حارث اپنی زمین کے آخری حصے سے ابن حمید کی طرف بڑھے، اور درب کے دروازے پر غروب آفتاب تک لڑائی ہوتی رہی۔ ابن حمید اپنے پڑاؤ کی طرف لوٹ گیا اور گاؤں کے گرد ایک دستہ مقرر کیا کہ کوئی اندر جائے نہ باہر آئے۔"
  es: "El martes, Muhammad escribió a sus dos hijos, informándoles de los acontecimientos y ordenándoles que presionaran a al-Hadi para que enviara refuerzos, y que, junto con Yam y Ahlaf, asaltaran Sawhan, la aldea de un clan cuyo nombre se omite en este relato. Los Banu al-Harith llegaron entonces a Ibn Humayd desde el extremo más alejado de su territorio, y la lucha en la puerta de Darb se prolongó hasta la puesta del sol. Ibn Humayd se retiró a su campamento y ordenó que una patrulla rodeara la aldea para impedir la entrada y salida de cualquier persona."
