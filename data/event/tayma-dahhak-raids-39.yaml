label: { ar: "سرايا معاوية إلى تيماء وأسفل واقصة", en: "Muʿāwiya's columns to Taymāʾ and lower Wāqisa (39 AH)", es: "Columnas de Muʿāwiya hacia Taymāʾ y Wāqisa inferior (39 AH)", fr: "Les colonnes de Muʿāwiya à Taymāʾ et au bas Wāqisa (39 AH)", ur: "معاویہ کے کالم تیماء اور لوئر وقیصہ ⁦(39ھ)⁩", tr: "Muaviye'nin Teyma ve Asfal Vakka'ya baskınları", id: "Penggerebekan Muawiyah ke Tayma dan Asfal Waqsa" }
date:
  start: { edtf: "0659", hijri: "0039", calendar: julian, precision: year, status: tradition, derived: true, note: "سنة 39؛ التحويل مشتق {cite:kamil-ibn-al-athir p. 725-726}." }
summary:
  ar: "وجّه معاوية عبد الله بن مسعدة الفزاري إلى تيماء، والضحاك بن قيس أمره أن يمر بأسفل واقصة ويغير على من مر به من أهل العراق ممن ليس في طاعته، وسار معاوية بنفسه حتى شارف دجلة ثم نكص راجعًا {cite:kamil-ibn-al-athir p. 725-726}."
  en: "Muʿāwiya sent ʿAbdallāh ibn Masʿada al-Fazārī against Taymāʾ and al-Ḍaḥḥāk ibn Qays along the lower Wāqisa with orders to raid every Iraqi outside Muʿāwiya's allegiance; Muʿāwiya himself marched to the Tigris bank, then turned back {cite:kamil-ibn-al-athir p. 725-726}."
  es: "Muʿāwiya envió a ʿAbdallāh ibn Masʿada al-Fazārī contra Taymāʾ y al-Ḍaḥḥāk ibn Qays a lo largo del bajo Wāqisa con órdenes de atacar a todo iraquí que no fuera leal a Muʿāwiya; el propio Muʿāwiya marchó hasta la orilla del Tigris y luego regresó {cite:kamil-ibn-al-athir p. 725-726}."
  fr: "Muʿāwiya envoya ʿAbdallāh ibn Masʿada al-Fazārī contre Taymāʾ et al-Ḍaḥḥāk ibn Qays le long du cours inférieur de la Wāqisa avec l'ordre de piller tous les Irakiens qui n'étaient pas fidèles à Muʿāwiya; Muʿāwiya lui-même marcha jusqu'à la rive du Tigre, puis fit demi-tour {cite:kamil-ibn-al-athir p. 725-726}."
  ur: "معاویہ نے عبداللہ بن مسعدہ الفزاری کو تیما اور ضحاک بن قیس کے خلاف نچلے وقیصہ کے ساتھ اس حکم کے ساتھ بھیجا کہ معاویہ کی بیعت سے باہر ہر عراقی پر چھاپہ مارو۔ معاویہ نے خود دجلہ کے کنارے کوچ کیا، پھر واپس پلٹا۔ 725-726}۔"
  tr: "Muaviye, Abdullah bin Mes'ade el-Fazari'yi Tayma'ya yönlendirdi ve el-Dahhak bin Kays'a Vaksa'nın alt kısmından geçerek, kendi yetkisi altında olmayan Irak halkından olanlara baskın düzenlemesini emretti. Muaviye kendisi de Dicle'ye yaklaşıncaya kadar ilerledi, sonra geri döndü. {cite:kamil-ibn-al-athir s. 725-726}"
  id: "Muawiyah mengarahkan Abdullah bin Mas’adah al-Fazari ke Tayma, dan memerintahkan al-Dahhak bin Qais untuk melewati bagian bawah Waqsa dan menyerang orang-orang Irak yang tidak berada di bawah kekuasaannya. Muawiyah sendiri bergerak hingga mendekati Sungai Tigris, lalu berbalik. {cite:kamil-ibn-al-athir hlm. 725-726}"
