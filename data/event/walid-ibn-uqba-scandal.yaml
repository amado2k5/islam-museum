summary:
  ar: "عزل عثمان الوليد بن عقبة عن الكوفة وولاّها سعيد بن العاص: كان الوليد محبوبًا إلى الناس خمس سنين وليس لداره باب، ثم قُتل ابن الحيسمان الخزاعي فشهد أبو شريح على القتلة فقتلهم على باب القصر فحفظوا الوليد، وشهد شهود أنه شرب الخمر وقيل سكر وصلى بالناس الصبح أربعًا ثم قال أزيدكم؟ فقال ابن مسعود: ما زلنا معك في زيادة منذ اليوم، وقدِموا على عثمان فجلده أربعين — قال علي: أمسك، جلد رسول الله وأبو بكر أربعين وجلد عثمان ثمانين وكل سنة وهذا أحب إلي؛ وأمر علي بنزع خميصته لما جُلد، وقال الحسن حين أمره بالجلد: ولِّ حارّها من تولّى قارّها فجلده عبد الله بن جعفر {cite:kamil-ibn-al-athir p. 477-478}."
  en: "Al-Walid, governor of Kufa for five beloved years, was dismissed after two chains of scandal: the execution of Ibn al-Haysuman's killers on the palace gate made enemies who watched him, and witnesses bore that he drank wine — one account has him lead the dawn prayer with four rak'as then ask «shall I give you more?«, Ibn Mas'ud answering «we have been with you in increase since today.« Carried to 'Uthman he was flogged forty; 'Ali held the count: «the Messenger and Abu Bakr flogged forty, 'Uthman eighty — both are sunna, and this is dearer to me«; when al-Hasan was told to do the flogging he said «let him who took the cool side of it take the hot,« so 'Abdallah ibn Ja'far struck the blows and his Khamisa was stripped off {cite:kamil-ibn-al-athir p. 477-478}."
