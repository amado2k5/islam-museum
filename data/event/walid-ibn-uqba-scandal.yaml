label: { ar: "عزل الوليد بن عقبة عن الكوفة", en: "al-Walid ibn 'Uqba's dismissal from Kufa (30 AH)", es: "Expulsión de al-Walid ibn 'Uqba de Kufa (30 d. H.)", fr: "Le renvoi d'al-Walid ibn 'Uqba de Kufa (30 AH)", ur: "ولید بن عقبہ کی کوفہ سے برطرفی ⁦(30ھ)⁩" }
date:
  start: { edtf: "0650", hijri: "0030", calendar: julian, precision: year, status: tradition, derived: true, note: "سنة 30؛ التحويل مشتق {cite:kamil-ibn-al-athir p. 477}." }
summary:
  ar: "عزل عثمان الوليد بن عقبة عن الكوفة وولاّها سعيد بن العاص: كان الوليد محبوبًا إلى الناس خمس سنين وليس لداره باب، ثم قُتل ابن الحيسمان الخزاعي فشهد أبو شريح على القتلة فقتلهم على باب القصر فحفظوا الوليد، وشهد شهود أنه شرب الخمر وقيل سكر وصلى بالناس الصبح أربعًا ثم قال أزيدكم؟ فقال ابن مسعود: ما زلنا معك في زيادة منذ اليوم، وقدِموا على عثمان فجلده أربعين — قال علي: أمسك، جلد رسول الله وأبو بكر أربعين وجلد عثمان ثمانين وكل سنة وهذا أحب إلي؛ وأمر علي بنزع خميصته لما جُلد، وقال الحسن حين أمره بالجلد: ولِّ حارّها من تولّى قارّها فجلده عبد الله بن جعفر {cite:kamil-ibn-al-athir p. 477-478}."
  en: "Al-Walid, governor of Kufa for five beloved years, was dismissed after two chains of scandal: the execution of Ibn al-Haysuman's killers on the palace gate made enemies who watched him, and witnesses bore that he drank wine — one account has him lead the dawn prayer with four rak'as then ask «shall I give you more?«, Ibn Mas'ud answering «we have been with you in increase since today.« Carried to 'Uthman he was flogged forty; 'Ali held the count: «the Messenger and Abu Bakr flogged forty, 'Uthman eighty — both are sunna, and this is dearer to me«; when al-Hasan was told to do the flogging he said «let him who took the cool side of it take the hot,« so 'Abdallah ibn Ja'far struck the blows and his Khamisa was stripped off {cite:kamil-ibn-al-athir p. 477-478}."
  es: "Al-Walid, gobernador de Kufa durante cinco amados años, fue destituido tras dos cadenas de escándalos: la ejecución de los asesinos de Ibn al-Haysuman en la puerta del palacio le granjeó enemigos entre quienes lo observaban, y los testigos afirmaron que bebía vino; un relato cuenta que dirigió la oración del amanecer con cuatro rak'as y luego preguntó «¿Os doy más?», a lo que Ibn Mas'ud respondió «Hemos estado con vosotros en aumento desde hoy». Llevado ante 'Uthman, fue azotado cuarenta veces; 'Ali llevó la cuenta: «El Mensajero y Abu Bakr azotaron cuarenta veces, 'Uthman ochenta; ambas son sunna, y esta es más querida para mí»; cuando se le dijo a al-Hasan que realizara los azotes, dijo «que el que tomó el lado frío tome el caliente», así que 'Abdallah ibn Ja'far asestó los golpes y su Khamisa fue arrancada {cite:kamil-ibn-al-athir p. 477-478}."
  fr: "Al-Walid, gouverneur de Koufa pendant cinq années fastueuses, fut destitué après deux scandales successifs: l’exécution des assassins d’Ibn al-Haysuman aux portes du palais lui valut des ennemis parmi ceux qui l’observaient, et des témoins rapportèrent qu’il buvait du vin – selon un récit, il dirigea la prière de l’aube avec quatre rak’as, puis demanda: « Voulez-vous en donner davantage ? », Ibn Mas’ud répondant: « Nous vous avons accompagné avec abondance depuis aujourd’hui. » Conduit devant ’Uthman, il fut fouetté quarante fois; ’Ali compta les coups: « Le Messager et Abou Bakr en ont fouetté quarante, ’Uthman quatre-vingts – les deux sont sunna, et c’est ce qui me plaît le plus. » Quand on ordonna à al-Hasan de procéder à la flagellation, il dit: « Que celui qui a supporté la douceur en subisse la douleur », et ’Abdallah ibn Ja’far frappa les coups, et sa khamisa fut arrachée (voir: Kamil-ibn-al-athir, p. 477-478)."
  ur: "الولید جو پانچ سال تک کوفہ کا گورنر رہا، دو زنجیروں کے بعد برطرف کر دیا گیا: ابن الحیثمان کے قاتلوں کو محل کے دروازے پر پھانسی دینے نے اسے دیکھنے والے دشمن بنا دیے، اور گواہوں نے بتایا کہ اس نے شراب پی تھی۔ جواب دیا \"ہم آج سے بڑھ کر تمہارے ساتھ ہیں۔\" عثمان کے پاس لے جایا گیا، اسے چالیس کوڑے مارے گئے۔ علی نے شمار کیا: \"رسول اور ابوبکر نے چالیس کوڑے مارے، عثمان نے اسّی - دونوں سنت ہیں، اور یہ مجھے زیادہ محبوب ہے\"۔ جب حسن کو کوڑے مارنے کے لیے کہا گیا تو اس نے کہا کہ جس نے اس کی ٹھنڈی طرف لے لی اسے گرم کرنے دو، چنانچہ عبداللہ بن جعفر نے کوڑے مارے اور اس کی خمیسہ اتار دی گئی۔ 477-478}۔"
