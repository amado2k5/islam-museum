id: event/testament-of-ibrahim-and-yaqub-to-their-sons
class: event
kind: declaration
label:
  ar: وصية إبراهيم ويعقوب لبنيهما
  en: Testament of Ibrahim and Yaqub to their sons
  ur: ابراہیم اور یعقوب کی اپنے بیٹوں کو وصیت
  es: "Testamento de Ibrahim y Yaqub a sus hijos"
  fr: "Testament d'Ibrahim et de Jacob à leurs fils"
  tr: "İbrahim ve Yakup'un oğullarına vasiyeti"
  id: "Wasiat Abraham dan Yakub kepada putra-putra mereka"
summary:
  ar: يشرح ابن كثير أن وصية إبراهيم لبنيه بملة الإسلام، ووصية يعقوب عند حضور الموت أن يعبدوا الله وحده، هما موضوع آيتي البقرة 132-133، وأن الإسلام ملة الأنبياء كلهم وإن اختلفت شرائعهم {cite:tafsir-ibn-kathir scan vol. 1 p. 621} {cite:tafsir-ibn-kathir scan vol. 1 p. 622}؛ ويناقش القرطبي دخول يعقوب في وصية جده ويورد حكاية أن يعقوب اختار الموت وطلب مهلة ليوصي بنيه {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 616} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 617}؛ وما ذكره أهل الكتاب من وصية كل ابن على حدة خبر إسرائيلي {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224}.
  en: Ibn Kathir explains that Ibrahim's charge to his sons to hold to the creed of Islam, and Ya'qub's charge at the approach of death to worship God alone, are the subject of Qur'an 2:132-133, and that Islam is the religion of all the prophets whatever their laws {cite:tafsir-ibn-kathir scan vol. 1 p. 621} {cite:tafsir-ibn-kathir scan vol. 1 p. 622}; al-Qurtubi discusses whether Ya'qub was present for his grandfather's charge and relates a report that Ya'qub chose death and asked for time to charge his sons {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 616} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 617}; what the People of the Book say about a separate charge to each son is an Israelite report {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224}.
  ur: ابن کثیر بتاتے ہیں کہ ابراہیم کی اپنے بیٹوں کو اسلام کی ملت کی وصیت اور یعقوب کی موت کے وقت صرف اللہ کی عبادت کی وصیت البقرہ 132-133 کا موضوع ہے، اور اسلام تمام انبیاء کی ملت ہے خواہ شریعتیں مختلف ہوں {cite:tafsir-ibn-kathir scan vol. 1 p. 621} {cite:tafsir-ibn-kathir scan vol. 1 p. 622}؛ قرطبی یعقوب کے اپنے دادا کی وصیت میں شامل ہونے پر بحث کرتے ہیں اور یہ حکایت لاتے ہیں کہ یعقوب نے موت چنی اور بیٹوں کو وصیت کے لیے مہلت مانگی {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 616} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 617}؛ اہلِ کتاب کا ہر بیٹے کو الگ وصیت کا ذکر اسرائیلی خبر ہے {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224}۔
  es: "Ibn Kathir explica que el mandato de Ibrahim a sus hijos de adherirse al credo del Islam, y el mandato de Ya'qub al acercarse la muerte de adorar solo a Dios, son el tema del Corán 2:132-133, y que el Islam es la religión de todos los profetas cualesquiera que sean sus leyes {cite:tafsir-ibn-kathir scan vol. 1 p. 621} {cite:tafsir-ibn-kathir scan vol. 1 p. 622}; al-Qurtubi discute si Ya'qub estuvo presente para el mandato de su abuelo y relata un informe de que Ya'qub eligió la muerte y pidió tiempo para encomendar a sus hijos {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 616} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 617}; Lo que dice la Gente del Libro acerca de una responsabilidad separada para cada hijo es un informe israelita {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224}."
  fr: "Ibn Kathir explique que l'exhortation d'Ibrahim à ses fils à embrasser l'islam, et celle de Ya'qub à l'approche de la mort à n'adorer que Dieu, sont traitées dans le Coran (2:132-133), et que l'islam est la religion de tous les prophètes, quelles que soient leurs lois (Tafsir Ibn Kathir, vol. 1, p. 621; Tafsir Ibn Kathir, vol. 1, p. 622). Al-Qurtubi examine si Ya'qub était présent lors de l'exhortation de son grand-père et rapporte un récit selon lequel Ya'qub aurait choisi la mort et demandé un délai pour exhorter ses fils (Jami'ahkam Quran Resala, vol. 3, p. 616; Jami'ahkam Quran Resala, vol. 3, p. 617). Ce que les Gens du Livre disent à propos d'une charge séparée pour chaque fils est un rapport israélite {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224}."
  tr: "İbn Kathir, İbrahim'in oğullarına İslam dini hakkında verdiği vasiyetin ve Yakup'un ölümünden sonra yalnızca Allah'a ibadet edeceğine dair verdiği vasiyetin Bakara Suresi'nin 132-133. ayetlerinin konusu olduğunu ve kanunları farklı olsa da İslam'ın tüm peygamberlerin dini olduğunu açıklar. {cite:tafsir-ibn-kathir scan vol. 1 p. 621} {cite:tafsir-ibn-kathir scan vol. 1 p. 622}; El-Kurtubi, Yakup'un dedesinin vasiyetine dahil edilmesini ele alır ve Yakup'un ölümü seçtiği ve oğullarına vasiyet vermek için zaman istediği hikayesini aktarır. {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 616} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 617}; Kitap Ehli'nin her bir oğlunun vasiyetiyle ilgili olarak bahsettikleri ise İsrailoğulları'nın bir anlatımıdır. {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224}."
  id: "Ibn Kathir menjelaskan bahwa wasiat Ibrahim kepada putra-putranya mengenai agama Islam, dan wasiat Yakub setelah kematiannya untuk menyembah Allah semata, adalah pokok bahasan ayat 132-133 Surah Al-Baqarah, dan bahwa Islam adalah agama semua nabi, meskipun hukum-hukum mereka berbeda. {cite:tafsir-ibn-kathir scan vol. 1 p. 621} {cite:tafsir-ibn-kathir scan vol. 1 p. 622}; Al-Qurtubi membahas dimasukkannya Yakub dalam wasiat kakeknya dan mengutip kisah bahwa Yakub memilih kematian dan meminta waktu untuk memberikan wasiat kepada putra-putranya. {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 616} {cite:jami-ahkam-quran-resala-v1 scan vol. 3 p. 617}; dan apa yang disebutkan oleh Ahli Kitab mengenai wasiat masing-masing anak adalah catatan dari kaum Israel. {cite:al-bidaya-wal-nihaya scan vol. 2 p. 224}."
