id: event/incident-of-bir-mauna
class: event
kind: skirmish
label: { en: "The Tragedy of Bi'r Ma'una", ar: "مأساة بئر معونة" }
summary:
  en: "In Safar 4 AH, seventy senior Muslim reciters (qurra') led by al-Mundhir ibn Amr were sent to Najd at the request of Abu Bara' Amir ibn Malik; they were ambushed and massacred at Bi'r Ma'una by Amir ibn al-Tufayl and allied Sulaym clans."
  ar: "بعث النبي سبعين رجلاً من خيار الصحابة وقرائهم بقيادة المنذر بن عمرو في صفر 4هـ في جوار أبي براء عامر بن مالك ليدعوا أهل نجد، فغدر بهم عامر بن الطفيل واستجاش عصية ورعلاً وذكوان فأحاطوا بهم وقتلوهم عند بئر معونة، ولم ينج إلا كعب بن زيد وعمرو بن أمية الضمري. ويعدّ أنس بن مالك في الصحيح سبعين قتيلاً للأنصار ببئر معونة كيومي أحد واليمامة {cite:sahih-al-bukhari 4078}."
