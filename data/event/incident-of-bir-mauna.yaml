label: { en: "The Tragedy of Bi'r Ma'una", ar: "مأساة بئر معونة", es: "La tragedia de Bi'r Ma'una", fr: "La tragédie de Bi'r Ma'una", ur: "بیر معونہ کا سانحہ" }
summary:
  en: "In Safar 4 AH, seventy senior Muslim reciters (qurra') led by al-Mundhir ibn Amr were sent to Najd at the request of Abu Bara' Amir ibn Malik; they were ambushed and massacred at Bi'r Ma'una by Amir ibn al-Tufayl and allied Sulaym clans."
  ar: "بعث النبي سبعين رجلاً من خيار الصحابة وقرائهم بقيادة المنذر بن عمرو في صفر 4هـ في جوار أبي براء عامر بن مالك ليدعوا أهل نجد، فغدر بهم عامر بن الطفيل واستجاش عصية ورعلاً وذكوان فأحاطوا بهم وقتلوهم عند بئر معونة، ولم ينج إلا كعب بن زيد وعمرو بن أمية الضمري. ويعدّ أنس بن مالك في الصحيح سبعين قتيلاً للأنصار ببئر معونة كيومي أحد واليمامة {cite:sahih-al-bukhari 4078}."
  es: "En Safar 4 AH, setenta recitadores musulmanes de alto rango (qurra') liderados por al-Mundhir ibn Amr fueron enviados a Najd a petición de Abu Bara' Amir ibn Malik; fueron emboscados y masacrados en Bi'r Ma'una por Amir ibn al-Tufayl y clanes aliados de Sulaym."
  fr: "En Safar 4 AH, soixante-dix récitants musulmans de haut rang (qurra') dirigés par al-Mundhir ibn Amr furent envoyés au Najd à la demande d'Abu Bara' Amir ibn Malik; ils furent pris en embuscade et massacrés à Bi'r Ma'una par Amir ibn al-Tufayl et les clans Sulaym alliés."
  ur: "صفر 4 ہجری میں، ابو براء عامر بن مالک کی درخواست پر المنذر بن عمرو کی قیادت میں ستر بزرگ مسلمان قراء ⁦(قراء)⁩ نجد بھیجے گئے۔ ان پر امیر ابن طفیل اور سلیمان کے اتحادیوں نے بئر معونہ میں گھات لگا کر ان کا قتل عام کیا۔"
