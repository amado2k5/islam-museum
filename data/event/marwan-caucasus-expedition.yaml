label: { ar: "غزوة مروان بن محمد في بلاد الخزر والجبال", en: "Marwan ibn Muhammad's Expedition through Khazar and Mountain Lands" }
summary:
  ar: "عند البلاذري: ولّى هشام بعد مسلمة سعيد الحرشي فأقام بالثغر سنتين ثم ولّى الثغر مروان بن محمد فنزل كسال وهو بنى مدينتها — وهي من برذعة على أربعين فرسخاً ومن تفليس على عشرين فرسخاً — ثم دخل أرض الخزر مما يلي باب اللان أدخله إياها أسيد بن زافر السلمي أبو يزيد ومعه ملوك الجبال من ناحية الباب والأبواب فأغار مروان على صقالبة كانوا بأرض الخزر فسبى منهم عشرة آلاف أهل بيت فأسكنهم خاخيط ثم إنهم قتلوا أميرهم وهربوا فلحقهم وقتلهم؛ ولما بلغ عظيم الخزر كثرة من وطىء به مروان بلاده وما هم عليه في عدتهم وقوتهم نخب ذلك قلبه وملأه رعباً فلما دنا منه أرسل إليه رسولاً يدعوه إلى الإسلام أو الحرب فقال قد قبلت الإسلام فأرسل إليّ من يعرّضه عليّ ففعل فأظهر الإسلام ووادع مروان على أن أقرّه في مملكته وسار مروان معه بخلق من الخزر فأنزلهم ما بين السمور والشابران في سهل أرض اللكز؛ ثم إن مروان دخل أرض السرير فأوقع بأهلها وفتح قلاعاً فيها ودان له ملك السرير وأطاعه فصالحه على ألف رأس: خمسمائة غلام وخمسمائة جارية سود الشعور والحواجب وهدب الأشفار في كل سنة وعلى مائة ألف مدي يُصبّ في إهراء الباب وأُخذ منه الرهن، وصالح مروان أهل تومان على مائة رأس — خمسين جارية وخمسين غلاماً خماسيين سود الشعور والحواجب وهدب الأشفار — وعشرين ألف مدي للإهراء في كل سنة، ثم دخل أرض زريكران فصالحه ملكها على خمسين رأساً وعشرة آلاف مدي للإهراء في كل سنة، ثم أتى أرض حمزين فأبى حمزين أن يصالحه فافتتح حصنهم بعد أن حاصرهم فيه شهراً فأحرق وأخرب وكان صلحه إياه على خمسمائة رأس يؤدّونها دفعة واحدة ثم لا يكون عليه سبيل وعلى أن يُحمل ثلاثون ألف مدي إلى إهراء الباب في كل سنة، ثم أتى سدان فافتتحها صلحاً على مائة رأس يعطيه إياها صاحبها دفعة ثم لا يكون عليه سبيل فيما يستقبل وعلى أن يُحمل في كل سنة إلى إهراء الباب خمسة آلاف مدي، ووظّف على أهل طبرسرانشاه عشرة آلاف مدي في كل سنة تحمل إلى إهراء الباب ولم يوظّف على فيلانشاه شيئاً وذلك لحسن غنائه وجميل بلائه واحماده أمره؛ ثم نزل مروان على قلعة اللكز وقد امتنع من أداء شيء من الوظيفة وخرج يريد صاحب الخزر فقتله راعٍ بسهم رماه به وهو لا يعرفه فصالح أهل اللكز على عشرين ألف مدي تحمل إلى الإهراء وولّى عليهم خشرماً السلمي، وسار مروان إلى قلعة صاحب شروان وهي تدعى خرش وهي على البحر فأذعن بالطاعة والانحدار إلى السهل وألزمهم عشرة آلاف مدي في كل سنة، وجعل على صاحب شروان أن يكون في المقدمة إذا بدأ المسلمون بغزو الخزر وفي الساقة إذا رجعوا وعلى فيلانشاه أن يغزو معهم فقط وعلى طبرسرانشاه أن يكون في الساقة إذا بدأوا وفي المقدمة إذا انصرفوا؛ وسار مروان إلى الدودانية فأوقع بهم ثم جاءه قتل الوليد بن يزيد."
  en: "In al-Baladhuri: after Maslama, Hisham gave the march to Sa'id al-Harashi, who held it two years, then to Marwan ibn Muhammad — who camped at Kisal, having built its city (forty farsakhs from Bardha'a, twenty from Tiflis), then entered the Khazar land by way of Bab al-Lan, Asid ibn Zafir al-Sulami Abu Yazid guiding him in with the mountain kings by way of Bab wa-l-Abwab; Marwan raided Slavs in the Khazar land, carrying off ten thousand households whom he settled in Khakhit — they later killed their amir and fled, and he overtook and slew them; when the Khazar great-king learned the numbers Marwan trod into his lands and their strength and array, it stung his heart and filled it with dread, and as Marwan drew near he sent a messenger summoning him to Islam or war — Marwan answered 'I accept Islam; send me one to present it', which was done, and the Khaqan showed forth Islam, Marwan making peace confirming him in his kingdom; with him Marwan settled a body of Khazars between al-Samur and al-Shabiran in the Lakz plain; then Marwan entered the land of al-Sarir, fell upon its people, took castles, and its king submitted and obeyed — he compounded with him for a thousand heads, five hundred lads and five hundred girls black of hair, brow and lash each year, and a hundred thousand mudd poured into Bab's granaries, taking hostages of him; Marwan compounded with Tuman's people for a hundred heads — fifty girls and fifty five-year-old boys black of hair, brow and lash — and twenty thousand mudd yearly to the granaries; then entered Zirikeran's land, whose king compounded for fifty heads and ten thousand mudd yearly; then came to Hamzin's land — Hamzin refusing peace — took their fortress after a month's siege, burned and demolished it, its treaty then being five hundred heads delivered in one payment, no further claim on him, and thirty thousand mudd borne yearly to Bab's granaries; then came to Sadan, which he opened by treaty for a hundred heads its lord delivered at once, no claim thereafter, and five thousand mudd borne yearly to Bab's granaries; and he assessed the people of Tabarsaranshah at ten thousand mudd borne yearly to the granaries, while assessing Filanshah nothing — for his fine service, handsome conduct and praiseworthy way; then Marwan camped on the fortress of al-Lakz — its lord having withheld the levy and gone out to join the Khazar king, whereupon a herdsman killed him with an arrow not knowing him — so the Lakz people compounded for twenty thousand mudd borne to the granaries, and he set Khashrama al-Sulami over them; and Marwan went to Shirwan's lord's fortress called Khirsh upon the sea — he submitted, was ordered down to the plain, and they were bound to ten thousand mudd yearly; on Shirwan's lord he laid it that he be in the van when the Muslims began raiding the Khazars and in the rear when they returned; on Filanshah, that he raid with them only; and on Tabarsaranshah, in the rear at the outset and the van at the return; and Marwan went to the Dudaniyya and fell on them — then word of al-Walid ibn Yazid's killing reached him."
