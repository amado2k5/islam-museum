label: { ar: "غزوة مروان بن محمد في بلاد الخزر والجبال", en: "Marwan ibn Muhammad's Expedition through Khazar and Mountain Lands", es: "La expedición de Marwan ibn Muhammad a través de las tierras jázaras y montañosas.", fr: "L'expédition de Marwan ibn Muhammad à travers les terres khazares et montagneuses", ur: "مروان بن محمد کی خزر اور پہاڑی سرزمین کے ذریعے مہم", tr: "Mervan ibn Muhammed'in Hazar topraklarını ve dağlarını fethi", id: "Penaklukan wilayah dan pegunungan Khazar oleh Marwan bin Muhammad" }
summary:
  ar: "عند البلاذري: ولّى هشام بعد مسلمة سعيد الحرشي فأقام بالثغر سنتين ثم ولّى الثغر مروان بن محمد فنزل كسال وهو بنى مدينتها — وهي من برذعة على أربعين فرسخاً ومن تفليس على عشرين فرسخاً — ثم دخل أرض الخزر مما يلي باب اللان أدخله إياها أسيد بن زافر السلمي أبو يزيد ومعه ملوك الجبال من ناحية الباب والأبواب فأغار مروان على صقالبة كانوا بأرض الخزر فسبى منهم عشرة آلاف أهل بيت فأسكنهم خاخيط ثم إنهم قتلوا أميرهم وهربوا فلحقهم وقتلهم؛ ولما بلغ عظيم الخزر كثرة من وطىء به مروان بلاده وما هم عليه في عدتهم وقوتهم نخب ذلك قلبه وملأه رعباً فلما دنا منه أرسل إليه رسولاً يدعوه إلى الإسلام أو الحرب فقال قد قبلت الإسلام فأرسل إليّ من يعرّضه عليّ ففعل فأظهر الإسلام ووادع مروان على أن أقرّه في مملكته وسار مروان معه بخلق من الخزر فأنزلهم ما بين السمور والشابران في سهل أرض اللكز؛ ثم إن مروان دخل أرض السرير فأوقع بأهلها وفتح قلاعاً فيها ودان له ملك السرير وأطاعه فصالحه على ألف رأس: خمسمائة غلام وخمسمائة جارية سود الشعور والحواجب وهدب الأشفار في كل سنة وعلى مائة ألف مدي يُصبّ في إهراء الباب وأُخذ منه الرهن، وصالح مروان أهل تومان على مائة رأس — خمسين جارية وخمسين غلاماً خماسيين سود الشعور والحواجب وهدب الأشفار — وعشرين ألف مدي للإهراء في كل سنة، ثم دخل أرض زريكران فصالحه ملكها على خمسين رأساً وعشرة آلاف مدي للإهراء في كل سنة، ثم أتى أرض حمزين فأبى حمزين أن يصالحه فافتتح حصنهم بعد أن حاصرهم فيه شهراً فأحرق وأخرب وكان صلحه إياه على خمسمائة رأس يؤدّونها دفعة واحدة ثم لا يكون عليه سبيل وعلى أن يُحمل ثلاثون ألف مدي إلى إهراء الباب في كل سنة، ثم أتى سدان فافتتحها صلحاً على مائة رأس يعطيه إياها صاحبها دفعة ثم لا يكون عليه سبيل فيما يستقبل وعلى أن يُحمل في كل سنة إلى إهراء الباب خمسة آلاف مدي، ووظّف على أهل طبرسرانشاه عشرة آلاف مدي في كل سنة تحمل إلى إهراء الباب ولم يوظّف على فيلانشاه شيئاً وذلك لحسن غنائه وجميل بلائه واحماده أمره؛ ثم نزل مروان على قلعة اللكز وقد امتنع من أداء شيء من الوظيفة وخرج يريد صاحب الخزر فقتله راعٍ بسهم رماه به وهو لا يعرفه فصالح أهل اللكز على عشرين ألف مدي تحمل إلى الإهراء وولّى عليهم خشرماً السلمي، وسار مروان إلى قلعة صاحب شروان وهي تدعى خرش وهي على البحر فأذعن بالطاعة والانحدار إلى السهل وألزمهم عشرة آلاف مدي في كل سنة، وجعل على صاحب شروان أن يكون في المقدمة إذا بدأ المسلمون بغزو الخزر وفي الساقة إذا رجعوا وعلى فيلانشاه أن يغزو معهم فقط وعلى طبرسرانشاه أن يكون في الساقة إذا بدأوا وفي المقدمة إذا انصرفوا؛ وسار مروان إلى الدودانية فأوقع بهم ثم جاءه قتل الوليد بن يزيد."
  en: "In al-Baladhuri: after Maslama, Hisham gave the march to Sa'id al-Harashi, who held it two years, then to Marwan ibn Muhammad — who camped at Kisal, having built its city (forty farsakhs from Bardha'a, twenty from Tiflis), then entered the Khazar land by way of Bab al-Lan, Asid ibn Zafir al-Sulami Abu Yazid guiding him in with the mountain kings by way of Bab wa-l-Abwab; Marwan raided Slavs in the Khazar land, carrying off ten thousand households whom he settled in Khakhit — they later killed their amir and fled, and he overtook and slew them; when the Khazar great-king learned the numbers Marwan trod into his lands and their strength and array, it stung his heart and filled it with dread, and as Marwan drew near he sent a messenger summoning him to Islam or war — Marwan answered 'I accept Islam; send me one to present it', which was done, and the Khaqan showed forth Islam, Marwan making peace confirming him in his kingdom; with him Marwan settled a body of Khazars between al-Samur and al-Shabiran in the Lakz plain; then Marwan entered the land of al-Sarir, fell upon its people, took castles, and its king submitted and obeyed — he compounded with him for a thousand heads, five hundred lads and five hundred girls black of hair, brow and lash each year, and a hundred thousand mudd poured into Bab's granaries, taking hostages of him; Marwan compounded with Tuman's people for a hundred heads — fifty girls and fifty five-year-old boys black of hair, brow and lash — and twenty thousand mudd yearly to the granaries; then entered Zirikeran's land, whose king compounded for fifty heads and ten thousand mudd yearly; then came to Hamzin's land — Hamzin refusing peace — took their fortress after a month's siege, burned and demolished it, its treaty then being five hundred heads delivered in one payment, no further claim on him, and thirty thousand mudd borne yearly to Bab's granaries; then came to Sadan, which he opened by treaty for a hundred heads its lord delivered at once, no claim thereafter, and five thousand mudd borne yearly to Bab's granaries; and he assessed the people of Tabarsaranshah at ten thousand mudd borne yearly to the granaries, while assessing Filanshah nothing — for his fine service, handsome conduct and praiseworthy way; then Marwan camped on the fortress of al-Lakz — its lord having withheld the levy and gone out to join the Khazar king, whereupon a herdsman killed him with an arrow not knowing him — so the Lakz people compounded for twenty thousand mudd borne to the granaries, and he set Khashrama al-Sulami over them; and Marwan went to Shirwan's lord's fortress called Khirsh upon the sea — he submitted, was ordered down to the plain, and they were bound to ten thousand mudd yearly; on Shirwan's lord he laid it that he be in the van when the Muslims began raiding the Khazars and in the rear when they returned; on Filanshah, that he raid with them only; and on Tabarsaranshah, in the rear at the outset and the van at the return; and Marwan went to the Dudaniyya and fell on them — then word of al-Walid ibn Yazid's killing reached him."
  es: "En al-Baladhuri: después de Maslama, Hisham le dio la marcha a Sa'id al-Harashi, quien la mantuvo durante dos años, luego a Marwan ibn Muhammad, quien acampó en Kisal, habiendo construido su ciudad (cuarenta farsakhs desde Bardha'a, veinte desde Tiflis), luego entró en la tierra jázara por el camino de Bab al-Lan, Asid ibn Zafir al-Sulami Abu Yazid lo guió con los reyes de las montañas por el camino de Bab wa-l-Abwab; Marwan asaltó a los eslavos en la tierra jázara, llevándose diez mil familias que estableció en Khakhit; luego mataron a su emir y huyeron, y él los alcanzó y los mató; cuando el gran rey jázaro supo los números que Marwan había pisado en sus tierras y su fuerza y formación, le hirió el corazón y lo llenó de temor, y cuando Marwan se acercó envió un mensajero convocándolo al Islam o a la guerra; Marwan respondió: \"Acepto el Islam; envíame uno para presentarlo', lo cual se hizo, y el Khaqan mostró el Islam, Marwan haciendo la paz confirmándolo en su reino; con él Marwan estableció un cuerpo de jázaros entre al-Samur y al-Shabiran en la llanura de Lakz; luego Marwan entró en la tierra de al-Sarir, cayó sobre su gente, tomó castillos, y su rey se sometió y obedeció; pagó con él por mil cabezas, quinientos muchachos y quinientas muchachas negras de cabello, cejas y pestañas cada año, y cien mil mudd vertidos en los graneros de Bab, tomando rehenes de él; Marwan pagó con la gente de Tuman por cien cabezas —cincuenta muchachas y cincuenta muchachos de cinco años negros de cabello, cejas y pestañas— y veinte mil mudd anualmente para los graneros; luego entró en la tierra de Zirikeran, cuyo rey pagó por cincuenta cabezas y diez mil mudd anualmente; Luego llegó a la tierra de Hamzin — Hamzin se negó a la paz — tomó su fortaleza después de un mes de asedio, la quemó y la demolió, su tratado entonces fue quinientas cabezas entregadas en un solo pago, sin más reclamo sobre él, y treinta mil mudd llevados anualmente a los graneros de Bab; luego llegó a Sadan, que abrió por tratado por cien cabezas que su señor entregó de inmediato, sin reclamo posterior, y cinco mil mudd llevados anualmente a los graneros de Bab; y evaluó a la gente de Tabarsaranshah en diez mil mudd llevados anualmente a los graneros, mientras que a Filanshah no le evaluó nada — por su excelente servicio, hermosa conducta y loable manera; Entonces Marwan acampó en la fortaleza de al-Lakz —su señor había retenido el impuesto y había salido para unirse al rey jázaro, por lo que un pastor lo mató con una flecha sin conocerlo— así que la gente de Lakz pagó veinte mil mudd llevados a los graneros, y él puso a Khashrama al-Sulami sobre ellos; y Marwan fue a la fortaleza del señor de Shirwan llamada Khirsh sobre el mar —se sometió, se le ordenó bajar a la llanura, y fueron obligados a pagar diez mil mudd anualmente; al señor de Shirwan le ordenó que estuviera en la vanguardia cuando los musulmanes comenzaran a saquear a los jázaros y en la retaguardia cuando regresaran; a Filanshah, que saqueara solo con ellos; y a Tabarsaranshah, en la retaguardia al comienzo y en la vanguardia al regreso; y Marwan fue a Dudaniyya y los atacó —entonces le llegó la noticia del asesinato de al-Walid ibn Yazid."
  fr: "Dans al-Baladhuri: après Maslama, Hisham confia la marche à Sa'id al-Harashi, qui la tint deux ans, puis à Marwan ibn Muhammad — qui campa à Kisal, après avoir construit sa ville (quarante farsakhs de Bardha'a, vingt de Tiflis), puis entra au pays khazar par Bab al-Lan, Asid ibn Zafir al-Sulami Abu Yazid le guidant avec les rois des montagnes par Bab wa-l-Abwab; Marwan pilla les Slaves au pays khazar, emmenant dix mille familles qu'il installa à Khakhit — ils tuèrent plus tard leur émir et s'enfuirent, et il les rattrapa et les tua; lorsque le grand roi khazar apprit le nombre de Marwan qui avait envahi ses terres, leur force et leur armée, cela lui transperça le cœur et le remplit d'effroi, et comme Marwan approchait, il envoya un messager l'appelant à l'Islam ou à la guerre — Marwan répondit: « J'accepte l'Islam; « Envoyez-moi quelqu'un pour le présenter », ce qui fut fait, et le Khaqan proclama l'Islam, Marwan concluant la paix et le confirmant dans son royaume; avec lui, Marwan installa un groupe de Khazars entre al-Samur et al-Shabiran dans la plaine de Lakz; puis Marwan entra au pays d'al-Sarir, attaqua ses habitants, prit des châteaux, et son roi se soumit et lui obéit — il conclut avec lui pour mille têtes, cinq cents garçons et cinq cents filles aux cheveux, sourcils et cils noirs chaque année, et cent mille mudd versés dans les greniers de Bab, prenant des otages de lui; Marwan conclut avec le peuple de Tuman pour cent têtes — cinquante filles et cinquante garçons de cinq ans aux cheveux, sourcils et cils noirs — et vingt mille mudd par an pour les greniers; puis entra au pays de Zirikeran, dont le roi conclut pour cinquante têtes et dix mille mudd par an; Puis il se rendit au pays d'Hamzin — Hamzin ayant refusé la paix —, prit leur forteresse après un mois de siège, la brûla et la démolit. Le traité stipulait alors le versement de cinq cents têtes en un seul paiement, sans autre revendication, et le versement annuel de trente mille mudd aux greniers de Bab. Il se rendit ensuite à Sadan, qu'il ouvrit par traité pour cent têtes livrées immédiatement par son seigneur, sans autre revendication par la suite, et le versement annuel de cinq mille mudd aux greniers de Bab. Il imposa ensuite aux habitants de Tabarsaranshah une taxe de dix mille mudd par an aux greniers, tandis qu'il n'imposa rien à Filanshah — pour ses excellents services, sa conduite exemplaire et sa voie louable. Marwan campa ensuite sur la forteresse d'al-Lakz — son seigneur ayant retenu la levée et étant parti rejoindre le roi khazar, lorsqu'un berger le tua d'une flèche sans le reconnaître — les habitants de Lakz convinrent alors d'un arrangement à l'amiable pour vingt mille mudd aux greniers, et il nomma Khashrama al-Sulami à leur tête. Marwan se rendit à la forteresse de Khirsh, seigneur de Shirwan, située sur la mer. Il se soumit, reçut l'ordre de descendre dans la plaine et fut lié par une redevance annuelle de dix mille mudd. Il exigea du seigneur de Shirwan qu'il soit à l'avant-garde lors des raids musulmans contre les Khazars et à l'arrière lors de leur retour; de Filanshah qu'il participe uniquement à leurs raids; et de Tabarsaranshah, qu'il soit à l'arrière au début et à l'avant-garde au retour. Marwan se rendit ensuite chez les Dudaniyya et les attaqua. C'est alors qu'il apprit la mort d'al-Walid ibn Yazid."
  ur: "البلادوری میں ہے: مسلمہ کے بعد، ہشام نے مارچ کی قیادت سعید الحراشی کو دی، جس نے دو سال اس پر قبضہ کیا، پھر مروان بن محمد کو - جس نے کسال میں ڈیرہ ڈالا، اس نے اپنا شہر بنایا ⁦(بردعہ سے چالیس فرسخ، بیس طفلس سے)⁩، پھر باب الانجیب الغذی الذی الذی الذی الذی الذی الذی الذی الذی کے راستے خزر کی سرزمین میں داخل ہوا۔ باب و الابواب کے راستے پہاڑی بادشاہوں کے ساتھ؛ مروان نے خضر کی سرزمین میں غلاموں پر چھاپہ مارا، دس ہزار گھرانوں کو لے گیا جنہیں اس نے خاخیت میں آباد کیا تھا- بعد میں انہوں نے ان کے امیر کو قتل کر دیا اور فرار ہو گئے، اور اس نے انہیں پکڑ کر قتل کر دیا۔ جب خزر بادشاہ نے مروان کی تعداد اور ان کی طاقت اور صف بندی کو جان لیا تو اس کے دل کو دھکیل دیا اور خوف سے بھر دیا اور جیسے ہی مروان قریب آیا اس نے ایک قاصد کو بھیجا جو اسے اسلام یا جنگ کی طرف بلائے - مروان نے جواب دیا 'میں اسلام قبول کرتا ہوں'۔ اسے پیش کرنے کے لیے مجھے ایک بھیج دو''، جو ہو گیا، اور خاقان نے اسلام ظاہر کیا، مروان نے اس کی بادشاہی میں صلح کرائی۔ مروان نے اس کے ساتھ میدان لکز میں السامور اور الشبیران کے درمیان خزروں کی ایک لاش کو آباد کیا۔ پھر مروان سرزمین السریر میں داخل ہوا، اس کے لوگوں پر ٹوٹ پڑا، قلعے لے لیے، اور اس کے بادشاہ نے اطاعت اور فرمانبرداری کی - اس نے اس کے ساتھ ایک ہزار سروں، پانچ سو لڑکوں اور پانچ سو لڑکیوں کے بال کالے، پیشانی اور کوڑے ہر سال اس کے ساتھ ملایا، اور اسے یرغمال بنا کر باب کے اناج میں ایک لاکھ مٹی ڈال دی گئی۔ مروان نے تومان کے لوگوں کے ساتھ سو سروں کے ساتھ گھل مل گئے — پچاس لڑکیاں اور پچپن سالہ لڑکے بالوں، پیشانی اور کوڑے کالے — اور بیس ہزار مٹی سالانہ اناج خانوں میں۔ پھر زیرکیران کی سرزمین میں داخل ہوا، جس کا بادشاہ پچاس سروں اور دس ہزار مٹی سالانہ کے لیے جمع کرتا تھا۔ پھر حمزین کی سرزمین پر آئے - حمزین نے صلح سے انکار کیا - ایک مہینے کے محاصرے کے بعد ان کا قلعہ لے لیا، اسے جلا دیا اور منہدم کر دیا، اس کے بعد اس کا معاہدہ ہوا کہ ایک ہی ادائیگی میں پانچ سو سر دیئے گئے، اس پر مزید کوئی دعویٰ نہیں کیا گیا، اور باب کے اناج میں سالانہ تیس ہزار مٹی ڈالی جاتی تھی۔ پھر صدان میں آیا، جسے اس نے ایک سو سروں کے معاہدے کے ذریعے کھول دیا، اس کے مالک نے ایک ہی وقت میں دیا، اس کے بعد کوئی دعویٰ نہیں، اور باب کے اناج میں سالانہ پانچ ہزار مٹی پہنچائی گئی۔ اور اس نے تبرسرانشاہ کے لوگوں کا تخمینہ دس ہزار مٹی کے حساب سے لگایا جو اناج خانوں میں سالانہ لایا جاتا تھا، جبکہ فلانشاہ کو اس کی عمدہ خدمت، خوبصورت طرز عمل اور قابل ستائش انداز کے لیے کچھ بھی نہیں سمجھا۔ پھر مروان نے لکز کے قلعے پر پڑاؤ ڈالا - اس کے آقا نے ٹیکس روک لیا اور خزر بادشاہ کے ساتھ ملنے کے لیے نکلا، تو ایک چرواہے نے اسے نہ جانے تیر سے مار ڈالا - تو لکز والوں نے اناج کے لیے اٹھائے گئے بیس ہزار مٹی کو جمع کیا، اور اس نے خشرمہ السلمی کو ان پر کھڑا کردیا۔ اور مروان شیروان کے آقا کے قلعے میں گیا جسے سمندر پر خرش کہتے ہیں - اس نے عرض کیا، میدان میں اترنے کا حکم دیا گیا، اور وہ سالانہ دس ہزار مٹی کے پابند تھے۔ شیروان کے آقا پر اس نے بتایا کہ جب مسلمانوں نے خزروں پر حملہ کرنا شروع کیا تو وہ اس وین میں تھا اور جب وہ واپس آئے تو پیچھے۔ فلانشاہ پر، کہ وہ صرف ان کے ساتھ چھاپہ مارے۔ اور تبرسرانشاہ پر، شروع میں عقب میں اور واپسی پر وین؛ اور مروان ددانیہ کے پاس گیا اور ان پر گر پڑا - پھر اسے ولید بن یزید کے قتل کی خبر پہنچی۔"
  tr: "El-Baladhuri'ye göre: Hişam, Maslama'dan sonra Said el-Harşi'yi atadı ve o iki yıl sınırda kaldı. Sonra Mervan bin Muhammed'i sınıra atadı ve o Kasal'a yerleşti ve şehrini kurdu -ki bu şehir Bardha'a'dan kırk fersah, Tiflis'ten yirmi fersah uzaklıktadır- sonra Alan Kapısı yönünden Hazar topraklarına girdi. Asid bin Zafer el-Sulami, Ebu Yezid onu oraya getirdi ve onunla birlikte kapı ve kapılar yönünden dağların kralları da vardı. Mervan, Hazar topraklarındaki Slavlara baskın düzenledi ve aralarından on bin kişiyi esir aldı ve onları Hakit'e yerleştirdi. Sonra emirlerini öldürüp kaçtılar, bu yüzden Mervan onları takip edip öldürdü. Büyük Hazar, Mervan'ın ülkesine getirdiği çok sayıda insanı, sayılarını ve güçlerini öğrenince yüreği korkuyla doldu. Ona yaklaştığında, ona İslam'ı kabul etmesi veya savaşması için bir elçi gönderdi. \"İslam'ı kabul ettim, o halde bana İslam'ı tanıtması için birini gönderin\" dedi. Bunun üzerine elçi İslam'ı ilan etti ve Marwan ile krallığında kalması şartıyla barış yaptı. Marwan, bir grup Hazar ile birlikte onunla gitti ve onları Lakz ülkesinin ovasında, Samur ve Şabran nehirleri arasına yerleştirdi. Sonra Marwan, Sarir ülkesine girdi, halkına saldırdı ve kalelerini ele geçirdi. Sarir kralı ona boyun eğdi ve bin baş sığır, her yıl verilecek beş yüz erkek ve beş yüz dişi siyah saçlı, kaşlı ve kirpikli köle ve teminat olarak aldığı Bab ambarına dökülecek yüz bin mudd karşılığında onunla barış yaptı. Marwan, Tuman halkıyla da yüz baş sığır (elli dişi ve elli erkek köle, beşerli gruplar halinde, siyah saçlı, kaşlı ve kirpikli) ve yıllık yirmi bin mudd ambar için barış yaptı. Sonra Zarikran ülkesine girdi ve kralı onunla elli baş sığır ve yıllık on bin mudd ambar için barış yaptı. Sonra Hamzin ülkesine geldi, ancak Hamzin onunla barış yapmayı reddetti. Bunun üzerine bir ay boyunca onları kuşattıktan sonra kalelerini ele geçirdi, yakıp yıktı. Hamzin ile yaptığı barış anlaşması, beş yüz baş sığırın tek seferde ödenmesi ve bundan sonra onlara karşı başka bir hak iddiasında bulunmaması, ayrıca Bab ambarına yıllık otuz bin mudd götürülmesi şartına bağlıydı. Sonra Sadan'a geldi ve sahibi tarafından kendisine yüz baş sığırın tek seferde verilmesi karşılığında burayı barışçıl bir şekilde fethetti. O zaman gelecekte hiçbir yolu kalmayacak ve her yıl Bab'ın ambarlarına beş bin mudd taşıyacak; Tabarsaranshah halkına da her yıl Bab'ın ambarlarına on bin mudd taşımaları için emir verdi. Filanshah'a ise güzel şarkı söylemesi, güzel performansı ve övgüye değer davranışları nedeniyle hiçbir emir vermedi. Sonra Mervan Lakz kalesine indi ve hiçbir görevi yerine getirmeyi reddetti. Hazar hükümdarına gitmek niyetiyle dışarı çıktı, ancak bir çoban onu tanımadığı halde attığı bir okla öldürdü. Böylece Lakz halkıyla ambarlara yirmi bin mudd taşımaları şartıyla barıştı ve başlarına Hazram el-Sulami'yi atadı. Marwan, Şirvan hükümdarının Harş denilen ve deniz kıyısında bulunan kalesine gitti; orada itaat etti ve ovaya indi. Onlardan her yıl on bin mudd ödemelerini istedi ve Müslümanlar Hazarlara saldırmaya başlarsa Şirvan hükümdarını öncü, geri dönerlerse artçı birliklerde görevlendirdi. Filanshah'ın sadece onlarla birlikte saldırmasını, Tabarsaranshah'ın ise saldırıya başlarlarsa artçı, geri dönerlerse öncü birliklerde görevlendirilmesi gerektiğini belirtti. Marwan, Dudaniye'ye doğru ilerledi ve onlara saldırdı; ardından Velid bin Yazid'in öldürüldüğü haberi kendisine ulaştı."
  id: "Menurut Al-Baladhuri: Hisham menunjuk Saeed Al-Harshi setelah Maslama, dan dia tinggal di perbatasan selama dua tahun. Kemudian dia menunjuk Marwan bin Muhammad ke perbatasan, dan dia menetap di Kasal, dan dia membangun kotanya - yang berjarak empat puluh farsakh dari Bardha'a dan dua puluh farsakh dari Tiflis - kemudian dia memasuki tanah Khazar dari arah Gerbang Alan. Asid bin Zafer Al-Sulami, Abu Yazid, membawanya ke sana, dan bersamanya ada raja-raja pegunungan dari arah gerbang dan gerbang-gerbang. Marwan menyerang orang-orang Slavia yang berada di tanah Khazar, dan dia menangkap sepuluh ribu orang dari antara mereka, dan dia menempatkan mereka di Khakhit. Kemudian mereka membunuh emir mereka dan melarikan diri, sehingga dia mengejar mereka dan membunuh mereka. Ketika Khazar besar mengetahui banyaknya orang yang dibawa Marwan ke tanahnya, dan tentang jumlah dan kekuatan mereka, hal ini memenuhi hatinya dengan teror. Ketika ia mendekatinya, ia mengirim utusan kepadanya untuk mengundangnya masuk Islam atau berperang. Ia berkata, “Aku telah memeluk Islam, jadi kirimlah seseorang untuk menyampaikannya kepadaku.” Maka ia melakukannya, dan ia menyatakan Islam dan berdamai dengan Marwan dengan syarat ia akan tetap tinggal di kerajaannya. Marwan pergi bersamanya dengan sekelompok Khazar dan menempatkan mereka di antara Samur dan Shabran di dataran tanah Lakz. Kemudian Marwan memasuki tanah Sarir, menyerang penduduknya, dan merebut benteng-bentengnya. Raja Sarir tunduk kepadanya dan berdamai dengannya dengan imbalan seribu ekor sapi: lima ratus budak laki-laki dan lima ratus budak perempuan dengan rambut, alis, dan bulu mata hitam, yang akan diberikan setiap tahun, dan seratus ribu mudd untuk dimasukkan ke dalam lumbung Bab, dari mana ia mengambil jaminan. Marwan juga berdamai dengan penduduk Tuman dengan imbalan seratus ekor sapi—lima puluh budak perempuan dan lima puluh budak laki-laki, panjangnya lima, dengan rambut, alis, dan bulu mata hitam—dan dua puluh ribu mudd untuk lumbung setiap tahun. Kemudian ia memasuki negeri Zarikran, dan rajanya berdamai dengannya dengan imbalan lima puluh ekor sapi dan sepuluh ribu mudd untuk lumbung setiap tahunnya. Kemudian ia datang ke negeri Hamzin, tetapi Hamzin menolak untuk berdamai dengannya. Maka ia merebut benteng mereka setelah mengepung mereka di sana selama sebulan, membakar dan menghancurkannya. Perdamaiannya dengan Hamzin adalah imbalan lima ratus ekor sapi yang harus dibayar sekaligus, setelah itu ia tidak akan memiliki klaim lebih lanjut terhadap mereka, dan tiga puluh ribu mudd yang harus dibawa ke lumbung Bab setiap tahunnya. Kemudian ia datang ke Sadan dan menaklukkannya secara damai dengan imbalan seratus ekor sapi yang diberikan kepadanya oleh pemiliknya sekaligus. Setelah itu ia tidak akan memiliki jalan lain di masa depan, dan ia harus membawa lima ribu mudd setiap tahun ke lumbung Bab, dan ia membebankan kepada penduduk Tabarsaranshah sepuluh ribu mudd setiap tahunnya untuk dibawa ke lumbung Bab, dan ia tidak membebankan apa pun kepada Filanshah, karena nyanyiannya yang bagus, penampilannya yang indah, dan perilakunya yang terpuji. Kemudian Marwan turun ke benteng Lakz, dan dia menolak untuk melaksanakan tugas apa pun, dan dia pergi dengan maksud untuk menemui penguasa Khazar, tetapi seorang gembala membunuhnya dengan panah yang ditembakkan tanpa sepengetahuannya. Maka dia berdamai dengan penduduk Lakz dengan syarat dua puluh ribu mudd untuk dibawa ke lumbung, dan dia menunjuk Khashram al-Sulami sebagai pemimpin mereka. Marwan pergi ke benteng penguasa Shirvan, yang disebut Kharsh, dan terletak di tepi laut, lalu dia tunduk dan turun ke dataran, dan dia mewajibkan mereka untuk membayar sepuluh ribu mudd setiap tahun, dan dia menjadikan penguasa Shirvan berada di barisan depan jika kaum Muslim mulai menyerang Khazar dan di barisan belakang jika mereka kembali, dan Filanshah hanya menyerang bersama mereka, dan Tabarsaranshah berada di barisan belakang jika mereka mulai dan di barisan depan jika mereka kembali. Marwan bergerak menuju Al-Dudaniyya dan menyerang mereka, kemudian ia mendapat kabar tentang terbunuhnya Al-Walid bin Yazid."
