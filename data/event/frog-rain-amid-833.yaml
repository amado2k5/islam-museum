label: { ar: "مطر الضفادع بآمد 833هـ", en: "The Frog Rain at Amid, 833", es: "La lluvia de ranas en Amid, 833", fr: "La pluie de grenouilles à Amid, 833", ur: "ایمڈ میں مینڈک کی بارش، 833", tr: "Hicri 833 yılında Amid'de kurbağa yağmuru", id: "Hujan katak di Amid 833 AH" }
summary:
  ar: "في شذرات الذهب سنة ثلاث وثلاثين وثمان مئة كما قال البرهان البقاعي أخبره بدر الدين حسين البيري أنه سكن آمد مدة وأنها أمطرت بها ضفادع في فصل الصيف وأخبره أن ذلك غير منكر في تلك الناحية بل هو أمر معتاد {cite:shadharat-dhahab p. 210}."
  en: "833: al-Biqa'i reports from Badr al-Din al-Biri, who dwelt at Amid a while, that frogs rained on it in summer — 'not deemed strange in those parts but an accustomed thing' {cite:shadharat-dhahab p. 210}."
  es: "833: al-Biqa'i relata de Badr al-Din al-Biri, quien habitó en Amid durante un tiempo, que en verano llovían ranas sobre ella, «algo que no se consideraba extraño en esas tierras, sino algo habitual» {cita: shadharat-dhahab p. 210}."
  fr: "833: al-Biqa'i rapporte de Badr al-Din al-Biri, qui a habité à Amid pendant un certain temps, que des grenouilles y tombaient en été — « ce qui n'était pas considéré comme étrange dans ces régions mais comme une chose habituelle » {cite: shadharat-dhahab p. 210}."
  ur: "833: البیقاعی نے بدر الدین البیری سے، جو کچھ دیر کے درمیان میں رہتے تھے، سے نقل کیا ہے کہ گرمیوں میں اس پر مینڈکوں کی بارش ہوتی تھی - 'ان حصوں میں عجیب نہیں بلکہ ایک عادی چیز سمجھی جاتی ہے'۔ 210}۔"
  tr: "Burhan el-Bikai'nin anlattığına göre, Hicri 833 yılında Şadharat el-Dhahab'da, Bedir el-Din Hüseyin el-Biri ona bir süre Amid'de yaşadığını ve orada yazın kurbağaların yağdığını, bunun o bölgede olağan dışı bir durum olmadığını, aksine yaygın bir olay olduğunu bildirmiştir. {kaynak:şadharat-dhahab s. 210}"
  id: "Dalam Shadharat al-Dhahab, pada tahun 833 H, sebagaimana dikatakan oleh Burhan al-Biqa’i, Badr al-Din Husayn al-Biri memberitahunya bahwa ia tinggal di Amid untuk sementara waktu dan bahwa di sana hujan katak pada musim panas, dan ia memberitahunya bahwa hal itu bukanlah sesuatu yang tidak biasa di daerah tersebut, melainkan merupakan kejadian yang umum. {cite:shadharat-dhahab p. 210}."
