label: { ar: "كتاب ملك غسان إلى كعب بن مالك", en: "The letter of the king of Ghassan to Ka'b ibn Malik", es: "La carta del rey de Ghassan a Ka'b ibn Malik", fr: "Lettre du roi de Ghassan à Ka'b ibn Malik", ur: "غسان کے بادشاہ کا کعب بن مالک کے نام خط" }
summary:
  ar: "بينما كعب يمشي في السوق سأل عنه نبطي من نبط الشام ممن قدموا بالطعام، فدفع إليه كتاباً من ملك غسان في سرقة من حرير يدعوه إلى اللحاق به، فعمد كعب إلى تنور فسجّره به."
  en: While Ka'b was walking in the market during the boycott, a Nabataean from the Nabataeans of al-Sham who had brought food asked after him and handed him a letter from the king of Ghassan, wrapped in a scrap of silk, inviting him to join him; Ka'b thrust it into a lit oven.
  es: "Mientras Ka'b paseaba por el mercado durante el boicot, un nabateo de los nabateos de al-Sham que había traído comida le preguntó por él y le entregó una carta del rey de Ghassan, envuelta en un trozo de seda, invitándolo a unirse a él; Ka'b la arrojó a un horno encendido."
  fr: "Alors que Ka'b se promenait au marché pendant le boycott, un Nabatéen des Nabatéens d'al-Sham qui avait apporté de la nourriture s'enquit de lui et lui remit une lettre du roi de Ghassan, enveloppée dans un morceau de soie, l'invitant à le rejoindre; Ka'b la jeta dans un four allumé."
  ur: "جب کعب بائیکاٹ کے دوران بازار میں گھوم رہے تھے، تو شام کے نباطیوں میں سے ایک نباطین نے جو کھانا لے کر آیا تھا، اس کے پیچھے منگوایا اور اسے غسان کے بادشاہ کا ایک خط دیا، جو ریشم کے ٹکڑے میں لپٹا ہوا تھا، جس میں اسے اپنے ساتھ آنے کی دعوت دی گئی تھی۔ کعب نے اسے روشن تندور میں ڈالا۔"
