label: { ar: "فتنة فخر الدين الرازي بهراة سنة 595", en: "The Fakhr al-Din al-Razi affair at Herat, 595 AH" }
summary:
  ar: "في سنة خمس وتسعين كانت فتنة فخر الدين الرازي صاحب التصانيف؛ وذلك أنه قدم هراة ونال إكراماً عظيماً من الدولة فاشتد ذلك على الكرامية، فاجتمع يوماً هو والزاهد مجد الدين ابن القدوة فاستطال فخر الدين على ابن القدوة وشتمه وأهانه، فلما كان من الغد جلس ابن عم مجد الدين فوعظ الناس وقال: أيها الناس لا نقول إلا ما صح عن رسول الله، وأما قول أرسلو وكفريات ابن سينا وفلسفة الفارابي فلا نعلمها، فلا شك يشتم بالأمس شيخ من شيوخ الإسلام يذب عن دين الله — وبكى فأبكى الناس وضجت الكرامية وثاروا من كل ناحية وحصلت الفتنة، فأرسل السلطان الجند فسكنهم وأمر الرازي بالخروج من هراة {cite:shadharat-dhahab p. 798-799}."
  en: "In 595 came the riot of Fakhr al-Din al-Razi the author: he had reached Herat and won great honour from the state, which galled the Karramiyya. One day he sat with the ascetic Majd al-Din Ibn al-Qudwa and lorded over him, reviling and humiliating him; next day Ibn al-Qudwa's cousin preached — 'People, we say only what is sound from God's messenger; as for the saying of Arasilus, the unbelief of Ibn Sina and Farabi's philosophy, we know them not — yesterday someone reviled a shaykh of Islam who defends God's religion' — and wept, and made the people weep. The Karramiyya clamoured, rose on every side, and it became a fitna; the sultan sent troops to calm them and ordered al-Razi out of Herat {cite:shadharat-dhahab p. 798-799}."
