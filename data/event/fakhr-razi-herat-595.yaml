label: { ar: "فتنة فخر الدين الرازي بهراة سنة 595", en: "The Fakhr al-Din al-Razi affair at Herat, 595 AH", es: "El caso de Fakhr al-Din al-Razi en Herat, 595 AH.", fr: "L'affaire Fakhr al-Din al-Razi à Hérat, 595 AH", ur: "فخر الدین الرازی معاملہ ہرات، 595ھ" }
summary:
  ar: "في سنة خمس وتسعين كانت فتنة فخر الدين الرازي صاحب التصانيف؛ وذلك أنه قدم هراة ونال إكراماً عظيماً من الدولة فاشتد ذلك على الكرامية، فاجتمع يوماً هو والزاهد مجد الدين ابن القدوة فاستطال فخر الدين على ابن القدوة وشتمه وأهانه، فلما كان من الغد جلس ابن عم مجد الدين فوعظ الناس وقال: أيها الناس لا نقول إلا ما صح عن رسول الله، وأما قول أرسلو وكفريات ابن سينا وفلسفة الفارابي فلا نعلمها، فلا شك يشتم بالأمس شيخ من شيوخ الإسلام يذب عن دين الله — وبكى فأبكى الناس وضجت الكرامية وثاروا من كل ناحية وحصلت الفتنة، فأرسل السلطان الجند فسكنهم وأمر الرازي بالخروج من هراة {cite:shadharat-dhahab p. 798-799}."
  en: "In 595 came the riot of Fakhr al-Din al-Razi the author: he had reached Herat and won great honour from the state, which galled the Karramiyya. One day he sat with the ascetic Majd al-Din Ibn al-Qudwa and lorded over him, reviling and humiliating him; next day Ibn al-Qudwa's cousin preached — 'People, we say only what is sound from God's messenger; as for the saying of Arasilus, the unbelief of Ibn Sina and Farabi's philosophy, we know them not — yesterday someone reviled a shaykh of Islam who defends God's religion' — and wept, and made the people weep. The Karramiyya clamoured, rose on every side, and it became a fitna; the sultan sent troops to calm them and ordered al-Razi out of Herat {cite:shadharat-dhahab p. 798-799}."
  es: "En 595 se produjo el motín del autor Fakhr al-Din al-Razi: había llegado a Herat y obtenido grandes honores del estado, lo que irritó a los Karramiyya. Un día se sentó con el asceta Majd al-Din Ibn al-Qudwa y lo dominó, insultándolo y humillándolo; al día siguiente, el primo de Ibn al-Qudwa predicó: «¡Gente, solo decimos lo que es auténtico del mensajero de Dios! En cuanto a las palabras de Arasilo, la incredulidad de Ibn Sina y la filosofía de Farabi, no las conocemos; ayer alguien insultó a un jeque del Islam que defiende la religión de Dios», y lloró, haciendo llorar a la gente. Los Karramiyya clamaron, se alzaron por todos lados y se convirtió en una fitna; el sultán envió tropas para calmarlos y ordenó a al-Razi que abandonara Herat {cite:shadharat-dhahab p. 798-799}."
  fr: "En 595, Fakhr al-Din al-Razi, l'auteur, se rebella: arrivé à Hérat, il y avait reçu de grands honneurs, ce qui exaspéra les Karramites. Un jour, il s'assit avec l'ascète Majd al-Din Ibn al-Qudwa et le domina, l'injuriant et l'humiliant. Le lendemain, le cousin d'Ibn al-Qudwa prêcha: « Ô gens, nous ne disons que ce qui est authentique et venant du Messager de Dieu. Quant aux paroles d'Arasilus, à l'incroyance d'Ibn Sina et à la philosophie de Farabi, nous ne les connaissons pas. Hier, quelqu'un a injurié un cheikh de l'islam qui défend la religion de Dieu. » Puis il pleura, et le peuple pleura. Les Karramites, furieux, se soulevèrent de toutes parts, et la situation dégénéra en fitna. Le sultan envoya des troupes pour les calmer et ordonna à al-Razi de quitter Hérat. 798-799}."
  ur: "595 میں فخرالدین الرازی مصنف کا فساد برپا ہوا: وہ ہرات پہنچ گیا تھا اور ریاست کی طرف سے بڑا اعزاز حاصل کیا تھا، جس نے کرمیہ کو شکست دی تھی۔ ایک دن وہ مجدالدین ابن القدوی کے پاس بیٹھا اور اس پر مسلط ہوا، اسے گالی گلوچ اور تذلیل کی۔ اگلے دن ابن القدوہ کے کزن نے تبلیغ کی - 'لوگو، ہم صرف وہی کہتے ہیں جو خدا کے رسول کی طرف سے آواز ہے؛ جہاں تک ارسیلس کا قول ہے، ابن سینا کا کفر اور فارابی کا فلسفہ، ہم انہیں نہیں جانتے - کل کسی نے اسلام کے ایک شیخ کو گالی دی جو خدا کے دین کا دفاع کرتا ہے\" - اور رویا اور لوگوں کو رلا دیا۔ کرمیہ شور مچایا، ہر طرف اٹھ کھڑا ہوا، اور یہ فتنہ بن گیا۔ سلطان نے انہیں پرسکون کرنے کے لیے فوج بھیجی اور الرازی کو ہرات سے نکلنے کا حکم دیا۔ 798-799}۔"
