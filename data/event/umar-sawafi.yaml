label: { ar: "إصفاء عمر صوافي السواد", en: "Umar's Appropriation of the Sawafi" }
summary:
  ar: "عند البلاذري عن عبد الملك بن أبي حرة عن أبيه — وكان أخبر الناس بالسواد — أصفى عمر بن الخطاب عشر أرضين من السواد وحفظ سبعاً وذهب عنه ثلاث: أصفى الآجام ومغايض الماء وأرض كسرى وكل دير يزيد وأرض من قتل في المعركة وأرض من هرب وفي روايته الأخرى أرض من قتل في الحرب وأرض من هرب وكل أرض كسرى وكل أرض لأهل بيته وكل مغيض ماء وكل دير يزيد وكل صافية اصطفاها كسرى فبلغت صوافيه سبعة آلاف ألف درهم فلما كفت وقعت الجماجم أحرق الناس الديوان فأخذ كل قوم ما يليهم."
  en: "In al-Baladhuri via Abd al-Malik ibn Abi Hurra from his father — the most knowledgeable man on the Sawad — Umar appropriated ten lands of the Sawad, of which he memorized seven and three escaped him: the marshes and water-sinks, Khusraw's land, every monastery of Yazid, the land of those killed in the battle, and the land of those who fled; in his fuller recension — land of those killed in the war, of those who fled, all Khusraw's land and all his family's, every water-sink, every monastery of Yazid, and every safiyya Khusraw had appropriated — reaching seven million dirhams' revenue; when they sufficed and the Jamajim broke out, the people burned the register and each took what adjoined them."
