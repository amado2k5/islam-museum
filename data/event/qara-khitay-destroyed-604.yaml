summary:
  ar: "في سنة أربع وستمائة اجتمع بقية الخطا بملكهم حين سمعت طائفة عظيمة من التتر نازلة وراء بلاد تركستان بقيادة ملكهم كشلي خان بما فعل خوارزم شاه بالخطا فقصدوهم، فأرسل ملك الخطا إلى خوارزم شاه يعفو عما مضى ويطلب نجدته، وأرسل كشلي خان يطلب معونته على الخطا أعدائه وأعداء آبائه، فأجاب خوارزم شاه كلاً منهما أنه معه ضد خصمه وسار بعساكره حتى نزل قريباً من موضع التصاف فلم يخالطهم مخالطة يعلم بها أنه من أحدهما فكانت كل طائفة تظنه معها، فتواقع الخطا والتتر فانهزم الخطا هزيمة عظيمة فمال خوارزم شاه عليهم يقتل ويأسر وينهب ولم يسلم منهم إلا طائفة يسيرة تحصنت مع ملكهم بموضع تحيط به الجبال لا طريق إليه إلا من جهة واحدة، وانضم منهم طائفة إلى عسكره، ثم طلب كشلي خان مقاسمة بلاد الخطا فقال خوارزم شاه ليس لك عندي غير السيف، فسار يراوده ويغير على أثقاله فكتب إليه كشلي خان ليس هذا فعل الملوك هذا فعل اللصوص فإن كنت سلطاناً فلنلتق، فلم يجبه وأمر أهل الشاش وفرغانة وإسفيجاب وكاسان بالجلاء منها إلى بلاد الإسلام وخربها خوفاً أن يملكها التتر، ثم اتفق خروج تتر آخرين ملكهم جنكز خان على كشلي خان فاشتغل به عن خوارزم شاه فعبر النهر إلى خراسان {cite:kamil-ibn-al-athir p. 339-340}."
  en: "In 604 the surviving Khitai gathered under their king when word came that a great body of Tatars was advancing from beyond the lands of Turkistan under their king Kushli Khan, because of what Khwarazm-shah had done to the Khitai; they marched against them. The Khitai king sent to Khwarazm-shah asking him to overlook the past and come to his aid; Kushli Khan also sent to him, seeking his help against the Khitai, his enemies and the enemies of his fathers. Khwarazm-shah answered each that he was with him against the other, and marched his armies until he camped near the place of the encounter, without mixing with either side in a way that showed which he was, so that each took him to be on its side. The Khitai and the Tatars clashed, and the Khitai were routed in a great defeat. Khwarazm-shah fell upon them, killing, capturing and plundering; only a small band escaped, sheltering with their king in a place ringed by mountains with a single approach, and some of them joined his army. Kushli Khan then asked to share the lands of the Khitai, and Khwarazm-shah replied, 'You have nothing from me but the sword.' He advanced, courting him and raiding his baggage. Kushli Khan wrote to him: 'This is not the conduct of kings; it is the conduct of thieves. If you are a sultan, let us meet.' He did not answer, and ordered the people of Shash, Farghana, Isfijab and Kasan to leave for the lands of Islam, laying them waste for fear the Tatars would seize them. Then it happened that other Tatars, under their king Genghis Khan, rose against Kushli Khan and occupied him, and Khwarazm-shah crossed the river into Khurasan {cite:kamil-ibn-al-athir p. 339-340}."
  es: "En 604, los khitai supervivientes se reunieron bajo su rey cuando llegó la noticia de que un gran ejército de tártaros avanzaba desde más allá de las tierras de Turkistán, bajo el mando de su rey Kushli Khan, debido a lo que Khwarazm-shah había hecho a los khitai; marcharon contra ellos. El rey khitai envió un mensajero a Khwarazm-shah pidiéndole que olvidara el pasado y acudiera en su ayuda; Kushli Khan también le envió un mensajero, solicitando su ayuda contra los khitai, sus enemigos y los enemigos de sus antepasados. Khwarazm-shah respondió a cada uno que estaba con ellos contra el otro, y marchó con sus ejércitos hasta acampar cerca del lugar del encuentro, sin mezclarse con ninguno de los bandos de manera que revelara a cuál pertenecía, de modo que cada uno lo tomó como uno de los suyos. Los khitai y los tártaros se enfrentaron, y los khitai fueron derrotados estrepitosamente. Khwarazm-shah los atacó, matándolos, capturándolos y saqueándolos; Solo un pequeño grupo escapó, refugiándose con su rey en un lugar rodeado de montañas con un único acceso, y algunos de ellos se unieron a su ejército. Kushli Khan pidió entonces compartir las tierras de los Khitai, y Khwarazm-shah respondió: «No tienes nada de mí salvo la espada». Avanzó, cortejándolo y saqueando su equipaje. Kushli Khan le escribió: «Esta no es la conducta de los reyes; es la conducta de los ladrones. Si eres sultán, reunámonos». No respondió y ordenó a la gente de Shash, Farghana, Isfijab y Kasan que partieran hacia las tierras del Islam, devastándolas por temor a que los tártaros las tomaran. Entonces sucedió que otros tártaros, bajo el mando de su rey Genghis Khan, se alzaron contra Kushli Khan y lo ocuparon, y Khwarazm-shah cruzó el río hacia Jorasán {cite:kamil-ibn-al-athir p. 339-340}."
  fr: "En 604, les Khitaï survivants se rassemblèrent sous leur roi lorsqu'ils apprirent qu'une importante armée tatare avançait depuis les terres du Turkestan sous le commandement de leur roi Kushli Khan, en représailles aux exactions commises par Khwarezm-shah contre les Khitaï. Ils marchèrent alors contre eux. Le roi khitaï envoya une lettre à Khwarezm-shah pour le supplier de passer outre le passé et de venir à son secours. Kushli Khan fit de même, sollicitant son aide contre les Khitaï, ses ennemis et les ennemis de ses ancêtres. Khwarezm-shah répondit à chacun qu'il était de leur côté contre l'autre et fit marcher ses armées jusqu'à camper près du lieu de l'affrontement, sans se mêler à aucun des deux camps de manière à révéler son allégeance, de sorte que chacun le crut allié. Les Khitaï et les Tatars s'affrontèrent et les Khitaï furent mis en déroute. Khwarezm-shah se jeta sur eux, les tuant, les capturant et les pillant. Seul un petit groupe parvint à s'échapper, se réfugiant auprès de son roi dans un lieu cerné de montagnes, accessible par une unique route. Certains rejoignirent son armée. Kushli Khan demanda alors à partager les terres des Khitaï, mais Khwarezm-shah répondit: « Tu n'auras de moi que l'épée. » Il s'avança, le courtisant et pillant ses bagages. Kushli Khan lui écrivit: « Ce n'est pas la conduite d'un roi, c'est celle d'un voleur. Si tu es un sultan, rencontrons-nous. » Il ne répondit pas et ordonna aux habitants de Shash, Farghana, Isfijab et Kasan de partir pour les terres d'Islam, les dévastant de peur que les Tatars ne s'en emparent. Or, d'autres Tatars, sous le règne de Gengis Khan, se soulevèrent contre Kushli Khan et l'occupèrent. Khwarezm-shah traversa alors le fleuve pour se réfugier au Khorasan (voir Kamil ibn al-Athir, p. 339-340)."
  ur: "604 میں زندہ بچ جانے والے خیطائی اپنے بادشاہ کے ماتحت جمع ہوئے جب یہ خبر آئی کہ تاتاریوں کا ایک بڑا گروہ ان کے بادشاہ کشلی خان کے ماتحت ترکستان کی سرزمین سے آگے بڑھ رہا ہے، کیونکہ خوارزم شاہ نے خیطائی کے ساتھ کیا کیا تھا۔ انہوں نے ان کے خلاف مارچ کیا۔ خیتائی بادشاہ نے خوارزم شاہ کے پاس بھیجا اور اس سے کہا کہ وہ ماضی کو نظر انداز کرے اور اس کی مدد کرے۔ کشلی خان نے بھی اس کے پاس بھیجا، خیطائی، اس کے دشمنوں اور اس کے باپ کے دشمنوں کے خلاف اس کی مدد طلب کی۔ خوارزم شاہ نے ہر ایک کو جواب دیا کہ وہ دوسرے کے خلاف اس کے ساتھ ہے، اور اپنی فوجوں کو آگے بڑھایا یہاں تک کہ اس نے مقابلے کی جگہ کے قریب ڈیرے ڈال لیے، دونوں طرف سے اس طرح سے گھل ملائے بغیر کہ جس سے ظاہر ہوتا ہے کہ وہ کیا ہے، تاکہ ہر ایک اسے اپنی طرف لے جائے۔ خیطائی اور تاتار آپس میں لڑ پڑے، اور خیطائی کو زبردست شکست ہوئی۔ خوارزم شاہ ان پر ٹوٹ پڑا، قتل، قبضہ اور لوٹ مار۔ صرف ایک چھوٹا سا دستہ بچ نکلا، اپنے بادشاہ کے ساتھ پہاڑوں سے گھری ہوئی جگہ پر پناہ لی اور ان میں سے کچھ اس کی فوج میں شامل ہو گئے۔ کشلی خان نے پھر خیتائی کی زمینیں بانٹنے کو کہا تو خوارزم شاہ نے جواب دیا، 'تمہارے پاس مجھ سے تلوار کے سوا کچھ نہیں ہے۔' اس نے آگے بڑھ کر اس کا ساتھ دیا اور اس کے سامان پر چھاپہ مارا۔ کشلی خان نے اسے لکھا: 'یہ بادشاہوں کا طرز عمل نہیں ہے۔ یہ چوروں کا طرز عمل ہے۔ اگر آپ سلطان ہیں تو ہمیں ملنے دو۔ اس نے کوئی جواب نہیں دیا، اور شش، فرغانہ، اسفجاب اور کسان کے لوگوں کو حکم دیا کہ وہ اسلام کی سرزمین کی طرف نکل جائیں، اس خوف سے کہ تاتاری ان پر قبضہ کر لیں گے۔ پھر یوں ہوا کہ دوسرے تاتاری اپنے بادشاہ چنگیز خان کے ماتحت کشلی خان کے خلاف اٹھ کھڑے ہوئے اور اس پر قبضہ کر لیا اور خوارزم شاہ نے دریا عبور کر کے خراسان میں داخل کر دیا۔ 339-340}۔"
  tr: "Hicri 604 yılında (Miladi 1206/1207), Harezm Şah'ın Hıtaylılara yaptıklarını duyan ve Türkistan ötesinden gelen Tatarların büyük bir birliği, kralları Kaşli Han önderliğinde, geriye kalan Hıtaylılar krallarıyla bir araya geldi. Tatarlar onlara karşı yürüdüler ve Hıtay kralı, geçmişteki hataları için af dilemek ve yardım istemek üzere Harezm Şah'a bir mesaj gönderdi. Kaşli Han da, Harezm Şah'tan Hıtaylılara, düşmanlarına ve atalarının düşmanlarına karşı yardım istedi. Harezm Şah her ikisine de cevap vererek, düşmanlarına karşı desteğini taahhüt etti. Ordusuyla birlikte savaş alanının yakınında kamp kurana kadar yürüdü, ancak bağlılığını belli edecek şekilde hiçbir tarafla kaynaşmadı. Her grup onun kendi tarafında olduğunu varsaydı. Hıtaylılar ve Tatarlar çatıştı ve Hıtaylılar ezici bir yenilgiye uğradı. Harezm Şah daha sonra onlara saldırdı, öldürdü, esir aldı ve yağmaladı. Sadece küçük bir grup kaçarak, krallarının yanına, sadece tek yönden ulaşılabilen dağlık bir yere sığındı. Hitaylıların bir kısmı onun ordusuna katıldı. Kaşli Han daha sonra Hitaylı topraklarından pay istedi, ancak Harezm Şah, \"Benden kılıçtan başka hiçbir şey almayacaksın\" diye cevap verdi. Kaşli Han daha sonra Harezm Şah'ı yatıştırmaya ve kervanına baskın yapmaya çalıştı. Kaşli Han ona şöyle yazdı: \"Hitaylılara böyle davranılmaz. Krallar bunu hırsızlar gibi yapıyorlar. Eğer bir sultansanız, görüşelim.\" Ona cevap vermedi ve Şaş, Fergana, İsfijab ve Kasan halkına İslam topraklarına gitmelerini emretti ve Tatarların buraları ele geçirmesinden korkarak onları yok etti. Daha sonra Cengiz Han'ın kralı olduğu başka bir Tatar grubu Kaşli Han'a saldırdı, böylece Kaşli Han Harezm Şah yerine onlarla meşgul oldu ve nehri geçerek Horasan'a gitti. {alıntı: kamil-ibn-el-esir s. 339-340}."
  id: "Pada tahun 604 H (1206/1207 M), sisa-sisa suku Khitai berkumpul bersama raja mereka ketika kontingen besar Tatar, yang dipimpin oleh raja mereka Kashli Khan, turun dari luar Turkestan, setelah mendengar apa yang telah dilakukan Khwarazm Shah terhadap suku Khitai. Mereka berbaris melawan mereka, dan raja Khitai mengirim pesan kepada Khwarazm Shah untuk meminta maaf atas pelanggaran masa lalu dan meminta bantuannya. Kashli Khan juga mengirim pesan meminta bantuan Khwarazm Shah melawan suku Khitai, musuh-musuhnya, dan musuh-musuh leluhurnya. Khwarazm Shah menjawab masing-masing pesan, menjanjikan dukungannya melawan lawan mereka. Ia berbaris dengan pasukannya hingga berkemah di dekat medan pertempuran, tetapi ia tidak berbaur dengan pihak mana pun dengan cara yang akan mengungkapkan kesetiaannya. Masing-masing kelompok menganggapnya berada di pihak mereka. Suku Khitai dan Tatar bentrok, dan suku Khitai menderita kekalahan telak. Khwarazm Shah kemudian menyerang mereka, membunuh, menangkap, dan menjarah. Hanya sekelompok kecil yang berhasil melarikan diri, berlindung bersama raja mereka di lokasi pegunungan yang hanya dapat diakses dari satu arah. Beberapa orang Khitai bergabung dengan pasukannya. Kashli Khan kemudian menuntut bagian dari tanah Khitai, tetapi Khwarazm Shah menjawab, \"Kau tidak akan menerima apa pun dariku kecuali pedang.\" Kashli Khan kemudian mencoba untuk menenangkan Khwarazm Shah dan merampok kereta barangnya. Kashli Khan menulis kepadanya, \"Bukan begini caramu memperlakukan orang Khitai.\" Para raja melakukan ini seperti pencuri. Jika kau seorang sultan, maka mari kita bertemu. Dia tidak menjawabnya dan memerintahkan penduduk Shash, Fergana, Isfijab, dan Kasan untuk meninggalkan mereka menuju tanah Islam dan menghancurkan mereka karena takut Tatar akan merebutnya. Kemudian kelompok Tatar lain, yang rajanya Genghis Khan menyerang Kashli Khan, sehingga dia sibuk berurusan dengan Genghis Khan alih-alih Khwarazm Shah, dan dia menyeberangi sungai ke Khorasan. {mengutip: kamil-ibn-al-athir hal. 339-340}."
