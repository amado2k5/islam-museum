id: event/al-hadi-has-the-slave-ibn-bilal-killed-and-crucified-at-al-darb-gate-294
class: event
kind: other
label:
  ar: "الهادي يأمر بقتل العبد ابن بلال وصلبه على باب الدرب، سنة 294هـ، ص340"
  en: "Al-Hadi orders the slave Ibn Bilal killed and crucified at the gate of al-Darb, 294 AH, p. 340"
  ur: "ہادی کا غلام ابن بلال کو قتل کرنے اور باب الدرب پر صلیب دینے کا حکم، 294ھ، ص340"
  es: "Al-Hadi ordena que el esclavo Ibn Bilal sea asesinado y crucificado en la puerta de al-Darb, 294 AH, pág. 340."
  fr: "Al-Hadi ordonne que l'esclave Ibn Bilal soit tué et crucifié à la porte d'al-Darb, 294 AH, p. 340"
summary:
  ar: "أخرج الهادي عبداً من الحبس، فأمر الحريني بقتله بسيفه، ثم صُلبت جثته على باب الدرب، فاطمأنت البلد وهابها أهلها بحسب الكتاب."
  en: "Al-Hadi had a slave taken out of prison, gave his sword to al-Huraini to kill him, and the body was crucified at the gate of al-Darb. According to the book the town grew calm and was in awe of the order."
  ur: "ہادی نے ایک غلام کو قید سے نکلوایا اور حریبی کو اپنی تلوار دے کر اسے قتل کرنے کا حکم دیا، پھر لاش باب الدرب پر صلیب دی گئی۔ کتاب کے مطابق شہر پرسکون ہوا اور لوگ اس حکم سے مرعوب ہوئے۔"
  es: "Al-Hadi hizo liberar a un esclavo de la cárcel, le entregó su espada a al-Huraini para que lo matara, y el cuerpo fue crucificado en la puerta de al-Darb. Según el libro, la ciudad se calmó y quedó impresionada por la orden."
  fr: "Al-Hadi fit libérer un esclave de prison, remit son épée à al-Huraini pour qu'il le tue, et le corps fut crucifié à la porte d'al-Darb. Selon le livre, la ville retrouva son calme et fut saisie de respect pour cet ordre."
