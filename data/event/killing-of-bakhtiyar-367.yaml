label: { ar: "قتل بختيار بن معز الدولة", en: "The killing of Bakhtiyar ibn Mu'izz al-Dawla", es: "El asesinato de Bakhtiyar ibn Mu'izz al-Dawla", fr: "Le meurtre de Bakhtiyar ibn Mu'izz al-Dawla", ur: "بختیار بن معز الدولہ کا قتل", tr: "Bakhtiar ibn Mu'izz al-Dawla öldürüldü", id: "Bakhtiar bin Mu'izz al-Dawla terbunuh" }
summary:
  ar: "في سنة 367هـ سار بختيار من بغداد عازماً على قصد الشام مع حمدان بن ناصر الدولة فأشار حمدان بقصد الموصل لكثرة أموالها، وكان عضد الدولة حلّفه أن لا يقصد ولاية أبي تغلب فنكث وقصدها فلما صار إلى تكريت أتته رسل أبي تغلب تسأله أن يقبض على أخيه حمدان ويسلمه إليه فقبض بختيار على حمدان وسلّمه إلى نواب أبي تغلب ليحبسه في قلعة، وسار بختيار إلى الحديثة واجتمع مع أبي تغلب ومعه نحو عشرين ألف مقاتل فالتقوا مع عضد الدولة بقصر الحصى بنواحي تكريت ثامن عشر شوال فهزمهما وأسر بختيار وأحضر عند عضد الدولة فلم يأذن بإدخاله إليه وأمر بقتله بمشورة أبي النجا طاهر بن إبراهيم وكان عمر بختيار إحدى وثلاثين سنة وملك إحدى عشرة سنة وشهوراً {cite:kamil-ibn-al-athir p. 506-507}."
  en: "In 367 Bakhtiyar broke his oath not to march on Abu Taghlib's lands, handed his own cousin Hamdan over for prison, and joined the Hamdanid at Qasr al-Hissa by Takrit with twenty thousand men; on 18 Shawwal Adud al-Dawla routed them, refused him audience and had him killed — aged thirty-one after eleven years' rule {cite:kamil-ibn-al-athir p. 506-507}."
  es: "En 367, Bakhtiyar rompió su juramento de no marchar sobre las tierras de Abu Taghlib, entregó a su propio primo Hamdan para que fuera encarcelado y se unió a los Hamdaníes en Qasr al-Hissa, junto a Takrit, con veinte mil hombres; el 18 de Shawwal, Adud al-Dawla los derrotó, le negó audiencia y lo mandó matar, a la edad de treinta y un años, tras once años de gobierno {cite:kamil-ibn-al-athir p. 506-507}."
  fr: "En 367, Bakhtiyar rompit son serment de ne pas marcher sur les terres d'Abu Taghlib, livra son propre cousin Hamdan à la prison et rejoignit les Hamdanides à Qasr al-Hissa près de Takrit avec vingt mille hommes; le 18 Shawwal, Adud al-Dawla les mit en déroute, lui refusa une audience et le fit tuer — à l'âge de trente et un ans après onze ans de règne {cite:kamil-ibn-al-athir p. 506-507}."
  ur: "367 میں بختیار نے ابو تغلب کی سرزمین پر کوچ نہ کرنے کا حلف توڑ دیا، اپنے چچا زاد بھائی حمدان کو جیل کے حوالے کر دیا، اور بیس ہزار آدمیوں کے ساتھ تکریت کے ذریعے قصر الحصہ میں ہمدانیوں میں شامل ہو گیا۔ 18 شوال عود الدولہ نے انہیں شکست دی، حاضرین سے انکار کر دیا اور گیارہ سال کی حکومت کے بعد اکتیس سال کی عمر میں قتل کر دیا۔ 506-507}۔"
  tr: "Hicri 367 yılında Bakhtiyar, Hamdan bin Nasir el-Davla ile birlikte Suriye'ye gitmek amacıyla Bağdat'tan yola çıktı. Hamdan, zenginliği nedeniyle Musul'a gitmeyi önerdi. Adud el-Davla, ona Ebu Teğlib vilayetine gitmemesi için yemin ettirmişti, ancak Bakhtiyar yeminini bozarak oraya gitti. Tikrit'e vardığında, Ebu Teğlib'den gelen elçiler ona kardeşi Hamdan'ı tutuklayıp kendisine teslim etmesini istediler. Bakhtiyar, Hamdan'ı tutuklayıp Ebu Teğlib'in adamlarına teslim ederek bir kaleye hapsetti. Bakhtiyar, el-Haditha'ya giderek yanında yaklaşık yirmi bin savaşçısı olan Ebu Teğlib ile buluştu. Şevval ayının on sekizinci günü Tikrit yakınlarındaki Kasr el-Hasa'da Adud el-Davla ile karşılaştılar. Adud el-Davla onları yenerek Bakhtiyar'ı esir aldı. Bakhtiyar, Adud al-Dawla'nın huzuruna getirildi, ancak Adud al-Dawla onun kendisine getirilmesine izin vermedi ve Ebu el-Neca Tahir bin İbrahim'in tavsiyesi üzerine öldürülmesini emretti. Bakhtiyar otuz bir yaşındaydı ve on bir yıl on bir ay hüküm sürdü. {kaynak: Kamil İbn el-Athir, s. 506-507}"
  id: "Pada tahun 367 H, Bakhtiyar berangkat dari Baghdad dengan maksud pergi ke Suriah bersama Hamdan bin Nasir al-Dawla. Hamdan menyarankan untuk pergi ke Mosul karena kekayaannya yang melimpah. Adud al-Dawla telah bersumpah kepadanya untuk tidak pergi ke provinsi Abu Taghlib, tetapi ia melanggar sumpahnya dan pergi ke sana. Ketika ia sampai di Tikrit, utusan dari Abu Taghlib datang kepadanya meminta agar ia menangkap saudaranya, Hamdan, dan menyerahkannya kepadanya. Bakhtiyar menangkap Hamdan dan menyerahkannya kepada wakil Abu Taghlib untuk dipenjarakan di sebuah benteng. Bakhtiyar pergi ke al-Haditha dan bertemu dengan Abu Taghlib, yang memiliki sekitar dua puluh ribu pejuang bersamanya. Mereka bertemu dengan Adud al-Dawla di Qasr al-Hasa di sekitar Tikrit pada tanggal 18 Syawal. Ia mengalahkan mereka dan menangkap Bakhtiyar. Ia dibawa menghadap Adud al-Dawla, yang tidak mengizinkannya dibawa masuk dan memerintahkan agar ia dibunuh atas saran Abu al-Naja Tahir bin Ibrahim. Bakhtiyar berumur tiga puluh satu tahun dan memerintah selama sebelas tahun sebelas bulan. {cite:kamil-ibn-al-athir p. 506-507}."
