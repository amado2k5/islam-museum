label: { ar: "إعدام الخوارج القادمين من الموصل", en: "Execution of Kharijites arriving from Mosul", es: "Ejecución de jariyitas que llegaban de Mosul.", fr: "Exécution des Kharijites arrivant de Mossoul", ur: "موصل سے آنے والے خارجیوں کو پھانسی دینا", tr: "Musul'dan gelen Haricilerin idamı", id: "Eksekusi terhadap kaum Kharijites yang datang dari Mosul." }
summary:
  ar: "في سنة ثمانين ومائتين وجّه يوسف بن أبي الساج اثنين وثلاثين نفسًا من الخوارج من طريق الموصل، فضُربت أعناق خمسة وعشرين منهم وصُلبوا وحُبس الباقون {cite:muntazam-ibn-al-jawzi p. 142}."
  en: "In 280 AH Yusuf ibn Abi'l-Saj sent thirty-two Kharijites down the Mosul road; twenty-five were beheaded and gibbeted, the rest imprisoned {cite:muntazam-ibn-al-jawzi p. 142}."
  es: "En el año 280 AH, Yusuf ibn Abi'l-Saj envió a treinta y dos jariyitas por el camino de Mosul; veinticinco fueron decapitados y colgados en la horca, el resto encarcelado {cite:muntazam-ibn-al-jawzi p. 142}."
  fr: "En 280 AH, Yusuf ibn Abi'l-Saj envoya trente-deux Kharijites sur la route de Mossoul; vingt-cinq furent décapités et pendus, les autres emprisonnés {cite:muntazam-ibn-al-jawzi p. 142}."
  ur: "280 ہجری میں یوسف بن ابی السج نے بتیس خارجیوں کو موصل کی سڑک پر بھیجا۔ پچیس کے سر قلم کیے گئے اور جبتیں دی گئیں، باقی کو قید کر دیا گیا۔ 142}۔"
  tr: "Hicri 280 yılında Yusuf ibn Abi al-Saj, Musul yönünden otuz iki Hariciyi gönderdi. Bunlardan yirmi beşi başları kesilerek çarmıha gerildi, geri kalanlar ise hapsedildi. {cite:muntazam-ibn-al-jawzi s. 142}"
  id: "Pada tahun 280 H, Yusuf bin Abi al-Saj mengirim tiga puluh dua orang Kharijites dari arah Mosul. Dua puluh lima dari mereka dipenggal dan disalib, dan sisanya dipenjara. {cite:muntazam-ibn-al-jawzi p. 142}."
