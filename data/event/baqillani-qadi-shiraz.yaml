label:
  ar: "الباقلاني قاضياً خارج بغداد وزائراً لشيراز، نحو ٣٦٠–٣٧٢هـ"
  en: "Al-Baqillani serves as qadi outside Baghdad and visits Shiraz, c. 970-983"
  ur: "باقلانی بغداد سے باہر قاضی کے منصب پر اور شیراز کا دورہ، تقریباً 970–983ء"
summary:
  ar: "تولى الباقلاني القضاء مدة خارج العاصمة بغداد، وتذكر المصادر زيارته لشيراز ولبلاط الروم؛ وكانت هذه السنوات من حياته أيام عضد الدولة بن بويه الذي بلغت دولته ذروتها في العراق وفارس {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}."
  en: "For a time al-Baqillani exercised the office of qadi outside the capital, Baghdad, and the sources mention visits to Shiraz and to the Byzantine court — years that fell within the amirate of Adud al-Dawla ibn Buwayh, whose power was then at its zenith in Iraq and Fars {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}."
  ur: "باقلانی نے کچھ عرصہ دارالحکومت بغداد سے باہر قاضی کا منصب انجام دیا، اور مصادر ان کے شیراز اور دربار روم کے دوروں کا ذکر کرتے ہیں — یہ زمانہ عضد الدولہ بن بویہ کے ایام امارت تھا جس کی قوت عراق اور فارس میں اپنے عروج پر تھی {cite:encyclopaedia-of-islam-2 vol. 1 p. 1018}۔"
