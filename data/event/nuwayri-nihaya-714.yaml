class: event
kind: publication
label:
  ar: "بدء تأليف «نهاية الأرب»: المجلد الأول مؤرخ ٧١٤هـ/١٣١٤م"
  en: "Composition of the Nihaya begins: volume one dated 714/1314"
  ur: "نہایۃ الارب کی تصنیف کا آغاز: پہلی جلد مورخہ 714ھ/1314ء"
summary:
  ar: "بعد نحو ثمانية عشر عاماً في الإدارة ⁦(٦٩٨-٧١٦هـ تقريباً)⁩ اعتزل النويري العمل العام وتفرغ للأدب وتأليف موسوعته، وقد امتطى — على حد تعبيره في مقدمته — «صهوة المطالعة والتنقير» حتى صنّف عملاً يؤنسه في خمسة فنون؛ وأقدم مجلد ⁦(المجلد الأول، ص ١٦)⁩ يحمل تاريخ ٧١٤هـ/١٣١٤م، والمخطوط الوحيد الباقي بخطه من النسخة الأولى هو المجلد ١٩ بتاريخ ٩ جمادى الآخرة ٧١٨هـ/٨ أغسطس ١٣١٨م، والمجلدان ٢٩ و٣٠ مؤرخان ٧٢٥هـ/١٣٢٥م وقد زاد في الثلاثين بعد ٧٢٨هـ {cite:encyclopaedia-of-islam-2 vol. 8 p. 159}."
  en: "After some eighteen years in administration (about 698-716) al-Nuwayri retired from public life and gave himself to adab and to his encyclopaedia — he had, as he puts it in his introduction, mounted the war-horse of reading and investigation until he composed a work to keep him company in five funun. The earliest volume (vol. 1, p. 16) bears the date 714/1314; the sole surviving autograph of the first version is volume 19, dated 9 Jumada II 718/8 August 1318; volumes 29 and 30 are dated 725/1325 with additions to 30 made after 728 {cite:encyclopaedia-of-islam-2 vol. 8 p. 159}."
  ur: "انتظامیہ میں تقریباً اٹھارہ برس (698-716ھ) کے بعد نويری نے عوامی زندگی سے کنارہ کی اور ادب اور اپنے دائرۃ المعارف کی تصنیف میں لگ گئے — اپنے مقدمے کے الفاظ میں انہوں نے مطالعہ و تنقیر کا جنگجو گھوڑا سوار کیا یہاں تک کہ پانچ فنوں کا ایک مؤنس کام مرتب کیا۔ ابتدائی جلد (جلد 1، ص 16) پر 714ھ/1314ء کی تاریخ ہے؛ پہلی نسخے کا واحد باقی خودنوشتہ جلد 19 ہے، مورخہ 9 جمادی الثانی 718ھ/8 اگست 1318ء؛ جلدیں 29 اور 30 مورخہ 725ھ/1325ء ہیں مگر جلد 30 میں 728ھ کے بعد کی اضافے بھی ہیں {cite:encyclopaedia-of-islam-2 vol. 8 p. 159}۔"
