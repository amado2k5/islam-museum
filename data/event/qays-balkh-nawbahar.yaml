id: event/qays-balkh-nawbahar
class: event
kind: campaign
label: { ar: "حملة قيس على بلخ وخراب النوبهار", en: "Qays's Balkh Campaign and Nawbahar's Ruin" }
summary:
  ar: "ولى ابن عامر قيس بن الهيثم السلمي خراسان وكان أهل بادغيس وهراة وبوشنج وبلخ على نكثهم فسار إلى بلخ فخرب نوبهارها وكان الذي تولى ذلك عطاء بن السائب مولى بني الليث وهو الخشل وإنما سمي عطاء الخشل واتخذ قناطر على ثلاثة أنهار من بلخ على فرسخ فقيل قناطر عطاء ثم إن أهل بلخ سألوا الصلح ومراجعة الطاعة فصالحهم قيس ثم قدم على ابن عامر فضربه مائة وحبسه واستعمل عبد الله بن خازم فأرسل إليه أهل هراة وبوشنج وبادغيس فطلبوا الأمان والصلح فصالحهم وحمل إلى ابن عامر مالاً."
  en: "With Badghis, Herat, Bushanj and Balkh still on their breach, Ibn Amir sent Qays ibn al-Haytham against Balkh — its Nawbahar was ruined by Ata ibn al-Sa'ib, Banu al-Layth's mawla called al-Khashl, who also built the 'Qanatir Ata' over three rivers a farsakh out. Balkh sued for peace and return to obedience; Qays granted it — and Ibn Amir, when he presented himself, struck him a hundred lashes and imprisoned him. Ibn Khazim, appointed next, received Herat, Bushanj and Badghis's suit for aman, truced them, and bore their money to Ibn Amir."
