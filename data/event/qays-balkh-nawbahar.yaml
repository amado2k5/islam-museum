summary:
  ar: "ولى ابن عامر قيس بن الهيثم السلمي خراسان وكان أهل بادغيس وهراة وبوشنج وبلخ على نكثهم فسار إلى بلخ فخرب نوبهارها وكان الذي تولى ذلك عطاء بن السائب مولى بني الليث وهو الخشل وإنما سمي عطاء الخشل واتخذ قناطر على ثلاثة أنهار من بلخ على فرسخ فقيل قناطر عطاء ثم إن أهل بلخ سألوا الصلح ومراجعة الطاعة فصالحهم قيس ثم قدم على ابن عامر فضربه مائة وحبسه واستعمل عبد الله بن خازم فأرسل إليه أهل هراة وبوشنج وبادغيس فطلبوا الأمان والصلح فصالحهم وحمل إلى ابن عامر مالاً."
  en: "With Badghis, Herat, Bushanj and Balkh still on their breach, Ibn Amir sent Qays ibn al-Haytham against Balkh — its Nawbahar was ruined by Ata ibn al-Sa'ib, Banu al-Layth's mawla called al-Khashl, who also built the 'Qanatir Ata' over three rivers a farsakh out. Balkh sued for peace and return to obedience; Qays granted it — and Ibn Amir, when he presented himself, struck him a hundred lashes and imprisoned him. Ibn Khazim, appointed next, received Herat, Bushanj and Badghis's suit for aman, truced them, and bore their money to Ibn Amir."
  es: "Con Badghis, Herat, Bushanj y Balkh aún en rebeldía, Ibn Amir envió a Qays ibn al-Haytham contra Balkh; su Nawbahar había sido destruido por Ata ibn al-Sa'ib, el mawla de Banu al-Layth llamado al-Khashl, quien también construyó el 'Qanatir Ata' sobre tres ríos a un farsakh de distancia. Balkh pidió la paz y el retorno a la obediencia; Qays se lo concedió, e Ibn Amir, cuando se presentó, le propinó cien latigazos y lo encarceló. Ibn Khazim, nombrado a continuación, recibió la petición de paz de Herat, Bushanj y Badghis, les ofreció una tregua y llevó su dinero a Ibn Amir."
  fr: "Alors que Badghis, Hérat, Bushanj et Balkh persistaient dans leur conflit, Ibn Amir envoya Qays ibn al-Haytham contre Balkh. Son Nawbahar avait été ravagé par Ata ibn al-Sa'ib, le mawla des Banu al-Layth, surnommé al-Khashl, qui avait également construit le Qanatir Ata sur trois rivières, à un farsakh de là. Balkh demanda la paix et le retour à l'obéissance; Qays y consentit. Ibn Amir, lorsqu'il se présenta, le fit fouetter cent fois et l'emprisonna. Ibn Khazim, nommé ensuite, reçut la demande d'aman de Hérat, Bushanj et Badghis, conclut une trêve avec eux et apporta leur argent à Ibn Amir."
  ur: "بادغیس، ہرات، بوشنج اور بلخ ابھی تک ان کی خلاف ورزی پر ہیں، ابن عامر نے قیس بن الہیثم کو بلخ کے خلاف بھیجا - اس کے نوبہار کو عطا بن السائب، بنو لیث کے مولا الخشال نے تباہ کر دیا، جس نے دریائے قنطیر عطا کو بھی تین دریا کے اوپر بنایا تھا۔ بلخ نے امن اور فرمانبرداری کی طرف واپسی کے لیے مقدمہ دائر کیا۔ قیس نے اسے عطا کیا - اور ابن عامر نے جب اپنے آپ کو پیش کیا تو اسے سو کوڑے مارے اور اسے قید کر دیا۔ ابن خزیم، جو اگلا مقرر ہوا، نے ہرات، بوشنج اور بادغیس کے سوٹ امان کے لیے حاصل کیے، ان سے صلح کی، اور ان کی رقم ابن عامر کو دے دی۔"
  tr: "İbn Amir, Horasan valiliğine Kays bin Haytham Sülami'yi atadı. Bediş, Herat, Buşanj ve Belh halkı isyan halindeydi, bu yüzden Kays Belh'e gidip Nevber'ini yıktı. Bunu gerçekleştiren kişi, Beni El-Leyth'in azatlı kölesi Ata bin Sa'ib'di ve ona El-Haşal deniyordu. Ata'ya El-Haşal deniyordu. Belh'ten bir fersah uzaklıktaki üç nehir üzerine köprüler inşa etti ve bunlara Ata'nın köprüleri denildi. Bunun üzerine Belh halkı barış ve itaate dönmeyi istedi, Kays da onlarla barıştı. Sonra İbn Amir'in yanına geldi, İbn Amir onu yüz kere dövdü, hapse attı ve Abdullah bin Hazim'i vali olarak atadı. Herat, Buşanj ve Bediş halkı ona elçiler göndererek güvenlik ve barış istedi, Kays da onlarla barıştı ve İbn Amir'e para gönderdi."
  id: "Ibn Amir mengangkat Qais bin Al-Haytham Al-Sulami sebagai gubernur Khorasan. Penduduk Badghis, Herat, Bushanj, dan Balkh memberontak, sehingga ia bergerak ke Balkh dan menghancurkan Nawbahar-nya. Yang melakukan ini adalah Ata bin Al-Sa’ib, budak yang dibebaskan dari Banu Al-Layth, yang disebut Al-Khashal. Ata disebut Al-Khashal. Ia membangun jembatan di atas tiga sungai dari Balkh, sejauh satu farsakh, dan jembatan-jembatan itu disebut jembatan Ata. Kemudian penduduk Balkh meminta perdamaian dan agar kembali taat, sehingga Qais berdamai dengan mereka. Kemudian ia datang kepada Ibn Amir, sehingga Ibn Amir memukulinya seratus kali dan memenjarakannya serta mengangkat Abdullah bin Khazim. Penduduk Herat, Bushanj, dan Badghis mengirim utusan kepadanya dan meminta keselamatan dan perdamaian, sehingga ia berdamai dengan mereka dan mengirimkan uang kepada Ibn Amir."
