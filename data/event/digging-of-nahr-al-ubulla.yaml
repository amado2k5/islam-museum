label: { ar: "حفر نهر الأبلة", en: "Digging of the Ubulla Canal", es: "Excavación del canal de Ubulla", fr: "Creusement du canal d'Ubulla", ur: "اوبلا نہر کی کھدائی", tr: "Abla Nehri'nin Kazılması", id: "Penggalian Sungai Abla" }
summary:
  ar: "كان لدجلة العوراء خور يجري فيه ماء الأمطار ويتراجع ماؤها عند المد وينضب في الجزر طوله فرسخ وكان لحدّه مما يلي البصرة غورة تسمى الإجانة فأمر عمر أبا موسى أن يحتفر لأهل البصرة نهراً فابتدأ الحفر من الإجانة وقاده ثلاثة فراسخ حتى بلغ به البصرة فصار طول نهر الأبلة أربعة فراسخ ثم انطمّ منه ما بين البصرة وبين الحيري على قدر فرسخ وكان زياد على الديوان ويعم المال من قبل عبد الله بن عامر فأشار أن ينفذ الحفر فكان يدافع فلما شخص ابن عامر إلى خراسان أقرّ حفر أبي موسى على حاله وحفر النهر من حيث انطمّ حتى بلغ به البصرة وولى ذلك عبد الرحمن بن أبي بكرة فلما فتح الماء جعل يركض فرسه والماء يكاد يسبقه وقدم ابن عامر فغضب على زياد وقال إنما أردت أن تذهب بذكر النهر دوني فتباعد ما بينهما حتى ماتا وتباعد بسببه ما بين أولادهما وكان شرب الناس قبل ذلك من دير قاووس في دجلة وكانت الأرواح تدفنه."
  en: "Dijlat al-Awra's tidal rain-channel ran a farsakh, its Basra-side basin called al-Ijana; Umar ordered Abu Musa to dig the Basrans a canal — he began at al-Ijana, led it three farsakhs to Basra, making the Ubulla canal four — then the reach toward al-Hayri silted up. Ziyad, on the diwan under Abdallah ibn Amir, urged completing the dig and was stalled till Ibn Amir left for Khurasan; he resumed Abu Musa's channel to Basra with Abd al-Rahman ibn Abi Bakra in charge, who opened the water racing his horse as it nearly outran him. Ibn Amir returned angry — 'you meant to carry off the canal's fame' — and the estrangement held between their houses for life; before the canal, folk drank from Dayr Qawus on the Tigris, a spot the spirits haunted."
  es: "El canal de mareas de Dijlat al-Awra tenía una longitud de farsakh, y su cuenca del lado de Basora se llamaba al-Ijana. Umar ordenó a Abu Musa que excavara un canal para los basranos; comenzó en al-Ijana y lo extendió tres farsakhs hasta Basora, haciendo que el canal de Ubulla tuviera cuatro. Luego, el tramo hacia al-Hayri se colmató. Ziyad, en el diwan bajo el mando de Abdallah ibn Amir, instó a completar la excavación, pero se estancó hasta que Ibn Amir partió hacia Jorasán. Allí reanudó el canal de Abu Musa hacia Basora con Abd al-Rahman ibn Abi Bakra a cargo, quien abrió el agua a toda velocidad, haciendo correr a su caballo, que casi lo supera. Ibn Amir regresó furioso: «Querías robar la fama del canal». El distanciamiento entre sus familias duró toda la vida. Antes del canal, la gente bebía de Dayr Qawus en el Tigris, un lugar frecuentado por espíritus."
  fr: "Le canal d'écoulement des eaux de marée de Dijlat al-Awra s'étendait sur un farsakh, son bassin côté Bassora étant appelé al-Ijana. Umar ordonna à Abu Musa de creuser un canal vers Bassora. Il commença à al-Ijana et le prolongea sur trois farsakhs jusqu'à Bassora, portant ainsi la longueur du canal d'Ubulla à quatre. Cependant, la portion vers al-Hayri s'ensabla. Ziyad, siégeant au diwan sous l'autorité d'Abdallah ibn Amir, insista pour que les travaux soient achevés, mais il fut retardé jusqu'au départ d'Ibn Amir pour le Khorasan. Il reprit alors le canal d'Abu Musa vers Bassora, sous la direction d'Abd al-Rahman ibn Abi Bakra, qui inaugura le canal en courant avec son cheval, lequel faillit le distancer. Ibn Amir revint furieux: « Tu voulais t'approprier la renommée du canal ! » et leurs familles restèrent brouillées toute leur vie. Avant la construction du canal, les habitants buvaient l'eau de Dayr Qawus sur le Tigre, un lieu hanté par les esprits."
  ur: "دجلۃ العروہ کا سمندری طوفان ایک فرسخ چلاتا تھا، اس کا بصرہ کی طرف کا طاس جسے الاجانہ کہتے ہیں۔ عمر نے ابو موسیٰ کو بصریوں کو ایک نہر کھودنے کا حکم دیا - وہ الاجانہ سے شروع ہوا، اسے تین فرسخ کے فاصلے پر بصرہ تک لے گیا، ابلہ کی نہر کو چار بنا دیا - پھر الحیری کی طرف گاد اُڑ گیا۔ زیاد، عبداللہ ابن عامر کے ماتحت دیوان پر، کھدائی کو مکمل کرنے پر زور دیا اور ابن عامر کے خراسان روانہ ہونے تک رکا رہا۔ اس نے ابو موسی کے چینل کو بصرہ کے لیے انچارج عبدالرحمٰن ابن ابی بکرہ کے ساتھ دوبارہ شروع کیا، جس نے اپنے گھوڑے کو دوڑتے ہوئے پانی کو کھول دیا کیونکہ یہ قریب قریب اس سے آگے نکل گیا تھا۔ ابن عامر غصے سے واپس لوٹا - 'تمہارا مقصد نہر کی شہرت کو ختم کرنا تھا' - اور ان کے گھروں کے درمیان تاحیات اختلاف۔ نہر سے پہلے، لوگوں نے دجلہ پر دائر قووس سے پیا، ایک ایسی جگہ جہاں روحیں پریشان تھیں۔"
  tr: "Dicle Nehri'nin, yağmur sularının aktığı, gelgit yükseldiğinde sularının çekildiği ve alçak gelgitte kuruduğu bir kanalı vardı. Kanal bir fersah uzunluğundaydı ve Basra tarafındaki sınırı, el-İcana adı verilen bir çukurdu. Bu yüzden Ömer, Ebu Musa'ya Basra halkı için bir kanal kazmasını emretti. Ebu Musa, el-İcana'dan kazmaya başladı ve Basra'ya ulaşana kadar üç fersah boyunca ilerletti. Böylece Ubla Nehri'nin uzunluğu dört fersah oldu. Daha sonra Basra ile el-Hiri arasındaki kısım bir fersah dolduruldu. Ziyad, Divan'ın sorumlusuydu ve Abdullah bin Amer adına para topluyordu. Bu yüzden kazmanın yapılmasını önerdi, ancak Abdullah bin Amer buna karşı çıkıyordu. İbn Amer Horasan'a gittiğinde, Ebu Musa'nın kazmasını olduğu gibi onayladı ve doldurulan yerden Basra'ya ulaşana kadar kanalı kazdı. Bunun başına Abdurrahman bin Ebu Bekre'yi atadı. Suyun ağzını açınca atını koşturmaya başladı ve su neredeyse onu yutacaktı. İbn Amer geldi ve Ziyad'a kızarak, \"Sen sadece benden habersiz kanaldan bahsetmek istedin\" dedi. Böylece birbirlerinden uzaklaştılar ve öldüklerinde de bu durum devam etti; bu yüzden çocukları da birbirlerinden uzaklaştılar. Bundan önce insanlar Dicle'deki Dayr Qawus'tan su içerlerdi ve ruhlar onu gömerlerdi."
  id: "Sungai Tigris memiliki saluran tempat air hujan mengalir, dan airnya surut saat pasang dan mengering saat surut. Panjangnya satu farsakh, dan batasnya di sisi Basra adalah sebuah cekungan yang disebut al-Ijana. Maka Umar memerintahkan Abu Musa untuk menggali kanal bagi penduduk Basra. Maka ia mulai menggali dari al-Ijana dan melanjutkannya sejauh tiga farsakh hingga mencapai Basra. Sehingga panjang sungai al-Ubla menjadi empat farsakh. Kemudian bagian antara Basra dan al-Hiri diurug sejauh satu farsakh. Ziyad bertanggung jawab atas Diwan dan ia mengumpulkan uang atas nama Abdullah bin Amer. Maka ia menyarankan agar penggalian dilakukan, tetapi Abdullah menolak. Ketika Ibnu Amer pergi ke Khorasan, ia menyetujui penggalian Abu Musa sebagaimana adanya dan menggali kanal dari tempat yang diurug hingga mencapai Basra. Ia menugaskan Abd al-Rahman bin Abi Bakra untuk mengurus hal itu. Ketika ia membuka saluran air, ia mulai memacu kudanya dan air hampir menenggelamkannya. Ibnu Amer datang dan marah kepada Ziyad dan berkata, “Kau hanya ingin menyebut-nyebut kanal itu tanpa sepengetahuanku.” Maka mereka menjadi berjauhan sampai mereka meninggal, dan karena itu, anak-anak mereka pun menjadi berjauhan satu sama lain. Sebelumnya, orang-orang biasa minum dari Dayr Qawus di Sungai Tigris, dan roh-roh biasa menguburnya."
