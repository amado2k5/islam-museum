id: event/the-tabari-reinforcements-arrive-and-abdullah-and-ibn-al-ruwayya-camp-at-sabal-289
class: event
kind: other
label:
  ar: "قدوم مادة الطبريين ونزول عبد الله بن الحسين وابن الروية بصبل، صفر 289هـ"
  en: "The Tabari reinforcements arrive and Abdullah ibn al-Husayn and Ibn al-Ruwayya camp at Sabal, Safar 289 AH"
  ur: "طبری کمک کی آمد اور عبداللہ بن الحسین و ابن الرویہ کا صبل میں پڑاؤ، صفر 289ھ"
summary:
  ar: "قدمت إلى الهادي مادة من الطبريين يوم الخميس لتسع ليال خلت من صفر سنة 289هـ فأقاموا بصنعاء أياماً، ثم أمر الهادي في يوم الثلاثاء لأربع عشرة ماضية من الشهر أخاه عبد الله بن الحسين وربيع بن الروية فنزلا بموضع يقال له صبل مقابلين لعسكر القوم بموضع يقال له غيمان."
  en: "A reinforcement of Tabaris came to al-Hadi on Thursday, nine nights gone of Safar 289 AH, and stayed some days at Sana'a; then on Tuesday, fourteen days of the month gone, al-Hadi ordered his brother Abdullah ibn al-Husayn and Rabi' ibn al-Ruwayya, who settled at a place called Sabal facing the men's camp at a place called Ghayman."
  ur: "صفر 289ھ کی نو راتیں گزرنے پر جمعرات کے دن طبریوں کی ایک کمک ہادی کے پاس آئی اور چند دن صنعاء میں ٹھہری؛ پھر چودہ دن گزرنے پر منگل کے دن ہادی نے اپنے بھائی عبداللہ بن الحسین اور ربیع بن الرویہ کو بھیجا جو صبل نامی جگہ اتر کر غیمان نامی جگہ مخالفوں کے پڑاؤ کے سامنے ٹھہرے۔"
