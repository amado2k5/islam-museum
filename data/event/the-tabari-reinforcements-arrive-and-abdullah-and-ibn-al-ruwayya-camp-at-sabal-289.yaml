id: event/the-tabari-reinforcements-arrive-and-abdullah-and-ibn-al-ruwayya-camp-at-sabal-289
class: event
kind: other
label:
  ar: "قدوم مادة الطبريين ونزول عبد الله بن الحسين وابن الروية بصبل، صفر 289هـ"
  en: "The Tabari reinforcements arrive and Abdullah ibn al-Husayn and Ibn al-Ruwayya camp at Sabal, Safar 289 AH"
  ur: "طبری کمک کی آمد اور عبداللہ بن الحسین و ابن الرویہ کا صبل میں پڑاؤ، صفر 289ھ"
  es: "Llegan los refuerzos de Tabari y Abdullah ibn al-Husayn e Ibn al-Ruwayya acampan en Sabal, Safar 289 AH."
  fr: "Les renforts tabariens arrivent et Abdullah ibn al-Husayn et Ibn al-Ruwayya campent à Sabal, le 1er Safar 289 AH."
  tr: "Taberi halkının gelişi ve Abdullah bin Hüseyin ile İbn Raviye'nin Hicri 289 yılının Safar ayında Sabl'a gelişi."
  id: "Kedatangan kaum Tabari dan kedatangan Abdullah bin Al-Hussein dan Ibn Al-Rawiya di Sabl, Safar 289 H."
summary:
  ar: "قدمت إلى الهادي مادة من الطبريين يوم الخميس لتسع ليال خلت من صفر سنة 289هـ فأقاموا بصنعاء أياماً، ثم أمر الهادي في يوم الثلاثاء لأربع عشرة ماضية من الشهر أخاه عبد الله بن الحسين وربيع بن الروية فنزلا بموضع يقال له صبل مقابلين لعسكر القوم بموضع يقال له غيمان."
  en: "A reinforcement of Tabaris came to al-Hadi on Thursday, nine nights gone of Safar 289 AH, and stayed some days at Sana'a; then on Tuesday, fourteen days of the month gone, al-Hadi ordered his brother Abdullah ibn al-Husayn and Rabi' ibn al-Ruwayya, who settled at a place called Sabal facing the men's camp at a place called Ghayman."
  ur: "صفر 289ھ کی نو راتیں گزرنے پر جمعرات کے دن طبریوں کی ایک کمک ہادی کے پاس آئی اور چند دن صنعاء میں ٹھہری؛ پھر چودہ دن گزرنے پر منگل کے دن ہادی نے اپنے بھائی عبداللہ بن الحسین اور ربیع بن الرویہ کو بھیجا جو صبل نامی جگہ اتر کر غیمان نامی جگہ مخالفوں کے پڑاؤ کے سامنے ٹھہرے۔"
  es: "Un refuerzo de Tabaris llegó a al-Hadi el jueves, nueve noches después del inicio del Safar 289 AH, y se quedó algunos días en Sana'a; luego, el martes, catorce días después del inicio del mes, al-Hadi ordenó a su hermano Abdullah ibn al-Husayn y a Rabi' ibn al-Ruwayya, quienes se establecieron en un lugar llamado Sabal frente al campamento de los hombres en un lugar llamado Ghayman."
  fr: "Un renfort de Tabaris est arrivé auprès d'al-Hadi le jeudi, neuf nuits après le Safar 289 AH, et est resté quelques jours à Sanaa; puis le mardi, quatorze jours après le mois, al-Hadi a ordonné à son frère Abdullah ibn al-Husayn et à Rabi' ibn al-Ruwayya, qui se sont installés à un endroit appelé Sabal, face au camp des hommes à un endroit appelé Ghayman."
  tr: "Hicri 289 yılının Safer ayının bitimine dokuz gece kala, Perşembe günü, Al-Hadi, Taberilerden malzeme aldı. Birkaç gün Sana'a'da kaldılar. Ardından, ayın bitimine on dört gün kala, Salı günü, Al-Hadi, kardeşi Abdullah bin Al-Hussein ve Rabi' bin Al-Rawiya'ya, Ghayman adlı yerdeki halkın kampının karşısında bulunan Sabl adlı bir yere yerleşmelerini emretti."
  id: "Pada hari Kamis, sembilan malam sebelum berakhirnya bulan Safar tahun 289 H, Al-Hadi menerima perbekalan dari kaum Tabari. Mereka tinggal di Sana'a selama beberapa hari. Kemudian, pada hari Selasa, empat belas hari sebelum berakhirnya bulan tersebut, Al-Hadi memerintahkan saudaranya Abdullah bin Al-Hussein dan Rabi' bin Al-Rawiya untuk menetap di tempat bernama Sabl, di seberang perkemahan orang-orang di tempat bernama Ghayman."
