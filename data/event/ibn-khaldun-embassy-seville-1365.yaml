summary:
  ar: "نحو سنة 1365م أُرسل ابن خلدون من غرناطة إلى إشبيلية لعقد صلح مع بيدرو الأول ملك قشتالة، فرأى فيها آثار أسلافه. {cite:britannica-ibn-khaldun}"
  en: "Around 1365 Ibn Khaldun was sent from Granada to Seville to conclude a peace treaty with Pedro I of Castile, and saw there the monuments of his ancestors. {cite:britannica-ibn-khaldun}"
  ur: "1365ء کے لگ بھگ ابن خلدون کو غرناطہ سے اشبیلیہ بھیجا گیا تاکہ قشتالہ کے بادشاہ پیدرو اول کے ساتھ صلح کا معاہدہ کریں؛ وہاں انھوں نے اپنے آبا کی یادگاریں دیکھیں۔"
  es: "Hacia 1365, Ibn Khaldun fue enviado de Granada a Sevilla para concluir un tratado de paz con Pedro I de Castilla, y allí vio los monumentos de sus antepasados. {cite:britannica-ibn-khaldun}"
  fr: "Vers 1365, Ibn Khaldoun fut envoyé de Grenade à Séville pour conclure un traité de paix avec Pierre Ier de Castille, et il y vit les monuments de ses ancêtres. {cite:britannica-ibn-khaldun}"
  tr: "İbn Haldun, yaklaşık 1365 yılında Granada'dan Sevilla'ya Kastilya Kralı I. Pedro ile barış görüşmeleri yapmak üzere gönderilmiş ve orada atalarının izlerine rastlamıştır. {cite:britannica-ibn-khaldun}"
  id: "Sekitar tahun 1365 M, Ibn Khaldun diutus dari Granada ke Sevilla untuk berdamai dengan Pedro I, Raja Kastilia, dan di sana ia melihat jejak leluhurnya. {cite:britannica-ibn-khaldun}"
