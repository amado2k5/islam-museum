label:
  ar: وفاة عبد الله بن المبارك بهيت وكلماته الأخيرة
  en: Deathbed of Abd Allah ibn al-Mubarak at Hit
  ur: ہیت میں عبد اللہ بن المبارک کی وفات اور آخری کلمات
summary:
  ar: توفي عبد الله بن المبارك بهيت على الفرات منصرفاً من الغزو في رمضان سنة 181هـ وله ثلاث وستون سنة {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 775}. ولما لقّنه رجل الشهادة طلب ألا يعيد عليه إلا إن تكلم بعدها بكلام، ليكون آخر كلامه {cite:siyar-alam-nubala scan vol. 1 p. 2478}. وتسمّي «صفة الصفوة» الملقّن نصيراً {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 775}. ودُفن بهيت وفيها قبره {cite:tarikh-islam-dhahabi vol. 15 p. 241}.
  en: Abd Allah ibn al-Mubarak died at Hit on the Euphrates, returning from campaign, in Ramadan 181 AH, aged sixty-three {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 775}. When a man prompted him to say the declaration of faith he asked that it not be repeated unless he spoke afterwards, so it would be his last speech {cite:siyar-alam-nubala scan vol. 1 p. 2478}. Sifat al-Safwa names the prompter Nusayr {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 775}. He was buried at Hit, where his grave is {cite:tarikh-islam-dhahabi vol. 15 p. 241}.
  ur: عبد اللہ بن المبارک غزوے سے واپسی پر فرات کے کنارے ہیت میں رمضان 181ھ میں فوت ہوئے، عمر تریسٹھ برس {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 775}۔ جب ایک شخص نے انہیں کلمۂ شہادت کی تلقین کی تو انہوں نے کہا کہ اسے صرف اس وقت دہرایا جائے جب وہ اس کے بعد کوئی اور بات کریں، تاکہ یہی آخری کلام ہو {cite:siyar-alam-nubala scan vol. 1 p. 2478}۔ «صفۃ الصفوہ» تلقین کرنے والے کا نام نصیر بتاتی ہے {cite:sifat-al-safwa-tartusi-2012 scan vol. 1 p. 775}۔ وہ ہیت میں دفن ہوئے جہاں ان کی قبر ہے {cite:tarikh-islam-dhahabi vol. 15 p. 241}۔
