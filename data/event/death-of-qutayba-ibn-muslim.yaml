id: event/death-of-qutayba-ibn-muslim
class: event
kind: death
label: { ar: "مقتل قتيبة بن مسلم", en: "Killing of Qutayba ibn Muslim" }
summary:
  ar: "ذكر الطبري في سنة ست وتسعين مقتل قتيبة بن مسلم بخراسان، وذكر أن سببه سعي الوليد بن عبد الملك إلى جعل ابنه عبد العزيز وليا للعهد، فدسّ في ذلك إلى القواد والشعراء {cite:tabari-tarikh-abu-al-fadl j.6 p.506}. وكان قد ذكر قبل ذلك فتح قتيبة كاشغر وغزوه الصين {cite:tabari-tarikh-abu-al-fadl j.6 p.500}. ويذكر الكتاب أن قتيبة خلع طاعة سليمان بعد وفاة الوليد بن عبد الملك، وأن عهد الولاية من سليمان وصل بعد خلعه، وأن وكيع بن حسان ومن معه قتلوه في ذي الحجة سنة 96هـ، ويعلّق بأنه مات ميتة جاهلية في الخلع وأن له من الأعمال الصالحة ما يرجى به العفو. {cite:salabi-umayyad-state-2020 p.98}"
  en: "In 96 Tabari records the killing of Qutayba ibn Muslim in Khurasan. He says the cause was al-Walid ibn Abd al-Malik's effort to make his son Abd al-Aziz heir, so he secretly won over commanders and poets against Qutayba {cite:tabari-tarikh-abu-al-fadl j.6 p.506}. Earlier Tabari had recorded Qutayba's conquest of Kashgar and his campaign into China {cite:tabari-tarikh-abu-al-fadl j.6 p.500}. The book says Qutayba renounced obedience to Sulayman after the death of al-Walid ibn Abd al-Malik, that the letter of appointment from Sulayman reached him after he had rebelled, and that Waki' ibn Hassan and his companions killed him in Dhu'l-Hijja of 96 AH. It comments that he died a jahili death in rebellion, but that he had good deeds for which pardon may be hoped {cite:salabi-umayyad-state-2020 p.98}."
