summary:
  ar: "ذكر الطبري في سنة ست وتسعين مقتل قتيبة بن مسلم بخراسان، وذكر أن سببه سعي الوليد بن عبد الملك إلى جعل ابنه عبد العزيز وليا للعهد، فدسّ في ذلك إلى القواد والشعراء {cite:tabari-tarikh-abu-al-fadl j.6 p.506}. وكان قد ذكر قبل ذلك فتح قتيبة كاشغر وغزوه الصين {cite:tabari-tarikh-abu-al-fadl j.6 p.500}."
