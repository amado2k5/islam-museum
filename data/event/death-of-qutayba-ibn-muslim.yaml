label: { ar: "مقتل قتيبة بن مسلم", en: "Killing of Qutayba ibn Muslim", es: "Asesinato de Qutayba ibn Muslim", fr: "Assassinat de Qutayba ibn Muslim", ur: "قتیبہ بن مسلم کا قتل" }
summary:
  ar: "ذكر الطبري في سنة ست وتسعين مقتل قتيبة بن مسلم بخراسان، وذكر أن سببه سعي الوليد بن عبد الملك إلى جعل ابنه عبد العزيز وليا للعهد، فدسّ في ذلك إلى القواد والشعراء {cite:tabari-tarikh-abu-al-fadl j.6 p.506}. وكان قد ذكر قبل ذلك فتح قتيبة كاشغر وغزوه الصين {cite:tabari-tarikh-abu-al-fadl j.6 p.500}. ويذكر الكتاب أن قتيبة خلع طاعة سليمان بعد وفاة الوليد بن عبد الملك، وأن عهد الولاية من سليمان وصل بعد خلعه، وأن وكيع بن حسان ومن معه قتلوه في ذي الحجة سنة 96هـ، ويعلّق بأنه مات ميتة جاهلية في الخلع وأن له من الأعمال الصالحة ما يرجى به العفو. {cite:salabi-umayyad-state-2020 p.98}"
  en: "In 96 Tabari records the killing of Qutayba ibn Muslim in Khurasan. He says the cause was al-Walid ibn Abd al-Malik's effort to make his son Abd al-Aziz heir, so he secretly won over commanders and poets against Qutayba {cite:tabari-tarikh-abu-al-fadl j.6 p.506}. Earlier Tabari had recorded Qutayba's conquest of Kashgar and his campaign into China {cite:tabari-tarikh-abu-al-fadl j.6 p.500}. The book says Qutayba renounced obedience to Sulayman after the death of al-Walid ibn Abd al-Malik, that the letter of appointment from Sulayman reached him after he had rebelled, and that Waki' ibn Hassan and his companions killed him in Dhu'l-Hijja of 96 AH. It comments that he died a jahili death in rebellion, but that he had good deeds for which pardon may be hoped {cite:salabi-umayyad-state-2020 p.98}."
  es: "En el año 96, Tabari registra el asesinato de Qutayba ibn Muslim en Jorasán. Afirma que la causa fue el intento de al-Walid ibn Abd al-Malik de convertir a su hijo Abd al-Aziz en heredero, por lo que secretamente convenció a comandantes y poetas para que se volvieran contra Qutayba {cite:tabari-tarikh-abu-al-fadl j.6 p.506}. Anteriormente, Tabari había registrado la conquista de Kashgar por parte de Qutayba y su campaña en China {cite:tabari-tarikh-abu-al-fadl j.6 p.500}. El libro dice que Qutayba renunció a la obediencia a Sulayman después de la muerte de al-Walid ibn Abd al-Malik, que la carta de nombramiento de Sulayman le llegó después de haberse rebelado, y que Waki' ibn Hassan y sus compañeros lo mataron en Dhu'l-Hijja del año 96 AH. Comenta que murió una muerte propia de la época preislámica en rebelión, pero que tuvo buenas obras por las que se puede esperar el perdón {cite:salabi-umayyad-state-2020 p.98}."
  fr: "En 96 AH, Tabari relate l'assassinat de Qutayba ibn Muslim au Khorasan. Il explique que cet assassinat était dû à la volonté d'al-Walid ibn Abd al-Malik de désigner son fils Abd al-Aziz comme héritier, et que ce dernier avait secrètement rallié commandants et poètes à la cause de Qutayba (voir: Tabari Tarikh Abu al-Fadl, vol. 6, p. 506). Auparavant, Tabari avait relaté la conquête de Kashgar par Qutayba et sa campagne en Chine (voir: Tabari Tarikh Abu al-Fadl, vol. 6, p. 500). L'ouvrage indique que Qutayba renonça à son allégeance à Soliman après la mort d'al-Walid ibn Abd al-Malik, que la lettre de nomination de Soliman lui parvint après sa rébellion, et que Waki' ibn Hassan et ses compagnons le tuèrent en Dhu al-Hijja de l'an 96 AH. Il est indiqué qu'il est mort en rébellion, mais qu'il a accompli de bonnes actions pour lesquelles on peut espérer le pardon {cite:salabi-umayyad-state-2020 p.98}."
  ur: "96 میں طبری نے خراسان میں قتیبہ بن مسلم کے قتل کا ذکر کیا ہے۔ اس کا کہنا ہے کہ اس کی وجہ الولید بن عبد الملک کی کوشش تھی کہ وہ اپنے بیٹے عبدالعزیز کو وارث بنائے، اس لیے اس نے خفیہ طور پر قتیبہ کے خلاف کمانڈروں اور شاعروں کو جیت لیا۔ اس سے قبل طبری نے قتیبہ کی کاشغر کی فتح اور چین میں اس کی مہم کو درج کیا تھا {حوالہ:طبری تاریخ ابو الفضل ج.6 ص. کتاب میں کہا گیا ہے کہ قتیبہ نے ولید بن عبد الملک کی وفات کے بعد سلیمان کی اطاعت ترک کر دی تھی، کہ سلیمان کی طرف سے اس کے سرکشی کے بعد اسے تقرری کا خط پہنچا تھا، اور وکیع بن حسن اور اس کے ساتھیوں نے اسے 96 ہجری کی ذوالحجہ میں قتل کر دیا تھا۔ یہ تبصرہ کرتا ہے کہ وہ بغاوت میں جاہلی موت مر گیا، لیکن یہ کہ اس کے اچھے اعمال تھے جن کے لیے معافی کی امید کی جا سکتی ہے {حوالہ: سلبی-امیاد-ریاست-2020 صفحہ 98}۔"
