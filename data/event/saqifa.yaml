label: { en: "The meeting at Saqifa", ar: "اجتماع السقيفة" }
summary:
  en: "After the Prophet's death, leaders of the Ansar and Muhajirun met in the hall of the Banu Sa'ida and chose Abu Bakr as leader of the community. ونص الاجتماع كاملاً عند البخاري من رواية عمر: اجتماع الأنصار في السقيفة، ومشي أبي بكر وعمر وأبي عبيدة إليهم، والخطابان، ويدا عمر وبشير بن سعد، فالبيعة {cite:sahih-al-bukhari 2462}."
  ar: "بعد وفاة النبي اجتمع زعماء الأنصار والمهاجرين في سقيفة بني ساعدة واختاروا أبا بكر قائدًا للجماعة. وعند المسعودي خرج علي بعد التجديد يوم الثلاثاء فقال لأبي بكر أفسدت علينا أمورنا ولم تستشر ولم ترع لنا حقاً فقال بلى ولكنني خشيت الفتنة، وخرج سعد بن عبادة فلم يبايع فصار إلى الشام فقتل هناك سنة خمس عشرة، ولم يبايعه أحد من بني هاشم حتى ماتت فاطمة {cite:muruj-al-dhahab p. 598}"
