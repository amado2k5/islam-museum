issue: { ar: "كيف تُوصف بيعة أبي بكر في السقيفة: اختياراً من قادة الجماعة، أم عملية سياسية، أم خروجاً على تعيين سابق؟", en: "How is the pledge to Abu Bakr at Saqifa described: a choice by the community's leaders, a political process, or a departure from an earlier designation?" }
perspectives:
  - tradition: sunni
    id: sunni
    stance: { ar: "اختيار مشروع من قادة الجماعة" }
    summary:
      en: "Sunni tradition regards the choice of Abu Bakr at Saqifa as a legitimate selection by the community's leaders."
      ar: "يرى أهل السنة أن مبايعة أبي بكر في السقيفة كانت اختياراً مشروعاً من قادة الجماعة، تلته بيعة عامة في اليوم التالي، كما تروي خطبة عمر عند ابن إسحاق."
    evidence:
      - { ref: source/ibn-hisham-saqqa, note: { ar: "ص 306-311" } }
    sources: [source/ibn-hisham-saqqa]
  - tradition: academic
    id: academic
    stance: { ar: "عملية سياسية تأثرت بالتحالفات القبلية" }
    summary:
      en: "Historians treat it as a political process shaped by tribal alliances in Medina, relying on later and partisan reports."
      ar: "يقرؤها المؤرخون المحدثون عملية سياسية تأثرت بالتحالفات القبلية في المدينة، مع التنبيه إلى أن أكثر الأخبار متأخر أو منحاز."
    sources: [source/watt-1956-medina]
  - tradition: shia-twelver
    id: shia-twelver
    stance: { ar: "إزاحة لتعيين سابق لعلي" }
    summary:
      en: "Twelver Shia tradition holds that Ali had been designated and regards the meeting as having set that designation aside."
      ar: "يرى الشيعة الإمامية الاثنا عشرية أن علياً كان قد عُيّن للإمامة، وأن اجتماع السقيفة أزاح ذلك التعيين."
    sources: [source/mubarakpuri-raheeq]
