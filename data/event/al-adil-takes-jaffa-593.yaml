label: { ar: "ملك العادل يافا وملك الفرنج بيروت", en: "Al-Adil takes Jaffa and the Franks take Beirut (593 AH)", fr: "Al-Adil prend Jaffa et les Francs prennent Beyrouth, 593 de l’hégire", es: "Al-Adil toma Jaffa y los francos toman Beirut (593 AH)", ur: "العدل نے جفا پر قبضہ کیا اور فرینکوں نے بیروت پر قبضہ کیا ⁦(593ھ)⁩", tr: "Yafa Kralı El-Adil ve Beyrut Franklarının Kralı", id: "Raja Al-Adil dari Jaffa dan Raja Frank dari Beirut" }
summary:
  ar: "في شوال سنة ثلاث وتسعين وخمسمائة ملك الملك العادل مدينة يافا من الفرنج؛ وكان ببيروت أمير مقطعها يعرف بأسامة يرسل الشواني يقطعون الطريق على الفرنج فاشتكوا إلى العادل والعزيز فلم يمنعاه، فأمدهم الفرنج بعساكر كثيرة أكثرهم من عسكر ملك الألمان مقدمهم قس يعرف بالخنصلير، فجمع العادل العساكر على عين جالوت ورحلوا إلى يافا فملكوا المدينة وخربوها وحصروا قلعتها فملكوها عنوة في يومها، وأخذ كل ما بها غنيمة وأسراً؛ ووصل الفرنج من عكا إلى قيسارية ليمنعوهم فتأخروا لسقوط ملكهم الكندهري من موضع عالٍ بعكا فمات واختلاف أحوالهم، فلما بلغهم ملك يافا عادوا؛ ثم سار العادل إلى بيروت وهدموا سورها وشرعوا في تخريب دورها وقلعتها فمنعهم أسامة وتكفل بحفظها، فرحل الفرنج إلى صيدا فملكوا بيروت من المسلمين لما كانت قد خربت وحصروا تبنين ثم رحلوا عنها {cite:kamil-ibn-al-athir p. 245-246}."
  en: "Shawwal 593: al-Adil massed the Ayyubid armies at Ayn Jalut, stormed Jaffa's citadel in a day and took all in it as booty and captives. The German-led Frankish relief reached Caesarea too late — their king Henry of Champagne had fallen from a high place at Acre and died, throwing them into confusion. The Ayyubids then razed Beirut's walls; the Franks slipped in, reoccupied it and besieged Tibnin before withdrawing {cite:kamil-ibn-al-athir p. 245-246}."
  fr: "Shawwal 593 : al-Adil rassembla les armées ayyoubides à Ayn Jalut, prit d’assaut la citadelle de Jaffa en une journée et y emporta tout comme butin et captifs. Les secours francs menés par les Allemands atteignirent Césarée trop tard : leur roi Henri de Champagne était mort d’une chute à Acre, les plongeant dans le désarroi. Les Ayyoubides démolirent ensuite les remparts de Beyrouth ; les Francs s’y glissèrent, la réoccupèrent et assiégèrent Tibnin avant de se retirer {cite:kamil-ibn-al-athir p. 245-246}."
  es: "Shawwal 593: Al-Adil concentró los ejércitos ayubíes en Ayn Jalut, asaltó la ciudadela de Jaffa en un día y se apoderó de todo lo que había en ella como botín y prisioneros. El refuerzo franco, liderado por los germanos, llegó a Cesarea demasiado tarde: su rey Enrique de Champaña había caído de un lugar alto en Acre y había muerto, sumiendo a la población en la confusión. Los ayubíes arrasaron entonces las murallas de Beirut; los francos se infiltraron, la reocuparon y sitiaron Tibnin antes de retirarse {cita:kamil-ibn-al-athir, págs. 245-246}."
  ur: "شوال 593: العدل نے عین جالوت پر ایوبی فوجوں کو جمع کیا، ایک دن میں جفا کے قلعے پر دھاوا بول دیا اور اس میں موجود سب کو مال غنیمت اور اسیر بنا لیا۔ جرمن قیادت میں فرینکش ریلیف بہت دیر سے سیزریا پہنچی - ان کا بادشاہ ہنری آف شیمپین ایکر میں ایک اونچی جگہ سے گر کر مر گیا تھا، اور انہیں الجھن میں ڈال دیا تھا۔ اس کے بعد ایوبیوں نے بیروت کی دیواروں کو گرا دیا۔ فرانکس گھس آئے، اس پر دوبارہ قبضہ کر لیا اور دستبردار ہونے سے پہلے تبنین کا محاصرہ کر لیا۔ 245-246}۔"
  tr: "Hicri 593 yılının Şevval ayında Kral Adil, Yafa şehrini Franklardan geri aldı. Beyrut'ta Usama adında bir emir vardı ve Frankların geçiş yolunu kesmek için gemiler gönderiyordu. Franklar Adil ve Aziz'e şikayette bulundular, ancak onu durdurmadılar. Bunun üzerine Franklar, çoğu Alman kralının ordusundan olmak üzere, Hansalir adında bir rahibin önderliğinde birçok asker gönderdiler. Adil, askerleri Ayn Calut'ta topladı ve Yafa'ya doğru yürüdüler, şehri ele geçirdiler, yıktılar ve kalesini kuşattılar. O gün şehri zorla ele geçirdiler ve içindeki her şeyi ganimet ve esir olarak aldılar. Franklar, onları engellemek için Akka'dan Caesarea'ya geldiler, ancak kralları Kandahri'nin Akka'da yüksek bir yerden düşüp ölmesi ve durumlarının değişmesi nedeniyle geciktiler. Yafa'nın ele geçirildiği haberi onlara ulaşınca geri döndüler. Sonra Adil, Beyrut'a yürüdü ve surlarını yıktı, evlerini ve kalesini tahrip etmeye başladı; fakat Usame onları durdurdu ve şehri koruma görevini üstlendi. Böylece Franklar Sidon'a gittiler ve Beyrut'u, yıkılmış haldeyken Müslümanlardan geri aldılar, Tibnin'i kuşattılar ve sonra oradan ayrıldılar. {kaynak: Kamil İbn el-Atir s. 245-246}"
  id: "Pada bulan Syawal tahun 593 H, Raja Al-Adil merebut kota Jaffa dari bangsa Frank. Ada seorang emir di Beirut, yang dikenal sebagai Usama, yang mengirimkan kapal untuk memutus jalur pasukan Frank. Mereka mengadu kepada Al-Adil dan Al-Aziz, tetapi mereka tidak menghentikannya. Maka bangsa Frank memasok mereka dengan banyak pasukan, sebagian besar dari tentara raja Jerman, yang dipimpin oleh seorang pendeta yang dikenal sebagai Al-Khansalir. Al-Adil mengumpulkan pasukan di Ain Jalut, dan mereka berbaris ke Jaffa, merebut kota itu, menghancurkannya, dan mengepung bentengnya. Mereka merebutnya dengan paksa pada hari itu juga, dan mengambil semua yang ada di dalamnya sebagai rampasan perang dan tawanan. Bangsa Frank tiba dari Acre ke Caesarea untuk mencegah mereka, tetapi mereka tertunda karena raja mereka, Al-Kandahri, jatuh dari tempat tinggi di Acre dan meninggal, dan karena perubahan keadaan mereka. Ketika berita tentang penaklukan Jaffa sampai kepada mereka, mereka kembali. Kemudian al-Adil berbaris ke Beirut dan mereka menghancurkan temboknya serta mulai menghancurkan rumah-rumah dan bentengnya, tetapi Usama menghentikan mereka dan mengambil alih untuk melindunginya. Maka orang-orang Frank pergi ke Sidon dan merebut Beirut dari kaum Muslim setelah kota itu dihancurkan, dan mereka mengepung Tibnin lalu meninggalkannya. {cite:kamil-ibn-al-athir hlm. 245-246}."
