label: { ar: "الترمذ بين موسى بن عبد الله بن خازم وقتيبة", en: "Tirmidh between Musa ibn Khazim and Qutayba", es: "Tirmidh entre Musa ibn Khazim y Qutayba", fr: "Tirmidh entre Musa ibn Khazim et Qutayba", ur: "ترمذی موسیٰ بن خزیم اور قتیبہ کے درمیان", tr: "Musa ibn Abdullah ibn Hazim ile Kuteybe arasındaki Tirmizi", id: "Tirmidz antara Musa bin Abdullah bin Khazim dan Qutaybah" }
summary:
  ar: "لما قتل عبد الله بن خازم السلمي أتى موسى ابنه ملك الترمذ فأجاره وألجأه وقوماً كانوا معه فأخرجه عنها وغلب عليها وهو مخالف فلما قتل صارت في أيدي الولاة ثم انتقض أهلها ففتحها قتيبة بن مسلم."
  en: "When Abdallah ibn Khazim al-Sulami was killed his son Musa came to Tirmidh's king, who sheltered him and his men — till Musa cast him out and held it in rebellion; at his death it passed to the governors, its people broke, and Qutayba ibn Muslim retook it."
  es: "Cuando Abdallah ibn Khazim al-Sulami fue asesinado, su hijo Musa acudió al rey de Tirmidh, quien lo acogió a él y a sus hombres, hasta que Musa lo expulsó y se rebeló contra la ciudad. A su muerte, la ciudad pasó a manos de los gobernadores, su pueblo se dividió y Qutayba ibn Muslim la reconquistó."
  fr: "Lorsque Abdallah ibn Khazim al-Sulami fut tué, son fils Musa vint se réfugier auprès du roi de Tirmidh, qui l'abrita, lui et ses hommes, jusqu'à ce que Musa le chasse et se rebelle; à sa mort, le territoire passa aux mains des gouverneurs, son peuple se déchaîna et Qutayba ibn Muslim le reprit."
  ur: "جب عبداللہ بن خزیم السلمی کو قتل کیا گیا تو اس کا بیٹا موسیٰ ترمذ کے بادشاہ کے پاس آیا، جس نے اسے اور اس کے آدمیوں کو پناہ دی - یہاں تک کہ موسیٰ نے اسے باہر نکال دیا اور اسے بغاوت میں گرفتار کر لیا۔ اس کی موت کے بعد یہ گورنروں تک پہنچا، اس کے لوگوں نے توڑ دیا، اور قتیبہ بن مسلم نے اسے واپس لے لیا۔"
  tr: "Abdullah bin Khazim al-Sulami öldürüldüğünde, oğlu Tirmizi kralı Musa ona sığınak ve barınak sağladı ve yanında bir halk da vardı. Onu oradan kovdu ve kontrolü ele geçirdi; oysa Tirmizi onun muhalifiydi. Öldürüldüğünde, şehir valilerin eline geçti, sonra halkı isyan etti ve Kuteybe bin Müslim şehri fethetti."
  id: "Ketika Abdullah bin Khazim al-Sulami terbunuh, Musa, putranya, raja Tirmidz, datang kepadanya dan memberinya perlindungan dan tempat tinggal, serta sekelompok orang yang bersamanya. Ia mengusirnya dari sana dan mengambil alih kekuasaan, dan ia menjadi penentangnya. Ketika ia terbunuh, wilayah itu jatuh ke tangan para gubernur, kemudian rakyatnya memberontak, sehingga Qutaybah bin Muslim menaklukkannya."
