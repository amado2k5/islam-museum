label: { ar: "سقوط إشبيلية صلحاً", en: "The fall of Seville by treaty", es: "La caída de Sevilla por tratado", fr: "La chute de Séville par traité", ur: "معاہدے کے ذریعے سیویل کا زوال" }
summary:
  ar: "حصر العدو إشبيلية سنة 645هـ وفي يوم الاثنين الخامس من شعبان سنة 646هـ ملكها الطاغية صاحب قشتالة صلحاً بعد منازلتها حولاً كاملاً وخمسة أشهر أو نحوها {cite:nafh-tib-maqqari p. 476-477}. وتوفي بها بعد أخذها ابن الدباج شيخ الأندلس في العربية والقراءات إذ هاله نطق الناقوس وخرس الأذان {cite:shadharat-dhahab p. 244}."
  en: "Seville was besieged in 645 and surrendered to the Castilian on Monday 5 Sha'ban 646 after about seventeen months of investment {cite:nafh-tib-maqqari p. 476-477}. Ibn al-Dabbagh, shaykh of al-Andalus in grammar and the readings, died there within weeks — destroyed, the source says, by the church bell where the adhan had gone silent {cite:shadharat-dhahab p. 244}."
  es: "Sevilla fue sitiada en 645 y se rindió a los castellanos el lunes 5 de Sha'ban de 646, tras unos diecisiete meses de asedio {cite:nafh-tib-maqqari p. 476-477}. Ibn al-Dabbagh, shaykh de al-Ándalus en gramática y lecturas, murió allí pocas semanas después, destruido, según la fuente, por la campana de la iglesia donde el adhan había enmudecido {cite:shadharat-dhahab p. 244}."
  fr: "Séville fut assiégée en 645 et se rendit aux Castillans le lundi 5 Sha'ban 646 après environ dix-sept mois de siège {cite:nafh-tib-maqqari p. 476-477}. Ibn al-Dabbagh, cheikh d'al-Andalus en grammaire et en lectures, y mourut quelques semaines plus tard, tué, selon la source, par la cloche de l'église dont l'adhan s'était tu {cite:shadharat-dhahab p. 244}."
  ur: "سیویل کا 645 میں محاصرہ کیا گیا تھا اور تقریباً سترہ ماہ کی سرمایہ کاری کے بعد پیر 5 شعبان 646 کو کاسٹیلین کے سامنے ہتھیار ڈال دیے گئے تھے۔ 476-477}۔ ابن الدباغ، گرائمر اور ریڈنگ میں الاندلس کے شیخ، چند ہفتوں کے اندر وہیں فوت ہو گئے - منبع کا کہنا ہے کہ چرچ کی گھنٹی کے ذریعے جہاں اذان خاموش ہو گئی تھی۔ 244}۔"
