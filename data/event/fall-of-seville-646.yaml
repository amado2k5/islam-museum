  ar: "حصر العدو إشبيلية سنة 645هـ وفي يوم الاثنين الخامس من شعبان سنة 646هـ ملكها الطاغية صاحب قشتالة صلحاً بعد منازلتها حولاً كاملاً وخمسة أشهر أو نحوها {cite:nafh-tib-maqqari p. 476-477}. وتوفي بها بعد أخذها ابن الدباج شيخ الأندلس في العربية والقراءات إذ هاله نطق الناقوس وخرس الأذان {cite:shadharat-dhahab p. 244}."
  en: "Seville was besieged in 645 and surrendered to the Castilian on Monday 5 Sha'ban 646 after about seventeen months of investment {cite:nafh-tib-maqqari p. 476-477}. Ibn al-Dabbagh, shaykh of al-Andalus in grammar and the readings, died there within weeks — destroyed, the source says, by the church bell where the adhan had gone silent {cite:shadharat-dhahab p. 244}."
