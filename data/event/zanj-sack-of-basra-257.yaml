id: event/zanj-sack-of-basra-257
class: event
kind: massacre
label: { ar: "دخول الزنج البصرة وإخربتها", en: "The Zanj Enter Basra and Lay It Waste", es: "Los Zanj entran en Basora y la arrasan.", fr: "Les Zanj entrent à Bassora et la ravagent.", ur: "زنج بصرہ میں داخل ہوتا ہے اور اسے ضائع کر دیتا ہے۔", tr: "Zanjlar Basra'ya girdiler ve şehri yerle bir ettiler.", id: "Pasukan Zanj memasuki Basra dan menghancurkannya." }
summary:
  ar: "في أيام المعتمد دخلت الزنج البصرة وأعمالها وأخربوها وبذلوا السيف وأحرقوا وخربوا وسبوا، وذكر الصولي أن صاحب الزنج قتل من المسلمين ألف ألف وخمس مئة ألف آدمي وقتل في يوم واحد بالبصرة ثلاث مئة ألف، وكان له منبر في مدينته يصعد عليه ويسب عثمان وعلياً ومعاوية وطلحة والزبير وعائشة، وكان ينادى على المرأة العلوية في عسكره بدرهمين وثلاثة، وأعقب ذلك الوباء الذي لا يكاد يتخلف عن الملاحم بالعراق فمات خلق لا يحصون ثم أعقبه هدات وزلازل فمات تحت الردم ألوف من الناس {cite:tarikh-khulafa-minhaj-1434 p. 564-565}. وعند المسعودي غلب على البصرة سنة سبع وخمسين ومائتين {cite:muruj-al-dhahab p. 568}، ووصف المسعودي ما بعد الوقعة من جوع أهل البصرة حتى أكلوا الكلاب والفيران والسنانير ثم أكل بعضهم بعضاً، ونصب المهلبي منبراً بمقبرة بني يشكر يخطب لصاحب الزنج ويترحم على أبي بكر وعمر ولا يذكر عثمان ولا علياً ويلعن جبابرة بني العباس وأبا موسى الأشعري وعمرو بن العاص ومعاوية، وبيعت الجواري من ولد الحسن والحسين والعباس بالدرهمين والثلاثة ينادى عليهن بأنسابهن، واختلف الناس في عدد القتلى فمكثر يقول لا يدركه العدد ومقلل يقول خمسمائة ألف {cite:muruj-al-dhahab p. 577-578}"
  en: "In al-Mu'tamid's days the Zanj entered Basra and its districts, laid it waste with sword, fire and captivity; per al-Suli their leader killed a million and a half Muslims, three hundred thousand in a single Basra day, and mounted a minbar in his city cursing Uthman, Ali, Mu'awiya, Talha, al-Zubayr and A'isha — Alawid women in his camp were crier-priced at two or three dirhams. Then came the plague that hardly fails Iraq's carnages, and tremors and quakes that killed thousands under the rubble {cite:tarikh-khulafa-minhaj-1434 p. 564-565}."
  es: "En tiempos de al-Mu'tamid, los Zanj entraron en Basora y sus alrededores, devastándola con espadas, fuego y prisioneros; según al-Suli, su líder mató a un millón y medio de musulmanes, trescientos mil en un solo día en Basora, y erigió un púlpito en su ciudad maldiciendo a Uthman, Ali, Mu'awiya, Talha, al-Zubayr y Aisha. Las mujeres alauitas en su campamento eran vendidas a dos o tres dirhams. Luego llegó la peste que casi siempre acompaña las matanzas de Irak, y temblores y terremotos que mataron a miles bajo los escombros {cite:tarikh-khulafa-minhaj-1434 p. 564-565}."
  fr: "Au temps d'al-Mu'tamid, les Zanj entrèrent dans Bassora et ses environs, les ravageant par l'épée, le feu et la captivité. Selon al-Suli, leur chef massacra un million et demi de musulmans, dont trois cent mille en une seule journée à Bassora, et fit ériger un minbar dans sa ville, maudissant Uthman, Ali, Mu'awiya, Talha, al-Zubayr et Aïcha. Les femmes alaouites de son camp étaient payées deux ou trois dirhams pour être crieuses de haine. Puis vint la peste, qui n'épargne guère les carnages de l'Irak, et des tremblements de terre qui tuèrent des milliers de personnes sous les décombres."
  ur: "المتمید کے دنوں میں زنج بصرہ اور اس کے اضلاع میں داخل ہوا، اسے تلوار، آگ اور اسیری سے برباد کر دیا۔ فی السولی ان کے سردار نے بصرہ کے ایک ہی دن میں ڈیڑھ لاکھ مسلمانوں یعنی تین لاکھ مسلمانوں کو قتل کیا اور اپنے شہر میں ایک منبر پر چڑھ کر عثمان، علی، معاویہ، طلحہ، الزبیر اور عائشہ پر لعنت بھیجی۔ پھر وہ طاعون آیا جو عراق کے قتل عام کو مشکل سے ناکام بناتا ہے، اور زلزلے اور زلزلے جس نے ہزاروں افراد کو ملبے تلے دب کر ہلاک کر دیا تھا۔ 564-565}۔"
  tr: "Mu'tamid'in hükümdarlığı döneminde, Zenj kabilesi Basra ve çevresine girerek büyük yıkıma yol açtı, kılıç salladı, yaktı, tahrip etti ve esir aldı. As-Suli, Zenj liderinin bir milyon beş yüz bin Müslümanı öldürdüğünü, bunların üç yüz bininin sadece Basra'da tek bir günde öldürüldüğünü bildirmiştir. Şehrinde bir minberi vardı ve oradan Osman, Ali, Muaviye, Talha, Zubeyr ve Ayşe'ye lanetler yağdırırdı. Ordusundaki Alevi ailesinden bir kadını iki veya üç dirheme satardı. Bunu, Irak'taki büyük savaşlara neredeyse her zaman eşlik eden ve sayısız ölüme neden olan bir veba salgını izledi. Ardından, binlerce insanın enkaz altında öldüğü depremler ve sarsıntılar geldi. {cite:tarikh-khulafa-minhaj-1434 pp. 564-565}. Mesudi'ye göre, Basra 257 Hicri yılında fethedildi. {cite:muruj-al-dhahab s. 568} El-Mas'udi, savaşın ardından Basra halkının açlıktan köpek, fare ve kedi yediğini, sonra da birbirlerini yediğini anlatmıştır. El-Muhallabi, Beni Yashkur mezarlığına, Zenj lideri için vaaz vermek, Osman veya Ali'den bahsetmeden Ebu Bekir ve Ömer'e rahmet dilemek ve Beni Abbas'ın zalimleri Ebu Musa el-Eş'ari, Amr ibn el-As ve Muaviye'yi lanetlemek için bir minber dikmiştir. Hasan, Hüseyin ve Abbas'ın soyundan gelen cariyeler iki veya üç dirheme satılmış ve soyları ilan edilmiştir. Ölülerin sayısı konusunda farklı görüşler vardı; kimileri sayılmayacak kadar çok olduğunu söylerken, kimileri beş yüz bin olduğunu söylemiştir. {cite:muruj-al-dhahab s. 577-578}"
  id: "Pada masa pemerintahan al-Mu'tamid, kaum Zanj memasuki Basra dan daerah sekitarnya, menimbulkan malapetaka, menggunakan pedang, membakar, menghancurkan, dan menawan orang. As-Suli melaporkan bahwa pemimpin kaum Zanj membunuh satu juta lima ratus ribu Muslim, termasuk tiga ratus ribu di Basra saja dalam satu hari. Ia memiliki mimbar di kotanya tempat ia naik dan mengutuk Utsman, Ali, Mu'awiya, Talha, Zubayr, dan Aisyah. Ia akan menjual seorang wanita dari keluarga Alawiyah di pasukannya seharga dua atau tiga dirham. Hal ini diikuti oleh wabah penyakit, yang hampir selalu menyertai pertempuran besar di Irak, menyebabkan kematian yang tak terhitung jumlahnya. Kemudian datanglah gempa bumi dan gempa bumi, di mana ribuan orang lagi tewas di bawah reruntuhan. {cite:tarikh-khulafa-minhaj-1434 pp. 564-565}. Menurut al-Mas'udi, Basra ditaklukkan pada tahun 257 H. {cite:muruj-al-dhahab hlm. 568} Al-Mas'udi menggambarkan akibat dari pertempuran, ketika penduduk Basra kelaparan hingga mereka memakan anjing, tikus, dan kucing, lalu mereka saling memakan satu sama lain. Al-Muhallabi mendirikan mimbar di pemakaman Banu Yashkur untuk berkhutbah bagi pemimpin Zanj dan berdoa memohon rahmat bagi Abu Bakr dan Umar, tanpa menyebut Uthman atau Ali, dan mengutuk para tiran Banu Abbas, Abu Musa al-Ash'ari, Amr ibn al-As, dan Mu'awiya. Budak perempuan dari keturunan al-Hasan, al-Husayn, dan al-Abbas dijual seharga dua atau tiga dirham, dan garis keturunan mereka diumumkan. Orang-orang berbeda pendapat tentang jumlah korban tewas; sebagian mengatakan jumlahnya terlalu banyak untuk dihitung, sementara yang lain mengatakan jumlahnya lima ratus ribu. {cite:muruj-al-dhahab hlm. 577-578}"
