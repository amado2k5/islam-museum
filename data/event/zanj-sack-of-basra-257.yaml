id: event/zanj-sack-of-basra-257
class: event
kind: massacre
label: { ar: "دخول الزنج البصرة وإخربتها", en: "The Zanj Enter Basra and Lay It Waste" }
summary:
  ar: "في أيام المعتمد دخلت الزنج البصرة وأعمالها وأخربوها وبذلوا السيف وأحرقوا وخربوا وسبوا، وذكر الصولي أن صاحب الزنج قتل من المسلمين ألف ألف وخمس مئة ألف آدمي وقتل في يوم واحد بالبصرة ثلاث مئة ألف، وكان له منبر في مدينته يصعد عليه ويسب عثمان وعلياً ومعاوية وطلحة والزبير وعائشة، وكان ينادى على المرأة العلوية في عسكره بدرهمين وثلاثة، وأعقب ذلك الوباء الذي لا يكاد يتخلف عن الملاحم بالعراق فمات خلق لا يحصون ثم أعقبه هدات وزلازل فمات تحت الردم ألوف من الناس {cite:tarikh-khulafa-minhaj-1434 p. 564-565}. وعند المسعودي غلب على البصرة سنة سبع وخمسين ومائتين {cite:muruj-al-dhahab p. 568}، ووصف المسعودي ما بعد الوقعة من جوع أهل البصرة حتى أكلوا الكلاب والفيران والسنانير ثم أكل بعضهم بعضاً، ونصب المهلبي منبراً بمقبرة بني يشكر يخطب لصاحب الزنج ويترحم على أبي بكر وعمر ولا يذكر عثمان ولا علياً ويلعن جبابرة بني العباس وأبا موسى الأشعري وعمرو بن العاص ومعاوية، وبيعت الجواري من ولد الحسن والحسين والعباس بالدرهمين والثلاثة ينادى عليهن بأنسابهن، واختلف الناس في عدد القتلى فمكثر يقول لا يدركه العدد ومقلل يقول خمسمائة ألف {cite:muruj-al-dhahab p. 577-578}"
  en: "In al-Mu'tamid's days the Zanj entered Basra and its districts, laid it waste with sword, fire and captivity; per al-Suli their leader killed a million and a half Muslims, three hundred thousand in a single Basra day, and mounted a minbar in his city cursing Uthman, Ali, Mu'awiya, Talha, al-Zubayr and A'isha — Alawid women in his camp were crier-priced at two or three dirhams. Then came the plague that hardly fails Iraq's carnages, and tremors and quakes that killed thousands under the rubble {cite:tarikh-khulafa-minhaj-1434 p. 564-565}."
