id: event/snake-jinn-of-medina
class: event
kind: other
label:
  ar: "حية المدينة: فتى الأنصار الذي قتلها"
  en: "The snake of Medina: the Ansari youth who killed it"
  ur: "مدینہ کی سانپ: اس انصاری نوجوان نے جسے مارا"
summary:
  ar: "وجد فتى من الأنصار امرأة بين البابين فأهوى إليها برمحه فقالت لا تعجل حتى تنظر ما في بيتك فوجد حية منطوية على فراشه فقتلها ومات هو والحية ولا يدرى أيهما أسرع موتا فقال النبي إن بالمدينة جنا قد أسلموا فإن بدا لكم بعد ثلاثة أيام فاقتلوه فإنما هو شيطان {cite:muwatta-maruf-1997} [[passage/muwatta-31-2798|الموطأ 31:2798]]."
  en: "An Ansari youth found his wife between the two doors and made for her with his spear, but she said do not hasten until you see what is in your house; he found a snake coiled on his bed and killed it, and he and the snake died and none knew which died first. The Prophet said: there are snakes in Medina that have embraced Islam; if they show themselves to you after three days, kill them, for they are but devils {cite:muwatta-maruf-1997} [[passage/muwatta-31-2798|Muwatta 31:2798]]."
  ur: "مدینہ کا ایک انصاری نوجوان اپنی بیوی کو دروازوں کے درمیان پایا اور وہ اس کی طرف برچھا lekar بڑھا مگر اس نے کہا جلدی نہ کرو جب تک اپنے گھر میں نہ دیکھو؛ اس نے بستر پر لپٹی ہوئی سانپ کو پایا اور اسے مار ڈالا، اور وہ اور سانپ دونوں مر گئے اور کوئی نہیں جانتا کون پہلے مرا۔ نبی نے کہا مدینہ میں کچھ سانپ ہیں جنہوں نے اسلام قبول کر لیا ہے؛ اگر تین دن بعد وہ تمہیں ظاہر ہوں تو مار ڈالو کیونکہ وہ شیطان ہی ہیں {cite:muwatta-maruf-1997} [[passage/muwatta-31-2798|موطأ 31:2798]]۔"
