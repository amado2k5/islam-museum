id: event/snake-jinn-of-medina
class: event
kind: other
label:
  ar: "حية المدينة: فتى الأنصار الذي قتلها"
  en: "The snake of Medina: the Ansari youth who killed it"
  ur: "مدینہ کی سانپ: اس انصاری نوجوان نے جسے مارا"
  es: "La serpiente de Medina: el joven ansarí que la mató."
  fr: "Le serpent de Médine: le jeune Ansari qui l'a tué"
  tr: "Şehrin yılanı: Onu öldüren Ensar çocuğu"
  id: "Ular kota: anak laki-laki Ansar yang membunuhnya"
summary:
  ar: "وجد فتى من الأنصار امرأة بين البابين فأهوى إليها برمحه فقالت لا تعجل حتى تنظر ما في بيتك فوجد حية منطوية على فراشه فقتلها ومات هو والحية ولا يدرى أيهما أسرع موتا فقال النبي إن بالمدينة جنا قد أسلموا فإن بدا لكم بعد ثلاثة أيام فاقتلوه فإنما هو شيطان {cite:muwatta-maruf-1997} [[passage/muwatta-31-2798|الموطأ 31:2798]]."
  en: "An Ansari youth found his wife between the two doors and made for her with his spear, but she said do not hasten until you see what is in your house; he found a snake coiled on his bed and killed it, and he and the snake died and none knew which died first. The Prophet said: there are snakes in Medina that have embraced Islam; if they show themselves to you after three days, kill them, for they are but devils {cite:muwatta-maruf-1997} [[passage/muwatta-31-2798|Muwatta 31:2798]]."
  ur: "مدینہ کا ایک انصاری نوجوان اپنی بیوی کو دروازوں کے درمیان پایا اور وہ اس کی طرف برچھا lekar بڑھا مگر اس نے کہا جلدی نہ کرو جب تک اپنے گھر میں نہ دیکھو؛ اس نے بستر پر لپٹی ہوئی سانپ کو پایا اور اسے مار ڈالا، اور وہ اور سانپ دونوں مر گئے اور کوئی نہیں جانتا کون پہلے مرا۔ نبی نے کہا مدینہ میں کچھ سانپ ہیں جنہوں نے اسلام قبول کر لیا ہے؛ اگر تین دن بعد وہ تمہیں ظاہر ہوں تو مار ڈالو کیونکہ وہ شیطان ہی ہیں {cite:muwatta-maruf-1997} [[passage/muwatta-31-2798|موطأ 31:2798]]۔"
  es: "Un joven ansar encontró a su esposa entre las dos puertas y se dirigió hacia ella con su lanza, pero ella le dijo que no se apresurara hasta ver qué había en su casa. Él encontró una serpiente enroscada en su cama y la mató, y ambos murieron sin que nadie supiera quién murió primero. El Profeta dijo: «Hay serpientes en Medina que se han convertido al Islam; si se os muestran después de tres días, matadlas, pues no son más que demonios» {cita:muwatta-maruf-1997} [[pasaje/muwatta-31-2798|Muwatta 31:2798]]."
  fr: "Un jeune homme Ansari trouva sa femme entre deux portes et se précipita vers elle, sa lance à la main. Elle lui dit: « N'avance pas avant d'avoir vu ce qui se trouve dans ta maison. » Il découvrit alors un serpent enroulé sur son lit et le tua. Lui et le serpent moururent, et nul ne sut qui mourut le premier. Le Prophète dit: « Il y a à Médine des serpents qui se sont convertis à l'islam. S'ils se montrent à toi au bout de trois jours, tue-les, car ce ne sont que des démons. » (Muwatta 31:2798)"
  tr: "Ensar'dan genç bir adam iki kapı arasında bir kadın buldu ve mızrağıyla ona doğru uzandı. Kadın, \"Evinde ne olduğunu görmeden acele etme\" dedi. Adam yatağında kıvrılmış bir yılan buldu, onu öldürdü ve hem o hem de yılan öldü. Hangisinin önce öldüğü bilinmiyor. Peygamberimiz şöyle buyurdu: \"Medine'de İslam'ı kabul etmiş cinler vardır. Eğer üç gün sonra sana görünürse, onu öldür; çünkü o bir şeytandır.\" [[Muvatta 31:2798]]."
  id: "Seorang pemuda dari kaum Ansar menemukan seorang wanita di antara dua pintu, lalu ia mengulurkan tombaknya ke arah wanita itu. Wanita itu berkata, “Jangan terburu-buru sampai kau melihat apa yang ada di dalam rumahmu.” Pemuda itu menemukan seekor ular melingkar di tempat tidurnya, lalu ia membunuhnya, dan ia serta ular itu meninggal, dan tidak diketahui siapa di antara mereka yang meninggal lebih dulu. Nabi bersabda, “Ada jin di Madinah yang telah masuk Islam. Jika ia muncul kepadamu setelah tiga hari, bunuhlah ia, karena ia hanyalah setan.” {cite:muwatta-maruf-1997} [[passage/muwatta-31-2798|Al-Muwatta 31:2798]]."
