id: event/nuwayri-dream-729
class: event
kind: other
label:
  ar: "منام الإيوان البحري: النويري ما زال بالناصرية، ١٣ ذي القعدة ٧٢٩هـ/٨ سبتمبر ١٣٢٩م"
  en: "The Iwan al-Bahri dream: al-Nuwayri still at the Nasiriyya, 13 Dhu al-Qa'da 729/8 September 1329"
  ur: "ایوان بحری کا خواب: نويری اب بھی ناصریہ میں، 13 ذیقعدہ 729ھ/8 ستمبر 1329ء"
  es: "El sueño de Iwan al-Bahri: al-Nuwayri todavía en Nasiriyya, 13 de Dhu al-Qa'da de 729/8 de septiembre de 1329"
  fr: "Le rêve d'Iwan al-Bahri: al-Nuwayri toujours à Nasiriyya, 13 Dhu al-Qa'da 729/8 septembre 1329"
  tr: "Deniz Eyvanının Rüyası: Al-Nuwayri hala Nasıriye'de, 13 Zilkade H. 729 / 8 Eylül 1329"
  id: "Mimpi Laut Iwan: Al-Nuwayri Masih di Nasiriyah, 13 Dhu al-Qi'dah 729 H / 8 September 1329 M"
summary:
  ar: "يظهر أن النويري واصل الإقامة بالمدرسة الناصرية: يذكر مناماً رآه في أحد أروقتها المسمى الإيوان البحري ليلة الجمعة ١٣ ذي القعدة ٧٢٩هـ/٨ سبتمبر ١٣٢٩م؛ وليس معلوماً في أي تاريخ بالضبط فارق الإدارة متفرغاً للتصنيف {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}."
  en: "It seems al-Nuwayri continued to reside at the Nasiriyya madrasa: he mentions a dream he had at that time in one of its iwans called al-Iwan al-Bahri, on the eve of Friday 13 Dhu al-Qa'da 729/8 September 1329; the exact date he abandoned administration to devote himself to composition is not known {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}."
  ur: "ظاہر ہے نويری ناصریہ مدرسہ میں ہی مقیم رہے: انہیں اس وقت ایک خواب آیا جس کا ذکر کرتے ہیں، مدرسہ کے ایک ایوان — ایوان بحری میں — جمعہ کی شب 13 ذیقعدہ 729ھ/8 ستمبر 1329ء؛ یہ تاریخ یقینی نہیں کہ انہوں نے تصنیف کے لیے انتظامیہ کب چھوڑی {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}۔"
  es: "Parece que al-Nuwayri continuó residiendo en la madrasa Nasiriyya: menciona un sueño que tuvo en ese momento en uno de sus iwanes llamado al-Iwan al-Bahri, en la víspera del viernes 13 de Dhu al-Qa'da 729/8 de septiembre de 1329; se desconoce la fecha exacta en que abandonó la administración para dedicarse a la composición {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}."
  fr: "Il semble qu'al-Nuwayri ait continué à résider à la madrasa Nasiriyya: il mentionne un rêve qu'il a fait à cette époque dans l'un de ses iwans appelé al-Iwan al-Bahri, la veille du vendredi 13 Dhu al-Qa'da 729/8 septembre 1329; la date exacte à laquelle il a abandonné l'administration pour se consacrer à la composition n'est pas connue {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}."
  tr: "Görünüşe göre El-Nuveyri, El-Nasiriye Okulu'nda ikamet etmeye devam etti: 13 Zilhicce 729 Hicri/8 Eylül 1329 Miladi Cuma gecesi, okulun \"Deniz İvanı\" adlı revaklarından birinde gördüğü bir rüyadan bahseder; ve tam olarak hangi tarihte idareyi bırakıp sınıflandırma işine yöneldiği bilinmemektedir {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}."
  id: "Tampaknya Al-Nuwayri terus tinggal di Sekolah Al-Nasiriyah: ia menyebutkan mimpi yang dilihatnya di salah satu serambi sekolah yang disebut Iwan Laut pada malam Jumat, 13 Dzul Qi'dah 729 H/8 September 1329 M; dan tidak diketahui tanggal pastinya ia meninggalkan administrasi untuk mengabdikan dirinya pada pengklasifikasian {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}."
