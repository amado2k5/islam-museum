label: { ar: "نذر عبد المطلب وقرعة الذبيح", en: "ʿAbd al-Muṭṭalib’s Vow and the Lot", es: "El voto de ʿAbd al-Muṭṭalib y la suerte", fr: "Le vœu d'ʿAbd al-Muṭṭalib et le sort", ur: "عبدالمطلب کی نذر اور لوط", tr: "Abdul Muttalib'in yemini ve kurban için kura çekimi", id: "Sumpah Abdul Muttalib dan undian untuk pengorbanan" }
summary: { ar: "نذر عبد المطلب لينحرن أحد أبنائه إن آتاه الله عشرة؛ خرجت القداح على عبد الله فاستشارت قريش عرافة، فقرعت بينه وبين الإبل حتى بلغت مائة فنحرت فداءً عنه — وبه جرت دية العرب مائة من الإبل.", en: "His vow to sacrifice a son; the lot fell on ʿAbdullāh, and by an auguress’s counsel camels were raised to one hundred and slaughtered in his stead — fixing the Arab bloodwit at a hundred camels.", es: "Su promesa de sacrificar a un hijo; la suerte recayó en ʿAbdullāh, y por consejo de una adivina se reunieron cien camellos y fueron sacrificados en su lugar, fijando así la cifra de sangre árabe en cien camellos.", fr: "Son vœu de sacrifier un fils; le sort tomba sur ʿAbdullāh, et sur le conseil d'une augure, on fit venir cent chameaux qui furent abattus à sa place — fixant ainsi le nombre de chameaux sacrifiés par les Arabes à cent.", ur: "بیٹے کی قربانی دینے کی اس کی نذر؛ عبداللہ کے حصے میں قرعہ اندازی ہوئی، اور ایک صاحب کے مشورہ سے اونٹ ایک سو تک اٹھائے گئے اور ان کی جگہ ذبح کر دیے گئے - عربوں کا خون بہا سو اونٹوں پر مقرر کیا گیا۔", tr: "Abdul Muttalib, Allah ona on oğul verirse oğullarından birini kurban edeceğine yemin etmişti; kura Abdullah'a çıktı, bunun üzerine Kureyşliler bir falcıya danıştılar ve falcı Abdullah ile develer arasında kura çekti, yüz taneye ulaşana kadar devam etti. Böylece develeri fidye olarak kurban ettiler ve böylece Arapların kan parası olan yüz deve geldi.", id: "Abdul Muttalib bersumpah akan mengorbankan salah satu putranya jika Tuhan mengabulkannya sepuluh; undian jatuh pada Abdullah, sehingga kaum Quraisy berkonsultasi dengan seorang peramal, yang mengundi antara Abdullah dan unta-unta hingga jumlahnya mencapai seratus, lalu mereka mengorbankan unta-unta itu sebagai tebusan untuknya — dan dengan itu datanglah uang darah dari orang-orang Arab, seratus unta." }
