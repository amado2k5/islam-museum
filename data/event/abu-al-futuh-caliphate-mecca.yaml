id: event/abu-al-futuh-caliphate-mecca
class: event
kind: declaration
label: { ar: "دعوة أبي الفتوح العلوي بالخلافة بمكة", en: "Abu al-Futuh al-Alawi's Claim to the Caliphate in Mecca", fr: "La revendication du califat par Abu al-Futuh al-Alawi à La Mecque", es: "La pretensión de Abu al-Futuh al-Alawi al califato en La Meca", ur: "ابو الفتوح العلوی کا مکہ میں خلافت کا دعویٰ", tr: "Ebu el-Futuh el-Alavi, halifeliğin Mekke'de kurulmasını savundu.", id: "Abu al-Futuh al-Alawi menyerukan pembentukan kekhalifahan di Mekah." }
summary:
  ar: "في سنة إحدى وثمانين دعا صاحب مكة أبو الفتوح الحسن بن جعفر العلوي إلى نفسه وتلقب بالراشد بالله وسلم عليه بالخلافة فانزعج صاحب مصر ثم ضعف أمر أبي الفتوح وعاد إلى طاعة العزيز العبيدي {cite:tarikh-khulafa-minhaj-1434 p. 635}."
  en: "In 381 Mecca's sharif Abu'l-Futuh al-Hasan ibn Ja'far the Alid made claim for himself, titled al-Rashid bi'llah and was saluted as caliph — Egypt's lord was shaken; then Abu'l-Futuh's cause flagged and he returned to the Ubaydid al-Aziz's obedience {cite:tarikh-khulafa-minhaj-1434 p. 635}."
  fr: "En 381, le chérif de La Mecque, l’Alide Abu'l-Futuh al-Hasan ibn Ja'far, appela à le reconnaître, prit le titre d’al-Rashid bi'llah et fut salué comme calife, alarmant le souverain d’Égypte ; puis sa cause s’affaiblit et il revint à l’obéissance d’al-Aziz l’Ubaydide {cite:tarikh-khulafa-minhaj-1434 p. 635}."
  es: "En el año 381, el sharif de La Meca, Abu'l-Futuh al-Hasan ibn Ja'far el Alid, se autoproclamó califa, obteniendo el título de al-Rashid bi'llah, y fue saludado como tal. El señor de Egipto se estremeció; entonces la causa de Abu'l-Futuh flaqueó y regresó a la obediencia de Ubaydid al-Aziz {cite:tarikh-khulafa-minhaj-1434 p. 635}."
  ur: "381 میں مکہ کے شریف ابو الفتوح الحسن ابن جعفر الید نے الرشید باللہ کے لقب سے اپنے لیے دعویٰ کیا اور اسے خلیفہ کے طور پر سلام پیش کیا گیا - مصر کا آقا ہل گیا؛ اس کے بعد ابوالفتوح کی وجہ کو جھنجھوڑ دیا گیا اور وہ عبیدالعزیز کی اطاعت کی طرف لوٹ آیا۔ 635}۔"
  tr: "Seksen bir yılında, Mekke hükümdarı Ebu el-Futuh el-Hasan ibn Cafer el-Alavi, kendisine biat çağrısında bulundu ve el-Raşid-i Billa unvanını alarak onu halife olarak selamladı. Mısır hükümdarı bundan rahatsız oldu, bunun üzerine Ebu el-Futuh'un gücü zayıfladı ve el-Aziz el-Ubaidi'ye itaat etmeye geri döndü. {Kaynak:tarikh-khulafa-minhaj-1434 s. 635}"
  id: "Pada tahun delapan puluh satu, penguasa Mekah, Abu al-Futuh al-Hasan ibn Ja`far al-Alawi, menyerukan kesetiaan kepadanya dan mengambil gelar al-Rashid Billah serta memberinya gelar Khalifah. Penguasa Mesir merasa terganggu, kemudian kekuasaan Abu al-Futuh melemah dan ia kembali taat kepada al-Aziz al-Ubaidi {cite:tarikh-khulafa-minhaj-1434 p. 635}."
