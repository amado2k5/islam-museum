label: { ar: "فتنة القنطرة الجديدة وتعطل الجمعة", en: "The fitna at the New Bridge and the suspension of Friday prayer", es: "La fitna en el Puente Nuevo y la suspensión de la oración del viernes", fr: "La fitna au Pont Neuf et la suspension de la prière du vendredi", ur: "نئے پل پر فتنہ اور نماز جمعہ کی معطلی۔", tr: "Yeni Köprü tartışması ve Cuma namazının aksaması", id: "Kontroversi Jembatan Baru dan gangguan terhadap salat Jumat" }
summary:
  ar: "في يوم الخميس لثلاث خلون من شعبان سنة تسع وأربعين وثلاثمائة وقعت فتنة بين السنة والشيعة في القنطرة الجديدة، وتعطلت الجمعة من الغد في جميع المساجد الجامعة في الجانبين سوى مسجد براثا فإن الصلاة تمت فيه، وقُبض على جماعة من بني هاشم واعتُقلوا في دار الوزير لأنهم كانوا سبب الفتنة وأُطلقوا من الغد {cite:muntazam-ibn-al-jawzi p. 687}."
  en: "On Thursday 3 Sha'ban 349 a Sunni–Shi'i fitna at the New Bridge suspended Friday prayer in every congregational mosque on both sides — except Baratha, where prayer was held; a band of Banu Hashim blamed for the fitna was jailed in the vizier's house and released next day {cite:muntazam-ibn-al-jawzi p. 687}."
  es: "El jueves 3 de Sha'ban de 349, una fitna suní-chií en el Puente Nuevo suspendió la oración del viernes en todas las mezquitas congregacionales de ambos lados, excepto en Baratha, donde se realizó la oración; un grupo de Banu Hashim, culpado de la fitna, fue encarcelado en la casa del visir y liberado al día siguiente {cite:muntazam-ibn-al-jawzi p. 687}."
  fr: "Le jeudi 3 Sha'ban 349, une fitna sunnite-chiite au Nouveau Pont a suspendu la prière du vendredi dans toutes les mosquées congrégationnelles des deux côtés — sauf Baratha, où la prière a eu lieu; un groupe de Banu Hashim accusés d'être à l'origine de la fitna a été emprisonné dans la maison du vizir et libéré le lendemain {cite:muntazam-ibn-al-jawzi p. 687}."
  ur: "جمعرات 3 شعبان 349 کو نیو برج پر ایک سنی-شیعہ فتنے نے دونوں طرف کی ہر اجتماعی مسجد میں جمعہ کی نماز کو معطل کر دیا — سوائے براتہ کے، جہاں نماز ادا کی گئی تھی۔ بنو ہاشم کے ایک گروہ کو فتنے کا الزام لگا کر وزیر کے گھر میں قید کر دیا گیا اور اگلے دن رہا کر دیا گیا۔ 687}۔"
  tr: "Hicri 349 yılının Şaban ayının üçüncü Perşembe günü, Yeni Köprü'de Sünniler ve Şiiler arasında bir çatışma çıktı ve ertesi gün, Baratha Camii hariç, her iki taraftaki tüm cemaat camilerinde Cuma namazı kılınamadı. Çatışmanın sebebi oldukları gerekçesiyle bir grup Beni Haşim mensubu tutuklandı ve bakanın evinde gözaltına alındı; ertesi gün serbest bırakıldılar. {cite:muntazam-ibn-al-jawzi s. 687}"
  id: "Pada hari Kamis, tanggal 3 Sya'ban tahun 349 Hijriah, terjadi konflik antara Sunni dan Syiah di jembatan baru, dan salat Jumat ditangguhkan pada hari berikutnya di semua masjid berjamaah di kedua sisi, kecuali Masjid Baratha, tempat salat tetap dilaksanakan. Sekelompok Bani Hasyim ditangkap dan ditahan di rumah menteri karena mereka adalah penyebab konflik tersebut, dan mereka dibebaskan pada hari berikutnya. {cite:muntazam-ibn-al-jawzi hlm. 687}"
