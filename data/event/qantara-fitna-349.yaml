label: { ar: "فتنة القنطرة الجديدة وتعطل الجمعة", en: "The fitna at the New Bridge and the suspension of Friday prayer" }
summary:
  ar: "في يوم الخميس لثلاث خلون من شعبان سنة تسع وأربعين وثلاثمائة وقعت فتنة بين السنة والشيعة في القنطرة الجديدة، وتعطلت الجمعة من الغد في جميع المساجد الجامعة في الجانبين سوى مسجد براثا فإن الصلاة تمت فيه، وقُبض على جماعة من بني هاشم واعتُقلوا في دار الوزير لأنهم كانوا سبب الفتنة وأُطلقوا من الغد {cite:muntazam-ibn-al-jawzi p. 687}."
  en: "On Thursday 3 Sha'ban 349 a Sunni–Shi'i fitna at the New Bridge suspended Friday prayer in every congregational mosque on both sides — except Baratha, where prayer was held; a band of Banu Hashim blamed for the fitna was jailed in the vizier's house and released next day {cite:muntazam-ibn-al-jawzi p. 687}."
