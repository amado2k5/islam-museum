label: { ar: "وفاة المعتصم", en: "Death of al-Mu'tasim", es: "Muerte de al-Mu'tasim", fr: "Mort d'al-Mu'tasim", ur: "معتصم کی وفات", tr: "Al-Mu'tasim'in Ölümü", id: "Kematian Al-Mu'tasim" }
summary:
  ar: "مات المعتصم يوم الخميس لإحدى عشرة ليلة بقيت من ربيع الأول سنة سبع وعشرين ومئتين، وقال في مرض موته ذهبت الحيلة فليس حيلة، وقيل جعل يقول أؤخذ من بين هذا الخلق، وكان قد عزم على المسير إلى أقصى الغرب ليملك البلاد التي لم تدخل في ملك بني العباس لاستيلاء الأموي عليها فقال لأحمد بن الخصيب بنو أمية ملكوا وما لأحد منا ملك وملكنا نحن ولهم بالأندلس هذا الأموي فقدر ما يحتاج إليه لمحاربته فاشتدت علته ومات {cite:tarikh-khulafa-minhaj-1434 p. 523-524}."
  en: "Al-Mu'tasim died Thursday, 11 Rabi' I 227; in his illness he kept saying 'the ruse is gone — there is no ruse'. He had resolved to march to the far west against the Umayyad of al-Andalus — 'the Umayyads ruled when none of us had rule; we rule and this Umayyad holds al-Andalus? Reckon what is needed to fight him' — when his illness grew heavy and he died {cite:tarikh-khulafa-minhaj-1434 p. 523-524}."
  es: "Al-Mu'tasim murió el jueves 11 de Rabi' I de 227; durante su enfermedad, no dejaba de repetir: «Se acabó el engaño; ya no hay engaño». Había decidido marchar hacia el lejano oeste contra los omeyas de al-Ándalus: «Los omeyas gobernaban cuando ninguno de nosotros gobernaba; ahora gobernamos nosotros y este omeya controla al-Ándalus. Calcula lo que se necesita para combatirlo», cuando su enfermedad se agravó y falleció {cite:tarikh-khulafa-minhaj-1434 p. 523-524}."
  fr: "Al-Mu'tasim mourut le jeudi 11 Rabi' I 227. Dans sa maladie, il répétait sans cesse: « La ruse est perdue, il n'y a plus de ruse. » Il avait résolu de marcher vers l'extrême ouest contre les Omeyyades d'al-Andalus: « Les Omeyyades régnaient quand aucun d'entre nous n'exerçait le pouvoir; nous régnons et cet Omeyyade contrôle al-Andalus ? Imaginez ce qu'il faut pour le combattre ! » Lorsque sa maladie s'aggrava et qu'il mourut (voir: Tarikh-Khulafa-Minhaj-1434, p. 523-524)."
  ur: "المعتصم کا انتقال جمعرات، 11 ربیع الثانی 227؛ اپنی بیماری میں وہ یہ کہتے رہے کہ 'فریب ختم ہو گیا ہے - کوئی بھی چال نہیں ہے'۔ اس نے اندلس کی اموی کے خلاف دور مغرب کی طرف مارچ کرنے کا عزم کیا تھا - 'امویوں نے اس وقت حکومت کی جب ہم میں سے کسی کی حکومت نہیں تھی۔ کیا ہم حکومت کرتے ہیں اور یہ اموی اندلس پر قابض ہے؟ اس سے لڑنے کی کیا ضرورت ہے اس کا اندازہ کرو۔ جب اس کی بیماری بہت بڑھ گئی اور وہ فوت ہو گیا۔ 523-524}۔"
  tr: "El-Mu'tasim, 227 yılının Rebiü'l-Evvel ayının bitimine on bir gece kala Perşembe günü vefat etti. Son hastalığı sırasında, \"Oyun bitti, artık oyun kalmadı\" dedi. \"Ben bu insanların arasından alınacağım\" diye tekrarladığı rivayet edilir. Emevilerin ele geçirmesi nedeniyle Abbasilerin egemenliğine girmemiş olan toprakları yönetmek için uzak batıya doğru ilerlemeye karar vermişti. Ahmed ibn el-Hasib'e, \"Emeviler hüküm sürdü ve hiçbirimizin krallığı yok. Bizim krallığımız var, onların ise Endülüs'te bu Emevi var\" dedi. Böylece onunla savaşmak için neye ihtiyacı olduğunu hesapladı. Sonra hastalığı kötüleşti ve öldü. {cite:tarikh-khulafa-minhaj-1434 s. 523-524}"
  id: "Al-Mu'tasim wafat pada hari Kamis, sebelas malam tersisa di bulan Rabi' al-Awwal tahun 227. Selama sakitnya yang terakhir, ia berkata, \"Tipuan itu telah hilang, tidak ada lagi tipuan yang tersisa.\" Dikatakan bahwa ia terus berkata, \"Aku akan diambil dari antara orang-orang ini.\" Ia telah bertekad untuk berbaris ke barat jauh untuk memerintah wilayah yang belum berada di bawah kekuasaan Abbasiyah karena penguasaan Umayyah. Ia berkata kepada Ahmad ibn al-Khasib, \"Umayyah telah berkuasa, dan tidak seorang pun dari kita memiliki kerajaan. Kita memiliki kerajaan, dan mereka memiliki Umayyah ini di Andalusia.\" Maka ia memperkirakan apa yang dibutuhkannya untuk melawannya. Kemudian penyakitnya memburuk dan ia meninggal. {cite:tarikh-khulafa-minhaj-1434 p. 523-524}"
