summary:
  en: "The opening single combat of Badr: Utba, Shayba and al-Walid of Quraysh against Ubayda, Hamza and Ali; all three Qurayshis fell, and Ubayda died of his wound days later."
  ar: "المبارزة الافتتاحية في بدر: عتبة وشيبة ابنا ربيعة والوليد بن عتبة في مقابل عبيدة بن الحارث وحمزة وعلي؛ قُتل القرشيون الثلاثة، وقضى عبيدة من جرحه بعد أيام."
