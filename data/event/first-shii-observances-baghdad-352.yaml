label: { ar: "أول مأتم عاشوراء وعيد غدير ببغداد", en: "The first 'Ashura mourning and Ghadir festival in Baghdad", es: "El primer festival de luto de Ashura y Ghadir en Bagdad", fr: "Premier deuil d'Achoura et festival de Ghadir à Bagdad", ur: "بغداد میں پہلا عاشورہ کا ماتم اور غدیر کا تہوار", tr: "Bağdat'ta ilk Aşura ve Gadir Bayramı yas töreni düzenlendi.", id: "Upacara peringatan Ashura dan Idul Ghadir pertama di Baghdad." }
summary:
  ar: "في سنة إحدى وخمسين كتبت الشيعة ببغداد على أبواب المساجد لعنة معاوية ولعنة من غصب فاطمة حقها من فدك ومن منع الحسن أن يدفن مع جده ولعنة من نفى أبا ذر فمحي في الليل فأراد معز الدولة أن يعيده فأشار عليه الوزير المهلبي أن يكتب مكان ما محي لعن الله الظالمين لآل رسول الله وصرحوا بلعنة معاوية فقط، وفي سنة اثنتين وخمسين يوم عاشوراء ألزم معز الدولة الناس بغلق الأسواق ومنع الطباخين من الطبخ ونصبوا القباب في الأسواق وعلقوا عليها المسوح وأخرجوا نساء منشرات الشعور يلطمن في الشوارع ويقمن المأتم على الحسين وهذا أول يوم نيح عليه ببغداد واستمرت هذه البدعة سنين وفي ثامن عشر ذي الحجة منها عمل عيد غدير خم وضربت الدبادب {cite:tarikh-khulafa-minhaj-1434 p. 619}، وفي سنة ستين وثلاثمائة أقامت الشيعة عاشوراء باللطم والعويل وعيد الغدير بالفرح والكوسات {cite:shadharat-dhahab p. 28}."
  en: "In 351 the Shi'a of Baghdad wrote on the mosque doors curses on Mu'awiya, on those who seized Fatima's Fadak, who kept al-Hasan from burial beside his grandfather, who exiled Abu Dharr; it was erased by night, and vizier al-Muhallabi advised Mu'izz al-Dawla to substitute 'God curse the wrongdoers of the Prophet's house' — only Mu'awiya's cursing stayed explicit. On Ashura 352 Mu'izz compelled the markets shut, forbade cooking, set up mourning domes hung with sackcloth, and brought out dishevelled women beating their cheeks — the first Husayn lamentation at Baghdad, a practice that lasted years, and on 18 Dhu'l-Hijja the Ghadir Khumm festival was made with drums {cite:tarikh-khulafa-minhaj-1434 p. 619}."
  es: "En 351, los chiítas de Bagdad escribieron en las puertas de la mezquita maldiciones contra Mu'awiya, contra quienes se apoderaron del Fadak de Fátima, contra quienes impidieron que al-Hasan fuera enterrado junto a su abuelo, contra quienes exiliaron a Abu Dharr; fueron borradas durante la noche, y el visir al-Muhallabi aconsejó a Mu'izz al-Dawla que las sustituyera por \"Que Dios maldiga a los malhechores de la casa del Profeta\"; solo la maldición de Mu'awiya permaneció explícita. En Ashura 352, Mu'izz ordenó el cierre de los mercados, prohibió cocinar, instaló cúpulas de luto cubiertas con cilicio y sacó a mujeres desaliñadas que se golpeaban las mejillas; el primer lamento de Husayn en Bagdad, una práctica que duró años, y el 18 de Dhu'l-Hijja se celebró el festival de Ghadir Khumm con tambores {cite:tarikh-khulafa-minhaj-1434 p. 619}."
  fr: "En 351, les chiites de Bagdad inscrivirent sur les portes de la mosquée des malédictions contre Mu'awiya, contre ceux qui s'étaient emparés du fadak de Fatima, contre ceux qui avaient empêché al-Hasan d'être enterré auprès de son grand-père, et contre ceux qui avaient exilé Abu Dharr. Ces inscriptions furent effacées durant la nuit, et le vizir al-Muhallabi conseilla à Mu'izz al-Dawla de les remplacer par: « Que Dieu maudisse les persécuteurs de la maison du Prophète » – seule la malédiction de Mu'awiya demeura explicite. Le jour d'Achoura 352, Mu'izz ordonna la fermeture des marchés, interdit la cuisine, fit ériger des dômes de deuil recouverts de sacs et fit sortir des femmes débraillées se frappant les joues – la première lamentation pour Husayn à Bagdad, une pratique qui perdura des années. Le 18 Dhu al-Hijja, le festival de Ghadir Khumm fut célébré au son des tambours (voir: tarikh-khulafa-minhaj-1434, p. 619)."
  ur: "351 میں بغداد کے شیعوں نے مسجد کے دروازوں پر معاویہ پر لعنت لکھی، فاطمہ کے فدک پر قبضہ کرنے والوں پر، جنہوں نے حسن کو اپنے دادا کے پاس دفن کرنے سے روکا، جنہوں نے ابوذر کو جلاوطن کیا؛ اسے رات تک مٹا دیا گیا، اور وزیر المحلبی نے معاذ الدولہ کو مشورہ دیا کہ 'خدا کی لعنت ہو رسول کے گھر کے ظالموں پر' - صرف معاویہ کی لعنت ہی واضح رہی۔ عاشورہ 352 کو معز نے بازاروں کو بند کرنے پر مجبور کیا، کھانا پکانے سے منع کیا، ٹاٹ کے ساتھ لٹکائے ہوئے ماتمی گنبد قائم کیے، اور ان کے گال پیٹتے ہوئے پراگندہ عورتوں کو باہر نکالا - بغداد میں پہلا نوحہ خوانی، جو برسوں تک جاری رہا، اور 18 ذی الحجہ کو غدیر خمس کے ساتھ تہوار منایا گیا۔ {حوالہ: تاریخ خلفاء منہاج 1434 ص۔ 619}۔"
  tr: "51 yılında Bağdat'taki Şiiler camilerin kapılarına Muaviye'ye, Fatıma'nın Fadak hakkını gasp edene, Hasan'ın dedesiyle birlikte gömülmesini engelleyene ve Ebu Zerr'i sürgüne gönderene lanet okudular. Geceleyin silindi, bu yüzden Muizz el-Davlah bunu geri yüklemek istedi, ancak vezir el-Muhallabi ona silinenlerin yerine \"Allah, Resulünün ailesinin zalimlerine lanet etsin\" yazmasını tavsiye etti ve sadece Muaviye'ye açıkça lanet okudular. 52 yılında, Aşura günü, Muizz el-Davlah insanları pazarları kapatmaya zorladı ve aşçıların yemek pişirmesini yasakladı. Pazarlara çadırlar kurup üzerlerine çuval astılar ve sokaklarda göğüslerini döven ve Hüseyin için yas tutan, saçları dağınık kadınlar çıkardılar. Bu, Bağdat'ta onun için ilk yas günüydü ve bu yenilik yıllarca devam etti. O yılın Zilhicce ayının on sekizinci gününde Gadir Hum bayramı kutlandı ve davullar çalındı. 619} ve üç yüz altmış yılında Şiiler Aşura'yı ağıt ve feryatla, Gadir Bayramı'nı ise sevinç ve kutlamalarla geçirdiler. {kaynak: Şadharat-dhahab s. 28}"
  id: "Pada tahun 51, kaum Syiah di Baghdad menulis kutukan terhadap Muawiyah di pintu-pintu masjid, kutukan terhadap siapa pun yang merampas hak Fatimah atas Fadak, kutukan terhadap siapa pun yang mencegah al-Hasan dimakamkan bersama kakeknya, dan kutukan terhadap siapa pun yang mengasingkan Abu Dharr. Tulisan itu dihapus pada malam hari, sehingga Mu'izz al-Dawlah ingin mengembalikannya, tetapi menteri al-Muhallabi menyarankannya untuk menulis di tempat yang dihapus, \"Semoga Allah melaknat para penindas keluarga Rasulullah,\" dan mereka secara eksplisit hanya mengutuk Muawiyah. Pada tahun 52, pada hari Asyura, Mu'izz al-Dawlah memaksa orang-orang untuk menutup pasar dan melarang juru masak memasak. Mereka mendirikan tenda di pasar dan menggantung kain karung di atasnya, dan mereka membawa perempuan dengan rambut acak-acakan untuk memukul dada mereka di jalan-jalan dan mengadakan upacara berkabung untuk al-Husayn. Ini adalah hari berkabung pertama baginya di Baghdad, dan inovasi ini berlanjut selama bertahun-tahun. Pada tanggal 18 Dzul Hijjah tahun itu, festival Ghadir Khumm diadakan, dan genderang ditabuh. 619}, dan pada tahun 360, kaum Syiah memperingati Asyura dengan ratapan dan tangisan, dan Idul Ghadir dengan sukacita dan perayaan {kutip:shadharat-dhahab hlm. 28}."
