label: { ar: "أول مأتم عاشوراء وعيد غدير ببغداد", en: "The first 'Ashura mourning and Ghadir festival in Baghdad", es: "El primer festival de luto de Ashura y Ghadir en Bagdad", fr: "Premier deuil d'Achoura et festival de Ghadir à Bagdad" }
summary:
  ar: "في سنة إحدى وخمسين كتبت الشيعة ببغداد على أبواب المساجد لعنة معاوية ولعنة من غصب فاطمة حقها من فدك ومن منع الحسن أن يدفن مع جده ولعنة من نفى أبا ذر فمحي في الليل فأراد معز الدولة أن يعيده فأشار عليه الوزير المهلبي أن يكتب مكان ما محي لعن الله الظالمين لآل رسول الله وصرحوا بلعنة معاوية فقط، وفي سنة اثنتين وخمسين يوم عاشوراء ألزم معز الدولة الناس بغلق الأسواق ومنع الطباخين من الطبخ ونصبوا القباب في الأسواق وعلقوا عليها المسوح وأخرجوا نساء منشرات الشعور يلطمن في الشوارع ويقمن المأتم على الحسين وهذا أول يوم نيح عليه ببغداد واستمرت هذه البدعة سنين وفي ثامن عشر ذي الحجة منها عمل عيد غدير خم وضربت الدبادب {cite:tarikh-khulafa-minhaj-1434 p. 619}، وفي سنة ستين وثلاثمائة أقامت الشيعة عاشوراء باللطم والعويل وعيد الغدير بالفرح والكوسات {cite:shadharat-dhahab p. 28}."
  en: "In 351 the Shi'a of Baghdad wrote on the mosque doors curses on Mu'awiya, on those who seized Fatima's Fadak, who kept al-Hasan from burial beside his grandfather, who exiled Abu Dharr; it was erased by night, and vizier al-Muhallabi advised Mu'izz al-Dawla to substitute 'God curse the wrongdoers of the Prophet's house' — only Mu'awiya's cursing stayed explicit. On Ashura 352 Mu'izz compelled the markets shut, forbade cooking, set up mourning domes hung with sackcloth, and brought out dishevelled women beating their cheeks — the first Husayn lamentation at Baghdad, a practice that lasted years, and on 18 Dhu'l-Hijja the Ghadir Khumm festival was made with drums {cite:tarikh-khulafa-minhaj-1434 p. 619}."
  es: "En 351, los chiítas de Bagdad escribieron en las puertas de la mezquita maldiciones contra Mu'awiya, contra quienes se apoderaron del Fadak de Fátima, contra quienes impidieron que al-Hasan fuera enterrado junto a su abuelo, contra quienes exiliaron a Abu Dharr; fueron borradas durante la noche, y el visir al-Muhallabi aconsejó a Mu'izz al-Dawla que las sustituyera por \"Que Dios maldiga a los malhechores de la casa del Profeta\"; solo la maldición de Mu'awiya permaneció explícita. En Ashura 352, Mu'izz ordenó el cierre de los mercados, prohibió cocinar, instaló cúpulas de luto cubiertas con cilicio y sacó a mujeres desaliñadas que se golpeaban las mejillas; el primer lamento de Husayn en Bagdad, una práctica que duró años, y el 18 de Dhu'l-Hijja se celebró el festival de Ghadir Khumm con tambores {cite:tarikh-khulafa-minhaj-1434 p. 619}."
  fr: "En 351, les chiites de Bagdad inscrivirent sur les portes de la mosquée des malédictions contre Mu'awiya, contre ceux qui s'étaient emparés du fadak de Fatima, contre ceux qui avaient empêché al-Hasan d'être enterré auprès de son grand-père, et contre ceux qui avaient exilé Abu Dharr. Ces inscriptions furent effacées durant la nuit, et le vizir al-Muhallabi conseilla à Mu'izz al-Dawla de les remplacer par: « Que Dieu maudisse les persécuteurs de la maison du Prophète » – seule la malédiction de Mu'awiya demeura explicite. Le jour d'Achoura 352, Mu'izz ordonna la fermeture des marchés, interdit la cuisine, fit ériger des dômes de deuil recouverts de sacs et fit sortir des femmes débraillées se frappant les joues – la première lamentation pour Husayn à Bagdad, une pratique qui perdura des années. Le 18 Dhu al-Hijja, le festival de Ghadir Khumm fut célébré au son des tambours (voir: tarikh-khulafa-minhaj-1434, p. 619)."
