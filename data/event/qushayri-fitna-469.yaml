label: { ar: "فتنة القشيري بين الحنابلة والأشعرية ببغداد", en: "The al-Qushayri fitna between the Hanbalis and the Ash'aris in Baghdad", es: "La fitna de al-Qushayri entre los hanbalíes y los ash'aris en Bagdad.", fr: "La fitna d'al-Qushayri entre les Hanbalites et les Ash'arites à Bagdad", ur: "بغداد میں حنبلی اور اشعری کے درمیان القشیری فتنہ" }
summary:
  ar: "في شوال سنة 469هـ وقعت الفتنة بين الحنابلة والأشعرية ببغداد، وكان السبب أن أبا نصر بن القشيري ورد بغداد وجلس في النظامية يذم الحنابلة وينسبهم إلى التجسيم، ومال أبو إسحاق الشيرازي إلى نصرته وكتب إلى النظام يشكو الحنابلة ويسأله المعونة، واتفق الغوغاء على الهجوم على الشريف أبي جعفر في مسجده فرتب جماعة أعدهم لرد الخصومة فرماهم هؤلاء بالآجر فوقعت الفتنة وقتل خياط من سوق الثلاثاء وصاحت أمها على باب النوبي «المستنصر بالله يا منصور»، وغضب أبو إسحاق الشيرازي ومضى إلى باب الطاق وأخذ في إعداد أهبة السفر فأنفذ إليه الخليفة من ردّه. ثم استدعى الوزير فخر الدولة بن جهير الشريف أبا جعفر للمصالحة فحضر مع أبي إسحاق وأبي سعد الصوفي وأبي نصر بن القشيري، فقبل أبو إسحاق رأس الشريف فقال له «قد كان ما تقول، إلا أنك لما كنت فقيراً لم يظهر لنا ما في نفسك فلما جاءك الأعوان والسلطان وخواجا بزوك أبديت ما كان مخفياً»، وقال لأبي سعد الصوفي «أيها الشيخ أما الفقهاء فإذا تكلموا في مسائل الأصول فلهم فيها مدخل فأما أنت فصاحب لهو وسماع وبغتة»، ولما قام القشيري قال «لو جاز أن يُشكر أحد على بدعته لكان هذا الشاب لأنه باهتنا بما في نفسه ولم ينافقنا كما فعل هذان»، ثم قال «أي صلح بيننا؟ إنما يكون الصلح بين مختصمين على ولاية أو دنيا أو قسمة ميراث أو تنازع في ملك، فأما هؤلاء القوم فيزعمون أنا كفار ونحن نزعم أن من لا يعتقد ما نعتقده كافر فأي صلح بيننا». وقرر الشريف أن جدّي الخليفة القائم والقادر أخرجا اعتقادهما للناس وقرئ عليهم في دواوينهم وحمله الخراسانيون والحجيج إلى أطراف الأرض «ونحن على اعتقادهما». وقيل إن الشريف مرض بعدها فانتفخت رجلاه وقيل إن بعض المتفقهة من الأعداء دسّ له في مداسه سماً والله أعلم {cite:muntazam-ibn-al-jawzi j.8 p.305-307}."
  en: "In Shawwal 469 fighting broke out in Baghdad between the Hanbalis and the Ash'aris. The cause was that Abu Nasr ibn al-Qushayri returned to Baghdad and sat in the Nizamiyya denouncing the Hanbalis and attributing anthropomorphism (tajsim) to them. Abu Ishaq al-Shirazi inclined to support him and wrote to al-Nizam complaining of the Hanbalis and asking for his help. The mob agreed to attack the Sharif Abu Ja'far in his mosque; he had arranged a group to repel them, who pelted the attackers with bricks, and the fitna broke out. A tailor from the Tuesday market was killed, and a cry went up at the Nawbi gate: 'Al-Mustansir bi-llah, O Mansur!' Abu Ishaq was angry and went off to Bab al-Taq, beginning to prepare for departure, but the caliph sent to bring him back. Then the vizier Fakhr al-Dawla ibn Jahir summoned Sharif Abu Ja'far for reconciliation; he attended with Abu Ishaq, Abu Sa'd al-Sufi and Abu Nasr ibn al-Qushayri. Abu Ishaq kissed the Sharif's head and said: 'It is as you say, but when you were poor your inner feelings were not visible to us; when the agents and the sultan and Khwaja Buzurg came to you, you revealed what had been hidden.' To Abu Sa'd al-Sufi he said: 'Sheikh, as for the jurists, when they speak on matters of principle they have standing; but you are a man of amusement, music and sudden fancies.' When al-Qushayri rose he said: 'If anyone could be thanked for his innovation it would be this young man, for he confronted us with what was in him and did not flatter us as those two did.' Then he said: 'What reconciliation is there between us? Reconciliation is between litigants over an office, worldly matters, the division of an inheritance or a dispute over property. But these people claim we are unbelievers, and we claim that whoever does not hold our belief is an unbeliever; so what reconciliation is there between us?' The Sharif declared that his two grandfathers, the caliphs al-Qa'im and al-Qadir, had made their belief public and had it read in their registers, and that the Khurasanis and the pilgrims carried it to the ends of the earth: 'and we follow their belief.' It is said that the Sharif fell ill afterwards and his legs swelled; it is also said that one of the jurist-enemies slipped poison into his shoe, God knows best {cite:muntazam-ibn-al-jawzi j.8 p.305-307}."
  es: "En Shawwal de 469, estallaron enfrentamientos en Bagdad entre los hanbalíes y los ash'aris. La causa fue que Abu Nasr ibn al-Qushayri regresó a Bagdad y se sentó en la Nizamiyya denunciando a los hanbalíes y atribuyéndoles antropomorfismo (tajsim). Abu Ishaq al-Shirazi se inclinó a apoyarlo y escribió a al-Nizam quejándose de los hanbalíes y pidiéndole ayuda. La multitud acordó atacar al Sharif Abu Ja'far en su mezquita; él había organizado un grupo para repelerlos, quienes arrojaron ladrillos a los atacantes, y estalló la fitna. Un sastre del mercado del martes fue asesinado, y se oyó un grito en la puerta del Nawbi: «¡Al-Mustansir bi-llah, oh Mansur!». Abu Ishaq se enfureció y partió hacia Bab al-Taq, preparándose para irse, pero el califa mandó llamarlo para que regresara. Entonces el visir Fakhr al-Dawla ibn Jahir convocó a Sharif Abu Ja'far para la reconciliación; acudió con Abu Ishaq, Abu Sa'd al-Sufi y Abu Nasr ibn al-Qushayri. Abu Ishaq besó la cabeza del Sharif y dijo: 'Es como dices, pero cuando eras pobre tus sentimientos internos no eran visibles para nosotros; cuando los agentes, el sultán y Khwaja Buzurg vinieron a ti, revelaste lo que había estado oculto'. A Abu Sa'd al-Sufi le dijo: 'Sheikh, en cuanto a los juristas, cuando hablan sobre cuestiones de principios tienen autoridad; pero tú eres un hombre de diversión, música y fantasías repentinas'. Cuando al-Qushayri se levantó, dijo: 'Si a alguien se le puede agradecer su innovación, sería a este joven, porque nos confrontó con lo que había en su interior y no nos aduló como lo hicieron esos dos'. Luego dijo: '¿Qué reconciliación hay entre nosotros? La reconciliación se da entre litigantes por un cargo, asuntos mundanos, la división de una herencia o una disputa sobre propiedades. Pero esta gente afirma que somos incrédulos, y nosotros afirmamos que quien no comparte nuestra creencia es un incrédulo; entonces, ¿qué reconciliación hay entre nosotros? El Sharif declaró que sus dos abuelos, los califas al-Qa'im y al-Qadir, habían hecho pública su creencia y la habían hecho leer en sus registros, y que los khurasaníes y los peregrinos la llevaron hasta los confines de la tierra: «y nosotros seguimos su creencia». Se dice que el Sharif enfermó después y se le hincharon las piernas; también se dice que uno de los juristas enemigos le puso veneno en el zapato, Dios sabe mejor {cite:muntazam-ibn-al-jawzi j.8 p.305-307}."
  fr: "En Shawwal 469, des combats éclatèrent à Bagdad entre les Hanbalites et les Ash'arites. La cause en fut le retour à Bagdad d'Abu Nasr ibn al-Qushayri, qui siégea à la Nizamiyya et dénonça les Hanbalites, leur attribuant des traits anthropomorphiques (tajsim). Abu Ishaq al-Shirazi, enclin à le soutenir, écrivit à al-Nizam pour se plaindre des Hanbalites et solliciter son aide. La foule décida d'attaquer le chérif Abu Ja'far dans sa mosquée; celui-ci avait organisé une riposte, et les membres du groupe jetèrent des briques sur les assaillants, déclenchant ainsi la fitna. Un tailleur du marché du mardi fut tué, et un cri s'éleva à la porte Nawbi: « Al-Mustansir bi-llah, ô Mansur ! » Furieux, Abu Ishaq se rendit à Bab al-Taq, se préparant à partir, mais le calife le fit revenir. Le vizir Fakhr al-Dawla ibn Jahir convoqua alors le chérif Abu Ja'far pour une conciliation. Il était accompagné d'Abu Ishaq, d'Abu Sa'd al-Sufi et d'Abu Nasr ibn al-Qushayri. Abu Ishaq embrassa la tête du chérif et dit: « C'est comme tu le dis, mais lorsque tu étais pauvre, tes sentiments nous étaient cachés; lorsque les agents, le sultan et Khwaja Buzurg vinrent te trouver, tu révélas ce qui était resté secret. » À Abu Sa'd al-Sufi, il dit: « Cheikh, quant aux juristes, lorsqu'ils s'expriment sur des questions de principe, ils ont toute légitimité; mais toi, tu es un homme de divertissement, de musique et de fantaisies soudaines. » Al-Qushayri se leva et dit: « Si quelqu'un mérite d'être remercié pour son innovation, c'est bien ce jeune homme, car il nous a confrontés à sa véritable nature et ne nous a pas flattés comme l'ont fait ces deux-là. » Puis il ajouta: « Quelle conciliation peut-on espérer entre nous ? » La réconciliation s'opère entre les parties en conflit au sujet d'une fonction, de questions temporelles, du partage d'un héritage ou d'un différend foncier. Or, ces gens prétendent que nous sommes des incroyants, et nous affirmons que quiconque ne partage pas notre croyance est un incroyant; dès lors, quelle réconciliation peut-on espérer entre nous ? Le Chérif déclara que ses deux grands-pères, les califes al-Qa'im et al-Qadir, avaient rendu leur croyance publique et l'avaient fait inscrire dans leurs registres, et que les Khorasanites et les pèlerins l'avaient diffusée jusqu'aux extrémités de la terre: « et nous suivons leur croyance. » On raconte que le Chérif tomba malade par la suite et que ses jambes enflérent; on raconte aussi que l'un des juristes ennemis glissa du poison dans sa chaussure. Dieu est le plus savant. (Voir: Muntazam ibn al-Jawzi, vol. 8, p. 305-307)."
  ur: "شوال 469 میں بغداد میں حنبلی اور اشعری کے درمیان لڑائی ہوئی۔ وجہ یہ تھی کہ ابو نصر ابن القشیری بغداد واپس آئے اور نظامیہ میں بیٹھ کر حنبلیوں کی مذمت کرتے ہوئے اور ان کی طرف تجسم کو منسوب کیا۔ ابو اسحاق الشیرازی نے اس کی حمایت کی اور نظام کو خط لکھا اور حنبلیوں کی شکایت کی اور ان سے مدد طلب کی۔ ہجوم شریف ابو جعفر پر ان کی مسجد میں حملہ کرنے پر آمادہ ہوا۔ اس نے ان کو پیچھے ہٹانے کے لیے ایک گروہ ترتیب دیا تھا جس نے حملہ آوروں پر اینٹ بجا دی اور فتنہ پھوٹ پڑا۔ منگل بازار کا ایک درزی مارا گیا، اور نوبی دروازے پر پکار اٹھی: 'المستنصر باللہ، اے منصور!' ابو اسحاق غصے میں تھے اور باب الطاق کی طرف چلے گئے، روانگی کی تیاری کرنے لگے، لیکن خلیفہ نے اسے واپس لانے کے لیے بھیجا۔ پھر وزیر فخر الدولہ ابن جہر نے شریف ابو جعفر کو صلح کے لیے بلایا۔ آپ نے ابو اسحاق، ابو سعد الصوفی اور ابو نصر بن القشیری کے ساتھ شرکت کی۔ ابو اسحاق نے شریف کا ماتھا چوما اور کہا: جیسا تم کہتے ہو، لیکن جب تم غریب تھے تو تمہارے اندر کے احساسات ہمیں نظر نہیں آتے تھے۔ جب ایجنٹ اور سلطان اور خواجہ بزرگ آپ کے پاس آئے تو آپ نے جو کچھ چھپا ہوا تھا وہ ظاہر کر دیا۔ ابو سعد الصفی سے اس نے کہا: 'شیخ جہاں تک فقہا کا تعلق ہے، جب وہ اصولی امور پر بات کرتے ہیں تو ان کا موقف ہوتا ہے۔ لیکن آپ تفریح، موسیقی اور اچانک پسند کرنے والے آدمی ہیں۔' جب القشیری اٹھے تو اس نے کہا: 'اگر اس کی اختراع پر کسی کا شکریہ ادا کیا جا سکتا ہے تو وہ یہ نوجوان ہوگا، کیونکہ اس نے ہمارے سامنے جو کچھ اس میں تھا اس کا مقابلہ کیا اور ان دونوں کی طرح ہماری چاپلوسی نہیں کی۔' پھر فرمایا: ہمارے درمیان کیا صلح ہے؟ مفاہمت کسی دفتر، دنیاوی معاملات، وراثت کی تقسیم یا جائیداد کے تنازعہ پر مقدمہ چلانے والوں کے درمیان ہے۔ لیکن یہ لوگ دعویٰ کرتے ہیں کہ ہم کافر ہیں، اور ہم دعویٰ کرتے ہیں کہ جو ہمارا عقیدہ نہیں رکھتا وہ کافر ہے۔ تو ہمارے درمیان کیا صلح ہے؟ شریف نے اعلان کیا کہ ان کے دو دادا، خلیفہ القائم اور القادر، نے اپنا عقیدہ عام کیا تھا اور اسے اپنے رجسٹروں میں پڑھا تھا، اور خراسانیوں اور زائرین نے اسے زمین کے کناروں تک پہنچایا تھا: 'اور ہم ان کے عقیدے کی پیروی کرتے ہیں۔' کہا جاتا ہے کہ اس کے بعد شریف بیمار ہو گئے اور ان کی ٹانگیں سوج گئیں۔ یہ بھی کہا جاتا ہے کہ فقیہ دشمنوں میں سے ایک نے اس کے جوتے میں زہر ڈالا، خدا بہتر جانتا ہے {حوالہ:منتظم ابن الجوزی ج8 ص 305-307}۔"
