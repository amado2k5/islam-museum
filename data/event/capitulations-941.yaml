label: { ar: "معاهدة الامتيازات العثمانية الفرنسية" }
summary:
  ar: "بدأت مفاوضات فرنسا مع الدولة العثمانية بعد معركة بافيا التي أُسر فيها ملك فرنسا فرانسوا الأول عام ١٥٢٥م، فأرسلت والدته والوصية على العرش مبعوثها جون فرانجيباني ومعه خطاب منها وخطاب من الملك الأسير يطلبان فيهما مهاجمة قوات عائلة الهابسبورج وإطلاق سراح الأسير. وبعد إطلاق سراحه أرسل فرانسوا في عام ٩٤١هـ/١٥٣٥م سكرتيره جان دي لافوريه إلى السلطان سليمان بهدف عقد تحالف في شكل معاهدة سُميت بمعاهدة الامتيازات العثمانية الفرنسية، ومن أهم نصوصها: حرية التنقل والملاحة في سفن مسلحة وغير مسلحة، وحق التجارة في كل أجزاء الدولة العثمانية، ودفع الرسوم مرة واحدة، وأن الضرائب التي يدفعها الفرنسيون هي نفسها التي يدفعها الرعايا الأتراك، وحق التمثيل القنصلي مع حصانة، وأن ينظر القنصل الفرنسي في قضايا رعايا ملكه المدنية والجنائية، وحرية العبادة لرعايا الملك، ومنع استعباد رعيته. وكان من نتائجها زيادة التعاون بين الأسطولين الفرنسي والعثماني وشن الأسطول العثماني هجمات قوية على شواطئ مملكة نابولي {cite:dawlat-uthmaniyya-salabi p. 203}."
  en: "The Franco-Ottoman Capitulations of 1535 — born of Francis I's captivity at Pavia and his mother's letter to Sulayman: free navigation, consular jurisdiction, freedom of worship and protection from enslavement, sealed with joint fleets against Naples {cite:dawlat-uthmaniyya-salabi p. 203}."
