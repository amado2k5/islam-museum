label: { ar: "معاهدة الامتيازات العثمانية الفرنسية", en: "Franco-Ottoman Capitulations", fr: "Les Capitulations franco-ottomanes", es: "Capitulaciones franco-otomanas", tr: "Osmanlı-Fransız Kapitülasyon Antlaşması", id: "Perjanjian Kapitulasi Ottoman-Prancis" }
summary:
  ar: "بدأت مفاوضات فرنسا مع الدولة العثمانية بعد معركة بافيا التي أُسر فيها ملك فرنسا فرانسوا الأول عام ١٥٢٥م، فأرسلت والدته والوصية على العرش مبعوثها جون فرانجيباني ومعه خطاب منها وخطاب من الملك الأسير يطلبان فيهما مهاجمة قوات عائلة الهابسبورج وإطلاق سراح الأسير. وبعد إطلاق سراحه أرسل فرانسوا في عام ٩٤١هـ/١٥٣٥م سكرتيره جان دي لافوريه إلى السلطان سليمان بهدف عقد تحالف في شكل معاهدة سُميت بمعاهدة الامتيازات العثمانية الفرنسية، ومن أهم نصوصها: حرية التنقل والملاحة في سفن مسلحة وغير مسلحة، وحق التجارة في كل أجزاء الدولة العثمانية، ودفع الرسوم مرة واحدة، وأن الضرائب التي يدفعها الفرنسيون هي نفسها التي يدفعها الرعايا الأتراك، وحق التمثيل القنصلي مع حصانة، وأن ينظر القنصل الفرنسي في قضايا رعايا ملكه المدنية والجنائية، وحرية العبادة لرعايا الملك، ومنع استعباد رعيته. وكان من نتائجها زيادة التعاون بين الأسطولين الفرنسي والعثماني وشن الأسطول العثماني هجمات قوية على شواطئ مملكة نابولي {cite:dawlat-uthmaniyya-salabi p. 203}."
  en: "The Franco-Ottoman Capitulations of 1535 — born of Francis I's captivity at Pavia and his mother's letter to Sulayman: free navigation, consular jurisdiction, freedom of worship and protection from enslavement, sealed with joint fleets against Naples {cite:dawlat-uthmaniyya-salabi p. 203}."
  fr: "Les Capitulations franco-ottomanes de 1535, nées de la captivité de François Ier à Pavie et de la lettre de sa mère à Soliman : libre navigation, juridiction consulaire, liberté de culte et protection contre la mise en esclavage, scellées par des flottes conjointes contre Naples {cite:dawlat-uthmaniyya-salabi p. 203}."
  es: "Las capitulaciones franco-otomanas de 1535 — nacidas del cautiverio de Francisco I en Pavía y de la carta de su madre a Sulayman: libre navegación, jurisdicción consular, libertad de culto y protección contra la esclavitud, selladas con flotas conjuntas contra Nápoles {cite:dawlat-uthmaniyya-salabi p. 203}."
  ur: "1535 کی فرانکو-عثمانیہ کیپٹلیشنز - پاویہ میں فرانسس اول کی اسیری اور سلیمان کے نام اس کی والدہ کے خط سے پیدا ہوا: مفت نیویگیشن، قونصلر دائرہ اختیار، عبادت کی آزادی اور غلامی سے تحفظ، نیپلز کے خلاف مشترکہ بیڑے کے ساتھ مہر بند۔ 203}۔"
  tr: "Fransa'nın Osmanlı İmparatorluğu ile müzakereleri, 1525'te Fransa Kralı I. Franz'ın esir alındığı Pavia Muharebesi'nden sonra başladı. Annesi, naip, elçisi John Frangipani'yi, kendisinden ve esir kraldan gelen birer mektupla birlikte göndererek Habsburg güçlerine saldırı ve esirin serbest bırakılmasını talep etti. 1535'te (941 Hicri) serbest bırakılmasının ardından Franz, sekreteri Jean de Laforêt'i Sultan Süleyman'a göndererek, Kapitülasyonlar Antlaşması olarak bilinen bir antlaşma ile ittifak kurmayı amaçladı. Antlaşmanın en önemli maddeleri arasında şunlar yer alıyordu: silahlı ve silahsız gemilerde serbest dolaşım ve seyrüsefer hakkı; Osmanlı İmparatorluğu genelinde ticaret yapma hakkı; tek bir geçiş ücreti ödeme; Fransızların da Türk tebaasıyla aynı vergileri ödemesi; dokunulmazlık ile konsolosluk temsili hakkı; Fransız konsolosunun tebaasının medeni ve cezai davalarına karar verme hakkı; kralın tebaası için ibadet özgürlüğü. ve tebaasının köleleştirilmesini yasakladı. Bunun sonuçlarından biri, Fransız ve Osmanlı filoları arasındaki işbirliğinin artması ve Osmanlı filosunun Napoli Krallığı kıyılarına güçlü saldırılar düzenlemesi oldu. {cite:dawlat-uthmaniyya-salabi s. 203}"
  id: "Negosiasi Prancis dengan Kekaisaran Ottoman dimulai setelah Pertempuran Pavia, di mana Raja Francis I dari Prancis ditangkap pada tahun 1525. Ibunya, sang wali raja, mengirim utusannya, John Frangipani, dengan surat darinya dan surat lain dari raja yang ditawan, meminta serangan terhadap pasukan Habsburg dan pembebasan tawanan. Setelah pembebasannya, pada tahun 1535 (941 H), Francis mengirim sekretarisnya, Jean de Laforêt, kepada Sultan Suleiman untuk membentuk aliansi dalam bentuk perjanjian yang dikenal sebagai Perjanjian Kapitulasi Prancis-Ottoman. Di antara ketentuan-ketentuan terpentingnya adalah: kebebasan bergerak dan berlayar dengan kapal bersenjata dan tidak bersenjata; hak untuk berdagang di seluruh Kekaisaran Ottoman; pembayaran bea tunggal; pajak yang sama yang dibayarkan oleh warga Prancis seperti yang dibayarkan oleh warga Turki; hak untuk perwakilan konsuler dengan kekebalan hukum; hak konsul Prancis untuk mengadili kasus perdata dan pidana warganya; kebebasan beribadah bagi warga raja; dan larangan terhadap perbudakan rakyatnya. Salah satu hasilnya adalah peningkatan kerja sama antara armada Prancis dan Ottoman, dan armada Ottoman melancarkan serangan kuat ke pantai Kerajaan Napoli {cite:dawlat-uthmaniyya-salabi p. 203}."
