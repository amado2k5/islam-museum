id: event/al-hadi-answers-a-letter-of-reproach-and-the-claim-of-ingratitude-in-verse-292
class: event
kind: other
label:
  ar: "جواب الهادي شعراً عن كتاب فيه تحامل وقول المكتوب إليه إنه لولا نعمة آل الرسول لجحد، ص311-312"
  en: "Al-Hadi's verse answer to a letter with reproach, in which the writer said that but for the favours of the Messenger's family he would have turned to denial, pp. 311-312"
  ur: "ہادی کا ایک عتاب بھرے خط کا شعری جواب جس میں لکھنے والے نے کہا تھا کہ آل رسول کی نعمتیں نہ ہوتیں تو وہ انکار کر دیتا، ص311-312"
  es: "Respuesta en verso de Al-Hadi a una carta con reproche, en la que el autor decía que, de no ser por los favores de la familia del Mensajero, habría recurrido a la negación, págs. 311-312."
  fr: "Réponse en vers d'Al-Hadi à une lettre contenant un reproche, dans laquelle l'auteur disait que sans les faveurs de la famille du Messager, il aurait renié le Prophète (pp. 311-312)."
  tr: "Al-Hadi'nin önyargı içeren bir kitaba verdiği şiirsel yanıt ve kitabı alan kişinin, Peygamber ailesinin bereketi olmasaydı bunları reddedeceğini söylemesi, s. 311-312"
  id: "Tanggapan puitis Al-Hadi terhadap sebuah buku yang berisi prasangka dan pernyataan penerima buku tersebut bahwa seandainya bukan karena berkah keluarga Nabi, ia pasti akan mengingkari mereka, hlm. 311-312"
summary:
  ar: "قصيدة من الطويل بعنوان «وله أيضاً» جواباً عن كتاب جاءه فيه تحامل: يذكر الهادي أن المكتوب إليه قال لولا نعمة وصنائع لآل رسول الله لبدّل نعماهم جحوداً، ويرد بأن هذا لا يقوله إلا غافل، وأن الحر صائن صبور، ويحثه على الثبات وتجديد الطلب وترك من يصدّق النمائم."
  en: "A poem in the tawil metre under the heading \"and also of his\", an answer to a letter that came to him with reproach: al-Hadi recalls that the writer said that but for the favours and benefactions of the Messenger's family he would have turned their favours into denial, replies that only a heedless man says so and that the free man is guarded and patient, and urges him to hold fast, renew his seeking and leave those who believe slanders."
  ur: "طویل بحر کی نظم عنوان «اور اس کا یہ بھی» کے تحت ایک ایسے خط کا جواب جو اس کے پاس عتاب کے ساتھ آیا: ہادی یاد دلاتا ہے کہ لکھنے والے نے کہا تھا کہ اگر آل رسول کی نعمتیں اور احسانات نہ ہوتے تو وہ ان کی نعمتوں کو انکار سے بدل دیتا، جواب دیتا ہے کہ یہ بات صرف غافل کہتا ہے اور آزاد آدمی محفوظ اور صابر ہوتا ہے، اور اسے ثابت قدمی، نئے سرے سے طلب اور چغلی ماننے والوں کو چھوڑنے پر ابھارتا ہے۔"
  es: "Un poema en metro tawil bajo el título \"y también suyo\", una respuesta a una carta que le llegó con reproches: al-Hadi recuerda que el escritor dijo que de no ser por los favores y las benevolencias de la familia del Mensajero, habría convertido sus favores en negación, responde que solo un hombre negligente dice eso y que el hombre libre es precavido y paciente, y lo exhorta a mantenerse firme, a renovar su búsqueda y a dejar de lado a aquellos que creen en las calumnias."
  fr: "Un poème en mètre tawil, sous le titre « et aussi de lui », en réponse à une lettre qui lui parvint avec reproche: al-Hadi rappelle que l'auteur disait que sans les faveurs et les bienfaits de la famille du Messager, il aurait transformé leurs faveurs en reniement; il répond que seul un homme insouciant dit cela et que l'homme libre est prudent et patient, et l'exhorte à persévérer, à renouveler sa recherche et à laisser tomber ceux qui croient aux calomnies."
  tr: "Uzun vezinle yazılmış, \"Ona da\" başlıklı şiiri, kendisine gelen ve önyargı içeren bir mektuba cevaben kaleme alınmıştır: El-Hadi, mektubun muhatabının, \"Eğer Allah Resulü'nün ailesinin bereket ve lütufları olmasaydı, o, bereketlerini nankörlükle değiştirirdi\" dediğini aktarır. El-Hadi ise, bunun ancak gafletin bir sözü olduğunu, özgür bir insanın koruyucu ve sabırlı olduğunu belirterek, ona sebat etmesini, isteğini yinelemesini ve inananları dedikodudan uzak tutmasını öğütler."
  id: "Sebuah puisi berirama panjang berjudul “Dan Kepadanya Juga” sebagai tanggapan atas surat yang sampai kepadanya yang berisi prasangka: Al-Hadi menyebutkan bahwa orang yang dituju surat itu berkata, “Seandainya bukan karena nikmat dan karunia keluarga Rasulullah, dia pasti akan menukar nikmat mereka dengan rasa tidak tahu terima kasih.” Ia menjawab bahwa hanya orang yang lalai yang akan mengatakan demikian, dan bahwa orang merdeka adalah pelindung dan sabar, dan ia mendesaknya untuk teguh, memperbarui permintaan tersebut, dan meninggalkan orang-orang yang beriman untuk bergosip."
