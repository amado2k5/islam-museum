label: { ar: "تأسيس مدينة السلام بغداد", en: "The Founding of Madinat al-Salam (Baghdad)" }
summary:
  ar: "عند البلاذري: كانت بغداد قديمة فمصرها أمير المؤمنين المنصور وابتنى بها مدينة وابتدأها في سنة 145 فلما بلغه خروج محمد وإبراهيم ابني عبد الله بن حسن عاد إلى الكوفة ثم حول بيوت الأموال والخزائن والدواوين من الكوفة إلى بغداد سنة 146 وسماها مدينة السلام واستتم بناء حائط مدينته وجميع أمره وبناء سور بغداد القديم سنة 147 وابتاع أرض مدينة السلام من قوم من أرباب القرى ببادورايا وقطربل ونهر بوق ونهر بين واقطعها أهل بيته وقواده وجنده وصحابته وكتابه وجعل مجمع الأسواق بالكرخ وأمر التجار فابتنوا الحوانيت وألزمهم الغلة وبنى مسجدي مدينة السلام وبنى القنطرة الجديدة على الصراة وبنى للمهدي الرصافة في الجانب الشرقي وكان يدعى عسكر المهدي لأنه عسكر فيه حين خرج إلى الري فلما قدم منها نزل الرصافة سنة 151 وقد كان أمر ببناء قصر الوضاح قبله وقصر المهدي بالشرقية مما يلي باب الكرخ والوضاح رجل من أهل الأنبار تولى النفقة عليه فنسب إليه، وعند السيوطي في سنة أربعين شرع في بناء مدينة بغداد وفي سنة تسع وأربعين فرغ من بنائها {cite:tarikh-khulafa-minhaj-1434 p. 424-425}"
  en: "In al-Baladhuri: Baghdad was ancient, and al-Mansur garrisoned it, beginning his city in year 145; when news of Muhammad and Ibrahim ibn Abdallah's rising reached him he returned to Kufa, then moved the treasury houses, coffers and diwans from Kufa to Baghdad in 146, naming it Madinat al-Salam; he finished the city wall and all its works, and the old Baghdad wall, in 147. He bought the city's ground from village-owners of Baduraya, Qatrabull, Nahr Buq and Nahr Bin, granted it in iqta' to his family, commanders, troops, companions and secretaries, made the markets' gathering at al-Karkh and ordered the merchants to build shops, obliging them their rents; he built Madinat al-Salam's two mosques and the new pontoon on al-Sarat, and built al-Rusafa for al-Mahdi on the east side — called Askar al-Mahdi from his camping there bound for Rayy — occupied on return in 151; earlier he had ordered Qasr al-Waddah built, named for an Anbar man who financed it, and Qasr al-Mahdi by Bab al-Karkh."
