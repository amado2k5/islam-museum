label: { ar: "تأسيس مدينة السلام بغداد", en: "The Founding of Madinat al-Salam (Baghdad)", es: "La fundación de Madinat al-Salam (Bagdad)", fr: "La fondation de Madinat al-Salam (Bagdad)" }
summary:
  ar: "عند البلاذري: كانت بغداد قديمة فمصرها أمير المؤمنين المنصور وابتنى بها مدينة وابتدأها في سنة 145 فلما بلغه خروج محمد وإبراهيم ابني عبد الله بن حسن عاد إلى الكوفة ثم حول بيوت الأموال والخزائن والدواوين من الكوفة إلى بغداد سنة 146 وسماها مدينة السلام واستتم بناء حائط مدينته وجميع أمره وبناء سور بغداد القديم سنة 147 وابتاع أرض مدينة السلام من قوم من أرباب القرى ببادورايا وقطربل ونهر بوق ونهر بين واقطعها أهل بيته وقواده وجنده وصحابته وكتابه وجعل مجمع الأسواق بالكرخ وأمر التجار فابتنوا الحوانيت وألزمهم الغلة وبنى مسجدي مدينة السلام وبنى القنطرة الجديدة على الصراة وبنى للمهدي الرصافة في الجانب الشرقي وكان يدعى عسكر المهدي لأنه عسكر فيه حين خرج إلى الري فلما قدم منها نزل الرصافة سنة 151 وقد كان أمر ببناء قصر الوضاح قبله وقصر المهدي بالشرقية مما يلي باب الكرخ والوضاح رجل من أهل الأنبار تولى النفقة عليه فنسب إليه، وعند السيوطي في سنة أربعين شرع في بناء مدينة بغداد وفي سنة تسع وأربعين فرغ من بنائها {cite:tarikh-khulafa-minhaj-1434 p. 424-425}"
  en: "In al-Baladhuri: Baghdad was ancient, and al-Mansur garrisoned it, beginning his city in year 145; when news of Muhammad and Ibrahim ibn Abdallah's rising reached him he returned to Kufa, then moved the treasury houses, coffers and diwans from Kufa to Baghdad in 146, naming it Madinat al-Salam; he finished the city wall and all its works, and the old Baghdad wall, in 147. He bought the city's ground from village-owners of Baduraya, Qatrabull, Nahr Buq and Nahr Bin, granted it in iqta' to his family, commanders, troops, companions and secretaries, made the markets' gathering at al-Karkh and ordered the merchants to build shops, obliging them their rents; he built Madinat al-Salam's two mosques and the new pontoon on al-Sarat, and built al-Rusafa for al-Mahdi on the east side — called Askar al-Mahdi from his camping there bound for Rayy — occupied on return in 151; earlier he had ordered Qasr al-Waddah built, named for an Anbar man who financed it, and Qasr al-Mahdi by Bab al-Karkh."
  es: "En al-Baladhuri: Bagdad era antigua, y al-Mansur la guarneció, comenzando su ciudad en el año 145; cuando le llegaron noticias del levantamiento de Muhammad e Ibrahim ibn Abdallah, regresó a Kufa, luego trasladó las casas del tesoro, los cofres y los diwanes de Kufa a Bagdad en 146, nombrándola Madinat al-Salam; terminó la muralla de la ciudad y todas sus obras, y la antigua muralla de Bagdad, en 147. Compró el terreno de la ciudad a los propietarios de las aldeas de Baduraya, Qatrabull, Nahr Buq y Nahr Bin, lo otorgó en iqta' a su familia, comandantes, tropas, compañeros y secretarios, hizo que los mercados se reunieran en al-Karkh y ordenó a los comerciantes que construyeran tiendas, obligándolos a pagar sus rentas; Construyó las dos mezquitas de Madinat al-Salam y el nuevo pontón en al-Sarat, y construyó al-Rusafa para al-Mahdi en el lado este —llamado Askar al-Mahdi por su campamento allí de camino a Rayy—, que ocupó a su regreso en 151; anteriormente había ordenado la construcción de Qasr al-Waddah, que recibió su nombre de un hombre de Anbar que la financió, y Qasr al-Mahdi por Bab al-Karkh."
  fr: "Dans al-Baladhuri: Bagdad était une ville ancienne, et al-Mansur y avait établi une garnison, commençant la construction de sa ville en l'an 145; lorsque la nouvelle du soulèvement de Muhammad et d'Ibrahim ibn Abdallah lui parvint, il retourna à Kufa, puis transféra les trésors, les coffres et les diwans de Kufa à Bagdad en 146, la nommant Madinat al-Salam; il acheva la muraille de la ville et tous ses ouvrages, ainsi que l'ancienne muraille de Bagdad, en 147. Il acheta le terrain de la ville aux propriétaires des villages de Baduraya, Qatrabull, Nahr Buq et Nahr Bin, le concéda en iqta' à sa famille, ses commandants, ses troupes, ses compagnons et ses secrétaires, fit rassembler les marchés à al-Karkh et ordonna aux marchands de construire des boutiques, les obligeant à payer leurs loyers; Il fit construire les deux mosquées de Madinat al-Salam et le nouveau ponton sur al-Sarat, et fit construire al-Rusafa pour al-Mahdi du côté est — appelé Askar al-Mahdi d'après son campement là-bas en route pour Rayy — occupé à son retour en 151; auparavant, il avait ordonné la construction de Qasr al-Waddah, nommé d'après un homme d'Anbar qui l'avait financé, et de Qasr al-Mahdi par Bab al-Karkh."
