id: event/killing-of-muflih-in-the-zanj-war
class: event
kind: death
label: { ar: "مقتل مفلح في حرب الزنج", en: "The killing of Muflih in the Zanj war" }
summary:
  ar: "في سنة ثمان وخمسين ومائتين قُتل مفلح، ولم يجد الناس أحداً يدّعي رميه بالسهم، فادّعى صاحب الزنج أنه الرامي {cite:tabari-tarikh-abu-al-fadl j.9 p.495}، وعند المسعودي أشخصه المعتمد مع أبي أحمد الموفق إلى البصرة لمحاربة صاحب الزنج مستهل ربيع الأول سنة ثمان وخمسين فأوقع مفلح بصاحب الزنج يوم الثلاثاء لاثنتي عشرة ليلة بقيت من جمادى الأولى فأصابه سهم في صدغه فأصبح ميتاً وحمل إلى سامرا فدفن بها {cite:muruj-al-dhahab p. 571}"
  en: "In the year 258 Muflih was killed. No one could be found to claim having shot him with the arrow, so the leader of the Zanj claimed to be the archer {cite:tabari-tarikh-abu-al-fadl j.9 p.495}. According to al-Mas'udi, al-Mu'tamid sent him with Abu Ahmad al-Muwaffaq to Basra to fight the leader of the Zanj at the beginning of Rabi' al-Awwal of the year 258. Muflih attacked the leader of the Zanj on Tuesday, twelve nights before the end of Jumada al-Ula; an arrow struck him in the temple, and in the morning he was dead. He was carried to Samarra and buried there {cite:muruj-al-dhahab p. 571}."
