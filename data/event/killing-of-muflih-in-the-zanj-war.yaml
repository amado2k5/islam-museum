label: { ar: "مقتل مفلح في حرب الزنج" }
summary:
  ar: "في سنة ثمان وخمسين ومائتين قُتل مفلح، ولم يجد الناس أحداً يدّعي رميه بالسهم، فادّعى صاحب الزنج أنه الرامي {cite:tabari-tarikh-abu-al-fadl j.9 p.495}، وعند المسعودي أشخصه المعتمد مع أبي أحمد الموفق إلى البصرة لمحاربة صاحب الزنج مستهل ربيع الأول سنة ثمان وخمسين فأوقع مفلح بصاحب الزنج يوم الثلاثاء لاثنتي عشرة ليلة بقيت من جمادى الأولى فأصابه سهم في صدغه فأصبح ميتاً وحمل إلى سامرا فدفن بها {cite:muruj-al-dhahab p. 571}"
