label: { ar: "محمد الثاني يعدّ حصار القسطنطينية من أدرنة", en: "Mehmed II prepares the Constantinople siege from Edirne", ur: "محمد ثانی کا ادرنہ سے محاصرہ قسطنطنیہ کی تیاری" }
summary:
  ar: "عاد محمد الثاني إلى أدرنة حين قرر حصار القسطنطينية، فوُضعت خطط الحصار فيها واختُبرت المدافع العظيمة في نواحيها، ومهّد الطريق بين أدرنة والقسطنطينية لجرّ المدافع العملاقة التي تحركت من أدرنة إلى قرب القسطنطينية في مدة شهرين {cite:encyclopaedia-of-islam-2 vol. 2 p. 711} {cite:dawlat-uthmaniyya-salabi p. 93}."
  en: "Mehmed II returned to Edirne when he decided to besiege Constantinople; the siege plans were worked out in the city and the great guns tested in its environs, while the road between Edirne and Constantinople was levelled so the giant cannon could be hauled — they moved from Edirne to the vicinity of Constantinople in two months {cite:encyclopaedia-of-islam-2 vol. 2 p. 711} {cite:dawlat-uthmaniyya-salabi p. 93}."
  ur: "محمد ثانی جب قسطنطنیہ کے محاصرے کا فیصلہ کر چکا تو ادرنہ لوٹا؛ محاصرے کی تدبیریں اسی شہر میں طے کیں گئیں اور عظیم توپوں کا آزمایش اس کے نواح میں ہوا، جبکہ ادرنہ سے قسطنطنیہ کی سڑک توپوں کے گھسیٹنے کے لیے ہموار کی گئی — توپیں ادرنہ سے قسطنطنیہ کے قریب دو مہینے میں پہنچیں {cite:encyclopaedia-of-islam-2 vol. 2 p. 711} {cite:dawlat-uthmaniyya-salabi p. 93}۔"
