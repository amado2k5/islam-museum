label:
  ar: وقعة القارغلية بالسلطان سنجر
  en: Sanjar's catastrophe against the Qara-Khitai
summary:
  ar: "وقعة السلطان سنجر مع القارغلية أول صفر سنة 536هـ؛ لما ملك كوخان ملك الخطا ما وراء النهر وشكا إليه محمود خان بن أرسلان خان من القارغلية واستنجد بالسلطان سنجر، سار سنجر وعبر النهر في ذي الحجة سنة 535هـ وكتب إلى ملكهم يدعوه إلى الإسلام ويتهدده، فلقيه القارغلية أول صفر سنة 536هـ فانهزم سنجر والمسلمون واستمر القتل فيهم، وأسر صاحب سجستان والأمير قماج وزوجة السلطان ابنة أرسلان خان، وقال ابن خلدون: لم يكن في الإسلام وقعة أعظم من هذه ولا أفحش قتلاً، واستقرت الدولة فيما وراء النهر للخطا والترك وهم يومئذ على دين الكفر، وانقرضت دولة الخانية المسلمين."
  en: "Sultan Sanjar's battle with the Qara-Khitai in early Safar 536 AH; when Kukhan the Khitan king took Transoxiana and Mahmud Khan ibn Arslan Khan complained of the Qarghaliyya and begged Sanjar's aid, Sanjar crossed the river in Dhu al-Hijja 535 and wrote their king summoning him to Islam with threats — they met him in Safar 536 and routed Sanjar and the Muslims in unbroken slaughter, capturing the lord of Sistan, the amir Qumaj and the sultan's wife Arslan Khan's daughter; Ibn Khaldun judged no battle in Islam greater nor more monstrous in killing — Transoxiana passed to the still-pagan Khita and Turks, and the Muslim Khanid state was extinguished."
