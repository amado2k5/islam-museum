class: event
kind: battle
label:
  ar: وقعة القارغلية بالسلطان سنجر
  en: Sanjar's catastrophe against the Qara-Khitai
  es: "La catástrofe de Sanjar contra los Qara-Khitai"
  fr: "La catastrophe de Sanjar contre les Qara-Khitai"
  ur: "قرہ خطائی کے خلاف سنجار کی تباہی"
summary:
  ar: "وقعة السلطان سنجر مع القارغلية أول صفر سنة 536هـ؛ لما ملك كوخان ملك الخطا ما وراء النهر وشكا إليه محمود خان بن أرسلان خان من القارغلية واستنجد بالسلطان سنجر، سار سنجر وعبر النهر في ذي الحجة سنة 535هـ وكتب إلى ملكهم يدعوه إلى الإسلام ويتهدده، فلقيه القارغلية أول صفر سنة 536هـ فانهزم سنجر والمسلمون واستمر القتل فيهم، وأسر صاحب سجستان والأمير قماج وزوجة السلطان ابنة أرسلان خان، وقال ابن خلدون: لم يكن في الإسلام وقعة أعظم من هذه ولا أفحش قتلاً، واستقرت الدولة فيما وراء النهر للخطا والترك وهم يومئذ على دين الكفر، وانقرضت دولة الخانية المسلمين."
  en: "Sultan Sanjar's battle with the Qara-Khitai in early Safar 536 AH; when Kukhan the Khitan king took Transoxiana and Mahmud Khan ibn Arslan Khan complained of the Qarghaliyya and begged Sanjar's aid, Sanjar crossed the river in Dhu al-Hijja 535 and wrote their king summoning him to Islam with threats — they met him in Safar 536 and routed Sanjar and the Muslims in unbroken slaughter, capturing the lord of Sistan, the amir Qumaj and the sultan's wife Arslan Khan's daughter; Ibn Khaldun judged no battle in Islam greater nor more monstrous in killing — Transoxiana passed to the still-pagan Khita and Turks, and the Muslim Khanid state was extinguished."
  es: "La batalla del sultán Sanjar contra los Qara-Khitai a principios de Safar 536 AH; cuando Kukhan, el rey kitán, tomó Transoxiana y Mahmud Khan ibn Arslan Khan se quejó de los Qarghaliyya y suplicó la ayuda de Sanjar, este cruzó el río en Dhu al-Hijja 535 y escribió a su rey convocándolo al Islam con amenazas; se enfrentaron a él en Safar 536 y derrotaron a Sanjar y a los musulmanes en una matanza ininterrumpida, capturando al señor de Sistán, al emir Qumaj y a la hija de la esposa del sultán, Arslan Khan; Ibn Khaldun consideró que ninguna batalla en el Islam fue más grande ni más monstruosa en cuanto a matanzas; Transoxiana pasó a manos de los todavía paganos kitán y los turcos, y el estado khaní musulmán se extinguió."
  fr: "La bataille du sultan Sanjar contre les Qara-Khitai au début du Safar 536 AH; lorsque Kukhan, le roi khitan, s’empara de la Transoxiane et que Mahmud Khan ibn Arslan Khan se plaignit des Qarghaliyya et implora l’aide de Sanjar, ce dernier traversa le fleuve en Dhu al-Hijja 535 et écrivit à leur roi pour l’appeler à l’islam en le menaçant; ils le rencontrèrent en Safar 536 et mirent en déroute Sanjar et les musulmans dans un massacre ininterrompu, capturant le seigneur du Sistan, l’émir Qumaj et la fille de l’épouse du sultan, Arslan Khan; Ibn Khaldun ne considéra aucune bataille en Islam comme plus grande ni plus monstrueuse en termes de carnage; la Transoxiane passa aux mains des Khita et des Turcs, encore païens, et l’État musulman khanide fut anéanti."
  ur: "صفر 536 ہجری کے اوائل میں سلطان سنجر کی قرہ خطائی سے جنگ؛ جب خیتان بادشاہ کوخان نے ٹرانسوکسیانہ لیا اور محمود خان ابن ارسلان خان نے قرغالیہ کی شکایت کی اور سنجر کی مدد کی بھیک مانگی تو سنجر نے 535 ذی الحجہ میں دریا عبور کیا اور اپنے بادشاہ کو دھمکیوں کے ساتھ اسلام کی طرف بلانے کے لیے لکھا - وہ صفر 536 میں اس سے ملے اور مسلمانوں کو سنجر کے راستے سے ہٹا دیا۔ سیستان کا آقا، امیر قوم اور سلطان کی بیوی ارسلان خان کی بیٹی؛ ابن خلدون نے اسلام میں کسی بھی جنگ کو قتل کرنے میں اس سے بڑا یا اس سے زیادہ خوفناک فیصلہ نہیں کیا - ٹرانسوکسیانا اب بھی کافر خیتا اور ترکوں تک پہنچا، اور مسلم خانید ریاست ختم ہوگئی۔"
