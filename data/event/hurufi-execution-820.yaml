summary:
  ar: "في سنة عشرين وثمانمائة قتل الشيخ نسيم الدين التبريزي نزيل حلب وهو شيخ الحروفية كحلب وقد كثر أتباعه ونشأت بدعته وشاعت فآل أمره إلى أن أمر السلطان بقتله فضربت عنقه وسلخ جلده وصلب {cite:shadharat-dhahab p. 153}."
  en: "820 — Nasim al-Din al-Tabrizi, head of Aleppo's Hurufis whose following had grown and whose doctrine had spread, was executed on the sultan's order: beheaded, flayed and crucified {cite:shadharat-dhahab p. 153}."
  es: "820 — Nasim al-Din al-Tabrizi, jefe de los hurufíes de Alepo, cuyo número de seguidores había aumentado y cuya doctrina se había extendido, fue ejecutado por orden del sultán: decapitado, desollado y crucificado {cite:shadharat-dhahab p. 153}."
  fr: "820 — Nasim al-Din al-Tabrizi, chef des Hurufis d'Alep dont le nombre de disciples avait augmenté et dont la doctrine s'était répandue, fut exécuté sur ordre du sultan: décapité, écorché et crucifié {cite: shadharat-dhahab p. 153}."
  ur: "820 - حلب کے حورفیوں کے سربراہ نسیم الدین التبریزی جن کے پیروکار بڑھے اور جن کا عقیدہ پھیل چکا تھا، سلطان کے حکم پر پھانسی دی گئی: سر قلم کیا گیا، پھاڑ دیا گیا اور مصلوب کیا گیا۔ 153}۔"
