label: { ar: "وفاة عبد الملك بن مروان", en: "The Death of Abd al-Malik ibn Marwan", es: "La muerte de Abd al-Malik ibn Marwan", fr: "La mort d'Abd al-Malik ibn Marwan", ur: "عبد الملک بن مروان کی وفات", tr: "Abdülmalik ibn Mervan'ın Ölümü", id: "Kematian Abd al-Malik ibn Marwan" }
summary:
  ar: "ذكر الطبري وفاة عبد الملك بن مروان في النصف من شوال سنة ست وثمانين {cite:tabari-tarikh-abu-al-fadl j.6 p.418}، وأورد أقوالا مختلفة في مدة خلافته {cite:tabari-tarikh-abu-al-fadl j.6 p.418}، وفي مبلغ سنه يوم توفي {cite:tabari-tarikh-abu-al-fadl j.6 p.419}. وعند السيوطي مات في شوال سنة ست وثمانين وخلف سبعة عشر ولداً، وكان في تلك السنة طاعون الفتيات وسمي بذلك لأنه بدأ في النساء، ويذكر أنه أفضى إليه الأمر والمصحف في حجره فأطبقه وقال هذا آخر العهد بك {cite:tarikh-khulafa-minhaj-1434 p. 355, 358}. ويذكر الكتاب أنه مات بدمشق سنة 86هـ، وأن ابنه الوليد صلى عليه، وأن عمره يوم وفاته ستون سنة في الرواية الأشهر، وأنه كان يقول إنه يخشى أن يموت في رمضان فمات في شوال. {cite:salabi-umayyad-state-2020 p.128}"
  en: "Al-Tabari records the death of Abd al-Malik ibn Marwan in the middle of Shawwal in the year 86 {cite:tabari-tarikh-abu-al-fadl j.6 p.418}, and gives differing accounts of the length of his caliphate {cite:tabari-tarikh-abu-al-fadl j.6 p.418} and of his age on the day he died {cite:tabari-tarikh-abu-al-fadl j.6 p.419}. According to al-Suyuti he died in Shawwal of the year 86, leaving seventeen sons; that year saw the plague of the girls, so called because it began among women. It is said that power came to him while the copy of the Mushaf lay in his lap, and that he closed it and said, 'This is the last of my time with you' {cite:tarikh-khulafa-minhaj-1434 p. 355, 358}. The book mentions that he died in Damascus in 86 AH, that his son al-Walid led the funeral prayer over him, that his age at death was sixty years in the most widely known report, and that he used to say he feared he would die in Ramadan, and he died in Shawwal {cite:salabi-umayyad-state-2020 p.128}"
  es: "Al-Tabari registra la muerte de Abd al-Malik ibn Marwan a mediados de Shawwal del año 86 {cite:tabari-tarikh-abu-al-fadl j.6 p.418}, y da relatos diferentes sobre la duración de su califato {cite:tabari-tarikh-abu-al-fadl j.6 p.418} y sobre su edad el día de su muerte {cite:tabari-tarikh-abu-al-fadl j.6 p.419}. Según al-Suyuti, murió en Shawwal del año 86, dejando diecisiete hijos; ese año se produjo la plaga de las niñas, llamada así porque comenzó entre las mujeres. Se dice que el poder le llegó mientras la copia del Mushaf yacía en su regazo, y que la cerró y dijo: 'Este es el último de mi tiempo contigo' {cite:tarikh-khulafa-minhaj-1434 p. 355, 358}. El libro menciona que murió en Damasco en el año 86 de la Hégira, que su hijo al-Walid dirigió la oración fúnebre por él, que su edad al morir era de sesenta años según el informe más conocido, y que solía decir que temía morir en Ramadán, y murió en Shawwal {cite:salabi-umayyad-state-2020 p.128}"
  fr: "Al-Tabari rapporte la mort d'Abd al-Malik ibn Marwan au milieu du mois de Shawwal de l'an 86 {cite:tabari-tarikh-abu-al-fadl j.6 p.418} et donne des versions différentes quant à la durée de son califat {cite:tabari-tarikh-abu-al-fadl j.6 p.418} et à son âge au moment de son décès {cite:tabari-tarikh-abu-al-fadl j.6 p.419}. Selon al-Suyuti, il mourut en Shawwal de l'an 86, laissant dix-sept fils; cette année-là fut marquée par la peste des filles, ainsi nommée car elle commença parmi les femmes. On raconte que le pouvoir lui revint alors qu'il tenait un exemplaire du Mushaf sur ses genoux, et qu'il le referma en disant: « C'est la fin du temps que je passe avec vous » {cite:tarikh-khulafa-minhaj-1434 p. 355, 358}. L'ouvrage mentionne qu'il mourut à Damas en 86 AH, que son fils al-Walid dirigea la prière funéraire, que son âge au moment de sa mort était de soixante ans selon la version la plus répandue, et qu'il disait craindre de mourir pendant le Ramadan. Il mourut en Shawwal {cite:salabi-umayyad-state-2020 p.128}"
  ur: "الطبری نے عبد الملک بن مروان کی وفات شوال کے وسط میں سن 86 میں درج کی ہے {حوالہ:طبری-تاریخ-ابو الفضل ج 6 ص 418}، اور اس کی خلافت کی طوالت کے بارے میں مختلف بیانات پیش کیے ہیں {حوالہ:طبری-تاریخ-ابو الفضل ص 418 اور اس کی عمر 4 دن۔ متوفی {حوالہ: طبری-تاریخ-ابو الفضل ج6 ص419}۔ سیوطی کے مطابق ان کا انتقال شوال 86 میں ہوا، سترہ بیٹے چھوڑے؛ اس سال لڑکیوں کے طاعون کو دیکھا، اس لیے کہا جاتا ہے کہ یہ عورتوں میں شروع ہوا۔ کہا جاتا ہے کہ مصحف کی نقل اس کی گود میں پڑی ہوئی تھی اور اس کے پاس طاقت آئی اور اس نے اسے بند کر دیا اور کہا کہ یہ میرا آپ کے ساتھ آخری وقت ہے۔ 355، 358}۔ کتاب میں بتایا گیا ہے کہ ان کی وفات 86 ہجری میں دمشق میں ہوئی، ان کے بیٹے الولید نے ان پر نماز جنازہ پڑھائی، جو مشہور روایت میں ہے کہ وفات کے وقت ان کی عمر ساٹھ سال تھی، اور وہ کہتے تھے کہ انہیں خدشہ ہے کہ ان کی موت رمضان المبارک میں ہو جائے گی، اور شوال میں وفات پائی۔"
  tr: "Taberi, Abdülmalik ibn Mervan'ın Hicri 86 yılının Şevval ayının ortasında (1486 Miladi) vefat ettiğini belirtir ve halifeliğinin süresi (1486 Miladi) ve ölüm anındaki yaşı (1486 Miladi) hakkında farklı rivayetler aktarır. Suyuti'ye göre, Hicri 86 yılının Şevval ayında (1486 Miladi) vefat etmiş ve geride on yedi çocuk bırakmıştır. O yıl, kadınlar arasında başladığı için \"genç kızlarda görülen bir veba\" olarak adlandırılan bir salgın yaşanmıştır. Ayrıca, halifeliğin kendisine Kur'an kucağında iken verildiği, bunun üzerine Kur'an'ı kapatıp \"Sizi son görüşüm bu olacak\" dediği de belirtilir (1434 Miladi, s. 355-358). Kitapta, onun Hicri 86 yılında Şam'da öldüğü, cenaze namazını oğlu El-Velid'in kıldırdığı, en yaygın kabul gören rivayete göre öldüğünde altmış yaşında olduğu ve Ramazan ayında ölmekten korktuğunu söylediği, ancak Şevval ayında öldüğü belirtilmektedir. {cite:salabi-umayyad-state-2020 s.128}"
  id: "Al-Tabari menyebutkan wafatnya Abd al-Malik ibn Marwan pada pertengahan bulan Syawal tahun 86 H (1486 M), dan ia menyertakan berbagai catatan mengenai lamanya masa kekhalifahannya (1486 M) dan usianya pada saat wafatnya (1486 M). Menurut al-Suyuti, ia wafat pada bulan Syawal tahun 86 H (1486 M) dan meninggalkan tujuh belas anak. Tahun itu terjadi wabah penyakit yang menyerang anak perempuan, yang dinamakan demikian karena dimulai di kalangan perempuan. Disebutkan juga bahwa kekhalifahan diserahkan kepadanya ketika Al-Quran berada di pangkuannya, lalu ia menutupnya dan berkata, \"Ini adalah terakhir kalinya aku akan melihatmu\" (1434 M, hlm. 355-358). Buku tersebut menyatakan bahwa beliau wafat di Damaskus pada tahun 86 Hijriah, bahwa putranya Al-Walid memimpin salat jenazah, bahwa beliau berusia enam puluh tahun pada saat wafat menurut riwayat yang paling diterima secara luas, dan bahwa beliau biasa mengatakan bahwa beliau takut meninggal di bulan Ramadan, tetapi beliau meninggal di bulan Syawal. {cite:salabi-umayyad-state-2020 p.128}"
