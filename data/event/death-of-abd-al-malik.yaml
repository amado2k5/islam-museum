label: { ar: "وفاة عبد الملك بن مروان", en: "The Death of Abd al-Malik ibn Marwan" }
summary:
  ar: "ذكر الطبري وفاة عبد الملك بن مروان في النصف من شوال سنة ست وثمانين {cite:tabari-tarikh-abu-al-fadl j.6 p.418}، وأورد أقوالا مختلفة في مدة خلافته {cite:tabari-tarikh-abu-al-fadl j.6 p.418}، وفي مبلغ سنه يوم توفي {cite:tabari-tarikh-abu-al-fadl j.6 p.419}. وعند السيوطي مات في شوال سنة ست وثمانين وخلف سبعة عشر ولداً، وكان في تلك السنة طاعون الفتيات وسمي بذلك لأنه بدأ في النساء، ويذكر أنه أفضى إليه الأمر والمصحف في حجره فأطبقه وقال هذا آخر العهد بك {cite:tarikh-khulafa-minhaj-1434 p. 355, 358}. ويذكر الكتاب أنه مات بدمشق سنة 86هـ، وأن ابنه الوليد صلى عليه، وأن عمره يوم وفاته ستون سنة في الرواية الأشهر، وأنه كان يقول إنه يخشى أن يموت في رمضان فمات في شوال. {cite:salabi-umayyad-state-2020 p.128}"
  en: "Al-Tabari records the death of Abd al-Malik ibn Marwan in the middle of Shawwal in the year 86 {cite:tabari-tarikh-abu-al-fadl j.6 p.418}, and gives differing accounts of the length of his caliphate {cite:tabari-tarikh-abu-al-fadl j.6 p.418} and of his age on the day he died {cite:tabari-tarikh-abu-al-fadl j.6 p.419}. According to al-Suyuti he died in Shawwal of the year 86, leaving seventeen sons; that year saw the plague of the girls, so called because it began among women. It is said that power came to him while the copy of the Mushaf lay in his lap, and that he closed it and said, 'This is the last of my time with you' {cite:tarikh-khulafa-minhaj-1434 p. 355, 358}. The book mentions that he died in Damascus in 86 AH, that his son al-Walid led the funeral prayer over him, that his age at death was sixty years in the most widely known report, and that he used to say he feared he would die in Ramadan, and he died in Shawwal {cite:salabi-umayyad-state-2020 p.128}"
