label: { ar: "وفاة عبد الملك بن مروان" }
summary:
  ar: "ذكر الطبري وفاة عبد الملك بن مروان في النصف من شوال سنة ست وثمانين {cite:tabari-tarikh-abu-al-fadl j.6 p.418}، وأورد أقوالا مختلفة في مدة خلافته {cite:tabari-tarikh-abu-al-fadl j.6 p.418}، وفي مبلغ سنه يوم توفي {cite:tabari-tarikh-abu-al-fadl j.6 p.419}. وعند السيوطي مات في شوال سنة ست وثمانين وخلف سبعة عشر ولداً، وكان في تلك السنة طاعون الفتيات وسمي بذلك لأنه بدأ في النساء، ويذكر أنه أفضى إليه الأمر والمصحف في حجره فأطبقه وقال هذا آخر العهد بك {cite:tarikh-khulafa-minhaj-1434 p. 355, 358}. ويذكر الكتاب أنه مات بدمشق سنة 86هـ، وأن ابنه الوليد صلى عليه، وأن عمره يوم وفاته ستون سنة في الرواية الأشهر، وأنه كان يقول إنه يخشى أن يموت في رمضان فمات في شوال. {cite:salabi-umayyad-state-2020 p.128}"
