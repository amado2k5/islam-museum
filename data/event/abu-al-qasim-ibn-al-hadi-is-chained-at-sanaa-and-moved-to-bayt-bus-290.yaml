id: event/abu-al-qasim-ibn-al-hadi-is-chained-at-sanaa-and-moved-to-bayt-bus-290
class: event
kind: other
label:
  ar: "قيد أبي القاسم ابن الهادي بصنعاء ورسالته إلى أبيه ثم نقله إلى بيت بوس، من رجب إلى شوال 290هـ"
  en: "Abu al-Qasim, al-Hadi's son, is chained at Sana'a, a letter to his father is held back and he is moved to Bayt Bus, Rajab to Shawwal 290 AH"
  ur: "ہادی کے بیٹے ابو القاسم کو صنعاء میں بیڑیاں، والد کو خط کا روکا جانا اور بیت بوس منتقل ہونا، رجب سے شوال 290ھ"
summary:
  ar: "رجع الراوي إلى أبي القاسم ابن الهادي فذكر أنهم أدخلوه الدار وقيدوه بقيد ثقيل وحبسوا أصحابه، ثم جاءوا بـمحمد بن سعيد الذي أُسر معه فصاروا معاً، ثم ورمت رجله فحلوا قيده أياماً، وطلب ابن خلف أن يكتب إلى أبيه فكتب فحبس بعض جلسائه الكتاب، وفرّ عيسى بن معان اليافعي من حبسه فحوّلوه إلى دار أخرى، فأقام بصنعاء رجباً وشعبان ورمضان وعشراً من شوال ثم أُركب عمارية ليلاً إلى بيت بوس."
  en: "The narrator turns back to Abu al-Qasim, al-Hadi's son: they brought him into the house, put him in a heavy fetter and jailed his companions, then brought Muhammad ibn Sa'id, who had been taken with him, and the two were together; his leg swelled and the fetter was loosened for some days, Ibn Khalaf asked him to write to his father and he did, but one of his companions held the letter back; Isa ibn Ma'an al-Yafi'i got out of his prison, so they moved the two to another house, and they stayed at Sana'a through Rajab, Sha'ban, Ramadan and ten days of Shawwal, then were put in a litter by night and taken to Bayt Bus."
  ur: "راوی ہادی کے بیٹے ابو القاسم کی طرف لوٹتا ہے: وہ انہیں گھر میں لائے، بھاری بیڑی ڈالی اور ان کے ساتھیوں کو قید کیا، پھر محمد بن سعید کو لائے جو ان کے ساتھ پکڑے گئے تھے اور وہ دونوں اکٹھے رہے؛ ان کی ٹانگ سوجی تو کچھ دن بیڑی کھول دی گئی، ابن خلف نے کہا کہ وہ والد کو خط لکھیں اور انہوں نے لکھا مگر ایک ہم نشیں نے خط روک لیا؛ عیسیٰ بن معان یافعی اپنی قید سے نکل گیا تو دونوں کو دوسرے گھر منتقل کیا، اور وہ رجب، شعبان، رمضان اور شوال کے دس دن صنعاء میں رہے، پھر رات کو عماری میں بیت بوس لے جائے گئے۔"
