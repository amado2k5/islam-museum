summary:
  ar: "مناظرات علنية كبرى بين المؤرخ والداعية السني [[person/adnan-rashid|عدنان رشيد]] والدفاعي المسيحي [[person/jay-smith|جاي سميث]] في ركن الخطباء والأوساط الجامعية بين 2014 و2015، في موضوعات كـ«هل القرآن كلمة الله؟» و«من هو عيسى حقاً؟»، فدار الجدل حول صحة التاريخ والنقل النبوي والإنجيلي بأسلوب خطابي مفتوح. وتظل مقاطعها وتفريغاتها متداولة {cite:answering-islam-debates-index}."
  en: "Major public debates between the Sunni historian and speaker [[person/adnan-rashid|Adnan Rashid]] and the Christian apologist [[person/jay-smith|Jay Smith]] at Speakers' Corner and university venues in 2014–2015, on subjects such as 'Is the Qur'an the Word of God?' and 'Who is the Real Jesus?'. The contest turned on the soundness of prophetic and Gospel history and transmission, in an open oratorical style; the clips and transcripts remain in circulation {cite:answering-islam-debates-index}."
  es: "Importantes debates públicos entre el historiador y orador sunita [[person/adnan-rashid|Adnan Rashid]] y el apologista cristiano [[person/jay-smith|Jay Smith]] en Speakers' Corner y en recintos universitarios entre 2014 y 2015, sobre temas como \"¿Es el Corán la Palabra de Dios?\" y \"¿Quién es el verdadero Jesús?\". El debate giró en torno a la veracidad de la historia y la transmisión profética y evangélica, en un estilo oratorio abierto; los fragmentos y las transcripciones siguen circulando {cite:answering-islam-debates-index}."
  fr: "De grands débats publics ont opposé l'historien et orateur sunnite Adnan Rashid à l'apologiste chrétien Jay Smith, notamment à Speakers' Corner et dans des universités, entre 2014 et 2015. Ces débats portaient sur des sujets tels que « Le Coran est-il la Parole de Dieu ? » et « Qui est le véritable Jésus ? ». L'échange, mené dans un style oratoire ouvert, s'est concentré sur la véracité de l'histoire et de la transmission des prophéties et des Évangiles. Les extraits vidéo et les transcriptions de ces débats sont toujours disponibles."
  ur: "سنّی مؤرخ اور مقرر [[person/adnan-rashid|Adnan Rashid]] اور عیسائی معذرت خواہ [[person/jay-smith|Jay Smith]] کے درمیان 2014-2015 میں اسپیکرز کارنر اور یونیورسٹی کے مقامات پر بڑے عوامی مباحثے، جیسے کہ 'قرآن کا کلام' جیسے موضوعات پر؟ اور 'حقیقی عیسیٰ کون ہے؟'۔ مقابلہ پیشن گوئی اور انجیل کی تاریخ اور نشریات کی درستگی کو ایک کھلے تقریری انداز میں تبدیل کر دیا گیا۔ کلپس اور ٹرانسکرپٹس گردش میں ہیں {cite:answering-islam-debates-index}۔"
  tr: "2014 ve 2015 yılları arasında, Sünni tarihçi ve vaiz Adnan Raşid ile Hristiyan apologet Jay Smith arasında Orators' Corner ve üniversite çevrelerinde \"Kur'an Allah'ın kelamı mıdır?\" ve \"İsa gerçekte kimdir?\" gibi konular üzerine önemli kamuoyu tartışmaları gerçekleşti. Tartışma, açık ve retorik bir üslupla sunulan tarihin, peygamberlik ve İncil anlatılarının gerçekliği etrafında dönüyordu. Bu tartışmaların videoları ve transkriptleri hala dolaşımda."
  id: "Debat publik besar terjadi antara sejarawan dan pendakwah Sunni Adnan Rashid dan apologis Kristen Jay Smith di rubrik Orators' Corner dan lingkungan universitas antara tahun 2014 dan 2015, dengan topik seperti \"Apakah Al-Quran Firman Tuhan?\" dan \"Siapakah Yesus sebenarnya?\" Debat tersebut berputar حول keaslian sejarah dan narasi kenabian dan alkitabiah, yang disajikan dalam gaya retorika terbuka. Cuplikan dan transkrip debat ini masih beredar."
