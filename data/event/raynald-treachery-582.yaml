summary:
  ar: "غدر البرنس أرناط صاحب الكرك والشوبك بالقافلة المارة به من مصر إلى الشام وقبض على من فيها وحبسهم بقلعته ونهب ما معهم وكان بين المسلمين والفرنج هدنة فأنكر ذلك عليه الملك كي فأبى أن يردّ ما أخذ فكان ذلك من أعظم أسباب الحرب {cite:kamil-ibn-al-athir p. 142}."
  en: "Reynald de Chatillon, lord of Kerak and al-Shawbak, betrayed the truce: he seized a caravan passing from Egypt to Syria, jailed its merchants in his castle, and plundered their goods. King Guy denounced it and demanded restitution; Reynald refused — one of the greatest causes of the war {cite:kamil-ibn-al-athir p. 142}."
  es: "Reinaldo de Chatillon, señor de Kerak y al-Shawbak, traicionó la tregua: se apoderó de una caravana que viajaba de Egipto a Siria, encarceló a sus mercaderes en su castillo y saqueó sus mercancías. El rey Guido lo denunció y exigió una restitución; Reinaldo se negó, lo que constituyó una de las principales causas de la guerra {cite:kamil-ibn-al-athir p. 142}."
  fr: "Renaud de Châtillon, seigneur de Kerak et d'al-Shawbak, rompit la trêve: il s'empara d'une caravane qui traversait l'Égypte pour se rendre en Syrie, emprisonna ses marchands dans son château et pilla leurs marchandises. Le roi Guy dénonça cet acte et exigea réparation; Renaud refusa – ce qui constitua l'une des principales causes de la guerre (voir: Kamil ibn al-Athir, p. 142)."
  ur: "کیرک اور الشباک کے مالک رینالڈ ڈی چٹیلون نے جنگ بندی کو دھوکہ دیا: اس نے مصر سے شام جانے والے ایک قافلے پر قبضہ کر لیا، اس کے تاجروں کو اس کے قلعے میں قید کر دیا، اور ان کا سامان لوٹ لیا۔ کنگ گائے نے اس کی مذمت کی اور معاوضے کا مطالبہ کیا۔ رینالڈ نے انکار کر دیا - جنگ کے سب سے بڑے اسباب میں سے ایک۔ 142}۔"
  tr: "Karak ve Şevbak hükümdarı Prens Renaud, Mısır'dan Suriye'ye kendi topraklarından geçen kervana ihanet etti, kervandakileri esir aldı, kalesinde hapsetti ve yanlarında bulunan her şeyi yağmaladı. Müslümanlar ve Franklar arasında bir ateşkes vardı, bu yüzden Kral Kay buna itiraz etti, ancak aldığı şeyleri geri vermeyi reddetti. Bu, savaşın en büyük sebeplerinden biriydi. {cite:kamil-ibn-al-athir s. 142}"
  id: "Pangeran Renaud, penguasa Karak dan Shawbak, mengkhianati kafilah yang melewati wilayahnya dari Mesir ke Suriah, menangkap orang-orang di dalamnya, memenjarakan mereka di kastilnya, dan menjarah harta benda mereka. Ada gencatan senjata antara kaum Muslim dan Frank, sehingga Raja Kay keberatan dengan hal ini, tetapi ia menolak untuk mengembalikan apa yang telah diambilnya. Ini adalah salah satu penyebab perang terbesar. {cite:kamil-ibn-al-athir hlm. 142}"
