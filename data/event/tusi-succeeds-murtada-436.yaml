id: event/tusi-succeeds-murtada-436
class: event
kind: other
label:
  ar: "خلافة الشيخ الطوسي للشريف المرتضى في رئاسة الشيعة، ٤٣٦هـ"
  en: "Al-Tusi succeeds al-Murtada as head of Baghdad's Shi'a, 436/1044"
  ur: "طوسی کی جانشینی شریف مرتضیٰ کی، 436ھ/1044ء"
  es: "Al-Tusi sucede a al-Murtada como jefe de los chiítas de Bagdad, 436/1044"
  fr: "Al-Tusi succède à al-Murtada à la tête des chiites de Bagdad, 436/1044"
  tr: "Şeyh el-Tusi, Şerif el-Murtada'nın yerine Şii cemaatinin başına geçti, H. 436"
  id: "Syekh al-Tusi menggantikan Syarif al-Murtada sebagai pemimpin komunitas Syiah, 436 H."
summary:
  ar: "عند وفاة الشريف المرتضى سنة ٤٣٦هـ/١٠٤٤م خلفه الطوسي في رئاسة إمامية العاصمة، وإن كان أعلام كبار من تلاميذ المفيد كالنجاشي والكراجكي وأبي يعلى الجعفري أحياء؛ وقد جمع يومئذ مصنفات كثيرة ونال نصرة بويهيين كثيرين وقرّبه الخليفة القائم بأمر الله فجعله على أهم كرسي للكلام بالعاصمة؛ وورث قسماً عظيماً من كبريات مكتبات الإمامية — مكتبة دار العلم التي أسسها صابور بن أردشير وفيها أكثر من مائة ألف كتاب ومكتبة المرتضى وفيها نحو ثمانين ألفاً — وصارت داره بالكرخ أكثر من عشر سنين المركز العلمي الفعلي للإمامية {cite:encyclopaedia-of-islam-2 vol. 10 pp. 744-745}."
  en: "On al-Sharif al-Murtada's death in 436/1044 he was succeeded by al-Tusi, though eminent former pupils of al-Mufid like al-Najashi, al-Karajaki and Abu Ya'la al-Ja'fari were still alive; by then al-Tusi had already amassed an impressive bibliography and the support of numerous Buyids and of the caliph al-Qa'im, who appointed him to the capital's most prestigious chair of theology. Heir to the great Imami libraries — Sabur ibn Ardashir's Dar al-Ilm of over 100,000 works and al-Murtada's own of nearly 80,000 — he composed some fifty books and his Karkh house was for more than a decade the virtual intellectual centre of Imamism {cite:encyclopaedia-of-islam-2 vol. 10 pp. 744-745}."
  ur: "شریف مرتضیٰ کی 436ھ/1044ء میں وفات پر طوسی دارالخلافہ کے امامیوں کے جانشین بنے اگرچہ مفید کے بوڑھے شاگرد نجاشی، کراجکی اور ابو یعلیٰ جعفری ابھی زندہ تھے؛ اس وقت تک طوسی نے نمایاں کتب لکھ چکے تھے اور بویہیوں اور خلیفہ قائم کی حمایت حاصل تھی جس نے انہیں دارالخلافہ کی کلام کی بلند ترین کرسی دی؛ دارالعلم کی صابور بن اردشیر والی ایک لاکھ سے زائد جلدوں کی کتب خانہ اور مرتضیٰ کے تقریباً اسی ہزار جلدوں کے وارث بن کر انہوں نے قریب پچاس کتب تصنیف کیں اور ان کا کرخ کا گھر دس برس سے زائد امامیہ کا علمی مرکز رہا {cite:encyclopaedia-of-islam-2 vol. 10 pp. 744-745}۔"
  es: "Tras la muerte de al-Sharif al-Murtada en 436/1044, le sucedió al-Tusi, aunque eminentes antiguos alumnos de al-Mufid, como al-Najashi, al-Karajaki y Abu Ya'la al-Ja'fari, seguían vivos. Para entonces, al-Tusi ya había acumulado una impresionante bibliografía y contaba con el apoyo de numerosos buyíes y del califa al-Qa'im, quien lo nombró para la cátedra de teología más prestigiosa de la capital. Heredero de las grandes bibliotecas imamíes —el Dar al-Ilm de Sabur ibn Ardashir, con más de 100.000 obras, y la propia de al-Murtada, con casi 80.000—, compuso unos cincuenta libros y su casa de Karkh fue durante más de una década el centro intelectual virtual del imamismo {cite:encyclopaedia-of-islam-2 vol. 10 pp. 744-745}."
  fr: "À la mort d'al-Sharif al-Murtada en 436/1044, al-Tusi lui succéda, bien que d'éminents anciens élèves d'al-Mufid, tels qu'al-Najashi, al-Karajaki et Abu Ya'la al-Ja'fari, fussent encore vivants. Al-Tusi avait alors déjà constitué une impressionnante bibliographie et bénéficiait du soutien de nombreux Bouyides et du calife al-Qaïm, qui le nomma à la chaire de théologie la plus prestigieuse de la capitale. Héritier des grandes bibliothèques imâmites – le Dar al-Ilm de Sabur ibn Ardashir, riche de plus de 100 000 ouvrages, et celle d'al-Murtada, qui en comptait près de 80 000 –, il composa une cinquantaine de livres et sa maison de Karkh fut, pendant plus d'une décennie, le véritable centre intellectuel de l'imamisme (voir Encyclopaedia of Islam, vol. 10, p. 744-745)."
  tr: "Şerif el-Murtada 436 Hicri/1044 Miladi yılında vefat ettiğinde, el-Tusi, başkentteki İmamiye'nin başına geçti; oysa el-Mufid'in öğrencilerinden el-Najashi, el-Karajaki ve Ebu Ya'la el-Caferi gibi önde gelen isimler hâlâ hayattaydı. O dönemde birçok eser toplamış ve birçok Buyid'in desteğini kazanmıştı. Halife el-Kaim bi-Amr Allah onu yanına alarak başkentteki en önemli teoloji makamına getirdi. İmamiye'nin önemli kütüphanelerinin büyük bir bölümünü miras aldı; Sabur ibn Ardaşir tarafından kurulan ve yüz binden fazla kitap içeren Darü'l-İlm Kütüphanesi ve yaklaşık seksen bin kitap içeren el-Murtada Kütüphanesi bunlardan bazılarıydı. El-Karkh'taki evi on yıldan fazla bir süre İmamiye'nin fiili bilim merkezi haline geldi. {cite:encyclopaedia-of-islam-2 vol. 10 pp. 744-745}"
  id: "Ketika Sharif al-Murtada wafat pada tahun 436 H/1044 M, al-Tusi menggantikannya sebagai kepala Imamiyyah di ibu kota, meskipun tokoh-tokoh terkemuka dari murid-murid al-Mufid, seperti al-Najashi, al-Karajaki, dan Abu Ya’la al-Ja’fari, masih hidup. Pada saat itu, ia telah mengumpulkan banyak karya dan mendapatkan dukungan dari banyak Buyid, dan Khalifah al-Qa’im bi-Amr Allah mendekatkannya dan menempatkannya di kursi teologi terpenting di ibu kota. Ia mewarisi sebagian besar perpustakaan Imamiyyah utama—Perpustakaan Dar al-Ilm, yang didirikan oleh Sabur ibn Ardashir dan berisi lebih dari seratus ribu buku, dan Perpustakaan al-Murtada, yang berisi sekitar delapan puluh ribu buku—dan rumahnya di al-Karkh selama lebih dari sepuluh tahun menjadi pusat ilmiah Imamiyyah yang sebenarnya. {cite:encyclopaedia-of-islam-2 vol. 10 hlm. 744-745}"
