id: "event/ali-ibn-al-fadl-enters-sanaa-on-the-night-of-ashura-299-ah-and-stays-eleven-days"
class: event
kind: other
label:
  ar: "يدخل علي بن الفضل صنعاء ليلة عاشوراء سنة 299هـ ويقيم بها أحد عشر يوما، ص397"
  en: "Ali ibn al-Fadl enters Sanaa on the night of Ashura 299 AH and stays eleven days, p. 397"
  ur: "علی بن الفضل 299ھ کی عاشورا کی رات صنعاء میں داخل ہو کر گیارہ دن رہتا ہے، ص397"
  es: "Ali ibn al-Fadl entra en Sanaa la noche de Ashura del año 299 AH y permanece allí once días, pág. 397."
  fr: "Ali ibn al-Fadl entre à Sanaa la nuit d'Achoura 299 AH et y reste onze jours, p. 397"
  tr: "Ali ibn al-Fadl, Hicri 299 yılında Aşura gecesi Sana'a'ya girdi ve orada on bir gün kaldı (s. 397)."
  id: "Ali ibn al-Fadl memasuki Sana'a pada malam Asyura tahun 299 H dan tinggal di sana selama sebelas hari, hlm. 397"
summary:
  ar: "يدخل ابن كيالة صنعاء يوم السبت لثلاث ليال خلت من المحرم سنة 299هـ، ثم يدخلها ابن الفضل يوم الخميس ثم ليلة عاشوراء، ويقيم بها أحد عشر يوما، ثم يخرج إلى مدر."
  en: "Ibn Kayyala enters Sanaa on Saturday, three nights into Muharram 299 AH. Ali ibn al-Fadl comes on Thursday and enters Sanaa on the night of Ashura, staying eleven days before he leaves for Madar."
  ur: "ابن کیالہ محرم 299ھ کی تین راتیں گزرنے پر ہفتے کے دن صنعاء میں داخل ہوتا ہے، پھر علی بن الفضل جمعرات کو آتا ہے اور عاشورا کی رات صنعاء میں داخل ہو کر گیارہ دن قیام کرتا ہے، پھر مدر کی طرف نکلتا ہے۔"
  es: "Ibn Kayyala entra en Sanaa el sábado, tres noches después del inicio de Muharram del año 299 de la Hégira. Ali ibn al-Fadl llega el jueves y entra en Sanaa la noche de Ashura, permaneciendo allí once días antes de partir hacia Madar."
  fr: "Ibn Kayyala entre à Sanaa le samedi, trois nuits après le début du mois de Muharram 299 AH. Ali ibn al-Fadl arrive le jeudi et entre à Sanaa la nuit d'Achoura, où il reste onze jours avant de partir pour Madar."
  tr: "İbn Kayala, Hicri 299 yılında Muharrem ayının bitimine üç gece kala Cumartesi günü Sana'a'ya girdi. Ardından İbn el-Fadl Perşembe günü, sonra da Aşura gecesi Sana'a'ya girdi ve on bir gün orada kaldıktan sonra Medrese'ye gitti."
  id: "Ibn Kayala memasuki Sana'a pada hari Sabtu, tiga malam sebelum berakhirnya Muharram pada tahun 299 H. Kemudian Ibn al-Fadl memasukinya pada hari Kamis, lalu pada malam Asyura, dan tinggal di sana selama sebelas hari, kemudian ia berangkat ke Madar."
