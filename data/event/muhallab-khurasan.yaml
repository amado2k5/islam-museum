label: { ar: "ولاية المهلب بن أبي صفرة خراسان", en: "al-Muhallab ibn Abi Sufra's Khurasan", es: "Jurasán de al-Muhallab ibn Abi Sufra", fr: "Khurasan d'al-Muhallab ibn Abi Sufra", ur: "المحلب ابن ابی صفراء خراسان", tr: "Horasan'da Al-Muhallab ibn Abi Sufra valiliği.", id: "Jabatan Gubernur Al-Muhallab ibn Abi Sufra, Khorasan" }
summary:
  ar: "ولي الحجاج بن يوسف خراسان مع العراقين فولى خراسان المهلب بن أبي صفرة واسمه ظالم بن سراق بن صبح بن العتيك من الأزد ويكنى أبا سعيد سنة ٩٩ فغزا مغازي كثيرة وفتح الختل وقد انتقضت وفتح خجنده فأدت إليه السغد الأتاوة وغزا كش ونسف ورجع فمات بزاغول من مرو الروذ بالشوسة وكان بدء علته الحزن على ابنه المغيرة بن المهلب."
  en: "Al-Hajjaj, holding Khurasan with the two Iraqs, gave it in 99h to al-Muhallab ibn Abi Sufra — Zalim ibn Siraq ibn Subh of the Azd, Abu Sa'id — who campaigned widely: retook the breached Khattl and Khujanda, received Sughd's atawa, raided Kish and Nasaf, and died at Zaghul of Marw al-Rudh at al-Shawsa, his illness having begun in grief for his son al-Mughira."
  es: "Al-Hajjaj, que controlaba Jorasán junto con los dos Irak, se lo entregó en el año 99 a al-Muhallab ibn Abi Sufra — Zalim ibn Siraq ibn Subh de Azd, Abu Sa'id — quien emprendió una extensa campaña: reconquistó Khattl y Khujanda, que habían sido conquistadas, recibió el atawa de Sughd, saqueó Kish y Nasaf, y murió en Zaghul de Marw al-Rudh en al-Shawsa, tras haber comenzado su enfermedad por el dolor de la muerte de su hijo al-Mughira."
  fr: "Al-Hajjaj, détenant le Khorasan avec les deux Iraks, le donna en 99h à al-Muhallab ibn Abi Sufra — Zalim ibn Siraq ibn Subh de l'Azd, Abu Sa'id — qui mena une vaste campagne: reprit Khattl et Khujanda, reçut l'atawa de Sughd, pilla Kish et Nasaf, et mourut à Zaghul de Marw al-Rudh à al-Shawsa, sa maladie ayant commencé dans le chagrin pour son fils al-Mughira."
  ur: "الحجاج نے خراسان کو دو عراقوں کے ساتھ پکڑ کر 99 ہجری میں المحلب ابن ابی صفرا - ازد کے ظالم ابن سراق ابن سبح، ابو سعید - کو دے دیا جس نے بڑے پیمانے پر مہم چلائی: ٹوٹے ہوئے خطل اور خجندہ کو دوبارہ حاصل کیا، صغد کی موت اور مرعش کی موت اور ضعف کے مقام پر حملہ کیا۔ الرود الشوصہ، اس کی بیماری اپنے بیٹے المغیرہ کے غم میں شروع ہوئی تھی۔"
  tr: "Haccac bin Yusuf, iki Irak ile birlikte Horasan valiliğine atandı. 99 yılında Azd kabilesinden Zalim bin Surak bin Subh bin Al-Atik adıyla bilinen ve Ebu Said olarak da tanınan Al-Muhallab bin Abi Sufra'yı görevlendirdi. Birçok savaşa baskın düzenledi ve isyan edilmiş olan Al-Khatl'ı ve Hucende'yi ele geçirdi; böylece Soğdlular ona haraç ödediler. Kaş ve Nasaf'a baskın düzenledi, geri döndü ve Şusa'daki Merv el-Rudh'dan Zaghul'da öldü. Hastalığının başlangıcı, oğlu Al-Mughira bin Al-Muhallab'ın ölümüne duyduğu üzüntüydü."
  id: "Al-Hajjaj bin Yusuf diangkat menjadi gubernur Khorasan bersama dengan dua Irak. Ia mengangkat Al-Muhallab bin Abi Sufra, yang bernama Zalim bin Suraq bin Subh bin Al-Atik dari Azd, dan ia dikenal sebagai Abu Saeed, pada tahun 99. Ia memimpin banyak pertempuran dan menaklukkan Al-Khatl, yang sebelumnya memberontak, dan menaklukkan Khujandah, sehingga orang-orang Sogdia membayar upeti kepadanya. Ia menyerang Kash dan Nasaf dan kembali serta meninggal di Zaghul dari Marw Al-Rudh di Al-Shusa. Awal penyakitnya adalah kesedihan atas kematian putranya, Al-Mughira bin Al-Muhallab."
