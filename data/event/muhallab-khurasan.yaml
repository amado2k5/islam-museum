label: { ar: "ولاية المهلب بن أبي صفرة خراسان", en: "al-Muhallab ibn Abi Sufra's Khurasan" }
summary:
  ar: "ولي الحجاج بن يوسف خراسان مع العراقين فولى خراسان المهلب بن أبي صفرة واسمه ظالم بن سراق بن صبح بن العتيك من الأزد ويكنى أبا سعيد سنة ٩٩ فغزا مغازي كثيرة وفتح الختل وقد انتقضت وفتح خجنده فأدت إليه السغد الأتاوة وغزا كش ونسف ورجع فمات بزاغول من مرو الروذ بالشوسة وكان بدء علته الحزن على ابنه المغيرة بن المهلب."
  en: "Al-Hajjaj, holding Khurasan with the two Iraqs, gave it in 99h to al-Muhallab ibn Abi Sufra — Zalim ibn Siraq ibn Subh of the Azd, Abu Sa'id — who campaigned widely: retook the breached Khattl and Khujanda, received Sughd's atawa, raided Kish and Nasaf, and died at Zaghul of Marw al-Rudh at al-Shawsa, his illness having begun in grief for his son al-Mughira."
