label: { ar: "ملاحم جلال الدين وجنكيزخان سنة 618هـ" }
summary:
  ar: "استهلت سنة ثمان عشرة وست مئة والدنيا تغلي بالتتار وتجمع إلى السلطان جلال الدين بن خوارزم شاه كل عساكره والتقى تولي خان بن جنكيزخان فانكسر تولي خان وأسر من التتار خلق وقتل آخرون والله الحمد فقامت قيامة جنكيزخان واشتد غضبه إذ لم ينهزم له جيش قبلها فجمع جيشه وسار بهم إلى ناحية السند فالتقاه جلال الدين في شوال من السنة فانهزم جيشه أيضاً وثبت هو وطائفة ثم ولى جنكيزخان منهزماً وكادت الدائرة تدور عليه لولا كمين عشرة آلاف خرجوا على المسلمين فطحنوا الميمنة وأسروا ولد السلطان جلال الدين فتبدد نظامه وتقهقر إلى حافة السند وفيها تملك التتار مراغة وخربوها وأحرقوها وقتلوا أكثر أهلها وساروا إلى بلاد الروس {cite:shadharat-dhahab p. 79}."
  en: "In 618, 'the world boiling with Tatars', Jalal al-Din met Tolui's son and broke him — Genghis's first-ever defeat, at which his fury blazed — then Genghis himself marched to the Sind: at the Shawwal battle Jalal al-Din's army was again routed while he stood with a remnant, Genghis nearly beaten until a ten-thousand ambush crushed the Muslim right and captured the sultan's son; Jalal al-Din fell back to the Sind's edge. That year the Tatars took Maragha, burned it and slew most of its people, then rode to the Rus {cite:shadharat-dhahab p. 79}."
