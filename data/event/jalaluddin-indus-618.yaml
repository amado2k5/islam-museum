label: { ar: "ملاحم جلال الدين وجنكيزخان سنة 618هـ", en: "Battles of Jalal al-Din and Genghis Khan, 618 AH", es: "Batallas de Jalal al-Din y Genghis Khan, 618 d.H.", fr: "Batailles de Jalal al-Din et de Gengis Khan, 618 AH", ur: "جلال الدین اور چنگیز خان کی لڑائیاں، 618ھ" }
summary:
  ar: "استهلت سنة ثمان عشرة وست مئة والدنيا تغلي بالتتار وتجمع إلى السلطان جلال الدين بن خوارزم شاه كل عساكره والتقى تولي خان بن جنكيزخان فانكسر تولي خان وأسر من التتار خلق وقتل آخرون والله الحمد فقامت قيامة جنكيزخان واشتد غضبه إذ لم ينهزم له جيش قبلها فجمع جيشه وسار بهم إلى ناحية السند فالتقاه جلال الدين في شوال من السنة فانهزم جيشه أيضاً وثبت هو وطائفة ثم ولى جنكيزخان منهزماً وكادت الدائرة تدور عليه لولا كمين عشرة آلاف خرجوا على المسلمين فطحنوا الميمنة وأسروا ولد السلطان جلال الدين فتبدد نظامه وتقهقر إلى حافة السند وفيها تملك التتار مراغة وخربوها وأحرقوها وقتلوا أكثر أهلها وساروا إلى بلاد الروس {cite:shadharat-dhahab p. 79}."
  en: "In 618, 'the world boiling with Tatars', Jalal al-Din met Tolui's son and broke him — Genghis's first-ever defeat, at which his fury blazed — then Genghis himself marched to the Sind: at the Shawwal battle Jalal al-Din's army was again routed while he stood with a remnant, Genghis nearly beaten until a ten-thousand ambush crushed the Muslim right and captured the sultan's son; Jalal al-Din fell back to the Sind's edge. That year the Tatars took Maragha, burned it and slew most of its people, then rode to the Rus {cite:shadharat-dhahab p. 79}."
  es: "En 618, «el mundo hirviendo de tártaros», Jalal al-Din se enfrentó al hijo de Tolui y lo derrotó —la primera derrota de Gengis Kan, ante la cual su furia se encendió—, luego el propio Gengis Kan marchó al Sind: en la batalla de Shawwal, el ejército de Jalal al-Din fue nuevamente derrotado mientras él permanecía con un remanente, Gengis Kan casi vencido hasta que una emboscada de diez mil hombres aplastó el flanco derecho musulmán y capturó al hijo del sultán; Jalal al-Din se replegó hasta el borde del Sind. Ese año, los tártaros tomaron Maragha, la incendiaron y mataron a la mayoría de su gente, luego cabalgaron hacia Rus {cite:shadharat-dhahab p. 79}."
  fr: "En 618, alors que le monde était en proie à une frénésie tatare, Jalal al-Din affronta le fils de Tolui et le vainquit – la première défaite de Gengis Khan, qui attisa sa fureur – puis Gengis Khan marcha sur le Sind. Lors de la bataille de Shawwal, l'armée de Jalal al-Din fut de nouveau mise en déroute, tandis que lui-même résistait avec un reste de troupes. Gengis Khan fut presque vaincu lorsqu'une embuscade de dix mille hommes écrasa l'aile droite musulmane et captura le fils du sultan; Jalal al-Din se replia aux confins du Sind. Cette même année, les Tatars prirent Maragha, l'incendièrent et massacrèrent la plupart de ses habitants, puis se dirigèrent vers la Rus' (cf. shadharat-dhahab, p. 79)."
  ur: "618 میں، 'دنیا تاتاریوں کے ساتھ ابل رہی ہے'، جلال الدین نے تولوئی کے بیٹے سے ملاقات کی اور اسے توڑ دیا - چنگیز کی پہلی شکست، جس پر اس کا غصہ بھڑک اٹھا - پھر چنگیز نے خود سندھ کی طرف کوچ کیا: شوال کی جنگ میں جلال الدین کی فوج کو ایک بار پھر شکست دی گئی جب تک کہ وہ قریب ہی کھڑا ہو گیا۔ دس ہزار گھات لگا کر مسلمانوں کے حق کو کچل دیا اور سلطان کے بیٹے کو گرفتار کر لیا۔ جلال الدین واپس سندھ کے کنارے پر گر گیا۔ اسی سال تاتاریوں نے مراثہ کو لے لیا، اسے جلا دیا اور اس کے زیادہ تر لوگوں کو قتل کر دیا، پھر سوار ہو کر روس پہنچے۔ 79}۔"
