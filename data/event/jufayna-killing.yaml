label: { ar: "قتل جفينة العبادي وابنيه", en: "The Killing of Jufayna al-'Ibadi and his Sons", es: "El asesinato de Jufayna al-'Ibadi y sus hijos", fr: "L'assassinat de Jufayna al-'Ibadi et de ses fils", ur: "جفینا العبادی اور اس کے بیٹوں کا قتل" }
summary:
  ar: "كان جفينة العبادي من أهل الحيرة نصرانياً ظئراً لسعد بن أبي وقاص فاتهمه عبيد الله بن عمر بمشايعة أبي لؤلؤة على قتل أبيه فقتله وقتل ابنيه."
  en: "Jufayna al-'Ibadi, a Christian of al-Hira and Sa'd ibn Abi Waqqas's freedman — Ubaydallah ibn Umar accused him of abetting Abu Lu'lu'a in his father's killing, and killed him and his two sons."
  es: "Jufayna al-'Ibadi, un cristiano de al-Hira y liberto de Sa'd ibn Abi Waqqas, fue acusado por Ubaydallah ibn Umar de ayudar a Abu Lu'lu'a en el asesinato de su padre, y lo mató a él y a sus dos hijos."
  fr: "Jufayna al-'Ibadi, un chrétien d'al-Hira et affranchi de Sa'd ibn Abi Waqqas, fut accusé par Ubaydallah ibn Umar d'avoir aidé Abu Lu'lu'a à tuer son père, et le tua ainsi que ses deux fils."
  ur: "حیرہ کا عیسائی اور سعد بن ابی وقاص کا آزاد کرنے والا جفینا العبادی - عبیداللہ ابن عمر نے اس پر ابو للوع کو اپنے والد کے قتل میں ملوث کرنے کا الزام لگایا، اور اسے اور اس کے دو بیٹوں کو قتل کیا۔"
