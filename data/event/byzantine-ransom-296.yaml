# ملاحظة: السلاج (id) يحمل 296 من قراءة أولى؛ موضع الخبر في المنتظم تحت سنة 292 ⁦(ص 342)⁩.
summary:
  ar: "في سنة اثنتين وتسعين ومائتين كان الفداء بين المسلمين والروم وكانت جملة من فودي به من المسلمين ألفاً ومائتي نفس ثم غدر الروم فانصرفوا ورجع المسلمون بمن بقي معهم من الأسرى للروم {cite:muntazam-ibn-al-jawzi p. 342}."
  en: "The 292 prisoner exchange with Byzantium freed twelve hundred Muslims before the Romans broke faith and withdrew, the Muslims returning with the captives they still held {cite:muntazam-ibn-al-jawzi p. 342}."
  fr: "L'échange de prisonniers de 292 avec Byzance libéra mille deux cents musulmans avant que les Romains ne rompent leur engagement et se retirent, les musulmans repartant avec les captifs qu'ils détenaient encore {cite:muntazam-ibn-al-jawzi p. 342}."
  es: "El intercambio de prisioneros de 292 con Bizancio liberó a mil doscientos musulmanes antes de que los romanos rompieran su promesa y se retiraran, regresando los musulmanes con los cautivos que aún mantenían {cite:muntazam-ibn-al-jawzi p. 342}."
  ur: "بازنطیم کے ساتھ 292 قیدیوں کے تبادلے نے بارہ سو مسلمانوں کو رہا کر دیا اس سے پہلے کہ رومیوں کے ایمان توڑے اور واپس چلے جائیں، مسلمان ان قیدیوں کے ساتھ واپس آ رہے ہیں جنہیں وہ ابھی تک اپنے پاس رکھے ہوئے تھے۔ 342}۔"
