tags: [wasaya-browser, wasaya-prophets, wasaya-wasiyya, wasaya-ihtidar]
label: { ar: "وصية النبي بالأقباط وبالنساء وبما ملكت الأيمان", en: "The Prophet's counsel on the Copts, on women and on those in bondage", ur: "قبطیوں، عورتوں اور غلاموں کے بارے میں نبی کی وصیت", es: "El consejo del Profeta sobre los coptos, sobre las mujeres y sobre los esclavos.", fr: "Les conseils du Prophète sur les Coptes, sur les femmes et sur les personnes en esclavage" }
summary:
  ar: "يروي ابن كثير والصالحي والبيهقي عن النبي أنه قال إذا افتتحتم مصر فاستوصوا بالقبط خيراً فإن لهم ذمة ورحماً، من رواية الزهري عن ابن كعب بن مالك {cite:al-bidaya-wal-nihaya scan vol. 3 p. 582}{cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 2878}، ومن حديث أبي ذر في مسلم أن أهل تلك الأرض لهم ذمة ورحم {cite:al-bidaya-wal-nihaya scan vol. 3 p. 582}. ومن جهة أخرى يروي أنس وأم سلمة وعلي أن عامة وصيته حين حضره الموت كانت الصلاة وما ملكت أيمانكم {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 264}، وفي وصية علي كما ينقلها ابن كثير أن آخر ما تكلم به النبي أنه أوصى بالضعيفين، النساء وما ملكت الأيمان {cite:al-bidaya-wal-nihaya scan vol. 4 p. 319}. وتصل الروايات الأولى بالفتوحات اللاحقة ولا تنص كتب السيرة المقروءة على يوم قيلت فيه."
  en: "Ibn Kathir, al-Salihi and al-Bayhaqi report from the Prophet that if the Muslims conquered Egypt they should treat the Copts well, for they have a pledge and a kinship, in the report of al-Zuhri from the son of Ka'b ibn Malik {cite:al-bidaya-wal-nihaya scan vol. 3 p. 582}{cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 2878}, and in Abu Dharr's hadith in Muslim that the people of that land have a pledge and a kinship {cite:al-bidaya-wal-nihaya scan vol. 3 p. 582}. Separately, Anas, Umm Salama and Ali report that most of his counsel as death came was prayer and what your right hands possess {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 264}, and in Ali's testament as Ibn Kathir gives it, the last thing the Prophet said was a counsel about the two weak, women and those whom one's right hand possesses {cite:al-bidaya-wal-nihaya scan vol. 4 p. 319}. The first reports are tied to later conquests, and the books read here give no day on which they were said."
  ur: "ابن کثیر، صالحی اور بیہقی نبی سے روایت کرتے ہیں کہ جب تم مصر فتح کرو تو قبطیوں سے اچھا سلوک کرنا، کیونکہ ان کے لیے ذمہ اور رحم کا رشتہ ہے، زہری عن ابن کعب بن مالک کی روایت میں {cite:al-bidaya-wal-nihaya scan vol. 3 p. 582}{cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 2878}، اور مسلم میں ابو ذر کی حدیث میں کہ اس سرزمین والوں کے لیے ذمہ اور رحم ہے {cite:al-bidaya-wal-nihaya scan vol. 3 p. 582}۔ الگ سے انس، ام سلمہ اور علی روایت کرتے ہیں کہ موت کے وقت آپ کی اکثر وصیت نماز اور ماتحتوں کے بارے میں تھی {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 264}، اور علی کی وصیت میں، جیسے ابن کثیر نقل کرتے ہیں، یہ ہے کہ نبی کی آخری گفتگو دو کمزوروں، یعنی عورتوں اور ماتحتوں کے بارے میں وصیت تھی {cite:al-bidaya-wal-nihaya scan vol. 4 p. 319}۔ پہلی روایات بعد کی فتوحات سے جڑی ہیں اور یہاں پڑھی گئی کتابیں ان کے کہے جانے کا دن نہیں بتاتیں۔"
  es: "Ibn Kathir, al-Salihi y al-Bayhaqi informan del Profeta que si los musulmanes conquistaban Egipto debían tratar bien a los coptos, pues tenían una garantía y un parentesco, en el informe de al-Zuhri del hijo de Ka'b ibn Malik {cite:al-bidaya-wal-nihaya scan vol. 3 p. 582}{cite:dalail-al-nubuwwa-bayhaqi scan vol. 1 p. 2878}, y en el hadiz de Abu Dharr en Muslim que la gente de esa tierra tiene una garantía y un parentesco {cite:al-bidaya-wal-nihaya scan vol. 3 p. 582}. Por separado, Anas, Umm Salama y Ali informan que la mayor parte de su consejo al llegar la muerte fue la oración y lo que poseen tus manos derechas {cite:al-bidaya-wal-nihaya scan vol. 3 p. 263}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 264}, y en el testamento de Ali, como lo presenta Ibn Kathir, lo último que dijo el Profeta fue un consejo sobre los dos débiles, las mujeres y aquellos que están bajo la tutela de la mano derecha {cite:al-bidaya-wal-nihaya scan vol. 4 p. 319}. Los primeros relatos están ligados a conquistas posteriores, y los libros leídos aquí no indican el día en que fueron pronunciados."
  fr: "Ibn Kathir, al-Salihi et al-Bayhaqi rapportent du Prophète que si les musulmans conquéraient l'Égypte, ils devraient bien traiter les Coptes, car ils avaient un lien de parenté et un engagement envers eux. Ceci est également rapporté par al-Zuhri, d'après le fils de Ka'b ibn Malik (cf. al-bidaya-wal-nihaya, vol. 3, p. 582; cf. dalail-al-nubuwwa-bayhaqi, vol. 1, p. 2878), et par un hadith d'Abu Dharr rapporté par Muslim, indiquant que les habitants de cette région avaient un lien de parenté et un engagement envers eux (cf. al-bidaya-wal-nihaya, vol. 3, p. 582). Par ailleurs, Anas, Umm Salama et Ali rapportent que, sur son lit de mort, son principal conseil était la prière et la préservation de ses biens (cf. al-bidaya-wal-nihaya, vol. 3, p. 263). 3 p. 264}, et dans le testament d'Ali tel que rapporté par Ibn Kathir, les dernières paroles du Prophète furent un conseil concernant les deux faibles: les femmes et ceux que l'on possède par sa main droite {cite: al-bidaya-wal-nihaya scan vol. 4 p. 319}. Les premiers récits sont liés à des conquêtes ultérieures, et les ouvrages cités ici ne précisent pas la date à laquelle ils furent prononcés."
