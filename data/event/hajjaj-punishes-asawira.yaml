summary:
  ar: "لم يشهد الأساورة مع المسلمين الجمل وصفين ولا شيئاً من حروبهم حتى كان يوم مسعود ثم شهدوا بعد يوم مسعود الربذة وشهدوا أمر ابن الأشعث مع الحجاج فهدم الحجاج دورهم وحط أعطياتهم وأجلى بعضهم وقال كان في شرطكم أن لا تعينوا بعضنا على بعض."
  en: "The asawira stood aside at the Camel and Siffin and all the Muslims' civil wars till Yawm Mas'ud, then witnessed al-Rabadha and the Ibn al-Ash'ath affair — for which al-Hajjaj razed their houses, cut their stipends and exiled some, citing their own clause: 'it was in your compact not to aid one of us against another'."
