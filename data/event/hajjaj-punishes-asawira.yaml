id: event/hajjaj-punishes-asawira
class: event
kind: other
label: { ar: "عقوبة الحجاج للأساورة", en: "al-Hajjaj's Punishment of the Asawira", es: "El castigo de al-Hajjaj a los Asawira", fr: "Le châtiment des Asawira par al-Hajjaj", ur: "الحجاج عسویرہ کی سزا" }
summary:
  ar: "لم يشهد الأساورة مع المسلمين الجمل وصفين ولا شيئاً من حروبهم حتى كان يوم مسعود ثم شهدوا بعد يوم مسعود الربذة وشهدوا أمر ابن الأشعث مع الحجاج فهدم الحجاج دورهم وحط أعطياتهم وأجلى بعضهم وقال كان في شرطكم أن لا تعينوا بعضنا على بعض."
  en: "The asawira stood aside at the Camel and Siffin and all the Muslims' civil wars till Yawm Mas'ud, then witnessed al-Rabadha and the Ibn al-Ash'ath affair — for which al-Hajjaj razed their houses, cut their stipends and exiled some, citing their own clause: 'it was in your compact not to aid one of us against another'."
  es: "Los asawira se mantuvieron al margen en Camel y Siffin y en todas las guerras civiles musulmanas hasta Yawm Mas'ud, luego presenciaron al-Rabadha y el asunto de Ibn al-Ash'ath, por el cual al-Hajjaj arrasó sus casas, les cortó sus estipendios y exilió a algunos, citando su propia cláusula: \"Estaba en vuestro pacto no ayudar a uno de nosotros contra otro\"."
  fr: "Les Asawira restèrent à l'écart lors de la bataille du Chameau et du Siffin et de toutes les guerres civiles musulmanes jusqu'à Yawm Mas'ud, puis furent témoins de l'affaire d'al-Rabadha et d'Ibn al-Ash'ath — pour laquelle al-Hajjaj rasa leurs maisons, coupa leurs allocations et en exila certains, citant leur propre clause: « il était dans votre pacte de ne pas aider l'un de nous contre l'autre »."
  ur: "اساویرہ اونٹ اور صفین اور یوم مسعود تک تمام مسلمانوں کی خانہ جنگیوں میں ایک طرف کھڑا رہا، پھر الرابعہ اور ابن اشعث کے معاملے کا مشاہدہ کیا - جس کی وجہ سے الحجاج نے ان کے گھر اجاڑ دیے، ان کے وظیفے میں کٹوتی کی اور کچھ کو جلاوطن کر دیا، اپنی ہی شق کا حوالہ دیتے ہوئے کہا: 'یہ آپ کے کسی دوسرے کے خلاف نہیں تھا'۔"
