  id: "Catatan pendahuluan tentang Pertempuran Abu Qir Kedua pada tahun 1801 M, pendaratan pasukan Inggris yang mengakhiri kampanye Prancis di Mesir; sumber-sumber di halaman ini belum ditinjau."
