summary:
  ar: "عند البلاذري: سار خالد من عين التمر إلى الشام وقال للمثنى بن حارثة ارجع رحمك الله إلى سلطانك فغير مقصّر ولا وانٍ وكان شخوص خالد إلى الشام في شهر ربيع الآخر ويقال في شهر ربيع الأول سنة ثلاث عشرة وقال قوم إن خالداً أتى دومة من عين التمر ففتحها ثم أقبل إلى الحيرة فمنها مضى إلى الشام وأصح ذلك مضيه من عين التمر."
  en: "In al-Baladhuri: Khalid marched from Ayn al-Tamr to Syria, telling al-Muthanna ibn Haritha 'return, may God have mercy on you, to your command — unsparing, unwasting'; his departure was in Rabi' al-Akhir — or, it is said, Rabi' al-Awwal — of year 13; some say he came to Duma from Ayn al-Tamr, opened it, then returned to al-Hira and thence to Syria — the sounder being his march direct from Ayn al-Tamr."
