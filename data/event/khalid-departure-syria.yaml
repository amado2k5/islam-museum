id: event/khalid-departure-syria
class: event
kind: migration
label: { ar: "شخوص خالد إلى الشام", en: "Khalid's Departure for Syria", es: "Partida de Khalid hacia Siria", fr: "Le départ de Khalid pour la Syrie" }
summary:
  ar: "عند البلاذري: سار خالد من عين التمر إلى الشام وقال للمثنى بن حارثة ارجع رحمك الله إلى سلطانك فغير مقصّر ولا وانٍ وكان شخوص خالد إلى الشام في شهر ربيع الآخر ويقال في شهر ربيع الأول سنة ثلاث عشرة وقال قوم إن خالداً أتى دومة من عين التمر ففتحها ثم أقبل إلى الحيرة فمنها مضى إلى الشام وأصح ذلك مضيه من عين التمر."
  en: "In al-Baladhuri: Khalid marched from Ayn al-Tamr to Syria, telling al-Muthanna ibn Haritha 'return, may God have mercy on you, to your command — unsparing, unwasting'; his departure was in Rabi' al-Akhir — or, it is said, Rabi' al-Awwal — of year 13; some say he came to Duma from Ayn al-Tamr, opened it, then returned to al-Hira and thence to Syria — the sounder being his march direct from Ayn al-Tamr."
  es: "En al-Baladhuri: Khalid marchó desde Ayn al-Tamr a Siria, diciéndole a al-Muthanna ibn Haritha: «Regresa, que Dios tenga misericordia de ti, a tu mandato, sin reservas, sin desperdicios»; su partida fue en Rabi' al-Akhir —o, se dice, Rabi' al-Awwal— del año 13; algunos dicen que llegó a Duma desde Ayn al-Tamr, la abrió, luego regresó a al-Hira y de allí a Siria; la versión más sólida es su marcha directa desde Ayn al-Tamr."
  fr: "Dans al-Baladhuri: Khalid marcha d'Ayn al-Tamr vers la Syrie, disant à al-Muthanna ibn Haritha: « Retourne, que Dieu te fasse miséricorde, à ton commandement — sans relâche, sans gaspillage »; son départ eut lieu en Rabi' al-Akhir — ou, dit-on, Rabi' al-Awwal — de l'an 13; certains disent qu'il vint à Duma depuis Ayn al-Tamr, l'ouvrit, puis retourna à al-Hira et de là en Syrie — la version la plus plausible étant sa marche directe depuis Ayn al-Tamr."
