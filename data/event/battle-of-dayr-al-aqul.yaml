label: { ar: "وقعة دير العاقول", en: "Battle of Dayr al-Aqul", fr: "La bataille de Dayr al-Aqul", es: "Batalla de Dayr al-Aqul", ur: "دیرالعقول کی جنگ", tr: "Deyr el-Akul Muharebesi", id: "Pertempuran Deir al-Aqul" }
summary:
  ar: "مسير يعقوب بن الليث الصفار نحو العراق سنة اثنتين وستين ومائتين في جيوش عظيمة حتى نزل دير العاقول على شاطئ دجلة بين واسط وبغداد، فعسكر المعتمد بالقائم بسامرا واستخلف ابنه المفوض، ثم واقع الموفق أبو أحمد الصفار يوم الأحد لتسع خلون من رجب سنة اثنتين وستين ومائتين عند سيب بني كوما فانهزم يعقوب وسلم المعتمد من كيده {cite:muruj-al-dhahab p. 572-573}."
  en: "262/876: al-Muwaffaq's victory over Ya'qub the Saffarid at Dayr al-Aqul on the Tigris, the battle that saved the caliphate {cite:muruj-al-dhahab p. 572-573}."
  fr: "262/876 : la victoire d'al-Muwaffaq sur Ya'qub le Saffaride à Dayr al-Aqul, sur le Tigre, la bataille qui sauva le califat {cite:muruj-al-dhahab p. 572-573}."
  es: "262/876: victoria de al-Muwaffaq sobre Ya'qub el Saffarid en Dayr al-Aqul en el Tigris, la batalla que salvó el califato {cita:muruj-al-dhahab p. 572-573}."
  ur: "262/876: دجلہ پر دیر العقول کے مقام پر الموفق کی یعقوب صفرید پر فتح، وہ جنگ جس نے خلافت کو بچایا۔ 572-573}۔"
  tr: "Yakub ibn al-Layth al-Saffar, Hicri 262 yılında büyük ordularla Irak'a doğru ilerleyerek Wasit ve Bağdat arasında Dicle Nehri kıyısındaki Deyr el-Akul'a ulaştı. Al-Mu'tamid, Samarra'daki al-Qa'im'de kamp kurdu ve oğlu al-Mufawwad'ı vekili olarak atadı. Ardından al-Muwaffaq Abu Ahmad al-Saffar, Hicri 262 yılının Recep ayının dokuzuncu Pazar günü Sayb Bani Kuma'da savaştı. Yakub yenildi ve al-Mu'tamid ihanetinden kurtuldu. {cite:muruj-al-dhahab s. 572-573}"
  id: "Yaqub ibn al-Layth al-Saffar bergerak menuju Irak pada tahun 262 Hijriah dengan pasukan besar hingga mencapai Dayr al-Aqul di tepi Sungai Tigris antara Wasit dan Baghdad. Al-Mu'tamid berkemah di al-Qa'im di Samarra dan mengangkat putranya, al-Mufawwad, sebagai wakilnya. Kemudian al-Muwaffaq Abu Ahmad al-Saffar berperang pada hari Minggu, tanggal sembilan Rajab tahun 262 Hijriah, di Sayb Bani Kuma. Yaqub dikalahkan dan al-Mu'tamid diselamatkan dari pengkhianatannya. {cite:muruj-al-dhahab hlm. 572-573}"
