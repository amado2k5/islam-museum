label:
  ar: "تقليد تاج الدين السبكي قضاء الشافعية في حياة أبيه، صفر ٧٥٦هـ"
  en: "Taj al-Din al-Subki appointed Shafi'i qadi in his father's lifetime, Safar 756"
  ur: "تاج الدین سبکی کا قضائے شافعیہ کا تقلید، صفر 756ھ"
summary:
  ar: "في شهر صفر ٧٥٦هـ قدِم تقليد قضاء الشافعية بدمشق وأعمالها لقاضي القضاة تاج الدين عبد الوهاب بن قاضي القضاة تقي الدين السبكي على قاعدة والده، وذلك في حياة أبيه، وذهبت الناس للسلام عليه {cite:al-bidaya-wal-nihaya s.a. 756 p. 263}."
  en: "In Safar 756 the decree arrived appointing qadi Taj al-Din Abd al-Wahhab ibn Taqi al-Din al-Subki to the Shafi'i judgeship of Damascus and its districts, on his father's footing and in his father's lifetime, and the people went to congratulate him {cite:al-bidaya-wal-nihaya s.a. 756 p. 263}."
  ur: "صفر 756ھ میں دمشق کے قضائے شافعیہ کا فرمان تاج الدین عبد الوہاب بن قاضی القضاة تقی الدین سبکی کے نام آیا، ان کے والد کے ہی وقار پر اور ان کی حیات میں؛ لوگ مبارک باد کے لیے گئے {cite:al-bidaya-wal-nihaya s.a. 756 p. 263}۔"
