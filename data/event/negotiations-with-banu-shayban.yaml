id: event/negotiations-with-banu-shayban
class: event
kind: other
label: { ar: "عرض النبي نفسه على بني شيبان ومفاوضاتهم", en: "The Prophet presents himself to the tribe of Shayban", es: "El Profeta se presenta ante la tribu de Shayban.", fr: "Le Prophète se présente à la tribu de Shayban", ur: "نبی نے اپنے آپ کو قبیلہ شیبان کے سامنے پیش کیا۔" }
summary:
  ar: "في مكة قبل الهجرة أُمر النبي أن يعرض نفسه على قبائل العرب، فخرج بصحبة علي وأبي بكر إلى منى، ودخل مجلساً لبني شيبان بن ثعلبة فتكلم مفروق وهانئ والمثنى بن حارثة؛ انتهت المباحثات دون اتفاق، وتعلّم فيها علي من النبي أن النصرة لا تُشترط بمنصب أو عوض، وأن دين الله لا ينصره إلا من حاطه من جميع جوانبه."
  en: "Before the Hijra, the Prophet was commanded to present himself to the Arab tribes. With Ali and Abu Bakr he went to Mina and met the Banu Shayban ibn Tha'laba; the talks ended without an alliance, and Ali learned that support for the call must not be bought with power or reward."
  es: "Antes de la Hégira, se le ordenó al Profeta que se presentara ante las tribus árabes. Junto con Ali y Abu Bakr, fue a Mina y se reunió con los Banu Shayban ibn Tha'laba; las conversaciones concluyeron sin una alianza, y Ali aprendió que el apoyo a la misión no debía comprarse con poder ni recompensa."
  fr: "Avant l'Hégire, le Prophète reçut l'ordre de se présenter aux tribus arabes. Accompagné d'Ali et d'Abou Bakr, il se rendit à Mina et rencontra les Banu Shayban ibn Tha'laba; les pourparlers se soldèrent par un échec, et Ali comprit que le soutien à cet appel ne devait être acheté ni par la force ni par une récompense."
  ur: "ہجرت سے پہلے نبی کو حکم دیا گیا تھا کہ وہ اپنے آپ کو عرب قبائل کے سامنے پیش کریں۔ علی اور ابوبکر کے ساتھ وہ منیٰ گئے اور بنو شیبان بن ثعلبہ سے ملے۔ بات چیت بغیر کسی اتحاد کے ختم ہوئی، اور علی نے سیکھا کہ کال کی حمایت کو طاقت یا انعام سے نہیں خریدا جانا چاہیے۔"
