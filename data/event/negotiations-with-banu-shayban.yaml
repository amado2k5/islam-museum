    summary: { ar: "يذكر الصلابي أن النبي رفض أن يُعطي من يقدم النصرة ضماناً بأن يكون لأشخاصهم شيء في الحكم، لأن الدعوة إلى الله وشرطها الإخلاص، ويرى أن النبي اشترط ألا تُربط النصرة بمعاهدة تتناقض مع الدعوة ⁦(ص36-37)⁩.", en: "Al-Sallabi writes that the Prophet refused any guarantee of a share in rule to those offering support, because the call is for God and requires sincerity, and that he would not bind support to a treaty contrary to the call (pp. 36-37)." }
