label: { ar: "عرض النبي نفسه على بني شيبان ومفاوضاتهم", en: "The Prophet presents himself to the tribe of Shayban" }
summary:
  ar: "في مكة قبل الهجرة أُمر النبي أن يعرض نفسه على قبائل العرب، فخرج بصحبة علي وأبي بكر إلى منى، ودخل مجلساً لبني شيبان بن ثعلبة فتكلم مفروق وهانئ والمثنى بن حارثة؛ انتهت المباحثات دون اتفاق، وتعلّم فيها علي من النبي أن النصرة لا تُشترط بمنصب أو عوض، وأن دين الله لا ينصره إلا من حاطه من جميع جوانبه."
  en: "Before the Hijra, the Prophet was commanded to present himself to the Arab tribes. With Ali and Abu Bakr he went to Mina and met the Banu Shayban ibn Tha'laba; the talks ended without an alliance, and Ali learned that support for the call must not be bought with power or reward."
