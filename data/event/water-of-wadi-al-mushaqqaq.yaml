id: event/water-of-wadi-al-mushaqqaq
class: event
kind: other
label: { ar: "ماء وادي المشقق", en: "The water of Wadi al-Mushaqqaq", es: "El agua de Wadi al-Mushaqqaq", fr: "L'eau du Wadi al-Mushaqqaq", ur: "وادی المشقق کا پانی", tr: "Vadi el-Muşakkak Suyu", id: "Air Wadi al-Mushaqqaq" }
summary:
  ar: "كان في الطريق ماء يخرج من وشل بوادٍ يقال له وادي المشقق لا يروي إلا الراكب والراكبين، فنهى النبي أن يسبقه أحد إليه، فسبقه نفر من «المنافقين» فاستقوا ما فيه، فلعنهم النبي ودعا عليهم، ثم وضع يده تحت الوشل فانفجر الماء فشرب الناس."
  en: On the road was a trickle of water in a valley called Wadi al-Mushaqqaq, enough only for a rider or two. The Prophet forbade anyone to reach it before him; some of the 'hypocrites' went ahead and drew what was in it, and he cursed them and prayed against them. He then placed his hand beneath the trickle, the water gushed forth, and the people drank.
  es: "En el camino, en un valle llamado Wadi al-Mushaqqaq, había un pequeño arroyo con agua suficiente solo para uno o dos jinetes. El Profeta prohibió que nadie llegara antes que él; algunos hipócritas se adelantaron y sacaron agua, y él los maldijo y oró contra ellos. Luego, puso su mano bajo el arroyo, el agua brotó a borbotones y la gente bebió."
  fr: "Sur la route coulait un mince filet d'eau dans une vallée appelée Wadi al-Mushaqqaq, à peine suffisant pour un ou deux cavaliers. Le Prophète interdit à quiconque de l'atteindre avant lui; certains « hypocrites » s'y rendirent et puisèrent l'eau, et il les maudit et pria contre eux. Puis il plaça sa main sous le filet d'eau, qui jaillit, et les gens burent."
  ur: "سڑک پر وادی المشقق نامی وادی میں پانی کا ایک قطرہ تھا، جو صرف ایک یا دو سواروں کے لیے کافی تھا۔ نبی نے اس سے پہلے کسی کو پہنچنے سے منع فرمایا۔ کچھ 'منافقوں' نے آگے بڑھ کر جو کچھ اس میں تھا کھینچ لیا، اور اس نے ان پر لعنت کی اور ان کے خلاف دعا کی۔ اس کے بعد اس نے اپنا ہاتھ پانی کے نیچے رکھا، پانی نکلا اور لوگوں نے پی لیا۔"
  tr: "Vadi el-Muşakkak denilen bir vadideki pınardan çıkan su, ancak bir veya iki atlıyı susuzluğunu giderebilecek kadar azdı. Peygamber, kimsenin kendisinden önce oraya gitmesini yasakladı, ancak bir grup \"münafık\" ondan önce oraya gidip su çekti. Peygamber onları lanetledi ve onlara karşı dua etti, sonra elini pınarın altına koydu ve su fışkırdı, insanlar içti."
  id: "Ada air di jalan yang berasal dari mata air di sebuah lembah bernama Wadi al-Mushaqqaq, yang hanya bisa memuaskan dahaga satu atau dua penunggang kuda. Nabi melarang siapa pun untuk sampai ke sana sebelum beliau, tetapi sekelompok \"munafik\" sampai di sana sebelum beliau dan mengambil air dari sana. Nabi mengutuk mereka dan berdoa agar mereka tidak celaka, kemudian beliau meletakkan tangannya di bawah mata air dan air menyembur keluar dan orang-orang meminumnya."
