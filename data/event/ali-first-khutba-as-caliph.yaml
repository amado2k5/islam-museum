id: event/ali-first-khutba-as-caliph
class: event
kind: other
label: { ar: "أول خطبة لعلي بعد البيعة", en: "Ali's first sermon after the pledge", es: "El primer sermón de Ali después del juramento", fr: "Le premier sermon d'Ali après le serment d'allégeance", ur: "بیعت کے بعد علی کا پہلا خطبہ", tr: "Ali'nin biattan sonraki ilk hutbesi", id: "Khotbah pertama Ali setelah mengucapkan ikrar kesetiaan." }
summary:
  ar: "خطب علي أول خطبة في خلافته، فدعا إلى العمل بالكتاب، وأن يُؤدّى الفرض، وحرّم أذى المسلم إلا بحقه، وحذّر من الغفلة عن الموت، وقال: «إذا رأيتم الخير فخذوا به وإذا رأيتم الشر فدعوه» ⁦(ص192-193)⁩. ويلخص الصلابي الخطبة بأنها دعوة إلى الرجوع إلى عهد النبي والخلفاء الراشدين قبله."
  tr: "Ali, halife olarak verdiği ilk hutbesinde Kur'an'a bağlı kalınmasını ve dini yükümlülüklerin yerine getirilmesini savundu. Haklı bir sebep olmadıkça Müslümanlara zarar vermeyi yasakladı ve ölümden sakınmaya karşı uyararak, \"İyilik görürseniz onu kucaklayın, kötülük görürseniz ondan uzak durun\" dedi (s. 192-193). El-Sallabi, hutbeyi Peygamber ve ondan önceki doğru yolda olan halifeler dönemine dönme çağrısı olarak özetliyor."
  id: "Dalam khutbah pertamanya sebagai Khalifah, Ali menyerukan ketaatan kepada Al-Quran dan pemenuhan kewajiban agama. Ia melarang menyakiti seorang Muslim kecuali dalam kasus-kasus yang beralasan dan memperingatkan terhadap kelalaian akan kematian, dengan mengatakan, “Jika kamu melihat kebaikan, terimalah, dan jika kamu melihat kejahatan, tinggalkanlah” (hlm. 192-193). Al-Sallabi meringkas khutbah tersebut sebagai seruan untuk kembali ke era Nabi dan para Khalifah yang diberi petunjuk sebelum beliau."
