  ar: "حصر علاء الدين محمد خوارزم شاه مدينة هراة أول رجب سنة ستمائة، وكان أول ظهوره بخراسان بعد موت تكش، ثم رجع عنها {cite:kamil-ibn-al-athir p. 285}."
  en: "Muhammad Khwarazmshah besieged Herat in Rajab 600 — his first move into Ghurid Khurasan after Tekish's death — then withdrew {cite:kamil-ibn-al-athir p. 285}."
  es: "Muhammad Khwarazmshah sitió Herat en Rajab 600 —su primera incursión en el Jorasán Ghurid tras la muerte de Tekish— y luego se retiró {cite:kamil-ibn-al-athir p. 285}."
  fr: "Muhammad Khwarazmshah assiégea Hérat en Rajab 600 — sa première incursion dans le Khorasan ghuride après la mort de Tekish — puis se retira {cite:kamil-ibn-al-athir p. 285}."
  ur: "محمد خوارزم شاہ نے رجب 600 میں ہرات کا محاصرہ کیا - تکیش کی موت کے بعد غورید خراسان میں اس کا پہلا قدم - پھر پیچھے ہٹ گیا۔ 285}۔"
  tr: "Ala al-Din Muhammed Harezm Şah, 600 yılının Receb ayının ilk gününde Herat şehrini kuşattı. Horasan'daki ilk görünümü Tekiş'in ölümünden sonra oldu, ardından oradan çekildi. {Kaynak: Kamil ibn al-athir s. 285}"
  id: "Ala al-Din Muhammad Khwarazm Shah mengepung kota Herat pada tanggal 1 Rajab tahun 600. Kemunculan pertamanya di Khorasan adalah setelah kematian Tekish, kemudian ia mundur dari sana {cite:kamil-ibn-al-athir p. 285}."
