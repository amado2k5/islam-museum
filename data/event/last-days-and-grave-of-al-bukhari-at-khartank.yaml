label:
  ar: 'آخر أيام البخاري بخرتنك: دعاؤه ووصيته في كفنه وقبره'
  en: 'Last days of al-Bukhari at Khartank: his prayer, his shroud and his grave'
  ur: 'خرتنک میں بخاری کے آخری ایام: دعا، کفن کی وصیت اور قبر'
  es: "Los últimos días de al-Bujari en Jartank: su oración, su mortaja y su tumba."
summary:
  ar: نزل البخاري بخرتنك عند أقربائه فسمعه عبد القدوس يدعو ليلة أن يقبضه الله، ثم مرض ومات ليلة عيد الفطر سنة 256هـ {cite:siyar-alam-nubala scan vol. 1 p. 3342}. وروى مضيفه غالب بن جبريل أنه أوصى أن يُكفَّن في ثلاثة أثواب بيض لا قميص فيها ولا عمامة {cite:siyar-alam-nubala scan vol. 1 p. 3342}. ودُفن بخرتنك، وتروى حول قبره أخبار وكرامات منها الاستسقاء عنده {cite:siyar-alam-nubala scan vol. 1 p. 3343}. وتختلف الروايات في كيفية وفاته ووقتها {cite:tarikh-islam-dhahabi vol. 22 p. 273}.
  en: Al-Bukhari lodged with relatives at Khartank, where Abd al-Quddus heard him pray one night that God take him; he fell ill and died on the festival night of 256 AH {cite:siyar-alam-nubala scan vol. 1 p. 3342}. His host Ghalib ibn Jibril reports that he instructed they shroud him in three white garments with no shirt or turban {cite:siyar-alam-nubala scan vol. 1 p. 3342}. He was buried at Khartank, and reports and marvels are told around his grave, among them rain prayers there {cite:siyar-alam-nubala scan vol. 1 p. 3343}. The reports differ on how and when he died {cite:tarikh-islam-dhahabi vol. 22 p. 273}.
  ur: بخاری خرتنک میں رشتہ داروں کے ہاں ٹھہرے، جہاں عبد القدوس نے ایک رات انہیں دعا کرتے سنا کہ اللہ انہیں اٹھا لے؛ وہ بیمار ہوئے اور 256ھ میں عید کی رات فوت ہوئے {cite:siyar-alam-nubala scan vol. 1 p. 3342}۔ میزبان غالب بن جبریل کے مطابق انہوں نے وصیت کی کہ تین سفید کپڑوں میں، بغیر قمیص اور عمامے کے، کفن دیا جائے {cite:siyar-alam-nubala scan vol. 1 p. 3342}۔ وہ خرتنک میں دفن ہوئے اور ان کی قبر کے بارے میں خبریں اور کرامات بیان ہوتی ہیں، جن میں وہاں استسقاء بھی ہے {cite:siyar-alam-nubala scan vol. 1 p. 3343}۔ وفات کی کیفیت اور وقت میں روایات مختلف ہیں {cite:tarikh-islam-dhahabi vol. 22 p. 273}۔
  es: "Al-Bujari se hospedó con parientes en Jartank, donde Abd al-Quddus lo oyó rezar una noche pidiendo a Dios que se lo llevara; enfermó y murió en la noche festiva del año 256 AH {cite:siyar-alam-nubala scan vol. 1 p. 3342}. Su anfitrión, Ghalib ibn Jibril, relata que ordenó que lo amortajaran con tres vestiduras blancas, sin camisa ni turbante {cite:siyar-alam-nubala scan vol. 1 p. 3342}. Fue enterrado en Jartank, y se cuentan relatos y prodigios alrededor de su tumba, entre ellos oraciones para que lloviera {cite:siyar-alam-nubala scan vol. 1 p. 3343}. Los relatos difieren sobre cómo y cuándo murió {cite:tarikh-islam-dhahabi vol. 22 p. 273}."
