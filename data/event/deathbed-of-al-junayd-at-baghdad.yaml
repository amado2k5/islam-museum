label:
  ar: احتضار الجنيد ببغداد ودفنه بالشونيزية
  en: Deathbed of al-Junayd at Baghdad and burial at the Shuniziyya
  ur: بغداد میں جنید کی وفات اور شونیزیہ میں تدفین
  es: "Lecho de muerte de al-Junayd en Bagdad y entierro en Shuniziyya."
summary:
  ar: قال أبو بكر العطوي إنه كان عند الجنيد لما احتُضر فختم القرآن ثم قرأ من البقرة سبعين آية ومات {cite:siyar-alam-nubala scan vol. 1 p. 1008}. وقدّر ابن المنادي المصلين عليه بنحو ستين ألفاً، وتتابع الناس على قبره نحو شهر {cite:siyar-alam-nubala scan vol. 1 p. 1008}. ودُفن بالشونيزية عند السري السقطي وقبره إلى جنب قبره {cite:tarikh-baghdad-khatib scan vol. 1 p. 197}. وتختلف الكتب في سنة وفاته بين 297 و298هـ {cite:wafayat-ayan scan vol. 4 p. 134}.
  en: 'Abu Bakr al-Atawi said he was with al-Junayd when he was dying: he completed the Qur''an and recited seventy verses of al-Baqara, then died {cite:siyar-alam-nubala scan vol. 1 p. 1008}. Ibn al-Munadi estimated those who prayed over him at about sixty thousand, and people kept visiting his grave for about a month {cite:siyar-alam-nubala scan vol. 1 p. 1008}. He was buried at the Shuniziyya beside al-Sari al-Saqati, his grave next to Sari''s {cite:tarikh-baghdad-khatib scan vol. 1 p. 197}. The books differ on the year of death, 297 or 298 AH {cite:wafayat-ayan scan vol. 4 p. 134}.'
  ur: 'ابو بکر عطوی نے کہا کہ جنید کی نزع کے وقت وہ ان کے پاس تھے: انہوں نے قرآن ختم کیا اور بقرہ کی ستر آیتیں پڑھ کر فوت ہو گئے {cite:siyar-alam-nubala scan vol. 1 p. 1008}۔ ابن المنادی نے نماز پڑھنے والوں کا اندازہ ساٹھ ہزار کے قریب لگایا اور لوگ تقریباً ایک ماہ ان کی قبر پر آتے رہے {cite:siyar-alam-nubala scan vol. 1 p. 1008}۔ انہیں شونیزیہ میں سری سقطی کے پاس دفن کیا گیا، ان کی قبر سری کی قبر کے پہلو میں ہے {cite:tarikh-baghdad-khatib scan vol. 1 p. 197}۔ سنِ وفات میں 297 یا 298ھ کا اختلاف ہے {cite:wafayat-ayan scan vol. 4 p. 134}۔'
  es: "Abu Bakr al-Atawi dijo que estaba con al-Junayd cuando este moría: completó el Corán y recitó setenta versículos de al-Baqara, y luego murió {cite:siyar-alam-nubala scan vol. 1 p. 1008}. Ibn al-Munadi estimó que unos sesenta mil oraron por él, y la gente siguió visitando su tumba durante aproximadamente un mes {cite:siyar-alam-nubala scan vol. 1 p. 1008}. Fue enterrado en Shuniziyya junto a al-Sari al-Saqati, su tumba junto a la de Sari {cite:tarikh-baghdad-khatib scan vol. 1 p. 197}. Los libros difieren en el año de la muerte, 297 o 298 AH {cite:wafayat-ayan scan vol. 4 p. 134}."
