label:
  ar: "ولادة الخطيب البغدادي، ٣٩٢هـ"
  en: "Al-Khatib al-Baghdadi is born, 392/1002"
  ur: "خطیب بغدادی کی پیدائش، 392ھ/1002ء"
  es: "Nace Al-Khatib al-Baghdadi, 392/1002"
  fr: "Naissance d'Al-Khatib al-Baghdadi, 392/1002"
  tr: "El-Hatib El-Bağdadi'nin Doğumu, H. 392"
  id: "Kelahiran Al-Khatib Al-Baghdadi, 392 H"
summary:
  ar: "ولد الحافظ أبو بكر أحمد بن علي بن ثابت، المعروف بالخطيب البغدادي، سنة اثنتين وتسعين وثلاثمائة؛ وكان أبوه أبو الحسن الخطيب قد قرأ على أبي حفص الكتّاني وصار خطيب قرية درزيجان، إحدى قرى العراق تحت بغداد على دجلة بالجانب الغربي {cite:tarikh-islam-dhahabi p. 86}."
  en: "The hafiz Abu Bakr Ahmad ibn 'Ali ibn Thabit, known as al-Khatib al-Baghdadi, was born in 392. His father Abu al-Hasan al-Khatib had heard al-Kattani and served as preacher of the village of Darzijan, one of the villages of Iraq below Baghdad on the west bank of the Tigris {cite:tarikh-islam-dhahabi p. 86}."
  ur: "حافظ ابو بکر احمد بن علی بن ثابت، معروف بہ خطیب بغدادی، 392ھ میں پیدا ہوئے۔ ان کے والد ابوالحسن خطیب نے ابو حفص کتّانی سے سماعت کی تھی اور بغداد کے قریب دریائے دجلہ کے مغربی کنارے واقع گاؤں درزیجان کے خطیب تھے {cite:tarikh-islam-dhahabi p. 86}۔"
  es: "El hafiz Abu Bakr Ahmad ibn 'Ali ibn Thabit, conocido como al-Khatib al-Baghdadi, nació en 392. Su padre, Abu al-Hasan al-Khatib, había escuchado a al-Kattani y se desempeñó como predicador de la aldea de Darzijan, una de las aldeas de Irak situadas al sur de Bagdad, en la orilla oeste del Tigris {cite:tarikh-islam-dhahabi p. 86}."
  fr: "Le hafiz Abu Bakr Ahmad ibn 'Ali ibn Thabit, connu sous le nom d'al-Khatib al-Baghdadi, est né en 392. Son père, Abu al-Hasan al-Khatib, avait entendu al-Kattani et avait servi comme prédicateur du village de Darzijan, l'un des villages d'Irak en aval de Bagdad sur la rive ouest du Tigre {cite:tarikh-islam-dhahabi p. 86}."
  tr: "El-Hafız Ebu Bekir Ahmed ibn Ali ibn Sabit, El-Hatib El-Bağdadi olarak da bilinir, Hicri 392 yılında doğmuştur. Babası Ebu el-Hasan el-Hatib, Ebu Hafs el-Kattani'nin yanında eğitim görmüş ve Irak'ın Bağdat'ın batısında, Dicle Nehri kıyısındaki Darzican köyünün vaizi olmuştur. {cite:tarikh-islam-dhahabi s. 86}"
  id: "Al-Hafiz Abu Bakr Ahmad ibn Ali ibn Thabit, yang dikenal sebagai Al-Khatib Al-Baghdadi, lahir pada tahun 392 Hijriah. Ayahnya, Abu Al-Hasan Al-Khatib, belajar di bawah bimbingan Abu Hafs Al-Kattani dan menjadi pendakwah di desa Darzijan, salah satu desa di Irak di bawah Baghdad di tepi Sungai Tigris di sisi barat. {cite:tarikh-islam-dhahabi hlm. 86}."
