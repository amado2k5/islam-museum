summary:
  ar: "ولد الحافظ أبو بكر أحمد بن علي بن ثابت، المعروف بالخطيب البغدادي، سنة اثنتين وتسعين وثلاثمائة؛ وكان أبوه أبو الحسن الخطيب قد قرأ على أبي حفص الكتّاني وصار خطيب قرية درزيجان، إحدى قرى العراق تحت بغداد على دجلة بالجانب الغربي {cite:tarikh-islam-dhahabi p. 86}."
  en: "The hafiz Abu Bakr Ahmad ibn 'Ali ibn Thabit, known as al-Khatib al-Baghdadi, was born in 392. His father Abu al-Hasan al-Khatib had heard al-Kattani and served as preacher of the village of Darzijan, one of the villages of Iraq below Baghdad on the west bank of the Tigris {cite:tarikh-islam-dhahabi p. 86}."
  ur: "حافظ ابو بکر احمد بن علی بن ثابت، معروف بہ خطیب بغدادی، 392ھ میں پیدا ہوئے۔ ان کے والد ابوالحسن خطیب نے ابو حفص کتّانی سے سماعت کی تھی اور بغداد کے قریب دریائے دجلہ کے مغربی کنارے واقع گاؤں درزیجان کے خطیب تھے {cite:tarikh-islam-dhahabi p. 86}۔"
