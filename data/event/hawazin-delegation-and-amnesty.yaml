id: event/hawazin-delegation-and-amnesty
class: event
kind: other
label: { en: "The Hawazin delegation and the amnesty of captives", ar: "وفد هوازن واسترداد السبايا بالجعرانة", es: "La delegación de Hawazin y la amnistía de los cautivos", fr: "La délégation du Hawazin et l'amnistie des captifs" }
summary:
  en: "A delegation of Hawazin came to the Prophet at al-Ji'rana after professing Islam, invoking his foster-kinship among their clans; the Prophet relinquished his own share and that of Banu Abd al-Muttalib, and inspired the Muhajirun and Ansar to return six thousand captives to their families in a grand act of reconciliation."
  ar: "قدم وفد هوازن على النبي بالجعرانة بعد إسلامهم وناشدوه قرابة الرضاع في بني سعد بن بكر؛ فوهب لهم النبي نصيبه ونصيب بني عبد المطلب، وسارع المهاجرون والأنصار إلى رد أنصبائهم، فرُد ستة آلاف من النساء والأبناء إلى أهاليهم بعفو عام."
  es: "Una delegación de Hawazin se presentó ante el Profeta en al-Ji'rana tras profesar el Islam, invocando su parentesco adoptivo entre sus clanes; el Profeta renunció a su parte y a la de Banu Abd al-Muttalib, e inspiró a los Muhajirun y a los Ansar a devolver seis mil cautivos a sus familias en un grandioso acto de reconciliación."
  fr: "Une délégation de Hawazin vint trouver le Prophète à al-Ji'rana après avoir professé l'islam, invoquant ses liens de parenté avec leurs clans; le Prophète renonça à sa propre part et à celle des Banu Abd al-Muttalib, et incita les Muhajirun et les Ansar à rendre six mille captifs à leurs familles dans un grand acte de réconciliation."
