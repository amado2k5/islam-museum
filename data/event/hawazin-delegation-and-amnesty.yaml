label: { en: "The Hawazin delegation and the amnesty of captives", ar: "وفد هوازن واسترداد السبايا بالجعرانة" }
summary:
  en: "A delegation of Hawazin came to the Prophet at al-Ji'rana after professing Islam, invoking his foster-kinship among their clans; the Prophet relinquished his own share and that of Banu Abd al-Muttalib, and inspired the Muhajirun and Ansar to return six thousand captives to their families in a grand act of reconciliation."
  ar: "قدم وفد هوازن على النبي بالجعرانة بعد إسلامهم وناشدوه قرابة الرضاع في بني سعد بن بكر؛ فوهب لهم النبي نصيبه ونصيب بني عبد المطلب، وسارع المهاجرون والأنصار إلى رد أنصبائهم، فرُد ستة آلاف من النساء والأبناء إلى أهاليهم بعفو عام."
