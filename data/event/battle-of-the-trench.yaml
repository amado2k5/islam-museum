label: { en: "The Battle of the Trench (al-Ahzab)", ar: "غزوة الأحزاب (الخندق)" }
summary:
  en: "In Shawwal 5 AH (February-March 627 CE), a confederate army of 10,000 Meccans and Bedouin allies besieged Medina; upon Salman al-Farisi's advice the Muslims dug a protective trench on their northern boundary; the siege endured for nearly a month amidst cold, hunger, and the treachery of Banu Qurayza, until broken by Nu'aym ibn Mas'ud's stratagem and a violent night windstorm."
  ar: "في شوال سنة 5هـ (فبراير-مارس 627م)، زحف تحالف الأحزاب بعشرة آلاف مقاتل من قريش وغطفان بإيعاز من سادات يهود بني النضير؛ فأشار سلمان الفارسي بحفر الخندق شمال المدينة؛ صمد ثلاثة آلاف مسلم نحو شهر في برد وجوع ونقض بني قريظة لعهدهم، حتى خذل الله الأحزاب بحيلة نعيم بن مسعود وريح شاتية هوجاء زلزلت معسكرهم."
