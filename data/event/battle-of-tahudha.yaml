id: event/battle-of-tahudha
class: event
kind: battle
label:
  ar: وقعة تهوذة ومقتل عقبة بن نافع
  en: Battle of Tahudha and the death of Uqba ibn Nafi
  ur: تہوذہ کی لڑائی اور عقبہ بن نافع کی شہادت
summary:
  ar: قتل كسيلة بن لمزم في جمع من الروم والبربر عقبةَ بن نافع وأبا المهاجر ومن معهما عند تهوذة في طريق عودتهم من السوس، سنة ثلاث وستين فيما رواه الليث، ثم نزل كسيلة موضع عقبة {cite:futuh-misr-amir-1999 p. 267} {cite:futuh-misr-amir-1999 p. 268}.
  en: Kusayla ibn Lamzam, with a host of Rum and Berbers, killed Uqba ibn Nafi, Abu al-Muhajir and those with them at Tahudha on their way back from al-Sus, in the year 63 according to al-Layth, and then occupied Uqba's camp {cite:futuh-misr-amir-1999 p. 267} {cite:futuh-misr-amir-1999 p. 268}.
  ur: کسیلہ بن لمزم نے رومیوں اور بربروں کے ایک لشکر کے ساتھ سوس سے واپسی کے راستے میں تہوذہ کے مقام پر عقبہ بن نافع، ابو المہاجر اور ان کے ساتھیوں کو قتل کیا، لیث کی روایت میں سنہ 63 میں، پھر عقبہ کی چھاؤنی پر قبضہ کر لیا {cite:futuh-misr-amir-1999 p. 267} {cite:futuh-misr-amir-1999 p. 268}۔
