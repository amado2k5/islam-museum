label: { ar: "مقتل زكرويه على يد وصيف", en: "The Killing of Zikrawayh at the Hand of Wasif", es: "El asesinato de Zikrawayh a manos de Wasif", fr: "Le meurtre de Zikrawayh par Wasif" }
summary:
  ar: "في سنة أربع وتسعين ومائتين سار زكرويه إلى فيد فراسل أهلها فلم يظفر منهم بشيء فتنحى إلى النباج ثم إلى حفر أبي موسى، وانهض المكتفي وصيف بن صوارتكين ومعه جماعة من القواد فنفذوا من القادسية على طريق خفان، فلقيهم وصيف يوم السبت لثمان بقين من ربيع الأول فاقتتلوا يومهم فقتلوا منهم مقتلة عظيمة وخلصوا إلى زكرويه فضُرب بالسيف ضربة خالطت دماغه وأُسر جماعة من أهله وأصحابه، وعاش خمسة أيام ثم مات فشُقّ بطنه وقُدِّم به وبالأسارى فقُتلوا {cite:muntazam-ibn-al-jawzi p. 352}."
  en: "In 294 Zikrawayh moved on Fayd, drew no support, and fell back to al-Nabaj then Hafr Abi Musa; al-Muktafi sent Wasif ibn Sawartekin with the commanders via al-Qadisiyya on the Khaffan road, and they met on Saturday 8 remaining Rabi' I — a day of battle, a great slaughter, then a sword-blow to Zikrawayh's brain; he lived five days, his belly was slit and he was brought in with the captives, who were killed {cite:muntazam-ibn-al-jawzi p. 352}."
  es: "En 294, Zikrawayh avanzó hacia Fayd, no recibió apoyo y se replegó hacia al-Nabaj y luego hacia Hafr Abi Musa; al-Muktafi envió a Wasif ibn Sawartekin con los comandantes a través de al-Qadisiyya por el camino de Khaffan, y se encontraron el sábado 8 de Rabi' I restante: un día de batalla, una gran matanza, luego un golpe de espada en el cerebro de Zikrawayh; vivió cinco días, le abrieron el vientre y lo trajeron con los cautivos, que fueron asesinados {cite:muntazam-ibn-al-jawzi p. 352}."
  fr: "En 294, Zikrawayh se dirigea vers Fayd, sans obtenir de soutien, et se replia sur al-Nabaj puis Hafr Abi Musa; al-Muktafi envoya Wasif ibn Sawartekin avec les commandants via al-Qadisiyya sur la route de Khaffan, et ils se rencontrèrent le samedi 8 Rabi' I restant — une journée de bataille, un grand massacre, puis un coup d'épée à la tête de Zikrawayh; il vécut cinq jours, son ventre fut ouvert et il fut ramené avec les captifs, qui furent tués {cite:muntazam-ibn-al-jawzi p. 352}."
