kind: battle
label: { ar: "مقتل زكرويه على يد وصيف" }
summary:
  ar: "في سنة أربع وتسعين ومائتين سار زكرويه إلى فيد فراسل أهلها فلم يظفر منهم بشيء فتنحى إلى النباج ثم إلى حفر أبي موسى، وانهض المكتفي وصيف بن صوارتكين ومعه جماعة من القواد فنفذوا من القادسية على طريق خفان، فلقيهم وصيف يوم السبت لثمان بقين من ربيع الأول فاقتتلوا يومهم فقتلوا منهم مقتلة عظيمة وخلصوا إلى زكرويه فضُرب بالسيف ضربة خالطت دماغه وأُسر جماعة من أهله وأصحابه، وعاش خمسة أيام ثم مات فشُقّ بطنه وقُدِّم به وبالأسارى فقُتلوا {cite:muntazam-ibn-al-jawzi p. 352}."
  en: "In 294 Zikrawayh moved on Fayd, drew no support, and fell back to al-Nabaj then Hafr Abi Musa; al-Muktafi sent Wasif ibn Sawartekin with the commanders via al-Qadisiyya on the Khaffan road, and they met on Saturday 8 remaining Rabi' I — a day of battle, a great slaughter, then a sword-blow to Zikrawayh's brain; he lived five days, his belly was slit and he was brought in with the captives, who were killed {cite:muntazam-ibn-al-jawzi p. 352}."
