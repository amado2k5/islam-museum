  es: "Los alauitas regresan a Sa'da en Ramadán del año 322 de la Hégira; Zayd ibn Abi al-Abbas muere después de que Hassan hubiera mantenido a unos setenta hombres bajo su control, págs. 407-408."
  fr: "Les Alaouites retournent à Sa'da pendant le Ramadan 322 AH; Zayd ibn Abi al-Abbas est tué après que Hassan a retenu environ soixante-dix hommes, pp. 407-408"
  tr: "Aleviler Hicri 322 yılının Ramazan ayında Sa'de'ye döndüler ve Hasan yaklaşık yetmiş kişiyi hapse attıktan sonra Zeyd ibn Abi el-Abbas öldürüldü. (s. 407-408)"
  id: "Kaum Alawiyah kembali ke Sa'dah pada bulan Ramadan tahun 322 H, dan Zayd ibn Abi al-Abbas terbunuh setelah Hassan memenjarakan sekitar tujuh puluh orang. (hlm. 407-408)"
summary:
