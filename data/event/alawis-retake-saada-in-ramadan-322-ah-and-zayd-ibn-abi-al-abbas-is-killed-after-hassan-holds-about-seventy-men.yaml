label:
  ar: "يعود العلويون إلى صعدة في رمضان سنة 322هـ، ويقتل زيد بن أبي العباس بعد أن حبس حسان نحو سبعين رجلا، ص407-408"
  en: "The Alawis return to Sa'da in Ramadan 322 AH; Zayd ibn Abi al-Abbas is killed after Hassan has held about seventy men, pp. 407-408"
