label: { ar: "القبض على علي بن عيسى الوزير وولاية علي بن الفرات ثانية", en: "The arrest of the vizier Ali ibn Isa and the second appointment of Ali ibn al-Furat", fr: "L'arrestation du vizir Ali ibn Isa et la seconde nomination d'Ali ibn al-Furat", es: "El arresto del visir Ali ibn Isa y el segundo nombramiento de Ali ibn al-Furat", ur: "وزیر علی ابن عیسیٰ کی گرفتاری اور علی ابن الفرات کی دوسری تقرری", tr: "Ali ibn İsa el-Vezir'in tutuklanması ve Ali ibn el-Furat'ın ikinci valiliği", id: "Penangkapan Ali ibn Isa al-Wazir dan masa jabatan gubernur kedua Ali ibn al-Furat" }
summary:
  ar: "في سنة أربع وثلاثمائة قُبض على الوزير علي بن عيسى يوم الاثنين لثماني ليال خلون من ذي الحجة، وحُبس في دار المقتدر، وقُلّد علي بن محمد بن موسى بن الفرات الوزارة في اليوم نفسه {cite:tabari-tarikh-abu-al-fadl j.11 p.59}."
  en: "In the year 304 the vizier Ali ibn Isa was arrested on Monday, eight nights into Dhu'l-Hijja, and held in the house of al-Muqtadir; on the same day Ali ibn Muhammad ibn Musa ibn al-Furat was invested with the vizierate {cite:tabari-tarikh-abu-al-fadl j.11 p.59}."
  fr: "En l'an 304, le vizir Ali ibn Isa fut arrêté le lundi, huit nuits après le début de Dhu'l-Hijja, et détenu dans la maison d'al-Muqtadir ; le même jour, Ali ibn Muhammad ibn Musa ibn al-Furat fut investi du vizirat {cite:tabari-tarikh-abu-al-fadl j.11 p.59}."
  es: "En el año 304, el visir Ali ibn Isa fue arrestado un lunes, ocho noches después del inicio de Dhu'l-Hijja, y retenido en la casa de al-Muqtadir; ese mismo día, Ali ibn Muhammad ibn Musa ibn al-Furat fue investido como visir {cite:tabari-tarikh-abu-al-fadl j.11 p.59}."
  ur: "سنہ 304 میں وزیر علی ابن عیسیٰ کو پیر کے روز، آٹھ ذی الحجہ کی راتوں کو گرفتار کر کے المقتدر کے گھر میں رکھا گیا۔ اسی دن علی بن محمد بن موسیٰ بن الفرات کو وزیریٹ کے ساتھ لگایا گیا {حوالہ: طبری-تاریخ-ابو الفضل ج.11 ص59}۔"
  tr: "304 yılında, Zilhicce ayının bitiminden sekiz gece önce, Pazartesi günü, bakan Ali bin İsa tutuklandı ve Muktadir'in evinde hapsedildi. Aynı gün Ali bin Muhammed bin Musa bin el-Furat bakan olarak atandı. {cite:tabari-tarikh-abu-al-fadl j.11 p.59}"
  id: "Pada tahun 304, menteri Ali bin Isa ditangkap pada hari Senin, delapan malam sebelum berakhirnya Dzul Hijjah, dan dipenjara di rumah al-Muqtadir. Ali bin Muhammad bin Musa bin al-Furat diangkat menjadi menteri pada hari yang sama. {cite:tabari-tarikh-abu-al-fadl j.11 p.59}."
