summary:
  ar: "فتح كرمان في سنة أربع وعشرين، ثم نقض أهلها فاستعمل عليهم ابن عامر مجاشع بن مسعود السلمي له صحبة وأمره بمحاربتهم {cite:kamil-ibn-al-athir p. 428}."
  en: "Kirman opened in year 24; when its people later broke faith, Ibn 'Amir set the Companion Mujashi' ibn Mas'ud over it to war upon them {cite:kamil-ibn-al-athir p. 428}."
  es: "Kirman se inauguró en el año 24; cuando su gente rompió la fe, Ibn 'Amir puso al Compañero Mujashi' ibn Mas'ud al mando para que les hiciera la guerra {cite:kamil-ibn-al-athir p. 428}."
  fr: "Kirman s'ouvrit en l'an 24; lorsque ses habitants rompirent plus tard la foi, Ibn 'Amir chargea le Compagnon Mujashi' ibn Mas'ud de leur faire la guerre {cite:kamil-ibn-al-athir p. 428}."
  ur: "کرمان سال 24 میں کھولا گیا۔ جب اس کے لوگوں نے بعد میں ایمان توڑ دیا تو ابن عامر نے صحابی مجاشی ابن مسعود کو ان سے جنگ کرنے کے لیے اس پر مقرر کیا۔ 428}۔"
  tr: "Kerman yirmi dördüncü yılda fethedildi, sonra halkı isyan etti. Bunun üzerine İbn Amir, Peygamberimizle yakınlığı olan Mücaşi bin Mes'ud el-Sulami'yi onların başına atadı ve onlarla savaşmasını emretti. {Kaynak: Kamil ibn el-Atir s. 428}"
  id: "Kerman ditaklukkan pada tahun 24, kemudian penduduknya memberontak, sehingga Ibnu Amir menunjuk Mujashi’ bin Mas’ud al-Sulami, yang bersahabat dengan Nabi, untuk memimpin mereka dan memerintahkannya untuk memerangi mereka. {cite:kamil-ibn-al-athir p. 428}."
