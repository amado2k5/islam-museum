id: event/norman-capture-mahdiyya-543
class: event
kind: conquest
label: { ar: "استيلاء رجار صاحب صقلية على المهدية", en: "Roger of Sicily Seizes Mahdiyya", es: "Roger de Sicilia se apodera de Mahdiyya", fr: "Roger de Sicile s'empare de Mahdiyya", ur: "سسلی کے راجر نے مہدیہ کو پکڑ لیا۔", tr: "Sicilyalı Roger'ın Mahdia'yı fethi", id: "Penaklukan Mahdia oleh Roger dari Sisilia" }
summary:
  ar: "سنة 543هـ نزلت أساطيل رجار صاحب صقلية إلى المهدية في ثلاثمائة مركب وعليها جرجي بن ميخائيل الأنطاكي فيهم ألف فارس فاستولى على بلاد الساحل كلها ووضع على أهلها الجري وولى عليهم إلى أن استنقذهم عبد المؤمن شيخ الموحدين سنة 555هـ، وكان ذلك مذهب رجار فيما ملك من سواحل إفريقية يبقيهم تحت إيالته ويرد الفارين إلى أماكنهم {cite:tarikh-ibn-khaldun-ibar p. 1636}. وفي شذرات الذهب في سنة ثلاث وأربعين كانت شدة القحط بإفريقية فانتهز رجال صاحب صقلية الفرصة فأقبل في مائتين وخمسين مركباً فهرب منه صاحب المهدية فأخذها بلا ضربة ولا طعنة وصار للفرنج من طرابلس المغرب إلى قريب تونس {cite:shadharat-dhahab p. 614-615}."
  en: "In 543 Roger of Sicily's fleet under George of Antioch took Mahdiyya and the whole littoral, imposing the jarī levy and his governors over the towns until the Almohad Abd al-Mu'min recovered them in 555 {cite:tarikh-ibn-khaldun-ibar p. 1636}."
  es: "En 543, la flota de Roger de Sicilia, bajo el mando de Jorge de Antioquía, tomó Mahdiyya y todo el litoral, imponiendo el impuesto jarī y a sus gobernadores sobre las ciudades hasta que el almohad Abd al-Mu'min las recuperó en 555 {cite:tarikh-ibn-khaldun-ibar p. 1636}."
  fr: "En 543, la flotte de Roger de Sicile sous Georges d'Antioche prit Mahdiyya et tout le littoral, imposant la levée jarī et ses gouverneurs sur les villes jusqu'à ce que l'Almohade Abd al-Mu'min les reprenne en 555 {cite:tarikh-ibn-khaldun-ibar p. 1636}."
  ur: "543 میں انطاکیہ کے جارج کے ماتحت سسلی کے بحری بیڑے کے راجر نے مہدیہ اور پورے ساحل کو لے لیا، جری لیوی اور اس کے گورنروں کو قصبوں پر مسلط کر دیا یہاں تک کہ الموحد عبد المومن نے 555 میں ان کو بازیاب کر لیا۔ 1636}۔"
  tr: "Hicri 543 yılında, Sicilya hükümdarı Roger'ın filoları, Jurji ibn Mikhail al-Antaki komutasındaki üç yüz gemi ve bin süvariyle Mehdi'ye çıkarma yaptı. Tüm kıyı bölgesinin kontrolünü ele geçirdi, halkına boyunduruk dayattı ve 555 Hicri yılında Almohadların lideri Abd al-Mu'min onları kurtarana kadar üzerlerine bir vali atadı. Bu, Roger'ın kontrol ettiği Afrika kıyı bölgelerinde uyguladığı bir yöntemdi: onları kendi yönetimi altında tutmak ve kaçanları evlerine geri göndermek. {Kaynak:tarikh-ibn-khaldun-ibar s. 1636}. Şadharat al-Dhahab'da, Hicri 543 yılında Afrika'da şiddetli bir kıtlık yaşandığı belirtilir. Sicilya hükümdarının adamları bu fırsatı değerlendirerek iki yüz elli gemiyle ilerlediler. Mehdi hükümdarı ondan kaçtı ve Roger onu tek bir darbe veya bıçak darbesi almadan ele geçirdi. Franklar daha sonra Fas'taki Trablus'tan Tunus'a kadar olan bölgeyi kontrol altına aldılar. {cite:shadharat-dhahab ss. 614-615}."
  id: "Pada tahun 543 H, armada Roger, penguasa Sisilia, mendarat di Mahdia dengan tiga ratus kapal, dipimpin oleh Jurji ibn Mikhail al-Antaki dan seribu penunggang kuda. Ia menguasai seluruh wilayah pesisir, menundukkan penduduknya dan menunjuk seorang gubernur hingga Abd al-Mu'min, pemimpin Almohad, menyelamatkan mereka pada tahun 555 H. Inilah kebiasaan Roger di wilayah pesisir Afrika yang dikuasainya: menjaga wilayah tersebut di bawah kekuasaannya dan mengembalikan mereka yang melarikan diri ke rumah mereka. {cite:tarikh-ibn-khaldun-ibar p. 1636}. Dalam Shadharat al-Dhahab, disebutkan bahwa pada tahun 543 H, terjadi kelaparan hebat di Afrika. Pasukan penguasa Sisilia memanfaatkan kesempatan itu dan maju dengan dua ratus lima puluh kapal. Penguasa Mahdia melarikan diri darinya, dan Roger merebutnya tanpa perlawanan atau serangan sedikit pun. Bangsa Frank kemudian menguasai wilayah dari Tripoli di Maroko hingga dekat Tunis. {cite:shadharat-dhahab hlm. 614-615}."
