label: { ar: "استيلاء رجار صاحب صقلية على المهدية" }
summary:
  ar: "سنة 543هـ نزلت أساطيل رجار صاحب صقلية إلى المهدية في ثلاثمائة مركب وعليها جرجي بن ميخائيل الأنطاكي فيهم ألف فارس فاستولى على بلاد الساحل كلها ووضع على أهلها الجري وولى عليهم إلى أن استنقذهم عبد المؤمن شيخ الموحدين سنة 555هـ، وكان ذلك مذهب رجار فيما ملك من سواحل إفريقية يبقيهم تحت إيالته ويرد الفارين إلى أماكنهم {cite:tarikh-ibn-khaldun-ibar p. 1636}. وفي شذرات الذهب في سنة ثلاث وأربعين كانت شدة القحط بإفريقية فانتهز رجال صاحب صقلية الفرصة فأقبل في مائتين وخمسين مركباً فهرب منه صاحب المهدية فأخذها بلا ضربة ولا طعنة وصار للفرنج من طرابلس المغرب إلى قريب تونس {cite:shadharat-dhahab p. 614-615}."
  en: "In 543 Roger of Sicily's fleet under George of Antioch took Mahdiyya and the whole littoral, imposing the jarī levy and his governors over the towns until the Almohad Abd al-Mu'min recovered them in 555 {cite:tarikh-ibn-khaldun-ibar p. 1636}."
