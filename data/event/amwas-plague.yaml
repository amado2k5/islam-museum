label: { ar: "طاعون عمواس", en: "the Plague of 'Amwas (18 AH)" }
date:
  start: { edtf: "0639", hijri: "0018", calendar: julian, precision: year, status: tradition, derived: true, note: "سنة 18؛ التحويل مشتق {cite:kamil-ibn-al-athir p. 376}." }
summary:
  ar: "طاعون عمواس بالشام مات فيه أبو عبيدة بن الجراح أمير الناس ومعاذ بن جبل ويزيد بن أبي سفيان والحارث بن هشام وسهيل بن عمرو وعتبة بن سهيل وعامر بن غيلان الثقفي وتفانى الناس منه. كتب عمر إلى أبي عبيدة: قد عرضت لي إليك حاجة أريد أن أشافهك فيها، فعزمت عليك إذا نظرت في كتابي ألا تضعه من يدك حتى تقبل؛ فعرف أبو عبيدة ما أراد فكتب: قد عرفت حاجتك وإني في جند من المسلمين لا أجد بنفسي رغبة عنهم فحلّلني من عزيمتك. فلما قرأ عمر الكتاب بكى فقال الناس أمات أبو عبيدة؟ فقال لا وكأن قد. وقال أبو موسى للناس تنزّهوا من هذه القرية فتخرجوا في فسح بلادكم ونزهها حتى يرفع هذا الوباء {cite:kamil-ibn-al-athir p. 376-377}."
  en: "The plague of 'Amwas carried off the leadership of the Syrian army: Abu 'Ubayda, Mu'adh ibn Jabal, Yazid ibn Abi Sufyan, al-Harith ibn Hisham, Suhayl ibn 'Amr and others. 'Umar wrote Abu 'Ubayda a command to come at once — a device to extract him; Abu 'Ubayda understood and answered: «I am in an army of Muslims and have no wish to leave them; release me from your command.« Reading it 'Umar wept, and when asked «Is Abu 'Ubayda dead?« said: «No — and as good as dead.« Abu Musa told the people to scatter into the open country till the plague lifted {cite:kamil-ibn-al-athir p. 376-377}."
