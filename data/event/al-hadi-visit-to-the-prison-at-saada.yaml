id: event/al-hadi-visit-to-the-prison-at-saada
class: event
kind: other
label:
  ar: زيارة الهادي سجن صعدة وإصلاح أحوال السجناء
  en: Al-Hadi's visit to the prison at Sa'da and his orders for the prisoners
  ur: ہادی کا صعدہ کی جیل کا دورہ اور قیدیوں کے لیے احکام
  es: "La visita de Al-Hadi a la prisión de Sa'da y sus órdenes para los prisioneros."
  fr: "La visite d'Al-Hadi à la prison de Sa'da et ses ordres aux prisonniers"
summary:
  ar: بعد صلاة الجمعة سلك الهادي طريقاً غير طريقه إلى المسجد اقتداء بما رواه عن رسول الله، فمر بالسجن ونزل ودخل، وأمر بكنسه وتنظيفه وبالماء والطعام للمسجونين وبوطاء، وبفك القيود في وقت كل صلاة.
  en: After the Friday prayer al-Hadi took a different road home, as he said the Messenger of God did; passing the prison he dismounted, went in and ordered it swept and cleaned, water and food for the prisoners and bedding, and their shackles opened at each prayer time.
  ur: جمعہ کی نماز کے بعد ہادی نے واپسی میں دوسرا راستہ لیا جیسا انہوں نے رسول اللہ کا طریقہ بتایا؛ جیل کے پاس سے گزرے تو اتر کر اندر گئے اور صفائی، قیدیوں کے لیے پانی، کھانا اور بچھونے اور ہر نماز کے وقت بیڑیاں کھولنے کا حکم دیا۔
  es: "Tras la oración del viernes, al-Hadi tomó un camino diferente para volver a casa, tal como, según él, hizo el Mensajero de Dios; al pasar por la prisión, desmontó, entró y ordenó que la barrieran y limpiaran, que se proporcionara agua y comida a los prisioneros, así como ropa de cama, y que se les abrieran las cadenas a la hora de cada oración."
  fr: "Après la prière du vendredi, al-Hadi emprunta un chemin différent pour rentrer chez lui, comme l'avait fait, selon ses dires, le Messager de Dieu; passant devant la prison, il descendit de cheval, entra et ordonna qu'elle soit balayée et nettoyée, qu'on fournisse de l'eau et de la nourriture aux prisonniers ainsi que des couvertures, et que leurs chaînes soient ouvertes à chaque heure de prière."
