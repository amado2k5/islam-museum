id: event/al-hadi-visit-to-the-prison-at-saada
class: event
kind: other
label:
  ar: زيارة الهادي سجن صعدة وإصلاح أحوال السجناء
  en: Al-Hadi's visit to the prison at Sa'da and his orders for the prisoners
  ur: ہادی کا صعدہ کی جیل کا دورہ اور قیدیوں کے لیے احکام
summary:
  ar: بعد صلاة الجمعة سلك الهادي طريقاً غير طريقه إلى المسجد اقتداء بما رواه عن رسول الله، فمر بالسجن ونزل ودخل، وأمر بكنسه وتنظيفه وبالماء والطعام للمسجونين وبوطاء، وبفك القيود في وقت كل صلاة.
  en: After the Friday prayer al-Hadi took a different road home, as he said the Messenger of God did; passing the prison he dismounted, went in and ordered it swept and cleaned, water and food for the prisoners and bedding, and their shackles opened at each prayer time.
  ur: جمعہ کی نماز کے بعد ہادی نے واپسی میں دوسرا راستہ لیا جیسا انہوں نے رسول اللہ کا طریقہ بتایا؛ جیل کے پاس سے گزرے تو اتر کر اندر گئے اور صفائی، قیدیوں کے لیے پانی، کھانا اور بچھونے اور ہر نماز کے وقت بیڑیاں کھولنے کا حکم دیا۔
