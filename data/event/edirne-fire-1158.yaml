summary:
  ar: "اشتدّ انحطاط أدرنة بعد حريق سنة ١١٥٨هـ/١٧٤٥م الذي أحرق نحو ستين حياً من أحيائها، ثم أعقبه زلزال سنة ١١٦٤هـ/١٧٥١م {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  en: "Edirne's decline was hastened by the fire of 1158/1745, in which some sixty quarters of the city were burnt down, followed by the earthquake of 1164/1751 {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  ur: "ادرنہ کے زوال میں 1158ھ/1745ء کی آگ نے تیزی لائی جس میں شہر کے ساٹھ محلے جل کر راکھ ہوئے، پھر 1164ھ/1751ء کا زلزلہ آیا {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}۔"
  es: "El declive de Edirne se aceleró por el incendio de 1158/1745, en el que se quemaron unos sesenta barrios de la ciudad, seguido del terremoto de 1164/1751 {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  fr: "Le déclin d'Edirne fut accéléré par l'incendie de 1158/1745, au cours duquel une soixantaine de quartiers de la ville furent réduits en cendres, suivi du tremblement de terre de 1164/1751 {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
  tr: "Edirne'nin gerilemesi, yaklaşık altmış mahallesini yakan 1158 Hicri/1745 Miladi yangınından ve ardından 1164 Hicri/1751 Miladi depreminden sonra daha da şiddetlendi. {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}"
  id: "Kemerosotan Edirne semakin intensif setelah kebakaran tahun 1158 H/1745 M, yang menghanguskan sekitar enam puluh lingkungannya, diikuti oleh gempa bumi tahun 1164 H/1751 M {cite:encyclopaedia-of-islam-2 vol. 2 p. 711}."
