summary:
  ar: "بطاقة أولية لمعركة أقليش سنة ١١٠٨م، نصر المرابطين الكبير على قشتالة وقتلهم سانشو ابن ألفونسو؛ لم تُراجع مصادره على الصفحة بعد."
