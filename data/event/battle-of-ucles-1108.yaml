  tr: "1108 yılında gerçekleşen Aklis Savaşı'nın, Almoravidlerin Kastilya üzerindeki büyük zaferinin ve Alfonso'nun oğlu Sancho'nun öldürülmesinin ön anlatımı; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Aclis pada tahun 1108 M, kemenangan besar Almoravid atas Kastilia dan pembunuhan Sancho, putra Alfonso; sumber-sumbernya belum ditinjau di halaman ini."
