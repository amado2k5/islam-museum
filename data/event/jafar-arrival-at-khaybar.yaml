id: event/jafar-arrival-at-khaybar
class: event
kind: other
label: { ar: "قدوم جعفر بن أبي طالب على النبي بخيبر", en: "Ja'far ibn Abi Talib comes before the Prophet at Khaybar", es: "Ja'far ibn Abi Talib se presenta ante el Profeta en Khaybar.", fr: "Ja'far ibn Abi Talib se présente devant le Prophète à Khaybar.", ur: "جعفر بن ابی طالب خیبر میں نبی کے سامنے آئے" }
summary:
  ar: "ينقل ابن هشام، لا ابن إسحاق، خبراً عن سفيان بن عيينة عن الأجلح عن الشعبي: قدم جعفر بن أبي طالب على النبي يوم فتح خيبر، فقبّل النبي بين عينيه والتزمه وقال إنه لا يدري بأيهما هو أسر: بفتح خيبر أم بقدوم جعفر."
  en: "Ibn Hisham, not Ibn Ishaq, transmits a report from Sufyan ibn Uyayna from al-Ajlah from al-Sha'bi: Ja'far ibn Abi Talib arrived to the Prophet on the day Khaybar fell; the Prophet kissed him between the eyes and embraced him, saying he did not know which gave him more joy — the conquest of Khaybar or the arrival of Ja'far."
  es: "Ibn Hisham, no Ibn Ishaq, transmite un informe de Sufyan ibn Uyayna de al-Ajlah de al-Sha'bi: Ja'far ibn Abi Talib llegó al Profeta el día en que cayó Khaybar; el Profeta lo besó entre los ojos y lo abrazó, diciendo que no sabía qué le daba más alegría: la conquista de Khaybar o la llegada de Ja'far."
  fr: "Ibn Hisham, et non Ibn Ishaq, transmet un récit de Sufyan ibn Uyayna d'al-Ajlah d'al-Sha'bi: Ja'far ibn Abi Talib arriva auprès du Prophète le jour de la chute de Khaybar; le Prophète l'embrassa entre les yeux et l'enlaça, disant qu'il ne savait pas ce qui lui procurait le plus de joie: la conquête de Khaybar ou l'arrivée de Ja'far."
  ur: "ابن ہشام، ابن اسحاق نہیں، سفیان بن عیینہ کی العجلہ سے الشعبی سے روایت نقل کرتے ہیں: جعفر بن ابی طالب اس دن رسول اللہ کے پاس پہنچے جس دن خیبر گرا تھا۔ نبی نے اسے دونوں آنکھوں کے درمیان بوسہ دیا اور اسے گلے لگا لیا اور کہا کہ مجھے نہیں معلوم کہ اسے زیادہ خوشی کس چیز نے دی یعنی خیبر کی فتح یا جعفر کی آمد۔"
