label: { ar: "من سياسة عمر وأحكامه", en: "Umar's Governance and Judgments", es: "El gobierno y las decisiones de Umar", fr: "Gouvernance et jugements d'Umar", ur: "عمر کی حکومت اور فیصلے", tr: "Ömer'in politikaları ve kararlarından", id: "Berdasarkan kebijakan dan keputusan Omar" }
summary:
  ar: "كان عمر إذا استعمل عاملاً كتب ماله وشاطر عماله المتعدين أموالهم فأخذ نصفاً وأعطاهم نصفاً ومكث زماناً لا يأكل من المال شيئاً حتى دخلت عليه في ذلك خصاصة فأرسل إلى أصحاب النبي يستشيرهم فقال علي غداء وعشاء فأخذ بذلك وكتب ألا لا يجلدن أمير جيش ولا سرية أحداً الحد حتى يطلع الدرب لئلا تحمله حمية الشيطان أن يلحق بالكفار وقال إن هذا الأمر لا يصلح إلا بالشدة التي لا جبرية فيها وباللين الذي لا وهن فيه وجاءته امرأة فقالت زوجي يقوم الليل ويصوم النهار فقال لقد أحسنت الثناء على زوجك فقال كعب بن سور لقد شكت تزعم أنه ليس لها من زوجها نصيب فقال فإذ قد فهمت ذلك فاقض بينهما فقال أحل الله له من النساء أربعاً فلها من كل أربعة أيام يوم ومن كل أربع ليال ليلة وأنفق في حجته ستة عشر ديناراً فقال يا عبد الله أسرفنا في هذا المال."
  en: "When Umar appointed an official he registered his wealth, and halved the fortunes of wronging governors — a half to the treasury, a half to them. Long he ate nothing of the fisc till want touched him; he asked the Companions and Ali said 'lunch and supper' — he took that. His letter: no army or raiding amir shall flog a hadd far from the route, lest Satan's zeal carry him to the unbelievers. 'This matter stands only on a firmness without despotism and a gentleness without weakness'. A woman came: 'my husband prays all night and fasts all day' — 'well praised' — Ka'b ibn Suwar: 'she complains — she says he gives her no share' — 'then judge between them: God allowed him four women — she has a day of every four days and a night of every four nights'. And sixteen dinars spent on his hajj — 'Abdallah, we have been extravagant with this money'."
  es: "Cuando Umar nombró a un funcionario, registró su riqueza y dividió a la mitad las fortunas de los gobernadores corruptos: la mitad para el tesoro y la otra mitad para ellos. Durante mucho tiempo no comió nada del fisco hasta que la necesidad lo apremió; pidió a los Compañeros y Ali dijo: «Almuerzo y cena»; él aceptó. Su carta: ningún ejército ni emir invasor azotará a un hadd lejos de la ruta, no sea que el celo de Satanás lo lleve a los incrédulos. «Este asunto se basa únicamente en una firmeza sin despotismo y una gentileza sin debilidad». Llegó una mujer: «Mi esposo reza toda la noche y ayuna todo el día» — «bien alabado» — Ka'b ibn Suwar: «Ella se queja; dice que él no le da nada» — «Entonces juzguen entre ellos: Dios le permitió cuatro mujeres; ella tiene un día de cada cuatro días y una noche de cada cuatro noches». Y dieciséis dinares gastados en su hajj — «Abdallah, hemos sido extravagantes con este dinero»."
  fr: "Lorsqu'Umar nommait un fonctionnaire, il faisait enregistrer sa richesse et partageait en deux les fortunes des gouverneurs indélicats: la moitié pour le trésor, l'autre moitié pour eux. Longtemps, il ne toucha rien des impôts jusqu'à ce que le besoin le saisisse; il demanda aux Compagnons et Ali lui dit: « Déjeuner et souper » – il accepta. Sa lettre: aucune armée ni aucun émir pillard ne doit s'éloigner de son chemin, de peur que le zèle de Satan ne le pousse vers les mécréants. « Cette affaire ne tient qu'à une fermeté sans despotisme et à une douceur sans faiblesse. » Une femme vint: « Mon mari prie toute la nuit et jeûne toute la journée. » – « Bien dit ! » – Ka'b ibn Suwar: « Elle se plaint – elle dit qu'il ne lui donne rien. » – « Alors, jugez entre eux: Dieu lui a permis quatre femmes – elle a un jour tous les quatre jours et une nuit toutes les quatre nuits. » Et seize dinars dépensés pour son hajj — « Abdallah, nous avons été extravagants avec cet argent »."
  ur: "جب عمر نے ایک اہلکار مقرر کیا تو اس نے اپنی دولت کا اندراج کیا، اور ظالم گورنروں کی قسمت آدھی کر دی - آدھا خزانے میں، آدھا ان کے لیے۔ جب تک خواہش اسے چھونے تک اس نے کچھ نہیں کھایا۔ آپ نے صحابہ سے پوچھا اور علی نے کہا دوپہر کا کھانا اور رات کا کھانا۔ اس کا خط: کوئی لشکر یا چھاپہ مار امیر راستے سے دور حد تک کوڑے نہ مارے ورنہ شیطان کا جوش اسے کافروں تک پہنچا دے گا۔ 'یہ معاملہ صرف استبداد کے بغیر مضبوطی اور کمزوری کے بغیر نرمی پر ہے'۔ ایک عورت آئی: 'میرا شوہر ساری رات نماز پڑھتا ہے اور سارا دن روزہ رکھتا ہے' - 'خوب تعریف' - کعب بن سوار: 'وہ شکایت کرتی ہے - وہ کہتی ہے کہ اس نے اسے کوئی حصہ نہیں دیا' - 'پھر ان کے درمیان فیصلہ کرو: خدا نے اسے چار عورتوں کی اجازت دی - اس کے پاس ہر چار دن میں ایک دن ہے اور ہر چار راتوں میں ایک رات ہے'۔ اور اس کے حج پر سولہ دینار خرچ ہوئے - 'عبداللہ ہم نے اس رقم سے اسراف کیا ہے'۔"
  tr: "Ömer bir işçi çalıştırdığında, kazandığı parayı yazardı ve parasını aşan işçileriyle paylaşırdı; yarısını kendisi alır, yarısını da onlara verirdi. Paraya ihtiyacı olana kadar bir süre ondan hiçbir şey yemezdi. İhtiyacı olunca da Peygamberin sahabelerine danışırdı. Sahabeler, “Öğle ve akşam yemeğini ben karşılarım” dediler. Bunun üzerine Ömer parayı alıp şöyle yazdı: “Hiçbir ordu veya birlik komutanı, şeytanın gayreti onu kâfirlere katılmaya sevk etmesin diye, yola ulaşana kadar kimseyi kırbaçlamamalıdır.” “Bu mesele ancak zorlayıcı olmayan bir sertlik ve gevşek olmayan bir hoşgörü ile düzeltilebilir” dedi. Bir kadın ona gelip, “Kocam gece namaz kılar, gündüz oruç tutar” dedi. Ömer, “Kocanı çok övmüşsün” dedi. Ka’b bin Sur, “Kadın, kocasından hiçbir pay alamadığını iddia ederek şikayet ediyor” dedi. Ömer, “Bunu anladığına göre, aralarında hüküm ver” dedi. \"Allah ona dört eş nasip etti, bu yüzden her dört günde bir gün ve her dört gecede bir gece onunla birlikte olur,\" dedi. Hac yolculuğunda on altı dinar harcadı ve \"Ey Allah'ın kulu, bu parayla çok israf ettik,\" dedi."
  id: "Ketika Umar mempekerjakan seorang pekerja, ia akan mencatat uangnya dan membaginya dengan pekerja yang telah melampaui batas upahnya, mengambil setengah dan memberi setengah kepada mereka. Ia akan berdiam diri untuk sementara waktu tanpa makan apa pun dari uang itu sampai ia membutuhkannya, lalu ia mengirim utusan kepada para sahabat Nabi untuk meminta nasihat. Mereka berkata, “Aku akan menyediakan makan siang dan makan malam.” Maka ia mengambil itu dan menulis, “Tidak seorang pun komandan pasukan atau detasemen boleh mencambuk siapa pun sampai ia mencapai jalan, agar jangan sampai semangat setan membawanya bergabung dengan orang-orang kafir.” Ia berkata, “Masalah ini tidak akan diperbaiki kecuali dengan ketegasan yang tidak memaksa dan dengan kelonggaran yang tidak lemah.” Seorang wanita datang kepadanya dan berkata, “Suamiku shalat di malam hari dan berpuasa di siang hari.” Ia berkata, “Kamu telah memuji suamimu dengan baik.” Ka’b bin Sur berkata, “Ia telah mengeluh, mengklaim bahwa ia tidak mendapat bagian dari suaminya.” Ia berkata, “Karena kamu telah memahami itu, maka putuskanlah di antara mereka.” Dia berkata, “Allah telah mengizinkannya memiliki empat istri, sehingga istrinya mendapat satu hari dari setiap empat hari dan satu malam dari setiap empat malam.” Dia menghabiskan enam belas dinar untuk ibadah hajinya dan berkata, “Wahai hamba Allah, kita telah boros dengan uang ini.”"
