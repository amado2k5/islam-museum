label: { ar: "من سياسة عمر وأحكامه", en: "Umar's Governance and Judgments", es: "El gobierno y las decisiones de Umar", fr: "Gouvernance et jugements d'Umar" }
summary:
  ar: "كان عمر إذا استعمل عاملاً كتب ماله وشاطر عماله المتعدين أموالهم فأخذ نصفاً وأعطاهم نصفاً ومكث زماناً لا يأكل من المال شيئاً حتى دخلت عليه في ذلك خصاصة فأرسل إلى أصحاب النبي يستشيرهم فقال علي غداء وعشاء فأخذ بذلك وكتب ألا لا يجلدن أمير جيش ولا سرية أحداً الحد حتى يطلع الدرب لئلا تحمله حمية الشيطان أن يلحق بالكفار وقال إن هذا الأمر لا يصلح إلا بالشدة التي لا جبرية فيها وباللين الذي لا وهن فيه وجاءته امرأة فقالت زوجي يقوم الليل ويصوم النهار فقال لقد أحسنت الثناء على زوجك فقال كعب بن سور لقد شكت تزعم أنه ليس لها من زوجها نصيب فقال فإذ قد فهمت ذلك فاقض بينهما فقال أحل الله له من النساء أربعاً فلها من كل أربعة أيام يوم ومن كل أربع ليال ليلة وأنفق في حجته ستة عشر ديناراً فقال يا عبد الله أسرفنا في هذا المال."
  en: "When Umar appointed an official he registered his wealth, and halved the fortunes of wronging governors — a half to the treasury, a half to them. Long he ate nothing of the fisc till want touched him; he asked the Companions and Ali said 'lunch and supper' — he took that. His letter: no army or raiding amir shall flog a hadd far from the route, lest Satan's zeal carry him to the unbelievers. 'This matter stands only on a firmness without despotism and a gentleness without weakness'. A woman came: 'my husband prays all night and fasts all day' — 'well praised' — Ka'b ibn Suwar: 'she complains — she says he gives her no share' — 'then judge between them: God allowed him four women — she has a day of every four days and a night of every four nights'. And sixteen dinars spent on his hajj — 'Abdallah, we have been extravagant with this money'."
  es: "Cuando Umar nombró a un funcionario, registró su riqueza y dividió a la mitad las fortunas de los gobernadores corruptos: la mitad para el tesoro y la otra mitad para ellos. Durante mucho tiempo no comió nada del fisco hasta que la necesidad lo apremió; pidió a los Compañeros y Ali dijo: «Almuerzo y cena»; él aceptó. Su carta: ningún ejército ni emir invasor azotará a un hadd lejos de la ruta, no sea que el celo de Satanás lo lleve a los incrédulos. «Este asunto se basa únicamente en una firmeza sin despotismo y una gentileza sin debilidad». Llegó una mujer: «Mi esposo reza toda la noche y ayuna todo el día» — «bien alabado» — Ka'b ibn Suwar: «Ella se queja; dice que él no le da nada» — «Entonces juzguen entre ellos: Dios le permitió cuatro mujeres; ella tiene un día de cada cuatro días y una noche de cada cuatro noches». Y dieciséis dinares gastados en su hajj — «Abdallah, hemos sido extravagantes con este dinero»."
  fr: "Lorsqu'Umar nommait un fonctionnaire, il faisait enregistrer sa richesse et partageait en deux les fortunes des gouverneurs indélicats: la moitié pour le trésor, l'autre moitié pour eux. Longtemps, il ne toucha rien des impôts jusqu'à ce que le besoin le saisisse; il demanda aux Compagnons et Ali lui dit: « Déjeuner et souper » – il accepta. Sa lettre: aucune armée ni aucun émir pillard ne doit s'éloigner de son chemin, de peur que le zèle de Satan ne le pousse vers les mécréants. « Cette affaire ne tient qu'à une fermeté sans despotisme et à une douceur sans faiblesse. » Une femme vint: « Mon mari prie toute la nuit et jeûne toute la journée. » – « Bien dit ! » – Ka'b ibn Suwar: « Elle se plaint – elle dit qu'il ne lui donne rien. » – « Alors, jugez entre eux: Dieu lui a permis quatre femmes – elle a un jour tous les quatre jours et une nuit toutes les quatre nuits. » Et seize dinars dépensés pour son hajj — « Abdallah, nous avons été extravagants avec cet argent »."
