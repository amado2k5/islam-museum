id: event/siege-of-ayn-al-tamr
class: event
kind: siege
label: { ar: "حصار عين التمر وسبي كنيستها", en: "The Siege of Ayn al-Tamr and Its Church Captives", es: "El asedio de Ayn al-Tamr y sus cautivos eclesiásticos", fr: "Le siège d'Ayn al-Tamr et ses captifs ecclésiastiques", ur: "عین العمر کا محاصرہ اور اس کے چرچ کے اسیر" }
summary:
  ar: "عند البلاذري: أتى خالد بن الوليد عين التمر فالصق بحصنها وكانت فيه مسلحة للأعاجم عظيمة فخرج أهل الحصن فقاتلوا ثم لزموا حصنهم فحاصرهم خالد والمسلمون حتى سألوا الأمان فأبى أن يؤمنهم وافتتح الحصن عنوة وقتل وسبى ووجد في كنيسة هناك جماعة سباهم فكان من ذلك السبي حمران بن أبان بن خالد التمري مولى عثمان وسيرين أبو محمد بن سيرين وإخوته يحيى وأنس ومعبد وهو أكبرهم وهم موالي أنس بن مالك وأبو عمرة جد عبد الله بن عبد الأعلى الشاعر ويسار جد محمد بن إسحاق صاحب السيرة وهو مولى قيس بن مخرمة بن المطلب بن عبد مناف ومرة أبو عبيد جد محمد بن زيد بن عبيد بن مرة ونفيس بن محمد بن زيد بن عبيد بن مرة صاحب القصر عند الحرة ونصير أبو موسى بن نصير صاحب المغرب وهو مولى بني أمية؛ وقال ابن الكلبي كان أبو فروة عبد الرحمن بن الأسود ونصير أبو موسى عربيين من أراشة من بلي سبيا أيام أبي بكر من جبل الجليل بالشام وكان اسم نصير نصراً فصُغّر واعتقه بعض بني أمية فرجع إلى الشام وولد له موسى بقرية يقال لها كفر مري وكان أعرج وقد قيل إنهما أخوان من سبي عين التمر وولاؤهما لبني ضبة وقال المدائني يقال إنهما من سبي عين التمر فابتاع ناعم الأسدي أبا فروة ثم ابتاعه منه عثمان وجعله بحفر القبور فلما وثب الناس به كان معهم عليه فقال له رد المظالم فقال له أنت أولاها ابتعتك من مال الصدقة لتحفر القبور فتركت ذلك وأنما لُقّب أبو فروة بفروة كانت عليه حين سبي. وقيل إن خالداً صالح أهل حصن عين التمر وأن هذا السبي وجد في كنيسة ببعض الطسوج وقيل إن سيرين من أهل جرجرايا وإنه كان زائراً لقرابة له فأخذ في الكنيسة معهم. وعن الشعبي: صالح خالد أهل الحيرة وأهل عين التمر وكتب بذلك إلى أبي بكر فأجازه وأن شيئاً عليهم ليس على أراضيهم شيء. وكان هلال بن عقة بن قيس بن البشر النمري على النمر بن ساقط بعين التمر فجمع لخالد وقاتله فظفر به فقتله وصلبه وقال ابن الكلبي كان عليهم يومئذ عقة بن قيس بن البشر بنفسه وانتقض ببشير بن سعد الأنصاري جرحه فمات فدفن بعين التمر ودفن إلى جنبه عمير بن رئاب بن مهشم بن سعيد بن سهم بن عمرو وكان أصابه سهم بعين التمر فاستشهد."
  en: "In al-Baladhuri: Khalid ibn al-Walid came to Ayn al-Tamr, pressed against its fortress holding a great Persian garrison; its people fought then shut themselves in; Khalid besieged them till they asked safety — he refused to grant it, opened the fortress by force, killed and took captive, finding in a church there a band he took captive. Among that captivity: Humran ibn Aban ibn Khalid al-Tamri, Uthman's mawla; Sirin, father of Muhammad ibn Sirin, and his brothers Yahya, Anas and Ma'bad — the eldest — mawali of Anas ibn Malik; Abu Amra, grandfather of the poet Abdallah ibn Abd al-A'la; Yasar, grandfather of Muhammad ibn Ishaq author of the sira, mawla of Qays ibn Makhrama ibn al-Muttalib; Murra abu Ubayd, grandfather of Muhammad ibn Zayd ibn Ubayd ibn Murra and Nafis ibn Muhammad ibn Zayd, lords of the palace by al-Harra; and Nusayr, father of Musa ibn Nusayr the Maghreb's conqueror, mawla of the Umayyads. Al-Kalbi said Abu Farwa Abd al-Rahman ibn al-Aswad and Nusayr were two Arab men of Arasha of Bali captured in Abu Bakr's days from Syria's Jabal al-Jalil; Nusayr's name was Nasr, diminutivized — an Umayyad freed him, he returned to Syria and Musa was born to him at Kafr Mari village; he was lame. It was also said they were brothers of Ayn al-Tamr's captives whose wala' lay with Banu Dubba; al-Mada'ini: Na'im al-Asadi bought Abu Farwa, then Uthman bought him for grave-digging; when the people rose on Uthman he was with them against him, Uthman saying 'repel the wrongs' — he answered 'you are first among them: I bought you from alms-money to dig graves and you abandoned it'; Abu Farwa was named for the fur garment on him when captured. It was also said Khalid made peace with Ayn al-Tamr's fortress people and these captives were found in a church in some canal-district, and that Sirin was of Jarjaraya's people visiting kin when taken. Via al-Sha'bi: Khalid made peace with Hira's and Ayn al-Tamr's people and wrote Abu Bakr who approved — something on them, nothing on their lands. Hilal ibn Uqqa ibn Qays ibn al-Bushr al-Namiri was over al-Namar ibn Saqit at Ayn al-Tamr; he gathered for Khalid and fought him, was overcome, killed and crucified — al-Kalbi: it was Uqqa ibn Qays himself. Bashir ibn Sa'd al-Ansari's wound relapsed and he died, buried at Ayn al-Tamr, and beside him was buried Umayr ibn Ri'ab ibn Muhashshim ibn Sa'id ibn Sahm ibn Amr, martyred by an arrow there."
  es: "En al-Baladhuri: Khalid ibn al-Walid llegó a Ayn al-Tamr, acorralada contra su fortaleza que albergaba una gran guarnición persa; su gente luchó y luego se encerró; Khalid los asedió hasta que pidieron protección; él se negó a concedérsela, abrió la fortaleza por la fuerza, mató y tomó prisioneros, encontrando en una iglesia allí una banda que tomó prisionera. Entre esos cautivos: Humran ibn Aban ibn Khalid al-Tamri, mawla de Uthman; Sirin, padre de Muhammad ibn Sirin, y sus hermanos Yahya, Anas y Ma'bad —el mayor— mawali de Anas ibn Malik; Abu Amra, abuelo del poeta Abdallah ibn Abd al-A'la; Yasar, abuelo de Muhammad ibn Ishaq autor de la sira, mawla de Qays ibn Makhrama ibn al-Muttalib; Murra abu Ubayd, abuelo de Muhammad ibn Zayd ibn Ubayd ibn Murra y Nafis ibn Muhammad ibn Zayd, señores del palacio de al-Harra; y Nusayr, padre de Musa ibn Nusayr, el conquistador del Magreb, mawla de los Omeyas. Al-Kalbi dijo que Abu Farwa Abd al-Rahman ibn al-Aswad y Nusayr eran dos hombres árabes de Arasha de Bali capturados en tiempos de Abu Bakr en Jabal al-Jalil de Siria; el nombre de Nusayr era Nasr, diminutivo: un Omeya lo liberó, regresó a Siria y Musa nació de él en la aldea de Kafr Mari; era cojo. También se dijo que eran hermanos de los cautivos de Ayn al-Tamr cuyo wala' estaba con Banu Dubba; al-Mada'ini: Na'im al-Asadi compró a Abu Farwa, luego Uthman lo compró para cavar tumbas; cuando el pueblo se levantó contra Uthman, él estaba con ellos en su contra, Uthman diciendo 'rechaza las injusticias', él respondió 'tú eres el primero entre ellos: te compré con dinero de limosnas para cavar tumbas y lo abandonaste'; Abu Farwa recibió su nombre por la prenda de piel que llevaba cuando fue capturado. También se dijo que Khalid hizo la paz con la gente de la fortaleza de Ayn al-Tamr y que estos cautivos fueron encontrados en una iglesia en algún distrito de canales, y que Sirin era de la gente de Jarjaraya y estaba visitando a sus parientes cuando fue capturado. Via al-Sha'bi: Khalid hizo la paz con la gente de Hira y Ayn al-Tamr y escribió a Abu Bakr, quien lo aprobó, algo sobre ellos, nada sobre sus tierras. Hilal ibn Uqqa ibn Qays ibn al-Bushr al-Namiri estaba sobre al-Namar ibn Saqit en Ayn al-Tamr; reunió a Khalid y luchó contra él, fue vencido, asesinado y crucificado — al-Kalbi: fue el propio Uqqa ibn Qays. La herida de Bashir ibn Sa'd al-Ansari reapareció y murió, enterrado en Ayn al-Tamr, y junto a él fue enterrado Umayr ibn Ri'ab ibn Muhashshim ibn Sa'id ibn Sahm ibn Amr, martirizado allí por una flecha."
  fr: "Dans al-Baladhuri: Khalid ibn al-Walid arriva à Ayn al-Tamr et assiégea sa forteresse, qui abritait une importante garnison perse. Les habitants se défendirent et se retranchèrent. Khalid les assiégea jusqu’à ce qu’ils implorent sa clémence, qu’il refusa. Il ouvrit la forteresse par la force, tua et fit des prisonniers, et découvrit dans une église un groupe de captifs qu’il fit également prisonniers. Parmi ces captifs: Humran ibn Aban ibn Khalid al-Tamri, mawla d’Uthman; Sirin, père de Muhammad ibn Sirin, et de ses frères Yahya, Anas et Ma’bad (l’aîné), mawla d’Anas ibn Malik; Abu Amra, grand-père du poète Abdallah ibn Abd al-A’la; Yasar, grand-père de Muhammad ibn Ishaq, auteur de la sira, mawla de Qays ibn Makhrama ibn al-Muttalib. Murra abu Ubayd, grand-père de Muhammad ibn Zayd ibn Ubayd ibn Murra et de Nafis ibn Muhammad ibn Zayd, seigneurs du palais d'al-Harra; et Nusayr, père de Musa ibn Nusayr, le conquérant du Maghreb, mawla des Omeyyades. Al-Kalbi rapporte qu'Abu Farwa Abd al-Rahman ibn al-Aswad et Nusayr étaient deux Arabes d'Arasha de Bali, capturés à l'époque d'Abu Bakr au Jabal al-Jalil, en Syrie. Le nom de Nusayr était Nasr, diminutif de son prénom. Libéré par un Omeyyade, il retourna en Syrie et Musa lui naquit au village de Kafr Mari; il était boiteux. On dit aussi qu'ils étaient frères de captifs d'Ayn al-Tamr dont le wala' était lié aux Banu Dubba. Al-Mada'ini: Na'im al-Asadi acheta Abu Farwa, puis Uthman l'acheta pour creuser des tombes. Lorsque le peuple se souleva contre Uthman, il se joignit à eux contre lui. Uthman lui dit: « Repousse les injustices ! » Abu Farwa répondit: « Tu es le premier à les commettre: je t'ai acheté avec l'aumône pour creuser des tombes et tu as abandonné ton travail ! » Abu Farwa fut ainsi nommé en raison du vêtement de fourrure qu'il portait lors de sa capture. On raconte aussi que Khalid fit la paix avec les habitants de la forteresse d'Ayn al-Tamr et que ces captifs furent retrouvés dans une église près d'un canal. Sirin, quant à lui, était un homme du peuple de Jarjaraya, en visite chez des proches lorsqu'il fut capturé. Selon al-Sha'bi: Khalid fit la paix avec les habitants de Hira et d'Ayn al-Tamr et écrivit à Abu Bakr, qui approuva l'accord. Il leur accorda quelque chose, mais rien sur leurs terres. Hilal ibn Uqqa ibn Qays ibn al-Bushr al-Namiri était au-dessus d'al-Namar ibn Saqit à Ayn al-Tamr; il se rallia à Khalid et le combattit, mais fut vaincu, tué et crucifié – al-Kalbi: il s'agissait d'Uqqa ibn Qays lui-même. La blessure de Bashir ibn Sa'd al-Ansari s'ouvrit et il mourut, enterré à Ayn al-Tamr. À ses côtés fut enterré Umayr ibn Ri'ab ibn Muhashshim ibn Sa'id ibn Sahm ibn Amr, martyrisé d'une flèche à cet endroit."
  ur: "البلادوری میں ہے: خالد بن الولید عین التمر کے پاس آیا، اس کے قلعے کے خلاف دبایا ہوا تھا جس میں ایک عظیم فارسی فوج تھی؛ اس کے لوگ لڑے پھر خود کو بند کر لیا۔ خالد نے ان کا اس وقت تک محاصرہ کیا جب تک کہ انہوں نے حفاظت کی درخواست نہ کی - اس نے دینے سے انکار کر دیا، زبردستی قلعہ کھول دیا، قتل کر دیا اور اسیر کر لیا، وہاں ایک چرچ میں ایک بینڈ پایا جسے اس نے قید کر لیا تھا۔ ان قیدیوں میں: حمران بن ابان بن خالد التمری، عثمان کا مولا؛ سیرین، محمد بن سیرین کے والد، اور ان کے بھائی یحییٰ، انس اور معبد - سب سے بڑے - انس بن مالک کے موالی؛ ابو عمرہ، شاعر عبداللہ بن عبد العلا کے دادا؛ یسار، سیرت کے مصنف محمد بن اسحاق کے دادا، قیس بن مخرمہ ابن المطلب کے مولا؛ مرہ ابو عبید، محمد بن زید بن عبید ابن مرہ کے دادا اور نفیس بن محمد بن زید، محل کے مالک از الحرۃ؛ اور نصیر، مغرب کے فاتح موسیٰ بن نصیر کے والد، امویوں کے مولا تھے۔ الکلبی نے کہا کہ ابو فروا عبدالرحمٰن بن الاسود اور نصیر بالی کے عراشہ کے دو عرب آدمی تھے جو ابوبکر کے دور میں شام کے جبل الجلیل سے پکڑے گئے تھے۔ نصیر کا نام نصر تھا، گھٹیا - ایک اموی نے اسے آزاد کیا، وہ شام واپس آیا اور موسیٰ اس کے ہاں کفر ماری گاؤں میں پیدا ہوا۔ وہ لنگڑا تھا. یہ بھی کہا جاتا ہے کہ وہ عین العمر کے اسیروں کے بھائی تھے جن کا ولی بنو دبہ کے ساتھ تھا۔ المدائنی: نعیم الاسدی نے ابو فروہ کو خرید لیا، پھر عثمان نے اسے قبر کھودنے کے لیے خرید لیا۔ جب لوگ عثمان پر چڑھے تو وہ ان کے ساتھ ان کے خلاف تھا، عثمان نے کہا کہ 'غلطیوں کو دور کرو' - اس نے جواب دیا 'تم ان میں سب سے پہلے ہو: میں نے تمہیں قبر کھودنے کے لیے صدقہ سے خریدا تھا اور تم نے اسے چھوڑ دیا'۔ پکڑے جانے پر ابو فروا کا نام اس پر موجود کھال کے لباس کے لیے رکھا گیا تھا۔ یہ بھی کہا گیا کہ خالد نے عین التمر کے قلعے کے لوگوں سے صلح کر لی اور یہ قیدی کسی نہری ضلع کے ایک گرجا گھر میں پائے گئے، اور یہ کہ سیرین جرجرایا کے لوگوں میں سے تھا جب اسے لے جایا گیا تھا۔ الشعبی کے ذریعے: خالد نے حیرہ اور عین التمر کے لوگوں کے ساتھ صلح کی اور ابوبکر کو لکھا جس نے منظور کیا - ان پر کچھ، ان کی زمینوں پر کچھ نہیں۔ ہلال بن اقا بن قیس بن البشر النمیری عین التمر میں النمر بن ثابت پر تھے۔ وہ خالد کے لیے اکٹھا ہوا اور اس سے لڑا، مغلوب ہوا، مارا گیا اور سولی پر چڑھایا گیا - الکلبی: یہ خود عقیق بن قیس تھا۔ بشیر بن سعد الانصاری کا زخم دوبارہ لگ گیا اور وہ فوت ہو گئے، عین التمر میں دفن ہوئے، اور ان کے ساتھ عمیر بن ریاض بن محشم بن سعید بن سہم بن عمرو کو دفن کیا گیا، وہیں ایک تیر سے شہید ہو گئے۔"
