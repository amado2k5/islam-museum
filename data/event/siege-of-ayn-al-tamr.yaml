id: event/siege-of-ayn-al-tamr
class: event
kind: siege
label: { ar: "حصار عين التمر وسبي كنيستها", en: "The Siege of Ayn al-Tamr and Its Church Captives" }
summary:
  ar: "عند البلاذري: أتى خالد بن الوليد عين التمر فالصق بحصنها وكانت فيه مسلحة للأعاجم عظيمة فخرج أهل الحصن فقاتلوا ثم لزموا حصنهم فحاصرهم خالد والمسلمون حتى سألوا الأمان فأبى أن يؤمنهم وافتتح الحصن عنوة وقتل وسبى ووجد في كنيسة هناك جماعة سباهم فكان من ذلك السبي حمران بن أبان بن خالد التمري مولى عثمان وسيرين أبو محمد بن سيرين وإخوته يحيى وأنس ومعبد وهو أكبرهم وهم موالي أنس بن مالك وأبو عمرة جد عبد الله بن عبد الأعلى الشاعر ويسار جد محمد بن إسحاق صاحب السيرة وهو مولى قيس بن مخرمة بن المطلب بن عبد مناف ومرة أبو عبيد جد محمد بن زيد بن عبيد بن مرة ونفيس بن محمد بن زيد بن عبيد بن مرة صاحب القصر عند الحرة ونصير أبو موسى بن نصير صاحب المغرب وهو مولى بني أمية؛ وقال ابن الكلبي كان أبو فروة عبد الرحمن بن الأسود ونصير أبو موسى عربيين من أراشة من بلي سبيا أيام أبي بكر من جبل الجليل بالشام وكان اسم نصير نصراً فصُغّر واعتقه بعض بني أمية فرجع إلى الشام وولد له موسى بقرية يقال لها كفر مري وكان أعرج وقد قيل إنهما أخوان من سبي عين التمر وولاؤهما لبني ضبة وقال المدائني يقال إنهما من سبي عين التمر فابتاع ناعم الأسدي أبا فروة ثم ابتاعه منه عثمان وجعله بحفر القبور فلما وثب الناس به كان معهم عليه فقال له رد المظالم فقال له أنت أولاها ابتعتك من مال الصدقة لتحفر القبور فتركت ذلك وأنما لُقّب أبو فروة بفروة كانت عليه حين سبي. وقيل إن خالداً صالح أهل حصن عين التمر وأن هذا السبي وجد في كنيسة ببعض الطسوج وقيل إن سيرين من أهل جرجرايا وإنه كان زائراً لقرابة له فأخذ في الكنيسة معهم. وعن الشعبي: صالح خالد أهل الحيرة وأهل عين التمر وكتب بذلك إلى أبي بكر فأجازه وأن شيئاً عليهم ليس على أراضيهم شيء. وكان هلال بن عقة بن قيس بن البشر النمري على النمر بن ساقط بعين التمر فجمع لخالد وقاتله فظفر به فقتله وصلبه وقال ابن الكلبي كان عليهم يومئذ عقة بن قيس بن البشر بنفسه وانتقض ببشير بن سعد الأنصاري جرحه فمات فدفن بعين التمر ودفن إلى جنبه عمير بن رئاب بن مهشم بن سعيد بن سهم بن عمرو وكان أصابه سهم بعين التمر فاستشهد."
  en: "In al-Baladhuri: Khalid ibn al-Walid came to Ayn al-Tamr, pressed against its fortress holding a great Persian garrison; its people fought then shut themselves in; Khalid besieged them till they asked safety — he refused to grant it, opened the fortress by force, killed and took captive, finding in a church there a band he took captive. Among that captivity: Humran ibn Aban ibn Khalid al-Tamri, Uthman's mawla; Sirin, father of Muhammad ibn Sirin, and his brothers Yahya, Anas and Ma'bad — the eldest — mawali of Anas ibn Malik; Abu Amra, grandfather of the poet Abdallah ibn Abd al-A'la; Yasar, grandfather of Muhammad ibn Ishaq author of the sira, mawla of Qays ibn Makhrama ibn al-Muttalib; Murra abu Ubayd, grandfather of Muhammad ibn Zayd ibn Ubayd ibn Murra and Nafis ibn Muhammad ibn Zayd, lords of the palace by al-Harra; and Nusayr, father of Musa ibn Nusayr the Maghreb's conqueror, mawla of the Umayyads. Al-Kalbi said Abu Farwa Abd al-Rahman ibn al-Aswad and Nusayr were two Arab men of Arasha of Bali captured in Abu Bakr's days from Syria's Jabal al-Jalil; Nusayr's name was Nasr, diminutivized — an Umayyad freed him, he returned to Syria and Musa was born to him at Kafr Mari village; he was lame. It was also said they were brothers of Ayn al-Tamr's captives whose wala' lay with Banu Dubba; al-Mada'ini: Na'im al-Asadi bought Abu Farwa, then Uthman bought him for grave-digging; when the people rose on Uthman he was with them against him, Uthman saying 'repel the wrongs' — he answered 'you are first among them: I bought you from alms-money to dig graves and you abandoned it'; Abu Farwa was named for the fur garment on him when captured. It was also said Khalid made peace with Ayn al-Tamr's fortress people and these captives were found in a church in some canal-district, and that Sirin was of Jarjaraya's people visiting kin when taken. Via al-Sha'bi: Khalid made peace with Hira's and Ayn al-Tamr's people and wrote Abu Bakr who approved — something on them, nothing on their lands. Hilal ibn Uqqa ibn Qays ibn al-Bushr al-Namiri was over al-Namar ibn Saqit at Ayn al-Tamr; he gathered for Khalid and fought him, was overcome, killed and crucified — al-Kalbi: it was Uqqa ibn Qays himself. Bashir ibn Sa'd al-Ansari's wound relapsed and he died, buried at Ayn al-Tamr, and beside him was buried Umayr ibn Ri'ab ibn Muhashshim ibn Sa'id ibn Sahm ibn Amr, martyred by an arrow there."
