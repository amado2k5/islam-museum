id: event/battle-ford-of-sorrows-575
class: event
kind: battle
label: { ar: "وقعة مخاضة الأحزان وتخريب حصن بيت يعقوب", en: "The battle of the Ford of Sorrows (Jacob's Ford, 575 AH)", fr: "La bataille du Gué des Chagrins (Gué de Jacob, 575 H)", es: "La batalla del Vado de los Dolores (Vado de Jacob, 575 AH)", ur: "دکھوں کے فورڈ کی جنگ ⁦(جیکب فورڈ، 575ھ)⁩" }
summary:
  ar: "بنى الفرنج حصناً منيعاً يقارب بانياس عند بيت يعقوب بمكان يعرف بمخاضة الأحزان، فأقام صلاح الدين ببانياس وبث غاراته على بلادهم؛ وفي سنة خمس وسبعين وخمسمائة أرسل جماعة من عسكره مع جالي الميرة فخرج عليهم الفرنج بملكهم، فسار صلاح الدين في العساكر حتى وافاهم وهم في القتال، فقاتل الفرنج قتالاً شديداً وحملوا على المسلمين حملات كادت تزيلهم عن مواقفهم ثم هُزموا وكثر قتلاهم ونجا ملكهم فريداً، وأُسر خلق كثير منهم ابن بيرزان صاحب الرملة ونابلس وهو أعظم الفرنج محلاً بعد الملك، وأخوه صاحب جبيل وصاحب طبرية ومقدم الداوية ومقدم الاسبتارية وصاحب جينين؛ وفدى ابن بيرزان نفسه بمائة ألف وخمسين ألف دينار صورية وإطلاق ألف أسير مسلم، وكان أكثر العمل في ذلك اليوم لعز الدين فرخشاه ابن أخي صلاح الدين وقد ذكر بيتي المتنبي فهان الموت في عينه وألقى بنفسه إليه فكان ذلك سبب الظفر؛ ثم خرب صلاح الدين الحصن {cite:kamil-ibn-al-athir p. 95-96}."
  en: "The Franks built a strong castle by Jacob's Ford near Banias at the 'Ford of Sorrows'; in 575 Saladin, holding Banias, sent out a foraging escort that the Frankish king's whole host fell upon — he raced up, the Muslims were nearly flung from their stands, then broke the Franks: their king escaped alone while Balian 'ibn Barzan' of Ramla and Nablus, his brother of Jubayl, the lord of Tiberias, the masters of the Templars and Hospitallers and the lord of Janin were taken. Ibn Barzan ransomed himself for 150,000 Tyrian dinars and a thousand Muslim captives; the day's work was Izz al-Din Farrukhshah's, who recited al-Mutanabbi's two verses and threw himself on death — then Saladin demolished the fort {cite:kamil-ibn-al-athir p. 95-96}."
  fr: "Les Francs construisirent un fort château près du Gué de Jacob, non loin de Banias, au « Gué des Chagrins » ; en 575, Saladin, tenant Banias, envoya une escorte de fourrageurs sur laquelle tomba toute l'armée du roi franc ; il accourut, les musulmans faillirent être chassés de leurs positions, puis brisèrent les Francs : leur roi s'échappa seul tandis que Balian « ibn Barzan » de Ramla et de Naplouse, son frère de Jubayl, le seigneur de Tibériade, les maîtres des Templiers et des Hospitaliers et le seigneur de Janin furent pris. Ibn Barzan se racheta pour 150 000 dinars tyriens et mille captifs musulmans ; l'œuvre de la journée fut celle d'Izz al-Din Farrukhshah, qui récita deux vers d'al-Mutanabbi et se jeta au-devant de la mort ; puis Saladin démolit le fort {cite:kamil-ibn-al-athir p. 95-96}."
  es: "Los francos construyeron un fuerte castillo junto al vado de Jacob, cerca de Banias, en el «Vado de las Penas». En 575, Saladino, que controlaba Banias, envió una escolta de aprovisionamiento que fue atacada por todo el ejército del rey franco. Este avanzó a toda velocidad, los musulmanes casi fueron arrojados de sus posiciones y luego derrotó a los francos. Su rey escapó solo, mientras que Balian ibn Barzan de Ramla y Nablus, su hermano de Jubayl, el señor de Tiberíades, los jefes de los templarios y los hospitalarios, y el señor de Janin fueron capturados. Ibn Barzan pagó un rescate de 150.000 dinares tirios y mil cautivos musulmanes. La tarea del día fue de Izz al-Din Farrukhshah, quien recitó los dos versos de al-Mutanabbi y se arrojó al vacío. Luego, Saladino demolió la fortaleza {cite:kamil-ibn-al-athir p. 95-96}."
  ur: "فرینکوں نے جیکب کے فورڈ کے ذریعے بنیاس کے قریب 'فورڈ آف سوروز' میں ایک مضبوط قلعہ بنایا۔ 575 میں صلاح الدین نے بنیاس کو پکڑ کر ایک چارہ بھیجا جس پر فرانک کے بادشاہ کا پورا میزبان گر پڑا - وہ اوپر بھاگا، مسلمان تقریباً اپنے موقف سے دور ہوچکے تھے، پھر فرینکوں کو توڑ دیا: ان کا بادشاہ اکیلا بچ گیا جب کہ رملہ کا بالیان 'بن برزان' اور نابلس، اس کا بھائی جبیل اور تیبر کا بھائی تیمپ۔ ہسپتال والوں اور جنین کے رب کو لے جایا گیا۔ ابن برزان نے اپنے آپ کو 150,000 Tyrian دینار اور ایک ہزار مسلمان قیدیوں کے بدلے میں فدیہ دیا تھا۔ دن کا کام عزالدین فرخشاہ کا تھا، جس نے المتنبی کی دو آیتیں پڑھ کر خود کو موت کے گھاٹ اتار دیا - پھر صلاح الدین نے قلعہ کو منہدم کر دیا۔ 95-96}۔"
