id: event/battle-ford-of-sorrows-575
class: event
kind: battle
label: { ar: "وقعة مخاضة الأحزان وتخريب حصن بيت يعقوب", en: "The battle of the Ford of Sorrows (Jacob's Ford, 575 AH)" }
summary:
  ar: "بنى الفرنج حصناً منيعاً يقارب بانياس عند بيت يعقوب بمكان يعرف بمخاضة الأحزان، فأقام صلاح الدين ببانياس وبث غاراته على بلادهم؛ وفي سنة خمس وسبعين وخمسمائة أرسل جماعة من عسكره مع جالي الميرة فخرج عليهم الفرنج بملكهم، فسار صلاح الدين في العساكر حتى وافاهم وهم في القتال، فقاتل الفرنج قتالاً شديداً وحملوا على المسلمين حملات كادت تزيلهم عن مواقفهم ثم هُزموا وكثر قتلاهم ونجا ملكهم فريداً، وأُسر خلق كثير منهم ابن بيرزان صاحب الرملة ونابلس وهو أعظم الفرنج محلاً بعد الملك، وأخوه صاحب جبيل وصاحب طبرية ومقدم الداوية ومقدم الاسبتارية وصاحب جينين؛ وفدى ابن بيرزان نفسه بمائة ألف وخمسين ألف دينار صورية وإطلاق ألف أسير مسلم، وكان أكثر العمل في ذلك اليوم لعز الدين فرخشاه ابن أخي صلاح الدين وقد ذكر بيتي المتنبي فهان الموت في عينه وألقى بنفسه إليه فكان ذلك سبب الظفر؛ ثم خرب صلاح الدين الحصن {cite:kamil-ibn-al-athir p. 95-96}."
  en: "The Franks built a strong castle by Jacob's Ford near Banias at the 'Ford of Sorrows'; in 575 Saladin, holding Banias, sent out a foraging escort that the Frankish king's whole host fell upon — he raced up, the Muslims were nearly flung from their stands, then broke the Franks: their king escaped alone while Balian 'ibn Barzan' of Ramla and Nablus, his brother of Jubayl, the lord of Tiberias, the masters of the Templars and Hospitallers and the lord of Janin were taken. Ibn Barzan ransomed himself for 150,000 Tyrian dinars and a thousand Muslim captives; the day's work was Izz al-Din Farrukhshah's, who recited al-Mutanabbi's two verses and threw himself on death — then Saladin demolished the fort {cite:kamil-ibn-al-athir p. 95-96}."
