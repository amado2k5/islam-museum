label: { ar: "شأن عبد الله بن سوار بالقيقان", en: "Abdallah ibn Sawar at Qiqan", fr: "Abdallah ibn Sawar à Qiqan", es: "Abdallah ibn Sawar en Qiqan", ur: "عبداللہ بن سوار قیقان میں", tr: "Abdullah ibn Suwar'ın El-Kaykan ile ilişkisi", id: "Perselingkuhan Abdullah bin Suwar dengan al-Qayqan" }
summary:
  ar: "ولى عبد الله بن عامر في زمن معاوية عبد الله بن سوار العبدي ثغر الهند ويقال ولاه معاوية من قبله فغزا القيقان فأصاب مغنماً ثم وفد إلى معاوية وأهدى إليه خيلاً قيقانية وأقام عنده ثم رجع إلى القيقان فاستجاشوا الترك فقتلوه وكان سخياً لم يوقد أحد ناراً غير ناره في عسكره فرأى ذات ليلة ناراً فقال ما هذه فقالوا امرأة نفساء يعمل لها خبيص فأمر أن يطعم الناس الخبيص ثلاثاً."
  en: "Abdallah ibn Sawar al-Abdi held the frontier, raided Qiqan, and gifted Mu'awiya Qiqani horses; back there the people summoned the Turks who killed him. So open-handed that none lit a fire but his — once, told a strange fire was a lying-in woman's khabis, he fed the whole camp khabis three days."
  fr: "Abdallah ibn Sawar al-Abdi tint la frontière, mena une expédition à Qiqan et offrit à Mu'awiya des chevaux qiqani ; à son retour, les habitants appelèrent les Turcs, qui le tuèrent. Il était si généreux que nul autre que lui n’allumait de feu au camp : un jour, apprenant qu’un feu inhabituel servait à préparer du khabis pour une femme venant d’accoucher, il en fit nourrir tout le camp pendant trois jours."
  es: "Abdallah ibn Sawar al-Abdi controlaba la frontera, saqueaba Qiqan y obsequiaba caballos a Mu'awiya Qiqani; allí, la gente llamó a los turcos, quienes lo mataron. Era tan generoso que nadie encendía fuego excepto el suyo; una vez, al enterarse de que un fuego extraño era el khabis de una mujer puérpera, alimentó a todo el campamento con khabis durante tres días."
  ur: "عبداللہ بن سوار العبدی نے سرحد پر قبضہ کیا، ققان پر حملہ کیا، اور معاویہ ققانی کو گھوڑے تحفے میں دیے؛ وہاں لوگوں نے ترکوں کو بلایا جنہوں نے اسے قتل کر دیا۔ اس قدر کھلے ہاتھ سے کہ کسی نے آگ نہیں جلائی مگر اس کے — ایک بار، ایک عجیب سی آگ کو ایک لیٹی ہوئی عورت کی خبیث بتائی، اس نے تین دن پورے کیمپ کو کھبی کھلایا۔"
  tr: "Abdullah bin Amer, Muaviye döneminde Abdullah bin Suwar al-Abdi'yi Hindistan sınırına vali olarak atadı. Rivayetlere göre Muaviye de onu kendi adına atadı. Kaykan'a baskın düzenleyerek ganimet elde etti. Sonra Muaviye'ye giderek ona Kaykan atlarını hediye etti ve onunla birlikte kaldı. Daha sonra Kaykan'a geri döndüğünde Türkler onu kışkırttı ve öldürdü. Cömert bir insandı ve kampında kendi ateşinden başka kimse ateş yakmazdı. Bir gece bir ateş gördü ve \"Bu nedir?\" diye sordu. \"Doğum yapan bir kadın kendisine khabi hazırlıyor\" dediler. Bunun üzerine halka üç gün boyunca khabi yedirilmesini emretti."
  id: "Abdullah bin Amer menunjuk Abdullah bin Suwar al-Abdi sebagai gubernur perbatasan India pada masa Muawiyah. Konon Muawiyah menunjuknya atas namanya. Ia menyerbu Qayqan dan memperoleh rampasan perang. Kemudian ia pergi menemui Muawiyah dan memberinya kuda-kuda Qayqan dan tinggal bersamanya. Kemudian ia kembali ke Qayqan, dan mereka menghasut orang-orang Turki dan membunuhnya. Ia adalah orang yang dermawan, dan tidak seorang pun menyalakan api selain apinya di perkemahannya. Suatu malam ia melihat api dan berkata, “Apa ini?” Mereka berkata, “Seorang wanita yang sedang melahirkan sedang menyiapkan khabis untuknya.” Maka ia memerintahkan agar orang-orang diberi makan khabis selama tiga hari."
