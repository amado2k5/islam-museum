label: { ar: "هدم البيعة ببغداد", en: "Demolition of a Church in Baghdad", fr: "La démolition d'une église à Bagdad", es: "Demolición de una iglesia en Bagdad", ur: "بغداد میں ایک چرچ کا انہدام", tr: "Bağdat'taki kilisenin yıkımı", id: "Pembongkaran gereja di Baghdad" }
summary:
  ar: "في ربيع الآخر سنة اثنتين وسبعين ومائتين تجمعت العامة ببغداد فهدمت ما كان بُني من البيعة التي ذُكر خرابهم إياها في السنة الخالية، وانتهبوا مالًا عظيمًا منها لأنهم أنكروا عليهم ركوب الدواب {cite:muntazam-ibn-al-jawzi p. 84-85}."
  en: "In Rabi' II 272 the Baghdad crowd demolished what had been rebuilt of the church whose ruin had been mentioned the year before, and looted great wealth from it — they had resented the riders it drew {cite:muntazam-ibn-al-jawzi p. 84-85}."
  fr: "En Rabi' II 272, la foule de Bagdad démolit ce qui avait été reconstruit de l'église dont la ruine avait été mentionnée l'année précédente, et en pilla de grandes richesses ; elle s'irritait des cavaliers qu'elle attirait {cite:muntazam-ibn-al-jawzi p. 84-85}."
  es: "En Rabi' II 272, la multitud de Bagdad demolió lo que se había reconstruido de la iglesia cuya ruina se había mencionado el año anterior, y saqueó una gran riqueza de ella; habían sentido resentimiento hacia los jinetes que atraía {cite:muntazam-ibn-al-jawzi p. 84-85}."
  ur: "ربیع دوم 272 میں بغداد کے ہجوم نے اس کلیسا کی جو دوبارہ تعمیر کی گئی تھی اس کو گرا دیا جس کی بربادی کا ذکر ایک سال پہلے ہو چکا تھا، اور اس میں سے بہت زیادہ مال لوٹ لیا - انہوں نے سواروں سے ناراضگی ظاہر کی تھی۔ 84-85}۔"
  tr: "272 yılının baharında, halk Bağdat'ta toplandı ve bir önceki yıl yıkacaklarını söyledikleri kilisenin inşa edilmiş kısmını yıktılar ve hayvanlara binmelerine karşı çıktıkları için kiliseden büyük miktarda para yağmaladılar. {cite:muntazam-ibn-al-jawzi s. 84-85}"
  id: "Pada musim semi tahun dua ratus tujuh puluh dua, rakyat jelata berkumpul di Baghdad dan menghancurkan bangunan gereja yang telah mereka sebutkan akan dihancurkan pada tahun sebelumnya, dan mereka menjarah sejumlah besar uang dari gereja tersebut karena mereka keberatan dengan orang-orang yang menunggangi hewan {cite:muntazam-ibn-al-jawzi p. 84-85}."
