id: event/al-hadi-goes-by-madar-and-kharaqa-to-hadaqan-near-sanaa-288
class: event
kind: other
label:
  ar: "الهادي يمر بمدر وخرقة إلى حدقان قرب صنعاء وأسباب تدبير أبي العتاهية، محرم 288هـ"
  en: "Al-Hadi goes by Madar and Kharaqa to Hadaqan near Sana'a and Abu al-Atahiya's reasons, Muharram 288 AH"
  ur: "ہادی مدر اور خرقہ سے ہو کر صنعاء کے قریب حدقان پہنچتے ہیں اور ابو العتاہیہ کی تدبیر کی وجوہ، محرم 288ھ"
  es: "Al-Hadi pasa por Madar y Kharaqa hasta Hadaqan cerca de Sana'a y las razones de Abu al-Atahiya, Muharram 288 AH"
  fr: "Al-Hadi passe par Madar et Kharaqa jusqu'à Hadaqan près de Sana'a et les raisons d'Abu al-Atahiya, Muharram 288 AH"
  tr: "El-Hadi, Madar ve Khurqa'dan geçerek Sana'a yakınlarındaki Hadqan'a ulaşır ve Ebu el-Atahiye'nin bu güzergahı planlamasının nedenleri, Muharrem 288 Hicri."
  id: "Al-Hadi melewati Madar dan Khurqa menuju Hadqan dekat Sana'a dan alasan perencanaan Abu al-'Atahiyah, Muharram 288 H."
summary:
  ar: "ينزل الهادي مدر فينشر عدله، ثم يرحل الأربعاء لاثني عشر يوماً باقية من المحرم إلى خرقة ومنها إلى حدقان قرب صنعاء، ويقول الراوي إن أبا العتاهية تأنى في أمره لما عزم على التسليم وخاف مخالفة بني عمه من آل طريف والعجم من جند جفتم."
  en: "Al-Hadi lodges at Madar and spreads his justice there, then on the Wednesday with twelve days left of Muharram moves to Kharaqa and next to Hadaqan near Sana'a; the narrator says Abu al-Atahiya, resolved to hand over, took care over his affairs, fearing opposition from his Al Tarif kin and the non-Arab troops of Jund Jaftam."
  ur: "ہادی مدر میں اترتے ہیں اور وہاں اپنا عدل پھیلاتے ہیں، پھر محرم کے بارہ دن باقی رہنے پر بدھ کو خرقہ جاتے ہیں اور اگلے دن صنعاء کے قریب حدقان پہنچتے ہیں؛ راوی کہتا ہے کہ ابو العتاہیہ نے تسلیم کا عزم کر کے اپنے معاملات میں احتیاط برتی کیونکہ انہیں اپنے چچازادوں آل طریف اور جند جفتم کے عجمیوں کی مخالفت کا اندیشہ تھا۔"
  es: "Al-Hadi se aloja en Madar y allí imparte justicia, luego, el miércoles, cuando quedan doce días para que termine Muharram, se traslada a Kharaqa y después a Hadaqan, cerca de Sana'a; el narrador dice que Abu al-Atahiya, decidido a entregar el poder, se ocupó de sus asuntos, temiendo la oposición de sus parientes Al Tarif y de las tropas no árabes de Jund Jaftam."
  fr: "Al-Hadi s'installe à Madar et y répand sa justice, puis, le mercredi qui reste douze jours avant Muharram, se déplace à Kharaqa et ensuite à Hadaqan, près de Sanaa; le narrateur dit qu'Abu al-Atahiya, résolu à lui céder le pouvoir, a pris soin de ses affaires, craignant l'opposition de sa famille Al Tarif et des troupes non arabes de Jund Jaftam."
  tr: "El-Hadi, Madar'a iner ve adaletini yayar, ardından Muharrem ayının bitimine on iki gün kala Çarşamba günü Hurka'ya, oradan da Sana'a yakınlarındaki Hadkan'a gider. Rivayet eden kişi, Ebu el-Atahiya'nın teslim olmaya karar verdiğinde ve Tarif ailesinden kuzenlerinin ve Yaftam ordusundan Arap olmayanların muhalefetinden korktuğunda, bu konuda sabırlı davrandığını söyler."
  id: "Al-Hadi turun ke Madar dan menyebarkan keadilannya, kemudian ia berangkat pada hari Rabu, dua belas hari tersisa di bulan Muharram, ke Khurqa dan dari sana ke Hadqan dekat Sana'a. Perawi mengatakan bahwa Abu al-Atahiya bersabar dalam urusannya ketika ia memutuskan untuk menyerah dan takut akan penentangan dari sepupu-sepupunya dari keluarga Tarif dan orang-orang non-Arab dari pasukan Jaftam."
