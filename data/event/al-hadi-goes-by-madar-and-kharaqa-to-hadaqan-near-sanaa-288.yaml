id: event/al-hadi-goes-by-madar-and-kharaqa-to-hadaqan-near-sanaa-288
class: event
kind: other
label:
  ar: "الهادي يمر بمدر وخرقة إلى حدقان قرب صنعاء وأسباب تدبير أبي العتاهية، محرم 288هـ"
  en: "Al-Hadi goes by Madar and Kharaqa to Hadaqan near Sana'a and Abu al-Atahiya's reasons, Muharram 288 AH"
  ur: "ہادی مدر اور خرقہ سے ہو کر صنعاء کے قریب حدقان پہنچتے ہیں اور ابو العتاہیہ کی تدبیر کی وجوہ، محرم 288ھ"
summary:
  ar: "ينزل الهادي مدر فينشر عدله، ثم يرحل الأربعاء لاثني عشر يوماً باقية من المحرم إلى خرقة ومنها إلى حدقان قرب صنعاء، ويقول الراوي إن أبا العتاهية تأنى في أمره لما عزم على التسليم وخاف مخالفة بني عمه من آل طريف والعجم من جند جفتم."
  en: "Al-Hadi lodges at Madar and spreads his justice there, then on the Wednesday with twelve days left of Muharram moves to Kharaqa and next to Hadaqan near Sana'a; the narrator says Abu al-Atahiya, resolved to hand over, took care over his affairs, fearing opposition from his Al Tarif kin and the non-Arab troops of Jund Jaftam."
  ur: "ہادی مدر میں اترتے ہیں اور وہاں اپنا عدل پھیلاتے ہیں، پھر محرم کے بارہ دن باقی رہنے پر بدھ کو خرقہ جاتے ہیں اور اگلے دن صنعاء کے قریب حدقان پہنچتے ہیں؛ راوی کہتا ہے کہ ابو العتاہیہ نے تسلیم کا عزم کر کے اپنے معاملات میں احتیاط برتی کیونکہ انہیں اپنے چچازادوں آل طریف اور جند جفتم کے عجمیوں کی مخالفت کا اندیشہ تھا۔"
