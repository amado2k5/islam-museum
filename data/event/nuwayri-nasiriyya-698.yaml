label:
  ar: "النويري في ديوان الخاص وساكناً بالمدرسة الناصرية، ٦٩٨هـ/١٢٩٨م"
  en: "Al-Nuwayri joins the diwan al-khass and resides at the Nasiriyya, 698/1298"
  ur: "نويری دیوان خاص میں اور ناصریہ مدرسہ میں ساکن، 698ھ/1298ء"
  es: "Al-Nuwayri se une al diwan al-khass y reside en Nasiriyya, 698/1298"
  fr: "Al-Nuwayri rejoint le diwan al-khass et réside à Nasiriyya, 698/1298"
  tr: "Al-Nuwayri özel ofisteydi ve 698 H./1298'de Nasiriyah Okulu'nda ikamet ediyordu."
  id: "Al-Nuwayri pernah berada di kantor swasta dan berdomisili di Madrasah Nasiriyah, tahun 698 H/1298 M."
summary:
  ar: "يذكر النويري لأول مرة بعد تدوينه مولده، في أحداث سنة ٦٩٨هـ/١٢٩٨م، إلحاقه بديوان الخاص بالقاهرة وإقامته بالمدرسة الناصرية التي افتتحها الملك العادل كتبغا ثم استملكها الناصر محمد بن قلاوون لدى عودته إلى الملك تلك السنة، ويطيل في وصفها ويورد نص وقفيتها، ويجهر بانتقاد القائم عليها الطواشي شجاع الدين عنبر اللالا متهماً إياه بالاختلاس ومطالباً إياه برد حقوق أهل المدرسة {cite:encyclopaedia-of-islam-2 vol. 8 p. 157}."
  en: "For the first time after recording his own birth, al-Nuwayri mentions — under the events of 698/1298 — his recruitment to the diwan al-khass at Cairo and his residence at the Nasiriyya madrasa, inaugurated by al-Malik al-Adil Kitbugha and acquired by al-Nasir Muhammad ibn Qalawun on his return to power that year; he describes the institution at length, reproduces the text of its waqf, and openly criticises its administrator, the tawashi Shuja' al-Din 'Anbar al-Lala, accusing him of embezzlement and demanding the staff's due pay {cite:encyclopaedia-of-islam-2 vol. 8 p. 157}."
  ur: "اپنی پیدائش درج کرنے کے بعد پہلی بار نويری — 698ھ/1298ء کے واقعات کے تحت — قاہرہ کے دیوان خاص میں ان کے بھرتی ہونے اور ناصریہ مدرسہ میں رہائش کا ذکر کرتے ہیں؛ یہ مدرسہ الملک العادل کتبغا نے قائم کیا اور الناصر محمد بن قلاوون نے اسی سال اقتدار پر واپسی پر حاصل کیا؛ وہ اس ادارے کی تفصیل بیان کرتے، وقف نامہ نقل کرتے اور اس کے منتظم طواشی شجاع الدین عنبر لالا پر کھلم کھلا خیانت کا الزام لگا کر عملے کی تنخواہ کا مطالبہ کرتے ہیں {cite:encyclopaedia-of-islam-2 vol. 8 p. 157}۔"
  es: "Por primera vez después de registrar su propio nacimiento, al-Nuwayri menciona —bajo los eventos de 698/1298— su reclutamiento para el diwan al-khass en El Cairo y su residencia en la madrasa Nasiriyya, inaugurada por al-Malik al-Adil Kitbugha y adquirida por al-Nasir Muhammad ibn Qalawun a su regreso al poder ese año; describe la institución extensamente, reproduce el texto de su waqf y critica abiertamente a su administrador, el tawashi Shuja' al-Din 'Anbar al-Lala, acusándolo de malversación y exigiendo el pago debido al personal {cite:encyclopaedia-of-islam-2 vol. 8 p. 157}."
  fr: "Pour la première fois après avoir relaté sa propre naissance, al-Nuwayri mentionne — dans la section consacrée aux événements de 698/1298 — son recrutement au diwan al-khass du Caire et sa résidence à la madrasa Nasiriyya, inaugurée par al-Malik al-Adil Kitbugha et acquise par al-Nasir Muhammad ibn Qalawun lors de son retour au pouvoir cette année-là; il décrit longuement l'institution, reproduit le texte de son waqf et critique ouvertement son administrateur, le tawashi Shuja' al-Din 'Anbar al-Lala, l'accusant de détournement de fonds et exigeant le paiement dû au personnel {cite:encyclopaedia-of-islam-2 vol. 8 p. 157}."
  tr: "El-Nuveyri, doğumunu kaydettikten sonra ilk kez Hicri 698/Miladi 1298 yılındaki olaylar arasında, Kahire'deki özel bir ofise katılmasını ve Kral El-Adil Kitbuga tarafından açılan ve daha sonra o yıl krallığa geri dönen El-Nasir Muhammed İbn Kalavun tarafından satın alınan El-Nasiriye Okulu'nda ikamet etmesini anlatır. Okulun tanımını ayrıntılı olarak yapar, vakfının metnini de ekler ve okulun sorumlusu hadım Şuca' Din Enber El-Lala'yı açıkça eleştirerek, zimmetine para geçirmekle suçlar ve okul mensuplarının haklarını iade etmesini talep eder. {Kaynak: İslam Ansiklopedisi 2, cilt 8, s. 157}"
  id: "Al-Nuwayri menyebutkan untuk pertama kalinya, setelah mencatat kelahirannya, dalam peristiwa tahun 698 H/1298 M, tentang bergabungnya beliau ke kantor pribadi di Kairo dan tempat tinggalnya di Sekolah Al-Nasiriyah, yang dibuka oleh Raja Al-Adil Kitbugha dan kemudian diambil alih oleh Al-Nasir Muhammad Ibn Qalawun setelah kembali menjadi raja pada tahun itu. Beliau menguraikan deskripsi sekolah tersebut dan menyertakan teks wakafnya, dan secara terbuka mengkritik orang yang bertanggung jawab atas sekolah tersebut, yaitu kasim Shuja’ Al-Din Anbar Al-Lala, menuduhnya melakukan penggelapan dan menuntut agar ia mengembalikan hak-hak para penghuni sekolah tersebut {cite:encyclopaedia-of-islam-2 vol. 8 p. 157}."
