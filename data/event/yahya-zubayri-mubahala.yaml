label: { ar: "مباهلة يحيى العلوي وعبد الله بن مصعب", en: "The Mutual Imprecation of Yahya al-Alawi and Abdallah ibn Mus'ab", es: "La imprecación mutua de Yahya al-Alawi y Abdallah ibn Mus'ab", fr: "L'imprécation mutuelle de Yahya al-Alawi et d'Abdallah ibn Mus'ab", ur: "یحییٰ علوی اور عبداللہ ابن مصعب کی باہمی تعبیر" }
summary:
  ar: "في سنة خمس وسبعين ومئة افترى عبد الله بن مصعب الزبيري على يحيى بن عبد الله بن حسن العلوي أنه طلب إليه أن يخرج معه على الرشيد فباهله يحيى بحضرة الرشيد وشبك يده في يده وقال قل اللهم إن كنت تعلم أن يحيى لم يدعني إلى الخلاف والخروج على أمير المؤمنين هذا فكلني إلى حولي وقوتي وأسحتني بعذاب من عندك آمين رب العالمين فتلجلج الزبيري وقالها ثم قال يحيى مثل ذلك وقاما فمات الزبيري ليومه {cite:tarikh-khulafa-minhaj-1434 p. 460-461}."
  en: "In year 175 Abdallah ibn Mus'ab al-Zubayri slandered Yahya ibn Abdallah the Alid before al-Rashid, claiming Yahya had invited him to revolt; Yahya challenged him to mutual imprecation in the caliph's presence, entwining hands: 'Say — O God, if You know Yahya did not call me to rebel against this Commander of the Faithful, abandon me to my own power and scourge me with Your punishment.' The Zubayrid faltered, spoke it, Yahya spoke likewise — and the Zubayrid died that very day {cite:tarikh-khulafa-minhaj-1434 p. 460-461}."
  es: "En el año 175, Abdallah ibn Mus'ab al-Zubayri calumnió a Yahya ibn Abdallah el Alid ante al-Rashid, alegando que Yahya lo había invitado a la rebelión; Yahya lo desafió a una imprecación mutua en presencia del califa, entrelazando sus manos: «Di: Oh Dios, si sabes que Yahya no me llamó a rebelarme contra este Comandante de los Creyentes, abandóname a mi propia fuerza y azótame con Tu castigo». El Zubayrid vaciló, lo dijo, Yahya dijo lo mismo, y el Zubayrid murió ese mismo día {cite:tarikh-khulafa-minhaj-1434 p. 460-461}."
  fr: "En l'an 175, Abdallah ibn Mus'ab al-Zubayri calomnia Yahya ibn Abdallah l'Alid devant al-Rashid, prétendant que Yahya l'avait incité à la révolte; Yahya le provoqua en duel devant le calife, leurs mains s'entrelacant: « Dis: Ô Dieu, si Tu sais que Yahya ne m'a pas appelé à me rebeller contre ce Commandeur des Croyants, abandonne-moi à mon propre sort et châtie-moi. » Le Zubayrid hésita, prononça ces mots, Yahya fit de même – et le Zubayrid mourut ce jour-là même {cite:tarikh-khulafa-minhaj-1434 p. 460-461}."
  ur: "175 میں عبداللہ ابن مصعب الزبیری نے الرشید کے سامنے یحییٰ بن عبداللہ الد کو طعنہ دیا، یہ دعویٰ کیا کہ یحییٰ نے اسے بغاوت کی دعوت دی تھی۔ یحییٰ نے خلیفہ کی موجودگی میں ہاتھ جوڑتے ہوئے اسے چیلنج کیا: 'کہو - اے خدا، اگر آپ جانتے ہیں کہ یحییٰ نے مجھے اس وفادار کمانڈر کے خلاف بغاوت کرنے کے لیے نہیں بلایا ہے، تو مجھے میرے اختیار پر چھوڑ دو اور اپنی سزا سے مجھے کوڑے لگاؤ'۔ زبیرید ہڑبڑا کر بولا، یحییٰ نے بھی اسی طرح کہا - اور زبیرید اسی دن مر گیا 460-461}۔"
