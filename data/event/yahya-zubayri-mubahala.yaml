label: { ar: "مباهلة يحيى العلوي وعبد الله بن مصعب" }
summary:
  ar: "في سنة خمس وسبعين ومئة افترى عبد الله بن مصعب الزبيري على يحيى بن عبد الله بن حسن العلوي أنه طلب إليه أن يخرج معه على الرشيد فباهله يحيى بحضرة الرشيد وشبك يده في يده وقال قل اللهم إن كنت تعلم أن يحيى لم يدعني إلى الخلاف والخروج على أمير المؤمنين هذا فكلني إلى حولي وقوتي وأسحتني بعذاب من عندك آمين رب العالمين فتلجلج الزبيري وقالها ثم قال يحيى مثل ذلك وقاما فمات الزبيري ليومه {cite:tarikh-khulafa-minhaj-1434 p. 460-461}."
  en: "In year 175 Abdallah ibn Mus'ab al-Zubayri slandered Yahya ibn Abdallah the Alid before al-Rashid, claiming Yahya had invited him to revolt; Yahya challenged him to mutual imprecation in the caliph's presence, entwining hands: 'Say — O God, if You know Yahya did not call me to rebel against this Commander of the Faithful, abandon me to my own power and scourge me with Your punishment.' The Zubayrid faltered, spoke it, Yahya spoke likewise — and the Zubayrid died that very day {cite:tarikh-khulafa-minhaj-1434 p. 460-461}."
