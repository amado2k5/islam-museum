label: { ar: "ابن سينا وزيرًا لشمس الدولة بهمذان", en: "Ibn Sina becomes vizier to Shams al-Dawla at Hamadan", ur: "ہمدان میں ابن سینا شمس الدولہ کے وزیر", es: "Ibn Sina se convierte en visir de Shams al-Dawla en Hamadan", fr: "Ibn Sina devient vizir de Shams al-Dawla à Hamadan", tr: "İbn Sina Hemedan'da Şemseddevle'nin veziriydi", id: "Ibnu Sina adalah menteri Syams al-Dawla di Hamadan" }
summary:
  ar: "سنة 1015م كان ابن سينا في همذان، ثم تحوّل إلى خدمة الأمير البويهي شمس الدولة فجعله وزيره، وبقي وزيرًا حتى وفاة شمس الدولة سنة 1021م. {cite:wikipedia-avicenna-en}"
  en: "In 1015, at Hamadan, Ibn Sina passed into the service of the Buyid amir Shams al-Dawla, who made him his vizier; he held the post until Shams al-Dawla died in 1021."
  ur: "1015ء میں ہمدان میں ابن سینا آل بویہ کے امیر شمس الدولہ کی خدمت میں آئے جنہوں نے انہیں وزیر بنایا؛ وہ 1021ء میں شمس الدولہ کی وفات تک اس عہدے پر رہے۔"
  es: "En 1015, en Hamadán, Ibn Sina pasó a estar al servicio del emir buyí Shams al-Dawla, quien lo nombró su visir; ocupó el cargo hasta que Shams al-Dawla murió en 1021."
  fr: "En 1015, à Hamadan, Ibn Sina entra au service de l'émir bouyide Shams al-Dawla, qui le nomma son vizir; il occupa ce poste jusqu'à la mort de Shams al-Dawla en 1021."
  tr: "İbn Sina, 1015 yılında Hamadan'daydı ve daha sonra Buyid prensi Şems el-Davla'nın hizmetine girdi ve onun veziri oldu. Şems el-Davla'nın 1021 yılında ölümüne kadar vezir olarak görev yaptı. {cite:wikipedia-avicenna-en}"
  id: "Pada tahun 1015 M, Ibnu Sina berada di Hamadan, kemudian ia memasuki dinas pangeran Buyid, Shams al-Dawla, yang menjadikannya wazir. Ia tetap menjadi wazir hingga kematian Shams al-Dawla pada tahun 1021 M. {cite:wikipedia-avicenna-en}"
