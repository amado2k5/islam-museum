label: { ar: "وقعة حطين", en: "Battle of Hattin" }
summary:
  ar: "وقعة حطين معركة جرت سنة 583هـ/1187م بين قوات صلاح الدين والجيوش المجتمعة للدول الصليبية، عند قرون حطين على المرتفعات غرب طبرية. وتصفها دائرة المعارف الإسلامية بأنها الوقعة التي حطمت قوة الصليبيين، وتذكر أن بعض الجنود الفرنج قُتلوا وقد أنهكهم الحر والعطش وفرّ آخرون، وأن الباقين انسحبوا إلى القمة الشرقية. وتؤرخها مقالة حطين بيوم 5 تموز 1187م، ومقالة صلاح الدين بالسبت 24 ربيع الآخر 583هـ الموافق 4 تموز 1187م. وتلاها استسلام مدن وحصون كثيرة ثم بيت المقدس في 27 رجب 583هـ."
  en: "The battle of Hattin was fought in 583/1187 between the forces of Salah al-Din and the combined armies of the Crusader states, at the Horns of Hattin on the heights west of Tiberias. The Encyclopaedia of Islam describes it as the battle that destroyed the power of the Crusaders: some of the Frankish troops, tormented by heat and thirst, were cut down and others fled, and the rest withdrew to the eastern summit. The article on Hattin dates it to 5 July 1187 and the article on Salah al-Din to Saturday 24 Rabi' II 583, equal to 4 July 1187. Many towns and strongholds then surrendered, and Jerusalem on 27 Rajab 583."
  ur: "معرکۂ حطین 583ھ/1187ء میں صلاح الدین کی فوجوں اور صلیبی ریاستوں کی متحدہ فوجوں کے درمیان طبریہ کے مغرب کی بلندیوں پر قرون حطین پر لڑا گیا۔ انسائیکلوپیڈیا آف اسلام اسے وہ معرکہ قرار دیتا ہے جس نے صلیبیوں کی طاقت توڑ دی؛ گرمی اور پیاس سے نڈھال کچھ فرنگی سپاہی مارے گئے، کچھ بھاگ گئے، اور باقی مشرقی چوٹی کی طرف ہٹ گئے۔ حطین کا مضمون اسے 5 جولائی 1187ء اور صلاح الدین کا مضمون ہفتہ 24 ربیع الثانی 583ھ، یعنی 4 جولائی 1187ء کا بتاتا ہے۔ اس کے بعد بہت سے شہر اور قلعے اور پھر 27 رجب 583ھ کو بیت المقدس نے ہتھیار ڈال دیے۔"
