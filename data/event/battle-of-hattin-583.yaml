label: { ar: "وقعة حطين", en: "Battle of Hattin" }
summary:
  ar: "أصبح صلاح الدين والمسلمون يوم السبت لخمس بقين من ربيع الآخر سنة ثلاث وثمانين وخمسمائة فاقتتلوا بالفرنج وقد اشتد بهم العطش وانخذلوا، ورمى جاليشية المسلمين النشاب كالجراد المنتشر فقتل من خيول الفرنج كثيراً، وكان الفرنج يسيرون نحو طبرية ليردوا الماء فصدّهم صلاح الدين ووقف بالعسكر في وجوههم وطاف بنفسه على المسلمين يحرضهم، وحمل مملوك من مماليكه الصبيان حملة منكرة فقاتل حتى قتل فحمل المسلمون حملة منكرة ضعضعوا بها الفرنج، وألقى بعض المتطوعة ناراً في الأرض وكان الحشيش كثيراً فاحترق وحملت الريح حر النار والدخان إليهم فاجتمع عليهم العطش وحر الزمان وحر النار والقتال، وأحاط بهم المسلمون إحاطة الدائرة بقطرها فارتفع من بقي منهم إلى تل بناحية حطين فلم يتمكنوا من نصب خيمة غير خيمة ملكهم، وأخذ المسلمون صليبهم الأعظم الذي يسمونه صليب الصلبوت ويذكرون أن فيه قطعة من الخشبة التي صلب عليها المسيح بزعمهم؛ ويحكي الملك الأفضل ابن صلاح الدين أنه كان إلى جانب أبيه في أول مصاف شاهده، فحمل الفرنج حملات حتى ألحقوا المسلمين به فيعلوه كآبة ويمسك بلحيته ويصيح كذب الشيطان، ويصيح الأفضل فرحاً هزمناهم فيلتفت إليه أبوه ويقول اسكت ما نهزمهم حتى تسقط تلك الخيمة، فسقطت الخيمة فنزل السلطان وسجد شكراً وبكى من فرحه، وأسر الملك وأخوه والبرنس أرناط صاحب الكرك وصاحب جبيل ومقدم الداوية وجماعة من الإسبتارية، فكان من يرى القتلى لا يظن أنهم أسروا أحداً ومن يرى الأسرى لا يظن أنهم قتلوا أحداً، وسقى صلاح الدين الملك ماء مثلجاً فأعطى فضله أرناط فقال إن هذا لم يشرب الماء بإذني فينال أماني، ثم قرعه بذنوبه وقام إليه فضرب رقبته وقال كنت نذرت دفعتين أن أقتله إن ظفرت به إحداهما لما أراد المسير إلى مكة والمدينة والثانية لما أخذ القفل غدراً، وأمر بجمع أسرى الداوية والإسبتارية فأحضر عنده مائتا أسير فضربت أعناقهم لأنهم أشد شوكة من جميع الفرنج، وقال ابن الأثير إنه اجتاز بموضع الوقعة بعدها بنحو سنة فرأى الأرض ملأى من عظامهم {cite:kamil-ibn-al-athir p. 146-149}."
  en: "On Saturday, five days before the end of Rabi' al-Akhir in 583 AH, Saladin and the Muslims engaged the Franks, who were tormented by thirst and had lost heart. The Muslim vanguard shot arrows like locusts spreading across the ground and killed many of the Franks' horses. The Franks were heading for Tiberias to reach water, but Saladin blocked their path, drew up his army against them, and rode among the Muslims urging them on. One of his young Mamluks charged fiercely and fought until he was killed; then the Muslims launched a violent charge that broke the Franks. Some volunteers set fire to the dry grass, which was abundant; the fire burned, and the wind carried its heat and smoke toward the Franks, so that thirst, the heat of the day, the fire and the fighting came upon them together. The Muslims surrounded them like a circle around its diameter, and those who remained climbed a hill near Hattin, where they could pitch no tent except their king's. The Muslims took their great cross, which the Franks call the Cross of the Crucifixion and which they believe contains a piece of the wood on which Christ was crucified. Al-Malik al-Afdal, Saladin's son, recounts that he stood beside his father at the first clash: when the Franks charged repeatedly until they drove the Muslims back toward the tent, his father grew downcast, gripped his beard and cried, 'The Devil lied!'; al-Afdal, joyful, cried, 'We have defeated them!' His father turned to him and said, 'Be quiet; we will not defeat them until that tent falls.' When the tent fell, the sultan dismounted, prostrated in thanks and wept for joy. The king and his brother were captured, along with Prince Arnat, lord of Karak, the lord of Jubayl, the Grand Master of the Templars and a group of Hospitallers. Whoever looked at the dead would not think any prisoners had been taken, and whoever looked at the captives would not think anyone had been killed. Saladin gave the king iced water, and the king gave what was left of it to Arnat. Saladin said, 'He did not drink the water with my permission, so he will not obtain what he wishes'; he rebuked him for his wrongs, rose, and struck his neck, saying that he had twice vowed to kill him if he ever prevailed over him: once when Arnat meant to march on Mecca and Medina, and once when he seized the caravan treacherously. He ordered the Templar and Hospitaller prisoners gathered; two hundred were brought before him and their necks were struck, because they were fiercer than all the other Franks. Ibn al-Athir says that about a year later he passed the site of the battle and saw the ground full of their bones {cite:kamil-ibn-al-athir p. 146-149}."
