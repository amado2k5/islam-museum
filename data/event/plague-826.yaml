  id: "Dalam Shadharat al-Dhahab, pada tahun 826, terjadi wabah penyakit di Levant, sedemikian hebatnya sehingga dikatakan bahwa jumlah total orang yang meninggal dalam beberapa hari melebihi lima puluh ribu. Wabah besar juga terjadi di Damietta. {cite:shadharat-dhahab p. 186}."
