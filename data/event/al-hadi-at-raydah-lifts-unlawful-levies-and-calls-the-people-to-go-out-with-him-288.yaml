id: event/al-hadi-at-raydah-lifts-unlawful-levies-and-calls-the-people-to-go-out-with-him-288
class: event
kind: other
label:
  ar: "الهادي بريدة يسقط المكوس غير الحلال ويدعو الناس إلى الخروج معه، محرم 288هـ"
  en: "Al-Hadi at Raydah lifts unlawful levies and calls the people to go out with him, Muharram 288 AH"
  ur: "ہادی ریدہ میں ناجائز محصولات ختم کرتے ہیں اور لوگوں کو ساتھ نکلنے کی دعوت دیتے ہیں، محرم 288ھ"
  es: "Al-Hadi en Raydah levanta los impuestos ilegales y llama al pueblo a salir con él, Muharram 288 AH"
  fr: "Al-Hadi, à Raydah, lève les taxes illégales et appelle le peuple à le suivre, Muharram 288 AH"
  tr: "El-Hadi Buraydah, haram vergileri kaldırarak insanları kendisine katılmaya çağırdı, Muharrem 288 Hicri"
  id: "Al-Hadi Buraydah menghapuskan pajak-pajak haram dan menyeru orang-orang untuk bergabung dengannya, Muharram 288 H."
summary:
  ar: "يصل الهادي ريدة فيجتمع إليه أهلها ويفرحون بقدومه، فيرفع عنهم الضرائب التي لا تحل ويأمر الناس بالأهبة للخروج معه إلى خرفة، ويظهر أن أبا العتاهية سلم إليه البون والمشرق وما كان في يد الدعام، ويقول الراوي إن بينهما أمراً لم يطلع عليه أحد."
  en: "Al-Hadi reaches Raydah, whose people gather and rejoice at his coming; he lifts the levies that are not lawful and tells the people to prepare to go out with him to Kharfa, announcing that Abu al-Atahiya had handed him al-Bawn and al-Mashriq and what al-Da'am had held, the narrator adding that there was a matter between them no one knew of."
  ur: "ہادی ریدہ پہنچتے ہیں جہاں کے لوگ جمع ہو کر ان کی آمد پر خوش ہوتے ہیں؛ وہ ناجائز محصولات ختم کرتے ہیں اور لوگوں کو خرفہ کی طرف ساتھ نکلنے کی تیاری کا حکم دیتے ہیں، اعلان کرتے ہیں کہ ابو العتاہیہ نے البون اور المشرق اور دعام کے ہاتھ کا علاقہ ان کے سپرد کر دیا ہے، اور راوی کہتا ہے کہ ان کے بیچ ایک ایسی بات تھی جس کی خبر کسی کو نہ تھی۔"
  es: "Al-Hadi llega a Raydah, cuya gente se reúne y se regocija con su llegada; levanta los impuestos que no son lícitos y les dice a las personas que se preparen para salir con él a Kharfa, anunciando que Abu al-Atahiya le había entregado al-Bawn y al-Mashriq y lo que al-Da'am había tenido, y el narrador añade que había un asunto entre ellos que nadie conocía."
  fr: "Al-Hadi arrive à Raydah, dont les habitants se rassemblent et se réjouissent de son arrivée; il lève les impôts illégaux et dit aux gens de se préparer à partir avec lui pour Kharfa, annonçant qu'Abu al-Atahiya lui avait remis al-Bawn et al-Mashriq ainsi que ce qu'al-Da'am détenait, le narrateur ajoutant qu'il y avait un différend entre eux que personne ne connaissait."
  tr: "El-Hadi, Rıza'ya varır ve halkı onun etrafında toplanıp gelişine sevinir. Onlardan haram olan vergileri kaldırır ve halka kendisiyle birlikte Hurfa'ya gitmek için hazırlık yapmalarını emreder. Görünüşe göre Ebu el-Atahiya, el-Bawn ve el-Meşrik'i ve el-Da'am'ın elinde bulunanları ona teslim etmiştir. Rivayet eden, aralarında kimsenin görmediği bir mesele olduğunu söyler."
  id: "Al-Hadi tiba di Rida, dan penduduknya berkumpul di sekelilingnya dan bersukacita atas kedatangannya. Ia menghapuskan pajak-pajak yang tidak diperbolehkan bagi mereka dan memerintahkan orang-orang untuk bersiap-siap pergi bersamanya ke Khurfa. Tampaknya Abu al-Atahiya menyerahkan kepadanya al-Bawn dan al-Mashriq serta apa yang berada di tangan al-Da’am. Perawi mengatakan bahwa ada suatu perkara di antara mereka yang belum pernah dilihat siapa pun."
