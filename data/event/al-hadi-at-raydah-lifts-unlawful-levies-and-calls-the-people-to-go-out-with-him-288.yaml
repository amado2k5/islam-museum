id: event/al-hadi-at-raydah-lifts-unlawful-levies-and-calls-the-people-to-go-out-with-him-288
class: event
kind: other
label:
  ar: "الهادي بريدة يسقط المكوس غير الحلال ويدعو الناس إلى الخروج معه، محرم 288هـ"
  en: "Al-Hadi at Raydah lifts unlawful levies and calls the people to go out with him, Muharram 288 AH"
  ur: "ہادی ریدہ میں ناجائز محصولات ختم کرتے ہیں اور لوگوں کو ساتھ نکلنے کی دعوت دیتے ہیں، محرم 288ھ"
summary:
  ar: "يصل الهادي ريدة فيجتمع إليه أهلها ويفرحون بقدومه، فيرفع عنهم الضرائب التي لا تحل ويأمر الناس بالأهبة للخروج معه إلى خرفة، ويظهر أن أبا العتاهية سلم إليه البون والمشرق وما كان في يد الدعام، ويقول الراوي إن بينهما أمراً لم يطلع عليه أحد."
  en: "Al-Hadi reaches Raydah, whose people gather and rejoice at his coming; he lifts the levies that are not lawful and tells the people to prepare to go out with him to Kharfa, announcing that Abu al-Atahiya had handed him al-Bawn and al-Mashriq and what al-Da'am had held, the narrator adding that there was a matter between them no one knew of."
  ur: "ہادی ریدہ پہنچتے ہیں جہاں کے لوگ جمع ہو کر ان کی آمد پر خوش ہوتے ہیں؛ وہ ناجائز محصولات ختم کرتے ہیں اور لوگوں کو خرفہ کی طرف ساتھ نکلنے کی تیاری کا حکم دیتے ہیں، اعلان کرتے ہیں کہ ابو العتاہیہ نے البون اور المشرق اور دعام کے ہاتھ کا علاقہ ان کے سپرد کر دیا ہے، اور راوی کہتا ہے کہ ان کے بیچ ایک ایسی بات تھی جس کی خبر کسی کو نہ تھی۔"
