label: { ar: "فتح اللاذقية", en: "The Conquest of al-Ladhiqiyya", es: "La conquista de al-Ladhiqiyya", fr: "La conquête d'al-Ladhiqiyya", ur: "فتح لذیقیہ" }
summary:
  ar: "عند البلاذري: استخلف أبو عبيدة عبادة بن الصامت الأنصاري على حمص فأتى اللاذقية فقاتله أهلها وكان بها باب عظيم لا يفتحه الجماعة من الناس، فلما رأى صعوبة مرامها عسكر على بُعد من المدينة ثم أمر أن تُحفر حفائر كالأسراب يستتر الرجل وفرسه في الواحدة منها فاجتهد المسلمون في خفرها حتى فرغوا منها ثم أظهروا القفول إلى حمص فلما جن عليهم الليل عادوا إلى معسكرهم وحفائرهم وأهل اللاذقية يغدون يرون أنهم قد انصرفوا فلما أصبحوا فتحوا بابهم وأخرجوا سرحهم فلم يرعهم إلا تصبيح المسلمين إياهم ودخولهم من باب المدينة ففتحت عنوة ودخل عبادة الحصن ثم علا حائطه فكبر عليه وهرب قوم من نصارى اللاذقية إلى اليسيد ثم طلبوا الأمان على أن يتراجعوا إلى أرضهم فقوطعوا على خراج يؤدونه قلّوا أو كثروا وتركت لهم كنيستهم وبنى المسلمون باللاذقية مسجداً جامعاً بأمر عبادة ثم وُسّع بعد؛ وكانت الروم أغارت في البحر على ساحل اللاذقية فهدمت مدينتها وسبت أهلها في خلافة عمر بن عبد العزيز سنة 100 فأمر ببنائها وتحصينها ووجه إلى الطاغية في فداء من أُسر من المسلمين فلم يتم ذلك حتى توفي عمر سنة 101 فأتم المدينة وشحنها يزيد بن عبد الملك؛ وفتح عبادة والمسلمون معه أيضاً أنطرطوس وكان حصناً فجلا عنه أهله فبناه معاوية ومصّره وأقطع بها القطائع وكذلك فعل بمرقية وبلنياس، وفتحوا مدينة تعرف ببلدة على فرسخين من جبلة عنوة فخربت وجلا عنها أهلها فأنشأ معاوية جبلة وشحنها."
  en: "In al-Baladhuri: Abu Ubayda left Ubada ibn al-Samit al-Ansari over Hims, and he came to al-Ladhiqiyya whose people fought him — it had a great gate a host of men could not open; seeing the difficulty he camped at a distance, ordered trenches dug like souterrains each hiding a man and his horse, the Muslims labouring at guarding them till finished, then feigned withdrawal to Hims; under cover of night they returned to their camp and trenches while the Ladhiqiyyans went out each morning thinking them gone, and at dawn opened their gate and sent out their flocks — whereupon the Muslims surprised them and entered through the city gate, taking it by force; Ubada entered the citadel, climbed its wall and magnified God upon it; a group of its Christians fled to al-Yasayid, then asked safety to return to their land, being cut a kharaj to pay few or many, their church left them, and the Muslims built a congregational mosque at al-Ladhiqiyya at Ubada's order, enlarged afterwards; the Byzantines later raided its coast from the sea, demolishing the city and taking captives in Umar ibn Abd al-Aziz's caliphate in year 100, and he ordered it rebuilt and fortified, sending to the tyrant to ransom the Muslim prisoners — it was unfinished when he died in 101, and Yazid ibn Abd al-Malik completed and garrisoned it; Ubada and the Muslims also took Antartus, a fortress its people abandoned, which Mu'awiya built and made an amsar with land-grants, doing likewise with Maraqiyya and Bulunyas, and they took the town called Balda two farsakhs from Jabala by force — it fell ruined and its people left, and Mu'awiya founded Jabala and garrisoned it."
  es: "En al-Baladhuri: Abu Ubayda dejó a Ubada ibn al-Samit al-Ansari al otro lado de Hims, y llegó a al-Ladhiqiyya, cuya gente luchó contra él; tenía una gran puerta que un ejército de hombres no podía abrir; viendo la dificultad, acampó a cierta distancia, ordenó cavar trincheras como si fueran subterráneos, cada una escondiendo a un hombre y su caballo, los musulmanes se esforzaron por vigilarlas hasta terminarlas, luego fingieron retirarse a Hims; al amparo de la noche regresaron a su campamento y trincheras mientras los ladhiqiyyans salían cada mañana pensando que se habían ido, y al amanecer abrían su puerta y enviaban sus rebaños; entonces los musulmanes los sorprendieron y entraron por la puerta de la ciudad, tomándola por la fuerza; Ubada entró en la ciudadela, escaló su muralla y glorificó a Dios en ella; Un grupo de sus cristianos huyó a al-Yasayid, luego pidió protección para regresar a su tierra, siendo cortado un kharaj para pagar a pocos o muchos, su iglesia los abandonó, y los musulmanes construyeron una mezquita congregacional en al-Ladhiqiyya por orden de Ubada, ampliada posteriormente; los bizantinos luego asaltaron su costa desde el mar, demoliendo la ciudad y tomando cautivos en el califato de Umar ibn Abd al-Aziz en el año 100, y él ordenó que la reconstruyera y fortificara, enviando al tirano a rescatar a los prisioneros musulmanes; estaba inconclusa cuando murió en 101, y Yazid ibn Abd al-Malik la completó y la guarneció; Ubada y los musulmanes también tomaron Antartus, una fortaleza que su gente había abandonado, que Mu'awiya reconstruyó y convirtió en un amsar con concesiones de tierras, haciendo lo mismo con Maraqiyya y Bulunyas, y tomaron por la fuerza la ciudad llamada Balda, a dos farsakhs de Jabala; cayó en ruinas y su gente se marchó, y Mu'awiya fundó Jabala y la guarneció."
  fr: "Dans al-Baladhuri: Abu Ubayda laissa Ubada ibn al-Samit al-Ansari à Hims, et celui-ci arriva à al-Ladhiqiyya dont les habitants lui opposèrent un combat acharné. La ville possédait une grande porte qu’une armée ne put ouvrir. Voyant la difficulté, il campa à distance et ordonna de creuser des tranchées semblables à des souterrains, chacune abritant un homme et son cheval. Les musulmans s’employèrent à les garder jusqu’à ce qu’elles soient terminées, puis il feignit de se retirer à Hims. À la faveur de la nuit, ils regagnèrent leur camp et leurs tranchées, tandis que les Ladhiqiyyans, les croyant partis, sortaient chaque matin. À l’aube, ils ouvraient leur porte et lâchaient leurs troupeaux. C’est alors que les musulmans les surprirent et entrèrent par la porte de la ville, s’en emparant de force. Ubada pénétra dans la citadelle, escalada ses remparts et y glorifia Dieu. Un groupe de ses chrétiens s'enfuit à al-Yasayid, puis demanda la sécurité pour retourner sur leurs terres, se voyant infliger un kharaj à payer à quelques-uns ou à beaucoup, leur église les abandonna, et les musulmans construisirent une mosquée congrégationaliste à al-Ladhiqiyya sur l'ordre d'Ubada, agrandie par la suite; les Byzantins pillèrent plus tard sa côte depuis la mer, démolissant la ville et faisant des captifs dans le califat d'Umar ibn Abd al-Aziz en l'an 100, et il ordonna sa reconstruction et sa fortification, envoyant au tyran racheter les prisonniers musulmans — elle était inachevée à sa mort en 101, et Yazid ibn Abd al-Malik la termina et la garnit de garnison; Ubada et les musulmans prirent également Antartus, une forteresse abandonnée par ses habitants, que Mu'awiya construisit et transforma en amsar avec des concessions de terres, faisant de même avec Maraqiyya et Bulunyas, et ils prirent de force la ville appelée Balda, à deux farsakhs de Jabala — elle tomba en ruine et ses habitants partirent, et Mu'awiya fonda Jabala et y installa une garnison."
  ur: "البلادوری میں ہے: ابو عبیدہ نے عبادہ بن الصامت الانصاری کو ہمس پر چھوڑ دیا، اور وہ لذیقیہ کے پاس آیا جس کے لوگوں نے ان سے جنگ کی - اس کا ایک بڑا دروازہ تھا جسے بہت سے آدمی نہیں کھول سکتے تھے۔ مشکل کو دیکھ کر اس نے کچھ فاصلے پر پڑاؤ ڈالا، خندقیں کھودی جیسے ہر ایک آدمی اور اس کے گھوڑے کو چھپائے ہوئے تھے، مسلمان ان کی حفاظت میں محنت کرتے رہے جب تک کہ وہ ختم نہ ہو جائے، پھر اس سے دستبرداری کا دعویٰ کیا۔ رات کی آڑ میں وہ اپنے کیمپ اور خندقوں کی طرف لوٹے جبکہ لدھیقیان ہر صبح یہ سوچ کر باہر نکلتے تھے کہ وہ چلے گئے ہیں، اور فجر کے وقت اپنا دروازہ کھولا اور اپنے ریوڑ کو باہر بھیج دیا - جس پر مسلمانوں نے انہیں حیران کر دیا اور شہر کے دروازے سے زبردستی لے کر اندر داخل ہوئے۔ عبادہ قلعہ میں داخل ہوا، اس کی دیوار پر چڑھا اور اس پر خدا کی بڑائی کی۔ اس کے عیسائیوں کا ایک گروہ الیسعید کی طرف بھاگا، پھر اپنی سرزمین پر واپس جانے کے لیے حفاظت کی درخواست کی، کچھ یا زیادہ دینے کے لیے خرج کاٹ دیا گیا، ان کے کلیسا نے انھیں چھوڑ دیا، اور مسلمانوں نے عبادہ کے حکم پر لذیقیہ میں ایک اجتماعی مسجد بنائی، جس کے بعد اسے بڑھا دیا گیا۔ بعد ازاں بازنطینیوں نے سمندر سے اس کے ساحل پر چھاپہ مارا، شہر کو مسمار کر دیا اور سنہ 100 میں عمر بن عبدالعزیز کی خلافت میں قیدیوں کو لے لیا، اور اس نے اسے دوبارہ تعمیر کرنے اور مضبوط کرنے کا حکم دیا، مسلمان قیدیوں کو فدیہ دینے کے لیے ظالم کو بھیجنے کا حکم دیا- یہ ادھورا تھا جب وہ عبد العزیز 100 میں مر گیا اور یحیٰی کی موت ہو گئی۔ اسے garrisoned; عبادہ اور مسلمانوں نے انٹارٹس کو بھی اپنے قبضے میں لے لیا جو کہ اس کے لوگوں نے ترک کر دیا تھا، جسے معاویہ نے زمین کی امداد سے بنایا اور ایک امسر بنایا، اسی طرح مراقیہ اور بلونیاس کے ساتھ کیا، اور انہوں نے بلدہ نامی بستی کو جبلہ سے دو فرسخ لے لیا - یہ تباہ ہو گیا اور اس کے لوگ وہاں سے چلے گئے، اور معاویہ نے جبلۃ الغرض کی بنیاد رکھی۔"
