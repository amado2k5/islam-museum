id: event/conquest-of-ladhiqiyya
class: event
kind: conquest
label: { ar: "فتح اللاذقية", en: "The Conquest of al-Ladhiqiyya" }
summary:
  ar: "عند البلاذري: استخلف أبو عبيدة عبادة بن الصامت الأنصاري على حمص فأتى اللاذقية فقاتله أهلها وكان بها باب عظيم لا يفتحه الجماعة من الناس، فلما رأى صعوبة مرامها عسكر على بُعد من المدينة ثم أمر أن تُحفر حفائر كالأسراب يستتر الرجل وفرسه في الواحدة منها فاجتهد المسلمون في خفرها حتى فرغوا منها ثم أظهروا القفول إلى حمص فلما جن عليهم الليل عادوا إلى معسكرهم وحفائرهم وأهل اللاذقية يغدون يرون أنهم قد انصرفوا فلما أصبحوا فتحوا بابهم وأخرجوا سرحهم فلم يرعهم إلا تصبيح المسلمين إياهم ودخولهم من باب المدينة ففتحت عنوة ودخل عبادة الحصن ثم علا حائطه فكبر عليه وهرب قوم من نصارى اللاذقية إلى اليسيد ثم طلبوا الأمان على أن يتراجعوا إلى أرضهم فقوطعوا على خراج يؤدونه قلّوا أو كثروا وتركت لهم كنيستهم وبنى المسلمون باللاذقية مسجداً جامعاً بأمر عبادة ثم وُسّع بعد؛ وكانت الروم أغارت في البحر على ساحل اللاذقية فهدمت مدينتها وسبت أهلها في خلافة عمر بن عبد العزيز سنة 100 فأمر ببنائها وتحصينها ووجه إلى الطاغية في فداء من أُسر من المسلمين فلم يتم ذلك حتى توفي عمر سنة 101 فأتم المدينة وشحنها يزيد بن عبد الملك؛ وفتح عبادة والمسلمون معه أيضاً أنطرطوس وكان حصناً فجلا عنه أهله فبناه معاوية ومصّره وأقطع بها القطائع وكذلك فعل بمرقية وبلنياس، وفتحوا مدينة تعرف ببلدة على فرسخين من جبلة عنوة فخربت وجلا عنها أهلها فأنشأ معاوية جبلة وشحنها."
  en: "In al-Baladhuri: Abu Ubayda left Ubada ibn al-Samit al-Ansari over Hims, and he came to al-Ladhiqiyya whose people fought him — it had a great gate a host of men could not open; seeing the difficulty he camped at a distance, ordered trenches dug like souterrains each hiding a man and his horse, the Muslims labouring at guarding them till finished, then feigned withdrawal to Hims; under cover of night they returned to their camp and trenches while the Ladhiqiyyans went out each morning thinking them gone, and at dawn opened their gate and sent out their flocks — whereupon the Muslims surprised them and entered through the city gate, taking it by force; Ubada entered the citadel, climbed its wall and magnified God upon it; a group of its Christians fled to al-Yasayid, then asked safety to return to their land, being cut a kharaj to pay few or many, their church left them, and the Muslims built a congregational mosque at al-Ladhiqiyya at Ubada's order, enlarged afterwards; the Byzantines later raided its coast from the sea, demolishing the city and taking captives in Umar ibn Abd al-Aziz's caliphate in year 100, and he ordered it rebuilt and fortified, sending to the tyrant to ransom the Muslim prisoners — it was unfinished when he died in 101, and Yazid ibn Abd al-Malik completed and garrisoned it; Ubada and the Muslims also took Antartus, a fortress its people abandoned, which Mu'awiya built and made an amsar with land-grants, doing likewise with Maraqiyya and Bulunyas, and they took the town called Balda two farsakhs from Jabala by force — it fell ruined and its people left, and Mu'awiya founded Jabala and garrisoned it."
