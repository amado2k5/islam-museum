label: { ar: "استيلاء عضد الدولة على ملك بني حمدان", en: "Adud al-Dawla Seizes the Realm of the Banu Hamdan" }
summary:
  ar: "في سنة 367هـ لما انهزم أبو تغلب وبختيار سار عضد الدولة نحو الموصل فملكها ثاني عشر ذي القعدة وما يتصل بها، وظن أبو تغلب أنه يفعل كما كان غيره يفعل يقيم يسيراً ثم يصطر إلى المصالحة ويعود، وكان عضد الدولة أحزم من ذلك فإنه لما قصد الموصل حمل معه الميرة والعلوقات ومن يعرف ولاية الموصل وأقام بها مطمئناً وبث السرايا في طلب أبي تغلب فأرسل يطلب أن يضمن البلاد فلم يجبه عضد الدولة إلى ذلك وقال هذه البلاد أحب إلي من العراق {cite:kamil-ibn-al-athir p. 507-508}."
  en: "In Dhu'l-Qa'da 367 Adud al-Dawla took Mosul and the Hamdanid Jazira; Abu Taghlib expected the usual raid-and-settle, but Adud came stocked with provisions and local know-how, settled in and hunted him — 'these lands are dearer to me than Iraq' {cite:kamil-ibn-al-athir p. 507-508}."
