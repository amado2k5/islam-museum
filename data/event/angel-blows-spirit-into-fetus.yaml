id: event/angel-blows-spirit-into-fetus
kind: other
label:
  ar: ملك ينفخ الروح في الجنين
  en: The angel who blows the spirit into the fetus
  ur: جنین میں روح پھونکنے والا ملک
summary:
  ar: 'في حديث خلق الإنسان: يجمع في بطن أمه أربعين يوماً نطفة ثم علقة ثم مضغة، ثم يبعث الله الملك فينفخ فيه الروح ويؤمر بأربع كلمات: بكتب رزقه وعمله وأجله وشقي أو سعيد {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-04|الأربعون 4]].'
  en: 'In the hadith of human creation: he is gathered in his mother''s womb forty days as a drop, then a clot, then a chewed lump; then Allah sends the angel who blows the spirit into him and commands four things — his provision, his deed, his term, and whether he is wretched or blessed {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-04|Forty 4]].'
  ur: 'انسان کی خلقت کی حدیث میں: وہ اپنی ماں کے پیٹ میں چالیس دن نطفہ پھرعلقہ پھر مضغہ کے طور پر جمع ہوتا ہے، پھر اللہ ملک بھیجتا ہے جو اس میں روح پھونکتا ہے اور چار چیزیں حکم دیتا ہے — اس کی روزی، اس کا عمل، اس کی مدت، اور اس کا بدبخت یا نیک ہونا {cite:ibn-rajab-jami-ulum-hikam} [[passage/arbaun-04|چالیس 4]]۔'
