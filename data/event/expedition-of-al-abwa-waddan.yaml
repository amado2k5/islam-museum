label: { en: "Expedition of al-Abwa (Waddan)", ar: "غزوة الأبواء ⁦(ودان)⁩", es: "Expedición de al-Abwa (Waddan)", fr: "Expédition d'al-Abwa (Waddan)", ur: "غزوہ العبوا ⁦(ودان)⁩", tr: "El-Abwa' (Vadan) Muharebesi", id: "Perang Al-Abwa' (Wadan)" }
summary:
  en: "The first expedition led personally by the Prophet in Safar 2 AH with 70 Muhajirun; established an alliance treaty with Amr ibn Makhshi of Banu Damra."
  ar: "أول غزوة خرج فيها النبي بنفسه في سبعين رجلاً من المهاجرين في صفر 2هـ، فبلغ ودان والأبواء وعقد معاهدة حلف وموادعة مع عمرو بن مخشي الضمري سيد بني ضمرة."
  es: "La primera expedición, liderada personalmente por el Profeta en Safar 2 AH con 70 Muhajirun, estableció un tratado de alianza con Amr ibn Makhshi de Banu Damra."
  fr: "La première expédition menée personnellement par le Prophète en Safar 2 AH avec 70 Muhajirun; établit un traité d'alliance avec Amr ibn Makhshi de Banu Damra."
  ur: "پہلی مہم جو نبی کریم نے ذاتی طور پر صفر 2 ہجری میں 70 مہاجرین کے ساتھ کی۔ بنو دمرہ کے عمرو بن مخشی کے ساتھ اتحاد کا معاہدہ کیا۔"
  tr: "Peygamberin bizzat Muhacirlerden yetmiş kişiyle çıktığı ilk sefer Hicri 2. Safer ayında gerçekleşti. Waddan ve Al-Abwa'ya ulaştı ve Beni Damra'nın reisi Amr bin Makhshi Al-Damri ile bir ittifak ve ateşkes antlaşması yaptı."
  id: "Ekspedisi pertama di mana Nabi sendiri pergi bersama tujuh puluh orang dari kaum Muhajirin adalah pada bulan Safar tahun 2 Hijriah. Beliau sampai di Waddan dan Al-Abwa’ dan membuat perjanjian persekutuan dan gencatan senjata dengan Amr bin Makhshi Al-Damri, kepala Bani Damra."
