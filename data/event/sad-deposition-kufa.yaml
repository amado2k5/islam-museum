label: { ar: "شكوى أهل الكوفة سعداً وتعاقب الولاة", en: "The Kufans' Complaint against Sa'd and the Succession of Governors", es: "La queja de los kufanos contra Sa'd y la sucesión de gobernadores", fr: "La plainte des Koufans contre Sa'd et la succession des gouverneurs" }
summary:
  ar: "عند البلاذري عن جابر بن سمرة: سعى أهل الكوفة بسعد بن أبي وقاص إلى عمر وقالوا إنه لا يحسن الصلاة فأجاب سعد أنه كان يصلي بهم صلاة رسول الله لا يخرم عنها يركد في الأوليين ويحذف في الأخرتين فقال عمر ذاك الظن بك يا أبا إسحاق وأرسل رجالاً يسألون عنه فما أتوا مسجداً إلا أثنوا عليه خيراً حتى أتوا مسجد بني عبس فقال أبو سعدة أما إذ سألتمونا عنه فإنه كان لا يقسم بالسوية ولا يعدل في القضية فدعا عليه سعد إن كان كاذباً أن يطيل عمره ويديم فقره ويعمي بصره ويعرضه للفتن فرآه عبد الملك بن عمير بعد يتعرض للإماء في السكك يقول كبير مفتون أصابتني دعوة سعد ونسب إلى سعد قول اللهم لا ترض عنهم أميراً ولا ترضهم بأمير وإلى المختار بن أبي عبيد أو غيره حب أهل الكوفة شرف وبغضهم تلف ووفد عمرو بن معدي كرب على عمر فشهد لسعد بجمع الذرة وشفقة الأم البرة والقسم بالسوية والعدل في القضية وسأله عمر عن الحرب فقال مرة المذاق إذا قامت على ساق من صبر فيها عرف ومن ضعف عنها تلف وعن السلاح فقال في الرمح أخوك وربما خانك وفي السهام رسل المنايا تخطئ وتصيب وفي الترس ذاك المجن عليه تدور الدوائر وفي الدرع مشغلة للفارس متعبة للراجل وإنها لحصن حصين وفي السيف هناك ثكلتك أمك فقال عمر بل ثكلتك أمك فقال عمرو الحمى أضرعتني إليك وعزل عمر سعداً وولى عمار بن ياسر فشكوه ضعيفاً لا علم له بالسياسة فعزله بعد سنة وتسعة أشهر فقال عمر من عذيري من أهل الكوفة إن استعملت عليهم القوي فجروه وإن وليت عليهم الضعيف حقروه ثم ولى المغيرة بن شعبة بعد أن ضمن له ألا يعود لما قرف به فلم يزل عليها حتى توفي عمر ثم ولاها عثمان سعداً ثم عزله فولى الوليد بن عقبة فقال له سعد أما إن تكون كست بعدي أو أكون حمقت بعدك ثم عزل الوليد فولى سعيد بن العاص."
  en: "In al-Baladhuri via Jabir ibn Samura: the Kufans maligned Sa'd to Umar claiming he prayed poorly; Sa'd answered he led them the Messenger's prayer unabridged — lingering in the first two, light in the last — and Umar's mosque-by-mosque inquiry praised him everywhere until a man of Banu Abs called Abu Sa'da testified he neither divided equally nor judged justly; Sa'd's counter-prayer for a liar befell him, Abd al-Malik ibn Umayr later seeing him in the alleys saying 'an old man tried — Sa'd's prayer struck me'. Amr ibn Ma'dikarib testified for Sa'd with 'a gnat's gathering and a goodly mother's tenderness', gave Umar his famous appraisals of war and weapons — the spear 'your brother though he may betray', arrows 'death's messengers', mail 'a burden for horseman and weariness for footman yet a strong fortress', and for the sword 'there your mother bewailed you' met by Umar's 'nay, your mother bewailed you' — whereupon 'the fever drove me to you'. Umar deposed Sa'd for Ammar ibn Yasir, whom they then called weak and unknowledgeable — deposed after a year and nine months — and Umar cried 'who will excuse me from the Kufans? Appoint the strong they make him a sinner, the weak they slight him', finally giving it to al-Mughira ibn Shu'ba on his pledge not to return to his former accusation, which he held till Umar's death; Uthman then appointed Sa'd, replaced him with al-Walid ibn Uqba — Sa'd greeting him 'either you measured after me or I grew senile after you' — then with Sa'id ibn al-As."
  es: "En al-Baladhuri, a través de Jabir ibn Samura: los kufanos difamaron a Sa'd ante Umar, alegando que rezaba mal; Sa'd respondió que les dirigió la oración del Mensajero sin abreviar —prolongando las dos primeras, ligera en la última— y la investigación de Umar mezquita por mezquita lo elogió en todas partes hasta que un hombre de Banu Abs llamado Abu Sa'da testificó que ni dividía por igual ni juzgaba con justicia; la contraoración de Sa'd por un mentiroso le sobrevino, y Abd al-Malik ibn Umayr lo vio más tarde en los callejones diciendo: \"un anciano lo intentó; la oración de Sa'd me impactó\". Amr ibn Ma'dikarib testificó a favor de Sa'd con \"la reunión de un mosquito y la ternura de una buena madre\", le dio a Umar sus famosas valoraciones de la guerra y las armas: la lanza \"a tu hermano aunque te traicione\", las flechas \"mensajeras de la muerte\", la cota de malla \"una carga para el jinete y un cansancio para el infante, pero una fortaleza fuerte\", y para la espada \"allí tu madre te lloró\", a lo que Umar respondió \"no, tu madre te lloró\", tras lo cual \"la fiebre me impulsó a ir contigo\". Umar depuso a Sa'd por Ammar ibn Yasir, a quien entonces llamaban débil e ignorante, depuesto después de un año y nueve meses, y Umar gritó \"¿quién me excusará de los kufanos? Nombran al fuerte y lo convierten en pecador, al débil lo desprecian\", finalmente dándoselo a al-Mughira ibn Shu'ba con la promesa de no volver a su acusación anterior, promesa que mantuvo hasta la muerte de Umar; Luego, Uthman nombró a Sa'd, lo reemplazó con al-Walid ibn Uqba —Sa'd lo saludó diciendo: \"O tú mediste después de mí o yo me volví senil después de ti\"— y luego con Sa'id ibn al-As."
  fr: "Dans al-Baladhuri, rapporté par Jabir ibn Samura: les habitants de Koufa calomnèrent Sa'd auprès d'Umar, prétendant qu'il priait mal; Sa'd répondit qu'il leur avait dirigé la prière du Messager dans son intégralité — s'attardant sur les deux premières sourates, et accélérant la dernière — et l'enquête menée par Umar, mosquée par mosquée, le loua partout, jusqu'à ce qu'un homme des Banu Abs, nommé Abu Sa'da, témoigne qu'il ne divisait ni équitablement ni ne jugeait avec justice; la contre-prière de Sa'd pour un menteur s'abattit sur lui, et Abd al-Malik ibn Umayr, le voyant plus tard dans les ruelles, dit: « Un vieil homme a essayé — la prière de Sa'd m'a frappé. » Amr ibn Ma'dikarib témoigna en faveur de Sa'd avec « la délicatesse d'un moucheron et la tendresse d'une mère aimante », livra à Umar ses célèbres analyses de la guerre et des armes: la lance, « ton frère, même s'il te trahit », les flèches, « messagères de la mort », la cotte de mailles, « un fardeau pour le cavalier et une source de lassitude pour le fantassin, mais une forteresse imprenable », et quant à l'épée, « là, ta mère te pleurait », ce à quoi Umar répondit: « Non, c'est ta mère qui te pleurait » – et alors « la fièvre me poussa vers toi ». Umar déposa Sa'd au profit d'Ammar ibn Yasir, qu'ils qualifiaient alors de faible et d'ignorant – il fut déposé après un an et neuf mois – et Umar s'écria: « Qui me dispensera des Koufans ? » « Nommez les forts, ils en font un pécheur, les faibles, ils le méprisent », confiant finalement le poste à al-Mughira ibn Shu'ba sur sa promesse de ne pas revenir sur son accusation précédente, qu'il maintint jusqu'à la mort d'Umar; Uthman nomma ensuite Sa'd, le remplaça par al-Walid ibn Uqba — Sa'd le saluant en disant « soit tu as mesuré après moi, soit je suis devenu sénile après toi » — puis par Sa'id ibn al-As."
