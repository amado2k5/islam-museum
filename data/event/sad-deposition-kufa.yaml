label: { ar: "شكوى أهل الكوفة سعداً وتعاقب الولاة", en: "The Kufans' Complaint against Sa'd and the Succession of Governors" }
summary:
  ar: "عند البلاذري عن جابر بن سمرة: سعى أهل الكوفة بسعد بن أبي وقاص إلى عمر وقالوا إنه لا يحسن الصلاة فأجاب سعد أنه كان يصلي بهم صلاة رسول الله لا يخرم عنها يركد في الأوليين ويحذف في الأخرتين فقال عمر ذاك الظن بك يا أبا إسحاق وأرسل رجالاً يسألون عنه فما أتوا مسجداً إلا أثنوا عليه خيراً حتى أتوا مسجد بني عبس فقال أبو سعدة أما إذ سألتمونا عنه فإنه كان لا يقسم بالسوية ولا يعدل في القضية فدعا عليه سعد إن كان كاذباً أن يطيل عمره ويديم فقره ويعمي بصره ويعرضه للفتن فرآه عبد الملك بن عمير بعد يتعرض للإماء في السكك يقول كبير مفتون أصابتني دعوة سعد ونسب إلى سعد قول اللهم لا ترض عنهم أميراً ولا ترضهم بأمير وإلى المختار بن أبي عبيد أو غيره حب أهل الكوفة شرف وبغضهم تلف ووفد عمرو بن معدي كرب على عمر فشهد لسعد بجمع الذرة وشفقة الأم البرة والقسم بالسوية والعدل في القضية وسأله عمر عن الحرب فقال مرة المذاق إذا قامت على ساق من صبر فيها عرف ومن ضعف عنها تلف وعن السلاح فقال في الرمح أخوك وربما خانك وفي السهام رسل المنايا تخطئ وتصيب وفي الترس ذاك المجن عليه تدور الدوائر وفي الدرع مشغلة للفارس متعبة للراجل وإنها لحصن حصين وفي السيف هناك ثكلتك أمك فقال عمر بل ثكلتك أمك فقال عمرو الحمى أضرعتني إليك وعزل عمر سعداً وولى عمار بن ياسر فشكوه ضعيفاً لا علم له بالسياسة فعزله بعد سنة وتسعة أشهر فقال عمر من عذيري من أهل الكوفة إن استعملت عليهم القوي فجروه وإن وليت عليهم الضعيف حقروه ثم ولى المغيرة بن شعبة بعد أن ضمن له ألا يعود لما قرف به فلم يزل عليها حتى توفي عمر ثم ولاها عثمان سعداً ثم عزله فولى الوليد بن عقبة فقال له سعد أما إن تكون كست بعدي أو أكون حمقت بعدك ثم عزل الوليد فولى سعيد بن العاص."
  en: "In al-Baladhuri via Jabir ibn Samura: the Kufans maligned Sa'd to Umar claiming he prayed poorly; Sa'd answered he led them the Messenger's prayer unabridged — lingering in the first two, light in the last — and Umar's mosque-by-mosque inquiry praised him everywhere until a man of Banu Abs called Abu Sa'da testified he neither divided equally nor judged justly; Sa'd's counter-prayer for a liar befell him, Abd al-Malik ibn Umayr later seeing him in the alleys saying 'an old man tried — Sa'd's prayer struck me'. Amr ibn Ma'dikarib testified for Sa'd with 'a gnat's gathering and a goodly mother's tenderness', gave Umar his famous appraisals of war and weapons — the spear 'your brother though he may betray', arrows 'death's messengers', mail 'a burden for horseman and weariness for footman yet a strong fortress', and for the sword 'there your mother bewailed you' met by Umar's 'nay, your mother bewailed you' — whereupon 'the fever drove me to you'. Umar deposed Sa'd for Ammar ibn Yasir, whom they then called weak and unknowledgeable — deposed after a year and nine months — and Umar cried 'who will excuse me from the Kufans? Appoint the strong they make him a sinner, the weak they slight him', finally giving it to al-Mughira ibn Shu'ba on his pledge not to return to his former accusation, which he held till Umar's death; Uthman then appointed Sa'd, replaced him with al-Walid ibn Uqba — Sa'd greeting him 'either you measured after me or I grew senile after you' — then with Sa'id ibn al-As."
