label: { ar: "طرد الغلمان جلال الدولة من بغداد ٤٢٣", en: "The ghilman's expulsion of Jalal al-Dawla from Baghdad, 423", es: "La expulsión de Jalal al-Dawla de Bagdad por parte del ghilman, 423", fr: "L'expulsion par le Ghilman de Jalal al-Dawla de Bagdad, 423" }
summary:
  ar: "حلف الغلمان على خلع جلال الدولة فقطعوا خطبته يوم الجمعة ثالث ربيع الأول سنة ٤٢٣، وسرّح جواريه وطلبوا نزوله إلى واسط، ونزلوا معه على مائة غلام ثم عشرين؛ فهرب ليلة الاثنين سادس ربيع الأول إلى عكبرا ونهبت دار المملكة، وكاتب الأصبهسلرية أبا كليجار يدعونه فردّ بجواب حذر يطلب خمسمائة غلام؛ وسار جلال إلى الحلة وسجد لكمال الدولة أبي سنان وزوّجه ابنته ووعده الخزائن، فشفع له فأعيدت خطبته يوم سبعة عشر ربيع الأول في جامع المدينة والرصافة ثم جامع الخليفة في الجمعة الثالثة؛ ثم كان شربه النبيذ في بستان دار الخليفة في شوال وعتاب القائم له واعتذاره {cite:muntazam-ibn-al-jawzi j.8 p.404-410}."
  en: "The ghilman swore to depose Jalal al-Dawla and cancelled the khutba in his name on Friday, 3 Rabi' I 423. They dismissed his concubines and demanded that he go down to Wasit; 100 ghilman went down with him, then only 20. He fled on the night of Monday, 6 Rabi' I, to Akbara, and the royal residence was plundered. He wrote to the isfahsalar Abu Kalijar, inviting him, but Abu Kalijar replied cautiously, asking for 500 ghilman. Jalal went to al-Hilla, prostrated himself before Kamal al-Dawla Abu Sinan, gave him his daughter in marriage and promised him treasures. Abu Sinan interceded for him, and his khutba was restored on 17 Rabi' I in the congregational mosques of the city and al-Rusafa, and then in the caliph's mosque on the third Friday. In Shawwal he drank wine in a garden of the caliph's residence; al-Qa'im reproached him, and he apologised {cite:muntazam-ibn-al-jawzi j.8 p.404-410}."
  es: "El ghilman juró deponer a Jalal al-Dawla y canceló el sermón en su nombre el viernes 3 de Rabi' I de 423. Despidieron a sus concubinas y le exigieron que bajara a Wasit; 100 ghilman bajaron con él, luego solo 20. Huyó la noche del lunes 6 de Rabi' I a Akbara, y la residencia real fue saqueada. Escribió al isfahsalar Abu Kalijar, invitándolo, pero Abu Kalijar respondió con cautela, pidiendo 500 ghilman. Jalal fue a al-Hilla, se postró ante Kamal al-Dawla Abu Sinan, le dio a su hija en matrimonio y le prometió tesoros. Abu Sinan intercedió por él, y su sermón fue restaurado el 17 de Rabi' I en las mezquitas congregacionales de la ciudad y al-Rusafa, y luego en la mezquita del califa el tercer viernes. En Shawwal bebió vino en un jardín de la residencia del califa; al-Qa'im lo reprendió y él se disculpó {cite:muntazam-ibn-al-jawzi j.8 p.404-410}."
  fr: "Les ghilmans jurèrent de destituer Jalal al-Dawla et annulèrent le sermon prononcé en son nom le vendredi 3 Rabi' I 423. Ils congédièrent ses concubines et exigèrent qu'il descende à Wasit; 100 ghilmans l'accompagnèrent, puis seulement 20. Il s'enfuit dans la nuit du lundi 6 Rabi' I à Akbara, et la résidence royale fut pillée. Il écrivit à l'isfahsalar Abu Kalijar pour l'inviter, mais ce dernier répondit avec prudence, demandant 500 ghilmans. Jalal se rendit à al-Hilla, se prosterna devant Kamal al-Dawla Abu Sinan, lui donna sa fille en mariage et lui promit des trésors. Abu Sinan intercéda en sa faveur, et son sermon fut rétabli le 17 Rabi' I dans les mosquées de la ville et d'al-Rusafa, puis dans la mosquée du calife le troisième vendredi. En Shawwal, il but du vin dans un jardin de la résidence du calife; al-Qa'im le réprimanda et il s'excusa {cite:muntazam-ibn-al-jawzi j.8 p.404-410}."
