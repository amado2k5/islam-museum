label: { ar: "دخول محمود الغزنوي الريّ سنة ٤٢٠", en: "Mahmud of Ghazna Enters Rayy, 420", es: "Mahmud de Ghazna entra en Rayy, 420", fr: "Mahmud de Ghazna entre à Rayy, 420" }
summary:
  ar: "ورد على بغداد كتاب محمود بن سبكتكين إلى الخليفة مؤرخ في غرة جمادى الآخرة سنة ٤٢٠ من معسكره بسواد الري، يصف فيه خروجه من أصبهان في محرم ودخوله الري غدوة الاثنين السادس عشر من جمادى الأولى مع الجيش الكثيف؛ وذكر أن أهل الري عذبوا بظلم الديلم واستجاشوا به فاستجار بهم، وأن أبا طالب رستم بن علي ابن فخر الدولة استسلم بالمصالحة، فقُبض على رؤساء الباطنية، وشهد الديلم على ما عندهم، فأفتى الفقهاء بإهدار الدماء فصُلبوا على رأس الطريق، وقُسمت أموالهم، وأُخرجت الكتب فكان ما أخرج من مدينة واحدة خمسين بعيرًا من كتب المعتزلة والفلاسفة والرافضة فأُحرقت تحت المصابين، وبلغ ما أُخذ من النفائس ما يقارب خمسمائة ألف دينار ومن الدراهم مائتين وستين ألفًا، ورحل أبو طالب وابنه وكبار الأمراء إلى خراسان. وفي الكتاب دعاؤه «أزال الله عن هذه البقعة أيدي الظلمة وطهّرها من دعوة الباطنية» — وهو رواية الفاتح عن نفسه وأسبابه {cite:muntazam-ibn-al-jawzi j.8 p.380-383}."
  en: "A letter from Mahmud ibn Sabuktakin reached the caliph in Baghdad, dated the first of Jumada II 420 from his camp in the Rayy countryside. In it he describes leaving Isfahan in Muharram and entering Rayy on the morning of Monday, the sixteenth of Jumada I, with a dense army. He mentions that the people of Rayy had been tormented by the injustice of the Daylam and had called on him for aid, and that he gave them his protection. Abu Talib Rustam ibn Ali ibn Fakhr al-Dawla surrendered on terms of reconciliation. The leaders of the Batiniyya were seized; the Daylam testified to what they held; the jurists ruled their blood forfeit, and they were crucified on the roadside. Their property was divided, and their books were brought out: from one city alone fifty camel-loads of books of the Mu'tazila, the philosophers and the Rafida were burned beneath the afflicted. The valuables taken came to nearly five hundred thousand dinars and two hundred and sixty thousand dirhams. Abu Talib, his son and the senior amirs set out for Khurasan. The letter contains his prayer: 'May God remove from this land the hands of the wrongdoers and purify it of the call of the Batiniyya.' This is the conqueror's own account of himself and his reasons {cite:muntazam-ibn-al-jawzi j.8 p.380-383}."
  es: "Una carta de Mahmud ibn Sabuktakin llegó al califa en Bagdad, fechada el primero de Jumada II de 420, desde su campamento en la campiña de Rayy. En ella describe su partida de Isfahán en Muharram y su entrada en Rayy la mañana del lunes dieciséis de Jumada I, con un numeroso ejército. Menciona que el pueblo de Rayy había sido atormentado por la injusticia del Daylam y le había pedido ayuda, y que él les brindó su protección. Abu Talib Rustam ibn Ali ibn Fakhr al-Dawla se rindió en condiciones de reconciliación. Los líderes de la Batiniyya fueron apresados; el Daylam testificó sobre sus posesiones; los juristas dictaminaron su derramamiento de sangre y fueron crucificados al borde del camino. Sus bienes fueron repartidos y sus libros fueron sacados: solo de una ciudad, cincuenta cargas de camello de libros de los Mu'tazila, los filósofos y los Rafida fueron quemadas bajo los afligidos. Los objetos de valor sustraídos ascendían a casi quinientos mil dinares y doscientos sesenta mil dirhams. Abu Talib, su hijo y los emires de mayor rango partieron hacia Jorasán. La carta contiene su plegaria: «Que Dios aleje de esta tierra a los malhechores y la purifique de la influencia de la Batiniyya». Este es el propio relato del conquistador sobre sí mismo y sus motivos {cite:muntazam-ibn-al-jawzi, vol. 8, págs. 380-383}."
  fr: "Une lettre de Mahmud ibn Sabuktakin parvint au calife à Bagdad, datée du premier jour de Jumada II 420, depuis son campement dans la campagne de Rayy. Il y décrit son départ d'Ispahan au mois de Muharram et son entrée à Rayy le lundi 16 de Jumada I au matin, à la tête d'une armée importante. Il mentionne que les habitants de Rayy, accablés par l'injustice des Daylam, avaient imploré son aide et qu'il leur avait accordé sa protection. Abu Talib Rustam ibn Ali ibn Fakhr al-Dawla se rendit après avoir conclu un accord de réconciliation. Les chefs des Batiniyya furent arrêtés; les Daylam attestèrent de leurs possessions; les juristes décrétèrent que leur sang était confisqué et ils furent crucifiés en bord de route. Leurs biens furent partagés et leurs livres sortis: dans une seule ville, cinquante charges de chameaux remplies d'ouvrages des Mu'tazilites, des philosophes et des Rafida furent brûlées sous les yeux des victimes. Le butin s'élevait à près de cinq cent mille dinars et deux cent soixante mille dirhams. Abou Talib, son fils et les émirs les plus anciens partirent pour le Khorasan. La lettre contient sa prière: « Que Dieu éloigne de cette terre les mains des malfaiteurs et la purifie de l'appel des Batiniyya. » Il s'agit du récit du conquérant lui-même et de ses motivations (cf. Muntazam ibn al-Jawzi, vol. 8, p. 380-383)."
