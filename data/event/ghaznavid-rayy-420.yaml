label: { ar: "دخول محمود الغزنوي الريّ سنة ٤٢٠" }
summary:
  ar: "ورد على بغداد كتاب محمود بن سبكتكين إلى الخليفة مؤرخ في غرة جمادى الآخرة سنة ٤٢٠ من معسكره بسواد الري، يصف فيه خروجه من أصبهان في محرم ودخوله الري غدوة الاثنين السادس عشر من جمادى الأولى مع الجيش الكثيف؛ وذكر أن أهل الري عذبوا بظلم الديلم واستجاشوا به فاستجار بهم، وأن أبا طالب رستم بن علي ابن فخر الدولة استسلم بالمصالحة، فقُبض على رؤساء الباطنية، وشهد الديلم على ما عندهم، فأفتى الفقهاء بإهدار الدماء فصُلبوا على رأس الطريق، وقُسمت أموالهم، وأُخرجت الكتب فكان ما أخرج من مدينة واحدة خمسين بعيرًا من كتب المعتزلة والفلاسفة والرافضة فأُحرقت تحت المصابين، وبلغ ما أُخذ من النفائس ما يقارب خمسمائة ألف دينار ومن الدراهم مائتين وستين ألفًا، ورحل أبو طالب وابنه وكبار الأمراء إلى خراسان. وفي الكتاب دعاؤه «أزال الله عن هذه البقعة أيدي الظلمة وطهّرها من دعوة الباطنية» — وهو رواية الفاتح عن نفسه وأسبابه {cite:muntazam-ibn-al-jawzi j.8 p.380-383}."
