id: event/death-of-malik-al-ashtar-en-route-to-egypt
class: event
kind: death
label: { ar: "وفاة مالك الأشتر في الطريق إلى مصر", en: "Death of Malik al-Ashtar on the way to Egypt", es: "Muerte de Malik al-Ashtar camino a Egipto.", fr: "Mort de Malik al-Ashtar sur le chemin de l'Égypte", ur: "ملک الاشتر کی مصر جاتے ہوئے موت" }
summary:
  ar: "اختار علي مالكاً الأشتر النخعي والياً على مصر بعد عزل قيس بن سعد، فتوجه إليها، فمات قبل أن يدخلها عند أطراف البحر الأحمر، وقيل إنه سُقي شربة مسمومة من عسل، واتهم أناس من أهل الخراج بتسميمه، ويميل الصلابي إلى أن التحريض جاء من معاوية {cite:sallabi-ali-vol1 p. 334}{cite:sallabi-ali-vol1 p. 335}."
  en: "Ali chose Malik al-Ashtar to govern Egypt after Qays ibn Sa'd was replaced. He died at the edge of the Red Sea before entering Egypt. A rumour says he was poisoned in honey, and some people of the kharaj were accused; the book leans toward Mu'awiya having incited it."
  es: "Ali eligió a Malik al-Ashtar para gobernar Egipto tras la destitución de Qays ibn Sa'd. Murió a orillas del Mar Rojo antes de entrar en Egipto. Se rumorea que fue envenenado con miel, y algunos habitantes del kharaj fueron acusados; el libro se inclina a pensar que Mu'awiya fue quien lo instigó."
  fr: "Ali choisit Malik al-Ashtar pour gouverner l'Égypte après la destitution de Qays ibn Sa'd. Ce dernier mourut aux abords de la mer Rouge avant d'entrer en Égypte. Selon une rumeur, il aurait été empoisonné au miel, et certains habitants du kharaj furent accusés; le livre penche plutôt pour la thèse selon laquelle Mu'awiya en aurait été l'instigateur."
  ur: "قیس بن سعد کی جگہ لینے کے بعد علی نے ملک الاشتر کو مصر پر حکومت کرنے کے لیے منتخب کیا۔ وہ مصر میں داخل ہونے سے پہلے بحیرہ احمر کے کنارے پر مر گیا۔ ایک افواہ کہتی ہے کہ اسے شہد میں زہر ملایا گیا تھا، اور خارج کے کچھ لوگوں پر الزام لگایا گیا تھا۔ کتاب کا جھکاؤ معاویہ کی طرف ہے جس نے اسے اکسایا تھا۔"
