summary:
  ar: "اختار علي مالكاً الأشتر النخعي والياً على مصر بعد عزل قيس بن سعد، فتوجه إليها، فمات قبل أن يدخلها عند أطراف البحر الأحمر، وقيل إنه سُقي شربة مسمومة من عسل، واتهم أناس من أهل الخراج بتسميمه، ويميل الصلابي إلى أن التحريض جاء من معاوية {cite:sallabi-ali-vol1 p. 334}{cite:sallabi-ali-vol1 p. 335}."
  en: "Ali chose Malik al-Ashtar to govern Egypt after Qays ibn Sa'd was replaced. He died at the edge of the Red Sea before entering Egypt. A rumour says he was poisoned in honey, and some people of the kharaj were accused; the book leans toward Mu'awiya having incited it."
