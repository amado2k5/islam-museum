summary:
  ar: "في خلال وجود صالح رايس بفاس أرسل فرقة من جيشه إلى الريف المغربي فاسترجعت من الأسبان معقلهم الكبير باديس — صخرة فالين كما يدعونها {cite:dawlat-uthmaniyya-salabi p. 239}."
  en: "During Salih Reis's stay in Fez he sent a detachment to the Moroccan Rif which recovered from Spain their great stronghold Badis — the rock they call Vélez {cite:dawlat-uthmaniyya-salabi p. 239}."
  es: "Durante la estancia de Salih Reis en Fez, envió un destacamento al Rif marroquí que recuperó de España su gran fortaleza Badis, la roca que llaman Vélez {cite:dawlat-uthmaniyya-salabi p. 239}."
  fr: "Durant son séjour à Fès, Salih Reis envoya un détachement dans le Rif marocain qui récupéra de l'Espagne leur grande forteresse de Badis — le rocher qu'ils appellent Vélez {cite:dawlat-uthmaniyya-salabi p. 239}."
  ur: "صالح رئیس کے فیز میں قیام کے دوران اس نے مراکش کی رف کو ایک دستہ بھیجا جو اسپین سے ان کے عظیم گڑھ بادیس سے برآمد ہوئی — جسے وہ ویلز کہتے ہیں 239}۔"
  tr: "Salih Rais'in Fez'de kaldığı süre boyunca, ordusunun bir birliğini Fas kırsalına gönderdi ve İspanyollardan büyük kaleleri Badis'i (onların deyimiyle Valin Kayası) geri aldılar. {cite:dawlat-uthmaniyya-salabi s. 239}"
  id: "Selama Saleh Rais tinggal di Fez, ia mengirimkan detasemen pasukannya ke pedesaan Maroko, dan mereka merebut kembali benteng besar mereka di Badis dari Spanyol — yang mereka sebut sebagai batu Valin {cite:dawlat-uthmaniyya-salabi p. 239}."
