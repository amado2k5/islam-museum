kind: conquest
label: { ar: "فتح بورصة", en: "Conquest of Bursa", es: "Conquista de Bursa", fr: "Conquête de Bursa", ur: "برسا کی فتح", tr: "Borsa açılışı", id: "Pembukaan bursa saham" }
summary:
  ar: "حاصر العثمانيون بورصة حصاراً طويلاً عدة سنوات — ويذكر الصلابي أن عثمان فتحها سنة ٧١٧هـ/١٣١٧م بعد صراع شديد مع قائد حاميتها {cite:dawlat-uthmaniyya-salabi p. 47} — حتى استسلمت المدينة الجائعة في ٢ جمادى الأولى ٧٢٦هـ/٦ أبريل ١٣٢٦م ودفعت جزية ثقيلة، وخرج قائدها البيزنطي إلى القسطنطينية بينما بقي مستشاره الأعظم المسؤول عن الاستسلام مع العثمانيين {cite:encyclopaedia-of-islam-2 vol. 1 p. 1398}. وصارت بورصة العاصمة الرئيسة للدولة العثمانية من ٧٢٦هـ/١٣٢٦م إلى ٨٠٥هـ/١٤٠٢م {cite:encyclopaedia-of-islam-2 vol. 1 p. 1397}."
  en: "The Ottomans blockaded Bursa for many years — al-Salabi has Osman taking it in 717/1317 after a hard struggle with its commander {cite:dawlat-uthmaniyya-salabi p. 47} — until the starved city surrendered on 2 Jumada I 726/6 April 1326 and paid a heavy tribute; the Byzantine commander was allowed to leave for Constantinople while his chief adviser, responsible for the surrender, stayed with the Ottomans {cite:encyclopaedia-of-islam-2 vol. 1 p. 1398}. Bursa then served as the main capital of the Ottoman state from 726/1326 to 805/1402 {cite:encyclopaedia-of-islam-2 vol. 1 p. 1397}."
  ur: "عثمانیوں نے بورصہ کا کئی برس محاصرہ کیا — صلابی کے مطابق عثمان نے 717ھ/1317ء میں اس کے سردار سے سخت جدوجہد کے بعد اسے فتح کیا {cite:dawlat-uthmaniyya-salabi p. 47} — یہاں تک کہ بھوکہ شہر 2 جمادی الاولی 726ھ/6 اپریل 1326ء کو ہار مان گیا اور بھاری جزیہ ادا کیا؛ بازنطینی سردار کو قسطنطنیہ جانے دیا گیا جبکہ ہتھیار ڈالنے کا ذمہ دار اس کا اعلیٰ مشیر عثمانیوں کے پاس رہا {cite:encyclopaedia-of-islam-2 vol. 1 p. 1398}۔ پھر بورصہ 726ھ/1326ء سے 805ھ/1402ء تک سلطنت عثمانیہ کا مرکزی دارالحکومت رہا {cite:encyclopaedia-of-islam-2 vol. 1 p. 1397}۔"
  es: "Los otomanos bloquearon Bursa durante muchos años —al-Salabi afirma que Osman la tomó en 717/1317 tras una dura lucha con su comandante {cite:dawlat-uthmaniyya-salabi p. 47}— hasta que la ciudad, hambrienta, se rindió el 2 de Jumada I de 726/6 de abril de 1326 y pagó un fuerte tributo; al comandante bizantino se le permitió partir hacia Constantinopla, mientras que su principal consejero, responsable de la rendición, permaneció con los otomanos {cite:encyclopaedia-of-islam-2 vol. 1 p. 1398}. Bursa sirvió entonces como capital principal del estado otomano desde 726/1326 hasta 805/1402 {cite:encyclopaedia-of-islam-2 vol. 1 p. 1397}."
  fr: "Les Ottomans bloquèrent Bursa pendant de nombreuses années – al-Salabi rapporte qu'Osman s'en empara en 717/1317 après une lutte acharnée contre son commandant (voir: Dawlat-Uthmaniyya-Salabi, p. 47) – jusqu'à ce que la ville, affamée, capitule le 2 Jumada Ier 726/6 avril 1326 et paie un lourd tribut; le commandant byzantin fut autorisé à partir pour Constantinople tandis que son principal conseiller, artisan de la reddition, resta auprès des Ottomans (voir: Encyclopaedia of Islam, vol. 1, p. 1398). Bursa devint alors la principale capitale de l'État ottoman de 726/1326 à 805/1402 (voir: Encyclopaedia of Islam, vol. 1, p. 1397)."
  tr: "Osmanlılar Bursa'yı birkaç yıl kuşattı—el-Sallabi, Osman'ın 717 Hicri/1317 Miladi yılında garnizon komutanıyla şiddetli bir mücadeleden sonra şehri fethettiğini belirtir {kaynak:dawlat-uthmaniyya-salabi s. 47}—açlıktan kırılan şehir, 2 Cemâdî-ülâle 726 Hicri/6 Nisan 1326 Miladi tarihinde teslim oldu ve ağır bir haraç ödedi. Bizans komutanı İstanbul'a giderken, teslimiyetten sorumlu büyük danışmanı Osmanlılarla kaldı {kaynak:encyclopaedia-of-islam-2 cilt 1 s. 1398}. Bursa, 726 Hicri/1326 Miladi'den 805 Hicri/1402 Miladi'ye kadar Osmanlı devletinin ana başkenti oldu {kaynak:encyclopaedia-of-islam-2 cilt 1 s. 1397}."
  id: "Kesultanan Utsmaniyah mengepung Bursa selama beberapa tahun—al-Sallabi menyebutkan bahwa Utsmaniyah menaklukkannya pada tahun 717 H/1317 M setelah pertempuran sengit dengan komandan garnisunnya {cite:dawlat-uthmaniyya-salabi hlm. 47}—hingga kota yang kelaparan itu menyerah pada tanggal 2 Jumada al-Ula 726 H/6 April 1326 M dan membayar upeti yang besar. Komandan Bizantiumnya pergi ke Konstantinopel, sementara penasihat besarnya, yang bertanggung jawab atas penyerahan tersebut, tetap bersama Utsmaniyah {cite:encyclopaedia-of-islam-2 vol. 1 hlm. 1398}. Bursa menjadi ibu kota utama negara Utsmaniyah dari tahun 726 H/1326 M hingga 805 H/1402 M {cite:encyclopaedia-of-islam-2 vol. 1 hlm. 1397}."
