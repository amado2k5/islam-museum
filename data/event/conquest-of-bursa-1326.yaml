id: event/conquest-of-bursa-1326
class: event
kind: conquest
label: { ar: "فتح بورصة", en: "Conquest of Bursa" }
summary:
  ar: "حاصر العثمانيون بورصة حصاراً طويلاً عدة سنوات — ويذكر الصلابي أن عثمان فتحها سنة ٧١٧هـ/١٣١٧م بعد صراع شديد مع قائد حاميتها {cite:dawlat-uthmaniyya-salabi p. 47} — حتى استسلمت المدينة الجائعة في ٢ جمادى الأولى ٧٢٦هـ/٦ أبريل ١٣٢٦م ودفعت جزية ثقيلة، وخرج قائدها البيزنطي إلى القسطنطينية بينما بقي مستشاره الأعظم المسؤول عن الاستسلام مع العثمانيين {cite:encyclopaedia-of-islam-2 vol. 1 p. 1398}. وصارت بورصة العاصمة الرئيسة للدولة العثمانية من ٧٢٦هـ/١٣٢٦م إلى ٨٠٥هـ/١٤٠٢م {cite:encyclopaedia-of-islam-2 vol. 1 p. 1397}."
  en: "The Ottomans blockaded Bursa for many years — al-Salabi has Osman taking it in 717/1317 after a hard struggle with its commander {cite:dawlat-uthmaniyya-salabi p. 47} — until the starved city surrendered on 2 Jumada I 726/6 April 1326 and paid a heavy tribute; the Byzantine commander was allowed to leave for Constantinople while his chief adviser, responsible for the surrender, stayed with the Ottomans {cite:encyclopaedia-of-islam-2 vol. 1 p. 1398}. Bursa then served as the main capital of the Ottoman state from 726/1326 to 805/1402 {cite:encyclopaedia-of-islam-2 vol. 1 p. 1397}."
  ur: "عثمانیوں نے بورصہ کا کئی برس محاصرہ کیا — صلابی کے مطابق عثمان نے 717ھ/1317ء میں اس کے سردار سے سخت جدوجہد کے بعد اسے فتح کیا {cite:dawlat-uthmaniyya-salabi p. 47} — یہاں تک کہ بھوکہ شہر 2 جمادی الاولی 726ھ/6 اپریل 1326ء کو ہار مان گیا اور بھاری جزیہ ادا کیا؛ بازنطینی سردار کو قسطنطنیہ جانے دیا گیا جبکہ ہتھیار ڈالنے کا ذمہ دار اس کا اعلیٰ مشیر عثمانیوں کے پاس رہا {cite:encyclopaedia-of-islam-2 vol. 1 p. 1398}۔ پھر بورصہ 726ھ/1326ء سے 805ھ/1402ء تک سلطنت عثمانیہ کا مرکزی دارالحکومت رہا {cite:encyclopaedia-of-islam-2 vol. 1 p. 1397}۔"
