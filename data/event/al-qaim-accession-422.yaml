label: { ar: "وفاة القادر وبيعة القائم بأمر الله ٤٢٢", en: "The death of al-Qadir and the accession of al-Qa'im bi-amr Allah, 422" }
summary:
  ar: "مات الخليفة القادر بالله ليلة الاثنين حادي عشر ذي الحجة سنة ٤٢٢ وله ست وثمانون سنة وعشرة أشهر وإحدى وعشرون يومًا، وخلافته إحدى وأربعون سنة وثلاثة أشهر — ولم يبلغها خليفة قبله. أُغلقت الأبواب، ثم خرج القائم بأمر الله وقت العصر فصلى بالناس المغرب ثم صلى على أبيه أربع تكبيرات، وجلس بدار الشجرة في قميص ورداء فبايعه الناس وأولهم الشريف المرتضى، وجاء أبو أحمد الحسن بن عيسى بن المقتدر في الغد فبايع؛ وشغب الأتراك على مال البيعة فقتل هاشميٌّ تركيًّا فخرج توقيع الخليفة في ذلك، واستقر أن تكلف البيعة ثلاثة آلاف ألف دينار؛ ومن أدبه المشهور أنه عرض خانًا وبستانًا وركامًا للبيع ليدفعها. ولقّب الوزراء والحجاب ورتب الدولة {cite:muntazam-ibn-al-jawzi j.8 p.399-403}."
  en: "The caliph al-Qadir bi'llah died on the night of Monday 11 Dhu'l-Hijja 422, aged eighty-six years, ten months and twenty-one days, having reigned forty-one years and three months, a span no caliph before him had reached. The doors were shut; then al-Qa'im bi-amr Allah came out at the time of 'asr, led the people in the maghrib prayer, prayed over his father with four takbirs, and sat in the Dar al-Shajara in a shirt and mantle. The people gave him bay'a, first among them al-Sharif al-Murtada, and on the next day Abu Ahmad al-Hasan ibn Isa ibn al-Muqtadir came and gave bay'a too. The Turks clamoured over the bay'a money; when a Hashimite killed a Turk, a signed decree of the caliph was issued on the matter, and it was settled that the bay'a be levied at three million dinars. Among his well-known displays of tact, he put up a caravanserai, a garden and a heap of goods for sale to meet it. He gave titles to the viziers and chamberlains and arranged the offices of state {cite:muntazam-ibn-al-jawzi j.8 p.399-403}."
