label: { ar: "وفاة القادر وبيعة القائم بأمر الله ٤٢٢" }
summary:
  ar: "مات الخليفة القادر بالله ليلة الاثنين حادي عشر ذي الحجة سنة ٤٢٢ وله ست وثمانون سنة وعشرة أشهر وإحدى وعشرون يومًا، وخلافته إحدى وأربعون سنة وثلاثة أشهر — ولم يبلغها خليفة قبله. أُغلقت الأبواب، ثم خرج القائم بأمر الله وقت العصر فصلى بالناس المغرب ثم صلى على أبيه أربع تكبيرات، وجلس بدار الشجرة في قميص ورداء فبايعه الناس وأولهم الشريف المرتضى، وجاء أبو أحمد الحسن بن عيسى بن المقتدر في الغد فبايع؛ وشغب الأتراك على مال البيعة فقتل هاشميٌّ تركيًّا فخرج توقيع الخليفة في ذلك، واستقر أن تكلف البيعة ثلاثة آلاف ألف دينار؛ ومن أدبه المشهور أنه عرض خانًا وبستانًا وركامًا للبيع ليدفعها. ولقّب الوزراء والحجاب ورتب الدولة {cite:muntazam-ibn-al-jawzi j.8 p.399-403}."
