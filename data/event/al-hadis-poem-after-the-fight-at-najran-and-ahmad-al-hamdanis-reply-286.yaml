id: event/al-hadis-poem-after-the-fight-at-najran-and-ahmad-al-hamdanis-reply-286
class: event
kind: other
label:
  ar: قصيدة الهادي بعد الوقعة بنجران وقصيدة أحمد بن محمد الهمداني، 286هـ
  en: Al-Hadi's poem after the fight at Najran and the poem of Ahmad ibn Muhammad al-Hamdani, 286 AH
  ur: نجران کی لڑائی کے بعد ہادی کا قصیدہ اور احمد بن محمد ہمدانی کا قصیدہ، 286ھ
  es: "El poema de Al-Hadi tras la batalla de Najrán y el poema de Ahmad ibn Muhammad al-Hamdani, 286 AH."
  fr: "Poème d'Al-Hadi après la bataille de Najran et poème d'Ahmad ibn Muhammad al-Hamdani, 286 AH"
  tr: "Necran Savaşı sonrası Hadi'nin şiiri ve Ahmed ibn Muhammed el-Hamdani'nin şiiri, Hicri 286"
  id: "Puisi Al-Hadi setelah pertempuran di Najran dan puisi Ahmad ibn Muhammad al-Hamdani, 286 H."
summary:
  ar: يورد الراوي مقاطع من قصيدة للهادي يستهلها بخيال محبوبة ثم يصف الحرب والفرسان والرماح وفخره بنسبه وأمله في الجنة وثنائه على همدان وخولان وسعد، ثم قصيدة أحمد بن محمد الهمداني في أن قومه نُصحوا فعصوا وأن الإمام الذي من ولد الرسول يدعو إلى الحق والعدل وأن همدان صبروا ونصروا الحق.
  en: The narrator gives passages of a poem by al-Hadi that opens with the thought of a beloved, then describes war, horsemen and spears, his pride in his lineage, his hope of Paradise and his praise of Hamdan, Khawlan and Sa'd, then a poem by Ahmad ibn Muhammad al-Hamdani saying his people were counselled and refused, that the imam of the Messenger's line calls to truth and justice, and that Hamdan were patient and helped the truth.
  ur: راوی ہادی کے ایک قصیدے کے حصے بیان کرتا ہے جو ایک محبوبہ کے خیال سے شروع ہوتا ہے، پھر جنگ، سواروں اور نیزوں کا بیان، اپنے نسب پر فخر، جنت کی امید اور ہمدان، خولان اور سعد کی تعریف آتی ہے؛ اس کے بعد احمد بن محمد ہمدانی کا قصیدہ ہے کہ ان کی قوم کو نصیحت کی گئی اور اس نے نہ مانا، کہ رسول کی اولاد کا امام حق اور عدل کی طرف بلاتا ہے اور ہمدان نے صبر کیا اور حق کی مدد کی۔
  es: "El narrador presenta pasajes de un poema de al-Hadi que comienza con el pensamiento de un ser querido, luego describe la guerra, los jinetes y las lanzas, su orgullo por su linaje, su esperanza en el Paraíso y su alabanza a Hamdan, Khawlan y Sa'd, luego un poema de Ahmad ibn Muhammad al-Hamdani que dice que su pueblo fue aconsejado y se negó, que el imán del linaje del Mensajero llama a la verdad y la justicia, y que Hamdan fue paciente y ayudó a la verdad."
  fr: "Le narrateur cite des passages d'un poème d'al-Hadi qui s'ouvre sur la pensée d'un être cher, puis décrit la guerre, les cavaliers et les lances, sa fierté pour sa lignée, son espoir du Paradis et ses éloges de Hamdan, Khawlan et Sa'd, puis un poème d'Ahmad ibn Muhammad al-Hamdani disant que son peuple a été conseillé et a refusé, que l'imam de la lignée du Messager appelle à la vérité et à la justice, et que Hamdan a été patient et a aidé la vérité."
  tr: "Anlatıcı, Al-Hadi'nin bir şiirinden alıntılar yapıyor; şiir, sevgilisinin bir vizyonuyla başlıyor, ardından savaşı, şövalyeleri, mızrakları, soyuna duyduğu gururu, cennete olan umudunu ve Hamdan, Khawlan ve Saad'a olan övgüsünü anlatıyor. Daha sonra Ahmed bin Muhammed Al-Hamdani'nin bir şiiri geliyor; bu şiirde, halkının nasihat edildiğini ancak itaatsizlik ettiklerini, Peygamberin soyundan gelen İmam'ın hakikat ve adaleti istediğini ve Hamdan'ın sabırlı olup hakikati desteklediğini söylüyor."
  id: "Narator mengutip cuplikan dari sebuah puisi karya Al-Hadi, yang dimulai dengan visi tentang kekasihnya, kemudian menggambarkan perang, para ksatria, tombak, kebanggaannya akan garis keturunannya, harapannya akan Surga, dan pujiannya untuk Hamdan, Khawlan, dan Saad. Kemudian datang sebuah puisi karya Ahmad bin Muhammad Al-Hamdani, di mana ia mengatakan bahwa kaumnya telah diberi nasihat tetapi tidak taat, bahwa Imam yang berasal dari keturunan Rasulullah menyerukan kebenaran dan keadilan, dan bahwa Hamdan bersabar dan mendukung kebenaran."
