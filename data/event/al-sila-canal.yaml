label: { ar: "حفر نهر الصلة", en: "The Digging of Nahr al-Sila", es: "La excavación de Nahr al-Sila", fr: "Le creusement du Nahr al-Sila", ur: "نہر السلا کی کھدائی", tr: "Bağlantı Nehrini Kazmak", id: "Menggali Sungai Koneksi" }
summary:
  ar: "عند البلاذري: أمر المهدي أمير المؤمنين بحفر نهر الصلة فحفروا وأحيى ما عليه من الأرضين وجعلت غلته لصلات أهل الحرمين والنفقة هناك وكان شرط لمن تألف إليه من المزارعين الشرط الذي هم عليه اليوم خمسين سنة على أن يقاسموا بعد انقضاء الخمسين مقاسمة النصف."
  en: "In al-Baladhuri: al-Mahdi ordered Nahr al-Sila dug; they dug it and revived the lands along it, assigning its revenue to the sila of the people of the two sanctuaries and their expenses there — the compact offered cultivators who joined it, which they remain on today, fifty years, after which they would sharecrop at half."
  es: "En al-Baladhuri: al-Mahdi ordenó que se cavara Nahr al-Sila; lo cavaron y rehabilitaron las tierras a lo largo de él, asignando sus ingresos a la sila de la gente de los dos santuarios y sus gastos allí. El pacto ofrecía a los agricultores que se unieran a él, en el que siguen vigentes hoy en día, cincuenta años, después de los cuales cosecharían a medias."
  fr: "Dans al-Baladhuri: al-Mahdi ordonna de creuser le Nahr al-Sila; ils le creusèrent et revitalisèrent les terres qui le bordaient, attribuant ses revenus à la sila des habitants des deux sanctuaires et à leurs dépenses sur place — le pacte offrait aux cultivateurs qui y adhéraient, et ils y restent encore aujourd'hui, cinquante ans, après quoi ils pratiqueraient le métayage à moitié."
  ur: "البلادوری میں ہے: المہدی نے نہر السلا کو کھودنے کا حکم دیا۔ انہوں نے اسے کھودا اور اس کے ساتھ والی زمینوں کو دوبارہ زندہ کیا، اس کی آمدنی کو دو مقدس مقامات کے لوگوں کے سائلہ اور ان کے اخراجات کو تفویض کیا - اس میں شامل ہونے والے کاشتکاروں نے جو معاہدہ کیا، جس پر وہ آج پچاس سال تک قائم ہیں، جس کے بعد وہ آدھی فصل کاشت کریں گے۔"
  tr: "El-Baladhuri'ye göre: Müminlerin Emiri El-Mehdi, Sila Nehri'nin kazılmasını emretti; onlar da nehri kazdılar ve üzerindeki toprakları ıslah ettiler. Elde edilen ürün, İki Kutsal Mescid halkının sadakası ve masrafları için kullanıldı. Bu, buna meyilli olan çiftçiler için bir şarttı; bugün de olduğu gibi, elli yıl boyunca kullanmaları ve elli yılın sonunda ürünü ikiye bölmeleri şartıyla."
  id: "Menurut Al-Baladhuri: Al-Mahdi, Amirul Mukminin, memerintahkan penggalian Sungai Al-Sila, lalu mereka menggali dan menyuburkan lahan di sekitarnya, dan hasil sungainya dijadikan sedekah bagi penduduk Dua Masjid Suci dan untuk pengeluaran di sana. Itu adalah syarat bagi para petani yang berminat, syarat yang berlaku hingga saat ini, selama lima puluh tahun, dengan ketentuan bahwa setelah lima puluh tahun berakhir mereka akan membaginya menjadi dua."
