  en: "In al-Baladhuri: al-Mahdi ordered Nahr al-Sila dug; they dug it and revived the lands along it, assigning its revenue to the sila of the people of the two sanctuaries and their expenses there — the compact offered cultivators who joined it, which they remain on today, fifty years, after which they would sharecrop at half."
