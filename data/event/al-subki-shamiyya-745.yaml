label:
  ar: "السبكي يدرّس بالشامية البرانية، ٢١ ذو الحجة ٧٤٥هـ"
  en: "Al-Subki teaches at the Shamiyya al-Barraniyya, 21 Dhu al-Hijja 745"
  ur: "سبکی کی مدرسہ شامیہ برانیہ میں تدریس، 21 ذو الحجہ 745ھ"
summary:
  ar: "في يوم الأحد ٢١ ذي الحجة ٧٤٥هـ درّس قاضي القضاة تقي الدين السبكي الشافعي بالمدرسة الشامية البرانية بدمشق عن الشيخ شمس الدين بن النقيب، وحضر عنده القضاة والأعيان والأمراء وجمع من الفضلاء {cite:al-bidaya-wal-nihaya s.a. 745 p. 226}."
  en: "On Sunday 21 Dhu al-Hijja 745 chief qadi Taqi al-Din al-Subki gave his first lesson at the Shamiyya al-Barraniyya madrasa in Damascus in succession to Shams al-Din ibn al-Naqib, before an assembly of qadis, notables, amirs and scholars {cite:al-bidaya-wal-nihaya s.a. 745 p. 226}."
  ur: "اتوار 21 ذو الحجہ 745ھ کو قاضی القضاة تقی الدین سبکی نے دمشق کے مدرسہ شامیہ برانیہ میں شمس الدین بن النقیب کے بعد پہلا درس دیا؛ قاضی، اعیان، امیر اور فضلا کی ایک بڑی مجلس موجود تھی {cite:al-bidaya-wal-nihaya s.a. 745 p. 226}۔"
