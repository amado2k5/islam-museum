label: { ar: "عمارة زياد لجامع البصرة", en: "Ziyad's Rebuilding of Basra's Mosque", es: "La reconstrucción de la mezquita de Basora por Ziyad", fr: "La reconstruction de la mosquée de Bassora par Ziyad" }
summary:
  ar: "لما استعمل معاوية زياداً على البصرة زاد في المسجد زيادة كثيرة وبناه بالآجر والجص وسقفه بالساج وقال لا ينبغي للإمام أن يتخطى الناس فحوّل دار الإمارة من الدهناء إلى قبلة المسجد فكان الإمام يخرج من الباب الذي في حائط القبلة وجعل صفة المنبر المقدمة خمس سواري وبنى منارته بالحجارة وهو أول من عمل المقصورة وكان يطوف بالبناء ويقول لوجوه أهل البصرة أترون خللاً فيقولون ما نعلم بناء أحكم منه فيقول بلى هذه الأساطين التي على كل واحدة منها أربعة عقود لو كانت أغلظ من سائر الأساطين ولم يؤت من تلك الأساطين قط تصديع ولا عيب وقال حارثة بن بدر ويقال البعيث المجاشعي: بنى زياد لذكر الله مصنعة من الحجارة لم تعمل من الطين لولا تماور أيدي الإنس ترفعها إذا لقلنا من أعمال الشياطين."
  en: "When Mu'awiya made Ziyad governor of Basra he greatly enlarged the mosque — fired brick, gypsum, teak roof — moved the dar al-imara from al-Dahna' to the qibla wall so the imam no longer crossed the worshippers, gave the minbar five steps, built a stone minaret and made the first maqsura; touring the work he asked Basra's notables 'do you see a flaw?' — 'none sounder' — 'yes: these four-load columns should have been thicker', yet none of those columns ever cracked or flawed. Haritha ibn Badr — or al-Ba'ith al-Mujashi'i — sang: 'Ziyad built for God's remembrance a fabric of stone, not of clay; but for the hands of men upholding it, we had called it the work of demons'."
  es: "Cuando Mu'awiya nombró a Ziyad gobernador de Basora, amplió enormemente la mezquita —con ladrillos cocidos, yeso y techo de teca—, trasladó el dar al-imara de al-Dahna' al muro de la qibla para que el imán ya no cruzara entre los fieles, añadió cinco escalones al minbar, construyó un minarete de piedra e hizo la primera maqsura. Al recorrer la obra, preguntó a los notables de Basora: \"¿Veis algún defecto?\". \"Ninguno más sólido\". \"Sí: estas columnas de cuatro cargas deberían haber sido más gruesas\", pero ninguna de esas columnas se agrietó ni se dañó. Haritha ibn Badr —o al-Ba'ith al-Mujashi'i— cantó: \"Ziyad construyó para el recuerdo de Dios una estructura de piedra, no de barro; pero por las manos de los hombres que la sostenían, la habíamos llamado obra de demonios\"."
  fr: "Lorsque Mu'awiya nomma Ziyad gouverneur de Bassora, il agrandit considérablement la mosquée – en briques cuites, en plâtre et avec un toit en teck –, déplaça le dar al-imara d'al-Dahna' au mur de la qibla afin que l'imam ne traverse plus la foule des fidèles, donna cinq marches au minbar, fit construire un minaret en pierre et édifia la première maqsura. Lors d'une visite des lieux, il demanda aux notables de Bassora: « Voyez-vous un défaut ? » – « Aucun » – « Oui: ces colonnes à quatre piliers auraient dû être plus épaisses », et pourtant aucune de ces colonnes ne se fissura ni ne présenta de défaut. Haritha ibn Badr – ou al-Ba'ith al-Mujashi'i – chanta: « Ziyad a bâti pour la mémoire de Dieu un édifice de pierre, non d'argile; sans les mains des hommes qui le soutenaient, nous l'aurions qualifié d'œuvre démoniaque. »"
