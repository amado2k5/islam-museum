label: { ar: "عمارة زياد لجامع البصرة", en: "Ziyad's Rebuilding of Basra's Mosque" }
summary:
  ar: "لما استعمل معاوية زياداً على البصرة زاد في المسجد زيادة كثيرة وبناه بالآجر والجص وسقفه بالساج وقال لا ينبغي للإمام أن يتخطى الناس فحوّل دار الإمارة من الدهناء إلى قبلة المسجد فكان الإمام يخرج من الباب الذي في حائط القبلة وجعل صفة المنبر المقدمة خمس سواري وبنى منارته بالحجارة وهو أول من عمل المقصورة وكان يطوف بالبناء ويقول لوجوه أهل البصرة أترون خللاً فيقولون ما نعلم بناء أحكم منه فيقول بلى هذه الأساطين التي على كل واحدة منها أربعة عقود لو كانت أغلظ من سائر الأساطين ولم يؤت من تلك الأساطين قط تصديع ولا عيب وقال حارثة بن بدر ويقال البعيث المجاشعي: بنى زياد لذكر الله مصنعة من الحجارة لم تعمل من الطين لولا تماور أيدي الإنس ترفعها إذا لقلنا من أعمال الشياطين."
  en: "When Mu'awiya made Ziyad governor of Basra he greatly enlarged the mosque — fired brick, gypsum, teak roof — moved the dar al-imara from al-Dahna' to the qibla wall so the imam no longer crossed the worshippers, gave the minbar five steps, built a stone minaret and made the first maqsura; touring the work he asked Basra's notables 'do you see a flaw?' — 'none sounder' — 'yes: these four-load columns should have been thicker', yet none of those columns ever cracked or flawed. Haritha ibn Badr — or al-Ba'ith al-Mujashi'i — sang: 'Ziyad built for God's remembrance a fabric of stone, not of clay; but for the hands of men upholding it, we had called it the work of demons'."
