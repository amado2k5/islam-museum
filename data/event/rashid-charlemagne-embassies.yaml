label: { ar: "سفارات هارون الرشيد وشارلمان", en: "The embassies of Harun al-Rashid and Charlemagne", es: "Las embajadas de Harun al-Rashid y Carlomagno", fr: "Les ambassades de Haroun al-Rachid et de Charlemagne", ur: "ہارون الرشید اور شارلمین کے سفارت خانے", tr: "Harun el-Raşid ve Şarlman'ın elçilikleri", id: "Kedutaan Harun al-Rashid dan Charlemagne" }
summary:
  ar: "انفردت المصادر اللاتينية — إينهارد كاتب سيرة شارلمان والراهب سانت جول والأخبار الملكية — بذكر الصلة بين الرشيد وشارلمان، وهي مضطربة غامضة عند طقّوش يقلل من ثقة المؤرخين بها: ابتدأت العلاقات سنة ١٨١هـ/٧٩٧م حين أرسل شارلمان وفدين إلى الشرق، الأول إلى الرشيد والثاني إلى بطريرك القدس، وكانت البعثة ثلاثة — فرنجيين ويهودياً اسمه إسحاق قام بالترجمة — طلبوا تسهيلات للحجاج الكاثوليك في الأماكن المقدسة وحمايتهم، ويذكر إينهارد أن الهدف الحصول على فيل من الخليفة؛ واستغرقت الرحلة ثلاثة أعوام توفي أثناءها الفرنجيان وعاد إسحاق وحده مع فيل هدية من الرشيد، وفي ١٨٣هـ وصلت إلى آخن سفارة الرشيد من عضوين — فارسي عن الخليفة ومغربي عن إبراهيم بن الأغلب — ثم بعثة شارلمانية ثانية سنة ١٨٦هـ وبعثة رشيدية ثانية سنة ١٩٢هـ؛ وفي ذلك التقارب أرسل بطريرك القدس إلى شارلمان مفاتيح كنيسة القيامة ومفاتيح المدينة وراية {cite:tarikh-dawla-abbasiyya-taqqush p. 106-107}."
  en: "The Harun al-Rashid–Charlemagne embassies of 181-192 AH (797-807 CE), known only from Latin sources — Einhard, the Monk of St Gall and the Royal Annals: Isaac's three-year journey returning alone with the elephant, the Persian-Maghribi counter-embassy to Aachen, and the Jerusalem patriarch's gift of the Sepulchre's keys {cite:tarikh-dawla-abbasiyya-taqqush p. 106-107}."
  es: "Las embajadas de Harun al-Rashid y Carlomagno de 181-192 AH (797-807 d. C.), conocidas solo por fuentes latinas: Eginardo, el monje de San Galo y los Anales Reales: el viaje de tres años de Isaac regresando solo con el elefante, la contraembajada persa-magrebí a Aquisgrán y el regalo del patriarca de Jerusalén de las llaves del Sepulcro {cite:tarikh-dawla-abbasiyya-taqqush p. 106-107}."
  fr: "Les ambassades de Harun al-Rashid et de Charlemagne de 181-192 AH (797-807 CE), connues uniquement par des sources latines — Einhard, le moine de Saint-Gall et les Annales royales: le voyage de trois ans d'Isaac revenant seul avec l'éléphant, la contre-ambassade perse-maghribi à Aix-la-Chapelle et le don des clés du Sépulcre par le patriarche de Jérusalem {cite: tarikh-dawla-abbasiyya-taqqush p. 106-107}."
  ur: "181-192 ہجری ⁦(797-807 عیسوی)⁩ کے ہارون الرشید-شارلیمین کے سفارت خانے، جو صرف لاطینی ذرائع سے جانا جاتا ہے - آئن ہارڈ، سینٹ گال کا مانک اور رائل اینالس: اسحاق کا ہاتھی کے ساتھ اکیلے واپسی کا تین سالہ سفر، فارسی-مغربی کا تحفہ Jeerus-Embasa's Counter-Embasi' قبر کی چابیاں {حوالہ دیں:تاریخ-دولہ-عباسیہ-تققوش ص۔ 106-107}۔"
  tr: "Latince kaynaklar—Şarlman'ın biyografisini yazan Einhard, keşiş Aziz Jules ve kraliyet kronikleri—Raşid ile Şarlman arasındaki bağlantıdan bahseden tek kaynaklardır; ancak Takkuş'a göre bu bağlantı karışık ve belirsizdir ve tarihçilerin bu bağlantıya olan güvenini azaltır: İlişkiler, Şarlman'ın doğuya iki heyet göndermesiyle 181 Hicri/797 Miladi yılında başladı; ilki Raşid'e, ikincisi Kudüs Patriği'ne. Heyet üç kişiden oluşuyordu—iki Frank ve tercümanlık yapan İshak adında bir Yahudi—ve Katolik hacılar için kutsal yerlerde kolaylıklar ve koruma talep ediyorlardı. Einhard, amacın Halife'den bir fil elde etmek olduğunu belirtir. Yolculuk üç yıl sürdü, bu süre zarfında iki Frank öldü ve İshak, Raşid'den hediye olarak bir fil ile yalnız başına geri döndü. Hicri 183 yılında, Raşid'in elçilik heyeti, halife adına bir Pers ve İbrahim ibn el-Ağlab adına bir Faslı olmak üzere iki üyeden oluşarak Aachen'e geldi. Ardından Hicri 186 yılında ikinci bir Şarlman heyeti ve Hicri 192 yılında ikinci bir Raşidi heyeti geldi. Bu yakınlaşmada, Kudüs Patriği Şarlman'a Kutsal Kabir Kilisesi'nin anahtarlarını, şehrin anahtarlarını ve bir sancak gönderdi. {cite:tarikh-dawla-abbasiyya-taqqush s. 106-107}"
  id: "Sumber-sumber Latin—Einhard, penulis biografi Charlemagne, biarawan Santo Jules, dan kronik kerajaan—adalah satu-satunya yang menyebutkan hubungan antara al-Rashid dan Charlemagne, yang menurut Taqqoush membingungkan dan ambigu, sehingga mengurangi kepercayaan para sejarawan terhadap hubungan tersebut: Hubungan dimulai pada tahun 181 H/797 M ketika Charlemagne mengirim dua delegasi ke Timur, yang pertama kepada al-Rashid dan yang kedua kepada Patriark Yerusalem. Misi tersebut terdiri dari tiga orang—dua orang Frank dan seorang Yahudi bernama Ishak yang bertindak sebagai penerjemah—yang meminta fasilitas bagi para peziarah Katolik di tempat-tempat suci dan perlindungan mereka. Einhard menyebutkan bahwa tujuannya adalah untuk mendapatkan seekor gajah dari Khalifah. Perjalanan berlangsung selama tiga tahun, di mana kedua orang Frank meninggal, dan Ishak kembali sendirian dengan seekor gajah sebagai hadiah dari al-Rashid. Pada tahun 183 H, delegasi al-Rashid tiba di Aachen, terdiri dari dua anggota—seorang Persia atas nama Khalifah dan seorang Maroko atas nama Ibrahim ibn al-Aghlab—kemudian misi Charlemagne kedua pada tahun 186 H dan misi Rashidi kedua pada tahun 192 H. Dalam upaya perdamaian itu, Patriark Yerusalem mengirimkan kepada Charlemagne kunci Gereja Makam Suci, kunci kota, dan sebuah panji {cite:tarikh-dawla-abbasiyya-taqqush hlm. 106-107}."
