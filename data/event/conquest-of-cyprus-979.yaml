id: event/conquest-of-cyprus-979
class: event
kind: conquest
label: { ar: "الفتح العثماني لقبرص", en: "The Ottoman Conquest of Cyprus", es: "La conquista otomana de Chipre", fr: "La conquête ottomane de Chypre", ur: "قبرص پر عثمانی فتح" }
summary:
  ar: "نزل العثمانيون قبرص بقوة كاسحة ونفذوا إلى الجزيرة دون صعوبة، ووقفت مدينة فاماغوستا الحصينة أمامهم بقيادة باغليون وبراغادينو، ووصلت القوة العثمانية مئة ألف مقاتل استعملوا جميع وسائل الحصار المعروفة من فركر وزرع للألغام ولم ينتج أي تأثير على الحامية، ولو وصلت قوة مسيحية للنجدة لصار العثمانيون في خطر، إلا أن المجاعة قامت بعملها واستسلمت المدينة في ربيع الثاني ٩٧٩هـ/أغسطس ١٥٧١م. ونقلت الدولة العثمانية بعد الفتح عدداً كبيراً من سكان الأناضول لا يزال أحفادهم مقيمين في الجزيرة، ورحّب القبارصة الأرثوذكس بالحكم العثماني الذي أنقذهم من الاضطهاد الكاثوليكي الذي مارسته البندقية لعدة قرون {cite:dawlat-uthmaniyya-salabi p. 279-280}."
  en: "The Ottoman conquest of Cyprus, 1570–71 — a hundred thousand men reduced Famagusta by famine after every siege engine failed; the island surrendered Rabi' II 979/August 1571, Anatolian settlers followed, and the Orthodox welcomed the end of Venetian Catholic persecution {cite:dawlat-uthmaniyya-salabi p. 279-280}."
  es: "La conquista otomana de Chipre, 1570-71: cien mil hombres redujeron Famagusta por la hambruna después de que fallaran todas las máquinas de asedio; la isla se rindió en Rabi' II 979/agosto de 1571, le siguieron colonos anatolios, y los ortodoxos celebraron el fin de la persecución católica veneciana {cite:dawlat-uthmaniyya-salabi p. 279-280}."
  fr: "La conquête ottomane de Chypre, 1570-71 — cent mille hommes réduisirent Famagouste par la famine après l'échec de toutes les machines de siège; l'île se rendit en Rabi' II 979/août 1571, des colons anatoliens suivirent, et les orthodoxes accueillirent la fin de la persécution catholique vénitienne {cite:dawlat-uthmaniyya-salabi p. 279-280}."
  ur: "قبرص پر عثمانی فتح، 1570-71 - ہر محاصرے کے انجن کے ناکام ہونے کے بعد ایک لاکھ آدمیوں نے فاماگوسٹا کو قحط سے کم کیا۔ جزیرے نے ربیع II 979/اگست 1571 کو ہتھیار ڈال دیے، اناطولیہ کے آباد کاروں نے پیروی کی، اور آرتھوڈوکس نے وینیشین کیتھولک ظلم و ستم کے خاتمے کا خیرمقدم کیا۔ 279-280}۔"
