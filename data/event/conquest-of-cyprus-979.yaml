label: { ar: "الفتح العثماني لقبرص" }
summary:
  ar: "نزل العثمانيون قبرص بقوة كاسحة ونفذوا إلى الجزيرة دون صعوبة، ووقفت مدينة فاماغوستا الحصينة أمامهم بقيادة باغليون وبراغادينو، ووصلت القوة العثمانية مئة ألف مقاتل استعملوا جميع وسائل الحصار المعروفة من فركر وزرع للألغام ولم ينتج أي تأثير على الحامية، ولو وصلت قوة مسيحية للنجدة لصار العثمانيون في خطر، إلا أن المجاعة قامت بعملها واستسلمت المدينة في ربيع الثاني ٩٧٩هـ/أغسطس ١٥٧١م. ونقلت الدولة العثمانية بعد الفتح عدداً كبيراً من سكان الأناضول لا يزال أحفادهم مقيمين في الجزيرة، ورحّب القبارصة الأرثوذكس بالحكم العثماني الذي أنقذهم من الاضطهاد الكاثوليكي الذي مارسته البندقية لعدة قرون {cite:dawlat-uthmaniyya-salabi p. 279-280}."
  en: "The Ottoman conquest of Cyprus, 1570–71 — a hundred thousand men reduced Famagusta by famine after every siege engine failed; the island surrendered Rabi' II 979/August 1571, Anatolian settlers followed, and the Orthodox welcomed the end of Venetian Catholic persecution {cite:dawlat-uthmaniyya-salabi p. 279-280}."
