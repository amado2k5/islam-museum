class: event
kind: conquest
label: { ar: "الفتح العثماني لقبرص", en: "The Ottoman Conquest of Cyprus", es: "La conquista otomana de Chipre", fr: "La conquête ottomane de Chypre", ur: "قبرص پر عثمانی فتح", tr: "Osmanlıların Kıbrıs'ı fethi", id: "Penaklukan Siprus oleh Ottoman" }
summary:
  ar: "نزل العثمانيون قبرص بقوة كاسحة ونفذوا إلى الجزيرة دون صعوبة، ووقفت مدينة فاماغوستا الحصينة أمامهم بقيادة باغليون وبراغادينو، ووصلت القوة العثمانية مئة ألف مقاتل استعملوا جميع وسائل الحصار المعروفة من فركر وزرع للألغام ولم ينتج أي تأثير على الحامية، ولو وصلت قوة مسيحية للنجدة لصار العثمانيون في خطر، إلا أن المجاعة قامت بعملها واستسلمت المدينة في ربيع الثاني ٩٧٩هـ/أغسطس ١٥٧١م. ونقلت الدولة العثمانية بعد الفتح عدداً كبيراً من سكان الأناضول لا يزال أحفادهم مقيمين في الجزيرة، ورحّب القبارصة الأرثوذكس بالحكم العثماني الذي أنقذهم من الاضطهاد الكاثوليكي الذي مارسته البندقية لعدة قرون {cite:dawlat-uthmaniyya-salabi p. 279-280}."
  en: "The Ottoman conquest of Cyprus, 1570–71 — a hundred thousand men reduced Famagusta by famine after every siege engine failed; the island surrendered Rabi' II 979/August 1571, Anatolian settlers followed, and the Orthodox welcomed the end of Venetian Catholic persecution {cite:dawlat-uthmaniyya-salabi p. 279-280}."
  es: "La conquista otomana de Chipre, 1570-71: cien mil hombres redujeron Famagusta por la hambruna después de que fallaran todas las máquinas de asedio; la isla se rindió en Rabi' II 979/agosto de 1571, le siguieron colonos anatolios, y los ortodoxos celebraron el fin de la persecución católica veneciana {cite:dawlat-uthmaniyya-salabi p. 279-280}."
  fr: "La conquête ottomane de Chypre, 1570-71 — cent mille hommes réduisirent Famagouste par la famine après l'échec de toutes les machines de siège; l'île se rendit en Rabi' II 979/août 1571, des colons anatoliens suivirent, et les orthodoxes accueillirent la fin de la persécution catholique vénitienne {cite:dawlat-uthmaniyya-salabi p. 279-280}."
  ur: "قبرص پر عثمانی فتح، 1570-71 - ہر محاصرے کے انجن کے ناکام ہونے کے بعد ایک لاکھ آدمیوں نے فاماگوسٹا کو قحط سے کم کیا۔ جزیرے نے ربیع II 979/اگست 1571 کو ہتھیار ڈال دیے، اناطولیہ کے آباد کاروں نے پیروی کی، اور آرتھوڈوکس نے وینیشین کیتھولک ظلم و ستم کے خاتمے کا خیرمقدم کیا۔ 279-280}۔"
  tr: "Osmanlılar ezici bir güçle Kıbrıs'a çıkarma yaptı ve adayı zorlanmadan ele geçirdi. Baglion ve Bragadino'nun komutasındaki müstahkem Famagusta şehri onların karşısında duruyordu. Osmanlı ordusu yüz bin askerden oluşuyordu ve havan toplarından mayınlara kadar bilinen tüm kuşatma taktiklerini kullandı, ancak bunların garnizon üzerinde hiçbir etkisi olmadı. Eğer onlara yardım etmek için bir Hristiyan kuvveti gelmiş olsaydı, Osmanlılar tehlikede olurdu. Ancak kıtlık etkisini gösterdi ve şehir Hicri 979 Rabi' el-Sani/Miladi 1571 Ağustos'unda teslim oldu. Fetih sonrasında Osmanlı devleti, Anadolu'dan gelen çok sayıda insanı adaya yerleştirdi ve onların torunları hala adada yaşamaktadır. Ortodoks Kıbrıslılar, Venedik yönetimindeki yüzyıllarca süren Katolik zulmünden kurtaran Osmanlı yönetimini memnuniyetle karşıladılar."
  id: "Pasukan Ottoman mendarat di Siprus dengan kekuatan yang luar biasa dan menembus pulau itu tanpa kesulitan. Kota Famagusta yang berbenteng, dipimpin oleh Baglion dan Bragadino, berdiri di hadapan mereka. Pasukan Ottoman berjumlah seratus ribu tentara, yang menggunakan semua taktik pengepungan yang dikenal, dari mortir hingga ranjau, tetapi ini tidak berpengaruh pada garnisun. Seandainya pasukan Kristen tiba untuk membantu mereka, pasukan Ottoman akan berada dalam bahaya. Namun, kelaparan merenggut banyak korban, dan kota itu menyerah pada bulan Rabi' al-Thani 979 H/Agustus 1571 M. Setelah penaklukan, negara Ottoman memindahkan sejumlah besar penduduk Anatolia, yang keturunannya masih tinggal di pulau itu. Penduduk Siprus Ortodoks menyambut pemerintahan Ottoman, yang menyelamatkan mereka dari penganiayaan Katolik selama berabad-abad di bawah kekuasaan Venesia."
