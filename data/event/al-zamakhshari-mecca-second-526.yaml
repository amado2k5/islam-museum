class: event
kind: pilgrimage
label:
  ar: "رحلة الزمخشري الثانية عبر دمشق إلى مكة، ٥٢٦هـ/١١٣٢م"
  en: "Al-Zamakhshari's second journey to Mecca via Damascus, 526/1132"
  ur: "زمخشری کا دوسرا سفر، دمشق راستہ مکہ، 526ھ/1132ء"
summary:
  ar: "بعد نحو عقد في جرجانية خرج الزمخشري ثانيةً قاصداً مكة، فأقام في دمشق زماناً يمدح فيه أميريها البوريَّين تاج الملوك طغتكين (ت ٥٢٦هـ/١١٣١م) وابنه شمس الملك، ثم بلغ مكة حاجّاً سنة ٥٢٦هـ/١١٣٢م وأقام بها ثلاث سنين في ضيافة ابن وهّاس الذي حثّه على جمع ديوان شعره وتصنيف تفسيره «الكشاف» {cite:encyclopaedia-of-islam-2 vol. 12 p. 918}."
  en: "About a decade later al-Zamakhshari again set out for Mecca, staying for a time in Damascus where he composed eulogies for the Burid rulers Taj al-Muluk Tughtakin (d. 526/1131) and his son Shams al-Mulk. He reached Mecca for the pilgrimage in 526/1132 and stayed there three years, again the honoured guest of Ibn Wahhas, who encouraged him to assemble his poetry diwan and to compose his Qur'an commentary al-Kashshaf {cite:encyclopaedia-of-islam-2 vol. 12 p. 918}."
  ur: "تقریباً ایک دہائی بعد زمخشری دوبارہ مکہ کے لیے روانہ ہوئے اور دمشق میں کچھ عرصہ ٹھہرے، جہاں انہوں نے بوری حکمرانوں تاج الملوک طغتکین (وفات 526ھ/1131ء) اور اس کے بیٹے شمس الملک کی مدح میں قصائد کہے۔ 526ھ/1132ء میں وہ حج کے لیے مکہ پہنچے اور وہاں تین برس رہے، پھر ابن وہاس کے مکرَّم مہمان، جنہوں نے انہیں اپنا دیوان مرتب کرنے اور تفسیر «الکشاف» لکھنے کی ترغیب دی {cite:encyclopaedia-of-islam-2 vol. 12 p. 918}۔"
