summary:
  ar: "في سنة خمسين وثلاثمائة بنى معز الدولة ببغداد دار السلطنة في غاية الحسن والكبر وغرّم عليها ثلاثة عشر ألف ألف درهم؛ وقد درست آثارها في حدود الستمائة وبقي مكانها دحلة تأوي إليها الوحوش وبعض أساسها موجود فإنه حفر لها في الأساسات ثلاثاً وثلاثين ذراعاً {cite:shadharat-dhahab p. 2}."
  en: "In 350 Mu'izz al-Dawla built Baghdad's Dar al-Saltana at a cost of thirteen million dirhams; by c. 600 AH its traces had faded to a foxes' den, though parts of its thirty-three-cubit foundations still stood {cite:shadharat-dhahab p. 2}."
