id: event/return-of-abyssinian-emigrants
class: event
aliases: [event/return-from-abyssinia]
kind: migration
label: { ar: "قدوم مهاجري الحبشة مع جعفر بن أبي طالب", en: "Return of the Abyssinian emigrants with Ja'far ibn Abi Talib", es: "El regreso de los emigrantes abisinios con Ja'far ibn Abi Talib", fr: "Retour des émigrants abyssins avec Ja'far ibn Abi Talib", ur: "جعفر بن ابی طالب کے ساتھ حبشی مہاجرین کی واپسی" }
summary:
  ar: "بعد صلح الحديبية أرسل النبي عمرو بن أمية الضمري إلى النجاشي، فحمل النجاشي المهاجرين في سفينتين فقدموا على النبي وهو بخيبر بعد فتحه. استقبل النبي جعفر بن أبي طالب بالتقبيل بين عينيه وقال: «ما أدري بأيهما أنا أسر: بفتح خيبر أم بقدوم جعفر». وكان عدد من قدم في السفينتين ستة عشر رجلًا، وعدد من بقي أو قدم بعد ذلك أو هلك بأرض الحبشة أربعة وثلاثون رجلًا، وبلغ عدد المهاجرات إلى الحبشة في جملتهن، من قدم ومن هلك هناك، ست عشرة امرأة سوى بناتهن المولودات هناك."
  en: "After Hudaybiyya, the Prophet sent Amr ibn Umayya al-Damri to the Negus, who transported the remaining Muslim emigrants in two ships to the Prophet at Khaybar after the conquest. The Prophet received Ja'far with a kiss between the eyes, saying 'I do not know which gives me greater joy — the opening of Khaybar or the arrival of Ja'far.' Sixteen men came on the two ships; thirty-four others came later or died in Abyssinia; sixteen women emigrated in all, counting those who came back and those who died there, apart from daughters born there."
  es: "Tras la conquista de Hudaybiyya, el Profeta envió a Amr ibn Umayya al-Damri al Negus, quien transportó a los emigrantes musulmanes restantes en dos barcos hasta Khaybar. El Profeta recibió a Ja'far con un beso entre los ojos, diciendo: «No sé qué me produce mayor alegría: la apertura de Khaybar o la llegada de Ja'far». Dieciséis hombres llegaron en los dos barcos; otros treinta y cuatro llegaron más tarde o murieron en Abisinia; dieciséis mujeres emigraron en total, contando a las que regresaron y a las que murieron allí, sin contar a las hijas nacidas en Abisinia."
  fr: "Après Hudaybiyya, le Prophète envoya Amr ibn Umayya al-Damri auprès du Négus, qui transporta les derniers émigrants musulmans sur deux navires jusqu'au Prophète à Khaybar après la conquête. Le Prophète accueillit Ja'far d'un baiser entre les yeux, disant: « Je ne sais ce qui me réjouit le plus: la prise de Khaybar ou l'arrivée de Ja'far. » Seize hommes arrivèrent sur les deux navires; trente-quatre autres arrivèrent plus tard ou moururent en Abyssinie; seize femmes émigrèrent au total, en comptant celles qui revinrent et celles qui moururent sur place, sans compter les filles nées en Abyssinie."
  ur: "حدیبیہ کے بعد نبی نے عمرو بن امیہ الدمری کو نجاشی کے پاس بھیجا، جس نے فتح کے بعد بقیہ مسلمان مہاجرین کو دو بحری جہازوں میں نبی کے پاس پہنچایا۔ نبی نے جعفر کو آنکھوں کے درمیان بوسہ دیتے ہوئے کہا، 'میں نہیں جانتا کہ مجھے زیادہ خوشی کون سی ہے، خیبر کا کھلنا یا جعفر کی آمد'۔ دونوں جہازوں پر سولہ آدمی آئے۔ مزید چونتیس بعد میں آئے یا حبشہ میں مر گئے۔ وہاں پیدا ہونے والی بیٹیوں کے علاوہ، واپس آنے والوں اور وہاں مرنے والوں کی تعداد میں، مجموعی طور پر سولہ خواتین نے ہجرت کی۔"
