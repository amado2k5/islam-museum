label: { ar: "قدوم مهاجري الحبشة مع جعفر بن أبي طالب", en: "Return of the Abyssinian emigrants with Ja'far ibn Abi Talib" }
summary:
  ar: "بعد صلح الحديبية أرسل النبي عمرو بن أمية الضمري إلى النجاشي، فحمل النجاشي المهاجرين في سفينتين فقدموا على النبي وهو بخيبر بعد فتحه. استقبل النبي جعفر بن أبي طالب بالتقبيل بين عينيه وقال: «ما أدري بأيهما أنا أسر: بفتح خيبر أم بقدوم جعفر». وكان عدد من قدم في السفينتين ستة عشر رجلًا، وعدد من بقي أو قدم بعد ذلك أو هلك بأرض الحبشة أربعة وثلاثون رجلًا، وبلغ عدد المهاجرات إلى الحبشة في جملتهن، من قدم ومن هلك هناك، ست عشرة امرأة سوى بناتهن المولودات هناك."
  en: "After Hudaybiyya, the Prophet sent Amr ibn Umayya al-Damri to the Negus, who transported the remaining Muslim emigrants in two ships to the Prophet at Khaybar after the conquest. The Prophet received Ja'far with a kiss between the eyes, saying 'I do not know which gives me greater joy — the opening of Khaybar or the arrival of Ja'far.' Sixteen men came on the two ships; thirty-four others came later or died in Abyssinia; sixteen women emigrated in all, counting those who came back and those who died there, apart from daughters born there."
