label:
  ar: "رحلة الخطيب إلى نيسابور وإصبهان وهو ابن ثلاث وعشرين، ٤١٥هـ"
  en: "Al-Khatib journeys to Nishapur and Isfahan at twenty-three, 415/1024"
  ur: "تئیس برس کی عمر میں خطیب کا نیشاپور اور اصفہان کا سفر، 415ھ/1024ء"
  es: "Al-Khatib viaja a Nishapur e Isfahán a los veintitrés años, 415/1024"
  fr: "Al-Khatib se rend à Nishapur et à Ispahan à l'âge de vingt-trois ans, 415/1024."
  tr: "El-Hatib'in yirmi üç yaşındayken, Hicri 415 yılında Nişapur ve İsfahan'a yaptığı yolculuk."
  id: "Perjalanan Al-Khatib ke Nishapur dan Isfahan ketika ia berusia dua puluh tiga tahun, 415 H."
summary:
  ar: "رحل الخطيب إلى نيسابور وهو ابن ثلاث وعشرين سنة، ثم رحل إلى إصبهان؛ وكان قد استشار البرقاني في الرحلة إلى ابن النحاس بمصر أو إلى أصحاب الأصم بنيسابور، فقال له: إن خرجت إلى مصر تخرج إلى رجل واحد إن فاتك ضاعت رحلتك، وإن خرجت إلى نيسابور ففيها جماعة إن فاتك واحد أدركت من بقي، فخرج إلى نيسابور؛ وكتب معه البرقاني كتاباً إلى أبي نعيم يوصيه به {cite:tarikh-islam-dhahabi pp. 87-91}."
  en: "Al-Khatib travelled to Nishapur at twenty-three and then on to Isfahan. He had consulted al-Barqani whether to journey to Ibn al-Nahhas in Egypt or to the circle of al-Asamm's companions at Nishapur; al-Barqani told him that in Egypt there was one man and the journey would be lost if he missed him, while Nishapur held many — and wrote with him a letter of recommendation to Abu Nu'aym {cite:tarikh-islam-dhahabi pp. 87-91}."
  ur: "خطیب تئیس برس کی عمر میں نیشاپور گئے اور پھر اصفہان۔ انہوں نے برقانی سے مشورہ کیا کہ مصر میں ابن النحاس کے پاس جائیں یا نیشاپور میں اصحابِ اصم کے پاس؛ برقانی نے کہا مصر میں ایک ہی شخص ہے، نیشاپور میں جماعت ہے — اور ابو نعیم کے نام سفارشی خط بھی لکھوایا {cite:tarikh-islam-dhahabi pp. 87-91}۔"
  es: "Al-Khatib viajó a Nishapur a los veintitrés años y luego a Isfahán. Había consultado con al-Barqani sobre si debía viajar a Egipto para ver a Ibn al-Nahhas o al círculo de compañeros de al-Asamm en Nishapur; al-Barqani le dijo que en Egipto solo había un hombre y que el viaje sería en vano si no lo encontraba, mientras que en Nishapur había muchos, y escribió con él una carta de recomendación para Abu Nu'aym {cite:tarikh-islam-dhahabi pp. 87-91}."
  fr: "Al-Khatib se rendit à Nishapur à l'âge de vingt-trois ans, puis à Ispahan. Il avait consulté al-Barqani pour savoir s'il devait se rendre auprès d'Ibn al-Nahhas en Égypte ou auprès du cercle des compagnons d'al-Asamm à Nishapur; al-Barqani lui expliqua qu'en Égypte, il n'y avait qu'un seul homme et que le voyage serait perdu s'il ne le rencontrait pas, tandis qu'à Nishapur, il y en avait plusieurs – et il écrivit avec lui une lettre de recommandation pour Abu Nu'aym {cite:tarikh-islam-dhahabi pp. 87-91}."
  tr: "El-Hatib yirmi üç yaşındayken Nişapur'a, ardından da İsfahan'a gitti. Mısır'daki İbn el-Nahaşa'ya mı yoksa Nişapur'daki El-Asamm'ın arkadaşlarına mı gideceği konusunda El-Barqani'ye danıştı ve El-Barqani ona şöyle dedi: \"Mısır'a gidersen, tek bir kişiye gideceksin ve onu kaçırırsan yolculuğun boşa gidecek. Nişapur'a gidersen, orada bir grup var ve birini kaçırırsan, diğerlerine yetişirsin.\" Böylece El-Hatib Nişapur'a gitti ve El-Barqani onunla birlikte Ebu Nu'aym'a bir mektup yazarak onu tavsiye etti. {Kaynak:tarikh-islam-dhahabi s. 87-91}"
  id: "Al-Khatib melakukan perjalanan ke Nishapur ketika berusia dua puluh tiga tahun, kemudian ia melakukan perjalanan ke Isfahan. Ia telah berkonsultasi dengan Al-Barqani tentang perjalanan menemui Ibn Al-Nahhas di Mesir atau kepada para sahabat Al-Asamm di Nishapur, dan Al-Barqani berkata kepadanya: Jika kamu pergi ke Mesir, kamu hanya akan menemui satu orang, dan jika kamu melewatkannya, perjalananmu akan sia-sia. Jika kamu pergi ke Nishapur, ada sekelompok orang di sana, dan jika kamu melewatkan satu orang, kamu akan menyusul yang lain. Maka ia pergi ke Nishapur, dan Al-Barqani menulis surat bersamanya kepada Abu Nu’aym, merekomendasikannya kepadanya. {cite:tarikh-islam-dhahabi pp. 87-91}"
