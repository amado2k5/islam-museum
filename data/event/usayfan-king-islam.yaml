label: { ar: "إسلام ملك العسيفان", en: "The Conversion of al-Usayfan's King", es: "La conversión del rey de al-Usayfan", fr: "La conversion du roi d'al-Usayfan", ur: "اُسیفان کے بادشاہ کی تبدیلی", tr: "İslam Malik Al-Asifan", id: "Islam Malik Al-Asifan" }
summary:
  ar: "بلد يدعى العسيفان بين قشمير والملتان وكابل كان له ملك عاقل وكان أهل ذلك البلد يعبدون صنماً قد بني عليه بيت وأبدوه فمرض ابن الملك فدعا سدنة ذلك البيت فقال لهم ادعوا الصنم أن يبرئ ابني فغابوا عنه ساعة ثم أتوه فقالوا قد دعوناه وقد أجابنا إلى ما سألناه فلم يلبث الغلام أن مات فوثب الملك على البيت فهدمه وعلى الصنم فكسره وعلى السدنة فقتلهم ثم دعا قوماً من تجار المسلمين فعرضوا عليه التوحيد فوحد وأسلم وكان ذلك في خلافة المعتصم."
  en: "At al-Usayfan between Kashmir, Multan and Kabul, a king begged his idol's sadins to pray for his sick son — they claimed its answer, the boy died, and he demolished the shrine, broke the idol, slew the sadins — then summoned Muslim merchants who taught him tawhid, and he converted under al-Mu'tasim."
  es: "En al-Usayfan, entre Cachemira, Multan y Kabul, un rey suplicó a los sadiníes de su ídolo que rezaran por su hijo enfermo; ellos afirmaron que la oración había respondido, el niño murió, y él demolió el santuario, rompió el ídolo, mató a los sadiníes, luego convocó a mercaderes musulmanes que le enseñaron el tawhid, y se convirtió bajo la guía de al-Mu'tasim."
  fr: "À al-Usayfan, entre le Cachemire, Multan et Kaboul, un roi supplia les sadins de son idole de prier pour son fils malade; ils prétendirent que leur prière avait été exaucée, le garçon mourut, et il détruisit le sanctuaire, brisa l'idole, tua les sadins, puis fit appel à des marchands musulmans qui lui enseignèrent le tawhid, et il se convertit sous l'égide d'al-Mu'tasim."
  ur: "کشمیر، ملتان اور کابل کے درمیان الاسیفان کے مقام پر، ایک بادشاہ نے اپنے بت کے سدینوں سے اپنے بیمار بیٹے کے لیے دعا کرنے کی التجا کی - انہوں نے اس کے جواب کا دعویٰ کیا، لڑکا مر گیا، اور اس نے مزار کو توڑ دیا، بت توڑ دیا، سادین کو مار ڈالا - پھر مسلمان تاجروں کو بلوایا جنہوں نے اسے توحید کا درس دیا، اور اس نے التماس کو قبول کیا۔"
  tr: "Keşmir, Multan ve Kabil arasında bulunan El-Asifan adlı bir ülkenin bilge bir kralı vardı. Bu ülkenin halkı, üzerine bir ev inşa edilmiş ve sergilenmiş bir puta tapıyordu. Kralın oğlu hastalanınca, evin bekçilerini çağırdı ve oğlunu iyileştirmesi için putu çağırmalarını söyledi. Bekçiler bir saat boyunca yok oldular, sonra gelip, \"Onu çağırdık ve isteğimizi yerine getirdi\" dediler. Çocuk kısa süre sonra öldü, bunun üzerine kral eve atlayıp yıktı, puta atlayıp kırdı ve bekçilere de saldırıp öldürdü. Sonra bazı Müslüman tüccarları çağırdı ve onlar ona tevhid inancını anlattılar, böylece kral tevhid inancını benimsedi ve İslam'a geçti. Bu olay, El-Mu'tasim halifeliği döneminde gerçekleşti."
  id: "Suatu negeri bernama Al-Asifan, yang terletak di antara Kashmir, Multan, dan Kabul, memiliki seorang raja yang bijaksana. Penduduk negeri itu menyembah sebuah berhala yang di atasnya dibangun sebuah rumah dan dipajang. Putra raja jatuh sakit, sehingga ia memanggil para penjaga rumah itu dan menyuruh mereka memanggil berhala tersebut untuk menyembuhkan putranya. Mereka tidak ada di tempat selama satu jam, kemudian mereka datang kepadanya dan berkata, “Kami telah memanggilnya, dan ia mengabulkan permintaan kami.” Anak itu segera meninggal, sehingga raja melompat ke atas rumah dan menghancurkannya, ke atas berhala dan memecahkannya, dan ke atas para penjaga dan membunuh mereka. Kemudian ia memanggil beberapa pedagang Muslim, dan mereka memperkenalkan monoteisme kepadanya, sehingga ia memeluk monoteisme dan masuk Islam. Peristiwa ini terjadi pada masa kekhalifahan Al-Mu’tasim."
