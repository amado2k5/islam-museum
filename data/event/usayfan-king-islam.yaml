label: { ar: "إسلام ملك العسيفان", en: "The Conversion of al-Usayfan's King", es: "La conversión del rey de al-Usayfan", fr: "La conversion du roi d'al-Usayfan" }
summary:
  ar: "بلد يدعى العسيفان بين قشمير والملتان وكابل كان له ملك عاقل وكان أهل ذلك البلد يعبدون صنماً قد بني عليه بيت وأبدوه فمرض ابن الملك فدعا سدنة ذلك البيت فقال لهم ادعوا الصنم أن يبرئ ابني فغابوا عنه ساعة ثم أتوه فقالوا قد دعوناه وقد أجابنا إلى ما سألناه فلم يلبث الغلام أن مات فوثب الملك على البيت فهدمه وعلى الصنم فكسره وعلى السدنة فقتلهم ثم دعا قوماً من تجار المسلمين فعرضوا عليه التوحيد فوحد وأسلم وكان ذلك في خلافة المعتصم."
  en: "At al-Usayfan between Kashmir, Multan and Kabul, a king begged his idol's sadins to pray for his sick son — they claimed its answer, the boy died, and he demolished the shrine, broke the idol, slew the sadins — then summoned Muslim merchants who taught him tawhid, and he converted under al-Mu'tasim."
  es: "En al-Usayfan, entre Cachemira, Multan y Kabul, un rey suplicó a los sadiníes de su ídolo que rezaran por su hijo enfermo; ellos afirmaron que la oración había respondido, el niño murió, y él demolió el santuario, rompió el ídolo, mató a los sadiníes, luego convocó a mercaderes musulmanes que le enseñaron el tawhid, y se convirtió bajo la guía de al-Mu'tasim."
  fr: "À al-Usayfan, entre le Cachemire, Multan et Kaboul, un roi supplia les sadins de son idole de prier pour son fils malade; ils prétendirent que leur prière avait été exaucée, le garçon mourut, et il détruisit le sanctuaire, brisa l'idole, tua les sadins, puis fit appel à des marchands musulmans qui lui enseignèrent le tawhid, et il se convertit sous l'égide d'al-Mu'tasim."
