id: event/ibn-hanash-and-ibn-harnud-bring-al-daam-and-abu-al-qasim-to-shibam-288
class: event
kind: other
label:
  ar: "ابن حنش وابن حرنود يأتيان بالدعام وأبي القاسم إلى شبام، جمادى الآخرة 288هـ"
  en: "Ibn Hanash and Ibn Harnud bring al-Da'am and Abu al-Qasim to Shibam, Jumada II 288 AH"
  ur: "ابن حنش اور ابن حرنود دعام اور ابو القاسم کو شبام لے آتے ہیں، جمادی الآخرہ 288ھ"
summary:
  ar: "رأى عبيد الله بن حنش رجوع الجند إلى صنعاء فأخبر علي بن سليمان أن الخبر قبيح وأن خروجه خير، فخرج هو وأحمد بن حرنود إلى الدعام بن إبراهيم يستنهضانه إلى الهادي، فجمع الدعام عسكراً كثيفاً وكتب إلى أبي القاسم فالتقيا بريدة وساروا إلى شبام، ثم عزم الهادي على توجيههم إلى صنعاء."
  en: "Ubaydallah ibn Hanash, seeing the troops return to Sana'a, told Ali ibn Sulayman the news was bad and that his leaving was better, and he and Ahmad ibn Harnud went to al-Da'am ibn Ibrahim to rouse him to al-Hadi; al-Da'am gathered a dense army and wrote to Abu al-Qasim, they met at Raydah and went on to Shibam, and al-Hadi then resolved to send them to Sana'a."
  ur: "عبید اللہ بن حنش نے سپاہیوں کو صنعاء لوٹتے دیکھا تو علی بن سلیمان سے کہا کہ خبر بری ہے اور ان کا جانا بہتر ہے، اور وہ اور احمد بن حرنود دعام بن ابراہیم کے پاس گئے کہ اسے ہادی کی طرف اٹھائیں؛ دعام نے گھنا لشکر جمع کیا اور ابو القاسم کو لکھا، وہ ریدہ میں ملے اور شبام کی طرف چلے، پھر ہادی نے انہیں صنعاء بھیجنے کا ارادہ کیا۔"
