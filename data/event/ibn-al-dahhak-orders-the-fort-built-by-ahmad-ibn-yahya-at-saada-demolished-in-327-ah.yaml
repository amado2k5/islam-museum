id: "event/ibn-al-dahhak-orders-the-fort-built-by-ahmad-ibn-yahya-at-saada-demolished-in-327-ah"
class: event
kind: other
label:
  ar: "يأمر ابن الضحاك بهدم الحصن الذي بناه أحمد بن يحيى في صعدة، بعد ربيع الآخر سنة 327هـ، ص413"
  en: "Ibn al-Dahhak orders the fort built by Ahmad ibn Yahya at Saada demolished, after Rabi II 327 AH, p. 413"
  ur: "ابن الضحاک احمد بن یحییٰ کے بنائے ہوئے صعدہ کے قلعے کو گرانے کا حکم دیتا ہے، ربیع الآخر 327ھ کے بعد، ص413"
  es: "Ibn al-Dahhak ordena la demolición del fuerte construido por Ahmad ibn Yahya en Saada, después de Rabi II 327 AH, pág. 413."
summary:
  ar: "يقيم ابن الضحاك بصعدة فيأمر بهدم الحصن الذي بناه أحمد بن يحيى، ويعطيه الأكيليون الطاعة، ويجبي المكس ممن دخل شق أكيل، فيتفرق عنه تجار صنعاء، وتشكو بنو سعد إلى القاسم فيعود إلى الجمع."
  en: "Ibn al-Dahhak stays in Saada and orders the fort built by Ahmad ibn Yahya demolished, and the Akil give him their obedience. He takes the maks tax from those in the Akil quarter. The Sanaa merchants scatter, and Banu Sa'd write to al-Qasim, who gathers his men again."
  ur: "ابن الضحاک صعدہ میں ٹھہرتا ہے اور احمد بن یحییٰ کے بنائے ہوئے قلعے کو گرانے کا حکم دیتا ہے، اکیلی اس کی اطاعت کرتے ہیں، وہ اکیلی محلے والوں سے محصول لیتا ہے۔ صنعانی تاجر منتشر ہو جاتے ہیں، اور بنو سعد قاسم کو لکھتے ہیں تو وہ دوبارہ لوگوں کو جمع کرتا ہے۔"
  es: "Ibn al-Dahhak se queda en Saada y ordena la demolición de la fortaleza construida por Ahmad ibn Yahya, y los Akil le rinden pleitesía. Cobra el impuesto maks a los habitantes del barrio Akil. Los mercaderes de Sanaa se dispersan, y los Banu Sa'd escriben a al-Qasim, quien reúne de nuevo a sus hombres."
