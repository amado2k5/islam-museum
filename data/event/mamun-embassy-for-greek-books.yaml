  ur: "مامون نے بازنطینی بادشاہ سے قدیم علوم کی کتابیں لینے کی اجازت چاہی اور حجاج ابن مطر، ابن البطریق اور بیت الحکمہ کے سردار سلم کو بھیجا {cite:duha-islam p. 426-427} {cite:fihrist-ibn-al-nadim}."
