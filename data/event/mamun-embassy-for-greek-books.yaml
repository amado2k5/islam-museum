id: event/mamun-embassy-for-greek-books
class: event
kind: other
label: { ar: "بعثة المأمون في طلب كتب اليونان", en: "Al-Ma'mun's embassy for the Greek books", es: "La embajada de Al-Ma'mun para los libros griegos", fr: "L'ambassade d'Al-Ma'mun pour les livres grecs", ur: "المامون کا سفارت خانہ یونانی کتب کے لیے", tr: "El-Ma'mun'un Yunan kitaplarını arama görevi", id: "Misi Al-Ma'mun untuk mencari buku-buku Yunani" }
summary:
  ar: "راسل المأمون ملك الروم يستأذنه في إنفاذ ما يختار من العلوم القديمة، فأخرج في طلبها الحجاج بن مطر وابن البطريق وسلماً صاحب بيت الحكمة {cite:duha-islam p. 426-427} {cite:fihrist-ibn-al-nadim}."
  en: "Al-Maʾmūn wrote to the Byzantine king for leave to fetch the ancient sciences stored in his lands, and sent out for them al-Ḥajjāj ibn Maṭar, Ibn al-Biṭrīq and Salm, master of the Bayt al-Ḥikma {cite:duha-islam p. 426-427} {cite:fihrist-ibn-al-nadim}."
  ur: "مامون نے بازنطینی بادشاہ سے قدیم علوم کی کتابیں لینے کی اجازت چاہی اور حجاج ابن مطر، ابن البطریق اور بیت الحکمہ کے سردار سلم کو بھیجا {cite:duha-islam p. 426-427} {cite:fihrist-ibn-al-nadim}."
  es: "Al-Maʾmūn escribió al rey bizantino para pedirle permiso para traer las ciencias antiguas almacenadas en sus tierras, y mandó llamar a al-Ḥajjāj ibn Maṭar, Ibn al-Biṭrīq y Salm, maestro de la Bayt al-Ḥikma {cite:duha-islam p. 426-427} {cite:fihrist-ibn-al-nadim}."
  fr: "Al-Maʾmūn écrivit au roi byzantin pour obtenir la permission d'aller chercher les sciences anciennes stockées sur ses terres, et envoya pour elles al-Ḥajjāj ibn Maṭar, Ibn al-Biṭrīq et Salm, maître du Bayt al-Ḥikma {cite:duha-islam p. 426-427} {cite:fihrist-ibn-al-nadim}."
  tr: "El-Ma'mun, eski ilimlerden seçtiklerini uygulamak için Roma Kralı'ndan izin istedi; bunun üzerine Kral, bu ilimleri bulmak için El-Haccac bin Matar, İbn el-Batrik ve Bilgelik Evi'nin sahibi Salma'yı görevlendirdi. {cite:duha-islam s. 426-427} {cite:fihrist-ibn-al-nadim}."
  id: "Al-Ma’mun menulis surat kepada Raja Romawi untuk meminta izinnya menerapkan apa yang dipilihnya dari ilmu-ilmu kuno, maka ia mengutus Al-Hajjaj bin Matar, Ibn Al-Batriq, dan Salma, pemilik Baitul Hikmah, untuk mencari ilmu-ilmu tersebut. {cite:duha-islam hlm. 426-427} {cite:fihrist-ibn-al-nadim}."
