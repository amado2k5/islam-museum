id: event/bilal-and-shaytan-on-the-night-journey
class: event
kind: other
label:
  ar: "الشيطان ينام بلالاً في سفر مكة"
  en: "The shaytan lays Bilal down in the Mecca journey"
  ur: "شیطان مکہ کے سفر میں بلال کو سلوا دیتا ہے"
  fr: "Le shaytan endort Bilal lors du voyage vers La Mecque"
  es: "El shaytán deja a Bilal en el camino a La Meca."
  tr: "Şeytan, Mekke yolculuğu sırasında Bilal'i uyutur."
  id: "Setan membuat Bilal tertidur selama perjalanan ke Mekah."
summary:
  ar: "أخبر النبي أن الشيطان أتى بلالاً وهو قائم يصلي فأضجعه وهدّأه كما يهدّأ الصبي حتى نام، وأخبر أن في ذلك الوادي شيطاناً {cite:muwatta-maruf-1997} [[passage/muwatta-1-026|الموطأ 26]]."
  en: "The Prophet reported that the shaytan came to Bilal while he stood praying and laid him down and soothed him like a child until he slept; and he reported that there is a shaytan in that valley {cite:muwatta-maruf-1997} [[passage/muwatta-1-026|Muwatta 26]]."
  ur: "نبی نے خبر دی کہ شیطان بلال کے پاس آیا جب وہ کھڑے نماز پڑھ رہے تھے اور اسے لٹا کر بچے کی طرح سکون دیا یہاں تک کہ وہ سو گئے؛ اور اس نے بتایا کہ اس وادی میں ایک شیطان ہے {cite:muwatta-maruf-1997} [[passage/muwatta-1-026|موطأ 26]]۔"
  fr: "Le Prophète rapporta que le shaytan vint à Bilal alors qu'il se tenait debout en prière, le coucha et le berça comme un enfant jusqu'à ce qu'il s'endorme ; et il rapporta qu'il y a un shaytan dans cette vallée {cite:muwatta-maruf-1997} [[passage/muwatta-1-026|Muwatta 26]]."
  es: "El Profeta informó que el shaytan vino a Bilal mientras estaba orando y lo acostó y lo calmó como a un niño hasta que se durmió; y informó que hay un shaytan en ese valle {cite:muwatta-maruf-1997} [[passage/muwatta-1-026|Muwatta 26]]."
  tr: "Peygamberimiz şöyle buyurmuştur: Bilal namaz kılarken şeytan ona geldi, o da Bilal'i yere yatırdı ve bir çocuğu sakinleştirir gibi onu uyuttu. Ayrıca o vadide bir şeytan olduğunu da bildirmiştir. {cite:muwatta-maruf-1997} [[passage/muwatta-1-026|Al-Muwatta 26]]."
  id: "Nabi menceritakan bahwa Setan datang kepada Bilal ketika ia sedang berdiri shalat, lalu beliau membaringkannya dan menenangkannya seperti menenangkan seorang anak kecil hingga tertidur. Beliau juga menceritakan bahwa ada Setan di lembah itu. {cite:muwatta-maruf-1997} [[passage/muwatta-1-026|Al-Muwatta 26]]."
