id: event/bilal-and-shaytan-on-the-night-journey
class: event
kind: other
label:
  ar: "الشيطان ينام بلالاً في سفر مكة"
  en: "The shaytan lays Bilal down in the Mecca journey"
  ur: "شیطان مکہ کے سفر میں بلال کو سلوا دیتا ہے"
summary:
  ar: "أخبر النبي أن الشيطان أتى بلالاً وهو قائم يصلي فأضجعه وهدّأه كما يهدّأ الصبي حتى نام، وأخبر أن في ذلك الوادي شيطاناً {cite:muwatta-maruf-1997} [[passage/muwatta-1-026|الموطأ 26]]."
  en: "The Prophet reported that the shaytan came to Bilal while he stood praying and laid him down and soothed him like a child until he slept; and he reported that there is a shaytan in that valley {cite:muwatta-maruf-1997} [[passage/muwatta-1-026|Muwatta 26]]."
  ur: "نبی نے خبر دی کہ شیطان بلال کے پاس آیا جب وہ کھڑے نماز پڑھ رہے تھے اور اسے لٹا کر بچے کی طرح سکون دیا یہاں تک کہ وہ سو گئے؛ اور اس نے بتایا کہ اس وادی میں ایک شیطان ہے {cite:muwatta-maruf-1997} [[passage/muwatta-1-026|موطأ 26]]۔"
