label: { ar: "فتح النوبة وأسر ملك دنقلة", en: "The Conquest of Nubia and the Capture of the King of Dunqula", es: "La conquista de Nubia y la captura del rey de Dunquala", fr: "La conquête de la Nubie et la capture du roi de Dunqula", ur: "نوبیا کی فتح اور ڈنکولا کے بادشاہ کی گرفتاری۔" }
summary:
  ar: "وفي سنة أربع وسبعين وجه السلطان جيشاً إلى النوبة ودنقلة فانتصروا وأسر ملك النوبة وأرسل به إلى الملك الظاهر ووضعت الجزية على أهل دنقلة والله الحمد قال الذهبي وأول ما غزيت النوبة في سنة إحدى وثلاثين من الهجرة غزاها عبد الله بن أبي سرح في خمسة آلاف فارس ولم يفتحها فهادنهم ورجع ثم غزيت في زمن هشام ولم تفتح ثم في زمن المنصور ثم غزاها تكين التركي ثم كافور الإخشيدي ثم ناصر الدولة ابن حمدان ثم توران شاه أخو السلطان صلاح الدين في سنة ثمان وستين وخمس مئة ولم تفتح إلى هذا العام وقال في ذلك ابن عبد الظاهر هذا هو الفتح لا شيء سمعت به في شاهد العين لا ما في الأسانيد {cite:tarikh-khulafa-minhaj-1434 p. 728}."
  en: "In 674 Baybars sent an army to Nubia and Dunqula: victorious, they captured Nubia's king and laid the jizya on Dunqula's people — the first true conquest. Al-Dhahabi lists the failed attempts: Abd Allah ibn Abi Sarh's five thousand in 31 — a truce, no conquest — then under Hisham, al-Mansur, Takin the Turk, Kafur the Ikhshid, Nasir al-Dawla ibn Hamdan, and Saladin's brother Turanshah in 568. Ibn Abd al-Zahir: 'This is the conquest — nothing you've heard of; seen by the eye, not found in isnads' {cite:tarikh-khulafa-minhaj-1434 p. 728}."
  es: "En 674, Baybars envió un ejército a Nubia y Dunqula: victoriosos, capturaron al rey de Nubia e impusieron la jizya al pueblo de Dunqula, la primera conquista verdadera. Al-Dhahabi enumera los intentos fallidos: los cinco mil de Abd Allah ibn Abi Sarh en 31 (una tregua, sin conquista); luego, bajo Hisham, al-Mansur, Takin el Turco, Kafur el Ikhshid, Nasir al-Dawla ibn Hamdan y Turanshah, hermano de Saladino, en 568. Ibn Abd al-Zahir: «Esta es la conquista: nada que hayas oído; vista con los propios ojos, no encontrada en isnads» {cite:tarikh-khulafa-minhaj-1434 p. 728}."
  fr: "En 674, Baybars envoya une armée en Nubie et à Dunqula: victorieux, ils capturèrent le roi de Nubie et imposèrent la jizya aux habitants de Dunqula – la première véritable conquête. Al-Dhahabi recense les tentatives infructueuses: les cinq mille hommes d’Abd Allah ibn Abi Sarh en 31 – une trêve, sans conquête – puis celles de Hisham, al-Mansur, Takin le Turc, Kafur l’Ikhshid, Nasir al-Dawla ibn Hamdan, et Turanshah, frère de Saladin, en 568. Ibn Abd al-Zahir: « Voici la conquête – dont vous n’avez jamais entendu parler; vue de vos propres yeux, non consignée dans les isnads » {cite: tarikh-khulafa-minhaj-1434 p. 728}."
  ur: "674 میں Baybars نے Nubia اور Dunqula کی طرف ایک فوج بھیجی: فاتحانہ طور پر، انہوں نے Nubia کے بادشاہ کو پکڑ لیا اور Duncula کے لوگوں پر جزیہ ڈال دیا - پہلی حقیقی فتح۔ الذہبی ناکام کوششوں کی فہرست دیتا ہے: عبد اللہ ابن ابی سرح کی 31 میں پانچ ہزار - ایک جنگ بندی، کوئی فتح نہیں - پھر ہشام، المنصور، تکن ترک، کافور اخشد، ناصر الدولہ ابن حمدان، اور صلاح الدین کے بھائی ترانشاہ کی قیادت میں - یہ فتح 568 میں عبد اللہ بن ابی سرح کی کچھ بھی نہیں ہے۔ آپ نے سنا ہے؛ آنکھ سے دیکھا، اسناد میں نہیں ملتا۔ 728}۔"
