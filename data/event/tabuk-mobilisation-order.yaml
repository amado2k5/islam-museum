id: event/tabuk-mobilisation-order
class: event
kind: other
label: { ar: "أمر النبي الناس بالتهيؤ لغزو الروم", en: "The Prophet orders the people to prepare to fight the Byzantines", es: "El Profeta ordena al pueblo que se prepare para luchar contra los bizantinos.", fr: "Le Prophète ordonne au peuple de se préparer à combattre les Byzantins.", ur: "پیغمبر لوگوں کو بازنطینیوں سے لڑنے کے لئے تیار رہنے کا حکم دیتے ہیں۔", tr: "Peygamber, halka Romalıların istilasına karşı hazırlık yapmalarını emretti.", id: "Nabi memerintahkan umat Islam untuk bersiap menghadapi invasi bangsa Romawi." }
summary:
  ar: "قال ابن إسحاق إن النبي أقام بالمدينة من ذي الحجة إلى رجب، ثم أمر الناس بالتهيؤ لغزو الروم، في زمن عسرة وشدة حر وجدب وحين طابت الثمار؛ وكان قلّما يخرج في غزوة إلا كنّى عنها، إلا غزوة تبوك فقد بيّنها للناس لبعد الشقة وشدة الزمان وكثرة العدو."
  en: "Ibn Ishaq says the Prophet stayed in Medina from Dhu al-Hijja to Rajab, then ordered the people to prepare for the campaign against the Byzantines — in a time of hardship, fierce heat and drought, when the fruit had ripened. He rarely went on a campaign without concealing its destination, but for Tabuk he declared it plainly because the distance was far, the time harsh and the enemy many."
  es: "Ibn Ishaq afirma que el Profeta permaneció en Medina desde Dhu al-Hijja hasta Rajab, y luego ordenó a la gente que se preparara para la campaña contra los bizantinos, en una época de penurias, calor intenso y sequía, cuando la fruta estaba madura. Rara vez emprendía una campaña sin ocultar su destino, pero para Tabuk lo declaró abiertamente, pues la distancia era grande, el tiempo adverso y el enemigo numeroso."
  fr: "Ibn Ishaq rapporte que le Prophète séjourna à Médine de Dhu al-Hijja à Rajab, puis ordonna au peuple de se préparer à la campagne contre les Byzantins – en une période de grandes difficultés, de chaleur intense et de sécheresse, alors que les fruits étaient mûrs. Il partait rarement en campagne sans en dissimuler la destination, mais pour Tabuk, il la déclara ouvertement car la distance était grande, le temps rude et l'ennemi nombreux."
  ur: "ابن اسحاق کہتے ہیں کہ رسول اللہ نے مدینہ میں ذی الحجہ سے رجب تک قیام کیا، پھر لوگوں کو حکم دیا کہ بازنطینیوں کے خلاف مہم کے لیے تیاری کریں - سخت گرمی اور خشک سالی کے وقت، جب پھل پک چکے تھے۔ وہ شاذ و نادر ہی اپنی منزل کو چھپائے بغیر مہم پر نکلا، لیکن تبوک کے لیے اس نے صاف صاف اعلان کر دیا کیونکہ فاصلہ بہت دور، وقت سخت اور دشمن بہت تھے۔"
  tr: "İbn İshak, Peygamberin Zilhicce'den Receb'e kadar Medine'de kaldığını, daha sonra insanlara Romalıların istilasına karşı hazırlık yapmalarını emrettiğini, bunun da zorlu, aşırı sıcak ve kurak bir dönemde, meyvelerin olgunlaştığı bir zaman olduğunu söyledi. Tebük seferi hariç, nadiren dolaylı ifadeler kullanarak sefere çıkardı; Tebük seferini ise mesafe, zamanın zorluğu ve düşmanın sayısının fazla olması nedeniyle insanlara açıkladı."
  id: "Ibn Ishaq berkata bahwa Nabi tinggal di Madinah dari bulan Dzul Hijjah hingga Rajab, kemudian beliau memerintahkan orang-orang untuk bersiap menghadapi invasi Romawi, pada masa sulit, panas terik dan kekeringan, dan ketika buah-buahan sudah matang. Beliau jarang melakukan ekspedisi tanpa menggunakan kata-kata kiasan, kecuali ekspedisi ke Tabuk, yang beliau jelaskan kepada orang-orang karena jaraknya, beratnya waktu, dan banyaknya jumlah musuh."
