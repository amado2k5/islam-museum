label: { ar: "أمر النبي الناس بالتهيؤ لغزو الروم", en: "The Prophet orders the people to prepare to fight the Byzantines" }
summary:
  ar: "قال ابن إسحاق إن النبي أقام بالمدينة من ذي الحجة إلى رجب، ثم أمر الناس بالتهيؤ لغزو الروم، في زمن عسرة وشدة حر وجدب وحين طابت الثمار؛ وكان قلّما يخرج في غزوة إلا كنّى عنها، إلا غزوة تبوك فقد بيّنها للناس لبعد الشقة وشدة الزمان وكثرة العدو."
  en: "Ibn Ishaq says the Prophet stayed in Medina from Dhu al-Hijja to Rajab, then ordered the people to prepare for the campaign against the Byzantines — in a time of hardship, fierce heat and drought, when the fruit had ripened. He rarely went on a campaign without concealing its destination, but for Tabuk he declared it plainly because the distance was far, the time harsh and the enemy many."
