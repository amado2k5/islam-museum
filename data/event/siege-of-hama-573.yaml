label: { ar: "حصار الفرنج حماة", en: "Frankish siege of Hama" }
summary:
  ar: "في جمادى الأولى سنة ثلاث وسبعين وخمسمائة وصل من البحر كند كبير من الفرنج فاغتنم خلو البلاد وعود صلاح الدين منهزماً من الرملة، فجمع من بالشام من الفرنج وفرق فيهم الأموال وسار إلى حماة فحصرها أربعة أيام، وبها صاحبها شهاب الدين محمود الحارمي خال صلاح الدين وهو شديد المرض، فدخلها طائفة من العسكر الصلاحي أغاثوا أهلها، وهجم الفرنج بعض الأيام على طرف من البلد وكادوا يملكونه قسراً فاجتمع أهل البلد مع العسكر واستقتل المسلمون وحاموا عن الأنفس والأهل والمال حتى أخرجوهم إلى الظاهر ودام القتال ليلاً ونهاراً وأكثروا فيهم القتل فرحل الفرنج خائبين وساروا فحصروا حارم، ولما رحلوا عن حماة مات صاحبها شهاب الدين الحارمي وكان ابنه مات قبله بثلاثة أيام {cite:kamil-ibn-al-athir p. 86-87}."
  en: "In Jumada I of 573 a large Frankish contingent arrived by sea, seizing the chance of the land being empty after Salah al-Din's defeated return from Ramla. The Franks in Syria were gathered, money was distributed among them, and they marched on Hama, besieging it for four days. Its lord, Shihab al-Din Mahmud al-Harimi, Salah al-Din's maternal uncle, was gravely ill; a group of the Salahi army entered and relieved the people. One day the Franks attacked a section of the town and nearly took it by force, but the townspeople joined with the troops, and the Muslims fought with desperate resolve, defending lives, families and property, until they drove the enemy out to the open ground beyond the town. Fighting went on night and day, and the enemy suffered heavy slaughter. The Franks withdrew defeated and went on to besiege Harim. When they had left Hama, its lord al-Harimi died; his son had died three days before him {cite:kamil-ibn-al-athir p. 86-87}."
