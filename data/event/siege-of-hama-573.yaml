label: { ar: "حصار الفرنج حماة", en: "Frankish siege of Hama", es: "El asedio franco de Hama", fr: "Siège franc de Hama", ur: "حما کا فرینکش محاصرہ", tr: "Frankların Hama kuşatması", id: "Pengepungan Hama oleh bangsa Frank" }
summary:
  ar: "في جمادى الأولى سنة ثلاث وسبعين وخمسمائة وصل من البحر كند كبير من الفرنج فاغتنم خلو البلاد وعود صلاح الدين منهزماً من الرملة، فجمع من بالشام من الفرنج وفرق فيهم الأموال وسار إلى حماة فحصرها أربعة أيام، وبها صاحبها شهاب الدين محمود الحارمي خال صلاح الدين وهو شديد المرض، فدخلها طائفة من العسكر الصلاحي أغاثوا أهلها، وهجم الفرنج بعض الأيام على طرف من البلد وكادوا يملكونه قسراً فاجتمع أهل البلد مع العسكر واستقتل المسلمون وحاموا عن الأنفس والأهل والمال حتى أخرجوهم إلى الظاهر ودام القتال ليلاً ونهاراً وأكثروا فيهم القتل فرحل الفرنج خائبين وساروا فحصروا حارم، ولما رحلوا عن حماة مات صاحبها شهاب الدين الحارمي وكان ابنه مات قبله بثلاثة أيام {cite:kamil-ibn-al-athir p. 86-87}."
  en: "In Jumada I of 573 a large Frankish contingent arrived by sea, seizing the chance of the land being empty after Salah al-Din's defeated return from Ramla. The Franks in Syria were gathered, money was distributed among them, and they marched on Hama, besieging it for four days. Its lord, Shihab al-Din Mahmud al-Harimi, Salah al-Din's maternal uncle, was gravely ill; a group of the Salahi army entered and relieved the people. One day the Franks attacked a section of the town and nearly took it by force, but the townspeople joined with the troops, and the Muslims fought with desperate resolve, defending lives, families and property, until they drove the enemy out to the open ground beyond the town. Fighting went on night and day, and the enemy suffered heavy slaughter. The Franks withdrew defeated and went on to besiege Harim. When they had left Hama, its lord al-Harimi died; his son had died three days before him {cite:kamil-ibn-al-athir p. 86-87}."
  es: "En Jumada I de 573, un gran contingente franco llegó por mar, aprovechando que la tierra estaba deshabitada tras el regreso derrotado de Saladino de Ramla. Los francos de Siria se reunieron, se distribuyó dinero entre ellos y marcharon sobre Hama, sitiándola durante cuatro días. Su señor, Shihab al-Din Mahmud al-Harimi, tío materno de Saladino, estaba gravemente enfermo; un grupo del ejército salahí entró y socorrió a la población. Un día, los francos atacaron una sección de la ciudad y casi la tomaron por la fuerza, pero los habitantes se unieron a las tropas y los musulmanes lucharon con desesperada determinación, defendiendo vidas, familias y propiedades, hasta que expulsaron al enemigo a campo abierto, más allá de la ciudad. La lucha continuó día y noche, y el enemigo sufrió una gran matanza. Los francos se retiraron derrotados y procedieron a sitiar Harim. Cuando abandonaron Hama, su señor al-Harimi murió. Su hijo había muerto tres días antes que él {cite:kamil-ibn-al-athir p. 86-87}."
  fr: "En Jumada Ier 573, un important contingent franc arriva par la mer, profitant de la situation critique de la région après le retour victorieux de Saladin de Ramla. Les Francs de Syrie furent rassemblés, de l'argent leur fut distribué, et ils marchèrent sur Hama, qu'ils assiégèrent pendant quatre jours. Son seigneur, Shihab al-Din Mahmud al-Harimi, oncle maternel de Saladin, était gravement malade; un groupe de soldats salahiens entra dans la ville et porta secours à la population. Un jour, les Francs attaquèrent un quartier et faillirent s'en emparer, mais les habitants se joignirent aux troupes et les musulmans combattirent avec une détermination farouche, défendant leurs vies, leurs familles et leurs biens, jusqu'à repousser l'ennemi en rase campagne. Les combats se poursuivirent jour et nuit, et l'ennemi subit de lourdes pertes. Les Francs se retirèrent vaincus et assiégèrent Harim. Après leur départ de Hama, son seigneur al-Harimi mourut. son fils était mort trois jours avant lui {cite:kamil-ibn-al-athir p. 86-87}."
  ur: "573 کے جمادیہ اول میں ایک بڑا فرینک کا دستہ سمندر کے راستے پہنچا، صلاح الدین کی رملہ سے شکست خوردہ واپسی کے بعد زمین کے خالی ہونے کے موقع سے فائدہ اٹھایا۔ شام میں فرینک جمع ہوئے، ان میں پیسے تقسیم کیے گئے، اور حما پر چڑھ دوڑے، چار دن تک اس کا محاصرہ کیا۔ اس کے آقا، شہاب الدین محمود الحریمی، صلاح الدین کے ماموں، شدید بیمار تھے۔ صلاحی فوج کا ایک گروہ داخل ہوا اور لوگوں کو آرام پہنچایا۔ ایک دن فرینکوں نے قصبے کے ایک حصے پر حملہ کر دیا اور تقریباً اسے طاقت سے لے لیا، لیکن شہر کے لوگ فوج کے ساتھ شامل ہو گئے، اور مسلمان جان، خاندان اور املاک کا دفاع کرتے ہوئے بے صبری سے لڑتے رہے، یہاں تک کہ انہوں نے دشمن کو شہر سے باہر کھلے میدان میں بھگا دیا۔ رات دن لڑائی جاری رہی اور دشمن کو بہت زیادہ قتل وغارت کا سامنا کرنا پڑا۔ فرینک شکست کھا کر پیچھے ہٹ گئے اور حریم کا محاصرہ کرنے چلے گئے۔ جب وہ حما سے نکلے تو اس کا رب الحریمی فوت ہوگیا۔ اس کا بیٹا اس سے تین دن پہلے فوت ہو گیا تھا۔ 86-87}۔"
  tr: "Hicri 573 yılının Cemâdeü'l-Ula ayında, büyük bir Frank ordusu deniz yoluyla geldi. Boş araziden ve Selahaddin'in Ramla'dan yenilgiyle dönüşünden faydalanan Franklar, Suriye'deki Frankları topladı, aralarında para dağıttı ve Hama'ya doğru ilerleyerek şehri dört gün boyunca kuşattı. Şehrin yöneticisi, Selahaddin'in anne tarafından amcası Şihabeddin Mahmud Harami oradaydı ve çok hastaydı. Selahaddin'in ordusundan bir grup şehre girerek halkına yardım etti. Franklar birkaç gün boyunca şehrin bir bölümüne saldırdı ve neredeyse şehri zorla ele geçirdi. Şehir halkı orduya katıldı ve Müslümanlar, Frankları şehrin dışına sürene kadar kendilerini, ailelerini ve mallarını savunarak şiddetli bir şekilde savaştılar. Savaş gece gündüz devam etti ve birçok Frank öldürüldü. Franklar hayal kırıklığına uğrayarak ayrıldılar ve Harim'i kuşatmak için yürüdüler. Hama'dan ayrıldıklarında, şehrin yöneticisi Şihabeddin Harami ölmüştü. Oğlu da ondan üç gün önce ölmüştü. {alıntı: kamil-ibn-el-esir s. 86-87}"
  id: "Pada bulan Jumada al-Ula tahun 573 H, pasukan Frank yang besar tiba melalui laut. Memanfaatkan keadaan negara yang kosong dan kembalinya Saladin yang dikalahkan dari Ramla, mereka mengumpulkan orang-orang Frank di Suriah, membagikan uang di antara mereka, dan berbaris ke Hama, mengepungnya selama empat hari. Penguasanya, Shihab al-Din Mahmud al-Harami, paman dari pihak ibu Saladin, berada di sana dan sedang sakit parah. Sekelompok tentara Saladin memasuki kota dan datang untuk membantu penduduknya. Orang-orang Frank menyerang sebagian kota selama beberapa hari dan hampir merebutnya dengan paksa. Penduduk kota bergabung dengan tentara, dan kaum Muslim bertempur dengan sengit dan membela diri, keluarga, dan harta benda mereka sampai mereka mengusir mereka ke pinggiran kota. Pertempuran berlanjut siang dan malam, dan mereka membunuh banyak dari mereka. Orang-orang Frank pergi dengan kecewa dan berbaris untuk mengepung Harim. Ketika mereka meninggalkan Hama, penguasanya, Shihab al-Din al-Harami, meninggal dunia. Putranya telah meninggal tiga hari sebelumnya. {mengutip: kamil-ibn-al-athir hal. 86-87}"
