label: { ar: "وقعة المنصورة سنة 647هـ", en: "Battle of Mansura, 647", fr: "La bataille de Mansourah, 647", es: "Batalla de Mansura, 647", ur: "منصورہ کی جنگ، 647", tr: "Hicri 647 yılında gerçekleşen Mansura Muharebesi", id: "Pertempuran Mansoura pada tahun 647 AH" }
summary:
  ar: "في ذي القعدة سنة سبع وأربعين وستمائة حمل الفرنج ووصلوا إلى دهليز السلطان بالمنصورة، فركب مقدم الجيش فخر الدين بن الشيخ وقاتل فقُتل، وانهزم المسلمون ثم كرّوا على الفرنج ونزل النصر وقُتل من الفرنج مقتلة عظيمة؛ وكان قد مات السلطان الصالح أيوب ليلة نصف شعبان وكُتم موته أياماً {cite:shadharat-dhahab p. 246}."
  en: "In Dhu al-Qa'da 647 the Franks drove as far as the sultan's pavilion at Mansura; the vanguard commander Fakhr al-Din ibn al-Shaykh rode in, fought and was killed, the Muslims broke, then turned and the victory came down — a great slaughter of the Franks. Sultan al-Salih Ayyub had already died mid-Sha'ban, his death concealed for days {cite:shadharat-dhahab p. 246}."
  fr: "En Dhu al-Qa'da 647, les Francs poussèrent jusqu'au pavillon du sultan à Mansourah ; le commandant de l'avant-garde, Fakhr al-Din ibn al-Shaykh, monta à cheval, combattit et fut tué ; les musulmans plièrent, puis se retournèrent et la victoire descendit : un grand massacre des Francs. Le sultan al-Salih Ayyub était déjà mort à la mi-Sha'ban, sa mort étant tenue secrète pendant des jours {cite:shadharat-dhahab p. 246}."
  es: "En Dhu al-Qa'da 647, los francos avanzaron hasta el pabellón del sultán en Mansura; el comandante de la vanguardia, Fakhr al-Din ibn al-Shaykh, entró a caballo, luchó y murió. Los musulmanes se desbandaron, luego dieron media vuelta y la victoria llegó: una gran matanza de francos. El sultán al-Salih Ayyub ya había muerto a mediados de Sha'ban, y su muerte se mantuvo oculta durante días {cita: shadharat-dhahab p. 246}."
  ur: "ذوالقعدہ 647 میں فرانکس منصورہ میں سلطان کے برآمدے تک چلے گئے۔ ہراول دستہ کا کمانڈر فخر الدین ابن الشیخ سوار ہوا، لڑا اور مارا گیا، مسلمان ٹوٹ گئے، پھر پلٹے اور فتح نازل ہوئی - فرینکوں کا ایک عظیم قتل۔ سلطان الصالح ایوب کا انتقال شعبان کے وسط میں ہو چکا تھا، ان کی موت کئی دنوں تک مخفی رہی۔ 246}۔"
  tr: "Hicri 647 yılının Zilhicce ayında Franklar hücuma geçerek Mansur'daki Sultan'ın girişine ulaştılar. Ordu komutanı Fahreddin ibn Şeyh dışarı çıktı ve savaştı, ancak öldürüldü. Müslümanlar yenilgiye uğradıktan sonra Franklara karşı tekrar hücuma geçtiler ve zafer kazandılar. Çok sayıda Frank öldürüldü. Sultan Salih Eyyub Şaban ayının ortasındaki bir gecede öldü ve ölümü birkaç gün gizli tutuldu. {kaynak: Şadharat-dhahab s. 246}"
  id: "Pada bulan Dzul Qa'dah tahun 647 H, kaum Frank menyerang dan mencapai serambi Sultan di Mansoura. Komandan pasukan, Fakhr al-Din ibn al-Sheikh, maju dan bertempur, tetapi terbunuh. Kaum Muslim dikalahkan, kemudian mereka menyerang balik kaum Frank, dan kemenangan pun diraih. Sejumlah besar kaum Frank terbunuh. Sultan al-Salih Ayyub meninggal pada malam pertengahan bulan Sya'ban, dan kematiannya dirahasiakan selama beberapa hari. {cite:shadharat-dhahab hlm. 246}"
