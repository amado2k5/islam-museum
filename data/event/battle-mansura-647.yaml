summary:
  ar: "في ذي القعدة سنة سبع وأربعين وستمائة حمل الفرنج ووصلوا إلى دهليز السلطان بالمنصورة، فركب مقدم الجيش فخر الدين بن الشيخ وقاتل فقُتل، وانهزم المسلمون ثم كرّوا على الفرنج ونزل النصر وقُتل من الفرنج مقتلة عظيمة؛ وكان قد مات السلطان الصالح أيوب ليلة نصف شعبان وكُتم موته أياماً {cite:shadharat-dhahab p. 246}."
  en: "In Dhu al-Qa'da 647 the Franks drove as far as the sultan's pavilion at Mansura; the vanguard commander Fakhr al-Din ibn al-Shaykh rode in, fought and was killed, the Muslims broke, then turned and the victory came down — a great slaughter of the Franks. Sultan al-Salih Ayyub had already died mid-Sha'ban, his death concealed for days {cite:shadharat-dhahab p. 246}."
