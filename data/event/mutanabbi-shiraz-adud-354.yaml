label:
  ar: "المتنبي في شيراز عند عضد الدولة، ٣٥٤هـ/٩٦٥م"
  en: "Al-Mutanabbi at Shiraz with Adud al-Dawla, 354/965"
  ur: "شیراز میں عضدالدولہ کے پاس، 354ھ/965ء"
  es: "Al-Mutanabbi en Shiraz con Adud al-Dawla, 354/965"
  fr: "Al-Mutanabbi à Chiraz avec Adud al-Dawla, 354/965"
  tr: "Al-Mutanabbi, Şiraz'da, Adud al-Dawla'nın hükümdarlığı döneminde, Hicri 354/Miladi 965 yılında."
  id: "Al-Mutanabbi di Shiraz pada masa pemerintahan Adud al-Dawla, 354 H/965 M"
summary:
  ar: "في مطلع سنة ٣٥٤هـ/٩٦٥م غادر المتنبي العراق ماراً بالأهواز إلى أرّجان في خوزستان حيث ظفر برعاية الوزير البويهي ابن العميد فمدحه بقصائد، ثم تركه إلى شيراز فارس حيث التحق بالحاكم البويهي عضد الدولة الذي كان قد أبدى رغبته في استقدامه؛ فلقي استقبالاً فخماً ومدحه بقصائد تُعد من خير ما نظم، ثم غادر شيراز حنيناً إلى وطنه {cite:encyclopaedia-of-islam-2 vol. 7 p. 771}."
  en: "At the beginning of 354/965 al-Mutanabbi left Iraq and went via al-Ahwaz to Arrajan in Susiana, where he received the patronage of the Buyid vizier Ibn al-Amid and addressed panegyrics to him. He then left for Shiraz in Fars, joining the Buyid ruler Adud al-Dawla, who had expressed a desire to have him at his court; he enjoyed a splendid reception and addressed to him panegyrics among his best work, then left Shiraz out of simple homesickness {cite:encyclopaedia-of-islam-2 vol. 7 p. 771}."
  ur: "354ھ/965ء کے آغاز میں متنبی عراق سے روانہ ہوئے اور اہواز ہوتے ہوئے خوزستان کے اجان پہنچے جہاں بویہی وزیر ابن العمید کی سرپرستی ملی اور ان کے مدح میں قصیدے کہے۔ پھر فارس کے شیراز گئے جہاں بویہی حکمران عضدالدولہ — جس نے پہلے ہی انہیں اپنے دربار بلانے کی خواہش ظاہر کی تھی — سے ملے؛ شاندار استقبال ہوا اور انہوں نے اپنی بہترین قصیدوں میں سے چند اس کے لیے کہے، پھر محض وطن کی یاد میں شیراز چھوڑ دیا {cite:encyclopaedia-of-islam-2 vol. 7 p. 771}۔"
  es: "A principios del año 354/965, al-Mutanabbi abandonó Irak y viajó vía al-Ahwaz a Arrajan en Susiana, donde recibió el patrocinio del visir buyí Ibn al-Amid y le dedicó elogios. Luego partió hacia Shiraz en Fars, donde se unió al gobernante buyí Adud al-Dawla, quien había expresado su deseo de tenerlo en su corte; disfrutó de una espléndida recepción y le dedicó algunos de sus mejores elogios, para luego abandonar Shiraz por simple nostalgia {cite:encyclopaedia-of-islam-2 vol. 7 p. 771}."
  fr: "Au début de l'an 354/965, al-Mutanabbi quitta l'Irak et se rendit, via al-Ahwaz, à Arrajan en Susiane, où il reçut la protection du vizir bouyide Ibn al-Amid et lui adressa des panégyriques. Il partit ensuite pour Shiraz, dans le Fars, où il rejoignit le souverain bouyide Adud al-Dawla, qui avait exprimé le désir de l'accueillir à sa cour; il y fut reçu avec faste et lui adressa des panégyriques parmi ses plus belles œuvres, puis quitta Shiraz, simplement pris de nostalgie."
  tr: "Hicri 354/Miladi 965 yılının başlarında, El-Mutanabbi Irak'tan ayrılarak Ahvaz üzerinden Huzistan'daki Arrajan'a gitti ve burada Buyid veziri İbn el-Amid'in himayesini kazandı ve onu şiirleriyle övdü. Daha sonra onu bırakıp Fars'taki Şiraz'a gitti ve kendisini getirme arzusunu dile getiren Buyid hükümdarı Adud el-Dawla'ya katıldı. Büyük bir karşılama gördü ve bestelediği en iyi şiirler arasında sayılan şiirlerle onu övdü. Ardından memleketine özlem duyarak Şiraz'dan ayrıldı. {cite:encyclopaedia-of-islam-2 vol. 7 p. 771}"
  id: "Pada awal tahun 354 H/965 M, Al-Mutanabbi meninggalkan Irak, melewati Ahwaz menuju Arrajan di Khuzestan, di mana ia mendapatkan perlindungan dari menteri Buyid Ibn al-Amid, yang dipujinya dengan puisi-puisi. Kemudian ia meninggalkannya untuk pergi ke Shiraz, Fars, di mana ia bergabung dengan penguasa Buyid Adud al-Dawla, yang telah menyatakan keinginannya untuk membawanya. Ia menerima sambutan meriah dan dipuji dengan puisi-puisi yang dianggap sebagai salah satu karya terbaiknya. Kemudian ia meninggalkan Shiraz, merindukan tanah kelahirannya. {cite:encyclopaedia-of-islam-2 vol. 7 p. 771}."
