id: event/al-hadi-leaves-saada-for-khiwan-and-meets-al-daam-at-al-amshiyya-288
class: event
kind: other
label:
  ar: "الهادي يخرج من صعدة نحو خيوان ويلقى الدعام بالعمشية، محرم 288هـ"
  en: "Al-Hadi leaves Sa'da for Khaywan and meets al-Da'am at al-Amshiyya, Muharram 288 AH"
  ur: "ہادی صعدہ سے خیوان کی طرف نکلتے ہیں اور العمشیہ میں دعام سے ملتے ہیں، محرم 288ھ"
  es: "Al-Hadi deja Sa'da hacia Khaywan y se encuentra con al-Da'am en al-Amshiyya, Muharram 288 AH"
  fr: "Al-Hadi quitte Sa'da pour Khaywan et rencontre al-Da'am à al-Amshiyya, Muharram 288 AH"
  tr: "Al-Hadi, Sa'dah'dan Haywan'a doğru yola çıkar ve Al-Da'am ile Al-Amshiyyah'da buluşur, Muharrem 288 H."
  id: "Al-Hadi berangkat dari Sa'dah menuju Khaywan dan bertemu Al-Da'am di Al-Amshiyyah, Muharram 288 H."
summary:
  ar: "مع مطلع محرم سنة 288هـ يأمر الهادي محمد بن عبيد الله بإشخاص عسكر من بني الحارث وهمدان، فيرسل إليه ابنه علي بن محمد في عسكر كثيف، فيجمع من خولان عسكراً عظيماً ويخرج نحو خيوان ويخلف أحمد بن محمد والياً بصعدة وينزل العمشية، فيلقاه الدعام بن إبراهيم في جميع بكيل ويبيتان فيها."
  en: "At the new moon of Muharram 288 AH al-Hadi tells Muhammad ibn Ubaydallah to send out a force of Banu al-Harith and Hamdan; his son Ali ibn Muhammad comes with a dense force; al-Hadi gathers a great Khawlan army, sets out for Khaywan leaving Ahmad ibn Muhammad as governor of Sa'da, and camps at al-Amshiyya where al-Da'am ibn Ibrahim meets him with all Bakil and both spend the night."
  ur: "محرم 288ھ کے چاند کے ساتھ ہادی محمد بن عبید اللہ کو بنو حارث اور ہمدان کا لشکر بھیجنے کا حکم دیتے ہیں؛ ان کے بیٹے علی بن محمد گھنے لشکر کے ساتھ آتے ہیں؛ ہادی خولان کا بڑا لشکر جمع کر کے خیوان کی طرف نکلتے ہیں، احمد بن محمد کو صعدہ کا والی چھوڑتے ہیں اور العمشیہ میں ٹھہرتے ہیں جہاں دعام بن ابراہیم تمام بکیل کے ساتھ ملتا ہے اور دونوں رات وہیں گزارتے ہیں۔"
  es: "En la luna nueva de Muharram del año 288 AH, al-Hadi le dice a Muhammad ibn Ubaydallah que envíe una fuerza de Banu al-Harith y Hamdan; su hijo Ali ibn Muhammad llega con una fuerza numerosa; al-Hadi reúne un gran ejército de Khawlan, parte hacia Khaywan dejando a Ahmad ibn Muhammad como gobernador de Sa'da, y acampa en al-Amshiyya donde al-Da'am ibn Ibrahim se encuentra con él con todos los Bakil y ambos pasan la noche."
  fr: "À la nouvelle lune de Muharram 288 AH, al-Hadi ordonne à Muhammad ibn Ubaydallah d'envoyer une armée composée de Banu al-Harith et de Hamdan; son fils Ali ibn Muhammad arrive avec une force importante; al-Hadi rassemble une grande armée Khawlan, se dirige vers Khaywan en laissant Ahmad ibn Muhammad comme gouverneur de Sa'da, et campe à al-Amshiyya où al-Da'am ibn Ibrahim le rencontre avec tous les Bakil et tous deux passent la nuit."
  tr: "Hicri 288 yılının Muharrem ayının başında, Hadi Muhammed bin Ubeydullah, Beni el-Harith ve Hamdan'dan bir ordu gönderilmesini emretti. Oğlu Ali bin Muhammed onu büyük bir orduyla gönderdi; böylece Havlan'dan büyük bir ordu topladı ve Hayvan'a doğru yola çıktı. Ahmed bin Muhammed'i Saada'da vali olarak bıraktı ve Amşiya'ya doğru yola koyuldu. Da'am bin İbrahim onu Bakil'de karşıladı ve geceyi orada geçirdiler."
  id: "Pada awal bulan Muharram tahun 288 Hijriah, Al-Hadi Muhammad bin Ubaid Allah memerintahkan pengiriman pasukan dari Bani Al-Harith dan Hamdan. Putranya, Ali bin Muhammad, mengutusnya dengan pasukan besar, sehingga ia mengumpulkan pasukan besar dari Khawlan dan berangkat menuju Khaywan, meninggalkan Ahmad bin Muhammad sebagai gubernur di Saada dan berangkat menuju Al-Amshiya. Al-Da’am bin Ibrahim menemuinya di seluruh Bakil dan mereka bermalam di sana."
