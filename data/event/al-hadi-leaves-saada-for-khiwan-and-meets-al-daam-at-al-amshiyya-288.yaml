id: event/al-hadi-leaves-saada-for-khiwan-and-meets-al-daam-at-al-amshiyya-288
class: event
kind: other
label:
  ar: "الهادي يخرج من صعدة نحو خيوان ويلقى الدعام بالعمشية، محرم 288هـ"
  en: "Al-Hadi leaves Sa'da for Khaywan and meets al-Da'am at al-Amshiyya, Muharram 288 AH"
  ur: "ہادی صعدہ سے خیوان کی طرف نکلتے ہیں اور العمشیہ میں دعام سے ملتے ہیں، محرم 288ھ"
summary:
  ar: "مع مطلع محرم سنة 288هـ يأمر الهادي محمد بن عبيد الله بإشخاص عسكر من بني الحارث وهمدان، فيرسل إليه ابنه علي بن محمد في عسكر كثيف، فيجمع من خولان عسكراً عظيماً ويخرج نحو خيوان ويخلف أحمد بن محمد والياً بصعدة وينزل العمشية، فيلقاه الدعام بن إبراهيم في جميع بكيل ويبيتان فيها."
  en: "At the new moon of Muharram 288 AH al-Hadi tells Muhammad ibn Ubaydallah to send out a force of Banu al-Harith and Hamdan; his son Ali ibn Muhammad comes with a dense force; al-Hadi gathers a great Khawlan army, sets out for Khaywan leaving Ahmad ibn Muhammad as governor of Sa'da, and camps at al-Amshiyya where al-Da'am ibn Ibrahim meets him with all Bakil and both spend the night."
  ur: "محرم 288ھ کے چاند کے ساتھ ہادی محمد بن عبید اللہ کو بنو حارث اور ہمدان کا لشکر بھیجنے کا حکم دیتے ہیں؛ ان کے بیٹے علی بن محمد گھنے لشکر کے ساتھ آتے ہیں؛ ہادی خولان کا بڑا لشکر جمع کر کے خیوان کی طرف نکلتے ہیں، احمد بن محمد کو صعدہ کا والی چھوڑتے ہیں اور العمشیہ میں ٹھہرتے ہیں جہاں دعام بن ابراہیم تمام بکیل کے ساتھ ملتا ہے اور دونوں رات وہیں گزارتے ہیں۔"
