label:
  ar: "حجّ ابن حجر مع وصيّه الخروبي، ٧٨٤هـ/١٣٨٢م"
  en: "Ibn Hajar's pilgrimage with his guardian al-Kharrubi, 784/1382"
  ur: "ابن حجر کی سرپرست خرّوبی کے ہمراہ حج، 784ھ/1382ء"
summary:
  ar: "أخذ زكي الدين الخروبي ابنَ حجر، وله إحدى عشرة سنة، إلى حج بيت الله سنة ٧٨٤هـ/١٣٨٢-١٣٨٣م، وكان قد حج قبل ذلك مع أبيه؛ وأقام بمكة إلى أن رجع به سنة ٧٨٦هـ، ثم توفي الوصي في المحرم سنة ٧٨٧هـ/فبراير ١٣٨٥م. وكان ابن حجر قد أتم حفظ القرآن وهو ابن تسع سنين، ولم يقطع مكثه بالحجاز دراسته {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}."
  en: "In 784/1382-3 Zaki al-Din al-Kharrubi took the eleven-year-old Ibn Hajar on the pilgrimage to Mecca — he had already been once with his father — and stayed on with him until 786, dying soon after in Muharram 787 (February 1385). Ibn Hajar had already memorized the Qur'an by the age of nine, and the sojourn in Arabia did not interrupt his studies {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}."
  ur: "784ھ/1382-83ء میں زکی الدین خرّوبی گیارہ برس کے ابن حجر کو حج پر مکہ لے گئے — وہ اس سے پہلے اپنے والد کے ساتھ جا چکے تھے — اور انہیں 786ھ تک وہیں رکھا، پھر محرم 787ھ (فروری 1385ء) میں سرپرست کا انتقال ہو گیا۔ ابن حجر نو برس کی عمر میں حافظِ قرآن ہو چکے تھے اور حجاز میں قیام نے ان کی تعلیم میں خلل نہیں ڈالا {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}۔"
