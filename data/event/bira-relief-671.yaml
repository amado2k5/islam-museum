label: { ar: "إغاثة البيرة وخوض الفرات سنة 671هـ", en: "The Euphrates crossing to relieve al-Bira, 671", fr: "La traversée de l'Euphrate pour secourir al-Bira, 671", es: "El cruce del Éufrates para aliviar a al-Bira, 671", ur: "البیرا سے نجات کے لیے فرات کا کراسنگ، 671" }
summary:
  ar: "في سنة إحدى وسبعين وصلت التتار إلى حافة الفرات ونازلوا إلبيرة، وكان السلطان بدمشق فأسرع السير وأمر الأمراء بخوض الفرات، فخاض سيف الدين قلاوون وبيسري والسلطان أولاً ثم تبعهم العسكر ووقعوا على التتار فقتلوا منهم مقتلة عظيمة وأسروا مائتين، ولله الحمد {cite:shadharat-dhahab p. 581}."
  en: "The Tatars came down to the Euphrates bank and invested al-Bira; the sultan raced from Damascus and ordered the ford — Qalawun, Baysari and Baybars himself first across — the army fell on them, made a great slaughter and took two hundred {cite:shadharat-dhahab p. 581}."
  fr: "Les Tatars descendirent jusqu'à la rive de l'Euphrate et investirent al-Bira ; le sultan accourut de Damas et ordonna le passage du gué, Qalawun, Baysari et Baybars lui-même traversant les premiers ; l'armée tomba sur eux, en fit un grand carnage et en prit deux cents {cite:shadharat-dhahab p. 581}."
  es: "Los tártaros bajaron a la orilla del Éufrates y sitiaron al-Bira; el sultán corrió desde Damasco y ordenó cruzar el vado —Qalawun, Baysari y el propio Baybars fueron los primeros en cruzar— el ejército los atacó, causó una gran matanza y tomó doscientos {cite:shadharat-dhahab p. 581}."
  ur: "تاتاری فرات کے کنارے پر آئے اور البیرہ میں سرمایہ کاری کی۔ سلطان نے دمشق سے دوڑ لگا کر قلعہ قلاون، بایسری اور بیبرس کو حکم دیا کہ سب سے پہلے خود فوج ان پر گر پڑی، زبردست قتل و غارت گری کی اور دو سو کو لے لیا۔ 581}۔"
