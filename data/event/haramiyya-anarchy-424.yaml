label: { ar: "تسلّط الحرامية على بغداد", en: "The Thieves' Dominion over Baghdad", es: "El dominio de los ladrones sobre Bagdad", fr: "La domination des voleurs sur Bagdad", ur: "بغداد پر چوروں کا راج", tr: "Hırsızlar Bağdat'ı ele geçirdi.", id: "Para pencuri telah menguasai Baghdad." }
summary:
  ar: "في سنة أربع وعشرين وأربعمائة اشتد الخطب ببغداد بأمر الحرامية وأخذوا أموال الناس عياناً وقتلوا مساحب الشرطة وأخذوا لتاجر ما قيمته عشرة آلاف دينار، حتى نقّب الناس — لا يحسبون أن يقدر أحد على ذلك — خوفاً من أميرهم البرجمي الذي اشتهر أنه لا ينعرض لامرأة ولا يدع أحداً يأخذ عليها؛ ثم في سنة ست وعشرين زاد بلاء الحرامية وجاهروا بأخذ الأموال وإظهار الفسق والفجور والإفطار في رمضان حتى تملّكوا بغداد في المعنى {cite:shadharat-dhahab p. 227, 230}."
  en: "From 424 Baghdad fell to the 'thieves' — robbing openly, killing the police dragmen, taking ten thousand dinars' worth from one merchant — until the emir Burjumi, famed for never sparing a woman nor letting anyone take from her, hunted them down; by 426 the robbers were eating openly in Ramadan and held Baghdad in all but name {cite:shadharat-dhahab p. 227, 230}."
  es: "Desde el año 424, Bagdad cayó en manos de los \"ladrones\", quienes robaban abiertamente, mataban a los policías y se llevaban diez mil dinares de un comerciante, hasta que el emir Burjumi, famoso por no perdonar jamás a una mujer ni permitir que nadie le robara, los persiguió; para el año 426, los ladrones comían abiertamente durante el Ramadán y controlaban Bagdad prácticamente en la práctica {cite:shadharat-dhahab p. 227, 230}."
  fr: "À partir de 424, Bagdad tomba aux mains des « voleurs » — qui volaient ouvertement, tuaient les policiers déguisés, et prenaient pour dix mille dinars à un seul marchand — jusqu'à ce que l'émir Burjumi, célèbre pour ne jamais épargner une femme ni laisser personne la voler, les traque; en 426, les voleurs mangeaient ouvertement pendant le Ramadan et contrôlaient Bagdad de fait {cite:shadharat-dhahab p. 227, 230}."
  ur: "424 سے بغداد 'چوروں' کے قبضے میں آگیا - کھلے عام لوٹ مار کرنا، پولیس کے ڈرگ مینوں کو مارنا، ایک سوداگر سے دس ہزار دینار لے لینا - یہاں تک کہ امیر برجمی، جو کسی عورت کو نہ بخشنے اور نہ ہی کسی کو اس سے چھیننے دینے کے لیے مشہور تھا، ان کا شکار کیا؛ 426 تک ڈاکو رمضان میں کھلے عام کھا رہے تھے اور بغداد کو اپنے قبضے میں لے لیا سوائے نام کے۔ 227، 230}۔"
  tr: "Hicri 424 yılında, Bağdat'taki durum hırsızların eylemleri nedeniyle kötüleşti. İnsanların paralarını açıkça aldılar, polis memurlarını öldürdüler ve bir tüccardan on bin dinar değerinde mal çaldılar. İnsanlar, kadınlara dokunmaması ve kimsenin onlardan bir şey almasına izin vermemesiyle bilinen liderleri El-Barjami'den korktukları için, kimsenin böyle bir şey yapabileceğini düşünmeden arama yaptılar. Daha sonra, Hicri 426 yılında, hırsızların belası arttı ve açıkça para çaldılar, ahlaksızlık ve sefahat sergilediler ve Ramazan ayında oruçlarını bozdular, ta ki Bağdat'ı tamamen ele geçirene kadar. {Kaynak: Şadharat-Dhaba, s. 227, 230}"
  id: "Pada tahun 424 H, situasi di Baghdad memburuk akibat tindakan para pencuri. Mereka secara terang-terangan mengambil uang rakyat, membunuh petugas polisi, dan mengambil barang dagangan senilai sepuluh ribu dinar dari seorang pedagang. Orang-orang mencari—tanpa menyangka bahwa siapa pun dapat melakukan hal itu—karena takut kepada pemimpin mereka, Al-Barjami, yang terkenal tidak pernah menyentuh wanita atau membiarkan siapa pun mengambil apa pun darinya. Kemudian, pada tahun 426 H, penderitaan para pencuri meningkat, dan mereka secara terang-terangan mengambil uang, melakukan perbuatan immoral dan cabul, serta membatalkan puasa di bulan Ramadan hingga mereka menguasai Baghdad dalam arti [kutipan:shadharat-dhahab hlm. 227, 230]."
