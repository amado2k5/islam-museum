label: { ar: "تسلّط الحرامية على بغداد", en: "The Thieves' Dominion over Baghdad", es: "El dominio de los ladrones sobre Bagdad", fr: "La domination des voleurs sur Bagdad" }
summary:
  ar: "في سنة أربع وعشرين وأربعمائة اشتد الخطب ببغداد بأمر الحرامية وأخذوا أموال الناس عياناً وقتلوا مساحب الشرطة وأخذوا لتاجر ما قيمته عشرة آلاف دينار، حتى نقّب الناس — لا يحسبون أن يقدر أحد على ذلك — خوفاً من أميرهم البرجمي الذي اشتهر أنه لا ينعرض لامرأة ولا يدع أحداً يأخذ عليها؛ ثم في سنة ست وعشرين زاد بلاء الحرامية وجاهروا بأخذ الأموال وإظهار الفسق والفجور والإفطار في رمضان حتى تملّكوا بغداد في المعنى {cite:shadharat-dhahab p. 227, 230}."
  en: "From 424 Baghdad fell to the 'thieves' — robbing openly, killing the police dragmen, taking ten thousand dinars' worth from one merchant — until the emir Burjumi, famed for never sparing a woman nor letting anyone take from her, hunted them down; by 426 the robbers were eating openly in Ramadan and held Baghdad in all but name {cite:shadharat-dhahab p. 227, 230}."
  es: "Desde el año 424, Bagdad cayó en manos de los \"ladrones\", quienes robaban abiertamente, mataban a los policías y se llevaban diez mil dinares de un comerciante, hasta que el emir Burjumi, famoso por no perdonar jamás a una mujer ni permitir que nadie le robara, los persiguió; para el año 426, los ladrones comían abiertamente durante el Ramadán y controlaban Bagdad prácticamente en la práctica {cite:shadharat-dhahab p. 227, 230}."
  fr: "À partir de 424, Bagdad tomba aux mains des « voleurs » — qui volaient ouvertement, tuaient les policiers déguisés, et prenaient pour dix mille dinars à un seul marchand — jusqu'à ce que l'émir Burjumi, célèbre pour ne jamais épargner une femme ni laisser personne la voler, les traque; en 426, les voleurs mangeaient ouvertement pendant le Ramadan et contrôlaient Bagdad de fait {cite:shadharat-dhahab p. 227, 230}."
