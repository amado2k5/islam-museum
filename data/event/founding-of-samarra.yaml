label: { ar: "تمصير سر من رأى", en: "The Garrisoning of Sur man Ra'a (Samarra)" }
summary:
  ar: "عند البلاذري: نزل المعتصم مدينة السلام ثم شخص عنها إلى القاطول فنزل قصر الرشيد وكان الرشيد ابتناه حين حفر قاطوله الذي دعاه أبا الجند لقيام ما يسقى من الأرضين بأرزاق جنده ثم بنى المعتصم بالقاطول بناء نزله ودفع ذلك القصر إلى أشناس التركي مولاه وهم بتمصير ما هناك وابتدأ بناء مدينة تركها ثم رأى تمصير سر من رأى فمصرها ونقل الناس إليها وأقام بها وبنى مسجد الجامع في طرف الأسواق وسماها سر من رأى وأنزل أشناس مولاه فيمن ضم إليه من القواد كرخ فيروز وعند السيوطي اعتنى المعتصم باقتناء الترك فبعث إلى سمرقند وفرغانة والنواحي في شرائهم وبذل فيهم الأموال فكانوا يطردون خيلهم في بغداد ويؤذون الناس وضاقت بهم البلد فاجتمع إليه أهل بغداد وقالوا إن لم تخرج عنا بجندك حاربناك قال وكيف تحاربوني قالوا بسهام الأسحار فقال لا طاقة لي بذلك فكان ذلك سبب بنائه سر من رأى، وكان أول الخلفاء أدخل الأتراك الديوان وبلغت غلمانه بضعة عشر ألفاً {cite:tarikh-khulafa-minhaj-1434 p. 521-522}. وعند المسعودي انتهى المعتصم إلى موضع سامرا فسأل أهل دير للنصارى عن اسمه فقيل نجدها في الكتب السالفة مدينة سام بن نوح من بلاد طبرهان، فاشترى أرضهم بأربعة آلاف دينار وأسس قصره بالموضع المعروف بالوزيرية وجعل للأتراك قطائع متحيزة وجاورهم بالفراعنة والأشروسية وأقطع أشناس كرخ سامرا وأفرد كل صنعة بسوق {cite:muruj-al-dhahab p. 445}"
  en: "In al-Baladhuri: al-Mu'tasim left Madinat al-Salam for al-Qatul, dwelling at Qasr al-Rashid which Harun had built while digging his Qatul canal — called Abu al-Jund for watering lands for his troops' stipends; al-Mu'tasim built at al-Qatul, gave that palace to his mawla Ashinas al-Turki, considered garrisoning there and began a city, then resolved to garrison Sur man Ra'a instead — moved the people to it, dwelt there, built the congregational mosque at the markets' edge, named it Sur man Ra'a ('he who sees it rejoices'), and settled Ashinas and his attached commanders at Karkh Fayruz."
