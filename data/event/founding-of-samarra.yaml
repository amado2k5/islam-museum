label: { ar: "تمصير سر من رأى", en: "The Garrisoning of Sur man Ra'a (Samarra)", es: "El guarnición de Sur man Ra'a (Samarra)", fr: "La garnison de Sur man Ra'a (Samarra)", ur: "سور من راع ⁦(سامرہ)⁩ کی چوکیداری", tr: "Görenin sırrını Mısırlaştırmak", id: "Mengadaptasi rahasia orang yang melihat ke dalam budaya Mesir" }
summary:
  ar: "عند البلاذري: نزل المعتصم مدينة السلام ثم شخص عنها إلى القاطول فنزل قصر الرشيد وكان الرشيد ابتناه حين حفر قاطوله الذي دعاه أبا الجند لقيام ما يسقى من الأرضين بأرزاق جنده ثم بنى المعتصم بالقاطول بناء نزله ودفع ذلك القصر إلى أشناس التركي مولاه وهم بتمصير ما هناك وابتدأ بناء مدينة تركها ثم رأى تمصير سر من رأى فمصرها ونقل الناس إليها وأقام بها وبنى مسجد الجامع في طرف الأسواق وسماها سر من رأى وأنزل أشناس مولاه فيمن ضم إليه من القواد كرخ فيروز وعند السيوطي اعتنى المعتصم باقتناء الترك فبعث إلى سمرقند وفرغانة والنواحي في شرائهم وبذل فيهم الأموال فكانوا يطردون خيلهم في بغداد ويؤذون الناس وضاقت بهم البلد فاجتمع إليه أهل بغداد وقالوا إن لم تخرج عنا بجندك حاربناك قال وكيف تحاربوني قالوا بسهام الأسحار فقال لا طاقة لي بذلك فكان ذلك سبب بنائه سر من رأى، وكان أول الخلفاء أدخل الأتراك الديوان وبلغت غلمانه بضعة عشر ألفاً {cite:tarikh-khulafa-minhaj-1434 p. 521-522}. وعند المسعودي انتهى المعتصم إلى موضع سامرا فسأل أهل دير للنصارى عن اسمه فقيل نجدها في الكتب السالفة مدينة سام بن نوح من بلاد طبرهان، فاشترى أرضهم بأربعة آلاف دينار وأسس قصره بالموضع المعروف بالوزيرية وجعل للأتراك قطائع متحيزة وجاورهم بالفراعنة والأشروسية وأقطع أشناس كرخ سامرا وأفرد كل صنعة بسوق {cite:muruj-al-dhahab p. 445}"
  en: "In al-Baladhuri: al-Mu'tasim left Madinat al-Salam for al-Qatul, dwelling at Qasr al-Rashid which Harun had built while digging his Qatul canal — called Abu al-Jund for watering lands for his troops' stipends; al-Mu'tasim built at al-Qatul, gave that palace to his mawla Ashinas al-Turki, considered garrisoning there and began a city, then resolved to garrison Sur man Ra'a instead — moved the people to it, dwelt there, built the congregational mosque at the markets' edge, named it Sur man Ra'a ('he who sees it rejoices'), and settled Ashinas and his attached commanders at Karkh Fayruz."
  es: "En al-Baladhuri: al-Mu'tasim dejó Madinat al-Salam para ir a al-Qatul, donde se instaló en Qasr al-Rashid, que Harun había construido mientras excavaba su canal de Qatul, llamado Abu al-Jund para regar las tierras para los estipendios de sus tropas; al-Mu'tasim construyó en al-Qatul, le dio ese palacio a su mawla Ashinas al-Turki, consideró guarnecer allí y comenzó a construir una ciudad, luego decidió guarnecer Sur man Ra'a en su lugar, trasladó a la gente a ella, habitó allí, construyó la mezquita congregacional en el borde de los mercados, la llamó Sur man Ra'a ('quien la ve se regocija'), y estableció a Ashinas y a sus comandantes adjuntos en Karkh Fayruz."
  fr: "Dans al-Baladhuri: al-Mu'tasim quitta Madinat al-Salam pour al-Qatul, s'installant à Qasr al-Rashid, que Harun avait fait construire en creusant son canal de Qatul — appelé Abu al-Jund pour irriguer les terres destinées aux soldes de ses troupes; al-Mu'tasim construisit à al-Qatul, donna ce palais à son mawla Ashinas al-Turki, envisagea d'y établir une garnison et commença une ville, puis décida d'établir une garnison à Sur man Ra'a à la place — y déplaça les habitants, s'y installa, construisit la mosquée du vendredi à la périphérie des marchés, la nomma Sur man Ra'a (« celui qui la voit se réjouit »), et installa Ashinas et ses commandants rattachés à Karkh Fayruz."
  ur: "البلادھوری میں ہے: المعتصم نے مدینۃ السلام کو القطول کے لیے چھوڑ دیا، قصر الرشید میں رہائش اختیار کی جسے ہارون نے اپنی قطول نہر کھودتے ہوئے تعمیر کیا تھا - جسے ابو الجند کہا جاتا ہے اپنے فوجیوں کے وظیفے کے لیے زمینوں کو پانی پلانے کے لیے؛ المعتصم نے القطول میں تعمیر کیا، وہ محل اپنے مولا اشیناس الترکی کو دے دیا، وہاں پر چوکیداری کا خیال کیا اور ایک شہر شروع کیا، پھر اس کے بجائے سور من راع کی چوکی لگانے کا عزم کیا - لوگوں کو اس میں منتقل کیا، وہاں رہائش اختیار کی، بازاروں کے کنارے پر اجتماعی مسجد تعمیر کی، اس کا نام 'سور من راع' رکھا اور اس کا نام 'سور من راع' رکھا۔ کرخ فیروز میں آشیناس اور اس کے منسلک کمانڈر۔"
  tr: "El-Baladhuri'ye göre: El-Mu'tasim Bağdat'a indi, sonra oradan El-Katul'a gitti ve orada El-Raşid'in sarayında kaldı. El-Raşid, askerlerine yiyecek sağlamak için Ebu el-Cund adını verdiği sulama kanalını kazdığında bu sarayı da inşa ettirmişti. El-Mu'tasim daha sonra El-Katul'da ikametgahını inşa etti ve bu sarayı azatlı kölesi Türk Aşinas'a emanet etti. Bölgeyi geliştirmeyi amaçladı ve orada bir şehir kurmaya başladı. Sonra Samarra'yı geliştirmeye karar verdi ve insanları oraya taşıyarak orada ikamet etti. Pazarların kenarına cemaat camisini inşa etti ve ona Samarra adını verdi. Azatlı kölesi Aşinas'ı, kendisine atadığı komutanlar arasına, Kerh Firuz'a yerleştirdi. Suyuti'ye göre, Mu'tasim Türkleri elde etmeye hevesliydi, bu yüzden Semerkant, Fergana ve çevresindeki bölgelere Türk askerleri gönderip onlara para harcadı. Türkler atlarıyla Bağdat'tan geçip halkı rahatsız ediyorlardı ve şehir onlar için çok küçük kalmıştı. Bağdat halkı onun etrafına toplanıp, \"Ordunuzla bizi yalnız bırakmazsanız sizinle savaşacağız\" dediler. Mu'tasim, \"Nasıl savaşacaksınız?\" diye sordu. Halk, \"Şafak vakti oklarla\" dedi. Mu'tasim, \"Bunun için gücüm yok\" dedi. Bu, Samarra'nın inşasının sebebiydi. Türkleri Divan'a (devlet dairesi) dahil eden ilk halifeydi. Hizmetkârlarının sayısı birkaç bine ulaşıyordu. (Kaynak:tarikh-khulafa-minhaj-1434 s. 521-522) El-Mas'udi'ye göre, Mu'tasim Samarra'nın bulunduğu yere geldi ve bir Hristiyan manastırının halkına şehrin adını sordu. Dediler ki: \"Önceki kitaplarda, buranın Nuh oğlu Sam'ın şehri, Taberhan diyarı olduğunu görüyoruz.\" Bunun üzerine, topraklarını dört bin dinara satın aldı ve sarayını El-Vaziriya olarak bilinen yere kurdu. Türklere ayrı araziler verdi ve onları El-Fara'ina ve El-Aşrusiya ile komşu yaptı. Aşnas Karkh Samarra'yı verdi ve her zanaatı ayrı bir pazara ayırdı. {cite:muruj-al-dhahab s. 445}"
  id: "Menurut al-Baladhuri: Al-Mu'tasim turun ke Baghdad, kemudian berangkat dari sana ke al-Qatul, tempat ia tinggal di istana al-Rashid. Al-Rashid telah membangunnya ketika ia menggali kanal irigasi yang disebutnya Abu al-Jund, untuk menyediakan penghidupan bagi tentaranya. Al-Mu'tasim kemudian membangun kediamannya di al-Qatul dan mempercayakan istana itu kepada Ashinas si Turki, budak yang telah dibebaskannya. Ia bermaksud mengembangkan daerah tersebut dan mulai membangun sebuah kota di sana. Kemudian ia memutuskan untuk mengembangkan Samarra, dan ia melakukannya, memindahkan orang-orang ke sana dan menetap di sana. Ia membangun masjid jami di pinggir pasar dan menamainya Samarra. Ia menempatkan Ashinas, budak yang telah dibebaskannya, di antara para komandan yang telah ditugaskan kepadanya, di Karkh Firuz. Menurut al-Suyuti, al-Mu'tasim sangat ingin mendapatkan orang-orang Turki, jadi ia mengirim utusan ke Samarkand, Fergana, dan daerah sekitarnya untuk membeli mereka dan menghabiskan uang untuk mereka. Mereka akan mengendarai kuda-kuda mereka melalui Baghdad dan mengganggu penduduknya, dan kota itu menjadi terlalu kecil bagi mereka. Penduduk Baghdad berkumpul di sekelilingnya dan berkata, \"Jika engkau tidak meninggalkan kami dengan pasukanmu, kami akan melawanmu.\" Dia berkata, \"Bagaimana kalian akan melawanku?\" Mereka berkata, \"Dengan panah di waktu subuh.\" Dia berkata, \"Aku tidak memiliki kekuatan untuk itu.\" Inilah alasan pembangunan Samarra. Dia adalah khalifah pertama yang memasukkan orang Turki ke dalam Diwan (kantor pemerintahan). Para pelayannya berjumlah beberapa ribu. {cite:tarikh-khulafa-minhaj-1434 p. 521-522}. Menurut Al-Mas'udi, Al-Mu'tasim tiba di lokasi Samarra dan bertanya kepada orang-orang di sebuah biara Kristen tentang namanya. Mereka berkata, \"Kami menemukannya dalam kitab-kitab sebelumnya sebagai kota Sam, putra Nuh, di tanah Taberhan.\" Maka dia membeli tanah mereka seharga empat ribu dinar dan mendirikan istananya di tempat yang dikenal sebagai Al-Waziriya. Dia memberikan wilayah terpisah kepada orang Turki dan menjadikan Al-Fara'ina dan Al-Ashrusiya sebagai tetangga mereka. Dia memberikan Ashnas Karkh Samarra dan memisahkan setiap keahlian ke pasarnya masing-masing. {cite:muruj-al-dhahab p. 445}"
