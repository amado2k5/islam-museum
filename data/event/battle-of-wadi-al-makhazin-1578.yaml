label: { ar: "معركة وادي المخازن ⁦(٩٨٦هـ/١٥٧٨م)⁩", en: "Battle of Wadi al-Makhazin (986/1578)", fr: "La bataille de Wadi al-Makhazin (986/1578)", es: "Batalla de Wadi al-Makhazin (986/1578)", ur: "جنگ وادی المخازین (986/1578)", tr: "Vadi el-Makhazin Muharebesi (H.986/MS 1578)", id: "Pertempuran Wadi al-Makhazin (986 H/1578 M)" }
summary:
  ar: "وقعة الملوك الثلاثة عند القصر الكبير يوم الاثنين ٣٠ جمادى الآخرة ٩٨٦هـ/٤ أغسطس ١٥٧٨م. التقى سلطان المغرب عبد الملك المعتصم بالله — المدعوم عثمانياً — جيشَ ملك البرتغال سبستيان الذي حشد عشرات الألوف من الأسبان والبرتغاليين والطليان والألمان لإعادة حليفه المخلوع محمد المتوكل. عزل عبد الملك العدو عن أسطوله ونسف قنطرة النهر الوحيدة، وتوفي في أول المعركة مريضاً كما كان وأخفى موته حاجبه رضوان وأخوه أحمد المنصور حتى تم النصر في أربع ساعات وثلث؛ فهلك الملوك الثلاثة: سبستيان قتيلاً والمتوكل غريقاً وعبد الملك في ساحة الفدا. وبويع أحمد المنصور في الميدان نفسه، وارتفع نجم الدولة السعدية حتى باتت وفود أوروبا تصبح وتمسي على أعتاب قصورها {cite:dawlat-uthmaniyya-salabi p. 258-268}."
  en: "The Battle of the Three Kings at al-Qasr al-Kabir, Monday 30 Jumada II 986/4 August 1578. Morocco's sultan Abd al-Malik al-Mu'tasim — Ottoman-backed — met King Sebastian of Portugal, who had massed tens of thousands of Spanish, Portuguese, Italian and German troops to restore his deposed ally Muhammad al-Mutawakkil. Abd al-Malik cut the enemy from his fleet and blew the river's only bridge; he died of illness minutes into the battle, his chamberlain Ridwan and brother Ahmad al-Mansur concealing it until victory was complete in four hours and a third. All three kings perished — Sebastian slain, al-Mutawakkil drowned, Abd al-Malik on the field — and Ahmad al-Mansur was acclaimed on the spot; the Sa'di star rose until Europe's embassies 'kept morning and evening at her palace gates' {cite:dawlat-uthmaniyya-salabi p. 258-268}."
  fr: "La bataille des Trois Rois à al-Qasr al-Kabir, le lundi 30 Jumada II 986/4 août 1578. Le sultan du Maroc Abd al-Malik al-Mu'tasim, soutenu par les Ottomans, affronta le roi Sébastien de Portugal, qui avait massé des dizaines de milliers de soldats espagnols, portugais, italiens et allemands pour rétablir son allié déposé Muhammad al-Mutawakkil. Abd al-Malik coupa l'ennemi de sa flotte et fit sauter le seul pont du fleuve ; il mourut de maladie quelques minutes après le début de la bataille, son chambellan Ridwan et son frère Ahmad al-Mansur le cachant jusqu'à ce que la victoire soit complète, en quatre heures et un tiers. Les trois rois périrent, Sébastien tué, al-Mutawakkil noyé, Abd al-Malik sur le champ de bataille, et Ahmad al-Mansur fut acclamé sur place ; l'étoile saadienne s'éleva jusqu'à ce que les ambassades d'Europe « se tiennent matin et soir aux portes de son palais » {cite:dawlat-uthmaniyya-salabi p. 258-268}."
  es: "La batalla de los Tres Reyes en al-Qasr al-Kabir, lunes 30 de Jumada II de 986/4 de agosto de 1578. El sultán de Marruecos, Abd al-Malik al-Mu'tasim —apoyado por los otomanos— se enfrentó al rey Sebastián de Portugal, quien había reunido a decenas de miles de tropas españolas, portuguesas, italianas y alemanas para restaurar a su aliado depuesto, Muhammad al-Mutawakkil. Abd al-Malik cortó el paso a la flota enemiga y voló el único puente del río; murió de una enfermedad minutos después de comenzar la batalla, y su chambelán Ridwan y su hermano Ahmad al-Mansur lo ocultaron hasta que la victoria fue completa en cuatro horas y un tercio. Los tres reyes perecieron: Sebastián fue asesinado, al-Mutawakkil se ahogó y Abd al-Malik murió en el campo de batalla; y Ahmad al-Mansur fue aclamado en el lugar. la estrella sa'dí se elevó hasta que las embajadas de Europa 'permanecieron mañana y tarde a las puertas de su palacio' {cita:dawlat-uthmaniyya-salabi p. 258-268}."
  ur: "القصر الکبیر میں تین بادشاہوں کی جنگ، پیر 30 جمادی الثانی 986/4 اگست 1578۔ مراکش کے سلطان عبد المالک المعتصم - عثمانی حمایت یافتہ - نے پرتگال کے بادشاہ سیبسٹین سے ملاقات کی، جس نے اپنے دسیوں ہزار جرمن، پورٹو، ہسپانوی، ہسپانوی، پورٹو، ہسپانوی باشندوں کو جمع کیا تھا۔ معزول اتحادی محمد المتوکل۔ عبد الملک نے دشمن کو اپنے بیڑے سے کاٹ کر دریا کا واحد پل اڑا دیا۔ وہ لڑائی کے چند منٹوں میں بیماری کی وجہ سے مر گیا، اس کے چیمبرلین رضوان اور بھائی احمد المنصور نے اسے چھپایا یہاں تک کہ فتح چار گھنٹے اور ایک تہائی میں مکمل ہو گئی۔ تینوں بادشاہ ہلاک ہو گئے — سیبسٹین مقتول، المتوکل ڈوب گئے، عبد الملک میدان میں — اور احمد المنصور کو موقع پر ہی سراہا گیا۔ سعدی ستارہ طلوع ہوا یہاں تک کہ یورپ کے سفارت خانے صبح و شام اپنے محل کے دروازوں پر لگے رہتے تھے۔ 258-268}۔"
  tr: "Üç Kral Savaşı, Hicri 986 yılının Cemadi el-Sani 30 Pazartesi günü / Miladi 4 Ağustos 1578'de Büyük Saray'da gerçekleşti. Osmanlıların desteğini alan Fas Sultanı Abdülmalik el-Mutesim Billah, tahttan indirilen müttefiki Muhammed el-Mutavakkil'i yeniden tahta çıkarmak için on binlerce İspanyol, Portekizli, İtalyan ve Alman askeri toplamış olan Portekiz Kralı Sebastian'ın ordusuyla karşılaştı. Abdülmalik düşman filosunu izole etti ve nehir üzerindeki tek köprüyü yıktı. Hasta olduğu için savaşın başında öldü ve ölümü, saray nazırı Rızvan ve kardeşi Ahmed el-Mansur tarafından, dört saat yirmi dakika içinde zafer elde edilene kadar gizlendi. Üç kral da öldü: Sebastian öldürüldü, el-Mutavakkil boğuldu ve Abdülmalik Fida Meydanı'nda öldürüldü. Ahmed el-Mansur aynı meydanda sultan ilan edildi ve Saadi hanedanı, Avrupalı heyetlerin saraylarını sık sık ziyaret etmesine kadar yükselişe geçti."
  id: "Pertempuran Tiga Raja di Istana Agung terjadi pada hari Senin, 30 Jumada al-Thani 986 H/4 Agustus 1578 M. Sultan Maroko, Abd al-Malik al-Mu'tasim Billah—yang didukung oleh Ottoman—bertemu dengan pasukan Raja Sebastian dari Portugal, yang telah mengumpulkan puluhan ribu orang Spanyol, Portugis, Italia, dan Jerman untuk mengembalikan sekutunya yang telah digulingkan, Muhammad al-Mutawakkil. Abd al-Malik mengisolasi armada musuh dan menghancurkan satu-satunya jembatan di atas sungai. Ia meninggal di awal pertempuran karena sakit, dan kematiannya disembunyikan oleh pengawalnya, Ridwan, dan saudaranya, Ahmad al-Mansur, hingga kemenangan diraih dalam waktu empat jam dua puluh menit. Ketiga raja tersebut tewas: Sebastian terbunuh, al-Mutawakkil tenggelam, dan Abd al-Malik terbunuh di Lapangan Fida. Ahmad al-Mansur diproklamasikan sebagai sultan di alun-alun yang sama, dan dinasti Saadi menjadi terkenal hingga delegasi Eropa sering mengunjungi istana-istananya."
