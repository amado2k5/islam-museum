summary:
  ar: "وقعة الملوك الثلاثة عند القصر الكبير يوم الاثنين ٣٠ جمادى الآخرة ٩٨٦هـ/٤ أغسطس ١٥٧٨م. التقى سلطان المغرب عبد الملك المعتصم بالله — المدعوم عثمانياً — جيشَ ملك البرتغال سبستيان الذي حشد عشرات الألوف من الأسبان والبرتغاليين والطليان والألمان لإعادة حليفه المخلوع محمد المتوكل. عزل عبد الملك العدو عن أسطوله ونسف قنطرة النهر الوحيدة، وتوفي في أول المعركة مريضاً كما كان وأخفى موته حاجبه رضوان وأخوه أحمد المنصور حتى تم النصر في أربع ساعات وثلث؛ فهلك الملوك الثلاثة: سبستيان قتيلاً والمتوكل غريقاً وعبد الملك في ساحة الفدا. وبويع أحمد المنصور في الميدان نفسه، وارتفع نجم الدولة السعدية حتى باتت وفود أوروبا تصبح وتمسي على أعتاب قصورها {cite:dawlat-uthmaniyya-salabi p. 258-268}."
  en: "The Battle of the Three Kings at al-Qasr al-Kabir, Monday 30 Jumada II 986/4 August 1578. Morocco's sultan Abd al-Malik al-Mu'tasim — Ottoman-backed — met King Sebastian of Portugal, who had massed tens of thousands of Spanish, Portuguese, Italian and German troops to restore his deposed ally Muhammad al-Mutawakkil. Abd al-Malik cut the enemy from his fleet and blew the river's only bridge; he died of illness minutes into the battle, his chamberlain Ridwan and brother Ahmad al-Mansur concealing it until victory was complete in four hours and a third. All three kings perished — Sebastian slain, al-Mutawakkil drowned, Abd al-Malik on the field — and Ahmad al-Mansur was acclaimed on the spot; the Sa'di star rose until Europe's embassies 'kept morning and evening at her palace gates' {cite:dawlat-uthmaniyya-salabi p. 258-268}."
