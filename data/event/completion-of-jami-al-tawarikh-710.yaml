label:
  ar: "إتمام جامع التواريخ سنة 710"
  en: "Completion of the Jami al-Tawarikh, 710 AH"
  ur: "جامع التواریخ کی تکمیل، 710ھ"
  fr: "Achèvement du Jami al-Tawarikh, 710 AH"
  es: "Conclusión del Jami al-Tawarikh, 710 AH"
  tr: "Kroniklerin derlenmesi 710 yılında tamamlandı."
