summary:
  ar: "أُتمّ جامع التواريخ كله، تحريراً ونسخاً وتجليداً، سنة 710هـ، وأُودع في مكتبة المسجد الذي بناه رشيد الدين في تبريز {cite:jami-al-tawarikh-khashshab-1960 p. 116}. وكان الجزء الأول منه يسمّى «تاريخ غازان» تكريما للسلطان الذي ألّف تحت رعايته {cite:jami-al-tawarikh-khashshab-1960 p. 117}، وكان الكتاب قد قارب تمامه حين توفي غازان {cite:jami-al-tawarikh-khashshab-1960 p. 116}. وطلب غازان إلى المؤلف أن يضيف عرضاً عاماً لتاريخ الشعوب وصفاً للأرض، وكانت الخطة التي يذكرها المؤلف في مقدمته تجعل الكتاب في أربع مجلدات {cite:jami-al-tawarikh-khashshab-1960 p. 118}. ويذكر الخشاب أن رواية وصّاف تقتضي أن المؤلف واصل العمل إلى سنة 712 أو 713، وأن هذا يخص على الأرجح الجزء المتعلق بأولجايتو {cite:jami-al-tawarikh-khashshab-1960 p. 117}."
  en: "The whole Jami al-Tawarikh was completed in 710 AH, written, copied and bound, and deposited in the library of the mosque Rashid al-Din had built in Tabriz {cite:jami-al-tawarikh-khashshab-1960 p. 116}. The first volume was named Tarikh Ghazan after the sultan under whose patronage it was written {cite:jami-al-tawarikh-khashshab-1960 p. 117}, and the work was nearly complete when Ghazan died {cite:jami-al-tawarikh-khashshab-1960 p. 116}. Ghazan also asked for a general history of the peoples the Mongols had known and a description of all the peoples of the earth {cite:jami-al-tawarikh-khashshab-1960 p. 116}. The plan in the author's preface has four volumes {cite:jami-al-tawarikh-khashshab-1960 p. 118}. A report in Wassaf, as the translator reads it, has the work continued to 712 or 713 AH, which probably concerns the part on Oljeitu {cite:jami-al-tawarikh-khashshab-1960 p. 117}."
  ur: "پورا جامع التواریخ 710ھ میں تحریر، نقل اور جلد بندی کے ساتھ مکمل ہوا، اور تبریز میں رشید الدین کی بنائی ہوئی مسجد کی لائبریری میں رکھا گیا {cite:jami-al-tawarikh-khashshab-1960 p. 116}۔ پہلی جلد کا نام تاریخ غازان رکھا گیا، اس سلطان کے نام پر جن کی سرپرستی میں یہ لکھی گئی {cite:jami-al-tawarikh-khashshab-1960 p. 117}، اور ان کی وفات کے وقت کتاب تقریباً مکمل ہو چکی تھی {cite:jami-al-tawarikh-khashshab-1960 p. 116}۔"
  fr: "L'ensemble du Jami al-Tawarikh fut achevé en 710 AH, écrit, copié et relié, et déposé dans la bibliothèque de la mosquée que Rashid al-Din avait fait construire à Tabriz {cite:jami-al-tawarikh-khashshab-1960 p. 116}. Le premier volume portait le nom de Tarikh Ghazan, en l'honneur du sultan sous le patronage duquel il fut écrit {cite:jami-al-tawarikh-khashshab-1960 p. 117}, et l'ouvrage était presque achevé à sa mort {cite:jami-al-tawarikh-khashshab-1960 p. 116}. Le plan donné par l'auteur dans sa préface comporte quatre volumes {cite:jami-al-tawarikh-khashshab-1960 p. 118}. Un passage de Wassaf, tel que le lit le traducteur, indique une suite jusqu'en 712 ou 713 AH, concernant probablement la partie sur Oljeitu {cite:jami-al-tawarikh-khashshab-1960 p. 117}."
  es: "Todo el Jami al-Tawarikh fue concluido en 710 AH, escrito, copiado y encuadernado, y depositado en la biblioteca de la mezquita que Rashid al-Din había construido en Tabriz {cite:jami-al-tawarikh-khashshab-1960 p. 116}. El primer volumen llevaba el nombre de Tarikh Ghazan, en honor del sultán bajo cuyo patrocinio se escribió {cite:jami-al-tawarikh-khashshab-1960 p. 117}, y la obra estaba casi terminada cuando murió Ghazan {cite:jami-al-tawarikh-khashshab-1960 p. 116}. El plan que da el autor en su prefacio prevé cuatro volúmenes {cite:jami-al-tawarikh-khashshab-1960 p. 118}. Un pasaje de Wassaf, tal como lo lee el traductor, indica una continuación hasta 712 o 713 AH, que probablemente se refiere a la parte sobre Oljeitu {cite:jami-al-tawarikh-khashshab-1960 p. 117}."
  tr: "Düzenleme, kopyalama ve ciltleme dahil olmak üzere Cami'ü'l-Tavarih'in tamamı Hicri 710 yılında tamamlanmış ve Tebriz'de Reşid-Din tarafından yaptırılan caminin kütüphanesine bırakılmıştır {cite:jami-al-tawarikh-khashshab-1960 s. 116}. İlk bölüm, yazıldığı himayedeki sultanın şerefine \"Gazan Tarihi\" olarak adlandırılmıştır {cite:jami-al-tawarikh-khashshab-1960 s. 117}. Kitap neredeyse tamamlanmışken Gazan vefat etmiştir {cite:jami-al-tawarikh-khashshab-1960 s. 116}. Gazan, yazardan halkların tarihine dair genel bir bakış ve toprakların bir tanımını eklemesini istemiştir. Yazarın giriş bölümünde bahsettiği plan, kitabı dört cilt halinde yayımlayacaktı {cite:jami-al-tawarikh-khashshab-1960 s. 118}. Al-Khashab, Wassaf'ın anlatımının yazarın 712 veya 713 yılına kadar çalışmaya devam ettiğini ima ettiğini ve bunun büyük olasılıkla Oljeito ile ilgili bölümü kapsadığını belirtiyor {cite:jami-al-tawarikh-khashshab-1960 s. 117}."
  id: "Seluruh karya Jami' al-Tawarikh, termasuk penyuntingan, penyalinan, dan penjilidan, diselesaikan pada tahun 710 H dan disimpan di perpustakaan masjid yang dibangun oleh Rashid al-Din di Tabriz {cite:jami-al-tawarikh-khashshab-1960 hlm. 116}. Bagian pertama disebut \"Tarikh Ghazan\" (Sejarah Ghazan) untuk menghormati sultan yang di bawah perlindungannya karya tersebut ditulis {cite:jami-al-tawarikh-khashshab-1960 hlm. 117}. Buku tersebut hampir selesai ketika Ghazan meninggal {cite:jami-al-tawarikh-khashshab-1960 hlm. 116}. Ghazan meminta penulis untuk menambahkan gambaran umum sejarah bangsa-bangsa dan deskripsi tentang wilayah tersebut. Rencana yang disebutkan oleh penulis dalam pengantarnya akan menjadikan buku tersebut menjadi empat jilid {cite:jami-al-tawarikh-khashshab-1960 hlm. 118}. Al-Khashab menyebutkan bahwa catatan Wassaf menyiratkan bahwa penulis terus bekerja hingga tahun 712 atau 713, dan bahwa hal ini kemungkinan besar berkaitan dengan bagian yang berhubungan dengan Oljeito {cite:jami-al-tawarikh-khashshab-1960 p. 117}."
