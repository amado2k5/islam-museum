id: event/devil-at-the-well
class: event
kind: other
label:
  ar: "الشيطان عند البئر والمسافر"
  en: "The shaytan at the well of the traveller"
  ur: "مسافر کے کنویں پر شیطان"
summary:
  ar: "يحكي الحديث أن رجلاً كان يسير في سفر فرأى شيخاً عند بئر، فلما توضأ الرجل وصلى ركعتين جاءه الشيطان في صورة الشيخ، فقال له «والله ما استطعت أن آذيك اليوم إلا بالصلاة»، ثم فرّ منه {cite:sahih-muslim} {cite:jami-al-tirmidhi}."
  en: "The hadith relates that a man was travelling and saw an old man at a well; when the man performed ablution and prayed two rak'as, the shaytan came to him in the old man's likeness and said 'by God I could not harm you today except through prayer', then fled from him {cite:sahih-muslim} {cite:jami-al-tirmidhi}."
  ur: "حدیث میں آیا ہے کہ ایک آدمی سفر میں تھا اور اس نے کنویں پر ایک بوڑھے آدمی کو دیکھا؛ جب اس آدمی نے وضو کیا اور دو رکعتیں پڑھے تو شیطان اسی بوڑھے کی شکل میں اس کے پاس آیا اور کہا «قسم ہے اللہ کی، آج میں تمہیں دعا کے سوا کچھ نہیں کر سکا»، پھر اس سے بھاگ گیا {cite:sahih-muslim} {cite:jami-al-tirmidhi}۔"
