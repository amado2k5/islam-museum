label: { ar: "الكوكب العظيم ذو الشعاع سنة ست وتسعين", en: "The Great Star with a Ray, in the Year Six and Ninety", es: "La Gran Estrella con un Rayo, en el Año Seis y Noventa", fr: "La Grande Étoile avec un Rayon, en l'an Six et Quatre-Vingt" }
summary:
  ar: "طلع كوكب كبير يشبه الزهرة في كبره وإضاءته عن يسرة القبلة يتموج وله شعاع على الأرض كشعاع القمر ليلة الجمعة مستهل شعبان سنة ست وتسعين، وثبت إلى النصف من ذي القعدة ثم غاب {cite:muntazam-ibn-al-jawzi j.7 p.231}."
  en: "A great star resembling Venus in size and brightness rose to the left of the qibla, shimmering, with a ray on the ground like moonlight, on the night of Friday at the beginning of Sha'ban in the year six and ninety; it stayed until mid-Dhu al-Qa'da, then set {cite:muntazam-ibn-al-jawzi j.7 p.231}."
  es: "Una gran estrella semejante a Venus en tamaño y brillo se elevó a la izquierda de la qibla, centelleando, con un rayo en el suelo como la luz de la luna, en la noche del viernes al comienzo de Sha'ban del año sesenta y noventa; permaneció hasta mediados de Dhu al-Qa'da, y luego se puso {cite:muntazam-ibn-al-jawzi j.7 p.231}."
  fr: "Une grande étoile ressemblant à Vénus par sa taille et sa luminosité s'est levée à gauche de la qibla, scintillante, avec un rayon sur le sol comme le clair de lune, dans la nuit du vendredi au début de Sha'ban de l'an six et quatre-vingt-dix; elle est restée jusqu'au milieu de Dhu al-Qa'da, puis s'est couchée {cite:muntazam-ibn-al-jawzi j.7 p.231}."
