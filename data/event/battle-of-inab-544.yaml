summary:
  ar: "بطاقة أولية لمعركة عناب سنة ١١٤٩م، نصر نور الدين زنكي على الفرنج وهلاك ريموند أنطاكية؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Inab in 1149, Nur al-Din Zengi's victory over the Franks in which Raymond of Antioch fell; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Batalla de Inab en 1149, la victoria de Nur al-Din Zengi sobre los francos en la que cayó Raimundo de Antioquía; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de projet pour la bataille d'Inab en 1149, la victoire de Nur al-Din Zengi sur les Francs au cours de laquelle Raymond d'Antioche trouva la mort; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1149 میں اناب کی جنگ کے لیے ڈرافٹ کارڈ، نورالدین زینگی کی فرینکوں پر فتح جس میں انطاکیہ کا ریمنڈ گرا؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1149 yılında gerçekleşen Annab Muharebesi'nin, Nur ad-Din Zangi'nin Franklar üzerindeki zaferinin ve Antakyalı Raymond'un ölümünün ön anlatımı; kaynakları henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Annab pada tahun 1149 M, kemenangan Nur ad-Din Zangi atas bangsa Frank dan kematian Raymond dari Antiokhia; sumber-sumbernya belum ditinjau di halaman ini."
