id: event/conquest-of-shahrazur
class: event
kind: conquest
label: { ar: "فتح شهرزور والصامغان ودراباذ", en: "Conquest of Shahrazur, al-Samaghan and Darabadh" }
summary:
  ar: "حاول عزرة بن قيس فتح شهرزور وهو وال على حلوان في خلافة عمر فلم يقدر عليها فغزاها عتبة بن فرقد ففتحها بعد قتال على مثل صلح حلوان وكانت المقارب تصيب الرجل من المسلمين فيموت وصالح أهل الصامغان ودراباذ عتبة على الجزية والخراج على أن لا يقتلوا ولا يسبوا ولا يمنعوا طريقاً يسلكونه وقاتل الأكراد فقتل منهم خلقاً وكتب إلى عمر إني قد بلغت بفتوحي أذربيجان فولاه إياها وولى هرثمة بن عرفجة الموصل ولم تزل شهرزور وأعمالها مضمومة إلى الموصل حتى فُرقت في آخر خلافة الرشيد وكان رزق عامل كل كورة مائتي درهم فخط لهذه الكور ستمائة درهم."
  en: "Uzra ibn Qays tried Shahrazur as Umar's governor of Hulwan and could not take it; Utba ibn Farqad stormed it after fighting on Hulwan's treaty terms — the approach-fever killing Muslims — while al-Samaghan and Darabadh treated for jizya and kharaj with no killing, no captives and no path barred. Utba fought the Kurds slaughtering many and wrote Umar 'my conquests reach Azerbaijan' — Umar gave him Azerbaijan and Harthama Mosul; Shahrazur's districts stayed joined to Mosul till late in al-Rashid's reign, each district-agent's 200-dirham salary making 600 for these."
