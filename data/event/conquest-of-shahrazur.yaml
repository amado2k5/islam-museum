class: event
kind: conquest
label: { ar: "فتح شهرزور والصامغان ودراباذ", en: "Conquest of Shahrazur, al-Samaghan and Darabadh", es: "Conquista de Shahrazur, al-Samaghan y Darabadh", fr: "Conquête de Shahrazur, al-Samaghan et Darabadh" }
summary:
  ar: "حاول عزرة بن قيس فتح شهرزور وهو وال على حلوان في خلافة عمر فلم يقدر عليها فغزاها عتبة بن فرقد ففتحها بعد قتال على مثل صلح حلوان وكانت المقارب تصيب الرجل من المسلمين فيموت وصالح أهل الصامغان ودراباذ عتبة على الجزية والخراج على أن لا يقتلوا ولا يسبوا ولا يمنعوا طريقاً يسلكونه وقاتل الأكراد فقتل منهم خلقاً وكتب إلى عمر إني قد بلغت بفتوحي أذربيجان فولاه إياها وولى هرثمة بن عرفجة الموصل ولم تزل شهرزور وأعمالها مضمومة إلى الموصل حتى فُرقت في آخر خلافة الرشيد وكان رزق عامل كل كورة مائتي درهم فخط لهذه الكور ستمائة درهم."
  en: "Uzra ibn Qays tried Shahrazur as Umar's governor of Hulwan and could not take it; Utba ibn Farqad stormed it after fighting on Hulwan's treaty terms — the approach-fever killing Muslims — while al-Samaghan and Darabadh treated for jizya and kharaj with no killing, no captives and no path barred. Utba fought the Kurds slaughtering many and wrote Umar 'my conquests reach Azerbaijan' — Umar gave him Azerbaijan and Harthama Mosul; Shahrazur's districts stayed joined to Mosul till late in al-Rashid's reign, each district-agent's 200-dirham salary making 600 for these."
  es: "Uzra ibn Qays intentó nombrar a Shahrazur gobernador de Hulwan bajo el mando de Umar, pero no pudo tomarla. Utba ibn Farqad la asaltó tras luchar en los términos del tratado de Hulwan —la fiebre del acercamiento mató a los musulmanes—, mientras que al-Samaghan y Darabadh negociaron el pago de la jizya y el kharaj sin asesinatos, sin prisioneros y sin obstáculos. Utba luchó contra los kurdos, masacrando a muchos, y escribió a Umar: «Mis conquistas llegan a Azerbaiyán». Umar le entregó Azerbaiyán y Harthama Mosul. Los distritos de Shahrazur permanecieron unidos a Mosul hasta finales del reinado de al-Rashid, y el salario de 200 dirhams de cada agente de distrito sumaba 600 para estos."
  fr: "Uzra ibn Qays tenta de s'emparer de Shahrazur en tant que gouverneur d'Umar à Hulwan, mais sans succès. Utba ibn Farqad prit d'assaut la ville après avoir combattu selon les termes du traité d'Hulwan – la frénésie de conquête causant de nombreuses victimes parmi les musulmans – tandis qu'al-Samaghan et Darabadh négociaient la jizya et le kharaj sans effusion de sang, sans captifs et sans obstacle sur leur passage. Utba combattit les Kurdes, infligeant de lourdes pertes à ses ennemis, et écrivit à Umar: « Mes conquêtes atteignent l'Azerbaïdjan ». Umar lui octroya l'Azerbaïdjan et Harthama Mossoul. Les districts de Shahrazur restèrent rattachés à Mossoul jusqu'à la fin du règne d'al-Rashid, le salaire de 200 dirhams de chaque agent de district représentant ainsi 600 dirhams pour l'ensemble de ces territoires."
