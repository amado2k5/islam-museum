id: event/ali-ibn-muhammad-ambushes-a-clan-of-troublemakers-at-sawhan-294
class: event
kind: raid
label:
  ar: "علي بن محمد يكمن لجماعة مفسدة من قبيلة في سوحان ويأسر اثنين، سنة 294هـ، ص345-346"
  en: "Ali ibn Muhammad lays an ambush at Sawhan for a group of troublemakers from a clan and takes two of them, 294 AH, pp. 345-346"
  ur: "علی بن محمد کا سوحان میں ایک قبیلے کے فسادیوں کے لیے گھات لگانا اور دو کو پکڑنا، 294ھ، ص345-346"
  es: "Ali ibn Muhammad tiende una emboscada en Sawhan a un grupo de alborotadores de un clan y captura a dos de ellos, 294 AH, pp. 345-346."
  fr: "Ali ibn Muhammad tend une embuscade à Sawhan à un groupe de fauteurs de troubles d'un clan et en capture deux, 294 AH, pp. 345-346"
summary:
  ar: "بلغ محمد بن عبيد الله أن نفراً من قوم مفسدين يبيتون في سوحان، فكمن لهم علي بن محمد على جبل مطل عليها، فظفر برجلين، وانصرف محمد بن عبيد الله إلى الهجر بعد أن هدم منازل من لم يُظفر بهم."
  en: "Muhammad ibn Ubaydallah was told that a group of troublemakers from a clan spent the night at Sawhan. Ali ibn Muhammad lay in ambush on a mountain above the village and took two of them. His father then demolished the houses of those who had not been caught, and the army returned to al-Hijr."
  ur: "محمد بن عبید اللہ کو خبر ملی کہ ایک قبیلے کے فسادی لوگ سوحان میں رات گزارتے ہیں۔ علی بن محمد نے اس کے اوپر پہاڑ پر گھات لگائی اور دو آدمی پکڑے۔ ان کے والد نے جو نہ پکڑے گئے ان کے گھر گرا دیے، اور لشکر الہجر لوٹ آیا۔"
  es: "A Muhammad ibn Ubaydallah le informaron que un grupo de alborotadores de un clan había pasado la noche en Sawhan. Ali ibn Muhammad les tendió una emboscada en una montaña sobre el pueblo y capturó a dos de ellos. Su padre luego demolió las casas de los que no habían sido capturados, y el ejército regresó a al-Hijr."
  fr: "Muhammad ibn Ubaydallah apprit qu'un groupe de fauteurs de troubles d'un clan avait passé la nuit à Sawhan. Ali ibn Muhammad tendit une embuscade sur une montagne surplombant le village et en captura deux. Son père fit ensuite raser les maisons de ceux qui n'avaient pas été pris, et l'armée retourna à al-Hijr."
