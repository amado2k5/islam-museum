id: event/mutarrif-mukram-vendetta
class: event
kind: other
label: { ar: "مقتل مطرف وثأر مكرم", en: "Mutarrif's Killing and Mukram's Vendetta" }
summary:
  ar: "ولى مصعب بن الزبير مطرف بن سيدان الباهلي شرطته في أيام ولايته العراق لأخيه عبد الله بن الزبير فأتي بالنابي بن زياد بن ظبيان وبرجل من بني تميم قطعا الطريق فقتل النابي وضرب التميمي بالسياط فلما عزل مطرف وولي الأهواز جمع له عبيد الله بن زياد بن ظبيان جمعاً وخرج يريده فالتقيا وبينهما نهر فعبر مطرف فعاجله ابن ظبيان فطعنه فقتله فبعث مصعب مكرم بن مطرف في طلبه فسار حتى صار إلى الموضع الذي يعرف بعسكر مكرم فلم يلقه ولحق ابن ظبيان بعبد الملك بن مروان وقاتل معه مصعباً فقتله واحتز رأسه وقال البعيث السكري كفينا وخير الأمر ما كان كافيا سقينا ابن سيدان بكأس دوية."
  en: "Mus'ab made Mutarrif ibn Saydan al-Bahili his Basra police chief; he executed the highwayman al-Nabi ibn Ziyad ibn Zubyan and flogged his Tamimi partner. Transferred to al-Ahwaz, Mutarrif was met by Ubaydallah ibn Ziyad ibn Zubyan's avenging host across a river — he crossed and was stabbed dead. Mus'ab sent Mukram ibn Mutarrif on the blood-feud; he camped where Askar Mukram stands and missed him — Ibn Zubyan reached Abd al-Malik, fought at his side against Mus'ab, killed him and took his head; al-Ba'ith sang 'we spared you — the best affair is sufficiency — we gave Ibn Saydan a bitter cup'."
