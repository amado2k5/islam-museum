label: { ar: "مقتل مطرف وثأر مكرم", en: "Mutarrif's Killing and Mukram's Vendetta", es: "El asesinato de Mutarrif y la venganza de Mukram", fr: "Le meurtre de Mutarrif et la vendetta de Mukram", ur: "مطرف کا قتل اور مکرم کا انتقام" }
summary:
  ar: "ولى مصعب بن الزبير مطرف بن سيدان الباهلي شرطته في أيام ولايته العراق لأخيه عبد الله بن الزبير فأتي بالنابي بن زياد بن ظبيان وبرجل من بني تميم قطعا الطريق فقتل النابي وضرب التميمي بالسياط فلما عزل مطرف وولي الأهواز جمع له عبيد الله بن زياد بن ظبيان جمعاً وخرج يريده فالتقيا وبينهما نهر فعبر مطرف فعاجله ابن ظبيان فطعنه فقتله فبعث مصعب مكرم بن مطرف في طلبه فسار حتى صار إلى الموضع الذي يعرف بعسكر مكرم فلم يلقه ولحق ابن ظبيان بعبد الملك بن مروان وقاتل معه مصعباً فقتله واحتز رأسه وقال البعيث السكري كفينا وخير الأمر ما كان كافيا سقينا ابن سيدان بكأس دوية."
  en: "Mus'ab made Mutarrif ibn Saydan al-Bahili his Basra police chief; he executed the highwayman al-Nabi ibn Ziyad ibn Zubyan and flogged his Tamimi partner. Transferred to al-Ahwaz, Mutarrif was met by Ubaydallah ibn Ziyad ibn Zubyan's avenging host across a river — he crossed and was stabbed dead. Mus'ab sent Mukram ibn Mutarrif on the blood-feud; he camped where Askar Mukram stands and missed him — Ibn Zubyan reached Abd al-Malik, fought at his side against Mus'ab, killed him and took his head; al-Ba'ith sang 'we spared you — the best affair is sufficiency — we gave Ibn Saydan a bitter cup'."
  es: "Mus'ab nombró a Mutarrif ibn Saydan al-Bahili jefe de policía de Basora; ejecutó al bandolero al-Nabi ibn Ziyad ibn Zubyan y azotó a su socio Tamimi. Trasladado a al-Ahwaz, Mutarrif fue recibido por el ejército vengador de Ubaydallah ibn Ziyad ibn Zubyan al otro lado de un río; lo cruzó y fue apuñalado hasta la muerte. Mus'ab envió a Mukram ibn Mutarrif a la venganza; acampó donde se encuentra Askar Mukram y no lo encontró. Ibn Zubyan llegó hasta Abd al-Malik, luchó a su lado contra Mus'ab, lo mató y le cortó la cabeza. Al-Ba'ith cantó: «Te perdonamos la vida; lo mejor es la suficiencia; le dimos a Ibn Saydan una copa amarga»."
  fr: "Mus'ab nomma Mutarrif ibn Saydan al-Bahili chef de la police de Bassora. Il fit exécuter le bandit de grand chemin al-Nabi ibn Ziyad ibn Zubyan et fouetta son associé Tamimi. Transféré à al-Ahwaz, Mutarrif fut accueilli de l'autre côté d'une rivière par les troupes vengeresses d'Ubaydallah ibn Ziyad ibn Zubyan. Il traversa la rivière et fut poignardé à mort. Mus'ab envoya Mukram ibn Mutarrif régler ses comptes. Ce dernier campa à l'endroit où se trouve Askar Mukram et le manqua. Ibn Zubyan atteignit Abd al-Malik, combattit à ses côtés contre Mus'ab, le tua et prit sa tête. Al-Ba'ith chanta: « Nous t'avons épargné – la meilleure chose est la suffisance – nous avons donné à Ibn Saydan une coupe amère. »"
  ur: "مصعب نے مطرف بن سیدان الباہلی کو بصرہ کا پولیس چیف بنایا۔ اس نے ہائی وے مین النبی ابن زیاد ابن ثوبیان کو پھانسی دی اور اپنے ساتھی تمیمی کو کوڑے مارے۔ الاہواز میں منتقل کیا گیا، مطرف کی ملاقات عبیداللہ ابن زیاد ابن زبیان کے بدلہ لینے والے میزبان نے ایک دریا کے اس پار کی - وہ پار گیا اور اسے چاقو کے وار کر کے ہلاک کر دیا گیا۔ مصعب نے مکرم بن مطرف کو خونریزی پر بھیجا۔ اس نے خیمہ لگایا جہاں عسکر مکرم کھڑا تھا اور اسے یاد کیا - ابن ثوبیان عبد الملک کے پاس پہنچا، مصعب کے ساتھ اس کے ساتھ لڑا، اسے قتل کیا اور اس کا سر لے لیا۔ البیت نے گایا 'ہم نے تمہیں بخش دیا - بہترین معاملہ کفایت ہے - ہم نے ابن سیدان کو ایک کڑوا پیالہ دیا'۔"
