label:
  ar: وفاة ابن تيمية بقلعة دمشق وجنازته ودفنه
  en: Death and funeral of Ibn Taymiyya in the Damascus citadel
  ur: قلعۂ دمشق میں ابن تیمیہ کی وفات، جنازہ اور تدفین
  es: "Muerte y funeral de Ibn Taymiyya en la ciudadela de Damasco."
  fr: "Mort et funérailles d'Ibn Taymiyya dans la citadelle de Damas"
  tr: "İbn Taymiyye'nin Şam Kalesi'nde ölümü, cenazesi ve defni"
  id: "Kematian Ibnu Taymiyyah di Benteng Damaskus, pemakaman dan penguburannya"
summary:
  ar: توفي ابن تيمية بقلعة دمشق في القاعة التي كان محبوساً بها ليلة الاثنين العشرين من ذي القعدة سنة 728هـ {cite:al-bidaya-wal-nihaya scan vol. 1 p. 531}، وكان قد قرأ مع أخيه ثمانين ختمة منذ دخل القلعة {cite:al-bidaya-wal-nihaya scan vol. 1 p. 534}. واجتمع لجنازته جمع حُزر في الخبر بين ستين ألف رجل ومئتي ألف، وصُلي عليه في القلعة والجامع الأموي وسوق الخيل {cite:al-bidaya-wal-nihaya scan vol. 1 p. 532}. ودُفن في مقبرة الصوفية إلى جانب أخيه شرف الدين عبد الله {cite:al-bidaya-wal-nihaya scan vol. 1 p. 531}.
  en: Ibn Taymiyya died in the Damascus citadel, in the hall where he was held, on the night of Monday 20 Dhu al-Qa'da 728 AH {cite:al-bidaya-wal-nihaya scan vol. 1 p. 531}; his brother said they had read eighty complete Qur'ans since entering the citadel {cite:al-bidaya-wal-nihaya scan vol. 1 p. 534}. The account estimates the men at his funeral between sixty thousand and two hundred thousand, with prayers in the citadel, the Umayyad Mosque and the horse market {cite:al-bidaya-wal-nihaya scan vol. 1 p. 532}. He was buried in the Sufi cemetery beside his brother Sharaf al-Din Abd Allah {cite:al-bidaya-wal-nihaya scan vol. 1 p. 531}.
  ur: ابن تیمیہ دمشق کے قلعے میں اسی ہال میں جہاں وہ قید تھے، 728ھ کی بیس ذی القعدہ کی پیر کی رات فوت ہوئے {cite:al-bidaya-wal-nihaya scan vol. 1 p. 531}؛ ان کے بھائی کے مطابق قلعے میں آنے کے بعد دونوں نے قرآن کے اسّی ختم مکمل کیے {cite:al-bidaya-wal-nihaya scan vol. 1 p. 534}۔ بیان میں جنازے پر مردوں کا اندازہ ساٹھ ہزار سے دو لاکھ تک ہے اور نماز قلعے، جامع اموی اور سوقِ خیل میں ہوئی {cite:al-bidaya-wal-nihaya scan vol. 1 p. 532}۔ وہ صوفیہ کے قبرستان میں اپنے بھائی شرف الدین عبد اللہ کے پہلو میں دفن ہوئے {cite:al-bidaya-wal-nihaya scan vol. 1 p. 531}۔
  es: "Ibn Taymiyya murió en la ciudadela de Damasco, en la sala donde estaba recluido, la noche del lunes 20 de Dhu al-Qa'da de 728 AH {cite:al-bidaya-wal-nihaya scan vol. 1 p. 531}; su hermano dijo que habían leído ochenta Coranes completos desde que entraron en la ciudadela {cite:al-bidaya-wal-nihaya scan vol. 1 p. 534}. El relato estima que entre sesenta mil y doscientos mil hombres asistieron a su funeral, con oraciones en la ciudadela, la Mezquita Omeya y el mercado de caballos {cite:al-bidaya-wal-nihaya scan vol. 1 p. 532}. Fue enterrado en el cementerio sufí junto a su hermano Sharaf al-Din Abd Allah {cite:al-bidaya-wal-nihaya scan vol. 1 p. 531}."
  fr: "Ibn Taymiyya mourut dans la citadelle de Damas, dans la salle où il était détenu, dans la nuit du lundi 20 Dhu al-Qa'da 728 AH (al-bidaya-wal-nihaya, vol. 1, p. 531). Son frère déclara qu'ils avaient lu quatre-vingts Corans complets depuis leur entrée dans la citadelle (al-bidaya-wal-nihaya, vol. 1, p. 534). Le récit estime le nombre d'hommes présents à ses funérailles entre soixante mille et deux cent mille, avec des prières dans la citadelle, la mosquée des Omeyyades et le marché aux chevaux (al-bidaya-wal-nihaya, vol. 1, p. 532). Il fut enterré au cimetière soufi, auprès de son frère Sharaf al-Din Abd Allah (al-bidaya-wal-nihaya, vol. 1, p. 531)."
  tr: "İbn Taymiyye, Hicri 728 yılının Zilhicce ayının 20. Pazartesi gecesi (Miladi 1328) Şam Kalesi'nde, hapsedildiği salonda vefat etti. Kendisi ve kardeşi, kaleye girdiklerinden beri seksen kez Kur'an okumuşlardı. Cenaze törenine altmış bin ila iki yüz bin erkekten oluşan bir kalabalık toplandı. Kalede, Emevi Camii'nde ve at pazarında onun için dualar edildi. Kardeşi Şaraf el-Din Abdullah'ın yanına, Sufi mezarlığına defnedildi."
  id: "Ibn Taymiyyah wafat di Benteng Damaskus, di aula tempat ia dipenjara, pada malam Senin, tanggal 20 Dzul Qi'dah, 728 H (1328 M). Ia dan saudaranya telah menyelesaikan delapan puluh kali pembacaan Al-Quran sejak memasuki benteng. Diperkirakan enam puluh ribu hingga dua ratus ribu orang berkumpul untuk pemakamannya. Doa dipanjatkan untuknya di benteng, Masjid Umayyah, dan pasar kuda. Ia dimakamkan di pemakaman Sufi di samping saudaranya, Sharaf al-Din Abdullah."
