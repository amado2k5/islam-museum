label:
  ar: "الدارقطني يقرأ القراءات على ابن مجاهد والنقاش، نحو ٣٢٠هـ"
  en: "Al-Daraqutni reads the qira'at under Ibn Mujahid and al-Naqqash, about 320/932"
  ur: "دارقطنی ابن مجاہد اور نقاش سے قراءات پڑھتے ہیں، تقریباً 320ھ/932ء"
summary:
  ar: "أخذ الدارقطني عن أبي بكر بن مجاهد سماعاً، وقرأ على أبي بكر النقاش وعلي بن سعيد القزاز وأحمد بن بويان وأحمد بن محمد الديباجي، وبرع في القراءات {cite:tarikh-islam-dhahabi p.104}؛ وكان له فيها مصنف مختصر جمع الأصول في أبواب عقدها في أول الكتاب، حتى قيل إنه لم يُسبق إلى طريقته في عقد الأبواب وصار القراء بعده يسلكونها {cite:tarikh-islam-dhahabi p.102}."
  en: "Al-Daraqutni took the recitations from Abu Bakr Ibn Mujahid by sama', and read upon Abu Bakr al-Naqqash, 'Ali ibn Sa'id al-Qazzaz, Ahmad ibn Bawiyan and Ahmad ibn Muhammad al-Dibaji, excelling in the qira'at {cite:tarikh-islam-dhahabi p.104}; he wrote on them a short treatise arranging the fundamentals in chapters at the head of the book, a method in which he was never preceded and which the readers after him adopted {cite:tarikh-islam-dhahabi p.102}."
  ur: "دارقطنی نے ابو بکر ابن مجاہد سے قراءات کی سماعت کی اور ابو بکر نقاش، علی بن سعید قزاز، احمد بن بویان اور احمد بن محمد دیباجی پر پڑھا اور قراءات میں ماہر ہوئے {cite:tarikh-islam-dhahabi p.104}؛ اس فن میں ان کی مختصر تصنیف نے اصول کو ابتدائے کتاب میں ابواب میں جمع کیا، وہ طریقہ جس میں وہ سب سے پہلے تھے اور جسے بعد کے قراء نے اپنایا {cite:tarikh-islam-dhahabi p.102}۔"
