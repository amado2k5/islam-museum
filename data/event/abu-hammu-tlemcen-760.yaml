id: event/abu-hammu-tlemcen-760
class: event
kind: conquest
label:
  ar: استرداد أبي حمو تلمسان
  en: Abu Hammu's recovery of Tlemcen
summary:
  ar: "لما هلك السلطان أبو عنان المريني سنة 759هـ قويت عزائم أبي حمو موسى بن يوسف على ارتجاع ملكه، فركبت به الدواودة وزغبة من تونس إلى تلمسان وبها الكتائب المجمرة من بني مرين، فنازلها ثلاثاً ثم اقتحمها في صبيحة الرابعة يوم الأربعاء لثمان خلون من ربيع الأول سنة 760هـ، واحتل قصر ملكه واقتعد أريكته وبويع بيعة الخلافة، وأخرج بني مرين عن أمصار مملكته."
  en: "When the sultan Abu Inan died in 759 AH, Abu Hammu Musa ibn Yusuf's resolve to reclaim his kingdom strengthened; the Dawawida and Zaghba carried him from Tunis to Tlemcen where the Marinid standing battalions lay, besieged it three days and stormed it at dawn of the fourth, Wednesday 8 Rabi I 760, took his palace and seat, received the caliphate's bay'a, and expelled the Marinids from his realm's cities."
