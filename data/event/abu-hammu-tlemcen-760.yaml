id: event/abu-hammu-tlemcen-760
class: event
kind: conquest
label:
  ar: استرداد أبي حمو تلمسان
  en: Abu Hammu's recovery of Tlemcen
  fr: "Reprise de Tlemcen par Abu Hammu"
  es: "La recuperación de Tlemcen por Abu Hammu"
  ur: "ابو حمو کی تلمسن کی بازیابی۔"
  tr: "Ebu Hammu Tlemcen'in kurtarılması"
  id: "Pemulihan Abu Hammu Tlemcen"
summary:
  ar: "لما هلك السلطان أبو عنان المريني سنة 759هـ قويت عزائم أبي حمو موسى بن يوسف على ارتجاع ملكه، فركبت به الدواودة وزغبة من تونس إلى تلمسان وبها الكتائب المجمرة من بني مرين، فنازلها ثلاثاً ثم اقتحمها في صبيحة الرابعة يوم الأربعاء لثمان خلون من ربيع الأول سنة 760هـ، واحتل قصر ملكه واقتعد أريكته وبويع بيعة الخلافة، وأخرج بني مرين عن أمصار مملكته."
  en: "When the sultan Abu Inan died in 759 AH, Abu Hammu Musa ibn Yusuf's resolve to reclaim his kingdom strengthened; the Dawawida and Zaghba carried him from Tunis to Tlemcen where the Marinid standing battalions lay, besieged it three days and stormed it at dawn of the fourth, Wednesday 8 Rabi I 760, took his palace and seat, received the caliphate's bay'a, and expelled the Marinids from his realm's cities."
  fr: "À la mort du sultan Abu Inan en 759 de l’hégire, Abu Hammu Musa ibn Yusuf fut plus résolu à reconquérir son royaume ; les Dawawida et les Zaghba le conduisirent de Tunis à Tlemcen. Après trois jours de siège, il prit la ville d’assaut le mercredi 8 rabi' al-awwal 760, reçut l’allégeance et chassa les Banu Marin des villes de son royaume."
  es: "Cuando el sultán Abu Inan murió en el año 759 de la Hégira, la determinación de Abu Hammu Musa ibn Yusuf de recuperar su reino se fortaleció; los Dawawida y Zaghba lo llevaron desde Túnez hasta Tremecén, donde se encontraban los batallones mariníes, lo sitiaron durante tres días y lo asaltaron al amanecer del cuarto día, miércoles 8 de Rabi I de 760, tomaron su palacio y sede, recibieron la bay'a del califato y expulsaron a los mariníes de las ciudades de su reino."
  ur: "759 ہجری میں جب سلطان ابو عنان کا انتقال ہوا تو ابو حمو موسیٰ بن یوسف کا اپنی سلطنت پر دوبارہ دعویٰ کرنے کا عزم مضبوط ہوا۔ دعویدہ اور زاغبہ اسے تیونس سے تلمسن لے گئے جہاں میرینیڈ کھڑی بٹالینیں پڑی تھیں، تین دن تک اس کا محاصرہ کیا اور چوتھے، بدھ 8 ربیع اول 760 کی صبح اس پر دھاوا بول دیا، اس کے محل اور نشست پر قبضہ کر لیا، خلافت کی بیع حاصل کی، اور میرینیوں کو اس کے علاقوں سے نکال دیا۔"
  tr: "Sultan Ebu İnan el-Marini 759 Hicri yılında vefat edince, Ebu Hammu Musa bin Yusuf'un krallığını geri alma kararlılığı daha da güçlendi. Dawawda ve Zughba kabileleri onunla birlikte Tunus'tan Marinid birliklerinin konuşlandığı Tlemcen'e gittiler. Üç gün boyunca kuşatma altında tuttuktan sonra, dördüncü günün sabahı, yani 760 Hicri yılının Rebiü'l-Evvel ayının sekizinci günü olan Çarşamba günü, şehre baskın düzenledi. Kraliyet sarayına yerleşti, tahtına oturdu ve halife olarak biat yemini etti. Marinidleri krallığının şehirlerinden kovdu."
  id: "Ketika Sultan Abu Inan al-Marini wafat pada tahun 759 H, tekad Abu Hammu Musa bin Yusuf untuk merebut kembali kerajaannya semakin kuat. Suku Dawawda dan Zughba ikut bersamanya dari Tunis ke Tlemcen, tempat batalion Marinid ditempatkan. Ia mengepung kota itu selama tiga hari, kemudian menyerbunya pada pagi hari keempat, Rabu, tanggal delapan Rabi' al-Awwal tahun 760 H. Ia menduduki istana kerajaannya, duduk di singgasananya, dan diikrarkan sumpah setia sebagai Khalifah. Ia mengusir Marinid dari kota-kota di kerajaannya."
