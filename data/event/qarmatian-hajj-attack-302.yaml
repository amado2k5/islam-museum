label: { ar: "هجوم القرامطة على قافلة الحاج بالعقبة", en: "The Qarmatian attack on the pilgrim caravan at al-Aqaba", es: "El ataque de los cármatas a la caravana de peregrinos en al-Aqaba", fr: "L'attaque qarmate contre la caravane de pèlerins à al-Aqaba", ur: "عقبہ کے مقام پر زائرین کے قافلے پر قرامطیوں کا حملہ", tr: "Karmatilerin Akabe'deki Hac kervanına saldırısı", id: "Serangan Qarmatian terhadap kafilah haji di Aqaba" }
summary:
  ar: "في سنة 302هـ اعترضت القرامطة قافلة الحاج في طريق مكة بالعقبة فقتلوهم وسبوا من النساء ما أرادوا واحتووا على ما في القافلة فأخذوا ما قيمته الأموال {cite:muntazam-ibn-al-jawzi p. 351-352}."
  en: "In 302 the Qarmatians ambushed the Hajj caravan at al-Aqba on the Mecca road, killed the pilgrims, took captive women and seized the caravan's goods {cite:muntazam-ibn-al-jawzi p. 351-352}."
  es: "En el año 302, los cármatas emboscaron la caravana del Hajj en al-Aqba, en el camino a La Meca, mataron a los peregrinos, tomaron mujeres cautivas y se apoderaron de las mercancías de la caravana {cite:muntazam-ibn-al-jawzi p. 351-352}."
  fr: "En 302, les Qarmates ont tendu une embuscade à la caravane du Hajj à al-Aqba sur la route de La Mecque, ont tué les pèlerins, ont pris des femmes captives et se sont emparés des biens de la caravane {cite:muntazam-ibn-al-jawzi p. 351-352}."
  ur: "302 میں قرمطیوں نے مکہ کی سڑک پر العقبہ کے مقام پر حج کے قافلے پر گھات لگا کر حاجیوں کو قتل کر دیا، خواتین کو قید کر لیا اور قافلہ کے سامان پر قبضہ کر لیا۔ 351-352}۔"
  tr: "Hicri 302 yılında Karmatiler, Mekke yolundaki Hac kervanını Akabe'de durdurarak, kervandakileri öldürdüler ve istedikleri kadar kadını esir aldılar; kervanda bulunan her şeye el koydular ve değerli olanları da aldılar. {cite:muntazam-ibn-al-jawzi s. 351-352}"
  id: "Pada tahun 302 Hijriah, kaum Qarmatian mencegat kafilah haji di jalan menuju Mekah di Aqaba, membunuh mereka dan menawan wanita sebanyak yang mereka inginkan, dan mereka merampas apa yang ada di dalam kafilah, mengambil apa yang bernilai uang {cite:muntazam-ibn-al-jawzi p. 351-352}."
