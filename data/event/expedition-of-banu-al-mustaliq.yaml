class: event
kind: skirmish
label: { en: "The Expedition of Banu al-Mustaliq (al-Muraysi')", ar: "غزوة بني المصطلق ⁦(المريسيع)⁩", es: "La expedición de Banu al-Mustaliq (al-Muraysi')", fr: "L'expédition de Banu al-Mustaliq (al-Muraysi')", ur: "غزوہ بنو المصطلق ⁦(المریسی)⁩" }
summary:
  en: "In Sha'ban 6 AH (December 627 CE), the Prophet led an expedition against Banu al-Mustaliq at the watering-place of al-Muraysi' after intelligence revealed their mobilization; following a brief exchange, their forces scattered, their camp was taken, and the Prophet married Juwayriyya bint al-Harith, prompting the Muslims to free a hundred families of her clan."
  ar: "في شعبان سنة 6هـ ⁦(ديسمبر 627م)⁩، خرج النبي لمباغتة بني المصطلق من خزاعة على ماء المريسيع بقديد إثر تحشيد زعيمهم الحارث بن أبي ضرار؛ ترامى الفريقان بالنبل ثم هجم المسلمون فقُتل عشرة وهرب الباقون، وغنم المسلمون نعمهم وسبيهم؛ وتزوج النبي برة بنت الحارث ⁦(جويرية)⁩ فأعتق المسلمون مائة أهل بيت من بني المصطلق إكراماً لأصهار رسول الله."
  es: "En Sha'ban 6 AH (diciembre de 627 d. C.), el Profeta dirigió una expedición contra Banu al-Mustaliq en el abrevadero de al-Muraysi' después de que la inteligencia revelara su movilización; después de un breve intercambio, sus fuerzas se dispersaron, su campamento fue tomado y el Profeta se casó con Juwayriyya bint al-Harith, lo que impulsó a los musulmanes a liberar a cien familias de su clan."
  fr: "En Sha'ban 6 AH (décembre 627 CE), le Prophète mena une expédition contre les Banu al-Mustaliq au point d'eau d'al-Muraysi' après que des renseignements eurent révélé leur mobilisation; après un bref échange, leurs forces se dispersèrent, leur camp fut pris et le Prophète épousa Juwayriyya bint al-Harith, incitant les musulmans à libérer une centaine de familles de son clan."
  ur: "شعبان 6 ہجری ⁦(دسمبر 627 عیسوی)⁩ میں، انٹیلی جنس نے ان کے متحرک ہونے کا انکشاف کرنے کے بعد، رسول اللہ نے بنو المصطلق کے خلاف المریسی کے پانی کے مقام پر ایک مہم کی قیادت کی۔ ایک مختصر تبادلے کے بعد، ان کی فوجیں منتشر ہو گئیں، ان کے کیمپ پر قبضہ کر لیا گیا، اور نبی نے جویریہ بنت الحارث سے شادی کی، جس سے مسلمانوں نے اپنے قبیلے کے سو خاندانوں کو آزاد کر دیا۔"
