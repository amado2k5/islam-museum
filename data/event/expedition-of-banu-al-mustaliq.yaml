label: { en: "The Expedition of Banu al-Mustaliq (al-Muraysi')", ar: "غزوة بني المصطلق (المريسيع)" }
summary:
  en: "In Sha'ban 6 AH (December 627 CE), the Prophet led an expedition against Banu al-Mustaliq at the watering-place of al-Muraysi' after intelligence revealed their mobilization; following a brief exchange, their forces scattered, their camp was taken, and the Prophet married Juwayriyya bint al-Harith, prompting the Muslims to free a hundred families of her clan."
  ar: "في شعبان سنة 6هـ (ديسمبر 627م)، خرج النبي لمباغتة بني المصطلق من خزاعة على ماء المريسيع بقديد إثر تحشيد زعيمهم الحارث بن أبي ضرار؛ ترامى الفريقان بالنبل ثم هجم المسلمون فقُتل عشرة وهرب الباقون، وغنم المسلمون نعمهم وسبيهم؛ وتزوج النبي برة بنت الحارث (جويرية) فأعتق المسلمون مائة أهل بيت من بني المصطلق إكراماً لأصهار رسول الله."
