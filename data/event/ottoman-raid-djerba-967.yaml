label: { ar: "هجوم بيالي باشا على جربة ⁦(٩٦٧هـ/١٥٦٠م)⁩", en: "Piyale Pasha's attack on Djerba (967/1560)", es: "El ataque de Piyale Pasha a Djerba (967/1560)", fr: "Attaque de Piyale Pacha sur Djerba (967/1560)", ur: "پیالی پاشا کا جربا پر حملہ (967/1560)", tr: "Biyali Paşa'nın Cerbe'ye saldırısı (H. 967/MS 1560)", id: "Penyerangan Biyali Pasha ke Djerba (967 H/1560 M)" }
summary:
  ar: "قام الأسطول العثماني بقيادة بيالي باشا بالهجوم على جزيرة جربة في رمضان ٩٦٧هـ/مايو ١٥٦٠م ونجح في تحقيق أهدافه ضد الأسبان الذين استنجدوا بفرنسا؛ ثم أقنعه درغوث باشا بالتوجه إلى طرابلس للقضاء على التمرد قرب تاجوراء فدخلها دخول الفاتحين بسفن مزينة بأعلام الأعداء منكسة {cite:dawlat-uthmaniyya-salabi p. 249}."
  en: "The Ottoman fleet under Piyale Pasha attacked the island of Djerba in Ramadan 967/May 1560 and achieved its aims against the Spanish, who did not scruple to call in France; then, at Dragut's persuasion, he turned to Tripoli to crush the rising near Tajura, entering it like a conqueror with enemy flags drooping from his masts {cite:dawlat-uthmaniyya-salabi p. 249}."
  es: "La flota otomana al mando de Piyale Pasha atacó la isla de Djerba en Ramadán de 967/mayo de 1560 y logró sus objetivos contra los españoles, quienes no dudaron en recurrir a Francia; luego, a instancias de Dragut, se dirigió a Trípoli para aplastar la rebelión cerca de Tajura, entrando en ella como un conquistador con banderas enemigas ondeando en sus mástiles {cite:dawlat-uthmaniyya-salabi p. 249}."
  fr: "La flotte ottomane sous le commandement de Piyale Pacha attaqua l'île de Djerba en Ramadan 967/mai 1560 et atteignit ses objectifs contre les Espagnols, qui n'hésitèrent pas à faire appel à la France; puis, à la persuasion de Dragut, il se tourna vers Tripoli pour écraser le soulèvement près de Tajura, y entrant comme un conquérant avec des drapeaux ennemis affaissés sur ses mâts {cite:dawlat-uthmaniyya-salabi p. 249}."
  ur: "پیالے پاشا کی قیادت میں عثمانی بحری بیڑے نے رمضان 967/مئی 1560 میں جزیرے جربا پر حملہ کیا اور ہسپانویوں کے خلاف اپنے مقاصد حاصل کر لیے، جنہوں نے فرانس میں بلانے میں کوئی شکوہ نہیں کیا۔ پھر، ڈریگٹ کی ترغیب پر، اس نے تاجورا کے قریب عروج کو کچلنے کے لیے طرابلس کا رخ کیا، اور اس میں ایک فاتح کی طرح داخل ہوا جس میں دشمن کے جھنڈے اس کے مستولوں سے گرے ہوئے تھے۔ 249}۔"
  tr: "Piyali Paşa önderliğindeki Osmanlı donanması, Hicri 967 Ramazan ayında/Miladi 1560 Mayıs ayında Cerbe adasına saldırdı ve Fransa'dan yardım isteyen İspanyollara karşı hedeflerine ulaştı. Ardından Dragut Paşa onu, Tejura yakınlarındaki isyanı bastırmak için Trablus'a gitmeye ikna etti ve böylece düşman bayrakları indirilmiş gemilerle fatih olarak şehre girdi. {cite:dawlat-uthmaniyya-salabi s. 249}"
  id: "Armada Ottoman, yang dipimpin oleh Piyali Pasha, menyerang pulau Djerba pada bulan Ramadan 967 H/Mei 1560 M dan berhasil mencapai tujuannya melawan Spanyol, yang meminta bantuan dari Prancis. Kemudian Dragut Pasha membujuknya untuk menuju Tripoli untuk menumpas pemberontakan di dekat Tajoura, sehingga ia memasuki kota itu sebagai penakluk dengan kapal-kapal yang dihiasi bendera musuh yang diturunkan. {cite:dawlat-uthmaniyya-salabi p. 249}."
