summary:
  ar: "بهرسير، المدينة العتيقة وهي المدائن الدنيا من الغرب: قدّم سعد بن أبي وقاص زُهرة إليها فتلقّاه شيرازاد دهقان ساباط بالصلح فصالحه على تأدية الجزية، ولقي زهرة كتيبة بنت كسرى التي تدعى بوران وكانوا يحلفون كل يوم أن لا يزول ملك فارس ما عشنا فهزمهم وقتل هاشم بن عتبة ابن أخي سعد المقرَّط — أسدًا كان لكسرى قد ألِفَه. وقبّل سعد رأس هاشم وقبّل هاشم قدم سعد، وأرسله في المقدمة فنزل على المظلم ثم على بهرسير، ووصلها سعد والمسلمون فرأوا الإيوان فقال ضرار بن الخطاب: الله أكبر! أبيض كسرى! هذا ما وعد الله ورسوله، وكبّر وكبّر الناس معه فكانوا كلما وصلت طائفة كبّروا، وكان نزولهم على المدينة في ذي الحجة {cite:kamil-ibn-al-athir p. 335-336}."
  en: "Bahurasir, the lower city of al-Mada'in: Sa'd sent Zuhra ahead — Shirazad, the dihqan of Sabat, came to terms on the jizya, while Hashim ibn 'Utba, Sa'd's nephew, shattered Kisra's own 'Buran' cohort who swore daily Persia's rule would never pass while they lived, and killed the Muqarrat — a lion Kisra had tamed. Sa'd kissed Hashim's head, Hashim kissed Sa'd's foot, and was sent on in the van. When the Muslims reached the city and saw the iwan, Dirar ibn al-Khattab cried: 'Allahu akbar — Kisra's white palace! This is what God and His messenger promised,' and the army kept takbiring as each company arrived; they came down on the city in Dhu'l-Hijja {cite:kamil-ibn-al-athir p. 335-336}."
  es: "Bahurasir, la ciudad baja de al-Mada'in: Sa'd envió a Zuhra por delante; Shirazad, el dihqan de Sabat, llegó a un acuerdo sobre la jizya, mientras que Hashim ibn 'Utba, sobrino de Sa'd, destrozó la propia cohorte 'Buran' de Kisra, que juraba diariamente que el dominio de Persia nunca pasaría mientras vivieran, y mató al Muqarrat, un león que Kisra había domesticado. Sa'd besó la cabeza de Hashim, Hashim besó el pie de Sa'd y fue enviado en la vanguardia. Cuando los musulmanes llegaron a la ciudad y vieron el iwan, Dirar ibn al-Khattab gritó: '¡Allahu Akbar! ¡El palacio blanco de Kisra! Esto es lo que Dios y Su mensajero prometieron', y el ejército siguió haciendo takbiring a medida que llegaba cada compañía; descendieron sobre la ciudad en Dhu'l-Hijja {cite:kamil-ibn-al-athir p. 335-336}."
  fr: "Bahurasir, la ville basse d'al-Mada'in: Sa'd envoya Zuhra en avant. Shirazad, le dihqan de Sabat, négocia la jizya, tandis que Hashim ibn 'Utba, neveu de Sa'd, anéantit la cohorte « Buran » de Kisra, qui jurait chaque jour que la domination perse ne prendrait jamais fin de leur vivant, et tua le Muqarrat, un lion que Kisra avait dompté. Sa'd baisa la tête de Hashim, Hashim baisa le pied de Sa'd, et il partit en avant. Lorsque les musulmans atteignirent la ville et virent l'iwan, Dirar ibn al-Khattab s'écria: « Allahu akbar ! Le palais blanc de Kisra ! Voilà ce que Dieu et Son messager ont promis ! » et l'armée continua de chanter le takbir à l'arrivée de chaque compagnie; ils descendirent sur la ville en Dhu'l-Hijja (cite: kamil-ibn-al-athir p. 1). 335-336}."
  ur: "بہرصیر، المدائن کا نچلا شہر: سعد نے زہرہ کو آگے بھیجا - سبط کے دہقان، شیرازد نے جزیہ پر رضامندی ظاہر کی، جب کہ سعد کے بھتیجے ہاشم بن عتبہ نے کسریٰ کے اپنے 'بران' گروہ کو توڑ دیا جس نے قسم کھائی تھی کہ وہ روزانہ فارس پر حکمرانی نہیں کریں گے اور کبھی زندہ نہیں رہیں گے۔ شیر کسریٰ نے قابو کیا تھا۔ سعد نے ہاشم کے سر کو چوما، ہاشم نے سعد کے پاؤں کو چوما، اور اسے وین میں بھیج دیا گیا۔ جب مسلمان شہر پہنچے اور ایوان کو دیکھا تو دیرار بن الخطاب نے پکارا: اللہ اکبر - کسریٰ کا سفید محل! یہ وہی ہے جس کا خدا اور اس کے رسول نے وعدہ کیا تھا۔ وہ ذی الحجہ کو شہر پر اترے تھے 335-336}۔"
