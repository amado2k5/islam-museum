label: { ar: "وقعة الكناسة", en: "The battle of al-Kunasa", fr: "La bataille d'al-Kunasa", es: "La batalla de al-Kunasa", ur: "الکونسہ کی جنگ", tr: "Süpürge olayı", id: "Insiden sapu" }
summary:
  ar: "في سنة سبع وتسعين ومائة باشر طاهر وقعة الكناسة بنفسه، فقُتل فيها كثير من أصحاب الأمين {cite:tabari-tarikh-abu-al-fadl j.8 p.461}، وذكر الطبري في السنة نفسها وقعة درب الحجارة {cite:tabari-tarikh-abu-al-fadl j.8 p.463}."
  en: "In the year 197 Tahir personally took part in the battle of al-Kunasa, in which many of al-Amin's men were killed {cite:tabari-tarikh-abu-al-fadl j.8 p.461}. In the same year al-Tabari records the battle of Darb al-Hijara {cite:tabari-tarikh-abu-al-fadl j.8 p.463}."
  fr: "En l'an 197, Tahir prit personnellement part à la bataille d'al-Kunasa, dans laquelle beaucoup d'hommes d'al-Amin furent tués {cite:tabari-tarikh-abu-al-fadl j.8 p.461}. La même année, al-Tabari consigne la bataille de Darb al-Hijara {cite:tabari-tarikh-abu-al-fadl j.8 p.463}."
  es: "En el año 197, Tahir participó personalmente en la batalla de al-Kunasa, en la que murieron muchos de los hombres de al-Amin {cite:tabari-tarikh-abu-al-fadl j.8 p.461}. En el mismo año, al-Tabari registra la batalla de Darb al-Hijara {cite:tabari-tarikh-abu-al-fadl j.8 p.463}."
  ur: "سال 197 میں طاہر نے ذاتی طور پر الکونسہ کی لڑائی میں حصہ لیا جس میں الامین کے بہت سے آدمی مارے گئے تھے اسی سال الطبری نے شرح الحجرہ کی جنگ درج کی ہے {حوالہ:طبری تاریخ ابو الفضل ج8 ص 463}۔"
  tr: "197 yılında Tahir, El-Amin'in birçok arkadaşının öldürüldüğü El-Kunasa Muharebesi'ne bizzat önderlik etmiştir {cite:tabari-tarikh-abu-al-fadl j.8 s.461}. El-Tabari aynı yıl Darb el-Hajarah Muharebesi'nden de bahsetmiştir {cite:tabari-tarikh-abu-al-fadl j.8 s.463}."
  id: "Pada tahun 197, Tahir secara pribadi memimpin Perang Al-Kunasa, di mana banyak sahabat Al-Amin gugur {cite:tabari-tarikh-abu-al-fadl j.8 p.461}. Al-Tabari menyebutkan pada tahun yang sama Perang Darb Al-Hajarah {cite:tabari-tarikh-abu-al-fadl j.8 p.463}."
