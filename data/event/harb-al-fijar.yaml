id: event/harb-al-fijar
class: event
kind: war
label: { en: "The Fijar war", ar: "حرب الفجار" }
summary:
  en: "The sacrilegious war between Quraysh and Kinana on one side and Qays 'Aylan on the other, so named because it violated the sanctity of the sanctuary and the sacred months; the fifteen-year-old Muhammad attended, readying arrows for his uncles."
  ar: "الحرب التي دارت بين قريش وكنانة وبين قيس عيلان، وسُميت فجاراً لانتهاك حرمات الحرم والأشهر الحرم؛ حضرها النبي وهو ابن خمس عشرة سنة ينبل على عمومته، أي يجهز لهم النبل للرمي.، وعند المسعودي كانت بين قيس عيلان وبني كنانة استحلوا فيها القتال في الأشهر الحرم فسميت الفجار، وكانت بين عام الفيل وعام الفجار عشرون سنة وانتهى الفجار في شوال {cite:muruj-al-dhahab p. 567-568}"
