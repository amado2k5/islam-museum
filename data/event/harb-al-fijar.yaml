regions: [arabia]
date:
  start: { edtf: "0586~", calendar: julian, precision: year, status: tradition, note: "لخمس عشرة سنة من عمره (الرحيق ص59؛ ابن هشام 1/184-187)." }
sides:
  - label: { en: "Quraysh and Kinana", ar: "قريش وكنانة" }
    participants: [group/quraysh, group/kinana]
