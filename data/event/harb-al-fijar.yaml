kind: war
label: { en: "The Fijar war", ar: "حرب الفجار", es: "La guerra de Fijar", fr: "La guerre des Fidjar", ur: "فجر کی جنگ", tr: "Kutsal Değerlere Saygısızlık Savaşı", id: "Perang Penodaan Agama" }
summary:
  en: "The sacrilegious war between Quraysh and Kinana on one side and Qays 'Aylan on the other, so named because it violated the sanctity of the sanctuary and the sacred months; the fifteen-year-old Muhammad attended, readying arrows for his uncles."
  ar: "الحرب التي دارت بين قريش وكنانة وبين قيس عيلان، وسُميت فجاراً لانتهاك حرمات الحرم والأشهر الحرم؛ حضرها النبي وهو ابن خمس عشرة سنة ينبل على عمومته، أي يجهز لهم النبل للرمي. وعند المسعودي كانت بين قيس عيلان وبني كنانة استحلوا فيها القتال في الأشهر الحرم فسميت الفجار، وكانت بين عام الفيل وعام الفجار عشرون سنة وانتهى الفجار في شوال {cite:muruj-al-dhahab p. 567-568}، وأخبار الأحلاف والفجارات الأربعة على ما قدمه في الأوسط فجار الرجل أو فجار بدر بن معشر وفجار القرد وفجار المرأة والرابع فجار البراض الذي كان فيه القتال وبينه وبين بنيان الكعبة خمس عشرة سنة {cite:muruj-al-dhahab p. 569}"
  es: "La guerra sacrílega entre los Quraysh y los Kinana, por un lado, y Qays 'Aylan, por el otro, llamada así porque violaba la santidad del santuario y los meses sagrados; el joven Muhammad, de quince años, estuvo presente, preparando flechas para sus tíos."
  fr: "La guerre sacrilège entre les Quraysh et Kinana d'un côté et les Qays 'Aylan de l'autre, ainsi nommée parce qu'elle violait la sainteté du sanctuaire et des mois sacrés; le jeune Muhammad, âgé de quinze ans, y assista, préparant des flèches pour ses oncles."
  ur: "ایک طرف قریش اور کنانہ کے درمیان مقدس جنگ اور دوسری طرف قیس عیلان، اس لیے یہ نام رکھا گیا کیونکہ اس نے حرمت اور مقدس مہینوں کی حرمت کو پامال کیا۔ پندرہ سالہ محمد اپنے چچا کے لیے تیر تیار کرتے ہوئے حاضر ہوا۔"
  tr: "Kureyş, Kinane ve Kays-Aylan arasında gerçekleşen ve kutsal ayların kutsallığının ihlali nedeniyle Ficar Savaşı olarak adlandırılan savaş, Peygamberimiz on beş yaşındayken amcaları için ok hazırlarken şahit olduğu bir savaştır. Mesudit'e göre, bu savaş Kays-Aylan ve Beni Kinane arasında gerçekleşmiş ve kutsal aylarda savaşılmasına izin verildiği için Ficar Savaşı olarak adlandırılmıştır. Fil Yılı ile Ficar Savaşı Yılı arasında yirmi yıl geçmiş ve Ficar Savaşı Şevval ayında sona ermiştir. {Kaynak: Muruj-al-Dhahab s. 567-568} İttifakların ve dört Ficar Savaşı'nın anlatımları şöyledir: Adamın Ficar Savaşı veya Bedir ibn Ma'şar'ın Ficar Savaşı, Maymunun Ficar Savaşı, Kadının Ficar Savaşı ve dördüncüsü, savaşın gerçekleştiği ve Kâbe'nin yeniden inşası ile arasında on beş yıl geçen el-Beradh Ficar Savaşı. {kaynak: Muruj-al-Dhahab s. 569}"
  id: "Perang yang terjadi antara Quraysh dan Kinanah serta Qays 'Aylan, dan disebut Perang Fijar karena pelanggaran kesucian bulan-bulan suci, disaksikan oleh Nabi pada usia lima belas tahun, ketika beliau sedang menyiapkan anak panah untuk paman-pamannya. Menurut al-Mas'udi, perang itu terjadi antara Qays 'Aylan dan Banu Kinanah, di mana mereka mengizinkan pertempuran selama bulan-bulan suci, sehingga disebut Perang Fijar. Dua puluh tahun berlalu antara Tahun Gajah dan Tahun Perang Fijar, dan Perang Fijar berakhir pada bulan Syawal {cite:muruj-al-dhahab hlm. 567-568}. Catatan mengenai persekutuan dan empat Perang Fijar adalah sebagai berikut: Perang Fijar Manusia atau Perang Fijar Badr bin Ma'shar, Perang Fijar Monyet, Perang Fijar Wanita, dan yang keempat, Perang Fijar al-Baradh, di mana pertempuran terjadi, dan antara pertempuran itu dan pembangunan kembali Ka'bah, lima belas tahun {cite:muruj-al-dhahab p. 569}."
