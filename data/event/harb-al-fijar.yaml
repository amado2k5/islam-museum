  - label: { en: "Qays 'Aylan", ar: "قيس عيلان" }
    participants: [group/qays-aylan]
outcome:
  en: "Qays prevailed in the morning; Kinana prevailed by mid-day."
  ar: "كان الظفر أول النهار لقيس على كنانة حتى إذا كان وسط النهار كان الظفر لكنانة على قيس (الرحيق ص59)."
significance:
  ar: "على أثرها وقع حلف الفضول في ذي القعدة (الرحيق ص59)."
