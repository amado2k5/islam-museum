label: { ar: "بناء المحمدية بالري", en: "Founding of al-Muhammadiyya at Rayy", es: "Fundación de al-Muhammadiyya en Rayy", fr: "Fondation d'al-Muhammadiyya à Rayy", ur: "رے میں آل محمدیہ کا قیام", tr: "Al-Ray'da Al-Muhammediyah'ın inşası", id: "Membangun Al-Muhammadiyah di Al-Ray" }
summary:
  ar: "قدم المهدي الري في خلافة أبيه المنصور فبنى مدينة الري التي الناس بها اليوم وجعل حولها خندقاً وبنى فيها مسجداً جامعاً جرى على يدي عمّار بن أبي الخصيب وكتب اسمه على حائطه وأرّخ بناءها سنة ثمان وخمسين ومائة وجمل لها فصيلاً بطيف به فارقين أجر وسمّاها المحمدية فكان أهل الري يدعون المدينة الداخلة والفصيل المدينة الخارجة وكان حصن الزنبدي في داخل المحمدية فأمر المهدي بمرمّته ونزله وهو مطل على المسجد الجامع ودار الإمارة وكان المهدي أول مقدمه نزل قرية يقال لها السيروان."
  en: "Al-Mahdi came to Rayy in the caliphate of his father al-Mansur and built the city the people inhabit today, dug a moat around it, built a congregational mosque carried out by Ammar ibn Abi al-Khasib whose name was written on its wall, dated its building 158 AH, girded it with a suburb-wall of fired brick and named it al-Muhammadiyya — Rayy's people call the inner town al-Madina al-Dakhila and the walled suburb al-Madina al-Kharija; Hisn al-Zaynabi lay inside al-Muhammadiyya, al-Mahdi ordered its repair and lodged there overlooking mosque and governor's palace, and on his first arrival he had lodged at a village called al-Sirwan."
  es: "Al-Mahdi llegó a Rayy durante el califato de su padre al-Mansur y construyó la ciudad que la gente habita hoy en día, cavó un foso a su alrededor, construyó una mezquita congregacional llevada a cabo por Ammar ibn Abi al-Khasib, cuyo nombre estaba escrito en su muro, fechó su construcción en el año 158 AH, la rodeó con una muralla de ladrillo cocido y la llamó al-Muhammadiyya. La gente de Rayy llama a la ciudad interior al-Madina al-Dakhila y al suburbio amurallado al-Madina al-Kharija; Hisn al-Zaynabi yacía dentro de al-Muhammadiyya, al-Mahdi ordenó su reparación y se hospedó allí con vistas a la mezquita y al palacio del gobernador, y en su primera llegada se había hospedado en un pueblo llamado al-Sirwan."
  fr: "Al-Mahdi arriva à Rayy sous le califat de son père al-Mansur et y construisit la ville que les habitants habitent aujourd'hui. Il fit creuser des douves autour d'elle, y fit bâtir une mosquée, dont la construction fut réalisée par Ammar ibn Abi al-Khasib, dont le nom fut inscrit sur un mur. Il data sa construction de l'an 158 de l'Hégire, l'entoura d'une enceinte de briques cuites et la nomma al-Muhammadiyya. Les habitants de Rayy appellent la ville intérieure al-Madina al-Dakhila et la banlieue fortifiée al-Madina al-Kharija. Hisn al-Zaynabi résidait à l'intérieur d'al-Muhammadiyya. Al-Mahdi ordonna sa restauration et y logea, avec vue sur la mosquée et le palais du gouverneur. À son arrivée, il avait séjourné dans un village appelé al-Sirwan."
  ur: "المہدی اپنے والد المنصور کی خلافت میں ری میں آیا اور اس شہر کو تعمیر کیا جو آج لوگ آباد ہیں، اس کے ارد گرد ایک کھائی کھودی، عمار بن ابی الخصیب کی طرف سے بنی ہوئی ایک اجتماعی مسجد تعمیر کی جس کی دیوار پر اس کا نام لکھا ہوا تھا، اس کی عمارت کی تاریخ 158 ہجری تھی، اسے ایک مضافاتی علاقہ البریحمۃ والحمدیہ اور اس کا نام دیا گیا تھا۔ رے کے لوگ اندرون شہر کو المدینہ الدخیلہ اور فصیل والے مضافاتی علاقے کو المدینہ الخریجہ کہتے ہیں۔ حسن الزینبی المحمدیہ کے اندر پڑا تھا، المہدی نے اس کی مرمت کا حکم دیا اور مسجد اور گورنر کے محل کو دیکھتے ہوئے وہاں قیام کیا، اور اپنی پہلی آمد پر اس نے السروان نامی گاؤں میں قیام کیا۔"
  tr: "El-Mehdi, babası El-Mansur'un halifeliği döneminde Rayy'a geldi ve bugün insanların yaşadığı Rayy şehrini kurdu. Şehrin etrafına hendek kazdırdı ve içine Ammar bin Abi el-Hasib tarafından yaptırılan bir cami inşa ettirdi. Caminin duvarına adını yazdı ve yapım yılını 158 olarak belirledi. İki dirhem karşılığında bir deve ve bir kervan yaptırdı ve şehre El-Muhammediye adını verdi. Rayy halkı iç şehre, deveye ise dış şehir adını verdi. El-Zanbadi kalesi El-Muhammediye'nin içindeydi, bu yüzden El-Mehdi kalenin onarılmasını emretti ve orada kaldı. Kale, camiye ve Emirliğin evine hakim bir konumdaydı. El-Mehdi'nin ilk gelişi, El-Sirwan adlı bir köyde kaldığı zamandı."
  id: "Al-Mahdi datang ke Rayy pada masa kekhalifahan ayahnya, Al-Mansur, sehingga ia membangun kota Rayy yang dihuni orang-orang saat ini. Ia juga membuat parit di sekelilingnya dan membangun masjid berjamaah di dalamnya, yang dikerjakan oleh Ammar bin Abi Al-Khasib. Ia menulis namanya di dinding masjid dan mencatat tanggal pembangunannya pada tahun 158. Ia juga memberikan seekor unta untuk masjid tersebut dengan kafilah yang dibiayai dua dirham, dan menamakannya Al-Muhammadiyya. Oleh karena itu, penduduk Rayy biasa menyebut kota bagian dalam dan unta sebagai kota bagian luar. Benteng Al-Zanbadi berada di dalam Al-Muhammadiyya, sehingga Al-Mahdi memerintahkan agar benteng tersebut diperbaiki dan ia tinggal di sana. Benteng tersebut menghadap masjid berjamaah dan kediaman Emirat. Kedatangan pertama Al-Mahdi adalah ketika ia tinggal di sebuah desa bernama Al-Sirwan."
