label: { ar: "سقوط الملك المغيث صاحب الكرك", en: "The fall of al-Mughith, lord of Karak", es: "La caída de al-Mughith, señor de Karak", fr: "La chute d'al-Mughith, seigneur de Karak", ur: "کرک کے مالک المغیث کا زوال", tr: "Karak hükümdarı Kral El-Muğit'in düşüşü", id: "Kejatuhan Raja Al-Mughith, penguasa Karak" }
summary:
  ar: "خرج الظاهر بيبرس إلى الشام وتحيل على صاحب الكرك الملك المغيث حتى نزل إليه فكان آخر العهد به لأنه كان كاتب هولاكو على أن يأخذ له مصر وطلب منه عشرين ألف فارس وأخرج كتبه بمصر وقرأها على العلماء فأفتوا بعدم إبقاء من هذا فعله {cite:shadharat-dhahab p. 305}."
  en: "Baybars rode to Syria and by stratagem brought down al-Mughith, lord of Karak — the last of him, for he had corresponded with Hulagu promising him Egypt and asking twenty thousand horse; when his letters were found in Egypt and read to the scholars, they ruled that one who did this might not be left alive {cite:shadharat-dhahab p. 305}."
  es: "Baybars cabalgó hasta Siria y, mediante una estratagema, derrocó a al-Mughith, señor de Karak, el último de ellos, pues se había carteado con Hulagu prometiéndole Egipto y pidiéndole veinte mil caballos; cuando sus cartas fueron encontradas en Egipto y leídas a los eruditos, estos dictaminaron que quien hiciera tal cosa no podría quedar con vida {cite:shadharat-dhahab p. 305}."
  fr: "Baybars chevaucha jusqu'en Syrie et, par ruse, fit tomber al-Mughith, seigneur de Karak — le dernier d'entre eux, car il avait correspondu avec Hulagu lui promettant l'Égypte et lui demandant vingt mille chevaux; lorsque ses lettres furent trouvées en Égypte et lues aux savants, ils décrétèrent que celui qui faisait cela ne pouvait pas rester en vie {cite:shadharat-dhahab p. 305}."
  ur: "Baybars شام کی طرف سوار ہوئے اور تدبیر سے المغیث کو نیچے لایا، جو کرک کا آخری تھا، کیونکہ اس نے حلاگو سے مصر کا وعدہ کیا تھا اور بیس ہزار گھوڑے مانگے تھے۔ جب ان کے خطوط مصر میں پائے گئے اور علماء کو پڑھ کر سنائے گئے تو انہوں نے حکم دیا کہ ایسا کرنے والے کو زندہ نہ چھوڑا جائے۔ 305}۔"
  tr: "El-Zahir Baybars, Levant'a gitti ve Karak hükümdarı Kral El-Muğhit'i kandırarak yanına kadar getirdi; bu, onunla bir daha görülmediği an oldu, çünkü o Hulagu'nun kâtibiydi. Bunu yapmasının şartı, Kral'dan Mısır'ı kendisine teslim etmesiydi. El-Zahir Baybars ondan yirmi bin süvari istedi ve Mısır'da mektuplarını çıkarıp âlimlere okudu. Bunun üzerine âlimler, bunu yapan kimsenin sağ bırakılmaması gerektiğine dair bir fetva çıkardılar. {Kaynak: Şadharat-Dhaba s. 305}"
  id: "Al-Zahir Baybars pergi ke Levant dan menipu penguasa Karak, Raja Al-Mughith, hingga ia datang menemuinya, dan itulah terakhir kalinya ia terlihat bersamanya, karena ia adalah juru tulis Hulagu, dengan syarat ia merebut Mesir untuknya, dan ia meminta dua puluh ribu pasukan berkuda, dan ia membawa surat-suratnya ke Mesir dan membacanya kepada para ulama, dan mereka mengeluarkan fatwa bahwa tidak seorang pun yang melakukan hal ini boleh dibiarkan hidup. {cite:shadharat-dhahab p. 305}."
