summary:
  ar: "استولى محمود بن محمد الحميري على مدينة مرباط وظفار وغيرهما من حضرموت، وكان ابتداء أمره أن له مركباً يكريه في البحر للتجار ثم وزر لصاحب مرباط وفيه كرم وشجاعة وحسن سيرة فلما توفي صاحب مرباط ملك المدينة بعده وأطاعه الناس محبة له لكرمه وسيرته، فلما كان سنة تسع عشرة وستمائة خرّب مرباط وظفار وبنى مدينة جديدة على ساحل البحر بالقرب من مرباط وعندها عين عذبة كبيرة أجراها إلى المدينة وعمل عليها سوراً وخندقاً وحصنها وسماها الأحمدية، وكان يحب الشعر ويكثر الجائزة عليه {cite:kamil-ibn-al-athir p. 293}."
