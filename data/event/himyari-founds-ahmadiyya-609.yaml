label: { ar: "استيلاء الحميري على مرباط وظفار وبناء الأحمدية", en: "Al-Himyari seizes Mirbat and Zafar and founds al-Ahmadiyya", es: "Al-Himyari se apodera de Mirbat y Zafar y funda al-Ahmadiyya.", fr: "Al-Himyari s'empare de Mirbat et de Zafar et fonde al-Ahmadiyya.", ur: "الحمیری نے میربت اور ظفر پر قبضہ کیا اور الاحمدیہ کی بنیاد رکھی", tr: "Himyarîlerin Mirbat ve Dhofar'ı fethi ve Ahmadiyya'nın kurulması", id: "Penaklukan Mirbat dan Dhofar oleh Himyarite dan pembangunan Ahmadiyah" }
summary:
  ar: "استولى محمود بن محمد الحميري على مدينة مرباط وظفار وغيرهما من حضرموت، وكان ابتداء أمره أن له مركباً يكريه في البحر للتجار ثم وزر لصاحب مرباط وفيه كرم وشجاعة وحسن سيرة فلما توفي صاحب مرباط ملك المدينة بعده وأطاعه الناس محبة له لكرمه وسيرته، فلما كان سنة تسع عشرة وستمائة خرّب مرباط وظفار وبنى مدينة جديدة على ساحل البحر بالقرب من مرباط وعندها عين عذبة كبيرة أجراها إلى المدينة وعمل عليها سوراً وخندقاً وحصنها وسماها الأحمدية، وكان يحب الشعر ويكثر الجائزة عليه {cite:kamil-ibn-al-athir p. 293}."
  en: "Mahmud ibn Muhammad al-Himyari seized the city of Mirbat, Zafar and other places in Hadramawt. He began with a ship that he hired out to merchants at sea, then served as minister to the lord of Mirbat, a man of generosity, courage and good conduct. When that lord died, al-Himyari ruled the city in his place, and people obeyed him out of affection for his generosity and conduct. In the year 619 he laid waste to Mirbat and Zafar and built a new city on the coast near Mirbat, beside a large spring of sweet water that he channelled into it; he walled and ditched the city, fortified it and named it al-Ahmadiyya. He loved poetry and gave generous rewards for it {cite:kamil-ibn-al-athir p. 293}."
  es: "Mahmud ibn Muhammad al-Himyari conquistó la ciudad de Mirbat, Zafar y otros lugares de Hadramawt. Comenzó con un barco que alquiló a comerciantes en alta mar, y luego sirvió como ministro del señor de Mirbat, un hombre generoso, valiente y de buena conducta. Cuando este señor murió, al-Himyari gobernó la ciudad en su lugar, y el pueblo le obedeció por afecto a su generosidad y buen comportamiento. En el año 619, arrasó Mirbat y Zafar y construyó una nueva ciudad en la costa cerca de Mirbat, junto a un gran manantial de agua dulce que canalizó hacia ella; amuralló y fortificó la ciudad, la llamó al-Ahmadiyya. Amaba la poesía y otorgaba generosas recompensas por ella {cite:kamil-ibn-al-athir p. 293}."
  fr: "Mahmud ibn Muhammad al-Himyari s'empara de Mirbat, de Zafar et d'autres localités du Hadramaout. Il commença par louer un navire à des marchands, puis devint ministre du seigneur de Mirbat, un homme généreux, courageux et intègre. À la mort de ce dernier, al-Himyari gouverna la ville et les habitants lui obéirent par affection pour sa générosité et sa conduite. En 619, il ravagea Mirbat et Zafar et fonda une nouvelle ville sur la côte, près de Mirbat, à proximité d'une importante source d'eau douce qu'il avait canalisée. Il l'entoura de murailles et de fossés, la fortifia et la nomma al-Ahmadiyya. Il appréciait la poésie et récompensait généreusement ses auteurs (voir Kamil ibn al-Athir, p. 293)."
  ur: "محمود ابن محمد الحمیری نے شہر میربت، ظفر اور حضرموت کے دیگر مقامات پر قبضہ کر لیا۔ اس نے ایک بحری جہاز سے آغاز کیا جسے اس نے سمندر میں تاجروں کے لیے کرائے پر دیا، پھر میربت کے رب کے وزیر کے طور پر کام کیا، جو سخاوت، ہمت اور اچھے اخلاق کا مالک تھا۔ جب وہ آقا مر گیا تو الحمیری نے اس کی جگہ شہر پر حکومت کی اور لوگ اس کی سخاوت اور اخلاق کی وجہ سے اس کی اطاعت کرتے تھے۔ سنہ 619 میں اس نے میربت اور ظفر کو ویران کر دیا اور میربت کے قریب ساحل پر میٹھے پانی کے ایک بڑے چشمے کے پاس ایک نیا شہر بنایا جسے اس نے اس میں بہایا۔ اس نے شہر کی فصیل اور گڑھی کی، اسے مضبوط کیا اور اس کا نام الاحمدیہ رکھا۔ وہ شاعری سے محبت کرتا تھا اور اس کے لیے دل کھول کر انعامات دیتا تھا۔ 293}۔"
  tr: "Mahmud bin Muhammed el-Himyari, Hadramaut'taki Mirbat, Dhofar ve diğer şehirleri ele geçirdi. Hayatının başında, denizde tüccarlara kiraladığı bir gemisi vardı. Sonra Mirbat hükümdarının veziri oldu ve cömert, cesur ve iyi karakterli bir kişiydi. Mirbat hükümdarı öldüğünde, şehri ondan sonra devraldı ve halk, cömertliği ve karakteri nedeniyle ona sevgiyle itaat etti. Hicri 619 yılı geldiğinde, Mirbat ve Dhofar'ı yıktı ve Mirbat yakınlarındaki deniz kıyısında yeni bir şehir kurdu. Orada büyük bir tatlı su kaynağı vardı ve bu kaynağı şehre yönlendirdi. Şehrin etrafına bir sur ve hendek inşa etti, şehri güçlendirdi ve ona el-Ahmadiyye adını verdi. Şiiri severdi ve bunun için birçok sevap verdi. {Kaynak: Kamil İbn el-Atir s. 293}"
  id: "Mahmud bin Muhammad al-Himyari merebut kota Mirbat, Dhofar, dan kota-kota lain di Hadhramaut. Di awal kehidupannya, ia memiliki sebuah kapal yang disewakannya kepada para pedagang di laut. Kemudian ia menjadi menteri bagi penguasa Mirbat, dan ia adalah seorang yang dermawan, pemberani, dan berkarakter baik. Ketika penguasa Mirbat meninggal, ia mengambil alih kota tersebut, dan rakyat menaatinya karena cinta akan kedermawanan dan karakternya. Pada tahun 619 Hijriah, ia menghancurkan Mirbat dan Dhofar dan membangun kota baru di pantai laut dekat Mirbat. Di sana terdapat mata air tawar yang besar, yang ia salurkan ke kota tersebut. Ia membangun tembok dan parit di sekelilingnya dan membentenginya, serta menamakannya al-Ahmadiyya. Ia mencintai puisi dan memberikan banyak hadiah untuk puisi. {cite:kamil-ibn-al-athir p. 293}."
