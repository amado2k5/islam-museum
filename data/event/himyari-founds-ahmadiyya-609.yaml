label: { ar: "استيلاء الحميري على مرباط وظفار وبناء الأحمدية", en: "Al-Himyari seizes Mirbat and Zafar and founds al-Ahmadiyya", es: "Al-Himyari se apodera de Mirbat y Zafar y funda al-Ahmadiyya.", fr: "Al-Himyari s'empare de Mirbat et de Zafar et fonde al-Ahmadiyya." }
summary:
  ar: "استولى محمود بن محمد الحميري على مدينة مرباط وظفار وغيرهما من حضرموت، وكان ابتداء أمره أن له مركباً يكريه في البحر للتجار ثم وزر لصاحب مرباط وفيه كرم وشجاعة وحسن سيرة فلما توفي صاحب مرباط ملك المدينة بعده وأطاعه الناس محبة له لكرمه وسيرته، فلما كان سنة تسع عشرة وستمائة خرّب مرباط وظفار وبنى مدينة جديدة على ساحل البحر بالقرب من مرباط وعندها عين عذبة كبيرة أجراها إلى المدينة وعمل عليها سوراً وخندقاً وحصنها وسماها الأحمدية، وكان يحب الشعر ويكثر الجائزة عليه {cite:kamil-ibn-al-athir p. 293}."
  en: "Mahmud ibn Muhammad al-Himyari seized the city of Mirbat, Zafar and other places in Hadramawt. He began with a ship that he hired out to merchants at sea, then served as minister to the lord of Mirbat, a man of generosity, courage and good conduct. When that lord died, al-Himyari ruled the city in his place, and people obeyed him out of affection for his generosity and conduct. In the year 619 he laid waste to Mirbat and Zafar and built a new city on the coast near Mirbat, beside a large spring of sweet water that he channelled into it; he walled and ditched the city, fortified it and named it al-Ahmadiyya. He loved poetry and gave generous rewards for it {cite:kamil-ibn-al-athir p. 293}."
  es: "Mahmud ibn Muhammad al-Himyari conquistó la ciudad de Mirbat, Zafar y otros lugares de Hadramawt. Comenzó con un barco que alquiló a comerciantes en alta mar, y luego sirvió como ministro del señor de Mirbat, un hombre generoso, valiente y de buena conducta. Cuando este señor murió, al-Himyari gobernó la ciudad en su lugar, y el pueblo le obedeció por afecto a su generosidad y buen comportamiento. En el año 619, arrasó Mirbat y Zafar y construyó una nueva ciudad en la costa cerca de Mirbat, junto a un gran manantial de agua dulce que canalizó hacia ella; amuralló y fortificó la ciudad, la llamó al-Ahmadiyya. Amaba la poesía y otorgaba generosas recompensas por ella {cite:kamil-ibn-al-athir p. 293}."
  fr: "Mahmud ibn Muhammad al-Himyari s'empara de Mirbat, de Zafar et d'autres localités du Hadramaout. Il commença par louer un navire à des marchands, puis devint ministre du seigneur de Mirbat, un homme généreux, courageux et intègre. À la mort de ce dernier, al-Himyari gouverna la ville et les habitants lui obéirent par affection pour sa générosité et sa conduite. En 619, il ravagea Mirbat et Zafar et fonda une nouvelle ville sur la côte, près de Mirbat, à proximité d'une importante source d'eau douce qu'il avait canalisée. Il l'entoura de murailles et de fossés, la fortifia et la nomma al-Ahmadiyya. Il appréciait la poésie et récompensait généreusement ses auteurs (voir Kamil ibn al-Athir, p. 293)."
