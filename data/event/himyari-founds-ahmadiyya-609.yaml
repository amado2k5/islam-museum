label: { ar: "استيلاء الحميري على مرباط وظفار وبناء الأحمدية", en: "Al-Himyari seizes Mirbat and Zafar and founds al-Ahmadiyya" }
summary:
  ar: "استولى محمود بن محمد الحميري على مدينة مرباط وظفار وغيرهما من حضرموت، وكان ابتداء أمره أن له مركباً يكريه في البحر للتجار ثم وزر لصاحب مرباط وفيه كرم وشجاعة وحسن سيرة فلما توفي صاحب مرباط ملك المدينة بعده وأطاعه الناس محبة له لكرمه وسيرته، فلما كان سنة تسع عشرة وستمائة خرّب مرباط وظفار وبنى مدينة جديدة على ساحل البحر بالقرب من مرباط وعندها عين عذبة كبيرة أجراها إلى المدينة وعمل عليها سوراً وخندقاً وحصنها وسماها الأحمدية، وكان يحب الشعر ويكثر الجائزة عليه {cite:kamil-ibn-al-athir p. 293}."
  en: "Mahmud ibn Muhammad al-Himyari seized the city of Mirbat, Zafar and other places in Hadramawt. He began with a ship that he hired out to merchants at sea, then served as minister to the lord of Mirbat, a man of generosity, courage and good conduct. When that lord died, al-Himyari ruled the city in his place, and people obeyed him out of affection for his generosity and conduct. In the year 619 he laid waste to Mirbat and Zafar and built a new city on the coast near Mirbat, beside a large spring of sweet water that he channelled into it; he walled and ditched the city, fortified it and named it al-Ahmadiyya. He loved poetry and gave generous rewards for it {cite:kamil-ibn-al-athir p. 293}."
