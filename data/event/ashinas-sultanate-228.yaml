label: { ar: "استخلاف الواثق أشناس التركي على السلطنة", en: "Al-Wathiq installs Ashinas al-Turki over the sultanate", fr: "Al-Wathiq place Ashinas al-Turki à la tête du sultanat", es: "Al-Wathiq instala a Ashinas al-Turki al frente del Sultanato." }
summary:
  ar: "في سنة ثمان وعشرين ومئتين استخلف الواثق على السلطنة أشناس التركي وألبسه وشاحين مجوهرين وتاجاً مجوهراً، وقال السيوطي أظن أنه أول خليفة استخلف سلطاناً فإن الترك إنما كثروا في أيام أبيه {cite:tarikh-khulafa-minhaj-1434 p. 529}."
  en: "In year 228 al-Wathiq installed Ashinas al-Turki over the sultanate, clothing him in two jewelled sashes and a jewelled crown; al-Suyuti thinks him the first caliph to appoint a sultan — for the Turks had only multiplied in his father's days {cite:tarikh-khulafa-minhaj-1434 p. 529}."
  fr: "En l'an 228, al-Wathiq plaça Ashinas al-Turki à la tête du sultanat, le revêtant de deux écharpes ornées de joyaux et d'une couronne ornée de joyaux ; al-Suyuti pense qu'il fut le premier calife à nommer un sultan, car les Turcs ne s'étaient multipliés qu'à l'époque de son père {cite:tarikh-khulafa-minhaj-1434 p. 529}."
  es: "En el año 228, al-Wathiq instaló a Ashinas al-Turki sobre el sultanato, vistiéndolo con dos fajas enjoyadas y una corona enjoyada; al-Suyuti lo considera el primer califa en nombrar un sultán, ya que los turcos se habían multiplicado en los días de su padre {cite:tarikh-khulafa-minhaj-1434 p. 529}."
