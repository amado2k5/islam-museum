label: { ar: "دعوى الفرياني المهدية", en: "The Faryani's Mahdist claim", es: "La afirmación mahdista de los Faryani", fr: "La revendication mahdiste des Faryani", ur: "فارانی کا مہدیت کا دعویٰ", tr: "El-Faryani'nin Mehdiye'ye yönelik iddiası", id: "Klaim Al-Faryani atas Mahdi" }
summary:
  ar: "في سنة ثمان وأربعين وثمانمائة توجه الشيخ شمس الدين محمد بن أحمد الفرياني المغربي إلى جبال حميدة بالأرض المقدسة وهي جبال شاهقة صعبة المرتقى ليس لها مسلك يسع أكثر من واحد وبأعلى جبل منها سهلة بها مزدرع وعيون ماء وكروم وأقوام في غاية المنعة والقوة من التجأ إليهم أمن ولو حارب بهم السلطان فمن دونه، فنزل الفرياني عندهم وادعى أنه المهدي وقيل ادعى أنه القحطاني وراج أمره هناك؛ وكان قدم القاهرة وأكثر التردد إلى المقريزي وواظب الجولان في قرى الريف الأدنى يعمل المواعيد ويذكر الناس وكان يستحضر كثيراً من التواريخ والأخبار الماضية ويدعي معرفة الحديث النبوي ورجاله وتحول عن مذهب مالك وأدغى أنه يقلد الشافعي وولي قضاء نابلس إلى أن ظهر منه ما ظهر {cite:shadharat-dhahab p. 261-262}."
  en: "In 848 the Moroccan shaykh Muhammad ibn Ahmad al-Faryani withdrew to the sheer Humayda mountains of the Holy Land — a single-file ascent crowned by a fortified plateau of springs and vines — and there declared himself the Mahdi (some said the Qahtani) and his cause thrived; he had once haunted Cairo, frequented al-Maqrizi, preached through the lower villages claiming hadith learning, quit Malikism for the Shafi'i rite and even held the judgeship of Nablus before the claim emerged {cite:shadharat-dhahab p. 261-262}."
  es: "En 848, el jeque marroquí Muhammad ibn Ahmad al-Faryani se retiró a las escarpadas montañas de Humayda en Tierra Santa —un ascenso en fila india coronado por una meseta fortificada de manantiales y viñedos— y allí se declaró el Mahdi (algunos decían el Qahtani) y su causa prosperó; una vez había frecuentado El Cairo, visitado al-Maqrizi, predicado por las aldeas bajas afirmando conocer hadices, abandonado el malikismo por el rito shafi'i e incluso ocupó el cargo de juez de Nablus antes de que surgiera la afirmación {cite:shadharat-dhahab p. 261-262}."
  fr: "En 848, le cheikh marocain Muhammad ibn Ahmad al-Faryani se retira dans les montagnes escarpées de l'Humayda en Terre Sainte — une ascension en file indienne couronnée par un plateau fortifié de sources et de vignes — et là il se déclara le Mahdi (certains disaient le Qahtani) et sa cause prospéra; il avait autrefois hanté le Caire, fréquenté al-Maqrizi, prêché à travers les villages inférieurs en prétendant connaître les hadiths, quitté le malikisme pour le rite shafi'ite et même occupé la fonction de juge de Naplouse avant que cette revendication n'émerge {cite:shadharat-dhahab p. 261-262}."
  ur: "848 میں مراکشی شیخ محمد بن احمد الفریانی مقدس سرزمین کے سراسر ہمیدہ پہاڑوں کی طرف واپس چلے گئے - ایک واحد فائل چڑھائی جس کا تاج چشموں اور انگوروں کے ایک مضبوط سطح مرتفع سے تھا - اور وہاں خود کو مہدی قرار دیا ⁦(کچھ کہتے ہیں کہ قحطانی)⁩ اور اس کی وجہ پروان چڑھی۔ اس نے ایک بار قاہرہ کا شکار کیا تھا، اکثر المقریزی آیا تھا، نچلے دیہاتوں میں حدیث سیکھنے کا دعویٰ کیا تھا، شافعی رسم کے لیے ملکیت کو چھوڑ دیا تھا اور دعویٰ کے سامنے آنے سے پہلے نابلس کے قاضی کا عہدہ بھی سنبھالا تھا۔ 261-262}۔"
  tr: "Hicri 848 yılında Şeyh Şemseddin Muhammed ibn Ahmed el-Faryani el-Mağribi, Kutsal Topraklar'daki Hamida Dağları'na gitti. Bunlar, tırmanması zor, tek bir kişinin bile geçebileceği bir yolun olmadığı, yükselen dağlardır. Dağlardan birinin tepesinde, ekili arazilerin, su kaynaklarının, bağların ve büyük güç ve kudret sahibi insanların bulunduğu bir ova vardır. Sultan ve altındakiler onlarla savaşsa bile, onlara sığınan herkes güvendedir. El-Faryani onlarla kaldı ve kendisinin Mehdi olduğunu iddia etti. Kendisinin el-Kahtani olduğunu iddia ettiği ve bu olayının orada popülerlik kazandığı söylenir. Kahire'ye gelmiş ve sık sık el-Makrizi'yi ziyaret etmiş, düzenli olarak Golan Tepeleri'nin alt kesimlerindeki köyleri gezmiş, randevular ayarlamış ve insanlara hatırlatmalarda bulunmuştur. Birçok geçmiş tarihi ve haberi hatırlatır, Peygamber hadislerini ve ravilerini bildiğini iddia ederdi. Maliki mezhebinden ayrılıp Şafiî mezhebine mensup olduğunu iddia etti. Nablus kadısı olarak atandı, ta ki gerçek yüzü ortaya çıkana kadar. {Kaynak: Şadharat-Dhaba, s. 261-262}"
  id: "Pada tahun 848 H, Syekh Shams al-Din Muhammad ibn Ahmad al-Faryani al-Maghribi pergi ke Pegunungan Hamida di Tanah Suci. Ini adalah pegunungan yang menjulang tinggi, sulit didaki, tanpa jalan yang dapat dilalui lebih dari satu orang. Di puncak salah satu pegunungan terdapat dataran dengan lahan pertanian, mata air, kebun anggur, dan orang-orang yang sangat kuat dan berkuasa. Siapa pun yang berlindung di sana akan aman, bahkan jika Sultan dan orang-orang di bawahnya berperang melawan mereka. Al-Faryani tinggal di sana dan mengaku sebagai Mahdi. Dikatakan bahwa ia mengaku sebagai al-Qahtani, dan kisahnya menjadi populer di sana. Ia datang ke Kairo dan sering mengunjungi al-Maqrizi serta secara teratur berkeliling Dataran Tinggi Golan di desa-desa di dataran rendah, membuat janji temu dan mengingatkan orang-orang. Ia sering mengingat banyak sejarah dan berita masa lalu dan mengaku mengetahui hadits Nabi dan para perawinya. Ia beralih dari mazhab Maliki dan mengaku mengikuti mazhab Syafi'i. Dia diangkat menjadi hakim Nablus sampai apa yang menjadi jelas darinya menjadi jelas {cite:shadharat-dhahab p. 261-262}."
