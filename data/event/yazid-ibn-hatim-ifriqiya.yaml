label: { ar: "مسير يزيد بن حاتم إلى إفريقية وقتله أبا خاتم", en: "Yazid ibn Hatim's March to Ifriqiya and His Killing of Abu Khatim" }
summary:
  ar: "عند البلاذري: ولّي بعد هزارمرد يزيد بن حاتم بن قبيصة بن المهلب فخرج في خمسين ألفاً وشيّعه أبو جعفر المنصور إلى بيت المقدس وأنفق عليه مالاً عظيماً فسار يزيد حتى لقي أبا حاتم باطر إبليس فقتله ودخل إفريقية فاستقامت له ثم ولّي بعده روح بن حاتم ثم الفضل بن روح فوثب الجند عليه فذبحوه."
  en: "In al-Baladhuri: after Hazarmard, Yazid ibn Hatim ibn Qubaysa ibn al-Muhallab governed — he went out in fifty thousand, Abu Ja'far al-Mansur escorting him to Bayt al-Maqdis and spending great wealth on him; Yazid marched until he met Abu Khatim at Batr Iblis, killed him, and entered Ifriqiya which settled for him; then Rawh ibn Hatim ruled, then al-Fadl ibn Rawh — the army rose on him and slaughtered him."
