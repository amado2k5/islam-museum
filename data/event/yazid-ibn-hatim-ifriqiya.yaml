id: event/yazid-ibn-hatim-ifriqiya
class: event
kind: campaign
label: { ar: "مسير يزيد بن حاتم إلى إفريقية وقتله أبا خاتم", en: "Yazid ibn Hatim's March to Ifriqiya and His Killing of Abu Khatim", es: "La marcha de Yazid ibn Hatim hacia Ifriqiya y su asesinato de Abu Khatim", fr: "La marche de Yazid ibn Hatim vers l'Ifriqiya et le meurtre d'Abu Khatim", ur: "یزید بن حاتم کا افریقیہ تک مارچ اور ابو خاتم کا قتل" }
summary:
  ar: "عند البلاذري: ولّي بعد هزارمرد يزيد بن حاتم بن قبيصة بن المهلب فخرج في خمسين ألفاً وشيّعه أبو جعفر المنصور إلى بيت المقدس وأنفق عليه مالاً عظيماً فسار يزيد حتى لقي أبا حاتم باطر إبليس فقتله ودخل إفريقية فاستقامت له ثم ولّي بعده روح بن حاتم ثم الفضل بن روح فوثب الجند عليه فذبحوه."
  en: "In al-Baladhuri: after Hazarmard, Yazid ibn Hatim ibn Qubaysa ibn al-Muhallab governed — he went out in fifty thousand, Abu Ja'far al-Mansur escorting him to Bayt al-Maqdis and spending great wealth on him; Yazid marched until he met Abu Khatim at Batr Iblis, killed him, and entered Ifriqiya which settled for him; then Rawh ibn Hatim ruled, then al-Fadl ibn Rawh — the army rose on him and slaughtered him."
  es: "En al-Baladhuri: después de Hazarmard, gobernó Yazid ibn Hatim ibn Qubaysa ibn al-Muhallab; salió con cincuenta mil hombres, Abu Ja'far al-Mansur lo escoltó hasta Bayt al-Maqdis y gastó una gran riqueza en él; Yazid marchó hasta que se encontró con Abu Khatim en Batr Iblis, lo mató y entró en Ifriqiya, que se estableció a su favor; luego gobernó Rawh ibn Hatim, luego al-Fadl ibn Rawh; el ejército se levantó contra él y lo masacró."
  fr: "Dans al-Baladhuri: après Hazarmard, Yazid ibn Hatim ibn Qubaysa ibn al-Muhallab gouverna — il partit avec cinquante mille hommes, escorté par Abu Ja'far al-Mansur jusqu'à Bayt al-Maqdis, pour lequel il dépensa une grande fortune; Yazid marcha jusqu'à rencontrer Abu Khatim à Batr Iblis, le tua et entra à Ifriqiya qui s'installa pour lui; puis Rawh ibn Hatim gouverna, puis al-Fadl ibn Rawh — l'armée se souleva contre lui et le massacra."
  ur: "البلادوری میں ہے: حجرمرد کے بعد یزید بن حاتم بن قبیصہ ابن المحلب نے حکومت کی - وہ پچاس ہزار میں نکلا، ابو جعفر المنصور اسے لے کر بیت المقدس پہنچا اور اس پر بہت زیادہ مال خرچ کیا۔ یزید نے کوچ کیا یہاں تک کہ اس نے بتر ابلیس میں ابو خاتم سے ملاقات کی، اسے قتل کر دیا، اور عفریقیہ میں داخل ہوا جو اس کے لیے آباد تھا۔ پھر راح بن حاتم نے حکومت کی، پھر الفضل بن روا نے اس پر لشکر چڑھا کر اسے ذبح کر دیا۔"
