label: { ar: "بناء مدينة الحدث", en: "The Building of Madinat al-Hadath" }
summary:
  ar: "عند البلاذري: الحدث مما فتح أيام عمر فتحه حبيب بن مسلمة من قبل إياد بن غنم وكان معاوية يتعهده بعد ذلك، وكان بنو أمية يسمون درب الحدث السلامة للطيرة لأن المسلمين كانوا أصيبوا به — فكان ذلك الحدث فيما يقول بعض الناس — وقال قوم لقي المسلمين غلام حدث على الدرب فقاتلهم مع أصحابه فقيل درب الحدث؛ ولما كان زمن فتنة مروان بن محمد خرجت الروم فهدمت مدينة الحدث وأجلت عنها أهلها كما فعلت بملطية؛ ثم لما كانت سنة 161 خرج ميخائيل إلى عمق مرعش ووجّه المهدي الحسن بن قحطبة ساح في بلاد الروم فارتاد موضع مدينته هناك ولما انصرف كلّم المهدي في بنائها وبناء طرسوس فأمر بتقديم بناء الحدث — وكان في غزاة الحسن هذه مندل العنزي الحدث الكوفي ومعتير بن سليمان البصري — فأنشأها علي بن سليمان بن علي وهو على الجزيرة وقنسرين وسُمّيت المحمدية وتوفي المهدي مع فراغهم من بنائها فهي المهدية والحمدية، وكان بناؤها بلبن وكانت وفاته سنة 169 واستخلف موسى الهادي ابنه فعزل علي بن سليمان وولّى الجزيرة وقنسرين محمد بن إبراهيم بن محمد بن علي وقد كان علي بن سليمان فرغ من بناء مدينة الحدث، وفرض محمد لها فرضاً من أهل الشام والجزيرة وخراسان في أربعين ديناراً من العطاء وأقطعهم المساكن وأعطى كل امرئ ثلاثمائة درهم، وكان الفراغ منها في سنة 169 — وقال أبو الخطاب فرض علي بن سليمان بمدينة الحدث لأربعة آلاف فأسكنهم إياها ونقل إليها من ملطية وشمشاط وسميساط وكيسوم ودلوك ورعبان ألفي رجل؛ ولما بنيت هجم الشتاء والثلوج وكثرت الأمطار ولم يكن بناؤها بمستوثق منه فتشلّمت المدينة وتشعثت ونزل بها الروم فتفرّق عنها من كان فيها من جندها وبلغ الخبر موسى فقطع بعثاً مع المسيب بن زهير وبعثاً مع روح بن حاتم وبعثاً مع حمزة بن مالك فمات قبل أن ينفذوا ثم ولي الرشيد الخلافة فأمر ببنائها وتحصينها وشحنها وإقطاع مقاتلتها المساكن والقطائع؛ وقال غير الواقدي: أناخ بطريق من عظماء بطارقة الروم في جمع كثيف على مدينة الحدث حين بنيت وكان بناؤها بلبن قد حُمل بعضه على بعض فأضرت به الثلوج وهرب عاملها ومن فيها ودخلها العدو فحرّق مسجدها وأخربها واحتمل أمتعة أهلها فبناها الرشيد حين استخلف."
  en: "In al-Baladhuri: al-Hadath was among the conquests of Umar's days, taken by Habib ibn Maslama at Iyad ibn Ghanm's direction, and Mu'awiya kept it up thereafter; Banu Umayya called the Darb al-Hadath 'al-Salama' out of omen, for the Muslims had been smitten there — that calamity being 'the event' as some say — while others say a Byzantine youth (ghulam hadath) fought them on the pass so it was named Darb al-Hadath; in Marwan ibn Muhammad's civil war the Romans demolished Madinat al-Hadath and evacuated its people as they had Malatya; then in year 161 Michael came out to Amq Mar'ash, and al-Mahdi sent al-Hasan ibn Qahtaba ranging Byzantine lands — in this expedition were Mandal al-Anzi the Kufan and Mu'tayyir ibn Sulayman al-Basri — who chose his city-site there, and on return spoke to al-Mahdi of building it and Tarsus; al-Mahdi ordered al-Hadath built first, and Ali ibn Sulayman ibn Ali founded it while over the Jazira and Qinnasrin — it was named al-Muhammadiyya — and al-Mahdi died just as they finished, so it is called al-Mahdiyya and al-Hamadiyya; it was built of mud brick, his death falling in year 169, when his son Musa al-Hadi succeeded, removed Ali ibn Sulayman and gave the Jazira and Qinnasrin to Muhammad ibn Ibrahim ibn Muhammad ibn Ali; Ali had finished the city, and Muhammad levied for it a contingent of Syrians, Jazirans and Khurasanis at forty dinars' pay, granted them house-lots and gave each man three hundred dirhams — completed in year 169; Abu al-Khattab says Ali ibn Sulayman levied four thousand for the city, settled them in it and transferred two thousand men from Malatya, Shimshat, Sumaysat, Kaysum, Duluk and Ra'ban; when built, winter struck with snows and heavy rain — its building not sound — and the city collapsed in ruin, the Romans occupied it and its garrison scattered; word reached Musa, who dispatched columns with al-Musayyab ibn Zuhayr, Rawh ibn Hatim and Hamza ibn Malik, but died before they could march; al-Rashid then ordered it rebuilt, fortified, garrisoned and its fighters granted houses and estates — another than al-Waqidi says a patrikios grandee camped on the city with a dense host just as it was built, the stacked mud brick ruined by snow, its governor and people fleeing while the enemy burned its mosque, wrecked it and carried off the people's goods — al-Rashid rebuilt it at his accession."
