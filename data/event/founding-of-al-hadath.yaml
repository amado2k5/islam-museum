id: event/founding-of-al-hadath
class: event
kind: founding
label: { ar: "بناء مدينة الحدث", en: "The Building of Madinat al-Hadath", es: "El edificio de Madinat al-Hadath", fr: "Le bâtiment de Madinat al-Hadath", ur: "مدینۃ الحدیث کی عمارت" }
summary:
  ar: "عند البلاذري: الحدث مما فتح أيام عمر فتحه حبيب بن مسلمة من قبل إياد بن غنم وكان معاوية يتعهده بعد ذلك، وكان بنو أمية يسمون درب الحدث السلامة للطيرة لأن المسلمين كانوا أصيبوا به — فكان ذلك الحدث فيما يقول بعض الناس — وقال قوم لقي المسلمين غلام حدث على الدرب فقاتلهم مع أصحابه فقيل درب الحدث؛ ولما كان زمن فتنة مروان بن محمد خرجت الروم فهدمت مدينة الحدث وأجلت عنها أهلها كما فعلت بملطية؛ ثم لما كانت سنة 161 خرج ميخائيل إلى عمق مرعش ووجّه المهدي الحسن بن قحطبة ساح في بلاد الروم فارتاد موضع مدينته هناك ولما انصرف كلّم المهدي في بنائها وبناء طرسوس فأمر بتقديم بناء الحدث — وكان في غزاة الحسن هذه مندل العنزي الحدث الكوفي ومعتير بن سليمان البصري — فأنشأها علي بن سليمان بن علي وهو على الجزيرة وقنسرين وسُمّيت المحمدية وتوفي المهدي مع فراغهم من بنائها فهي المهدية والحمدية، وكان بناؤها بلبن وكانت وفاته سنة 169 واستخلف موسى الهادي ابنه فعزل علي بن سليمان وولّى الجزيرة وقنسرين محمد بن إبراهيم بن محمد بن علي وقد كان علي بن سليمان فرغ من بناء مدينة الحدث، وفرض محمد لها فرضاً من أهل الشام والجزيرة وخراسان في أربعين ديناراً من العطاء وأقطعهم المساكن وأعطى كل امرئ ثلاثمائة درهم، وكان الفراغ منها في سنة 169 — وقال أبو الخطاب فرض علي بن سليمان بمدينة الحدث لأربعة آلاف فأسكنهم إياها ونقل إليها من ملطية وشمشاط وسميساط وكيسوم ودلوك ورعبان ألفي رجل؛ ولما بنيت هجم الشتاء والثلوج وكثرت الأمطار ولم يكن بناؤها بمستوثق منه فتشلّمت المدينة وتشعثت ونزل بها الروم فتفرّق عنها من كان فيها من جندها وبلغ الخبر موسى فقطع بعثاً مع المسيب بن زهير وبعثاً مع روح بن حاتم وبعثاً مع حمزة بن مالك فمات قبل أن ينفذوا ثم ولي الرشيد الخلافة فأمر ببنائها وتحصينها وشحنها وإقطاع مقاتلتها المساكن والقطائع؛ وقال غير الواقدي: أناخ بطريق من عظماء بطارقة الروم في جمع كثيف على مدينة الحدث حين بنيت وكان بناؤها بلبن قد حُمل بعضه على بعض فأضرت به الثلوج وهرب عاملها ومن فيها ودخلها العدو فحرّق مسجدها وأخربها واحتمل أمتعة أهلها فبناها الرشيد حين استخلف."
  en: "In al-Baladhuri: al-Hadath was among the conquests of Umar's days, taken by Habib ibn Maslama at Iyad ibn Ghanm's direction, and Mu'awiya kept it up thereafter; Banu Umayya called the Darb al-Hadath 'al-Salama' out of omen, for the Muslims had been smitten there — that calamity being 'the event' as some say — while others say a Byzantine youth (ghulam hadath) fought them on the pass so it was named Darb al-Hadath; in Marwan ibn Muhammad's civil war the Romans demolished Madinat al-Hadath and evacuated its people as they had Malatya; then in year 161 Michael came out to Amq Mar'ash, and al-Mahdi sent al-Hasan ibn Qahtaba ranging Byzantine lands — in this expedition were Mandal al-Anzi the Kufan and Mu'tayyir ibn Sulayman al-Basri — who chose his city-site there, and on return spoke to al-Mahdi of building it and Tarsus; al-Mahdi ordered al-Hadath built first, and Ali ibn Sulayman ibn Ali founded it while over the Jazira and Qinnasrin — it was named al-Muhammadiyya — and al-Mahdi died just as they finished, so it is called al-Mahdiyya and al-Hamadiyya; it was built of mud brick, his death falling in year 169, when his son Musa al-Hadi succeeded, removed Ali ibn Sulayman and gave the Jazira and Qinnasrin to Muhammad ibn Ibrahim ibn Muhammad ibn Ali; Ali had finished the city, and Muhammad levied for it a contingent of Syrians, Jazirans and Khurasanis at forty dinars' pay, granted them house-lots and gave each man three hundred dirhams — completed in year 169; Abu al-Khattab says Ali ibn Sulayman levied four thousand for the city, settled them in it and transferred two thousand men from Malatya, Shimshat, Sumaysat, Kaysum, Duluk and Ra'ban; when built, winter struck with snows and heavy rain — its building not sound — and the city collapsed in ruin, the Romans occupied it and its garrison scattered; word reached Musa, who dispatched columns with al-Musayyab ibn Zuhayr, Rawh ibn Hatim and Hamza ibn Malik, but died before they could march; al-Rashid then ordered it rebuilt, fortified, garrisoned and its fighters granted houses and estates — another than al-Waqidi says a patrikios grandee camped on the city with a dense host just as it was built, the stacked mud brick ruined by snow, its governor and people fleeing while the enemy burned its mosque, wrecked it and carried off the people's goods — al-Rashid rebuilt it at his accession."
  es: "En al-Baladhuri: al-Hadath fue una de las conquistas de los días de Umar, tomada por Habib ibn Maslama bajo la dirección de Iyad ibn Ghanm, y Mu'awiya la mantuvo después; Banu Umayya llamó a Darb al-Hadath 'al-Salama' por presagio, porque los musulmanes habían sido golpeados allí —esa calamidad es 'el evento' como dicen algunos— mientras que otros dicen que un joven bizantino (ghulam hadath) luchó contra ellos en el paso por lo que se llamó Darb al-Hadath; en la guerra civil de Marwan ibn Muhammad los romanos demolieron Madinat al-Hadath y evacuaron a su gente como habían hecho con Malatya; Luego, en el año 161, Miguel salió a Amq Mar'ash, y al-Mahdi envió a al-Hasan ibn Qahtaba a recorrer las tierras bizantinas —en esta expedición estaban Mandal al-Anzi el Kufan y Mu'tayyir ibn Sulayman al-Basri— quien eligió allí el emplazamiento de su ciudad, y a su regreso habló con al-Mahdi sobre la construcción de esta y Tarso; al-Mahdi ordenó que se construyera primero al-Hadath, y Ali ibn Sulayman ibn Ali la fundó mientras estaba sobre Jazira y Qinnasrin —se llamó al-Muhammadiyya— y al-Mahdi murió justo cuando terminaron, por lo que se llama al-Mahdiyya y al-Hamadiyya; fue construida con ladrillos de barro, su muerte ocurrió en el año 169, cuando su hijo Musa al-Hadi lo sucedió, destituyó a Ali ibn Sulayman y dio Jazira y Qinnasrin a Muhammad ibn Ibrahim ibn Muhammad ibn Ali; Ali había terminado la ciudad, y Muhammad reclutó para ella un contingente de sirios, jaziranos y jorasaníes con un pago de cuarenta dinares, les otorgó lotes para casas y dio a cada hombre trescientos dirhams, completada en el año 169; Abu al-Khattab dice que Ali ibn Sulayman reclutó cuatro mil para la ciudad, los estableció en ella y transfirió dos mil hombres de Malatya, Shimshat, Sumaysat, Kaysum, Duluk y Ra'ban; cuando se construyó, el invierno azotó con nieves y fuertes lluvias —su construcción no era sólida— y la ciudad se derrumbó en ruinas, los romanos la ocuparon y su guarnición se dispersó; la noticia llegó a Musa, quien envió columnas con al-Musayyab ibn Zuhayr, Rawh ibn Hatim y Hamza ibn Malik, pero murió antes de que pudieran marchar; Al-Rashid ordenó entonces que la reconstruyeran, la fortificaran, la guarneceran y que sus combatientes recibieran casas y propiedades; otra versión, según Al-Waqidi, es que un gran patricio acampó en la ciudad con un numeroso ejército justo cuando se estaba construyendo, con los ladrillos de barro apilados arruinados por la nieve, su gobernador y su gente huyendo mientras el enemigo quemaba su mezquita, la destrozaba y se llevaba los bienes de la gente. Al-Rashid la reconstruyó al ascender al trono."
  fr: "Dans al-Baladhuri: al-Hadath figurait parmi les conquêtes de l'époque d'Umar, prise par Habib ibn Maslama sur ordre d'Iyad ibn Ghanm, et Mu'awiya la conserva par la suite; les Banu Umayya appelèrent le Darb al-Hadath « al-Salama » par présage, car les musulmans y avaient été frappés — cette calamité étant « l'événement » comme certains le disent — tandis que d'autres disent qu'un jeune Byzantin (ghulam hadath) les combattit au col, d'où le nom de Darb al-Hadath; lors de la guerre civile de Marwan ibn Muhammad, les Romains détruisirent Madinat al-Hadath et évacuèrent ses habitants comme ils l'avaient fait pour Malatya; En l'an 161, Michel se rendit à Amq Mar'ash, et al-Mahdi envoya al-Hasan ibn Qahtaba explorer les terres byzantines. Parmi les membres de cette expédition figuraient Mandal al-Anzi de Kufan et Mu'tayyir ibn Sulayman al-Basri. Ce dernier choisit l'emplacement de sa ville et, à son retour, s'entretint avec al-Mahdi de la construction de celle-ci et de Tarse. al-Mahdi ordonna la construction d'al-Hadath en premier, et Ali ibn Sulayman ibn Ali la fonda tout en contrôlant la Jazira et le Qinnasrin. La ville fut nommée al-Muhammadiyya. al-Mahdi mourut juste après la fin des travaux, d'où les noms d'al-Mahdiyya et d'al-Hamadiyya. Elle fut construite en briques de terre crue. Sa mort survint en l'an 169, et son fils Musa al-Hadi lui succéda, destitua Ali ibn Sulayman et confia la Jazira et le Qinnasrin à Muhammad ibn Ibrahim ibn Muhammad ibn Ali. Ali avait achevé la ville, et Muhammad leva pour elle un contingent de Syriens, de Jazirans et de Khorasaniens avec une solde de quarante dinars, leur accorda des parcelles de terrain et donna à chaque homme trois cents dirhams — la construction fut achevée en l'an 169; Abu al-Khattab dit qu'Ali ibn Sulayman leva quatre mille hommes pour la ville, les y installa et y transféra deux mille hommes de Malatya, Shimshat, Sumaysat, Kaysum, Duluk et Ra'ban; une fois construite, l'hiver frappa avec des neiges et des pluies torrentielles — sa construction n'étant pas solide — et la ville s'effondra en ruines, les Romains l'occupèrent et sa garnison se dispersa; la nouvelle parvint à Musa, qui dépêcha des colonnes avec al-Musayyab ibn Zuhayr, Rawh ibn Hatim et Hamza ibn Malik, mais mourut avant qu'ils ne puissent marcher; Al-Rashid ordonna alors sa reconstruction, sa fortification, son garnison et accorda des maisons et des domaines à ses combattants. — Un autre que al-Waqidi raconte qu'un grand chef patrikios campa dans la ville avec une armée dense juste au moment de sa construction, les briques de terre crue empilées ruinées par la neige, son gouverneur et ses habitants fuyant tandis que l'ennemi incendiait sa mosquée, la saccageait et emportait les biens du peuple. — Al-Rashid la reconstruisit à son accession au pouvoir."
  ur: "البلادوری میں ہے: الحدیث عمر کے دنوں کی فتوحات میں سے ایک تھی، جسے حبیب ابن مسلمہ نے عیاض بن غنم کی ہدایت پر حاصل کیا، اور معاویہ نے اس کے بعد اسے برقرار رکھا؛ بنو امیہ نے شرح الحدیث کو 'السلامہ' کہا، کیونکہ وہاں مسلمانوں کو شکست ہوئی تھی - یہ آفت 'واقعہ' تھی جیسا کہ بعض کہتے ہیں - جب کہ بعض کہتے ہیں کہ ایک بازنطینی نوجوان ⁦(غلام حدث)⁩ نے ان سے درے پر مقابلہ کیا تو اس کا نام شرح الحدث رکھا گیا۔ مروان بن محمد کی خانہ جنگی میں رومیوں نے مدینۃ الحدث کو منہدم کر دیا اور اس کے لوگوں کو وہاں سے نکال دیا جیسا کہ ان کے پاس ملاتیا تھا۔ پھر سنہ 161 میں میکائیل امق مرعش کی طرف نکلا، اور المہدی نے حسن بن قحطبہ کو بازنطینی سرزمینوں پر بھیجا - اس مہم میں منڈل العنزی کوفان اور مطییر بن سلیمان البصری تھے - جنہوں نے وہاں اپنے شہر کا انتخاب کیا، اور واپسی پر اس کی تعمیر کے بارے میں المہدی سے بات کی۔ المہدی نے الحدیث کو سب سے پہلے تعمیر کرنے کا حکم دیا، اور علی بن سلیمان ابن علی نے جزیرہ اور کنسرین پر رہتے ہوئے اس کی بنیاد رکھی - اس کا نام محمدیہ رکھا گیا - اور المہدی اسی طرح فوت ہوگئے جیسے وہ ختم ہوئے، اس لیے اسے المہدیہ اور الحمدیہ کہا جاتا ہے۔ یہ مٹی کی اینٹوں سے بنایا گیا تھا، اس کی موت سنہ 169 میں ہوئی، جب اس کے بیٹے موسیٰ الہدی نے جانشینی اختیار کی، علی بن سلیمان کو ہٹا کر جزیرہ اور کنسرین محمد بن ابراہیم ابن محمد ابن علی کو دے دیے۔ علی نے شہر کو ختم کر دیا تھا، اور محمد نے اس کے لیے شامیوں، جزیریوں اور خراسانیوں کا ایک دستہ چالیس دینار کی تنخواہ پر لگایا، انہیں مکانات دیے اور ہر ایک کو تین سو درہم دیے جو کہ 169 میں مکمل ہوا۔ ابو الخطاب کہتے ہیں کہ علی بن سلیمان نے شہر کے لیے چار ہزار مقرر کیے، ان کو اس میں بسایا اور دو ہزار آدمیوں کو ملاتیا، شمشات، سمیسات، کیسم، دولک اور ربان سے منتقل کیا۔ جب تعمیر کیا گیا تو موسم سرما میں برفباری اور شدید بارش ہوئی - اس کی عمارت آواز نہیں دے رہی تھی - اور شہر تباہ ہو گیا، رومیوں نے اس پر قبضہ کر لیا اور اس کی چوکی بکھر گئی۔ یہ بات موسیٰ تک پہنچی، جس نے المصیب ابن زہیر، راح ابن حاتم اور حمزہ بن مالک کے ساتھ کالم بھیجے، لیکن ان کے مارچ کرنے سے پہلے ہی انتقال کر گئے۔ الرشید نے پھر اسے دوبارہ تعمیر کرنے، قلعہ بندی کرنے، چوکیداری کرنے کا حکم دیا اور اس کے جنگجوؤں کو مکانات اور جائدادیں عطا کیں - ایک اور الواقدی کا کہنا ہے کہ ایک پیٹریکیوس گرانڈی نے شہر پر ایک گھنے میزبان کے ساتھ ڈیرہ ڈالا جس طرح اسے بنایا گیا تھا، مٹی کی اینٹوں کے ڈھیر برف سے تباہ ہو گئے، اس کے گورنر اور لوگوں کو مسجد کو جلانے کے دوران اس کے گورنر اور لوگوں کو لے جا رہے تھے۔ لوگوں کا سامان - الرشید نے اپنے الحاق پر اسے دوبارہ تعمیر کیا۔"
