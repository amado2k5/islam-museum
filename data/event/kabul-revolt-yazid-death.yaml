label: { ar: "نكث أهل كابل ومقتل يزيد بن زياد", en: "Kabul's Breach and Yazid ibn Ziyad's Death", es: "La brecha en Kabul y la muerte de Yazid ibn Ziyad", fr: "La brèche de Kaboul et la mort de Yazid ibn Ziyad", ur: "کابل کی خلاف ورزی اور یزید ابن زیاد کی موت", tr: "Kabil halkı yeminlerini bozdu ve Yezid ibn Ziyad öldürüldü.", id: "Penduduk Kabul melanggar sumpah mereka dan Yazid ibn Ziyad terbunuh." }
summary:
  ar: "نكث أهل كابل وأسروا أبا عبيدة بن زياد فسار إليهم يزيد بن زياد فقاتلهم وهم بجنزة فقتل يزيد بن زياد وكثير ممن كان معه وانهزم سائر الناس وكان فيمن استشهد زيد بن عبد الله بن أبي مليكة بن عبد الله بن جدعان القرشي وصلة بن أشيم أبو الصهباء العدوي زوج معاذة العدوية فبعث سلم بن زياد طلحة بن عبد الله بن خلف الخزاعي الذي يعرف بطلحة الطلحات ففدى أبا عبيدة بخمسمائة ألف درهم وسار طلحة من كابل إلى سجستان والياً عليها من قبل سلم فجبى وأعطى زواره ومات بسجستان واستخلف رجلاً من بني يشكر فأخرجته المضرية ووقعت العصبية وغلب كل قوم على مدينتهم فطمع فيهم رتبيل."
  en: "Kabul's folk broke and captured Abu Ubayda ibn Ziyad; Yazid ibn Ziyad marched on them at Junza and fell with many of his men — among the slain Zayd ibn Abdallah ibn Abi Mulayka al-Qurashi and Sila ibn Ashyam Abu al-Sahba' al-Adawi, husband of Mu'adha al-Adawiyya. Salm ibn Ziyad sent Talha ibn Abdallah ibn Khalaf al-Khuza'i — Talhat al-Talhat — who ransomed Abu Ubayda for five hundred thousand dirhams, then governed Sijistan for Salm, levying and rewarding his followers until he died there; a Yashkuri deputy was expelled by the Mudaris, factionalism broke out, each tribe seized its own town — and Rutbil took hope."
  es: "La gente de Kabul se rebeló y capturó a Abu Ubayda ibn Ziyad; Yazid ibn Ziyad marchó contra ellos en Junza y cayó con muchos de sus hombres, entre los que murieron Zayd ibn Abdallah ibn Abi Mulayka al-Qurashi y Sila ibn Ashyam Abu al-Sahba' al-Adawi, esposo de Mu'adha al-Adawiyya. Salm ibn Ziyad envió a Talha ibn Abdallah ibn Khalaf al-Khuza'i — Talhat al-Talhat — quien rescató a Abu Ubayda por quinientos mil dirhams, y luego gobernó Sijistan para Salm, recaudando impuestos y recompensando a sus seguidores hasta su muerte allí; un lugarteniente yashkuri fue expulsado por los mudaris, estalló el faccionalismo, cada tribu se apoderó de su propia ciudad, y Rutbil recuperó la esperanza."
  fr: "Les habitants de Kaboul se débandèrent et capturèrent Abou Ubayda ibn Ziyad; Yazid ibn Ziyad marcha sur eux à Junza et périt avec nombre de ses hommes, parmi lesquels Zayd ibn Abdallah ibn Abi Mulayka al-Qurashi et Sila ibn Ashyam Abou al-Sahba' al-Adawi, époux de Mu'adha al-Adawiyya. Salm ibn Ziyad envoya Talha ibn Abdallah ibn Khalaf al-Khuza'i – Talhat al-Talhat – qui racheta Abou Ubayda pour cinq cent mille dirhams, puis gouverna le Sijistan pour Salm, levant des impôts et récompensant ses partisans jusqu'à sa mort. Un député yashkuri fut expulsé par les Mudaris, des luttes intestines éclatèrent, chaque tribu s'empara de sa propre ville – et Rutbil reprit espoir."
  ur: "کابل کے لوگوں نے ابو عبیدہ ابن زیاد کو توڑا اور پکڑ لیا۔ یزید ابن زیاد نے جنزہ کے مقام پر ان پر چڑھائی کی اور اپنے بہت سے آدمیوں کے ساتھ گر پڑے - مقتول زید ابن عبداللہ ابن ابی ملیکہ القرشی اور معاذ العدویہ کے شوہر سیلا بن اشیم ابو الصہبہ العدوی کے ساتھ۔ سالم ابن زیاد نے طلحہ بن عبداللہ ابن خلف الخزاعی - طلحۃ الطلحۃ - کو بھیجا جس نے ابو عبیدہ کو پانچ لاکھ درہم کے عوض فدیہ دیا، پھر سلم کے بدلے سجستان پر حکومت کی، اپنے پیروکاروں کو ٹیکس لگاتے اور انعام دیتے رہے یہاں تک کہ وہ وہاں مر گیا۔ ایک یشکوری نائب کو مداریوں نے بے دخل کر دیا، دھڑے بندی پھوٹ پڑی، ہر قبیلے نے اپنے اپنے شہر پر قبضہ کر لیا — اور رتبل نے امید باندھ لی۔"
  tr: "Kabil halkı ahitlerini bozarak Ebu Ubeyde bin Ziyad'ı esir aldı. Yezid bin Ziyad onlara doğru yürüdü ve onlar Cenaze'de iken onlarla savaştı. Yezid bin Ziyad ve yanındakilerin çoğu öldürüldü ve halkın geri kalanı da yenilgiye uğradı. Şehitler arasında Zeyd bin Abdullah bin Ebu Malikah bin Abdullah bin Cedan el-Kureşi ve Mu'adha el-Adaviyye'nin kocası Sila bin Aşim Ebu el-Sahba el-Adavi de vardı. Salim bin Ziyad, Talha el-Talhat olarak bilinen Talha bin Abdullah bin Halef el-Huzai'yi gönderdi ve o da Ebu Ubeyde'yi beş yüz bin dirhem karşılığında fidye olarak kurtardı. Talha, Salim adına Kabil'den Sijistan'a vali olarak gitti. Vergileri topladı, ziyaretçilerine verdi ve Sijistan'da öldü. Banu Yashkur kabilesinden bir adamı geride bıraktı, ancak Mudhar kabilesi onu kovdu ve kabilecilik baş gösterdi; her grup kendi şehrinin kontrolünü ele geçirdi, bu yüzden Rutayl onları ele geçirmek istedi."
  id: "Penduduk Kabul melanggar perjanjian mereka dan menangkap Abu Ubaidah bin Ziyad. Yazid bin Ziyad bergerak menuju mereka dan memerangi mereka saat mereka berada di Janzah. Yazid bin Ziyad dan banyak orang yang bersamanya terbunuh, dan sisanya dikalahkan. Di antara mereka yang gugur sebagai syuhada adalah Zaid bin Abdullah bin Abi Malikah bin Abdullah bin Jad’an al-Qurashi dan Sila bin Ashim Abu al-Sahba’ al-Adawi, suami dari Mu’adhah al-Adawiyyah. Salim bin Ziyad mengutus Talhah bin Abdullah bin Khalaf al-Khuza’i, yang dikenal sebagai Talhah al-Talhat, dan ia menebus Abu Ubaidah dengan lima ratus ribu dirham. Talhah pergi dari Kabul ke Sijistan sebagai gubernur atas nama Salim. Ia memungut pajak dan memberi kepada para tamunya dan meninggal di Sijistan. Dia meninggalkan seorang pria dari suku Banu Yashkur, tetapi suku Mudhar mengusirnya, dan terjadilah tribalisme, dan setiap kelompok merebut kendali atas kota mereka, sehingga Rutayl menginginkan mereka."
