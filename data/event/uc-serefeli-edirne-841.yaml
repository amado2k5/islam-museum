label: { ar: "بناء جامع الشرفات الثلاث بأدرنة", en: "Edirne's Üç Şerefeli Mosque is built", ur: "ادرنہ کی اوچ شرفلی مسجد کی تعمیر", es: "Se construye la mezquita Üç Şerefeli de Edirne", fr: "La mosquée Üç Şerefeli d'Edirne est construite", tr: "Edirne'deki Üç Balkonlu Camii'nin İnşaatı", id: "Pembangunan Masjid Tiga Balkon di Edirne" }
summary:
  ar: "بنى مراد الثاني جامع الشرفات الثلاث بأدرنة بين سنتي ٨٤١هـ/١٤٣٧-١٤٣٨م و٨٥١هـ/١٤٤٧-١٤٤٨م، وهو أكبر بناء شُيّد في الدولة العثمانية قبل فتح القسطنطينية؛ فناؤه الرخامي أول فناء جامع عثماني، ومئذنته ذات الشرفات الثلاث أول مئذنة عثمانية من هذا النوع {cite:encyclopaedia-of-islam-2 vol. 2 p. 712} {cite:freely-ottoman-architecture-2011 p. 68}."
  en: "Murad II built Edirne's Üç Şerefeli Mosque between 841/1437-8 and 851/1447-8, the largest edifice erected in the Ottoman Empire before the conquest of Constantinople; its marble-paved courtyard is counted the first Ottoman mosque courtyard, and its three-balconied minaret the first Ottoman minaret of its kind {cite:encyclopaedia-of-islam-2 vol. 2 p. 712} {cite:freely-ottoman-architecture-2011 p. 68}."
  ur: "مراد ثانی نے 841ھ/1437-38ء سے 851ھ/1447-48ء تک ادرنہ میں اوچ شرفلی مسجد بنوائی، جو فتح قسطنطنیہ سے پہلے عثمانی سلطنت کی سب سے بڑی عمارت تھی؛ اس کا سنگِ مرمر کا صحن پہلا عثمانی مسجد صحن شمار ہوتا ہے اور تین بالکنیوں والا مینار اپنی نوع کا پہلا عثمانی مینار ہے {cite:encyclopaedia-of-islam-2 vol. 2 p. 712} {cite:freely-ottoman-architecture-2011 p. 68}۔"
  es: "Murad II construyó la Mezquita Üç Şerefeli de Edirne entre 841/1437-8 y 851/1447-8, el edificio más grande erigido en el Imperio Otomano antes de la conquista de Constantinopla; su patio pavimentado con mármol se considera el primer patio de mezquita otomano, y su minarete de tres balcones el primer minarete otomano de su tipo {cite:encyclopaedia-of-islam-2 vol. 2 p. 712} {cite:freely-ottoman-architecture-2011 p. 68}."
  fr: "Murad II fit construire la mosquée Üç Şerefeli d'Edirne entre 841/1437-8 et 851/1447-8, le plus grand édifice érigé dans l'Empire ottoman avant la conquête de Constantinople; sa cour pavée de marbre est considérée comme la première cour de mosquée ottomane, et son minaret à trois balcons comme le premier minaret ottoman de ce type {cite:encyclopaedia-of-islam-2 vol. 2 p. 712} {cite:freely-ottoman-architecture-2011 p. 68}."
  tr: "Murad II, Edirne'deki Üç Balkonlu Camii'ni Hicri 841/1437-1438 ile Hicri 851/1447-1448 yılları arasında inşa ettirmiştir. Bu cami, İstanbul'un fethinden önce Osmanlı İmparatorluğu'nda inşa edilen en büyük yapıdır. Mermer avlusu, ilk Osmanlı cami avlusudur ve üç balkonlu minaresi de bu tipteki ilk Osmanlı minaresidir. {cite:encyclopaedia-of-islam-2 vol. 2 p. 712} {cite:freely-ottoman-architecture-2011 p. 68}."
  id: "Murad II membangun Masjid Tiga Balkon di Edirne antara tahun 841 H/1437-1438 M dan 851 H/1447-1448 M. Ini adalah bangunan terbesar yang dibangun di Kekaisaran Ottoman sebelum penaklukan Konstantinopel. Halaman marmernya adalah halaman masjid Ottoman pertama, dan menaranya dengan tiga balkon adalah menara Ottoman pertama dari jenis ini. {cite:encyclopaedia-of-islam-2 vol. 2 p. 712} {cite:freely-ottoman-architecture-2011 p. 68}."
