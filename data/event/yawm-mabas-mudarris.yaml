label: { ar: "يوم معبس ومضرس — هزيمة الأوس عند الجدارين", en: "the day of Maʿbas and Muḍarris — the Aws driven into their strongholds", es: "el día de Maʿbas y Muḍarris: los Aws fueron expulsados a sus fortalezas.", fr: "le jour de Maʿbas et Muḍarris — les Aws repoussés dans leurs forteresses", ur: "مباس اور معرّس کا دن - اوس اپنے قلعوں میں چلے گئے۔", tr: "Kasvetli ve karanlık bir gün — Aws'ların iki surda yenilgisi.", id: "Hari yang suram dan kelam — kekalahan Aws di dua tembok." }
date:
  start: { edtf: "0610~", calendar: julian, precision: century, status: tradition, derived: true, note: "جاهلي؛ التاريخ تقريبي عند أهل الأيام {cite:kamil-ibn-al-athir p. 507}." }
summary:
  ar: "يوم من أيام الأوس والخزرج قبل البعاث، التقوا عند معبس ومضرس وهما جداران فكانت الخزرج وراء مضرس والأوس وراء معبس، فأقاموا أيامًا يقتتلون قتالًا شديدًا ثم انهزمت الأوس حتى دخلت البيوت والآطام وكانت هزيمة قبيحة لم ينهزموا مثلها {cite:kamil-ibn-al-athir p. 507}."
  en: "One of the last Aws–Khazraj days before Buʿāth: they met at the two walls Maʿbas and Muḍarris and fought on for days until the Aws broke into houses and strongholds — an ugly rout they had never suffered the like of {cite:kamil-ibn-al-athir p. 507}."
  es: "Uno de los últimos días de Aws-Khazraj antes de Buʿāth: se encontraron en las dos murallas Maʿbas y Muḍarris y lucharon durante días hasta que los Aws irrumpieron en casas y fortalezas, una fea derrota como nunca antes habían sufrido {cite:kamil-ibn-al-athir p. 507}."
  fr: "L'un des derniers jours des Aws-Khazraj avant Buʿāth: ils se rencontrèrent aux deux murs Maʿbas et Muḍarris et se battirent pendant des jours jusqu'à ce que les Aws pénètrent dans les maisons et les forteresses — une terrible déroute qu'ils n'avaient jamais subie comme celle de {cite:kamil-ibn-al-athir p. 507}."
  ur: "بوعث سے پہلے کے آخری اوس – خزرج میں سے ایک دن: وہ دو دیواروں مباس اور معرص پر ملے اور کئی دن تک لڑتے رہے یہاں تک کہ اوس گھروں اور مضبوط قلعوں میں گھس گئے - ایک ایسا بدصورت راستہ جس کا سامنا انہوں نے کبھی نہیں کیا تھا۔ 507}۔"
  tr: "Bir gün, Evs ve Hazrec kabileleri, iki sur olan Ma'bas ve Mudarris'te karşılaştılar. Hazrec kabilesi Mudarris'in arkasında, Evs kabilesi ise Ma'bas'ın arkasındaydı. Günlerce şiddetli bir şekilde savaştılar, ardından Evs kabilesi evlere ve kalelere girene kadar yenilgiye uğradı. Bu, daha önce hiç yaşamadıkları kadar korkunç bir yenilgiydi. {cite:kamil-ibn-al-athir s. 507}"
  id: "Suatu hari, suku Aws dan Khazraj bertemu di Ma'bas dan Mudarris, yang merupakan dua tembok. Suku Khazraj berada di belakang Mudarris dan suku Aws berada di belakang Ma'bas. Mereka bertempur sengit selama berhari-hari, kemudian suku Aws dikalahkan hingga mereka memasuki rumah-rumah dan benteng-benteng. Itu adalah kekalahan yang mengerikan, yang belum pernah mereka alami sebelumnya. {cite:kamil-ibn-al-athir p. 507}"
