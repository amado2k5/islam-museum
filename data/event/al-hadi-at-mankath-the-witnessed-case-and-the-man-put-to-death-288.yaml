id: event/al-hadi-at-mankath-the-witnessed-case-and-the-man-put-to-death-288
class: event
label:
  ar: "الهادي بمنكث: رجل يشهد عليه ويُقتل وآخر يُحبس، ربيع الأول 288هـ"
  en: "Al-Hadi at Mankath: a man testified against is put to death and another is jailed, Rabi I 288 AH"
  ur: "ہادی منکث میں: ایک شخص پر گواہی کے بعد قتل اور دوسرے کی قید، ربیع الاول 288ھ"
summary:
  ar: "ينزل الهادي منكث فيبلغه بعد يومين أن بعض الفساق ظهروا بالأخطوط وأظهروا شراباً وفساداً، فيرسل جماعة فلا يجدون إلا اثنين، ويشهد جماعة عند الهادي على أحدهما بفسق جنسي، فيأمر بضرب عنقه وصلبه، ولا تصح على الآخر شهادة فيأمر بحبسه، ويعلق رجل من أهل منكث على ذلك، ويقيم الهادي بمنكث أياماً."
  en: "Al-Hadi halts at Mankath and two days later is told that some of the corrupt have appeared at al-Akhtut with drink and disorder; he sends a party, who find only two; a group testify before him against one of them to sexual misconduct, and al-Hadi orders his neck struck and the body hung up, while the testimony against the other is not established and he is sent to prison; a man of Mankath comments on it, and al-Hadi stays some days at Mankath."
  ur: "ہادی منکث اترتے ہیں اور دو دن بعد انہیں بتایا جاتا ہے کہ کچھ بدکار الاخطوط میں شراب اور فساد کے ساتھ ظاہر ہوئے ہیں؛ وہ ایک جماعت بھیجتے ہیں جسے صرف دو آدمی ملتے ہیں؛ ایک جماعت ان میں سے ایک کے خلاف جنسی بدکاری کی گواہی دیتی ہے اور ہادی اس کی گردن مارنے اور لاش لٹکانے کا حکم دیتے ہیں، جبکہ دوسرے کے خلاف گواہی ثابت نہیں ہوتی اور وہ قید میں بھیجا جاتا ہے؛ منکث کا ایک آدمی اس پر تبصرہ کرتا ہے، اور ہادی منکث میں چند دن رہتے ہیں۔"
