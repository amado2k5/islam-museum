id: event/bab-tibn-desecration-443
class: event
kind: persecution
label:
  ar: "نبش مشهد باب التبن ووقعة باب السماكين"
  en: "The Bab al-Tibn shrine exhumed and the Sammakin gate battle"
  fr: "Le sanctuaire de Bab al-Tibn profané et la bataille de la porte des Sammakin"
  es: "La exhumación del santuario de Bab al-Tibn y la batalla de la puerta de Sammakin"
  ur: "باب الطبن کا مزار نکالا گیا اور سماکن دروازے کی جنگ"
summary:
  ar: "في صفر سنة ثلاث وأربعين وأربعمائة تجددت الفتنة بين السنة والشيعة حين فرغ أهل الكرخ من بناء باب السماكين وكتبوا عليه «وعلى خير البشر»، فأنكر أهل السنة وطالبوا بإسقاط «حي على خير العمل»، وقطع أهل باب الشعير الماء عن الكرخ حتى بيعت الراوية بقيراط، وعُدل بماء الودود يُخلط ويُصاح «السبيل». ثم جمع الطقطقي العيار من أهل درزيجان وكبس بهم طاق الحراني من معاقل الكرخ فقتل رجلين وقطع رأسيهما ونصبهما على حائط المسجد المستجد، وهجم أهل القلائين على باب السماكين فأحرقوا البوارى المسبلة، وتقاتل الفريقان وكثر القتل، وصلب الطقطقي رجلين على الباب بعد أن قتل ثلاثة ورمى رؤوسهم إلى أهل الكرخ وقال «تغدوا برؤوسكم». واستُنفر البلد وقُبض مشهد باب التبن فنُهب ما فيه وأُخرجت جماعة من القبور فأُحرقت — مثل العوفي والناشئ والجذوعي — ونُقل موتى فدُفنوا في مقابر شتى، وطُرحت النار في الترب القديمة والحديثة واحترق الضريحان وقبتا الساج، وحُفر أحد الضريحين ليُنقل صاحبه إلى قبر أحمد فمنع النقيب والناس، وكبس أهل الكرخ خان الفقهاء الحنفية بقطيعة الربيع فنهبوه وأحرقوه. وفي يوم الجمعة لعشر بقين من ربيع الآخر خُطب في جامع براثا وأُسقط «حي على خير العمل» وذُكر العباس في الخطبة {cite:muntazam-ibn-al-jawzi j.8 p.491-493}."
  en: "In Safar 443 the Sunni–Shi'i war resumed over the 'wa-Ali khayr al-bashar' inscription on the new Sammakin gate; water was cut to Karkh until a waterskin sold for a qirat, and rosewater was mixed into public troughs. The Darzijani 'ayyar al-Tuqtuqi stormed the Taq al-Hurrani stronghold, beheaded two men and raised the heads on the new mosque's wall, then crucified two more on the gate after killing three, hurling their heads into Karkh with 'have your heads for breakfast'. The city rose: the Bab al-Tibn shrine was seized and looted, corpses — the 'Awfi, al-Nashi' and al-Judhu'i among them — were dragged out and burned or reburied elsewhere, the teak domes torched, the Hanafi jurists' khan in Qati'at al-Rabi' sacked, and at last Baratha's khutba returned with 'hayya ala khayr al-amal' dropped and al-Abbas named {cite:muntazam-ibn-al-jawzi j.8 p.491-493}."
  fr: "En Safar 443, la guerre entre sunnites et chiites reprit au sujet de l'inscription « wa-Ali khayr al-bashar » sur la nouvelle porte des Sammakin ; l'eau fut coupée à Karkh jusqu'à ce qu'une outre se vende un qirat, et de l'eau de rose fut mêlée aux abreuvoirs publics. L'ayyar al-Tuqtuqi, de Darzijan, prit d'assaut le bastion de Taq al-Hurrani, décapita deux hommes et dressa leurs têtes sur le mur de la nouvelle mosquée, puis, après en avoir tué trois, en crucifia deux autres sur la porte, lançant leurs têtes dans Karkh en criant « déjeunez de vos têtes ». La ville se souleva : le sanctuaire de Bab al-Tibn fut pris et pillé, des cadavres, dont ceux d'al-'Awfi, d'al-Nashi' et d'al-Judhu'i, furent exhumés et brûlés ou réinhumés ailleurs, les coupoles de teck incendiées, le khan des juristes hanafites de Qati'at al-Rabi' saccagé, et enfin la khutba de Baratha fut rétablie, sans « hayya ala khayr al-amal » et avec la mention d'al-Abbas {cite:muntazam-ibn-al-jawzi j.8 p.491-493}."
  es: "En Safar 443, la guerra suní-chií se reanudó por la inscripción \"wa-Ali khayr al-bashar\" en la nueva puerta de Sammakin; se cortó el suministro de agua a Karkh hasta que un odre se vendió por un qirat, y se mezcló agua de rosas en los abrevaderos públicos. El 'ayyar al-Tuqtuqi darzijaní asaltó la fortaleza de Taq al-Hurrani, decapitó a dos hombres y colocó sus cabezas en el muro de la nueva mezquita, luego crucificó a dos más en la puerta después de matar a tres, arrojando sus cabezas a Karkh con la frase \"desayunad vuestras cabezas\". La ciudad se alzó: el santuario de Bab al-Tibn fue tomado y saqueado, los cadáveres —entre ellos los de los 'Awfi, al-Nashi' y al-Judhu'i— fueron sacados y quemados o enterrados de nuevo en otro lugar, las cúpulas de teca incendiadas, el khan de los juristas hanafíes en Qati'at al-Rabi' saqueado, y finalmente la jutba de Baratha regresó con 'hayya ala khayr al-amal' descartada y al-Abbas nombrado {cite:muntazam-ibn-al-jawzi j.8 p.491-493}."
  ur: "صفر 443 میں نئے سماکن دروازے پر 'و علی خیر البشر' تحریر پر سنی-شیعہ جنگ دوبارہ شروع ہوئی۔ کرخ میں پانی کاٹ دیا جاتا تھا یہاں تک کہ ایک قیراط میں پانی کی کھال فروخت ہوتی تھی اور عرق گلاب کو عوامی گرتوں میں ملایا جاتا تھا۔ درزیجانی 'عیار التقوی' نے طاق الحرانی کے گڑھ پر دھاوا بول دیا، دو افراد کے سر قلم کیے اور نئی مسجد کی دیوار پر سر اٹھائے، پھر تین کو قتل کرنے کے بعد مزید دو کو دروازے پر سولی پر چڑھا دیا، 'اپنے سر ناشتہ کر لو' کے ساتھ کرخ میں سر پھینکے۔ شہر بلند ہوا: باب الطبن کے مزار پر قبضہ کر لیا گیا اور لوٹ لیا گیا، لاشیں — عوفی، النشی اور الجودی — کو باہر گھسیٹ کر جلا دیا گیا یا کسی اور جگہ دفن کیا گیا، ساگوان کے گنبدوں کو نذر آتش کیا گیا، حنفی فقہاء کے خان قطعۃ الرابعۃ میں آخری بار واپس آئے۔ 'حیا الا خیر العمل' کے ساتھ گرا دیا اور العباس کا نام {حوالہ:منتظم ابن الجوزی ج8 ص 491-493}۔"
