label: { ar: "إسكان أهل بخارى البصرة", en: "The Bukharans' Settlement at Basra", fr: "L'installation des Boukhariotes à Bassora", es: "El asentamiento de los bujaras en Basora", ur: "بصرہ میں بخاریوں کی بستی" }
summary:
  ar: "كان عبيد الله بن زياد سبى خلقاً من أهل بخارا ويقال بل نزلوا على حكمه ويقال بل دعاهم إلى الأمان والفريضة فنزلوا على ذلك ورغبوا فيه فأسكنهم البصرة فلما بنى الحجاج مدينة واسط نقل كثيراً منهم إليها فمن نسلهم بها اليوم قوم منهم خالد الشاطر المعروف بابن مارقلي."
  en: "Ubaydallah ibn Ziyad captive-took a body of Bukhara's people — or, as told, they came down on his aman and obligation, eager for it — and settled them at Basra; when al-Hajjaj built Wasit he moved many there, their descendants including Khalid al-Shatir, called Ibn Marquli."
  fr: "Ubaydallah ibn Ziyad fit captifs un groupe des gens de Boukhara (ou, selon un autre récit, ils se rendirent sous son aman et son engagement, désireux de cela) et les installa à Bassora ; quand al-Hajjaj bâtit Wasit, il en transféra beaucoup là-bas, leurs descendants comptant Khalid al-Shatir, appelé Ibn Marquli."
  es: "Ubaydallah ibn Ziyad capturó a un grupo de personas de Bujará —o, según se cuenta, ellos acudieron a él con agrado y ansias de obtenerlo— y los estableció en Basora; cuando al-Hajjaj construyó Wasit, trasladó allí a muchos, entre ellos sus descendientes, como Khalid al-Shatir, llamado Ibn Marquli."
  ur: "عبیداللہ ابن زیاد نے بخارا کے لوگوں کی ایک لاش کو اسیر کر لیا - یا جیسا کہ بتایا گیا ہے کہ وہ اس کی امانت اور ذمہ داری پر اتر آئے، اس کے شوقین تھے - اور انہیں بصرہ میں آباد کیا۔ جب الحجاج نے وصیت کو تعمیر کیا تو اس نے بہت سے لوگوں کو وہاں منتقل کیا، ان کی اولاد میں خالد الشاطر، ابن مرقولی کہلاتا ہے۔"
