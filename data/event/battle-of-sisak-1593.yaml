summary:
  ar: "بطاقة أولية لمعركة سيساك سنة ١٥٩٣م، الهزيمة العثمانية الكبرى أمام جيوش الاتحاد الكرواتي التي فتحت الحرب الطويلة؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Sisak in 1593, the great Ottoman defeat by the Croatian forces that opened the Long War; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Batalla de Sisak en 1593, la gran derrota otomana a manos de las fuerzas croatas que dio inicio a la Guerra Larga; sus fuentes aún no han sido verificadas en la página."
  fr: "Carte de campagne pour la bataille de Sisak en 1593, la grande défaite ottomane face aux forces croates qui a marqué le début de la Longue Guerre; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1593 میں سیساک کی جنگ کے لیے ڈرافٹ کارڈ، کروشین افواج کے ہاتھوں عظیم عثمانی شکست جس نے طویل جنگ کا آغاز کیا۔ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1593 yılında gerçekleşen ve Hırvat Konfederasyonu orduları karşısında Osmanlı İmparatorluğu'nun büyük bir yenilgiye uğradığı, uzun süren savaşın başlangıcını işaret eden Sisak Muharebesi'nin ön açıklaması; sayfadaki kaynaklar henüz incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Sisak pada tahun 1593 M, kekalahan besar Ottoman di tangan pasukan Konfederasi Kroasia yang membuka perang panjang; sumber-sumber di halaman ini belum ditinjau."
