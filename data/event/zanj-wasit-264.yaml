label: { ar: "دخول الزنج واسطًا", en: "The Zanj Enter Wasit", es: "Los Zanj entran en Wasit", fr: "Le Zanj entre Wasit", ur: "زنج داخل وسیت" }
summary:
  ar: "في سنة أربع وستين ومائتين دخل الزنج واسطًا فأخلوا الناس البلد وخرجوا عنه حفاة على وجوههم، وكانوا يدخلون المنازل فيجدونها مفروشة، ومضى الناس وكان يأخذ أحدهم عما ملكه ورداءه فيشد به رجليه ويمشي، وضُربت واسط بالنار {cite:muntazam-ibn-al-jawzi p. 46}."
  en: "In 264 AH the Zanj entered Wasit and emptied it — the people walked out barefoot while the rebels found houses still furnished; the town was struck with fire {cite:muntazam-ibn-al-jawzi p. 46}."
  es: "En el año 264 AH, los Zanj entraron en Wasit y la vaciaron; la gente salió descalza, mientras que los rebeldes encontraron casas aún amuebladas; la ciudad fue arrasada por un incendio {cite:muntazam-ibn-al-jawzi p. 46}."
  fr: "En 264 AH, les Zanj entrèrent dans Wasit et la vidèrent — les habitants sortirent pieds nus tandis que les rebelles trouvèrent des maisons encore meublées; la ville fut frappée par le feu {cite:muntazam-ibn-al-jawzi p. 46}."
  ur: "264 ہجری میں زنج نے وصیت میں داخل ہو کر اسے خالی کر دیا - لوگ ننگے پاؤں باہر نکلے جب کہ باغیوں کو گھر ابھی تک آراستہ تھے۔ قصبہ کو آگ لگ گئی {حوالہ: منتظر بن الجوزی ص۔ 46}۔"
