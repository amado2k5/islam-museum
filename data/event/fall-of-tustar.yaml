id: event/fall-of-tustar
class: event
kind: conquest
label: { ar: "سقوط تستر وأسر هرمزان", en: "Tustar's Fall and Hurmuzan's Capture" }
summary:
  ar: "قتل من أهل تستر في المعركة تسعمائة وأسر ستمائة ضربت أعناقهم بعد ثم استأمن رجل من الأعاجم على أن يدل المسلمين على عورة المشركين فأسلم واشترط أن يفرض له ولولده فعاقده أبو موسى ووجه معه أشرس بن عوف من شيبان فخاض به دجيل على عرق من حجارة ثم علا به المدينة وأراه هرمزان فندب أبو موسى أربعين رجلاً مع مجزأة بن ثور واتبعهم مائتا رجل ليلاً والمستأمن يقدمهم فأدخلهم المدينة فقتلوا الحرس وكبروا على السور فهرب هرمزان إلى قامته موضع خزانته وعبر أبو موسى حين أصبح فاحتوى المدينة وقال هرمزان ما دل العرب على عورتنا إلا بعض ممن رأى إقبال أمرهم وإدبار أمرنا وجعل الرجل من الأعاجم يقتل أهله وولده ويلقيهم في دجيل خوفاً أن يظفر بهم العرب وطلب هرمزان الأمان فأبى أبو موسى أن يعطيه إلا على حكم عمر فنزل على ذلك."
  en: "Nine hundred fell in the battle and six hundred captives were beheaded after; then a Persian sought aman to show the Muslims the breach — converted, stipended for himself and his son — and led Ashras ibn Awf of Shayban across Dujayl on a stone weir, up the city, and pointed out Hurmuzan. Forty volunteers under Majza'a ibn Thawr with two hundred behind entered by night, killed the guard and cried takbir on the wall; Hurmuzan fled to his treasury-citadel, Abu Musa crossed at dawn and possessed the city — 'none taught the Arabs our weakness but one who saw their rising fortune and our waning' — while the defector killed his own family and cast them into Dujayl. Hurmuzan asked aman; Abu Musa gave it only on Umar's judgment, and he came down on that."
