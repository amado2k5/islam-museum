label: { ar: "قتل وصيف التركي", en: "Killing of Wasif al-Turki", es: "Asesinato de Wasif al-Turki", fr: "Assassinat de Wasif al-Turki", ur: "واصف الترکی کا قتل", tr: "Türk ikincilik ödülü sahibi öldürüldü.", id: "Runner-up Turki tewas" }
summary:
  ar: "في سنة ثلاث وخمسين ومائتين قُتل وصيف التركي في شوال، بعد أن شغّبت فئات من الجند طلباً لأرزاقها، ثم جعل المعتز ما كان إلى وصيف من الأمور إلى بغا الشرابي {cite:tabari-tarikh-abu-al-fadl j.9 p.374}. وعند المسعودي أوقع به أهل كرخ سامرا من الفراعنة والأتراك وتخلص بغا منهم، ورتب صالح بن وصيف موضع أبيه {cite:muruj-al-dhahab p. 552}"
  en: "In 253 Wasif al-Turki was killed in Shawwal, after groups of troops caused disorder demanding their pay. Al-Mu'tazz then transferred the affairs that had been in Wasif's hands to Bugha al-Sharabi {cite:tabari-tarikh-abu-al-fadl j.9 p.374}. According to al-Mas'udi, the people of the Karkh quarter of Samarra, of the Faraghina and the Turks, fell upon him, and Bugha got clear of them; Salih ibn Wasif was put in his father's place {cite:muruj-al-dhahab p. 552}."
  es: "En 253, Wasif al-Turki fue asesinado en Shawwal, después de que grupos de soldados provocaran disturbios exigiendo su paga. Al-Mu'tazz transfirió entonces los asuntos que habían estado en manos de Wasif a Bugha al-Sharabi {cite:tabari-tarikh-abu-al-fadl j.9 p.374}. Según al-Mas'udi, la gente del barrio de Karkh de Samarra, de Faraghina y de los turcos, se abalanzó sobre él, y Bugha logró librarse de ellos; Salih ibn Wasif fue puesto en lugar de su padre {cite:muruj-al-dhahab p. 552}."
  fr: "En 253, Wasif al-Turki fut tué à Shawwal, suite à des troubles provoqués par des groupes de soldats réclamant leur solde. Al-Mu'tazz confia alors les affaires de Wasif à Bugha al-Sharabi (voir: Tabari-tarikh-abu-al-fadl j.9 p.374). Selon al-Mas'udi, les habitants du quartier de Karkh à Samarra, les Faraghina et les Turcs, se jetèrent sur lui, mais Bugha parvint à s'en sortir; Salih ibn Wasif fut nommé à la place de son père (voir: Muruj-al-dhahab p. 552)."
  ur: "253 میں واصف الترکی کو شوال میں مارا گیا، جب فوجیوں کے گروہوں نے اپنی تنخواہ کا مطالبہ کرنے پر بدامنی پیدا کی۔ المعتز نے پھر وہ امور جو واصف کے ہاتھ میں تھے بگا الشرابی کو منتقل کر دئیے۔ المسعودی کے مطابق، سامرہ کے کرخ کوارٹر کے لوگ، فراغینہ اور ترکوں کے لوگ اس پر ٹوٹ پڑے، اور بوغہ ان سے پاک ہو گیا۔ صالح بن واصف کو ان کے والد کی جگہ پر رکھا گیا تھا۔ 552}۔"
  tr: "Hicri 253 yılında, Wasif el-Turki, bir grup askerin maaşlarını talep ederek isyan etmesi sonucu Şevval ayında öldürüldü. Bunun üzerine el-Mu'tazz, Wasif'in sorumluluklarını Bugha el-Şerabi'ye devretti. {Kaynak: Tabari-tarikh-ebu-al-fadl cilt 9, s. 374}. El-Mas'udi'ye göre, Firavunlar ve Türkler de dahil olmak üzere Kerkh-Samarra halkı ona saldırdı, ancak Bugha onları püskürttü ve babasının yerine Salih ibn Wasif'i atadı. {Kaynak: Muruj-al-dhahab s. 552}"
  id: "Pada tahun 253 H, Wasif al-Turki terbunuh di bulan Syawal setelah sekelompok tentara memberontak menuntut gaji mereka. Al-Mu'tazz kemudian menyerahkan tanggung jawab Wasif kepada Bugha al-Sharabi. {cite:tabari-tarikh-abu-al-fadl vol.9 p.374}. Menurut al-Mas'udi, penduduk Karkh Samarra, termasuk Firaun dan Turki, menyerangnya, tetapi Bugha berhasil mengalahkan mereka dan menunjuk Salih ibn Wasif untuk menggantikan ayahnya. {cite:muruj-al-dhahab p. 552}"
