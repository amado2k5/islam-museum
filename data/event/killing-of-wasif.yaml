id: event/killing-of-wasif
class: event
kind: death
label: { ar: "قتل وصيف التركي", en: "Killing of Wasif al-Turki" }
summary:
  ar: "في سنة ثلاث وخمسين ومائتين قُتل وصيف التركي في شوال، بعد أن شغّبت فئات من الجند طلباً لأرزاقها، ثم جعل المعتز ما كان إلى وصيف من الأمور إلى بغا الشرابي {cite:tabari-tarikh-abu-al-fadl j.9 p.374}. وعند المسعودي أوقع به أهل كرخ سامرا من الفراعنة والأتراك وتخلص بغا منهم، ورتب صالح بن وصيف موضع أبيه {cite:muruj-al-dhahab p. 552}"
  en: "In 253 Wasif al-Turki was killed in Shawwal, after groups of troops caused disorder demanding their pay. Al-Mu'tazz then transferred the affairs that had been in Wasif's hands to Bugha al-Sharabi {cite:tabari-tarikh-abu-al-fadl j.9 p.374}. According to al-Mas'udi, the people of the Karkh quarter of Samarra, of the Faraghina and the Turks, fell upon him, and Bugha got clear of them; Salih ibn Wasif was put in his father's place {cite:muruj-al-dhahab p. 552}."
