label: { ar: "محمود الغزنوي يأخذ البيروني إلى غزنة", en: "Maḥmūd takes al-Bīrūnī to Ghazna" }
summary:
  ar: "اتخذ السلطان محمود بن سبكتكين غزنة عاصمة سنة 998م وطلب البيروني وابن سينا إلى بلاطه؛ أفلت ابن سينا وأقام البيروني بغزنة بقية عمره إلا ما كان يرافق فيه حملات محمود على شمال الهند {cite:britannica-al-biruni}."
  en: "Sultan Maḥmūd made Ghazna his capital in 998 and summoned al-Bīrūnī and Avicenna to his court; Avicenna escaped, but al-Bīrūnī lived at Ghazna the rest of his life apart from Maḥmūd's campaigns into northern India {cite:britannica-al-biruni}."
  ur: "سلطان محمود سبکتگین نے 998ء میں غزنہ کو دارالحکومت بنایا اور بیرونی و ابن سینا کو دربار طلب کیا؛ ابن سینا بچ نکلا مگر بیرونی محمود کی شمالی ہند مہمات کے سوا عمر بھر غزنہ رہا {cite:britannica-al-biruni}."
