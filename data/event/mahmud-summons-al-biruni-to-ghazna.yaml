id: event/mahmud-summons-al-biruni-to-ghazna
class: event
kind: other
label: { ar: "محمود الغزنوي يأخذ البيروني إلى غزنة", en: "Maḥmūd takes al-Bīrūnī to Ghazna", es: "Maḥmūd lleva a al-Bīrūnī a Ghazna.", fr: "Maḥmūd emmène al-Bīrūnī à Ghazna", ur: "محمود البیرونی کو غزنہ لے گیا۔" }
summary:
  ar: "اتخذ السلطان محمود بن سبكتكين غزنة عاصمة سنة 998م وطلب البيروني وابن سينا إلى بلاطه؛ أفلت ابن سينا وأقام البيروني بغزنة بقية عمره إلا ما كان يرافق فيه حملات محمود على شمال الهند {cite:britannica-al-biruni}."
  en: "Sultan Maḥmūd made Ghazna his capital in 998 and summoned al-Bīrūnī and Avicenna to his court; Avicenna escaped, but al-Bīrūnī lived at Ghazna the rest of his life apart from Maḥmūd's campaigns into northern India {cite:britannica-al-biruni}."
  ur: "سلطان محمود سبکتگین نے 998ء میں غزنہ کو دارالحکومت بنایا اور بیرونی و ابن سینا کو دربار طلب کیا؛ ابن سینا بچ نکلا مگر بیرونی محمود کی شمالی ہند مہمات کے سوا عمر بھر غزنہ رہا {cite:britannica-al-biruni}."
  es: "El sultán Mahmud convirtió a Ghazna en su capital en 998 y convocó a al-Biruní y a Avicena a su corte; Avicena escapó, pero al-Biruní vivió en Ghazna el resto de su vida, salvo durante las campañas de Mahmud en el norte de la India {cite:britannica-al-biruni}."
  fr: "Le sultan Maḥmūd fit de Ghazna sa capitale en 998 et convoqua al-Bīrūnī et Avicenne à sa cour; Avicenne s'échappa, mais al-Bīrūnī vécut à Ghazna le reste de sa vie, hormis les campagnes de Maḥmūd dans le nord de l'Inde {cite:britannica-al-biruni}."
