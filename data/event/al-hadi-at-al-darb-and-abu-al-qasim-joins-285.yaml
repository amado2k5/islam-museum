id: event/al-hadi-at-al-darb-and-abu-al-qasim-joins-285
class: event
kind: other
label:
  ar: الهادي في الدرب ولحاق ابنه أبي القاسم به وسير الجيش إلى أثافت، 13 شوال 285هـ
  en: Al-Hadi at al-Darb, the arrival of his son Abu al-Qasim and the march on Athafit, 13 Shawwal 285 AH
  ur: ہادی الدرب میں، بیٹے ابو القاسم کی آمد اور اثافت کی طرف کوچ، 13 شوال 285ھ
  es: "Al-Hadi en al-Darb, la llegada de su hijo Abu al-Qasim y la marcha hacia Athafit, 13 de Shawwal de 285 AH."
  fr: "Al-Hadi à al-Darb, l'arrivée de son fils Abu al-Qasim et la marche sur Athafit, le 13 Shawwal 285 AH"
  tr: "El-Hadi yoldaydı ve oğlu Ebu el-Kâsım da ona katıldı ve ordu Hicri 285 yılının Şevval 13'ünde Athafat'a doğru ilerledi."
  id: "Al-Hadi sedang dalam perjalanan, dan putranya Abu al-Qasim bergabung dengannya, dan pasukan tersebut berbaris menuju Athafat, 13 Syawal 285 H."
summary:
  ar: ينتقل الهادي من كراوي إلى «الدرب» لبني ربيعة وهو موضع حصين، فيقيم أياماً حتى استراحت خيله، ثم يوجه صراخاً في حاشد فيجتمع إليه الناس يوم الخميس لثلاث عشرة من شوال، ويصل ابنه أبو القاسم في جماعة من خولان، ويروي راوٍ كان معه سبب خروجه من خيوان، ثم يسير الجيش يوم الخميس ويبيت عند بركة لبني صريم ويرتحل يوم الجمعة نحو أثافت.
  en: Al-Hadi moves from Karawi to al-Darb of Banu Rabi'a, a strong position, where he stays days until his horses are rested; he then sends criers into Hashid and the people gather on Thursday the thirteenth of Shawwal; his son Abu al-Qasim arrives with a group of Khawlan, and a narrator who was with him tells why he left Khiwan; the army marches on Thursday, spends the night at a pond of Banu Sarim and moves on Friday towards Athafit.
  ur: ہادی کراوی سے بنو ربیعہ کے «الدرب» نامی مضبوط مقام پر منتقل ہوتے ہیں اور کئی دن ٹھہرتے ہیں یہاں تک کہ گھوڑے آرام پا لیتے ہیں؛ پھر حاشد میں منادی بھیجتے ہیں اور لوگ شوال کی تیرہ تاریخ جمعرات کو جمع ہوتے ہیں؛ ان کا بیٹا ابو القاسم خولان کی ایک جماعت کے ساتھ پہنچتا ہے اور ان کے ساتھ رہنے والا ایک راوی خیوان سے نکلنے کا سبب بتاتا ہے؛ لشکر جمعرات کو چلتا ہے، بنو صریم کے حوض پر رات گزارتا ہے اور جمعہ کو اثافت کی طرف روانہ ہوتا ہے۔
  es: "Al-Hadi se traslada de Karawi a al-Darb de Banu Rabi'a, una posición fuerte, donde permanece varios días hasta que sus caballos descansan; luego envía pregoneros a Hashid y la gente se reúne el jueves trece de Shawwal; su hijo Abu al-Qasim llega con un grupo de Khawlan, y un narrador que estaba con él cuenta por qué dejó Khiwan; el ejército marcha el jueves, pasa la noche en un estanque de Banu Sarim y se dirige el viernes hacia Athafit."
  fr: "Al-Hadi se déplace de Karawi à al-Darb des Banu Rabi'a, une position forte, où il séjourne plusieurs jours jusqu'à ce que ses chevaux soient reposés; il envoie ensuite des crieurs à Hashid et le peuple se rassemble le jeudi treize Shawwal; son fils Abu al-Qasim arrive avec un groupe de Khawlan, et un narrateur qui était avec lui raconte pourquoi il a quitté Khiwan; l'armée marche le jeudi, passe la nuit à un étang des Banu Sarim et se dirige le vendredi vers Athafit."
  tr: "El-Hadi, Karavi'den Beni Rabi'ah'ın müstahkem bir yeri olan \"El-Darb\"a gider ve atları dinlenene kadar günlerce orada kalır. Sonra Haşid'e bir çağrı gönderir ve insanlar Şevval ayının on üçüncü günü olan Perşembe günü onun yanına toplanırlar. Oğlu Ebu el-Kâsim, Havlan'dan bir grupla gelir ve onunla birlikte olan bir rivayetçi, Hayvan'dan ayrılışının sebebini anlatır. Ardından ordu Perşembe günü yürüyüşe geçer ve Beni Sarim'e ait bir gölette geceyi geçirir ve Cuma günü Athaft'a doğru yola çıkar."
  id: "Al-Hadi bergerak dari Karawi ke “Al-Darb” milik Bani Rabi’ah, yang merupakan tempat berbenteng, dan tinggal selama beberapa hari hingga kuda-kudanya beristirahat. Kemudian ia menyerukan seruan kepada Hashid, dan orang-orang berkumpul kepadanya pada hari Kamis, tanggal 13 Syawal. Putranya, Abu Al-Qasim, tiba bersama sekelompok orang dari Khawlan, dan seorang perawi yang bersamanya menceritakan alasan kepergiannya dari Khawlan. Kemudian pasukan berbaris pada hari Kamis dan bermalam di sebuah kolam milik Bani Sarim, dan berangkat pada hari Jumat menuju Athaft."
