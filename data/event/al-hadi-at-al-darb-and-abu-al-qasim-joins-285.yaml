id: event/al-hadi-at-al-darb-and-abu-al-qasim-joins-285
class: event
kind: other
label:
  ar: الهادي في الدرب ولحاق ابنه أبي القاسم به وسير الجيش إلى أثافت، 13 شوال 285هـ
  en: Al-Hadi at al-Darb, the arrival of his son Abu al-Qasim and the march on Athafit, 13 Shawwal 285 AH
  ur: ہادی الدرب میں، بیٹے ابو القاسم کی آمد اور اثافت کی طرف کوچ، 13 شوال 285ھ
summary:
  ar: ينتقل الهادي من كراوي إلى «الدرب» لبني ربيعة وهو موضع حصين، فيقيم أياماً حتى استراحت خيله، ثم يوجه صراخاً في حاشد فيجتمع إليه الناس يوم الخميس لثلاث عشرة من شوال، ويصل ابنه أبو القاسم في جماعة من خولان، ويروي راوٍ كان معه سبب خروجه من خيوان، ثم يسير الجيش يوم الخميس ويبيت عند بركة لبني صريم ويرتحل يوم الجمعة نحو أثافت.
  en: Al-Hadi moves from Karawi to al-Darb of Banu Rabi'a, a strong position, where he stays days until his horses are rested; he then sends criers into Hashid and the people gather on Thursday the thirteenth of Shawwal; his son Abu al-Qasim arrives with a group of Khawlan, and a narrator who was with him tells why he left Khiwan; the army marches on Thursday, spends the night at a pond of Banu Sarim and moves on Friday towards Athafit.
  ur: ہادی کراوی سے بنو ربیعہ کے «الدرب» نامی مضبوط مقام پر منتقل ہوتے ہیں اور کئی دن ٹھہرتے ہیں یہاں تک کہ گھوڑے آرام پا لیتے ہیں؛ پھر حاشد میں منادی بھیجتے ہیں اور لوگ شوال کی تیرہ تاریخ جمعرات کو جمع ہوتے ہیں؛ ان کا بیٹا ابو القاسم خولان کی ایک جماعت کے ساتھ پہنچتا ہے اور ان کے ساتھ رہنے والا ایک راوی خیوان سے نکلنے کا سبب بتاتا ہے؛ لشکر جمعرات کو چلتا ہے، بنو صریم کے حوض پر رات گزارتا ہے اور جمعہ کو اثافت کی طرف روانہ ہوتا ہے۔
