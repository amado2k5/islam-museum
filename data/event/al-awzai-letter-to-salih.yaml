label: { ar: "رسالة الأوزاعي إلى صالح بن علي", en: "al-Awza'i's Letter to Salih ibn Ali", fr: "Lettre d’al-Awza'i à Salih ibn Ali", es: "Carta de al-Awza'i a Salih ibn Ali", ur: "صالح بن علی کے نام الاوزاعی کا خط", tr: "El-Evza'i'nin Salih ibn Ali'ye mektubu", id: "Surat Al-Awza'i kepada Salih bin Ali" }
summary:
  ar: "عند البلاذري عن أبي عبيد القاسم بن سلام عن أحمد بن كثير: خرج بجبل لبنان قوم شكوا عامل خراج بعلبك فأخرجهم ونزل بهم ما عضّهم فاشتكوا به وبلغ صالح بن علي بن عبد الله بن العباس الخبر عنهم وأن الروم مالؤهم فأمدّهم بمن قتل مقاتلهم وأقرّ من بقي منهم على دينهم وردّهم إلى قراهم وأجلى قوماً من أهل لبنان، فكتب إليه الأوزاعي رسالة طويلة — حفظ القاسم بن سلام منها — قال فيها: «قد كان من إجلاء أهل الذمة من جبل لبنان ممن لم يكن مالأ من خرج على خروجه ممن قتلت بعضهم ورددت باقيهم إلى قراهم ما قد علمت، فكيف تؤخذ عامّة بذنوب خاصّة حتى يُخرجوا من ديارهم وأموالهم، وحكم الله تعالى «لا تزر وازرة وزر أخرى» وهو أحق ما وُقف عنده واقتُدي به، وأحق الوصايا أن تُحفظ وترعى وصية رسول الله فإنه قال: من ظلم معاهداً وكلّفه فوق طاقته فأنا حجيجه»، ثم ذكر كلاماً."
  en: "In al-Baladhuri through Abu Ubayd al-Qasim ibn Sallam from Ahmad ibn Kathir: a body rose in Mount Lebanon complaining of the kharaj administrator of Ba'labakk, and when word reached Salih ibn Ali ibn Abdullah ibn al-Abbas that the Byzantines had abetted them he sent troops who killed their fighters, kept the rest on their religion, returned them to their villages and exiled a company of Lebanon's people; al-Awza'i wrote him a long letter — al-Qasim ibn Sallam memorised from it — saying: 'among those you exiled of the dhimmis of Mount Lebanon were men who had not abetted the rising of those you killed, while you returned the rest to their villages, as you know — so how are the many taken for the sins of the few, expelled from their homes and wealth, when God's ruling is «no bearer of burdens bears another's burden», the worthiest thing to be held to and followed, and the worthiest testament kept is the Messenger's, who said: whoever wrongs a covenant-holder and lays on him beyond his capacity, I am his adversary', and more."
  fr: "Al-Baladhuri rapporte d’Abu Ubayd al-Qasim ibn Sallam, d’après Ahmad ibn Kathir, qu’un groupe du mont Liban se souleva pour se plaindre du collecteur de l’impôt foncier de Baalbek, qui les avait chassés et leur avait fait subir de graves difficultés. Apprenant leur soutien par les Byzantins, Salih ibn Ali ibn Abdullah ibn al-Abbas envoya des troupes qui tuèrent leurs combattants, laissèrent les survivants dans leur religion et les ramenèrent dans leurs villages, mais expulsèrent un groupe des habitants du Liban. Al-Awza'i lui écrivit une longue lettre dont al-Qasim ibn Sallam avait retenu une partie : certains expulsés n’avaient pas soutenu les insurgés, et il contestait que tous soient chassés de leurs maisons et de leurs biens pour les fautes de quelques-uns. Il invoquait le principe coranique de responsabilité individuelle et la recommandation du Messager, qui se déclarait l’adversaire de quiconque opprimait un bénéficiaire de pacte ou le chargeait au-delà de ses forces, puis poursuivait son propos."
  es: "En al-Baladhuri, a través de Abu Ubayd al-Qasim ibn Sallam, de Ahmad ibn Kathir: un grupo se levantó en el Monte Líbano quejándose del administrador del kharaj de Ba'labakk, y cuando llegó a oídos de Salih ibn Ali ibn Abdullah ibn al-Abbas la noticia de que los bizantinos los habían apoyado, envió tropas que mataron a sus combatientes, mantuvieron al resto en su religión, los devolvieron a sus aldeas y exiliaron a una compañía de gente del Líbano; Al-Awza'i le escribió una larga carta —de la cual Al-Qasim ibn Sallam memorizó— diciendo: «Entre los dhimmis del Monte Líbano a los que exiliasteis había hombres que no habían instigado la rebelión de los que matasteis, mientras que al resto los devolvisteis a sus aldeas, como bien sabéis. Entonces, ¿cómo es posible que muchos paguen por los pecados de unos pocos, siendo expulsados de sus hogares y riquezas, cuando la ley de Dios es “nadie carga con la carga de otro”, lo más digno de aferrarse y seguir, y el testamento más digno de guardar es el del Mensajero, que dijo: quienquiera que perjudique a un pactador y le imponga una carga mayor de la que puede soportar, yo soy su adversario», y más."
  ur: "البلادوری میں ابو عبید القاسم بن سلام کے ذریعے احمد بن کثیر سے مروی ہے: لبنان کے پہاڑ پر ایک لاش اٹھی جس نے بعلبک کے خراج کے منتظم کی شکایت کی، اور جب صالح ابن علی ابن عبداللہ ابن العباس تک یہ بات پہنچی کہ بازنطینیوں نے ان کی حوصلہ افزائی کی ہے، تو اس نے ان کے مذہب کو واپس کرنے کے لیے اپنے فوجیوں کو قتل کرنے کے لیے بھیجا۔ ان کے گاؤں اور لبنان کے لوگوں کی ایک جماعت کو جلاوطن کر دیا۔ الاوزاعی نے اسے ایک لمبا خط لکھا - جس سے القاسم بن سلام نے حفظ کیا - جس میں کہا: \"جن کو تم نے کوہ لبنان کے ذمیوں کو جلاوطن کیا تھا ان میں ایسے مرد بھی تھے جنہوں نے ان لوگوں کے بڑھنے میں مدد نہیں کی تھی جن کو تم نے قتل کیا تھا، جب کہ تم نے باقی لوگوں کو ان کے گاؤں لوٹا دیا تھا، جیسا کہ تم جانتے ہو - تو بہت سے گناہوں کے بدلے میں کیسے اٹھائے جاتے ہیں، جب کہ خدا کے گھر سے مال کم ہوتا ہے\"۔ \"کوئی بوجھ اٹھانے والا کسی دوسرے کا بوجھ نہیں اٹھاتا\"، سب سے زیادہ لائق چیز جس پر عمل کیا جائے اور اس کی پیروی کی جائے، اور سب سے زیادہ لائق وصیت رسول کی ہے، جس نے فرمایا: جو شخص کسی عہد کرنے والے پر ظلم کرے اور اس پر اس کی استطاعت سے زیادہ بوجھ ڈالے، میں اس کا مخالف ہوں، اور مزید۔"
  tr: "El-Baladhuri, Ebu Ubeyd el-Kâsim ibn Sallam'dan, o da Ahmed ibn Kathir'den rivayetle şöyle bildirmiştir: Lübnan Dağı'nda bir grup insan, Baalbek vergi tahsildarına karşı ayaklandı ve o da onları sürgün etti. Çok acı çektiler ve ondan şikayet ettiler. Durumlarının haberi Salih ibn Ali ibn Abdullah ibn el-Abbas'a ulaştı ve Romalıların onları desteklediğini öğrendi. Savaşçılarını öldürmek için takviye birlikler gönderdi, kalanların inançlarını korumalarına izin verdi ve onları köylerine geri gönderdi. Ayrıca Lübnan'dan bazı insanları da sürgün etti. El-Evza'i ona uzun bir mektup yazdı -ki bu mektubu El-Kasım ibn Sallam ezberlemiştir- ve şöyle dedi: “İsyanı desteklemeyen Ahit Ehli'nin Lübnan Dağı'ndan sürülmesini, bir kısmını öldürdüğünüzü, diğerlerini köylerine geri gönderdiğinizi biliyorsunuz. Öyleyse, birkaç kişinin günahı yüzünden koca bir topluluk nasıl cezalandırılabilir, evlerinden kovulup mallarından mahrum bırakılabilir? Yüce Allah'ın hükmü, 'Hiç kimse başkasının yükünü taşımaz,' uyulması ve takip edilmesi gereken en değerli ilkedir. Korunması ve dikkate alınması gereken en değerli emir ise Allah Resulü'nün şu emridir: 'Kim bir ahit altındaki kişiye zulüm eder ve onu gücünden fazla yüklerse, ben onun düşmanı olurum.'” Bir şey daha söyledi."
  id: "Al-Baladhuri, berdasarkan riwayat Abu Ubayd al-Qasim ibn Sallam, yang berdasarkan riwayat Ahmad ibn Kathir, melaporkan: Sekelompok orang di Gunung Lebanon memberontak terhadap pemungut pajak Baalbek, yang mengusir mereka. Mereka sangat menderita, dan mereka mengeluh tentangnya. Kabar tentang keadaan mereka sampai kepada Salih ibn Ali ibn Abdullah ibn al-Abbas, yang mengetahui bahwa bangsa Romawi mendukung mereka. Ia mengirimkan bala bantuan untuk membunuh para pejuang mereka, mengizinkan mereka yang tersisa untuk mempertahankan iman mereka, dan mengembalikan mereka ke desa mereka. Ia juga mengusir beberapa orang dari Lebanon. Al-Awza'i menulis surat panjang kepadanya—yang dihafal oleh al-Qasim ibn Sallam—di mana ia berkata: “Engkau mengetahui tentang pengusiran Ahlul Baitullah dari Gunung Lebanon yang bukan pendukung pemberontakan, sebagian dari mereka engkau bunuh dan sebagian lainnya engkau kembalikan ke desa mereka. Lalu bagaimana mungkin seluruh kelompok dihukum karena dosa beberapa orang, sampai diusir dari rumah mereka dan dirampas harta bendanya? Ketetapan Allah Yang Maha Kuasa, ‘Tidak seorang pun yang menanggung beban akan menanggung beban orang lain,’ adalah prinsip yang paling layak untuk dipatuhi dan diikuti. Yang paling layak untuk dijaga dan diperhatikan adalah perintah Rasulullah, yang bersabda: ‘Barangsiapa menzalimi seseorang yang berada di bawah perjanjian dan membebaninya melebihi kemampuannya, aku akan menjadi musuhnya.’” Ia menyebutkan sesuatu."
