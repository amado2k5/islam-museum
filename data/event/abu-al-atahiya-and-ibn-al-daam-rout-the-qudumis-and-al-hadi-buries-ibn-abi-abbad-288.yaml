id: event/abu-al-atahiya-and-ibn-al-daam-rout-the-qudumis-and-al-hadi-buries-ibn-abi-abbad-288
class: event
kind: other
label:
  ar: "أبو العتاهية وابن الدعام يهزمان القدميين والهادي يدفن ابن أبي عباد، جمادى الآخرة 288هـ"
  en: "Abu al-Atahiya and Ibn al-Da'am rout the Qudumis and al-Hadi buries Ibn Abi Abbad, Jumada II 288 AH"
  fr: "Abu al-Atahiya et Ibn al-Da'am mettent les Qudumis en déroute et al-Hadi enterre Ibn Abi Abbad, jumada II 288 de l’hégire"
  ur: "ابو العتاہیہ اور ابن الدعام قدمیوں کو بھگاتے ہیں اور ہادی ابن ابی عباد کو دفن کرتے ہیں، جمادی الآخرہ 288ھ"
  es: "Abu al-Atahiya e Ibn al-Da'am derrotan a los Qudumis y al-Hadi entierra a Ibn Abi Abbad, Jumada II 288 AH"
  tr: "Ebu el-Atahiyah ve İbn el-Da'am iki Kadam'ı yener ve el-Hadi, İbn Abi Abbad'ı gömer, Cemada el-Ahirah 288 H."
  id: "Abu al-Atahiyah dan Ibnu al-Da'am mengalahkan kedua Qadam, dan al-Hadi menguburkan Ibnu Abi Abbad, Jumada al-Akhirah 288 H."
summary:
  ar: "علم الهادي بدخول القوم فأمر أبا العتاهية ومحمد بن الدعام بالنزول إليهم، فنزلا وافترقا من طريقين فانهزم القوم وقُتل منهم جماعة، ثم دفن الهادي ابن أبي عباد، ويروي الراوي عن أبي العتاهية أن الهادي قال وهو يدفنه إنه ود لو كان معه فاستشهد."
  en: "Al-Hadi, told that the men had entered, ordered Abu al-Atahiya and Muhammad ibn al-Da'am to go down and fight them; they split and attacked by two routes, the men fled and many were killed, and al-Hadi buried Ibn Abi Abbad; the narrator reports from Abu al-Atahiya that al-Hadi said, as he buried him, that he wished he had been with him and died."
  fr: "Informé de l’entrée des hommes, al-Hadi ordonna à Abu al-Atahiya et Muhammad ibn al-Da'am de descendre les combattre ; ils se séparèrent et attaquèrent par deux routes, les hommes s’enfuirent et beaucoup furent tués, puis al-Hadi enterra Ibn Abi Abbad. Le narrateur rapporte d’après Abu al-Atahiya qu’en l’enterrant, al-Hadi dit qu’il aurait souhaité avoir été avec lui et être mort."
  ur: "ہادی کو جب بتایا گیا کہ لوگ اندر گھس آئے ہیں تو انہوں نے ابو العتاہیہ اور محمد بن الدعام کو اترنے کا حکم دیا؛ وہ دو راستوں سے ٹوٹ پڑے، لوگ بھاگ گئے اور ان میں سے بہت مارے گئے، اور ہادی نے ابن ابی عباد کو دفن کیا؛ راوی ابو العتاہیہ سے نقل کرتا ہے کہ ہادی نے دفن کرتے وقت کہا کہ کاش وہ بھی ان کے ساتھ ہوتے اور شہید ہوتے۔"
  es: "Al-Hadi, al enterarse de que los hombres habían entrado, ordenó a Abu al-Atahiya y a Muhammad ibn al-Da'am que bajaran a luchar contra ellos; se dividieron y atacaron por dos rutas, los hombres huyeron y muchos murieron, y al-Hadi enterró a Ibn Abi Abbad; el narrador relata que Abu al-Atahiya dijo que al-Hadi, mientras lo enterraba, deseaba que hubiera estado con él y hubiera muerto."
  tr: "Hadi, halkın girişini öğrenince, Ebu el-Atahiye ve Muhammed ibn el-Da'am'a onlara doğru inmelerini emretti. Onlar indiler ve iki yola ayrıldılar, böylece halk yenilgiye uğradı ve bir kısmı öldürüldü. Sonra Hadi, İbn Abi Abbad'ı defnetti. Rivayet eden, Ebu el-Atahiye'den rivayetle, Hadi'nin onu defnederken, keşke onunla birlikte olsaydım ve şehit olsaydım dediğini aktarır."
  id: "Al-Hadi mengetahui kedatangan orang-orang itu, lalu ia memerintahkan Abu al-Atahiyah dan Muhammad ibn al-Da’am untuk turun menemui mereka. Mereka turun dan terpisah oleh dua jalan, sehingga orang-orang itu dikalahkan dan sebagian dari mereka terbunuh. Kemudian al-Hadi menguburkan Ibnu Abbad. Perawi meriwayatkan dari Abu al-Atahiyah bahwa al-Hadi berkata ketika menguburkannya bahwa ia berharap Ibnu Abbad ada bersamanya dan ikut mati syahid."
