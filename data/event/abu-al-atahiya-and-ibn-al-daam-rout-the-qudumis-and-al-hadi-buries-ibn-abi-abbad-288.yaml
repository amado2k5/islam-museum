id: event/abu-al-atahiya-and-ibn-al-daam-rout-the-qudumis-and-al-hadi-buries-ibn-abi-abbad-288
class: event
kind: other
label:
  ar: "أبو العتاهية وابن الدعام يهزمان القدميين والهادي يدفن ابن أبي عباد، جمادى الآخرة 288هـ"
  en: "Abu al-Atahiya and Ibn al-Da'am rout the Qudumis and al-Hadi buries Ibn Abi Abbad, Jumada II 288 AH"
  ur: "ابو العتاہیہ اور ابن الدعام قدمیوں کو بھگاتے ہیں اور ہادی ابن ابی عباد کو دفن کرتے ہیں، جمادی الآخرہ 288ھ"
summary:
  ar: "علم الهادي بدخول القوم فأمر أبا العتاهية ومحمد بن الدعام بالنزول إليهم، فنزلا وافترقا من طريقين فانهزم القوم وقُتل منهم جماعة، ثم دفن الهادي ابن أبي عباد، ويروي الراوي عن أبي العتاهية أن الهادي قال وهو يدفنه إنه ود لو كان معه فاستشهد."
  en: "Al-Hadi, told that the men had entered, ordered Abu al-Atahiya and Muhammad ibn al-Da'am to go down and fight them; they split and attacked by two routes, the men fled and many were killed, and al-Hadi buried Ibn Abi Abbad; the narrator reports from Abu al-Atahiya that al-Hadi said, as he buried him, that he wished he had been with him and died."
  ur: "ہادی کو جب بتایا گیا کہ لوگ اندر گھس آئے ہیں تو انہوں نے ابو العتاہیہ اور محمد بن الدعام کو اترنے کا حکم دیا؛ وہ دو راستوں سے ٹوٹ پڑے، لوگ بھاگ گئے اور ان میں سے بہت مارے گئے، اور ہادی نے ابن ابی عباد کو دفن کیا؛ راوی ابو العتاہیہ سے نقل کرتا ہے کہ ہادی نے دفن کرتے وقت کہا کہ کاش وہ بھی ان کے ساتھ ہوتے اور شہید ہوتے۔"
