label: { ar: "قبض الكعكي وهدم مسجد براثا", en: "Arrest of al-Ka'ki and Demolition of Baratha Mosque", fr: "L'arrestation d'al-Ka'ki et la démolition de la mosquée de Baratha", es: "Detención de al-Ka'ki y demolición de la mezquita de Baratha.", ur: "الکاکی کی گرفتاری اور براتہ مسجد کی مسماری", tr: "El-Kaaki tutuklandı ve Baratha Camii yıkıldı.", id: "Al-Kaaki ditangkap dan Masjid Baratha dihancurkan." }
summary:
  ar: "في سنة ثلاث عشرة وثلاثمائة كان أبو القاسم الخاقاني في أيام وزارته يبحث عمن يدعو إلى مذهب القرامطة، حتى تظاهرت عنده الأخبار بأن رجلًا يعرف بالكعكي رئيس الرافضة في الجانب الغربي، فقُبض عليه فتلىق من الحيطان وهرب، ووُقع برجل في داره كاتب خليفته ووُجد في الدار رجال يجرون مجرى المتعلمين فضُرب الرجل ثلاثمائة سوط وشُهر على جمل ونودي عليه هذا جزاء من يشتم أبا بكر وعمر، وحُبس الباقون؛ وعرف المقتدر أن الرافضة تجتمع في مسجد براثا تشتم الصحابة فوجه نازوك فقبض على ثلاثين إنسانًا وُجد معهم خواتيم من طين أبيض يختمها الكعكي عليها «علي بن إسماعيل الإمام المهدي ولي الله»، وتجرأ الخاقاني فطلب هدم مسجد براثا وأحضر رقعة فيها فتوى جماعة من الفقهاء أنه مسجد ضرار وكفر وتفريق بين المؤمنين، فأمر المقتدر بهدمه فهدمه نازوك {cite:muntazam-ibn-al-jawzi p. 480-481}."
  en: "In 313 the vizier al-Khaqani hunted the Qarmatian network: the Karkh rafidi chief al-Ka'ki escaped the wall-climbing arrest, his secretary was flogged three hundred lashes and paraded on a camel as the punishment of him who curses Abu Bakr and Umar; thirty men were seized at Baratha mosque with clay seals reading Ali ibn Ismail al-Imam al-Mahdi wali Allah; the jurists' fatwa declared it a Masjid Dirar and al-Muqtadir ordered it demolished {cite:muntazam-ibn-al-jawzi p. 480-481}."
  fr: "En 313, le vizir al-Khaqani traqua le réseau qarmate : le chef rafidite de Karkh, al-Ka'ki, échappa à l'arrestation en escaladant le mur ; son secrétaire reçut trois cents coups de fouet et fut promené sur un chameau comme châtiment de celui qui maudit Abu Bakr et Umar ; trente hommes furent saisis à la mosquée de Baratha avec des sceaux d'argile portant « Ali ibn Ismail, l'imam al-Mahdi, ami de Dieu » ; la fatwa des juristes la déclara Masjid Dirar et al-Muqtadir ordonna de la démolir {cite:muntazam-ibn-al-jawzi p. 480-481}."
  es: "En 313, el visir al-Khaqani persiguió a la red cármata: el jefe rafidi de Karkh, al-Ka'ki, escapó del arresto por escalar el muro; su secretario fue azotado con trescientos latigazos y paseado en un camello como castigo para quien maldice a Abu Bakr y Umar; treinta hombres fueron apresados en la mezquita de Baratha con sellos de arcilla que decían Ali ibn Ismail al-Imam al-Mahdi wali Allah; la fatwa de los juristas la declaró una Masjid Dirar y al-Muqtadir ordenó su demolición {cite:muntazam-ibn-al-jawzi p. 480-481}."
  ur: "313 میں وزیر الخاقانی نے قرمتی نیٹ ورک کا شکار کیا: کارخ رافدی کا سربراہ الکاکی دیوار پر چڑھنے کی گرفتاری سے بچ گیا، اس کے سیکرٹری کو تین سو کوڑے لگائے گئے اور ابوبکر و عمر پر لعنت کرنے والے کی سزا کے طور پر اسے اونٹ پر چڑھایا گیا۔ باراتہ مسجد میں تیس آدمیوں کو علی ابن اسماعیل الامام المہدی ولی اللہ پڑھتے ہوئے مٹی کی مہروں کے ساتھ پکڑا گیا۔ فقہاء کے فتویٰ نے اسے مسجد دیرار قرار دیا اور مقتدر نے اسے منہدم کرنے کا حکم دیا۔ 480-481}۔"
  tr: "Hicri 313 yılında, Ebu el-Kâsim el-Hakani, vezirliği sırasında Karmati doktrinini savunan birini ararken, batı yakasında Rafizilerin başı olarak bilinen el-Ka'ki adlı bir adamın olduğu haberi kendisine ulaştı. Adam tutuklandı, ancak surlardan atlayarak kaçtı. Halifesinin kâtibi olan bir adam evinde tutuklandı ve evde eğitimli gibi davranan adamlar bulundu. Adam üç yüz kırbaçla dövüldü ve bir deve üzerinde teşhir edildi ve üzerine şöyle ilan edildi: \"Bu, Ebu Bekir ve Ömer'e hakaret edenin cezasıdır.\" Geri kalanlar hapsedildi. El-Muktadir, Rafizilerin Baratha Mescidi'nde Sahabelere hakaret etmek için toplandığını biliyordu, bu yüzden Nazuk'u gönderdi ve Nazuk, üzerinde \"Ali bin İsmail, İmam Mehdi, Allah'ın dostu\" yazılı, el-Ka'ki tarafından mühürlenmiş beyaz kil yüzükler bulunan otuz kişiyi tutukladı. El-Hakani, Baratha Camii'nin yıkılmasını istemeye cüret etti ve bir grup hukukçunun caminin müminler arasında fitne, küfür ve ayrılık çıkaran bir cami olduğuna dair fetvasını içeren bir belge getirdi. El-Muktadir yıkılmasını emretti ve Nazuk da camiyi yıktırdı. {cite:muntazam-ibn-al-jawzi s. 480-481}"
  id: "Pada tahun 313 H, Abu al-Qasim al-Khaqani, selama masa jabatannya sebagai menteri, sedang mencari seseorang yang menyerukan doktrin Qarmatian, hingga sampai kepadanya kabar bahwa seorang pria bernama al-Ka’ki adalah kepala Rafidiyah di sisi barat. Ia ditangkap, tetapi ia melompat dari tembok dan melarikan diri. Seorang pria ditangkap di rumahnya, juru tulis khalifahnya, dan ditemukan beberapa orang di rumah itu yang berpura-pura menjadi orang terpelajar. Pria itu dicambuk tiga ratus kali dan diarak di atas unta, dan diumumkan kepadanya: “Inilah hukuman bagi siapa pun yang menghina Abu Bakar dan Umar.” Sisanya dipenjara. Al-Muqtadir mengetahui bahwa kaum Rafidiyah berkumpul di Masjid Baratha untuk menghina para Sahabat, jadi dia mengirim Nazuk, yang menangkap tiga puluh orang yang ditemukan membawa cincin tanah liat putih yang disegel oleh al-Ka’ki yang bertuliskan “Ali bin Ismail, Imam Mahdi, sahabat Allah.” Al-Khaqani berani meminta pembongkaran Masjid Baratha dan membawa selembar kertas berisi fatwa dari sekelompok ahli hukum yang menyatakan bahwa masjid tersebut adalah masjid perselisihan, kekafiran, dan perpecahan di antara orang-orang beriman. Al-Muqtadir memerintahkan pembongkarannya, dan Nazuk membongkarnya. {cite:muntazam-ibn-al-jawzi p. 480-481}."
