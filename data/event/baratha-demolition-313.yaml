label: { ar: "قبض الكعكي وهدم مسجد براثا", en: "Arrest of al-Ka'ki and Demolition of Baratha Mosque" }
summary:
  ar: "في سنة ثلاث عشرة وثلاثمائة كان أبو القاسم الخاقاني في أيام وزارته يبحث عمن يدعو إلى مذهب القرامطة، حتى تظاهرت عنده الأخبار بأن رجلًا يعرف بالكعكي رئيس الرافضة في الجانب الغربي، فقُبض عليه فتلىق من الحيطان وهرب، ووُقع برجل في داره كاتب خليفته ووُجد في الدار رجال يجرون مجرى المتعلمين فضُرب الرجل ثلاثمائة سوط وشُهر على جمل ونودي عليه هذا جزاء من يشتم أبا بكر وعمر، وحُبس الباقون؛ وعرف المقتدر أن الرافضة تجتمع في مسجد براثا تشتم الصحابة فوجه نازوك فقبض على ثلاثين إنسانًا وُجد معهم خواتيم من طين أبيض يختمها الكعكي عليها «علي بن إسماعيل الإمام المهدي ولي الله»، وتجرأ الخاقاني فطلب هدم مسجد براثا وأحضر رقعة فيها فتوى جماعة من الفقهاء أنه مسجد ضرار وكفر وتفريق بين المؤمنين، فأمر المقتدر بهدمه فهدمه نازوك {cite:muntazam-ibn-al-jawzi p. 480-481}."
  en: "In 313 the vizier al-Khaqani hunted the Qarmatian network: the Karkh rafidi chief al-Ka'ki escaped the wall-climbing arrest, his secretary was flogged three hundred lashes and paraded on a camel as the punishment of him who curses Abu Bakr and Umar; thirty men were seized at Baratha mosque with clay seals reading Ali ibn Ismail al-Imam al-Mahdi wali Allah; the jurists' fatwa declared it a Masjid Dirar and al-Muqtadir ordered it demolished {cite:muntazam-ibn-al-jawzi p. 480-481}."
