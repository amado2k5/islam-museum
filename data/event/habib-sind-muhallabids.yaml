label: { ar: "حبيب بن المهلب بالسند وإسلام ملوكها ومقتل بني المهلب", en: "Habib's Sind, the Kings' Conversion, and the Muhallabids' End", es: "El Sind de Habib, la conversión de los reyes y el fin de los muhallabíes.", fr: "Le Sind d'Habib, la conversion des rois et la fin des Mouhallabides", ur: "حبیب کی سندھ، بادشاہوں کی تبدیلی، اور محلہ والوں کا خاتمہ", tr: "Sindh'de Habib ibn al-Muhallab'ın ortaya çıkışı, krallarının İslam'a geçmesi ve Beni al-Muhallab kabilesinin öldürülmesi.", id: "Habib ibn al-Muhallab di Sindh, konversi raja-rajanya ke Islam, dan pembunuhan Banu al-Muhallab." }
summary:
  ar: "استعمل سليمان بن عبد الملك حبيب بن المهلب على حرب السند فقدمها وقد رجع ملوك الهند إلى ممالكهم فرجع حبشة بن داهر إلى برهمباذ ونزل حبيب على شاطئ مهران فأعطاه أهلها الطاعة وحارب قوماً فظفر بهم ثم مات سليمان وكانت خلافة عمر بن عبد العزيز بعده فكتب إلى الملوك يدعوهم إلى الإسلام والطاعة على أن يملكهم ولهم ما للمسلمين وعليهم ما عليهم وقد كانت بلغتهم سيرته ومذهبه فأسلم حبشة والملوك وتسموا بأسماء العرب وكان عمرو بن مسلم الباهلي عامل عمر على ذلك الثغر فغزا بعض الهند فظفر وهرب بنو المهلب إلى السند في أيام يزيد بن عبد الملك فوجه إليهم هلال بن أحوز التميمي فلقيهم فقتل مدرك بن المهلب بتندابيل وقتل المفضل وعبد الملك وزياد ومروان ومعاوية بني المهلب وقتل معاوية بن يزيد في آخرين."
  en: "Sulayman sent Habib ibn al-Muhallab to the Sind war as India's kings regained their thrones — Dahir's son Habsha back at Brahmanabadh — and Habib took obedience on Mihran's shore. When Umar ibn Abd al-Aziz followed, he wrote the kings inviting them to Islam with kingship kept and Muslims' rights and duties — his reputation had reached them — and Habsha and the kings converted, taking Arab names; Amr ibn Muslim al-Bahili raided Hind and won. Under Yazid ibn Abd al-Malik the Banu al-Muhallab fled to Sind; Hilal ibn Ahwaz al-Tamimi cut them down at Tandabil — Mudrik, al-Mufaddal, Abd al-Malik, Ziyad, Marwan and Mu'awiya, with Mu'awiya ibn Yazid among others."
  es: "Sulayman envió a Habib ibn al-Muhallab a la guerra de Sind mientras los reyes de la India recuperaban sus tronos —Habsha, hijo de Dahir, regresó a Brahmanabad— y Habib se sometió en la costa de Mihran. Cuando Umar ibn Abd al-Aziz los siguió, escribió a los reyes invitándolos al Islam, conservando la monarquía y los derechos y deberes de los musulmanes —su reputación había llegado hasta ellos— y Habsha y los reyes se convirtieron, adoptando nombres árabes; Amr ibn Muslim al-Bahili saqueó Hind y venció. Bajo el mando de Yazid ibn Abd al-Malik, los Banu al-Muhallab huyeron a Sind; Hilal ibn Ahwaz al-Tamimi los aniquiló en Tandabil: Mudrik, al-Mufaddal, Abd al-Malik, Ziyad, Marwan y Mu'awiya, con Mu'awiya ibn Yazid entre otros."
  fr: "Sulayman envoya Habib ibn al-Muhallab à la guerre du Sind tandis que les rois de l'Inde recouvraient leurs trônes – Habsha, fils de Dahir, retournant à Brahmanabad – et Habib prêta allégeance sur les rives de Mihran. À son retour, Umar ibn Abd al-Aziz écrivit aux rois pour les inviter à l'islam, leur assurant le maintien de la royauté et des droits et devoirs des musulmans – sa réputation était parvenue jusqu'à eux – et Habsha et les rois se convertirent, adoptant des noms arabes. Amr ibn Muslim al-Bahili mena une expédition en Inde et remporta la victoire. Sous Yazid ibn Abd al-Malik, les Banu al-Muhallab s'enfuirent au Sind; Hilal ibn Ahwaz al-Tamimi les massacra à Tandabil – Mudrik, al-Mufaddal, Abd al-Malik, Ziyad, Marwan et Mu'awiya, avec Mu'awiya ibn Yazid parmi les autres."
  ur: "سلیمان نے حبیب ابن المحلب کو سندھ کی جنگ کے لیے بھیجا جب ہندوستان کے بادشاہوں نے اپنے تخت دوبارہ حاصل کیے — داہر کا بیٹا حبشہ واپس برہمن آباد پر — اور حبیب نے مہران کے ساحل پر اطاعت قبول کی۔ جب عمر بن عبد العزیز نے پیروی کی تو اس نے بادشاہوں کو بادشاہت کے ساتھ اسلام کی دعوت دیتے ہوئے لکھا اور مسلمانوں کے حقوق اور فرائض - اس کی شہرت ان تک پہنچ گئی تھی - اور حبشہ اور بادشاہوں نے عرب نام لے کر مذہب تبدیل کیا۔ عمرو بن مسلم الباہلی نے ہند پر چڑھائی کی اور فتح حاصل کی۔ یزید بن عبد الملک کے ماتحت بنو المحلب بھاگ کر سندھ چلے گئے۔ ہلال ابن اہواز التمیمی نے انہیں تنبیل میں کاٹ دیا — مدرک، المفضل، عبد الملک، زیاد، مروان اور معاویہ، معاویہ بن یزید کے ساتھ اور دیگر۔"
  tr: "Süleyman ibn Abdülmalik, Sind'deki savaşı yönetmesi için Habib ibn el-Muhalleb'i görevlendirdi. Hindistan kralları krallıklarına döndükten sonra Sind'e ilerledi. Habeş ibn Dahir Brahmabudh'a döndü ve Habib Mehran kıyılarına çıktı. Halkı ona itaat etti ve bazı halklarla savaştı ve onları yendi. Sonra Süleyman öldü ve Ömer ibn Abdülaziz'in halifeliği geçti. Krallara İslam'a ve itaate davet eden bir mektup yazdı; bunun şartı, onları yönetecek olması, Müslümanların sahip olduklarına sahip olacakları ve tabi olduklarına tabi olacaklarıydı. Biyografisi ve öğretisi onlara ulaşmıştı, bu yüzden Habeş ve krallar İslam'ı kabul edip Arap isimleri aldılar. Amr ibn Müslim el-Bahili, Ömer'in o sınırdaki valisiydi. Hindistan'ın bazı bölgelerine baskınlar düzenledi ve zafer kazandı. Beni el-Muhalleb, Yezid ibn Abdülmalik döneminde Sind'e kaçtı. Hilal ibn Ahvaz et-Temimi'yi onların üzerine gönderdi ve onlarla karşılaştı ve Tindabil'de Mudrik ibn el-Muhallab'ı öldürdü. El-Mufaddal'ı, Abdülmelik'i, Ziyad'ı, Mervan'ı ve Muaviye'yi, Banu el-Muhallab'ı öldürdü ve Muaviye ibn Yezid'i ve diğerlerini öldürdü."
  id: "Sulaiman bin Abd al-Malik menunjuk Habib bin al-Muhallab untuk memimpin perang di Sindh. Ia maju ke Sindh setelah raja-raja India kembali ke kerajaan mereka. Habash bin Dahir kembali ke Brahmabudh, dan Habib mendarat di tepi sungai Mehran. Penduduknya menaatinya, dan ia memerangi beberapa orang dan mengalahkan mereka. Kemudian Sulaiman wafat, dan kekhalifahan Umar bin Abd al-Aziz menggantikannya. Ia menulis surat kepada raja-raja, mengajak mereka masuk Islam dan taat, dengan syarat ia akan memerintah mereka dan mereka akan memiliki apa yang dimiliki umat Islam dan tunduk pada apa yang mereka tundukkan. Biografi dan ajarannya telah sampai kepada mereka, sehingga Habash dan raja-raja masuk Islam dan mengambil nama-nama Arab. Amr bin Muslim al-Bahili adalah gubernur Umar di perbatasan itu. Ia menyerang beberapa wilayah di India dan meraih kemenangan. Bani al-Muhallab melarikan diri ke Sindh pada masa Yazid bin Abd al-Malik. Dia mengirim Hilal ibn Ahwaz al-Tamimi melawan mereka, dan dia menemui mereka dan membunuh Mudrik ibn al-Muhallab di Tindabil. Dia membunuh al-Mufaddal, Abd al-Malik, Ziyad, Marwan, dan Muawiyah, Banu al-Muhallab, dan dia membunuh Muawiyah bin Yazid dan lain-lain."
