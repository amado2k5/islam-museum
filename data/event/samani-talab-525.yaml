label:
  ar: "السمعاني يبدأ طلب العلم قبل العشرين: نيسابور لصحيح مسلم ثم طوس وغيرها، نحو ٥٢٥هـ"
  en: "Al-Sam'ani begins the talab al-'ilm before the age of twenty: Nishapur for Sahih Muslim, then Tus and beyond, c. 525/1131"
  ur: "سمعانی بیس برس سے پہلے طلبِ علم شروع کرتے ہیں: صحیح مسلم کے لیے نیشاپور، پھر طوس اور دیگر مقامات، تقریباً 525ھ/1131ء"
summary:
  ar: "لما راهق أبو سعد أقبل على القرآن والفقه والاشتغال، وكبر وأحب الحديث والسماع وعُني بهذا الشأن {cite:tarikh-islam-dhahabi p. 120}؛ ولم يكن قد بلغ العشرين حين انطلق في طلب العلم، فعاد أولاً إلى نيسابور تحت رعاية عميه لتدريب خاص في صحيح مسلم، ثم إلى طوس وغيرها من البلدان {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}."
  en: "As a youth Abu Sa'd turned to Qur'an, fiqh and study, and growing older he came to love hadith and audition {cite:tarikh-islam-dhahabi p. 120}. Not quite twenty, he set out on the talab al-'ilm: first back to Nishapur under his uncles' tutelage for special training in the Sahih of Muslim, then to Tus and other places {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}."
  ur: "جوانی کو پہنچتے ہی ابو سعد قرآن، فقہ اور تحصیل کی طرف مائل ہوئے اور بڑے ہوکر حدیث اور سماعت سے محبت کرنے لگے {cite:tarikh-islam-dhahabi p. 120}۔ بیس برس پورے کیے بغیر انہوں نے طلبِ علم کا آغاز کیا: پہلے چچاؤں کی نگرانی میں صحیح مسلم کی خصوصی تربیت کے لیے دوبارہ نیشاپور، پھر طوس اور دیگر مقامات {cite:encyclopaedia-of-islam-2 vol. 8 p. 1024}۔"
