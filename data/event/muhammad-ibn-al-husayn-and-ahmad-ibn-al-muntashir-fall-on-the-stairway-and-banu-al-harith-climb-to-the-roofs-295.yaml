id: "event/muhammad-ibn-al-husayn-and-ahmad-ibn-al-muntashir-fall-on-the-stairway-and-banu-al-harith-climb-to-the-roofs-295"
class: event
kind: other
label:
  ar: "مقتل محمد بن الحسين وأحمد بن المنتشر عند الدرجة، وصعود بني الحارث إلى السطوح، 295هـ"
  en: "Muhammad ibn al-Husayn and Ahmad ibn al-Muntashir fall defending the stairway, and Banu al-Harith climb to the roofs, 295 AH, p. 373"
  ur: "زینے پر محمد بن الحسین اور احمد بن المنتشر کی شہادت، اور بنو حارث کا چھتوں پر چڑھنا، 295ھ، ص373"
  es: "Muhammad ibn al-Husayn y Ahmad ibn al-Muntashir caen defendiendo la escalera, y Banu al-Harith suben a los tejados, 295 AH, pág. 373"
  fr: "Muhammad ibn al-Husayn et Ahmad ibn al-Muntashir tombent en défendant l'escalier, et les Banu al-Harith grimpent sur les toits, 295 AH, p. 373"
  tr: "Muhammed ibn el-Hüseyin ve Ahmed ibn el-Munteşir'in merdivenlerin dibinde öldürülmesi ve Beni el-Harith kabilesinin çatılara çıkması, Hicri 295"
  id: "Pembunuhan Muhammad ibn al-Husayn dan Ahmad ibn al-Muntashir di kaki tangga, dan naiknya Bani al-Harith ke atap rumah, 295 H."
summary:
  ar: "قاتل محمد بن الحسين العباسي من ولد العباس بن عبد المطلب على الدرجة حتى قتل، ثم قام مقامه أحمد بن المنتشر الهمداني فقاتل حتى قتل. وصعدت بنو الحارث إلى السطوح وهدموا جوانب الحجرات، حتى بلغ أبو جعفر وأصحابه رواقاً أمام البيت الذي فيه النساء من أهل البيت."
  en: "Muhammad ibn al-Husayn al-Abbasi, a descendant of al-Abbas ibn Abd al-Muttalib, held the stairway until he was killed. Ahmad ibn al-Muntashir al-Hamdani took his place and fought until he was killed. Banu al-Harith climbed the roofs, broke down the sides of the rooms, and drove Abu Ja'far and his men back to a portico in front of the room where the women of the household were."
  ur: "محمد بن الحسین العباسی، جو عباس بن عبدالمطلب کی اولاد میں سے تھے، زینے پر لڑتے رہے یہاں تک کہ شہید ہو گئے۔ ان کی جگہ احمد بن المنتشر الہمدانی نے لی اور لڑتے ہوئے شہید ہوئے۔ بنو حارث چھتوں پر چڑھ گئے، کمروں کے پہلو توڑ دیے، اور ابو جعفر اور اس کے ساتھیوں کو اس برآمدے تک پیچھے دھکیل دیا جو اس کمرے کے سامنے تھا جس میں گھر کی خواتین تھیں۔"
  es: "Muhammad ibn al-Husayn al-Abbasi, descendiente de al-Abbas ibn Abd al-Muttalib, defendió la escalera hasta su muerte. Ahmad ibn al-Muntashir al-Hamdani ocupó su lugar y luchó hasta morir. Los Banu al-Harith treparon a los tejados, derribaron las paredes de las habitaciones y obligaron a Abu Ja'far y a sus hombres a retroceder hasta un pórtico frente a la habitación donde se encontraban las mujeres de la casa."
  fr: "Muhammad ibn al-Husayn al-Abbasi, descendant d'al-Abbas ibn Abd al-Muttalib, tint l'escalier jusqu'à sa mort. Ahmad ibn al-Muntashir al-Hamdani prit sa place et combattit jusqu'à son dernier souffle. Les Banu al-Harith escaladèrent les toits, abattirent les murs des pièces et repoussèrent Abu Ja'far et ses hommes jusqu'à un portique situé devant la pièce où se trouvaient les femmes de la maison."
  tr: "Abbas ibn Abdülmuttalib'in soyundan gelen Muhammed ibn el-Hüseyn el-Abbasi, öldürülene kadar merdivenlerde savaştı. Ardından Ahmed ibn el-Munteşir el-Hamdani onun yerini aldı ve o da öldürülene kadar savaştı. Beni el-Harith kabilesi çatılara tırmandı ve odaların duvarlarını yıktı; ta ki Ebu Cafer ve arkadaşları, Peygamber ailesinin kadınlarının bulunduğu evin önündeki revaka ulaşana kadar."
  id: "Muhammad ibn al-Husayn al-Abbasi, keturunan al-Abbas ibn Abd al-Muttalib, bertempur di tangga hingga gugur. Kemudian Ahmad ibn al-Muntashir al-Hamdani menggantikannya dan bertempur hingga gugur. Bani al-Harith naik ke atap dan menghancurkan sisi-sisi ruangan, hingga Abu Ja'far dan para sahabatnya mencapai serambi di depan rumah tempat para wanita keluarga Nabi berada."
