id: "event/muhammad-ibn-al-husayn-and-ahmad-ibn-al-muntashir-fall-on-the-stairway-and-banu-al-harith-climb-to-the-roofs-295"
class: event
kind: other
label:
  ar: "مقتل محمد بن الحسين وأحمد بن المنتشر عند الدرجة، وصعود بني الحارث إلى السطوح، 295هـ"
  en: "Muhammad ibn al-Husayn and Ahmad ibn al-Muntashir fall defending the stairway, and Banu al-Harith climb to the roofs, 295 AH, p. 373"
  ur: "زینے پر محمد بن الحسین اور احمد بن المنتشر کی شہادت، اور بنو حارث کا چھتوں پر چڑھنا، 295ھ، ص373"
summary:
  ar: "قاتل محمد بن الحسين العباسي من ولد العباس بن عبد المطلب على الدرجة حتى قتل، ثم قام مقامه أحمد بن المنتشر الهمداني فقاتل حتى قتل. وصعدت بنو الحارث إلى السطوح وهدموا جوانب الحجرات، حتى بلغ أبو جعفر وأصحابه رواقاً أمام البيت الذي فيه النساء من أهل البيت."
  en: "Muhammad ibn al-Husayn al-Abbasi, a descendant of al-Abbas ibn Abd al-Muttalib, held the stairway until he was killed. Ahmad ibn al-Muntashir al-Hamdani took his place and fought until he was killed. Banu al-Harith climbed the roofs, broke down the sides of the rooms, and drove Abu Ja'far and his men back to a portico in front of the room where the women of the household were."
  ur: "محمد بن الحسین العباسی، جو عباس بن عبدالمطلب کی اولاد میں سے تھے، زینے پر لڑتے رہے یہاں تک کہ شہید ہو گئے۔ ان کی جگہ احمد بن المنتشر الہمدانی نے لی اور لڑتے ہوئے شہید ہوئے۔ بنو حارث چھتوں پر چڑھ گئے، کمروں کے پہلو توڑ دیے، اور ابو جعفر اور اس کے ساتھیوں کو اس برآمدے تک پیچھے دھکیل دیا جو اس کمرے کے سامنے تھا جس میں گھر کی خواتین تھیں۔"
