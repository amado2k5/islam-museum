id: event/al-dahhaf-raids-yadr-of-banu-mazin-and-ali-ibn-muhammad-pursues-him-at-night-294
class: event
kind: skirmish
label:
  ar: "الدهف يغير على يدر بني مازن بنجران وعلي بن محمد يطلبه ليلاً، ليلة النصف من رمضان 294هـ، ص344-345"
  en: "Al-Dahhaf raids Yadr of Banu Mazin in Najran and Ali ibn Muhammad pursues him at night, the middle of Ramadan 294 AH, pp. 344-345"
  ur: "دہف کا نجران میں بنی مازن کے یدر پر حملہ اور علی بن محمد کا رات کو تعاقب، رمضان کی پندرہویں رات 294ھ، ص344-345"
summary:
  ar: "في ليلة النصف من رمضان أغار الدهف بن موسى العمري من بني الحارث على يدر بني مازن، فطلبه محمد بن عبيد الله، فخرج علي بن محمد بابنه وإخوته في الليل، ووصل الصيرم عند الفجر."
  en: "On the night of 15 Ramadan, al-Dahhaf ibn Musa al-Amri of Banu al-Harith raided Yadr of Banu Mazin. Muhammad ibn Ubaydallah wanted him, so Ali ibn Muhammad set out at night with his brother and a cousin and reached al-Sayrim at dawn."
  ur: "رمضان کی پندرہویں رات بنی الحارث کے دہف بن موسی العمری نے بنی مازن کے یدر پر حملہ کیا۔ محمد بن عبید اللہ اسے ڈھونڈ رہے تھے، اس لیے علی بن محمد اپنے بھائی اور چچازاد کے ساتھ رات کو نکلے اور فجر کے وقت الصیرم پہنچے۔"
