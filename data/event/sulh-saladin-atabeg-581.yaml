summary:
  ar: "عاد صلاح الدين إلى بلد الموصل فجرى الصلح بينه وبين أتابك عز الدين مسعود بن مودود على إقرار كل صاحب بلد ببلده ونصرة من اعتدى على بلاد أحدهما {cite:kamil-ibn-al-athir p. 134}."
  en: "Saladin returned to Mosul and made peace with the atabeg Izz al-Din Masud ibn Mawdud — each confirmed in his lands, bound to aid against any aggressor {cite:kamil-ibn-al-athir p. 134}."
  es: "Saladino regresó a Mosul e hizo las paces con el atabeg Izz al-Din Masud ibn Mawdud; cada uno se confirmó en sus tierras y se comprometió a ayudar contra cualquier agresor {cite:kamil-ibn-al-athir p. 134}."
  fr: "Saladin retourna à Mossoul et fit la paix avec l'atabeg Izz al-Din Masud ibn Mawdud — chacun étant confirmé dans ses terres, tenu d'aider contre tout agresseur {cite:kamil-ibn-al-athir p. 134}."
  ur: "صلاح الدین موصل واپس آیا اور عتبیگ عزالدین مسعود ابن مودود کے ساتھ صلح کر لی - ہر ایک اپنی سرزمین میں تصدیق شدہ، کسی بھی جارح کے خلاف مدد کے لیے پابند تھا۔ 134}۔"
  tr: "Selahaddin Musul şehrine döndü ve kendisiyle Atabeg İzz el-Din Mesud bin Mevdud arasında, her şehrin yöneticisinin kendi şehrinde tanınması ve kendi şehirlerinden birine saldıran herkesi desteklemesi esasına dayalı bir barış sağlandı. {Kaynak: Kamil İbn el-Athir s. 134}"
  id: "Saladin kembali ke kota Mosul, dan perdamaian terjalin antara dia dan Atabeg Izz al-Din Masoud bin Mawdud, dengan dasar bahwa setiap penguasa kota diakui di kotanya masing-masing dan mendukung siapa pun yang menyerang kota salah satu dari mereka. {cite:kamil-ibn-al-athir p. 134}."
