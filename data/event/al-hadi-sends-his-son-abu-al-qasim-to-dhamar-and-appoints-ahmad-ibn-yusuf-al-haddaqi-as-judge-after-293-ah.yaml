id: "event/al-hadi-sends-his-son-abu-al-qasim-to-dhamar-and-appoints-ahmad-ibn-yusuf-al-haddaqi-as-judge-after-293-ah"
class: event
kind: other
label:
  ar: "الهادي يبعث ابنه أبا القاسم إلى ذمار ويولي أحمد بن يوسف الحدّاقي القضاء، بعد 293هـ، ص392"
  en: "Al-Hadi sends his son Abu al-Qasim to Dhamar and appoints Ahmad ibn Yusuf al-Haddaqi as judge, after 293 AH, p. 392"
  ur: "ہادی اپنے بیٹے ابو القاسم کو ذمار بھیجتا ہے اور احمد بن یوسف الحداقی کو قاضی مقرر کرتا ہے، 293ھ کے بعد، ص392"
summary:
  ar: "يبعث الهادي ابنه أبا القاسم إلى ذمار، ويولي أحمد بن يوسف الحدّاقي القضاء، بينما يحارب محمد بن يحيى القرامطة في تلك الناحية، ثم يلحق بأبيه إلى صنعاء حين يتقدم القرامطة نحو ذمار."
  en: "Al-Hadi sends his son Abu al-Qasim to Dhamar and appoints Ahmad ibn Yusuf al-Haddaqi as judge. Muhammad ibn Yahya fights the Qarmatians in that district and then, as they advance on Dhamar, joins his father in Sanaa."
  ur: "ہادی اپنے بیٹے ابو القاسم کو ذمار بھیجتا ہے اور احمد بن یوسف الحداقی کو قاضی مقرر کرتا ہے۔ محمد بن یحیی اس علاقے میں قرامطہ سے لڑتا ہے، پھر قرامطہ کے ذمار کی طرف بڑھنے پر اپنے والد کے پاس صنعاء آ جاتا ہے۔"
