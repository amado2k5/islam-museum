id: "event/al-hadi-sends-his-son-abu-al-qasim-to-dhamar-and-appoints-ahmad-ibn-yusuf-al-haddaqi-as-judge-after-293-ah"
class: event
kind: other
label:
  ar: "الهادي يبعث ابنه أبا القاسم إلى ذمار ويولي أحمد بن يوسف الحدّاقي القضاء، بعد 293هـ، ص392"
  en: "Al-Hadi sends his son Abu al-Qasim to Dhamar and appoints Ahmad ibn Yusuf al-Haddaqi as judge, after 293 AH, p. 392"
  ur: "ہادی اپنے بیٹے ابو القاسم کو ذمار بھیجتا ہے اور احمد بن یوسف الحداقی کو قاضی مقرر کرتا ہے، 293ھ کے بعد، ص392"
  es: "Al-Hadi envía a su hijo Abu al-Qasim a Dhamar y nombra a Ahmad ibn Yusuf al-Haddaqi como juez, después del año 293 AH, pág. 392."
  fr: "Al-Hadi envoie son fils Abu al-Qasim à Dhamar et nomme Ahmad ibn Yusuf al-Haddaqi juge, après 293 AH, p. 392"
  tr: "Al-Hadi, 293 Hicri yılından sonra oğlu Ebu el-Kâsım'ı Damar'a gönderir ve Ahmed ibn Yusuf el-Haddaki'yi kadı olarak atar (s. 392)."
  id: "Al-Hadi mengutus putranya Abu al-Qasim ke Dhamar dan mengangkat Ahmad ibn Yusuf al-Haddaki sebagai hakim, setelah tahun 293 H, hlm. 392"
summary:
  ar: "يبعث الهادي ابنه أبا القاسم إلى ذمار، ويولي أحمد بن يوسف الحدّاقي القضاء، بينما يحارب محمد بن يحيى القرامطة في تلك الناحية، ثم يلحق بأبيه إلى صنعاء حين يتقدم القرامطة نحو ذمار."
  en: "Al-Hadi sends his son Abu al-Qasim to Dhamar and appoints Ahmad ibn Yusuf al-Haddaqi as judge. Muhammad ibn Yahya fights the Qarmatians in that district and then, as they advance on Dhamar, joins his father in Sanaa."
  ur: "ہادی اپنے بیٹے ابو القاسم کو ذمار بھیجتا ہے اور احمد بن یوسف الحداقی کو قاضی مقرر کرتا ہے۔ محمد بن یحیی اس علاقے میں قرامطہ سے لڑتا ہے، پھر قرامطہ کے ذمار کی طرف بڑھنے پر اپنے والد کے پاس صنعاء آ جاتا ہے۔"
  es: "Al-Hadi envía a su hijo Abu al-Qasim a Dhamar y nombra juez a Ahmad ibn Yusuf al-Haddaqi. Muhammad ibn Yahya combate a los cármatas en esa región y, cuando estos avanzan hacia Dhamar, se reúne con su padre en Sanaa."
  fr: "Al-Hadi envoie son fils Abu al-Qasim à Dhamar et nomme Ahmad ibn Yusuf al-Haddaqi juge. Muhammad ibn Yahya combat les Qarmates dans ce district, puis, alors qu'ils avancent sur Dhamar, il rejoint son père à Sanaa."
  tr: "El-Hadi, oğlu Ebu el-Kâsım'ı Damar'a gönderir ve Ahmed ibn Yusuf el-Haddaki'yi kadı olarak atar; Muhammed ibn Yahya ise o bölgede Karmatilerle savaşır, ardından Karmatiler Damar'a doğru ilerleyince babasının yanına Sana'a'ya gider."
  id: "Al-Hadi mengutus putranya, Abu al-Qasim, ke Dhamar, dan menunjuk Ahmad ibn Yusuf al-Haddaki sebagai hakim, sementara Muhammad ibn Yahya memerangi kaum Qarmatian di wilayah itu, kemudian bergabung dengan ayahnya di Sana'a ketika kaum Qarmatian maju menuju Dhamar."
