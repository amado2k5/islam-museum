summary:
  ar: "أعرق متن سني حديث في الرد المنهجي على التشيع: ألّف العالِم الهندي [[person/shah-abdul-aziz-dehlawi|شاه عبد العزيز الدهلوي]] «تحفة اثنا عشرية» بالفارسية يناقش فيها أصول الاعتقاد الاثني عشري ويجادله نقطة نقطة، ثم اختصرها إلى العربية محمود شكري الآلوسي فصارت المرجع الأول للمناظرين السنة المعاصرين في باب الإمامة والصحابة وعلم الغيب {cite:al-islam-murajaat}."
  en: "The most venerable modern Sunni manual of systematic reply to Shi'ism: the Indian scholar [[person/shah-abdul-aziz-dehlawi|Shah Abdul Aziz Dehlawi]] composed Tuhfa Ithna Ashariyya in Persian, examining Twelver doctrine point by point; Mahmud Shukri al-Alusi later abridged it into Arabic, where it became the first reference of contemporary Sunni debaters on the Imamate, the Companions and the unseen {cite:al-islam-murajaat}."
  es: "El manual sunita moderno más venerable de respuesta sistemática al chiismo: el erudito indio [[person/shah-abdul-aziz-dehlawi|Shah Abdul Aziz Dehlawi]] compuso Tuhfa Ithna Ashariyya en persa, examinando la doctrina duodecimana punto por punto; Mahmud Shukri al-Alusi lo abrevió posteriormente al árabe, donde se convirtió en la primera referencia de los debatientes sunitas contemporáneos sobre el Imamato, los Compañeros y lo invisible {cite:al-islam-murajaat}."
  fr: "Le manuel sunnite moderne le plus vénérable de réponse systématique au chiisme: le savant indien [[person/shah-abdul-aziz-dehlawi|Shah Abdul Aziz Dehlawi]] a composé Tuhfa Ithna Ashariyya en persan, examinant la doctrine duodécimaine point par point; Mahmud Shukri al-Alusi l'a ensuite abrégé en arabe, où il est devenu la première référence des débatteurs sunnites contemporains sur l'imamat, les Compagnons et l'invisible {cite:al-islam-murajaat}."
  ur: "شیعہ مذہب کو منظم جواب دینے کا سب سے قابل احترام جدید سنی کتابچہ: ہندوستانی عالم [[شخص/شاہ-عبدالعزیز دہلوی|شاہ عبدالعزیز دہلوی]] نے تحفہ اتھنا اشعریہ کو فارسی میں تحریر کیا، جس میں بارہویں نظریے کا نقطہ نظر سے جائزہ لیا گیا۔ محمود شکری العلوسی نے بعد میں اس کا عربی میں اختصار کیا، جہاں یہ امامت، صحابہ اور غیب پر عصر حاضر کے سنی بحث کرنے والوں کا پہلا حوالہ بن گیا۔"
  tr: "Şiiliğin sistematik reddiyesinde en eski modern Sünni metin: Hintli alim [[person/shah-abdul-aziz-dehlawi|Shah Abdulaziz Dehlawi]], Oniki İmamcı Şii inancının temellerini tartıştığı ve nokta nokta tartıştığı “Tuhfet İsna Eşariyye”yi Farsça yazmıştır. Daha sonra Mahmud Şükrü el-Alusi tarafından Arapçaya kısaltılmış ve imamet, sahabe ve gayb bilgisi (cite:al-islam-murajaat) konusunda çağdaş Sünni tartışmacılar için ilk referans haline gelmiştir."
  id: "Teks Sunni modern tertua dalam sanggahan sistematis terhadap Syi'ah: Sarjana India [[orang/shah-abdul-aziz-dehlawi|Shah Abdul Aziz Dehlawi]] menulis “Tuhfat Ithna Ashariyyah” dalam bahasa Persia, yang di dalamnya ia membahas dasar-dasar keyakinan Dua Belas Syiah dan berdebat dengannya poin demi poin. Kemudian disingkat menjadi bahasa Arab oleh Mahmoud Shukri Al-Alusi, dan menjadi referensi pertama bagi para perdebatan Sunni kontemporer mengenai topik Imamah, Sahabat, dan ilmu gaib {cite:al-islam-murajaat}."
