summary:
  ar: "أعرق متن سني حديث في الرد المنهجي على التشيع: ألّف العالِم الهندي [[person/shah-abdul-aziz-dehlawi|شاه عبد العزيز الدهلوي]] «تحفة اثنا عشرية» بالفارسية يناقش فيها أصول الاعتقاد الاثني عشري ويجادله نقطة نقطة، ثم اختصرها إلى العربية محمود شكري الآلوسي فصارت المرجع الأول للمناظرين السنة المعاصرين في باب الإمامة والصحابة وعلم الغيب {cite:al-islam-murajaat}."
  en: "The most venerable modern Sunni manual of systematic reply to Shi'ism: the Indian scholar [[person/shah-abdul-aziz-dehlawi|Shah Abdul Aziz Dehlawi]] composed Tuhfa Ithna Ashariyya in Persian, examining Twelver doctrine point by point; Mahmud Shukri al-Alusi later abridged it into Arabic, where it became the first reference of contemporary Sunni debaters on the Imamate, the Companions and the unseen {cite:al-islam-murajaat}."
  es: "El manual sunita moderno más venerable de respuesta sistemática al chiismo: el erudito indio [[person/shah-abdul-aziz-dehlawi|Shah Abdul Aziz Dehlawi]] compuso Tuhfa Ithna Ashariyya en persa, examinando la doctrina duodecimana punto por punto; Mahmud Shukri al-Alusi lo abrevió posteriormente al árabe, donde se convirtió en la primera referencia de los debatientes sunitas contemporáneos sobre el Imamato, los Compañeros y lo invisible {cite:al-islam-murajaat}."
