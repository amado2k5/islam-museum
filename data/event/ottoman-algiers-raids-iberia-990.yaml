summary:
  ar: "جهّز الوالي العثماني في الجزائر أسطوله سنة ٩٩٠هـ/١٥٨٢م لمحاربة إسبانيا فوق أرضها، فنزل المجاهدون في برشلونة فأعملوا فيها تدميراً، ثم عبروا مضيق جبل طارق وهاجموا جزر الكناري فدمروا المراكز العسكرية وغنموا ما فيها — ولم يكن الأسطول يقصد مجرد التنكيل بالأسبانيين في تغطية الصلابي {cite:dawlat-uthmaniyya-salabi p. 271-272}."
  en: "In 990/1582 the Ottoman wali of Algiers readied his fleet to fight Spain on its own soil: the mujahidun landed at Barcelona and dealt destruction, crossed the Strait of Gibraltar and struck the Canary Islands, destroying the military posts and taking their plunder — the fleet's aim, in al-Salabi's telling, went beyond merely punishing the Spaniards {cite:dawlat-uthmaniyya-salabi p. 271-272}."
