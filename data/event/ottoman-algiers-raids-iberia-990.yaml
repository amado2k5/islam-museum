label:
  ar: "غارات أسطول الجزائر على إسبانيا والكناري ⁦(٩٩٠هـ/١٥٨٢م)⁩"
  en: "Algiers fleet raids on Spain and the Canaries (990/1582)"
  es: "Incursiones de la flota argelina en España y las Islas Canarias (990/1582)"
  fr: "Les raids de la flotte d'Alger sur l'Espagne et les Canaries (990/1582)"
  ur: "اسپین اور کینریز پر الجزائر کے بحری بیڑے کے حملے (990/1582)"
  tr: "Cezayir donanmasının İspanya ve Kanarya Adaları'na düzenlediği baskınlar (990 Hicri/1582 Miladi)"
  id: "Serangan armada Aljazair ke Spanyol dan Kepulauan Canary (990 AH/1582 M)"
summary:
  ar: "جهّز الوالي العثماني في الجزائر أسطوله سنة ٩٩٠هـ/١٥٨٢م لمحاربة إسبانيا فوق أرضها، فنزل المجاهدون في برشلونة فأعملوا فيها تدميراً، ثم عبروا مضيق جبل طارق وهاجموا جزر الكناري فدمروا المراكز العسكرية وغنموا ما فيها — ولم يكن الأسطول يقصد مجرد التنكيل بالأسبانيين في تغطية الصلابي {cite:dawlat-uthmaniyya-salabi p. 271-272}."
  en: "In 990/1582 the Ottoman wali of Algiers readied his fleet to fight Spain on its own soil: the mujahidun landed at Barcelona and dealt destruction, crossed the Strait of Gibraltar and struck the Canary Islands, destroying the military posts and taking their plunder — the fleet's aim, in al-Salabi's telling, went beyond merely punishing the Spaniards {cite:dawlat-uthmaniyya-salabi p. 271-272}."
  es: "En 990/1582, el wali otomano de Argel preparó su flota para luchar contra España en su propio territorio: los muyahidines desembarcaron en Barcelona y causaron destrucción, cruzaron el estrecho de Gibraltar y atacaron las Islas Canarias, destruyendo los puestos militares y saqueándolos; el objetivo de la flota, según el relato de al-Salabi, iba más allá de simplemente castigar a los españoles {cite:dawlat-uthmaniyya-salabi p. 271-272}."
  fr: "En 990/1582, le wali ottoman d'Alger prépara sa flotte à combattre l'Espagne sur son propre sol: les moudjahidines débarquèrent à Barcelone et semèrent la destruction, traversèrent le détroit de Gibraltar et frappèrent les îles Canaries, détruisant les postes militaires et s'emparant de leur butin — l'objectif de la flotte, selon le récit d'al-Salabi, allait au-delà de la simple punition des Espagnols {cite:dawlat-uthmaniyya-salabi p. 271-272}."
  ur: "990/1582 میں الجزائر کے عثمانی ولی نے اپنی سرزمین پر اسپین سے لڑنے کے لیے اپنے بیڑے کو تیار کیا: مجاہدین بارسلونا میں اترے اور تباہی مچائی، آبنائے جبرالٹر کو عبور کیا اور کینری جزیروں پر حملہ کیا، فوجی چوکیوں کو تباہ کیا اور ان کا لوٹ مار لیا - یہ بحری بیڑا مجھے بتا رہا ہے، ہسپانویوں کو سزا دینا {حوالہ:دولت عثمانیہ صلابی صفحہ 271-272}۔"
  tr: "Cezayir'deki Osmanlı valisi, 990 Hicri/1582 Miladi yılında İspanya'yla kendi topraklarında savaşmak için filosunu hazırladı. Mücahitler Barselona'ya çıkarma yaparak orada büyük bir yıkıma yol açtılar. Ardından Cebelitarık Boğazı'nı geçerek Kanarya Adaları'na saldırdılar, askeri merkezleri yok ettiler ve içlerindeki her şeyi ele geçirdiler. Filo, sadece El-Salabi'nin (dawlat-uthmaniyya-salabi s. 271-272) örtüsü altında İspanyolları cezalandırmakla yetinmedi."
  id: "Gubernur Ottoman di Aljazair mempersiapkan armadanya pada tahun 990 H/1582 M untuk melawan Spanyol di tanah mereka sendiri. Mujahidin mendarat di Barcelona dan menimbulkan kekacauan di sana. Kemudian mereka menyeberangi Selat Gibraltar dan menyerang Kepulauan Canary, menghancurkan pusat-pusat militer dan mengambil apa yang ada di dalamnya. Armada tersebut tidak hanya bermaksud untuk menghukum Spanyol dengan kedok Al-Salabi {cite:dawlat-uthmaniyya-salabi p. 271-272}."
