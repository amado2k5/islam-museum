label: { ar: "بيعة الحسن بن علي", en: "Bay'a of al-Hasan ibn Ali", fr: "La bay'a d'al-Hasan ibn Ali", es: "Bay'a de al-Hasan ibn Ali" }
summary:
  ar: "بويع الحسن بن علي بالخلافة في سنة أربعين. وقيل إن أول من بايعه قيس بن سعد، فقال له: ابسط يدك أبايعك على كتاب الله وسنة نبيه، فاشترط الحسن أن يكون ذلك على كتاب الله وسنة نبيه، فبايعه وبايعه الناس {cite:tabari-tarikh-abu-al-fadl j.5 p.158}."
  en: "Al-Hasan ibn Ali was given the caliphate in the year 40 AH. It is said that the first to pledge to him was Qays ibn Sa'd, who said: extend your hand, and I will pledge to you on the Book of God and the Sunna of His Prophet. Al-Hasan stipulated that it be on the Book of God and the Sunna of His Prophet; so he pledged, and the people pledged {cite:tabari-tarikh-abu-al-fadl j.5 p.158}."
  fr: "Al-Hasan ibn Ali reçut le califat en l'an 40 H. On dit que le premier à lui prêter allégeance fut Qays ibn Sa'd, qui dit : tends ta main, et je te prêterai allégeance sur le Livre de Dieu et la Sunna de Son Prophète. Al-Hasan posa pour condition que ce soit sur le Livre de Dieu et la Sunna de Son Prophète ; il prêta donc allégeance, et les gens prêtèrent allégeance {cite:tabari-tarikh-abu-al-fadl j.5 p.158}."
  es: "Al-Hasan ibn Ali recibió el califato en el año 40 AH. Se dice que el primero en jurarle lealtad fue Qays ibn Sa'd, quien dijo: «Extiende tu mano y te juraré lealtad sobre el Libro de Dios y la Sunna de Su Profeta». Al-Hasan estipuló que fuera sobre el Libro de Dios y la Sunna de Su Profeta; así que juró, y el pueblo juró. {cita:tabari-tarikh-abu-al-fadl j.5 p.158}."
