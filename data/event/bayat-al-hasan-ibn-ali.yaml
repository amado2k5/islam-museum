label: { ar: "بيعة الحسن بن علي", en: "Bay'a of al-Hasan ibn Ali" }
summary:
  ar: "بويع الحسن بن علي بالخلافة في سنة أربعين. وقيل إن أول من بايعه قيس بن سعد، فقال له: ابسط يدك أبايعك على كتاب الله وسنة نبيه، فاشترط الحسن أن يكون ذلك على كتاب الله وسنة نبيه، فبايعه وبايعه الناس {cite:tabari-tarikh-abu-al-fadl j.5 p.158}."
  en: "Al-Hasan ibn Ali was given the caliphate in the year 40 AH. It is said that the first to pledge to him was Qays ibn Sa'd, who said: extend your hand, and I will pledge to you on the Book of God and the Sunna of His Prophet. Al-Hasan stipulated that it be on the Book of God and the Sunna of His Prophet; so he pledged, and the people pledged {cite:tabari-tarikh-abu-al-fadl j.5 p.158}."
