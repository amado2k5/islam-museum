label: { ar: "غارة الفرنج على بحر عيذاب وساحل الحجاز", en: "The Frankish raid on the Red Sea and the Hijaz coast at 'Aydhab" }
summary:
  ar: "في سنة ثمان وسبعين وخمسمائة عمل البرنس أرناط صاحب الكرك أسطولاً فُرّغ منه بالكرك قطعاً فحُمل إلى بحر أيلة وجُمع في أسرع وقت وشُحن بالمقاتلة، فساروا في البحر فرقتين: فرقة قامت على حصن أيلة تحصرونه وتمنع أهله من ردود الماء فنالهم ضيق شديد، والثانية سارت نحو عيذاب فأفسدت في السواحل ونهبت وأخذت ما وجدت من المراكب الإسلامية ومن فيها من التجار، وبغتوا الناس على حين غفلة إذ لم يعهدوا بهذا البحر فرنجياً لا تاجراً ولا محارباً، وكانوا عازمين على الدخول إلى الحجاز ومكة والمدينة وأخذ الحاج ومنعهم عن البيت الحرام ثم الدخول إلى اليمن، فعمّر الملك العادل أبو بكر بن أيوب، نائب أخيه صلاح الدين بمصر، أسطولاً فيه جمع كثير مقدمهم حسام الدين لؤلؤ الحاجب متولي الأسطول، فانقض على أهل أيلة انقضاض العقاب فقتل بعضهم وأسر الباقين، ثم سار يقص أثر من قصدوا عيذاب حتى بلغ رابغ فأدركهم بساحل الجوزاء، فلما رأوا الهلاك خرجوا إلى البر واعتصموا بالشعاب فنزل إليهم لؤلؤ وقاتلهم وأخذ خيلاً من الأعراب فقاتلهم فرسانه ورجاله فظفر بهم وقتل أكثرهم وأسر الباقين، وأُرسل بعضهم إلى منى فنحروا بها عقوبة لمن رام إخافة حرم الله، وعاد بالباقين إلى مصر فقُتلوا جميعاً {cite:kamil-ibn-al-athir p. 117-118}."
  en: "In 578 Prince Arnat, lord of Karak, had a fleet built in sections at Karak and carried to the sea of Ayla; it was assembled with great speed and loaded with fighters. They sailed in two groups. One laid siege to the fort of Ayla, preventing its people from reaching the water, and severe hardship befell them. The other sailed toward 'Aydhab, ravaged the coasts, and seized the Muslim ships it found with the merchants aboard, falling on people unawares, since they had never known a Frank on that sea, neither merchant nor warrior. They meant to enter the Hijaz, Mecca and Medina, seize the pilgrims and bar them from the Sacred House, and then enter Yemen. Al-Malik al-'Adil Abu Bakr ibn Ayyub, his brother Salah al-Din's deputy in Egypt, equipped a fleet with a large force, whose commander was Husam al-Din Lu'lu' the chamberlain, in charge of the fleet. He swooped on the people of Ayla like an eagle, killed some and captured the rest. He then followed the trail of those bound for 'Aydhab until he reached Rabigh and caught them on the Jawza coast. When they saw their doom, they went ashore and took refuge in the ravines. Lu'lu' came down upon them and fought them, and took Arab horsemen; his cavalry and infantry fought them, won, killed most of them and captured the rest. Some were sent to Mina and slaughtered there as a punishment for anyone who sought to frighten the Sacred Precinct of God. He returned with the remainder to Egypt, where they were all put to death {cite:kamil-ibn-al-athir p. 117-118}."
