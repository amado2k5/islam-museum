summary:
  ar: "في سابع عشر شعبان سنة واحدة وستمائة جرت فتنة ببغداد بين أهل باب الأزج وأهل المأمونية، سببها أن أهل باب الأزج قتلوا سبعاً وأرادوا أن يطوفوا به فمنعهم أهل المأمونية فاقتتلوا عند البستان الكبير فجرح خلق وقتل جماعة؛ وفي العشرين منه فتنة بين أهل قطفتا والقرية لسبب قتل سبع آخر منعهم أهل القرية أن يجروا به عندهم؛ وفي تاسع رمضان فتنة بين أهل سوق السلطان والجعفرية لاختصام رجلين من المحلتين فاقتتلوا في مقبرة الجعفرية؛ فلما كثرت الفتن رتب الديوان أميراً كبيراً من مماليك الخليفة ومعه جماعة كثيرة فطاف في البلد وقتل جماعة ممن فيه شبهة فسكن الناس {cite:kamil-ibn-al-athir p. 297-298}."
  en: "601: Baghdad's quarters went to war over dead lions — Bab al-Azj's people killed a lion and meant to parade it triumphantly; the Ma'muniyya barred the procession and swords came out at the Great Orchard. Another lion sparked Qattafa against al-Qariyya; a quarrel set Suq al-Sultan against al-Ja'fariyya in the cemetery — until a great caliphal mamluk patrolled the city killing suspects and the quarters quieted {cite:kamil-ibn-al-athir p. 297-298}."
