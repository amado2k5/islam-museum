label: { ar: "فتن محلات بغداد سنة 601", en: "Baghdad's quarter-wars of 601 AH", fr: "Les guerres de quartiers de Bagdad en 601 H", es: "Las guerras de Bagdad del año 601 AH", ur: "بغداد کی سہ ماہی جنگیں 601ھ" }
summary:
  ar: "في سابع عشر شعبان سنة واحدة وستمائة جرت فتنة ببغداد بين أهل باب الأزج وأهل المأمونية، سببها أن أهل باب الأزج قتلوا سبعاً وأرادوا أن يطوفوا به فمنعهم أهل المأمونية فاقتتلوا عند البستان الكبير فجرح خلق وقتل جماعة؛ وفي العشرين منه فتنة بين أهل قطفتا والقرية لسبب قتل سبع آخر منعهم أهل القرية أن يجروا به عندهم؛ وفي تاسع رمضان فتنة بين أهل سوق السلطان والجعفرية لاختصام رجلين من المحلتين فاقتتلوا في مقبرة الجعفرية؛ فلما كثرت الفتن رتب الديوان أميراً كبيراً من مماليك الخليفة ومعه جماعة كثيرة فطاف في البلد وقتل جماعة ممن فيه شبهة فسكن الناس {cite:kamil-ibn-al-athir p. 297-298}."
  en: "601: Baghdad's quarters went to war over dead lions — Bab al-Azj's people killed a lion and meant to parade it triumphantly; the Ma'muniyya barred the procession and swords came out at the Great Orchard. Another lion sparked Qattafa against al-Qariyya; a quarrel set Suq al-Sultan against al-Ja'fariyya in the cemetery — until a great caliphal mamluk patrolled the city killing suspects and the quarters quieted {cite:kamil-ibn-al-athir p. 297-298}."
  fr: "601 : les quartiers de Bagdad entrèrent en guerre pour des lions morts ; les gens de Bab al-Azj tuèrent un lion et voulurent le promener en triomphe ; la Ma'muniyya barra la procession et les sabres sortirent au Grand Verger. Un autre lion dressa Qattafa contre al-Qariyya ; une querelle opposa Suq al-Sultan à al-Ja'fariyya dans le cimetière, jusqu'à ce qu'un grand mamelouk du calife patrouille la ville en tuant les suspects et que les quartiers se calment {cite:kamil-ibn-al-athir p. 297-298}."
  es: "601: Los barrios de Bagdad se enfrentaron por leones muertos: la gente de Bab al-Azj mató a un león y pretendía exhibirlo triunfalmente; los Ma'muniyya impidieron la procesión y se desenvainaron espadas en el Gran Huerto. Otro león provocó la guerra entre Qattafa y al-Qariyya; una disputa enfrentó a Suq al-Sultan con al-Ja'fariyya en el cementerio, hasta que un gran califa mameluco patrulló la ciudad matando a sospechosos y los barrios se calmaron {cite:kamil-ibn-al-athir p. 297-298}."
  ur: "601: بغداد کے حلقوں میں مردہ شیروں کے خلاف جنگ شروع ہو گئی - باب العج کے لوگوں نے ایک شیر کو مار ڈالا اور اس کا مقصد فاتحانہ پریڈ کرنا تھا۔ مامونیہ نے جلوس کو روک دیا اور عظیم باغ میں تلواریں نکل آئیں۔ ایک اور شیر نے قطفہ کو القاریہ کے خلاف بھڑکا دیا۔ ایک جھگڑے نے سق السلطان کو الجعفریہ کے خلاف قبرستان میں کھڑا کر دیا - یہاں تک کہ ایک عظیم خلیفہ مملوک نے شہر میں گشت کر کے مشتبہ افراد کو قتل کر دیا اور کوارٹرز خاموش ہو گئے۔ 297-298}۔"
