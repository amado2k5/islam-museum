label: { ar: "أسر المسترشد وقتله بمراغة" }
summary:
  ar: "وقعت بين الخليفة المسترشد والسلطان مسعود بن محمد وحشة فخرج لقتاله فالتقى الجمعان وغدر بالخليفة أكثر عسكره فظفر به مسعود وأسر الخليفة وخواصه فحبسهم بقلعة بقرب همدان فبلغ أهل بغداد ذلك فحثوا في الأسواق على رؤوسهم التراب وبكوا وضجوا وخرج النساء حاسرات يندبن الخليفة ومنعوا الصلوات والخطبة، وأرسل السلطان سنجر إلى ابن أخيه مسعود يأمره بإعادة الخليفة ذاكراً ما ظهر من الآيات السماوية والأرضية فقبل مسعود الأرض بين يدي الخليفة، ثم جاء في عسكر سنجر سبعة عشر من الباطنية فذكر أن مسعوداً ما علم بهم وقيل بل هو الذي دسهم فهجموا على الخليفة في مخيمه ففتكوا به وقتلوا معه جماعة من أصحابه فأخذوهم وقتلوهم، وكان قتل المسترشد بمراغة يوم الخميس سادس عشر ذي القعدة سنة تسع وعشرين وخمس مئة وخرج أهل بغداد حفاة مخرقين الثياب والنساء ناشرات الشعور يلطمن ويقلن المراثي لأن المسترشد كان محبباً فيهم لما فيه من الشجاعة والعدل والرفق {cite:tarikh-khulafa-minhaj-1434 p. 664-665}."
  en: "Al-Mustarshid marched on sultan Mas'ud; most of his army betrayed him and he was taken to a fortress near Hamadan. Baghdad put dust on its heads, the women went out unveiled keening, prayers and the khutba were suspended — and Sanjar wrote his nephew Mas'ud of the heavenly and earthly signs, ordering the caliph restored; Mas'ud kissed the ground before him. Then seventeen Batiniyya in Sanjar's escort — sent, it was said, without Mas'ud's knowledge, though some say he planted them — fell on the caliph in his camp and slaughtered him with his companions at Maragha, Thursday 16 Dhu'l-Qa'da 529; Baghdad came out barefoot with torn clothes {cite:tarikh-khulafa-minhaj-1434 p. 664-665}."
