label: { ar: "أسر المسترشد وقتله بمراغة", en: "Capture and killing of al-Mustarshid at Maragha", es: "Captura y muerte de al-Mustarshid en Maragha.", fr: "Capture et mise à mort d'al-Mustarshid à Maragha", ur: "مراثہ میں المسترشد کی گرفتاری اور قتل" }
summary:
  ar: "وقعت بين الخليفة المسترشد والسلطان مسعود بن محمد وحشة فخرج لقتاله فالتقى الجمعان وغدر بالخليفة أكثر عسكره فظفر به مسعود وأسر الخليفة وخواصه فحبسهم بقلعة بقرب همدان فبلغ أهل بغداد ذلك فحثوا في الأسواق على رؤوسهم التراب وبكوا وضجوا وخرج النساء حاسرات يندبن الخليفة ومنعوا الصلوات والخطبة، وأرسل السلطان سنجر إلى ابن أخيه مسعود يأمره بإعادة الخليفة ذاكراً ما ظهر من الآيات السماوية والأرضية فقبل مسعود الأرض بين يدي الخليفة، ثم جاء في عسكر سنجر سبعة عشر من الباطنية فذكر أن مسعوداً ما علم بهم وقيل بل هو الذي دسهم فهجموا على الخليفة في مخيمه ففتكوا به وقتلوا معه جماعة من أصحابه فأخذوهم وقتلوهم، وكان قتل المسترشد بمراغة يوم الخميس سادس عشر ذي القعدة سنة تسع وعشرين وخمس مئة وخرج أهل بغداد حفاة مخرقين الثياب والنساء ناشرات الشعور يلطمن ويقلن المراثي لأن المسترشد كان محبباً فيهم لما فيه من الشجاعة والعدل والرفق {cite:tarikh-khulafa-minhaj-1434 p. 664-665}."
  en: "Al-Mustarshid marched on sultan Mas'ud; most of his army betrayed him and he was taken to a fortress near Hamadan. Baghdad put dust on its heads, the women went out unveiled keening, prayers and the khutba were suspended — and Sanjar wrote his nephew Mas'ud of the heavenly and earthly signs, ordering the caliph restored; Mas'ud kissed the ground before him. Then seventeen Batiniyya in Sanjar's escort — sent, it was said, without Mas'ud's knowledge, though some say he planted them — fell on the caliph in his camp and slaughtered him with his companions at Maragha, Thursday 16 Dhu'l-Qa'da 529; Baghdad came out barefoot with torn clothes {cite:tarikh-khulafa-minhaj-1434 p. 664-665}."
  es: "Al-Mustarshid marchó contra el sultán Mas'ud; la mayor parte de su ejército lo traicionó y fue llevado a una fortaleza cerca de Hamadán. Bagdad se cubrió de polvo, las mujeres salieron sin velo lamentándose, las oraciones y la jutba fueron suspendidas, y Sanjar escribió a su sobrino Mas'ud sobre las señales celestiales y terrenales, ordenando la restauración del califa; Mas'ud besó el suelo ante él. Entonces, diecisiete Batiniyya en la escolta de Sanjar —enviados, según se dice, sin el conocimiento de Mas'ud, aunque algunos dicen que él los plantó— atacaron al califa en su campamento y lo masacraron junto con sus compañeros en Maragha, el jueves 16 de Dhu'l-Qa'da de 529; Bagdad salió descalza con la ropa desgarrada {cite:tarikh-khulafa-minhaj-1434 p. 664-665}."
  fr: "Al-Mustarshid marcha sur le sultan Mas'ud; la majeure partie de son armée le trahit et il fut emmené dans une forteresse près d'Hamadan. Bagdad recouvrit la tête de ses hommes de poussière, les femmes sortirent le visage dévoilé en gémissant, les prières et le sermon furent suspendus – et Sanjar écrivit à son neveu Mas'ud des signes célestes et terrestres, ordonnant la restauration du calife; Mas'ud baisa le sol devant lui. Puis dix-sept Batiniyya de l'escorte de Sanjar – envoyés, disait-on, à l'insu de Mas'ud, bien que certains prétendent qu'il les ait placés là – attaquèrent le calife dans son camp et le massacrèrent avec ses compagnons à Maragha, le jeudi 16 Dhu'l-Qa'da 529; Bagdad sortit pieds nus et vêtu de haillons {cite:tarikh-khulafa-minhaj-1434 p. 664-665}."
  ur: "المسترشد نے سلطان مسعود پر چڑھائی کی۔ اس کی زیادہ تر فوج نے اسے دھوکہ دیا اور اسے ہمدان کے قریب ایک قلعے میں لے جایا گیا۔ بغداد نے اپنے سروں پر مٹی ڈال دی، عورتیں بے پردہ ہو کر باہر نکلیں، نمازیں اور خطبہ معطل کر دیا گیا — اور سنجر نے اپنے بھتیجے مسعود کو آسمانی اور زمینی نشانات لکھ کر خلیفہ کو بحال کرنے کا حکم دیا۔ مسعود نے اس کے سامنے زمین کو بوسہ دیا۔ پھر سنجر کے دستے میں سترہ بطنیہ بھیجے گئے، یہ کہا گیا، مسعود کے علم کے بغیر، اگرچہ بعض کہتے ہیں کہ اس نے انہیں لگایا تھا- خلیفہ پر اس کے کیمپ میں گرے اور اسے مرغا میں اپنے ساتھیوں کے ساتھ ذبح کر دیا، جمعرات 16 ذوالقعدہ 529؛ بغداد پھٹے ہوئے کپڑوں کے ساتھ ننگے پاؤں نکلا 664-665}۔"
