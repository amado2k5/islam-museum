id: event/abbad-qandahar
class: event
kind: conquest
label: { ar: "فتح عباد بن زياد قندهار والقلانس العبادية", en: "Abbad ibn Ziyad's Qandahar and the 'Abbadiyya Caps", fr: "Qandahar d’Abbad ibn Ziyad et les bonnets « abbadiyya »", es: "Qandahar de Abbad ibn Ziyad y los gorros 'Abbadiyya", ur: "عباد بن زیاد کا قندھار اور عبادیہ ٹوپیاں", tr: "Abbad ibn Ziyad, Kandahar'ı ve Abbadit kalelerini fethetti.", id: "Abbad ibn Ziyad menaklukkan Kandahar dan wilayah kekuasaan Abbasiyah." }
summary:
  ar: "غزا عباد بن زياد ثغر الهند من سجستان فأتى سناروذ ثم أخذ على حوى كهر إلى الروذبار من أرض سجستان إلى المندمند فنزل كش وقطع المفازة حتى أتى القندهار فقاتل أهلها فهزمهم وفلهم وفتحها بعد أن أصيب رجال من المسلمين ورأى قلانس أهلها طوالاً فعمل على مثالها فسميت العبادية وقال ابن مفرغ كم بالروم وأرض الهند من قدم ومن سراينك قتلى لاهم قبروا بقدهار ومن تكتب منيته بقندهار يرجم دونه الخبر."
  en: "Abbad ibn Ziyad raided from Sijistan — Sanarudh, Kish, across the mafaza — and took Qandahar after hard fighting and Muslim dead; seeing the folk's tall caps he had them copied, whence the 'Abbadiyya — and Ibn Mufarrigh's line: 'how many a corpse of your troops by Qandahar unburied'."
  fr: "Abbad ibn Ziyad mena une expédition depuis le Sijistan — Sanarudh, Kish, puis à travers le désert — et prit Qandahar après de durs combats et des pertes musulmanes ; voyant les hauts bonnets des habitants, il les fit copier, d’où le nom « abbadiyya ». Ibn Mufarrigh écrivit ce vers : « Combien de cadavres de tes soldats près de Qandahar sans sépulture »."
  es: "Abbad ibn Ziyad realizó incursiones desde Sijistan —Sanarudh, Kish, al otro lado de la mafaza— y tomó Qandahar después de duros combates y muertos musulmanes; al ver los altos gorros de la gente, los mandó copiar, de donde proviene el 'Abbadiyya' —y la frase de Ibn Mufarrigh: 'cuántos cadáveres de tus tropas quedaron sin enterrar en Qandahar'."
  ur: "عباد بن زیاد نے سجستان سے چھاپہ مارا — سنارودھ، کیش، مفازہ کے اس پار — اور سخت لڑائی اور مسلمانوں کی ہلاکت کے بعد قندھار پر قبضہ کر لیا۔ لوگوں کی لمبی ٹوپیوں کو دیکھ کر اس نے ان کی نقل کی تھی، جہاں سے 'عبادیہ - اور ابن مفرج کی سطر: 'قندھار کے پاس آپ کی فوج کی کتنی لاشیں بے دفن ہیں'۔"
  tr: "Abbad ibn Ziyad, Sijistan'dan Hindistan sınırına saldırdı, böylece Sanarudh'a geldi, sonra Hawa Kahr'dan Rudhbar'a, Sijistan topraklarından Al-Mandamand'a geçti, sonra Kaş'a indi ve çölü geçerek Kandahar'a ulaştı, oradaki insanlarla savaştı, onları yendi ve bazı Müslümanların yaralanmasından sonra şehri fethetti. Halkının şapkalarının uzun olduğunu görünce, kendisi de onlar gibi bir şapka yaptı, böylece şehre Al-Abadiyya adı verildi. İbn Mufarrij şöyle dedi: Romalıların ve Hindistan topraklarının kaçı sizin Saraynanızdan gelmiş, öldürülmüş, ama Kandahar'a gömülmüş ve ölüm haberi Kandahar'da yazılı olan kimse için haber gönderilmiştir."
  id: "Abbad ibn Ziyad menyerbu perbatasan India dari Sijistan, lalu ia sampai di Sanarudh, kemudian ia pergi ke Hawa Kahr ke Rudhbar dari tanah Sijistan ke Al-Mandamand, lalu ia turun ke Kash dan menyeberangi gurun sampai ia sampai di Kandahar, lalu ia berperang melawan penduduknya dan mengalahkan mereka serta menaklukkannya setelah beberapa orang Muslim terluka. Ia melihat bahwa topi penduduknya tinggi, lalu ia membuat topi yang serupa, sehingga tempat itu disebut Al-Abadiyya. Ibn Mufarrij berkata: Berapa banyak orang di Romawi dan tanah India yang datang dan berasal dari Sarayna-mu, terbunuh, tetapi mereka dimakamkan di Kandahar, dan siapa pun yang kematiannya tercatat di Kandahar, beritanya akan dikirimkan kepadanya."
