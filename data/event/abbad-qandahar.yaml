summary:
  ar: "غزا عباد بن زياد ثغر الهند من سجستان فأتى سناروذ ثم أخذ على حوى كهر إلى الروذبار من أرض سجستان إلى المندمند فنزل كش وقطع المفازة حتى أتى القندهار فقاتل أهلها فهزمهم وفلهم وفتحها بعد أن أصيب رجال من المسلمين ورأى قلانس أهلها طوالاً فعمل على مثالها فسميت العبادية وقال ابن مفرغ كم بالروم وأرض الهند من قدم ومن سراينك قتلى لاهم قبروا بقدهار ومن تكتب منيته بقندهار يرجم دونه الخبر."
  en: "Abbad ibn Ziyad raided from Sijistan — Sanarudh, Kish, across the mafaza — and took Qandahar after hard fighting and Muslim dead; seeing the folk's tall caps he had them copied, whence the 'Abbadiyya — and Ibn Mufarrigh's line: 'how many a corpse of your troops by Qandahar unburied'."
