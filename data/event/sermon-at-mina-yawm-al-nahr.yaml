label: { en: "The sermon of the Day of Sacrifice at Mina", ar: "خطبة يوم النحر بمنى" }
summary:
  en: "On 10 Dhu al-Hijja the Prophet preached at Mina mounted on a grey mule while Ali relayed his words: time has come full circle as on the day of creation; the sacred months are four; blood, property and honour are inviolable; and let the witness inform the absent."
  ar: "خطب النبي يوم النحر بمنى وهو على بغلة شهباء وعلي يعبر عنه: إن الزمان قد استدار كهيئته يوم خلق السماوات والأرض، والأشهر الحرم أربعة، ودماءكم وأموالكم وأعراضكم عليكم حرام، وليبلغ الشاهد الغائب."
