label: { en: "The sermon of the Day of Sacrifice at Mina", ar: "خطبة يوم النحر بمنى", es: "El sermón del Día del Sacrificio en Mina", fr: "Le sermon du Jour du Sacrifice à Mina", ur: "منیٰ میں یوم قربانی کا خطبہ", tr: "Mina'da Kurban Günü Vaazı", id: "Khutbah pada Hari Raya Kurban di Mina" }
summary:
  en: "On 10 Dhu al-Hijja the Prophet preached at Mina mounted on a grey mule while Ali relayed his words: time has come full circle as on the day of creation; the sacred months are four; blood, property and honour are inviolable; and let the witness inform the absent."
  ar: "خطب النبي يوم النحر بمنى وهو على بغلة شهباء وعلي يعبر عنه: إن الزمان قد استدار كهيئته يوم خلق السماوات والأرض، والأشهر الحرم أربعة، ودماءكم وأموالكم وأعراضكم عليكم حرام، وليبلغ الشاهد الغائب."
  es: "El 10 de Dhu al-Hijja, el Profeta predicó en Mina montado en una mula gris, mientras Ali transmitía sus palabras: el tiempo ha completado un ciclo como en el día de la creación; los meses sagrados son cuatro; la sangre, la propiedad y el honor son inviolables; y que el testigo informe al ausente."
  fr: "Le 10 Dhu al-Hijja, le Prophète prêcha à Mina, monté sur une mule grise, tandis qu'Ali relayait ses paroles: le temps a bouclé la boucle comme au jour de la création; les mois sacrés sont au nombre de quatre; le sang, les biens et l'honneur sont inviolables; et que le témoin informe l'absent."
  ur: "10 ذی الحجہ کو نبی نے منیٰ میں ایک سرمئی خچر پر سوار ہو کر تبلیغ کی جب کہ علی نے اپنے الفاظ بیان کیے: تخلیق کے دن کی طرح وقت پورا ہو گیا ہے۔ حرمت والے مہینے چار ہیں۔ خون، جائیداد اور عزت ناقابل تسخیر ہیں۔ اور گواہ کو غائب ہونے کی اطلاع دیں۔"
  tr: "Peygamberimiz, Kurban Bayramı günü Mina'da gri bir katır üzerinde hutbe verdi ve Ali onun adına şöyle iletti: \"Zaman, göklerin ve yerin yaratıldığı günkü haline geri döndü. Kutsal aylar dört tanedir ve kanınız, malınız ve şerefiniz sizin için kutsaldır. Burada bulunan, bulunmayana haber versin.\""
  id: "Nabi Muhammad SAW menyampaikan khutbah pada Hari Raya Kurban di Mina sambil menunggangi seekor keledai abu-abu, dan Ali menyampaikannya atas nama beliau: Waktu telah berputar penuh kembali ke keadaan pada hari langit dan bumi diciptakan. Bulan-bulan suci ada empat, dan darahmu, hartamu, dan kehormatanmu adalah suci bagimu. Hendaklah orang yang hadir memberitahukan kepada orang yang tidak hadir."
