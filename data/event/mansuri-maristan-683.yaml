id: event/mansuri-maristan-683
class: event
kind: founding
label:
  ar: "استكمال المارستان المنصوري بالقاهرة، ٦٨٣هـ"
  en: "Completion of the Mansuri maristan in Cairo, 683/1284"
  ur: "قاہرہ میں مارستانِ منصوری کا تکمّل، 683ھ/1284ء"
summary:
  ar: "أُتمّ بالقاهرة بناء المارستان المنصوري الذي وقفه السلطان الملك المنصور قلاوون سنة ٦٨٣هـ {cite:encyclopaedia-of-islam-2 vol. 3 p. 897}؛ وكان ابن النفيس قد انتهت إليه رياسة الطب بالديار المصرية، فلما توفي بعد ذلك بأربع سنين وقف داره وأملاكه وكتبه على هذا المارستان {cite:tarikh-islam-dhahabi s.a. 687 p. 312} {cite:shadharat-dhahab p. 402}."
  en: "In 683/1284 the Mansuri hospital endowed by sultan al-Malik al-Mansur Qalawun was completed in Cairo {cite:encyclopaedia-of-islam-2 vol. 3 p. 897}. Ibn al-Nafis, to whom the headship of medicine in Egypt had come, died four years later leaving his house, fortune and books as an endowment to this maristan {cite:tarikh-islam-dhahabi s.a. 687 p. 312} {cite:shadharat-dhahab p. 402}."
  ur: "683ھ/1284ء میں قاہرہ میں سلطان الملک المنصور قلاوون کے وقف کردہ مارستانِ منصوری کی تکمیل ہوئی {cite:encyclopaedia-of-islam-2 vol. 3 p. 897}۔ ابن نفیس، جن کے پاس مصر میں طب کی ریاست منتج ہوئی تھی، چار سال بعد انتقال کر گئے اور اپنا گھر، جائیداد اور کتب اسی مارستان پر وقف کر دیے {cite:tarikh-islam-dhahabi s.a. 687 p. 312} {cite:shadharat-dhahab p. 402}۔"
