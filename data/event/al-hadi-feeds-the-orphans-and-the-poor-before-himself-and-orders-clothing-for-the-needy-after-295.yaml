id: "event/al-hadi-feeds-the-orphans-and-the-poor-before-himself-and-orders-clothing-for-the-needy-after-295"
class: event
kind: other
label:
  ar: "الهادي يطعم الأيتام والمساكين قبل نفسه ويأمر بكسوة المحتاجين، بعد 295هـ، ص387-388"
  en: "Al-Hadi feeds the orphans and the poor before himself and orders clothing for the needy, after 295 AH, pp. 387-388"
  ur: "ہادی یتیموں اور مسکینوں کو خود کھانے سے پہلے کھلاتا اور ضرورت مندوں کے لیے کپڑوں کا حکم دیتا ہے، 295ھ کے بعد، ص387-388"
  es: "Al-Hadi alimenta a los huérfanos y a los pobres antes que a sí mismo y ordena que se les dé ropa a los necesitados, después del año 295 de la Hégira, págs. 387-388."
summary:
  ar: "كان الهادي يطعم الأيتام والمساكين قبل أن يأكل، ويأمر صاحب بيت المال بإطعام الطوافين والزمنى، ويأمر بكسوة الناس في كل وقت."
  en: "Al-Hadi fed the orphans and the poor before eating himself, ordered the treasurer to feed wayfarers and the disabled, and ordered clothing for people in every season."
  ur: "ہادی خود کھانے سے پہلے یتیموں اور مسکینوں کو کھلاتا، خزانچی کو راہگیروں اور معذوروں کو کھانا دینے کا حکم دیتا، اور ہر موسم میں لوگوں کو کپڑے دینے کا حکم کرتا تھا۔"
  es: "Al-Hadi alimentaba a los huérfanos y a los pobres antes de comer él mismo, ordenaba al tesorero que alimentara a los viajeros y a los discapacitados, y ordenaba que se proporcionara ropa a la gente para cada estación del año."
