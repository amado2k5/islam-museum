id: event/sacrifice-of-ismail
class: event
kind: other
label: { en: "The Command to Sacrifice Ismail", ar: "أمر ذبح إسماعيل", es: "La orden de sacrificar a Ismail", fr: "L'ordre de sacrifier Ismaël", ur: "اسماعیل کو قربان کرنے کا حکم" }
summary:
  en: "On one of Ibrahim’s visits to Mecca he is shown in a dream that he must sacrifice his son; father and son submit, and the son is ransomed with a great sacrifice — the trial the Quran recalls in Surat al-Saffat, and which the Raheeq narrative places before Isaac’s birth."
  ar: "في إحدى رحلات إبراهيم إلى مكة رأى في المنام أنه يذبح ابنه إسماعيل، فامتثلا جميعاً للأمر، ففُدي بذبحٍ عظيم؛ وهي البلوى التي يذكرها القرآن في سورة الصافات، ويجعلها عرض السيرة قبل ميلاد إسحاق."
  es: "En una de las visitas de Ibrahim a La Meca, se le muestra en un sueño que debe sacrificar a su hijo; padre e hijo se someten, y el hijo es rescatado con un gran sacrificio: la prueba que el Corán recuerda en la Sura al-Saffat, y que la narración de Raheeq sitúa antes del nacimiento de Isaac."
  fr: "Lors d'un de ses voyages à La Mecque, Ibrahim reçoit en rêve la vision qu'il doit sacrifier son fils; père et fils se soumettent, et le fils est racheté par un grand sacrifice — l'épreuve que le Coran rappelle dans la sourate al-Saffat, et que le récit de Raheeq place avant la naissance d'Isaac."
  ur: "ابراہیم کے مکہ کے دورے میں سے ایک پر اسے خواب میں دکھایا گیا ہے کہ وہ اپنے بیٹے کی قربانی کرے۔ باپ اور بیٹا تسلیم کرتے ہیں، اور بیٹے کو ایک عظیم قربانی کے ساتھ فدیہ دیا جاتا ہے - وہ آزمائش جو قرآن سورۃ الصفات میں یاد کرتا ہے، اور جو کہ اسحاق کی پیدائش سے پہلے رحیق بیان کرتا ہے۔"
