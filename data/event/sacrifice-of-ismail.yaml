label: { en: "The Command to Sacrifice Ismail", ar: "أمر ذبح إسماعيل" }
summary:
  en: "On one of Ibrahim’s visits to Mecca he is shown in a dream that he must sacrifice his son; father and son submit, and the son is ransomed with a great sacrifice — the trial the Quran recalls in Surat al-Saffat, and which the Raheeq narrative places before Isaac’s birth."
  ar: "في إحدى رحلات إبراهيم إلى مكة رأى في المنام أنه يذبح ابنه إسماعيل، فامتثلا جميعاً للأمر، ففُدي بذبحٍ عظيم؛ وهي البلوى التي يذكرها القرآن في سورة الصافات، ويجعلها عرض السيرة قبل ميلاد إسحاق."
