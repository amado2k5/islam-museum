label: { en: "Expedition of al-Kudr", ar: "غزوة بني سليم بالكدر", es: "Expedición de al-Kudr", fr: "Expédition d'al-Kudr", ur: "القدر کی مہم" }
summary:
  en: "An expedition of 200 Muslims led by the Prophet in Shawwal 2 AH to al-Kudr to disperse Banu Sulaym and Ghatafan gathering against Medina; the tribes scattered and Muslims captured 500 camels."
  ar: "غزوة قادها النبي في مائتي راكب في شوال 2هـ إلى قرقرة الكدر لتفريق حشود بني سليم وغطفان؛ تفرق الأعراب وغنم المسلمون خمسمائة بعير قُسمت وخُمّست."
  es: "En Shawwal del año 2 de la Hégira, el Profeta dirigió una expedición de 200 musulmanes a al-Kudr para dispersar a los Banu Sulaym y Ghatafan que se habían reunido contra Medina; las tribus se dispersaron y los musulmanes capturaron 500 camellos."
  fr: "En Shawwal 2 AH, le Prophète mena une expédition de 200 musulmans à al-Kudr pour disperser les Banu Sulaym et les Ghatafan rassemblés contre Médine; les tribus se dispersèrent et les musulmans capturèrent 500 chameaux."
  ur: "مدینہ کے خلاف بنو سلیم اور غطفان کے اجتماع کو منتشر کرنے کے لیے شوال 2 ہجری میں رسول اللہ کی قیادت میں 200 مسلمانوں کی ایک مہم القدر کی طرف روانہ ہوئی۔ قبائل بکھر گئے اور مسلمانوں نے 500 اونٹ پکڑ لیے۔"
