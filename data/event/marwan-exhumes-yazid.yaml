label: { ar: "نبش يزيد الناقص وصلبه", en: "Marwan ibn Muhammad Exhumes and Crucifies Yazid al-Naqis", es: "Marwan ibn Muhammad exhuma y crucifica a Yazid al-Naqis", fr: "Marwan ibn Muhammad exhume et crucifie Yazid al-Naqis" }
summary:
  ar: "أول ما فعل مروان بن محمد حين استوثق له الأمر في نصف صفر سنة سبع وعشرين أن أمر بنبش يزيد الناقص فأخرجه من قبره وصلبه لكونه قتل الوليد بن يزيد {cite:tarikh-khulafa-minhaj-1434 p. 412}."
  en: "Marwan ibn Muhammad's first act once power was secured in mid-Safar 127 was to order al-Naqis's exhumation: he had him taken from his grave and crucified for having killed al-Walid ibn Yazid {cite:tarikh-khulafa-minhaj-1434 p. 412}."
  es: "El primer acto de Marwan ibn Muhammad una vez que se aseguró el poder a mediados de Safar 127 fue ordenar la exhumación de al-Naqis: lo hizo sacar de su tumba y crucificar por haber matado a al-Walid ibn Yazid {cite:tarikh-khulafa-minhaj-1434 p. 412}."
  fr: "Le premier acte de Marwan ibn Muhammad une fois le pouvoir assuré au milieu du Safar 127 fut d'ordonner l'exhumation d'al-Naqis: il le fit sortir de sa tombe et crucifier pour avoir tué al-Walid ibn Yazid {cite:tarikh-khulafa-minhaj-1434 p. 412}."
