label: { ar: "وفاة الحسن بن علي", en: "Death of al-Hasan ibn Ali", es: "Muerte de al-Hasan ibn Ali", fr: "Mort d'al-Hasan ibn Ali", ur: "حسن بن علی کی وفات" }
summary:
  ar: "توفي الحسن بالمدينة مسموماً، وفي الخبر أن زوجته جعدة بنت الأشعث بن قيس سمته بعد أن دس إليها يزيد بن معاوية أن تسمه ويتزوجها، فلما مات بعثت تسأل الوفاء فقال إنا لم نرضك للحسن فنرضاك لأنفسنا؛ وكانت وفاته سنة تسع وأربعين وقيل خامس ربيع الأول سنة خمسين وقيل سنة إحدى وخمسين، وجهد به أخوه الحسين أن يخبره من سقاه فأبى وقال الله أشد نقمة إن كان الذي أظن وإلا فلا يقتل بي بريء {cite:tarikh-khulafa-minhaj-1434 p. 318}. ولما احتضر قال للحسين إن أباك استشرف لهذا الأمر فصرفه الله عنه وما أرى أن يجمع الله فينا النبوة والخلافة، وأوصى أن يدفن مع رسول الله فطلبت عائشة ذلك فقالت نعم وكرامة فمنعهم مروان فلبس الحسين ومن معه السلاح حتى رده أبو هريرة، فدفن في البقيع إلى جنب أمه {cite:tarikh-khulafa-minhaj-1434 p. 320}. وبكى مروان في جنازته فقال له الحسين أتبكيه وقد كنت تجرعه ما تجرعه فقال إني كنت أفعل ذلك إلى أحلم من هذا وأشار إلى الجبل {cite:tarikh-khulafa-minhaj-1434 p. 317}."
  en: "Hasan died at Medina poisoned — the account names his wife Ja'da bint al-Ash'ath ibn Qays, suborned by Yazid ibn Mu'awiya with a promise of marriage that he afterwards refused: 'we did not approve you for Hasan — shall we approve you for ourselves?'. His death fell in 49, or on 5 Rabi' I 50, or 51 by the variants. His brother pressed him to name his poisoner; he refused — 'if it is whom I think, God's vengeance is harsher; else let no innocent be killed for me'. On his deathbed he told Husayn that the caliphate had been turned from his father and that prophethood and caliphate would not be joined in them. He had asked Aisha for burial beside the Prophet; she consented, but Marwan barred it — Husayn and his men armed until Abu Hurayra turned him back — and he was buried in al-Baqi beside his mother. Marwan wept at his funeral; when Husayn reproached him he said 'I did that to one more forbearing than this' and pointed to the mountain {cite:tarikh-khulafa-minhaj-1434 p. 317-320}."
  es: "Hasan murió en Medina envenenado; el relato menciona a su esposa Ja'da bint al-Ash'ath ibn Qays, sobornada por Yazid ibn Mu'awiya con una promesa de matrimonio que luego rechazó: «No te aprobamos para Hasan, ¿te aprobaremos para nosotros?». Su muerte ocurrió en el año 49, o el 5 de Rabi' I 50, o 51 según las variantes. Su hermano lo presionó para que nombrara a su envenenador; él se negó: «Si es quien creo, la venganza de Dios será más severa; de lo contrario, que ningún inocente muera por mi culpa». En su lecho de muerte le dijo a Husayn que el califato había sido apartado de su padre y que la profecía y el califato no se unirían en ellos. Le había pedido a Aisha ser enterrado junto al Profeta; ella accedió, pero Marwan lo impidió; Husayn y sus hombres se armaron hasta que Abu Hurayra lo hizo retroceder, y fue enterrado en al-Baqi junto a su madre. Marwan lloró en su funeral; Cuando Husayn lo reprendió, dijo: «Yo hice eso con alguien más tolerante que este» y señaló la montaña {cite:tarikh-khulafa-minhaj-1434 p. 317-320}."
  fr: "Hasan mourut empoisonné à Médine. Le récit mentionne son épouse, Ja'da bint al-Ash'ath ibn Qays, qu'il aurait séduite par Yazid ibn Mu'awiya avec une promesse de mariage qu'il refusa par la suite: « Nous ne t'avons pas approuvée pour Hasan; t'approuverions-nous pour nous-mêmes ? ». Sa mort survint en 49, ou le 5 Rabi' 1 50, ou encore 51 selon les variantes. Son frère insista pour qu'il révèle l'identité de son empoisonneur; il refusa: « Si c'est celui que je soupçonne, la vengeance de Dieu sera plus terrible; sinon, qu'aucun innocent ne soit tué à cause de moi. » Sur son lit de mort, il confia à Husayn que le califat avait été détourné de son père et que la prophétie et le califat ne seraient plus unis en lui. Il avait demandé à Aïcha d'être enterré auprès du Prophète; elle y consentit, mais Marwan s'y opposa. Husayn et ses hommes, armés, durent attendre qu'Abu Hurayra le fasse rebrousser chemin. Il fut finalement enterré à al-Baqi, auprès de sa mère. Marwan pleura à ses funérailles. lorsque Husayn le réprimanda, il dit: « J'ai fait cela à quelqu'un de plus indulgent que celui-ci » et désigna la montagne {cite:tarikh-khulafa-minhaj-1434 p. 317-320}."
  ur: "حسن کی موت مدینہ میں زہر سے ہوئی - اس کی بیوی جادہ بنت العاشث بن قیس کا نام ہے، جسے یزید بن معاویہ نے شادی کے وعدے کے ساتھ ماتحت کیا تھا جس کے بعد اس نے انکار کر دیا تھا: 'ہم نے حسن کے لیے آپ کو منظور نہیں کیا تھا - کیا ہم آپ کو اپنے لیے منظور کریں گے؟'۔ ان کی وفات 49 میں ہوئی، یا 5 ربیع الثانی 50، یا 51 کو مختلف قسموں سے ہوئی۔ اس کے بھائی نے اس پر زور دیا کہ وہ اپنے زہر کا نام بتائے۔ اس نے انکار کر دیا - 'اگر یہ وہی ہے جسے میں سمجھتا ہوں، خدا کا انتقام زیادہ سخت ہے۔ ورنہ میرے لیے کسی بے گناہ کو قتل نہ کیا جائے۔ بستر مرگ پر اس نے حسین سے کہا کہ خلافت ان کے والد سے لے لی گئی ہے اور نبوت اور خلافت ان میں شامل نہیں ہوگی۔ اس نے عائشہ کو نبی کے پاس دفن کرنے کے لیے کہا تھا۔ اس نے رضامندی ظاہر کی، لیکن مروان نے اسے روک دیا - حسین اور اس کے آدمی مسلح تھے یہاں تک کہ ابوہریرہ نے اسے واپس کردیا - اور اسے البقی میں اس کی والدہ کے پاس دفن کیا گیا۔ مروان اپنے جنازے پر رویا۔ جب حسین نے اسے ملامت کی تو اس نے کہا کہ میں نے اس سے زیادہ تحمل کے ساتھ ایسا کیا تھا اور پہاڑ کی طرف اشارہ کیا۔ 317-320}۔"
