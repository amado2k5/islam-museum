label: { ar: "وفاة الحسن بن علي" }
summary:
  ar: "توفي الحسن بالمدينة مسموماً، وفي الخبر أن زوجته جعدة بنت الأشعث بن قيس سمته بعد أن دس إليها يزيد بن معاوية أن تسمه ويتزوجها، فلما مات بعثت تسأل الوفاء فقال إنا لم نرضك للحسن فنرضاك لأنفسنا؛ وكانت وفاته سنة تسع وأربعين وقيل خامس ربيع الأول سنة خمسين وقيل سنة إحدى وخمسين، وجهد به أخوه الحسين أن يخبره من سقاه فأبى وقال الله أشد نقمة إن كان الذي أظن وإلا فلا يقتل بي بريء {cite:tarikh-khulafa-minhaj-1434 p. 318}. ولما احتضر قال للحسين إن أباك استشرف لهذا الأمر فصرفه الله عنه وما أرى أن يجمع الله فينا النبوة والخلافة، وأوصى أن يدفن مع رسول الله فطلبت عائشة ذلك فقالت نعم وكرامة فمنعهم مروان فلبس الحسين ومن معه السلاح حتى رده أبو هريرة، فدفن في البقيع إلى جنب أمه {cite:tarikh-khulafa-minhaj-1434 p. 320}. وبكى مروان في جنازته فقال له الحسين أتبكيه وقد كنت تجرعه ما تجرعه فقال إني كنت أفعل ذلك إلى أحلم من هذا وأشار إلى الجبل {cite:tarikh-khulafa-minhaj-1434 p. 317}. ويضع الكتاب خبر وفاته في سياق سنة ست وأربعين، ويذكر أن مروان منع دفنه عند النبي وأن الحسين لبس السلاح، فدفن بالبقيع {cite:bakr-umayyad-state-1134715 p. 131} {cite:bakr-umayyad-state-1134715 p. 137-138}."
  en: "Hasan died at Medina poisoned — the account names his wife Ja'da bint al-Ash'ath ibn Qays, suborned by Yazid ibn Mu'awiya with a promise of marriage that he afterwards refused: 'we did not approve you for Hasan — shall we approve you for ourselves?'. His death fell in 49, or on 5 Rabi' I 50, or 51 by the variants. His brother pressed him to name his poisoner; he refused — 'if it is whom I think, God's vengeance is harsher; else let no innocent be killed for me'. On his deathbed he told Husayn that the caliphate had been turned from his father and that prophethood and caliphate would not be joined in them. He had asked Aisha for burial beside the Prophet; she consented, but Marwan barred it — Husayn and his men armed until Abu Hurayra turned him back — and he was buried in al-Baqi beside his mother. Marwan wept at his funeral; when Husayn reproached him he said 'I did that to one more forbearing than this' and pointed to the mountain {cite:tarikh-khulafa-minhaj-1434 p. 317-320}."
