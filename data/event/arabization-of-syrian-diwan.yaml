id: event/arabization-of-syrian-diwan
class: event
kind: law-enacted
label: { ar: "نقل ديوان الشام عن الرومية", en: "The Transfer of Syria's Diwan from Greek", es: "El traslado del Diwan de Siria desde Grecia", fr: "Le transfert du diwan syrien des mains des Grecs", ur: "شام کے دیوان کی یونانی سے منتقلی", tr: "Divan el-Şam, el-Rumiye'den alıntı yapmıştır.", id: "Diwan al-Sham mengutip dari al-Rumiyah" }
summary:
  ar: "عند البلاذري: لم يزل ديوان الشام بالرومية حتى ولي عبد الملك بن مروان فلما كانت سنة 81 أمر بنقله، وذلك أن رجلاً من كتّاب الروم احتاج أن يكتب شيئاً فلم يجد ماء فبال في الدواة فبلغ ذلك عبد الملك فأُذِم به وأمر سليمان بن سعد بنقل الديوان، فسأله أن يعينه بخراج الأردن سنة ففعل ذلك وولّاه الأردن فلم تنقضِ السنة حتى فرغ من نقله وأتى به عبد الملك فدعا بسرجون كاتبه فعرّض ذلك عليه فعمّه وخرج من عنده كئيباً فلقيه قوم من كتّاب الروم فقال «اطلبوا المعيشة من غير هذه الصناعة فقد قطعها الله عنكم»؛ وكانت وظيفة الأردن التي قُطعت معونةً مائة وثمانين ألف دينار، ووظيفة فلسطين ثلاثمائة وخمسين ألف دينار، ووظيفة دمشق أربعمائة ألف دينار، ووظيفة حمص مع قنسرين والكور التي تدعى اليوم العواصم ثمانمائة ألف دينار — ويقال سبعمائة ألف دينار."
  en: "In al-Baladhuri: the diwan of Syria remained in Greek until Abd al-Malik ibn Marwan ruled; in year 81 he ordered it transferred, and that because a man of the Roman scribes, needing to write something and finding no water, urinated in the inkwell — word reached Abd al-Malik, who was incensed and ordered Sulayman ibn Sa'd to transfer the diwan; Sulayman asked to be helped by a year's kharaj of al-Urdunn, which was done, and was made its governor — before the year ended he had finished the transfer and brought it to Abd al-Malik, who called his scribe Sarjun and displayed it to him, which grieved him, and he went out dejected; a group of the Roman scribes met him and he said 'seek your livelihood in a craft other than this — God has cut it off from you'; the levy of al-Urdunn granted as aid was a hundred and eighty thousand dinars, that of Filastin three hundred and fifty thousand dinars, of Damascus four hundred thousand dinars, and of Hims with Qinnasrin and the districts called today the Awasim eight hundred thousand dinars — or, it is said, seven hundred thousand."
  es: "En al-Baladhuri: el diwan de Siria permaneció en griego hasta que Abd al-Malik ibn Marwan gobernó; en el año 81 ordenó su traslado, y eso porque un hombre de los escribas romanos, necesitando escribir algo y sin encontrar agua, orinó en el tintero; la noticia llegó a Abd al-Malik, quien se indignó y ordenó a Sulayman ibn Sa'd que trasladara el diwan; Sulayman pidió ser ayudado por un año de kharaj de al-Urdunn, lo cual se hizo, y fue nombrado su gobernador; antes de que terminara el año había terminado el traslado y se lo llevó a Abd al-Malik, quien llamó a su escriba Sarjun y se lo mostró, lo cual lo afligió, y salió abatido; un grupo de escribas romanos se encontró con él y les dijo: \"Buscad vuestro sustento en otro oficio que no sea este; Dios os lo ha cortado\"; El impuesto concedido a al-Urdunn como ayuda fue de ciento ochenta mil dinares, el de Filastin trescientos cincuenta mil dinares, el de Damasco cuatrocientos mil dinares y el de Hims con Qinnasrin y los distritos llamados hoy Awasim ochocientos mil dinares, o, según se dice, setecientos mil."
  fr: "Dans al-Baladhuri: le diwan de Syrie resta sous administration grecque jusqu'au règne d'Abd al-Malik ibn Marwan; en l'an 81, il ordonna son transfert, car un scribe romain, ayant besoin d'écrire et ne trouvant pas d'eau, urina dans l'encrier. La nouvelle parvint aux oreilles d'Abd al-Malik, qui, furieux, ordonna à Sulayman ibn Sa'd de procéder au transfert. Sulayman demanda l'aide d'un an de kharaj d'al-Urdunn, ce qui lui fut accordé, et il fut nommé gouverneur. Avant la fin de l'année, le transfert fut achevé et le diwan fut présenté à Abd al-Malik, qui convoqua son scribe Sarjun et le lui montra, ce qui l'attrista profondément. Sarjun s'en alla, abattu. Un groupe de scribes romains le rencontra et il leur dit: « Cherchez un autre métier pour gagner votre vie, car Dieu vous l'a retiré. » La taxe d'al-Urdunn accordée à titre d'aide était de cent quatre-vingt mille dinars, celle de Filastin de trois cent cinquante mille dinars, celle de Damas de quatre cent mille dinars et celle de Hims avec Qinnasrin et les districts appelés aujourd'hui les Awasim de huit cent mille dinars — ou, dit-on, de sept cent mille."
  ur: "البلادوری میں ہے: شام کا دیوان اس وقت تک یونانی زبان میں رہا جب تک عبد الملک ابن مروان حکومت نہ کر سکے۔ سن 81 میں اس نے اسے منتقل کرنے کا حکم دیا، اور یہ کہ رومی کاتبوں کے ایک آدمی کو، کچھ لکھنے کی ضرورت تھی اور پانی نہ ملنے کی وجہ سے، انک ویل میں پیشاب کیا گیا تھا، یہ بات عبد الملک تک پہنچی، جس پر غصہ آیا اور سلیمان بن سعد کو دیوان منتقل کرنے کا حکم دیا۔ سلیمان نے اردون کے ایک سال کے خرج سے مدد کی درخواست کی، جو ہو گیا، اور اسے اس کا گورنر بنا دیا گیا - سال کے ختم ہونے سے پہلے وہ اسے عبد الملک کے پاس لے آیا، جس نے اپنے کاتب سرجن کو بلایا اور اسے دکھایا، جس سے وہ غمگین ہوا، اور وہ مایوس ہو کر باہر چلا گیا۔ رومی کاتبوں کا ایک گروہ اس سے ملا اور اس نے کہا کہ اس کے علاوہ کسی اور ہنر میں اپنی روزی تلاش کرو، خدا نے اسے تم سے کاٹ دیا ہے۔ امداد کے طور پر دیے گئے الاردن کا محصول ایک لاکھ اسی ہزار دینار، فلاسطن کا ساڑھے تین لاکھ دینار، دمشق کا چار لاکھ دینار، اور حمس کا کناسرین اور وہ اضلاع جو آج عواصم کو آٹھ لاکھ دینار کہتے ہیں- یا کہا جاتا ہے کہ سات لاکھ"
  tr: "El-Baladhuri'ye göre: Suriye Divanı, Abdülmalik ibn Mervan vali olana kadar Romalıların elinde kaldı. Divan 81 yaşındayken, Abdülmalik divanı nakletme emri verdi. Bunun sebebi, Romalı kâtiplerden birinin bir şey yazması gerekiyordu ama su bulamayınca mürekkep hokkasına işemesiydi. Bu durum Abdülmalik'in kulağına gelince, azarlandı ve Süleyman ibn Saad'a divanı nakletmesini emretti. Ondan bir yıl boyunca Ürdün vergisinde kendisine yardım etmesini istedi, o da bunu yaptı ve onu Ürdün valisi olarak atadı. Divanı nakletmeyi bitirip Abdülmalik'e getirene kadar yıl bitmedi. Abdülmalik kâtibi Sarjun'u çağırdı ve divanı ona sundu, bunun üzerine Sarjun onu kör etti ve üzgün bir şekilde bıraktı. Bir grup Romalı kâtip onunla karşılaştı ve Abdülmalik, \"Bu meslekten başka bir geçim kaynağı arayın, çünkü Allah bunu sizden kesti\" dedi. Yardım olarak kesilen Ürdün vergisi yüz seksen bin dinar, Filistin vergisi üç yüz elli bin dinar, Şam vergisi dört yüz bin dinar ve Humus ile Kınasrin ve bugün El-Awasim olarak adlandırılan bölgelerin vergisi sekiz yüz bin dinar - hatta yedi yüz bin dinar olduğu söyleniyor."
  id: "Menurut Al-Baladhuri: Diwan Suriah tetap berada di tangan Romawi hingga Abd al-Malik ibn Marwan menjadi gubernur. Ketika usianya 81 tahun, ia memerintahkan pemindahannya. Hal ini karena seorang juru tulis Romawi perlu menulis sesuatu tetapi tidak dapat menemukan air, sehingga ia buang air kecil di tempat tinta. Hal ini sampai ke telinga Abd al-Malik, sehingga ia ditegur dan Sulayman ibn Saad memerintahkan pemindahan Diwan tersebut. Ia meminta Sulayman untuk membantunya dengan pajak Yordania selama setahun, dan Sulayman pun melakukannya, lalu mengangkatnya sebagai gubernur Yordania. Setahun itu belum berakhir hingga ia menyelesaikan pemindahan dan membawanya kepada Abd al-Malik. Abd al-Malik memanggil Sarjun, juru tulisnya, dan mempersembahkan Diwan itu kepadanya, lalu membutakan Sarjun dan meninggalkannya dalam kesedihan. Sekelompok juru tulis Romawi menemui Sarjun, dan Sarjun berkata, “Carilah penghidupan selain dari profesi ini, karena Allah telah memutusnya dari kalian.” Pajak Yordania, yang dipotong sebagai bantuan, adalah seratus delapan puluh ribu dinar, pajak Palestina adalah tiga ratus lima puluh ribu dinar, pajak Damaskus adalah empat ratus ribu dinar, dan pajak Homs beserta Qinnasrin dan distrik-distrik yang sekarang disebut Al-Awasim adalah delapan ratus ribu dinar — dan ada juga yang mengatakan tujuh ratus ribu dinar."
