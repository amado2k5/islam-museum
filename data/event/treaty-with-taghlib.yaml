label: { ar: "صلح نصارى بني تغلب", en: "The Treaty with the Christian Taghlib", es: "El Tratado con el cristiano Taghlib", fr: "Le traité avec le Taghlib chrétien", ur: "عیسائی تغلب کے ساتھ معاہدہ" }
summary:
  ar: "عند البلاذري بأسانيد متعددة: أراد عمر بن الخطاب أن يأخذ الجزية من نصارى بني تغلب فانطلقوا هاربين ولحقت طائفة منهم ببعد من الأرض وقطعوا الفرات يريدون أرض الروم فقال النعمان بن زرعة — أو زرعة بن النعمان — «أنشدك الله في بني تغلب فإنهم قوم من العرب نائفون من الجزية وهم قوم شديدة فكايتهم فلا يُغن عدوك عليك بهم» فأرسل عمر في طلبهم فردّهم وصالحهم على أن ضاعف عليهم الصدقة التي تؤخذ من المسلمين في كل سائمة وأرض؛ وبسند آخر كتب إليه عمر يأمره أن يضعف عليهم الصدقة وإن أبوا حاربهم حتى يبيدهم أو يسلموا فقبلوا أن يؤخذ منهم ضعف الصدقة وقالوا «أما إذ لم تكن جزية كجزية الأعلاج فإنا نرضى ونحفظ ديننا»؛ وصالحهم على أن لا يصبغوا صبياً ولا يكرهوه على دينهم — وكان داود بن كردوس يقول ليست لهم ذمة لأنهم قد صبغوا في دينهم يعني المعمودية — وكان علي يقول «لئن تفرغت لبني تغلب ليكونن لي فيهم رأي: لأقتلن مقاتلتهم ولأسبين ذريتهم، فقد نقضوا العهد وبرئت منهم الذمة حين نصّروا أولادهم»؛ وبعث عمر زياد بن حدير الأسدي يأخذ منهم نصف عشر أموالهم ناهياً إياه أن يعشر مسلماً أو ذمياً يؤدي الخراج؛ وأمر عثمان أن لا يقبل من بني تغلب في الجزية إلا الذهب والفضة فجاءه الخبر أن عمر أخذ منهم ضعف الصدقة فرجع عن ذلك؛ وعن الزهري ليس في مواشي أهل الكتاب صدقة إلا نصارى بني تغلب؛ وقال سفيان الثوري والأوزاعي ومالك بن أنس وابن أبي ذئب وأبو حنيفة وأبو يوسف: يؤخذ من التغلبي ضعف ما يؤخذ من المسلم في أرضه وماشيته وماله — فأما الصبي والمعتوه فأهل العراق يرون ضعف الصدقة من أرضه ولا يأخذون من ماشيته شيئاً وقال أهل الحجاز يؤخذ من ماشيته وأرضه — وقالوا جميعاً إن سبيل ما يؤخذ من أموال بني تغلب سبيل مال الخراج لأنه بدل من الجزية."
  en: "In al-Baladhuri through multiple chains: Umar ibn al-Khattab meant to take jizya from the Christian Taghlib, who fled — a body crossing the Euphrates for Byzantine lands — until al-Nu'man ibn Zur'a — or Zur'a ibn al-Nu'man — adjured him: 'Banu Taghlib are Arabs who would scorn the jizya and are a people of stout valour; let not your enemy gain strength against you by them'; Umar sent after them, brought them back and compounded with them for a doubling of the sadaqa taken from the Muslims on every grazing herd and acre — another chain has Umar ordering they be fought till destroyed or converted if they refused — and they accepted, saying 'since it is no jizya like the jizya of foreigners, we accept and keep our religion'; the treaty bound them not to baptize a child nor coerce one into their faith — Dawud ibn Kurdus holding they therefore had no dhimma, meaning they baptized in their faith — and Ali would say 'were I free to deal with Banu Taghlib I should have my way: kill their fighters and take their children captive, for they broke the covenant, their dhimma lapsing when they Christianized their children'; Umar sent Ziyad ibn Hudayr al-Asadi to take of them a half-tithe of their wealth, forbidding him to tithe a Muslim or a kharaj-paying dhimmi; Uthman ordered only gold and silver accepted of them until word came that Umar had taken double-sadaqa, whereupon he retracted; al-Zuhri held there is no sadaqa on the People of the Book's herds save the Christian Taghlib; and Sufyan al-Thawri, al-Awza'i, Malik ibn Anas, Ibn Abi Dhi'b, Abu Hanifa and Abu Yusuf all hold that the Taghlibi pays double what a Muslim pays on his land, livestock and wealth — the Iraqis taking double-sadaqa from the minor and the incompetent's land but nothing of their livestock, the Hijazis from both — all agreeing that what is taken of Taghlib's wealth is disposed as kharaj-money, being a substitute for jizya."
  es: "En al-Baladhuri a través de múltiples cadenas: Umar ibn al-Khattab pretendía cobrar la jizya al cristiano Taghlib, quien huyó —un grupo cruzando el Éufrates hacia tierras bizantinas— hasta que al-Nu'man ibn Zur'a —o Zur'a ibn al-Nu'man— le conjuró: «Los Banu Taghlib son árabes que despreciarían la jizya y son un pueblo de gran valor; no dejes que tu enemigo gane fuerza contra ti por medio de ellos»; Umar los mandó buscar, los trajo de vuelta y llegó a un acuerdo con ellos para duplicar la sadaqa tomada a los musulmanes por cada rebaño y acre de pastoreo —otra cadena dice que Umar ordenó que se luchara contra ellos hasta destruirlos o convertirlos si se negaban— y ellos aceptaron, diciendo «ya que no es una jizya como la jizya de los extranjeros, aceptamos y mantenemos nuestra religión»; el tratado los obligaba a no bautizar a un niño ni a coaccionar a uno a su fe — Dawud ibn Kurdus sostenía que por lo tanto no tenían dhimma, lo que significa que bautizaban en su fe — y Ali diría: «Si fuera libre de tratar con Banu Taghlib, haría lo que quisiera: matar a sus combatientes y tomar a sus hijos cautivos, porque rompieron el pacto, su dhimma caducó cuando cristianizaron a sus hijos»; Umar envió a Ziyad ibn Hudayr al-Asadi para que tomara de ellos la mitad de su riqueza, prohibiéndole diezmar a un musulmán o a un dhimmi que pagara kharaj; Uthman ordenó que solo se aceptara oro y plata de ellos hasta que llegó la noticia de que Umar había tomado una sadaqa doble, con lo cual se retractó; al-Zuhri sostenía que no hay sadaqa sobre los rebaños de la Gente del Libro excepto el Taghlib cristiano; Sufyan al-Thawri, al-Awza'i, Malik ibn Anas, Ibn Abi Dhi'b, Abu Hanifa y Abu Yusuf sostienen que el Taghlibi paga el doble de lo que paga un musulmán por su tierra, ganado y riqueza (los iraquíes toman el doble de sadaqa de la tierra del menor y del incapacitado, pero nada de su ganado; los hiyazíes, de ambos), y todos coinciden en que lo que se toma de la riqueza del Taghlibi se dispone como dinero kharaj, siendo un sustituto de la jizya."
  fr: "Dans al-Baladhuri, à travers plusieurs chaînes de transmission: Umar ibn al-Khattab avait l’intention de percevoir la jizya auprès des Taghlib chrétiens, qui s’enfuirent – un groupe traversant l’Euphrate pour rejoindre les terres byzantines – jusqu’à ce qu’al-Nu’man ibn Zur’a – ou Zur’a ibn al-Nu’man – l’exhorte: « Les Banu Taghlib sont des Arabes qui méprisent la jizya et sont un peuple d’une vaillance inébranlable; que votre ennemi ne prenne pas de force contre vous grâce à eux ». Umar envoya des messagers à leur poursuite, les ramena et négocia avec eux le doublement de la sadaqa prélevée sur les musulmans pour chaque tête de troupeau et chaque acre de pâturage – une autre chaîne de transmission rapporte qu’Umar ordonna qu’on les combatte jusqu’à leur destruction ou qu’on les convertisse s’ils refusaient – et ils acceptèrent, disant: « Puisqu’il ne s’agit pas d’une jizya comme celle des étrangers, nous l’acceptons et conservons notre religion ». Le traité les obligeait à ne baptiser aucun enfant ni à contraindre quiconque à se convertir à leur foi — Dawud ibn Kurdus estimant qu'ils n'avaient donc pas de dhimma, ce qui signifie qu'ils baptisaient dans leur foi — et Ali disait: « Si j'étais libre de traiter avec les Banu Taghlib, je ferais ce que je voulais: tuer leurs guerriers et faire prisonniers leurs enfants, car ils ont rompu l'alliance, leur dhimma ayant expiré lorsqu'ils ont christianisé leurs enfants. » Umar envoya Ziyad ibn Hudayr al-Asadi prélever chez eux la moitié de leurs biens, lui interdisant de verser la dîme à un musulman ou à un dhimmi payant le kharaj. Uthman ordonna que seuls l'or et l'argent soient acceptés d'eux jusqu'à ce que l'on apprenne qu'Umar avait perçu une double sadaqa, après quoi il se rétracta. Al-Zuhri affirmait qu'il n'y a pas de sadaqa sur les troupeaux des Gens du Livre, sauf chez les Taghlib chrétiens. et Sufyan al-Thawri, al-Awza'i, Malik ibn Anas, Ibn Abi Dhi'b, Abu Hanifa et Abu Yusuf soutiennent tous que le Taghlib paie le double de ce qu'un musulman paie sur ses terres, son bétail et ses biens — les Irakiens prélevant une double sadaqa sur les terres du mineur et de l'incapable, mais rien sur leur bétail, les Hedjazis sur les deux — tous s'accordant à dire que ce qui est prélevé sur les biens du Taghlib est disposé comme argent kharaj, se substituant à la jizya."
  ur: "البلادوری میں متعدد زنجیروں کے ذریعے: عمر بن الخطاب کا مطلب عیسائی تغلب سے جزیہ لینا تھا، جو فرار ہو گیا تھا - بازنطینی سرزمینوں کے لیے فرات کو عبور کرنے والا ایک جسم - یہاں تک کہ النعمان بن زرعہ - یا ثریا ابن النعمان - نے اسے یہ کہا: 'بنو الثنین اور ابن الخطاب'۔ بہادر لوگ ہیں ان سے تمہارا دشمن تم پر زور نہ ڈالے'۔ عمر نے ان کے پیچھے بھیجا، انہیں واپس لایا اور ان کے ساتھ ہر چرنے والے ریوڑ اور ایکڑ پر مسلمانوں سے لیا گیا صدقہ دوگنا کرنے کے لئے ان کے ساتھ ملایا - ایک اور سلسلہ عمر نے حکم دیا کہ ان سے جنگ کی جائے یہاں تک کہ اگر وہ انکار کردیں تو انہیں تباہ کردیا جائے یا تبدیل کردیا جائے - اور انہوں نے یہ کہتے ہوئے قبول کیا کہ 'چونکہ یہ غیروں کے جزیہ کی طرح کوئی جزیہ نہیں ہے، ہم اپنا دین قبول کرتے ہیں اور برقرار رکھتے ہیں۔' اس معاہدے نے انہیں پابند کیا کہ وہ کسی بچے کو بپتسمہ نہیں دیں گے اور نہ ہی کسی کو اپنے عقیدے میں مجبور کریں گے - داؤد ابن کردوس نے کہا کہ ان کے پاس کوئی ذم نہیں تھا، مطلب کہ انہوں نے اپنے عقیدے میں بپتسمہ دیا تھا - اور علی کہتے تھے 'کیا میں بنو تغلب سے نمٹنے کے لئے آزاد تھا مجھے اپنا راستہ اختیار کرنا چاہئے: ان کے جنگجوؤں کو مار ڈالو اور ان کے بچوں کو قید کرو، کیونکہ انہوں نے اپنے عہد کو توڑا، جب انہوں نے اپنے بچوں کو عیسائی بنایا'۔ عمر نے زیاد بن حضیر الاسدی کو ان کے مال کا نصف دسواں حصہ لینے کے لیے بھیجا، اور اسے مسلمان یا خرج ادا کرنے والے ذمی کو دسواں حصہ دینے سے منع کیا۔ عثمان نے ان میں سے صرف سونے اور چاندی کو قبول کرنے کا حکم دیا یہاں تک کہ یہ خبر آ گئی کہ عمر نے دوگنا صدقہ لیا ہے، اس کے بعد وہ واپس لے گئے۔ الزہری کا خیال ہے کہ اہل کتاب کے ریوڑ پر عیسائی تغلب کے علاوہ کوئی صدقہ نہیں ہے۔ اور سفیان الثوری، الاوزاعی، مالک ابن انس، ابن ابی ذہب، ابو حنیفہ اور ابو یوسف سب کا یہ موقف ہے کہ طاغلبی اپنی زمین، مویشیوں اور مال سے مسلمان کو دوگنا ادا کرتا ہے - عراقی نابالغ اور نااہلوں سے دوہرا صدقہ لیتے ہیں - ان دونوں کی جانوں کے سوا کچھ بھی نہیں ہے، جو کہ دونوں کی زندگیوں سے اتفاق ہے۔ تغلب کے مال کو جزیہ کا متبادل ہونے کے ناطے خرج کے طور پر استعمال کیا جاتا ہے۔"
