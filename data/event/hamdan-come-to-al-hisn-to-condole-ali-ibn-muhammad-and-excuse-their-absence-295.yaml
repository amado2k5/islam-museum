label:
  ar: "همدان تعزي علي بن محمد في أبيه في الحصن وتعتذر عن تخلفها، 295هـ، ص383"
  en: "Hamdan come to Ali ibn Muhammad at the fort to condole him on his father and excuse their absence, 295 AH, p. 383"
  ur: "ہمدان حصن میں علی بن محمد کے پاس باپ کی تعزیت کے لیے آتے ہیں اور اپنی غیر حاضری کا عذر کرتے ہیں، 295ھ، ص383"
summary:
  ar: "لما وصل علي بن محمد إلى الحصن أقبلت همدان إليه يعزّونه في أبيه، ويعتذرون عن تخلفهم عن نصرته."
  en: "When Ali ibn Muhammad reached the fort, the men of Hamdan came to him to condole him on his father and apologised for having stayed away from helping him."
  ur: "علی بن محمد جب حصن پہنچا تو ہمدان کے لوگ اس کے پاس باپ کی تعزیت کے لیے آئے اور اس کی مدد کو نہ آنے پر معذرت کی۔"
