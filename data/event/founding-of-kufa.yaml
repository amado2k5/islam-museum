label: { ar: "تمصير الكوفة" }
summary:
  ar: "قال بعضهم إن سعد بن أبي وقاص مصّر الكوفة في سنة خمس عشرة، ودلّهم على موضعها ابن بُقيلة، فنزلوا موضعها الذي عُرف به {cite:tabari-tarikh-abu-al-fadl j.3 p.598}. وعند البلاذري: كتب عمر إلى سعد يأمره أن يتخذ للمسلمين دار هجرة وقيرواناً وأن لا يجعل بينه وبينهم بحراً فأتى الأنبار وأراد أن يتخذها منزلاً فكثر على الناس الذباب فتحول إلى موضع آخر فلم يصلح فتحول إلى الكوفة فاختطها وأقطع الناس المنازل وأنزل القبائل منازلهم وبنى مسجدها وذلك في سنة سبع عشرة وأصابهم البعوض فكتب سعد إلى عمر يعلمه أن الناس قد يعضّوا وتأذوا به فكتب إليه عمر إن العرب بمنزلة الإبل لا يصلحها إلا ما يصلح الإبل فارتد لهم موضعاً عدناً ولا تجعل بيني وبينهم بحراً وولى الاختطاط للناس أبا الهياج الأسدي عمرو بن مالك بن جعادة ثم إن عبد المسيح بن بقيلة أتى سعداً وقال أدلك على أرض انحدرت عن الفلاة وارتفعت عن المباق فدله على موضع الكوفة اليوم وكان يقال لها سورستان فلما انتهى إلى موضع مسجدها أمر رجلاً فعلا بسهم قبل مهب القبلة فأعلم على موقعه ثم علا بسهم آخر قبل مهب الشمال وأعلم على موقعه ثم علا بسهم قبل مهب الجنوب وأعلم على موقعه ثم علا بسهم قبل مهب الصبا فأعلم على موقعه ثم وضع مسجدها ودار إمارتها في مقام العالي وما حوله وأسهم لنزار وأهل اليمن بسهمين على أنه من خرج بسهمه أولاً فله الجانب الأيسر وهو خيرهما فخرج سهم أهل اليمن فصارت بخططهم في الجانب الشرقي وصارت خطط نزار في الجانب الغربي من وراء تلك العلامات وترك ما دونها فناء للمسجد ودار الإمارة وقال الشعبي كنا يعني أهل اليمن اثني عشر ألفاً وكانت نزار ثمانية آلاف ثم إن المغيرة بن شعبة وسع المسجد وبناه زياد فأحكمه وبنى دار الإمارة وكان زياد يقول أنفقت على كل أسطوانة من أساطين مسجد الكوفة ثماني عشرة مائة وبنى فيها عمرو بن حريث المخزومي بناء وكان زياد يستخلفه على الكوفة إذا شخص إلى البصرة وكان سبب إلقاء الحصى فيه وفي مسجد البصرة أن الناس كانوا يصلون فإذا رفعوا أيديهم وقد تربت نفضوها فقال زياد ما أخوفني أن يظن الناس على غابر الأيام أن نفض الأيدي سنة في الصلاة فزاد في المسجد ووسعه وأمر بالحصى فجمع وألقي في صحن المسجد وقال أبو عبيدة كان تكويف الكوفة في سنة ثماني عشرة وكان زياد اتخذ في مسجد الكوفة مقصورة ثم جددها خالد بن عبد الله القسري وقيل إن المسلمين أقاموا بالمدائن واختطوها وبنوا المساجد فيها ثم استوخموها واستوبأوها فكتب سعد إلى عمر فكتب إليه أنزلهم منزلاً غربياً فارتاد كويفة بن عمر فنظروا فإذا الماء محيط بها فخرجوا حتى أتوا موضع الكوفة اليوم فانتهوا إلى الظهر وكان يدعى خد العذراء ينبت الخزامى والأقحوان والشيح والقيصوم والشقائق فاختطوها وكان ما بين الكوفة والحيرة يسمى الملطاط واتخذ سعد باباً مبوباً من خشب وخصّ على قصره خصاً من قصب فبعث عمر محمد بن مسلمة الأنصاري حتى أحرق الباب والخص وأقام سعداً في مساجد الكوفة."
