summary:
  ar: "قال بعضهم إن سعد بن أبي وقاص مصّر الكوفة في سنة خمس عشرة، ودلّهم على موضعها ابن بُقيلة، فنزلوا موضعها الذي عُرف به {cite:tabari-tarikh-abu-al-fadl j.3 p.598}. وعند البلاذري: كتب عمر إلى سعد يأمره أن يتخذ للمسلمين دار هجرة وقيرواناً وأن لا يجعل بينه وبينهم بحراً فأتى الأنبار وأراد أن يتخذها منزلاً فكثر على الناس الذباب فتحول إلى موضع آخر فلم يصلح فتحول إلى الكوفة فاختطها وأقطع الناس المنازل وأنزل القبائل منازلهم وبنى مسجدها وذلك في سنة سبع عشرة وأصابهم البعوض فكتب سعد إلى عمر يعلمه أن الناس قد يعضّوا وتأذوا به فكتب إليه عمر إن العرب بمنزلة الإبل لا يصلحها إلا ما يصلح الإبل فارتد لهم موضعاً عدناً ولا تجعل بيني وبينهم بحراً وولى الاختطاط للناس أبا الهياج الأسدي عمرو بن مالك بن جعادة ثم إن عبد المسيح بن بقيلة أتى سعداً وقال أدلك على أرض انحدرت عن الفلاة وارتفعت عن المباق فدله على موضع الكوفة اليوم وكان يقال لها سورستان فلما انتهى إلى موضع مسجدها أمر رجلاً فعلا بسهم قبل مهب القبلة فأعلم على موقعه ثم علا بسهم آخر قبل مهب الشمال وأعلم على موقعه ثم علا بسهم قبل مهب الجنوب وأعلم على موقعه ثم علا بسهم قبل مهب الصبا فأعلم على موقعه ثم وضع مسجدها ودار إمارتها في مقام العالي وما حوله وأسهم لنزار وأهل اليمن بسهمين على أنه من خرج بسهمه أولاً فله الجانب الأيسر وهو خيرهما فخرج سهم أهل اليمن فصارت بخططهم في الجانب الشرقي وصارت خطط نزار في الجانب الغربي من وراء تلك العلامات وترك ما دونها فناء للمسجد ودار الإمارة وقال الشعبي كنا يعني أهل اليمن اثني عشر ألفاً وكانت نزار ثمانية آلاف ثم إن المغيرة بن شعبة وسع المسجد وبناه زياد فأحكمه وبنى دار الإمارة وكان زياد يقول أنفقت على كل أسطوانة من أساطين مسجد الكوفة ثماني عشرة مائة وبنى فيها عمرو بن حريث المخزومي بناء وكان زياد يستخلفه على الكوفة إذا شخص إلى البصرة وكان سبب إلقاء الحصى فيه وفي مسجد البصرة أن الناس كانوا يصلون فإذا رفعوا أيديهم وقد تربت نفضوها فقال زياد ما أخوفني أن يظن الناس على غابر الأيام أن نفض الأيدي سنة في الصلاة فزاد في المسجد ووسعه وأمر بالحصى فجمع وألقي في صحن المسجد وقال أبو عبيدة كان تكويف الكوفة في سنة ثماني عشرة وكان زياد اتخذ في مسجد الكوفة مقصورة ثم جددها خالد بن عبد الله القسري وقيل إن المسلمين أقاموا بالمدائن واختطوها وبنوا المساجد فيها ثم استوخموها واستوبأوها فكتب سعد إلى عمر فكتب إليه أنزلهم منزلاً غربياً فارتاد كويفة بن عمر فنظروا فإذا الماء محيط بها فخرجوا حتى أتوا موضع الكوفة اليوم فانتهوا إلى الظهر وكان يدعى خد العذراء ينبت الخزامى والأقحوان والشيح والقيصوم والشقائق فاختطوها وكان ما بين الكوفة والحيرة يسمى الملطاط واتخذ سعد باباً مبوباً من خشب وخصّ على قصره خصاً من قصب فبعث عمر محمد بن مسلمة الأنصاري حتى أحرق الباب والخص وأقام سعداً في مساجد الكوفة."
  en: "Some said that Sa'd ibn Abi Waqqas founded Kufa as a garrison town in the year fifteen, and that Ibn Buqayla showed them its site, so they settled on the place that became known by it {cite:tabari-tarikh-abu-al-fadl j.3 p.598}. According to al-Baladhuri, Umar wrote to Sa'd ordering him to take for the Muslims a home of migration and a garrison, and not to put a body of water between himself and them. He came to al-Anbar and meant to make it his residence, but flies gathered thickly over the people, so he moved to another place, which did not suit them, then moved to Kufa, laid out its plots, allotted the plots, settled the tribes in their places and built its mosque, in the year seventeen. Mosquitoes then afflicted them, and Sa'd wrote to Umar that the people had been bitten and harmed. Umar wrote back that the Arabs are like camels, and only what suits camels suits them: he told him to seek out for them a firm, settled place, and not to put a body of water between himself and them. He entrusted the laying out of plots to Abu al-Hayyaj al-Asadi, 'Amr ibn Malik ibn Ja'da. Then 'Abd al-Masih ibn Buqayla came to Sa'd and said he would guide him to land that descends from the wilderness and rises above the low ground, and he led him to the site of present-day Kufa, which had been called Surasatan. When he reached the site of its mosque, he had a man climb up and shoot an arrow toward the quarter of the qibla wind, and marked the spot; he did the same toward the north wind, the south wind and the saba wind. He then set the mosque and the house of government on the high ground and around it, and cast lots between Nizar and the people of Yemen with two arrows, on the terms that whoever's arrow came out first would have the left side, the better of the two. The arrow of the people of Yemen came out, so their plots lay on the eastern side and those of Nizar on the western side beyond those marks, and what lay short of them was left as an open space for the mosque and the house of government. Al-Sha'bi said that the people of Yemen numbered twelve thousand and Nizar eight thousand. Then al-Mughira ibn Shu'ba enlarged the mosque; Ziyad built it solidly and built the house of government. Ziyad used to say: I spent eighteen hundred on each column of the mosque of Kufa. Amr ibn Huraith al-Makhzumi built in it, and Ziyad would appoint him as his deputy in Kufa when he went out to Basra. The reason for scattering pebbles in it and in the mosque of Basra was that people used to pray, and when they raised their hands, which had gone dusty, they shook them off. Ziyad said: how I fear that people in ages to come will think that shaking off the hands is a sunna in prayer! So he enlarged and widened the mosque, and ordered the pebbles gathered and cast into its courtyard. Abu Ubayda said the founding (takwif) of Kufa was in the year eighteen. Ziyad had made a maqsura in the mosque of Kufa, and Khalid ibn Abd Allah al-Qasri renewed it. It is said that the Muslims first settled at al-Mada'in, laid out plots there and built mosques, then found it unwholesome and pestilential; Sa'd wrote to Umar, and he wrote back that they should be settled in a site to the west. They sent out Kuwayfa ibn Umar to scout, and finding water all around, they went on until they reached the site of present-day Kufa, the high ground called Khadd al-'Adhra', where lavender (khuzama), chamomile, wormwood, southernwood and anemones grew; they laid out plots there. The land between Kufa and al-Hira was called al-Mulatat. Sa'd had made a wooden gate with a door and fenced his palace with a reed screen. Umar sent Muhammad ibn Maslama al-Ansari, who burned the gate and the screen, and kept Sa'd within the mosques of Kufa."
  es: "Algunos dicen que Sa'd ibn Abi Waqqas fundó Kufa como ciudad guarnición en el año quince, y que Ibn Buqayla les mostró su emplazamiento, por lo que se establecieron en el lugar que llegó a ser conocido con ese nombre {cite:tabari-tarikh-abu-al-fadl j.3 p.598}. Según al-Baladhuri, Umar escribió a Sa'd ordenándole que preparara para los musulmanes un hogar de migración y una guarnición, y que no pusiera ningún cuerpo de agua entre él y ellos. Llegó a al-Anbar con la intención de establecerse allí, pero las moscas se acumularon densamente sobre la gente, así que se trasladó a otro lugar, que no les convenía, y luego se mudó a Kufa, trazó sus parcelas, las asignó, asentó a las tribus en sus lugares y construyó su mezquita, en el año diecisiete. Entonces los mosquitos los afligieron, y Sa'd escribió a Umar que la gente había sido picada y perjudicada. Umar respondió que los árabes son como camellos, y que solo lo que les conviene a los camellos les conviene a ellos: le dijo que buscara para ellos un lugar firme y estable, y que no pusiera un cuerpo de agua entre él y ellos. Le encomendó la planificación de los terrenos a Abu al-Hayyaj al-Asadi, 'Amr ibn Malik ibn Ja'da. Entonces 'Abd al-Masih ibn Buqayla fue a ver a Sa'd y le dijo que lo guiaría a una tierra que descendía del desierto y se elevaba sobre el terreno bajo, y lo condujo al sitio de la actual Kufa, que había sido llamada Surasatan. Cuando llegó al sitio de su mezquita, hizo que un hombre subiera y disparara una flecha hacia el cuadrante del viento de la qibla, y marcó el lugar; hizo lo mismo hacia el viento del norte, el viento del sur y el viento saba. Luego, edificó la mezquita y la casa de gobierno en la parte alta y a su alrededor, y echó suertes entre Nizar y el pueblo de Yemen con dos flechas, con la condición de que quien sacara la primera flecha se quedaría con el lado izquierdo, el mejor de los dos. La flecha del pueblo de Yemen salió, así que sus parcelas quedaron en el lado este y las de Nizar en el lado oeste, más allá de esas marcas, y lo que quedó antes de ellas se dejó como un espacio abierto para la mezquita y la casa de gobierno. Al-Sha'bi dijo que el pueblo de Yemen era de doce mil y Nizar de ocho mil. Entonces, al-Mughira ibn Shu'ba amplió la mezquita; Ziyad la construyó sólidamente y edificó la casa de gobierno. Ziyad solía decir: «Gasté mil ochocientos en cada columna de la mezquita de Kufa». Amr ibn Huraith al-Makhzumi construyó en ella, y Ziyad lo nombraba su lugarteniente en Kufa cuando viajaba a Basora. La razón para esparcir guijarros en la mezquita de Basora era que la gente solía rezar y, al levantar las manos, que se habían cubierto de polvo, se las sacudían. Ziyad dijo: «¡Cuánto temo que en el futuro la gente piense que sacudirse las manos es una sunna en la oración!». Así que amplió la mezquita y ordenó que se recogieran los guijarros y se arrojaran a su patio. Abu Ubayda dijo que la fundación (takwif) de Kufa fue en el año dieciocho. Ziyad había hecho una maqsura en la mezquita de Kufa, y Khalid ibn Abd Allah al-Qasri la renovó. Se dice que los musulmanes se asentaron primero en al-Mada'in, delimitaron parcelas allí y construyeron mezquitas, pero luego lo encontraron insalubre y plagado de pestes; Sa'd escribió a Umar, y este le respondió que debían asentarse en un sitio al oeste. Enviaron a Kuwayfa ibn Umar a explorar, y al encontrar agua por todas partes, continuaron hasta llegar al lugar donde hoy se encuentra Kufa, la colina llamada Khadd al-'Adhra', donde crecían lavanda (khuzama), manzanilla, ajenjo, abrótano y anémonas; allí establecieron parcelas. La tierra entre Kufa y al-Hira se llamaba al-Mulatat. Sa'd había construido una puerta de madera y cercado su palacio con una celosía de cañas. Umar envió a Muhammad ibn Maslama al-Ansari, quien quemó la puerta y la celosía, y mantuvo a Sa'd encerrado dentro de las mezquitas de Kufa."
  fr: "Certains affirment que Sa'd ibn Abi Waqqas fonda Kufa comme ville de garnison en l'an 15, et qu'Ibn Buqayla leur en indiqua l'emplacement. Ils s'y installèrent donc, et c'est ainsi que Kufa prit ce nom (voir Tabari Tarikh Abu al-Fadl, vol. 3, p. 598). Selon al-Baladhuri, Umar écrivit à Sa'd pour lui ordonner de trouver aux musulmans un lieu d'accueil et une garnison, et de ne pas les séparer d'un cours d'eau. Il se rendit à al-Anbar, où il comptait établir sa résidence, mais les mouches pullulaient. Il se déplaça alors vers un autre lieu, qui ne leur convenait pas non plus, puis s'installa à Kufa. Il en traça les plans, attribua les parcelles, installa les tribus et fit construire la mosquée en l'an 17. Les moustiques s'en prirent ensuite à eux, et Sa'd écrivit à Umar pour les informer que les habitants avaient été piqués et malades. Umar répondit que les Arabes étaient comme des chameaux, et que seul ce qui convient aux chameaux leur convenait. Il conseilla à Sa'd de leur trouver un lieu stable et sûr, et de ne pas mettre d'eau entre lui et eux. Il confia le tracé des parcelles à Abu al-Hayyaj al-Asadi et à 'Amr ibn Malik ibn Ja'da. Puis 'Abd al-Masih ibn Buqayla vint trouver Sa'd et lui dit qu'il le guiderait vers une terre descendant du désert et s'élevant au-dessus des basses terres. Il le conduisit à l'emplacement de l'actuelle Koufa, autrefois appelée Surasatan. Arrivé à l'emplacement de la mosquée, il fit grimper un homme qui décocha une flèche en direction de la qibla et marqua l'endroit. Il fit de même pour le nord, le sud et le saba. Il fit ensuite construire la mosquée et le palais du gouvernement sur les hauteurs environnantes, puis tira au sort deux flèches entre Nizar et les Yéménites, selon la règle suivante: celui dont la flèche sortirait en premier hériterait du côté gauche, considéré comme le meilleur des deux. La flèche des Yéménites sortit, leurs parcelles se trouvant donc à l’est et celles de Nizar à l’ouest, au-delà des marques. L’espace restant fut laissé libre pour la mosquée et le palais du gouvernement. Al-Sha’bi rapporte que les Yéménites étaient douze mille et Nizar huit mille. Al-Mughira ibn Shu’ba agrandit ensuite la mosquée; Ziyad la consolida et fit construire le palais du gouvernement. Ziyad disait: « J’ai dépensé mille huit cents pour chaque colonne de la mosquée de Koufa. » Amr ibn Huraith al-Makhzumi y travailla, et Ziyad le nommait son adjoint à Koufa lorsqu’il se rendait à Bassora. La raison pour laquelle des cailloux furent dispersés dans la mosquée de Koufa et dans celle de Bassora était que les fidèles, en priant, secouaient leurs mains poussiéreuses après les avoir levées. Ziyad s'exclama: « Je crains que, dans les siècles à venir, on ne croie que secouer les mains est une sunna pour la prière ! » Il agrandit donc la mosquée et ordonna que les cailloux soient ramassés et jetés dans sa cour. Abou Oubayda rapporte que la fondation (takwif) de Koufa eut lieu en l'an 18. Ziyad avait fait construire une maqsura dans la mosquée de Koufa, que Khalid ibn Abd Allah al-Qasri rénova. On raconte que les musulmans s'installèrent d'abord à Madah, y aménagèrent des parcelles et y construisirent des mosquées, mais qu'ils trouvèrent l'endroit insalubre et infesté de peste. Sa'd écrivit à Omar, qui lui répondit qu'ils devaient s'installer plus à l'ouest. Ils envoyèrent Kuwayfa ibn Umar en reconnaissance et, trouvant de l'eau tout autour, ils poursuivirent leur route jusqu'à atteindre l'emplacement de l'actuelle Koufa, sur les hauteurs appelées Khadd al-'Adhra', où poussaient la lavande (khuzama), la camomille, l'absinthe, l'aurone et les anémones; ils y aménagèrent des parcelles. La région entre Koufa et al-Hira s'appelait al-Mulalatat. Sa'd avait fait construire une porte en bois et avait entouré son palais d'un paravent de roseaux. Umar envoya Muhammad ibn Maslama al-Ansari, qui incendia la porte et le paravent, et confina Sa'd dans les mosquées de Koufa."
  ur: "بعض نے کہا کہ سعد ابن ابی وقاص نے پندرہ سال میں کوفہ کو ایک چوکی کے طور پر قائم کیا تھا اور ابن بکیلہ نے انہیں اس کی جگہ دکھائی تھی تو وہ اس جگہ پر آباد ہوئے جو اس سے مشہور ہوئی {حوالہ: طبری تاریخ ابو الفضل ج 3 ص 598}۔ البلادوری کے مطابق، عمر نے سعد کو لکھا کہ وہ مسلمانوں کے لیے ہجرت کا گھر اور ایک چوکی لے، اور اپنے اور ان کے درمیان پانی کا ایک حصہ نہ ڈالے۔ وہ الانبار آیا اور اسے اپنا ٹھکانہ بنانا چاہتا تھا، لیکن لوگوں پر مکھیاں بہت زیادہ جمع ہو گئیں، اس لیے وہ دوسری جگہ چلا گیا، جو ان کے لیے مناسب نہیں تھا، پھر کوفہ چلا گیا، وہاں جا کر پلاٹ بنائے، پلاٹوں کو تقسیم کیا، قبائل کو ان کی جگہوں پر آباد کیا اور اس کی مسجد بنائی، سترہ میں۔ پھر مچھروں نے انہیں تکلیف دی، اور سعد نے عمر کو لکھا کہ لوگوں کو کاٹا اور نقصان پہنچایا گیا ہے۔ عمر نے واپس لکھا کہ عرب اونٹوں کی طرح ہیں، اور جو اونٹ ان کے لیے مناسب ہیں وہی ان کے لیے موزوں ہیں: انھوں نے اس سے کہا کہ وہ ان کے لیے ایک پختہ اور آباد جگہ تلاش کرے، اور اپنے اور ان کے درمیان پانی کا ٹکڑا نہ رکھے۔ اس نے پلاٹوں کو بچھانے کا کام ابو الحیاج الاسدی، عمرو بن مالک ابن جعدہ کے سپرد کیا۔ پھر عبد المسیح ابن بکیلہ سعد کے پاس آئے اور کہا کہ وہ اسے اس زمین کی طرف رہنمائی کریں گے جو بیابان سے اترتی ہے اور نشیبی زمین سے اوپر اٹھتی ہے اور وہ اسے موجودہ کوفہ کے مقام پر لے گئے جسے سورساتان کہا جاتا تھا۔ جب وہ مسجد کی جگہ پر پہنچا تو اس نے ایک آدمی کو چڑھایا اور قبلہ کی ہوا کے چوتھائی حصے کی طرف تیر مارا اور اس جگہ کو نشان زد کیا۔ اُس نے شمالی ہوا، جنوبی ہوا اور صبا ہوا کی طرف بھی ایسا ہی کیا۔ اس کے بعد اس نے مسجد اور حکومت کے گھر کو اونچی زمین پر اور اس کے ارد گرد کھڑا کیا اور نزار اور اہل یمن کے درمیان دو تیروں سے قرعہ ڈالا، اس شرط پر کہ جس کا تیر پہلے نکلے گا اس کا بائیں طرف ہو گا، ان دونوں میں سے بہتر۔ اہل یمن کا تیر نکلا تو ان کے پلاٹ ان نشانوں سے آگے مشرق کی طرف اور نزار والے مغربی جانب پڑ گئے اور ان میں جو کچھ کم تھا وہ مسجد اور ایوان حکومت کے لیے کھلی جگہ کے طور پر چھوڑ دیا گیا۔ الشعبی نے کہا کہ یمن کے لوگوں کی تعداد بارہ ہزار اور نزار آٹھ ہزار ہے۔ پھر المغیرہ بن شعبہ نے مسجد کو بڑا کیا۔ زیاد نے اسے پختہ بنایا اور حکومت کا گھر بنایا۔ زیاد کہتا تھا: میں نے مسجد کوفہ کے ہر کالم پر اٹھارہ سو خرچ کئے۔ عمرو بن ہریث المخزومی نے اس میں تعمیر کی اور زیاد بصرہ سے نکلتے وقت اسے کوفہ میں اپنا نائب مقرر کرتا۔ اس میں اور مسجد بصرہ میں کنکریاں بکھیرنے کی وجہ یہ تھی کہ لوگ نماز پڑھتے تھے اور جب اپنے ہاتھ اٹھاتے تھے جو خاک آلود ہو چکے تھے تو انہیں جھاڑ دیتے تھے۔ زیاد نے کہا: مجھے یہ کیسا ڈر ہے کہ آنے والے زمانے کے لوگ یہ خیال کریں گے کہ ہاتھ ملانا نماز میں سنت ہے! چنانچہ اس نے مسجد کو کشادہ اور کشادہ کیا اور کنکریوں کو جمع کرنے اور اس کے صحن میں ڈالنے کا حکم دیا۔ ابو عبیدہ نے کہا کہ کوفہ کی بنیاد ⁦(تکویف)⁩ اٹھارہ میں ہوئی۔ زیاد نے کوفہ کی مسجد میں مقصورہ بنایا تھا اور خالد بن عبد اللہ القسری نے اس کی تجدید کی۔ کہا جاتا ہے کہ مسلمان سب سے پہلے المدائن میں آباد ہوئے، وہاں پلاٹ بچھا کر مساجد تعمیر کیں، پھر اسے غیر صحت بخش اور وبائی مرض معلوم ہوا۔ سعد نے عمر کو لکھا، اور اس نے واپس لکھا کہ انہیں مغرب کی طرف ایک جگہ پر آباد کیا جائے۔ انہوں نے کویفہ ابن عمر کو اسکاؤٹ کرنے کے لیے بھیجا، اور چاروں طرف پانی تلاش کرتے ہوئے، وہ آگے بڑھے یہاں تک کہ وہ موجودہ کوفہ کے مقام پر پہنچے، وہ اونچی جگہ جسے خدۃ الاضرا کہتے ہیں، جہاں لیوینڈر ⁦(خزامہ)⁩، کیمومائل، کیڑے کی لکڑی، جنوبی لکڑی اور انیمونز اگتے تھے۔ انہوں نے وہاں پلاٹ بنائے۔ کوفہ اور حیرہ کے درمیان کی سرزمین کو ملاتات کہا جاتا تھا۔ سعد نے دروازے کے ساتھ ایک لکڑی کا دروازہ بنایا تھا اور اپنے محل کو سرکنڈوں کے پردے سے باڑ دیا تھا۔ عمر نے محمد بن مسلمہ الانصاری کو بھیجا جس نے دروازے اور پردے کو جلا دیا اور سعد کو کوفہ کی مساجد میں رکھا۔"
  tr: "Bazıları, Saad bin Abi Vakkas'ın Kûfe'yi on beşinci yılda kurduğunu ve İbn Bukayya'nın onlara yerini gösterdiğini, böylece bu isimle bilinen yere yerleştiklerini söyledi. {Kaynak: Tabari-tarikh-abu-al-fadl, 3. cilt, s. 598}. El-Baladhuri'ye göre: Ömer, Saad'a Müslümanlar için kalıcı bir yerleşim yeri, Kayravan adında bir şehir kurmasını ve aralarına deniz koymamasını emretti. Saad, Anbar'a gitti ve oraya yerleşmeyi amaçladı, ancak sinekler çoğaldı, bu yüzden başka bir yere taşındı, ancak bu yer de uygunsuz çıktı. Daha sonra Kûfe'ye taşındı, sınırlarını belirledi, insanlara evler tahsis etti, kabileleri yurtlarına yerleştirdi ve camisini inşa etti. Bu, Hicri on yedinci yılda gerçekleşti. Sivrisinekler bölgeyi istila etti, bu yüzden Saad, Ömer'e insanların sivrisinek ısırıklarından ve acı çekmelerinden şikayet eden bir mektup yazdı. Ömer cevap yazarak, \"Araplar develer gibidir; develer için uygun olan her şey onlara da yarar. Onlara uygun bir yer bulun ve aramıza deniz koymayın.\" dedi. Yerleşimi denetlemek üzere Ebu el-Hayyaj el-Asadi, Amr ibn Malik ibn Ca'ada'yı görevlendirdi. Sonra Abdülmesih ibn Bakila, Sa'd'a gelerek, \"Sana çölden aşağı doğru eğimli ve dağların üzerinde yükselen bir yer göstereceğim.\" dedi. Ona, günümüzdeki Kufa'nın bulunduğu, Suristan olarak adlandırılan yeri gösterdi. Caminin bulunduğu yere vardığında, bir adama kıble yönüne doğru bir ok atıp yerini işaretlemesini emretti. Sonra başka bir adama kuzey yönüne doğru bir ok atıp yerini işaretlemesini emretti. Güney rüzgarına doğru bir ok atıp yerini işaretledi. Sonra doğu rüzgarına doğru bir ok atıp yerini işaretledi. Ardından camiyi ve vali konutunu yüksek bir yere ve çevresine yerleştirdi. Nizar ve Yemen halkına iki pay ayırdı ve okunu ilk çekenin, ikisinden daha iyi olan sol tarafı alacağını şart koştu. Yemen halkının oku çekildi, böylece onların arsaları doğu tarafında, Nizar'ın arsaları ise bu işaretlerin ötesinde, batı tarafında kaldı. Bunların ötesinde kalan kısmı cami avlusu ve vali konutu olarak bıraktı. El-Şabi, \"Biz, yani Yemen halkı, on iki bin kişiydik, Nizar ise sekiz bin kişiydi\" dedi. Sonra El-Muğira ibn Şuba camiyi genişletti, Ziyad da camiyi inşa edip güçlendirdi ve vali konutunu yaptırdı. Ziyad, \"Kûfe camisinin her bir sütununa bin sekiz yüz lira harcadım\" derdi. Amr ibn Hurayth el-Makhzumi orada bir yapı inşa etti ve Ziyad, Basra'ya gittiğinde onu Kûfe'deki vekili olarak atardı. Mescidin içine ve Basra mescidine çakıl taşı atılmasının sebebi, insanların namaz kılarken ellerini kaldırdıklarında tozlanan ellerini silkelemeleriydi. Ziyad, \"Korkarım ki insanlar gelecekte el sıkışmanın namazda sünnet olduğunu düşünecekler\" dedi ve mescidi genişletti. Genişletme işlemi sırasında, mescidin avlusuna çakıl taşları toplanıp atılmasını emretti. Ebu Ubeyde, Kufa'nın inşasının on sekizinci yılda gerçekleştiğini söyledi. Ziyad, Kufa mescidine bir köşk inşa ettirmiş, daha sonra Halid bin Abdullah el-Kasri onu yenilemiştir. Müslümanların Medine'de kaldıkları, sınırlarını belirledikleri ve mescitler inşa ettikleri, ancak daha sonra buranın sağlıksız ve hijyenik olmadığını gördükleri söylenir. Bunun üzerine Saad, Ömer'e yazdı ve Ömer de ona, \"Onları batıda bir yere yerleştirin\" diye cevap verdi. Böylece Ömer'in Kufa şehrini aradılar ve etrafının suyla çevrili olduğunu gördüler. Bu yüzden yola koyuldular ve bugün Kufa şehrine geldiler, öğle vakti vardılar. Buraya Khad al-Adhra deniyordu ve lavanta, papatya, pelin otu, civanperçemi ve anemonlar yetişiyordu. Böylece sınırlarını belirlediler. Kufa ile Hira arasındaki bölgeye al-Malatat deniyordu. Saad, tahtadan bir kapı yaptırdı ve sarayının üzerine kamıştan bir kulübe inşa etti. Ömer, Muhammed bin Maslama al-Ansari'yi gönderdi, o da kapıyı ve kulübeyi yaktı ve Saad Kufa camilerinde kaldı."
  id: "Sebagian dari mereka mengatakan bahwa Saad bin Abi Waqqas mendirikan Kufa pada tahun kelima belas, dan Ibnu Buqaila menunjukkan kepada mereka lokasinya, sehingga mereka menetap di tempat yang dikenal dengan nama itu {kutip:tabari-tarikh-abu-al-fadl j.3 hlm.598}. Menurut al-Baladhuri: Umar menulis surat kepada Sa'd, memerintahkannya untuk mendirikan pemukiman permanen bagi kaum Muslimin, sebuah kota bernama Qayrawan, dan tidak menempatkan laut di antara mereka. Sa'd pergi ke Anbar dan bermaksud untuk menetap di sana, tetapi lalat merajalela, sehingga ia pindah ke lokasi lain, yang juga terbukti tidak cocok. Kemudian ia pindah ke Kufa, menetapkan batas-batasnya, mengalokasikan rumah-rumah kepada penduduk, menempatkan suku-suku di tempat tinggal mereka, dan membangun masjidnya. Ini terjadi pada tahun ketujuh belas (Hijrah). Nyamuk mewabah di daerah itu, sehingga Sa'd menulis surat kepada Umar memberitahukan bahwa orang-orang digigit dan menderita karenanya. Umar membalas, \"Orang Arab itu seperti unta; hanya apa yang cocok untuk unta yang akan berhasil bagi mereka. Carikan mereka lokasi yang cocok dan jangan letakkan laut di antara kita.\" Dia menunjuk Abu al-Hayyaj al-Asadi, Amr ibn Malik ibn Ja'ada, untuk mengawasi pemukiman tersebut. Kemudian Abd al-Masih ibn Baqila datang kepada Sa'd dan berkata, \"Aku akan menunjukkan kepadamu tanah yang landai dari gurun dan menjulang di atas pegunungan.\" Dia menunjukkan kepadanya lokasi Kufa saat ini, yang disebut Suristan. Ketika dia sampai di lokasi masjidnya, dia memerintahkan seorang pria untuk menembakkan panah ke arah kiblat dan menandai lokasinya. Kemudian dia memerintahkan pria lain untuk menembakkan panah ke arah utara dan menandai lokasinya. Dia mengangkat panah ke arah angin selatan dan menandai lokasinya. Kemudian dia mengangkat panah ke arah angin timur dan menandai lokasinya. Kemudian dia menempatkan masjid dan kediaman gubernur di tempat yang tinggi dan sekitarnya. Ia membagi dua bagian kepada Nizar dan rakyat Yaman, dengan ketentuan bahwa siapa pun yang menarik panahnya terlebih dahulu akan mendapatkan sisi kiri, yang merupakan sisi yang lebih baik di antara keduanya. Panah rakyat Yaman ditarik, sehingga lahan mereka berada di sisi timur, dan lahan Nizar berada di sisi barat, di luar batas-batas tersebut. Ia meninggalkan apa yang berada di luar batas-batas itu sebagai halaman masjid dan kediaman gubernur. Al-Sha'bi berkata, \"Kami, maksudnya rakyat Yaman, berjumlah dua belas ribu, dan Nizar berjumlah delapan ribu.\" Kemudian Al-Mughira ibn Shu'ba memperluas masjid, dan Ziyad membangun dan memperkuatnya, serta membangun kediaman gubernur. Ziyad biasa berkata, \"Aku menghabiskan delapan belas ratus untuk setiap pilar masjid Kufa.\" Amr ibn Hurayth al-Makhzumi membangun sebuah bangunan di sana, dan Ziyad akan menunjuknya sebagai wakilnya di Kufa ketika ia melakukan perjalanan ke Basra. Alasan melempar kerikil di masjid itu dan di masjid Basra adalah karena orang-orang biasa shalat, dan ketika mereka mengangkat tangan mereka yang berdebu, mereka akan mengibaskannya. Ziyad berkata, \"Aku khawatir orang-orang akan berpikir di masa depan bahwa mengibaskan tangan adalah sunnah dalam shalat,\" jadi dia memperluas masjid. Dia memperluasnya dan memerintahkan agar kerikil dikumpulkan dan dilemparkan ke halaman masjid. Abu Ubaidah berkata bahwa pembangunan Kufa terjadi pada tahun 18. Ziyad telah membangun paviliun di masjid Kufa, kemudian Khalid bin Abdullah al-Qasri memperbaruinya. Dikatakan bahwa kaum Muslim tinggal di Madinah dan menetapkan batas-batasnya serta membangun masjid-masjid di sana, kemudian mereka mendapati tempat itu tidak sehat dan tidak higienis. Maka Saad menulis surat kepada Umar, dan Umar membalasnya, \"Tempatkan mereka di tempat yang lebih barat.\" Maka mereka mencari Kufa bin Umar, dan mereka melihat bahwa tempat itu dikelilingi air. Maka mereka pergi hingga sampai ke tempat Kufa sekarang, dan mereka tiba pada tengah hari. Tempat itu disebut Khad al-Adhra, tempat tumbuh lavender, aster, apsintus, yarrow, dan anemone. Maka mereka menetapkan batas-batasnya. Wilayah antara Kufa dan Hira disebut al-Malatat. Saad membuat gerbang dari kayu dan membangun gubuk dari alang-alang di atas istananya. Umar mengutus Muhammad bin Maslama al-Ansari untuk membakar gerbang dan gubuk tersebut, dan Saad tinggal di masjid-masjid Kufa."
