label: { ar: "خطبة أبي بكر يوم وفاة النبي وما قيل في يوم الوفاة وساعتها", en: "Abu Bakr's address on the day of the Prophet's death, and what is reported of its day and hour", fr: "Discours d’Abu Bakr le jour de la mort du Prophète et récits sur le jour et l’heure de sa mort", ur: "نبی کی وفات کے دن ابوبکر کا خطاب، اور وفات کے دن اور وقت کے بارے میں روایات", es: "Discurso de Abu Bakr el día de la muerte del Profeta, y lo que se narra de ese día y hora.", tr: "Ebu Bekir'in Peygamberimizin vefat günündeki hutbesi ve vefat günü ve sırasında söylenenler.", id: "Khutbah Abu Bakar pada hari wafatnya Nabi, dan apa yang dikatakan pada hari dan saat wafatnya beliau." }
summary:
  ar: "لما توفي النبي أقبل أبو بكر من السنح فكشف عن وجهه وقبله وقال إن الله لا يجمع عليه موتتين {cite:fath-al-bari scan vol. 1 p. 337}، ثم خرج إلى الناس وعمر يكلمهم فقال من كان يعبد محمداً فإن محمداً قد مات ومن كان يعبد الله فإن الله حي لا يموت، وتلا آيتي الزمر 30 وآل عمران 144 {cite:fath-al-bari scan vol. 1 p. 337}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 268}. وينقل ابن كثير في رواية عروة خطبة أطول فيها آيات أخرى وقوله إن كتاب الله بين أظهرهم وإن من كان الله ربه فإن الله حي لا يموت {cite:al-bidaya-wal-nihaya scan vol. 3 p. 269}. ويورد كذلك اختلاف الأقوال في يوم الوفاة وساعتها، فيذكر قول ابن إسحاق والواقدي أنها يوم الاثنين لاثنتي عشرة ليلة خلت من ربيع الأول، وأقوال أخرى بغير ذلك، وأن الوفاة كانت حين اشتد الضحى وقيل عند زوال الشمس {cite:al-bidaya-wal-nihaya scan vol. 3 p. 270}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 282}."
  en: "When the Prophet died Abu Bakr came from al-Sunh, uncovered his face, kissed him and said that God would not make him taste death twice {cite:fath-al-bari scan vol. 1 p. 337}; he then went out to the people while Umar was speaking to them and said that whoever worshipped Muhammad should know that Muhammad had died, and whoever worshipped God should know that God is living and does not die, and he recited the verses of al-Zumar 39:30 and Al Imran 3:144 {cite:fath-al-bari scan vol. 1 p. 337}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 268}. In Urwa's report Ibn Kathir gives a longer address with further verses and the words that the Book of God was among them and that whoever had God as his Lord, God is living and does not die {cite:al-bidaya-wal-nihaya scan vol. 3 p. 269}. He also sets out the differing reports on the day and hour of the death: Ibn Ishaq and al-Waqidi say Monday, twelve nights past of Rabi' al-Awwal, others give other dates, and the hour was when the forenoon grew intense, or at noon according to another report {cite:al-bidaya-wal-nihaya scan vol. 3 p. 270}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 282}."
  fr: "À la mort du Prophète, Abu Bakr vint d’al-Sunh, découvrit son visage, l’embrassa et dit que Dieu ne lui ferait pas goûter deux fois la mort {cite:fath-al-bari scan vol. 1 p. 337} ; il sortit ensuite auprès des gens tandis qu’Omar leur parlait et dit que quiconque adorait Muhammad devait savoir que Muhammad était mort, et que quiconque adorait Dieu devait savoir que Dieu est vivant et ne meurt pas ; il récita les versets al-Zumar 39:30 et Al Imran 3:144 {cite:fath-al-bari scan vol. 1 p. 337}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 268}. Dans le récit d’Urwa, Ibn Kathir donne un discours plus long avec d’autres versets et les paroles selon lesquelles le Livre de Dieu était parmi eux et que, pour quiconque avait Dieu pour Seigneur, Dieu est vivant et ne meurt pas {cite:al-bidaya-wal-nihaya scan vol. 3 p. 269}. Il expose aussi les récits divergents sur le jour et l’heure de la mort : Ibn Ishaq et al-Waqidi disent le lundi, douze nuits après le début de rabi' al-awwal, d’autres donnent d’autres dates ; l’heure était celle où la matinée devenait brûlante, ou midi selon un autre récit {cite:al-bidaya-wal-nihaya scan vol. 3 p. 270}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 282}."
  ur: "جب نبی کی وفات ہوئی تو ابوبکر سنح سے آئے، آپ کے چہرے سے کپڑا ہٹایا، بوسہ دیا اور کہا کہ اللہ آپ کو دو بار موت کا ذائقہ نہیں چکھائے گا {cite:fath-al-bari scan vol. 1 p. 337}؛ پھر لوگوں کی طرف نکلے جبکہ عمر ان سے بات کر رہے تھے، اور کہا کہ جو محمد کی عبادت کرتا تھا وہ جان لے کہ محمد وفات پا گئے، اور جو اللہ کی عبادت کرتا ہے وہ جان لے کہ اللہ زندہ ہے اور مرتا نہیں، اور سورۂ زمر 30 اور آل عمران 144 کی آیات تلاوت کیں {cite:fath-al-bari scan vol. 1 p. 337}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 268}۔ ابن کثیر عروہ کی روایت میں ایک لمبا خطاب لاتے ہیں جس میں مزید آیات ہیں اور یہ الفاظ کہ اللہ کی کتاب ان کے درمیان ہے اور جس کا رب اللہ ہے تو اللہ زندہ ہے، مرتا نہیں {cite:al-bidaya-wal-nihaya scan vol. 3 p. 269}۔ وہ وفات کے دن اور وقت کے بارے میں مختلف اقوال بھی لاتے ہیں: ابن اسحاق اور واقدی کے مطابق پیر، ربیع الاول کی بارہ راتیں گزرنے پر، دوسرے اقوال میں دوسری تاریخیں، اور وقت چاشت کی شدت یا ایک اور روایت میں زوال {cite:al-bidaya-wal-nihaya scan vol. 3 p. 270}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 282}۔"
  es: "Cuando el Profeta murió, Abu Bakr vino de al-Sunh, descubrió su rostro, lo besó y dijo que Dios no le haría probar la muerte dos veces {cite:fath-al-bari scan vol. 1 p. 337}; luego salió a la gente mientras Umar les hablaba y dijo que quienquiera que adorara a Muhammad debía saber que Muhammad había muerto, y quienquiera que adorara a Dios debía saber que Dios está vivo y no muere, y recitó los versículos de al-Zumar 39:30 y Al Imran 3:144 {cite:fath-al-bari scan vol. 1 p. 337}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 268}. En el informe de Urwa, Ibn Kathir da un discurso más largo con más versículos y las palabras de que el Libro de Dios estaba entre ellos y que quienquiera que tuviera a Dios como su Señor, Dios está vivo y no muere {cite:al-bidaya-wal-nihaya scan vol. 3 pág. 269}. También expone los diferentes informes sobre el día y la hora de la muerte: Ibn Ishaq y al-Waqidi dicen que el lunes, doce noches después de Rabi' al-Awwal, otros dan otras fechas, y la hora fue cuando la mañana se intensificó, o al mediodía según otro informe {cite:al-bidaya-wal-nihaya scan vol. 3 pág. 270}{cite:al-bidaya-wal-nihaya scan vol. 3 pág. 282}."
  tr: "Peygamber vefat ettiğinde, Ebu Bekir Sünnet'ten geldi, yüzünü açtı, onu öptü ve \"Allah bir kişiye iki ölüm nasip etmez\" dedi. {kaynak: Fatiha el-Bari, cilt 1, s. 337} Sonra halkın yanına çıktı ve Ömer onlarla konuşuyordu. Ebu Bekir, \"Kim Muhammed'e ibadet ederse, Muhammed ölmüştür. Kim de Allah'a ibadet ederse, Allah diridir ve ölmez\" dedi. Ardından Zümer Suresi'nin 30. ve İmran Suresi'nin 144. ayetlerini okudu. {kaynak: Fatiha el-Bari, cilt 1, s. 337} {kaynak: El-Bidaya ve'l-Nihaya, cilt 3, s. 268}. İbn Kathir, Urve'nin rivayetinde, diğer ayetleri de içeren daha uzun bir hutbeyi ve Allah'ın Kitabı'nın da bunlar arasında olduğunu ve Allah'ı Rabb olarak kabul eden kimsenin Allah'ın diri olduğunu ve ölmediğini ifade eden bir sözü aktarır. {cite:al-bidaya-wal-nihaya scan vol. 3 p. 269}. Ayrıca, İbn İshak ve El-Vakidi'nin ölümün Rabi' el-Evvel ayının bitiminden on iki gece önce, Pazartesi günü gerçekleştiği yönündeki ifadelerini ve bundan farklı olan diğer rivayetleri aktararak, ölümün güneşin en yüksek noktasında olduğu bir zamanda gerçekleştiğini ve güneşin battığı bir zamanda gerçekleştiğini de belirtmektedir. {cite:al-bidaya-wal-nihaya scan vol. 3 p. 270}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 282}."
  id: "Ketika Nabi wafat, Abu Bakar datang dari As-Sunh, menyingkap wajah beliau, menciumnya, dan berkata, “Allah tidak menyebabkan dua kematian bagi satu orang.” {cite:fath-al-bari scan vol. 1 p. 337} Kemudian beliau keluar menemui orang-orang, dan Umar sedang berbicara kepada mereka. Beliau berkata, “Siapa pun yang menyembah Muhammad, maka Muhammad telah wafat. Dan siapa pun yang menyembah Allah, maka Allah hidup dan tidak mati.” Kemudian beliau membacakan ayat 30 dari Surah Az-Zumar dan ayat 144 dari Surah Al-Imran. {cite:fath-al-bari scan vol. 1 p. 337} {cite:al-bidaya-wal-nihaya scan vol. 3 p. 268}. Ibn Kathir, dalam riwayat Urwah, menceritakan khutbah yang lebih panjang yang berisi ayat-ayat lain dan pernyataannya bahwa Kitab Allah termasuk di antaranya, dan bahwa siapa pun yang menjadikan Allah sebagai Tuhannya, maka Allah hidup dan tidak mati. {cite:al-bidaya-wal-nihaya scan vol. 3 p. 269}. Ia juga menyebutkan berbagai riwayat mengenai hari dan waktu kematian, mengutip pernyataan Ibn Ishaq dan Al-Waqidi bahwa kematian terjadi pada hari Senin, dua belas malam sebelum berakhirnya Rabi' al-Awwal, dan riwayat lain yang berbeda dari itu, dan bahwa kematian terjadi ketika matahari berada di puncak pagi hari, dan dikatakan bahwa kematian terjadi pada saat matahari terbenam. {cite:al-bidaya-wal-nihaya scan vol. 3 p. 270}{cite:al-bidaya-wal-nihaya scan vol. 3 p. 282}."
