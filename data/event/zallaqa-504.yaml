label: { ar: "الملحمة الكبيرة بين ابن تاشفين والفرنج" }
summary:
  ar: "في سنة أربع وخمس مئة كانت ملحمة كبيرة بين الفرنج وبين ابن تاشفين صاحب الأندلس نصر فيها المسلمون وقتلوا وأسروا وغنموا ما لا يعبر عنه وبادت شجعان الفرنج {cite:tarikh-khulafa-minhaj-1434 p. 660}.، وعند ابن خلدون لقي المعتمد بن عباد وابن الأفطس المرابطين بالزلاقة من نواحي بطليوس فكان دفاع لمتونة مما فت في عضد الفرنج {cite:tarikh-ibn-khaldun-ibar p. 1648}. وعند المقري ناقلاً عن الروض المعطار وابن خلكان: رأى الأذفونش في نومه أنه راكب فيل يضرب نقيرة طبل فأوّلها معبّر مسلم ببلاء عظيم فيه وفي عسكره، وواعد الأذفونش المسلمين لقاء يوم السبت بين الجمعة والأحد ثم غدر فأقبل سحر يوم الجمعة منتصف رجب، وكان يقول لأصحابه ابن عباد مسعر هذه الحروب فاقصدوه واهجموا عليه، فأحاطت به الخيل وأنحن جراحات وضُرب على رأسه حتى وصلت الضربة صدغه وعُقرت تحته ثلاثة أفراس وهو يقاسي حياض الموت ويقول أبا هاشم هشمتني الشقار، فأول من وافاه من قواد ابن تاشفين داود بن عائشة ثم أقبل يوسف وطبوله تصعد إلى الجو، وأمر حشمة السودان فترجل منهم زهاء أربعة آلاف بدرق اللمط وسيوف الهند ومزاريق الران فقطعوا الخيل فرمحت بفرسانها، وتلاحق الأذفونش بأسود نقدت مزاريقه فلصق به وقبض على عنانه وأثبت خنجراً في فخذه نفذ مع بِداد سرجه، وكان وقت الزوال فهبت ريح النصر وولّى الأذفونش هارباً بعدما طُعن في ركبته طعنة بقي يخمع بها بقية عمره، ولجأ إلى تل في نحو خمسمائة فارس كلهم مكلوم وأباد القتل والأسر من عداهم، وضمّ المسلمون رؤوس القتلى تلاً عظيماً واتخذوا منها صوامع يؤذنون عليها، وكتب المعتمد إلى ابنه بإشبيلية كتاب الفتح من المحلة المنصورة يوم الجمعة الموفي عشرين من رجب، واستُشهد يومئذ الفقيه أبو العباس أحمد بن رميلة القرطبي صاحب الرؤيا وقاضي مراكش أبو مروان عبد الملك المصمودي، وأقامت العساكر بالموضع أربعة أيام حتى جمعت الغنائم {cite:nafh-tib-maqqari p. 363-368}."
  en: "In 504 came the great melhama between the Franks and Ibn Tashfin, lord of al-Andalus: the Muslims were victorious, killed, captured and took spoil past telling, and the Franks' bravest perished {cite:tarikh-khulafa-minhaj-1434 p. 660}."
