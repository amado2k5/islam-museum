label: { ar: "الملحمة الكبيرة بين ابن تاشفين والفرنج", en: "The Great Battle Between Ibn Tashfin and the Franks", es: "La gran batalla entre Ibn Tashfin y los francos", fr: "La grande bataille entre Ibn Tashfin et les Francs", ur: "ابن تاشفین اور فرینک کے درمیان عظیم جنگ", tr: "İbn Taşfin ile Franklar arasındaki büyük destan", id: "Kisah epik besar antara Ibnu Tashfin dan bangsa Frank." }
summary:
  ar: "في سنة أربع وخمس مئة كانت ملحمة كبيرة بين الفرنج وبين ابن تاشفين صاحب الأندلس نصر فيها المسلمون وقتلوا وأسروا وغنموا ما لا يعبر عنه وبادت شجعان الفرنج {cite:tarikh-khulafa-minhaj-1434 p. 660}. وعند ابن خلدون لقي المعتمد بن عباد وابن الأفطس المرابطين بالزلاقة من نواحي بطليوس فكان دفاع لمتونة مما فت في عضد الفرنج {cite:tarikh-ibn-khaldun-ibar p. 1648}. وعند المقري ناقلاً عن الروض المعطار وابن خلكان: رأى الأذفونش في نومه أنه راكب فيل يضرب نقيرة طبل فأوّلها معبّر مسلم ببلاء عظيم فيه وفي عسكره، وواعد الأذفونش المسلمين لقاء يوم السبت بين الجمعة والأحد ثم غدر فأقبل سحر يوم الجمعة منتصف رجب، وكان يقول لأصحابه ابن عباد مسعر هذه الحروب فاقصدوه واهجموا عليه، فأحاطت به الخيل وأنحن جراحات وضُرب على رأسه حتى وصلت الضربة صدغه وعُقرت تحته ثلاثة أفراس وهو يقاسي حياض الموت ويقول أبا هاشم هشمتني الشقار، فأول من وافاه من قواد ابن تاشفين داود بن عائشة ثم أقبل يوسف وطبوله تصعد إلى الجو، وأمر حشمة السودان فترجل منهم زهاء أربعة آلاف بدرق اللمط وسيوف الهند ومزاريق الران فقطعوا الخيل فرمحت بفرسانها، وتلاحق الأذفونش بأسود نقدت مزاريقه فلصق به وقبض على عنانه وأثبت خنجراً في فخذه نفذ مع بِداد سرجه، وكان وقت الزوال فهبت ريح النصر وولّى الأذفونش هارباً بعدما طُعن في ركبته طعنة بقي يخمع بها بقية عمره، ولجأ إلى تل في نحو خمسمائة فارس كلهم مكلوم وأباد القتل والأسر من عداهم، وضمّ المسلمون رؤوس القتلى تلاً عظيماً واتخذوا منها صوامع يؤذنون عليها، وكتب المعتمد إلى ابنه بإشبيلية كتاب الفتح من المحلة المنصورة يوم الجمعة الموفي عشرين من رجب، واستُشهد يومئذ الفقيه أبو العباس أحمد بن رميلة القرطبي صاحب الرؤيا وقاضي مراكش أبو مروان عبد الملك المصمودي، وأقامت العساكر بالموضع أربعة أيام حتى جمعت الغنائم {cite:nafh-tib-maqqari p. 363-368}."
  en: "In 504 came the great melhama between the Franks and Ibn Tashfin, lord of al-Andalus: the Muslims were victorious, killed, captured and took spoil past telling, and the Franks' bravest perished {cite:tarikh-khulafa-minhaj-1434 p. 660}."
  es: "En 504 tuvo lugar la gran melhama entre los francos e Ibn Tashfin, señor de al-Ándalus: los musulmanes fueron victoriosos, mataron, capturaron y se llevaron un botín incalculable, y los más valientes de los francos perecieron {cite:tarikh-khulafa-minhaj-1434 p. 660}."
  fr: "En 504 eut lieu la grande melhama entre les Francs et Ibn Tashfin, seigneur d'al-Andalus: les musulmans furent victorieux, tuèrent, capturèrent et prirent un butin incommensurable, et les plus braves Francs périrent {cite:tarikh-khulafa-minhaj-1434 p. 660}."
  ur: "504 میں فرانکس اور ابن تاشفین کے درمیان عظیم میلہ ہوا، اندلس کے مالک: مسلمان فتح یاب ہوئے، مارے گئے، پکڑے گئے اور ماضی کی باتوں کو غنیمت جانا، اور فرینکوں کا سب سے بہادر فنا ہو گیا۔ 660}۔"
  tr: "Hicri 504 yılında, Franklar ile Endülüs hükümdarı İbn Taşfin arasında büyük bir savaş yaşandı; Müslümanlar bu savaşta zafer kazandı, sayısız ganimet elde etti, düşman askerlerini öldürdü, esir aldı ve Frank savaşçıları yok oldu. {kaynak:tarikh-khulafa-minhaj-1434 s. 660}. İbn Haldun'a göre, Al-Mu'tamid ibn Abbad ve İbn al-Aftas, Badajoz yakınlarındaki Zallaqa'da Almoravidlerle karşılaştı ve Lamtuna savunması Frankları zayıflattı. {kaynak:tarikh-ibn-khaldun-ibar s. 1648}. Al-Maqqari, Al-Rawd al-Mu'attar ve İbn Hallikan'dan alıntı yaparak, Alfonso'nun rüyasında bir filin üzerinde davul çaldığını gördüğünü anlatır. Bir Müslüman yorumcu bunu, kendisine ve ordusuna büyük bir felaketin geleceği şeklinde açıklamıştır. Alfonso, Cuma ve Pazar günleri arasında, Cumartesi günü Müslümanlarla buluşmayı ayarlamıştı, ancak sonra onlara ihanet etti. Cuma günü şafak vakti, Receb ayının ortasında geldi ve arkadaşlarına, \"İbn Abbad bu savaşların kışkırtıcısıdır, o yüzden peşinden gidin ve ona saldırın\" dedi. Atlar onu kuşattı ve yaralandı, başına aldığı darbeler şakağına kadar ulaştı. Ölmek üzereyken, \"Ey Ebu Haşim, haydutlar beni ezdi!\" diye ağlarken, üç atı altında ezilmişti. İbn Tashfin'in komutanlarından ona ilk ulaşan Davud ibn Aişe oldu, ardından davulları havaya yükselen Yusuf geldi. Sudanlı muhafızlarına emir verdi ve yaklaşık dört bin kişi kalkanlar, Hint kılıçları ve mızraklarla donanmış olarak atlarından indi. Atları kestiler ve atlar binicileriyle birlikte kaçtı. Alfonso, mızrakları kesilmiş siyahi bir adamla onu takip etti; adama yapıştı, dizginlerini kaptı ve uyluğuna bir hançer sapladı; hançer onu deldi... Adam eyerini çıkardı ve öğle vakti zafer rüzgarı estiğinde Alfonso, dizinden bıçaklanarak ömür boyu topal kalmasına neden olacak bir yara aldıktan sonra kaçtı. Yaklaşık beş yüz süvariyle birlikte bir tepeye sığındı; hepsi yaralıydı, geri kalanını öldürdü ve esir aldı. Müslümanlar öldürülenlerin başlarını büyük bir tepeye topladılar ve onlardan ezan okudukları minareler yaptılar. Al-Mu'tamid, zafer mektubunu Sevilla'daki oğluna, Receb ayının yirminci Cuma günü, zafer kampından yazdı. O gün, hukukçu Ebu el-Abbas Ahmed ibn Rumaila el-Kurtubi ve Marakeş kadısı Ebu Mervan Abd el-Malik el-Mesmuudi şehit edildi. Askerler ganimetleri toplayana kadar dört gün boyunca o yerde kaldılar."
  id: "Pada tahun 504 H, terjadi pertempuran besar antara kaum Frank dan Ibn Tashfin, penguasa Andalusia, di mana kaum Muslimin meraih kemenangan, membunuh, menangkap, dan mengambil rampasan perang yang tak terlukiskan, sementara para prajurit Frank binasa. {cite:tarikh-khulafa-minhaj-1434 hlm. 660}. Menurut Ibn Khaldun, Al-Mu'tamid ibn Abbad dan Ibn al-Aftas bertemu dengan Almoravid di Zallaqa, dekat Badajoz, dan pertahanan Lamtuna melemahkan kaum Frank. {cite:tarikh-ibn-khaldun-ibar hlm. 1648}. Al-Maqqari, mengutip Al-Rawd al-Mu'attar dan Ibn Khallikan, menceritakan bahwa Alfonso melihat dalam mimpinya bahwa ia sedang menunggangi gajah, memukul genderang. Seorang penafsir Muslim menjelaskan hal ini sebagai malapetaka besar yang menimpa dirinya dan pasukannya. Alfonso mengatur pertemuan dengan kaum Muslimin pada hari Sabtu, antara Jumat dan Minggu, tetapi kemudian mengkhianati mereka. Ia tiba pada subuh hari Jumat, pertengahan bulan Rajab, dan berkata kepada para sahabatnya, \"Ibn Abbad adalah penghasut perang ini, jadi kejarlah dia dan seranglah dia.\" Kuda-kuda mengepungnya, dan ia terluka serta dipukul di kepala hingga pukulan itu mencapai pelipisnya. Tiga kuda diikat kakinya di bawahnya saat ia sekarat, sambil menangis, \"Wahai Abu Hashim, para perampok telah menghancurkanku!\" Komandan pertama Ibn Tashfin yang sampai kepadanya adalah Dawud ibn Aisha, diikuti oleh Yusuf, yang genderangnya berdentum ke udara. Ia memerintahkan pengawal Sudan-nya, dan sekitar empat ribu dari mereka turun dari kuda, bersenjata perisai, pedang India, dan tombak. Mereka menebas kuda-kuda itu, yang kemudian melarikan diri bersama para penunggangnya. Alfonso mengejarnya dengan seorang pria berkulit hitam yang tombaknya telah dipotong, dan dia berpegangan padanya, meraih kendalinya, dan menusukkan belati ke pahanya, yang menembus... Dia melepaskan pelana kudanya, dan saat itu tengah hari ketika angin kemenangan bertiup, dan Alfonso melarikan diri setelah ditusuk di lututnya dengan luka yang akan membuatnya pincang seumur hidupnya. Dia berlindung di sebuah bukit dengan sekitar lima ratus penunggang kuda, semuanya terluka, dan membunuh serta menangkap sisanya. Kaum Muslim mengumpulkan kepala-kepala orang yang terbunuh di sebuah bukit besar dan menjadikannya menara-menara tempat mereka mengumandangkan azan. Al-Mu'tamid menulis surat kemenangan kepada putranya di Sevilla dari perkemahan yang menang pada hari Jumat, tanggal dua puluh Rajab. Pada hari itu, ahli hukum Abu al-Abbas Ahmad ibn Rumaila al-Qurtubi, sang visioner, dan hakim Marrakesh, Abu Marwan Abd al-Malik al-Masmuudi, gugur sebagai syahid. Pasukan tersebut tinggal di tempat itu selama empat hari hingga mereka mengumpulkan rampasan perang."
