label:
  ar: "تلمذة الكليني في قم، العقد الأخير من القرن الثالث"
  en: "al-Kulayni's studies at Qumm, last decade of the third century"
  ur: "کلینی کی قم میں تعلیم، تیسری صدی کا آخری عشرہ"
summary:
  ar: "يقول معجم الإسلام: لما كان أبرز شيوخ [[person/al-kulayni|الكليني]] من علماء [[place/qumm|قم]]، فمن الثابت أنه درس فيها مدة طويلة، وأرجح الظن أن ذلك كان في العقد الأخير من القرن الثالث الهجري (٩٠٣–٩١٣م) {cite:encyclopaedia-of-islam-2 vol. 5 p. 400}."
  en: "The EI2: since al-Kulayni's chief teachers were scholars of Qumm, he must have studied in that town for a prolonged time, most likely in the last decade of the 3rd century AH (903-913) {cite:encyclopaedia-of-islam-2 vol. 5 p. 400}."
  ur: "دائرۃ المعارفِ اسلام کے مطابق چوں کہ کلینی کے اصل اساتذہ [[place/qumm|قم]] کے علماء تھے، اس لیے یقینی ہے کہ وہ وہاں طویل عرصہ درس پڑھتا رہا، غالباً تیسری صدی ہجری کے آخری عشرے (903–913ء) میں {cite:encyclopaedia-of-islam-2 vol. 5 p. 400}۔"
