label:
  ar: "تلمذة الكليني في قم، العقد الأخير من القرن الثالث"
  en: "al-Kulayni's studies at Qumm, last decade of the third century"
  ur: "کلینی کی قم میں تعلیم، تیسری صدی کا آخری عشرہ"
  es: "Los estudios de al-Kulayni en Qumm, última década del siglo III."
  fr: "Les études d'al-Kulayni à Qumm, dernière décennie du IIIe siècle"
  tr: "El-Kulayni'nin Kum'daki müritliği, üçüncü yüzyılın son on yılı"
  id: "Masa kemuridan Al-Kulayni di Qom, dekade terakhir abad ketiga."
summary:
  ar: "يقول معجم الإسلام: لما كان أبرز شيوخ [[person/al-kulayni|الكليني]] من علماء [[place/qumm|قم]]، فمن الثابت أنه درس فيها مدة طويلة، وأرجح الظن أن ذلك كان في العقد الأخير من القرن الثالث الهجري ⁦(٩٠٣–٩١٣م)⁩ {cite:encyclopaedia-of-islam-2 vol. 5 p. 400}."
  en: "The EI2: since al-Kulayni's chief teachers were scholars of Qumm, he must have studied in that town for a prolonged time, most likely in the last decade of the 3rd century AH (903-913) {cite:encyclopaedia-of-islam-2 vol. 5 p. 400}."
  ur: "دائرۃ المعارفِ اسلام کے مطابق چوں کہ کلینی کے اصل اساتذہ [[place/qumm|قم]] کے علماء تھے، اس لیے یقینی ہے کہ وہ وہاں طویل عرصہ درس پڑھتا رہا، غالباً تیسری صدی ہجری کے آخری عشرے ⁦(903–913ء)⁩ میں {cite:encyclopaedia-of-islam-2 vol. 5 p. 400}۔"
  es: "El EI2: dado que los principales maestros de al-Kulayni eran eruditos de Qumm, debió haber estudiado en esa ciudad durante un tiempo prolongado, muy probablemente en la última década del siglo III AH (903-913) {cite:encyclopaedia-of-islam-2 vol. 5 p. 400}."
  fr: "L'EI2: puisque les principaux enseignants d'al-Kulayni étaient des érudits de Qumm, il a dû étudier dans cette ville pendant une période prolongée, très probablement dans la dernière décennie du 3e siècle AH (903-913) {cite:encyclopaedia-of-islam-2 vol. 5 p. 400}."
  tr: "İslam Ansiklopedisi şöyle der: [[Kuleyni]]'nin en önde gelen şeyhleri Kum alimleri olduğundan, orada uzun bir süre eğitim gördüğü kesindir ve bunun Hicri üçüncü yüzyılın son on yılında (903-913 MS) olduğu büyük olasılıkla doğrudur. {cite:encyclopaedia-of-islam-2 vol. 5 p. 400}."
  id: "Ensiklopedia Islam menyatakan: Karena para syekh terkemuka dari [[orang/al-kulayni|al-kulayni]] adalah ulama dari [[tempat/qumm|Qum]], maka dapat dipastikan bahwa beliau belajar di sana dalam jangka waktu yang lama, dan kemungkinan besar hal ini terjadi pada dekade terakhir abad ketiga Hijriah (903–913 M) {cite:encyclopaedia-of-islam-2 vol. 5 p. 400}."
