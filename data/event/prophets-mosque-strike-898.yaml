label: { ar: "صاعقة المسجد النبوي الثانية 898هـ", en: "The Second Lightning Strike on the Prophet's Mosque, 898", es: "El segundo rayo que cae sobre la mezquita del Profeta, 898", fr: "La seconde foudre frappant la mosquée du Prophète, 898", ur: "مسجد نبوی پر آسمانی بجلی کا دوسرا حملہ، 898", tr: "Peygamber Mescidi'ne ikinci yıldırım düşmesi, Hicri 898.", id: "Sambaran petir kedua di Masjid Nabi, 898 Hijriah" }
summary:
  ar: "في شذرات الذهب سنة ثمان وتسعين وثمان مئة وقعت صاعقة بالمسجد النبوي قبيل ظهر يوم الأربعاء ثامن عشر صفر أصابت المنارة الرئيسية بحيث تفطرت خوذة هلالها وسقط جانب دورها السفلي وكان فيها الطاعون العجيب ببرسا واحترق نحو نصفها أيضاً {cite:shadharat-dhahab p. 368}."
  en: "A second lightning strike on the Prophet's Mosque, Wednesday 18 Safar 898 — hitting the main minaret, shattering its crescent-helmet and felling its lower tier; the same year saw Bursa's wondrous plague and the burning of half the city {cite:shadharat-dhahab p. 368}."
  es: "Un segundo rayo cayó sobre la Mezquita del Profeta el miércoles 18 de Safar de 898, impactando el minarete principal, destrozando su yelmo en forma de media luna y derribando su nivel inferior; ese mismo año se produjo la maravillosa plaga de Bursa y el incendio de la mitad de la ciudad {cita: shadharat-dhahab p. 368}."
  fr: "Une seconde frappe de foudre sur la Mosquée du Prophète, le mercredi 18 Safar 898 — frappant le minaret principal, brisant son casque en forme de croissant et abattant son niveau inférieur; la même année a vu la peste merveilleuse de Bursa et l'incendie de la moitié de la ville {cite:shadharat-dhahab p. 368}."
  ur: "مسجد نبوی پر بجلی کا دوسرا حملہ، بدھ 18 صفر 898 - مرکزی مینار سے ٹکرا گیا، اس کا ہلال ہیلمٹ ٹوٹ گیا اور اس کا نچلا حصہ گر گیا۔ اسی سال برسا کی حیرت انگیز طاعون اور آدھے شہر کو جلانے کا واقعہ دیکھا۔ 368}۔"
  tr: "898 yılında Şadharat el-Dhahab'da, Safer ayının on sekizinci Çarşamba günü öğleden kısa bir süre önce Peygamber Mescidi'ne yıldırım düştü. Yıldırım ana minareye isabet ederek hilal şeklindeki kubbesinin çatlamasına ve alt katının bir tarafının çökmesine neden oldu. Barsa'da garip bir salgın vardı ve şehrin yaklaşık yarısı da yandı. {cite:şadharat-dhahab s. 368}"
  id: "Dalam Shadharat al-Dhahab, pada tahun 898, sambaran petir menghantam Masjidil Haram sesaat sebelum tengah hari pada hari Rabu, tanggal 18 Safar. Petir tersebut mengenai menara utama, menyebabkan kubah bulan sabitnya retak dan sisi lantai bawahnya runtuh. Terjadi wabah aneh di Barsa, dan sekitar setengah dari kota itu juga terbakar. {cite:shadharat-dhahab hlm. 368}."
