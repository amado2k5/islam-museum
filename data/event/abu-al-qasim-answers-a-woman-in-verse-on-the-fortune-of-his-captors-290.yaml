label:
  ar: "جواب أبي القاسم شعراً على امرأة في مصير آسريه، ص256، 290هـ"
  en: "Abu al-Qasim answers a woman in verse on the fortune of his captors, p. 256, 290 AH"
  ur: "ابو القاسم کا ایک عورت کو منظوم جواب، اپنے قید کرنے والوں کے انجام پر، ص256، 290ھ"
summary:
  ar: "تتمة مقطوعة حوارية في الكتاب تبدأ في آخر ص255 فيها تقول امرأة ويجيبها أبو القاسم عن حال آسريه، ويصف أنهم خانوه فلم يبلغوا ما أملوا وانقسموا فريقين في الشدة."
  en: "The close of a dialogue piece that begins at the foot of p. 255: a woman speaks and Abu al-Qasim answers on the fate of his captors, saying that they betrayed him, did not reach what they hoped and split into two parties in hardship."
  ur: "ص255 کے آخر سے شروع ہونے والے مکالماتی ٹکڑے کا اختتام: ایک عورت بولتی ہے اور ابو القاسم قید کرنے والوں کے انجام پر جواب دیتے ہیں کہ انہوں نے ان سے خیانت کی، اپنی امید کو نہ پہنچے اور دو گروہ ہو کر مشقت میں پڑے۔"
