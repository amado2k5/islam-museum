label: { ar: "دخول طغرل بك بغداد", en: "Tughril Beg's Entry into Baghdad", es: "La entrada de Tughril Beg en Bagdad", fr: "L'entrée de Tughril Beg à Bagdad", ur: "طغرل بیگ کا بغداد میں داخلہ", tr: "Tuğril Bey Bağdat'a girdi.", id: "Tughril Beg memasuki Baghdad" }
summary:
  ar: "استطاع طغرل بك الزعيم السلجوقي أن يسقط نفوذ الدولة البويهية في بغداد عام ٤٤٧هـ وأن يقضي على الفتن ويزيل من على أبواب المساجد سبّ الصحابة. ولما دخل عاصمة الخلافة العباسية استقبله الخليفة القائم بأمر الله استقبالاً عظيماً وخلع عليه خلعة سنية وأجلسه إلى جواره وأغدق عليه ألقاب التعظيم فلقبه بالسلطان ركن الدين، وأمر الخليفة بأن يُنقش اسم السلطان طغرل بك على العملة وأن يُذكر اسمه في الخطبة في مساجد بغداد وغيرها، فحل السلاجقة منذ ذلك الحين محل البويهيين في السيطرة على الأمر في بغداد. وتوطيداً للروابط تزوج الخليفة من ابنة جغري بك الأخ الأكبر لطغرل بك عام ٤٤٨هـ، ثم تزوج طغرل بك من ابنة الخليفة القائم في شعبان ٤٥٤هـ، وتوفي ليلة الجمعة لثمانٍ خلون من رمضان ٤٥٥هـ عن سبعين عاماً {cite:dawlat-uthmaniyya-salabi p. 28-29}. وعند ابن الجوزي دخل طغرل بك بغداد في رمضان سنة ٤٤٧ بعد أن كاتبه الخليفة يستنهضه لما صح عنده سوء عقيدة البساسيري، وانصرف البساسيري قبيل قدومه إلى الرحبة، واعتُقل الملك الرحيم آخر ملوك بني بويه في بغداد في آخر رمضان فانقطعت دولتهم، وأهدت الخاتون أم السلطان للخليفة عشرين فرساً مسرجة ملجمة {cite:muntazam-ibn-al-jawzi j.8 p.505-506}."
  ur: "447ھ/1055ء میں طغرل بیگ خلیفہ قائم کی اجازت سے بغداد داخل ہوا اور بويھی اثر و رسوخ ختم ہوا؛ خطبہ اس کے نام پڑھا گیا اور اسے سلطان رکن الدین کا لقب ملا {cite:dawlat-uthmaniyya-salabi p. 28-29}."
  en: "Tughril Beg's entry into Baghdad (1055): the Buyid grip broken, the caliph al-Qa'im's grand reception, the title Sultan Rukn al-Din on coinage and minbars, and the double marriage alliance that sealed Seljuk-Abbasid ties {cite:dawlat-uthmaniyya-salabi p. 28-29}."
  es: "La entrada de Tughril Beg en Bagdad (1055): el dominio buyí se rompió, la gran recepción del califa al-Qa'im, el título de Sultán Rukn al-Din en monedas y minbares, y la doble alianza matrimonial que selló los lazos selyúcidas-abasíes {cite:dawlat-uthmaniyya-salabi p. 28-29}."
  fr: "L'entrée de Tughril Beg à Bagdad (1055): l'emprise des Bouyides brisée, la grande réception du calife al-Qa'im, le titre de Sultan Rukn al-Din sur les pièces de monnaie et les minbars, et la double alliance matrimoniale qui scelle les liens seldjoukides-abbassides {cite:dawlat-uthmaniyya-salabi p. 28-29}."
  tr: "Selçuklu lideri Tuğrul Bey, Hicri 447 yılında (Miladi 1050) Bağdat'taki Büveyhiler hanedanlığının etkisine son vermeyi, iç karışıklıkları bastırmayı ve cami girişlerindeki Peygamberin Sahabelerine yönelik lanetleri kaldırmayı başardı. Abbasi başkentine girdiğinde, Halife el-Kaim bi-Amr Allah tarafından büyük bir onurla karşılandı; kendisine muhteşem bir şeref elbisesi verildi, yanına oturtuldu ve Sultan Rukn el-Din unvanı da dahil olmak üzere birçok saygı unvanı verildi. Halife, Sultan Tuğrul Bey'in adının paralara yazılmasını ve Bağdat ve diğer yerlerdeki camilerde cuma hutbelerinde anılmasını emretti. O zamandan itibaren Selçuklular, Bağdat'ın kontrolünde Büveyhilerin yerini aldı. İlişkilerini sağlamlaştırmak için Halife, Hicri 448 yılında (Miladi 1050) Tuğrul Bey'in ağabeyi Çağri Bey'in kızıyla evlendi. Tuğril Bey, Hicri 454 yılının Şaban ayında (Miladi 1065) Halife el-Kaim'in kızıyla evlendi. Hicri 455 yılının Ramazan ayının sekizinci gecesi, Cuma günü yetmiş yaşında vefat etti. İbn el-Cevzi'ye göre, Halife'nin kendisine yazdığı ve el-Basasiri'nin kötü inancını doğruladığı için öne çıkmasını istediği mektubun ardından Tuğril Bey, 447 yılının Ramazan ayında Bağdat'a girdi. El-Basasiri, onun gelişinden önce Rahba'ya gitti ve Buyid krallarının sonuncusu olan el-Malik el-Rahim, Ramazan ayının sonunda Bağdat'ta tutuklandı, böylece devletleri sona erdi. Sultanın annesi el-Hatun, Halife'ye yirmi adet eyerli ve dizginli at hediye etti. {cite:muntazam-ibn-al-jawzi j.8 p.505-506}."
  id: "Tughril Beg, pemimpin Seljuk, berhasil mengakhiri pengaruh dinasti Buyid di Baghdad pada tahun 447 H (1050 M), menekan perselisihan internal, dan menghapus kutukan terhadap para Sahabat Nabi dari pintu masuk masjid. Setelah memasuki ibu kota Abbasiyah, ia disambut dengan sangat hormat oleh Khalifah al-Qa'im bi-Amr Allah, yang menganugerahinya jubah kehormatan yang megah, mendudukkannya di sisinya, dan menghujaninya dengan gelar-gelar kehormatan, termasuk gelar Sultan Rukn al-Din. Khalifah memerintahkan agar nama Sultan Tughril Beg dicantumkan pada mata uang dan disebutkan dalam khutbah Jumat di masjid-masjid Baghdad dan tempat lain. Sejak saat itu, Seljuk menggantikan Buyid dalam mengendalikan Baghdad. Untuk memperkuat hubungan mereka, Khalifah menikahi putri Chaghri Beg, kakak laki-laki Tughril Beg, pada tahun 448 H (1050 M). Tughril Beg kemudian menikahi putri Khalifah al-Qa'im pada bulan Sya'ban 454 H (1065 M). Ia meninggal pada malam Jumat, tanggal delapan Ramadhan 455 H (1066 M), pada usia tujuh puluh tahun. Menurut Ibn al-Jawzi, Tughril Beg memasuki Baghdad pada bulan Ramadhan tahun 447 setelah Khalifah menulis surat kepadanya, mendesaknya untuk maju, karena ia telah mengkonfirmasi keyakinan buruk al-Basasiri. Al-Basasiri pergi sebelum kedatangannya ke al-Rahba, dan al-Malik al-Rahim, raja terakhir Dinasti Buyid, ditangkap di Baghdad pada akhir Ramadhan, sehingga negara mereka berakhir. Ibu Sultan, al-Khatun, menghadiahkan Khalifah dua puluh ekor kuda yang telah dipasangi pelana dan kekang. {cite:muntazam-ibn-al-jawzi j.8 p.505-506}."
