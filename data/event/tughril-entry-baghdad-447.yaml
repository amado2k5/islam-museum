summary:
  ar: "استطاع طغرل بك الزعيم السلجوقي أن يسقط نفوذ الدولة البويهية في بغداد عام ٤٤٧هـ وأن يقضي على الفتن ويزيل من على أبواب المساجد سبّ الصحابة. ولما دخل عاصمة الخلافة العباسية استقبله الخليفة القائم بأمر الله استقبالاً عظيماً وخلع عليه خلعة سنية وأجلسه إلى جواره وأغدق عليه ألقاب التعظيم فلقبه بالسلطان ركن الدين، وأمر الخليفة بأن يُنقش اسم السلطان طغرل بك على العملة وأن يُذكر اسمه في الخطبة في مساجد بغداد وغيرها، فحل السلاجقة منذ ذلك الحين محل البويهيين في السيطرة على الأمر في بغداد. وتوطيداً للروابط تزوج الخليفة من ابنة جغري بك الأخ الأكبر لطغرل بك عام ٤٤٨هـ، ثم تزوج طغرل بك من ابنة الخليفة القائم في شعبان ٤٥٤هـ، وتوفي ليلة الجمعة لثمانٍ خلون من رمضان ٤٥٥هـ عن سبعين عاماً {cite:dawlat-uthmaniyya-salabi p. 28-29}. وعند ابن الجوزي دخل طغرل بك بغداد في رمضان سنة ٤٤٧ بعد أن كاتبه الخليفة يستنهضه لما صح عنده سوء عقيدة البساسيري، وانصرف البساسيري قبيل قدومه إلى الرحبة، واعتُقل الملك الرحيم آخر ملوك بني بويه في بغداد في آخر رمضان فانقطعت دولتهم، وأهدت الخاتون أم السلطان للخليفة عشرين فرساً مسرجة ملجمة {cite:muntazam-ibn-al-jawzi j.8 p.505-506}."
  ur: "447ھ/1055ء میں طغرل بیگ خلیفہ قائم کی اجازت سے بغداد داخل ہوا اور بويھی اثر و رسوخ ختم ہوا؛ خطبہ اس کے نام پڑھا گیا اور اسے سلطان رکن الدین کا لقب ملا {cite:dawlat-uthmaniyya-salabi p. 28-29}."
  en: "Tughril Beg's entry into Baghdad (1055): the Buyid grip broken, the caliph al-Qa'im's grand reception, the title Sultan Rukn al-Din on coinage and minbars, and the double marriage alliance that sealed Seljuk-Abbasid ties {cite:dawlat-uthmaniyya-salabi p. 28-29}."
