summary:
  ar: "تغلب العدو على بلنسية صلحاً يوم الثلاثاء السابع عشر لصفر سنة 636هـ بعد أن كاتب ابن الأبار سلطان إفريقية مستغيثاً بقصيدته وفيها «طهر بلادك منهم إنهم نجس ولا طهارة ما لم تغسلا النجسا» فبادر السلطان بإعانة أهلها وشحن الأساطيل بالمدد من المال والأقوات والكسى إلى أن تغلب الطاغية عليها، وتعاهد أهلها مع النصراني على أن يسلمهم في أنفسهم سنة 637هـ {cite:nafh-tib-maqqari p. 464}."
  en: "Valencia fell by treaty on 17 Safar 636 after Ibn al-Abbar's plea-qasida to the Hafsid sultan moved him to ship money and supplies; its people surrendered on terms preserving their persons in 637 {cite:nafh-tib-maqqari p. 464}."
