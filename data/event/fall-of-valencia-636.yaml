id: event/fall-of-valencia-636
class: event
kind: conquest
label: { ar: "سقوط بلنسية بيد العدو", en: "The fall of Valencia to the enemy", es: "La caída de Valencia en manos del enemigo", fr: "La chute de Valence aux mains de l'ennemi", ur: "دشمن کے لیے والنسیا کا زوال", tr: "Valencia düşmanın eline geçti", id: "Valencia jatuh ke tangan musuh." }
summary:
  ar: "تغلب العدو على بلنسية صلحاً يوم الثلاثاء السابع عشر لصفر سنة 636هـ بعد أن كاتب ابن الأبار سلطان إفريقية مستغيثاً بقصيدته وفيها «طهر بلادك منهم إنهم نجس ولا طهارة ما لم تغسلا النجسا» فبادر السلطان بإعانة أهلها وشحن الأساطيل بالمدد من المال والأقوات والكسى إلى أن تغلب الطاغية عليها، وتعاهد أهلها مع النصراني على أن يسلمهم في أنفسهم سنة 637هـ {cite:nafh-tib-maqqari p. 464}."
  en: "Valencia fell by treaty on 17 Safar 636 after Ibn al-Abbar's plea-qasida to the Hafsid sultan moved him to ship money and supplies; its people surrendered on terms preserving their persons in 637 {cite:nafh-tib-maqqari p. 464}."
  es: "Valencia cayó por tratado el 17 de Safar de 636 después de que la súplica-qasida de Ibn al-Abbar al sultán Hafsid lo impulsara a enviar dinero y suministros; su gente se rindió en condiciones que preservaban sus personas en 637 {cite:nafh-tib-maqqari p. 464}."
  fr: "Valence tomba par traité le 17 Safar 636 après que la requête d'Ibn al-Abbar au sultan Hafside l'ait incité à envoyer de l'argent et des provisions; ses habitants se rendirent à des conditions préservant leurs personnes en 637 {cite:nafh-tib-maqqari p. 464}."
  ur: "والنسیا 17 صفر 636 کو معاہدے کے تحت گر گیا جب ابن العبر کی حفصد سلطان کے سامنے قصیدہ کی درخواست نے اسے رقم اور سامان بھیجنے پر مجبور کیا۔ اس کے لوگوں نے 637 میں اپنے افراد کی حفاظت کے لیے ہتھیار ڈال دیے تھے۔ 464}۔"
  tr: "İbn el-Abbar'ın İfrikiye Sultanı'na yazdığı ve \"Topraklarınızı onlardan arındırın, çünkü onlar kirlidir ve kirlilik temizlenmedikçe temizlik olmaz\" dediği şiiriyle yardım istemesinin ardından, düşman 636 Hicri yılının Safer ayının 17. Salı günü Valensiya'yı barışçıl bir şekilde fethetti. Bunun üzerine Sultan, halkına yardım etmek için acele etti ve filoları para, erzak ve giysi malzemeleriyle doldurdu. Sonunda zalim hükümdar Valensiya'yı fethetti ve halkı 637 Hicri yılında Hristiyanlarla teslim olma konusunda bir anlaşma yaptı. {Kaynak: Nafh-tib-makqari s. 464}"
  id: "Musuh menaklukkan Valencia secara damai pada hari Selasa, tanggal tujuh belas Safar, 636 H, setelah Ibnu al-Abbar menulis surat kepada Sultan Ifriqiya, memohon bantuan dengan puisinya, di mana ia berkata, “Bersihkan negerimu dari mereka, karena mereka najis, dan tidak ada kesucian kecuali jika kau membersihkan kenajisan itu.” Maka Sultan bergegas membantu rakyatnya dan memuat armada dengan persediaan uang, makanan, dan pakaian hingga sang tiran menaklukkannya, dan rakyatnya membuat perjanjian dengan orang Kristen untuk menyerahkan mereka pada tahun 637 H {cite:nafh-tib-maqqari p. 464}."
