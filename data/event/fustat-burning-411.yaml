label: { ar: "بسط عبيد مصر في الفسطاط ٤١١" }
summary:
  ar: "في يوم الثلاثاء لثنتين بقيتا من شوال سنة ٤١١ ظهرت في مصر صنعة مكتوبة فيها بالعبيد قصاصات ملقاة في السكك تسأل الدولة أن يبسطوا في مصر ثلاثة أيام؛ فخاف منها الحاكم بأمر الله وأمر القواد والعرافين أن يحرقوا مصر ويقتلوا وينهبوا فجعلوا عبيد مصر يأخذون عسكرهم فعصرته النساء من السلاطين حتى تُتُوهن، وامتد القتال ثلاثة أيام، وصاحت الناس بالعبيد وقالوا لو قد تم لهم ما أرادوا لما بقي عزيز ولا ذليل إلا ذل، فجمعت النساء والصبيان وكبائر البلد يصرخون إلى العبيد، وتباع في الأسواق المغتنمة، ثم خرج الحاكم بنفسه وركب فوقف على صف منهم وصاح بهم يا أغناطي فردوا، وكان قد أحرق ثلث مصر وذهب ثلثها نهبًا {cite:muntazam-ibn-al-jawzi j.7 p.301-303}."
