label: { ar: "بسط عبيد مصر في الفسطاط ٤١١", en: "The Unleashing of Egypt's Slaves in al-Fustat, 411", es: "La liberación de los esclavos de Egipto en al-Fustat, 411", fr: "Le déchaînement des esclaves d'Égypte à al-Fustat, 411" }
summary:
  ar: "في يوم الثلاثاء لثنتين بقيتا من شوال سنة ٤١١ ظهرت في مصر صنعة مكتوبة فيها بالعبيد قصاصات ملقاة في السكك تسأل الدولة أن يبسطوا في مصر ثلاثة أيام؛ فخاف منها الحاكم بأمر الله وأمر القواد والعرافين أن يحرقوا مصر ويقتلوا وينهبوا فجعلوا عبيد مصر يأخذون عسكرهم فعصرته النساء من السلاطين حتى تُتُوهن، وامتد القتال ثلاثة أيام، وصاحت الناس بالعبيد وقالوا لو قد تم لهم ما أرادوا لما بقي عزيز ولا ذليل إلا ذل، فجمعت النساء والصبيان وكبائر البلد يصرخون إلى العبيد، وتباع في الأسواق المغتنمة، ثم خرج الحاكم بنفسه وركب فوقف على صف منهم وصاح بهم يا أغناطي فردوا، وكان قد أحرق ثلث مصر وذهب ثلثها نهبًا {cite:muntazam-ibn-al-jawzi j.7 p.301-303}."
  en: "On a Tuesday, two nights before the end of Shawwal 411, a written placard appeared in Egypt, with slips scattered along the lanes asking the state to unleash the slaves in Egypt for three days. Al-Hakim bi-Amr Allah feared it, as did the commanders and soothsayers, that they would burn Egypt, kill and plunder. So they let the slaves of Egypt take their camp, and the sultans' women pressed it until it weakened. The fighting lasted three days. People cried out to the slaves, saying that if their aims were achieved, nothing mighty or humble would remain unhumbled. Women, children and the city's notables gathered, crying out to the slaves, and [the spoils] were sold in the seized markets. Then al-Hakim went out himself, rode, halted before a line of them and called out 'Ya Aghatiyy', and they turned back. He had burned a third of Egypt, and a third of it had gone to plunder {cite:muntazam-ibn-al-jawzi j.7 p.301-303}."
  es: "Un martes, dos noches antes del final de Shawwal 411, apareció en Egipto un cartel escrito, con papeles esparcidos por las calles, pidiendo al Estado que liberara a los esclavos durante tres días. Al-Hakim bi-Amr Allah temía que, al igual que los comandantes y adivinos, incendiaran Egipto, mataran y saquearan. Así que permitieron que los esclavos de Egipto tomaran su campamento, y las mujeres de los sultanes lo presionaron hasta debilitarlo. La lucha duró tres días. La gente clamaba a los esclavos, diciendo que si lograban sus objetivos, nada, ni poderoso ni humilde, quedaría sin ser humillado. Mujeres, niños y notables de la ciudad se reunieron, clamando a los esclavos, y [el botín] se vendió en los mercados tomados. Entonces Al-Hakim salió él mismo, cabalgó, se detuvo ante una fila de ellos y gritó «¡Ya Aghatiyy!», y ellos retrocedieron. Había quemado un tercio de Egipto, y otro tercio había sido saqueado {cite:muntazam-ibn-al-jawzi j.7 p.301-303}."
  fr: "Un mardi, deux nuits avant la fin de Shawwal 411, une pancarte apparut en Égypte, accompagnée de bouts de papier éparpillés dans les rues, demandant à l'État de lâcher les esclaves pendant trois jours. Al-Hakim bi-Amr Allah, tout comme les commandants et les devins, craignit que les esclaves ne mettent le pays à feu et à sang, ne massacrent et ne pillent. Ils laissèrent donc les esclaves s'emparer de leur campement, et les femmes du sultan l'assaillirent jusqu'à ce qu'il s'affaiblisse. Les combats durèrent trois jours. On criait aux esclaves que si leurs objectifs étaient atteints, rien, ni puissant ni humble, ne resterait indemne. Femmes, enfants et notables de la ville se rassemblèrent, implorant les esclaves, et le butin fut vendu sur les marchés conquis. Alors Al-Hakim sortit lui-même, chevaucha, s'arrêta devant une colonne d'esclaves et s'écria: « Ô Aghati ! » Ils rebroussèrent chemin. Il avait incendié un tiers de l'Égypte, et un tiers de celle-ci était parti en pillage {cite:muntazam-ibn-al-jawzi j.7 p.301-303}."
