id: event/deathbed-of-abu-hanifa
class: event
kind: death
tags: [wasaya-browser, wasaya-successors, wasaya-ihtidar, wasaya-mirath, wasaya-marqad]
label: { ar: "مرض أبي حنيفة ووفاته ببغداد وجنازته وقبره", en: "Death, funeral and grave of Abu Hanifa at Baghdad", ur: "ابو حنیفہ کی بغداد میں وفات، جنازہ اور قبر", es: "Muerte, funeral y tumba de Abu Hanifa en Bagdad.", fr: "Décès, funérailles et sépulture d'Abu Hanifa à Bagdad" }
summary:
  ar: "توفي أبو حنيفة ببغداد سنة خمسين ومئة في قول الأكثر، وقيل في رجب {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 584}، بعد أن أبى أن يتولى القضاء للمنصور فحُبس، وفي رواية أنه قعد في القضاء يومين ثم اشتكى ستة أيام ومات {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 451} {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 452}، وفي قول آخر أنه توفي وهو في السجن {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 450}. وغسله الحسن بن عمارة {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 485}، وصُلّي عليه ست مرات لكثرة الزحام آخرهم ابنه حماد {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 585}، وكانت عنده ودائع للناس بخمسين ألفاً لم يضع منها درهم {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 491}. ودُفن في مقبرة الخيزران بالجانب الشرقي من بغداد {cite:tarikh-baghdad-khatib-gharb vol. 1 p. 445}."
  en: "Abu Hanifa died at Baghdad in 150 AH on most accounts, in Rajab according to one {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 584}, after refusing to take the judgeship for al-Mansur and being jailed; in one report he sat as judge for two days, then fell ill for six and died {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 451} {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 452}, while another says he died in prison {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 450}. al-Hasan ibn Umara washed him {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 485}; prayers were said over him six times because of the crowd, the last led by his son Hammad {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 585}; he held deposits of fifty thousand belonging to others, not one dirham of which was lost {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 491}. He was buried in the Khayzuran cemetery on the eastern side of Baghdad {cite:tarikh-baghdad-khatib-gharb vol. 1 p. 445}."
  ur: "ابو حنیفہ کا انتقال اکثر کے قول کے مطابق 150ھ میں بغداد میں ہوا، ایک قول میں رجب میں {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 584}؛ انھوں نے منصور کے لیے قضا قبول کرنے سے انکار کیا تو قید ہوئے، ایک روایت کے مطابق دو دن قاضی بیٹھے پھر چھ دن بیمار رہ کر فوت ہوئے {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 451} {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 452}، اور ایک اور قول میں وہ قید ہی میں فوت ہوئے {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 450}۔ حسن بن عمارہ نے انھیں غسل دیا {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 485}؛ ہجوم کی کثرت سے ان کی نمازِ جنازہ چھ بار ہوئی، آخری بار ان کے بیٹے حماد نے پڑھائی {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 585}؛ ان کے پاس لوگوں کی پچاس ہزار کی امانتیں تھیں جن میں سے ایک درہم بھی ضائع نہ ہوا {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 491}۔ انھیں بغداد کے مشرقی جانب مقبرۂ خیزران میں دفن کیا گیا {cite:tarikh-baghdad-khatib-gharb vol. 1 p. 445}۔"
  es: "Abu Hanifa murió en Bagdad en el año 150 AH según la mayoría de los relatos, en Rajab según uno {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 584}, después de negarse a aceptar el cargo de juez para al-Mansur y ser encarcelado; en un informe se sentó como juez durante dos días, luego enfermó durante seis y murió {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 451} {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 452}, mientras que otro dice que murió en prisión {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 450}. al-Hasan ibn Umara lo lavó {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 485}; Se rezaron oraciones por él seis veces debido a la multitud, la última dirigida por su hijo Hammad {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 585}; poseía depósitos de cincuenta mil que pertenecían a otros, de los cuales no se perdió ni un solo dirham {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 491}. Fue enterrado en el cementerio de Khayzuran, en el lado este de Bagdad {cite:tarikh-baghdad-khatib-gharb vol. 1 p. 445}."
  fr: "Abu Hanifa mourut à Bagdad en 150 AH selon la plupart des sources, en Rajab selon l'une d'elles {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 584}, après avoir refusé d'accepter la charge de juge pour al-Mansur et avoir été emprisonné; selon un récit, il siégea comme juge pendant deux jours, puis tomba malade pendant six jours et mourut {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 451} {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 452}, tandis qu'un autre dit qu'il mourut en prison {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 450}. al-Hasan ibn Umara le lava {cite:tarikh-baghdad-khatib-gharb vol. 15 p. 485}; Des prières furent récitées six fois sur lui en raison de la foule, la dernière étant menée par son fils Hammad (voir: Tarikh-Baghdad-Khatib-Gharb, vol. 15, p. 585). Il détenait des dépôts de cinquante mille dirhams appartenant à autrui, dont pas un seul ne fut perdu (voir: Tarikh-Baghdad-Khatib-Gharb, vol. 15, p. 491). Il fut enterré au cimetière de Khayzuran, à l’est de Bagdad (voir: Tarikh-Baghdad-Khatib-Gharb, vol. 1, p. 445)."
