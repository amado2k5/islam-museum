label: { ar: "بعث معاذ بن جبل إلى اليمن ووصية النبي له", en: "The sending of Mu'adh ibn Jabal to Yemen and the Prophet's charge to him", es: "El envío de Mu'adh ibn Jabal a Yemen y el encargo que el Profeta le hizo.", fr: "L'envoi de Mu'adh ibn Jabal au Yémen et la mission que le Prophète lui confie.", ur: "معاذ بن جبل کا یمن بھیجنا اور ان کی طرف رسول اللہ کی ذمہ داری", tr: "Mu'adh ibn Jabal Yemen'e gönderildi ve Peygamber'in ona verdiği talimatlar şunlardı:", id: "Mu'adz bin Jabal diutus ke Yaman, dan instruksi Nabi kepadanya." }
summary:
  ar: "بعث النبي معاذ بن جبل أميراً على رسله إلى اليمن بعد كتاب ملوك حمير، وأوصاه حين بعثه: يسّر ولا تعسّر، وبشّر ولا تنفّر، وأخبره أنه سيقدم على قوم من أهل الكتاب يسألونه ما مفتاح الجنة فليقل: شهادة أن لا إله إلا الله وحده لا شريك له. ويروي ابن إسحاق عن عبد الله بن أبي بكر أنه حُدّث بذلك، ويورد سؤال امرأة من أهل اليمن معاذاً عن حق الزوج على المرأة. ويروي محمد علي السايس أن النبي سأل معاذاً كيف يقضي إن عرض له قضاء، فأجاب: أجتهد رأيي ولا آلو، فأقره النبي على ذلك {cite:nashat-al-fiqh-al-ijtihadi-azhar p. 7, 17-18}."
  en: "After the letter of Himyar's kings the Prophet sent Mu'adh ibn Jabal as amir of his envoys to Yemen and charged him on departure: make things easy, not hard; give good tidings, do not repel; you will come to People of the Book who will ask what the key of Paradise is, so say: the testimony that there is no god but God alone without partner. Ibn Ishaq has it from Abdullah ibn Abi Bakr, who was told it, and adds a Yemeni woman's question to Mu'adh about a husband's right over his wife."
  es: "Tras la carta de los reyes de Himyar, el Profeta envió a Mu'adh ibn Jabal como emir de sus enviados a Yemen y le encargó en su partida: «Facilita las cosas, no las dificultes; anuncia buenas nuevas, no las rechaces; vendrás a la Gente del Libro, que te preguntará cuál es la llave del Paraíso, así que di: el testimonio de que no hay más dios que Dios, único y sin asociado». Ibn Ishaq lo recibió de Abdullah ibn Abi Bakr, a quien se lo contaron, y añade la pregunta de una mujer yemení a Mu'adh sobre los derechos del marido sobre su esposa."
  fr: "Après la lettre des rois d'Himyar, le Prophète envoya Mu'adh ibn Jabal comme chef de ses émissaires au Yémen et lui donna les instructions suivantes avant son départ: « Facilite les choses, ne les complique pas; annonce la bonne nouvelle, ne repousse pas; tu rencontreras des Gens du Livre qui te demanderont quelle est la clé du Paradis. Réponds-leur: “La preuve qu'il n'y a de divinité que Dieu, l'Unique et sans associé.” » Ibn Ishaq tient ce récit d'Abdullah ibn Abi Bakr, qui le lui avait rapporté, et y ajoute la question d'une Yéménite posée à Mu'adh au sujet des droits du mari sur son épouse."
  ur: "حمیار کے بادشاہوں کے خط کے بعد نبی نے معاذ بن جبل کو اپنے ایلچیوں کا امیر بنا کر یمن بھیجا اور روانگی کے وقت انہیں حکم دیا: چیزوں کو آسان کرو، مشکل نہیں۔ خوشخبری دو، پیچھے نہ ہٹو۔ تم اہل کتاب کے پاس آؤ گے جو پوچھیں گے کہ جنت کی کنجی کیا ہے، تو کہو: اس بات کی گواہی دینا کہ اللہ کے سوا کوئی معبود نہیں، وہ اکیلا ہے جس کا کوئی شریک نہیں۔ ابن اسحاق نے اسے عبداللہ بن ابی بکر سے روایت کیا ہے، اور انہوں نے معاذ سے ایک یمنی عورت کے سوال کا اضافہ کیا ہے کہ بیوی پر شوہر کا حق ہے۔"
  tr: "Peygamberimiz, Himyar krallarından gelen mektuptan sonra, elçilerinin komutanı olarak Muaz ibn Cebel'i Yemen'e gönderdi. Onu gönderirken, \"İşleri kolaylaştır, zorlaştırma; müjde ver, nefret uyandırma\" diye talimat verdi. Ayrıca, kendisine cennetin anahtarının ne olduğunu soracak olan bir grup Kitap Ehli ile görüşeceğini ve \"Allah'tan başka ilah olmadığına, O'nun tek ve ortağı olmadığına şahitlik etmek\" diye cevap vermesi gerektiğini bildirdi. İbn İshak, Abdullah ibn Ebu Bekir'den bunu kendisine söylendiğini rivayet eder ve Yemenli bir kadının Muaz'a kocanın karısı üzerindeki hakları hakkında sorduğu bir soruyu aktarır. Muhammed Ali el-Sayis, Peygamberimizin Muaz'a kendisine bir dava sunulduğunda nasıl hüküm vereceğini sorduğunu ve Muaz'ın \"Elimden gelenin en iyisini yapacağım ve hiçbir çabadan kaçınmayacağım\" diye cevap verdiğini rivayet eder. Peygamberimiz bunu onayladı. {cite:nashat-al-fiqh-al-ijtihadi-azhar s. 7, 17-18}"
  id: "Nabi Muhammad SAW mengutus Mu'adh bin Jabal sebagai komandan utusannya ke Yaman setelah menerima surat dari raja-raja Himyar. Ketika mengutusnya, beliau berpesan kepadanya: \"Permudah urusan, jangan persulit; berikan kabar gembira, jangan menimbulkan keengganan.\" Beliau juga memberitahukan bahwa ia akan bertemu dengan sekelompok Ahli Kitab yang akan bertanya kepadanya tentang kunci surga, dan bahwa ia harus menjawab: \"Kesaksian bahwa tidak ada Tuhan selain Allah, Yang Maha Esa, tanpa sekutu.\" Ibnu Ishaq meriwayatkan dari Abdullah bin Abi Bakr bahwa ia diberitahu hal ini, dan ia menceritakan sebuah pertanyaan yang diajukan seorang wanita dari Yaman kepada Mu'adh tentang hak-hak suami atas istrinya. Muhammad Ali al-Sayis meriwayatkan bahwa Nabi bertanya kepada Mu'adh bagaimana ia akan memutuskan jika suatu kasus diajukan kepadanya, dan ia menjawab: \"Aku akan mengerahkan upaya semaksimal mungkin dan tidak akan menyia-nyiakan upaya apa pun.\" Nabi menyetujui hal ini. {cite:nashat-al-fiqh-al-ijtihadi-azhar p. 7, 17-18}"
