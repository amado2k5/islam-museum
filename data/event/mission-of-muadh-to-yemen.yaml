label: { ar: "بعث معاذ بن جبل إلى اليمن ووصية النبي له", en: "The sending of Mu'adh ibn Jabal to Yemen and the Prophet's charge to him" }
summary:
  ar: "بعث النبي معاذ بن جبل أميراً على رسله إلى اليمن بعد كتاب ملوك حمير، وأوصاه حين بعثه: يسّر ولا تعسّر، وبشّر ولا تنفّر، وأخبره أنه سيقدم على قوم من أهل الكتاب يسألونه ما مفتاح الجنة فليقل: شهادة أن لا إله إلا الله وحده لا شريك له. ويروي ابن إسحاق عن عبد الله بن أبي بكر أنه حُدّث بذلك، ويورد سؤال امرأة من أهل اليمن معاذاً عن حق الزوج على المرأة. ويروي محمد علي السايس أن النبي سأل معاذاً كيف يقضي إن عرض له قضاء، فأجاب: أجتهد رأيي ولا آلو، فأقره النبي على ذلك {cite:nashat-al-fiqh-al-ijtihadi-azhar p. 7, 17-18}."
  en: "After the letter of Himyar's kings the Prophet sent Mu'adh ibn Jabal as amir of his envoys to Yemen and charged him on departure: make things easy, not hard; give good tidings, do not repel; you will come to People of the Book who will ask what the key of Paradise is, so say: the testimony that there is no god but God alone without partner. Ibn Ishaq has it from Abdullah ibn Abi Bakr, who was told it, and adds a Yemeni woman's question to Mu'adh about a husband's right over his wife."
