id: event/mission-of-muadh-to-yemen
education:
  did_you_know:
    ar: "بعث النبي معاذ بن جبل أميراً على رسله إلى اليمن وأوصاه: يسّر ولا تعسّر وبشّر ولا تنفّر؛ وسأله النبي كيف يقضي فأجاب: أجتهد رأيي ولا آلو فأقرّه."
    en: "The Prophet sent Mu'adh ibn Jabal to Yemen leading his envoys, counselling 'make easy, not hard; give good news, not aversion'; asked how he would judge, Mu'adh answered 'I strive my judgment' — and the Prophet approved."
    ur: "نبی نے معاذ بن جبل کو یمن بھیجا اور نصیحت کی «آسانی کرو نہ سختی، خوشخبری دو نہ نفرت»؛ فیصلے کا طریقہ پوچھا تو کہا «اجتہاد کروں گا» — نبی نے پسند کیا۔"
    sources: [source/mubarakpuri-raheeq, source/nashat-al-fiqh-al-ijtihadi-azhar]
