label: { ar: "بناء السور الحصين على مشهد الحائر بكربلاء", en: "Building the fortified wall around the shrine of al-Ha'ir in Karbala", es: "Construcción de la muralla fortificada alrededor del santuario de al-Ha'ir en Karbala.", fr: "Construction du mur fortifié autour du sanctuaire d'al-Ha'ir à Karbala", ur: "کربلا میں حرم الحائر کے گرد فصیل کی تعمیر", tr: "Kerbela'daki El-Ha'ir bölgesinde surların inşası", id: "Membangun tembok benteng di lokasi Al-Ha'ir di Karbala" }
summary:
  ar: "في جمادى الأولى سنة أربعمائة بُدئ ببناء سور حصين على المشهد بالحائر، وكان أبو محمد الحسن بن الفضل بن سهلان قد زار المشهد ونذر أن يعمل عليه سوراً حصيناً مانعاً لكثرة من يطرق الموضع من أعراب البادية، فشرع في قضاء نذره وعمل السور وأحكم وعُلّي وعُرّض ونُصبت عليه أبواب وثيقة بعضها من حديد وتحصن المشهد به وحسن الأثر فيه {cite:muntazam-ibn-al-jawzi j.7 p.246}. ويُنسب البناء سنة ٤٠٣ في ترجمة الحسين بن فضل بن سهلان وزير سلطان الدولة إليه — وهو من بيت ابن سهلان نفسه {cite:muntazam-ibn-al-jawzi j.8 p.355}."
  en: "In Jumada I 400 construction began on a strong wall around the shrine at al-Ha'ir in Karbala. Abu Muhammad al-Hasan ibn al-Fadl ibn Sahlan had visited the shrine and vowed to build a stout wall protecting it against the many Bedouin raiders who came to the site. He fulfilled his vow: the wall was built, made firm, raised high and widened, and strong doors, some of iron, were set into it, so the shrine was fortified and the effect was good {cite:muntazam-ibn-al-jawzi j.7 p.246}. The construction is also credited, under the year 403 in the biography of al-Husayn ibn al-Fadl ibn Sahlan, vizier of Sultan al-Dawla, to him; he was of the same house as Ibn Sahlan {cite:muntazam-ibn-al-jawzi j.8 p.355}."
  es: "En Jumada I 400 se inició la construcción de una sólida muralla alrededor del santuario de al-Ha'ir en Karbala. Abu Muhammad al-Hasan ibn al-Fadl ibn Sahlan había visitado el santuario y juró construir una muralla robusta para protegerlo de los numerosos asaltantes beduinos que acudían al lugar. Cumplió su promesa: la muralla se construyó, se reforzó, se elevó y se ensanchó, y se instalaron puertas fuertes, algunas de hierro, fortificando así el santuario con buenos resultados {cite:muntazam-ibn-al-jawzi j.7 p.246}. La construcción también se le atribuye, bajo el año 403, en la biografía de al-Husayn ibn al-Fadl ibn Sahlan, visir del sultán al-Dawla; pertenecía a la misma familia que Ibn Sahlan {cite:muntazam-ibn-al-jawzi j.8 p.355}."
  fr: "En Jumada I 400, la construction d'une solide muraille autour du sanctuaire d'al-Ha'ir à Karbala commença. Abu Muhammad al-Hasan ibn al-Fadl ibn Sahlan s'était rendu sur place et avait fait vœu d'édifier une muraille robuste pour le protéger des nombreux pillards bédouins qui s'y rendaient. Il tint sa promesse: la muraille fut construite, consolidée, surélevée et élargie, et de solides portes, dont certaines en fer, y furent installées. Le sanctuaire fut ainsi fortifié, avec un résultat probant (Muntazam ibn al-Jawzi, vol. 7, p. 246). La construction lui est également attribuée, sous l'an 403, dans la biographie d'al-Husayn ibn al-Fadl ibn Sahlan, vizir du sultan al-Dawla; il appartenait à la même famille qu'Ibn Sahlan (Muntazam ibn al-Jawzi, vol. 8, p. 355)."
  ur: "جمادی الثانی 400 میں کربلا میں الحائر کے مزار کے گرد ایک مضبوط دیوار کی تعمیر شروع ہوئی۔ ابو محمد الحسن بن الفضل بن سہلان نے مزار کا دورہ کیا تھا اور اس جگہ پر آنے والے بہت سے بدو حملہ آوروں کے خلاف ایک مضبوط دیوار تعمیر کرنے کا عہد کیا تھا۔ اس نے اپنی منت پوری کی: دیوار بنائی گئی، پختہ کی گئی، اونچی اور چوڑی کی گئی اور اس میں کچھ لوہے کے مضبوط دروازے لگائے گئے، چنانچہ مزار کو مضبوط بنایا گیا اور اس کا اثر اچھا ہوا۔ سلطان الدولہ کے وزیر الحسین بن الفضل بن سہلان کی سوانح عمری میں 403 کے تحت اس تعمیر کا سہرا بھی دیا جاتا ہے۔ وہ ابن سہلان کے اسی گھر کا تھا {حوالہ:منتظم ابن الجوزی ج8 ص 355}۔"
  tr: "Hicri 400 yılının Cemâdeü'l-Ula ayında, Ha'ir'deki türbenin etrafına güçlü bir duvar inşa edilmeye başlandı. Ebu Muhammed el-Hasan ibn el-Fadl ibn Sahlân, türbeyi ziyaret etmiş ve bölgeyi sık sık ziyaret eden çok sayıda Bedevi Arap nedeniyle etrafına güçlü ve koruyucu bir duvar inşa etmeye yemin etmişti. Yeminini yerine getirmeye başladı; duvarı inşa etti, güçlendirdi, yükseltti, genişletti ve bazıları demirden yapılmış sağlam kapılar yerleştirdi. Böylece türbe tahkim edildi ve etkisi etkileyici oldu. {cite:muntazam-ibn-al-jawzi j.7 p.246}. Bu inşaat, aynı İbn Sahlân ailesinden olan Sultanın veziri el-Hüseyin ibn Fadl ibn Sahlân'ın biyografisinde, Hicri 403 yılında ona atfedilmektedir. {cite:muntazam-ibn-al-jawzi j.8 s.355}."
  id: "Pada bulan Jumada al-Ula tahun 400 H, pembangunan tembok kokoh di sekitar makam di al-Ha'ir dimulai. Abu Muhammad al-Hasan ibn al-Fadl ibn Sahlān telah mengunjungi makam tersebut dan bersumpah untuk membangun tembok pelindung yang kuat di sekitarnya karena banyaknya orang Arab Badui yang sering mengunjungi daerah tersebut. Ia mulai memenuhi sumpahnya, membangun tembok, memperkuatnya, meninggikannya, memperlebarnya, dan memasang gerbang yang kokoh, beberapa di antaranya terbuat dari besi. Makam tersebut pun diperkuat, dan dampaknya sangat mengesankan. {cite:muntazam-ibn-al-jawzi j.7 p.246}. Pembangunan tersebut dikaitkan kepadanya pada tahun 403 H dalam biografi al-Husayn ibn Fadl ibn Sahlān, wazir Sultan Negara—yang berasal dari keluarga Ibn Sahlān yang sama. {kutip:muntazam-ibn-al-jawzi j.8 hal.355}."
