summary:
  ar: "فتح السوس وعليها شهريار أخو الهرمزان: أحاط المسلمون بها وناوشوهم القتال مرات وكان أهل السوس يصيبون في المسلمين، وأشرف عليهم الرهبان والقسيسون فقالوا إن مما عهد إلينا علماؤنا أنه لا يفتح السوس إلا الدجال أو قوم فيهم الدجال. وكان صافي بن صياد في خيل النعمان فأتى باب السوس فدقّه برجله وقال انفتح بظار وهو غضبان، فتقطعت السلاسل وتكسرت الأغلاق وتفتحت الأبواب ودخل المسلمون وألقى المشركون بأيديهم ونادوا الصلح الصلح فأجابوهم بعد ما دخلوها عنوة. وقيل لأبي سبرة هذا جسد دانيال في هذه المدينة فقال وما عليّ بذلك وأقره في أيديهم {cite:kamil-ibn-al-athir p. 370-371}."
  en: "At al-Sus the monks and priests called down from the walls: our learned men left word that none shall open Sus but the Dajjal or an army containing him — when Safi ibn Sayyad strode to the gate in a rage, kicked it and cried «Infitah bi-zar!«, the chains snapped, the locks broke, and the army poured in. Told that Daniel's body lay in the city, Abu Sabra answered: «What is that to me!« and left it in their hands {cite:kamil-ibn-al-athir p. 370-371}."
  es: "En al-Sus, los monjes y sacerdotes gritaron desde las murallas: «Nuestros sabios dejaron un mensaje: nadie abrirá Sus excepto el Dajjal o un ejército que lo contenga». Cuando Safi ibn Sayyad se dirigió furioso a la puerta, la pateó y gritó «¡Infitah bi-zar!», las cadenas se rompieron, los candados se quebraron y el ejército entró. Al enterarse de que el cuerpo de Daniel yacía en la ciudad, Abu Sabra respondió: «¡Qué me importa a mí!» y lo dejó en sus manos {cita:kamil-ibn-al-athir págs. 370-371}."
  fr: "À al-Sus, les moines et les prêtres crièrent du haut des remparts: « Nos savants ont ordonné que nul n’ouvre Sus, sauf le Dajjal ou une armée le contenant. » Lorsque Safi ibn Sayyad, furieux, se dirigea vers la porte, la frappa du pied et cria: « Infitah bi-zar ! », les chaînes se brisèrent, les verrous cédèrent et l’armée envahit la ville. Apprenant que le corps de Daniel gisait en ville, Abou Sabra répondit: « Que m’importe ! » et le laissa entre leurs mains. (Voir: Kamil ibn al-Athir, p. 370-371)."
  ur: "السوس میں راہبوں اور پادریوں کو دیواروں سے نیچے بلایا گیا: ہمارے علما نے یہ بات چھوڑ دی کہ سوس کو دجال یا اس پر مشتمل فوج کے علاوہ کوئی نہیں کھولے گا - جب صفی ابن صیاد غصے میں دروازے کی طرف بڑھا اور اسے لات ماری اور پکارا \"انفتاح بذریعہ\"، زنجیریں ٹوٹ گئیں، دانیال کے جسم میں تالے ٹوٹ گئے۔ شہر میں لیٹ گئے، ابو سبرہ نے جواب دیا: \"یہ مجھے کیا ہے!\" اور اسے ان کے ہاتھ میں چھوڑ دیا۔ 370-371}۔"
  tr: "Şahriyar'ın (Hormuzan'ın kardeşi) kontrolündeki Susa'nın fethi: Müslümanlar şehri kuşattılar ve onlarla birkaç kez çatıştılar. Susa halkı Müslümanlara kayıplar verdirdi. Keşişler ve rahipler onlara tepeden bakarak, \"Alimlerimiz bize Susa'nın ancak Deccal veya Deccal'in aralarında bulunduğu bir kavim tarafından fethedileceğini söylediler\" dediler. Safi ibn Seyyid, Numan'ın süvarileriyle birlikte Susa'nın kapısına geldiğinde öfkeyle \"Açın kapıyı, ey alçaklar!\" diyerek kapıyı tekmeledi. Zincirler kırıldı, kilitler parçalandı, kapılar açıldı ve Müslümanlar içeri girdiler. Çok tanrılılar teslim oldular ve barış istediler, Müslümanlar da şehre zorla girdikten sonra karşılık verdiler. Ebu Sabra'ya, \"Bu şehirde Daniel'in cesedi var\" denildi. O da, \"Bana ne?\" diye cevap verdi ve cesedi onların ellerine bıraktı. {cite:kamil-ibn-al-athir s. 370-371}"
  id: "Penaklukan Susa, yang berada di bawah kendali Shahriyar, saudara Hormuzan: Kaum Muslim mengepungnya dan beberapa kali terlibat pertempuran kecil dengan mereka. Penduduk Susa menimbulkan banyak korban jiwa di pihak Muslim. Para biarawan dan pendeta memandang rendah mereka dan berkata, “Para ulama kami telah mengatakan kepada kami bahwa Susa hanya akan ditaklukkan oleh Antikristus atau kaum yang di antara mereka terdapat Antikristus.” Safi bin Sayyad berada bersama pasukan kavaleri al-Nu’man ketika ia sampai di gerbang Susa dan menendangnya, sambil berkata, “Bukalah, dasar bajingan!” dengan marah. Rantai putus, kunci hancur, gerbang terbuka, dan kaum Muslim masuk. Kaum musyrik menyerah dan meminta perdamaian, dan kaum Muslim menjawab setelah mereka memasuki kota dengan paksa. Dikatakan kepada Abu Sabra, “Ini adalah jenazah Daniel di kota ini.” Ia menjawab, “Apa peduliku?” dan meninggalkannya di tangan mereka. {cite:kamil-ibn-al-athir hlm. 370-371}"
