summary:
  ar: "فتح السوس وعليها شهريار أخو الهرمزان: أحاط المسلمون بها وناوشوهم القتال مرات وكان أهل السوس يصيبون في المسلمين، وأشرف عليهم الرهبان والقسيسون فقالوا إن مما عهد إلينا علماؤنا أنه لا يفتح السوس إلا الدجال أو قوم فيهم الدجال. وكان صافي بن صياد في خيل النعمان فأتى باب السوس فدقّه برجله وقال انفتح بظار وهو غضبان، فتقطعت السلاسل وتكسرت الأغلاق وتفتحت الأبواب ودخل المسلمون وألقى المشركون بأيديهم ونادوا الصلح الصلح فأجابوهم بعد ما دخلوها عنوة. وقيل لأبي سبرة هذا جسد دانيال في هذه المدينة فقال وما عليّ بذلك وأقره في أيديهم {cite:kamil-ibn-al-athir p. 370-371}."
  en: "At al-Sus the monks and priests called down from the walls: our learned men left word that none shall open Sus but the Dajjal or an army containing him — when Safi ibn Sayyad strode to the gate in a rage, kicked it and cried «Infitah bi-zar!«, the chains snapped, the locks broke, and the army poured in. Told that Daniel's body lay in the city, Abu Sabra answered: «What is that to me!« and left it in their hands {cite:kamil-ibn-al-athir p. 370-371}."
