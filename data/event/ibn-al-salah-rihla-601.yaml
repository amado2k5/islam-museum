label:
  ar: "رحلة ابن الصلاح الأولى في طلب الحديث: بغداد ودُبَيْس وهمذان، نحو ٦٠١هـ"
  en: "Ibn al-Salah's first hadith journey at about twenty-four: Baghdad, Dubays and Hamadan, c. 601"
  ur: "ابن الصلاح کا تقریباً چوبیس برس کی عمر میں پہلا سفرِ حدیث: بغداد، دبیس اور ہمذان، تقریباً 601ھ"
summary:
  ar: "رحل ابن الصلاح وله بضع وعشرون سنة إلى بغداد، فسمع بها من أبي أحمد عبد الوهاب ابن سكينة وعمر بن طبرزاد؛ وبدُبَيْس من إسماعيل بن إبراهيم الخباز؛ وبهمذان من أبي الفضل بن المعظم وجماعة {cite:tarikh-islam-dhahabi p. 185}."
  en: "When he was a little over twenty, Ibn al-Salah set out for Baghdad, where he heard hadith from Abu Ahmad 'Abd al-Wahhab b. Sukayna and 'Umar b. Tabarzad; at Dubays from Isma'il b. Ibrahim al-Khazzaz; and at Hamadan from Abu al-Fadl b. al-Mu'azzim and a group {cite:tarikh-islam-dhahabi p. 185}."
  ur: "جب وہ بیس برس سے کچھ زیادہ کے تھے، ابن الصلاح بغداد کے لیے روانہ ہوئے، جہاں انہوں نے ابو احمد عبد الوہاب بن سکینہ اور عمر بن طبرزاد سے سماعت کی؛ دبیس میں اسماعیل بن ابراہیم خزاز سے؛ اور ہمذان میں ابو الفضل بن معظم اور دیگر سے {cite:tarikh-islam-dhahabi p. 185}۔"
