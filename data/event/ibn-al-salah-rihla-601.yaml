label:
  ar: "رحلة ابن الصلاح الأولى في طلب الحديث: بغداد ودُبَيْس وهمذان، نحو ٦٠١هـ"
  en: "Ibn al-Salah's first hadith journey at about twenty-four: Baghdad, Dubays and Hamadan, c. 601"
  ur: "ابن الصلاح کا تقریباً چوبیس برس کی عمر میں پہلا سفرِ حدیث: بغداد، دبیس اور ہمذان، تقریباً 601ھ"
  es: "Primer viaje de Ibn al-Salah para estudiar hadices, a los veinticuatro años aproximadamente: Bagdad, Dubays y Hamadán, c. 601."
  fr: "Premier voyage d'Ibn al-Salah pour recueillir des hadiths vers l'âge de vingt-quatre ans: Bagdad, Dubaï et Hamadan, vers 601."
  tr: "İbn al-Salah'ın hadis arayışındaki ilk yolculuğu: Bağdat, Dubai ve Hamadan, yaklaşık 601 Hicri yılı."
  id: "Perjalanan pertama Ibn al-Salah dalam mencari Hadits: Baghdad, Dubai, dan Hamadan, sekitar tahun 601 Hijriah."
summary:
  ar: "رحل ابن الصلاح وله بضع وعشرون سنة إلى بغداد، فسمع بها من أبي أحمد عبد الوهاب ابن سكينة وعمر بن طبرزاد؛ وبدُبَيْس من إسماعيل بن إبراهيم الخباز؛ وبهمذان من أبي الفضل بن المعظم وجماعة {cite:tarikh-islam-dhahabi p. 185}."
  en: "When he was a little over twenty, Ibn al-Salah set out for Baghdad, where he heard hadith from Abu Ahmad 'Abd al-Wahhab b. Sukayna and 'Umar b. Tabarzad; at Dubays from Isma'il b. Ibrahim al-Khazzaz; and at Hamadan from Abu al-Fadl b. al-Mu'azzim and a group {cite:tarikh-islam-dhahabi p. 185}."
  ur: "جب وہ بیس برس سے کچھ زیادہ کے تھے، ابن الصلاح بغداد کے لیے روانہ ہوئے، جہاں انہوں نے ابو احمد عبد الوہاب بن سکینہ اور عمر بن طبرزاد سے سماعت کی؛ دبیس میں اسماعیل بن ابراہیم خزاز سے؛ اور ہمذان میں ابو الفضل بن معظم اور دیگر سے {cite:tarikh-islam-dhahabi p. 185}۔"
  es: "Cuando tenía poco más de veinte años, Ibn al-Salah partió hacia Bagdad, donde escuchó hadices de Abu Ahmad 'Abd al-Wahhab b. Sukayna y 'Umar b. Tabarzad; en Dubais de Isma'il b. Ibrahim al-Khazzaz; y en Hamadan de Abu al-Fadl b. al-Mu'azzim y un grupo {citar:tarikh-islam-dhahabi p. 185}."
  fr: "Quand il avait un peu plus de vingt ans, Ibn al-Salah partit pour Bagdad, où il entendit le hadith d'Abu Ahmad 'Abd al-Wahhab b. Sukayna et 'Umar b. Tabarzad; à Dubays de Isma'il b. Ibrahim al-Khazzaz; et à Hamadan d'Abu al-Fadl b. al-Mu'azzim et un groupe {cite:tarikh-islam-dhahabi p. 185}."
  tr: "İbn el-Salah yirmi küsur yaşındayken Bağdat'a gitti ve orada Ebu Ahmed Abd el-Vahhab İbn Sakina ve Ömer İbn Teberzad'dan; Dubai'de İsmail İbn İbrahim el-Habbaz'dan; Hamadan'da ise Ebu el-Fadl İbn el-Mu'azzam ve bir grup insandan bilgi aldı. {cite:tarikh-islam-dhahabi s. 185}"
  id: "Ibn al-Salah melakukan perjalanan ke Baghdad ketika usianya sekitar dua puluh tahun, dan di sana ia mendengar dari Abu Ahmad Abd al-Wahhab Ibn Sakina dan Omar Ibn Tabarzad; dan di Dubays dari Ismail Ibn Ibrahim al-Khabbaz; dan di Hamadan dari Abu al-Fadl Ibn al-Mu’azzam dan sekelompok orang. {cite:tarikh-islam-dhahabi p. 185}."
