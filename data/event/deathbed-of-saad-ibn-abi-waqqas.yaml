id: event/deathbed-of-saad-ibn-abi-waqqas
class: event
kind: death
label:
  ar: وصية سعد بن أبي وقاص بالثلث وموته بالعقيق ودفنه بالبقيع
  en: Sa'd ibn Abi Waqqas, the bequest of a third, his death at al-Aqiq and burial in al-Baqi'
  ur: "سعد بن ابی وقاص: ثلث کی وصیت، عقیق میں وفات اور بقیع میں تدفین"
  es: "Sa'd ibn Abi Waqqas, el legado de un tercero, su muerte en al-Aqiq y entierro en al-Baqi'"
  fr: "Sa'd ibn Abi Waqqas, le legs d'un troisième, sa mort à al-Aqiq et son enterrement à al-Baqi'"
  tr: "Sa'd ibn Abi Waqqas'ın vasiyetinde mal varlığının üçte birini vasiyet ettiği, Akik'te vefat ettiği ve Baki'ye defnedileceği belirtilmiştir."
  id: "Surat wasiat Sa'd ibn Abi Waqqas mewariskan sepertiga dari hartanya, kematiannya di al-`Aqiq, dan pemakamannya di al-Baqi`."
summary:
  ar: "عاد النبي سعد بن أبي وقاص بمكة وهو مريض ويكره أن يموت بالأرض التي هاجر منها، فسأله سعد أيوصي بماله كله فقال لا، فالشطر قال لا، فالثلث قال الثلث والثلث كثير وأن تدع ورثتك أغنياء خير من أن تدعهم عالة {cite:sahih-al-bukhari 2742}. وبعد عقود مات سعد في قصره بالعقيق على عشرة أميال من المدينة، فحُمل على أعناق الرجال إلى المدينة وصلى عليه مروان بن الحكم ودُفن بالبقيع {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 277}. وكان أوصى أن يكفن في جبة صوف له لقي فيها المشركين يوم بدر {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 p. 143}. وأرسل أزواج النبي أن يمروا بجنازته في المسجد فصلين عليه {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 p. 143}، وتركَ يوم مات مئتي ألف وخمسين ألف درهم {cite:siyar-alam-nubala scan vol. 2 p. 169}."
  en: "The Prophet visited Sa'd ibn Abi Waqqas in Mecca while he was ill and averse to dying in the land he had emigrated from; Sa'd asked whether he might bequeath all his wealth, then half, then a third, and was told that a third, and a third is much, and that leaving heirs well-off is better than leaving them in need {cite:sahih-al-bukhari 2742}. Decades later Sa'd died in his house at al-Aqiq, ten miles from Medina; he was carried on men's shoulders to Medina, Marwan ibn al-Hakam prayed over him and he was buried in al-Baqi' {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 277}. He had asked to be shrouded in a woollen garment in which he had met the polytheists at Badr {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 p. 143}. The wives of the Prophet sent word that his bier be brought past them in the mosque, and they prayed over him {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 p. 143}; on the day he died he left two hundred and fifty thousand dirhams {cite:siyar-alam-nubala scan vol. 2 p. 169}."
  ur: "نبی مکہ میں سعد بن ابی وقاص کی عیادت کو گئے جب وہ بیمار تھے اور جس سرزمین سے ہجرت کی تھی وہاں مرنا پسند نہ کرتے تھے؛ سعد نے پوچھا کہ کیا پورے مال کی وصیت کر دیں، پھر آدھے کی، پھر تہائی کی، تو فرمایا کہ تہائی، اور تہائی بھی بہت ہے، اور تم اپنے ورثا کو خوشحال چھوڑو یہ اس سے بہتر ہے کہ انھیں محتاج چھوڑو {cite:sahih-al-bukhari 2742}. دہائیوں بعد سعد اپنے گھر عقیق میں مدینے سے دس میل دور فوت ہوئے، انھیں لوگوں کے کندھوں پر مدینے لایا گیا، مروان بن الحکم نے نماز پڑھائی اور بقیع میں دفن ہوئے {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 277}. انھوں نے وصیت کی تھی کہ انھیں اسی اونی جبے میں کفن دیا جائے جسے پہن کر بدر میں مشرکوں سے لڑے تھے {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 p. 143}. ازواجِ نبی نے کہلا بھیجا کہ ان کا جنازہ مسجد میں سے گزارا جائے اور انھوں نے بھی نماز پڑھی {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 p. 143}؛ وفات کے دن انھوں نے دو لاکھ پچاس ہزار درہم چھوڑے {cite:siyar-alam-nubala scan vol. 2 p. 169}."
  es: "El Profeta visitó a Sa'd ibn Abi Waqqas en La Meca mientras estaba enfermo y reacio a morir en la tierra de la que había emigrado; Sa'd preguntó si podía legar toda su riqueza, luego la mitad, luego un tercio, y se le dijo que un tercio, y un tercio es mucho, y que dejar herederos bien es mejor que dejarlos necesitados {cite:sahih-al-bukhari 2742}. Décadas después, Sa'd murió en su casa en al-Aqiq, a diez millas de Medina; fue llevado a hombros de hombres a Medina, Marwan ibn al-Hakam oró por él y fue enterrado en al-Baqi' {cite:isti-ab-ibn-abd-al-barr scan vol. 3 p. 277}. Había pedido ser envuelto en una prenda de lana con la que se había encontrado con los politeístas en Badr {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 pág. 143}. Las esposas del Profeta enviaron un mensaje para que su féretro pasara frente a ellas en la mezquita, y oraron por él {cita:sifat-al-safwa-tartusi-2012 scan vol. 4 pág. 143}; el día de su muerte dejó doscientos cincuenta mil dirhams {cita:siyar-alam-nubala scan vol. 2 pág. 169}."
  fr: "Le Prophète rendit visite à Sa'd ibn Abi Waqqas à La Mecque alors qu'il était malade et réticent à mourir dans sa terre natale. Sa'd demanda s'il pouvait léguer toute sa fortune, puis la moitié, puis un tiers. Il lui fut répondu qu'un tiers, et qu'un tiers était déjà beaucoup, et qu'il valait mieux laisser ses héritiers dans l'aisance que de les laisser dans le besoin (Sahih al-Bukhari, p. 2742). Des décennies plus tard, Sa'd mourut dans sa maison d'al-Aqiq, à seize kilomètres de Médine. Porté sur les épaules d'hommes jusqu'à Médine, il fut enterré à al-Baqi' par Marwan ibn al-Hakam (Isti ibn Abd al-Barr, vol. 3, p. 277). Il avait demandé à être enveloppé dans un linceul de laine, celui-là même qu'il portait lors de sa rencontre avec les polythéistes à Badr. Les épouses du Prophète firent venir son cercueil devant elles dans la mosquée, et elles prièrent sur lui. Le jour de sa mort, il laissa deux cent cinquante mille dirhams."
  tr: "Peygamberimiz, Sa'd ibn Abi Waqqas hastalandığında ve hicret ettiği topraklarda ölmek istemediğinde Mekke'ye döndü. Sa'd ona tüm mal varlığını vasiyet etmesini isteyip istemediğini sordu ve o da \"Hayır\" diye cevap verdi. Sonra \"Yarısını?\" diye sordu ve o da \"Hayır\" diye cevap verdi. Sonra \"Üçte birini?\" diye sordu ve o da \"Üçte biri çoktur. Mirasçılarınızı zengin bırakmak, onları yoksul bırakmaktan daha iyidir\" diye cevap verdi. (Sahih-i Buhari 2742). On yıllar sonra Sa'd, Medine'ye on mil uzaklıktaki el-Akik'teki sarayında vefat etti. Cenazesi omuzlarda Medine'ye taşındı ve Mervan ibn el-Hakam cenaze namazını kıldırdı. El-Baki'ye defnedildi. (İsti-ab-ibn-abd-al-barr tarama cilt 3 s. 277). Bedir Muharebesi'nde müşriklerle karşılaştığında giydiği yünlü cübbeyle kefenlenmeyi istemişti. (Kaynak: Sifat-al-Safwa-Tartusi-2012, cilt 4, s. 143). Peygamberin eşleri, cenaze alayının mescidin önünden geçmesini ve onun için dua etmelerini haber gönderdiler. (Kaynak: Sifat-al-Safwa-Tartusi-2012, cilt 4, s. 143) Vefat ettiği gün iki yüz elli bin dirhem miras bıraktı. (Kaynak: Siyar-alam-Nubala, cilt 2, s. 169)"
  id: "Nabi kembali ke Mekah ketika Sa'd ibn Abi Waqqas sakit dan tidak ingin meninggal di negeri tempat ia berhijrah. Sa'd bertanya kepadanya apakah ia harus mewariskan seluruh kekayaannya, dan ia menjawab, \"Tidak.\" Kemudian beliau bertanya, \"Setengah?\" dan ia menjawab, \"Tidak.\" Kemudian beliau bertanya, \"Sepertiga?\" dan ia menjawab, \"Sepertiga itu banyak. Lebih baik meninggalkan ahli warismu dalam keadaan kaya daripada meninggalkan mereka dalam keadaan miskin.\" (kutipan: sahih al-bukhari 2742). Beberapa dekade kemudian, Sa'd meninggal di istananya di al-'Aqiq, sepuluh mil dari Madinah. Jenazahnya diusung oleh orang-orang ke Madinah, dan Marwan ibn al-Hakam memimpin salat jenazah. Ia dimakamkan di al-Baqi'. (kutipan: isti ab ibn abd al-barr scan vol. 3 hlm. 277). Beliau meminta agar jenazahnya dikafani dengan jubah wol yang dikenakannya ketika bertemu dengan kaum musyrik di Perang Badar. (cite:sifat-al-safwa-tartusi-2012 scan vol. 4 p. 143). Istri-istri Nabi mengirim pesan agar iring-iringan jenazahnya melewati masjid dan mereka berdoa untuknya. {cite:sifat-al-safwa-tartusi-2012 scan vol. 4 p. 143} Beliau meninggalkan dua ratus lima puluh ribu dirham pada hari wafatnya. {cite:siyar-alam-nubala scan vol. 2 p. 169}"
