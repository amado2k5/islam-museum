label: { ar: "غزوة عبد الله بن رواحة إلى خيبر ومقتل اليسير بن رزام", en: "Abdullah ibn Rawaha's expedition to Khaybar and the killing of al-Yasir ibn Rizam" }
summary:
  ar: "كان اليسير بن رزام، ويقال ابن رازم، بخيبر يجمع غطفان لغزو النبي، فبعث إليه النبي عبد الله بن رواحة في نفر منهم عبد الله بن أنيس، فكلّموه ورغّبوه في القدوم على النبي ليستعمله ويكرمه، حتى خرج معهم في نفر من يهود؛ فلما كان بالقرقرة على ستة أميال من خيبر ندم، ففطن له عبد الله بن أنيس وهو يريد السيف فضربه فقطع رجله، وضربه اليسير بمخرش من شوحط فشجّه، ومال كل رجل من المسلمين على صاحبه من يهود فقتله إلا رجلاً أفلت؛ وتفل النبي على شجة ابن أنيس فلم تقح."
  en: "Al-Yasir ibn Rizam, also given as Ibn Razim, was at Khaybar gathering Ghatafan to attack the Prophet, who sent Abdullah ibn Rawaha with a party including Abdullah ibn Unays; they persuaded him that the Prophet would appoint and honour him, and he set out with them with a group of Jews. At al-Qarqara, six miles from Khaybar, he repented; Ibn Unays saw him reaching for the sword, struck him and cut off his leg, al-Yasir hit him on the head with a staff of shawhat wood, and each Muslim killed his Jewish companion except one who fled; the Prophet spat on Ibn Unays's wound and it did not fester."
