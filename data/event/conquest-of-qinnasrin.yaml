id: event/conquest-of-qinnasrin
class: event
kind: conquest
label: { ar: "فتح قنسرين", en: "The Conquest of Qinnasrin", es: "La conquista de Qinnasrin", fr: "La conquête de Qinnasrin", ur: "کناسرین کی فتح" }
summary:
  ar: "عند البلاذري: سار أبو عبيدة بن الجراح بعد فراغه من أمر اليرموك إلى حمص فاستقرها ثم أتى قنسرين وعلى مقدمته خالد بن الوليد فقاتله أهل مدينة قنسرين ثم لجأوا إلى حصنهم وطلبوا الصلح فصالحهم على مثل صلح حمص وغلب المسلمون على أرضها وقراها، وكان حاضر قنسرين لتنوخ مذ أول ما تنخوا بالشام نزلوه وهم في خيم الشعر ثم ابتنوا به المنازل فدعاهم أبو عبيدة إلى الإسلام فأسلم بعضهم وأقام على النصرانية بنو صالح بن حلوان من قضاعة ومنهم من أسلم في خلافة المهدي؛ ثم سار أبو عبيدة يريد حلب فبلغه أن أهل قنسرين قد نقضوا وغدروا فوجه إليهم السمط بن الأسود الكندي فحصرهم ثم فتحها، وكان حاضر طيء قديماً نزلوه بعد حرب الفساد التي كانت بينهم حين نزل الجبلين من نزل منهم وتفرق باقوهم في البلاد، وكان بقرب حلب حاضر تدعى حاضر حلب يجمع أصنافاً من العرب من تنوخ وغيرهم فصالحهم أبو عبيدة على الجزية ثم أسلموا بعد ذلك وبقوا مقيمين وأعقابهم به إلى بعيد وفاة الرشيد."
  en: "In al-Baladhuri: Abu Ubayda ibn al-Jarrah, after finishing with the Yarmuk, went to Hims and secured it, then came to Qinnasrin with Khalid ibn al-Walid on his vanguard; the people of the city fought him then took refuge in their fortress and sued for terms, which he granted on the like of Hims's treaty, the Muslims mastering its land and villages — its hadir (camp-town) belonging to Tanukh since their first settling in Syria, when they dwelt in hair tents before building houses, and he called them to Islam, some converting while Banu Salih ibn Hulwan of Quda'a remained Christian, some of their descendants converting in al-Mahdi's caliphate; as Abu Ubayda marched on Aleppo word came that Qinnasrin's people had broken faith, so he sent al-Simt ibn al-Aswad al-Kindi who besieged and took it; the hadir of Tayyi' was of old, settled after the war of corruption among them when those of the Jabalayn settled and the rest scattered through the lands, and near Aleppo stood the hadir called Hadir Halab gathering kinds of Arabs from Tanukh and others — Abu Ubayda compounded with them for jizya and they later converted, remaining there with their descendants until long after al-Rashid's death."
  es: "En al-Baladhuri: Abu Ubayda ibn al-Jarrah, después de terminar con Yarmuk, fue a Hims y la aseguró, luego llegó a Qinnasrin con Khalid ibn al-Walid en su vanguardia; la gente de la ciudad luchó contra él, luego se refugió en su fortaleza y pidió condiciones, que él concedió como el tratado de Hims, los musulmanes dominaron su tierra y aldeas, su hadir (campamento-ciudad) pertenecía a Tanukh desde su primer asentamiento en Siria, cuando habitaban en tiendas de pelo antes de construir casas, y él los llamó al Islam, algunos se convirtieron mientras que Banu Salih ibn Hulwan de Quda'a permaneció cristiano, algunos de sus descendientes se convirtieron en el califato de al-Mahdi; cuando Abu Ubayda marchó sobre Alepo llegó la noticia de que la gente de Qinnasrin había roto la fe, así que envió a al-Simt ibn al-Aswad al-Kindi, quien la sitió y la tomó; El hadir de Tayyi' era antiguo, establecido después de la guerra de corrupción entre ellos, cuando los de Jabalayn se asentaron y el resto se dispersó por las tierras, y cerca de Alepo se encontraba el hadir llamado Hadir Halab que reunía a árabes de Tanukh y otros. Abu Ubayda negoció con ellos a cambio de la jizya y más tarde se convirtieron, permaneciendo allí con sus descendientes hasta mucho después de la muerte de al-Rashid."
  fr: "Dans al-Baladhuri: Abu Ubayda ibn al-Jarrah, après avoir pris le contrôle du Yarmouk, se rendit à Hims et s'en empara, puis vint à Qinnasrin avec Khalid ibn al-Walid à son avant-garde; les habitants de la ville le combattirent, puis se réfugièrent dans leur forteresse et demandèrent des conditions, qu'il leur accorda sur le modèle du traité de Hims, les musulmans s'emparant de ses terres et de ses villages — son hadir (campement) appartenant aux Tanukh depuis leur première installation en Syrie, lorsqu'ils habitaient des tentes de poils avant de construire des maisons, et il les appela à l'islam, certains se convertissant tandis que les Banu Salih ibn Hulwan de Quda'a restèrent chrétiens, certains de leurs descendants se convertissant dans le califat d'al-Mahdi; alors qu'Abu Ubayda marchait sur Alep, la nouvelle parvint que les habitants de Qinnasrin avaient rompu leur foi, il envoya donc al-Simt ibn al-Aswad al-Kindi qui assiégea et prit la ville; Le hadir de Tayyi' était ancien, établi après la guerre de corruption parmi eux lorsque ceux de Jabalayn s'y installèrent et que les autres se dispersèrent à travers les terres, et près d'Alep se trouvait le hadir appelé Hadir Halab rassemblant des Arabes de Tanukh et d'autres — Abu Ubayda s'associa avec eux pour la jizya et ils se convertirent plus tard, restant là avec leurs descendants jusqu'à longtemps après la mort d'al-Rashid."
  ur: "البلادوری میں ہے: ابو عبیدہ بن الجراح، یرموک سے فارغ ہونے کے بعد، حمص کے پاس گئے اور اسے محفوظ کر لیا، پھر خالد بن ولید کے ساتھ کنسرین پہنچے۔ شہر کے لوگوں نے اس سے جنگ کی پھر اپنے قلعے میں پناہ لی اور شرائط کے لیے مقدمہ دائر کیا، جو اس نے ہمس کے معاہدے کی طرح دیا تھا، مسلمانوں نے اس کی زمین اور دیہاتوں پر قبضہ کر لیا تھا - اس کا حدیر ⁦(کیمپ ٹاؤن)⁩ تنخ سے تعلق رکھتا تھا جب وہ شام میں پہلی بار آباد ہوئے تھے، جب وہ مکانات بنانے سے پہلے بالوں کے خیموں میں رہتے تھے، اور اس نے انہیں بنو سعان کے کچھ لوگوں کو اسلام قبول کرنے کے لیے بلایا تھا۔ عیسائی رہے، ان کی اولادوں میں سے کچھ نے المہدی کی خلافت میں تبدیلی کی۔ جیسا کہ ابو عبیدہ نے حلب کی طرف پیش قدمی کی کہ قنصرین کے لوگوں کا ایمان ٹوٹ گیا تو اس نے سمط بن اسود الکندی کو بھیجا جس نے اس کا محاصرہ کیا اور اسے لے لیا۔ طائی کا حیدر پرانا تھا، ان کے درمیان فساد کی جنگ کے بعد جب جبلین کے لوگ آباد ہوئے اور باقی لوگ زمین پر بکھر گئے، اور حلب کے قریب حادیر حلب کھڑا تھا جو تنوخ اور دوسرے لوگوں کے عربوں کو اکٹھا کر رہا تھا- ابو عبیدہ جزیہ کے لیے ان کے ساتھ ملا ہوا تھا اور بعد میں طویل عرصے کے بعد وہ وہاں رہ گئے، یہاں تک کہ وہ اپنے مذہب کو چھوڑ کر چلے گئے۔ موت"
