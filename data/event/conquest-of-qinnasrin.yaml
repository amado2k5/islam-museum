label: { ar: "فتح قنسرين", en: "The Conquest of Qinnasrin" }
summary:
  ar: "عند البلاذري: سار أبو عبيدة بن الجراح بعد فراغه من أمر اليرموك إلى حمص فاستقرها ثم أتى قنسرين وعلى مقدمته خالد بن الوليد فقاتله أهل مدينة قنسرين ثم لجأوا إلى حصنهم وطلبوا الصلح فصالحهم على مثل صلح حمص وغلب المسلمون على أرضها وقراها، وكان حاضر قنسرين لتنوخ مذ أول ما تنخوا بالشام نزلوه وهم في خيم الشعر ثم ابتنوا به المنازل فدعاهم أبو عبيدة إلى الإسلام فأسلم بعضهم وأقام على النصرانية بنو صالح بن حلوان من قضاعة ومنهم من أسلم في خلافة المهدي؛ ثم سار أبو عبيدة يريد حلب فبلغه أن أهل قنسرين قد نقضوا وغدروا فوجه إليهم السمط بن الأسود الكندي فحصرهم ثم فتحها، وكان حاضر طيء قديماً نزلوه بعد حرب الفساد التي كانت بينهم حين نزل الجبلين من نزل منهم وتفرق باقوهم في البلاد، وكان بقرب حلب حاضر تدعى حاضر حلب يجمع أصنافاً من العرب من تنوخ وغيرهم فصالحهم أبو عبيدة على الجزية ثم أسلموا بعد ذلك وبقوا مقيمين وأعقابهم به إلى بعيد وفاة الرشيد."
  en: "In al-Baladhuri: Abu Ubayda ibn al-Jarrah, after finishing with the Yarmuk, went to Hims and secured it, then came to Qinnasrin with Khalid ibn al-Walid on his vanguard; the people of the city fought him then took refuge in their fortress and sued for terms, which he granted on the like of Hims's treaty, the Muslims mastering its land and villages — its hadir (camp-town) belonging to Tanukh since their first settling in Syria, when they dwelt in hair tents before building houses, and he called them to Islam, some converting while Banu Salih ibn Hulwan of Quda'a remained Christian, some of their descendants converting in al-Mahdi's caliphate; as Abu Ubayda marched on Aleppo word came that Qinnasrin's people had broken faith, so he sent al-Simt ibn al-Aswad al-Kindi who besieged and took it; the hadir of Tayyi' was of old, settled after the war of corruption among them when those of the Jabalayn settled and the rest scattered through the lands, and near Aleppo stood the hadir called Hadir Halab gathering kinds of Arabs from Tanukh and others — Abu Ubayda compounded with them for jizya and they later converted, remaining there with their descendants until long after al-Rashid's death."
