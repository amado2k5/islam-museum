label:
  ar: "شعر الهادي في الصبر وشعره في عدّته وتوعد الأكيليين، 287هـ"
  en: "Al-Hadi's verse of patience and his verse on his arms and his threat to the Akilis, 287 AH"
  ur: "ہادی کا صبر پر شعر اور اپنے ہتھیاروں اور اکیلیوں کو وعید پر شعر، 287ھ"
summary:
  ar: "قال الهادي بعد الوقعة شعراً في صبره على الزمان وثباته، ثم شعراً يصف فيه سلاحه وفرسه وعزمه على أن يطأ أرض خصومه ويهدم حصنهم وأن يبلغهم بما قدموا، فلا يُنقل منه بيت."
  en: "After the fight al-Hadi composed verse on his patience against the times and his steadiness, then a poem describing his weapons and horse and his resolve to tread his opponents' land and break their fort, and to repay them for what they sent ahead; no line is quoted."
  ur: "لڑائی کے بعد ہادی نے زمانے پر اپنے صبر اور ثابت قدمی پر شعر کہا، پھر ایک نظم جس میں اپنے ہتھیاروں اور گھوڑے کا ذکر اور مخالفوں کی زمین روندنے، ان کا قلعہ توڑنے اور ان کے کیے کا بدلہ دینے کا عزم ہے؛ کوئی مصرع نقل نہیں۔"
