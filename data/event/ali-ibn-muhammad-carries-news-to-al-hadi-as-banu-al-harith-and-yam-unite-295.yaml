id: event/ali-ibn-muhammad-carries-news-to-al-hadi-as-banu-al-harith-and-yam-unite-295
class: event
kind: other
label:
  ar: "علي بن محمد يحمل الخبر إلى الهادي باتحاد بني الحارث ويأم، سنة 295هـ، ص353"
  en: "Ali ibn Muhammad carries news to al-Hadi that Banu al-Harith and Ya'am have united, 295 AH, p. 353"
  ur: "علی بن محمد کا ہادی کو بنو الحارث اور یأم کے اتحاد کی خبر لے جانا، 295ھ، ص353"
  es: "Ali ibn Muhammad lleva la noticia a al-Hadi de que Banu al-Harith y Ya'am se han unido, 295 AH, pág. 353."
  fr: "Ali ibn Muhammad apporte à al-Hadi la nouvelle que Banu al-Harith et Ya'am se sont unis, 295 AH, p. 353"
summary:
  ar: "لما صحّ الخبر أرسل محمد بن عبيد الله ابنه علي بن محمد إلى الهادي بكتاب يطلب فيه أن يسبق القوم إلى البلد قبل أن يتحصنوا في القرية وميناس، وختم كتابه بشعر من بيتين."
  en: "Once the news was confirmed, Muhammad ibn Ubaydallah sent his son Ali ibn Muhammad to al-Hadi with a letter asking him to reach the town before the rebels fortified al-Qarya and Maynas. Ali's letter ended with two lines of verse."
  ur: "خبر کی تصدیق ہونے پر محمد بن عبیداللہ نے اپنے بیٹے علی بن محمد کو ہادی کے پاس خط دے کر بھیجا کہ باغیوں کے القریہ اور میناس میں مورچہ بند ہونے سے پہلے شہر تک پہنچ جائیں۔ علی کے خط کے آخر میں دو اشعار تھے۔"
  es: "Una vez confirmada la noticia, Muhammad ibn Ubaydallah envió a su hijo Ali ibn Muhammad a al-Hadi con una carta pidiéndole que llegara a la ciudad antes de que los rebeldes fortificaran al-Qarya y Maynas. La carta de Ali terminaba con dos versos."
  fr: "Une fois la nouvelle confirmée, Muhammad ibn Ubaydallah envoya son fils Ali ibn Muhammad à al-Hadi avec une lettre lui demandant de rejoindre la ville avant que les rebelles ne fortifient al-Qarya et Maynas. La lettre d'Ali se terminait par deux vers."
