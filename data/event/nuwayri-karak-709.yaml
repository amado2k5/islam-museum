id: event/nuwayri-karak-709
class: event
kind: other
label:
  ar: "النويري يلحق بالسلطان الناصر منفياً بالكرك، ربيع الآخر ٧٠٩هـ/سبتمبر ١٣٠٩م"
  en: "Al-Nuwayri joins the exiled al-Nasir at al-Karak, Rabi' II 709/September 1309"
  ur: "نويری جلاوطن الناصر سے کرک میں ملے، ربيع الآخر 709ھ/ستمبر 1309ء"
summary:
  ar: "ملّ السلطان الناصر محمد بن قلاوون وصاية الأمراء الكبار فنزل عن الملك سنة ٧٠٨هـ وأقام أميراً على الكرك، وقام في القاهرة بيبرس الجاشنكير؛ وبعد خمسة أشهر، في ربيع الآخر ٧٠٩هـ/سبتمبر ١٣٠٩م، لحق به النويري — وهو على ولايته — إلى الكرك يراه السلطان الشرعي الوحيد، ولم يعد إلى القاهرة إلا مع السلطان لدى استرداده العرش في أواخر رمضان ٧٠٩هـ/أوائل مارس ١٣١٠م {cite:encyclopaedia-of-islam-2 vol. 8 pp. 157-158}."
  en: "Wearying of the senior amirs' tutelage, Sultan al-Nasir Muhammad ibn Qalawun abdicated in 708 and installed himself as governor of al-Karak while Baybars al-Jashankir took power in Cairo; five months later, in Rabi' II 709 (September 1309), al-Nuwayri the loyalist joined him at al-Karak, holding him the only legitimate sultan, and returned to Cairo only with the sultan when he regained the throne at the end of Ramadan 709/early March 1310 {cite:encyclopaedia-of-islam-2 vol. 8 pp. 157-158}."
  ur: "بڑے امراء کی سرپرستی سے تنگ آ کر سلطان الناصر محمد بن قلاوون نے 708ھ میں تخت چھوڑ کر کرک کی امارت سنبھالی اور قاہرہ میں بيبرس جاشنكیر بر سر اقتدار آیا؛ پانچ ماہ بعد ربيع الآخر 709ھ ⁦(ستمبر 1309ء)⁩ میں وفادار نويری ان سے کرک میں ملے انہیں واحد جائز سلطان مانتے ہوئے، اور قاہرہ اسی وقت لوٹے جب سلطان آخر رمضان 709ھ/اوائل مارچ 1310ء میں تخت پر واپس آیا {cite:encyclopaedia-of-islam-2 vol. 8 pp. 157-158}۔"
