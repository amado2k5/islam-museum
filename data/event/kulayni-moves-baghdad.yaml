label:
  ar: "انتقال الكليني إلى بغداد، نحو العقد الأول من القرن الرابع"
  en: "al-Kulayni moves to Baghdad, about the first decade of the fourth century"
  ur: "کلینی کا بغداد منتقلی، تقریباً چوتھی صدی کا پہلا عشرہ"
