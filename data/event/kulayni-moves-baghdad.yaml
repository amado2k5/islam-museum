  en: "At an unknown date, perhaps in the first decade of the 4th century AH (913-923), al-Kulayni moved to Baghdad, where he lived and taught in Darb al-Silsila near the Bab al-Kufa on the west bank of the Tigris {cite:encyclopaedia-of-islam-2 vol. 5 p. 401}."
