id: event/shaytan-household-protections
class: event
kind: other
label:
  ar: "وقاية البيت من الشيطان: الباب والسقاء والإناء والمصباح"
  en: "Guarding the house from the shaytan: door, waterskin, vessel and lamp"
  ur: "شیطان سے گھر کی حفاظت: دروازہ، مشک، برتن اور چراغ"
summary:
  ar: "أغلقوا الباب وأوكوا السقاء وأكفئوا الإناء أو خمروه وأطفئوا المصباح فإن الشيطان لا يفتح غلقا ولا يحل وكاء ولا يكشف إناء {cite:muwatta-maruf-1997} [[passage/muwatta-31-2686|الموطأ 31:2686]]."
  en: "Close the door, tie the waterskin, upturn or cover the vessel and extinguish the lamp; for the shaytan does not open what is closed, untie what is tied or uncover a vessel {cite:muwatta-maruf-1997} [[passage/muwatta-31-2686|Muwatta 31:2686]]."
  ur: "دروازہ بند کرو، مشک باندھو، برتن الٹ دو یا ڈھانپ دو اور چراغ بجھا دو؛ کیونکہ شیطان بند چیز نہیں کھولتا، بندھی ہوئی نہیں کھولتا اور برتن نہیں کھولتا {cite:muwatta-maruf-1997} [[passage/muwatta-31-2686|موطأ 31:2686]]۔"
