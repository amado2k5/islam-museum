id: event/umar-dismisses-al-numan-ibn-adi
class: event
kind: other
label: { ar: "عزل عمر النعمان بن عدي عن ميسان", en: "Umar dismisses al-Nu'man ibn Adi from Maysan", es: "Umar despide a al-Nu'man ibn Adi de Maysan", fr: "Umar renvoie al-Nu'man ibn Adi de Maysan", ur: "عمر نے نعمان بن عدی کو میسان سے برطرف کر دیا۔", tr: "Ömer, Al-Nu'man ibn Adi'yi Maysan'dan kovdu", id: "Omar memberhentikan Al-Nu'man ibn Adi dari Maysan" }
summary:
  ar: "روى ابن إسحاق أن عمر بن الخطاب استعمل النعمان بن عدي على ميسان من أرض البصرة ثم عزله لما بلغته أبيات منسوبة إليه؛ فاعتذر النعمان بأنه شاعر قال ما تقول الشعراء، فأجابه عمر أنه لن يستعمله على عمل ما بقي."
  en: Ibn Ishaq relates that Umar ibn al-Khattab appointed al-Nu'man ibn Adi over Maysan in the Basra region, then dismissed him when verses attributed to him reached Umar. Al-Nu'man excused himself that he was a poet saying what poets say, and Umar answered that he would never employ him again as long as he lived.
  es: "Ibn Ishaq relata que Umar ibn al-Khattab nombró a al-Nu'man ibn Adi al frente de Maysan en la región de Basora, pero lo destituyó cuando llegaron a oídos de Umar unos versos que se le atribuían. Al-Nu'man se excusó diciendo que era un poeta que decía lo que dicen los poetas, y Umar respondió que jamás volvería a emplearlo mientras viviera."
  fr: "Ibn Ishaq rapporte qu'Umar ibn al-Khattab nomma al-Nu'man ibn Adi à la tête de Maysan, dans la région de Bassora, puis le destitua lorsque des vers qui lui étaient attribués parvinrent aux oreilles d'Umar. Al-Nu'man se justifia en disant qu'il était un poète et qu'il exprimait ce que disent les poètes, et Umar répondit qu'il ne l'emploierait plus jamais de son vivant."
  ur: "ابن اسحاق کا بیان ہے کہ عمر بن الخطاب نے نعمان بن عدی کو بصرہ کے علاقے میسان پر مقرر کیا، پھر جب ان سے منسوب آیات عمر تک پہنچیں تو انہیں برطرف کر دیا۔ النعمان نے اپنے آپ کو عذر کیا کہ وہ شاعر ہیں جو شاعر کہتے ہیں، اور عمر نے جواب دیا کہ جب تک وہ زندہ رہیں گے وہ اسے دوبارہ ملازمت نہیں دیں گے۔"
  tr: "İbn İshak rivayet etti ki, Ömer ibn el-Hattab, Nu'man ibn Adi'yi Basra topraklarında Maysan (meysan) görevine atadı, ancak kendisine atfedilen şiirler alınca onu görevden aldı. Nu'man, şair olduğunu ve şairlerin söylediklerini söylediğini belirterek kendini savundu, bunun üzerine Ömer, yaşadığı sürece onu hiçbir göreve atamayacağını söyledi."
  id: "Ibn Ishaq meriwayatkan bahwa Umar ibn al-Khattab mengangkat Nu’man ibn Adi ke posisi Maysan di tanah Basra, kemudian memecatnya ketika menerima syair-syair yang dinisbahkan kepadanya. Nu’man beralasan bahwa ia adalah seorang penyair dan mengatakan apa yang biasa dikatakan para penyair, sehingga Umar menjawab bahwa ia tidak akan mengangkatnya ke posisi apa pun selama ia masih hidup."
