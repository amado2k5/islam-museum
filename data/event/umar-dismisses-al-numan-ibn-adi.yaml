label: { ar: "عزل عمر النعمان بن عدي عن ميسان", en: "Umar dismisses al-Nu'man ibn Adi from Maysan" }
summary:
  ar: "روى ابن إسحاق أن عمر بن الخطاب استعمل النعمان بن عدي على ميسان من أرض البصرة ثم عزله لما بلغته أبيات منسوبة إليه؛ فاعتذر النعمان بأنه شاعر قال ما تقول الشعراء، فأجابه عمر أنه لن يستعمله على عمل ما بقي."
  en: Ibn Ishaq relates that Umar ibn al-Khattab appointed al-Nu'man ibn Adi over Maysan in the Basra region, then dismissed him when verses attributed to him reached Umar. Al-Nu'man excused himself that he was a poet saying what poets say, and Umar answered that he would never employ him again as long as he lived.
