id: event/the-ambush-of-the-harithi-party-from-al-jawf-and-the-girl-returned-292
class: event
kind: other
label:
  ar: "كمين جماعة بني الحارث القادمة من الجوف وردّ الصبية، ص292-293"
  en: "The ambush of the Harithi party coming from al-Jawf and the girl sent back, pp. 292-293"
  ur: "الجوف سے آنے والے بنو حارث کے گروہ پر گھات اور بچی کی واپسی، ص292-293"
  es: "La emboscada al grupo Harithi procedente de al-Jawf y la niña enviada de vuelta, págs. 292-293"
  fr: "L'embuscade tendue au groupe Harithi venant d'al-Jawf et la jeune fille renvoyée, pp. 292-293"
  tr: "El-Jawf'tan gelen Beni el-Harith grubuna yapılan pusu ve çocukların buna verdiği yanıt, s. 292-293"
  id: "Penyergapan terhadap kelompok Bani al-Harith yang datang dari al-Jawf dan tanggapan para pemuda, hlm. 292-293"
summary:
  ar: "بلغ الهادي أن جماعة من بني الحارث قادمة من الجوف فوجّه لها عسكراً قعد لها، فحملت الخيل وقُتل رجلان وأُخذت دواب كثيرة، وكان على أحد الأحمال صبية، فردّها الهادي إلى قومها مع أمة وادعية ورجل حارثي."
  en: "Al-Hadi learned that a party of Banu al-Harith was coming from al-Jawf and sent a force that lay in wait; the horse charged, two of them were killed and many laden animals taken, and a girl was found on one load whom al-Hadi sent back to her people with a Wadi'i slave woman and a Harithi man."
  ur: "ہادی کو خبر ملی کہ بنو حارث کا ایک گروہ الجوف سے آ رہا ہے تو انہوں نے ایک لشکر بھیجا جو گھات میں بیٹھا؛ سواروں نے حملہ کیا، ان کے دو آدمی مارے گئے اور بہت سے لدے ہوئے جانور پکڑے گئے، ایک بار پر ایک بچی ملی جسے ہادی نے ایک وادعی لونڈی اور ایک حارثی آدمی کے ساتھ اس کی قوم کے پاس واپس بھیجا۔"
  es: "Al-Hadi supo que un grupo de Banu al-Harith venía de al-Jawf y envió una fuerza que les tendió una emboscada; el caballo cargó, dos de ellos murieron y muchos animales cargados fueron capturados, y en una de las cargas encontraron a una muchacha a la que Al-Hadi envió de vuelta a su gente con una esclava de Wadi'i y un hombre Harithi."
  fr: "Al-Hadi apprit qu'un groupe de Banu al-Harith venait d'al-Jawf et envoya une troupe en embuscade; le cheval chargea, deux d'entre eux furent tués et de nombreux animaux chargés furent pris, et une fille fut trouvée sur une charge qu'al-Hadi renvoya à son peuple avec une esclave Wadi'i et un homme Harithi."
  tr: "El-Hadi'ye, Beni El-Harith'ten bir grubun El-Jawf'tan geldiği bildirildi ve o da onları karşılamak için bir ordu gönderdi. Atlara saldırıldı, iki adam öldürüldü ve birçok hayvan ele geçirildi. Yüklerden birinde genç bir kız vardı, bu yüzden El-Hadi onu, bir cariye ve El-Harith'ten bir adamla birlikte kabilesine geri gönderdi."
  id: "Al-Hadi mendapat kabar bahwa sekelompok orang dari Bani Al-Harith datang dari Al-Jawf, maka ia mengirimkan pasukan untuk menemui mereka. Kuda-kuda diserang, dua orang tewas, dan banyak hewan dirampas. Ada seorang gadis muda di salah satu muatan, maka Al-Hadi mengembalikannya kepada kaumnya bersama seorang budak perempuan dan seorang laki-laki dari Al-Harith."
