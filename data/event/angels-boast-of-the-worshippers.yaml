id: event/angels-boast-of-the-worshippers
kind: other
label:
  ar: يباهي بكم الملائكة
  en: The angels boast of you
  ur: ملائکہ تم پر فخر کرتے ہیں
summary:
  ar: 'قال الله في الحديث القدسي: أبشروا هذا ربكم قد فتح باباً من أبواب السماء يباهي بكم الملائكة يقول انظروا إلى عبادي قد قضوا فريضة وهم ينتظرون أخرى {cite:sunan-ibn-majah} [[passage/ibnmajah-0801|ابن ماجه 801]].'
  en: 'God said in the hadith qudsi: receive glad tidings — your Lord has opened a door of heaven and boasts of you to the angels, saying: look at My servants who have performed an obligation and are awaiting another {cite:sunan-ibn-majah} [[passage/ibnmajah-0801|Ibn Majah 801]].'
  ur: 'اللہ نے حدیث قدسی میں کہا: بشارت لو — تمہارا رب آسمان کا ایک دروازہ کھول کر ملائکہ پر تم پر فخر کرتا ہے، کہتا ہے: میرے بندوں کو دیکھو انہوں نے ایک فرض ادا کیا اور دوسرے کا انتظار ہے {cite:sunan-ibn-majah} [[passage/ibnmajah-0801|ابن ماجہ 801]]۔'
