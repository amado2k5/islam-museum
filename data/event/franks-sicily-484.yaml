summary:
  ar: "في سنة أربع وثمانين استولت الفرنج على جميع جزيرة صقلية وأول ما فتحها المسلمون بعد المئتين وحكم عليها آل الأغلب دهراً إلى أن استولى العبيدي المهدي على المغرب {cite:tarikh-khulafa-minhaj-1434 p. 653}."
  en: "In 484 the Franks seized the whole island of Sicily — first conquered by the Muslims after the second century, ruled by the Aghlabids a long while till the Ubaydid Mahdi took the Maghreb {cite:tarikh-khulafa-minhaj-1434 p. 653}."
  es: "En 484, los francos se apoderaron de toda la isla de Sicilia, conquistada por primera vez por los musulmanes después del siglo II y gobernada por los aglabíes durante mucho tiempo hasta que el Mahdi Ubaydid tomó el Magreb {cite:tarikh-khulafa-minhaj-1434 p. 653}."
  fr: "En 484, les Francs s'emparèrent de toute l'île de Sicile — d'abord conquise par les musulmans après le IIe siècle, gouvernée par les Aghlabides pendant longtemps jusqu'à ce que le Mahdi Ubaydide prenne le Maghreb {cite:tarikh-khulafa-minhaj-1434 p. 653}."
  ur: "484 میں فرینکوں نے سسلی کے پورے جزیرے پر قبضہ کر لیا - پہلی بار دوسری صدی کے بعد مسلمانوں نے فتح کیا، عبید مہدی نے مغرب پر قبضہ کرنے تک طویل عرصے تک اغلبوں کی حکومت کی۔ 653}۔"
