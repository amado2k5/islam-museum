id: event/ibn-al-tiqtaqa-father-fall
class: event
kind: other
label:
  ar: "سقوط والد ابن الطقطقي في الصراع مع الأخوين الجويني"
  en: "The fall of Ibn al-Tiqtaqa's father in the struggle with the Juwayni brothers"
  ur: "جوینی بھائیوں سے سیاست میں ابن طقطقی کے والد کی ہلاکت"
summary:
  ar: "كان والد ابن الطقطقي، تاج الدين علي بن محمد بن رمضان، نقيباً كبيراً للعلويين وقد نال مالاً واسعاً ونفوذاً، لكنه خسر حياته وماله في لعبة سياسية دبّرها الأخوان علاء الدين وشمس الدين الجويني؛ ويروي ابن عُنبة في «عمدة الطالب» خبر ذلك {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}."
  en: "Ibn al-Tiqtaqa's father, Taj al-Din Ali ibn Muhammad ibn Ramadan, chief naqib of the Alids, had gained great wealth and influence, but in a game of political intrigue against the brothers Ala' al-Din and Shams al-Din al-Juwayni he lost his life and property; Ibn Inaba's 'Umdat al-Talib tells the story {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}."
  ur: "ابن طقطقی کے والد تاج الدین علی بن محمد بن رمضان علویوں کے سرکردہ نقیب تھے جنہیں بڑی دولت اور اثر و رسوخ حاصل ہوا، لیکن علاء الدین اور شمس الدین جوینی بھائیوں کی سیاسی چال میں انہوں نے اپنی جان اور مال کھو دیا؛ ابن عنبہ کی «عمدۃ الطالب» یہ قصہ بیان کرتی ہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}۔"
