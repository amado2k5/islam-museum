label: { ar: "ولاية تميم بن زيد السند والانسحاب من الهند", en: "Tamim ibn Zayd and the Withdrawal from Hind", es: "Tamim ibn Zayd y la retirada de Hind", fr: "Tamim ibn Zayd et le retrait de Hind", ur: "تمیم ابن زید اور ہند سے دستبرداری", tr: "Tamim bin Zaid al-Sind'in yönetimi ve Hindistan'dan çekilme", id: "Pemerintahan Tamim bin Zaid al-Sind dan penarikan diri dari India" }
summary:
  ar: "ولي بعد الجنيد تميم بن زيد الأتبي فضعف ووهن ومات قريباً من الديبل بماء يقال له الجواميس وإنما سمي ماء الجواميس لأنه يهرب إليه من ذباب زرق تكون بشاطئ مهران وكان تميم من أسخياء العرب وجد في بيت المال بالسند ثمانية عشر ألف ألف درهم طاطرية فأسرع فيها وكان قد شخص معه في الجند فتى من بني يربوع يقال له خنيس وأمه من طيء إلى الهند فأتى الفرزدق فسأله أن يكتب إلى تميم في إقفاله وعاذت بقبر غالب أبيه فكتب الفرزدق إلى تميم أتنى فعادت يا تميم بغالب وبالحفرة السافي عليها ترابها نهد لي ختيساً واتخذ فيه منة لحوبة أم ما يسوع شرابها فلم يدر ما اسم الفتى أهو حبيش أم خنيس فأمر أن يقفل كل من كان اسمه على مثل هذه الحروف وفي أيام تميم خرج المسلمون عن بلاد الهند ورفضوا مراكزهم فلم يعودوا إليها إلى هذه الغاية."
  en: "Tamim ibn Zayd al-Utbi — feeble successor — died near Daybul at the Buffalo-Water, named for herds fleeing the shore's blue flies. Of the Arabs' most open-handed, he spent eighteen million Tatari dirhams found in Sind's bayt al-mal. A Yarbu'i lad Khanis reached Hind, begged al-Farazdaq a letter for his manumission, swearing by Ghalib's grave; Farazdaq's verses asked 'Khaytis freed as my bounty' — and Tamim, unsure if the name was Habish or Khanis, freed every slave so lettered. In his days the Muslims quit the lands of Hind and abandoned their stations, not returning to this day."
  es: "Tamim ibn Zayd al-Utbi —débil sucesor— murió cerca de Daybul, en el Agua de los Búfalos, llamada así por los rebaños que huían de las moscas azules de la orilla. Siendo uno de los árabes más generosos, gastó dieciocho millones de dirhams tártaros encontrados en el bayt al-mal de Sind. Un joven yarbu'i llamado Khanis llegó a Hind, le rogó a al-Farazdaq una carta para su manumisión, jurando por la tumba de Ghalib; los versos de Farazdaq pedían «Khaytis liberados como mi recompensa», y Tamim, sin estar seguro de si el nombre era Habish o Khanis, liberó a todos los esclavos que así lo indicaban. En su época, los musulmanes abandonaron las tierras de Hind y sus puestos, sin regresar hasta el día de hoy."
  fr: "Tamim ibn Zayd al-Utbi, son successeur peu glorieux, mourut près de Daybul, au bord de l'eau aux buffles, ainsi nommée en raison des troupeaux fuyant les mouches bleues qui s'y pressaient. Figure parmi les Arabes les plus généreux: il dépensa dix-huit millions de dirhams tatars trouvés dans le bayt al-mal du Sind. Un jeune Yarbu'i, Khanis, parvint en Hind et implora al-Farazdaq de lui accorder une lettre d'affranchissement, jurant sur la tombe de Ghalib. Les versets de Farazdaq demandaient: « Khaytis affranchis en guise de grâce ». Tamim, ignorant si le nom était Habish ou Khanis, affranchit tous les esclaves ainsi nommés. De son temps, les musulmans quittèrent les terres de Hind et abandonnèrent leurs postes, pour ne plus y revenir depuis."
  ur: "تمیم ابن زید العتبی - کمزور جانشین - دیبل کے قریب بفیلو واٹر پر مر گیا، جسے ساحل کی نیلی مکھیوں سے بھاگنے والے ریوڑ کے لیے نامزد کیا گیا تھا۔ عربوں کے سب سے زیادہ کھلے ہاتھ میں، اس نے سندھ کے بیت المال میں پائے جانے والے اٹھارہ ملین تاتاری درہم خرچ کیے۔ ایک یربوعی لڑکا خانی ہند پہنچا، اس نے الفرازدق سے غالب کی قبر کی قسم کھا کر اپنی رہائی کے لیے ایک خط مانگا۔ فرازدق کی آیات نے پوچھا کہ 'خیطیوں کو میرے فضل کے طور پر آزاد کیا گیا ہے' - اور تمیم کو یقین نہیں تھا کہ اس کا نام حبیش ہے یا خانیس، ہر اس غلام کو آزاد کر دیتا ہے جسے اس طرح لکھا جاتا ہے۔ ان کے دور میں مسلمانوں نے ہند کی سرزمین چھوڑ دی اور اپنے ٹھکانے چھوڑ دیے، آج تک واپس نہیں آئے۔"
  tr: "Cüneyd'den sonra yerine Tamim ibn Zeyd el-Atbi geçti, ancak zayıf ve güçsüz düştü ve El-Daybal yakınlarındaki Cevamis adlı bir su kenarında öldü. Bu suya Cevamis suyu denmesinin sebebi, insanların Mehran kıyısındaki mavi sineklerden kaçarak oraya sığınmalarıydı. Tamim, Arapların en cömertlerinden biriydi. Sindh'deki hazinede on sekiz milyon Tatar dirhemi buldu ve bunları hemen harcadı. Tayy'den olan annesiyle birlikte orduda Hindistan'a giden Beni Yarbu'dan Hunais adında genç bir adam, El-Farazdak'a gelip Tamim'e hapsedilmesi hakkında yazmasını istedi. Hunais, babası Ghalib'in mezarına sığınmıştı. Bunun üzerine El-Farazdak, Tamim'e şöyle yazdı: \"Bana gel ve ey Tamim, Ghalib'i ve üzerinde tozu olan mezarı getir. Hunais'i de getir ve onunla İsa'nın annesi için bir iyilik yap, onun içeceği bilinmiyor.\" Genç adamın adının Habish mi yoksa Khunais mi olduğunu bilmiyordu. Bu yüzden, bu tür mektuplarda adı geçen herkesin hapse atılmasını emretti. Tamim döneminde Müslümanlar Hindistan topraklarını terk edip merkezlerini bıraktılar ve o zamana kadar da geri dönmediler."
  id: "Setelah Al-Junayd, Tamim ibn Zayd Al-Atbi menggantikannya, tetapi ia menjadi lemah dan rapuh dan meninggal di dekat Al-Daybal di sebuah mata air bernama Al-Jawamis. Mata air itu disebut mata air Al-Jawamis karena orang-orang berlindung di sana dari lalat biru yang berada di tepi sungai Mehran. Tamim adalah salah satu orang Arab yang paling dermawan. Ia menemukan delapan belas juta dirham Tatar di perbendaharaan di Sindh, sehingga ia segera menghabiskannya. Seorang pemuda dari Banu Yarbu’ bernama Khunais, yang ibunya berasal dari Tayy, telah berangkat bersamanya dalam pasukan ke India. Ia datang kepada Al-Farazdaq dan memintanya untuk menulis surat kepada Tamim tentang penahanannya. Ia mencari perlindungan di makam ayahnya, Ghalib. Maka Al-Farazdaq menulis kepada Tamim: “Datanglah kepadaku, dan kembalilah, wahai Tamim, dengan Ghalib dan makam yang debunya ada di atasnya. Bawalah Khunais kepadaku dan berikanlah di dalamnya suatu kemurahan hati untuk ibu Yesus, yang minumannya tidak diketahui.” Ia tidak tahu nama pemuda itu, apakah Habish atau Khunais. Maka ia memerintahkan agar setiap orang yang namanya tertera pada surat-surat tersebut dipenjara. Pada masa pemerintahan Tamim, kaum Muslim meninggalkan tanah India dan meninggalkan pusat-pusat mereka, dan tidak kembali ke sana hingga saat ini."
