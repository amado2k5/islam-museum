label: { ar: "ولاية تميم بن زيد السند والانسحاب من الهند", en: "Tamim ibn Zayd and the Withdrawal from Hind", es: "Tamim ibn Zayd y la retirada de Hind", fr: "Tamim ibn Zayd et le retrait de Hind" }
summary:
  ar: "ولي بعد الجنيد تميم بن زيد الأتبي فضعف ووهن ومات قريباً من الديبل بماء يقال له الجواميس وإنما سمي ماء الجواميس لأنه يهرب إليه من ذباب زرق تكون بشاطئ مهران وكان تميم من أسخياء العرب وجد في بيت المال بالسند ثمانية عشر ألف ألف درهم طاطرية فأسرع فيها وكان قد شخص معه في الجند فتى من بني يربوع يقال له خنيس وأمه من طيء إلى الهند فأتى الفرزدق فسأله أن يكتب إلى تميم في إقفاله وعاذت بقبر غالب أبيه فكتب الفرزدق إلى تميم أتنى فعادت يا تميم بغالب وبالحفرة السافي عليها ترابها نهد لي ختيساً واتخذ فيه منة لحوبة أم ما يسوع شرابها فلم يدر ما اسم الفتى أهو حبيش أم خنيس فأمر أن يقفل كل من كان اسمه على مثل هذه الحروف وفي أيام تميم خرج المسلمون عن بلاد الهند ورفضوا مراكزهم فلم يعودوا إليها إلى هذه الغاية."
  en: "Tamim ibn Zayd al-Utbi — feeble successor — died near Daybul at the Buffalo-Water, named for herds fleeing the shore's blue flies. Of the Arabs' most open-handed, he spent eighteen million Tatari dirhams found in Sind's bayt al-mal. A Yarbu'i lad Khanis reached Hind, begged al-Farazdaq a letter for his manumission, swearing by Ghalib's grave; Farazdaq's verses asked 'Khaytis freed as my bounty' — and Tamim, unsure if the name was Habish or Khanis, freed every slave so lettered. In his days the Muslims quit the lands of Hind and abandoned their stations, not returning to this day."
  es: "Tamim ibn Zayd al-Utbi —débil sucesor— murió cerca de Daybul, en el Agua de los Búfalos, llamada así por los rebaños que huían de las moscas azules de la orilla. Siendo uno de los árabes más generosos, gastó dieciocho millones de dirhams tártaros encontrados en el bayt al-mal de Sind. Un joven yarbu'i llamado Khanis llegó a Hind, le rogó a al-Farazdaq una carta para su manumisión, jurando por la tumba de Ghalib; los versos de Farazdaq pedían «Khaytis liberados como mi recompensa», y Tamim, sin estar seguro de si el nombre era Habish o Khanis, liberó a todos los esclavos que así lo indicaban. En su época, los musulmanes abandonaron las tierras de Hind y sus puestos, sin regresar hasta el día de hoy."
  fr: "Tamim ibn Zayd al-Utbi, son successeur peu glorieux, mourut près de Daybul, au bord de l'eau aux buffles, ainsi nommée en raison des troupeaux fuyant les mouches bleues qui s'y pressaient. Figure parmi les Arabes les plus généreux: il dépensa dix-huit millions de dirhams tatars trouvés dans le bayt al-mal du Sind. Un jeune Yarbu'i, Khanis, parvint en Hind et implora al-Farazdaq de lui accorder une lettre d'affranchissement, jurant sur la tombe de Ghalib. Les versets de Farazdaq demandaient: « Khaytis affranchis en guise de grâce ». Tamim, ignorant si le nom était Habish ou Khanis, affranchit tous les esclaves ainsi nommés. De son temps, les musulmans quittèrent les terres de Hind et abandonnèrent leurs postes, pour ne plus y revenir depuis."
