label: { ar: "ولاية الجنيد بن عبد الرحمن خراسان وحربه الترك", en: "al-Junayd's Khurasan and the Turkish War", es: "El Jorasán de al-Junayd y la guerra turca", fr: "Le Khorasan d'al-Junayd et la guerre turque", ur: "الجنید کا خراسان اور ترک جنگ", tr: "Cüneyd ibn Abdülrahman Horasan'ın valiliği ve Türklere karşı savaşı", id: "Masa pemerintahan Junayd ibn Abd al-Rahman Khorasan dan perangnya melawan bangsa Turki." }
summary:
  ar: "استعمل هشام في سنة ١١٢ الجنيد بن عبد الرحمن المري على خراسان فلقي الترك فحاربهم ووجه طلائع له فظفروا بابن خاقان وهو سكران يتصيد فأخذوه فأتوا به الجنيد فبعث به إلى هشام ولم يزل يقاتل الترك حتى دفعهم فكتب إلى هشام يستمده فأمده بعمرو بن مسلم في عشرة آلاف رجل من أهل البصرة وبعبد الرحمن بن نعيم في عشرة آلاف من أهل الكوفة وحمل إليه ثلاثين ألف قناة وثلاثين ألف ترس وأطلق يده في الفريضة ففرض لخمسة عشر ألف رجل وكانت للجنيد مغاز وانتشرت دعاة بني هاشم في ولايته وقوي أمرهم وكانت وفاة الجنيد بمرو وولى هشام خراسان عاصم بن عبد الله بن يزيد الهلالي وقال أبو عبيدة التأمت نواح من طخارستان نقضها الجنيد بن عبد الرحمن وردها إلى صلحها ومقاطعتها."
  en: "In 112h Hisham gave Khurasan to al-Junayd ibn Abd al-Rahman al-Murri; his vanguard caught the Khaqan's son drunk hunting — sent to Hisham — and he fought on till the Turks were driven off. Reinforced by Amr ibn Muslim with ten thousand Basrans, Abd al-Rahman ibn Nu'aym with ten thousand Kufans, thirty thousand spears, thirty thousand shields, and an open stipend for fifteen thousand men, his raids prospered — while the Hashimi da'is spread and grew strong in his rule. He died at Marw; Hisham then gave Khurasan to Asim ibn Abdallah al-Hilali. Abu Ubayda notes the Tukharistan districts al-Junayd had breached were returned to their sulh."
  es: "En el año 112 de la Hégira, Hisham entregó Jorasán a al-Junayd ibn Abd al-Rahman al-Murri. Su vanguardia sorprendió al hijo del Khaqan, que estaba cazando borracho —y fue enviado a Hisham—, y luchó hasta que los turcos fueron expulsados. Reforzado por Amr ibn Muslim con diez mil basranos, Abd al-Rahman ibn Nu'aym con diez mil kufanos, treinta mil lanzas, treinta mil escudos y una dotación para quince mil hombres, sus incursiones prosperaron, mientras que los da'is hashimíes se extendieron y se fortalecieron bajo su dominio. Murió en Marw; Hisham entonces entregó Jorasán a Asim ibn Abdallah al-Hilali. Abu Ubayda señala que los distritos de Tukharistán que al-Junayd había conquistado fueron devueltos a su sulh."
  fr: "En 112 de l'Hégire, Hisham confia le Khorasan à al-Junayd ibn Abd al-Rahman al-Murri. Son avant-garde surprit le fils du Khaqan, ivre à la chasse, et l'envoya à Hisham. Al-Junayd poursuivit le combat jusqu'à la déroute des Turcs. Renforcé par Amr ibn Muslim avec dix mille Basrans, Abd al-Rahman ibn Nu'aym avec dix mille Kufans, trente mille lances, trente mille boucliers et une provision pour quinze mille hommes, ses raids prospérèrent. Sous son règne, les da'is hasimi se répandirent et gagnèrent en puissance. Al-Junayd mourut à Marw. Hisham confia alors le Khorasan à Asim ibn Abdallah al-Hilali. Abu Ubayda rapporte que les districts du Tukharistan conquis par al-Junayd furent restitués à leurs seigneurs."
  ur: "112ھ میں ہشام نے خراسان جنید بن عبدالرحمٰن المری کو دے دیا۔ اس کے سرغنہ نے خاقان کے بیٹے کو نشے میں شکار کرتے ہوئے پکڑا — جسے ہشام کے پاس بھیجا گیا — اور وہ اس وقت تک لڑتا رہا جب تک ترکوں کو بھگا نہیں دیا گیا۔ عمرو بن مسلم کو دس ہزار بصریوں کے ساتھ تقویت ملی، عبدالرحمٰن بن نعیم کو دس ہزار کوفان، تیس ہزار نیزے، تیس ہزار ڈھالیں اور پندرہ ہزار آدمیوں کے لیے کھلے وظیفے کے ساتھ، اس کے چھاپے کامیاب ہوئے - جب کہ ہاشمی داعی پھیلتے گئے اور اس کی حکومت میں مضبوط ہوتی گئی۔ مروہ میں وفات پائی۔ پھر ہشام نے خراسان کو عاصم بن عبداللہ ہلالی کو دے دیا۔ ابو عبیدہ نوٹ کرتے ہیں کہ جنید نے تخارستان کے جن اضلاع کی خلاف ورزی کی تھی ان کو ان کی سلہ میں واپس کر دیا گیا تھا۔"
  tr: "112 yılında Hişam, Al-Cüneyd ibn Abdülrahman el-Murri'yi Horasan valisi olarak atadı. Türklerle karşılaştı ve onlarla savaştı; avlanırken sarhoş halde olan İbn Hakan'ı yakalayan keşifçiler gönderdi. Onu alıp Al-Cüneyd'e getirdiler, o da onu Hişam'a gönderdi. Türklerle savaşmaya devam etti ve onları geri püskürttü. Hişam'a takviye kuvvet istedi, bunun üzerine Hişam ona Basra'dan on bin adamla Amr ibn Müslim'i ve Kufa'dan on bin adamla Abdülrahman ibn Nu'aym'ı gönderdi. Ayrıca ona otuz bin mızrak ve otuz bin kalkan gönderdi ve zekât konusunda ona serbestlik verdi, böylece on beş bin adam için zekât dağıttı. Al-Cüneyd seferler düzenledi ve valiliği sırasında Beni Haşim vaizleri yayıldı ve güçleri arttı. Al-Cüneyd Merv'de öldü ve Hişam, Horasan valisi olarak Asim ibn Abdülallah ibn Yazid el-Hilali'yi atadı. Ebu Ubeyda, Toharistan'ın bazı bölgelerinin birleştiğini, ancak Cüneyd ibn Abdülrahman'ın bu anlaşmayı bozarak onları yeniden barış ve boykot dönemine soktuğunu söyledi."
  id: "Pada tahun 112, Hisham menunjuk Al-Junayd ibn Abd al-Rahman al-Murri sebagai gubernur Khorasan. Ia bertemu dengan bangsa Turki dan memerangi mereka, mengirimkan pengintai yang menangkap Ibn Khaqan saat ia mabuk dan berburu. Mereka membawanya kepada Al-Junayd, yang kemudian mengirimnya kepada Hisham. Ia terus memerangi bangsa Turki hingga berhasil mengusir mereka. Ia menulis surat kepada Hisham meminta bala bantuan, sehingga Hisham mengirimkan Amr ibn Muslim dengan sepuluh ribu orang dari Basra dan Abd al-Rahman ibn Nu’aym dengan sepuluh ribu orang dari Kufa. Ia juga mengirimkan tiga puluh ribu tombak dan tiga puluh ribu perisai serta memberinya kebebasan dalam zakat, sehingga ia mengalokasikan zakat untuk lima belas ribu orang. Al-Junayd melakukan berbagai kampanye, dan para pengkhotbah Banu Hasyim menyebar selama masa pemerintahannya, dan kekuatan mereka pun bertambah. Al-Junayd meninggal di Merv, dan Hisham menunjuk Asim ibn Abd Allah ibn Yazid al-Hilali sebagai gubernur Khorasan. Abu Ubayda mengatakan bahwa beberapa wilayah Tokharistan bersatu, tetapi Al-Junayd ibn Abd al-Rahman melanggar perjanjian mereka dan mengembalikan mereka ke perdamaian dan boikot."
