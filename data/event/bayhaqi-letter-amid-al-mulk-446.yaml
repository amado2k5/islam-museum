label:
  ar: "رسالة البيهقي إلى عميد الملك الكندري، نحو ٤٤٦هـ"
  en: "Al-Bayhaqi's letter to the vizier Amid al-Mulk al-Kunduri, c. 446/1054"
  ur: "بيهقی کا وزیر عمید الملک کندری کے نام خط، تقریباً 446ھ/1054ء"
summary:
  ar: "كان البيهقي بمدينة بيهق فلما وصله خبر الفتنة شقّ عليه، وكان محدث زمانه وشيخ السنة في وقته، فكتب إلى عميد الملك رسالة يذبّ فيها عن الشيخ أبي الحسن الأشعري، ويذكر نسبه وترجمته، ويسأله إطفاء الثائرة وترك اللعن وتأديب من يفعله؛ ساقها ابن عساكر بمجموعها {cite:tabaqat-shafiiyya-subki pp. 272-276}."
  en: "Al-Bayhaqi was in the city of Bayhaq when news of the ordeal reached him; it grieved him, and as the traditionist of his age and the shaykh of the Sunna of his time he wrote to Amid al-Mulk a long letter defending al-Ash'ari — recounting his lineage and merits — and asking him to quench the fire, abandon the cursing and discipline its perpetrators; Ibn Asakir transmitted the letter in full {cite:tabaqat-shafiiyya-subki pp. 272-276}."
  ur: "بيهقی شہرِ بيهق میں تھے جب فتنے کی خبر پہنچی؛ ان پر بہت گراں گذری، اور چونکہ وہ اپنے زمانے کے محدث اور شیخِ سنت تھے، انھوں نے عمید الملک کے نام ایک طویل خط لکھا جس میں شیخ ابو الحسن اشعری کا دفاع کیا، ان کے نسب اور مناقب بیان کیے، اور آگ بجھانے، لعن چھوڑنے اور فتنہ پھیلانے والوں کی تنبیہ کی درخواست کی؛ ابن عساکر نے پورا خط نقل کیا ہے {cite:tabaqat-shafiiyya-subki pp. 272-276}۔"
