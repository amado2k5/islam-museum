label:
  ar: "رسالة البيهقي إلى عميد الملك الكندري، نحو ٤٤٦هـ"
  en: "Al-Bayhaqi's letter to the vizier Amid al-Mulk al-Kunduri, c. 446/1054"
  ur: "بيهقی کا وزیر عمید الملک کندری کے نام خط، تقریباً 446ھ/1054ء"
  fr: "La lettre d'al-Bayhaqi au vizir Amid al-Mulk al-Kunduri, vers 446/1054"
  es: "Carta de Al-Bayhaqi al visir Amid al-Mulk al-Kunduri, c. 446/1054"
  tr: "El-Beyhakî'nin Kralın Baş Rahibi el-Kandari'ye yazdığı mektup, yaklaşık 446 Hicri."
  id: "Surat Al-Bayhaqi kepada Dekan Raja al-Kandari, sekitar tahun 446 Hijriah"
summary:
  ar: "كان البيهقي بمدينة بيهق فلما وصله خبر الفتنة شقّ عليه، وكان محدث زمانه وشيخ السنة في وقته، فكتب إلى عميد الملك رسالة يذبّ فيها عن الشيخ أبي الحسن الأشعري، ويذكر نسبه وترجمته، ويسأله إطفاء الثائرة وترك اللعن وتأديب من يفعله؛ ساقها ابن عساكر بمجموعها {cite:tabaqat-shafiiyya-subki pp. 272-276}."
  en: "Al-Bayhaqi was in the city of Bayhaq when news of the ordeal reached him; it grieved him, and as the traditionist of his age and the shaykh of the Sunna of his time he wrote to Amid al-Mulk a long letter defending al-Ash'ari — recounting his lineage and merits — and asking him to quench the fire, abandon the cursing and discipline its perpetrators; Ibn Asakir transmitted the letter in full {cite:tabaqat-shafiiyya-subki pp. 272-276}."
  ur: "بيهقی شہرِ بيهق میں تھے جب فتنے کی خبر پہنچی؛ ان پر بہت گراں گذری، اور چونکہ وہ اپنے زمانے کے محدث اور شیخِ سنت تھے، انھوں نے عمید الملک کے نام ایک طویل خط لکھا جس میں شیخ ابو الحسن اشعری کا دفاع کیا، ان کے نسب اور مناقب بیان کیے، اور آگ بجھانے، لعن چھوڑنے اور فتنہ پھیلانے والوں کی تنبیہ کی درخواست کی؛ ابن عساکر نے پورا خط نقل کیا ہے {cite:tabaqat-shafiiyya-subki pp. 272-276}۔"
  fr: "Al-Bayhaqi se trouvait dans la ville de Bayhaq quand la nouvelle de l'épreuve lui parvint ; elle l'affligea, et en tant que traditionniste de son époque et cheikh de la Sunna de son temps, il écrivit à Amid al-Mulk une longue lettre défendant al-Ash'ari, retraçant sa lignée et ses mérites, et lui demandant d'éteindre le feu, de renoncer aux malédictions et de sanctionner leurs auteurs ; Ibn Asakir transmit la lettre en entier {cite:tabaqat-shafiiyya-subki pp. 272-276}."
  es: "Al-Bayhaqi se encontraba en la ciudad de Bayhaq cuando le llegaron las noticias de la terrible experiencia; esto lo afligió, y como tradicionalista de su época y shaykh de la Sunna de su tiempo, escribió a Amid al-Mulk una larga carta defendiendo a al-Ash'ari —relatando su linaje y méritos— y pidiéndole que apagara el fuego, abandonara las maldiciones y disciplinara a sus perpetradores; Ibn Asakir transmitió la carta completa {cite:tabaqat-shafiiyya-subki pp. 272-276}."
  tr: "El-Bayhaki, çatışma haberi kendisine ulaştığında Beyhak şehrindeydi ve çok üzüldü. Zamanının hadis alimi ve Sünnet şeyhiydi, bu yüzden kralın başkomutanına bir mektup yazarak Şeyh Ebu el-Hasan el-Eş'ari'yi savundu, soyunu ve biyografisini anlattı ve isyanı söndürmesini, küfür etmeyi bırakmasını ve küfür edenleri cezalandırmasını istedi. İbn Asakir bunu bütünüyle aktarmıştır {kaynak: tabaqat-shafiiyya-subki s. 272-276}."
  id: "Al-Bayhaqi berada di kota Bayhaq ketika berita tentang perselisihan itu sampai kepadanya, dan dia merasa sedih. Dia adalah ulama hadits terkemuka pada zamannya dan syekh Sunnah pada masanya, sehingga dia menulis surat kepada kepala kerajaan yang isinya membela Syekh Abu al-Hasan al-Ash'ari, menyebutkan silsilah dan biografinya, dan memintanya untuk memadamkan pemberontakan, menghentikan kutukan, dan mendisiplinkan mereka yang melakukannya. Ibn Asakir memasukkannya secara lengkap {cite:tabaqat-shafiiyya-subki pp. 272-276}."
