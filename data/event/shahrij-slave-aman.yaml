label: { ar: "أمان العبد بشهريج", en: "The Slave's Aman at Shahrij" }
summary:
  ar: "حاصر المسلمون شهرياج شهراً جراراً وظنوا أنهم سيفتحونها في يومهم فقاتلوا أهلها ذات يوم ورجعوا إلى معسكرهم وتخلف عبد مملوك فأظهروا ظناً وكتب لهم أماناً ورمى به إليهم في سهم فلما راحوا للقتال خرج أهل الحصن فقالوا هذا أمانكم فكتبوا بذلك إلى عمر فكتب إليهم إن عبد المسلمين من المسلمين ذمته كذمتهم فلينفذ أمانه فأنفذوه وفي رواية أن الحصن كان بسيراف وقال المسلمون ليس أمانه بشيء فقال القوم لسنا نعرف الحر من العبد فكتب إلى عمر فكتب إن عبد المسلمين منا ذمته كذمتهم."
  en: "Shahrij held a full month's siege; one day a Muslim slave lagged behind — taken for a defector — and wrote the garrison an aman on an arrow he shot in. Next day they came out: 'here is your aman'; the Muslims wrote Umar, who answered 'the Muslims' slave is of the Muslims — his dhimma is as theirs: honor it', and they did. In another telling the fort was at Siraf, the garrison saying 'we know not freeman from slave', and Umar's answer the same."
