id: event/shahrij-slave-aman
class: event
kind: treaty
label: { ar: "أمان العبد بشهريج", en: "The Slave's Aman at Shahrij", es: "El Aman del esclavo en Shahrij", fr: "L'Aman de l'esclave à Shahrij" }
summary:
  ar: "حاصر المسلمون شهرياج شهراً جراراً وظنوا أنهم سيفتحونها في يومهم فقاتلوا أهلها ذات يوم ورجعوا إلى معسكرهم وتخلف عبد مملوك فأظهروا ظناً وكتب لهم أماناً ورمى به إليهم في سهم فلما راحوا للقتال خرج أهل الحصن فقالوا هذا أمانكم فكتبوا بذلك إلى عمر فكتب إليهم إن عبد المسلمين من المسلمين ذمته كذمتهم فلينفذ أمانه فأنفذوه وفي رواية أن الحصن كان بسيراف وقال المسلمون ليس أمانه بشيء فقال القوم لسنا نعرف الحر من العبد فكتب إلى عمر فكتب إن عبد المسلمين منا ذمته كذمتهم."
  en: "Shahrij held a full month's siege; one day a Muslim slave lagged behind — taken for a defector — and wrote the garrison an aman on an arrow he shot in. Next day they came out: 'here is your aman'; the Muslims wrote Umar, who answered 'the Muslims' slave is of the Muslims — his dhimma is as theirs: honor it', and they did. In another telling the fort was at Siraf, the garrison saying 'we know not freeman from slave', and Umar's answer the same."
  es: "Shahrij mantuvo un asedio de un mes entero; un día, un esclavo musulmán que se rezagó —confundiéndolo con un desertor— escribió un aman en una flecha que había disparado a la guarnición. Al día siguiente, salieron y dijeron: «Aquí está tu aman». Los musulmanes escribieron a Umar, quien respondió: «El esclavo de los musulmanes es musulmán; su dhimma es como la de ellos: respétala», y así lo hicieron. En otro relato, la fortaleza estaba en Siraf, la guarnición dijo: «No distinguimos entre hombre libre y esclavo», y la respuesta de Umar fue la misma."
  fr: "Le siège de Shahrij dura un mois entier. Un jour, un esclave musulman, pris pour un déserteur, s'attarda sur le fort et inscrivit un aman à la garnison sur une flèche qu'il avait tirée. Le lendemain, les musulmans sortirent et dirent: « Voici votre aman ! » Ils écrivirent à Umar, qui répondit: « L'esclave des musulmans est musulman, sa dhimma est la même que la leur: respectez-la. » Et ils le firent. Selon une autre version, le fort se trouvait à Siraf, la garnison déclarant: « Nous ne faisons pas la différence entre un homme libre et un esclave », et la réponse d'Umar étant la même."
