label: { ar: "أمان العبد بشهريج", en: "The Slave's Aman at Shahrij", es: "El Aman del esclavo en Shahrij", fr: "L'Aman de l'esclave à Shahrij", ur: "شہریج میں غلام کی امان", tr: "Aman Al-Abd Bisharij", id: "Aman Al-Abd Bisharij" }
summary:
  ar: "حاصر المسلمون شهرياج شهراً جراراً وظنوا أنهم سيفتحونها في يومهم فقاتلوا أهلها ذات يوم ورجعوا إلى معسكرهم وتخلف عبد مملوك فأظهروا ظناً وكتب لهم أماناً ورمى به إليهم في سهم فلما راحوا للقتال خرج أهل الحصن فقالوا هذا أمانكم فكتبوا بذلك إلى عمر فكتب إليهم إن عبد المسلمين من المسلمين ذمته كذمتهم فلينفذ أمانه فأنفذوه وفي رواية أن الحصن كان بسيراف وقال المسلمون ليس أمانه بشيء فقال القوم لسنا نعرف الحر من العبد فكتب إلى عمر فكتب إن عبد المسلمين منا ذمته كذمتهم."
  en: "Shahrij held a full month's siege; one day a Muslim slave lagged behind — taken for a defector — and wrote the garrison an aman on an arrow he shot in. Next day they came out: 'here is your aman'; the Muslims wrote Umar, who answered 'the Muslims' slave is of the Muslims — his dhimma is as theirs: honor it', and they did. In another telling the fort was at Siraf, the garrison saying 'we know not freeman from slave', and Umar's answer the same."
  es: "Shahrij mantuvo un asedio de un mes entero; un día, un esclavo musulmán que se rezagó —confundiéndolo con un desertor— escribió un aman en una flecha que había disparado a la guarnición. Al día siguiente, salieron y dijeron: «Aquí está tu aman». Los musulmanes escribieron a Umar, quien respondió: «El esclavo de los musulmanes es musulmán; su dhimma es como la de ellos: respétala», y así lo hicieron. En otro relato, la fortaleza estaba en Siraf, la guarnición dijo: «No distinguimos entre hombre libre y esclavo», y la respuesta de Umar fue la misma."
  fr: "Le siège de Shahrij dura un mois entier. Un jour, un esclave musulman, pris pour un déserteur, s'attarda sur le fort et inscrivit un aman à la garnison sur une flèche qu'il avait tirée. Le lendemain, les musulmans sortirent et dirent: « Voici votre aman ! » Ils écrivirent à Umar, qui répondit: « L'esclave des musulmans est musulman, sa dhimma est la même que la leur: respectez-la. » Et ils le firent. Selon une autre version, le fort se trouvait à Siraf, la garnison déclarant: « Nous ne faisons pas la différence entre un homme libre et un esclave », et la réponse d'Umar étant la même."
  ur: "شہریج نے پورے مہینے کا محاصرہ کیا۔ ایک دن ایک مسلمان غلام پیچھے رہ گیا - ایک بدعنوانی کے لئے لے جایا گیا - اور اس نے گیریژن کو ایک تیر پر امان لکھا جس میں اس نے چلایا۔ اگلے دن وہ باہر آئے: 'یہ تمہاری امان ہے'؛ مسلمانوں نے عمر کو لکھا، جس نے جواب دیا کہ 'مسلمانوں کا غلام مسلمانوں کا ہے - اس کا دھما ان کا ہے: اس کی عزت کرو'، اور انہوں نے ایسا کیا۔ ایک اور بیان میں قلعہ سیرف میں تھا، چوکی کہتی تھی کہ 'ہم غلام سے آزاد نہیں جانتے'، اور عمر کا جواب بھی یہی تھا۔"
  tr: "Müslümanlar Şahrij'i bir ay boyunca kuşattılar ve bir günde fethedeceklerini sandılar. Bu yüzden bir gün halkıyla savaştılar ve kamplarına döndüler. Köle olan bir kişi geride kaldı, bu yüzden şüphelendiler ve onlara bir güvenlik kefaleti yazıp bir okla attılar. Savaşmaya gittiklerinde, kale halkı dışarı çıktı ve \"İşte sizin güvenlik kefaletiniz\" dedi. Bunun üzerine Ömer'e haber verdiler ve Ömer onlara, \"Müslümanların kölesi Müslümanlardandır, kefaleti onların kefaleti gibidir, öyleyse kefaleti yerine getirilsin\" diye yazdı. Bunun üzerine kefalet yerine getirildi. Başka bir rivayette ise kale Siraf'taydı ve Müslümanlar, \"Kefaleti hiçbir şey ifade etmiyor\" dediler. Bunun üzerine halk, \"Biz hür insanı köleden ayırt edemeyiz\" dedi. Bunun üzerine Ömer'e haber verdi ve Ömer de, \"Müslümanların kölesi bizdendir, kefaleti onların kefaleti gibidir\" diye yazdı."
  id: "Kaum Muslimin mengepung Shahrij selama sebulan penuh dan mengira mereka akan menaklukkannya dalam satu hari. Maka mereka berperang melawan penduduknya suatu hari dan kembali ke perkemahan mereka. Seorang budak tertinggal, sehingga mereka curiga dan menuliskan jaminan keselamatan untuknya lalu melemparkannya bersama anak panah. Ketika mereka pergi berperang, penduduk benteng keluar dan berkata, “Inilah jaminan keselamatan kalian.” Maka mereka menulis tentang hal itu kepada Umar, dan dia membalas, “Budak kaum Muslimin adalah salah satu dari kaum Muslimin, jaminannya sama seperti jaminan mereka, maka laksanakanlah jaminannya.” Maka mereka melaksanakannya. Dalam riwayat lain, benteng itu berada di Siraf, dan kaum Muslimin berkata, “Jaminannya tidak ada artinya.” Maka penduduk berkata, “Kami tidak dapat membedakan orang merdeka dari budak.” Maka ia menulis kepada Umar, dan Umar membalas, “Budak kaum Muslimin adalah salah satu dari kami, jaminannya sama seperti jaminan mereka.”"
