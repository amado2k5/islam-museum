id: event/siege-of-constantinople-717
class: event
kind: siege
label: { ar: "حصار القسطنطينية في عهد سليمان بن عبد الملك", en: "Siege of Constantinople under Sulayman ibn Abd al-Malik" }
summary:
  ar: "حملة بحرية وبرية أرسلها سليمان بن عبد الملك إلى القسطنطينية بقيادة مسلمة بن عبد الملك، وكانت الحملة البرية نحو مئة وعشرين ألفاً والبحرية نحو ألف مركب بحسب ما يذكره الكتاب {cite:salabi-umayyad-state-2020 p.47}. تصف دائرة المعارف الإسلامية الحصار بأنه دام نحو سنة وانتهى دون نجاح، وتعطي بدايتين مختلفتين له هما 25 آب 716م ومنتصف آب 717م. وعند وفاة سليمان أمر عمر بن عبد العزيز مسلمة بالعودة، فانسحب الجيش بعد صلح مع البيزنطيين {cite:salabi-umayyad-state-2020 p.49}. وتذكر المقالتان من الأسباب هجمات البلغار وقلة المؤن والطاعون والنار الإغريقية، ويذكر الكتاب الخيانة وشدة الشتاء وقلة خبرة مسلمة {cite:salabi-umayyad-state-2020 pp.50-52}."
  en: "Campaign launched under Sulayman ibn Abd al-Malik against Constantinople, led by Maslama ibn Abd al-Malik, with about 120,000 on land and about a thousand ships according to one book {cite:salabi-umayyad-state-2020 p.47}. The Encyclopaedia of Islam describes a siege of about a year that ended without success, and gives two different starts, 25 August 716 and mid-August 717. At Sulayman's death Umar ibn Abd al-Aziz ordered Maslama back, and the army withdrew after a treaty with the Byzantines {cite:salabi-umayyad-state-2020 p.49}. The encyclopaedia names Bulghar attacks, scarcity of provisions, plague and Greek fire among the causes; the book names betrayal, a harsh winter and Maslama's limited experience {cite:salabi-umayyad-state-2020 pp.50-52}."
  ur: "سلیمان بن عبدالملک نے مسلمہ بن عبدالملک کی قیادت میں قسطنطنیہ کی طرف مہم بھیجی، ایک کتاب کے مطابق بری لشکر تقریباً ایک لاکھ بیس ہزار اور بیڑا تقریباً ایک ہزار کشتیوں پر مشتمل تھا {cite:salabi-umayyad-state-2020 p.47}۔ دائرۃ المعارف اسلامیہ تقریباً ایک سال کا محاصرہ بتاتا ہے جو بغیر کامیابی ختم ہوا، اور آغاز کی دو مختلف تاریخیں دیتا ہے، 25 اگست 716ء اور وسط اگست 717ء۔ سلیمان کی وفات پر عمر بن عبدالعزیز نے مسلمہ کو واپسی کا حکم دیا اور بازنطینیوں سے صلح کے بعد لشکر پلٹ گیا {cite:salabi-umayyad-state-2020 p.49}۔ دائرۃ المعارف اسلامیہ اسباب میں بلغاروں کے حملے، رسد کی کمی، طاعون اور یونانی آگ گنواتا ہے، اور کتاب خیانت، سخت سردی اور مسلمہ کی کم تجربہ کاری کا ذکر کرتی ہے {cite:salabi-umayyad-state-2020 pp.50-52}۔"
