id: event/siege-of-constantinople-717
class: event
kind: siege
label: { ar: "حصار القسطنطينية في عهد سليمان بن عبد الملك", en: "Siege of Constantinople under Sulayman ibn Abd al-Malik" }
summary:
  ar: "حملة بحرية وبرية أرسلها سليمان بن عبد الملك إلى القسطنطينية بقيادة مسلمة بن عبد الملك، وكانت الحملة البرية نحو مئة وعشرين ألفاً والبحرية نحو ألف مركب بحسب ما يذكره الكتاب {cite:salabi-umayyad-state-2020 p.47}. بدأ الإعداد في عهد الوليد بن عبد الملك، وتابعه سليمان بعد وفاته سنة ست وتسعين {cite:salabi-umayyad-state-2020 p.47}. وقد اختلف القادة في خطة السير: أشار موسى بن نصير بالاستيلاء على المدن والحصون التي دون القسطنطينية أولاً، وأشار مسلمة بالتوجه إليها مباشرة، فأخذ الخليفة برأي مسلمة {cite:salabi-umayyad-state-2020 p.48}. وعند وفاة سليمان أمر عمر بن عبد العزيز مسلمة بالعودة، فانسحب الجيش بعد عقد صلح مع البيزنطيين {cite:salabi-umayyad-state-2020 p.49}. ويعزو الكتاب فشل الحملة إلى ما ذكره من خيانة وتحريض، وإلى شدة الشتاء سنة تسع وتسعين، وإلى قلة خبرة مسلمة العسكرية {cite:salabi-umayyad-state-2020 pp.50-52}."
  en: "Campaign launched under Sulayman ibn Abd al-Malik against Constantinople, led by Maslama ibn Abd al-Malik, which ended in withdrawal in 99 AH after a treaty; the book attributes its failure to a reported betrayal, a harsh winter and Maslama's limited experience {cite:salabi-umayyad-state-2020 pp.47-52}."
