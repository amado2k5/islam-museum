id: event/expedition-of-dumat-al-jandal
class: event
kind: campaign
label: { en: "The Expedition of Dumat al-Jandal", ar: "غزوة دومة الجندل", es: "La expedición de Dumat al-Jandal", fr: "L'expédition de Dumat al-Jandal", ur: "دمت الجندل کی مہم" }
summary:
  en: "In Rabi' I 5 AH (August 626 CE), the Prophet led a 1,000-strong expedition to Dumat al-Jandal on the borders of Syria to secure the trade routes against marauding tribes; the gathering dispersed, and the Muslims established security and concluded non-aggression terms with tribal chiefs."
  ar: "في ربيع الأول سنة 5هـ ⁦(أغسطس 626م)⁩ خرج النبي في ألف من أصحابه إلى دومة الجندل على مشارف الشام لتأمين طرق التجارة وزجر القبائل التي كانت تقطع الطريق وتتحشد لغزو المدينة؛ فتفرقت جموعهم وعقد معاهدة مع عيينة بن حصن وأقر الأمن في شمال الجزيرة."
  es: "En Rabi' I del año 5 de la Hégira (agosto de 626 d. C.), el Profeta dirigió una expedición de 1000 hombres a Dumat al-Jandal, en la frontera con Siria, para proteger las rutas comerciales contra las tribus saqueadoras; la concentración se dispersó y los musulmanes establecieron la seguridad y concluyeron acuerdos de no agresión con los jefes tribales."
  fr: "En Rabi' I 5 AH (août 626 CE), le Prophète mena une expédition de 1 000 hommes à Dumat al-Jandal, aux frontières de la Syrie, pour sécuriser les routes commerciales contre les tribus maraudeuses; le rassemblement se dispersa, et les musulmans établirent la sécurité et conclurent des accords de non-agression avec les chefs tribaux."
  ur: "ربیع الثانی 5 ہجری ⁦(اگست 626 عیسوی)⁩ میں، رسول اللہ نے شام کی سرحدوں پر دمت الجندل کی طرف ایک ہزار پر مشتمل مہم کی قیادت کی تاکہ غاصب قبائل کے خلاف تجارتی راستوں کو محفوظ بنایا جا سکے۔ اجتماع منتشر ہو گیا، اور مسلمانوں نے سیکورٹی قائم کی اور قبائلی سرداروں کے ساتھ غیر جارحیت کی شرائط طے کیں۔"
