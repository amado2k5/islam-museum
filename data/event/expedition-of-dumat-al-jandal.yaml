summary:
  en: "In Rabi' I 5 AH (August 626 CE), the Prophet led a 1,000-strong expedition to Dumat al-Jandal on the borders of Syria to secure the trade routes against marauding tribes; the gathering dispersed, and the Muslims established security and concluded non-aggression terms with tribal chiefs."
  ar: "في ربيع الأول سنة 5هـ (أغسطس 626م) خرج النبي في ألف من أصحابه إلى دومة الجندل على مشارف الشام لتأمين طرق التجارة وزجر القبائل التي كانت تقطع الطريق وتتحشد لغزو المدينة؛ فتفرقت جموعهم وعقد معاهدة مع عيينة بن حصن وأقر الأمن في شمال الجزيرة."
