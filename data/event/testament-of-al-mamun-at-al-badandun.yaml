id: event/testament-of-al-mamun-at-al-badandun
class: event
kind: death
label:
  ar: وصية المأمون بالبذندون في مرضه ودفنه بطرسوس
  en: Testament of al-Ma'mun at al-Badandun and his burial at Tarsus
  ur: مامون کی البذندون میں وصیت اور طرسوس میں تدفین
  es: "Testamento de al-Ma'mun en al-Badandun y su entierro en Tarso"
  fr: "Testament d'al-Ma'mun à al-Badandun et son enterrement à Tarse"
  tr: "Al-Ma'mun'un, Al-Badhandun'un hastalığı sırasında ve Tarsus'taki definiyle ilgili vasiyeti."
  id: "Wasiat Al-Ma'mun mengenai Al-Badhandun selama sakitnya dan pemakamannya di Tarsus."
summary:
  ar: "مرض المأمون في غزوته بأرض الروم عند عين البذندون وأوصى بالخلافة لأخيه المعتصم، وأشهد على وصيته القضاة والأمراء والوزراء بحضور ابنه العباس {cite:al-bidaya-wal-nihaya scan vol. 5 p. 677}. وفيها أمر أن يُوجَّه بعد موته وأن يصلي عليه أقرب أقاربه ويكبّر خمساً، ووصى أخاه برعاية الرعية وبعبد الله بن طاهر وابن أبي دؤاد وبني علي {cite:tarikh-islam-dhahabi scan vol. 18 p. 26}. وأوصى المعتصم بما كان يعتقده في القرآن ومات عليه، وقد امتنع أحمد بن حنبل عن الإجابة في المحنة {cite:al-bidaya-wal-nihaya scan vol. 5 p. 677}{cite:tarikh-islam-dhahabi scan vol. 18 p. 25}. وتوفي في رجب سنة ثماني عشرة ومئتين ودُفن بطرسوس في دار خاقان الخادم {cite:al-bidaya-wal-nihaya scan vol. 5 p. 677}."
  en: "Al-Ma'mun fell ill on campaign in Byzantine land at the spring of al-Badandun and left the caliphate to his brother al-Mu'tasim, calling the judges, commanders and viziers to witness in the presence of his son al-Abbas {cite:al-bidaya-wal-nihaya scan vol. 5 p. 677}. He instructed that after his death he be laid out toward the qibla and prayed over by his nearest kinsman with five takbirs, and counselled his brother concerning the subjects, Abd Allah ibn Tahir, Ibn Abi Du'ad and the descendants of Ali {cite:tarikh-islam-dhahabi scan vol. 18 p. 26}. He charged al-Mu'tasim to hold his belief about the Qur'an and died on it; Ahmad ibn Hanbal declined to answer in the trial {cite:al-bidaya-wal-nihaya scan vol. 5 p. 677}{cite:tarikh-islam-dhahabi scan vol. 18 p. 25}. He died in Rajab of 218 and was buried at Tarsus in the house of Khaqan the servant {cite:al-bidaya-wal-nihaya scan vol. 5 p. 677}."
  ur: "مامون رومی علاقے میں مہم کے دوران البذندون کے چشمے پر بیمار ہوئے اور خلافت اپنے بھائی معتصم کو سونپی، بیٹے عباس کی موجودگی میں قاضیوں، سرداروں اور وزیروں کو گواہ بنایا {cite:al-bidaya-wal-nihaya scan vol. 5 p. 677}۔ ہدایت کی کہ موت کے بعد انھیں قبلہ رخ کیا جائے، قریب ترین رشتہ دار نماز پڑھائے اور پانچ تکبیریں کہے، اور بھائی کو رعیت، عبداللہ بن طاہر، ابن ابی دؤاد اور اولادِ علی کے بارے میں نصیحت کی {cite:tarikh-islam-dhahabi scan vol. 18 p. 26}۔ انھوں نے معتصم کو قرآن کے بارے میں اپنے عقیدے کی وصیت کی اور اسی پر فوت ہوئے؛ احمد بن حنبل نے آزمائش میں جواب دینے سے انکار کیا {cite:al-bidaya-wal-nihaya scan vol. 5 p. 677}{cite:tarikh-islam-dhahabi scan vol. 18 p. 25}۔ وہ سن 218 کے رجب میں فوت ہوئے اور طرسوس میں خادم خاقان کے گھر میں دفن ہوئے {cite:al-bidaya-wal-nihaya scan vol. 5 p. 677}۔"
  es: "Al-Ma'mun enfermó durante una campaña en tierras bizantinas en la primavera de al-Badandun y dejó el califato a su hermano al-Mu'tasim, llamando a los jueces, comandantes y visires a ser testigos en presencia de su hijo al-Abbas {cite:al-bidaya-wal-nihaya scan vol. 5 p. 677}. Instruyó que después de su muerte fuera colocado hacia la qibla y que su pariente más cercano rezara por él con cinco takbirs, y aconsejó a su hermano sobre los súbditos, Abd Allah ibn Tahir, Ibn Abi Du'ad y los descendientes de Ali {cite:tarikh-islam-dhahabi scan vol. 18 p. 26}. Encargó a al-Mu'tasim que mantuviera su creencia sobre el Corán y muriera por ella; Ahmad ibn Hanbal se negó a responder en el juicio {cite:al-bidaya-wal-nihaya scan vol. 5 p. 677}{cite:tarikh-islam-dhahabi scan vol. 18 p. 25}. Murió en Rajab de 218 y fue enterrado en Tarso en la casa del sirviente Khaqan {cite:al-bidaya-wal-nihaya scan vol. 5 p. 677}."
  fr: "Al-Ma'mun tomba malade lors d'une campagne en territoire byzantin, à la source d'al-Badandun, et laissa le califat à son frère al-Mu'tasim. Il convoqua les juges, les commandants et les vizirs comme témoins en présence de son fils al-Abbas (référence: al-bidaya-wal-nihaya, vol. 5, p. 677). Il ordonna qu'après sa mort, son corps soit exposé face à la qibla et que son plus proche parent récite cinq takbirs pour lui. Il conseilla également son frère au sujet de ses sujets, Abd Allah ibn Tahir, Ibn Abi Du'ad et les descendants d'Ali (référence: tarikh-islam-dhahabi, vol. 18, p. 26). Il enjoignit à al-Mu'tasim de rester fidèle à sa foi concernant le Coran et mourut sur cette base. Ahmad ibn Hanbal refusa de répondre lors du procès (référence: al-bidaya-wal-nihaya, vol. 5, p. 26). 677}{cite:tarikh-islam-dhahabi scan vol. 18 p. 25}. Il mourut en Rajab de 218 et fut enterré à Tarse dans la maison de Khaqan le serviteur {cite:al-bidaya-wal-nihaya scan vol. 5 p. 677}."
  tr: "El-Ma'mun, Bizans topraklarında, Ain el-Badandun yakınlarında yaptığı sefer sırasında hastalandı ve halifeliği kardeşi el-Mu'tasim'e bıraktı. Oğlu el-Abbas'ın huzurunda, kadıları, prensleri ve bakanlarını vasiyetine şahit tuttu. Vasiyetinde, ölümünden sonra en yakın akrabalarının cenaze namazını kıldırıp beş defa tekbir getirmelerini emretti. Halkın yönetimini, özellikle Abdullah ibn Tahir, İbn Abi Du'ad ve Beni Ali'ye emanet etti. Ayrıca, Kur'an hakkındaki kendi inançlarını da el-Mu'tasim'e bıraktı; bu inançları ölümüne kadar korudu. Ancak Ahmed ibn Hanbel, bu süreçte cevap vermeyi reddetti. 218 yılının Receb ayında öldü ve Tarsus'ta, Hakan el-Hadim'in evine defnedildi. {al-bidaya-wal-nihaya scan vol. 5 p. 677}"
  id: "Al-Ma'mun jatuh sakit selama kampanyenya di wilayah Bizantium dekat Ain al-Badandun dan mewariskan kekhalifahan kepada saudaranya, al-Mu'tasim. Ia meminta para hakim, pangeran, dan menteri untuk menjadi saksi wasiatnya di hadapan putranya, al-'Abbas. Di dalamnya, ia memerintahkan bahwa setelah kematiannya, kerabat terdekatnya harus memimpin salat jenazah, dengan melafalkan takbir lima kali. Ia mempercayakan kepada saudaranya untuk mengurus rakyat, dan khususnya 'Abdullah ibn Tahir, Ibn Abi Du'ad, dan Bani 'Ali. Ia juga mewariskan kepada al-Mu'tasim keyakinannya sendiri tentang Al-Quran, keyakinan yang dipegangnya hingga kematiannya. Namun, Ahmad ibn Hanbal menolak untuk memberikan jawaban selama masa sulit tersebut. Ia meninggal pada bulan Rajab tahun 218 dan dimakamkan di Tarsus di rumah Khaqan al-Khadim {cite:al-bidaya-wal-nihaya scan vol. 5 p. 677}."
