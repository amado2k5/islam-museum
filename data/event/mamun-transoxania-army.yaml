id: event/mamun-transoxania-army
class: event
kind: other
label: { ar: "استمالة المأمون وجند المعتصم لأهل ما وراء النهر", en: "The Court's Wooing of Transoxania", es: "El cortejo de la Corte a Transoxiana", fr: "La cour courtise la Transoxiane", ur: "ٹرانسکسانیا کی عدالت کی طرف سے التجا" }
summary:
  ar: "كان المأمون يكتب إلى عماله على خراسان في غزو من لم يكن على الطاعة والإسلام من أهل ما وراء النهر ويوجه رسله فيفرضون لمن رغب في الديوان ويريد الفريضة من أهل تلك النواحي وأبناء ملوكهم ويستميلهم بالرغبة فإذا وردوا بابه شرفهم وأسنى صلاتهم وأرزاقهم ثم استخلف المعتصم بالله فكان على مثل ذلك حتى صار جل شهود عسكره من جند أهل ما وراء النهر من السغد والفراغنة والأشروسنة وأهل الشاش وغيرهم وحضر ملوكهم بابه وغلب الإسلام على من هناك وصار أهل تلك البلاد يغزون من وراءهم من الترك وأغزى عبد الله بن طاهر ابنه طاهر بن عبد الله بلاد الفوزية ففتح مواضع لم يصل إليها أحد قبله وحدثني العمري عن الهيثم بن عدي عن ابن عياش أن قتيبة أسكن العرب ما وراء النهر حتى أسكنهم أرض فرغانة والشاش."
  en: "Al-Ma'mun's Khurasan agents campaigned the unsubmitted while his envoys enrolled willing Transoxanians — their kings' sons included — in the diwan, honored and raised in stipend at court. Al-Mu'tasim kept the same till most of his army's standing troops were Sughdians, Faraghanis, Ushrusanis and Shashis, their kings attending his gate; Islam prevailed there and they raided the Turks beyond them. Abdallah ibn Tahir's son Tahir opened lands of al-Fuziyya none had reached before; and Ibn Ayyash holds Qutayba settled Arabs beyond the river as far as Farghana and al-Shash."
  es: "Los agentes de Al-Ma'mun en Jorasán hicieron campaña contra los rebeldes, mientras que sus enviados reclutaban a transoxanos dispuestos —incluidos los hijos de sus reyes— en el diwan, donde eran honrados y elevados en estipendio en la corte. Al-Mu'tasim mantuvo la misma situación hasta que la mayoría de las tropas permanentes de su ejército eran sughdianos, faraghaníes, ushrusanis y shashis, cuyos reyes custodiaban su puerta; el islam prevaleció allí y saquearon a los turcos más allá de sus fronteras. Tahir, hijo de Abdallah ibn Tahir, abrió tierras de al-Fuziyya a las que nadie había llegado antes; e Ibn Ayyash afirma que Qutayba asentó a árabes más allá del río hasta Farghana y al-Shash."
  fr: "Les agents d'Al-Ma'mun au Khorasan menèrent campagne contre les rebelles, tandis que ses envoyés enrôlaient des Transoxeviens volontaires – y compris les fils de leurs rois – dans le diwan, où ils furent honorés et recevaient une pension accrue à la cour. Al-Mu'tasim maintint cette politique jusqu'à ce que la plupart des troupes permanentes de son armée soient composées de Sughdiens, de Faraghanis, d'Ushrusanis et de Shashis, leurs rois servant à sa porte; l'islam s'y est imposé et ils ont mené des raids contre les Turcs au-delà de leurs frontières. Le fils d'Abdallah ibn Tahir, Tahir, a ouvert les terres d'al-Fuziyya à des populations jusque-là inexplorées; et Ibn Ayyash rapporte que Qutayba a établi des Arabes au-delà du fleuve, jusqu'à Farghana et al-Shash."
  ur: "المامون کے خراسان کے ایجنٹوں نے جمع نہ ہونے والوں کی مہم چلائی جب کہ اس کے ایلچیوں نے رضامندی سے ٹرانسکسانیوں کو - جن میں ان کے بادشاہوں کے بیٹے بھی شامل تھے - کو دیوان میں شامل کیا، جن کو عدالت میں عزت اور وظیفہ دیا گیا۔ المعتصم نے اسی کو برقرار رکھا یہاں تک کہ اس کی فوج کے زیادہ تر کھڑے دستے صغدیان، فرغانی، عشروسی اور شاشی تھے، ان کے بادشاہ اس کے دروازے پر حاضر ہوتے تھے۔ وہاں اسلام کا غلبہ ہوا اور انہوں نے ترکوں پر چڑھائی کی۔ عبداللہ ابن طاہر کے بیٹے طاہر نے الفوزیہ کی زمینیں کھولیں اس سے پہلے کوئی نہیں پہنچا تھا۔ اور ابن عیاش نے قطیبہ کو دریا کے پار فرغانہ اور الشش تک آباد کیا ہے۔"
