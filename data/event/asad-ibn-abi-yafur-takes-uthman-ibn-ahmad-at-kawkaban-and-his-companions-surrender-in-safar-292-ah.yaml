id: "event/asad-ibn-abi-yafur-takes-uthman-ibn-ahmad-at-kawkaban-and-his-companions-surrender-in-safar-292-ah"
class: event
kind: other
label:
  ar: "أسعد بن أبي يعفر يظفر بعثمان بن أحمد في كوكبان ويؤمّن أصحابه، صفر سنة 292هـ، ص388-389"
  en: "As'ad ibn Abi Ya'fur defeats Uthman ibn Ahmad at Kawkaban and grants safe conduct to his companions, in Safar 292 AH, pp. 388-389"
  ur: "اسعد بن ابی یعفر کوکبان میں عثمان بن احمد کو شکست دیتا اور اس کے ساتھیوں کو امان دیتا ہے، صفر 292ھ، ص388-389"
  fr: "As'ad ibn Abi Ya'fur défait Uthman ibn Ahmad à Kawkaban et accorde un sauf-conduit à ses compagnons, en Safar 292 H, p. 388-389"
  es: "As'ad ibn Abi Ya'fur derrota a Uthman ibn Ahmad en Kawkaban y concede salvoconducto a sus compañeros, en Safar 292 AH, pp. 388-389."
summary:
  ar: "صعد عثمان بن أحمد إلى جبل بيت ذخار ولزم كوكبان، فبعث إليه أسعد عسكراً من موضع بيت خيام، فظفر به أسعد وحبسه، واستأمن إليه أصحابه فآمنهم."
  en: "Uthman ibn Ahmad went up Mount Bayt Dhakhar and held Kawkaban. As'ad sent troops by a route called Bayt Khiyam, defeated him, imprisoned him, and gave safe conduct to his companions who surrendered."
  ur: "عثمان بن احمد جبل بیت ذخار پر گیا اور کوکبان میں رکا، اسعد نے بیت خیام کے راستے سے فوج بھیجی، اسے شکست دی اور قید کیا، اور جن ساتھیوں نے ہتھیار ڈالے انہیں امان دی۔"
  fr: "Uthman ibn Ahmad monta sur le mont Bayt Dhakhar et tint Kawkaban. As'ad envoya des troupes par une route appelée Bayt Khiyam, le défit, l'emprisonna et accorda un sauf-conduit à ses compagnons, qui se rendirent."
  es: "Uthman ibn Ahmad ascendió al monte Bayt Dhakhar y tomó Kawkaban. As'ad envió tropas por una ruta llamada Bayt Khiyam, lo derrotó, lo encarceló y ofreció salvoconducto a sus compañeros que se rindieron."
