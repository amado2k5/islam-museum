label:
  ar: "وفاة ابن حبيب الحلبي بحلب، ربيع الآخر ٧٧٩هـ"
  en: "Death of Ibn Habib al-Halabi at Aleppo, Rabi' II 779/1377"
  ur: "ابن حبیب حلبی کی وفات، حلب، ربیع الآخر 779ھ/1377ء"
summary:
  ar: "توفي الشيخ الإمام بدر الدين حسن بن زين الدين عمر بن حبيب الحلبي الشافعي بحلب عن سبعين سنة، وكان قد باشر كتابة الملك وكتابة الإنشاء ونيابة القضاء ونيابة كتابة السر، وكان إمام عصره في صناعتي الإنشاء والشروط، وانقطع في آخر عمره بعزله {cite:nujum-zahira 11/189} {cite:durar-kamina-jil-1993 2/29-30}؛ ومات في ربيع الآخر سنة ٧٧٩هـ وله ولد طاهر {cite:durar-kamina-jil-1993 2/30} {cite:al-aalam 2/218-219}."
  en: "The shaykh and imam Badr al-Din Hasan ibn Zayn al-Din 'Umar ibn Habib al-Halabi al-Shafi'i died at Aleppo aged about seventy, having served in royal and chancery letter-writing and as deputy qadi and deputy secretary of the privy chancery; he was the master of his age in insha' and shurut, and late in life was dismissed {cite:nujum-zahira 11/189} {cite:durar-kamina-jil-1993 2/29-30}. He died in Rabi' II 779 leaving a son, Tahir {cite:durar-kamina-jil-1993 2/30} {cite:al-aalam 2/218-219}."
  ur: "شیخ امام بدر الدین حسن بن زین الدین عمر بن حبیب حلبی شافعی حلب میں تقریباً ستر سال کی عمر میں فوت ہوا؛ اس نے کتابۃ الملک اور کتابۃ الانشاء اور نیابۃ القضاء اور نیابۃ کتابۃ السر کے منصب سنبھالے تھے، انشاء اور شروط میں اپنے عصر کا امام تھا اور آخری زندگی میں عزل ہوا {cite:nujum-zahira 11/189} {cite:durar-kamina-jil-1993 2/29-30}۔ ربیع الآخر 779ھ میں وفات پائی، بیٹا طاہر چھوڑا {cite:durar-kamina-jil-1993 2/30} {cite:al-aalam 2/218-219}."
