label: { ar: "مكاتبة قيصر لعمر في شجرة النخل", en: "Caesar's Palm-Tree Letter to Umar", fr: "La lettre de César à Umar sur le palmier", es: "La carta de César a Umar escrita en una palmera", ur: "عمر کے نام قیصر کا کھجور کے درخت کا خط" }
summary:
  ar: "كتب قيصر إلى عمر بن الخطاب إن رسلي أتتني من قبلك فزعمت أن قبلكم شجرة ليست بخليقة بشيء من الخير تخرج مثل آذان الحمير ثم تشقق مثل اللؤلؤ ثم تخضر فتكون مثل الزمرد الأخضر ثم تحمر فتكون كالياقوت الأحمر ثم تينع فتنضج فتكون كأطيب فالوذج أكلاً ثم تيبس فتكون عصمة للمقيم وزاداً للمسافر فإن تكن رسلي صدقتني فلا أدري هذه الشجرة إلا من شجر الجنة فكتب إليه عمر من عبد الله عمر أمير المؤمنين إلى قيصر ملك الروم إن رسلك قد صدقوك هذه الشجرة عندنا هي الشجرة التي أنبتها الله على مريم حين ولدت عيسى ابنها فاتق الله ولا تتخذ عيسى إلهاً من دون الله."
  en: "Caesar wrote to Umar ibn al-Khattab: my envoys came from your quarter claiming your land has a tree no creation equals — it puts out like donkey-ears, splits like pearls, greens like emerald, reddens like ruby, ripens to the sweetest faludhaj to eat, then dries to provision for the settler and wayfarer — 'if my envoys spoke true, I know this tree only as a tree of paradise'. Umar wrote back, from Abdallah Umar Commander of the Faithful to Caesar king of the Romans: your envoys spoke true — this tree with us is the tree God grew for Maryam when she bore Isa her son; fear God and take not Isa as a god beside Him."
  fr: "César écrivit à Umar ibn al-Khattab : mes envoyés sont venus de ta contrée en affirmant que ta terre porte un arbre auquel nulle créature n'est égale : il pousse comme des oreilles d'âne, s'ouvre comme des perles, verdit comme l'émeraude, rougit comme le rubis, mûrit en le plus doux faludhaj à manger, puis sèche pour devenir provision du sédentaire et du voyageur ; « si mes envoyés ont dit vrai, je ne connais cet arbre que comme un arbre du paradis ». Umar répondit, de la part d'Abdallah Umar, Commandeur des croyants, à César, roi des Romains : tes envoyés ont dit vrai ; cet arbre chez nous est l'arbre que Dieu fit pousser pour Maryam quand elle enfanta Isa, son fils ; crains Dieu et ne prends pas Isa pour un dieu à côté de Lui."
  es: "César escribió a Umar ibn al-Khattab: «Mis enviados vinieron de tu región afirmando que tu tierra tiene un árbol sin igual en la creación: brota como orejas de asno, se abre como perlas, reverdece como esmeraldas, se tiñe de rojo como rubíes, madura hasta convertirse en el faludhaj más dulce para comer, y luego se seca para proveer al colono y al viajero. Si mis enviados dijeron la verdad, conozco este árbol solo como un árbol del paraíso». Umar respondió, de Abdallah Umar, Comandante de los Creyentes, a César, rey de los romanos: «Tus enviados dijeron la verdad: este árbol que tenemos es el árbol que Dios hizo crecer para María cuando dio a luz a su hijo Isa; teme a Dios y no tomes a Isa como un dios aparte de Él»."
  ur: "قیصر نے عمر بن الخطاب کو لکھا: میرے ایلچی آپ کے محلے سے آئے ہیں اور دعویٰ کرتے ہیں کہ آپ کی زمین میں ایک ایسا درخت ہے جس کی کوئی مخلوق نہیں ہے، یہ گدھے کی کانوں کی طرح اگتا ہے، موتیوں کی طرح پھٹ جاتا ہے، زمرد کی طرح سبز، یاقوت کی طرح سرخ ہوتا ہے، کھانے کے لیے سب سے میٹھے فالدھج تک پک جاتا ہے، پھر خشک ہو جاتا ہے، اور اگر میں اپنے رزق کے لیے سچا ہو، اور اس کا راستہ بتاؤں۔ یہ درخت صرف جنت کا درخت ہے۔ عمر نے واپس لکھا، عبداللہ عمر کمانڈر آف دی فیففف سے رومیوں کے بادشاہ قیصر کو: آپ کے ایلچی نے سچ کہا - یہ درخت ہمارے ساتھ وہی درخت ہے جو خدا نے مریم کے لئے اس وقت اگایا جب اس نے اپنے بیٹے عیسیٰ کو جنم دیا۔ خدا سے ڈرو اور عیسیٰ کو اس کے سوا معبود نہ بناؤ۔"
