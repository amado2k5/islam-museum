label:
  ar: انقسام ملك بني مرين بين فاس ومراكش ⁦(776هـ)⁩
  en: The Marinid division between Fez and Marrakesh (776 AH)
  es: "La división mariní entre Fez y Marrakech (776 AH)"
  fr: "La division mérinide entre Fès et Marrakech (776 AH)"
date:
  start: { edtf: "1374-06", hijri: "0776-01", calendar: julian, precision: month, status: tradition, derived: true, note: "دخل أبو العباس البلد الجديد سابع المحرم سنة 776هـ؛ التحويل مشتق." }
summary:
  ar: "اجتمع السلطان أبو العباس أحمد والأمير عبد الرحمن بن أبي الفضل بوادي النجا فحلفا على اتصال اليد على عدوهم، وزحفوا بعسكريهم إلى كدية العرائس في ذي القعدة سنة 775هـ فدارت الحرب وانهزم الوزير، وحاصروا البلد الجديد حتى دخل السلطان أبو العباس إليه سابع المحرم سنة 776هـ، وارتحل عبد الرحمن إلى مراكش فاستقل بها، وانعقدت بينهما السلم وجعل التخم بينهما أزمور — فصار لبني مرين ملكان: ملك فاس وملك مراكش."
  en: "Sultan Abu al-Abbas Ahmad and the amir Abd al-Rahman ibn Abi al-Fadl met at Wadi al-Naja and swore to join hands against their foe; their armies marched to Kadiyat al-Ara'is in Dhu al-Qa'da 775 AH where the vizier was routed, then besieged the New City until Abu al-Abbas entered on 7 Muharram 776 AH while Abd al-Rahman withdrew to Marrakesh and held it independently — the truce between them fixing Azmour as the boundary, leaving the Marinids with two kings: one of Fez and one of Marrakesh."
  es: "El sultán Abu al-Abbas Ahmad y el emir Abd al-Rahman ibn Abi al-Fadl se reunieron en Wadi al-Naja y juraron unir fuerzas contra su enemigo; sus ejércitos marcharon a Kadiyat al-Ara'is en Dhu al-Qa'da 775 AH, donde el visir fue derrotado, y luego sitiaron la Ciudad Nueva hasta que Abu al-Abbas entró el 7 de Muharram 776 AH, mientras que Abd al-Rahman se retiró a Marrakech y la mantuvo de forma independiente; la tregua entre ellos fijó Azmour como frontera, dejando a los mariníes con dos reyes: uno de Fez y otro de Marrakech."
  fr: "Le sultan Abu al-Abbas Ahmad et l'émir Abd al-Rahman ibn Abi al-Fadl se rencontrèrent à Wadi al-Naja et jurèrent de s'unir contre leur ennemi; leurs armées marchèrent sur Kadiyat al-Ara'is en Dhu al-Qa'da 775 AH où le vizir fut mis en déroute, puis assiégèrent la Ville Nouvelle jusqu'à ce qu'Abu al-Abbas y entre le 7 Muharram 776 AH tandis qu'Abd al-Rahman se retira à Marrakech et la conserva indépendamment — la trêve entre eux fixant Azmour comme frontière, laissant les Mérinides avec deux rois: l'un de Fès et l'autre de Marrakech."
