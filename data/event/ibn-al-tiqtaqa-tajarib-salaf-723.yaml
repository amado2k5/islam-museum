label:
  ar: "ترجمة هندوشاه بن سنجر «الفخري» إلى الفارسية، ٧٢٣–٧٢٤هـ"
  en: "Hindushah ibn Sanjar translates al-Fakhri into Persian, 723-4/1323-4"
  ur: "ہندوشاہ بن سنجر کی «فخری» کا فارسی ترجمہ، 723-4ھ/1323-4ء"
summary:
  ar: "ترجم هندوشاه بن سنجر «الفخري» إلى الفارسية سنة ٧٢٣–٧٢٤هـ/١٣٢٣–١٣٢٤م بعنوان «تجارب السلف»، ويدل عنوانها على تسمية عمل ابن الطقطقي «منية الفضلاء في تواريخ الخلفاء والوزراء»، وهي غالباً طبعة لاحقة من قسم التاريخ في «الفخري»؛ ويذكر له أيضاً «كتاب الغاية» في تلخيص مجمع الآداب لابن الفوطي {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}."
  en: "A Persian translation of al-Fakhri by Hindushah ibn Sanjar made in 723-4/1323-4, entitled Tajarib al-salaf, indicates the title of Ibn al-Tiqtaqa's work as Munyat al-fudala' fi tawarikh al-khulafa' wa-l-wuzara' — probably a later edition of the historical section of the Fakhri; a Kitab al-Ghaya is also mentioned by Ibn al-Fuwati in Talkhis Majma' al-adab {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}."
  ur: "ہندوشاہ بن سنجر نے 723-4ھ/1323-4ء میں «الفخری» کا فارسی ترجمہ «تجارب السلف» کے عنوان سے کیا، جس سے ابن طقطقی کی کتاب کا عنوان «منیۃ الفضلاء فی تواریخ الخلفاء والوزراء» معلوم ہوتا ہے — غالباً فخری کے تاریخی حصے کا بعد والا ایڈیشن؛ ابن فوطی کی تلخیص مجمع الآداب میں ان کا «کتاب الغایۃ» بھی مذکور ہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 988}۔"
