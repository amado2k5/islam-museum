label: { ar: "أخذ التتار الموصل بالخديعة سنة 660هـ", en: "The Tatars take Mosul by ruse, 660", es: "Los tártaros toman Mosul mediante una estratagema, 660", fr: "Les Tatars prennent Mossoul par ruse, 660", ur: "تاتاریوں نے موصل پر قبضہ کر لیا، 660" }
summary:
  ar: "في أوائل رمضان سنة ستين وستمائة أخذت التتار الموصل بخديعة بعد حصار أشهر، وطمّنوا الناس وخربوا السور ثم بذلوا السيف تسعة أيام، وأبقوا صاحبها الملك الصالح إسماعيل أياماً ثم قتلوه وقتلوا ولده علاء الدين الملك {cite:shadharat-dhahab p. 308}."
  en: "In early Ramadan 660 the Tatars took Mosul by ruse after a siege of months — calmed the people, razed the wall, then loosed the sword nine days; its lord al-Malik al-Salih Isma'il, Badr al-Din Lu'lu's son, they kept alive days, then killed him and his son Ala al-Din {cite:shadharat-dhahab p. 308}."
  es: "A principios del Ramadán del año 660, los tártaros tomaron Mosul mediante una estratagema tras un asedio de meses: calmaron a la gente, derribaron la muralla y luego desataron la guerra durante nueve días; a su señor, al-Malik al-Salih Isma'il, hijo de Badr al-Din Lu'lu, lo mantuvieron con vida durante días, y luego lo mataron a él y a su hijo Ala al-Din {cita: shadharat-dhahab p. 308}."
  fr: "Au début du Ramadan 660, les Tatars prirent Mossoul par ruse après un siège de plusieurs mois: ils calmèrent le peuple, rasèrent les murs, puis lâchèrent l'épée pendant neuf jours; ils maintinrent en vie pendant des jours le seigneur al-Malik al-Salih Isma'il, fils de Badr al-Din Lu'lu, puis le tuèrent ainsi que son fils Ala al-Din {cite: shadharat-dhahab p. 308}."
  ur: "رمضان 660 کے اوائل میں تاتاریوں نے مہینوں کے محاصرے کے بعد موصل پر قبضہ کر لیا — لوگوں کو پرسکون کیا، دیوار کو گرایا، پھر نو دن تلوار کھول دی۔ اس کے آقا المالک الصالح اسماعیل، بدر الدین لولو کے بیٹے کو زندہ رکھا، پھر اسے اور اس کے بیٹے علاء الدین کو قتل کر دیا۔ 308}۔"
