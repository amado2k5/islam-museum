id: "event/al-qasim-pardons-those-who-seek-amnesty-in-saada-and-al-hasan-flees-after-his-betrayal-is-known"
class: event
kind: other
label:
  ar: "يعفو القاسم بن أحمد عن المستأمنين في صعدة ويهرب الحسن بعد ظهور غدره، بعد جمادى الأولى سنة 326هـ، ص411"
  en: "Al-Qasim ibn Ahmad pardons those who seek amnesty in Saada, and al-Hasan flees once his betrayal is known, after Jumada I 326 AH, p. 411"
  ur: "قاسم بن احمد صعدہ میں امان مانگنے والوں کو معاف کرتا ہے اور حسن کی غداری کھلنے پر وہ بھاگ جاتا ہے، جمادی الاولی 326ھ کے بعد، ص411"
  es: "Al-Qasim ibn Ahmad perdona a quienes buscan amnistía en Saada, y al-Hasan huye una vez que se conoce su traición, después de Jumada I 326 AH, pág. 411"
  fr: "Al-Qasim ibn Ahmad pardonne à ceux qui demandent l'amnistie à Saada, et al-Hasan s'enfuit une fois sa trahison connue, après Jumada I 326 AH, p. 411"
  tr: "Hicri 326 yılında Cemâdeü'l-Ula'dan sonra, el-Kasım ibn Ahmed, Sa'de'de koruma arayanları affeder ve el-Hasan'ın ihaneti ortaya çıkınca kaçar (s. 411)."
  id: "Al-Qasim ibn Ahmad mengampuni orang-orang yang mencari perlindungan di Sa'dah, dan Al-Hasan melarikan diri setelah pengkhianatannya terungkap, setelah Jumada al-Ula pada tahun 326 H, hlm. 411"
summary:
  ar: "يرجع إليه الناس مستأمنين فيعفو عنهم، فتسكن الفتنة، ويعلم أن الحسن قد نكث بأخيه، فيخرج هاربا حتى يصل إلى خيوان، ويكاتب ابن الضحاك ويستمد الملوك على أخيه فلا يمده أحد."
  en: "People come to him seeking amnesty and he pardons them, and the strife subsides. Al-Hasan's betrayal of his brother becomes known, and he flees to Khiwan, corresponds with Ibn al-Dahhak, and seeks help from the rulers against his brother, but none gives him aid."
  ur: "لوگ امان مانگنے آتے ہیں اور قاسم انہیں معاف کر دیتا ہے، تو فتنہ تھم جاتا ہے۔ حسن کی اپنے بھائی سے بے وفائی ظاہر ہو جاتی ہے، وہ بھاگ کر خیوان پہنچتا ہے، ابن الضحاک سے خط و کتابت کرتا ہے اور حکمرانوں سے بھائی کے خلاف مدد مانگتا ہے، لیکن کوئی مدد نہیں کرتا۔"
  es: "La gente acude a él en busca de amnistía y él los perdona, y el conflicto cesa. La traición de Al-Hasan a su hermano sale a la luz, y huye a Khiwan, se cartea con Ibn al-Dahhak y busca la ayuda de los gobernantes contra su hermano, pero nadie se la presta."
  fr: "On vient le trouver pour implorer son pardon, il le lui accorde et les troubles s'apaisent. La trahison d'Al-Hasan envers son frère est révélée, et il s'enfuit à Khiwan, correspond avec Ibn al-Dahhak et sollicite l'aide des dirigeants contre son frère, mais en vain."
  tr: "İnsanlar ondan koruma isteyerek geri dönerler ve o da onları affeder, böylece çekişme yatışır. Hasan'ın kardeşine verdiği sözü tutmadığını öğrenince kaçar ve Hayvan'a ulaşır. İbn el-Dahhak'a mektup yazar ve kardeşine karşı krallardan yardım ister, ancak kimse ona yardım etmez."
  id: "Orang-orang kembali kepadanya untuk meminta perlindungan, dan dia mengampuni mereka, sehingga perselisihan mereda. Dia mengetahui bahwa Al-Hasan telah mengingkari janjinya kepada saudaranya, sehingga dia melarikan diri hingga mencapai Khaywan, dan dia menulis surat kepada Ibn Al-Dahhak dan meminta bantuan dari raja-raja untuk melawan saudaranya, tetapi tidak ada yang membantunya."
