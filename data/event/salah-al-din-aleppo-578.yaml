label: { ar: "صلاح الدين يأخذ الشمال ويتسلم حلب سنة 578", en: "Salah al-Din takes the north and Aleppo in 578", es: "Saladino toma el norte y Alepo en 578.", fr: "Saladin s'empare du nord et d'Alep en 578." }
summary:
  ar: "في سنة ثمان وسبعين سار صلاح الدين فافتتح حران وسروج وسنجار ونصيبين والرقة ونازل الموصل فحاصرها وتحير من حصانتها ثم جاءه رسول الخليفة بأمره بالترحل عنها فرحل، ورجع فأخذ حلب من عز الدين مسعود الأتابكي وعوضه بسنجار {cite:shadharat-dhahab p. 739}."
  en: "In 578 Salah al-Din swept the north — Harran, Saruj, Sinjar, Nisibis and al-Raqqa — besieged Mosul till the caliph's envoy ordered him off, then took Aleppo from Izz al-Din Mas'ud in exchange for Sinjar {cite:shadharat-dhahab p. 739}."
  es: "En 578, Salah al-Din arrasó el norte — Harran, Saruj, Sinjar, Nisibis y al-Raqqa — sitió Mosul hasta que el enviado del califa le ordenó retirarse, luego tomó Alepo de Izz al-Din Mas'ud a cambio de Sinjar {cite:shadharat-dhahab p. 739}."
  fr: "En 578, Salah al-Din a balayé le nord — Harran, Saruj, Sinjar, Nisibis et al-Raqqa — a assiégé Mossoul jusqu'à ce que l'envoyé du calife lui ordonne de partir, puis a pris Alep à Izz al-Din Mas'ud en échange de Sinjar {cite:shadharat-dhahab p. 739}."
