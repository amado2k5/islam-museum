label: { ar: "صلاح الدين يأخذ الشمال ويتسلم حلب سنة 578", en: "Salah al-Din takes the north and Aleppo in 578", es: "Saladino toma el norte y Alepo en 578.", fr: "Saladin s'empare du nord et d'Alep en 578.", ur: "صلاح الدین نے شمال اور حلب کو 578 میں لیا۔", tr: "Selahaddin, Hicri 578 yılında kuzeyi ele geçirerek Halep'i fethetti.", id: "Saladin menguasai wilayah utara dan merebut Aleppo pada tahun 578 Hijriah." }
summary:
  ar: "في سنة ثمان وسبعين سار صلاح الدين فافتتح حران وسروج وسنجار ونصيبين والرقة ونازل الموصل فحاصرها وتحير من حصانتها ثم جاءه رسول الخليفة بأمره بالترحل عنها فرحل، ورجع فأخذ حلب من عز الدين مسعود الأتابكي وعوضه بسنجار {cite:shadharat-dhahab p. 739}."
  en: "In 578 Salah al-Din swept the north — Harran, Saruj, Sinjar, Nisibis and al-Raqqa — besieged Mosul till the caliph's envoy ordered him off, then took Aleppo from Izz al-Din Mas'ud in exchange for Sinjar {cite:shadharat-dhahab p. 739}."
  es: "En 578, Salah al-Din arrasó el norte — Harran, Saruj, Sinjar, Nisibis y al-Raqqa — sitió Mosul hasta que el enviado del califa le ordenó retirarse, luego tomó Alepo de Izz al-Din Mas'ud a cambio de Sinjar {cite:shadharat-dhahab p. 739}."
  fr: "En 578, Salah al-Din a balayé le nord — Harran, Saruj, Sinjar, Nisibis et al-Raqqa — a assiégé Mossoul jusqu'à ce que l'envoyé du calife lui ordonne de partir, puis a pris Alep à Izz al-Din Mas'ud en échange de Sinjar {cite:shadharat-dhahab p. 739}."
  ur: "578 میں صلاح الدین نے شمال میں حران، سروج، سنجار، نسیبس اور الرقہ کا محاصرہ کر لیا یہاں تک کہ خلیفہ کے ایلچی نے اسے چھوڑنے کا حکم دیا، پھر سنجار کے بدلے میں حلب کو عزالدین مسعود سے چھین لیا۔ 739}۔"
  tr: "78. yılda Selahaddin, Harran, Saruj, Sincar, Nusaybin ve Rakka'yı fethetti. Ardından Musul'u kuşattı ve surlarının gücüne hayran kaldı. Daha sonra halifenin elçisi ona Musul'u terk etmesi emrini verdi, o da ayrılıp geri döndü. Halep'i İzzüldin Mes'ud el-Atabaki'den aldı ve Sincar'ı ona verdi. {kaynak:şadharat-dhahab s. 739}"
  id: "Pada tahun tujuh puluh delapan, Saladin berbaris dan menaklukkan Harran, Saruj, Sinjar, Nusaybin, dan Raqqa. Kemudian ia mengepung Mosul dan kagum dengan benteng-bentengnya. Lalu utusan Khalifah datang kepadanya dengan perintah untuk meninggalkannya, maka ia pergi dan kembali. Ia merebut Aleppo dari Izz al-Din Mas’ud al-Atabaki dan menggantinya dengan Sinjar. {cite:shadharat-dhahab p. 739}"
