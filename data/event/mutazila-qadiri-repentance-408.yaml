summary:
  ar: "في سنة ثمان وأربعمائة استتاب أمير المؤمنين القادر بالله فقهاء المعتزلة الحنفية ببغداد، فأظهروا الرجوع وتبرأوا من الاعتزال، ونهاهم عن الكلام والتدريس والمناظرة في الاعتزال والرفض والمقالات المخالفة للسنة وأخذ خطوطهم بذلك، وامتثل يمين الدولة محمود بن سبكتكين أمر الخليفة في أعماله بخراسان فقتل وحبس ونفى المعتزلة والرافضة والإسماعيلية وأمر بلعنهم على منابر المسلمين {cite:muntazam-ibn-al-jawzi j.7 p.288}."
