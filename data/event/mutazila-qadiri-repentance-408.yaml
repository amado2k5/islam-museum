id: event/mutazila-qadiri-repentance-408
class: event
kind: declaration
label: { ar: "استتابة القادر للمعتزلة ببغداد وخراسان", en: "Al-Qadir's order of repentance for the Mu'tazila in Baghdad and Khurasan" }
summary:
  ar: "في سنة ثمان وأربعمائة استتاب أمير المؤمنين القادر بالله فقهاء المعتزلة الحنفية ببغداد، فأظهروا الرجوع وتبرأوا من الاعتزال، ونهاهم عن الكلام والتدريس والمناظرة في الاعتزال والرفض والمقالات المخالفة للسنة وأخذ خطوطهم بذلك، وامتثل يمين الدولة محمود بن سبكتكين أمر الخليفة في أعماله بخراسان فقتل وحبس ونفى المعتزلة والرافضة والإسماعيلية وأمر بلعنهم على منابر المسلمين {cite:muntazam-ibn-al-jawzi j.7 p.288}."
  en: "In 408 the Commander of the Faithful al-Qadir billah required repentance of the Hanafi jurists among the Mu'tazila in Baghdad; they professed their return and disavowed i'tizal. He forbade them to speak, teach or dispute in defence of i'tizal or rafd, or any doctrine contrary to the Sunna, and took their signed statements to that effect. Yamin al-Dawla Mahmud ibn Sebuktigin obeyed the caliph's order in his domains in Khurasan: he killed, imprisoned and exiled the Mu'tazila, the Rafida and the Isma'ilis, and ordered them cursed from the pulpits of the Muslims {cite:muntazam-ibn-al-jawzi j.7 p.288}."
