id: event/mutazila-qadiri-repentance-408
class: event
kind: declaration
label: { ar: "استتابة القادر للمعتزلة ببغداد وخراسان", en: "Al-Qadir's order of repentance for the Mu'tazila in Baghdad and Khurasan", es: "Orden de arrepentimiento de Al-Qadir para los Mu'tazila en Bagdad y Khurasan", fr: "Ordre de repentance d'Al-Qadir pour les Mu'tazila de Bagdad et du Khurasan" }
summary:
  ar: "في سنة ثمان وأربعمائة استتاب أمير المؤمنين القادر بالله فقهاء المعتزلة الحنفية ببغداد، فأظهروا الرجوع وتبرأوا من الاعتزال، ونهاهم عن الكلام والتدريس والمناظرة في الاعتزال والرفض والمقالات المخالفة للسنة وأخذ خطوطهم بذلك، وامتثل يمين الدولة محمود بن سبكتكين أمر الخليفة في أعماله بخراسان فقتل وحبس ونفى المعتزلة والرافضة والإسماعيلية وأمر بلعنهم على منابر المسلمين {cite:muntazam-ibn-al-jawzi j.7 p.288}."
  en: "In 408 the Commander of the Faithful al-Qadir billah required repentance of the Hanafi jurists among the Mu'tazila in Baghdad; they professed their return and disavowed i'tizal. He forbade them to speak, teach or dispute in defence of i'tizal or rafd, or any doctrine contrary to the Sunna, and took their signed statements to that effect. Yamin al-Dawla Mahmud ibn Sebuktigin obeyed the caliph's order in his domains in Khurasan: he killed, imprisoned and exiled the Mu'tazila, the Rafida and the Isma'ilis, and ordered them cursed from the pulpits of the Muslims {cite:muntazam-ibn-al-jawzi j.7 p.288}."
  es: "En 408, el Comandante de los Creyentes, al-Qadir billah, exigió el arrepentimiento de los juristas hanafíes entre los mu'tazilíes en Bagdad; estos profesaron su conversión y repudiaron el i'tizal. Les prohibió hablar, enseñar o debatir en defensa del i'tizal o el rafd, o cualquier doctrina contraria a la Sunna, y tomó sus declaraciones firmadas a tal efecto. Yamin al-Dawla Mahmud ibn Sebuktigin obedeció la orden del califa en sus dominios de Jorasán: mató, encarceló y exilió a los mu'tazilíes, los rafida y los ismaelitas, y ordenó que fueran maldecidos desde los púlpitos de los musulmanes {cite:muntazam-ibn-al-jawzi j.7 p.288}."
  fr: "En 408, le Commandeur des Croyants, al-Qadir billah, exigea la repentance des juristes hanafites parmi les Mu'tazilites de Bagdad; ceux-ci se convertirent et renoncèrent à l'i'tizal. Il leur interdit de parler, d'enseigner ou de débattre en faveur de l'i'tizal, du rafid, ou de toute doctrine contraire à la Sunna, et prit pour argent comptant leurs déclarations signées en ce sens. Yamin al-Dawla Mahmud ibn Sebuktigin obéit à l'ordre du calife dans ses territoires du Khorasan: il fit exécuter, emprisonner et exiler les Mu'tazilites, les Rafidites et les Ismaéliens, et ordonna qu'ils soient maudits depuis les chaires des musulmans (cf. Muntazam ibn al-Jawzi, vol. 7, p. 288)."
