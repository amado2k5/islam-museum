label: { ar: "وقعة الأحنف بطخارستان", en: "al-Ahnaf's Battle in Tukharistan", fr: "Bataille d’al-Ahnaf au Tukharistan", es: "La batalla de al-Ahnaf en Tujaristán", ur: "تخارستان میں الاحناف کی جنگ", tr: "Tokharistan'daki El-Ahnaf Muharebesi", id: "Pertempuran Al-Ahnaf di Tokharistan" }
summary:
  ar: "جمع أهل طخارستان للمسلمين واجتمع أهل الجوزجان والطالقان والفارياب ومن حولهم فبلغوا ثلاثين ألفاً وجاءهم أهل الصغانيان وهم في الجانب الشرقي من النهر فرجع الأحنف إلى قصره وخرج ليلاً فسمع رجلاً يوقد تحت خزيره أو يعجن يقول الرأي أن ينزل بين المرغاب والجبل فيكون المرغاب عن يمينه والجبل عن يساره فلا يلقى من عدوه وإن كثروا إلا بمثل عدة أصحابه فرأى ذلك صواباً ففعله وهو في خمسة آلاف من المسلمين أربعة آلاف من العرب وألف من مسلمي العجم فهز رايته وحمل فحلوا فقصد ملك الصغانيان للأحنف فأهوى له بالرمح فانتزع الأحنف الرمح من يده وقاتل قتالاً شديداً وقتل ثلاثة من أصحاب الطبول كان يقصد صاحب الطبل فيقتله ثم ضرب الله وجوه الكفار فقتلهم المسلمون قتلاً ذريعاً ووضعوا السلاح حيث شاؤوا آمنين."
  en: "Tukharistan massed against the Muslims — Juzjan, Talaqan, Faryab and their neighbors to thirty thousand, with the Saghaniyan from the river's east bank. Back at his castle al-Ahnaf overheard by night a man tending his fire or kneading dough: 'the move is to camp between the Marghab and the mountain — river right, mountain left — and you face no more than your own number'. He took it, five thousand Muslims — four thousand Arabs, a thousand Ajam converts — waved his banner and charged; the Saghaniyan king drove his spear at al-Ahnaf, who wrenched it from his hand and fought on, killing three drum-bearers one after another; then the rout — slaughter wherever they found them, and the foe laid down arms in safety."
  fr: "Le Tukharistan se rassembla contre les musulmans : Juzjan, Talaqan, Faryab et leurs voisins, jusqu’à trente mille hommes, rejoints par les Saghaniyan de la rive orientale du fleuve. Revenu à son château, al-Ahnaf entendit de nuit un homme près de son feu ou pétrissant sa pâte conseiller de camper entre le Murghab à droite et la montagne à gauche pour ne faire face qu’à un nombre égal au sien. Il suivit ce conseil avec cinq mille musulmans, quatre mille Arabes et mille convertis non arabes, agita sa bannière et chargea. Le roi des Saghaniyan dirigea sa lance contre lui ; al-Ahnaf la lui arracha et poursuivit le combat, tuant successivement trois porteurs de tambour. Ce fut ensuite la déroute : les adversaires furent tués où on les trouvait et déposèrent les armes sous garantie de sécurité."
  es: "Tukharistán reunió a treinta mil hombres contra los musulmanes: Juzjan, Talaqan, Faryab y sus vecinos, junto con los Saghaniyan de la orilla este del río. De vuelta en su castillo, al-Ahnaf oyó por la noche a un hombre que avivaba el fuego o amasaba: «La estrategia es acampar entre el Marghab y la montaña —río a la derecha, montaña a la izquierda— y no os enfrentaréis a más que vuestros hombres». Siguió el plan, cinco mil musulmanes —cuatro mil árabes y mil conversos ajam— ondearon su estandarte y cargaron; el rey Saghaniyan clavó su lanza en al-Ahnaf, quien se la arrebató de la mano y siguió luchando, matando a tres portadores de tambores uno tras otro; luego la derrota: masacraron a los enemigos dondequiera que los encontraban, y estos depusieron las armas a salvo."
  ur: "ترکستان نے دریا کے مشرقی کنارے سے سغانیاں کے ساتھ، جوزجان، تالقان، فاریاب اور ان کے پڑوسیوں کے ساتھ تیس ہزار تک مسلمانوں کے خلاف جمع کیا۔ اپنے محل الاحناف میں رات کو ایک آدمی کو آگ لگاتے یا آٹا گوندھتے ہوئے سنا: 'مقدمہ یہ ہے کہ مرغاب اور پہاڑ کے درمیان ڈیرے ڈالیں - دائیں بائیں پہاڑ - اور آپ کو اپنی تعداد سے زیادہ کا سامنا نہیں کرنا پڑے گا'۔ اس نے اسے لے لیا، پانچ ہزار مسلمانوں نے - چار ہزار عرب، ایک ہزار عجم نے اپنا جھنڈا لہرایا اور الزام لگایا۔ صغانیان بادشاہ نے الاحناف پر اپنا نیزہ چلایا، جس نے اسے اس کے ہاتھ سے چھین لیا اور لڑتے ہوئے تین ڈھول والے یکے بعد دیگرے مارے گئے۔ پھر روٹ - جہاں بھی انہیں ملے ذبح کر دیا، اور دشمن نے حفاظت میں ہتھیار رکھ دیئے۔"
  tr: "Tokharistan halkı Müslümanları topladı, Jawzjan, Talqan, Faryab ve çevrelerindekiler de toplandı ve sayıları otuz bine ulaştı. Saghanian halkı da onlara katıldı ve nehrin doğu tarafındaydılar. El-Ahnaf sarayına döndü ve gece dışarı çıktı. Bir adamın yulaf lapasının altına ateş yaktığını veya hamur yoğurduğunu duydu ve şöyle dedi: “Görüş şudur ki, Marghab ile dağ arasına inmeli, Marghab sağında, dağ solunda kalsın ki, düşmanlarıyla, sayıları çok olsa bile, ancak eşit sayıda yoldaşıyla karşılaşsın.” Bunu doğru buldu ve öyle yaptı. Yanında beş bin Müslüman, dört bin Arap ve bin Arap olmayan Müslüman vardı. Sancağını kaldırdı ve hücuma geçti, onlar da atlarından indiler. Saghanian kralı Al-Ahnaf'a doğru geldi ve mızrağını ona doğru uzattı, ancak Al-Ahnaf mızrağı elinden kaptı ve şiddetli bir şekilde savaşarak davulculardan üçünü öldürdü. Davulcuyu hedef alıp öldürüyordu. Sonra Allah kâfirlerin yüzlerine vurdu, böylece Müslümanlar onları korkunç bir şekilde öldürdüler ve silahlarını istedikleri güvenli yerlere bıraktılar."
  id: "Penduduk Tokharistan mengumpulkan kaum Muslim, dan penduduk Jawzjan, Talqan, Faryab, dan orang-orang di sekitarnya juga berkumpul, dan jumlah mereka mencapai tiga puluh ribu. Penduduk Saghanian datang kepada mereka, dan mereka berada di sisi timur sungai. Al-Ahnaf kembali ke istananya dan keluar pada malam hari dan mendengar seorang pria menyalakan api di bawah buburnya atau menguleni adonan, berkata, “Pendapatnya adalah bahwa ia harus turun di antara Marghab dan gunung, sehingga Marghab berada di sebelah kanannya dan gunung di sebelah kirinya, agar ia tidak bertemu musuhnya, meskipun mereka banyak, kecuali dengan jumlah pengikut yang sama.” Ia melihat itu sebagai hal yang benar, maka ia melakukannya, dan ia bersama lima ribu Muslim, empat ribu Arab, dan seribu Muslim non-Arab. Ia mengangkat panjinya dan menyerang, dan mereka turun dari kuda. Raja Saghanian datang ke arah Al-Ahnaf dan menusukkan tombaknya ke arahnya, tetapi Al-Ahnaf merebut tombak itu dari tangannya dan bertempur dengan sengit serta membunuh tiga penabuh genderang. Dia akan mengincar pemain drum itu dan membunuhnya. Kemudian Allah menimpakan malapetaka pada wajah orang-orang kafir, sehingga kaum Muslim membunuh mereka dengan cara yang mengerikan dan meletakkan senjata mereka di mana pun mereka mau dengan aman."
