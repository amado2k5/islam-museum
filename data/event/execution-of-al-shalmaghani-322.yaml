id: event/execution-of-al-shalmaghani-322
class: event
kind: death
label: { ar: "قتل الشلمغاني وابن أبي عون", en: "The execution of al-Shalmaghani and Ibn Abi Awn", es: "La ejecución de al-Shalmaghani e Ibn Abi Awn", fr: "L'exécution d'al-Shalmaghani et d'Ibn Abi Awn" }
summary:
  ar: "في شوال سنة 322هـ ظهر الشلمغاني فقبض عليه الوزير ابن مقلة وسجنه وكُشفت داره فوجدت فيها رقاع وكتب ممن يعتقد فيه يخاطبونه بما لا يخاطب به البشر بعضهم بعضاً وفيها خط الحسين بن القاسم، فأنكر مذهبه وأظهر الإسلام وتبرأ مما يقال فيه، وأُحضر هو وأصحابه مراراً ومعهم الفقهاء والقضاة والكتاب والنقباء فأفتى الفقهاء في آخر الأيام بإباحة دمه فصُلب ابن الشلمغاني وابن أبي عون في ذي القعدة وأُحرقا بالنار، وكان من مذهبه أن الإلهة بحقّ الحق وأن الله يحل في كل شيء على قدر ما يحتمل وأن اللاهوت ظهر في خمسة ناسوتية كلما غاب واحد ظهر مكانه آخر وفي خمسة أبالسة ضدود لهم فاجتمعت اللاهوتية في آدم وإبليس ثم في نوح وإبليس ثم في صالح وحائر الناقة ثم في إبراهيم ونمرود ثم في موسى وفرعون {cite:kamil-ibn-al-athir p. 218-219}."
  en: "In 322 Ibn Muqla seized al-Shalmaghani and found in his house notes from believers addressing him as no men address each other, including one in the vizier Ibn Wahb's hand; though he recanted, the jurists finally shed his blood and he and Ibn Abi Awn were crucified and burned. His doctrine: God indwells all things to their capacity, and the lahut appeared in five nasut figures paired with five devils — Adam/Iblis, Noah/Iblis, Salih and the she-camel's hamstringer, Abraham/Nimrod, Moses/Pharaoh {cite:kamil-ibn-al-athir p. 218-219}."
  es: "En 322, Ibn Muqla capturó a al-Shalmaghani y encontró en su casa notas de creyentes que se dirigían a él como nadie se dirige a otro hombre, incluyendo una escrita por el visir Ibn Wahb; aunque se retractó, los juristas finalmente derramaron su sangre y él e Ibn Abi Awn fueron crucificados y quemados. Su doctrina: Dios habita en todas las cosas en su capacidad, y el lahut apareció en cinco figuras nasut emparejadas con cinco demonios: Adán/Iblis, Noé/Iblis, Salih y el tendón de la camella, Abraham/Nimrod, Moisés/Faraón {cita:kamil-ibn-al-athir p. 218-219}."
  fr: "En 322, Ibn Muqla arrêta al-Shalmaghani et découvrit chez lui des notes de croyants s'adressant à lui d'une manière dont nul homme ne s'adresse à un autre, dont une écrite de la main du vizir Ibn Wahb. Malgré son abjuration, les juristes finirent par le condamner et, avec Ibn Abi Awn, ils furent crucifiés et brûlés. Sa doctrine affirmait que Dieu réside en toute chose selon sa pleine capacité, et que le lahut se manifestait sous la forme de cinq figures nasut associées à cinq démons: Adam/Iblis, Noé/Iblis, Salih et le jarret de la chamelle, Abraham/Nimrod, Moïse/Pharaon (voir: Kamil Ibn al-Athir, p. 218-219)."
