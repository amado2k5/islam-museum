label: { ar: "قتل الشلمغاني وابن أبي عون", en: "The execution of al-Shalmaghani and Ibn Abi Awn", es: "La ejecución de al-Shalmaghani e Ibn Abi Awn", fr: "L'exécution d'al-Shalmaghani et d'Ibn Abi Awn", ur: "شلمغانی اور ابن ابی عون کی پھانسی", tr: "El Şalmagani ve İbn Ebu Avn öldürüldü", id: "Al-Shalmaghani dan Ibnu Abi Awn terbunuh" }
summary:
  ar: "في شوال سنة 322هـ ظهر الشلمغاني فقبض عليه الوزير ابن مقلة وسجنه وكُشفت داره فوجدت فيها رقاع وكتب ممن يعتقد فيه يخاطبونه بما لا يخاطب به البشر بعضهم بعضاً وفيها خط الحسين بن القاسم، فأنكر مذهبه وأظهر الإسلام وتبرأ مما يقال فيه، وأُحضر هو وأصحابه مراراً ومعهم الفقهاء والقضاة والكتاب والنقباء فأفتى الفقهاء في آخر الأيام بإباحة دمه فصُلب ابن الشلمغاني وابن أبي عون في ذي القعدة وأُحرقا بالنار، وكان من مذهبه أن الإلهة بحقّ الحق وأن الله يحل في كل شيء على قدر ما يحتمل وأن اللاهوت ظهر في خمسة ناسوتية كلما غاب واحد ظهر مكانه آخر وفي خمسة أبالسة ضدود لهم فاجتمعت اللاهوتية في آدم وإبليس ثم في نوح وإبليس ثم في صالح وحائر الناقة ثم في إبراهيم ونمرود ثم في موسى وفرعون {cite:kamil-ibn-al-athir p. 218-219}."
  en: "In 322 Ibn Muqla seized al-Shalmaghani and found in his house notes from believers addressing him as no men address each other, including one in the vizier Ibn Wahb's hand; though he recanted, the jurists finally shed his blood and he and Ibn Abi Awn were crucified and burned. His doctrine: God indwells all things to their capacity, and the lahut appeared in five nasut figures paired with five devils — Adam/Iblis, Noah/Iblis, Salih and the she-camel's hamstringer, Abraham/Nimrod, Moses/Pharaoh {cite:kamil-ibn-al-athir p. 218-219}."
  es: "En 322, Ibn Muqla capturó a al-Shalmaghani y encontró en su casa notas de creyentes que se dirigían a él como nadie se dirige a otro hombre, incluyendo una escrita por el visir Ibn Wahb; aunque se retractó, los juristas finalmente derramaron su sangre y él e Ibn Abi Awn fueron crucificados y quemados. Su doctrina: Dios habita en todas las cosas en su capacidad, y el lahut apareció en cinco figuras nasut emparejadas con cinco demonios: Adán/Iblis, Noé/Iblis, Salih y el tendón de la camella, Abraham/Nimrod, Moisés/Faraón {cita:kamil-ibn-al-athir p. 218-219}."
  fr: "En 322, Ibn Muqla arrêta al-Shalmaghani et découvrit chez lui des notes de croyants s'adressant à lui d'une manière dont nul homme ne s'adresse à un autre, dont une écrite de la main du vizir Ibn Wahb. Malgré son abjuration, les juristes finirent par le condamner et, avec Ibn Abi Awn, ils furent crucifiés et brûlés. Sa doctrine affirmait que Dieu réside en toute chose selon sa pleine capacité, et que le lahut se manifestait sous la forme de cinq figures nasut associées à cinq démons: Adam/Iblis, Noé/Iblis, Salih et le jarret de la chamelle, Abraham/Nimrod, Moïse/Pharaon (voir: Kamil Ibn al-Athir, p. 218-219)."
  ur: "322 میں ابن مقلہ نے الشلمغانی کو پکڑا اور اس کے گھر میں مومنین کے نوٹ ملے کہ اس سے اس طرح خطاب کیا گیا تھا کہ کوئی مرد ایک دوسرے کو مخاطب نہیں کرتا ہے، جس میں ایک وزیر ابن وہب کے ہاتھ میں ہے۔ اگرچہ اس نے انکار کیا، آخر کار فقہا نے اس کا خون بہایا اور اسے اور ابن ابی عون کو سولی پر چڑھا کر جلا دیا گیا۔ اس کا نظریہ: خدا ہر چیز کو ان کی صلاحیت کے مطابق رکھتا ہے، اور لاہوت پانچ شیطانوں کے ساتھ جوڑے ہوئے پانچ ناسوت شخصیتوں میں نمودار ہوئے - آدم/ابلیس، نوح/ابلیس، صالح اور اونٹنی کا جھونکا، ابراہیم/نمرود، موسیٰ/فرعون {حوالہ: کامل ابن الثیر ص 218-219}۔"
  tr: "Hicri 322 yılının Şevval ayında Şelmahani ortaya çıktı ve vezir İbn Mukla onu tutuklayıp hapse attı. Evi arandı ve içinde ona inananlardan, insanların birbirlerine hitap etmediği bir şekilde ona hitap eden notlar ve mektuplar bulundu. Bunların arasında Hüseyin ibn Kasım'ın el yazısı da vardı. Bunun üzerine İbn Şalmahani onun öğretisini reddetti, İslam'ı kabul etti ve hakkında söylenenleri yalanladı. Kendisi ve arkadaşları, hukukçular, kadılar, yazarlar ve önderlerle birlikte defalarca mahkemeye getirildi. Son günlerde hukukçular, kanının dökülmesine izin veren bir fetva yayınladılar ve bunun üzerine İbn Şalmahani ve İbn Ebu Evn, Zilhicce ayında çarmıha gerilerek yakıldılar. Onun öğretisi, ilahlığın Hakikatin hakikati olduğu ve Tanrı'nın her şeyin içinde, taşıyabileceği ölçüde var olduğu, ilahlığın beş insanda ortaya çıktığı, birinin kaybolmasıyla yerine bir başkasının geçtiği ve onların düşmanları olan beş şeytanda da göründüğü yönündeydi. Böylece ilahlık, önce Adem ve İblis'te, sonra Nuh ve İblis'te, sonra Salih ve dişi devede, sonra İbrahim ve Nemrut'ta, sonra da Musa ve Firavun'da toplandı. {Kaynak: Kamil İbn el-Atir s. 218-219}"
  id: "Pada bulan Syawal tahun 322 H, Al-Shalmaghani muncul, sehingga menteri Ibnu Muqlah menangkapnya dan memenjarakannya. Rumahnya digeledah, dan di dalamnya ditemukan catatan dan surat-surat dari orang-orang yang beriman kepadanya, yang ditujukan kepadanya dengan cara yang tidak lazim bagi manusia untuk saling berbicara. Di antara mereka terdapat tulisan tangan Al-Husayn ibn Al-Qasim. Maka ia mengingkari ajarannya dan memeluk Islam serta menolak apa yang dikatakan tentangnya. Ia dan para sahabatnya dibawa berulang kali, bersama dengan para ahli hukum, hakim, penulis, dan pemimpin. Para ahli hukum mengeluarkan fatwa di hari-hari terakhir yang mengizinkan penumpahan darahnya, sehingga Ibnu Al-Shalmaghani dan Ibnu Abi Awn disalibkan pada bulan Dzul Qi'dah dan dibakar dengan api. Doktrinnya adalah bahwa ketuhanan adalah kebenaran dari Kebenaran, dan bahwa Tuhan bersemayam di dalam segala sesuatu sejauh yang dapat ditanggungnya, dan bahwa ketuhanan muncul dalam lima manusia, setiap kali salah satu menghilang, yang lain muncul menggantikannya, dan dalam lima setan yang merupakan musuh mereka. Demikianlah, ketuhanan terkumpul dalam Adam dan Iblis, kemudian dalam Nuh dan Iblis, kemudian dalam Salih dan unta betina, kemudian dalam Ibrahim dan Nimrod, kemudian dalam Musa dan Firaun. {cite:kamil-ibn-al-athir p. 218-219}."
