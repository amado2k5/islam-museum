label: { ar: "قتل الشلمغاني وابن أبي عون" }
summary:
  ar: "في شوال سنة 322هـ ظهر الشلمغاني فقبض عليه الوزير ابن مقلة وسجنه وكُشفت داره فوجدت فيها رقاع وكتب ممن يعتقد فيه يخاطبونه بما لا يخاطب به البشر بعضهم بعضاً وفيها خط الحسين بن القاسم، فأنكر مذهبه وأظهر الإسلام وتبرأ مما يقال فيه، وأُحضر هو وأصحابه مراراً ومعهم الفقهاء والقضاة والكتاب والنقباء فأفتى الفقهاء في آخر الأيام بإباحة دمه فصُلب ابن الشلمغاني وابن أبي عون في ذي القعدة وأُحرقا بالنار، وكان من مذهبه أن الإلهة بحقّ الحق وأن الله يحل في كل شيء على قدر ما يحتمل وأن اللاهوت ظهر في خمسة ناسوتية كلما غاب واحد ظهر مكانه آخر وفي خمسة أبالسة ضدود لهم فاجتمعت اللاهوتية في آدم وإبليس ثم في نوح وإبليس ثم في صالح وحائر الناقة ثم في إبراهيم ونمرود ثم في موسى وفرعون {cite:kamil-ibn-al-athir p. 218-219}."
  en: "In 322 Ibn Muqla seized al-Shalmaghani and found in his house notes from believers addressing him as no men address each other, including one in the vizier Ibn Wahb's hand; though he recanted, the jurists finally shed his blood and he and Ibn Abi Awn were crucified and burned. His doctrine: God indwells all things to their capacity, and the lahut appeared in five nasut figures paired with five devils — Adam/Iblis, Noah/Iblis, Salih and the she-camel's hamstringer, Abraham/Nimrod, Moses/Pharaoh {cite:kamil-ibn-al-athir p. 218-219}."
