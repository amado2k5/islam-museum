label: { ar: "فتوح قتيبة بيكند وبخارا وقتل نيزك", en: "Qutayba's Baykand, Bukhara and Nizak's Killing", es: "Baykand de Qutayba, Bukhara y el asesinato de Nizak", fr: "Baykand de Qutayba, Boukhara et meurtre de Nizak", ur: "قتیبہ کا بیکند، بخارا اور نزاق کا قتل", tr: "Kuteybe'nin Bikand ve Buhara'yı fethetmesi ve Nizak'ın öldürülmesi", id: "Penaklukan Bikand dan Bukhara oleh Qutaybah, dan pembunuhan Nizak" }
summary:
  ar: "غزا قتيبة بيكند سنة ٨٧ ومعه نيزك فقطع النهر من زم إلى بيكند وهي أدنى مدائن بخارا إلى النهر فغدروا واستنصروا السغد فقاتلهم وأغار عليهم وحصرهم فطلبوا الصلح ففتحها عنوة وغزا قتيبة تومشكت وكرمينية سنة ٨٨ واستخلف على مرو بشار بن مسلم أخاه فصالحهم وافتتح حصوناً صغاراً وغزا قتيبة بخارا ففتحها على صلح وقال أبو عبيدة معمر بن المثنى أتى قتيبة بخارا فاحترسوا منه فقال دعوني أدخلها فأصلي بها ركعتين فأذنوا له في ذلك فأكمن لهم قوماً فلما دخلوا كاثروا أهل الباب ودخلوا فأصاب فيها مالاً عظيماً وغدر بأهلها وأوقع قتيبة بالسغد وقتل نيزك بطخارستان وصلبه وافتتح كش ونسف وهي نخشب صلحاً. ويذكر الكتاب أن قتيبة بدأ بيكند من أعمال بخارى سنة 87هـ، وأن القتال طال حتى كتب الحجاج إلى الأمصار بالدعاء للجيش، ثم فتح بخارى بعد ثلاث سنين من الغزو المنتظم. {cite:salabi-umayyad-state-2020 p.90-91}"
  en: "In 87h Qutayba marched on Baykand with Nizak, crossing from Zamm — nearest of Bukhara's towns to the river — and when they betrayed and summoned Sughd he fought, raided and besieged till they sued: he took it by force. In 88h he campaigned Tumushkat and Karminiya, leaving brother Bashshar over Marw, then Bukhara, opened on sulh — Abu Ubayda's telling: they warded him till he begged 'let me enter and pray two rak'as', admitted, his hidden men overwhelmed the gate, he took great wealth and betrayed its folk. He struck the Sughd, killed Nizak in Tukharistan and crucified him, and opened Kish and Nasaf — Nakhshab — by sulh."
  es: "En el año 87 h, Qutayba marchó sobre Baykand con Nizak, cruzando desde Zamm —la ciudad más cercana de Bujará al río— y cuando traicionaron y convocaron a Sughd, luchó, saqueó y sitió hasta que lo demandaron: la tomó por la fuerza. En el año 88 h, hizo campaña en Tumushkat y Karminiya, dejando a su hermano Bashshar al mando de Marw, luego Bujará, abrió sulh —según el relato de Abu Ubayda—: lo protegieron hasta que suplicó «déjenme entrar y rezar dos rak'as», fue admitido, sus hombres ocultos desbordaron la puerta, tomó una gran riqueza y traicionó a su gente. Atacó a Sughd, mató a Nizak en Tukharistán y lo crucificó, y abrió Kish y Nasaf —Nakhshab— por sulh."
  fr: "En 87 de l'Hégire, Qutayba marcha sur Baykand avec Nizak, traversant le fleuve depuis Zamm, la ville la plus proche de Boukhara. Trahis et convoquant Sughd, il combattit, pilla et assiégea la ville jusqu'à ce qu'ils rendent le silence: il s'en empara par la force. En 88 de l'Hégire, il mena campagne contre Tumushkat et Karminiya, laissant son frère Bashshar aux commandes de Marw, puis Boukhara. Selon le récit d'Abu Ubayda, on le garda jusqu'à ce qu'il implore: « Laissez-moi entrer et prier deux rak'as ». Accepté, ses hommes cachés prirent d'assaut la porte, il s'empara d'immenses richesses et trahit ses habitants. Il attaqua Sughd, tua Nizak à Tukharistan et le crucifia, puis ouvrit Kish et Nasaf (Nakhshab) par la force."
  ur: "87ھ میں قطیبہ نے نزاک کے ساتھ بای قند کی طرف کوچ کیا، زم سے گزرتے ہوئے - بخارا کے قریبی قصبوں میں سے دریا تک - اور جب انہوں نے غداری کی اور صغد کو بلایا تو اس نے لڑائی کی، چھاپہ مارا اور محاصرہ کیا یہاں تک کہ انہوں نے مقدمہ کیا: اس نے اسے زبردستی لے لیا۔ 88ھ میں اس نے تمشقات اور کرمینیہ کی مہم چلائی، بھائی بشر کو مرو پر چھوڑ دیا، پھر بخارا، سلح پر کھولا گیا - ابو عبیدہ کا کہنا ہے کہ: انہوں نے اس کی حفاظت کی یہاں تک کہ اس نے منت کی کہ 'مجھے داخل ہونے دو اور دو رکعتیں پڑھنے دو'، تسلیم کیا، اس کے چھپے ہوئے آدمی دروازے پر غالب آگئے، اس نے بڑی دولت لے لی اور عوام کو دھوکہ دیا۔ اس نے سغد کو مارا، تخارستان میں نزاق کو قتل کیا اور اسے سولی پر چڑھایا، اور کش اور نخشب کو سلح سے کھول دیا۔"
  tr: "Kuteybe, 87 yılında Nizak ile birlikte Bikand'ı işgal etti. Zem'den Bikand'a nehri geçti; Bikand, Buhara'nın nehre en yakın şehirlerinden biridir. Bikandlılar ona ihanet edip Soğdlulardan yardım istediler, bu yüzden onlarla savaştı, baskınlar düzenledi ve kuşattı. Barış istediler, bu yüzden şehri zorla ele geçirdi. Kuteybe, 88 yılında Tumşakt ve Karminia'yı işgal etti ve kardeşi Beşar bin Müslim'i Merv'de vekili olarak atadı. Onlarla barış yaptı ve küçük kaleleri fethetti. Kuteybe, Buhara'yı işgal etti ve barış yoluyla fethetti. Ebu Ubeyde Muammer bin el-Muthanna şöyle dedi: Kuteybe Buhara'ya geldi, bu yüzden ondan şüphelendiler. \"İçeri girmeme izin verin, orada iki rekat namaz kılayım\" dedi. Bunun üzerine ona izin verdiler. Bunun üzerine onlar için bir grup insanı pusuya düşürdü. İçeri girdiklerinde, kapıdakilerden sayıca üstünlerdi ve içeri girdiler. Orada büyük bir zenginlik buldu ve halkına ihanet etti. Kuteybe, Soğdlulara saldırdı ve Tokharistan'da Nizak'ı öldürüp çarmıha gerdi. Kaş ve Nasaf'ı (Nahşab) barış yoluyla fethetti. Kitapta, Kuteybe'nin seferine Hicri 87 yılında Buhara yakınlarındaki Bikand'da başladığı ve savaşın o kadar uzun sürdüğü belirtiliyor ki, el-Haccac ordunun duaları için çeşitli bölgelere mektup yazdı. Buhara daha sonra üç yıllık sistematik bir işgalin ardından fethedildi. {cite:salabi-umayyad-state-2020 s.90-91}"
  id: "Qutaybah menyerang Bikand pada tahun 87, dan bersamanya ada Nizak. Ia menyeberangi sungai dari Zam ke Bikand, yang merupakan kota terdekat di Bukhara dengan sungai. Mereka mengkhianatinya dan meminta bantuan kepada kaum Sogdian, sehingga ia memerangi mereka, menyerang mereka, dan mengepung mereka. Mereka meminta perdamaian, sehingga ia menaklukkannya dengan kekerasan. Qutaybah menyerang Tumshakt dan Karminia pada tahun 88, dan ia menunjuk Bashar bin Muslim, saudaranya, sebagai wakilnya di Merv. Ia berdamai dengan mereka dan menaklukkan benteng-benteng kecil. Qutaybah menyerang Bukhara dan menaklukkannya dengan damai. Abu Ubaidah Muammar bin Al-Muthanna berkata: Qutaybah datang ke Bukhara, sehingga mereka waspada terhadapnya. Ia berkata: Izinkan saya masuk agar saya dapat shalat dua rakaat di sana. Maka mereka memberinya izin. Maka ia menyergap sekelompok orang untuk mereka. Ketika mereka masuk, jumlah mereka melebihi jumlah orang-orang di gerbang dan mereka berhasil masuk. Ia menemukan kekayaan besar di sana dan mengkhianati rakyatnya. Qutaybah menyerang kaum Sogdian dan membunuh Nizak di Tokharistan dan menyalibkannya. Ia menaklukkan Kash dan Nasaf, yang merupakan Nakhshab, dengan damai. Kitab tersebut menyatakan bahwa Qutaybah memulai kampanyenya di Bikand, dekat Bukhara, pada tahun 87 Hijriah, dan pertempuran berlangsung begitu lama sehingga al-Hajjaj menulis surat ke berbagai wilayah meminta doa untuk pasukan. Bukhara kemudian ditaklukkan setelah tiga tahun invasi sistematis. {cite:salabi-umayyad-state-2020 p.90-91}"
