label: { ar: "أمان أهل ضمالو ونقلهم إلى بغداد", en: "The Aman of Samalu and its People's Transfer to Baghdad" }
summary:
  ar: "عند البلاذري: أغزى المهدي ابنه هارون الرشيد سنة 163 فحاصر أهل ضمالو — وهي التي تدعوها العامة سمالو — فسألوه الأمان عشرة أهل بيوت فيهم القومس فأجابهم إلى ذلك وكان في شرطهم أن لا يفرق بينهم فأنزلوا ببغداد على باب الشماسية فسموا موضعهم سمالو فهو معروف، ويقال بل نزلوا على حكم المهدي فاستحياهم وجمعهم بذلك الموضع وأمر أن يسمى سمالوا؛ وأمر الرشيد فنودي على من بقي في الحصن فبيعوا وأخذ حبشي كان يشتم الرشيد والمسلمين فصلب على برج من أبراجه."
  en: "In al-Baladhuri: al-Mahdi sent his son Harun al-Rashid raiding in year 163 and he besieged the people of Damalu — which common speech calls Samalu — and they asked his aman, ten householders among them the qummis, which he granted on the condition that they not be separated, so they were settled in Baghdad at the Shammasiyya gate and named their quarter Samalu, which it is still known as; others say they came down on al-Mahdi's ruling — he spared them, gathered them at that spot and ordered it named Samalu; al-Rashid had those remaining in the fortress cried and sold, and an Abyssinian who used to curse al-Rashid and the Muslims was taken and crucified on one of its towers."
