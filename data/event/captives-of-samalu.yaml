label: { ar: "أمان أهل ضمالو ونقلهم إلى بغداد", en: "The Aman of Samalu and its People's Transfer to Baghdad", fr: "L'aman de Samalu et le transfert de ses habitants à Bagdad", es: "El Aman de Samalu y el traslado de su gente a Bagdad" }
summary:
  ar: "عند البلاذري: أغزى المهدي ابنه هارون الرشيد سنة 163 فحاصر أهل ضمالو — وهي التي تدعوها العامة سمالو — فسألوه الأمان عشرة أهل بيوت فيهم القومس فأجابهم إلى ذلك وكان في شرطهم أن لا يفرق بينهم فأنزلوا ببغداد على باب الشماسية فسموا موضعهم سمالو فهو معروف، ويقال بل نزلوا على حكم المهدي فاستحياهم وجمعهم بذلك الموضع وأمر أن يسمى سمالوا؛ وأمر الرشيد فنودي على من بقي في الحصن فبيعوا وأخذ حبشي كان يشتم الرشيد والمسلمين فصلب على برج من أبراجه."
  en: "In al-Baladhuri: al-Mahdi sent his son Harun al-Rashid raiding in year 163 and he besieged the people of Damalu — which common speech calls Samalu — and they asked his aman, ten householders among them the qummis, which he granted on the condition that they not be separated, so they were settled in Baghdad at the Shammasiyya gate and named their quarter Samalu, which it is still known as; others say they came down on al-Mahdi's ruling — he spared them, gathered them at that spot and ordered it named Samalu; al-Rashid had those remaining in the fortress cried and sold, and an Abyssinian who used to curse al-Rashid and the Muslims was taken and crucified on one of its towers."
  fr: "Chez al-Baladhuri : al-Mahdi envoya son fils Harun al-Rashid en expédition en l'an 163, et celui-ci assiégea les habitants de Damalu, que le parler commun appelle Samalu ; ils demandèrent son aman pour dix maisonnées, parmi lesquelles le qummis, qu'il leur accorda à condition qu'ils ne soient pas séparés ; ils furent donc installés à Bagdad à la porte de la Shammasiyya et donnèrent à leur quartier le nom de Samalu, sous lequel il est encore connu ; d'autres disent qu'ils se rendirent au jugement d'al-Mahdi, qui les épargna, les rassembla en ce lieu et ordonna qu'on le nomme Samalu ; al-Rashid fit crier à l'encan et vendre ceux qui restaient dans la forteresse, et un Abyssin qui injuriait al-Rashid et les musulmans fut pris et crucifié sur l'une de ses tours."
  es: "En al-Baladhuri: al-Mahdi envió a su hijo Harun al-Rashid a saquear en el año 163 y sitió a la gente de Damalu —que comúnmente se llama Samalu— y le pidieron a su aman, diez cabezas de familia entre ellos los qummis, lo cual él concedió con la condición de que no se separaran, así que se establecieron en Bagdad en la puerta de Shammasiyya y llamaron a su barrio Samalu, nombre con el que todavía se le conoce; otros dicen que descendieron por orden de al-Mahdi: él los perdonó, los reunió en ese lugar y ordenó que se llamara Samalu; al-Rashid hizo llorar y vender a los que quedaban en la fortaleza, y un abisinio que solía maldecir a al-Rashid y a los musulmanes fue capturado y crucificado en una de sus torres."
