id: event/prophets-vision-of-messiah-and-dajjal
class: event
kind: other
label:
  ar: "رؤيا النبي للمسيح والدجال عند الكعبة"
  en: "The Prophet's vision of the Messiah and the Dajjal at the Kaaba"
  ur: "کعبہ کے پاس نبی کا مسیح اور دجال کا خواب"
summary:
  ar: "رأى النبي عند الكعبة رجلاً آدم يطوف بها فقال إنه المسيح بن مريم، ثم رأى رجلاً جعد قطط أعور العين اليمنى فقال إنه المسيح الدجال {cite:muwatta-maruf-1997} [[passage/muwatta-31-2666|الموطأ 31:2666]]."
  en: "The Prophet saw at the Kaaba a man, ruddy, circuiting it, and was told he was the Messiah son of Mary; then he saw a curly, one-eyed man and was told he was the Messiah the Dajjal {cite:muwatta-maruf-1997} [[passage/muwatta-31-2666|Muwatta 31:2666]]."
  ur: "نبی نے کعبہ کے پاس ایک آدمی کو دیکھا جو اس کا طواف کر رہا تھا تو بتایا گیا وہ مریم کا بیٹا مسیح ہے؛ پھر اس نے گھنگریالے، ایک آنکھ والے آدمی کو دیکھا تو بتایا گیا وہ دجال مسیح ہے {cite:muwatta-maruf-1997} [[passage/muwatta-31-2666|موطأ 31:2666]]۔"
