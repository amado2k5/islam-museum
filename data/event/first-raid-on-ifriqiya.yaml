id: event/first-raid-on-ifriqiya
class: event
kind: campaign
label: { ar: "غزوة إفريقية الأولى وقتل بطريقها", en: "The First Raid on Ifriqiya and the Killing of Its Patrikios", es: "El primer ataque a Ifriqiya y la matanza de sus patricios", fr: "Le premier raid sur Ifriqiya et le massacre de ses Patrikios", ur: "افریقیہ پر پہلا چھاپہ اور اس کے پیٹرکیوس کا قتل" }
summary:
  ar: "عند البلاذري: لما ولّى عثمان عبد الله بن سعد بن أبي سرح مصر والمغرب بعث المسلمين في جرائد خيل فأصابوا من أطراف إفريقية وغنموا وكان عثمان متوقفاً عن غزوها ثم عزم عليه بعد أن استشار فيه وكتب إلى عبد الله في سنة سبع وعشرين — ويُقال ثمانٍ وعشرين ويُقال تسعٍ وعشرين — يأمره بغزوها وأمدّه بجيش عظيم فيه معبد بن العباس بن عبد المطلب ومروان بن الحكم بن أبي العاص بن أمية والحارث بن الحكم أخوه وعبد الله بن الزبير بن العوام والمسور بن مخرمة بن نوفل بن أهيب بن عبد مناف بن زهرة بن كلاب وعبد الرحمن بن زيد بن الخطاب وعبد الله بن عمر بن الخطاب وعاصم بن عمرو وعبيد الله بن عمر وعبد الرحمن بن أبي بكر وعبد الله بن عمرو بن العاص وبسر بن أبي أرطاة بن عويمر العامري وأبو ذؤيب خويلد بن خالد الهذلي الشاعر وبها توفي فقام بأمره ابن الزبير حتى واراه في لحده، وخرج في هذه الغزاة ممن حول المدينة من العرب خلق كثير. وقال عبد الله بن الزبير: أغزانا عثمان بن عفان إفريقية وكان بها بطريق سلطانه من أطرابلس إلى طنجة فسار عبد الله بن سعد بن أبي سرح حتى حلّ بمقوبة — وفي نسخة: يعقوبة — فقاتله أياماً فقتله الله وكنت أنا الذي قتلته وهرب جيشه فتمزقوا وبثّ ابن أبي سرح السرايا ففرقها في البلاد فأصابوا غنائم كثيرة واستاقوا من المواشي ما قدروا عليه فلما رأى ذلك عظماء إفريقية اجتمعوا فطلبوا إلى عبد الله بن سعد أن يأخذ منهم ثلاثمائة قنطار من ذهب على أن يكف عنهم ويخرج من بلادهم فقبل ذلك؛ وعن ابن كعب أن عبد الله بن سعد صالح بطريق إفريقية على ألفي ألف دينار وخمسمائة ألف دينار — وقال قدامة: قال الواقدي إن هذا الصلح بلغ ألفي ألف وخمسمائة ألف وعشرين ألفاً فدلّ على أن القنطار ثمانية آلاف وأربع مائة دينار. ولمّا صالح رجع إلى مصر ولم يولّ على إفريقية أحداً ولم يكن لها يومئذ قيروان ولا مصر جامع؛ وبإفريقية استشهد معبد بن العباس في هذه الغزاة — ويُقال مات في أيام القتال واستشهاده أثبت."
  en: "In al-Baladhuri: when Uthman gave Abdallah ibn Sa'd ibn Abi Sarh Egypt and the Maghreb he sent out light cavalry squadrons that struck Ifriqiya's outskirts and took spoil, Uthman hesitating over its conquest until he resolved upon consultation and wrote to Abdallah in year 27 — or 28 or 29 by other reports — ordering the raid, reinforcing him with a great army in which were Mu'bad ibn al-Abbas ibn Abd al-Muttalib, Marwan ibn al-Hakam ibn Abi al-As ibn Umayya and his brother al-Harith, Abdallah ibn al-Zubayr ibn al-Awwam, al-Musawwar ibn Makhrama ibn Nawfal ibn Uhayb ibn Abd Manaf ibn Zuhra ibn Kilab, Abd al-Rahman ibn Zayd ibn al-Khattab, Abdallah ibn Umar ibn al-Khattab, Asim ibn Umar, Ubaydallah ibn Umar, Abd al-Rahman ibn Abi Bakr, Abdallah ibn Amr ibn al-As, Busr ibn Abi Artat ibn Uwaymir al-Amiri, and Abu Dhu'ayb Khuwaylid ibn Khalid al-Hudhali the poet — who died there, Ibn al-Zubayr attending him till he laid him in his grave; and many Arabs from around Medina rode out in this raid. Abdallah ibn al-Zubayr said: Uthman ibn Affan sent us raiding to Ifriqiya, where a patrikios held sultanate from Tripoli to Tangier; Abdallah ibn Sa'd marched till he halted at Sbejtla — Yaquba in one copy — fighting him some days till God killed him — and it was I who killed him — his army fleeing in rout; Ibn Abi Sarh scattered sariyyas through the land taking great spoil and driving off what herds they could, whereupon Ifriqiya's grandees gathered and begged Abdallah ibn Sa'd to take three hundred qintar of gold for staying his hand and quitting their land, which he accepted; on Ibn Ka'b's report he compounded with Ifriqiya's patrikios for two million five hundred thousand dinars — Qudama noting al-Waqidi put the treaty at two million five hundred and twenty thousand, which shows the qintar at eight thousand four hundred dinars. The treaty done, he returned to Egypt appointing no governor over Ifriqiya — it had then no Qayrawan nor garrison city; and at Ifriqiya Mu'bad ibn al-Abbas was martyred in this raid — some say he died in the days of fighting, the martyrdom being firmer."
  es: "En al-Baladhuri: Cuando Uthman le dio a Abdallah ibn Sa'd ibn Abi Sarh Egipto y el Magreb, envió escuadrones de caballería ligera que atacaron las afueras de Ifriqiya y tomaron botín. Uthman dudó sobre su conquista hasta que resolvió tras consultarlo y escribió a Abdallah en el año 27 -o 28 o 29 según otros relatos- ordenando la incursión, reforzándolo con un gran ejército en el que estaban Mu'bad ibn al-Abbas ibn Abd al-Muttalib, Marwan ibn al-Hakam ibn Abi al-As ibn Umayya y su hermano al-Harith, Abdallah ibn al-Zubayr ibn al-Awwam, al-Musawwar ibn Makhrama ibn Nawfal ibn Uhayb ibn Abd Manaf ibn Zuhra ibn Kilab, Abd al-Rahman ibn Zayd ibn al-Khattab, Abdallah ibn Umar ibn al-Khattab, Asim ibn Umar, Ubaydallah ibn Umar, Abd al-Rahman ibn Abi Bakr, Abdallah ibn Amr ibn al-As, Busr ibn Abi Artat ibn Uwaymir al-Amiri y Abu Dhu'ayb Khuwaylid ibn Khalid al-Hudhali el poeta, quien murió allí, Ibn al-Zubayr lo atendió hasta que lo colocó en su tumba; y muchos árabes de los alrededores de Medina salieron en esta incursión. Abdallah ibn al-Zubayr dijo: Uthman ibn Affan nos envió a incursionar a Ifriqiya, donde un patricio tenía un sultanato desde Trípoli hasta Tánger; Abdallah ibn Sa'd marchó hasta que se detuvo en Sbejtla, Yaquba en una copia, luchando contra él algunos días hasta que Dios lo mató, y fui yo quien lo mató, su ejército huyendo en desbandada; Ibn Abi Sarh dispersó a los sariyyas por toda la tierra, apoderándose de un gran botín y ahuyentando los rebaños que podían. Entonces, los grandes de Ifriqiya se reunieron y rogaron a Abdallah ibn Sa'd que aceptara trescientos qintar de oro a cambio de que detuviera su mano y abandonara sus tierras, lo cual él aceptó. Según el informe de Ibn Ka'b, llegó a un acuerdo con los patricios de Ifriqiya por dos millones quinientos mil dinares. Qudama señala que al-Waqidi fijó el tratado en dos millones quinientos veinte mil, lo que indica que el qintar era de ocho mil cuatrocientos dinares. Una vez hecho el tratado, regresó a Egipto sin nombrar ningún gobernador para Ifriqiya, que entonces no tenía Qayrawan ni ciudad guarnición. En Ifriqiya, Mu'bad ibn al-Abbas fue martirizado durante esta incursión; algunos dicen que murió en los días de la lucha, siendo el martirio más firme."
  fr: "Dans al-Baladhuri: Lorsque Uthman donna l'Égypte et le Maghreb à Abdallah ibn Sa'd ibn Abi Sarh, celui-ci envoya des escadrons de cavalerie légère qui frappèrent les abords d'Ifriqiya et prirent du butin. Uthman hésita sur sa conquête jusqu'à ce qu'il se décide en consultation et écrivit à Abdallah en l'an 27 - ou 28 ou 29 selon d'autres rapports - ordonnant le raid, le renforçant avec une grande armée dans laquelle se trouvaient Mu'bad ibn al-Abbas ibn Abd al-Muttalib, Marwan ibn al-Hakam ibn Abi al-As ibn Umayya et son frère al-Harith, Abdallah ibn al-Zubayr. ibn al-Awwam, al-Musawwar ibn Makhrama ibn Nawfal ibn Uhayb ibn Abd Manaf ibn Zuhra ibn Kilab, Abd al-Rahman ibn Zayd ibn al-Khattab, Abdallah ibn Umar ibn al-Khattab, Asim ibn Umar, Ubaydallah ibn Umar, Abd al-Rahman ibn Abi Bakr, Abdallah Ibn Amr ibn al-As, Busr ibn Abi Artat ibn Uwaymir al-Amiri et Abu Dhu'ayb Khuwaylid ibn Khalid al-Hudhali, le poète, qui mourut là, Ibn al-Zubayr à ses côtés jusqu'à son inhumation. De nombreux Arabes des environs de Médine participèrent à ce raid. Abdallah ibn al-Zubayr raconta: « Uthman ibn Affan nous envoya piller Ifriqiya, où un patrikios détenait le sultanat de Tripoli à Tanger. Abdallah ibn Sa'd marcha jusqu'à s'arrêter à Sbejtla (Yaquba dans une autre version), le combattant pendant plusieurs jours jusqu'à ce que Dieu le tue, et c'est moi qui le tuai, son armée prenant la fuite. » Ibn Abi Sarh dissémina des sariyyas à travers le pays, emportant un butin considérable et faisant fuir les troupeaux qu'il put. Les notables d'Ifriqiya se réunirent alors et supplièrent Abdallah ibn Sa'd de leur accorder trois cents qintars d'or en échange de son renoncement et de son départ de leurs terres, ce qu'il accepta. Sur la déposition d'Ibn Ka'b, il conclut un accord avec les patrikios d'Ifriqiya pour deux millions cinq cent mille dinars. Qudama note qu'al-Waqidi a fixé le montant du traité à deux millions cinq cent vingt mille dinars, ce qui correspond à huit mille quatre cents dinars pour le qintar. Le traité conclu, il retourna en Égypte sans nommer de gouverneur pour Ifriqiya, qui ne possédait alors ni Qayrawan ni ville de garnison. C'est à Ifriqiya que Mu'bad ibn al-Abbas tomba en martyr lors de ce raid. Certains disent qu'il mourut au combat, mais le martyre est plus manifeste."
  ur: "البلادوری میں ہے: جب عثمان نے عبداللہ بن سعد ابن ابی سرح مصر اور مغرب کو دیا تو اس نے ہلکے گھڑسوار دستے بھیجے جو عفریقیہ کے مضافات پر حملہ کر کے مال غنیمت لے گئے۔ عثمان اس کی فتح کے بارے میں ہچکچاتے رہے یہاں تک کہ اس نے مشاورت سے فیصلہ کرلیا اور عبداللہ کو 27 یا 28 یا 29 میں لکھا اور دوسری خبروں کے مطابق چھاپے کا حکم دیتے ہوئے اسے ایک عظیم لشکر کے ساتھ تقویت بخشی جس میں معبد بن العباس ابن عبد المطلب، مروان ابن الحکم ابن العین اور اس کے بھائی تھے۔ الحارث، عبد اللہ بن الزبیر بن العوام، المسوار بن مخرمہ بن نوفل بن اُہیب ابن عبد مناف ابن زہرہ بن کلاب، عبدالرحمٰن بن زید بن الخطاب، عبد اللہ بن الخطاب بن عصام، عبد اللہ بن حارث بن الخطاب۔ عبیداللہ ابن عمر، عبد الرحمن بن ابی بکر، عبداللہ بن عمرو بن العاص، بسر بن ابی ارطات ابن عویمیر العمیری اور ابو ذویب خویلد بن خالد الحذلی شاعر - جو وہیں وفات پاگئے، ابن زید کی حاضری تک ان کا انتقال ہوا۔ اور مدینہ کے آس پاس کے بہت سے عرب اس دھاوے میں سوار ہو گئے۔ عبداللہ بن الزبیر نے کہا: عثمان بن عفان نے ہمیں افریقیہ پر چھاپہ مارنے کے لیے بھیجا، جہاں طرابلس سے تانگیر تک ایک پادریوں نے سلطنت کی۔ عبداللہ بن سعد نے کوچ کیا یہاں تک کہ وہ سبجتلہ پر رک گیا — یعقوبہ ایک نقل میں — کچھ دن اس سے لڑتا رہا یہاں تک کہ خدا نے اسے مار ڈالا — اور میں نے ہی اسے مار ڈالا — اس کی فوج شکست سے بھاگ رہی تھی۔ ابن ابی سرح نے بہت سارا مال غنیمت لے کر سارییوں کو زمین میں بکھیر دیا اور جو ریوڑ وہ کر سکتے تھے بھگا رہے تھے، اس پر عفریقیہ کے بزرگ جمع ہوئے اور عبداللہ بن سعد سے تین سو قنطار سونا مانگنے کی درخواست کی کہ وہ اپنا ہاتھ روکنے اور زمین چھوڑنے کے لیے تین سو قنطار سونا لے، جسے اس نے قبول کر لیا۔ ابن کعب کی رپورٹ پر اس نے عفریقیہ کے سرپرستوں کے ساتھ 20 لاکھ 5000 دینار کا معاہدہ کیا - قدامہ نے الواقدی کو نوٹ کرتے ہوئے اس معاہدے کو 20 لاکھ 500 اور 20 ہزار رکھا، جس سے قنطار آٹھ ہزار چار سو دینار ظاہر ہوتا ہے۔ معاہدہ ہوا، وہ مصر واپس آیا اور افریقیہ پر کوئی گورنر مقرر نہیں کیا - اس وقت اس کا کوئی قاروان تھا اور نہ ہی گیریژن شہر؛ اور عفریقیہ میں معبد بن العباس اس چھاپے میں شہید ہوئے - بعض کہتے ہیں کہ وہ لڑائی کے دنوں میں شہید ہوئے، شہادت زیادہ مضبوط تھی۔"
