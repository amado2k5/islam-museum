id: event/yawm-al-burdan
class: event
kind: battle
label: { ar: "يوم البردان", en: "The Day of al-Burdan", es: "El día de al-Burdan", fr: "Le jour d'al-Burdan", ur: "یوم البردان", tr: "soğuk gün", id: "hari yang dingin" }
summary:
  ar: "يوم من أيام العرب؛ أغار زياد بن الهبولة ملك الشام من سليح بن حلوان القضاعي على أهل حجر بن عمرو المعروف بآكل المرار ملك كندة وربيعة وهم خلوف إذ كانوا في غزوة على البحرين، فأخذ الحريم والأموال وسبى منهم هند بنت ظالم بن وهب، فعاد حجر وكندة وربيعة في طلبه فأدركوه بالبردان دون عين أباغ، ونزل حجر في سفح جبل ونزلت بكر وتغلب وكندة معه على ماء يقال له حفير؛ وفيها قصة تجسس سدوس بن شيبان بن ذهل وصليع بن عبد غنم على عسكر زياد، جاءا بحطب إلى القسمة على التمر فجلسا يتسمعان كلامه {cite:kamil-ibn-al-athir p. 377-378}."
  en: "The day of al-Burdan: Ziyad ibn al-Habula, the Salihid king of Syria, raided the tents of Hujr 'Akil al-Murar', king of Kinda and Rabi'a, while their men were away campaigning in Bahrayn, carrying off Hind bint Zalim among the captives; Hujr's host caught up with him at al-Burdan by Ayn Abagh — famous for the night-scouting of Sudus ibn Shayban and Sulay' ibn Abd Ghanm inside Ziyad's camp {cite:kamil-ibn-al-athir p. 377-378}."
  es: "El día de al-Burdan: Ziyad ibn al-Habula, rey salihid de Siria, asaltó las tiendas de Hujr 'Akil al-Murar', rey de Kinda y Rabi'a, mientras sus hombres estaban haciendo campaña en Bahrayn, llevándose entre los cautivos a Hind bint Zalim; el ejército de Hujr lo alcanzó en al-Burdan, cerca de Ayn Abagh, famoso por el reconocimiento nocturno de Sudus ibn Shayban y Sulay' ibn Abd Ghanm dentro del campamento de Ziyad {cite:kamil-ibn-al-athir p. 377-378}."
  fr: "Le jour d'al-Burdan: Ziyad ibn al-Habula, roi salhid de Syrie, attaqua les tentes de Hujr 'Akil al-Murar', roi de Kinda et Rabi'a, alors que ses hommes étaient en campagne à Bahrayn, emmenant Hind bint Zalim parmi les captifs; l'armée de Hujr le rattrapa à al-Burdan près d'Ayn Abagh — célèbre pour la reconnaissance nocturne de Sudus ibn Shayban et Sulay' ibn Abd Ghanm à l'intérieur du camp de Ziyad {cite:kamil-ibn-al-athir p. 377-378}."
  ur: "البردان کا دن: شام کے صالح بادشاہ زیاد بن الحبولہ نے کندہ اور ربیعہ کے بادشاہ حجر عقیل المرار کے خیموں پر چھاپہ مارا، جب کہ ان کے آدمی بحرین میں مہم چلا رہے تھے، ہند بنت ظالم کو قیدیوں میں سے لے جا رہے تھے۔ حجر کے میزبان نے عین اباغ کے ذریعہ البردان میں اس کے ساتھ ملاقات کی - جو زیاد کے کیمپ کے اندر سدوس ابن شیبان اور سلیٰ ابن عبد غنم کی رات کو تلاش کرنے کے لئے مشہور ہے۔ 377-378}۔"
  tr: "Bir gün, Suriye kralı, Sulayh ibn Halwan al-Quda’i kabilesinden Ziyad ibn al-Habula, Bahreyn'e baskın düzenledikleri sırada Kinda ve Rabi’a kralı Hajar ibn Amr (Akil al-Murar olarak da bilinir) halkına baskın düzenledi. Kadınları ve parayı ele geçirdi ve Hind bint Zalim ibn Wahb'ı esir aldı. Hajar, Kinda ve Rabi’a onu takip ederek Ain Abagh’ın altındaki al-Bardan’da ona yetiştiler. Hajar bir dağın eteğinde kamp kurdu, Bakr, Taghlib ve Kinda ise Hafir denilen bir su kaynağında onunla birlikte kamp kurdular. Bu günde, Sadus ibn Shayban ibn Dhuhl ve Sali’ ibn Abd Ghanm’ın Ziyad’ın ordusunu gözetledikleri rivayet edilir. Hurma dağıtımına odun getirip onun konuşmasını dinlediler. {cite:kamil-ibn-al-athir s. 377-378}"
  id: "Suatu hari, Ziyad ibn al-Habula, raja Suriah, dari suku Sulayh ibn Halwan al-Quda’i, menyerang kaum Hajar ibn Amr, yang dikenal sebagai Akil al-Murar, raja Kinda dan Rabi’a, ketika mereka sedang melakukan penyerangan ke Bahrain. Ia merampas para wanita dan uang serta menawan Hind bint Zalim ibn Wahb. Hajar, Kinda, dan Rabi’a kembali mengejarnya dan berhasil menangkapnya di al-Bardan, di bawah Ain Abagh. Hajar berkemah di kaki gunung, dan Bakr, Taghlib, dan Kinda berkemah bersamanya di tempat minum yang disebut Hafir. Pada hari ini, ada kisah tentang Sadus ibn Shayban ibn Dhuhl dan Sali’ ibn Abd Ghanm yang memata-matai pasukan Ziyad. Mereka membawa kayu bakar untuk pembagian kurma dan duduk mendengarkan percakapannya. {mengutip: kamil-ibn-al-athir hal. 377-378}"
