  ar: "نزل البيروني بلاط قابوس بن وشمكير بجرجان على بحر قزوين، فلقي هناك ابن سينا ودار بينهما مراسلات فلسفية، وأهدى إلى قابوس كتابه «الآثار الباقية عن القرون الخالية» {cite:britannica-al-biruni}."
  en: "At Gurgān near the Caspian al-Bīrūnī joined Qābūs ibn Voshmgīr's court, met Ibn Sīnā there and exchanged a sharp philosophical correspondence with him, and dedicated his Chronology of Ancient Nations to Qābūs {cite:britannica-al-biruni}."
  ur: "بحیرہ خزر کے کنارے جرجان میں بیرونی قابوس بن وشمگیر کے دربار میں رہا، وہاں ابن سینا سے ملا اور اس سے فلسفیانہ مکاتبہ ہوئی، اور اپنی آثار الباقیہ قابوس کے نام کی {cite:britannica-al-biruni}."
