summary:
  ar: "سبب احتلال الروس لأدرنة في الأعوام 1878-1879م مزيداً من الدمار للمدينة؛ فقد جرّد الروس أثناء احتلالهم جامع يلدريم من خزفه وحلقتيه الرخاميتين، وأخذوا زخارف جامع السليمية {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}."
  en: "The Russian occupation of Edirne in 1878-9 caused further devastation to the city: during their occupation the Russians stripped the Yıldırım mosque of its tiles and the two linked marble rings that gave it the name Küpeli Cami, and took away the tiles of the Selimiye's royal gallery {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}."
  ur: "1878-79ء میں ادرنہ کا روسی قبضہ شہر کے لیے مزید تباہی کا سبب بنا؛ قبضے کے دوران روسیوں نے یلدرم مسجد کی کاشی کاری اور سنگِ مرمر کی دو جوڑی حلقیاں اتار لیں اور سلیمیہ کی شاہی مقصورہ کی کاشی کاری بھی لے گئے {cite:encyclopaedia-of-islam-2 vol. 2 p. 712}۔"
