label: { ar: "هلاك حجاج الخراسانية بالعطش 357هـ", en: "The Khurasani pilgrimage destroyed by thirst, 357", es: "La peregrinación de Jorasán fue destruida por la sed, 357", fr: "Le pèlerinage du Khorasani détruit par la soif, 357", ur: "خراسانی زیارت پیاس سے تباہ، 357" }
summary:
  ar: "في سنة سبع وخمسين وثلثمائة ورد خبر الحاج بأن أكثر أهل الخراسانية هلكوا وهلكت جمالهم بالعطش، ومن سلم منهم وهم الأقل لم يلحق يوم عرفة ولم يتم لهم الحج؛ ولم يرد من مصر غير الإمام ونفر يسير معه، ولم يحج من أهل الشام أحد {cite:muntazam-ibn-al-jawzi j.7 p.43}."
  en: "In 357 word came of the pilgrimage: most of the Khurasani caravan perished of thirst with their camels, the few survivors missed 'Arafa and did not complete the hajj; from Egypt came only the amir with a handful, and no one from Syria made the pilgrimage {cite:muntazam-ibn-al-jawzi j.7 p.43}."
  es: "En el año 357 llegaron noticias de la peregrinación: la mayor parte de la caravana de Jorasán pereció de sed junto con sus camellos, los pocos supervivientes no llegaron a Arafa y no completaron el Hajj; de Egipto solo llegó el emir con un puñado de personas, y nadie de Siria hizo la peregrinación {cite:muntazam-ibn-al-jawzi j.7 p.43}."
  fr: "En 357, la nouvelle du pèlerinage parvint: la plupart des caravanes du Khorasan périrent de soif avec leurs chameaux, les quelques survivants manquèrent 'Arafa et ne purent achever le hajj; d'Égypte, seul l'émir vint avec une poignée de personnes, et personne de Syrie ne fit le pèlerinage {cite: muntazam-ibn-al-jawzi j.7 p.43}."
  ur: "357 میں حج کا لفظ آیا: زیادہ تر خراسانی قافلہ اپنے اونٹوں سمیت پیاس سے ہلاک ہو گئے، چند بچ جانے والے عرفہ سے محروم ہو گئے اور حج مکمل نہیں کیا۔ مصر سے صرف ایک مٹھی بھر امیر آیا اور شام سے کسی نے حج نہیں کیا۔"
