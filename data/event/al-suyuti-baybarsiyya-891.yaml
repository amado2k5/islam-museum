id: event/al-suyuti-baybarsiyya-891
class: event
kind: other
label:
  ar: "السيوطي يتولى البيبرسية ويبدأ اعتزاله، ٨٩١هـ/١٤٨٦م"
  en: "Al-Suyuti takes charge of the Baybarsiyya and begins to withdraw, 891/1486"
  ur: "سیوطی کا بیبرسیہ کی ذمہ داری اور عزلت کا آغاز، 891ھ/1486ء"
summary:
  ar: "من سنة ٨٩١هـ/١٤٨٦م تولى السيوطي أيضاً النظر على خانقاه البيبرسية، وهو في نحو الأربعين من عمره حين قرر الاعتزال عن الحياة العامة؛ فترك وظائفه تدريجاً وأمسك عن الإفتاء، متعللاً بفساد أوساط العلماء وجهلهم، وتوتّرت في الوقت نفسه علاقته بالسلطان قايتباي إذ أبى زيارته في أول كل شهر {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  en: "From 891/1486 al-Suyuti was also placed in charge of the Baybarsiyya khankah. About forty years old, he decided to retire from public life: he progressively resigned his functions and stopped delivering fatwas, giving as reasons the corruption and ignorance in the milieu of the ʿulamaʾ. At the same time his relations with Sultan Qa’it Bay grew acrimonious, for he refused to pay the customary monthly visit to the ruler {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}."
  ur: "891ھ/1486ء سے سیوطی کو بیبرسیہ خانقاہ کی ذمہ داری بھی ملی۔ تقریباً چالیس سال کی عمر میں انہوں نے عوامی زندگی سے کنارہ کشی کا فیصلہ کیا: آہستہ آہستہ اپنے مناصب چھوڑ دیے اور فتاوے دینا بند کر دیا، اس کی وجہ علما کے حلقے میں فساد اور جہالت بتائی۔ اسی دوران سلطان قایتبائے سے ان کے تعلقات خراب ہو گئے کیونکہ انہوں نے ہر ماہ سلطان کی زیارت سے انکار کر دیا {cite:encyclopaedia-of-islam-2 vol. 9 p. 914}۔"
