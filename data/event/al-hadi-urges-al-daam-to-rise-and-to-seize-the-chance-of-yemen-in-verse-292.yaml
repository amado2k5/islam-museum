id: event/al-hadi-urges-al-daam-to-rise-and-to-seize-the-chance-of-yemen-in-verse-292
class: event
kind: other
label:
  ar: "أبيات للهادي يحث فيها الدعام على النهوض واغتنام فرصة اليمن ويذكر مواقف همدان مع علي في صفين والنهروان وينهاه عن الموالاة، ص321-322"
  en: "Verses of al-Hadi urging al-Da'am to rise and seize the chance of Yemen, recalling Hamdan's stands with Ali at Siffin and Nahrawan and warning against allegiance to others, pp. 321-322"
  ur: "ہادی کے اشعار جن میں وہ دعام کو اٹھنے اور یمن کا موقع غنیمت جاننے کی ترغیب دیتا ہے، صفین اور نہروان میں علی کے ساتھ ہمدان کے مواقف یاد کرتا ہے اور دوسروں کی موالات سے روکتا ہے، ص321-322"
  es: "Versos de al-Hadi instando a al-Da'am a levantarse y aprovechar la oportunidad de Yemen, recordando la postura de Hamdan junto a Ali en Siffin y Nahrawan y advirtiendo contra la lealtad a otros, págs. 321-322"
summary:
  ar: "قصيدة من البسيط تحت العنوان «وله أيضاً» في أسفل ص321 وص322 يخاطب فيها الهادي «يا دعام»: يقول له انهض فقد أمكنتنا فرصة اليمن، ويذكر فضائل سلفه ومواقفهم مع علي يوم صفين والنهروان، ويحثه على اغتنام الأمر ما دامت الروح في البدن وعلى الاجتهاد في نصر الدين، ثم يقول إن إصلاح الدين لا يكون بموالاة ابن الأعجمي ولا لابني علي ولو أُرغب في الثمن، بل بإخلاص قلب خائف وجل."
  en: "A poem in the basit metre under the heading \"and also of his\" at the foot of p. 321 and on p. 322, in which al-Hadi addresses \"O Da'am\": he tells him to rise, for the chance of Yemen is within reach, recalls the virtues of his forebears and their stands with Ali at Siffin and Nahrawan, urges him to seize the matter while the spirit is in his body and to strive in aid of the religion, and says religion is not set right by allegiance to Ibn al-Ajami or to the two sons of Ali, even if tempted with a price, but by a sincere, fearing heart."
  ur: "بسیط بحر کی نظم، عنوان «اور اس کا یہ بھی» کے تحت ص321 کے آخر اور ص322 پر، جس میں ہادی «اے دعام» کہہ کر مخاطب ہوتا ہے: اسے کہتا ہے اٹھ، یمن کا موقع ہمارے ہاتھ آ گیا ہے، اس کے اسلاف کی خوبیاں اور صفین اور نہروان کے دنوں میں علی کے ساتھ ان کے مواقف یاد کرتا ہے، اسے ترغیب دیتا ہے کہ جب تک روح بدن میں ہے معاملے کو غنیمت جانے اور دین کی نصرت میں جان لگائے، اور کہتا ہے کہ دین کی اصلاح ابن الاعجمی یا علی کے دو بیٹوں کی موالات سے نہیں ہوتی چاہے قیمت کا لالچ دیا جائے، بلکہ خوف رکھنے والے مخلص دل سے ہوتی ہے۔"
  es: "Un poema en metro basalto bajo el título \"y también de él\" al pie de la página 321 y en la página 322, en el que al-Hadi se dirige a \"Oh Da'am\": le dice que se levante, porque la oportunidad de Yemen está a su alcance, recuerda las virtudes de sus antepasados y su posición con Ali en Siffin y Nahrawan, lo insta a aprovechar el asunto mientras el espíritu está en su cuerpo y a esforzarse en ayuda de la religión, y dice que la religión no se corrige por la lealtad a Ibn al-Ajami o a los dos hijos de Ali, incluso si se les tienta con un precio, sino por un corazón sincero y temeroso."
