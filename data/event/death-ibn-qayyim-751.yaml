id: event/death-ibn-qayyim-751
class: event
kind: death
label:
  ar: "وفاة ابن قيم الجوزية بدمشق ودفنه بمقبرة باب الصغير، رجب ٧٥١هـ/١٣٥٠م"
  en: "Death of Ibn Qayyim al-Jawziyya at Damascus, buried at Bab al-Saghir, Rajab 751/1350"
  ur: "ابن قیم الجوزیہ کی وفات، دمشق، تدفین باب صغیر، رجب 751ھ/1350ء"
  es: "Muerte de Ibn Qayyim al-Jawziyya en Damasco, enterrado en Bab al-Saghir, Rajab 751/1350"
  fr: "Décès d'Ibn Qayyim al-Jawziyya à Damas, inhumé à Bab al-Saghir, Rajab 751/1350"
  tr: "İbn Kayyim el-Cevziyye Şam'da öldü ve Bab el-Sagir mezarlığına gömüldü, Receb 751 H./1350"
  id: "Ibnu Qayyim al-Jawziyya wafat di Damaskus dan dimakamkan di pemakaman Bab al-Saghir, Rajab 751 H/1350 M."
summary:
  ar: "توفّي شمس الدين ابن قيم الجوزية بدمشق في ثالث عشر شهر رجب سنة ٧٥١هـ، وكانت جنازته حافلة جداً {cite:durar-kamina-jil-1993 3/403}؛ وذكرت دائرة المعارف الإسلامية وفاته في ٢٣ رجب ٧٥١هـ/٢٦ سبتمبر ١٣٥٠م، وأنه دُفن إلى جانب أمه في مقبرة باب الصغير، وخلفه ابنه جمال الدين عبد الله ⁦(ت. ٧٥٦هـ)⁩ في التدريس بالصدرية {cite:encyclopaedia-of-islam-2 vol. 3 p. 855}."
  en: "Shams al-Din Ibn Qayyim al-Jawziyya died at Damascus on 13 Rajab 751, and his funeral was very crowded {cite:durar-kamina-jil-1993 3/403}. The Encyclopaedia of Islam gives the variant 23 Rajab 751/26 September 1350 and adds that he was buried beside his mother in the Bab al-Saghir cemetery; his son Jamal al-Din Abd Allah (d. 756) succeeded him in teaching at the Sadriyya {cite:encyclopaedia-of-islam-2 vol. 3 p. 855}."
  ur: "شمس الدین ابن قیم الجوزیہ 13 رجب 751ھ کو دمشق میں فوت ہوئے اور ان کا جنازہ نہایت بڑا تھا {cite:durar-kamina-jil-1993 3/403}۔ دائرة المعارف الاسلامية نے وفات 23 رجب 751ھ/26 ستمبر 1350ء لکھی ہے اور بتایا ہے کہ وہ اپنی والدہ کے پاس باب صغیر کی قبرستان میں دفن ہوئے؛ ان کے بیٹے جمال الدین عبد اللہ ⁦(وفات 756ھ)⁩ صدریہ میں ان کے جانشین ہوئے {cite:encyclopaedia-of-islam-2 vol. 3 p. 855}۔"
  es: "Shams al-Din Ibn Qayyim al-Jawziyya murió en Damasco el 13 de Rajab de 751, y su funeral fue muy concurrido {cite:durar-kamina-jil-1993 3/403}. La Enciclopedia del Islam da la variante 23 de Rajab de 751/26 de septiembre de 1350 y añade que fue enterrado junto a su madre en el cementerio de Bab al-Saghir; su hijo Jamal al-Din Abd Allah (m. 756) le sucedió en la enseñanza en la Sadriyya {cite:encyclopaedia-of-islam-2 vol. 3 p. 855}."
  fr: "Shams al-Din Ibn Qayyim al-Jawziyya mourut à Damas le 13 Rajab 751, et ses funérailles furent suivies d'une foule immense (voir: durar-kamina-jil-1993 3/403). L'Encyclopédie de l'Islam donne la variante du 23 Rajab 751/26 septembre 1350 et précise qu'il fut inhumé auprès de sa mère au cimetière de Bab al-Saghir; son fils Jamal al-Din Abd Allah (mort en 756) lui succéda à la tête de l'enseignement à la Sadriyya (voir: encyclopaedia-of-islam-2 vol. 3 p. 855)."
  tr: "Şemseddin İbn Kayyim el-Cevziyye, Hicri 751 yılının Receb ayının on üçüncü gününde Şam'da vefat etti ve cenazesi çok büyük bir törenle yapıldı. {cite:durar-kamina-jil-1993 3/403}. İslam Ansiklopedisi, onun ölüm tarihini Hicri 751 yılının Receb ayının 23. günü/Miladi 1350 yılının 26 Eylül'ü olarak belirtmiş ve Bab el-Sağrir mezarlığında annesinin yanına defnedildiğini, oğlu Cemaleddin Abdullah'ın (ö. Hicri 756) Sadriyah'ta onun yerine öğretim görevini üstlendiğini kaydetmiştir. {cite:encyclopaedia-of-islam-2 vol. 3 p. 855}."
  id: "Shams al-Din Ibn Qayyim al-Jawziyya wafat di Damaskus pada tanggal 13 Rajab tahun 751 H, dan pemakamannya sangat besar {cite:durar-kamina-jil-1993 3/403}. Ensiklopedia Islam menyebutkan kematiannya pada tanggal 23 Rajab 751 H/26 September 1350 M, dan bahwa ia dimakamkan di samping ibunya di pemakaman Bab al-Saghir, dan putranya Jamal al-Din Abdullah (wafat 756 H) menggantikannya dalam mengajar di Sadriyah {cite:encyclopaedia-of-islam-2 vol. 3 p. 855}."
