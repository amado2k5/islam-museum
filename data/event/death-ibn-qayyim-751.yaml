id: event/death-ibn-qayyim-751
class: event
kind: death
label:
  ar: "وفاة ابن قيم الجوزية بدمشق ودفنه بمقبرة باب الصغير، رجب ٧٥١هـ/١٣٥٠م"
  en: "Death of Ibn Qayyim al-Jawziyya at Damascus, buried at Bab al-Saghir, Rajab 751/1350"
  ur: "ابن قیم الجوزیہ کی وفات، دمشق، تدفین باب صغیر، رجب 751ھ/1350ء"
summary:
  ar: "توفّي شمس الدين ابن قيم الجوزية بدمشق في ثالث عشر شهر رجب سنة ٧٥١هـ، وكانت جنازته حافلة جداً {cite:durar-kamina-jil-1993 3/403}؛ وذكرت دائرة المعارف الإسلامية وفاته في ٢٣ رجب ٧٥١هـ/٢٦ سبتمبر ١٣٥٠م، وأنه دُفن إلى جانب أمه في مقبرة باب الصغير، وخلفه ابنه جمال الدين عبد الله (ت. ٧٥٦هـ) في التدريس بالصدرية {cite:encyclopaedia-of-islam-2 vol. 3 p. 855}."
  en: "Shams al-Din Ibn Qayyim al-Jawziyya died at Damascus on 13 Rajab 751, and his funeral was very crowded {cite:durar-kamina-jil-1993 3/403}. The Encyclopaedia of Islam gives the variant 23 Rajab 751/26 September 1350 and adds that he was buried beside his mother in the Bab al-Saghir cemetery; his son Jamal al-Din Abd Allah (d. 756) succeeded him in teaching at the Sadriyya {cite:encyclopaedia-of-islam-2 vol. 3 p. 855}."
  ur: "شمس الدین ابن قیم الجوزیہ 13 رجب 751ھ کو دمشق میں فوت ہوئے اور ان کا جنازہ نہایت بڑا تھا {cite:durar-kamina-jil-1993 3/403}۔ دائرة المعارف الاسلامية نے وفات 23 رجب 751ھ/26 ستمبر 1350ء لکھی ہے اور بتایا ہے کہ وہ اپنی والدہ کے پاس باب صغیر کی قبرستان میں دفن ہوئے؛ ان کے بیٹے جمال الدین عبد اللہ (وفات 756ھ) صدریہ میں ان کے جانشین ہوئے {cite:encyclopaedia-of-islam-2 vol. 3 p. 855}۔"
