id: event/abu-dawud-kufa-damascus-221
class: event
kind: other
label:
  ar: "أبو داود بالكوفة ٢٢١هـ وبدمشق ٢٢٢هـ"
  en: "Abu Dawud at Kufa, 221/836, and Damascus, 222/837"
  fr: "Abu Dawud à Koufa, 221/836, et à Damas, 222/837"
  ur: "ابو داؤد کوفہ میں 221ھ/836ء اور دمشق میں 222ھ/837ء"
  es: "Abu Dawud en Kufa, 221/836, y Damasco, 222/837"
  tr: "Ebu Davud, Hicri 221 yılında Kufe'de, Hicri 222 yılında ise Şam'daydı."
  id: "Abu Dawud berada di Kufa pada tahun 221 H dan di Damaskus pada tahun 222 H."
summary:
  ar: "قال أبو عيسى الأزرق: سمعت أبا داود يقول: دخلت الكوفة سنة إحدى وعشرين ومضيت إلى منزل عمر بن حفص فلم يُقضَ لي السماع منه؛ وقال أبو داود: دخلت دمشق سنة اثنتين وعشرين {cite:tarikh-islam-dhahabi pp. 358, 362}. وسمع بالكوفة من الحسن بن الربيع البوراني وأحمد بن يونس اليربوعي وطائفة، وبدمشق من صفوان بن صالح وهشام بن عمار وطائفة {cite:tarikh-islam-dhahabi p. 359}."
  en: "Abu 'Isa al-Azraq heard him say: I entered Kufa in the year twenty-one and went to 'Umar ibn Hafs's house but was not granted a hearing; and Abu Dawud said: I entered Damascus in the year twenty-two {cite:tarikh-islam-dhahabi pp. 358, 362}. At Kufa he heard al-Hasan ibn al-Rabi' al-Burani, Ahmad ibn Yunus al-Yarbu'i and a circle of others, and at Damascus Safwan ibn Salih, Hisham ibn 'Ammar and a circle of others {cite:tarikh-islam-dhahabi p. 359}."
  fr: "Abu Isa al-Azraq l’entendit dire : je suis entré à Koufa en l’année vingt et un et suis allé chez Umar ibn Hafs sans obtenir d’audition ; Abu Dawud dit aussi : je suis entré à Damas en l’année vingt-deux {cite:tarikh-islam-dhahabi pp. 358, 362}. À Koufa, il écouta al-Hasan ibn al-Rabi' al-Burani, Ahmad ibn Yunus al-Yarbu'i et un cercle d’autres maîtres ; à Damas, Safwan ibn Salih, Hisham ibn Ammar et un cercle d’autres maîtres {cite:tarikh-islam-dhahabi p. 359}."
  ur: "ابو عیسیٰ ازرق نے ان سے سنا: میں نے 221ھ میں کوفہ داخل ہوا اور عمر بن حفص کے گھر گیا مگر سماعت نہ ہوئی؛ اور ابو داؤد نے کہا: میں 222ھ میں دمشق داخل ہوا {cite:tarikh-islam-dhahabi pp. 358, 362}۔ کوفہ میں انہوں نے حسن بن ربیع بورانی، احمد بن یونس یربوعی اور ایک جماعت سے، اور دمشق میں صفوان بن صالح، ہشام بن عمار اور ایک جماعت سے سماعت کی {cite:tarikh-islam-dhahabi p. 359}۔"
  es: "Abu 'Isa al-Azraq le oyó decir: Entré en Kufa en el año veintiuno y fui a la casa de 'Umar ibn Hafs, pero no me concedieron una audiencia; y Abu Dawud dijo: Entré en Damasco en el año veintidós {cite:tarikh-islam-dhahabi pp. 358, 362}. En Kufa oyó a al-Hasan ibn al-Rabi' al-Burani, Ahmad ibn Yunus al-Yarbu'i y un círculo de otros, y en Damasco a Safwan ibn Salih, Hisham ibn 'Ammar y un círculo de otros {cite:tarikh-islam-dhahabi p. 359}."
  tr: "Ebu İsa el-Azrak şöyle dedi: Ebu Davud'un şöyle dediğini işittim: 21. yılda Kufe'ye girdim ve Ömer ibn Hafs'ın evine gittim, fakat ondan bir şey duyamadım. Ebu Davud şöyle dedi: 22. yılda Şam'a girdim. Kufe'de Hasan ibn el-Rabi' el-Burani, Ahmed ibn Yunus el-Yarbu'i ve bir grup başkasından, Şam'da ise Safvan ibn Salih, Hişam ibn Ammar ve bir grup başkasından haber aldım."
  id: "Abu Isa al-Azraq berkata: Aku mendengar Abu Dawud berkata: Aku memasuki Kufa pada tahun 21 dan pergi ke rumah Umar ibn Hafs, tetapi aku tidak dapat mendengar kabar darinya. Abu Dawud berkata: Aku memasuki Damaskus pada tahun 22. Ia mendengar kabar di Kufa dari al-Hasan ibn al-Rabi’ al-Burani, Ahmad ibn Yunus al-Yarbu’i, dan sekelompok orang lainnya, dan di Damaskus dari Safwan ibn Salih, Hisham ibn Ammar, dan sekelompok orang lainnya."
