label:
  ar: "أبو داود بالكوفة ٢٢١هـ وبدمشق ٢٢٢هـ"
  en: "Abu Dawud at Kufa, 221/836, and Damascus, 222/837"
  ur: "ابو داؤد کوفہ میں 221ھ/836ء اور دمشق میں 222ھ/837ء"
summary:
  ar: "قال أبو عيسى الأزرق: سمعت أبا داود يقول: دخلت الكوفة سنة إحدى وعشرين ومضيت إلى منزل عمر بن حفص فلم يُقضَ لي السماع منه؛ وقال أبو داود: دخلت دمشق سنة اثنتين وعشرين {cite:tarikh-islam-dhahabi pp. 358, 362}. وسمع بالكوفة من الحسن بن الربيع البوراني وأحمد بن يونس اليربوعي وطائفة، وبدمشق من صفوان بن صالح وهشام بن عمار وطائفة {cite:tarikh-islam-dhahabi p. 359}."
  en: "Abu 'Isa al-Azraq heard him say: I entered Kufa in the year twenty-one and went to 'Umar ibn Hafs's house but was not granted a hearing; and Abu Dawud said: I entered Damascus in the year twenty-two {cite:tarikh-islam-dhahabi pp. 358, 362}. At Kufa he heard al-Hasan ibn al-Rabi' al-Burani, Ahmad ibn Yunus al-Yarbu'i and a circle of others, and at Damascus Safwan ibn Salih, Hisham ibn 'Ammar and a circle of others {cite:tarikh-islam-dhahabi p. 359}."
  ur: "ابو عیسیٰ ازرق نے ان سے سنا: میں نے 221ھ میں کوفہ داخل ہوا اور عمر بن حفص کے گھر گیا مگر سماعت نہ ہوئی؛ اور ابو داؤد نے کہا: میں 222ھ میں دمشق داخل ہوا {cite:tarikh-islam-dhahabi pp. 358, 362}۔ کوفہ میں انہوں نے حسن بن ربیع بورانی، احمد بن یونس یربوعی اور ایک جماعت سے، اور دمشق میں صفوان بن صالح، ہشام بن عمار اور ایک جماعت سے سماعت کی {cite:tarikh-islam-dhahabi p. 359}۔"
