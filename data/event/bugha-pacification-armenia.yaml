id: event/bugha-pacification-armenia
class: event
kind: campaign
label: { ar: "إصلاح بُغا الكبير ثغر أرمينية", en: "Bugha al-Kabir's Pacification of the Armenian March", fr: "La pacification de la marche arménienne par Bugha al-Kabir", es: "La pacificación de la marcha armenia por Bugha al-Kabir", ur: "بگھا الکبیر کا آرمینیائی مارچ کا امن", tr: "Büyük Bugha, Ermenistan sınırını onardı.", id: "Bugha Agung memperbaiki perbatasan Armenia." }
summary:
  ar: "عند البلاذري: ولّى المتوكل بُغا الكبير أرمينية فلما صار إلى بذليس أخذ موسى بن زرارة وكان ممن هويَ قتل يوسف وأعان عليه غضباً لبقراط وحارب الخويثية فقتل منهم مقتلة عظيمة وسبى سبياً كثيراً ثم حاصر أشوط بن حمزة بن جاجق بطريق البسفرّجان وهو بالباق فاستنزله من قلعته وحمله إلى سر من رأى وسار إلى جرزان فظفر إسحاق بن إسماعيل فقتله صبراً وفتح جرزان وحمل من بأرّان وظاهر أرمينية من بالسيسجان من أهل الخلاف والمعصية من النصارى وغيرهم حتى صلح ذلك الثغر صلاحاً لم يكن على مثله ثم قدم سرّ من رأى في سنة إحدى وأربعين ومائتين."
  en: "In al-Baladhuri: al-Mutawakkil gave Armenia to Bugha al-Kabir, who at Badhlis seized Musa ibn Zurara — one who had favoured Yusuf's killing and aided it in anger for Buqrat — warred on the Khwaythiyya, slaying a great slaughter and taking many captives, then besieged Ashut ibn Hamza ibn Jajiq, patrikios of Busfurrajan, at al-Baq, brought him down from his fortress and carried him to Samarra, marched on Jurzan where Ishaq ibn Isma'il was overcome and killed in cold blood, opened Jurzan, and carried off the people of Arran and the Armenian surface-dwellers in Sisajan — the rebellious and disobedient, Christians and others — till that march stood sounder than ever it had been; then he came to Samarra in the year 241."
  fr: "Chez al-Baladhuri : al-Mutawakkil confia l'Arménie à Bugha al-Kabir, qui à Badhlis s'empara de Musa ibn Zurara (l'un de ceux qui avaient voulu la mort de Yusuf et y avaient aidé, par colère pour Buqrat), fit la guerre aux Khwaythiyya, en tuant un grand nombre et faisant de nombreux captifs, puis assiégea Ashut ibn Hamza ibn Jajiq, patrice de Busfurrajan, à al-Baq, le fit descendre de sa forteresse et l'emmena à Samarra, marcha sur Jurzan où Ishaq ibn Isma'il fut vaincu et tué de sang-froid, ouvrit Jurzan, et emmena les gens d'Arran et les Arméniens de surface du Sisajan, rebelles et désobéissants, chrétiens et autres, jusqu'à ce que cette marche soit plus solide qu'elle ne l'avait jamais été ; puis il vint à Samarra en l'an 241."
  es: "En al-Baladhuri: al-Mutawakkil entregó Armenia a Bugha al-Kabir, quien en Badhlis capturó a Musa ibn Zurara —uno que había favorecido el asesinato de Yusuf y lo había ayudado en su ira por Buqrat—, guerreó contra los Khwaythiyya, matando a una gran multitud y tomando muchos cautivos, luego sitió a Ashut ibn Hamza ibn Jajiq, patricio de Busfurrajan, en al-Baq, lo sacó de su fortaleza y lo llevó a Samarra, marchó sobre Jurzan donde Ishaq ibn Isma'il fue vencido y asesinado a sangre fría, abrió Jurzan y se llevó a la gente de Arran y a los armenios que vivían en la superficie en Sisajan —los rebeldes y desobedientes, cristianos y otros— hasta que esa marcha se mantuvo más firme que nunca; luego llegó a Samarra en el año 241."
  ur: "البلادھوری میں ہے: المتوکل نے آرمینیا کو بوغہ الکبیر کے حوالے کیا، جس نے بادلس میں موسیٰ بن زرارہ کو پکڑ لیا - جس نے یوسف کے قتل کا حامی تھا اور بقراط کے غصے میں اس کی مدد کی تھی - خوایثیہ کے خلاف جنگ کی، ایک عظیم قتل و غارت گری کی اور پھر بہت سے حمزیب کو قیدی بنا لیا، الباق کے مقام پر بسفرراجان کے سرپرستوں نے اسے اپنے قلعے سے نیچے لایا اور سامرا لے گئے، جورزان پر چڑھائی کی جہاں اسحاق بن اسماعیل کو شکست دی گئی اور سرد خون میں مارا گیا، جرزان کو کھولا، اور ارران کے لوگوں اور سیساجان میں آرمینیائی سطح کے باشندوں کو لے گیا - جب تک کہ دوسرے سے زیادہ باغی، عیسائی اور مرعوب نہ ہوں، ان سے زیادہ ظالم اور ظالم تھے۔ یہ ہو چکا تھا پھر وہ 241 میں سامرہ آیا۔"
  tr: "El-Baladhuri'ye göre: El-Mutavakkil, Büyük Buga'yı Ermenistan valisi olarak atadı. Badlis'e vardığında, Yusuf'u öldürmek isteyenlerden biri olan Musa bin Zurara'yı yakaladı ve Hipokrat'a duyduğu öfke nedeniyle ona yardım etti. Huveytiyye ile savaştı, çok sayıda kişiyi öldürdü ve birçok esir aldı. Daha sonra El-Bak'ta bulunan Aşvat bin Hamza bin Jajaq'ı El-Basfarjan yolunda kuşattı, kalesinden indirdi ve Samarra'ya götürdü. Jarzan'a doğru ilerledi ve İshak bin İsmail galip geldi ve onu soğukkanlılıkla öldürdü. Jarzan'ı fethetti ve Arran'daki ve Ermenistan'ın dışındaki, Hristiyanlar ve diğerleri de dahil olmak üzere muhalif ve isyancı olan El-Sisican halkına saldırdı, ta ki bu sınır daha önce hiç görülmemiş bir istikrar seviyesine kavuşana kadar. Daha sonra Hicri 241 yılında Samarra'ya vardı."
  id: "Menurut Al-Baladhuri: Al-Mutawakkil mengangkat Bugha Agung sebagai gubernur Armenia. Ketika tiba di Badlis, ia menangkap Musa bin Zurara, yang merupakan salah satu orang yang ingin membunuh Yusuf dan membantunya karena marah kepada Hippokrates. Ia memerangi Khuwaithiya dan membunuh banyak dari mereka serta menawan banyak orang. Kemudian ia mengepung Ashwat bin Hamza bin Jajaq di jalan Al-Basfarjan, yang berada di Al-Baq, dan membawanya turun dari bentengnya dan membawanya ke Samarra. Ia berbaris ke Jarzan, dan Ishaq bin Ismail menang dan membunuhnya dengan kejam. Ia menaklukkan Jarzan dan menyerang orang-orang di Arran dan pinggiran Armenia dari orang-orang Al-Sisijan, yang merupakan pembangkang dan pemberontak, termasuk orang Kristen dan lainnya, hingga perbatasan itu dipulihkan ke tingkat stabilitas yang belum pernah terjadi sebelumnya. Kemudian ia tiba di Samarra pada tahun 241 Hijriah."
