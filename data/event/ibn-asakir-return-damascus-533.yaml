label:
  ar: "عودة ابن عساكر إلى دمشق وبدؤه الإملاء والتحديث، ٥٣٣-٥٣٥هـ/١١٣٩-١١٤١م"
  en: "Ibn 'Asakir returns to Damascus and begins public dictation, 533-535/1139-1141"
  ur: "ابن عساکر کی دمشق واپسی اور املا و تدریس کا آغاز، 533-535ھ/1139-1141ء"
  es: "Ibn 'Asakir regresa a Damasco y comienza a dictar públicamente, 533-535/1139-1141"
  fr: "Ibn 'Asakir retourne à Damas et commence la dictée publique, 533-535/1139-1141"
  tr: "İbn Asakir'in Şam'a dönüşü ve dikte ve öğretim faaliyetlerine yeniden başlaması, Hicri 533-535 / Miladi 1139-1141"
  id: "Kembalinya Ibnu Asakir ke Damaskus dan dimulainya kembali kegiatan mendikte dan mengajar, 533-535 H / 1139-1141 M"
summary:
  ar: "مر ابن عساكر ببغداد سنة ثلاث وثلاثين وعاد إلى دمشق بعد سنتين؛ وقد قال بنفسه إنه لما عزم على التحديث استأذن أعيان شيوخه ورؤساء البلد فقال كلهم «ومن أحق بهذا منك» فشرع في ذلك في سنة ثلاث وثلاثين {cite:tarikh-islam-dhahabi p. 79}، ومنذ دولة معين الدين أنر لم يفارق مدينته فتفرغ أربعين سنة للعلم {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  en: "Ibn 'Asakir passed through Baghdad in 533/1139 and reached Damascus two years later {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}. Of his resolve to teach hadith he said: he sought the permission of his senior shaykhs and the notables of the town, and every one answered 'who has a better right to this than you?' — so he began dictating in 533 {cite:tarikh-islam-dhahabi p. 79}. From the days of Mu'in al-Din Anar onward he never again left his native city, devoting forty years to learning {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  ur: "ابن عساکر 533ھ/1139ء میں بغداد سے گزرے اور دو برس بعد دمشق پہنچے {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}؛ تدریسِ حدیث کے آزم کے بارے میں فرماتے ہیں کہ بڑے شیوخ اور شہری سرداروں سے اجازت مانی تو سب نے کہا 'تم سے بڑھ کر اہل کون؟' — چنانچہ 533ھ میں املا شروع کیا {cite:tarikh-islam-dhahabi p. 79}؛ معین الدین انر کے زمانے سے وہ پھر کبھی اپنے شہر سے نہ نکلے اور چالیس برس علم کو وقف رہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}۔"
  es: "Ibn 'Asakir pasó por Bagdad en 533/1139 y llegó a Damasco dos años después {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}. Sobre su decisión de enseñar hadices, dijo: buscó el permiso de sus shaykhs más importantes y de los notables de la ciudad, y todos respondieron: \"¿Quién tiene más derecho a esto que tú?\". Así que comenzó a dictar en 533 {cite:tarikh-islam-dhahabi p. 79}. Desde los días de Mu'in al-Din Anar en adelante, nunca más abandonó su ciudad natal, dedicando cuarenta años al estudio {cite:encyclopaedia-of-islam-2 vol. 3 p. 746}."
  fr: "Ibn 'Asakir traversa Bagdad en 533/1139 et atteignit Damas deux ans plus tard (voir Encyclopédie de l'Islam, volume 2, vol. 3, p. 746). Concernant sa détermination à enseigner le hadith, il déclara: « J'ai sollicité l'autorisation de mes cheikhs les plus expérimentés et des notables de la ville, et tous m'ont répondu: “Qui est mieux placé que toi pour cela ?” C'est ainsi que j'ai commencé à dicter en 533 (voir Tarikh Islam Dhahabi, p. 79). Dès l'époque de Mu'in al-Din Anar, il ne quitta plus jamais sa ville natale, consacrant quarante années à l'étude (voir Encyclopédie de l'Islam, volume 2, vol. 3, p. 746). »"
  tr: "İbn Asakir, otuz üçüncü yılda Bağdat'tan geçti ve iki yıl sonra Şam'a döndü. Kendisi, öğretmeye karar verdiğinde, en önde gelen şeyhlerinden ve şehrin ileri gelenlerinden izin istediğini ve hepsinin, \"Senden daha layık kim olabilir ki?\" dediğini söylemiştir. Böylece otuz üçüncü yılda öğretmeye başladı. {kaynak:tarikh-islam-dhahabi s. 79}. Mu'in el-Din Unur döneminden beri şehrini terk etmedi ve kırk yılını ilme adadı. {kaynak:encyclopaedia-of-islam-2 cilt 3 s. 746}."
  id: "Ibn Asakir melewati Baghdad pada tahun 33 dan kembali ke Damaskus setelah dua tahun. Beliau sendiri mengatakan bahwa ketika memutuskan untuk mengajar, beliau meminta izin kepada para syekh terkemuka dan para pemimpin kota, dan mereka semua berkata, “Siapa yang lebih layak untuk ini selain Anda?” Maka beliau mulai melakukannya pada tahun 33 {cite:tarikh-islam-dhahabi hlm. 79}. Sejak masa pemerintahan Mu’in al-Din Unur, beliau tidak meninggalkan kotanya, sehingga beliau mengabdikan diri selama empat puluh tahun untuk ilmu pengetahuan {cite:encyclopaedia-of-islam-2 vol. 3 hlm. 746}."
