id: event/marriage-of-mamun-and-buran
class: event
kind: other
label: { ar: "زواج المأمون ببوران", en: "The Marriage of al-Ma'mun and Buran", es: "El matrimonio de al-Ma'mun y Buran", fr: "Le mariage d'al-Ma'mun et de Buran", ur: "المامون اور بران کی شادی", tr: "Al-Ma'mun'un Buran ile evliliği", id: "Pernikahan Al-Ma'mun dengan Buran" }
summary:
  ar: "في سنة عشر ومئتين تزوج المأمون بوران بنت الحسن بن سهل وبلغ جهازها أربعين تكة مجوهرة وعشرة من صناديق جوهر من اللآلئ واليواقيت وقام أبوها بخلع القواد وكلفتهم مدة سبعة عشر يوماً وكتب رقاعاً فيها أسماء ضياع له ونثرها على القواد والعباسيين فمن وقعت في يده رقعة باسم ضيعة سلمت له ونثر صينية ملأى جوهراً بين يدي المأمون عندما زفت إليه {cite:tarikh-khulafa-minhaj-1434 p. 487-488}. وأمر المأمون بحمل خراج فارس وكور الأهواز إلى الحسن بن سهل سنة زفافه وقال محمد بن حازم الباهلي بارك الله للحسن ولبوران في الختن يا ابن هارون قد ظفرت ولكن ببنست من فلم يدر المأمون خيراً أراد أم شراً {cite:muruj-al-dhahab p. 424}"
  en: "In year 210 al-Ma'mun married Buran bint al-Hasan ibn Sahl; her trousseau ran to forty jewelled girdles and ten chests of pearls and rubies. Her father gave the commanders their khil'a robes, feasted them seventeen days, scattered slips bearing names of his estates among the generals and Abbasids — whoever drew one took the property — and strewn a trayful of gems before al-Ma'mun as she was presented to him {cite:tarikh-khulafa-minhaj-1434 p. 487-488}."
  es: "En el año 210, al-Ma'mun se casó con Buran bint al-Hasan ibn Sahl; su ajuar constaba de cuarenta cinturones enjoyados y diez cofres de perlas y rubíes. Su padre entregó a los comandantes sus túnicas de khil'a, los agasajó durante diecisiete días, esparció papeletas con los nombres de sus propiedades entre los generales y los abasíes —quien sacara una se quedaba con la propiedad— y colocó una bandeja llena de gemas ante al-Ma'mun cuando le fue presentada {cite:tarikh-khulafa-minhaj-1434 p. 487-488}."
  fr: "En l'an 210, al-Ma'mun épousa Buran bint al-Hasan ibn Sahl; son trousseau comprenait quarante ceintures ornées de pierres précieuses et dix coffres de perles et de rubis. Son père offrit aux commandants leurs robes de khil'a, les invita à un festin pendant dix-sept jours, dispersa des papiers portant les noms de ses domaines parmi les généraux et les Abbassides — celui qui en tirait un héritait de la propriété — et déposa un plateau de gemmes devant al-Ma'mun lors de sa présentation à son père."
  ur: "210 میں المامون نے بران بنت الحسن ابن سہل سے شادی کی۔ اس کا پتلون چالیس جواہرات سے جڑے کمروں اور موتیوں اور یاقوت کے دس سینے تک پہنچا۔ اس کے والد نے کمانڈروں کو ان کے خلع کا لباس دیا، انہیں سترہ دن تک ضیافت دی، جرنیلوں اور عباسیوں کے درمیان اس کی جاگیروں کے نام والی پرچیاں بکھری - جس نے بھی جائیداد کھینچی اس نے لے لی - اور المامون کے سامنے جواہرات کا ایک ٹرے بچھایا جیسا کہ وہ اسے پیش کیا گیا تھا۔ 487-488}۔"
  tr: "Hicri 210 yılında, el-Ma'mun, el-Hasan ibn Sahl'ın kızı Buran ile evlendi. Buran'ın çeyizi kırk mücevherli kemer ve on sandık inci ve yakuttan oluşuyordu. Babası komutanları görevden aldı ve onlardan on yedi gün vergi istedi. Sahip olduğu toprakların isimlerini kağıt parçalarına yazdı ve bunları komutanlar ve Abbasiler arasında dağıttı. Üzerinde toprak adı yazılı bir kağıt parçası bulan kişi o toprağı aldı. El-Ma'mun evlilik töreninde kendisine getirildiğinde, babası el-Ma'mun'un önüne mücevher dolu bir tepsi serpti. {kaynak:tarikh-khulafa-minhaj-1434 s. 487-488}. El-Ma'mun, evlilik yılında Fars ve Ahvaz bölgelerinin vergilerinin el-Hasan ibn Sahl'a gönderilmesini emretti. Muhammed ibn Hazim el-Bahili şöyle dedi: \"Allah el-Hasan ve Buran'ı evliliklerinde mübarek kılsın, ey Harun oğlu! Zafer kazandın, ama bir kızla!\" El-Ma'mun, iyi mi yoksa kötü mü niyet ettiğini bilmiyordu. {cite:muruj-al-dhahab s. 424}"
  id: "Pada tahun 210 H, al-Ma'mun menikahi Buran, putri al-Hasan ibn Sahl. Mas kawinnya terdiri dari empat puluh ikat pinggang berhiaskan permata dan sepuluh peti berisi mutiara dan rubi. Ayahnya memecat para komandan dan membebankan mereka tugas selama tujuh belas hari. Ia menulis secarik kertas dengan nama-nama tanah miliknya dan menyebarkannya di antara para komandan dan Abbasiyah. Siapa pun yang menemukan secarik kertas dengan nama tanah tersebut akan menerimanya. Ia menyebarkan nampan penuh permata di hadapan al-Ma'mun ketika ia dibawa kepadanya untuk dinikahi. {cite:tarikh-khulafa-minhaj-1434 pp. 487-488}. Al-Ma'mun memerintahkan agar pajak Fars dan distrik Ahwaz dikirim kepada al-Hasan ibn Sahl pada tahun pernikahannya. Muhammad ibn Hazim al-Bahili berkata, \"Semoga Allah memberkati al-Hasan dan Buran dalam pernikahan mereka, wahai putra Harun! Engkau telah menang, tetapi dengan seorang putri!\" Al-Ma'mun tidak tahu apakah ia bermaksud baik atau jahat. {cite:muruj-al-dhahab p. 424}"
