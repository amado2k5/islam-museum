label: { ar: "زواج المأمون ببوران" }
summary:
  ar: "في سنة عشر ومئتين تزوج المأمون بوران بنت الحسن بن سهل وبلغ جهازها أربعين تكة مجوهرة وعشرة من صناديق جوهر من اللآلئ واليواقيت وقام أبوها بخلع القواد وكلفتهم مدة سبعة عشر يوماً وكتب رقاعاً فيها أسماء ضياع له ونثرها على القواد والعباسيين فمن وقعت في يده رقعة باسم ضيعة سلمت له ونثر صينية ملأى جوهراً بين يدي المأمون عندما زفت إليه {cite:tarikh-khulafa-minhaj-1434 p. 487-488}."
  en: "In year 210 al-Ma'mun married Buran bint al-Hasan ibn Sahl; her trousseau ran to forty jewelled girdles and ten chests of pearls and rubies. Her father gave the commanders their khil'a robes, feasted them seventeen days, scattered slips bearing names of his estates among the generals and Abbasids — whoever drew one took the property — and strewn a trayful of gems before al-Ma'mun as she was presented to him {cite:tarikh-khulafa-minhaj-1434 p. 487-488}."
