  ar: "وقعة أنيشة التي قتل بها الحافظ أبو الربيع الكلاعي يوم الخميس لعشر بقين من ذي الحجة سنة أربع وثلاثين وستمائة؛ لم يزل متقدماً أمام الصفوف زحفاً إلى الكفار مقبلاً على العدو ينادي بالمنهزمين: أعن الجنة تفرون! حتى قتل صابراً محتسباً، وكان دائماً يقول إن منتهى عمره سبعون سنة لرؤيا رآها في صغره فكان كذلك، ورثاه تلميذه الحافظ ابن الأبار بقصيدته الميمية الشهيرة {cite:nafh-tib-maqqari p. 477}."
  en: "The battle of Anisha (Thursday, 10 Dhu al-Hijja 634) in which the hafiz Abu'l-Rabi al-Kila'i was killed — advancing ahead of the ranks, calling to the fleeing 'do you flee Paradise?' until he fell; his pupil Ibn al-Abbar mourned him in the famous mimiyya elegy {cite:nafh-tib-maqqari p. 477}."
