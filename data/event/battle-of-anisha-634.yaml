label: { ar: "وقعة أنيشة", en: "The battle of Anisha", fr: "La bataille d'Anisha", es: "La batalla de Anisha", ur: "انیشہ کی لڑائی", tr: "Anisha Savaşı", id: "Pertempuran Anisha" }
summary:
  ar: "وقعة أنيشة التي قتل بها الحافظ أبو الربيع الكلاعي يوم الخميس لعشر بقين من ذي الحجة سنة أربع وثلاثين وستمائة؛ لم يزل متقدماً أمام الصفوف زحفاً إلى الكفار مقبلاً على العدو ينادي بالمنهزمين: أعن الجنة تفرون! حتى قتل صابراً محتسباً، وكان دائماً يقول إن منتهى عمره سبعون سنة لرؤيا رآها في صغره فكان كذلك، ورثاه تلميذه الحافظ ابن الأبار بقصيدته الميمية الشهيرة {cite:nafh-tib-maqqari p. 477}."
  en: "The battle of Anisha (Thursday, 10 Dhu al-Hijja 634) in which the hafiz Abu'l-Rabi al-Kila'i was killed — advancing ahead of the ranks, calling to the fleeing 'do you flee Paradise?' until he fell; his pupil Ibn al-Abbar mourned him in the famous mimiyya elegy {cite:nafh-tib-maqqari p. 477}."
  fr: "La bataille d'Anisha (jeudi, dix jours avant la fin de Dhu al-Hijja 634), dans laquelle le hafiz Abu'l-Rabi al-Kila'i fut tué en avançant devant les rangs, criant aux fuyards « fuyez-vous le Paradis ? » jusqu'à tomber ; son disciple Ibn al-Abbar le pleura dans la célèbre élégie mimiyya {cite:nafh-tib-maqqari p. 477}."
  es: "La batalla de Anisha (jueves, 10 de Dhu al-Hijja 634) en la que murió el hafiz Abu'l-Rabi al-Kila'i, quien avanzaba delante de las filas, gritando a los que huían \"¿Huís del Paraíso?\" hasta que cayó; su discípulo Ibn al-Abbar lo lloró en la famosa elegía mimiyya {cite:nafh-tib-maqqari p. 477}."
  ur: "انیشہ کی جنگ ⁦(جمعرات، 10 ذی الحجہ 634)⁩ جس میں حافظ ابوالربیع الکلائی مارے گئے تھے - صفوں سے آگے بڑھتے ہوئے بھاگنے والوں کو پکار رہے تھے کہ کیا تم جنت سے بھاگ رہے ہو؟ جب تک وہ گر گیا اس کے شاگرد ابن العبر نے مشہور ممیّہ عالیہ میں اس کا ماتم کیا ہے۔ 477}۔"
  tr: "634 yılında, Zilhicce ayının onuncu günü Perşembe günü, Enişte Muharebesi'nde, Hafız Ebu'l-Rabi'l-Kala'i şehit düştü. Savaşta, düşman saflarının önünde ilerleyerek, kâfirlere doğru sürünerek, düşmana karşı durarak, yenilenlere \"Cennetten mi kaçıyorsunuz!\" diye seslenerek, öldürülene kadar sabırla ve umutla savaştı. Gençliğinde gördüğü bir rüyaya dayanarak, ömrünün yetmiş yıl süreceğini söylerdi ve gerçekten de öyle oldu. Öğrencisi Hafız İbnü'l-Ebber, onun için ünlü şiirini Mim mektubunda dile getirdi. (Kaynak: Nafh-tib-makkari, s. 477)"
  id: "Dalam Perang Anisha, di mana Al-Hafiz Abu Al-Rabi’ Al-Kala’i gugur pada hari Kamis, tanggal sepuluh Dzul Hijjah, tahun 634, beliau masih maju di depan barisan, merangkak menuju orang-orang kafir, menghadapi musuh, menyerukan kepada yang kalah: Apakah kalian melarikan diri dari Surga! hingga akhirnya gugur, dengan sabar dan penuh harapan. Beliau selalu mengatakan bahwa akhir hidupnya adalah tujuh puluh tahun, berdasarkan penglihatan yang beliau lihat di masa mudanya, dan memang demikianlah adanya. Muridnya, Al-Hafiz Ibn Al-Abbar, meratapinya dengan puisi terkenalnya dalam surat mim {cite:nafh-tib-maqqari p. 477}."
