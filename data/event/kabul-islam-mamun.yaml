summary:
  ar: "لم يزل عمال المهدي والرشيد يقبضون الأتاوة من رتبيل سجستان على قدر قوتهم وضعفهم ويولون عمالهم النواحي التي قد غاب عليها الإسلام ولما كان المأمون بخراسان أديت إليه الأتاوة مضاعفة وفتح كابل وأظهر ملكها الإسلام والطاعة وأدخلها عامله واتصل إليها البريد فبعث إليه منها بإهليلج غض ثم استقامت بعد ذلك حيناً."
  en: "The Mahdi's and Rashid's agents took Sijistan's atawa from Rutbil as strength allowed, posting their own men over the marches Islam had lost. Under al-Ma'mun at Khurasan the atawa came doubled, Kabul was opened, its king showed Islam and obedience, the governor's agent entered, the post-road was joined, and fresh myrobalan was sent him from it — and the land held steady for a time."
