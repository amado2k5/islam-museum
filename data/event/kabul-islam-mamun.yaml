label: { ar: "فتح كابل وإسلام ملكها في أيام المأمون", en: "Kabul's Opening and its King's Islam under al-Ma'mun", es: "La apertura de Kabul y el Islam de su rey bajo al-Ma'mun", fr: "L'ouverture de Kaboul et l'islam de son roi sous al-Ma'mun", ur: "کابل کا آغاز اور اس کے بادشاہ کا اسلام المامون کے تحت" }
summary:
  ar: "لم يزل عمال المهدي والرشيد يقبضون الأتاوة من رتبيل سجستان على قدر قوتهم وضعفهم ويولون عمالهم النواحي التي قد غاب عليها الإسلام ولما كان المأمون بخراسان أديت إليه الأتاوة مضاعفة وفتح كابل وأظهر ملكها الإسلام والطاعة وأدخلها عامله واتصل إليها البريد فبعث إليه منها بإهليلج غض ثم استقامت بعد ذلك حيناً."
  en: "The Mahdi's and Rashid's agents took Sijistan's atawa from Rutbil as strength allowed, posting their own men over the marches Islam had lost. Under al-Ma'mun at Khurasan the atawa came doubled, Kabul was opened, its king showed Islam and obedience, the governor's agent entered, the post-road was joined, and fresh myrobalan was sent him from it — and the land held steady for a time."
  es: "Los agentes del Mahdi y de Rashid tomaron el atawa de Sijistan desde Rutbil según lo permitían sus fuerzas, desplegando a sus propios hombres en las marcas que el Islam había perdido. Bajo el mando de al-Ma'mun en Jorasán, el atawa llegó duplicado, se abrió Kabul, su rey demostró su fe en el Islam y su obediencia, entró el agente del gobernador, se restableció la ruta postal y se le envió mirabolano fresco desde allí; y la tierra se mantuvo estable por un tiempo."
  fr: "Les agents du Mahdi et de Rachid prirent le contrôle du Sijistan depuis Rutbil, au fur et à mesure de leurs forces, et postèrent leurs propres hommes dans les zones perdues par l'islam. Sous al-Ma'mun, au Khorasan, le contrôle du Sijistan doubla, Kaboul fut ouverte, son roi se convertit à l'islam et fit preuve d'obéissance, l'agent du gouverneur entra, la route postale fut rétablie et du myrobalan frais lui fut envoyé; la région resta ainsi stable un temps."
  ur: "مہدی اور راشد کے ایجنٹوں نے سجستان کے اتاو کو رتبیل سے طاقت کی اجازت کے طور پر چھین لیا، اسلام کے کھوئے ہوئے مارچوں پر اپنے آدمیوں کو تعینات کیا۔ خراسان میں المامون کے دور میں اتوا دوگنا ہو گیا، کابل کھول دیا گیا، اس کے بادشاہ نے اسلام اور فرمانبرداری کا مظاہرہ کیا، گورنر کا ایجنٹ داخل ہوا، پوسٹ روڈ کو جوڑ دیا گیا، اور اسے اس سے تازہ میروبلان بھیجا گیا- اور زمین کچھ دیر کے لیے مستحکم رہی۔"
