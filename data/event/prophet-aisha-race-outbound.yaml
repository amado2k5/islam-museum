label:
  ar: سبقة النبي وعائشة الأولى
  en: The Prophet's first race with Aisha
  ur: نبی اور عائشہ کی پہلی دوڑ
summary:
  ar: في بعض أسفارها مع النبي، وقد دعا أصحابه فتقدموا، سابقها النبي فسبقته وهي جارية خفيفة — حديثها عند أبي داود وأحمد {cite:sunan-abi-dawud}.
  en: On one of her journeys with the Prophet, he sent the companions ahead and raced her; she was light-built and beat him
    — her own report in Abu Dawud and Ahmad {cite:sunan-abi-dawud}.
  ur: نبی کے ساتھ ایک سفر میں آپ نے صحابہ کو آگے بھیجا اور عائشہ سے دوڑ لگائی؛ وہ ہلکی بدن تھیں اور جیت گئیں — ان کی اپنی
    روایت ابو داود اور احمد میں {cite:sunan-abi-dawud}۔
