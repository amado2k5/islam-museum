id: event/al-hadi-moves-against-the-fort-of-al-liwa-on-2-dhu-al-qada-295
class: event
kind: other
label:
  ar: "الهادي يتوجه إلى حصن اللواء يوم الأحد 2 ذي القعدة سنة 295هـ، ص354"
  en: "Al-Hadi moves against the fort of al-Liwa on Sunday, 2 Dhu al-Qa'da 295 AH, p. 354"
  ur: "ہادی کا اتوار 2 ذوالقعدہ 295ھ کو اللواء کے قلعے کی طرف جانا، ص354"
  es: "Al-Hadi ataca la fortaleza de al-Liwa el domingo 2 de Dhu al-Qa'da de 295 AH, pág. 354."
  fr: "Al-Hadi lance une attaque contre la forteresse d'al-Liwa le dimanche 2 Dhu al-Qa'da 295 AH, p. 354"
summary:
  ar: "بعد أيام في الهجر خرج الهادي يوم الأحد في ذي القعدة إلى الموضع الذي تحصنت فيه بنو الحارث، وهو جبل وعر يقال له اللواء، وكانت بنو الحارث تظن أنه لا يقدر عليها فيه أحد."
  en: "After some days at al-Hijr, al-Hadi went out on Sunday, two days into Dhu al-Qa'da, to the place where Banu al-Harith had fortified themselves, a rugged mountain called al-Liwa, which they believed no one could reach."
  ur: "الہجر میں کچھ دن ٹھہرنے کے بعد ہادی ذوالقعدہ کی دو تاریخ، اتوار کو اس جگہ کی طرف نکلا جہاں بنو الحارث نے پناہ لی تھی، یعنی اللواء نامی ایک دشوار گزار پہاڑ، جس کے بارے میں ان کا خیال تھا کہ وہاں کوئی نہیں پہنچ سکتا۔"
  es: "Tras pasar algunos días en al-Hijr, al-Hadi salió el domingo, dos días después del inicio de Dhu al-Qa'da, hacia el lugar donde Banu al-Harith se había fortificado, una escarpada montaña llamada al-Liwa, a la que creían que nadie podía llegar."
  fr: "Après quelques jours à al-Hijr, al-Hadi sortit le dimanche, deux jours après le début du mois de Dhu al-Qa'da, vers l'endroit où les Banu al-Harith s'étaient retranchés, une montagne escarpée appelée al-Liwa, qu'ils pensaient inaccessible."
