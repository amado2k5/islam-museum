id: event/first-day-of-the-battle-of-athafit-285
class: event
kind: other
label:
  ar: اليوم الأول من حرب أثافت بين الهادي والدعام وثياب «دستري»، شوال 285هـ
  en: The first day of the war at Athafit between al-Hadi and al-Da'am and the "dastari" garments, Shawwal 285 AH
  ur: اثافت میں ہادی اور دعام کی جنگ کا پہلا دن اور «دستری» کپڑے، شوال 285ھ
summary:
  ar: يروي الكتاب أن الهادي عبأ جيشه عند اقترابه من أثافت وخرج الدعام فتعبأ، واقتتلوا حتى العصر وأصيب الجميع بجراحات كثيرة، وأن الدعام نشر ثياباً ونادى في الأعراب الذين مع الهادي أن يأتوا ليكتسوا فمضى إليه جماعة منهم فاضطرب عسكر الهادي، فنزل الهادي من الجبل وحرض أصحابه فحملوا على عسكر الدعام وطردوهم، وثبت العسكران حتى الليل، ثم نزل الهادي في موضع يقال له كراوي.
  en: The book tells that as al-Hadi neared Athafit he drew up his army and al-Da'am came out and did the same; they fought until the afternoon prayer and all were badly wounded; al-Da'am spread out garments and called to the bedouins with al-Hadi to come and be clothed, a group went to him and al-Hadi's army was shaken; al-Hadi came down from the mountain and urged his men, who charged al-Da'am's army and drove it back; both held until night, and al-Hadi then camped at a place called Karawi.
  ur: کتاب بتاتی ہے کہ اثافت کے قریب پہنچ کر ہادی نے لشکر کی صف بندی کی اور دعام نکل کر اسی طرح صف آرا ہوا؛ عصر تک لڑائی ہوئی اور سب کو بہت زخم لگے؛ دعام نے کپڑے بچھوائے اور ہادی کے ساتھی بدوؤں کو پکارا کہ کپڑے لینے آؤ، ان کی ایک جماعت اس کے پاس گئی تو ہادی کا لشکر ڈگمگایا؛ ہادی پہاڑ سے اترے اور ساتھیوں کو ابھارا، انہوں نے دعام کے لشکر پر حملہ کر کے اسے پیچھے ہٹایا؛ دونوں لشکر رات تک ڈٹے رہے، پھر ہادی کراوی نامی مقام پر ٹھہرے۔
