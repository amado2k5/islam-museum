id: event/first-day-of-the-battle-of-athafit-285
class: event
kind: other
label:
  ar: اليوم الأول من حرب أثافت بين الهادي والدعام وثياب «دستري»، شوال 285هـ
  en: The first day of the war at Athafit between al-Hadi and al-Da'am and the "dastari" garments, Shawwal 285 AH
  ur: اثافت میں ہادی اور دعام کی جنگ کا پہلا دن اور «دستری» کپڑے، شوال 285ھ
  es: "El primer día de la batalla de Athafit entre al-Hadi y al-Da'am y las vestimentas \"dastari\", Shawwal 285 AH"
  fr: "Premier jour de la guerre d'Athafit entre al-Hadi et al-Da'am et les vêtements « dastari », Shawwal 285 AH"
  tr: "El-Hadi ve El-Da'am arasındaki Athaft savaşının ilk günü ve \"Dastri\"nin giysileri, Şevval 285 Hicri"
  id: "Hari pertama perang Athaft antara Al-Hadi dan Al-Da'am dan pakaian \"Dastri\", Syawal 285 H"
summary:
  ar: يروي الكتاب أن الهادي عبأ جيشه عند اقترابه من أثافت وخرج الدعام فتعبأ، واقتتلوا حتى العصر وأصيب الجميع بجراحات كثيرة، وأن الدعام نشر ثياباً ونادى في الأعراب الذين مع الهادي أن يأتوا ليكتسوا فمضى إليه جماعة منهم فاضطرب عسكر الهادي، فنزل الهادي من الجبل وحرض أصحابه فحملوا على عسكر الدعام وطردوهم، وثبت العسكران حتى الليل، ثم نزل الهادي في موضع يقال له كراوي.
  en: The book tells that as al-Hadi neared Athafit he drew up his army and al-Da'am came out and did the same; they fought until the afternoon prayer and all were badly wounded; al-Da'am spread out garments and called to the bedouins with al-Hadi to come and be clothed, a group went to him and al-Hadi's army was shaken; al-Hadi came down from the mountain and urged his men, who charged al-Da'am's army and drove it back; both held until night, and al-Hadi then camped at a place called Karawi.
  ur: کتاب بتاتی ہے کہ اثافت کے قریب پہنچ کر ہادی نے لشکر کی صف بندی کی اور دعام نکل کر اسی طرح صف آرا ہوا؛ عصر تک لڑائی ہوئی اور سب کو بہت زخم لگے؛ دعام نے کپڑے بچھوائے اور ہادی کے ساتھی بدوؤں کو پکارا کہ کپڑے لینے آؤ، ان کی ایک جماعت اس کے پاس گئی تو ہادی کا لشکر ڈگمگایا؛ ہادی پہاڑ سے اترے اور ساتھیوں کو ابھارا، انہوں نے دعام کے لشکر پر حملہ کر کے اسے پیچھے ہٹایا؛ دونوں لشکر رات تک ڈٹے رہے، پھر ہادی کراوی نامی مقام پر ٹھہرے۔
  es: "El libro cuenta que, cuando al-Hadi se acercaba a Athafit, reunió a su ejército y al-Da'am salió e hizo lo mismo; lucharon hasta la oración de la tarde y todos resultaron gravemente heridos; al-Da'am extendió vestiduras y llamó a los beduinos que estaban con al-Hadi para que vinieran a vestirse, un grupo acudió a él y el ejército de al-Hadi se tambaleó; al-Hadi bajó de la montaña e instó a sus hombres, quienes cargaron contra el ejército de al-Da'am y lo hicieron retroceder; ambos resistieron hasta la noche, y al-Hadi acampó entonces en un lugar llamado Karawi."
  fr: "Le livre raconte que, tandis qu'al-Hadi approchait d'Athafit, il déploya son armée, et al-Da'am fit de même; ils combattirent jusqu'à la prière de l'après-midi et tous furent grièvement blessés; al-Da'am étendit des vêtements et appela les bédouins qui accompagnaient al-Hadi à venir se vêtir; un groupe s'approcha de lui et l'armée d'al-Hadi fut ébranlée; al-Hadi descendit de la montagne et exhorta ses hommes, qui chargèrent l'armée d'al-Da'am et la repoussèrent; les deux camps tinrent bon jusqu'à la nuit, et al-Hadi campa ensuite à un endroit appelé Karawi."
  tr: "Kitapta anlatıldığına göre, Al-Hadi Athaft'a yaklaşırken ordusunu topladı, Al-Da'am da çıkıp ordusunu topladı ve öğleden sonraya kadar savaştılar, herkes çok yaralandı. Al-Da'am elbise serdi ve Al-Hadi'nin yanında bulunan Bedevilere gelip giyinmelerini söyledi, böylece bir grup Bedevi onun yanına gitti ve Al-Hadi'nin ordusu huzursuzlandı. Al-Hadi dağdan indi ve arkadaşlarını cesaretlendirdi, böylece Al-Da'am'ın ordusuna saldırdılar ve onları püskürttüler ve iki ordu geceye kadar sağlam durdu. Sonra Al-Hadi Karawi denilen bir yere indi."
  id: "Kitab tersebut menceritakan bahwa Al-Hadi mengumpulkan pasukannya ketika mendekati Athaft, dan Al-Da'am keluar dan mengumpulkan pasukannya, dan mereka bertempur hingga siang hari, dan semua orang menderita banyak luka. Al-Da'am membentangkan pakaian dan memanggil orang-orang Badui yang bersama Al-Hadi untuk datang dan mengenakan pakaian, sehingga sekelompok dari mereka pergi kepadanya, dan pasukan Al-Hadi menjadi gelisah. Al-Hadi turun dari gunung dan mendesak para pengikutnya, sehingga mereka menyerang pasukan Al-Da'am dan mengusir mereka, dan kedua pasukan itu bertahan hingga malam. Kemudian Al-Hadi turun ke tempat yang disebut Karawi."
