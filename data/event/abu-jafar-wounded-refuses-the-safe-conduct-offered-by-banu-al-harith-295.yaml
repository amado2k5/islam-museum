id: "event/abu-jafar-wounded-refuses-the-safe-conduct-offered-by-banu-al-harith-295"
class: event
kind: other
label:
  ar: "أبو جعفر المجروح يرفض الأمان الذي عرضته بنو الحارث، 295هـ"
  en: "Wounded Abu Ja'far refuses the safe-conduct offered by Banu al-Harith, 295 AH, pp. 375-376"
  fr: "Blessé, Abu Ja'far refuse le sauf-conduit proposé par les Banu al-Harith, 295 de l’hégire, p. 375-376"
  ur: "زخمی ابو جعفر بنو حارث کی پیش کردہ امان کو ٹھکرا دیتا ہے، 295ھ، ص375-376"
  es: "Abu Ja'far, herido, rechaza el salvoconducto ofrecido por Banu al-Harith, 295 AH, pp. 375-376."
summary:
  ar: "أقبلت بنو الحارث حتى وقفوا على باب الحجرة، فخرج إليهم أبو جعفر فدفعهم، ثم رجع فحالوا بينه وبين الدخول. فناداه رجل منهم يقال له الحارث بن الحارث، من قبيلة لا يذكر اسمها في هذا السجل، يعرض عليه الخروج بالأمان، فأبى وقال إنه لا يمضي إلا على ما مضت عليه آباؤه الطاهرون."
  en: "Banu al-Harith came to the door of the room, and Abu Ja'far went out and drove them back, then returned, and they stood between him and the door. A man of them named al-Harith ibn al-Harith, of a clan whose name is withheld in this record, called out and offered him a safe-conduct if he came out. Abu Ja'far refused and said he would go only on the path his pure forefathers had taken."
  fr: "Les Banu al-Harith vinrent à la porte de la pièce ; Abu Ja'far sortit, les repoussa puis revint, et ils s’interposèrent entre lui et la porte. Un des leurs, nommé al-Harith ibn al-Harith, d’un clan dont le nom est omis dans cette notice, l’appela et lui offrit un sauf-conduit s’il sortait. Abu Ja'far refusa, disant qu’il ne suivrait que la voie de ses purs ancêtres."
  ur: "بنو حارث حجرے کے دروازے پر آ کھڑے ہوئے، ابو جعفر باہر نکلا اور انہیں پیچھے دھکیل دیا، پھر لوٹ آیا تو انہوں نے اسے دروازے کے اندر جانے سے روک دیا۔ ان میں سے ایک شخص الحارث بن الحارث، جو ایک ایسے قبیلے سے تھا جس کا نام اس ریکارڈ میں نہیں لکھا گیا، پکارا اور اسے امان پر باہر آنے کی پیشکش کی۔ ابو جعفر نے انکار کیا اور کہا کہ وہ صرف اسی راستے پر چلے گا جس پر اس کے پاک آباء چلے۔"
  es: "Los Banu al-Harith llegaron a la puerta de la habitación, y Abu Ja'far salió y los hizo retroceder. Luego regresó, y ellos se interpusieron entre él y la puerta. Un hombre de entre ellos, llamado al-Harith ibn al-Harith, de un clan cuyo nombre se omite en este relato, lo llamó y le ofreció un salvoconducto si salía. Abu Ja'far se negó y dijo que solo seguiría el camino que habían recorrido sus ancestros puros."
