label: { ar: "يوم نهاوند فتح الفتوح", en: "The Battle of Nihawand (Fath al-Futuh)", fr: "La bataille de Nihawand (Fath al-Futuh)", es: "La batalla de Nihawand (Fath al-Futuh)", ur: "نہاوند کی جنگ ⁦(فتح الفتوح)⁩", tr: "Nahavand günü, fetihlerin başlangıcıydı.", id: "Hari Nahavand merupakan awal dari penaklukan." }
summary:
  ar: "عند البلاذري: لما هرب يزدجرد من حلوان في سنة 19 تكاتبت الفرس وأهل الري وقومس وأصبهان وهمذان والماهين وتجمعوا إلى يزدجرد وذلك في سنة 20 فأمر عليهم مردانشاه ذا الحاجب وأخرجوا رايتهم الدرفشكابيان وكانت عدة المشركين يومئذ ستين ألفاً ويقال مائة ألف وقد كان عمار بن ياسر كتب إلى عمر بخبرهم فهم أن يغزوهم بنفسه ثم خاف انتشار أمر العرب فكتب إلى أهل الكوفة أن يسير ثلثاهم ويبقى ثلثهم لحفظ بلدهم وبعث من أهل البصرة بعثاً وقال لأستعمطن رجلاً يكون لأول ما يلقاه من الأسنة فولى النعمان بن عمرو بن مقرن المزني وقال إن أصبت فالأمير حذيفة بن اليمان فإن أصيب فجرير فإن أصيب فالمغيرة فإن أصيب فالأشعث بن قيس وشاور عمر الهرمزان فقال أصبهان الرأس وأذربيجان الجناحان فإن قطعت الرأس سقط الجناحان واستعمل النعمان فقال أما جابياً فلا ولكن غازياً وسلسل المسلمون كل عشرة في سلسلة لئلا يفروا ورماهم الفرس قبل القتال فجرحوا منهم جماعة وقال النعمان إني هاز لوائي ثلاث هزات فأما الأولى فليتوضأ الرجل وليقض حاجته وأما الثانية فلينظر إلى سيفه وشسعه وليصلح شأنه وأما الثالثة فاحملوا ولا يلوين أحد على أحد وثقل درعه عليه فقاتل فكان أول قتيل وسقط الفارسي عن بغلته فاتشق بطنه فأتاه معقل وبه رمق فغسل وجهه فبشره بالفتح فقال الحمد لله اكتبوا إلى عمر وأخذ حذيفة الراية ففتح الله عليهم وسمي ذلك الفتح فتح الفتوح وأتى أبو عثمان النهدي عمر بالبشارة فلما قال قتل النعمان قال إنا لله وبكى ووضع يده على رأسه وولى السائب بن الأقرع الغنائم وقال لا ترفعن باطلاً ولا تحبسن حقاً فدله ذو الموينتين على كنز النخيركان في القلعة فصعدها فإذا سفطان فيهما جوهر لم ير مثله قط فأمره عمر ببيعهما وقسم ثمنهما فاشتراهما عمرو بن حارث بأعطيات الذرية والمقاتلة فباع أحدهما بالحيرة بما اشتراهما به وفضل الآخر فكان أول لهوة مال اتخذها وكان فتح نهاوند في سنة 19 يوم الأربعاء ويقال سنة 20 وقال الحسن ومحمد عن أبي معشر سنة 21 ونزل النعمان الإسبيذار فجعل الأشعث بن قيس على الميمنة والمغيرة بن شعبة على الميسرة."
  en: "In al-Baladhuri: when Yazdgard fled Hulwan in year 19, Persians of Rayy, Qumis, Isbahan, Hamadhan and the Mahayn gathered to him in year 20 under Mardanshah Dhu al-Hajib behind the Dirafsh-i Kabiyan — sixty thousand, some say a hundred thousand. Ammar had written Umar, who meant to march himself, then ordered two-thirds of Kufa out with a Basra detachment and charged al-Nu'man ibn Muqarrin — 'not as tax-gatherer, but as ghazi' — with succession running Hudhayfa, Jarir, al-Mughira, al-Ash'ath; al-Hurmuzan had counseled 'Isbahan is the head, Adharbayjan the wings.' The Muslims chained themselves in tens and fives lest they flee; Persian arrows wounded some before battle. Al-Nu'man announced three banner-shakes — ablution, then swords and shoes, then charge with none turning to another — and fought, his armor heavy, the first martyr, the Persian splitting his mule's belly; Ma'qil found him breathing, washed his face, gave him the tidings of victory — 'praise God; write to Umar.' Hudhayfa took the banner and the conquest was named Fath al-Futuh. Abu Uthman al-Nahdi bore the news to Umar, who wept, hand on head. Al-Sa'ib ibn al-Aqra' held the spoils — 'raise no falsehood, withhold no right' — climbed the fortress on Dhu al-Muwaynatayn's word to the Nukhayrkan treasure, two baskets of unmatched jewels sold at Umar's order to the Qurashi youth Amr ibn Harith for the warriors' shares, who resold one at al-Hira for the whole price and kept the other — his first capital. The conquest fell a Wednesday of year 19, or 20, and via Abu Ma'shar 21; al-Nu'man had camped at al-Isbidhar, al-Ash'ath on the right, al-Mughira the left."
  fr: "Chez al-Baladhuri : quand Yazdgard s'enfuit de Hulwan en l'an 19, les Persans de Rayy, de Qumis, d'Isbahan, de Hamadhan et des deux Mah se rassemblèrent autour de lui en l'an 20 sous Mardanshah Dhu al-Hajib, derrière le Dirafsh-i Kabiyan : soixante mille, certains disent cent mille. Ammar avait écrit à Umar, qui voulut marcher lui-même, puis ordonna à deux tiers de Koufa de partir avec un détachement de Bassora et chargea al-Nu'man ibn Muqarrin, « non comme percepteur, mais comme ghazi », la succession allant à Hudhayfa, Jarir, al-Mughira, al-Ash'ath ; al-Hurmuzan avait conseillé : « Isbahan est la tête, Adharbayjan les ailes. » Les musulmans s'enchaînèrent par dix et par cinq de peur de fuir ; les flèches persanes en blessèrent certains avant la bataille. Al-Nu'man annonça trois agitations de la bannière : les ablutions, puis les épées et les sandales, puis la charge sans que nul ne se tourne vers un autre ; il combattit, son armure pesante, premier martyr, le Persan ayant éventré sa mule ; Ma'qil le trouva respirant encore, lui lava le visage et lui annonça la victoire : « Louange à Dieu ; écrivez à Umar. » Hudhayfa prit la bannière, et la conquête fut nommée Fath al-Futuh. Abu Uthman al-Nahdi porta la nouvelle à Umar, qui pleura, la main sur la tête. Al-Sa'ib ibn al-Aqra' garda le butin, « n'élève aucun mensonge, ne retiens aucun droit », monta dans la forteresse, sur la parole de Dhu al-Muwaynatayn, jusqu'au trésor du Nukhayrkan : deux corbeilles de joyaux sans pareils, vendues sur l'ordre d'Umar au jeune Qurashite Amr ibn Harith pour les parts des combattants ; celui-ci en revendit une à al-Hira pour le prix total et garda l'autre, son premier capital. La conquête tomba un mercredi de l'an 19, ou 20, et d'après Abu Ma'shar en 21 ; al-Nu'man avait campé à al-Isbidhar, al-Ash'ath à droite, al-Mughira à gauche."
  es: "En al-Baladhuri: cuando Yazdgard huyó de Hulwan en el año 19, los persas de Rayy, Qumis, Isbahan, Hamadhan y Mahayn se reunieron con él en el año 20 bajo el mando de Mardanshah Dhu al-Hajib detrás de Dirafsh-i Kabiyan — sesenta mil, algunos dicen cien mil. Ammar había escrito a Umar, quien tenía la intención de marchar él mismo, luego ordenó a dos tercios de Kufa salir con un destacamento de Basora y encargó a al-Nu'man ibn Muqarrin — 'no como recaudador de impuestos, sino como ghazi' — con una sucesión que iba de Hudhayfa, Jarir, al-Mughira, al-Ash'ath; al-Hurmuzan había aconsejado 'Isbahan es la cabeza, Adharbayjan las alas'. Los musulmanes se encadenaron de diez en diez y de cinco en cinco para no huir; las flechas persas hirieron a algunos antes de la batalla. Al-Nu'man anunció tres sacudidas de estandarte: primero la ablución, luego las espadas y las sandalias, y finalmente la carga sin que nadie se volviera hacia otro. Luchó con su pesada armadura; el primer mártir, el persa, partió el vientre de su mula. Ma'qil lo encontró respirando, le lavó la cara y le dio la noticia de la victoria: «¡Alabado sea Dios! Escribe a Umar». Hudhayfa tomó el estandarte y la conquista fue bautizada como Fath al-Futuh. Abu Uthman al-Nahdi le dio la noticia a Umar, quien lloró con la mano en la cabeza. Al-Sa'ib ibn al-Aqra' conservó el botín —'no pronuncies ninguna falsedad, no niegues ningún derecho'— y escaló la fortaleza por orden de Dhu al-Muwaynatayn hasta el tesoro de Nukhayrkan, dos cestas de joyas sin igual vendidas por orden de Umar al joven Qurashi Amr ibn Harith por las partes de los guerreros, quien revendió una en al-Hira por el precio total y se quedó con la otra —su primer capital—. La conquista se produjo un miércoles del año 19 o 20, y vía Abu Ma'shar el 21; al-Nu'man había acampado en al-Isbidhar, al-Ash'ath a la derecha, al-Mughira a la izquierda."
  ur: "البلادوری میں ہے: جب یزدگرد سنہ 19 میں حلوان سے فرار ہوا تو 20 میں رے، قمیس، اصبہان، حمادان اور ماہین کے فارسی مردان شاہ ذو الحجیب کے تحت دیرافش کبیان کے پیچھے اس کے پاس جمع ہوئے — ساٹھ ہزار، بعض کا کہنا ہے کہ ایک لاکھ۔ عمار نے عمر کو لکھا تھا، جس کا مقصد خود کوچ کرنا تھا، پھر کوفہ کے دو تہائی حصے کو بصرہ کے دستے کے ساتھ نکالنے کا حکم دیا اور النعمان بن مقرن پر الزام لگایا - 'ٹیکس اکٹھا کرنے والے کے طور پر نہیں، بلکہ غازی کے طور پر' - پے درپے حذیفہ، جریر، المغیرہ، العاشث چلا رہے ہیں۔ الحرموزان نے مشورہ دیا تھا کہ 'اسبہان سر ہے، ادھربایجان پروں'۔ مسلمانوں نے اپنے آپ کو دسیوں اور پانچوں زنجیروں میں جکڑ لیا کہیں وہ بھاگ نہ جائیں۔ فارسی تیروں نے جنگ سے پہلے کچھ زخمی کر دیے۔ النعمان نے تین جھنڈے ہلانے کا اعلان کیا - وضو، پھر تلواریں اور جوتے، پھر کسی کی طرف متوجہ نہ ہونے کا الزام - اور لڑا، اس کا زرہ بھاری، پہلا شہید، فارسی نے اپنے خچر کا پیٹ پھاڑ دیا۔ معقل نے اسے سانس لیتے ہوئے پایا، اس کا چہرہ دھویا، اسے فتح کی بشارت دی - 'خدا کی تعریف کرو؛ عمر کو لکھو۔ حذیفہ نے جھنڈا سنبھال لیا اور فتح کا نام فتح الفتوح رکھا۔ ابو عثمان النہدی نے عمر کو یہ خبر دی، وہ روتے ہوئے سر پر ہاتھ پھیرتے رہے۔ السائب ابن الاقراء کے پاس مال غنیمت تھا - 'جھوٹ کو نہ اٹھاؤ، حق کو نہ روکو' - ذو المویناتین کے کلمہ پر قلعہ پر چڑھ کر نخیرکان خزانہ تک پہنچا، عمر کے حکم پر بے مثال زیورات کی دو ٹوکریاں قریشی نوجوان عمرو بن حارثہ کے وارثوں کو فروخت کی گئیں۔ پوری قیمت کے لئے اور دوسرے کو رکھا - اس کا پہلا سرمایہ۔ فتح سال 19 یا 20 کے بدھ کو ہوئی اور ابو معشر 21 کے ذریعے ہوئی۔ النعمان نے الاسبدر میں ڈیرہ ڈالا تھا، دائیں طرف اشعث اور بائیں طرف المغیرہ۔"
  tr: "El-Baladhuri'ye göre: Yazdegerd, 19 yılında Hulvan'dan kaçtığında, Persler, Rayy, Kumis, İsfahan, Hamadan ve Mahin halkı mektuplaşarak 20 yılında Yazdegerd'in etrafında toplandılar. Yazdegerd, Mardanshah Zü'l-Hacib'i komutan olarak atadı ve Darfaşkabi sancaklarını çıkardılar. O zamanlar müşriklerin sayısı altmış bin, hatta yüz bin olduğu söyleniyordu. Ammar ibn Yasir, Ömer'e onların varlığından haberdar eden bir mektup yazmış ve kendisi de onlara karşı bir sefer düzenlemeyi planlamıştı. Ancak Arap güçlerinin yayılmasından korktuğu için Kufa halkına mektup yazarak ordularının üçte ikisini göndermelerini ve üçte birini de şehirlerini savunmak için bırakmalarını emretti. Ayrıca Basra'dan bir birlik göndererek, \"Mızraklarla ilk karşılaşacak bir adam atayacağım\" dedi. Ömer, Nu'man ibn Amr ibn Muqrin al-Muzani'yi komutan olarak atadı ve şöyle dedi: \"Eğer ben öldürülürsem, komutan Hudeyfe ibn al-Yaman olacak; o öldürülürse Cerir; o öldürülürse al-Mughirah; o öldürülürse al-Ash'ath ibn Qays olacak.\" Ömer, al-Hurmuzan'a danıştı ve o da şöyle dedi: \"İsfahan baş, Azerbaycan kanatlardır. Başı keserseniz kanatlar düşer.\" Bunun üzerine Nu'man'ı atadı ve o da şöyle dedi: \"Vergi tahsildarı olarak değil, savaşçı olarak.\" Müslümanlar daha sonra her birine onar adam zincirlediler. Kaçmamaları için zincirlediler ve Persler savaştan önce onlara ateş açarak bir grup adamı yaraladılar. Numan şöyle dedi: \"Sancakımı üç defa sallayacağım. İlkinde, adam abdest alsın ve ihtiyacını gidersin. İkincisinde, kılıcına ve kılıfına baksın ve işlerini yoluna koysun. Üçüncüsünde ise hücuma geçsin ve kimse kimseye sırtını dönmesin.\" Zırhı ağırdı, bu yüzden savaştı ve ilk öldürülen o oldu. Persli katırından düştü ve karnı yarıldı. Ma'kal yanına geldi ve hâlâ hayattaydı, bu yüzden yüzünü yıkadı ve ona zaferin müjdesini verdi. \"Allah'a hamd olsun. Ömer'e yaz.\" dedi. Huzeyfe sancağı aldı ve Allah onlara zafer verdi ve bu zafer, Zaferlerin Zaferi olarak adlandırıldı. Ebu Osman el-Nehdi, Ömer'e müjdeyi getirdi ve \"Numan öldürüldü\" dediğinde, \"Biz Allah'a aitiz\" dedi ve ağlayarak elini başına koydu. Ömer, ganimetlerin gözetimini el-Sa'ib ibn el-Aqra'ya verdi ve \"Yalan söyleme, gerçeği de gizleme\" dedi. Zü'l-Muveynatayn ona Nuhayr kalesinin hazinesini gösterdi. Amr ibn Harith kaleye tırmandı ve içinde daha önce hiç görülmemiş mücevherler bulunan iki sandık buldu. Ömer ona bunları satmasını ve gelirini paylaşmasını emretti. Amr ibn Harith, çocukların ve savaşçıların maaşlarıyla bunları satın aldı. Bunlardan birini Hira'da aldığı fiyata sattı, diğerini ise tercih etti. Bu, onun ilk kez servet edinmesiydi. Nahavand'ın fethi 19. yılda bir Çarşamba günü gerçekleşti ve 20. yılda gerçekleştiği rivayet edilir. Hasan ve Muhammed, Ebu Ma'şer'den 21. yılda rivayet etmişlerdir. Numan, İsbidhar'a indi ve sağ tarafa Aş'at bin Kays'ı, sol tarafa ise Muğire bin Şube'yi yerleştirdi."
  id: "Menurut al-Baladhuri: Ketika Yazdegerd melarikan diri dari Hulwan pada tahun 19, orang-orang Persia, penduduk Rayy, Qumis, Isfahan, Hamadan, dan Mahin berkorespondensi dan berkumpul di sekitar Yazdegerd pada tahun 20. Ia menunjuk Mardanshah Dhu al-Hajib sebagai komandan mereka, dan mereka membawa panji mereka, Darfashkabian. Jumlah kaum politeis pada waktu itu adalah enam puluh ribu, atau dikatakan, seratus ribu. Ammar ibn Yasir telah menulis surat kepada Umar untuk memberitahukan kehadiran mereka, dan ia bermaksud memimpin kampanye melawan mereka sendiri. Namun, ia khawatir akan penyebaran pasukan Arab, jadi ia menulis surat kepada penduduk Kufa, memerintahkan mereka untuk mengirim dua pertiga pasukan mereka dan meninggalkan sepertiga untuk mempertahankan kota mereka. Ia juga mengirim kontingen dari Basra, dengan mengatakan, \"Aku akan menunjuk seorang pria yang akan menjadi orang pertama yang menghadapi tombak-tombak itu.\" Ia menunjuk Nu'man ibn Amr ibn Muqrin al-Muzani, seraya berkata, \"Jika aku terbunuh, maka komandannya adalah Hudhayfah ibn al-Yaman; jika ia terbunuh, maka Jarir; jika ia terbunuh, maka al-Mughirah; jika ia terbunuh, maka al-Ash'ath ibn Qays.\" Umar berkonsultasi dengan al-Hurmuzan, yang berkata, \"Isfahan adalah kepala, dan Azerbaijan adalah sayapnya. Jika kau memenggal kepalanya, sayapnya akan jatuh.\" Ia menunjuk Nu'man, yang berkata, \"Bukan sebagai pemungut pajak, tetapi sebagai pejuang.\" Kemudian kaum Muslimin merantai sepuluh orang di setiap rantai. Rantai itu dibuat agar mereka tidak melarikan diri, dan orang-orang Persia menembaki mereka sebelum pertempuran, melukai sebagian dari mereka. Al-Nu'man berkata, \"Aku akan mengibarkan panjiku tiga kali. Pertama, biarkan orang itu berwudhu dan buang air. Kedua, biarkan dia melihat pedangnya dan talinya serta menyelesaikan urusannya. Ketiga, serang, dan jangan ada yang berbalik melawan siapa pun.\" Baju zirahnya terasa berat, jadi dia bertempur dan menjadi orang pertama yang terbunuh. Orang Persia itu jatuh dari keledainya, dan perutnya robek. Ma'qal datang kepadanya, dan dia masih hidup, jadi dia membasuh wajahnya dan memberinya kabar gembira tentang kemenangan. Dia berkata, \"Segala puji bagi Allah. Tulislah surat kepada Umar.\" Hudhayfah mengambil panji itu, dan Allah menganugerahkan mereka kemenangan, dan kemenangan itu disebut Kemenangan dari Segala Kemenangan. Abu Uthman al-Nahdi menyampaikan kabar gembira itu kepada Umar, dan ketika dia berkata, \"Al-Nu'man telah terbunuh,\" dia berkata, \"Segala milik Allah,\" dan dia menangis dan meletakkan tangannya di atas kepalanya. Ia menunjuk al-Sa'ib ibn al-Aqra' untuk mengawasi rampasan perang dan berkata, \"Jangan menyebarkan kebohongan, dan jangan pula menyembunyikan kebenaran.\" Dhu al-Muwaynatayn menunjukkan kepadanya harta karun al-Nukhayr, yang berada di dalam benteng. Ia memanjatnya dan menemukan dua peti berisi permata yang belum pernah dilihat sebelumnya. Umar memerintahkannya untuk menjualnya dan membagi hasilnya. Amr ibn Harith membelinya dengan uang saku anak-anak dan para pejuang. Ia menjual salah satunya di Hira dengan harga yang sama dengan harga belinya, dan yang lainnya lebih diutamakan. Ini adalah pertama kalinya ia memperoleh kekayaan. Penaklukan Nahavand terjadi pada tahun 19 pada hari Rabu, dan dikatakan pada tahun 20. Al-Hasan dan Muhammad berkata atas otoritas Abu Ma’shar pada tahun 21. Al-Nu’man turun ke Al-Isbidhar dan menempatkan Al-Ash’ath bin Qais di sebelah kanan dan Al-Mughirah bin Shu’bah di sebelah kiri."
