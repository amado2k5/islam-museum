label: { ar: "يوم نهاوند فتح الفتوح", en: "The Battle of Nihawand (Fath al-Futuh)" }
summary:
  ar: "عند البلاذري: لما هرب يزدجرد من حلوان في سنة 19 تكاتبت الفرس وأهل الري وقومس وأصبهان وهمذان والماهين وتجمعوا إلى يزدجرد وذلك في سنة 20 فأمر عليهم مردانشاه ذا الحاجب وأخرجوا رايتهم الدرفشكابيان وكانت عدة المشركين يومئذ ستين ألفاً ويقال مائة ألف وقد كان عمار بن ياسر كتب إلى عمر بخبرهم فهم أن يغزوهم بنفسه ثم خاف انتشار أمر العرب فكتب إلى أهل الكوفة أن يسير ثلثاهم ويبقى ثلثهم لحفظ بلدهم وبعث من أهل البصرة بعثاً وقال لأستعمطن رجلاً يكون لأول ما يلقاه من الأسنة فولى النعمان بن عمرو بن مقرن المزني وقال إن أصبت فالأمير حذيفة بن اليمان فإن أصيب فجرير فإن أصيب فالمغيرة فإن أصيب فالأشعث بن قيس وشاور عمر الهرمزان فقال أصبهان الرأس وأذربيجان الجناحان فإن قطعت الرأس سقط الجناحان واستعمل النعمان فقال أما جابياً فلا ولكن غازياً وسلسل المسلمون كل عشرة في سلسلة لئلا يفروا ورماهم الفرس قبل القتال فجرحوا منهم جماعة وقال النعمان إني هاز لوائي ثلاث هزات فأما الأولى فليتوضأ الرجل وليقض حاجته وأما الثانية فلينظر إلى سيفه وشسعه وليصلح شأنه وأما الثالثة فاحملوا ولا يلوين أحد على أحد وثقل درعه عليه فقاتل فكان أول قتيل وسقط الفارسي عن بغلته فاتشق بطنه فأتاه معقل وبه رمق فغسل وجهه فبشره بالفتح فقال الحمد لله اكتبوا إلى عمر وأخذ حذيفة الراية ففتح الله عليهم وسمي ذلك الفتح فتح الفتوح وأتى أبو عثمان النهدي عمر بالبشارة فلما قال قتل النعمان قال إنا لله وبكى ووضع يده على رأسه وولى السائب بن الأقرع الغنائم وقال لا ترفعن باطلاً ولا تحبسن حقاً فدله ذو الموينتين على كنز النخيركان في القلعة فصعدها فإذا سفطان فيهما جوهر لم ير مثله قط فأمره عمر ببيعهما وقسم ثمنهما فاشتراهما عمرو بن حارث بأعطيات الذرية والمقاتلة فباع أحدهما بالحيرة بما اشتراهما به وفضل الآخر فكان أول لهوة مال اتخذها وكان فتح نهاوند في سنة 19 يوم الأربعاء ويقال سنة 20 وقال الحسن ومحمد عن أبي معشر سنة 21 ونزل النعمان الإسبيذار فجعل الأشعث بن قيس على الميمنة والمغيرة بن شعبة على الميسرة."
  en: "In al-Baladhuri: when Yazdgard fled Hulwan in year 19, Persians of Rayy, Qumis, Isbahan, Hamadhan and the Mahayn gathered to him in year 20 under Mardanshah Dhu al-Hajib behind the Dirafsh-i Kabiyan — sixty thousand, some say a hundred thousand. Ammar had written Umar, who meant to march himself, then ordered two-thirds of Kufa out with a Basra detachment and charged al-Nu'man ibn Muqarrin — 'not as tax-gatherer, but as ghazi' — with succession running Hudhayfa, Jarir, al-Mughira, al-Ash'ath; al-Hurmuzan had counseled 'Isbahan is the head, Adharbayjan the wings.' The Muslims chained themselves in tens and fives lest they flee; Persian arrows wounded some before battle. Al-Nu'man announced three banner-shakes — ablution, then swords and shoes, then charge with none turning to another — and fought, his armor heavy, the first martyr, the Persian splitting his mule's belly; Ma'qil found him breathing, washed his face, gave him the tidings of victory — 'praise God; write to Umar.' Hudhayfa took the banner and the conquest was named Fath al-Futuh. Abu Uthman al-Nahdi bore the news to Umar, who wept, hand on head. Al-Sa'ib ibn al-Aqra' held the spoils — 'raise no falsehood, withhold no right' — climbed the fortress on Dhu al-Muwaynatayn's word to the Nukhayrkan treasure, two baskets of unmatched jewels sold at Umar's order to the Qurashi youth Amr ibn Harith for the warriors' shares, who resold one at al-Hira for the whole price and kept the other — his first capital. The conquest fell a Wednesday of year 19, or 20, and via Abu Ma'shar 21; al-Nu'man had camped at al-Isbidhar, al-Ash'ath on the right, al-Mughira the left."
