label: { ar: "احتضار حذيفة بن اليمان بالمدائن وأمره في كفنه", en: "The deathbed of Hudhayfa ibn al-Yaman at al-Mada'in and his instruction about his shroud", ur: "مدائن میں حذیفہ بن الیمان کی نزع اور کفن سے متعلق ان کی ہدایت", es: "El lecho de muerte de Hudhayfa ibn al-Yaman en al-Mada'in y sus instrucciones sobre su mortaja.", fr: "Le lit de mort de Hudhayfa ibn al-Yaman à al-Mada'in et ses instructions concernant son linceul", tr: "Huzeyfe ibn el-Yaman'ın el-Meda'in'de ölümü ve kefenindeki olay", id: "Kematian Hudhayfah ibn al-Yaman di al-Mada'in dan perselingkuhannya dengan kain kafannya" }
summary:
  ar: "مرض حذيفة بن اليمان بالمدائن فركب إليه أبو مسعود الأنصاري في نفر، فأتوه في جوف الليل، فسألهم هل جاؤوا بأكفانه، ونهاهم عن المغالاة في كفنه، وقال إنه لا يكفّنه إلا ريطتان بيضاوان {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}. وبكى حين نزل به الموت فقال إنه لا يبكي أسفاً على الدنيا وإنما لا يدري أيقدم على رضا أم سخط، وأوصى أبا مسعود، ثم قال إن هذه آخر ساعة من الدنيا {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}. ويذكر ابن عبد البر أنه مات سنة ست وثلاثين بعد قتل عثمان في أول خلافة علي، وقيل خمس وثلاثين {cite:isti-ab-ibn-abd-al-barr scan vol. 2 p. 138}."
  en: "When Hudhayfa ibn al-Yaman fell ill at al-Mada'in, Abu Mas'ud al-Ansari rode to him with a party and they reached him in the middle of the night; he asked whether they had brought his shrouds, told them not to be extravagant over his shroud, and said only two white sheets should shroud him {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}. He wept as death came, saying he did not weep in regret for the world but because he did not know whether he was going to approval or anger; he charged Abu Mas'ud, and said this was the last hour of the world {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}. Ibn Abd al-Barr says he died in 36 AH after Uthman's killing, early in Ali's caliphate, or in 35 by another report {cite:isti-ab-ibn-abd-al-barr scan vol. 2 p. 138}."
  ur: "جب حذیفہ بن الیمان مدائن میں بیمار ہوئے تو ابو مسعود انصاری چند افراد کے ساتھ سوار ہو کر ان کے پاس آئے اور آدھی رات کو پہنچے؛ حذیفہ نے پوچھا کہ کیا ان کے کفن لائے ہیں، کفن میں غلو سے منع کیا، اور کہا کہ انھیں صرف دو سفید چادریں کفنائیں {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}۔ موت آئی تو روئے اور کہا کہ وہ دنیا کے افسوس میں نہیں روتے بلکہ اس لیے کہ نہیں جانتے کہ رضا کی طرف جا رہے ہیں یا ناراضی کی طرف؛ انھوں نے ابو مسعود کو وصیت کی اور کہا کہ یہ دنیا کی آخری گھڑی ہے {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}۔ ابن عبد البر لکھتے ہیں کہ وہ عثمان کے قتل کے بعد علی کی خلافت کے آغاز میں ۳۶ ہجری میں فوت ہوئے، ایک قول میں ۳۵ ہجری {cite:isti-ab-ibn-abd-al-barr scan vol. 2 p. 138}۔"
  es: "Cuando Hudhayfa ibn al-Yaman enfermó en al-Mada'in, Abu Mas'ud al-Ansari cabalgó hacia él con un grupo y llegaron a él en medio de la noche; preguntó si habían traído sus sudarios, les dijo que no fueran extravagantes con su sudario y que solo dos sábanas blancas debían envolverlo {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}. Lloró al acercarse la muerte, diciendo que no lloraba por arrepentimiento por el mundo sino porque no sabía si iba a la aprobación o a la ira; acusó a Abu Mas'ud y dijo que esta era la última hora del mundo {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}. Ibn Abd al-Barr dice que murió en el año 36 AH después del asesinato de Uthman, al principio del califato de Ali, o en el año 35 según otro informe {cite:isti-ab-ibn-abd-al-barr scan vol. 2 p. 138}."
  fr: "Lorsque Hudhayfa ibn al-Yaman tomba malade à al-Mada'in, Abu Mas'ud al-Ansari vint à lui avec un groupe et ils le rejoignirent au milieu de la nuit. Il leur demanda s'ils avaient apporté son linceul, leur recommanda de ne pas être extravagants et précisa que deux draps blancs suffisaient à l'envelopper. À l'approche de la mort, il pleura, disant qu'il ne pleurait pas par regret pour ce monde, mais parce qu'il ignorait s'il allait connaître la paix ou la colère. Il lança à Abu Mas'ud que c'était la dernière heure du monde. Ibn Abd al-Barr dit qu'il est mort en 36 AH après le meurtre d'Uthman, au début du califat d'Ali, ou en 35 selon un autre rapport {cite:isti-ab-ibn-abd-al-barr scan vol. 2 p. 138}."
  tr: "Huzeyfe ibn el-Yaman, Medine'de hastalandı. Bunun üzerine Ebu Mes'ud el-Ensari, bir grup adamla birlikte ona gitti. Gece yarısı vardılar ve onlara kefenini getirip getirmediklerini sordu. Kefeninde aşırıya kaçmamalarını, sadece iki beyaz bezle kefenlenmesi gerektiğini söyledi. {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}. Ölüm yaklaşınca ağladı ve bu dünya için pişmanlıktan değil, Allah'ın rızasını mı yoksa gazabını mı göreceğini bilmediği için ağladığını söyledi. Son talimatlarını Ebu Mes'ud'a verdi ve sonra, \"Bu dünyanın son saatidir\" dedi. {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}. İbn Abdülbarr, onun otuz altıncı yılda, Osman'ın öldürülmesinden sonra, Ali'nin halifeliğinin başlangıcında öldüğünü belirtir. Ayrıca otuz beşinci yılda öldüğü de söylenir. {cite:isti-ab-ibn-abd-al-barr scan vol. 2 p. 138}."
  id: "Hudhayfah ibn al-Yaman jatuh sakit di al-Mada'in, sehingga Abu Mas'ud al-Ansari pergi menemuinya bersama sekelompok orang. Mereka tiba di tengah malam, dan ia bertanya kepada mereka apakah mereka telah membawa kain kafannya. Ia melarang mereka untuk berlebihan dalam membungkus jenazahnya, dengan mengatakan bahwa ia hanya perlu dibungkus dengan dua kain putih. {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}. Ketika ajal menjemput, ia menangis, mengatakan bahwa ia tidak menangis karena menyesal atas dunia ini, tetapi karena ia tidak tahu apakah ia akan bertemu dengan keridhaan Allah atau murka-Nya. Ia memberikan instruksi terakhirnya kepada Abu Mas'ud, lalu berkata, \"Ini adalah saat terakhir dunia ini.\" {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}. Ibn 'Abd al-Barr menyebutkan bahwa ia wafat pada tahun 36, setelah pembunuhan 'Uthman, pada awal kekhalifahan 'Ali. Ada juga yang mengatakan bahwa ia wafat pada tahun 35. {cite:isti-ab-ibn-abd-al-barr scan vol. 2 p. 138}."
