tags: [wasaya-browser, wasaya-companions, wasaya-ihtidar, wasaya-wasiyya, wasaya-marqad]
label: { ar: "احتضار حذيفة بن اليمان بالمدائن وأمره في كفنه", en: "The deathbed of Hudhayfa ibn al-Yaman at al-Mada'in and his instruction about his shroud", ur: "مدائن میں حذیفہ بن الیمان کی نزع اور کفن سے متعلق ان کی ہدایت" }
summary:
  ar: "مرض حذيفة بن اليمان بالمدائن فركب إليه أبو مسعود الأنصاري في نفر، فأتوه في جوف الليل، فسألهم هل جاؤوا بأكفانه، ونهاهم عن المغالاة في كفنه، وقال إنه لا يكفّنه إلا ريطتان بيضاوان {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}. وبكى حين نزل به الموت فقال إنه لا يبكي أسفاً على الدنيا وإنما لا يدري أيقدم على رضا أم سخط، وأوصى أبا مسعود، ثم قال إن هذه آخر ساعة من الدنيا {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}. ويذكر ابن عبد البر أنه مات سنة ست وثلاثين بعد قتل عثمان في أول خلافة علي، وقيل خمس وثلاثين {cite:isti-ab-ibn-abd-al-barr scan vol. 2 p. 138}."
  en: "When Hudhayfa ibn al-Yaman fell ill at al-Mada'in, Abu Mas'ud al-Ansari rode to him with a party and they reached him in the middle of the night; he asked whether they had brought his shrouds, told them not to be extravagant over his shroud, and said only two white sheets should shroud him {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}. He wept as death came, saying he did not weep in regret for the world but because he did not know whether he was going to approval or anger; he charged Abu Mas'ud, and said this was the last hour of the world {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}. Ibn Abd al-Barr says he died in 36 AH after Uthman's killing, early in Ali's caliphate, or in 35 by another report {cite:isti-ab-ibn-abd-al-barr scan vol. 2 p. 138}."
  ur: "جب حذیفہ بن الیمان مدائن میں بیمار ہوئے تو ابو مسعود انصاری چند افراد کے ساتھ سوار ہو کر ان کے پاس آئے اور آدھی رات کو پہنچے؛ حذیفہ نے پوچھا کہ کیا ان کے کفن لائے ہیں، کفن میں غلو سے منع کیا، اور کہا کہ انھیں صرف دو سفید چادریں کفنائیں {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}۔ موت آئی تو روئے اور کہا کہ وہ دنیا کے افسوس میں نہیں روتے بلکہ اس لیے کہ نہیں جانتے کہ رضا کی طرف جا رہے ہیں یا ناراضی کی طرف؛ انھوں نے ابو مسعود کو وصیت کی اور کہا کہ یہ دنیا کی آخری گھڑی ہے {cite:tarikh-dimashq-ibn-asakir-fikr-1995 scan vol. 2 p. 106}۔ ابن عبد البر لکھتے ہیں کہ وہ عثمان کے قتل کے بعد علی کی خلافت کے آغاز میں ۳۶ ہجری میں فوت ہوئے، ایک قول میں ۳۵ ہجری {cite:isti-ab-ibn-abd-al-barr scan vol. 2 p. 138}۔"
