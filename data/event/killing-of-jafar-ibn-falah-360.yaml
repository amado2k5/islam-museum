label: { ar: "مقتل جعفر بن فلاح على يد القرمطي الأعصم" }
summary:
  ar: "في سنة ستين وثلاثمائة نزل جعفر بن فلاح الكتامي نائب بني عبيد على الشام إلى الدكة فوق نهر يزيد بظاهر دمشق، فقصده الحسن بن أحمد القرمطي المعروف بالأعصم فخرج إليه جعفر وهو عليل فظفر به القرمطي فأسره وقتله وقتل من أصحابه خلقاً كثيراً، وذلك يوم الخميس سادس ذي القعدة؛ وكان جعفر أول نائب ولي دمشق لبني عبيد، أخذ الرملة في ذي الحجة سنة ثمان وخمسين ثم دمشق في المحرم سنة تسع وخمسين بعد أن قاتل أهلها {cite:shadharat-dhahab p. 29}."
  en: "In 360 the Fatimids' first governor of Damascus, Ja'far b. Fallah al-Kutami, camped sick at the dikka above the Yazid river outside the city; the Qarmati al-A'sam fell on him, captured and killed him with many of his men on Thursday 6 Dhu'l-Qa'da — Ja'far had taken Ramla in 358 and Damascus in 359 {cite:shadharat-dhahab p. 29}."
