id: event/killing-of-jafar-ibn-falah-360
class: event
kind: death
label: { ar: "مقتل جعفر بن فلاح على يد القرمطي الأعصم", en: "The killing of Ja'far ibn Fallah at the hands of the Qarmatian al-A'sam", es: "El asesinato de Ja'far ibn Fallah a manos del cármata al-A'sam", fr: "Le meurtre de Ja'far ibn Fallah par le Qarmate al-A'sam", ur: "قرمطین الاعصام کے ہاتھوں جعفر بن فلہ کا قتل" }
summary:
  ar: "في سنة ستين وثلاثمائة نزل جعفر بن فلاح الكتامي نائب بني عبيد على الشام إلى الدكة فوق نهر يزيد بظاهر دمشق، فقصده الحسن بن أحمد القرمطي المعروف بالأعصم فخرج إليه جعفر وهو عليل فظفر به القرمطي فأسره وقتله وقتل من أصحابه خلقاً كثيراً، وذلك يوم الخميس سادس ذي القعدة؛ وكان جعفر أول نائب ولي دمشق لبني عبيد، أخذ الرملة في ذي الحجة سنة ثمان وخمسين ثم دمشق في المحرم سنة تسع وخمسين بعد أن قاتل أهلها {cite:shadharat-dhahab p. 29}."
  en: "In 360 the Fatimids' first governor of Damascus, Ja'far b. Fallah al-Kutami, camped sick at the dikka above the Yazid river outside the city; the Qarmati al-A'sam fell on him, captured and killed him with many of his men on Thursday 6 Dhu'l-Qa'da — Ja'far had taken Ramla in 358 and Damascus in 359 {cite:shadharat-dhahab p. 29}."
  es: "En 360, el primer gobernador fatimí de Damasco, Ja'far b. Fallah al-Kutami, acampó enfermo en la dikka sobre el río Yazid, a las afueras de la ciudad; el Qarmati al-A'sam lo atacó, lo capturó y lo mató junto con muchos de sus hombres el jueves 6 de Dhu'l-Qa'da. Ja'far había tomado Ramla en 358 y Damasco en 359 {cite:shadharat-dhahab p. 29}."
  fr: "En 360, le premier gouverneur fatimide de Damas, Ja'far b. Fallah al-Kutami, campa malade au dikka au-dessus de la rivière Yazid à l'extérieur de la ville; les Qarmati al-A'sam tombèrent sur lui, le capturèrent et le tuèrent avec beaucoup de ses hommes le jeudi 6 Dhu'l-Qa'da — Ja'far avait pris Ramla en 358 et Damas en 359 {cite:shadharat-dhahab p. 29}."
  ur: "360 میں فاطمیوں کا دمشق کا پہلا گورنر جعفر بن۔ فلہ الکطامی، شہر سے باہر دریائے یزید کے اوپر دِکا کے مقام پر بیماروں نے ڈیرے ڈالے۔ قرامطی الاعصام اس پر گرا، 6 ذی القعدہ جمعرات کو اپنے بہت سے آدمیوں کے ساتھ اسے گرفتار کر کے قتل کر دیا - جعفر نے 358 میں رملہ اور 359 میں دمشق پر قبضہ کر لیا تھا۔ 29}۔"
