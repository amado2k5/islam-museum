label: { ar: "قتل المركيس صاحب صور", en: "The assassination of the Marquis of Tyre (588 AH)", es: "El asesinato del marqués de Tiro (588 AH)", fr: "L'assassinat du marquis de Tyr (588 AH)", ur: "مارقیس آف ٹائر کا قتل ⁦(588ھ)⁩", tr: "Marki, resimlerin sahibini öldürdü.", id: "Marquis membunuh pemilik lukisan-lukisan itu." }
summary:
  ar: "في ثالث عشر ربيع الآخر سنة ثمان وثمانين وخمسمائة قُتل المركيس الفرنجي صاحب صور — وكان عند ابن الأثير أكبر شياطين الفرنج؛ ويروي ابن الأثير أن صلاح الدين راسل مقدم الإسماعيلية سنان أن يُرسل من يقتل ملك إنكلتار وإن قتل المركيس فله عشرة آلاف دينار، فلم يكن قتل ملك إنكلتار ممكناً ولم يره سنان مصلحة لئلا يتفرغ صلاح الدين لهم، فأرسل رجلين في زي الرهبان اتصلا بصاحب صيدا وبابن بيرزان صاحب الرملة وكانا مع المركيس بصور فأقاما ستة أشهر يظهران العبادة حتى ائتمن بهما المركيس ووثق إليهما، فوثبا عليه يوم دعوة الأسقف فجرحاه جراحاً وثيقة وهرب أحدهما إلى كنيسة فلما حُمل المركيس إليها ليُشد جرحه وثب عليه فقتله، وقُتل الرجلان بعده؛ ونسب الفرنج قتله إلى ملك إنكلتار لينفرد بملك الساحل {cite:kamil-ibn-al-athir p. 213-214}."
  en: "13 Rabi' II 588 (April 1192): the Marquis of Tyre — 'greatest of the Frankish devils' — was cut down by two Assassins in monks' garb who had spent six months in the households of Sidon's lord and Ibn Barzan winning his trust; wounded at a bishop's banquet, he was carried to a church where one of them, hiding inside, finished him; Ibn al-Athir reports Saladin had offered Sinan ten thousand dinars for the deed or for Richard's, and the Franks blamed the English king {cite:kamil-ibn-al-athir p. 213-214}."
  es: "13 Rabi' II 588 (abril de 1192): el marqués de Tiro —'el más grande de los demonios francos'— fue asesinado por dos asesinos vestidos de monjes que habían pasado seis meses en las casas del señor de Sidón e Ibn Barzan ganándose su confianza; herido en un banquete episcopal, fue llevado a una iglesia donde uno de ellos, escondido dentro, lo remató; Ibn al-Athir informa que Saladino había ofrecido a Sinan diez mil dinares por el acto o por el de Ricardo, y los francos culparon al rey inglés {cite:kamil-ibn-al-athir p. 213-214}."
  fr: "13 Rabi' II 588 (avril 1192): le marquis de Tyr — « le plus grand des démons francs » — fut assassiné par deux hommes déguisés en moines qui avaient passé six mois dans les maisons du seigneur de Sidon et d'Ibn Barzan, gagnant sa confiance; blessé lors d'un banquet d'évêque, il fut transporté dans une église où l'un d'eux, caché à l'intérieur, l'acheva; Ibn al-Athir rapporte que Saladin avait offert dix mille dinars à Sinan pour cet acte ou pour celui de Richard, et les Francs blâmèrent le roi anglais {cite: kamil-ibn-al-athir p. 213-214}."
  ur: "13 ربیع II 588 ⁦(اپریل 1192)⁩: ٹائر کے مارکوئس - 'فرانکش شیطانوں میں سب سے بڑا' - کو راہبوں کے لباس میں دو قاتلوں نے کاٹ دیا جنہوں نے چھ ماہ سائڈن کے مالک کے گھرانوں میں گزارے تھے اور ابن برزان نے اس کا اعتماد جیت لیا تھا۔ ایک بشپ کی ضیافت میں زخمی ہو کر، اسے ایک چرچ لے جایا گیا جہاں ان میں سے ایک نے اندر چھپ کر اسے ختم کر دیا۔ ابن الاثیر کا بیان ہے کہ صلاح الدین نے سنان کو دس ہزار دینار کی پیشکش کی تھی یا رچرڈ کے لیے، اور فرینکوں نے انگریز بادشاہ کو مورد الزام ٹھہرایا۔ 213-214}۔"
  tr: "Hicri 588 yılının Rebiü'l-Sani ayının on üçüncü gününde, Frankların Sur Markisi öldürüldü; İbn el-Athir'e göre bu, Frankların en büyük şeytanlarından biriydi. İbn el-Athir, Selahaddin'in İsmailî lideri Sinan'a bir mesaj göndererek, Markiz öldürülürse kendisine on bin dinar vaat ederek İngiltere Kralı'nı öldürmesi için birini göndermesini istediğini anlatır. İngiltere Kralı'nı öldürmek mümkün değildi ve Sinan, Selahaddin'in onlarla meşgul olmasından korktuğu için bunu faydalı görmedi. Bu yüzden, Sidon hükümdarı ve Ramla hükümdarı İbn Birzan ile temasa geçen, keşiş kılığına girmiş iki adam gönderdi. Bu adamlar Sur'da Markiz ile birlikte altı ay kaldılar ve Markiz onlara güvenip sırlarını paylaşana kadar dindarlık numarası yaptılar. Piskoposun çağrıldığı gün, ona saldırdılar ve ağır yaralar verdiler. Onlardan biri bir kiliseye kaçtı ve Markiz yarası sarılmak üzere oraya götürüldüğünde, ona saldırdı ve öldürdü. İki adam da ondan sonra öldürüldü. Franklar, kıyı şeridini ele geçirmek için bu cinayeti İngiltere Kralı'na atfettiler. {cite:kamil-ibn-al-athir s. 213-214}"
  id: "Pada tanggal 13 Rabi' al-Thani tahun 588 H, Marquis Frankia dari Tirus terbunuh—dan menurut Ibn al-Athir, ia adalah iblis Frankia terbesar. Ibn al-Athir menceritakan bahwa Saladin mengirim pesan kepada pemimpin Ismaili, Sinan, memintanya untuk mengirim seseorang untuk membunuh Raja Inggris, dengan menjanjikan sepuluh ribu dinar jika Marquis terbunuh. Membunuh Raja Inggris tidak mungkin, dan Sinan tidak melihatnya sebagai hal yang menguntungkan, karena khawatir Saladin akan sibuk dengan mereka. Maka ia mengirim dua orang yang berpakaian seperti biarawan yang menghubungi penguasa Sidon dan Ibn Birzan, penguasa Ramla. Mereka bersama Marquis di Tirus dan tinggal selama enam bulan, berpura-pura saleh, sampai Marquis mempercayai mereka dan menceritakan rahasianya kepada mereka. Pada hari uskup dipanggil, mereka menyerangnya, menyebabkan luka parah. Salah satu dari mereka melarikan diri ke sebuah gereja, dan ketika Marquis dibawa ke sana untuk membalut lukanya, ia menyerangnya dan membunuhnya. Kedua pria itu dibunuh setelahnya. Orang-orang Frank menuduh Raja Inggris sebagai pelaku pembunuhannya agar ia dapat menguasai wilayah pesisir. {cite:kamil-ibn-al-athir p. 213-214}"
