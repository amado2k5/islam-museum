label: { ar: "يوم الشقيقة ومقتل بسطام بن قيس" }
summary:
  ar: "يوم الشقيقة، يوم لبني ضبة بن أد على شيبان قُتل فيه بسطام بن قيس سيد شيبان؛ غزا بسطام بن قيس بن مسعود بن خالد بن عبد الله ذي الجدين بني ضبة ومعه أخوه السليل ونقيد زاجر الطير الأسدي، فرأى بسطام في المنام كأن آتياً قال له الدلو تأتي الغرب المزله فقصها على نقيد فتطير وقال ألا قلت ثم تعود بادياً مبتله فتفرط عنك النحوس، وعصى بسطام ففارقه نقيد، وأغار على إبل مالك بن المنتفق الضبي ألف ناقة مرتبعة وفيها فحل أعور يقال له أبو شاعر، فلما لحقت خيل ضبة قال مالك ارموا روايا القوم فجعلوا يشقونها، وجاء عاصم بن خليفة الصباحي وكان ضعيف العقل يعقب قناة يقول أقتل عليها بسطاماً، فقتل بسطام يومئذ وكان أخريات الناس على فرسه الأدهم الزعفران يحمي أصحابه {cite:kamil-ibn-al-athir p. 461-462}."
  en: "The day of al-Shaqiqa, Dabba's day over Shayban, when their sayyid Bustam ibn Qays fell: warned in a dream and by the bird-diviner Naqid he raided Malik ibn al-Muntafiq's thousand-camel herd anyway, holding the rear on his dark stallion al-Za'faran — until the half-wit Asim ibn Khalifa, who had long kept a spear 'to kill Bustam on', took him {cite:kamil-ibn-al-athir p. 461-462}."
