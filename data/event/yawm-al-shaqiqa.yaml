label: { ar: "يوم الشقيقة ومقتل بسطام بن قيس", en: "The Day of al-Shaqiqa and the Killing of Bustam ibn Qays", es: "El día de al-Shaqiqa y el asesinato de Bustam ibn Qays", fr: "Le jour d'al-Shaqiqa et le meurtre de Bustam ibn Qays", ur: "یوم شقیقہ اور قتل بسطام بن قیس", tr: "Kız kardeşin günü ve Bustam ibn Qays'ın öldürülmesi", id: "Hari kematian saudari dan pembunuhan Bustam bin Qays" }
summary:
  ar: "يوم الشقيقة، يوم لبني ضبة بن أد على شيبان قُتل فيه بسطام بن قيس سيد شيبان؛ غزا بسطام بن قيس بن مسعود بن خالد بن عبد الله ذي الجدين بني ضبة ومعه أخوه السليل ونقيد زاجر الطير الأسدي، فرأى بسطام في المنام كأن آتياً قال له الدلو تأتي الغرب المزله فقصها على نقيد فتطير وقال ألا قلت ثم تعود بادياً مبتله فتفرط عنك النحوس، وعصى بسطام ففارقه نقيد، وأغار على إبل مالك بن المنتفق الضبي ألف ناقة مرتبعة وفيها فحل أعور يقال له أبو شاعر، فلما لحقت خيل ضبة قال مالك ارموا روايا القوم فجعلوا يشقونها، وجاء عاصم بن خليفة الصباحي وكان ضعيف العقل يعقب قناة يقول أقتل عليها بسطاماً، فقتل بسطام يومئذ وكان أخريات الناس على فرسه الأدهم الزعفران يحمي أصحابه {cite:kamil-ibn-al-athir p. 461-462}."
  en: "The day of al-Shaqiqa, Dabba's day over Shayban, when their sayyid Bustam ibn Qays fell: warned in a dream and by the bird-diviner Naqid he raided Malik ibn al-Muntafiq's thousand-camel herd anyway, holding the rear on his dark stallion al-Za'faran — until the half-wit Asim ibn Khalifa, who had long kept a spear 'to kill Bustam on', took him {cite:kamil-ibn-al-athir p. 461-462}."
  es: "El día de al-Shaqiqa, el día de Dabba sobre Shayban, cuando cayó su sayyid Bustam ibn Qays: advertido en un sueño y por el adivino de aves Naqid, asaltó de todos modos el rebaño de mil camellos de Malik ibn al-Muntafiq, manteniendo la retaguardia en su oscuro semental al-Za'faran, hasta que el medio tonto Asim ibn Khalifa, que había guardado durante mucho tiempo una lanza 'para matar a Bustam', lo tomó {cite:kamil-ibn-al-athir p. 461-462}."
  fr: "Le jour d'al-Shaqiqa, le jour de Dabba sur Shayban, où leur sayyid Bustam ibn Qays tomba: averti en rêve et par l'ornithologue Naqid, il attaqua quand même le troupeau de mille chameaux de Malik ibn al-Muntafiq, tenant l'arrière sur son étalon sombre al-Za'faran — jusqu'à ce que le demi-sage Asim ibn Khalifa, qui avait longtemps gardé une lance « pour tuer Bustam », le prenne {cite:kamil-ibn-al-athir p. 461-462}."
  ur: "شقیقہ کا دن، شعبان پر دنبہ کا دن، جب ان کے سید بسطام بن قیس کا گرا: خواب میں انتباہ کیا اور پرندہ نقید کے ذریعہ اس نے مالک بن المنتفق کے ہزار اونٹوں کے ریوڑ پر بہرحال چھاپہ مارا، اس کے عقبی حصے کو اس کے تاریک گھوڑے پر پکڑے ہوئے تھے۔ بسطام کو قتل کرنے کے لیے ایک نیزہ رکھا، اسے لے لیا {حوالہ: کامل ابن الاثیر ص 461-462}۔"
  tr: "Kardeşler Günü, Beni Dabba ibn Ad'ın Şeyban'a karşı savaştığı ve Şeyban'ın reisi Bustam ibn Kays'ın öldürüldüğü gündür. Bustam ibn Kays ibn Mesud ibn Halid ibn Abdullah Zülcadeyn, Beni Dabba'ya baskın düzenledi ve yanında kardeşi Salil ve Asadi'nin kuş falcısı Nukayd vardı. Bustam rüyasında birinin gelip kendisine, \"Kova hain batıya geliyor\" dediğini gördü. Bunun üzerine Nukayd'a anlattı. Nukayd uçarak uzaklaştı ve \"Neden 'O zaman ıslak ve kuru olarak geri dönecek, böylece felaketler başına gelecek' demedin?\" dedi. Bustam itaatsizlik etti, bu yüzden Nukayd onu terk etti. Malik ibn el-Muntafik el-Dabbi'nin otlayan bin devesine baskın düzenledi ve aralarında Ebu Şair adında tek gözlü bir aygır vardı. Dabba'nın atları yetişince Malik, \"İnsanların su tulumlarına atın!\" dedi ve tulumları parçalamaya başladılar. Asim ibn Halife el-Sabahi geldi ve aklı başında olmayan biri olarak bir mızrağı takip ederek, \"Bununla Bustam'ı öldüreceğim\" dedi. Bustam o gün öldürüldü ve o, siyah atı safran rengi üzerinde, arkadaşlarını koruyarak halkın arkasındaydı. {kaynak: Kamil ibn el-Athir s. 461-462}"
  id: "Hari Saudari, hari bagi Bani Dabba ibn Ad melawan Syaiban, di mana Bustam ibn Qays, pemimpin Syaiban, terbunuh. Bustam ibn Qays ibn Masoud ibn Khalid ibn Abdullah Dhu al-Jadayn menyerang Bani Dabba, dan bersamanya adalah saudaranya al-Salil dan Nuqayd, peramal burung dari Asadi. Bustam melihat dalam mimpi seolah-olah seseorang datang dan berkata kepadanya, “Ember itu datang ke barat yang berbahaya.” Maka ia menceritakannya kepada Nuqayd, yang terbang pergi dan berkata, “Mengapa kau tidak mengatakan, ‘Maka ia akan kembali basah dan kering, sehingga kemalangan akan menimpamu’?” Bustam tidak taat, sehingga Nuqayd meninggalkannya. Ia menyerang unta-unta Malik ibn al-Muntafiq al-Dabbi, seribu unta yang sedang merumput, dan di antara mereka ada seekor kuda jantan bermata satu bernama Abu Sha’ir. Ketika kuda-kuda Dabba menyusul, Malik berkata, “Lemparlah kantung-kantung air orang-orang itu,” lalu mereka mulai merobeknya. Asim ibn Khalifa al-Sabahi datang, dan ia lemah pikiran, mengikuti tombak sambil berkata, “Aku akan membunuh Bustam dengan tombak ini.” Bustam terbunuh pada hari itu, dan ia berada di belakang orang-orang di atas kuda hitamnya, kuda berwarna safron, melindungi para sahabatnya. {cite:kamil-ibn-al-athir p. 461-462}"
