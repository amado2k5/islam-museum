id: event/abu-al-qasim-tells-his-dream-of-the-sons-of-yafur-and-the-rising-of-the-prisons-291
class: event
kind: other
label:
  ar: رؤيا أبي القاسم لابني يعفر وخروج ابن خلف وكسر حبس صنعاء، حتى 23 صفر 291هـ
  en: Abu al-Qasim's dream of the two sons of Ya'fur, Ibn Khalaf's going out and the breaking of the prison of Sana'a, to 23 Safar 291 AH
  ur: ابو القاسم کا یعفر کے دو بیٹوں کا خواب، ابن خلف کا نکلنا اور صنعاء کی جیل کا ٹوٹنا، 23 صفر 291ھ تک
summary:
  ar: يروي علي بن محمد عن محمد بن سعيد أن أبا القاسم رأى في المنام ابني يعفر يدخلان القلعة ويخلصانه من الحبس والقيد، ثم يخرج ابن خلف إلى مشرق خولان فيكسر جراح حبس صنعاء ويلحق به أصحاب الهادي، وفي يوم الجمعة 23 صفر ينهب عسكر ابني يعفر غنماً حول القلعة.
  en: Ali ibn Muhammad tells, from Muhammad ibn Sa'id, that Abu al-Qasim dreamed of the two sons of Ya'fur entering the fort and freeing him from prison and fetter; then Ibn Khalaf goes east to Khawlan, Jarrah breaks the prison of Sana'a and the companions of al-Hadi join, and on Friday 23 Safar the troops of the two sons of Ya'fur plunder sheep around the fort.
  ur: علی بن محمد، محمد بن سعید سے روایت کرتے ہیں کہ ابو القاسم نے خواب دیکھا کہ یعفر کے دو بیٹے قلعے میں آ کر انہیں قید اور بیڑی سے چھڑاتے ہیں؛ پھر ابن خلف مشرقِ خولان کو جاتا ہے، جراح صنعاء کی جیل توڑتا ہے اور ہادی کے ساتھی آ ملتے ہیں، اور جمعہ 23 صفر کو یعفر کے بیٹوں کا لشکر قلعے کے گرد بکریاں لوٹتا ہے۔
