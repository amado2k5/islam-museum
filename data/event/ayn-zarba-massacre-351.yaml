label: { ar: "مقتلة عين زربة الثانية 351هـ", en: "The second sack of 'Ayn Zarba, 351" }
summary:
  ar: "في المحرم سنة إحدى وخمسين وثلثمائة دخلت الروم عين زربة في مائة وستين ألف رجل، فطلب المسلمون الأمان فأمّنهم ملك الروم، فلما دخل البلد نادى في أول الليل أن يخرج جميع الناس إلى المسجد الجامع وأن من تأخر في منزله قُتل، فلما أصبح أنفذ رجاله فمن وجدوه في منزله قتلوه، فقتلوا خلقاً من الرجال والنساء والأطفال، وأمر بقطع نخل البلد فقُطع منه أربعون ألف نخلة، ونادى فيمن حصل في الجامع أن يخرجوا حيث شاءوا وأن من أمسى فيه قُتل، فتزاحموا في الأبواب فمات بالضغط خلق كثير ومات أكثرهم في الطرقات، ثم أمر بهدم الجامع وكسر المنبر وهدم سور البلد والمنازل، وبقي في بلاد الإسلام أحد وعشرين يوماً وفتح حول عين زربة أربعة وخمسين حصناً بعضها بالسيف وبعضها بالأمان، ثم إن سيف الدولة أعاد بناء عين زربة {cite:muntazam-ibn-al-jawzi j.7 p.11-12}."
  en: "Muharram 351: the Byzantines entered 'Ayn Zarba with 160,000 men, granted aman, then ordered everyone into the congregational mosque by night and killed whoever was found at home; forty thousand palms were cut, the mosque razed and its minbar broken; those who crowded the gates died by crushing; twenty-one days inside the lands of Islam and fifty-four surrounding fortresses taken before Sayf al-Dawla rebuilt 'Ayn Zarba {cite:muntazam-ibn-al-jawzi j.7 p.11-12}."
