id: event/ayn-zarba-massacre-351
class: event
kind: massacre
label: { ar: "مقتلة عين زربة الثانية 351هـ", en: "The second sack of 'Ayn Zarba, 351", fr: "Le second sac de 'Ayn Zarba, 351", es: "El segundo saqueo de 'Ayn Zarba, 351", ur: "عین زربہ کی دوسری بوری، 351" }
summary:
  ar: "في المحرم سنة إحدى وخمسين وثلثمائة دخلت الروم عين زربة في مائة وستين ألف رجل، فطلب المسلمون الأمان فأمّنهم ملك الروم، فلما دخل البلد نادى في أول الليل أن يخرج جميع الناس إلى المسجد الجامع وأن من تأخر في منزله قُتل، فلما أصبح أنفذ رجاله فمن وجدوه في منزله قتلوه، فقتلوا خلقاً من الرجال والنساء والأطفال، وأمر بقطع نخل البلد فقُطع منه أربعون ألف نخلة، ونادى فيمن حصل في الجامع أن يخرجوا حيث شاءوا وأن من أمسى فيه قُتل، فتزاحموا في الأبواب فمات بالضغط خلق كثير ومات أكثرهم في الطرقات، ثم أمر بهدم الجامع وكسر المنبر وهدم سور البلد والمنازل، وبقي في بلاد الإسلام أحد وعشرين يوماً وفتح حول عين زربة أربعة وخمسين حصناً بعضها بالسيف وبعضها بالأمان، ثم إن سيف الدولة أعاد بناء عين زربة {cite:muntazam-ibn-al-jawzi j.7 p.11-12}."
  en: "Muharram 351: the Byzantines entered 'Ayn Zarba with 160,000 men, granted aman, then ordered everyone into the congregational mosque by night and killed whoever was found at home; forty thousand palms were cut, the mosque razed and its minbar broken; those who crowded the gates died by crushing; twenty-one days inside the lands of Islam and fifty-four surrounding fortresses taken before Sayf al-Dawla rebuilt 'Ayn Zarba {cite:muntazam-ibn-al-jawzi j.7 p.11-12}."
  fr: "Muharram 351 : les Byzantins entrèrent à 'Ayn Zarba avec 160 000 hommes, accordèrent l'aman, puis ordonnèrent de nuit à tous de se rendre à la grande mosquée et tuèrent quiconque fut trouvé chez soi ; quarante mille palmiers furent abattus, la mosquée rasée et son minbar brisé ; ceux qui se pressaient aux portes moururent écrasés ; vingt et un jours en terre d'islam et cinquante-quatre forteresses alentour prises, avant que Sayf al-Dawla ne rebâtisse 'Ayn Zarba {cite:muntazam-ibn-al-jawzi j.7 p.11-12}."
  es: "Muharram 351: los bizantinos entraron en 'Ayn Zarba con 160.000 hombres, concedieron el aman, luego ordenaron a todos que entraran en la mezquita congregacional por la noche y mataron a cualquiera que fuera encontrado en casa; se cortaron cuarenta mil palmas, la mezquita fue arrasada y su minbar destruido; los que se agolpaban en las puertas murieron aplastados; veintiún días dentro de las tierras del Islam y cincuenta y cuatro fortalezas circundantes tomadas antes de que Sayf al-Dawla reconstruyera 'Ayn Zarba {cite:muntazam-ibn-al-jawzi j.7 p.11-12}."
  ur: "محرم 351: بازنطینی 160,000 آدمیوں کے ساتھ عین زربہ میں داخل ہوئے، امان دی، پھر رات کو سب کو اجتماعی مسجد میں داخل کرنے کا حکم دیا اور جو گھر میں پایا اسے قتل کر دیا۔ چالیس ہزار کھجوریں کاٹی گئیں، مسجد منہدم اور منبر ٹوٹ گیا۔ دروازے پر ہجوم کرنے والے کچل کر مر گئے۔ اسلام کی سرزمین کے اندر اکیس دن اور سیف الدولہ کی جانب سے عین غربا کی دوبارہ تعمیر سے پہلے 54 قلعوں پر قبضہ کیا گیا"
