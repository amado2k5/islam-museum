label: { ar: "موكب سبط ابن الجوزي وشعور النساء إلى نابلس سنة 606", en: "Sibt Ibn al-Jawzi's procession of women's hair and the march to Nablus, 606", es: "La procesión de Sibt Ibn al-Jawzi con cabellos de mujeres y la marcha a Nablus, 606", fr: "Le cortège de cheveux de femmes de Sibt Ibn al-Jawzi et la marche vers Naplouse, 606", ur: "سبط ابن الجوزی کا خواتین کے بالوں کا جلوس اور نابلس کی طرف مارچ، 606", tr: "606 yılında Sibt İbn el-Cevzi'nin ve kadınların saçlarının Nablus'a götürüldüğü alay.", id: "Prosesi Sibt Ibn al-Jawzi dan rambut wanita ke Nablus pada tahun 606" }
summary:
  ar: "في سنة ست وستمائة جلس سبط ابن الجوزي بجامع دمشق يوعظ ويحث على الجهاد فاجتمع عنده شعور كثيرة قصّتها النساء، وذكر حكاية أبي قدامة الشامي مع المرأة التي قطعت شعرها وبعثت به إليه وقالت اجعله قيداً لفرسك في سبيل الله، فصنع من الشعور شكالاً لخيل المجاهدين ولما صعد المنبر أمر بإحضارها فكانت ثلاثمائة شكال، فلما رآها الناس صاحوا صيحة واحدة وقطعوا مثلها، وكان والي دمشق والأعيان حاضرين؛ فلما نزل عن المنبر قام والي دمشق ومشى مع السبط وركب وركب الناس وخرجوا إلى باب المصلى خلقاً لا يُحصون كثرة، وساروا إلى نابلس لقتال الفرنج فأسروا وقتلوا ورجعوا سالمين غانمين {cite:shadharat-dhahab p. 26}."
  en: "In 606 Sibt Ibn al-Jawzi sat in Damascus's congregational mosque exhorting to jihad; women had cut their braids for him — he told of Abu Qudama of Damascus and the woman who sent her hair saying 'make it a rein for your horse in God's path' — and he had them made into bridles for the mujahidin's mounts; when he mounted the pulpit and they were brought out, they were three hundred bridles, and the people cried out and cut as many again. The governor of Damascus and the notables were present; when he descended, the governor walked with the Sibt, and the people rode out through the prayer-ground gate in uncounted numbers, marched to Nablus to fight the Franks, took prisoners and killed, and returned safe and laden {cite:shadharat-dhahab p. 26}."
  es: "En 606, Sibt Ibn al-Jawzi se sentó en la mezquita congregacional de Damasco exhortando a la yihad; las mujeres le habían cortado sus trenzas —contó la historia de Abu Qudama de Damasco y la mujer que le envió su cabello diciendo: «Úsalo como rienda para tu caballo en el camino de Dios»— y él mandó hacer bridas para las monturas de los muyahidines; cuando subió al púlpito y las trajeron, eran trescientas bridas, y la gente gritó y cortó otras tantas. El gobernador de Damasco y los notables estaban presentes; cuando bajó, el gobernador caminó con Sibt, y la gente salió a caballo por la puerta del recinto de oración en números incontables, marchó a Nablus para luchar contra los francos, tomó prisioneros y mató, y regresó sano y salvo y cargado {cite:shadharat-dhahab p. 26}."
  fr: "En 606, Sibt Ibn al-Jawzi, assis dans la mosquée du vendredi de Damas, exhortait au djihad. Des femmes lui avaient coupé leurs tresses – il raconta l'histoire d'Abu Qudama de Damas et de la femme qui lui avait envoyé ses cheveux en disant: « Faites-en une rêne pour votre cheval sur le chemin de Dieu » – et il les fit transformer en brides pour les montures des moudjahidines. Lorsqu'il monta en chaire et que les brides furent apportées, il y en avait trois cents, et la foule, en liesse, en coupa autant à nouveau. Le gouverneur de Damas et les notables étaient présents. À sa descente, le gouverneur accompagna le Sibt, et le peuple sortit par la porte de la mosquée en nombre incalculable, marcha sur Naplouse pour combattre les Francs, fit des prisonniers et en tua d'autres, puis revint sain et sauf, chargé de provisions (cf. shadharat-dhahab, p. 26)."
  ur: "606 میں سبط ابن الجوزی دمشق کی جامع مسجد میں بیٹھ کر جہاد کی تلقین کرتا تھا۔ عورتوں نے اس کے لیے اپنی چوٹیاں کاٹی تھیں - اس نے دمشق کے ابو قدامہ اور اس عورت کے بارے میں بتایا جس نے اپنے بال بھیجے تھے کہ 'خدا کی راہ میں اپنے گھوڑے کی لگام بناؤ' - اور اس نے انہیں مجاہدین کے سواروں کے لیے لگام بنا دیا تھا۔ جب آپ نے منبر پر چڑھایا اور انہیں باہر لایا گیا تو وہ تین سو لگامیں تھیں اور لوگوں نے پکار کر اتنی ہی لگامیں کاٹ دیں۔ دمشق کے گورنر اور معززین موجود تھے۔ جب وہ نیچے اترا تو گورنر سبط کے ساتھ چل پڑا، اور لوگ بے شمار تعداد میں نماز گاہ کے دروازے سے باہر نکلے، نابلس کی طرف فرینکوں سے لڑنے کے لیے روانہ ہوئے، قیدی بنائے اور مارے گئے، اور محفوظ اور لاد کر واپس آئے۔ 26}۔"
  tr: "Hicri 606 yılında, Sibt İbn el-Cevzi Şam camisinde vaaz veriyor ve cihat çağrısında bulunuyordu. Kadınlar tarafından kesilen birçok saç teli onun bulunduğu yerde birikmişti. Sibt, saçlarını kesip kendisine gönderen ve \"Bunu Allah yolunda atın için bir gem yap\" diyen Ebu Kudame el-Şami'nin hikayesini anlattı. Bunun üzerine Sibt, mücahitlerin atları için bu saçlardan gemler yaptı. Minbere çıktığında, gemlerin getirilmesini emretti ve üç yüz gem vardı. İnsanlar onları görünce hep bir ağızdan bağırdılar ve aynı sayıda gem kestiler. Şam valisi ve ileri gelenler de oradaydı. Sibt minberden indiğinde, Şam valisi ayağa kalktı ve onunla birlikte yürüdü; Sibt atına bindi, insanlar da atlarına bindiler ve sayılamayacak kadar kalabalık bir şekilde namazhanenin kapısına çıktılar. Franklarla savaşmak için Nablus'a yürüdüler, onları esir alıp öldürdüler ve sağ salim zaferle geri döndüler. {cite:shadharat-dhahab s. 26}"
  id: "Pada tahun 606 H, Sibt Ibn al-Jawzi duduk di masjid Damaskus, berdakwah dan menyerukan jihad. Banyak helai rambut dikumpulkan di tempatnya, yang dipotong oleh para wanita. Beliau menceritakan kisah Abu Qudama al-Shami dengan seorang wanita yang memotong rambutnya dan mengirimkannya kepadanya, seraya berkata, “Jadikanlah itu sebagai kekang untuk kudamu dalam perjuangan di jalan Allah.” Maka beliau membuat kekang untuk kuda-kuda para mujahidin dari rambut-rambut tersebut. Ketika beliau naik ke mimbar, beliau memerintahkan agar kekang-kekang itu dibawa, dan jumlahnya mencapai tiga ratus kekang. Ketika orang-orang melihatnya, mereka berseru serempak dan memotong rambut sebanyak itu pula. Gubernur Damaskus dan para tokoh penting hadir. Ketika beliau turun dari mimbar, gubernur Damaskus berdiri dan berjalan bersama Sibt, lalu beliau menaiki kudanya, dan orang-orang pun menaiki kuda mereka dan keluar menuju pintu ruang salat dalam jumlah yang tak terhitung. Mereka berbaris ke Nablus untuk melawan bangsa Frank, dan mereka menangkap serta membunuh, lalu kembali dengan selamat dan menang. {cite:shadharat-dhahab p. 26}"
