label: { ar: "موكب سبط ابن الجوزي وشعور النساء إلى نابلس سنة 606", en: "Sibt Ibn al-Jawzi's procession of women's hair and the march to Nablus, 606", es: "La procesión de Sibt Ibn al-Jawzi con cabellos de mujeres y la marcha a Nablus, 606", fr: "Le cortège de cheveux de femmes de Sibt Ibn al-Jawzi et la marche vers Naplouse, 606" }
summary:
  ar: "في سنة ست وستمائة جلس سبط ابن الجوزي بجامع دمشق يوعظ ويحث على الجهاد فاجتمع عنده شعور كثيرة قصّتها النساء، وذكر حكاية أبي قدامة الشامي مع المرأة التي قطعت شعرها وبعثت به إليه وقالت اجعله قيداً لفرسك في سبيل الله، فصنع من الشعور شكالاً لخيل المجاهدين ولما صعد المنبر أمر بإحضارها فكانت ثلاثمائة شكال، فلما رآها الناس صاحوا صيحة واحدة وقطعوا مثلها، وكان والي دمشق والأعيان حاضرين؛ فلما نزل عن المنبر قام والي دمشق ومشى مع السبط وركب وركب الناس وخرجوا إلى باب المصلى خلقاً لا يُحصون كثرة، وساروا إلى نابلس لقتال الفرنج فأسروا وقتلوا ورجعوا سالمين غانمين {cite:shadharat-dhahab p. 26}."
  en: "In 606 Sibt Ibn al-Jawzi sat in Damascus's congregational mosque exhorting to jihad; women had cut their braids for him — he told of Abu Qudama of Damascus and the woman who sent her hair saying 'make it a rein for your horse in God's path' — and he had them made into bridles for the mujahidin's mounts; when he mounted the pulpit and they were brought out, they were three hundred bridles, and the people cried out and cut as many again. The governor of Damascus and the notables were present; when he descended, the governor walked with the Sibt, and the people rode out through the prayer-ground gate in uncounted numbers, marched to Nablus to fight the Franks, took prisoners and killed, and returned safe and laden {cite:shadharat-dhahab p. 26}."
  es: "En 606, Sibt Ibn al-Jawzi se sentó en la mezquita congregacional de Damasco exhortando a la yihad; las mujeres le habían cortado sus trenzas —contó la historia de Abu Qudama de Damasco y la mujer que le envió su cabello diciendo: «Úsalo como rienda para tu caballo en el camino de Dios»— y él mandó hacer bridas para las monturas de los muyahidines; cuando subió al púlpito y las trajeron, eran trescientas bridas, y la gente gritó y cortó otras tantas. El gobernador de Damasco y los notables estaban presentes; cuando bajó, el gobernador caminó con Sibt, y la gente salió a caballo por la puerta del recinto de oración en números incontables, marchó a Nablus para luchar contra los francos, tomó prisioneros y mató, y regresó sano y salvo y cargado {cite:shadharat-dhahab p. 26}."
  fr: "En 606, Sibt Ibn al-Jawzi, assis dans la mosquée du vendredi de Damas, exhortait au djihad. Des femmes lui avaient coupé leurs tresses – il raconta l'histoire d'Abu Qudama de Damas et de la femme qui lui avait envoyé ses cheveux en disant: « Faites-en une rêne pour votre cheval sur le chemin de Dieu » – et il les fit transformer en brides pour les montures des moudjahidines. Lorsqu'il monta en chaire et que les brides furent apportées, il y en avait trois cents, et la foule, en liesse, en coupa autant à nouveau. Le gouverneur de Damas et les notables étaient présents. À sa descente, le gouverneur accompagna le Sibt, et le peuple sortit par la porte de la mosquée en nombre incalculable, marcha sur Naplouse pour combattre les Francs, fit des prisonniers et en tua d'autres, puis revint sain et sauf, chargé de provisions (cf. shadharat-dhahab, p. 26)."
