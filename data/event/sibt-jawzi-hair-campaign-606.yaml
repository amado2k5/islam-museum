label: { ar: "موكب سبط ابن الجوزي وشعور النساء إلى نابلس سنة 606" }
summary:
  ar: "في سنة ست وستمائة جلس سبط ابن الجوزي بجامع دمشق يوعظ ويحث على الجهاد فاجتمع عنده شعور كثيرة قصّتها النساء، وذكر حكاية أبي قدامة الشامي مع المرأة التي قطعت شعرها وبعثت به إليه وقالت اجعله قيداً لفرسك في سبيل الله، فصنع من الشعور شكالاً لخيل المجاهدين ولما صعد المنبر أمر بإحضارها فكانت ثلاثمائة شكال، فلما رآها الناس صاحوا صيحة واحدة وقطعوا مثلها، وكان والي دمشق والأعيان حاضرين؛ فلما نزل عن المنبر قام والي دمشق ومشى مع السبط وركب وركب الناس وخرجوا إلى باب المصلى خلقاً لا يُحصون كثرة، وساروا إلى نابلس لقتال الفرنج فأسروا وقتلوا ورجعوا سالمين غانمين {cite:shadharat-dhahab p. 26}."
  en: "In 606 Sibt Ibn al-Jawzi sat in Damascus's congregational mosque exhorting to jihad; women had cut their braids for him — he told of Abu Qudama of Damascus and the woman who sent her hair saying 'make it a rein for your horse in God's path' — and he had them made into bridles for the mujahidin's mounts; when he mounted the pulpit and they were brought out, they were three hundred bridles, and the people cried out and cut as many again. The governor of Damascus and the notables were present; when he descended, the governor walked with the Sibt, and the people rode out through the prayer-ground gate in uncounted numbers, marched to Nablus to fight the Franks, took prisoners and killed, and returned safe and laden {cite:shadharat-dhahab p. 26}."
