id: event/yawm-awara-al-ula
class: event
kind: battle
label: { ar: "يوم أوارة الأول", en: "The First Day of Awara", es: "El primer día de Awara", fr: "Le premier jour d'Awara", ur: "آوارہ کا پہلا دن", tr: "Awara'nın ilk günü", id: "Hari pertama Awara" }
summary:
  ar: "يوم من أيام العرب وقع بين المنذر بن امرئ القيس اللخمي وبين بكر بن وائل؛ سببه أن تغلب لما أخرجت سلمة بن الحارث عنها التجأ إلى بكر بن وائل فأذعنوا له وقالوا لا يملكنا غيرك، فبعث إليهم المنذر يدعوهم إلى طاعته فأبوا، فحلف ليسيرن إليهم فإن ظفر بهم ليذبحنهم على قلة جبل أوارة حتى يبلغ الدم الحضيض، فسار إليهم فالتقوا بأوارة فاقتتلوا قتالاً شديداً وأجلت الواقعة عن هزيمة بكر وأسر يزيد بن شرحبيل الكندي فأمر المنذر بقتله، وأسر من بكر أسرى كثيرة فذُبحوا على جبل أوارة فجعل الدم يجمد، وقيل له أبيت اللعن لو ذبحت كل بكري على وجه الأرض لم تبلغ دماؤهم الحضيض ولكن لو صببت عليه الماء ففعل فسال الدم إلى الحضيض، وأمر النساء أن يُحرقن بالنار، ثم كلمه رجل من قيس بن ثعلبة في سبي بكر فأطلقهن، فافتخر الأعشى بتلك الشفاعة {cite:kamil-ibn-al-athir p. 412}."
  en: "The first day of Awara — the Lakhmid al-Mundhir ibn Imru' al-Qays against Bakr ibn Wa'il, who had sheltered the Taghlibi exile Salama ibn al-Harith; refusing allegiance, Bakr were bound by al-Mundhir's oath to be slaughtered on the hill of Awara until the blood reached its foot; when the blood froze they poured water on it so it flowed, and the women were burned, until a man of Qays ibn Tha'laba interceded and the captives were freed — the boast al-A'sha made of it in verse {cite:kamil-ibn-al-athir p. 412}."
  es: "El primer día de Awara: el Lakhmid al-Mundhir ibn Imru' al-Qays contra Bakr ibn Wa'il, quien había dado refugio al exiliado taghlibi Salama ibn al-Harith; al negarse a prestar juramento, Bakr fue obligado por el juramento de al-Mundhir a ser sacrificado en la colina de Awara hasta que la sangre llegara a sus pies; cuando la sangre se congeló, vertieron agua sobre ella para que fluyera, y las mujeres fueron quemadas, hasta que un hombre de Qays ibn Tha'laba intercedió y los cautivos fueron liberados; el jactancia que al-A'sha hizo de ello en el verso {cite:kamil-ibn-al-athir p. 412}."
  fr: "Le premier jour d'Awara — le Lakhmid al-Mundhir ibn Imru' al-Qays contre Bakr ibn Wa'il, qui avait abrité l'exilé Taghlibi Salama ibn al-Harith; refusant de prêter allégeance, Bakr fut lié par le serment d'al-Mundhir à être massacré sur la colline d'Awara jusqu'à ce que le sang atteigne son pied; lorsque le sang gela, ils versèrent de l'eau dessus pour qu'il coule, et les femmes furent brûlées, jusqu'à ce qu'un homme de Qays ibn Tha'laba intercède et que les captifs soient libérés — la vantardise qu'al-A'sha en fit dans le verset {cite:kamil-ibn-al-athir p. 412}."
  ur: "آوارہ کا پہلا دن - بکر بن وائل کے خلاف لخمید المنذر بن عمرو القیس، جس نے تغلبی جلاوطن سلمہ بن الحارث کو پناہ دی تھی۔ بیعت سے انکار کرتے ہوئے، بکر کو المنذر کی بیعت سے پابند کیا گیا کہ وہ آوارہ پہاڑی پر ذبح کیے جائیں گے یہاں تک کہ خون اس کے پاؤں تک پہنچ جائے۔ جب خون جم گیا تو انہوں نے اس پر پانی ڈالا تو وہ بہہ گیا، اور عورتیں جل گئیں، یہاں تک کہ قیس بن ثعلبہ کے ایک شخص نے شفاعت کی اور قیدیوں کو آزاد کر دیا گیا، اس پر فخر العیشہ نے آیت کریمہ میں بیان کیا ہے۔ 412}۔"
  tr: "Arapların günlerinden birinde, Mündhir bin İmru' el-Kays el-Lakhmi ile Bakr bin Veil arasında bir savaş oldu; bunun sebebi, Teğlib'in Selama bin El-Harith'i oradan kovması üzerine Bakr bin Veil'e sığınması ve ona boyun eğerek, \"Bizi senden başka kimse yönetemez\" demeleriydi. Bunun üzerine Mündhir onlara kendisine itaat etmeleri için haber gönderdi, ancak onlar reddettiler. Bunun üzerine Mündhir, onlara karşı yürüyeceğine ve eğer onlara karşı zafer kazanırsa, onları Avara Dağı'nın zirvesinde kanları dibe ulaşana kadar katledeceğine yemin etti. Böylece onlara karşı yürüdü ve Avara'da karşılaştılar ve şiddetli bir savaş yaptılar. Savaş, Bakr'ın yenilgisiyle ve Yazid bin Şerabil el-Kindi'nin esir alınmasıyla sonuçlandı. Mündhir, Yazid'in öldürülmesini emretti ve Bakr'dan birçok esir aldı. Esirler Avara Dağı'nda katledildi ve kanları katılaşmaya başladı. Ona şöyle denildi: “Lanetten kurtul! Yeryüzündeki bütün Bakrları öldürsen bile kanları dibe ulaşmaz, fakat üzerine su dökersen ulaşır.” O da öyle yaptı ve kan dibe aktı. Kadınların yakılmasını emretti. Sonra Kays bin Thalabe'den bir adam ona Bakrların esirlerinden bahsetti, o da onları serbest bıraktı. Aişe bu şefaatle övündü. {Kaynak: Kamil ibn el-Aşir, s. 412}"
  id: "Pada suatu hari di zaman Arab, terjadi pertempuran antara Al-Mundhir bin Imru' al-Qais al-Lakhmi dan Bakr bin Wa'il; alasannya adalah ketika Taghlib mengusir Salama bin Al-Harith dari wilayahnya, ia mencari perlindungan kepada Bakr bin Wael, dan mereka tunduk kepadanya dan berkata, “Tidak ada yang memerintah kami selain engkau.” Maka Al-Mundhir mengirim utusan kepada mereka untuk meminta mereka taat kepadanya, tetapi mereka menolak. Maka ia bersumpah bahwa ia akan menyerang mereka, dan jika ia menang atas mereka, ia akan membantai mereka di puncak Gunung Awara hingga darah mencapai dasar gunung. Maka ia menyerang mereka, dan mereka bertemu di Awara, dan mereka bertempur dengan sengit, dan pertempuran itu mengakibatkan kekalahan Bakr dan penangkapan Yazid bin Sharhabil Al-Kindi. Al-Mundhir memerintahkan agar Yazid dibunuh, dan ia mengambil banyak tawanan dari Bakr, dan mereka dibantai di Gunung Awara, dan darah mulai membeku. Dikatakan kepadanya, “Semoga engkau terhindar dari kutukan, jika engkau menyembelih setiap orang Bakr di muka bumi, darah mereka tidak akan mencapai dasar, tetapi jika engkau menuangkan air ke atasnya.” Maka ia melakukannya, dan darah itu mengalir ke dasar. Ia memerintahkan agar para wanita dibakar dengan api. Kemudian seorang laki-laki dari Qais bin Tha’labah berbicara kepadanya tentang tawanan Bakr, maka ia membebaskan mereka. Al-A’sha membanggakan syafaat itu. {cite:kamil-ibn-al-athir p. 412}"
