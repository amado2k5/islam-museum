id: event/ibn-al-mulaqqin-birth-723
class: event
kind: birth
label:
  ar: "ولادة ابن الملقن بالقاهرة، ربيع الأول ٧٢٣هـ"
  en: "Ibn al-Mulaqqin is born at Cairo, Rabi' I 723/March 1323"
  ur: "ابن ملقن کی پیدائش قاہرہ میں، ربیع الاول 723ھ/مارچ 1323ء"
  es: "Ibn al-Mulaqqin nació en El Cairo, en el mes de Rabi' I de 723/marzo de 1323."
  fr: "Ibn al-Mulaqqin naît au Caire le 1er Rabi' 723/mars 1323."
  tr: "İbn el-Mulakkin, Hicri 723 yılının Rebiü'l-Evvel ayında Kahire'de doğdu."
  id: "Ibn al-Mulaqqin lahir di Kairo, Rabi' al-Awwal 723 H."
summary:
  ar: "ولد سراج الدين أبو حفص عمر بن علي بن أحمد بن محمد بن عبد الله الأنصاري الأندلسي ثم القاهري الشافعي، المعروف بابن الملقن، بالقاهرة يوم السبت رابع عشر ربيع الأول سنة ثلاث وعشرين وسبعمائة؛ وكان أبوه نور الدين علي قد رحل من الأندلس إلى بلاد الترك فأقرأ أهلها القرآن وحصل له مال، ثم قدم به إلى القاهرة واستوطنها {cite:shadharat-dhahab 7/44}."
  en: "Siraj al-Din Abu Hafs 'Umar ibn 'Ali ibn Ahmad al-Ansari, Andalusi by origin then Cairene — the future Ibn al-Mulaqqin — was born at Cairo on Saturday 14 Rabi' I 723. His father Nur al-Din 'Ali had left al-Andalus for the land of the Turks, taught its people the Qur'an and earned good money there before coming with him to settle at Cairo {cite:shadharat-dhahab 7/44}."
  ur: "سراج الدین ابوحفص عمر بن علی بن احمد انصاری اندلسی، بعد میں قاہری شافعی — آئندہ ابن ملقن — ہفتہ 14 ربیع الاول 723ھ کو قاہرہ میں پیدا ہوئے۔ ان کے والد نور الدین علی اندلس سے ترکوں کے ملک گئے، وہاں کے لوگوں کو قرآن پڑھایا اور اچھی دولت کمائی، پھر بیٹے کو لے کر قاہرہ آ کر بس گئے {cite:shadharat-dhahab 7/44}۔"
  es: "Siraj al-Din Abu Hafs 'Umar ibn 'Ali ibn Ahmad al-Ansari, de origen andalusí y luego cairota —el futuro Ibn al-Mulaqqin— nació en El Cairo el sábado 14 de Rabi' I de 723. Su padre, Nur al-Din 'Ali, había dejado al-Ándalus para ir a la tierra de los turcos, donde enseñó el Corán a su gente y ganó mucho dinero antes de venir con él a establecerse en El Cairo {cite:shadharat-dhahab 7/44}."
  fr: "Siraj al-Din Abu Hafs 'Umar ibn 'Ali ibn Ahmad al-Ansari, d'origine andalouse puis cairote — le futur Ibn al-Mulaqqin — est né au Caire le samedi 14 Rabi' I 723. Son père Nur al-Din 'Ali avait quitté al-Andalus pour le pays des Turcs, y avait enseigné le Coran à ses habitants et y avait gagné beaucoup d'argent avant de venir avec lui s'installer au Caire {cite:shadharat-dhahab 7/44}."
  tr: "Siraj al-Din Abu Hafs Umar ibn Ali ibn Ahmad ibn Muhammad ibn Abdullah al-Ansari al-Andalusi, daha sonra al-Qahiri al-Shafi’i olarak bilinen İbn al-Mulaqqin, 723 yılında, Rebiü’l-Evvel ayının on dördüncü Cumartesi günü Kahire'de doğdu. Babası Nur al-Din Ali, Endülüs'ten Türk topraklarına seyahat etmiş, orada halka Kur'an öğretmiş ve zenginlik elde etmişti. Daha sonra bu zenginliği Kahire'ye getirip oraya yerleşti. {cite:shadharat-dhahab 7/44}"
  id: "Siraj al-Din Abu Hafs Umar ibn Ali ibn Ahmad ibn Muhammad ibn Abdullah al-Ansari al-Andalusi, kemudian al-Qahiri al-Shafi’i, dikenal sebagai Ibn al-Mulaqqin, lahir di Kairo pada hari Sabtu, tanggal empat belas Rabi’ al-Awwal, tahun tujuh ratus dua puluh tiga. Ayahnya, Nur al-Din Ali, telah melakukan perjalanan dari Andalusia ke negeri Turki, di mana ia mengajarkan Al-Qur'an kepada penduduknya dan memperoleh kekayaan. Kemudian ia membawanya ke Kairo dan menetap di sana. {cite:shadharat-dhahab 7/44}"
