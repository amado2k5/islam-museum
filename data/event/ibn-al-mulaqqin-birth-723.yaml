class: event
kind: birth
label:
  ar: "ولادة ابن الملقن بالقاهرة، ربيع الأول ٧٢٣هـ"
  en: "Ibn al-Mulaqqin is born at Cairo, Rabi' I 723/March 1323"
  ur: "ابن ملقن کی پیدائش قاہرہ میں، ربیع الاول 723ھ/مارچ 1323ء"
summary:
  ar: "ولد سراج الدين أبو حفص عمر بن علي بن أحمد بن محمد بن عبد الله الأنصاري الأندلسي ثم القاهري الشافعي، المعروف بابن الملقن، بالقاهرة يوم السبت رابع عشر ربيع الأول سنة ثلاث وعشرين وسبعمائة؛ وكان أبوه نور الدين علي قد رحل من الأندلس إلى بلاد الترك فأقرأ أهلها القرآن وحصل له مال، ثم قدم به إلى القاهرة واستوطنها {cite:shadharat-dhahab 7/44}."
  en: "Siraj al-Din Abu Hafs 'Umar ibn 'Ali ibn Ahmad al-Ansari, Andalusi by origin then Cairene — the future Ibn al-Mulaqqin — was born at Cairo on Saturday 14 Rabi' I 723. His father Nur al-Din 'Ali had left al-Andalus for the land of the Turks, taught its people the Qur'an and earned good money there before coming with him to settle at Cairo {cite:shadharat-dhahab 7/44}."
  ur: "سراج الدین ابوحفص عمر بن علی بن احمد انصاری اندلسی، بعد میں قاہری شافعی — آئندہ ابن ملقن — ہفتہ 14 ربیع الاول 723ھ کو قاہرہ میں پیدا ہوئے۔ ان کے والد نور الدین علی اندلس سے ترکوں کے ملک گئے، وہاں کے لوگوں کو قرآن پڑھایا اور اچھی دولت کمائی، پھر بیٹے کو لے کر قاہرہ آ کر بس گئے {cite:shadharat-dhahab 7/44}۔"
