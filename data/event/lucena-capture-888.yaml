label: { ar: "وقعة لشانة وأسر أبي عبد الله" }
summary:
  ar: "لما سمع أبو عبد الله ابن السلطان أبي الحسن صاحب غرناطة أن عمه بمالقة غنم من النصارى أعمل السفر للغزو بأهل بلاده من غرناطة والشرقية، وذلك في ربيع الأول سنة ثمان وثمانين وثمانمائة، إلى أن بلغ نواحي لشانة فقتل وأسر وغنم، فتجمعت عليه النصارى من جميع تلك النواحي ومعهم كبير قبرة وحالوا بين المسلمين وبلادهم في جبال وأوعار فانكسر الجند وأسر من الناس كثير وقتل آخرون، وكان في جملة من أسر السلطان أبو عبد الله ولم يعرف ثم علم به صاحب لشانة، وأراد صاحب قبرة أن يأخذه منه فهرب به ليلاً وبلغه إلى صاحب قشتالة فنال بذلك عنده رفعة على جميع القواد {cite:nafh-tib-maqqari p. 519}."
  en: "The battle of Lucena: Boabdil, hearing of his uncle's spoils at Malaga, led Granada's army raiding in Rabi I 888 until the Castilians cut him off in the mountains near Lucena; the army broke and the sultan himself was taken, handed secretly to the Castilian king's captain — the capture that let Castile play him against his father until Granada fell {cite:nafh-tib-maqqari p. 519}."
