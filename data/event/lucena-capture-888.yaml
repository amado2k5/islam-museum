label: { ar: "وقعة لشانة وأسر أبي عبد الله", en: "Battle of Lucena and the capture of Abu Abd Allah", es: "Batalla de Lucena y captura de Abu Abd Allah", fr: "Bataille de Lucena et prise d'Abu Abd Allah" }
summary:
  ar: "لما سمع أبو عبد الله ابن السلطان أبي الحسن صاحب غرناطة أن عمه بمالقة غنم من النصارى أعمل السفر للغزو بأهل بلاده من غرناطة والشرقية، وذلك في ربيع الأول سنة ثمان وثمانين وثمانمائة، إلى أن بلغ نواحي لشانة فقتل وأسر وغنم، فتجمعت عليه النصارى من جميع تلك النواحي ومعهم كبير قبرة وحالوا بين المسلمين وبلادهم في جبال وأوعار فانكسر الجند وأسر من الناس كثير وقتل آخرون، وكان في جملة من أسر السلطان أبو عبد الله ولم يعرف ثم علم به صاحب لشانة، وأراد صاحب قبرة أن يأخذه منه فهرب به ليلاً وبلغه إلى صاحب قشتالة فنال بذلك عنده رفعة على جميع القواد {cite:nafh-tib-maqqari p. 519}."
  en: "The battle of Lucena: Boabdil, hearing of his uncle's spoils at Malaga, led Granada's army raiding in Rabi I 888 until the Castilians cut him off in the mountains near Lucena; the army broke and the sultan himself was taken, handed secretly to the Castilian king's captain — the capture that let Castile play him against his father until Granada fell {cite:nafh-tib-maqqari p. 519}."
  es: "La batalla de Lucena: Boabdil, al enterarse del botín de su tío en Málaga, dirigió al ejército de Granada en una incursión en Rabi I de 888 hasta que los castellanos lo acorralaron en las montañas cerca de Lucena; el ejército se rompió y el propio sultán fue capturado, entregado secretamente al capitán del rey castellano; esta captura permitió a Castilla usarlo contra su padre hasta la caída de Granada {cite:nafh-tib-maqqari p. 519}."
  fr: "La bataille de Lucena: Boabdil, apprenant le butin de son oncle à Malaga, mena l'armée de Grenade à un raid en Rabi I 888 jusqu'à ce que les Castillans le coupent dans les montagnes près de Lucena; l'armée se débanda et le sultan lui-même fut capturé, remis secrètement au capitaine du roi castillan — la capture qui permit à la Castille de le jouer contre son père jusqu'à la chute de Grenade {cite:nafh-tib-maqqari p. 519}."
