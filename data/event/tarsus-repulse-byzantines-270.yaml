id: event/tarsus-repulse-byzantines-270
class: event
kind: battle
label: { ar: "هزيمة الروم عند طرسوس", en: "The Defeat of the Byzantines at Tarsus", es: "La derrota de los bizantinos en Tarso", fr: "La défaite des Byzantins à Tarse", ur: "ٹارسس میں بازنطینیوں کی شکست", tr: "Romalıların Tarsus'ta yenilgisi", id: "Kekalahan bangsa Romawi di Tarsus" }
summary:
  ar: "في ربيع الأول سنة سبعين ومائتين ورد الخبر إلى بغداد أن الروم نزلوا ناحية باب التمّة على ستة أميال من طرسوس في زهاء مائة ألف يقودهم بطريق البطارقة أندرياس، فخرج إليهم زمّان الخادم ليلاً فبيتهم وقتل رئيسهم وخلقاً كثيراً من أصحابه يقال بلغوا سبعين ألفاً، وأخذ لهم سبعة صلبان من ذهب وفضة فيها صليبهم الأعظم من ذهب مكلل بالجوهر، وخمسة عشر ألف دابة وبغل ومثل ذلك من السروج وسيوفاً محلاة بالذهب والفضة ومناطق وأربعة كراسي من ذهب ومائتي طوق من ذهب وآنية كثيرة نحو عشرة آلاف علم، وكان النفير إلى أندرياس يوم الثلاثاء لسبع خلون من ربيع الأول {cite:muntazam-ibn-al-jawzi j.5 p. 74-75}."
  en: "In Rabi I 270 some hundred thousand Byzantines under the patrician Andrias camped near Tarsus; Zamman al-Khadim struck by night, killed their chief and — it was said — seventy thousand men, and took seven crosses of gold and silver, the great jewelled cross, fifteen thousand mounts, gold-hilted swords, four gold chairs and two hundred gold collars {cite:muntazam-ibn-al-jawzi j.5 p. 74-75}."
  es: "En Rabi I 270, unos cien mil bizantinos bajo el mando del patricio Andrias acamparon cerca de Tarso; Zamman al-Khadim atacó de noche, mató a su jefe y —se dice— a setenta mil hombres, y se llevó siete cruces de oro y plata, la gran cruz enjoyada, quince mil monturas, espadas con empuñadura de oro, cuatro sillas de oro y doscientos collares de oro {cite:muntazam-ibn-al-jawzi j.5 p. 74-75}."
  fr: "En Rabi I 270, quelque cent mille Byzantins sous le patricien Andrias campèrent près de Tarse; Zamman al-Khadim frappa de nuit, tua leur chef et — disait-on — soixante-dix mille hommes, et prit sept croix d'or et d'argent, la grande croix ornée de pierres précieuses, quinze mille montures, des épées à poignée d'or, quatre chaises en or et deux cents colliers en or {cite: muntazam-ibn-al-jawzi j.5 p. 74-75}."
  ur: "ربیع اول میں 270 میں پٹریشین اینڈریاس کے ماتحت تقریباً ایک لاکھ بازنطینیوں نے ترسوس کے قریب ڈیرے ڈالے۔ زمان الخادم نے رات کو مارا، ان کے سردار کو مار ڈالا اور کہا جاتا ہے کہ ستر ہزار آدمی، اور سونے اور چاندی کی سات صلیبیں، جواہرات سے لدی ہوئی صلیب، پندرہ ہزار سواریاں، سونے سے جڑی ہوئی تلواریں، چار سونے کی کرسیاں اور دو سو سونے کے کالر لے گئے۔ 74-75}۔"
  tr: "270 yılının baharında, Bağdat'a Romalıların Tarsus'tan altı mil uzaklıktaki Bab el-Tamma yakınlarında, Patrik Andreas önderliğinde yaklaşık yüz bin kişilik bir orduyla kamp kurdukları haberi ulaştı. Hizmetkâr Zaman geceleyin onlara saldırdı ve liderlerini ve yetmiş bin kadar olduğu söylenen birçok arkadaşını öldürdü. Onlardan yedi altın ve gümüş haç, bunların arasında mücevherlerle taçlandırılmış en büyük altın haç, on beş bin hayvan ve katır, aynı sayıda eyer, altın ve gümüş işlemeli kılıçlar, kemerler, dört altın sandalye, iki yüz altın kolye ve birçok kap, yaklaşık on bin bayrak aldı. 270 yılının baharının yedinci gününde, Salı günü Andreas'a silahlanma çağrısı yapıldı."
  id: "Pada musim semi tahun dua ratus tujuh puluh, kabar sampai ke Baghdad bahwa bangsa Romawi telah berkemah di dekat Bab al-Tamma, enam mil dari Tarsus, dengan sekitar seratus ribu orang yang dipimpin oleh Patriark Andreas. Zaman, sang hamba, pergi menemui mereka di malam hari, menyerang mereka, dan membunuh pemimpin mereka dan banyak pengikutnya, yang konon berjumlah tujuh puluh ribu. Ia mengambil dari mereka tujuh salib emas dan perak, termasuk salib emas terbesar mereka yang bertatahkan permata, lima belas ribu hewan dan keledai, dan jumlah pelana yang sama, pedang yang dihiasi emas dan perak, ikat pinggang, empat kursi emas, dua ratus kalung emas, dan banyak bejana, sekitar sepuluh ribu bendera. Seruan untuk angkat senjata ditujukan kepada Andreas pada hari Selasa, tujuh hari setelah dimulainya musim semi tahun dua ratus tujuh puluh."
