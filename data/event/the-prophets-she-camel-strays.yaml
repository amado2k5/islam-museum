label: { ar: "ضلال ناقة النبي وقول زيد بن اللصيت", en: "The Prophet's she-camel strays and Zayd ibn al-Lusayt's remark" }
summary:
  ar: "ضلت ناقة النبي في بعض الطريق فخرج أصحابه في طلبها؛ وكان عنده عمارة بن حزم، وفي رحله زيد بن اللصيت القينقاعي، وكان منافقاً بحسب ابن إسحاق، فقال متهكماً كيف يخبر محمد عن السماء وهو لا يدري أين ناقته؟ فأخبر النبي بقوله وبمكان الناقة فوجدوها حيث وصف، فطرد عمارة زيداً من رحله."
  en: "The Prophet's she-camel strayed on the road and his Companions went out searching for her. With him was Umara ibn Hazm, and in his litter rode Zayd ibn al-Lusayt al-Qaynuqa'i, a hypocrite in Ibn Ishaq's account, who said mockingly: does Muhammad bring news of the heavens yet not know where his camel is? The Prophet announced what he had said and where the camel was; it was found where he described, and Umara drove Zayd from his litter."
