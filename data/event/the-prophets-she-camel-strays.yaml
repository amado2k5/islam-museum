summary:
  ar: "ضلت ناقة النبي في بعض الطريق فخرج أصحابه في طلبها؛ وكان عنده عمارة بن حزم، وفي رحله زيد بن اللصيت القينقاعي، وكان منافقاً بحسب ابن إسحاق، فقال متهكماً كيف يخبر محمد عن السماء وهو لا يدري أين ناقته؟ فأخبر النبي بقوله وبمكان الناقة فوجدوها حيث وصف، فطرد عمارة زيداً من رحله."
