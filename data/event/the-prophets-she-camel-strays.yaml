label: { ar: "ضلال ناقة النبي وقول زيد بن اللصيت", en: "The Prophet's she-camel strays and Zayd ibn al-Lusayt's remark", es: "La camella del Profeta se extravía y el comentario de Zayd ibn al-Lusayt", fr: "La chamelle égarée du Prophète et la remarque de Zayd ibn al-Lusayt", ur: "رسول اللہ کی اونٹنی بھٹک گئی اور زید بن لوسیت کا قول", tr: "Peygamberin devesi yoldan sapmıştı ve Zeyd ibn el-Lasit'in sözü...", id: "Unta Nabi tersesat, dan perkataan Zayd ibn al-Lasit" }
summary:
  ar: "ضلت ناقة النبي في بعض الطريق فخرج أصحابه في طلبها؛ وكان عنده عمارة بن حزم، وفي رحله زيد بن اللصيت القينقاعي، وكان منافقاً بحسب ابن إسحاق، فقال متهكماً كيف يخبر محمد عن السماء وهو لا يدري أين ناقته؟ فأخبر النبي بقوله وبمكان الناقة فوجدوها حيث وصف، فطرد عمارة زيداً من رحله."
  en: "The Prophet's she-camel strayed on the road and his Companions went out searching for her. With him was Umara ibn Hazm, and in his litter rode Zayd ibn al-Lusayt al-Qaynuqa'i, a hypocrite in Ibn Ishaq's account, who said mockingly: does Muhammad bring news of the heavens yet not know where his camel is? The Prophet announced what he had said and where the camel was; it was found where he described, and Umara drove Zayd from his litter."
  es: "La camella del Profeta se extravió en el camino y sus Compañeros salieron a buscarla. Con él iba Umara ibn Hazm, y en su litera iba Zayd ibn al-Lusayt al-Qaynuqa'i, un hipócrita según el relato de Ibn Ishaq, quien dijo burlonamente: «¿Acaso Mahoma trae noticias de los cielos y no sabe dónde está su camella?». El Profeta anunció lo que había dicho y dónde se encontraba la camella; la hallaron donde él había indicado, y Umara bajó a Zayd de su litera."
  fr: "La chamelle du Prophète s'égara sur le chemin et ses Compagnons partirent à sa recherche. Umara ibn Hazm était avec lui, et dans sa litière se trouvait Zayd ibn al-Lusayt al-Qaynuqa'i, un hypocrite selon Ibn Ishaq, qui dit avec ironie: « Muhammad annonce-t-il les nouvelles du ciel sans savoir où est sa chamelle ? » Le Prophète annonça ses paroles et indiqua l'endroit où se trouvait la chamelle; on la trouva là où il l'avait décrite, et Umara chassa Zayd de sa litière."
  ur: "رسول اللہ کی اونٹنی راستے میں بھٹک گئی اور آپ کے صحابہ اس کی تلاش میں نکل پڑے۔ اس کے ساتھ عمارہ بن حزم تھا، اور اس کے کوڑے میں زید بن لسیط قینقاعی سوار تھا، جو ابن اسحاق کے بیان میں ایک منافق ہے، جس نے طنزیہ انداز میں کہا: کیا محمد آسمان کی خبریں لاتے ہیں پھر بھی یہ نہیں جانتے کہ ان کا اونٹ کہاں ہے؟ نبی نے اعلان کیا کہ آپ نے کیا کہا اور اونٹ کہاں ہے؟ جہاں اس نے بیان کیا تھا وہ مل گیا اور عمارہ نے زید کو اس کے کوڑے سے نکال دیا۔"
  tr: "Peygamberin devesi yolda kayboldu, bu yüzden arkadaşları onu aramaya çıktılar. Ammarah ibn Hazm da onunla birlikteydi ve kampında İbn İshak'a göre münafık olan Zeyd ibn el-Lasit el-Kaynukai vardı. Alaycı bir şekilde, \"Muhammed devesinin nerede olduğunu bilmediği halde göklerden nasıl bahsedebilir?\" dedi. Bunun üzerine Peygamber, Zeyd'in sözlerinden ve devenin yerinden haberdar edildi ve deveyi tarif ettiği yerde buldular. Bunun üzerine Ammarah, Zeyd'i kampından kovdu."
  id: "Unta Nabi tersesat di jalan, sehingga para sahabatnya pergi mencarinya. Ammarah bin Hazm bersamanya, dan di perkemahannya ada Zayd bin al-Lasit al-Qaynuqa’i, yang menurut Ibnu Ishaq adalah seorang munafik. Ia berkata dengan mengejek, “Bagaimana Muhammad dapat berbicara tentang langit jika ia sendiri tidak tahu di mana untanya berada?” Maka Nabi diberitahu tentang perkataannya dan lokasi unta tersebut, dan mereka menemukannya di tempat yang telah ia sebutkan. Ammarah kemudian mengusir Zayd dari perkemahannya."
