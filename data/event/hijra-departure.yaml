id: event/hijra-departure
class: event
kind: other
label: { en: "The departure night of the Hijra", ar: "ليلة الخروج في الهجرة", es: "La noche de la partida de la Hégira", fr: "La nuit du départ de l'Hégire", ur: "ہجرت کی روانگی کی رات" }
summary:
  en: "The night of 27 Safar when eleven Quraysh chiefs surrounded the Prophet's house to kill him at dawn; Ali slept in his bed wrapped in his green Hadrami cloak while the Prophet walked through the cordon unscathed and reached Abu Bakr's house. ويروي البخاري الليلة كاملة في حديث الهجرة الطويل عن عائشة — نوم علي على الفراش والخروج إلى الغار وطلب قريش {cite:sahih-al-bukhari 3905} — ويليه قصة سراقة بن مالك بلسانه حين تبعهما فساخت قوائم فرسه {cite:sahih-al-bukhari 3906}."
  ar: "ليلة 27 صفر حين طوّق أحد عشر من أكابر قريش منزل النبي ليقتلوه؛ نام علي على فراشه متسجياً ببرده الحضرمي الأخضر، وخرج النبي من بين صفوفهم يذر التراب على رؤوسهم فلم يروه، ولحق ببيت أبي بكر ثم بغار ثور. وقد قفت القافة بقريش حين خرج النبي وأبو بكر إلى الغار حتى أتت باب الغار على حجر صلد لا تراب عليه تتبين الأقدام فحجبهم الله عنهما بنسج العنكبوت وما سفت عليه الرياح وقال القائف إلى هنا انتهت الأقدام وهم لا يرون على الصلد ما يرى وأبصارهم سليمة {cite:muruj-al-dhahab p. 480}، ويروي أبو بكر نفسه لحظة الغار في مسلم: «نظرت إلى أقدام المشركين على رؤوسنا ونحن في الغار... فقال يا أبا بكر ما ظنك باثنين الله ثالثهما» {cite:sahih-muslim 2381}"
  es: "La noche del 27 de Safar, cuando once jefes de los Quraysh rodearon la casa del Profeta para matarlo al amanecer, Ali dormía en su cama envuelto en su manto verde de Hadrami, mientras el Profeta atravesaba el cordón ileso y llegaba a la casa de Abu Bakr. Al-Bujari narra toda la noche en el extenso hadiz de la Hégira, según la autoridad de Aisha: Ali durmiendo en su cama, dirigiéndose a la cueva y los Quraysh persiguiéndolo (cita: Sahih Al-Bujari 3905), seguido de la historia de Suraqah ibn Malik, según la contó él mismo, cuando los siguió y las patas de su caballo se hundieron en el suelo (cita: Sahih Al-Bujari 3906)."
  fr: "La nuit du 27 Safar, alors que onze chefs qurayshites encerclaient la maison du Prophète pour le tuer à l'aube, Ali dormait dans son lit, enveloppé dans son manteau hadramite vert, tandis que le Prophète traversait le cordon indemne et rejoignait la maison d'Abou Bakr. Al-Bukhari relate toute cette nuit dans le long hadith de l'Hégire, d'après Aïcha: Ali dormant dans son lit, se dirigeant vers la grotte, poursuivi par les Qurayshites (cit.: Sahih al-Bukhari 3905); puis l'histoire de Suraqah ibn Malik, racontée par lui-même, lorsqu'il les suivit et que les pattes de son cheval s'enfoncèrent dans le sol (cit.: Sahih al-Bukhari 3906)."
  ur: "27 صفر کی رات جب قریش کے گیارہ سرداروں نے فجر کے وقت آپ کو قتل کرنے کے لیے آپ کے گھر کا گھیراؤ کیا تو علی اپنے بستر پر اپنی سبز حضرمی چادر میں لپٹے ہوئے سو گئے جب کہ نبی اس گھیرے میں سے بغیر کسی حفاظت کے چلتے ہوئے ابوبکر کے گھر پہنچے۔ بخاری نے ہجرت کی طویل حدیث میں عائشہ ا سے روایت کی ہے کہ علی اپنے بستر پر سو رہے تھے، غار کی طرف روانہ ہوئے، اور قریش ان کا تعاقب کر رہے تھے ⁦(حوالہ دیں: صحیح البخاری 3905)⁩ - اس کے بعد سورقہ بن مالک کا قصہ ہے، جب اس نے گھوڑے کی ٹانگ ان کے پیچھے کی، جیسا کہ اس نے ان کے گھوڑے کو زمین میں گھسایا۔ ⁦(حوالہ: صحیح البخاری 3906)⁩"
