id: event/hijra-departure
class: event
kind: other
label: { en: "The departure night of the Hijra", ar: "ليلة الخروج في الهجرة" }
summary:
  en: "The night of 27 Safar when eleven Quraysh chiefs surrounded the Prophet's house to kill him at dawn; Ali slept in his bed wrapped in his green Hadrami cloak while the Prophet walked through the cordon unscathed and reached Abu Bakr's house. ويروي البخاري الليلة كاملة في حديث الهجرة الطويل عن عائشة — نوم علي على الفراش والخروج إلى الغار وطلب قريش {cite:sahih-al-bukhari 3905} — ويليه قصة سراقة بن مالك بلسانه حين تبعهما فساخت قوائم فرسه {cite:sahih-al-bukhari 3906}."
  ar: "ليلة 27 صفر حين طوّق أحد عشر من أكابر قريش منزل النبي ليقتلوه؛ نام علي على فراشه متسجياً ببرده الحضرمي الأخضر، وخرج النبي من بين صفوفهم يذر التراب على رؤوسهم فلم يروه، ولحق ببيت أبي بكر ثم بغار ثور. وقد قفت القافة بقريش حين خرج النبي وأبو بكر إلى الغار حتى أتت باب الغار على حجر صلد لا تراب عليه تتبين الأقدام فحجبهم الله عنهما بنسج العنكبوت وما سفت عليه الرياح وقال القائف إلى هنا انتهت الأقدام وهم لا يرون على الصلد ما يرى وأبصارهم سليمة {cite:muruj-al-dhahab p. 480}، ويروي أبو بكر نفسه لحظة الغار في مسلم: «نظرت إلى أقدام المشركين على رؤوسنا ونحن في الغار... فقال يا أبا بكر ما ظنك باثنين الله ثالثهما» {cite:sahih-muslim 2381}"
