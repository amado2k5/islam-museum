date:
  start: { edtf: "0622-09-12~", calendar: julian, precision: day, status: tradition, note: "ليلة 27 صفر سنة 14 من النبوة الموافق 12/13 سبتمبر 622م (الرحيق ص163؛ رحمة للعالمين 1/95). عدّ السنين من محرم عند المؤلف." }
outcome:
  en: "The plot failed; the Prophet left Mecca before dawn."
  ar: "فشلت المؤامرة؛ غادر النبي مكة قبل الفجر."
significance:
  ar: "فشل خطة دار الندوة بقتل النبي بضربة رجل واحد من كل قبيلة؛ وصفّاه القرآن «ويمكرون ويمكر الله والله خير الماكرين» (الأنفال ٣٠) (الرحيق ص162)."
