id: event/birth-al-dhahabi-673
class: event
kind: birth
label:
  ar: "ولادة شمس الدين الذهبي بدمشق، ٦٧٣هـ"
  en: "Al-Dhahabi is born at Damascus, 673/1274"
  ur: "شمس الدین ذہبی کی ولادت دمشق میں، 673ھ/1274ء"
summary:
  ar: "وُلد أبو عبد الله شمس الدين محمد بن أحمد بن عثمان بن قايماز بن عبد الله التركماني الأصل الفارقي الدمشقي الشافعي في ثالث ربيع الآخر سنة ٦٧٣هـ بدمشق {cite:durar-kamina-jil-1993 3/336}؛ وذكرت دائرة المعارف أنه وُلد بدمشق أو بميافارقين في أول ربيع الآخر أو ثالثه الموافق ٥ أو ٧ أكتوبر ١٢٧٤م، وأجاز له في سنة مولده أخوه من الرضاعة العلاء بن المنجا أحمد بن أبي الخير {cite:encyclopaedia-of-islam-2 vol. 2 p. 214} {cite:durar-kamina-jil-1993 3/336}."
  en: "Abu Abd Allah Shams al-Din Muhammad ibn Ahmad ibn Uthman ibn Qaymaz, al-Dhahabi, of Turkmen origin, al-Fariqi by forebear, of Damascus, a Shafi'i, was born on 3 Rabi' II 673 at Damascus {cite:durar-kamina-jil-1993 3/336}; the Encyclopaedia of Islam gives his birth at Damascus or Mayyafariqin on 1 or 3 Rabi' II, corresponding to 5 or 7 October 1274, and records that his milk-brother al-Ala ibn al-Munajja Ahmad ibn Abi al-Khayr issued him an ijaza in his birth year {cite:encyclopaedia-of-islam-2 vol. 2 p. 214} {cite:durar-kamina-jil-1993 3/336}."
  ur: "ابو عبد اللہ شمس الدین محمد بن احمد بن عثمان بن قایماز ذہبی، اصل میں ترکمان، فارقی، دمشقی اور شافعی، 3 ربیع الآخر 673ھ کو دمشق میں پیدا ہوئے {cite:durar-kamina-jil-1993 3/336}؛ دائرۃ المعارف کے مطابق وہ دمشق یا میافارقین میں 1 یا 3 ربیع الآخر، بمطابق 5 یا 7 اکتوبر 1274ء، پیدا ہوئے، اور ان کے رضاعی بھائی علاء بن المنجا احمد بن ابی الخیر نے ان کی ولادت کے سال انھیں اجازت دی {cite:encyclopaedia-of-islam-2 vol. 2 p. 214} {cite:durar-kamina-jil-1993 3/336}۔"
