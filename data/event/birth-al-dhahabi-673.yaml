id: event/birth-al-dhahabi-673
class: event
kind: birth
label:
  ar: "ولادة شمس الدين الذهبي بدمشق، ٦٧٣هـ"
  en: "Al-Dhahabi is born at Damascus, 673/1274"
  ur: "شمس الدین ذہبی کی ولادت دمشق میں، 673ھ/1274ء"
  fr: "Al-Dhahabi naît à Damas, 673/1274"
  es: "Al-Dhahabi nació en Damasco, 673/1274"
  tr: "Şemseddin Zehebi, Hicri 673 yılında Şam'da doğdu."
  id: "Shams al-Din al-Dhahabi lahir di Damaskus pada tahun 673 Hijriah."
summary:
  ar: "وُلد أبو عبد الله شمس الدين محمد بن أحمد بن عثمان بن قايماز بن عبد الله التركماني الأصل الفارقي الدمشقي الشافعي في ثالث ربيع الآخر سنة ٦٧٣هـ بدمشق {cite:durar-kamina-jil-1993 3/336}؛ وذكرت دائرة المعارف أنه وُلد بدمشق أو بميافارقين في أول ربيع الآخر أو ثالثه الموافق ٥ أو ٧ أكتوبر ١٢٧٤م، وأجاز له في سنة مولده أخوه من الرضاعة العلاء بن المنجا أحمد بن أبي الخير {cite:encyclopaedia-of-islam-2 vol. 2 p. 214} {cite:durar-kamina-jil-1993 3/336}."
  en: "Abu Abd Allah Shams al-Din Muhammad ibn Ahmad ibn Uthman ibn Qaymaz, al-Dhahabi, of Turkmen origin, al-Fariqi by forebear, of Damascus, a Shafi'i, was born on 3 Rabi' II 673 at Damascus {cite:durar-kamina-jil-1993 3/336}; the Encyclopaedia of Islam gives his birth at Damascus or Mayyafariqin on 1 or 3 Rabi' II, corresponding to 5 or 7 October 1274, and records that his milk-brother al-Ala ibn al-Munajja Ahmad ibn Abi al-Khayr issued him an ijaza in his birth year {cite:encyclopaedia-of-islam-2 vol. 2 p. 214} {cite:durar-kamina-jil-1993 3/336}."
  ur: "ابو عبد اللہ شمس الدین محمد بن احمد بن عثمان بن قایماز ذہبی، اصل میں ترکمان، فارقی، دمشقی اور شافعی، 3 ربیع الآخر 673ھ کو دمشق میں پیدا ہوئے {cite:durar-kamina-jil-1993 3/336}؛ دائرۃ المعارف کے مطابق وہ دمشق یا میافارقین میں 1 یا 3 ربیع الآخر، بمطابق 5 یا 7 اکتوبر 1274ء، پیدا ہوئے، اور ان کے رضاعی بھائی علاء بن المنجا احمد بن ابی الخیر نے ان کی ولادت کے سال انھیں اجازت دی {cite:encyclopaedia-of-islam-2 vol. 2 p. 214} {cite:durar-kamina-jil-1993 3/336}۔"
  fr: "Abu Abd Allah Shams al-Din Muhammad ibn Ahmad ibn Uthman ibn Qaymaz, al-Dhahabi, d'origine turkmène, al-Fariqi par ses ancêtres, de Damas, chaféite, naquit le 3 Rabi' II 673 à Damas {cite:durar-kamina-jil-1993 3/336} ; l'Encyclopédie de l'Islam donne sa naissance à Damas ou à Mayyafariqin le 1er ou le 3 Rabi' II, soit le 5 ou le 7 octobre 1274, et consigne que son frère de lait al-Ala ibn al-Munajja Ahmad ibn Abi al-Khayr lui délivra une ijaza l'année de sa naissance {cite:encyclopaedia-of-islam-2 vol. 2 p. 214} {cite:durar-kamina-jil-1993 3/336}."
  es: "Abu Abd Allah Shams al-Din Muhammad ibn Ahmad ibn Uthman ibn Qaymaz, al-Dhahabi, de origen turcomano, al-Fariqi por antepasado, de Damasco, un Shafi'i, nació el 3 de Rabi' II de 673 en Damasco {cite:durar-kamina-jil-1993 3/336}; la Enciclopedia del Islam da su nacimiento en Damasco o Mayyafariqin el 1 o 3 de Rabi' II, correspondiente al 5 o 7 de octubre de 1274, y registra que su hermano de leche al-Ala ibn al-Munajja Ahmad ibn Abi al-Khayr le emitió una ijaza en el año de su nacimiento {cite:encyclopaedia-of-islam-2 vol. 2p. 214} {cite:durar-kamina-jil-1993 3/336}."
  tr: "Ebu Abdullah Şemseddin Muhammed ibn Ahmed ibn Osman ibn Kaymaz ibn Abdullah Türkmenî el-Asl el-Fariki el-Dimaşki el-Şafii, Hicri 673 yılında Rabi' el-Sani ayının üçüncü gününde Şam'da doğmuştur {cite:durar-kamina-jil-1993 3/336}; ve Ansiklopedide, onun Şam'da veya Mayyafariqin'de Rabi' el-Sani ayının birinci veya üçüncü gününde, yani Miladi 5 veya 7 Ekim 1274'te doğduğu ve üvey kardeşi Al-Ala' ibn el-Munja Ahmed ibn Abi el-Hayr'ın doğum yılında ona izin verdiği belirtilmiştir {cite:encyclopaedia-of-islam-2 vol. 2 p. 214} {cite:durar-kamina-jil-1993 3/336}."
  id: "Abu Abdullah Shams al-Din Muhammad ibn Ahmad ibn Uthman ibn Qaymaz ibn Abdullah al-Turkmani al-Asl al-Fariqi al-Dimashqi al-Shafi’i lahir pada tanggal 3 Rabi’ al-Thani tahun 673 H di Damaskus {cite:durar-kamina-jil-1993 3/336}; dan Ensiklopedia menyebutkan bahwa ia lahir di Damaskus atau di Mayyafariqin pada tanggal 1 atau 3 Rabi’ al-Thani yang bertepatan dengan tanggal 5 atau 7 Oktober 1274 M, dan saudara angkatnya Al-Ala’ ibn al-Munja Ahmad ibn Abi al-Khayr memberinya izin pada tahun kelahirannya {cite:encyclopaedia-of-islam-2 vol. 2 p. 214} {cite:durar-kamina-jil-1993 3/336}."
