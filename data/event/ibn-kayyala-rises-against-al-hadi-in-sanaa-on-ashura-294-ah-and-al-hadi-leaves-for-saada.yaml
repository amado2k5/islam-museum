label:
  ar: "ابن كيالة يثب على الهادي في صنعاء يوم عاشوراء سنة 294هـ، فيخرج الهادي إلى صعدة، ص393"
  en: "Ibn Kayyala rises against al-Hadi in Sanaa on Ashura 294 AH and al-Hadi leaves for Sa'da, p. 393"
  ur: "عاشورا 294ھ کو ابن کیالہ صنعاء میں ہادی کے خلاف اٹھتا ہے اور ہادی صعدہ روانہ ہو جاتے ہیں، ص393"
  es: "Ibn Kayyala se levanta contra al-Hadi en Saná en Ashura 294 AH y al-Hadi parte hacia Sa'da, p. 393"
  fr: "Ibn Kayyala se soulève contre al-Hadi à Sanaa le jour d'Achoura 294 AH et al-Hadi part pour Sa'da, p. 393"
  tr: "İbn Kayala, Hicri 294 yılında Aşura günü Sana'a'da el-Hadi'ye saldırdı; bunun üzerine el-Hadi Sa'de'ye gitti (s. 393)."
  id: "Ibn Kayala menyerang al-Hadi di Sana'a pada hari Asyura tahun 294 H, sehingga al-Hadi pergi ke Sa'dah, hlm. 393"
summary:
  ar: "يثب ابن كيالة على الهادي في صنعاء يوم عاشوراء سنة 294هـ، فلا يقاتله الهادي، ويخرج من المدينة إلى صعدة، ويبقى ابن كيالة في صنعاء."
  en: "On Ashura 294 AH Ibn Kayyala moves against al-Hadi in Sanaa. Al-Hadi does not fight him and leaves the city for Sa'da, and Ibn Kayyala stays in Sanaa."
  ur: "عاشورا 294ھ کو ابن کیالہ صنعاء میں ہادی کے خلاف اٹھتا ہے۔ ہادی لڑائی نہیں کرتے اور شہر سے صعدہ چلے جاتے ہیں، جب کہ ابن کیالہ صنعاء میں رہ جاتا ہے۔"
  es: "En Ashura del año 294 de la Hégira, Ibn Kayyala se enfrentó a al-Hadi en Sanaa. Al-Hadi no lo combatió y abandonó la ciudad rumbo a Sa'da, mientras que Ibn Kayyala permaneció en Sanaa."
  fr: "Le jour d'Achoura 294 AH, Ibn Kayyala attaque al-Hadi à Sanaa. Al-Hadi ne le combat pas et quitte la ville pour Sa'da, tandis qu'Ibn Kayyala reste à Sanaa."
  tr: "İbn Kayala, Hicri 294 yılında Aşura günü Sana'a'da Al-Hadi'ye saldırdı, ancak Al-Hadi onunla savaşmadı ve şehri terk ederek Sa'de'ye gitti, İbn Kayala ise Sana'a'da kaldı."
  id: "Ibn Kayala menyerang Al-Hadi di Sana'a pada hari Asyura tahun 294 H, tetapi Al-Hadi tidak melawannya, dan ia meninggalkan kota menuju Sa'dah, sementara Ibn Kayala tetap tinggal di Sana'a."
