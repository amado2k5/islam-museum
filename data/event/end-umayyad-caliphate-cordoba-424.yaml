label: { ar: "سقوط الخلافة الأموية في قرطبة", en: "End of the Umayyad caliphate at Cordoba", es: "Fin del califato omeya en Córdoba.", fr: "Fin du califat omeyyade à Cordoue" }
summary:
  ar: "خلُع هشام المعتد بالله، آخر خلفاء بني أمية بقرطبة، فأسقط ملوك الأندلس الدعوة للخلافة المروانية وانقضت الدولة الأموية وقامت ملوك الطوائف؛ يجعله ابن عذاري سنة 424هـ {cite:bayan-mughrib-idhari p. 226}."
  en: "Hisham al-Mu'tadd, the last Umayyad caliph of Cordoba, was deposed; the Andalusi kings dropped the Marwanid caliphate and the taifa rulers rose. Ibn Idhari dates it to 424 AH {cite:bayan-mughrib-idhari p. 226}."
  ur: "قرطبة کے آخری اموی خلیفہ ہشام المعتد بالله کو معزول کر دیا گیا؛ اندلسی بادشاہوں نے مروانی خلافت کی دعوت چھوڑ دی اور ملوک الطوائف کا دور آیا۔ ابن عذاری نے اسے 424ھ لکھا ہے {cite:bayan-mughrib-idhari p. 226}."
  es: "Hisham al-Mu'tadd, último califa omeya de Córdoba, fue depuesto; los reyes andalusíes abandonaron el califato marwaní y se levantaron los gobernantes de taifas. Ibn Idhari lo fecha en 424 AH {citar:bayan-mughrib-idhari p. 226}."
  fr: "Hisham al-Mu'tadd, le dernier calife omeyyade de Cordoue, fut déposé; les rois andalous abandonnèrent le califat marwanide et les dirigeants des taifas se soulevèrent. Ibn Idhari le date de 424 AH {cite: bayan-mughrib-idhari p. 226}."
