summary:
  ar: "خلُع هشام المعتد بالله، آخر خلفاء بني أمية بقرطبة، فأسقط ملوك الأندلس الدعوة للخلافة المروانية وانقضت الدولة الأموية وقامت ملوك الطوائف؛ يجعله ابن عذاري سنة 424هـ {cite:bayan-mughrib-idhari p. 226}."
  en: "Hisham al-Mu'tadd, the last Umayyad caliph of Cordoba, was deposed; the Andalusi kings dropped the Marwanid caliphate and the taifa rulers rose. Ibn Idhari dates it to 424 AH {cite:bayan-mughrib-idhari p. 226}."
  ur: "قرطبة کے آخری اموی خلیفہ ہشام المعتد بالله کو معزول کر دیا گیا؛ اندلسی بادشاہوں نے مروانی خلافت کی دعوت چھوڑ دی اور ملوک الطوائف کا دور آیا۔ ابن عذاری نے اسے 424ھ لکھا ہے {cite:bayan-mughrib-idhari p. 226}."
