summary:
  ar: "في سنة إحدى وثلاثين استفك الواثق من الروم ألف وست مئة أسير مسلم، فقال ابن أبي دؤاد من قال من الأسرى القرآن مخلوق خلصوه وأعطوه دينارين ومن امتنع دعوه في الأسر {cite:tarikh-khulafa-minhaj-1434 p. 530}."
  en: "In 231 al-Wathiq ransomed 1,600 Muslim captives from the Byzantines; Ibn Abi Du'ad ruled that any captive who affirmed the Quran created be freed and given two dinars, and whoever refused be left in captivity {cite:tarikh-khulafa-minhaj-1434 p. 530}."
  es: "En 231, al-Wathiq rescató a 1.600 cautivos musulmanes de los bizantinos; Ibn Abi Du'ad dictaminó que cualquier cautivo que afirmara la creación del Corán fuera liberado y se le dieran dos dinares, y quien se negara fuera dejado en cautiverio {cite:tarikh-khulafa-minhaj-1434 p. 530}."
  fr: "En 231, al-Wathiq a racheté 1 600 captifs musulmans des Byzantins; Ibn Abi Du'ad a décrété que tout captif qui affirmait que le Coran avait été créé devait être libéré et recevoir deux dinars, et que quiconque refusait devait rester en captivité {cite:tarikh-khulafa-minhaj-1434 p. 530}."
