label: { ar: "استفكاك الأسرى المسلمين من الروم سنة إحدى وثلاثين", en: "The Ransoming of Muslim Captives from the Byzantines in the Year Thirty-One", es: "El rescate de cautivos musulmanes a los bizantinos en el año treinta y uno.", fr: "Le rachat des captifs musulmans aux Byzantins en l'an trente et un", ur: "سن اکتیس میں بازنطینیوں سے مسلمان قیدیوں کی رہائی", tr: "31. yılda Romalılardan Müslüman esirlerin fidyesi", id: "Uang tebusan tawanan Muslim dari Romawi pada tahun tiga puluh satu" }
summary:
  ar: "في سنة إحدى وثلاثين استفك الواثق من الروم ألف وست مئة أسير مسلم، فقال ابن أبي دؤاد من قال من الأسرى القرآن مخلوق خلصوه وأعطوه دينارين ومن امتنع دعوه في الأسر {cite:tarikh-khulafa-minhaj-1434 p. 530}."
  en: "In 231 al-Wathiq ransomed 1,600 Muslim captives from the Byzantines; Ibn Abi Du'ad ruled that any captive who affirmed the Quran created be freed and given two dinars, and whoever refused be left in captivity {cite:tarikh-khulafa-minhaj-1434 p. 530}."
  es: "En 231, al-Wathiq rescató a 1.600 cautivos musulmanes de los bizantinos; Ibn Abi Du'ad dictaminó que cualquier cautivo que afirmara la creación del Corán fuera liberado y se le dieran dos dinares, y quien se negara fuera dejado en cautiverio {cite:tarikh-khulafa-minhaj-1434 p. 530}."
  fr: "En 231, al-Wathiq a racheté 1 600 captifs musulmans des Byzantins; Ibn Abi Du'ad a décrété que tout captif qui affirmait que le Coran avait été créé devait être libéré et recevoir deux dinars, et que quiconque refusait devait rester en captivité {cite:tarikh-khulafa-minhaj-1434 p. 530}."
  ur: "231 میں الوثیق نے بازنطینیوں سے 1,600 مسلمان اسیروں کو رہا کر دیا۔ ابن ابی دعد نے حکم دیا کہ جو قیدی قرآن کی تخلیق کی تصدیق کرے اسے آزاد کر کے دو دینار دیے جائیں اور جس نے انکار کیا اسے اسیری میں چھوڑ دیا جائے۔ 530}۔"
  tr: "31. yılda El-Vathiq, Romalılardan bin altı yüz Müslüman esiri fidye karşılığında kurtardı. İbn Abi Du'ad şöyle dedi: Esirlerden Kur'an'ın yaratılmış olduğunu söyleyeni serbest bırakın ve ona iki dinar verin. Reddedeni ise esaret altında bırakın. {cite:tarikh-khulafa-minhaj-1434 s. 530}"
  id: "Pada tahun 31, Al-Wathiq menebus seribu enam ratus tawanan Muslim dari bangsa Romawi. Ibn Abi Du’ad berkata: Barangsiapa di antara para tawanan yang mengatakan bahwa Al-Qur’an diciptakan, bebaskan dia dan berikan dia dua dinar. Barangsiapa yang menolak, biarkan dia tetap dalam tawanan. {cite:tarikh-khulafa-minhaj-1434 p. 530}."
