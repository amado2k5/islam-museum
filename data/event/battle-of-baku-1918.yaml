summary:
  ar: "بطاقة أولية لمعركة باكو سنة ١٩١٨م، استيلاء القوات العثمانية الأذربيجانية على المدينة من قوات البلاشفة والداشناق؛ لم تُراجع مصادره على الصفحة بعد."
  en: "Draft card for the Battle of Baku in 1918, the Ottoman-Azerbaijani capture of the city from Bolshevik-Dashnak forces; its sources are not yet checked on the page."
  es: "Boceto de ficha para la Batalla de Bakú en 1918, la captura de la ciudad por las fuerzas otomanas y azerbaiyanas a las fuerzas bolcheviques-dashnak; sus fuentes aún no han sido verificadas en la página."
  fr: "Fiche de projet pour la bataille de Bakou en 1918, la prise de la ville par les forces ottomanes-azerbaïdjanaises aux dépens des forces bolcheviques-dachnaks; ses sources ne sont pas encore vérifiées sur la page."
  ur: "1918 میں باکو کی لڑائی کے لیے ڈرافٹ کارڈ، بالشویک-دشناک افواج سے شہر پر عثمانی-آذربائیجانی قبضہ؛ اس کے ذرائع ابھی تک صفحہ پر چیک نہیں کیے گئے ہیں۔"
  tr: "1918'deki Bakü Muharebesi'nin, Azerbaycan Osmanlı güçlerinin Bolşevik ve Daşnak güçlerinden şehri ele geçirmesinin ön anlatımı; kaynaklar henüz bu sayfada incelenmemiştir."
  id: "Catatan pendahuluan tentang Pertempuran Baku pada tahun 1918, perebutan kota tersebut oleh pasukan Ottoman Azerbaijan dari pasukan Bolshevik dan Dashnak; sumber-sumbernya belum ditinjau di halaman ini."
