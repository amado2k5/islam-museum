label: { ar: "صلح أيلة", en: "The Treaty of Ayla", es: "El Tratado de Ayla", fr: "Le traité d'Ayla", ur: "عائلہ کا معاہدہ", tr: "Ayla'nın Barışı", id: "Kedamaian Ayla" }
summary:
  ar: "عند البلاذري: أتى يُحنّة بن رؤبة صاحب أيلة النبي وهو بتبوك فصالحه على أن جعل له على كل حالم من أهل أرضه ديناراً في السنة فبلغ ذلك ثلاثمائة دينار، واشترط عليهم قِرَى من مرّ بهم من المسلمين، وكتب لهم كتاباً بأن يُحفظوا ويُمنعوا؛ وروي عن طلحة الأيلي أن عمر بن عبد العزيز كان لا يزيد على أهل أيلة ثلاثمائة دينار شيئاً."
  en: "In al-Baladhuri: Yuhanna ibn Ru'ba, lord of Ayla, came to the Prophet while he was at Tabuk and made peace on a dinar yearly upon every hālim of his land's people, totalling three hundred dinars, stipulating hospitality for Muslims passing by them, and the Prophet wrote them a letter of safeguard and protection; Talha al-Ayli reported that Umar ibn Abd al-Aziz never took from the people of Ayla a thing beyond the three hundred dinars."
  es: "En al-Baladhuri: Yuhanna ibn Ru'ba, señor de Ayla, vino al Profeta mientras estaba en Tabuk y estableció la paz sobre un dinar anual para cada hālim de la gente de su tierra, sumando un total de trescientos dinares, estipulando hospitalidad para los musulmanes que pasaran por allí, y el Profeta les escribió una carta de salvaguarda y protección; Talha al-Ayli informó que Umar ibn Abd al-Aziz nunca tomó de la gente de Ayla nada más allá de los trescientos dinares."
  fr: "Dans al-Baladhuri: Yuhanna ibn Ru'ba, seigneur d'Ayla, vint trouver le Prophète alors qu'il se trouvait à Tabuk et conclut un accord de paix moyennant une redevance annuelle d'un dinar sur chaque halim des habitants de sa région, pour un total de trois cents dinars, stipulant l'hospitalité envers les musulmans de passage. Le Prophète leur écrivit une lettre de sauvegarde et de protection. Talha al-Ayli rapporta qu'Umar ibn Abd al-Aziz n'accepta jamais des habitants d'Ayla quoi que ce soit au-delà des trois cents dinars."
  ur: "البلادوری میں ہے: یوحنا بن ربعہ، جو عائلہ کا مالک تھا، نبی کے پاس اس وقت آیا جب آپ تبوک میں تھے اور اپنی سرزمین کے ہر حلیم پر سالانہ ایک دینار، کل تین سو دینار، ان کے پاس سے گزرنے والے مسلمانوں کے لیے مہمان نوازی کی شرط رکھی، اور نبی نے ان کے لیے حفاظت اور حفاظت کا خط لکھا۔ طلحہ العیلی نے بیان کیا کہ عمر بن عبد العزیز نے کبھی بھی عائلہ کے لوگوں سے تین سو دینار سے زیادہ کوئی چیز نہیں لی۔"
  tr: "El-Baladhuri'ye göre: Ayla'nın sahibi Yuhanna bin Ru'ba, Peygamber Tebük'te iken ona gelmiş ve topraklarındaki her yetişkin erkek için yılda bir dinar vermesi şartıyla onunla barışmıştır; bu da toplamda üç yüz dinar ederdi. Ayrıca, yanlarından geçen Müslümanlara misafirperverlik göstermelerini şart koşmuş ve onları korumak ve engellemek için bir belge yazmıştır. Talha el-Ayli'den rivayet edildiğine göre, Ömer bin Abdül Aziz, Ayla halkına üç yüz dinardan fazla vermemiştir."
  id: "Menurut Al-Baladhuri: Yuhanna bin Ru’ba, pemilik Ayla, datang kepada Nabi ketika beliau berada di Tabuk dan berdamai dengannya dengan syarat bahwa ia akan memberikan satu dinar per tahun untuk setiap laki-laki dewasa di tanahnya, dan jumlahnya mencapai tiga ratus dinar. Ia menetapkan bahwa mereka harus memberikan keramahan kepada setiap Muslim yang lewat di dekat mereka, dan ia menuliskan sebuah dokumen untuk melindungi dan mencegah mereka. Diriwayatkan dari Talha Al-Ayli bahwa Umar bin Abdul Aziz tidak memberikan kepada penduduk Ayla lebih dari tiga ratus dinar."
