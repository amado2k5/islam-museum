label: { ar: "صلح أيلة", en: "The Treaty of Ayla" }
summary:
  ar: "عند البلاذري: أتى يُحنّة بن رؤبة صاحب أيلة النبي وهو بتبوك فصالحه على أن جعل له على كل حالم من أهل أرضه ديناراً في السنة فبلغ ذلك ثلاثمائة دينار، واشترط عليهم قِرَى من مرّ بهم من المسلمين، وكتب لهم كتاباً بأن يُحفظوا ويُمنعوا؛ وروي عن طلحة الأيلي أن عمر بن عبد العزيز كان لا يزيد على أهل أيلة ثلاثمائة دينار شيئاً."
  en: "In al-Baladhuri: Yuhanna ibn Ru'ba, lord of Ayla, came to the Prophet while he was at Tabuk and made peace on a dinar yearly upon every hālim of his land's people, totalling three hundred dinars, stipulating hospitality for Muslims passing by them, and the Prophet wrote them a letter of safeguard and protection; Talha al-Ayli reported that Umar ibn Abd al-Aziz never took from the people of Ayla a thing beyond the three hundred dinars."
