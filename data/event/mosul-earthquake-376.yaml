  ar: "في رجب سنة ست وسبعين وثلثمائة ورد الخبر ببغداد بزلزلة كانت بالموصل هدمت كثيراً من المنازل وأهلكت خلقاً كثيراً من الناس {cite:muntazam-ibn-al-jawzi j.7 p.132}."
  en: "In Rajab 376 word reached Baghdad of an earthquake at Mosul that demolished many houses and killed a great number of people {cite:muntazam-ibn-al-jawzi j.7 p.132}."
