  ur: "رجب 376 میں موصل میں ایک زلزلہ بغداد پہنچا جس نے بہت سے مکانات کو منہدم کر دیا اور بہت سے لوگ مارے گئے۔"
  tr: "376 yılının Receb ayında, Musul'da meydana gelen ve birçok evi yıkan, çok sayıda insanı öldüren bir deprem haberi Bağdat'a ulaştı. {cite:muntazam-ibn-al-jawzi j.7 p.132}"
  id: "Pada bulan Rajab tahun tiga ratus tujuh puluh enam, berita sampai ke Baghdad tentang gempa bumi yang terjadi di Mosul, yang menghancurkan banyak rumah dan menewaskan banyak orang. {cite:muntazam-ibn-al-jawzi j.7 p.132}."
