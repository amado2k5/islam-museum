id: event/al-hadi-on-foreign-merchants-and-protection-of-the-dhimmis
class: event
kind: other
label:
  ar: الهادي لا يأخذ زكاة التجار الغرباء ويأمر أهل الذمة بالرجوع إليه إذا أوذوا
  en: Al-Hadi takes no zakat from visiting merchants and tells Jews and Christians to come to him if wronged
  ur: ہادی بیرونی تاجروں سے زکوٰۃ نہیں لیتے اور ذمیوں سے کہتے ہیں کہ ستائے جانے پر ان کے پاس آئیں
summary:
  ar: سأل الكوفي الهادي عن أخذ زكاة أموال التجار الغرباء الذين يقيمون في البلد أشهراً، فقال إنه إن أخذها وجب عليه حياطتهم حيث كانوا في بلاده وغيرها، فلم يأخذ منهم شيئاً؛ وجاءه يهودي يستعدي على رجل فأمر بإنصافه وقال لليهود والنصارى إن آذاكم أحد فارجعوا إليّ.
  en: Al-Kufi asked al-Hadi about taking zakat from visiting merchants who stay some months; he said that if he took it he would owe them protection wherever they were, in his land or elsewhere, so he took nothing; and when a Jew came to complain against a man he had him dealt with justly and told the Jews and Christians to return to him if anyone harmed them.
  ur: کوفی نے ہادی سے ان بیرونی تاجروں کی زکوٰۃ کے بارے میں پوچھا جو چند مہینے شہر میں ٹھہرتے ہیں؛ انہوں نے کہا کہ اگر لیں تو ان کی حفاظت لازم ہو جاتی ہے جہاں بھی ہوں، ان کی سرزمین میں یا دوسری جگہ، اس لیے ان سے کچھ نہ لیا؛ اور ایک یہودی کسی کے خلاف فریاد لایا تو انصاف کا حکم دیا اور یہود و نصاریٰ سے کہا کہ کوئی ستائے تو میرے پاس لوٹ آنا۔
