label:
  ar: "الغز يدخلون الموصل وينهبون دار قرواش"
  en: "The Ghuzz enter Mosul and plunder Qarwash's palace"
summary:
  ar: "في سنة خمس وثلاثين وأربعمائة دخل الغز الموصل وأخذوا حرم قرواش بن المقلد أميرها وأفسدوا فيها، فوصل أبو البركات ربيب أبي جعفر السمناني إلى الخليفة مستنفرًا عليهم، وورد الشريف أبو الحسن بن جعفر النسابة هاربًا، فاجتمع قرواش بن المقلد ودبيس بن علي بن مزيد على الإيقاع بالغز فقتلوا منهم مقتلة عظيمة، وخُطب في بغداد للملك أبي كاليجار {cite:muntazam-ibn-al-jawzi j.8 p.459}. ونهب الغز من دار قرواش ما يزيد على مائتي ألف دينار {cite:muntazam-ibn-al-jawzi j.8 p.489}."
  en: "In 435 the Ghuzz entered Mosul, seized Qarwash ibn al-Muqallad's harem quarters and ruined them; after his appeal reached the caliph, Qarwash and Dubays ibn Ali ibn Mazyad combined and inflicted a great slaughter on the Ghuzz — and the khutba at Baghdad went to the Buyid Abu Kalijar. The Ghuzz had plundered over 200,000 dinars from Qarwash's palace {cite:muntazam-ibn-al-jawzi j.8 p.459,489}."
