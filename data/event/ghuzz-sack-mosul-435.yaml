id: event/ghuzz-sack-mosul-435
class: event
kind: conquest
label:
  ar: "الغز يدخلون الموصل وينهبون دار قرواش"
  en: "The Ghuzz enter Mosul and plunder Qarwash's palace"
  es: "Los Ghuzz entran en Mosul y saquean el palacio de Qarwash."
  fr: "Les Ghuzz entrent dans Mossoul et pillent le palais de Qarwash"
  ur: "غزوہ موصل میں داخل ہوئے اور قروش کے محل کو لوٹ لیا۔"
  tr: "Ghuzzlar Musul'a girip Qarwash'ın evini yağmaladılar."
  id: "Ghuzz memasuki Mosul dan menjarah rumah Qarwash."
summary:
  ar: "في سنة خمس وثلاثين وأربعمائة دخل الغز الموصل وأخذوا حرم قرواش بن المقلد أميرها وأفسدوا فيها، فوصل أبو البركات ربيب أبي جعفر السمناني إلى الخليفة مستنفرًا عليهم، وورد الشريف أبو الحسن بن جعفر النسابة هاربًا، فاجتمع قرواش بن المقلد ودبيس بن علي بن مزيد على الإيقاع بالغز فقتلوا منهم مقتلة عظيمة، وخُطب في بغداد للملك أبي كاليجار {cite:muntazam-ibn-al-jawzi j.8 p.459}. ونهب الغز من دار قرواش ما يزيد على مائتي ألف دينار {cite:muntazam-ibn-al-jawzi j.8 p.489}."
  en: "In 435 the Ghuzz entered Mosul, seized Qarwash ibn al-Muqallad's harem quarters and ruined them; after his appeal reached the caliph, Qarwash and Dubays ibn Ali ibn Mazyad combined and inflicted a great slaughter on the Ghuzz — and the khutba at Baghdad went to the Buyid Abu Kalijar. The Ghuzz had plundered over 200,000 dinars from Qarwash's palace {cite:muntazam-ibn-al-jawzi j.8 p.459,489}."
  es: "En 435, los Ghuzz entraron en Mosul, se apoderaron del harén de Qarwash ibn al-Muqallad y lo devastaron. Tras llegar su petición al califa, Qarwash y Dubays ibn Ali ibn Mazyad se unieron y aniquilaron a los Ghuzz, y la jutba de Bagdad pasó a manos del buyí Abu Kalijar. Los Ghuzz habían saqueado más de 200.000 dinares del palacio de Qarwash {cite:muntazam-ibn-al-jawzi j.8 p.459,489}."
  fr: "En 435, les Ghuzz entrèrent à Mossoul, s'emparèrent du harem de Qarwash ibn al-Muqallad et le saccagèrent. Suite à l'appel de ce dernier au calife, Qarwash et Dubays ibn Ali ibn Mazyad s'allièrent et infligèrent un massacre aux Ghuzz. Le sermon (khutba) à Bagdad fut confié au bouyide Abou Kalijar. Les Ghuzz avaient pillé plus de 200 000 dinars au palais de Qarwash (voir: Muntazam ibn al-Jawzi, vol. 8, p. 459, 489)."
  ur: "435 میں غزوہ موصل میں داخل ہوا، قروش ابن المقلد کے حرم پر قبضہ کر کے انہیں برباد کر دیا۔ جب اس کی اپیل خلیفہ تک پہنچی تو قرواش اور دوبیس ابن علی ابن مازیاد نے مل کر غزوۂ ذبح کیا اور بغداد میں خطبہ بوید ابو کلیجار کے پاس گیا۔ غزوہ قروش کے محل سے 200,000 دینار لوٹ کر لے گئے تھے۔"
  tr: "Hicri 435 yılında (Miladi 1047/1048), Guzzlar Musul'a girerek hükümdarı Kurvas ibn el-Mukallad'ın kadınlarını kaçırdılar ve orada büyük bir yıkıma yol açtılar. Ebu Cafer el-Samnani'nin üvey oğlu Ebu el-Barakat, onlara karşı harekete geçmek için halifeye gitti ve soylu Ebu el-Hasan ibn Cafer el-Nassabe kaçarak geldi. Bunun üzerine Kurvas ibn el-Mukallad ve Dubeys ibn Ali ibn Mazid, Guzzlara saldırmak için güçlerini birleştirdiler ve onlara büyük bir katliam yaşattılar. Bağdat'ta Cuma hutbesi Kral Ebu Kalijar adına kılındı. Guzzlar, Kurvas'ın evinden iki yüz bin dinardan fazla yağmaladılar."
  id: "Pada tahun 435 H (1047/1048 M), kaum Ghuzz memasuki Mosul dan menyandera para wanita Qurwash ibn al-Muqallad, penguasa kota itu, dan menimbulkan kekacauan di sana. Abu al-Barakat, anak tiri Abu Ja'far al-Samnani, pergi menemui Khalifah untuk memobilisasi pasukan melawan mereka, dan Abu al-Hasan ibn Ja'far al-Nassabah yang mulia tiba dalam pelarian. Qurwash ibn al-Muqallad dan Dubays ibn Ali ibn Mazid kemudian bergabung untuk menyerang kaum Ghuzz, dan menimbulkan pembantaian besar-besaran terhadap mereka. Khutbah Jumat disampaikan di Baghdad atas nama Raja Abu Kalijar. Kaum Ghuzz menjarah lebih dari dua ratus ribu dinar dari rumah Qurwash."
