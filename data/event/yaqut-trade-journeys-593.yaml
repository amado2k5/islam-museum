label:
  ar: "أسفار ياقوت التجارية عن مولاه: كيش وعمان والشام، نحو ٥٩٣هـ/١١٩٧م"
  en: "Yaqut's trading journeys for his master: Kish, Oman and Syria, c. 593/1197"
  ur: "یاقوت کے مولیٰ کے لیے تجارتی سفر: کیش، عمان اور شام، تقریباً 593ھ/1197ء"
summary:
  ar: "شغّل مولاه عسكر ياقوتَ في أسفار تجارته فتردد إلى جزيرة كيش وإلى عُمان — وأكثر أهلها يومئذ خوارج إياضية — وإلى الشام، ومن أسفاره رحلة بغداد–آمد–الشام–بغداد في ٥٩٣–٥٩٤هـ/١١٩٧–١١٩٨م {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 277}، وكان في تلك الأسفار يقرأ ويلتقي بالعلماء حتى تكوّنت له ملكة علمية {cite:mawsuat-a3lam-ulama-adaba p. 277}."
  en: "His master Askar employed Yaqut on his trading ventures: he shuttled to the island of Kish, to Oman — most of whose people were then Ibadi Kharijis — and to Syria; one itinerary ran Baghdad–Amid–Syria–Baghdad in 593-4/1197-8 {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 277}. On these journeys he read and met scholars until a real scholarly temperament formed in him {cite:mawsuat-a3lam-ulama-adaba p. 277}."
  ur: "مولیٰ عسکر نے یاقوت کو تجارتی سفروں میں لگایا: جزیرہ کیش، عمان — جہاں اکثر لوگ اباضیہ خارجی تھے — اور شام کے رخ؛ ایک سفر بغداد–آمد–شام–بغداد 593-94ھ/1197-98ء میں ہوا {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 277}. ان سفروں میں وہ مطالعہ کرتا اور علماء سے ملتا، یہاں تک کہ علمی ملکہ پیدا ہوگیا {cite:mawsuat-a3lam-ulama-adaba p. 277}۔"
