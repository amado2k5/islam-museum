class: event
kind: other
label:
  ar: "أسفار ياقوت التجارية عن مولاه: كيش وعمان والشام، نحو ٥٩٣هـ/١١٩٧م"
  en: "Yaqut's trading journeys for his master: Kish, Oman and Syria, c. 593/1197"
  ur: "یاقوت کے مولیٰ کے لیے تجارتی سفر: کیش، عمان اور شام، تقریباً 593ھ/1197ء"
  es: "Los viajes comerciales de Yaqut para su amo: Kish, Omán y Siria, c. 593/1197"
  fr: "Les voyages commerciaux de Yaqut pour son maître: Kish, Oman et Syrie, vers 593/1197"
  tr: "Yaqut'un efendisi adına yaptığı ticari seyahatler: Kiş, Umman ve Levant, yaklaşık 593 Hicri/1197 Miladi."
  id: "Perjalanan dagang Yaqut atas nama tuannya: Kish, Oman, dan Levant, sekitar tahun 593 H/1197 M"
summary:
  ar: "شغّل مولاه عسكر ياقوتَ في أسفار تجارته فتردد إلى جزيرة كيش وإلى عُمان — وأكثر أهلها يومئذ خوارج إياضية — وإلى الشام، ومن أسفاره رحلة بغداد–آمد–الشام–بغداد في ٥٩٣–٥٩٤هـ/١١٩٧–١١٩٨م {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 277}، وكان في تلك الأسفار يقرأ ويلتقي بالعلماء حتى تكوّنت له ملكة علمية {cite:mawsuat-a3lam-ulama-adaba p. 277}."
  en: "His master Askar employed Yaqut on his trading ventures: he shuttled to the island of Kish, to Oman — most of whose people were then Ibadi Kharijis — and to Syria; one itinerary ran Baghdad–Amid–Syria–Baghdad in 593-4/1197-8 {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 277}. On these journeys he read and met scholars until a real scholarly temperament formed in him {cite:mawsuat-a3lam-ulama-adaba p. 277}."
  ur: "مولیٰ عسکر نے یاقوت کو تجارتی سفروں میں لگایا: جزیرہ کیش، عمان — جہاں اکثر لوگ اباضیہ خارجی تھے — اور شام کے رخ؛ ایک سفر بغداد–آمد–شام–بغداد 593-94ھ/1197-98ء میں ہوا {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 277}. ان سفروں میں وہ مطالعہ کرتا اور علماء سے ملتا، یہاں تک کہ علمی ملکہ پیدا ہوگیا {cite:mawsuat-a3lam-ulama-adaba p. 277}۔"
  es: "Su amo Askar empleó a Yaqut en sus empresas comerciales: viajaba a la isla de Kish, a Omán —cuya mayoría de la población eran entonces ibadíes jariyíes— y a Siria; un itinerario lo llevó de Bagdad a Amid, Siria y de vuelta a Bagdad en 593-4/1197-8 {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 277}. En estos viajes leyó y conoció a eruditos hasta que se formó en él un verdadero temperamento académico {cite:mawsuat-a3lam-ulama-adaba p. 277}."
  fr: "Son maître Askar employa Yaqut dans ses entreprises commerciales: il fit la navette vers l’île de Kish, vers Oman – dont la population était alors majoritairement composée de Kharijites ibadites – et vers la Syrie; un de ses itinéraires reliait Bagdad à la Syrie en 593-594/1197-1198 (voir: Encyclopaedia of Islam, vol. 11, p. 265; Mawsuat-a3lam-ulama-adaba, p. 277). Au cours de ces voyages, il lut et rencontra des érudits, ce qui lui permit de développer un véritable esprit d’étude (voir: Mawsuat-a3lam-ulama-adaba, p. 277)."
  tr: "Efendisi, Askar Yaqut'u ticaret yolculuklarında görevlendirdiğinden, o da sık sık Kiş ve Umman adalarını (o dönemde halkının çoğu İyad Harici idi) ve Levant'ı ziyaret etti. Yolculukları arasında 593-594 Hicri/1197-1198 Miladi yıllarındaki Bağdat-Levant-Bağdat yolculuğu da vardı. Bu yolculuklar sırasında, ilim yeteneği geliştirene kadar okur ve alimlerle görüşürdü."
  id: "Tuannya mempekerjakan Askar Yaqut dalam perjalanan dagangnya, sehingga ia sering mengunjungi pulau Kish dan Oman — sebagian besar penduduknya pada waktu itu adalah Iyad Kharijites — dan Levant. Di antara perjalanannya adalah perjalanan Baghdad-Amid-Levant-Baghdad pada tahun 593-594 H/1197-1198 M {cite:encyclopaedia-of-islam-2 vol. 11 p. 265} {cite:mawsuat-a3lam-ulama-adaba p. 277}. Selama perjalanan tersebut, ia membaca dan bertemu dengan para ulama hingga ia mengembangkan bakat ilmiah {cite:mawsuat-a3lam-ulama-adaba p. 277}."
