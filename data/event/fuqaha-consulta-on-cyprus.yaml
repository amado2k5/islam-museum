id: event/fuqaha-consulta-on-cyprus
class: event
kind: other
label: { ar: "مشاورة الفقهاء في أمر قبرس", en: "The Jurists' Consultation on Cyprus" }
summary:
  ar: "عند البلاذري عن بعض أهل العلم من الشاميين وأبي عبيد القاسم بن سلام: أحدث أهل قبرس حدثاً في ولاية عبد الملك بن صالح بن علي العباسي على الثغور فأراد نقض صلحهم والفقهاء متوافرون، فكتب إلى الليث بن سعد ومالك بن أنس وسفيان بن عيينة وموسى بن أعين وإسماعيل بن عياش ويحيى بن حمزة وأبي إسحاق الفزاري ومخلد بن الحسين في أمرهم فأجابوه؛ ومن فتاواهم: الليث بن سعد — اتهمهم بغش أهل الإسلام ومناصحة الروم وأرى أن تنبذ إليهم ويُنظروا سنة يأتمرون فمن أحب اللحاق ببلاد المسلمين ذمّةً يؤدي الخراج قُبل منه ومن أراد الانتحاء إلى بلاد الروم فعل ومن أراد المقام بقبرس على الحرب أقام؛ مالك بن أنس — أمانهم قديم متظاهر من الولاة لهم ولم أجد أحداً نقض صلحهم فأرى أن لا تعجل بنقض عهدهم حتى تنكح الحجة عليهم؛ سفيان بن عيينة — لا نعلم أن الله عاهد قوماً فنقضوا العهد إلا استحل قتلهم غير أهل مكة؛ موسى بن أعين — لم أر أحداً ممن مضى نقضهم وأرى الوفاء لهم والتمام على شرطهم ونقل عن الأوزاعي أن الذمي إن دلّ المشركين على عورة المسلمين خرج من ذمته وإن كان صلحاً نُبذ إليه على سواء؛ إسماعيل بن عياش — هم أذلاء مقهورون يغلبهم الروم على أنفسهم ونسائهم فيحق علينا أن نمنعهم ونحميهم وأن يُقَرّوا على عهدهم وذمّتهم؛ يحيى بن حمزة — أمر قبرس كأمر عربسوس التي أرشد بها عمير بن سعد عمر فخيّرهم عمر بين ضعف المال والجلاء فأبوا فأجلهم سنة ثم أخربها، وقال إنهم أهل فدية لا أهل ذمة؛ أبو إسحاق الفزاري ومخلد بن الحسين — لم نر شيئاً أشبه بأمر قبرس من أمر عربسوس ونقل عن الأوزاعي أن قبرس صُولحت على أربعة عشر ألف دينار سبعة للمسلمين وسبعة للروم وأنه لا يستقيم نقض صلحهم إلا بأمر يُعرف فيه غدرهم ونكثهم."
  en: "In al-Baladhuri from Syrian scholars and Abu Ubayd al-Qasim ibn Sallam: the people of Cyprus gave fresh offence while Abd al-Malik ibn Salih ibn Ali the Abbasid governed the marches, and he wished to annul their treaty — the jurists being accessible — so he wrote to al-Layth ibn Sa'd, Malik ibn Anas, Sufyan ibn Uyayna, Musa ibn A'yun, Isma'il ibn Ayyash, Yahya ibn Hamza, Abu Ishaq al-Fazari and Makhlad ibn al-Husayn about their case and they answered him; among their rulings: al-Layth ibn Sa'd — they are suspected of betraying the Muslims and counselling the Byzantines; I hold you should denounce the treaty and give them a year's grace to choose — whoever wishes may join the Muslims' lands as a dhimmi paying kharaj, whoever wishes may withdraw to Byzantine lands, and whoever would stay in Cyprus stays at war; Malik ibn Anas — their safe-conduct is ancient and successive governors have honoured it, I find none who annulled their treaty, and hold you should not hasten to denounce it until the proof stands against them; Sufyan ibn Uyayna — we know of no people God covenanted with who broke the covenant without their blood becoming lawful, save the people of Mecca; Musa ibn A'yun — I have seen none of our predecessors annul them and hold they should be kept to their terms, transmitting from al-Awza'i that a dhimmi who guided the polytheists to the Muslims' weakness has left his dhimma, while a mere treaty-people is denounced openly; Isma'il ibn Ayyash — they are a humbled, conquered people whom the Byzantines master over their own lives and women, so it is our duty to defend and protect them and keep them on their covenant; Yahya ibn Hamza — Cyprus's case is that of Arabasus, where Umayr ibn Sa'd reported to Umar and Umar offered them double their wealth or expulsion, and when they refused he exiled them a year then ruined it — they are people of ransom, not of dhimma; Abu Ishaq al-Fazari and Makhlad ibn al-Husayn — nothing resembles Cyprus's case but Arabasus and Umar's ruling in it, transmitting from al-Awza'i that Cyprus's treaty was fourteen thousand dinars, seven to the Muslims and seven to the Byzantines, and that their treaty cannot be annulled save for an act in which their treachery is known."
