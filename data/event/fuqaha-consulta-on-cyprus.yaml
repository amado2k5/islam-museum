id: event/fuqaha-consulta-on-cyprus
class: event
kind: other
label: { ar: "مشاورة الفقهاء في أمر قبرس", en: "The Jurists' Consultation on Cyprus", es: "La consulta de juristas sobre Chipre", fr: "Consultation des juristes sur Chypre", ur: "قبرص پر فقہاء کی مشاورت" }
summary:
  ar: "عند البلاذري عن بعض أهل العلم من الشاميين وأبي عبيد القاسم بن سلام: أحدث أهل قبرس حدثاً في ولاية عبد الملك بن صالح بن علي العباسي على الثغور فأراد نقض صلحهم والفقهاء متوافرون، فكتب إلى الليث بن سعد ومالك بن أنس وسفيان بن عيينة وموسى بن أعين وإسماعيل بن عياش ويحيى بن حمزة وأبي إسحاق الفزاري ومخلد بن الحسين في أمرهم فأجابوه؛ ومن فتاواهم: الليث بن سعد — اتهمهم بغش أهل الإسلام ومناصحة الروم وأرى أن تنبذ إليهم ويُنظروا سنة يأتمرون فمن أحب اللحاق ببلاد المسلمين ذمّةً يؤدي الخراج قُبل منه ومن أراد الانتحاء إلى بلاد الروم فعل ومن أراد المقام بقبرس على الحرب أقام؛ مالك بن أنس — أمانهم قديم متظاهر من الولاة لهم ولم أجد أحداً نقض صلحهم فأرى أن لا تعجل بنقض عهدهم حتى تنكح الحجة عليهم؛ سفيان بن عيينة — لا نعلم أن الله عاهد قوماً فنقضوا العهد إلا استحل قتلهم غير أهل مكة؛ موسى بن أعين — لم أر أحداً ممن مضى نقضهم وأرى الوفاء لهم والتمام على شرطهم ونقل عن الأوزاعي أن الذمي إن دلّ المشركين على عورة المسلمين خرج من ذمته وإن كان صلحاً نُبذ إليه على سواء؛ إسماعيل بن عياش — هم أذلاء مقهورون يغلبهم الروم على أنفسهم ونسائهم فيحق علينا أن نمنعهم ونحميهم وأن يُقَرّوا على عهدهم وذمّتهم؛ يحيى بن حمزة — أمر قبرس كأمر عربسوس التي أرشد بها عمير بن سعد عمر فخيّرهم عمر بين ضعف المال والجلاء فأبوا فأجلهم سنة ثم أخربها، وقال إنهم أهل فدية لا أهل ذمة؛ أبو إسحاق الفزاري ومخلد بن الحسين — لم نر شيئاً أشبه بأمر قبرس من أمر عربسوس ونقل عن الأوزاعي أن قبرس صُولحت على أربعة عشر ألف دينار سبعة للمسلمين وسبعة للروم وأنه لا يستقيم نقض صلحهم إلا بأمر يُعرف فيه غدرهم ونكثهم."
  en: "In al-Baladhuri from Syrian scholars and Abu Ubayd al-Qasim ibn Sallam: the people of Cyprus gave fresh offence while Abd al-Malik ibn Salih ibn Ali the Abbasid governed the marches, and he wished to annul their treaty — the jurists being accessible — so he wrote to al-Layth ibn Sa'd, Malik ibn Anas, Sufyan ibn Uyayna, Musa ibn A'yun, Isma'il ibn Ayyash, Yahya ibn Hamza, Abu Ishaq al-Fazari and Makhlad ibn al-Husayn about their case and they answered him; among their rulings: al-Layth ibn Sa'd — they are suspected of betraying the Muslims and counselling the Byzantines; I hold you should denounce the treaty and give them a year's grace to choose — whoever wishes may join the Muslims' lands as a dhimmi paying kharaj, whoever wishes may withdraw to Byzantine lands, and whoever would stay in Cyprus stays at war; Malik ibn Anas — their safe-conduct is ancient and successive governors have honoured it, I find none who annulled their treaty, and hold you should not hasten to denounce it until the proof stands against them; Sufyan ibn Uyayna — we know of no people God covenanted with who broke the covenant without their blood becoming lawful, save the people of Mecca; Musa ibn A'yun — I have seen none of our predecessors annul them and hold they should be kept to their terms, transmitting from al-Awza'i that a dhimmi who guided the polytheists to the Muslims' weakness has left his dhimma, while a mere treaty-people is denounced openly; Isma'il ibn Ayyash — they are a humbled, conquered people whom the Byzantines master over their own lives and women, so it is our duty to defend and protect them and keep them on their covenant; Yahya ibn Hamza — Cyprus's case is that of Arabasus, where Umayr ibn Sa'd reported to Umar and Umar offered them double their wealth or expulsion, and when they refused he exiled them a year then ruined it — they are people of ransom, not of dhimma; Abu Ishaq al-Fazari and Makhlad ibn al-Husayn — nothing resembles Cyprus's case but Arabasus and Umar's ruling in it, transmitting from al-Awza'i that Cyprus's treaty was fourteen thousand dinars, seven to the Muslims and seven to the Byzantines, and that their treaty cannot be annulled save for an act in which their treachery is known."
  es: "En al-Baladhuri de los eruditos sirios y Abu Ubayd al-Qasim ibn Sallam: el pueblo de Chipre cometió una nueva ofensa mientras Abd al-Malik ibn Salih ibn Ali el abasí gobernaba las marcas, y él deseaba anular su tratado —siendo accesibles los juristas— así que escribió a al-Layth ibn Sa'd, Malik ibn Anas, Sufyan ibn Uyayna, Musa ibn A'yun, Isma'il ibn Ayyash, Yahya ibn Hamza, Abu Ishaq al-Fazari y Makhlad ibn al-Husayn sobre su caso y ellos le respondieron; entre sus dictámenes: al-Layth ibn Sa'd — son sospechosos de traicionar a los musulmanes y aconsejar a los bizantinos; Sostengo que debéis denunciar el tratado y darles un año de gracia para elegir: quien quiera puede unirse a las tierras de los musulmanes como dhimmi pagando kharaj, quien quiera puede retirarse a tierras bizantinas, y quien quiera quedarse en Chipre se queda en guerra; Malik ibn Anas: su salvoconducto es antiguo y los sucesivos gobernadores lo han honrado, no encuentro a nadie que haya anulado su tratado, y sostengo que no debéis apresuraros a denunciarlo hasta que la prueba esté en su contra; Sufyan ibn Uyayna: no conocemos a ningún pueblo con el que Dios haya hecho un pacto que haya roto el pacto sin que su sangre se volviera lícita, salvo el pueblo de La Meca; Musa ibn A'yun: no he visto a ninguno de nuestros predecesores anularlos y sostengo que deben mantenerse en sus términos, transmitiendo de al-Awza'i que un dhimmi que guió a los politeístas a la debilidad de los musulmanes ha dejado su dhimma, mientras que un simple pueblo de tratado es denunciado abiertamente; Isma'il ibn Ayyash: son un pueblo humillado y conquistado al que los bizantinos dominan sobre sus propias vidas y mujeres, por lo que es nuestro deber defenderlos y protegerlos y mantenerlos en su pacto; Yahya ibn Hamza: el caso de Chipre es el de Arabasus, donde Umayr ibn Sa'd informó a Umar y Umar les ofreció el doble de su riqueza o la expulsión, y cuando se negaron los exilió un año y luego lo arruinó; son gente de rescate, no de dhimma; Abu Ishaq al-Fazari y Makhlad ibn al-Husayn: nada se asemeja al caso de Chipre excepto Arabasus y el dictamen de Umar en él, transmitiendo de al-Awza'i que el tratado de Chipre era de catorce mil dinares, siete para los musulmanes y siete para los bizantinos, y que su tratado no puede ser anulado salvo por un acto en el que se conozca su traición."
  fr: "Dans al-Baladhuri, d'après les érudits syriens et Abu Ubayd al-Qasim ibn Sallam: les habitants de Chypre protestèrent à nouveau alors qu'Abd al-Malik ibn Salih ibn Ali, l'Abbasside, gouvernait les Marches et souhaitait annuler leur traité. Les juristes étant accessibles, il écrivit à al-Layth ibn Sa'd, Malik ibn Anas, Sufyan ibn Uyayna, Musa ibn A'yun, Isma'il ibn Ayyash, Yahya ibn Hamza, Abu Ishaq al-Fazari et Makhlad ibn al-Husayn pour leur exposer leur cas, et ils lui répondirent. Parmi leurs décisions: al-Layth ibn Sa'd est soupçonné d'avoir trahi les musulmans et conseillé les Byzantins. Je soutiens que vous devriez dénoncer le traité et leur accorder un an de grâce pour choisir: celui qui le souhaite peut rejoindre les terres musulmanes en tant que dhimmi payant le kharaj, celui qui le souhaite peut se retirer en terres byzantines, et celui qui veut rester à Chypre reste en guerre. Malik ibn Anas: leur sauf-conduit est ancien et les gouverneurs successifs l'ont honoré. Je ne connais personne qui ait annulé leur traité, et je soutiens que vous ne devriez pas vous hâter de le dénoncer tant que la preuve ne s'impose pas contre eux. Sufyan ibn Uyayna: nous ne connaissons aucun peuple avec lequel Dieu a conclu une alliance qui l'ait rompue sans que son sang ne devienne licite, sauf le peuple de La Mecque. Musa ibn A'yun: je n'ai vu aucun de nos prédécesseurs les annuler et je soutiens qu'ils doivent être respectés, transmettant d'al-Awza'i qu'un dhimmi qui a guidé les polythéistes vers la faiblesse des musulmans a quitté son statut de dhimmi, tandis qu'un simple signataire de traité est dénoncé ouvertement. Isma'il ibn Ayyash — Ce sont des gens humiliés et conquis, que les Byzantins dominent sur leur vie et leurs femmes. Il est donc de notre devoir de les défendre, de les protéger et de veiller à ce qu'ils respectent leur engagement. Yahya ibn Hamza — Le cas de Chypre est comparable à celui d'Arabasus, où Umayr ibn Sa'd rapporta la situation à Umar, qui leur offrit le double de leurs richesses ou l'expulsion. Face à leur refus, il les exila un an puis ruina le pays. Ce sont des gens qui ont recours à la rançon, non à la dhimma. Abu Ishaq al-Fazari et Makhlad ibn al-Husayn — Rien ne ressemble au cas de Chypre, si ce n'est la décision d'Arabasus et d'Umar, qui rapportent d'al-Awza'i que le traité de Chypre s'élevait à quatorze mille dinars, sept aux musulmans et sept aux Byzantins, et que ce traité ne pouvait être annulé que par un acte révélant leur trahison."
  ur: "شام کے علماء اور ابو عبید القاسم بن سلام سے البلاذری میں ہے: قبرص کے لوگوں نے تازہ جرم کیا جب کہ عبد الملک بن صالح ابن علی عباسی مارچوں پر حکومت کر رہے تھے، اور وہ ان کے معاہدے کو منسوخ کرنا چاہتے تھے - فقہا کی رسائی ہو رہی تھی - لہذا اس نے ال لیثین، صوفیان مالکان کو لکھا۔ عیینہ، موسیٰ بن عیون، اسماعیل بن عیاش، یحییٰ بن حمزہ، ابو اسحاق الفزاری اور مخلد بن الحسین نے ان کے معاملے کے بارے میں کہا اور انہوں نے اسے جواب دیا۔ ان کے احکام میں سے: لیث بن سعد - ان پر مسلمانوں کے ساتھ غداری کرنے اور بازنطینیوں کو مشورہ دینے کا شبہ ہے۔ میں سمجھتا ہوں کہ آپ اس معاہدے کی مذمت کریں اور انہیں ایک سال کا انتخاب کرنے کے لیے مہلت دیں - جو چاہے ذمی کے طور پر مسلمانوں کی سرزمینوں میں شامل ہو کر خراج ادا کر سکتا ہے، جو چاہے بازنطینی سرزمینوں کو واپس لے سکتا ہے، اور جو قبرص میں رہے گا وہ جنگ میں رہے گا۔ مالک بن انس - ان کا حسن سلوک قدیم ہے اور ان کے بعد آنے والے گورنروں نے اس کی تعظیم کی ہے، میں نے ان کے معاہدے کو منسوخ کرنے والا کوئی نہیں پایا، اور آپ کو اس کی مذمت کرنے میں جلدی نہیں کرنی چاہئے جب تک کہ ان کے خلاف ثبوت نہ ہو۔ سفیان بن عیینہ - ہم کسی ایسے لوگوں کے بارے میں نہیں جانتے جس سے خدا نے عہد کیا ہو جنہوں نے اس عہد کو توڑا کہ ان کا خون حلال نہیں ہوا، سوائے مکہ کے لوگوں کے۔ موسیٰ بن عیون - میں نے ہمارے پیشروؤں میں سے کسی کو بھی ان کو منسوخ کرتے ہوئے نہیں دیکھا اور انہیں ان کی شرائط پر برقرار رکھنے کا حکم دیا، الاوزاعی سے نقل کیا گیا ہے کہ ایک ذمی جس نے مشرکین کو مسلمانوں کی کمزوری کی طرف رہنمائی کی تھی اس نے اپنے ذم کو چھوڑ دیا ہے، جب کہ محض معاہدہ کرنے والوں کی کھلم کھلا مذمت کی گئی ہے۔ اسماعیل بن عیاش - وہ ایک عاجز، فتح یافتہ لوگ ہیں جنہیں بازنطینی اپنی جانوں اور عورتوں پر عبور رکھتے ہیں، اس لیے یہ ہمارا فرض ہے کہ ہم ان کا دفاع اور حفاظت کریں اور انھیں اپنے عہد پر قائم رکھیں۔ یحییٰ بن حمزہ - قبرص کا معاملہ عربس کا ہے، جہاں عمیر بن سعد نے عمر کو اطلاع دی اور عمر نے انہیں اپنی دولت دوگنا یا ملک بدر کرنے کی پیشکش کی، اور جب انہوں نے انکار کیا تو اس نے انہیں ایک سال جلاوطن کر دیا، پھر اسے برباد کر دیا، یہ لوگ فدیہ کے لوگ ہیں، ذمّہ کے نہیں۔ ابو اسحاق الفزاری اور مخلد ابن الحسین - قبرص کے معاملے سے کچھ بھی مشابہت نہیں رکھتا مگر اس میں عرباس اور عمر کا حکم، الاوزاعی سے نقل ہوا ہے کہ قبرص کا معاہدہ چودہ ہزار دینار تھا، سات مسلمانوں کے لیے اور سات بازنطینیوں کے لیے، اور یہ کہ ان کے معاہدے میں ان کے معاہدے کو محفوظ نہیں کیا جا سکتا۔"
