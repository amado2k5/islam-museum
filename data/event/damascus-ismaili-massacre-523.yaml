summary:
  ar: "في سنة ثلاث وعشرين وخمسمائة قتل بدمشق نحو ستة آلاف ممن كان يُرمى بعقيدة الإسماعيلية؛ وكان بهرام الأستراباذي قد دخل الشام فأضمر خلقاً فولاه طغتكين بانياس، وأقام لبهرام داعية بدمشق فتكاثر أتباعه وملكوا حصوناً بالشام منها القدموس، وسُلّم أمان بانياس للفرنج {cite:shadharat-dhahab p. 546}."
  en: "In 523 about six thousand people accused of Ismaili allegiance were killed at Damascus; Bahram al-Astarabadhi had entered Syria gathering followers, Tughtigin granted him Banyas, his da'i drew a large Damascus following, and they held Syrian fortresses including Qadmus — while Banyas's safe-conduct was handed to the Franks {cite:shadharat-dhahab p. 546}."
