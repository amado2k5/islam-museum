label: { ar: "استيلاء المرابطين على إشبيلية" }
summary:
  ar: "في سنة أربع وثمانين وأربعمائة دخلت المرابطون إشبيلية فخرج المعتمد بن عباد والموت يتسعر في ألحاظه فلقيهم برحبة القصر فحمل فيهم حملة صيرتهم فرقاً وملأتهم فرقاً وما زال يوالي عليهم الكر المعاد حتى أوردهم النهر وما بهم جواد وأودعهم حشاه كأنهم له فؤاد، ثم انصرف وقد أيقن بانتهاء حاله وذهاب ملكه وقال «بيدي لا بيد عمرو» فنزل من القصر بالقسر إلى قبضة الأسر فقُيد وحُمل إلى أغمات بالمغرب، وانقضت بذلك دولة بني عباد بإشبيلية التي دامت نحو ستين سنة من أيام المعتضد عباد بن إسماعيل، وكان المعتمد أشهر ملوك الطوائف شعراً وحضارة وملكاً {cite:nafh-tib-maqqari p. 216-218}."
  en: "In 484 the Almoravids entered Seville; al-Mu'tamid ibn Abbad charged them at the palace square, then yielded 'by my hand, not Amr's' — dragged to captivity and exiled to Aghmat, ending the sixty-year Abbadid kingdom, Andalus's most celebrated taifa {cite:nafh-tib-maqqari p. 216-218}."
