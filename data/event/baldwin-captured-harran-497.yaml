label:
  ar: أسر القمص بردويل صاحب الرها
  en: Capture of Count Baldwin of Edessa
  fr: "La capture du comte Baudouin d'Édesse"
  es: "Captura del conde Balduino de Edesa"
summary:
  ar: "سنة 497هـ؛ اجتمع سقمان بن أرتق وجكرمش صاحب الموصل على جهاد الإفرنج وهم محاصرون حران فتركوا المنافسة بينهم وقصدوهم في سبعة آلاف من التركمان فهزموا الإفرنج وأسروا القمص بردويل صاحب الرها، فتغلب أصحاب جكرمش على أخذه من أصحاب سقمان وافترقوا بسبب ذلك وعادوا إلى ما كان بينهم من الفتن."
  en: "In 497 AH Sukman ibn Artuq and Jikirmish of Mosul joined for jihad on the Franks besieging Harran, setting rivalry aside; with seven thousand Turkman they routed the Franks and captured Count Baldwin of al-Ruha — but Jikirmish's men wrested the prisoner from Sukman's, and the allies split again over the spoils and returned to their feuding."
  fr: "En 497 H, Sukman ibn Artuq et Jikirmish de Mossoul s'unirent pour le jihad contre les Francs qui assiégeaient Harran, mettant de côté leur rivalité ; avec sept mille Turkmènes, ils mirent les Francs en déroute et capturèrent le comte Baudouin d'al-Ruha ; mais les hommes de Jikirmish arrachèrent le prisonnier à ceux de Sukman, et les alliés se séparèrent de nouveau à propos du butin et revinrent à leurs querelles."
  es: "En el año 497 de la Hégira, Sukman ibn Artuq y Jikirmish de Mosul se unieron para la yihad contra los francos que sitiaban Harran, dejando de lado su rivalidad; con siete mil turcomanos derrotaron a los francos y capturaron al conde Balduino de al-Ruha, pero los hombres de Jikirmish arrebataron al prisionero a los de Sukman, y los aliados se dividieron de nuevo por el botín y volvieron a sus disputas."
