label:
  ar: أسر القمص بردويل صاحب الرها
  en: Capture of Count Baldwin of Edessa
summary:
  ar: "سنة 497هـ؛ اجتمع سقمان بن أرتق وجكرمش صاحب الموصل على جهاد الإفرنج وهم محاصرون حران فتركوا المنافسة بينهم وقصدوهم في سبعة آلاف من التركمان فهزموا الإفرنج وأسروا القمص بردويل صاحب الرها، فتغلب أصحاب جكرمش على أخذه من أصحاب سقمان وافترقوا بسبب ذلك وعادوا إلى ما كان بينهم من الفتن."
  en: "In 497 AH Sukman ibn Artuq and Jikirmish of Mosul joined for jihad on the Franks besieging Harran, setting rivalry aside; with seven thousand Turkman they routed the Franks and captured Count Baldwin of al-Ruha — but Jikirmish's men wrested the prisoner from Sukman's, and the allies split again over the spoils and returned to their feuding."
