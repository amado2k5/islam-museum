id: "event/ibn-kayyala-is-struck-down-at-dhamar-in-rabi-i-299-ah"
class: event
kind: other
label:
  ar: "يُصاب ابن كيالة بذمار في ربيع الأول سنة 299هـ، ص398"
  en: "Ibn Kayyala is struck down at Dhamar on Tuesday, ten nights into Rabi' I 299 AH, p. 398"
  ur: "ابن کیالہ ربیع الاول 299ھ کی دس راتیں گزرنے پر منگل کے دن ذمار میں نشانہ بنتا ہے، ص398"
  es: "Ibn Kayyala muere en Dhamar el martes, diez noches después del inicio de Rabi' I 299 AH, pág. 398."
  fr: "Ibn Kayyala est tué à Dhamar le mardi, dix nuits après le début du mois de Rabi' I 299 AH, p. 398"
  tr: "İbn Kayyala, Hicri 299 yılının Rebiü'l-Evvel ayında bir hastalığa yakalandı (s. 398)."
  id: "Ibn Kayyala menderita suatu penyakit pada bulan Rabi' al-Awwal tahun 299 H, hlm. 398"
summary:
  ar: "يُصاب ابن كيالة بذمار يوم الثلاثاء لعشر ليال خلت من ربيع الأول سنة 299هـ، ويثبت أسعد في البلد، ويفرّق عماله في النواحي، ويقيم بذمار."
  en: "Ibn Kayyala is struck down at Dhamar on Tuesday, ten nights into Rabi' I 299 AH. Asad holds the city, sends his governors to the districts and stays at Dhamar."
  ur: "ربیع الاول 299ھ کی دس راتیں گزرنے پر منگل کے دن ابن کیالہ ذمار میں نشانہ بنتا ہے۔ اسعد شہر پر قابض رہتے ہیں، اپنے عاملوں کو نواحی علاقوں میں بھیجتے ہیں اور ذمار میں ٹھہرتے ہیں۔"
  es: "Ibn Kayyala muere en Dhamar el martes, diez noches después del inicio del Rabi' I del año 299 de la Hégira. Asad mantiene el control de la ciudad, envía a sus gobernadores a los distritos y permanece en Dhamar."
  fr: "Ibn Kayyala est tué à Dhamar le mardi 1er Rabi' 299 AH. Asad conserve la ville, envoie ses gouverneurs dans les districts et reste à Dhamar."
  tr: "İbn Kayala, Hicri 299 yılının Rebiü'l-Evvel ayının bitimine on gece kala, Salı günü Damar'da yaralandı. Esad şehirde kaldı, işçilerini bölgelere dağıttı ve kendisi Damar'da kaldı."
  id: "Ibn Kayala terluka di Dhamar pada hari Selasa, sepuluh malam sebelum berakhirnya bulan Rabi' al-Awwal tahun 299 Hijriah. As'ad tetap tinggal di kota itu, menyebar para pekerjanya ke berbagai distrik, dan menetap di Dhamar."
