label: { ar: "يوم ظهر الدهناء — حرب أوس بن حارثة على بني أسد بسبب بشر بن أبي خازم", en: "the day of Ẓahr al-Dahnāʾ — Aws ibn Ḥāritha's war on Asad for Bishr's satire" }
date:
  start: { edtf: "0590~", calendar: julian, precision: century, status: tradition, derived: true, note: "جاهلي؛ التاريخ تقريبي عند أهل الأيام {cite:kamil-ibn-al-athir p. 471-472}." }
summary:
  ar: "سببه أن قومًا من أهل أوس بن حارثة الطائي حسدوه على حلة ألبسه إياها النعمان بن المنذر فسألوا الحطيئة أن يهجوه بثلاثمائة ناقة فقال كيف أهجو رجلاً لا أرى في بيتي أثانًا ولا مالاً إلا منه، فهجاه بشر بن أبي خازم بالنوق وأفحش وذكر أمه سعدى، فاكتسح أوس نوقه وطلبه فالتجأ إلى بني أسد فمنعوه ورأوا تسليمه عارًا، فجمع أوس جديلة طيء فالتقوا بظهر الدهناء تلقاء تيم فانهزمت بنو أسد وقتلوا قتلاً ذريعًا، وظل بشر لا يأتي حيًا يطلب جواره إلا امتنع من إجارته على أوس حتى نزل على جندب بن حصن فأرسله إليه، فاستشار أمه فأشارت بالعفو ورد المال فإنه لا يغسل هجاءه إلا مدحه، فمنّ عليه ورد عليه ماله وأعطاه مائة من الإبل فقال بشر لا جرم لا مدحت أحدًا حتى أموت غيرك ومدحه بقصيدته أتعرف من هنيدة رسم دار {cite:kamil-ibn-al-athir p. 471-472}."
  en: "Envy over a royal robe al-Nuʿmān gave Aws ibn Ḥāritha led his kinsmen to commission a satire — al-Ḥuṭayʾa refused («how can I satirize a man whose gifts fill my house?») but Bishr ibn Abī Khāzim accepted the three hundred camels and lampooned Aws's mother Saʿdā. Aws seized the camels, hounded him to Banū Asad, and when they sheltered him he marched Jadīla of Ṭayyiʾ against them at Ẓahr al-Dahnāʾ, routing them. Bishr wandered refused asylum by every tribe until Jundub ibn Ḥiṣn surrendered him; on his mother's counsel — «only your praise will wash his satire» — Aws freed him, restored the camels and gave him a hundred more. Bishr swore to praise no other man till he died, beginning «do you know the trace of a camp at Hanīda?» {cite:kamil-ibn-al-athir p. 471-472}."
