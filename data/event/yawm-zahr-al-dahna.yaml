label: { ar: "يوم ظهر الدهناء — حرب أوس بن حارثة على بني أسد بسبب بشر بن أبي خازم", en: "the day of Ẓahr al-Dahnāʾ — Aws ibn Ḥāritha's war on Asad for Bishr's satire", es: "El día de Ẓahr al-Dahnāʾ — La guerra de Aws ibn Ḥāritha contra Asad por la sátira de Bishr", fr: "le jour de Ẓahr al-Dahnāʾ — la guerre d'Aws ibn Ḥāritha contre Asad pour la satire de Bishr", ur: "حر الدہنہ کا دن - بشر کے طنز کے لیے اوس بن حارثہ کی اسد کے خلاف جنگ" }
date:
  start: { edtf: "0590~", calendar: julian, precision: century, status: tradition, derived: true, note: "جاهلي؛ التاريخ تقريبي عند أهل الأيام {cite:kamil-ibn-al-athir p. 471-472}." }
summary:
  ar: "سببه أن قومًا من أهل أوس بن حارثة الطائي حسدوه على حلة ألبسه إياها النعمان بن المنذر فسألوا الحطيئة أن يهجوه بثلاثمائة ناقة فقال كيف أهجو رجلاً لا أرى في بيتي أثانًا ولا مالاً إلا منه، فهجاه بشر بن أبي خازم بالنوق وأفحش وذكر أمه سعدى، فاكتسح أوس نوقه وطلبه فالتجأ إلى بني أسد فمنعوه ورأوا تسليمه عارًا، فجمع أوس جديلة طيء فالتقوا بظهر الدهناء تلقاء تيم فانهزمت بنو أسد وقتلوا قتلاً ذريعًا، وظل بشر لا يأتي حيًا يطلب جواره إلا امتنع من إجارته على أوس حتى نزل على جندب بن حصن فأرسله إليه، فاستشار أمه فأشارت بالعفو ورد المال فإنه لا يغسل هجاءه إلا مدحه، فمنّ عليه ورد عليه ماله وأعطاه مائة من الإبل فقال بشر لا جرم لا مدحت أحدًا حتى أموت غيرك ومدحه بقصيدته أتعرف من هنيدة رسم دار {cite:kamil-ibn-al-athir p. 471-472}."
  en: "Envy over a royal robe al-Nuʿmān gave Aws ibn Ḥāritha led his kinsmen to commission a satire — al-Ḥuṭayʾa refused («how can I satirize a man whose gifts fill my house?») but Bishr ibn Abī Khāzim accepted the three hundred camels and lampooned Aws's mother Saʿdā. Aws seized the camels, hounded him to Banū Asad, and when they sheltered him he marched Jadīla of Ṭayyiʾ against them at Ẓahr al-Dahnāʾ, routing them. Bishr wandered refused asylum by every tribe until Jundub ibn Ḥiṣn surrendered him; on his mother's counsel — «only your praise will wash his satire» — Aws freed him, restored the camels and gave him a hundred more. Bishr swore to praise no other man till he died, beginning «do you know the trace of a camp at Hanīda?» {cite:kamil-ibn-al-athir p. 471-472}."
  es: "La envidia por una túnica real que al-Nuʿmān le dio a Aws ibn Ḥāritha llevó a sus parientes a encargar una sátira; al-Ḥuṭayʾa se negó («¿cómo puedo satirizar a un hombre cuyos regalos llenan mi casa?»), pero Bishr ibn Abī Khāzim aceptó los trescientos camellos y satirizó a la madre de Aws, Saʿdā. Aws se apoderó de los camellos, lo persiguió hasta Banū Asad, y cuando lo acogieron, marchó con Jadīla de Ṭayyiʾ contra ellos en Ẓahr al-Dahnāʾ, derrotándolos. Bishr vagó, rechazado por todas las tribus, hasta que Jundub ibn Ḥiṣn lo entregó; por consejo de su madre —«solo tu alabanza lavará su sátira»— Aws lo liberó, le devolvió los camellos y le dio cien más. Bishr juró no alabar a ningún otro hombre hasta su muerte, comenzando con «¿conoces el rastro de un campamento en Hanīda?» {cite:kamil-ibn-al-athir p. 471-472}."
  fr: "L'envie suscitée par une robe royale offerte par al-Nuʿmān incita ses proches à commander une satire à Aws ibn Ḥāritha. Al-Ḥuṭayʾa refusa (« comment pourrais-je satiriser un homme dont les présents remplissent ma maison ? »), mais Bishr ibn Abī Khāzim accepta les trois cents chameaux et ridiculisa la mère d'Aws, Saʿdā. Aws s'empara des chameaux, le poursuivit jusqu'aux Banū Asad, et lorsqu'ils l'eurent abrité, il mena Jadīla de Ṭayyiʾ contre eux à Ẓahr al-Dahnāʾ, les mettant en déroute. Bishr erra, refusant l'asile à toutes les tribus, jusqu'à ce que Jundub ibn Ḥiṣn le livre. Sur le conseil de sa mère – « seuls tes éloges laveront sa satire » –, Aws le libéra, lui rendit les chameaux et lui en offrit cent autres. Bishr jura de ne louer aucun autre homme jusqu'à sa mort, commençant par « connais-tu la trace d'un camp à Hanīda ? » {cite: kamil-ibn-al-athir p. 471-472}."
  ur: "شاہی لباس پر حسد کی وجہ سے اوس بن حارثہ نے اپنے رشتے داروں کو طنزیہ تحریر کرنے پر مجبور کیا - الحطیہ نے انکار کیا ⁦(\"میں ایسے شخص پر کس طرح طنز کروں جس کے تحفوں سے میرا گھر بھر جائے؟\")⁩ لیکن بشر بن ابی خزیم نے تین سو ماؤں کو قبول کر لیا۔ اوس نے اونٹوں کو پکڑ کر بنو اسد کے پاس پہنچایا اور جب انہوں نے اسے پناہ دی تو اس نے طائی کی جدیلہ کو ان کے خلاف حضر الدہنہ تک پہنچایا۔ بشر کو ہر قبیلے نے پناہ دینے سے انکار کر دیا یہاں تک کہ جندب بن حُسن نے اس کے حوالے کر دیا۔ اس کی والدہ کے مشورے پر - \"صرف آپ کی تعریف اس کے طنز کو دھو دے گی\" - اوس نے اسے آزاد کیا، اونٹ بحال کیے اور اسے سو اور دیئے۔ بشر نے قسم کھائی کہ وہ مرتے دم تک کسی اور کی تعریف نہیں کرے گا، شروع کر دیا، \"کیا آپ کو ہنیدہ کے کیمپ کا پتہ ہے؟\" {حوالہ: کامل ابن الاثیر ص۔ 471-472}۔"
