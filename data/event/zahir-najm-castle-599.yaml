summary:
  ar: "أخذ الملك الظاهر غازي بن صلاح الدين قلعة نجم على الفرات من أخيه الأفضل علي، وكان العادل قد أقطعها الأفضل تعويضًا عما فقد من مصر {cite:kamil-ibn-al-athir p. 283}."
  en: "Al-Zahir Ghazi ibn Saladin took the Euphrates castle of Najm from his brother al-Afdal — which al-Adil had granted him in compensation for lost Egypt {cite:kamil-ibn-al-athir p. 283}."
  es: "Al-Zahir Ghazi ibn Saladin tomó el castillo de Najm, en el Éufrates, de su hermano al-Afdal, que al-Adil le había concedido como compensación por la pérdida de Egipto {cite:kamil-ibn-al-athir p. 283}."
  fr: "Al-Zahir Ghazi ibn Saladin prit le château de Najm sur l'Euphrate à son frère al-Afdal — qu'al-Adil lui avait accordé en compensation de l'Égypte perdue {cite:kamil-ibn-al-athir p. 283}."
  ur: "الظاہر غازی ابن صلاح الدین نے فرات کا قلعہ نجم اپنے بھائی الفضل سے لیا جو العدل نے اسے کھوئے ہوئے مصر کے معاوضے میں دیا تھا۔ 283}۔"
  tr: "Kral Zahir Gazi bin Salah Al-Din, Fırat üzerindeki Necm kalesini kardeşi Al-Afdal Ali'den aldı ve Al-Adil, Mısır'dan kaybettiği toprakların karşılığı olarak bu kaleyi Al-Afdal'a vermişti. {Kaynak: Kamil ibn al-athir s. 283}"
  id: "Raja Al-Zahir Ghazi bin Salah Al-Din merebut benteng Najm di Sungai Eufrat dari saudaranya Al-Afdal Ali, dan Al-Adil telah memberikannya kepada Al-Afdal sebagai kompensasi atas apa yang telah hilang dari Mesir {cite:kamil-ibn-al-athir p. 283}."
