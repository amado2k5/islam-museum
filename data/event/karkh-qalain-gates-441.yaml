id: event/karkh-qalain-gates-441
class: event
kind: civil-war
label:
  ar: "حرب الأبواب بين الكرخ والقلائين"
  en: "The gate-building war between Karkh and al-Qala'in"
  es: "La guerra por la construcción de puertas entre Karkh y al-Qala'in"
  fr: "La guerre de construction de portes entre Karkh et al-Qala'in"
  ur: "کرخ اور القلعین کے درمیان دروازے کی تعمیر کی جنگ"
  tr: "Karkh ve Qala'in Arasındaki Kapılar Savaşı"
  id: "Perang Gerbang antara Karkh dan Qala'in"
summary:
  ar: "في شعبان سنة إحدى وأربعين وأربعمائة شرع أهل الكرخ في بناء سور على سوق الأنماط من آجرها يحصّنون به الكرخ، فرأى أهل السنة من القلائين ذلك فشرعوا في بناء سور على سوق القلائين وبدأوا بعمل بابه محاذيًا لباب السماكين، وصار البناء ميدان فخر: أعان الأتراك أهل القلائين بأموالهم وبغالهم، وجُرّت سفينة بالآجر قبّاؤها ديباج وعمامتها قصب، وحمل أهل الكرخ آجرهم على رؤوس الرجال في البفدانات وقدامها الطبول والزمور والمخانيث بآلات الحكاية، ورُمي ماء الورد في الأساسات، حتى إن امرأة نزعت جوكانيتها من الديباج فأعطتها للبناء. وفي يوم عيد الفطر ثارت الفتنة بين الفريقين فوقع جرح وقتل، ونقل أهل القلائين آخر سور الأنماط إلى بنائهم وجعلوا بين البابين سقفًا ودكاكين وحصرًا وقناديل وعملوا منه مسجدًا سمّي الباب المسعود {cite:muntazam-ibn-al-jawzi j.8 p.483-484}."
  en: "In Sha'ban 441 the people of Karkh began a wall over the Anmat market with a gate facing Sammakin; the Sunnis of Qala'in answered with a rival wall and gate of their own — and the building turned into a civic spectacle: Turks funded the Qala'in side with money and mules, a barge of bricks came with a brocade canopy, Karkh carried bricks on men's heads preceded by drums and mimes, rosewater was sprinkled into the foundations, and a woman stripped off her brocade jukaniyya and gave it to the building. On 'Id al-Fitr the feud broke into wounds and killings, the Sunnis raised a roofed market and a mosque between the two gates called Bab al-Mas'ud {cite:muntazam-ibn-al-jawzi j.8 p.483-484}."
  es: "En Sha'ban 441, la gente de Karkh comenzó a construir una muralla sobre el mercado de Anmat con una puerta que daba a Sammakin; los sunitas de Qala'in respondieron con una muralla y una puerta rivales, y la construcción se convirtió en un espectáculo cívico: los turcos financiaron al bando de Qala'in con dinero y mulas, llegó una barcaza de ladrillos con un dosel de brocado, los hombres de Karkh transportaron ladrillos sobre sus cabezas precedidos por tambores y mimos, se roció agua de rosas en los cimientos, y una mujer se despojó de su jukaniyya de brocado y la donó a la construcción. En Eid al-Fitr, la disputa estalló en heridas y asesinatos, los sunitas levantaron un mercado techado y una mezquita entre las dos puertas llamada Bab al-Mas'ud {cite:muntazam-ibn-al-jawzi j.8 p.483-484}."
  fr: "En Sha'ban 441, les habitants de Karkh entreprirent la construction d'un mur autour du marché d'Anmat, avec une porte face à Sammakin. Les sunnites de Qala'in ripostèrent en érigeant eux aussi un mur et une porte, et le chantier devint un véritable spectacle civique: les Turcs financèrent le camp de Qala'in en argent et en mules, une barge de briques arriva sous un dais de brocart, les habitants de Karkh transportèrent des briques sur la tête d'hommes précédés de tambours et de mimes, de l'eau de rose fut répandue dans les fondations, et une femme ôta sa robe de brocart (jukaniyya) pour l'offrir à l'édifice. Le jour de l'Aïd el-Fitr, la querelle dégénéra en affrontements et en morts. Les sunnites construisirent un marché couvert et une mosquée entre les deux portes, appelée Bab al-Mas'ud (cit.: Muntazam ibn al-Jawzi, vol. 8, p. 483-484)."
  ur: "شعبان 441 میں کرخ کے لوگوں نے انمت بازار کے اوپر ایک دیوار بنانا شروع کی جس کا دروازہ سماکین کی طرف تھا۔ قلاعین کے سنیوں نے جواب دیا کہ دیوار اور گیٹ اپنے ہی مدمقابل ہیں - اور عمارت ایک شہری تماشا میں بدل گئی: ترکوں نے قلعہ کی طرف رقم اور خچروں سے مالی امداد کی، اینٹوں کا ایک بجرا بروکیڈ سائبان کے ساتھ آیا، کارخ نے مردوں کے سروں پر اینٹیں اٹھائیں جس سے پہلے ڈرم اور مائمز تھے، اس پر گلاب چھڑکایا گیا اور عورت کو گلے میں ڈالا گیا۔ بروکیڈ جوکانیہ اور عمارت کو دے دیا۔ عید الفطر پر جھگڑا زخموں اور ہلاکتوں میں بدل گیا، سنیوں نے ایک چھت والا بازار اور دو دروازوں کے درمیان ایک مسجد بنائی جسے باب المسعود کہا جاتا ہے"
  tr: "Hicri 441 yılının Şaban ayında, Kerk halkı Kerk'i güçlendirmek için pazar yerinin etrafına tuğlalarla bir duvar örmeye başladı. Kalayin'in Sünni halkı bunu görünce Kalayin pazarının etrafına bir duvar örmeye ve balıkçıların kapısının yanına bir kapı yapmaya başladı. İnşaat bir gurur alanı haline geldi: Türkler Kalayin halkına para ve katırlarıyla yardım etti, ipekten bir başlık ve kamıştan bir sarık takmış bir gemi tuğlalarla çekildi ve Kerk halkı tuğlaları tarlalarda erkeklerin başlarında taşıdı, önlerinde davullar, borazanlar ve hikaye anlatıcı aletlerle donanmış kadınsı erkekler vardı ve temellere gül suyu atıldı, hatta bir kadın ipekten elbisesini çıkarıp inşaatçıya verdi. Ramazan Bayramı günü iki grup arasında kavga çıktı, yaralanmalar ve ölümler oldu. Kalâin halkı, El-Anmat surunun son parçasını kendi binalarına taşıdı ve iki kapı arasına bir çatı, dükkanlar, hasırlar ve lambalar yaparak, buradan El-Bab El-Mes'ud adında bir cami inşa ettiler. {cite:muntazam-ibn-al-jawzi j.8 p.483-484}"
  id: "Pada bulan Sya'ban tahun 441 Hijriah, penduduk Karkh mulai membangun tembok di pasar tradisional dengan batu bata untuk memperkuat Karkh. Penduduk Sunni Qala'in melihat ini dan mulai membangun tembok di pasar Qala'in dan mulai membuat gerbangnya yang berdekatan dengan gerbang pedagang ikan. Pembangunan itu menjadi kebanggaan: orang Turki membantu penduduk Qala'in dengan uang dan keledai mereka, dan sebuah kapal berisi batu bata ditarik dengan tudung brokat dan sorban alang-alang, dan penduduk Karkh membawa batu bata di atas kepala orang-orang di ladang, dan di depan mereka ada genderang, terompet, dan laki-laki yang berperilaku feminin dengan alat musik bercerita, dan air mawar dilemparkan ke pondasi, sedemikian banyaknya sehingga seorang wanita melepas jubah brokatnya dan memberikannya kepada pembangun. Pada hari Idul Fitri, perselisihan pecah antara kedua kelompok, mengakibatkan luka-luka dan kematian. Penduduk Qala’in memindahkan bagian terakhir dari tembok Al-Anmat ke bangunan mereka dan membuat atap, toko, tikar, dan lampu di antara kedua gerbang, dan membangun sebuah masjid darinya yang disebut Al-Bab Al-Mas’ud {cite:muntazam-ibn-al-jawzi j.8 p.483-484}."
