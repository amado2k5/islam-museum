id: event/uthman-ibn-hunayf-survey
class: event
kind: other
label: { ar: "مسح عثمان بن حنيف السواد", en: "Uthman ibn Hunayf's Survey of the Sawad", es: "Estudio de Uthman ibn Hunayf sobre el Sawad", fr: "Le relevé du Sawad par Uthman ibn Hunayf", ur: "عثمان بن حنیف کا سواد کا سروے", tr: "Osman ibn Hanif karanlığı sildi.", id: "Uthman bin Hanif menghapus kegelapan" }
summary:
  ar: "عند البلاذري: بعث عمر بن الخطاب عثمان بن حنيف الأنصاري يمسح السواد فوجده ستة وثلاثين ألف ألف جريب فوضع على كل جريب درهماً وقفيزاً وكان ذلك القفيز كالمكوك لهم يدعى الشابرقان وقال يحيى بن آدم هو المختوم الحجاجي. وعن قتادة عن أبي مجلز أن عمر بعث عمار بن ياسر على صلاة أهل الكوفة وجيوشهم وعبد الله بن مسعود على قضائهم وبيت مالهم وعثمان بن حنيف على مساحة الأرض وفرض لهم كل يوم شاة بينهم شطرها وسواقطها لعمار والشطر الآخر بين هذين فمسح عثمان الأرض فجعل على جريب النخل عشرة دراهم وعلى جريب الكرم عشرة دراهم وعلى جريب القصب ستة دراهم وعلى جريب البر أربعة دراهم وعلى الشعير درهمين وكتب بذلك إلى عمر فأجازه. وعن الأعمش عن إبراهيم عن عمرو بن ميمون بعث عمر حذيفة بن اليمان على ما وراء دجلة وبعث عثمان بن حنيف على ما دون دجلة فوضعا على كل جريب قفيزاً ودرهماً. وعن محمد بن عبد الله الثقفي كتب المغيرة بن شعبة وهو على السواد أن قبلنا أصنافاً من الغلة لها مزيد على الحنطة والشعير فذكر الماش والكروم والرطبة والسماسم فوضع عليها ثمانية ثمانية وألغى النخل. وعن العيزار بن حريث وضع عمر على جريب الحنطة درهمين وجريبين وعلى جريب الشعير درهماً وجريباً وعلى جريب الكرم عشرة دراهم وعلى جريب الرطبة عشرة دراهم وعلى جريب القطن خمسة دراهم وعلى النخلة من الفارسي درهماً وعلى الدقلتين درهماً. وعن الشعبي بعث عمر عثمان بن حنيف فوضع على أهل السواد لجريب الرطبة خمسة دراهم ولجريب الكرم عشرة دراهم ولم يجمل على ما عمل تحته شيئاً."
  en: "In al-Baladhuri: Umar sent Uthman ibn Hunayf al-Ansari to survey the Sawad — he found it thirty-six million jarib and set on each a dirham and a qafiz, that qafiz being like their makuuk called al-Shaburqan — Yahya ibn Adam saying it was the sealed Hajjaji measure. Via Qatada from Abi Mujlaz: Umar appointed Ammar ibn Yasir over the Kufans' prayer and armies, Abdallah ibn Mas'ud over their judiciary and treasury, and Uthman ibn Hunayf over the land-survey, allotting them a sheep daily — half with its offal for Ammar, the other half between the two; Uthman surveyed and set ten dirhams on a palm jarib, ten on a vine jarib, six on cane, four on wheat, two on barley, and wrote it to Umar who ratified it. Via al-A'mash from Ibrahim from Amr ibn Maymun: Umar sent Hudhayfa ibn al-Yaman over what was beyond the Tigris and Uthman ibn Hunayf over what was this side — both setting a qafiz and a dirham per jarib. Via Muhammad ibn Abdallah al-Thaqafi: al-Mughira ibn Shu'ba wrote while over the Sawad 'we have crop kinds exceeding wheat and barley' — naming mash, vines, ratba and sesame — so eight each was set and palms waived. Via al-Ayzar ibn Hurayth: Umar set two dirhams and two jaribs on a wheat jarib, a dirham and a jarib on barley, ten on vine, ten on ratba, five on cotton, a dirham on each Farsi palm and on the two daqal grades. Via al-Sha'bi: Uthman ibn Hunayf set five dirhams for a ratba jarib and ten for vine, without bundling what grew beneath."
  es: "En al-Baladhuri: Umar envió a Uthman ibn Hunayf al-Ansari a inspeccionar el Sawad; lo encontró treinta y seis millones de jarib y puso en cada uno un dirham y un qafiz, siendo ese qafiz como su makuuk llamado al-Shaburqan; Yahya ibn Adam dijo que era la medida sellada de Hajjaji. A través de Qatada de Abi Mujlaz: Umar nombró a Ammar ibn Yasir sobre la oración y los ejércitos de los Kufanos, a Abdallah ibn Mas'ud sobre su poder judicial y tesorería, y a Uthman ibn Hunayf sobre la inspección de tierras, asignándoles una oveja diariamente: la mitad con sus vísceras para Ammar, la otra mitad entre los dos; Uthman inspeccionó y puso diez dirhams en un jarib de palma, diez en un jarib de vid, seis en caña, cuatro en trigo, dos en cebada, y se lo escribió a Umar, quien lo ratificó. A través de al-A'mash de Ibrahim de Amr ibn Maymun: Umar envió a Hudhayfa ibn al-Yaman sobre lo que estaba más allá del Tigris y a Uthman ibn Hunayf sobre lo que estaba de este lado, ambos fijando un qafiz y un dirham por jarib. A través de Muhammad ibn Abdallah al-Thaqafi: al-Mughira ibn Shu'ba escribió mientras estaba sobre el Sawad 'tenemos tipos de cultivos que exceden el trigo y la cebada', nombrando mash, vides, ratba y sésamo, por lo que se fijaron ocho de cada uno y se hicieron ademanes de palmas. A través de al-Ayzar ibn Hurayth: Umar fijó dos dirhams y dos jaribs en un jarib de trigo, un dirham y un jarib en cebada, diez en vid, diez en ratba, cinco en algodón, un dirham en cada palma Farsi y en los dos grados daqal. Según al-Sha'bi: Uthman ibn Hunayf fijó cinco dirhams por un ratba jarib y diez por la vid, sin incluir lo que crecía debajo."
  fr: "D'après al-Baladhuri: Umar envoya Uthman ibn Hunayf al-Ansari arpenter le Sawad. Ce dernier estima sa superficie à trente-six millions de jaribs et fixa à chacun un dirham et un qafiz, ce qafiz étant similaire à leur makuuk appelé al-Shaburqan. Yahya ibn Adam affirma qu'il s'agissait de la mesure scellée du Hajjaji. Selon Qatada, rapporté par Abi Mujlaz: Umar nomma Ammar ibn Yasir responsable de la prière et des armées des Koufans, Abdallah ibn Mas'ud responsable de leur système judiciaire et de leur trésor, et Uthman ibn Hunayf responsable de l'arpentage des terres. Il leur attribuait un mouton par jour: la moitié, avec ses abats, pour Ammar, l'autre moitié partagée entre les deux. Uthman effectua un arpentage et fixa dix dirhams à chaque jarib de palmier, dix à chaque jarib de vigne, six à chaque jarib de canne, quatre à chaque jarib de blé et deux à chaque jarib d'orge. Il en fit rapport à Umar, qui l'approuva. D'après al-A'mash, rapporté par Ibrahim d'après Amr ibn Maymun: Umar envoya Hudhayfa ibn al-Yaman au-delà du Tigre et Uthman ibn Hunayf sur la rive opposée, chacun fixant un qafiz et un dirham par jarib. D'après Muhammad ibn Abdallah al-Thaqafi: al-Mughira ibn Shu'ba écrivit, alors qu'il traversait le Sawad: « Nous avons des cultures plus abondantes que le blé et l'orge », citant le mash, la vigne, le ratba et le sésame; huit dirhams furent donc fixés pour chaque, et les palmiers furent exemptés. D'après al-Ayzar ibn Hurayth: Umar fixa deux dirhams et deux jaribs pour un jarib de blé, un dirham et un jarib pour l'orge, dix pour la vigne, dix pour le ratba, cinq pour le coton, un dirham pour chaque palmier persan et pour les deux catégories de daqal. D'après al-Sha'bi: Uthman ibn Hunayf a fixé cinq dirhams pour un ratba jarib et dix pour la vigne, sans empaqueter ce qui poussait en dessous."
  ur: "البلادوری میں ہے: عمر نے عثمان بن حنیف الانصاری کو سواد کا جائزہ لینے کے لیے بھیجا - اس نے اسے چھتیس ملین جریب پایا اور ہر ایک پر ایک درہم اور ایک قذف مقرر کیا، یہ قذف ان کے مکوق کی طرح ہے جسے الشبرقان کہتے ہیں - یحییٰ بن آدم کہتے ہیں کہ یہ حجاج کی مہر ہے۔ ابی مجلّز سے قتادہ کے ذریعے: عمر نے عمار بن یاسر کو کوفوں کی نماز اور لشکر پر، عبداللہ ابن مسعود کو ان کے عدلیہ اور خزانے پر اور عثمان بن حنیف کو زمینی سروے پر مقرر کیا، انہیں روزانہ ایک بکری مختص کی جاتی تھی، جس کا نصف عمار کے درمیان ہوتا تھا، نصف دوسرے کے درمیان۔ عثمان نے جائزہ لیا اور کھجور پر دس درہم، انگور کی بیل پر دس، گنے پر چھ، گیہوں پر چار، جو پر دو، اور عمر کو لکھا جس نے اس کی توثیق کی۔ عمرو بن میمون سے ابراہیم سے العمش کے ذریعے: عمر نے حذیفہ بن یمان کو اس طرف بھیجا جو دجلہ سے آگے تھا اور عثمان بن حنیف کو اس طرف بھیجا - دونوں نے قذف اور ایک درہم فی جریب مقرر کیا۔ محمد بن عبداللہ الثقفی کے ذریعے: المغیرہ بن شعبہ نے سواد کے دوران لکھا کہ 'ہمارے پاس گندم اور جو سے زیادہ فصل کی قسمیں ہیں' - ماش، انگور، رتبہ اور تل کے نام - لہذا آٹھ مقرر کیے گئے اور کھجوریں معاف کر دی گئیں۔ عزر بن ہریث کے ذریعے: عمر نے گیہوں پر دو درہم اور دو جریب، جو پر ایک درہم اور ایک جریب، بیل پر دس، رتبہ پر دس، کپاس پر پانچ، ہر فارسی کھجور پر ایک درہم اور دو دقال درجے مقرر کئے۔ بذریعہ الشعبی: عثمان بن حنیف نے رتبہ جریب کے لیے پانچ درہم اور بیل کے لیے دس درہم مقرر کیے، اس کے نیچے جو کچھ اُگتا ہے اس کو باندھے بغیر۔"
  tr: "El-Baladhuri'ye göre: Ömer ibn el-Hattab, Osman ibn Huneyf el-Ensari'yi Sawad'ı (Irak'ın verimli topraklarını) ölçmek için gönderdi ve o da bu toprakların otuz altı milyon jarib (bir toprak ölçü birimi) olduğunu tespit etti. Her jarib için bir dirhem ve bir kafız (başka bir toprak ölçü birimi) belirledi. Bu kafız, onlar için bir mekik gibiydi ve şabarqan olarak adlandırılıyordu. Yahya ibn Adam bunun mühürlü Haccac olduğunu söyledi. Katade'nin, Ebu Majlaz'ın rivayetine göre, Ömer, Ammar ibn Yasir'i Kufa halkının ve ordularının namazlarını kıldırması, Abdullah ibn Mesud'u yargı ve hazinelerini denetlemesi ve Osman ibn Huneyf'i de toprakları ölçmesi için görevlendirdi. Her gün bir koyun almaları gerektiğini, bunun yarısının (yenmemiş kısımları da dahil) Ammar'a, diğer yarısının ise iki adam arasında paylaştırılmasını şart koştu. Osman, araziyi inceledi ve hurma ağaçları için jarib başına on dirhem, bağlar için jarib başına on dirhem, kamış için jarib başına altı dirhem, buğday için jarib başına dört dirhem ve arpa için jarib başına iki dirhem vergi belirledi. Bunu Ömer'e yazdı ve Ömer de onayladı. İbrahim'in rivayetine göre, Amr ibn Maymun'un rivayetine göre Ömer, Hudeyfe ibn el-Yaman'ı Dicle Nehri'nin ötesindeki topraklara ve Osman ibn Huneyf'i Dicle'nin altındaki topraklara gönderdi. Her jarib için bir kafız ve bir dirhem vergi koydular. Muhammed ibn Abdullah el-Saqafi'nin rivayetine göre, Irak'ın verimli topraklarından sorumlu olan el-Muğire ibn Şube, buğday ve arpadan daha yüksek vergiye tabi çeşitli ürünlerimiz olduğunu yazdı. O, maş fasulyesi, üzüm, hurma ve susamdan bahsetmiş ve her birine sekiz dirhem vergi koymuş, hurma ağaçlarını ise muaf tutmuştur. El-Ayzar ibn Hurayth'ın rivayetine göre, Ömer bir jarib buğdaya iki dirhem, bir jarib arpaya bir dirhem, bir jarib üzüme on dirhem, bir jarib hurmaya on dirhem, bir jarib pamuğa beş dirhem, Fars kökenli bir hurmaya bir dirhem ve iki hurmaya bir dirhem vergi koymuştur. El-Şabi'nin rivayetine göre, Ömer, Osman ibn Huneyf'i göndermiş ve o da Sawad halkı için bir jarib hurmaya beş dirhem ve bir jarib üzüme on dirhem vergi koymuş, kendi yönetimi altındaki ürünlere ise ek bir vergi koymamıştır."
  id: "Menurut al-Baladhuri: Umar ibn al-Khattab mengutus Uthman ibn Hunayf al-Ansari untuk mensurvei Sawad (tanah subur Irak), dan ia mendapati luasnya tiga puluh enam juta jarib (satuan ukuran tanah). Ia mengenakan satu dirham dan satu qafiz (satuan ukuran tanah lainnya) untuk setiap jarib. Qafiz ini seperti alat tenun bagi mereka, yang disebut shabarqan. Yahya ibn Adam mengatakan itu adalah Hajjaj yang disegel. Dari Qatada, dari Abu Majlaz, bahwa Umar mengutus Ammar ibn Yasir untuk memimpin salat penduduk Kufa dan pasukan mereka, Abdullah ibn Masoud untuk mengawasi peradilan dan perbendaharaan mereka, dan Uthman ibn Hunayf untuk mensurvei tanah. Ia menetapkan bahwa setiap hari mereka harus menerima seekor domba, setengahnya, termasuk bagian yang tidak dimakan, akan diberikan kepada Ammar, dan setengahnya lagi akan dibagi antara kedua orang tersebut. Utsman mensurvei tanah dan menetapkan pajak sebesar sepuluh dirham per jarib kurma, sepuluh dirham per jarib kebun anggur, enam dirham per jarib alang-alang, empat dirham per jarib gandum, dan dua dirham per jarib jelai. Dia menuliskan hal ini kepada Umar, yang menyetujuinya. Berdasarkan riwayat al-A'mash, riwayat Ibrahim, riwayat Amr ibn Maymun, bahwa Umar mengutus Hudhayfa ibn al-Yaman ke tanah di seberang Sungai Tigris dan Utsman ibn Hunayf ke tanah di bawah Sungai Tigris. Mereka mengenakan pajak sebesar qafiz dan satu dirham untuk setiap jarib. Berdasarkan riwayat Muhammad ibn Abdullah al-Thaqafi, al-Mughirah ibn Shu’bah, yang bertanggung jawab atas Sawad (tanah subur Irak), menulis bahwa kita memiliki berbagai jenis tanaman yang dikenakan pajak lebih tinggi daripada gandum dan jelai. Ia menyebutkan kacang hijau, anggur, kurma, dan wijen, dan mengenakan pajak delapan dirham untuk masing-masingnya, sementara pohon kurma dikecualikan. Atas otoritas al-‘Aizar ibn Hurayth, ‘Umar mengenakan pajak dua dirham untuk satu jarib gandum, satu dirham untuk satu jarib jelai, sepuluh dirham untuk satu jarib anggur, sepuluh dirham untuk satu jarib kurma, lima dirham untuk satu jarib kapas, satu dirham untuk satu pohon kurma asal Persia, dan satu dirham untuk dua buah kurma. Atas otoritas al-Sha‘bi, ‘Umar mengutus ‘Uthman ibn Hunayf, yang mengenakan pajak lima dirham untuk satu jarib kurma dan sepuluh dirham untuk satu jarib anggur bagi penduduk Sawad, dan ia tidak mengenakan pajak tambahan apa pun atas apa yang ditanam di bawah wewenangnya."
