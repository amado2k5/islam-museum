id: event/nuwayri-flogged-710
class: event
kind: other
label:
  ar: "ابن عبادة يضرب النويري بالمقارع ويصادره، نحو ٧١٠هـ/١٣١٠م"
  en: "Ibn Abbada has al-Nuwayri flogged and confiscates his property, c. 710/1310"
  ur: "ابن عبادہ نے نويری کو مقارع سے مارا اور مال ضبط کیا، تقریباً 710ھ/1310ء"
summary:
  ar: "كان ابن عبادة وكيل الخاص قد استناب النويري في المدرسة الناصرية والمنصورية وغيرهما فصار يدخل على السلطان ويطالعه بالأمور، فأغِر بذلك وبسط القول في ابن عبادة، فلم يمنع السلطان منه وقيعته في ابن عبادة وسلّمه إليه ومكّنه منه، فضربه بالمقارع ضرباً مبرحاً وصادره، ولم يشكر النويريَ أحدٌ على ما كان منه؛ وبعدها بقليل أُبعد إلى الشام ولا يلمح إلى هذه النكبة في كتابه إلا أنه يذكر نقله إلى طرابلس {cite:suluk-maqrizi p. 91} {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}."
  en: "Ibn Abbada, the sultan's wakil al-khass, had made al-Nuwayri his deputy at the Nasiriyya, the Mansuriyya and elsewhere, so that he entered upon the sultan and read affairs with him; puffed up by this he spoke loosely of Ibn Abbada, and the sultan did not restrain his denunciation but handed him over to Ibn Abbada and empowered him, who flogged him severely and confiscated his property — and nobody thanked al-Nuwayri for what he had done. Soon after he was sent away to Syria; he does not even hint at this misfortune in his work and mentions only his transfer to Tripoli {cite:suluk-maqrizi p. 91} {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}."
  ur: "سلطان کے وکیل خاص ابن عبادہ نے نويری کو ناصریہ، منصوریہ اور دیگر اداروں میں اپنا نائب بنایا تھا، جس سے وہ سلطان کے حضور حاضر ہو کر امور بیان کرنے لگے؛ اس پر مغرور ہو کر انہوں نے ابن عبادہ کے بارے میں کھل کر بات کی، سلطان نے ان کی وقیعت نہ روکی اور انھیں ابن عبادہ کے حوالے کر دیا، جس نے انھیں بری طرح مقارع سے مارا اور مال ضبط کیا — اور نويری کے اس کردار پر کسی نے ان کا شکریہ نہ ادا کیا۔ کچھ ہی بعد وہ شام روانہ کیے گئے؛ اپنی کتاب میں وہ اس نکبت کی طرف اشارہ بھی نہیں کرتے، صرف طرابلس منتقلی کا ذکر ہے {cite:suluk-maqrizi p. 91} {cite:encyclopaedia-of-islam-2 vol. 8 p. 158}۔"
