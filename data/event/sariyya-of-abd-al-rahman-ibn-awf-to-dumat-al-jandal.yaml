id: event/sariyya-of-abd-al-rahman-ibn-awf-to-dumat-al-jandal
class: event
kind: raid
label: { ar: "سرية عبد الرحمن بن عوف إلى دومة الجندل", en: "Abd al-Rahman ibn Awf's detachment to Dumat al-Jandal" }
summary:
  ar: "يرويها ابن إسحاق عن عطاء بن أبي رباح عن رجل سأل عبد الله بن عمر عن إرسال العمامة: كان ابن عمر عاشر عشرة في المسجد مع النبي، فسأل فتى من الأنصار: أي المؤمنين أفضل وأكيس؟ ثم خطب النبي المهاجرين بالخصال الخمس، ثم أمر عبد الرحمن بن عوف أن يتجهز لسرية، فعمّمه بيده بعمامة كرابيس سوداء وأرسل من خلفه أربع أصابع، ودفع إليه اللواء وعهد إليه: اغزوا في سبيل الله، لا تغلوا ولا تغدروا ولا تمثلوا ولا تقتلوا وليداً؛ قال ابن هشام: فخرج إلى دومة الجندل."
  en: "Ibn Ishaq tells it from Ata' ibn Abi Rabah, from a man who asked Abdullah ibn Umar about letting the turban's end hang behind: Ibn Umar was one of ten Companions sitting with the Prophet in his mosque when a young Ansari asked which believers were best and wisest; the Prophet then addressed the Muhajirun with the five afflictions, then ordered Abd al-Rahman ibn Awf to prepare for a detachment, wound a black cotton turban on him with his own hands leaving four fingers hanging behind, handed him the banner and charged him: fight in God's way, do not steal from the spoils, do not break faith, do not mutilate, do not kill a child. Ibn Hisham adds: he set out for Dumat al-Jandal."
