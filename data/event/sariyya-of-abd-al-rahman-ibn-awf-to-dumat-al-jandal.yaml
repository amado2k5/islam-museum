id: event/sariyya-of-abd-al-rahman-ibn-awf-to-dumat-al-jandal
class: event
kind: raid
label: { ar: "سرية عبد الرحمن بن عوف إلى دومة الجندل", en: "Abd al-Rahman ibn Awf's detachment to Dumat al-Jandal", es: "El destacamento de Abd al-Rahman ibn Awf en Dumat al-Jandal", fr: "Détachement d'Abd al-Rahman ibn Awf à Dumat al-Jandal", ur: "عبدالرحمٰن بن عوف کی دمت الجندل سے لاتعلقی", tr: "Abd al-Rahman ibn Avf'ın Dumat al-Jandal'a seferi", id: "Ekspedisi Abd al-Rahman ibn Awf ke Dumat al-Jandal" }
summary:
  ar: "يرويها ابن إسحاق عن عطاء بن أبي رباح عن رجل سأل عبد الله بن عمر عن إرسال العمامة: كان ابن عمر عاشر عشرة في المسجد مع النبي، فسأل فتى من الأنصار: أي المؤمنين أفضل وأكيس؟ ثم خطب النبي المهاجرين بالخصال الخمس، ثم أمر عبد الرحمن بن عوف أن يتجهز لسرية، فعمّمه بيده بعمامة كرابيس سوداء وأرسل من خلفه أربع أصابع، ودفع إليه اللواء وعهد إليه: اغزوا في سبيل الله، لا تغلوا ولا تغدروا ولا تمثلوا ولا تقتلوا وليداً؛ قال ابن هشام: فخرج إلى دومة الجندل."
  en: "Ibn Ishaq tells it from Ata' ibn Abi Rabah, from a man who asked Abdullah ibn Umar about letting the turban's end hang behind: Ibn Umar was one of ten Companions sitting with the Prophet in his mosque when a young Ansari asked which believers were best and wisest; the Prophet then addressed the Muhajirun with the five afflictions, then ordered Abd al-Rahman ibn Awf to prepare for a detachment, wound a black cotton turban on him with his own hands leaving four fingers hanging behind, handed him the banner and charged him: fight in God's way, do not steal from the spoils, do not break faith, do not mutilate, do not kill a child. Ibn Hisham adds: he set out for Dumat al-Jandal."
  es: "Ibn Ishaq lo cuenta de Ata' ibn Abi Rabah, de un hombre que preguntó a Abdullah ibn Umar sobre dejar que el extremo del turbante colgara por detrás: Ibn Umar era uno de los diez Compañeros sentados con el Profeta en su mezquita cuando un joven Ansari preguntó qué creyentes eran los mejores y más sabios; el Profeta entonces se dirigió a los Muhajirun con las cinco aflicciones, luego ordenó a Abd al-Rahman ibn Awf que se preparara para un destacamento, le enrolló un turbante de algodón negro con sus propias manos dejando cuatro dedos colgando por detrás, le entregó el estandarte y le ordenó: lucha en el camino de Dios, no robes el botín, no traiciones la fe, no mutiles, no mates a un niño. Ibn Hisham añade: partió hacia Dumat al-Jandal."
  fr: "Ibn Ishaq rapporte ce récit d'après Ata' ibn Abi Rabah, qui tenait d'un homme ayant interrogé Abdullah ibn Umar sur la coutume de laisser pendre le pan du turban: Ibn Umar était l'un des dix Compagnons assis avec le Prophète dans sa mosquée lorsqu'un jeune Ansari demanda quels étaient les croyants les plus sages et les plus vertueux. Le Prophète s'adressa alors aux Muhajirun en évoquant les cinq épreuves, puis ordonna à Abd al-Rahman ibn Awf de préparer un détachement. Il lui enroula de ses propres mains un turban de coton noir autour de la tête, laissant dépasser quatre doigts, lui remit l'étendard et lui donna ces instructions: « Combats pour la cause de Dieu, ne vole pas le butin, ne trahis pas ta foi, ne mutile pas, ne tue pas d'enfant. » Ibn Hisham ajoute: « Il partit ensuite pour Dumat al-Jandal. »"
  ur: "ابن اسحاق اسے عطاء بن ابی رباح سے روایت کرتے ہیں، ایک شخص سے جس نے عبداللہ بن عمر سے پگڑی کے سرے کو پیچھے لٹکانے کے بارے میں پوچھا: ابن عمر ان دس صحابہ میں سے ایک تھے جو رسول اللہ کے ساتھ ان کی مسجد میں بیٹھے ہوئے تھے جب ایک نوجوان انصاری نے پوچھا کہ کون سا مومن بہترین اور عقلمند ہے؟ اس کے بعد نبی نے مہاجرین کو پانچ مصائب کے ساتھ مخاطب کیا، پھر عبدالرحمٰن بن عوف کو لشکر کشی کے لیے تیار ہونے کا حکم دیا، اپنے ہاتھوں سے سیاہ روئی کی پگڑی پر چار انگلیاں چھوڑ کر زخمی کیا، جھنڈا ان کے حوالے کیا اور حکم دیا: خدا کی راہ میں جنگ کرو، مال غنیمت میں چوری نہ کرو، ایمان کو مت توڑو، بچے کو قتل نہ کرو۔ ابن ہشام کہتے ہیں: وہ دمت الجندل کی طرف روانہ ہوا۔"
  tr: "İbn İshak, Ata' ibn Abi Rabah'tan, o da Abdullah ibn Ömer'e sarığı aşağıya sarkıtmak hakkında soru soran bir adamdan rivayet etti: İbn Ömer, Peygamber ile birlikte mescitte on kişiden onuncusuydu. Ensar'dan bir gence sordu: \"Müminlerin en iyisi ve en bilgesi kimdir?\" Bunun üzerine Peygamber, Muhacirlere beş niteliği anlattı, sonra Abdurrahman ibn Avf'a bir baskın için hazırlanmasını emretti. O da kendi eliyle başına siyah, kaba bir sarık taktı ve dört parmağını arkasına sarkıttı. Peygamber ona sancağı verdi ve ona şöyle buyurdu: \"Allah yolunda çık, aşırıya kaçma, ihanet etme, sakat bırakma ve çocuk öldürme.\" İbn Hişam dedi ki: \"Böylece Dumat el-Cendal'e çıktı.\""
  id: "Ibn Ishaq meriwayatkannya dari Ata’ ibn Abi Rabah dari seorang pria yang bertanya kepada Abdullah ibn Umar tentang membiarkan sorban menjuntai: Ibn Umar adalah orang kesepuluh dari sepuluh orang di masjid bersama Nabi, lalu dia bertanya kepada seorang pemuda dari kaum Ansar: Siapakah di antara orang-orang beriman yang terbaik dan paling bijaksana? Kemudian Nabi berpidato kepada kaum Muhajirin tentang lima sifat baik, lalu beliau memerintahkan Abd al-Rahman ibn Awf untuk bersiap melakukan penyerangan, lalu dia mengenakan sorban hitam kasar di kepalanya dengan tangannya sendiri dan membiarkan empat jarinya menjuntai di belakangnya, dan beliau memberinya panji dan berpesan kepadanya: Keluarlah di jalan Allah, jangan berlebihan, jangan berkhianat, jangan memutilasi, dan jangan membunuh anak kecil; Ibn Hisham berkata: Maka dia pergi ke Dumat al-Jandal."
