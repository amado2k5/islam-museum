id: event/battle-of-afara-285
class: event
kind: other
label:
  ar: معركة عفارة بين عسكر عبد الله بن الحسين وأبي الدغيش الشهابي كما يرويها محمد بن عبيد الله، ربيع الآخر 285هـ
  en: The battle of Afara between Abdullah ibn al-Husayn's force and Abu al-Dughaysh al-Shihabi, as Muhammad ibn Ubaydallah tells it, Rabi' II 285 AH
  ur: 'عفارہ کی لڑائی: عبد اللہ بن الحسین کا لشکر اور ابو الدغیش شہابی، جیسے محمد بن عبید اللہ بیان کرتے ہیں، ربیع الآخر 285ھ'
  fr: "La bataille d'Afara entre la troupe d'Abdullah ibn al-Husayn et Abu al-Dughaysh al-Shihabi, selon le récit de Muhammad ibn Ubaydallah, Rabi' II 285 H"
  es: "La batalla de Afara entre las fuerzas de Abdullah ibn al-Husayn y Abu al-Dughaysh al-Shihabi, como la cuenta Muhammad ibn Ubaydallah, Rabi' II 285 AH"
  tr: "Muhammed bin Ubeydullah'ın rivayetine göre, Abdullah bin Hüseyin'in ordusu ile Ebu el-Dağiş el-Şahabi'nin ordusu arasında Afara Muharebesi, Rabi' el-Sani, Hicri 285."
  id: "Perang Afara antara pasukan Abdullah bin Al-Hussein dan Abu Al-Daghish Al-Shahabi, sebagaimana diriwayatkan oleh Muhammad bin Ubaid Allah, Rabi’ Al-Thani 285 H."
summary:
  ar: يروي محمد بن عبيد الله أنه سار يوم الثلاثاء لسبع باقية من ربيع الآخر من طريق ثانية إلى عفارة، فخرج عليه كمين لأبي الدغيش وهو في أهل وسحة، فانهزم أصحابه وثبت في عشرين راجلاً ثم في أحد عشر رجلاً أمام مئتين، وعُقر فرسه، وقاتل راجلاً وقتل منهم رجل، وفي الأثناء هزم عبد الله بن الحسين أبا الدغيش، ثم رأى الناس النار في عفارة فانقلب مقاتلوهم منهزمين.
  en: Muhammad ibn Ubaydallah tells that on Tuesday with seven days left of Rabi' II he went by another road to Afara; an ambush of Abu al-Dughaysh came out on him with the men of Wasaha, his companions fled, and he stood with twenty on foot and then eleven men against two hundred, his horse was killed and he fought on foot; a man of his killed one of them; meanwhile Abdullah ibn al-Husayn defeated Abu al-Dughaysh, and when people saw fire at Afara their opponents turned and fled.
  ur: محمد بن عبید اللہ بتاتے ہیں کہ ربیع الآخر کے سات دن باقی رہتے منگل کو وہ دوسرے راستے سے عفارہ کی طرف گئے؛ وسحہ والوں کے ساتھ ان پر ابو الدغیش کا کمین نکلا، ان کے ساتھی بھاگ گئے اور وہ بیس پیادوں اور پھر گیارہ آدمیوں کے ساتھ دو سو کے سامنے ڈٹے رہے، ان کا گھوڑا مارا گیا اور وہ پیدل لڑے؛ ان کے ایک آدمی نے ان میں سے ایک کو مارا؛ اسی دوران عبد اللہ بن الحسین نے ابو الدغیش کو شکست دی اور جب لوگوں نے عفارہ میں آگ دیکھی تو ان کے مخالف بھاگ نکلے۔
  fr: "Muhammad ibn Ubaydallah raconte que le mardi, sept jours avant la fin de Rabi' II, il prit une autre route vers Afara ; une embuscade d'Abu al-Dughaysh surgit sur lui et les hommes de Wasaha, ses compagnons s'enfuirent, et il tint avec vingt fantassins puis onze hommes contre deux cents ; son cheval fut tué et il combattit à pied ; un de ses hommes tua l'un d'eux ; pendant ce temps, Abdullah ibn al-Husayn vainquit Abu al-Dughaysh, et quand les gens virent le feu à Afara, leurs adversaires tournèrent le dos et s'enfuirent."
  es: "Muhammad ibn Ubaydallah cuenta que el martes, a siete días del final de Rabi' II, fue por otro camino a Afara; Abu al-Dughaysh le tendió una emboscada con los hombres de Wasaha, sus compañeros huyeron y él se quedó con veinte hombres a pie y luego once contra doscientos, su caballo fue asesinado y luchó a pie; uno de sus hombres mató a uno de ellos; mientras tanto, Abdullah ibn al-Husayn derrotó a Abu al-Dughaysh, y cuando la gente vio fuego en Afara, sus oponentes se dieron la vuelta y huyeron."
  tr: "Muhammed ibn Ubeyd Allah rivayet eder ki, Rabi'l-Ahir ayının yedi günü kalan Salı günü, Afara'ya ikinci bir yoldan yola çıktı. Wasah halkıyla birlikteyken Ebu el-Dağiş ona pusu kurdu. Arkadaşları yenilgiye uğradı ve o, önce yirmi adamıyla, sonra on bir adamıyla iki yüz kişinin önünde dimdik durdu. Atının bacağı sakatlandı ve yaya olarak savaştı ve içlerinden birini öldürdü. Bu sırada Abdullah ibn el-Hüseyin, Ebu el-Dağiş'i yendi. Sonra halk Afara'da yangını gördü ve savaşçıları yenilgiye uğrayarak geri döndüler."
  id: "Muhammad ibn Ubayd Allah meriwayatkan bahwa pada hari Selasa, tujuh hari sebelum berakhirnya bulan Rabi’ al-Akhir, ia berangkat dari jalur kedua menuju Afara. Abu al-Daghish menyergapnya ketika ia bersama penduduk Wasah. Para pengikutnya dikalahkan, dan ia bertahan dengan dua puluh orang, kemudian dengan sebelas orang, di hadapan dua ratus orang. Kudanya pincang, dan ia bertempur dengan berjalan kaki dan membunuh salah seorang dari mereka. Sementara itu, Abdullah ibn al-Husayn mengalahkan Abu al-Daghish. Kemudian orang-orang melihat kobaran api di Afara, dan para pejuang mereka kembali dengan kekalahan."
