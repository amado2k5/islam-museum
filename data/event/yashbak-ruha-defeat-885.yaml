summary:
  ar: "وفي سنة خمس وثمانين وثمان مئة خرج عسكر من مصر عليهم الدوادار يشبك إلى جهة العراق فالتقوا مع عسكر يعقوب شاه بن حسن بقرب الرها فانكسر المصريون وقتل منهم من قتل وأسر الباقون وأسر الدوادار وضربت عنقه وذلك في النصف الثاني من رمضان، والعجب أن الدوادار هذا كان بينه وبين قاضي الحنفية شمس الدين الأمشاطي وقعة كبيرة وكل منهما يود زوال الآخر فكان قتل الدوادار بشاطئ الفرات وموت الأمشاطي بمصر في يوم واحد {cite:tarikh-khulafa-minhaj-1434 p. 779}."
  en: "In 885 an Egyptian army under the dawadar Yashbak marched toward Iraq, met Uzun Hasan's son Ya'qub Shah's host near al-Ruha and broke — the survivors captured, Yashbak beheaded in late Ramadan. Curiously his great rival at home, the Hanafi chief qadi Shams al-Din al-Amshati, died in Egypt that same day {cite:tarikh-khulafa-minhaj-1434 p. 779}."
