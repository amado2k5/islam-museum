id: event/yashbak-ruha-defeat-885
class: event
kind: battle
label: { ar: "كسر عسكر مصر قرب الرها", en: "The Defeat of the Egyptian Army near al-Ruha", es: "La derrota del ejército egipcio cerca de al-Ruha", fr: "La défaite de l'armée égyptienne près d'al-Ruha", ur: "الروح کے قریب مصری فوج کی شکست", tr: "Mısır ordusu Edessa yakınlarında cepheyi yardı.", id: "Tentara Mesir berhasil menerobos pertahanan di dekat Edessa." }
summary:
  ar: "وفي سنة خمس وثمانين وثمان مئة خرج عسكر من مصر عليهم الدوادار يشبك إلى جهة العراق فالتقوا مع عسكر يعقوب شاه بن حسن بقرب الرها فانكسر المصريون وقتل منهم من قتل وأسر الباقون وأسر الدوادار وضربت عنقه وذلك في النصف الثاني من رمضان، والعجب أن الدوادار هذا كان بينه وبين قاضي الحنفية شمس الدين الأمشاطي وقعة كبيرة وكل منهما يود زوال الآخر فكان قتل الدوادار بشاطئ الفرات وموت الأمشاطي بمصر في يوم واحد {cite:tarikh-khulafa-minhaj-1434 p. 779}."
  en: "In 885 an Egyptian army under the dawadar Yashbak marched toward Iraq, met Uzun Hasan's son Ya'qub Shah's host near al-Ruha and broke — the survivors captured, Yashbak beheaded in late Ramadan. Curiously his great rival at home, the Hanafi chief qadi Shams al-Din al-Amshati, died in Egypt that same day {cite:tarikh-khulafa-minhaj-1434 p. 779}."
  es: "En 885, un ejército egipcio al mando del dawadar Yashbak marchó hacia Irak, se encontró con el ejército de Ya'qub Shah, hijo de Uzun Hasan, cerca de al-Ruha y se desmoronó. Los supervivientes fueron capturados y Yashbak fue decapitado a finales del Ramadán. Curiosamente, su gran rival en Egipto, el cadí hanafí Shams al-Din al-Amshati, murió ese mismo día en Egipto {cite:tarikh-khulafa-minhaj-1434 p. 779}."
  fr: "En 885, une armée égyptienne commandée par le dawadar Yashbak marcha vers l'Irak, rencontra les troupes de Ya'qub Shah, fils d'Uzun Hasan, près d'al-Ruha et se débanda. Les survivants furent capturés et Yashbak décapité à la fin du Ramadan. Curieusement, son grand rival en Égypte, le cadi Shams al-Din al-Amshati, chef hanafite, mourut le même jour en Égypte (voir: Tarikh-Khulafa-Minhaj-1434, p. 779)."
  ur: "885 میں داؤدار یشبک کے ماتحت ایک مصری فوج نے عراق کی طرف پیش قدمی کی، الروحہ کے قریب عزون حسن کے بیٹے یعقوب شاہ کے میزبان سے ملاقات کی اور توڑ دیا - زندہ بچ جانے والوں کو پکڑ لیا گیا، رمضان کے آخر میں یشبک کا سر قلم کر دیا گیا۔ دلچسپ بات یہ ہے کہ گھر میں ان کے بڑے حریف، حنفی سربراہ قاضی شمس الدین الامشاتی، اسی دن مصر میں انتقال کر گئے۔ 779}۔"
  tr: "Hicri 885 yılında, Dawadar Yashbak önderliğindeki Mısır ordusu Irak'a doğru ilerledi. Edessa yakınlarında Yakub Şah ibn Hasan'ın ordusuyla karşılaştılar. Mısırlılar yenildi, bazıları öldürüldü, geri kalanı ise esir alındı. Dawadar esir alındı ve başı kesildi. Bu olay Ramazan ayının ikinci yarısında gerçekleşti. İlginçtir ki, bu Dawadar, Hanefi kadı Şemseddin Amşati ile büyük bir savaşa girmiş ve her ikisi de diğerinin ölümünü dilemişti. Böylece Dawadar Fırat Nehri kıyısında öldürüldü ve Amşati de aynı gün Mısır'da öldü. {cite:tarikh-khulafa-minhaj-1434 s. 779}"
  id: "Pada tahun 885 H, pasukan dari Mesir, dipimpin oleh Dawadar Yashbak, menuju Irak. Mereka bertemu dengan pasukan Yaqub Shah ibn Hasan di dekat Edessa. Pasukan Mesir dikalahkan, beberapa tewas, dan sisanya ditangkap. Dawadar ditangkap dan dipenggal kepalanya. Ini terjadi pada paruh kedua bulan Ramadan. Anehnya, Dawadar ini pernah terlibat pertempuran hebat dengan hakim Hanafi Shams al-Din al-Amshati, dan masing-masing dari mereka menginginkan kematian yang lain. Maka Dawadar terbunuh di tepi Sungai Eufrat dan al-Amshati meninggal di Mesir pada hari yang sama. {cite:tarikh-khulafa-minhaj-1434 p. 779}."
