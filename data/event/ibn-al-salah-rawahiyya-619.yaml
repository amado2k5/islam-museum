id: event/ibn-al-salah-rawahiyya-619
class: event
kind: other
label:
  ar: "تخريب أسوار القدس ينقل ابن الصلاح إلى دمشق: تدريس الرواحية، نحو ٦١٩هـ"
  en: "The demolition of Jerusalem's walls brings Ibn al-Salah to Damascus: the Rawahiyya post, c. 619"
  ur: "قدس کی دیواروں کا مسمار ابن الصلاح کو دمشق لے آیا: رواحیہ کی تدریس، تقریباً 619ھ"
summary:
  ar: "فلما خرّب الملك المعظم أسوار القدس قدِم ابن الصلاح دمشق ووُلي تدريس الرواحية {cite:tarikh-islam-dhahabi p. 186}؛ وكان هدم السور في أول المحرم سنة ست عشرة فخرج الناس هاربين بعضهم إلى دمشق {cite:shadharat-dhahab p. 65-66}، واستقر ابن الصلاح فيها بقية عمره يدرّس بالرواحية ثم بالأشرفية والشامية {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  en: "When al-Malik al-Mu'azzam had Jerusalem's walls demolished, Ibn al-Salah came to Damascus and was given the teaching post of the Rawahiyya {cite:tarikh-islam-dhahabi p. 186}. The demolition began on the first day of Muharram 616; the people fled, some to Damascus {cite:shadharat-dhahab p. 65-66}, and Ibn al-Salah settled there for the rest of his life, teaching at the Rawahiyya, then the Ashrafiyya and the Shamiyya {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  ur: "جب ملک المعظم نے قدس کی دیواریں مسمار کروائیں تو ابن الصلاح دمشق آئے اور انہیں رواحیہ کی تدریس سونپی گئی {cite:tarikh-islam-dhahabi p. 186}۔ مسماری محرم 616ھ کے پہلے دن شروع ہوئی؛ لوگ بھاگ نکلے، بعض دمشق کی طرف {cite:shadharat-dhahab p. 65-66}، اور ابن الصلاح وہیں باقی عمر رہے، رواحیہ، پھر اشرفیہ اور شامیہ میں پڑھاتے رہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}۔"
