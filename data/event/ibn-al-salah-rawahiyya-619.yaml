label:
  ar: "تخريب أسوار القدس ينقل ابن الصلاح إلى دمشق: تدريس الرواحية، نحو ٦١٩هـ"
  en: "The demolition of Jerusalem's walls brings Ibn al-Salah to Damascus: the Rawahiyya post, c. 619"
  ur: "قدس کی دیواروں کا مسمار ابن الصلاح کو دمشق لے آیا: رواحیہ کی تدریس، تقریباً 619ھ"
  es: "La demolición de las murallas de Jerusalén lleva a Ibn al-Salah a Damasco: el post de Rawahiyya, c. 619"
  fr: "La démolition des murailles de Jérusalem amène Ibn al-Salah à Damas: le poste de Rawahiyya, vers 619"
  tr: "Kudüs surlarının yıkılması İbn al-Salah'ı Şam'a taşınmaya yöneltti: yaklaşık 619 Hicri yılında el-Rawahiyya'da ders verdi."
  id: "Hancurnya tembok Yerusalem menyebabkan Ibn al-Salah pindah ke Damaskus: mengajar di al-Rawahiyya, sekitar tahun 619 H."
summary:
  ar: "فلما خرّب الملك المعظم أسوار القدس قدِم ابن الصلاح دمشق ووُلي تدريس الرواحية {cite:tarikh-islam-dhahabi p. 186}؛ وكان هدم السور في أول المحرم سنة ست عشرة فخرج الناس هاربين بعضهم إلى دمشق {cite:shadharat-dhahab p. 65-66}، واستقر ابن الصلاح فيها بقية عمره يدرّس بالرواحية ثم بالأشرفية والشامية {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  en: "When al-Malik al-Mu'azzam had Jerusalem's walls demolished, Ibn al-Salah came to Damascus and was given the teaching post of the Rawahiyya {cite:tarikh-islam-dhahabi p. 186}. The demolition began on the first day of Muharram 616; the people fled, some to Damascus {cite:shadharat-dhahab p. 65-66}, and Ibn al-Salah settled there for the rest of his life, teaching at the Rawahiyya, then the Ashrafiyya and the Shamiyya {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  ur: "جب ملک المعظم نے قدس کی دیواریں مسمار کروائیں تو ابن الصلاح دمشق آئے اور انہیں رواحیہ کی تدریس سونپی گئی {cite:tarikh-islam-dhahabi p. 186}۔ مسماری محرم 616ھ کے پہلے دن شروع ہوئی؛ لوگ بھاگ نکلے، بعض دمشق کی طرف {cite:shadharat-dhahab p. 65-66}، اور ابن الصلاح وہیں باقی عمر رہے، رواحیہ، پھر اشرفیہ اور شامیہ میں پڑھاتے رہے {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}۔"
  es: "Cuando al-Malik al-Mu'azzam mandó demoler las murallas de Jerusalén, Ibn al-Salah llegó a Damasco y se le asignó el puesto de maestro de la Rawahiyya {cite:tarikh-islam-dhahabi p. 186}. La demolición comenzó el primer día de Muharram de 616; la gente huyó, algunos a Damasco {cite:shadharat-dhahab p. 65-66}, e Ibn al-Salah se estableció allí por el resto de su vida, enseñando en la Rawahiyya, luego en la Ashrafiyya y en la Shamiyya {cite:encyclopaedia-of-islam-2 vol. 3 p. 959}."
  fr: "Lorsque al-Malik al-Mu'azzam fit démolir les murs de Jérusalem, Ibn al-Salah se rendit à Damas et reçut la charge d'enseignant de la Rawahiyya (voir: Tarikh Islam Dhahabi, p. 186). La démolition commença le premier jour de Muharram 616; la population s'enfuit, certains se réfugiant à Damas (voir: Hadharat Dhahab, p. 65-66), et Ibn al-Salah s'y installa pour le reste de sa vie, enseignant successivement à la Rawahiyya, à l'Ashrafiyya et à la Shamiyya (voir: Encyclopaedia of Islam, vol. 3, p. 959)."
  tr: "Büyük kral Kudüs surlarını yıktığında, İbn el-Salah Şam'a geldi ve Ravahiyye'de öğretmenlik yapmak üzere görevlendirildi (kaynak:tarikh-islam-dhahabi s. 186). Surlar, on altıncı yılın Muharrem ayının başında yıkıldı, bu yüzden halk kaçtı, bazıları Şam'a gitti (kaynak:shadharat-dhahab s. 65-66). İbn el-Salah hayatının geri kalanını orada geçirdi, önce Ravahiyye'de, sonra Eşrafiyye'de ve Şamiyye'de öğretmenlik yaptı (kaynak:encyclopaedia-of-islam-2 cilt 3 s. 959)."
  id: "Ketika raja besar menghancurkan tembok Yerusalem, Ibn al-Salah datang ke Damaskus dan diangkat untuk mengajar di Rawahiyya (kutip:tarikh-islam-dhahabi hlm. 186). Tembok itu dihancurkan pada awal Muharram tahun enam belas, sehingga orang-orang melarikan diri, sebagian dari mereka ke Damaskus (kutip:shadharat-dhahab hlm. 65-66). Ibn al-Salah menetap di sana selama sisa hidupnya, mengajar di Rawahiyya, kemudian di Ashrafiyya dan Shamiyya (kutip:encyclopaedia-of-islam-2 vol. 3 hlm. 959)."
