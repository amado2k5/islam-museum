  ur: "ابن الفضل کا لشکر صفر 300ھ میں ابو الفارات کے ہاتھوں شکست کھاتا ہے، ص401"
summary:
  ar: "يبعث علي بن الفضل عسكره إلى أبي الفارات فيهزمهم، ويقتل منهم جماعة كثيرة في صفر سنة 300هـ، والكتاب يقول إن الله نصره عليهم."
  en: "Ali ibn al-Fadl sends his army against Abu al-Faraat. The book says God gave Abu al-Faraat the victory over them, and many of the army were killed in Safar 300 AH."
  ur: "علی بن الفضل اپنا لشکر ابو الفارات کے مقابلے پر بھیجتا ہے۔ کتاب کے مطابق اللہ نے ابو الفارات کو ان پر فتح دی، اور صفر 300ھ میں لشکر کے بہت سے لوگ مارے گئے۔"
