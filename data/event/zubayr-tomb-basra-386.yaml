label: { ar: "العثور على قبر الزبير بالبصرة 386هـ", en: "The discovery of al-Zubayr's grave at Basra, 386", es: "El descubrimiento de la tumba de al-Zubayr en Basora, 386", fr: "La découverte de la tombe d'al-Zubayr à Bassora, 386" }
summary:
  ar: "في سنة ست وثمانين وثلثمائة في شهر المحرم أذعن أهل البصرة أنهم كشفوا عن قبر عتيق فوجدوا فيه ميتاً طرياً بثيابه وسيفه وقالوا إنه الزبير بن العوام، فأخرجوه وكفّنوه ودفنوه بالمربد بين الدربين، وبنى عليه الأمير بناءً وجعل الموضع مسجداً ونقلت إليه القناديل والآلات والحصر والعمادات وأقيم فيه قوّام وحفظة ووقف عليه أوقافاً {cite:muntazam-ibn-al-jawzi j.7 p.185}."
  en: "In Muharram 386 the people of Basra reported uncovering an old grave containing a fresh corpse in its clothes and sword, said to be al-Zubayr b. al-'Awwam; they re-shrouded and reburied it at al-Mirbad between the two lanes, the amir built over it and made the spot a mosque, moving in candelabra, vessels, mats and pillars, appointing wardens and settling waqfs on it {cite:muntazam-ibn-al-jawzi j.7 p.185}."
  es: "En Muharram 386, la gente de Basora informó haber descubierto una tumba antigua que contenía un cadáver reciente con su ropa y espada, que se decía que era al-Zubayr b. al-'Awwam; lo volvieron a amortajar y lo volvieron a enterrar en al-Mirbad, entre las dos calles, el emir construyó sobre ella e hizo del lugar una mezquita, trasladando candelabros, vasijas, esteras y pilares, nombrando guardianes y estableciendo waqfs en ella {cite:muntazam-ibn-al-jawzi j.7 p.185}."
  fr: "En Muharram 386, les habitants de Bassora rapportèrent avoir découvert une ancienne tombe contenant un corps frais dans ses vêtements et son épée, dit-on, celui d'al-Zubayr b. al-'Awwam; ils le recouvrirent d'un linceul et le réenterrèrent à al-Mirbad entre les deux ruelles, l'émir construisit par-dessus et fit de l'endroit une mosquée, y installant des candélabres, des vases, des nattes et des piliers, nommant des gardiens et y établissant des waqfs {cite:muntazam-ibn-al-jawzi j.7 p.185}."
