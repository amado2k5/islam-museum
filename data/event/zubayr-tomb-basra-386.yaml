label: { ar: "العثور على قبر الزبير بالبصرة 386هـ", en: "The discovery of al-Zubayr's grave at Basra, 386" }
summary:
  ar: "في سنة ست وثمانين وثلثمائة في شهر المحرم أذعن أهل البصرة أنهم كشفوا عن قبر عتيق فوجدوا فيه ميتاً طرياً بثيابه وسيفه وقالوا إنه الزبير بن العوام، فأخرجوه وكفّنوه ودفنوه بالمربد بين الدربين، وبنى عليه الأمير بناءً وجعل الموضع مسجداً ونقلت إليه القناديل والآلات والحصر والعمادات وأقيم فيه قوّام وحفظة ووقف عليه أوقافاً {cite:muntazam-ibn-al-jawzi j.7 p.185}."
  en: "In Muharram 386 the people of Basra reported uncovering an old grave containing a fresh corpse in its clothes and sword, said to be al-Zubayr b. al-'Awwam; they re-shrouded and reburied it at al-Mirbad between the two lanes, the amir built over it and made the spot a mosque, moving in candelabra, vessels, mats and pillars, appointing wardens and settling waqfs on it {cite:muntazam-ibn-al-jawzi j.7 p.185}."
