label: { ar: "تسليم الكامل القدس للإمبراطور سنة 626هـ", en: "Al-Kamil hands Jerusalem to the emperor, 626 AH", es: "Al-Kamil entrega Jerusalén al emperador, 626 AH", fr: "Al-Kamil remet Jérusalem à l'empereur, 626 AH", ur: "الکامل نے یروشلم کو شہنشاہ کے حوالے کیا، 626ھ", tr: "Kudüs'ün Hicri 626 yılında İmparator'a tamamen teslim olması.", id: "Penyerahan Yerusalem sepenuhnya kepada Kaisar pada tahun 626 Hijriah." }
summary:
  ar: "في سنة ست وعشرين وست مئة سلم الكامل القدس الشريف لملك الفرنج بعد أن كاتبه الإمبراطور ملكهم في العام الماضي يقول أنا عتيقك وتعلم أني أكبر ملوك الفرنج وأنت كاتبتني بالمجيء وقد علم البابا والملوك باهتمامي فإن رجعت خائباً انكسرت حرمتي وهذه القدس هي أصل دين النصرانية وأنتم قد خربتموها وليس لها دخل طائل فإن رأيت أن تنعم علي بقبضة البلد ليرتفع رأسي بين الملوك وأنا ألتزم بحمل دخلها لك فأجاب له وسلمه إياها في هذا العام فإنا لله وإنا إليه راجعون ثم اتبع فعله هذا بحصار دمشق وأذية الرعية ودام الحصار أشهراً ثم وقع الصلح في شعبان ورضي الناصر بالكرك ونابلس فقط ثم سلم دمشق إلى أخيه الأشرف بعد شهر وأعطاه الأشرف حران والرقة والرها {cite:shadharat-dhahab p. 126}. وعند ابن الأثير أن الفرنج تسلموا البيت المقدس صلحاً أول ربيع الآخر سنة ست وعشرين واستقرت القاعدة بين الكامل والأشرف والأنبرور على أن يسلموا إليه البيت المقدس ومعه مواضع يسيرة من بلاده ويبقى الخليل ونابلس والغور وطبرية وغيرها بيد المسلمين، وكان سور البيت المقدس خراباً قد خربه الملك المعظم، فلما تسلم الفرنج البيت المقدس استعظم المسلمون ذلك وكبروه ووجدوا له من الوهن والتألم ما لا يمكن وصفه {cite:kamil-ibn-al-athir p. 481-482}."
  en: "In 626 al-Kamil surrendered Jerusalem to the Frankish emperor, who had written: 'you summoned me, the Pope and the kings know of my zeal, and if I return empty-handed my honour is broken — yet you have ruined Jerusalem and its revenue is slight, so grant me its keys that my head may rise among the kings and I will remit its income to you.' The cession passed; al-Kamil then besieged Damascus for months until the Sha'ban truce left al-Nasir only Karak and Nablus {cite:shadharat-dhahab p. 126}."
  es: "En 626, al-Kamil entregó Jerusalén al emperador franco, quien había escrito: «Me convocaste, el Papa y los reyes conocen mi celo, y si regreso con las manos vacías mi honor quedará quebrantado; sin embargo, has arruinado Jerusalén y sus ingresos son escasos, así que concédeme sus llaves para que mi cabeza se eleve entre los reyes y te remitiré sus ingresos». La cesión se llevó a cabo; al-Kamil sitió Damasco durante meses hasta que la tregua de Sha'ban dejó a al-Nasir solo Karak y Nablus {cita: shadharat-dhahab p. 126}."
  fr: "En 626, al-Kamil livra Jérusalem à l'empereur franc, qui avait écrit: « Tu m'as convoqué, le pape et les rois connaissent mon zèle, et si je reviens les mains vides, mon honneur sera bafoué. Or, tu as ruiné Jérusalem et ses revenus sont maigres; accorde-moi donc ses clés afin que ma tête s'élève parmi les rois et je te reverserai ses revenus. » La cession fut approuvée; al-Kamil assiégea ensuite Damas pendant des mois, jusqu'à ce que la trêve de Sha'ban ne laisse à al-Nasir que Karak et Naplouse (voir: shadharat-dhahab, p. 126)."
  ur: "626 میں الکامل نے یروشلم کو فرانک کے شہنشاہ کے حوالے کر دیا، جس نے لکھا تھا: 'تم نے مجھے بلایا، پوپ اور بادشاہوں کو میرے جوش کا علم ہے، اور اگر میں خالی ہاتھ واپس آیا تو میری عزت ٹوٹ جائے گی، پھر بھی تم نے یروشلم کو برباد کر دیا ہے اور اس کی آمدنی تھوڑی ہے، لہٰذا اس کی آمدنی مجھے دے دو تاکہ میں اس کی چابیاں اپنے سر پر چڑھاؤں'۔ سیشن گزر گیا؛ اس کے بعد الکامل نے دمشق کا مہینوں تک محاصرہ کیا یہاں تک کہ شعبان کی جنگ بندی میں ناصر صرف کرک اور نابلس رہ گیا 126}۔"
  tr: "Hicri 626 yılında, El-Kamil, Frank İmparatoru'nun bir önceki yıl kendisine yazdığı ve \"Ben sizin azatlı kölenizim ve Frank krallarının en büyüğü olduğumu biliyorsunuz. Bana gelmekle ilgili yazdınız ve Papa ile krallar benim ilgimi biliyorlar. Eğer hayal kırıklığına uğrayarak dönersem, şerefim zedelenecektir. Bu Kudüs, Hristiyan dininin kaynağıdır ve siz onu mahvettiniz, önemli bir geliri yok. Eğer bana şehrin kontrolünü vermeyi uygun görürseniz, krallar arasında başım yükselsin diye, size şehrin gelirini getirmeyi üstleneceğim.\" dediği mektubun ardından Kudüs'ü Frank Kralı'na teslim etti. El-Kamil ona cevap verdi ve bu yıl şehri ona teslim etti. Biz Allah'a aitiz ve O'na döneceğiz. Ardından Şam'ı kuşattı ve halkına zarar verdi. Kuşatma aylarca sürdü, ardından Şaban'da barış sağlandı ve El-Nasır sadece Karak ve Nablus ile yetindi. Sonra bir ay sonra Şam'ı kardeşi El-Eşref'e teslim etti ve El-Eşref ona Harran, Rakka ve Edessa'yı verdi. {kaynak: Şadharat-Dhahab s. 126} İbn el-Athir'e göre, Franklar Kudüs'ü 26. yılın Rebiü'l-Sani ayının birinci gününde barışçıl bir şekilde ele geçirdiler. El-Kamil, El-Eşref ve El-Anbarur arasındaki anlaşma, Kudüs'ü ve topraklarındaki birkaç yeri ona teslim edecekleri, Hebron, Nablus, Ürdün Vadisi, Taberiye ve diğerlerinin ise Müslümanların elinde kalacağı yönündeydi. Kudüs surları, Kral el-Muazzam tarafından yıkıldığı için harabe halindeydi. Franklar Kudüs'ü ele geçirdiğinde, Müslümanlar büyük bir üzüntü ve tarif edilemez bir acı ve güçsüzlük hissettiler. {kaynak: Kamil-ibn-el-Athir s. 481-482}"
  id: "Pada tahun 626 H, Al-Kamil menyerahkan Yerusalem kepada Raja Frank setelah Kaisar mereka menulis surat kepadanya tahun sebelumnya, yang isinya, “Aku adalah budakmu yang telah dibebaskan, dan engkau tahu bahwa aku adalah raja Frank terbesar. Engkau telah menulis surat kepadaku tentang kedatanganku, dan Paus serta para raja mengetahui minatku. Jika aku kembali dengan kecewa, kehormatanku akan hancur. Yerusalem ini adalah asal mula agama Kristen, dan engkau telah menghancurkannya, dan kota ini tidak memiliki pendapatan yang signifikan. Jika engkau berkenan memberiku kendali atas kota ini agar kepalaku dapat diangkat di antara para raja, aku akan berupaya untuk membawakanmu pendapatannya.” Kaisar menjawab surat itu dan menyerahkannya pada tahun itu. Sesungguhnya kita milik Allah dan kepada-Nya kita akan kembali. Kemudian ia melanjutkan tindakan ini dengan mengepung Damaskus dan melukai rakyatnya. Pengepungan berlangsung selama berbulan-bulan, kemudian perdamaian ditegakkan pada bulan Sya'ban, dan Al-Nasir hanya puas dengan Karak dan Nablus saja. Kemudian setelah sebulan ia menyerahkan Damaskus kepada saudaranya, Al-Ashraf, dan Al-Ashraf memberinya Harran, Raqqa, dan Edessa. {cite:shadharat-dhahab hlm. 126} Menurut Ibn al-Athir, kaum Frank menguasai Yerusalem secara damai pada tanggal 1 Rabi’ al-Thani tahun 26. Kesepakatan antara al-Kamil, al-Ashraf, dan al-Anbarur adalah bahwa mereka akan menyerahkan Yerusalem kepadanya, bersama dengan beberapa tempat di wilayahnya, sementara Hebron, Nablus, Lembah Yordania, Tiberias, dan lainnya akan tetap berada di tangan kaum Muslim. Tembok Yerusalem dalam keadaan hancur, setelah dihancurkan oleh Raja al-Mu’azzam. Ketika kaum Frank menguasai Yerusalem, kaum Muslim sangat tertekan dan merasakan kesedihan dan kelemahan yang luar biasa yang tidak dapat digambarkan. {cite:kamil-ibn-al-athir hlm. 481-482}."
