label: { ar: "تسليم الكامل القدس للإمبراطور سنة 626هـ" }
summary:
  ar: "في سنة ست وعشرين وست مئة سلم الكامل القدس الشريف لملك الفرنج بعد أن كاتبه الإمبراطور ملكهم في العام الماضي يقول أنا عتيقك وتعلم أني أكبر ملوك الفرنج وأنت كاتبتني بالمجيء وقد علم البابا والملوك باهتمامي فإن رجعت خائباً انكسرت حرمتي وهذه القدس هي أصل دين النصرانية وأنتم قد خربتموها وليس لها دخل طائل فإن رأيت أن تنعم علي بقبضة البلد ليرتفع رأسي بين الملوك وأنا ألتزم بحمل دخلها لك فأجاب له وسلمه إياها في هذا العام فإنا لله وإنا إليه راجعون ثم اتبع فعله هذا بحصار دمشق وأذية الرعية ودام الحصار أشهراً ثم وقع الصلح في شعبان ورضي الناصر بالكرك ونابلس فقط ثم سلم دمشق إلى أخيه الأشرف بعد شهر وأعطاه الأشرف حران والرقة والرها {cite:shadharat-dhahab p. 126}. وعند ابن الأثير أن الفرنج تسلموا البيت المقدس صلحاً أول ربيع الآخر سنة ست وعشرين واستقرت القاعدة بين الكامل والأشرف والأنبرور على أن يسلموا إليه البيت المقدس ومعه مواضع يسيرة من بلاده ويبقى الخليل ونابلس والغور وطبرية وغيرها بيد المسلمين، وكان سور البيت المقدس خراباً قد خربه الملك المعظم، فلما تسلم الفرنج البيت المقدس استعظم المسلمون ذلك وكبروه ووجدوا له من الوهن والتألم ما لا يمكن وصفه {cite:kamil-ibn-al-athir p. 481-482}."
  en: "In 626 al-Kamil surrendered Jerusalem to the Frankish emperor, who had written: 'you summoned me, the Pope and the kings know of my zeal, and if I return empty-handed my honour is broken — yet you have ruined Jerusalem and its revenue is slight, so grant me its keys that my head may rise among the kings and I will remit its income to you.' The cession passed; al-Kamil then besieged Damascus for months until the Sha'ban truce left al-Nasir only Karak and Nablus {cite:shadharat-dhahab p. 126}."
