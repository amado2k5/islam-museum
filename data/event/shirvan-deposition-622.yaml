label: { ar: "خلع شروان شاه والظفر بالكرج", en: "The deposition of the Shirvanshah and the victory over the Georgians (622 AH)" }
summary:
  ar: "في سنة اثنتين وعشرين وستمائة ثار ولد شروان شاه على أبيه فنزعه من الملك وأخرجه من البلاد، وكان الأب سيئ السيرة كثير الفساد والظلم يتعرض لأموال الرعايا؛ فسار المخلوع إلى الكرج وقرر معهم أن يرسلوا معه عسكراً يعيده إلى ملكه ويعطيهم نصف البلاد، فأعلم الولد عسكره أن الكرج إن حاصروهم لم يُبقِ أبوه على أحد منهم وأخذ الكرج نصف البلاد، فخرجوا إليهم جريدة في نحو ألف فارس ولقوا الكرج في ثلاثة آلاف مقاتل فصبر أهل شروان فانهزم الكرج وقتل كثير وأسر كثير، وقال مقدمو الكرج للمخلوع: لم نلق بسببك خيراً فلا تقم ببلادنا، فبقي متردداً لا يأوي إلى أحد، واستقر الولد في الملك وأعاد إلى الناس أملاكهم ومصادراتهم فاغتبطوا بولايته {cite:kamil-ibn-al-athir p. 446-447}."
  en: "622: the Shirvanshah's own son deposed his tyrannical father, who bought Georgian restoration at the price of half the kingdom; the son's thousand horsemen met three thousand Georgians and routed them — whereupon the Georgian commanders dismissed the old shah: 'we met nothing good on your account — do not stay in our lands'. The son restored the people's confiscated estates and ruled well {cite:kamil-ibn-al-athir p. 446-447}."
