label: { ar: "خلع شروان شاه والظفر بالكرج", en: "The deposition of the Shirvanshah and the victory over the Georgians (622 AH)", es: "La deposición del Shirvanshah y la victoria sobre los georgianos (622 AH)", fr: "La destitution du Shirvanshah et la victoire sur les Géorgiens (622 AH)", ur: "شیروان شاہ کی معزولی اور جارجیوں پر فتح ⁦(622ھ)⁩", tr: "Şirvanşah'ı tahttan indirmek ve Karaja'yı fethetmek", id: "Menggulingkan Shirvanshah dan menaklukkan Karaja" }
summary:
  ar: "في سنة اثنتين وعشرين وستمائة ثار ولد شروان شاه على أبيه فنزعه من الملك وأخرجه من البلاد، وكان الأب سيئ السيرة كثير الفساد والظلم يتعرض لأموال الرعايا؛ فسار المخلوع إلى الكرج وقرر معهم أن يرسلوا معه عسكراً يعيده إلى ملكه ويعطيهم نصف البلاد، فأعلم الولد عسكره أن الكرج إن حاصروهم لم يُبقِ أبوه على أحد منهم وأخذ الكرج نصف البلاد، فخرجوا إليهم جريدة في نحو ألف فارس ولقوا الكرج في ثلاثة آلاف مقاتل فصبر أهل شروان فانهزم الكرج وقتل كثير وأسر كثير، وقال مقدمو الكرج للمخلوع: لم نلق بسببك خيراً فلا تقم ببلادنا، فبقي متردداً لا يأوي إلى أحد، واستقر الولد في الملك وأعاد إلى الناس أملاكهم ومصادراتهم فاغتبطوا بولايته {cite:kamil-ibn-al-athir p. 446-447}."
  en: "622: the Shirvanshah's own son deposed his tyrannical father, who bought Georgian restoration at the price of half the kingdom; the son's thousand horsemen met three thousand Georgians and routed them — whereupon the Georgian commanders dismissed the old shah: 'we met nothing good on your account — do not stay in our lands'. The son restored the people's confiscated estates and ruled well {cite:kamil-ibn-al-athir p. 446-447}."
  es: "622: El propio hijo del Shirvanshah depuso a su tiránico padre, quien había comprado la restauración georgiana a cambio de la mitad del reino. Mil jinetes del hijo se enfrentaron a tres mil georgianos y los derrotaron, tras lo cual los comandantes georgianos destituyeron al viejo shah: «No hemos encontrado nada bueno en ti; no te quedes en nuestras tierras». El hijo restituyó las propiedades confiscadas al pueblo y gobernó con justicia {cita:kamil-ibn-al-athir, págs. 446-447}."
  fr: "622: Le propre fils du Shirvanshah déposa son père tyrannique, qui avait racheté la restauration de la Géorgie au prix de la moitié du royaume; les mille cavaliers du fils rencontrèrent trois mille Géorgiens et les mirent en déroute. Les commandants géorgiens congédièrent alors le vieux shah: « Nous n’avons rien obtenu de bon de votre part; ne restez pas sur nos terres. » Le fils restitua les biens confisqués au peuple et gouverna avec sagesse (voir: Kamil ibn al-Athir, p. 446-447)."
  ur: "622: شیروان شاہ کے اپنے بیٹے نے اپنے ظالم باپ کو معزول کر دیا، جس نے آدھی سلطنت کی قیمت پر جارجیائی بحالی خریدی تھی۔ بیٹے کے ہزار گھڑ سواروں نے تین ہزار جارجیائیوں سے ملاقات کی اور انہیں بھگا دیا - جس پر جارجیائی کمانڈروں نے بوڑھے شاہ کو برطرف کر دیا: 'ہمیں تمہارے لیے کچھ اچھا نہیں ملا - ہماری زمینوں میں مت رہنا'۔ بیٹے نے لوگوں کی ضبط کی گئی جاگیریں بحال کیں اور اچھی طرح حکومت کی۔ 446-447}۔"
  tr: "Hicri 622 yılında Şirvan Şah'ın oğlu babasına isyan etti, onu tahttan indirdi ve ülkeden kovdu. Babası kötü karakterli, yozlaşmış ve adaletsizdi ve tebaasının servetine el koyardı. Bu yüzden tahttan indirilen kişi Gürcülere gitti ve onlarla, kendisini tahtına geri getirmek ve ülkenin yarısını onlara vermek için bir ordu göndermeleri konusunda anlaştı. Oğlu ordusuna, Gürcüler onları kuşatırsa babasının hiçbirini esirgemeyeceğini ve Gürcülerin ülkenin yarısını alacağını bildirdi. Böylece yaklaşık bin süvariden oluşan bir birlikle yola çıktılar ve Gürcülerle üç bin savaşçıyla karşılaştılar. Şirvan halkı dimdik durdu, bu yüzden Gürcüler yenildi, birçoğu öldürüldü ve birçoğu esir alındı. Gürcü liderleri tahttan indirilen kişiye şöyle dediler: \"Senden hiçbir iyilik görmedik, bu yüzden ülkemizde kalma.\" Bu yüzden tereddüt etti ve kimseye sığınmadı. Oğul tahta geçti ve halka mallarını iade etti, el konulan şeyleri geri verdi; böylece halk onun yönetiminden memnun kaldı. {Kaynak: Kamil İbn el-Athir, s. 446-447}"
  id: "Pada tahun 622 Hijriah, putra Shirvan Shah memberontak terhadap ayahnya, menggulingkannya dari takhta, dan mengusirnya dari negeri itu. Sang ayah memiliki karakter buruk, korup, dan tidak adil, dan ia akan merampas kekayaan rakyat. Maka sang putra yang digulingkan pergi kepada orang-orang Georgia dan setuju dengan mereka bahwa mereka akan mengirimkan pasukan bersamanya untuk mengembalikannya ke takhta dan memberikan setengah negeri kepada mereka. Sang putra memberi tahu pasukannya bahwa jika orang-orang Georgia mengepung mereka, ayahnya tidak akan mengampuni siapa pun dari mereka dan orang-orang Georgia akan mengambil setengah negeri itu. Maka mereka pergi menemui mereka dengan detasemen sekitar seribu penunggang kuda dan bertemu dengan orang-orang Georgia dengan tiga ribu pejuang. Rakyat Shirvan tetap teguh, sehingga orang-orang Georgia dikalahkan, dan banyak yang terbunuh serta banyak yang ditawan. Para pemimpin Georgia berkata kepada sang putra yang digulingkan: Kami belum melihat kebaikan apa pun karenamu, jadi jangan tinggal di negeri kami. Maka ia tetap ragu-ragu dan tidak mencari perlindungan kepada siapa pun. Putranya diangkat menjadi raja dan mengembalikan harta benda serta barang-barang yang disita kepada rakyat, sehingga mereka senang dengan pemerintahannya. {cite:kamil-ibn-al-athir p. 446-447}."
