label: { ar: "إحراق مصحف منسوب إلى ابن مسعود وفتنة الكرخ" }
summary:
  ar: "في رجب سنة ثمان وتسعين جرت فتنة بين أهل الكرخ والفقهاء بقطيعة الربيع بعد تعرض لأبي عبد الله ابن النعمان المعروف بابن المعلم فقيه الشيعة، وأحضر مصحف ذكر أنه مصحف ابن مسعود وهو يخالف المصاحف فاجتمع الأشراف والقضاة والفقهاء وعرض عليهم فأشار أبو حامد الاسفراييني والفقهاء بتحريقه ففعل بحضورهم، ثم قتل رجل دعا على من أحرقه فوقع القتال بين أهل الكرخ وأهل باب البصرة وباب الشعير والقلائين وصاحوا حاكم يا منصور، وبلغ الخليفة فأحفظه فوضع الحرس على بابه لمعاونة أهل السنة وأحرق ما يلي نهر الدجاج، وخرج ابن المعلم من البلد ليلة الأحد لسبع بقين من رمضان {cite:muntazam-ibn-al-jawzi j.7 p.238-239}."
