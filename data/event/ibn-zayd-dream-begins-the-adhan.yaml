id: event/ibn-zayd-dream-begins-the-adhan
class: event
kind: other
label:
  ar: "رؤيا ابن زيد وبدء الأذان"
  en: "Ibn Zayd's dream and the beginning of the adhan"
  ur: "ابن زید کا خواب اور اذان کا آغاز"
summary:
  ar: "رأى عبد الله بن زيد في منامه خشبتين يؤذن بهما فجاء إلى النبي فقص رؤياه فأمره النبي أن يؤذن كما رآه {cite:muwatta-maruf-1997} [[passage/muwatta-1-172|الموطأ 172]]."
  en: "Abdullah ibn Zayd saw in a dream two wooden clappers by which the call to prayer is made; he came to the Prophet and related his dream, and the Prophet ordered him to call the adhan as he had seen it {cite:muwatta-maruf-1997} [[passage/muwatta-1-172|Muwatta 172]]."
  ur: "عبد اللہ بن زید نے خواب دیکھا کہ لکڑی کی دو کلیاں ہیں جن سے اذان دی جاتی ہے؛ وہ نبی کے پاس آیا اور اپنا خواب سنایا تو نبی نے اسے حکم دیا کہ جیسے اس نے دیکھا ویسے اذان دے {cite:muwatta-maruf-1997} [[passage/muwatta-1-172|موطأ 172]]۔"
