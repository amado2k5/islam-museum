  en: "Ahmad ibn Yahya lifts the siege of the Qarmatian stronghold and returns to his land in 308 AH, p. 405"
  fr: "Ahmad ibn Yahya lève le siège de la forteresse qarmate et regagne son pays en 308 de l’hégire, p. 405"
