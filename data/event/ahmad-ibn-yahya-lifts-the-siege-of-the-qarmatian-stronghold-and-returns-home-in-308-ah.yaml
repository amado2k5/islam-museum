summary:
  ar: "يرفع أحمد بن يحيى الحصار عن الحصن القرمطي، ويعود إلى بلده سنة 308هـ خشية الوقوع في حرب قائد السلطان."
  en: "Ahmad ibn Yahya lifts the siege of the Qarmatian stronghold and goes home in 308 AH, rather than fight the Sultan's commander."
  fr: "Ahmad ibn Yahya lève le siège de la forteresse qarmate et rentre chez lui en 308 de l’hégire plutôt que de combattre le commandant du sultan."
  ur: "احمد بن یحییٰ سلطان کے قائد سے لڑنے سے بچنے کے لیے قرامطہ کے قلعے کا محاصرہ اٹھا کر 308ھ میں اپنی سرزمین لوٹ جاتا ہے۔"
  es: "Ahmad ibn Yahya levanta el asedio de la fortaleza de Qarmatia y regresa a casa en el año 308 de la Hégira, en lugar de luchar contra el comandante del sultán."
  tr: "Ahmed ibn Yahya, Sultan'ın komutanının savaşına yakalanma korkusuyla Hicri 308 yılında Karmati kalesine yapılan kuşatmayı kaldırdı ve ülkesine döndü."
  id: "Ahmad ibn Yahya mengakhiri pengepungan benteng Qarmatian dan kembali ke negaranya pada tahun 308 Hijriah karena takut terjebak dalam perang komandan Sultan."
