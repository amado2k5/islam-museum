id: event/al-rida-succession
class: event
kind: gathering
label: { ar: "عهد المأمون إلى علي الرضا", en: "al-Ma'mun's designation of Ali al-Rida as heir", es: "Designación de Ali al-Rida como heredero por parte de al-Ma'mun", fr: "Désignation par al-Ma'mun d'Ali al-Rida comme héritier", ur: "المامون کا علی الرضا کو وارث قرار دینا" }
summary:
  ar: "في سنة إحدى ومئتين خلع المأمون أخاه المؤتمن من العهد وجعل ولي العهد علي الرضا بن موسى الكاظم، حمله على ذلك إفراطه في التشيع حتى قيل إنه هم أن يخلع نفسه ويفوض الأمر إليه وهو الذي لقبه الرضا وضرب الدراهم باسمه وزوجه ابنته وكتب إلى الآفاق بذلك وأمر بترك السواد ولبس الخضرة فاشتد ذلك على بني العباس جداً فخرجوا وبايعوا إبراهيم بن المهدي الملقب المبارك {cite:tarikh-khulafa-minhaj-1434 p. 486-487}."
  en: "In year 201 al-Ma'mun deposed his brother al-Mu'tamin from the succession and made Ali al-Rida ibn Musa al-Kazim heir — moved by his Shi'ite devotion, it was said, to the point of considering abdication outright. He it was who dubbed him 'al-Rida', struck dirhams in his name, married him to his daughter, wrote it to all the provinces and ordered the black dropped for green. The Abbasids took it extremely ill — they rose and swore to Ibrahim ibn al-Mahdi 'al-Mubarak' {cite:tarikh-khulafa-minhaj-1434 p. 486-487}."
  es: "En el año 201, al-Ma'mun depuso a su hermano al-Mu'tamin de la sucesión y nombró heredero a Ali al-Rida ibn Musa al-Kazim, conmovido, según se dice, hasta el punto de considerar la abdicación. Fue él quien lo bautizó como «al-Rida», acuñó dirhams en su nombre, lo casó con su hija, lo comunicó a todas las provincias y ordenó sustituir el negro por el verde. Los abasíes lo tomaron muy mal: se sublevaron y juraron lealtad a Ibrahim ibn al-Mahdi «al-Mubarak» {cite:tarikh-khulafa-minhaj-1434 p. 486-487}."
  fr: "En 201, al-Ma'mun déposa son frère al-Mu'tamin de la succession et désigna Ali al-Rida ibn Musa al-Kazim comme héritier, ému, dit-on, par sa ferveur chiite au point d'envisager l'abdication. C'est lui qui le nomma « al-Rida », fit frapper des dirhams à son nom, le maria à sa fille, en informa toutes les provinces et ordonna le remplacement du noir par le vert. Les Abbassides réagirent très mal; ils se soulevèrent et prêtèrent serment d'allégeance à Ibrahim ibn al-Mahdi « al-Mubarak » (voir: Tarikh-Khulafa-Minhaj-1434, p. 486-487)."
  ur: "سنہ 201 میں المامون نے اپنے بھائی الموطمین کو جانشینی سے معزول کر دیا اور علی الرضا ابن موسیٰ کاظم کو وارث بنا دیا - ان کی شیعہ عقیدت سے متاثر ہو کر کہا جاتا ہے کہ اس نے دستبرداری پر مکمل غور کیا۔ اسی نے اسے 'الرضا' کا نام دیا، اس کے نام پر درہم مارا، اس کی شادی اپنی بیٹی سے کروائی، تمام صوبوں کو لکھا اور کالے کو سبز کے بدلے گرانے کا حکم دیا۔ عباسیوں نے اسے سخت بیمار لیا - وہ اٹھے اور ابراہیم بن المہدی المبارک سے قسم کھائی۔ 486-487}۔"
