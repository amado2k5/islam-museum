label: { ar: "عهد المأمون إلى علي الرضا", en: "al-Ma'mun's designation of Ali al-Rida as heir" }
summary:
  ar: "في سنة إحدى ومئتين خلع المأمون أخاه المؤتمن من العهد وجعل ولي العهد علي الرضا بن موسى الكاظم، حمله على ذلك إفراطه في التشيع حتى قيل إنه هم أن يخلع نفسه ويفوض الأمر إليه وهو الذي لقبه الرضا وضرب الدراهم باسمه وزوجه ابنته وكتب إلى الآفاق بذلك وأمر بترك السواد ولبس الخضرة فاشتد ذلك على بني العباس جداً فخرجوا وبايعوا إبراهيم بن المهدي الملقب المبارك {cite:tarikh-khulafa-minhaj-1434 p. 486-487}."
  en: "In year 201 al-Ma'mun deposed his brother al-Mu'tamin from the succession and made Ali al-Rida ibn Musa al-Kazim heir — moved by his Shi'ite devotion, it was said, to the point of considering abdication outright. He it was who dubbed him 'al-Rida', struck dirhams in his name, married him to his daughter, wrote it to all the provinces and ordered the black dropped for green. The Abbasids took it extremely ill — they rose and swore to Ibrahim ibn al-Mahdi 'al-Mubarak' {cite:tarikh-khulafa-minhaj-1434 p. 486-487}."
