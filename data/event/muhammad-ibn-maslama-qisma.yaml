label: { ar: "قِسامة محمد بن مسلمة لعمرو بن العاص", en: "Muhammad ibn Maslama's Division of Amr's Wealth", es: "La división de la riqueza de Amr por Muhammad ibn Maslama", fr: "Le partage des biens d'Amr par Muhammad ibn Maslama" }
summary:
  ar: "عند البلاذري: كان عمر بن الخطاب يكتب أموال عمّاله إذا ولّاهم ثم يقاسمهم ما زاد على ذلك وربما أخذه منهم فكتب إلى عمرو بن العاص أنه قد فشت له فاشية من متاع ورقيق وآنية وحيوان لم تكن حين وليت مصر فكتب إليه عمرو أن أرضنا أرض مزدرع ومتجر فنحن نصيب فضلاً عما نحتاج إليه لنفقتنا فكتب إليه إني قد خبرت من عمّال السوء ما كفى وكتابك إليّ كتاب من قد أقلقه الأخذ بالحق وقد سُئت بك ظناً وقد وجّهت إليك محمد بن مسلمة ليقاسمك ما لك فأطلعه طلعة وأخرج إليه ما يطالبك وأعفه من الغلظة عليك فإنه برّح الخفاء فقاسمه ماله؛ وقال عمرو لما قاسمه إن زماناً عاملنا فيه ابن حنتمة هذه المعاملة لزمان سوء لقد كان العاصي يلبس الخزّ بكفاف الديباج فقال محمد مهّ لولا زمان ابن حنتمة هذا الذي تكرهه ألفيتَ ممتقلاً عنزاً بفناء بيتك يسرّك غزرها ويسواك بكودها فقال أنشدك الله أن تخبر عمر بقولي فإن المجالس بالأمانة فقال لا أذكر شيئاً مما جرى بيننا وعمر حيّ."
  en: "In al-Baladhuri: Umar ibn al-Khattab would record his governors' wealth when appointing them, then share with them whatever grew beyond it, sometimes taking it outright — so he wrote to Amr ibn al-As that goods, slaves, vessels and beasts had flourished for him beyond what he held when given Egypt; Amr wrote back that his was a land of sowing and trade whence they drew surplus beyond their needs, and Umar answered: 'I have learned enough from bad governors; your letter to me is the letter of one unsettled by the taking of his due — I have thought ill of you, and have sent Muhammad ibn Maslama to divide with you what you own; open to him, bring out what he demands, and pardon his harshness upon you, for he spares no concealment' — and he divided his wealth with him; Amr said when he divided it 'a time that treats us so — the time of Ibn Hantama — is an evil time; al-Asi used to wear brocade edging on silk', and Muhammad answered 'hush — but for this time of Ibn Hantama you hate, you would be found dragging a goat in your house's yard, glad of its yarn, its droppings your equal'; Amr said 'I adjure you by God to tell Umar my words, for councils are a trust', and he answered 'I shall mention nothing of what passed between us while Umar lives'."
  es: "En al-Baladhuri: Umar ibn al-Khattab registraba la riqueza de sus gobernadores al nombrarlos, y luego compartía con ellos lo que superaba dicha riqueza, a veces tomándolo directamente. Así, le escribió a Amr ibn al-As que bienes, esclavos, embarcaciones y bestias habían florecido para él más allá de lo que poseía cuando se le dio Egipto. Amr le respondió que la suya era una tierra de siembra y comercio de la cual obtenían excedentes más allá de sus necesidades, y Umar respondió: «He aprendido bastante de los malos gobernadores; tu carta para mí es la carta de alguien perturbado por la toma de lo que le corresponde. He pensado mal de ti y he enviado a Muhammad ibn Maslama para que divida contigo lo que posees; ábrele, sácale lo que te pide y perdona su dureza contigo, porque no escatima en ocultamientos». Y dividió su riqueza con él. Amr dijo cuando la dividió: «Un tiempo que nos trata así, el tiempo de Ibn Hantama, es un tiempo malo; Al-Asi solía usar ribetes de brocado en la seda', y Muhammad respondió 'silencio, pero si no fuera por esta época de Ibn Hantama que tanto odias, te encontrarían arrastrando una cabra en el patio de tu casa, contento con su lana, sus excrementos iguales a los tuyos'; Amr dijo 'Te conjuro por Dios que le cuentes a Umar mis palabras, pues los consejos son una responsabilidad', y él respondió 'No mencionaré nada de lo que pasó entre nosotros mientras Umar viva'."
  fr: "Dans al-Baladhuri: Umar ibn al-Khattab consignait les richesses de ses gouverneurs lors de leur nomination, puis partageait avec eux tout ce qui s’enrichissait au-delà, allant parfois jusqu’à s’en emparer purement et simplement. Ainsi, il écrivit à Amr ibn al-As que biens, esclaves, navires et bêtes avaient prospéré pour lui au-delà de ce qu’il possédait lorsqu’il reçut l’Égypte. Amr lui répondit que son pays était une terre de semailles et de commerce d’où l’on tirait un surplus dépassant les besoins. Umar répliqua: « J’ai suffisamment appris des mauvais gouverneurs; ta lettre est celle de quelqu’un mécontent qu’on lui prenne ce qui lui est dû. J’ai eu une mauvaise opinion de toi et j’ai envoyé Muhammad ibn Maslama pour partager tes biens. Sois ouvert à lui, présente-lui ce qu’il demande et pardonne-lui sa dureté, car il ne ménage aucun secret. » Et il partagea ses richesses avec lui. Amr déclara alors: « Une époque qui nous traite ainsi – l’époque d’Ibn Hantama – est une époque néfaste. » « Al-Asi portait des bordures de brocart sur de la soie », et Muhammad répondit: « Chut ! Mais pour cette époque d'Ibn Hantama que tu détestes, on te trouverait à traîner une chèvre dans la cour de ta maison, content de sa laine, ses excréments étant ton égal. » Amr dit: « Je t'adjure par Dieu de rapporter mes paroles à Umar, car les conseils sont un dépôt », et il répondit: « Je ne dirai rien de ce qui s'est passé entre nous tant qu'Umar est en vie. »"
