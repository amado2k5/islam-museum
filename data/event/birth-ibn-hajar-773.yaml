label:
  ar: "ولادة الحافظ ابن حجر العسقلاني بالقاهرة، ٧٧٣هـ/١٣٧٢م"
  en: "Birth of the hadith master Ibn Hajar al-Asqalani in Cairo, 773/1372"
  ur: "قاہرہ میں حافظ ابن حجر عسقلانی کی پیدائش، 773ھ/1372ء"
  fr: "La naissance du maître du hadith Ibn Hajar al-Asqalani au Caire, 773/1372"
  es: "Nacimiento del maestro de hadices Ibn Hajar al-Asqalani en El Cairo, 773/1"
  tr: "El-Hafız İbn Hacer El-Askalani'nin Kahire'de Doğumu, H. 773/MS 1372."
  id: "Kelahiran Al-Hafiz Ibnu Hajar Al-Asqalani di Kairo, 773 H/1372 M"
summary:
  ar: "وُلد شهاب الدين أبو الفضل أحمد بن علي بن محمد، المعروف بابن حجر العسقلاني، بمصر ثاني عشر شعبان سنة ٧٧٣هـ {cite:shadharat-dhahab p. 270}؛ وتعطي دائرة المعارف الإسلامية ٢٢ شعبان ٧٧٣هـ الموافق ٢٨ فبراير ١٣٧٢م. وتروي عائلته أن نسبته «العسقلاني» يعود إلى سنة ٥٨٧هـ/١١٩١م حين أمر صلاح الدين بهدم عسقلان ونقل أهلها، فسكن أجداده الإسكندرية ثم القاهرة {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}."
  en: "Shihab al-Din Abu al-Fadl Ahmad ibn Ali ibn Muhammad, known as Ibn Hajar al-Asqalani, was born in Cairo on 12 Sha'ban 773 {cite:shadharat-dhahab p. 270}; the Encyclopaedia of Islam gives 22 Sha'ban 773, corresponding to 28 February 1372. Family tradition traced his nisba al-Asqalani to 587/1191, when Saladin ordered Ascalon destroyed and its Muslim inhabitants resettled; his forebears moved to Alexandria and then to Cairo {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}."
  ur: "شہاب الدین ابوالفضل احمد بن علی بن محمد، المعروف ابن حجر عسقلانی، قاہرہ میں 12 شعبان 773ھ کو پیدا ہوئے {cite:shadharat-dhahab p. 270}؛ دائرۃ المعارفِ اسلامیہ 22 شعبان 773ھ یعنی 28 فروری 1372ء بتاتی ہے۔ خاندانی روایت کے مطابق ان کی نسبت «عسقلانی» سال 587ھ/1191ء سے جڑی ہے جب صلاح الدین نے عسقلان منہدم کر کے اس کے مسلمان باشندوں کو منتقل کیا؛ ان کے آبا و اجداد اسکندریہ اور پھر قاہرہ آ بسے {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}۔"
  fr: "Shihab al-Din Abu al-Fadl Ahmad ibn Ali ibn Muhammad, connu sous le nom d'Ibn Hajar al-Asqalani, naquit au Caire le 12 Sha'ban 773 {cite:shadharat-dhahab p. 270} ; l'Encyclopédie de l'Islam donne le 22 Sha'ban 773, soit le 28 février 1372. La tradition familiale faisait remonter sa nisba al-Asqalani à 587/1191, quand Saladin ordonna la destruction d'Ascalon et la réinstallation de ses habitants musulmans ; ses ancêtres partirent pour Alexandrie, puis pour Le Caire {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}."
  es: "Shihab al-Din Abu al-Fadl Ahmad ibn Ali ibn Muhammad, también conocido como Ibn Hajar al-Asqalani, nació en El Cairo el 12 de Sha'ban de 773 {cite:shadharat-dhahab p. 270}; la Enciclopedia del Islam indica el 22 de Sha'ban de 773, que corresponde al 28 de febrero de 1372. La tradición familiar sitúa su nisba al-Asqalani en 587/1191, cuando Saladino ordenó la destrucción de Ascalón y el reasentamiento de sus habitantes musulmanes; sus antepasados se trasladaron a Alejandría y luego a El Cairo {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}."
  tr: "İbn Hacer el-Askalani olarak bilinen Şihab el-Din Ebu el-Fadl Ahmed ibn Ali ibn Muhammed, Hicri 773 yılının Şaban ayının on ikinci gününde Mısır'da doğmuştur (kaynak: Şadharat-dhahab, s. 270); İslam Ansiklopedisi ise doğum tarihini Hicri 773 yılının Şaban ayının 22'si, yani Miladi 28 Şubat 1372 olarak vermektedir. Ailesi, \"el-Askalani\" soyadının Hicri 587/Miladi 1191 yılında Selahaddin Eyyubi'nin Askalon'un yıkılmasını ve sakinlerinin yer değiştirmesini emretmesiyle ortaya çıktığını, bu nedenle atalarının önce İskenderiye'ye, sonra da Kahire'ye yerleştiğini anlatmaktadır (kaynak: İslam Ansiklopedisi 2, cilt 3, s. 808)."
  id: "Shihab al-Din Abu al-Fadl Ahmad ibn Ali ibn Muhammad, yang dikenal sebagai Ibn Hajar al-Asqalani, lahir di Mesir pada tanggal 12 Sya'ban 773 H {cite:shadharat-dhahab hlm. 270}; Ensiklopedia Islam menyebutkan tanggal tersebut sebagai 22 Sya'ban 773 H, yang setara dengan 28 Februari 1372 M. Keluarganya menceritakan bahwa nama keluarganya \"al-Asqalani\" berasal dari tahun 587 H/1191 M ketika Saladin memerintahkan penghancuran Ascalon dan pemindahan penduduknya, sehingga leluhurnya menetap di Alexandria dan kemudian Kairo {cite:encyclopaedia-of-islam-2 vol. 3 hlm. 808}."
