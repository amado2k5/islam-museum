id: event/birth-ibn-hajar-773
class: event
kind: birth
label:
  ar: "ولادة الحافظ ابن حجر العسقلاني بالقاهرة، ٧٧٣هـ/١٣٧٢م"
  en: "Birth of the hadith master Ibn Hajar al-Asqalani in Cairo, 773/1372"
  ur: "قاہرہ میں حافظ ابن حجر عسقلانی کی پیدائش، 773ھ/1372ء"
summary:
  ar: "وُلد شهاب الدين أبو الفضل أحمد بن علي بن محمد، المعروف بابن حجر العسقلاني، بمصر ثاني عشر شعبان سنة ٧٧٣هـ {cite:shadharat-dhahab p. 270}؛ وتعطي دائرة المعارف الإسلامية ٢٢ شعبان ٧٧٣هـ الموافق ٢٨ فبراير ١٣٧٢م. وتروي عائلته أن نسبته «العسقلاني» يعود إلى سنة ٥٨٧هـ/١١٩١م حين أمر صلاح الدين بهدم عسقلان ونقل أهلها، فسكن أجداده الإسكندرية ثم القاهرة {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}."
  en: "Shihab al-Din Abu al-Fadl Ahmad ibn Ali ibn Muhammad, known as Ibn Hajar al-Asqalani, was born in Cairo on 12 Sha'ban 773 {cite:shadharat-dhahab p. 270}; the Encyclopaedia of Islam gives 22 Sha'ban 773, corresponding to 28 February 1372. Family tradition traced his nisba al-Asqalani to 587/1191, when Saladin ordered Ascalon destroyed and its Muslim inhabitants resettled; his forebears moved to Alexandria and then to Cairo {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}."
  ur: "شہاب الدین ابوالفضل احمد بن علی بن محمد، المعروف ابن حجر عسقلانی، قاہرہ میں 12 شعبان 773ھ کو پیدا ہوئے {cite:shadharat-dhahab p. 270}؛ دائرۃ المعارفِ اسلامیہ 22 شعبان 773ھ یعنی 28 فروری 1372ء بتاتی ہے۔ خاندانی روایت کے مطابق ان کی نسبت «عسقلانی» سال 587ھ/1191ء سے جڑی ہے جب صلاح الدین نے عسقلان منہدم کر کے اس کے مسلمان باشندوں کو منتقل کیا؛ ان کے آبا و اجداد اسکندریہ اور پھر قاہرہ آ بسے {cite:encyclopaedia-of-islam-2 vol. 3 p. 808}۔"
