summary:
  ar: "التقت الأنصار بعد يوم الجسر بالربيع وهو حائط في ناحية السفح فاقتتلوا قتالًا شديدًا حتى كاد يفني بعضهم بعضًا فانهزمت الأوس وتبعها الخزرج حتى بلغوا دورهم، وكانت سنتهم أن المنهزم إذا دخل دوره كُفّ عنه، فطلبت الأوس الصلح فامتنعت بنو النجار من الخزرج عن إجابتهم، فحصّنت الأوس النساء والذراري في الآطام ثم كفت عنهم الخزرج، وفيه يقول صخر بن سليمان البياضي ألا أبلغا عني سويد بن صامت بأنا قتلنا بالربيع سراتكم، وأجابه سويد بن الصامت فقد ذقت حرب الأوس فيها ابن الأسلت {cite:kamil-ibn-al-athir p. 504}."
  en: "After the day of the Bridge the Anṣār met at al-Rabīʿ, a garden on the hillside, and fought until they nearly annihilated each other; the Aws broke to their houses and the Khazraj followed to the doors — breaking the custom that pursuit stops at the walls. When the Aws sued for peace Banū'l-Najjār refused it, so the Aws put women and children in the strongholds before the Khazraj desisted. Ṣakhr ibn Sulaymān and Suwayd ibn al-Ṣāmit traded boasts over the day {cite:kamil-ibn-al-athir p. 504}."
  es: "Tras el día del Puente, los Anṣār se reunieron en al-Rabīʿ, un jardín en la ladera de la colina, y lucharon hasta casi aniquilarse mutuamente; los Aws huyeron a sus casas y los Khazraj los siguieron hasta las puertas, rompiendo la costumbre de que la persecución se detuviera en las murallas. Cuando los Aws pidieron la paz, Banū'l-Najjār se negó, por lo que los Aws refugiaron a mujeres y niños en las fortalezas antes de que los Khazraj desistieran. Ṣakhr ibn Sulaymān y Suwayd ibn al-Ṣāmit intercambiaron alardes sobre aquel día {cite:kamil-ibn-al-athir p. 504}."
  fr: "Après la bataille du Pont, les Anṣār se retrouvèrent à al-Rabīʿ, un jardin à flanc de colline, et s'affrontèrent jusqu'à presque s'anéantir. Les Aws se réfugièrent dans leurs maisons, poursuivis jusqu'aux portes, enfreignant ainsi la coutume qui voulait que la poursuite s'arrête aux murs. Lorsque les Aws demandèrent la paix, les Banū'l-Najjār la refusèrent. Les Aws mirent alors femmes et enfants à l'abri dans les forteresses avant que les Khazraj ne cessent le combat. Ṣakhr ibn Sulaymān et Suwayd ibn al-Ṣāmit échangèrent des vantardises à propos de cette journée (voir: Kamil-ibn-al-athir, p. 504)."
