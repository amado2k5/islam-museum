label: { ar: "غزو الحارث بن مرة القيقان ومقتله", en: "al-Harith ibn Murra's Qiqan Raid and Death", es: "Incursión y muerte de Qiqan de al-Harith ibn Murra", fr: "Raid et mort de Qiqan d'al-Harith ibn Murra", ur: "حارث بن مرہ کا ققان حملہ اور موت" }
summary:
  ar: "توجه إلى ثغر الهند الحارث بن مرة العبدي متطوعاً بإذن علي فظفر وأصاب مغنماً وسبياً وقسم في يوم واحد ألف رأس ثم إنه قتل ومن معه بأرض القيقان إلا قليلاً وكان مقتله في سنة ٤٢ والقيقان من بلاد السند مما يلي خراسان."
  en: "Al-Harith ibn Murra al-Abdi went as a volunteer to the Indian frontier with Ali's leave — took booty and captives, divided a thousand heads in one day — then was killed with nearly all his men in al-Qiqan in 42h, that land of Sind adjoining Khurasan."
  es: "Al-Harith ibn Murra al-Abdi fue como voluntario a la frontera india con el permiso de Ali, tomó botín y prisioneros, repartió mil cabezas en un día, y luego fue asesinado junto con casi todos sus hombres en al-Qiqan en el año 42, esa tierra de Sind contigua a Jorasán."
  fr: "Al-Harith ibn Murra al-Abdi partit comme volontaire à la frontière indienne avec la permission d'Ali — prit du butin et des captifs, partagea mille têtes en une journée — puis fut tué avec presque tous ses hommes à al-Qiqan en 42h, cette terre du Sind adjacente au Khorasan."
  ur: "الحارث بن مرہ العبدی رضا کار کے طور پر علی کی رخصت کے ساتھ ہندوستانی سرحد پر گیا - مال غنیمت اور قیدی لیا، ایک ہی دن میں ایک ہزار سر تقسیم کیے - پھر 42ھ میں الققان میں اپنے تقریباً تمام آدمیوں کے ساتھ مارا گیا، جو خراسان سے ملحقہ سندھ کی سرزمین ہے۔"
