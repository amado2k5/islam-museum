id: event/mutah-return-to-medina
class: event
kind: other
label: { ar: "عودة جيش مؤتة إلى المدينة وتلقي النبي لهم", en: "Return of the Mu'tah army to Medina and the Prophet's reception", es: "El regreso del ejército de Mu'tah a Medina y la recepción del Profeta", fr: "Retour de l'armée des Mu'tah à Médine et accueil du Prophète", ur: "متعہ کی فوج کی مدینہ واپسی اور رسول اللہ کا استقبال", tr: "Mu'tah'ın ordusu şehre döndü ve Peygamber onları karşıladı.", id: "Pasukan Mu'tah kembali ke kota dan Nabi menerima mereka." }
summary:
  ar: "لما دنا الجيش من المدينة خرج النبي والمسلمون لاستقباله، وجاء الصبيان يشتدون. طلب النبي ابن جعفر فأُتي بعبد الله فحمله بين يديه. وكان بعض الناس يحثون على الجيش التراب ويصيحون «يا فرار»، فردّ النبي: «ليسوا بالفرار ولكنهم الكرار إن شاء الله». وظل سلمة بن هشام محبوسًا في بيته خشية العار."
  en: "When the army neared Medina, the Prophet and Muslims went out to meet it; boys ran ahead. The Prophet asked for Ja'far's son and carried Abd Allah ibn Ja'far on his mount. Some people threw dust and called the army 'deserters'; the Prophet replied: 'They are not deserters; they are the ones who will charge again, God willing.' Salama ibn Hisham hid at home in shame."
  es: "Cuando el ejército se acercaba a Medina, el Profeta y los musulmanes salieron a su encuentro; los muchachos corrían delante. El Profeta pidió al hijo de Ja'far y llevó a Abd Allah ibn Ja'far en su montura. Algunos arrojaron polvo y llamaron al ejército «desertores»; el Profeta respondió: «No son desertores; son quienes volverán a atacar, si Dios quiere». Salama ibn Hisham se escondió en su casa avergonzado."
  fr: "Lorsque l'armée approcha de Médine, le Prophète et les musulmans sortirent à sa rencontre; des garçons couraient en avant. Le Prophète demanda le fils de Ja'far et emmena Abd Allah ibn Ja'far sur sa monture. Certains jetèrent de la poussière et traitèrent l'armée de « déserteurs »; le Prophète répondit: « Ce ne sont pas des déserteurs; ce sont ceux qui chargeront de nouveau, si Dieu le veut. » Salama ibn Hisham se cacha chez lui, honteux."
  ur: "جب لشکر مدینہ کے قریب پہنچا تو رسول اللہ اور مسلمان اس سے ملنے کے لیے نکلے۔ لڑکے آگے بھاگے۔ نبی نے جعفر کے بیٹے کو طلب کیا اور عبداللہ بن جعفر کو اپنی سواری پر بٹھایا۔ کچھ لوگوں نے مٹی پھینکی اور فوج کو 'بیگانہ' کہا۔ نبی نے جواب دیا: 'وہ چھوڑنے والے نہیں ہیں۔ وہ وہی ہیں جو دوبارہ چارج کریں گے، انشاء اللہ۔' سلمہ بن ہشام شرم سے گھر میں چھپ گئے۔"
  tr: "Ordu şehre yaklaşınca, Peygamber ve Müslümanlar onları karşılamak için dışarı çıktılar ve çocuklar koşarak geldiler. Peygamber İbn Cafer'i çağırdı ve Abdullah ona getirildi, Peygamber onu kucağına aldı. Bazıları orduya toz atıyor ve \"Siz firariler!\" diye bağırıyordu. Peygamber, \"Onlar firari değiller, aksine Allah'ın izniyle savaşa geri dönecekler\" diye cevap verdi. Salama ibn Hişam, rezil olmaktan korkarak evine kapandı."
  id: "Ketika pasukan mendekati kota, Nabi dan kaum Muslimin keluar untuk menemui mereka, dan anak-anak berlarian. Nabi menanyakan Ibnu Ja'far, dan Abdullah dibawa kepadanya, lalu beliau menggendongnya. Beberapa orang melemparkan debu ke arah pasukan dan berteriak, \"Kalian para pembelot!\" Nabi menjawab, \"Mereka bukanlah pembelot, tetapi, insya Allah, mereka akan kembali berperang.\" Salama bin Hisham tetap tinggal di rumahnya karena takut dipermalukan."
