label: { ar: "عودة جيش مؤتة إلى المدينة وتلقي النبي لهم", en: "Return of the Mu'tah army to Medina and the Prophet's reception" }
summary:
  ar: "لما دنا الجيش من المدينة خرج النبي والمسلمون لاستقباله، وجاء الصبيان يشتدون. طلب النبي ابن جعفر فأُتي بعبد الله فحمله بين يديه. وكان بعض الناس يحثون على الجيش التراب ويصيحون «يا فرار»، فردّ النبي: «ليسوا بالفرار ولكنهم الكرار إن شاء الله». وظل سلمة بن هشام محبوسًا في بيته خشية العار."
  en: "When the army neared Medina, the Prophet and Muslims went out to meet it; boys ran ahead. The Prophet asked for Ja'far's son and carried Abd Allah ibn Ja'far on his mount. Some people threw dust and called the army 'deserters'; the Prophet replied: 'They are not deserters; they are the ones who will charge again, God willing.' Salama ibn Hisham hid at home in shame."
