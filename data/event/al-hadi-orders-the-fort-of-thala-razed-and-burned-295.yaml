id: event/al-hadi-orders-the-fort-of-thala-razed-and-burned-295
class: event
kind: other
label:
  ar: "الهادي يأمر بهدم حصن ثلا لبني الحارث وتحريقه، سنة 295هـ، ص355"
  en: "Al-Hadi orders the Banu al-Harith fort of Thala razed and burned, 295 AH, p. 355"
  ur: "ہادی کا بنو حارث کے قلعے ثلا کو ڈھانے اور جلانے کا حکم، 295ھ، ص355"
  es: "Al-Hadi ordena arrasar y quemar la fortaleza de Banu al-Harith en Thala, 295 AH, pág. 355."
  fr: "Al-Hadi ordonne la destruction et l'incendie du fort de Thala appartenant aux Banu al-Harith, 295 AH, p. 355"
  tr: "Al-Hadi, Hicri 295 yılında Beni el-Harith'e ait olan Thula kalesinin yıkılıp yakılmasını emretmiştir (s. 355)."
  id: "Al-Hadi memerintahkan penghancuran dan pembakaran benteng Thula milik Bani al-Harith, pada tahun 295 H, hlm. 355"
summary:
  ar: "نزل الهادي قرب حصن لبني الحارث يقال له ثلا، فأمر بهدمه وتحريقه، وبات تلك الليلة قريباً منه."
  en: "Al-Hadi came close to a Banu al-Harith fort called Thala and ordered it pulled down and burned. He spent that night nearby."
  ur: "ہادی بنو حارث کے ایک قلعے ثلا کے قریب پہنچے، اسے ڈھانے اور جلانے کا حکم دیا، اور اس رات قریب ہی ٹھہرے۔"
  es: "Al-Hadi se acercó a una fortaleza de Banu al-Harith llamada Thala y ordenó que la demolieran y la incendiaran. Pasó la noche en las cercanías."
  fr: "Al-Hadi s'approcha d'un fort des Banu al-Harith appelé Thala et ordonna sa destruction et son incendie. Il passa la nuit à proximité."
  tr: "El-Hadi, Beni el-Harith'e ait Thula adlı bir kalenin yakınlarında kamp kurdu, bu yüzden kalenin yıkılıp yakılmasını emretti ve o geceyi kalenin yakınında geçirdi."
  id: "Al-Hadi berkemah di dekat benteng milik Bani al-Harith yang bernama Thula, lalu ia memerintahkan benteng itu dihancurkan dan dibakar, dan ia bermalam di dekatnya."
