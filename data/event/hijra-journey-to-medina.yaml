label: { ar: "رحلة الهجرة من غار ثور إلى المدينة ودخولها", en: "The journey from the cave of Thawr to Medina and the entry into the city" }
summary:
  ar: "خرج النبي وأبو بكر من الغار مع الدليل عبد الله بن أريقط وعامر بن فهيرة على طريق الساحل، ومرّا بخيمة أم معبد، ولحقهما سراقة بن مالك فساخت فرسه في الأرض فطلب الأمان، ثم نزلا بقباء يوم الإثنين الثامن من ربيع الأول، ومكث بها أربعة أيام، ثم دخل المدينة يوم الجمعة."
  en: "The Prophet and Abu Bakr left the cave with the guide Abdullah ibn Uraykit and Amir ibn Fuhayra by the coast road; they passed the tent of Umm Ma'bad, Suraqa ibn Malik pursued them and his horse sank into the ground so that he asked for safe-conduct; they reached Quba on Monday 8 Rabi' I and stayed four days, then entered Medina on Friday."
