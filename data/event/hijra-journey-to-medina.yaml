label: { ar: "رحلة الهجرة من غار ثور إلى المدينة ودخولها", en: "The journey from the cave of Thawr to Medina and the entry into the city", es: "El viaje desde la cueva de Thawr hasta Medina y la entrada a la ciudad.", fr: "Le voyage de la grotte de Thawr à Médine et l'entrée dans la ville", ur: "غار ثور سے مدینہ تک کا سفر اور شہر میں داخل ہونا", tr: "Thawr mağarasından Medine'ye göç yolculuğu ve Medine'ye giriş.", id: "Perjalanan migrasi dari gua Thawr ke Madinah dan masuknya ke sana" }
summary:
  ar: "خرج النبي وأبو بكر من الغار مع الدليل عبد الله بن أريقط وعامر بن فهيرة على طريق الساحل، ومرّا بخيمة أم معبد، ولحقهما سراقة بن مالك فساخت فرسه في الأرض فطلب الأمان، ثم نزلا بقباء يوم الإثنين الثامن من ربيع الأول، ومكث بها أربعة أيام، ثم دخل المدينة يوم الجمعة."
  en: "The Prophet and Abu Bakr left the cave with the guide Abdullah ibn Uraykit and Amir ibn Fuhayra by the coast road; they passed the tent of Umm Ma'bad, Suraqa ibn Malik pursued them and his horse sank into the ground so that he asked for safe-conduct; they reached Quba on Monday 8 Rabi' I and stayed four days, then entered Medina on Friday."
  es: "El Profeta y Abu Bakr salieron de la cueva con el guía Abdullah ibn Uraykit y Amir ibn Fuhayra por el camino de la costa; pasaron por la tienda de Umm Ma'bad, Suraqa ibn Malik los persiguió y su caballo se hundió en el suelo, por lo que pidió salvoconducto; llegaron a Quba el lunes 8 de Rabi' I y permanecieron allí cuatro días, luego entraron en Medina el viernes."
  fr: "Le Prophète et Abou Bakr quittèrent la grotte avec le guide Abdullah ibn Uraykit et Amir ibn Fuhayra par la route côtière; ils passèrent devant la tente d'Umm Ma'bad, Suraqa ibn Malik les poursuivit et son cheval s'enfonça dans le sol, si bien qu'il demanda un sauf-conduit; ils atteignirent Quba le lundi 8 Rabi' I et y restèrent quatre jours, puis entrèrent à Médine le vendredi."
  ur: "نبی اور ابوبکر گائیڈ عبداللہ ابن عریقیت اور عامر بن فہیرہ کے ساتھ ساحلی راستے سے غار سے نکلے۔ وہ ام معبد کے خیمے کے پاس سے گزرے، سراقہ بن مالک نے ان کا تعاقب کیا اور اس کا گھوڑا زمین میں دھنس گیا تاکہ اس نے حفاظت کی درخواست کی۔ وہ پیر 8 ربیع الاول کو قبا پہنچے اور چار دن قیام کیا پھر جمعہ کے دن مدینہ میں داخل ہوئے۔"
  tr: "Peygamber ve Ebu Bekir, rehberleri Abdullah bin Uraykit ve Amer bin Fuhayra ile birlikte kıyı yolundan mağaradan ayrıldılar ve Ümmü Ma'bed'in çadırının yanından geçtiler. Süraka bin Malik onlara yetişti, ancak atı toprağa saplandı. Bunun üzerine güvenli bir yer istediler. Daha sonra, Rebiü'l-Evvel ayının sekizinci günü olan Pazartesi günü Kuba'da durdular ve dört gün orada kaldılar. Cuma günü ise şehre girdiler."
  id: "Nabi dan Abu Bakar meninggalkan gua bersama pemandu Abdullah bin Urayqit dan Amer bin Fuhayra di jalan pesisir, dan mereka melewati tenda Umm Ma’bad, lalu Suraqa bin Malik menyusul mereka, dan kudanya terperosok ke dalam tanah, sehingga ia meminta perlindungan, kemudian mereka berhenti di Quba pada hari Senin, tanggal 8 Rabi’ al-Awwal, dan tinggal di sana selama empat hari, lalu beliau memasuki kota itu pada hari Jumat."
