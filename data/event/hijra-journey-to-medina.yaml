id: event/hijra-journey-to-medina
education:
  did_you_know:
    ar: "خرج النبي وأبو بكر من الغار مع الدليل ابن أريقط وعامر بن فهيرة على طريق الساحل، ومرّا بأم معبد، ولحقهما سراقة فساخت فرسه فطلب الأمان، ونزلا قباء يوم الإثنين."
    en: "The Prophet and Abu Bakr left the cave with guide Ibn Urayqit along the coast, passed Umm Ma'bad's tent, and when Suraqa caught up his mare sank — they reached Quba' on Monday."
    ur: "نبی اور ابوبکر غار سے رہنما ابن اریقت کے ساتھ ساحل کے راستے نکلے، ام معبد کے ڈیرے سے گذرے، سراقہ کی گھوڑی دھنس گئی — پیر کو قباء پہنچے۔"
    sources: [source/mubarakpuri-raheeq, source/ibn-hisham-sira]
