label: { ar: "رحلة الهجرة من غار ثور إلى المدينة ودخولها", en: "The journey from the cave of Thawr to Medina and the entry into the city", es: "El viaje desde la cueva de Thawr hasta Medina y la entrada a la ciudad.", fr: "Le voyage de la grotte de Thawr à Médine et l'entrée dans la ville" }
summary:
  ar: "خرج النبي وأبو بكر من الغار مع الدليل عبد الله بن أريقط وعامر بن فهيرة على طريق الساحل، ومرّا بخيمة أم معبد، ولحقهما سراقة بن مالك فساخت فرسه في الأرض فطلب الأمان، ثم نزلا بقباء يوم الإثنين الثامن من ربيع الأول، ومكث بها أربعة أيام، ثم دخل المدينة يوم الجمعة."
  en: "The Prophet and Abu Bakr left the cave with the guide Abdullah ibn Uraykit and Amir ibn Fuhayra by the coast road; they passed the tent of Umm Ma'bad, Suraqa ibn Malik pursued them and his horse sank into the ground so that he asked for safe-conduct; they reached Quba on Monday 8 Rabi' I and stayed four days, then entered Medina on Friday."
  es: "El Profeta y Abu Bakr salieron de la cueva con el guía Abdullah ibn Uraykit y Amir ibn Fuhayra por el camino de la costa; pasaron por la tienda de Umm Ma'bad, Suraqa ibn Malik los persiguió y su caballo se hundió en el suelo, por lo que pidió salvoconducto; llegaron a Quba el lunes 8 de Rabi' I y permanecieron allí cuatro días, luego entraron en Medina el viernes."
  fr: "Le Prophète et Abou Bakr quittèrent la grotte avec le guide Abdullah ibn Uraykit et Amir ibn Fuhayra par la route côtière; ils passèrent devant la tente d'Umm Ma'bad, Suraqa ibn Malik les poursuivit et son cheval s'enfonça dans le sol, si bien qu'il demanda un sauf-conduit; ils atteignirent Quba le lundi 8 Rabi' I et y restèrent quatre jours, puis entrèrent à Médine le vendredi."
